 PAR.1.t: "Abdo in Wonderland"
 PAR.1.d: "It had been a long and exhausting day for President Bolsonaro - another twenty-four hours consumed by meetings with ministers, press conferences, and endless interviews, all because of the Arabs. For the president, this meeting initially seemed like just another entry in the endless chain of appointments that had already filled his schedule, at least until he remembered who exactly was waiting for him: Mario Abdo Benítez, the President of Paraguay. Then again, it was only Paraguay - what could Bolsonaro really expect from him?\n\nA series of handshakes followed, then a few carefully staged photographs of the two presidents smiling for the cameras, before the meeting finally moved on to its real purpose. Both men sat down in a small reception room, and after exchanging a few formalities, the conversation shifted toward the reason for the Paraguayan president's visit.\n\n\"Mr. President, I would like to discuss… cooperation between our countries during this energy crisis,\" Abdo began, though his voice sounded uncertain even to Bolsonaro. \"Paraguay urgently needs foreign assistance to deal with the consequences of the oil crisis,\" the Paraguayan president continued, immediately provoking a question in Bolsonaro's mind: why had he not gone to his patrons in Argentina for help instead? Still, Bolsonaro chose not to say it aloud.\n\n\"Paraguay is prepared to reconsider its geopolitical position,\" Abdo added carefully, \"or rather, reconsider who truly is - and is not - a friend of Paraguay.\" The moment Bolsonaro heard those words, a spark appeared in his eyes. Weakening Argentina's influence in South America - and especially in Paraguay - would be a major victory for Brazil and for Bolsonaro personally. It was an opportunity, a massive opportunity, and one that demanded careful consideration.\n\nYet Brazil itself was struggling through the crisis, and diverting precious resources abroad would almost certainly infuriate the nationalist base that supported Bolsonaro. Even so, the scale of any potential aid would have to be decided now."
 PAR.1.a: "Brazil is ready to begin comprehensive cooperation with you, Mr. President."
 PAR.1.b: "We are ready to partially help you in dealing with the consequences, Mr. President."
 PAR.1.c: "We're willing to provide you with a very... small amount of assistance. Brazil itself isn't in the best of shape, Mr. President."
 PAR.1.e: "Our agreements could go beyond relief measures, Mr. President. Perhaps it is the time to deepen our regional integration."
 PAR.1.f: "Our refineries are open to business, Mr. President. I'm sure you'll be naming your fair price."