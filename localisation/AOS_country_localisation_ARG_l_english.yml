#patchs-presentacion:
ARG_GATHERING_STORM_DESC2: "Long regarded as a nation destined for greatness, it seemed that history had other plans for Argentina. Years of inflation and debt were followed by political instability, gradually eroding confidence and limiting the nation's growth.\n\nArgentina would then seek stability with the election of Alberto Fernández in 2019, but after several years it seems the country remains adrift with no clear strategy in place. If Argentina is to fulfill its true potential it must choose a path forward, or risk being left behind by history."
ARG_country_summary: "§YCountry Summary§!:\nWhen Jose de San Martin fought Spain for the independence of the Rio de la Plata, when the Argentine Confederation first raised its flag, no one could have imagined how a nation destined to become the heart of a continent would fall into such decline.\nNo one foresaw that in 1944, General Juan Domingo Peron would emerge from the ranks of the military and forever reshape the course of Argentine history. Nor could they have foreseen that in 1955, the army would overthrow him in the name of democracy—only for that same democracy to collapse again and again, from the removal of Arturo Frondizi in 1962 and the brief presidency of Jose Maria Guido, to the downfall of Arturo Illia under General Juan Carlos Ongania. No one foresaw Peron return in 1974, or that his widow would be toppled by the military two years later. No one foresaw the defeat of 1982, the collapse of 2001, the long years of disillusionment and inflation. And still today, no one knows whether Argentina will ever rise again to reclaim the greatness that once seemed written in its destiny."
ARG_country_paths: "\n\n§YCountry Paths§!:\n - §CUnion por la Patria - Partido Justicialista§!\n - §1La Libertad Avanza - Partido Libertario§!\n - §BJuntos por el Cambio - Republicanos Unidos§!\n - §YHacemos por Nuestro País - Peronismo Federal§!"
ARG_country_other: "§YTips and Tricks:§!\n - The tango never ends, it only changes partners.\n - Reflect and choose your candidate wisely.\n - §G“The future does not belong to the weak, nor to those who fear their destiny.”§! — §YJosé de San Martín§!"
#Ideology
ARG_reformist_socialism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_Kirchnerism \n\n\n\n\n\n §Y\"Kirchnerism\"§!, is an ideology developed by the Kirchners beginning in the 2000s, particularly during the presidency of Néstor Kirchner. It draws on Peronist influences and certain ideas associated with the militant movements of the 1970s. It advocates for a larger role for the state, economic protectionism, Argentine patriotism, and a strong emphasis on national identity. It also supports the defense of workers' rights and labor unions through democratic institutions. In addition, it incorporates progressive elements, such as the expansion of social welfare programs and state intervention aimed at reducing poverty.\n\nTo some extent, it also embraces ideas associated with liberation theology, support for social and immigrant minorities, improvements to the agricultural sector, and the revitalization of rural communities, while promoting democratic participation in those areas and environmental protection. All of this is typically accompanied by a strong populist component and a deep identification with the Kirchners, who are portrayed by their supporters as the central figures of the political project and as the heirs to the legacy of Juan Domingo Perón, with the goal of eradicating poverty and strengthening the rights of Argentine workers in the face of corporate power."
institutionalized_despotism: "Institutionalized Despotism"
institutionalized_despotism_desc: "A person touching down in a country such as this might look at the assorted trappings of liberal democracy it keeps around and conclude that the government is democratic—but they could not be further from the truth. Far from pursuing democracy, Institutional Despotism aims to create and maintain a 'Perfect Dictatorship' that successfully convinces people they are not, in fact, in a dictatorship. As the new decade dawns, the most obvious case of this is the PRI rule in Mexico.\n\nIn this state, institutions are all controlled and subverted by a single, incredibly-entrenched oligarchical party or other such group occupying the political bureaucracy. Meanwhile, the government has dictatorial powers to enforce its will, powers enshrined in laws that give the state massive oversight and the faculties to intervene anywhere it pleases. Furthermore, even most of the organized opposition is likely directly controlled by, or a satellite of, the ruling party to give an illusion of political pluralism. Therefore, it is impossible to imagine their displacement from power without an immense broad-front effort directed specifically toward that goal. Every action, inaction, use, and abuse is justified by a single unified goal or purpose inseparably tied to the ruling group or ideology—no matter how vague or logically incoherent said goal may become. The result is a despotism institutionalized and camouflaged, and a national ideology and civil society forced to revolve around an abstract goal absorbing everything that it touches—which is very frequently used to justify the self-interest of the political oligarchy that sits at its head."
ARG_institutionalized_despotism_desc: "A person touching down in a country such as this might look at the assorted trappings of liberal democracy it keeps around and conclude that the government is democratic—but they could not be further from the truth. Far from pursuing democracy, Institutional Despotism aims to create and maintain a 'Perfect Dictatorship' that successfully convinces people they are not, in fact, in a dictatorship. As the new decade dawns, the most obvious case of this is the PRI rule in Mexico.\n\nIn this state, institutions are all controlled and subverted by a single, incredibly-entrenched oligarchical party or other such group occupying the political bureaucracy. Meanwhile, the government has dictatorial powers to enforce its will, powers enshrined in laws that give the state massive oversight and the faculties to intervene anywhere it pleases. Furthermore, even most of the organized opposition is likely directly controlled by, or a satellite of, the ruling party to give an illusion of political pluralism. Therefore, it is impossible to imagine their displacement from power without an immense broad-front effort directed specifically toward that goal. Every action, inaction, use, and abuse is justified by a single unified goal or purpose inseparably tied to the ruling group or ideology—no matter how vague or logically incoherent said goal may become. The result is a despotism institutionalized and camouflaged, and a national ideology and civil society forced to revolve around an abstract goal absorbing everything that it touches—which is very frequently used to justify the self-interest of the political oligarchy that sits at its head."
#Ideas
ARG_opposition_popularity_dynamic: "§YOpposition Popularity§! Modifiers"
ARG_great_pampas: "The Great Pampas"
ARG_great_pampas_desc: "\n\n\n\n  £GFX_texticons_ARG_pampas_argentinas \n\n\n\n\n\nMany people wonder how Argentina has survived despite all the crises. The answer is simple: agriculture. The vast farms of the Pampas generate incredible income for Argentina, particularly through soy products, which contribute between 3% and 5% of the country's budget revenue. Farmers have saved Argentina during every economic crisis, preventing the nation from complete collapse. The economy and the people owe a debt of gratitude to these farmers, whose hard work keeps Argentina alive even amid monetary turmoil. Despite high taxes and challenging conditions, they continue to produce essential goods, sustaining a country that is not fully industrialized and has even experienced deindustrialization at times. Farmers deserve greater recognition and privileges, because if neglected, they may eventually turn away from the nation that depends so heavily on their labor."
ARG_argentinean_peso: "The Argentinean Peso"
ARG_argentinean_peso_desc: "\n\n\n\n  £GFX_texticons_ARG_peso_argentino \n\n\n\n\n\nThe 1930s marked the creation of the Central Bank of Argentina. Since then, the Argentine peso has undergone numerous changes, transforming from the peso nacional to the peso ley, then to the Argentine peso, followed by the austral, and finally back to the Argentine peso. The currency has been altered more times than one can count: Peronists, Radicals, the military, Menemists, Kirchnerists, and Macri have all attempted reforms. Frequent money issuance and unpaid debts resulting from large-scale fiscal adjustments have further undermined its stability. Today, the peso is one of the most altered currencies in the Southern Cone, with multiple devaluations and zeros removed over the decades. It is widely distrusted; few people want to buy or trade it, leaving it largely isolated for domestic use only. If this situation is not addressed, the monetary crisis will persist, devaluations will continue, and inflation could surpass 35%. The Argentine peso must be stabilized, or Argentina risks economic collapse or full dependence on foreign currencies."
ARG_syndicalist_mafia: "Syndicalist Mafia"
ARG_syndicalist_mafia_desc: "Argentina has been a country of the people since its earliest days. Under Juan Domingo Peron, Argentina built one of the most exemplary trade union movements in all of the Western world. However, over time, the greatest left-Peronist trade unionists perished, replaced by bureaucrats who fundamentally transformed the unions. The arrival of bureaucracy turned trade unions from defenders of ordinary workers into a virtual hired mafia. Today, union leaders wield colossal political power, obeying only when economic benefits or subsidies are provided, and their personal wealth often raises questions about whether they truly care about the workers. Trade unions have lost their original purpose, acting more as self-serving organizations that sometimes oppose the state and the current government. This syndicalist machine has become another systemic tumor in Argentina, one that threatens the nation if left unchecked—the only question remaining is when decisive action will be taken."
ARG_sinecure_nation: "Sinecure Nation"
ARG_sinecure_nation_desc: "The problem of lazy workers who do nothing has plagued Argentina for a long time. For years, the Argentine government hired many people for positions that used to be genuinely useful, but over time became meaningless jobs that do not require real work. Yet, Argentines continue to occupy these positions in the public sector, and the state seems powerless to change the situation. The situation has become absurd: most public sector employees no longer wish to work, focusing instead on enjoying privileges and receiving high salaries for literally doing nothing, as seen, for example, among civil servants who simply make photocopies. This problem is deeply rooted and persistent. It inflates the national budget, diminishes the work ethic of the population, and creates a culture of entitlement. It is one of Argentina's systemic tumors, and unless it is addressed and eliminated, the nation risks a complete erosion of productivity and responsibility among its people."
ARG_bloated_social_welfare: "Inflated Social Assistance"
ARG_bloated_social_welfare_desc: "The idea of a welfare state became a symbol of Argentina after Juan Domingo Peron came to power, as he began creating a range of social assistance programs to lift thousands of families out of poverty. At first, these programs worked successfully, but over time they became increasingly bloated, providing little benefit to the state. When crises emerged, Argentina had to print large amounts of money and take reckless loans to fund welfare programs. Many families became dependent on these benefits and struggled to survive without them, which made discussions of reform or adjustment politically sensitive, as (Argentina cannot abandon its people.) Unfortunately, both Kirchnerists and Radicals continue to support this expansive system, which shows no signs of slowing down, further destabilizing the economy. Soon, the welfare machine may become impossible to control, and economic problems will affect everyone, not just those relying on aid."
ARG_desarme_militar: "Never again"
ARG_desarme_militar_desc: "\n\n\n\n  £GFX_texticons_ARG_nunca_mas \n\n\n\n\n\nSince the war for the Malvinas - our bitter defeat in the struggle to reclaim Argentina's traditional lands - we chose a path of complete disarmament. Under President Raúl Alfonsín, capable generals were prosecuted, the army's budget was cut in half, and every modernization project for tanks, aircraft, and naval forces was suspended. Later, under Carlos Menem, in the name of loyalty to the West, defense programs were dismantled, and the FMA was sold into private hands. After the devastating economic collapse of 2001, military spending dropped below one percent of GDP, and the army's combat readiness dissolved together with its submarine fleet. Even during the Kirchners' era and under Mauricio Macri, populist promises echoed about rebuilding national defense, yet almost nothing materialized. Today, our army continues to fade - disarmed not by enemies, but by fear of its own past, by the solemn vow that 1976 must never return, that military terror shall happen never again."
