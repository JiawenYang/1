ARG_military_disarmament_idea_0: "Never Again" # Argentinian military disarmament
ARG_military_disarmament_idea_0_desc: "\n\n\n\n  £GFX_texticons_ARG_nunca_mas \n\n\n\n\n\nSince the war for the Malvinas - our bitter defeat in the struggle to reclaim Argentina's traditional lands - we chose a path of complete disarmament. Under President Raúl Alfonsín, capable generals were prosecuted, the army's budget was cut in half, and every modernization project for tanks, aircraft, and naval forces was suspended. Later, under Carlos Menem, in the name of loyalty to the West, defense programs were dismantled, and the FMA was sold into private hands. After the devastating economic collapse of 2001, military spending dropped below one percent of GDP, and the army's combat readiness dissolved together with its submarine fleet. Even during the Kirchners' era and under Mauricio Macri, populist promises echoed about rebuilding national defense, yet almost nothing materialized. Today, our army continues to fade - disarmed not by enemies, but by fear of its own past, by the solemn vow that 1976 must never return, that military terror shall happen never again."
