ARG_news_argentinas.1.title: "Return of the Cacerolazo"
ARG_news_argentinas.1.desc: "The patience of the Argentine public has worn thin, as people have once again taken to the streets, banging their pots in anger. What initially began as a strict, necessary quarantine in Buenos Aires has, after 300 total days, mutated into what the opposition calls a perpetual lockdown with no clear plan. President Alberto Fernández insists the restrictions are science-based, but citizens point out the irony of officials attending private parties while they themselves are barred from visiting family.\n\nOn social media, the hashtag #SeAcabó (Enough is enough) is trending, with people from all walks of life joining the marches. Everyone from democratic socialists to libertarians and anarchists has come out in protest, as well as far-right demonstrators using symbols such as the Cross of Burgundy to show their opposition to the government. Small business owners, who have endured debt and inflation, are now simply opening their shutters again, daring the police to close them, while the middle class, when they are not out in the streets protesting, bang their pots from their balconies.\n\nNo matter their political background, the message throughout Argentine cities is crystal clear: open the schools, allow commerce to return, and end the lockdowns. With pressure mounting on the Casa Rosada, the opposition senses an opportunity, as they threaten President Fernándezs hold on power.\n\n."
ARG_news_argentinas.1.a: "The virus doesn't take a holiday, but shouldn't we listen to the people?"
ARG_news.1.t: "Diego Maradona has died at the age of 60!"
ARG_news.1.d: "In an event that shocked the world of sports and millions of fans, Diego Armando Maradona died at his residence in the province of Buenos Aires. The legendary former Argentine footballer, considered one of the greatest players in the history of football, died after suffering a cardiorespiratory arrest, according to local media and health authorities.\n\n His sudden death generated an immediate wave of reactions around the world. From political leaders to international sports figures expressed their regret and highlighted his impact on and off the court.\n\nThe Argentine government decreed three days of national mourning, and thousands of people gathered to say goodbye to him in a ceremony held at the Casa Rosada. The images of crowds, white T-shirts and messages of gratitude reflected the deep imprint he left on the sports and cultural identity of Argentina."
ARG_news_argentinas.2.a: "Eternal in the memory of football!"
