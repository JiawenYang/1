ARG_exec_powers_loc_key: "All Powers to Milei"
ARG_exec_powers_desc_loc_key: "Milei is a leader capable of achieving remarkable things with very limited resources...\nWhat would happen if we gave him so much power that he could transform the country according to his own vision?\nIf we empower the executive branch in his crusade to stop the political “caste,” we could try to erase the legacy of corruption in a single administration. All it takes is to 'convince' Congress to vote in favor of granting more powers to Milei, using the context that \"there is a threat in the north.\"\nLike in the \"phantom threat\", you know?"
