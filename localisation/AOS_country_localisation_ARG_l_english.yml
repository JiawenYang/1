ARG_grieta_politica_loc_key: "The Political Crack"
ARG_grieta_politica_desc_loc_key: "For years, decades, or even, if you want to call it, “centuries,” Argentina has been divided among different groups of people who have done nothing but harm our nation, and especially our people. Families have been torn apart by political arguments, couples by ideological differences, and there have even been cases of violence against others for holding a different worldview.\nYour mission is to put an end to conspiracy, driven thinking so that misinformation in this country can disappear. It won’t be easy, media outlets, politicians, celebrities, and even people close to us spread misinformation to generate fear or rejection toward less traditional ideologies in Argentina."
