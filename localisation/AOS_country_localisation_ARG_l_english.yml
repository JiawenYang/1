ARG_referendum_loc_key: "Referendum"
ARG_referendum_desc_loc_key: "Javier Milei knows that inside Congress he has plenty of enemies, PRO militants, \"kukas,\" and old radicals, who only want to make his life difficult. That is why, as President of the nation, Javier can pass his laws through popular support, thanks to the people and the government's referendum mechanism.\nIn times of crisis, the people know what to decide."
