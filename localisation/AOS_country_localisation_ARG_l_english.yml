#Ideologies Milei
ARG_classical_liberalism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_classical_liberalism \n\n\n\n\n\n §YMileist liberalism§! is a political ideology advocated by Javier Milei and his supporters, based on the defense of individual liberties, private property, and economic freedom, with a particular emphasis on reducing the size and functions of the state. It is primarily inspired by the ideas of the Austrian School of Economics, especially authors such as Ludwig von Mises and Friedrich Hayek, as well as ideas from the classical liberal and libertarian traditions.\n\nMileism maintains that state intervention and excessive public spending are among the main causes of Argentina's economic decline. For this reason, it advocates for a free-market economy, lower taxes, deregulation, and strict limitations on the state's power over economic activity. It also incorporates ideas related to the defense of individual rights, private property, and freedom as fundamental principles of society."

ARG_right_populism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_populist_mileism \n\n\n\n\n\n §YPopulist mileism§! is an ideology promoted by movements aligned with Javier Milei and his government. It combines strong right-wing populism with elements of right-wing anti-globalism, national conservatism, and economic liberalism. In some respects, it resembles Menemism in the 1990s: a charismatic leader, sweeping economic reforms, and the promise of breaking with the existing political order.\n\nHowever, Mileism is far more confrontational. Milei portrays the traditional political class, the left, and much of the state as part of a system responsible for Argentina's decline. Through this rhetoric, he seeks to transform social discontent into a permanent political force, opposing a supposedly privileged 'caste' to a population that has suffered from decades of bad policies.\n\nThe goal is not merely to win elections, but to reshape Argentina's political landscape. By mobilizing popular support and building an intellectual base around La Libertad Avanza, Mileism seeks to turn support for Milei into a lasting political identity centered on loyalty to the leader, opposition to the 'caste,' and the promise of an economic and cultural revolution."

ARG_right_libertarianism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_libertarian_mileism \n\n\n\n\n\n §YLibertarian Mileism§! is an ideology promoted by movements aligned with Javier Milei and his government. It advocates for the free market, private property, individual rights, and a reduction in the size and functions of the state. Its supporters generally promote a radical rollback of the welfare state and greater protection of so-called negative rights, based on individual freedom and the non-interference of the state.\n\nThis philosophy draws inspiration from laissez-faire economics and principles such as self-ownership and the labor theory of property, which hold that individuals have rights over their own bodies, their labor, and the fruits derived from it. From this perspective, state intervention should be reduced to the absolute minimum possible.\n\nIn the political sphere, Milei argues that Argentina must protect itself from what he considers the evils of the left. For this reason, Mileism would seek to progressively reduce its influence in Argentine politics through an organic shift in public opinion, strengthening social support for the political right and consolidating La Libertad Avanza as the leading force behind this movement."

ARG_civic_nationalism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_pragmatic_mileism \n\n\n\n\n\n §YPragmatic Mileism§! is a philosophy of government that combines Mileist principles with contemporary strategies that do not necessarily follow a strict ideological doctrine. Rather than applying Mileist ideas rigidly, it relies on experts and reformers willing to adapt public policy to the country's specific circumstances.\n\nUnlike more doctrinaire currents, pragmatic Mileists tend to prioritize practical compromises with social-democratic sectors, moderate groups, and even movements that support certain elements of social justice. This flexibility may lead them to partially abandon economic libertarianism or retain only some of its fundamental principles.\n\nIn certain cases, these ideas can also become a tool for political populism. By adapting Mileist principles to the concrete needs of the population, pragmatism allows the defense of economic freedom and a smaller state to be presented not merely as an ideological issue, but as a direct response to the everyday problems of the people."

