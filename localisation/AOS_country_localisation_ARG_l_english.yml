ARG_argentinean_peso_idea_0: "Argentinian Peso"
ARG_argentinean_peso_idea_0_desc: "\n\n\n\n  £GFX_texticons_ARG_peso_argentino \n\n\n\n\n\nThe 1930s marked the creation of the Central Bank of Argentina. Since then, the Argentine peso has undergone numerous changes, transforming from the peso nacional to the peso ley, then to the Argentine peso, followed by the austral, and finally back to the Argentine peso. The currency has been altered more times than one can count: Peronists, Radicals, the military, Menemists, Kirchnerists, and Macri have all attempted reforms. Frequent money issuance and unpaid debts resulting from large-scale fiscal adjustments have further undermined its stability. Today, the peso is one of the most altered currencies in the Southern Cone, with multiple devaluations and zeros removed over the decades. It is widely distrusted; few people want to buy or trade it, leaving it largely isolated for domestic use only. If this situation is not addressed, the monetary crisis will persist, devaluations will continue, and inflation could surpass 35%. The Argentine peso must be stabilized, or Argentina risks economic collapse or full dependence on foreign currencies."
