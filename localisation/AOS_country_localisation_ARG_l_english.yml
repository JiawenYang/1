#leader desc
POLITICS_ALBERTO_FERNANDEZ_DESC: "Alberto Ángel Fernández was born in Buenos Aires on April 2, 1959, to judge Carlos Galinde. After school he entered the Law School of the University of Buenos Aires, graduating as a lawyer and later becoming a professor of criminal law. His first political role was as adviser to the Buenos Aires Council, then adviser to the National Chamber of Deputies, and deputy director of the Ministry of Economy's legal department under Raúl Alfonsín. In the 1990s, he became superintendent of Argentina's National Insurance Superintendency, presided over the Association of Insurance Supervisors of Latin America, and helped found the International Association of Insurance Supervisors.\n\nHe first gained international recognition representing Argentina at the Uruguayan Round of GATT, and later in MERCOSUR and ALADI. By 1992, he was named one of Argentina's outstanding young leaders. From 1997 to 2000, he worked in finance and insurance before returning to politics, elected to the Buenos Aires legislature from Domingo Cavallo's list. In the 1990s, he had already met Néstor Kirchner, with whom he created “Grupo Calafate.” His major leap came in 2003 when he became Chief of the Cabinet of Ministers under Néstor Kirchner, serving until 2007 and briefly under Cristina Kirchner until resigning in 2008 after disagreements. After leaving government, he criticized Cristina's leadership and in 2015 advised Sergio Massa's campaign.\n\nThe turning point arrived on May 18, 2019, when Cristina Kirchner announced Alberto as presidential candidate for “Frente de Todos,” with herself as vice president. Winning the primaries in August and the general election in October with 48%, he avoided a runoff and became president on December 10, 2019. Now Alberto Fernández faced the hardest test of his life, balancing between his own loyalists and the powerful Kirchnerist faction. He stood on a fragile cliff, forced to mediate between competing interests. His meteoric rise had been swift, but without solid support, especially from the Kirchnerists, his fall could be just as rapid and unforgiving."
