#Ideologies Massa
ARG_reformist_socialism_socdem_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_reformist_kirchnerism \n\n\n\n\n\n §YReformist Kirchnerism§! is an ideology that, in this description, emerges from Sergio Massa's leadership and his rise to government. It is based on a combination of Kirchnerist and Peronist ideas, advocating for a large state, a degree of economic protectionism, and support for both national companies and strategic productive sectors. Its objective is to preserve economic and social stability while maintaining the internal cohesion of the Justicialist Party.\n\nThe ideology promotes Argentine patriotism and the protection of workers and trade unions through democratic mechanisms. It also retains progressive and social-democratic elements, such as expanding social programs to reduce poverty and supporting social minorities and immigrants. These policies are accompanied by the development of the agricultural sector, greater democratic participation in rural areas, and environmental protection policies.\n\nAll of this is combined with a strong populist and personalist component. The movement presents Sergio Massa as the political successor to the legacy of the Kirchners and the Peronist project, but adapted to a new era. Its objective would be to reduce poverty, strengthen Argentine workers, and maintain Peronism's influence through a combination of social policies, economic nationalism, and political pragmatism"

ARG_pragmatic_socialism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_pragmatic_peronism \n\n\n\n\n\n §YPragmatic Peronism§! is a form of populism willing to take whatever economic decisions are necessary to preserve stability and keep the government project afloat. Its main objective is not to follow a rigid economic doctrine, but to adapt its policies to circumstances in order to ensure the continuity of its political power.\n\nAt the same time, it seeks to maintain the support of right-wing, left-wing, and centrist factions through agreements, concessions, and policies capable of satisfying the movement's different political sectors. This balance, known as the 'Pax Peronista,' would allow the movement to preserve its unity and prevent internal conflicts from threatening the government.\n\nIn this sense, the ideology shares certain similarities with the approach of Carlos Menem, who also demonstrated considerable ideological flexibility in order to maintain a broad political coalition and ensure the stability of his government. For Pragmatic Peronism, ideology is important, but the survival of the political project is even more so."
