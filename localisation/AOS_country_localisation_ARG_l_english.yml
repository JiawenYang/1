#Focuses
ARG_capitan_beto_en_la_rosada: "Captain Beto in the Rosada"
ARG_capitan_beto_en_la_rosada_desc: "A New Political Era for Argentine history."
ARG_guzman_vs_inflacion: "Guzman Vs The Inflation"
ARG_guzman_vs_inflacion_desc: "Inflation has been one of Argentina's most persistent and destructive problems since the 1970s, when the country experienced hyperinflation reaching nearly 3,000%. During the 1990s, President Carlos Menem attempted to bring stability by pegging the peso to the U.S. dollar, which helped in the short term but eventually collapsed, leading to the 2001 default and a new cycle of economic instability. Since then, Argentina has struggled to escape from recurring inflation, debt, and stagnation. Every administration has promised solutions, but none have managed to implement lasting reforms. Under President Fernández, inflation has continued to rise, recently reaching 53.5%, higher than it was when he took office.\n\nAmid this crisis, Martín Guzmán, the Minister of Economy, has become a central figure. His task is not easy: to tame inflation, stabilize the currency, and rebuild trust in the economy—all while managing the fallout of the COVID-19 pandemic. Some see him as the only hope left to stop Argentina's long decline. Whether Guzmán will succeed remains uncertain. But the urgency is clear: without decisive action, inflation could once again threaten the very fabric of Argentina's economy and society."
ARG_alberto_aumenta_salarios: "Alberto Increases Wages"
ARG_alberto_aumenta_salarios_desc: "Since 2015, Argentina's minimum wage has risen from 6,000 to 16,000 pesos. On the surface, this might appear to be progress. However, when adjusted for inflation and currency devaluation, the reality is more troubling: in 2015, the minimum wage was worth about $600 USD, while today it barely reaches $200 USD. Inflation has surged from 27% to nearly 50%, significantly weakening the peso and reducing real purchasing power. The 2018 economic crisis only deepened these issues, exposing the fragility of wages and living standards for ordinary Argentinians.\n\nIn response, President Fernández, leading a government rooted in leftist values, has committed to raising incomes. New measures will increase the minimum wage from 16,000 to approximately 19,000 pesos. Public sector salaries will also rise from 45,000 –50,000 pesos to between 60,000 and 70,000 pesos. As a government elected by and for the people, President Fernández emphasizes his duty to protect workers and ensure fairer conditions despite the ongoing economic challenges."
ARG_argentina_diversa_libre: "a More Diverse and Free Argentina"
ARG_argentina_diversa_libre_desc: "Article 86 of the Argentine Criminal Code prohibits abortion, allowing it only in extreme cases—specifically, when the pregnancy is the result of rape or poses a serious threat to the woman's health. Former President Mauricio Macri attempted to legalize abortion, but the bill ultimately failed in parliament. This outcome reflected the deeply conservative and “patriarchal” nature of both Argentine society and many of its lawmakers.\n\nHowever, the fight did not end there. President Alberto Fernández has expressed a firm commitment to advancing reproductive rights and breaking the long-standing taboo surrounding abortion. This time, the government is better prepared and more determined to bring about real change. In addition to supporting the legalization of abortion, President Fernández aims to expand progressive social programs, continuing the work begun over a decade ago. His goal is to meet the expectations of the voters who supported him and to challenge the “patriarchal” structures still embedded in Argentine politics and society."
ARG_aborto_libre_gratuito: "Free and legal abortion"
ARG_aborto_libre_gratuito_desc: "Abortions - few issues have so deeply divided Argentina throughout its history. Under Article 86 of the Criminal Code, the procedure is permitted only in cases of rape or when a woman's life is in danger. Yet these restrictions are now denounced as “patriarchal relics,” and must, we are told, be swept aside in the name of so-called “women's rights.” Conveniently, this crusade fits neatly into Cristina's agenda, ensuring that the bill will find its way through parliament without serious resistance. Unlike the many failed attempts in the past, this time the movement is armed with greater strength and determination to tear down the last barriers of “patriarchy.”\n\nThe reform promises that women will gain the “right” to “terminate” a pregnancy up to the fourteenth week. No longer, we are told, will they be forced to bear “unwanted children”; now, they may swiftly and easily “dispose” of them. Such a measure is hailed not merely as legislation, but as a symbolic strike against society itself - the cornerstone of a new, “correct” order. For us, its champions, this is more than a law: it is a battle flag, raised against centuries of “tradition”. We proclaim that the “old order” is crumbling, that the “patriarchal” structure will soon collapse under its own weight, and that Argentina will celebrate its rebirth in our image. In their vision, each abortion is not only a private act, but a victory - the first blow that will shatter the “patriarchy” forever, clearing the way for a society remade according to our creed."
ARG_planes_de_la_mesa_del_hambre: "Hunger Table Plans"
ARG_planes_de_la_mesa_del_hambre_desc: "The idea of creating a “Hunger Roundtable” was not born overnight but had long been nurtured by President Alberto Fernández. Just ten days after our inauguration, he turned this vision into reality by founding the Argentine Federal Council to Fight Hunger as part of the broader “Argentina Against Hunger” action plan. With the dawn of a new year, we now carry the responsibility to continue this work, to give shape to a nation where no citizen is left behind.\n\nIn practical terms, President Fernández has scheduled two roundtable meetings this year, aimed at launching new initiatives and strengthening those already underway since the first meeting held on December 20. These committees will serve as instruments of careful analysis, allowing us to evaluate the country's most urgent needs and chart a course of action. The time has come to move forward with determination, toward the long-awaited dream of an Argentina free from hunger."
ARG_crear_consejo_seguridad: "Create a Security Council"
ARG_crear_consejo_seguridad_desc: "The Security Council is not a new invention but an institution with roots reaching back to Carlos Menem's presidency in 1991, established through the Internal Security Bill. Years later, Sabina Frederic, together with then-presidential candidate Alberto Fernández, revived this vision, arguing for the creation of a modern Security Council to replace the existing Ministry of National Security. The stated purpose, as Fernández himself once declared, “is to ensure that security ceases to be seen as a narrow national issue and is instead embraced as a universal responsibility shared by all.”\n\nNow, after long anticipation, we finally stand on the threshold of turning this vision into reality. The moment has arrived to reshape Argentina's security framework, to replace outdated mechanisms with a Council dedicated not merely to enforcement but to justice. Unless derailed by unforeseen obstacles, this transformation will strengthen the rule of law, restore public trust, and fulfill yet another promise long made to the Argentine people."
ARG_consumo_nacional_popular: "National and Popular Consumption"
ARG_consumo_nacional_popular_desc: "Millions of Argentines remain trapped in dire straits, unable to buy even basic food due to the endless inflation of the peso and the absence of stable, decent incomes that would restore purchasing power. They elected us to solve these problems, and what kind of leaders would we be if we failed to help the poor? It is time to turn our promises into reality so that voters never doubt their choice.\n\n Through dialogue and negotiation, we reached a consensus, compelling the largest supermarkets nationwide to implement deep discounts. This step will stimulate demand, restore some purchasing power, and give struggling families a chance to live with dignity. At the same time, it will generate greater revenue through increased turnover from ordinary citizens. The supermarkets will accept these measures because we will grant them privileges in return. In the end, all will benefit the people who need food, the supermarkets, and us, the government that keeps its word.."
ARG_alberto_y_obreros: "Alberto and Workers"
ARG_alberto_y_obreros_desc: "Workers, a class long oppressed by the wealthy bourgeoisie, those shadow rulers who pull the strings of PRO and other liberal-right parties, have endured generations of injustice. In our campaign we pledged to defend them, to stand with ordinary citizens against the weight of exploitation, and in return they placed their faith in us, granting power and legitimacy. Now, standing at the summit of authority, with the means to shape the nation's destiny, the time has come to honor our promises.\n\nYet we know the balance of power is delicate. To keep our allies content, much of what we deliver will take the form of populist gestures—grand words rather than sweeping deeds. But even within that, a seed is planted. Step by step we will build a future in which workers are no longer chained by the bourgeoisie, but can live with dignity. For now, our path is cautious, soothing both the oligarchic partners who sustain us and the working class whose trust we cannot afford to betray."
ARG_dolar_productivo_exportaciones: "Productive and Exporting Dollar"
ARG_dolar_productivo_exportaciones_desc: "Currently, the dollar exchange rate stands at historic highs, surpassing even the records of 2007. During our election campaign, we pledged to deliver a productive and export-oriented dollar, one that would strengthen Argentina's economy and restore confidence. Almost immediately after taking office at the end of 2019, we sought to honor this promise, preparing a framework for regulatory reform. Despite the short time since its implementation, exports have already begun to rise, proving that determination and planning yield results.\n\nMany so-called experts claim that annual exports will inevitably collapse if we impose export regulations. Yet their words carry no weight. They were not chosen by the people, they do not represent the people, and they have no mandate to dictate policy. They are merely privileged critics, eager to see Argentines suffer while they themselves prosper. We will not bow to such voices. It is time to fulfill our promise by any means necessary, without hesitation and without compromise."
ARG_reforma_judicial_necesaria: "Judicial Reform is Necessary"
ARG_reforma_judicial_necesaria_desc: "The judicial system is rotten, a nest of liberal, anti-Peronist judges whose bias poisons the very core of justice. The current court has become the most partial and obstructive in Argentina's history, and its very existence complicates every step of our presidency. Yet this problem was foreseen long ago, when President Alberto Fernández and Vice President Cristina Kirchner first envisioned a deep reform of the judiciary—one that would allow the government to appoint truly objective judges and remove those who act merely as political agents in robes.\n\nThe idea has lingered in debate, but its urgency has never been greater. If we dare to rethink our approach, we can finally dismantle the liberal stronghold and replace it with a judicial body devoted to fairness and the nation's wellbeing. What is required now is resolve: to pass reform through parliament swiftly, decisively, perhaps even before opponents can mobilize resistance. Only then will Argentina gain a court that stands neither against the state nor blindly for it, but firmly on the side of justice."
ARG_futbol_para_todos: " Football for Everyone"
ARG_futbol_para_todos_desc: "Football unites millions of Argentines, linking people who may never know each other yet share the same passion. The legendary derby between Boca Juniors and River Plate is not only the most celebrated in Argentina but also among the fiercest in the world. As Juvenal once said, “Bread and circuses,” and football is the ultimate spectacle that captures hearts while often distracting citizens from the turmoil of national life.\n\nStill, countless Argentines cannot afford the steep costs of stadium tickets or the endless subscriptions demanded just to follow a single match. To confront this unfairness, President Alberto Fernández has pledged to make football more accessible, more truly popular. Streaming prices will be lowered, and new pitches will be built in communities where opportunities to play are scarce. Football is more than entertainment—it is a shared language of hope, unity, and joy. And as long as there is football, Argentines will find a reason to feel happiness."
ARG_revivir_el_cine_argentino: "Reviving Argentinian Cinema"
ARG_revivir_el_cine_argentino_desc: "The golden 1930s marked the era of “Argentine Hollywood,” when films such as La Guerra Gaucha and Los Martes, Orquídeas captured the world's attention. Argentine cinema was once admired globally, its stories inspiring even Hollywood. Yet the golden age gave way to experimental works—films like Crónica de un niño solo, Invasión, and La hora de los hornos, which, though respected, could not sustain the same brilliance. With the arrival of the Last Military Dictatorship, the industry suffered a devastating decline, and the light of Argentine cinema dimmed.\n\nToday, President Alberto Fernández seeks to restore that lost glory. His plan is to subsidize studios, channeling public funds to motivate filmmakers to create works of real value, capable of winning both local pride and international recognition. The budget may feel the strain, but if Argentine cinema rises again, the people will rejoice. They will embrace culture, not austerity, and unlike liberal critics, they will not march against imagined shortages but celebrate a renaissance of art."
ARG_retenciones_al_campo: "Field Retentions"
ARG_retenciones_al_campo_desc: "Our greatest parasitic problem lies with the so-called rural oligarchs, those entrenched in villages and remote provinces. Because of their greed, ordinary farmers endure hardships while the national budget fails to receive the fair share of resources it desperately needs. Eliminating these parasites may not have been one of our campaign promises, yet it would surely ease the burdens carried by every Argentine citizen, would it not?\n\nWith the full approval of President Alberto Fernández, we will finally impose sweeping taxes on the rural oligarchs, just as we did during the critical year of 2008. Some may ask why the entire rural population must contribute, but the truth is clear: nearly all who call themselves peasants belong to this oligarchic class. They are parasites who must bear the heaviest fiscal weight, so that long-awaited justice can at last be achieved. Argentines will later thank us, for only through such measures will our national treasury be restored to strength and filled with prosperity once again."
ARG_revivir_el_plan_patria_grande: "Revive the Patria Grande Plan"
ARG_revivir_el_plan_patria_grande_desc: "The (Patria Grande) program is far from a novelty. Established in 2006, it sought to regularize the residency of MERCOSUR citizens who had long been living in Argentina without proper documentation. From the very beginning, its mission was clear and bold: to recognize these people as part of the nation's social fabric and to integrate them legally and economically. The initiative succeeded beyond expectation, sparking a remarkable wave of immigration that revitalized communities, filled vacant jobs, and gave new vigor to Argentine society. Yet after that initial boom, momentum stalled. The program continued, but without further ambition it produced few lasting transformations.\n\n.This is why President Alberto Fernández has vowed to elevate Patria Grande into something greater: a continental invitation to every Latin American willing to contribute to Argentina's future. His vision is one of bustling towns and thriving industries, of a demographic revival capable of lifting the nation toward prosperity. If calculations prove accurate, Argentina could soon experience a population surge that strengthens the economy and reshapes its regional role. The dream is not merely to welcome newcomers but to turn their energy into the cornerstone of a rising power — a republic ready to lead rather than follow, to dictate terms rather than accept them."
ARG_el_superavit_que_necesitabamos: "The Surplus we Needed"
ARG_el_superavit_que_necesitabamos_desc: " When we launched our electoral campaign, one of our foremost economic pledges was to “build reserves,” transforming the existing 43.7 billion dollars into a monumental fund that would eclipse the achievements of former President Mauricio Macri. At the outset, the administration faced urgent priorities that demanded immediate attention, leaving little room for surplus building. Yet with the initial groundwork now complete, the moment has arrived to honor the promises still pending and to confront the challenges that define Argentina's economic horizon.\n\nPresident Alberto Fernández's comprehensive strategy for reserve accumulation envisions multiple instruments: the establishment of a strict foreign exchange control system “CEPO Cambiario”, the negotiation of a renewed currency swap agreement, the implementation of selective import restrictions, and, if necessary, a carefully managed debt restructuring process with the IMF. These measures are not merely bureaucratic maneuvers but deliberate steps toward sovereignty and stability. Soon, the nation will celebrate the resilience of its economy, and the legacy of Liberal Macri will recede into memory, overshadowed by a new era of fiscal strength and political resolve."
ARG_acabar_con_la_grieta: "End The Rift"
ARG_acabar_con_la_grieta_desc: " If you asked your local mayor what strand of Peronism he subscribes to, he might offer the answer the Kirchnerist elites expect. Ask a governor and he'll recite the line favored by federal Peronist leaders. Ask the president and his response will satisfy neither camp. Argentina wears its divisions on its sleeve, and the Partido Justicialista contains within it a constellation of factions — from Kirchnerists to Menemists—each claiming the country's soul.\n\nBut the hour has come to stitch the rift. President Alberto Fernández, weary of incessant factional quarrels—especially those that spill from province to province—now seeks to bind the nation together beneath a single vision. He intends to extend his resolute hand across the republic and impose unity where there has been discord. No force, local or provincial, will be permitted to undermine the presidency; the price for defiance will be severe. This is a call for cohesion, stern yet tender: to shape Argentina's future not by petty rivalry but by a measured, unwavering will. He speaks not to crush dissent but to forge a durable consensus rooted in justice, prosper, and shared dignity for every community across the land."
ARG_la_nueva_decada_ganada: "The New Decade Won"
ARG_la_nueva_decada_ganada_desc: "With the reforms we have advanced, the decisions we have endured through legislative battles in Parliament, and the promises already fulfilled, we might be tempted to declare that the time for rest has arrived. Yet it is clear that Argentina still demands perseverance. We have secured broader popular backing; the vast fiscal surplus, together with profound adjustments to the judiciary and the surge of immigration, has transformed the nation into a stronger, more confident version of itself—better than yesterday, though still far from the summit of its potential.\n\nAlthough many of these actions took shape within the very first year of our mandate, they already allow us to glimpse the contours of an entire decade that may well be secured in our favor. The rising tide of public approval strengthens our prospects for the 2021 elections and extends its promise to 2023, when victory would mean not merely influence but genuine stewardship of the decade ahead. And yet, despite the sense that history bends toward us, we remain conscious that triumph cannot be taken for granted. The decade may appear won, but the task of truly holding destiny in our hands has only begun."
ARG_capitan_beto_y_las_crisis: "Captain beto and the Crisis"
ARG_capitan_beto_y_las_crisis_desc: "Argentina is now facing the gravest non-economic crisis of the 21st century. COVID-19, a virus that arrived from China, represents not only the most serious health threat of our century but also a direct danger to Argentina's stability, institutions, and very way of life. It has already shaken the world and will continue to spread rapidly unless drastic actions are taken. For Argentina, hesitation means collapse, while urgency may still save lives and preserve the fragile balance of our society. Emergency measures must therefore be enacted immediately, before the pandemic claims its full price.\n\nOn the desk of President Alberto Fernández rest two decisive options. He may follow the plan outlined by Cristina Kirchner, recognizing her decisive influence but securing the harmony of government and the support of Kirchnerism, thus maintaining stability. Or he may choose the path of independence, affirming himself as his own president but risking the rupture with Kirchnerists, a move that could weaken his mandate or even push him toward resignation. This dilemma cannot wait. The President must decide now, because in his choice lies the survival of Argentina itself."
ARG_la_independencia_de_alberto: "Alberto's Betrayal"
ARG_la_independencia_de_alberto_desc: "El Presidente busca su propio camino."
ARG_la_jefa_manda: "The Boss is In Charge"
ARG_la_jefa_manda_desc: "After much deliberation and under extreme time pressure, President Alberto Fernández decided to accept the proposal made by Cristina Fernández de Kirchner in response to the COVID-19 crisis. Despite his personal desire to act independently, he recognized that Argentina's survival and prosperity required cooperation with her, even if it meant working with someone he fundamentally distrusts. This difficult decision was made for the good of the nation and its people, prioritizing the urgent fight against the pandemic above personal differences or political rivalries.\n\nThe most crucial aspect of this plan is the formation of a government that will integrate both loyalists of President Fernández and Kirchnerists, allowing tolerance and collaboration in the pursuit of solutions to the COVID-19 crisis and a stronger future for Argentina. Naturally, ideological disagreements will persist, but at least there will be a framework for cooperation. For the sake of the country, its citizens, and its stability, both factions will have to set aside differences and act jointly, demonstrating that even in times of deep division, unity for the common good remains possible."
ARG_el_triunvirato_de_la_pandemia: "The triumvirate of the pandemic"
ARG_el_triunvirato_de_la_pandemia_desc: "The pandemic continues to devastate everything in its path. What began as a localized outbreak in China has escalated into a global crisis, igniting uncertainty across the world. In Argentina, inflation has dropped as a side effect of the pandemic, which has provided some temporary relief to the economy—but at a tragic human cost. COVID-19 is proving far deadlier than anyone anticipated, and urgent action is needed before the virus claims even more lives across the country.\n\nIn response, President Alberto Fernández has been compelled to form a triumvirate with the Mayor of Buenos Aires, Horacio Rodríguez Larreta, and the Governor of Buenos Aires Province, Axel Kicillof. Together, they aim to manage the pandemic in an orderly manner “within the boundaries of the Constitution”. A moderate quarantine must be imposed to curb the spread of the virus. At the same time, some believe that the longer the pandemic lasts, the more it may help stabilize Argentina's economy. In this unlikely twist, COVID-19 might become a catalyst for ending the cycle of inflation and the recurring economic crises that have plagued the nation for decades."
ARG_imponer_la_aspo: "Impose the ASPO"
ARG_imponer_la_aspo_desc: "One of the key elements of Cristina Fernández de Kirchner's plan was the implementation of ASPO, which stands for Aislamiento Social, Preventivo y Obligatorio. This strict quarantine requires all Argentines to stay at home, while businesses and institutions remain closed except for essential sectors. Borders will be sealed, compliance carefully monitored, and schools and universities shut down. ASPO represents one of the most rigorous containment measures in all of South America.\n\nDespite its severity, the measure is essential for effective cooperation between President Alberto Fernández and Cristina Kirchner and to immediately halt the spread of the virus by any means necessary. Over time, the restrictions will be gradually relaxed as the virus recedes and immunity develops among the population. For now, citizens must remain in their homes and venture outside only for essential purposes. These measures are designed solely for the protection and benefit of Argentines, regardless of any criticism or opposition, prioritizing the health and safety of the nation above all else."
ARG_blindaje_mediatico_albertista: "Albertist Media Shield"
ARG_blindaje_mediatico_albertista_desc: "The opposition constantly criticizes President Alberto Fernández, claiming that the quarantine violates the law and asserting that Alberto himself is not trustworthy and should be imprisoned. Such news, interviews, and other baseless claims only deepen the panic among people already stressed and fragmented by the quarantine. It is therefore necessary to take decisive measures so that President Fernández is no longer used as a scapegoat by the media or the opposition, ensuring that they finally stop spreading instability at such a critical time.\n\nConsequently, President Fernández will exercise his authority to compel the media not only to halt the dissemination of false or negative information about him but also to promote a positive image. He will be portrayed as “Super Alberto,” the protector of Argentina against COVID-19, a figure of strength and leadership. In the eyes of the people, President Fernández will become a superhero, and no one will dare speak ill of Super Alberto, solidifying his position as a symbol of stability and protection during the crisis."
ARG_llego_la_pandemia: "The pandemic is coming"
ARG_llego_la_pandemia_desc: "On the horizon looms the largest pandemic humanity has seen in modern times. COVID-19 has already reached Argentina and is poised to spread like wildfire. What began as a local outbreak in Wuhan has turned into an uncontrollable global virus — and now we are all facing serious consequences. Yet, from an economic perspective, the pandemic may present a paradoxical opportunity. For President Alberto Fernández and Argentina, it could help reduce inflation, potentially laying the foundation for what some may call an Argentine miracle.\n\nStill, action is urgently needed. Masks will be distributed nationwide to prevent transmission through airborne droplets. A partial lockdown must also be implemented to limit the virus's spread even further. The future of our people — and the nation itself — depends on the decisions we make now. President Fernández must walk a fine line between protecting public health and stabilizing the economy, ensuring that inflation reaches historic lows without sacrificing lives in the process."
ARG_la_cuarentena_mas_larga: "The longest quarantine in the world"
ARG_la_cuarentena_mas_larga_desc: "The first measures against COVID-19 have been implemented. A nationwide quarantine is in effect until 2021, with lockdowns imposed across the country. People are staying at home, and everything seems to be going according to plan. No one is asking questions about the previous crises—attention is now fully focused on the common enemy: COVID-19. And that, undeniably, plays into President Fernández's hands. Argentina will be fine—everyone believes it. As long as President Alberto Fernández leads the battle against the pandemic, the country is safe.\n\nBut what if the quarantine is extended for yet another year? President Fernández now 'constitutionally' proposes prolonging the lockdown through 2022, arguing that national order must be fully restored, that 'economic crises will end,' and that people must begin to obey the law rather than 'violate quarantine'—violations for which they may need to be 'put in prison.' After all, President Fernández knows better than anyone what Argentina truly needs."
ARG_una_cuarentena_temporal: "a temporary quarantine"
ARG_una_cuarentena_temporal_desc: "The first measures against COVID-19 have been implemented. A nationwide quarantine is in effect until 2021, with lockdowns imposed across the country. People are staying at home, and everything seems to be going according to plan. No one is asking questions about the previous crises—attention is now fully focused on the common enemy: COVID-19. And that, undeniably, plays into President Fernández's hands. Argentina will be fine—everyone believes it. As long as President Alberto Fernández leads the battle against the pandemic, the country is safe.\n\nBut President Alberto Fernández believes that adopting a European-style approach—with minimal restrictions and a shortened quarantine period—would be the right course of action. The main priority is the economy, which should come first, and it is expected that the population will gradually develop immunity to COVID-19. President Fernández sees no reason to violate the constitution or prolong the quarantine unnecessarily, as he believes Argentina is capable of overcoming the pandemic on its own."
ARG_aprobar_por_covid_a_los_alumnos: "Approve Students for Covid"
ARG_aprobar_por_covid_a_los_alumnos_desc: "COVID-19 is spreading rapidly. President Alberto Fernández has already taken initial steps to address the crisis, but they are not enough. One of the most pressing issues is how to handle the education of schoolchildren. Some propose continuing in-person classes, which is clearly a dangerous idea. Others suggest transitioning to online learning, which is a more reasonable and safe solution. However, the president has a different approach in mind.\n\nPresident Fernández is considering giving all students a full-year vacation for 2020. While this may seem like a drastic and controversial decision, since it would interrupt education entirely, many students would welcome the news, and such a move could help secure their long-term support. It is, undeniably, a populist policy, but the president hopes it will win the hearts of the younger generation. We can only hope this step won't bring unintended consequences."
ARG_priorizar_la_economia: "Prioritize the economy"
ARG_priorizar_la_economia_desc: "Managing the quarantine is important, but maintaining economic stability is crucial. Argentina is already facing a difficult economic situation, and COVID-19 threatens to undo all efforts made so far. Nothing poses a greater danger to the country right now than the pandemic, which must be addressed, but President Fernández understands that one wrong move could cause Argentina to collapse. Time is running out, and if action isn't taken soon, the dream of a better Argentina may fade away.\n\nThat is why President Alberto Fernández plans to introduce subsidies for small businesses. The foundation of Argentina's economy lies in these businesses, and the country cannot afford to see them disappear. In addition, President Fernández will propose legislation to provide financial support to unprofitable companies in urgent need of assistance. With these measures, he hopes Argentina can weather the storm, at least through this year."
ARG_vacunas_de_occidente: "Western vaccines"
ARG_vacunas_de_occidente_desc: "Covid must be defeated. The pandemic will not end as long as there are potential carriers of the virus. At the very least, we must ensure mass vaccination to prevent further infections and deaths. On the table, we have excellent vaccine offers from global partners, the United States, Russia, and China. Each offers a promising solution: the American Pfizer-BioNTech BNT162b2, the Russian Sputnik V, and the Chinese Sinopharm BBIBP-CorV.\n\nIdeally, we would embrace all of them. But a choice must be made — and President Alberto Fernández has made it. Argentina has chosen the American vaccine, Pfizer-BioNTech BNT162b2. Despite the country's historically warm relations with Russia, there remain concerns about the origins and reliability of the Russian Sputnik V vaccine, making it difficult to place full trust in it at this time. Strengthening ties with the United States through this choice may also open the door to potential American economic assistance. This decision does not mark the end of Argentina's cooperation with Russia. Rather, it reflects the need to diversify partnerships and maintain flexibility by having multiple international options available."
ARG_capitan_beto_te_cuida_mucho: "Captain beto takes great care of you"
ARG_capitan_beto_te_cuida_mucho_desc: "Captain Beto is ready to defend Argentina from any threat and that includes the pandemic. Covid-19 has become a matter of national security, and extraordinary times require extraordinary measures. To ensure that protectors like Captain Beto can act decisively, President Alberto Fernández is preparing to sign a series of emergency decrees, granting them expanded powers to enforce quarantine and maintain public order.\n\nBut these decrees are not just about Captain Beto. President Fernández believes that, in order to truly shield Argentines from the virus, certain restrictions on civil liberties must be temporarily introduced, of course, all in the name of public health and safety. The opposition, however, accuses him of violating the constitution and infringing on human rights. Perhaps they are right. But this is not about power, it's about protection. Sometimes, in order to save lives, leaders must take unpopular steps. Just like Captain Beto, President Fernández is acting out of duty and care for every Argentine. And right now, both the Captain and the President stand united against a common enemy: Covid-19."
ARG_el_vuelo_de_la_vida: "The Flight of Life"
ARG_el_vuelo_de_la_vida_desc: "Covid must be defeated. The pandemic will not end as long as there are potential carriers of the virus. At the very least, we must ensure mass vaccination to prevent further infections and deaths. On the table, we have excellent vaccine offers from global partners — the United States, Russia, and China. Each offers a promising solution: the American Pfizer-BioNTech BNT162b2, the Russian Sputnik V, and the Chinese Sinopharm BBIBP-CorV.\n\nIdeally, we would embrace all of them. But a choice must be made — and President Alberto Fernández has made it. Argentina will primarily rely on the Russian Sputnik V vaccine, which is expected to arrive, be distributed, and begin widespread use by the end of the year. This decision not only marks a strategic step in the fight against Covid-19, but also reaffirms our long-standing partnership with Russia — politically, economically, and now medically. Other vaccines will also play a role, but Sputnik V will be the foundation of our national immunization effort. With it, we move closer to ending this pandemic once and for all."
ARG_levantar_la_cuarentena: "lifting quarantine"
ARG_levantar_la_cuarentena_desc: "Covid-19 is finally behind us. Most citizens are now vaccinated, masks have been distributed across the country, and order has largely been restored. There's a sense of optimism in the air, people feel that the worst has passed. President Alberto Fernández made significant efforts to maintain national stability during the crisis, and now those efforts are paying off. The economy, while still fragile, is recovering, and inflation has decreased compared to the beginning of 2020. Slowly but surely, Argentina is getting back on its feet.\n\nWith confidence, President Fernández officially ends the quarantine. This decision marks a major step toward the return of normal life. Markets and shops are reopening, central streets are once again busy, and the cities are beginning to regain their usual rhythm. Traffic jams and car horns echo through neighborhoods once silent. Argentina is alive again, and much of the credit goes to the leadership that carried the country through the storm."
ARG_liberar_presos_por_covid: "freeing prisoners for covid"
ARG_liberar_presos_por_covid_desc: "Prisoners are citizens too, with the same rights as everyone else. In Argentina, inmates can vote just like the rest of the population—a fact that greatly benefits the Justicialist Party. This unique electoral bloc consistently supports our government, which ensures better prison conditions and humane treatment. Thanks to their votes, we've been able to consolidate our position in parliament and gain additional seats—something no party ever has enough of.\n\nAnd now, their loyalty deserves recognition. Many inmates will be moved to house arrest, effectively granting them freedom, while others will see their sentences reduced. They must understand that the Justicialist Party is, above all, the party of the people—and prisoners are people too, just like any other Argentine. There is no reason to fear. After all, we will be keeping a close watch on them."
ARG_los_superpoderes_de_alberto: "Alberto Super Powers"
ARG_los_superpoderes_de_alberto_desc: "Covid-19 is the greatest crisis Argentina has faced in the 21st century. The economy is hanging by a thread, and yet many in the opposition fail to grasp the gravity of the situation. In such extraordinary times, President Alberto Fernández needs broader, more decisive powers to guide the country through this storm and restore stability. Critics may cry dictatorship or accuse him of bypassing the constitution but they are mistaken. Fernández is not seeking personal power, only the tools necessary to protect the Argentine people and rebuild the nation.\n\nTo that end, the presidential administration is pushing Parliament to grant the President expanded emergency powers. These would include, for example, the ability to pass the national budget without waiting for legislative approval, a vital step if the opposition attempts to obstruct policies that prioritize public welfare. Additionally, Fernández could be allowed to enact certain emergency regulations by decree. All of this, of course, would be done for the sole purpose of defending Argentina and delivering on the promise to protect its citizens in a moment of historic hardship."
ARG_la_mision_guzman: "The guzman mission"
ARG_la_mision_guzman_desc: "Martín Maximiliano Guzmán, Argentina's Minister of Economy, has a notable but previously quiet background. Born on October 12, 1982, in La Plata, he studied economics at the National University of La Plata before continuing his education at Brown University in the United States. He later worked closely with Nobel Prize-winning economist Joseph Stiglitz at Columbia University, specializing in sovereign debt and economic restructuring. Before his appointment, Guzmán was virtually unknown to the broader Argentine public, yet many now realize they had overlooked a brilliant mind.\n\nToday, Guzmán carries a heavy burden. He is tasked with controlling inflation, managing the economy during a global pandemic, and restructuring Argentina's massive public debt. Despite his lack of political notoriety at home, President Alberto Fernández and even Stiglitz have expressed full confidence in him. With Argentina in a fragile state, Guzmán must act decisively. The country's future may well depend on his success because this time, failure could be fatal."
ARG_emergencia_economica_social: "Social Economic Emergency"
ARG_emergencia_economica_social_desc: " Argentina's economy is in a deep and ongoing crisis. The public remains overly focused on the dollar, often neglecting the peso, while exports are becoming increasingly unprofitable for the state, leading to reduced national revenue. Utility rates continue to rise, pushing more citizens into poverty. Meanwhile, pension spending keeps growing, placing even more pressure on a budget that's already stretched beyond its limits. Small and medium-sized businesses are drowning in debt—debt that cannot simply be written off. But there is a plan.\n\nEconomy Minister Martín Guzmán proposes a comprehensive law designed to temporarily stabilize the situation. It includes a 3% tax on dollar purchases to reduce dollar demand, a freeze on utility rate hikes, and a suspension of automatic pension increases. To address the fiscal shortfall, a new export tax—particularly targeting agriculture—will be introduced. In addition, small and medium enterprises will be granted easier debt repayment terms and specific benefits to ease their burden. This initiative is not a permanent fix, but it is intended to act as a temporary shield—buying time until the worst of the crisis can be brought under control."
ARG_un_cepo_blindado: "An Armored CEPO"
ARG_un_cepo_blindado_desc: "The dollar became Argentina's unofficial second currency during the presidency of Carlos Menem, especially after the peso was pegged to the dollar. Over time, both currencies experienced economic turbulence, but the peso suffered much more due to repeated devaluations and inflation. Unlike the peso, the dollar retained its strength, which led to a deep-rooted preference for the American currency among Argentinians. Trust in the peso has steadily declined, creating a serious problem for President Alberto Fernández and his government.\n\nTo address this, Economy Minister Martín Guzmán has introduced strict currency controls known as the cepo cambiario. Under these rules, individuals are only allowed to purchase up to 2 US dollars per month at the official exchange rate. In addition to the existing 3% PAIS tax, Guzmán has also added a 35% income tax on dollar purchases, making foreign currency less accessible and more expensive. The aim is clear: to reduce dollar demand and begin restoring confidence in the Argentine peso. It's a difficult and risky move, but one that Guzmán believes is necessary to stabilize the economy and avoid an even deeper crisis."
ARG_crear_el_ife: "Create the IFE"
ARG_crear_el_ife_desc: "COVID-19 has struck Argentina with full force. Thousands of people are losing their sources of income, and poverty is rising rapidly across the country. The collapse in consumer demand, especially for food, is putting the entire Argentine economy at risk. The situation is particularly alarming for vulnerable groups, such as single mothers, who may not survive without some form of immediate assistance. A potential social explosion looms unless urgent measures are taken.\n\nFaced with this crisis, President Alberto Fernández has turned to his Minister of Economy, Martín Guzmán, to find a solution. Guzmán's answer is the creation of the Ingreso Familiar de Emergencia, an emergency income program designed to deliver direct cash assistance. Under this plan, qualifying individuals will receive a one-time payment of 1, pesos, with the possibility of two more rounds of payments in the near future. The goal is simple: to stop the rapid spread of poverty and give people a financial lifeline as the pandemic continues to unfold."
ARG_expandir_los_planes_sociales: "Expand the Social Plans"
ARG_expandir_los_planes_sociales_desc: "How many unemployed people are trapped in poverty without a way out? How many families struggle daily because of systemic economic hardship? How many small businesses collapse simply because they can't access the benefits they need? These issues have become a daily reality in Argentina, a reality that the people can no longer accept as normal. The public is calling for answers, but the combined pressures of COVID-19, inflation, and a growing budget deficit make it nearly impossible to solve everything at once.\n\nStill, Minister of Economy Martín Guzmán proposes a balanced path forward. Social programs will be expanded, but carefully with the goal of helping those most in need without worsening inflation. Workers will receive new subsidies to ease their burden. Unemployment benefits will be increased, but with a renewed push for recipients to re-enter the workforce more quickly. Small businesses will be granted easier access to state support. These measures won't solve all problems at once, and yes, there is a risk of worsening the economy, but the government is committed to making a real difference, even if it has to do so step by step."
ARG_implementar_control_de_cambios: "Implement Exchange Control"
ARG_implementar_control_de_cambios_desc: "The state lacks sufficient tools to effectively control its currency. The dollar can rise or fall sharply at any moment, threatening to trigger a rapid economic collapse. Tying the peso to the dollar in the past was a critical mistake, and if we don't act now, we may face a crisis even more severe than the collapse of 21. The stakes are high and this could become the worst financial disaster in Argentine history.\n\nTo prevent such an outcome, Economy Minister Martín Guzmán proposes a set of heterodox economic measures aimed at increasing state control over the foreign exchange market. The centerpiece of his proposal is to fix the price of the dollar, creating stability and ensuring that any crisis unfolds gradually rather than explosively. Guzmán hopes this will be only the first step in a broader strategy of economic adjustment, but even before a full plan is in place, he insists that immediate action is essential."
ARG_programa_precios_justos: "Fair Prices Program"
ARG_programa_precios_justos_desc: "Mauricio Macri was the first president of the 21st century to abolish price controls and push through market reforms, hoping these measures would save Argentina. Unfortunately, the opposite happened and the situation only worsened. The efforts of Néstor and Cristina Kirchner, despite the many who opposed Cristina, brought significant achievements. We have gained valuable experience, especially in managing the economy, and now that President Fernández has promised to lead Argentina out of crisis, it must be done.\n\nEconomy Minister Guzmán proposes to restore Precios Cuidados, the program that fixed prices for essential goods. He also wants to freeze utility rates so electricity costs don't increase, allowing people to get through tough times while the Ingreso Familiar de Emergencia continues to provide support. The people voted for us and still trust us in these difficult moments so why should we let them down?"
ARG_gasoducto_y_problemas_al_horizonte: "Problems on the Horizon"
ARG_gasoducto_y_problemas_al_horizonte_desc: "Troubles are looming on the horizon. The Minister of Productive Development, Matias Kulfas, has publicly accused Vice President Cristina Kirchner of corruption and causing delays in the “Presidente Néstor Kirchner Gas Pipeline” project. In response, Cristina is reportedly ready to dismiss him. But that's not the only issue, Minister of Economy Martín Guzman is also threatening to resign due to his strained relationship with Cristina. If these conflicts aren't resolved soon, the consequences could be severe for the government.\n\nDespite his personal differences with Cristina, President Alberto Fernández is determined to mediate and bring everyone back together. His goal is to prevent Kulfas and Guzman from stepping down and to avoid any cabinet purges or, worse, a party split that could undermine his leadership. While the situation may not be fully resolved yet, Alberto sincerely hopes that next time the tensions will ease and that consensus within the government will hold strong"
ARG_expropiar_el_vicentin: "Expropriate Vicentin"
ARG_expropiar_el_vicentin_desc: "Vicentin, one of Argentina's largest agro-industrial conglomerates, began as a small family business in Santa Fe in 1929, initially dealing with cotton and peanuts. Over the decades, it grew massively, and by 1966 it had expanded into industrial processing, including solvent extraction. Its influence in the Argentine economy became significant. However, in 2019, Vicentin defaulted, leaving behind a staggering debt of over a billion pesos to the state-owned Banco Nacion. This default made the company highly dependent on the state and opened the door for potential government intervention.\n\nPresident Alberto Fernández sees an opportunity in this, Vicentin, in the midst of the Covid-19 crisis, could become a valuable state asset. Nationalizing the company would not only strengthen state control over a key sector but also ensure profits remain within the public sphere at a time of great need. Yet, there is resistance. The governor of Santa Fe, Omar Perroti, opposes full nationalization and advocates instead for partial state participation and oversight. Although Perroti's stance may not have the final say, his cooperation is politically valuable at this moment. Now Fernández must decide either push for full control or compromise to preserve political unity."
ARG_los_dolares_son_para_producir: "Dollars are for production"
ARG_los_dolares_son_para_producir_desc: "President Alberto Fernández had promised to set a dollar exchange rate favorable to exporters, one of the key pledges that helped secure his election. The reality is clear: for Argentine producers, selling goods abroad is often unprofitable because Argentine products are overpriced on the international market. Now, to avoid losing the vital support of medium-sized businesses which is a core pillar of his political base and the president must finally deliver on that promise.\n\nFernández moves to raise the official dollar rate, adjusting it so that exporters can profitably sell their products worldwide, though not within Argentina itself. Yet a major obstacle stands in the way: the “blue dollar,” the unofficial market rate that is much lower than the state-controlled one and dominates actual circulation. As a result, exporters earn less than they could, while importers pay far more than they should. And against the blue dollar, the government has no real weapon. All that remains is to hope it will not sabotage the entire plan."
ARG_programa_atp: "The ATP Program"
ARG_programa_atp_desc: "Covid-19 could trigger devastating unemployment and the collapse of many companies. This situation has never occurred before, and now we find ourselves at a critical crossroads. Argentina can either gain significant benefits if the right decisions are made, or it could be completely destroyed, reduced to a mere shadow of its former self. Ultimately, we represent the people, especially the working class and the last thing we can allow is widespread unemployment and loss of income for our citizens.\n\nThat is why Minister Guzman proposed creating the Asistencia de Emergencia al Trabajo y la Produccion program. This initiative aims to defer or reduce up to 95% of employers' contributions to SIPA, provide public fund supplements to salaries for private sector workers, and offer zero-interest loans or preferential terms for self-employed individuals. Of course, implementing this will be challenging due to the budget deficit, but both Guzman and President Fernández assure that there will be enough funds to sustain the program until next year, which is expected to be an improvement over this year."
ARG_obras_en_almirante_brown: "Works at Almirante Brown"
ARG_obras_en_almirante_brown_desc: "Almirante Brown, located in the Buenos Aires Province, rests on low-lying, poorly drained lands interwoven with small rivers and streams such as the Arroyo del Rey and Corimayo. When heavy rains come, water swiftly floods streets and courtyards alike. Beyond the flooding itself, the region also faces serious problems due to the insufficient capacity of its aging drainage systems. For instance, the Arroyo del Rey has become overgrown and clogged, which slows water flow and exacerbates the flooding issues.\n\nPresident Fernández has crafted a solution to tackle these challenges through extensive hydraulic works. Among these is the Desagües Pluviales Burzaco Sur project, a large-scale storm sewer system designed to significantly improve water drainage. Another vital initiative, Yapeyú 2, aims to enhance the drainage infrastructure in the areas of Ministro Rivadavia and Longchamps. Together, these projects represent the most ambitious public works in Almirante Brown's recent history, promising to prevent future floods or at least greatly reduce their impact."
ARG_financiar_industria_automotriz_nacional: "Financing the Argentine automotive industry"
ARG_financiar_industria_automotriz_nacional_desc: "Fiat and Renault are among the largest and most influential foreign car manufacturers in Argentina, though their histories in the country are quite different. Fiat first arrived in 1919, and in the 1960s launched the iconic Fiat 6 “Futito,” which became a symbol of Argentine roads. The company was forced to close during the 2001–2002 economic crisis, but returned in 28, regaining its place in the market and even achieving notable success with the launch of the Fiat Cronus in 2018. Renault entered Argentina later, in 1967, releasing the Renault 12 in 1971, a model that gained wide popularity at the time. However, in recent years Renault has faced persistent difficulties, struggling with low sales and a lack of profitability.\n\nThe Covid-19 pandemic has further weakened both companies, making financial support from the state necessary. Despite their contrasting situations, Fiat and Renault are both critical for Argentina's economy, providing jobs, technological investment, and industrial capacity. President Fernández therefore intends to grant subsidies to both, ensuring they can sustain operations for another year, with the hope that by next year they will return to profitability and continue contributing to the nation's growth."
ARG_reactivar_la_industria_nacional: "Reactivate the National Industry"
ARG_reactivar_la_industria_nacional_desc: "The national industry finds itself in a deep crisis due to the impact of Covid-19. No matter how much effort we put into solving this problem by paying workers' wages and subsidizing a single sector — namely mechanical engineering — the overall industrial landscape continues to decline, with the national sector suffering most. To make matters more complex, much of the mechanical engineering industry is foreign-owned. The time has come to restore the greatness of Argentine industry, but such a revival cannot simply begin from nothing. Returning to pre-Covid conditions will require vision, and President Fernández believes he has one.\n\nThe subsidies granted to mechanical engineering have proven successful, giving us valuable experience and undeniable proof that targeted support can keep struggling companies afloat. Building on this, Molino Cañuelas and other companies will now receive state funding to maintain production and avoid the fate of Vicentín, which collapsed into bankruptcy. According to Minister of Economy Martín Guzmán, this approach could save a number of companies from shutting down — an outcome both economically damaging and politically undesirable for the country"
ARG_negociar_con_el_fmi: "Negotiating with the IMF"
ARG_negociar_con_el_fmi_desc: "Relations between Argentina and the International Monetary Fund have always been strained. The surcharges in 2018, which were a punishment for Argentina's debt, marked the peak of these difficult relations. But now, unfortunately, Argentina needs the IMF, mainly because of its debt. Of course, it is very unpleasant to return to such old 'friends,' but what can you do for the sake of the people? Therefore, President Fernández has assigned the task of negotiations to Minister of Economy Guzman.\n\nGuzman must convince the IMF President to reconsider Argentina's debt and the possibility of investing funds into the Argentine economy. Of course, there is no guarantee they will agree especially given our history of crises, Guzman is not sure they will provide money to a country that has been in economic turmoil for years. But it is still worth trying. In the end, this could be the start of a new chapter in Argentina's relationship with the IMF."
ARG_reestructurar_la_deuda_interna: "Restructuring the Internal Debt"
ARG_reestructurar_la_deuda_interna_desc: "Negotiations with creditors are ongoing, and we have proposed several key measures to ease Argentina's debt burden. These include reducing interest rates on outstanding debts, extending payment deadlines, and partially forgiving the debt, effectively lowering its real value. If these talks succeed, it will mark a major triumph for President Fernández and Economy Minister Guzman, while also providing vital support to Argentina's fragile economy, helping it better withstand the ongoing challenges of the Covid-19 pandemic.\n\nFortunately, the negotiations appear to be going well. We have reached agreements with approximately 93-99% of bondholders, a remarkable achievement for the Fernández administration. Thanks to these deals, debt payments have been cut nearly in half, from 7% down to 3%, and the repayment period has been extended by ten or even twenty years. The final step is to restructure the debts issued under Argentine law, which, once completed, will stand as one of Argentina's greatest economic successes in the 21st century."
ARG_gira_europea_de_alberto: "Alberto's European Tour"
ARG_gira_europea_de_alberto_desc: "Since independence, relations between Europe and Argentina have been far from smooth. Our decision to shelter Nazi criminals such as Adolf Eichmann, Ante Pavelić, and Dr. Josef Mengele permanently stained our image, earning Argentina the reputation of a haven for fugitives of the Third Reich. In the modern era, relations have normalized, yet the legacy of the Las Malvinas conflict still lingers. The international narrative often paints Argentina as the aggressor, while Britain — which has occupied the islands for centuries — is rarely portrayed in the same light. Nevertheless, re-engaging with Europe is now a necessity.\n\nWhat drives this urgency is silver — a resource that Argentina desperately needs but has seen in short supply in recent years. Naturally, Europe will not simply hand over silver without gaining something in return. This is why Minister of Economy Martín Guzmán, who has long-standing ties with European counterparts, will personally travel to the continent. His mission: to negotiate more favorable terms for silver imports to Argentina. For President Fernández, the justification is simple — everything for the good of the nation, even if it means reopening delicate diplomatic channels."
ARG_acercarse_a_china: "getting closer to China"
ARG_acercarse_a_china_desc: "China is perhaps one of Argentina's most underestimated partners, a relationship to which we have, unfortunately, paid too little attention. The first official contact was established in 1972 with the signing of the Bucharest Communiqué. In 198, President Jorge Videla became the first Argentine leader to visit China. After China's accession to the WTO in 21, the partnership entered a new phase, later solidified by the 214 declaration of a Comprehensive Strategic Partnership and the signing of the Joint Action Plan for 2019–2023 in 2018, following Xi Jinping's visit to Argentina.\n\nNow, in a world shaken by the Covid-19 pandemic, President Fernández has decided to reorient part of Argentina's foreign policy, shifting emphasis from a primarily Russian partnership toward closer ties with China — while still balancing relations with the West, represented by the EU and the United States, and the East, in the form of Russia and China. Naturally, such a strategy may not please all of Argentina's partners, but from a strategic perspective, it offers the country the best of all worlds. By maintaining diverse alliances, Argentina positions itself as a valuable asset to multiple global powers, ensuring it can draw benefits from each while preserving its own sovereignty."
ARG_expandir_el_sector_publico: "Expand the Public Sector"
ARG_expandir_el_sector_publico_desc: "Thousands — if not tens of thousands — of people have been left unemployed due to bankruptcies or mass layoffs in the private sector. Despite the creation of the IFE program, we cannot simply allow them to remain jobless and live off government aid. Within the administration, many proposals have been put forward, including one from Minister of Economy Martín Guzmán, whose opinion carries the most weight with President Fernández. And despite the range of voices and suggestions, President Alberto Fernández will naturally be inclined to follow the advice of his trusted economic strategist.\n\nMinister Guzmán's proposal is clear: expand the public sector. He suggests increasing government spending to hire those who lost their jobs as a result of the Covid-19 crisis. While the budget deficit is a concern, the Minister warns that leaving unemployment unchecked would be far worse — because the longer it persists, the greater the deficit will ultimately become."
ARG_la_economia_post_pandemia: "The Post-Pandemic Economy"
ARG_la_economia_post_pandemia_desc: "The Covid-19 pandemic has left a deep and lasting impact on our economy. Thousands have lost their jobs, numerous companies have gone bankrupt, and the peso has significantly depreciated. All of this unfolded during the strict quarantine period, but the situation could have been far worse if not for the decisive actions of Minister of Economy Martín Guzmán. His measures — such as fixing the official dollar purchase rate, implementing price controls on essential goods, and introducing the Ingreso Familiar de Emergencia — were crucial in preventing a total economic collapse.\n\nNow, as we enter the post-Covid era, there is cautious optimism. The economy is expected to gradually return to normalcy, with people steadily finding employment once again. Despite ongoing inflation, runaway price spikes should become a thing of the past. With the latest policies in place, economists can finally look forward to some well-earned respite after days of intense struggle and uncertainty. Argentina can once again breathe freely, thanks in large part to the efforts and leadership of Martín Guzmán."
ARG_el_nuevo_pacto_social: "The New Social Pact"
ARG_el_nuevo_pacto_social_desc: "The interactions between businessmen and trade unionists have always been significant elements in the history of Argentina. In the 2th century, corporatism was introduced by Peron and functioned quite effectively. However, in the 21st century, the reforms of Carlos Menem dismantled the corporatist structure in favor of a free-market model. During the presidency of Mauricio Macri, this shift became even more apparent when trade unions launched lengthy strikes, while Macri focused almost exclusively on business rather than on the people./n/nPresident Fernández now intends to reverse this trend by forming a new pact between businessmen and trade unionists, especially in light of the need for cooperation during the Covid-19 crisis. We have acknowledged our past mistakes, and Fernández is fully committed to working for the people and the workers, instead of dancing to the rhythm of corporate interests. We are not puppets, and this pact will demonstrate clearly that business must follow our lead, not the other way around."
ARG_la_lista_negra_de_opositores: "the blacklist of opponents"
ARG_la_lista_negra_de_opositores_desc: "In 1976, the military and far-right forces overthrew Isabel Peron, leader of the Justicialist Party and President of Argentina for one reason: she was a Peronist. The Montoneros and ERP threatened to assassinate Peron upon his return, because he too was a Peronist. The UCR and similar groups threatened to topple the Justicialist government simply because it represented Peronism. Later, PRO and Mauricio Macri considered banning Peronism altogether, just like in the 1950s and 60s. Yet through all of these threats we endured.\n\nToday, however, the danger of a coup is stronger than ever. Libertarians and their fanatics are desperate to take power, knowing that the people still place their faith in us. That is why President Fernández proposes creating a list of opposition figures who pose a threat to Argentina and using measures such as blackmail, dismissal, and political isolation to neutralize them. Yes, such actions may be unconstitutional and go against legal norms, but the Constitution gives us no other tools to fight back against the real, growing threat of a coup. Doing nothing would be far worse."
ARG_perseguir_con_la_ley_a_opositores: "persecuting opponents with the law"
ARG_perseguir_con_la_ley_a_opositores_desc: "Despite all President Fernández's deep-seated animosity toward the Kirchners, the latter demonstrated remarkable skill in handling an opposition that was constantly on the verge of facing prison sentences. Néstor Kirchner abolished the Ley de Punto Final and the Ley de Obediencia Debida, reopening the prosecution of those responsible for the crimes of the Dirty War and, in doing so, effectively forcing the armed forces into submission. Kristina Kirchner, in turn, neutralized the influence of the independent media giants Clarín and La Nacion, while also consolidating control over the press through a series of decisive reforms.\n\nTheir political experience is invaluable: they mastered the art of confronting the opposition within the framework of the law, and so will we. The first name on our list is none other than the former president of Argentina, Mauricio Macri. Under his administration, evidence emerged of illegal surveillance and espionage, including the monitoring of relatives of the deceased crew of the ARA San Juan submarine, as well as surveillance of opposition figures through the AFI intelligence agency. The FMIgate scandal further exposed his administration, along with revelations in the offshore leaks concerning Fleg Trading Ltd. and Kagemusha S.A., both linked to the Macri family. He also manipulated the AFIP tax authority and initiated the persecution of Peronists — for these reasons, he will be the first of many to face justice. This will mark the beginning of a thorough cleansing of Argentina, carried out by the law and aimed at those who have long deserved to be held accountable."
ARG_intimidar_legalmente_a_opositores: "legally intimidate opponents"
ARG_intimidar_legalmente_a_opositores_desc: "Despite all President Fernández's deep-seated animosity toward the Kirchners, the latter demonstrated remarkable skill in handling an opposition that was constantly on the verge of facing prison sentences. Néstor Kirchner abolished the Ley de Punto Final and the Ley de Obediencia Debida, reopening the prosecution of those responsible for the crimes of the Dirty War and, in doing so, effectively forcing the armed forces into submission. Kristina Kirchner, in turn, neutralized the influence of the independent media giants Clarín and La Nacion, while also consolidating control over the press through a series of decisive reforms.\n\nBut we cannot simply continue down the same path as the Kirchners. Neither Cristina nor Nestor were entirely right, and Cristina in particular should not have engaged in such an open war against the newspapers. Our approach will be different. We will seek to legally pressure and intimidate opponents so that they think twice before spreading absurdities about President Fernández. Journalists, as well as those working within public and political organizations, will be quietly but firmly reminded of the consequences of reckless accusations. The aim is to prevent misinformation from poisoning the minds of the people and leading them to believe that President Fernández and his administration are fraudsters or villains."
ARG_barrer_con_las_causas_de_cfk: "Sweeping up CFK's judicial cases"
ARG_barrer_con_las_causas_de_cfk_desc: "The “Vialidad” case, the “Cuadernos” case, the AMIA case, Hotesur and Los Sauces, and the “Dólar Futuro” case - all of these proceedings brought against Vice President Cristina Fernández de Kirchner - are presented by us as and in fact are politically motivated efforts to damage the reputation of the Kirchnerist movement and the Justicialist Party.\n\nTo ensure that justice prevails, President Alberto Fernández will move to delay, postpone, or suspend hearings involving Cristina Fernández de Kirchner on procedural grounds. While such measures may be criticized as undemocratic, they will provide the necessary time to prepare a full legal defense and present comprehensive arguments demonstrating her innocence. These accusations, driven by the right-wing opposition, will be met with due process, giving the judiciary the time required to reach a decision that upholds justice."
ARG_legalizar_el_aborto: "legalize abortion"
ARG_legalizar_el_aborto_desc: "Although we have made significant progress in women's rights - in 1921 granting abortion in cases where pregnancy endangered a woman's life or involved rape of mentally ill women, and in 2012 extending access to all victims of rape - Argentine society remains largely conservative. Former President Mauricio Macri failed to pass a broader abortion rights bill through Parliament in 2018.\n\nNow we will carry that effort forward. President Alberto Fernández will submit a fully prepared bill to the Argentine Congress for a vote. For too long, we have delayed fulfilling our promises, but with the COVID situation easing, we can finally take the first decisive step toward progressivism - the first step toward a just, united, and equal Argentina for the working people.\n\nViva Argentina!"
ARG_poner_fin_al_patriarcado: "put an end to the patriarchy"
ARG_poner_fin_al_patriarcado_desc: "With the abortion bill passed and enacted into law, alongside dozens of other minor and major initiatives on women's rights, the establishment of a Ministry of Women, Gender, and Diversity tasked with transforming Argentina into a more equal society, the gradual introduction of a third, non-binary gender option on national identification documents, workplace quotas for transgender people, expanded economic support for pregnant women and low-income families, and the formal recognition of the gender wage gap at the level of the Ministry of Economy, it can now be stated clearly: the foundations of patriarchy have been struck.\n\nOf course, this is not the end - but the first battle has been won, and we intend to carry that momentum forward."
ARG_alberto_con_la_cgt: "alberto with the cgt"
ARG_alberto_con_la_cgt_desc: "The Confederacion General del Trabajo is the most powerful trade union in Argentina, and its support is essential for President Alberto Fernández if he hopes to secure victory in the mid-term elections. With the backing of the CGT, tens of thousands of workers can be mobilized to vote for the PJ rather than drifting toward the UCR or the FIT-Unidad. For this reason, President Fernández seeks a meeting with the union's main leaders, knowing that their endorsement will be decisive in shaping the outcome of the vote.\n\nTo win over the CGT, Fernández is prepared to promise subsidies for workers, a measure that could shield families from hardship and strengthen trust in his leadership. Alongside this, he intends to reaffirm his commitment to labor reforms that will protect workers' rights and ensure that the voice of organized labor remains central in Argentina's political life. This agreement could mark the beginning of a new era - a true workers' state built not for the oligarchs, as the opposition would wish, but for the people who placed Fernández in power and for whom he has sworn to govern."
ARG_la_censura_politicamente_correcta: "politically correct censorship"
ARG_la_censura_politicamente_correcta_desc: "Every day, the opposition utters hundreds of phrases that violate the principles of political correctness — words branded as racist, discriminatory, or xenophobic. Even harmless things tied to culture, art, or music are denounced as problematic, which directly contradicts the progressive course set by President Fernández. Opponents may cry “censorship,” but what they call censorship is in truth an effort to build a society of respect, dignity, and equality - values the opposition has never embraced.\n\nFor this reason, INADI will not hesitate to intervene. Its duty is to fight against openly offensive language as well as the subtle remnants of outdated speech and thought. Old television shows, popular musicians, even iconic series such as Dragon Ball may need to be revised, restricted, or removed altogether. It may seem harsh, but it is for the greater good: to ensure no citizen feels “humiliated” and to preserve the trust of Marxist supporters whose loyalty is essential for the future. This campaign for political correctness cannot allow hesitation or compromise. Every word, every image, every symbol must serve the birth of a new Argentina - purified of offense, united in sensitivity, and unshakable in its values."
ARG_mas_planes_sociales: "more social plans"
ARG_mas_planes_sociales_desc: "Subsidies and PJ's weak popularity among the middle class may seem like separate matters, but in reality they are closely linked. Without the support of this social group, PJ risks losing the elections, since most of the middle class sympathize with PRO and are inclined to vote for JxC. The COVID-19 pandemic only deepened the problem: countless small businesses are going bankrupt, many citizens lost jobs and income, and confidence in President Fernández and PJ is falling day by day. If this trust is exhausted completely, the political consequences will be catastrophic and difficult to reverse.\n\nCristina Kirchner nevertheless offers a strategy. According to her plan, President Fernández must provide subsidies to Argentine citizens, focusing especially on the middle class, so that businesses can survive at least until the elections. This is not only a social but also a political measure: it is a chance to restore some of the credibility that PJ has lost, to show that we can protect people in a time of crisis, and to convince them to vote for PJ or, at the very least, to turn away from JxC. Even support for other left-wing forces or federal Peronists would be better than a triumph of JxC."
ARG_preparar_elections_2021: "preparing for the 2021 legislative elections"
ARG_preparar_elections_2021_desc: "Soon Argentina will face decisive mid-term elections to parliament. Despite all efforts of the government, polls still show Juntos por el Cambio in the lead, a result that cannot be allowed. Everyone remembers the disastrous experiment with Macri - years of debt, privatizations, and favors to the oligarchs. Returning to those policies would mean plunging the people back into poverty and handing the state over to the same small elite. Such an outcome must be prevented at any cost.\n\nAt this critical moment, Captain Beto finds himself at a strategic crossroads. One option is to grant Kristina Kirchner and her loyalists full control of the campaign. Their machinery is experienced, their rallies and slogans more effective than ours, and they could stop JxC. Yet, the stronger Cristina becomes, the harder it will be to contain her ambitions later. The other option is for President Fernández to lead the campaign under his own name. That path may seem weaker in the short term, but it strikes directly at Kristina's dominance and weakens her Marxist faction. Thus the dilemma remains: hand victory to Kristina to block JxC, or risk defeat in order to reduce her overwhelming influence. The choice will define not only the 2021 elections but the entire future balance of power in Argentina."
ARG_la_jefa_dirigira_la_campana: "the boss will direct the campaign"
ARG_la_jefa_dirigira_la_campana_desc: "And now time is running out for President Alberto Fernández, forcing him to decide who will lead the PJ campaign. After days of hesitation and reflection, Fernández finally hands control of the campaign to Cristina Kirchner and her K radicals, convinced that only they have the machinery and experience to prevent JxC from seizing victory. Their ability to mobilize voters, dominate the media, and dismantle the opposition is undeniable, and thanks to this the ruling party will secure a stronger position in parliament, shielding itself from the immediate threat of PRO and the oligarchs.\n\nBut every coin has its reverse side. Cristina, the rat we cannot fully control, will inevitably increase her influence, and each additional seat she wins strengthens her claws on the government. If she gains too much power, she will push aside pro-Fernández ministers and replace them with loyal mongrels who live only to impose Marxist policies and block any reform not aligned with their dogma. For Fernández this means constant paralysis, endless conflict, and the risk of becoming a mere figurehead. Yet the choice has already been made, and only God knows whether it will save the presidency or destroy it."
ARG_apoyar_tolosa_paz: "support tolosa paz"
ARG_apoyar_tolosa_paz_desc: "The elections are drawing ever closer, and all eyes are fixed on the province of Buenos Aires, the decisive battlefield of the mid-term race. Whoever wins here will determine the balance of power, and for the Peronist movement there is no room for failure. PRO has dominated the Capital since 27, and therefore Cristina Fernández de Kirchner must put forward a candidate capable of reversing the tide, a figure who can inspire hope and mobilize the people of Buenos Aires in the name of the PJ and Argentina itself. For a long time, such a candidate seemed almost impossible to find, but at last the choice was made.\n\nHer name is Victoria Tolosa Paz, a loyal supporter of Cristina, a woman with the charisma and discipline needed to confront PRO's machinery. With her candidacy, the PJ has found a chance to reclaim influence. Enormous administrative resources will be directed toward her campaign, since her triumph would mean not only victory in Buenos Aires but also survival for the entire government. These elections could either consolidate PRO's dominance, burying PJ's hopes in the Capital once and for all, or else shake the status quo, giving new breath and the promise of a different future."
ARG_victoria_kirchnerista: "victory of Kirchnerism"
ARG_victoria_kirchnerista_desc: "The votes were counted, and the results were finally revealed. In the mid-term elections, the PJ emerged victorious, solidifying its position across the nation and decisively defeating JxC. The Frente de Todos strengthened its majority in both the Senate and the Chamber of Deputies, much to the dismay of the opposition, shattering their hopes of seizing power. The Argentine dream lives on, all thanks to Cristina Kirchner and the K Radicals, whose dedication brought such a crucial victory into the hands of President Fernández.\n\nAlthough Cristina and her K Radicals have gained even greater influence over the daily political agenda, and President Fernández is now more dependent on their support, this triumph lays a strong foundation for the PJ in the upcoming 2023 elections. This victory belongs to the people of Argentina - to workers, to the middle class, to unions, and to business owners alike. In the end, it is not merely a political win; it is a reaffirmation of Kirchnerism, a triumph that unites and strengthens the country as a whole"
ARG_la_campana_de_capitan_beto: "the campaign of capitan beto"
ARG_la_campana_de_capitan_beto_desc: "And now the time is running out for President Alberto Fernández, forcing him to finally decide who will take control of the PJ campaign. After long hours of pressure, doubts, and deliberation, Captain Beto makes the bold choice to personally lead the campaign himself. It is a difficult and risky step, since handing everything to Cristina Kirchner and her K Radicals could have guaranteed a stronger electoral push, but Fernández knows that relying on her would mean paying a high political price. Yes, the PJ could lose seats in parliament, and if that happens all critics will accuse him of incompetence and claim the disaster was born of his arrogance, insisting that things would have gone better under Cristina's control.\n\nYet every coin has its other side, and this time the consequences may favor Fernández. By personally assuming leadership, he not only undermines Cristina's growing shadow but also strengthens pro-Fernández forces inside the government and within the party. That rat Cristina will at last feel her influence begin to shrink, and with it the suffocating paralysis she imposes on every decision. At last, there is a chance to start building a new era in Argentina under Fernández's own leadership rather than the suffocating grip of collective dependency."
ARG_apoyar_a_leandro_santoro: "support leandro santoro"
ARG_apoyar_a_leandro_santoro_desc: "The elections are drawing nearer, and all attention is now concentrated on the province of Buenos Aires, the decisive arena of the mid-terms. To maintain influence, the PJ must secure victory here, for without Buenos Aires, no position of power can be guaranteed. PRO has held the Capital firmly since 27, and therefore President Alberto Fernández faced the urgent task of finding a candidate capable of breaking their dominance, uniting the city beneath the flag of Peronism and offering Argentines the hope of renewal. After long hesitation and exhausting searches, such a figure was finally chosen.\n\nHis name is Leandro Santoro. Though often called a radical, a Kirchnerist, and even an Alfonsinist, he carries the rare ability to bridge divides and inspire the electorate. Santoro embodies both loyalty to the cause and the charisma to challenge PRO on its own ground. For this reason, almost all administrative resources will be directed toward his campaign, as his victory would not merely secure Buenos Aires but also demonstrate that under President Fernández's leadership, the PJ is alive, strong, and ready to guide Argentina into a new and brighter century."
ARG_derrota_del_kirchnerismo: "defeat of Kirchnerism"
ARG_derrota_del_kirchnerismo_desc: "The votes have been counted, and the results have been made public - and they are far from favorable for President Fernández. JxC performed better, and for the first time in forty years, the PJ has lost its majority in the Senate. This marks a significant setback, shattering the illusions of the “Argentine dream” that we had hoped to achieve. President Fernández faces intense criticism for this electoral failure, while new political actors rise to prominence.\n\nMassa, a close ally of Cristina Kirchner, will effectively inherit the political influence that President Fernández has lost due to these results. Legislative progress is expected to stall, plunging the government into a political deadlock. As President Fernández himself anticipates, many pro-Fernández ministers may be forced to step aside, as Cristina will likely begin her strategic purges, placing her loyal “comrades” in key positions and advancing Marxist policies within the administration. This shift threatens to reshape the government and its agenda for the foreseeable future."
ARG_un_respiro_para_alberto: "a break for Alberto"
ARG_un_respiro_para_alberto_desc: "President Alberto Fernández is exhausted - at least that is what the K Radicals, Cristina Kirchner's loyal faction, firmly believe. With the PJ's victory in the elections, Cristina has also triumphed, greatly expanding her influence, consolidating her position as vice president, and at the same time reducing the authority and personal weight of President Fernández. Many observers claim that what is happening resembles a coup d'état, but the reality is different: Fernández himself is tired of constant political battles, endless negotiations and pressure, and he longs for peace. Those who argue otherwise simply deceive themselves, for Cristina knows better than anyone what truly serves the movement and the country.\n\nNow Fernández stands at a crucial crossroads: remain in office, even though his strength is fading, or allow Cristina to take on greater responsibility and try to unify Argentina under her determined leadership, since much of society has already shifted its sympathy away from him. A temporary withdrawal would grant Fernández rest and the chance to eventually return, while Cristina would maintain political stability during his absence. In the end, he can place his trust in her, because if she had ever wished to overthrow him by force, she would surely have done so long ago."
ARG_las_purgas_de_cristina: "cristina's purges"
ARG_las_purgas_de_cristina_desc: "Cristina Kirchner is profoundly dissatisfied with the outcome of the mid-term elections, and we must accept what she intends to carry out - a sweeping purge that President Alberto Fernández, weakened by the loss of real political power, is unable to stop. Cristina will systematically remove everyone she considers disloyal, beginning with the pro-Fernández ministers, while the President himself will remain like a spectator, chained to his chair, silently witnessing the storm that now seems inevitable.\n\nMost striking of all, Sergio Massa will in practice assume the role of head of state, performing many of the duties that once belonged exclusively to Fernández. Ministers will resign one after another, with Martín Guzmán among the first, and their places will quickly be filled by Cristina's trusted allies or by members of the combative K Radicals. Thus President Fernández, paradoxical as it may sound, ceases to be a true president; he becomes instead a symbolic figurehead, while real power shifts decisively into the hands of Cristina and her circle. The Argentine dream collapses before our eyes, and Fernández can only look back with regret at the very elections that once lifted him to power."
ARG_mision_cafiero_sola: "The Sola-Cafiero Mission"
ARG_mision_cafiero_sola_desc: "The world is trembling on the edge of collapse, shaken by the downfall of Wall Street and the paralysis of the United States government. The fire of instability rises higher with every passing day, spreading across continents and igniting conflicts that had long been dormant. South America cannot remain untouched by this global storm. Venezuela, freed from any restraint with the weakening of Washington, now acts boldly across the continent. Brazil drifts into uncertainty, lacking stability on the eve of the 2022 elections, while Argentina finds itself almost entirely isolated, left without reliable allies in the wider world.\n\nFaced with this dangerous moment, President Alberto Fernández turns to diplomacy as the only shield. He sends Felipe Solá and Santiago Cafiero on urgent missions to rebuild Argentina's standing in Latin America, seeking to weave new bonds of trust and cooperation. Through this effort, Argentina hopes to gain a measure of stability before the great wave of crises submerges the continent. The country will attempt to put an end to years of isolation by embracing an internationalist foreign policy, one that secures Argentina's place in the shifting order. The fire rises, and Argentina is determined not to be consumed by it, but to master its flames."
ARG_tragar_orgullo_ideologico: "Swallow Our Ideological Pride"
ARG_tragar_orgullo_ideologico_desc: "Multipolarity instead of a single dominant axis, the continued assertion that Las Malvinas are inherently Argentine, a deliberate distancing from the already weakened United States and Bolsonaro's unstable Brazil, alongside support for the so-called “progressive” axis in Latin America, were some of the early ideological pillars of President Alberto Fernández's foreign policy. Yet no one could have foreseen the sudden collapse of the United States and the arrival of a global instability reminiscent of both the Second World War and the Cold War.\n\nPresident Fernández fully understands the magnitude of these challenges. Gritting his teeth, he now faces the necessity of setting aside many ideological ambitions in favor of pragmatism during this turbulent period. Britain, the occupier of Las Malvinas, may become as crucial a partner as Brazil, whose internal struggles leave it fragile and unpredictable. To survive this crisis, Argentina will have to partially abandon its multipolar aspirations, realizing that in a world so shaken, isolation is a luxury the nation cannot afford, and careful, practical alliances are essential to secure the country's position and safeguard its future."
ARG_crisis_migratoria_brasil: "Brazil's Migration Crisis"
ARG_crisis_migratoria_brasil_desc: "It happened: civil war has erupted in Brazil. The elected president failed to reach any meaningful agreement with the protesting opposition against the new regime, producing chaos similar to what the United States experienced earlier. Major cities such as Brasília and Rio de Janeiro are affected, yet the hardest hit is São Paulo, where dozens of warlords now battle in the streets, leaving countless innocent civilians dead in their wake. Crisis hit Brazil hard and it has to be resolved.\n\nUnsurprisingly, a massive wave of Brazilians is fleeing the country, with Argentina and Uruguay becoming the primary destinations. Hundreds of thousands have already crossed the border, and countless more are waiting to seek asylum in Argentina. While offering refuge is morally right, Argentina is already burdened with serious internal problems, and the influx threatens to exacerbate existing challenges. President Alberto Fernández must now make critical decisions - who to support, how to manage the crisis, and what measures to take - to finally resolve the migration issue and maintain order within the nation."
ARG_tratado_alianza_lacalle: "Alliance Treaty with lacalle Pou"
ARG_tratado_alianza_lacalle_desc: "Argentina and Uruguay both trace their origins to the old Viceroyalty of Río de la Plata, and throughout their long shared history they have usually been friends, even if from time to time they found themselves competing for influence in the Southern Cone. Argentina once even supported different factions during Uruguay's civil war, and later, in the 2th century, both nations cooperated within Operation Condor during the years of military dictatorships. Yet relations soured again in the 2s when Uruguay began building pulp mills on the Uruguay River, directly next to Argentina's border. The dispute, though resolved peacefully by international arbitration, left a mark of distrust that has never entirely disappeared.\n\nNow President Alberto Fernández seeks to overcome this past by meeting with his Uruguayan counterpart, Luis Lacalle Pou, to sign a series of vital agreements aimed at strengthening bilateral cooperation in an era of global instability. With Mercosur weakened and crises shaking South America, Argentina needs Uruguay as a close and reliable partner. Together they could balance the region, confront the Chavista influence spreading from Venezuela, and push back against every form of new imperialism, opening the door to a renewed vision of unity and strength for the Río de la Plata."
ARG_ayudar_a_marito_par: "help Marito against the Red problem"
ARG_ayudar_a_marito_par_desc: "The Ejército del Pueblo Paraguayo together with the Partido Comunista Paraguayo remain the most prominent far-left organizations in Paraguay, groups that for years have declared their intention to overthrow the central authority and build a communist state in the heart of South America. Though militarily weak, they are sustained by clandestine support from Chavista Venezuela, whose leadership dreams of exporting its Bolivarian revolution and destabilizing neighboring countries. The mere persistence of these armed factions not only endangers Paraguay itself but also raises growing concerns in Argentina, for the fire of extremism knows no borders.\n\nFaced with this challenge, President Alberto Fernández has decided to act. He will travel to Asuncion and meet his counterpart, President Mario Abdo Benítez, offering Argentine cooperation in the campaign to dismantle the guerrilla presence hidden deep in Paraguay's jungles. The proposal, framed as both solidarity and necessity, will hardly be refused. For Paraguay it means much-needed help, and for Argentina it secures a valuable ally in the inevitable struggle against Chavista influence. In Fernández's view, only decisive joint action can end the red threat once and for all and preserve stability across the Río de la Plata region."
ARG_rec_compromiso_chl: "Recovering the Commitment with Chile"
ARG_rec_compromiso_chl_desc: "Sharing common origins in the struggle for independence, Argentina and Chile have nevertheless often found themselves divided by disputes over poorly defined borders in Patagonia and Tierra del Fuego, culminating in the 1881 Border Treaty. Tensions resurfaced during the Beagle crisis of the 197s, when claims over islands in the Beagle Channel nearly led to open conflict. Chile even figured among the hypothetical targets of the Argentine military junta, though the navy ultimately pushed for restraint. Yet history moved forward, and by the turn of the century both nations discovered new ground for cooperation within Mercosur, UNASUR and CELAC, slowly transforming rivalry into partnership.\n\nNow President Alberto Fernández intends to build upon this foundation. He seeks to strengthen ties with Argentina's western neighbor, reaffirming the warm relations restored in the late 2th and early 21st centuries. For Fernández, closer alignment with Chile means not only regional stability but also another valuable card against the Chavista threat looming from the north. Argentina aspires to claim its place in the sun, and invites Chile to share in that light as equal partners in shaping the destiny of South America."
ARG_cortar_privilegios_bol: "Cut Bolivian Privileges"
ARG_cortar_privilegios_bol_desc: "The issue of Bolivian migrants in Argentina has become a major challenge and, to put it mildly, a deeply unpleasant matter for President Alberto Fernández. For years, they have received far more from state programs than they have contributed, regardless of whether their stay is legal or not. While such a situation could be tolerated during periods of economic growth, the current crisis, triggered by the collapse of the United States and the ensuing global instability, leaves Argentina with no room for further weakness. It has become clear that decisive action must be taken so that this population begins to contribute to the state rather than continue benefiting at its expense.\n\nFor this reason, President Fernández intends not only to restrict access to social programs for Bolivians but also to end free education, healthcare, and similar privileges. Instead, they will be required to either pay for these services or contribute something tangible to the state in exchange. In practice, this will compel them to work and provide real value to Argentina if they wish to remain. The era of leniency has reached its end, for the nation's struggling economy can no longer sustain those who live off its resources without giving anything in return."
ARG_aumentar_seguridad_norte: "Increase Security at the Northern Border"
ARG_aumentar_seguridad_norte_desc: "The migration issue from Brazil, Paraguay, and Bolivia has long been a major and sensitive challenge for President Alberto Fernández. Bolivians shamelessly benefit from Argentina's generous social programs, contributing far less than they receive, while Paraguayans purchase vast amounts of cheap goods across the border and resell them, draining the national budget. Even Brazilian migration, though less massive, puts additional strain on the economy and labor market. In calmer times such things were tolerated, but with the collapse of Wall Street, the weakening of the United States, and the onset of a global crisis, every peso now counts, and uncontrolled migration can no longer be ignored.\n\nTo respond, President Fernández intends to reinforce the northern frontier, strengthen security, and implement a much stricter immigration policy. Border patrols will be expanded, illegal crossings suppressed, and those lacking proper documents detained or deported. Only those who genuinely contribute to the prosperity of Argentina will be allowed to remain, for the country can no longer afford to feed parasites while its own people suffer."
ARG_bolsonaro_perdoname: "Bolsonaro Forgive Me"
ARG_bolsonaro_perdoname_desc: "Jair Bolsonaro is currently the President of Brazil and may well retain power after the upcoming elections. Despite the fact that President Alberto Fernández openly referred to Bolsonaro as an 'extremist far-right' figure, Brazil remains a key ally in South America, and its resources are of crucial importance to Argentina. However, such statements have gradually cooled diplomatic relations between the two countries, a situation that could prove highly detrimental for Fernández given the looming Chavista threat in the region, exacerbated by the collapse of the United States and its diminished oversight over South America.\n\nIn response, President Fernández intends to meet with Bolsonaro to extend a formal apology and to negotiate a bilateral trade agreement that benefits both Argentina and Brazil. Recognizing the misstep of his earlier remarks, Fernández aims to restore warmth and trust in the relationship, ensuring that both nations can collaborate effectively. Strengthening ties with Brazil is not only a diplomatic necessity but also a strategic move to counter the Chavista threat from Venezuela, securing Argentina's position in regional politics while reinforcing stability across the continent."
ARG_reforzar_mercosur: "Strengthen Mercosur"
ARG_reforzar_mercosur_desc: "Mercosur was created on March 26, 1991, as a regional bloc uniting Argentina, Brazil, Paraguay, and Uruguay, with Chile, Colombia, Bolivia, and others as associate members. Initially focused on trade, it quickly grew into a political platform for cooperation and balance of power in South America. Today, after the collapse of the United States and the resulting isolation of many economies, Mercosur has become one of the few remaining instruments capable of preserving stability and offering Argentina a real chance for leadership.\n\nPresident Alberto Fernández believes that the future lies in strengthening and expanding Mercosur beyond South America. The idea is to build relations with new partners such as New Zealand and Mexico, and also to extend cooperation toward the Middle East, Africa, and Europe. Over time, the bloc could become an economic shield similar to the European Union, defending the continent against financial crises. Even if Chile keeps its isolationist stance or Venezuela suspends its membership, Argentina will still push forward. By leading this transformation, Argentina will not only save its own economy but also emerge as the hero of South American integration."
ARG_tratados_comercial_par_urg: "Trade Agreements with Uruguay and Paraguay"
ARG_tratados_comercial_par_urg_desc: "Relations between Uruguay, Paraguay, and Argentina have always been marked by tension and rivalry. During the bloody Paraguayan War of the 19th century, Argentina together with Uruguay and Brazil fought against Paraguay, leaving the country devastated and losing more than half of its male population. In the 2th century, all three states cooperated under the framework of 'Operation Condor,' but in the 21st century disagreements returned. Argentina clashed with Uruguay over the construction of pulp mills on the Uruguay River, while with Paraguay tensions grew over navigation rights on the Paraná and the long-standing disputes surrounding the Yacyretá hydroelectric plant. Still, despite being members of Mercosur, true cooperation remained fragile.\n\nNow, after the collapse of the United States and the crash of Wall Street, President Alberto Fernández believes it is vital to put aside historic grievances and focus on survival and development. He promotes the creation of a 'Large Trade Zone' to be launched in Rio de Janeiro, aimed at securing bilateral and multilateral agreements that will boost integration. Such a platform will not only strengthen political cooperation but also improve Argentina's economy, giving Buenos Aires new influence in the markets of Paraguay and Uruguay, and making the region stronger in the face of global instability."
ARG_cuestion_chilena: "The Chilean Question"
ARG_cuestion_chilena_desc: "Chile has long stood as a striking example of isolationism in South America. Since its independence, the country has focused primarily on exporting goods—especially to Britain—while deliberately avoiding involvement in regional wars or the great global conflicts of the twentieth century. This careful distance was disrupted in 197 with the election of Salvador Allende, who openly aligned with Moscow, and even more so after the military coup of 1973, when General Augusto Pinochet tied his dictatorship firmly to Washington until the end of his rule in 199. With democracy restored, Chile gradually returned to its traditional stance of political and diplomatic reserve.\n\nIt is precisely for this reason that President Alberto Fernández seeks to visit Santiago, aiming to break through the walls of Chilean isolationism and reorient it in favor of Argentina. His plan is to propose closer military cooperation alongside a bilateral trade agreement, laying the groundwork for long-term partnership. Fernández knows the challenge will not be simple: Chile's isolationist reflexes have been forged over more than a century. Yet he also understands that this stance is less solid than it appears. One genuine external threat would be enough to push Chile toward Argentina, not away from it."
ARG_expander_mercados_conosur: "Expanding the Markets of the Conosur"
ARG_expander_mercados_conosur_desc: "Many trade chains were destroyed by the collapse of the United States, including those directly connected to the Southern Cone. Argentina, Chile, and Uruguay found themselves increasingly isolated in trade, with almost no foreign capital flowing into the region. This situation, combined with the disruption of traditional trade partners, represents a significant challenge for Argentina, and it must be addressed promptly. If these issues are not resolved, the country risks a further deterioration of an already severe trade deficit, with consequences that could affect all sectors of the economy.\n\nTo counter this problem, President Alberto Fernández plans to strategically attract foreign investment to the countries of the Southern Cone, while also exploring new trade partners beyond the traditional ones, potentially more advantageous than the old networks. Beyond the immediate economic benefits, these efforts are intended to strengthen Argentina's diplomatic position, especially in relation to Chile. By successfully engaging Chile as a cooperative partner, Argentina can break through years of Chilean isolationism, fostering regional collaboration and securing a stronger influence over trade policies in the Southern Cone. This approach combines pragmatism with long-term strategic thinking, ensuring both economic recovery and political leverage for Argentina."
ARG_rio_de_plata_comercio_full: "A Rio de la Plata Full of Trade"
ARG_rio_de_plata_comercio_full_desc: "Finally taking the first steps toward economic stability in response to the collapse of the United States, President Alberto Fernández seeks to implement a series of measures designed to stabilize Argentina temporarily and reduce the trade deficit. More precisely, these decisions are intended to lay the groundwork for long-term effects, creating a foundation for a stronger and more resilient economy.\n\nThese measures will be pro-market, aiming to realize the vision of continuous exports and imports through the Rio de la Plata, where ships regularly enter and leave Argentine waters, facilitating robust trade. Given the urgency of the situation, President Fernández recognizes that these steps are only the beginning, setting the stage for future governments that, if successful, can fully open Argentina to the world. Economists forecast that, by fostering constant inflows of capital and reinforcing trade networks, these initiatives will significantly mitigate the economic crisis, providing Argentina with both stability and new opportunities for growth in the global market."
ARG_aranceles_bolivianos: "Tariffs to Bolivia"
ARG_aranceles_bolivianos_desc: "Bolivians have long been openly profiting from Argentines' resources through their goods, which, in essence, constitutes a form of theft. This situation is particularly problematic given that Bolivia remains the only steadfast ally of Chavista Venezuela in South America, making it, in effect, an adversary of Argentina. Unfortunately, previous administrations were far too lenient regarding these economic imbalances, allowing Bolivia to continue exploiting opportunities at Argentina's expense. Now, however, it is time to put an end to this exploitation. If Bolivia wishes to sell its products to our market, it will need to comply with strict economic conditions.\n\nTo achieve this, President Alberto Fernández intends to introduce substantial tariffs on Bolivian goods entering Argentina. These tariffs will ensure that Bolivia pays a high price for accessing the Argentine market, the only neighboring market still open to them despite their alliance with Venezuela. At the same time, these measures will bolster Argentina's budget through additional revenue and create a degree of economic dependence for Bolivia. By enforcing these tariffs, Argentina asserts its authority, protects the wealth of its citizens, and sends a clear message: the era of tolerating economic exploitation by Bolivia has come to an end."
ARG_cerrar_el_paso_brasil: "Closing the Way to the Brazilians"
ARG_cerrar_el_paso_brasil_desc: "The Brazilian migration crisis is growing larger and more difficult to manage for all neighboring countries, including Argentina. Millions are fleeing their homeland to escape the horrors of the ongoing civil war, yet Argentina was not prepared for such a massive influx of refugees. President Alberto Fernández is clearly concerned by the alarming reports, and decisive action is needed to establish a permanent solution, putting an end to the crisis and managing all the consequences that the Brazilian migrants bring with them.\n\nThe most rational course of action appears to be the temporary closure of the border with Brazil, preventing further mass arrivals. While this may seem harsh from a moral standpoint, it is a necessary step to protect Argentina from potential threats, including criminals and cartel members who might exploit the chaos. Other countries remain open for fleeing Brazilians, and Argentina cannot afford to shoulder this burden. Acting decisively will allow the nation to remain stable, safeguard its citizens, and ensure that it navigates the crisis without being dragged into the chaos engulfing its northern neighbor."
ARG_una_oportunidad_unica: "A Unique Opportunity?"
ARG_una_oportunidad_unica_desc: "The Brazilian Migration Crisis is growing larger and increasingly challenging for the countries surrounding Brazil, including Argentina. Millions are already fleeing the country, unwilling to endure the ongoing civil war, and Argentina was clearly unprepared for such a massive influx of refugees. President Alberto Fernández is visibly concerned by the reports, and decisive action is required to establish a lasting solution to the migration crisis and the challenges posed by the arrival of Brazilian refugees.\n\nAlthough closing the borders might seem like a rational response, President Fernández has opted for a more strategic approach. Argentina will accommodate Brazilians who can be integrated as a source of affordable labor for corporations struggling amid the economic crisis triggered by the collapse of the United States. They will not receive special benefits; instead, they will work in sectors where Argentines are unwilling to go. While this approach has its drawbacks, it is expected to provide long-term economic benefits and gradually assimilate the Brazilian population, transforming them into fully integrated members of Argentine society."
ARG_pactos_frontera_par_urg: "Border Pact with Paraguay and Uruguay"
ARG_pactos_frontera_par_urg_desc: "The first measures to address the Brazilian migration crisis have been implemented, and while the situation is gradually stabilizing at the national level, the problem has escalated on the regional stage. Brazilians continue to flee to neighboring countries such as Paraguay and Uruguay, which, like Argentina, are far from enthusiastic about the influx. The issue has now taken on a transnational dimension, and for Argentina to strengthen its influence in South America, decisive steps must be taken to secure the approval and cooperation of Uruguay and Paraguay, who could potentially become key allies.\n\nPresident Alberto Fernández is determined to assist Paraguay and Uruguay during this difficult time. Through coordinated efforts under the Border Pact between Argentina, Paraguay, and Uruguay, Argentina aims to assert its leadership in the region. This strategy will not only secure Argentina a stronger position and influence comparable to the major powers but also allow the country to control the movement of Brazilian refugees seeking entry from neighboring territories. By acting decisively, Argentina ensures that the crisis is managed efficiently while reinforcing its strategic standing in South America."
ARG_hay_que_poblar: "We have to populate"
ARG_hay_que_poblar_desc: "The first measures regarding the Brazilian migration crisis have already been implemented, and the program aimed at turning Brazilian refugees into a cheap labor force is beginning to show results, which can be considered a modest success. Yet the broader issue of migration remains far from resolved, and President Alberto Fernández understands that the time has come to take more permanent and strategic steps in order to secure Argentina's long-term stability. In his mind there are several challenges that could, paradoxically, be addressed precisely with the help of the Brazilians.\n\nOne of the boldest decisions is to send tens of thousands of Brazilian migrants to Patagonia, where they would integrate with the local population, form new communities, and stimulate the stagnant economy of these underdeveloped regions. The opposition may openly criticize such a move, seeing it as reckless, but they fail to grasp the hidden benefits. Over time, this policy could not only strengthen Argentina's control over Patagonia but also secure valuable goodwill from the likely victors of Brazil's civil war. History, Fernández believes, will prove this decision to be the right one."
ARG_cuestion_guerra_civil_bra: "The Question of the Brazilian war"
ARG_cuestion_guerra_civil_bra_desc: "When the first decisive measures to stabilize the situation in Brazil were taken, the basis for dealing with the migration crisis was finally formed. Yet the bigger issue still remained unresolved: which of the many factions should be recognized as the “legitimate” Brazilian government. Recognition is not just a formal step, but also a signal of Argentina's intentions. Alongside this, President Alberto Fernández must decide whether Argentina will intervene in the civil war, supporting those who could later strengthen his own regional position, or whether he will remain strictly neutral, avoiding new risks but also missing potential opportunities.\n\nOn the table of the President lie several candidates for recognition, each with its own strengths, but the Legalist Front of Lula da Silva clearly stands out as the most serious force. With its political influence and international sympathy, Lula's camp could be a long-term asset for Argentina if helped now. But intervention carries dangers: direct involvement in Brazil's war may drag Argentina into chaos. Neutrality preserves stability, yet it also sidelines Argentina from shaping the new order. This is the moment where Fernández must choose: to watch events from afar, or to take the gamble and try to influence Brazil's future."
ARG_ayudar_a_lula: "Help Lula"
ARG_ayudar_a_lula_desc: "Looking at Argentina, one immediately notices its long tradition of neutrality and reluctance to intervene in foreign conflicts. For example, Argentina remained outside the First World War entirely, and during the Second World War it was the only South American country that joined the Allies only in March 1945, when the outcome was already clear. This non-interventionist tradition later became a useful tool: in the 21st century, Argentina tried to benefit by presenting itself as an “autonomous” regional actor. Néstor and Cristina Kirchner actively promoted this course, balancing between BRICS, China, the United States and Europe, while defending peaceful solutions to issues such as Las Malvinas.\n\nBut history is now forcing a new choice. President Alberto Fernández is under pressure to abandon this cautious tradition by sending troops, equipment, and weapons to support the Legalist Front of Lula da Silva. His reasoning is partly ideological affinity with Lula, but also the hope of elevating Argentina into the role of a regional superpower. In such a vision, a loyal and indebted Brazil would become the cornerstone of a new South American order led by Buenos Aires. It may look like a bold step forward, perhaps even necessary for Argentina's ambitions, but only time will reveal whether breaking with neutrality was a wise decision or a dangerous gamble."
ARG_mantener_neutralidad: "Maintaining Neutrality"
ARG_mantener_neutralidad_desc: "Looking at Argentina, one immediately notices its long tradition of neutrality and reluctance to intervene in foreign conflicts. For example, Argentina remained outside the First World War entirely, and during the Second World War it was the only South American country that joined the Allies only in March 1945, when the outcome was already clear. This non-interventionist tradition later became a useful tool: in the 21st century, Argentina tried to benefit by presenting itself as an “autonomous” regional actor. Néstor and Cristina Kirchner actively promoted this course, balancing between BRICS, China, the United States and Europe, while defending peaceful solutions to issues such as Las Malvinas.\n\nAnd despite the pressure of circumstances, President Alberto Fernández has no intention of abandoning this principle of neutrality merely for the sake of some potential ally in Brazil, whose victory in the civil war is far from guaranteed considering the strength of the integralists, the putschists, and the Maoists. Such a refusal to intervene may cost Argentina a possible partner in the region, but it also secures a stronger diplomatic position and preserves national stability. After all, why should Argentine soldiers sacrifice their lives for Lula da Silva, when Argentina can still defend its interests through diplomacy rather than through bloodshed?"
ARG_operacion_condor_azul: "Operation blue condor"
ARG_operacion_condor_azul_desc: "The world stands on the brink of global conflicts and is increasingly unstable, a reality acknowledged by prominent military figures such as retired Malvinas Islands General Bari del Valle Sosa, current Army Commander Juan Martín Paleo, Air Force Commander Javier Julián Isaac, Navy Commander Julio Guardia, General Guillermo Pereda, and a number of other retired generals. These experts have presented a comprehensive plan to President Alberto Fernández in response to the growing threats and regional instability.\n\nThe core of the plan is the strategic rearmament and modernization of the Argentine Armed Forces, known as Operation Blue Condor. It envisions a secretive yet systematic renewal of critical military equipment, addressing the current shortages of functional weapons and outdated technology that no longer meets contemporary standards. In parallel, the plan includes the gradual recruitment and training of soldiers to expand the army's capabilities. By 2025–2026, the objective is for Argentina to possess the strongest and most modernized military in Latin America, fully prepared to defend the Southern Cone from potential regional and global threats while ensuring national security and sovereignty."
ARG_rearme_disimulado: "A Disguised Rearmament"
ARG_rearme_disimulado_desc: "President Alberto Fernández has recently faced pressure from several high-ranking generals involved in Operation Blue Condor, who warned that the operation's secrecy is at risk. Public reports issued by military contractors working for the Argentine government have inadvertently revealed that the Argentine army is undergoing rearmament, a fact that could be discovered not only by neighboring countries but also by potential adversaries such as Venezuela and others. The generals demanded immediate and decisive action, and President Fernández took their concerns seriously.\n\nIn response, President Alberto Fernández will issue a series of decrees requiring military contractors to provide misleading public reports, stating that their activities are routine and unrelated to rearmament. In reality, these contractors will continue the secret and systematic modernization of the Argentine Armed Forces, preserving the confidentiality of Operation Blue Condor. This approach ensures that Argentina strengthens its military capabilities while keeping the details hidden from foreign intelligence and prying eyes, safeguarding national security and the strategic advantages of the Southern Cone."
ARG_darle_autonomia_generalato: "Give some Autonomy to the Generalate"
ARG_darle_autonomia_generalato_desc: "Since the end of the National Reorganization Process, the Argentine Army has gradually lost its autonomy, requiring numerous approvals from low-level officials all the way up to the President of Argentina for even the simplest actions. Generals have long been concerned about this lack of independence, and with the launch of Operation Blue Condor, restoring autonomy to the high command and to various military branches has become essential. While the nominal signature of the president is still required, real operational decisions need to be made by the generals themselves.\n\nReluctantly, President Alberto Fernández took the necessary step, granting significant autonomy to the high command of each branch of the Argentine Army. Although he retains the formal power to review and sign off on plans, it is now widely understood that this signature is largely symbolic. The army can proceed with its operations independently, reflecting a return to a level of operational freedom reminiscent of Argentina in the 1960s, while maintaining the necessary oversight in name only."
ARG_comprar_armas_nuevas: "Buy New Armaments"
ARG_comprar_armas_nuevas_desc: "The Argentine Army currently relies on weapons that seem to date back to the Malvinas War, and many of its planes, ships, and tanks were built in the 2th century, some even in the first half of it. This outdated equipment is a constant concern for generals, who have long criticized previous presidents for failing to modernize the armed forces. Naturally, they expect President Alberto Fernández to take decisive action and approve a comprehensive modernization program, including the acquisition of advanced foreign weaponry.\n\nPresident Fernández responded positively, giving the green light to modernize the army. However, he went further, deciding to leverage the international connections of his ministers to secure the best equipment available. Minister of Economy Martín Guzmán brings strong ties with the European Union, while Matías Kulfas has connections in China and Russia. By coordinating these channels, Argentina aims to obtain cutting-edge military technology from these three global powers, satisfying the generals' demands and ensuring that the army's modernization meets contemporary strategic standards."
ARG_reactivar_industria_militar_arg: "Reactivate the National Military Industry"
ARG_reactivar_industria_militar_arg_desc: "The Argentine industry has seen significant improvement since the measures implemented during the COVID-19 pandemic, with production increasing both in quantity and quality thanks to government subsidies such as ATP. The military industry, however, has not shared this success and has remained in the red, showing no signs of returning to its former strength on its own. Given its close connection to Operation Blue Condor, the generals appealed to President Alberto Fernández to take action to restore the military sector to full operational capacity.\n\nIn response, President Fernández decided to extend a strategy similar to that applied to the civilian industry, issuing targeted subsidies to the military sector and expanding the operations of Fabricaciones Militares Argentinas. This initiative aims not only to revive production but also to modernize and enhance the manufacturing of equipment and weapons in Argentina, ensuring the objectives of Operation Blue Condor are met and reinforcing national security. These measures mark a critical step toward strengthening Argentina's defense capabilities while maintaining a stable and efficient military-industrial base."
ARG_campana_reclutamiento_arg: "Recruitment Campaign for the Unemployed"
ARG_campana_reclutamiento_arg_desc: "Since the outbreak of Covid-19, Argentina has faced a growing problem with homelessness, which presents a particularly sensitive challenge for President Alberto Fernández. Addressing this issue is essential, as ignoring it would tarnish the country's image, highlighting poverty rather than its true potential. At the same time, the army requires courageous recruits for Operation Blue Condor, and it seems that President Fernández has devised a clever solution that addresses both concerns simultaneously.\n\nUnder this plan, the homeless population will be targeted with propaganda encouraging enlistment in the army. They will respond eagerly, drawn by the promise of privileges, training, and a substantial salary. This approach is expected to appeal to them strongly while also garnering public support, as the initiative addresses a social issue and strengthens national defense. By integrating new recruits in this manner, Argentina can simultaneously reduce homelessness and bolster its military, creating a temporary but effective solution that benefits both the people and the armed forces while advancing the goals of Operation Blue Condor."
ARG_leyenda_negra_militar_final: "Start Breaking The Black Legend of the Army"
ARG_leyenda_negra_militar_final_desc: "The Dirty War that began in 1973 left a dark and painful mark on the history of Argentina, casting a shadow over the army that still lingers today. Many politicians in the Partido Justicialista frequently refer to the Dirty War, often using it to criticize and discredit the Argentine military. However, now is not the time to dwell on past horrors. We have endured immense suffering, and there is no need to reopen wounds, especially by tarnishing the reputation of our defenders and brave soldiers who stand ready to sacrifice their lives for Argentina and its people.\n\nTherefore, President Alberto Fernández disavows books, propaganda, and political speeches from his own supporters in the PJ that exploit the Dirty War. The nation must focus on healing rather than division, and continually revisiting this chapter only deepens societal fractures. At the same time, opposition voices will be allowed to express their perspective on the Dirty War freely, and INADI will not be used against them. Respecting diverse narratives ensures that all Argentines can speak their truth while the country strives to move forward united."
ARG_investigar_logias_militares: "Investigate the military lodges"
ARG_investigar_logias_militares_desc: "Recently, rumors have circulated that far-right and far-left movements are reemerging within the Argentine army, with particular concern over the revival of the Carapintadas. These reports have caused unease among some politicians and officials from the Partido Justicialista, as well as social activists and journalists. President Alberto Fernández faced a difficult decision: either dismiss the rumors due to lack of evidence and proceed rapidly with Operation Blue Condor, or conduct a thorough investigation, which would inevitably slow the operation and risk giving strategic advantage to potential adversaries.\n\nIn the end, President Fernández chose to launch a comprehensive check with the assistance of SIDE agents. Despite the absence of concrete evidence and the temporary delay to Operation Blue Condor, he prioritized preventing a recurrence of the instability that preceded the 1976 coup and ensuring an army fully loyal to the government. Only time will reveal whether these rumors were founded, but for now, the decision reflects caution, prudence, and the necessity of securing national defense while maintaining order."
ARG_aceptar_ideas_radicales_army: "Accepting Radical Ideas in the Army"
ARG_aceptar_ideas_radicales_army_desc: "Recently, rumors have emerged suggesting a revival of far-right and far-left movements within the Argentine army, particularly the far-right, with concerns about the resurgence of the Carapintadas. These reports have caused unease among some politicians and officials from the Partido Justicialista, as well as social activists and journalists. President Alberto Fernández faced a decision: either dismiss these rumors due to lack of evidence and push forward swiftly with Operation Blue Condor, or conduct a comprehensive audit of the army, which would slow the operation's implementation.\n\nIn the end, President Fernández chose to set these rumors aside, trusting that the army would not revert to extremist tendencies after the trials and lessons of the Dirty War. He reasoned that a full investigation might inadvertently provide strategic advantages to potential adversaries. As he reflected, “It doesn't matter what a cat is if it fights a mouse.” Only time will reveal whether this decision was correct, but acting on unsubstantiated claims could have caused unnecessary delays and risks to national security."
ARG_reforzar_propaganda_militar: "Reinforce the Propaganda of the National Army"
ARG_reforzar_propaganda_militar_desc: "After the defeat in the Malvinas War, following the end of the Dirty War and the National Reorganization Process, the Argentine Army was largely removed from public life, leaving a lasting stigma. Many ceased to respect our defenders, while volunteering declined as pacifist sentiments grew, with some even hoping Argentina would yield to its enemies to avoid casualties. That era of shame has passed, and now it is time to restore the army as a source of national pride.\n\nPresident Alberto Fernández plans to reintroduce military parades, reinforce ideological education in schools, and implement other initiatives to strengthen the army's presence in society. The goal is to cultivate patriots prepared to serve and defend Argentina against current threats such as Venezuela or any other adversary. By rooting the army firmly within the national consciousness and training ideological students, the nation ensures a strong, ready, and committed force, capable of safeguarding Argentina and inspiring respect for its defenders once again."
ARG_crisis_de_financiamiento: "Financial Crisis"
ARG_crisis_de_financiamiento_desc: "This was to be expected: America has fallen into a civil war, preceded by the collapse of Wall Street. Yet even more alarming is the onset of another economic crisis, potentially more severe than the one in 21. To make matters worse, the country's chief economist, Minister of Economy Martín Guzmán, is currently abroad on business, leaving Argentina without the ability to make rational, timely decisions in response to the unfolding situation.\n\nDespite his absence, President Alberto Fernández will implement a series of basic but essential measures to maintain economic stability until Martín Guzmán returns. The country is teetering on the edge of an unprecedented crisis, making his return critically important. For now, the government must weather the storm, taking precautionary steps while hoping that no further complications arise in the coming weeks. Strategic patience and temporary measures will be key to preventing the situation from deteriorating further, ensuring Argentina remains capable of facing this volatile period."
ARG_una_reunion_de_emergencia: "An Emergency Meeting"
ARG_una_reunion_de_emergencia_desc: "Minister of Economy Martín Guzmán is temporarily unable to return to Argentina, as he must complete urgent work abroad, which is far from the news President Alberto Fernández wanted to hear. In his absence, Guzmán recommended two highly capable figures to step in temporarily and help stabilize the economy. The first is Matías Kulfas, Minister of Productive Development, Guzmán's trusted right hand and a strong advocate for strengthening trade relations with Russia and China, emphasizing industrial growth and export opportunities.\n\nThe second is Guillermo Nielsen, President of YPF, who earned recognition for his successful management of Argentina's oil sector during recent crises and is well-known for his orientation toward cooperation with the European Union and international financial partners. Both individuals are extremely important at this moment, and carefully evaluating their proposals to navigate the ongoing economic emergency is a top priority. Ultimately, only one can be chosen to act temporarily, and the final decision rests entirely with President Fernández, whose judgment will determine the short-term stability of the nation and its capacity to withstand the global economic turmoil currently unfolding."
ARG_plan_nielsen: "Nielsen Plan"
ARG_plan_nielsen_desc: "In the end, the plan of Guillermo Nielsen, President of YPF, was chosen, as it offered the most rational and feasible path to address Argentina's economic crisis through a comprehensive industrialization strategy. Nielsen's track record includes successfully leveraging the Argentine oil sector to strengthen the national economy, which is especially crucial given the current volatile global situation. Among all proposals, his plan appeared the most logical and effective, prompting President Alberto Fernández to entrust him with implementing the industrialization agenda.\n\nIn Guillermo Nielsen's vision, a major part of the strategy involves significant investment in YPF to capitalize on rising global oil prices, generating profits that will be reinvested to refinance and expand national industries. This approach aims to revitalize Argentina's broader economy, stimulate production, and create jobs. Additionally, Nielsen will focus on attracting private investment, securing long-term agreements, and negotiating oil deals with multiple countries, including European nations and Japan, ensuring that Argentina can strengthen its economic independence and emerge more resilient in the face of ongoing international crises."
ARG_atender_problemas_industriales_arg: "Address the Problems of Industrialists"
ARG_atender_problemas_industriales_arg_desc: "Industrialists and small businesses in Argentina are facing enormous difficulties, particularly in light of the recent economic crisis. Entrepreneurs of all sizes, from small family-run shops to large corporations, are struggling and urgently need government support, which has become a central part of Guillermo Nielsen's industrialization plan. Following a comprehensive meeting with representatives of both large enterprises and SMEs, the most pressing problems were identified and reported directly to President Alberto Fernández.\n\nNow, these issues and their proposed solutions lie on the President's desk, awaiting action. Guillermo Nielsen emphasizes the need for market deregulation and targeted subsidies for key industries, aiming to revive small businesses and provide opportunities for larger companies to expand internationally despite the current economic instability. The subsidy program is intended to stimulate growth, foster competitiveness, and ensure that the industrial sector can navigate the crisis successfully. In the long term, Nielsen is optimistic that this strategy will stabilize the Argentine economy, but immediate action is essential to prevent further setbacks and preserve confidence in both domestic and international markets."
ARG_expander_el_oro_negro: "Expand the Argentine Black Gold"
ARG_expander_el_oro_negro_desc: "There was a time when YPF's oil fields spanned all of Patagonia, pumping vast quantities of oil and selling it to countries across the globe, generating enormous revenue for Argentina and securing its position as a regional energy leader. Unfortunately, those days are gone. YPF is now a shadow of its former self, and previous YPF presidents had little hope of restoring its past glory. However, Guillermo Nielsen has ambitious plans to revive the company and return it to prominence, envisioning a strategic roadmap for Argentina's energy independence and economic growth.\n\nThe first step in Nielsen's plan is to build and expand oil fields throughout Patagonia, creating thousands of strategic jobs and revitalizing Argentina's energy sector. In addition, he aims to restart the nationwide oil development program, reminiscent of YPF's glory days, ensuring production not only in Patagonia but in other provinces as well. With this expansion, Argentina will once again become a major oil exporter, attracting buyers from Europe, Asia, and the Americas. Naturally, alongside the growth of these oil fields, a series of structural reforms, technological upgrades, and regulatory updates will be necessary to ensure efficiency, profitability, and long-term sustainability."
ARG_acabar_deficit_ypf: "End the YPF Deficit"
ARG_acabar_deficit_ypf_desc: "YPF today is considered an overly bloated company, and because of this, the cost of each barrel of oil turns out to be too high and often simply unaffordable for the national budget. Guillermo Nielsen has long emphasized that the swollen structure of YPF is the true source of the problems: both the shortage of barrels and the excessive production costs stem from it. Recognizing this, President Alberto Fernández received from Nielsen a direct request for permission to initiate a major purge of employees. Fernández agreed without hesitation, since the proposal looked like the only rational solution under such circumstances.\n\nNow Nielsen intends to personally oversee the restructuring of YPF, removing redundant staff while keeping only the specialists truly needed to operate and expand the oil fields. This large-scale cleanup of the payroll will eliminate layers of bureaucracy and reduce expenses significantly. Inevitably, the process will be painful, but its results will free YPF from stagnation, streamline operations, and increase efficiency. Although the number of barrels may not rise immediately, the company will at least begin to work at a sustainable cost, which in itself is a step toward recovery and long-term stability."
ARG_innovar_extraccion_ypf: "Innovating the Extraction of YPF"
ARG_innovar_extraccion_ypf_desc: "YPF today is considered an efficient oil and gas company, especially after the reforms carried out through the Nielsen Plan, which gave it new momentum. Yet production remains lower than desired, and the methods of extraction are outdated, no longer corresponding to modern requirements. This prevents growth and weakens competitiveness. Another issue concerns the workers: many are ready to leave, which threatens stability and continuity. These difficulties together endanger the company's future, so action is urgently required. With the permission of President Alberto Fernández, Guillermo Nielsen received the authority to implement reforms, modernize production, and restore profitability.\n\nThe first step will be the introduction of updated extraction technologies, both in existing facilities and in new oil fields in Patagonia. This renewal should secure jobs and keep workers in place, while those who remain will be rewarded with better conditions and higher incentives. The strategy aims to raise overall output and increase revenue for the state. Though costs of extraction will inevitably rise and efficiency may fall in the short term, Nielsen insists this is a reasonable sacrifice to revive YPF, expand production, and regain its role as a leading force in Argentina's energy sector."
ARG_desarrollar_zona_petrolera_sur: "develop the Oil South"
ARG_desarrollar_zona_petrolera_sur_desc: "The south of Argentina, and above all Patagonia, represents a vast oil vein whose true potential has yet to be unlocked. YPF is already extracting resources there, but the largest deposits remain untouched due to a chronic lack of infrastructure. Without roads, pipelines, and proper facilities, development cannot move forward, and the nation risks losing a historic chance to bring its oil and gas industry to a completely new level. What is needed is strong state support, and with the approval of President Alberto Fernández, Patagonia could finally become one of the most important energy centers in the world.\n\nGuillermo Nielsen has already received this crucial authorization. Under his guidance, teams of workers are being dispatched to build infrastructure, ensuring that YPF can establish efficient transport and production networks across Patagonia. Roads will be laid, facilities erected, and logistical bases secured, creating the backbone for large-scale extraction. Once the foundations are in place, oil production will expand rapidly, profits will rise to unprecedented levels, and Patagonia will be transformed into a true land of black gold, fueling both Argentina's economic revival and the prosperity of its people."
ARG_nueva_epoca_ypf: "A New Era for YPF"
ARG_nueva_epoca_ypf_desc: "Yacimientos Petrolíferos Fiscales has traveled a long and difficult road since the beginning of the economic crisis and the bold adoption of the ambitious Nielsen Plan. Over the years, the company has managed to open new oil fields in Patagonia, gradually overcome serious internal inefficiencies, and build essential infrastructure in the far south to support large-scale oil extraction. Thanks to persistence and vision, YPF has endured every challenge and emerged stronger, transforming itself into something far greater than a simple oil and gas producer.\n\nToday President Alberto Fernández, together with Guillermo Nielsen, proudly proclaims the dawn of a new and brighter era of YPF. In this renewed chapter, the company will export barrel after barrel to powerful global markets, bringing immense profits into Argentina and securing a stronger position on the international stage. YPF will once again be a genuine source of national pride, as it was during its glorious past, and Argentina will rise to the rank of one of the leading oil exporters in the modern world. This time, no obstacle will be strong enough to undermine its enduring success and historic mission."
ARG_europa_is_clave: "Europe is Clave"
ARG_europa_is_clave_desc: "Europe remains heavily dependent on Russia for both gas and oil, which allows Russia to receive massive amounts of euros every year. Argentina, facing urgent economic challenges and in desperate need of reliable foreign trading partners, could greatly benefit from such inflows of euros. Recognizing this opportunity, and knowing that Guillermo Nielsen is a strong supporter of trade with the European Union rather than with China or Russia, a clear solution to the current economic crisis emerges.\n\nGuillermo will travel to Europe to meet with key European leaders, with the main objective of negotiating the supply of Argentine oil to European markets. Despite the geographic distance and logistical challenges, Europe is highly motivated to reduce its dependence on Russian energy, making them inclined to accept Argentina's proposals. For Argentina, the inflow of euros will provide much-needed economic relief, while Europe gains an alternative energy source. This mutually beneficial agreement represents a strategic victory for both sides and is effectively an offer that cannot be refused."
ARG_bonos_deuda_ypf: "YPF Debt Bonds"
ARG_bonos_deuda_ypf_desc: "YPF has achieved remarkable growth under the steady leadership of Guillermo Nielsen. An experienced liberal Menemist, Nielsen not only managed to revive the oil and gas industry but also turned YPF into a model that inspired companies across different sectors of the Argentine economy. Patagonia has firmly become the beating heart of national energy, and Patagonian oil is now exported worldwide as a valuable replacement for costly Russian supplies, offering many countries an opportunity to reduce their dependency on Moscow's influence.\n\nEncouraged by these achievements, Guillermo Nielsen is now preparing to issue YPF bonds on European markets in order to strengthen Argentina's image as a trustworthy partner. The funds raised from these bonds will be reinvested directly into YPF and subsequently channeled into other key Argentine industries, multiplying the benefits for the entire economy. Naturally, such an initiative will face fierce opposition from Marxists like Cristina Fernández de Kirchner, who will denounce it as a betrayal of their dogmas. Yet President Alberto Fernández has already granted Nielsen full carte blanche, ensuring that nothing—not even Cristina and her loyal faction—will be able to halt this ambitious plan that promises a new era of prosperity for YPF and Argentina itself."
ARG_inyeccion_de_capitales: "Capital Injection"
ARG_inyeccion_de_capitales_desc: "The success of the newly issued YPF bonds is still uncertain, and we will need to wait several months to see whether selling them was truly the right decision. Nevertheless, on the desk of YPF President Guillermo Nielsen lies encouraging news about a financial surplus that can already be directed toward meaningful purposes. Naturally, the most logical step would be to reinvest exclusively in YPF itself to secure greater long-term growth, yet the company has long pledged loyalty to Argentina, especially in a time of profound economic crisis such as the one the nation faces today.\n\nFor this reason, Guillermo Nielsen has decided to channel the surplus into other Argentine industries. His approach is gradual: beginning with smaller enterprises, then moving on to medium-sized firms, and ultimately supporting large national industries that form the backbone of the economy. By using YPF's capital to revive domestic production, he aims not only to strengthen Argentina as a whole but also to momentarily appease Cristina Fernández de Kirchner and reduce her desire to undermine his presidency of YPF. This careful balance of strategy, loyalty, and politics may prove decisive for the future of both the company and the country."
ARG_atraer_inversiones_industria_nac: "Attracting Investments to the National Industry"
ARG_atraer_inversiones_industria_nac_desc: "Many European investors have already expressed readiness to purchase YPF bonds, which would certainly be advantageous for the oil and gas company and its president, Guillermo Nielsen. Refusing such capital might seem almost absurd, yet Nielsen insists that YPF itself does not urgently require fresh investment. The true need lies within Argentina's productive base: the small, medium, and large national industries that had once functioned with remarkable efficiency before the devastating economic crisis. For this reason, Guillermo has shaped a broader plan aimed not merely at strengthening YPF, but at reviving the entire Argentine industrial landscape.\n\nAccording to this vision, Nielsen will encourage European investors to direct their funds into Argentine industries rather than exclusively into YPF. Beginning with small enterprises, continuing through medium-sized firms, and culminating with the largest strategic sectors, the investments would restore vitality to the nation's economy. It is true that some investors may hesitate, wary of unforeseen turbulence in times of crisis. Yet many already hold firm trust in Nielsen's leadership and are likely to follow his guidance, embracing the project not only as a financial opportunity but also as a contribution to Argentina's long-awaited economic renewal."
ARG_mejorar_competitividad: "Improving Argentina's Competitiveness"
ARG_mejorar_competitividad_desc: "The Argentine industry, once a proud engine of national progress, had long been hollow, lifeless from within, unable to withstand the ruthless competition of world powers that long ago erased Argentine factories from memory. Argentina became the “sick man” of South America, trapped in stagnation and decline, yet this was never meant to be its destiny. Now, a new horizon appears. Thanks to Guillermo Nielsen, president of YPF, steady streams of European investment are returning. Sleeping factories awaken, machines hum again, and entirely new plants begin to rise, bearing witness to a long-awaited rebirth.\n\nAmid these changes, President Alberto Fernández has declared his determination to restore the Argentine national industry, to make it strong enough to compete with the world and ensure that nations once more respect and value Argentine production. The vision is clear: a new era in which Argentina shall again stand as an industrial giant, exporting proudly to every corner of the globe. With the United States stumbling into crisis and Argentina's own storm beginning to fade, the path to renewal finally opens, and the nation can celebrate the promise of prosperity born of Nielsen's resolve."
ARG_hemos_superado_la_crisis: "Have we overcome the Financial Storm?"
ARG_hemos_superado_la_crisis_desc: "Guillermo Nielsen and Matías Kulfas came together to present their detailed reports to President Alberto Fernández, outlining the results of the bold policies carried out over the past years. The president welcomed their findings, for the economy is finally back in order and, according to most indicators, performing better than ever before. Argentina has once again assumed its historic role as a leading exporter of oil, agricultural goods, and industrial products, reestablishing itself as a vital player in the global marketplace. At the same time, the peso has recovered its lost prestige and become a strong world currency, respected and accepted abroad, while long-awaited domestic financial stability has finally been secured.\n\nThe greatest achievement of all, however, lies in the fact that Argentina has successfully shaken off the destructive aftershocks of the Wall Street crash of 2021. What once threatened to collapse the economy has been turned into an opportunity for recovery and renewal. For this, economists deserve deep gratitude, not only for their efforts during the COVID crisis but also for their tireless work in steering the nation through unprecedented turmoil. Special recognition belongs to Nielsen and Kulfas, whose vision and determination allowed Argentina to endure and emerge stronger. Yet, even as the country breathes a sigh of relief, both leaders remind the nation that the work is far from finished: true and lasting prosperity will require profound reforms and continuous effort"
ARG_plan_kulfas: "Kulfas Plan"
ARG_plan_kulfas_desc: "Matías Kulfas, Minister of Productive Development, unveiled his ambitious plan of industrialization as a decisive response to the ongoing economic crisis. The strategy envisioned a careful prioritization of low, medium, and high-development industries while simultaneously seeking capital inflows from BRICS nations, most notably China, to breathe new life into Argentina's exhausted factories. In such difficult times, the proposal struck a profound chord with President Alberto Fernández, who recognized in it not only pragmatism but also a long-awaited vision of national revival.\n\nInspired by this promise, President Fernández approved the plan in full, granting Kulfas carte blanche to advance boldly into the future of Argentine industry. Yet, this bold move ignited controversy among Menemists and liberal Peronists, who resented the empowerment of a socialist voice and feared both uncertainty of direction and the silent return of import substitution under a different name. For now, the nation stands at a crossroads, awaiting to see whether Fernández's gamble will lead Argentina into prosperity or into new storms."
ARG_ayudar_al_empresariado_arg: "Help the Argentine Business Community"
ARG_ayudar_al_empresariado_arg_desc: "Ingreso Familiar de Emergencia, ATP and other subsidy programs introduced during the Covid-19 pandemic proved decisive in allowing Argentines and national industry to endure one of the darkest moments in recent history. Economy Minister Martín Guzmán acted wisely in creating such instruments of support, while his closest collaborator, Matías Kulfas, understood that their legacy must not simply fade away. He now seeks to reinforce and expand them, convinced of their fundamental role in shielding Argentina from collapse. President Alberto Fernández, valuing both experience and necessity, is prepared to endorse this path without hesitation.\n\nThus begins a new stage in which Kulfas will work to strengthen ATP, IFE, and additional measures designed to sustain enterprises of every size, from the smallest family workshop to the largest national conglomerate. Memories of survival during the pandemic remain vivid, giving weight to the conviction that subsidies are vital. Debate will certainly arise over the scale of funding, yet the final word rests with Fernández, who, guided by trust, will choose the vision of Kulfas."
ARG_reducir_la_burocracia_estatal: "Reduce the State Bureaucracy"
ARG_reducir_la_burocracia_estatal_desc: "Thousands of public employees in Argentina still live entirely on state salaries without working at all or filling positions so irrelevant that they drain the national budget rather than serve the people. Month after month, hundreds of thousands of pesos are consumed by this swollen bureaucracy, resources that could instead sustain the revival of national industry or fund essential subsidies for struggling families. This problem is evident to everyone, from President Alberto Fernández himself to the most ordinary civil servant.\n\nDetermined to act, Fernández entrusted Matías Kulfas with the difficult mission of restructuring the system. The only realistic path, Kulfas argued, is twofold: compel those without real tasks to actively seek employment in the private sector, and relocate those trapped in useless posts to areas of the public administration where genuine labor is needed. In this way, the state would not only trim its bloated bureaucracy but also redirect precious funds back into the economy, providing relief in a moment of profound national crisis."
ARG_prestamos_accesibles: "Affordable and Competitive Loans"
ARG_prestamos_accesibles_desc: "Banks, strangled by a maze of excessive regulations, found themselves unable to provide loans to countless companies. This situation, harmful both to the state and to the private sector, condemned many firms to stagnation or even bankruptcy in the midst of crisis. Such obstacles, Matías Kulfas warned, only deepened the economic wounds, and he urged President Alberto Fernández to dismantle these burdensome rules that suffocated financial life.\n\nResponding to this call, President Fernández moved decisively, freeing banks from the weight of obsolete regulations and granting them once more the capacity to lend broadly. This shift became possible thanks to the flow of Chinese investments that Kulfas had secured for Argentina. Supported by the gradual stabilization of the peso, banks were encouraged to extend credit vigorously, in some cases even without interest, especially to small and medium-sized companies. Thus, rather than collapsing, these enterprises gained the chance not only to survive but to stand in competition, reviving the pulse of the national economy."
ARG_eliminar_regulaciones_absurdas: "Eliminate Absurd Regulations"
ARG_eliminar_regulaciones_absurdas_desc: "Argentina is weighed down by a maze of absurd regulations that entrepreneurs constantly denounce. Many of these rules exist less to ensure order than to extract revenue, yet in practice they suffocate industry and leave countless business owners unable to function properly. Worse still, such regulations create loopholes through which the powerful can evade taxes, deepening mistrust in the system. The problem has grown so evident that it now occupies the attention of President Alberto Fernández himself, making its resolution unavoidable.\n\nFaced with this challenge, Minister Matías Kulfas intends to persuade Fernández to eliminate many of these unnecessary barriers. Yet the reform will not come as a free gift to business; in exchange, Kulfas seeks commitments that will strengthen competitiveness. By freeing Argentine companies from suffocating restrictions while demanding responsibility, he hopes to transform them into true rivals of global firms. In this way, Argentina can reclaim its forgotten position in the world economy and restore pride in its national industry."
ARG_reforzar_industria_nacional: "Investments for the National Industry"
ARG_reforzar_industria_nacional_desc: "Banks demand state support just as urgently as small and medium-sized industrial companies. Yet the state cannot finance both at once, and under the plan of Minister Matías Kulfas the priority is granted to small and medium enterprises. Still, the sums involved are heavy, and their direct allocation from the public treasury risks exhausting national resources. For this reason, President Alberto Fernández entrusted Kulfas with the delicate task of designing a solution that would preserve industry without abandoning the financial sector.\n\nKulfas, relying on his ties with investors from China, proposed a pragmatic course. Instead of drawing endlessly from the state, Chinese capital will be directed into small and medium firms, allowing them to modernize and compete not only with Argentina's largest companies but even with international rivals. Meanwhile, state funds will be redirected toward banks, on the condition that private financial institutions in turn channel investment into industry. Thus, a balanced partnership between foreign investors, the state, and private banks may emerge."
ARG_buscar_swat_con_china: "seek a financial Swap with China"
ARG_buscar_swat_con_china_desc: "Since the turbulent days of the great crisis of 21, Argentina has borne the burden of distrust from foreign markets, scarred by unpaid debts and the constant shortage of foreign currency. The government, torn between the needs of its reserves, its obligations to creditors, and the industrial strategies proposed by Matías Kulfas, often found itself paralyzed. Yet President Alberto Fernández chose to act, granting Kulfas the authority to move forward with his boldest initiative.\n\nThe plan rested on a currency swap with China, forged through Kulfas's network of trusted partners and long-standing investor ties. This mechanism would not only diversify Argentina's debt portfolio but also secure a steady flow of foreign currency to the state. Such resources, directed simultaneously toward strengthening reserves, honoring external obligations, and supporting industrial development, became the cornerstone of a renewed strategy. Thus, through Fernández's approval and Kulfas's diplomacy, Argentina sought to reclaim stability and revive faith in its economy."
ARG_acrecentar_credito_financiero: "Increase Financial Credit"
ARG_acrecentar_credito_financiero_desc: "Chinese renminbi began to flow into Argentina through the currency swap negotiated by Matías Kulfas, yet their potential remained largely unused. National finances stayed fragile, weighed down by chronic instability and the precarious position of companies such as YPF, which reflected the broader weakness of the industrial sector. Still, Kulfas envisioned a bold strategy to stabilize the domestic system, one he was determined to see through despite skepticism.\n\nHis idea rested on a simple but ambitious principle: if significant amounts of foreign capital consistently entered Argentina, the market itself would gradually begin to circulate and encourage lending within domestic financial structures. This, in turn, would foster resilience and provide the first solid foundation for lasting stability, something the nation had lacked for decades. Though the process would inevitably be slow, Kulfas believed it would anchor Argentina against external shocks and internal crises. In his view, such measures were the only realistic way to withstand the storm unleashed by Wall Street's collapse and the profound decline of the United States."
ARG_un_peso_argentino_fuerte: "A Strong Argentine Peso"
ARG_un_peso_argentino_fuerte_desc: "Having already taken decisive action with the surplus money, the government now approaches what appears to be the final and most important stage of the long-awaited transformation: securing a strong Argentine peso with real value and recognition on world markets. Over time, we managed to attract solid Chinese investments into our economy, a truly remarkable achievement that injected confidence into the domestic system. We also tackled the bloated layers of government bureaucracy and dismantled numerous unnecessary obstacles, while simultaneously implementing many smaller reforms. Together, these measures created a coherent strategy that brought Argentina close to the ultimate goal — a peso respected at home and valued abroad. Now, the only missing element is the last formal approval from President Alberto Fernández, after which the path forward will be open.\n\nThe outcome of these carefully calculated adjustments, envisioned and defended by Matías Kulfas, is expected to be nothing less than historic: the establishment of the Argentine peso as a genuinely strong and stable international currency. For the first time in decades, foreign partners will finally accept the peso for trade without hesitation, signaling that Argentina has returned to the global stage with credibility. Thanks to Kulfas's decisions, the nation can dream again of being not just a participant, but one of the leading exporters shaping global markets."
ARG_incrementar_exportaciones: "Increase Exports"
ARG_incrementar_exportaciones_desc: "Although common sense would suggest channeling surplus money into the national reserve to strengthen the peso and avoid a repeat of the catastrophic 21 economic collapse, Matías Kulfas envisions a completely different, far more radical and risky path that he believes could bring Argentina remarkable results. During an intense and heated debate inside government circles, Kulfas and his group of determined supporters managed to impose their vision, leaving President Alberto Fernández with little choice but to approve this daring plan, hoping that fortune and reason will align, and praying that history will not repeat itself in the form of another devastating banking collapse.\n\nThe essence of this plan is simple yet ambitious: instead of immobilizing capital inside reserves, the government will inject excess funds directly into agricultural and industrial exporters, betting that a surge in exports will logically attract an inflow of foreign currency. This inflow should not only stabilize but also raise the value of the peso while simultaneously generating sustainable economic growth capable of supporting long-term expansion of Argentina's productive sectors. Kulfas remains confident that strengthened exports will guarantee reliable demand abroad, securing Argentina a firm position on international markets for years to come"
ARG_aumentar_las_reservas: "Increase the National Reserves"
ARG_aumentar_las_reservas_desc: "The 21 economic crisis erupted when Argentina lacked the necessary funds to cover its obligations at the exact moment when citizens rushed en masse to withdraw their deposits from banks and liquidate their assets in national markets. This chain reaction forced the government to extract money from the banking system itself, collapsing confidence overnight and sparking the infamous crisis. The memory of those events remains one of the most painful yet most valuable lessons for Argentina: it demonstrated not only what can go wrong when reserves are depleted, but also what mechanisms can be adopted to ensure such a catastrophe does not repeat.\n\nFrom this painful experience arises the conviction of Matías Kulfas, who wants to persuade President Alberto Fernández to direct every surplus of government resources into strengthening national reserves while simultaneously covering essential state expenses through a planned system, rather than draining the banks. By doing so, Argentina can shield itself against even the faintest echoes of 21 and maintain stability in times of pressure. Citizens, in turn, will appreciate Kulfas for his foresight, his willingness to act preventively, and his determination to show that the government has learned from history. Time, as always, will be the ultimate judge, but in this case it may confirm that such prudence was exactly what Argentina needed."
ARG_una_tormenta_politica_inestable: "An Unstable Political Storm"
ARG_una_tormenta_politica_inestable_desc: "President Alberto Fernández has suffered a devastating blow from the opposition after deciding to personally lead the PJ and FdT campaign. JxC secured their seats, and for the first time in forty years, the PJ lost its majority in parliament. This defeat not only weakened Fernández but etched a permanent stain on his legacy—one that history will not forget. Yet the greatest danger is not this stain. Something far worse is approaching. A storm is coming—a massive, unrelenting storm—and it is not the opposition that brings it.\n\nThis political tempest rises from within: from Cristina Kirchner and her loyal followers, who obey her every word. They are now prepared to destroy President Fernández and his closest allies, resorting even to death threats and intimidation to secure Cristina's dominance. And this time, Alberto can do nothing. He stands powerless, watching as his vision crumbles at her hands. Alberto Fernández is no longer the President. He is now only Old Man Alberto."
ARG_un_frente_roto: "A Broken Front"
ARG_un_frente_roto_desc: "Frente de Todos—the name promised unity, a vast umbrella for every branch of Peronism: federalists, pragmatic Menemists, radical Kirchnerists, even those leaning toward Marxism. For a time, this experiment in consensus seemed to work. The coalition prided itself on dialogue, claiming to respect every voice, no matter how discordant. But ambition broke the balance. Captain Beto—President Alberto Fernández—sought to lead the 2021 legislative campaign, not as a figurehead but as the strategist in command.\n\nThe campaign collapsed, and with it the fragile unity that held the FdT together. Today, Frente de Todos stands fractured. Sergio Massa rallies his technocrats; Fernández clings to fading loyalists; and towering over both, Cristina Kirchner tightens her grip. Every faction fights for survival, but Alberto and Sergio share one fear: Cristina's relentless ambition. If unchecked, it will consume the coalition, leaving behind only ruins where once stood the promise of a common front."
ARG_reunion_de_emergencia_con_cafiero: "Emergency Meeting with Cafiero"
ARG_reunion_de_emergencia_con_cafiero_desc: "The Frente de Todos is deeply fractured. The Kirchnerists, on principle, refuse to support any proposal advanced by allies of President Alberto Fernández, and at times even those aligned with Sergio Massa. They have become the central obstacle, for their intransigence has paralyzed legislative action, stalling the economic reforms championed by Economy Minister Martín Guzmán. As a result, the monetary crisis grinds on, striking directly at the already diminished credibility of the weary old Fernández.\n\nTo salvage the situation and somehow maneuver Guzmán's program through a chamber that has become effectively hostile, Fernández is now seeking to confer with the Minister of Foreign Affairs, International Trade and Worship Santiago Cafiero. Together they hope to devise a workable strategy to shepherd the reforms past both the entrenched Kirchnerist faction and the eager right-wing opposition. Only by doing so, they believe, can Argentina find a stable path forward and begin to break free from the suffocating grip of the ongoing economic turmoil."
ARG_buscar_votos_en_la_oposicion: "Seeking Votes from the Opposition"
ARG_buscar_votos_en_la_oposicion_desc: "Foreign Minister Santiago Cafiero, together with President Alberto Fernández—if that title still carries weight—has drafted a plan to advance the economic program of Economy Minister Martín Guzmán through a parliament riddled with obstacles erected by both the opposition and dissenters within the ruling coalition. Their shared goal is survival in a hostile legislature where many would rather see Fernández humiliated, his reputation reduced to rubble, and his presidency cut short. Yet despite these hopes, such an outcome is far from certain.\n\nA crucial part of the strategy lies in extracting as many votes as possible from Cambiemos, leveraging every potential concession to secure support for Guzmán's reforms. Fernández is prepared to bargain with anyone willing to contribute even a single decisive vote, regardless of political cost. Inevitably, critics will accuse him of betraying Peronism, but in a moment when his own party has turned its back and Argentina itself sinks deeper into crisis, there is simply no alternative left."
ARG_promesas_politicas_baratas: "Cheap Political Promises"
ARG_promesas_politicas_baratas_desc: " Foreign Minister Santiago Cafiero, together with President Alberto Fernández—if that title still carries weight—has drafted a plan to advance the economic program of Economy Minister Martín Guzmán through a parliament riddled with obstacles erected by both the opposition and dissenters within the ruling coalition. Their shared goal is survival in a hostile legislature where many would rather see Fernández humiliated, his reputation reduced to rubble, and his presidency cut short. Yet despite these hopes, such an outcome is far from certain.\n\nThe plan relies on reinforcing governance by securing commitments from politicians across the spectrum, though such pledges may prove hollow given the battered standing of the president. From members of Cambiemos to figures within the Partido Justicialista and the Frente de Todos, promises are expected in the name of Argentina's stability. If honored, they could provide a fragile shield of calm, allowing the remainder of old Alberto's first term to pass with fewer storms and a semblance of order until the elections of 2023."
ARG_la_ofensiva_de_cristina: "Cristina's Offensive"
ARG_la_ofensiva_de_cristina_desc: "Old man Alberto Fernández sits with a report in his hands—a report he never wished to read. The past weeks have been pure torment for a president who no longer feels like one. Losing popularity is the least of his worries now; looming above all are the threats from Cristina Kirchner and her Marxist loyalists. Alberto knows he's cornered, yet this document crushes him further: as its author claims, it is undeniable proof of a planned coup.\n\nAnd the worst part—it's true. For the first time, Fernández sees the full scale of Cristina's conspiracy and her resolve to drive him out of power. Once, perhaps, he could have fought back. Now, he is powerless, trapped in a game where every move favors her. But Alberto has one last idea: to push Silvina Batakis, a fervent Kirchnerist, into the spotlight, hoping the gesture buys him time—enough to delay the coup, enough to salvage what little remains. For the old man, it's not about winning anymore; it's about surviving."
ARG_un_alberto_solitario: "A Lonely Alberto?"
ARG_un_alberto_solitario_desc: "There was a time when President Alberto Fernández presided over a united government, a coalition where his loyalists coexisted with Cristina Kirchner's camp. In those days, harmony prevailed, promises were fulfilled, and ideas became policy. Congress followed his lead, the opposition lacked control, and Alberto's voice shaped the nation's course. Back then, he was not just president in title—he was the true architect of Argentina's direction.\n\nBut those days have vanished. Now comes the era of decline, a bitter winter for the man once called Captain Beto. The government is fractured, poisoned by Cristina's threats and ruthless purges that stripped Fernández of his closest allies. His ministers are gone, his influence fading, and whispers mock him as “the old man.” Yet Alberto refuses to surrender entirely. To block Cristina's ascent, he contemplates the unthinkable—allying with Sergio Massa, ceding real power to him in exchange for a last chance to stop the woman who seeks to rule it all."
ARG_el_final_de_super_alberto: "The End of Super Alberto"
ARG_el_final_de_super_alberto_desc: "This is the end for President Alberto Fernández—or rather, the weary old man Alberto Fernández—who has now irretrievably lost his once-vaunted presidential superpower. For years, initiatives that seemed doomed in Congress would miraculously succeed with a mere flick of Fernández's hand, but that magic has vanished. Today he remains president in name, yet in truth he has become little more than a figurehead, for the substance of power has slipped away from his grasp and now lies scattered throughout the labyrinthine corridors of the Frente de Todos.\n\nWorse still, the discredited parliamentarians—those who bow obediently to the will of Cristina Fernández de Kirchner, and even the opportunistic opposition eager to auction off the nation's dignity—refuse to permit Fernández any fragment of authority. Indeed, they act against him with a fervor equal to the Kirchnerist hardliners themselves. Thus concludes the strange saga of “Super-Alberto.” No longer a leader commanding extraordinary influence, he has been reduced to a puppet, dangling on strings pulled relentlessly by the Kirchnerist machine."
ARG_caida_de_leales: "The Fall of the Loyalists"
ARG_caida_de_leales_desc: "This is the end. Economy Minister Martín Guzmán, together with several colleagues valuable in both politics and economics, has resigned. Despite everything President Alberto Fernández attempted—despite a fleeting calm in Argentina's political life, despite Guzmán's painstaking negotiations with the IMF, and despite even the old man's few successes after the defeat in the 2021 parliamentary elections—they still chose to step down, driven by the suffocating influence of Cristina Fernández de Kirchner.\n\nTragically, their departure only strengthens her grip. The sole loyalist left to Fernández within the cabinet is Foreign Minister Santiago Cafiero, while the vacated posts have already been filled by Kirchnerist figures. Most striking is the elevation of Silvina Batakis, arguably the least suited candidate for the crucial role of Economy Minister, yet one whom Fernández reluctantly appointed. Now the loyalist ranks stand shattered, the Kirchnerists ascend with renewed force, and the president himself lingers as a leader in name only, stripped of real authority."
ARG_etapa_batakis: "the batakis stage"
ARG_etapa_batakis_desc: "Silvina Batakis, an uncompromising Kirchnerist and radical extremist, has now assumed the office of Economy Minister. In tragic irony, she embodies the very opposite of the pragmatic and rational approach once offered by her predecessor, Martín Guzmán. While Guzmán sought balance and credibility, Batakis appears intent on imposing a rigidly Marxist-Kirchnerist framework. Were it only a matter of rhetoric, her appointment might have been less alarming, but as it stands she has already revealed herself to be a deeply unsuitable guardian of Argentina's economy.\n\nHer promises are staggering in their recklessness, echoing the most extreme ideological currents. She threatens to dismantle the fragile foundations built under Guzmán, dragging the country further into the monetary abyss from which it had only partially emerged. Yet Cristina Fernández de Kirchner's dominance compels the government to yield, leaving Batakis free to pursue her destructive agenda. President Alberto Fernández, stripped of agency, watches helplessly as Argentina is driven deeper into crisis."
ARG_otra_devaluacion: "the other devaluation?"
ARG_otra_devaluacion_desc: "Silvina Batakis wasted no time in her first days as Economy Minister, taking bold steps to assert her vision. Among her earliest promises was a plan to devalue the Argentine peso in the name of making it “competitive.” This announcement was greeted with jubilation by Marxist-Kirchnerist loyalists and other radicals aligned with Cristina Fernández de Kirchner. At first glance, the move might appear beneficial, suggesting a short-term remedy for the nation's ills.\n\nYet the reality is far more dire. Such a reckless strategy threatens to dismantle the fragile progress achieved under Martín Guzmán and his allies, including Matías Kulfas, in stabilizing inflation and bolstering imports. The ideological zeal that fuels Batakis risks plunging Argentina deeper into crisis, undoing years of painstaking work. Another destructive devaluation now seems inevitable, one that President Alberto Fernández lacks the power to block. Resigned to impotence, he must accept a new and destabilizing economic order imposed by forces beyond his control."
ARG_buscar_credito_extranjero: "looking for credits abroad"
ARG_buscar_credito_extranjero_desc: "As part of her earliest days in office, Economy Minister Silvina Batakis has pledged to seek loans from nations across the globe. She intends to appeal to every available country, accepting whatever terms are offered, regardless of the burden of interest, simply to secure fresh funds. Backed enthusiastically by the Marxist Kirchnerists and by Cristina Fernández de Kirchner herself, Batakis presents this course as salvation. Yet its consequences reveal the dangers of such radical thinking.\n\nArgentina would soon find itself indebted to more countries, and in greater sums, than at any point in its history, placing the nation in a humiliating position before the international community. Even hostile regimes such as Venezuela could hold leverage, reducing Argentina not to a respected power but to an object of derision, staggering under the weight of endless obligations. Nevertheless, President Alberto Fernández, stripped of effective influence, lacks the means to resist. He is compelled to endure as Batakis drives the nation deeper into dependence."
ARG_el_super_ministro_sergio_massa: "the super minister Sergio massa"
ARG_el_super_ministro_sergio_massa_desc: "Chaos finally overtook Silvina Batakis as a direct result of her reckless policies. Through careful maneuvering we managed to “suggest” her resignation in a way that appeared voluntary, ensuring that Cristina Fernández de Kirchner could not cast blame upon us. The plan worked, and Cristina remains unaware that Batakis's departure was orchestrated behind the scenes. Yet the turmoil she unleashed continues to haunt the government and the nation, demanding urgent remedies.\n\nInto this vacuum steps Sergio Massa, not merely as Economy Minister but as a newly minted “super minister,” consolidating multiple portfolios and secretariats under his command. Endowed with sweeping authority, Massa is set to become the de facto leader of Argentina, wielding influence that surpasses even President Alberto Fernández. For all his flaws, it is nonetheless preferable that Massa governs, rather than leaving the nation's fate in the grip of Cristina's loyalists. In this balance of power, Argentina gains at least a fragile chance of stability."
ARG_un_nuevo_horizente_politico: "a new political horizon"
ARG_un_nuevo_horizente_politico_desc: "Peronism, the populist movement named after Juan Domingo Peron and shaped also by the legacy of Eva Peron, has long stood as a “third position” ideology, blending elements of both the left and the right. For decades it offered a center that balanced opposing forces, until the tragedy of the Ezeiza massacre shattered that balance. With the left branded as terrorists and purged from the movement, the right came to dominate, igniting the Dirty War that ravaged Argentina until 1983.\n\nIn the years that followed, the Partido Justicialista drifted from Peronism's original principles—first veering to the right under Carlos Menem, then to the left under Néstor and Cristina Fernández de Kirchner. Now Economy Minister Sergio Massa proposes a new horizon: to restore Peronism to its authentic third-position identity, uniting left and right once again. His ambition is not merely ideological but political, to consolidate authority as Peron once did during his first term, but this time in the name of Argentina's renewal."
ARG_leves_turbulencias_economicas: "Mild Economic Turbulence"
ARG_leves_turbulencias_economicas_desc: "Argentina's economy is at a fragile point: neither collapsing into a deeper monetary crisis nor recovering from it. Inflation remains high after Silvina Batakis's reckless devaluation, while imports are still reduced, preventing a real stabilization. We are resisting inflation and attempting to lower import costs, yet these measures are insufficient. If we fail to take radical action now, Argentina will remain trapped in stagnation, unable to overcome the monetary crisis that has haunted us for years.\n\nThat is why Economy Minister Sergio Massa is preparing profound structural reforms aimed at reshaping the system. He warns the population to “fasten their seat belts,” because the country may soon enter a zone of “moderate economic turbulence” that could alter the daily lives of millions. This turbulence, however, is not a collapse but a necessary phase of transformation. By risking the fragile stability of today, Massa seeks to create the conditions for a lasting recovery tomorrow, ensuring Argentina finally breaks free from the cycle of crisis."
ARG_la_nueva_diplomacia_fernandezmassa: "the new Fernández-massa diplomacy"
ARG_la_nueva_diplomacia_fernandezmassa_desc: "For years Argentina has confined its foreign policy to a narrow circle of partners, particularly since the outbreak of the American Civil War and the Brazilian Civil War. By backing Chile and Uruguay, we secured limited cooperation and forged only a modest alliance with Uruguay and Paraguay, while Chile remains mired in partial isolation. Meanwhile, we have failed to cultivate broader alliances to confront the threat posed by Chavista Venezuela to the north, even straining relations with certain nations over contentious immigration disputes.\n\nNow Sergio Massa has proposed a dramatic pivot: to turn Argentina's foreign policy a full 18 degrees. His vision is to redefine alliances on the basis of reliability, concentrating on practical partnerships to counter Venezuela's growing influence. This pragmatic approach abandons lofty ideals in favor of hard realities. President Alberto Fernández, recognizing the urgency of the moment, is prepared to endorse Massa's initiative. For Argentina, the time has come to act with pragmatism rather than illusions."
ARG_promesas_de_don_sergio_al_kirchnerismo: "Don Sergio's Promises to Kirchnerism"
ARG_promesas_de_don_sergio_al_kirchnerismo_desc: "The CGT, along with Kirchnerists of every shade—from the cautious reformists to the uncompromising hardliners—seems to have lost confidence in Economy Minister Sergio Massa and in President Alberto Fernández. This development is nothing short of catastrophic, for without their backing the government risks collapsing into isolation, transformed into an administration so unpopular that even its own party members openly scorn it. In order to avert this disaster, support must be regained swiftly and decisively, no matter the cost or the compromises required.\n\nFor this reason Massa intends to embark on a broad political campaign aimed squarely at both the CGT and La Cámpora, the most emblematic Kirchnerist organization in Argentina. The campaign will be accompanied by a torrent of promises: structural reforms presented in the language of Juan Domingo Peron and the Kirchners, as well as populist pledges designed to appeal directly to workers and activists. If successful, this strategy will not only secure their electoral support but also extend the government's survival, providing a fragile but crucial bridge to the coming elections."
ARG_hay_que_pasar_el_invierno: "We have to spend the winter"
ARG_hay_que_pasar_el_invierno_desc: "On June 29, 1959, Alvaro Alsogaray, then Minister of Economy under President Arturo Frondizi, uttered his famous phrase: “hay que pasar el invierno” — “we have to survive the winter.” At that moment, Argentina, still shaken after the overthrow of Peron in 1955, was facing inflation rates above 1%. To address this crisis, Alsogaray imposed harsh austerity measures: cutting subsidies, reducing state spending, and devaluing the peso. His policies succeeded in lowering inflation from 13% to around 8%, and became an enduring symbol of Frondizi's experiment with neoliberal economics.\n\nMore than sixty years later, Economy Minister Sergio Massa is ready to echo that same message. Despite belonging to a Peronist government, Massa proposes measures similar to Alsogaray's: reduction of subsidies for public services, devaluation of the peso, strict limits on money emission, and a clear orientation toward international investment. Massa assures Argentines that if they are able to “survive the winter,” then prosperity will return in the spring and summer, bringing stability and growth back to the country."
ARG_dilapidar_a_juntos_por_el_cambio: "Squander Juntos por el Cambio"
ARG_dilapidar_a_juntos_por_el_cambio_desc: "Juntos por el Cambio is often presented by opposition forces and especially by anti-Kirchnerist journalists as the “best coalition” and the only possible savior of Argentina. For them, Mauricio Macri is praised as the greatest statesman of the 21st century, the leader who supposedly freed the country from the “authoritarian shadow” of Peronism. All neoliberal voices repeat the same mantra: that Peronism is synonymous with authoritarianism, stagnation and corruption. Yet in reality, those same neoliberals justify any measure, no matter how destructive, as long as it weakens Peronism, because they know that Peronism is the true threat to their privileges. They manipulate the media, brainwash citizens and deceive voters, trying to make Cambienos appear as a coalition that “cares” about the people.\n\nThe candidate insists that such lies cannot go unpunished. Just as Mauricio Macri must be unmasked as a failed neoliberal, Cambienos must be exposed as a party of the oligarchs and the wealthy elite, far from the interests of ordinary Argentines. Behind their promises of modernization hides a project that benefits only a small group of rich businessmen. Union por la Patria and the Partido Justicialista, in contrast, are the only real political force that truly defends the people, their rights and their dignity."
ARG_responder_al_peronismo_federal: "Respondiendo al Peronismo Federal"
ARG_responder_al_peronismo_federal_desc: "Juan Schiaretti, governor of Cordoba and leader of the federal Peronists Hacemos in parliament, has long been a thorn in the side of true Peronism. Known as “El Gringo,” he built his entire political career on constant disobedience to the federal government since the times of Néstor Kirchner. Year after year, Schiaretti and his allies undermine unity, oppose the national leadership from Buenos Aires, and try to present themselves as defenders of “real” Peronism, while in fact taking away valuable votes and weakening the movement from within. Their actions harm not only the Partido Justicialista but also Argentina itself, opening the way for neoliberal opposition.\n\nFor this reason, the candidate will no longer remain silent. “El Gringo” and his circle must be unmasked as Menemists and rebellious governors, enemies of unity and solidarity. The campaign will publicly denounce them, destroying their false reputation and exposing their lies. If the voice of Schiaretti loses credibility, then federal Peronists will finally recognize the truth, rally around the Union por la Patria, and support the only force truly capable of leading Argentina forward."
ARG_acuerdo_fmi: "The IMF Agreement Vote"
ARG_acuerdo_fmi_desc: "Election day has passed. We stretched that moment as long as possible in hopes of shaping it to our advantage. Yet under the plan orchestrated by Foreign Minister Santiago Cafiero, we managed to win the backing of numerous Cambiemos deputies, thereby strengthening our standing both in Congress and across the nation. Guzmán's long-delayed bill, embodying the measures negotiated with the IMF, could no longer be postponed. The time had come to put Cafiero's design to the test.\n\nAnd against all odds, the strategy prevailed. By a narrow margin, Congress endorsed every measure presented by Economy Minister Martín Guzmán, bringing the resolution of the monetary crisis within closer reach. President Alberto Fernández, contrary to the wishes of his adversaries, refused to bow to pressure or resign. This hard-fought survival ensures he can complete his term with relative calm while offering his remaining loyalists a modest but real measure of stability and reassurance in Argentina's turbulent political landscape."
ARG_dolar_soja: "Create the Soy Dollar"
ARG_dolar_soja_desc: "Argentina has been the world's leading exporter of soybeans since the 1980s, experiencing several great booms. First came the introduction of GMO soy in 1996, then the global demand peaks of the 2s and early 21s, which consolidated soy as one of the main pillars of the Argentine economy. By 2020, soybeans had even become the primary source of pesos for the state budget. However, in recent years, this golden era was interrupted. A severe drought, together with the lasting effects of global crises such as the Wall Street collapse and the internal economic turbulence left by political instability, drastically reduced Argentina's capacity to export soy, generating a budget deficit and removing one of the last reliable inflows of hard currency.\n\nIn response, Economy Minister Sergio Massa now seeks to revive exports through a bold and controversial measure: the creation of a so-called “soy dollar.” This would mean setting a special exchange rate for soybean exporters at 2 pesos per dollar, making exports far more profitable and encouraging producers to sell abroad. Although the idea first appeared during Silvina Batakis's short tenure, Massa intends to apply it decisively, recognizing it as one of her few valuable contributions to economic policy."
ARG_condenar_las_maniobras_de_venezuela: "condemn the maneuvers of Venezuela"
ARG_condenar_las_maniobras_de_venezuela_desc: "Venezuela overestimates itself, blind to the fate it would face for its expansionist ambitions had the United States not collapsed into civil war. With Brazil likewise torn apart, Argentina stands as the last stronghold of freedom and democracy in South America against the rising tide of Chavista aggression. What Caracas pursues is not mere rhetoric but a project of imperial conquest, a gradual militarized domination of the continent that we cannot and will not permit.\n\nFor now, Economy Minister Sergio Massa, speaking on behalf of the Foreign Ministry, will issue formal denunciations of every Venezuelan maneuver following this declaration of expansionist intent. Argentina will deliver total condemnation, further chilling relations already frozen to the core. Perhaps such pressure will not stop Venezuela outright, but it may slow its war machine and, more importantly, buy us precious time. That time must be used wisely—to prepare with resolve for the looming struggle over the destiny of South America."
ARG_gira_crediticia_de_massa: "Massa credit tour"
ARG_gira_crediticia_de_massa_desc: "Argentina once again finds itself trapped by a widening budget deficit. The dismantling of Martín Guzmán's most effective programs has dried up critical revenue streams, plunging the nation back into the depths of monetary crisis. Inflation surges unchecked, compounded by the peso's reckless devaluation under Silvina Batakis. Argentina cannot afford to lose the fragile gains achieved since President Alberto Fernández took office. A new course of action is essential.\n\nSergio Massa has put forward such a course. His plan centers on securing loans and credits from global powers—Russia, China, and European states such as Germany and France—to restore financial stability. Critics may dismiss this as subservience to superpowers, yet Massa insists the terms will be crafted to benefit Argentina rather than foreign lenders. In his vision, these agreements will provide not only urgently needed funds but also renewed credibility and international respect. With this “credit tour,” Massa hopes to deliver the resources Argentina so desperately requires."
ARG_reforzar_al_operativo_condor_azul: "reinforce the Condor Azul operation"
ARG_reforzar_al_operativo_condor_azul_desc: "Operation Blue Condor was all but buried in the aftermath of the Frente de Todos' defeat in the 2021 legislative elections. The incoming Kirchnerist ministers refused to support the initiative, suspending it as though blind to both the looming threat from Venezuela and the inadequacy of Argentina's armed forces against Chavista aggression from the north. Yet those were different times, and now the circumstances have shifted dramatically.\n\nEconomy Minister and de facto president Sergio Massa is prepared to restore funding and breathe new life into Operation Blue Condor. Alongside renewed efforts to procure weapons, he seeks to accelerate progress so that the program reaches completion by the time he formally assumes the presidency in December 2023. Within political circles there is little doubt that this outcome is inevitable, even among Massa's opponents. The only question that remains is whether the military can meet the ambitious deadline and finally realize the vision of a rearmed Argentina."
ARG_comprar_nuevas_armas_para_el_ejercito: "buy new weapons for the army"
ARG_comprar_nuevas_armas_para_el_ejercito_desc: "The military was once set to receive modern arms through Operation Blue Condor, an ambitious program designed to rebuild Argentina's defense capabilities. Yet the government crisis engulfed President Alberto Fernández before he could advance the initiative, consigning it to the archives as little more than a failed attempt. With the loyalists who had supported both the program and Fernández himself now displaced, Operation Blue Condor seemed destined to vanish without hope of revival under the new order.\n\nBut Economy Minister Sergio Massa envisions a different path. Alongside his mission to secure international loans, he intends to quietly explore options for acquiring weapons and rearming the Argentine military. His aim is to resurrect Operation Blue Condor from the ashes, restoring its promise and transforming the armed forces into South America's elite. With renewed strength, the Argentine army could finally stand prepared to defend the nation against Venezuela and any other threat that dares to challenge its sovereignty."
ARG_una_argentina_con_garantias_de_inversiones: "Una Argentina con Garantias de Inversiones"
ARG_una_argentina_con_garantias_de_inversiones_desc: "Una Argentina con Garantias de Inversiones"
ARG_combatir_a_la_derecha_argentina: "Fighting the Argentine Right"
ARG_combatir_a_la_derecha_argentina_desc: "La Libertad Avanza is a relatively new but already influential right-wing coalition created by libertarian Javier Milei for the 2021 legislative elections. What initially appeared to be a minor experiment quickly turned into a political earthquake: the coalition achieved unexpectedly strong results, signaling a deep frustration with the traditional parties and placing LLA as a radical alternative to Juntos por el Cambio. Since then it has only expanded its influence, steadily attracting citizens disillusioned by economic crisis and inspired by Milei's aggressive rhetoric. If this trend continues, LLA may soon become the largest opposition force, or even win the elections themselves, which would be disastrous for Argentina, as a libertarian government would dismantle every institution built by Peronism.\n\nThat is why the Minister of Economy Sergio Massa has resolved to instruct President Alberto Fernández to act decisively. LLA's popularity must be reduced by all political means, exposing their reckless promises and their willingness to sell the nation to foreign powers. A Milei presidency would mean collapse, so we cannot allow libertarians to seize control of Argentina."
ARG_combatir_al_antikirchnerismo: "Fight Anti-Kirchnerism"
ARG_combatir_al_antikirchnerismo_desc: "Juntos por el Cambio, and in particular PRO and UCR, remain the traditional anti-Peronist and anti-Kirchnerist opposition, fighting year after year for every seat in parliament against the Justicialist Party. Even though La Libertad Avanza is rapidly gaining popularity and appears dangerous in the short term, it is still a temporary challenge, while the true and constant threat comes from Cambiemos, which continues to undermine and dismantle the legacy of Peron and the Kirchners in favor of their liberal dogmas.\n\nThat is why Minister of Economy Sergio Massa will advise President Alberto Fernández to concentrate political fire not on LLA but on Cambiemos and the Federal Peronists. Both of these factions have repeatedly proven to be far more dangerous for Buenos Aires and for the stability of Argentina itself, since unlike LLA we already know exactly what they are capable of in their pursuit of power. Therefore, it becomes urgent to put an end to this state threat once and for all, even if critics say that destroying JxC could bring temporary turmoil."
ARG_alberto_se_baja_del_barco: "Alberto drops out of the race"
ARG_alberto_se_baja_del_barco_desc: "Unfortunately, President Alberto Fernández has officially informed his closest subordinates that he will not seek re-election in 2023, realizing that his reputation and popularity among the people have collapsed and that his time has passed. He wants to give way to young and ambitious politicians, ready to implement their projects and ideas regardless of obstacles, unlike the tired and weakened Alberto. This announcement was met with sadness and even tears from many loyalists, and with sympathy from members of the PJ and, surprisingly, even from certain Kirchnerists who once opposed him.\n\nBut for Economy Minister Sergio Massa, this development opens an extraordinary path, an opportunity that comes only once in a lifetime: the chance to become President of Argentina. With no other strong or clear contenders for the nomination of the Justicialist Party in the 2023 elections, Massa emerges as the natural and almost inevitable candidate, facing no serious opposition inside the movement. Thus, under his leadership, Argentina will be guided into the future under the renewed banner of Peronism."
ARG_reforzar_el_plan_potenciar_trabajo: "Strengthen the Potentiate Work Plan"
ARG_reforzar_el_plan_potenciar_trabajo_desc: "Many families from Argentina's poorest strata are in desperate need of financial assistance, and with every passing day of the Fernández administration, they grow more disillusioned with the government. Instead, they place their trust in the opposition, particularly the UCR, which falsely claims that the Peronists and their allies care nothing for workers or the marginalized, portraying them as mere servants of the elite. These accusations, though completely baseless, gradually erode the government's credibility. Even worse, by not countering such narratives decisively, we allow misinformation to spread across every level of society, slowly poisoning public opinion and weakening our standing before the people.\n\nIn order to stop this tide of lies, Economy Minister Sergio Massa intends to significantly expand funding for programs aimed at empowering families from the lower classes. This initiative will serve two essential goals: first, to provide immediate relief and genuine support to Argentina's most vulnerable citizens; and second, to rebuild trust in Peronism and secure vital votes ahead of the 2023 elections. Through these measures, we will prove our commitment to ordinary Argentines and expose the deceit of the opposition, making it clear that their rhetoric is nothing but manipulation."
ARG_eliminar_algunas_regulaciones: "Eliminate Some Regulations"
ARG_eliminar_algunas_regulaciones_desc: "Despite the partial abolition of outdated regulations under the industrial plan to combat the economic crisis, Argentina remains suffocated by a large number of senseless restrictions designed only to extract money from entrepreneurs instead of encouraging their growth. These unnecessary barriers not only undermine productivity and innovation but also alienate key sectors of society, particularly Menemists and liberal Peronists. Their support is crucial for stability and electoral success, and if neglected, these voters could easily shift toward Cambiemos or, even worse, La Libertad Avanza, strengthening the most dangerous opposition forces against us.\n\nFor this reason, Economy Minister Sergio Massa is determined to launch a new initiative aimed at eliminating more of these harmful regulations. The goal is twofold: first, to create a fairer and more transparent market that respects the efforts of entrepreneurs and allows them to prosper; and second, to demonstrate that the Peronist movement is attentive to all Argentines, including the liberal wing of Peronism, whose votes may determine the outcome of the 2023 elections. By taking such action, Massa will prove that PJ truly cares about every citizen regardless of class or ideology, reaffirming that Peronism stands with the people and is committed to building a just, inclusive, and economically strong Argentina."
ARG_reinaugurar_la_bicicleta_financiera: "Reopening the Financial Bicycle"
ARG_reinaugurar_la_bicicleta_financiera_desc: "With all the reforms first adopted by President Alberto Fernández together with former Economy Minister Martin Guzmán, and later continued and expanded by the current Minister of Economy Sergio Massa, Argentina's financial situation has improved significantly compared to the grim conditions at the time of Fernández's inauguration. After years of hardship, inflationary pressure and constant devaluations, the government can finally see the outlines of recovery. Massa is satisfied with the work carried out so far, emphasizing that Argentina is now closer than ever to leaving the monetary crisis behind and entering a stage of sustainable growth.\n\nSince the economy is once again flourishing and showing the same dynamism it demonstrated during its best years, Massa has proposed to revive the long-forgotten strategy of “Carry Trade.” This policy is designed to attract an influx of foreign capital by creating favorable conditions for investors and demonstrating Argentina's potential as a profitable market. If the reforms continue and deepen, especially under Massa's potential presidency, international trust will rise, foreign funds will flow into Buenos Aires, and Argentina will finally regain pride and optimism about its future."
ARG_el_gran_congreso_peronista: "The Great Peronist Congress"
ARG_el_gran_congreso_peronista_desc: "And now, with the presidential elections looming on the horizon, the Justicialist Party still has not agreed on a single candidate. To resolve this crucial issue, PJ intends to convene a great all-Peronist congress where it will finally be decided who truly deserves to carry the banner of Peronism into the elections. At this congress everyone will have a voice and a vote: from the federal Peronists with their Menemist roots, to the reformist and centrist Radicals, as well as the Marxist-inspired factions and the uncompromising ultra-Kirchnerists. The future of the movement and of Argentina itself will depend on this choice.\n\nAmong the main candidates are Sergio Massa of the Renewal Front, once a lawyer, later mayor of Tigre, president of the Chamber of Deputies, and now Minister of Economy, who embodies pragmatism and technocratic reform. Competing with him is Daniel Scioli, loyal to Alberto Fernandez, known as former vice president and governor of Buenos Aires Province, who still commands respect in many circles. Finally, the Kirchnerist camp supports Eduardo “Wado” de Pedro, also a lawyer by training and currently Minister of the Interior. One of these figures will be chosen to lead Argentina not only to the end of this decade, but perhaps into the next era of its history."
ARG_laultimacartadealberto: "Alberto's Last Letter"
ARG_laultimacartadealberto_desc: "Thanks to the influence of President Alberto Fernandez — his letters to delegates, the fulfillment of some demands, the personal authority of the old Alberto himself, and of course the careful use of financial resources — the all-Peronist Congress produced an unexpected result. Instead of confirming the anticipated candidacy of Economy Minister Sergio Massa, the assembly chose Daniel Scioli, former ambassador to the now-collapsed Brazil, as the official presidential candidate. This outcome came as a shock to many, especially to the Kirchnerist factions who had reconciled themselves with Massa but could not fully accept the loyalist figure of Scioli.\n\nNevertheless, the decision has been made, and Daniel Scioli has already begun to shape his campaign. He emphasizes continuity, openly declaring that he will carry forward the vision of President Alberto Fernandez, preserve his political legacy, and deepen those reforms that crises and limitations had left unfinished. At the same time, Scioli seeks to present himself as a bridge toward Argentina's future, promising to move the nation ahead under the enduring Peronist banner, revive hope for prosperity in the new century, and lay down the foundations that future generations of Argentines will inherit."
ARG_el_caudillo_de_tigre_liderara: "The Caudillo of Tigre will Lead"
ARG_el_caudillo_de_tigre_liderara_desc: "What was expected and almost inevitable finally happened: through political intrigue, promises to delegates, and the strategic use of financial leverage, Economy Minister Sergio Massa secured his place as the official presidential candidate, surpassing his closest rival Daniel Scioli. Enjoying broad popularity not only among his loyal supporters but also within significant parts of the Kirchnerist factions and even Fernandez's old guard, Massa emerged as the long-awaited compromise figure capable of uniting the various branches of Peronism under one banner. Thus, the PJ has entrusted him with its future, and in return he has multiplied his promises to the movement and the Argentine people.\n\nHis program is distinctly populist, framed as the expansion of a “new Peronist political horizon.” Massa openly declares his intent to revive the most successful policies of Juan Domingo Peron's first government while adapting them to modern challenges. He pledges to balance the internal tensions between left and right Peronists, steering the movement toward national unity. More ambitiously, he promises to lay the foundation for a truly progressive and genuinely Peronist Argentina — a country that, in his vision, will become a prosperous paradise for all citizens regardless of social class or background."
ARG_la_campana_mas_importante_pj: "The Most Important Campaign of the PJ"
ARG_la_campana_mas_importante_pj_desc: "Now that the PJ has finally chosen its candidate, he is immediately confronted with a strategic report outlining two possible directions for the Union por la Patria electoral campaign. The first option is a classic Peronist style, similar to the campaigns once carried out by Alberto Fernández and other moderate Peronists. This path emphasizes respect for democratic institutions while still employing a populist, almost messianic tone, presenting the PJ as the only true alternative in the elections. Its main slogan would be to warn voters not to risk becoming “even poorer loyal Peronists” by abandoning their historic movement.\n\nThe second option, however, is far more radical, modeled after the campaigns of 1946 and 1973, where the PJ did not hesitate to use every possible tool to appear as the only party capable of leading Argentina, even if that meant making mistakes, silencing opposition voices, or employing methods bordering on authoritarian populism. This approach seeks to create an image of strength, unity, and inevitability, projecting the candidate as a providential leader destined to guide the nation. Ultimately, the decision lies with the chosen candidate himself: whether to follow the path of moderation or to embrace the radical, messianic tradition of Peronism."
ARG_unacampanaradicalizada: "The Most Radicalized Campaign in History"
ARG_unacampanaradicalizada_desc: "Time is running out for the chosen PJ candidate, forcing him to make a decision almost without reflection, as the campaign must begin immediately if he wants to secure any chance of victory. After weighing the options, he chooses the path of a radical campaign, decisively abandoning the moderate style of recent years and instead evoking the spirit of the legendary elections of 1946 and 1973. The goal is to attract the sympathy of outspoken radicals and leftist groups who never accepted the watered-down, moderate Peronist approach and demand a return to uncompromising political struggle.\n\nFor this reason, Union por la Patria now mobilizes every possible administrative, organizational, and political resource to construct around the candidate an image of a national savior, a messianic figure without whom Argentina will collapse into ruin. Campaign slogans used in the 2021 legislative race are being thoroughly reworked and radicalized, transformed into aggressive messages of urgency and destiny that match the new direction. At the same time, state institutions will be quietly but firmly instrumentalized to silence dissenting voices, ensuring that the Peronist voice dominates above all others."
ARG_unacampanaalestiloclasicoperonista: "A Campaign in the Classic Peronist Style"
ARG_unacampanaalestiloclasicoperonista_desc: "Time is running out for the chosen PJ candidate, forcing him to make a decision almost without reflection, as the campaign must begin immediately if he wants to secure any chance of victory. After weighing the options, he chose to pursue a moderate strategy, inspired by the traditional Peronist campaigns of the past, even though some, like the parliamentary elections of 2021, ended in defeat. The reasoning is simple: the PJ cannot afford to alienate the moderate Menemists and the federal Peronists, whose votes may prove decisive in ensuring victory.\n\nFor this reason, Union por la Patria is mobilizing every administrative, political, and communicational resource to launch a wide-ranging campaign aimed at the careful “moderate messianization” of the candidate. The intention is to present him as the strongest and most trustworthy choice among all those appearing on the ballot, a leader capable of uniting rather than dividing. Unlike more radical paths, this campaign emphasizes respect for democracy, highlighting that the candidate will not resort to censorship or authoritarian tools. In the end, he promises that Peronism remains the true defender of democracy in Argentina."
ARG_recordar_los_tiempos_del_gato_macri: "Remembering the Times of macri"
ARG_recordar_los_tiempos_del_gato_macri_desc: "Mauricio Macri, former President of Argentina from 215 to 2019, entered history as the first non-Peronist head of state of the 21st century. He positioned himself as an ardent neoliberal, promising modernization and reforms that supposedly would save the nation. During his mandate, he dismantled many of the achievements of the Kirchner governments and even undermined parts of Juan Domingo Peron's legacy, which for decades had given Argentina stability and identity. For many opposition voices, Macri became a “breath of fresh air against authoritarian Peronism,” praised as a supposed hero who broke with tradition and offered a new political horizon.\n\nBut was he truly that hero? In reality, Macri was one of the most damaging leaders Argentina ever had. His economic reforms resembled those of José Alfredo Martínez de Hoz, introducing failed monetary experiments and a rigid neoliberal program that pushed the country into a severe financial and monetary crisis. Even if his social policies seemed less harmful, they were not enough to hide the destructive consequences of his economic orientation. Instead of defending sovereignty, he opened Argentina to speculative capital, prioritizing foreign investors over national development. The candidate now insists on showing Argentines the darker side of Macri, the side opposition forces desperately conceal, so that people will remember his government not as salvation, but as betrayal."
ARG_propaganda_en_contra_del_loco_milei: "Propaganda against Crazy Milei"
ARG_propaganda_en_contra_del_loco_milei_desc: "Javier Milei, economist, deputy from Buenos Aires, and founder of both his libertarian party and the coalition La Libertad Avanza, gained rapid popularity after President Alberto Fernández assumed office, reaching its peak during the 2021 legislative elections. His fiery rhetoric appeals to many voters frustrated with the traditional parties and seemingly positions him as a rational economist.\n\nHowever, Milei's reputation is far from rational. Even in school, he was considered unstable, known for violent outbursts and insults. Throughout his political career, he has repeatedly attacked opponents with aggression and arrogance, revealing a volatile temperament. The candidate aims to make every Argentine aware of Milei's true nature: not merely a provocative economist, but a deeply erratic figure whose ideology hides extreme views. Beyond his madness, Milei embraces extremist ideologies, including Nazi and fascist sympathies, cloaked under the guise of libertarianism. It is crucial for voters to see him for what he truly is: a dangerous radical, not a thoughtful policy expert."
ARG_el_peronismo_sabe_hacer_el_verbo_amor: "Peronism Conjugate the Verb Love"
ARG_el_peronismo_sabe_hacer_el_verbo_amor_desc: "Across Argentina, opposition figures often claim that Peronism is an “ideology of oppression,” “anti-democratic,” and “authoritarian.” These accusations are fundamentally false. Peronism has always been a defender of democracy and freedom, especially during critical moments such as the Dirty War and the so-called “last military junta” of 1976–1983. The narrative that we oppose the opposition is a deliberate distortion of history and reality, designed to mislead the public and undermine the movement.\n\nTo counter these lies, the candidate will allocate part of Union por la Patria's administrative resources to a campaign highlighting that Peronism and the PJ symbolize care, unity, and peaceful governance — a movement that has always worked for the wellbeing of all Argentines. At the same time, opposition leaders who actively threaten the state or support criminal actions will be exposed and confronted. The message is clear: Peronism stands for justice and order, and those who oppose it pose a real threat to Argentina. For the safety of the nation, such threats must be addressed decisively, ensuring the movement's stability and the country's security."
ARG_gira_por_el_buenos_aires_kirchnerista: "Tour of the Popular and Peronist Buenos Aires"
ARG_gira_por_el_buenos_aires_kirchnerista_desc: "The province of Buenos Aires has always been the very heart of Peronism, the center of PJ's popularity across Argentina. This is explained not only by its countless poor villages that for decades benefited from the privileges granted under Peronist policies, but also by the entrenched influence of political caciqueism and clientelist networks that shape local life. Despite their poverty, these provinces are key in national politics, sending many deputies to parliament. Yet, as time passes, support that once seemed unshakable is slowly but steadily eroding, creating uncertainty for the future.\n\nFaced with this challenge and the approaching elections, the candidate has chosen to return to the Peronist-Kirchnerist strongholds of Buenos Aires, seeking to revive enthusiasm and win back the loyalty of the poor villages. The goal is clear: to secure Buenos Aires as the bastion of Peronism and Kirchnerism until the decade's end. Promises of tangible benefits will accompany this mission, because unlike the opposition, the candidate and the Peronist Argentina openly declare that they care for ordinary citizens."
ARG_sumar_apoyos_del_resto_del_peronismo: "add support from the entire Justicialist Movement"
ARG_sumar_apoyos_del_resto_del_peronismo_desc: "Peronism today is going through one of the most fragmented moments in its history. Orthodox Peronists, Kirchnerists, federal Peronists, Menemists and even the so-called “traditional” Peronists are moving further away from each other, turning unity into weakness. The 2021 legislative defeat deepened this crisis, showing that without cohesion we risk losing even our most loyal electorate. The lack of trust in the current candidate has narrowed our base and given dangerous opportunities to outsiders like La Libertad Avanza and demagogues such as Lopez Murphy, who exploit division for their own gain.\n\nThis is why the candidate sets as a central goal the reunification of all Peronist sectors under the banner of Justicialism. The message must be clear: beyond tactical differences, we are all Peronists, and only PJ and Union por la Patria defend the people. LLA and their allies will betray the workers and the movement the moment they take power, just as neoliberals always did. Even if full unity is impossible, strengthening cohesion will expand our electoral base and exponentially increase our chances of victory."
ARG_defender_los_exitos_de_la_decada_ganada: "Defending the Successes of the Won decade"
ARG_defender_los_exitos_de_la_decada_ganada_desc: "Kirchnerism has been, is, and will remain the most successful era of Argentina in recent decades. No other government can surpass its achievements. From overcoming the catastrophic 21 crisis to achieving annual GDP growth of 7–9%, reducing unemployment to 7% by 211, restructuring the external debt, and nationalizing key sectors of the economy — the successes are undeniable. Socially, Kirchnerism cut poverty from 5% to 25%, granted subsidies to low-income families, ensured justice through trials of war criminals, expanded access to healthcare, and even pioneered equality by legalizing same-sex marriage.\n\nFrente para la Victoria marked one of the brightest chapters in modern Argentina, proving that Peronism adapted to new times can truly transform the nation. The candidate pledges to defend and expand these historic achievements so that every Argentine recognizes how Kirchnerism saved the country. Let the opposition compare their neoliberal disasters with this record of growth and justice. Union por la Patria is the only future — because Kirchnerism already showed the path to prosperity."
ARG_revivir_al_fantasma_del_menemismo: "Revive the Ghost of Menemism"
ARG_revivir_al_fantasma_del_menemismo_desc: "Menemism was without doubt one of the darkest and most destructive eras in the history of Argentina. It was a time when millions fell into poverty, when corruption reigned everywhere, and when mass privatizations dismantled the foundations of national sovereignty. Under Carlos Menem, the rich and the oligarchs seized control of the country, exploiting Argentine workers almost like slaves, paying miserable wages and completely ignoring their dignity, safety, and rights. His neoliberal policies bankrupted countless families, devastated industry, and left scars that society still carries to this day. Millions remember the grief and despair that Menemism brought, while others try to forget — but history cannot be erased.\n\nThat is why the candidate insists that Menemism must never again be glorified or rewritten as something positive. For Carlos Menem brought only suffering and humiliation to Argentina. And yet, Cambiemos, the so-called federal Peronists like “el Gringo” Schiaretti, and liberal elites dare to praise him as a model president. The lies must be torn apart, the truth must be told: Menemism was betrayal, disaster, and pain. And Argentina will never accept its return."
ARG_estrategia_electoral_al_estilo_alfonsin: "Alfonsin-style Electoral Strategy"
ARG_estrategia_electoral_al_estilo_alfonsin_desc: "Raúl Alfonsín, presidential candidate in the 1983 elections, became the first civilian President of Argentina after the fall of the last military dictatorship. In this historic election he decisively defeated Ítalo Lúder with an uncompromising defense of democracy, human rights, and the demand to punish those responsible for the disappearances of the Dirty War. Thanks to his effective campaign and moral clarity, Alfonsín assumed the presidency in 1983, launching reforms that restored institutions and gave Argentines hope for a new democratic era.\n\nToday our candidate seeks to follow Alfonsín's path by embracing the same principles: an unwavering commitment to democracy, the defense of human dignity, the construction of a fair welfare state, and the promotion of social democracy. We will warn the people that right-wing anti-democrats threaten to abolish democracy once in power. Our mission is to win hearts, inspire trust, and save Argentina forever from the shadow of dictatorship."
ARG_gobernadores_peronistas_rebeldes_sin_causa: "Peronist Rebel Governors without a Cause"
ARG_gobernadores_peronistas_rebeldes_sin_causa_desc: "The federal Peronists have been a persistent challenge since Néstor Kirchner assumed power. For years, they have opposed true Peronism and acted as a constant obstacle to the federal government in Buenos Aires, only pausing during Macri's presidency. They consistently attempt to present themselves as defenders of Peronism, yet their actions weaken the movement and provide advantages to those genuinely committed to protecting it. Even Juan Domingo Peron himself would have opposed such rebellion, valuing unity above factional disputes.\n\nFor this reason, the candidate intends to travel to all the “rebellious” provinces, focusing especially on Cordoba to meet with Juan Schiaretti, known locally as “El Gringo.” The goal is to appeal to his sense of duty, emphasizing the need for unity in these critical times and reminding him that Peron would not approve of such dissent. While it is likely that Schiaretti will refuse, the candidate hopes to influence other governors, to test their loyalty, and to gauge how long their opposition can persist in this ongoing struggle against the federal government. In the end, the effort is about consolidating Peronism and ensuring that internal divisions do not threaten Argentina's stability."
ARG_cambiemos_es_igual_a_martinez_de_hoz: "Cambiemos is the same as Martinez de Hoz"
ARG_cambiemos_es_igual_a_martinez_de_hoz_desc: "José Alfredo Martínez de Hoz served as Argentina's Minister of Economy under the military dictatorship of Jorge Rafael Videla. He became notorious for his aggressive neoliberal reforms, which devastated Argentina's industry and included the infamous “tablita cambiaria,” a policy of peso devaluation. His economic program also encompassed trade liberalization, financial deregulation, and the freezing of prices and wages. These policies rapidly increased Argentina's external debt and made the economy increasingly dependent on the financial sector rather than productive industries.\n\nThe candidate aims to warn Argentines that the Cambiemos movement follows the same economic logic as Martínez de Hoz. Mauricio Macri's administration, like Martínez de Hoz's, pursued liberalization, open markets, and financial-centered policies. Both fostered growing external debt while prioritizing financial speculation over industrial development. By drawing this clear parallel, the candidate hopes citizens will understand that supporting Cambiemos is supporting a return to shock therapy that could once again deindustrialize the country, deepen inequality, and leave Argentina vulnerable to economic crises. It is crucial for the public to see this historical warning before making electoral decisions."
ARG_regalar_algunos_subsidios_a_las_clases_populares: "Give Away Some Subsidies to the Popular Classes"
ARG_regalar_algunos_subsidios_a_las_clases_populares_desc: "Members of the Partido Justicialista increasingly appear to have lost faith in the candidate and his ability to lead the nation. This is not surprising, as their loyalty has often lacked tangible backing, with many receiving no real benefits from supporting Peronist victories in past elections. It is understandable, then, that some may be tempted by other parties offering promises of privileges and material gain, though in reality these are mere illusions designed to deceive Peronist voters into abandoning their true movement.\n\nAware of this challenge, the candidate has devised a plan to reinforce loyalty among PJ members. He proposes providing tangible rewards — including refrigerators, cars, houses, and other benefits — to recognize and honor committed Peronist supporters. The goal is twofold: to retain these votes for the upcoming elections and to strengthen Union por la Patria's overall position, increasing the likelihood of a decisive victory. By demonstrating that the party genuinely cares for its people and actively rewards loyalty, the candidate hopes to restore trust in Peronism, counter opposition propaganda, and show that it remains the most authentic and capable political force in Argentina."
ARG_peronismo_o_dependencia: "Peronism or Dependence"
ARG_peronismo_o_dependencia_desc: "The slogan “Peronism or Dependency” was famously used by Ítalo Luder in the 1983 elections against Raúl Alfonsín. While it did not deliver victory to Luder, it successfully reinforced the foundations of Peronism, demonstrating its enduring strength even after seven years of repression under the military regime. The campaign highlighted the movement's ability to mobilize its base and remain relevant, proving that clear and principled messaging can resonate deeply with voters and preserve the core of the Peronist identity.\n\nToday, the slogan takes on renewed relevance, although the context has changed. Argentina now faces an opposition composed of Cambiemos and La Libertad Avanza, parties willing to sacrifice national interests to foreign powers, reminiscent of the policies of José Alfredo Martínez de Hoz during the military dictatorship. Under the leadership of the candidate, Argentina will remain independent, Peronist, and resilient, safeguarding the country from exploitation and foreign domination. The contrast could not be clearer: while the opposition risks selling the nation to Europeans and the wealthy elite, the candidate promises strength, sovereignty, and loyalty to the people. The choice is unmistakable, and the people understand it."
ARG_la_primera_vuelta_decisiva: "The Decisive First Round"
ARG_la_primera_vuelta_decisiva_desc: "All preparations are complete, the campaigns are fully launched, and the administrative resources of Union por la Patria are mobilized to win voters. We have taken decisive steps, stopping the rebellion of the federal Peronist governors, winning the hearts of millions of Argentines, and confronting the Menemists while restoring the long-lost unity of the Partido Justicialista. The first round is approaching fast, and our candidate stands ready.\n\nOur opponents have also been active, with Javier Milei and La Libertad Avanza, Juntos por el Cambio and Patricia Bullrich, and of course “El Gringo” Schiaretti with Hacemos. All candidates are prepared and eager for battle. Yet we trust in the strength of our project and in the people's will. Our candidate is the only true popular leader who thinks about Argentines rather than money. Let the struggle begin, knowing that in the end there will be only two victors moving on to the decisive next round."
ARG_el_ascenso_del_caudillo_de_tigre: "The Victory of the Popular Model"
ARG_el_ascenso_del_caudillo_de_tigre_desc: "We did it! Union por la Patria has won the first round with our candidate leading the lists. Our slogans inspired citizens to cast their votes for us, and they responded with trust. This victory was also possible thanks to the unification of all Peronists, restoring cohesion in the Partido Justicialista and silencing, at least for now, the federal Peronist rebel governors such as “El Gringo,” who stopped spreading lies against us and in some cases even joined our Kirchnerist campaign.\n\nNow, half of the Rubicon has been crossed, but our greatest enemy still awaits: the so-called “lion,” Javier Milei, with his libertarians and right-wing populists from La Libertad Avanza. The unstable economist, unable to control his aggression, will face our candidate in the decisive second round to determine the fate of Argentina. All that remains is to redirect every administrative resource toward our campaign and expose the madness of Milei. If we succeed, victory will be ours."
ARG_la_victoria_del_leon_milei: "The Victory of the Leon Milei"
ARG_la_victoria_del_leon_milei_desc: "This is disastrous—our worst nightmare has come true. We lost the first round to the libertarian madman Javier Milei and his La Libertad Avanza , giving him an early advantage and exposing weaknesses in our campaign. Perhaps voters disliked our candidate's rhetoric, or maybe their minds were swayed by this unstable economist who calls himself a libertarian yet lacks basic understanding of economics. Regardless, he won the first round.\n\nBut we lost the battle, not the war. Our candidate and Javier Milei will face each other in the decisive second round, which will determine Argentina's future for the coming decade. Union por la Patria must learn from its mistakes and correct them, reallocating all administrative resources strategically to secure victory. Every effort will be made to ensure that a reckless, extremist figure like Milei does not take power. In the meantime, we can only hope that our candidate triumphs and defends democracy from this dangerous threat."
ARG_la_llegada_del_gringo: "The Arrival of the Gringo"
ARG_la_llegada_del_gringo_desc: "Unexpectedly for everyone, Juan “El Gringo” Schiaretti with his Hacemos coalition won the first round of the presidential elections, shocking all candidates with such a result. Instead of the expected victory of our candidate—or even that of the madman Javier Milei—the federal Peronist triumphed, which significantly weakened our standing and undermined our popularity. We must recover quickly from this defeat and understand the mistakes that drove our voters toward the federal Peronists.\n\nYet this was only the first round, and the decisive second round is approaching fast. It is our candidate who will face “El Gringo” Schiaretti in the final battle for Argentina's future. We must urgently redistribute all administrative resources of Union por la Patria, learn from our failures, and channel our experience into victory. Our campaign will prove that only true Justicialism can unite the nation. For the sake of Peronism, for the sake of the Partido Justicialista, and for the sake of Argentina itself."
ARG_la_madam_pato_bullrich: "Madam Pato Bullrich"
ARG_la_madam_pato_bullrich_desc: "This is very bad: Patricia Bullrich with her Juntos por el Cambio won the first round, leaving all other presidential contenders, including our candidate, in disarray. Colossal mistakes were clearly made, considering that one of our worst enemies, Cambiemos, managed to surpass everyone and reach the second round with us. We must acknowledge this enormous propaganda failure, analyze every factor, and ensure such errors will never happen again.\n\nNow all attention shifts to the decisive second round, where Bullrich will confront our candidate for the future of Argentina—or, more precisely, to determine under which ideology and party that future will be built. Union por la Patria can only redistribute its administrative resources wisely, taking into account past mistakes to avoid repeating them. What remains is to stand united, strengthen our message, and wish our candidate success in defending the honor of Peronism, the Partido Justicialista, and Argentina itself against the old enemies from Propuesta Republicana."
ARG_la_coronacion_del_bulldog: "The Coronation of the Bulldog"
ARG_la_coronacion_del_bulldog_desc: "The most unexpected scenario unfolded in the elections: Ricardo Lopez Murphy and his Republicanos Unidos managed to win the first round of the presidential race, leaving all politicians in shock. It seemed impossible that a player who had already vanished from politics suddenly returned with Republicanos Unidos in 2020 and even became a national deputy after the legislative elections of 2021. The former Minister of Economy at the beginning of this millennium now reappears with his technocratic vision, seeking to win the presidency.\n\nFaced with this challenge, our candidate and Union por la Patria can only analyze past mistakes and prepare for the decisive fight with the technocrat in the second round. The administrative resources of Union por la Patria will be redistributed wisely, based on the lessons of the first round, to strengthen the image of our candidate in the eyes of the people. Once again, our candidate must appear as the true savior of Argentina, while the technocrat Lopez Murphy is revealed as the false prophet who seeks to destroy the nation."
ARG_prepararse_para_la_segunda_ronda: "Prepare for the Second Round"
ARG_prepararse_para_la_segunda_ronda_desc: "And so, the decisive moment arrives: in November 2023 the second round of elections will take place, where our candidate will face the opposition that dared to challenge Peronism directly. We carefully analyzed the results of the first round, recognized the mistakes, corrected them, and strengthened the positive aspects that must be emphasized to secure victory. Peronism must survive at any cost, and we will never allow the opposition to erase the legacy that Kirchnerism has built, not now, not ever.\n\nTherefore, the remaining administrative resources of Union por la Patria and particularly the Partido Justicialista will be entirely devoted to our candidate's campaign, aimed at winning the hearts of millions of voters who must now choose between two projects and not many. This struggle will determine the course of Argentina for the coming decade, and that is why we must prevail—to make Argentina truly Peronist-Kirchnerist and ensure the opposition never destroys everything built for the people and for Argentina itself."
ARG_una_nueva_oportunidad_para_el_modelo_popular: "A New Opportunity for the Popular Model"
ARG_una_nueva_oportunidad_para_el_modelo_popular_desc: "We did it! Our candidate has triumphed in the presidential elections against the opposition, consolidating Kirchnerist Peronism in Argentina for another four years, for the benefit of the nation and its people. Union por la Patria and the Partido Justicialista can also celebrate a decisive victory in the legislative branch, where the restored majority guarantees that the first two years of our candidate's presidency will be free of obstruction and full of possibilities for transformative reforms. This success must now be studied in detail so that it can be repeated in the midterm elections of 2025, ensuring continuity and stability.\n\nFor now, however, the time has come to celebrate. Thanks to the wise redistribution of administrative resources after the first round, the tireless efforts of countless hours of campaign work, and the unifying populist message crafted since early 2023, our candidate will take the oath of office on December 1, 2023. A new era is dawning: the era of Peronism and Kirchnerism renewed. Very soon Argentina will be stronger, prouder, more popular, more Peronist, and above all, better than ever before."
ARG_la_derrota_del_modelo_nacional_y_popular: "The Defeat of the National and Popular Model"
ARG_la_derrota_del_modelo_nacional_y_popular_desc: "The worst nightmare has come true: our candidate and Union por la Patria with the Partido Justicialista have lost the second round to the opposition, deeply disappointing Peronist voters and granting our adversaries the chance to dismantle everything we have built. Critical mistakes were made; voters turned their backs on us after the first round, and as a result, we now face this terrible situation. Our legislative strength has weakened, ensuring the opposition not only the presidency but also an easier path to impose its agenda—something our candidate fought desperately to prevent.\n\nNow begins the painful task of analyzing every action, every speech, and every campaign decision. Was it the corruption scandals that damaged the  Partido Justicialista's image beyond repair? Was it the relentless inflation, the partial exit from the monetary crisis, or the turbulence of the economy that alienated the people? The answers remain uncertain, yet one truth is undeniable: on December 1, 2023, President Alberto Fernández will hand over power to the opposition, who may govern this decade in our place. Our only hope lies ahead—the midterm elections of 2025."
ARG_el_final_de_la_gran_eleccion: "The End of the Great Election"
ARG_el_final_de_la_gran_eleccion_desc: "And now the election season is finally over. The banners and posters that once filled the streets urging citizens to vote for one candidate or another are being taken down, and people slowly return to an apolitical state, choosing instead to wait and observe what the newly elected government and president will do with Argentina over the next four years. Their verdict will come at the midterm elections of 2025 and later at the presidential elections of 2027, when the people will decide whether to reelect the president, if reelection is even an option by then.\n\nRegardless of the outcome, it must be acknowledged that these were the most active and vibrant elections since the fall of the military junta and the historic vote of 1983. Citizens cast their ballots and democratically chose their representative, and we must respect their voice, whether we won or lost. What matters is that political apathy was far lower this time and voter turnout was significantly higher. A new chapter begins now, the Argentina that the people themselves have chosen."
ARG_el_fin_de_la_era_fernandez: "The End of the Fernandez Era"
ARG_el_fin_de_la_era_fernandez_desc: "Here comes the end of the Alberto Fernández era. Many of the ideas that President Fernández sought to implement were lost to history because of the COVID-19 pandemic, the collapse of the United States, the deep economic crisis, and finally the defeat in the 2021 legislative elections, which shattered the ranks of his loyalists. In truth, Fernández never fully ruled the nation. Some plans were revived, such as Operation Blue Condor, yet the complete potential of his presidency was never achieved.\n\nNow, however, Argentina must look forward. On December 1, 2023, President Fernández will hand over power to the newly elected leader, granting them the right to democratically pursue their vision and promises. With this transfer, a new era begins—an era that will define not only the shape of Argentina throughout this decade but perhaps even the course of the next. The Fernández presidency will remain in history as a turbulent period in which he nonetheless managed to keep Argentina afloat."
