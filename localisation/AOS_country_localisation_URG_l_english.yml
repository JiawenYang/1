 #VEN_nicolas_maduro_char: "Nicolás Maduro"
 #VEN_nicolas_maduro_char_desc: "Nicolás Maduro Moros wasn't born in a position of power, surrounded by piles of gold. He was born in a middle class family in Caracas, completely unaware of where his future decisions would take him.\n\nHis father was a leftist militant, and his troubled history with the authorities served as an example to follow for Nicolás, who spent his teenager years experimenting with the ideas of revolution and class struggle. Instead of studying in college, he began working as a humble bus driver in the Caracas Metro, while still being a valuable member of his syndicate. His life took a huge turn when he became a follower of Hugo Chávez when he launched his failed coup attempt in 1992. When Chávez won the presidential elections in 1999, Maduro became a deputy in the National Assembly. His loyalty would get him a place in Chávez's cabinet, and eventually he would end up becoming his vice president in 2012.\n\nChávez was suffering from cancer at that time, and he knew he didn't have a lot of time left, so he publicly declared that if he passed away, Maduro would succeed him. Pass away he did, and from there things just got worse each day. Maduro's presidency was marked by scarcity, hunger, political upheaval, misery and unstability. The humanitarian crisis that ravaged his country proved him quite inefficient in his efforts the serve the people he swore to protect. No matter how much he tried, more and more people turned against him and fought against him on the streets he used to march on as a humble activist.\n\nWith each day that passes he grows more authoritarian, desperate to hold on to power in a country that keeps falling apart. He does this to preserve the legacy of Chávez and the Bolivarian Revolution, but these efforts seem futile, like trying to reconstruct a pile of burned, shattered glass."
 ## URG - Uruguay ##
 URG_the_2005_legacy: "2005 Legacy"
 URG_the_2005_legacy_desc: "Uruguay has spent the last two decades thriving, attracting investment, and enjoying remarkable economic stability. It is hard to believe that the country suffered a devastating crisis back in 2002. But none of this would have been possible without Jorge Batlle and Tabaré Vázquez. While Batlle made the crucial decision not to default in the midst of the crisis, Tabaré managed to attract investment through his moderate left-wing policies, appointing a market-friendly economist as Minister of Economy and promoting Free Trade Zones, tax incentives, and major investment projects.\n\nBarring any catastrophic developments, Uruguay may well be on the verge of experiencing its first true economic miracle."
 URG_structural_black_economy: "Structural Black Economy"
 URG_structural_black_economy_desc: "Every success has its downside. The taxes and regulations that allow Uruguay to sustain its social programs and maintain a fair market are gradually giving rise to an uncontrolled shadow economy. Driven by the concentration of capital in the major cities and the heavy tax burden, many medium-sized businesses have been forced to close, while smaller ones increasingly operate without permits simply to avoid bureaucratic obstacles and survive.\n\nWith unemployment rising, businesses shutting down because they cannot obtain legal credit, and resentment toward large corporations growing, the government is finding it harder and harder to conceal this new problem from the public."
 URG_a_country_for_old_men: "A Country for Old Men"
 URG_a_country_for_old_men_desc: "More and more population pyramids are revealing a growing problem in Uruguay: rising poverty among the young, driven in large part by the enormous burden of pension costs. But this is only one part of a much larger crisis. An aging population, combined with low birth rates, rising life expectancy, and massive pension expenditures, is threatening to paralyze the entire system. The pension system is struggling to cope, more and more young Uruguayans are leaving the country, and if nothing is done, Uruguay may soon find itself facing yet another crisis."
 URG_the_bureaucratic_culture: "The Bureaucratic Culture"
 URG_the_bureaucratic_culture_desc: "Uruguay truly is the Switzerland of South America, known for its meticulousness, low levels of corruption, and the bureaucratic labyrinth that has emerged alongside a stagnant economy and the near-total job security enjoyed by public employees. It is this very phenomenon that has given birth to a bureaucratic leviathan and to generations of bureaucrats who have become an inseparable part of Uruguay itself. And this culture of bureaucracy shows no signs of fading away anytime soon."
