 KOR_korean_immigration: "Сложное получение гражданства"
 KOR_korean_immigration_desc: "Поскольку подавляющее большинство населения [Root.GetName] принадлежит к одной этнической группе, страна разделяет мощный национализм, основанный на общности происхождения и историческом сознании. Иностранцы, желающие иммигрировать, должны не только пройти исключительно трудный экзамен на гражданство, но и вынести отчуждённые взгляды общества."
 KOR_korean_immigration_lv4: "Сложное получение гражданства"
 KOR_korean_immigration_lv4_desc: "Поскольку подавляющее большинство населения [Root.GetName] принадлежит к одной этнической группе, страна разделяет мощный национализм, основанный на общности происхождения и историческом сознании. Иностранцы, желающие иммигрировать, должны не только пройти исключительно трудный экзамен на гражданство, но и вынести отчуждённые взгляды общества."
