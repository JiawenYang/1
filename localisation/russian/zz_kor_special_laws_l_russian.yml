 KOR_korean_education: "Образование ради университета"
 KOR_korean_education_desc: "[Root.GetAdjective] общество прежде всего отличается своей страстью к образованию. [Root.GetName] устанавливает обязательное обучение до средней школы; старшая школа необязательна, но государство поддерживает бесплатное обучение каждого ученика. [Root.GetAdjective] учащиеся поэтому завершают всё среднее образование без платы за обучение. Однако в обществе, где доля поступающих в университеты приближается к семидесяти процентам, учёба в университете уже считается необходимостью, а не выбором. Государственное образование, следовательно, подвергается критике за исключительную концентрацию на «образовании ради поступления в университет»."
