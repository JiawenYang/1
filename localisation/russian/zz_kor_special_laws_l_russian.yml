 KOR_equal_female: "Равенство полов"
 KOR_equal_female_desc: "Конституция и законы [Root.GetName] прямо гарантируют равенство мужчин и женщин, и женщины занимают высокие позиции по уровню образования и участию в рабочей силе. Однако на практике разрыв в оплате труда между полами остаётся одним из самых больших в развитом мире, женщинам трудно достичь руководящих должностей из-за заботы о детях и домашних обязанностей, а рождаемость продолжает падать. Равенство на бумаге не привело автоматически к равенству по существу."
 KOR_equal_female_lv4: "Равенство полов"
 KOR_equal_female_lv4_desc: "Конституция и законы [Root.GetName] прямо гарантируют равенство мужчин и женщин, и женщины занимают высокие позиции по уровню образования и участию в рабочей силе. Однако на практике разрыв в оплате труда между полами остаётся одним из самых больших в развитом мире, женщинам трудно достичь руководящих должностей из-за заботы о детях и домашних обязанностей, а рождаемость продолжает падать. Равенство на бумаге не привело автоматически к равенству по существу."
