l_russian:
 KOR_safety_law: "Скрытая эксплуатация"
 KOR_safety_law_desc: "Экономический рост Кореи пришёл как чудо, но это чудо отбрасывает глубокую тень.\nЗакон может гарантировать права трудящихся, однако в провинциях минимальная зарплата давно стала мёртвой буквой. Продолжительность рабочего времени стабильно входит в число самых высоких в ОЭСР, а такие схемы, как «всеобъемлющая система оплаты труда», мешают справедливой компенсации сверхурочных.\nКорейское общество тем самым допускает неоспоримую «скрытую эксплуатацию» труда.\n\n- Соблюдайте Закон о трудовых стандартах! (Чон Тхэиль)"
 KOR_police_law: "«Закон о национальной безопасности»"
 KOR_police_law_desc: "Цель настоящего закона — обеспечить безопасность нации, выживание и свободу народа путём регулирования антигосударственной деятельности, ставящей под угрозу безопасность нации.\n\nЛюбое лицо, которое, зная, что это ставит под угрозу существование, безопасность или базовый либерально-демократический порядок нации, восхваляет, поощряет, пропагандирует деятельность антигосударственной группы, её членов или действующих по её указанию лиц либо сочувствует ей, а равно пропагандирует или подстрекает к национальному мятежу, наказывается лишением свободы на срок не более 7 лет."
 KOR_korean_welfare: "Интегрированная социальная защита"
 KOR_korean_welfare_desc: "Система социального обеспечения [Root.GetName] состоит из трёх опор: социального страхования, государственной помощи и социальных услуг. Для защиты граждан от базовых рисков для средств к существованию обязательным является участие в национальной медицинском страховании, национальной пенсии, страховании занятости и страховании от несчастных случаев на производстве. Национальная система базового обеспечения жизни гарантирует минимальный уровень жизни малоимущим домохозяйствам, а государство также предоставляет множество форм поддержки другим уязвимым группам. [Root.GetAdjective] система социального обеспечения неуклонно развивалась, но в её сети остаются слепые зоны, не позволяющие в полной мере повышать благосостояние каждого гражданина."
 KOR_korean_welfare_lv4: "Интегрированная социальная защита"
