ARG_grieta_politica_desc_loc_key: "На протяжении лет, десятилетий, а если хотите, «столетий», Аргентина была разделена между разными группами людей, которые ничего не делали, как только вредили нашей нации, особенно нашему народу. Семьи разорваны политическими спорами, пары — идеологическими различиями, и даже были случаи насилия над другими за то, что они имеют иную картину мира.\nВаша миссия — положить конец конспирологическому, управляемому мышлению, чтобы дезинформация в этой стране исчезла. Это не будет легко: СМИ, политики, знаменитости и даже близкие нам люди распространяют дезинформацию, чтобы вызвать страх или отторжение к менее традиционным идеологиям в Аргентине."
