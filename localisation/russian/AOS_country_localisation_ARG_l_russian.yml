#patchs-presentacion:
ARG_GATHERING_STORM_DESC2: "Долгое время считавшаяся нацией, обреченной на величие, Аргентина, казалось, получила от истории иные планы. Годы инфляции и долгов сменились политической нестабильностью, постепенно подрывая доверие и ограничивая рост нации.\n\nЗатем Аргентина попыталась найти стабильность с избранием Альберто Фернандеса в 2019 году, но после нескольких лет страна все еще плывет по течению без ясной стратегии. Если Аргентина хочет раскрыть свой истинный потенциал, она должна выбрать путь вперед или рисковать быть оставленной историей."
ARG_country_summary: "§YКраткая информация о стране§!:\nКогда Хосе де Сан-Мартын воевал с Испанией за независимость Рио-де-ла-Платы, когда Аргентинская конфедерация впервые подняла свой флаг, никто не мог предположить, как нация, обреченная стать сердцем континента, попадет в такое упадок.\nНикто не предвидел, что в 1944 году генерал Хуан Доминго Перон выйдет из рядов военных и навсегда изменит ход аргентинской истории. Никто также не предвидел, что в 1955 году армия свергнет его во имя демократии — только для того, чтобы эта же демократия рухнула снова и снова: от смещения Артуро Фрондизи в 1962 году и краткой президентства Хосе Марии Гуидо до падения Артуро Иллии под генералом Хуаном Карлос Онганией. Никто не предвидел возвращения Перона в 1974 году или того, что его вдова будет свергнута военными через два года. Никто не предвидел поражения 1982 года, краха 2001 года, долгих лет разочарования и инфляции. И до сих пор никто не знает, сможет ли Аргентина когда-то вновь подняться, чтобы вернуть величие, которое когда-то казалось написанным в ее судьбе."
ARG_country_paths: "\n\n§YПути развития страны§!:\n - §CUnion por la Patria - Partido Justicialista§!\n - §1La Libertad Avanza - Partido Libertario§!\n - §BJuntos por el Cambio - Republicanos Unidos§!\n - §YHacemos por Nuestro País - Peronismo Federal§!"
ARG_country_other: "§YTips and Tricks:§!\n - Танго никогда не заканчивается, оно только меняет партнеров.\n - Обдумывайте и выбирайте своего кандидата мудро.\n - §G«Будущее не принадлежит слабым, ни тем, кто боится своей судьбы.»§! — §YХосе де Сан-Мартын§!"
#Ideology
ARG_reformist_socialism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_Kirchnerism \n\n\n\n\n\n §Y«Киршнеризм»§! — это идеология, разработанная Киршнерами с начала 2000-х годов, особенно во время президентства Нестора Киршнера. Она опирается на перонистские влияния и определенные идеи, связанные с воинственными движениями 1970-х годов. Она выступает за большую роль государства, экономический протекционизм, аргентинский патриотизм и сильное подчеркивание национальной идентичности. Также поддерживает защиту прав рабочих и профсоюзов через демократические институты. Кроме того, она включает прогрессивные элементы, такие как расширение социальных программ и государственное вмешательство, направленное на снижение бедности.\n\nВ известной степени она также привержена идеям, связанным с теологией освобождения, поддержкой социальных и иммигрантских меньшинств, улучшением сельского сектора и оживлением сельских сообществ, одновременно поощряя демократическое участие в этих областях и защиту окружающей среды. Все это, как правило, сопровождается сильным популистским компонентом и глубокой идентификацией с Киршнерами, которых их сторонники изображают как центральные фигуры политического проекта и наследников наследия Хуана Доминго Перона, с целью искоренения бедности и укрепления прав аргентинских рабочих в лице корпоративной силы."
institutionalized_despotism: "Институционализированный деспотизм"
institutionalized_despotism_desc: "Человек, прибывший в такую страну, может посмотреть на всевозможные атрибуты либеральной демократии, которые там сохранились, и сделать вывод, что правительство демократично — но не может быть дальше от истины. Вместо того чтобы преследовать демократию, институционализированный деспотизм стремится создать и поддержать «Идеальную диктатуру», которая успешно убеждает людей в том, что они, по сути, не в диктатуре. С приходом нового десятилетия наиболее очевидный пример этого — правление PRI в Мексике.\n\nВ этом государстве все институты контролируются и подрываются единственной, невероятно укрепившейся олигархической партией или другой подобной группой, занимающей политическую бюрократию. Между тем у правительства есть диктаторские полномочия для осуществления своей воли, полномочия, закрепленные в законах, которые предоставляют государству огромный надзор и возможности вмешиваться в любые сферы по своему усмотрению. Кроме того, даже большая часть организованной оппозиции, вероятно, напрямую контролируется или является спутником правящей партии, чтобы создать иллюзию политического плюрализма. Поэтому невозможно представить их смещение из власти без огромного широкофронтового усилия, направленного именно на эту цель. Каждое действие, бездействие, использование и злоупотребление оправдывается единой общей целью или задачей, неразрывно связанной с правящей группой или идеологией — независимо от того, насколько неопределенной или логически несогласованной эта цель может быть. Результатом является институционализированный и замаскированный деспотизм, а национальная идеология и гражданское общество вынуждены вращаться вокруг абстрактной цели, поглощающей все, что она касается — что очень часто используется для оправдания собственного интереса политической олигархии, которая стоит у ее верха."
ARG_institutionalized_despotism_desc: "Человек, прибывший в такую страну, может посмотреть на всевозможные атрибуты либеральной демократии, которые там сохранились, и сделать вывод, что правительство демократично — но не может быть дальше от истины. Вместо того чтобы преследовать демократию, институционализированный деспотизм стремится создать и поддержать «Идеальную диктатуру», которая успешно убеждает людей в том, что они, по сути, не в диктатуре. С приходом нового десятилетия наиболее очевидный пример этого — правление PRI в Мексике.\n\nВ этом государстве все институты контролируются и подрываются единственной, невероятно укрепившейся олигархической партией или другой подобной группой, занимающей политическую бюрократию. Между тем у правительства есть диктаторские полномочия для осуществления своей воли, полномочия, закрепленные в законах, которые предоставляют государству огромный надзор и возможности вмешиваться в любые сферы по своему усмотрению. Кроме того, даже большая часть организованной оппозиции, вероятно, напрямую контролируется или является спутником правящей партии, чтобы создать иллюзию политического плюрализма. Поэтому невозможно представить их смещение из власти без огромного широкофронтового усилия, направленного именно на эту цель. Каждое действие, бездействие, использование и злоупотребление оправдывается единой общей целью или задачей, неразрывно связанной с правящей группой или идеологией — независимо от того, насколько неопределенной или логически несогласованной эта цель может быть. Результатом является институционализированный и замаскированный деспотизм, а национальная идеология и гражданское общество вынуждены вращаться вокруг абстрактной цели, поглощающей все, что она касается — что очень часто используется для оправдания собственного интереса политической олигархии, которая стоит у ее верха."
#Ideas
ARG_opposition_popularity_dynamic: "§YМодификаторы популярности оппозиции§!"
ARG_great_pampas: "Великие Пампы"
ARG_great_pampas_desc: "\n\n\n\n  £GFX_texticons_ARG_pampas_argentinas \n\n\n\n\n\nМногие спрашивают, как Аргентина выживает несмотря на все кризисы. Ответ прост: сельское хозяйство. Огромные фермы Пампасов генерируют невероятный доход для Аргентины, особенно за счет соевых продуктов, которые вносят от 3% до 5% доходов государственного бюджета. Фермеры спасли Аргентину во время каждого экономического кризиса, предотвратив полный крах нации. Экономика и люди должны быть благодарны этим фермерам, чей тяжелый труд поддерживает Аргентину даже в условиях денежного смуты. Несмотря на высокие налоги и сложные условия, они продолжают производить важные товары, поддерживая страну, которая не полностью индустриализирована и даже время от времени переживает дезиндустриализацию. Фермерам заслуживается большая признательность и привилегии, потому что если их игнорировать, они могут в конечном итоге отвернуться от нации, которая так сильно зависит от их труда."
ARG_argentinean_peso: "Аргентинское песо"
ARG_argentinean_peso_desc: "\n\n\n\n  £GFX_texticons_ARG_peso_argentino \n\n\n\n\n\n1930-е годы ознаменовали создание Центрального банка Аргентины. С тех пор аргентинское песо претерпело многочисленные изменения, превратившись из песо nacional в песо ley, затем в аргентинское песо, за которым последовал austral, и, наконец, снова в аргентинское песо. Валюта менялась больше раз, чем можно сосчитать: перонисты, радикалы, военные, menemисты, киршнеристы и Макри — все пытались провести реформы. Частая эмиссия денег и непогашенные долги, возникшие в результате крупномасштабных бюджетных регулировок, еще больше подорвали ее стабильность. Сегодня песо — одна из самых изменяемых валют в Южном Конусе, с множеством девальваций и удалением нулей за десятилетия. Его широко не доверяют; мало кто хочет покупать или торговать им, оставив его в основном изолированным для внутреннего использования. Если эту ситуацию не исправить, денежный кризис будет продолжаться, девальвации не остановятся, а инфляция может превысить 35%. Аргентинское песо необходимо стабилизировать, иначе Аргентина рискует экономическим крахом или полной зависимостью от иностранных валют."
ARG_syndicalist_mafia: "Синдикальная мафия"
ARG_syndicalist_mafia_desc: "Аргентина с самых ранних дней была страной народа. Под руководством Хуана Доминго Перона Аргентина построила одно из самых образцовых профсоюзных движений во всем западном мире. Однако со временем крупнейшие левые перонистские профсоюзные лидеры погибли, заменившись бюрократами, которые кардинально изменили профсоюзы. Появление бюрократии превратило профсоюзы от защитников обычных рабочих в фактически найманную мафию. Сегодня профсоюзные лидеры владеют колоссальной политической властью, подчиняясь только тогда, когда предоставляются экономические выгоды или субсидии, и их личное богатство часто вызывает вопросы о том, действительно ли они заботятся о рабочих. Профсоюзы потеряли свою первоначальную цель, действуя скорее как самодовлеющие организации, которые иногда выступают против государства и текущего правительства. Эта синдикальная машина стала еще одним системным опухолем в Аргентине, угрожающим нации, если ее не остановить — единственный вопрос, когда будет принято решающее действие."
ARG_sinecure_nation: "Нация с псевдоработами"
ARG_sinecure_nation_desc: "Проблема ленивых рабочих, которые ничего не делают, давно мучает Аргентину. В течение многих лет аргентинское правительство нанимало много людей на должности, которые раньше действительно были полезными, но со временем превратились в бессмысленные работы, не требующие реального труда. Тем не менее, аргентинцы продолжают занимать эти должности в государственном секторе, и государство, похоже, бессильно изменить ситуацию. Ситуация стала абсурдной: большинство государственных служащих больше не хотят работать, сосредотачиваясь на наслаждении привилегиями и получении высоких зарплат за буквально ничего, как, например, среди госслужащих, которые просто делают фотокопии. Эта проблема глубоко укоренилась и сохраняется. Она увеличивает государственный бюджет, снижает трудовую этику населения и создает культуру привилегий. Это одна из системных опухолей Аргентины, и если ее не решить и не устранить, нация рискует полным разрушением производительности и ответственности среди своих людей."
ARG_bloated_social_welfare: "Расширенная социальная помощь"
ARG_bloated_social_welfare_desc: "Идея социального государства стала символом Аргентины после прихода Хуана Доминго Перона к власти, так как он начал создавать целый ряд программ социальной помощи для поднятия тысяч семей из бедности. Сначала эти программы работали успешно, но со временем они стали все более раздутыми, принося мало пользы государству. Когда возникали кризисы, Аргентине приходилось печатать большое количество денег и брать рискованные кредиты для финансирования программ социального обеспечения. Многие семьи стали зависимыми от этих пособий и испытывали трудности с выживанием без них, что делало обсуждения о реформе или регулировке политически чувствительными, так как (Аргентина не может бросить своих людей.) К сожалению, и киршнеристы, и радикалы продолжают поддерживать эту расширенную систему, которая не дает признаков замедления, еще больше дестабилизируя экономику. Скоро машина социального обеспечения может стать неконтролируемой, и экономические проблемы коснутся всех, а не только тех, кто полагается на помощь."
ARG_desarme_militar: "Больше никогда"
ARG_desarme_militar_desc: "\n\n\n\n  £GFX_texticons_ARG_nunca_mas \n\n\n\n\n\nС тех пор, как мы потеряли войну за Малвины — наше горькое поражение в борьбе за возвращение традиционных земель Аргентины — мы выбрали путь полного разоружения. Под президентом Раулем Альфонсином способных генералов преследовали, бюджет армии сократили наполовину, и каждый проект модернизации танков, самолетов и военно-морских сил приостановили. Позже, под Карлосом menemом, во имя лояльности Западу программы обороны были разгромлены, а FMA была продана в частные руки. После разрушительного экономического краха 2001 года военные расходы упали ниже одного процента ВВП, а боеготовность армии распалась вместе с ее подводным флотом. Даже во время эпохи Киршнеров и при Маурисио Макри эхо популистских обещаний о восстановлении национальной обороны было слышно, но практически ничего не получилось. Сегодня наша армия продолжает исчезать — разоружена не врагами, а страхом собственного прошлого, священным клятвой, что 1976 год никогда не вернется, что военный террор больше никогда не произойдет."
ARG_the_macrist_nostalgia_idea: "Макристская ностальгия"
