#Ideologies Massa
ARG_reformist_socialism_socdem_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_reformist_kirchnerism \n\n\n\n\n\n §YРеформистский киршнеризм§! — это идеология, которая, согласно этому описанию, возникает под руководством Серхио Массы и его прихода к власти. Она основывается на сочетании киршнеристских и перонистских идей, выступая за большое государство, некоторую степень экономического протекционизма и поддержку национальных компаний и стратегических производительных секторов. Его objetivo является сохранение экономической и социальной стабильности при поддержании внутреннего единства Partido Justicialista.\n\nИдеология продвигает аргентинский патриотизм и защиту рабочих и профсоюзов через демократические механизмы. Также она сохраняет прогрессивные и социал-демократические элементы, такие как расширение социальных программ для снижения бедности и поддержка социальных меньшинств и иммигрантов. Эти политики сопровождаются развитием сельского сектора, большим демократическим участием в сельских районах и политиками защиты окружающей среды.\n\nВсе это сочетается с сильным популистским и персоналистским компонентом. Движение представляет Серхио Массу как политического наследника наследия Киршнеров и перонистского проекта, но адаптированного к новой эпохе. Его objetivo будет снижение бедности, укрепление аргентинских рабочих и поддержание влияния перонизма через сочетание социальных политик, экономического национализма и политической прагматизма"

ARG_pragmatic_socialism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_pragmatic_peronism \n\n\n\n\n\n §YПрагматичный перонизм§! — это форма популизма, готового принимать любые экономические решения, необходимые для сохранения стабильности и поддержки правительственного проекта. Его главная цель не следовать жесткой экономической доктрине, а адаптировать свои политики к обстоятельствам, чтобы обеспечить непрерывность своей политической власти.\n\nОдновременно он стремится поддержать поддержку правых, левых и центристских фракций через соглашения, уступки и политики, способные удовлетворить разные политические сектора движения. Этот баланс, известный как «Pax Peronista», позволит движению сохранить свое единство и предотвратить внутренние конфликты, угрожающие правительству.\n\nВ этом смысле идеология разделяет определенные сходства с подходом Карлоса Менега, который также продемонстрировал значительную идеологическую гибкость, чтобы поддержать широкую политическую коалицию и обеспечить стабильность своего правительства. Для прагматичного перонизма идеология важна, но выживание политического проекта — еще важнее."
