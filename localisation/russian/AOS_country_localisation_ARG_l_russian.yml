ARG_referendum_desc_loc_key: "Хавьер Милей знает, что в Конгрессе у него много врагов: милитанты PRO, «куки» и старые радикалы, которые только хотят усложнить ему жизнь. Поэтому, как Президент нации, Хавьер может принять свои законы с помощью народной поддержки, благодаря людям и механизму референдума правительства.\nВ времена кризиса люди знают, что нужно решить."
