ARG_capitan_beto_en_la_rosada: "Капитан Бето в Росаде"
ARG_capitan_beto_en_la_rosada_desc: "Новая политическая эра в истории Аргентины."
ARG_guzman_vs_inflacion: "Гузман против инфляции"
ARG_guzman_vs_inflacion_desc: "Инфляция была одной из самых стойких и разрушительных проблем Аргентины с 1970-х годов, когда страна пережила гиперинфляцию, достигшую почти 3000%. В 1990-х годах президент Карлос menem попытался добиться стабильности, привязав песо к доллару США, что помогло в краткосрочной перспективе, но в конечном итоге рухнуло, приведя к дефолту 2001 года и новому циклу экономической нестабильности. С тех пор Аргентина боролась с повторяющейся инфляцией, долгами и стагнацией. Каждая администрация обещала решения, но ни одна не смогла внедрить долговременные реформы. Под президентом Фернандесом инфляция продолжает расти, недавно достигнув 53.5%, что выше, чем при его вступлении в должность.\n\nПосреди этого кризиса Мартин Гузман, министр экономики, стал центральной фигурой. Его задача не проста: одомашнить инфляцию, стабилизировать валюту и восстановить доверие к экономике — все это при управлении последствиями пандемии COVID-19. Некоторые видят в нем единственную надежду остановить долгий упадок Аргентины. Будет ли Гузман успешным — неизвестно. Но неотложность ясна: без решающих действий инфляция может снова угрожать самой основе экономики и общества Аргентины."
ARG_alberto_aumenta_salarios: "Альберто увеличивает зарплаты"
ARG_alberto_aumenta_salarios_desc: "С 2015 года минимальная зарплата в Аргентине выросла с 6000 до 16000 песо. На первый взгляд это может казаться прогрессом. Однако, если учесть инфляцию и девальвацию валюты, реальность более тревожная: в 2015 году минимальная зарплата составляла около 600 долларов США, а сегодня едва достигает 200 долларов США. Инфляция выросла с 27% до почти 50%, значительно ослабив песо и снизив реальную покупательную способность. Экономический кризис 2018 года только углубил эти проблемы, раскрыв хрупкость зарплат и жизненного уровня обычных аргентинцев.\n\nВ ответ на это президент Фернандес, возглавляющий правительство, коренное основание которого — левые ценности, обязался увеличить доходы. Новые меры увеличат минимальную зарплату с 16000 до примерно 19000 песо. Зарплаты в государственном секторе также вырастут с 45000–50000 песо до 60000–70000 песо. Как правительство, избранное народом и для народа, президент Фернандес подчеркивает свою обязанность защищать рабочих и обеспечивать более справедливые условия, несмотря на продолжающиеся экономические трудности."
ARG_argentina_diversa_libre: "Более разнообразная и свободная Аргентина"
ARG_argentina_diversa_libre_desc: "Статья 86 Аргентинского уголовного кодекса запрещает аборт, разрешая его только в крайних случаях — в частности, когда беременность является результатом изнасилования или представляет серьезную угрозу для здоровья женщины. Бывший президент Маурисио Макри попытался легализовать аборт, но проект закона в итоге провалился в парламенте. Этот результат отразил глубоко консервативный и «патриархальный» характер как аргентинского общества, так и многих его законодателей.\n\nОднако борьба не закончилась. Президент Альберто Фернандес выразил твердую приверженность продвижению репродуктивных прав и преодолению давнего табу, окружающего аборт. На этот раз правительство лучше подготовлено и более решимо добиться реальных изменений. В дополнение к поддержке легализации аборта, президент Фернандес стремится расширить прогрессивные социальные программы, продолжив работу, начатую более десяти лет назад. Его цель — удовлетворить ожидания избирателей, которые поддержали его, и бросить вызов «патриархальным» структурам, все еще существующим в аргентинской политике и обществе."
ARG_aborto_libre_gratuito: "Свободный и легальный аборт"
ARG_aborto_libre_gratuito_desc: "Аборты — мало каких вопросов так глубоко разделили Аргентину на протяжении всей ее истории. Согласно статье 86 Уголовного кодекса, процедура разрешена только в случаях изнасилования или когда жизнь женщины находится в опасности. Однако эти ограничения теперь осуждаются как «патриархальные реликты», и, как нам говорят, их необходимо стереть с лица земли во имя так называемых «женских прав». Удобно, что эта крестовая поход идеально вписывается в повестку дня Кристины, что гарантирует, что законопроект пройдет через парламент без серьезного сопротивления. В отличие от многих неудачных попыток в прошлом, на этот раз движение вооружено большей силой и решимостью сломать последние барьеры «патриархата».\n\nРеформа обещает, что женщины получат «право» на «прекращение» беременности до четырнадцатой недели. Больше, как нам говорят, они не будут вынуждены нести «нежелательных детей»; теперь они могут быстро и легко «избавиться» от них. Такая мера провозглашается не просто как законодательство, а как символический удар по самому обществу — камень основы нового, «правильного» порядка. Для нас, ее поборников, это больше, чем закон: это боевой флаг, поднятый против столетий «традиции». Мы провозглашаем, что «старый порядок» рушится, что «патриархальная» структура вскоре рухнет под собственным весом, и что Аргентина будет праздновать свое возрождение в нашем образе. В их видении каждый аборт — это не только личный акт, но и победа — первый удар, который навсегда сокрушит «патриархат», очистив путь для общества, перестроенного по нашему кредо."
ARG_planes_de_la_mesa_del_hambre: "Планы Стола Голода"
ARG_planes_de_la_mesa_del_hambre_desc: "Идея создания «Стола Голода» не родилась в один день, но давно вынашивалась президентом Альберто Фернандесом. Всего десять дней после нашей инаугурации он превратил эту визию в реальность, основав Аргентинский федеральный совет по борьбе с голодом в рамках более широкого плана действий «Аргентина против голода». С приходом нового года мы несем ответственность за продолжение этой работы, за придание формы нации, где ни один гражданин не остается за бортом.\n\nНа практике президент Фернандес запланировал два совещания круглого стола в этом году, направленных на запуск новых инициатив и укрепление тех, которые уже начаты с первого совещания, состоявшегося 20 декабря. Эти комитеты будут служить инструментами тщательного анализа, позволяя нам оценить самые насущные нужды страны и определить курс действий. Пришло время двигаться вперед с решимостью, к давно ожидаемой мечте о свободной от голода Аргентине."
ARG_crear_consejo_seguridad: "Создать Совет безопасности"
ARG_crear_consejo_seguridad_desc: "Совет безопасности — не новое изобретение, а учреждение, корни которого уходят в президентство Карлоса Менега в 1991 году, основанное на законе о внутренней безопасности. Несколько лет спустя Сабина Фредерик вместе с тогдашним президентским кандидатом Альберто Фернандесом возродили эту визию, выступая за создание современного Совета безопасности для замены существующего Министерства национальной безопасности. Утвержденная цель, как сам Фернандес однажды заявил, «заключается в том, чтобы обеспечить, чтобы безопасность перестала рассматриваться как узко национальный вопрос, а стала восприниматься как универсальная ответственность, разделяемая всеми».\n\nТеперь, после долгого ожидания, мы наконец стоим на пороге превращения этой визии в реальность. Пришло время переделать рамки безопасности Аргентины, заменить устаревшие механизмы Советом, посвященным не просто исполнению, но и справедливости. Если только это преобразование не будет сорвано непредвиденными препятствиями, оно укрепит верховенство права, восстановит общественное доверие и выполнит еще одно давнее обещание аргентинскому народу."
ARG_consumo_nacional_popular: "Национальное и народное потребление"
ARG_consumo_nacional_popular_desc: "Миллионы аргентинцев остаются в тяжелом положении, не в состоянии купить даже основные продукты из-за бесконечной инфляции песо и отсутствия стабильных, достойных доходов, которые бы восстановили покупательную способность. Они избрали нас, чтобы мы решили эти проблемы, и каковы ли мы лидеры, если мы не поможем бедным? Пришло время превратить наши обещания в реальность, чтобы избиратели никогда не сомневались в своем выборе.\n\nЧерез диалог и переговоры мы достигли консенсуса, заставив крупнейшие супермаркеты по всей стране внедрить глубокие скидки. Этот шаг стимулирует спрос, восстанавливает некоторую покупательную способность и дает трудящимся семьям шанс жить с достоинством. Одновременно он будет генерировать больший доход за счет увеличения оборота от обычных граждан. Супермаркеты примут эти меры, потому что мы предоставим им привилегии взамен. В итоге все выиграют: люди, нуждающиеся в еде, супермаркеты и мы, правительство, которое держит свое слово."
ARG_alberto_y_obreros: "Альберто и рабочие"
ARG_alberto_y_obreros_desc: "Рабочие, класс, долго угнетенный богатой буржуазией, теми теневыми правителями, которые тянут за нити PRO и других либерально-правых партий, перенесли поколения несправедливости. В нашей кампании мы пообещали защищать их, стоять за обычных граждан против бремени эксплуатации, и взамен они положили в нас свою веру, предоставив власть и легитимность. Теперь, стоя на вершине власти, с возможностями определять судьбу нации, пришло время выполнить наши обещания.\n\nНо мы знаем, что баланс власти хрупок. Чтобы поддержать наших союзников, большая часть того, что мы дадим, будет в виде популистских жестов — громких слов, а не всеобъемлющих деяний. Но даже в этом посеянно семя. Шаг за шагом мы построим будущее, в котором рабочие больше не будут цепями к буржуазии, а смогут жить с достоинством. Пока же наш путь осторожный, утешая как олигархических партнеров, которые поддерживают нас, так и рабочий класс, чью веру мы не можем себе позволить предать."
ARG_dolar_productivo_exportaciones: "Продуктивный и экспортный доллар"
ARG_dolar_productivo_exportaciones_desc: "В настоящее время обменный курс доллара находится на историческом максимуме, превысив даже рекорды 2007 года. Во время нашей избирательной кампании мы пообещали предоставить продуктивный и экспортно-ориентированный доллар, который укрепит экономику Аргентины и восстановит доверие. Почти сразу после вступления в должность в конце 2019 года мы попытались выполнить это обещание, подготовив рамки для реформы регулирования. Несмотря на короткое время с момента его реализации, экспорт уже начал расти, доказывая, что решимость и планирование приносят результаты.\n\nМногие так называемые эксперты утверждают, что годовые экспорты неизбежно рухнут, если мы введем регулирование экспорта. Однако их слова не имеют веса. Их не выбрал народ, они не представляют народ, и у них нет мандата диктовать политику. Они просто привилегированные критики, жаждющие увидеть, как аргентинцы страдают, в то время как они сами процветают. Мы не будем подчиниться таким голосам. Пришло время выполнить наше обещание любыми необходимыми средствами, без колебаний и без компромиссов."
ARG_reforma_judicial_necesaria: "Судебная реформа необходима"
ARG_reforma_judicial_necesaria_desc: "Судебная система гнила, гнездо либеральных, антиперонистских судей, чья предвзятость ядом поражает саму основу справедливости. Текущий суд стал самым предвзятым и препятствующим в истории Аргентины, и его существование усложняет каждый шаг нашего президентства. Однако эта проблема была предвидна давно, когда президент Альберто Фернандес и вице-президент Кристина Киршнер впервые представили глубокую реформу судебной системы — ту, которая позволила бы правительству назначать действительно объективных судей и удалять тех, кто действует просто как политические агенты в мантиях.\n\nИдея долго пребывала в обсуждениях, но ее неотложность никогда не была выше. Если мы осмелимся пересмотреть наш подход, мы сможем наконец разгромить либеральную крепость и заменить ее судебным органом, преданным справедливости и благосостоянию нации. Требуется решимость: быстро и решающе провести реформу через парламент, возможно, даже до того, как оппоненты успеют мобилизовать сопротивление. Только тогда Аргентина получит суд, который не стоит против государства и не слепым образом за него, а твердо на стороне справедливости."
ARG_futbol_para_todos: " Футбол для всех"
ARG_futbol_para_todos_desc: "Футбол объединяет миллионы аргентинцев, соединяя людей, которые, возможно, никогда не узнают друг друга, но разделяют одну и ту же страсть. Легендарный дерби между Boca Juniors и River Plate — не только самый известный в Аргентине, но и один из самых жестоких в мире. Как однажды сказал Ювенал: «Хлеб и зрелища», и футбол — это ultime зрелище, которое захватывает сердца, часто отвлекая граждан от смуты национальной жизни.\n\nТем не менее, бесчисленные аргентинцы не могут позволить себе дорогое посещение стадионов или бесконечные подписки, необходимые просто для просмотра одного матча. Чтобы бороться с этой несправедливостью, президент Альберто Фернандес пообещал сделать футбол более доступным, более по-настоящему народным. Стоимость стриминга будет снижена, и новые футбольные поля будут построены в районах, где возможности играть ограничены. Футбол — это больше, чем развлечение — это общий язык надежды, единства и радости. И пока есть футбол, аргентинцы найдут причину почувствовать счастье."
ARG_revivir_el_cine_argentino: "Возрождение аргентинского кино"
ARG_revivir_el_cine_argentino_desc: "Золотые 1930-е годы ознаменовали эпоху «Аргентинского Голливуда», когда такие фильмы, как «Война гаучо» и «Вторник, Орхидеи», привлекли внимание всего мира. Аргентинское кино когда-то пользовалось признанием во всем мире, его истории вдохновляли даже Голливуд. Однако золотая эра уступила место экспериментальным работам — фильмам, таким как «Хроника одного мальчика», «Инвазия» и «Час рогов», которые, хотя и получили признание, не могли поддержать ту же блеск. С приходом Последней военной диктатуры промышленность понесла сокрушительный ущерб, и свет аргентинского кино потух.\n\nСегодня президент Альберто Фернандес стремится восстановить эту потерянную славу. Его план — субсидировать студии, направив государственные средства для стимулирования кинематографистов к созданию работ реальной ценности, способных завоевать как местную гордость, так и международное признание. Бюджет может почувствовать натяжение, но если аргентинское кино снова поднимется, народ обрадуется. Они будут воплощать культуру, а не жестокую экономию, и в отличие от либеральных критиков, они не будут маршировать против воображаемых нехваток, а праздновать возрождение искусства."
ARG_retenciones_al_campo: "Удержания в сельском хозяйстве"
ARG_retenciones_al_campo_desc: "Наша größte паразитическая проблема кроется в так называемых сельских олигархах, тех, которые закрепились в деревнях и удаленных провинциях. Из-за их жадности обычные фермеры терпят лишения, а государственный бюджет не получает справедливую долю ресурсов, которые ему так срочно нужны. Уничтожение этих паразитов, возможно, не было одним из наших предвыборных обещаний, но это, безусловно, облегчит бремя, несущееся каждым аргентинским гражданином, не так ли?

С полным одобрением президента Альберто Фернандеса мы наконец введем широкие налоги на сельских олигархов, как это было во время критического года 2008. Некоторые могут спросить, почему весь сельский населенный пункт должен вносить свой вклад, но правда ясна: почти все, кто называет себя крестьянами, принадлежат к этой олигархической классу. Они — паразиты, которые должны нести на себе самую тяжелую фискальную нагрузку, чтобы наконец-то можно было достигнуть долгожданной справедливости. Аргентинцы позднее поблагодарят нас, потому что только такими мерами наш национальный казначейство вернется к силе и снова наполнится процветанием."
ARG_revivir_el_plan_patria_grande: "Возрождение плана Патрия Гранде"
ARG_revivir_el_plan_patria_grande_desc: "Программа (Патрия Гранде) — не новшество. Основанная в 2006 году, она стремилась к регулированию резидентства граждан МЕРКОСУРА, которые давно проживали в Аргентине без надлежащей документации. С самого начала ее миссия была ясна и смела: признать этих людей как часть социальной ткани нации и интегрировать их юридически и экономически. Инициатива превзошла все ожидания, спровоцировав замечательную волну иммиграции, которая оживила сообщества, заполнила вакантные рабочие места и дала новую силу аргентинскому обществу. Однако после этого начального бума импульс угас. Программа продолжилась, но без дальнейших амбиций она принесла мало долговременных преобразований.

Вот почему президент Альберто Фернандес поклялся поднять Патрия Гранде на новую высоту: в континентальное приглашение для каждого латиноамериканца, готового вносить свой вклад в будущее Аргентины. Его визия — это ожившие города и процветающая промышленность, демографическое возрождение, способное поднять нацию к процветанию. Если расчеты окажутся точными, Аргентина скоро может столкнуться с приростом населения, который укрепит экономику и преобразует ее региональную роль. Мечта не только в приветствии новичков, но и в превращении их энергии в фундамент поднимающейся силы — республики, готовой к руководству, а не к подражанию, к диктату условий, а не к их принятию."
ARG_el_superavit_que_necesitabamos: "Нужный нам профицит"
ARG_el_superavit_que_necesitabamos_desc: "Когда мы запустили нашу избирательную кампанию, одним из наших главных экономических обещаний было «накопить резервы», превратив существующие 43,7 миллиарда долларов в монументальный фонд, который превзойдет достижения бывшего президента Маурисио Макри. Вначале администрация столкнулась с неотложными приоритетами, которые требовали немедленного внимания, оставив мало места для накопления профицита. Однако с завершением начальных работ пришло время выполнить обещания, которые все еще не выполнены, и столкнуться с вызовами, которые определяют экономический горизонт Аргентины.

Полноценная стратегия президента Альберто Фернандеса по накоплению резервов предусматривает несколько инструментов: создание строгой системы валютного контроля «CEPO Cambiario», переговоры о новом соглашении о валютном свопе, внедрение селективных ограничений на импорт и, при необходимости, тщательно управляемый процесс реструктуризации долга с МВФ. Эти меры — не просто бюрократические маневры, а сознательные шаги к суверенитету и стабильности. Скоро нация будет праздновать устойчивость своей экономики, а наследие либерального Макри уйдет в прошлое, затмеваемое новой эпохой фискальной силы и политической решимости."
ARG_acabar_con_la_grieta: "Положить конец разрыву"
ARG_acabar_con_la_grieta_desc: "Если вы спросите у вашего местного мэра, к какому направлению перонизма он причисляет себя, он, возможно, даст ответ, который ожидают киршнеристские элиты. Спросите у губернатора — он перечистит фразу, любимую федеральными перонистскими лидерами. Спросите у президента — его ответ не удовлетворит ни одну из групп. Аргентина носит свои расколы на рукаве, и Partido Justicialista содержит в себе созвездие фракций — от киршнеристов до menemистов — каждая из которых претендует на душу страны.

Но настал час сшить разрыв. Президент Альберто Фернандес, измученный постоянными фракционными спорами — особенно теми, которые разлетаются с провинции на провинцию — теперь стремится соединить нацию под единым видением. Он намеревается протянуть свою решающую руку через республику и навязать единство там, где была дискордия. Ни одна сила, местная или провинциальная, не будет разрешена подрывать президентство; цена за бунт будет суровой. Это призыв к сплочению, суровый, но нежный: формировать будущее Аргентины не мелким соперничеством, а сдержанной, непоколебимой волей. Он говорит не для того, чтобы сломить несогласие, а чтобы ковать прочный консенсус, коренящийся в справедливости, процветании и общей достоинстве для каждой общины по всей стране."
ARG_la_nueva_decada_ganada: "Новое десятилетие — победа"
ARG_la_nueva_decada_ganada_desc: "С реформами, которые мы продвинули, решениями, которые мы выдержали в законодательных боях в парламенте, и обещаниями, уже выполненными, мы могли бы поддаться искушению заявить, что пришло время для отдыха. Однако ясно, что Аргентина все еще требует настойчивости. Мы обеспечили более широкую народную поддержку; огромный фискальный профицит, вместе с глубокими регулировками судебной системы и всплеском иммиграции, превратили нацию в более сильную и уверенную версию себя — лучше вчерашней, хотя все еще далекую от вершины своего потенциала.

Хотя многие из этих действий были осуществлены в течение первого года нашего мандата, они уже позволяют нам заглянуть в контуры всего десятилетия, которое, возможно, будет завоевано нашими усилиями. Растущий приток общественной поддержки укрепляет наши перспективы на выборы 2021 года и расширяет свой обещание на 2023 год, когда победа означала бы не просто влияние, а подлинное руководство десятилетием вперед. И все же, несмотря на ощущение, что история изгибается в нашу пользу, мы остаемся сознательными, что триумф не может быть дан за гарантированным. Десятилетие может казаться выигранным, но задача по-настоящему удержать судьбу в своих руках только началась."
ARG_capitan_beto_y_las_crisis: "Капитан Бето и кризисы"
ARG_capitan_beto_y_las_crisis_desc: "Аргентина сейчас сталкивается с самым серьезным неэкономическим кризисом XXI века. COVID-19, вирус, прибывший из Китая, представляет не только самую серьезную угрозу здоровью нашего столетия, но и прямую опасность для стабильности, институтов и образа жизни Аргентины. Он уже потряс мир и будет продолжать быстро распространяться, если не будут приняты кардинальные меры. Для Аргентины колебание означает крах, а срочность может еще спасти жизни и сохранить хрупкий баланс нашего общества. Экстренные меры должны быть приняты немедленно, прежде чем пандемия вызовет свой полный ущерб.

На столе президента Альберто Фернандеса лежат два решающих варианта. Он может следовать плану, очерченному Кристиной Киршнер, признавая ее решающее влияние, но обеспечив гармонию правительства и поддержку киршнеризма, тем самым поддерживая стабильность. Или он может выбрать путь независимости, утверждая себя как собственный президент, но рискуя разрывом с киршнеристами — шаг, который может ослабить его мандат или даже подтолкнуть к отставке. Это дилемма не может ждать. Президент должен решить сейчас, потому что в его выборе кроется выживание Аргентины самой."
ARG_la_independencia_de_alberto: "Предательство Альберто"
ARG_la_independencia_de_alberto_desc: "Президент ищет свой собственный путь."
ARG_la_jefa_manda: "Начальница в управлении"
ARG_la_jefa_manda_desc: "После долгих размышлений и под огромным временным давлением президент Альберто Фернандес решил принять предложение, сделанное Кристиной Фернандес де Киршнер в ответ на кризис COVID-19. Несмотря на личное желание действовать независимо, он признал, что выживание и процветание Аргентины требуют сотрудничества с ней, даже если это означает работать с кем-то, кого он фундаментально не доверяет. Это трудное решение было принято во благо нации и ее народа, приоритетизируя неотложную борьбу с пандемией над личными различиями или политическими конфликтами.

Наиболее важным аспектом этого плана является формирование правительства, которое объединит как преданных президента Фернандеса, так и киршнеристов, позволяя терпимости и сотрудничеству в поиске решений кризису COVID-19 и более сильному будущему для Аргентины. Естественно, идеологические разногласия будут сохраняться, но по крайней мере будет существовать рамка для сотрудничества. Во благо страны, ее граждан и стабильности обе фракции должны отложить различия и действовать совместно, демонстрируя, что даже в времена глубокого разделения единство во имя общего блага остается возможным."
ARG_el_triunvirato_de_la_pandemia: "Триумвират пандемии"
ARG_el_triunvirato_de_la_pandemia_desc: "Пандемия продолжает разрушать все на своем пути. То, что началось как локальный вспышка в Китае, превратилось в глобальный кризис, разжигая неопределенность по всему миру. В Аргентине инфляция упала как побочный эффект пандемии, что предоставило некоторое временное облегчение экономике — но трагической человеческой стоимости. COVID-19 оказывается куда смертельнее, чем кто-либо предполагал, и требуются срочные меры, прежде чем вирус унесет еще больше жизней по всей стране.

Чтобы бороться с этой угрозой, президент Альберто Фернандес, вице-президент Кристина Фернандес де Киршнер и министр здравоохранения Гонсало Агареско объединились в мощный триумвират, посвященный защите Аргентины и ее народа. Их единство и решимость являются ключом к преодолению этого кризиса, а их коллективная власть будет использоваться для обеспечения того, чтобы страна вышла из этого испытания сильнее, чем когда-либо. Вместе они будут бороться за жизнь, свободу и будущее нации."
ARG_gobierno_para_el_pueblo: "Правительство для народа"
ARG_gobierno_para_el_pueblo_desc: "Итак, мы вернулись к повестке. После огромного конфликта с COVID-19, в котором правительство проявило смелость и решительность, пришло время вернуть государственное управление на его правильный путь. Президент Альберто Фернандес и вице-президент Кристина Фернандес де Киршнер будут работать вместе, чтобы сделать Аргентину сильнее, чем когда-либо. Нет больше разногласий, нет больше споров — только единый призыв к служению народу и построению лучшего будущего. Это новая эра для Аргентины, и правительство будет работать неустанно, чтобы обеспечить, чтобы этот новый путь был успешным."
ARG_la_jefe_continua_encendida: "Начальница продолжает гореть"
ARG_la_jefe_continua_encendida_desc: "Здоровье вице-президента Кристины Фернандес де Киршнер, как и ее энергия, оставляется приоритетом для правительства. После успешной операции по замене имплантированного кардиостимулятора (ИКС), она продолжает оставаться ключевым лидером и влиятельной фигурой в политической сфере Аргентины. Ее решимость и преданность делу народу продолжают вдохновлять и мотивировать. Несмотря на все испытания, которые ей пришлось пережить, Кристина Фернандес де Киршнер продолжает быть неугасимой силой, которая направляет и вдохновляет правительство на выполнение его миссии."
ARG_crisis_economica_2020: "Экономический кризис 2020"
ARG_crisis_economica_2020_desc: "То, что мы так долго боялись, наконец-то произошло. COVID-19 нанес сокрушительный удар по экономике Аргентины, уже страдающей от предыдущих кризисов. Пандемия вызвала резкий спад промышленного производства, рост безработицы и серьезные финансовые потери. Наши доходы рухнули, а инфляция снова начала расти, что угрожает нашему плану по восстановлению и процветанию. В данный момент, в июле 2020 года, экономика находится в самом тяжелом состоянии за последние десятилетия. Мы должны действовать сейчас, чтобы спасти нашу страну от полного экономического краха.

Президент Альберто Фернандес и его правительство столкнулись с самой серьезной экономической угрозой за всю историю Аргентины. Нам нужно сделать трудный выбор: либо придерживаться плана Кристины Фернандес де Киршнер, который, возможно, не подходит к текущей ситуации, либо разработать новый подход, который может спасти экономику, но при этом разобьет правительство. Важно найти баланс между старыми и новыми подходами, чтобы выйти из этого кризиса сильнее, чем когда-либо. Наше будущее зависит от наших решений, и мы должны быть готовы к любым последствиям."
ARG_el_plan_k: "План К"
ARG_el_plan_k_desc: "Вице-президент Кристина Фернандес де Киршнер предложила свой собственный план по преодолению экономического кризиса 2020 года. Ее подход основан на сильном государственном вмешательстве в экономику, увеличении социальных расходов и укреплении промышленного сектора. Она утверждает, что только такой подход может спасти Аргентину от полного экономического краха и вернуть народу надежду на лучшее будущее. Несмотря на критику со стороны некоторых экспертов, которая утверждает, что этот план нереализуем и приведет к еще большей инфляции, Кристина Фернандес де Киршнер остается уверенной в своих убеждениях и продолжает настаивать на своем подходе.

План К предусматривает следующие ключевые меры:

1. Усиление государственного контроля над экономикой, включая национализацию некоторых ключевых отраслей и установление ценовых регулировок.

2. Увеличение социальных расходов, включая расширение программ поддержки малоимущих семей и создание новых рабочих мест.

3. Укрепление промышленного сектора, включая предоставление субсидий и налоговых льгот для отечественных предприятий.

4. Укрепление национальной валюты и борьба с инфляцией через строгую денежно-кредитную политику.

Этот план, безусловно, амбициозный, но вице-президент Кристина Фернандес де Киршнер утверждает, что он необходим для спасения Аргентины. Вопрос только в том, готов ли народ и правительство к таким радикальным изменениям."
ARG_el_plan_f: "План Ф"
ARG_el_plan_f_desc: "Президент Альберто Фернандес разработал свой собственный план по преодолению экономического кризиса 2020 года. Его подход основан на более умеренном государственном вмешательстве, поддержке частного сектора и укреплении международных отношений. Он утверждает, что только такой подход может привести Аргентину к стабильности и процветанию, не разрывая при этом правительство. Несмотря на критику со стороны вице-президента Кристины Фернандес де Киршнер, которая утверждает, что этот план слишком консервативен и не решит основные проблемы, президент Фернандес остается уверенным в своих убеждениях и продолжает настаивать на своем подходе.

План Ф предусматривает следующие ключевые меры:

1. Создание благоприятных условий для развития частного сектора, включая снижение налоговых нагрузок и упрощение административных процедур.

2. Укрепление международных отношений, включая восстановление отношений с МВФ и привлечение иностранных инвестиций.

3. Реализация реформ в сфере образования и здравоохранения, направленных на улучшение качества жизни населения.

4. Борьба с коррупцией и улучшение прозрачности государственных финансов.

Этот план, безусловно, более умеренный, чем План К, но президент Фернандес утверждает, что он необходим для достижения стабильности и процветания Аргентины. Вопрос только в том, готов ли народ и правительство к таким изменениям."
ARG_la_eleccion_de_2023: "Выборы 2023"
ARG_la_eleccion_de_2023_desc: "Выборы 2023 года будут определять будущее Аргентины. После多年的经济危机和政治动荡, народ готов к изменениям. Президент Альберто Фернандес и вице-президент Кристина Фернандес де Киршнер будут бороться за переизбрание, но они столкнутся с сильной оппозицией. Нужно будет сделать трудный выбор: либо придерживаться текущего курса, который, возможно, не подходит к текущей ситуации, либо разработать новый подход, который может привести Аргентину к стабильности и процветанию."
ARG_el_nuevo_pacto_social: "Новый социальный пакт"
ARG_el_nuevo_pacto_social_desc: "Взаимодействие между бизнесменами и профсоюзными лидерами всегда было важным элементом истории Аргентины. В XX веке корпоратизм был введен Пероном и функционировал довольно эффективно. Однако в XXI веке реформы Карлоса Менеха разрушили корпоратистскую структуру в пользу свободно-рыночной модели. Во время президентства Маурисио Макри этот сдвиг стал еще более очевиден, когда профсоюзы организовали длительные забастовки, в то время как Макри сосредоточился почти исключительно на бизнесе, а не на людях.

Теперь президент Фернандес намеревается повернуть вспять эту тенденцию, создав новый пакт между бизнесменами и профсоюзными лидерами, особенно в свете необходимости сотрудничества во время кризиса COVID-19. Мы признали свои прошлые ошибки, и Фернандес полностью предан работе на благо народа и рабочих, а не пляску под ритм корпоративных интересов. Мы не марионетки, и этот пакет ясно продемонстрирует, что бизнес должен следовать нашему лидерству, а не наоборот."
ARG_la_lista_negra_de_opositores: "Черный список оппонентов"
ARG_la_lista_negra_de_opositores_desc: "В 1976 году военные и крайне правые силы свергли Изабель Перон, лидера Partido Justicialista и президента Аргентины, по одной причине: она была перонисткой. Монтерос и ERP угрожали убить Перона при его возвращении, потому что он тоже был перонисткой. UCR и подобные группы угрожали свергнуть правительство Partido Justicialista просто потому, что оно представляло перонизм. Позже PRO и Маурисио Макри рассматривали возможность полного запрета перонизма, как в 50-х и 60-х годах. Тем не менее, мы пережили все эти угрозы.

Однако сегодня угроза переворота сильнее, чем когда-либо. Либертарианцы и их фанатики отчаянно пытаются захватить власть, зная, что народ все еще полагается на нас. Вот почему президент Фернандес предлагает создать список оппозиционных фигур, которые представляют угрозу для Аргентины, и использовать такие меры, как шантаж, увольнение и политическая изоляция, чтобы нейтрализовать их. Да, такие действия могут быть неконституционными и противоречить юридическим нормам, но Конституция не дает нам других инструментов для борьбы с реальной, растущей угрозой переворота. Ничего не делать было бы гораздо хуже."
ARG_perseguir_con_la_ley_a_opositores: "Преследование оппонентов по закону"
ARG_perseguir_con_la_ley_a_opositores_desc: "Несмотря на всю глубокую вражду президента Фернандеса к Киршнерам, последние продемонстрировали поистине замечательное мастерство в обращении с оппозицией, которая постоянно на грани тюремного заключения. Нéstор Kirchner отменил Ley de Punto Final и Ley de Obediencia Debida, открыв преследование виновных в преступлениях грязной войны, и тем самым фактически принудив вооруженные силы к подчинению. Kristina Kirchner, в свою очередь, нейтрализовала влияние независимых медиа-гигантов Clarín и La Nacion, одновременно укрепив контроль над прессой через серию решительных реформ.

Их политический опыт бесценен: они овладели искусством противостояния оппозиции в рамках закона, и мы тоже будем. Наш первый пункт в списке — бывший президент Аргентины Маурисио Макри. Во время его администрации появились доказательства незаконного слежения и шпионажа, включая наблюдение за родственниками погибших членов экипажа подводной лодки ARA San Juan, а также слежение за оппозиционными фигурами через разведывательное агентство AFI. Скандал FMIgate еще больше раскрыл его администрацию, наряду с откровениями в утечках офшорных компаний о Fleg Trading Ltd. и Kagemusha S.A., обе связанные с семьей Макри. Он также манипулировал налоговым органом AFIP и инициировал преследование перонистов — по этим причинам он будет первым из многих, кто столкнется с правосудием. Это станет началом тщательного очищения Аргентины, проводимого законом и направленного на тех, кто давно заслуживает ответственности."
ARG_intimidar_legalmente_a_opositores: "Юридическое запугивание оппонентов"
ARG_intimidar_legalmente_a_opositores_desc: "Несмотря на всю глубокую вражду президента Фернандеса к Киршнерам, последние продемонстрировали поистине замечательное мастерство в обращении с оппозицией, которая постоянно на грани тюремного заключения. Нéstор Kirchner отменил Ley de Punto Final и Ley de Obediencia Debida, открыв преследование виновных в преступлениях грязной войны, и тем самым фактически принудив вооруженные силы к подчинению. Kristina Kirchner, в свою очередь, нейтрализовала влияние независимых медиа-гигантов Clarín и La Nacion, одновременно укрепив контроль над прессой через серию решительных реформ.

Но мы не можем просто продолжать по пути Киршнеров. Ни Кристина, ни Нестор не были абсолютно правы, и Кристина в частности не должна была вести такую открытую войну против газет. Наш подход будет другим. Мы будем стремиться юридически давить и запугивать оппонентов, чтобы они подумали дважды, прежде чем распространять абсурдности о президенте Фернандесе. Журналисты, а также те, кто работает в государственных и политических организациях, будут тихо, но твердо напоминаться о последствиях необдуманных обвинений. Цель — предотвратить, чтобы дезинформация отравляла умы людей и заставляла их верить, что президент Фернандес и его администрация — мошенники или злодеи."
ARG_barrer_con_las_causas_de_cfk: "Устранение судебных дел CFK"
ARG_barrer_con_las_causas_de_cfk_desc: "Дело «Vialidad», дело «Cuadernos», дело AMIA, Hotesur и Los Sauces, а также дело «Dólar Futuro» — все эти процессы, возбужденные против вице-президента Кристины Фернандес де Киршнер, мы представляем и действительно считаем политически мотивированными усилиями по подрыву репутации киршнеристского движения и Partido Justicialista.

Чтобы обеспечить победу справедливости, президент Альберто Фернандес предпримет шаги для задержки, переноса или приостановки слушаний, связанных с Кристиной Фернандес де Киршнер, по процессуальным основаниям. Хотя такие меры могут быть критикованы как недемократические, они предоставят необходимое время для подготовки полной юридической защиты и представления всесторонних аргументов, демонстрирующих ее невиновность. Эти обвинения, побуждаемые правой оппозицией, встретят надлежащий судебный процесс, предоставив судебной власти время, необходимое для принятия решения, поддерживающего справедливость."
ARG_legalizar_el_aborto: "Легализация аборта"
ARG_legalizar_el_aborto_desc: "Хотя мы уже достигли значительных успехов в области прав женщин — в 1921 году предоставив аборт в случаях, когда беременность угрожала жизни женщины или включала изнасилование женщин с психическими заболеваниями, а в 2012 году расширив доступ для всех жертв изнасилования — аргентинское общество по-прежнему в основном консервативно. Бывший президент Маурисио Макри не смог утвердить более широкий закон о правах на аборт в парламенте в 2018 году.

Теперь мы продолжим это усилие. Президент Альберто Фернандес представит полностью подготовленный закон на голосование в Аргентинском конгрессе. Слишком долго мы откладывали выполнение наших обещаний, но с облегчением ситуации с COVID мы, наконец, можем сделать первый решительный шаг к прогрессивизму — первый шаг к справедливой, единой и равной Аргентине для трудящихся.

ВивАргентина!"
ARG_poner_fin_al_patriarcado: "Положить конец патриархату"
ARG_poner_fin_al_patriarcado_desc: "С принятием и вступлением в силу закона о аборте, наряду с десятками других малых и больших инициатив в области прав женщин, учреждением Министерства женщин, гендера и диверситета, которое призвано превратить Аргентину в более равное общество, постепенным введением третьего, небинарного гендерного варианта в национальных документах идентификации, квотами для трансгендерных людей на рабочих местах, расширением экономической поддержки беременным женщинам и малоимущим семьям, а также формальным признанием гендерной разницы в зарплатах на уровне Министерства экономики, теперь можно четко заявить: основы патриархата подорваны.

Конечно, это не конец — но первая битва выиграна, и мы намерены продолжать этот импульс."
ARG_alberto_con_la_cgt: "Альберто с CGT"
ARG_alberto_con_la_cgt_desc: "Confederacion General del Trabajo — это самая мощная профсоюзная организация в Аргентине, и ее поддержка необходима президенту Альберто Фернандесу, если он надеется обеспечить победу на промежуточных выборах. С поддержкой CGT можно мобилизовать десятки тысяч рабочих для голосования за PJ, а не для ухода в сторону UCR или FIT-Unidad. По этой причине президент Фернандес ищет встречи с основными лидерами профсоюза, зная, что их одобрение будет решающим для формирования результата голосования.

Чтобы завоевать CGT, Фернандес готов обещать субсидии для рабочих — меру, которая может защитить семьи от нужды и укрепить доверие к его лидерству. Наряду с этим он намерен подтвердить свое обязательство к трудовым реформам, которые защитят права рабочих и обеспечат, чтобы голос организованного труда оставался центральным в политической жизни Аргентины. Это соглашение может ознаменовать начало новой эры — подлинного рабочего государства, построенного не для олигархов, как хотел бы оппозиция, а для людей, которые поставили Фернандеса у власти и ради которых он клялся управлять."
ARG_la_censura_politicamente_correcta: "Политически правильная цензура"
ARG_la_censura_politicamente_correcta_desc: "Каждый день оппозиция произносит сотни фраз, нарушающих принципы политической корректности — слова, помеченные как расистские, дискриминационные или ксенофобные. Даже безобидные вещи, связанные с культурой, искусством или музыкой, осуждаются как проблематичные, что прямо противоречит прогрессивному курсу, установленному президентом Фернандесом. Оппоненты могут кричать «цензура», но то, что они называют цензурой, на самом деле — усилие построить общество уважения, достоинства и равенства — ценностей, которые оппозиция никогда не принимала.

По этой причине INADI не колеблется вмешиваться. Его долг — бороться с открыто оскорбительным языком, а также с тонкими остатками устаревшего языка и мышления. Старые телешоу, популярные музыканты, даже культовые сериалы, такие как Dragon Ball, могут потребовать пересмотра, ограничения или полного удаления. Это может показаться суровым, но это во благо: чтобы ни один гражданин не чувствовал «оскорбления» и чтобы сохранить доверие марксистских сторонников, чья лояльность необходима для будущего. Эта кампания за политическую корректность не может позволять колебаний или компромиссов. Каждое слово, каждое изображение, каждый символ должны служить рождению новой Аргентины — очищенной от оскорблений, единой в чувствительности и непоколебимой в своих ценностях."
ARG_mas_planes_sociales: "Больше социальных программ"
ARG_mas_planes_sociales_desc: "Субсидии и слабая популярность PJ среди среднего класса могут казаться разными вопросами, но на самом деле они тесно связаны. Без поддержки этой социальной группы PJ рискует проиграть выборы, так как большинство среднего класса симпатизирует PRO и склонно голосовать за JxC. Пандемия COVID-19 только усугубила проблему: бесчисленные мелкие предприятия разрушаются, многие граждане потеряли работы и доход, а доверие к президенту Фернандесу и PJ падает изо дня в день. Если это доверие полностью иссякнет, политические последствия будут катастрофическими и трудными для исправления.

Тем не менее, Кристина Киршнер предлагает стратегию. Согласно ее плану, президент Фернандес должен предоставлять субсидии аргентинским гражданам, особенно фокусируясь на среднем классе, чтобы предприятия могли выжить как минимум до выборов. Это не только социальная, но и политическая мера: это шанс восстановить часть доверия, которого потеряла PJ, показать, что мы можем защитить людей в время кризиса, и убедить их голосовать за PJ или, по крайней мере, отвернуться от JxC. Даже поддержка других левых сил или федеральных перонистов была бы лучше, чем триумф JxC."
ARG_preparar_elections_2021: "Подготовка к законодательным выборам 2021"
ARG_preparar_elections_2021_desc: "Вскоре Аргентина столкнется с решающими промежуточными выборами в парламент. Несмотря на все усилия правительства, опросы все еще показывают Juntos por el Cambio на первом месте — результат, который не может быть допущен. Все помнят катастрофический эксперимент с Макри — годы долгов, приватизаций и благоприятствования олигархам. Возврат к этим политикам означал бы погружение народа обратно в бедность и передачу государства в руки того же небольшого элита. Такой исход должен быть предотвращен любой ценой.

В этот критический момент Капитан Бето оказывается на стратегическом перепутье. Один вариант — предоставить Кристине Киршнер и ее преданным полный контроль над кампанией. Их машина опытна, их митинги и слоганы более эффективны, чем наши, и они могут остановить JxC. Однако чем сильнее становится Кристина, тем труднее будет сдерживать ее амбиции позже. Другой вариант — президент Фернандес возглавляет кампанию под своим собственным именем. Этот путь может показаться слабее в краткосрочной перспективе, но он напрямую подрывает доминирование Кристины и ослабляет ее марксистскую фракцию. Таким образом дилемма остается: передать победу Кристине, чтобы блокировать JxC, или рискнуть поражением, чтобы уменьшить ее подавляющее влияние. Выбор определит не только выборы 2021 года, но и всю будущую баланс власти в Аргентине."
ARG_la_jefa_dirigira_la_campana: "Начальница возглавит кампанию"
ARG_la_jefa_dirigira_la_campana_desc: "А теперь времени для президента Альберто Фернандеса осталось мало, вынуждая его решить, кто возглавит кампанию PJ. После дней колебаний и размышлений Фернандес наконец передаёт контроль над кампанией Кристине Киршнер и её K-радикалам, убеждаясь, что только они имеют машину и опыт, чтобы предотвратить захват власти JxC. Их способность мобилизовать избирателей, доминировать в медиа и разрушать оппозицию неоспорима, и благодаря этому правящая партия укрепит свою позицию в парламенте, защищаясь от непосредственной угрозы PRO и олигархов.

Но у каждой монеты есть обратная сторона. Кристина, та крыса, которую мы не можем полностью контролировать, неизбежно увеличит свое влияние, и каждый дополнительный место, которое она выигрывает, укрепляет ее когти на правительстве. Если она получит слишком много власти, она вытолкнет министров, поддерживающих Фернандеса, и заменит их преданными собаками, которые живут только для того, чтобы навязывать марксистские политики и блокировать любую реформу, не соответствующую их догме. Для Фернандеса это означает постоянную паралич, бесконечный конфликт и риск превратиться в простую фигуру. Тем не менее, выбор уже сделан, и только Бог знает, спасет ли он президентство или разрушит его."
ARG_apoyar_tolosa_paz: "Поддержать Толоса Паз"
ARG_apoyar_tolosa_paz_desc: "Выборы приближаются все ближе, и все глаза устремлены на провинцию Буэнос-Айрес — решающее поле битвы промежуточных выборов. Кто выиграет здесь, определит баланс власти, и для перонистского движения нет места для поражения. PRO доминирует в столице с 27-го года, и поэтому Кристина Фернандес де Киршнер должна предложить кандидата, способного повернуть ситуацию, фигуру, которая может вдохновить надежду и мобилизовать жителей Буэнос-Айреса в имя PJ и самой Аргентины. В течение длительного времени такой кандидат казался почти невозможным найти, но наконец выбор был сделан.

Её имя — Виктория Толоса Паз, преданная сторонница Кристины, женщина с харизмой и дисциплиной, необходимыми для противостояния машине PRO. С её кандидатурой PJ нашла шанс вернуть влияние. Огромные административные ресурсы будут направлены на её кампанию, так как её триумф означал бы не только победу в Буэнос-Айресе, но и выживание всего правительства. Эти выборы могут либо укрепить доминирование PRO, окончательно похоронив надежды PJ в столице, либо сотрясти статус-кво, придав новое дыхание и обещание другого будущего."
ARG_victoria_kirchnerista: "Победа киршнеризма"
ARG_victoria_kirchnerista_desc: "Голоса были подсчитаны, и результаты наконец-то были раскрыты. На промежуточных выборах PJ одержала победу, укрепив свою позицию по всей стране и решающим образом обыграв JxC. Frente de Todos укрепило свое большинство как в Сенате, так и в Палате депутатов, что сильно расстроило оппозицию и разбило их надежды на захват власти. Аргентинская мечта продолжает жить, и все благодаря Кристине Киршнер и K-радикалам, чья преданность принесла такой решающий триумф в руки президента Фернандеса.

Хотя Кристина и ее K-радикалы получили еще большее влияние на повседневную политическую повестку, а президент Фернандес теперь все больше зависит от их поддержки, этот триумф заложил прочную основу для PJ на предстоящих выборах 2023 года. Эта победа принадлежит народу Аргентины — рабочим, среднему классу, профсоюзам и предпринимателям. В конце концов, это не просто политическая победа; это подтверждение киршнеризма, триумф, который объединяет и укрепляет страну в целом."
ARG_la_campana_de_capitan_beto: "Кампания Капитана Бето"
ARG_la_campana_de_capitan_beto_desc: "А теперь времени для президента Альберто Фернандеса осталось мало, вынуждая его наконец решить, кто возьмет под контроль кампанию PJ. После долгих часов давления, сомнений и размышлений Капитан Бето принимает смелое решение лично возглавить кампанию. Это трудный и рискованный шаг, так как передача всего Кристине Киршнер и ее K-радикалам могла бы гарантировать более сильный избирательный рывок, но Фернандес знает, что полагаться на нее означало бы заплатить высокую политическую цену. Да, PJ может потерять места в парламенте, и если это произойдет, все критики обвинят его в некомпетентности и заявят, что катастрофа родилась из его гордости, утверждая, что все прошло бы лучше под контролем Кристины.

Тем не менее, у каждой монеты есть другая сторона, и на этот раз последствия могут оказаться в пользу Фернандеса. Беря на себя личное лидерство, он не только подрывает растущую тень Кристины, но и укрепляет силы, поддерживающие Фернандеса, как в правительстве, так и в партии. Эта крыса Кристина наконец почувствует, как начинает сокращаться ее влияние, вместе с ней и удушающий паралич, который она накладывает на каждое решение. Наконец, есть шанс начать строить новую эру в Аргентине под собственным руководством Фернандеса, а не под удушающим хваткой коллективной зависимости."
ARG_apoyar_a_leandro_santoro: "Поддержать Леандро Санторо"
ARG_apoyar_a_leandro_santoro_desc: "Выборы приближаются, и все внимание теперь сосредоточено на провинции Буэнос-Айрес — решающем поле битвы промежуточных выборов. Чтобы сохранить влияние, PJ должно обеспечить победу здесь, ибо без Буэнос-Айреса никакая позиция власти не может быть гарантирована. PRO прочно удерживает столицу с 27-го года, и поэтому президент Альберто Фернандес столкнулся с неотложной задачей найти кандидата, способного сломить их доминирование, объединить город под флагом перонизма и предложить аргентинцам надежду на возрождение. После долгих колебаний и изнурительных поисков такая фигура наконец была выбрана.

Его имя — Леандро Санторо. Хотя его часто называют радикалом, киршнеристом и даже альфонсинистом, он обладает редкой способностью преодолевать разногласия и вдохновлять избирателей. Санторо воплощает как преданность делу, так и харизму, чтобы бросить вызов PRO на своей же территории. По этой причине почти все административные ресурсы будут направлены на его кампанию, так как его победа не только закрепит Буэнос-Айрес, но и продемонстрирует, что под руководством президента Фернандеса PJ жива, сильна и готова возглавить Аргентину в новый и светлый век."
ARG_derrota_del_kirchnerismo: "Поражение киршнеризма"
ARG_derrota_del_kirchnerismo_desc: "Голоса подсчитаны, и результаты опубликованы — и они далеки от благоприятных для президента Фернандеса. JxC показал лучший результат, и впервые за сорок лет PJ потеряло свое большинство в Сенате. Это знаменует собой значительный отступ, разбивая иллюзии «аргентинской мечты», которую мы надеялись достичь. Президент Фернандес сталкивается с интенсивной критикой за этот избирательный провал, в то время как новые политические акторы поднимаются на первый план.

Масса, близкий союзник Кристины Киршнер, фактически унаследует политическое влияние, потерянное президентом Фернандесом в результате этих результатов. Законодательный прогресс, как ожидается, замрет, погрузив правительство в политический тупик. Как сам президент Фернандес ожидает, многих министров, поддерживающих Фернандеса, могут быть вынуждены уйти в сторону, так как Кристина, вероятно, начнет свои стратегические чистки, помещая своих преданных «товарищей» на ключевые должности и продвигая марксистские политики в администрации. Этот сдвиг угрожает изменить правительство и его повестку на обозримое будущее."
ARG_un_respiro_para_alberto: "Одышка для Альберто"
ARG_un_respiro_para_alberto_desc: "Президент Альберто Фернандес измотан — по крайней мере, так твердо считают K-радикалы, преданная фракция Кристины Киршнер. С победой PJ на выборах Кристина тоже победила, значительно расширив свое влияние, укрепив свою позицию в роли вице-президента и одновременно снизив авторитет и личный вес президента Фернандеса. Многие наблюдатели утверждают, что происходящее напоминает переворот, но реальность иная: сам Фернандес устал от постоянных политических битв, бесконечных переговоров и давления, и он жаждет мира. Те, кто утверждает иначе, просто обманывают себя, ибо Кристина лучше всех знает, что действительно служит движению и стране.

Теперь Фернандес стоит на важном перепутье: оставаться у власти, хотя его силы угасают, или позволить Кристине взять на себя большую ответственность и попытаться объединить Аргентину под ее решимым руководством, так как значительная часть общества уже сменила свою симпатию с него. Временное отступление предоставит Фернандесу отдых и возможность в конечном итоге вернуться, в то время как Кристина сохранит политическую стабильность во время его отсутствия. В конце концов, он может положить на нее свою веру, ибо если бы она когда-либо хотела свергнуть его силой, она, без сомнения, сделала бы это давно."
ARG_las_purgas_de_cristina: "Чистки Кристины"
ARG_las_purgas_de_cristina_desc: "Кристина Киршнер глубоко недовольна результатом промежуточных выборов, и мы должны принять то, что она намеревается осуществить — масштабную чистку, которую президент Альберто Фернандес, ослабевший от потери реальной политической власти, не в состоянии остановить. Кристина будет систематически удалять всех, кого она считает неверными, начиная с министров, поддерживающих Фернандеса, в то время как сам президент останется как зритель, прикованный к своему креслу, молча наблюдая за бурей, которая теперь неизбежна.

Самое поразительное, Серхио Масса фактически примет роль главы государства, выполняя многие обязанности, которые когда-то принадлежали исключительно Фернандесу. Министры будут уходить один за другим, с Мартином Гузманом среди первых, и их места быстро будут заполнены доверенными союзниками Кристины или членами воинственных K-радикалов. Таким образом президент Фернандес, как бы парадоксально это ни звучало, перестает быть настоящим президентом; он становится вместо этого символической фигурой, в то время как реальная власть окончательно переходит в руки Кристины и ее круга. Аргентинская мечта рушится перед нашими глазами, и Фернандес может только оглядываться с сожалением на те самые выборы, которые когда-то подняли его к власти."
ARG_mision_cafiero_sola: "Миссия Сола-Кафиеро"
ARG_mision_cafiero_sola_desc: "Мир дрожит на грани разрушения, потрясенный падением Уолл-Стрит и параличом правительства США. Огонь нестабильности поднимается все выше с каждым днем, распространяясь по континентам и разжигая конфликты, которые давно были спрятаны. Южная Америка не может остаться невредимой этой глобальной бурей. Венесуэла, освободившаяся от любых сдерживающих факторов в связи с ослаблением Вашингтона, теперь смело действует по всему континенту. Бразилия теряется в неопределенности, не имея стабильности накануне выборов 2022 года, в то время как Аргентина оказывается почти полностью изолированной, оставаясь без надежных союзников в большом мире.

Перед лицом этого опасного момента президент Альберто Фернандес обращается к дипломатии как к единственному щиту. Он отправляет Фелипе Солу и Сантьяго Кафиеро с срочными миссиями по восстановлению положения Аргентины в Латинской Америке, стремясь создать новые связи доверия и сотрудничества. Благодаря этому усилию Аргентина надеется получить меру стабильности перед тем, как огромная волна кризисов поглотит континент. Страна попытается положить конец годам изоляции, приняв интернационалистскую внешнюю политику, которая обеспечит место Аргентины в меняющемся порядке. Огонь поднимается, и Аргентина решает не быть сожженной им, а овладеть его пламенем."
ARG_tragar_orgullo_ideologico: "Проглотить наш идеологический гордость"
ARG_tragar_orgullo_ideologico_desc: "Многополярность вместо единственной доминирующей оси, постоянное утверждение, что Лас-Мальвинасы по своей сути аргентинские, намеренное дистанцирование от уже ослабленного США и нестабильного Бразилии Больсонаро, наряду с поддержкой так называемой «прогрессивной» оси в Латинской Америке — эти были некоторые из ранних идеологических столпов внешней политики президента Альберто Фернандеса. Никто не мог предвидеть внезапный коллапс США и приход глобальной нестабильности, напоминающей как Вторую мировую войну, так и Холодную войну.

Президент Фернандес полностью понимает масштаб этих вызовов. Сжимая зубы, он теперь сталкивается с необходимостью отложить многие идеологические амбиции в пользу прагматизма в этот бурный период. Великобритания, оккупант Лас-Мальвинас, может стать столь же важным партнером, как и Бразилия, чьи внутренние борьбы оставляют ее хрупкой и непредсказуемой. Чтобы выжить в этом кризисе, Аргентине придется частично отказаться от своих многополярных устремлений, понимая, что в таком потрясенном мире изоляция — роскошь, которую нация не может позволить себе, и осторожные, практические альянсы необходимы для обеспечения положения страны и защиты ее будущего."
ARG_crisis_migratoria_brasil: "Кризис миграции из Бразилии"
ARG_crisis_migratoria_brasil_desc: "Это произошло: в Бразилии разразилась гражданская война. Избранный президент не смог достичь какого-либо значимого соглашения с протестующей оппозицией против нового режима, вызвав хаос, аналогичный тому, который ранее пережил США. Крупные города, такие как Бразилиа и Рио-де-Жанейро, затронуты, но наибольший ущерб понес Сан-Паулу, где десятки вождей войны сражаются на улицах, оставляя безжалостно мертвыми бесчисленных невинных граждан. Кризис сильно ударил по Бразилии, и его нужно разрешить.

Неудивительно, что массивная волна бразильцев покидает страну, при этом Аргентина и Уругвай становятся основными направлениями. Сотни тысяч уже пересекли границу, и бесчисленные другие ожидают возможности получить убежище в Аргентине. Хотя предоставление убежища морально правильно, Аргентина уже перегружена серьезными внутренними проблемами, и приток угрожает усугубить существующие вызовы. Президент Альберто Фернандес должен сейчас принять критические решения — кого поддерживать, как управлять кризисом и какие меры принимать — чтобы наконец разрешить миграционную проблему и сохранить порядок в нации."
ARG_tratado_alianza_lacalle: "Договор о союзе с Лакалье Пу"
ARG_tratado_alianza_lacalle_desc: "Аргентина и Уругвай оба восходят к старому Вице-королевству Рио-де-ла-Плата, и на протяжении всей своей долгой совместной истории они обычно были друзьями, даже если время от времени находились в конкуренции за влияние в Южном Конусе. Аргентина даже поддерживала разные фракции во время гражданской войны Уругвая, а позже, в XX веке, обе нации сотрудничали в рамках Операции Кондор во времена военных диктатур. Тем не менее, отношения снова испортились в XXI веке, когда Уругвай начал строить целлюлозные заводы на реке Уругвай, прямо у границы Аргентины. Спор, хотя и был урегулирован мирно международным арбитражем, оставил след недоверия, который никогда полностью не исчез.

Теперь президент Альберто Фернандес стремится преодолеть это прошлое, встретившись со своим уругвайским коллегой Луисом Лакалье Пу, чтобы подписать серию важных соглашений, направленных на укрепление двустороннего сотрудничества в эпоху глобальной нестабильности. С ослаблением МЕРКОСУРА и кризисами, сотрясающими Южную Америку, Аргентине нужен Уругвай как близкий и надежный партнер. Вместе они могли бы сбалансировать регион, противостоять влиянию чавистского Венесуэла и отразить любую форму нового империализма, открывая дверь к возобновленному видению единства и силы для Рио-де-ла-Плата."
ARG_ayudar_a_marito_par: "Помочь Марито с красной проблемой"
ARG_ayudar_a_marito_par_desc: "Ejército del Pueblo Paraguayo вместе с Partido Comunista Paraguayo остаются самыми известными леворадикальными организациями в Парагвае, группами, которые на протяжении лет провозглашали свое намерение свергнуть центральную власть и построить коммунистическое государство в центре Южной Америки. Хотя военносильно слабы, они поддерживаются клановым soutienом чавистского Венесуэла, чьи лидеры мечтают экспортировать свою боливарианскую революцию и дестабилизировать соседние страны. Само существование этих вооруженных группировок не только угрожает Парагваю самому, но и вызывает растущие опасения в Аргентине, ибо огонь экстремизма не знает границ.

Перед лицом этого вызова президент Альберто Фернандес решил действовать. Он отправится в Асунción и встретится со своим коллегой, президентом Марио Абдо Бенитесом, предложив аргентинское сотрудничество в кампании по разгрому партизанских группировок, скрывающихся в глубинах джунглей Парагвая. Предложение, обрамленное как солидарность и необходимость, вряд ли будет отклонено. Для Парагвая это означает многое нужную помощь, а для Аргентины — это гарантирует ценного союзника в неизбежной борьбе с влиянием чавистского Венесуэла. Согласно взглядам Фернандеса, только решающее совместное действие может окончательно положить конец красной угрозе и сохранить стабильность в регионе Рио-де-ла-Плата."
ARG_rec_compromiso_chl: "Восстановление обязательств с Чили"
ARG_rec_compromiso_chl_desc: "Обладая общими корнями в борьбе за независимость, Аргентина и Чили тем не менее часто находились разделенными спорами о неопределенных границах в Патагонии и Огненной Земле, что закончилось договором о границе 1881 года. Напряжения вспыхнули снова во время кризиса Бигл в 1970-х годах, когда претензии на острова в проливе Бигл почти привели к открытому конфликту. Чили даже фигурировал среди гипотетических целей аргентинского военного жунты, хотя флот в конечном итоге выступил за сдержанность. Тем не менее, история двигалась вперед, и к началу XXI века обе нации нашли новую почву для сотрудничества в рамках МЕРКОСУРА, ЮНАСУР и СЕЛАК, постепенно превращая соперничество в партнерство.

Теперь президент Альберто Фернандес намеревается строить на этой основе. Он стремится укрепить связи с западным соседом Аргентины, подтвердив теплые отношения, восстановленные в конце XX и начале XXI века. Для Фернандеса более тесное сотрудничество с Чили означает не только региональную стабильность, но и еще одну ценную карту против угрозы чавистского Венесуэла, нависшей с севера. Аргентина стремится занять свое место под солнцем и приглашает Чили разделить это светлое будущее как равные партнеры в формировании судьбы Южной Америки."
ARG_cortar_privilegios_bol: "Отрезать привилегии Боливии"
ARG_cortar_privilegios_bol_desc: "Проблема боливийских мигрантов в Аргентине стала серьезным вызовом и, мягко говоря, крайне неприятным делом для президента Альберто Фернандеса. На протяжении лет они получали гораздо больше от государственных программ, чем вносили, независимо от того, является ли их пребывание легальным или нет. Хотя такая ситуация могла быть терпимой в периоды экономического роста, текущий кризис, вызванный падением США и последующей глобальной нестабильностью, оставляет Аргентине не места для дальнейшей слабости. Стало ясно, что нужно принять решающие меры, чтобы эта популяция начала вносить свой вклад в государство, а не продолжать пользоваться его благами.

По этой причине президент Фернандес намеревается не только ограничить доступ боливийцев к социальным программам, но и прекратить бесплатное образование, здравоохранение и аналогичные привилегии. Вместо этого они будут обязаны либо платить за эти услуги, либо вносить нечто осязаемое в пользу государства в обмен. На практике это заставит их работать и приносить реальную ценность Аргентине, если они хотят остаться. Эра снисхождения достигла своего конца, ибо борющаяся экономика нации больше не может содержать тех, кто живет за счет ее ресурсов, не отдавая ничего взамен."
ARG_aumentar_seguridad_norte: "Усиление безопасности на северной границе"
ARG_aumentar_seguridad_norte_desc: "Проблема миграции из Бразилии, Парагвая и Боливии давно была серьезным и чувствительным вызовом для президента Альберто Фернандеса. Боливийцы бесстыдно пользуются щедрыми социальными программами Аргентины, внося значительно меньше, чем получают, в то время как парагваецкие граждане покупают огромные количества дешевых товаров через границу и перепродают их, вычерпывая национальный бюджет. Даже бразильская миграция, хотя и менее массовая, дополнительно нагрузит экономику и рынок труда. В более спокойные времена такие вещи терпелились, но с падением Уолл-Стрит, ослаблением США и началом глобального кризиса каждый песо теперь на счету, и неконтролируемая миграция больше не может игнорироваться.

Чтобы ответить на это, президент Фернандес намеревается укрепить северную границу, усилить безопасность и внедрить гораздо более жесткую иммиграционную политику. Пограничные патрули будут расширены, незаконные пересечения подавлены, а те, кто не имеет соответствующих документов, будут задержаны или депортированы. Только те, кто действительно вносит свой вклад в процветание Аргентины, будут разрешены оставаться, ибо страна больше не может позволить себе кормить паразитов, в то время как ее собственный народ страдает."
ARG_bolsonaro_perdoname: "Больсонаро, прости меня"
ARG_bolsonaro_perdoname_desc: "Хайр Больсонаро в настоящее время является президентом Бразилии и, возможно, сохранит власть после предстоящих выборов. Несмотря на то, что президент Альберто Фернандес открыто назвал Больсонаро «экстремистом крайнего правого», Бразилия остается ключевым союзником в Южной Америке, и ее ресурсы имеют решающее значение для Аргентины. Однако такие заявления постепенно охладили дипломатические отношения между двумя странами — ситуация, которая может оказаться крайне пагубной для Фернандеса в свете нависшей угрозы чавистского Венесуэла в регионе, обостренной падением США и его ослабленным надзором за Южной Америкой.

В ответ на это президент Фернандес намеревается встретиться с Больсонаро, чтобы выразить официальное извинение и договориться о двустороннем торговом соглашении, выгодном как для Аргентины, так и для Бразилии. Признав ошибку своих предыдущих заявлений, Фернандес стремится восстановить теплоту и доверие в отношениях, обеспечивая, чтобы обе нации могли эффективно сотрудничать. Укрепление связей с Бразилией — это не только дипломатическая необходимость, но и стратегический ход для противодействия угрозе чавистского Венесуэла, обеспечивая положение Аргентины в региональной политике и укрепляя стабильность на всем континенте."
ARG_reforzar_mercosur: "Усиление МЕРКОСУРА"
ARG_reforzar_mercosur_desc: "МЕРКОСУР был создан 26 марта 1991 года как региональный блок, объединяющий Аргентину, Бразилию, Парагвай и Уругвай, с Чили, Колумбией, Боливией и другими в качестве ассоциированных членов. Первоначально сфокусированный на торговле, он быстро превратился в политическую платформу для сотрудничества и баланса силы в Южной Америке. Сегодня, после падения США и изоляции многих экономик, МЕРКОСУР стал одним из немногих оставшихся инструментов, способных сохранить стабильность и предоставить Аргентине реальную возможность для лидерства.

Президент Альберто Фернандес считает, что будущее кроется в укреплении и расширении МЕРКОСУРА за пределы Южной Америки. Идея — строить отношения с новыми партнерами, такими как Новая Зеландия и Мексика, а также расширять сотрудничество в направлении Ближнего Востока, Африки и Европы. Со временем блок может стать экономическим щитом, подобным Европейскому Союзу, защищая континент от финансовых кризисов. Даже если Чили сохранит свой изоляционный строй или Венесуэла приостановит членство, Аргентина все равно будет двигаться вперед. Руководя этой трансформацией, Аргентина не только спасет свою экономику, но и выступит как герой южноамериканской интеграции."
ARG_tratados_comercial_par_urg: "Торговые соглашения с Уругваем и Парагваем"
ARG_tratados_comercial_par_urg_desc: "Отношения между Уругваем, Парагваем и Аргентиной всегда отличались напряжением и соперничеством. Во время кровопролитной Парагвайской войны XIX века Аргентина вместе с Уругваем и Бразилией воевала против Парагвая, оставив страну разрушенной и потерявшей более половины мужского населения. В XX веке все три государства сотрудничали в рамках «Операции Кондор», но в XXI веке разногласия вернулись. Аргентина столкнулась с Уругваем по поводу строительства целлюлозных заводов на реке Уругвай, а с Парагваем напряжения выросли из-за прав на навигацию по реке Парана и долгих споров вокруг гидроэлектростанции Ясиретá. Тем не менее, несмотря на то, что они являются членами МЕРКОСУРА, настоящее сотрудничество оставалось хрупким.

Теперь, после падения США и краха Уолл-Стрит, президент Альберто Фернандес считает, что важно отложить исторические обиды и сосредоточиться на выживании и развитии. Он продвигает создание «Большой торговой зоны», которая будет запущена в Рио-де-Жанейро, направленная на обеспечение двусторонних и многосторонних соглашений, которые будут стимулировать интеграцию. Такая платформа не только укрепит политическое сотрудничество, но и улучшит экономику Аргентины, давая Буэнос-Айресу новое влияние на рынках Парагвая и Уругвая, и делая регион сильнее в лице глобальной нестабильности."
ARG_cuestion_chilena: "Чилийский вопрос"
ARG_cuestion_chilena_desc: "Чили давно выступает поразительным примером изолянизма в Южной Америке. С момента своей независимости страна в первую очередь сосредотачивалась на экспорте товаров — особенно в Великобританию — при этом намеренно избегая участия в региональных войнах или великих глобальных конфликтах XX века. Этот осторожный дистанцизм был нарушен в 1970-х годах избранием Салвадора Алленде, который открыто соединился с Москвой, а еще больше — после военного переворота 1973 года, когда генерал Аугусто Пиночет твердо связал свою диктатуру с Вашингтоном до конца своего правления в 1990 году. С восстановлением демократии Чили постепенно вернулся к своей традиционной позиции политического и дипломатического резерва.

Именно по этой причине президент Альберто Фернандес стремится посетить Сантьяго, стремясь пробить стены чилийского изолянизма и перенаправить его в пользу Аргентины. Его план — предложить более тесное военное сотрудничество вместе с двусторонним торговым соглашением, заложив основу для долгосрочного партнерства. Фернандес знает, что задача не будет простой: изоляционистские рефлексы Чили выкованы более чем на столетие. Однако он также понимает, что это положение менее прочно, чем кажется. Одна настоящая внешняя угроза будет достаточно, чтобы толкнуть Чили к Аргентине, а не от нее."
ARG_el_ultimo_tango_en_buenos_aires: "Последнее танго в Буэнос-Айресе"
ARG_el_ultimo_tango_en_buenos_aires_desc: "Танго — это не просто танец, а душевное выражение Аргентины. Родившись в пригородах Буэнос-Айреса в конце XIX века, танго стало глобальным феноменом, проникнув в танцзалы Парижа, Нью-Йорка и Берлина. Но его истинная суть все еще связана с Аргентиной — с ее страстными мелодиями, выразительными движениями и глубоким культурным наследием. Культурное наследие нации, включая танго, футбол и литературу, всегда было источником гордости для аргентинцев. Теперь, в эпоху экономического кризиса, когда будущее выглядит неопределенным, президент Альберто Фернандес стремится восстановить национальное самосознание, восстановив и продвигая эти культурные иконы.

Культурная политика Фернандеса будет направлена на то, чтобы танго и другие культурные наследия Аргентины снова стали центром внимания. Государственные субсидии для танцорских школ, фестивали и международные гастроли помогут продвигать аргентинское искусство по всему миру. Более того, восстановление исторических танцзалов в Буэнос-Айресе — таких как «Пальеро» и «Милонга де ла Копла» — не только сохранит культурное наследие, но и создаст новые рабочие места. В глазах Фернандеса танго — это не просто искусство; это символ аргентинского духа, который никогда не сломится, даже в самых трудных временах."
ARG_una_argentina_para_todos: "Аргентина для всех"
ARG_una_argentina_para_todos_desc: "Революция 2018 года, начавшаяся с протеста против субсидии на газ, стала поворотным моментом в истории Аргентины. Миллионы людей вышли на улицы Буэнос-Айреса и других городов, требуя конца коррупции, экономических реформ и социальной справедливости. Протесты стали символом недовольства населения и призывом к переменам. Сегодня, в эпоху кризиса, вызванного падением США и глобальной нестабильностью, президент Альберто Фернандес стремится отреагировать на эти призывы, предлагая свою концепцию «Аргентины для всех».

Эта политика будет включать расширение социальных программ, улучшение доступа к здравоохранению и образованию, а также создание рабочих мест. Фернандес также обещал борьбу с коррупцией и восстановление доверия в государственные институты. В его глазах Аргентина — это страна с огромным потенциалом, и если каждый будет иметь равные возможности, нация сможет преодолеть любые трудности. «Аргентина для всех» — это не просто лозунг; это призыв к единству и солидарности в трудные времена."
ARG_argentina_primero: "Аргентина в первую очередь"
ARG_argentina_primero_desc: "Важнейшая цель президента Альберто Фернандеса — восстановить международное положение Аргентины и укрепить ее экономику. После падения США и начала глобального кризиса Аргентина оказалась в сложной ситуации, но Фернандес верит, что нация может выйти из этого кризиса сильнее. Его стратегия «Аргентина в первую очередь» направлена на то, чтобы сделать Аргентину независимой, самодостаточной и процветающей.

Ключевые элементы этой стратегии включают укрепление сельского хозяйства, развитие промышленности, расширение экспорта и создание новых рабочих мест. Фернандес также стремится улучшить отношения с соседними странами и международными партнерами, чтобы Аргентина могла занять свое место в новом глобальном порядке. В его глазах Аргентина — это страна с богатым наследием и большим потенциалом, и если сосредоточиться на национальных интересах, нация сможет достичь великих высот."
ARG_incrementar_exportaciones: "Увеличить экспорт"
ARG_incrementar_exportaciones_desc: "Хотя здравый смысл подсказывает направить избыточные средства в национальные резервы, чтобы укрепить песо и избежать повторения катастрофического экономического краха 2021 года, Матиас Кульфас видит совершенно другой, гораздо более радикальный и рискованный путь, который, по его мнению, может принести Аргентине примечательные результаты. Во время напряженного и бурного спора в правительственных кругах Кульфас и его группа решимых сторонников сумели навязать свою точку зрения, оставив президенту Альберту Фернандесу мало выбора, кроме как утвердить этот смелый план, надеясь, что удача и разум совпадут, и молясь, чтобы история не повторилась в виде еще одного разрушительного банковского краха.

Сущность этого плана проста, но амбициозна: вместо того чтобы блокировать капитал в резервах, правительство направит избыточные средства напрямую в сельскохозяйственные и промышленные экспортеры, рискуя, что всплеск экспорта логически привлечет приток иностранной валюты. Этот приток не только стабилизирует, но и повысит стоимость песо, одновременно генерируя устойчивый экономический рост, способный поддерживать долгосрочное расширение производительных секторов Аргентины. Кульфас уверен, что укрепленный экспорт гарантирует надежный спрос за границей, обеспечив Аргентине прочное положение на международных рынках на годы вперед."
ARG_aumentar_las_reservas: "Увеличить национальные резервы"
ARG_aumentar_las_reservas_desc: "Экономический кризис 2021 года вспыхнул, когда Аргентине не хватило необходимых средств для покрытия своих обязательств в тот самый момент, когда граждане массово бросились снимать свои депозиты с банков и ликвидировать свои активы на национальных рынках. Эта цепная реакция вынудила правительство изымать деньги из самой банковской системы, что привело к внезапному обрушению доверия и вспышке знаменитого кризиса. Память о этих событиях остается одной из самых болезненных, но и самых ценных уроков для Аргентины: она продемонстрировала не только то, что может пойти не так, когда резервы истощены, но и какие механизмы можно принять, чтобы гарантировать, что такая катастрофа не повторится.

Из этого болезненного опыта возникает убеждение Матиаса Кульфаса, который хочет убедить президента Альберто Фернандеса направить каждый избыток правительственных ресурсов на укрепление национальных резервов, одновременно покрывая основные государственные расходы через спланированную систему, а не изматывая банки. Таким образом, Аргентина сможет защитить себя даже от самых слабых эхо кризиса 2021 года и поддерживать стабильность в времена давления. Граждане, в свою очередь, оценят Кульфаса за его проницательность, готовность действовать превентивно и решимость доказать, что правительство извлекло урок из истории. Время, как всегда, будет окончательным судьей, но в этом случае оно может подтвердить, что такая осторожность была именно тем, что Аргентине нужно было."
ARG_una_tormenta_politica_inestable: "Нестабильная политическая буря"
ARG_una_tormenta_politica_inestable_desc: "Президент Альберто Фернандес понес сокрушительный удар от оппозиции после решения лично возглавить кампанию PJ и FdT. JxC закрепили свои места, и впервые за сорок лет PJ потеряла большинство в парламенте. Это поражение не только ослабило Фернандеса, но и оставило неизгладимое пятно на его наследии — то, что история не забудет. Однако наибольшая опасность не в этом пятне. Что-то гораздо хуже приближается. Буря идет — огромная, неумолкаемая буря — и не оппозиция ее несет.

Эта политическая буря поднимается изнутри: от Криштины Киршнер и ее преданных последователей, которые подчиняются ее каждому слову. Они теперь готовы уничтожить президента Фернандеса и его ближайших союзников, прибегая даже к угрозам смерти и запугиванию, чтобы обеспечить господство Криштины. И на этот раз Альберто ничего не может сделать. Он стоит бессильно, наблюдая, как его видение рушится у нее на руках. Альберто Фернандес больше не президент. Теперь он только Старый Альберто."
ARG_un_frente_roto: "Разбитый фронт"
ARG_un_frente_roto_desc: "Frente de Todos — это название обещало единство, огромный зонт для каждой ветви перонизма: федералисты, прагматичные menemиты, радикальные киршнеры, даже те, кто склонялся к марксизму. В течение некоторого времени этот эксперимент консенсуса казался успешным. Коалиция гордилась диалогом, заявляя, что уважает каждый голос, независимо от того, насколько он дискордантен. Но амбиция сломала баланс. Капитан Бето — президент Альберто Фернандес — стремился возглавить законодательную кампанию 2021 года, не как фигураhead, а как стратег в командовании.

Кампания рухнула, и вместе с ней хрупкое единство, которое держало FdT вместе. Сегодня Frente de Todos стоит расчлененным. Серхио Масса собирает своих технократов; Фернандес цепляется к угасающим лоялистам; и выше обоих, Криштина Киршнер укрепляет свою хватку. Каждая фракция борется за выживание, но Альберто и Серхио разделяют один страх: неуклонная амбиция Криштины. Если не остановить ее, она поглотит коалицию, оставив за собой лишь руины там, где однажды стояло обещание общего фронта."
ARG_reunion_de_emergencia_con_cafiero: "Экстренная встреча с Кафиеро"
ARG_reunion_de_emergencia_con_cafiero_desc: "Frente de Todos глубоко раскололся. Киршнеры по принципу отказываются поддерживать любое предложение, выдвигаемое союзниками президента Альберто Фернандеса, а иногда даже те, кто поддерживает Серхио Массу. Они стали центральным препятствием, ибо их непреклонность парализовала законодательную деятельность, останавливая экономические реформы, поддерживаемые министром экономики Мартином Гусманом. В результате денежный кризис продолжается, напрямую бив по уже снизившемуся кредиту уставшего старого Фернандеса.

Чтобы спасти ситуацию и как-то продвинуть программу Гусмана через палату, ставшую фактически враждебной, Фернандес теперь стремится провести совещание с министром иностранных дел, международной торговли и культа Сантьяго Кафиеро. Вместе они надеются разработать жизнеспособную стратегию, чтобы провести реформы мимо как укреплённой киршнерской фракции, так и энтузиастской правой оппозиции. Только так, по их мнению, Аргентина сможет найти стабильный путь вперед и начать избавляться от душераздирающей хватки продолжающегося экономического смутения."
ARG_buscar_votos_en_la_oposicion: "Искать голоса в оппозиции"
ARG_buscar_votos_en_la_oposicion_desc: "Министр иностранных дел Сантьяго Кафиеро вместе с президентом Альберто Фернандесом — если это звание еще имеет вес — разработал план для продвижения экономической программы министра экономики Мартина Гусмана через парламент, усеянный препятствиями, воздвигнутыми как оппозицией, так и диссидентами внутри правящей коалиции. Их общая цель — выжить в враждебном парламенте, где многие предпочли бы увидеть Фернандеса униженным, его репутацию сведенной к руинам, и его президентский срок прерванным. Тем не менее, несмотря на эти надежды, такой исход далек от гарантированного.

Ключевая часть стратегии заключается в извлечении как можно большего числа голосов из Cambiemos, используя каждую возможную уступку для обеспечения поддержки реформ Гусмана. Фернандес готов торговаться с кем угодно, кто готов внести хотя бы один решающий голос, независимо от политической цены. Неизбежно критики обвинят его в предательстве перонизма, но в момент, когда его собственная партия отвернулась, и Аргентина сама тонет все глубже в кризисе, альтернатив Qualitatively нет."
ARG_la_ofensiva_de_cristina: "Оффензива Криштины"
ARG_la_ofensiva_de_cristina_desc: "Старый Альберто Фернандес сидит с отчетом в руках — отчетом, который он никогда не хотел читать. Последние недели были чистой мукой для президента, который больше не чувствует себя президентом. Потеря популярности — это самое малое из его забот сейчас; нависшим над всем являются угрозы Криштины Киршнер и ее марксистских лоялистов. Альберто знает, что он в тупике, но этот документ еще больше его разрушает: по словам его автора, это неоспоримое доказательство запланированного переворота.

И самое худшее — это правда. Впервые Фернандес видит всю масштабность заговора Криштины и ее решимости вытолкнуть его из власти. Однажды, возможно, он мог бы отразить удар. Теперь он бессилен, заперт в игре, где каждый ход в ее пользу. Но Альберто имеет последнюю идею: выдвинуть Сильвину Батаки, страстную киршнерку, в центр внимания, надеясь, что этот жест принесет ему время — достаточно, чтобы отложить переворот, достаточно, чтобы спасти то, что осталось. Для старого человека это больше не о победе; это о выживании."
ARG_promesas_politicas_baratas: "Дешевые политические обещания"
ARG_promesas_politicas_baratas_desc: "Министр иностранных дел Сантьяго Кафиеро вместе с президентом Альберто Фернандесом — если это звание еще имеет вес — разработал план для продвижения экономической программы министра экономики Мартина Гусмана через парламент, усеянный препятствиями, воздвигнутыми как оппозицией, так и диссидентами внутри правящей коалиции. Их общая цель — выжить в враждебном парламенте, где многие предпочли бы увидеть Фернандеса униженным, его репутацию сведенной к руинам, и его президентский срок прерванным. Тем не менее, несмотря на эти надежды, такой исход далек от гарантированного.

План основывается на укреплении управления за счет получения обязательств от политиков всех направлений, хотя такие обещания могут оказаться пустыми, учитывая измученное положение президента. От членов Cambiemos до фигур внутри Partido Justicialista и Frente de Todos ожидаются обещания в имени стабильности Аргентины. Если они будут выполнены, они могут обеспечить хрупкий щит спокойствия, позволяющий остатку первого срока старого Альберто пройти с меньшим количеством бурь и semblance порядка до выборов 2023 года."
ARG_un_alberto_solitario: "Одинокий Альберто?"
ARG_un_alberto_solitario_desc: "Было время, когда президент Альберто Фернандес председательствовал над единственным правительством, коалицией, где его лоялисты сосуществовали с лагерем Криштины Киршнер. В те дни царил гармония, обещания выполнялись, а идеи превращались в политику. Конгресс следовал его лидерству, оппозиция не имела контроля, и голос Альберто определял курс нации. Тогда он был не просто президент по названию — он был истинным архитектором направления Аргентины.

Но те дни ушли. Теперь наступает эпоха упадка, горькая зима для человека, когда-то называемого Капитаном Бето. Правительство расчленено, отравлено угрозами Криштины и безжалостными чистками, которые лишили Фернандеса его ближайших союзников. Его министры ушли, его влияние угасает, и шепоты насмехаются над ним как «старым человеком». Тем не менее Альберто отказывается полностью сдаться. Чтобы блокировать восхождение Криштины, он рассматривает немыслимое — союз с Серхио Масса, передавая ему реальную власть в обмен на последнюю возможность остановить женщину, которая стремится управлять всем."
ARG_el_final_de_super_alberto: "Конец Супер-Альберто"
ARG_el_final_de_super_alberto_desc: "Это конец для президента Альберто Фернандеса — или, скорее, для измученного старого Альберто Фернандеса — который теперь безвозвратно потерял свое когда-то славное президентское суперспособство. На протяжении лет инициативы, которые казались обреченными в Конгрессе, чудесным образом увенчивались успехом при простом движении руки Фернандеса, но эта магия исчезла. Сегодня он остается президентом по названию, но на самом деле стал не более чем фигураhead, ибо суть власти ускользнула из его рук и теперь разбросана по лабиринтовым коридорам Frente de Todos.

Что еще хуже, дискредитированные парламентарии — те, кто покорно кланяется воли Криштины Фернандес де Киршнер, и даже oportunisticheская оппозиция, жаждущая продать достоинство нации — отказываются позволить Фернандесу какую-либо фрагмент власти. Действительно, они действуют против него с рвением, равным киршнерским радикалам. Таким образом заканчивается странная сага «Супер-Альберто». Больше не лидер, обладающий исключительным влиянием, он превратился в марионетку, качающуюся на нитях, неустанно тянутых киршнерской машиной."
ARG_caida_de_leales: "Падение лоялистов"
ARG_caida_de_leales_desc: "Это конец. Министр экономики Мартин Гусман вместе с несколькими коллегами, ценными как в политике, так и в экономике, подал в отставку. Несмотря на все, что предпринял президент Альберто Фернандес — несмотря на кратковременное спокойствие в политической жизни Аргентины, несмотря на кропотливые переговоры Гусмана с МВФ и даже несмотря на несколько успехов старого человека после поражения в парламентских выборах 2021 года — они все равно решили уйти, поддавшись душераздирающему влиянию Криштины Фернандес де Киршнер.

Трагично, но их уход только укрепляет ее хватку. Единственный лоялист, оставшийся Фернандесу в кабинете, — министр иностранных дел Сантьяго Кафиеро, а вакантные посты уже заполнены киршнерскими фигурами. Наиболее поразительно — повышение Сильвины Батаки, предположительно наименее подходящего кандидата на ключевую должность министра экономики, но того, кого Фернандес неохотно назначил. Теперь ряды лоялистов разбиты, киршнеры поднимаются с новыми силами, а сам президент остается лидером только по названию, лишенным реальной власти."
ARG_etapa_batakis: "Этап Батаки"
ARG_etapa_batakis_desc: "Сильвина Батаки, непреклонная киршнерка и радикальный экстремист, теперь заняла должность министра экономики. В трагической иронии она воплощает совершенно противоположный подход к прагматичному и рациональному подходу, когда-то предложенному ее предшественником Мартином Гусманом. В то время как Гусман стремился к балансу и кредibilidade, Батаки, по-видимому, намерена навязать жесткую марксистско-киршнерскую рамку. Если бы это было лишь вопросом риторики, ее назначение могло бы быть менее тревожным, но как обстоит дело, она уже раскрыла себя как глубоко неподходящий страж экономики Аргентины.

Ее обещания поражают своей безрассудностью, отражая самые крайние идеологические течения. Она угрожает сломать хрупкие основы, заложенные при Гусмане, увлекая страну еще глубже в денежный пропасть, из которого она только частично вышла. Тем не менее гегемония Криштины Фернандес де Киршнер вынуждает правительство уступать, оставляя Батаки свободной преследовать свой разрушительный курс. Президент Альберто Фернандес, лишенный возможности влиять, наблюдает беспомощно, как Аргентина увлекается все глубже в кризис."
ARG_otra_devaluacion: "Еще одна девальвация?"
ARG_otra_devaluacion_desc: "Сильвина Батаки не теряла времени в свои первые дни на посту министра экономики, предпринимая смелые шаги для утверждения своего видения. Среди ее первых обещаний был план девальвации аргентинского песо во имя того, чтобы сделать его «конкурентоспособным». Это объявление было встречено ликованием марксистско-киршнерских лоялистов и других радикалов, поддерживающих Криштину Фернандес де Киршнер. На первый взгляд этот шаг может показаться выгодным, предлагая краткосрочное лекарство от болезней нации.

Однако реальность гораздо страшнее. Такая безрассудная стратегия угрожает сломать хрупкие успехи, достигнутые при Мартине Гусмане и его союзниках, включая Матиаса Кульфаса, в стабилизации инфляции и укреплении импортов. Идеологический энтузиазм, питающий Батаки, рискует увлечь Аргентину еще глубже в кризис, уничтожив годы кропотливой работы. Еще одна разрушительная девальвация теперь выглядит неизбежной, а президент Альберто Фернандес не имеет силы, чтобы ее заблокировать. Смирившись с бессилием, он должен принять новую и дестабилизирующую экономическую систему, навязанную силами, выходящими за его контроль."
ARG_buscar_credito_extranjero: "Искать кредиты за границей"
ARG_buscar_credito_extranjero_desc: "В рамках своих первых дней в должности министр экономики Сильвина Батаки обещала искать кредиты у стран по всему миру. Она намеревается обратиться ко всем доступным странам, принимая любые предложенные условия, независимо от бремени процентов, просто чтобы обеспечить свежие средства. Поддерживаемая энтузиазмом марксистских киршнеров и самой Криштиной Фернандес де Киршнер, Батаки представляет этот курс как спасение. Однако его последствия обнаруживают опасности такого радикального мышления.

Аргентина вскоре окажется должницей более стран и в больших суммах, чем в любое время своей истории, поставив нацию в унизительное положение перед международным сообществом. Даже враждебные режимы, такие как Венесуэла, могут получить рычаг влияния, превращая Аргентину не в уважаемую державу, а в объект насмешки, стремящийся под весом бесконечных обязательств. Тем не менее президент Альберто Фернандес, лишенный эффективного влияния, не имеет средств для сопротивления. Он вынужден терпеть, как Батаки увлекает нацию все глубже в зависимость."
ARG_el_super_ministro_sergio_massa: "Супер-министр Серхио Масса"
ARG_el_super_ministro_sergio_massa_desc: "Хаос, наконец, перехватил Сильвину Батаки в прямом результате ее безрассудных политик. Благодаря тщательному маневрированию нам удалось «предложить» ей уйти в отставку так, чтобы это выглядело добровольным, обеспечив, чтобы Криштина Фернандес де Киршнер не смогла обвинить нас. План сработал, и Криштина остается неведомой о том, что уход Батаки был спланирован за кулисами. Тем не менее смуты, которые она вызвала, продолжают преследовать правительство и нацию, требуя срочных мер.

В этот вакуум вступает Серхио Масса — не только как министр экономики, но и как недавно созданный «супер-министр», консолидирующий под своим командованием несколько портфелей и секретариатов. Наделенный широкими полномочиями, Масса собирается стать фактическим лидером Аргентины, обладая влиянием, превышающим даже президент Альберто Фернандес. Несмотря на все его недостатки, все же лучше, чтобы Масса управлял, чем оставить судьбу нации в руках лоялистов Криштины. В этом балансе власти Аргентина получает по крайней мере хрупкую возможность стабильности."