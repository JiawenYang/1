POLITICS_ALBERTO_FERNANDEZ_DESC: "Альберто Ангел Фернандес родился в Буэнос-Айресе 2 апреля 1959 года, отец — судья Карлос Галинде. После школы он поступил в юридический факультет Университета Буэнос-Айреса, окончил его как адвокат, а позже стал профессором уголовного права. Его первой политической ролью была должность советника Буэнос-Айресского совета, затем советника Национальной палаты депутатов и заместителя директора юридического департамента Министерства экономики под руководством Рауля Альфонсина. В 1990-х годах он стал суперintendentом Национального надзора за страхованием Аргентины, возглавил Ассоциацию страховых надзорщиков Латинской Америки и помог основать Международную ассоциацию страховых надзорщиков.\n\nОн впервые получил международное признание, представляя Аргентину на Уругвайском раунде GATT, а позже в МЕРКОСУРЕ и АЛАДИ. К 1992 году его назвали одним из выдающихся молодых лидеров Аргентины. С 1997 по 2000 год он работал в финансовой и страховой сфере, прежде чем вернуться в политику, избираясь в Буэнос-Айресский законодательный орган из списка Доминго Кавальо. В 1990-х годах он уже познакомился с Нестором Киршнером, с которым создал «Grupo Calafate». Его главный рывок пришелся на 2003 год, когда он стал начальником Кабинета министров под Нестором Киршнером, оставался на этой должности до 2007 года и кратковременно под Кристиной Киршнер до отставки в 2008 году после разногласий. После ухода из правительства он критиковал руководство Кристиной и в 2015 году консультировал кампанию Серхио Массы.\n\nПереломный момент пришел 18 мая 2019 года, когда Кристина Киршнер объявила Альберто президентским кандидатом «Frente de Todos», а себя — вице-президентом. Выиграв первичные выборы в августе и общие выборы в октябре с 48% голосов, он избежал второго тура и стал президентом 10 декабря 2019 года. Теперь Альберто Фернандес столкнулся с самым сложным испытанием своей жизни, балансируя между своими собственными преданными и мощной киршнеристской фракцией. Он стоял на хрупком обрыве, вынужденный посредничать между конкурирующими интересами. Его стремительный подъем был быстрым, но без прочной поддержки, особенно со стороны киршнеристов, его падение может быть не менее быстрым и безжалостным."
