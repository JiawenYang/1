#Ideologies Milei
ARG_classical_liberalism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_classical_liberalism \n\n\n\n\n\n §YМилейский либерализм§! — это политическая идеология, которую поддерживает Хавьер Милей и его сторонники, основанная на защите личных свобод, частной собственности и экономической свободы, с особым акцентом на сокращение размеров и функций государства. В первую очередь он вдохновлен идеями австрийской школы экономики, особенно такими авторами, как Людвиг фон Мизес и Фридрих Хайек, а также идеями из классической либеральной и либертарной традиций.\n\nМилейизм утверждает, что государственное вмешательство и чрезмерные государственные расходы являются одними из главных причин экономического упадка Аргентины. По этой причине он выступает за свободно-рыночную экономику, снижение налогов, дерагуляцию и строгие ограничения власти государства над экономической деятельностью. Также он включает идеи, связанные с защитой прав человека, частной собственности и свободы как фундаментальных принципов общества."

ARG_right_populism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_populist_mileism \n\n\n\n\n\n §YПопулистский милейизм§! — это идеология, продвигаемая движениями, поддерживающими Хавьера Милея и его правительство. Она сочетает сильный правый популизм с элементами правого антиглобализма, национального консерватизма и экономического либерализма. В некоторых отношениях она напоминает menemизм 1990-х годов: харизматический лидер, кардинальные экономические реформы и обещание слома с существующим политическим порядком.\n\nОднако милейизм гораздо более конфликтующий. Милей изображает традиционную политическую элиту, левую и большую часть государства как часть системы, ответственной за упадок Аргентины. С помощью этой риторики он стремится превратить социальное недовольство в постоянную политическую силу, противопоставляя предполагаемую привилегированную «касту» населению, которое страдало от десятилетий плохих политик.\n\nЦель не только выиграть выборы, но и переделать политический ландшафт Аргентины. Мобилизуя народную поддержку и создавая интеллектуальную базу вокруг La Libertad Avanza, милейизм стремится превратить поддержку Милея в постоянную политическую идентичность, сосредоточенную на лояльности к лидеру, оппозиции «касте» и обещании экономической и культурной революции."

ARG_right_libertarianism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_libertarian_mileism \n\n\n\n\n\n §YЛибертарный милейизм§! — это идеология, продвигаемая движениями, поддерживающими Хавьера Милея и его правительство. Он выступает за свободный рынок, частную собственность, права человека и сокращение размеров и функций государства. Его сторонники, как правило, выступают за радикальное сокращение социального государства и большую защиту так называемых отрицательных прав, основанных на личной свободе и не вмешательстве государства.\n\nЭта философия черпает вдохновение из laisser-faire-экономики и принципов, таких как самообладание и трудовая теория собственности, которые утверждают, что люди имеют права на свои собственные тела, свой труд и плоды, получаемые от него. С этой точки зрения государственное вмешательство должно быть сведено к абсолютному минимуму.\n\nВ политической сфере Милей утверждает, что Аргентина должна защищаться от того, что он считает злами левых. По этой причине милейизм будет стремиться постепенно снизить его влияние в аргентинской политике через органическое изменение общественного мнения, укрепляя социальную поддержку политического права и консолидируя La Libertad Avanza как ведущую силу за этим движением."

ARG_civic_nationalism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_pragmatic_mileism \n\n\n\n\n\n §YПрагматичный милейизм§! — это философия правления, которая сочетает милейские принципы с современными стратегиями, которые не обязательно следуют строгой идеологической доктрине. Вместо того чтобы применять милейские идеи жестко, он полагается на экспертов и реформаторов, готовых адаптировать государственную политику к специфическим обстоятельствам страны.\n\nВ отличие от более доктринарных течений, прагматичные милейцы, как правило, приоритетизируют практические компромиссы с социал-демократическими секторами, умеренными группами и даже движениями, поддерживающими определенные элементы социальной справедливости. Эта гибкость может привести к частичному отказу от экономического либертаризма или сохранению только некоторых его фундаментальных принципов.\n\nВ некоторых случаях эти идеи также могут стать инструментом политического популизма. Адаптируя милейские принципы к конкретным потребностям населения, прагматизм позволяет представить защиту экономической свободы и меньшего государства не просто как идеологический вопрос, а как прямую реакцию на повседневные проблемы людей."

