ARG_exec_powers_desc_loc_key: "Милей — лидер, способный добиваться примечательных результатов при очень ограниченных ресурсах...\nЧто произойдет, если мы дадим ему столько власти, что он сможет преобразовать страну согласно своей личнойvision?\nЕсли мы наделим исполнительную власть в его крестовой походе против политической «касты», мы сможем попытаться стереть наследие коррупции за один срок президентства. Все, что нужно — это «убедить» Конгресс проголосовать за предоставление больших полномочий Милею, используя контекст, что «северная угроза».\nКак в «фантастической угрозе», знаете?"
