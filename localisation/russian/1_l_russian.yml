 COG_africas_world_war_name: "Мировая война в Африке"
 COG_africas_world_war_name_desc: "\n\n\n\n\n£GFX_COG_africas_world_war_embed \n\n\n\n\n\n\nТо, что началось в 1998 году как восстание в Конго, переросло в полномасштабную войну на континенте, унесшую миллионы жизней. В войне участвовали страны, как напрямую, так и посредством политического вмешательства, создавая сети альянсов, что даже получило название\n\n«§gAfrica's World War§!»"
 USA_low_immigration_idea: "Отсутствие Нелегальной Иммиграции"
 USA_medium_immigration_idea: "Низкий Уровень Нелегальной Иммиграции"
 USA_high_immigration_idea: "Массовая Нелегальная Иммиграция"
 USA_world_police_idea: "Мировая Полиция"
 USA_world_police_idea_desc: "Если вы спросите у нескольких разных людей их мнение об американском военном участии на Ближнем Востоке, вы, скорее всего, получите несколько разных, сильных мнений. Многие американцы считают, что правительство США должно сосредоточиться на внутренних делах и что происходящее на Ближнем Востоке "не наше дело". Другие считают, что в современную эпоху Америка должна иметь глобальное присутствие, чтобы защитить свои интересы. Разногласия по поводу американского вмешательства во внешние дела не являются чем-то новым; они существуют практически с момента основания самих Соединенных Штатов."
 PRC_complacent_officers_spirit: "Самодовольные Офицеры"
 PRC_complacent_officers_spirit2: "Самодовольные Офицеры"
 chinese_territory_category: "Затерянные территории Китая"
 chinese_territory_category_desc: "\n\n\n\n\n\n\n£PLA_Marine\n\n\n\n\n\n\n\n\n\nПо мере того как влияние Китая в мире, особенно в Восточной Азии, растет, проблемы, оставшиеся от истории, навязанные империализмом в прошлом, наконец-то могут увидеть надежду на решение сегодня."
 land_boundary_pro_chinese: "Согласовать сухопутную границу с Индией на основании притязаний Китая"
 land_boundary_pro_chinese_desc: "Теперь, когда мы снизили напряженность в отношениях с индейцами, и они, наконец, подружились с нами, можно будет договориться о делимитации сухопутной границы между двумя странами на основе наших требований."
 land_boundary_neutral: "Согласовать сухопутную границу с Индией"
 land_boundary_neutral_desc: "Теперь, когда мы уменьшили напряженность в отношениях с индейцами, можно будет договориться о делимитации сухопутной границы между двумя странами."
 demand_japan_commit_war_crime: "Требовать от Японии совершить военное преступление"
 demand_japan_commit_war_crime_desc: "Сейчас в Японии восторжествовали идеи пацифизма и социализма, и наша страна смогла постепенно утвердиться в качестве центра азиатской политики. Значит, пора полностью признать вину японского милитаризма. Мы выполним незавершенные задачи под контролем штаба и военных США, и пусть военные преступники и палачи прошлого искупают свои военные преступления!"
