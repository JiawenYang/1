 PAK_fervent_nationalism: "Пылкий Национализм"
 PAK_fervent_nationalism_desc: "\n\n\n\n\n£GFX_PAK_shatter_legacy_embed \n\n\n\n\n\n\n11 августа отмечается день независимости Пакистана и отделения от Британской Индии, процесс, отмеченный разрушительным насилием, в результате которого более 15 миллионов человек были перемещены и от 1 до 2 миллионов человек погибли. Индуисты, мусульмане и сикхи — общины, которые сосуществовали на протяжении веков, — оказались втянуты в межконфессиональное насилие, оставив шрамы, которые заживают на протяжении поколений.\n\nМохаммад Али Джинна, отец-основатель Пакистана, стремился создать демократическую, эгалитарную и светскую страну, где мусульмане субконтинента, составляющие около 25% населения, могли бы пользоваться полным равенством. Большую часть своей жизни Джинна выступал за это равенство в рамках единой Индии с индуистским большинством. Однако позже он пришел к выводу, что для достижения этого видения необходимо отдельное государство.\n\nДжинна подчеркивал важность светского образования для улучшения социальных и экономических условий мусульманской общины. Он отстаивал гендерное равенство и выступал против таких практик, как парда. Хотя он не оставил книг или мемуаров, его речи дают глубокое понимание его стремлений в отношении Пакистана. В частности, его обращение 11 августа 1947 года, произнесенное всего за несколько дней до того, как он стал первым президентом Пакистана, сформулировало его светское видение новой нации. Он заявил:\n\n«Вы свободны; вы свободны ходить в свои храмы, вы свободны ходить в свои мечети или любые другие места поклонения в этом государстве Пакистан. Вы можете принадлежать к любой религии, касте или вероисповеданию, которые не имеют ничего общего с делами государства».\n\nДостижения Джинны остаются краеугольным камнем истории 20-го века. Однако десятилетия спустя Пакистан мало похож на страну, которую он представлял себе.\n\nСегодня идеология и религия являются разделяющими силами в Пакистане, примером чего служат сектантское насилие против мусульман-шиитов и законы о богохульстве, которые предусматривают смертную казнь за преступления против ислама. Государственная интерпретация религии сильно влияет на политику и управление, как видно из системного притеснения общины Ахмадия, религиозного меньшинства, на которое направлена государственная политика.\n\nПакистан также остается на бурной политической и экономической траектории. Военные напрямую контролировали государство большую часть его существования, с четырьмя военными переворотами и десятилетиями военного правления с 1958 года. Военные и их печально известные разведывательные службы по-прежнему напрямую контролируют внутреннюю и внешнюю политику, принимая решения для защиты своей власти и экономических интересов.\n\nХотя сегодняшний Пакистан далек от видения Джинны, все еще есть люди, которые каждый день сражаются за Пакистан, каким он мог бы быть, и они всегда будут помнить слова самого известного революционного поэта Пакистана Фаиза Ахмеда Фаиза:\n\n«Придите, мы должны искать обещанный Рассвет»."
 PAK_military_incharge_name: "Военные — это реальная власть"
 PAK_military_incharge_desc: "\n\n\n\n\n£GFX_PAK_military_incharge_embed \n\n\n\n\n\n\nРеспублика Пакистан на бумаге является демократическим обществом, где проводятся гарантированные конституцией выборы, а правительство служит народу. В действительности правительство подчиняется воле военных. С момента основания республики военные играли ведущую роль в национальной политике, а прошлое нашего правительства пронизано военными переворотами и вмешательством. Если какая-либо реформа должна быть принята, она должна пройти через традиционалистские и жесткие умы военных."
 PRC_corrupt_bureaucracy_idea: "Коррумпированная Бюрократия"
 PRC_corrupt_bureaucracy_idea_desc: "\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner\n\n\n\n\n\n                         §YЯ ненавижу их§!.\nСо времен древних династий Китай всегда был полон коррупции. На протяжении тысячелетий народ страдал от коррупции, начиная с евнухов, которые занимались предательством, и заканчивая военачальниками, которые умели только жечь и грабить, или националистическими бюрократами, которые заботились только о своих карманах. Благодаря этому КПК смогла выйти из кровавой борьбы, сметая силы зла. Однако после нескольких кампаний, инициированных Мао, и реформ, проведенных Дэнгом, кадры партии непреднамеренно превратились в новый высший класс. Несбалансированное и неадекватное экономическое развитие, культура недоверия и фракционная борьба привели к распространению взяточничества и кумовства среди чиновников."
 PHI_legacy_of_the_martial_law_idea: "Наследие Военного Положения"
 PHI_legacy_of_the_martial_law_idea_desc: "Военное положение и, как следствие, президентство ныне покойного Фердинанда Маркоса остаются спорной темой в основной филиппинской политике, поскольку его автократическая политика оставила шрамы, которые сохраняются и по сей день."
 PHI_mutual_defence_treaty_idea: "Договор о Взаимной Обороне"
 PHI_mutual_defence_treaty_idea_desc: "Договор о взаимной обороне - это всеобъемлющее соглашение, подписанное между Соединенными Штатами Америки и Республикой Филиппины в первые годы независимости, отмеченные коммунистическими мятежами."
