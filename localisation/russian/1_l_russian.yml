 asean_category: "АСЕАН"
 asean_category_desc: "АСЕАН - это прежде всего экономическая межправительственная организация, базирующаяся в Джакарте и первоначально созданная в 1967 году. С тех пор она расширилась, включив в себя те страны, которые изначально были исключены в напряженной обстановке холодной войны, и стремилась противостоять растущему влиянию Китая, а также сохранить независимость от Запада. Она привержена принципам многосторонности, международного права, мирного урегулирования споров, невмешательства и самоопределения."
