 PRC_the_separatist_problem: "Проблема Сепаратистов"
 PRC_the_separatist_problem_desc: "Сепаратизм в Китае стал хронической проблемой, беспокоящей центральное правительство на протяжении многих лет. Не только уйгуры в Синьцзяне и ламы в Тибете стремятся к независимости, но и беспокойный Специальный административный район Гонконг и "мятежный остров" Тайвань создают проблемы.\n\nКитайское правительство пробовало различные методы, от примирительной политики до жестких репрессий, чтобы справиться с сепаратистами, но все они закончились неудачей. Кроме того, иностранное вмешательство осложнило ситуацию с сепаратистами в разных регионах."
 china.71: "Три представления мысли"
 china.71.t: "Три представления мысли"
 china.71.d: "20 февраля 2000 года товарищ Цзян Цзэминь посетил образовательную встречу «Три беседы» для руководящих кадров в городе Гаочжоу провинции Гуандун и выступил с важной речью. В своей речи он выдвинул требования «Пяти всегда», а именно: «Мы должны гарантировать, что партия всегда сохраняет характер авангарда рабочего класса, всегда представляет интересы подавляющего большинства народа, всегда представляет передовые производительные силы общества, всегда ведет людей всех этнических групп в стране к содействию развитию общественных производительных сил, всегда играет сильную и мощную роль как ядро руководства, а также должна и дальше укреплять партию идеологически, организационно и с точки зрения стиля в свете новых исторических условий." 
 china.71.a: "Ключ к тому, чтобы дела Китая шли хорошо, лежит в нашей партии."
 china.76: "В Гутяне прошла общеармейская политическая конференция"
 china.76.t: "В Гутяне прошла общеармейская политическая конференция"
 china.76.d: "30 октября в посёлке Гутянь уезда Шанхан провинции Фуцзянь состоялось Всеармейское политическое совещание. 31 октября в нём принял участие и выступил с важной речью Генеральный секретарь ЦК КПК, Председатель Китайской Народной Республики и Председатель Центрального военного совета Си Цзиньпин. Си Цзиньпин подчеркнул, что современная военно-политическая работа направлена на реализацию китайской мечты о великом возрождении китайской нации и обеспечение надёжных политических гарантий для достижения цели партии по укреплению армии в новых условиях. Вся армия должна следовать принципам марксизма-ленинизма, идеям Мао Цзэдуна, теории Дэн Сяопина, важным идеям «тройного представительства» и научному подходу к развитию, выполнять распоряжения и требования Центрального Комитета партии о всестороннем развитии законности и строгой партийной дисциплины, проводить в жизнь принципы управления армией на основе закона и строго ориентироваться на современные Тема политической работы наших военных: укреплять и совершенствовать нашу политическую работу в новых условиях и в полной мере использовать жизненно важную роль политической работы в укреплении и возрождении армии."
 china.76.a: "Конференция Гутиан будет сиять вечно."
