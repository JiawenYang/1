 USA_prodem: "§BДемократические Штаты§!"
 USA_prodem_desc: "§BСостояния прогресса и инноваций§!\nДемократически ориентированные штаты обычно поддерживают более либеральную экономическую политику и придают значение социальному обеспечению, образованию, технологическим инновациям и защите окружающей среды. Поскольку они поддерживают инновации и культурные отрасли, эти штаты обычно имеют более высокую производительность и поддержку со стороны высокотехнологичных отраслей, хотя они могут быть менее богаты ресурсами, поэтому корректировки местных ресурсов относительно невелики. Демократически ориентированные штаты обычно больше инвестируют в образование, технологии и здравоохранение, что способствует росту населения и агрегации талантов."
 USA_progop: "§RРеспубликанские штаты§!"
 USA_progop_desc: "§RСостояния консерватизма и силы§!\nШтаты с республиканскими взглядами обычно поддерживают более консервативную экономическую политику, которая делает упор на свободные рынки, низкие налоги и сокращение государственного вмешательства, что делает их более зависимыми от добычи энергии, тяжелой промышленности, производства и сельского хозяйства. Поскольку эти государства, как правило, обладают богатыми природными ресурсами (особенно нефтью и газом), а также сильной армией и инфраструктурой, эти регионы, как правило, имеют высокий местный производственный потенциал и уровень индустриализации. Несмотря на то, что эти государства более богаты ресурсами, они меньше инвестируют в рост производительности и инновации, поэтому они больше внимания уделяют индустриализации и наращиванию военной мощи."
