 VIN_fifty_years_resistance_name: "50 лет сопротивления"
 VIN_fifty_years_resistance_name_desc: "\n\n\n\n\n£GFX_VIN_matyr_day_texticon_embed \n\n\n\n\n\n\n§gМолодой доброволец прикуривает сигарету для пожилого мужчины. Оба потеряли ногу. Они находятся в коммуне Хоа Лан, округ Хоа Ванг, Дананг. Рядом с ними находится братская могила 45 учеников, которые погибли, когда американские ВВС преднамеренно бомбили район начальной школы Ман Куанг 16 марта 1965 года.§!\n\n"Нация, которая более 80 лет мужественно сопротивлялась французскому порабощению, нация, которая в последние годы решительно выступала вместе с союзниками против фашизма, эта нация должна быть свободной! Эта страна должна быть независимой!"\n- Декларация независимости Демократической Республики Вьетнам\n\nС момента основания Вьетминя в 1941 году и до окончания китайско-вьетнамских конфликтов в 1991 году Вьетнам наконец обрел мир."
 VIN_fifty_years_resistance_4_name: "Заживление шрамов"
 VIN_fifty_years_resistance_4_name_desc: "\n\n\n\n\n£GFX_VIN_veteran_texticon_embed \n\n\n\n\n\n\n§gВетераны Освободительной войны.§!\n\nСлава мученикам! Их жертва и самоотверженность никогда не будут забыты. Но сейчас мы должны идти вперед."
 VIN_doi_moi_name: "Doi Moi"
 VIN_doi_moi_name_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§gУгол улицы города Хошимин в 1990-х годах.§!\n\nDoi Moi — это название экономических реформ, начатых во Вьетнаме в 1986 году с целью создания "социалистически ориентированной рыночной экономики". Политика Doi Moi относится конкретно к этим реформам, которые стремились перейти от командной экономики к социалистической рыночной экономике.\nЭкономические реформы Doi Moi были инициированы Коммунистической партией Вьетнама в 1986 году во время 6-го Национального съезда партии. Эти реформы повысили роль рыночных сил в координации экономической деятельности между предприятиями и государственными учреждениями и позволили частной собственности на малые предприятия и созданию фондовая биржа как для государственных, так и для негосударственных предприятий."
 VIN_doi_moi_name_1: "Doi Moi"
 VIN_doi_moi_name_1_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§gУгол улицы города Хошимин в 1990-х годах.§!\n\nDoi Moi — это название экономических реформ, начатых во Вьетнаме в 1986 году с целью создания "социалистически ориентированной рыночной экономики". Политика Doi Moi относится конкретно к этим реформам, которые стремились перейти от командной экономики к социалистической рыночной экономике.\nЭкономические реформы Doi Moi были инициированы Коммунистической партией Вьетнама в 1986 году во время 6-го Национального съезда партии. Эти реформы повысили роль рыночных сил в координации экономической деятельности между предприятиями и государственными учреждениями и позволили частной собственности на малые предприятия и созданию фондовая биржа как для государственных, так и для негосударственных предприятий."
 VIN_patriotic_tradition_name: "Решительно настроены на борьбу и решительно настроены на победу"
 VIN_patriotic_tradition_name_desc: "\n\n\n\n\n£GFX_VIN_determine_to_win_texticon_embed \n\n\n\n\n\n\n§gЦеремония отправления Ханойской молодежной добровольческой группы для борьбы с империализмом США, состоявшаяся в Ханойском оперном театре 11 июля 1969 года§!\n\n«Господин Шенбрун, у нас есть секретное оружие... не улыбайтесь, когда я вам это скажу. Наше секретное оружие — национализм. Иметь государственность, которая является признаком зрелости, сильнее любого оружия в мире».\n- Хо Ши Мин\n\nЧто позволило маленькой стране противостоять гораздо более сильному врагу? Что позволило отсталой армии победить самую мощную и передовую армию в мире? Для вьетнамского народа ответом является только железная воля и страстный патриотизм. На протяжении тысячелетней истории, каждый раз, когда страна подвергается вторжению, этот дух воспламеняется, образует огромную и мощную волну, проходит через все опасности и трудности и поглощает наших врагов, как предателей, так и захватчиков. Патриотизм каждого человека и каждой этнической группы является частью патриотической традиции вьетнамской страны. Патриотизм является самой выдающейся и всеобъемлющей традицией, которая стала силой и движущей силой для победы над всеми захватчиками."
 VIN_failure_of_1980s_name: "Неудачи 1980-х"
 VIN_failure_of_1980s_name_desc: "\n\n\n\n\n£GFX_VIN_bao_cap_texticon_embed \n\n\n\n\n\n\n§gЛюди выстраиваются в очередь, чтобы купить еду в период субсидий.§!\n\nСразу после объединения страны Вьетнам быстро инициировал политику быстрой индустриализации, направленную на продвижение к социализму. Однако из-за жесткого принятия советской экономической модели, отсутствия научно-технического опыта и последствий войны страна сильно пострадала. Процесс индустриализации был реализован беспорядочно, что привело к состоянию застоя и, в конечном итоге, рецессии. Баланс между спросом и предложением был нарушен, поскольку правительство отдавало приоритет тяжелой промышленности, пренебрегая развитием легкой промышленности. Кроме того, объемы сельскохозяйственного производства постоянно снижались, что потребовало импорта риса из Советского Союза. Денежная реформа 1985 года еще больше усугубила экономическая ситуация, приведшая к ошеломляющему уровню инфляции в 393%. Несмотря на различные попытки реформ и корректирующие действия, последствия ошибок 1980-х годов продолжают бросать значительную тень на экономику."
