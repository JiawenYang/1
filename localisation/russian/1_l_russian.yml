 SOV_chechen_republic: "Чеченская Республика"
 CHI_beijing_municipality_desc: "Столица Китайской Народной Республики, национальный политический центр, культурный центр, центр международного обмена и центр научно-технических инноваций。"
 CHI_tianjin_municipality_desc: "Один из муниципалитетов, важный центральный город Китая, национальный исторический и культурный город, современный морской город и международный комплексный транспортный узел。"
 CHI_shanghai_municipality_desc: "Один из муниципалитетов Китая, национальный исторический и культурный город, международный центр экономики, финансов, торговли, судоходства и технологических инноваций。"
 CHI_chongqing_municipality_desc: "Один из муниципалитетов, важный центральный город Китая, национальный исторический и культурный город и международный комплексный транспортный узел。"
 CHI_guangxi_zhuang_autonomous_region_desc: "Граница Китая и окно для открытости и сотрудничества с АСЕАН, а также важный барьер безопасности на юго-западе и в центральной части Южного Китая。"
 CHI_ningxia_hui_autonomous_region_desc: "Расположенный в центре Экономического пояса Шелкового пути, он является важным узлом в строительстве Нового западного коридора «Суша-Море» и важным регионом, поддерживающим реализацию национальных стратегий, таких как Западное развитие, экологическая защита бассейна реки Хуанхэ и высококачественное развитие。"
 CHI_tibet_autonomous_region_desc: "Это важный барьер национальной безопасности, барьер экологической безопасности, стратегическая ресурсная база, база чистой энергии, база специализированной сельскохозяйственной продукции плато, мировое туристическое направление и важный канал, открытый для Южной Азии。"
 CHI_tibet_desc: "Это важный барьер национальной безопасности, барьер экологической безопасности, стратегическая ресурсная база, база чистой энергии, база специализированной сельскохозяйственной продукции плато, мировое туристическое направление и важный канал, открытый для Южной Азии。"
 CHI_xinjiang_uygur_autonomous_region_desc: "Важный барьер безопасности на северо-западе Китая и плацдарм для выхода на запад。"
 CHI_xinjiang_uygur_desc: "Важный барьер безопасности на северо-западе Китая и плацдарм для выхода на запад。"
 CHI_inner_mongolia_autonomous_region_desc: "Расположенный на северной границе Китая, он охватывает Северо-Восточный Китай, Северный Китай и Северо-Западный Китай. Это важный барьер экологической безопасности на севере Китая, барьер безопасности и стабильности на северной границе Китая, важная национальная энергетическая и стратегическая ресурсная база, важная национальная база сельскохозяйственного и животноводческого производства и важный плацдарм для открытия Китая на севере。"
 CHI_hong_kong_desc: "Я словно золотой барс, страж у ворот дворца ночью,\nМать, хоть мой статус скромен, моё положение важно.\nТеперь свирепые морские львы набрасываются на меня,\nПожирают мою плоть, глотают мою сущность;\nМать, я плачу и стенаю, но ты не отвечаешь.\nМать, позволь мне укрыться в твоих объятиях!\nМать! Я хочу вернуться, Мать!"
 CHI_macau_desc: "«Знаешь ли, что «Макао» — не истинное моё имя?\nСлишком долго я покидал твою колыбель, мать!\nНо хотя похитили они плоть мою,\nТы хранишь душу мою неприкосновенной.\nТриста лет во сне не забывал я родную мать!\nНазови меня детским именем,\nПроизнеси вновь «Аомынь»!\nМать! Я вернусь, о мать!»"
 CHI_taiwan_autonomous_region_desc: "Мы - струя жемчугов из Восточно-Китайского моря,\nРюкю мой младший брат, а я - Тайвань.\nДух Чжэна все еще витает в моем сердце,\nКровь преданности окрашивает наследие моей семьи.\nМать, палящее летнее солнце может убить меня,\nДай мне приказ, и я могу сражаться до последней капли.\nМать! Я хочу вернуться, Мать!"
 CHI_taiwan_desc: "Мы - струя жемчугов из Восточно-Китайского моря,\nРюкю мой младший брат, а я - Тайвань.\nДух Чжэна все еще витает в моем сердце,\nКровь преданности окрашивает наследие моей семьи.\nМать, палящее летнее солнце может убить меня,\nДай мне приказ, и я могу сражаться до последней капли.\nМать! Я хочу вернуться, Мать!"
 CHI_beijing: "Kапитал"
 CHI_beijing_desc: "Пион во дворе дикий и безвкусный, лотос в пруду чист и бесстрастен.\nТолько пион — истинная национальная красота, и столица приходит в движение, когда распускаются цветы."
 CHI_shanghai: "Новый район Пудун"
 CHI_shanghai_desc: "Развитие и открытие Пудуна вывели Шанхай на путь всеобщей трансформации, а также придали новый импульс реформам и открытию всей дельты реки Янцзы, бассейна реки Янцзы и даже всей страны."
 CHI_XinJiang_Situation: "Ситуация в Синьцзяне"
 CHI_XinJiang_Situation_desc: "Уровень угрозы, исходящей от местных экстремистских сепаратистских действий, напрямую влияет на наш уровень контроля над регионом и серьёзно препятствует нормальному экономическому порядку в регионе.\n\n§YУгроза сепаратизма§!: [?CHI.uighur_threat|%%]\n§YОбщественное мнение уйгуров§!: [?CHI.uighur_opinion|%%]"
 CHI_hebei: "Центр Пекин-Тяньцзинь"
 CHI_hebei_desc: "Расположенный в столице, он является одним из ключевых районов для реализации стратегии скоординированного развития Пекин-Тяньцзинь-Хэбэй."
 CHI_guangdong: "Гигант в дельте Жемчужной реки"
 CHI_guangdong_desc: "Авангард, пионер и экспериментальная зона реформ и открытости, а также важное окно для демонстрации достижений реформ и открытости Китая миру."
 CHI_shanxi: "Угольная база"
 CHI_shanxi_desc: "Стратегическая точка опоры, поддерживающая экологическую защиту и высококачественное развитие бассейна реки Хуанхэ, одного из самых ранних мест рождения и центральных районов китайской цивилизации, важной энергетической базы и минерально-сырьевой провинции в Китае, а также важного зеленого экологического барьера в Северном Китае."
 CHI_henan: "Подъем Центральных равнин."
 CHI_henan_desc: "Расположенный на Центральных равнинах, он является важным районом, поддерживающим реализацию национальных стратегий, таких как подъем центрального региона, экологическая защита и высококачественное развитие бассейна реки Хуанхэ."
 CHI_shandong: "Штат бизнеса Шаньдуна."
 CHI_shandong_desc: "Это важный узел, который способствует связи между севером и югом, координации между востоком и западом, сушей и морем, а также соединяет Северо-Восточную Азию и инициативу «Один пояс, один путь». Это стратегическая точка опоры для экономического развития северного Китая и важная промышленная база."
 CHI_liaoning: "Промышленная база."
 CHI_liaoning_desc: "Важная старая промышленная база в Китае, важный регион для содействия всестороннему возрождению Северо-Восточного Китая в новую эпоху."
 CHI_jilin: "Тяжелая техника на севере"
 CHI_jilin_desc: "Расположенный в географическом центре Северо-Восточной Азии, это важный регион для Китая, чтобы открыться Северо-Восточной Азии, а также важная национальная коммерческая зерновая база и старая промышленная база."
 CHI_heilongjiang: "Ледяная и снежная тяжелая промышленность"
 CHI_heilongjiang_desc: "Расположенный в центральном регионе Северо-Восточной Азии, это важная национальная коммерческая зерновая база, база производства и производства тяжелого оборудования, важная энергетическая и сырьевая база, северный экологический барьер безопасности и новое высокогорье для открытия на север."
 CHI_jiangxi: "Колыбель Красной революции"
 CHI_jiangxi_desc: "Расположенный в среднем и нижнем течении реки Янцзы, это важный регион, поддерживающий реализацию национальных стратегий, таких как подъем центрального региона и развитие экономического пояса реки Янцзы."
 CHI_hubei: "Jiangcheng Hub"
 CHI_hubei_desc: "Расположенный в среднем течении реки Янцзы, Хубэй имеет преимущества в области транспорта, промышленности и сельского хозяйства и является важным экономическим и транспортным узлом в центральном регионе."
 CHI_hunan: "Хунань и Чу"
 CHI_hunan_desc: "Это регион реализации основных национальных стратегий, таких как развитие Экономического пояса реки Янцзы и подъем центрального региона, а также важная провинция для промышленного развития Китая."
 CHI_jiangsu: "Южная экономическая зона Цзянсу"
 CHI_jiangsu_desc: "Расположенный на пересечении Экономического пояса Шелкового пути и Морского Шелкового пути 21 века, он является важным регионом, поддерживающим реализацию основных национальных региональных стратегий, таких как развитие Экономического пояса реки Янцзы и комплексное развитие дельты реки Янцзы."
 CHI_anhui: "Новый и развивающийся Центральный Аньхой."
 CHI_anhui_desc: "Это регион реализации крупных национальных стратегий, таких как комплексное развитие дельты реки Янцзы, развитие экономического пояса реки Янцзы и подъем центрального региона, а также важная провинция для научных и технологических инноваций Китая."
 CHI_zhejiang: "Коммерческая столица Дунхай."
 CHI_zhejiang_desc: "Пересечение экономического пояса реки Янцзы и комплексной стратегии развития дельты реки Янцзы, а также пионер модернизации в китайском стиле."

