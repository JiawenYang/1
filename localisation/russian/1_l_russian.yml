 SOV_kleptocratic_state: "Клептократическое Государство"
 SOV_kleptocratic_state_desc: "Приватизация бывшей советской экономики не могла быть достаточно быстрой для Бориса Ельцина, поэтому после распада Союза он начал "шоковую терапию" - отмену нормативных актов и распродажу целых отраслей промышленности практически за одну ночь. Коррумпированные чиновники, партийные аппаратчики и другие неэтичные предприниматели покупали бывшие государственные компании за копейки на рубль, а это означало, что экономическая власть оставалась в руках нескольких друзей правительства. Они сохранили свою власть, налаживая отношения и заключая закулисные сделки с администрацией Ельцина, и они стали объектом всеобщего фурора после национального экономического кризиса 1998 года."
 SOV_Russian_Orthodox_Church: "Русская Православная Церковь"
 SOV_Russian_Orthodox_Church_desc: "\n\n\n\n£GFX_SOV_russian_orthodox_church\n\n\n\n\n\nНа протяжении более тысячи лет православное христианство было доминирующей религией в России, начиная с поздней эпохи Киевской Руси и заканчивая царскими временами. Бесспорно, наши люди были чрезвычайно религиозны, особенно в сельской местности, и, несмотря на все усилия Советского Союза по пропаганде государственного атеизма, они все еще остаются таковыми. Таким образом, Русская Православная Церковь является одним из самых мощных политических орудий, которыми располагает Правительство. В то время как церковь старается оказывать влияние государства на все население России и сельские районы нашей страны, она также может быть использована для дискредитации любых форм оппозиции или любых движений, которые могут негативно повлиять на нашу собственную культуру, таких как движение ЛГБТК."
