 NSTFR_SIA_RoyalArmy_idea: "Королевская армия Таиланда"
 NSTFR_VIN_people_army_idea: "Народная армия Вьетнама"
 NSTFR_VIN_people_army_idea_desc: "\n\n\n\n£GFX_NSTFR_VIN_people_army_idea\n\n\n\n\n\nНародная армия Вьетнама возникла из армии Вьетминя в революционную эпоху и является вооруженными силами нынешней Социалистической Республики Вьетнам. В соответствии с прошлыми традициями и конституционными положениями, Народная армия должна строго придерживаться принципа «партия командует оружием» и признавать руководство Коммунистической партии Вьетнама. Из-за влияния Народно-освободительной армии Китая с севера в процессе своего формирования, Народная армия Вьетнама имеет определенные сходства с Китаем в своих боевых методах и военной идеологии."
 ITA_corruption: "Коррупция"
 ITA_corruption_desc: "Итальянская политическая система гораздо менее стабильна и беспристрастна, чем сопоставимые европейские системы. Кумовство и коррупция - это огромные проблемы в местной администрации, судебной системе и даже в федеральном правительстве."
 UKR_government_corruption: "Украинский Олигархат"
 UKR_government_corruption_desc: "Различные олигархические кланы уже давно и прочно вошли в сферу влияния наших властных структур. В среде государственных служащих широко распространены негласные вознаграждения за содействие, взяточничество, вымогательство и другие злоупотребления властью. Несмотря на уже существующее антикоррупционное законодательство, слабая судебная система и неблагоприятная экономическая ситуация делают исполнение этих законов крайне затруднительным, а в некоторых случаях и вовсе невозможным."
 ReworkMD_Soundtrack_TITLE: "Дополнительный саундтрек MD"
 THE_FIRE_RISES: "§RОгонь разгорается, обжигая Азиатско-Тихоокеанский регион.§!(Выполнено примерно на 50%)"
 CHI_THEIR_LAND_THEIR_BLOOD: "Их земля, их кровь"
 CHI_THEIR_LAND_THEIR_BLOOD_desc: "С времён династий Хань и Тан народы Азии жили в мире и согласии, взращивая жизнь. Но японские захватчики отказались от человечности и справедливости, неоднократно развязывали войны, опустошали соседние страны и совершали преступления, не поддающиеся описанию.\n\nВ древности японские пираты разоряли наши берега, резали города, грабили земли и убивали невинных. В новое время они вторглись в Китай во время Японо-китайской войны, оккупировали наши территории и угнетали наш народ. Во Второй мировой войне их железные копыта прошлись по всей Восточной Азии. Они убили 300 000 невинных во время Нанкинской резни, жгли, убивали, насиловали и грабили без удержу. Корейский полуостров и страны Юго-Восточной Азии были порабощены, трупы покрывали землю, а кровь текла как реки. Они проводили опыты на людях, использовали бактериологическую и химическую войну — крайняя жестокость, позор человеческой цивилизации.\n\nПосле войны они отказались раскаяться, отрицали свои преступления, почитали военных преступников, фальсифицировали историю, бросали вызов справедливости и унижали души погибших.\n\nСейчас торжествует справедливость, небеса возвращают свой закон. Народы Азии объединены общей ненавистью и вместе карают зло. Мы отплатим за кровь, сурово накажем виновных, утешим души невинных и защитим правду мира.\n\n§RЭти преступления не терпимы небом и землёй; это зло должно быть уничтожено, чтобы Азия обрела мир!§!"
 Northern_Alliance_of_Myanmar: "Северный альянс Бирмы"
 Myanmar_National_Unity_Government: "Национальное правительство единства Мьянмы"
 tribes_state: "Племенное общество"
 tribes_state_desc: "Эта страна состоит из различных этнических групп, племен, религий и языков. Легко спровоцировать конфликты и вооруженные столкновения между ними."
 mcdonald_nationalism: "У нас есть национализм, а у вас что?"
 mcdonald_nationalism_desc: "Когда McDonald's появился в бывших восточноевропейских коммунистических странах, владение McDonald's стало частью национальной гордости и даже было включено в футбольные песни, чтобы высмеять страны, в которых не было McDonald's.\n\n§RПоэтому, будь то в играх или в реальности, националистический взгляд этих стран проявляется как западный взгляд.§!"
 africa_nationalism: "Африканское освободительное движение"
 africa_nationalism_desc: "§RМы должны полагаться на самих африканцев, чтобы освободить Африку. Африканцы должны сами решать свои дела и полагаться на свои силы.§!\n--Мао Цзэдун"
 MAY_politics: "Малайзийская политика"
 MAY_politics_desc: "\n\n\n\n\n\n£GFX_MAY_politics_texticon_embed\n\n\n\n\n\n\n\n§gМалайзийские учебники китайского языка§!\n\nРаджа или султан — глава правительства, которого народ должен уважать. Монархическое соглашение между монархом, Шри Дери Буаной, и народом, Демандалом Балдаваном, порождает понятия монархической власти и предательства.\n\n§YМонархическая власть: Монархическая власть символизирует правящую власть монарха. Раджа или султан управляет своим государством с мудростью, высокими моральными качествами и интеллектом.§!\n\n§RПредательство: Предательство означает, что народ не подчиняется приказам Раджи или султана. Люди, предающие своего монарха, постигнет несчастье или бедствие.§!"
 IND_politics: "Панчашира"
 IND_politics_desc: "\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_IND_politics_texticon_embed\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nЩит в центре индонезийского национального герба символизирует Пять Принципов Индонезии. На плакате, выпущенном в 1987 году, ниже национального герба были пояснены соответствующие символы пяти принципов. Пять Принципов:\nВера в единого, единственного Бога\nГуманизм, основанный на справедливости и цивилизации\nЕдинство и солидарность Индонезии\nДемократия, руководствующаяся мудрыми принципами представительного правительства и консультаций\nСоциальная справедливость для всех индонезийцев\n\n«Панчашира» (Пять Принципов Индонезии) была предложена первым президентом Индонезии Сукарно в июне 1945 года. Формирование политических партий должно соответствовать Пяти Принципам. Пять Принципов являются одним из основополагающих принципов Конституции Индонезии."
