 pop_protection: "Механизм защиты популярности"
 two_child_policy: "Политика двух детей"
 PRC_the_separatist_problem: "Проблема Сепаратистов"
 PRC_the_separatist_problem_desc: "Сепаратизм в Китае стал хронической проблемой, беспокоящей центральное правительство на протяжении многих лет. Не только уйгуры в Синьцзяне и ламы в Тибете стремятся к независимости, но и беспокойный Специальный административный район Гонконг и "мятежный остров" Тайвань создают проблемы.\n\nКитайское правительство пробовало различные методы, от примирительной политики до жестких репрессий, чтобы справиться с сепаратистами, но все они закончились неудачей. Кроме того, иностранное вмешательство осложнило ситуацию с сепаратистами в разных регионах."
 chinese_overseas_dynamic_modifier: "Зарубежные [CHI.GetAdjective] в [THIS.GetNameWithFlag]"
 chinese_overseas_dynamic_modifier_desc: "В [THIS.GetName], [?chinese_overseas_population]% населения составляет [CHI.GetAdjective], и они владеют [?chinese_overseas_wealth]% богатства. [CHI.GetAdjective] внесли выдающийся экономический вклад в [THIS.GetName], а также неизбежно повлияли на местную политическую экологию."
 first_island_chain: "Первая островная цепь"
 first_island_chain_desc: "Первая островная цепь – это цепь островов в западной части Тихого океана, простирающаяся на восток от восточноазиатского побережья, и обширные воды между ними. Она простирается от Японского архипелага и островов Рюкю на севере, через Тайвань в центре и на юг до Филиппинских островов и Больших Зондских островов, простираясь до Южно-Китайского моря. Это первая линия обороны США во внешней и национальной оборонной политике, направленная на сдерживание Китая, названная так потому, что она в основном состоит из островов и образует цепь. Воды Первой островной цепи являются наиболее эффективным районом для обороны вооруженных сил США от Народно-освободительной армии Китая."
 five_eyes: "Пять глаз"
 five_eyes_desc: "Альянс «Пять глаз» — это разведывательный альянс, состоящий из пяти англоязычных стран, международная группа по обмену разведданными, созданная в соответствии с Англо-американским соглашением. В число стран-членов входят Австралия, Канада, Новая Зеландия, Великобритания и США. Встречи, проводимые этими пятью странами, часто называют «Пятёркой». История Альянса «Пять глаз» восходит к временам Второй мировой войны и подписания Атлантической хартии союзниками.\nПять стран имеют общее историческое происхождение. Все страны-члены когда-то входили в состав Британской империи, а Великобритания, Австралия, Новая Зеландия и Канада также являются членами Содружества. США, Канада и Великобритания также являются членами НАТО. США и Великобритания являются двумя постоянными членами Совета Безопасности ООН."

 PRC_pla_dynamic: "Народно-освободительная армия"
 PRC_pla_dynamic_desc: "\n\n\n\n\n£GFX_PRC_PLA_texticon_embed \n\n\n\n\n\n\nНародно-освободительная армия Китая (НОАК) выступает в качестве защитника как партии, так и государства. Следовательно, ее структура управления интегрирована как в партийную организацию, так и в государственный аппарат через Центральный военный совет (ЦВС). По сути, существует два ЦВС: один принадлежит партии, а другой государству (заменяющий Министерство обороны, существующее в других странах). В партийной структуре ЦВС партии является высшим органом наряду с Центральным комитетом партии и Центральной комиссией по проверке дисциплины партии. В государственной административной структуре ЦВС государства является высшим органом наряду с правительством, Всекитайским собранием народных представителей и Китайской народной политической консультативной конференцией.\n\nЗаместитель председателя ЦВС является высшей должностью для действующего военного офицер, эквивалентный заместителю премьер-министра правительства. Начальник штаба, министр политической работы, министр национальной обороны и секретарь инспекции дисциплины ЦВС также являются членами. Эти должности имеют национальный ранг заместителя (выше министра), а два заместителя председателя являются частью Политбюро. В зависимости от периода первый заместитель председателя может быть членом Постоянного комитета. Члены ЦВС предлагаются председателем и утверждаются партийным съездом и Всекитайским собранием народных представителей на каждой сессии съезда. Члены ЦВС подотчетны только председателю ЦВС. Ни Всекитайское собрание народных представителей, ни Центральный комитет партии, ни гражданские члены Политбюро или его Постоянного комитета (премьер, председатель Всекитайского собрания народных представителей, председатель, генеральный секретарь) не имеют никакой власти над ЦВС или вооруженными силами."
 business_value_factor: "£GFX_dx_blue Фактор Ценности Бизнесов"
 personal_value: "£GFX_dx_yellow Личная Ценность (млрд)"
 personal_value_factor: "£GFX_dx_yellow Фактор Личной Ценности"
 personal_expense_factor: "£GFX_dx_yellow Фактор Личных Расходов"
 expense_growth_factor: "£GFX_dx_yellow Ежемесячный Рост Расходов"
 partofusa_tooltip: "§4МОМЕНТ ОДНОПОЛЯРНОСТИ§!\n\n\n\n\n\n\n£USA_Cold_War_Entry_embed \n\n\n\n\n\n\n§gНеоспоримый архитектор нового мирового порядка. Возникнув из пепла холодной войны, Соединенные Штаты превратились из осторожной сверхдержавы в гипердержаву, командующую самым грозным военно-экономическим узлом в истории в течение одного десятилетия - рассвета Американского века.\n\n1990-е годы стали свидетелями метаморфозы Америки: цифровая революция Кремниевой долины изменила мировую торговлю, в то время как быки Уолл-стрит ринулись в атаку без оков. Однако под триумфализмом появились трещины. Азиатский финансовый кризис обнажил нестабильность капитализма, крах российской «шоковой терапии» породил олигархическое хищничество, а расширение НАТО на восток разожгло тлеющие обиды. Когда Nasdaq достиг пика в 5048 в марте 2000 года, блеск пузыря доткомов скрыл структурные слабости — антимонопольное осуждение Microsoft предвещало парадокс технологического доминирования.\n\nНовое тысячелетие манило экзистенциальными вопросами: ослепила ли гордыня гегемона? Дураки! Ответ эхом отозвался в микрочипах Кремниевой долины и истребителях-невидимках Пентагона. Вступление Китая в ВТО? Рассчитанная авантюра, чтобы укротить дракона через цепочки поставок. Запуск евро в Европе? Региональный противовес, неизбежно зависящий от щита НАТО. Когда ей бросали вызов, Америка внедряла инновации; когда ей угрожали, она мобилизовывалась. От неба Косово до авианосцев Персидского залива ее мощь оставалась непревзойденной.\n\n§3Траектория 21-го века теперь зависела от того, сможет ли Pax Americana развиться от доминирования к устойчивому управление...§!§!"
 partofchina_tooltip: "§tВОСТОЧНЫЙ БЛОК§!\n\n\n\n\n\n\n£PRC_Cold_War_Entry_embed \n\n\n\n\n\n\n§gНа протяжении большей части прошлого столетия Китай часто рассматривался как раздробленное и отсталое аграрное государство, его прежняя имперская слава давно угасла. Тень Века Унижения нависла над 19-м и 20-м веками, когда иностранные вторжения и внутренние потрясения переплетались, рисуя трагическую картину страданий. Только после изгнания японских агрессоров с материковой части Азии и победы Коммунистической партии Китая в Войне за Освобождение Китай по-настоящему начал возвращать себе свою судьбу. Основание Китайской Народной Республики ознаменовало рассвет новой эры — эпохи возрождения из пепла войны и голода, полной решимости бросить вызов существующему мировому порядку. Действительно, Народная Республика является единственной страной в истории, чтобы победить Соединенные Штаты и их союзников в обычной войне, подвиг, достигнутый во время Корейской войны. Эта победа была не просто военным триумфом; это было заявлением миру: «Эпоха, в которую империализм мог доминировать над страной, просто разместив несколько пушек на ее восточном побережье, ушла навсегда».\n\nТрансформация Китайской Народной Республики — это не что иное, как чудо. От хаотичного милитаризма начала 20-го века до единой, индустриализующейся державы к 1950-м годам, подъем Китая был не чем иным, как поразительным. К началу 21-го века мир начал говорить о «китайском веке» — времени, когда китайская цивилизация вернет себе место в центре мировой сцены. Однако путь к превосходству полон проблем. Полвека назад Китай все еще боролся с голодом, неграмотностью и тяготами индустриализации; сегодня он возвышается на мировой сцене, готовый бросить вызов американскому гегемония.\n\n§tНо вопрос остается: сможет ли Китай сохранить свой подъем или рухнет под тяжестью своих амбиций?§!§!"
 PRC_chinese_communist_party_idea: "Коммунистическая Партия Китая"
 PRC_communist_party_of_china_dynamic: "Коммунистическая Партия Китая"
 PRC_communist_party_of_china_dynamic_desc: "\n\n\n\n£GFX_chinese_communist_party\n\n\n\n\n\n§RДа здравствует великая Коммунистическая партия Китая!\nДа здравствуют непобедимые идеи Мао Цзэдуна!§!\n\nС 1949 года КПК является беспрекословным правителем материкового Китая. Даже после распада нескольких коммунистических государств во главе с СССР социалистический Китай остался в Восточной Азии и постепенно превратился в одну из самых могущественных стран мира после реформ и открытости. Причины, по которым КПК удалось укрепить свое господство в Китае с населением в 1,4 миллиарда человек, стали предметом многочисленных споров. Одни утверждают, что КПК отказалась от своего коммунистического кредо, обещающего экономическое процветание в обмен на поддержку, и приняла традиционную идеологию старой империи, чтобы держать народ в страхе и повиновении. Другие утверждают, что КПК преуспела, внедрив свою идеологию и организацию во все сферы жизни общества и получив заряд бодрости благодаря постоянным реформам. Как бы то ни было, одно несомненно: §Rчтобы свергнуть гиганта, которым является КПК, потребуется катастрофа апокалиптического уровня.§!"
 VIE_communist_party_vietnam_dynamic: "Коммунистическая партия Вьетнама"
 one_child_policy_desc: "\n\n\n\n\n£GFX_PRC_one_child_policy_texticon_embed \n\n\n\n\n\n\n«Политика одного ребёнка» — это правительственная инициатива по контролю за быстро растущим населением, начатая в 1979 году. Она успешно достигла своей цели; однако нельзя игнорировать последствия.\n\nОна ещё больше усугубляет гендерное неравенство: семьи предпочитают иметь мальчиков, в то время как девочки часто недооцениваются. Это создаёт риски для гендерного баланса в будущем."
 FRA_french_spirit_idea: "Французский Дух"
 FRA_french_spirit_idea_desc: "\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\nНа протяжении начала 19-го и 20-го веков Париж был оккупирован дважды. Сначала в 1870 году, затем в 1940-м. С тех пор Франция поклялась никогда не позволять иностранной стране оккупировать ее земли. Французская армия готова защищать нацию до последнего. Французские ядерные ракеты поддерживают защитный зонтик вокруг страны, угрожая адским пламенем всем, кто осмелится угрожает её родине.\n\nТем не менее, французский дух связан не только с защитой нации, но и с революцией. Зародившись в 1789 году стало сердцем либерализма и левых взглядов, французский радикальный дух сохранялся на протяжении последних двух столетий. Французский народ не из тех, кто терпит несправедливость или жестокое обращение, и предпочел бы умереть стоя, чем жить на коленях. Таким образом, любые попытки нарушить волю народа будут встречены массовыми протестами, беспорядками и, возможно, революцией - процесс, хорошо практикуемый французским народом к этому моменту"
 idea_ISR_american_funding: "Американское Финансирование"
 idea_ISR_american_funding_desc: "Америка, родина храбрости, Страна свободных, долгое время использовала Израиль в качестве плацдарма на неспокойном Ближнем Востоке, и благодаря этому решению мы получили выгоду от их поддержки.\n\nЕСЛИ СОЕДИНЕННЫЕ ШТАТЫ ПРЕКРАТЯТ СВОЕ СУЩЕСТВОВАНИЕ ИЛИ РЕШАТ ПРЕКРАТИТЬ ПОДДЕРЖИВАТЬ НАС, НАШЕ ГОСПОДСТВО НА БЛИЖНЕМ ВОСТОКЕ БУДЕТ ПОСТАВЛЕНО ПОД СОМНЕНИЕ НАШИМИ СОСЕДЯМИ."
 idea_ISR_vanguard_of_judaism: "Авангард Иудаизма"
 ISR_french_funding_idea: "Французское Финансирование"
 ISR_french_funding_idea_desc: "Хотя и не такое сильное... в отличие от нашего прежнего американского финансирования, французское правительство очень любезно оказывает нам некоторую поддержку."
 JAP_japanese_pacifism_idea: "Японский Пацифизм"
 JAP_japanese_pacifism_idea_desc: "С момента окончания Второй мировой войны Япония была вынуждена отказаться от старых методов милитаризма и принять более пацифистский образ жизни по сравнению с прошлым. В соответствии со статьей 9 Конституции это делает практически невозможным для нации создание какой-либо армии. Однако в связи с растущей угрозой со стороны Китая на востоке и постоянно ослабевающими Соединенными Штатами многие начали подвергать сомнению статус-кво и предлагать отменить статью 9 и создать надлежащую армию для защиты Японии и ее народа."
 JAP_aging_population_idea: "Стареющее Население"
 JAP_aging_population_idea_desc: "Более 76,4% населения Японии считается пожилым, что в значительной степени вызвано периодом бесплодия после послевоенного бэби-бума 1940-х годов и высокой ожидаемой продолжительностью жизни. Несмотря на крайний демографический дисбаланс, нет реального ощущения демографического кризиса, и уровень жизни сегодня все еще относительно высок. Однако это привело к значительной экономической нагрузке на и без того стагнирующую японскую экономику, в основном из-за того, что огромное количество населения вышло на пенсию, а правительство испытывает большую потребность в услугах по уходу за ними. Японское правительство продолжило внедрять новые способы для пожилых людей снова стать активными в обществе, а также субсидировать новые семьи и всячески поощрять рождение новых детей с помощью более простых услуг по уходу."
 JAP_economic_stagnation_idea: "Экономическая Стагнация"
 JAP_economic_stagnation_idea_desc: "В последние годы экономика Японии находится в состоянии стагнации: медленный рост, низкая инфляция и сокращение численности населения создают серьезные проблемы. Экономический застой в стране объясняется целым рядом факторов, включая демографические тенденции, дефляцию и отсутствие структурных реформ.\nОдной из основных причин экономического застоя в Японии является старение и сокращение численности населения. В стране проживает одно из старейших в мире население с низким уровнем рождаемости и быстро стареющей рабочей силой. Эта демографическая тенденция привела к сокращению численности рабочей силы и снижению потребительских расходов, что сдерживает экономический рост."
 JAP_keiretsu_control_idea: "Контроль Кэйрэцу"
 JAP_keiretsu_control_idea_desc: "Главным промышленным винтиком Японии всегда были могущественные бизнес-конгломераты, которые стали доминировать в экономике после реставрации Мэйдзи. Более исторически известные как дзайбацу, сегодня известные как Кэйрэцу, стали настолько неотъемлемой частью японской экономики, что некоторые из них даже стали известны как спонсируемые государством монополии, исключительно из-за того, насколько высока их доля на рынке. Власть Кэйрэцу в основном проистекает из того, что каждая компания-член Кэйрэцу владеет частью акций каждой компании-партнера, причем они сосредоточены в основном банке. Таким образом, каждая компания в Кэйрэцу может изолировать друг друга от изменений на рынке и поглощений в управлении, позволяя организовывать долгосрочные проекты по своей прихоти практически без риска. Кэйрэцу в значительной степени контролируют большую часть монолитного производственного сектора Японии, и если правительство не попытается изменить статус-кво, оно вряд ли будет отменено."
 JAP_political_monopoly_idea: "Политическая Монополия"
 JAP_political_monopoly_idea_desc: "\n\n\n\n£GFX_JAP_political_monopoly\n\n\n\n\n\nЛиберально-Демократическая Партия Японии является доминирующей политической силой в Японии с момента ее образования в 1955 году. С небольшими перерывами ЛДП удерживала большинство в японском парламенте на протяжении всего периода его существования, что фактически обеспечило ей политическую монополию и превратило Японию в однопартийное государство.\nВ последние годы в Японии наметились некоторые признаки изменения политического ландшафта: появились новые партии, которые бросили вызов доминирующему положению ЛДП. Однако пока неясно, приведут ли эти изменения к созданию более конкурентной и плюралистической политической системы в Японии, или же ЛДП продолжит удерживать свою власть."
 KOR_aging_popu: "Старение населения"
 KOR_aging_popu_desc: "\n\n\n\n\n£GFX_KOR_aging_popu_embed \n\n\n\n\n\n\nФеномен низкой рождаемости, начавшийся при администрации Чон Ду Хвана в 1983 году, остаётся для нас и сегодня серьёзной социальной проблемой. В эпоху индустриализации 1970-х годов чрезмерная рождаемость привела к принятию мер по ограничению рождаемости, что привело к снижению интереса к браку и деторождению. В результате Южная Корея вступила в эпоху стареющего общества."
 MZB_flag_of_the_kalashnikov: "Флаг автомата Калашникова"
 MZB_flag_of_the_kalashnikov_desc: "\n\n\n\n\n£GFX_MZB_flag_of_the_kalashnikov_embed \n\n\n\n\n\n\nНа флаге Мозамбика изображён автомат АК-47 со штыком, перекрещённый с мотыгой, что напоминает о борьбе страны за независимость и её приверженности обороне и прогрессу, отражая освобождение Мозамбика от португальского колониального господства в 1975 году. \n\nМотыга символизирует сельское хозяйство и развитие, а открытая книга — образование. Мозамбик — единственная страна, на флаге которой изображено современное огнестрельное оружие, что делает его отличительным символом революционного прошлого."
 MZB_central_african_railway_network: "Центральноафриканская железнодорожная сеть"
 MZB_central_african_railway_network_desc: "\n\n\n\n\n£GFX_MZB_central_african_railway_network_embed \n\n\n\n\n\n\nЦентральноафриканская железнодорожная сеть, проходящая через Мозамбик, является важнейшим транспортным звеном, соединяющим страны, не имеющие выхода к морю. Ключевые коридоры включают коридор Бейра, ведущий к порту Бейра, и коридор Накала, обеспечивающий доступ к глубоководному порту Накала. Эти железные дороги играют важную роль в региональной торговле, способствуя экспорту полезных ископаемых, сельскохозяйственной продукции и товаров."
 SAU_petro_dollar: "Нефтедоллар"
 SAU_prince_pmcs: "Частные Военные Компании"
 SAU_prince_pmcs_desc: "Многие принцы Саудовской Аравии с их щедрыми расходами нанимают тысячи частных военных компаний для защиты своих активов и для личной защиты."
