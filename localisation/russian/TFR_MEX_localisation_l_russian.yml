l_russian:
 #The Fire Rises: цепочка событий нарковойны в Мексике (портированная)
 mexico.1.t: "Рейд удался"
 mexico.1.d: "Спецназ ВМС по данным разведки штурмует скрытую лабораторию картеля Синалоа и без потерь захватывает несколько тонн фентанила и прекурсоров. На утренней пресс-конференции президент называет это «самой чистой победой этой войны с наркотиками»."
 mexico.1.a: "Продолжать давление"
 mexico.2.t: "Рейд провалился"
 mexico.2.d: "Спецназ попадает в засаду в горах Мичоакана, и вертолёты эвакуации вынуждены уйти. Следы утечки информации очевидны, а список погибших заставляет президентский дворец замолчать."
 mexico.2.a: "Крота необходимо найти"
 mexico.3.t: "Караван мигрантов достиг границы Гватемалы"
 mexico.3.d: "Тысячи мигрантов из Центральной Америки собираются на границе Гватемалы и движутся на север. Вашингтон требует, чтобы Мексика играла роль «безопасной третьей страны», а губернаторы северных штатов уже обсуждают собственные блокпосты."
 mexico.3.a: "Закрыть южную границу"
 mexico.3.b: "Предоставить гуманитарный транзит"
 mexico.4.t: "Офицеры вступают в бой с картелями"
 mexico.4.d: "Патруль армии несколько часов ведёт перестрелку с вооружёнными людьми в Тамаулипасе, тогда как местная полиция отсутствует. Впервые высшее командование публично признаёт, что ряд штатов больше не под контролем правительства."
 mexico.4.a: "Армия должна взять охрану порядка на себя"
 mexico.5.t: "Полиция задерживает американских беженцев"
 mexico.5.d: "По мере ухудшения ситуации в США множество американских граждан переходит границу на севере Мексики. Пограничная полиция задерживает сотни людей из-за неполных документов; лагеря переполнены, и Вашингтон с Мехико обмениваются обвинениями."
 mexico.5.a: "Оформлять по закону"
 mexico.6.t: "Синалоа начинает захват территории"
 mexico.6.d: "Картель Синалоа открыто устанавливает блокпосты в Нижней Калифорнии, Соноре, Чиуауа и Синалоа-Дуранго, заявляя, что защищает жителей от поборов властей. Федеральная полиция покидает регион."
 mexico.6.a: "У федерального правительства нет ответа"
 mexico.8.t: "Тьерра-Кальенте начинает захват территории"
 mexico.8.d: "Тьерра-Кальенте берёт под контроль порты и платные дороги в Халиско и Герреро-Оахаке, а местные политики появляются на её пресс-конференциях. Мехико может лишь наблюдать, как налоговые поступления утекают в другие руки."
 mexico.8.a: "Столица держится"
 mexico.9.t: "Тамаулипас начинает захват территории"
 mexico.9.d: "Картель Тамаулипаса завершает установление контроля над промышленным коридором в Нуэво-Леоне, Коауиле и Веракрусе. Транснациональные заводы начинают договариваться напрямую с вооружёнными группами, а не с правительством."
 mexico.9.a: "Промышленность нашла новых покровителей"
 mexico.10.t: "Другие регионы рушатся"
 mexico.10.d: "Гуанахуато, Чьяпас и Юкатан погружаются в анархию. Местные ополчения, отряды самообороны коренных народов и остатки полиции проводят собственные границы, а федеральный флаг во многих городах уже спущен."
 mexico.10.a: "Государство распадается"
 mexico.11.t: "Начинается война картелей"
 mexico.11.d: "Все три картеля одновременно объявляют войну федеральному правительству. Армейские части переходят на их сторону целыми подразделениями, полицейская система разваливается, а территория за пределами Мехико фактически больше не управляется. Это самый тёмный час со времён основания республики."
 mexico.11.a: "Страна вступает в состояние войны"
 mexico.12.t: "Война картелей окончена"
 mexico.12.d: "Годы боёв наконец позади. Федеральное правительство поднимает флаг над руинами, а комиссия по восстановлению берёт под контроль разрушенный северный промышленный пояс. Ценой стала память целого поколения."
 mexico.12.a: "Восстановить порядок"
 mexico.13.t: "Восстановление и выборы"
 mexico.13.d: "После отложенных на два года национальных выборов новая президент приносит присягу в Мехико. Её предвыборное обещание умещалось в одну фразу: вернуть страну её гражданам."
 mexico.13.a: "Пусть страна снова принадлежит своим гражданам"
