l_russian:
 ELS_right_populism_desc: "\n\n\n\n  £GFX_ELS_Ideology_bukele_model \n\n\n\n\n\n §Y«Модель Букеле»§! — это форма правления и политический подход, разработанный в Эль-Сальвадоре под руководством Найиба Букеле, который вступил в должность президента в 2019 году. Эта модель сочетает жесткую безопасностную политику, направленную на прямойfight с насилием и восстановление государственного контроля над территорией, с высокой концентрацией власти в исполнительной ветви, ограничением институциональных сдержек и противовесов, а также постоянным прямым общением с населением. Она приоритетизирует порядок, стабильность и эффективность в снижении насилия как основу национального развития. Одновременно она поддерживает сильную популярную поддержку, вызывая при этом ожесточенные споры относительно баланса между безопасностью, порядком и гражданскими свободами."
 NIC_left_nationalism_desc: "\n\n\n\n  £GFX_NIC_Ideology_sandinismo \n\n\n\n\n\n §YСандинизм§! — это никарагуанский политический течения, возникшее в ответ на иностранное господство и внутренние авторитарные режимы, такие как режим Сомозы, берущий за основу борьбу Августо С. Сандино за национальную суверенитет. Он был официально организован, когда его основатель Карлос Фонсека Амадор создал Национально-освободительный фронт Сандинистов (ФСЛН). Сандинизм следует за волной латиноамериканского революционного левоизма, родившегося с Кубинской революцией. Он сочетает идеи национальной эмансипации, социальной справедливости и народной организации, центральное место государства в экономике, образовании и здравоохранении, а также мобилизацию населения для достижения глубоких преобразований. Сандинизм утвердился как правительственная сила под лозунгом «Христианская, социалистическая и солидарная Никарагуа». Сегодня он возглавляется Даниэлем Ортегой, президентом Никарагуа с 2007 года"
 NIC_Sindrome_Necromorbido: "Некроморбидный синдром"
 NIC_Sindrome_Necromorbido_desc: "Поколения никарагуанцев жили под постоянной тенью насилия, сформированного диктатурой, революцией, политическим угнетением и экономической нестабильностью. От режима Сомозы до Сандинистской революции и последующих лет политического напряжения конфликт глубоко внедрился в политическую культуру и коллективную память страны. Со временем многие граждане привыкли к нестабильности и страху как к повторяющимся частям повседневной жизни. Никарагуанское телевидение также сыграло важную роль в укреплении этой культуры обезумевания. Новостные программы часто полагаются на жуткие изображения, отчеты о преступлениях и шокирующие заголовки, чтобы привлечь зрителей, превращая насилие в зрелище и развлечение. В результате сцены кровопролития, трагедии и политического конфликта стали нормализованными в общественной жизни, способствуя формированию общества, где шок постепенно теряет свое влияние, а насилие кажется тревожно рутинным."
 NIC_Senor_Gobierno: "Господин Правитель"
 NIC_Senor_Gobierno_desc: "Правительство Даниэля Ортеги сохраняет внешний вид демократии, одновременно ограничивая подлинную оппозицию. Независимые политические партии и диссиденты были ослаблены путем арестов, цензуры и изгнания, оставив в политической системе только контролируемые или ослабленные оппозиционные группы. В результате Никарагуа функционирует в тщательно управляемой политической среде, где выборы и институты формально существуют, но реальная политическая конкуренция остается крайне ограниченной. Критики утверждают, что эта система защищает власть Ортеги, сохраняя при этом демократический фасад."
 NIC_legacy_of_protests2: "Наследие протестов"
 NIC_legacy_of_protests2_desc: "В 2018 году протесты против пенсионных реформ быстро превратились в национальное восстание, которое раскрыло глубокие расколы в никарагуанском обществе. То, что началось как демонстрации, в основном возглавляемые студентами и пенсионерами, вскоре распространилось по всей стране, с заблокированными автомобильными дорогами, насильственными столкновениями между протестующими и силовыми структурами, а также растущими сообщениями о исчезновениях, произвольных арестах и политическом преследовании. Улицы Никарагуа превратились в сцены страха и сопротивления, в то время как правительство отвечало все возрастающим репрессией в попытке вернуть контроль. Два года спустя после начала кризиса страна казалась заперта в медленном и болезненном упадке, словно раненная ударом, который никогда не перестал кровоточить. Экономика ослабла, тысячи никарагуанцев бежали в изгнание, и доверие населения к институтам резко снизилось. Помимо самого политического конфликта, события 2018 года оставили за собой климат истощения и неопределенности, который продолжал формировать повседневную жизнь много лет после того, как баррикады исчезли с улиц."
 NIC_revolutionary_spirit2: "Революционный дух"
 NIC_revolutionary_spirit2_desc: "Победа сандинистов в 1979 году изменила национальную идентичность Никарагуа вокруг идеалов социализма, суверенитета и социальной справедливости. Для многих революция представляла собой освобождение от диктатуры и иностранного влияния. Однако революция также принесла экономическую нестабильность, гражданский конфликт и долгосрочную политическую поляризацию. Её наследие остается глубоко разделенным: одни помнят ее как символ надежды, другие — как начало десятилетий лишения и нестабильности."
 GUA_legado_caudillos_y_bananas: "Наследие каудиллов и бананов"
 GUA_legado_caudillos_y_bananas_desc: "В первой половине XX века United Fruit Company стала одной из самых мощных иностранных корпораций в Гватемале, контролируя сельскохозяйственные земли, железные дороги, порты и экспорт по всей стране. Её огромное экономическое влияние позволило иностранным бизнес-интересам формировать гватемальскую политику и углублять неравенство, особенно среди сельских и коренных народов. В 1954 году президент Хакобо Арбенц попытался провести земельные реформы, которые угрожали неиспользуемым землям, принадлежащим компании. Боязнь коммунистического влияния во время холодной войны и стремление защитить американские экономические интересы привели к тому, что ЦРУ поддержало переворот, который сверг Арбенца и установило правительство, ориентированное на военные круги. Переворот имел разрушительные долгосрочные последствия для Гватемалы. Он спровоцировал десятилетия военных диктатур, политического угнетения и жестокой гражданской войны, оставив глубокие социальные и этнические шрамы, особенно среди коренных общин. До сих пор Гватемала продолжает бороться с коррупцией, слабыми демократическими институтами, организованной преступностью, бедностью и недоверием к правительству. Многие историки утверждают, что нестабильность, созданная после поддерживаемого ЦРУ переворота, помогла сформировать многие из политических и социальных проблем, с которыми страна все еще сталкивается в современную эпоху."
 GUA_resistencia_indigena: "Коренное сопротивление"
 GUA_resistencia_indigena_desc: "Коренные общины в Гватемале сопротивлялись столетиям завоевания, дискриминации и политического угнетения, сохраняя свои языки, традиции и идентичность. Популяции майя столкнулись с лишениями земель, насилием и исключением, но продолжали защищать свою культуру и требовать признания и прав. Во время гражданской войны Гватемалы коренные общины понесли некоторые из самых тяжелых последствий насилия и преследования в стране. Несмотря на это, коренные движения выжили и остаются важной силой в современной Гватемале, символизируя стойкость, выживание культуры и продолжающуюся борьбу против неравенства и дискриминации."
 GUA_informalidad_laboral_agrabada: "Усугубленная трудовая неформальность"
 GUA_informalidad_laboral_agrabada_desc: "Большая часть населения Гватемалы выживает за счет неформальной трудовой деятельности и экономических операций, выходящих за рамки государственного надзора. Уличная торговля, незарегистрированные предприятия и наличная занятость доминируют в повседневной жизни миллионов граждан. Хотя эта неформальная система поддерживает многие семьи, она серьезно ограничивает сбор налогов и ослабляет способность правительства инвестировать в инфраструктуру, здравоохранение и образование."
 COS_la_suiza_centroamericana: "Центроамериканская Швейцария"
 COS_la_suiza_centroamericana_desc: "Коста-Рика создала уникальную репутацию в регионе благодаря своей демократической стабильности, сильным институтам и социальной модели, сосредоточенной на образовании и здравоохранении. Посреди постоянной турбулентности, которая исторически отличала большую часть Центральной Америки, страна представляет собой редкий символ мира, умеренности и политической преемственности. В то время как многие соседние страны борются с насилием, коррупцией или институциональной хрупкостью, Коста-Рика гордится тем, что является региональным маяком стабильности и надежды."
 COS_refugiados_nicaraguenses: "Никарагуанские беженцы"
 COS_refugiados_nicaraguenses_desc: "Кризис 2018 года в Никарагуа глубоко затронул не только Никарагуа itself, но и соседнюю Коста-Рику. Массовые волны никарагуанцев, бежавших от насилия, репрессий и экономической нестабильности, пересекали границу в поисках убежища и безопасности. Коста-Рика стала одним из основных направлений для перемещенных никарагуанцев благодаря своей относительной стабильности и сильным институтам. Однако растущий приток беженцев также породил социальные и политические напряжения в Коста-Рике. Националистические сектора все больше критикуют большое количество мигрантов, входящих в страну, утверждая, что государственные услуги, возможности трудоустройства и социальная стабильность находятся под давлением. Таким образом, беженческая кризис стала как гуманитарным вопросом, так и растущим источником внутренней политической дискуссии."
 COS_nacion_sin_ejercito: "Нация без армии"
 COS_nacion_sin_ejercito_desc: "С тех пор как в 1948 году была упразднена армия, Коста-Рика построила национальную идентичность, тесно связанную с миром, демократией и дипломатией. Ресурсы, ранее предназначенные для Вооруженных сил, были перенаправлены на образование, здравоохранение и социальное развитие, помог сформировать образ страны как одной из самых стабильных демократий в Латинской Америке. Одновременно отсутствие армии оставляет Коста-Рику зависимой от полицейских сил и международных альянсов для национальной обороны. В регионе, исторически отмеченном конфликтом, нестабильностью и организованной преступностью, некоторые критики утверждают, что страна остается уязвимой в мире, где военная мощь по-прежнему играет важную геополитическую роль."
 PAN_el_gran_cruce_de_las_americas: "Великое пересечение Америки"
 PAN_el_gran_cruce_de_las_americas_desc: "Панама занимает одну из самых стратегических географических позиций на Земле. Соединяя Северную и Южную Америку и будучи родиной Панамского канала, страна служит важной связью между Атлантическим и Тихим океанами. Эта позиция придает Панаме огромное экономическое и геополитическое значение, превращая ее в глобальный хаб для торговли, судоходства и финансов. Однако это же стратегическое преимущество также создает серьезные проблемы. Панама стала ключевым транзитным коридором для международной наркоторговли и нелегальной миграции, особенно через Дарьенов пролив. Наряду с процветанием и глобальной значимостью, эти давления порождают коррупцию, организованную преступность и социальную нестабильность, которые продолжают испытывать институты страны."
 PAN_nacion_desarmada: "Разоруженная нация"
 PAN_nacion_desarmada_desc: "После падения Мануэля Нориегы в 1990 году Панама официально упразднила свои Вооруженные силы. С тех пор национальная безопасность в основном опирается на полицейские институты и сотрудничество с иностранными союзниками, особенно Соединенными Штатами. Это решение помогло стране отдалиться от своего авторитарного военного прошлого и укрепить более цивильный политический режим. Однако отсутствие постоянной армии также оставляет Панаму относительно уязвимой перед внешними угрозами и зависимой от международных партнерств для более широкой безопасности. В стратегически важной стране эта уязвимость остается постоянной темой в политических и безопасностных обсуждениях."
 BLZ_protectorado_britanico: "Британское протекторат"
 BLZ_protectorado_britanico_desc: "Белиз был ранее британской колонией Британских Гондурас, и даже после получения независимости в 1981 году он сохранил тесные связи с Великобританией. Страна все еще использует британскую парламентскую систему и остается членом Содружества, с британским монархом в роли главы государства. Это колониальное наследие помогло Белизу сохранить относительно стабильные демократические институты по сравнению с большей частью Центральной Америки. Однако британское влияние также продолжает формировать политику, идентичность и зависимость страны от внешней поддержки."
 ELS_doctrina_bukele: "Доктрина Букеле"
 ELS_doctrina_bukele_desc: "Жесткая позиция Найиба Букеле по отношению к бандам и организованной преступности глубоко трансформировала Эль-Сальвадор. На протяжении десятилетий бандитское насилие формировало повседневную жизнь страны: вымогательство, убийства и территориальный контроль превратили страх в национальную рутину. Используя это коллективное истощение, Букеле построил стратегию на агрессивном использовании силовых структур и дискурсе, сосредоточенном на власти и порядке. Для многих сальвадорцев он представляет собой лидера, который наконец столкнулся с проблемой, с которой предыдущие правительства не справились. Однако подход Букеле также вызвал растущую обеспокоенность среди критиков и международных наблюдателей. В то время как многие граждане празднуют снижение насилия, другие предупреждают, что концентрация власти и ослабление демократических институтов могут создать долгосрочные последствия для страны. Теперь Эль-Сальвадор стоит между двумя реальностями: одной, где безопасность значительно улучшилась, и другой, где демократические свободы становятся все более хрупкими."
 ELS_estado_de_exepcion: "Состояние исключения"
 ELS_estado_de_exepcion_desc: "Для борьбы с бандами правительство Букеле приостановило несколько конституционных гарантий и развернуло армию по всей стране. Массовые аресты и более жесткое полицейское преследование значительно снизили активность банд и улучшили безопасность во многих районах. Однако эта политика также вызвала критику со стороны международных организаций из-за обвинений в произвольных задержаниях и нарушениях прав человека. Хотя преступность снизилась, обеспокоенность по поводу демократии и личных свобод возросла."
 ELS_rayo_de_esperanza: "Луч надежды"
 ELS_rayo_de_esperanza_desc: "Подъем Букеле к власти дал много сальвадорцам надежду после лет жизни под постоянным страхом и насилием. Общины, ранее контролируемые бандами, начали испытывать чувство безопасности, которого не было десятилетиями. Для многих граждан Букеле представляет собой возможность восстановить нормальную жизнь и вернуть общественные пространства. Его популярность в значительной степени обусловлена этим чувством облегчения и возобновленной надежды на более безопасное будущее."
 HON_legado_de_manuel_zelaya: "Наследие Мануэля Зелая"
 HON_legado_de_manuel_zelaya_desc: "Снятие Мануэля Зелая в 2009 году стало одним из самых определяющих моментов в современной гондурасской политике. Его свержение разделило страну политически и социально, создав напряжения, которые до сих пор влияют на выборы и общественное мнение. Поддержатели видят Зелая как символ социальной реформы, экономической справедливости и большей независимости от иностранного влияния, а критики считают, что его президентство угрожало демократической стабильности и рисковало вывести Гондурас на путь авторитарности"
 HON_violencia_endemica: "Эндемическое насилие"
 HON_violencia_endemica_desc: "Гондурас на протяжении многих лет боролся с чрезвычайно высокими показателями убийств и широкой небезопасностью. Насилие, связанное с бедностью, бандами, наркоторговлей и слабыми институтами, влияет на повседневную жизнь в большей части страны. Страх и нестабильность стали глубоко укоренившимися социальными проблемами, подрывающими доверие населения к правительству и толкающими многих граждан покидать страну в поисках безопасности."
 HON_juventud_sin_futuro: "Молодежь без будущего"
 HON_juventud_sin_futuro_desc: "Отсутствие экономических возможностей и стабильной занятости вынуждает тысячи гондурасской молодежи принимать трудные решения. Многие пытаются эмигрировать за границу, особенно в Соединенные Штаты, в то время как другие становятся уязвимыми для вербовки бандами и преступными организациями. Плохое образование, безработица и социальное неравенство продолжают подпитывать цикл миграции, насилия и безысходности среди молодых поколений."
