 CEN_cartel_presence_severe: "Тяжелое присутствие картелей"
 DANIEL_ORTEGA_DESC: "§Y«Хосе Даниэль Ортега Саведра»§! родился в Ла-Либертад, Никарагуа, 11 ноября 1945 года. Как молодой активист, он присоединился к сандинистскому движению против диктатуры Сомозы и стал одним из лидеров революции 1979 года. Ортега впервые занимал пост президента с 1985 по 1990 годы в период гражданского конфликта и экономических трудностей, после чего вернулся к власти в 2007 году. С тех пор он укрепил контроль над политическими институтами Никарагуа и остается доминирующей политической фигурой страны. Поддержатели видят его как защитника сандинистского наследия и национальной суверенитета, а критики обвиняют его в подрыве демократии и превращении Никарагуа в все более авторитарное государство."
 NAYIB_BUKELE_DESC: "§Y«Найиб Армандо Букеле Ортес»§! родился в Сан-Сальвадоре 24 июля 1981 года. После успешной карьеры в бизнесе и рекламе он вошел в политику через ФМЛН и занимал пост мэра Нью-Кускатлана, а затем Сан-Сальвадора. После исключения из партии в 2017 году он позиционировал себя как антиэстablishmentный кандидат и выиграл президентские выборы в 2019 году, закончив десятилетия господства традиционных партий Эль-Сальвадора. Его администрация стала известна агрессивным разгромом банда, что резко снизило преступность, но также вызвало обеспокоенность по поводу демократических институтов и гражданских свобод. Сегодня Букеле остается одним из самых популярных и спорных лидеров Латинской Америки, восхищаемый поддерживающими за восстановление безопасности и критикуемый оппонентами за концентрацию власти."