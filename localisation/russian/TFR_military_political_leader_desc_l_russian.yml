 TFR_POLITICAL_LEADER_DESC_FRA_PIERRE_DE_VILLIERS:0 "Кадровый офицер французской армии Пьер де Вилье занимал пост начальника Генерального штаба вооружённых сил Франции с 2014 года до отставки в 2017 году на фоне спора о военных расходах."
 TFR_POLITICAL_LEADER_DESC_FRA_BRUNO_LE_RAY:0 "Французский армейский генерал Бруно Ле Рей занимал должность военного губернатора Парижа с 2015 по 2018 год."
 TFR_POLITICAL_LEADER_DESC_ITA_CLAUDIO_GRAZIANO:0 "Итальянский генерал армии Клаудио Грациано занимал пост начальника штаба обороны, а позднее возглавлял Военный комитет Европейского союза."
 TFR_POLITICAL_LEADER_DESC_RAJ_ANIL_CHAUHAN:0 "Индийский генерал армии Анил Чаухан стал начальником штаба обороны в 2022 году после командования Восточным командованием сухопутных войск."
 TFR_POLITICAL_LEADER_DESC_SPR_TEODORO_E_LOPEZ_CALDERON:0 "Адмирал ВМС Испании Теодоро Лопес Кальдерон занимал должность начальника штаба обороны начиная с 2021 года."
 TFR_POLITICAL_LEADER_DESC_TUR_HULUSI_AKAR:0 "Турецкий армейский генерал Хулуси Акар был начальником Генерального штаба, а затем министром национальной обороны."
