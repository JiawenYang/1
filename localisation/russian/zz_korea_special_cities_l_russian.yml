﻿l_russian:
 # Особые административные единицы Корейского полуострова (перенесено из TFR Korea Plus, ID штатов адаптированы под Millennium Dawn)
 KOR_seoul_city: "Сеул — особый город"
 KOR_seoul_city_desc: "\n§9Сердцебиение шестисотлетней столицы по-прежнему бьётся в такт пульсу реки Хан: черепица Кёнбоккуна и каменная дорога Кванхвамуна тихо глядят друг на друга сквозь стеклянные фасады небоскрёбов. В старых переулках к северу от реки огни башни Нансан не гаснут всю ночь, а под неоном Каннама улицы частных академий уже тесны в пять часов утра — этот город, за полвека выковавший руины войны в мировую метрополию, вписал «быстрее» в дыхание каждого и «чудо на реке Хан» — в учебники эпохи.\n\nОднако за сияющими цифрами — скрупулёзно расписанный график жизни и душащие цены на жильё, и память старых кварталов, тихо исчезающая под рёвом бульдозеров. Каменные ступени площади Кванхвамун хранили кличи студенческой революции и океан свечей; ныне гул демократии давно растворился в ежедневном потоке машин. Когда первый поезд метро переходит железный мост через Хан, мегаполис двадцати миллионов вновь начинает погоню нового дня.§!\n\n§HРека Хан течёт не останавливаясь — шестисотлетняя столица между руинами и новыми башнями вечно гонится за горизонтом грядущего дня.§!"
 KOR_incheon_city: "Инчхон — город-метрополия"
 KOR_incheon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9Когда красный закат пропитывает отмели, укутанные густым морским туманом, город наконец откладывает в сторону суету дня и делает глубокий, суровый вдох. За романтикой открытого порта, первым распахнувшего ворота незнакомым чужеземцам и принявшего волны модернизации, стоят боль вторжений и пот ожесточённой индустриализации, вплавленные в каждый красный кирпич.\n\nКогда намытые из моря стеклянные небоскрёбы щеголяют ослепительным будущим, старые переулки старого города, скрытые в их тени, погружаются ещё глубже в отчуждение, и среди непрекращающегося рёва бесчисленных грузовиков и самолётов город терпит одиночество станции, с которой всегда кто-то уезжает. Это место, где ослепительный взлёт и силуэт упадка опасно переплетаются, — земля, где желания развития и вздохи оставшегося текут вперемешку с шумом волн.§!\n\n§3Город вечных границ, где восторг уезжающих и печаль оставшихся существуют вместе.§!"
 KOR_busan_city: "Пусан — город-метрополия"
 KOR_busan_city_desc: "\n§9Маяк Ёндо взирает на гавань, где наперегонки несутся тысячи парусов, а предрассветные выкрики рынка Чагальчи пробуждают город, зажатый между горами и морем. Будучи временной столицей, приютившей миллион изгнанных войной душ, Пусан превратил ностальгию в тёплые жёлтые фонари горных дорог и выковал волю к выживанию в не знающих покоя кранах контейнерных терминалов. Пляж Хэунде и цепь огней моста Кванган — его визитная карточка, но по-настоящему держат этот город огрубевшие руки на рыбном рынке и искры сварки в доках.\n\nЭто город, согретый диалектом и дружбой; его прямой нрав прост, как морской ветер. Каждой осенью звёзды международного кинофестиваля освещают Хэунде, но пусанцы больше верят мудрости торга на рынке, чем красным дорожкам. Горы и море сжали город в длинную узкую легенду: каждый день огромные суда дают гудок и уходят, неся его имя в мир.§!\n\n§LНепокорный город между горами и морем, превративший тоску войны в удаль, рождённую лицом к океану.§!"
 KOR_ulsan_city: "Ульсан — город-метрополия"
 KOR_ulsan_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_ulsan_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Ветер, пробегающий по бамбуковой роще реки Тхэхва, старается смыть позор прошлого, но рассвет города по-прежнему будят тяжёлые удары молотов гигантской верфи и гул машин промышленного комплекса. Синее море, где когда-то скользила легендарная китиха, захвачено железными левиафанами, и легенда промышленной столицы, где «даже собака на бегу держит в зубах десятитысячную вонную купюру», зыбко покоится на усталости рабочих в пропитанных мазутом спецовках.\n\nЗа ослепительными огнями нефтехимического комбината, не гаснущими всю ночь, таится тёмная сторона структурной нестабильности этого «города корпораций», чья судьба целиком отдана на волю грохота ожесточённых трудовых конфликтов и взлётов и падений конкретной чеболь-компании. Это место, заплатившее за рост небом и морем, ныне погружено в глубокие раздумья, глядя на ржавеющий кран на затухающем конце стрелы под приглушённый рёв затупляющегося двигателя обрабатывающей промышленности.§!\n\n§gГигантская железная крепость, воздвигнутая на могиле кита, империя противоречий, чей факел изобилия сжигает дыхание завтрашнего дня.§!"
 KOR_daegu_city: "Тэгу — город-метрополия"
 KOR_daegu_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Обширная котловина, окружённая горой Пхальгонсан, словно ширмой, до сих пор хранит славу модернизации, что была жарче зноя разгаря лета, но теперь уже не может выпустить остывший жар наружу и лишь бродит внутри. Могучий рёв ткацких станков, что когда-то ткали ткани для всей страны, и романтика поспевающих яблок исчезли на страницах времени, и лишь тень десятилетиями стоящих на месте экономических показателей тяжким грузом давит на город.\n\nПрочная крепость, известная как «сердце консерватизма», — это и щит от внешних бурь, и высокая стена, отгораживающая от себя самой, а за той стеной, через которую не смог перешагнуть даже дыхание перемен, — место, оставленное стремительно стареющей молодёжью. Зажатая в упрямстве и исключительности, столь же несгибаемых, как её замкнутый рельеф, это земля любви и ненависти, со болью терпящая сегодняшнее падение на гордости блестящего прошлого.§!\n\n§7Моя благоуханная родина, наполненная ароматом кампсиса\nУлица восхода с видом на гору Пхальгонсан\nТы и я мечтали здесь\nЯ видел красивый и нежный сон\nУлица надежды, по которой мы шли вместе\nУлица любви, где цветёт и увядает кампсис\nТэгу — моя родина, моя дорогая родина§!"
 KOR_daejeon_city: "Тэджон — город-метрополия"
 KOR_daejeon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daejeon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Арочный пролёт моста Экспо вздымается над тихими волнами Капчхона, словно рисуя будущее, однако под ослепительными огнями этого научного города остаётся лишь холодный озноб разума вместо щедрого гостеприимства времён, когда он назывался «Ханбат». Это был транспортный узел, где пересекались железнодорожные пути страны и собирались бесчисленные чужие следы, но сама эта дорога породила одинокую судьбу транзитной станции, не позволив людям назвать её домом.\n\nЗнание, запертое за высокими стенами научного парка, дрейфует одиноким островом, не в силах слиться с упадком старого города, а под самоиронией шутки про «скучный город» скрываются укоренившаяся городская скука и монотонность безликих серых тонов, лишённая всякой самобытности. Это место, где гордость быть сердцем Республики Корея странным образом уживается с чувством чужака, которому некуда идти, — серый плановый город, настолько образцово упорядоченный, что его обдувает ветер пустоты.§!\n\n§2Бесцветный пересадочный узел в ослепительном одеянии науки — все дороги ведут сюда, но никто здесь по-настоящему не остаётся.§!"
 KOR_sejong_special_city: "Седжон — особый самоуправляющийся город"
 KOR_sejong_special_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_sejong_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9Когда над рекой Кым рассеивается туман, взору предстаёт холодное совершенство огромного планового города, скроенного линейкой и циркулем. Мягкие грунтовые дороги уезда Ёнги, когда-то цветшие персиками, навеки погребены под асфальтом и бетоном, и величие правительственных зданий, возведённых во имя великой цели сбалансированного развития, напротив, грубо стёрло давнюю память этой земли.\n\nНочью лишь огни башни правительственного комплекса дрейфуют одиноким островом, а улицы, оставшиеся после отъезда незнакомцев, садящихся на автобусы в Сеул, бьются поло, как искусственно имплантированное сердце, которое не может биться правильно. В лесу одинаковых многоэтажек задыхается многообразие, и, хотя город подражает Сеулу, Сеулом он ещё не стал: лишь серая логика бездушной администрации правит им, делая его незавершённой столицей.§!\n\n§7Голый рукотворный рай, высеченный из прямых линий, проведённых линейкой на карте, — срезавший даже человеческое дыхание и старую память.§!"
 KOR_gwangju_city: "Кванджу — город-метрополия"
 KOR_gwangju_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Когда мягкий хребет горы Мудунсан обнимает город, как материнские руки, багровые воспоминания мая, верные имени «Битголь», пылают на асфальте каждой улицы. Благородная история демократии, завоёванной кровью и слезами, стала душой города, но по парадоксу священная доска «святыни демократии» также стала тяжёлой цепью, приковавшей город к прошлому.\n\nГород, который после долгой дискриминации и политической изоляции так и не смог в полной мере вкусить плоды индустриализации, прячет тень упадка за гордостью своим блистательным художественным наследием, а страстные кличи, некогда провозглашавшие справедливость, теперь сбились с пути и разбились о суровую реальность выживания. Это место, которое первым сожгло тьму своей эпохи, но само оказалось вынуждено остаться на обочине прогресса, — и поныне земля, утешающая израненные души между гордой историей борьбы и замёрзшей реальностью.§!\n\n§tНе оставляя любви, не оставляя славы, не оставляя имени\nКровавая клятва идти вперёд всю жизнь\nТоварищи ушли, лишь знамя реет\nНе дрогнем, пока не взойдёт новое солнце§!"
 KOR_jeju_special_self_governing_province: "Чеджу — особая самоуправляющаяся провинция"
 KOR_jeju_special_self_governing_province_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_jeju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9Когда яростные волны бьются в каждую расщелину чёрного базальта, а жёлтые цветы рапса цветут в щедрых объятиях Халласана, этот остров сияет, словно земной рай, хранящий тайну первозданности. Однако скорбный вопль трагедии 3 апреля, вложенный в каждую каплю красной камелии, всё ещё погребён глубоко в ореумах, и внешне умиротворённый пейзаж порой становится леденящим парадоксом, ранящим сердце.\n\nРади романтики и «исцеления» жителей материка лес Котджаваль и береговая линия безжалостно изрыты и стонут под тяжестью безрассудной застройки, а переполняющие мусор и сточные воды медленно душат некогда чистое голубое дыхание моря. Прибрежная дорога, захваченная капиталом, заполнена ослепительными «модными местами», тогда как коренные жители, потерявшие дома, оттеснены на обочину, и под мишурой иллюзии чужбины остров страдает, теряя собственный язык и дух.§!\n\n§OКровавая трагическая история и раны жадной застройки, нарочно укрытые прекрасным пейзажем, — шаткий дуэт рая.§!"
 PRK_pyongyang_city: "Пхеньян — особый город"
 PRK_pyongyang_city_desc: "\n§9Пхеньян, столица революции, — сердце великой Чучхе-Кореи и родина в сердцах всего нашего народа. Это несокрушимая крепость, которую Великий Вождь товарищ Ким Ир Сен освободил из-под гнёта японского империализма и которую Великий Полководец товарищ Ким Чен Ир твёрдо защищал как драгоценный меч революции Сонгун.\n\nСегодняшний Пхеньян под мудрым руководством уважаемого Высшего Руководителя товарища Ким Чен Ына продолжает совершать рывки развития и преображается в социалистический идеальный край, восхищающий мир. Вознесённые на холме Мансудэ бронзовые статуи Великого Вождя и Великого Полководца стали маяком непоколебимой верности десятков миллионов военных и гражданских, а бессмертный факел, пылающий на башне идей Чучхе, освещает путь к победе дела чучхейской революции во всём мире.\n\nЗдесь, в Пхеньяне, наш народ Ким Ир Сена крепко сплочён вокруг Партии и силой единства сердец устремляется к будущему процветающей родины§!\n\n§RДаже отдавая себя снова и снова, этому сердцу нет предела — Пхеньян мой дорогой, я люблю тебя…§!"
 # Вечные вожди (Ким Ир Сен / Ким Чен Ир)
 NKO_kim_il_sung_eternal_leader: "Вечный Вождь"
 NKO_kim_il_sung_eternal_leader_desc: "§AВеликий Вождь:§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_il_sung_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§LВеликий Вождь родился 15 апреля 1912 года (1-й год Чучхе) в патриотической семье в Пхеньяне — революционной столице, где трагедия национальных бедствий сплелась наиболее тяжело в новейшей истории Кореи. Его отец Ким Хён Джик, говоря о том, что следует лелеять великие устремления, воспитал в Великом Вожде любовь к родине.\n\n25 апреля 1932 года (21-й год Чучхе) Великий Вождь организовал Антияпонский народный партизанский отряд, а в 1934 году (23-й год Чучхе) расширил и преобразовал его в Корейскую народно-революционную армию, развернув ожесточённую антияпонскую революционную борьбу ради полного освобождения родины из-под варварского колониального господства японских захватчиков, установленного на Корейском полуострове.\n\nПосле двадцати весен антияпонской революционной борьбы Великий Вождь даровал Корейскому полуострову полное освобождение от японского колониального господства. Заложив прочный фундамент строительства самостоятельного независимого государства во многих сферах, 10 октября 1945 года (34-й год Чучхе) он основал Трудовую партию Кореи — материнскую партию нашего народа, а 9 сентября 1948 года (37-й год Чучхе) впервые в истории создал Корейскую Народно-Демократическую Республику — великую родину всего корейского народа.\n\n25 июня 1950 года (39-й год Чучхе), когда американские империалисты, угрожая самостоятельности нашей Республики, развязали полномасштабное вооружённое вторжение, Великий Вождь немедленно перешёл в контрнаступление, выдвинув разнообразные оперативные принципы, созданные в годы антияпонской революционной борьбы, и разом разгромил врага. Эффективно отразив полномасштабное наступление американских империалистов, Великий Вождь привёл великую Отечественную освободительную войну к победе.§!\n\n§H«Великий Вождь и Великий Полководец навсегда останутся с нашим народом как вечный символ Чучхе-Кореи, и великие революционные деяния, совершённые Вождём и Полководцем, будут нетленны вместе с историей».\n- Уважаемый Высший Руководитель§!"
 NKO_kim_jong_il_eternal_leader: "Вечный Руководитель"
 NKO_kim_jong_il_eternal_leader_desc: "§AВеликий Полководец:§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_jong_il_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§LВеликий Руководитель, сын Великого Вождя Ким Ир Сена и антияпонской героини Ким Чен Сук, родился 16 февраля 1942 года (31-й год Чучхе) в тайном лагере на горе Пэктусан, когда велась вооружённая борьба против Японии. С начала работы в Центральном Комитете Трудовой партии Кореи 19 июня 53-го года Чучхе (1964) Великий Полководец свершил перед эпохой и историей бессмертные деяния.\n\n25 августа 1960 года (49-й год Чучхе) Великий Руководитель лично инспектировал 105-ю гвардейскую Сеульскую танковую дивизию имени Рю Кён Су Корейской народной армии, прилагая величайшие усилия к укреплению народной армии, силой народной армии мощно продвигая дела революции и строительства, сделал первый шаг политики Сонгун и всесторонне укрепил самостоятельную и модернизированную оборонную промышленность.\n\nВеликий Руководитель официально провозгласил великую революционную идею Чучхе, созданную Великим Вождём, кимирсенизмом, возвеличил её как вечное руководящее идеологическое знамя партии и государства и выдвинул кимирсенизацию всего общества высшей программой партии.\n\nВысоко неся завещание Великого Вождя о воссоединении родины, он установил три хартии воссоединения родины, содействовал Совместной декларации 15 июня и Декларации 4 октября между Севером и Югом Корейского полуострова и под лозунгом «Мы — одна нация» открыл новую эпоху движения за самостоятельное воссоединение, в котором вся наша нация сплочённо движется вперёд.§!\n\n§H«Великий Вождь и Великий Полководец навсегда останутся с нашим народом как вечный символ Чучхе-Кореи, и великие революционные деяния, совершённые Вождём и Полководцем, будут нетленны вместе с историей».\n- Уважаемый Высший Руководитель§!"
