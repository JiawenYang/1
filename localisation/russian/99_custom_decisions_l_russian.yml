 c5m_decision:0 "Создать дизайн C-5M Super Galaxy"
 c5m_decision_desc:0 "C-5M Super Galaxy - самый мощный стратегический транспортный самолет в мире. Он может перевозить до 129 тонн груза, включая два танка M1 Abrams, и имеет дальность полета более 5500 миль с грузом в 120000 фунтов."
 f15ex_decision:0 "Создать дизайн F-15EX Eagle II"
 f15ex_decision_desc:0 "F-15EX Eagle II - продвинутая модификация F-15 Eagle. Он имеет улучшенную авионику с радаром AN/APG-82, увеличенную вместимость по вооружению более 29000 фунтов на 23 узлах подвески, и может нести до 12 ракет AMRAAM."
 b21_decision:0 "Создать дизайн B-21 Raider"
 b21_decision_desc:0 "B-21 Raider - стратегический бомбардировщик нового поколения, разработанный Northrop Grumman. Он имеет передовую стелс-технологию, возможности дальнего удара и разработан для проникновения через современные системы ПВО."
 rq4_decision:0 "Создать дизайн RQ-4 Global Hawk"
 rq4_decision_desc:0 "RQ-4 Global Hawk - разведывательный беспилотный летательный аппарат высокой высоты и длительного действия. Он разработан для разведывательных миссий на большой высоте."
 mq9_decision:0 "Создать дизайн MQ-9 Reaper"
 mq9_decision_desc:0 "MQ-9 Reaper - ударный беспилотный летательный аппарат средней высоты и длительного действия. Он разработан для точных ударов и разведывательных миссий."
 ac130j_decision:0 "Создать дизайн AC-130J Ghostrider"
 ac130j_decision_desc:0 "AC-130J Ghostrider - модернизированный самолет огневой поддержки. Он оснащен передовой авионикой, управляемыми боеприпасами и 30-мм пушкой для поддержки с воздуха на малых высотах."
 e7_decision:0 "Создать дизайн E-7 Wedgetail"
 e7_decision_desc:0 "E-7 Wedgetail - современный самолет раннего предупреждения и управления. Он оснащен многофункциональной активной электронно-сканируемой решеткой от Northrop Grumman для управления воздушным боем и командования."
 j10a_decision:0 "Создать дизайн Chengdu J-10A"
 j10a_decision_desc:0 "Chengdu J-10A - модификация истребителя J-10. Он имеет улучшенную авионику и боевые возможности по сравнению с исходным J-10."
 j10c_decision:0 "Создать дизайн Chengdu J-10C"
 j10c_decision_desc:0 "Chengdu J-10C - продвинутая модификация истребителя J-10. Он оснащен АЭСА радаром, улучшенной авионикой и усиленными боевыми возможностями, что делает его одним из самых способных истребителей четвертого поколения Китая."
 j11b_decision:0 "Создать дизайн Shenyang J-11B/BS"
 j11b_decision_desc:0 "Shenyang J-11B/BS - китайская модификация истребителя Su-27. Он оснащен китайской авионикой, двигателями и системами вооружения, обеспечивающими повышенную производительность и надежность."
 j15_decision:0 "Создать дизайн Shenyang J-15"
 j15_decision_desc:0 "Shenyang J-15 - корабельный истребитель, основанный на Su-33. Это первый корабельный истребитель Китая, разработанный для операций с авианосцев Liaoning и Shandong."
 j15t_decision:0 "Создать дизайн Shenyang J-15T"
 j15t_decision_desc:0 "Shenyang J-15T - улучшенная катапультная модификация J-15. Он имеет усиленную конструкцию и шасси для катапультных операций с авианосцев типа 003 Китая."
 j15d_decision:0 "Создать дизайн Shenyang J-15D"
 j15d_decision_desc:0 "Shenyang J-15D - вариант самолета радиоэлектронной борьбы J-15. Он оснащен радиоэлектронными подлетами и системами, обеспечивающими дальнее помехо создание и электронные атаки."
 j16_decision:0 "Создать дизайн Shenyang J-16"
 j16_decision_desc:0 "Shenyang J-16 - тяжелый многоцелевой истребитель, основанный на Su-30MKK. Он оснащен передовой авионикой, АЭСА радаром и может нести широкий спектр вооружения воздух-воздух и воздух-земля."
 j16d_decision:0 "Создать дизайн Shenyang J-16D"
 j16d_decision_desc:0 "Shenyang J-16D - вариант радиоэлектронной борьбы J-16. Он оснащен радиоэлектронными подлетами, системами помехо создания радаров и противорадиационными ракетами."
 j20_decision:0 "Создать дизайн Chengdu J-20A"
 j20_decision_desc:0 "Chengdu J-20A - первый пятого поколения стелс-истребитель Китая. Он имеет передовую стелс-технологию, сверхзвуковую крейсерскую способность и сложную авионику."
 j20b_decision:0 "Создать дизайн Chengdu J-20B"
 j20b_decision_desc:0 "Chengdu J-20B - улучшенная модификация J-20A. Он оснащен более передовой авионикой и системами вооружения, обеспечивающими повышенную производительность и боевые возможности."
 j20s_decision:0 "Создать дизайн Chengdu J-20S"
 j20s_decision_desc:0 "Chengdu J-20S - двухместная модификация J-20. Он может использоваться для обучения, управления и контроля беспилотников, а также для других миссий."
 j35_decision:0 "Создать дизайн Shenyang J-35"
 j35_decision_desc:0 "Shenyang J-35 - первый пятого поколения корабельный стелс-истребитель Китая. Он имеет стелс-технологию, передовую авионику и разработан для операций с китайских авианосцев."
 j36_decision:0 "Создать дизайн Chengdu J-36"
 j36_decision_desc:0 "Chengdu J-36 - истребитель нового поколения Китая. Он имеет передовую стелс-технологию и многоцелевые боевые возможности."
 y20_decision:0 "Создать дизайн Xian Y-20"
 y20_decision_desc:0 "Xian Y-20 - первый отечественный стратегический транспортный самолет Китая. Он имеет грузоподъемность более 66 тонн и может перевозить крупное оборудование, включая танки и вертолеты."
 y9_decision:0 "Создать дизайн Xian Y-9"
 y9_decision_desc:0 "Xian Y-9 - средний транспортный самолет, основанный на Y-8. Он имеет улучшенную производительность, дальность полета и грузоподъемность по сравнению с его предшественником."
 h6k_decision:0 "Создать дизайн Xian H-6K"
 h6k_decision_desc:0 "Xian H-6K - улучшенная модификация бомбардировщика H-6. Он оснащен современной авионикой, увеличенной дальностью полета и способностью нести дальние крылатые ракеты."
 h6n_decision:0 "Создать дизайн Xian H-6N"
 h6n_decision_desc:0 "Xian H-6N - дальняя стратегическая модификация бомбардировщика H-6. Он имеет увеличенную дальность полета и может нести баллистические ракеты, запускаемые с самолета."
 h6g_decision:0 "Создать дизайн Xian H-6G"
 h6g_decision_desc:0 "Xian H-6G - морской патрульный вариант бомбардировщика H-6 Китая. На основе H-6D, он оснащен противокорабельными ракетами и передовой авионикой для морских разведывательных и ударных миссий."
 h6j_decision:0 "Создать дизайн Xian H-6J"
 h6j_decision_desc:0 "Xian H-6J - морская ударная платформа военно-морской авиации Китая. На основе H-6G, он имеет возможность дозаправки в воздухе и усиленные возможности дальнего противокорабельного удара."
 kj2000_decision:0 "Создать дизайн Xian KJ-2000"
 kj2000_decision_desc:0 "Xian KJ-2000 - первый самолет раннего предупреждения и управления (AWACS) Китая. Он основан на фюзеляже Il-76 и оснащен системой фазированной решетки."
 kj500_decision:0 "Создать дизайн Xian KJ-500"
 kj500_decision_desc:0 "Xian KJ-500 - средний самолет AWACS, основанный на фюзеляже Y-9. Он оснащен отечественной активной фазированной решеткой."
 kj600_decision:0 "Создать дизайн Xian KJ-600"
 kj600_decision_desc:0 "Xian KJ-600 - первый корабельный самолет AWACS Китая. Он разработан для операций с китайских авианосцев, обеспечивая возможности раннего предупреждения и управления."
 wingloong1_decision:0 "Создать дизайн Chengdu Wing Loong I"
 wingloong1_decision_desc:0 "Chengdu Wing Loong I - беспилотный летательный аппарат средней высоты и длительного полета. Он разработан для разведывательных и точных ударных миссий."
 wingloong2_decision:0 "Создать дизайн Chengdu Wing Loong II"
 wingloong2_decision_desc:0 "Chengdu Wing Loong II - улучшенная модификация Wing Loong I. Он имеет увеличенную грузоподъемность, большую продолжительность полета и усиленную авионику."
 rainbow4_decision:0 "Создать дизайн CH Rainbow-4"
 rainbow4_decision_desc:0 "CH Rainbow-4 - беспилотный летательный аппарат средней высоты и длительного полета, разработанный China Aerospace Science and Technology Corporation. Он разработан для разведывательных и ударных миссий."
 rainbow5_decision:0 "Создать дизайн CH Rainbow-5"
 rainbow5_decision_desc:0 "CH Rainbow-5 - более крупная и более способная модификация серии беспилотных аппаратов Rainbow. Он имеет значительно увеличенную грузоподъемность и продолжительность полета."
 attack11_decision:0 "Создать дизайн CAIG GJ-11"
 attack11_decision_desc:0 "CAIG GJ-11 - стелс-беспилотный боевой летательный аппарат. Он имеет конструкцию в форме летающего крыла и разработан для точных ударных миссий."
 wz7_decision:0 "Создать дизайн WZ-7"
 wz7_decision_desc:0 "WZ-7 - разведывательный беспилотный аппарат высокой высоты и длительного полета. Он разработан для стратегических разведывательных миссий на высоких высотах."
 z10_decision:0 "Создать дизайн CAIC Z-10"
 z10_decision_desc:0 "CAIC Z-10 - первый специализированный ударный вертолет Китая. Он оснащен передовой авионикой, противотанковыми ракетами и ракетами воздух-воздух."
 su35_decision:0 "Создать дизайн Su-35 Flanker-E"
 su35_decision_desc:0 "Su-35 Flanker-E - продвинутый истребитель четвертого поколения России. Он оснащен передовой авионикой, двигателями с векторной тягой и мощными системами вооружения."
 su57_decision:0 "Создать дизайн Su-57 Felon"
 su57_decision_desc:0 "Su-57 Felon - первый пятого поколения стелс-истребитель России. Он имеет передовую стелс-технологию, сверхзвуковую крейсерскую способность и сложную авионику."
 mig35_decision:0 "Создать дизайн MiG-35 Fulcrum-F"
 mig35_decision_desc:0 "MiG-35 Fulcrum-F - продвинутый истребитель четвертого поколения России. Он оснащен передовой авионикой и системами вооружения."
 su25sm3_decision:0 "Создать дизайн Su-25SM3"
 su25sm3_decision_desc:0 "Su-25SM3 - модернизированная модификация Su-25. Он оснащен передовой авионикой и системами вооружения, улучшая его боевые возможности."
 su34m_decision:0 "Создать дизайн Su-34M"
 su34m_decision_desc:0 "Su-34M - модернизированная модификация Su-34. Он оснащен передовой авионикой и системами вооружения, улучшая его боевые возможности."
 tu160m2_decision:0 "Создать дизайн Tu-160M2"
 tu160m2_decision_desc:0 "Tu-160M2 - модернизированная модификация Tu-160. Он оснащен передовой авионикой и системами вооружения, улучшая его боевые возможности."
 tu95msm_decision:0 "Создать дизайн Tu-95MSM"
 tu95msm_decision_desc:0 "Tu-95MSM - модернизированная модификация Tu-95. Он оснащен передовой авионикой и системами вооружения, улучшая его боевые возможности."
 il76md90a_decision:0 "Создать дизайн Il-76MD-90A"
 il76md90a_decision_desc:0 "Il-76MD-90A - модернизированная модификация Il-76. Он оснащен передовыми двигателями и авионикой, улучшая его производительность и надежность."
 il112v_decision:0 "Создать дизайн Il-112V"
 il112v_decision_desc:0 "Il-112V - легкий транспортный самолет нового поколения России. Он разработан для замены устаревшего транспортного самолета An-26."
 an178_decision:0 "Создать дизайн An-178"
 an178_decision_desc:0 "An-178 - средний транспортный самолет, совместно разработанный Украиной и Россией. Он разработан для замены устаревшего транспортного самолета An-12."
 a50u_decision:0 "Создать дизайн A-50U"
 a50u_decision_desc:0 "A-50U - модернизированная модификация A-50. Он оснащен передовым радаром и авионикой, улучшая его возможности раннего предупреждения."
 a100_decision:0 "Создать дизайн A-100 Premier"
 a100_decision_desc:0 "A-100 Premier - самолет раннего предупреждения нового поколения России. Он оснащен передовым активным фазированным решеточным радаром и современной авионикой."
 su30sm2_decision:0 "Создать дизайн Su-30SM2"
 su30sm2_decision_desc:0 "Su-30SM2 - модернизированная модификация Su-30SM. Он оснащен передовой авионикой и системами вооружения, улучшая его боевые возможности."
 mig29m2_decision:0 "Создать дизайн MiG-29M2"
 mig29m2_decision_desc:0 "MiG-29M2 - модернизированная модификация MiG-29. Он оснащен передовой авионикой и системами вооружения, улучшая его боевые возможности."
 su34mp_decision:0 "Создать дизайн Su-34MP"
 su34mp_decision_desc:0 "Su-34MP - вариант самолета радиоэлектронной борьбы Su-34. Он оснащен передовым оборудованием и системами радиоэлектронной борьбы."
 gripen_e_decision:0 "Создать дизайн JAS 39E Gripen"
 gripen_e_decision_desc:0 "JAS 39E Gripen - новейшая модификация однодвигательного истребителя, разработанного шведской компанией Saab. Он оснащен передовой авионикой, большей дальностью и улучшенной грузоподъемностью вооружения."
 rafale_f4_decision:0 "Создать дизайн Rafale F4"
 rafale_f4_decision_desc:0 "Rafale F4 - новейшая модификация истребителя Rafale, разработанного французской компанией Dassault Aviation. Он оснащен передовой авионикой, улучшенными многоцелевыми боевыми возможностями и дозаправкой в воздухе."
 typhoon_tranche3_decision:0 "Создать дизайн Eurofighter Typhoon"
 typhoon_tranche3_decision_desc:0 "Eurofighter Typhoon - многоцелевой истребитель, совместно разработанный Великобританией, Германией, Италией и Испанией. Он оснащен передовой авионикой, улучшенной грузоподъемностью и дозаправкой в воздухе."
 sirtap_decision:0 "Создать дизайн SIRTAP"
 sirtap_decision_desc:0 "SIRTAP - система тактического беспилотного летательного аппарата средней дальности, совместно разработанная несколькими европейскими странами. Она обладает возможностями разведки и легкого удара."
 falco_evo_decision:0 "Создать дизайн Falco EVO"
 falco_evo_decision_desc:0 "Falco EVO - новейшая модификация беспилотного летательного аппарата Falco, разработанного итальянской компанией Leonardo. Она обладает большей продолжительностью полета и большей грузоподъемностью."
 a400m_decision:0 "Создать дизайн A400M Atlas"
 a400m_decision_desc:0 "A400M Atlas - военный транспортный самолет, разработанный европейской компанией Airbus. Он обладает стратегическими транспортными возможностями и тактическими возможностями посадки."
 a330_mrtt_decision:0 "Создать дизайн A330 MRTT"
 a330_mrtt_decision_desc:0 "A330 MRTT - самолет дозаправки в воздухе, основанный на гражданском самолете Airbus A330. Он оснащен передовой авионикой и системами дозаправки, обеспечивая эффективную поддержку воздушных операций."
 a330_aewc_decision:0 "Создать дизайн A330 AEW&C"
 a330_aewc_decision_desc:0 "A330 AEW&C - самолет раннего предупреждения и управления, основанный на гражданском самолете Airbus A330. Он оснащен передовым активным фазированным решеточным радаром и системами управления."
 kf21_decision:0 "Создать дизайн KF-21 Boramae"
 kf21_decision_desc:0 "KF-21 Boramae - двухдвигательный многоцелевой истребитель четвертого и полового поколения, разработанный Корейской авиационно-космической корпорацией. Он оснащен АЭСА радаром, передовой авионикой и двумя двигателями."
 lca_tejas_decision:0 "Создать дизайн LCA Tejas Mk1"
 lca_tejas_decision_desc:0 "LCA Tejas - однодвигательный легкий истребитель четвертого и полового поколения, разработанный индийской компанией HAL. Он оснащен передовой авионикой и способностью использования точного вооружения."
 kc390_decision:0 "Создать дизайн KC-390 Millennium"
 kc390_decision_desc:0 "KC-390 Millennium - большой военный транспортный самолет и самолет дозаправки, разработанный бразильской авиационной корпорацией Embraer. Он обладает стратегическими транспортными возможностями и воздушной дозаправкой."
 kawasaki_p1_decision:0 "Создать дизайн Kawasaki P-1"
 kawasaki_p1_decision_desc:0 "Kawasaki P-1 - нового поколения морской разведывательный самолет Японского морского самокатного кресла. Он оснащен четырьмя двигателями-реакторами, внутренним бомболом и системами противолодочных боев."
 jf17_block3_decision:0 "Создать дизайн JF-17 Thunder Block 3"
 jf17_block3_decision_desc:0 "JF-17 Thunder Block 3 - однодвигательный многоцелевой истребитель четвертого и полового поколения, разработанный Пакистанской авиационной корпорацией и Китаем. Он оснащен АЭСА радаром и ракетами PL-15E воздух-воздух."
 lca_tejas_mk2_decision:0 "Создать дизайн LCA Tejas Mk2"
 lca_tejas_mk2_decision_desc:0 "LCA Tejas Mk2 - средний многоцелевой истребитель, разработанный индийской компанией HAL на основе Mk1. Он оснащен двигателем GE F414, радаром Uttam AESA и 11 узлами подвески вооружения."
 hurjet_decision:0 "Создать дизайн Hurjet"
 hurjet_decision_desc:0 "Hurjet - высококлассный тренировочный и легкий ударный самолет, разработанный турецкой авиационно-космической корпорацией. Он оснащен двигателем GE F404, с максимальной скоростью до 1,4 Маха."
 heron_tp_decision:0 "Создать дизайн Heron TP"
 heron_tp_decision_desc:0 "Heron TP - большой беспилотный летательный аппарат длительного полета, разработанный израильской авиационно-космической корпорацией. Он оснащен двигателем-реактором PT6A, с продолжительностью полета более 30 часов и грузоподъемностью до 2 тонн."
 su75_decision:0 "Создать дизайн Su-75 Checkmate"
 su75_decision_desc:0 "Su-75 Checkmate - легкий многоцелевой стелс-истребитель пятого поколения России. Он использует однодвигательную конструкцию, имеет передовую авионику и большую грузоподъемность вооружения."
  historical_naval_category: "Исторические проекты кораблей"
