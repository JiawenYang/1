  USA_Virginia_decision: "Создать проект класса Вирджиния - Блок V"
  USA_Virginia_decision_desc: "Разблокирует подводную лодку класса Вирджиния, оснащенную улучшенными возможностями с модернизацией Блок V."
  # Columbia Class
