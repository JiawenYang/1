 eng_ajax_fe_decision:0 "General Dynamics Ajax"
 eng_ajax_fe_decision_desc:0 "Завершить испытания по шуму и вибрации и допустить машину разведки Ajax на службу в Британской армии."
 eng_apache_ah2_fe_decision:0 "Apache AH-2"
 eng_apache_ah2_fe_decision_desc:0 "Принять модернизированные AH-64E Apache Guardian под обозначением Apache AH-2 на вооружение Армейской авиации."
 eng_boxer_miv_fe_decision:0 "Boxer MIV"
 eng_boxer_miv_fe_decision_desc:0 "Принять первые БМП Boxer на вооружение новых ударных бригад."
 eng_challenger3_fe_decision:0 "Challenger 3"
 eng_challenger3_fe_decision_desc:0 "Завершить программу повышения огневой мощи Rheinmetall Challenger 3 с новой 120-мм гладкоствольной башней и авторизовать переоснащение парка."
 eng_dreadnought_fe_decision:0 "Dreadnought Class"
 eng_dreadnought_fe_decision_desc:0 "Завершить строительство РПКСН класса Dreadnought и принять непрерывное морское сдерживание от класса Vanguard."
 eng_e7_wedgetail_fe_decision:0 "Boeing E-7 Wedgetail AEW1"
 eng_e7_wedgetail_fe_decision_desc:0 "Внедрить E-7 Wedgetail AEW1 для замены Sentry AEW1 в роли дальнего радиолокационного обнаружения."
 eng_p8a_poseidon_fe_decision:0 "Boeing P-8A Poseidon MRA1"
 eng_p8a_poseidon_fe_decision_desc:0 "Сформировать силу патрулирования Poseidon MRA1 на авиабазе Лоссимут."
 eng_protector_rg1_fe_decision:0 "Protector RG1"
 eng_protector_rg1_fe_decision_desc:0 "Сертифицировать GA-ASI MQ-9B SkyGuardian под обозначением Protector RG1 как первую систему ВВС, допущенную к полётам в гражданском воздушном пространстве."
 eng_sky_sabre_fe_decision:0 "Sky Sabre"
 eng_sky_sabre_fe_decision_desc:0 "Развёрнуть зенитный комплекс Sky Sabre, объединяющий РЛС Giraffe, систему управления боем Rafael MIC4AD и ракеты Land Ceptor."
 eng_tempest_fe_decision:0 "BAE Tempest"
 eng_tempest_fe_decision_desc:0 "Завершить разработку истребителя шестого поколения Tempest в рамках Глобальной программы боевой авиации и начать серийное производство."
 eng_type26_fe_decision:0 "Type 26 City Class"
 eng_type26_fe_decision_desc:0 "Ввести в строй первый противолодочный фрегат Type 26 HMS Glasgow как основу будущего эскорта авианосной группы."
 eng_type31_fe_decision:0 "Type 31 Inspiration Class"
 eng_type31_fe_decision_desc:0 "Ввести многоцелевой фрегат Type 31 под руководством HMS Venturer в Королевский флот."
 eng_type83_fe_decision:0 "Type 83 Destroyer"
 eng_type83_fe_decision_desc:0 "Разработать и ввести в строй эсминец ПВО/ПРО Type 83 для замены Type 45 в 2030-х годах."
 future_aircraft_category:0 "Перспективная авиация"
 future_naval_category:0 "Перспективные корабли"
 future_tanks_category:0 "Перспективные бронемашины"
 ger_212cd_fe_decision:0 "Type 212CD Class"
 ger_212cd_fe_decision_desc:0 "Завершить совместную с Норвегией программу ПЛ Type 212CD и принять первую лодку в строй."
 ger_ch53k_fe_decision:0 "CH-53K King Stallion"
 ger_ch53k_fe_decision_desc:0 "Внедрить тяжёлый транспортный вертолёт CH-53K как преемник парка CH-53G."
 ger_eurodrone_fe_decision:0 "Eurodrone"
 ger_eurodrone_fe_decision_desc:0 "Завершить сертификацию европейского БПЛА MALE RPAS Eurodrone и начать поставки в Германию, Францию, Италию и Испанию."
 ger_f126_fe_decision:0 "F126 Köln Class"
 ger_f126_fe_decision_desc:0 "Ввести в строй фрегат F126 под руководством F265 Köln для длительных зарубежных стабилизационных и эскортных миссий."
 ger_f35a_fe_decision:0 "F-35A Lightning II"
 ger_f35a_fe_decision_desc:0 "Принять способные нести ядерное оружие F-35A для замены Tornado IDS в ядерном распределении и ударных ролях."
 ger_heron_tp_fe_decision:0 "Heron TP"
 ger_heron_tp_fe_decision_desc:0 "Взять в аренду IAI Heron TP как временный вооружённый БПЛА большой продолжительности для германских вооружённых сил."
 ger_kf51_panther_fe_decision:0 "KF51 Panther"
 ger_kf51_panther_fe_decision_desc:0 "Завершить испытания демонстратора Rheinmetall KF51 Panther и предложить платформу со 130-мм орудием для серийного производства и экспорта."
 ger_leopard3_mgcs_fe_decision:0 "Leopard 3 (MGCS)"
 ger_leopard3_mgcs_fe_decision_desc:0 "Запустить франко-германскую Основную боевую систему сухопутных войск (MGCS), преемницу Leopard 2, в серийное производство."
 ger_p8a_poseidon_fe_decision:0 "Boeing P-8A Poseidon"
 ger_p8a_poseidon_fe_decision_desc:0 "Принять P-8A Poseidon для замены P-3C Orion в роли дальнего морского патрулирования."
 ger_tiger_mkiii_fe_decision:0 "Tiger MkIII"
 ger_tiger_mkiii_fe_decision_desc:0 "Завершить модернизацию Tiger MkIII с новыми авионикой, датчиками и интеграцией вооружения для парка немецких ударных вертолётов."
 jh7a_decision:0 "Xian JH-7A"
 jh7a_decision_desc:0 "Авторизовать модернизацию парка JH-7 Flying Leopard с улучшенной авиионикой, системами прицеливания и противокорабельными возможностями."
