  SOV_Admiral_Gorshkov_decision_desc: "Разблокирует фрегат класса Адмирал Горшков российского флота."
  SOV_Admiral_Grigorovich_decision: "Создать проект класса Адмирал Григорович"
  SOV_Admiral_Grigorovich_decision_desc: "Разблокирует фрегат класса Адмирал Григорович российского флота."
  SOV_Steregushchiy_decision: "Создать проект класса Стергущий"
  SOV_Steregushchiy_decision_desc: "Разблокирует фрегат класса Стергущий российского флота."
  SOV_Gremyashchiy_decision: "Создать проект класса Гремящий"
  SOV_Gremyashchiy_decision_desc: "Разблокирует фрегат класса Гремящий российского флота."
  # Type 003 Class
  CHI_Type_003_decision: "Создать проект класса Type 003"
  CHI_Type_003_decision_desc: "Разблокировать самый современный авианосец класса Type 003 Китая, оборудованный электромагнитными катапультами."
  # Type 002 Class
  CHI_Type_002_decision: "Создать проект класса Type 002"
  CHI_Type_002_decision_desc: "Разблокировать авианосец класса Type 002 Китая, улучшенную версию Лиаонин."
