 hq_17_decision_desc:0 "HQ-17 - нового поколения ближняя зенитная ракетная система Китая."
 pokpung_ho_decision:0 "Создать дизайн Покпунг-хо"
 pokpung_ho_decision_desc:0 "Покпунг-хо - основной боевой танк Северной Кореи, разработанный на базе Т-72. Он оснащен 125-мм гладкоствольной пушкой и реактивной броней, разработка началась в 2002 году."
 songun_ho_decision:0 "Создать дизайн Сонгун-хо"
 songun_ho_decision_desc:0 "Сонгун-хо - улучшенная модификация Покпунг-хо с усиленной броневой защитой и системой управления огнем, представлен в 2010-х годах."
 m2020_decision:0 "Создать дизайн М-2020"
 m2020_decision_desc:0 "М-2020 - новейший основной боевой танк Северной Кореи, представленный в 2020 году. Его дизайн напоминает российский Т-14 Армата с дистанционной оружейной станцией и композитной броней."
 m2010_decision:0 "Создать дизайн М-2010"
 m2010_decision_desc:0 "М-2010 - корейский бронетранспортер, введенный в эксплуатацию в 2010-х годах, с композитной броней и улучшенным вооружением."
 juchepo_decision:0 "Создать дизайн Джучхе-По"
 juchepo_decision_desc:0 "Джучхе-По - корейская самоходная артиллерийская система с продвинутой системой управления огнем и дальнобойными боеприпасами."
 zulfiqar3_decision:0 "Создать дизайн Зульфикар-3"
 zulfiqar3_decision_desc:0 "Зульфикар-3 - самая новая модификация иранских танков серии Зульфикар с усиленной броневой защитой и огневой мощью, введенный в строй в 2016 году."
 moharram6_decision:0 "Создать дизайн Мохаррам-6"
 moharram6_decision_desc:0 "Мохаррам-6 - иранская самоходная зенитная ракетная система, использующая технологию вертикального пуска."
