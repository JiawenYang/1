  USA_Columbia_decision_desc: "Разблокирует баллистическую ракетуносещую подводную лодку класса Колумбия, будущий основой американского ядерного сдерживания."
  # Arleigh Burke Class
  USA_Arleigh_Burke_decision: "Создать проект класса Арлея Бёрка - Флайт III"
