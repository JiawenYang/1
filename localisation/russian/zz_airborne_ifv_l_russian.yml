l_russian:
 ZZ_airborne_ifv_chassis_bmd1: "BMD-1"
 ZZ_airborne_ifv_chassis_bmd1_desc: "Первая советская боевая машина десанта, выбрасываемая с парашютом из транспортных самолётов для огневой поддержки десантников."
 ZZ_airborne_ifv_chassis_bmd1p: "BMD-1P"
 ZZ_airborne_ifv_chassis_bmd1p_desc: "Модернизированный вариант BMD-1 с дополнительной бронёй и улучшенным управлением огнём, с сохранением проверенной системы десантирования."
 ZZ_airborne_ifv_chassis_bmd2: "BMD-2"
 ZZ_airborne_ifv_chassis_bmd2_desc: "БМД второго поколения с 30-мм автоматической пушкой, значительно усиленная огневая мощь."
 ZZ_airborne_ifv_chassis_bmd3: "BMD-3"
 ZZ_airborne_ifv_chassis_bmd3_desc: "БМД третьего поколения на совершенно новом шасси, с композитной бронёй и возможностью десантирования с экипажем."
 ZZ_airborne_ifv_chassis_bmd4m: "BMD-4M"
 ZZ_airborne_ifv_chassis_bmd4m_desc: "Новейшая основная машина ВДВ России, сочетающая 100-мм пушку с ПТУР и 30-мм автоматическую пушку."
 ZZ_airborne_ifv_chassis_zbd03: "ZBD-03"
 ZZ_airborne_ifv_chassis_zbd03_desc: "Гусеничная боевая машина десанта НОАК, полностью десантируемая для огневой поддержки парашютистов."

 airborne_mechanized_equipment: "Desantnaya BMP"
