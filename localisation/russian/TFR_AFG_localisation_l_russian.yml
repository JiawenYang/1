l_russian:
 #The Fire Rises: цепочка гражданской войны в Афганистане (портированная)
 afghanistan.1.t: "Американское мирное соглашение вступает в силу"
 afghanistan.1.d: "После соглашения в Дохе американские силы начинают поэтапный вывод, а перемирие между Кабулом и талибами держится лишь на взаимном недоверии."
 afghanistan.1.a: "Наконец-то мир?"
 afghanistan.2.t: "Талибы срывают перемирие"
 afghanistan.2.d: "Талибы обвиняют Кабул в задержке освобождения заключённых и объявляют всеобщее наступление. Линия перемирия за ночь превращается в поле боя."
 afghanistan.2.a: "Гражданская война разгорается вновь"
 afghanistan.3.t: "Исламский Эмират Афганистан восстановлен"
 afghanistan.3.d: "В контролируемых провинциях талибы провозглашают восстановление Исламского Эмирата и призывают все вооружённые силы страны подчиниться."
 afghanistan.3.a: "Эмират вернулся"
 afghanistan.4.t: "Талибы расширяют контроль"
 afghanistan.4.d: "Бойцы талибов берут Нуристан, Кунар и Бадахшан, а правительственные части сдаются или рассеиваются."
 afghanistan.4.a: "Провинция за провинцией"
 afghanistan.5.t: "Кабульская линия рушится"
 afghanistan.5.d: "Правительственные силы массово дезертируют, передовые отряды талибов приближаются к окраинам столицы. Кабул охватывает паника."
 afghanistan.5.a: "Столица в опасности"
 afghanistan.6.t: "Восточные провинции переходят под контроль"
 afghanistan.6.d: "Талибы укрепляют контроль над восточными долинами, а местные полевые командиры переходят на их сторону."
 afghanistan.6.a: "Восток решён"
 afghanistan.7.t: "Хазараджат подчиняется"
 afghanistan.7.d: "Талибы договариваются с местными ополченцами, и Хазараджат номинально подчиняется Исламскому Эмирату."
 afghanistan.7.a: "Переговоры лучше крови"
 afghanistan.8.t: "Талибы провозглашают восстановленный Эмират"
 afghanistan.8.d: "Кабул пал. Талибы провозглашают восстановление Исламского Эмирата Афганистана, и двадцать лет войны завершаются выводом американских войск."
 afghanistan.8.a: "Эпоха заканчивается"
