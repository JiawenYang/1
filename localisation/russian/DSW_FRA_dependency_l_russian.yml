 The_New_Popular_Front_Candidate_1_TXT:0 "£GFX_FRA_unbowed_texticon §pЖан-Люк Меланшон§!"
 The_New_Popular_Front_Candidate_1_TXT_DESC:0 "Непокорный революционер. Идеология — Народный фронт.\n\n\n\n\n\n\n\n   £GFX_FRA_melenchon\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_New_Popular_Front_Candidate_2_TXT:0 "£GFX_FRA_socialists_texticon §0Оливье Фор§!"
 The_New_Popular_Front_Candidate_2_TXT_DESC:0 "Сильная фигура социал-демократии. Идеология — Народный фронт.\n\n\n\n\n\n\n\n   £GFX_Olivier_Faure\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_New_Popular_Front_Candidate_3_TXT:0 "£GFX_FRA_unbowed_texticon §pФрансуа§! §0Руффен§!£GFX_FRA_socialists_texticon"
 The_New_Popular_Front_Candidate_3_TXT_DESC:0 "Икона прогрессивизма, компромиссный вариант. Идеология — Народный фронт.\n\n\n\n\n\n\n\n   £GFX_Francois_Ruffin\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_New_Popular_Front_Candidate_4_TXT:0 "§pНовый народный фронт§! так и не создан"
 The_New_Popular_Front_Candidate_4_TXT_DESC:0 "Откажитесь от левых взглядов. §pМеланшон§! не может прийти к власти в одиночку."
 The_New_Popular_Front_Candidate_TXT_DESC:0 "Решите, кто будет участвовать в выборах как кандидат в президенты от §pНового народного фронта§!."
