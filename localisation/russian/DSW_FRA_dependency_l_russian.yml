 The_Sixth_Republic_Election_TXT_DESC:0 "\n\n§RТребуется§!:\nФранция побеждает в европейской войне.\nПосле того как военные свергают §pНовый народный фронт§!, они выбирают §3полное восстановление демократии§!. Либо после того как военные свергают §pНовый народный фронт§!, они выбирают §gчастичное восстановление демократии§!, затем сохраняют конституцию Меланшона."
