 The_Seventh_Republic_Election_TXT_DESC:0 "\n\n§RТребуется§!:\nФранция побеждает в европейской войне.\nПосле того как военные свергают §pНовый народный фронт§!, они выбирают §aСедьмую Республику§!. Либо после того как военные свергают §pНовый народный фронт§!, они выбирают §gчастичное восстановление демократии§!, затем отменяют сохранение конституции Меланшона и устанавливают 7-ю Республику."
 The_Sixth_Republic_Election:0 "@FRA Первые выборы 6-й Республики"
