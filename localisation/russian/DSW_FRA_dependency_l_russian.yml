 LE_PEN_LOSS_AI_BEHAVIOR_TXT:0 "§3Ле Пен§! - §Rпоражение§!"
 LE_PEN_LOSS_AI_BEHAVIOR_TXT_DESC:0 "После завершения фокуса \"Первый залп\" будет выбрана §3Марин Ле Пен§!, и она проиграет выборы 2022 года §OЭммануэлю Макрону§!. Затем §3Ле Пен§! покидает пост председателя \"Национального объединения\", а §3Жордан Барделла§! становится новым лидером.\n\n\n\n\n\n\n\n   £GFX_FRA_emmanuel_macron\n\n\n\n\n\n\n\n\n-------------------------------------"
 LE_PEN_WIN_AI_BEHAVIOR_TXT:0 "§3Ле Пен§! - §Gпобеда§!"
 LE_PEN_WIN_AI_BEHAVIOR_TXT_DESC:0 "После завершения фокуса \"Первый залп\" будет выбрана §3Марин Ле Пен§!, и она победит на выборах 2022 года.\n\n\n\n\n\n\n\n   £GFX_FRA_marie_le_pen\n\n\n\n\n\n\n\n\n-------------------------------------"
 MACRON_LOSS_AI_BEHAVIOR_TXT:0 "§OМакрон§! - §Rпоражение§!"
 MACRON_LOSS_AI_BEHAVIOR_TXT_DESC:0 "После завершения фокуса \"Первый залп\" будет выбран §OЭммануэль Макрон§!, и он проиграет выборы 2022 года §PМарин Ле Пен§!. Затем §OМакрон§! уходит из политики и передаёт руководство партией \"Возрождение\" §OСтефану Сежурне§!.\n\n\n\n\n\n\n\n   £GFX_FRA_marie_le_pen\n\n\n\n\n\n\n\n\n-------------------------------------"
 MACRON_WIN_AI_BEHAVIOR_TXT:0 "§OМакрон§! - §Gпобеда§!"
 MACRON_WIN_AI_BEHAVIOR_TXT_DESC:0 "После завершения фокуса \"Первый залп\" будет выбран §OЭммануэль Макрон§!, и он победит на выборах 2022 года.\n\n\n\n\n\n\n\n   £GFX_FRA_emmanuel_macron\n\n\n\n\n\n\n\n\n-------------------------------------"
 MELENCHON_AI_BEHAVIOR_TXT:0 "§pНовый народный фронт§!"
 MELENCHON_AI_BEHAVIOR_TXT_DESC:0 "После завершения фокуса \"Первый залп\" будет выбрана §3Марин Ле Пен§!, но после раскрытия попытки военного переворота §O\"Возрождение\"§! и §3\"Национальное объединение\"§! потеряют доверие общества, и §pНовый народный фронт§! победит на выборах 2022 года.\n\n§RТребуется§!:\n§pНовый народный фронт§! создан."
