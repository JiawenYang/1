 The_Government_of_National_Defense_Democratic:0 "£GFX_TFR_game_rule_flag_FAF_French_Republic  §OСвобода§!, §YКонсерватизм§!, §3Патриотизм§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT:0 "§OДемократическое движение§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT_DESC:0 "Демократическое движение — центристская партия, существовавшая ещё до падения Франции под натиском Советов. Представляя себя разумным и здравым вариантом, она идёт вперёд с гораздо более центристским и либеральным взглядом, чем её соперники.\nИдеология — §Oхристианская демократия§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Bayrou\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT:0 "§3Национальный консервативный союз§!"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT_DESC:0 "Национальный консервативный союз — странная смесь консервативных и военных ценностей. Он представляет себя куда более патриотичной консервативной партией, чем LR, считая себя истинным продолжением мечты Вилье и де Голля о традиционалистской, патриотичной Франции.\nИдеология — §3популистский голлизм§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Stephane_Ravier\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_Republicain_TXT:0 "§YРеспубликанцы§!"
 The_Government_of_National_Defense_Democratic_Republicain_TXT_DESC:0 "«Республиканцы», которых многие считают предшественником, почти идентичны прежнему «Национальному объединению» — консервативное движение, стремящееся вернуть традиционные ценности Франции, сохраняя демократическую систему и баланс сил.\nИдеология — §Yтрадиционный голлизм§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Xavier_Bellamy\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_TXT_DESC:0 "Первые выборы новой Республики.\n\n\n\n\n\n\n\n   £GFX_Pierre_De_Villiers\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RТребуется§!:\nПуть §gПравительства§! §aнациональной обороны§! выбирает §3демократическое правительство§!."
