 The_Government_of_National_Defense_Path_Democratic_TXT_DESC:0 "§3Де Вилье§! восстанавливает республику и проводит первые всеобщие выборы новой республики. Идеология — §3переходная демократия§!.\n\n\n\n\n\n\n\n   £GFX_Pierre_De_Villiers\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RТребуется§!:\n§3Пьер де Вилье§! проигрывает французские выборы 2022 года."
 The_Government_of_National_Defense_Path_Fascist_TXT:0 "£GFX_TFR_game_rule_flag_FAF_French_Social_Republic £GFX_TFR_game_rule_flag_FAF_Kingdom_of_the_French_bonaparte  §8Панфашизм§! £GFX_TFR_game_rule_flag_FRA_French_State @FAF"
 The_Government_of_National_Defense_Path_Fascist_TXT_DESC:0 ""
