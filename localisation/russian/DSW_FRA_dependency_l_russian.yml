 The_French_Socialist_Republic_Path_Didier_Daeninckx_TXT_DESC:0 "Идеология — демократический социализм.\n\n\n\n\n\n\n\n   £GFX_Didier_Daeninckx\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RТребуется§!:\nКонституционный референдум Шестой Республики принимает \"§tРадикальную конституцию§!\"."
