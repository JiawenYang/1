 NATO_victor_of_the_european_war:0 "Победитель европейской войны"
 NATO_victor_of_the_european_war_desc:0 "Как лидеры ЕС, мы являемся бесспорными хозяевами Европы: мы сокрушили русскую военную машину и защитили Запад от тирании. Но победа не далась даром. Десятки тысяч наших людей полегли на фронте, целые регионы опустошены, а военные усилия довели нашу экономику до предела. Здесь шрамы, возможно, не так заметны, как на Востоке, но призрак войны витает над нашими заводами, улицами и умами каждого гражданина.\n\nТеперь начинается война иного рода: борьба за стабилизацию, восстановление и защиту демократии, за которую сражались и умирали столь многие наши парни. Но пока Европа ждёт от нас руководства, мы должны спросить себя: станет ли этот триумф началом новой демократической эры или лишь затишьем перед §Rновой русской бурей§!?"
 NOR_growing_class_divide_idea:0 "Растущий классовый разрыв"
 POLITICS_nicolas_mayer_rossignol_DESC:0 "Будучи заурядным мэром Руана, сторонником федерализации и ЕС, господин Майер-Россиньоль неожиданно получил выдвижение на пост главы новой Независимой Республики Нормандия. \n\nОказавшись на посту, в который он не верит, Майер-Россиньоль делает всё возможное, чтобы саботировать нормандское дело изнутри высшей власти."
