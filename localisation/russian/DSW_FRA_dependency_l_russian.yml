 high_female_service_desc:0 ""
 high_immigration:0 "Слабое регулирование"
 high_immigration_desc:0 "\"Отдайте мне ваших усталых, ваших бедных, ваши сбившиеся в кучу массы, жаждущие свободно дышать, жалкие отбросы ваших переполненных берегов.\" - Эмма Лазарус, \"Новый Колосс\""
 high_interest_rates:0 "Высокие процентные ставки"
 high_interest_rates_desc:0 "''Процентные ставки относятся к ценам активов так же, как гравитация к яблоку.'' \n-Уоррен Баффет"
 high_police:0 "Жёсткая безопасность"
 high_police_desc:0 "''Я поддерживаю диктатуру.'' - Жаир Болсонару"
 high_safety:0 "Приемлемые права рабочих"
 high_society:0 "Растущее процветание"
 high_society_desc:0 "На этом этапе общество переживает значительный прогресс в экономическом развитии, технологиях и социальном благополучие. Институты укрепляются, обеспечивая стабильные рамки для роста. Образование и инновации становятся центральными, что ведёт к улучшению качества жизни, расширению возможностей и более справедливому распределению ресурсов."
 high_taxes:0 "Высокие налоги"
 high_taxes_desc:0 "''Не так уж неразумно, чтобы богатые вносили вклад в государственные расходы — не только пропорционально своим доходам, но и несколько больше этой пропорции.'' - Адам Смит"
 high_trade:0 "Импортная экономика"
 high_trade_desc:0 "''Подавляющее большинство нашего импорта поступает из-за границы.'' - Джордж Буш-младший"
 high_training:0 "Жёсткая программа подготовки"
 high_training_desc:0 ""
 high_welfare:0 "Высокие социальные выплаты"
 high_welfare_desc:0 "''Истинная мера любого общества видна в том, как оно относится к своим самым уязвимым членам.'' - Мохандас Ганди"
 higher_conscription:0 "Служат все взрослые"
 higher_conscription_desc:0 "''Победа предназначена тем, кто готов заплатить её цену.'' - Сунь-цзы"
 higher_education:0 "Государственное высшее образование"
