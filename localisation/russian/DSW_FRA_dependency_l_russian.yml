 The_Government_of_National_Defense_Path_Military_TXT_DESC:0 ""
 The_Government_of_National_Defense_Path_Monarchist_TXT:0 "£GFX_TFR_game_rule_flag_FAF_Franco_Iberian_Kingdom  §aМонархист§!"
 The_Government_of_National_Defense_Path_Monarchist_TXT_DESC:0 "Идеология — §aабсолютная монархия§!.\n\n\n\n\n\n\n\n   £GFX_Louis_XX\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Path_TXT_DESC:0 "Если §gПьер де Вилье§! не победил на выборах 2022 года, он возглавит @FAF§gПравительство§! §aнациональной обороны§! во время французской гражданской войны. Идеология — §gголлизм Сопротивления§!.\nВ противном случае его возглавит §aФрансуа Лекуэнтр§!. Идеология — §aпетенизм Сопротивления§!.\n\n\n\n\n\n\n\n£GFX_Pierre_De_Villiers   £GFX_FRA_lecointre\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RТребуется§!:\n§RКоммунистическая партия Российской Федерации§! побеждает на выборах в России.\nНАТО проигрывает европейскую войну."
 The_Mel_Constitution_Crossroads:0 "@FRA Конституционная развилка Меланшона"
 The_Mel_Constitution_Crossroads_1_TXT:0 "Конституция Меланшона сохраняется"
 The_Mel_Constitution_Crossroads_1_TXT_DESC:0 "Всё ещё Шестая Республика."
 The_Mel_Constitution_Crossroads_2_TXT:0 "Разработать новую конституцию"
 The_Mel_Constitution_Crossroads_2_TXT_DESC:0 "Добро пожаловать на первые выборы 7-й Республики."
 The_Mel_Constitution_Crossroads_TXT_DESC:0 "\n\n§RТребуется§!:\nФранция побеждает в европейской войне.\nПосле того как военные свергают §pНовый народный фронт§!, они выбирают §gчастичное восстановление демократии§!."
 The_Military_Overthrows_New_Popular_Front:0 "@FRA Военные свергают §pНовый народный фронт§!"
 The_Military_Overthrows_New_Popular_Front_1_TXT:0 "§3Полное восстановление демократии§!"
 The_Military_Overthrows_New_Popular_Front_1_TXT_DESC:0 "Переворот под руководством Этьена дю Пейру. Идеология — конституционализм.\n\n\n\n\n\n\n\n   £GFX_Etienne_du_Peyroux\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Military_Overthrows_New_Popular_Front_2_TXT:0 "§gЧастичное восстановление демократии§!"
 The_Military_Overthrows_New_Popular_Front_2_TXT_DESC:0 "Переворот под руководством Вилье. Идеология — олигархия.\n\n\n\n\n\n\n\n   £GFX_Pierre_De_Villiers\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Military_Overthrows_New_Popular_Front_3_TXT:0 "§aСедьмая Республика§!"
 The_Military_Overthrows_New_Popular_Front_3_TXT_DESC:0 "Переворот под руководством Ле Рея. Идеология — военная хунта.\n\n\n\n\n\n\n\n   £GFX_Bruno_Le_Ray\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Military_Overthrows_New_Popular_Front_TXT_DESC:0 "Совет: \nЕсли Коммунистическая партия руководит Россией, это правило может быть недействительным.\n\n§RТребуется§!:\nРоссия не пришла к власти с §8ЛДПР§!.\nКонституционный референдум Шестой Республики принял \"§tРадикальную конституцию§!\"."
