 eufrance.7.t:0 "Швейцария отказывается вступать в Союз"
 eufrance.8.a:0 "Больше никогда..."
 eufrance.8.d:0 "ДА ПОШЁЛ ТЫ, ЛЕ ПЕН, ДА ПОШЁЛ ТЫ, МЕЛАНШОН, МЫ МОГЛИ ПОБЕДИТЬ, ЕСЛИ БЫ ВЫ НАС СЛУШАЛИ, НО НЕЕЕЕЕТ, ВАМ ОБЯЗАТЕЛЬНО НУЖНО БЫЛО БЛОКИРОВАТЬ НАС НА КАЖДОМ ШАГУ, ЖРИТЕ ДЕРЬМО И СДОХНИТЕ, ВЫ БЫЛИ НЕПРАВЫ, А МЫ БЫЛИ ПРАВЫ ВСЁ ЭТО ВРЕМЯ!"
