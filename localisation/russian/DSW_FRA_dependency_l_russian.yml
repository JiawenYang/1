 general_exemptions:0 "Общие освобождения"
 general_exemptions_desc:0 ""
 high_conscription:0 "Призыв по требованию"
 high_conscription_desc:0 "''Призыв — это жизненная сила нации, очищение её морали и настоящая основа всех её обычаев.'' - Наполеон Бонапарт"
