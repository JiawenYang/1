 civilian_mobilization:0 "Гражданская экономика"
 civilian_mobilization_desc:0 "''Взгляд правительства на экономику можно выразить несколькими короткими фразами: если что-то движется — обложите налогом. Если продолжает двигаться — отрегулируйте. А если остановилось — субсидируйте.'' - Рональд Рейган"
 early_mobilization:0 "Ранняя мобилизация"
 early_mobilization_desc:0 "''Победит тот, кто знает, когда сражаться, а когда не сражаться.'' - Сунь-цзы"
 education_exemptions:0 "Освобождения для образования"
 education_exemptions_desc:0 "''Я не просто пацифист, а воинствующий пацифист. Я готов бороться за мир. Ничто не положит конец войне, пока сами народы не откажутся идти на войну.'' - Альберт Эйнштейн"
