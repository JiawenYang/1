l_russian:
 MAPMODE_ECONOMY_ALLIANCE_MAP_MODE_DESCRIPTION: "Раскрасить мир по экономическим союзам: показывает таможенный союз и общий рынок каждой страны."
 military_alliance_intro: "§YВоенные союзы§!\n\n£GFX_military_alliance_intro_embed \n\n§gВступление: союз — никогда не бесплатный щит; это политика, которую нужно непрерывно оплачивать и которую в любой момент могут уценить.§!\n\nВоенные союзы — самый долговечный институциональный след холодной войны. НАТО превращает коллективную оборону статьи 5 в обязательство и обменивает североамериканский ядерный зонт на обычные силы Европы; ОДКБ не говорит об общих ценностях, а просто переводит военное преимущество России в организационную способность на постсоветском пространстве. Ни одна из систем не строилась, чтобы воевать, — обе строились, чтобы война не началась. Их настоящий продукт — сдерживание: заставить противника посчитать, прежде чем двигаться.\n\nРаботает ли союз, зависит прежде всего от того, как устроено командование и как делятся деньги. Систему командования НАТО ведёт Вашингтон: Европа даёт силы, базы и бюджеты, США — ядерный зонт и стратегическую переброску. Спор о разделении расходов возвращается каждый год, но настоящий вопрос не в том, кто недоплатил несколько процентов, а в том, кто готов и в мирное время платить за войну, которая может не прийти.\n\nДоступ к базам — это каркас. Гарнизоны, порты, аэродромы и права пролёта в спокойное время — точки на карте, а в кризис — весь ответ на вопрос, дойдут ли силы до фронта. Америка обменивает гарнизоны на сотрудничество, Россия — на лояльность, малые государства — на страховку ценой части суверенитета; у каждого обмена есть цена, даже если она не записана в договоре.\n\nДоверие держится на двух вещах: способности и воле. Способность можно посчитать, волю — нет. Когда внутренняя политика союзника разворачивается, обязательство сжимается; текст договора не меняется, меняются люди, которые его исполняют. Настоящее сдерживание — не то, что написано на бумаге, а то, во что верит противник: что кто-то действительно придёт.\n\nПериферия лучше всего показывает, из чего сделан союз. Ядро получает ядерный зонт и быстрый ответ, внешний круг — поставки оружия, учения и заявления. Союз никогда не был равным клубом: это список, отсортированный по стратегической ценности, и рейтинг переписывается в каждом кризисе.\n\nКризис — час проверки. Расхождения в оценке угрозы, споры о деньгах и выборы, меняющие правительства, уценивают обещания в последний момент. История повторяет один и тот же сюжет: договор вступил в силу, подкрепления не пришли — или пришли, но слишком поздно.\n\nЦвета на карте нарисованы договорами; реальная безопасность оплачивается волей — и между ними лежит счёт, который никто не хочет платить заранее."
 economy_alliance_intro: "§YЭкономические союзы§!\n\n£GFX_economy_alliance_intro_embed \n\n§gВступление: экономический союз продаёт не рынки, а правила — и цена правил никогда не указана в таможенном тарифе.§!\n\nЕдиного шаблона экономического союза нет. ЕС идёт наднациональным путём и сшивает членов в одно тело единым рынком, общей валютой и общим регулированием; АСЕАН идёт межправительственным путём и держит десять экономик вместе через консенсус и невмешательство; ССАГЗ превращает нефтяные доходы в трансграничный капитал и рабочую силу; ЭКОВАС связывает таможенный союз с миротворческими интервенциями; МЕРКОСУР давно остановился на пороге таможенного союза. Разные модели, разные стартовые точки, разные потолки.\n\nТариф — лишь входной билет. Качество союза решают четыре вещи за ним: стандарты, валюта, труд и капитал. Стандарты определяют, кто может продавать; валюта — кто несёт курсовой риск; мобильность труда — кто где может работать; мобильность капитала — кто где может строить. Только после этих четырёх шагов торговое соглашение становится экономическим сообществом.\n\nСтандарты — самая незаметная и самая действенная форма власти. Кто пишет правило, тот решает, как выглядят чужие товары. ЕС расширяет влияние за пределы членов регуляторными нормами, США разрезают цепочки поставок техническими стандартами и экспортным контролем, а Китай прокладывает свою колею в развивающемся мире через инфраструктуру и стандарты мощностей.\n\nВалюта — второй отказ от суверенитета. Общая валюта убирает курсовые трения и означает, что члены отдают независимую денежную политику; общий долг делит издержки кризиса и вписывает бюджетную дисциплину в чужую книгу. Свободное движение капитала приносит инвестиции — и панику, которая может уйти в любой момент.\n\nМобильность труда — самое часто забываемое звено. Свободное перемещение людей закрывает нехватку рабочей силы и создаёт конкуренцию зарплат и социальных гарантий между членами; когда экономика идёт вниз, иностранная рабочая сила обычно первой попадает в политические объяснения.\n\nХрупкость экономического союза в том, что он требует делить выгоды в процветание и издержки в кризис, а политическая сложность этих двух вещей совершенно разная. Макроэкономические качели, разрывы в промышленной конкурентоспособности и политические маятники — каждого из них достаточно, чтобы остановить интеграцию на полпути или повернуть её назад.\n\nЦвета на карте показывают принадлежность; станет ли она процветанием, зависит от того, готовы ли члены и в кризис платить вместе."
 org_eu_intro: "§YЕвропейский союз§!\n£GFX_power_eu_embed \n§gПодпись: Европейский парламент в Страсбурге.§!\nЕС связывает участников единым рынком, общей валютой и общим регулированием. Это самый интегрированный региональный блок современности и наиболее успешная попытка превратить экономический вес в дипломатическую и оборонную способность."
 org_sco_intro: "§YШанхайская организация сотрудничества§!\n£GFX_org_sco_embed \n§gПодпись: коридоры и энергетические маршруты Центральной Азии.§!\nШОС связывает Центральную Азию, Южную Азию и евразийский тыл через сотрудничество в сфере безопасности и связанность. В ней нет положений о коллективной обороне; это скорее региональная координационная платформа, опирающаяся на Китай и Россию."
 org_pec_intro: "§YТихоокеанское экономическое сообщество§!\n£GFX_org_pec_embed \n§gПодпись: азиатско-тихоокеанская экономическая сеть под руководством Токио.§!\nСообщество использует торговые правила, инвестиции и цепочки поставок, чтобы сплести Восточную Азию и тихоокеанское побережье в одну сеть. Это главный инструмент Японии для превращения экономического веса в региональный порядок."
 org_asean_intro: "§YАссоциация государств Юго-Восточной Азии§!\n£GFX_org_asean_embed \n§gПодпись: Джакарта — место пребывания Секретариата АСЕАН.§!\nАСЕАН удерживает десять экономик в рыхлом сообществе, основанном на консенсусе и невмешательстве. Она не стремится к наднациональной власти и поддерживает региональную стабильность через диалог и открытые рынки."
 org_gcc_intro: "§YСовет сотрудничества арабских государств Залива§!\n£GFX_org_gcc_embed \n§gПодпись: круг коллективной безопасности и экономики нефтяных государств Залива.§!\nССАГЗ превращает нефтяные доходы монархий Залива в трансграничный капитал, рабочую силу и сотрудничество в сфере безопасности. Это одновременно таможенный союз и механизм политической координации перед лицом региональных конфликтов."
 org_ecowas_intro: "§YЭкономическое сообщество западноафриканских государств§!\n£GFX_org_ecowas_embed \n§gПодпись: западноафриканская интеграция и миротворчество.§!\nЭКОВАС опирается на таможенный союз, свободное передвижение и миротворческие интервенции, пытаясь установить порядок в Западной Африке, страдающей от бедности и переворотов. Экономическая интеграция ограничена, но способность к интервенциям редка среди африканских региональных организаций."
 org_mercosur_intro: "§YЮжноамериканский общий рынок§!\n£GFX_org_mercosur_embed \n§gПодпись: таможенный союз и общий рынок Южной Америки.§!\nМЕРКОСУР связывает экономики юга Южной Америки таможенным союзом и общим рынком. Долго сдерживаемый макроэкономическими колебаниями и политическими разворотами участников, он служит хрестоматийным примером региональной интеграции в развивающемся мире."
 org_au_intro: "§YАфриканский союз§!\n£GFX_org_au_embed \n§gПодпись: Аддис-Абеба — штаб-квартира АС.§!\nАС поднимает знамя континентального единства и посредничества в конфликтах, объединяя более пятидесяти африканских государств в одни политические рамки. Экономическая интеграция ограничена, но у него есть особый голос в миротворчестве и урегулировании кризисов."
