 ZZ_neg_armor_light_1: "Подразделение обеспечения лёгкого батальона"
 ZZ_neg_armor_light_1_desc: "Штаб, связь, тыл и медицинское подразделение лёгкого общевойскового батальона, около 110 человек. Действует на высокомобильных машинах, но не входит в штурмовую линию; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_pzgren: "Подразделение обеспечения батальона панцергренадеров"
 ZZ_neg_armor_pzgren_desc: "Штаб, связь, тыл и медицинское подразделение батальона панцергренадеров, около 130 человек. Действует вместе с батальоном на БМП, но вне штурмовой линии; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_pzgren_1: "Подразделение обеспечения батальона панцергренадеров"
 ZZ_neg_armor_pzgren_1_desc: "Штаб, связь, тыл и медицинское подразделение батальона панцергренадеров, около 130 человек. Действует вместе с батальоном на БМП, но вне штурмовой линии; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_tank: "Подразделение обеспечения танкового батальона"
 ZZ_neg_armor_tank_desc: "Штаб, связь, тыл и ремонтное подразделение танкового батальона, около 150 человек. Следует за танковыми ротами на лёгких машинах вне штурмового порядка; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_tank_1: "Подразделение обеспечения танкового батальона"
 ZZ_neg_armor_tank_1_desc: "Штаб, связь, тыл и ремонтное подразделение танкового батальона, около 150 человек. Следует за танковыми ротами на лёгких машинах вне штурмового порядка; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_heli: "Подразделение обеспечения десантно-штурмового батальона"
 ZZ_neg_armor_heli_desc: "Штаб, связь, тыл и медицинское подразделение десантно-штурмового батальона, около 100 человек. Доставляется вертолётами или лёгкими машинами и держится вне штурмового эшелона; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_heli_1: "Подразделение обеспечения десантно-штурмового батальона"
 ZZ_neg_armor_heli_1_desc: "Штаб, связь, тыл и медицинское подразделение десантно-штурмового батальона, около 100 человек. Доставляется вертолётами или лёгкими машинами и держится вне штурмового эшелона; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
