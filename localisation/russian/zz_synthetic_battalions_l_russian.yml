l_russian:
 syn_heavy_bat: "Тяжёлый общевойсковой батальон"
 syn_heavy_bat_desc: "Общевойсковой батальон численностью 740 человек: две танковые роты (28 танков) и две механизированные роты (30 БМП), со штатными противотанковыми, зенитными и командными подразделениями - ядро современной тяжёлой бригады."
 syn_medium_bat: "Средний общевойсковой батальон"
 syn_medium_bat_desc: "Колёсный общевойсковой батальон численностью 650 человек: три роты на колёсных БМП (32 машины) и самоходно-артиллерийский взвод (8 штурмовых орудий), защита обменяна на стратегическую мобильность."
 syn_light_bat: "Лёгкий общевойсковой батальон"
 syn_light_bat_desc: "Лёгкий общевойсковой батальон численностью 600 человек, передвигается целиком на 60 высокомобильных машинах, с четырьмя стрелковыми ротами и штатным миномётным взводом (6 стволов)."
 syn_amphibious_bat: "Амфибийный общевойсковой батальон"
 syn_amphibious_bat_desc: "Амфибийный общевойсковой батальон численностью 600 человек на 34 плавающих БМП и 6 плавающих штурмовых орудиях, подготовлен к высадке с ходу и преодолению водных преград под огнём."
 syn_heavy_bat_USA: "Американский тяжёлый общевойсковой батальон"
 syn_heavy_bat_USA_desc: "Американский общевойсковой батальон (ABCT) численностью 740 человек: две танковые роты (28 танков M1) и две механизированные роты (29 БМП M2), сильная противотанковая и зенитная огневая мощь, наивысшая организация."
 syn_medium_bat_USA: "Американский батальон «Страйкер»"
 syn_medium_bat_USA_desc: "Колёсный американский общевойсковой батальон численностью 680 человек: три механизированные роты (33 БМП «Страйкер») и взвод мобильных орудий, рассчитан на быструю переброску по воздуху."
 syn_light_bat_USA: "Американский лёгкий пехотный батальон"
 syn_light_bat_USA_desc: "Американский лёгкий пехотный батальон (IBCT) численностью 600 человек, передвигается на 41 высокомобильной машине, с четырьмя стрелковыми ротами и противотанковым подразделением."
 syn_amphibious_bat_USA: "Американский амфибийный общевойсковой батальон"
 syn_amphibious_bat_USA_desc: "Американский батальон морской пехоты численностью 650 человек на 32 плавающих БМП и штурмовых орудиях, способен захватывать плацдарм и преодолевать водные преграды под огнём."
 syn_heavy_bat_SOV: "Российский тяжёлый общевойсковой батальон"
 syn_heavy_bat_SOV_desc: "Российская батальонная тактическая группа (БТГ) численностью 920 человек: 31 танк, 35 БМП и усиленный самоходно-артиллерийский дивизион (12 САУ 2С19), мощная противотанковая огневая мощь, но организация ниже из-за малой доли контрактников."
 syn_medium_bat_SOV: "Российский средний общевойсковой батальон"
 syn_medium_bat_SOV_desc: "Российский мотострелковый батальон численностью 700 человек: 35 колёсных БМП и 8 самоходных орудий, баланс защиты и мобильности."
 syn_light_bat_SOV: "Российский лёгкий общевойсковой батальон"
 syn_light_bat_SOV_desc: "Российский лёгкий мотострелковый батальон численностью 600 человек на 45 машинах МТ-ЛБ и «Тигр», со штатной противотанковой и огневой поддержкой."
 syn_amphibious_bat_SOV: "Российский амфибийный общевойсковой батальон"
 syn_amphibious_bat_SOV_desc: "Российский батальон морской пехоты численностью 650 человек на 34 плавающих БМП, умеет форсировать водные преграды и высаживаться на побережье."
 syn_heavy_bat_CHI: "Китайский тяжёлый общевойсковой батальон"
 syn_heavy_bat_CHI_desc: "Китайский тяжёлый общевойсковой батальон численностью 750 человек: две танковые роты (28 ZTZ-99A) и две механизированные роты (30 ZBD-04A), сбалансированный состав, стабильная организация."
 syn_medium_bat_CHI: "Китайский средний общевойсковой батальон"
 syn_medium_bat_CHI_desc: "Китайский колёсный общевойсковой батальон численностью 700 человек: три механизированные роты (33 колёсных БМП ZBL-08) и мобильная артиллерия, ставка на стратегическую мобильность."
 syn_light_bat_CHI: "Китайский лёгкий общевойсковой батальон"
 syn_light_bat_CHI_desc: "Китайский лёгкий общевойсковой батальон численностью 600 человек на 44 штурмовых машинах «Мэнши», силён в горах, джунглях и городах."
 syn_amphibious_bat_CHI: "Китайский амфибийный общевойсковой батальон"
 syn_amphibious_bat_CHI_desc: "Китайский амфибийный общевойсковой батальон численностью 650 человек на 36 плавающих БМП ZBD-05 и штурмовых орудиях ZTD-05, специализируется на высадке с моря."
 ZZ_neg_armor_heavy: "Подразделение обеспечения тяжёлого батальона"
 ZZ_neg_armor_heavy_desc: "Штаб, связь, тыл и медицинское подразделение тяжёлого общевойскового батальона, около 160 человек. Действует на лёгких машинах вместе с тяжёлыми ротами, но не входит в штурмовую линию; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_heavy_1: "Подразделение обеспечения тяжёлого батальона"
 ZZ_neg_armor_heavy_1_desc: "Штаб, связь, тыл и медицинское подразделение тяжёлого общевойскового батальона, около 160 человек. Действует на лёгких машинах вместе с тяжёлыми ротами, но не входит в штурмовую линию; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_medium: "Подразделение обеспечения среднего батальона"
 ZZ_neg_armor_medium_desc: "Штаб, связь, тыл и медицинское подразделение среднего общевойскового батальона, около 140 человек. Действует вместе с ротами на колёсной технике, но не входит в штурмовую линию; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_medium_1: "Подразделение обеспечения среднего батальона"
 ZZ_neg_armor_medium_1_desc: "Штаб, связь, тыл и медицинское подразделение среднего общевойскового батальона, около 140 человек. Действует вместе с ротами на колёсной технике, но не входит в штурмовую линию; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_amphibious: "Подразделение обеспечения амфибийного батальона"
 ZZ_neg_armor_amphibious_desc: "Штаб, связь, тыл и медицинское подразделение амфибийного общевойскового батальона, около 130 человек. Высаживается на лёгких плавающих машинах вместе с батальоном, но не в первой волне; обеспечивает командование, снабжение и эвакуацию техники, повышая организацию, мораль и надёжность техники."
 ZZ_neg_armor_amphibious_1: "Подразделение обеспечения амфибийного батальона"
