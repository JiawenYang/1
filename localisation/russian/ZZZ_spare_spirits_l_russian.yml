l_russian:
 ZZZ_spirit_korea_confederation:0 "Корейская конфедерация"
 ZZZ_spirit_korea_confederation_desc:0 "Два суверенных правительства сохраняют свои границы и институты, совместно используя лишь постоянные органы в сфере обороны, внешней политики и промышленных стандартов. Это не единое государство: выход любой из сторон парализует всю конструкцию."
 ZZZ_spirit_korea_unified:0 "Объединение Корейского полуострова"
 ZZZ_spirit_korea_unified_desc:0 "Линия перемирия исчезла, и весь полуостров управляется единым правительством. Промышленность Юга, ресурсные сети Севера и объединённая армия переходят под единое командование; дивиденды интеграции реальны, но поглощение общества, семьдесят лет живущего в другом государстве, имеет свою цену."
 ZZZ_spirit_uar_unity:0 "Объединённая Арабская Республика"
 ZZZ_spirit_uar_unity_desc:0 "Каир сводит ресурсы и рынки арабского мира в единую административную рамку. Республика черпает легитимность из панарабского знамени, но требования автономии провинций остаются постоянной внутренней трещиной."
 ZZZ_spirit_balkan_federation:0 "Балканская федерация"
 ZZZ_spirit_balkan_federation_desc:0 "Белград использует взаимное экономическое признание и общую оборону, чтобы втянуть балканские государства в рыхлое федеративное сообщество. Члены сохраняют суверенитет; федеральные органы контролируют лишь тарифы, инфраструктуру и совместные силы."
 ZZZ_spirit_eurasian_state:0 "Евразийский союз"
 ZZZ_spirit_eurasian_state_desc:0 "Москва реинтегрирует постсоветское пространство через таможенный союз, единую энергосеть и совместную ПВО. Суверенитет объединяется в макроэкономике и стратегических силах, тогда как культура и управление остаются республикам."
 ZZZ_spirit_eu_federation:0 "Европейская федерация"
 ZZZ_spirit_eu_federation_desc:0 "После передачи странами-членами бюджетного и оборонного суверенитета Брюссель становится фактическим федеральным правительством. Общий бюджет, совместные облигации и европейская армия дают федерации собственную финансовую и военную основу."
 ZZZ_spirit_east_asia_sphere:0 "Сфера сопроцветания Великой Восточной Азии"
 ZZZ_spirit_east_asia_sphere_desc:0 "Токио привязывает экономики Восточной Азии к иерархии с центром в Японии через иеновые кредиты, закупки ресурсов и морской конвой. Сфера связывает участников торговлей и безопасностью ценой их дипломатической самостоятельности."
 ZZZ_spirit_greater_india:0 "Великая Индия"
 ZZZ_spirit_greater_india_desc:0 "Нью-Дели сводит тарифы, железные дороги и водные ресурсы субконтинента в единое административное пространство. Союз оформлен как светское конституционное правление, но религиозные и языковые расколы надолго удерживают высокую цену центральной интеграции."
 ZZZ_spirit_greater_china:0 "Великий Китай"
 ZZZ_spirit_greater_china_desc:0 "После победы в азиатской войне Пекин включает новые территории и морские пути Южно-Китайского моря в центральное планирование. Единый рынок и инфраструктурная сеть усиливают мобилизацию, но доводят сложность управления до предела."
 ZZZ_cr_spirit_korea_confederation:0 "Тест духа: Корейская конфедерация"
 ZZZ_cr_spirit_korea_confederation_desc:0 "Только для отладки: накладывает дух Корейской конфедерации на эту страну для проверки иконки, текста и модификаторов. Обычный путь назначает его автоматически по korean_confederation_formed."
 ZZZ_cr_spirit_uar_unity:0 "Тест духа: Объединённая Арабская Республика"
 ZZZ_cr_spirit_uar_unity_desc:0 "Только для отладки: накладывает дух Объединённой Арабской Республики на эту страну. Обычный путь назначает его автоматически по ZZZ_UAR_victory."
 ZZZ_cr_spirit_balkan_federation:0 "Тест духа: Балканская федерация"
 ZZZ_cr_spirit_balkan_federation_desc:0 "Только для отладки: накладывает дух Балканской федерации на эту страну. Обычный путь назначает его автоматически по PRC_balkan_federation_supported."
 ZZZ_cr_spirit_eurasian_state:0 "Тест духа: Евразийский союз"
 ZZZ_cr_spirit_eurasian_state_desc:0 "Только для отладки: накладывает дух Евразийского союза на эту страну. Обычный путь назначает его автоматически после установления косметического тега SOV_eurasian."
 ZZZ_cr_spirit_eu_federation:0 "Тест духа: Европейская федерация"
 ZZZ_cr_spirit_eu_federation_desc:0 "Только для отладки: накладывает дух Европейской федерации на эту страну. Обычный путь назначает его автоматически по FRA_EU_federalized_global."
 ZZZ_cr_spirit_east_asia_sphere:0 "Тест духа: Сфера сопроцветания Великой Восточной Азии"
 ZZZ_cr_spirit_east_asia_sphere_desc:0 "Только для отладки: накладывает дух Сферы сопроцветания на эту страну. Обычный путь назначает его автоматически по gaw_japan_victory_settled."
 ZZZ_cr_spirit_greater_india:0 "Тест духа: Великая Индия"
 ZZZ_cr_spirit_greater_india_desc:0 "Только для отладки: накладывает дух Великой Индии на эту страну. Обычный путь назначает его автоматически по gaw_japan_victory_settled."
 ZZZ_cr_spirit_greater_china:0 "Тест духа: Великий Китай"
 ZZZ_cr_spirit_greater_china_desc:0 "Только для отладки: накладывает дух Великого Китая на эту страну. Обычный путь назначает его автоматически по gaw_china_victory_settled."
 ZZZ_spirit_china_reunification:0 "Воссоединённый Китай"
 ZZZ_spirit_china_reunification_desc:0 "Раздел по проливу закрыт: промышленность, порты и администрация острова включены в континентальную систему. Воссоединение решает вопрос суверенитета, но пока не делает Пекин арбитром всего азиатского порядка."
 ZZZ_spirit_indochina_federation:0 "Индокитайская федерация"
 ZZZ_spirit_indochina_federation_desc:0 "Ханой привязывает Лаос и Камбоджу к единому индокитайскому административному пространству через партийные сети, валютную привязку и общую инфраструктуру. Федерация восстанавливает рамку колониальной эпохи под руководством Вьетнама, и малые участники относятся к ней с опаской."
 ZZZ_spirit_yugoslavia_revival:0 "Югославское возрождение"
 ZZZ_spirit_yugoslavia_revival_desc:0 "Белград собирает Западные Балканы в югославскую рамку, обменивая военную вражду на таможенный союз, общую полицию и объединённое командование. Старый вопрос возвращается в прежнем виде: может ли одна столица удержать несколько народов вместе."
 ZZZ_spirit_ottoman_restoration:0 "Османское возрождение"
 ZZZ_spirit_ottoman_restoration_desc:0 "Неоосманская линия доведена до конца: Анкара отстраивает сферу влияния на землях прежней империи с османской символикой, военными миссиями и общим рынком. Республика сохраняет конституцию, но управляет как восстановленная империя."
 ZZZ_cr_spirit_china_reunification:0 "Тест духа: Воссоединённый Китай"
 ZZZ_cr_spirit_china_reunification_desc:0 "Только для отладки: накладывает дух Воссоединённого Китая на эту страну для проверки иконки, текста и модификаторов. Обычный путь назначает его автоматически по PRC_taiwan_war_won."
 ZZZ_cr_spirit_indochina_federation:0 "Тест духа: Индокитайская федерация"
 ZZZ_cr_spirit_indochina_federation_desc:0 "Только для отладки: накладывает дух Индокитайской федерации на эту страну. Обычный путь назначает его автоматически по gaw_china_victory_settled."
 ZZZ_cr_spirit_yugoslavia_revival:0 "Тест духа: Югославское возрождение"
 ZZZ_cr_spirit_yugoslavia_revival_desc:0 "Только для отладки: накладывает дух Югославского возрождения на эту страну. Обычный путь назначает его автоматически по SER_destroy_albanian_n."
 ZZZ_cr_spirit_ottoman_restoration:0 "Тест духа: Османское возрождение"
 ZZZ_cr_spirit_ottoman_restoration_desc:0 "Только для отладки: накладывает дух Османского возрождения на эту страну. Обычный путь назначает его автоматически после завершения TUR_ottoman_politics."
 ZZZ_spirit_canzuk:0 "Союз CANZUK"
 ZZZ_spirit_canzuk_desc:0 "Лондон, Оттава, Канберра и Веллингтон объединяют рынки, оборонное планирование и дипломатическое представительство в единую рамку CANZUK. Свободное передвижение и совместные закупки связывают четыре экономики Содружества в один блок, при этом каждый участник сохраняет свой парламент."
 ZZZ_spirit_maphilindo:0 "Мафилиндо"
 ZZZ_spirit_maphilindo_desc:0 "Куала-Лумпур, Манила и Джакарта возрождают идею Мафилиндо как конфедерацию малайского мира: общие рынки, согласованные морские патрули и единая позиция по Южно-Китайскому морю. Проект опирается на слабые институты и на подозрительность каждой стороны к столице, претендующей на лидерство."
 ZZZ_spirit_nordic_union:0 "Северный союз"
 ZZZ_spirit_nordic_union_desc:0 "Пять северных государств объединяют рынки труда, оборонные закупки и дипломатические службы в единый Северный союз. Высокий уровень жизни и малые населения делают интеграцию дешёвой; вес союза в Европе соответственно растёт."
 ZZZ_cr_spirit_canzuk:0 "Тест духа: Союз CANZUK"
 ZZZ_cr_spirit_canzuk_desc:0 "Только для отладки: накладывает дух Союза CANZUK на эту страну. Обычный путь назначает его автоматически по национальному флагу is_CANZUK."
 ZZZ_cr_spirit_maphilindo:0 "Тест духа: Мафилиндо"
 ZZZ_cr_spirit_maphilindo_desc:0 "Только для отладки: накладывает дух Мафилиндо на эту страну. Обычный путь назначает его автоматически по национальному флагу is_MAPHI."
 ZZZ_cr_spirit_nordic_union:0 "Тест духа: Северный союз"
 ZZZ_cr_spirit_nordic_union_desc:0 "Только для отладки: накладывает дух Северного союза на эту страну. Обычный путь назначает его автоматически по национальному флагу is_SCA."
 ZZZ_spirit_cam_union:0 "Союз Центральной Америки"
 ZZZ_spirit_cam_union_desc:0 "Манагуа включает Гондурас, Гватемалу, Сальвадор и Белиз в единый партийно-государственный и военный аппарат, возрождая центральноамериканскую федеративную рамку. Союз держится на революционном авангарде и органах безопасности, а не на представительных процедурах."
 ZZZ_spirit_cam_republic:0 "Центральноамериканская республика"
 ZZZ_spirit_cam_republic_desc:0 "Сан-Сальвадор включает Никарагуа, Гондурас и Белиз в республику с центром в президентской власти, удерживая порядок через силы безопасности, фискальную централизацию и внешние соглашения. Её легитимность опирается на безопасность и рост, а не на федеральное разделение власти."
 ZZZ_cr_spirit_cam_union:0 "Тест духа: Союз Центральной Америки"
 ZZZ_cr_spirit_cam_union_desc:0 "Только для отладки: накладывает дух Союза Центральной Америки на эту страну. Обычный путь назначает его автоматически по CAM_union_formed."
 ZZZ_cr_spirit_cam_republic:0 "Тест духа: Центральноамериканская республика"
 ZZZ_cr_spirit_cam_republic_desc:0 "Только для отладки: накладывает дух Центральноамериканской республики на эту страну. Обычный путь назначает его автоматически по CAM_republic_formed."
