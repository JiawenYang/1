MEX_continue_the_fourth_transformation: "Продолжить Четвертую трансформацию"
MEX_continue_the_fourth_transformation_desc: "После победы нашего движения в 2018 году 2019 год стал периодом консолидации и организации. Теперь, в 2020 году, начинается истинный тест: запустить глубокую и долговечную трансформацию национальной жизни. Мексика пережила три великих главы, которые навсегда изменили ее историю: Независимость, Реформа и Революция. Каждая из них преобразовала судьбу нации. Сегодня народ доверил нам новую трансформацию, направленную на искоренение коррупции, борьбу с неравенством и восстановление надежды для миллионов мексиканцев. Это рассвет новой эры. Мы не можем сбить замысел, ибо судьба Мексики требует, чтобы мы выполнили народный мандат: добиться истинной трансформации, чествующей прошлое и строящей будущее справедливости, демократии и суверенитета. Не лгите, не крадите и не предавайте народ!"

ZAP_teasing_focus: "Сапата живет, борьба продолжается"

