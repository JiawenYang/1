MEX_andres_manuel_lopez_obrador_char: "Андрес Мануэль Лопес Обрадор"
MEX_andres_manuel_lopez_obrador_char_desc: "Андрес Мануэль Лопес Обрадор, более известный как AMLO, родился в Тепетитане, Табаско, в семье торговцев, занимавшихся сельским хозяйством. С раннего возраста он видел тяготы южной Мексики, опыт, который глубоко сформировал его политическое мировоззрение. \n\nПозже он переехал в Мексику, где изучал политологию и государственное управление в Национальном автономном университете Мексики (UNAM). Именно в этот период он все больше вовлекался в национальную политику. Вернувшись в Табаско, он сначала присоединился к Институциональной революционной партии (PRI), но после внутренних споров в 1980-х годах ушел и присоединился к оппозиции во главе с Кауатемок Карденасом. Вскоре он стал членом Партии демократической революции (PRD), где его харизма и политические навыки быстро вывели его на первый план. \n\nВ 2000 году он был избран Глава Правительства Мексики в качестве кандидата PRD. Его пребывание усиливало его репутацию как лидера, близкого к народу, особенно после спорного импичмента, инициированного президентом Вицентом Фоксом, который стремился исключить его из политики. Вместо того чтобы ослабить его, эта попытка подняла Лопеса Обрадора на национальный уровень. \n\nОн баллотировался за президентство в 2006 и снова в 2012 году, оба раза безуспешно. После споров внутри PRD он основал свою собственную партию — Национальное движение регенерации (MORENA). На своей третьей попытке, в 2018 году, он наконец выиграл президентство с более чем 50% голосов. Эта победа установила MORENA как доминирующую политическую силу в Мексике, вытеснив традиционные партии. Лопес Обрадор представляет себя лидером «Четвертой трансформации», проекта, который он ставит на один исторический уровень с Независимостью (1810), Реформой (1857) и Революцией (1910). Сегодня он управляет поляризованной нацией: восхищается миллионами, которые видят в нем президента, близкого к народу, но жестко критикуется теми, кто опасается его конфликтующего стиля и централизации власти."
MEX_claudia_sheinbaum_char: "Клаудия Шайнбаум Пардо"
MEX_claudia_sheinbaum_char_desc: "Клаудия Шайнбаум Пардо родилась в июне 1962 года в бывшем Федеральном округе, ныне Мексике. Дочь еврейских ученых, специализирующихся на науке, Клаудия с самого раннего возраста была связана с политикой, так как ее отец был активным членом Мексиканской коммунистической партии. Она изучала физику в Национальном автономном университете Мексики (UNAM). Во время университетской жизни Клаудия участвовала в различных левых студенческих движениях в UNAM, которые были очень активны в 80-х годах из-за политической нестабильности страны в то время. Эти студенческие движения приблизили Клаудию к национальной политике. После окончания учебы Клаудия получила магистерскую и докторскую степени, специализируясь на экологическом инженерном деле. \n\nВ начале 90-х годов Клаудия присоединилась к рядам Партии демократической революции (PRD), где она завязала крепкие связи с топовыми фигурами партии, такими как Карлос Имаз и Андрес Мануэль Лопес Обрадор (AMLO). В 2000 году, с победой AMLO как главы правительства Мексики, Клаудия была назначена секретарями окружающей среды правительства Мексики. В это время ее связи с Андресом Мануэлем укрепились. В 2006 году она выступала как пресс-секретарь кандидата AMLO. После поражения AMLO Клаудия оставалась активной в активизме. В 2014 году она вместе с AMLO участвовала как основательница партии MORENA, снова поднявшись в мексиканской политике, став первой женщиной-главой района Талпан (CDMX), а затем, в 2018 году, первой женщиной-Главой Правительства Мексики. Там ее способности как государственный служащий начали замечаться, с экологическим, техническим подходом, тесно связанным с наукой и умеренной администрацией. Возможно, именно эта способность и ее крепкая связь с Андресом Мануэлем привели к тому, что она была выбрана преемником партии MORENA, став первой женщиной-президентом Мексики. Теперь Клаудия сталкивается с задачей управлять страной, глубоко отмеченной нестабильностью во всех смыслах: социальной, политической и экономической."
MEX_marcelo_ebrad_char: "Марсело Луис Эбрард Касаубон"
MEX_marcelo_ebrad_char_desc: "Марсело Луис Эбрард Касаубон родился в Мексике, тогда называемой Федеральным округом, из семьи французского происхождения. Он учился в школе Симона Боливара и окончил образование с дипломом по международным отношениям в Эль Колехио де Мексико в 1984 году, в возрасте 25 лет.\n\nВо время учебы он начал работать с Институциональной революционной партией в 1981 году, сумев войти в политику в очень молодом возрасте, и много раз меняя свою партийную принадлежность, прежде чем остановиться на MORENA в 2018 году. Он был очень близок к Мануэлю Камacho Солису и Андресу Мануэлю Лопесу Обрадору, что принесло ему важные должности, такие как Глава Государства Федерального округа.\n\nВо время его лидерства столицы он был популярным человеком, и с поддержкой AMLO, после краткосрочного самопризнанного изгнания во Франции в 2015-2018 годах в результате обвинений в коррупции, он стал одним из самых доверенных лидеров MORENA, став даже министром иностранных дел в том же году.\n\nТеперь он лидер страны в кризисе. По мере того как последствия войн картелей начинают быть полностью поняты, его мандат как президента Мексики может считаться самым важным для стабильности страны с конца Мексиканской революции.\n\nСможет ли Эбрард Касаубон вернуть нормальность, или Мексика будет брошена в новую тьму?"
MEX_adan_augusto_char: "Адан Аугусто Лопес Эрнандес"
MEX_adan_augusto_char_desc: "Адан Аугусто Лопес Эрнандес родился в сентябре 1962 года в Параисо, Табаско. Сын влиятельного регионального нотариуса, он изучал право в Хуаресском автономном университете Табаско. Благодаря политическим связям своей семьи, он рано вступил в Институциональную революционную партию (PRI), где познакомился с Андресом Мануэлем Лопесом Обрадором (AMLO). Он поддерживал первые политические кампании AMLO в штате; хотя Лопес Обрадор тогда не выиграл, Адан Аугусто оставался на различных бюрократических должностях в государственной администрации.\n\nВ 2000-х годах он формально начал свою политическую карьеру в Партии демократической революции (PRD), быстро поднимаясь в фракции, близкой к Лопесу Обрадору, и набирая опыт в качестве политического оператора. Позже он вместе с AMLO покинул PRD, чтобы стать основателем Национального движения регенерации (MORENA), установив себя как одну из самых близких фигур к лидеру движения. Эта близость привела к его кандидатуре на пост губернатора Табаско в 2018 году, победе с дискурсом, выровненным с проектом тогдашнего президента-электа Лопеса Обрадора. Однако его государственная администрация столкнулась с критикой по поводу предполагаемой коррупции и вопросов о государственном управлении.\n\nЕго близкие отношения с президентом привели к его назначению министром внутренних дел в 2012 году, что сделало его центральной фигурой федерального правительства и ключевым оператором для консолидации официального политического проекта. Он выделялся абсолютной лояльностью к президенту, разделяя большую часть его идеологического видения и прагматизма, а также демонстрируя notevольную способность к переговорам и политическому контролю.\n\nАдан Аугусто также известен своим твердым стилем лидерства и авторитарными тенденциями, открыто показав недоверие к прессе и политической оппозиции. Теперь у руля слабой и расколотой мексиканской нации некоторые считают возможным возвращение к старой системе PRI для восстановления стабильности Мексики, хотя истинный охват его правительства может быть оценен только со временем."

