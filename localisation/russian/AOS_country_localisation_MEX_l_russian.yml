MEX.news.101.t: "Сапатисты захватили Мексику!"
MEX.news.101.d: "Шокирующие новости приходят из Мексики сегодня, когда Субкомандианте Моисе провозгласил новую эпоху для страны. Последние остатки картелей и федеральных сил сдались, и вся власть перешла в руки анархо-коммунистических муниципалитетов, следуя сапатской модели в Чиапасе.\n\nНесмотря на реакционное сопротивление из разных мест и слоев общества, такие подходы, как прагматичное отношение к политическим заключенным, уважение законов войны в ходе конфликта, обещания стабильности и равенства, а также жесткая позиция по отношению к людям, желающим создать новые картели с нуля, дали им достаточно популярности, чтобы стать в основном стабильной единицей, одним из немногих либертарианских социалистических экспериментов, выживших в огне войны и живущих, чтобы рассказать эту историю. Международное сообщество теперь пытается понять, как к ним подходить как к негосударственному субъекту, первому стабильному с создания Организации Объединенных Наций в 1945 году.\n\nПо мере установления мира, жизнь продолжается как обычно, несмотря на изменения в организации. Анархо-коммунисты и анархисты по всему миру теперь собираются вокруг Моисе, утверждая, что это доказывает, что анархизм может и будет работать в правильных условиях."
MEX.news.101.a: "Борьба — это как круг. Можно начать с любого момента, но она никогда не заканчивается. — Субкомандианте Маркос"

MEX.news.103.t: "Евангелисты захватили Мексику!"
MEX.news.103.d: "В сцене, которая могла быть взята из фильма, лидер La Luz del Mundo, Наасон Хоакин Гарсия, поднялся с своего пьедестала и провозгласил, что страна будет переименована в «Небесное Царство нашего Отца», и что теократическое правление будет установлено по всей Мексике. Массы были эйфоричны.\n\nСитуацию сравнивают с Иранской революцией 1979 года: ранее светская страна, которая в итоге стала религиозной теократией. Все началось, когда начались войны картелей: временный альянс с федеральным правительством в итоге был разорван, и вопреки всем ожиданиям, они не только выжили после наступлений мексиканских армий, но и уничтожили всех своих врагов по одному, пока не провозгласили победу. Это было очень маловероятно, и как результат, эвангелическое вероубеждение возросло не только в Мексике, но и по всему миру: они уверены, что только Бог Сам мог дать им силу победить в таком слабом начальном положении.\n\nМеждународные организации обеспокоены тем, что начались массовые принудительные обращения католиков, что было осуждено Ватиканом. В такой католической стране это действие может легко означать сокрушительный удар по уже хрупкому государству."
MEX.news.103.a: "Ты не знаешь, насколько ты силен, пока быть сильным — это твой единственный оставшийся выбор."

MEX.news.104.t: "Возвращение рыцарей-темпляров"
MEX.news.104.d: "Хаос в Мексике остановился, одна фракция победила над всеми. Результат конфликта был неожиданным для любого серьезного военного аналитика, и тем не менее это произошло: картель Рыцарей-темпляров сумел взять под контроль Мексику и, вопреки ожиданиям многих, фактически обещал установить теократию в Мексике, вместо того чтобы использовать это как прикрытие для наркоторговли.\n\nМеждународное сообщество шокировано. Папы отвергли легитимность нового субъекта, заявив, что они не истинные католики, и опубликовал энциклику, осуждающую их. Внутри Мексики, однако, это получило некоторую поддержку, несмотря на то, что многие считают эту самопровозглашенную «Орден-государство» (отсылая к Государству Тевтонского Ордена) ничем иным, как способом для победивших наркобаронов оставаться у власти с дополнительной легитимностью. Некоторые даже требуют военного вмешательства.\n\nХрупкий альянс в начале войн картелей между ними и La Nueva Familia Michoacana закончился внутренним переворотом, который привел к власти Темпляров, и вопреки всем ожиданиям они сумели победить всех своих врагов. Только время покажет, останется ли это новое состояние дел, или оно рухнет под собственным весом."
MEX.news.104.a: "Псалом 119:137; Праведен Ты, Господи, и правы Твои уставы."

MEX.news.105.t: "Клаудия Шайнбаум избрана президентом Мексики"
MEX.news.105.d: "После окончания войн картелей, во время которых были разгромлены многие враги Мексики, наконец-то были проведены выборы, чтобы определить преемника уходящего президента Андреса Мануэля Лопеса Обрадора. В напряженной политической кампании между коалициями MORENA и PRI-PAN опросы объявили, что кандидат MORENA д-р Клаудия Шайнбаум Пардо станет первой женщиной-президентом Мексики с перевесом в голосовании, доказывающим это. Ее победа твердо утверждает позицию MORENA как доминирующей партии в Мексике и мандат на осуществлениеvision президента Обрадора «Четвертой трансформации».\n\nКлаудия, известная своим умеренным лидерством в MORENA, в первую очередь сосредоточена на создании администрации, сфокусированной на науках, окружающей среде и продолжении многих социальных политик своего наставника, которые помогли поднять миллионы мексиканцев из бедности. В настоящее время улицы заполнены припевами и欢呼声 за успех еврейской мексиканской женщины, которая вскоре займет пост президента с момента основания нации более 200 лет назад. \n\nТем не менее, сохраняются сомнения о том, как Клаудия Шайнбаум справится с реконструкцией мексиканского государства после окончания жестокой гражданской войны. Поскольку эксперты предупреждают о возможном возвращении картелей и остатки закаленных революционеров продолжают партизанскую войну, только время ответит, сможет ли Клаудия справиться как с внутренними делами своей нации, так и с ее местом в совершенно иной геополитической обстановке."
MEX.news.105.a: "Четвертая трансформация..."

MEX.news.106.t: "Марсело Эбрард избран президентом Мексики"
MEX.news.106.d: "С окончанием войн картелей Мексика наконец смогла провести выборы, чтобы определить, кто наследует уходящему президенту Андресу Мануэлю Лопесу Обрадору. Жестокие выборы между коалицией MORENA и альянсом PRI-PAN закончились, и опросы объявили, что кандидат MORENA Марсело Эбрард выиграл с комфортным большинством голосов. Его победа укрепляет MORENA как политическую силу, с которой следует считаться, и продолжает проект президента AMLO «Четвертой трансформации».\n\nМарсело Эбрард был кандидатом, который обещал возглавить новую администрацию, которая примет технократический и прогрессивный подход к управлению нацией, при этом многие аналитики указывают на его прошлую работу в качестве Глава Правительства Мексики как на представление о том, как он будет управлять нацией. Его время на этой должности характеризовалось фокусом на административной эффективности, модернизации институтов и продолжении социальных программ, продвигаемых предыдущим правительством. Однако ожидается, что он возглавит иной подход к платформе MORENA, что может означать новую фазу революции MORENA в демократии Мексики, хотя некоторые сторонники опасались возвращения к неолиберальному подходу к экономике. \n\nОднако теперь в руках Марсело возможность направить Мексику к новой эпохе, одновременно гарантируя, что реконструкция государства не рухнет из-за остатков картельных ячеек и других повстанческих организаций. Марсело также имеет отличную возможность установить позицию Мексики на мировой арене, при этом последствия Второй американской гражданской войны вызывают массовую глобальную реорганизацию великих держав и сфер влияния."
MEX.news.106.a: "Новое видение Мексики?"

MEX.news.107.t: "Адан Аугусто избран президентом Мексики"
MEX.news.107.d: "После окончания войн картелей раненая, но выжившая нация Мексики продолжила проводить выборы, чтобы найти нового преемника уходящего президента Андреса Мануэля Лопеса Обрадора. После напряженной политической кампании между коалицией MORENA и оппозицией PRI-PAN кандидат MORENA Адан Аугусто Лопес Эрнандес выиграл выборы с небольшим большинством голосов. Известный своим близким личным отношением к президенту AMLO, его триумф помог консолидировать MORENA как доминирующую силу в политике Мексики и продолжение политики президента AMLO «Четвертой трансформации».\n\nОднако перспектива, стоящая перед новым президентом, не так благоприятна, как могут показать опросы. Мексиканская оппозиция в основном остается в протесте против входящей администрации, опасаясь более централизованного видения власти со стороны президентского кабинета, угрожающего автономии крупных институтов в рамках федерального правительства и свободам СМИ. Критики утверждают, что его близость к президенту AMLO приведет только к минимальным изменениям в управлении и администрировании правительства под MORENA, при этом уходящий президент имел напряженные отношения с Верховным судом.\n\nНесмотря на эти критики, от Адан Аугусто зависит вести Мексику через ее стадию реконструкции и обеспечить полное примирение оставшихся картельных и антиправительственных ячеек сопротивления."
MEX.news.107.a: "Проект преемственности..."
TFX_USA_mex_transfer.1.t: "Судьба Золотого Орла"
TFX_USA_mex_transfer.1.d: "После завершения целей Плана Войны Зеленой и устранения правительства Мексики мы обеспечили безопасность нашего южного границы и положили конец хаосу, который поражал Мексику с начала Второй американской гражданской войны. Картели, идеологические фанатики, анархисты и любая другая форма оппозиции были разгромлены силой нашего возрожденного военного могущества. \n\nВ то время как наши граждане и войска радуются нашей победе, наша администрация достигла нерешаемого тупика по поводу судьбы Мексики. Отмечается, что Мексика имеет значительное население, которое может продолжать партизанские движения против наших оккупационных сил, и что география такой большой нации может стать очень опасным болотом для удержания, возможно, даже превратившись в нашу собственную Вьетнам или Афганистан прямо у нашей границы. Поэтому некоторые голоса предложили создать «транситное» правительство, ориентированное на наши интересы и взгляды, чтобы слегка успокоить население. Действительно, есть лица, поддерживаемые определенными группами интересов в Мексике, которые выразили желание стабилизировать свою нацию и возобновить нашу дружбу друг с другом.\n\nС другой стороны, хардлайнеры и военныеhawks считают, что даже измученная Америка все еще может контролировать всю Мексику и восстановить порядок любыми средствами. Мексика также очень богата ресурсами, что может помочь стимулировать нашу экономику на основании того, что мы «помогаем» инвестировать в разорванные войной регионы Мексики. Мы также никогда не можем позволить возвращению каких-либо организаций наркокартелей, чтобы они продолжали заражать американцев фентанилом, опиоидами и другими синтетическими наркотиками. Даже если нам, возможно, придется неохотно заботиться о мексиканском населении, которое может подчиняться нашему правилу, по крайней мере, у них нет границы, через которую можно перепрыгнуть.\n\nПосле выслушивания споров каждой стороны и решения головных болей, было принято окончательное решение, и судьба Мексики..."
TFX_USA_mex_transfer.1.a: "Создать временное правительство, дружелюбное к Вашингтону, и пусть мексиканцы наслаждаются своей «автономией»"
TFX_USA_mex_transfer.1.b: "Продолжить военную оккупацию Мексики и обеспечить, чтобы они не превратились в назойливость"
