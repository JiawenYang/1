MEX_north_american_free_trade_agreement_idea: "Североамериканское соглашение о свободной торговле"
MEX_north_american_free_trade_agreement_idea_desc: "\n\n\n\n£GFX_MEX_nafta_banner\n\n\n\n\n\nСевероамериканское соглашение о свободной торговле, подписанное в 1994 году Карлосом Салинасом де Гортари, радикально трансформировало экономику Мексики. Оно открыло двери капиталу и товарам из Соединенных Штатов и Канады, реструктурировав производственную систему страны в направлении экспорта, часто в ущерб внутреннему производству. \nВ 2018 году соглашение было переговарено и переименовано в Соглашение США-Мексика-Канада (USMCA). Несмотря на новые условия, экономическая зависимость Мексики от американского рынка стала еще более крепкой. USMCA является двигателем роста, но также напоминает о уязвимости Мексики перед решениями, принимаемыми в Вашингтоне."
MEX_massive_social_programs_dynamic: "Массивные социальные программы"
MEX_massive_social_programs_dynamic_desc: "\n\n\n\n£GFX_MEX_massive_social_programs_banner\n\n\n\n\n\nС момента вступления в должность правительство Четвертой трансформации запустило амбициозную сеть социальных программ, направленных на снижение бедности и неравенства по всей Мексике. Стипендии для студентов, финансовая поддержка пожилых людей, людей с ограниченными возможностями и безработных молодых людей, а также инвестиции в маргинализированные сообщества образуют основу политики, стремящейся восстановить центральную роль государства в социальном благосостоянии. \nЭти инициативы завоевали правительству сильную популярную поддержку, особенно среди уязвимых слоев. Однако они также создают нагрузку на государственные финансы и вызывают критику оппозиции, которая обвиняет их в клиентелизме и неустойчивости в долгосрочной перспективе.\nНесмотря на споры, эти программы остаются одной из самых видимых опор текущего политического проекта. Укрепляя связь правительства с народом и преобразуя социальный ландшафт Мексики."
MEX_militarization_of_the_public_life_dynamic: "Милитаризация общественной жизни"
MEX_militarization_of_the_public_life_dynamic_desc: "\n\n\n\n£GFX_MEX_militarization_of_public_life_banner\n\n\n\n\n\nС начала президентства Филипе Калдерона и объявления «войны с наркотиками» Мексика попала в спирали насилия, с которой не справлялись обычные правоохранительные органы. В ответ на это Калдерон перебросил Армию и Военно-морской флот из казарм на улицы для борьбы с наркокартелями, ознаменовав начало их прямого участия в гражданской жизни. При Энрике Пене Ньето роль вооруженных сил в внутренней безопасности была еще больше усилена. \n\nХотя Андрес Мануэль Лопес Обрадор пришел к власти, обещав вернуть военных в казармы, это обещание не было выполнено. Его администрация создала Национальную гвардию — силу с преимущественно военной структурой — и расширила роль военных в государственном управлении и крупных инфраструктурных проектах. \nЭтот растущий милитаризм отражает, как СЕДЕНА и СЕМАР восстановили политическое влияние после десятилетий маргинализации, начиная с президентства Мигелем Алеманом (1946-1952). Сегодня мексиканцы привыкли видеть бронетехнику на автомагистралях, вертолеты военно-морского флота в небе и открытое столкновение в городских районах. \n\nЭто развертывание вызвало напряженность в гражданском обществе, подорвав восприятие гражданских свобод, подчеркивая неспособность государства контролировать преступные группировки и вызывая опасения по поводу национальной стабильности. Тем не менее, несмотря на споры, СЕДЕНА и СЕМАР остаются среди самых доверяемых институтов страны, пользующихся высоким уровнем одобрения со стороны общества."
MEX_ghost_of_the_perfect_dictatorship_idea: "Призрак совершенной диктатуры"
MEX_ghost_of_the_perfect_dictatorship_idea_desc: "\n\n\n\n£GFX_MEX_ghost_of_the_perfect_dictatorship_banner\n\n\n\n\n\nБолее 70 лет Институциональная революционная партия (PRI) формировала политическую, экономическую и социальную жизнь Мексики с почти абсолютным контролем. Это была настоящая политическая левіафан, знаменито описанная Марио Варгас Люсой как «совершенная диктатура». \nЕе система корпоративизма, клиентелизма и авторитарного контроля оставила глубокий след в институтах страны, частном секторе, политической культуре и обществе в целом. Хотя PRI больше не владеет гегемонией, как раньше, ее наследие остается в сетях власти, традиционных элитах и самом способе практики политики в Мексике. Фактически, многие современные партии и институты ведут свое происхождение от PRI, неся с собой много ее старых пороков. \nСегодня призрак PRI все еще преследует политику, экономику и социальную жизнь Мексики. Это нелепое привидение, поддерживающее клиентелизм, коррупцию, бюрократическую неэффективность и авторитарную инерцию, тем самым блокируя полную демократизацию, политическую модернизацию и развитие нации во всех сферах."
MEX_a_revolutionary_past_idea: "Революционное прошлое"
MEX_a_revolutionary_past_idea_desc: "\n\n\n\n£GFX_MEX_a_revolutionary_past_banner\n\n\n\n\n\nМексиканская революция оставила глубокий след в социальной и политической жизни страны. Даже спустя столетие ее основные идеи — социальная справедливость, перераспределение земли, государственное вмешательство в стратегические сектора, национализм и сохранение традиционных ценностей, таких как римско-католицизм — продолжают формировать мексиканское общество и государство. Несмотря на экономические и политические изменения последних десятилетий, население все еще крепко держится за принципы, рожденные в тот исторический период. Это привело к широкому отвержению политических движений, угрожающих наследию Революции, и общему недоверию к экстремалистским идеологиям, как лево-, так и право-ориентированным. \n\nЭто историческое наследие заставило политиков адаптировать свою риторику и политику, чтобы не конфликтовать с революционными идеалами. Государственные предприятия, такие как PEMEX и CFE, выжили в волне неолиберальной приватизации, а политические партии были вытеснены к центру, чтобы избежать нестабильности и общественного недовольства. \nРеволюционное прошлое Мексики служит постоянным напоминанием о значимости государства в экономической и социальной жизни, влияя на современную политику и формируя то, как граждане воспринимают свою страну и свои права."
MEX_central_american_caravans_idea: "Центральноамериканские караваны"
MEX_central_american_caravans_idea_desc: "\n\n\n\n£GFX_MEX_central_american_caravans_banner\n\n\n\n\n\nС 2018 года Мексика стала главным маршрутом для тысяч мигрантов, бежавших от насилия, бедности и политической нестабильности в Центральной Америке. Целые семьи присоединились к массивным караванам, путешествующим по стране в надежде достичь Соединенных Штатов, создав беспрецедентную гуманитарную проблему. \n\nМексиканское государство сейчас сталкивается с давлением как внутри страны, так и извне: с одной стороны, оно должно гарантировать права человека и оказывать базовую помощь мигрантам; с другой стороны, его отношения с Вашингтоном напряжены из-за требований сдержать миграционный поток. Эта ситуация полярзует национальное общественное мнение, разделяя тех, кто видит эти караваны как акт солидарности, и тех, кто считает их бременем для безопасности и экономики страны. \n\nЗа пределами непосредственного кризиса то, как Мексика управляет этим явлением, определит ее политический и дипломатический путь, отражая напряжения между ее гуманитарной ролью, внутренними ограничениями и давлением мощного северного соседа."
MEX_cartel_presence_severe_tfx_edition: "Тяжелое присутствие картелей"
MEX_cartel_presence_severe_tfx_edition_desc: "\n\n\n\n£GFX_MEX_severe_cartel_presence_banner\n\n\n\n\n\nС конца 20-го века наркокартели Мексики эволюционировали от контрабандистских сетей, подчиненных колумбийским наркобаронам, в мощные криминальные империи. Фрагментация государства и широкая коррупция среди местных властей позволили им установить территориальный контроль над несколькими регионами, осуществляя политическую и экономическую власть, параллельную правительству. Начиная с 2000-х годов, так называемая «война с наркотиками» развязала беспрецедентную спиралю насилия, так как распад крупных организаций породил множество соперничающих группировок, конкурирующих за маршруты, районы и незаконные рынки. Сегодня картели не только доминируют в наркоторговле, но и занимаются вымогательством, незаконной добычей руды, похищениями и социальным контролем через страх. Их всепроникающее присутствие подрывает власть государства, подрывает доверие к демократическим институтам и осложняет любые попытки примирения или развития."
MEX_a_oil_bonaza: "Нефтяная роскошь"

MEX_mexican_resconstruction_idea: "План реконструкции Мексики"
MEX_collapsed_authority_tfx: "Свернувшаяся власть"
MEX_collapsed_authority_tfx_desc: "ХАОС! По мере разложения конституционного порядка по всей стране, рухнут и общественные услуги. Здравоохранение, образование, экономика... все становятся вторичными боями на фоне войны. Иностранные компании уходят, миллионы наших собственных людей покидают разорванную войной страну, а многие другие попадают в руки повстанческих групп, картелей и других насильственных гильд. Распределение таких базовых вещей, как вода и еда, нарушено на больших территориях, и в сочетании с военными операциями это приводит к большим потерям среди гражданского населения. Состояние краха нашего северного соседа только усугубляет ситуацию."

MEX_CSTO_cooperation: "Мексиканско-ОДКБ сотрудничество"
MEX_NATO_cooperation: "Мексиканско-НАТО сотрудничество"

MEX_death_of_the_giant_idea: "Смерть гиганта"
MEX_death_of_the_giant_idea_desc: "\"Бедная Мексика. Так далеко от Бога и так близко к Соединенным Штатам.\"\n   - Порфирио Диас\n\nЭти слова эхо в душах каждого мексиканца, который жил под тенью нашего северного соседа. Теперь эта тень больше не нависает над нами, ибо Гигант Америки рухнул под собственным весом в воюющие фракции, борющиеся за доминирование. Вопли и вскрики наших соседей, застреливающих друг друга, пугают наш народ. Но худшая потеря — это потеря нашей экономической взаимозависимости, и она парализовала нашу экономику, подобно тому, как это было в «Утраченном десятилетии». Между тем, силы в нашем населении начинают пробуждаться, провозглашая смерть Америки временем освободить наши оковы за счет республиканских идеалов."

