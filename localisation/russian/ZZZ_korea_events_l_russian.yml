l_russian:
 zzz_kor.1.t:0 "Переговоры на полуострове возобновлены"
 zzz_kor.1.d:0 "Спустя более семидесяти лет после перемирия Север и Юг снова сидят за одним столом. Международное сообщество предоставило площадку и гарантии; делегации провели закрытые заседания о мерах доверия, экономическом сотрудничестве и облике будущего урегулирования. Насколько далеко зайдут переговоры, зависит от решения обоих правительств."
 zzz_kor.1.a:0 "Продолжать переговоры."
 zzz_kor.1.b:0 "Прервать этот раунд."
 zzz_kor.2.t:0 "Конфедерация на полуострове"
 zzz_kor.2.d:0 "Переговоры принесли прорыв. Стороны подписали рамочное соглашение: без объединения государств и без изменения границ — два режима связываются единым военным союзом как ступенью к окончательному объединению. Реакция в регионе неоднозначна: одни называют это прагматичным шагом, другие опасаются, что раскол просто закрепляется институционально."
 zzz_kor.2.a:0 "Одна нация, два государства, один союз."
 zzz_kor.3.t:0 "Диалог сорван"
 zzz_kor.3.d:0 "Последний раунд завершился без соглашения. Стороны столкнулись по гарантиям безопасности и политическому устройству, и делегации одна за другой покинули стол. Линия перемирия снова тиха, но неподписанный документ остался на столе — отправная точка следующей попытки или причина её отсутствия."
 zzz_kor.3.a:0 "Мы сделали всё, что могли."
 zzz_kor.4.t:0 "Полуостров объединён под флагом Пхеньяна"
 zzz_kor.4.d:0 "Северные войска пересекли старую линию перемирия, и сопротивление Юга рухнуло за несколько недель. Пхеньян объявил об объединении, сохранил название Корейской Народной Республики и перенёс столицу в Сеул. Южные партии были роспущены или поглощены, выборы пройдут в новых рамках — сколько места эти рамки оставят оппозиции, никто не говорит."
 zzz_kor.4.a:0 "Эпоха раскола закончилась."
 zzz_kor.5.t:0 "Полуостров объединён под флагом Сеула"
 zzz_kor.5.d:0 "Южные войска вышли к реке Туман, а северный режим при распаде сложил оружие. Сеул объявил об объединении, распространив конституцию и избирательную систему Республики Корея на весь полуостров. Северным кадрам предстоит чистка или кооптация, миллионы жителей за одну ночь сменили гражданство — истинная цена интеграции проявится лишь позже."
 zzz_kor.5.a:0 "Конституцией и голосованием."
 zzz_kor.6.t:0 "Провозглашена Корейская Народная Республика"
 zzz_kor.6.d:0 "Объединённое государство определилось с названием: Корейская Народная Республика. Новое правительство заявляет о преемственности временного правительства 1945 года, размещает столицу в Сеуле и обещает общеполуостровные свободные выборы. Пекин и большинство государств региона направили поздравления; Токио молчит."
 zzz_kor.6.a:0 "Один полуостров, одно государство."
 zzz_kor.7.t:0 "Основание Корейской Народной Республики"
 zzz_kor.7.d:0 "[Сеул] После завершения объединительного процесса более чем семидесятилетний раскол Корейского полуострова окончен. В декларации об основании новая Корейская Народная Республика обещала общеполуостровные свободные выборы. В столицах региона единого мнения об урегулировании нет; Вашингтон и Пекин ждут результата."
 zzz_kor.7.a:0 "История открывает новую страницу."
 zzz_kor.8.t:0 "Первые общеполуостровные выборы"
 zzz_kor.8.d:0 "Подсчёт голосов на первых общеполуостровных выборах под наблюдением международных наблюдателей завершён. Южный прогрессивный лагерь и северная Корейская социал-демократическая партия шли единым списком и получили большинство с программой преодоления раскола. Явка стала рекордом полуострова: от Чеджу до реки Туман одна урна теперь хранит две памяти, разделённые десятилетиями."
 zzz_kor.8.a:0 "Сим Сан Чжон избрана первым президентом."
 zzz_kor.9.t:0 "Объявлены результаты общеполуостровных выборов"
 zzz_kor.9.d:0 "[Сеул] Опубликованы окончательные результаты первых общеполуостровных выборов. Новое правительство примет две отдельные администрации в федеральных рамках; его первые задачи — бюджетная интеграция, объединение армий и воссоединение разделённых семей. Наблюдатели назвали процесс в целом свободным, но отметили неравные условия организации в части северных районов."
 zzz_kor.9.a:0 "Новое правительство вступает в должность."
 zzz_kor.10.t:0 "Первые общенациональные выборы на полуострове"
 zzz_kor.10.d:0 "После присоединения Севера и установления администрации Сеула над полуостровом Республика Корея проводит первые общенациональные выборы на всей его территории. Избиратели прежнего Севера впервые приходят на многопартийный участок; исход оставлен бюллетеням, ни один кандидат не назначен заранее."
 zzz_kor.10.a:0 "Пусть решают бюллетени."
 zzz_kor.11.t:0 "Возвращение павших"
 zzz_kor.11.d:0 "[Шэньян] Останки бойцов-добровольцев, погибших в Корейской войне, были доставлены на родину и захоронены на кладбище павших. Впервые за долгое время обе Кореи направили представителей на церемонию передачи. Для Пекина это закрытие исторического дела; для полуострова — война семидесятилетней давности наконец получает право завершиться."
 zzz_kor.11.a:0 "Павшие возвращаются домой."
