 PAR.1.t: "Абдо в Стране чудес"
 PAR.1.d: "Это был длинный и изнурительный день для президента Больсонаро — еще двадцать четыре часа, посвященных встречам с министрами, пресс-конференциям и бесконечным интервью, все из-за арабов. Для президента эта встреча изначально казалась просто еще одной записью в бесконечной цепочке назначений, которые уже заполнили его расписание, по крайней мере, пока он не вспомнил, кто именно его ждет: Марио Абдо Бенитес, президент Парагвая. И все же это был только Парагвай — чего Больсонаро реально мог от него ожидать?\n\nПоследовал ряд рукопожатий, затем несколько тщательно сфотографированных фотографий двух президентов, улыбающихся для камер, после чего встреча наконец перешла к своему настоящему целению. Оба мужчины сели в небольшой приемной комнате, и после обмена несколькими формальностями разговор переключился на причину визита парагвайского президента.\n\n«Господин Президент, я хотел бы обсудить… сотрудничество между нашими странами во время этой энергетической кризиса», — начал Абдо, хотя его голос показался неуверенным даже для Больсонаро. «Парагвай срочно нуждается в иностранной помощи для справления с последствиями нефтяного кризиса», — продолжил парагвайский президент, немедленно вызвав у Больсонаро вопрос: почему он не пошел за помощью к своим покровителям в Аргентине? Тем не менее, Больсонаро выбрал не говорить это вслух.\n\n«Парагвай готов пересмотреть свою геополитическую позицию», — добавил Абдо осторожно, «или вернее, пересмотреть, кто действительно является — и кто не является — другом Парагвая.» В тот момент, когда Больсонаро услышал эти слова, в его глазах загорелся искра. Ослабление влияния Аргентины в Южной Америке — и особенно в Парагвае — стало бы большим побегом для Бразилии и для Больсонаро лично. Это была возможность, огромная возможность, и она требовала тщательного рассмотрения.\n\nТем не менее, и Бразилия сама боролась с кризисом, и переброска ценных ресурсов за границу, скорее всего, разозлит националистическую базу, поддерживающую Больсонаро. Несмотря на это, масштаб любой потенциальной помощи должен быть решен сейчас."
 PAR.1.a: "Бразилия готова начать всестороннее сотрудничество с вами, господин Президент."
 PAR.1.b: "Мы готовы частично помочь вам справиться с последствиями, господин Президент."
 PAR.1.c: "Мы готовы предоставить вам очень… небольшую помощь. У самой Бразилии дела не в лучшем состоянии, господин Президент."
 PAR.1.e: "Наши соглашения могут выйти за рамки мер по оказанию помощи, господин Президент. Возможно, настало время углубить нашу региональную интеграцию."
 PAR.1.f: "Наши нефтеперерабатывающие заводы открыты для бизнеса, господин Президент. Я уверен, вы назовете свою справедливую цену."