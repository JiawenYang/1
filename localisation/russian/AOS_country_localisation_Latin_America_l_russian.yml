 # NIC #
 NIC.1.t: "ФСЛН провозглашает Центрально-Американскую Федерацию"
 NIC.1.d: "Никарагуанский президент Даниэль Ортега и правящий Национально-освободительный фронт Сандинистов (ФСЛН) сегодня в неожиданном заявлении объявили о формировании Центрально-Американской Федерации. В заявлении Ортега пообещал объединить центральноамериканские нации любыми средствами, вызвав опасения о конфликте в регионе.\n\nПровозглашение произошло на фоне продолжающейся Второй американской гражданской войны, в которой Соединенные Штаты заняты внутренними конфликтами, оставив вакуум власти в регионе. Амбиции Ортеги нашли поддержку правительств Кубы, Венесуэлы и Китая, которые поддержали этот шаг как способ укрепить региональную автономию и противовесить влиянию США. Однако другие центральноамериканские нации, включая Гватемалу, Эль-Сальвадор, Гондурас, Коста-Рику и Панаму, осудили заявление Ортеги, интерпретировав его как скрытую угрозу агрессии. Эти нации считают, что конечной целью Никарагуа является захват контроля над стратегически важным Панамским каналом, воспользовавшись текущей нестабильностью в Соединенных Штатах. В ответ на эскалацию напряжений Организация американских государств (ОАГ) созвала чрезвычайное совещание для обсуждения потенциальной угрозы для региональной стабильности, представленной провозглашением Центрально-Американской Федерации."
 NIC.1.a: "ЛАРП"
 NIC.1.b: "Уровень ММА"

 NIC.2.t: "Канальная война"
 NIC.2.d: "В шокирующем развитии событий никарагуанский президент Даниэль Ортега сегодня объявил, что его страна официально объявляет войну соседним Коста-Рике и Панаме, эскалировав напряжения в центральноамериканском регионе. Заявление последовало всего через несколько недель после того, как Ортега и правящий Национально-освободительный фронт Сандинистов (ФСЛН) провозгласили формирование Центрально-Американской Федерации и пообещали объединить регион любыми средствами. Агрессивная позиция Никарагуа вызвала тревогу среди соседей и международного сообщества.\n\nКоста-Рика и Панама, страны без постоянных армий, вызвали чрезвычайное совещание Организации американских государств (ОАГ) для обсуждения кризиса и поиска поддержки у других членов наций. Тем временем они мобилизовали свои национальные полицейские силы и агентства безопасности для усиления граничной безопасности и поддержания общественного порядка. Страны по всему миру выразили озабоченность по поводу внезапной эскалации конфликта в Центральной Америке, при этом многие призывают к немедленному международному вмешательству для предотвращения возможных катастрофических последствий этой войны."
 NIC.2.a: "2 недели"
 NIC.2.b: "2 недели"

 NIC.3.t: "Крипто-империя"
 NIC.3.d: "К луне."
 NIC.3.a: "Война расширяется"

