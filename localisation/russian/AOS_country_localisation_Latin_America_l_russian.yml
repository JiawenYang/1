 PAR.1.t: "Абдо в Стране чудес"
 PAR.1.d: "Это был длинный и изнурительный день для президента Больсонаро — еще двадцать четыре часа, посвященных встречам с министрами, пресс-конференциям и бесконечным интервью, все из-за арабов. Для президента эта встреча изначально казалась просто еще одной записью в бесконечной цепочке назначений, которые уже заполнили его расписание, по крайней мере, пока он не вспомнил, кто именно его ждет: Марио Абдо Бенитес, президент Парагвая. И все же это был только Парагвай — чего Больсонаро реально мог от него ожидать?\n\nПоследовал ряд рукопожатий, затем несколько тщательно сфотографированных фотографий двух президентов, улыбающихся для камер, после чего встреча наконец перешла к своему настоящему целению. Оба мужчины сели в небольшой приемной комнате, и после обмена несколькими формальностями разговор переключился на причину визита парагвайского президента.\n\n«Господин Президент, я хотел бы обсудить… сотрудничество между нашими странами во время этой энергетической кризиса», — начал Абдо, хотя его голос показался неуверенным даже для Больсонаро. «Парагвай срочно нуждается в иностранной помощи для справления с последствиями нефтяного кризиса», — продолжил парагвайский президент, немедленно вызвав у Больсонаро вопрос: почему он не пошел за помощью к своим покровителям в Аргентине? Тем не менее, Больсонаро выбрал не говорить это вслух.\n\n«Парагвай готов пересмотреть свою геополитическую позицию», — добавил Абдо осторожно, «или вернее, пересмотреть, кто действительно является — и кто не является — другом Парагвая.» В тот момент, когда Больсонаро услышал эти слова, в его глазах загорелся искра. Ослабление влияния Аргентины в Южной Америке — и особенно в Парагвае — стало бы большим побегом для Бразилии и для Больсонаро лично. Это была возможность, огромная возможность, и она требовала тщательного рассмотрения.\n\nТем не менее, и Бразилия сама боролась с кризисом, и переброска ценных ресурсов за границу, скорее всего, разозлит националистическую базу, поддерживающую Больсонаро. Несмотря на это, масштаб любой потенциальной помощи должен быть решен сейчас."
 PAR.1.a: "Бразилия готова начать всестороннее сотрудничество с вами, господин Президент."
 PAR.1.b: "Мы готовы частично помочь вам справиться с последствиями, господин Президент."
 PAR.1.c: "Мы готовы предоставить вам очень… небольшую помощь. У самой Бразилии дела не в лучшем состоянии, господин Президент."
 PAR.1.e: "Наши соглашения могут выйти за рамки мер по оказанию помощи, господин Президент. Возможно, настало время углубить нашу региональную интеграцию."
 PAR.1.f: "Наши нефтеперерабатывающие заводы открыты для бизнеса, господин Президент. Я уверен, вы назовете свою справедливую цену."
 BOL_contested_transitional_government:0 "Contested Transitional Government"
 BOL_contested_transitional_government_desc:0 "A disputed interim administration lacks the legitimacy to govern, draining political power and stability while raising the cost of every decision."
 BOL_cruceno_productive_model:0 "Cruceño Productive Model"
 BOL_cruceno_productive_model_desc:0 "The Cruceño model favors private agribusiness and industrial investment, delivering growth with social costs."
 BOL_discredited_security_forces:0 "Discredited Security Forces"
 BOL_discredited_security_forces_desc:0 "Security forces lose public trust after heavy-handed episodes, weakening morale, organization and recruitment."
 BOL_exhaustion_of_the_gas_model:0 "Exhaustion of the Gas Model"
 BOL_exhaustion_of_the_gas_model_desc:0 "Bolivia's gas model is exhausted: export revenue falls, industry loses competitiveness and the fiscal deficit widens."
 BOL_the_chapare_factor:0 "The Chapare Autodefensas Factor"
 BOL_the_chapare_factor_desc:0 "The Chapare self-defense groups complicate counterinsurgency: slow logistics, thin conscription and heavy supply consumption."
 CHL_estallido_social_idea_desc:0 "The social outburst paralyzes the economy and drains the government's authority, while pushing voters toward the left."
 CHL_mining_economy:0 "Mining Economy"
 CHL_mining_economy_desc:0 "Copper and lithium exports anchor the budget, funding investment and development while tying the country to commodity cycles."
 CHL_pinochet_legacy_idea_desc:0 "The Pinochet legacy remains a live political wound, feeding authoritarian currents and draining legitimacy."
 CHL_terrorist_attacks_in_patagonia:0 "Terrorist Attacks in Patagonia"
 CHL_terrorist_attacks_in_patagonia_desc:0 "Attacks in Patagonia raise security costs and depress business and household confidence."
 CHL_the_legacy_of_pinochets_constitution:0 "The Legacy of Pinochet's Constitution - §RIn its dusk...§!"
 CHL_the_legacy_of_pinochets_constitution_desc:0 "Four decades on, the 1980 constitution still shapes Chile: subsidiarity, protected organic laws and a constitutional tribunal that can stall reform. Its defenders profit from stability, while its critics demand a replacement."
 CHL_the_most_efficient_army_in_south_america:0 "The Most Efficient Army in South America"
 CHL_the_most_efficient_army_in_south_america_desc:0 "Chilean officers present their army as the most professional force on the continent, with strong organization, mobility and logistics discipline."
 CHL_the_social_outburst:0 "Estallido Social"
 CHL_the_social_outburst_desc:0 "Chile is living through a wave of civil disobedience unseen since the dictatorship. What began as a student protest over metro fares has become a nationwide revolt against privatized pensions, deep inequality and the commodification of basic services."
 COL_american_dependence:0 "American Dependence"
 COL_american_dependence_desc:0 "Colombia's close alignment with Washington guarantees investment and security cooperation, but leaves the economy exposed to decisions made abroad."
 COL_colombian_agro_extractive_model:0 "Colombian Agro-extractive Model"
 COL_colombian_agro_extractive_model_desc:0 "An agro-extractive model ties growth to commodity exports, easing consumer costs and supporting trade ties."
 COL_colombian_armed_forces_desc:0 "A large and battle-hardened military anchors the state, with strong organization and experience in internal conflict."
 COL_national_unity_governament_idea_desc:0 "A national unity government binds rival factions into one cabinet, buying stability and a broader military consensus."
 COL_never_ending_war:0 "Never-ending War"
 COL_never_ending_war_desc:0 "Protracted internal war drains political power, stability, population and industry, year after year."
 COL_the_great_colombian_counterinsurgent_army:0 "The Great Colombian Counterinsurgent Army"
 COL_the_great_colombian_counterinsurgent_army_desc:0 "A counterinsurgent army built for a long internal war: strong defenses, high morale and deep recruitment."
 COL_the_invisible_hand:0 "The House Always Wins"
 COL_the_invisible_hand_desc:0 "The invisible hand of private power hollows out the state: political power and social development both decline."
 COL_vultures_of_colombia_profunda:0 "The Cancer of Deep Colombia"
 COL_vultures_of_colombia_profunda_desc:0 "The cancer of deep Colombia: criminal networks drain the periphery, weaken local defense and feed radical currents."
 ECU_consequences_of_the_end_of_the_oil_era:0 "Consequences of the End of the Oil Era"
 ECU_consequences_of_the_end_of_the_oil_era_desc:0 "As the oil era ends, export revenue and household incomes fall, and the state loses fiscal room."
 ECU_dolars_dolars_dolars:0 "§GDOLARS! DOLARS! DOLARS!§!"
 ECU_dolars_dolars_dolars_desc:0 "Full dollarization anchors prices and stabilizes expectations, restoring confidence in trade and business."
 ECU_extreme_polarization:0 "Extreme Polarization"
 ECU_extreme_polarization_desc:0 "Extreme polarization splits society into hostile blocs, feeding radical currents on both sides."
 ECU_freshly_opened_wound:0 "Freshly Opened Wound"
 ECU_freshly_opened_wound_desc:0 "A freshly opened wound: the political crisis feeds polarization and erodes stability and war support."
 ECU_post_usa_colapse_financial_chaos:0 "§RUh-oh...§!"
 ECU_post_usa_colapse_financial_chaos_desc:0 "A financial shock after the collapse of the US order raises consumer costs and business risk and lowers living standards."
 ELN_foquismo_desc:0 "Foquismo concentrates small armed cells for rapid strikes: high attack and capture rates, weak organization and heavy reliance on captured equipment."
 FRC_revolutionary_mafia_desc:0 "The Revolutionary Mafia fuses political violence with criminal enterprise, funding itself through extortion and trafficking while behaving aggressively abroad."

