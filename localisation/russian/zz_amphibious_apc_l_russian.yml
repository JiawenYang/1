l_russian:
 ZZ_amphibious_apc_chassis_aavp7a1: "AAVP-7A1"
 ZZ_amphibious_apc_chassis_aavp7a1_desc: "Основной плавающий бронетранспортёр морской пехоты США, предназначенный для высадки на побережье."
 ZZ_amphibious_apc_chassis_zbd05: "ZBD-05"
 ZZ_amphibious_apc_chassis_zbd05_desc: "Китайская скоростная амфибия нового поколения с глиссирующим корпусом и водомётным движителем, рекордная скорость на воде для морских десантных операций."
 ZZ_amphibious_apc_chassis_kaav7: "KAAV7"
 ZZ_amphibious_apc_chassis_kaav7_desc: "Лицензионная южнокорейская модификация AAV7A1, основная боевая амфибия Корпуса морской пехоты Республики Корея."
 ZZ_amphibious_apc_chassis_lvtp5: "LVTP-5"
 ZZ_amphibious_apc_chassis_lvtp5_desc: "Американский гусеничный плавающий транспортёр 1950-х годов для высадки усиленного взвода, с 1970-х заменён серией AAV7."

 ZZ_amphibious_mechanized_equipment: "Plavayushchiy BTR"
