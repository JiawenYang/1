l_russian:
 ZZ_amphibious_apc_chassis: "Плавающая боевая машина"
 ZZ_amphibious_apc_chassis_0: "Ранняя плавающая боевая машина"
 ZZ_amphibious_apc_chassis_1: "Плавающая боевая машина 1-го поколения"
 ZZ_amphibious_apc_chassis_2: "Плавающая боевая машина 2-го поколения"
 ZZ_amphibious_apc_chassis_3: "Плавающая боевая машина 3-го поколения"
 ZZ_amphibious_apc_chassis_4: "Плавающая боевая машина 4-го поколения"
 ZZ_amphibious_apc_chassis_desc: "Гусеничные плавающие боевые машины типа AAV7 и ZBD-05 с полным набором модулей вооружения, защиты и подвижности, предназначенные для высадки с моря и боёв на речных переправах."
 ZZ_amphibious_apc_chassis_0_desc: "Ранние гусеничные плавающие транспортеры холодной войны с ограниченной скоростью и защитой, но уже построенные на полностью модульном шасси."
 ZZ_amphibious_apc_chassis_1_desc: "Гусеничные плавающие боевые машины типа AAV7 и ZBD-05 с полным набором модулей вооружения, защиты и подвижности, предназначенные для высадки с моря и боёв на речных переправах."
 ZZ_amphibious_apc_chassis_2_desc: "Новое поколение плавающей десантной машины с более мощной силовой установкой и усиленной бронёй, значительно повышающее огневую мощь и живучесть после высадки при сохранении способности к плаванию."
 ZZ_amphibious_apc_chassis_3_desc: "Более механизированная плавающая боевая машина с цифровой системой управления огнём и усиленной силовой установкой, рассчитанная на высокоинтенсивные морские десантные операции."
 ZZ_amphibious_apc_chassis_4_desc: "Новое поколение плавающих боевых машин с комбинированной бронёй и модулями активной защиты, способных сохранять темп атаки под огнём береговой обороны."
 ZZ_amphibious_apc_tech: "Плавающая боевая машина"
 ZZ_amphibious_apc_tech_desc: "Открывает шасси плавающей боевой машины, позволяя проектировать гусеничные плавающие машины типа AAV7 и ZBD-05 с полным набором модулей вооружения, защиты и подвижности."
 tank_designer_ZZ_amphibious_apc_chassis: "Плавающая боевая машина"
 tank_designer_ZZ_amphibious_apc_chassis_is_role_disallowed: "Эту конструкцию нельзя преобразовать в роль §Hплавающей боевой машины§!.\n\nПлавающая боевая машина — отдельная линия шасси; проектируйте её непосредственно на плавающем шасси."
 tank_designer_ZZ_amphibious_apc_chassis_role_disallowed: "Эту конструкцию нельзя преобразовать в роль §Hплавающей боевой машины§!.\n\nПлавающая боевая машина — отдельная линия шасси; проектируйте её непосредственно на плавающем шасси."
