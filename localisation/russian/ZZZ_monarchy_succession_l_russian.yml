l_russian:
 ZZZ_nm_charles_iii:0 "Карл III"
 ZZZ_nm_naruhito:0 "Нарухито"
 ZZZ_nm_frederik_x:0 "Фредерик X"
 ZZZ_nm_lux_guillaume:0 "Гийом"
 ZZZ_nm_may_abdullah:0 "Абдулла Пахангский"
 ZZZ_nm_may_ibrahim:0 "Ибрагим Искандар"

 ZZZ_succession.10.t:0 "Скончалась королева Елизавета II"
 ZZZ_succession.10.d:0 "Букингемский дворец объявил о смерти королевы Елизаветы II в замке Балморал. Корона немедленно переходит к Карлу III. В [ROOT.GetName] глава государства меняется вместе с короной."
 ZZZ_succession.10.a:0 "Королева умерла. Да здравствует король."

 ZZZ_succession.11.t:0 "Император Акихито отрекается от престола"
 ZZZ_succession.11.d:0 "Император Акихито отрёкся от престола — первое отречение за два века. Нарухито становится 126-м императором Японии."
 ZZZ_succession.11.a:0 "Да здравствует Его Величество император."

 ZZZ_succession.12.t:0 "Королева Маргрете II отрекается от престола"
 ZZZ_succession.12.d:0 "После 52 лет на троне королева Маргрете II отреклась от престола. Кронпринц Фредерик становится королём Фредериком X."
 ZZZ_succession.12.a:0 "Да здравствует король Фредерик X."

 ZZZ_succession.13.t:0 "Великий герцог Анри отрекается от престола"
 ZZZ_succession.13.d:0 "Великий герцог Анри отрёкся от престола в пользу сына Гийома, который становится великим герцогом Люксембурга."
 ZZZ_succession.13.a:0 "Да здравствует великий герцог!"

 ZZZ_succession.14.t:0 "Янг ди-Пертуан Агонг отрекается от престола"
 ZZZ_succession.14.d:0 "Султан Мухаммад V Келантанский отрёкся от трона. Совет правителей избрал султана Абдуллу Пахангского новым королём."
 ZZZ_succession.14.a:0 "Даулат Туанку."

 ZZZ_succession.15.t:0 "Коронация нового Янг ди-Пертуан Агонга"
 ZZZ_succession.15.d:0 "Султан Ибрагим Искандар Джохорский вступил на трон как 17-й Янг ди-Пертуан Агонг."
 ZZZ_succession.15.a:0 "Даулат Туанку."

 ZZZ_succession.16.t:0 "Скончался эмир Кувейта"
 ZZZ_succession.16.d:0 "Эмир Сабах аль-Ахмад аль-Джабер ас-Сабах скончался в возрасте 91 года. Наследный принц Наваф принёс присягу как эмир."
 ZZZ_succession.16.a:0 "Да помилует его Бог."

 ZZZ_succession.17.t:0 "Скончался эмир Наваф"
 ZZZ_succession.17.d:0 "Эмир Наваф аль-Ахмад аль-Джабер ас-Сабах скончался. Шейх Мишааль принёс присягу как эмир."
 ZZZ_succession.17.a:0 "Да помилует его Бог."

 ZZZ_succession.18.t:0 "Скончался султан Кабус"
 ZZZ_succession.18.d:0 "Султан Кабус бен Саид скончался после 50 лет правления. Хейсам бен Тарик принёс присягу как султан."
 ZZZ_succession.18.a:0 "Да помилует его Бог."

 ZZZ_succession.19.t:0 "Барбадос становится республикой"
 ZZZ_succession.19.d:0 "Барбадос отстранил королеву Елизавету II с поста главы государства и стал республикой. Монархия на Барбадосе упразднена."
 ZZZ_succession.19.a:0 "Начинается новая глава."
