l_russian:
 # Focuses
 # - Pre Civil War
 BRA_ease_of_business_policy: "Легкость ведения бизнеса"
 BRA_ease_of_business_policy_desc: "С момента своего возникновения бразильская экономика функционирует своим собственным способом, иногда называемым «бразильским капитализмом». Эта система предоставляет крупные субсидии и защиту так называемым «национальным чемпионам» и государственным предприятиям (оба обычно состоят из друзей текущего администрации), создавая набухшую и неэффективную отрасль.

Однако, поскольку экономическая свобода является основой всех других свобод, если мы хотим освободиться от государственного гигантизма, сокращение регулирования и стимулирование дружественной среды для функционирования свободного рынка — это необходимость."
 BRA_independent_central_bank: "Независимый Центральный банк"
 BRA_independent_central_bank_desc: "Вмешательство правительства в экономические дела редко имеет положительные последствия. К сожалению, Центральный банк Бразилии не является исключением. Десятилетия партийных назначений означали, что политика банка, по сути, является продолжением мнений и желаний правительства. Это отдаляет его от естественной цели Центрального банка — достижения технической и стабильной экономики, несмотря на правительственную политику.

Поэтому необходимо принять новые меры, чтобы защитить Банк от политического давления со стороны исполнительной власти при проведении денежно-кредитной политики, повысив доверие к учреждению среди инвесторов и населения."
 BRA_slash_petrobras: "Сократить Петробрас"
 BRA_slash_petrobras_desc: "На протяжении многих лет Петробрас была как стратегическим активом, так и бездной для государственной казны — компанией с ненужно большим количеством сотрудников и обремененной долгом. Чтобы полностью использовать потенциал, который она может предложить, мы должны оптимизировать ее бюджет, сократить ненужные расходы, устранить бюрократические неэффективности и уволить неэффективных сотрудников."
 BRA_agro_four_point_oh: "Агро 4.0"
 BRA_agro_four_point_oh_desc: "Бразильское агробизнес продолжает оставаться самым надежным столпом экономики страны, но даже с его богатством и важностью оно полагается на устаревшие техники и оборудование, уязвимые цепочки поставок и сильную зависимость от импортируемых материалов. Защита, направление и расширение инвестиций в этот экономический стержень страны необходимы, чтобы гарантировать, что у нас будет сельскохозяйственный сектор, достойный уважения, которое он заслуживает."
 BRA_privatize_eletrobras: "Приватизировать Электробрас"
 BRA_privatize_eletrobras_desc: "Электробрас, государственный гигант в энергетическом секторе страны, долгое время был символом контроля правительства над генерацией и распределением энергии. Однако хронические проблемы, такие как коррупция, проблемы с управлением и недостаточная инвестиция, сделали его неэффективным и сильно обремененным долгом.

Приватизировав его, продажа долей национальным и международным консорциумам обеспечит капитал для модернизации сети, расширения гидроэлектрической мощности и внедрения конкурентоспособных цен, поощряющих эффективность, тем самым увеличивая усилия его сотрудников. Эта мера, несмотря на критику некоторых слоев общества, поможет привлечь иностранные инвестиции, вернув нам статус экспортеров энергии."
 BRA_privatize_mail_service: "Приватизировать почтовые услуги"
 BRA_privatize_mail_service_desc: "Correios долгое время был национальным монополитом почтовых услуг, обремененным устаревшей инфраструктурой, хроническими дефицитами, забастовками и сопротивлением профсоюзов, которые ничего не делают для улучшения услуг. Приватизация компании положит конец растрате государственных ресурсов, направляемых на эту сферу, и усилит конкуренцию в сфере доставки посылок и логистики.

Эта реформа поможет продемонстрировать приверженность правительства эффективности и откроет двери для международных логистических гигантов, чтобы инвестировать в бразильский рынок электронной коммерции."
 BRA_free_the_infrastructure: "Освободить инфраструктуру"
 BRA_free_the_infrastructure_desc: "Дорожная и железнодорожная сеть Бразилии находится в руинах: разбитые улицы, заброшенные пути и потенциально полезные железнодорожные линии отключены, что увеличивает затраты на транспорт и сельскохозяйственную торговлю. Проблема такого рода не будет решена легко, тем более быстро, но открыв концессии частным операторам с показателями эффективности и штрафами за задержки и медлительность, мы должны продвинуться вперед."
 BRA_cpr_verde: "CPR Verde"
 BRA_cpr_verde_desc: "Cédula de Produto Rural (Зеленый Продуктовый Чек) вводит рыночный механизм, финансирующий экологическое сохранение и восстановление в агробизнесе. Производители могут выпускать сертификаты, обеспеченные будущим производством, с направлением ресурсов на перелесение, восстановление почвы, соблюдение законных резерваций и разделение между постоянными и временными производственными участками. Механизм направлен на борьбу с вырубкой лесов в результате сельскохозяйственной деятельности без значительных государственных расходов."
 BRA_expand_the_market: "Расширить рынок"
 BRA_expand_the_market_desc: "Бразильская экономика скована избыточным регулированием, высокими и произвольными налогами и барьерами, защищающими неэффективные сектора, наказывая потребителей и предпринимателей. Упрощение бюрократии для открытия бизнеса, снижение импортных тарифов на капитальные товары и материалы, а также устранение контроля цен, подавляющего честную конкуренцию — это фундаментальные меры для преодоления препятствий, стоящих на пути прогресса страны и бразильского рынка."
 BRA_green_yellow_employment_book: "Зелено-желтая трудовая книжка"
 BRA_green_yellow_employment_book_desc: "Carteira de Trabalho Verde e Amarela (Зелено-желтая трудовая книжка) вводит более упрощенный и гибкий трудовой договор, снижая тяжелое регулирование для работодателей, одновременно сохраняя основные защиты для рабочих. Модель снижает обязательные расходы на льготы, упрощает длительные процессы найма и увольнения, а также уменьшает бюрократию, которая долгое время отговаривала от формального трудоустройства.

Направленная на возвращение миллионов рабочих в формальную экономику, стимулирование создания рабочих мест и повышение привлекательности Бразилии для инвестиций, реформа является шагом к улучшению качества занятости в стране."
 BRA_the_new_agro: "Новое Агро"
 BRA_the_new_agro_desc: "Бразильское сельское хозяйство — это стержень экономики, обеспечивающий целую страну продуктами питания и позиционирующий страну как важного экспортера для всего мира. Однако оно работает далеко не на полную мощность, завися от импортируемых удобрений и устаревшего оборудования, что мешает его прогрессу и часто приводит к неудовлетворительным результатам для бизнеса и фермеров.

Если мы хотим оживить сельское хозяйство и поднять его на полную мощность, мы должны направить большие инвестиции в модернизацию агробизнес-сегмента. Это включает инвестиции в современные инструменты, расширение ирригации и механизацию более сложных областей."
 BRA_reduce_agro_input_imports: "Сократить импорт сельскохозяйственных материалов"
 BRA_reduce_agro_input_imports_desc: "Бразильские фермеры играют центральную роль в обеспечении пищей других стран мира, но они по-прежнему зависят от иностранных поставщиков удобрений, пестицидов и деталей сельскохозяйственной техники, делая наш внутренний рынок подверженным глобальным ценам.

Мы можем и должны сократить эту зависимость, предоставляя налоговые льготы местным компаниям, производящим тракторы и оборудование, расширяя добычу фосфатных руд и поощряя реактивацию заводов по производству азота по всей стране, тем самым начав снижать нашу зависимость от внешних рынков и смягчая риск быть пораженными международными кризисами."
 BRA_aliquota_unica: "Единая ставка"
 BRA_aliquota_unica_desc: "Сформулированный Паулу Гуедесом, единственная налоговая ставка направлена на замена кучи накладывающихся федеральных, штатных и муниципальных налогов в Бразилии единственной ставкой налога на потребление, применяемой одинаково ко всем товарам и услугам. Эта мера положит конец освобождениям для продуктов, считающихся жизненно важными, накапливающимся искажениям и юридическим спорам по налоговым классификациям.

Упрощая налоговую систему, мы обращаемся к корню фискальной неэффективности в стране, делая систему более справедливой и затрудняя налоговое уклонение."
 BRA_halfway_there: "Наполовину!"
 BRA_halfway_there_desc: "Правительство Партии рабочих под руководством Луиса Инасиу Лулы да Сильвы стало полной катастрофой для Бразилии. Набухшее социальное государство, которое берет деньги у производительных секторов и дает их тем, кто не старается, вместе с политикой ресоциализации в тюрьмах, балующей бандитов и позволившей криминальным группировкам доминировать в наших городах, а как будто этого мало, гendereвая идеология, навязываемая детям в школах! Все это было спонсировано процветанием бумажного бума и Плана Реал — факторами, которые не имеют отношения к короткосрочным социалистическим политикам Лулы.

Когда «Операция Мойка» разоблачила крупные криминальные схемы и раскрыла системную коррупцию всей правительственной машины, народ, гигант, проснулся, отверг все левое и в первый раз после почти двух десятилетий разрушения этой страны Партией рабочих, право наконец снова получила свою очередь у власти. Последние два года были не слишком более бурными, чем ожидалось, но проблемы начали накапливаться, и появились трещины. Пока ничего катастрофического не произойдет в ближайшее время, мы будем в порядке и, возможно, сумеем выиграть переизбрание. Мы не можем позволить себе растратить эту возможность."
 BRA_flex_gun_ownership: "Гибкое владение оружием"
 BRA_flex_gun_ownership_desc: "Рост преступности и чувство небезопасности, испытываемое бразильским населением с каждым днем все больше, повышает общественный спрос на более широкие права и методы самозащиты. В то время как законы, принятые после Закона о разоружении, налагают строгую бюрократию на граждан и делают легальный доступ к огнестрельному оружию очень трудным, смягчение процесса владения оружием наделяет способных и ответственных граждан возможностью защищать свои дома, семьи и себя от преступников, вторжений и других типов угроз."
 BRA_protect_our_mothers: "Защита наших матерей"
 BRA_protect_our_mothers_desc: "Матери нашей страны, особенно одиночные матери, которые воспитывают своих детей в условиях насилия и трудностей, сталкиваются с постоянными угрозами своей достоинности, физического и психического благополучия. С помощью министра Дамарес Алвес программа «Матери Бразилии» предоставляет им справедливость, которую они заслуживают, включая расширенные сети поддержки, курсы профессиональной подготовки, адаптированные к нуждам одиночных и неопытных матерей, и юридическую помощь в случаях уязвимости или домашнего насилия.

Распознавая фундаментальную роль матерей в формировании и воспитании наших граждан, а также трудности и несправедливости, с которыми они сталкиваются, теперь они получат защиту, чтобы обеспечить стабильную и здоровую жизнь для будущих поколений нашей любимой страны."
 BRA_give_out_land_deeds: "Выдавать земельные документы"
 BRA_give_out_land_deeds_desc: "Ненужные государственные земли и заброшенные сельскохозяйственные участки стали убежищами для захватчиков и местами, где преступники прячутся и совершают свои незаконные действия, в то время как многие подсобные фермеры и семьи все больше нуждаются в титулах собственности, которые становятся все дороже, чтобы обрабатывать землю и зарабатывать на жизнь.

Чтобы защитить наших мелких землевладельцев, ветеранов и сельскохозяйственных рабочих, выдача титулов собственности поможет им жить своей жизнью, превратить неиспользуемые и неэффективные поля в источники дохода и пищи для тех, кто от них зависит, и укрепить сельскую экономику нашей нации."
 BRA_revive_brazilian_tourism: "Оживить бразильский туризм"
 BRA_revive_brazilian_tourism_desc: "Недавние кризисы, разворачивающиеся по всему миру, опустошили туризм в нашей стране — когда-то важный источник богатства для многих городов по всей стране, с пустыми пляжами, закрытыми отелями и заброшенными культурными пространствами. Мы должны сосредоточиться на оживлении этой отрасли, направляя инвестиции в ремонт отелей и маркетинговые кампании, подчеркивающие естественные чудеса, прекрасные виды и культурное наследие нации.

Помимо вливания миллиардов в национальную экономику, это оживление поможет нам снова продвигать образ устойчивой, инновационной и прекрасной страны туристам со всего мира."
 BRA_escola_sem_partido: "Школа без партии"
 BRA_escola_sem_partido_desc: "Идеологическая доктринация в школах и университетах стала постоянной темой, с обвинениями учителей в пропаганде партийных повесток и личных идеологий под предлогом образования. Поэтому важно ввести нейтральность в государственных школах, чтобы положить конец догматике в школьной среде, запретить политическую пропаганду, контролировать учителей и персонал, которые могут распространять эти идеи, и обеспечить, чтобы учебный план был свободен от идеологических предубеждений, сосредоточившись на обучении с нейтральностью."
 BRA_civilian_military_schools: "Гражданско-военные школы"
 BRA_civilian_military_schools_desc: "С ростом романтизации преступности в школах, расширением недисциплины в классах и эрозией национальных ценностей производительность студентов и государственных и частных школ резко упала, при этом сообщения показывают значительное падение успеваемости студентов, а видео с неуважением и贬低ением образования студентами все чаще появляются в социальных сетях.

Однако гражданско-военные школы предлагают альтернативу, которую нам нужно, чтобы решить эти проблемы, передавая управление образованием в руки Военной полиции и вооруженных сил. Студенты будут подвергнуты более структурированным режимам, физической подготовке и учебному плану, который превратит их в богобоящихся граждан, уважающих свою страну и обладающих честью."
 BRA_technology_of_brazilian_state: "Технологии бразильского государства"
 BRA_technology_of_brazilian_state_desc: "Научный и технологический потенциал нашей нации огромен, но этот потенциал был истощен и растрачен во всех отношениях из-за недостаточной инвестиции, идеологического вмешательства и набухшей бюрократии, оставив ключевые учреждения в застое и отговаривая потенциальных инвесторов от инвестирования в нашу отрасль.

Чтобы восстановить то, что осталось от нашего потенциала, мы должны уволить коррумпированных и неэффективных сотрудников, значительно сократить бюрократию, которая долгое время служила препятствием для прогресса в этой области, и увеличить стимулы для привлечения инвесторов как из страны, так и из-за рубежа."
 BRA_lower_age_of_criminal_responsibility: "Снизить возраст уголовной ответственности"
 BRA_lower_age_of_criminal_responsibility_desc: "Рост молодежной преступности в Бразилии, подогретый мягкими наказаниями — или, в некоторых случаях, безнаказанностью — и вербовкой криминальными группировками, подорвал общественную безопасность страны, при этом статья 27 Федерального Конституции защищает несовершеннолетних, совершивших тяжкие преступления, от серьезных последствий. Поэтому отмена статьи 27 Конституции и снижение минимального возраста уголовной ответственности принесет справедливость молодым правонарушителям и несовершеннолетним преступникам.

Держать более молодых людей ответственными за свои преступления так же, как взрослых, не только предотвратит эксплуатацию молодежи различными криминальными организациями, но и продемонстрирует тем, кто достаточно взросл, чтобы понимать свои действия, что они больше не останутся безнаказанными за совершенные преступления."
 BRA_no_more_leashes: "Освободить нашу полицию"
 BRA_no_more_leashes_desc: "Рост преступности по всей национальной территории, подогретый растущими экономическими трудностями, отсутствием возможностей в периферийных районах и ослаблением государственной власти в тех же районах, превратил улицы в поля битв, целые районы, где преступники действуют с почти полной безнаказанностью, эксплуатируя законопослушных граждан и подрывая доверие к способности правительства справиться с проблемой.

Укрепление этого «Параллельного государства» в значительной степени обусловлено чрезмерными правилами и судебным вмешательством в то, что наши полицейские силы могут или не могут делать, или где они могут и не могут действовать. Мы должны сломать это чрезмерное вмешательство и предоставить нашим силам безопасности возможность действовать без больших ограничений: расширить их полномочия по приближению и обыску, смягчить протоколы использования силы и предоставить большую защиту от судебных исков."
 BRA_the_administrative_reform: "Административная реформа"
 BRA_the_administrative_reform_desc: "Бразильский государственный аппарат, выращенный десятилетиями коррупции, политического патронажа, клиентелизма, создания часто ненужных министерств и наложения функций, стал настоящим препятствием для прогресса нашей нации. Министерства и агентства нанимают тысячи людей на фиктивные работы с льготами и привилегиями, которые выкачивают несоразмерную долю бюджета, предоставляя низкокачественные услуги бразильскому населению.

Избыточная бюрократия и широкомасштабная коррупция сковывают предпринимательство, задерживают инфраструктурные проекты, такие как очистка загрязненных рек, например Тьете, и отговаривают внешних агентов от инвестиций. Такую систему нельзя позволять продолжаться; ее нужно реформировать сверху вниз, и именно это будет сделано — полная и глубокая реформа — чтобы в итоге государственный сектор служил населению, а не консорциумам и группам коррумпированных и oportunisticheских людей."
 BRA_playing_president: "Играем в президента"
 BRA_playing_president_desc: "Теперь, когда энтузиазм общественной поддержки, которым мы пользовались в первой половине срока, начал угасать, нам нужно показать результаты. И хотя мы так критиковали «отдачу за отдачу», которая диктует бразильскую политику, и обещали не компрометировать наши идеалы ради «политических маневров», придется заключить некоторые сделки, далекие от идеальных, ради нашего управления."
 BRA_reconcile_psl: "Примириться с PSL"
 BRA_reconcile_psl_desc: "Социально-либеральная партия (PSL), некогда ключевым союзником консервативного блока, дистанцировалась от нас и начала работать за и с оппозицией. Однако ее избирательная база по-прежнему состоит из евангельских избирателей, сторонников общественной безопасности и энтузиастов свободного рынка — идеологической базы, близкой к нашей правительственной и похожей на наш проект.

Разделение между двумя блоками не выгодно никому, кроме Партии рабочих и левого блока. Поэтому, чтобы консолидировать правый блок и укрепить наше положение в Конгрессе, примирение с лидерами партии принесет нам большие преимущества и укрепит нашу власть."
 BRA_negotiate_with_centrao: "Переговоры с Центрао"
 BRA_negotiate_with_centrao_desc: "Центрао — коалиция прагматичных политических блоков, которые контролируют значительную часть депутатов в Конгрессе — это группа, которую наша коалиция считает неотъемлемой для поддержания власти в Бразильи, но также крайне непредсказуемая. У нее нет конкретной идеологии, и она объявляет поддержку тем, кто платит больше. Несмотря на то что мы владеем властью, если мы хотим сохранить ее и укрепить наше влияние, переговоры с Центрао — предоставление им позиций, льгот и финансирования — крайне необходимы."
 BRA_form_new_cabinet: "Сформировать новый кабинет"
 BRA_form_new_cabinet_desc: "Текущий кабинет, сплав альянсов из разных блоков и остатков предыдущих коалиций, оказался трусливым, раздробленным и слишком слабым для проведения глубоких и смелых реформ, которые нужны Бразилии. Чтобы завершить и продвинуть консервативную повестку, крайне важно назначить идеологически приверженных фигур, разделяющих ту же точку зрения, что и глава государства, и которые будут ее претворять без колебаний.

Это включает назначение фигур, связанных с Бразильскими вооруженными силами, на ключевые позиции в правительстве. Реформа кабинета сверху вниз не только облегчит продвижение нашей повестки, но и передаст сообщение, которое мы хотим, Верховному федеральному суду и Национальному конгрессу.

§YПродвижение нашей повестки непреложно.§!"
 BRA_new_minister_civilian_house: "Новый министр Гражданского дома"
 BRA_new_minister_civilian_house_desc: "Гражданский дом долго страдал от слабого и некомпетентного руководства. Сиро Ногуэйра, опытный политик, который четырежды служил в Конгрессе как федеральный депутат, приносит с собой опыт и политическую силу, необходимые для должности главного министра."
 BRA_give_up_fnde: "Отказаться от FNDE"
 BRA_give_up_fnde_desc: "Национальный фонд для развития образования, несмотря на свою благородную цель финансирования улучшений инфраструктуры в школах страны, учебников и школьных обедов, стал неэффективным и набухшим, с повторяющимися и последовательными скандалами о коррупции и плохом управлении, привлеченными к общественному вниманию.

Чтобы сделать федеральное правительственное финансирование образования более эффективным, чистым и прозрачным, необходимо сократить инвестиции в программу и отдавать предпочтение более частным инициативам в области образования."
 BRA_compromises_with_the_party: "Компромиссы с партией"
 BRA_compromises_with_the_party_desc: "Социально-либеральная партия перестала быть единым блоком, разделилась на умеренное крыло, ищущее более широкого привлечения, и жесткое крыло, лояльное исходному проекту и посланию Жайра Мессииас Больсонаро. Умеренный блок хочет смягчить риторику президента по культурным вопросам и построить сеть поддержки в центре.

Представляя значительную часть партии, крайне важно, чтобы мы держали их удовлетворенными, чтобы они оставались в коалиции и не вызывали раскола, который только выигрывал бы лево на выборах. Мы должны предоставить им уступки и компрометироваться по некоторым пунктам, например, смягчить некоторые из более поляризующих предложений и предоставить им позиции в определенных областях правительства, в обмен на их голоса и поддержку."
 BRA_deals_with_bolsonaro_wing: "Сделки с крылом Больсонаро"
 BRA_deals_with_bolsonaro_wing_desc: "Радикальное крыло PSL, лояльное исключительно президенту Больсонаро, остается самой лояльной и энергичной базой партии, с пламенными и эйфоричными речами, которые поддерживают мораль наших сторонников на высоком уровне. Они страстно относятся к проекту Жайра, но тот же радикализм, который помогает поддерживать нашу текущую базу, также отталкивает нерешенных избирателей и предоставляет аммуницию левым, которые слюнают от возможности изобразить нас всех как экстремистов и радикалов.

Нам нужно контролировать жестких, одновременно поддерживая их энергичными и мотивированными для продолжения борьбы за президента. Предоставив радикальному крылу то, что они хотят видеть в законодательстве, одновременно поощряя пламенные заявления, которые отталкивают умеренных и центристов, мы сохраним их на нашей стороне."
 BRA_hand_over_secretariats: "Передать секретариаты"
 BRA_hand_over_secretariats_desc: "Центрао контролирует голоса, необходимые для утверждения и принятия реформ, которые мы хотим, но их поддержка никогда не бесплатна, и во многих случаях она дорогая. Чтобы гарантировать, что они голосуют за нас и предотвратить попытки помешать повестке президента или сменить сторону в неожиданные моменты, необходимо разместить доверенных лиц из их группы в различных секретариатах, предоставив им такую желанную власть без риска подорвать президента в долгосрочной перспективе."
 BRA_no_negotiations: "\"Нет\" переговорам"
 BRA_no_negotiations_desc: "Маневры и маленькие игры Центрао достигли невыносимого уровня, когда его политики требуют кабинетных позиций, поправок в бюджет, региональных фондов и инвестиций в обмен на их поддержку в Палате депутатов и голоса за наши проекты. Дальнейшее взаимодействие с ними постепенно превращает нас в их марионеток, полностью зависимых от них для управления, а сторонники отталкиваются после того, как осознают, что мы не выполняем свои обещания.

Если мы хотим продвинуть нашу повестку, управлять свободно и выполнять обещания нашей базе, мы должны изолировать этот блок, консолидируя правый блок, чтобы их голоса из оппозиции не негативно повлияли на нас в долгосрочной перспективе."
 BRA_back_in_the_center: "Назад в центр"
 BRA_back_in_the_center_desc: "Важность Центрао для правильного управления долгое время игнорировалась нашим блоком; сближение с ними и выполнение их желаний считается предательством базой, но пришло время отказаться от этой идеи и признать, что без них правительство не может долго выживать в одиночку.

Тем или иным образом они пойдут на одну или другую сторону; ту, которая платит больше, предлагает больше и обещает больше. Игнорирование их означает изоляцию и больше власти для Лево, и поэтому мы должны привлечь их в нашу орбиту, уступив то, что они хотят, в обмен на их поддержку."
 # - The Crises
 BRA_the_oil_crisis_hits: "Наступает нефтяной кризис!"
 BRA_the_oil_crisis_hits_desc: "Глобальный нефтяной рынок рухнул после смерти короля Саудовской Аравии и последующей гражданской войны в стране, при этом почти полное прекращение поставок нефти в Бразилию сильно повлияло на экономику страны. Цены на топливо за ночь взлетели в небо, промышленность страны остановила свою деятельность из-за космического роста транспортных расходов, а несколько компаний, зависимых от этого ресурса, были вынуждены прекратить операции. На заправочных станциях образовались огромные очереди, когда люди пытались получить возможность заправиться.

Нефтяной кризис, еще на начальной стадии, раскрыл фрагильность и уязвимости нации к внешней энергетической и нефтяной зависимости, при этом национальная инфляция взлетела, а цены достигли беспрецедентных уровней. Нам нужно защитить Бразилию от дальнейшего ущерба, ища методы для смягчения и минимизации этого кризиса как можно больше."
 BRA_secure_internal_market: "Защитить внутренний рынок"
 BRA_secure_internal_market_desc: "Нефтяной кризис дестабилизировал внутреннюю экономику до уровней, которые мы не ожидали увидеть после импичмента Коллора и конца гиперинфляции, при этом цены на продукты ежедневно достигают космических значений, в результате чего происходят ограбления, протесты и общественная паника. Чтобы предотвратить дальнейшее потрясение нации кризисом, некоторые меры, включая выпуск резервов по частям, субсидии для рабочих и мелких и средних торговцев, а также укрепление региональных сетей распределения для предотвращения дефицитов и массовых грабежей, дадут нам достаточно времени для рассмотрения более широкого плана."
 BRA_open_international_trade: "Открыться международной торговле"
 BRA_open_international_trade_desc: "Нефтяной кризис раскрыл нам многое: от слабостей и уязвимостей до вещей, которые мы считали само собой разумеющимися. Однако один из самых важных уроков был опасностями, которые международная изоляция может представлять для нашей нации. Изучив этот урок, мы должны обратиться к международной торговле, укрепляя связи с нашими существующими покупателями и ища новых поставщиков в Африке, Ближнем Востоке и Азии.

Хотя некоторые альянсы и партнерства могут бросить вызов нашему идеологическому гордости, мы должны сделать различные жертвы, чтобы обеспечить, чтобы Бразилия как можно быстрее вышла из этого кризиса."
 BRA_drop_import_parity_policy: "Отказаться от политики паритета импорта"
 BRA_drop_import_parity_policy_desc: "Политика паритета импорта, которая напрямую связывает внутренние затраты на топливо с международными ценами за баррель, стала прямым препятствием для экономического восстановления. Каждое увеличение международных цен, будь то из-за гражданской войны в Саудовской Аравии или любого другого конфликта и рыночной неопределенности, напрямую влияет на карман бразильского народа.

Отказ от этого механизма, хотя и требует тщательного и осторожного управления со стороны правительства и инвесторов, позволит отключить локальные цены от международного рынка, дав Петробрасу свободу устанавливать цены на основе издержек производства и национальных потребностей."
 BRA_enact_price_controls: "Ввести контроль цен на газ"
 BRA_enact_price_controls_desc: "Прыжок цен на топливо вызвал почти полную паралич общественного и частного транспорта в нашей стране, надул цены на товары и продовольствие и, прежде всего, спровоцировал социальные волнения и насильственные протесты. Поэтому, чтобы как можно больше снизить напряжение и получить время для планирования более эффективных и долгосрочных политик, введение контроля цен снизит цены на жизненно важные товары до уровней, минимально доступных для широкой публики."
 BRA_brics_cooperation: "Сотрудничество в рамках БРИКС"
 BRA_brics_cooperation_desc: "Наша экономика находится в плачевном состоянии в результате нефтяного кризиса, при этом цены ежедневно растут, инвесторы все больше и больше неуверены в инвестициях в нашу страну, а то, что осталось, зависит от непредсказуемого и волатильного рынка. Посреди всего этого наши союзники из БРИКС — в основном такие страны, как Российская Федерация и Народная Республика Китай — обладают огромными запасами нефти, которые мы срочно ищем.

Не только это, но и поиск буровых технологий у России и индийского опыта в области биотоплива помогут нам увеличить разведку в пресоляном слое, позволив нам снизить нашу зависимость от внешнего рынка и укрепить связи с экономическими союзниками."
 BRA_increase_state_share_petrobras: "Увеличить долю государства в Петробрасе"
 BRA_increase_state_share_petrobras_desc: "Существенная волатильность рынка и иностранная спекуляция вытеснила Петробрас на второй план в условиях нефтяного кризиса, поставив компанию в крайне деликатное финансовое положение. Восстановление контроля и увеличение доли государства в компании становятся не чем иным, как необходимостью для спасения предприятия.

Увеличение доли правительства в капитале за счет прямых покупок акций, преëmптивных прав подписки и других методов позволит нам направить компанию в направлении, соответствующем интересам населения, выходя за рамки удовлетворения только акционеров и инвесторов."
 BRA_invite_foreign_refineries: "Пригласить иностранные нефтеперерабатывающие заводы"
 BRA_invite_foreign_refineries_desc: "Кризис раскрыл миру мошеннический характер нефтеперерабатывающей мощности Бразилии, при этом внутреннее производство недостаточно для удовлетворения потребностей населения и вынуждает нас импортировать нефтепродукты по ценам выше нормы.

Открытие дверей и приглашение иностранных нефтеперерабатывающих компаний инвестировать в новые объекты или модернизировать существующие на нашей территории предлагает быстрое решение, которое нам нужно."
 BRA_the_coming_flu: "Приходящая грипп"
 BRA_the_coming_flu_desc: "Первые сообщения о новом неизвестном респираторном вирусе появились в последние месяцы 2019 года, изначально отвергнутые многими по всему миру как незначительная проблема, эпидемия, которая начнется и закончится в Народной Республике Кита. Это не произошло; болезнь достигла других мест, быстро попав в Бразилию и распространившись еще быстрее через аэропорты, порты и общественный транспорт.

Больницы, пойманные врасплох, быстро перегрузились, при этом отсутствие адекватного оборудования раскрыло недостаточную инвестицию, которую получала отрасль, облегчив распространение вируса по всей нашей территории. Наша система здравоохранения со всеми своими фрагильностями и неспособностями была раскрыта населению, которое, сбитое с толку, как справиться с новой угрозой, теряет доверие к правительству с каждым днем.

Нам нужно как можно быстрее справиться с этой чумой."
 BRA_operation_warp_vac: "Операция WarpVac"
 BRA_operation_warp_vac_desc: "Пандемия COVID-19, которая обрушилась на нацию, раскрыла правительство многим проблемам, одной из которых была крайняя зависимость страны от иностранных поставщиков вакцин, оставив миллионы и миллионы наших людей в залоге задержек поставок, дипломатических тупиков и бюрократических препятствий в принятии заказов на вакцины. В свете этого Операция WarpVac будет служить для ускорения разработки и внутреннего производства вакцин, направляя ресурсы в институт Бутантан, Фиокруз и частные лаборатории для ускорения клинических испытаний и значительного увеличения масштаба производства."
 BRA_covid_brics_cooperation: "Помощь из БРИКС"
 BRA_covid_brics_cooperation_desc: "Дипломатия, связанная с получением и покупкой вакцин от COVID-19, подчеркнула ненадежность традиционных поставщиков, с задержками в поставках и завышенными ценами. Однако наши партнеры из БРИКС предлагают нам альтернативу, которой мы нуждаемся.

Производственные линии вакцины Sputnik V от Российской Федерации можно лицензировать и купить для локального фасовки и завершения. Между тем, наши союзники в Народной Республике Кита предлагают инвестиции, сырье и технологию для производства собственных вакцин, а также предлагают вакцину CoronaVac для покупки."
 BRA_call_for_duty: "Вызов к долгу"
 BRA_call_for_duty_desc: "Вирус COVID-19 проверяет устойчивость бразильской нации, при этом больницы перегружены, а экономика сотрясена мерами изоляции и карантин, которые привели к закрытию и банкротству многочисленных мелких предприятий и магазинов. Вооруженные силы также пострадали от пандемии, с сокращением выплат, отложением тренировок и все меньшими волнами призывников.

Без необходимости в полевых мероприятиях и растущим спросом населения на альтернативы больницам иconventional здравоохранению, мобилизация солдат в казармах для распределения медицинских препаратов, проведения кампаний и поддержания порядка в районах высокого риска становится основным способом, которым наши Вооруженные силы могут помочь в этом кризисе."
 BRA_covid_university_research: "Гранты на исследования COVID"
 BRA_covid_university_research_desc: "С распространением пандемии COVID-19 и гибелью большего числа жизней среди нашего населения стало очевидно как для населения, так и для правительства, что наши усилия, несмотря на их количество, остаются недостаточными для предотвращения распространения болезни по всей стране.

Поэтому мы должны инвестировать большие суммы в национальные учреждения, такие как Бутантан, Фиокруз, университеты и частные лаборатории, чтобы ускорить исследования и разработку вакцины и лучше реализовать методы сдерживания."
 BRA_relax_research_regulations: "Смягчить правила по вакцинам"
 BRA_relax_research_regulations_desc: "Обязательные протоколы в отношении исследований вакцин и все более строгие требования задерживают разработку и прогресс клинических испытаний, мешая более глубоким исследованиям и разработкам вируса и потенциальной вакцины. Доказывая свою вредоносность для нашего реагирования на COVID-19 и научного прогресса, мы должны смягчить и облегчить эти требования, упростить утверждение клинических испытаний и сократить ненужные правила."
 BRA_field_medical_specialists: "Полевые тесты на COVID"
 BRA_field_medical_specialists_desc: "Распространение вируса способствовало медленным тестам, огромному количеству пациентов в списках ожидания и централизации в вакцинационных центрах, которые оставляют определенные сообщества слепыми к вспышкам в течение неприемлемого периода времени. Поэтому мобилизация войск и персонала в фурах, оснащенных наборами быстрых тестов и основными лабораториями, будет отправлена в районы, фабрики и районы, далекие от крупных городских центров, проводя тесты и собирая образцы на месте и доставляя результаты в короткие сроки."
 BRA_military_hospitals: "Создать чрезвычайные военные больницы"
 BRA_military_hospitals_desc: "Больницы перегружены до такой степени, что пациенты вынуждены ждать в очередях целые дни или госпитализированы с неадекватным оборудованием, которое приносит больше вреда, чем пользы. Чтобы помочь снизить нагрузку на больницы, вооруженные силы создадут и надлежащим образом оснастят военные больницы.

Те, кто пойдет в эти больницы, получат соответствующее оборудование и необходимое внимание, которыеconventional больницы в настоящее время не могут предоставить, гарантируя, что ни один бразильский не будет лишен лечения и ухода за COVID-19."
 BRA_mass_vaccine_production: "Массовое производство вакцин"
 BRA_mass_vaccine_production_desc: "Разные волны и пики COVID-19 поставили Бразилию в деликатное положение, при этом миллионы граждан не были вакцинированы в периоды, когда они этого больше всего нуждались. Чтобы защитить наших граждан и продвинуться вперед в процессе искоренения вируса из нашей страны, массовое производство вакцин стало неотъемлемым. Расширение мощностей Фиокруза и института Бутантан, оснащение их подходящими инструментами и технологиями для производства максимального количества за кратчайший срок, является одним из основных шагов к достижению наших целей в отношении пандемии.

Наши граждане смогут снова спать спокойно, зная, что вирус, который унес так много жизней и семей, больше не получит возможности повлиять на них."
 BRA_faster_covid_response: "Быстрее реагировать на COVID"
 BRA_faster_covid_response_desc: "Избыточная бюрократия, связанная с COVID-19, унесла бесчисленные жизни. Задержки в утверждении лекарств, бесконечные комитеты, обсуждающие протоколы, сбой распределения вакцин в некоторых областях и накопление или неиспользование запасов из-за отсутствия инициативы губернаторов и местных властей.

Чтобы спасти жизни нашего населения и предотвратить повторение таких трагедий, мы должны значительно сократить эту бюрократию и ускорить времена реакции наших властей, открыть пункты распределения и потребовать доставки лекарств и ресурсов."
 BRA_the_agro_collapse: "Коллапс агро"
 BRA_the_agro_collapse_desc: "Экономика Бразилии всегда сильно зависела от своего агробизнес-сегмента, особенно с экспортом сельскохозяйственных товаров в США, но с коллапом американского государства и его экономики мы потеряли крупного торгового партнера. Массивное агро, некогда экономическим двигателем Бразилии, находится в полном хаосе. Фермеры наводняют рынки дешевыми сельскохозяйственными продуктами в попытке спасти себя, и в процессе взрывает инфляция по всей стране.

Как будто этого мало, крестьяне протестуют против землевладельцев из-за все более низких зарплат и условий труда, вызванных совокупными кризисами. Если не принять срочных мер, хаос только усилится, и наша уже хрупкая экономика окончательно расколется на части."
 BRA_reform_internal_agro: "Реформировать внутреннюю сельскохозяйственную политику"
 BRA_reform_internal_agro_desc: "Начало Второй американской гражданской войны положило конец одному из крупнейших экспортных рынков Бразилии, при этом сильно повлияв на Китай, нашего крупнейшего партнера, что вызвало коллапс агробизнеса страны и беспрецедентный всплеск цен на продовольствие на рынках. Сельское хозяйство, рынок исключительной важности для нашей страны и один из основных столпов нашей экономики, вошло в нисходящую спираль, и, чтобы предотвратить полный крах оставшегося агробизнеса, глубокая реформа нашей внутренней сельскохозяйственной политики более чем жизненно важна для выживания остальной нашей торговли."
 BRA_seek_foreign_aid: "Искать иностранную помощь"
 BRA_seek_foreign_aid_desc: "Коллапс сельскохозяйственного сектора опустил сельские банки и оставил урожай гнить в полях из-за отсутствия покупателей и взлета цен, угрожая наступлению широкомасштабного голода в определенных городских центрах, которые больше всего зависят от постоянного снабжения продовольствием.

Внутренних мер, которые можно было бы принять вовремя, чтобы предотвратить то, что грядет, нет; поэтому мы должны искать внешнюю помощь, как у наших долгосрочных союзников в БРИКС, так и стратегических партнеров в регионах, таких как Азия и Европа."
 BRA_explore_amazon_basin: "Исследовать Амазонскую низменность"
 BRA_explore_amazon_basin_desc: "Амазонская низменность, долгое время оставшаяся в основном неразработанной по экологическим причинам, предлагает нам неиспользованный потенциал для компенсации производственных потерь с началом Второй американской гражданской войны и последующего коллапа агробизнеса в Бразилии.

Мы можем превратить низменность в житницу для нашей страны, поглотив избыточную рабочую силу, помогая смягчить продовольственную небезопасность во многих регионах и смягчая некоторые из последствий, которые мы понесли от коллапа одного из наших крупнейших экономических партнеров."
 BRA_organic_fertilizers: "Продвигать органическое удобрение"
 BRA_organic_fertilizers_desc: "Коллапс цепочек поставок удобрений во всем мире и внутри страны привел к тому, что фермеры в нашей стране сталкиваются с космическими затратами и дефицитом синтетических материалов, угрожая многочисленным урожаям и продовольственной безопасности бесчисленных людей.

Чтобы предотвратить дальнейшее выходение ситуации из-под контроля, мы должны продвигать органические методы удобрения, такие как поощрение создания компоста из натурального отхода и продвижение биоудобрений, полученных из природных материалов."
 BRA_increase_agro_subsidies: "Увеличить субсидии агробизнесу"
 BRA_increase_agro_subsidies_desc: "Коллапс агробизнеса практически полностью отрезал сельскохозяйственные кредитные линии, оставив крупных производителей без финансирования и, следовательно, не в состоянии получить оборудование более высокого качества, в результате чего большое количество урожая остается abbandоненным или собирается преждевременно.

С агробизнесом на коленях и готовящимся к последнему дыханию, крайне важно увеличить субсидии, чтобы поддерживать сектор живым и функционирующим, покупая время для фокусировки на других областях экономики, пострадавших от смерти Уолл-Стрит, одновременно предоставляя некоторое облегчение сельскохозяйственной отрасли."
 BRA_funds_from_un: "Фонды от ООН"
 BRA_funds_from_un_desc: "Национальная казна полностью истощена и использована в наших попытках спасти экономику от полного коллапа в лице всех кризисов, с которыми мы сталкиваемся, фактически оставив нас почти без денег для надлежащего решения того, что еще предстоит и что нам еще нужно решить.

Искать резервные фонды у Организации Объединенных Наций поэтому крайне важно для наличия ресурсов в краткосрочной и среднесрочной перспективе, давая федеральному правительству дыхание и позволяя ему время для реализации более глубоких и долгосрочных реформ и мер."
 BRA_promote_market_cooperation: "Продвигать сотрудничество на рынке"
 BRA_promote_market_cooperation_desc: "Экспортный рынок в целом рухнул за ночь, оставив крупных производителей с избыточным урожаем и без покупателей как на национальном, так и на международном рынке из-за цен, в то время как городские центры, более зависимые от стабильных урожаев, сталкиваются с началом кризиса широкомасштабного дефицита продовольствия.

Продвижение сотрудничества на внутренних рынках более чем необходимо для выживания в кризисе, связывая региональные кооперативы с сетями супермаркетов и институциональными покупателями, предоставляя субсидии и стимулы для сельских складов и стимулируя взаимосвязь внутреннего рынка."
 BRA_emergency_credit_support: "Чрезвычайная кредитная поддержка"
 BRA_emergency_credit_support_desc: "Сельскохозяйственный кризис заморозил рынки и сельскохозяйственные кредитные линии, при этом банки отказываются выдавать новые кредиты крупным компаниям и крупным производителям, оставляя их не в состоянии покупать семена, удобрения или топливо для проведения новых урожаев, угрожая дефицитом продовольствия и голодом по всей стране.

Мы не можем позволить повториться голоду 1990-х годов, тем более быть еще большим, и поэтому мы должны предоставить чрезвычайную кредитную поддержку крупным сельскохозяйственным компаниям, предотвращая массовое банкротство производителей, поддерживая ключевые культуры в активном производстве и снижая риск того, что страна войдет в период широкомасштабного голода."
 # - 2022 Elections
 BRA_the_2022_elections: "Самые решающие выборы Бразилии"
 BRA_the_2022_elections_desc: "Выборы 2022 года станут перекрестком, который действительно изменит будущее Бразилии. После лет поляризации, экономических трудностей и накапливающихся международных экономических и геополитических катастроф, текущая ситуация нации откроет, продолжится ли проект власти консерваторов после столкновения с различными неудачами, или вернется ли Лево к власти после тюремного заключения Лулы и последующего поражения PT в 2018 году.

С двумя основными федерациями — §7\"Альянса Патриотическая Brasileira\"§! под предводительством правого блока и Жайра Мессииас Больсонаро, и §p\"Федерация Бразилия за Надежду\"§! под предводительством левого блока и бывшего президента Луиса Инасиу Лулы да Сильвы, доминирующими в избирательном ландшафте, поляризация и идеологический радикализм, хранимые бразильским населением, готовы достичь точки кипения.

Только время покажет, но независимо от исхода, §Yпроигравшая сторона не примет его легко.§!"
 BRA_elections_side_with_lula: "Бразилия за Надежду!"
 BRA_elections_side_with_lula_desc: "Федерация «Бразилия за Надежду», объединенная под предводительством бывшего президента Луиса Инасиу Лулы да Сильвы, объединяет левый блок — рабочих, профсоюзы, социальные движения, прогрессистов, левых интеллектуалов и молодежь, которая противостоит консервативной волне, обрушившейся на страну в 2018 году и которая привела к nichts другому, как катастрофе и бедности — в сплоченный блок под знаменем надежды, социальной справедливости и национальной суверенитета. "
 BRA_elections_side_with_bolso: "Патриотическая Альянса"
 BRA_elections_side_with_bolso_desc: "Бразильская Патриотическая Альянса (APB), объединенная под предводительством текущего президента Жайра Мессииас Больсонаро, объединяет правые — евангельские блоки, фермеры, сторонники прав на оружие, консервативных христиан и мужчин, женщин и молодежь, разочарованных проектом власти Лево и Партии рабочих, который привел к nichts другому, как стагнации и бедности — в сплоченный блок, который перенаправляет видение Больсонаро на его второй срок."
 BRA_elections_renew_socdem: "Оживить прогрессивные политики"
 BRA_elections_renew_socdem_desc: "Первые правительства Лулы и прогрессивная повестка 2000-х годов принесли исторические социальные достижения для страны, но мир сегодня не такой, как тогда. Социальное неравенство, климатические угрозы, разочарование молодежи в правительстве и различные экономические трансформации по всей планете требуют оживленного, нового видения от Партии.

Кампания и политики Лулы должны сосредоточиться на расширении программы «Болса Фамилия», крупных инвестициях в возобновляемую энергию, укреплении государственного образования и борьбе с предрассудками, дискриминацией и расизмом через позитивные действия и антирасистские кампании."
 BRA_elections_mingle_socialists: "Смешиваться с социалистами"
 BRA_elections_mingle_socialists_desc: "Жайр Мессиас Больсонаро — зло, которое не будет побеждено, если Лево продолжит делиться по мелким идеологическим причинам. Необходимо отложить наши различия на время, чтобы иметь шанс победить Бразильскую Патриотическую Альянсу во втором туре выборов.

Обеспечение поддержки FPTU и голосов его сторонников имеет решающее значение для этого столкновения, и, несмотря на легкое испорчение имиджа Луиса Инасиу как умеренного, это не будет достаточно, чтобы оттолкнуть центр и умеренных, укрепляя прогрессивный фронт и консолидируя союз против права и Жайра Больсонаро."
 BRA_elections_sideline_radicals: "Отодвинуть радикалов"
 BRA_elections_sideline_radicals_desc: "Федерация «Бразилия за Надежду» имеет широкую поддержку Лево, но радикалы и экстремисты — те, кто выступает за насильственные методы для прогрессивизма и революционеры — рискуют оттолкнуть умеренных избирателей и базу центристско-либерального крыла, которую нам нужно, чтобы выиграть второй тур.

Более того, включение их в коалицию усилит риторику Жайра Мессииаса и его пособников, которые будут иметь больше оснований для обвинений в том, что мы — коммунисты и радикалы.

Поэтому мы должны отказаться включать экстремистов в нашу коалицию, предпочитая вместо этого маргинализировать их голоса во время кампании, преуменьшая совместные митинги или даже сообщения поддержки кандидатов и известных фигур радикального Лево. Таким образом Лула сможет сохранить свой умеренный имидж, привлечь больше умеренных избирателей, бизнесменов и больше международной поддержки."
 BRA_elections_grassroots_campaign: "Кампания с низов"
 BRA_elections_grassroots_campaign_desc: "Прямой контакт с народом и обычными гражданами — это то, что отличает кампанию Лулы, и это то, что позволило ему процветать как в первом, так и во втором избирательном циклах. Его присутствие на массовых демонстрациях в низкодоходных районах, профсоюзах и небольших городах привлечет поддержку менее состоятельного населения, при этом Лула говорит на темы, такие как трудоустройство, доступ к здравоохранению, достойное образование для бразильских детей и достоинство бразильских рабочих.

Сила Лулы всегда была в народе; поэтому он должен избегать чрезмерной зависимости от социальных сетей и даже телевизионной рекламы, используя своих сторонников и интегрируя их в кампанию, делая их частью процесса переизбрания Лулы через футболки, флаги, демонстрации и припевы."
 BRA_elections_cruzade_for_brazil: "Крестовый поход за Бразилию"
 BRA_elections_cruzade_for_brazil_desc: "Кампания на второй срок президента Жайра Мессииас Больсонаро позиционируется как настоящая борьба, крестовый поход, чтобы убедиться, что левое разрушение никогда не вернется к власти, изображая выборы как битву против коррупции, социализма и морального упадка, угрожающих христианству, Родине, Семье и Свободе.

Через экономический рост, снижение преступности и выполнение обещаний, таких как либерализация владения оружием и борьба с коммунизмом, Больсонаро позиционируется как надежный лидер, которому можно доверять, что он сдержит свое слово и избавит страну от плохих элементов.

Национальное пробуждение — Больсонаро спасет Бразилию снова от бездны и откроет золотой век процветания и добродетели."
 BRA_elections_moderated_tone: "Умеренный тон"
 BRA_elections_moderated_tone_desc: "По мере углубления кампании в избирательном процессе Больсонаро начинает смягчать свою риторику, поддерживая определенную дистанцию от бурных столкновений и агрессии, которые отличали его кампанию 2018 года. Избегая прямых атак на судебную власть и лидеров оппозиции, таких как Лула, он сосредотачивается на более практических вопросах, таких как экономическое восстановление после катастроф, последовавших за гражданской войной в Саудовской Аравии, общественная безопасность, семейные ценности и калибрует свое общее сообщение, чтобы привлечь нерешенных центристов и умеренных, одновременно поддерживая свою самую лояльную базу."
 BRA_elections_no_holding_back: "Без задержек"
 BRA_elections_no_holding_back_desc: "Популистская и агрессивная риторика — то, что избрало Жайра Больсонаро в 2018 году, и это не победит его сейчас. Поэтому президент усиливает свой стиль, выпуская атаку за атакой напрямую на Лево, медиа, судебную власть и систему, которая так долго держала бразильцев во сне и теперь борется, чтобы вернуть их к сну.

С митингами, излучающими ту же сырую энергию, что и всегда, Больсонаро подчеркивает тот факт, что его основной оппонент, Луис Инасиу Лула да Сильва, был заключен в тюрьму за коррупцию и мошенничество, также прибегая к защите семьи и христианской веры, и обещает продолжить свою нелегкую борьбу с организованной преступностью и коррупцией.

Намеренная агрессия необходима, чтобы разбудить его базу, доминировать в заголовках и заставить его оппонентов перейти в оборону. С его популярностью, пиковой в сельской местности, среди евангельских и в провинции, стратегия максимизации интенсивности для мобилизации его базы делает его сторонников более вовлеченными и поддерживающими его."
