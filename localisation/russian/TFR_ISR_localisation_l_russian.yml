l_russian:
 #The Fire Rises: цепочка событий Израиль/Палестина (портированная)
 isrwar.1.t: "Предложение мирного плана Трампа"
 isrwar.1.d "Вашингтон обнародует так называемую «Сделку века»: Иерусалим признаётся столицей Израиля, а израильский суверенитет над поселениями Западного берега одобряется. Тель-Авиву придётся выбирать между продвижением поселений и принятием экономического пакета."
 isrwar.1.a: "Мы войдём на Западный берег"
 isrwar.1.b: "Израильский план Маршалла!"
 isrwar.2.t: "Марш Лехавы"
 isrwar.2.d "Ультраправое движение Лехава марширует по Старому городу Иерусалима, скандируя требования создания единого государства и сталкиваясь с арабскими жителями. Полиция с трудом поддерживает порядок."
 isrwar.2.a: "Они мешают миру!"
 isrwar.2.b: "Нам нужно единое государство!"
 isrwar.3.t: "Нетаньяху объявляет чрезвычайное положение"
 isrwar.3.d "На фоне краха правительства единства и роста уличного насилия премьер-министр объявляет чрезвычайное положение, надеясь, что жёсткий курс удержит его правую базу."
 isrwar.3.a: "Да, Нетаньяху!"
 isrwar.4.t: "Провозглашено правительство единства"
 isrwar.4.d "Ликуд и «Кахоль-лаван» подписывают соглашение о ротации и формируют чрезвычайное правительство единства, обещая вместе справиться с пандемией и кризисом безопасности."
 isrwar.4.a: "Ура!"
 isrwar.5.t: "Правительство единства распало"
 isrwar.5.d "Спор о бюджете и о судебных назначениях валит правительство. Кнессет распускается, и Израиль идёт на четвёртые выборы за два года."
 isrwar.5.a: "Чёрт"
 isrwar.6.t: "Операция «Падший Голиаф»"
 isrwar.6.d "Генштаб утверждает региональную кампанию: ослабить военное присутствие Ирана в Сирии и Ираке, ударить по трансграничным террористическим сетям и обеспечить безопасность северной границы."
 isrwar.6.a: "Нас никогда не истребят..."
 isrwar.7.t: "Палестинская администрация протестует"
 isrwar.7.d "В Рамалле и Вифлееме вспыхивают демонстрации. Палестинская администрация осуждает односторонние действия Израиля, но едва контролирует улицы."
 isrwar.7.a: "Разве они когда-либо поступали иначе?"
 isrwar.8.t: "Палестинская администрация призывает добровольцев"
 isrwar.8.d "Группировки, такие как «Бригады мучеников аль-Аксы», открыто вербуют в лагерях беженцев. Винтовки и самодельная взрывчатка начинают ходить по Западному берегу."
 isrwar.8.a: "Тревожно..."
 isrwar.9.t: "Хикмат Тамими убит"
 isrwar.9.d "Известный палестинский активист Хикмат Тамими погибает в столкновениях. За два часа новость достигает всего арабского мира, и все ждут возмездия."
 isrwar.9.a: "Следить за ситуацией"
 isrwar.10.t: "Инаугурация нового президента Израиля"
 isrwar.10.d "Кнессет избирает Герцога президентом. Он призывает залечить раскол в обществе, но правая пресса называет его слабым выбором."
 isrwar.10.a: "Поздравляем, президент Герцог"
 isrwar.11.t: "ХАМАС мобилизуется"
 isrwar.11.d "ХАМАС объявляет всеобщую мобилизацию, берёт под контроль безопасность в Газе, отменяет выборы и стягивает бойцов к границе."
 isrwar.11.a: "Дерьмо летит в вентилятор..."
 isrwar.12.t: "Объявлена четвёртая интифада"
 isrwar.12.d "Палестинские фракции объявляют четвёртую интифаду. Бойцы открывают огонь по израильским позициям, юг Израиля переходит в режим ПВО."
 isrwar.12.a: "Вот блин"
 isrwar.13.t: "Всеобщая мобилизация в Израиле"
 isrwar.13.d "Изданы приказы о призыве резервистов, бронетанковые части выдвигаются к Газе и северной границе."
 isrwar.13.a: "Мобилизовать всё"
 isrwar.15.t: "Арабо-израильская война: решение двух государств"
 isrwar.15.d "После месяцев кровопролития Израиль принимает решение двух государств: Западный берег и Газа переходят под палестинское управление в обмен на прекращение огня и региональное признание."
 isrwar.15.a: "Это единственный выход"
