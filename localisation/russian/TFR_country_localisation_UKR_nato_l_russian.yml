 UKR_nato_membership_west: "План действий по членству"
 UKR_nato_membership_west_desc: "Идут ли армии Кремля на восток или Москва после ухода Путина погрузилась в новую схватку за власть, дипломаты в Киеве утверждают, что обещание, данное в Бухаресте в 2008 году, больше нельзя откладывать. Готовится официальная заявка на вступление, и западных партнёров просят принять Украину, пока окно ещё открыто."
