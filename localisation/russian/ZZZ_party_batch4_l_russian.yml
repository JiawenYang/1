l_russian:
 zzz_party.140.t:0 "Колумбия поворачивает влево"
 zzz_party.140.d:0 "Густаво Петро победил на выборах 2022 года и вступил в должность, сформировав первое левое правительство Колумбии; мирное соглашение и земельная реформа теперь в повестке дня."
 zzz_party.140.a:0 "Принять результат"
 zzz_party.142.t:0 "Социал-демократическое правительство в Хельсинки"
 zzz_party.142.d:0 "Пятипартийная коалиция во главе с социал-демократами вступила в должность в Хельсинки, продолжая курс северного государства всеобщего благосостояния Финляндии."
 zzz_party.142.a:0 "Принять результат"
 zzz_party.143.t:0 "Правый поворот Финляндии"
 zzz_party.143.d:0 "После выборов 2023 года Национальная коалиционная партия возглавила кабинет, сдвинув бюджетную и оборонную политику Финляндии к более консервативной линии."
 zzz_party.143.a:0 "Принять результат"
 zzz_party.144.t:0 "Новая демократия берёт Афины"
 zzz_party.144.d:0 "Новая демократия победила на досрочных выборах, и Кириакос Мицотакис стал премьер-министром, завершив цикл жёсткой экономии после долгового кризиса."
 zzz_party.144.a:0 "Принять результат"
 zzz_party.145.t:0 "Социал-демократический альянс в Рейкьявике"
 zzz_party.145.d:0 "Новое правительство во главе с Социал-демократическим альянсом вступило в должность в Рейкьявике, скорректировав социальную и климатическую политику Исландии влево."
 zzz_party.145.a:0 "Принять результат"
 zzz_party.146.t:0 "Коалиционное правительство в Дублине"
 zzz_party.146.d:0 "Фианна Файл и Фине Гэл впервые сформировали коалиционное правительство, ослабив традиционную двухпартийную систему Ирландии."
 zzz_party.146.a:0 "Принять результат"
 zzz_party.147.t:0 "Правительство ротации в Иерусалиме"
 zzz_party.147.d:0 "Межпартийная коалиция, выступающая против Нетаньяху, вступила в должность, создав редкую центристскую комбинацию в израильской политике."
 zzz_party.147.a:0 "Принять результат"
 zzz_party.148.t:0 "Возвращение израильских правых"
 zzz_party.148.d:0 "После выборов 2022 года правый блок Нетаньяху сформировал новый кабинет, сместив акцент Израиля на вопросы безопасности и поселений."
 zzz_party.148.a:0 "Принять результат"
 zzz_party.149.t:0 "Левое правительство в Мехико"
 zzz_party.149.d:0 "Андрес Мануэль Лопес Обрадор победил на выборах 2018 года, приведя к власти первое левое правительство Мексики и государственнический поворот в энергетике и борьбе с бедностью."
 zzz_party.149.a:0 "Принять результат"
 zzz_party.151.t:0 "Красные знамёна над Катманду"
 zzz_party.151.d:0 "Коммунистическая партия Непала (Объединённая марксистско-ленинская) победила на выборах 2017 года, и К.П. Шарма Оли стал премьер-министром, поведя Непал по левому республиканскому курсу."
 zzz_party.151.a:0 "Принять результат"
 zzz_party.152.t:0 "Парламентский поворот в Катманду"
 zzz_party.152.d:0 "Новое правительство во главе с Непальским конгрессом вступило в должность в 2021 году, вернув политический центр тяжести Непала к центристской парламентской политике."
 zzz_party.152.a:0 "Принять результат"
 zzz_party.155.t:0 "Либеральное правительство в Бухаресте"
 zzz_party.155.d:0 "Правительство во главе с Национальной либеральной партией вступило в должность в 2019 году, закрепив прoевропейский курс Румынии."
 zzz_party.155.a:0 "Принять результат"
 zzz_party.157.t:0 "Антикоррупционная волна в Братиславе"
 zzz_party.157.d:0 "После выборов 2020 года ОЛаНО возглавила кабинет, заменив прежнее правительство Смер антикоррупционным и прoевропейским курсом."
 zzz_party.157.a:0 "Принять результат"
 zzz_party.158.t:0 "Возвращение Смер в Братиславу"
 zzz_party.158.d:0 "Смер вернула власть после выборов 2023 года, обозначив явный поворот во внешней и медийной политике Словакии."
 zzz_party.158.a:0 "Принять результат"
 zzz_party.159.t:0 "Социалистическое правительство в Мадриде"
 zzz_party.159.d:0 "Социалисты Педро Санчеса пришли к власти через вотум недоверия в 2018 году, сместив политический центр тяжести Испании влево."
 zzz_party.159.a:0 "Принять результат"
 zzz_party.160.t:0 "Военные берут власть в Хартуме"
 zzz_party.160.d:0 "Режим Башира пал под давлением протестов, и Переходный военный совет взял власть, открыв переходный период противостояния военных и гражданских."
 zzz_party.160.a:0 "Принять результат"
 zzz_party.162.t:0 "Переходное правительство в Багдаде"
 zzz_party.162.d:0 "Адиль Абдул-Махди сформировал кабинет в 2018 году, и иракская конфессиональная квотная система продолжала работать под давлением протестов и восстановления."
 zzz_party.162.a:0 "Принять результат"
 zzz_party.163.t:0 "Левое правительство в Сантьяго"
 zzz_party.163.d:0 "Габриэль Борич победил на выборах 2021 года, приведя к власти первую левую коалицию Чили и включив конституционную реформу и социальную повестку в число приоритетов."
 zzz_party.163.a:0 "Принять результат"
