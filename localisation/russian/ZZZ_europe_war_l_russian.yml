l_russian:
 ZZZ_europe_war:0 "Континентальная война"
 ZZZ_eur_escalate:0 "Перенести войну на континент"
 ZZZ_eur_escalate_desc:0 "Украинский фронт превратился в общеевропейский вопрос. Приведите западные военные округа в полную готовность и расширьте операцию за пределы старого советского периметра."
 zzz_eur.1.t:0 "Фитиль континента"
 zzz_eur.1.d:0 "То, что началось как война за Украину, перешагнуло старую демаркационную линию. Колонны движутся западнее Вислы, воздушные коридоры над Балтикой закрыты, и каждая европейская столица отвечает на один и тот же вопрос: действует ли ещё соглашение 1991 года. Континентальная война началась, и никто не может обещать, что она останется обычной."
 zzz_eur.1.a:0 "Европа снова на краю."
 zzz_eur.2.t:0 "Отлив восточного фронта"
 zzz_eur.2.d:0 "Российское наступление рухнуло. Эстонские, латвийские и литовские части встали вдоль своих прежних границ, польская администрация вернулась в бассейн Вислы, а украинское правительство — в свою столицу. Война заканчивается там, где её предписывала карта начала девяностых, а восточный вопрос остаётся открытым."
 zzz_eur.2.a:0 "Восточный блок отходит к прежним границам."
 zzz_eur.3.t:0 "От Вислы до Балтики"
 zzz_eur.3.d:0 "Западная коалиция сломлена. Балтийские кабинеты заменены администрациями, подотчётными Москве, Польша и Украина низведены до зависимых государств, и российский флаг поднят над подступами к балтийскому побережью. Порядок континента перекраивается по московской мерке, а перемирие — лишь пауза в споре."
 zzz_eur.3.a:0 "Порядок континента перекроен по московской мерке."
 zzz_eur.4.t:0 "Перемирие без победителей"
 zzz_eur.4.d:0 "Ни одна коалиция не смогла добиться решения. Фронт остановился, склады пусты, и обе стороны приняли перемирие по фактически занятым позициям. Ни одна граница не изменилась, ни одно правительство не пало; война просто прекращается, а вопрос, ради которого она велась, передаётся следующему поколению."
 zzz_eur.4.a:0 "Фронт стоит там, где стоит."
