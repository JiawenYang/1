l_russian:
 # QL Officer Corps Spirits (Army/Navy/Air)
 ql_prc_army_spirit_01:0 "Профессиональное военное строительство"
 ql_prc_army_spirit_01_desc:0 "Силы национальной обороны, построенные на принципе служения армии нации: упор на профессиональную и научную подготовку наряду с патриотической преданностью, а этические проверки и гражданский контроль принятия решений удерживают верный курс."
 ql_prc_army_spirit_02:0 "Слушать Партию, идти за Партией"
 ql_prc_army_spirit_02_desc:0 "Особые китайские отношения партии и армии: Партия командует винтовкой, партийные ячейки создаются на уровне рот, а командная власть предельно централизована ради абсолютной лояльности народной армии. Выполнять команды Партии, побеждать в битвах, сохранять достойное поведение."
 ql_prc_army_spirit_03:0 "Вооружённые силы государства"
 ql_prc_army_spirit_03_desc:0 "Распространённая на Востоке система командования и подготовки: упор на централизованное управление крупными военными структурами, вертикальную интеграцию построения сил и значимость мобилизуемого резерва; военно-политические органы и разведслужбы глубоко слиты."
 ql_prc_army_spirit_05:0 "Политизация вооружённых сил"
 ql_prc_army_spirit_05_desc:0 "Согласно господствующей политической теории, «милитаризация политики» описывает рост вовлечённости военных и их влияния на политические решения; во многих сферах военные руководители манипулируют принятием политических решений, продвигая интересы военного правления."
 ql_prc_navy_spirit_07:0 "Упор на воздушное сдерживание"
 ql_prc_navy_spirit_07_desc:0 "Сильнейшие ВВС — это наши ВВС, вторые по силе — наша морская авиация. Та сторона, что обладает господством в воздухе, лучше понимает море, сжимая жизненное пространство врага и настигая его для смертельного удара."
 ql_prc_navy_spirit_08:0 "Информация решает победу"
 ql_prc_navy_spirit_08_desc:0 "Современная морская война — это информатизированная война. Чтобы построить флот мирового класса, мы должны укреплять ситуационную осведомлённость и создавать соответствующую ударную систему, самоотверженно, строго и решительно готовясь к грядущему решающему моменту."
 ql_prc_navy_spirit_09:0 "Подготовка молодых моряков"
 ql_prc_navy_spirit_09_desc:0 "Ключ к победе лежит в смертоносном и стремительном наступлении и мастерском владении адаптацией; смело продвигаться многомерными объёмными ударами и насыщать врага атаками надводного флота, не дожидаясь его окружения и блокады."
 ql_prc_navy_spirit_11:0 "Изучение морских традиций"
 ql_prc_navy_spirit_11_desc:0 "Флот — это род войск, чтящий историю; мы можем черпать силу из богатого боевого опыта — от проектирования техники и подготовки кадров до повседневных привычек моряков. Строить и поддерживать мощную группу крупных кораблей совершенно необходимо."
 ql_prc_navy_spirit_12:0 "Упор на подготовку подводников"
 ql_prc_navy_spirit_12_desc:0 "Наша страна не имеет средств и возможностей вкладываться в мощный надводный флот; взвесив варианты, нам следует сперва гарантировать действие сильного подводного флота сдерживания для защиты морского суверенитета и лишь затем рассматривать более сбалансированный флот."
 ql_prc_army_spirit_13:0 "Международная совместная оборона"
 ql_prc_army_spirit_13_desc:0 "Благодаря глубокому участию в международном рынке вооружений мы можем беспрепятственно вести техническое сотрудничество и межармейские обмены, получая более современное оружие и богатый опыт эксплуатации для восполнения части наших недостатков."
 ql_prc_army_spirit_14:0 "Возможности полного промышленного цикла"
 ql_prc_army_spirit_14_desc:0 "Обладая непревзойдённой обширной гражданской промышленностью полного цикла наряду с военной промышленностью с независимой интеллектуальной собственностью, мы можем резко снижать себестоимость передового оружия, а военно-гражданская интеграция поддерживает расцвет рынка."
 ql_prc_army_spirit_15:0 "Эффективная военная система"
 ql_prc_army_spirit_15_desc:0 "Концентрируя государственные ресурсы в военной сфере при правильной организации и планах строительства, мы способны сохранять сильные возможности производства, исследований и поставок на фронт даже в условиях увядания гражданской экономики."
 ql_prc_navy_spirit_18:0 "Накопленная океанография"
 ql_prc_navy_spirit_18_desc:0 "Благодаря долгой мореходной истории мы освоили гидрографию многих морей мира, научились строить комфортабельные, годные для океана суда и в совершенстве владеем приёмами, поддерживающими их эффективность."
 ql_prc_navy_spirit_19:0 "Эффективное судостроение"
 ql_prc_navy_spirit_19_desc:0 "Мы — одна из великих судостроительных держав мира, владеем множеством специальных судостроительных технологий и способны разрабатывать, строить и вводить в строй куда больше кораблей, чем соперники, с поразительной скоростью — при ничуть не худшем качестве."
 ql_prc_navy_spirit_20:0 "Опыт полярных операций"
 ql_prc_navy_spirit_20_desc:0 "Развитая атомная промышленность и многовековой опыт морских перевозок в холодных регионах дают нашей стране возможность строить самые профессиональные полярные суда, позволяя пройти через макушку мира и нести смерть и разрушение этим высокомерным грызунам."
 ql_prc_navy_spirit_21:0 "Возрождение тяжёлых кораблей"
 ql_prc_navy_spirit_21_desc:0 "Теперь, когда мы вновь обладаем флотом, ставшим великим, не опасаясь захвата открытых морей врагом, настало время вернуться к дремлющей стратегии больших пушек — разрабатывать и оснащать эти колоссальные стальные крупные корабли!"
 ql_prc_air_spirit_23:0 "Передовые авиаперевозки"
 ql_prc_air_spirit_23_desc:0 "Благодаря глубокому участию в международной производственной цепочке авиапрома — особенно в разработке и эксплуатации крупных планёров, — мы можем получить новейшие технологии и зрелые подсистемы вместе с корпусом опытных лётчиков-элиты."
 ql_prc_air_spirit_24:0 "Мастерство аэродинамических испытаний"
 ql_prc_air_spirit_24_desc:0 "Крупнейший и полнейший комплекс аэродинамических труб множества спецификаций вместе с поддерживающими институтами даёт нашей стране возможность разрабатывать и итерировать новую технику за более короткое время — всегда на шаг впереди в вольном королевстве передового авиационного дизайна."
 ql_prc_air_spirit_25:0 "Исследования системной инженерии"
 ql_prc_air_spirit_25_desc:0 "Системная инженерия авиации — это научный метод анализа составных элементов системы, организационной структуры, информационных потоков и механизмов управления для наилучшего достижения её цели, позволяющий компенсировать отдельные технические недостатки подсистем."
 ql_prc_army_spirit_28:0 "Защищать свободу, обеспечивать безопасность"
 ql_prc_army_spirit_28_desc:0 "С врагами наших общих ценностей переговоров нет — пока их тень не будет сметена данной свыше силой! Когда безумный шторм обрушится на этот мир, дрейфующий к фрагментации, кто-то всё же должен поддерживать порядок и давать надежду."
 ql_prc_army_spirit_29:0 "Народ превыше всего, не забывать изначальные стремления"
 ql_prc_army_spirit_29_desc:0 "Народная армия никогда не должна забывать свою коренную цель — беззаветно служить народу, всегда и при любых обстоятельствах оставаясь собственными солдатами народа. Помнить великие истины, открытые историей: справедливость побеждает! Мир побеждает! Народ побеждает!"
 ql_prc_army_spirit_30:0 "Закалять волю, быть твёрдыми в действии"
 ql_prc_army_spirit_30_desc:0 "Родина зовёт! Во что бы мы ни верили, только в единстве можем защитить национальное достоинство и уничтожить варварских головорезов; пусть героизм наших великих предков вдохновляет тебя на войне! Вперёд, к победе!"
 ql_prc_navy_spirit_32:0 "Властвовать над безбрежным океаном"
 ql_prc_navy_spirit_32_desc:0 "Контроль над огромным океаном никогда не бывает завершён — без гарантированного абсолютного превосходства он бессмыслен. Без флота война будет вестись на нашей собственной земле; война подобна матчу, и лучше всего вести его на вражеской половине поля."
 ql_prc_navy_spirit_33:0 "Курс на безбрежную синеву"
 ql_prc_navy_spirit_33_desc:0 "К 2010 году надёжно установить контроль над морями в пределах первой островной цепи и сделать их внутренним морем; к 2020 году обеспечить контроль в пределах второй островной цепи; а к 2040 году обрести силы сдерживать доминирование ВМС США на Тихом и Индийском океанах."
 ql_prc_navy_spirit_34:0 "Создавать силы сдерживания"
 ql_prc_navy_spirit_34_desc:0 "Без контроля над морем наш народ остаётся пленником суши; я выковал ему флот, отворяющий дверь в мир. И пусть тот флот через череду неудач на время дремлет под волнами, он возродится и вернёт свою высшую честь."
 ql_prc_air_spirit_36:0 "Глобальный удар"
 ql_prc_air_spirit_36_desc:0 "Использовать всеобъемлющее воздушное господство для усиленного проецирования силы, максимально предотвращая вмешательство врага; в определённой степени одна авиация способна решить исход войны, не опираясь на армию или флот."
 ql_prc_air_spirit_37:0 "Победа за тысячу миль"
 ql_prc_air_spirit_37_desc:0 "С развитием радиолокационных технологий и сверхдальних ракет «воздух—воздух» постепенно раскрывается потенциал крупномасштабных боёв вне визуальной видимости; при отработанной тактике каждый нарушитель может быть уничтожен без визуального подтверждения."
 ql_prc_air_spirit_38:0 "Покорение передового воздушного пространства"
 ql_prc_air_spirit_38_desc:0 "Армия без господства в воздухе подобна великану без глаз, обречённому слепо метаться по полю боя. Миссия наших ВВС состоит, во-первых, в том, чтобы передовые наземные операции не нарушались, и во-вторых — обеспечить контроль над воздушным пространством театра."
 # Spirit level-up tooltips (tt)
 ql_prc_army_spirit_01_tt:0 "Командиры сухопутных войск: §G100% шанс§! получить §Y+1 к планированию§! и §Y+1 к логистике§! при повышении уровня."
 ql_prc_army_spirit_02_tt:0 "Командиры сухопутных войск: §G100% шанс§! получить §Y+1 к атаке§! при повышении уровня."
 ql_prc_army_spirit_03_tt:0 "Командиры сухопутных войск: §G100% шанс§! получить §Y+1 к обороне§! при повышении уровня."
 ql_prc_navy_spirit_07_tt:0 "Командиры флота: §G100% шанс§! получить §Y+1 к обороне§! при повышении уровня."
 ql_prc_navy_spirit_08_tt:0 "Командиры флота: §G100% шанс§! получить §Y+1 к атаке§! при повышении уровня."
 ql_prc_navy_spirit_09_tt:0 "Командиры флота: §G100% шанс§! получить §Y+1 к манёвру§! и §Y+1 к координации§! при повышении уровня."
