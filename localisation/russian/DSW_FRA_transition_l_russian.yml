l_russian:
 dsw_fra.2017.t:0 "Президентские выборы во Франции 2017 года"
 dsw_fra.2017.d:0 "Эммануэль Макрон побеждает на президентских выборах, и «Вперёд, Республика!» приходит к власти во Франции."
 dsw_fra.1.t:0 "Франция вступает в 2020 год"
 dsw_fra.1.d:0 "Франция теперь использует свои национальные фокусы и события TFR при Эммануэле Макроне."
 dsw_fra.1.a:0 "Начинается новое десятилетие."
 dsw_fra.2.t:0 "Тест выборов 2022 года"
 dsw_fra.2.d:0 "Открывает оригинальный селектор предвыборных путей TFR. Используйте отдельное сохранение для каждого пути."
 dsw_fra.2.a:0 "Открыть селектор путей."
 dsw_fra.10.t:0 "Первая европейская война: триггер исхода"
 dsw_fra.10.d:0 "Проверяет оригинальное событие победы или поражения Франции. Сама война и мирное урегулирование оставлены для более позднего переноса. Использовать после выборов 2022 года."
 dsw_fra.10.a:0 "Проверить победу Франции."
 dsw_fra.10.b:0 "Проверить поражение Франции."
 dsw_fra.ok:0 "ОК."
 dsw_fra.cancel:0 "Отмена."
 DSW_FRA_transition_tt:0 "Загружает французское дерево TFR, сохраняя текущую армию и технологии. Выборы управляются событиями TFR."
 DSW_FRA_external_content_pending_tt:0 "Эта зарубежная сюжетная линия оставлена для более позднего переноса."
 DSW_FRA_european_war_pending_tt:0 "Триггер первой европейской войны оставлен для более позднего переноса."
 DSW_FRA_testing_category:0 "Тесты французских путей"
 DSW_FRA_testing_category_desc:0 "Тестовые входы для переноса французского контента в разработке. Используйте отдельное сохранение для каждого пути."
 DSW_FRA_test_election:0 "Проверить выборы 2022 года"
 DSW_FRA_test_election_desc:0 "Открывает оригинальный селектор предвыборных путей TFR для проверки путей Макрона, Ле Пен, Меланшона, Вилье и других."
 DSW_FRA_test_european_war_outcome:0 "Проверить исходы европейской войны"
 DSW_FRA_test_european_war_outcome_desc:0 "Открывает интерфейс переключения фокусов после победы или поражения; не запускает первую континентальную войну."
