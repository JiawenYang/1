 POL.Conservative_2017: "£generic_Conservative_small Право и справедливость (PiS)"
 HUN.Conservative: "£HUN_emerging_reactionary Фидес — Венгерский гражданский союз"
 HUN.Autocracy: "£generic_Autocracy_small Йоббик"
 HUN.Autocracy_icon: "£generic_Autocracy_small"
 HUN.Autocracy_desc: "(Автократия) — Йоббик, движение «За лучшую Венгрию», — радикальная националистическая партия, сочетающая антиистеблишментскую риторику с программой национального возрождения, сильной государственной власти и открытой враждебности к либеральной демократии.\n\nЙоббик построил свою базу на антицыганской и антисемитской агитации и на враждебности к ЕС и НАТО; в последние годы он смягчил свой имидж, но сохранил жёсткое националистическое ядро. Его влияние — в протестном электорате бедного северо-востока, дисциплинированной сети активистов и готовности сотрудничать с любой силой, бросающей вызов традиционным партиям."
 HUN.Neutral_conservatism: "£HUN_non_aligned_conservative Фидес — Венгерский гражданский союз"
 CZE.Conservative: "£generic_Conservative_small ANO 2011"
 CZE.Conservative_2015: "£generic_Conservative_small ANO 2011"
 CZE.Conservative_2015_icon: "£generic_Conservative_small"
 CZE.Conservative_2015_desc: "(Популизм) — ANO 2011 (чеш. ANO 2011, Akce nespokojených občanů, ANO)\n\nANO 2011 — популистское движение, построенное вокруг миллиардера Андрея Бабиша, который обещает управлять государством как фирмой. Оно выступает против коррупции и старых партий, за компетентное управление, снижение расходов обычных семей, повышение пенсий и ужесточение контроля над миграцией.\n\nДвижение централизовано и предано своему основателю, а гибкая идеология позволяет ему собирать голоса и слева, и справа. Оно скептически относится к углублению интеграции в ЕС и евро. Его влияние — в деловой империи Бабиша, его личной популярности и сильной базе среди пожилых избирателей и жителей малых городов."
 CZE.Neutral_Autocracy: ""
 CZE.Neutral_Autocracy_icon: ""
 CZE.Neutral_Autocracy_desc: ""
 SLO.conservatism: "£generic_Conservative_small Обычные люди и независимые личности (OĽaNO-NOVA)"
 SLO.conservatism_icon: "£generic_Conservative_small"
 SLO.conservatism_desc: ""
 SLO.Conservative: "£generic_Conservative_small Обычные люди и независимые личности (OĽaNO-NOVA)"
 SLO.Conservative_icon: "£generic_Conservative_small"
 SLO.Conservative_desc: "(Реакционизм) — Обычные люди и независимые личности (OĽaNO-NOVA)\n\nOĽaNO-NOVA — популистское консервативное движение во главе с Игорем Матовичем, построенное вокруг борьбы с коррупцией и привилегиями истеблишмента. Оно представляет себя движением обычных граждан, сочетая социально консервативные позиции по вопросам семьи и миграции с щедрыми семейными пособиями и проевропейской внешней политикой.\n\nДвижение сильно централизовано вокруг своего основателя и опирается на протестный электорат, разочарованный в Smer-SD и традиционных правых. Его влияние держится на публичном образе Матовича, антикоррупционной повестке и поддержке консервативных избирателей малых городов и сельской местности."
 POL.conservatism_1_desc: "Консервативная — Prawo i Sprawiedliwość (Право и справедливость) — доминирующая польская национал-консервативная христианско-демократическая партия, сочетающая экономический интервенционизм и социальное обеспечение с социально-консервативными взглядами. Она выступает за осторожное сотрудничество с Европейским союзом и является стойко антироссийской."
 POL.Conservative_2017_desc: "Консервативная — Prawo i Sprawiedliwość (Право и справедливость) — доминирующая польская национал-консервативная христианско-демократическая партия, сочетающая экономический интервенционизм и социальное обеспечение с социально-консервативными взглядами. Она выступает за осторожное сотрудничество с Европейским союзом и является стойко антироссийской."
 CZE.Conservative_desc: "(Популизм) — ANO 2011 (чеш. ANO 2011, Akce nespokojených občanů, ANO)\n\nANO 2011 — популистское движение, построенное вокруг миллиардера Андрея Бабиша, который обещает управлять государством как фирмой. Оно выступает против коррупции и старых партий, за компетентное управление, снижение расходов обычных семей, повышение пенсий и ужесточение контроля над миграцией.\n\nДвижение централизовано и предано своему основателю, а гибкая идеология позволяет ему собирать голоса и слева, и справа. Оно скептически относится к углублению интеграции в ЕС и евро. Его влияние — в деловой империи Бабиша, его личной популярности и сильной базе среди пожилых избирателей и жителей малых городов."
 HUN.Conservative_desc: "(Реакционизм) — Фидес — Венгерский гражданский союз — доминирующая национально-консервативная партия Венгрии во главе с Виктором Орбаном. Она сочетает сильное государство, экономический интервенционизм и щедрые семейные субсидии с самопровозглашённой нелиберальной демократией, жёстким курсом по миграции и политикой приоритета суверенитета.\n\nФидес открыто евроскептичен и скептически относится к западным либеральным институтам, одновременно поддерживая прагматичные связи с Россией и другими не западными державами. Его влияние держится на конституционном большинстве в парламенте, контроле над значительной частью СМИ и верности широкого консервативного электората за пределами Будапешта."
 HUN.Neutral_conservatism_desc: "(Реакционизм) — Фидес — Венгерский гражданский союз — доминирующая национально-консервативная партия Венгрии во главе с Виктором Орбаном. Она сочетает сильное государство, экономический интервенционизм и щедрые семейные субсидии с самопровозглашённой нелиберальной демократией, жёстким курсом по миграции и политикой приоритета суверенитета.\n\nФидес открыто евроскептичен и скептически относится к западным либеральным институтам, одновременно поддерживая прагматичные связи с Россией и другими не западными державами. Его влияние держится на конституционном большинстве в парламенте, контроле над значительной частью СМИ и верности широкого консервативного электората за пределами Будапешта."
