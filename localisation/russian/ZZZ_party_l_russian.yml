l_russian:
 zzz_party.1.t:0 "Новое правительство в Джакарте"
 zzz_party.1.d:0 "После Великой азиатской войны политический ландшафт Индонезии был полностью переписан. С молчаливого согласия оккупационных властей в Джакарту вернулась прoяпонская националистическая правая группировка во главе с семьёй Сухарто; она сформировала авторитарное правительство и взялась за восстановление послевоенной экономики и порядка в архипелаге."
 zzz_party.1.a:0 "Признать новое правительство"
 zzz_party.4.t:0 "Смена режима в Тайбэе"
 zzz_party.4.d:0 "После урегулирования политического вопроса о Тайване правящая команда Тайбэя была заменена, а политические силы острова перегруппировались. Новая администрация начала интеграцию в экономические и судоходные сети материка."
 zzz_party.4.a:0 "Признать новое правительство"
 zzz_party.5.t:0 "Красное правительство в Токио"
 zzz_party.5.d:0 "После поражения Японии многолетнее правление Либерально-демократической партии рухнуло. Коммунистическая партия Японии пришла к власти благодаря послевоенным выборам и поддержке профсоюзов, объявив о роспуске дзайбацу, национализации и восстановлении пацифистского конституционного порядка."
 zzz_party.5.a:0 "Признать новое правительство"
 zzz_party.90.t:0 "$COUNTRY$ формирует коллаборационное правительство"
 zzz_party.90.d:0 "После поражения в войне старый режим $COUNTRY$ рухнул. Сформированное заново коллаборационное правительство приняло управление при поддержке оккупационных властей и объявило о социалистическом курсе."
 zzz_party.90.a:0 "Признать коллаборационное правительство"
 zzz_party.91.t:0 "$COUNTRY$ формирует прозападное правительство"
 zzz_party.91.d:0 "После поражения в войне старый режим $COUNTRY$ рухнул. Сформированное заново временное правительство приняло управление при поддержке оккупационных властей, объявив о создании прозападной демократической системы и восстановлении многопартийных выборов."
 zzz_party.91.a:0 "Признать временное правительство"
 zzz_party.92.t:0 "$COUNTRY$ создаёт прoяпонское националистическое правительство"
 zzz_party.92.d:0 "После поражения в войне старый режим $COUNTRY$ рухнул. При поддержке оккупационных властей прoяпонская националистическая правая группировка взяла на себя управление, провозгласив авторитарный строй и сохранив тесные связи с экономическими и силовыми структурами Японии."
 zzz_party.92.a:0 "Признать новое правительство"
 zzz_party.93.t:0 "Провозглашена Республика Вьетнам"
 zzz_party.93.d:0 "После победы Японии в Великой азиатской войне старый вьетнамский режим рухнул. При поддержке оккупационных властей антикоммунистические южные политики во главе с премьер-министром Нгуен Хыу Тянь провозгласили Республику Вьетнам, объединили страну под Сайгоном и восстановили жёлтый флаг с тремя красными полосами."
 zzz_party.93.a:0 "Признать Республику Вьетнам"
