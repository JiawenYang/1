 #События COVID-19 и зависимости, перенесённые из The Fire Rises
 prc.30.t: "Коронавирус Распространяется на Соседние Провинции"
 prc.30.d: "Коронавирус распространился из Уханя на соседние провинции и регионы. Больницы по всей области сообщают о подозрительных случаях, а местные власти спешно устанавливают карантинные пункты, однако массовые перемещения людей во время новогодних праздников крайне затрудняют отслеживание контактов."
 prc.30.o1: "Нельзя допустить, чтобы паника распространялась быстрее вируса."
 thailand.1.t: "Первые Случаи COVID в Таиланде"
 thailand.1.d: "Министерство здравоохранения Таиланда подтвердило первый случай заражения новым коронавирусом за пределами Китая: 61-летняя китайская туристка из Уханя была госпитализирована в Бангкоке с высокой температурой. Медики отслеживают её контакты и проверяют пассажиров, прибывающих из Китая, в аэропорту Суварнабхуми."
 thailand.1.a: "Тревожно"
 iran.4.t: "Первые Случаи Заболевания COVID-19"
 iran.4.d: "Больницы Тегерана сообщают об увеличении числа пациентов, страдающих тяжелой пневмонией. Большинство пациентов старше 40 лет, а некоторым из них за 30."
 iran.4.a: "Мы должны быть готовы"
 iran.11.t: "Протесты Безработных из-за COVID"
 iran.11.d: "Пандемия парализовала бизнес и подтолкнула безработицу вверх, и рабочие с лавочниками в Тегеране и других крупных городах вышли на улицы. Пока демонстрации немногочисленны, но настроение мрачное: люди требуют выплат и правительственного плана по спасению их средств к существованию."
 iran.11.a: "Это не должно выйти из-под контроля"
 HUN_Corona_Virus: "Коронавирус"
 HUN_Overflowing_Hospitals: "Переполненные Больницы"
 Hungary.13.t: "Вспышка COVID-19 в Будапеште"
 Hungary.13.d: "В Будапеште подтверждены первые случаи заражения коронавирусом. Правительство призывает граждан соблюдать санитарные меры, а больницы готовят изоляционные палаты на ближайшие недели."
 Hungary.13.a: "Чёрт побери!"
 Hungary.14.t: "Нехватка Больничных Коек"
 Hungary.14.d: "С передовой борьбы с COVID поступают мрачные сводки: врачи по всей Венгрии ставят диагнозы пациентам, не осознавая, что в их больницах давно закончились свободные койки. Онкологических больных отправляют домой умирать, а их места занимают пациенты с COVID. Венгрия ждёт ответа от правительства."
 Hungary.14.a: "Что ж... Нужно больше коек!"
 saudi.1.t: "Салман Госпитализирован"
 saudi.1.d: "Сегодня рано утром короля посетил его личный врач из-за внезапных проблем с дыханием и болей в спине. По его словам, проблемы с дыханием начались за несколько недель до этого и с тех пор усугубились. Врачу не потребовалось много времени, чтобы определить, что он заражен Ковид-19. Информация об этом тщательно отслеживается и будет доведена до сведения общественности позднее."
 saudi.1.a: "Молитесь за Короля"
 syria.15.t: "Число случаев заболевания COVID Сократилось?"
 syria.15.d: "Больницы больше не сообщают о массовых случаях заболевания COVID-19. Похоже, что вирус прекратил свое распространение. Пока что..."
 syria.15.a: "Худшее уже позади."
