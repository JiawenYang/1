 GER_Bundeswehr_modifier: "Бундесвер"
 GER_Bundeswehr_modifier_desc: "Бундесвер — это вооруженные силы Федеративной Республики Германия и ее свободно избранного парламента. Он включает в себя как сами вооруженные силы, так и гражданский сектор. Вооруженные силы состоят из четырех родов войск: сухопутных войск, военно-воздушных сил, военно-морского флота и киберпространства и информационной сферы, а также вспомогательного сектора."
 PENINSULA_SHIELD: "Силы Защиты Полуострова"
 peninsula_shield_force_member: "Силы Защиты Полуострова"
 peninsula_shield_force_member_desc: "Силы «Щит полуострова» — региональная военная организация, координирующая совместные усилия по обороне и безопасности государств-членов ССАГПЗ. Её эмблема символизирует единство, защиту и боеготовность, отражая коллективный оборонный потенциал стран ССАГПЗ."
 scientific_outlook_on_development_desc: "Научный взгляд на развитие включает в себя научный социализм, устойчивое развитие, социальное обеспечение, гуманистическое общество, усиление демократии и, в конечном счете, создание Социалистического Гармоничного Общества."
 xi_jinping_thought_desc: "Мысль Си Цзиньпина представляет собой набор политики и идей, основанных на трудах и выступлениях генерального секретаря Коммунистической партии Китая Си Цзиньпина. В нем основное внимание уделялось марксизму-ленинизму и идеям Мао Цзэдуна, месту Китая в истории, стратегическому соперничеству с капиталистическими странами и призыву придерживаться целей коммунизма."

 agrarian_economy_desc: "[FROM.GetName] - крайне бедная страна, экономика которой основана преимущественно на сельскохозяйственной продукции. Пока страна модернизируется, люди будут трудиться на полях, развивая экономику.\n\n§Y$agrarian_economy$§! зарабатывает §Y[?ROOT.GetName]§! §Y$$§![?additional_income_agrarian_economy|+3] §Yмиллиарда§! в неделю.\n\n§RПри ВВП/ДН $4,000 , мы будем считаться промышленно развитыми и потеряем бонус к сельскому хозяйству!§!"

 industrial_complex_desc: "Это здание обеспечивает государство промышленностью для производства гражданских товаров или строительства новых зданий. При необходимости может быть переоборудовано в военную промышленность.\n\n\nОбеспечивает государство:\nБазовым количеством необходимых работников: §Y415K§!\nБазовым объёмом ВВП на §Yгражданскую промышленность§!: $§Y20 миллиардов§!\nБазовым потреблением энергии: §R-0,4§! ГВт"
 arms_factory_desc: "Это сооружение снабжает регион новой военной техникой. При необходимости его можно превратить в завод по выпуску мирной продукции.\"\n\nПредоставляет государству:\nБазовая численность требуемых работников: §Y100K§!\nБазовый прирост ВВП от §Yвоенной промышленности§!: $§Y4 миллиард§!\nБазовое потребление энергии: §R-0.4§! ГВт"
 dockyard_desc: "§YВоенно-морские верфи§! являются показателем способности государства производить военные суда всех типов - §Yпатрульные катера§!, §Yконвои§!, §Yэсминцы§!, §Yавианосцы§! и многое другое.\n\nПредоставляет государству:\nБазовая численность требуемых работников: §Y100K§!\nБазовый прирост ВВП от §Yморской верфи§!: $§Y4 миллиард§!\nБазовое потребление энергии: §R-0.4§! ГВт"

