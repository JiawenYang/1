 jewish_desc: "Самая древняя авраамическая религия в игре, иудаизм, основывается на Торе, традициях и писаниях еврейского народа, насчитывающих более 3000 лет."
 zoroastrian_desc: "Зороастрийская религия — это традиционная вера иранских народов и старой Персидской империи. Зороастрийцы — монотеисты и следуют учениям пророка Зороастра."
 ibadi_desc: "Ибадизм, по утверждениям его приверженцев, старше как суннитского, так и шиитского ислама, но он далеко не так популярен. Ибадиты подчеркивают строгое соблюдение толкования ислама и шариата, которое они считают и более древним, и более ортодоксальным."
 sikh_desc: "Сикхизм — это вера, основанная Гуру Нанаком на рубеже XVI века в Пенджабе. Монотеистическая религия, сикхизм зародилась в районе, где смешиваются ислам и индуизм, но во многом отличается от них обоих."
 theravada_desc: "Как и все буддийские течения, Тхеравада берет начало в учениях Гаутамы Будды в V веке до н. э. Последователи буддизма Тхеравады опираются на палийские каноны в вопросах религиозного и правового руководства, а акцент делается на монашеских обязанностях и достижении статуса архата или просветления."
 vajrayana_desc: "Ваджраяна, также известная как тантрический буддизм или даже ламаизм, является ветвью буддизма, где цель приверженцев — стать бодхисаттвой с помощью использования тантрических техник. Считается, что просветления невозможно достичь просто путем одиночного изучения, его должен преподавать учитель."
 mahayana_desc: "Махаяна — наиболее широко практикуемое течение буддизма. Цель ее приверженцев — достичь просветления, возможно, даже достичь состояния будды."
 christian_desc: "Католицизм — это название христианской традиции, корни которой лежат в старом латинском обряде, признающем Папу Римского главой христианского мира."
 confucian_desc: "Конфуцианство — это термин для обозначения философских учений философа V века до н. э. Конфуция, который подчеркивает личностное развитие и важность хорошего управления."
 hindu_desc: "Индуизм — это термин для обозначения широкого спектра политеистических индийских традиций с общим пантеоном."
 orthodox_desc: "Православная христианская традиция берет свое начало в греческом обряде и считает себя более близкой к изначальным христианским идеалам, чем католицизм. Православные церкви отвергают идею Папы Римского и вместо этого делятся на ряд церквей, возглавляемых патриархами."
 protestant_desc: "Протестантизм охватывает широкий спектр религиозных традиций, начиная с учений Мартина Лютера во время Реформации. Они выступают против ряда условностей, которые со временем развились в католической церкви, и против самой идеи папы."
 shia_desc: "Мусульмане-шииты считают, что законным преемником пророка Мухаммеда как халифа и имама был его двоюродный брат и зять Али. Шииты считают, что ряд имамов последовали за Али и до сих пор ждут пришествия его окончательного преемника."
 shinto_desc: "Синтоизм — древняя этническая религия Японии, которая на протяжении веков сосуществовала с конфуцианством и буддизмом на японских островах."
 sunni_desc: "Суннитский ислам считает, что законным преемником пророка Мухаммеда был его тесть Абу Бакр."
 coptic_desc: "Коптское христианство — это ветвь христианского мира, которая следует александрийскому обряду и подчиняется патриарху в Александрии."
 mormon_desc: "Мормонизм — это религиозное движение, основанное Джозефом Смитом в США в 1820-х годах. У мормонов развилось сильное чувство общности, и они имеют прочные связи между поколениями и с расширенной семьей, что отражает их веру в то, что семьи могут быть запечатаны вместе после смерти."
