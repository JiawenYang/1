l_russian:
 toyko: "Токио"
 toyko_desc: "----\n§9Токио — бесконечная столица Японии: почти половина населения страны, парламент, императорский дом и власть над культурой, экономикой и политикой.\n\nСтарые храмы, огромные торговые центры, Синдзюку, Скайтри и Токийская башня. Мировой лидер в технологиях, финансах и моде — и эталон безопасности и транспорта.§!"
 osaka: "Осака"
 osaka_desc: "----\n§9Осака — третий город Японии и торговый центр Кансая: деньги здесь считают со времён Эдо, а заводы строят с эпохи Мэйдзи. Биржа, корпорации, университеты, Дотонбори и замок Осака. Уличная еда — отдельный вид искусства.§!"
 nagoya: "Нагоя"
 nagoya_desc: "----\n§9Нагоя — столица префектуры Айти и город Toyota: автомобили, авиация, судостроение, Brother и Lexus. Токайдо-синкансэн связывает её с Токио, Киото и Осакой, а замок Нагоя и святилище Ацута хранят историю.§!"
 kyoto: "Киото"
 kyoto_desc: "----\n§9Киото — старая имперская столица, тысяча лет политики и культуры, больше двух тысяч храмов, Кимидзу-дэра и Кинкаку-дзи. Здесь Nintendo соседствует с ткачами кимоно, а Гион-мацури не отменяли ни разу.§!"
 yokohama: "Иокогама"
 yokohama_desc: "----\n§9Иокогама — второй город Японии и главный порт, открытый миру в 1859 году. Минато Мирай 21, Landmark Tower, крупнейший в стране Чайнатаун и парк Ямасита. Nissan и Isuzu отсюда никуда не денутся.§!"
 beijing: "Пекин"
 beijing_desc: "----\n§9Ванфуцзин с неоновыми витринами упирается в тихие хутуны, а императорские сады смотрят на серые здания с красными звёздами. Пекин — столица с 1271 года: ось север-юг, решётка улиц и собственный характер. Местные пьют доужи и не слишком верят начальству.§!"
 tianjin: "Тяньцзинь"
 tianjin_desc: "----\n§9Тяньцзинь — морские ворота Пекина, крупнейший промышленный город севера и ядро Бохайского кольца. Двести лет унижений, концессий и заводов — и всё равно порт, куда купцы едут, как и сто лет назад.§!"
 chengdu: "Чэнду"
 chengdu_desc: "----\n§9Чэнду две тысячи триста лет кормит Дулцзянъянь, а чайные на тротуарах, панды и площадь Тяньфу делают город непохожим на остальные. Здесь собирают истребители и при этом никуда не спешат — редкое сочетание.§!"
 chongqing: "Чунцин"
 chongqing_desc: "----\n§9Чунцин стоит на слиянии Янцзы и Цзялин: три тысячи лет, горы, ночные огни и киберпанк без декораций. Военная столица, потом переселенцы «Трёх ущелий», теперь большие данные и общекитайский хайнань.§!"
 nanjing: "Нанкин"
 nanjing_desc: "----\n§9Бывшая столица шести династий и Республики, Нанкин до сих пор хранит стены эпохи Мин и платаны. Местные скажут, что настоящая причина защищать город — суп с лапшой и утиной кровью. Летом здесь печь, зимой морозильник.§!"
 shanghai: "Шанхай"
 shanghai_desc: "----\n§9Какая у вас была миссия в Шанхае?§!"
 shenzhen: "Шэньчжэнь"
 shenzhen_desc: "----\n§9«Время — деньги, эффективность — жизнь».\n\n«Развитие Шэньчжэня доказало, что политика особых экономических зон верна».\n- Дэн Сяопин§!"
 guangzhou: "Гуанчжоу"
 guangzhou_desc: "----\n§9Триста лет назад Гуанчжоу был единственным окном Китая во внешнюю торговлю — и потому лакомым куском для всех. После реформ его обогнал Шэньчжэнь, но центр дельты Чжуцзян всё равно здесь.§!"
 wuhan: "Ухань"
 wuhan_desc: "----\n§9<Экономический анализ влияния фертильного поведения на домашнее насилие в Китае и Индии>\n«...»\n- Ян Цзинъюань§!"
 yangzhou: "Янчжоу"
 yangzhou_desc: "----\n§9«Сделать Янчжоу знаменитым городом, где древняя культура и современная цивилизация дополняют друг друга».\n- Цзян Цзэминь§!"
 hongkong: "Гонконг"
 hongkong_desc: "----\n§9Вам больше Вонг Кар-вай или Чоу Син-чи?§!"
 macau: "Макао"
 macau_desc: "----\n§9Лас-Вегас Востока§!"
 changchun: "Чанчунь"
 changchun_desc: "----\n§9«Жемчужина за Великой стеной»: дворец Маньчжоу-го, восемь министерств, первый автомобильный завод Китая и киностудия, где родилось новое китайское кино. Теперь здесь электромобили и умные машины.§!"
 dalian: "Далянь"
 dalian_desc: "----\n§9Русские шпили, японские сады и море: Далянь вырос из колониальной эпохи, но помнит Хань. Площадь Синхай, фестиваль пива, глубоководные порты и умное производство — «да» значит величие, «лянь» — связь.§!"
 shenyang: "Шэньян"
 shenyang_desc: "----\n§9Шэньян был столицей Поздней Цзинь с 1625 года: восьмиугольный Дайчжэн-дянь, русская ширококолёсная дорога, японская ЮМЖД, готика на Чжуншаньлу. Текстильные цеха Тьеси и истребители Шэньянской авиастроительной корпорации — промышленная память страны.§!"
 taibei: "Тайбэй"
 taibei_desc: "----\n§9Тайбэй — столица Тайваня и город семи миллионов: Синьи, СиМэньдин, Чжунчжэн и Даань. Тайбэй 101 когда-то был самым высоким зданием мира. Старые стены цинского города давно разобраны, но город остаётся крепостью сам по себе.§!"
 fuzhou: "Фучжоу"
 fuzhou_desc: "----\n§9Фучжоу с Тан и Сун — узел Морского шёлкового пути: военные губернаторы, смены династий, арсенал и флот. В XX веке — хуацяо и денежные переводы, в XXI — цифровой порт, круглосуточные огни и логистика.§!"
 xiamen: "Сямэнь"
 xiamen_desc: "----\n§9Сямэнь с эпохи Мин был торговым портом и крепостью. Позже — мост в Фучжоу-Сямэньский коридор, родина хуацяо и особая экономическая зона с 1980 года. Теперь новый район Цзимэй и высокотехнологичная зона: новая энергетика, море и культура.§!"
 gaoxiong: "Гаосюн"
 gaoxiong_desc: "----\n§9Гаосюн — порт и тяжёлая промышленность южного Тайваня между Гаопин и Эррэнем. Цинские стены стоят, японская планировка жива. После «Инцидента Гаосюна» город зовут родиной тайваньской демократии — и туристы едут смотреть на четыреста лет истории.§!"
 tainan: "Тайнань"
 tainan_desc: "----\n§9Тайнань — «первый город Тайваня», четыреста лет и столица до японцев. Чэнкунский университет, филиалы Национальной библиотеки и Академии Синика, храм Конфуция. Зеландия, Провантия, дом Тэй и Ко — прошлое стоит рядом с Южным научным парком.§!"
 seoul: "Сеул"
 seoul_desc: "----\n§9Сеул растянулся вдоль реки Хан в кольце гранитных гор: башни Каннама, дворцовые ворота и круглосуточные компьютерные клубы. Половина страны живёт в этой агломерации, вторая приезжает на выходные. Кимчи здесь не обсуждается.§!"
 busan: "Пусан"
 busan_desc: "----\n§9Пусан — морской ответ Кореи Сеулу: крупнейший порт страны, кинофестиваль у пляжа и рыбный рынок, где осьминог всё ещё спорит с покупателем. Сезон тайфунов отрезвляет местные небоскрёбы.§!"
 pyongyang: "Пхеньян"
 pyongyang_desc: "----\n§9Спасибо, отец Ким Ир Сен§!"
 delhi: "Дели"
 delhi_desc: "----\n§9Дели — это несколько городов друг на друге: могольский Красный форт и опутанные проводами переулки Старого Дели, имперские проспекты Лаченса и метро, идущее под всем этим. Зимой воздух становится видимым предметом.§!"
 mumbai: "Мумбаи"
 mumbai_desc: "----\n§9Мумбаи держится на пригородных электричках, Болливуде и муссонных ливнях — всё это упаковано на семи островах, ставших одним городом. Местная электричка в час пик — не транспорт, а контактный спорт. Остальное лечит вада пав.§!"
 jakarta: "Джакарта"
 jakarta_desc: "----\n§9Джакарта одновременно тонет, заливается и стоит в пробках — и всё равно работает. Башня Монас смотрит на горизонт из торговых центров и кампунгов, а водители баджаев знают короткие пути, о которых карты не слышали.§!"
 singapore: "Сингапур"
 singapore_desc: "----\n§9Как будто они скопировали и вставили Mirror's Edge§!"
 sydney: "Сидней"
 sydney_desc: "----\n§9Сидней продаёт себя гаванью: паруса Оперы, арка моста и паромы, выполняющие обещанный открытками маршрут. За открыткой — самые дорогие дома страны и комендантский час, обрывающий вечеринку в полночь.§!"
 bangkok: "Бангкок"
 bangkok_desc: "----\n§9Бангкок передвигается на тук-туках, мототакси и лодках по каналам, мимо золотых храмов и торговых башен, а навигацию обеспечивает запах уличной еды. Рынок Чатучак на выходных — тест на прочность для ног и кошелька.§!"
 dhaka: "Дакка"
 dhaka_desc: "----\n§9Дакка — одновременно столица рикш и цех мировой швейной индустрии. По Буриганге ходят баржи, по улицам — миллионы велорикш, остальное берёт на себя муссон.§!"
 hanoi: "Ханой"
 hanoi_desc: "----\n§9Ханой укутывает озеро Хоанкьем мотоциклами, колониальными виллами, кофейнями и запахом фо в шесть утра. Улицы Старого квартала названы в честь цехов, которые их заполняли; теперь их заполняют скутеры.§!"
 ho_chi_minh_city: "Хошимин"
 ho_chi_minh_city_desc: "----\n§9Как будто у Cyberpunk появилась душа!§!"
 islamabad: "Исламабад"
 islamabad_desc: "----\n§9Исламабад нарисован на бумаге в 1960-х: широкие проспекты, сетка секторов, холмы Маргалла позади и белые крылья мечети Фейсала в центре. Это спокойный, кондиционированный ответ на шум остальной страны.§!"
 kathmandu: "Катманду"
 kathmandu_desc: "----\n§9Катманду лежит в чаше холмов, где храмов больше, чем светофоров, а после землетрясения 2015 года долина отстраивается вокруг своих площадей. Это последняя ровная земля перед Гималаями и первый похмельный день каждого треккера.§!"
 kuala_lumpur: "Куала-Лумпур"
 kuala_lumpur_desc: "----\n§9Куала-Лумпур — это башни Петронас на открытке и уличные лотки на земле: наси лемак, лакса, тех тарик, налитый с высоты. Это климат тропического леса с приделанным горизонтом.§!"
 manila: "Манила"
 manila_desc: "----\n§9Манила — это испанские стены Интрамуроса, джипни, раскрашенные как карнавальные платформы, и пробка, начинающаяся до завтрака. Закат над заливом бесплатен; проехать через весь город, чтобы его увидеть, — нет.§!"
 naypyidaw: "Нейпьидо"
 naypyidaw_desc: "----\n§9Нейпьидо — столица, построенная для будущего, которое не наступило: двадцатиполосные дороги почти без машин, зоопарк, копия пагоды и отели посреди ничего. Самая заметная дорожная опасность — случайный слон.§!"
 auckland: "Окленд"
 auckland_desc: "----\n§9Окленд стоит на полусотне вулканов между двумя гаванями — поэтому горизонт низкий, а паромы загружены. «Город парусов» лидирует по лодкам на душу населения, а рынок жилья уверенно обгоняет зарплаты.§!"
 canberra: "Канберра"
 canberra_desc: "----\n§9Канберра — столица градостроителя: озеро, треугольник проспектов, парламент на холме и бесконечные круговые развязки. Здесь тихо, аккуратно и иногда горит.§!"
 melbourne: "Мельбурн"
 melbourne_desc: "----\n§9Мельбурн держится на трамваях, кофе из переулков и австралийском футболе, а горизонт растёт за сеткой улиц XIX века. Погода успеет сменить все четыре сезона до обеда.§!"
 wellington: "Веллингтон"
 wellington_desc: "----\n§9Веллингтон — самая ветреная столица мира, зажатая между гаванью и зелёными холмами, с парламентом-ульем и кофейнями Кьюба-стрит посередине. Если шляпа уцелела, кофе того стоит.§!"
