l_russian:

 BAN.conservatism: "£BAN_western_conservatism Джатья"
 BAN.conservatism_icon: "£BAN_western_conservatism"
 BAN.conservatism_desc: "«Джатия Парти» — политическая партия Бангладеш, основанная 1 января 1986 года Хуссейном Мухаммадом Эршадом в качестве гражданской платформы для поддержки его военного президентства. В течение двух лет она дважды победила на парламентских выборах, хотя оба раза результаты выборов были признаны многими некорректными. После смещения Эршада в результате массового восстания 1990 года партия не смогла восстановить электоральное господство, но несколько раз входила в коалиционные правительства вместе с «Авами Лиг»."
 BAN.liberalism: "£BAN_western_liberal Бангладешская партия джатия"
 BAN.liberalism_icon: "£BAN_western_liberal"
 BAN.liberalism_desc: "Бангладешская партия «Джатия», известная просто как БДП (Бхаратия Джатия), — правоцентристская консервативная политическая партия Бангладеш. Она откололась от первоначальной партии «Джатия», основанной бывшим президентом Хоссейном Мохаммадом Эршадом. Ранее она называлась «Джатия Парти» (Назиур) в честь покойного председателя партии Назиура Рахмана Манзура. Манзур был членом партии «Мукти Бахини» во время Войны за независимость Бангладеш в 1971 году и занимал пост министра местного самоуправления и развития сельских районов, а также мэра городского совета Дакки при режиме Эршада. Манзур также занимал пост генерального секретаря партии «Джатия» с 1998 по 2001 год."
 BAN.communist_state: "£BAN_emerging_communism Рабочая партия Бангладеш"
 BAN.communist_state_icon: "£BAN_emerging_communism"
 BAN.communist_state_desc: "Рабочая партия Бангладеш — коммунистическая партия Бангладеш. Рашед Хан Менон — президент Рабочей партии Бангладеш, Фазле Хоссейн Бадша — генеральный секретарь партии."
 BAN.anarchist_communism: "£BAN_anarchist_communism Джатия Самайтантрик Даль"
 BAN.anarchist_communism_icon: "£BAN_anarchist_communism"
 BAN.anarchist_communism_desc: "«Джатия Самаджтантрик Дал» — политическая партия Бангладеш. Основателем партии был Сераджул Алам Хан. Партия играла ведущую роль во время восстания в Бангладеш в 1972–1975 годах. Нынешний председатель партии — Хасанул Хак Ину."
 BAN.Caliphate: "£BAN_Caliphate Bangladesh Джамаат-и-ислами"
 BAN.Caliphate_icon: "£BAN_Caliphate"
 BAN.Caliphate_desc: "«Бангладеш Джамаат-и-Ислами» — консервативно-исламистская политическая партия в Бангладеш. Образовалась в 1979 году в восточнопакистанском крыле партии «Джамаат-и-Ислами Пакистан». Является крупнейшей исламистской партией в стране."
 BAN.Conservative: "£BAN_Conservative Авами лиг"
 BAN.Conservative_icon: "£BAN_Conservative"
 BAN.Conservative_desc: "«Авами лиг» (Bangladesh Awami League), широко известная как «Авами лиг», — крупнейшая политическая партия Бангладеш. Основанная 23 июня 1949 года и являющаяся старейшей партией страны, она сыграла важную роль в борьбе страны за независимость. Это одна из двух традиционно доминирующих партий в стране, наряду с Националистической партией Бангладеш, и она сохраняла единоличное господство в политической системе страны с 2009 по 2024 год, прежде чем была свергнута в ходе Июльской революции. Деятельность партии была запрещена послереволюционным правительством 10 мая 2025 года в соответствии с Законом о борьбе с терроризмом."
 BAN.Nat_Populism: "£BAN_Nat_Populism Националистическая партия Бангладеш"
 BAN.Nat_Populism_icon: "£BAN_Nat_Populism"
 BAN.Nat_Populism_desc: "Бангладешская националистическая партия — крупнейшая политическая партия Бангладеш. Она была основана 1 сентября 1978 года президентом Зиауром Рахманом с целью объединения народа на основе националистической идеологии. Впоследствии Бангладешская националистическая партия (БНП) стала одной из двух традиционно доминирующих партий в Бангладеш, наряду со своим соперником, партией «Авами Лиг»."
 BHU.conservatism: "£BHU_western_conservatism Партия мира и процветания"
 BHU.conservatism_icon: "£BHU_western_conservatism"
 BHU.anarchist_communism: "£BHU_anarchist_communism Объединённая партия Бутана"
 BHU.anarchist_communism_icon: "£BHU_anarchist_communism"
 BHU.Neutral_Libertarian: "£BHU_Neutral_Libertarian Народно-демократическая партия"
 BHU.Neutral_Libertarian_icon: "£BHU_Neutral_Libertarian"
 BRM.Autocracy: "£BRM_Autocracy Национальная партия справедливости Мьянмы"
 BRM.Autocracy_icon: "£BRM_Autocracy"
 CBD.liberalism: "£CBD_liberalism Партия Сам Рейнси"
 CBD.liberalism_icon: "£CBD_liberalism"
 CBD.liberalism_desc: "«Партия свечей» (Candlelight Party) — либеральная партия Камбоджи. Она входила в Совет азиатских либералов и демократов, Либеральный интернационал и Альянс демократов. Это крупнейшая оппозиционная партия Камбоджи и главный конкурент правящей Народной партии Камбоджи. Национальная избирательная комиссия отстранила партию от участия в выборах 2023 года, несмотря на то, что ранее ей было разрешено участвовать в местных выборах 2022 года. Партия возобновила политическую деятельность в октябре 2021 года после бездействия с 2012 года."
 CBD.conservatism: "£CBD_conservatism ФУНСИНПЕК"
 CBD.conservatism_icon: "£CBD_conservatism"
 CBD.conservatism_desc: "Национальный объединённый фронт за независимую, нейтральную, мирную и сотрудничающую Камбоджу (ФУНСИНПЕК) — роялистская политическая партия Камбоджи. Основанная в 1981 году Нородомом Сиануком, она начиналась как движение сопротивления правительству Народной Республики Кампучия (НРК). В 1982 году она сформировала пакт сопротивления с Коалиционным правительством Демократической Кампучии (КПДК), совместно с Кхмерским народным фронтом национального освобождения (КНФО) и «красными кхмерами». В 1992 году она стала политической партией."
 CBD.Autocracy: "£CBD_Autocracy Народная партия Камбоджи"
 CBD.Autocracy_icon: "£CBD_Autocracy"
 CBD.Autocracy_desc: "Народная партия Камбоджи — камбоджийская политическая партия, правящая страной с 1979 года. Основанная в 1951 году, она первоначально была известна как Народно-революционная партия Кампучии (КРП)."
 CBD.Neutral_Libertarian: "£CBD_Neutral_Libertarian Камбоджийская национальная партия поддержки"
 CBD.Neutral_Libertarian_icon: "£CBD_Neutral_Libertarian"
 CBD.Neutral_Libertarian_desc: "Камбоджийская национальная партия поддержки была создана её председателем Пеном Сованом. Она была сформирована 21 января 1998 года и в тот же день провела свой первый съезд."
 CHI.Conservative: "£generic_Conservative_small Китайская крестьянско-рабочая демократическая партия"
 CHI.Conservative_desc: "Китайская крестьянско-рабочая демократическая партия (КПДП) — одна из восьми малых демократических партий Китайской Народной Республики, находящихся под руководством Коммунистической партии Китая. Партия была официально основана во французской концессии в Шанхае 9 августа 1930 года левыми членами Гоминьдана. В её состав входят преимущественно специалисты в области здравоохранения, медицины и смежных областях науки и техники. Это пятая по величине малая партия в Китае."
 CHI.Neutral_conservatism: "£CHI_non_aligned_conservative Китайская партия Чжи Гун"
 CHI.Neutral_conservatism_icon: "£CHI_non_aligned_conservative"
 CHI.Neutral_conservatism_desc: "Китайская партия «Чжигун» (КЧП) — шестая по величине демократическая партия в Китайской Народной Республике. В настоящее время её членами в основном являются вернувшиеся из-за рубежа китайцы, их семьи и представители, имеющие связи за границей. Основанная в 1925 году, КЧП в первую очередь состояла из представителей зарубежных обществ «Триады Хунмэнь». Её предшественницей была зарубежная организация, созданная «Американской партией «Чжигун» Хунмэнь», китайской общинной группой, целью которой была защита законных прав и интересов китайцев, проживающих за рубежом. В своей практической работе КЧП также выполняет обязанности китайского отделения «Триады Хунмэнь», организуя встречи с зарубежными делегациями и членами «Триады Хунмэнь», а также проводя визиты в зарубежные организации «Триады Хунмэнь»."
 CHI.oligarchism: "£generic_oligarchism_small Китайская демократическая национальная строительная ассоциация"
 CHI.oligarchism_desc: "Китайская демократическая национальная строительная ассоциация (КДНСА), или КНД, является третьей по величине демократической партией в Китайской Народной Республике. Основанная 16 декабря 1945 года как Демократическая национальная строительная ассоциация, она была переименована в Китайскую демократическую национальную строительную ассоциацию решением своего второго расширенного общего собрания в июле 1952 года. Это политическая партия, состоящая в основном из представителей экономического сектора, отличающаяся своим политическим альянсовым характером. Она является партией-участницей китайской социалистической системы, признающей руководство Коммунистической партии Китая и тесно сотрудничающей с ней. Первыми членами КДНСА были в основном высокопоставленные деятели культуры и образования, а также национальные промышленники и бизнесмены. В настоящее время ее члены в основном представляют крупные и средние города, включая предпринимателей и экономических деятелей среднего и высокого уровня. Жун Ижэнь — единственный вице-президент Китайской Народной Республики от этой партии и второй член демократической партии, занимающий этот пост после Сун Цинлин."
 CHI.Neutral_Libertarian: "£CHI_Neutral_Libertarian_small Общество Цзюсань"
 CHI.Neutral_Libertarian_icon: "£CHI_Neutral_Libertarian_small"
 CHI.Neutral_Libertarian_desc: "Общество Цзюсань — седьмая по величине демократическая партия в Китайской Народной Республике. В её уставе указано, что это политическая партия, обладающая характеристиками политического альянса, состоящая преимущественно из высокопоставленных и среднестатистических интеллектуалов в области науки и техники. Она является близким союзником Коммунистической партии Китая, признает её руководство и тесно сотрудничает с ней, а также участвует в китайской социалистической системе. В первые годы её членами были в основном учёные. В настоящее время её членами являются преимущественно высокопоставленные и среднестатистические интеллектуалы в области науки и техники."
 LAO.communist_state: "£LAO_emerging_communism Народно-революционная партия Лаоса"
 LAO.communist_state_icon: "£LAO_emerging_communism"
 LAO.communist_state_desc: "Народно-революционная партия Лаоса (НРПЛ) — учредительная и единственная правящая партия Лаосской Народно-Демократической Республики. Монополия партии на государственную власть гарантирована статьей 3 Конституции Лаоса. Она поддерживает унитарное государство с централизованным контролем над экономикой и вооружёнными силами."
 NEP.communist_state: "£Communist_Party_of_Nepal Коммунистическая партия Непала (маоистский центр)"
 NEP.communist_state_desc: ""
 NEP.Neutral_Communism: "£Communist_Party_of_Nepal_not_hardline Коммунистическая партия Непала (объединённая марксистско-ленинистская)"
 NEP.Neutral_Communism_desc: ""
 PAK.conservatism: "£PAK_western_conservatism Мусульманская лига Пакистана"
 PAK.conservatism_icon: "£PAK_western_conservatism"
 PAK.conservatism_desc: "Пакистанская мусульманская лига (функциональная) — националистическая политическая партия Пакистана, поддерживающая клан хурсов. Она является одной из отколовшихся групп Пакистанской мусульманской лиги. Буква «F» в её названии означает «функциональная». Лига в первую очередь связана с религиозным лидером синдхов Пиром Пагаро."
 PAK.liberalism: "£PAK_liberalism Движение Муттахида Кауми"
 PAK.liberalism_icon: "£PAK_liberalism"
 PAK.liberalism_desc: "Движение «Муттахида Кауми» — пакистанская политическая партия с либеральными взглядами и мухаджирской националистической идеологией. Лидер партии — Халид Макбул Сиддики. Символом партии является воздушный змей. Партия действует преимущественно в Карачи, где в настоящее время проживает большинство мухаджиров. Партия стремится отстаивать права мухаджиров в Пакистане посредством мирной и демократической борьбы. Партия является отколовшейся фракцией ДМК-Л."
 PAK.socialism: "£PAK_socialism Пакистанская народная партия"
 PAK.socialism_icon: "£PAK_socialism"
 PAK.socialism_desc: "Пакистанская народная партия (PNP) — пакистанская политическая партия левоцентристского толка, исповедующая демократическую социалистическую идеологию. Она входит в тройку основных политических партий наряду с Пакистанской мусульманской лигой (N) и движением «Пакистан Техрик-и-Инсаф»."
 PAK.communist_state: "£PAK_Communist_State Коммунистическая партия Пакистана"
 PAK.communist_state_icon: "£PAK_Communist_State"
 PAK.communist_state_desc: "Коммунистическая партия Пакистана была основана в Калькутте, Индия, вскоре после образования Пакистана 6 марта 1948 года. На 2-м съезде Коммунистической партии Индии, который проходил в Калькутте в то время, было принято решение о создании отдельной коммунистической партии в новом государстве Пакистан. Считалось, что Пакистан, будучи относительно молодой страной и страдающей от нестабильности, созрел для революции. Делегаты из Пакистана отделились и провели отдельное заседание, на котором учредили Коммунистическую партию Пакистана (КПП). Саджад Захир, основатель Всеиндийской ассоциации прогрессивных писателей из Западного Пакистана, был избран генеральным секретарем. Делегаты из Восточного Пакистана избрали Восточно-Пакистанский провинциальный комитет. Многие мусульманские лидеры КПИ были отправлены в Пакистан, чтобы помочь в формировании партии. КПП приняла ленинскую идеологию, стремясь спровоцировать коммунистическую революцию через ядро из интеллигенции и рабочих, — стратегия, вдохновленная подходом Владимира Ленина во время русской революции 1917 года."
 PAK.Conservative: "£PAK_Conservative Мусульманская лига Пакистана"
 PAK.Conservative_icon: "£PAK_Conservative"
 PAK.Conservative_desc: "Пакистанская мусульманская лига (Наваз) — правоцентристская консервативная политическая партия. Является одной из трёх основных политических партий наряду с Пакистанской народной партией и движением «Пакистан Техрик-и-Инсаф»."
 PAK.anarchist_communism: "£PAK_anarchist_communism Национальная партия Авами"
 PAK.anarchist_communism_icon: "£PAK_anarchist_communism"
 PAK.anarchist_communism_desc: "Национальная партия Авами (Awami National Party) — пакистанская политическая партия, базирующаяся преимущественно в Хайбер-Пахтунхве. Она занимает левые политические позиции, придерживаясь пуштунского национализма и федерализма. Партия была основана Абдулом Вали Ханом в 1986 году. Её нынешним президентом является Аймал Вали Хан, правнук Бачи Хана. Генеральным секретарём является Миан Ифтихар Хуссейн."
 PAK.Nat_Autocracy: "£PAK_Nat_Autocracy Мусульманская лига Пакистана"
 PAK.Nat_Autocracy_icon: "£PAK_Nat_Autocracy"
 PAK.Nat_Autocracy_desc: "Пакистанская мусульманская лига (Q) — пакистанская политическая партия с правоцентристской политической позицией и умеренно-консервативной идеологией."
 PAK.Nat_Fascism: "£PAK_Nat_Fascism Ямиат Улема-и-Ислам"
 PAK.Nat_Fascism_icon: "£PAK_Nat_Fascism"
 PAK.Nat_Fascism_desc: "«Джамият улема-и-Ислам Пакистан» — пакистанская политическая партия крайне правого толка, исповедующая исламский фундаментализм. Партия была основана в 1945 году под названием «Джамият улема-и-Ислам». Она возникла в результате фракционного раскола в 1988 году. Буква «Ф» в названии партии означала имя её лидера, Мауланы Фазл-ур-Рехмана."
 PAK.Nat_Populism: "£PAK_Nat_Populism Движение за справедливость"
 PAK.Nat_Populism_icon: "£PAK_Nat_Populism"
 PAK.Nat_Populism_desc: "«Пакистан Техрик-и-Инсаф» — политическая партия Пакистана, основанная в 1996 году игроком в крикет и политиком Имраном Ханом. ПТИ входит в тройку крупнейших политических партий Пакистана наряду с Пакистанской мусульманской лигой-Наваз и Пакистанской народной партией."
 TAI.conservatism_desc: "Три принципа народа - Китайский Гоминьдан (ГМД) был основан в 1894 году доктором Сунь Ятсеном. Его предшественниками были Синчжунхуэй, Тунмэнхуэй, Гоминьдан и Китайская революционная партия. В 1912 году Тунмэнхуэй объединился с четырьмя небольшими партиями, чтобы реорганизоваться в Гоминьдан. В 1919 году он был официально назван Китайским Гоминьданом."
 TAI.Conservative_desc: "Новая партия была основана 10 августа 1993 года. Ее предшественником был Новый Альянс Гоминьдана, внутренняя группа Гоминьдана. Чжао Шаокан был первым лидером. Когда была основана Новая партия, ее основной концепцией было противостояние Коммунистической партии и независимости Тайваня, а также поддержка идей Сунь Ятсена."
 TAI.Neutral_conservatism_desc: "People First Party — 90-я политическая партия, созданная в Китайской Республике. Партия была основана 31 марта 2000 года. Ее предшественником была New Taiwanese Service Team, созданная Джеймсом Суном и Чан Цзю-сюном во время президентских выборов Китайской Республики 2000 года. Перед президентскими выборами Китайской Республики 2000 года Джеймс Сун был исключен из Гоминьдана, поэтому после выборов была создана People First Party. Джеймс Сун является главным лидером партии. Поскольку основной цвет партии — оранжевый, внешний мир обычно называет ее «Оранжевым лагерем»."
 TAI.Nat_Populism_desc: "Китайская молодёжная партия, или просто Молодёжная партия, — политическая партия в Китайской Республике. Она была основана в 1923 году в Республиканском зале Сите-де-Роз, пригороде Парижа, Франция, иностранными студентами с националистической идеологией, такими как Цзэн Ци, Ли Хуан и Ху Говэй. Молодёжная партия была третьей по величине политической партией в современной истории Китая, уступая только Гоминьдану и Коммунистической партии Китая. Она участвовала в работе правительства по созданию конституции и переехала на Тайвань вместе с правительством Китайской Республики в 1949 году."
 TAI.Nat_Fascism: "£TAI_Nat_Fascism Партия содействия объединению Китая"
 TAI.Nat_Fascism_desc: "Партия содействия объединению Китая, также известная как Юнионистская партия, является небольшой крайне правой политической партией на Тайване, которая выступает за объединение Китая."
