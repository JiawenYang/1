 VIE.communist_state_desc: "Коммунистическая партия Вьетнама (КПВ) – единственная легальная партия Вьетнама. Основанная в 1930 году Хо Ши Мином, КПВ стала правящей партией Северного Вьетнама в 1954 году после Первой Индокитайской войны, а всего Вьетнама – в 1975 году после Вьетнамской войны. Хотя номинально она существует параллельно с Вьетнамским Отечественным фронтом, она сохраняет унитарное правительство и осуществляет централизованный контроль над государством, армией и средствами массовой информации. Верховенство КПВ гарантировано статьей 4 национальной конституции. Вьетнамская общественность обычно называет КПВ просто «Партия» или «Наша партия»."
