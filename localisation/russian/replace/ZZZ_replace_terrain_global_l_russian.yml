l_russian:
 mexico_city: "Мехико"
 mexico_city_desc: "----\n§9Мехико построен на осушенном озере и потихоньку проседает, но всё равно остаётся самым шумным, деловым и живым городом Америк.§!"
 detroit: "Детройт"
 detroit_desc: "----\n§9Мотор Motown мог и заглохнуть, но ритм не остановился. На пустырях цветут цветы там, где раньше собирали Ford.§!"
 san_antonio: "Сан-Антонио"
 san_antonio_desc: "----\n§9Помните об Аламо, потом закажите тарелку чили и забудьте про остальную программу.§!"
 birmingham: "Бирмингем"
 birmingham_desc: "----\n§9Сталь, соул и бык на постаменте в центре — городу пришлось на горьком опыте учиться менять мотив.§!"
 tampa: "Тампа"
 tampa_desc: "----\n§9Сигарные фабрики, торговые центры и два хоккейных кубка, которых во Флориде никто не ждал.§!"
 ottawa: "Оттава"
 ottawa_desc: "----\n§9Столица настолько вежливая, что даже коты на Парламентском холме имеют допуск. Здесь ничего не происходит, и в этом смысл.§!"
 denver: "Денвер"
 denver_desc: "----\n§9Город на высоте мили: Скалистые горы смотрят, как вы бегаете, а сам воздух считается тренировкой.§!"
 portland: "Портленд"
 portland_desc: "----\n§9Держите Портленд странным — а потом объясните официанту, почему вы всё ещё веган в два часа ночи.§!"
 dallas: "Даллас"
 dallas_desc: "----\n§9Большие причёски, ещё большие пикапы и силуэт, который лучше всего смотрится в повторах 1980-х.§!"
 toronto: "Торонто"
 toronto_desc: "----\n§9Шесть миллионов человек, которые извиняются раньше, чем сигналят, и башня, которая всё ещё смотрит на город свысока.§!"
 minneapolis: "Миннеаполис"
 minneapolis_desc: "----\n§9Десять тысяч озёр, одна линия трамвая и зима, которая подаёт официальную жалобу на ваше лицо.§!"
 las_vegas: "Лас-Вегас"
 las_vegas_desc: "----\n§9Что случилось здесь, остаётся здесь. Долги, правда, возвращаются домой вместе с вами.§!"
 atlanta: "Атланта"
 atlanta_desc: "----\n§9Пробки такие густые, что тянут на погодное явление, и всё равно столица южного хип-хопа и аэропортовых пересадок.§!"
 columbus: "Коламбус"
 columbus_desc: "----\n§9Самый большой маленький город Огайо — тестовый рынок для всего, что Америка в итоге купит.§!"
 san_diego: "Сан-Диего"
 san_diego_desc: "----\n§9Идеальная погода, военно-морская база и зоопарк, который почти тянет на национальную достопримечательность.§!"
 austin: "Остин"
 austin_desc: "----\n§9Половина — техностартапы, половина — кантри-бары, и всё это стоит в пробке на Interstate 35.§!"
 oklahoma_city: "Оклахома-Сити"
 oklahoma_city_desc: "----\n§9Нефтяные деньги, степной гром и мемориал, напоминающий, что здешнее небо шутить не любит.§!"
 sacramento: "Сакраменто"
 sacramento_desc: "----\n§9Калифорнийская столица: жаркое лето, миндальные сады и реки, которые не подписывали план по засухе.§!"
 indianapolis: "Индианаполис"
 indianapolis_desc: "----\n§9Перекрёсток Америки: май здесь религия, а трек — её собор.§!"
 buffalo: "Буффало"
 buffalo_desc: "----\n§9Снежные бури с озера, рабочий характер и крылышки с сельдереем, который вы точно не тронете.§!"
 cape_town: "Кейптаун"
 cape_town_desc: "----\n§9Столовая гора, два океана и ветер такой силы, что ему каждый вечер дают новое имя.§!"
 cairo: "Каир"
 cairo_desc: "----\n§9Двадцать миллионов человек, река из пробок и пирамиды, видимые с парковки торгового центра.§!"
 alexandria: "Александрия"
 alexandria_desc: "----\n§9Великая библиотека однажды сгорела; у новой лучше бэкапы и вид.§!"
 volgograd: "Волгоград"
 volgograd_desc: "----\n§9Город, дважды сменивший имя, но всё ещё стоит там, где Волга делает последний поворот перед Каспием.§!"
 rostovdon: "Ростов-на-Дону"
 rostovdon_desc: "----\n§9Южные ворота Дона: речная торговля, футбольные кричалки и силуэт, который снова и снова отстраивают.§!"
 yekaterinburg: "Екатеринбург"
 yekaterinburg_desc: "----\n§9Здесь Урал встречается с деньгами: советский бетон рядом со стеклянными башнями и трагедия последнего царя в подвале.§!"
 nizhnynovgorod: "Нижний Новгород"
 nizhnynovgorod_desc: "----\n§9Ярмарка, обогатившая Волгу; теперь здесь делают софт и машины, а не спорят.§!"
 novosibirsk: "Новосибирск"
 novosibirsk_desc: "----\n§9Крупнейший город Сибири, построенный наспех ради железной дороги и до сих пор держащийся на академическом упрямстве.§!"
 kazan: "Казань"
 kazan_desc: "----\n§9Татарская столица, где мечеть и православный собор делят один силуэт без драки.§!"
 tallinn: "Таллин"
 tallinn_desc: "----\n§9Средневековый старый город с цифровым правительством: голосуют онлайн, а ходят по булыжникам.§!"
 riga: "Рига"
 riga_desc: "----\n§9Фасады модерна, балтийский ветер и летний праздник песни, который перекрывает политику.§!"
 vilnius: "Вильнюс"
 vilnius_desc: "----\n§9Барочные церкви и самопровозглашённая республика художников за рекой, так и не получившая паспорт.§!"
 chisinau: "Кишинёв"
 chisinau_desc: "----\n§9Винные подвалы длиннее страны, а мэр однажды судился со светофорами.§!"
 tiraspol: "Тирасполь"
 tiraspol_desc: "----\n§9Замороженный конфликт: Ленин всё ещё на главной площади, а валюту за пределами не потратить.§!"
 odessa: "Одесса"
 odessa_desc: "----\n§9Потёмкинская лестница, морской бриз и чувство юмора, которое выживает абсолютно после всего.§!"
 lvov: "Львов"
 lvov_desc: "----\n§9Кофе, булыжники и габсбургское похмелье — в самом лучшем смысле.§!"
 belgrade: "Белград"
 belgrade_desc: "----\n§9Здесь Сава встречается с Дунаем, а сплавы — с рассветом: город, который гуляет на собственных руинах.§!"
 budapest: "Будапешт"
 budapest_desc: "----\n§9Два города, одна река и термальные купальни, построенные римлянами, которые не ждали руин-баров.§!"
 prague: "Прага"
 prague_desc: "----\n§9Сто шпилей, один замок и пиво дешевле туристического достоинства.§!"
 bratislava: "Братислава"
 bratislava_desc: "----\n§9Маленькая столица сохранила замок, потеряла империю и теперь подаёт лучшее пиво в радиусе сорока минут.§!"
 munich: "Мюнхен"
 munich_desc: "----\n§9Пивные залы, BMW и Октоберфест, из-за которого весь мир носит ледерхозены неправильного размера.§!"
 hamburg: "Гамбург"
 hamburg_desc: "----\n§9Портовый город с кварталом складов, который любит ЮНЕСКО и постоянно проверяет прилив.§!"
 frankfurt: "Франкфурт"
 frankfurt_desc: "----\n§9Банковские башни, крошечный старый город и вокзал, где каждый поезд — это спор.§!"
 hannover: "Ганновер"
 hannover_desc: "----\n§9Выставки, красная линия через весь город и самый плоский силуэт в Германии.§!"
 koln: "Кёльн"
 koln_desc: "----\n§9Собор, который строили 632 года, одеколон 4711 и карнавал, останавливающий весь Рейнланд.§!"
 stuttgart: "Штутгарт"
 stuttgart_desc: "----\n§9Mercedes, Porsche и долина, забитая машинами так, что холмы в основном предназначены для того, чтобы на них смотреть.§!"
 bern: "Берн"
 bern_desc: "----\n§9Столица Швейцарии: медведи, аркады и река, которая петляет вопросительным знаком.§!"
 zurich: "Цюрих"
 zurich_desc: "----\n§9Банки, шоколад и озеро, настолько чистое, что в нём видно собственные сожаления.§!"
 vienna: "Вена"
 vienna_desc: "----\n§9Кофейни, опера и муниципалитет, который сдаёт счастье в аренду с 1919 года.§!"
 amsterdam: "Амстердам"
 amsterdam_desc: "----\n§9Кольцо каналов, велосипеды и рынок жилья, на фоне которого тюльпанная лихорадка кажется скромной.§!"
 brussels: "Брюссель"
 brussels_desc: "----\n§9Штаб-квартира ЕС, шоколад и бюрократия, превратившая компромисс в искусство.§!"
 krakow: "Краков"
 krakow_desc: "----\n§9Драконы Вавеля, площадь размером с футбольное поле и студенческие бары, которые никогда не закрываются.§!"
 bucharest: "Бухарест"
 bucharest_desc: "----\n§9Париж Балкан с парламентом, который съел целый квартал; теперь дыры заполняют стартапы.§!"
 sofia: "София"
 sofia_desc: "----\n§9Гора Витоша у порога, римские руины в метро и город, который пожимает плечами на трёх алфавитах.§!"
 zagreb: "Загреб"
 zagreb_desc: "----\n§9Австрийские площади, балканская кофейная культура и музей разбитых отношений, куда не записаться.§!"
 marseille: "Марсель"
 marseille_desc: "----\n§9Порт, где говорят быстро, едят буйабес и не доверяют никому, кто спешит.§!"
 lyon: "Лион"
 lyon_desc: "----\n§9Желудок Франции: шёлковые деньги, бушоны и город двух рек, придумавший собственный свет.§!"
 nice: "Ницца"
 nice_desc: "----\n§9Английская набережная, галечные пляжи и налоговый режим, который держит Ривьеру вежливой.§!"
 bordeaux: "Бордо"
 bordeaux_desc: "----\n§9Вино, фасады у реки и трамвай, настолько плавный, что местные почти перестали жаловаться.§!"
 nantes: "Нант"
 nantes_desc: "----\n§9Судостроительные верфи стали машинами искусства: гигантский механический слон гуляет по старым докам.§!"
 toulouse: "Тулуза"
 toulouse_desc: "----\n§9Розовый кирпич, крылья Airbus и студенты, которые спорят обо всём, кроме регби.§!"
 strasbourg: "Страсбург"
 strasbourg_desc: "----\n§9Европейский парламент, франко-германское меню и собор, у которого когда-то был самый высокий шпиль на Земле.§!"
 lisbon: "Лиссабон"
 lisbon_desc: "----\n§9Семь холмов, жёлтые трамваи и пирожное с заварным кремом, которое решает минимум две ваши проблемы.§!"
 madrid: "Мадрид"
 madrid_desc: "----\n§9Поздние ужины, споры постарше и музейный треугольник, который переживает любое правительство.§!"
 barcelona: "Барселона"
 barcelona_desc: "----\n§9Кривые Гауди, оживлённый порт и футбольный клуб, который считает себя целой страной.§!"
 athens: "Афины"
 athens_desc: "----\n§9Античный мрамор рядом с современным граффити; спор, по сути, так и не закончился.§!"
 palermo: "Палермо"
 palermo_desc: "----\n§9Город садов, мрамора и света, где дворцы поднимаются между морем и горами. Правила дорожного движения здесь — рекомендация.§!"
 naples: "Неаполь"
 naples_desc: "----\n§9Везувий на горизонте, пицца в руке, а бельё в переулках висит как праздничные флажки.§!"
 milan: "Милан"
 milan_desc: "----\n§9Недели моды, финансы и собор, похожий на кружево, вырезанное из мрамора.§!"
 venice: "Венеция"
 venice_desc: "----\n§9Город, который решил строиться на воде, а потом взял со всех входную плату.§!"
 istanbul: "Стамбул"
 istanbul_desc: "----\n§9Два континента, одна пробка на мосту и паромы, превращающие поездку на работу в круиз с видом.§!"
 ankara: "Анкара"
 ankara_desc: "----\n§9Столица, построенная нарочно: министерства, бульвары и замок, который за всем присматривает.§!"
 izmir: "Измир"
 izmir_desc: "----\n§9Эгейский бриз, набережная Кордон и упрямо светский приморский характер.§!"
 bursa: "Бурса"
 bursa_desc: "----\n§9Османские первые места: первая столица, первый шёлк и каштановые сладости, которые доживают до весны.§!"
 adana: "Адана"
 adana_desc: "----\n§9Хлопок, кебабы и жара, от которой парит река Сейхан.§!"
 tehran: "Тегеран"
 tehran_desc: "----\n§9Гора Дамаванд смотрит на смог; метро переполнено, а спор старше пробок.§!"
 baghdad: "Багдад"
 baghdad_desc: "----\n§9Тигр, книги и город, который отстраивал свои библиотеки больше раз, чем кому-либо стоило бы.§!"
 damascus: "Дамаск"
 damascus_desc: "----\n§9Одна из древнейших столиц мира: оазис, большая мечеть и терпение старше войны.§!"
 aleppo: "Алеппо"
 aleppo_desc: "----\n§9Цитадель, базар и город, который снова и снова открывает свои ворота.§!"
 jerusalem: "Иерусалим"
 jerusalem_desc: "----\n§9Четыре квартала, три веры и один очень спорный силуэт.§!"
 riyadh: "Эр-Рияд"
 riyadh_desc: "----\n§9Пустынная столица, за одно поколение прошедшая от глинобитного города до стеклянных башен.§!"
 abu_dhabi: "Абу-Даби"
 abu_dhabi_desc: "----\n§9Нефтяные деньги превратились в музеи, мангровые заросли и силуэт, которому не нужны оправдания.§!"
 dubai: "Дубай"
 dubai_desc: "----\n§9Силуэт, построенный на амбициях, кондиционерах и самом высоком во всём мире.§!"
 doha: "Доха"
 doha_desc: "----\n§9Городок ловцов жемчуга стал газовой столицей и купил чемпионат мира, чтобы это доказать.§!"
