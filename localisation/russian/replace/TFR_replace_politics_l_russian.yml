 CHI_diplo_icon_tooltip_desc: "Восточноазиатская оборонная инициатива, обычно называемая ВАОИ — это международная организация, возглавляемая §RКитайской Народной Республикой§!. Эта организация призвана обеспечивать мир и стабильность в Азии и защищать свои государства-члены от агрессии милитаристов.\n\nКак лидер этой организации и инициатор коллективной безопасности в Азии, Китай является бесспорным ядром организации. Он будет использовать собственное оружие для защиты себя и своих союзников, одновременно демонстрируя на мировой арене свою роль крупной державы, способной поддерживать мир."
 EADI_diplo_icon_tooltip_desc: "Как формальный член Соглашения о Восточноазиатской оборонной инициативе (ВАОИ), эта страна, безусловно, может считаться суверенным государством по сравнению с некоторыми политически нерешительными странами.\n\nОднако из-за чрезмерной мощи стран-ядра ВАОИ, даже без значительного политического вмешательства Китая, некоторые антикитайские страны по-прежнему рассматривают ее как вассальное государство Китая."
 EADI_Supervise_diplp_icon_tooltip_desc: "Поскольку страна не обладает возможностью независимого управления, часть ее национальных полномочий временно передается в ВАОИ для надзора до тех пор, пока новое правительство не возьмет под полный контроль низовой уровень. Поэтому страну называют государством под наблюдением.\n\nХотя некоторые страны обвиняют это в том, что это является конкретным доказательством китайского вмешательства в их внутренние дела, в действительности ВАОИ прекратит свой надзорный статус после того, как страна завершит свою собственную политическую реструктуризацию."
 EADI_Observer_diplp_icon_tooltip_desc: "Эта страна является государством-наблюдателем в рамках §RВосточноазиатской оборонной инициативы§! (ВАОИ), термин, обычно используемый для стран, которые близки к Пекину, но еще не официально заявили о своем присоединении к ВАОИ. Эта страна официально присоединится к ВАОИ после определенного процесса, став членом, сражающимся на стороне Пекина."
 JAP_diplo_icon_tooltip_desc: "После краха американской гегемонии Япония оказалась перед прямой угрозой со стороны давнего противника по ту сторону моря. Чтобы обрести достаточную силу для противостояния «красному дракону», неизбежна организация коллективной безопасности и обороны, подобная НАТО. С этой целью Япония и Австралия возглавили создание §CОрганизация Договора о Тихоокеанской обороне§!, в которой Япония теперь является ключевым членом и первой линией обороны против китайского гиганта."
 AST_diplo_icon_tooltip_desc: "Последствия краха американской гегемонии затронули и Австралию. Для защиты собственной безопасности Австралия вместе с Японией создала §CОрганизация Договора о Тихоокеанской обороне§!, надеясь объединить страны Азиатско-Тихоокеанского региона для противодействия угрозе со стороны Пекина. Австралия будет служить тыловой базой ОДТО, предоставляя ресурсы с австралийского континента государствам-членам договора для создания мощной военной машины."
 RAJ_diplo_icon_tooltip_desc: "Индия давно стремится отомстить Китаю, начиная с 1962 года, и эскалация глобальной напряженности подпитывает ее амбиции. После того, как Япония и Австралия возглавили создание Организации Договора о Тихоокеанской обороне, Индия также решила присоединиться к этому лагерю против китайского гиганта. Хотя Индия презирает этих так называемых союзников, ей пришлось временно подчиниться организации, чтобы противостоять давлению со стороны Пекина. Однако, если бы Тихоокеанская оборонная организация однажды одержала победу над Китаем, §RИндия, возможно, не пошла бы по тому же пути, что и они.§!"
 PDTO_diplo_icon_tooltip_desc: "Эта страна является членом §CОрганизация Договора о Тихоокеанской обороне§!. Она обладает независимым суверенитетом, и ее членство в ОДТО во многом обусловлено прошлыми спорами с Китаем и обещаниями выгод от Токио и Канберры. Хотя независимые государства-члены должны быть на равных условиях, различия в национальной мощи означают, что конфликты и дискриминация все еще существуют."
 PDTO_Supervise_diplp_icon_tooltip_desc: "Страна существует в рамках организации как зависимое государство других стран, что означает, что она не обладает полным суверенитетом и находится под контролем своего сюзерена. Столкнувшись с международной критикой, ее сюзерен заявляет, что это «временный надзор», однако различные признаки указывают на то, что сюзерен занимался рядом хитрых и вымогательских действий внутри страны."
 PDTO_Observer_diplp_icon_tooltip_desc: "Эта страна тесно связана со странами ОДТО и также получила статус наблюдателя от ОДТО. Хотя она еще не присоединилась к §CОрганизация Договора о Тихоокеанской обороне§!, международное сообщество в целом считает, что ее вступление — лишь вопрос времени."
