 NATO_member_desc: "§YОрганизация Североатлантического договора (НАТО)§! — военно-политический союз государств Северной Америки и Европы, созданный на основе Североатлантического договора 1949 года. После окончания холодной войны её задачи расширились от территориальной обороны до управления кризисами, борьбы с терроризмом и операций за пределами зоны ответственности; в рамках программы «Партнёрство ради мира» и Средиземноморского диалога альянс сотрудничает с внешними партнёрами. В результате последовательных расширений число членов выросло с 16 до 29 к 2017 году. Статья 5 гласит, что вооружённое нападение на одного члена является нападением на всех; она применялась лишь однажды — после терактов 11 сентября 2001 года, для операций в Афганистане. Высший орган принятия решений — Североатлантический совет, действующий на основе консенсуса; саммит в Уэльсе в 2014 году установил цель довести оборонные расходы до 2 % ВВП и разместил батальонные боевые группы в странах Балтии и Польше."
