l_russian:
 # Центральноамериканская цепочка (перенесено 2026-11-07)
 NIC.4.t: "Объединённая Центральная Америка"
 NIC.4.d: "Войны в Центральной Америке завершились. Гватемала, Гондурас, Сальвадор, Никарагуа, Коста-Рика и Панама теперь управляются из единой столицы. Начинается восстановление, а новое государство консолидирует перешеек."
 NIC.4.a: "Перешеек объединён"

 CEN_unification: "Объединение Центральной Америки"
 CEN_unification_with_panama: "Объединить Центральную Америку"
 CEN_unification_with_panama_desc: "Все соперничающие правительства на перешейке под нашим контролем; осталось присоединить Панаму и провозгласить единое центральноамериканское государство."

 CEN: "Соединённые Провинции Центральной Америки"
 NIC_puppet: "Правительство под руководством Никарагуа"
