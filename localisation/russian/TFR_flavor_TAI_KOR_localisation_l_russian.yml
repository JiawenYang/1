l_russian:
 #События фона: путь мирного воссоединения с Тайванем и путь корейской конфедерации
 tai_kor_flavor.1.t: "Рыбный сезон возвращается"
 tai_kor_flavor.1.d: "Впервые за годы лодки из Сямэня и Цзиньмэня выходят в одни и те же воды по одному расписанию приливов. Улов скромный, но портовые бары полны, а старики, когда-то кричавшие друг на друга через пролив, теперь спорят лишь о цене на кальмаров. В $COUNTRY$ говорят, что море помнит то, что забывает политика."
 tai_kor_flavor.1.a: "Пусть лодки выходят"
 tai_kor_flavor.2.t: "Возвращение в дельту Янцзы"
 tai_kor_flavor.2.d: "Тайваньские промышленники, десятилетие переносившие заводы во Вьетнам и Индию, тихо открывают офисы в Куньшане и Сучжоу. Бумажная волокита проще, рейсы снова прямые, и поколение управленцев, воспитанное в осторожности, начинает торговаться за обедом. Суммы пока небольшие, но направление очевидно."
 tai_kor_flavor.2.a: "Бизнес идёт за флагом"
 tai_kor_flavor.3.t: "Старые солдаты возвращаются домой"
 tai_kor_flavor.3.d: "Автобус с деревенскими старейшинами-ветеранами пересекает пролив в сопровождении полиции и с медсестрой на борту. Некоторые не видели родных мест с 1940-х; большинство находят восстановленный родовой храм и могилы, за которыми ухаживают чужие люди. Они возвращаются с фотографиями, банкой земли и молчанием, которое длится весь обратный полёт."
 tai_kor_flavor.3.a: "Некоторые долги можно наконец отдать"
 tai_kor_flavor.4.t: "Семьи по обе стороны пролива"
 tai_kor_flavor.4.d: "Браки через пролив, долго считавшиеся бюрократической серой зоной, наконец получают ясную правовую основу. Пары, годами доказывавшие, что женаты, теперь стоят в очередях, чтобы доказать это снова — на этот раз печатью, которую признают все. Их дети, выросшие между двумя паспортами, спрашивают, какой из них понадобится в следующем году."
 tai_kor_flavor.4.a: "Один дом, одна бумага"
 tai_kor_flavor.5.t: "Летний лагерь обмена"
 tai_kor_flavor.5.d: "Триста студентов из $COUNTRY$ проводят две недели в Нанкине и Ханчжоу; половина ждёт пропаганды, а находит плохую столовую еду, ночные споры и общий плейлист. К последнему дню они перестают называть друг друга «они». Организаторы с обеих сторон говорят об успехе и тихо тревожатся о продолжении."
 tai_kor_flavor.5.a: "Пусть они встречаются"
 tai_kor_flavor.6.t: "Звезда на материковой сцене"
 tai_kor_flavor.6.d: "Тайваньская поп-певица собирает стадион в Шанхае за одиннадцать минут. На бис она поёт с двумя акцентами, а зал отвечает третьим. На материке тур называют культурной интеграцией, на острове — возвращением домой. Никому в зале, кажется, нет дела до того, какое слово выбрано."
 tai_kor_flavor.6.a: "Залу не читали инструкцию"
 tai_kor_flavor.7.t: "Товарищеский матч, два флага"
 tai_kor_flavor.7.d: "Выставочный матч по бейсболу через пролив собирает полные трибуны и дипломатическую головную боль. Флаг гостей разрешён у входа, но не на табло, и диктор решает проблему, дважды читая имена игроков. Хозяева выигрывают одно очко; обе скамейки аплодируют."
 tai_kor_flavor.7.a: "Девять иннингов мира"
 tai_kor_flavor.8.t: "Паломничество к Мацзу"
 tai_kor_flavor.8.d: "Флот паломников из $COUNTRY$ пересекает пролив к Мэйчжоу с благовониями, барабанами и статуей богини моря. Материковый храм принимает его с красной дорожкой; местные чиновники старательно называют гостей «соотечественниками» и никогда «гостями». На обратном пароме член храмового комитета замечает, что богине, по крайней мере, никогда не требовалась виза."
 tai_kor_flavor.8.a: "Вера легче политики"
 tai_kor_flavor.9.t: "Кэсон снова открывается"
 tai_kor_flavor.9.d: "Ворота промышленного парка Кэсон распахиваются после лет молчания. Южнокорейские менеджеры идут по цехам, где станки ещё укрыты пыльными чехлами, а северокорейские рабочие выходят в смены с новыми пропусками. Выпуск первого месяца ничтожен; зарплата за первый месяц выплачена вовремя — и это главная новость."
 tai_kor_flavor.9.a: "Станки снова запускаются"
 tai_kor_flavor.10.t: "Встречи на горе Кымган"
 tai_kor_flavor.10.d: "Автобусы с разделёнными семьями поднимаются к центру встреч на горе Кымган, где комнаты пронумерованы, а свидания отмеряются чиновниками с секундомерами. Восьмидесятилетняя женщина узнаёт брата по тому, как он складывает руки. Им дают три часа, ланч-бокс и фотографию, которую обе стороны будут прятать от соседей."
 tai_kor_flavor.10.a: "Три часа — это три часа"
 tai_kor_flavor.11.t: "Магазины в Пханмунджоме"
 tai_kor_flavor.11.d: "После сокращения поста пограничников несколько торговцев вновь открывают лотки на южной стороне деревни перемирия. Они продают лапшу быстрого приготовления, открытки и, неизбежно, сувенирные бинокли, чтобы смотреть на другую сторону линии, которая уже не значит того, что раньше. Самый ходовой товар — брелок в форме старого разделительного каната."
 tai_kor_flavor.11.a: "Малая торговля, малый мир"
 tai_kor_flavor.12.t: "Матч между двумя Кореями"
 tai_kor_flavor.12.d: "Товарищеский матч Север—Юг проходит на стадионе, где два гимна исполняются один за другим и обе трибуны встают. Матч заканчивается ничьей, которую комментаторы называют дипломатическим результатом. После игроки обмениваются майками и, с некоторым трудом, телефонами."
 tai_kor_flavor.12.a: "Ничья, на которую никто не жалуется"
 tai_kor_flavor.13.t: "Кымган открывается для туристов"
 tai_kor_flavor.13.d: "Первые за годы туристические паромы причаливают у горы Кымган. Курорт достроен наполовину, аквапарк пока бетонная коробка, но пляжи чистые, а гиды запомнили три языка. Южнокорейские гости жалуются на цены; северокорейский персонал — на то, что чаевые считают не в той валюте."
 tai_kor_flavor.13.a: "Пусть приезжают и смотрят"
 tai_kor_flavor.14.t: "Два голоса, одна сцена"
 tai_kor_flavor.14.d: "Концерт в Сеуле сводит северную певицу баллад и южную поп-группу. Аранжировка неловкая, перевод ещё хуже, а финал — песня, которую обе стороны считают своей — поднимает зал. Трансляцию задерживают на тридцать минут, чтобы каждая телекомпания успела вырезать представление другой."
 tai_kor_flavor.14.a: "Сделайте громче"
 tai_kor_flavor.15.t: "Первый поезд за семьдесят лет"
 tai_kor_flavor.15.d: "Пробный поезд идёт из Сеула в Синыйджу и обратно с инспекторами, журналистами и одним очень нервным инженером. Путь латаный, сигналы ручные, и дорога занимает втрое больше времени. Но переход состоялся, и кто-то в вагоне-ресторане открывает бутылку, хранившуюся в шкафу с 1990-х."
 tai_kor_flavor.15.a: "Уложить второй путь"
 tai_kor_flavor.16.t: "Общий Чусок"
 tai_kor_flavor.16.d: "Впервые две Кореи проводят совместную трансляцию Чусока: те же песни, та же еда, два разных ведущих читают один сценарий. Семьи, разделённые старой линией, смотрят её в разных комнатах и один вечер спорят об одном и том же — на чьей стороне песню спели лучше."
 tai_kor_flavor.16.a: "Один праздник, две трансляции"
