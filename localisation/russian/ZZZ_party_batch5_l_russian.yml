l_russian:
 zzz_party.164.t:0 "Победа Имрана Хана"
 zzz_party.164.d:0 "После всеобщих выборов 2018 года «Движение за справедливость» получило относительное большинство в Национальной ассамблее. Имран Хан принял присягу в качестве премьер-министра, сместив пакистанскую политику от двух династических партий к антисистемному популистскому движению."
 zzz_party.164.a:0 "Принять результат"
 zzz_party.165.t:0 "Смена власти в Исламабаде"
 zzz_party.165.d:0 "Национальная ассамблея приняла вотум недоверия Имрану Хану. Мусульманская лига Пакистана (Наваз) объединила оппозицию и выдвинула Шахбаза Шарифа на пост премьер-министра, вернув традиционные партии к власти в Исламабаде."
 zzz_party.165.a:0 "Принять результат"
 zzz_party.166.t:0 "Победа «Пактан Харапан»"
 zzz_party.166.d:0 "На выборах 2018 года «Пактан Харапан» положил конец шестидесятилетнему правлению «Барисан Насионал». Махатхир Мохамад вернулся на пост премьер-министра в возрасте девяноста двух лет, обеспечив Куала-Лумпуру первую подлинную смену правящей партии."
 zzz_party.166.a:0 "Принять результат"
 zzz_party.167.t:0 "«Шератонский манёвр»"
 zzz_party.167.d:0 "«Берсату» вышла из «Пактан Харапан» и вместе с Объединённой малайской национальной организацией и Исламской партией сформировала новое правительство. Мухиддин Яссин стал премьер-министром, и реформистский альянс распался менее чем через два года."
 zzz_party.167.a:0 "Принять результат"
 zzz_party.168.t:0 "Час Анвара"
 zzz_party.168.d:0 "На выборах 2022 года ни один блок не получил большинства. «Пактан Харапан» сформировал коалиционное правительство при посредничестве Янг ди-Пертуан Агонга, и Анвар Ибрагим наконец стал премьер-министром, вернув Малайзию на реформистский путь."
 zzz_party.168.a:0 "Принять результат"
 zzz_party.169.t:0 "Второй срок сильного человека"
 zzz_party.169.d:0 "Выборы 2019 года прошли по новой конституции, разработанной военными. «Пхаланг Прачарат» и его младшие партнёры сохранили власть, и Прают Чан-Оча превратился из лидера переворота в избранного премьер-министра."
 zzz_party.169.a:0 "Принять результат"
 zzz_party.170.t:0 "Возвращение «Пхыа Тхай»"
 zzz_party.170.d:0 "Хотя «Движение вперёд» получило больше всего мест на выборах 2023 года, Сенат заблокировал его путь к власти. «Пхыа Тхай» вместо этого объединилась с консервативным лагерем и сформировала правительство, а Сеттха Тхависин стал премьер-министром, вернув политическую сеть Таксина в центр власти."
 zzz_party.170.a:0 "Принять результат"
