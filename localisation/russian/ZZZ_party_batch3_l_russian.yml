l_russian:
 zzz_party.120.t:0 "Новый президент в Карфагене"
 zzz_party.120.d:0 "Независимый кандидат Каис Саид побеждает на президентских выборах 2019 года, и антиистеблишментские силы перекраивают политику Туниса."
 zzz_party.120.a:0 "Принять результат"
 zzz_party.123.t:0 "Перу: победа сельского учителя"
 zzz_party.123.d:0 "Сельский учитель Кастильо побеждает во втором туре президентских выборов 2021 года, и политический центр тяжести Лимы смещается влево."
 zzz_party.123.a:0 "Принять результат"
 zzz_party.124.t:0 "Политический кризис в Лиме"
 zzz_party.124.d:0 "Кастильо подвергается импичменту, и вице-президент Болуарте принимает президентские полномочия. В Перу к власти приходит технократическое переходное правительство."
 zzz_party.124.a:0 "Принять результат"
