l_russian:
 zzz_party.10.t:0 "Новый хозяин Белого дома"
 zzz_party.10.d:0 "Кандидат республиканцев победил на выборах 2016 года. Новый президент приносит присягу, и Вашингтон переходит от либерализма к консерватизму."
 zzz_party.10.a:0 "Принять результат"
 zzz_party.14.t:0 "Лейбористы входят в Даунинг-стрит"
 zzz_party.14.d:0 "Лейбористы одерживают сокрушительную победу на выборах 2024 года. Четырнадцать лет правления консерваторов заканчиваются, и Британия поворачивает к социал-демократии."
 zzz_party.14.a:0 "Принять результат"
 zzz_party.15.t:0 "Новое лицо в Елисейском дворце"
 zzz_party.15.d:0 "Центристский кандидат побеждает на президентских выборах. У Елисейского дворца новый хозяин, и французская политика уходит от традиционного деления на левых и правых."
 zzz_party.15.a:0 "Принять результат"
 zzz_party.100.t:0 "Новый хозяин Голубого дома"
 zzz_party.100.d:0 "Кандидат Демократической партии побеждает на президентских выборах 2017 года. Политический ветер в Сеуле поворачивает к либерализму."
 zzz_party.100.a:0 "Принять результат"
 zzz_party.101.t:0 "Президентство в Ёнсане"
 zzz_party.101.d:0 "Консервативный кандидат побеждает на президентских выборах 2022 года. В Корее сменяется власть, курс ужесточается в отношении Севера и сближается с Вашингтоном."
 zzz_party.101.a:0 "Принять результат"
 zzz_party.102.t:0 "Новая коалиция в Риме"
 zzz_party.102.d:0 "Движение пяти звёзд и Лига формируют коалиционное правительство. Политическая карта Рима перекроена популистскими силами."
 zzz_party.102.a:0 "Принять результат"
 zzz_party.104.t:0 "Центристы возвращаются в Варшаву"
 zzz_party.104.d:0 "Гражданская коалиция получает большинство на парламентских выборах 2023 года. Польская политика возвращается к проевропейскому центристскому курсу."
 zzz_party.104.a:0 "Принять результат"
 zzz_party.106.t:0 "Лейбористы берут Канберру"
 zzz_party.106.d:0 "Лейбористы побеждают на выборах 2022 года. Политический центр тяжести Канберры смещается к социал-демократии и климатической повестке."
 zzz_party.106.a:0 "Принять результат"
 zzz_party.107.t:0 "Династия возвращается в Манилу"
 zzz_party.107.d:0 "Семья Маркос возвращается к власти на президентских выборах 2022 года. Манила возвращается к политике сильной руки и кланов."
 zzz_party.107.a:0 "Принять результат"
 zzz_party.110.t:0 "Президент-аутсайдер в Киеве"
 zzz_party.110.d:0 "Комедийный актёр, ставший политиком, побеждает на президентских выборах 2019 года. Политический ландшафт Киева переписан заново."
 zzz_party.110.a:0 "Принять результат"
 zzz_party.111.t:0 "Правая волна в Бразилиа"
 zzz_party.111.d:0 "Болсонару побеждает на президентских выборах 2018 года. Бразильская политика поворачивает к правому популизму."
 zzz_party.111.a:0 "Принять результат"
 zzz_party.112.t:0 "Лула возвращается"
 zzz_party.112.d:0 "Лула побеждает действующего президента на выборах 2022 года. Бразилия возвращается к левому и социал-демократическому курсу."
 zzz_party.112.a:0 "Принять результат"
 zzz_party.113.t:0 "Либертарианец в Буэнос-Айресе"
 zzz_party.113.d:0 "Милей побеждает на президентских выборах 2023 года. Аргентина поворачивает к радикальному свободному рынку и правому популизму."
 zzz_party.113.a:0 "Принять результат"
 zzz_party.171.t:0 "Мексика поворачивает влево"
 zzz_party.171.d:0 "Лопес Обрадор побеждает на президентских выборах 2018 года во главе коалиции MORENA. Новое правительство обещает положить конец коррупции старых партий и переориентировать экономический курс страны."
 zzz_party.171.a:0 "Принять результат"
 zzz_party.172.t:0 "Шейнбаум продолжает преобразования"
 zzz_party.172.d:0 "Шейнбаум побеждает на президентских выборах 2024 года с самым высоким результатом за десятилетия. MORENA сохраняет власть, и её коалиция с зелёными и Партией труда продолжается."
 zzz_party.172.a:0 "Принять результат"
