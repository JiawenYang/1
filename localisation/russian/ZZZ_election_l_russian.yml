l_russian:
 ZZZ_election.0.t:0 "Приближаются национальные выборы"
 ZZZ_election.0.d:0 "Срок полномочий парламента подходит к концу. Штабы партий завершают подготовку кампаний, спонсоры определяются со ставками, и политическое будущее страны решится у избирательных урн. До дня голосования у правительства ещё есть возможность повлиять на исход."
 ZZZ_election.0.a:0 "Финансировать кампанию правящей партии (§Y-50§! политических очков)"
 ZZZ_election.0.b:0 "Финансировать кампанию крупнейшей оппозиции (§Y-75§! политических очков)"
 ZZZ_election.0.c:0 "Не вмешиваться в кампанию"
 ZZZ_election.2.t:0 "Голоса подсчитаны"
 ZZZ_election.2.d_majority:0 "Крупнейшая партия преодолела порог большинства. Она сформирует правительство самостоятельно, и новый кабинет вступит в должность в ближайшие дни."
 ZZZ_election.2.d_coalition:0 "Ни одна партия не получила большинства. Крупнейшая партия согласилась управлять вместе со второй по величине, и обе подписали коалиционное соглашение на весь срок."
 ZZZ_election.2.d_minority:0 "Ни одна партия не получила большинства, и коалиционного соглашения достичь не удалось. Крупнейшая партия возглавит правительство меньшинства, зависящее от ситуативной поддержки в парламенте."
 ZZZ_election.2.a:0 "Принять результат"
 ZZZ_election.4.t:0 "Второй тур завершён"
 ZZZ_election.4.d:0 "Первый тур не выявил победителя. Два лидирующих кандидата вновь встретились перед избирателями, и страна сделала выбор между ними."
 ZZZ_election.4.a:0 "Принять результат второго тура"
 ZZZ_election_chain_tt:0 "Маркер избирательной цепочки: это окно принадлежит шаблону выборов ZZZ (метка в логе: §YZZZ_template§!). Если это окно не появилось, страна использует общую цепочку MD (MD4_election_campaign.0, метка в логе: §YMD_generic§!)."
