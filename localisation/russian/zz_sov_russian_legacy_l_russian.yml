l_russian:
 sov_russian_legacy_army:0 "Наследие старых русских армейских реформ"
 sov_russian_legacy_army_desc:0 "Остатки массовой мобилизационной системы и централизованного командования: обильная тяжёлая промышленность, но низкая военная эффективность, высокие потери, хрупкое снабжение, медленная цепь командования."
 sov_russian_legacy_navy:0 "Наследие старых русских армейских реформ"
 sov_russian_legacy_navy_desc:0 "Разрушенная портовая инфраструктура рядом с устаревшим подводным флотом; медленный ремонт, но традиция подводного рейдерства жива."
 sov_russian_legacy_air:0 "Наследие старых русских армейских реформ"
 sov_russian_legacy_air_desc:0 "Устаревшая система подготовки и редкие асы, но институционализированное сохранение опыта ограничивает потерю налёта после гибели эскадрилий."
