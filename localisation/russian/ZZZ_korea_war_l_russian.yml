l_russian:
 ZZZ_KW_korea_war.1.t:0 "Окно переговоров закрывается"
 ZZZ_KW_korea_war.1.d:0 "9 мая 2022 года. Последний раунд межкорейских переговоров завершается без рамочного соглашения. Договор не подписан, война не объявлена — но окно для урегулирования путём переговоров закрыто. С этого дня Сеулу придётся выбирать между сдерживанием и авантюрой."
 ZZZ_KW_korea_war.1.a:0 "Мы сделали всё, что могли."
 ZZZ_KW_korea_war.2.t:0 "Полуостров в мире"
 ZZZ_KW_korea_war.2.d:0 "Рамочная конфедерация сохраняется. Север и Юг входят в долгий переходный период, а «Голубой дом» переходит к прогрессивному правительству, приверженному политике солнечного света. Войны на этом полуострове не будет."
 ZZZ_KW_korea_war.2.a:0 "Открывается новый путь."
 ZZZ_KW_korea_war.3.t:0 "К власти приходит жёсткая линия"
 ZZZ_KW_korea_war.3.d:0 "Переговоры мертвы, и избиратели обращаются к консервативному правительству, обещающему отвечать на провокации решительно. Новая администрация приказывает полностью пересмотреть северную угрозу и тихо готовится к худшему."
 ZZZ_KW_korea_war.3.a:0 "Порядок прежде всего."
 ZZZ_KW_korea_war.4.t:0 "Чрезвычайное военное положение"
 ZZZ_KW_korea_war.4.d:0 "Декабрь 2024 года. Столкнувшись с враждебным парламентом и рушащейся политической базой, президент объявляет чрезвычайное военное положение, ссылаясь на северную угрозу. Бронетанковые части движутся к столице, Национальное собрание окружено."
 ZZZ_KW_korea_war.4.a:0 "Объявить военное положение."
 ZZZ_KW_korea_war.5.t:0 "Ночь в Национальном собрании"
 ZZZ_KW_korea_war.5.d:0 "Депутаты баррикадируются в зале заседаний и голосованием отменяют указ. Улицы заполняют протестующие. Правительство перешло черту, за которую нельзя вернуться, и единственный выход, который оно видит, теперь ведёт на север."
 ZZZ_KW_korea_war.5.a:0 "Пути назад нет."
 ZZZ_KW_korea_war.6.t:0 "Война против Севера"
 ZZZ_KW_korea_war.6.d:0 "На рассвете Республика Корея объявляет войну Северу с целью полной аннексии. Перемирия не будет, паузы в переговорах не будет, второго раунда переговоров тоже. Полуостров в состоянии войны — и регион не останется в стороне надолго."
 ZZZ_KW_korea_war.6.a:0 "Бросаем всё."
 ZZZ_KW_korea_war.7.t:0 "Великая азиатская война"
 ZZZ_KW_korea_war.7.d:0 "Токио объявляет войну Пекину. Великая азиатская война началась, и бои на Корейском полуострове — лишь её первый фронт."
 ZZZ_KW_korea_war.7.a:0 "Это было неизбежно."
 ZZZ_KW_korea_war.8.t:0 "Полуостров в огне"
 ZZZ_KW_korea_war.8.d:0 "Республика Корея движется на север, и по демилитаризованной зоне открывает огонь артиллерия. Мир затаил дыхание."
 ZZZ_KW_korea_war.8.a:0 "Мир наблюдает."
 ZZZ_KW_martial_law_2024:0 "Чрезвычайное военное положение"
 ZZZ_KW_martial_law_2024_desc:0 "Чрезвычайные полномочия приостанавливают нормальную политику, ограничивают гражданские свободы и переводят страну на военный режим — ценой остатков легитимности правительства."
 ZZZ_KW_korea_war.9.t:0 "Военное положение отклонено"
 ZZZ_KW_korea_war.9.d:0 "В первые часы 4 декабря 2024 года Национальное собрание подавляющим большинством голосов отменило указ о военном положении, и войска начали выводиться из Сеула. Через несколько дней началась процедура импичмента — этот короткий путь рухнул на глазах у общества."
 ZZZ_KW_korea_war.9.a:0 "Конституция всё ещё действует."
 ZZZ_KW_korea_war.10.t:0 "Смена правительства"
 ZZZ_KW_korea_war.10.d:0 "3 июня 2025 года досрочные выборы завершились: прогрессивный лагерь получил большинство, и новое правительство вступило в должность на следующий день. На полуострове не было войны — только трудное подведение итогов и восстановление, тогда как дилемма безопасности, оставленная консерваторами, всё ещё разделяет две Кореи."
 ZZZ_KW_korea_war.10.a:0 "Решают бюллетени."
