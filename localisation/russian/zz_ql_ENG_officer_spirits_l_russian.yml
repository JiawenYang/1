l_russian:
 ql_ENG_army_academy_spirit_01:0 "Сандхерст и система подготовки офицеров"
 ql_ENG_army_academy_spirit_01_desc:0 "Королевская военная академия Сандхерст проводит начальный курс подготовки офицеров британской армии и вместе с училищами отдельных родов войск образует целостную систему подготовки офицеров. Отбор узкий, а стандарты намеренно поддерживаются на высоком уровне, чтобы небольшой офицерский корпус мог обеспечивать профессиональную армию."
 ql_ENG_army_spirit_02:0 "Профессиональная компактная армия"
 ql_ENG_army_spirit_02_desc:0 "Британская армия невелика, но полностью профессиональна: она строится вокруг высокой боеготовности, общевойсковой манёвренности и сосредоточенной артиллерии, а не массовых соединений. Её доктрина ценит подготовленных регулярных солдат, быстрое развёртывание и точный огонь выше простой численности."
 ql_ENG_army_command_spirit_03:0 "Система объединённого оперативного командования"
 ql_ENG_army_command_spirit_03_desc:0 "Постоянный объединённый штаб и система штаба обороны планируют и координируют операции трёх видов вооружённых сил. Совместное целеуказание, общий доступ к разведданным и единая оперативная цепочка командования позволяют небольшой силе действовать с весом значительно более крупной группировки."
 ql_ENG_navy_command_spirit_04:0 "Океанские традиции Королевского флота"
 ql_ENG_navy_command_spirit_04_desc:0 "Королевский флот создан для длительных операций вдали от родины: дальних развёртываний, постоянного присутствия в мире и амфибийного проецирования силы при поддержке авианосной группы. Наследие господства на море и экспедиционной войны до сих пор определяет подготовку и применение флота."
 ql_ENG_air_academy_spirit_05:0 "Лётная подготовка Королевских ВВС"
 ql_ENG_air_academy_spirit_05_desc:0 "Лётная подготовка Королевских ВВС управляется централизованно: экипажи проходят путь от начальной подготовки до боевого переучивания по единым стандартам. Приоритет отдаётся стабильно высокому уровню подготовки, а не быстрому расширению."
 ql_ENG_air_spirit_06:0 "Превосходство в воздухе Королевских ВВС"
 ql_ENG_air_spirit_06_desc:0 "Превосходство в воздухе и перехват остаются основой планирования Королевских ВВС. Истребительные крылья должны оспаривать воздушное пространство противника, прикрывать ударные группы и удерживать небо как над островами, так и над развёрнутыми силами."
 ql_ENG_air_command_spirit_07:0 "Экспедиционная авиация Королевских ВВС"
 ql_ENG_air_command_spirit_07_desc:0 "Экспедиционные операции Королевских ВВС сочетают непосредственную поддержку, сопровождение и быстрое развёртывание в удалённых районах. Структура командования рассчитана на переброску небольшого, но полноценного авиационного контингента туда, где этого требуют британские интересы."
