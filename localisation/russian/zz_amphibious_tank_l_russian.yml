l_russian:
 ZZ_amphibious_tank_chassis_pt76: "PT-76"
 ZZ_amphibious_tank_chassis_pt76_desc: "Первый послевоенный советский плавающий танк, состоящий на вооружении морской пехоты и разведывательных подразделений."
 ZZ_amphibious_tank_chassis_type63: "Type-63"
 ZZ_amphibious_tank_chassis_type63_desc: "Китайский плавающий танк, разработанный на базе ПТ-76 и вооружённый 85-мм пушкой, длительное время состоял на вооружении морской пехоты НОАК."
 ZZ_amphibious_tank_chassis_pt76b: "ПТ-76Б"
 ZZ_amphibious_tank_chassis_pt76b_desc: "Усовершенствованный ПТ-76 со стабилизированной пушкой и новым спаренным пулемётом, основной плавающий танк морской пехоты СССР в начале Холодной войны."
 ZZ_amphibious_tank_chassis_pt85: "ПТ-85"
 ZZ_amphibious_tank_chassis_pt85_desc: "Северокорейский плавающий танк на базе ПТ-76 с 85-мм пушкой, состоит на вооружении разведывательных частей КНА."
 ZZ_amphibious_tank_chassis_type63_1: "Type-63-I"
 ZZ_amphibious_tank_chassis_type63_1_desc: "Первая модернизация Типа 63: новый дизель и улучшенный водоходный движитель."
 ZZ_amphibious_tank_chassis_type63_2: "Type-63-II"
 ZZ_amphibious_tank_chassis_type63_2_desc: "Вторая модернизация Типа 63: обновлённая СУО и спаренный пулемёт."
 ZZ_amphibious_tank_chassis_type63a: "Type-63A"
 ZZ_amphibious_tank_chassis_type63a_desc: "Глубокая модернизация Типа 63 со 105-мм нарезной пушкой и новой башней, основной плавающий танк морской пехоты НОАК конца 1990-х."
