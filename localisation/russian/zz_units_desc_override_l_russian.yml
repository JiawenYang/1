l_russian:
 Militia_Bat_desc:0 "§YСостав:§! 600 человек. Вооружение: стрелковое оружие x350, ПТРК x20, ПЗРК x6.\n\nПешая рота ополчения. Ополчение отличается тем, что у него меньше тяжёлого вооружения и средств связи, чем у обычной пехоты. Это делает его очень подвижным и эффективным на трудной местности, но на равнине против бронетанкового противника оно быстро тает.\n\n§GПодсказка дизайнера: ополчение даёт дешёвую оборонительную ширину фронта и подавление. Лучше всего оно действует в городах, лесах и на холмах, но у него слабые оборона и прорыв, и оно особенно уязвимо перед бронетехникой и в бою на открытой или суровой местности.§!"
 Mot_Militia_Bat_desc:0 "§YСостав:§! 600 человек. Вооружение: стрелковое оружие x350, ПТРК x20, ПЗРК x6, вспомогательные машины x25.\n\nРота ополчения на пикапах или даже на бронированных вспомогательных машинах. Ополчение отличается тем, что у него меньше тяжёлого вооружения и средств связи, чем у обычной пехоты. Это делает его очень подвижным и эффективным на трудной местности, но на равнине против бронетанкового противника оно быстро тает.\n\n§GПодсказка дизайнера: моторизованное ополчение меняет часть экономичности на скорость и большее подавление. Применяйте его для подвижной охраны и дешёвого развития успеха на равнинах и в пустынях, но помните: слабые боевые показатели и штрафы на пересечённой местности делают его плохими штурмовыми войсками.§!"
 Mech_Militia_Bat_desc:0 "§YСостав:§! 550 человек. Вооружение: стрелковое оружие x320, ПТРК x18, ПЗРК x6, БТР x20.\n\nРота ополчения на бронетранспортёрах. Ополчение отличается тем, что у него меньше тяжёлого вооружения и средств связи, чем у обычной пехоты. Это делает его очень подвижным и эффективным на трудной местности, но на равнине против бронетанкового противника оно быстро тает.\n\n§GПодсказка дизайнера: механизированное ополчение ещё сильнее меняет экономичность на скорость и большую бронированность. Применяйте его как недорогую более тяжёлую подвижную охрану и для давления на пешую пехоту и артиллерию, но помните: слабые по сравнению с профессиональными механизированными частями боевые показатели не позволяют ему тягаться с хорошо оснащённой армией.§!"
 L_Inf_Bat_desc:0 "§YСостав:§! 1500 человек. Вооружение: стрелковое оружие x820, ПТРК x56, ПЗРК x20, оборудование C&C x36, вспомогательные машины x12.\n\nРота лёгкой пехоты без транспорта. На современном поле боя встречается редко, но существуют части, приспособленные к очень трудной местности вроде джунглей и гор, где они крайне эффективны. Годится и как городской гарнизон.\n\n§GПодсказка дизайнера: лёгкая пехота даёт высокую организацию и хорошие боевые показатели на холмах, в лесах, горах, джунглях, на болотах и в городах, не требуя техники. Применяйте её для удержания или штурма трудной местности, но будьте готовы к медленным стратегическим переброскам и слабым атакам на равнинах и в пустынях.§!"
 Mot_Inf_Bat_desc:0 "§YСостав:§! 1600 человек. Вооружение: стрелковое оружие x880, ПТРК x56, ПЗРК x20, оборудование C&C x36, вспомогательные машины x50.\n\nРота моторизованной пехоты использует в качестве транспорта самые разные вспомогательные машины — от пикапов до современных бронемашин с противоминной защитой. Она обеспечивает быстрое передвижение там, где дороги и открытая местность благоприятствуют технике.\n\n§GПодсказка дизайнера: моторизованная пехота даёт недорогую скорость и хорошие показатели на открытой местности. Применяйте её для развития прорывов и поддержки быстрых участков фронта, но помните: машины увеличивают потребность в снаряжении и теряют эффективность в лесах, горах, джунглях, на болотах и в городах.§!"
 Hvy_Mot_Inf_Bat_desc:0 "§YСостав:§! 1700 человек. Вооружение: стрелковое оружие x930, ПТРК x56, ПЗРК x20, оборудование C&C x36, тяжёлые внедорожники x45, самоходные ПТРК x16.\n\nРота тяжёлой моторизованной пехоты использует в качестве транспорта бронемашины с повышенной противоминной защитой (MRAP). Такие машины намного лучше защищают экипаж от мин, самодельных взрывных устройств и стрелкового огня, что делает их незаменимыми там, где высока угроза засад.\n\n§GПодсказка дизайнера: тяжёлая моторизованная пехота использует более защищённые машины для быстрых действий на передовой в равнинах и пустынях. Она требует больше снаряжения и уступает более лёгкой пехоте в организации и окапывании, по-прежнему получая заметные штрафы на пересечённой местности.§!"
 Mech_Inf_Bat_desc:0 "§YСостав:§! 1750 человек. Вооружение: стрелковое оружие x960, ПТРК x56, самоходные ПТРК x16, ПЗРК x20, оборудование C&C x40, БТР x45, лёгкие танки x2, вспомогательные машины x8.\n\nРота механизированной пехоты использует в качестве транспорта бронетранспортёры. Она хорошо подходит для бронетанкового боя на равнине.\n\n§GПодсказка дизайнера: механизированная пехота сочетает крепкую оборону и бронированную подвижность с хорошими показателями на равнинах и в пустынях. Применяйте её для удержания рубежей в быстрых бронетанковых соединениях, но помните: БТР дороги, а атака и подвижность падают в лесах, горах, джунглях и городах.§!"
 Arm_Inf_Bat_desc:0 "§YСостав:§! 1750 человек. Вооружение: стрелковое оружие x960, ПТРК x56, самоходные ПТРК x16, ПЗРК x20, оборудование C&C x40, БМП x45, вспомогательные машины x8.\n\nРота бронированной пехоты использует в качестве транспорта боевые машины пехоты. Она хорошо подходит для бронетанкового боя на равнине, но пропадает зря на трудной местности, где ей приходится действовать пешком вдали от своих БМП.\n\n§GПодсказка дизайнера: бронированная пехота на БМП превосходит механизированную по огневой мощи, броне и прорыву. Применяйте её вместе с танками на открытой местности, но помните: более низкая организация, дорогое снаряжение и тяжёлые штрафы в горах, джунглях, болотах и городах требуют осторожности.§!"
 L_Air_Inf_Bat_desc:0 "§YСостав:§! 1500 человек. Вооружение: стрелковое оружие x820, ПТРК x56, ПЗРК x20, оборудование C&C x36.\n\nРота лёгкой воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах или переброске вертолётами. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Однако способ переброски жёстко ограничивает количество тяжёлого вооружения, которое они могут взять с собой.\n\n§GПодсказка дизайнера: воздушно-десантная пехота сочетает высокую организацию с возможностью десантирования и хорошими показателями на трудной местности. Применяйте её для захвата и удержания изолированных объектов, но помните: подготовка как у сил специального назначения и повышенный расход пехотного снаряжения делают её дорогой для рутинного линейного боя.§!"
 Mot_Air_Inf_Bat_desc:0 "§YСостав:§! 1700 человек. Вооружение: стрелковое оружие x930, ПТРК x56, ПЗРК x20, оборудование C&C x36, вспомогательные машины x45.\n\nРота моторизованной воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах или переброске вертолётами. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Вспомогательные машины дают им отличную подвижность сразу после высадки и позволяют взять в бой больше тяжёлого вооружения. Однако десантировать их вместе с машинами намного тяжелее в смысле снабжения.\n\n§GПодсказка дизайнера: моторизованная воздушно-десантная пехота добавляет скорость после высадки и хорошо действует на открытой местности. Применяйте её, когда десанту нужно быстро развить успех или усилиться, но помните: машины увеличивают потребность в снаряжении и снижают организацию и показатели на пересечённой местности по сравнению с пешим десантом.§!"
 Mech_Air_Inf_Bat_desc:0 "§YСостав:§! 1600 человек. Вооружение: стрелковое оружие x880, ПТРК x50, ПЗРК x18, оборудование C&C x32, БТР x32, вспомогательные машины x8.\n\nРота механизированной воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Специально созданные лёгкие бронетранспортёры дают им отличную подвижность сразу после высадки и позволяют брать в бой гораздо больше тяжёлого вооружения, чем более лёгким десантным частям. Однако десантировать их вместе с такими машинами намного тяжелее в смысле снабжения.\n\n§GПодсказка дизайнера: механизированная воздушно-десантная пехота приносит на парашютах защиту БТР, скорость и более тяжёлую огневую мощь. Применяйте её, когда отрезанному десанту нужно выжить в подвижном бою после высадки, но помните: более низкая организация, большая потребность в снаряжении и тяжёлые штрафы на пересечённой местности делают её дорогим узкоспециальным выбором.§!"
 Arm_Air_Inf_Bat_desc:0 "§YСостав:§! 1600 человек. Вооружение: стрелковое оружие x880, ПТРК x50, самоходные ПТРК x14, ПЗРК x18, оборудование C&C x32, БМП x32, вспомогательные машины x8.\n\nРота бронированной воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Специально созданные лёгкие боевые машины пехоты дают им отличную подвижность и позволяют на равных драться с обычными механизированными соединениями. Однако десантировать их вместе с БМП крайне тяжело в смысле снабжения: по состоянию на 2017 год такими силами располагала только Россия.\n\n§GПодсказка дизайнера: бронированная воздушно-десантная пехота доставляет по воздуху огневую мощь БМП, броню и прорыв. Применяйте её, чтобы оспаривать защищённые объекты или драться с подвижными резервами противника после высадки, но помните: очень высокая потребность в снаряжении, низкая организация и штрафы на трудной местности делают потери дорогими.§!"
 L_Marine_Bat_desc:0 "§YСостав:§! 1500 человек. Вооружение: стрелковое оружие x820, ПТРК x56, ПЗРК x20, оборудование C&C x36, вспомогательные машины x12.\n\nРота морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Поскольку техники у них нет, количество тяжёлого вооружения, которое они могут взять с собой, жёстко ограничено.\n\n§GПодсказка дизайнера: морская пехота даёт высокую организацию и хорошие показатели при высадке и на болотах, не требуя расходов на технику. Применяйте её для создания плацдармов и боёв в заболоченной местности, но помните: после высадки она медлительна, занимает место в лимите сил специального назначения и менее эффективна на открытой местности.§!"
 Mot_Marine_Bat_desc:0 "§YСостав:§! 1600 человек. Вооружение: стрелковое оружие x880, ПТРК x56, самоходные ПТРК x14, ПЗРК x20, оборудование C&C x36, вспомогательные машины x45.\n\nРота моторизованной морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Высаживаются они как лёгкая пехота, но на суше располагают вспомогательными машинами, что даёт отличную подвижность и позволяет брать в бой много тяжёлого вооружения.\n\n§GПодсказка дизайнера: моторизованная морская пехота сохраняет сильный бонус при высадке и добавляет скорость для быстрого расширения плацдарма. Применяйте её, когда десанту нужно стремительно продвигаться вглубь, но помните: машины требуют больше снаряжения и снижают организацию и показатели в горах по сравнению с пешей морской пехотой.§!"
 Mech_Marine_Bat_desc:0 "§YСостав:§! 1750 человек. Вооружение: стрелковое оружие x960, ПТРК x56, самоходные ПТРК x14, ПЗРК x20, оборудование C&C x40, БТР x42, вспомогательные машины x8.\n\nРота механизированной морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Поскольку они высаживаются под защитой специально созданных плавающих бронетранспортёров, они полностью готовы бить сразу и с большой подвижностью, принося в бой много тяжёлого вооружения.\n\n§GПодсказка дизайнера: механизированная морская пехота сочетает бонус при высадке с защитой БТР и высокой подвижностью после выхода на берег. Применяйте её для расширения и удержания механизированных плацдармов, но помните: организации у неё меньше, чем у более лёгкой морской пехоты, а её машины плохо показывают себя в лесах и горах.§!"
 Arm_Marine_Bat_desc:0 "§YСостав:§! 1600 человек. Вооружение: стрелковое оружие x880, ПТРК x50, самоходные ПТРК x14, ПЗРК x18, оборудование C&C x32, БМП x36, вспомогательные машины x8.\n\nРота бронированной морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Они способны преодолевать большие расстояния по воде на своих тяжелобронированных БМП с водомётным движителем и, выйдя на берег, тут же умело вести бой из тех же машин.\n\n§GПодсказка дизайнера: бронированная морская пехота даёт самую высокую среди морской пехоты огневую мощь БМП, броню и способность к городскому бою, сохраняя при этом бонус к высадке. Применяйте её против хорошо защищённых портов, но помните: низкая организация, высокая стоимость и тяжёлые штрафы в горах и джунглях требуют более лёгких войск для сложной местности в глубине суши.§!"
 L_Air_assault_Bat_desc:0 "§YСостав:§! 1500 человек. Вооружение: стрелковое оружие x820, ПТРК x56, ПЗРК x20, оборудование C&C x32, транспортные вертолёты x24.\n\nРота десантно-штурмовой пехоты — элитные бойцы, обученные спуску по канату и переброске по воздуху; их снаряжение порой специально создаётся или дорабатывается в войсках, чтобы лучше помещаться в летательные аппараты. Их часто используют, чтобы захватить и удержать ключевые участки местности, ещё не взятые под полный контроль, и чтобы напрямую драться с противником в его тылу.\n\n§GПодсказка дизайнера: десантно-штурмовая пехота использует транспортные вертолёты для стремительных действий и получает боевые бонусы почти на всей трудной местности. Применяйте её для захвата удалённых холмов, лесов, гор, джунглей, болот и городов, но помните: низкая прочность, слабое окапывание и дорогие вертолёты делают затяжной линейный бой рискованным.§!"
 air_assault_arty_Bat_desc:0 "§YСостав:§! 880 человек. Вооружение: артиллерия x18, транспортные вертолёты x18, оборудование C&C x12, стрелковое оружие x200.\n\nПолноценная батарея буксируемых орудий, перевозимых вертолётами на внешней подвеске. Обеспечивает непрерывную огневую поддержку аэромобильных операций и не отстаёт от десантно-штурмовой пехоты благодаря быстрой переброске по воздуху.\n\n§GПодсказка дизайнера: аэромобильная артиллерия заметно повышает атаку по пехоте вертолётных соединений и хорошо действует на холмах, в горах, лесах, джунглях и городах. Применяйте её для поддержки десантно-штурмовых войск на сложной местности, но она занимает ширину фронта, имеет низкие организацию и прочность и требует дорогих транспортных вертолётов.§!"
 attack_helo_bat_desc:0 "§YСостав:§! 620 человек. Вооружение: ударные вертолёты x18, оборудование C&C x16.\n\nЭскадрильи ударных вертолётов собирают винтокрылые боевые машины в кулак для быстрых противотанковых ударов и непосредственной поддержки на широком фронте.\n\n§GПодсказка дизайнера: ударные вертолёты дают быструю бронированную огневую мощь и сильные атаки на равнинах и в пустынях. Применяйте их для развития прорывов или охоты за бронетехникой на открытой местности, но помните: крайне низкая организация и прочность, дорогие машины и слабые показатели в городах, горах, лесах и джунглях делают затяжной бой опасным.§!"
 armor_Bat_desc:0 "§YСостав:§! 1400 человек. Вооружение: основные боевые танки x44, оборудование C&C x28, стрелковое оружие x350, ПТРК x20, ПЗРК x10, вспомогательные машины x20.\n\nРота танков состоит исключительно из самых защищённых машин, какие только существуют, — основных боевых танков. Обладая прекрасной подвижностью на равнине и мощным огнём прямой наводкой, они предназначены пробивать бреши в передовых рубежах противника, которые затем быстро развивает идущая следом механизированная пехота.\n\n§GПодсказка дизайнера: танки дают высокую броню, прорыв и огневую мощь против бронетехники, а также отличные бонусы на равнинах и в пустынях. Применяйте их как остриё наступательных дивизий, но помните: они расходуют дорогие танки и командное снаряжение, имеют низкую организацию и получают серьёзные штрафы в лесах, горах, джунглях, на болотах и в городах.§!"
 L_arm_Bat_desc:0 "§YСостав:§! 1100 человек. Вооружение: лёгкие танки x28, оборудование C&C x28, стрелковое оружие x300, ПТРК x10, вспомогательные машины x10.\n\nРота лёгких танков действует на особых, часто колёсных, лёгких танках, которые сочетают невероятную подвижность с внушительной огневой мощью. Она способна на равных драться с любой пехотой в прямом бою, хотя прямой бой — не её задача: она скрытно подбирается к противнику, наблюдает за ним и докладывает о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Она также совершает налёты и засады на важные объекты и механизированные соединения противника.\n\n§GПодсказка дизайнера: лёгкие танки дают быструю бронированную огневую мощь и сильные атаки на равнинах и в пустынях. Применяйте их для разведки боем и развития успеха, но помните: защита и мощь в прямом бою у них скромнее, а на пересечённой местности эффективность резко падает.§!"
 A_L_arm_Bat_desc:0 "§YСостав:§! 1000 человек. Вооружение: лёгкие танки x18, оборудование C&C x24, стрелковое оружие x250, вспомогательные машины x8.\n\nРота лёгких танков действует на особых, часто колёсных, лёгких танках, которые сочетают невероятную подвижность с внушительной огневой мощью. Она способна на равных драться с любой пехотой в прямом бою, хотя прямой бой — не её задача: она скрытно подбирается к противнику, наблюдает за ним и докладывает о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Она также совершает налёты и засады на важные объекты и механизированные соединения противника. Эти подразделения способны участвовать в воздушно-десантных операциях вместе с парашютистами, немедленно обеспечивая им бронированную поддержку.\n\n§GПодсказка дизайнера: десантируемые лёгкие танки дают парашютным соединениям подвижную броню и противотанковую огневую мощь сразу после высадки. Применяйте их для поддержки десанта против мобильного противника на открытой местности, но помните: специализированные машины дороги и получают серьёзные штрафы в горах, джунглях, болотах и городах.§!"
 Arty_Bat_desc:0 "§YСостав:§! 1500 человек. Вооружение: артиллерия x18, оборудование C&C x24, вспомогательные машины x36, стрелковое оружие x300.\n\nБлагодаря мощному огню с закрытых позиций артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам. Поскольку для передвижения ей нужны тягачи, между ударами её бывает трудно перемещать, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы малого калибра можно перекатывать вручную, и они пригодны для воздушно-десантных операций, так как помещаются в транспортные самолёты.\n\n§GПодсказка дизайнера: артиллерийская батарея заметно повышает атаку по пехоте и может десантироваться на парашютах, что делает её эффективной против войск с большой долей пехоты. Применяйте её, чтобы дать пешим соединениям наступательную огневую мощь, но помните: низкая организация и прочность, занимаемая ширина фронта и штрафы к подвижности на пересечённой местности требуют достаточного пехотного прикрытия.§!"
 SP_Arty_Bat_desc:0 "§YСостав:§! 1400 человек. Вооружение: самоходная артиллерия x18, оборудование C&C x24, вспомогательные машины x24, стрелковое оружие x250.\n\nБлагодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, и далеко за пределами прямой видимости. Расчёт может перезаряжать орудие самостоятельно, а самоходное шасси позволяет быстро менять позицию, уходя от контрбатарейного огня противника.\n\n§GПодсказка дизайнера: батарея самоходной артиллерии даёт высокую атаку по пехоте, не отставая от бронетанковых соединений, и лучше всего действует на равнинах. Применяйте её для прорыва позиций с большой долей пехоты, но из-за низкой организации, занимаемой ширины фронта, дорогого шасси и штрафов на пересечённой местности ей нужны бронированное прикрытие и открытая местность.§!"
 SP_R_arty_Bat_desc:0 "§YСостав:§! 1250 человек. Вооружение: РСЗО x18, оборудование C&C x24, вспомогательные машины x24, стрелковое оружие x250.\n\nБатарея реактивной артиллерии с РСЗО способна уничтожить целый район с большого расстояния. Её применяют по тылам противника: огонь по площадям делает её непригодной для точечных ударов на поле боя. Ей нужны специальные транспортно-заряжающие машины, а перезарядка занимает много времени.\n\n§GПодсказка дизайнера: батарея РСЗО даёт очень высокую атаку по пехоте и прорыв и не отстаёт от подвижных соединений на открытой местности. Применяйте её для сосредоточенного наступательного огня, но у неё низкая организация, она занимает ширину фронта, требует дорогих ракетных машин и плохо действует в горах, джунглях, болотах и городах.§!"
 SP_AA_Bat_desc:0 "§YСостав:§! 1100 человек. Вооружение: ЗСУ x18, оборудование C&C x24, вспомогательные машины x24, стрелковое оружие x200.\n\nИспользуя самоходные зенитные ракетные комплексы малой и средней дальности, зенитная батарея прикрывает своё подразделение от ударов авиации непосредственной поддержки противника.\n\n§GПодсказка дизайнера: самоходная ПВО даёт высокую атаку по авиации и подвижное прикрытие бронетанковым соединениям. Применяйте её, когда авиация противника угрожает ценным ударным группировкам, но помните: она занимает ширину фронта, требует специальных машин, почти не добавляет наземной огневой мощи и плохо движется в горах, джунглях и на болотах.§!"
 L_Ranger_Bat_desc:0 "§YСостав:§! 1400 человек. Вооружение: стрелковое оружие x770, ПТРК x50, ПЗРК x16, оборудование C&C x32, вспомогательные машины x32, вспомогательные машины x15.\n\nРейнджеры — элитная лёгкая пехота, приспособленная для налётов, прямых действий и стремительной переброски впереди основных сил. Они идут налегке ради подвижности и внезапности, захватывают ключевые объекты и удерживают их до подхода обычных частей. Плата за это — скудное тяжёлое вооружение, из-за чего они уязвимы перед бронетехникой на открытой местности.\n\n§GПодсказка дизайнера: рейнджеры сочетают высокую организацию и исключительные бонусы на трудной местности при малой ширине фронта. Применяйте их как элитные горные, лесные, джунглевые, болотные или городские соединения, но помните: долгая подготовка, лимит сил специального назначения и нехватка тяжёлого вооружения делают массовое применение дорогим и оставляют их беззащитными на равнине.§!"
 L_Marine_Cdo_Bat_desc:0 "§YСостав:§! 1500 человек. Вооружение: стрелковое оружие x820, ПТРК x50, ПЗРК x16, оборудование C&C x32, вспомогательные машины x32, вспомогательные машины x12.\n\nРота морских коммандос — более крупные формирования морских рейдеров, обученные налётам с немедленным отходом и прочим задачам лёгкой пехоты.\n\n§GПодсказка дизайнера: морские коммандос сочетают высокую организацию с отличными атаками при высадке, на болотах, в лесах и городах. Применяйте их для элитных рейдов и высадок на обороняемое побережье, но помните: лимит сил специального назначения, долгая подготовка, лёгкое вооружение и слабые атаки на открытой местности не дают применять их массово.§!"
 Special_Forces_desc:0 "§YСостав:§! 1250 человек. Вооружение: стрелковое оружие x1000, ПТРК x24, ПЗРК x12, оборудование C&C x40, вспомогательные машины x24.\n\nСилы специальных операций — элита любой армии, где они есть: их подготовка дольше и тяжелее, чем у кого бы то ни было. Они мастера трудной местности, воздушно-десантных операций и морских десантов. Однако вооружены они очень легко, поскольку им приходится подвижно действовать в тылу противника.\n\n§GПодсказка дизайнера: силы специальных операций дают исключительные организацию и восстановление, широкие бонусы по местности, возможность десантирования и эвакуации с побережья. Применяйте их для самых тяжёлых рейдов и спорных объектов, но помните: большая ширина фронта, очень долгая подготовка, лимит сил специального назначения и лёгкое вооружение делают их непригодными в роли обычной линейной пехоты.§!"
 combat_service_support_company_desc:0 "§YСостав:§! 350 человек. Вооружение: оборудование C&C x60, вспомогательные машины x30, стрелковое оружие x300.\n\nТыловой и медицинский состав дивизии организует подвоз снабжения, эвакуацию раненых и поступление пополнений.\n\n§GПодсказка дизайнера: тыловое обеспечение снижает расход снабжения и топлива, сберегая живую силу и боевой опыт части за счёт возвращения раненых в строй. Применяйте его в крупных, опытных или прожорливых по снабжению дивизиях, но помните: оно занимает ширину фронта, требует снаряжения и резко снижает прямые боевые показатели.§!"
 helicopter_combat_service_support_desc:0 "§YСостав:§! 250 человек. Вооружение: транспортные вертолёты x20, оборудование C&C x40.\n\nПеребрасываемые вертолётами тыловые и медицинские группы обеспечивают быстро развёрнутые войска и эвакуируют раненых с передовых позиций.\n\n§GПодсказка дизайнера: вертолётное тыловое обеспечение возвращает в строй больше раненых и сильнее экономит снабжение и топливо, требуя меньше живой силы, чем наземное. Применяйте его в дорогих аэромобильных или быстрых соединениях, но помните: транспортные вертолёты дороги, оно занимает ширину фронта, а вклад в бой минимален.§!"
 combat_maintenance_company_desc:0 "§YСостав:§! 250 человек. Вооружение: оборудование C&C x40, вспомогательные машины x20, стрелковое оружие x200.\n\nРемонтная рота удерживает в строю технику и тяжёлое вооружение соединения: она ведёт полевой ремонт и эвакуирует повреждённые машины до того, как те будут потеряны окончательно. Восстанавливая выбывшую из боя технику вблизи фронта, она поддерживает бронетанковую мощь в затяжных операциях и снижает потери от износа.\n\n§GПодсказка дизайнера: ремонтная рота повышает надёжность, восстановление и захват снаряжения у дивизий с большим количеством техники. Применяйте её, чтобы сдержать потери от износа и сберечь дорогое снаряжение в долгих операциях, но помните: она занимает ширину фронта, требует живой силы и вспомогательных машин и почти не даёт прямой огневой мощи.§!"
 airmobile_maintenance_company_desc:0 "§YСостав:§! 250 человек. Вооружение: транспортные вертолёты x20, оборудование C&C x40, стрелковое оружие x200.\n\nРемонтное подразделение, приспособленное для обслуживания аэромобильных и вертолётных сил: оно располагает более лёгким и транспортабельным оборудованием, необходимым для поддержания в строю винтокрылых машин и быстро перебрасываемых частей. Оно восстанавливает повреждённую технику в передовых районах, позволяя вести десантно-штурмовые операции вдали от постоянных баз.\n\n§GПодсказка дизайнера: аэромобильное ремонтное подразделение повышает захват снаряжения и надёжность, поспевая за вертолётными соединениями. Применяйте его для сбережения дорогой винтокрылой техники, но помните: восстановление у него ниже, чем у наземного ремонтного подразделения, оно занимает ширину фронта и требует множества транспортных вертолётов.§!"
 L_Engi_Comp_desc:0 "§YСостав:§! 200 человек. Вооружение: стрелковое оружие x120, оборудование C&C x12, вспомогательные машины x12.\n\nСапёры наводят временные мосты и возводят оборонительные рубежи, ставят и снимают мины, а также обезвреживают боеприпасы. Для самообороны они несут обычное пехотное оружие.\n\n§GПодсказка дизайнера: сапёрные роты улучшают окапывание, помогают пехоте атаковать и обороняться в укреплениях, городах, лесах и на болотах, а также повышают защиту и подвижность в горах. Применяйте их в оборонительных дивизиях или на пересечённой местности, но помните: они занимают ширину фронта, требуют живой силы и снаряжения и почти не дают прямой огневой мощи.§!"
 H_Engi_Comp_desc:0 "§YСостав:§! 300 человек. Вооружение: стрелковое оружие x200, оборудование C&C x20, вспомогательные машины x20, основные боевые танки x4.\n\nСапёры наводят временные мосты и возводят оборонительные рубежи, ставят и снимают мины, а также обезвреживают боеприпасы. Для самообороны они несут обычное пехотное оружие. Располагая специальными инженерными и эвакуационными машинами, они хорошо приспособлены для вывода с передовой выбывшей из боя техники.\n\n§GПодсказка дизайнера: тяжёлые сапёрные роты дают большее окапывание и более сильные бонусы в укреплениях, городах, горах и на болотах, чем обычные сапёры. Применяйте их в ценных штурмовых или оборонительных соединениях, но помните: высокие требования к живой силе и снаряжению делают их дорогим выбором.§!"
 communications_company_desc:0 "§YСостав:§! 150 человек. Вооружение: оборудование C&C x100, стрелковое оружие x100, вспомогательные машины x10.\n\nРота связи содержит радио-, информационные и командные сети, связывающие соединение воедино, и обеспечивает надёжное прохождение приказов и донесений по всему полю боя. Устойчивая связь улучшает взаимодействие и сокращает время реакции, а также защищает соединение от помех и радиоэлектронного подавления.\n\n§GПодсказка дизайнера: рота связи повышает организацию, восстановление и инициативу передовых батальонов. Применяйте её в крупных или ценных боевых дивизиях, которым выгодна слаженность, но помните: она занимает ширину фронта и требует немалых расходов на аппаратуру управления и связи, почти не давая прямой огневой мощи.§!"
 military_police_attachment_desc:0 "§YСостав:§! 250 человек. Вооружение: оборудование C&C x100, стрелковое оружие x200.\n\nВоенная полиция регулирует движение, обеспечивает безопасность тыла и работает с пленными, освобождая линейные части для боя. Поддерживая порядок на путях снабжения и прикрывая тыл от просочившихся групп и отставших, она сохраняет дисциплину и позволяет соединению двигаться без задержек.\n\n§GПодсказка дизайнера: военная полиция умножает подавление, даваемое пехотой, и добавляет своё, не занимая ширины фронта. Применяйте её в шаблонах для оккупации и охраны тыла, но помните: затраты живой силы и снаряжения почти ничего не дают боевым дивизиям на передовой.§!"
 pathfinder_company_desc:0 "§YСостав:§! 80 человек. Вооружение: оборудование C&C x50, стрелковое оружие x100.\n\nЭлитные группы парашютистов, обученные прыгать заранее, до начала воздушно-десантной операции, чтобы отыскать самые безопасные площадки приземления и районы сбора. Эти бойцы обеспечивают важнейшее управление на ключевых этапах любой воздушно-десантной или аэромобильной операции.\n\n§GПодсказка дизайнера: передовые авианаводчики повышают организацию и атаку по пехоте у воздушно-десантной пехоты и могут десантироваться на парашютах. Применяйте их для усиления воздушно-десантных и десантно-штурмовых дивизий, но помните: они занимают ширину фронта, доступны только таким соединениям и почти не дают прямой боевой мощи.§!"
 L_Ranger_Recce_Comp_desc:0 "§YСостав:§! 120 человек. Вооружение: стрелковое оружие x80, ПТРК x8, ПЗРК x4, оборудование C&C x8.\n\nРазведывательное подразделение из состава рейнджеров, обученное пешком проникать глубоко в тыл противника и докладывать о его перемещениях. Сочетая скрытность с беспилотной разведкой и радиоэлектронным наблюдением, оно собирает сведения и наводит на цели свой огонь, а при случае проводит ограниченные налёты и засады.\n\n§GПодсказка дизайнера: разведка рейнджеров добавляет разведку и инициативу, повышает атаку артиллерии по пехоте и хорошо дерётся на трудной местности. Применяйте её в соединениях специального назначения, которым нужна элитная разведка, но помните: она занимает ширину фронта, расходует лимит сил специального назначения и даёт мало прямой огневой мощи.§!"
 Drone_Recce_Comp_desc:0 "§YСостав:§! 80 человек. Вооружение: стрелковое оружие x50, вспомогательные машины x5, оборудование C&C x25, наземные дроны x25.\n\nПрименяя малые беспилотники для наблюдения за пределами прямой видимости, взвод беспилотной разведки улучшает понимание обстановки, не подставляя разведчиков под огонь. Эти аппараты быстро просматривают маршруты, вскрывают позиции противника и подтверждают цели на сложной местности, ускоряя принятие решений и повышая точность огня.\n\n§GПодсказка дизайнера: беспилотная разведка даёт высокую разведку и инициативу, усиливает другие разведывательные подразделения и повышает эффективность артиллерийского огня. Применяйте её в подвижных или бронетанковых дивизиях, которые могут позволить себе беспилотники, но помните: она занимает ширину фронта, увеличивает расход снабжения, снижает окапывание и плохо работает в городах и горах.§!"
 Sniper_company_desc:0 "§YСостав:§! 80 человек. Вооружение: стрелковое оружие x50, оборудование C&C x25.\n\nУкомплектованный меткими стрелками, работающими в парах с корректировщиками, снайперский взвод ведёт избирательный огонь на большой дальности по особо важным целям — офицерам, расчётам и связистам. Он превосходно изматывает и дезорганизует части противника из укрытий, снижая их боеспособность и при этом оставаясь труднообнаружимым.\n\n§GПодсказка дизайнера: снайперский взвод добавляет атаку по пехоте и разведку, повышает инициативу разведывательных подразделений и огневую мощь артиллерии. Применяйте его против пехоты и для лучшей слаженности на поле боя, но помните: он занимает ширину фронта и имеет очень слабые прорыв, атаку по бронетехнике и бронепробиваемость.§!"
 Light_Mech_Inf_Bat_desc:0 "§YСостав:§! 300 человек. Вооружение: БТР x30.\n\nСокращённое механизированное подразделение использует небольшое количество бронетранспортёров для усиления соединения, не занимая обычной ширины фронта.\n\n§GПодсказка дизайнера: сокращённая механизированная пехота добавляет защиту БТР и оборону, не занимая ширины фронта. Применяйте её для усиления подходящих соединений на равнинах, холмах и в городах, но помните: стоимость машин, низкая прочность и тяжёлые штрафы в горах, джунглях, на болотах, реках и при высадке ограничивают её самостоятельную боевую ценность.§!"
 Light_Arm_Inf_Bat_desc:0 "§YСостав:§! 320 человек. Вооружение: БМП x30.\n\nСокращённое подразделение бронированной пехоты использует небольшое количество боевых машин пехоты, добавляя защищённую огневую мощь и не занимая обычной ширины фронта.\n\n§GПодсказка дизайнера: сокращённая бронированная пехота добавляет броню и огневую мощь БМП, не занимая ширины фронта, и лучше всего действует на равнинах и в пустынях. Применяйте её для усиления ценных соединений, но помните: низкая организация, дорогие машины и крайне тяжёлые штрафы на пересечённой местности, реках и при высадке делают её узкоспециальной.§!"
 Light_L_Air_assault_Bat_desc:0 "§YСостав:§! 250 человек. Вооружение: транспортные вертолёты x30.\n\nДесантно-штурмовая пехота — элитные бойцы, обученные спуску по канату и переброске по воздуху; их снаряжение порой специально создаётся или дорабатывается в войсках, чтобы лучше помещаться в летательные аппараты. Их часто используют, чтобы захватить и удержать ключевые участки местности, ещё не взятые под полный контроль, и чтобы напрямую драться с противником в его тылу.\n\n§GПодсказка дизайнера: это сокращённое десантно-штурмовое подразделение добавляет организацию и мощные бонусы в городах, горах, лесах, джунглях и на болотах, не занимая ширины фронта. Применяйте его для усиления специализированных соединений на трудной местности, но помните: потребность в вертолётах обходится дорого, а на равнинах, в пустынях и при высадке подразделение слабо.§!"
 Light_attack_helo_bat_desc:0 "§YСостав:§! 95 человек. Вооружение: ударные вертолёты x9.\n\nНебольшое подразделение ударных вертолётов обеспечивает быструю поддержку боевыми вертолётами без разворачивания целого полка.\n\n§GПодсказка дизайнера: сокращённые ударные вертолёты добавляют быструю бронированную огневую мощь, не занимая ширины фронта, и превосходно действуют на равнинах и в пустынях. Применяйте их как компактную подвижную поддержку, но помните: крайне низкая организация и прочность, дорогие машины и тяжёлые штрафы в горах, джунглях, на болотах и в городах делают потери труднопереносимыми.§!"
 Light_armor_Bat_desc:0 "§YСостав:§! 95 человек. Вооружение: основные боевые танки x21.\n\nСокращённое танковое подразделение собирает ограниченное число основных боевых танков для усиления соединения, не занимая обычной ширины фронта.\n\n§GПодсказка дизайнера: сокращённые танки добавляют броню, прорыв и сильные атаки на равнинах и в пустынях, не занимая ширины фронта. Применяйте их для экономного усиления наступательных соединений, но помните: низкая организация и прочность, стоимость танков и крайне тяжёлые штрафы на пересечённой местности и в городах делают их плохой универсальной поддержкой.§!"
 Light_L_arm_Bat_desc:0 "§YСостав:§! 95 человек. Вооружение: лёгкие танки x21.\n\nСокращённое подразделение лёгких танков даёт подвижную противотанковую огневую мощь и возможность разведки боем при меньшем количестве машин.\n\n§GПодсказка дизайнера: сокращённые лёгкие танки добавляют подвижную противотанковую огневую мощь, не занимая ширины фронта, и превосходно действуют на равнинах и в пустынях. Применяйте их для усиления быстрых соединений против техники, но помните: низкая прочность, специальное шасси и тяжёлые штрафы на пересечённой местности, реках и при высадке ограничивают их гибкость.§!"
 Light_SP_Arty_Bat_desc:0 "§YСостав:§! 95 человек. Вооружение: самоходная артиллерия x9.\n\nСокращённое подразделение самоходной артиллерии ведёт подвижный огонь с закрытых позиций, используя меньше машин, чем полноценный батальон.\n\n§GПодсказка дизайнера: неполная самоходная артиллерия даёт подвижную атаку по пехоте, не занимая ширину фронта, и особенно хорошо действует на равнинах, в пустынях и городах. Применяйте её как компактную наступательную поддержку, но у неё почти нет организации, низкая прочность, дорогое специальное шасси, и она слабее в лесах, горах и джунглях.§!"
 Light_SP_R_arty_Bat_desc:0 "§YСостав:§! 95 человек. Вооружение: РСЗО x9.\n\nСокращённое подразделение РСЗО ведёт сосредоточенный огонь по площадям, используя меньше машин, чем полноценный батальон.\n\n§GПодсказка дизайнера: неполная реактивная артиллерия даёт мощную подвижную атаку по пехоте, не занимая ширину фронта, и лучше всего действует на равнинах, в пустынях и городах. Применяйте её для усиления наступающих соединений, но из-за ничтожной организации, низкой прочности, стоимости ракетных машин и штрафов на пересечённой местности ей нужно прикрытие.§!"
 Light_SP_AA_Bat_desc:0 "§YСостав:§! 60 человек. Вооружение: ЗСУ x9.\n\nСокращённое подразделение самоходной ПВО прикрывает соединение небольшим количеством подвижных зенитных комплексов.\n\n§GПодсказка дизайнера: сокращённая самоходная ПВО добавляет атаку по авиации, не занимая ширины фронта и почти не требуя живой силы. Применяйте её для компактного прикрытия подвижных соединений под вражеской авиацией, но помните: организации у неё почти нет, прочность низкая, а специальные зенитные машины почти не добавляют наземной огневой мощи.§!"
 Arty_Battery_desc:0 "§YСостав:§! 200 человек. Вооружение: стрелковое оружие x40, артиллерия x6, оборудование C&C x6.\n\nБлагодаря мощному огню с закрытых позиций артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам. Поскольку для передвижения ей нужны тягачи, между ударами её бывает трудно перемещать, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы малого калибра можно перекатывать вручную, и они пригодны для воздушно-десантных операций, так как помещаются в транспортные самолёты.\n\n§GПодсказка дизайнера: артиллерийский взвод добавляет атаку по пехоте, не занимая ширины фронта, и обходится гораздо дешевле полноценной батареи. Применяйте его как экономную огневую поддержку подходящих пеших соединений, но помните: крайне низкая организация и штрафы на пересечённой местности ограничивают его пользу в дивизиях без прикрытия или в высокоподвижных.§!"
 SP_R_arty_battery_desc:0 "§YСостав:§! 200 человек. Вооружение: стрелковое оружие x40, РСЗО x6, оборудование C&C x6, вспомогательные машины x6.\n\nВзвод реактивной артиллерии с РСЗО способен уничтожать целые районы с большого расстояния. Его применяют по тылам противника: огонь по площадям делает его непригодным для точечных ударов на поле боя. Ему нужны специальные транспортно-заряжающие машины, а перезарядка занимает много времени.\n\n§GПодсказка дизайнера: взвод РСЗО даёт сильную подвижную атаку по пехоте и немного прорыва, не занимая ширину фронта. Применяйте его как компактную наступательную поддержку в подвижных или бронетанковых дивизиях, но ракетные машины дороги, быстро выдыхаются и теряют подвижность в горах и болотах.§!"
 SP_arty_battery_desc:0 "§YСостав:§! 250 человек. Вооружение: стрелковое оружие x40, самоходная артиллерия x6, оборудование C&C x6, вспомогательные машины x6.\n\nБлагодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, и далеко за пределами прямой видимости. Расчёт может перезаряжать орудие самостоятельно, а самоходное шасси позволяет быстро менять позицию, уходя от контрбатарейного огня противника.\n\n§GПодсказка дизайнера: самоходный артиллерийский взвод даёт подвижную атаку по пехоте, не занимая ширину фронта. Применяйте его как компактную огневую поддержку для подвижных, бронетанковых, морских или ополченческих соединений, но специальное шасси дороже буксируемых орудий и плохо проходит горы, джунгли и болота.§!"
 SP_AA_Battery_desc:0 "§YСостав:§! 200 человек. Вооружение: стрелковое оружие x40, ЗСУ x6, оборудование C&C x6, вспомогательные машины x6.\n\nИспользуя самоходные зенитные ракетные комплексы малой и средней дальности, зенитный взвод прикрывает своё подразделение от ударов авиации непосредственной поддержки противника.\n\n§GПодсказка дизайнера: взвод самоходной ПВО добавляет подвижную атаку по авиации, не занимая ширины фронта. Применяйте его для прикрытия подвижных, бронетанковых или морских дивизий под вражеским небом, но помните: его специальное шасси почти бесполезно против наземных сил и хуже движется в горах и на болотах.§!"
 air_assault_arty_battery_desc:0 "§YСостав:§! 150 человек. Вооружение: стрелковое оружие x40, артиллерия x6, транспортные вертолёты x6, оборудование C&C x6.\n\nЭти подразделения с буксируемыми орудиями повышают свою подвижность, перевозя орудия на внешней подвеске вертолётов, и успевают за быстрой аэромобильной пехотой.\n\n§GПодсказка дизайнера: аэромобильный артиллерийский взвод даёт атаку по пехоте, не занимая ширину фронта, и лучше всего действует на холмах, в горах, лесах, джунглях и городах. Применяйте его как компактную огневую поддержку аэромобильных или морских соединений, но вертолёты и артиллерия обходятся дорого, а на равнинах и в пустынях он слабее.§!"
 armor_Comp_desc:0 "§YСостав:§! 140 человек. Вооружение: основные боевые танки x14, оборудование C&C x8.\n\nТанковый взвод состоит исключительно из самых защищённых машин, какие только существуют, — основных боевых танков. Обладая прекрасной подвижностью на равнине и мощным огнём прямой наводкой, они предназначены пробивать бреши в передовых рубежах противника, которые затем быстро развивает идущая следом механизированная пехота.\n\n§GПодсказка дизайнера: танковый взвод добавляет броню, прорыв и подвижную огневую мощь, не занимая ширины фронта. Применяйте его, чтобы усилить подходящие пехотные или подвижные соединения для боя на открытой местности, но помните: танки и командное снаряжение дороги, а в горах, джунглях и на болотах взвод замедляется и плохо атакует.§!"
 attack_helo_comp_desc:0 "§YСостав:§! 100 человек. Вооружение: ударные вертолёты x4, оборудование C&C x4.\n\nЗвено ударных вертолётов обеспечивает передовым соединениям быструю поддержку боевыми вертолётами и подвижную противотанковую огневую мощь.\n\n§GПодсказка дизайнера: звено ударных вертолётов добавляет быструю бронированную огневую мощь, не занимая ширины фронта. Применяйте его как гибкую поддержку пехотных, подвижных, бронетанковых или морских дивизий, но помните: машины и командное снаряжение дороги, а в городах и джунглях звено атакует хуже.§!"
 drone_tactical_company_desc:0 "§YСостав:§! 80 человек. Вооружение: стрелковое оружие x40, оборудование C&C x16, вспомогательные машины x8, наземные дроны x120.\n\nИспользуя FPV-беспилотники самолётного типа и квадрокоптеры, эти подразделения ведут разведку и наносят точечные удары в интересах линейных частей.\n\n§GПодсказка дизайнера: рота FPV-беспилотников добавляет эффективную атаку по пехоте и по бронетехнике, не занимая ширины фронта, и может десантироваться на парашютах. Применяйте её как гибкую огневую поддержку в дивизиях, способных снабжать наземные беспилотники, но помните: организации у неё почти нет, а на скромную живучесть уходит немало дронов.§!"
 Militia_Recce_Comp_desc:0 "§YСостав:§! 80 человек. Вооружение: стрелковое оружие x40, оборудование C&C x4, вспомогательные машины x4.\n\nРазведывательные роты ополчения используют вспомогательные машины и скромные средства связи, чтобы вести разведку впереди ополченческих соединений. Они дёшево вскрывают позиции противника, особенно в застроенной местности.\n\n§GПодсказка дизайнера: разведка ополчения добавляет разведку и инициативу, не занимая ширины фронта, и особенно хороша в городах и мегаполисах. Применяйте её, чтобы дёшево улучшить тактику ополчения, но помните: она доступна только ополчению и почти не даёт прямой боевой мощи.§!"
 L_Recce_Comp_desc:0 "§YСостав:§! 150 человек. Вооружение: стрелковое оружие x100, ПТРК x10, ПЗРК x5, оборудование C&C x10.\n\nПехотные разведывательные роты действуют пешком и потому лишены значительной части тяжёлого вооружения, которое сделало бы их полноценной боевой единицей. Они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они способны и на ограниченные налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: пехотная разведка добавляет разведку и инициативу, не занимая ширины фронта, и сохраняет небольшие бонусы в лесах, горах, джунглях и на холмах. Применяйте её в пеших, воздушно-десантных, аэромобильных, морских дивизиях и в соединениях специального назначения, но помните: живой силы она требует больше других разведподразделений, а огневой мощи почти не даёт.§!"
 Mot_Recce_Comp_desc:0 "§YСостав:§! 120 человек. Вооружение: стрелковое оружие x80, ПТРК x8, ПЗРК x8, оборудование C&C x8, вспомогательные машины x8.\n\nМоторизованные разведывательные роты действуют на вспомогательных машинах и располагают почти тем же снаряжением, что и пехотные. Но задачи у них иные: они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они способны и на ограниченные налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: моторизованная разведка даёт больше разведки и инициативы, чем пешие разведчики, поспевает за подвижными соединениями и улучшает подвижность на открытой местности. Применяйте её в моторизованных или морских дивизиях, но помните: вспомогательные машины повышают стоимость, а в горах, джунглях и на болотах она замедляется.§!"
 Mech_Recce_Comp_desc:0 "§YСостав:§! 100 человек. Вооружение: стрелковое оружие x60, ПТРК x6, самоходные ПТРК x6, ПЗРК x6, БТР x6, оборудование C&C x6.\n\nМеханизированные разведывательные роты действуют на бронетранспортёрах и располагают почти тем же снаряжением, что и пехотные. Но задачи у них иные: они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они способны и на ограниченные налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: механизированная разведка даёт высокую разведку и инициативу, не занимая ширины фронта, поспевает за соединениями на БТР и улучшает подвижность на равнинах. Применяйте её в бронетанковых или морских дивизиях, но помните: БТР и вспомогательное снаряжение обходятся дорого, а в горах и на болотах она замедляется.§!"
 Arm_Recce_Comp_desc:0 "§YСостав:§! 80 человек. Вооружение: стрелковое оружие x40, ПТРК x4, самоходные ПТРК x4, ПЗРК x4, БМП x4, оборудование C&C x4.\n\nРоты тяжёлой механизированной разведки действуют на боевых машинах пехоты и располагают почти тем же снаряжением, что и бронированная пехота. Но задачи у них иные: они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они также совершают налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: тяжёлая механизированная разведка даёт высокую разведку и инициативу под защитой БМП и не занимает ширины фронта. Применяйте её в бронетанковых или морских дивизиях, действующих на равнинах и в пустынях, но помните: БМП дороги, а подвижность падает в лесах, горах, джунглях и на болотах.§!"
 armor_Recce_Comp_desc:0 "§YСостав:§! 120 человек. Вооружение: лёгкие танки x8, оборудование C&C x8.\n\nБронированный разведывательный взвод действует на особых разведывательных лёгких танках, которые сочетают невероятную подвижность с внушительной огневой мощью. Он способен на равных драться с любой пехотой в прямом бою, хотя прямой бой — не его задача: он скрытно подбирается к противнику, наблюдает за ним и докладывает о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Он также совершает налёты и засады на важные объекты и механизированные соединения противника. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: бронированная разведка даёт самые высокие среди обычных разведчиков разведку и инициативу, добавляя противотанковую подвижность и не занимая ширины фронта. Применяйте её в танковых соединениях на открытой местности, но помните: разведывательные танки и командное снаряжение дороги, а подвижность резко падает в лесах, горах, джунглях и на болотах.§!"
 Weapons_company_desc:0 "§YСостав:§! 120 человек. Вооружение: стрелковое оружие x150, ПТРК x10, оборудование C&C x10.\n\nРота тяжёлого оружия, состоящая из средств огневой поддержки пехоты прямой наводкой: расчётов единых и крупнокалиберных пулемётов, автоматических гранатомётов и другого тяжёлого пехотного вооружения. Она предназначена обеспечивать огневую поддержку любому пехотному подразделению, которому придана, в самых разных войсках.\n\n§GПодсказка дизайнера: рота тяжёлого оружия добавляет широкий набор показателей огня прямой наводкой, особенно бронепробиваемость, не занимая ширины фронта. Применяйте её для усиления универсальной пехоты, но помните: заметная потребность в пехотном снаряжении и штраф к окапыванию делают её менее привлекательной для дешёвых статичных защитников.§!"
 Heavy_mortar_company_desc:0 "§YСостав:§! 120 человек. Вооружение: стрелковое оружие x120, оборудование C&C x9, вспомогательные машины x15.\n\nМиномёты предназначены давать линейным частям быструю и собственную огневую поддержку, не запрашивая её у старших начальников. Они ведут огонь с закрытых позиций в интересах линейных подразделений и обходятся гораздо дешевле полноценной артиллерийской части.\n\n§GПодсказка дизайнера: миномётная батарея даёт сильную атаку по пехоте, не требуя артиллерийского снаряжения и не занимая ширины фронта. Применяйте её как дешёвую собственную огневую поддержку против пехоты, но помните: атаки по бронетехнике и бронепробиваемости она почти не даёт и снижает окапывание.§!"
 AT_company_desc:0 "§YСостав:§! 120 человек. Вооружение: стрелковое оружие x90, ПТРК x18, оборудование C&C x9.\n\nЭтот противотанковый взвод вооружён пехотными противотанковыми средствами и предназначен для работы именно с лёгкой пехотой. Легко действуя в городах, лесах и других укрытых или стеснённых местах, он способен без труда бить по бронетехнике противника и тут же уходить обратно в свои укрытия.\n\n§GПодсказка дизайнера: пехотные противотанковые средства дают высокую атаку по бронетехнике и бронепробиваемость, не занимая ширины фронта, для пеших, воздушно-десантных, морских и специальных соединений. Применяйте их, когда таким дивизиям нужно держать удар бронетехники, но помните: прочие боевые показатели при этом падают, а специальное снаряжение стоит денег.§!"
 Mot_AT_company_desc:0 "§YСостав:§! 200 человек. Вооружение: стрелковое оружие x180, самоходные ПТРК x18, оборудование C&C x18, вспомогательные машины x6.\n\nБатарея, предназначенная для борьбы с танками и ведущая огонь с установленных на машинах позиций. Она рассчитана прежде всего на скорость, чтобы поспевать за быстро движущимися подвижными и бронетанковыми частями, сохраняя при этом усиленные противотанковые возможности.\n\n§GПодсказка дизайнера: возимые противотанковые средства дают высокую атаку по бронетехнике и бронепробиваемость, не замедляя подвижные соединения. Применяйте их в моторизованных, бронетанковых, воздушно-десантных и морских дивизиях против танков, но помните: тяжёлое противотанковое вооружение и вспомогательные машины обходятся дороже, а против небронированных целей толку мало.§!"
 AA_company_desc:0 "§YСостав:§! 120 человек. Вооружение: стрелковое оружие x90, ПЗРК x18, оборудование C&C x18.\n\nПодразделение, специально оснащённое для борьбы с авиацией противника и защиты от его вертолётов и прочих летательных аппаратов.\n\n§GПодсказка дизайнера: зенитная батарея даёт высокую атаку по авиации, не занимая ширины фронта. Применяйте её для прикрытия дивизий, действующих под вражеским господством в воздухе, но учтите, что в наземном бою она слаба и расходует специальное зенитное снаряжение, почти бесполезное при чистом небе.§!"
 Combat_engineer_company_desc:0 "§YСостав:§! 150 человек. Вооружение: стрелковое оружие x100, оборудование C&C x10, вспомогательные машины x10.\n\nБоевые сапёры выполняют инженерные работы непосредственно в интересах линейных частей. Они обучены и оснащены для преодоления трудной местности — рек или противотанковых рвов. Они же проделывают проходы в минных полях и других заграждениях и расчищают участки, чтобы остальные войска могли пройти беспрепятственно.\n\n§GПодсказка дизайнера: боевые сапёры добавляют защиту, прорыв и умеренные бонусы к атаке и защите в лесах, горах, джунглях и городах, не занимая ширины фронта. Применяйте их для наступления через трудную местность, но помните: они требуют немало пехотного снаряжения и приносят меньше пользы на открытом пространстве.§!"
 amphibious_landing_detachment_desc:0 "§YСостав:§! 150 человек. Вооружение: оборудование C&C x10, стрелковое оружие x100, вспомогательные машины x10, самоходные ПТРК x5.\n\nПриданные флотом подразделения, позволяющие быстро и эффективно проводить морские десантные операции. Располагая специальными десантными кораблями и снаряжением, они обеспечивают стремительную высадку с корабля на берег или из-за горизонта. Платой за включение такого подразделения становится падение способности вести неамфибийные операции.\n\n§GПодсказка дизайнера: морской десантный отряд резко повышает атаку, защиту и подвижность морских соединений при высадке. Применяйте его в дивизиях, предназначенных для штурма побережья, но помните: он занимает ширину фронта, требует живой силы и снаряжения и накладывает тяжёлые штрафы почти на всех видах суши.§!"
