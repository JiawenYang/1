l_russian:
 #Цепочка событий Шестой ближневосточной войны
 mew.0.t: "Пушки Газы"
 mew.0.d: "Ранним утром 9 октября 2020 года ЦАХАЛ пересекает границу Газы, и операция «Железный меч» разворачивается в полную силу. Броневые колонны идут под прикрытием дронов, а авиация волна за волной бомбит сеть туннелей ХАМАС. Правительство Израиля объявляет стране, что это лишь «ограниченная зачистка» террористической инфраструктуры. Но в Каире и Дамаске этому не верит никто: когда израильские танки входят в пригороды Газы, всем ясно, что значит «ограниченная»."
 mew.0.a: "Пусть Газа заплатит."
 mew.1.t: "Пороховая бочка вспыхнула вновь"
 mew.1.d: "План аннексии Иорданской долины продвигается с благословения Вашингтона, а Авраамовы соглашения раскололи арабский мир надвое. Брошенные всеми палестинцы поднимаются на массовые протесты в Газе и на Западном берегу. Кровавые столкновения на Храмовой горе в начале октября стали последней каплей: ракеты из Газы обрушиваются на израильские города, «Хезболла» в Южном Ливане приведена в боевую готовность, а сирийская бронетехника сосредотачивается на голанском фронте. Телефонные линии между Каиром и Дамаском не молчат всю ночь - война Судного дня 1973 года, кажется, готова повториться полвека спустя."
 mew.1.a: "Ещё одна Октябрьская война?"
 mew.2.t: "Шестая ближневосточная война"
 mew.2.d: "В шесть утра по каирскому времени Египет, Сирия и «Хезболла» объявляют о начале совместной военной операции против Израиля; ООП и ХАМАС отвечают на призыв в считаные часы. Коалиция заявляет о цели «остановить аннексию и освободить оккупированные территории». ЦАХАЛ мобилизуется на всех фронтах, «Железный купол» перехватывает ракеты над Тель-Авивом. Впервые с 1973 года арабский мир един в войне против Израиля - а Америка, тонущая в пандемии и предвыборной лихорадке, может лишь наблюдать, как горит Ближний Восток."
 mew.2.a: "Храни их всех Господь."
 mew.3.t: "Решение в Белом доме"
 mew.3.d: "На экранах в Пентагоне карта Ближнего Востока меняет цвет каждый час. Команда нацбезопасности расколота: «ястребы» требуют экстренной военной помощи Израилю, вплоть до авианосной группы в Восточном Средиземноморье; глава аппарата напоминает президенту - смертность от COVID растёт, выборы через несколько недель, и избиратели не хотят американских сапог на песке. Посол Израиля ждёт за дверью уже два часа."
 mew.3.a: "Америка прежде всего. Пусть разбираются сами."
 mew.3.b: "Одобрить экстренную военную помощь - но без войск."
 mew.4.t: "Нефтяной кризис охватил планету"
 mew.4.d: "Война на Ближнем Востоке ударила по артериям мировой энергетики. Судоходство по Суэцу парализовано, страны Персидского залива вынуждены выбирать сторону, цены на нефть взлетают за считаные дни. Танкеры выстраиваются в очередь у Роттердама и Сингапура, правительства открывают стратегические резервы. Аналитики предупреждают: шок может превзойти эмбарго 1973 года - и на этот раз великие державы, увязшие в пандемии, не смогут подхватить падающий нож."
 mew.4.a: "Заправляйтесь, пока не поздно."
 mew.5.t: "ЦАХАЛ входит в Газу"
 mew.5.d: "Совет Безопасности ООН собирается на экстренное заседание и расходится во взаимных обвинениях. Госпитали Газы за считаные часы заполняются ранеными, Египет открывает КПП «Рафах» для беженцев, а ХАМАС призывает весь арабский мир «не молчать дальше». В ночных телефонных разговорах монархии Залива приходят к одному выводу: если они снова останутся в стороне, следующими в списке на аннексию будут они сами."
 mew.5.a: "И снова мир просто смотрит."
 mew.6.t: "Арабская коалиция и Ось сопротивления вступают в войну"
 mew.6.d: "Три дня спустя Египет и Сирия объявляют, что выполняют Иерусалимский оборонительный пакт, а Алжир, Ливия и правительство Ливана объявляют Израилю войну. Почти в тот же час Ось сопротивления во главе с Ираном переходит границу: «Хезболла» обрушивает ракеты из Южного Ливана, иракские шиитские ополчения перебрасывают людей в Сирию через открытые переходы, а заявление Тегерана состоит из одной фразы - «От Средиземного моря до Персидского залива нет ни одного изолированного фронта». Израиль оказывается сразу на двух фронтах: регулярная армия под командованием Каира и ось сопротивления под командованием Тегерана."
 mew.6.a: "Шестая ближневосточная война началась по-настоящему."
 mew.10.t: "Флаг Палестины над Иерусалимом"
 mew.10.d: "Сопротивление Израиля наконец рухнуло под ударами коалиции. Палестинские бойцы первыми входят в Тель-Авив, египетские и сирийские войска зачищают оставшиеся очаги. ООП провозглашает единое палестинское государство со столицей в Иерусалиме. Сотни тысяч еврейских поселенцев в спешке эвакуируются в лагеря на Кипре и в Южной Европе; оставшихся ждёт неясная судьба. Почти восемьдесят лет сионистского эксперимента закончились, арабский мир ликует целую неделю - но под столом победителей уже тлеют новые фитили."
 mew.10.a: "Эпоха закончилась."
 mew.11.t: "Каирский военный союз"
 mew.11.d: "Победа принадлежит всему арабскому миру, но делёж трофеев требует порядка. Президент Египта приглашает лидеров Сирии, Палестины и ливанского сопротивления в Каир, предлагая превратить военную координацию в постоянный военный союз: единое командование, совместная ПВО, обмен разведданными. Дамаск подписывает первым - восстанавливающейся Сирии нужен египетский щит, а Каиру нужен Дамаск, чтобы доказать: лидер арабского мира вернулся."
 mew.11.a: "Впервые арабы выиграли войну на своих условиях."
 mew.20.t: "Великий Израиль"
 mew.20.d: "Война закончилась так, как никто не ожидал: ослепительные успехи коалиции первых дней были один за другим разбиты ЦАХАЛом. Синай вновь сменил хозяина, Южный Ливан полностью оккупирован израильтянами, Дамаск и Каир запросили мира. Кабинет безопасности обнародовал «расширение суверенитета»: весь Западный берег (5 655 км², включая Иорданскую долину и все поселения) и сектор Газа (365 км²) официально включены в состав Израиля; Южный Ливан к югу от Литани (около 1 000 км²) становится зоной безопасности; сирийские провинции Даръа и Эс-Сувейда (около 9 280 км²) отторгнуты для создания глубины к востоку от Голан; Синайский полуостров (около 61 000 км²) переходит под долгосрочную израильскую оккупацию. С уже аннексированными Восточным Иерусалимом и Голанами Израиль за один раз проглотил около 77 000 квадратных километров - «от моря до Иордана» наконец, а старое обещание «от Нила до Евфрата» впервые легло на стол кабинета. На Капитолийском холме конгрессмены-евангелисты поднимают тосты за исполнение библейских пророчеств; на улицах Тель-Авива ликование не заглушает глубокой тревоги - страна только что проглотила миллионы арабов, которых никогда не сможет переварить."
 mew.20.a: "Земля обетованная - в реальности."
 mew.21.t: "Арабская ярость"
 mew.21.d: "Тотальная победа Израиля воспламенила весь исламский мир. От Касабланки до Джакарты миллионы выходят на улицы, сжигая флаги Израиля и США; правительства арабских стран шатаются от «позора поражения», а протесты перерастают в требования перемен. Аналитики предупреждают: ненависть, порождённая этой войной, отравит Ближний Восток на целое поколение - а палестинские дети, растущие среди руин, станут её самыми радикальными семенами."
 mew.21.a: "Это не закончится. Никогда."
 mew.28.t: "За реку, в Месопотамию"
 mew.28.d: "Во имя «стратегической глубины» израильские танки форсируют Евфрат и объявляют войну Ираку. Анбар, Синджар и южная пустыня внесены в список военных целей, а передовые части выходят к западным предместьям Багдада; удержится ли иракский режим в коридоре Тигра - это решится уже не за столом переговоров, а на поле боя."
 mew.28.a: "Сердце Месопотамии отныне будет слушать Тель-Авив."
 mew.29.t: "Провозглашённая граница: от Евфрата до реки Египетской"
 mew.29.d: "Кнессет подавляющим большинством принимает Декларацию полной территории, провозглашая государственную границу «от Евфрата до реки Египетской». Это не свершившийся факт, а перечень военных целей: за каждый метр песка к востоку от Евфрата придётся платить гусеницами танков и козырями за столом мира. Карта Ближнего Востока будет перечерчена заново - но где пройдёт окончательная линия, заранее не ответит никто."
 mew.29.a: "Красная ручка перечерчивает границы."
 mew.30.t: "Счёт Тегерана выставлен"
 mew.30.d: "Впервые с начала войны кабинет безопасности Иерусалима ставит на стол сам Иран. Тегеран всю войну прятался за прокси: ракеты «Хезболлы», иракские ополченцы, йеменские дроны. Теперь арабская коалиция разбита, новая администрация Вашингтона только что выиграла евразийскую войну и рвётся перестроить Ближний Восток, а монархии Залива хотят исчезновения Исламской республики больше всех. На стол ложится совместный план: Израиль даёт авиацию и разведку, Америка - авианосцы и стратегическую поддержку, Залив - деньги и базы. Цель - уничтожить ядерную программу Ирана и Корпус стражей революции, а заодно вернуть Пехлеви на Павлиний трон."
 mew.30.a: "На этот раз без прокси."
 mew.31.t: "Американо-израильская авиация бьёт по Ирану"
 mew.31.d: "Израильские самолёты пересекают воздушное пространство Иордании и Ирака и всю ночь бомбят ядерные объекты в Натанзе, Фордо и Исфахане; Пятый флот США выходит из Бахрейна, и «Томагавки» проносятся над Ормузским проливом; авиабазы Саудовской Аравии, ОАЭ, Кувейта, Катара, Бахрейна и Омана одновременно открываются для американских самолётов. Сирены воют над Тегераном до рассвета, а Корпус стражей революции клянётся «поджечь весь регион». В течение нескольких часов Ормузский пролив объявляют закрытым, и цены на нефть взлетают до уровней, которые никто не решается назвать."
 mew.31.a: "Второе десятилетие Ближнего Востока начинается."
 mew.32.t: "Павлиний трон возвращается Пехлеви"
 mew.32.d: "Война заканчивается с падением Тегерана. Последние силы Корпуса стражей революции держатся в Тебризе и Мешхеде, а затем подписывают капитуляцию за столом переговоров. Реза Пехлеви II прилетает из Парижа в аэропорт Мехрабад, пока сотни тысяч людей размахивают «Львом и Солнцем» на улицах. С площади Азади он объявляет о восстановлении конституционной монархии, упразднении должности Верховного лидера и о мирном договоре с Израилем, Америкой и государствами Залива. Спустя сорок один год династия Пехлеви вернулась туда, откуда начала - но на этот раз за ней стоят суннитский арабский мир и авианосцы Вашингтона."
 mew.32.a: "Шах вернулся - но Иран уже не тот Иран, который он покинул."
 MEW_arab_military_alliance: "Арабский военный союз"
 #Событие и дух нефтяного кризиса переписаны под 2020 год (заменяет оригинал MD)
 usa_economic_events.38.t: "Энергетический кризис 2020 года"
 usa_economic_events.38.d: "Начало Шестой ближневосточной войны ввергло мировые нефтяные рынки в панику: Суэцкий канал закрыт, экспорт из Залива задушен, цены достигли невиданных высот. Американцы смотрят, как цифры на заправках растут с каждым днём, добивая семейные бюджеты, и без того подорванные пандемией. Транспортные расходы взлетают, авиакомпании борются за выживание, зависимые от топлива предприятия теряют прибыль. Призывы к энергонезависимости звучат всё громче - но на этот раз никто не знает, сколько продлится кризис."
 usa_economic_events.38.a: "Бензин будет стоить целое состояние!"
 USA_early_2000s_energy_crisis: "Энергетический кризис"
 USA_early_2000s_energy_crisis_desc: "Война на Ближнем Востоке нарушила мировые нефтяные рынки; панические закупки и спекуляции взвинтили цены, вызвав дефицит бензина и нефтепродуктов и ударив по американской экономике."
 #Шестая ближневосточная война: израильские военные решения (перенесено из Flames Rising ISR_arab_war)
 ISR_arab_war: "Израильско-арабская война"
 ISR_arab_war_countdown: "Отсчёт до конца войны"
 ISR_arab_war_countdown_desc: "Генштаб предупреждает: резервов и боеприпасов не хватит на длительную войну на истощение. Если бои затянутся более чем на 700 дней, Израиль будет вынужден принять решение о двух государствах."
 ISR_declare_victory: "Провозгласить Великий Израиль"
 ISR_declare_victory_desc: "Война окончена. Военный кабинет приступает к аннексии оккупированных территорий: Западный берег, Газа, Голанские высоты и Южный Ливан переходят под израильский суверенитет."
 ISR_kill_syria: "Сокрушить Сирию"
 ISR_kill_syria_desc: "Фронт Дамаска рухнул. ЦАХАЛ вынудит Сирию выйти из войны, займёт провинцию Даръа и создаст демилитаризованную зону на юге Сирии."
 ISR_kill_egypt: "Сокрушить Египет"
 ISR_kill_egypt_desc: "Каирские бронетанковые соединения уничтожены на Синае. ЦАХАЛ вынудит Египет выйти из войны и установит контроль над Синайским полуостровом."

 # ==== ZZZ Arab UAR chain ====
 ZZZ_arab_uar_category:0 "Арабская объединённая республика"
 ZZZ_UAR_faction_name:0 "Объединённая Арабская Республика"
 ZZZ_UAR_invite_egypt_observer:0 "Пригласить Египет наблюдателем в ШОС"
 ZZZ_UAR_invite_egypt_observer_desc:0 "После совместной победы Китая и России прежний порядок на Ближнем Востоке дал трещину. Каир увидел шанс: вместо того чтобы и дальше колебаться между великими державами, он стучится в дверь Шанхайской организации сотрудничества со статусом наблюдателя. Шаг небольшой, но его достаточно, чтобы египетские военные и монархии Залива заново взвесили расстановку сил."
 ZZZ_UAR_retry_egypt_membership:0 "Возобновить вступление Египта"
 ZZZ_UAR_retry_egypt_membership_desc:0 "Предыдущее голосование было заглушено египетскими военными. Пока Каиру нужны гарантии безопасности и внешняя помощь, эта дверь останется приоткрытой. Настаивать стоит политических усилий, но игра стоит свеч."
 ZZZ_UAR_form_arab_alliance:0 "Создать панарабский военный альянс"
 ZZZ_UAR_form_arab_alliance_desc:0 "Закрепившись в ШОС, Египет получил основания объединить арабский мир. Дамаск, Алжир, Триполи и Сана наблюдают: военный альянс во главе с Каиром приходит на смену прежним рыхлым лигам."
 ZZZ_UAR_war_on_arab_monarchies:0 "Объявить войну арабским монархиям"
 ZZZ_UAR_war_on_arab_monarchies_desc:0 "Династии Залива и Леванта всё ещё держат старый порядок. Эр-Рияд, Амман, Абу-Даби, Эль-Кувейт, Доха, Маскат и Манама отказываются признать первенство Каира. Ответом может быть только война. После приказа пути назад не будет."
 ZZZ_UAR_settle_war:0 "Урегулировать исход арабской войны"
 ZZZ_UAR_settle_war_desc:0 "Бои прекратились, но победа ещё не закреплена. Каир должен дать отчёт союзникам и миру: провозгласить объединение или признать поражение и роспуск альянса."
 ZZZ_arab_uar.1.t: "Выбор Каира"
 ZZZ_arab_uar.1.d: "Приглашение ШОС лежит на столе заседания в Каире. Генеральный штаб относится к нему настороженно: полноправное членство привяжет внешнюю политику Египта к курсу восточных держав. Президентство и генштаб спорят."
 ZZZ_arab_uar.1.a: "Военные согласны: Египет становится членом"
 ZZZ_arab_uar.1.b: "Военные против: вопрос отложен"
 ZZZ_arab_uar.2.t: "Каир получает место наблюдателя"
 ZZZ_arab_uar.2.d: "Египет появляется на заседаниях ШОС как наблюдатель. Без права голоса этого места уже достаточно, чтобы встревожить монархии Залива."
 ZZZ_arab_uar.2.a: "Хорошо"
 ZZZ_arab_uar.3.t: "Панарабский военный альянс создан"
 ZZZ_arab_uar.3.d: "Каир провозглашает панарабский военный альянс; Сирия, Алжир, Ливия и Йемен присоединяются один за другим. Военный блок вокруг Нила впервые появляется на политической карте Ближнего Востока."
 ZZZ_arab_uar.3.a: "Хорошо"
 ZZZ_arab_uar.4.t: "Провозглашена Арабская объединённая республика"
 ZZZ_arab_uar.4.d: "Арабские монархии падают одна за другой; Каир становится столицей нового государства. Флаг Арабской объединённой республики поднимается от Нила до Залива, и на карте наконец появляется единое арабское государство."
 ZZZ_arab_uar.4.a: "Хорошо"
 ZZZ_arab_uar.5.t: "Альянс распускается в огне войны"
 ZZZ_arab_uar.5.d: "Каир не выиграл эту войну. Панарабский военный альянс распущен, участники выходят, границы возвращаются к прежнему состоянию. Египет остаётся членом ШОС — это не изменилось."
 ZZZ_arab_uar.5.a: "Понятно"
 #Шестая ближневосточная война: названия шаблонов фракций
 MEW_aor_faction_name: "Ось сопротивления"
 MEW_jerusalem_pact_faction_name: "Иерусалимский оборонительный пакт"
 mew.33.t: "Сумерки шейхов Залива"
 mew.33.d: "Когда Китай и Россия одна за другой выиграли свои войны, гарантии безопасности, которые Вашингтон поддерживал на Ближнем Востоке полвека, потеряли всякий вес. Королевские дома Эр-Рияда, Абу-Даби, Эль-Кувейта, Дохи, Манамы, Маската и Аммана обнаружили, что американский зонт, десятилетиями укрывавший их, обратился в договор, который никто не станет соблюдать. Каир не упустил момент — Объединённая Арабская Республика во главе с Египтом объявила войну объединения против арабских монархий под лозунгом погребения старых династий Залива."
 mew.33.a: "Последние короны старого порядка падают."
