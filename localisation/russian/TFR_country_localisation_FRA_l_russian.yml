 FAF_national_duty_desc:0 "\n\n\n\n£GFX_FAF_national_duty\n\n\n\n\n\nНаш долг перед Францией принимал разные формы на протяжении истории, но одно всегда будет требоваться от нашей нации — служба. С установлением нашего нового режима к нам пришли сотни тысяч патриотичных французов, готовых служить Франции самым почётным из известных человеку способом. Мы выполним свой долг, подготовив этих людей к неизбежному продолжению европейской войны, ибо они готовятся сражаться не только за себя, но и за Францию!"
