 FAF_Strict_Martial_Law_idea_desc:0 "Военное положение будет сохраняться, пока по Франции рыщут её враги. Повседневная жизнь задыхается под блокпостами и постоянным надзором. Страх держит отступников в узде, даже если чувство нормальности остаётся поколебленным."
 FAF_Fascist_Paramilitaries_idea:0 "Фашистские парамилитарии"
 FAF_Fascist_Paramilitaries_idea_desc:0 "Сеть фашистских парамилитариев обеспечивает верность режиму, действуя безнаказанно по всей Франции. Их жестокие методы подавляют инакомыслие, но порождают обиду среди гражданских. Тем не менее их способность обеспечивать контроль — именно то, что нужно нашей нации."
