 FAF_fasces_over_france_cat:0 "Фасции восходят над Францией"
 FAF_fasces_over_france_cat_desc:0 "\n\n\n\n\n£GFX_FAF_french_fascist_cat\n\n\n\n\n\n\n\n"
 FAF_legalize_paganism_decision:0 "Поощрять язычество"
 FAF_legalize_paganism_decision_desc:0 "Христианство — это аномалия. Оно не французское творение и даже не европейское. Это рак, который распространяется неконтролируемо и с невообразимо быстрой скоростью. Настолько, что он вытеснил наши исконные, родовые верования. Он заставил французский народ забыть, кто он на самом деле! Забыть свои корни! Своё наследие! Поэтому мы должны вернуть истинно французские религии — те, что определяют наш народ как галльский, а не как «христианский»."
 FAF_provoke_french_opposition_decision:0 "Провоцировать французскую оппозицию"
 FAF_provoke_french_opposition_decision_desc:0 "Как лучше всего оказаться в центре внимания, одновременно уничтожая оппозицию? Конечно, выставив её в дурном свете. Как? Всё довольно просто — это старейший приём из учебника политики. Мы будем подначивать их двусмысленными оскорблениями, а они в гневе выставят себя дураками."
 FAF_word_of_the_bishop_decision:0 "Слово епископа"
 FAF_word_of_the_bishop_decision_desc:0 "На протяжении европейской истории папство играло нашими народами и правителями, как на скрипке. Используя христианскую веру как невидимое оружие, чтобы превратить Европу в искажённое подобие самой себя. Мы больше не будем проливать кровь во имя вымышленного бога. Папа станет нашим мальчиком-хористом и будет петь нам хвалебные песни."
 FAF_reorganize_the_LVF_decision:0 "Реорганизовать LVF"
 FAF_reorganize_the_LVF_decision_desc:0 "Имя «Силы добровольцев-лоялистов» извратили те, кто никогда по-настоящему его не понимал. Красные и либералы — единственная причина упадка нашей страны, поэтому этой стране нужно больше таких групп, как лоялисты, чтобы очистить эту грязь внутри нашей нации и избавить её от болезни."
 FAF_glorify_collaborationism_decision:0 "Прославлять коллаборационизм"
 FAF_glorify_collaborationism_decision_desc:0 "Коллаборационистов всегда называют предателями, крысами и собаками. Но как можно быть предателем, если работаешь ради избавления своей страны от болезни, которая медленно её убивает? Когда наш народ сотрудничал с немцами во Второй мировой войне, это было не для подрыва нашей страны, а для искоренения большевистской угрозы. Это уж точно не крыса и не предатель, а целитель и заботливый хранитель."
 FAF_work_f_decision:0 "Наш труд!"
 FAF_work_f_decision_desc:0 "Труд должен быть сделан — и будет. Труд — единственная форма действия, которая всегда даёт положительные результаты. Кирпичи сами не уложатся. Дороги сами не замостятся. Урожай уж точно не вырастет сам. Только потом и кровью нашего народа можно отстроить эту некогда славную страну."
 FAF_family_f_decision:0 "Наша семья!"
 FAF_family_f_decision_desc:0 "Семья — это всё, превыше всего. Самое святое — это семейный уклад. Только поддерживая традиционные семейные ценности и структуру, Франция сможет вновь заселиться. Война почти уничтожила целое поколение. Если мы не обновим жизненные силы нашей нации, мы обречены на гниение и крах."
 FAF_fatherland_f_decision:0 "Наша родина!"
 FAF_fatherland_f_decision_desc:0 "Родина, земля отцов — сила, объединяющая наш народ и делающая нас неделимыми. Без неё её народ — ничто; а без её народа она не может существовать. Оба связаны симбиотическими узами. Если наш народ когда-нибудь забудет свою родину, великая семья, которой когда-то была наша нация, будет разрушена навсегда. Разбита вдребезги, чтобы достаться чужим державам."
 FAF_honest_french_middle_class_decision:0 "Наш честный народ"
 FAF_honest_french_middle_class_decision_desc:0 "Французский народ воплощает совершенный образ божьего творения. Честный, безупречный и мудрый. Именно эти черты сделали нашу страну процветающей и великой. Французы никогда не хотели господства над другими, а лишь стремились распространять наши идеалы и культуру."
 FAF_oui_oui_oui_decision:0 "§COui! Oui! Oui!§!"
 FAF_oui_oui_oui_decision_desc:0 "Скажи «да» войне! Скажи «да» жертве! Скажи «да» победе! Наше поражение в Русско-европейской войне заставило наш народ забыть, что когда-то делало нас славной и могучей державой, поэтому мы должны напомнить ему об этом. Ведя его вперёд, мы научим его думать и действовать — не только ради него самого, но и ради нашего национального возрождения."
 FAF_non_non_non_decision:0 "§RNon! Non! Non!§!"
 FAF_non_non_non_decision_desc:0 "Скажи «нет» пацифизму! Скажи «нет» либерализму! Скажи «нет» коммунизму! Очистить дом — одно, а искоренить гниль, растущую глубоко внутри нашей нации, — совсем другое. Грязь, которая всё ещё отравляет умы наших граждан, не исчезнет сама собой; напротив, мы должны направить наш народ на правильный путь и не дать ему свернуть."
 FAF_paris_accords:0 "Пакт Карла Великого"
 NMD_northern_liberation_army:0 "Северная освободительная армия"
 OCT_french_peoples_liberation_front:0 "Народно-освободительный фронт Франции"
 FAF_pride_of_france_cat:0 "Гордость Франции"
 FAF_pride_of_france_cat_desc:0 "\n\n\n\n\n£GFX_FAF_pride_of_france_cat\n\n\n\n\n\n\n\nВозрождение Французского государства и традиционализма уже наступило — здесь и сейчас. Режим Виши вернулся к нам, и этот оплот консерватизма вновь занимает своё место в Европе как спаситель от бедствий либерализма.\n\nХотя государство хрупко и страдает от внутренних распрей между генералами, желающими стать великим маршалом Франции, само по себе оно прекрасно. Для его сохранения должно быть отдано всё."
 FAF_pride_of_france_dynamic:0 "Французский милитаризм"
 FAF_pride_of_france_dynamic_desc:0 "Люди всегда хвалят немцев за их военную доблесть и славу в истории, но когда речь о Франции, вспоминают лишь военачальников и стратегов, стоявших за войной, а не ту кровь, что сражалась на земле. Французская армия всегда была сильнейшей в Европе. Единственные случаи, когда она казалась слабой, — это когда львами командовали ослы. Сегодня даже французский народ забыл значительную часть своей культуры, своих военных традиций и своей военной доблести. Мы должны внушить нашим народам патриотизм, напомнить им о важности военной службы и военной силы."
