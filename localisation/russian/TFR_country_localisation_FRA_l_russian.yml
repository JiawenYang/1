 FAF_New_Era_Category:0 "Кое-что из старого, кое-что из нового"
 FAF_New_Era_Category_desc:0 "\n\n\n\n\n£GFX_FAF_new_and_old_cat\n\n\n\n\n\n\n\nФранция долгое время была центральным элементом европейской истории, у нас богатейшая история, и наша судьба предначертана звёздами. Когда говорят о цивилизации, в конечном счёте речь заходит о наших национальных достижениях. Кто дал так много искусству, культуре, философии, науке и технике? Кто потратил столько времени, чтобы возвысить миллионы людей по всему миру идеями Просвещения и современности? Мы были среди немногих, кто это сделал. Французский — один из самых распространённых языков в мире и некогда был лингва франка всей международной дипломатии. Целые экономики и национальная политика чужих стран склоняются перед нашей национальной волей.\n\nВ прошлом французские солдаты ступали на все континенты и заявляли права на них ради нашей славной нации в пику прочим ничтожным европейским империям, но пока те империи гибли от революций, порождённых нашей собственной славной революцией, мы остались. Мы украшали век за веком европейскую историю как континентальная держава, с которой нельзя не считаться. Вот кто мы! Вот наше предназначение! Вот кем мы останемся, пока живы! Весь мир вновь преклонится перед нашим словом — не только наши враги, но и союзники. Vive la France!"
 FRA_yellow_vests_idea:0 "Протесты жёлтых жилетов"
 FRA_yellow_vests_idea_desc:0 "\n\n\n\n£GFX_FRA_yellow_vest_banner\n\n\n\n\n\nФранцузский экономический спад тяжело ударил по рабочим: рост цен на топливо, высокая стоимость жизни и растущее неравенство угрожают уровню жизни. При этом непропорциональное налоговое бремя ложится на рабочий и средний класс. В мае 2018 года петиция собрала почти миллион подписей, что вызвало протесты, продолжающиеся уже почти два года.\nПротесты, символом которых стали жёлтые жилеты, объединили как крайне левых, так и крайне правых в противостоянии неолиберализму. Протестующие перекрывали дороги, возводили баррикады и участвовали в массовых демонстрациях.\nНасилие нарастало: города охватили беспорядки, столкновения с полицией и широкие разрушения имущества. Рейтинг одобрения Макрона упал более чем на 20 процентов. Эти протесты могут стать переломным моментом во французской политике — уходом от либерализма к росту экстремизма."
 FRA_yellow_vests_idea_1:0 "Протесты жёлтых жилетов"
