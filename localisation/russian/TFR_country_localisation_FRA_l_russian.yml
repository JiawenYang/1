 FAF_Engie_Bills_idea:0 "Векселя Engie"
 FAF_Engie_Bills_idea_desc:0 "Векселя Engie — это система займов и заимствований, которая позволит Франции ремилитаризоваться, не привлекая пристального внимания иностранных держав. Подобно векселям MEFO, использованным Германией для реиндустриализации страны, это дорогостоящая и нечистоплотная манипуляция, которая вряд ли продлится вечно. Однако, каким бы ни был конец, именно они необходимы Франции, чтобы вновь родиться подлинной державой на мировой арене."
