 FRA_authoritarian_liberalism:0 "Авторитарный либерализм"
 FRA_Triumph_over_the_Eastern_Menace:0 "Триумф над русским медведем"
 FRA_Triumph_over_the_Eastern_Menace_desc:0 "Кровью и потом медведь был побеждён. Были те, кто думал, что Европа падёт вместе с Америкой, что она останется беззащитной, станет добычей, пока вокруг кружат волки. Они не могли бы ошибаться сильнее. Именно Европа теперь стоит победительницей. От украинского партизана до французского пилота, от немецкого панцергренадера до британского морпеха — эта геркулесова задача оказалась возможной лишь благодаря нашему решению, как и решению Европы, сражаться до конца: без полумер и без мира без подлинной победы. Несмотря на сомнения некоторых относительно единой Европы, они больше не могут отрицать: объединённая общей целью, Европа способна совершить великое."
 FRA_Mourn_our_Sons:0 "Какой ценой?"
 FRA_Mourn_our_Sons_desc:0 "Медведь сломлен, но ценой огромных потерь. Попытка спасти Украину на ранних этапах провалилась, и то, что должно было стать коротким и решительным усилием, превратилось в трясину. Мы вышли победителями, но лишь после тяжёлого удара по нашей экономике и народам. Мы должны взять свою долю крови с трупа медведя, как и остальная НАТО. Мы сделаем всё возможное, чтобы держать Россию внизу мерами, направленными на паралич её экономики и военного аппарата. Новое российское правительство, похоже, лелеет идею реорганизации для новой попытки вернуть утраченное — по крайней мере за кулисами. По рекомендации генерального штаба мы и остальная НАТО будем поддерживать различные уровни готовности, и военная подготовка должна сохраняться. В маловероятном случае, если медведь снова поднимется против нас, мы будем готовы. Если они хотят вернуть своё наследие, самое учтивое — обеспечить, чтобы они погибли, пытаясь."
 FRA_The_Spirit_of_Victory:0 "Дух победы"
 FRA_The_Spirit_of_Victory_desc:0 "Русские считали Европу слабой и полагали, что она будет безучастно наблюдать за их маршем порабощения. Они думали, что в худшем случае наше вмешательство будет половинчатым и медленным — они не могли бы ошибаться сильнее. Благодаря быстрому и решительному вмешательству катастрофическое положение Украины было спасено, а российский натиск остановлен. Были успехи и неудачи, но в конце концов над Кубанью развевался французский флаг, а российское правительство рушилось. Мы намерены пожинать часть плодов победы, как и наши партнёры, но должны оставаться внимательными к подобным требованиям. Не нужно смотреть далеко в прошлое, чтобы увидеть негативные последствия карфагенского мира — реальные или мнимые. Мы верим, что с этим новым российским правительством можно работать и постепенно принять его обратно в Европу как партнёра, а возможно, и будущего друга. В конце концов, чем это новое российское правительство отличается от нашего? Оно наверняка увидит разум и поймёт, что работать с нами гораздо лучше, чем действовать в одиночку или даже пытаться вернуть утраченные территории. Вероятность столь безумного шага столь мала, что его лучше игнорировать — несмотря на то, что члены генерального штаба настаивают на бдительности, ведь, в конце концов, разве подготовка к нему не поощряла бы его?"
 FRA_Enter_the_New_Era:0 "Новая послевоенная эпоха"
 FRA_Enter_the_New_Era_desc:0 "Несмотря на жертвы и победу, мы не должны бездействовать. Мы сражались, чтобы сохранить старый порядок, и победили, но борьба никогда по-настоящему не прекращается. Мир нельзя растрачивать впустую: необходимо приложить все усилия, чтобы наши союзники дома оставались довольны и бдительны, а наши партнёры за рубежом — вооружены и экономически продуктивны. Немецкая экономика, возможно, сильнее с ЕС, который, в наших глазах, является его доверенным лицом, но именно Франция — мировая держава. Наши связи в Западной Африке обеспечивают поступление ресурсов и продовольствия в Европу и наполняют наши сокровищницы, но у наших партнёров в регионе есть собственные соперники и войны. Даже если НАТО не желает выделять на это ресурсы, мы не пожалеем средств, чтобы наши прошлые, настоящие и будущие инвестиции не были напрасны. Сильная Франция — это сильная НАТО, и кто на нашей стороне станет жаловаться на это?"
 FRA_Announce_Snap_Elections:0 "Объявить досрочные выборы"
 FRA_Announce_Snap_Elections_desc:0 "С окончанием войны возвращается политический раскол. Союзы удобства и перемирие в мелких распрях ради военных усилий, к сожалению, закончились. Несмотря на кажущуюся подавляющую популярность нашего правительства, оппозиция требует выборов здесь и сейчас, ссылаясь на наше «некомпетентное управление и плохое ведение войны». Их можно было бы игнорировать, но они обладают достаточным влиянием, чтобы вызвать серьёзные проблемы и замедлить будущее законодательство. Если мы столь популярны, как кажется, это может быть благом: это ещё больше упрочит нас, усилит нашу власть над правительством и позволит в будущем спокойно игнорировать подобные требования. Всегда есть шанс, что наши предположения о популярности ошибочны, но что такое жизнь без риска?"
 FRA_Declare_the_7th_Republic:0 "Провозгласить Седьмую республику"
 FRA_Vote_on_the_Sixth_Republic:0 "Конституционный референдум"
 FRA_Restoration_of_the_6th_Republic:0 "Восстановить Шестую республику"
 FRA_russian_reperations_idea:0 "Российские репарации"
 FRA_war_reperations_idea:0 "Военные репарации"
 FRA_war_reperations_lessened_idea:0 "Военные репарации"
 FRA_The_New_French_Sphere:0 "Восстановить нашу сферу"
 FRA_The_New_French_Sphere_desc:0 "После триумфа над российским империализмом мы — бесспорные защитники европейской демократии. Однако после нашей славной победы в районах, ранее контролировавшихся Россией, образовался вакуум власти. Как защитники демократии, мы должны оберегать свои интересы и утвердить мир и демократию на этих некогда самодержавных землях."
 FRA_Reclaim_the_Algerian_Departments:0 "Вернуть алжирские департаменты"
 FRA_Reclaim_the_Algerian_Departments_desc:0 "С тех пор как мы ушли оттуда десятилетия назад, алжирцы доказали свою неспособность управлять собственной страной. Они постоянно увязают во всевозможных проблемах — от сепаратистских групп до пограничных споров. Им нужна внешняя помогающая рука, и мы её предложим. Это первые шаги к обеспечению безопасности Африки."
 FRA_VIC_Freedom_for_North_Africa:0 "Свобода для Северной Африки"
 FRA_VIC_Freedom_for_North_Africa_desc:0 "Арабская весна началась более десятилетия назад, но почти ничего не принесла. Она принесла лишь гражданские войны, радикализм и смерть. Центральное звено провалов Арабской весны в Африке — Ливия, где с 2011 года бушует хаос, почти ничего не давший её участникам. Она также стала серьёзной угрозой безопасности для нас в Северной Африке, и потому пришло время обеспечить безопасность Ливии."
 FRA_VIC_Stabilize_West_Africa:0 "Стабилизировать Западную Африку"
 FRA_VIC_Stabilize_West_Africa_desc:0 "Одним из печальных последствий войны с Россией стала необходимость отозвать большую часть наших сил из Западной Африки. Отсутствие этих солдат значительно снизило способность стран региона обеспечивать верховенство закона и позволило возродиться многочисленным террористическим группам. Теперь, когда нам больше не нужно беспокоиться о делах вблизи дома, мы можем вернуться к работе в далёких землях. Рано или поздно мы окончательно искореним последние следы радикальных исламистов."
 FRA_VIC_Demand_African_Resources:0 "Требовать права на африканские ресурсы"
 FRA_VIC_Demand_African_Resources_desc:0 "Наша постоянная помощь некоторым африканским странам сделала их очень многим нам обязанными. Мы отвечаем за искоренение терроризма, строительство их инфраструктуры и экономики и защиту от всевозможных угроз. Пришло время им оплатить счёт, и для этого им достаточно взглянуть на свои огромные запасы природных ресурсов. Должно быть, управлять всеми этими минералами и драгоценными камнями обременительно; мы с радостью избавим их от этого."
 FRA_VIC_African_Economic_Expansion:0 "Экономическая экспансия в Африке"
 FRA_VIC_African_Economic_Expansion_desc:0 "Наше расширенное сотрудничество со странами Западной Африки открыло уникальное множество экономических возможностей, и мы были бы глупцами, не воспользовавшись ими. Во многих наших бывших колониях производство потребительских товаров всё ещё неразвито, и мы с радостью поможем им с этим. Взамен мы откроем новые рынки для нашей продукции. Шампанское и прекрасный вид на Гвинейский залив, кто-нибудь?"
 FRA_VIC_A_New_African_Union:0 "Новый Африканский союз"
 FRA_VIC_A_New_African_Union_desc:0 "По мере того как страны Западной и Северной Африки становятся всё более зависимыми от нас, встаёт вопрос, как далеко нам следует зайти. Ответ совершенно очевиден. Проще говоря, колониализм давно мёртв, и чтобы обеспечить максимальное подчинение народов Африки, они не должны находиться под контролем далёкой земли. Поэтому мы решили построить новый Африканский союз — такой, который не будет посмешищем. Этот новый союз поможет в развитии, добыче ресурсов и, конечно, торговле. Он станет вершиной наших действий в Африке."
 FRA_VIC_In_the_Right_Hands:0 "В надёжных руках"
 FRA_VIC_In_the_Right_Hands_desc:0 "С момента обретения независимости страны Западной и Северной Африки оказались просто неспособны управлять собой. Они постоянно попадали в руки террористов и диктаторов, и теперь, когда мы держим их под контролем, пора обеспечить, чтобы это больше не повторилось. Колониализм далеко не популярен, но это не колониализм — мы предпочитаем называть это управляемым содействием. С нашей тяжёлой направляющей рукой Африка будет в безопасности."
 FRA_VIC_Operation_Aigle:0 "§YОперация§!: Aigle"
 FRA_VIC_Pit_them_Against_Each_other:0 "Поощрять антиавторитаризм"
 FRA_VIC_Rebirth_of_Israel:0 "Сионистское возрождение"
 FRA_VIC_Clean_the_Slate:0 "Начать с чистого листа"
 FRA_Protect_Canadian_Soveriegnty:0 "Защитить канадский суверенитет"
 FRA_Protect_Canadian_Soveriegnty_desc:0 "Канада давно была одним из наших важнейших союзников: ещё во Второй мировой войне, когда она была одним из самых храбрых борцов с нацистской угрозой, она всегда стояла за демократические принципы и Запад. Однако с хаосом в бывших США многие фракции объявили Канаду частью своих идеальных Соединённых Штатов. Эти претензии неприемлемы, и мы защитим Канаду от любой американской агрессии."
 FRA_Ensure_Continental_Interests:0 "Обеспечить североамериканские интересы"
 FRA_Ensure_Continental_Interests_desc:0 "Даже когда ситуация в Восточной Европе успокаивается, положение в Соединённых Штатах остаётся плачевным. Есть фракции на территории бывших США, которым мы не можем позволить получить больше власти, чем у них уже есть: это означало бы гибель для миллионов людей. Помимо этой необходимости, у нас есть обязательство спасти союзника, который не раз нас выручал. Возвращать услугу никогда не вредно, а заодно можно заработать очки."
 FRA_canadian_isolation_tt:0 "§CЭто изолирует канадцев от европейских дел в попытке добиться независимости для квебекского народа§!"
 FRA_The_Miquelon_Bill:0 "Соглашение о Микелоне"
 FRA_The_Miquelon_Bill_desc:0 "По ту сторону Атлантики таится нечто злое, выдающее себя за Соединённые Штаты Америки. Но это не та страна, которой мы помогли освободиться от британцев два с половиной века назад, и они не желают ничего, кроме как эксплуатировать нас. Как бы больно ни было признавать, США мертвы и похоронены. Европу нужно защитить от этой новой угрозы; именно нам надлежит следить, чтобы американцы оставались на своей стороне океана."
 FRA_American_Realpolitik:0 "Победитель"
 FRA_American_Realpolitik_desc:0 "Похоже, кошмар наконец закончился. Русские заняты своими делами, Европа едина и сильна, но главное — Вторая американская гражданская война наконец завершилась. Пусть они теперь слабы и сломлены, их история не окончена, и нам вместе с остальным ЕС предстоит провести их через период восстановления. Мы помогли им освободиться от британцев — мы не можем бросить их сейчас."
 FRA_Franco_American_Diplomatic_Agreement:0 "Франко-американское дипломатическое соглашение"
 FRA_Franco_American_Diplomatic_Agreement_desc:0 "Впервые с 2021 года мы нанесли визит в Вашингтон. Новое американское правительство пригласило нас туда ради нового дипломатического соглашения, и мы с радостью согласились. Результаты оказались удовлетворительными, хотя и менее выгодными, чем мы надеялись. Американцы не в состоянии вернуться в НАТО, но в обмен на нашу помощь они обещают сделать это, когда придёт время. Пусть они уже не совсем те, что были десятилетие назад, мы рассчитываем на продолжение партнёрства."
 FRA_Guiana_Gambit:0 "Гвианский гамбит"
 FRA_Guiana_Gambit_desc:0 "Хотя НАТО и носит имя Северной Атлантики, его расширение никогда не ограничивалось названием. Поскольку ситуация в Восточной Европе для нас довольно благоприятна, мы обратили взгляд обратно за океан и немного на юг. Мы никогда не были большими друзьями с бразильцами, но ладим достаточно хорошо и хотели бы расширить партнёрство. Без русских они наверняка ищут новых партнёров. Но они упрямы, и их нужно немного убедить присоединиться к нашему делу. Как бы нам ни было жаль расставаться, Французская Гвиана наверняка подсластит сделку."
 FRA_Stabilize_the_Caribbean:0 "Стабилизировать Карибы"
 FRA_Stabilize_the_Caribbean_desc:0 "Недавний хаос в Соединённых Штатах и Мексике вверг относительно спокойные Карибы в состояние кризиса, и наши территории там оказались под угрозой. Со временем становится ясно, что всё не успокоится, если кто-то ничего не предпримет, а кроме нас и Соединённого Королевства ни у кого нет для этого причин. Прежде чем ситуация обострится, мы вмешаемся и примем меры, чтобы успокоить это неспокойное море."
 FRA_Enrich_Quebecois_Spirit:0 "Обогатить квебекский дух"
 FRA_Enrich_Quebecois_Spirit_desc:0 "Квебекский народ долго был зажат под пятой англосаксов, но никогда не позволял себя раздавить. Напротив, именно под этим давлением его культура и народ процветали, служа доказательством того, что некоторые вещи невозможно по-настоящему искоренить. Чтобы продолжать расширять влияние в Северной Америке, мы должны сначала найти поддержку среди квебекцев, и потому профинансируем усилия по расширению знаний об их наследии и культуре."
 FRA_Supplement_Quebecois_Industry:0 "Поддержать квебекскую промышленность"
 FRA_Supplement_Quebecois_Industry_desc:0 "Один из путей к сердцу любой нации — помочь ей строительством, которое послужит её экономике. Лучший способ сделать это, помимо, пожалуй, сельского хозяйства, — финансировать промышленные проекты. В Квебеке есть ряд программ развития, которые канадское правительство поддерживает не лучшим образом, и мы вмешаемся. Когда в Квебеке появится множество новых промышленных рабочих мест, люди вспомнят, кто на самом деле построил их заводы."
 FRA_Espouse_Cultural_Unity:0 "Утверждать культурное единство"
 FRA_Espouse_Cultural_Unity_desc:0 "Культуру Франции можно свести к трём словам: Liberté, Égalité, Fraternité. Однако, как и в любой нации, то, как люди понимают нашу культуру, различается от города к городу и даже от дома к дому. Все французы разделяют одни и те же основополагающие ценности, но детали порой вызывают споры. Мы не можем позволить людям ссориться из-за мелочей, поэтому все аспекты нашей культуры будут выставлены напоказ, чтобы каждый увидел, насколько мы действительно едины."
 FRA_quebec_independence_tt:0 "§CЭто навяжет [CAN.GetFlag] Канаде референдум о независимости [QUE.GetFlag] Квебека§!"
 FRA_Restore_the_French_Union:0 "Восстановить Французский союз"
 FRA_Restore_the_French_Union_desc:0 "Французский союз — наша прежняя половинчатая попытка реформировать колониальную систему — позорно провалился с концом Четвёртой республики. Вместо сохранения заморских департаментов и колоний всё было просто Францией. Однако к концу 1950-х эта система доказала свою несостоятельность и распалась. Но теперь мы в состоянии успешно управлять обширными заморскими территориями — не колониями, просто территориями. Не будет граждан второго сорта, только французы, и наша мощь вновь будет выставлена напоказ!"
 FRA_Department_of_Haiti:0 "Департамент Гаити"
 FRA_American_CW_Embargo_tt:0 "§YНАТО коллективно введёт эмбарго на торговлю со всеми фракциями американской гражданской войны§!"
 FRA_Further_American_Support_tt:0 "§YМы направим дополнительную поддержку выбранной нами фракции§!"
 FRA_VIC_African_Economic_Expansion_tt:0 "Открывает £decision_icon_small §Hрешения§! для: §Yдальнейшего экономического влияния на§! §Rстраны Западной Африки§!"
 FRA_VIC_In_the_Right_Hands_tt:0 "Открывает £decision_icon_small §Hрешения§! для: §Yдальнейшего военного влияния на§! §Rстраны Западной Африки§!"
 FRA_VIC_Bitter_Winner_tt:0 "§RРоссия должна заплатить за тех французских граждан, которых мы потеряли...§! \n\nФранция будет стремиться поддерживать £GFX_Federalization_Unity_texticon европейский мир, обеспечивая, чтобы [SOV.GetFlag] Россия никогда больше не смогла подняться и бросить вызов европейскому господству."
 FRA_VIC_Victorious_Spirit_tt:0 "§CЕвропа вступила в новую эпоху, поистине свободную от войны...§! \n\nФранция будет стремиться поддерживать £GFX_Federalization_Unity_texticon европейский мир, перестраивая [SOV.GetFlag] Россию так, как мы когда-то поступили с [GER.GetFlag] §YЗападной Германией§!."
 FRA_death_counter_flag:0 "Потерял более §R10 тысяч человек§!"
 FRA_The_Liberators_of_the_Caucasus:0 "Освободители Кавказа"
 FRA_The_Liberators_of_the_Caucasus_desc:0 "Без нас и НАТО в целом Кавказ всё ещё находился бы под контролем российских экспансионистов. Теперь, когда мы взяли на себя труд освободить его от прежних владык, мы не должны уклоняться от ответственности перед ним. Предоставленный самому себе, он либо погрузится в хаос, либо снова будет захвачен северным соседом. Этого нельзя допустить: мы обеспечим, чтобы страны Кавказа оставались независимыми от России и помнили, кто их освободил."
 liberator_of_the_caucasus:0 "Освободители Кавказа"
 FRA_Militarize_Kuban_Police:0 "Милитаризировать кубанскую полицию"
 FRA_Militarize_Kuban_Police_desc:0 "Поражение России привело к созданию нескольких новых государств в северокавказском регионе, важнейшим из которых, вероятно, является Кубанская Республика. К несчастью для кубанцев, их новое правительство с трудом поддерживает правопорядок, и страна уже подвергается нападениям поддерживаемых Россией террористов. Чтобы построить себе оплот на Востоке, мы охотно поможем кубанцам усилить полицию и административный аппарат."
 FRA_Crimean_Investments:0 "Инвестиции в Крым"
 FRA_Crimean_Investments_desc:0 "Крымский полуостров более десятилетия находился под незаконным российским контролем, был заброшен и использовался не более чем как раздутая военная база; он понёс масштабные разрушения из-за тяжёлых боёв, происходивших там. К счастью, теперь он в руках более ответственных владельцев — украинцев. В знак доброй воли и как способ распространить влияние на Востоке мы инвестируем в восстановление Крыма и обеспечим, чтобы он был возвращён в лучшем состоянии, чем был захвачен!"
 FRA_EU_kill_EUrself_tt:0 "Это отрежет нас от остальной части дерева фокусов и подготовит £GFX_Federalization_Unity_texticon §CПОЛНУЮ ФЕДЕРАЛИЗАЦИЮ§!."
 FRA_EU_sister_republic_tt:0 "Это отрежет нас от пути £GFX_Federalization_Unity_texticon §CПОЛНОЙ ФЕДЕРАЛИЗАЦИИ§!, но вместо этого начнёт создание [EUU.GetFlag] §YФРАНКО-ИБЕРИЙСКОЙ ФЕДЕРАЦИИ§!"
 FRA_Apologize_for_War_Contribution:0 "Её честь восстановлена"
 FRA_Apologize_for_War_Contribution_desc:0 "Мужеством и жертвенностью армия восстановила честь Франции. В её самый тёмный час и среди ложных обвинений в неудаче люди выстояли и доказали, что мы всё ещё держава, достойная имени Франции. Из пасти поражения мы вырвали великую победу — не только для себя, но и для всей Европы. Оставив позади пятно неудачи, мы можем смотреть вперёд и вместе с остальной Европой идти к лучшему завтра. Надеемся, украинцы поставят нам достаточно памятников…"
 FRA_Demand_Increased_Reperations:0 "Увеличить репарации"
 FRA_Demand_Increased_Reperations_desc:0 "Мы унизили русских, но одного этого мало, чтобы заставить их платить. Подписанный с ними мирный договор был слишком мягким и позволил им уйти от ответственности за большинство преступлений. Большая часть причинённого ими ущерба всё ещё не устранена, и если они не хотят, чтобы мы сделали их жизнь ещё тяжелее, они заплатят. Что посеешь, то и пожнёшь."
 FRA_Bloodied_Liberator_of_the_Caucasus:0 "Сохранить военные гарнизоны"
 FRA_Bloodied_Liberator_of_the_Caucasus_desc:0 "Мы не можем позволить себе демобилизацию, пока нет. Хотя многие провозгласили новую эпоху мира, тайные действия в России, похоже, говорят об обратном. Поэтому мы продолжим снабжать и содержать военные гарнизоны на Кавказе, готовые спешно ответить на любую угрозу. Русские не обманули нас в первый раз и не сделают этого сейчас."
 FRA_Rip_out_the_Russian_Rot:0 "Вырвать российскую гниль"
 FRA_Rip_out_the_Russian_Rot_desc:0 "Большая часть земель, взятых у России, поражена финансируемыми государством террористами и сепаратистами. Это серьёзно мешает нашей реконструкции и государственному строительству. Русские делают всё возможное, чтобы сделать эту землю как можно более непригодной для нас, и потому мы должны их выгнать. Они потеряли эту землю и должны нести последствия."
 FRA_Negotiate_Exclusive_Treaty_Ports:0 "Договориться об исключительных договорных портах"
 FRA_Negotiate_Exclusive_Treaty_Ports_desc:0 "Россия дипломатически изолирована и подвергается жёстким санкциям с момента провала её маленькой \"exploit\" в Восточной Европе, но теперь мы готовы предложить ей спасательный круг. Если русские согласятся открыть несколько своих портовых городов для западной торговли и инвестиций, мы будем рады немного ослабить их наказание. Если они захотят отказаться — что ж, это всё равно их потеря."
 FRA_Caucasian_Resource_Rights:0 "Права на кавказские ресурсы"
 FRA_Caucasian_Resource_Rights_desc:0 "Под горами и равнинами Кавказа лежат огромные запасы природных ресурсов. Мы помогли этому региону в такой степени, что теперь обладаем большим влиянием на него, и многие политики нам обязаны. Французская экономика и армия всегда требуют больше ресурсов, и им безразлично, откуда они берутся. Это малая цена за нашу постоянную защиту."
 FRA_Fund_Ukrainian_Peacekeepers:0 "Финансировать украинских миротворцев"
 FRA_Fund_Ukrainian_Peacekeepers_desc:0 "Украинский народ достойно сражался против российского нашествия, и теперь он усердно трудится, чтобы обуздать земли, освобождённые нами от захватчика. К сожалению, большую часть внимания мы сосредоточили на Кавказе и не можем выделить дополнительных войск для помощи украинцам. Однако мы вполне можем финансировать их усилия, ибо слабая Россия означает более лёгкое будущее для нас."
 FRA_The_Caucasian_Entente:0 "Кавказская Антанта"
 FRA_The_Caucasian_Entente_desc:0 "Пришло время полностью формализовать наши обязательства перед Кавказом. До сих пор мы лишь снабжали и финансировали его, но теперь можем пойти на шаг дальше. Эти страны будут приглашены в НАТО, чтобы им больше никогда не приходилось бояться русских. Отказавшиеся не будут исключены из нашей защиты, ибо мы никогда не бросим свой тяжёлый труд и инвестиции. Пока мы стоим, Кавказ останется свободным."
 FRA_The_Caucasian_Entente_tt:0 "Это создаст пакт о взаимной обороне между Азербайджаном, Арменией, Кубанью и Грузией во главе с великой нацией Францией, чтобы Россия никогда больше не смогла подняться на ноги."
 FRA_Prevent_Another_Weimar:0 "Не допустить новой Веймарской республики"
 FRA_Prevent_Another_Weimar_desc:0 "Крушение Веймарской республики в XX веке, рождённое унижением и хаосом, в конечном счёте породило катастрофу из руин демократии. Крушение России в XXI веке служит суровым предупреждением: мы не должны позволить раздробленной Москве повторить этот спуск в экстремизм и месть. Франция возглавит процесс, чтобы послевоенное восстановление России шло по пути стабильности и мира."
 FRA_Democratization_of_Eastern_Minds:0 "Демократизация восточных умов"
 FRA_Democratization_of_Eastern_Minds_desc:0 "Поражение России открыло двери демократии для Восточной Европы. Как защитники европейской свободы, мы возглавим преобразование мышления во всём регионе. От Варшавы до Киева мы будем поддерживать образовательные инициативы, свободу СМИ и гражданское общество, чтобы народы Восточной Европы освободились от авторитарных теней. Семена демократии укоренятся, расцветут и преобразят Восток."
 FRA_Demand_Ukrainian_Leniancy:0 "Требовать украинской снисходительности"
 FRA_Demand_Ukrainian_Leniancy_desc:0 "Украина заплатила тяжёлую цену в войне против России. Мы чтим её жертву, но победа не должна стать поводом для чрезмерных требований. Мы будем убеждать Украину проявить сдержанность в послевоенных территориальных претензиях и репарациях, способствуя примирению, а не обиде. Только отбросив ненависть, Украина и Европа смогут вместе построить прочное и стабильное будущее."
 FRA_UKR_leniancy_tt:0 "Если [UKR.GetFlag] Украина откажется занять более снисходительную позицию по отношению к российским гражданам в своих [KBK.GetFlag] оккупационных правительствах, мы примем против неё экономические и политические меры."
 FRA_Denounce_Azov_Influence:0 "Осудить влияние «Азова»"
 FRA_Denounce_Azov_Influence_desc:0 "Эйфория победы не должна быть омрачена подводными течениями экстремизма. Мы наблюдали рост влияния азовцев в Украине — их радикальная идеология противоречит демократическим ценностям. Мы публично осудим это влияние и будем настаивать, чтобы Киев решил эту растущую проблему. Мир в Европе не должен быть омрачён призраком неонацизма — путь Восточной Европы к демократии должен оставаться незапятнанным."
 FRA_Capitalize_on_Caucasus:0 "Извлечь выгоду из Кавказа"
 FRA_Capitalize_on_Caucasus_desc:0 "Кавказ долго был слабым местом российского влияния — и возможностью для нас. С поражением Москвы мы усилим сотрудничество со странами Кавказа, используя их ресурсы и стратегическое положение. От нефтяных месторождений Баку до торговых путей Тбилиси мы будем инвестировать в экономическое развитие и демократические инициативы, чтобы Кавказ стал союзником Европы, а не вассалом России."
 FRA_Uphold_Equality:0 "Отстаивать равенство"
 FRA_Uphold_Equality_desc:0 "Равенство станет основой новой эпохи Европы. Независимо от расы, пола или происхождения, каждый европейский гражданин должен получить одинаковые права и возможности. Под нашим руководством, от виноградников Шампани до деревень Восточной Европы, все будут пользоваться плодами демократии."
 FRA_Eastern_Democracy_Manifest:0 "Провозгласить восточную демократию"
 FRA_Eastern_Democracy_Manifest_desc:0 "Демократия в Восточной Европе — не мечта, а необходимость. После падения России мы возглавим движение за демократизацию Востока. От Балтики до Чёрного моря демократические выборы, верховенство закона и гражданское участие сметут остатки авторитарного упадка. Свет свободы озарит Восток, и великая демократическая волна XXI века начнётся здесь."
 FRA_VIC_Withdraw_from_integrated_command:0 "Выйти из объединённого командования"
 FRA_VIC_Withdraw_from_integrated_command_desc:0 "Хотя мы успешно выиграли справедливую войну против российской агрессии, победа не может скрыть глубокие разногласия внутри НАТО и боль, которую испытывает наш народ. После того как Соединённые Штаты, некогда лидер западного мира, утратили доминирующее положение, конфликты и споры внутри НАТО и ЕС были таковы, что от одного воспоминания бросало в дрожь. Единство и дружба, о которых говорят политики, оказались хрупкими перед лицом неопределённого будущего. К счастью, французский народ увидел правду и потребовал перемен. Устаревшую систему необходимо демонтировать, и только так мы сможем заложить основу новой эпохи. Отныне Франция больше не будет участвовать в объединённой командной структуре НАТО. Мы останемся твёрдыми с любыми союзниками, готовыми сражаться рядом с нами."
 FRA_VIC_Our_Own_Direction:0 "Наш собственный курс"
 FRA_VIC_Our_Own_Direction_desc:0 "Вооружённые силы Французской Республики вновь продемонстрировали свою силу и принесли гордость нации в последнем конфликте. Боевая эффективность нашей армии, несомненно, одна из лучших в Европе. Это неоспоримый факт. Однако не из неверности союзникам, а из чувства ответственности мы должны ответить на опасения наших офицеров и солдат относительно небрежности союзников в вооружении и дисциплине как во время войны, так и после неё. Эти опасения заслуживают серьёзного внимания наших политических руководителей и высших командиров. Чтобы сохранить независимость и наследие наших вооружённых сил, поддержать их высокую боевую эффективность и обеспечить Франции статус великой военной державы, мы должны твёрдо отвергнуть ошибочную идею слияния французской армии в единую европейскую силу. Мы должны и дальше уделять приоритетное внимание развитию собственной армии."
 FRA_VIC_With_Distinction:0 "С отличием"
 FRA_VIC_With_Distinction_desc:0 "От чуда Орлеана до триумфа при Аустерлице, от обороны Вердена до освобождения Парижа от Третьего рейха, а теперь и боёв плечом к плечу с восточноевропейскими союзниками против российских захватчиков — славная история и достижения французской армии выдержали испытание временем и сменами режимов. Боевой дух передавался из поколения в поколение. В сегодняшних французских солдатах по-прежнему ярко сияют рыцарские ценности и товарищество прошлого. Укрепляя это чувство единства через историю, мы также напомним французскому народу о великих деяниях его предков и об исторической ответственности, которую он теперь несёт. Армия станет образцом для французского общества, ведя нацию к исполнению её миссии."
 FRA_VIC_The_Frenchmans_Burden:0 "Бремя француза"
 FRA_VIC_The_Frenchmans_Burden_desc:0 "Ничто не делает француза более гордым, чем звание гражданина первой страны, свергнувшей тирана и достигшей независимости и процветания собственными усилиями. Вооружённые силы первой в мире демократической республики долго были жизненной силой укрепления национального единства. Это уникальное чувство ответственности станет ключевым элементом объединения французского общества и укрепления французской армии в грядущую эпоху. Мы покажем гражданам Франции и всему миру, что защита и распространение идеалов свободы, равенства и братства — великая миссия французского народа, миссия, сформированная славной историей Франции и борьбой её народа. Это обновлённое гражданское сознание принесёт глубокие перемены во французскую армию. Отныне она будет сражаться с двойной миссией — защищать настоящее и формировать будущее."
 FRA_VIC_The_New_Grand_Army:0 "Великая армия"
 FRA_VIC_The_New_Grand_Army_desc:0 "Каждый год 14 июля, в День взятия Бастилии, для французского народа проходит национальный праздник. В этот день Париж превращается в море синего, белого и красного, а представители элитной французской армии маршируют в едином строю под Триумфальной аркой, символизируя силу и единство французского народа и непоколебимое достоинство нации. Блеск винтовок, медные каски и красные плюмажи кавалерии, поднятые стволы и массивные гусеницы танков Leclerc внушают трепет и гордость. Мы продолжим демонстрировать мощь французской армии, подчёркивая её уникальность, пробуждая национальную гордость и напоминая солдатам об их основополагающем духе. Они будут знать, что защищают родину не просто со страстью; в любой момент родина рядом с ними."
 FRA_VIC_Return_to_Old:0 "Французская армия былых времён"
 FRA_VIC_Return_to_Old_desc:0 "После периода восстановления и суровой подготовки французская армия показала свои лучшие качества, соперничая с непобедимыми силами, которые вели Великий Конде, Наполеон, Фош и Тассиньи. Армия доказала способность преодолевать тяжёлые испытания, сохранять свою глубинную сущность и сдерживать всех злонамеренных противников. Наши политические руководители и высшие генералы очень довольны нынешним состоянием армии и полностью готовы развернуть эту грозную силу в любом будущем крупном конфликте. Они уверены в великих победах, которые этой армии предстоит одержать."
 FRA_VIC_Strengthen_NATO:0 "Укрепить нашу приверженность"
 FRA_VIC_Strengthen_NATO_desc:0 "Если кто-то ещё сомневается в ключевой роли альянса НАТО в защите Европы — особенно после того, как Соединённые Штаты, слишком занятые внутренним крахом, не смогли оказать поддержку, оставив её недостаточной, и после того, как агрессивная война России, движимая экспансионистскими амбициями, закончилась поражением, — то его взгляд опасно близорук. Подобные взгляды могут нанести глубокий вред западной цивилизации. К счастью, политические руководители нашей страны и наших союзников непоколебимы в приверженности пути Европейского союза. Они решительно обещали укреплять военное сотрудничество, принимая ключевые решения ради будущего Европы. Как важнейшая военная держава ЕС и главная сила, противостоящая восточным угрозам, французские вооружённые силы и далее будут опорой европейской безопасности, всегда готовые к следующему вызову."
 FRA_VIC_The_European_Army:0 "Европейская армия"
 FRA_VIC_The_European_Army_desc:0 "Президент Эммануэль Макрон неизменно призывал к созданию «независимой европейской вооружённой силы». Однако эта инициатива встречала повторное сопротивление США, а многие в Европе, всё ещё питая иллюзии и о США, и о России, сомневались в её осуществимости. Они боялись, что провокация любой из сверхдержав приведёт к катастрофическим военным или экономическим последствиям. Сегодня эти опасения оказались ошибочными. Европа больше не может позволить себе зависеть от какой-либо сверхдержавы в своей безопасности. Более того, мелкомасштабное военное сотрудничество европейских стран, существующее более сорока лет, доказало свою ценность в недавнем конфликте. Теперь время Брюсселю и нашим правительствам действовать решительно и двигаться к давней цели «европейской армии»."
 FRA_VIC_Our_Place_in_Europe:0 "Наша роль в Европе"
 FRA_VIC_Our_Place_in_Europe_desc:0 "Франция — политический центр, экономический двигатель и военный оплот Европы; её значение в современной Европе невозможно переоценить. В военной сфере, чтобы усилить нашу лидерскую роль и позиции в ЕС, мы будем способствовать более тесному сотрудничеству французской армии и союзных сил. Это включает установление единых стандартов подготовки, разработку согласованных организационных планов, запуск программ обмена курсантами и проведение всесторонних многоуровневых совместных учений во всех видах войск. Высокие стандарты и обширный опыт французской армии делают её образцом для любой европейской армии. По мере того как всё больше союзников будут принимать французские военные практики, наше влияние и потенциальный масштаб совместных сил, которые мы сможем возглавить в будущих конфликтах, будут расти."
 FRA_VIC_The_French_European_Army:0 "Франко-европейская армия"
 FRA_VIC_The_French_European_Army_desc:0 "После обширного сотрудничества и корректировок мы с гордостью говорим, что французская военная модель была принята несколькими европейскими странами. Французская система командования и боевые части теперь беспрепятственно интегрируются с частями этих стран, позволяя быстро формировать готовую к бою совместную силу. Политические руководители и военные чиновники Парижа, Берлина, Брюсселя, Амстердама и Рима согласны, что пришло время создать постоянную европейскую совместную вооружённую силу. Построенная на основе французского военного опыта, эта многонациональная сила объединит солдат разных стран и языков в миссии защиты европейской цивилизации. В этом деле французская армия и её высшее командование будут играть центральную и незаменимую роль."
 FRA_VIC_A_Distinctly_French_Force:0 "Явно французская сила"
 FRA_VIC_A_Distinctly_French_Force_desc:0 "Если мы действительно ставим безопасность Франции и Европы на первое место, мы должны отвергнуть любые иллюзии и пустую риторику, которые могут помешать нашим действиям. После тщательных внутренних обсуждений наши политические руководители и военные чиновники единогласно согласны, что сохранение независимости французской армии — лучший способ обеспечить надёжную оборону и защитить европейскую цивилизацию. Потенциальные проблемы европейской совместной вооружённой силы — путаница в командовании, языковые барьеры и культурные различия — являются ключевыми причинами отказа от плана совместных сил. Франция продолжит поддерживать союзные армии на этой основе. Эта стратегия позволяет французской армии сохранять гордость, оставаясь сильнейшим защитником Европы и образцом для европейских сил."
 FRA_VIC_The_New_French_Army:0 "Новая французская армия"
 FRA_VIC_The_New_French_Army_desc:0 "Новый этап французской военной реформы близится к завершению, и мы можем уверенно заявить, что французская армия остаётся сильнейшей в Европе. По сравнению с прежней, французская армия теперь ещё более грозная для врагов, с более эффективной и устойчивой внутренней структурой, достигнув вершины как в наступлении, так и в обороне. Марианна будет гордиться нашими достижениями, и ничего этого не было бы без смелых реформ, преобразивших французскую армию."
 FRA_End_of_War:0 "Конец войны"
 FRA_End_of_War_desc:0 "Когда дым войны рассеивается, сладкий аромат мира кажется и ностальгическим, и бодрящим. Российская угроза нейтрализована, страна осталась бессильной и ждёт своей участи. В этот момент победы у французов — от руководителей до граждан — есть общее желание как можно скорее прекратить состояние войны. Цель — снизить бремя военных расходов для общества и национальной экономики. Хотя опасения по поводу «саморазоружения» сохраняются, законопроекты о мирной реконструкции и демилитаризации Европы скоро будут представлены парламенту. Французский народ верит, что в эту новую эпоху приверженность миру и коллективная сила населения достаточны, чтобы предотвратить любые амбиции возрождения великих держав и агрессивную военную политику."
 FRA_End_Conscription:0 "Отменить призыв"
 FRA_End_Conscription_desc:0 "Призыв имеет долгую историю во Франции, веками обеспечивая стране сильную и готовую армию. Во времена кризиса обширный резерв обученных граждан служил ценной силой для решения неотложных задач. Недавний пример — война против России, где мобилизованные французские граждане показали замечательное мужество и приспособляемость на поле боя. Служба нации остаётся источником гордости, но мирные годы начала XXI века заставили французский народ задуматься об изменении обстоятельств. Модель «гражданской армии» больше не подходит для современной войны. Профессиональная армия теперь лучше оснащена для выполнения задачи защиты нации."
 FRA_Surrender_the_Military:0 "Уступить армию"
 FRA_Surrender_the_Military_desc:0 "Хотя наши политические руководители решили, что Франция должна строить вооружённые силы и формировать военную стратегию в рамках единой европейской обороны, генералы министерства обороны и генерального штаба остаются упорно сопротивляющимися. Цепляясь за свою гордость и корыстные интересы, они отказываются уступить даже малейшую часть власти, которой дорожат. В быстро меняющемся и всё более опасном европейском ландшафте мы не можем тратить время на споры с ними. Используя подход «кнута и пряника», мы решительно ограничим военные полномочия генералов для достижения наших целей, делая это с достоинством."
 FRA_VIC_surrendered_the_military_tt:0 "Это передаст нашу §Gвсю армию§! нашему верному союзнику [GER.GetFlag] Германии, а также создаст §Yэлитные силы§! для повседневной обороны."
 FRA_VIC_surrendered_the_military_tt_desc:0 ""
 FRA_Maintain_Military_Strength:0 "Поддерживать военную мощь"
 FRA_Maintain_Military_Strength_desc:0 "Министерство обороны и генеральный штаб убедили наших политических руководителей, что сохранение нынешнего размера вооружённых сил необходимо. Франция больше не может позволить себе сосредотачиваться только на собственных интересах. Восточная угроза не устранена полностью, в нескольких регионах Европы сохраняются конфликты, а войны продолжают бушевать в Северной Америке, Восточной Азии и на Ближнем Востоке, причиняя огромные страдания. Постоянная риторика пацифистов не служит реальным целям нации и может вернуть нас в опасные времена 1940 года. Сильная и дееспособная французская армия сможет ответить на любой вызов, демонстрируя, что идеалы «Свобода, Равенство, Братство» остаются столь же жизненно важными, как и прежде."
 FRA_National_Demobilization:0 "Национальная демобилизация"
 FRA_National_Demobilization_desc:0 "С точки зрения защиты суверенитета, безопасности и национальных интересов Франции нынешний размер армии чрезмерен — больше, чем необходимо. Тема значительного разоружения уже не нова во французской политике и обществе, и сегодня будет официально принят ряд соответствующих мер. Сокращая избыточность в армии, мы должны продолжать чтить и благодарить храбрых воинов, пожертвовавших собой ради свободы и справедливости. Одновременно мы ответственно решим вопросы ветеранов и построим более компактные элитные силы — закалённые в боях и способные к быстрому реагированию и выполнению задач."
 FRA_VIC_The_conservative_revolution:0 "Консервативная революция"
 FRA_VIC_The_conservative_revolution_desc:0 "Так называемый \"end of history\", обещанный нам либералами, ещё не наступил. Мир, который должен был прийти после краха СССР, так и не наступил. На самом деле мир сейчас гораздо более нестабилен, чем всего пару десятилетий назад. Вдобавок наша нация пострадала в современную эпоху, и люди хотят перемен. Поэтому они массово поддержали консерваторов, которые, вернувшись к власти, направят Францию на верный курс."
 FRA_VIC_Our_Bountiful_Economy:0 "Наша изобильная экономика"
 FRA_VIC_Our_Bountiful_Economy_desc:0 "Пандемия COVID и американский крах во многом способствовали нескольким годам слабого экономического роста. Однако с устранением российской угрозы и более тесной, чем когда-либо, европейской общностью наша экономика пережила бум. Теперь, когда нам не нужно беспокоиться о Востоке, мы можем обеспечить, чтобы этот период экономического процветания не был растрачен."
 FRA_VIC_Economic_Patriotism:0 "Экономический патриотизм"
 FRA_VIC_Economic_Patriotism_desc:0 "Наш недавний экономический рост можно объяснить только одним источником — тяжёлым трудом французского народа. Поэтому решения, которые могли бы выгодно сказаться на других странах ЕС, будут отложены в пользу тех, что выгодны нашему народу. Разумеется, мы не намерены уклоняться от обязательств перед европейскими братьями. Просто мы будем финансировать французский малый бизнес, а не румынский."
 FRA_VIC_Bask_in_the_Light:0 "Купаться в свете"
 FRA_VIC_Bask_in_the_Light_desc:0 "Наш тяжёлый труд полностью переломил нашу экономику, и теперь люди ощущают результаты. С увеличением государственного финансирования общественные услуги достигают новых высот. Малый бизнес и корпорации ощутили влияние наших субсидий и финансирования, а инфляция снизилась на несколько пунктов. Больше людей имеют крышу над головой и еду, и мы будем усердно работать, чтобы эта тенденция продолжалась!"
 FRA_VIC_The_French_Golden_Age:0 "Французский золотой век"
 FRA_VIC_The_French_Golden_Age_desc:0 "Весь наш тяжёлый труд увенчался этим моментом. Десятилетиями Франция была тенью самой себя, обременённая событиями XX века, и не казалось, что 2020-е будут лучше. Но затем чудо за чудом, и теперь мы можем уверенно сказать, что вернули себе место среди великих держав мира. Наш народ счастлив, наша армия сильна, наша экономика динамична. Что бы ни готовили следующие годы, мы встретим это лицом к лицу и обеспечим, чтобы наша нация оставалась единой и сильной!"
 FRA_VIC_Our_Native_Land:0 "Наша родная земля"
 FRA_VIC_Our_Native_Land_desc:0 "Франция существует давно, и, хотя она терпела лишения, мы всегда упорно трудились, чтобы сохранить нашу землю. Победой над русскими мы снова защитили её от вреда. Теперь мы можем обратиться внутрь и сосредоточиться на том, чтобы наша великая республика соответствовала своей репутации. Мы не успокоимся, пока наши земли не будут использоваться в полную силу и не станут такими прекрасными, какими должны быть."
 FRA_VIC_Spirit_of_Degaul:0 "Дух Шарля де Голля"
 FRA_VIC_Spirit_of_Degaul_desc:0 "Генерал де Голль — один из многих героев французской истории. Именно благодаря его усилиям наша родина была освобождена от фашистских захватчиков во Второй мировой войне и мы смогли так хорошо восстановиться после лет оккупации. Хотя он умер много лет назад, дух, который он воплощал, дух Франции, жив сегодня! Французская нация должна оставаться свободной, и для этого мы должны оставаться сильными!"
 FRA_VIC_For_Every_Drop_of_Blood:0 "За каждую каплю крови"
 FRA_VIC_For_Every_Drop_of_Blood_desc:0 "Победа в любой войне стоит дорого, и нас это не обошло. Многие наши молодые мужчины и женщины погибли в боях с российскими силами, отдав всё, чтобы отразить натиск. Они добились успеха, но их жертва ничего не будет значить, если мы её растратим. Мы должны использовать это мирное время, чтобы подготовиться к следующей большой войне и обеспечить, чтобы на этот раз мы потеряли как можно меньше французов."
 FRA_VIC_Revile_Russian_Autocracy:0 "Клеймить российское самодержавие"
 FRA_VIC_Revile_Russian_Autocracy_desc:0 "Хотя многие восхваляли итоги европейской войны как предвестие новой эпохи российской демократии, любой, у кого есть немного здравого смысла, понимает, что ничего не изменилось. Да, руководство сменилось, и страна больше не является откровенно экспансионистской, но в душе это всё та же Россия. Они вернутся рано или поздно, и до тех пор мы должны ослаблять их всеми возможными способами."
 FRA_VIC_Our_Free_People:0 "Наш свободный народ"
 FRA_VIC_Our_Free_People_desc:0 "Что такое Франция, как не нация свободных людей? Наша свобода терпела неудачи и испытания, но благодаря труду французского народа её надолго никогда не подавляли. Наша недавняя победа над Россией доказала, что стремление наших граждан к свободе не ослабло — они готовы сражаться, чтобы защитить её. Свет свободы здесь никогда не погаснет, мы сделаем всё для этого."
 FRA_VIC_The_France_of_Today:0 "Франция сегодня"
 FRA_VIC_The_France_of_Today_desc:0 "Франция имеет историю, уходящую на тысячу с лишним лет. От галлов до римлян, от Карла Великого до Наполеона — мы уже совсем не та нация, какой были. Но мы здесь не для разговоров о древней истории, всех интересует только настоящее. Франция сегодня — нация, которая постоянно стремится обеспечить своему народу лучшую жизнь, и пока консерваторы остаются у власти, это останется нашей целью."
 FRA_VIC_Denounce_Liberal_Authoritarianism:0 "Осудить либеральный авторитаризм"
 FRA_VIC_Denounce_Liberal_Authoritarianism_desc:0 "Враги бывают всех форм и размеров, со всех концов света, и логично, что некоторые есть и внутри наших границ. Ближайшая к дому угроза исходит от крайне левых. Коммунисты, анархисты и им подобные не желали бы ничего лучшего, чем разрушить нынешнюю политическую структуру и заменить её чем-то куда более отвратительным. Однако это будущее должно оставаться фантазией в их умах, ибо мы сделаем всё, чтобы оно не стало реальностью."
 FRA_VIC_The_Red_Banner:0 "Красное знамя"
 FRA_VIC_The_Red_Banner_desc:0 "Где будущее Франции? После разгрома восточных тиранов и российского режима — который не является ни «либеральным», ни «демократическим» — как Франция войдёт в эту новую историческую эпоху? Французский народ сделал выбор своим голосом: левая Великая коалиция получила неоспоримую правящую позицию. На этот раз она приходит к власти с дерзкой амбицией — принести фундаментальные изменения во французское общество и построить по-настоящему народное государство. Она полна решимости использовать свой мандат для проведения преобразующих реформ для Франции. Возможно, на нашем веку мечта о красных знамёнах над Европой действительно станет реальностью."
 FRA_VIC_United_in_Equality:0 "Едины в равенстве"
 FRA_VIC_United_in_Equality_desc:0 "«Равенство» — какое прекрасное слово. Оно было общим стремлением бесчисленных поколений. От «утопических» царств равенства, воспетых древними бардами, до великого общества, за которое боролись марксисты-коммунисты, идеал устранения всех идентичностных и классовых различий никогда не оставляли. Сегодня, принимая возрождение нашей французской родины, мы несём этот идеал вперёд, позволяя цветам равенства расцветать на земле свободы. Вдохновлённые духом бесчисленных мучеников, мы верим, что все граждане объединятся с беспрецедентной солидарностью, чтобы вложиться в это великое дело."
 FRA_VIC_Redefine_the_French_Citizen:0 "Переопределить французского гражданина"
 FRA_VIC_Redefine_the_French_Citizen_desc:0 "Что значит быть «французским гражданином»? У многих могут быть разные ответы: место рождения, язык, культура или даже этнос и раса. Определение идентичности француза — важнейший шаг в формировании современного национального государства. Сегодня новый ответ на этот вопрос сыграет ключевую роль в определении направления наших социалистических реформ. Только объединив наше понимание этого понятия, мы сможем создать прочную основу для продвижения дел, которые действительно идут на пользу народу. Поэтому мы примем во французскую семью любого гражданина, который отождествляет себя с французской культурой и ценит её, принимая всех людей, которые считают эту землю своим домом. С гордой историей, полной славных моментов, французский народ сделает первый шаг в новую эру."
 FRA_VIC_End_Neo_Colonialism:0 "Покончить с неоколониализмом"
 FRA_VIC_End_Neo_Colonialism_desc:0 "Неоколониализм, этот «Кракен», рождённый интересами мирового капитала, десятилетиями мучает народы мира. Число разорённых им стран и людей неисчислимо. Постыдно, что Франция, старшая дочь западной цивилизации, когда-то поддерживала злое дело угнетения народов других континентов. Мы искупим наши прошлые ошибки непоколебимой приверженностью. В сердце тёмного континента французские освободители принесут свободу и справедливость. Мы торжественно обещаем вложить все наши ресурсы и силы, чтобы вернуть достоинство и принести счастье нашим собратьям, так много страдавшим. На этот раз жестокие колонизаторы будут полностью уничтожены, и всеобщее солнце согреет всех."
 FRA_VIC_Revolution_without_Revolution:0 "Революция без революции"
 FRA_VIC_Revolution_without_Revolution_desc:0 "Наконец мы добились успеха. Пережив бесчисленные бури и познав и славу, и горе, колокола Нотр-Дама теперь звонят в честь великого дела французского народа. Жестокие и кровавые воспоминания о революции поблёкли. То, чего мы достигли на французской земле, теперь можно назвать «революцией без революции». Французы сбросили одежды старой эпохи и стали первопроходцами нового века. В этой великой стране, полной мечтаний, процветания, мира и дружбы, история вас и меня только начинается."
 FRA_VIC_Ground_Up_Army_Reform:0 "Реформа армии снизу"
 FRA_VIC_Ground_Up_Army_Reform_desc:0 "Престиж и уважение, которыми долго пользуется французская армия, часто воспринимались как должное. Однако более внимательный взгляд на её состояние открывает менее лестную картину. Если мы хотим продвинуть запланированные реформы, армия — первый крупный вызов, который нужно решить. Годами консервативные, реакционные взгляды и укоренившиеся иерархические структуры душили прогрессивные, народные голоса, ещё больше отдаляя армию от французского общества в целом. Поэтому мы должны полностью перестроить систему — смести старые порядки и вычистить пыль и мусор. Этот процесс неизбежно вызовет нестабильность и непредвиденные трудности. Но, как гласит старая поговорка, «не разбив яиц, не приготовишь омлет». С течением времени армия, более тесно объединённая с народом, откроет новую главу истории Франции."
 FRA_VIC_Compensate_the_Veterans:0 "Компенсировать наших ветеранов"
 FRA_VIC_Compensate_the_Veterans_desc:0 "Будет не преувеличением сказать, что красное социалистическое знамя сегодняшней Франции окрашено кровью бесчисленных воинов, храбро сражавшихся против восточных тиранов. Поэтому никакое уважение и благодарность этим героям не будут чрезмерными. Французское правительство выразит глубокую признательность ветеранам не только пропагандой, но и конкретными делами. Вышедшие на пенсию фермеры получат землю и техническую поддержку для улучшения жизни; честные рабочие, возвращающиеся в города и на заводы, получат щедрые льготы и гарантии занятости, обеспечивая счастье и покой тысяч семей. Мы докажем, что являемся более ответственным правительством, больше заботящимся о будущем наших национальных героев, чем буржуазные правительства прошлого. Яркая красная лента ордена Почётного легиона станет их высшим отличием."
 FRA_VIC_Demobilize_the_People:0 "Демобилизовать народ"
 FRA_VIC_Demobilize_the_People_desc:0 "Мешать или затыкать рот самостоятельной борьбе и законным требованиям народа — последнее, чего мы хотим. Это необходимо, чтобы мы могли называться «народным правительством». Реформа может стать реальностью только через самодеятельность всего населения. Если плоды социального прогресса не будут лелеяться и защищаться народом, они останутся лишь иллюзией. Когда заря мира расстилается над Францией и Европой, пора полностью снять все ощутимые и неощутимые кандалы, сковывавшие французский народ. Отрадно видеть, как французские рабочие раскрывают свою творческую инициативу, смело исследуют и стремятся вперёд и своими руками формируют образ свободной нации."
 FRA_VIC_Expand_the_Rights_of_Man:0 "Расширить права человека"
 FRA_VIC_Expand_the_Rights_of_Man_desc:0 "Как мы должны определять «права человека»? Некоторые утверждают, что права человека — это экономическое развитие и право на обеспеченную жизнь. Однако такой материалистический взгляд упускает законные духовные потребности народа. Другие сосредотачиваются на понятиях «свобода слова» и «культурное многообразие», но эти идеи часто становились политическим вопросом, порождая конфликты и раскол. Чтобы не повторять ошибок прошлого, мы должны предложить новое определение, соответствующее нынешним национальным условиям Франции и направляющее будущее французского народа. Права человека должны превзойти политические инструменты, и справедливость и принципы, отстаивавшиеся революционными борцами прошлого, возродятся в двадцать первом веке."
 FRA_VIC_Form_A_Pink_Red_Coalition:0 "Розово-жёлто-красная коалиция"
 FRA_VIC_Form_A_Pink_Red_Coalition_desc:0 "После многих лет борьбы за благополучие французского народа прогрессивные силы французских левых наконец могут расправить крылья и принести в страну свежий социалистический ветер, развеяв мрак старой эпохи. Чтобы добиться этого, на основе существующего партийного союза должна быть построена широкая и прочная правящая база. Новый народный фронт, состоящий в основном из LFI, PCF, PS и EELV, должен теперь укрепиться, поглотив другие проправительственные левые партии, чтобы усилить свою мощь и внутреннее единство. Одновременно он должен улучшить механизмы коммуникации и сотрудничества, став лучшим каналом для представления народа и выражения его голоса. Для Нового народного фронта эта новая эпоха знаменует начало обновлённой борьбы. Однако при твёрдой поддержке французского народа все вызовы и препятствия можно преодолеть."
 FRA_VIC_The_Left_Prevails:0 "Левые побеждают"
 FRA_VIC_The_Left_Prevails_desc:0 "Были те, кто сомневался, что настоящий социализм сможет найти место в сегодняшней Европе. Даже когда партия, называвшая себя социалистической, приходила к власти, её часто возглавляла мелкая буржуазия, смешивавшая неолиберальные идеи и кланявшаяся крупному капиталу и корыстным интересам в обмен на сотрудничество. Но во Франции сегодня подобные речи — дело прошлого. Благодаря нашей победе над российским диктатором, законной победе на выборах и проведению смелых социальных реформ левый альянс во Франции стал подлинной силой французской политики, снискав искреннюю и горячую поддержку народа и преуспев во многих областях. Даже если остатки старого порядка откажутся признать поражение и попытаются подорвать наше дело, французский народ этого никогда не допустит."
 FRA_VIC_Peace_Land_and_Bread:0 "Мир, земля и хлеб"
 FRA_VIC_Peace_Land_and_Bread_desc:0 "Для среднего француза счастливая жизнь может означать много прекрасного или просто включать несколько самых дорогих и необходимых потребностей. «Мир, земля и хлеб» — этот древний лозунг, передаваемый со времён Французской революции, прошёл через две мировые войны и остаётся актуальным сегодня. Он показывает, что даже самые глубокие страдания не могут уничтожить надежды и мечты поколений. Как представители и верные слуги французского народа, мы обеспечим, чтобы эти вещи больше никогда не ускользнули от него. Это не только отражение истории, но и наше смелое заявление о будущем."
 FRA_VIC_The_Republic_Eternal:0 "Республика вечна"
 FRA_VIC_The_Republic_Eternal_desc:0 "Сказать, что история Франции всегда была бурной, — значит ничего не сказать. От революций до чисток и оккупаций — периоды стабильности редки. И, как опасался Черчилль в эпоху холодной войны, российская угроза двинется на запад, угрожая растоптать восточноевропейскую демократию и восстановить свою власть на европейском континенте. Но мы не стояли в стороне. Мы твёрдо противостояли российскому самодержавию. Мы не отступали перед непреодолимыми трудностями. Теперь, когда пыль оседает и орудия замолкают, мы торжествуем над тиранией. Плечом к плечу с союзниками мы спасли Францию и Европу от разрушения. Мы смотрим в будущее, готовые встретить всё, что придёт. Уверенные, что Республика будет существовать вечно, что бы ни случилось."
 FRA_VIC_Divided_by_Ideas:0 "Разделённые идеями"
 FRA_VIC_Divided_by_Ideas_desc:0 "Сказать, что Европа — огромный континент идей, — значит ничего не сказать. От «Левиафана» до «Манифеста коммунистического» континент был родиной многих идеологий, существующих и сегодня. На протяжении истории великие империи и мировые державы пытались навязать Европе одну объединяющую идеологию — от эпохи абсолютизма до железного занавеса холодной войны. Но почему мы должны навязывать свой путь остальной Европе? Мы должны принять Европу такой, какая она есть. Это гобелен не только наций, но и идей, где каждый может принять свои идеи и идеологии, свободный от осуждения. "
 FRA_VIC_Past_the_Darkness:0 "Сквозь тьму"
 FRA_VIC_Past_the_Darkness_desc:0 "Когда Соединённые Штаты рухнули, многие использовали их беду, чтобы заявить, что наши драгоценные либеральные демократии все на грани краха, обречены на застой и свержение радикальными силами. Однако наш триумф над самозваными российскими тиранами и их стремлением поработить Восточную Европу доказал, что эти скептики ошибались. Конечно, у нас всё ещё много проблем как внутри страны, так и на международном уровне. Однако наши ценные либеральные системы по-прежнему опираются на идеи обсуждения и демократического принятия решений, которые гарантируют, что какие бы бури мы ни переживали, мы можем решать их наилучшим для всех образом."
 FRA_VIC_Onto_the_Light:0 "К свету"
 FRA_VIC_Onto_the_Light_desc:0 "Мрак, принесённый пандемией, и бедствия 2020-х не прошли мимо нас. Однако мы уже противостояли силам тирании и снова противостояли им даже без наших американских благодетелей. Наш оптимизм, когда-то названный глупым и ошибочным, позволил нам выйти из кризисов, которые обрушила на нас декада, ещё сильнее, чем прежде. Изменение настроений в стране способствовало большей политической активности, более высокой рождаемости и готовности нашего народа сражаться и умирать за свои идеалы даже против непреодолимых сил. Пусть это будет эпоха, в которой мы наконец принесём торжество либеральной демократии над силами авторитаризма и угнетения. "
 FRA_VIC_The_French_Shining_Bright:0 "Сияющая Франция"
 FRA_VIC_The_French_Shining_Bright_desc:0 "Мы прошли долгий путь не только как нация, но и как единый французский народ за последние годы. Многие думали, что наша страна, борющаяся с проблемами внутренней политики и ослабевающим международным влиянием, скоро будет обречена на радикальную смену режима или подчинение иностранным державам. Однако теперь мы показали миру, что значит быть французом, сохраняя при этом учтивость и компромисс, ожидаемые от настоящей либеральной демократии. Наши главные экономические беды решены, дух укреплён пламенем битвы и братской борьбой против сил зла, при этом мы не поддались соблазнам популистской демагогии. Будем же и дальше следить, чтобы Франция оставалась маяком либерализма, маяком, которым гордились бы наши предки, взявшие Бастилию и покончившие со Старым порядком, если бы могли увидеть её сегодня. С этим давайте и дальше оставаться благодетелем единой Европы, способной противостоять силам тирании и обеспечивающей, чтобы каждая нация, независимо от размера и силы, вместе чувствовала себя непобедимой перед любыми угрозами.\n\nВажно отметить, что в момент нашего триумфа вести с Востока говорят о России, которая зализывает раны в подготовке окончательно погасить наши демократии. Мы прекрасно знаем, что если наша нация — свет, который она проливает на континент и остальной мир — потускнеет, то мы окажемся во власти тиранов ещё хуже тех, с которыми столкнулись в европейской войне. Они не окажут нам ту же \"mercy\", которую были готовы оказать в предыдущей войне, и нам придётся встретить их потоки авторитарной ярости ослепительным светом свободы, который мы излучали веками. Позаботимся о том, чтобы, когда мы вновь встретим восточных тиранов, они были отброшены оглушительным криком, который звучал и будет звучать в веках…\n\n§B\"VIVE LA FRANCE!\"§!"
 FRA_VIC_Fraternity_of_Nations:0 "Братство народов"
 FRA_VIC_Fraternity_of_Nations_desc:0 "Европейское единство — странный концепт, горячо поддерживаемый одними и отвергаемый другими. Однако в тёмные времена именно коллективная сила европейских наций победила зло. Будь то уничтожение нацистской империи Гитлера или наша недавняя победа над жаждущим войны русским медведем — если бы мы не объединились, чтобы победить тиранию, нас разделили бы и перебили по одному. Но война ещё не окончена. Хотя мы, возможно, задержали продвижение России, Москва зализывает раны и готовит месть. И если мы не укрепим нашу приверженность коллективной безопасности, они захлестнут нас и уничтожат всё, что мы построили."
 FRA_VIC_Cement_our_place_in_Europe:0 "Наша континентальная роль"
 FRA_VIC_Cement_our_place_in_Europe_desc:0 "Даже если русским подрезали клыки, мы должны помнить о той роли, которую играем в защите нашего континента. У нас не только одна из самых мощных армий во всей Европе, но и наша промышленная база служит опорой, на которую могут рассчитывать еврозона и единый европейский рынок. В связи с этим укрепление этих систем позволит нам не только закрепить своё положение защитника европейских ценностей, но и обеспечит усиление нашего влияния, чтобы стоять наравне с такими странами, как Германия и Великобритания, в качестве лидеров Европы. К тому же, если мы не справимся с этим долгом, кто поручится, что возрождающаяся Россия или иная сила тирании не угасит драгоценную свободу и общее братство нашего континента?"
 FRA_VIC_Europe_United:0 "Европа, единая"
 FRA_VIC_Europe_United_desc:0 "Войну, из которой мы только что вышли, часто называют \"европейской войной\" — той, в которой мы, как континент, противостояли натиску российской тирании без помощи американцев, которых многие называли нашей единственной линией обороны. Мы доказали, что вместе, как единый континент, мы можем и будем противостоять любой угрозе на нашем пути. В связи с этим мы должны обеспечить, чтобы такие организации, как Европейский союз, получали необходимую поддержку для большей европейской сплочённости и сотрудничества, что уже принесло плоды в недавней истории. Не доходя до степени некоторых федералистов, продвижение дальнейшей экономической и военной интеграции будет необходимо, чтобы наш континент смог выдержать надвигающуюся бурю возрождающейся России или иных угроз, стремящихся навязать свою волю нашим драгоценным демократиям."
 FRA_VIC_Strong_in_our_Resolve:0 "Твёрдость нашей решимости"
 FRA_VIC_Strong_in_our_Resolve_desc:0 "Последние годы научили нас тому, что в мире, в котором мы живём, нет места самоуспокоенности. Если бы нам не удалось провести ремилитаризацию, отсутствие американской поддержки в НАТО оставило бы нас беззащитными перед натиском с востока, что, вероятно, привело бы к гибели либеральной демократии в Европе. Однако наша решимость в противостоянии этим угрозам, как внутренним, так и международным, показала, что мы можем и будем противостоять этим геополитическим угрозам. И всё же теперь мы видим, как многие снова впадают в самодовольное превосходство в свете нашей победы, полагая, что наш триумф над русским медведем станет последним, с которым нам придётся столкнуться. Но даже в победе мы должны оставаться твёрдыми в своей решимости, готовыми и желающими противостоять не только угрозам с Востока, но и угрозам в других частях мира. Если мы этого не сделаем, то окажемся в руках тиранов ещё хуже тех, с которыми мы только что столкнулись, — судьба, ради предотвращения которой стоит умереть."
 FRA_VIC_United_in_Liberty:0 "Едины в свободе"
 FRA_VIC_United_in_Liberty_desc:0 "Свобода подобна неугасимому пламени. Однажды зажжённое, его нельзя погасить, можно лишь притушить. Понятие свободы восходит к великим философам, таким как Джон Локк, который считается отцом либерализма и чьи труды способствовали разжиганию пламени, приведшего к Французской революции. Побеждая тиранию и деспотизм, мы должны трудиться ради осуществления мечты Джона Локка. Под нашим руководством свобода воссияет над всей Европой. Угнетённые будут освобождены, а угнетатели познают нашу праведную месть. И когда мы закончим, демоны тирании и ненависти будут изгнаны в тень до конца времён."
 FRA_VIC_Utmost_Equality:0 "Предельное равенство"
 FRA_VIC_Utmost_Equality_desc:0 " Наша любимая республика прошла через многие формы правления, но с 1791 года мы всегда старались сохранить основополагающие идеалы свободы, братства и особенно равенства. Хотя наши законы смогли установить юридическое равенство, многие всё ещё жалуются на отсутствие экономического или социального равенства, особенно среди маргинализованных групп. Теперь, когда наши главные проблемы на международной арене на время решены, мы должны обратиться к этим случаям неравенства в нашем обществе. Радикалы могут кричать и вопить, но наши действия могут и будут говорить громче их мелких слов, если мы будем подчёркивать предельное равенство среди наших граждан. Поступая так, мы не только пожнём электоральные плоды, но и оправдаем то имя, которого Французская республика требует со времён Робеспьера."
 FRA_VIC_The_End_of_History:0 "Конец истории"
 FRA_VIC_The_End_of_History_desc:0 "Когда Советский Союз распался и мир, казалось, вступал в эпоху мира и процветания, это породило образ мышления, благоприятствовавший возвышению либеральной демократии как системы, наилучшим образом подходящей человеческой цивилизации. В 1992 году Фрэнсис Фукуяма опубликовал свою основополагающую работу \"The End of History and the Last Man\", в которой подразумевал, что падение тоталитарного коммунизма ознаменовало начало конца истории, какой мы её знали. Однако со сменой тысячелетия и растущим хаосом, вызванным войной с терроризмом, финансовым кризисом 2008 года и особенно крахом Соединённых Штатов, многие осмеяли его теорию как просто прекраснодушные мечтания, обычные для того времени. Однако наше сопротивление силам российской тирании заставило многих взглянуть на теорию Фукуямы во второй раз — быть может, под нашим знаменем мы довели до совершенства и закрепили либеральную демократию как руководящую идеологию Европы в XXI веке. Поэтому мы должны осознать себя представителями фукуямовской мысли, теми, кто принесёт эпоху либерализма, которая превзойдёт Соединённые Штаты и в конечном счёте объединит мир под знаменем демократии, которое не угасят кризисы, с которыми мы сталкиваемся.\n\nМы не должны и не можем отдыхать, пока каждый человек, где бы на этой планете он ни находился, не освободится от авторитаризма. Положим конец истории, для которой страдания и раскол стали обыденностью, и начнём новую, которая превыше всего ценит свободу, равенство, братство!"
 FAF_petainism_fascism:0 "Вишистский петенизм"
 FAF_classical_fascism_desc:0 "\n\n\n\n£GFX_FAF_petainism\n\n\n\n\n\n§YВишистский петенизм§! стремится примирить коллаборационистский режим Французского государства Филиппа Петена с его идеалами, в частности с Национальной революцией. Характеризуясь антипарламентаризмом, культом личности, продвижением традиционных ценностей и государственным антисемитизмом, он видит во Французской республике прогнившую и несостоятельную систему, воплощающую концепцию Шарля Морраса о «Анти-Франции», которая ставит иностранные интересы превыше всего. Находя поддержку в маргинальных кругах французских крайне правых, фашистский петенизм надеется свергнуть нынешнюю либеральную демократию, которая, по их мнению, разрушила красоту и идеалы дореволюционной Франции. Через идеалы Труда, Семьи и Отечества фашистские петенисты проведут Францию через их идеализированное возрождение, даже если она будет брыкаться и кричать в процессе."
 FAF_petainism_junta:0 "Сопротивляющийся петенизм"
 FAF_military_junta_desc:0 "\n\n\n\n£GFX_FAF_junta_petainism\n\n\n\n\n\n§YСопротивляющийся петенизм§! лучше всего описать как более циничную и умеренную ветвь петенистской мысли. Хотя их приверженность идеалам Национальной революции Петена может варьироваться, они всё ещё верят в общие антипарламентские идеалы бывшего Французского государства. Находя поддержку среди французских генералов, наиболее вероятным путём к власти для них стало бы полное поражение или национальный крах, который позволил бы появиться новому главе Французского государства, чтобы снова вести Францию к её былой славе — даже перед лицом полного и абсолютного поражения."
 FAF_gaullism_auth_dem:0 "Сопротивляющийся голлизм"
 FAF_military_democracy_desc:0 "\n\n\n\n£GFX_FAF_resistant_gaullism\n\n\n\n\n\n§YСопротивляющийся голлизм§!, в отличие от самодовольных и приверженных демократии форм голлизма, полагает, что сильный военный вожак необходим для обеспечения стабильности Французской республики в час нужды. Находя свою базу среди офицеров и генералов французской армии, наиболее вероятный путь прихода Сопротивляющегося голлизма к власти — если демократически избранные партии Франции попытаются оттеснить или проигнорировать заботы Вооружённых сил Франции. Хотя некоторые могут называть это ужасной диктатурой или необходимой политической опекой, сопротивляющиеся голлисты обеспечат выживание Пятой республики любыми необходимыми средствами."
 FAF_sovereign_democracy_desc:0 "\n\n\n\n£GFX_FAF_resistant_gaullism\n\n\n\n\n\n§YСопротивляющийся голлизм§!, в отличие от самодовольных и приверженных демократии форм голлизма, полагает, что сильный военный вожак необходим для обеспечения стабильности Французской республики в час нужды. Находя свою базу среди офицеров и генералов французской армии, наиболее вероятный путь прихода Сопротивляющегося голлизма к власти — если демократически избранные партии Франции попытаются оттеснить или проигнорировать заботы Вооружённых сил Франции. Хотя некоторые могут называть это ужасной диктатурой или необходимой политической опекой, сопротивляющиеся голлисты обеспечат выживание Пятой республики любыми необходимыми средствами."
 FAF_gaullism_conservative:0 "Популистский голлизм"
 FAF_right_populism_desc:0 "\n\n\n\n£GFX_FAF_populist_gaullism\n\n\n\n\n\n§YПопулистский голлизм§! синтезирует национализм и установку «мир через силу» более традиционных форм голлизма с волной правого популизма XXI века. Хотя голлизм в своей основе всё ещё продвигает такие идеи, как французская исключительность, последователи популистского голлизма видят в восстановлении идеологии вожделенный «возврат к традиции», связанный со многими популистскими движениями, существующими в геополитическом «Западе». Хотя некоторые могут утверждать, что эта политизация прагматичной идеологии предаёт основополагающие идеалы «Освободителя Франции», последователи популистского голлизма не остановятся ни перед чем, чтобы от Атлантики до Урала именно Франция решала судьбу мира."
 FAF_gaullism_marlib:0 "Традиционный голлизм"
 FAF_civic_nationalism_desc:0 "\n\n\n\n£GFX_FAF_traditional_gaullism\n\n\n\n\n\n§YТрадиционный голлизм§! — это подраздел голлистской мысли, который по сравнению с другими подчёркивает национальные ценности, считая их одним из существенных аспектов французской идентичности, которые наряду с институтами Республики должны быть защищены. В отличие от популистского голлизма, он больше соответствует классическим идеалам гражданского национализма, чтобы усилить движение, а не следовать новым тенденциям правого популизма, ставшим более распространёнными в XXI веке. Находя поддержку среди более умеренных французских правых, они надеются обеспечить мир, в котором Франция сохраняет традиционные ценности, но при этом сдерживает другие мировые «сверхдержавы»."
 FRA_socialist_souverainism:0 "Социалистический суверенизм"
 FRA_national_souverainism:0 "Национальный суверенизм"
 FRA_patriotic_republicanism:0 "Патриотический республиканизм"
 FRA_popular_front:0 "Народный фронт"
 FAF_camus_eurasianism:0 "Паневропейский национализм"
 FAF_eurasianism_desc:0 "\n\n\n\n£GFX_FAF_nationalist_europeanism\n\n\n\n\n\n§YПаневропейский национализм§! отходит от общих проевропейских настроений своим полным отвержением либерализма, проповедуемого Европейским союзом. Вместо этого он использует основу «европейской цивилизации», состоящей из белых христиан с общей историей и культурными ценностями. Проистекая из идеалов «Europe A Nation» Освальда Мосли, паневропейский национализм остаётся подспудным непрерывным течением мысли внутри европейских крайне правых, особенно по мере продолжения федерализации Европейского союза. Представленные лямбдой на древних спартанских щитах, паневропейские националисты верят, что своими объединёнными усилиями они смогут спасти своё представление о Европе от натиска XXI века."
 FAF_bonapartist_thought:0 "Бонапартистская мысль"
 FAF_carolingian_fascism:0 "Каролингский фашизм"
 FAF_neonazism_desc:0 "\n\n\n\n£GFX_Ideology_carolingian_fascism\n\n\n\n\n\n§YКаролингский фашизм§! — это эзотерическая, бешеная и эклектичная форма французского национализма, принятая Лафайетом и его последователями. Укоренённые в основах национал-социалистической идеологии, они верят, что представители «иудео-германской расы» — недочеловеки, тянущие вниз культуру Европы, сочувствующие коммунарскому вырождению и пытающиеся увлечь за собой весь мир. Кроме того, это учение черпает вдохновение в идеях Франкии, полагая, что для французского Lebensraum необходима более великая Франция, охватывающая границы империи Карла Великого.\nМногие описали бы внутреннее устройство идеологии Лафайета как секту, напрямую следующую его слову и его видению как закону. Сама основа идеологемы постоянно меняется и сдвигается, день за днём, час за часом. Незыблемы лишь убеждения о французском превосходстве и ненависть к тем, кого они считают недочеловеками."
 FAF_lafayette_death_cult_idea:0 "Культ Верховного маршала"
 FAF_death_cult_desc:0 "\n\n\n\n£GFX_FAF_cult_of_lafayette\n\n\n\n\n\n§YКульт Верховного маршала§! — это культ личности, посвящённый покойному маршалу французской армии Лафайету, исчезнувшему во время осады Парижа. Идеология основана на крайнем национализме и французской исключительности, но в ней также распространены аспекты национал-социализма. Самое значительное отличие культа Лафайета от других крайне правых идеологий Европы — его антигерманская риторика, напрямую наследованная от убеждений Лафайета. Похоже, их ненависть к немцам может сравниться лишь с их отвращением к русским. Единственная проблема, с которой сталкивается группа, — отсутствие настоящего идеологического путеводителя. Из-за неопределённой судьбы Лафайета сторонники этой идеологии не имеют единого мнения о будущем Европы и Франции. Единственное несомненное — их непоколебимая верность и вера в Лафайета."
