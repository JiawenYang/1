 FAF_solidarite_latine_idea:0 "Латинская солидарность"
 FAF_solidarite_latine_idea_desc:0 "Латинский народ — это гегемония, которая должна расправить крылья над всей Европой, сражаясь как единое целое и как памятник нашей истории и культуре. Враги латинства многочисленны, сильны и решительны. Однако, как уже сказано, они не более чем варвары, коварно стремящиеся разрушить стены цивилизации, с которыми мы, потомки Рима, должны бороться кровью и землёй."
 FAF_convene_latin_congress_decision:0 "Созвать латинский конгресс"
 FAF_convene_latin_congress_decision_desc:0 "Мы — государство для всех великих латинских народов, и чтобы наш новый империя не оказалась, например, под господством французов, мы должны обеспечить каждому латинскому брату империи своё представительство. Для этого мы созовём великие латинские конгрессы, где все латинские братья получат справедливое представительство."
 FAF_Imperial_Palace_idea:0 "Императорский дворец"
 FAF_Imperial_Palace_idea_desc:0 "Дворец — знак стабильности, богатства и процветания. Символ Франции и её монархии, он является доказательством того, что она пребудет в веках. Это показная демонстрация нашего богатства и власти над континентом, бриллиант на её кольце."
 FAF_invading_balkans_tt:0 "§YЭта национальная задача даст цели войны против всех балканских государств.§!"
 FAF_the_grand_council_idea:0 "Великий совет фашизма"
 FAF_the_grand_council_idea_desc:0 "Политическая система Франции вновь оказалась неэффективной мешаниной. Подобно прежней династии Бурбонов, её нужно ниспровергнуть и создать новую систему. С более смелым и решительным правительством Франция отстроится и вновь обретёт былую славу. Жалкая работа демократии будет заменена жизненной силой фашизма. Сильное руководство — единственный способ добиться настоящих перемен и настоящих реформ, а не голосование и дебаты. Мы сформируем новый орган власти по образцу Великого совета фашизма в Италии, открывая новую эру процветания для нашей нации."
