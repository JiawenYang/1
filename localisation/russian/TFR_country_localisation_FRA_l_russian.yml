 FAF_improve_gallarum_decision:0 "Восстановить §GGalliarum§!"
 FAF_improve_gallarum_decision_desc:0 "Хотя Galliarum, которую большинство называет Северной Францией, имела преимущество самой развитой нашей области, её не пощадили ужасы гражданской войны. Уже подвергшаяся русским бомбардировкам во время войны на Востоке, Galliarum была выведена из строя, пока либеральные и коммунистические стервятники грабили её до нитки. Теперь, когда у нас есть ресурсы, мы должны начать восстановление всего региона. Без этого не только наши промышленные возможности не позволят объединить нашу драгоценную Европу, но и подрывные элементы смогут использовать трудности нашего народа, чтобы радикализировать его и толкнуть к мятежу."
 FAF_improve_viennensis_decision:0 "Восстановить §OViennensis§!"
 FAF_improve_viennensis_decision_desc:0 "За регион, где Цезарь начал цивилизовать галлов, Viennensis (в просторечии — Южная Франция) долго страдала ещё до того, как гражданская война разорвала нашу страну. Не имея большой части экономического развития нашего севера, эти регионы страдают от бедности и потому стали рассадниками радикалов, желающих снова ввергнуть нашу страну в хаос. Поскольку это наш долг перед народом любимой Франции, мы должны предпринять массовые усилия по возрождению, чтобы Viennensis восстала из пепла, как феникс!"
 FAF_improve_hispanarium_decision:0 "Восстановить §YHispanarium§!"
 FAF_improve_hispanarium_decision_desc:0 "Наше воссоединение с братьями к югу от Пиренеев означало, что мы наследовали ущерб от их второй гражданской войны. По сравнению с нашими братьями во Франции и Италии мы должны понимать, что восстановление должно учитывать множество региональных идентичностей на территории Испании и не повторять наших ошибок Пиренейской войны. Хотя это потребует значительных усилий, мы не пожалеем их ни для одного потомка Рима!"
 FAF_improve_italiae_decision:0 "Восстановить §RItaliae§!"
 FAF_improve_italiae_decision_desc:0 "Когда-то бьющееся сердце Европы. Когда-то маяк надежды, принёсший золотой век прогресса, просвещения и процветания. Но с падения Западной Римской империи в V веке Италия так и не вернула себе по-настоящему то великолепие, которое имела в античности. Поэтому именно нам предстоит восстановить полуостров, свободный от провалов дряхлой либеральной демократии, чтобы он наконец смог достичь высот, от которых покраснел бы сам Август. Говорят, Рим строился не один день, но если его слава сияет вечно, то наши усилия получат время и внимание, необходимые для продолжения этого наследия."
 FAF_Quadrilingual_Unification_dyanmic:0 "Язык братьев"
 FAF_Quadrilingual_Unification_dyanmic_desc:0 "Пожалуй, величайший позор построманской европейской истории — медленное и мучительное угасание латыни. То, что некогда служило объединяющей силой для всей империи, теперь используется как официальный язык лишь католическим духовенством. Не помогает и то, что века раздробленности после падения Рима привели к вырождению латыни в отдельные романские языки. В рамках наших усилий по объединению европейского континента мы должны взять на себя тяжёлый труд возвращения латыни в качестве обычной лингва франка. Хотя наши романские братья готовы к этим усилиям, мы должны помнить, что, как и Рим, массовое принятие латыни не совершится за один день."
 FAF_Quadrilingual_Unification_idea:0 "Язык братьев"
 FAF_Language_of_the_State_decision:0 "Отменить государственный язык"
 FAF_Language_of_the_State_decision_desc:0 "Одно из главных препятствий для принятия латыни нашим народом — то, что у нас есть один национальный язык, французский. Это может шокировать наши управленческие и политические классы, но лишение его привилегированного статуса и уравнение с нашими признанными официальными языками может стать хорошим стимулом для граждан к изучению латыни. Кроме того, это поможет гарантировать, что когда Европа наконец объединится, наше знамя не будет выглядеть просто ещё одним случаем французского империализма."
 FAF_managerial_bilingualism_decision:0 "Двуязычие управленцев"
 FAF_managerial_bilingualism_decision_desc:0 "Одно из главных оправданий нашего латинского возрождения — идея, что когда мы объединим народы Европы, латынь сможет служить лингва франка, обеспечивающим, несмотря на различия, плавное управление. С учётом этого мы должны обеспечить, чтобы наши управленческие классы, занятые бюрократической работой, были как минимум двуязычными — в родном языке и в латыни. Впрочем, не будем ли мы лицемерами, если сами не используем язык наших драгоценных римских предков?"
 FAF_the_failures_of_AH_decision:0 "Провалы [AUS.GetFlag] Австро-Венгрии [HUN.GetFlag]"
 FAF_the_failures_of_AH_decision_desc:0 "Одной из главных проблем Австро-Венгерской империи было неправильное управление её культурными меньшинствами: оставаясь европейскими, они подвергались культурному господству со стороны правивших ими австрийцев. Мы ни в коем случае не можем воспроизводить этот исторический пример. Мы должны найти общие решения наших проблем и, как великий народ всей Франции, двигаться к цели, в которой найдём утешение."
 FAF_Academic_Latinization_decision:0 "Академическая латинизация"
 FAF_Academic_Latinization_decision_desc:0 "Сколько бы мы ни заявляли, что наш народ «должен выучить латынь ради блага Европы» и что он исполнит свой патриотический долг, при нынешнем состоянии образования этот процесс будет трудным. Помимо языковых занятий, курсы, которые должным образом преподают латынь, не являются обязательными, а программы строятся вокруг региональных языков, что мало побуждает изучать язык сверх базового уровня. Это потребует масштабной академической перестройки, но мы должны собрать наших лучших латинских учёных, чтобы помочь составить новую программу, гарантирующую, что латынь будет тщательно преподаваться и использоваться нашим народом. Что важнее всего: если молодёжь — наше будущее, то такая система означает, что пройдёт всего несколько десятилетий, прежде чем латынь снова станет обычной в Европе!"
 FAF_our_ancestral_battlefield_decision:0 "Наши поля битв предков"
 FAF_our_ancestral_battlefield_decision_desc:0 ""
 FAF_the_roman_way_decision:0 "Римский путь"
 FAF_the_roman_way_decision_desc:0 "Когда спрашивают о Риме, многие скажут, что это была огромная и могущественная империя, но мало кто может точно сказать, что сделало Рим великим. Любая заурядная нация может построить империю, но Рим отличала непоколебимая воля, выкованная в крови и грязи. Как наследники Рима, мы предназначены восстановить то, что было утрачено, разрушено и забыто века назад. Римский орёл снова будет парить над Европой, от Иберии до Италии, и его крики будут отзываться в европейских небесах."
 FAF_enforce_imperial_language_decree_decision:0 "Указ об имперском языке"
 FAF_enforce_imperial_language_decree_decision_desc:0 "Итальянский, испанский и французский — три разных языка, но у всех одни корни: латынь. Их общая мать, ныне почти забытая и покинутая собственными детьми. Без единого языка наш Рим стал бы подобен Вавилонской башне — пустой постройке, питаемой хаосом и безумием. Ещё раз латынь станет языком цивилизованных людей, кровных братьев, римлян."
 FAF_demand_spanish_unification_decision:0 "Требовать [SNS.GetFlag] объединения Испании"
 FAF_demand_spanish_unification_decision_desc:0 "Одна мысль о том, что прекрасные заросли и пышные леса Иберии когда-то были частью нашей процветающей Римской империи, несомненно наполняет гордостью и радостью. Но всё это кажется таким далёким, в безвозвратно ушедшем прошлом, умершем вместе с нашими предками. У нас и испанцев были разногласия на протяжении нашей общей истории, но кровь, текущая в наших жилах, в конечном счёте связывает нас. Мы были созданы, чтобы быть друзьями и братьями, а не врагами. Испанцы, возможно, забыли об этом, но мы им напомним."
 FAF_demand_italian_unification_decision:0 "Требовать [ITA.GetFlag] объединения Италии"
 FAF_demand_italian_unification_decision_desc:0 "Семья неполна без всех своих членов, а для римской семьи Италия незаменима. В конце концов, где родилось само понятие Рима? Без Италии наш Рим был бы неполным — лишь пустой подделкой, созданной шарлатанами и самозванцами. Рим без Рима — как завтрак без кофе и сигареты: всё кажется совершенно неправильным. Поэтому мы должны заставить итальянцев увидеть наше видение. Мы должны..."
