 FAF_heirs_of_charlamagne_cat:0 "Наследники Карла Великого"
 FAF_heirs_of_charlamagne_cat_desc:0 "\n\n\n\n\n£GFX_FAF_monarchism_cat\n\n\n\n\n\n\n\nТысячу лет династия Капетингов правила с честью и достоинством землями Франции, определяя, что значит быть европейской державой, и защищая её честь, когда коварный Альбион или жалкие Габсбурги пытались стереть нашу нацию с лица Земли Божьей. Но наш Король, опираясь на божественное дозволение Бога, снова и снова защищал нашу страну. Но однажды всё изменилось. \nБлагодаря нашей помощи американским революционерам их раковые идеи республиканизма распространились во Франции и быстро свергли нашу монархию в час нужды. Двести лет спустя, стоя прямо после поражения от России, мы видим, к чему ведёт мир, отданный во власть «простого человека»... Америка в руинах, социалистическая чума охватила Восточную Европу, едва не обрекая нашу любимую Францию на красную тиранию. \n\nМы будем сражаться зубами и когтями против дестабилизирующих сил, стремящихся свергнуть нашего Богом поставленного Монарха. \n\nVIVE LA FRANCE! VIVE LE ROI LOUIS XX!"
 FAF_growing_republican_army_corps_mission:0 "Вечный огонь"
 FAF_growing_republican_army_corps_mission_desc:0 "\n\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\n\n\nВ блёклом эхе нашего прошлого в наших Войсках существует республиканская клика. Она одержима желанием уничтожить не только Короля, но и права Церкви. 1793 год не должен повториться."
 FAF_royal_house_squabbles_mission:0 "Королевские раздоры"
 FAF_royal_house_squabbles_mission_desc:0 "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\nВопрос о том, кто обладает божественным правом править Францией, не должен вызывать сомнений, но он их вызывает, и пока наша власть не утвердится, нам приходится терпеть ребяческие склоки, подрывающие нашу способность управлять."
 FAF_nobility_cost_mission:0 "Цена стабильности"
 FAF_nobility_cost_mission_desc:0 "\n\n\n\n\n£GFX_FAF_nobility\n\n\n\n\n\n\n\nВнутренние распри знати угрожают нашему режиму, но знать подобна любому классу элиты в любой стране: деньги делают её счастливой, а счастливые элиты — счастливая страна. Назовите это жадностью, но они владеют землёй по древним и божественным правам, правам, которые нам стоит уважать, чтобы они уважали наши."
 FAF_Grant_Refuge_to_HRM:0 "Семейное убежище"
 FAF_Grant_Refuge_to_HRM_desc:0 "\n\n\n\n\n£GFX_FAF_spanish_royalty\n\n\n\n\n\n\n\nНаша семья в Испании, законные Бурбоны, правители нашего южного соседа, осаждена всевозможными врагами: анархистами, сецессионистами, националистами, республиканцами. Было бы неправильно оставить их на гильотину — у нас, Бурбонов, было слишком много встреч с этой ужасной машиной."
 FAF_use_wealthy_connections_decision:0 "Использовать связи с богачами"
 FAF_use_wealthy_connections_decision_desc:0 "Наши связи с французской элитой дают нам уникальное преимущество: мы можем вытягивать услуги в поддержку национальных проектов. Ценой долга перед одним дворянином мы можем на время расширить производство — выгодный обмен."
 FAF_pay_for_the_arts_decision:0 "Покровительство искусству"
 FAF_pay_for_the_arts_decision_desc:0 "\n\n\n\n\n£GFX_FAF_patronage_of_the_arts\n\n\n\n\n\n\n\nИскусство всегда было сердцем и душой нации, формируя культуру. Классическая эпоха и Ренессанс считаются золотыми веками искусства, и это заслуга широкой поддержки монархий, способствовавших его развитию. Пусть Франция снова станет центром великого искусства — профинансируем новые шедевры."
 FAF_beautify_the_countryside_decision:0 "Украсить провинцию"
 FAF_beautify_the_countryside_decision_desc:0 "Наша страна прекрасна! \nНаши дороги прекрасны! \nНаши города прекрасны! \nНаши горизонты прекрасны!"
 FAF_man_of_god_decision:0 "Божий человек"
 FAF_man_of_god_decision_desc:0 "\n\n\n\n\n£GFX_FAF_man_of_god\n\n\n\n\n\n\n\nКороль — благочестивый правитель, столь же прагматичный и милосердный, сколь и набожный, ведомый как Богом, так и благом народа. Он человек, несовершенный, но вечно благодарный за прощение Божье, как и следует всем."
 FAF_divine_right_to_rule_decision:0 "Божественное право"
 FAF_divine_right_to_rule_decision_desc:0 "\n\n\n\n\n£GFX_FAF_divine_right_to_rule\n\n\n\n\n\n\n\nПосле долгих размышлений мы одержали верх в сердцах и умах народа и знати; дом Бурбонов, законный наследник дома Валуа, вновь поднимет знамя Святой Франции. Vive le Roi!"
 FAF_divine_right_tt:0 "§YЭто §!§Rустранит угрозу со стороны соперничающих династий§!"
 FAF_replace_possible_republicans_decision:0 "Начать армейское расследование"
 FAF_replace_possible_republicans_decision_desc:0 "\n\n\n\n\n£GFX_FAF_lecointre\n\n\n\n\n\n\n\nАрмия полна недоброжелателей, атеистов, республиканцев и социалистов. Мы вырежем рак у самого корня, и со временем рана заживёт крепче."
 FAF_sway_the_nobility_decision:0 "Склонить на свою сторону знать"
 FAF_sway_the_nobility_decision_desc:0 "Одного обладания божественным правом знати недостаточно: для герцогов, графов и патрициев божественность — иная материя. Если орлеанисты и бонапартисты предложат им лучшую сделку, они вдруг станут божественными благодаря своей «доброжелательности». Что ж, нам придётся быть столь же «доброжелательными», если мы хотим закрепить свою власть."
 FAF_ancien_regime_dynamic:0 "Старый порядок"
 FAF_ancien_regime_dynamic_desc:0 "\n\n\n\n\n£GFX_FAF_ancien_regime\n\n\n\n\n\n\n\nМы правим по божественному праву и всё же управляем миллионами душ, у каждой из которых свои желания и нужды. Новый Старый порядок не повторит ошибок прежнего, но точно так же государь останется неограниченным, отвечая лишь перед Богом, а благополучие Франции будет полностью вверено божественной воле нашего государя. Vive le Roi!"
