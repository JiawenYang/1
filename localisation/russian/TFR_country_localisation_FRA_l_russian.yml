 trait_FRA_Disgusted_with_Regime_desc:0 "Этот офицер чувствует презрение со стороны действующего режима и будет активно стремиться быть как можно более независимым от верховного командования. \n\nЕсли что-либо дестабилизирует Французскую республику, этот офицер несомненно выступит против истеблишмента."
 trait_FRA_Neutral_with_Regime:0 "Нейтрален к режиму"
 trait_FRA_Neutral_with_Regime_desc:0 "Этот офицер не испытывает ни добрых, ни злых чувств к действующему режиму. \n\nЕсли что-либо дестабилизирует Французскую республику, этот офицер может решить покинуть истеблишмент, но это не гарантировано."
