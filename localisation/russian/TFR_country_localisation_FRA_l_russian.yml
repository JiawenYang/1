 FAF_Open_Paris_Identitarian_Council_decision:0 "Укрепить §Cпарижскую идентичность§!"
 FAF_Open_Paris_Identitarian_Council_decision_desc:0 "Как можно говорить о Франции, не упоминая Париж? Веками Париж был сердцем французского — если не всего мирового — искусства, моды и литературы. Но «Город света» был построен не только из кирпичей и камней; его создала цветущая парижская культура, позволившая жизни и творчеству расцвести. Именно парижская культура вывела нашу страну на мировую сцену и заставила наше имя звучать по ту сторону океанов."
 FAF_Open_Alsace_Identitarian_Council_decision:0 "Укрепить §Pэльзасскую идентичность§!"
 FAF_Open_Alsace_Identitarian_Council_decision_desc:0 "Эльзас французский, и Эльзас останется французским. С Вестфальского мира Эльзас находится под французской властью. Некоторые утверждают, что Эльзас — немецкий, но это вопиющая ложь. Ложь, чтобы посеять раздор между нами. Верно, что немцы не раз разрывали нас на части на протяжении истории, но кровь гуще воды, и мы должны напомнить жителям Эльзаса этот факт."
 FAF_Open_Occitan_Identitarian_Council_decision:0 "Укрепить §Oокситанскую идентичность§!"
 FAF_Open_Occitan_Identitarian_Council_decision_desc:0 "На протяжении поколений Окситания находилась под французской властью и сегодня является хорошо интегрированной частью нашей страны, но, возможно, слишком хорошо. Окситанская культура и язык оказались под угрозой исчезновения и скоро будут забыты в нашей великой стране. Мы не можем этого допустить. Окситанское культурное возрождение — ключ к тому, чтобы наш народ обрёл свои корни."
 FAF_Open_Corsican_Identitarian_Council_decision:0 "Укрепить §gкорсиканскую идентичность§!"
 FAF_Open_Corsican_Identitarian_Council_decision_desc:0 "С конца XVIII века Корсика французская. Этот маленький остров чуть юго-восточнее материковой Франции породил величайшего гиганта французской истории — Наполеона Бонапарта. Место Корсики во Франции всегда было шатким, даже проблемным. Но, принимая и интегрируя её, мы можем закрепить наши братские узы."
 FAF_Open_Lombardian_Identitarian_Council_decision:0 "Укрепить §Gломбардскую идентичность§!"
 FAF_Open_Lombardian_Identitarian_Council_decision_desc:0 "Связь между нами, французами, и ломбардцами возникла, когда могущественный Карл Великий завоевал их королевство и включил его в нашу культурную сферу влияния. Пока наши ломбардские братья возвращаются в наши объятия, мы должны вновь разжечь многовековые узы между нашими народами."
 FAF_Open_Venetian_Identitarian_Council_decision:0 "Укрепить §Aвенецианскую идентичность§!"
 FAF_Open_Venetian_Identitarian_Council_decision_desc:0 "Мы, французы, всегда глубоко восхищались культурой и народом Венеции и ценили их. Когда Наполеон завоевал Венецию, он не преследовал ни её народ, ни её материальные богатства — его взор обратился на великолепное венецианское художественное мастерство. Радуйтесь, мои венецианские братья, ибо вы наконец стали частью нашей великой французской семьи."
 FAF_Open_Roman_Identitarian_Council_decision:0 "Укрепить §tримскую идентичность§!"
 FAF_Open_Roman_Identitarian_Council_decision_desc:0 "О Рим... с чего вообще начать? Основа французской культуры — римская, а французский язык — латынь. Переплетение римлян и древних галлов сделало Францию тем, чем она является сегодня. Римский милитаризм, римскую креативность и римскую изобретательность мы все наследовали. Франция — это Рим, а Рим — это Франция."
 FAF_Open_Basque_Identitarian_Council_decision:0 "Укрепить §7баскскую идентичность§!"
 FAF_Open_Basque_Identitarian_Council_decision_desc:0 "Баскский народ может гордиться тем, как хорошо он сохранил свою культуру и язык. Однако яд глобализации ослабил и то и другое. Во Франции баскская культура медленно угасает, а язык забывается. В Испании баскский народ становится всё более агрессивным. Под нашей властью он должен помнить, что сила не в культурном разделении, а в богатстве двойного наследия."
 FAF_Open_Catalan_Identitarian_Council_decision:0 "Укрепить §Yкаталонскую идентичность§!"
 FAF_Open_Catalan_Identitarian_Council_decision_desc:0 "Каталонская культура и язык постепенно оказались под угрозой из-за наших усилий по централизации образования. Эта маленькая невинная ошибка заставила их отказаться от собственных традиций и приспособиться к французскому образу жизни. Мы не должны забывать, что мы — кастель, и, как кастель, всё должно быть в едином порыве, чтобы достичь устойчивости."
 FAF_dauphine_province_modifier:0 "Правление дофина"
 FAF_dauphine_province_modifier_desc:0 "\n§YДофин:§!\n\n\n\n\n\n\n\n\n\n£GFX_louis_xxi_Portrait\n\n\n\n\n\n\n\n§W          Louis§! \n\n\nС XII века местный правитель граф Гиг IV д'Альбон нёс на своём гербе дельфина и получил прозвище Дофин. В 1349 году Дофине было передано от последнего не-королевского дофина будущему королю Франции Карлу V путём покупки земель. Условия передачи предусматривали, что наследник французского престола отныне будет называться дофином, и включали значительную автономию и налоговые льготы для области Дофине. По завершении восстановления монархии Людовик, герцог Бургундский, стал новым дофином."
