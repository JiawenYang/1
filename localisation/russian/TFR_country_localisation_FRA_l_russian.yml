 FAF_full_employment_idea:0 "Полная занятость"
 FAF_full_employment_idea_desc:0 "Наконец, после многих лет проб и ошибок, мы достигли национального уровня \"полной занятости\" среди населения. Благодаря этому большинство граждан нашли работу, обеспечивающую высокий уровень жизни и побуждающую их отдавать всё силы нашей стране и её экономике. Разумеется, это создало проблемы с людскими ресурсами для призыва и жалобы предприятий, которые больше не могут пользоваться дешёвой иностранной рабочей силой. Но для наших граждан и особенно для нашей пропаганды достижение работы для всех — это то, чем не стоит пренебрегать!"
