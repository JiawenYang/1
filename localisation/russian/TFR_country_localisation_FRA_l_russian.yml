 FRA_EU_Repairing_the_National_Body:0 "Восстановить национальный организм"
 FRA_EU_Moratorium_of_Political_Debate:0 "Мораторий на политические дебаты"
 FRA_EU_The_Second_Star_in_the_Union_desc:0 "Франция всегда была краеугольным членом Европейского союза. С момента вступления в 1958 году мы расширили свою роль от участника до лидера, направляя и ведя расширение ЕС до того, чем он стал сегодня. Хотя мы пошатнулись перед лицом русской агрессии, мы не должны отказываться от мечты о единой Европе. Консерваторы и социалисты могут кричать и брыкаться сколько угодно, но мы не станем слушать их бессвязные излияния. Если европейская мечта должна выжить, то исчезнуть должна не французская нация, а немецкая, растворившись в союзе, управляемом из Парижа."
 FREU_the_union_cat:0 "Наша Европа"
 FRA_EU_Repairing_the_National_Body_desc:0 "Наша победа над милитаристами и социалистами не обошлась без цены. Мы унаследовали израненную и разрушенную страну. Обширные пространства сельской местности лежат в руинах, города в руинах, полыхают пожары. Даже наша безмятежная столица не избежала ужасов войны — повреждена даже Эйфелева башня. Продвигаясь с панъевропейским проектом, мы начнём трудный процесс исцеления французского организма. То, что последует, станет проверкой не только нашей приверженности европейскому единству, но и того, как далеко мы готовы зайти, чтобы возродить французскую нацию. И мы доведём это до конца, чего бы нам это ни стоило и какие бы действия ни пришлось предпринять."
 FRA_EU_The_Cult_of_Reason_desc:0 "Основанный в бурные первые годы после Французской революции, Культ Разума был свидетельством республиканских ценностей и стремления к подлинному прогрессу. Несмотря на это, его узурпировал предатель Робеспьер, превративший его из фронта прогресса в простое орудие укрепления собственной власти. Вопреки этому идеалы Культа Разума остаются актуальными и по сей день. По мере того как мы восстанавливаем некогда гордую французскую нацию, эти идеи станут строительными блоками нашего нового режима, направляя наше стремление к разуму, равенству и инновациям."
 FRA_EU_The_Will_to_Grow:0 "Воля к росту"
 FRA_EU_Diversify_the_French_Citizen_desc:0 "Что на самом деле представляет собой французский гражданин? Правые скажут, что французский гражданин — европеец. Но мы знаем лучше. Франция — это разнообразный плавильный котёл национальностей и культур. И представить весь наш народ в одном образе было бы большим уроном для этих культур. Если мы искренне стремимся представлять наш народ, мы должны расширить то, что значит быть французом. Прошли дни дискриминации. Прошли дни, когда человека могли считать меньшим, чем гражданин. Если мы хотим действительно отдалиться от ошибок прошлого, то переработка идеи французского гражданина — лишь один из многих шагов к поистине равному будущему для всех."
 FRA_EU_A_New_Technocratic_Superstructure_desc:0 "Многие считают технократию молодым понятием, но история говорит иначе. Впервые введённое Уильямом Генри Смитом в 1919 году, оно было позже развито Говардом Скоттом в 1930-х. Хотя его технократическая партия не добилась успеха и в конце концов распалась, продвигаемые ею идеи продолжают жить. Провалы Пятой республики в Европейской войне достаточно доказывают, что нужна новая система правления. Францией больше не будут управлять жадные, своекорыстные политики. Отныне большие команды экспертов будут отвечать за повседневные функции французского правительства. Хотя эти люди не назначаются народом, они будут стремиться принести Франции наибольшие перемены. И под нашим руководством они поведут Францию к новому золотому веку сотрудничества и единства."
 FRA_EU_European_Emergency_desc:0 "Когда пушки замолкают и пожары угасают, мы выходим победителями над нашими врагами. И националистические, и коммунистические партизаны изгнаны обратно в тень, и свобода восторжествовала в наш час нужды. Однако мы не можем отдыхать сейчас. Наше положение остаётся весьма анархичным, и радикалы сделают всё в своих силах, чтобы узурпировать наш контроль. В эти отчаянные времена мы обращаемся за помощью вовне. Мы, возможно, проиграли битву, но война далеко не окончена. И мы вернёмся более едиными, чем прежде, готовыми встретить врагов лицом к лицу единым фронтом."
 FRA_EU_Embolden_the_Euro:0 "Укрепить евро"
 FRA_EU_The_Will_to_Grow_desc:0 "Прогресс никогда не приходит сам собой. Кто-то должен подтолкнуть его к действию. Но однажды это случилось — прогресс не остановить. При всех своих успехах Пятая республика не смогла обеспечить сохранение прогресса. Волю к росту сменили лень и апатия, молодые довольствовались тем, что имели. И пока мы бездействовали, русские продвигались. Наш провал в должной гонке с врагами в конце концов привёл к нашему падению от их рук. Чтобы получить преимущество над врагами, мы должны гнаться за прогрессом и ростом любой ценой. Объединившись с европейскими союзниками, мы ускорим гонку за ростом. Навстречу процветающему и свободному будущему."
 FRA_EU_Total_war_the_End_War_desc:0 "Как бы мы ни отрицали, мы должны взглянуть правде в глаза. Сам континент Европа устремляется головой вниз к новой войне. И на этот раз она будет ещё разрушительнее предыдущей. Судьба континента висит на острие ножа. Если мы не захватим её для себя, это сделают враги. Если мы хотим быть на вершине, мы должны быть готовы на всё ради победы. Наши солдаты больше не будут связаны ограничениями или кодексами. Вся наша ярость обрушится на врага. И только когда мы победим, мы наконец сложим оружие. Не временно, а навсегда."
 FRA_EU_Beyond_our_Singular_Existance_desc:0 "Что такое Франция на самом деле? Народ? Идея? Нация? Мы говорим иначе. Почему Франция не может служить цели иной, чем её собственное существование? Консерваторы поносят ЕС как «инструмент глобалистов». А социалисты поносят его за «продолжение капиталистического угнетения». Но все они ошибаются. Как мы приняли, что французская нация должна превзойти себя, немцы теперь должны принять, что понятие немецкой нации утратило смысл. Будущее не будет добрым к нациям, отказывающимся меняться. И если мы откажемся идти в ногу со временем, мы падём, как все другие нации, что пали."
 FRA_EU_United_Under_Humanity:0 "Единые под человечеством"
 FRA_EU_Economic_Enrichment_desc:0 "Франция — очень уникальная страна. Мы благословлены многочисленными месторождениями полезных ископаемых и плодородной почвой. Исторически мы всегда использовали наши нетронутые земли, но месторождения оставались недоиспользованными. Если мы надеемся разорвать зависимость от Африки и Китая, мы должны возродить французскую добычу и сельское хозяйство. Субсидии этим двум отраслям подтолкнут экономический рост и помогут создать рабочие места как для граждан, так и для иммигрантов. Кроме того, это позволит нам поддерживать широкую систему социальных услуг. Такие перемены принесут пользу не только нам, но и союзникам, которые много выиграют, получая руду из наших шахт и продовольствие с наших ферм."
 FRA_EU_Cyber_Warfare_Department:0 "Революционизировать департамент кибервойны"
 FRA_EU_Paying_our_Tithe_desc:0 "В современную эпоху ничто не бесплатно. Товары, услуги, коммунальные услуги — всё это имеет цену. Как ни помогали нам союзники в восстановлении, это было не бесплатно. Обширные районы Германии и даже Бенилюкса остаются повреждёнными русским саботажем и ракетными ударами. Они не колебались, помогая нам восстанавливаться, но будут ждать чего-то взамен. Будь то ресурсы, работники или средства, от нас будут ждать вклада в их реконструкцию. Как они помогли нам. Некоторые будут ворчать на этот воспринимаемый налог, но в конечном счёте в наших интересах заплатить. Показывая нашу неизменную приверженность панъевропейскому проекту."
 FRA_EU_Embolden_the_Euro_desc:0 "Впервые созданный в 1996 году, евро можно считать одним из лучших достижений Европейского союза. Он служит не только валютой, но и символом единства. Его принятие различными правительствами, включая нашим, было свидетельством приверженности панъевропейскому проекту. Многие думали, что русская победа на Востоке станет катастрофой для евро, но случилось обратное. Евро только рос быстрее, и с нашим восхождением в Европейский союз он будет продолжать расти. Наша сила — сила евро. И укрепление евро — лишь один шаг в долгом пути к полностью единой Европе."
 FRA_EU_The_Cause_of_the_People_desc:0 "С тех пор как мечта о единой Европе была задумана, мы делали всё возможное, чтобы сделать её реальностью. Но мы не должны забывать народ, которому служим. По-прежнему слышен скептицизм в отношении наших целей. Многие считают их делом лишь нескольких элит, а другие поносят наши цели как продолжение корпоративного угнетения. Чтобы завоевать доверие людей, мы должны успокоить их страхи. Уверить их, что наша приверженность — народу, а не директору или глобалисту. Только завоевав доверие людей, мы сможем по-настоящему взяться за работу."
 FRA_EU_Never_Again_means_Now_desc:0 "Когда Москва провозгласила победу, мы дали себе обещание. Что никогда больше мы не будем побеждены. Никогда больше наши мечты о свободной и единой Европе не будут разбиты оппортунистами и популистами. Никогда больше мы не позволим свободе быть разбитой теми, кто хочет взять власть лишь для себя. Но «никогда больше» не значит завтра или на следующей неделе. Это значит сейчас! Сейчас время идти против угрозы на Востоке. Сейчас время наконец осуществить наши мечты о единой Европе. И если мы не возьмём поводья сейчас, мы никогда не получим другого шанса."
 FRA_EU_The_Public_Private_Enterprise:0 "Государственно-частное предприятие"
 FRA_EU_European_Cooperation_desc:0 "Сотрудничество исторически было основой любого хорошо работающего правительства. И наше не исключение. Мерилом нашего режима будет готовность открыто сотрудничать с союзниками. Такие вещи, как торговые соглашения и совместные военные учения, будут использоваться, чтобы показать нашу неизменную приверженность европейскому проекту. Мы убедим союзников в Берлине, что мы не просто готовы сотрудничать, но активно стремимся к этому. Позволяя нашему зарождающемуся союзу расцвести во что-то большее. Не просто союз, а незыблемое братство."
 FRA_EU_The_Global_Project:0 "Глобальный проект"
 FRA_EU_Dissolve_Executive_Authority:0 "Распустить исполнительную власть"
 FRA_EU_Post_Ideological_Governance_desc:0 "По мере приближения к осуществлению европейского проекта остаётся ещё одна вещь, с которой нужно разобраться. Понятие идеологии должно быть отброшено, если мы надеемся отдалиться от Франции прошлого. В действительности мы должны признать, что идея идеологии использовалась лишь для разделения людей. Если мы искренне желаем объединить наш народ, эти идеи должны быть выброшены. Больше не будет консерваторов, либералов или социалистов. Эти ярлыки больше не будут использоваться, чтобы разделять людей или определять, кто есть человек. Отныне мы все французы, что бы ни говорили эти ярлыки."
 FRA_EU_Iberian_Intervention:0 "Иберийское вмешательство"
 FRA_EU_the_Final_Goalpost_desc:0 "С первых предупреждающих знаков мы ведём войну против изменения климата. От подписания Парижского климатического соглашения до финансирования возобновляемой энергетики — в этой борьбе достигнуто много успехов. Однако мы не можем позволить себе стать апатичными. Если мы не проявим инициативу в борьбе, мы уже не сумеем спасти мир. Как и Пятая республика, мы возобновим приверженность возобновляемой энергетике и резко сократим выбросы углерода. При поддержке Брюсселя и Берлина мы увидим Францию, превращённую в страну будущего, где перемены ведут возобновляемые источники."
 FRA_EU_Popularizing_the_Pan_Euro_Ideal_desc:0 "Несмотря на усилия Volt и других политических движений, панъевропеизм не так популярен, как следовало бы. Партии, поддерживающие ЕС, традиционно оставались на втором плане в пользу других партий. Если наша цель единой Европы должна быть действительно достигнута, мы должны делать всё возможное для поддержки этих партий. Финансировать их, вести агитацию за них. Всё, чтобы повысить их популярность. С поддержкой проЕСовские настроения поднимутся великой волной по всей Европе. И мы оседлаем эту волну поддержки, чтобы продвинуть идею единой Европы из мечты в реальность."
 FRA_EU_A_New_Technocratic_Superstructure:0 "Технократическая надстройка"
 FRA_EU_Blurring_the_Borders_desc:0 "Что такое границы на самом деле? Произвольные линии, проведённые на песке? Инструмент для разделения людей бесполезными идеями вроде национализма? В действительности всё это правда. По мере приближения к осуществлению европейской мечты мы должны низвергнуть понятие границ. Единая Европа — та, где люди свободно перемещаются, а идеи и видения распространяются свободно. Низвергнуть границы — значит освободиться от бремени, которое они несут. Людей больше не будут разделять произвольные линии. Мы больше не будем называть себя немцами или французами. Мы европейцы, сейчас и навсегда."
 FRA_EU_Economic_Enrichment:0 "Экономическое обогащение"
 FREU_concede_to_the_greens:0 "Уступить §7Европейской партии зелёных§!"
 FRA_EU_Uniting_our_Armies:0 "Объединить армии"
 FRA_EU_Democracy_Manifest_desc:0 "Несмотря на радикальные изменения, которые мы внесли во французскую нацию, одно осталось неизменным: наша приверженность демократии. В своей основе мы остаёмся нацией народом и для народа. Правые и левые будут пытаться сказать, что мы «марионетка глобалистов» или «пешки корпораций», но правда говорит сама за себя. Наш долг — перед Францией и перед демократией. На кону будущее не только Франции, но и Европы. Нам по-прежнему угрожает Восток. И если мы не спасём демократию сегодня, медведь может захлестнуть нас завтра."
 FRA_EU_A_New_NATO:0 "Новая НАТО"
 FRA_EU_Strangle_Populist_Rabble_Rousing:0 "Задушить популистскую агитацию"
 FRA_EU_A_New_NATO_desc:0 "С момента создания в 1949 году Организация Североатлантического договора, также известная как НАТО, служила фронтом Запада против авторитаризма. Многие утверждали бы, что альянс устарел с распадом Советского Союза. Но это совершенно не так. В конечном счёте провал НАТО в защите Восточной Европы от русской орды достаточно доказывает её несостоятельность. Однако мы не столь готовы отказаться от концепции НАТО. Через испытания и реформы мы перестроим организацию до того, чем она действительно должна быть для нас. Не просто альянс ради демократии, а подлинный фронт Западной Европы. Тот, что действительно способен противостоять авторитаризму России Медведева."
 FRA_EU_European_Cooperation:0 "Европейское сотрудничество"
 FRA_EU_Curing_Industrial_Ailments:0 "Излечить промышленные недуги"
 FRA_EU_The_Technological_Spearhead:0 "Технологический авангард"
 FRA_EU_Removing_the_Red_Tape:0 "Убрать волокиту"
 FRA_EU_Iberian_Intervention_desc:0 "Несмотря на относительную изоляцию от Европейской войны, Иберийский полуостров не избежал её последствий. После победы Медведева некогда мирный полуостров был разорван гражданской войной. Радикалы и сепаратисты сражаются, надеясь, что их видение восторжествует. В то же время правительства полуострова отчаянно держатся за Мадрид и Лиссабон. Мы не можем просто сидеть сложа руки, иначе рискуем тем, что пропрусская фракция выйдет победителем и будет угрожать нам с Юга. Поэтому с разрешения Брюсселя мы быстро двинемся к умиротворению полуострова. Сокрушая радикалов и восстанавливая порядок на некогда мирных землях. Под знаменем европейского единства мы спасём Иберию от краха."
 FRA_EU_Paying_our_Tithe:0 "Платить десятину"
 FRA_EU_Post_Ideological_Governance:0 "Постидеологическое управление"
 FRA_EU_United_Under_Humanity_desc:0 "Наконец мечта действительно стала реальностью. То, что считалось невозможным, наконец доказало свою возможность. Некогда ядовитые идеи национализма и исключительности сменились открытостью к людям всех видов. Некоторые консервативные остатки продолжают кричать и брыкаться. Понося нас за якобы продажность глобалистам и предательство французского народа, мы знаем правду. Никогда прежде Франция не была более единой и свободной. Мы сильнее, когда смотрим за пределы национальности и сосредотачиваемся на действительно важном. На том, что, кто бы мы ни были, все мы люди."
 FRA_EU_Quell_Nationalism:0 "Подавить национализм"
 FRA_EU_Blurring_the_Borders:0 "Стереть границы"
 FRA_EU_The_Public_Private_Enterprise_desc:0 "Хотя нам удалось превратить Францию в технологическую державу, мы можем сделать больше. У Франции всегда был широкий круг частных предпринимателей, готовых помочь финансировать государственные проекты. Несмотря на это, прошлые лидеры никогда не использовали эту возможность в полной мере. Полагаясь почти исключительно на государственные предприятия, они замораживали прогресс и инновации. Однако мы не повторим ошибок прошлого. Будущее никого не ждёт. И если мы не готовы работать с частными предпринимателями и новаторами, мы никогда не сможем его ухватить. "
 FRA_EU_Utilize_True_European_Allies_desc:0 "Наши провалы в Европейской войне показали, что нельзя доверять тем, кто называет себя нашими союзниками. Когда Киев был захвачен, многие украинские чиновники не колеблясь перешли на русскую сторону. Когда Польша была на грани падения, силезские сепаратисты первыми откололись. Предатели в спину, изменники, оппортунисты — эти слова не начинают описывать, кто эти люди на самом деле. В стремлении вернуть наше наследие мы должны полагаться только на истинных европейских патриотов. Тех, кто готов поставить на кон саму свою жизнь ради своих идей. Тех, кто останется верен своей стране, даже если это означает смерть. Эти истинные патриоты поведут атаку, когда мы двинемся возвращать Восток. И помогут нам свершить месть над коллаборационистами."
 FRA_EU_Curing_Industrial_Ailments_desc:0 "Большую часть своей истории Франция была в авангарде промышленных достижений. От первой промышленной революции до сегодняшнего дня французская промышленность известна во всём мире своей инновационностью. Однако эта стремительная индустриализация Франции имела цену. В стремлении превратить Францию в промышленную державу мы внесли вклад в потепление климата. И продвигаясь с реконструкцией, мы должны пересмотреть свою позицию по индустриализации. Хотя промышленность необходима для функционирования любой страны, мы должны признать, что она не обходится без цены."
 FRA_EU_Advanced_Digital_Warfare_desc:0 "Война — игра постоянных перемен. Ничто не остаётся неизменным на войне. Всё меняется со временем. От танка к самолёту к технологии дронов. Поле боя никогда не было более хаотичным. В эту эпоху продвинутой войны, если не идти в ногу со временем, ты будешь уничтожен. Как китайцы, мы начнём расширять собственное подразделение кибервойны. Интеграция кибервойны в нашу армию непременно даст нам преимущество над врагами. Позволяя нам саботировать критическую инфраструктуру и отключать вражеские коммуникации. "
 FRA_EU_An_Invisible_Footprint_desc:0 "С тех пор как началась наша борьба с изменением климата, возникла идея углеродного следа. Отражая то, сколько человек, компания или страна вносят в ухудшение окружающей среды, прошлые режимы делали значительные вложения в сокращение нашего углеродного следа. Но, к сожалению, этих усилий оказалось недостаточно, и наш углеродный след остаётся огромным по сей день. Время действовать — сейчас, не завтра, не на следующей неделе. Если мы не будем действовать быстро, чтобы наш углеродный след исчез, наши усилия пропадут зря. И если мы провалимся сегодня, мы, возможно, никогда не сможем обеспечить безопасное будущее нашим детям."
 FRA_EU_If_only:0 "Если бы только..."
 FRA_EU_Invite_American_Innovationists:0 "Пригласить американских новаторов"
 FREU_concede_to_the_militarists:0 "Уступить §gЕвропейским военным§!"
 FRA_EU_Expand_Immigration:0 "Расширить иммиграцию"
 FRA_EU_The_Gears_Turn_Again_desc:0 "Экономика Франции подобна очень продвинутой машине. Когда все шестерни работают вместе, можно совершить великие дела и создать инновации в рекордные сроки. Но если что-то разладится, вся система рушится, и некогда работающая машина перестаёт работать. Когда Пятая республика пала, машина французской экономики вновь пришла в упадок и разруху. Однако после многих испытаний и невзгод некогда застоявшиеся шестерни вновь вращаются. Сердце снова бьётся, и, как феникс, мы восстаём из пепла гнили и распада. Теперь мы смело смотрим в будущее, готовые встретить любой вызов на нашем пути."
 FRA_EU_Cyber_Warfare_Department_desc:0 "Область электроники стремительно развивалась с момента создания первого компьютера. От смартфона к технологии дронов. Прорывные достижения дали странам преимущество в военное время. Но если мы хотим добиться успеха против медведя, мы должны быть готовы зайти дальше. Дроны и информационная война, возможно, хороши, но этого недостаточно. Мы должны выйти за пределы того, что прежде считалось возможным. ЭМИ, кибернетические имплантаты, роботизированные солдаты — все эти концепции будут в авангарде. Некоторые будут спорить об этике этих инноваций, но нас это не касается. Обеспечение нашей победы означает, что мы должны быть готовы принять технологии, несколько сомнительные с этической точки зрения. "
 FRA_EU_The_Best_and_Brightest_desc:0 "Франция в её нынешнем виде хрупка, как треснувшее стекло. Неверный шаг отправит уже раскалывающуюся систему в полную анархию. Процесс восстановления разорённой войной страны долог и труден. И его нельзя просто доверить рядовому работнику. Поэтому необходимо собрать команды экспертов для помощи в процессе реконструкции. Хотя этим экспертам будут даны особые привилегии для составления планов, они по-прежнему будут нуждаться в нашем окончательном одобрении. С их руководством мы превратим Францию в страну будущего. Страну, которая действительно отразит конечную цель панъевропейского проекта."
 FRA_EU_The_Best_and_Brightest:0 "Лучшие и ярчайшие"
 FRA_EU_The_Second_Star_in_the_Union:0 "Путеводная звезда Союза"
 FRA_EU_Embrace_AI_desc:0 "С начала XXI века поиск ИИ открыл новые пути. Начиная с создания Siri, развитие ИИ только становилось более продвинутым. В сегодняшнем мире ИИ воспринимается в лучшем случае со скептицизмом, в худшем — с откровенной ненавистью. Многие смотрели на ИИ через генеративную призму, но нас больше очаровывают его военные возможности. В рамках нашего стремления модернизировать армию значительные инвестиции будут вложены в интеграцию ИИ. Это не только модернизирует нашу армию, но и поможет сократить человеческие потери на передовой."
 FRA_EU_Walking_a_Green_Path:0 "Идти зелёным путём"
 FRA_EU_The_Cult_of_Reason:0 "Культ Разума"
 FREU_concede_to_the_socialists:0 "Уступить §pПартии европейских социалистов§!"
 FRA_EU_Total_war_the_End_War:0 "Тотальная война, чтобы покончить с войной"
 FRA_EU_Utilize_True_European_Allies:0 "Опираться на настоящих европейцев"
 FRA_EU_The_Cause_of_the_People:0 "Дело народа"
 FRA_EU_Never_Again_means_Now:0 "Никогда больше — значит сейчас!"
 FRA_EU_Expand_Immigration_desc:0 "Никогда во французской политике не было темы более спорной, чем дебаты об иммиграции. Она возникла после массовых волн арабских мигрантов, хлынувших в нашу страну, спасаясь от насилия Арабской весны и гражданской войны в Сирии. Вопрос быстро всколыхнул французское правительство. Многие призывали к ужесточению иммиграционного контроля. Однако при нашем правлении иммиграция не будет остановлена. Напротив, она будет расширена. Иммигрантам будет предоставлена поддержка и субсидии при условии, что они внесут вклад в наше восстановление Франции. Консерваторы могут кричать и брыкаться сколько угодно, но мы не станем слушать их жалобы. В конце концов, власть у нас, значит, правы мы."
 FRA_EU_Mankind_Redefined_desc:0 "История не была добра к тем, кто желает переопределить понятие человечества. Чаще всего этот термин использовался диктатурами для оправдания преследования меньшинств. Однако для нас это совершенно не так. Мы не стремимся низвергать людей. Мы стремимся возвысить их. Чтобы обеспечить процветание для всех, мы должны относиться ко всем одинаково. Такие мелочи, как раса, этническая принадлежность или национальное происхождение, больше не будут преградой. Мы должны быть готовы отбросить эти нелепые идеи и принять человечество таким, каково оно есть. Понятие, чтобы объединять, а не разделять."
 FRA_EU_Quell_Nationalism_desc:0 "Несмотря на нашу победу над милитаристами, есть ещё те, кто продолжает твердить свою риторику. Они бунтуют день и ночь, понося наш режим за «продажность элите глобалистов» и «предательство французского народа». Прежний режим предпочитал отворачиваться, но мы не пойдём по этому пути. Если панъевропейская мечта должна быть полностью осуществлена, то национализм любого вида должен быть раздавлен. Мы вытащим националистов наружу, разгоним их митинги и запретим их партии. Некоторые назовут это вопиющим авторитаризмом, но это необходимое зло. Европа не будет единой, если мы позволим этим движениям существовать."
 FRA_EU_Nation_of_Equality_and_Science_desc:0 "Несмотря на провалы руководства Макрона, мы не можем отрицать прогресс, достигнутый при Пятой республике. Консервативный застой и откат сменились прогрессом и инновациями. В социальные службы были вложены огромные средства, а технологические инновации получили финансирование. Глядя в будущее, естественно, что мы продолжим финансировать эти программы. Под нашим руководством Франция станет нацией прогресса и инноваций. Застой сменится инновациями, регресс — продвижением. С помощью союзников мы примем будущее с распростёртыми объятиями. Готовые к любым вызовам на нашем пути."
 FREU_the_union_cat_desc:0 ""
 FREU_freedom_from_extremism:0 "Свобода от выбора"
 FRA_EU_European_Emergency:0 "Европейская чрезвычайная ситуация"
 FRA_EU_The_Gears_Turn_Again:0 "Шестерни вращаются"
 FRA_EU_If_only_desc:0 "Мы думали, что этого никогда не случится, но в конце концов это случилось. И где мы теперь? Несмотря на недавние успехи, Европа по-прежнему расколота надвое. Как бы мы ни пытались это отвести, мы должны признать, что кто-то должен понести вину. Если бы только эти популистские агитаторы нас слушали. Если бы только евроскептики были более открыты нашим идеям европейского единства. Но вместо этого они этого не сделали. И посмотрите, где мы теперь. Наши союзники уничтожены или превращены в марионеток Москвой, и европейский континент расколот пополам. Если бы только они слушали. Если бы только они были готовы слушать."
 FRA_EU_Eliminate_Human_Casualties_desc:0 "Ни одна страна не идёт на войну, рассчитывая не понести тяжёлых потерь. Но почему так должно быть? Война на горизонте, и если мы хотим оказаться победителями, мы должны сделать всё возможное, чтобы предотвратить ненужные смерти. Будь то через инвестиции в медицинский прогресс или технологию дронов. Либо мы могли бы стремиться к достижениям в кибернетике. Это позволит нам расширить боевые возможности наших солдат и повысить их эффективность на поле боя. Возможно, мы не сможем предотвратить потерю жизней, но эти достижения по крайней мере позволят нам её минимизировать. "
 FRA_EU_Crack_Down_on_Extremism:0 "Жёстко подавить экстремизм"
 FRA_EU_Seeking_Discourse_desc:0 "Сила Франции — в её многопартийной демократии. Несмотря на провал Пятой республики, мы не должны отказываться от своих демократических корней. Продолжая собирать обломки гражданской войны, мы оказываемся перед уникальной возможностью. Хотя крайне правые и крайне левые отказались работать с нашим правительством, остаётся много умеренных, которых можно убедить. Уступками и услугами мы можем убедить эти нейтральные партии более открыто работать с нашим правительством. Это позволит нам легко проводить законы. Значительно ускоряя процесс реконструкции."
 FRA_EU_Eliminate_Human_Casualties:0 "Устранить человеческие потери"
 FRA_EU_Uniting_our_Armies_desc:0 "Франция всегда гордилась мощью своей армии. От дней славы Наполеона до сегодняшнего дня — сказать, что у Франции богатая военная история, значит ничего не сказать. Приближаясь к осуществлению панъевропейской мечты, мы должны принять правду. Чтобы действительно продвинуться к нашим целям, мы должны начать объединять различные армии Западной Европы под единым командованием. Немецкая армия добровольно интегрируется в расширенное командование ЕС во главе с Парижем. Это засвидетельствует приверженность Берлина европейскому объединению. И хотя некоторые немецкие генералы могут спорить, наше решение окончательно. И в конечном счёте оно служит великому благу всей Европы."
 FRA_EU_Beyond_our_Singular_Existance:0 "За пределами нашего единичного существования"
 FRA_EU_United_By_Science_and_Reason:0 "Объединённые наукой и разумом"
 FRA_EU_The_European_Dream_Marches_on:0 "Европейская мечта идёт вперёд"
 FRA_EU_Sister_Republic_desc:0 "У Франции всегда были особые отношения с ЕС. Хотя мы были одним из его основателей, недавние волны евроскептицизма вставили палки в колёса панъевропейской мечты. Такие политики, как Земмур и Ле Пен, остаются ярыми противниками любой интеграции в союз, утверждая, что Франция должна освободиться от его влияния. В качестве компромисса с этими группами мы откажемся от цели полного объединения в пользу тесного сотрудничества с союзниками. Volt и другие группы могут быть этим недовольны, но это необходимая жертва ради блага нашего союза."
 FRA_EU_Our_Offer_to_Brussels_desc:0 "При всех наших усилиях наши союзники в Брюсселе остаются перегружены. Обязанная управлять и Западом, и Востоком, администрация Брюсселя вынуждена работать сверхурочно, чтобы должным образом управлять обоими регионами. Мы не можем сидеть сложа руки и смотреть, как наш союзник изнемогает под бременем государственных обязанностей. Мы обратимся к Брюсселю с предложением. Мы возьмём на себя административные обязанности Западной Европы. А взамен они получат долю её экономического продукта. Это не только не даст нашему союзнику надорваться, но и продемонстрирует нашу приверженность европейскому проекту. Позволяя нам заручиться их услугами в будущем."
 FRA_EU_An_International_Reconstruction_Effort:0 "Международные усилия по реконструкции"
 FRA_EU_Nation_of_Equality_and_Science:0 "Нация справедливости и науки"
 FRA_EU_Europeanize_Paris:0 "Европеизировать Париж"
 FRA_EU_Invite_American_Innovationists_desc:0 "Хотя некоторые ратуют за то, чтобы дать власть исключительно французским экспертам, было бы неправильно не приглашать иностранных специалистов. Соединённые Штаты когда-то были маяком промышленных инноваций. Такие промышленники, как Бессемер и Генри Форд, привнесли инновации вроде сборочной линии. Хотя некогда процветающая страна раздираема гражданской войной, такие промышленники, как Блумберг, смогли сохранить свои активы. Обращаться к ним будет рискованно, но потенциальная награда перевешивает риск. Советы этих людей будут критически важны для ускорения процесса реконструкции."
 FRA_EU_Strangle_Populist_Rabble_Rousing_desc:0 "Один из многих провалов Пятой республики ясно виден и сегодня. Несмотря на укрепление нашего правления, популистские партии продолжают сопротивляться. Они непрерывно твердят анти-ЕСовскую риторику и устраивают массовые протесты против нашего режима. В отличие от Макрона, мы не будем мягки с этими смутьянами. Если они не с нами, они против нас, и их инакомыслие не будет терпимо. Мы обрушим молот на эти группы, цензурируя их лидеров и ограничивая их передвижение. Они могут кричать и брыкаться сколько угодно, но никто не будет слушать."
 FRA_EU_The_Technological_Spearhead_desc:0 "Рассвет XXI века ознаменовал период стремительного технологического прогресса. Как и гонка вооружений Холодной войны, компании соревновались, кто окажется в авангарде инноваций. Никогда прежде технологии не были столь важны для выживания страны. Инновации в дронах и кибервойне позволили странам наносить удары по уязвимой инфраструктуре, сохраняя солдат в безопасности. Если мы хотим иметь шанс против русского медведя, мы должны ускорить технологический рывок. Ибо если мы не вырвемся вперёд, мы отстанем и будем уничтожены врагами."
 FRA_EU_Popularizing_the_Pan_Euro_Ideal:0 "Популяризировать панъевропеизм"
 FRA_EU_Crack_Down_on_Extremism_desc:0 "Несмотря на нашу победу над милитаристами и коммунистами, радикализм продолжает гнить в тени. Если мы быстро не раздавим этих фанатиков, они станут занозой в нашем боку, саботируя усилия по реконструкции. Будет дано разрешение на искоренение оставшихся активных радикальных групп. Некоторые назовут это эрозией свободы, но это в конечном счёте необходимое зло. Ибо если они не с нами, то они против нас. И любое сопротивление нашему правлению лишь откладывает неизбежное."
 FRA_EU_Removing_the_Red_Tape_desc:0 "На протяжении истории прогресс всегда задерживался неэффективной бюрократией. Правила безопасности, переговоры с профсоюзами и бюджетные ограничения. Всё это лишь замедляет развитие общества. Мы не можем позволить себе продираться сквозь бюрократические сети, чтобы наши планы отвергли. Сокращая эти системы, мы экономим и время, и деньги. И позволяем новым прорывным проектам получать одобрение быстрее, начиная работу в рекордные сроки. Некоторые поднимут вопросы о правилах безопасности, но эти сокращения в конечном счёте необходимое зло. Если мы хотим привести Францию в будущее, нам придётся срезать углы."
 FRA_EU_the_Final_Goalpost:0 "Последний рубеж"
 FRA_EU_Addressing_Our_Failures:0 "Разобраться с нашими неудачами"
 FRA_EU_Picking_ourselves_up:0 "Подняться с колен"
 FRA_EU_Europeanize_Paris_desc:0 "Париж, который часто считают одним из самых популярных городов Франции и даже Европы, выдержал испытание временем. От переулков до катакомб сами кирпичи излучают богатую историю города. Он стоит как один из великих плавильных котлов. Где культуры смешиваются. И идеи расцветают. К сожалению, город знавал лучшие дни, и массовое пренебрежение при Пятой республике привело к тому, что некоторые части обветшали. В рамках сотрудничества с ЕС мы предпримем грандиозную кампанию по оживлению Парижа. Модернизируя его и приводя к стандартам других европейских столиц, таких как Берлин и Лондон."
 FRA_EU_The_European_Dream_Marches_on_desc:0 "С момента создания в 1993 году ЕС вырос из небольшой коалиции в многонациональный союз. С тех пор несколько единомышленников трудились, чтобы сделать панъевропейскую мечту реальностью. Многие думали, что идея единой Европы рухнет с победой России в Восточной Европе, но она лишь воодушевила нас. Она показала, что если мы не объединимся сегодня, мы погибнем завтра, так и не осуществив мечту об объединении. Рассвет ознаменует значительный поворотный момент в истории не только Франции, но и Европы в целом. Как феникс, мы восстанем из пепла более крепкими, чем прежде. И когда враги Европы придут, мы встретим их лицом к лицу. Ибо единство — наша сила, и ничто не сможет его сломить."
 FRA_EU_Addressing_Our_Failures_desc:0 "Оглянитесь вокруг. Наши города разрушены, наш народ голодает, наша армия разбита. Как бы мы ни пытались это отрицать, мы потерпели неудачу. Мы не смогли защитить восточных союзников от русской орды, и теперь пожинаем последствия. Но мы не можем вечно хмуриться в своём поражении. Мы должны снова встать на ноги, извлечь уроки из ошибок и вернуться сильнее. Многому можно научиться из наших провалов в Первой европейской войне. И многое нужно изменить. Каким бы ни был наш подход, перемены обязательны. Если мы откажемся меняться, то повторим ошибки прошлого."
 FREU_unity_in_decision:0 "Единство в решении"
 FRA_EU_Seeking_Discourse:0 "Искать диалог"
 FRA_EU_Mankind_Redefined:0 "Человечество, уточнённое"
 FRA_EU_Sister_Republic:0 "Сестринская республика"
 FRA_EU_Moratorium_of_Political_Debate_desc:0 "При всех наших усилиях многие аспекты нашего режима по-прежнему неуместны. Многие среди левых и правых продолжают кричать и брыкаться, активно отказываясь работать с нашим правительством и даже прибегая к откровенному саботажу. Мы не можем позволить этим радикалам тормозить наш прогресс, иначе мы ничего не сделаем. С разрешения Берлина мы введём временный мораторий на все формы политических дебатов. Многие сочтут этот шаг спорным. Или даже откровенно авторитарным, но он лишь временный. Как только наш переход от республики к комиссии будет завершён, мы снимем запрет на политические дебаты. Но пока мы должны использовать чрезвычайные меры, чтобы обеспечить наше правление."
 FRA_EU_Diversify_the_French_Citizen:0 "Диверсифицировать французского гражданина"
 FRA_EU_Picking_ourselves_up_desc:0 "Когда пыль оседает и хаос стихает, наше правление медленно, но верно укрепляется. Ещё многое предстоит сделать. Города лежат в руинах, а наш народ стоит в очередях за хлебом. Но, к счастью, мы не одиноки. По всей Европе наши союзники страдают так же, как и мы, если не больше. Польша разделена, Испания по-прежнему раздираема гражданской войной, а некогда гордый евро теперь совершенно бесполезен. Но не вся надежда потеряна. Многие сказали бы, что мечта о единой Европе мертва. Но мы знаем лучше. Страдая в испытаниях, мы станем сильнее, чем прежде. Европейская мечта будет осуществлена, даже если для этого придётся пролить кровь."
 FRA_EU_Walking_a_Green_Path_desc:0 "Во второй половине XXI века Франция была на передовой борьбы с изменением климата. С момента подписания Парижского климатического соглашения мы делали всё в наших силах, чтобы сократить углеродный след. От инвестиций в возобновляемую энергетику до финансирования французских производителей электромобилей. Однако Пятая республика всегда была апатична к растущему ущербу, причиняемому нефтяными компаниями. Если мы хотим оставить собственное наследие, мы должны удвоить усилия в зелёной инициативе. При содействии Брюсселя и Берлина мы будем добиваться полного перехода Франции на возобновляемую энергию, сколько бы ни жаловались нефтяные компании."
 FRA_EU_Dissolve_Executive_Authority_desc:0 "Хотя нам удалось интегрироваться в ЕС, многие институты должны быть постепенно упразднены. Хотя президентская система была необходима Пятой республике, её назначение для нас утратило смысл. Францией больше не будет править президент или премьер-министр. Отныне комиссия экспертов и чиновников ЕС будет надзирать за повседневными функциями французского правительства. Облегчая переход Франции от президентской системы к системе комиссии. Некоторые будут протестовать против этого решения, но в конечном счёте это наилучший исход."
 FRA_EU_Creative_Revolution_desc:0 "Франция всегда была нацией творчества. От архитектуры до кино и искусства. Франция исторически была центром различных творческих революций. Хотя хаос Европейской войны и нашей гражданской войны приостановил эти усилия, теперь мы можем начать возрождать эти движения. В рамках нашей кампании реконструкции мы посадим семена новой творческой революции. Восстанавливая музеи, возрождая гильдии художников и публикуя инновации молодых французских творцов. Искусство, возможно, и не главная опора французской экономики, но чаще оно является признаком процветания нации. И если мы надеемся процветать, поддержка искусств критически важна."
 FRA_EU_An_International_Reconstruction_Effort_desc:0 "На протяжении истории один факт оставался верным. Величайшие державы не достигли своего положения без обширной промышленной базы. Такие великие державы, как Китай и Америка, не стояли бы там, где стоят, если бы не вложились в тяжёлую промышленность. Если мы хотим увидеть Францию, занявшую место среди мировых держав, мы должны запустить бьющееся сердце — промышленность. Заводы будут отстроены, сталелитейные заводы вновь запущены, всё ради перезапуска нашей промышленности. Вместе с помощью союзников Франция вновь станет промышленной державой, способной соперничать с Китаем."
 FRA_EU_Creative_Revolution:0 "Творческая революция"
 FRA_EU_The_Global_Project_desc:0 "Что такое Франция, как не маленькая часть огромной головоломки мирового сообщества? Многие пытались бы это отрицать. Но нам ясно, что мы служим цели большей, чем просто продолжение существования нашей нации. Мировое сообщество — словно гигантская паутина, сложная сеть торговых соглашений и союзов. Если мы хотим воспитать чувство глобального единства среди нашего народа, мы должны подключиться к этой паутине. Это не только поможет воспитать чувство единства среди нашего народа, но и поможет привлечь иностранную рабочую силу и экспертов. Внося большой вклад в процесс реконструкции."
 FRA_EU_Democracy_Manifest:0 "Манифест демократии"
 FRA_EU_An_Invisible_Footprint:0 "Невидимый след"
 FRA_EU_United_By_Science_and_Reason_desc:0 "Величайшие и наиболее долговечные державы истории — это и те, что вкладывали значительно в науку. Промышленные инновации вывели Россию и Америку на мировую сцену, а технологические инновации помогли улучшить качество жизни по всему миру. Собирая куски нашей разбитой страны, мы смотрим в будущее, определяемое наукой и разумом. Будущее, где суеверие и страх перед неизвестным сменились надеждой на будущее. Будущее, где Европа может стоять твёрдо, единая и свободная, навсегда."
 FRA_EU_Our_Offer_to_Brussels:0 "Наше предложение Брюсселю"
