 FRA_foreign_legion_integration:0 "Французский Иностранный легион"
 FRA_foreign_legion_integration_desc:0 "Французский Иностранный легион долгое время оставался остриём имперского могущества Французской империи, а затем и Французской республики. Сегодня он по-прежнему остаётся ярким примером французской военной мощи, и это приносит институту немалые выгоды. Каждую неделю к нам прибывает поток крепких молодых мужчин со всего мира, готовых начать новую страницу своей жизни на службе Легиону. \n\nСейчас Легион занят обеспечением соблюдения франка Африканского финансового сообщества в западноафриканских государствах, входящих в зоны франка, а также обучением прозападных государств и групп по всей Африке ради долгосрочной стабильности на континенте. Очевидно и то, что исламский экстремизм набирает силу, и поэтому мы направим Легион на искоренение этой чумы, которая за последние годы стоила жизни французским гражданам. \n\nЧесть и Верность."
 FRA_coronavirus_category:0 "Око урагана"
 FRA_coronavirus_category_desc:0 "Что ж, новое десятилетие уже началось хуже некуда... Прежде чем мы сможем сделать в этом десятилетии что-либо значимое, нам нужно решить внутренние проблемы. \n\n§GCOVID-19 СЕЙЧАС §![FRA_COVID_loc]\n\n§YПРОТЕСТЫ \"ЖЁЛТЫХ ЖИЛЕТОВ\" СЕЙЧАС §![FRA_YVP_loc] \n\n\"В глазу урагана есть тишина, всего на мгновение.\""
