 FRA_Anti_Police_Riots_Category:0 "Протесты Маджида Каттана"
 FRA_Anti_Police_Riots_Category_desc:0 "После убийства Маджида Каттана, безоружного гражданина Туниса, полицейским в Бобиньи Париж погрузился в анархию: протестующие жгли машины, громили автобусные остановки и запускали фейерверки в полицию. Эти протесты распространились по всей стране и соперничали с беспорядками, вызванными протестами \"жёлтых жилетов\" за последние пять лет.\n\nХотя Франция построена на идее Революции, времена в Европе меняются, и с вновь усилившейся Россией на Востоке мы больше не можем позволить себе стоять сложа руки, пока протестующие разрушают важнейшую инфраструктуру."
