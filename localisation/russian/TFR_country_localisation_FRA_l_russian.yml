 FAF_Full_Petainist_Control_idea:0 "Однопартийное государство"
 FAF_Restored_Monarchy_idea:0 "Реставрационное движение"
 FAF_National_Rebirth:0 "Национальное возрождение"
 FAF_National_Rebirth_desc:0 "Франция должна пробудиться к славному возрождению единства и силы. Через смелое и мощное культурное обновление наш режим должен вернуть народу его законную гордость и твёрдо поставить страну на путь величия."
 FAF_National_Rebirth_Anti_Communist:0 "Национальное возрождение"
 FAF_National_Rebirth_Anti_Communist_desc:0 "Франция должна пробудиться к славному возрождению единства и силы. Через смелое и мощное культурное обновление наш режим должен вернуть народу его законную гордость и твёрдо поставить страну на путь величия."
 FAF_Petainist_Defense:0 "Оборонительные манёвры"
 FAF_Petainist_Defense_desc:0 "Стратегическая оборона нашей армии обеспечивает безопасность границ государства. Наша дисциплинированная армия и стойкие укрепления должны опираться на стойкость нашего народа, чтобы иностранные агрессоры больше никогда не могли угрожать родине."
 FAF_Imperialist_Sympathies:0 "Имперские симпатии"
 FAF_Stability_and_Authority_idea:0 "Стабильность и власть"
 FAF_Honor_and_Glory_idea:0 "Честь и слава"
 FAF_Fascist_Revolts:0 "Фашистские бунты"
 FAF_Fascist_Revolts_desc:0 "Из-за событий, происходящих по всей Европе, или из-за политики, принятой нашим правительством, фашисты нашей страны сейчас бунтуют против нашего правительства. Мы не ожидаем, что это продлится вечно, но, возможно, нам стоит пересмотреть наш текущий курс, чтобы не навлекать на себя их гнев ещё сильнее!"
