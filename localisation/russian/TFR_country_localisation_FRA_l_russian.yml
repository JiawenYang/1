 FRA_Disloyal_Military_idea:0 "Нелояльная армия"
 FRA_Disloyal_Military_idea_desc:0 "Несмотря на все наши усилия, наши отношения с Вооружёнными силами Франции оставляют желать лучшего. Сочетание нашей политики, отсутствия контакта и состояния нашей внешней политики привело к тому, что многие в армии презирают наше правительство. Если мы не исправим эти проблемы, нам придётся ожидать мятежей и заговоров генералов против нас. Эти конфликты интересов также порождают опасения, что переворот может быть не за горами, что навсегда изменит ход французской истории."
 FRA_Disloyal_Military_Zemmour_idea:0 "Нелояльная армия"
 FRA_Disloyal_Military_Zemmour_idea_desc:0 "Несмотря на все их усилия, наши отношения с правительством оставляют желать лучшего. Армию оттолкнули от государства, и теперь многие в наших рядах презирают наше правительство. При Земмуре правительство сохранится даже после открытого переворота против демократического истеблишмента."
