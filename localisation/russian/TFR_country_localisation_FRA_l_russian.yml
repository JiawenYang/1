 FRA_Civil_War:0 "Битва за французский дух"
 FRA_Civil_War_desc:0 "Душу Франции поддерживает гордое наследие революционной доблести. Пропаганда прославляет государство и подавляет инакомыслие, ибо борьба за определение будущего нашей нации позволила нашему народу вернуться к битве против бюрократов-глобалистов и вновь вознести его на пьедестал."
 FRA_Civil_War_Buffs:0 "Битва за французский дух"
 FRA_Civil_War_Buffs_desc:0 "Душу Франции держит гордое наследие революционной доблести. Пропаганда прославляет государство и подавляет инакомыслие, ибо борьба за определение будущего нашей нации позволила нашему народу вернуться к битве против бюрократов-глобалистов и вновь вознести его на пьедестал."
