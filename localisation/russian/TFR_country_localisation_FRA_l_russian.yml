 FAF_QU_tt:0 "Хотя поначалу это будет §Rнегативный§! модификатор, чем усерднее мы будем объединять итальянский, испанский и французский в уникальный, §Yлатинизированный§! диалект, тем §Gлучше станут модификаторы§!"
