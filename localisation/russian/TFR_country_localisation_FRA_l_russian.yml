 FAF_seventh_french_republic_category:0 "Строительство 7-й Республики"
 FAF_seventh_french_republic_category_desc:0 "\n\n\n\n\n£GFX_FRA_new_republic_category\n\n\n\n\n\n\n\nНаша республика держится вопреки всем испытаниям, через которые мы прошли. Мы примем все возможные меры, чтобы наша демократия больше никогда не оказалась так близка к краху. Франция сохранит красоту цветов демократии и позволит им снова расцвести по всей стране, чтобы залечить шрамы, оставленные ужасной гражданской войной, которая едва не отняла у нас всё, что нам дорого. \n\nНеудачи прошлой республики навсегда останутся в памяти как наш самый тёмный час, но и как доказательство нашей решимости бороться со всеми ужасами, направленными против прав свободных людей. Обладая силой, дарованной нам Богом, мы останемся оплотом демократии в Европе, пока фашисты и коммунары ниспровергают всё, за что мы боролись. Мы одолеем эту великую тьму светом факела свободы, который будет сиять на краю Европы. \n\nСвобода восторжествует!"
