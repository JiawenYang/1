 FRA_yellow_vests_idea_4_desc:0 "\n\n\n\n£GFX_FRA_yellow_vest_banner\n\n\n\n\n\nФранцузский экономический спад тяжело ударил по рабочим: рост цен на топливо, высокая стоимость жизни и растущее неравенство угрожают уровню жизни. При этом непропорциональное налоговое бремя ложится на рабочий и средний класс. В мае 2018 года петиция собрала почти миллион подписей, что вызвало протесты, продолжающиеся уже почти два года.\nПротесты, символом которых стали жёлтые жилеты, объединили как крайне левых, так и крайне правых в противостоянии неолиберализму. Протестующие перекрывали дороги, возводили баррикады и участвовали в массовых демонстрациях.\nНасилие нарастало: города охватили беспорядки, столкновения с полицией и широкие разрушения имущества. Рейтинг одобрения Макрона упал более чем на 20 процентов. Эти протесты могут стать переломным моментом во французской политике — уходом от либерализма к росту экстремизма."
 FRA_negotiations_fail_idea:0 "Провал за столом переговоров"
 FRA_negotiations_fail_idea_desc:0 "С радикалами из числа «жёлтых жилетов» становится очевидно, что мирное решение их постоянных протестов и беспорядков невозможно. Их непрекращающиеся мятежи и непрестанное разрушение Франции длятся слишком долго. Наше правительство готовит новые меры, чтобы быстро подавить этих радикалов, но до тех пор Франция будет наблюдать, как её столицу рвут на части и поджигают."
 FRA_faith_in_the_goverment:0 "Вера в правительство"
 FRA_faith_in_the_goverment_desc:0 "По неожиданному повороту событий правительство решило, что его приоритет — французский народ. Переговоры с «жёлтыми жилетами» завершились тем, что правительство согласилось на все условия движения. Хотя это непопулярно среди консерваторов в нашем правительстве, решение было принято большинством из-за отчаянного положения, в котором оказалась Франция. Результатом этого радикального шага стало прекращение протестов: они превратились в празднования новых реформ по всей Франции."
