 FAF_Glorify_Jeanne_dArc:0 "Прославлять Жанну д'Арк"
 FAF_Glorify_Jeanne_dArc_desc:0 ""
 FAF_Enshrine_the_Rights_of_Man:0 "Закрепить права человека"
 FAF_Enshrine_the_Rights_of_Man_desc:0 "В 1798 году наши предки отвергли террор и варварство Старого порядка и приняли решение оформить в письменном виде руководящие принципы для освобождённого французского народа. Этот документ, известный как Декларация прав человека и гражданина, до сих пор занимает своё место в новейшей конституции Пятой республики. Пока мы восстанавливаем законность власти, не закрепить эти права было бы безумием!"
 FAF_Restore_Marianne:0 "Восстановить славу Марианны"
 FAF_Restore_Marianne_desc:0 "Образ Марианны, возникший из пламени Первой республики, часто служил национальной персонификацией самой Франции. Однако за последние десятилетия она стала менее заметной в народной культуре, к большому огорчению многих французских патриотов. Поэтому, если мы хотим объединить Францию под нашим патриотическим знаменем, мы должны вернуть значимость и славу нашей любимой Марианне!"
 FAF_Calm_Militarist_Rhetoric:0 "Умерить милитаристскую риторику"
 FAF_Calm_Militarist_Rhetoric_desc:0 "В наших рядах есть те, кто хочет, чтобы армия взяла на себя ещё больший контроль над правительством в ущерб нашим гражданским свободам. Хотя мы можем понять их призывы к порядку и стабильности, настало время смягчить риторику этих милитаристов, чтобы наша любимая Республика не превратилась в постоянную военную хунту."
 FAF_Pardon_Republican_Officers:0 "Помиловать республиканских офицеров"
 FAF_Pardon_Republican_Officers_desc:0 "В наших усилиях обеспечить контроль над государственным аппаратом нам нужны все свободные руки. Наша первоначальная чистка коснулась большинства старых офицеров во время нашего переворота, но тех, кто симпатизирует нам, можно вернуть серией помилований."
 FAF_Mimic_de_Gaulle:0 "Подражать де Голлю"
 FAF_Mimic_de_Gaulle_desc:0 "Стремясь установить сильное, ориентированное на армию правление, которое при этом уважает основные права наших граждан, кто лучше покойного президента и генерала Шарля де Голля может служить нам образцом? Его усилия по созданию злосчастной Шестой республики могут стать основой для нашего руководства, которое, хотя и потребовало жёстких мер для подавления кризиса мая 1958 года, оставило тёплое наследие, которое нам следует стремиться повторить."
 FAF_Glorify_Vichy_Stability:0 "Прославлять стабильность Виши"
 FAF_Glorify_Vichy_Stability_desc:0 "Публичный образ прежнего Французского государства был запятнан обвинениями в \"сотрудничестве с Германией\", которые выдвигали многие пристрастные историки, но есть способ вернуть его наследию достойное место в глазах французского народа. Поскольку именно этого многие ищут в хаосе XXI века, подчёркивание стабильности прежнего режима Виши может помочь нашему народу понять, что наши цели простираются далеко за пределы простой капитуляции перед немецкими фашистами."
 FAF_Redeem_The_Marechal:0 "Реабилитировать маршала"
 FAF_Redeem_The_Marechal_desc:0 "История была недобра к Филиппу Петену. Маршал, некогда прозванный \"Верденским львом\" за храбрость в Первой мировой войне и готовность заключить мир с вторгшимися немцами, чтобы предотвратить скорое уничтожение Франции. Мелкие либеральные историки, одержимые желанием представить его коллаборационистом, должны быть заглушены. Наше образование должно вместо этого отражать более \"справедливый\" взгляд на подлинного спасителя Франции во Второй мировой войне!"
 FAF_Keep_Officers_in_Check:0 "Держать офицеров в узде"
 FAF_Keep_Officers_in_Check_desc:0 "Офицерский корпус был настоящей занозой в нашем боку, ориентируясь на псевдолиберальных голлистов, которые хотят вернуть нас к нестабильности прежних французских республик. Хотя они нам ещё понадобятся в государственных делах, ограничение их политического влияния необходимо для обеспечения безопасности нашей власти."
 FAF_An_Honour_to_Serve:0 "Честь служить"
 FAF_An_Honour_to_Serve_desc:0 "Наш народ должен понимать, что французское наследие — это наследие служения и жертвенности. От древних времён франков и Карла Великого до наполеоновских завоеваний Европы французское наследие — это наследие армии и чести служить ей. Пропаганда должна подчёркивать эту традицию, особенно когда мы готовимся к новому крестовому походу против орд с Востока!"
 FAF_Promote_French_Israelism:0 "Продвигать французский израилизм"
 FAF_Promote_French_Israelism_desc:0 "Хотя это и маргинальное верование во французском национализме, существует движение людей, убеждённых, что наши франкские предки происходят от колена Вениаминова, а значит, от одного из десяти потерянных колен Израиля. Некоторые назовут это псевдоисторией, но если мы будем продвигать эту концепцию, она может помочь сплотить наших верующих граждан на борьбу за наш режим. В борьбе с ордами с Востока было бы разумно представить себя крестоносцами по рождению."
 FAF_Promote_Radical_Officers:0 "Продвигать радикальных офицеров"
 FAF_Promote_Radical_Officers_desc:0 "Чтобы уравновесить влияние голлистов в офицерском корпусе, мы можем продвигать действующих офицеров, которые лучше всего воплощают наши петенистские идеалы. К тому же всегда хорошо, когда у офицеров есть разногласия, особенно политические, не так ли?"
