 FAF_republican_officers_movement_dummy_idea:0 "Республиканское движение"
 FAF_royal_pretenders_dynamic:0 "Королевские претенденты"
 FAF_royal_pretenders_dynamic_desc:0 "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\nНесмотря на наши древние права, восходящие к дому Валуа, орлеанистские и бонапартистские узурпаторы борются с нашей божественной властью из тени. Мы должны решить эту проблему, пока она не вышла из-под контроля."
 FAF_royal_pretenders_idea:0 "Королевские претенденты"
 FAF_royal_pretenders_dummy_idea:0 "Королевские претенденты"
 FAF_royal_pretenders_squabble_dummy_idea:0 "Королевские претенденты"
 FAF_royal_pretenders_sway_nobility_dummy_idea:0 "Королевские претенденты"
 FAF_nobility_taking_money_tt:0 "§CЗнать§! будет забирать крупную сумму из национального банка каждые 3 месяца в обмен на стабильность королевства."
 FAF_dieu_veut_idea:0 "Dieu Veut"
 FAF_dieu_veut_idea_desc:0 "\n\n\n\n\n£GFX_FAF_deus_vult\n\n\n\n\n\n\n\nВоля Бога и воля нации за нами и за нашими солдатами. Мы сражаемся за праведное дело, дело святое и божественное. Пусть наши люди знают, идя вперёд, что они, народ Франции, — величайшие из когда-либо живших. Когда грохочет артиллерия и они встречают дикие орды на Востоке, пусть знают, что следуют духу нашего Господа. Dieu Veut!"
 FAF_euro_navy_annexation_tt:0 "Путём дипломатических переговоров европейское, тихоокеанское и атлантическое военно-морские командования готовы присоединиться к нашей борьбе против советской коммунистической гегемонии."
 FAF_lafayette_order_cat:0 "Новый порядок"
 FAF_lafayette_order_cat_desc:0 "\n\n\n\n\n£GFX_FAF_lafayette_category\n\n\n\n\n\n\n\nНемцы нас подвели, они дали погибнуть нашим сыновьям... и всё же ждут нашей покорности в грядущей войне? \nКоммунисты и немцы действуют против Франции... Они высасывают наших юношей и нашу промышленность, чтобы ослабить нас... И ради чего? \nЧтобы §RОТНЯТЬ§! у нас территории Эльзаса и Лотарингии? \nЧтобы §RВНЕДРИТЬ§! германский коммунизм в нашу славную Францию? \nМы можем лишь догадываться, что они сделали бы, когда мы ослабеем, но этот день не наступит, пока мы следуем за нашим великим вождём §C«Лафайетом»§!"
 FAF_showcase_superiority_decision:0 "Продемонстрировать французское превосходство"
 FAF_showcase_superiority_decision_desc:0 "Мы превосходим других, и мы это знаем. Наши идеалы, наш образ жизни, наша история, наш народ... Всё доведено до совершенства, как самое изысканное вино, и всё же мир упорно отказывается признавать наше ОЧЕВИДНОЕ превосходство!"
 fra_constant_showboating:0 "Постоянное бахвальство"
 FAF_superiority_cost_tt:0 "За каждого нашего союзника мы потеряем 5 политической власти"
 FAF_kill_villiers_tt:0 "§RМеньше одной пешкой на шахматной доске старого порядка§!"
