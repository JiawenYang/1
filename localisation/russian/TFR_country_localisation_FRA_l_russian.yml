 FRA_Military_Demands_category_desc:0 "\n\n\n\n\n£GFX_FRA_path_of_conquest_cat\n\n\n\n\n\n\n\nПо мере появления трещин в правительстве Макрона многие его союзники в армии пытаются тихо сойти с корабля, пока их карьеры не пущены под откос. Это привело к тому, что несколько офицеров лично связались с Земмуром, прося его помочь им вернуть Францию у либеральной скверны. \nФранция слишком нестабильна и независима, чтобы добровольно пойти под военное правление, однако мы не можем ждать, пока Франция спасёт себя сама. Так рождается §CОПЕРАЦИЯ \"ШЕВАЛЬЕ\"§!. \n\n§CОПЕРАЦИЯ \"ШЕВАЛЬЕ\"§! — это план использования неисправного избирательного оборудования, чтобы эффективно подтасовать выборы 2022 года в пользу партии \"Реконкиста\" Эрика Земмура, а затем задействовать французскую армию для гарантии утверждения результатов в каждом регионе. После этого начального этапа Земмур займётся оптимизацией гражданского управления страной, а армия введёт военную экономику для борьбы со смертельной угрозой на Востоке. \n\nПРОГРЕСС §CОПЕРАЦИИ \"ШЕВАЛЬЕ\"§!: [?chevalier_progress]/6"
