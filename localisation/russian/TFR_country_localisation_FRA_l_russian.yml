 FRA_Jupiter_Ascendent_Category_desc:0 "\n\n\n\n\n£GFX_FRA_jupiter_cat\n\n\n\n\n\n\n\nЭмманюэль Макрон вновь ведёт великую нацию Францию через её самый тяжёлый час — довольно этих бессмысленных бюрократических дрязг и хаотичных выборов. Мы покажем Европе и всему миру наше превосходство и торжество перед лицом тех, которые изнутри и извне желают уничтожить нашу нацию. Мы сделаем эту эпоху эпохой нашего превосходства и восстановим былую славу одной из великих наций не только Европы, но и всего мира. \n\nПыль улеглась, и политическая атмосфера Франции уже начала меняться: консервативная коалиция распадается и остаётся в прошлом, там, где её оставил французский народ. Благодаря реформам, проводимым на благо нашей нации, Франция вздыхает с облегчением, зная, что она в хороших руках. Наша великая армия возвращается на своё место, пока мы готовимся к вызовам завтрашнего дня. Цель Макрона ясна: наша нация стремится стать лучшей версией себя, а также лучшей версией Европы. \n\nНация Франция плывёт к своей судьбе, а Макрон стоит у штурвала."
