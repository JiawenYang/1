 FRA_armed_forces_dynamic_desc:0 "Вооружённые силы Франции были мечом и щитом французской нации, защищая наш народ от возможных угнетателей и агрессоров на протяжении всей нашей истории. Они продолжат защищать нашу страну от угроз современной эпохи, кем бы они ни были."
