 FRA_Interventionist_Fervor:0 "Усиление ястребов войны"
 FRA_Interventionist_Fervor_desc:0 "Северная Америка погрузилась в хаос и анархию, в состояние смерти и разрушения, невиданное в современной истории. Этот хаос потряс наш политический истеблишмент настолько, что стёр десятилетиями сложившиеся прецеденты. Почти за одну ночь изменились и позиция государства, и его кадры — перемены, беспрецедентные сами по себе. В каждом правительственном кабинете голуби умолкли, а их место заняли ястребы. Все они видят горящий мир вокруг нас и требуют того, что уже вертелось у всех в голове. Если нам нужно действовать, чтобы сохранить мир и безопасность в Европе и за её пределами...\n\nТогда мы сделаем то, что должны."
