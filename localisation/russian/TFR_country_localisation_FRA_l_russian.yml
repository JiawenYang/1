 FPR_jacobin_category:0 "Новое Просвещение"
 FPR_jacobin_category_desc:0 "\n\n\n\n\n£GFX_FPR_new_elightenment_cat\n\n\n\n\n\n\n\nФранция давно забыла идеологии разума и свободы, изобретённые Первой революцией, а затем заново переосмысленные Мопеном. Наши «союзники» слева из страха полностью отказались от пути в будущее.\n\nСтрах — враг прогресса. Страх — враг рациональности и преграда к будущему. Нет революции без уничтожения подрывной деятельности."
