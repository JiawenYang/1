 FAF_shield_range:0 "Предпочтение щита"
 FRA_Failed_in_Africa:0 "Провал в Африке"
 FAF_sword_decision:0 "Поднять наши мечи"
 FAF_shield_decision:0 "Поднять наши щиты"
 FRA_bulwark_of_european_conservatism:0 "Оплот западного консерватизма"
 FRA_bulwark_of_european_conservatism_desc:0 "Запад долго медленно развращался либеральными влияниями, контролирующими медиа и элиты, но народ здесь, во Франции, высказался своими голосами против этого, и мы достигли своих целей, вернув Францию на верный путь. Мы стоим как оплот западных ценностей — старых западных ценностей. Мы наследники де Голля, Черчилля, Аденауэра; эти ушедшие великие были консервативными фигурами партий, давно отказавшихся от своих идеалов. Но сегодня мы возродили этот классический консерватизм в самом сердце западной цивилизации, и с крепостных валов распространим его вовне — от стен оплота до плацдармов и дальше. Европа вспомнит своё прошлое и примет его. Она вспомнит прошлое, когда экономика процветала, семьи были большими, а будущее — светлым. И мы снова это получим."
 FRA_a_conservative_france:0 "Триумф традиционализма"
 FRA_a_conservative_france_desc:0 "Традиция создаёт нацию; нет нации без её истории, её религии и её языка. Мы знаем, кто мы: мы французы, гордый народ, который в тот или иной момент был ведущим народом во всех областях. Война, наука, искусство, литература. Мы хороши во всём, за что берёмся, и именно эта традиция превосходства породила наш гордый фундамент, ибо основы французского общества по сути состоят в достижениях нашего народа. Еврофилы хотели бы, чтобы мы отбросили это, чтобы растворить Францию в одной малой части великого европейского целого; но мы — одна из его величайших частей. Мы никогда не увидим Европу как свою идентичность, мы увидим только Францию. Национальное объединение удержит государство на верном пути, Ле Пен и её союзники проведут консервативную революцию в парламенте, добившись большинства на предстоящих выборах, и Франция, пропитанная традицией, станет высшей наградой за наши усилия — набожный, семейный, трудолюбивый народ. Мы будем продвигать это не только здесь, но и по всей Европе. Вся Европа заслуживает ценить своё прошлое."
 FRA_disregard_liberalism_decision:0 "Игнорировать либеральных союзников"
 FRA_prioritize_coalition_stability:0 "Приоритет единства коалиции"
 FRA_prioritize_coalition_stability_desc:0 "Мы должны сдерживать себя: истинное политическое господство вряд ли продлится, и мы не попадём в ловушку однопартийной Республики. Все части нашей Великой нации должны участвовать в её величии; Национальное объединение будет вести, но каждый — от Земмура до Меланшона — должен считаться союзником в борьбе с застоем. Сохранение коалиции обеспечивает стабильную Францию; раскачивание лодки усилением нашего популизма может только ухудшить положение и оттолкнуть значительную часть населения. Будем действовать умно и справедливо — нет причин консолидироваться. Плюралистические демократии таковы не без причины."
 FRA_pluto_rises:0 "Плутон на подъёме"
 FRA_pluto_rises_desc:0 "Макрон стремился быть Юпитером, но потерпел неудачу. Это нормально — теперь мы знаем лучше. Стефан Сежурне вёл «Ренессанс» вперёд; пламенный либеральный политик стойко объединил центр и левые французской политики против Ле Пен и Национального объединения. «Ренессанс» считали мёртвым, но Сежурне поистине стал Плутоном — оживителем мёртвых рейтингов, богом аутсайдеров. Хотя Сежурне не властитель ада, как подразумевал бы Плутон, он вывел Францию из ада и приведёт её к раю под руководством «Ренессанса» и его союзников; Плутон восходит к президентству. Перед лицом кризиса мы не отступим, как месье Юпитер: Сежурне должен быть улыбчивым и обаятельным лицом в медиа и на земле. Активный президент, а не таинственный человек в высокой башне, который делает дела немногими словами."
 FRA_demand_snap_elections_liberal:0 "Требовать досрочных выборов"
 FRA_demand_snap_elections_liberal_desc:0 "Мы сделали всё, что могли, под руководством Стефана Сежурне; молодое лицо, даже моложе Макрона, стало популярным. Всё больше людей на улицах требуют досрочных выборов. Наши усилия увязли президентство Ле Пен в противоречиях и застое; у нас есть шанс вернуть власть у Национального объединения и направить Францию по верному пути, пока не поздно. Нам остаётся лишь спустить курок и потребовать, чтобы народ сказал своё слово."
 FRA_capitalize_on_conservative_blunders:0 "Воспользоваться ошибками"
 FRA_capitalize_on_conservative_blunders_desc:0 "Наш контроль над медиа нельзя недооценивать: финансируемые ЕС и иностранные СМИ на нашей стороне, и с нашим внутренним медиааппаратом мы можем выделить каждую ошибку Национального объединения и растянуть её на недели. Каждая мелкая трагедия будет безжалостно разобрана, каждый неверный шаг и каждое неверно сказанное слово — критикованы. Мы будем выдумывать проблемы со здоровьем из простого заикания или хромоты; это хищнически и у некоторых непопулярно, но тот, кто контролирует медиа, контролирует общественное мнение, а Ле Пен проделала жалкую работу, чтобы склонить наших медиамагнатов. Господин Сежурне, напротив, — свежий молодой человек, рейтинговый хит и живописная фигура для обновлённого «Ренессанса»."
 FRA_the_golden_lambda:0 "Золотая лямбда"
 FRA_the_golden_lambda_desc:0 "О, идентитаристы — они действительно провидцы. Французский национализм в современную эпоху... недальновиден, даже Барделла должен уступить. В эпоху Наполеона, когда каждый пятый европеец был французом, у нас было население, чтобы называть себя державой; в мире, где нации насчитывают миллиарды и сотни миллионов, мы — капля в европейской луже, меньше турок, меньше немцев. Но мы не просто французы, мы сыны Рима, сыны латинян. От Валлонии до Дакии, от Лиссабона до Сиракуз латинская раса всё ещё сильная и многочисленная сила; вместе нас 150 миллионов, мы снова сами себе держава, и видение будущего, где латиняне снова могут быть едины под руководством Франции, не совсем безумно. Наполеон пытался возродить Франкию из пепла именно для этого, а современный Европейский союз сблизил Испанию и Италию с нами как никогда. Хотя мы презираем Макрона и его «невест» в Брюсселе, мы видим ценность объединения Европы, и, принимая Золотую лямбду идентитаристов, мы можем смотреть в будущее, где, возможно, латиняне будут едины, даже если Европа навсегда останется разделённой внутри себя. Больше никаких войн между братьями — у нас будет единство латинян против всех остальных."
 FRA_rabid_anti_slavicism:0 "Борьба со славянскими ордами"
 FRA_rabid_anti_slavicism_desc:0 "Проклятые славяне — оскорбление наших ценностей, даже когда они утверждают, что разделяют их. Каждая славянская демократия православной веры погрузилась в коррупцию или в анократическую автократию: нет ни Liberté, ни Egalité, ни даже Fraternité. Ельцин был декадентским пьяницей, Путин — улыбающейся змеёй, а его преемник Медведев — бешеной сворой, яростно кусающей Запад. Какова бы ни была его судьба, все русские одинаковы. Предатели со времён Континентальной системы, игравшие на обе стороны, предатели во Второй мировой войне, предатели в любых наших делах с ними. Надо не просто сражаться, а покончить с вопросом русской державы. У нас нет будущего в мире, где Россия играет в Чингисхана со своими соседями. Так давайте играть в Наполеона."
 FRA_rabid_anti_liberalism:0 "Бешеный антилиберализм"
 FRA_rabid_anti_liberalism_desc:0 "Мы подставили левых, подставили русских, всё готово. Мы нашли козла отпущения. Страница истории была взята и переписана, оркестровые ноты сыграны в прекрасной симфонии. Треск очередей из русских АК-12 рвёт пять разных групп в пяти разных местах — хирургический разрез, чтобы отсечь либералов от правящего кабинета, а левых нарочно пощадили, чтобы усилить обман; музыка — это упорядоченный набор звуков, и это был шедевр в духе Барделлы. Из штаб-квартиры Национального объединения слышно, как тела падают на мостовую. Наша оппозиция напугана, кабинет Макрона мёртв; остались лишь левые или те, кто нам верен. Барделла готовит речь, чтобы назвать резню ужасной трагедией — а на самом деле? Это наша финальная строфа. Завершение нашей великой пьесы. Никто не согласится на предложение сформировать правительство с Макроном, никто, кроме нас, — мы это обеспечим. Мы дадим ему необходимое большинство, спасителя во времена левого террора и русского вмешательства... пока не устраним его на следующих выборах."
 FRA_socialism_with_french_characteristics:0 "Социализм с французскими особенностями"
 FRA_socialism_with_french_characteristics_desc:0 "После многовековой борьбы — начавшейся в 1789 году и наконец завершившейся сегодня — во Франции есть правительство, которое действительно служит своему народу. Есть система, дающая им власть, дающая им подлинную свободу и счастливую, хорошую жизнь. После борьбы с авторитаризмом и правыми Франция в своей Шестой республике действительно свободна.\n\nC'est pour de bon!"
 FRA_invite_apla_military_advisors:0 "Пригласить американских советников"
 FRA_invite_apla_military_advisors_desc:0 "Хотя это будет крайне спорным и критикуемым решением, гражданская война в Америке и её завершение — критическая цель для Франции и НАТО в целом. Естественно, ближе всего к нашим целям свободного и демократического социализма стоит Американская народно-освободительная армия, даже если внутри неё есть отдельные противоборствующие фракции. Мы разрешим передачу советников из страны в страну и признаем их законным правительством Америки."
 FRA_detente_with_PRC:0 "Восточная разрядка"
 FRA_detente_with_PRC_desc:0 "Часть нашей нынешней слабости — это отвержение Китайской Народной Республики. Как показали крах Америк и последовавший внезапный экономический крах НАТО в целом, мы должны тепло смотреть на Восток, если хотим стать устойчивой и могущественной державой. Кроме того, они наши братья в борьбе за Народ; нет нужды продолжать противостоять единому Китаю."
 FRA_french_military_hegemony:0 "Французская военная гегемония"
 FRA_french_military_hegemony_desc:0 "De Villers полностью возродил военное правление Франции: армия больше, чем за последние пятьдесят лет, народ её поддерживает, промышленность служит нуждам государства и особенно армии. Мы готовы к войне в мирное время, потому что мудро знаем, что грядет. Европа — наши друзья, наши идеологические партнёры; наша армия обязана защищать не только Францию, но и стойких поляков, крепких балтов, неистовых румын; это наш долг и привилегия — быть Вооружёнными силами свободного мира. Франция поистине может сказать, что она Гегемон: армия со столь превосходящей численностью, размером и оснащением, что военные аналитики будут наблюдать за нами в действии в каждой стране каждого континента в следующем веке; Бог Войны ныне живёт в Париже, да будет горе нашим врагам и радость нашим друзьям."
 FRA_skewer_the_bear:0 "Пронзить медведя"
 FRA_skewer_the_bear_desc:0 "Россия — зверь, медведь в спячке, но посмотрите, как он жиреет, пока мы вяло ждём, когда он проснётся и проглотит нас целиком. Другие народы могут бояться самих себя, но французы гордятся своим прошлым. Если Европа не обернётся против России, Франция одна поднимет копьё и сделает новый ковёр для президентского дворца. Мы уже готовились, но можем сделать больше. Мобилизуем прессу, мобилизуем медиа, покажем Франции, с каким народом мы имеем дело: пьяным и безумным, ненавидящим свободу народом, довольным лежать под царём, в красной обёртке или без, лишь бы один человек крепко держал поводья. Они держат нефть над нашей головой, словно лишая узника воды."
 FRA_neo_imperialism:0 "Имперское президентство"
 FRA_neo_imperialism_desc:0 "Мы так долго теряли свою славу и были осмеяны, что почти совсем сбились с пути. Даже Ле Пен сдалась и предала армию — если бы не De Villers? Мы деградировали бы дальше, и последние остатки Империи были бы брошены собакам. Мы защитник Европы, Франции и Западной Африки; мы Меч Свободы, Щит Вольности, и при De Villers мы вновь держава, способная действовать за рубежом и вмешиваться на своих условиях. Мы не Империя, но мы Президентство, и наш Президент — национальный герой."
 FRA_jupiter_rising:0 "Слава Юпитера"
 FRA_jupiter_rising_desc:0 "Величие в наших руках, и минувшие годы мы трудились, чтобы обеспечить свою судьбу. Становится очевидным: чтобы наша судьба свершилась и чтобы мы вышли победителями из грядущих опасностей, сильной Франции будет недостаточно. Макрон не раз доказывал, что Франции нужен сильный лидер, а Европе — тем более: лидер, не боящийся ни политических институтов, ни медиа, ни бюрократии, готовый бороться за нас. Макрон победоносно вёл Францию по пути реформ и прогресса, и результаты принесли сокрушительную силу и благо — и это вопреки бюрократии и смутьянам, желающим положить конец нашему величию.\n\nМакрон покажет Европе и остальному миру превосходство французской нации и её способность помогать соседям и союзникам за морями. Макрон покажет русской угрозе, что она не может запугивать и топтать Европу, как некогда. Макрон познает, в чём Европа нуждается со времён де Голля и Наполеона, и создаст собственное наследие, подобное наследию этих великих людей.\n\nМы не позволим им украсть наше величие."
 FRA_absorb_volt:0 "Поглотить Volt"
 FRA_absorb_volt_desc:0 "Интеграция партии Volt Europa в наше правительство гарантирует не только то, что наше правительство останется сильным и единым, но и то, что Европейский союз поступит так же. Мы можем использовать Volt, чтобы продвигать дальнейшую федерализацию европейского континента и одновременно укреплять связи с Брюсселем. Франция покажет силы и возможности, которые единая Европа может дать народам континента и всего мира."
 FRA_reaffirm_our_majority:0 "Подтвердить наше большинство"
 FRA_reaffirm_our_majority_desc:0 "Коалиция принесла великий успех, и мы наконец добились решительной коалиции, преданной улучшению французского народа. Пока либералы и консерваторы ведут надлежащий диалог и сотрудничество, становится очевидно, что радикалы и экстремисты предпочли бы этого не делать. Мы используем обретённую власть, чтобы продвигать центристскую политику и решительные реформы ради сильной Франции; чтобы оставаться сильными перед лицом русской угрозы и гарантировать, что крайне левым и крайне правым нет места в нашем правительстве."
 FRA_clash_of_civilizations:0 "Столкновение цивилизаций"
 FRA_clash_of_civilizations_desc:0 "Европа и Восток: со времён Балдуина Франция понимала своё место могучего государства крестоносцев, стоящего против сарацина и восточных орд. Мы все ощущали, как петля сжимается вокруг наших шей: мусульманское вторжение в наши дома пришло, когда ворота распахнули либеральные предатели, сидевшие в своих башнях в Брюсселе. Мы наконец закрыли эти ворота, и за ними мы видим лишь варварство. Восточная угроза в Москве приняла этих исламских фундаменталистов ради своих целей, используя Беларусь, чтобы массово направлять мигрантов в Польшу из дикой Сирии; мы видели последнюю волну и то, что она сделала, принеся насилие в наши пригороды и преступность в наши переулки. Ислам — религия и культура, несовместимые с Францией и, более того, с Европой; грядущие конфликты в Африке, на Ближнем Востоке и в Восточной Европе потребуют от нас закалки перед надвигающейся волной. Существует Великая Борьба за наш народ и нашу культуру, борьба против московских монголов и мусульманских орд; если мы добьёмся прочной победы, нас ждёт светлое будущее, проникнутое традицией, с прочно укоренённым европейским господством."
 FRA_the_camus_bloc:0 "Принять блок Камю"
 FRA_the_camus_bloc_desc:0 "Рено Камю — идентитарист старой школы, давний идеологический мыслитель; в 80-е он был социалистом, а сегодня? Он был лидером французского идентитарного движения до его несправедливого запрета при правительстве Макрона. Камю буквально написал книгу о Великой замене, но, в отличие от многих, его не заботит антисемитизм, он открыто гомосексуален и всё же остаётся главой крайне правого движения. Многие правые, в том числе среди евреев и даже среди более умеренного Национального объединения, в прошлом защищали теории Камю; с большим удовольствием Эрик Земмур приглашает Камю вновь создать свою партию, чтобы войти в правящую коалицию. Он и его друзья — антидемократы; мы не станем останавливать демократию, но используем их поддержку, чтобы привлечь голоса тех людей, которые обычно избегают выборов «из принципа»."
 FRA_emulate_the_trump_doctrine:0 "Французский трампизм"
 FRA_emulate_the_trump_doctrine_desc:0 "Дональд Дж. Трамп: некоторые винят его в крахе Америки, Земмур видит в нём трагического спасителя, пришедшего слишком поздно. Как и Земмур, он признаёт, что Америку наводняют, и хочет перекрыть кран иммиграции; не нужно быть расистом, чтобы желать сохранить себя, — почему же плохо желать иммигрантам процветания... просто у себя дома? Трампизм определяется антииммиграцией, пробизнес-законодательством, гражданским национализмом, дипломатией большой дубинки и милитаристским изоляционизмом. Франция может взять все эти идеи себе на службу, и, к счастью, попытка Земмура воплотить их не вызовет национального краха! Мы снова сделаем Францию великой!"
 FRA_liberte_m_warning_tt:0 "§CЕсли древо Макрона не будет завершено к апрелю 2022 года, мы проиграем выборы и не сможем взять §!§RLiberté§!§C до возвращения к власти.§!"
