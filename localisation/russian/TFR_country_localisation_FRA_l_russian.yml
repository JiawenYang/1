 FRA_France_on_the_World_Stage:0 "Франция на мировой арене"
 FRA_France_on_the_World_Stage_desc:0 "\n\n\n\n\n£GFX_FRA_France_World_Stage_category\n\n\n\n\n\n\n\nНа протяжении всей истории Франция играла значительную роль на мировой арене, утвердившись как великая держава и влияя на различные сферы человеческой деятельности. От Средневековья до Возрождения Франция была культурным и интеллектуальным центром, способствуя развитию искусства, литературы и философии. В эпоху Великих географических открытий французские исследователи и торговцы путешествовали по всему миру, основывая колонии и торговые сети. В XVIII веке Франция пережила революцию, оказавшую глубокое влияние на политический и социальный облик Европы и утвердившую идеалы свободы, равенства и братства. Военная мощь Франции проявилась при Наполеоне Бонапарте, чьи завоевания изменили границы Европы. В XIX и XX веках Франция оставалась значимым игроком мировой политики, участвуя в колониализме, двух мировых войнах и создании Европейского союза."
 FRA_Recognize_Constitutionalists_decision:0 "[USC.GetFlag]§CACG§!: Признать §CАмериканское конституционное правительство§!"
 FRA_Recognize_Constitutionalists_decision_desc:0 "Пока гражданская война в Соединённых Штатах продолжается, мы до сих пор придерживались политики общего нейтралитета, поскольку здесь, в Европе, нас занимали более насущные дела. Теперь, когда мы снова можем сосредоточить усилия за рубежом, в наших интересах признать конституционалистов Трампа законным американским правительством, чтобы вновь закрепить наш давний союз."
 FRA_Recognize_Biden_decision:0 "[USB.GetFlag]§CUOA§!: Признать §CСоюз Америки§!"
 FRA_Recognize_Biden_decision_desc:0 "Пока гражданская война в Соединённых Штатах продолжается, перед нами стоит вопрос, какую фракцию признать законным правительством их разорванных войной территорий. Поскольку мы стремимся вернуть безопасность, которую давало членство американцев в НАТО, в наших интересах признать юнионистское правительство и поддержать его усилия по восстановлению нормальной жизни в стране."
 FRA_Recognize_Patriot_Front_decision:0 "[PTF.GetFlag]§2Патриотический фронт§!: Признать §2Патриотический фронт§!"
 FRA_Recognize_Patriot_Front_decision_desc:0 "Гражданская война в Соединённых Штатах вызвала радикальные перемены в их политическом ландшафте, особенно с подъёмом ультраправого Патриотического фронта. Хотя в принципе мы не согласны со многими их решениями, нам нужно признать и поддержать их правительство, чтобы попытаться спасти прежний союз, пока не стало слишком поздно."
 FRA_Recognize_Association_of_the_Freed_decision:0 "[GMA.GetFlag]§GAOF§!: Признать §GАссоциацию освобождённых§!"
 FRA_Recognize_Association_of_the_Freed_decision_desc:0 "Хотя разрушение старого американского порядка было неизбежно со Второй гражданской войной, произошёл явный сдвиг в сторону некоторых более маргинальных фракций конфликта. В частности, группа под названием \"Ассоциация освобождённых\" превзошла зарубежные ожидания и ищет большей международной поддержки. Поэтому в наших интересах признать АО законным американским правительством и помочь ей во Второй американской революции!"
 FRA_Recognize_SoL_decision:0 "[FAA.GetFlag]§GCoFAR§!: Признать §YКонфедерацию свободных американских республик§!"
 FRA_Recognize_SoL_decision_desc:0 "Хотя наша внутренняя ситуация мешала нам вмешаться во Вторую гражданскую войну в США, теперь у нас есть возможность расширить влияние, и нам следует признать одну из фракций законным американским правительством. В частности, Конфедерация свободных американских республик и её внезапный подъём из Новой Англии делают её очевидным кандидатом для нашей поддержки. Как и в 1776 году, нам следует объявить о поддержке КСАР и её Второй американской революции!"
 FRA_Recognize_GMAC_decision:0 "[GMA.GetFlag]§GGMAC§!: Признать §GАнархистский коллектив Грин-Маунтин§!"
 FRA_Recognize_GMAC_decision_desc:0 "Пока ситуация в Америке продолжает развиваться, а Вторая гражданская война опустошает страну, мы всё ещё не нашли фракцию, которую могли бы признать и поддержать. Как бы неортодоксально это ни звучало, \"правительство\" Анархистского коллектива Грин-Маунтин показало готовность построить лучшую Америку даже в безгосударственности анархизма. Если мы поддержим их усилия по воссоединению Соединённых Штатов, у нас может появиться уникальный союзник в грядущей геополитической буре."
 FRA_Recognize_APLA_decision:0 "[APA.GetFlag]§RAPLA§!: Признать §RАмериканскую народно-освободительную армию§!"
 FRA_Recognize_APLA_decision_desc:0 ""
 FRA_Align_Madagascar_decision:0 "[MAD.GetFlag] Привлечь Мадагаскар"
 FRA_Align_Madagascar_decision_desc:0 "С тех пор как их усилия по обретению независимости увенчались успехом в 1960 году, нам было трудно распространять наше влияние в Индийском океане из-за Мадагаскара. Поскольку реколонизация, очевидно, исключена, мы можем вместо этого расширять мягкую силу в стране и попытаться исправить наши колониальные ошибки, чтобы снова обратить остров к нашим интересам. Так мы вновь сможем обеспечить, чтобы наши военно-морские возможности были достойны поистине великой державы."
 FRA_French_Arms_in_Indian_Hands_decision:0 "[RAJ.GetFlag] Поставлять оружие Индии"
 FRA_French_Arms_in_Indian_Hands_decision_desc:0 "С ростом агрессивности Исламской Республики Пакистан и Китайской Народной Республики становится очевидно, что мы должны обеспечить Республике Индия ту помощь, которая ей понадобится, пока мы можем себе это позволить."
