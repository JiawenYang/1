 FRA_leave_nato_desc:0 ""
 FRA_Appeal_to_Neutral_Parties:0 "Обратиться к умеренным генералам"
 FRA_Appeal_to_Neutral_Parties_desc:0 "Мы не можем позволить себе нейтралитет в генеральном штабе; необходимо принять меры, чтобы он оставался единым и поддерживал нашу администрацию."
 FRA_Work_with_Disatisfied_Generals:0 "Работать с недовольными генералами"
 FRA_Work_with_Disatisfied_Generals_desc:0 "Хотя они впали в немилость у нашей администрации, отношения не разорваны полностью, и у нас есть много способов вернуть их к лучшим чувствам, чтобы избежать откровенного недовольства нашим правительством."
 FRA_Benefit_from_our_Supporters:0 "Воспользоваться их поддержкой"
 FRA_Benefit_from_our_Supporters_desc:0 "Эта \"Большая игра\" сейчас в нашу пользу, и мы воспользуемся нашей популярностью в генеральном штабе."
 FRA_Bring_Back_Villiers:0 "Работать с Вилье"
 FRA_Bring_Back_Villiers_desc:0 "Армейский генерал Пьер де Вилье обладает влиянием и политическим рычагом в генеральном штабе французских вооружённых сил; он готов сотрудничать с нами, чтобы попытаться умерить их деспотическую риторику."
