l_russian:
 FRA_the_french_armed_forces:0 "Состояние вооружённых сил"
 FRA_the_french_armed_forces_desc:0 "По итогам нашего всеобъемлющего десятилетнего обзора Вооружённых сил Франции поступающие доклады вызывают тревогу. Наши вооружённые силы недофинансировались и отстают от наших европейских союзников. Перед лицом таких тревожных известий наши генералы требуют, чтобы администрация действовала немедленно. К счастью, наше правительство официально утвердило увеличение бюджета Вооружённых сил Франции более чем на четырнадцать миллионов евро, что позволит нашей армии модернизироваться на рубеже десятилетия.\n\nНаша армия не останется позади в такое время, и ради безопасности и успеха Франции сейчас, как никогда, пора действовать. Франция вновь достигнет того положения и той чести, которые у неё были, когда она была военной державой Европы."
 FRA_unify_the_DSGE_DSGI:0 "Объединить DGSI и DGSE"
 FRA_unify_the_DSGE_DSGI_desc:0 "Мы вступаем в новую эпоху для нашей страны, когда нам нужна более тесная связь между службами внутренней и внешней разведки, и потому... DGSN, или Главное управление национальной безопасности, будет обеспечивать защиту как внутри страны, так и за её пределами."
 FRA_dsgn_creation_tt:0 "По завершении мы создадим §CГлавное управление национальной безопасности, или DGSN§!"
 FRA_the_french_airforce:0 "Перестроить наши военно-воздушные силы"
 FRA_the_french_airforce_desc:0 "Наши ВВС были, без сомнения, одной из самых отстающих ветвей Вооружённых сил Франции: для модернизации нынешнего воздушного флота делалось крайне мало. Сейчас мы сотрудничаем с несколькими авиастроительными корпорациями, такими как Dassault Aviation, чтобы разработать возможные решения и привести французские ВВС в современную эпоху с невиданными прежде уровнями превосходства и мощи. Благодаря этим усилиям пройдёт совсем немного времени, прежде чем Франция станет владычицей небес."
 FRA_the_race_for_the_fifth_generation_fighter:0 "Французский истребитель пятого поколения"
 FRA_the_race_for_the_fifth_generation_fighter_desc:0 "Благодаря недавним прорывам в авиационном подразделении наших исследований и разработок у нас наконец появилась долгожданная возможность вывести на новый уровень следующее поколение наших ВВС. Французский истребитель пятого поколения — одна из самых передовых концепций, которые мы видели, и мы обязаны этим воспользоваться. Франция станет пионером будущего воздушной войны, как только явит миру этот передовой истребитель пятого поколения."
 FRA_ramp_up_the_production_of_the_Dassalut_Rafale:0 "Наладить серийное производство Rafale"
 FRA_ramp_up_the_production_of_the_Dassalut_Rafale_desc:0 "Rafale всегда исправно служил нашей армии, и после нескольких доработок и щедрого финансирования Dassault мы в кратчайшие сроки сможем начать серийное производство наших истребителей. Учитывая исключительные характеристики и возможности, которые продемонстрировал Rafale, мы, если всё пойдёт по плану, сможем к концу десятилетия превзойти российские ВВС по объёмам производства."
 FRA_conduct_major_improvments:0 "Отточить авиационное мастерство"
 FRA_conduct_major_improvments_desc:0 "Наши ВВС отстают не только технологически: наши профессионалы, выражаясь мягко, утратили то превосходство, которое когда-то определяло нашу авиацию. Решением стало начало всеобъемлющей перестройки действующей авиационной программы французских ВВС — устранение недостатков и постепенного упадка, с которыми мы сталкивались годами, и переход к пути, на котором наша авиация будет неуклонно совершенствоваться и подниматься выше конкурентов."
 FRA_deveop_domestic_drones:0 "Развивать собственные возможности"
 FRA_deveop_domestic_drones_desc:0 "Чтобы достичь самодостаточности и снизить зависимость от внешних источников, Франция отдаст приоритет развитию собственных возможностей в оборонной промышленности, поощряя инновации и сотрудничество и создавая устойчивую основу для поддержания передовой армии."
 FRA_expand_our_airfields:0 "Наращивать авиационные возможности на востоке"
 FRA_expand_our_airfields_desc:0 "Признавая геополитическое значение восточного театра, Франция стратегически усилит свои авиационные возможности в регионе: развернёт дополнительные ресурсы, создаст передовые операционные базы и проведёт совместные учения с союзными государствами."
 FRA_aerial_defense:0 "Усовершенствовать SAMP/T"
 FRA_aerial_defense_desc:0 "Ракетная система Sol-Air Moyenne Portée Terrestre служит Франции в качестве основной системы ПВО с момента её создания в прошлом десятилетии. Чтобы обеспечить максимальную эффективность и надёжную противовоздушную оборону, которой Франция заслуживает, мы поручили первоначальным разработчикам SAMP/T переработать и обновить эту систему противоракетной обороны. По мере развития и эволюции воздушной войны должны расти и наши возможности защищать себя."
 FRA_aerial_offense:0 "Последний рубеж"
 FRA_aerial_offense_desc:0 "Космос всегда считался истинной конечной целью любой великой державы, желающей по-настоящему превзойти то, что считалось возможным для человека. Пришло время показать миру, что Франция стремится к большему, чем многие от нас ожидают. Франция откроет собственную космическую программу, и со временем наш флаг будет на Луне наряду с флагами других великих держав, таких как Соединённые Штаты. Мир вскоре поймёт, что Франция будет править звёздами, как нам было предначертано."
 FRA_the_french_navy:0 "Реформировать французскую военно-морскую практику"
 FRA_the_french_navy_desc:0 "Французский военно-морской флот — одна из немногих ветвей, выдержавших испытание годами, но даже он отчаянно нуждается в реформе. Наша гордость, «De Gaulle», уступает американским и британским авианосцам нашего времени. Мы должны идти в ногу со временем, иначе французский флот начнёт отставать и вновь сильно подорвёт наше глобальное влияние."
 FRA_upgrade_our_submarine_fleet:0 "Модернизировать подводный флот"
 FRA_upgrade_our_submarine_fleet_desc:0 "Признавая ключевую роль подводных лодок в современной морской войне, Франция начнёт масштабную модернизацию своего подводного флота, разрабатывая подводные лодки нового поколения, оснащённые самыми передовыми технологиями, чтобы сохранить непревзойдённые подводные возможности."
 FRA_develop_our_home_ports:0 "Расширить существующие порты"
 FRA_develop_our_home_ports_desc:0 "Чтобы удовлетворить растущие потребности нашего флота и усилить логистические возможности, Франция предпримет стратегическую инициативу по расширению существующих портов, улучшая военно-морскую инфраструктуру для эффективного перемещения флота и обеспечения длительных морских операций."
 FRA_conduct_neccesary_improvments:0 "Провести пан-средиземноморские учения"
 FRA_conduct_neccesary_improvments_desc:0 "Лучшего момента для подготовки нашего флота не найти, ведь наши политики средиземноморства полностью в силе. С ростом усилий Франции по сотрудничеству со средиземноморскими союзниками нам нужно быть активнее в укреплении единства и тесных связей с нашими современниками. Недавно мы пригласили итальянский, испанский и греческий флоты провести военно-морские учения, чтобы взбодрить наши флоты и подготовить их к любым возможным предвидимым сценариям. Чтобы обеспечить успех на морях, необходимо тесно работать с другими великими флотами Средиземноморья."
 FRA_smaller_boat_stuff:0 "Держать курс"
 FRA_smaller_boat_stuff_desc:0 "Поддержание стабильности и преемственности наших оборонных возможностей первостепенно. Делая упор на регулярную подготовку, обслуживание техники и оперативную готовность во всех ветвях вооружённых сил, Франция стремится обеспечить надёжную и грозную оборонную позицию."
 FRA_begin_the_project_for_the_new_carrier_flagship:0 "Заменить De Gaulle"
 FRA_begin_the_project_for_the_new_carrier_flagship_desc:0 "Осознавая меняющуюся динамику морской авиации, Франция начнёт замену авианосца Charles de Gaulle. Этот амбициозный проект призван ввести в строй современный и многоцелевой авианосец, оснащённый новейшими технологиями и способный проецировать силу по всем морям, играя центральную роль в защите французских морских интересов и глобального стратегического влияния."
 FRA_A_Strong_France_is_a_Strong_Europe:0 "Независимая армия"
 FRA_A_Strong_France_is_a_Strong_Europe_desc:0 "Слишком долго бесполезная бюрократия и политизация НАТО лишали Францию бесчисленных часов и эффективности её вооружённых сил. Теперь Франции пора идти собственным путём к величию, не растрачивая свои ресурсы и бюджет. Франция докажет не только своим европейским соседям, но и всему миру, что она не только самодостаточна, но и одна из великих военных держав."
 FRA_Through_Europe_we_are_Strong:0 "Через Европу мы сильны"
 FRA_Through_Europe_we_are_Strong_desc:0 "Европа всегда была сильнее единой, чем разобщённой, и тому бесчисленные примеры в нашей истории — от Второй мировой войны до глобальной войны с терроризмом. Поэтому пора понять: чем дольше мы остаёмся врозь, тем слабее становимся, а русские лишь делаются всё более нестабильными и непредсказуемыми. Мы пошлём послание не только по континенту, но и по всему миру: Европа всегда будет вместе, что бы ни случилось, в эти времена глобальной нестабильности и радикализма. "
 FRA_Support_a_Pan_European_Military:0 "Поддержать средиземноморство"
 FRA_Support_a_Pan_European_Military_desc:0 "Средиземное море всегда давало стратегические преимущества не только нашей стране, но и всей истории Европы: несколько великих империй и держав происходили из этого региона. Римляне, македонцы и даже карфагеняне правили известным миром со Средиземноморья. Ради успеха Европы мы должны учитывать стратегическую важность Средиземного моря и соседних с ним стран — наших испанских, итальянских и греческих союзников — поддерживая их насколько возможно политически и даже экономически."
 FRA_Support_Western_Mediterrenian_Militaries:0 "Создать объединённые военные бюджеты"
 FRA_Support_Western_Mediterrenian_Militaries_desc:0 "В рамках усилий по дальнейшему сотрудничеству с европейскими союзниками мы собрали комиссию с британцами, немцами и итальянцами, чтобы выработать действенный бюджет для максимальной эффективности и результативности. При возросшем взаимодействии с союзниками очевидно, что у всех нас схожие устремления и цели. Чтобы Европа добилась успеха в новую эпоху, мы должны стоять единым фронтом перед лицом неопределённости и сотрудничать везде, где можем."
 FRA_Further_Eurail_Integration:0 "Углубить интеграцию Eurail"
 FRA_Further_Eurail_Integration_desc:0 "Чтобы повысить европейскую мобильность и военную эффективность, Франция выступит за дальнейшую интеграцию сетей Eurail. Улучшение совместимости, логистической эффективности и возможностей быстрого развёртывания войск будет способствовать более гибкой и отзывчивой европейской оборонной инфраструктуре."
 FRA_Heart_of_the_European_Navy:0 "Пакт о военно-морском объединении Средиземноморья"
 FRA_Heart_of_the_European_Navy_desc:0 "Стремясь укрепить региональную морскую безопасность, Франция будет добиваться пакта о военно-морском объединении со средиземноморскими странами. Эта инициатива направлена на координацию морских операций, обмен разведданными и совместные учения, чтобы сформировать единый фронт против морских угроз в Средиземноморье."
 FRA_Revive_Latin_Bloc_Militarism:0 "Пакт об объединении средиземноморского командования"
 FRA_Revive_Latin_Bloc_Militarism_desc:0 "Чтобы укрепить региональную стабильность, Франция будет добиваться пакта об объединении командования со средиземноморскими странами, согласовывая структуры военного командования и облегчая совместное планирование быстрых ответов на потенциальные угрозы на средиземноморском театре."
 FRA_Western_Mediterrenian_Mechanization:0 "Развивать технологию механизации"
 FRA_Western_Mediterrenian_Mechanization_desc:0 "Механизация французской пехоты стала одним из самых радикальных изменений нашей армии в современную эпоху. Чтобы обеспечить успех нашей пехоты, мы продолжим отдавать приоритет совершенствованию механизированных машин, таких как наши бронетранспортёры и боевые машины пехоты. Современную форму войны, какой мы её знаем, покорит французская инновация и прогресс наших технологий."
 FRA_Strengthen_the_SNCF:0 "Расширить SNCF"
 FRA_Strengthen_the_SNCF_desc:0 "Признавая ключевую роль транспорта в военной логистике, Франция расширит Société Nationale des Chemins de fer Français, увеличивая железнодорожную инфраструктуру, улучшая сообщение и обеспечивая эффективную мобилизацию войск и ресурсов по всей стране."
 FRA_Privatize_the_SNCF:0 "Приватизировать SNCF"
 FRA_Privatize_the_SNCF_desc:0 "Чтобы повысить эффективность и инновационность железнодорожного транспорта, Франция проведёт приватизацию SNCF, внедряя рыночную динамику, поощряя конкуренцию и улучшая общие показатели железнодорожного сектора ради более гибкой и адаптивной транспортной сети."
 FRA_Industrialize_the_countryside:0 "Милитаризация сельской местности"
 FRA_Industrialize_the_countryside_desc:0 "Чтобы укрепить обороноспособность страны и повысить устойчивость, Франция начнёт программу милитаризации сельской местности, интегрируя военное присутствие и инфраструктуру в сельские районы и обеспечивая рассредоточенную и прочную оборонную позицию, способную эффективно реагировать на угрозы по всей территории страны."
 FRA_Create_Independent_Military_Strategies:0 "Создать независимые военные стратегии"
 FRA_Create_Independent_Military_Strategies_desc:0 "После нашего недавнего шага по отделению армии от объединённого командования НАТО мы должны заняться разработкой новых стратегий, позволяющих нашей армии действовать самостоятельно, без помощи европейских союзников. Франция вновь возьмёт на себя управление собственной армией и покажет остальной Европе, что без неё нам лучше и что мы даже более дееспособны, когда нас не тормозит их бессвязное военное командование."
 FRA_A_New_Age_of_Heavy_Tanks:0 "Модернизировать тяжёлые танки"
 FRA_A_New_Age_of_Heavy_Tanks_desc:0 "Чтобы сохранить бронетанковое превосходство, Франция начнёт всеобъемлющую программу модернизации тяжёлых танков, оснащая существующий танковый парк передовыми технологиями, чтобы он оставался на переднем крае возможностей бронетанковой войны."
 FRA_Deploy_Moving_Castles:0 "Рождение «передвижных замков»"
 FRA_Deploy_Moving_Castles_desc:0 "Вводя революционную концепцию мобильной обороны, Франция станет свидетелем разработки высокомобильных и тяжелобронированных частей, способных к быстрому развёртыванию и эффективному ответу на динамичные сценарии поля боя."
 FRA_Independence_from_the_Eurail:0 "Независимость от Eurail"
 FRA_Independence_from_the_Eurail_desc:0 "Чтобы обеспечить свободу передвижения и логистическую независимость, Франция будет стремиться снизить зависимость от сетей Eurail в военных перевозках, развивая альтернативные способы транспортировки, повышая стратегическую мобильность и укрепляя нашу способность к самостоятельным военным операциям."
 FRA_Expand_Domestic_Capabilities:0 "Поддержать отечественных оружейников"
 FRA_Expand_Domestic_Capabilities_desc:0 "Thales Group, PGM, MBDA и Renault десятилетиями остаются давними производителями вооружений, снабжающими Вооружённые силы Франции с послевоенной эпохи. Теперь нашему правительству предстоит сделать свою часть и побудить армию закупать снаряжение и оружие у отечественных производителей, отойдя от чрезмерной зависимости от зарубежной техники."
 FRA_Rejuvinate_Recruitment_Centers:0 "Оживить призывные пункты"
 FRA_Rejuvinate_Recruitment_Centers_desc:0 "Чтобы поддерживать квалифицированную и мотивированную армию, Франция оживит призывные пункты: модернизирует процедуры набора, расширит информирование и введёт стимулы, призванные привлечь лучшие кадры на службу в вооружённых силах."
 FRA_Research_and_Development:0 "Увеличить военные инвестиции в НИОКР"
 FRA_Research_and_Development_desc:0 "Осознавая императив технологического превосходства, Франция значительно увеличит инвестиции в военные исследования и разработки, продвигая инновации, способствуя созданию передовых оборонных технологий и обеспечивая нашим вооружённым силам место в авангарде военного потенциала."
 FRA_Second_times_a_Charm:0 "От имени народа"
 FRA_Second_times_a_Charm_desc:0 "Мы выиграли президентскую гонку, Марин Ле Пен находится на вершине Франции — это сильный сигнал либеральной «Ренессанс» и Европейскому союзу. Нас избрали от имени народа, чтобы мы исполнили мандат. Очень важный мандат. Дать народу упорядоченную, сильную и уравновешенную Францию. Восстановить французские традиции и ограничить политику открытых дверей Макрона и его союзников. Мы исполним этот мандат ради Франции, мы обуздаем наших радикалов, мы снова сделаем Францию безопасной, сильной и гордой."
 FRA_Fight_Party_Radicals:0 "Бороться с радикализмом в партии"
 FRA_Fight_Party_Radicals_desc:0 "Некоторые элементы «Национального объединения» по-прежнему остаются осколками клики отца: до эпохи Марин была эпоха Жан-Мари, отца Марин. Тогда «Национальное объединение» действительно было тем, чем сегодняшние критики называют его сейчас, но некоторые члены партии не признают, что они — реликты прошлого, которое следует забыть. Марин Ле Пен расширила горизонты партии и повела её к новому будущему, а тех, кто ближе к «Национальному объединению» восьмидесятых, нужно отодвинуть в сторону и отправить на покой. Мы никогда не будем извиняться за наше прошлое, но мы должны смотреть в будущее."
 FRA_Protect_French_Interests:0 "Американская реальная политика"
 FRA_Protect_French_Interests_desc:0 "Америка всегда вела отличную политику в пору своего могущества: говорить твёрдо и держать большую дубину. Франция находится на континенте идеологических соперников, полных решимости уничтожить собственную национальную гордость и навязать нам то же разрушение. Чтобы утвердиться в мире, будучи малой частью ЕС, мы должны держать очень большую дубину и говорить очень твёрдо. В Африке, в Европе и за их пределами мы должны заявить о своём присутствии и ясно дать понять, что Франция будущего предназначена быть такой же, как Франция прошлого: сильной и влиятельной в мировом масштабе. Мы не согласимся быть второй скрипкой Германии в некой европейской федерации — мы будем сильным и суверенным государством!"
 FRA_National_Unity_Government:0 "Провозгласить правительство национального единства"
 FRA_National_Unity_Government_desc:0 "То, что мы политически противники, вовсе не значит, что все мы не можем стремиться к процветанию Франции: либералы могут быть полезны своими деловыми связями, социалисты по крайней мере говорят, что заботятся о народе, — ничто не мешает нам пригласить оппозицию объединиться с нами! Франция сильнее единой, чем разделённой, и это верно для любой страны, да и, по правде, для чего угодно. Правительство национального единства после пандемии, нефтяного кризиса и краха Америки — лучшего времени для того, чтобы Франция объединила свои политические усилия ради процветания и развития, не найти. Кто бы стал возражать? Лишь предатель-идеолог, человек, который прежде партиец, а уж потом француз."
 FRA_Law_and_Order:0 "Политика «закона и порядка»"
 FRA_Law_and_Order_desc:0 "Фотография ложится на стол перед Ле Пен, выскользнув из картонной папки. Полыхающее пламя на переднем плане Триумфальной арки, перевёрнутая и сгоревшая машина, протестующие в чёрном и жёлтых жилетах ликуют, а если приглядеться, бутылка с зажигательной смесью летит прочь от камеры, в сторону полицейской цепи. Ле Пен всегда испытывала отвращение к насилию протестующих. Они выступают за рабочего человека, но жгут его машину и громят его рабочее место, точно животные. Хватит этой бессмыслицы. Мы услышали вас ещё до того, как вы начали сжигать наших полицейских заживо; в ближайшие дни мы разработаем закон, который некоторые назовут драконовским, но для нас? Для Ле Пен? Для того бедняги, которому принадлежала та машина? Это разумно, и давно пора положить конец ущербу в миллионы долларов, который эти хулиганы наносят общественной и частной собственности."
 FRA_Set_Immigration_Limit:0 "Франция прежде всего"
 FRA_Set_Immigration_Limit_desc:0 "НАТО и Европейский союз — драгоценные вещи, но ничто не должно быть и не является драгоценнее собственной родины. Францию нельзя ставить после международных интересов, французские компании не могут проигрывать на французской земле иностранному бизнесу. Франция уже обладает самыми сильными вооружёнными силами в Европе, и всё же этого недостаточно — мы станем сильнее. Наши силы и наша экономика вырастут. Европа не сможет рассчитывать на французские спасения или французскую технику: пусть Германия продаёт свой танковый парк за границу, мы сохраним наши Leclerc и удвоим их число. Франция прежде всего должна быть готова — экономически, военно и морально. Если не готова она, то не будет готова и вся Европа. В такие времена мы должны взять на себя роль пастыря, пока дикая Америка разрывает себя на части."
 FRA_France_First:0 "Франция прежде всего"
 FRA_France_First_desc:0 "НАТО и Европейский союз — драгоценные вещи, но ничто не должно быть и не является драгоценнее собственной родины. Францию нельзя ставить после международных интересов, французские компании не могут проигрывать на французской земле иностранному бизнесу. Франция уже обладает самыми сильными вооружёнными силами в Европе, и всё же этого недостаточно — мы станем сильнее. Наши силы и наша экономика вырастут. Европа не сможет рассчитывать на французские спасения или французскую технику: пусть Германия продаёт свой танковый парк за границу, мы сохраним наши Leclerc и удвоим их число. Франция прежде всего должна быть готова — экономически, военно и морально. Если не готова она, то не будет готова и вся Европа. В такие времена мы должны взять на себя роль пастыря, пока дикая Америка разрывает себя на части."
 FRA_The_Peoples_Victory:0 "Победа народа"
 FRA_The_Peoples_Victory_desc:0 "Хотя это было неожиданно и стало потрясением для многих, НФП одержал победу на французских выборах 2022 года после череды событий, вытолкнувших нас в центр внимания. Но победив, мы ещё не можем праздновать: армия против нас, и [FRA.GetLeader] будет невероятно трудно протолкнуть наши программы во враждебной и непривычной обстановке."
 FRA_Demand_Military_Loyalty:0 "Разобраться с армией"
 FRA_Demand_Military_Loyalty_desc:0 "Хотя формально они не связаны с французским управлением, наши военные имеют сильное влияние на политику Республики. Кроме того, они активно действуют против нас даже после нашей демократической победы, видя в нас угрозу своей олигополии над Французской Республикой. С ними нужно разобраться, и быстро."
 FRA_Unite_the_Left:0 "Объединить фронт"
 FRA_Unite_the_Left_desc:0 "Хотя теоретически мы единый фронт, на деле мы объединяем широкую коалицию различных левых сил, согласных лишь в самых основах. Даже после избрания [FRA.GetLeader] президентом наша коалиция остаётся рыхлой и шаткой. Чтобы двинуть левых вперёд, мы должны закрепить НФП как подлинный союз партий, а не просто блок для победы на выборах."
 FRA_Empower_the_Young_Jacobins:0 "[FRA_Empower_the_Young_Jacobins_loc]"
 FRA_Empower_the_Young_Jacobins_desc:0 "Видя наши успехи, социализм, естественно, распространится по всей Европе. Демократическая революция не будет вынуждена оставаться лишь во Франции: мы экспортируем счастье и процветание нашего народа дальше — по всему Европейскому союзу, будь то на национальном уровне или в Европейском парламенте, ради общего блага."
 FRA_Empower_the_Young_Jacobins_melenchon:0 "Подъём европейского социализма"
 FRA_Empower_the_Young_Jacobins_faure:0 "Объединить европейскую социал-демократию"
 FRA_Empower_the_Young_Jacobins_ruffin:0 "Наши европейские товарищи"
 FRA_Referendum_on_a_New_Constitution:0 "Референдум о Шестой республике"
 FRA_Referendum_on_a_New_Constitution_desc:0 "Как показало правление Макрона, монархическая склонность и централизация Пятой республики стали серьёзным откатом для демократических принципов нашей страны, приблизив нас ко временам до революции, которая и сделала нас оплотом демократии. Естественно, Шестая республика должна быть создана народом и для народа — то, чего он хочет и желает от Франции. Да здравствует 6-я Республика!"
 FRA_Expand_the_Welfare_State:0 "Расширить социальное государство"
 FRA_Expand_the_Welfare_State_desc:0 "Хотя в этом секторе уже достигнуты большие успехи, этого недостаточно. Государство должно существовать, чтобы служить народу, а не просто предоставлять ему льготы. Программа социального обеспечения для всех должна стать неотъемлемой частью Французской Республики, а не просто изменяемым элементом внутри неё."
 FRA_A_True_Commander_in_Chief:0 "Истинный главнокомандующий"
 FRA_A_True_Commander_in_Chief_desc:0 "Пьер де Вилье — настоящий командир, подходящий для этой роли. Его долгая и блистательная карьера в Вооружённых силах Франции была омрачена, когда Макрон уволил его с должности министра обороны. Но уволен он был по политическим причинам; мы, народ, по-прежнему видим в Вилье уважаемого командира, и многие другие генералы обращаются к нему за наставлением. Лидер такого калибра не появлялся со времён де Голля. Троекратное «ура» президенту!"
 FRA_Rehabilitate_Reconquete:0 "Реабилитировать «Реконкисту»"
 FRA_Rehabilitate_Reconquete_desc:0 "Земмур и его ультраконсерваторы, по сути, патриоты до мозга костей. Партию против иммиграции возглавляет еврей-иммигрант из Алжира во втором поколении; его роль в крайне правом движении всегда встречала недоумение у противников и странный приём у соотечественников. Жан-Мари Ле Пен однажды сказал, что французы его часто проклинают, а евреи были очень добры. Вернём эту благодарность Земмуру: «Национальное объединение» примет его с распростёртыми объятиями, и мы будем стремиться работать вместе в коалиции против тех, кто хотел бы держать Францию слабой."
 FRA_Cement_Military_Control:0 "Закрепить военный контроль"
 FRA_Cement_Military_Control_desc:0 "Ни для кого не секрет, какое большое влияние имела армия во Франции: под руководством де Голля армия остаётся сдерживающей силой, подобно армии в Турции, отстаивая определённые идеалы в государстве и удерживая страну на определённом курсе. При де Вилье? Это будет закреплено.\n\nРоль армии как сдерживающей силы — священное право, добытое в бою ради восстановления Республики, ослабленной Даладье и Народным фронтом до него. Именно де Голль сражался за освобождение Франции и поддержку Сопротивления, пока гражданское правительство находилось в изгнании; мы не можем об этом забыть."
 FRA_A_New_Aristocracy:0 "Новая аристократия"
 FRA_A_New_Aristocracy_desc:0 "Деньги говорят, а опыт побеждает. Нынешний высший класс Франции настолько озабочен социальной справедливостью здесь, что забывает: армия — главный способ бороться с несправедливостью где угодно, а единственный способ положить еду на тарелку — это не усложнять бизнес, а не регулировать каждую мелкую лавку, едва сводящую концы с концами. Нам нужна новая интеллигенция и новый высший класс, состоящий из военных и деловых людей. Франции нужно зарабатывать деньги и создавать рабочие места, потому что рабочие места означают стабильность, стабильность означает детей, а дети означают надёжное будущее. Аристократия, чья первейшая забота — будущая сила Франции, — это долгосрочная выгода."
 FRA_Play_into_Napoleonic_Overtones:0 "Сыграть на наполеоновских мотивах"
 FRA_Play_into_Napoleonic_Overtones_desc:0 "Военного лидера во Франции всегда будут сравнивать с Наполеоном; никогда не было более знаменитого полководца. Националист назовёт ту эпоху истинным рождением французской нации, и даже республиканец не может отрицать прогресс, достигнутый при его правлении: во Франции военное правление не всегда считается чем-то плохим. Де Голль вернул нас на верный путь, и вновь де Вилье доверено вести Францию в пору политической разобщённости, военной слабости и национальной деградации. Как и Наполеон до нас, Франция вступает в новый период, и лучшего кормчего для грядущей бури нам не найти."
 FRA_Birth_of_a_French_Military_Industrial_Complex:0 "Французский военно-промышленный комплекс"
 FRA_Birth_of_a_French_Military_Industrial_Complex_desc:0 "Почему только у Германии и Америки должны быть огромные оружейные производители? Raytheon, Rheinmetall, H&K — эти компании практически гарантированно получают государственные контракты от своих стран, а наше правительство медлило с введением подобной системы, разрушая дирижизм де Голля. Мы должны вернуться к поддерживаемой государством промышленности в военной сфере: свободный рынок больше не годится в эпоху, когда гиганты пожирают нас, словно мы гниющие трупы, пища для восточных стервятников, которых мы когда-то держали в клетке."
 FRA_The_French_Reagan_Category:0 "Великий стратег"
 FRA_The_French_Reagan_Category_desc:0 "\n\n\n\n\n£GFX_FRA_great_strategist_cat\n\n\n\n\n\n\n\nПока Пьер де Вилье стоит у руля Франции, разворачивается эпоха преобразований, отмеченная стратегическими реформами, которые обещают изменить военный и политический облик страны. Воздух полон ожидания, когда де Вилье представляет видение, направленное на повышение военной эффективности и укрепление национальной безопасности, вселяя гордость в каждого гражданина.\n\nС каждой реформой армия становится всё более грозной силой, приспосабливаясь к современным вызовам и обеспечивая безопасность и процветание французского народа. Де Вилье уделяет приоритетное внимание реструктуризации оборонных бюджетов, введению новаторских программ подготовки и налаживанию прочных связей с оборонной промышленностью. Цель ясна: создать армию, которая не только защищает нацию, но и воплощает дух стойкости и силы, определяющий Францию."
 FRA_Calm_Militarists_decision:0 "Умерить милитаристскую риторику"
 FRA_Correct_the_Trickle_Down_system_decision:0 "Исправить экономику просачивания"
 FRA_Coordinate_a_March_decision:0 "Организовать демонстрацию силы"
 FRA_A_Unified_General_Staff_decision:0 "Объединить генеральный штаб"
 FRA_Perfection_of_Strategy_decision:0 "Совершенствование стратегии"
 FRA_Utilize_Zemmour_decision:0 "Использовать Земмура"
 FRA_Play_into_ultraconservativism_decision:0 "Потакать ультраконсерваторам"
 FRA_Promote_Nationalist_Education_villiers:0 "Продвигать националистическое образование"
 FRA_Remove_the_French_Cancer:0 "Вскрыть левых"
 FRA_Soviet_Fearmongering_villiers:0 "Русская угроза"
 FRA_All_Hands_on_Deck_villiers:0 "Всё для государства"
 FRA_Mass_Militarization:0 "Массовая милитаризация"
 FRA_A_French_Renessiance:0 "Триумф народа"
 FRA_A_French_Renessiance_desc:0 "Франция ликует: народ вновь решил, что демократические ценности останутся победоносными над крайне правыми. Когда бремя выборов позади, правительство стремится вернуть добрую волю граждан, проводя реформы — восстановить новое чувство единства и национальной гордости по всей стране. Голос народа услышан, и теперь мы должны построить Францию для всех."
 FRA_Entrench_Centrism:0 "Укоренить центризм"
 FRA_Entrench_Centrism_desc:0 "После почти равного исхода выборов становится очевидно: чтобы наши реформы не только прошли, но и остались на века, мы должны вписать свои убеждения и ценности в самое сердце французской политики. Для этого мы начали обращаться к оппозиции, чтобы начать диалог и активное сотрудничество по реформам на благо французского народа. С таким срединным подходом к нашей политике и реформам мы сможем лучше охватить нацию и, будем надеяться, избежать повторения политического раскола, вызванного последними годами этой администрации и выборами."
 FRA_Uphold_European_Values:0 "Отстаивать европейские ценности"
 FRA_Uphold_European_Values_desc:0 "В отличие от нашей оппозиции, мы твёрдо привержены ценностям, которые Европейский союз устанавливает для стран континента. Мы посвящаем все возможные ресурсы защите основных ценностей Европейского союза через демократию, сотрудничество и общение. Мы позаботимся о том, чтобы Европа оставалась сильной благодаря экономическому партнёрству, и будем добиваться общих политик для защиты наших идеалов. Единая Европа, в которой Франция продвигает идеи и ценности Европейского союза, простоит долго после окончания нашей администрации."
 FRA_Work_with_our_Opposition:0 "Работать с оппозицией"
 FRA_Work_with_our_Opposition_desc:0 "Чтобы обеспечить долговечность нашего прогресса и правительства, становится очевидным: между нашей партией и оппозицией необходимо срочное сотрудничество. Проведены переговоры и консультации, и с этого момента консерваторы вместе с нашим либеральным правительством стремятся обеспечить двухпартийность и сотрудничество, пока мы движемся к сильной Франции перед лицом российской агрессии и глобальной нестабильности."
 FRA_Expand_our_Mediterranean_Influence:0 "Расширить средиземноморское влияние"
 FRA_Expand_our_Mediterranean_Influence_desc:0 "Средиземное море всегда имело огромное значение для европейского континента и для Франции как нации. Чтобы расширить наше влияние и присутствие в мире в свете недавних событий, мы приобретём островное государство Мальта, поддержав его экономические возможности и разделив его культуру с Францией, а также обеспечив безопасность острова. Это приобретение принесёт большую пользу Франции, как и народу Мальты, в ближайшие годы."
 FRA_Push_for_EU_Reform:0 "Добиваться реформ ЕС"
 FRA_Push_for_EU_Reform_desc:0 "Когда политический кризис во Франции наконец остановлен, у нас теперь есть опыт опасностей нестабильности и радикализации. Мы будем добиваться от Европейского союза необходимых реформ, чтобы не допустить на остальной части континента того, что случилось во Франции. Укрепление Европейского союза в эту тревожную пору пойдёт на пользу не только народам Европы, но и всему миру, пока мы противостоим экстремизму и ненависти. Франция должна показать Европе успех в своих недавних испытаниях и обеспечить, чтобы Европа была местом прогресса и реформ."
 FRA_Godlike_posturing_flag:0 "Макрон ещё не сравнил себя с другим богом."
 FRA_national_embrrassment_flag:0 "Национальный позор"
 fra_left_nato:0 "Мы заняли антинатовскую позицию."
 fra_stay_nato:0 "Мы заняли пронатовскую позицию."
 FRA_fraud_1:0 "Завершил операцию «Фо»."
 FRA_fraud_2:0 "Завершил операцию «Нюль»."
 FRA_Created_Vaccine:0 "Уже создал вакцину."
 FRA_Authdem_Driot_Chemin_flag:0 "Старая гвардия уже захватила Движение."
 FRA_Nationalist_Driot_Chemin_flag:0 "Милитаристы уже захватили Движение."
 FRA_melenchon_candidate:0 "Жан-Люк Меланшон — лидер Народного фронта."
 FRA_faure_candidate:0 "Оливье Фор — лидер Народного фронта."
 FRA_ruffin_candidate:0 "Франсуа Рюффен — лидер Народного фронта."
 FRA_A_French_Conquest:0 "Реконкиста"
 FRA_A_French_Conquest_desc:0 "«Реконкиста» победила, наши военные благодетели об этом позаботились, Земмур занимает высшую государственную должность, и вместе с «Национальным объединением» в нашей коалиции мы начнём нашу великую Реконкисту Франции. Мы должны действовать быстро, пока инакомыслящие элементы не попытаются нас остановить: крестоносец не продвигается, наблюдая, действие — его друг, а броня тяжела, когда стоишь на месте."
 FRA_Halt_Immigration:0 "Остановить иммиграцию"
 FRA_Halt_Immigration_desc:0 "Африканские иммигранты массово наводнили нашу страну, а их правительства тем временем выгоняют нас с наших баз в регионе. Мы сражались, чтобы дать им стабильные дома, а теперь они даже их не хотят? Тем хуже. Франция посылала войска не для того, чтобы решать ваши проблемы, а вы затапливаете Францию — возвращайтесь домой и улучшайте свои страны! Нам не нужна ваша рабочая сила! Наш народ беднеет, пока вы раздуваете рынок неквалифицированного труда! Вашим странам нужна работа; вы, алжирцы, выгнали нас полвека назад, не ждите, что теперь мы будем вам подавать милостыню!\n\nБольше никакой иммиграции, более строгие законы и флот арендованных судов — мы уладим это в короткий срок. Некоторые будут молить о пощаде. Президент Земмур, конечно, еврей из Алжира, по происхождению, но его родители умели приспособиться, и сам он поступил так же — образцовый иммигрант, в отличие от миллионов хулиганов, что ныне в Европе."
 FRA_Administration_Simplification:0 "Упрощение администрации"
 FRA_Administration_Simplification_desc:0 "Франция стала очень бюрократической страной, её структура настолько византийская, что по-настоящему понять её внутренние механизмы невозможно без многонедельного углублённого курса. Объём и глубина французских нормативных указов заставили целую команду пять недель искать, что стоит сохранить, а что нет. Не говоря уже о тысячах ненужных правил ЕС и прочих, из-за которых обычный гражданин рвёт на себе волосы ради любой формальности, и политики тоже. Конечно, президентство уже могущественно, но мы можем упростить дела и сделать обладание властью немного легче."
 FRA_Rabid_Assimilation:0 "Взять пример с Квебека"
 FRA_Rabid_Assimilation_desc:0 "Квебек недавно принял строгие законы на фоне падения распространённости французского языка в регионе; она неуклонно снижалась, но люди в Монреале в конце концов решили, что хватит, сократив общую годовую миграцию всего до 50 000 человек, не позволяя заявителям более чем на 25 % принадлежать к одной национальности и требуя общественной интеграции для постоянного проживания. Законодательство ограничивает годовую иммиграцию очень малым процентом от общей численности населения и вынуждает иностранные группы быть разнородными, предотвращая образование сплочённых меньшинств, а также не просто поощряет, но и требует владения французским как условия долгосрочного проживания. Здесь, во Франции, небольшие поправки позволят нам использовать это себе на пользу: учиться у нашей бывшей колонии для нас ново, обычно ведь только Британия учится у своей."
 FRA_Put_France_Before_Europe:0 "Ставить Францию выше Европы"
 FRA_Put_France_Before_Europe_desc:0 "Было бы неправдой сказать, что Европейский союз и НАТО — сплошная помеха: Франция много лет извлекала выгоду из этого устройства и была одним из основателей ЕС. Но мы не можем поступать как прежде, отдавая приоритет чужому процветанию перед своим. Планировать свои экономические действия под всю Европу, а не под себя — разве мы не такая же нация, как они? Разве мы не можем планировать свою экономику, а они свою? Какое право имеем мы навязывать правила и какое право имеют они, особенно навязывать их нам? Пусть будут великими сами по себе, и если без нашей помощи они потерпят крах — это судьба, а судьбу нельзя избежать, лишь отсрочить."
 FRA_Reverse_Declinism:0 "Обратить упадничество вспять"
 FRA_Reverse_Declinism_desc:0 "С 1970 года Франция находится в состоянии постоянного упадка. Либеральное поколение 68-го, как называет его Земмур, повело Францию по пути национального самоубийства: национальная гордость была разрушена, а границы распахнуты для любого желающего. Мы наблюдали упадок Франции пятьдесят лет, и пятьдесят лет Земмур трудился на французском правом фланге против роста иностранных групп и особенно исламской чумы в наших границах ещё со времён Жан-Мари Ле Пена, и теперь он наконец вознаграждён за свою преданность.\n\nСам Земмур может протянуть руку и удушить лианы, которые так долго не давали Франции прыгнуть в XXI век львом: массовую иммиграцию, растущие расходы, всё более тёплые чувства к тому, чтобы отбросить нашу государственность ради некоего европейского супергосударства под властью Германии? Довольно. Традиция будет у руля государства, разум и логика твёрдо поставлены выше чувств мягкосердечных."
 FRA_VIC_160_days_malaise_tt:0 "После завершения этого фокуса «Мобилизационная хандра» истечёт через §Y160 дней§!."
 FPR_damage_divisions_tooltip:0 "Это §Rповредит§! силе дивизий в ряде городов Восточной Европы."
 FRA_will_win_next_election_tt:0 "§CЕсли не случится катастрофы, мы победим на выборах 2027 года§!."
 FRA_Caribbean_Occupation_Auth_tt:0 "Мы создадим оккупационную администрацию в Карибском бассейне."
 FRA_Corrupted_Presidential_Guard_tt:0 "Любого можно купить за цену, даже «неподкупных» людей Республиканской гвардии. Здесь смазанная ладонь, там обещания повышения. Их приведут на нашу сторону или, по крайней мере, заставят §Rзакрыть глаза...§!"
 FRA_seize_movement_warning_tt:0 "§RДвижение будет перехвачено этим крылом партии.§!"
 FRA_Recoup_our_Losses:0 "Возместить наши потери"
 FRA_Recoup_our_Losses_desc:0 "Правление Макрона во Франции осталось в истории как катастрофа одного срока: всего за пять лет он прошёл путь от открытого, улыбчивого и харизматичного человека до попытки стать своим «юпитерианским идеалом» — идеалом президента как верховной власти. С кем-то другим, возможно, это и удалось бы. «Ренессанс» был на пороге комфортного большинства в парламенте, но этому просто не суждено было сбыться."
 FRA_Embrace_the_New_Left:0 "Принять новую левую"
 FRA_Embrace_the_New_Left_desc:0 "Когда-то «Ренессанс» составлял треть политической оси, отдельный полюс между популистскими правыми и левыми, но без друзей «Ренессанс» не выживет. Усилия Меланшона, чтобы вывести левых в современную эпоху, принесли плоды, и единственный способ противостоять Ле Пен — работать вместе и держать кнут над собственной партией. Меланшон может быть противником, но противником, разделяющим многие наши политики и интересы. Коалиция против Ле Пен поможет нам обоим в ближайшие годы."
 FRA_Battle_Every_Legislation:0 "Бороться с консервативным законодательством"
 FRA_Battle_Every_Legislation_desc:0 "Ils ne passeront pas. Они не пройдут. Фраза, часто связанная с битвой при Вердене. Сегодня, в армрестлинге с французскими левыми, мы смотрим на Ле Пен и снова говорим: они не пройдут. «Национальное объединение» сведёт на нет всё, чего мы добились, весь прогресс центра и левых в правах трудящихся и социальной справедливости. Каждый новый закон — атака на труд наших предшественников в борьбе, длящейся больше четырёх десятилетий против медленно растущей хватки правых на власть."
 FRA_Investigate_Electoral_Integrity:0 "Расследовать честность выборов"
 FRA_Investigate_Electoral_Integrity_desc:0 "Мы ожидали потерь из-за нефтяного кризиса и COVID, но опросы предсказывали победу с отрывом в несколько пунктов. В Париже что-то гниёт, и мы начнём необходимые процедуры по всей стране, на национальном и местном уровне, используя судебную систему по максимуму, чтобы расследовать мошенничество «Национального объединения». Они скажут, что этого не было и что это охота на ведьм, но настоящие эти расследования или нет, они разделят общественное мнение и оттянут поддержку от Ле Пен и её прихлебателей; стоит лишь достаточно надавить на обвинения, и они станут фактом в глазах публики. Нужно лишь семя сомнения."
 FRA_Take_A_Stance_on_Federalization:0 "Новая позиция по федерализации"
 FRA_Take_A_Stance_on_Federalization_desc:0 "Макрон был одним из самых громких сторонников европейской федерализации, предлагая объединённую армию и более общую интеграцию права, экономики и даже полиции. Мы можем последовать этому пути, выбрав правильных партнёров по коалиции, или выступить против. Верно, что победа Ле Пен показывает политический сдвиг: став евроскептиками, мы можем улучшить свои позиции в опросах. Поставить Республику выше соседей — безусловно популярное решение, Макрон никогда этого не понимал, но даже принимая эту популярную позицию, мы не обязаны отказываться от Европы. Мы можем остаться проЕС, если выберем это. Мы действительно стоим на распутье между двумя путями — европейским или французским будущим, и выбор за нами."
 FRA_Uphold_Republican_Beliefs:0 "Отстаивать республиканские идеалы"
 FRA_Uphold_Republican_Beliefs_desc:0 "Liberté, Egalité, Fraternité. Основа нашей великой Республики: через пять республик, два королевства и две империи мы не утратили эти идеалы. Но мы можем их утратить, если не защитим. В наших собственных рядах сидит коварная клика традиционалистов, консерваторов, едва на две ступени выше Бурбонов. Революцию нужно защищать, и никто не знает этого лучше французов; Бог знает, мы не раз чувствовали их гнев в жёлтых жилетах.\n\nПротиводействовать Ле Пен так же просто, как указать на её политику как антиреспубликанскую: наши самые основные идеалы взывают к эгалитаризму и свободе, а она заперла бы протестующих и ставила бы французов выше всех остальных, даже ценой отчуждения меньшинств. Французская Республика никогда не основывалась на идеалах неуёмного национализма и необузданной ксенофобии; в наши первые дни мы даже пытались оторваться от Церкви, и хотя эта платформа была не столь популярна, это не значит, что мы должны разорвать труды 1793 года, чтобы создать некое новое, холощёное общество — безопасное, но слишком боящееся критиковать правительство."
 FRA_A_Denied_Destiny:0 "Наша отвергнутая судьба"
 FRA_A_Denied_Destiny_desc:0 "Ле Пен провалилась, её реформизм стоил нам выборов. Мы никогда не были популярны как умеренные правые центра — мы были партией действия и силы! Отставка Ле Пен — лучшее, что она сделала за многие годы. Теперь партией руководит Барделла; народ отказал нам в мандате из-за либерального статус-кво Макрона и его юпитерианских прихлебателей. Он не де Голль, он не таинственный человек в хрустальном замке, он хохочущий шакал на службе Брюсселя, и мы не будем сидеть сложа руки. Макрон увидит, как мы распутываем его драгоценную паутину дельцов и военных подхалимов; его союзники отступят от страха."
 FRA_Reintegrate_Radical_Forces:0 "Реинтегрировать радикальные силы"
 FRA_Reintegrate_Radical_Forces_desc:0 "Именно реформы «Национального объединения» привели к расколу правых: идентитаристы, «Реконкиста» Земмура. Если бы мы объединились на прошлых выборах, мы бы получили большинство. С Барделлой у руля партия Отца вернулась, а партия Дочери мертва. Радикалы вернутся в наши объятия, и вместе, в солидарности, мы поднимемся и будем услышаны. Да здравствует Франция!"
 FRA_Meet_with_Disgraced_Militarists:0 "Встретиться с опальными милитаристами"
 FRA_Meet_with_Disgraced_Militarists_desc:0 "Перед прошлыми выборами армия сыграла Мартина Лютера, прибивая требования к дверям правительства по всему Парижу; воинские части выдвинулись к периферии. Макрону и стране показалось, что возможен переворот, но это было лишь давление. Макрон отступил и твёрдо выстоял против военных требований; Ле Пен предложила показную поддержку, а затем не принесла победы. Армия убита горем из-за победы «Ренессанса» и продолжающегося ослабления французской армии, пока грубые орки собирают своих людей на востоке, готовые затоптать запад в хаотическом вакууме, оставленном Америкой. Барделла и армия обладают схожей волей — волей совершить внезаконное, чтобы обеспечить будущее Франции. Мы можем обещать их требования — и больше."
 FRA_Entangle_Electoral_Victory:0 "Саботировать либеральную академию"
 FRA_Entangle_Electoral_Victory_desc:0 "Либеральные элиты сегодня являются статус-кво не просто так: они контролируют образование. Как когда-то марксисты в славные дни Народного фронта. Если ты контролируешь школу, ты контролируешь учеников, ты учишь их добру и злу, ты учишь их молчать или кричать, ты направляешь их против тех, кого хочешь подавить, и они делают остальное; они воспитывают своих детей в той же индоктринации, затем дети их детей, и так далее. Элитная академия Франции гнила и разлагаема левыми глобалистами, безразличными к благополучию Франции и её народа перед интересами какой-нибудь деревни в глуши на другом конце планеты. Сколько погибло? Сколько предприятий и жизней разрушено в протестах, которые их образование разжигало? Довольно: срывай их деятельность, как только сможем, посылай людей в масках ночью избивать их в домах, вызывай угрозы бомб и сваливай всё на русских агитаторов и левых революционеров. Мы перенесём беспорядки, которые они разжигают, в их дома, и они замолчат. Они могут даже присоединиться к нам из страха."
 FRA_The_Right_Way:0 "Правильный путь"
 FRA_The_Right_Way_desc:0 "Правильный путь — это правильный путь. А что несёт левая? Инфляцию? Рост налогов? Больше соцобеспечения при меньшей отдаче, пока орды мусульман пожинают плоды твоего труда? Звони в «Ренессанс», если хочешь: «Ренессанс» в постели с Брюсселем и при случае продал бы всю страну ради реального шанса федерализовать Европу. Гибель Франции — не просто теория заговора, это предвыборная политика и долгосрочная стратегическая цель либералов. Только Барделла и «Национальное объединение» могут спасти Францию от левой повестки; только «Национальное объединение» может снизить твои налоги, положить пособия в твой карман и отправить мавров тонуть на плоту, на котором они приплыли. Голосуй за своего местного представителя «Национального объединения» и спроси в своей местной ячейке, как можно помочь партии; если ты здесь из-за нашего вооружённого крыла, потише и иди за мной."
 FRA_Stoke_Russian_Fears:0 "Разжигать страх русского господства"
 FRA_Stoke_Russian_Fears_desc:0 "Русские всегда были врагом Европы! Вероломные! Славянские! Едва лучше монгольской орды. Отсталая империя нас подвела: они заключили сделки с Германией и меньше чем за двадцать лет стали друзья-приятели с немцами, улыбаясь нам; Ялтинская конференция была для грузинской собаки разве что туалетной бумагой, а последний раз, когда соглашение с русскими соблюдалось, предшествует письменной истории, ибо у нас нет об этом записей. Думаешь, они соблюдут свои соглашения сейчас? Ты глупец, русский бот или безбожный коммунист, тоскующий по своей родине. Хватит лгать себе, Франция! Тебя проткнут на кремлёвских кострах, если ты не проснёшься к жёсткому новому миру, в котором мы живём сегодня!"
 FRA_Operation_Saint_Arnaud:0 "§YОперация§!: Даву"
 FRA_Operation_Saint_Arnaud_desc:0 "Русские были застигнуты врасплох нашей внезапной интервенцией в защиту Украины, но не остановились. Судя по новостям с фронта и разведдонесениям, вместо того чтобы остановиться и оценить ситуацию, русские удвоили усилия и влили ещё больше ресурсов в украинский натиск. Несмотря на опасения по поводу способности Украины выдержать бурю, обстоятельства дают потенциально золотую возможность. Русское внимание полностью приковано к Украине и попыткам организовать линию длиной в тысячу шестьсот километров, их ресурсы сильно напряжены. Это создало условия для дерзкой морской высадки за русскими линиями в районе Кубани. Этот плацдарм ещё сильнее нагрузит русскую живую силу и уже растянутые логистические ресурсы и, возможно, заставит их остановить наступательные операции, позволив нам организовать новые масштабные контратаки, пока медведь потерял равновесие. Успех закрепит нас как ведущего игрока; неудача недопустима, ибо на кону судьба Европы и честь Франции."
 FRA_Operation_Davout_decision:0 "§YОперация§!: Даву"
 FRA_NATO_war_category:0 "Европейская война"
 FRA_NATO_war_category_desc:0 "\n\n\n\n\n£GFX_SOV_NATO_war_category\n\n\n\n\n\n\n\nРусские вновь пытаются идти в Европу, чтобы отрезать себе империю... Остановить их — наша задача.\n\n§RГЛАВНЫЕ ЦЕЛИ§!:\n\n§YСЕВАСТОПОЛЬ§!: [GLOBAL.get_sevastopol_nato_status]\n§YМИНСК§!: [GLOBAL.get_minsk_nato_status]\n§YСАНКТ-ПЕТЕРБУРГ§!: [GLOBAL.get_petersburg_nato_status]\n§YРОСТОВ-НА-ДОНУ§!: [GLOBAL.get_rostov_nato_status]\n\n§RВТОРОСТЕПЕННЫЕ ЦЕЛИ§!\n\n§YКАЛИНИНГРАД§!: [GLOBAL.get_kaliningrad_nato_status]\n§YБЕЛГОРОД§!: [GLOBAL.get_belgorod_nato_status]\n§YВОЛГОГРАД§!: [GLOBAL.get_volgograd_nato_status]\n§YНОВГОРОД§!: [GLOBAL.get_novgorod_nato_status]\n§YДОНЕЦК§!: [GLOBAL.get_donetsk_nato_status]\n§YЛУГАНСК§!: [GLOBAL.get_luhansk_nato_status]\n\n§GГОРОДА СОЮЗНИКОВ§!\n\n§YКИЕВ§!: [GLOBAL.get_kiev_nato_status]\n§YОДЕССА§!: [GLOBAL.get_odessa_nato_status]\n§YТАЛЛИНН§!: [GLOBAL.get_tallinn_nato_status]\n§YВИЛЬНЮС§!: [GLOBAL.get_vilnius_nato_status]\n§YВАРШАВА§!: [GLOBAL.get_warsaw_nato_status]\n§YБУДАПЕШТ§!: [GLOBAL.get_budapest_nato_status]\n§YБУХАРЕСТ§!: [GLOBAL.get_bucharest_nato_status] \n\n§YОПЕРАЦИЯ ДАВУ§!: \n§5КЕРЧЬ§!: [GLOBAL.get_kerch_nato_status] \n§5НОВОРОССИЙСК§!: [GLOBAL.get_novorossiysk_nato_status] \n§5СОЧИ§!: [GLOBAL.get_sochi_nato_status]"
 FRA_davout_success_idea:0 "Успех на Кавказе"
 FRA_davout_success_flag:0 "§YОперация§!: Даву успешна"
 FRA_failed_operation_davout:0 "Мы провалили §YОперацию§!: Даву"
 FAF_operation_baku_decision_idea:0 "§HОПЕРАЦИЯ:§! БАКУ"
 FAF_operation_powderkeg_decision_idea:0 "§HОПЕРАЦИЯ:§! ПОРОХОВАЯ БОЧКА"
 FRA_ils_ne_passeront_pas:0 "Они не пройдут!"
 FRA_ils_ne_passeront_pas_desc:0 "Несмотря на крах Украины, дух на кубанском плацдарме остаётся высоким. Этот новый энтузиазм сохраняется, хотя известно, что на фронте не всё хорошо: медведь добился огромных успехов ценой больших потерь. Русское наступление продолжается, и, чтобы встретить такой натиск, нам явно нужно вгрызаться пятками ещё глубже в чернозём. Сегодня мы осаждаем Краснодар, но неудача может позволить русским продвинуться дальше, и тогда под угрозой окажется сердце Европы. Клич из славного прошлого Франции воскрешён людьми на фронте и, как и тогда, теперь послужит отличным боевым кличем для солдат и гражданских. Они не пройдут!"
 FRA_sovereignty:0 "Суверенитет"
 FRA_sovereignty_desc:0 "Более идеалистичные члены правительства и армии хотят использовать конфликт, чтобы ещё сильнее закрепить европейское единство, повысить интеграцию частей и использовать антироссийские этнические части, чтобы представить нас освободителями. Любые крупные структурные изменения или тяжёлые инвестиции в сомнительно лояльные группы следует считать ставкой, а тот, кто ставит на кон свою душу, глупец. Такие мечтательные концепции нужно оставить для мира, где Европа победила любую угрозу, которую Россия представляет для свободной Европы. До того дня мы будем опираться на силу Франции такой, какая она есть: мечтательные реформы можно приберечь для мирного времени."
 FRA_solidarity:0 "Наследие Иностранного легиона"
 FRA_solidarity_desc:0 "Несмотря на наш отказ идти путём бешеной рискованной реорганизации, всё ещё есть место для формирования нефранцузских частей — стоит лишь принять дух Иностранного легиона. Быстро расширяя его численность, мы можем и пополнить ряды дополнительными бойцами, и меньше беспокоиться о радикальных структурных изменениях и возможных конфликтах интересов среди этнических частей. Франция заставит иностранцев сражаться за неё, но под объединяющим знаменем Légion étrangère."
 FRA_cement_ukrainian_crimea:0 "Закрепить украинский Крым"
 FRA_cement_ukrainian_crimea_desc:0 "С возвращением Крыма мы не должны жалеть средств, чтобы любая русская попытка вернуть его провалилась. Европа вступила в этот конфликт из-за нарушения территориальной целостности Украины, и, чтобы показать серьёзность намерений, должна идти до конца. Мы не согласимся на перемирие, никакой «демилитаризованной зоны», ничего кроме полной победы. Земли, украденные у Украины, пока мы стояли в стороне, будут возвращены любой ценой. Наши неудачи будут исправлены, и мы сделаем всё, чтобы это был последний раз, когда Россия может угрожать Украине — и уж тем более Европе — навсегда. Медведь будет сломлен любой ценой."
 FRA_kuban_expeditionary_army:0 "Кубанская экспедиционная армия"
 FRA_kuban_expeditionary_army_desc:0 "Даже с их нынешними успехами дома и на фронте за кулисами можно найти инакомыслие в России. Есть те в регионах, кто чувствует себя брошенным вдали от Москвы; Кубань — идеальная отправная точка, поскольку крупные куски уже попали в наши руки. Мы организуем местных добровольцев и военнопленных в этот «Кубанский корпус», несмотря на местных офицеров, настаивающих на написании через «К». Такие части будут идеальны для тыловой охраны и чтобы показать местным, а возможно и русскому народу, что мы лишь освободители, а не завоеватели-грубияны."
 FRA_conscript_cossack_brigades:0 "Призывные казачьи бригады"
 FRA_conscript_cossack_brigades_desc:0 "С распадом СССР и русские, и украинцы заявляли, что они наследники казачьего имени. С нашей точки зрения, Украина — дом любого истинного казака, и те, кто называет себя таковым, должны стоять с нами, иначе они предатели своего народа. Те, кто на нашей стороне фронта, будут организованы в более лёгкие мобильные части в соответствии с их названием. Согласие вступить в эти части не важно, ведь в конце концов мы воюем ради них, а не ради себя."
 FRA_utilize_russian_dissidents:0 "Использовать русских диссидентов"
 FRA_utilize_russian_dissidents_desc:0 "Многие взяли бы оружие вместе с нами по множеству причин: ради «лучшей» России, региональной независимости или просто идя туда, куда дует ветер. «Почему» не важно — важно лишь, что этим людям можно дать винтовки и использовать для ослабления русского военного усилия. Некоторые сотрудничают искренне, у некоторых взгляды, которые мы считаем в целом... проблематичными. Нам просто придётся разбираться с последствиями позже. Есть война, которую нужно выиграть."
 FRA_operation_davout_tt:0 "§YПо завершении этого фокуса начнётся §!§Cоперация§! «Даву»§!§Y. \nЭто тотальное наступление на §!\n§RСочи \nНовороссийск \nКерчь§!\n§YОно должно ослабить давление на Украину и обеспечить§! §Cсилам НАТО§! §Yпревосходство на §!§Gкавказском фронте§!"
 FRA_cossack_army_tt:0 "4 §yлёгкие механизированные казачьи бригады! будут сформированы в §pВаршаве§!"
 FRA_kuban_exp_army_tt:0 "6 §0дивизий кубанской милиции§! будут сформированы в §pВаршаве§!"
 FRA_Freedom_of_Russia_Legion_tt:0 "2 §3механизированные дивизии российских диссидентов§! будут сформированы в §pВаршаве§!"
 FRA_foreign_legion_tt:0 "4 §2бригады Французского иностранного легиона§! будут сформированы в §4Париже§!"
 FRA_Act_on_Rattachism:0 "Закон о реюньонизме"
 FRA_Act_on_Rattachism_desc:0 "Хотя в Валлонии говорят по-французски, эта древняя часть франкофонного мира ускользнула из наших рук после падения Наполеона, и мы считали её потерянной навсегда. Судьба вновь соединила нас воедино, и мы должны подготовить несколько законов, чтобы продолжить привязывать её к нашей системе: находиться в наших границах недостаточно, Бельгия и её византийская политическая система должны быть приведены в соответствие с нашей. Ради блага Франции мы этим займёмся."
 FRA_Absorb_Waloon_Command:0 "Поглотить валлонское командование"
 FRA_Absorb_Waloon_Command_desc:0 "Двуязычие Бельгии привело к тому, что её армия разделилась на две части, подобно её правительству; это сделало раздел Бельгии довольно чистым: фламандцы отвечали за безопасность границ на фламандской стороне, а валлоны — аналогично. Но теперь это ответственность голландцев и Франции. Валлония приносит с собой значительный контингент сил и опытных офицеров НАТО, и мы были бы глупцами, отказавшись от их услуг. Обновите их форму, дайте им новые звания — теперь они часть Франции."
 FRA_absorbing_walloon_command_tt:0 "Валлонские офицеры будут включены в нашу армию."
 FRA_Reorganize_Walloon_Businesses:0 "Реорганизовать валлонские предприятия"
 FRA_Reorganize_Walloon_Businesses_desc:0 "При интеграции такой развитой городской территории, как Валлония, нужно учитывать, что предприятия региона подчинялись строгому строительному кодексу, который Бельгия контролировала из Брюсселя. А теперь? Эти предприятия отвечают перед французским законом. Мы должны проверить новоприобретённые предприятия и помочь им реорганизоваться: такие компании, как Fabrique Nationale, слишком ценны, чтобы позволить им погибнуть; вмешавшись и организовав их в хаосе, мы сохраним местную экономику."
 FRA_Integrate_Walloon_Parliament:0 "Интегрировать парламент"
 FRA_Integrate_Walloon_Parliament_desc:0 "Самое сложное — действительно посмотреть на государственную систему Бельгии и понять, как её интегрировать. В Бельгии было три парламента: фламандский, валлонский и немецкоязычный. Мы контролируем валлонский и немецкоязычный регионы и не знаем точно, что делать с их правительствами; некоторые места, вероятно, будут упразднены, особенно в том, что касается Эупен-Мальмеди, но многие будут интегрированы во Французскую Республику. Их партии, зарегистрированные под прежними названиями, сохранят их на время, и многие бельгийские парламентарии скоро почувствуют себя уютно в Париже. Осталось лишь нашей партии начертить избирательные округа и решить, кого оставить."
 FRA_Promote_Francophone_Unity:0 "Содействовать франкофонному единству"
 FRA_Promote_Francophone_Unity_desc:0 "Франкоязычные народы — наследники великого и древнего наследия: от Карла Великого до Валуа, от Бурбонов до Наполеона и до нынешней великой республиканской эпохи. Мы — творцы европейских ценностей, мы — хранители её культуры, мы более тысячелетия терпели иностранное вторжение, порабощение и, чаще всего, великие походы на восток, юг и запад, через Атлантику, чтобы добыть славу для нас и наших народов.\n\nБельгия и Валлония большую часть своей истории были отделены от нас в этих славах. Но они разделили их всё равно. Наша история — предмет гордости, наша история — их, а их — наша. Французы всегда стоят вместе!"
 FRA_An_Example_of_Unity:0 "Пример единства"
 FRA_An_Example_of_Unity_desc:0 "Liberté, Égalité, Fraternité. Руководящие принципы Франции. С тех пор как первый клинок пал и положил конец Старому режиму, наши идеалы зажгли мир. Америка. Германия. Италия. Есть ли часть света, куда не дошли эти три слова? Назовите хоть одну. Европа сегодня уникально объединена этими идеалами, и хотя Бельгия пала, основные идеи в умах её жителей не исчезли. Брюссель остаётся городом смешанной фламандско-валлонской этнической принадлежности, столицей Европы; Бельгии больше нет, но оставленный ею символ единства — мощное напоминание о торжестве наших идеалов через все кризисы и беды, о стремлении к Freiheit, к Liberté, на каком бы языке вы ни говорили, у вас есть для этого слово. По-английски это Liberty. В сердцах и умах каждого европейца пусть Брюссель будет маяком будущего Европы. Первая настоящая территория на карте, о которой мы можем сказать, что она всецело принадлежит Европе."
 FRA_Propagandize_French_Naturalism:0 "Пропагандировать французский натурализм"
 FRA_Propagandize_French_Naturalism_desc:0 "И Рейну я говорю: следуйте на север по реке, пока брабантское пиво не появится на рыночных площадях. Мы — французы, наследники Франкии, мы не забываем своих истоков. Голландцы, немцы — наши братья. Сегодня мы получаем Валлонию, но должны были получить всё, должны были зайти дальше; это дар Европе, что мы не идём к Рейну, как Наполеон. Эта древняя наша граница была проведена в поражении, которое отделило нас от валлонов, от фламандцев, от старых земель Бургундии. Почему мы должны это принимать? Нет, мы требуем большего. Мы должны иметь больше. Валлония сегодня, Фландрия завтра, Брабант на следующей неделе, Рейн в следующем году. Может быть. "
 FRA_Absorb_the_Beglian_Left:0 "Поглотить бельгийских левых"
 FRA_Absorb_the_Beglian_Left_desc:0 "Мы, левые, должны держаться вместе; бельгийские социалисты давно наши друзья на европейской арене, и в их рядах много личных друзей Меланшона. Будет правильно, когда регионы станут единым целым, разделить с ними трапезу: встреча Меланшона с лидером Социалистической партии Полем Маньеттом и Раулем Хедебау из PVDA позволит нам усилить парламентские позиции и легитимизировать нашу власть над бельгийским рабочим классом. Заодно приведём и Шарля Сервати; Эупен мал, но Эупен всё ещё наш. Их 3 места — всё ещё места, которые мы хотели бы удержать."
 FRA_Appoint_King_Philippe_to_Parliament:0 "Восстановить бельгийские титулы"
 FRA_Appoint_King_Philippe_to_Parliament_desc:0 "У Бельгии была богатая история монархии, которую несправедливо оторвали в последние дни её существования; неправильно, чтобы такой символ национального единства был так похищен. Мы сами, конечно, не монархия, но бельгийские консерваторы не хотят, чтобы их королевская семья стала простыми гражданами. Очень хорошо. Их титулы будут восстановлены и поддержаны Французской Республикой; как бы странно это ни было, мы снова коронуем короля для Бельгии. Чисто почётное и совершенно не административное звание."
 FRA_Desperate_Defense_cw_idea:0 "Оборона в глубину"
 FPR_Fervor_reset_tt:0 "Убирает идею §R«Революционный пыл»§!"
 FRA_Secure_French_Oil_Interests:0 "Признать саудовского преемника"
 FRA_Secure_French_Oil_Interests_desc:0 "Установить дипломатические отношения с новым саудовским руководством, будь то под Аравийской республикой или под домом Саудов. Это признание направлено на укрепление союзов и обеспечение стабильного партнёрства, содействуя сотрудничеству в энергетике и региональной безопасности и усиливая влияние Франции в Заливе."
 FRA_If_We_cant_have_it:0 "Укорениться на Ближнем Востоке"
 FRA_If_We_cant_have_it_desc:0 "Стратегически инвестировать на Ближнем Востоке, оказывая финансовую поддержку ключевым союзникам, таким как Израиль и Турция. Эта инициатива укрепляет отношения в регионе, способствуя стабильности и партнёрствам, которые могут привести к выгодным энергетическим соглашениям и расширенному сотрудничеству в сфере безопасности."
 FRA_Encourage_European_Economic_Sanctions:0 "Предоставить экономические кредиты"
 FRA_Encourage_European_Economic_Sanctions_desc:0 "Предоставить целевые экономические кредиты правительству-преемнику Саудовской Аравии для поддержки развития и стабильности. Инвестируя в их экономику, Франция может укреплять двусторонние связи и поощрять политику, соответствующую французским интересам, обеспечивая стабильный поток нефти и стратегическое сотрудничество."
 FRA_Redirect_Budget_to_Oil_Contracts:0 "Перенаправить бюджет на нефтяные контракты"
 FRA_Redirect_Budget_to_Oil_Contracts_desc:0 "Перераспределить бюджетные ресурсы в пользу нефтяных контрактов и инициатив. Этот фокус стремится обеспечить эффективное направление средств на заключение жизненно важных энергетических соглашений, укрепление энергетической независимости и усиление позиций Франции как ключевого игрока мирового нефтяного рынка."
 FRA_Integrate_Oil_Contracts_into_Military_Budget:0 "Интегрировать нефтяные контракты в военный бюджет"
 FRA_Integrate_Oil_Contracts_into_Military_Budget_desc:0 "Объединить нефтяной бюджет с военным финансированием, чтобы создать единый подход к энергетической безопасности. Интегрируя эти бюджеты, Франция может усилить стратегические возможности и обеспечить должную поддержку военных операций энергоресурсами, укрепляя тем самым национальную оборону."
 FRA_Department_of_Oil_Production:0 "Département de la Production Pétrolière"
 FRA_Department_of_Oil_Production_desc:0 "Создать специализированный государственный департамент, сосредоточенный на добыче и управлении нефтью. Этот департамент будет курировать разработку внутренних и международных нефтяных стратегий, координировать работу с отраслевыми игроками и продвигать инициативы, повышающие энергетическую безопасность и эффективность добычи во Франции."
 FRA_Reorganize_Civilian_Infrastructure:0 "Реорганизовать гражданскую инфраструктуру"
 FRA_Reorganize_Civilian_Infrastructure_desc:0 "Обновить гражданскую инфраструктуру для поддержки роста добычи и распределения нефти. Эта инициатива включает модернизацию транспортных сетей, хранилищ и перерабатывающих заводов для обеспечения эффективных операций. Модернизируя инфраструктуру, Франция может оптимизировать свою энергетическую цепочку поставок и повысить общую экономическую устойчивость."
 FRA_Invest_in_Equinor:0 "Инвестировать в Equinor"
 FRA_Invest_in_Equinor_desc:0 "Направить инвестиции в Equinor для поддержки инициатив в области возобновляемой энергии и диверсификации источников. Этот стратегический шаг направлен на соответствие мировым энергетическим тенденциям и закрепление позиций в инновационных энергетических решениях. Поддержка Equinor сделает Францию лидером как на традиционном, так и на устойчивом энергетическом рынке."
 FRA_Ration_Civilian_Oil:0 "Нормировать гражданскую нефть"
 FRA_Ration_Civilian_Oil_desc:0 "Внедрить систему нормирования гражданского потребления нефти, чтобы приоритизировать ресурсы для стратегических нужд и военных операций. Эта мера направлена на обеспечение снабжения критических секторов при эффективном управлении внутренним спросом. Контролируя распределение нефти, Франция может сохранять стабильность в периоды повышенной напряжённости."
 FRA_Curtail_Former_American_Embargoes:0 "Дистанцироваться от американских эмбарго"
 FRA_Curtail_Former_American_Embargoes_desc:0 "Предпринять шаги, чтобы дистанцировать Францию от эмбарго, введённых США, особенно против Венесуэлы. Снимая ограничения и взаимодействуя с попавшими под санкции странами, Франция может обеспечить альтернативные поставки нефти, повысить энергетическую независимость и позиционировать себя как дипломатический посредник в мировых энергетических дискуссиях."
 FRA_West_African_Oil:0 "Нефтяные месторождения Западной Африки"
 FRA_West_African_Oil_desc:0 "Сосредоточиться на расширении партнёрств с профранцузскими странами Западной Африки для доступа к дополнительным нефтяным запасам. Эта инициатива усилит связи с этими странами и увеличит энергетический портфель Франции. Инвестируя в западноафриканские месторождения, Франция может диверсифицировать источники энергии и поддержать региональную стабильность."
 FRA_Issue_10_year_Bonds:0 "Выпустить десятилетние облигации"
 FRA_Issue_10_year_Bonds_desc:0 "С учётом недавней экономической нестабильности в начале нового десятилетия становится всё очевиднее, что, дабы не отставать от других великих держав мира, Франция должна применять более проактивную стратегию в экономической политике. Нынешняя администрация разработала новую денежно-кредитную политику, которая будет введена в действие выпуском облигаций на оставшуюся часть десятилетия как для предприятий, так и для корпораций."
 FRA_Revive_Dirigisme:0 "Возродить дирижизм"
 FRA_Revive_Dirigisme_desc:0 "Дирижизм был критически важен для наших усилий по восстановлению после окончания Второй мировой войны, и Франция с тех пор не забыла своих корней. Хотя в последнее время мы перешли к рыночному подходу в экономической политике, никогда не поздно вернуться к более надёжному подходу в свете недавней экономической нестабильности, такой как пандемия. С этим общенациональным возвратом к системе дирижизма Франция процветёт, как когда-то в лучшие годы Республики."
 FRA_Invite_New_Age_Technocrats:0 "Пригласить технократов новой эпохи"
 FRA_Invite_New_Age_Technocrats_desc:0 "На рубеже века одной из самых прибыльных и быстрорастущих отраслей по всему миру, особенно для Франции, стали технологии. Технологические гиганты, возникшие за последние два десятилетия, доминировали в отрасли в основном из Америки. Франция покажет, что она не из тех, кто противится этим гигантам, а вместо этого протянет им руку в знак доброй воли французского народа."
 FRA_Purchase_National_Champions:0 "Новая эпоха национальных чемпионов"
 FRA_Purchase_National_Champions_desc:0 "Прокладывая путь к экономическому господству, мы не должны забывать наши собственные французские компании, некогда лидировавшие на промышленных и экономических рынках. Мы покажем остальному миру превосходство французского продукта и наших инноваций. Но чтобы добиться этого, мы должны поддерживать наши корпорации, обеспечивать им опору и понимание того, что Франция стоит за ними на мировой арене."
 FRA_Advance_National_Interests:0 "Продвигать национальные интересы"
 FRA_Advance_National_Interests_desc:0 "То, что лучше для наших корпораций и предприятий, — то лучше для французской нации, и это окончательно. Мы сохраним благосостояние и процветание нашей нации любыми возможными средствами, и любая компания, желающая стать частью нашего экономического движения, должна соблюдать эти требования. Они поймут это в должное время, когда Франция вновь станет крупным игроком на геополитической арене современного мира, как это было десятилетиями ранее."
 FRA_Replace_the_ENA:0 "Заменить ЭНА"
 FRA_Replace_the_ENA_desc:0 "École nationale d'administration была маяком прогресса и доброй воли нашего правительства по отношению к гражданам. Изначально задуманная как демократизация нашей государственной службы, увод от запутанного хаоса бюрократии, что у нас был прежде, она в последнее время впала в уныние — годы были жестоки к этому учреждению. Что пошло не так, многие задаются вопросом об этом престижном учреждении, но, похоже, после многих лет недобросовестной практики и дисфункции ответ кроется в её собственной политике.\n\nПосле многих обдуманных и запутанных переговоров с лидерами всех сторон спора было решено, что единственный способ исправить эту дряхлую проблему — полностью заменить некогда престижную академию. На этот раз мы обеспечим её долговечность, вернув ей ту же престижную репутацию, что была раньше."
 FRA_Replace_ENA_Veterans:0 "Уволить ветеранов ENA"
 FRA_Replace_ENA_Veterans_desc:0 "В одном мы все можем согласиться относительно École nationale d'administration: бюрократия, а именно бюрократы, были чумой, превратившей наше некогда престижное учреждение в тот запутанный хаос, который мы знаем сегодня. После монументальных изменений теперь очевидно, что эти паразиты попытаются цепляться за любую власть, которая у них ещё осталась. Мы сместим этих ветеранов с их величественных постов и покажем им, что французский народ больше их не приветствует."
 FRA_Institut_national_du_service_public:0 "Рождение INSP"
 FRA_Institut_national_du_service_public_desc:0 "Institut national des sciences politiques был одним из многих предложений, подготовленных нашей администрацией и годами лежавших в шкафу в кабинете какого-нибудь бюрократа. До недавнего времени всё так и оставалось бы, если бы не столь необходимые реформы, проведённые под нашей администрацией, которые позволили нам полностью заменить École nationale d'administration на Institut national des sciences politiques. Пока элитные члены прежнего учреждения бушуют, народ Франции знает, что это изменение пойдёт ему на пользу, а не высшему классу, который долго злоупотреблял своим статусом и привилегиями, ведь École nationale d'administration больше не является таковой."
 FRA_Distribute_ENA_Funds:0 "Перераспределить средства ENA"
 FRA_Distribute_ENA_Funds_desc:0 "Со столь необходимым концом École nationale d'administration Франция и наше правительство вздохнут с облегчением после того, как это оскорбление нашей нации наконец обезглавлено. После недель тщательного изучения всех расходов, которые École nationale d'administration потребляла из нашего бюджета, ошеломляющий отчёт о более чем ста пятидесяти миллиардах евро почти вызвал второй переполох. К счастью, на этот раз École nationale d'administration уже была опустошена до последнего, и теперь мы можем направить эти средства в столь необходимые учреждения Франции, которые десятилетиями обирались благодаря этому гнусному институту."
 FRA_Disuade_Elitist_Attitudes:0 "Отбить охоту к элитизму"
 FRA_Disuade_Elitist_Attitudes_desc:0 "С рождением Institut national des sciences politiques мы покажем тем, кто пользовался слабыми защитами École nationale d'administration, что их элитистское и хищническое поведение больше не приветствуется народом Франции. Мы покажем им, что наша администрация говорит от имени народа, а народ сказал: элитам больше не место в наших государственных учреждениях!"
 FRA_Reform_the_Civil_Services:0 "Реформировать государственную службу"
 FRA_Reform_the_Civil_Services_desc:0 "С перераспределением расточительных средств École nationale d'administration у нас много пространства для инвестиций в другие части нашего правительства. Из-за пустоты, оставленной École nationale d'administration с её обучением госслужбе, выброшенным за борт, на наше нынешнее правительство ложится обязанность обеспечить народу возможности попасть на государственную службу без прежней мороки."
 FRA_Laissez_faire:0 "Принять экономику невмешательства"
 FRA_Laissez_faire_desc:0 "С нашим методичным отходом от системы дирижизма за последние десятилетия в сторону большого акцента на рынке, похоже, в свете недавних геополитических событий наконец настало время Франции раз и навсегда принять свободный рынок и получить его славные плоды. С таким экономическим подходом Франция процветёт и эволюционирует в современную эпоху так, как не видела со славных дней нашей Республики."
 FRA_Deconstruct_the_ENA:0 "Деконструировать ENA"
 FRA_Deconstruct_the_ENA_desc:0 "École nationale d'administration была маяком прогресса и доброй воли нашего правительства по отношению к гражданам. Изначально задуманная как демократизация нашей государственной службы, увод от запутанного хаоса бюрократии, что у нас был прежде, она в последнее время впала в уныние — годы были жестоки к этому учреждению. Что пошло не так, многие задаются вопросом об этом престижном учреждении, но, похоже, после многих лет недобросовестной практики и дисфункции ответ кроется в её собственной политике.\n\nПосле многих обдуманных и запутанных переговоров с лидерами всех сторон спора было решено, что единственный способ исправить эту дряхлую проблему — полностью заменить некогда престижную академию. На этот раз мы обеспечим её долговечность, вернув ей ту же престижную репутацию, что была раньше."
 FRA_Begin_Low_Scale_Privatizations:0 "Начать маломасштабную приватизацию"
 FRA_Begin_Low_Scale_Privatizations_desc:0 "Приватизация в малом масштабе десятилетиями требовалась нам корпорациями, которые экономически, а иногда и финансово помогали Франции. С нашим подходом невмешательства наконец настало время уступить корпорациям и предприятиям, разрешив приватизацию некоторых государственных институтов, что позволит повысить эффективность и даже создать стратегическую конкуренцию, чтобы в конечном счёте истинным победителем стал французский гражданин."
 FRA_Increase_Arms_Exports:0 "Увеличить экспорт вооружений"
 FRA_Increase_Arms_Exports_desc:0 "Наш военно-промышленный комплекс всегда был одним из величайших, учитывая, что мы не одна из мировых сверхдержав этой эпохи, но именно наша оружейная промышленность в последние годы ослабла по сравнению с прошлым. С недавней геополитической нестабильностью в Африке и других частях света сейчас самое время нашей стране снова отправлять лучшие французские товары по всему миру."
 FRA_Reduce_International_Sanctions:0 "Снизить международные тарифы"
 FRA_Reduce_International_Sanctions_desc:0 "Тарифы всегда были скорее политическим действием, чем чем-либо ещё... конечно, есть исключения, такие как наши идеологические враги. Как бы то ни было, в последние годы мы были слишком суровы и в результате упустили важную часть рынка, которая жаждет французских товаров и промышленности. Франция останется и будет лишь крепнуть на международном рынке, и эта политика лишь гарантирует, что мы продолжим наращивать экономическую мощь."
 FRA_Acquire_Renault:0 "Приобрести Renault"
 FRA_Acquire_Renault_desc:0 "Renault была одной из самых роскошных автомобильных компаний Франции с тех пор, как изобретение автомобиля пришло во Францию. Хотя она известна своими автомобилями, она также оказала большую услугу нашей армии, предоставив нам бронетранспортёры, боевые машины пехоты и даже танки. Именно поэтому в рамках усилий по расширению компаний нашей страны на мировую арену наша администрация запросила покупку Renault."
 FRA_Nexter_Expansion:0 "Расширить контракты Nexter"
 FRA_Nexter_Expansion_desc:0 "Nexter долгое время помогала французской армии в современную эпоху Республики. Они имеют наше глубочайшее уважение и благодарность, и в награду за их вклад в нашу армию мы вознаградим их упорный труд и усилия, расширив их контракты и позволив им производить больше для нашей любимой страны и её армии."
 FRA_Prioritize_Efficient_Economics:0 "Приоритет эффективной экономики"
 FRA_Prioritize_Efficient_Economics_desc:0 "С полным разворотом дирижистского подхода и прочными позициями нашей политики наконец настало время сосредоточить нашу администрацию на том, чтобы наш экономический план держался крепко и оставался максимально эффективным. Мы будем стремиться к тому, чтобы наши реформы прошли через парламент, а бюрократия не мешала экономическому росту нашей страны. С заданным курсом нашей политики и реформ, похоже, время Франции как европейской экономической державы, возможно, уже близко..."
 FRA_Tax_Cuts_to_Defense_Companies:0 "Оборонительные налоговые льготы"
 FRA_Tax_Cuts_to_Defense_Companies_desc:0 "С недавним подходом к нашим экономическим трудностям, основанным на невмешательстве, следующий большой шаг к полностью свободной экономике — снижение налогов для корпораций, участвующих в нашей денежной системе. В частности, компании, вовлечённые в наш военно-промышленный комплекс, получат больше всего выгод, очевидно, чтобы наша армия получала только лучшее."
 FRA_Offer_American_Companies_Refuge:0 "Убежище для американских компаний"
 FRA_Offer_American_Companies_Refuge_desc:0 "Без сомнения, внезапная гражданская война, вспыхнувшая в Америке, обрушила не только нашу экономику, но и мировые рынки. Как бы ужасно это ни было для нас, теперь, похоже, есть и светлая сторона: бывшие гиганты американской промышленности ныне стремятся выйти на европейские рынки, и кто лучше нашей гордой страны. Франция взяла на себя роль в усилиях Европейского союза по интеграции компаний, непропорционально пострадавших от Второй американской гражданской войны, и, будем надеяться, удержанию их, если этот конфликт когда-нибудь завершится."
 FRA_Push_for_EU_Asian_Free_Trade:0 "Соглашение о свободной торговле ЕС–ОТД"
 FRA_Push_for_EU_Asian_Free_Trade_desc:0 "Европейский союз и Тихоокеанская договорная организация понесли существенные удары: с уходом американского рынка и русские, и китайцы воспользовались возможностью, чтобы агрессивно продвигать свои экономические интересы среди соседних стран. Чтобы предотвратить их совместную агрессию, историческое торговое соглашение между двумя великими державами было окончательно оформлено, чтобы показать миру: мы не боимся этих мировых сверхдержав и больше не зависим от Соединённых Штатов."
 FRA_Strengthen_Anti_Corruption_Laws:0 "Усилить антикоррупционные законы"
 FRA_Strengthen_Anti_Corruption_Laws_desc:0 "Теперь наконец настало время настоящих перемен. Перемен, которые сотрясут политический климат не только нашего правительства, но и всего нашего политического климата. Наша администрация будет продвигать несколько антикоррупционных законов, которые положат конец юридическим лазейкам, используемым законодателями и бюрократами, чтобы обходить правосудие. Франция покажет нашей стране и остальной Европе, что мы — поборники закона и никто не освобождён от ответственности в наших границах."
 FRA_Declare_Wartime_Measures:0 "Объявить военные меры"
 FRA_Declare_Wartime_Measures_desc:0 "С натиском российской агрессии по всему миру мы наконец осознаём, что не может быть полумер в противостоянии с подобными русскими бандитами. Франция покажет пример, доказав, что мы готовы и желаем бороться с российской агрессией, и мы активно призываем остальную Европу последовать за Францией во главе антироссийского оплота, который стремится уничтожить наш образ жизни, каким мы его знаем."
 FRA_Utilize_Consumerism:0 "Опираться на консьюмеризм"
 FRA_Utilize_Consumerism_desc:0 "Франция современной эпохи всегда потакала консьюмеризму, особенно ещё до пандемии. Теперь, когда пандемия в основном позади, наше правительство должно побудить страну вернуться к потребительским привычкам, чтобы помочь не только возродить наши компании, но и нашу экономику. Франция увидит, как её любимые предприятия процветают, как когда-то годы назад, до того как эта ужасная череда событий почти не потопила нашу страну экономически."
 FRA_Target_Oligarchs:0 "Ударить по олигархам"
 FRA_Target_Oligarchs_desc:0 "Настало время заняться одним из самых трудных вопросов нашей глубоко порочной системы. Вопрос об олигархах наконец получает свой звёздный час: наша администрация предложила и уже приняла несколько антиолигархических законопроектов, чтобы не только ограничить их влияние в наших политической и экономической системах, но и положить ему конец раз и навсегда. Нация Франции и остальная Европа узнают, что мы всегда будем хранить лучшие интересы нашего народа в сердце и что деньги не могут ни купить, ни сбить с пути французскую политическую машину."
 FRA_Fraternite:0 "Fraternité"
 FRA_Fraternite_desc:0 "Несмотря на относительный мир в Европе, война всегда неизбежна. Растущая напряжённость показала нам, что только животное с острыми зубами способно отбить нападающих, а с учётом неспособности наших американских союзников вносить вклад в наши оборонительные возможности было бы более чем разумно серьёзно вложиться в собственную армию. Какой бы враг ни возник, пусть он пожалеет, что когда-либо тронул Францию."
 FRA_Egalite:0 "Égalité"
 FRA_Egalite_desc:0 "Экономическое равенство — то, к чему каждый должен стремиться; однако отказ кому-то в накоплении богатства противоречил бы нашим принципам. Сохраняя устойчивую линию между богатством и равенством, мы можем гарантировать, что у нашего народа будет то, за что бороться: будущее."
 FRA_Liberte:0 "Liberté"
 FRA_Liberte_desc:0 "Один из основополагающих принципов Франции — свобода: с тех пор как мы подняли трёхцветное знамя, мы понимаем, что наш народ заслуживает голоса и может свободно выражать себя без наказания. Сосредоточиваясь на республиканских идеалах, мы усиливаем влияние на внутреннюю политику: единство приносит стабильность, и, если мы покажем нашему народу, что, несмотря на различия, мы способны жить свободно вместе."
 FRA_Withdraw_from_Integrated_Military_Command:0 "Выйти из объединённого военного командования"
 FRA_Withdraw_from_Integrated_Military_Command_desc:0 "Одной из многих ошибок прежних режимов была наша неизменная приверженность объединённому командованию НАТО. Почему Франция должна привязывать свою военную мощь к остальной Европе? Почему мы должны быть ограничены договорами и регламентами? Больше нет. Пришло время Франции отделиться от этой стареющей концепции. Наша армия больше не будет привязана к НАТО, как собака. Наконец мы сможем вылепить нашу армию во нечто исключительно французское. Не британское, не итальянское, не немецкое — французское. Наши союзники не будут этому рады, но им придётся принять, что такой исход лучше для всех сторон."
 FRA_Assure_our_Allies:0 "Успокоить союзников"
 FRA_Assure_our_Allies_desc:0 "Что бы ни опасались наши союзники, наше новое военное направление не приведёт к отказу от обязательств перед НАТО. Хотя некоторые на краях левого и правого спектра постоянно утверждают, что нам следует выйти из альянса, они не представляют того, за что мы стоим. Мы стоим за коллективную безопасность всей Западной Европы и всегда будем готовы рискнуть жизнями ради защиты справедливости и свободы. Франция будет ярко сиять как оплот НАТО, и мы будем готовы встретить тиранию лицом к лицу, откуда бы она ни пришла."
 FRA_Military_Industrial_Program:0 "Военно-промышленные программы"
 FRA_Military_Industrial_Program_desc:0 "Война — опасная игра. Она поглощает всё на своём пути и останавливает экономику стран. Многие страны пали не от солдат или танков, а от невидимой силы истощения. Поскольку напряжённость в мире растёт, мы не можем позволить себе сохранять нашу промышленную базу в нынешних размерах. Нашим людям нужны припасы: винтовки, патроны, топливо и продовольствие. Эти предметы первой необходимости нужны для базового функционирования нашей армии. Новые промышленные планы позволят нам снабжать нашу армию и союзников припасами и материалами, чтобы выжить в будущих войнах."
 FRA_Redistribute_NATO_Funding:0 "Перераспределить наши взносы в НАТО"
 FRA_Redistribute_NATO_Funding_desc:0 "С нашей новой сокращённой ролью в верховном командовании НАТО мы должны решить, что делать с вновь приобретёнными ресурсами. Слишком долго французские социальные службы едва сводили концы с концами. Они получали минимум субсидий от государства, в то время как военный бюджет постоянно увеличивался. Это был один из крупнейших провалов нашего правительства, и мы стремимся исправить эту проблему раз и навсегда. Новые субсидии будут предоставлены службам по всей стране. Это служит не только использованию избыточных расходов, которые мы тратили на верховное командование, но и сокращению растущей бедности и безработицы."
 FRA_A_New_Doctrine:0 "Новые стратегические доктрины"
 FRA_A_New_Doctrine_desc:0 "Война — игра постоянных перемен. Тактика устаревает, оружие устаревает, и в войне ничто не остаётся неизменным. В стремлении к превосходству над врагами перемены не просто необходимы — они обязательны. Наши враги непредсказуемы. Они используют любую тактику, какой бы устаревшей она ни была. Поэтому мы должны оставаться начеку. Адаптивность должна стать ядром нашей военной доктрины, чтобы мы всегда имели преимущество над врагом, каковы бы ни были шансы."
 FRA_Civic_Construction_Plans:0 "Программы гражданского строительства"
 FRA_Civic_Construction_Plans_desc:0 ""
 FRA_New_Stretegic_Concepts:0 "Новые стратегические концепции"
 FRA_New_Stretegic_Concepts_desc:0 "С момента своего существования НАТО всегда готовилась к возможности тотальной войны с СССР в годы холодной войны. Хотя это так и не стало реальностью, страх войны сохранялся даже после распада Советского Союза. Но с наступлением XXI века многие наши доктрины и концепции были признаны устаревшими. Планы и тактики, которые работали бы годы назад, теперь устарели из-за технологического прогресса. Поэтому необходимо провести полную переоценку текущих стратегических концепций НАТО, чтобы гарантировать готовность к любой возможности, включая тотальную войну с Москвой."
 FRA_Establish_Romanian_Forward_Operating_Bases:0 "Румынские передовые базы"
 FRA_Establish_Romanian_Forward_Operating_Bases_desc:0 "С момента вступления Румынии в НАТО в 2004 году она была ключевым активом в защите Восточной Европы. Её положение на Черном море в сочетании с границей с Украиной позволяло нам проецировать силу в этот регион много лет. Хотя наша роль на Востоке всегда была пассивной, недавние провокации русского медведя показали, что время пассивности прошло. В рамках наших планов мобилизации базы по всей Румынии будут модернизированы и расширены, что позволит нам не только проецировать силу, но и реагировать на любые потенциальные военные действия, особенно касающиеся Украины."
 FRA_A_European_Turkey:0 "Лекарство для больного человека"
 FRA_A_European_Turkey_desc:0 "Турция — загадка. Несмотря на членство в НАТО, мы часто сталкивались с ней, особенно по поводу её вмешательства в сирийскую гражданскую войну. В нынешнем состоянии Турция находится на перепутье. Чтобы закрепить наше присутствие на Востоке, мы должны обеспечить полную приверженность Анкары НАТО. Её положение стража Чёрного моря даёт нам контроль над одним из важнейших морских путей России, позволяя блокировать торговлю и даже наносить удары на Кавказе в случае войны."
 FRA_Baltic_Defense_Plan:0 "Балтийская оборонительная готовность"
 FRA_Baltic_Defense_Plan_desc:0 "Хотя страны Балтии и не главная цель российской агрессии, им угрожает нависающее присутствие медведя. С момента распада Советского Союза Москва с вожделением смотрит на этот регион. И если война начнётся, они непременно вторгнутся и попытаются смять наших союзников. Поэтому мы должны реализовать программы укрепления обороны НАТО в регионе. Защита стран Балтии гарантирует, что Россия не получит доступа к незамерзающим портам, что значительно повышает наши шансы успешно отразить потенциальное российское вторжение."
 FRA_Arm_the_TSK:0 "Турецкая оборонительная готовность"
 FRA_Arm_the_TSK_desc:0 "В разгар холодной войны Турция была точкой воспламенения напряжённости между Западом и Востоком. Соединяя Ближний Восток и Европу, Турция позиционируется как плацдарм для любого потенциального вторжения на Кавказ или Ближний Восток. Хотя турецкая армия всегда была готова к любому гипотетическому вторжению, мы должны обеспечить, чтобы русские не смогли дойти до Анкары. Чего бы это ни стоило, мы должны не дать пасть нашему важнейшему союзнику. Ибо его падение вызвало бы цепную реакцию, открыв все Балканы для захвата Россией."
 FRA_Improve_Conversion_Efficiency:0 "Повысить эффективность конверсии"
 FRA_Improve_Conversion_Efficiency_desc:0 ""
 FRA_Supremacy_in_the_Skies:0 "Господство в небе"
 FRA_Supremacy_in_the_Skies_desc:0 "С Первой мировой войны воздушная война стала ключевым компонентом функционирования современных армий. Истребители обеспечивают непосредственную поддержку с воздуха наземным войскам, а бомбардировщики превращают города и заводы в руины. Нация, лишённая военно-воздушных сил, находится во власти любого захватчика. В рамках наших планов по возрождению ВВС мы стремимся не только оспаривать небо, но и господствовать в нём. Наши истребители будут бороздить небеса. Наши бомбардировщики обратят силы врага в руины. И наши враги научатся бояться вида французских самолётов в небе."
 FRA_Increase_our_Black_Sea_Presence:0 "Усилить наше присутствие в Чёрном море"
 FRA_Increase_our_Black_Sea_Presence_desc:0 "Чёрное море — один из важнейших водных путей мира. Многие страны зависят от него не только для торговли, но и для защиты своих национальных интересов. С захвата Крыма Москвой в 2014 году произошёл опасный сдвиг сил. Теперь регион рискует стать русским тёплым морем. В рамках нашей программы военно-морской экспансии мы будем стремиться доминировать в Чёрном море и затмить присутствие России в регионе. Ибо если мы позволим региону попасть в руки русских, это будет угрожать не только Украине, но и нашим союзникам в регионе."
 POLITICS_EMMANUEL_MACRON_DESC:0 "Эммануэль Жан-Мишель Фредерик Макрон — бывший инвестиционный банкир, бывший министр и действующий президент Пятой Французской Республики. В молодости, воспитанный в нерелигиозной семье, он попросил крестить его в католической церкви. Однако позже он объявил себя агностиком и принял левоцентристскую идеологию, которую приписывает своей бабушке. Он изучал философию и экономику в Высшей нормальной школе, а затем посещал Национальную школу администрации. После завершения учёбы он работал инвестиционным банкиром в Rothschild & Cie Banque, где заработал свой первый миллион на сделке на девять миллиардов долларов, которую помог заключить. В 2012 году он был назначен министром экономики, промышленности и цифровых технологий, с должности которого ушёл в 2016 году, чтобы начать президентскую кампанию.\n\nКак президент, Макрон проводил повестку экономических реформ, включая сокращение государственных расходов и дерегулирование рынка труда. Его президентство было омрачено массовыми протестами, включая движение «жёлтых жилетов», начавшееся в конце 2018 года в ответ на предложенное повышение топливного налога. Макрон назвал колонизацию Алжира Францией «преступлением против человечности», а интервенцию в Ливии — «исторической ошибкой». Тем временем Франция по-прежнему оказывает влияние на уязвимые страны Западной Африки из тени, и неясно, насколько далеко Макрон готов зайти ради сохранения французских интересов. Несмотря на эти вызовы, Макрон остаётся видной фигурой на международной арене, выступая за глобальное сотрудничество по таким вопросам, как изменение климата, международная безопасность и единство европейских народов."
 POLITICS_JEANLUC_MELENCHON_DESC:0 "Жан-Люк Меланшон, новоизбранный президент Пятой Французской Республики, — не просто политик, но страстный сторонник социальных перемен и прав человека. Выросший в рабочей семье, Меланшон с ранних лет познал ценность солидарности и общности. Его воспитание привило ему глубокую эмпатию к борьбе простых людей и решимость бороться за их права. Образованный в философии и экономике, интеллектуальное любопытство Меланшона и приверженность социальной справедливости привели его в политику. Как бывший учитель и активист, он понимает силу образования и низового организационного строительства в достижении значимых перемен.\n\nКак лидер, Меланшон известен своей пламенной риторикой и бескомпромиссными принципами. Его президентство направляется видением более справедливого и равноправного общества, где богатство и власть распределяются более равномерно и у каждого есть возможность процветать."
 POLITICS_OLIVIER_FAURE_DESC:0 "Оливье Фор — видная фигура французского политического ландшафта, в настоящее время первый секретарь Социалистической партии. Родившийся в политически активной семье, он вырос в атмосфере дискуссий о социальной справедливости и прогрессивных ценностях. Его академический путь прошёл через коридоры Sciences Po, где он отточил понимание политической теории и социальных вопросов. Его карьера в политике началась с должности советника и быстро переросла в руководящую роль, отражая его глубокую приверженность идеалам социализма.\n\nКак президент, Фор выступает за Францию, которая ставит во главу угла социальную справедливость, экологическую устойчивость и экономическую справедливость. Он верит в силу коллективных действий и стремится объединить левых под общим знаменем для решения насущных проблем страны. Его прагматичный подход стремится уравновесить идеализм с достижимыми политическими целями, стараясь восстановить связь с лишёнными прав избирателями и продвигать реформы, поднимающие рабочий класс. Видение Фора — это видение солидарности, где голоса маргинализованных усиливаются, а идеалы Французской революции — свобода, равенство и братство — оживают."
 POLITICS_FRANCOIS_RUFFIN_DESC:0 "Франсуа Рюффен — влиятельный журналист, кинематографист и политический активист, более всего известный своим низовым подходом к политике и непоколебимой приверженностью социальной справедливости. Выросший в скромной семье, Рюффен развил сильное чувство эмпатии к борьбе рабочего класса, что позже повлияло на его работу в защиту обездоленных. Он получил признание за свои документальные фильмы, проливающие свет на социальные проблемы и отражающие реалии, с которыми сталкиваются обычные гражданы современной Франции.\n\nКак президент, Рюффен воплощает голос народа, приоритизируя прямое взаимодействие с избирателями и общественную организацию. Его страстные речи и конфронтационный стиль бросают вызов политическому истеблишменту, требуя реформ, решающих проблемы неравенства доходов, прав рабочих и экологических вопросов. Видение Рюффена для Франции — это Франция, где демократия оживляется активным гражданским участием, а политика отражает потребности и чаяния рабочего класса. Он стремится создать нацию, где каждый гражданин чувствует себя полноправным требовать перемен и имеет место за столом управления."
 POLITICS_MARINE_LEPEN_DESC:0 "Марин Ле Пен, новоизбранный президент Пятой Французской Республики, — не просто политик, но мать и дочь, глубоко укоренённая в ткани французского общества. Выросшая в политической семье, она воочию наблюдала борьбу и триумфы своего отца, Жан-Мари Ле Пена, когда тот возглавлял Национальный фронт. Несмотря на идеологические разногласия, Марин несёт в себе чувство семейного долга и решимость оставить свой след во французской политике. Образованная в области права в университете Пантеон-Ассас, ранняя карьера Ле Пен как адвоката дала ей представление о несправедливости, с которой сталкиваются обычные гражданы. Этот опыт подпитывал её страсть к справедливости и приверженность защите прав французского народа.\n\nКак мать, Ле Пен понимает важность безопасности и стабильности для семей по всей Франции. Её президентство движимо желанием создать более безопасное и процветающее будущее для следующего поколения, свободное от неопределённостей глобализации и культурной эрозии."
 POLITICS_ERIC_ZEMMOUR_DESC:0 "Эрик Земмур, новоизбранный президент Пятой Французской Республики, — не просто публицист, но мыслитель, не боящийся бросать вызов статус-кво и говорить то, что думает. Выросший в мультикультурном районе Парижа, Земмур воочию испытал напряжённость и сложность иммиграции и разнообразия. Его ранний опыт сформировал его мировоззрение и привил глубокое чувство национальной идентичности и культурной гордости. Образованный в области права и политологии, карьера Земмура как журналиста и автора определялась его готовностью сталкиваться с запретными темами и оспаривать господствующие нарративы. Его беззастенчивая защита французских ценностей и традиций сделала его поляризующей фигурой, но также обеспечила ему преданных последователей среди тех, кто чувствует себя маргинализованным или игнорируемым мейнстримной политикой.\n\nКак лидер, Земмур руководствуется убеждением в важности сохранения культурного наследия и национальной идентичности Франции. Его президентство движимо желанием защитить французский суверенитет, укрепить границы и восстановить закон и порядок во французских общинах."
 POLITICS_PIERRE_DEVILLIERS_DESC:0 "Пьер де Вилье, новоизбранный президент Пятой Французской Республики, — не просто военный лидер, но человек чести и неподкупности с глубоким чувством долга перед своей страной. Родившийся в военной семье, де Вилье с ранних лет усвоил ценности дисциплины и служения. Его отец, заслуженный генерал, привил ему любовь к стране и приверженность защите её интересов. Образованный в области военной стратегии и командования, выдающаяся карьера де Вилье в вооружённых силах привела его в некоторые из самых сложных и опасных регионов мира. Его опыт на поле боя сформировал понимание геополитики и сложностей современной войны.\n\nКак лидер, де Вилье известен своей скромностью и готовностью прислушиваться к советам экспертов и советников. Его президентство руководствуется убеждением в важности силы через единство и сотрудничество, как внутри страны, так и за рубежом. Он полон решимости поддерживать репутацию Франции как мирового лидера и защитника демократии и прав человека."
 POLITICS_JADOT_DESC:0 "Янник Жадо — харизматичный лидер партии «Европа Экология — Зелёные» и видная фигура французского экологического движения. Родившийся в 1967 году, он вырос в семье, привившей ему страсть к природе и устойчивости. Его академический опыт в политологии и международных отношениях подпитывал его приверженность экологическим вопросам, что привело его к работе в различных НКО до прихода в политику.\n\nПолитическая карьера Жадо характеризуется его непоколебимой преданностью борьбе с изменением климата и продвижению зелёной политики. Он считает, что экологический кризис — не только экологическая проблема, но и социальная и экономическая, требующая срочных действий для защиты планеты и уязвимых сообществ. Как член Европейского парламента, он отстаивал амбициозное климатическое законодательство и добивался европейского «Зелёного курса». Жадо представляет будущее, где Франция задаёт тон в устойчивости, энергетическом переходе и социальной справедливости, продвигая видение справедливого общества, ставящего здоровье планеты во главу угла."
 POLITICS_PECRESSE_DESC:0 "Валери Пекресс — опытный политик и лидер партии «Республиканцы», известная своим прагматичным подходом к управлению и вниманием к экономическим реформам. Выросшая в политически активной семье, Пекресс рано развила живой интерес к государственной службе. Она училась в престижном Sciences Po, а затем получила диплом Национальной школы администрации, что проложило путь к её успешной политической карьере.\n\nКак бывшая министр высшего образования и исследований, Пекресс привержена образовательной реформе и инновациям. Её стиль руководства подчёркивает бюджетную ответственность, общественную безопасность и важность сильной национальной идентичности. Видение Пекресс для Франции включает оживление экономики, борьбу с безработицей и обеспечение конкурентоспособности страны на мировой арене. Она стремится объединить центр-правых под знаменем современного консерватизма, выступая за политику, уравновешивающую социальное обеспечение и экономический рост, а также отвечая на запросы разнообразного электората."
 POLITICS_BARDELLA_DESC:0 "Жордан Барделла — восходящая звезда политической арены и молодой лидер «Национального объединения», воплощающий новое поколение крайне правой политики во Франции. Родившийся в 1995 году, Барделла вырос в семье, поощрявшей сильные политические убеждения, и быстро стал активным в политике в подростковом возрасте. Его занятия политологией ещё больше подпитывали амбиции, приведя его к роли представителя партии, а затем её президента.\n\nРуководство Барделлы отмечено акцентом на национализм, контроль иммиграции и закон и порядок. Он позиционирует себя как голос «забытых» французских граждан, выступая за политику, ставящую во главу угла их нужды и заботы. Под его руководством «Национальное объединение» стремится вернуть идентичность Франции, подчёркивая сильную защиту культурного наследия и традиционных ценностей. Динамичный ораторский стиль Барделлы и способность находить общий язык с молодыми избирателями вывели его в центр внимания, поскольку он намерен усилить влияние партии на французскую политику и бросить вызов статус-кво."
 POLITICS_ROUSSEL_DESC:0 "Фабьен Руссель — видная фигура Французской коммунистической партии, ставшая значимым лидером после гражданской войны. Родившийся в рабочей семье, ранний опыт Русселя сформировал его глубокую приверженность правам трудящихся и социальной справедливости. Его политический путь начался с местного советника, где он быстро получил признание за защиту трудовых вопросов и расширение прав общин.\n\nПосле гражданской войны Руссель стал объединяющей силой левых, стремясь восстановить расколотое общество и дать голос лишённым прав. Он воплощает стойкость рабочего класса, выступая за новое социалистическое видение, приоритизирующее экономическую справедливость, экологическую устойчивость и крепкие социальные услуги. Страстные речи и навыки низовой организации Русселя мобилизуют поддержку среди тех, кто жаждет более справедливой и равноправной Франции.\n\nЕго стиль руководства подчёркивает сотрудничество и солидарность, стремясь объединить различные фракции левых для вызова статус-кво. Пока Франция справляется с последствиями конфликта, Руссель представляет будущее, где коллективные действия ведут к значимым переменам, создавая общество, где каждый гражданин имеет возможность процветать и где идеалы свободы, равенства и братства действительно воплощены."
 POLITICS_COQUEREL_DESC:0 "Эрик Кокерель — видная левая фигура, известная своей яростной защитой социальной справедливости и экономического равенства. Родившийся в 1974 году, Кокерель вырос в политически активной семье, что вдохновило его на пожизненную приверженность левым делам. Он имеет образование в области экономики и политологии, а его активизм охватывает десятилетия, сосредоточиваясь на таких вопросах, как права трудящихся, экологическая справедливость и антиаустеритетные меры.\n\nКак член Национального собрания, Кокерель признан за свои страстные речи и непреклонную преданность своим избирателям. Он верит в силу низовых движений и коллективных действий для достижения значимых перемен. Видение Кокереля для Франции включает приверженность социальной справедливости, устойчивому развитию и возрождению государственных услуг. Он стремится мобилизовать левых и объединить различные группы вокруг общей цели, борясь за Францию, где у каждого есть доступ к возможностям и базовым правам."
 POLITICS_BENEDETTI_DESC:0 "Иван Бенедетти — ярый националистический лидер, поднявшийся на видное место после гражданской войны и воплощающий беззастенчивую фашистскую идеологию, напоминающую ранние политические устремления Бенито Муссолини. Родившийся в 1980 году, годы становления Бенедетти прошли в климате политических волнений, сформировав его видение сильного, авторитарного государства, ставящего интересы коренных французских граждан превыше всего.\n\nБенедетти выступает за радикальное преобразование Франции, которое стремится устранить мнимые угрозы национальной идентичности и восстановить то, что он считает былой славой страны. Его речи находят отклик у тех, кто разочарован традиционной политикой, обещая возврат к сильному руководству и отказ от мультикультурализма. Риторика Бенедетти характеризуется пламенным национализмом, презрением к либеральной демократии и призывом к единству среди тех, кто разделяет его видение однородной Франции.\n\nКонсолидируя власть, руководство Бенедетти отмечено его амбицией создать централизованный, авторитарный режим, вторищий ранним дням фашизма в Италии. Он стремится демонтировать существующие политические структуры, заменяя их новым порядком, подчёркивающим верность государству и строгое следование его видению французской идентичности. В разделённой нации Бенедетти предстаёт как бескомпромиссный поборник национальной гордости, готовый захватить контроль и переопределить будущее Франции."
 FRA_form_a_scientific_committe_to_combat_the_pandemic:0 "Сформировать научный комитет"
 FRA_form_a_scientific_committe_to_combat_the_pandemic_desc:0 "Новая пандемия COVID-19 уже начала быстро распространяться по Франции, Европе и всему миру после того, как местные власти Уханя и остального Китая не смогли предотвратить её распространение. Хотя пандемия продолжится, а вирус не исчезнет в ближайшее время, первый шаг к борьбе с вирусом — понять его, и для этого французскому правительству придётся сформировать научный комитет. Комитет, состоящий из экспертов в различных областях, таких как патология, биология и экономика, а также из представителей различных государственных ведомств, сможет разработать первоначальную серию планов и рекомендаций, которые французское правительство внедрит в нашей борьбе с COVID-19."
 FRA_research_the_vaccine:0 "Начать разработку вакцины"
 FRA_research_the_vaccine_desc:0 "SARS-CoV-2, широко известный как covid-19 или коронавирус, уже доказал свою высокую заразность и способность вызывать опасные и потенциально смертельные заболевания у заражённых, причём многие больницы уже испытывают нехватку аппаратов ИВЛ для лечения пациентов. Хотя такие методы, как локдауны и ношение масок, уже рассматриваются и местами внедряются, ясно, что для действительного прекращения пандемии COVID-19 потребуется вакцина. Научный комитет уже встретился с делегатами крупных французских биотехнологических корпораций, включая Sanofi Pasteur, и рекомендовал немедленно начать исследования и разработку вакцины."
 FRA_enforce_a_lockdown_to_buy_time:0 "Провозгласить мандат локдауна"
 FRA_enforce_a_lockdown_to_buy_time_desc:0 "Быстрое распространение пандемии COVID-19 уже начало перегружать способность многих больниц во Франции принимать новых пациентов, и ясно, что необходимо принять решительные меры, чтобы предотвратить дальнейшее распространение. Научный комитет рекомендовал массовые локдауны, которые, хотя почти наверняка вызовут серьёзное охлаждение французской экономики в ближайшей перспективе, вероятно, спасут десятки тысяч французских жизней и снимут большую нагрузку с национальной системы здравоохранения."
 FRA_ease_the_restrictions:0 "Ослабить мандат"
 FRA_ease_the_restrictions_desc:0 "Ясно, что ни наша экономика, ни общество не могут выдержать нынешние ограничения локдауна. Чтобы наша политическая ситуация не вышла из-под контроля, мы должны ослабить некоторые наши правила. Франция переживёт эту бурю."
 FRA_keep_the_restrictions:0 "Усилить мандат"
 FRA_keep_the_restrictions_desc:0 "Наши врачи сообщили ужасающие новости. Похоже, прежние оценки смертности были слишком мягкими. Ещё страшнее то, что почти 45 % наших пожилых людей умирают от него (по сравнению с лишь 17 % по первоначальным прогнозам). Хотя неясно, почему даже самые мрачные прогнозы оказались неверными и почему в некоторых других странах смертность, кажется, ниже (возможно, вирус, которому мы подвержены, — это эволюционировавшая форма исходного штамма?), мы не можем позволить нашему народу страдать дальше."
 FRA_expand_welfare_payments:0 "Одобрить пакеты стимулов"
 FRA_expand_welfare_payments_desc:0 "Наша экономика понесла серьёзный удар, но интересы народа должны стоять выше неё. Оставшись без работы на долгие месяцы, многие, очевидно, не выживут без нашей поддержки. Мы должны защищать наш народ прежде всего. Пока что платить будем мы."
 FRA_push_vaccine_research:0 "Сократить медицинскую бюрократию"
 FRA_push_vaccine_research_desc:0 "Ситуация слишком тяжёлая для нашей старой и неповоротливой бюрократии. Наши медицинские работники должны использовать все доступные ресурсы для борьбы с этой пандемией. Они — наша единственная надежда."
 FRA_push_for_mass_vaccinations:0 "Ввести обязательную вакцинацию"
 FRA_push_for_mass_vaccinations_desc:0 "Первые вакцины прибывают, и теперь мы можем распространить их по всей Франции. Мы введём обязательную вакцинацию для государственных служащих, военных и работников общественных служб и призовём наши компании последовать этому примеру. Разумеется, эта идея уже встречает сопротивление. Некоторые утверждают, что мы не вправе навязывать им прививки. Они просто не видят смертей, которые происходят даже при наших ограничениях. Мы не можем делать вид, что всё нормально. Ничто не стоит такого риска."
 FRA_look_to_the_swedes:0 "Шведский ответ, французская проблема"
 FRA_look_to_the_swedes_desc:0 "Шведское правительство решило не вводить жёстких противоковидных ограничений. Пока мы не можем знать, насколько это эффективно против самого вируса, но мы знаем, что стране удалось стабилизировать экономику. Нам стоит последовать их примеру и позаботиться о том, чтобы жизнь шла своим чередом. Просто выделите больше средств больницам, введите лёгкие ограничения — и все продолжают работать!"
 FRA_revitalise_the_economy:0 "Программа экономического возрождения"
 FRA_revitalise_the_economy_desc:0 "Пандемия COVID уничтожила значительную часть мирового экономического роста. Поэтому продолжение ограничений лишь усугубит последствия этого кризиса. Мы не можем позволить нашей стране потерпеть крах в такой решающий момент!"
 FRA_develop_immunity:0 "Стимулировать иммунитет"
 FRA_develop_immunity_desc:0 "Поголовная вакцинация, возможно, и лучший путь, но мы просто не можем тратить ограниченные ресурсы и деньги на самостоятельную разработку вакцины. При этом мы должны не попасть в зависимость от американского Pfizer. Для этого наше Министерство здравоохранения предложило «стимулировать иммунитет» населения. Это рискованная ставка, но если мы направим деньги на лечение тяжёлых симптомов, а остальные будут самолечиться одобренными государством «средствами от симптомов», это может сработать. Люди смогут продолжать работу, как будто ничего не случилось."
 FRA_Restart_of_the_protests:0 "Революция жилетов"
 FRA_Restart_of_the_protests_desc:0 "Чёрт побери, конечно же, жёлтые жилеты тоже бунтуют. Отлично. Национальная солидарность и единство, как же. Мы должны быстро урегулировать этот кризис, иначе их беспорядки пустят под откос весь процесс восстановления!"
 FRA_push_through_reforms:0 "Преклонить колено"
 FRA_push_through_reforms_desc:0 "Мы действительно не можем заниматься этим прямо сейчас. Наша экономика на дне, и страна полностью остановила всякую деятельность. Мы должны сделать всё, чтобы спасти положение. Соглашайтесь на все их условия."
 FRA_try_to_negotiate:0 "За стол переговоров"
 FRA_try_to_negotiate_desc:0 "Как бы плохо ни было... возможно, мы сумеем это обойти. Стоит попробовать и посмотреть, согласятся ли они ограничить свои амбиции. Может, всё уладится?"
 FRA_the_negotiations_fail:0 "Разделяй и властвуй"
 FRA_the_negotiations_fail_desc:0 "Ладно, если они хотят действовать грубо, так и будет. Пошлите полицию разгонять протесты, покажите сожжённые машины и разрушения, которые они учинили. Франция узнает своих «героев»."
 FRA_accept_modifications:0 "Счастливый компромисс"
 FRA_accept_modifications_desc:0 "Блестящие переговоры! Так мы и жёлтые жилеты умиротворим, и не потеряем столько денег на социальные расходы! Франция всегда славилась заботой о трудящихся, и теперь это доказано."
 FRA_negotiate_with_the_syndicates:0 "Работать с профсоюзами"
 FRA_negotiate_with_the_syndicates_desc:0 "Мы должны показать миру, что эти бунтовщики не представляют французского трудящегося. Используйте профсоюзы и их поддержку наших институтов, чтобы погасить пожар. Подкупите профсоюзы, примкнувшие к протестам, чтобы они от них отреклись. Франция не преклонит колено перед насильственными бандитами."
 FRA_back_to_normalcy:0 "Закрепить реформы"
 FRA_back_to_normalcy_desc:0 "В соответствии с договорённостью с жёлтыми жилетами мы закрепим наши реформы в законе. Франция пережила ещё один кризис!"
 FRA_The_Opening_Volley:0 "Первый залп"
 FRA_The_Opening_Volley_desc:0 "С момента своего создания в 1970-х годах Национальный фронт остаётся бурной силой французской политики. Марин Ле Пен усердно искореняла фашистские и петеновские элементы в партии, но многие по-прежнему считают её движение крайне правым. Тем не менее Ле Пен объявила о выдвижении своей кандидатуры на президентских выборах 2022 года, и, учитывая серьёзные экономические проблемы и волнения во Франции, многие полагают, что она представляет серьёзную угрозу для Макрона в его попытке остаться президентом Франции. Только время покажет, кто победит, но результат в любом случае наверняка вызовет гнев и поляризацию."
 FRA_en_marche:0 "Идти с Макроном"
 FRA_en_marche_desc:0 "Победа Макрона в 2016 году дала Франции шанс наконец обрести республику, свободную от радикализма и политической нестабильности, республику, которая принесёт мир и безопасность Европе и миру через сотрудничество и понимание, но при необходимости применит силу против тиранических сил. Республику, которая откроет новые возможности для меньшинств и иммигрантов участвовать в многокультурной Франции, уважая при этом достойную культуру Франции. Республику, которая по-настоящему соответствовала бы революционному девизу «Свобода, равенство, братство». Именно эту республику хотят уничтожить предатели-фашисты из Национального фронта, но грядущая победа Макрона на выборах 2022 года развеет их тёмные надежды в последний раз."
 FRA_rassemblent_national:0 "Обратиться к Ле Пен"
 FRA_rassemblent_national_desc:0 "На протяжении десятилетий Национальный фронт оставался на обочине французской политики, лишь иногда поднимаясь, чтобы вновь упасть в безвестность, но с кампанией Марин Ле Пен это наконец меняется. Либеральный курс истеблишмента Макрона явно привёл Францию почти к краху, и пора перемен. Франция больше не будет отдавать свой суверенитет неизбранным наднациональным организациям, и волю французского народа больше не будут попирать брюссельские бюрократы. Либеральным элитистам не дадут возможности разрушить систему социальной защиты французского народа. Жестокие орды исламистов больше не будут навязывать французам свой фанатичный религиозный экстремизм. Нет, в 2023 году Франция будет свободна."
 FRA_the_west_african_sphere:0 "§YОперация§!: Слон"
 FRA_the_west_african_sphere_desc:0 "Наши интересы в Африке всегда были очевидны. Земли, некогда бывшие нашими колониями, по-прежнему связаны с нами экономически, лингвистически и военно. Многие «левые» заявляют, что мы должны покинуть этот регион, видя в наших попытках стабилизации «неоколониализм». Но они не понимают, что мы не можем бросить наших франкоязычных братьев на съедение джихадистам и хунтам, поддерживаемым Россией. Мы должны сосредоточить усилия, чтобы взять регион под контроль."
 FRA_economic_assistance:0 "Экономическое вмешательство"
 FRA_economic_assistance_desc:0 "Наши франкоязычные друзья всегда находились в трудном экономическом положении. Постоянно подвергаясь нападениям повстанцев, они никогда не могли развивать свою промышленность так успешно, как Нигерия к югу от них. Мы должны это изменить. Наши средства вдохнут новые силы в западноафриканскую экономику. И, конечно, часть этого богатства вернётся к нам..."
 FRA_military_assistance:0 "Военная помощь"
 FRA_military_assistance_desc:0 "Хотя экономика Западной Африки всегда нуждается в поддержке, ничего не добиться без стабилизации региональных конфликтов. Наши силы проливают кровь в этом регионе уже десять лет, но без того, чтобы местные правительства выставляли эффективные армии, всё будет напрасно. Обеспечение прочной сети местных армий под нашей координацией станет ключом к нашим будущим планам."
 FRA_combat_islamic_terrorism:0 "Подавить исламский экстремизм"
 FRA_combat_islamic_terrorism_desc:0 "Российское влияние — нависшая угроза над нашими африканскими проектами, но джихадисты — более насущная опасность. Разобраться с ними станет нашей ближайшей задачей. Не то чтобы русские и их марионетки хотели, чтобы правили исламисты. Помимо наших франкоязычных партнёров, в этой операции будет необходимо сотрудничество с Нигерией."
 FRA_cease_social_dumping:0 "Прекратить социальный демпинг"
 FRA_cease_social_dumping_desc:0 "Мы должны ставить свой народ на первое место. Наши беднейшие районы страдают от компаний, нарушающих трудовые права. Нашим рабочим должны платить больше, ибо французский идеал — заботиться о наших сельских регионах."
 FRA_tackle_trade_unions:0 "Разгромить профсоюзы"
 FRA_tackle_trade_unions_desc:0 "Коммунисты всегда критикуют нас за то, что мы «не поддерживаем рабочих», хотя именно профсоюзы постоянно пререкаются с нашей промышленностью. Их постоянные протесты, мятежи и забастовки лишь подрывают стабильность страны. Закройте их!"
 FRA_pension_reform:0 "Пенсионная реформа"
 FRA_pension_reform_desc:0 "В смелом шаге к обеспечению долгосрочного экономического будущего Франции правительство решило повысить пенсионный возраст с 62 до 64 лет. Эта реформа направлена на обеспечение устойчивости пенсионной системы с учётом стареющего населения и растущей продолжительности жизни. Сторонники подчёркивают положительное влияние этого изменения на государственные финансы, что позволит продолжать инвестиции в социальные услуги и экономический рост. Хотя некоторые отрасли выражают обеспокоенность, правительство уверено, что эта необходимая корректировка повысит устойчивость экономики, обеспечив справедливость для будущих поколений и защитив целостность французской системы социальной защиты."
 FRA_eu_recovery_instrument:0 "Инструмент восстановления ЕС"
 FRA_eu_recovery_instrument_desc:0 "Ле Пен утверждает, что Союз сдерживает нашу экономику, но это не так. Будь то миграция внутри Союза или единый рынок, наше влияние позволяет нам достигать больших высот, пока мы едины."
 FRA_support_european_federalization:0 "Поддержать европейскую федерализацию"
 FRA_support_european_federalization_desc:0 "Нас всё ещё считают великой державой, но это уже не совсем так. Американцы попирают европейцев в военном и экономическом отношении. Китайцы наводняют наши рынки дешёвыми товарами. Глобальный Юг не уважает нас и отвергает наши советы. Даже Россия — государство, которое мы считали разбитым и покалеченным за пределами всякого восстановления, — вновь подняла голову и пытается вернуть утраченную мощь. Так почему бы и нам? Разве европейцы, колыбель современной государственности, культуры и технологий, недостойны вновь занять своё законное место под солнцем? Мы должны объединиться, ибо только так мы сможем снова стать великой державой!"
 FRA_immigration_regulation:0 "Регулирование иммиграции"
 FRA_immigration_regulation_desc:0 "Бесконечная волна мигрантов, достигающая наших берегов, давно стала темой политических споров. Прежние правительства уверяли, что мы сможем ассимилировать этих людей, поскольку большинство прибывает из наших давно потерянных колоний, но ясно, что мы не можем интегрировать их достаточно быстро. Гетто без закона, где нет полиции, — обычное дело близ наших крупных городов. Наших учителей обезглавливают за защиту французского идеала деконструкции и анализа религии. Наши женщины боятся выходить на улицу ночью без сопровождения из страха быть избитыми бандой хулиганов. Не говоря уже об исламском терроризме. Мы должны исправить нашу систему, и остановка иммиграции — то, с чего мы можем начать."
 FRA_increase_corporate_tax:0 "Повысить налог на корпорации"
 FRA_increase_corporate_tax_desc:0 "Корпорации лишь сосали кровь обычного француза. Мы можем винить Макрона в нынешнем дефиците бюджета, но должны искать и решения. Налогообложение корпораций и поддержка малого бизнеса не только вернут видимость баланса на внутреннем рынке, но и наполнят казну деньгами, необходимыми для финансирования наших будущих проектов."
 FRA_strengthen_protectionism:0 "Усилить протекционизм"
 FRA_strengthen_protectionism_desc:0 "Почему мы должны позволять нашим предприятиям и отраслям страдать и гибнуть, пока дешёвые товары наводняют рынок? Мы этого не потерпим!"
 FRA_support_nuclear_power:0 "Поддержать ядерную энергетику"
 FRA_support_nuclear_power_desc:0 "Мы не такие, как немцы, которые отказываются от атомной энергетики в пользу «зелёной». Мы умнее!"
 FRA_criticize_the_eu:0 "Критиковать ЕС"
 FRA_criticize_the_eu_desc:0 "Что ЕС для нас сделал? Наводнил наши рынки более дешёвыми товарами, уничтожив наши отрасли в пользу восточных. И ради чего? Ради «единства»? Еврократы стали настоящей головной болью для нашей страны. Мы должны бороться с их влиянием, пока не стало слишком поздно."
