 FRA_Military_Retirement_category:0 "Большая игра"
 FRA_Military_Retirement_category_desc:0 "\n\n\n\n\n£GFX_FRA_Military_Loyalty_category\n\n\n\n\n\n\n\nФранцузские вооружённые силы были недисциплинированной организацией, которая десятилетиями пыталась вмешиваться в наши политические дела. При этом они — защитники нашей нации и обеспечат наше процветание и мощь в грядущие годы. Пока мы проходим через этот период политической неопределённости ради успеха нашей администрации, нам необходимо время от времени сотрудничать с армией и уступать её просьбам и требованиям. Её лояльность необходима, и мы должны тщательно работать с нашими вооружёнными силами, чтобы обеспечить величие Франции. \n\nСейчас у нас: \n§G[?happy_generals]§! генерал(ов) §Gдовольны§! режимом.\n§O[?neutral_generals]§! генерал(ов) §Oбезразличны§! к режиму. \n§R[?angered_generals]§! генерал(ов) §Rнедовольны§! режимом. \n§C[?retired_generals]§! генерал(ов) сейчас в §Cбессрочном отпуске§!."
 FRA_Natural_Military_Leader_Opinion_Sway:0 "Изменение мнения военного лидера"
 FRA_Natural_Military_Leader_Opinion_Sway_desc:0 "\"Я не могу помешать французам оставаться французами.\" — Шарль де Голль"
