 FPR_global_revolution_category_desc:0 "\n\n\n\n\n£GFX_FPR_permanent_revolution_cat\n\n\n\n\n\n\n\nДля подлинного освобождения нации пролетариат должен непрерывно и вечно бороться за своё лучшее. В его борьбе за свободу не должно быть пауз и перерывов; он должен всегда уничтожать угнетение, когда видит его в стране.\n\nИдея перманентной революции, осмысленная Троцким, должна быть воплощена по-настоящему. Если этого не произойдёт, мы станем предателями собственного дела, отказавшись от пролетарского идеала."
