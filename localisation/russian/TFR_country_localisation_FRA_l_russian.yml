 FAF_historical_idols_idea:0 "Исторические кумиры"
 FAF_historical_idols_idea_desc:0 "Франция никогда не испытывала недостатка в исторических гигантах. От Карла Великого до Наполеона наша плодородная земля породила одних из величайших фигур человеческой истории. В этой тьме именно они дают нам проблеск надежды. Они воплощают идеальную Францию — сильную Францию — ту, что когда-то правила Европой и распространяла влияние по всему миру. Мы, возможно, проиграли эту войну, но когда новые великие люди Франции сменят старых коррумпированных политиков, приведших страну к гибели, Франция снова расцветёт. Они откроют новый золотой век Франции."
 FAF_the_word_of_the_bishop_idea:0 "Слово епископа"
 FAF_criox_de_fau_idea:0 "Боевые кресты"
 FAF_criox_de_fau_idea_desc:0 "Когда в межвоенный период в Италии зародился фашистский дух, многие группы во Франции переняли его и привнесли на эту чужую землю. Но никто не владел им столь умело, как «Боевые кресты» под мудрым руководством Ла Рока. «Боевые кресты» стали объединяющей силой для французских патриотов и бойцов. Хотя некоторые наши граждане всё ещё питают к ним обиду, в такие времена Франции нужны единство и патриотизм."
 FAF_criox_de_fau_better_idea:0 "Боевые кресты"
 FAF_criox_de_fau_better_idea_desc:0 "Когда в межвоенный период в Италии зародился фашистский дух, многие группы во Франции переняли его и привнесли на эту чужую землю. Но никто не владел им столь умело, как «Боевые кресты» под мудрым руководством Ла Рока. «Боевые кресты» стали объединяющей силой для французских патриотов и бойцов. Хотя некоторые наши граждане всё ещё питают к ним обиду, в такие времена Франции нужны единство и патриотизм."
 FAF_the_crime_of_opinion_idea:0 "Преступление мысли"
 FAF_the_crime_of_opinion_idea_desc:0 "В стремлении укрепить свою власть мы столкнулись с трудностью в одном деле — в сердцах и умах наших граждан. Перевоспитание сработало хорошо, но есть и другой инструмент: запретить мыслепреступления против режима. Сделав распространение или хранение либеральных, прогрессистских и антифранцузских идей наказуемыми штрафом или коротким тюремным сроком, мы гарантируем, что люди дважды подумают, прежде чем жаловаться на наше праведное правительство!"
