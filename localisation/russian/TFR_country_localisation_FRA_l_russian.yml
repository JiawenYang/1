 FAF_the_puppeteers_of_DAY_X_decision:0 "НАСТОЯЩИЕ кукловоды «Дня X»"
 FAF_the_puppeteers_of_DAY_X_decision_desc:0 "Германия, десятилетиями боровшаяся с национализмом, вдруг превращается в фашистскую страну после поражения в войне с Россией? МЫ СРАЖАЛИСЬ ЗА НАШЕ ПРАВИТЕЛЬСТВО, МЫ СРАЖАЛИСЬ, ЧТОБЫ ИЗГНАТЬ КОММУНИСТОВ! А ГЕРМАНИЯ просто замела их под ковёр в своих штрассеровско-коммунистических махинациях, и МЫ ВСЕ ЗНАЕМ, кто выигрывает, когда немцам нужно покупать оружие и брать кредиты..."
