 Brazil.1.a:0 "Прощай, французик!"
 Brazil.2.t:0 "Бразилия захватывает Гвиану"
 Brazil.2.d:0 "Укус поражения всё ещё свеж, и на нас обрушилась новая несправедливость. Трусливое бразильское правительство, почуяв слабость, тут же воспользовалось возможностью захватить заморский департамент Французская Гвиана — один из последних остатков нашего имперского прошлого. Сопротивления бразильскому вторжению почти не было. Остался лишь скелетный гарнизон: большая часть его немногочисленных людей и техники уже была переброшена на восток на убой. У тех, кто остался, не было ни времени, ни сил, ни желания сопротивляться. Единственное утешение: запасы техники уже были вычищены, и этот захват ничуть не усиливает бразильскую армию.\n\nНесмотря на призывы наиболее воинственных членов генерального штаба к немедленному контрудару, у нас нет возможности вмешаться даже в назревающую гражданскую войну у нашего южного соседа, не говоря уже о регионе на другом конце света. Одна из наиболее острых краткосрочных проблем, вызванных потерей региона, — прекращение поставок его золота, нефти и бокситов, которых нам наверняка будет не хватать в трудные времена. Планы всё же будут составлены, и, возможно, в лучшие времена мы сможем действовать, но пока ситуация в Европе не стабилизируется и русские не будут поставлены на место, всё это останется лишь несбыточной мечтой."
 Brazil.2.a:0 "Мы вернёмся."
 FAF_balancing_militarism_and_democracy_tt:0 "§CТаким образом, военная хунта, развязавшая гражданскую войну, будет отстранена, но её влияние ещё не удалено из французского общества§!"
