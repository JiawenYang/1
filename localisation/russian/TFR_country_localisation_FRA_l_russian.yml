 FAF_Renuclearization:0 "Нуклеаризация"
 FAF_Renuclearization_desc:0 ""
 FAF_Enforce_Edict_of_Paris:0 "Ввести в силу Парижский эдикт"
 FAF_Enforce_Edict_of_Paris_desc:0 "Чтобы покончить с декадансом и беспорядком либеральной демократии, мы возвращаемся к традиционному праву и обычаям. В частности, Парижский эдикт, восходящий к меровингскому законодательству VII века, уравновешивает полномочия церкви и государства, обеспечивая сохранение власти обоих. Чтобы ещё больше укрепить нашу администрацию, мы можем вновь ввести этот эдикт во французское право, следя за тем, чтобы он соответствовал современным проблемам и экономике."
 FAF_liberal_crackdown:0 "Разгром либералов"
 FAF_liberal_crackdown_desc:0 "Чтобы утвердить нашу новую администрацию, нам необходимо подавить подрывные элементы. В частности, сторонники прежнего режима и его декадентской либеральной демократии протестуют против каждого нашего шага и парализуют страну. Чтобы предотвратить любую контрреволюцию, мы должны использовать все необходимые средства, дабы окончательно сокрушить политическую мощь либерализма во Франции и не допустить возврата к порокам прежней Республики."
 FAF_communist_crackdown:0 "Разгром коммунистов"
 FAF_communist_crackdown_desc:0 "Вновь призрак бродит по Европе. Когда продажная Республика рухнула под собственной тяжестью, марксистские крысы, скрывавшиеся под личиной либеральной учтивости, попытались уничтожить нашу любимую Францию. К счастью, одержав победу в гражданской войне, мы наконец располагаем средствами, чтобы подавить эти элементы. Если мы потерпим неудачу, одному Богу известно, что станет с Европой, если наше движение падёт."
 FAF_imperial_decentralization:0 "Имперская децентрализация"
 FAF_imperial_decentralization_desc:0 "Как бы мы ни разделяли идеалы абсолютизма и централизованного правления, история показывает, что местное управление порой имеет свои преимущества. В частности, богатый ресурсами регион Роны является домом для множества местных учреждений, которые куда лучше умеют извлекать выгоду из этих земель. Да, у них будет некоторый контроль над местными законами и они смогут обходить наши решения, но зато они отдадут нам всё лучшее. Иногда приходится идти на жертвы — и взамен мы получим больше их вина мирового класса!"
