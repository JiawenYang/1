 FAF_XIV_Society_idea_desc:0 "Общество XIV посвятило себя восстановлению Франции в былой славе с помощью нашего режима. Мы сотрудничали с обществом ещё до гражданской войны через подпольные сети и прочее, но сегодня оно уже стало неотъемлемой частью нашего правительства. Пока мы имеем его поддержку, Франция будет на шаг ближе к возвращению былого величия."
