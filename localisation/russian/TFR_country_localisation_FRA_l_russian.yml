 FPR_anarchist_france_category_desc:0 "\n\n\n\n\n£GFX_FPR_black_banners_cat\n\n\n\n\n\n\n\nУгнетающий порядок стабильности веками был язвой на человеческой душе; под сапогами королей, вождей и полководцев нас заставляли делать то, чего мы никогда бы не сделали.\n\nПерестройка общества в более анархистском образе мыслей и жизни требует куда большего, чем мелкие споры и бесполезные указующие персты"
