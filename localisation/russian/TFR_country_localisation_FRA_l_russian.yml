 FAF_french_state_dummy:0 "Французский милитаризм"
 FAF_french_state_dummy_desc:0 ""
 FAF_hold_military_parade_decision:0 "Показать нашу силу"
 FAF_hold_military_parade_decision_desc:0 "Наше полное поражение в Русско-европейской войне опустошило нашу страну не только физически, но и морально. Наша национальная психика пропитана поражением и опустошением, и наш народ не хочет сражаться. Мы должны воодушевить французский народ, напомнив ему, что Франция остаётся сильной и могущественной державой — державой, которая не боится врагов и не колеблется, защищая свой народ."
 FAF_celebrate_our_victories_decision:0 "Наградить победителей"
 FAF_celebrate_our_victories_decision_desc:0 "Никогда не имело значения, сколько сил было вложено и насколько тяжёлым был путь, — важен лишь результат. В конечном счёте во всём есть лишь два исхода: успех или неудача, победа или поражение. Тех, кто побеждает и добивается успеха, нужно награждать, чтобы вдохновить других к победе и успеху. В конце концов, заслуги важнее всего."
 FAF_hail_to_the_chief_decision:0 "Слава вождю!"
 FAF_hail_to_the_chief_decision_desc:0 "Лидерство и ясная структурная организация — залог стабильности и успеха. Это важно для успеха армии, для работы корпорации; даже организованная преступность зависит от этого. Поскольку мы вышли победителями из анархии, опустошавшей Францию, мы должны перестроить эту страну вокруг центральной фигуры — политического сильного лидера, который сможет объединить свой народ и сплотить его ради общего дела."
 FAF_heir_of_degaulle_decision:0 "Принять голлистскую мысль"
 FAF_heir_of_degaulle_decision_desc:0 " Такой человек, как Шарль де Голль, не нуждается в представлении. Смелый государственный деятель и политический сильный лидер, он ни разу не подвёл французский народ и Францию. Когда немцы оккупировали нашу страну, сломили наш национальный дух и поработили наш народ, большинство политиков и генералов сдались и приняли поражение — но не Шарль де Голль. Он предпочёл бы умереть в бою, чем жить на коленях! При этом он был справедливым человеком, человеком чести. Тем, кто был демократически избран и уважал волю французского народа. Только помогая нашему народу принять и усвоить его смелые и достойные идеалы, мы сможем направить эту страну по верному пути."
 FAF_culmination_of_degaulle_petainist_thought_decision:0 "Принять голлистско-петеновскую мысль"
 FAF_culmination_of_degaulle_petainist_thought_decision_desc:0 "У де Голля и Петена были достойные черты. Принципы, позволившие им сиять в ту мрачную эпоху французской истории. Такие времена порождают раздор внутри нашей нации. Если мы примем идеалы лишь одного человека, сторонники другого наверняка начнут сеять хаос. Только приняв обе группы, мы можем обеспечить восстановление единства в нашей стране."
 FAF_heir_of_petain_decision:0 "Принять петеновскую мысль"
 FAF_heir_of_petain_decision_desc:0 "Во французской истории не было человека более спорного. Одни утверждают, что Петен — предатель, другие верят, что всё, что он делал, было ради защиты французского народа. Но никто не может отрицать, что он был и остаётся нашим национальным героем. Он оставил свой след и в Вердене, и в Виши — не ради личной славы, а ради безопасности французской нации и народа. Что бы он ни делал или не делал, он был человеком решимости, человеком великой любви к своему народу и своей стране, человеком, отдавшим всё в борьбе с красным ядом, отравлявшим нашу нацию. Нам крайне важно научить наш народ правде об этом историческом гиганте. Они научатся принимать нашу традиционную культуру и ценности и остерегаться большевистской угрозы."
 FAF_work_v_decision:0 "Наш труд!"
 FAF_work_v_decision_desc:0 "Наша страна была разрушена и оставлена в полном запустении русской ордой. Ещё много работы, чтобы восстановить всё, что было обращено в прах под их железными сапогами. Наш национальный дух всё ещё ждёт подъёма, а наш народ всё ещё ждёт, чтобы его кормили. Теперь более чем когда-либо мы должны посвятить себя колоссальной задаче восстановления нашей родины."
 FAF_family_v_decision:0 "Наша семья!"
 FAF_family_v_decision_desc:0 "Сколько семей было опустошено, разделено, уничтожено этой войной? Этой праведной войной против кровожадного врага, который не хочет ничего, кроме уничтожения нашей прекрасной страны, нашей исконной родины — Европы. Отныне мы должны защищать наш дом, нашу семью, наших братьев."
 FAF_fatherland_v_decision:0 "Наша родина!"
 FAF_fatherland_v_decision_desc:0 " За что сражается наш народ? За себя? Нет. Он сражается за общее дело, общую веру и общую цель. Чтобы защитить и сохранить то, что ему дорого. Свой дом, свою землю, своих братьев. "
 FAF_one_million_man_army_decision:0 "Армия в миллион человек"
 FAF_one_million_man_army_decision_desc:0 "Миллион солдат! МИЛЛИОН ЧЁРТОВЫХ СОЛДАТ! Люди, готовые умереть и сражаться за свою страну. Юноши, которые без единого сомнения отдадут кровь за свою землю и свой народ. С такой могучей армией французский народ может быть уверен, что страна его защитит."
 FAF_french_superiority_decision:0 "Французское превосходство"
 FAF_french_superiority_decision_desc:0 "Французская культура — одна из самых доминирующих, если не самая доминирующая, в мире. Французская изобретательность и креативность вывели нашу страну на мировую сцену. На протяжении человеческой истории одна Франция была центром искусства, технологий и литературы. Эти неоспоримые факты лишь подтверждают наше природное превосходство над другими — будь то собратья-европейцы или более далёкие культуры."
 FAF_taunt_our_enemies_decision:0 "Насмехаться над врагами"
 FAF_taunt_our_enemies_decision_desc:0 "У Франции бесчисленные враги — и внутри, и снаружи. Но что могут сделать эти крысы? Что могут эти никчёмные псы, чтобы вредить нашей стране? Они слабы и психологически, и физически. Коммунистические вырожденцы в нашей стране стали кроткими, а русские слишком заняты борьбой друг с другом. Как не смеяться над тем, что это наши так называемые враги? "
 FAF_our_french_mothers_decision:0 "Обожествлять Жанну д'Арк"
 FAF_our_french_mothers_decision_desc:0 "Храбрость — благороднейшее качество, которым можно обладать. Французское воплощение храбрости — Жанна д'Арк. Она сражалась с большей отвагой, чем мужчины в её отрядах. Она не плакала и не кричала, когда вырожденцы и предатели сожгли её заживо под ложными обвинениями. Она билась с врагами изо всех сил, никогда не отступая, никогда не дрогнув. Она остаётся идеалом, который вся Франция должна хранить в сердце. Все наши мужчины — наши солдаты — должны стремиться быть как Жанна д'Арк, сражаясь яростно, с огненной страстью и непоколебимой верностью."
 FAF_revive_the_franco_german_brigades_decision:0 "Восстановить франко-германские бригады"
 FAF_revive_the_franco_german_brigades_decision_desc:0 "У нас и немцев было немало проблем, но мы всё же братья. Глубокая связь между нами создана кровью и испытаниями. Наш общий враг на Востоке угрожает стабильности и существованию обеих наших стран. Мы должны постепенно расширять сотрудничество между двумя странами, и реформирование небольших, но высокомобильных франко-германских бригад — первый шаг в этом процессе."
 FAF_silence_german_critics_decision:0 "Замолчать критиков союзников"
 FAF_silence_german_critics_decision_desc:0 "Эти глупцы, критикующие наших европейских союзников, ничего не смыслят в стратегическом планировании. Им не хватает дальновидности и глубины. Поистине ужасно, как многие до сих пор не усвоили принцип «враг моего врага — мой друг». Их угроза для нас сейчас незначительна по сравнению с большевистской угрозой на Востоке. Мы, конечно, не будем им полностью доверять, но практичность всегда должна идти прежде идеологии."
 FAF_deliver_our_people_decision:0 "Обеспечить наш народ"
 FAF_deliver_our_people_decision_desc:0 ""
