 Capital_of_the_EU:0 "Столица Европы"
 Capital_of_the_EU_desc:0 "Брюссель — больше, чем город: это административное сердце европейского проекта. В его офисах, залах советов и безымянных стеклянных зданиях изо дня в день разрабатываются регламенты, заключаются компромиссы и управляются кризисы. Десятки тысяч чиновников, дипломатов, лоббистов и советников проходят по его улицам, превращая местное управление в континентальную заботу. Принятые здесь решения расходятся по рынкам, границам и институтам, зачастую задолго до того, как общественность о них узнаёт. Такая концентрация политического веса приносит влияние и ресурсы, но также пристальное внимание, инерцию и давление. Брюссель должен сочетать роль принимающего города с функцией нервного центра Европы, где стабильность, координация и преемственность ценятся выше скорости или зрелища."
