 FAF_republican_officers_dynamic:0 "Республиканское движение"
 FAF_republican_officers_dynamic_desc:0 "\n\n\n\n\n£GFX_FRA_revolution\n\n\n\n\n\n\n\nСоциалисты, «консерваторы»-демократы, либералы, атеисты. В нашем офицерском корпусе сохранилась коварная сила продажной Республики — мятежная и готовая свергнуть Королевство при первой возможности. Пока мы не выявим её главарей и не удалим их из вооружённых сил, нам будет трудно проводить сложные манёвры иначе как в беспорядке."
 FAF_republican_officers_movement_squabble_dummy_idea:0 "Республиканское движение"
 FAF_republican_officers_movement_idea:0 "Республиканское движение"
