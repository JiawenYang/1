 FRA_silence_the_radical_left:0 "Заставить замолчать подрывные элементы"
 FRA_silence_the_radical_left_desc:0 "Меланшон и его продажные приспешники отстранены, но это никогда не было концом их коварного предательства. Те, кто разделяет его злобные взгляды, не собирались просто сдаться и умереть, но даже умеренные выражали обеспокоенность. Для таких сомнений нет места, даже если эти опасения вызваны добрыми намерениями. Республика в кризисе, и ради её спасения необходимо жертвовать, даже если это означает на время взять её на поводок."
 FRA_reverse_their_decisions:0 "Обратить вспять экономические потрясения"
 FRA_reverse_their_decisions_desc:0 "Одним из многих отголосков прежнего социалистического правительства стал неисчислимый ущерб экономической способности Франции вести войну. Ошибочные попытки «поднять рабочего» и приоритет государства всеобщего благосостояния оставили Вооружённым силам мало средств, несмотря на надвигающуюся бурю, которая уже здесь. Ненужные реформы трудовых отношений, тормозящие производство, будут отменены — любое сопротивление профсоюзов будет встречено силой. Раздутое государство всеобщего благосостояния следует демонтировать, а его средства перенаправить на нужды обороны и другие проекты для защиты Франции."
 FRA_render_unto_caesar:0 "Воздать Цинциннату"
 FRA_render_unto_caesar_desc:0 "С момента провозглашения нашего нового правительства в наш адрес летит одна и та же критика. Идёт ли она от подлинных перебежчиков или от добрых людей Франции, которых просто ввели в заблуждение, обвинение повторяется: мы стремимся уничтожить Республику, мы не более чем неизбранные автократы, ищущие власти и богатства за счёт народа. Цезаризм не в повестке дня и никогда не будет. Наша верность — Республике, Франции. Как Цинциннат до нас, мы защитим государство и, когда будет достигнут мир, восстановим Республику — неважно, по кому или по чему нам придётся пройти."
 FRA_democratic_supervision_committee:0 "Республиканский надзорный комитет"
 FRA_democratic_supervision_committee_desc:0 "Поскольку ситуация на внутреннем фронте стабилизируется, мы можем двигаться дальше, чтобы ещё больше успокоить страхи людей. Предстоящий путь долог и тяжёл, но мы не должны отдыхать и откладывать будущее. Чтобы обеспечить более плавный переход от хунты к Республике, мы создадим комитет для проверки партий и кандидатов и подготовим досрочные выборы, когда пыль осядет. Огонь Республики будет поддерживаться — слабо, — чтобы достаточно было лишь добавить топлива, и он снова запылал ярко."
