 FAF_building_an_empire_idea:0 "Строить империю"
 FAF_building_an_empire_idea_desc:0 "Строить империю требует времени — как для подготовки к завоеванию, так и для искоренения желчи, оставшейся в её завоеваниях. Как говорится, \"Рим не за день строился\", и мы тоже. Нация должна быть стабилизирована, она должна быть процветающей, она должна быть освящена и навсегда устойчива, прежде чем мы сможем по-настоящему объявить нашу империю построенной. Возведённая на шатком фундаменте, она не стоит ничего."
 ROME_nationalist_party_long:0 "Civitas"
 ROME_nationalist_party:0 "Civitas"
 FAF_QU_idea_dummy:0 "Четырёхъязычное объединение"
