 FRA_regionalist_struggle_idea:0 "Регионалистская борьба"
 FRA_regionalist_struggle_idea_desc:0 "Пока Франция пытается в очередной раз силой перестроить свою идентичность, регионализм по всей стране становится повсеместным. \n\nХотя многие региональные идентичности были почти уничтожены во время Французской революции, они выжили, но едва-едва. С тех пор эти идентичности боролись за сохранение своих культурных традиций и языка, но с созданием более широкого европейского самосознания и последующим отбрасыванием всего, что делает Францию Францией, у этих регионалистов есть последняя возможность утвердить свою самобытную культуру, прежде чем она канет в страницы истории."
