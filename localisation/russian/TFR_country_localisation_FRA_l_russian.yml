 FAF_napoleonic_sympathies_dynamic:0 "Наполеоновское наследие"
 FAF_napoleonic_sympathies_dynamic_desc:0 "Наше государство имеет гордую и великую историю. Французское государство построено на достижениях Наполеона Бонапарта и семьи Бонапартов, которые в одиночку побеждали всю Европу несколько раз, прежде чем окончательно пасть от простого истощения. Никакое сияние не сравнится с сиянием Франции, Французской империи. Это величайшее государство всей Европы, и таким оно останется навсегда."
