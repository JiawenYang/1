 FRA_west_africa_intervention:0 "Земли Западной Африки"
 FRA_the_fifth_generation_fighter_category:0 "Проект пятого поколения"
 Fra_armed_forces_category_desc:0 "Французская армия — лучшая и важнейшая армия по эту сторону Атлантики. От завоеваний Карла Великого и Наполеона до славного освобождения Франции де Голлем и Леклерком история нашей армии одновременно славная и древняя. Мы недавно доказали, что наша армия способна действовать самостоятельно, без НАТО; однако нам не следует столь поспешно отказываться от союзников, ибо война несомненно уже на горизонте."
 FRA_west_africa_intervention_desc:0 "Западная Африка издавна является неотъемлемой частью Франции и нашей внешней политики.\nОднако год за годом эти государства пытаются всё дальше отдаляться от своего прежнего французского сюзерена, но §Rим никогда не познать вкуса свободы§!."
 FRA_yellow_vest_protests:0 "Протесты \"жёлтых жилетов\""
 FRA_yellow_vest_protests_desc:0 "С радикализацией \"жёлтых жилетов\" — как их называют СМИ — становится очевидно, что без немедленного решения, дающего протестующим хотя бы часть уступок, страна погрузится в ещё больший хаос, чем от одного COVID-19. Пока это решение не будет согласовано или найдено иным способом, Франция рискует своей внутренней стабильностью и политической целостностью."
