 FAF_Nationalize_the_Wine_and_Olive_Industries:0 "Национализировать винную и оливковую промышленность"
 FAF_Nationalize_the_Wine_and_Olive_Industries_desc:0 "Что касается культурной продукции, Франция славится экспортом вина и оливок. В настоящее время большая часть этих отраслей находится в частных руках и потому подвержена влиянию иностранных агентов. Если мы национализируем эти отрасли, то не только обеспечим дополнительные средства для нашего режима, но и гарантируем, что эта продукция останется гордостью и радостью Франции!"
