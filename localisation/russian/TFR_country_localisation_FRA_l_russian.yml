 FRA_Reforming_Civil_Services_idea:0 "Реформа государственной службы"
 FRA_Reforming_Civil_Services_idea_desc:0 "Благодаря всеобъемлющей перестройке государственной службы мы уже пожинаем плоды проводимых нашим правительством реформ. Стремясь, помимо прочего, к повышению эффективности, подотчётности и адаптивности, очевидно, что итог этих преобразований поможет Франции достичь нынешних целей модернизации административного потенциала страны и умиротворит государственный орган, продвигающий эти реформы."
 FRA_Reforming_Civil_Services_anti_corruption_idea:0 "Бастион против коррупции"
 FRA_Reforming_Civil_Services_anti_corruption_idea_desc:0 "Благодаря всеобъемлющей перестройке государственной службы мы уже пожинаем плоды проводимых нашим правительством реформ. Стремясь, помимо прочего, к снижению коррупции и повышению подотчётности, очевидно, что итог этих преобразований поможет Франции достичь нынешних целей модернизации административного потенциала страны и умиротворит государственный орган, продвигающий эти реформы."
 FRA_ENA_idea:0 "Национальная школа администрации"
 FRA_ENA_idea_desc:0 "Основанная Шарлем де Голлем в 1945 году, ENA должна была демократизировать доступ к высшей государственной службе Франции: ежегодно её заканчивали лишь 80–90 выпускников. Престижное учреждение, она стала ключевым путём к высоким должностям как в государственном, так и в частном секторе; среди её выпускников — четыре президента Франции, включая Эмманюэля Макрона.\nОднако протесты «жёлтых жилетов» высветили элитизм ENA: её выпускников критиковали за узкий центристский курс и сохранение социальных разрывов. Большинство выпускников ENA происходят из состоятельных семей, лишь 6 % — из рабочих.\n25 апреля 2019 года Макрон объявил о закрытии ENA, но перед лицом будущих экономических вызовов остаётся неясным, устоит ли это решение."
 FRA_INSP_idea:0 "Национальный институт государственной службы"
 FRA_ENA_Suspended_idea:0 "ENA приостановлена"
 FRA_ENA_Funds_idea:0 "Распределить средства"
 FRA_ENA_Funds_idea_desc:0 "С началом общей деконструкции Национальной школы администрации средства, ранее выделенные на эту администрацию, теперь можно перенаправить на более широкие административные реформы, такие как система образования и другие институты. Пока перенаправление осуществляется, высвободившиеся ресурсы будут влиты в экономику, чтобы дополнительно помочь модернизации страны."
 FRA_Sacking_ENA_Veterans_idea:0 "Долой старое"
 FRA_Sacking_ENA_Veterans_idea_desc:0 "Как гласит поговорка: «долой старое, да здравствует новое». Мы намерены убрать ветеранов Национальной школы администрации, многие из которых повинны в упадке администрации. Освобождение этих должностей позволит нам легко перевести квалифицированных людей на вновь открытые позиции, чтобы и дальше продвигать реформу и модернизацию французского административного института."
 FRA_Sacking_ENA_Veterans_INSP_idea:0 "Долой старое"
 FRA_Sacking_ENA_Veterans_INSP_idea_desc:0 "Как гласит поговорка: «долой старое, да здравствует новое». Мы намерены убрать ветеранов Национальной школы администрации, многие из которых повинны в упадке администрации. Освобождение этих должностей позволит нам легко перевести квалифицированных людей на вновь открытые позиции, чтобы и дальше продвигать реформу и модернизацию французского административного института."
