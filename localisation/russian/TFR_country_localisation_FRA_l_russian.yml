 FAF_EUN_army_of_purity_dummy:0 "Европейская гегемония"
 FAF_EUN_army_of_purity_dummy_desc:0 "Как идентитаристы, наше движение отличается от обычного ультраправого спектра Европы тем, что поддерживает континентальное объединение, а не только составляющие его нации. Видя, как Европейский союз рушится под ударами восточных орд, появилась возможность заполнить вакуум власти и стать гегемоном Европы. Поддержание нашего влияния может стоить нам политически, но быть новым центром континента необходимо, чтобы гарантировать нашу победу над силами мультикультурализма, либерализма и силами, стремящимися уничтожить нашу любимую Европу!"
 FAF_EU_unification_campaigns_idea:0 "Кампания гегемонистского объединения"
 FAF_EU_unification_campaigns_idea_desc:0 "В нашем крестовом походе за объединение всей Европы мы должны учитывать, что наше объединение отличается от тех, что предлагали прежние федералисты Европейского союза. Наша кампания сосредоточена на создании {{color|cyan|Европейской гегемонии}}, которая стремится объединить континент, но под гегемонией, защищающей его народы и культуры, а не извлекающей богатство для технократических элит. На следующий год мы выделили огромные ресурсы, чтобы эта кампания удалась и позволила нам избавить континент от всякого иностранного влияния!"
 FAF_europeanism_idea:0 "Европеизм"
 FAF_europeanism_idea_desc:0 "Европеизм призывает Европу быть единой, сохраняя национальные идентичности и региональные культуры. Разделённая Европа не может противостоять мировым державам; объединённые вооружённые силы позволяют сократить число используемых систем вооружений и, при общем языке, вербовать по всему континенту с населением почти в полмиллиарда."
 FAF_bastille_tt:0 "Наш осадный лагерь у главного командного центра и склада вооружений Вердена будет нам подотчётен."
