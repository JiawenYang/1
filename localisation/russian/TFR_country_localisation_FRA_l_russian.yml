 FAF_Support_Benedetti:0 "Поддерживать Бенедетти"
 FAF_Support_Benedetti_desc:0 "Наш великий лидер Бенедетти станет движущей силой национального возрождения. Он поднялся из пепла поражения и стал великим спасителем Франции, поэтому партия должна сплотиться вокруг него; те, кто этого не делает, должны быть приведены в порядок."
 FAF_Praise_the_Army:0 "Восхвалять армию"
 FAF_Praise_the_Army_desc:0 "Наши солдаты доблестно сражались на Восточном фронте, но, к сожалению, были преданы трусливым командованием. Наше новое государство восстановит честь великой французской армии; храбрая французская армия станет хребтом нового французского государства."
 FAF_Promote_Active_Clubs:0 "Поощрять активные клубы"
 FAF_Promote_Active_Clubs_desc:0 "Активные клубы необходимы, чтобы превратить бесцельных молодых людей в организованную французскую националистическую молодёжь. Во всех революциях истории молодёжный пыл был движущей силой перемен, и сегодня его нужно мобилизовать, чтобы создать голодную и энергичную молодёжь!"
 FAF_Honor_Vichy:0 "Чтить режим Виши"
 FAF_Honor_Vichy_desc:0 "Маршал Петен был героем, который провёл французский народ через самые смутные времена; однако после десятилетий власти, навязанной неолиберальными режимами, слава героев Виши была оклеветана. Жертвы, принесённые этими храбрыми людьми, должны быть вновь напомнены французскому народу."
 FAF_Cult_of_Benedetti:0 "Создать культ Бенедетти"
 FAF_Cult_of_Benedetti_desc:0 "Бенедетти будет не просто сильным лидером, ведущим разорённую нацию, но и символом новой французской эры. Каждый француз, каждая француженка и каждый ребёнок увидит в Бенедетти символ французского феникса, возрождающегося из пепла неолиберального вырождения и поражения."
 FAF_Utilize_Lafayette:0 "Использовать Лафайета"
 FAF_Utilize_Lafayette_desc:0 "Лафайет был одной из ведущих сил свержения старого порядка и стал своего рода современным Наполеоном. Теперь он один из самых известных людей Франции, и его публичная поддержка будет крайне важна для укрепления нашей власти."
 FAF_Create_Identity_Forums:0 "Создать форумы идентичности"
 FAF_Create_Identity_Forums_desc:0 "Римские форумы были местом, где интеллектуалы обсуждали науку, философию и другие вопросы. Франция тоже была нацией интеллектуалов, поэтому мы должны возродить нашу интеллектуальную культуру и создать форумы для новой националистической мысли."
 FAF_Look_to_the_Glory_of_Rome:0 "Обратиться к славе прошлого"
 FAF_Look_to_the_Glory_of_Rome_desc:0 "Франция — нация поэтов, философов, художников и великих завоевателей. Наследники великого Карла Великого, мы стали центром европейских инноваций и славы. Разумеется, Франция переживала трудные времена, но мы должны напомнить народу наше прошлое; несмотря на все испытания, Франция жила и продолжала свой путь."
 FAF_Harness_Federalist_Sympathizers:0 "Использовать федералистских симпатизантов"
 FAF_Harness_Federalist_Sympathizers_desc:0 "Многие чиновники прежнего слабого и хрупкого правительства, которое мы сменили, симпатизировали нашему движению; теперь, когда оно у власти, эти бывшие чиновники могут искупить своё бездействие и былую опалу, помогая нам сегодня."
 FAF_Glorify_the_Imperial_Era:0 "Прославлять имперскую эпоху"
 FAF_Glorify_the_Imperial_Era_desc:0 "Нет ничего лучше великой империи, раскинувшейся на весь континент, её народ, культуру и города, объединённые одним флагом и одной идеологией. Много раз мы были близки к тому, чтобы осуществить эту утопию, но нам отказывали снова и снова. Это будет наша последняя и самая решительная попытка достичь того, о чём мы так долго мечтали, и мы вкусим славу, когда это свершится."
 FAF_Formulate_Latinism:0 "Сформулировать новую доктрину латинизма"
 FAF_Formulate_Latinism_desc:0 "Латинизм как идеология всегда был довольно разрозненным и противоречивым понятием. Мы должны превратить его во что-то полностью единое и целеустремлённое, вроде идеологемы, близкой к умонастроению улья. Если мы этого не сделаем, мечта о новой Римской империи может быть навсегда омрачена."
 FAF_Disrupt_Benedetti:0 "Противостоять Бенедетти"
 FAF_Disrupt_Benedetti_desc:0 "Бенедетти, Бенедетти. Это не кто иной, как ещё один фашист, пытающийся подражать давно исчезнувшим несостоятельным государствам. Его культурная концепция \"Франции\" — единая нация, этническое государство — это глупость в чистейшем виде. Всё, что он планирует — речи, пропаганда, всё подряд — должно быть скрыто или иным образом испорчено, чтобы его порочные и гнилостные идеалы не распространились по нашей многонациональной стране."
 FAF_Identity_Forums_category:0 "За пределами нашего единственного предназначения"
 FAF_Identity_Forums_category_desc:0 "\n\n\n\n\n£GFX_FAF_identitarianism_cat\n\n\n\n\n\n\n\nКрасота этого континента бесподобна; очень долго неолиберальный проект пытался превратить Европу в экономическую зону и культурный парк развлечений, где остальной мир делает что хочет.\n\nС Францией под нашим руководством мы можем построить настоящий союз европейцев, для европейцев, руками европейцев: единство, идентичность и предназначение для наших братьев и сестёр."
 FAF_europa_united_against_communism_decision:0 "Единая Европа против коммунизма"
 FAF_europa_united_against_communism_decision_desc:0 "По сравнению с любой другой идеологией коммунизм сильнее всего противостоит европейской идентичности в том виде, в каком мы её знаем. Привлекая наших рабочих обещаниями процветания, они стремятся лишь к уничтожению европейской идентичности в своём бесконечном крестовом походе за однородное \"равенство\", направленном на разрушение нашей культуры. Вернулись ли орды с Востока к большевистской чуме или нет, их прежние связи можно увязать с растущими антироссийскими настроениями в Европе. Как бы то ни было, мы можем убить двух зайцев одним выстрелом, обеспечив очищение нашего общества от леворадикальных элементов."
 FAF_europe_for_europeans_decision:0 "Европа для европейцев"
 FAF_europe_for_europeans_decision_desc:0 "С самого зарождения нашего движения мы всегда отстаивали идею, что Европа должна быть только для европейцев. Теперь, когда наша власть обеспечена, мы наконец можем превратить этот прежний лозунг в конкретную политику, закрепляющую наше господство. Теперь, когда левые радикалы, будь то марксисты или либералы, не могут больше вопить об \"призывах к ненависти\" и недостатке \"сочувствия\" к этим чужим агентам… Настало время сдержать обещания!"
 FAF_european_beauty_dynamic:0 "Девственные земли Европы"
 FAF_european_beauty_dynamic_desc:0 "Земли, составляющие Европу, должны в первую очередь сохранять свою природную красоту и величие. Уничтожать то, что делает Европу Европой, значит уничтожать часть нашего собственного наследия и души ради одной лишь промышленности: это тяжкий грех, который мы должны искупить, если только не хотим стереть то, что делает Европу чистой и безупречной землёй."
 FAF_european_beauty_state_dynamic:0 "Девственные земли Европы"
 FAF_european_beauty_state_dynamic_desc:0 " Сверху Европа — лишь один из многих континентов, но в действительности это колыбель, которой всё человечество обязано благодарностью. Это великолепное творение географии, культуры и истории, и мы не будем вредить ему без необходимости. Если завоеватели или враги обрушатся на эти земли и осквернят их, как варвары, они найдут лишь судьбу в её самом истинном облике. Смерть."
 FAF_european_nation_dynamic:0 "Европейская гегемония"
 FAF_european_nation_dynamic_desc:0 "Как идентитаристы, наше движение отличается от обычного спектра европейских правых тем, что отстаивает континентальное объединение, а не просто составляющие его нации. Видя, как Европейский союз рушится под ударами орд с Востока, мы получили возможность заполнить вакуум власти и утвердиться как гегемон Европы. Поддержание нашего влияния может стоить нам политически, но стать новым центром континента необходимо, чтобы обеспечить наше торжество над мультикультурализмом, либерализмом и силами, желающими уничтожить нашу любимую Европу!"
 FAF_clarity_in_liberty_decision:0 "Ясность в свободе"
 FAF_clarity_in_liberty_decision_desc:0 "Некоторые утверждают, что, будучи правым движением, мы хотим лишь тоталитарную диктатуру и страдания. Если кто-то в наших рядах и считает такую систему оптимальной, правда в том, что идея \"свободы\" — это понятие, которое мы можем присвоить и использовать, чтобы привлечь тех, кто тоскует по либеральным демократиям прошлого. Однако эта свобода не связана с прогрессистскими глупостями или культом меньшинств, которые наблюдались до краха неолиберального мирового порядка. Разумеется, те, кто пользовался этими свободами, будут жаловаться, но цель ведь была в том, чтобы избавить континент от них, разве нет?"
 FAF_new_classicalism_decision:0 "Неоклассицизм"
 FAF_new_classicalism_decision_desc:0 "Наши мечты о единой Европе берут начало в славе Римской империи и принесённой ею культуре. Хотя с тех пор многое изменилось, идеи классицизма в нашем искусстве и архитектуре — то, к чему мы должны стремиться. Возрождая школы искусства, отдающие предпочтение произведениям великолепия и красоты, и отходя от унылых модернистских стилей, которые многие возненавидели, мы можем утвердиться как подлинные представители золотого века европейского искусства и культуры!"
 FAF_europeanist_propaganda_idea:0 "Панъевропейская пропаганда"
 FAF_europeanist_propaganda_idea_desc:0 "Все наши СМИ подвергаются бомбардировке панъевропейской пропагандой, вероятно, по указанию Европейской гегемонии ради продвижения объединения. Каким бы ни был наш ответ, тяжёлое предчувствие подсказывает, что мы можем не справиться с местным идентитаристским движением и вскоре будем вынуждены провести референдум. Если мы хотим сохранить независимость, мы должны немедленно что-то сделать, чтобы противостоять этой пропаганде."
 FAF_demand_unification_referendum_decision:0 "Потребовать референдум об объединении"
 FAF_demand_unification_referendum_decision_desc:0 ""
 FAF_invite_states_to_the_european_nation_decision:0 "Пригласить в европейскую нацию"
 FAF_invite_states_to_the_european_nation_decision_desc:0 "Своими силами или благодаря нашей прежней политической обработке, мы имеем счастье видеть, что [insert nation] уже благосклонно к нашему делу, и нам не нужно принуждать её к вступлению в наш континентальный союз. Поскольку наши отношения на высшем уровне, мы направим вежливое приглашение народу [insert country] присоединиться к своим братьям в Европейской гегемонии!"
 FAF_strengthen_europeanism_decision:0 "Укрепить панъевропеизм"
 hos_philosopher_king:0 "Король-философ"
 FAF_implement_policy_in_new_states_decision:0 "Распространить зелёное слово"
 FAF_implement_policy_in_new_states_decision_desc:0 "Было время, когда священные деревья Афины процветали, а вершины Олимпа украшались вечными снегами. Но сегодня земли Европы затянуты промышленностью. Древние леса гибнут под грохот машин, кристальные реки мутнеют от загрязнений. Колыбель западной цивилизации теряет свой священный облик под непрестанным натиском современности. Но спасение Европы не в городах из стали и бетона, а в гармонии человека и природы. Мы сможем доказать, что мы хранители древней цивилизации, только снова защитив красоту природы с благоговением. В этом наша доля: вечная надежда Европы."
