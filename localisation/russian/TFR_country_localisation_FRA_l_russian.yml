 FAF_Put_Pressure_on_the_Dalmatians_decision:0 "Требовать [CRO.GetFlag] §pпокорности Хорватии§!"
 FAF_Put_Pressure_on_the_Dalmatians_decision_desc:0 "От мраморных колоннад дворца Диоклетиана до латинских надписей Дубровника — наполненные солью адриатические ветры так и не смогли полностью изгладить след Рима с этой земли. Подобно тому как Адриатика вечно обращена на запад, к Вечному городу, культурная карта Хорватии всё ещё хранит ненаписанные страницы, ожидая нового возжигания латинского пламени. Когда закованные в броню рыцари Четвёртого крестового похода подняли латинский крест над Константинополем, история уже прокладывала путь для этой утраченной жемчужины латинской цивилизации — не для того, чтобы склониться перед османским полумесяцем или подчиниться славянскому двуглавому орлу, а для того, чтобы пройти по далматинским дорогам, некогда мощённым римскими легионами, и наконец вернуться под скипетр латинского имперского порядка."
 FAF_propaganda_campaign_in_Romania_decision:0 "Пропагандировать §Yрумынский латинизм§! [ROM.GetFlag]"
 FAF_propaganda_campaign_in_Romania_decision_desc:0 "Румыны, возможно, не первые, о ком думают, говоря о римском наследии, но на самом деле они столь же римляне, как и мы, французы. Румынский язык произошёл от вульгарной латыни, и этот народ разделяет гордое римское происхождение. Однако из-за своего географического положения они неизбежно оказались заражены славянским вирусом, размывшим то, что некогда делало их великим и могучим народом. И всё же кровь, текущая в жилах румын, остаётся прежней — им нужно лишь напомнить об их корнях."
 ROM_Identitarian_Influence:0 "Рост идентитаристского влияния"
 ROM_IDE_inf_tt:0 "§YМы распространим идентитаристское влияние по всей [ROM.GetFlag] Румынии§!"
 FAF_fund_identitarian_terror_in_ROM_decision:0 "Финансировать террор в [ROM.GetFlag] §YРумынии§!"
 FAF_fund_identitarian_terror_in_ROM_decision_desc:0 "Наши румынские братья снова в руках русского империализма. Русские бесы нашёптывают им свои речёвки, играют с их разумом, создавая в их душе ложный образ славянского наследия! Однако не всё потеряно. В Румынии ещё остались верные латинские братья, которые отождествляют себя со своей европейской семьёй, а не с ложной славянской. Мы должны помочь им распространить их послание, чтобы однажды они вернулись в наши объятия."
