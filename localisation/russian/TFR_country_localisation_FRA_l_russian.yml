 Euro_Collapse_idea:0 "Экономический крах"
 Euro_Collapse_idea_desc:0 "Спад французской экономики был неизбежен. Огромные военные репарации и целое поколение граждан, потерянное на войне, пустили эту страну под откос, и восстановление, несомненно, займёт много времени. Положение Франции кажется тяжёлым, но верьте, что наш народ преодолеет это, как преодолевал столько раз прежде."
