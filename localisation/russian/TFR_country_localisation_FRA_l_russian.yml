 FPR_soviet_france_category_desc:0 "\n\n\n\n\n£GFX_FPR_soviet_france_cat\n\n\n\n\n\n\n\nПремьер Казанова — направляющая рука нашей революции. Пролетариат ведёт человек у руля, сила, стоящая за марксистско-ленинским движением. Подражая великому Сталину, человеку, спасшему СССР в Великой Отечественной войне, мы не можем совершить ошибки."
 FPR_embrace_red_brothers_tt:0 "За каждую из следующих стран в нашей фракции вы получите 1 гражданскую фабрику и 25 политической власти \n[GER.GetFlag] Германия \n[ITA.GetFlag] Италия \n[RSR.GetFlag] Испания \n[LUX.GetFlag] Союз Нидерландов \n[PRP.GetFlag] Португалия \n[UK2.GetFlag] Англия \n[DEN.GetFlag] Дания \n[NRY.GetFlag] Норвегия \n[SWE.GetFlag] Швеция \n[FIN.GetFlag] Финляндия \n[GRK.GetFlag] Греция"
 FPR_will_raise_fg_brigades_tt:0 "Поднимет одну §Gопытную§! франко-германскую бригаду в §PЭльзасе§!"
 FPR_left_opposition_dyn_mod:0 "Блок Арто"
 FPR_left_opposition_dyn_mod_desc:0 "Блок Арто, который маршал Казанова называет ''Левой оппозицией'', — остатки некогда процветавшего троцкистского движения во Франции."
