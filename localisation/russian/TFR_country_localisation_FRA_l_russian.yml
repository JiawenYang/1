 FAF_brick_by_brick_idea:0 "Кирпич за кирпичом"
 FAF_brick_by_brick_idea_desc:0 "Наша страна была построена потом нашего труда, кровью нашего народа и жертвой многих поколений. После поражения в Русско-европейской войне наша страна лежит в руинах. Наши дома превратились в обломки, а заводы — в пыль. Недовольство растёт по всей стране, а сепаратистские движения усиливаются с каждым днём. Жизненно важно вернуть утраченную славу и гордость нашей нации. Частица за частицей, кирпич за кирпичом мы должны поднять Францию из нынешнего положения обратно к процветанию."
