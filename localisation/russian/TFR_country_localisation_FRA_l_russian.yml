 FRA_Apres_moi_le_deluge_spirit:0 "После нас хоть потоп"
 FRA_Apres_moi_le_deluge_spirit_desc:0 "Наши люди хлынут, словно поток, по полю боя."
 FRA_Heirs_to_Napoleon_spirit:0 "Наследие совершенства"
 FRA_Heirs_to_Napoleon_spirit_desc:0 "Наши офицеры служат той же стране, которую Наполеон возвёл к величию; они тоже способны привести нас к величию, как когда-то Наполеон."
 FRA_Edouard_philippe_HM:0 "Эдуар Филипп"
 FRA_Edouard_philippe_HM_desc:0 "Эдуар Филипп, родившийся 28 ноября 1970 года, — французский политик и юрист, занимавший пост премьер-министра Франции с 15 мая 2017 по 3 июля 2020 года при президенте Эммануэле Макроне. Он был членом партии «Республиканцы» (LR), прежде чем стать независимым. Филипп славился прагматичным подходом к управлению и умением ориентироваться в сложных политических ситуациях. На своём посту он столкнулся со значительными вызовами, включая движение «жёлтых жилетов» и пандемию COVID-19. Его стиль руководства часто описывали как спокойный и взвешенный, что снискало ему уважение по всему политическому спектру."
 FRA_Jean_Castex_HM:0 "Жан Кастекс"
 FRA_Jean_Castex_HM_desc:0 "Жан Кастекс, родившийся 25 июня 1965 года, — французский государственный служащий и политик, ставший премьер-министром Франции 3 июля 2020 года, сменив Эдуара Филиппа при президенте Эммануэле Макроне. Кастекс имеет опыт работы в государственном управлении и занимал различные правительственные должности, в том числе мэра Прада и регионального советника Окситании. Он известен своим опытом в вопросах здравоохранения и социальной сферы, особенно в сельской местности. Кастекс сталкивался с такими вызовами, как управление пандемией COVID-19 и реализация планов экономического восстановления. Его стиль руководства часто описывают как прагматичный и нацеленный на достижение консенсуса."
 FRA_Nicolas_Dupont_Aignan_HM:0 "Николя Дюпон-Эньян"
 FRA_Nicolas_Dupont_Aignan_HM_desc:0 "Николя Дюпон-Эньян, родившийся 7 марта 1961 года, — французский политик, основатель партии «Встань, Франция!» (DLF). Он видная фигура французской политики, отстаивающая национальный суверенитет, экономический патриотизм и традиционные консервативные ценности. Дюпон-Эньян был депутатом Национального собрания с 1997 по 2012 год и неоднократно баллотировался в президенты Франции. Он известен критикой Европейского союза и призывами вернуть Франции контроль над своими границами и экономикой. Его политические позиции часто совпадают с националистическими и евроскептическими взглядами, что делает его значимым голосом во французской политике."
 FRA_Philippe_de_Villiers_HM:0 "Филипп де Вилье"
 FRA_Philippe_de_Villiers_HM_desc:0 "Филипп де Вилье, родившийся 25 марта 1949 года, — французский политик, писатель и бывший депутат Европейского парламента. Он основатель правой евроскептической партии «Движение за Францию» и видная фигура французской политики на протяжении нескольких десятилетий. Де Вилье известен консервативными взглядами, защитой французского суверенитета и критикой глобализации и Европейского союза. Он также участвовал в культурных начинаниях, включая создание исторического тематического парка Пюи дю Фу. Его политическая карьера отмечена твёрдой позицией в защите французской самобытности и традиций. Он старший брат §CПьера де Вилье§!."
 FRA_elisabeth_borne_HM:0 "Элизабет Борн"
 FRA_elisabeth_borne_HM_desc:0 "Элизабет Борн, родившаяся 18 апреля 1961 года, — французский политик и государственный служащий, занимавшая несколько министерских постов во французском правительстве. Борн имеет образование в области гражданского строительства и работала на различных должностях в государственном и частном секторах. Она известна опытом в сфере транспорта и инфраструктуры: с 2017 по 2020 год была министром транспорта в правительстве премьер-министра Эдуара Филиппа. Борн признана за прагматичный подход к управлению и приверженность социальным и экологическим вопросам."
 FRA_mathilde_panot_HM:0 "Матильда Пано"
 FRA_mathilde_panot_HM_desc:0 "Матильда Пано, родившаяся 21 июня 1974 года, — французский политик и депутат Национального собрания. С 2017 года она представляет 10-й округ департамента Валь-де-Марн как член левой партии «Непокорённая Франция» (LFI). Пано известна своей активностью и защитой социальной справедливости, экологической устойчивости и прав человека. Она открыто критикует экономическое неравенство и активно участвует в различных социальных движениях. Её политические позиции часто совпадают с прогрессивными и антиистеблишментскими взглядами, что делает её видной фигурой французской политики."
 FRA_jean_yves_le_drian_FM:0 "Жан-Ив Ле Дриан"
 FRA_jean_yves_le_drian_FM_desc:0 "Жан-Ив Ле Дриан, родившийся 30 июня 1947 года, — французский политик, занимавший различные министерские посты во французском правительстве. Он член Социалистической партии и был депутатом Национального собрания и сенатором. Ле Дриан был министром обороны с 2012 по 2017 год при президенте Франсуа Олланде, где курировал французские военные операции за рубежом, в том числе в Мали и Сирии. С 2017 года при президенте Эммануэле Макроне он также занимает пост министра Европы и иностранных дел. Ле Дриан известен своим опытом в иностранных делах и ролью в формировании внешней политики Франции. Его считают ключевой фигурой французской политики, он участвовал во многих дипломатических усилиях от имени Франции."
 FRA_Catherine_Colonna_FM:0 "Катрин Колонна"
 FRA_Catherine_Colonna_FM_desc:0 "Катрин Колонна, родившаяся 17 марта 1956 года, — французский дипломат и политик. Она занимала различные дипломатические должности, в том числе посла Франции в Великобритании с 2017 по 2021 год. Колонна также работала во французском правительстве, будучи министром по европейским делам с 2004 по 2005 год при президенте Жаке Шираке. Она участвовала в формировании французской внешней политики, особенно в отношении Европы, и известна своими дипломатическими навыками и опытом. Её карьера отмечена приверженностью продвижению французских интересов за рубежом и укреплению европейского сотрудничества."
 FRA_Francois_Asselineau_FM:0 "Франсуа Асселино"
 FRA_Francois_Asselineau_FM_desc:0 "Франсуа Асселино, родившийся 14 сентября 1957 года, — французский политик и основатель партии «Народный республиканский союз» (UPR), которая выступает за выход Франции из Европейского союза. Асселино — яростный критик ЕС и того, что он считает размыванием французского суверенитета. Он неоднократно баллотировался в президенты Франции, продвигая своё видение «Фрекзита» и возвращения к независимому французскому государству. Его политические позиции часто совпадают с националистическими и антиглобалистскими взглядами, что делает его противоречивой фигурой французской политики."
 FRA_Raphael_Gluckmann_FM:0 "Рафаэль Глюксманн"
 FRA_Raphael_Gluckmann_FM_desc:0 "Рафаэль Глюксманн, родившийся 15 октября 1979 года, — французский писатель, кинематографист и политик. Он основатель политического движения «Общественная площадь» и депутат Европейского парламента с 2019 года. Глюксманн известен прогрессивными и проевропейскими взглядами, защитой социальной справедливости, прав человека и экологической устойчивости. Он открыто критикует ультраправые движения в Европе и активно продвигает европейское сотрудничество и интеграцию. Его политическая карьера отмечена приверженностью прогрессивным ценностям и усилиями по решению насущных проблем общества."
 FRA_Bruno_le_Maire_EM:0 "Брюно Ле Мэр"
 FRA_Bruno_le_Maire_EM_desc:0 "Брюно Ле Мэр, родившийся 15 апреля 1969 года, — французский политик, занимавший несколько министерских постов во французском правительстве. Он член партии «Республиканцы» (LR) и с 2017 года при президенте Эммануэле Макроне занимает пост министра экономики, финансов и восстановления. Ле Мэр известен опытом в экономических и финансовых вопросах и сыграл ключевую роль в формировании французской экономической политики. Он участвовал в усилиях по реформированию французской экономики, стимулированию инвестиций и укреплению позиций Франции в Европейском союзе. Его считают видной фигурой французской политики и убеждённым сторонником экономических реформ и европейской интеграции."
 FRA_Guillaume_Peltier_EM:0 "Гийом Пельтье"
 FRA_Guillaume_Peltier_EM_desc:0 "Гийом Пельтье, родившийся 27 июля 1976 года, — французский политик и член партии «Республиканцы» (LR). С 2012 года он депутат Национального собрания, представляющий 2-й округ департамента Луар и Шер. Пельтье известен консервативными и националистическими взглядами, защитой традиционных ценностей и национального суверенитета. Он видная фигура французского правого политического спектра и участвовал в усилиях по реформированию партии LR. Пельтье считают потенциальным будущим лидером партии и яростным критиком правительства Эммануэля Макрона."
 FRA_Eric_Coquerel_EM:0 "Эрик Кокрель"
 FRA_Eric_Coquerel_EM_desc:0 "Эрик Кокрель, родившийся 15 августа 1968 года, — французский политик и член партии «Непокорённая Франция» (LFI). С 2017 года он депутат Национального собрания, представляющий 1-й округ департамента Сен-Сен-Дени. Кокрель известен левыми и антикапиталистическими взглядами, защитой социальной справедливости, экологической устойчивости и прав трудящихся. Он открыто критикует меры жёсткой экономии и неолиберальную политику и активно участвует в различных социальных движениях. Кокрель считается ключевой фигурой партии «Непокорённая Франция» и участвовал в формировании её политической платформы."
 FRA_Pierre_Gattaz_EM:0 "Пьер Гаттаз"
 FRA_Pierre_Gattaz_EM_desc:0 "Пьер Гаттаз, родившийся 18 марта 1959 года, — французский предприниматель и бывший президент Французской предпринимательской конфедерации (MEDEF). Он возглавлял MEDEF с 2013 по 2018 год, представляя интересы французских работодателей и отстаивая политику, благоприятную для бизнеса. Гаттаз происходит из семьи с крепкими промышленными корнями и на протяжении карьеры участвовал в различных деловых начинаниях. Он известен продвижением экономических реформ, включая реформы рынка труда и меры по повышению конкурентоспособности. Гаттаз — заметный голос во французских деловых кругах, он участвовал в дискуссиях об экономической политике и промышленной стратегии."
 FRA_christophe_castaner_IM:0 "Кристоф Кастане"
 FRA_christophe_castaner_IM_desc:0 "Кристоф Кастане, родившийся 3 января 1966 года, — французский политик, занимавший несколько министерских постов во французском правительстве. Он член партии «Республика на марше!» (LREM) и близкий союзник президента Эммануэля Макрона. Кастане был министром внутренних дел с 2018 по 2020 год, курируя внутреннюю безопасность и правоохранительные органы. Ранее он был официальным представителем правительства при премьер-министре Эдуаре Филиппе. Кастане известен прагматичным подходом к управлению и усилиями по модернизации французской полиции. Он также участвовал в борьбе с терроризмом и поддержании общественного порядка."
 FRA_gerald_darmanin_IM:0 "Жеральд Дарманен"
 FRA_gerald_darmanin_IM_desc:0 "Жеральд Дарманен, родившийся 11 октября 1982 года, — французский политик, занимавший несколько министерских постов во французском правительстве. Он член партии «Республиканцы» (LR) и близкий союзник президента Эммануэля Макрона. С 2020 года Дарманен занимает пост министра внутренних дел, курируя внутреннюю безопасность и правоохранительные органы. Ранее, с 2017 по 2020 год, он был министром государственной службы и бюджетных счетов. Дарманен известен консервативными взглядами и жёсткой позицией в вопросах преступности и иммиграции. Он ключевая фигура администрации Макрона и участвовал в усилиях по реформированию французской полиции и решению проблем безопасности."
 FRA_Herve_Gomart_IM:0 "Эрве Гомар"
 FRA_Herve_Gomart_IM_desc:0 "Эрве Гомар — французский дипломат и офицер разведки. С 2013 по 2017 год он возглавлял Управление военной разведки (DRM), французское агентство военной разведки. Гомар имеет опыт в военных делах и разведке и участвовал в формировании политики национальной безопасности Франции. Он известен своим опытом в разведывательной сфере и ролью в координации разведывательных усилий в поддержку французских военных операций. Его руководство DRM совпало с периодом возросших вызовов безопасности для Франции, включая террористические угрозы и военные интервенции за рубежом."
 FRA_Jordan_Bardella_IM:0 "Жордан Барделла"
 FRA_Jordan_Bardella_IM_desc:0 "Жордан Барделла, родившийся 13 сентября 1995 года, — французский политик, член консервативной партии «Национальное объединение» (RN). С 2019 года он депутат Европейского парламента, представляющий округ Иль-де-Франс. Барделла известен консервативными и националистическими взглядами, защитой более строгой иммиграционной политики, крепких границ и сохранения французской культурной самобытности. Его считают восходящей звездой «Национального объединения» и ключевой фигурой в усилиях партии по расширению привлекательности среди молодых избирателей. Его политическая карьера отмечена решительной поддержкой Марин Ле Пен, лидера «Национального объединения», и усилиями по продвижению партийной программы."
 FRA_Stephane_Ravier_IM:0 "Стефан Равье"
 FRA_Stephane_Ravier_IM_desc:0 "Стефан Равье, родившийся 15 июня 1967 года, — французский политик, член консервативной партии «Национальное объединение» (Rassemblement National). С 2014 года он мэр 7-го сектора Марселя, а с 2017 года — сенатор, представляющий департамент Буш-дю-Рон. Равье известен консервативными и националистическими взглядами, выступает за более строгую иммиграционную политику, правопорядок и защиту французской культурной самобытности. Его считают видной фигурой «Национального объединения» и резким критиком традиционных политических партий. Его политическая карьера отмечена усилиями по решению проблем Марселя, включая преступность и городской упадок, а также поддержкой Марин Ле Пен, лидера «Национального объединения»."
 FRA_Ugo_Bernalicis_IM:0 "Уго Берналисис"
 FRA_Ugo_Bernalicis_IM_desc:0 "Уго Берналисис, родившийся 9 октября 1987 года, — французский политик, член левой партии «Непокорённая Франция». С 2017 года он депутат Национального собрания, представляющий 2-й округ департамента Нор. Берналисис известен прогрессивными и антиистеблишментскими взглядами, защитой социальной справедливости, экологической устойчивости и прав трудящихся. Он открыто критикует меры жёсткой экономии и неолиберальную политику и активно участвует в различных социальных движениях. Берналисис считается ключевой фигурой партии «Непокорённая Франция» и участвовал в формировании её политической платформы."
 FRA_Florence_Parly_IntelM:0 "Флоранс Парли"
 FRA_Florence_Parly_IntelM_desc:0 "Флоранс Парли, родившаяся 8 мая 1963 года, — французский политик, занимавшая несколько министерских постов во французском правительстве. Она член партии «Республика на марше!» (LREM) и близкий союзник президента Эммануэля Макрона. С 2017 года Парли занимает пост министра вооружённых сил, курируя военную и оборонную политику Франции. Она участвовала в усилиях по модернизации французской армии и укреплению обороноспособности страны. Парли известна своей экспертизой в оборонных вопросах и стремлением обеспечить безопасность Франции во всё более сложной международной обстановке."
 FRA_Sebastien_Lecornu_IntelM:0 "Себастьен Лекорню"
 FRA_Sebastien_Lecornu_IntelM_desc:0 "Себастьен Лекорню, родившийся 11 июня 1986 года, — французский политик, занимавший несколько министерских постов во французском правительстве. Он член партии «Республика на марше!» (LREM) и близкий союзник президента Эммануэля Макрона. С 2018 года Лекорню занимает пост министра заморских территорий, курируя заморские владения Франции. Ранее он был государственным секретарём при министре экологического и солидарного перехода, где занимался экологическими вопросами и вопросами устойчивого развития. Лекорню известен прагматичным подходом к управлению и усилиями по решению специфических проблем заморских территорий."
 FRA_Bertrand_de_La_Chesnais_IntelM:0 "Бертран де Ла Шене"
 FRA_Bertrand_de_La_Chesnais_IntelM_desc:0 "Бертран Мари Жозеф Уитт де Ла Шене — бывший генерал-майор французской армии и французский политик, член консервативной партии «Национальное объединение». Он известен консервативными и националистическими взглядами, выступая за более строгую иммиграционную политику, крепкие границы и сохранение французской культурной самобытности. Де Ла Шене участвовал в местной политике в коммуне Бретвиль-л'Оргёйёз в Нормандии. Он также был кандидатом на различных местных и региональных выборах, представляя программу «Национального объединения»."
 FRA_Alexis_Corbiere_IntelM:0 "Алексис Корбьер"
 FRA_Alexis_Corbiere_IntelM_desc:0 "Алексис Корбьер, родившийся 17 августа 1968 года, — французский политик и член левой партии «Непокорённая Франция». С 2017 года он депутат Национального собрания, представляющий 7-й округ департамента Сен-Сен-Дени. Корбьер известен прогрессивными и антиистеблишментскими взглядами, защитой социальной справедливости, прав трудящихся и экологической устойчивости. Он открыто критикует неолиберальную политику и активно участвует в различных социальных движениях. Корбьер считается ключевой фигурой партии «Непокорённая Франция» и участвовал в формировании её политической платформы."
 FRA_Gerard_Longuet_IntelM:0 "Жерар Лонге"
 FRA_Gerard_Longuet_IntelM_desc:0 "Жерар Лонге, родившийся 24 февраля 1946 года, — французский политик, занимавший несколько министерских постов во французском правительстве. Он член партии «Республиканцы» (LR) и с 2011 года сенатор, представляющий департамент Мёз. Лонге был министром обороны и по делам ветеранов с 2011 по 2012 год при президенте Николя Саркози. Он известен консервативными взглядами и экспертизой в вопросах обороны и безопасности. Лонге — видная фигура французской политики, участвовавшая в усилиях по реформированию французской армии и решению проблем безопасности."
 FRA_Michele_Alliot_Marie_IntelM:0 "Мишель Алльо-Мари"
 FRA_Michele_Alliot_Marie_IntelM_desc:0 "Мишель Алльо-Мари, родившаяся 10 сентября 1946 года, — французский политик, занимавшая несколько министерских постов во французском правительстве. Она член партии «Республиканцы» (LR) и с 2002 года депутат Национального собрания, представляющий департамент Пиренеи Атлантические. Алльо-Мари была министром обороны, внутренних дел, юстиции и иностранных дел в различных правительствах при президентах Жаке Шираке и Николя Саркози. Она известна консервативными взглядами и жёсткой позицией по вопросам безопасности и обороны. Алльо-Мари — видная фигура французской политики, участвовавшая в формировании внешней политики страны."
 FRA_Philippe_Olivier:0 "Филипп Оливье"
 FRA_Philippe_Olivier_desc:0 "Филипп Оливье, родившийся 2 декабря 1957 года, — французский политик, член консервативной партии «Национальное объединение». Он известен консервативными и националистическими взглядами, выступая за более строгую иммиграционную политику, крепкие границы и сохранение французской культурной самобытности. Оливье участвовал в местной политике в регионе О-де-Франс и был кандидатом на различных местных и региональных выборах, представляя программу «Национального объединения». Он также известен как бывший свояк Марин Ле Пен, лидера «Национального объединения»."
 FRA_Bernard_Emie:0 "Бернар Эмье"
 FRA_Bernard_Emie_desc:0 "Бернар Эмье — французский дипломат, занимавший различные высокие посты во французском правительстве. С 2017 года он генеральный директор Главного управления внешней безопасности (DGSE), французского агентства внешней разведки. Эмье имеет опыт в разведке и участвовал в формировании французской разведывательной политики и стратегии. Он известен своей экспертизой в разведывательных вопросах и ролью в координации разведывательных усилий в поддержку национальной безопасности Франции. Его руководство DGSE совпало с периодом обострения угроз безопасности для Франции, включая террористические угрозы и кибератаки."
 FRA_Jean_Messiha:0 "Жан Мессиха"
 FRA_Jean_Messiha_desc:0 "Жан Мессиха, родившийся 14 апреля 1970 года, — французско-египетский политик и член крайне правой партии «Национальное объединение». Он известен консервативными и националистическими взглядами, выступая за более строгую иммиграционную политику, крепкие границы и сохранение французской культурной самобытности. Мессиха участвовал в различных политических кампаниях и открыто критикует традиционные партии. Он также известен своими спорными заявлениями в социальных сетях и прессе. Его политическая карьера отмечена усилиями по продвижению программы «Национального объединения» и поддержкой Марин Ле Пен, лидера партии."
 FRA_Younous_Omarjee:0 "Юнус Омаржи"
 FRA_Younous_Omarjee_desc:0 "Юнус Омаржи, родившийся 14 октября 1969 года, — французский политик и депутат Европейского парламента с 2009 года. Он член левой партии «Непокорённая Франция» и входит в парламентскую группу Европейские объединённые левые/Северные зелёные левые (GUE/NGL). Омаржи известен прогрессивными и проевропейскими взглядами, защитой социальной справедливости, прав трудящихся и экологической устойчивости. Он активно участвовал в продвижении политики ЕС, выгодной трудящимся и маргинализированным сообществам. Омаржи считается ключевой фигурой партии «Непокорённая Франция» и участвовал в формировании её позиций по европейским вопросам."
 FRA_Philippe_Susnjara:0 "Филипп Сусняра"
 FRA_Philippe_Susnjara_desc:0 "Филипп Сусняра — младший офицер французской армии, специалист по оборонной безопасности и разведке."
