 FRA_covid_idea_1:0 "Низкий уровень Covid"
 FRA_covid_idea_1_desc:0 "Зарубежная пандемия COVID-19 достигла европейского континента, не подавая признаков остановки. Быстрое распространение вируса нагружает системы экстренной помощи и правительство Франции: собираются комитеты и комиссии из учёных и должностных лиц страны, чтобы сражаться с распространением COVID-19 так же стремительно, как оно охватило страну.\n\n§RЕсли не решить проблему, последствия для страны будут катастрофическими.§!"
 FRA_covid_idea_2:0 "Слабый Covid"
 FRA_covid_idea_2_desc:0 "Зарубежная пандемия COVID-19 достигла европейского континента, не подавая признаков остановки. Быстрое распространение вируса нагружает системы экстренной помощи и правительство Франции: собираются комитеты и комиссии из учёных и должностных лиц страны, чтобы сражаться с распространением COVID-19 так же стремительно, как оно охватило страну.\n\n§RЕсли не решить проблему, последствия для страны будут катастрофическими.§!"
 FRA_covid_idea_3:0 "Тревожный Covid"
 FRA_covid_idea_3_desc:0 "Зарубежная пандемия COVID-19 достигла европейского континента, не подавая признаков остановки. Быстрое распространение вируса нагружает системы экстренной помощи и правительство Франции: собираются комитеты и комиссии из учёных и должностных лиц страны, чтобы сражаться с распространением COVID-19 так же стремительно, как оно охватило страну.\n\n§RЕсли не решить проблему, последствия для страны будут катастрофическими.§!"
 FRA_covid_idea_4:0 "Калечащий Covid"
 FRA_covid_idea_4_desc:0 "Зарубежная пандемия COVID-19 достигла европейского континента, не подавая признаков остановки. Быстрое распространение вируса нагружает системы экстренной помощи и правительство Франции: собираются комитеты и комиссии из учёных и должностных лиц страны, чтобы сражаться с распространением COVID-19 так же стремительно, как оно охватило страну.\n\n§RЕсли не решить проблему, последствия для страны будут катастрофическими.§!"
 FRA_covid_idea_5:0 "Катастрофический Covid"
 FRA_covid_idea_5_desc:0 "Зарубежная пандемия COVID-19 достигла европейского континента, не подавая признаков остановки. Быстрое распространение вируса нагружает системы экстренной помощи и правительство Франции: собираются комитеты и комиссии из учёных и должностных лиц страны, чтобы сражаться с распространением COVID-19 так же стремительно, как оно охватило страну.\n\n§RЕсли не решить проблему, последствия для страны будут катастрофическими.§!"
 FRA_covid_curing:0 "Распределение лекарства"
 FRA_covid_curing_desc:0 "Народ Франции вздохнул с облегчением: отважные учёные Европы успешно создали проверенную вакцину, способную смягчить последствия пандемии. Хотя новая вакцина распространяется, потребуется время, чтобы полностью привить страну; но уже то, что лекарство удалось создать так скоро, имеет огромное значение. Полное искоренение вируса кажется близким: COVID-19 постепенно сойдёт на нет и превратится в нечто вроде обычной простуды."
 FRA_Omnicron_idea:0 "Вариант Омикрон"
 FRA_Omnicron_idea_desc:0 "Омикрон — это вариант вируса SARS-CoV-2, более известного как \"COVID-19\", недавно появившийся на юге Африки. Это вызвало новую волну паники: для этой мутации нет специально созданной вакцины. Надеемся, что вариант будет быстро искоренён, а исследователи в лабораториях упорно синтезируют новые методы лечения вируса."
 FRA_lockdown:0 "Общенациональный локдаун"
 FRA_lockdown_desc:0 "Чтобы справиться с массовым распространением пандемии COVID-19 в стране, мы ввели режим локдауна на всей территории, чтобы снизить текущий уровень заражений. Меры эффективны, но означают, что население должно оставаться дома, соблюдать социальную дистанцию, постоянно носить маски и дезинфицироваться по указаниям органов здравоохранения. Эти же указания означают, что многие граждане не могут ходить на работу, и недовольство может скоро выйти из-под контроля, если мы не откроем страну как можно быстрее."
 FRA_opening_up:0 "Экономическое открытие"
 FRA_opening_up_desc:0 "Внедряя на своей территории шведскую модель, мы почти сразу начали ощущать некоторые выгоды этого плана. Пока производство и экономическая система страны были парализованы локдаунами, ослабление ограничений побудило граждан возвращаться к своим занятиям с того места, где они их оставили, не полагаясь на государственные пакеты стимулов. Нам остаётся лишь надеяться, что этот переход к открытию страны не приведёт к новой волне вируса или иным непредвиденным последствиям."
 FRA_welfare_payments:0 "Пакет экономических стимулов"
 FRA_welfare_payments_desc:0 "Из-за ужесточения и без того суровых ограничений французы временно лишились своих средств к существованию и работы. Но, похоже, конца этой пандемии в обозримом будущем не видно. В таких условиях ответственный выбор нашего правительства — помочь французскому народу преодолеть эти тяготы и снова встать на ноги до того момента, когда наша страна наконец откроется."
 FRA_CFA_Franc:0 "Франк КФА"
 FRA_CFA_Franc_desc:0 "Несмотря на деколонизацию, влияние Франции остаётся сильным в её бывших западноафриканских колониях благодаря франку КФА — валюте, объединяющей две денежные зоны в 14 странах Африки южнее Сахары. Привязанный к евро, франк КФА ограничивает способность западноафриканских государств самостоятельно управлять экономикой, делая их уязвимыми к колебаниям европейских рынков и политике ЕС.\nОднако франк КФА выгоден французской экономике: он облегчает торговлю и обеспечивает макроэкономическую стабильность в регионе. Эта стабильность помогла предотвратить долговые кризисы и инфляцию, позволив французским корпорациям активно инвестировать в добычу ресурсов Западной Африки и получать миллиарды прибыли для Франции."
 FRA_CFA_Franc_2:0 "Франк КФА"
 FRA_CFA_Franc_2_desc:0 "Несмотря на деколонизацию, влияние Франции остаётся сильным в её бывших западноафриканских колониях благодаря франку КФА — валюте, объединяющей две денежные зоны в 14 странах Африки южнее Сахары. Привязанный к евро, франк КФА ограничивает способность западноафриканских государств самостоятельно управлять экономикой, делая их уязвимыми к колебаниям европейских рынков и политике ЕС.\nОднако франк КФА выгоден французской экономике: он облегчает торговлю и обеспечивает макроэкономическую стабильность в регионе. Эта стабильность помогла предотвратить долговые кризисы и инфляцию, позволив французским корпорациям активно инвестировать в добычу ресурсов Западной Африки и получать миллиарды прибыли для Франции."
 FRA_CFA_Franc_3:0 "Франк КФА"
 FRA_CFA_Franc_3_desc:0 "Несмотря на деколонизацию, влияние Франции остаётся сильным в её бывших западноафриканских колониях благодаря франку КФА — валюте, объединяющей две денежные зоны в 14 странах Африки южнее Сахары. Привязанный к евро, франк КФА ограничивает способность западноафриканских государств самостоятельно управлять экономикой, делая их уязвимыми к колебаниям европейских рынков и политике ЕС.\nОднако франк КФА выгоден французской экономике: он облегчает торговлю и обеспечивает макроэкономическую стабильность в регионе. Эта стабильность помогла предотвратить долговые кризисы и инфляцию, позволив французским корпорациям активно инвестировать в добычу ресурсов Западной Африки и получать миллиарды прибыли для Франции."
 FRA_damaged_left_idea:0 "Ослабленные левые"
 FRA_mass_migration_idea:0 "Массовая миграция"
 FRA_mass_migration_idea_desc:0 "\n\n\n\n£GFX_FRA_mass_migration_banner\n\n\n\n\n\nС 1973 года иммиграционная политика Франции была направлена на ограничение миграции, но в 2019 году более 120 000 прошений об убежище вызвали серьёзный политический раскол. На фоне экономического спада и высокой безработицы дебаты об иммиграции стали крайне острым вопросом.\nПравые, движимые страхом перед влиянием миграции на французскую самобытность и безопасность, выступают за более строгие границы и антииммигрантскую риторику. Националистические партии призывают закрыть границы, чтобы остановить приток.\nПо мере обострения споров французское общество всё сильнее поляризуется. С ростом числа беженцев из Северной Африки и Ближнего Востока экономическая нагрузка усиливается. Решительная иммиграционная политика вскоре станет неизбежной."
 FRA_mali_intervention:0 "Интервенция в Мали"
 FRA_Civilian_Oil_Rations:0 "Нормирование гражданского топлива"
 FRA_Civilian_Oil_Rations_desc:0 "Хотя Франции удалось преодолеть краткосрочные последствия гражданской войны в Саудовской Аравии, становится очевидно, что время уходит. Правительство объявило общенациональное обязательное нормирование гражданского топлива — подобно тому, как правительство США поступало во время эмбарго ОПЕК в семидесятые годы и во время иранской революции. Благодаря этому нормированию мы попытаемся удержать разумную цену на топливо, доступное гражданскому населению."
