 FRA_Dirigisme_idea:0 "Дирижистская экономика"
 FRA_Dirigisme_idea_desc:0 "Идея дирижизма всегда играла роль в экономических системах Франции. С увеличением объёма облигаций на следующее десятилетие мы обеспечим экономическое процветание Франции любыми необходимыми средствами, пока нестабильность в мире продолжает расти. С этим национальным возрождением дирижизма мы добьёмся большей эффективности Франции и исправим пороки прежних экономических систем, которые неоднократно сдерживали французскую нацию."
 FRA_Dirigisme_Tech_idea:0 "Дирижистская экономика"
 FRA_Dirigisme_Tech_idea_desc:0 "Идея дирижизма всегда играла роль в экономических системах Франции. С увеличением объёма облигаций на следующее десятилетие мы обеспечим экономическое процветание Франции любыми необходимыми средствами, пока нестабильность в мире продолжает расти. С этим национальным возрождением дирижизма мы добьёмся большей эффективности Франции и исправим пороки прежних экономических систем, которые неоднократно сдерживали французскую нацию."
 FRA_Laissez_Faire_idea:0 "Экономика лессе-фер"
 FRA_Laissez_Faire_idea_desc:0 "После десятилетий борьбы с раздутостью и коррупцией, порождёнными системой «дирижизма», мы наконец перешли к тому, чтобы свободный рынок вёл нашу страну вперёд. Помимо средств от продажи наших бывших «национальных чемпионов», масштабные налоговые сокращения оставили нашему народу более чем достаточно денег для повышения покупательной способности граждан. Некоторые сетуют на риски экономической «шоковой терапии» для прежней государственной системы и на потерю рабочих мест в госсекторе; но мы знаем, что свободный рынок гораздо лучше служит потребностям людей в погоне за прибылью!"
