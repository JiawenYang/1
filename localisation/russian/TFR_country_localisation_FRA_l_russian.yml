 FPR_utopia_category:0 "Направление §pУтопия§!"
 TFR_utopia_scripted_gui_desc:0 "Дидье Дененкс пообещал французскому народу утопию, построенную на принципах социализма, и он намерен сдержать это обещание.\n\nЧтобы достичь нашей цели, мы должны §Yреформировать наши законы§! и §Yулучшить развитие§! нашей страны до стандартов утопии.\n\nПусть на это уйдут многие годы упорного труда, но когда мы наконец выполним нашу задачу, мы сможем объявить народам мира:\n\n§GУтопия реальна, её зовут Франция, и она социалистическая§!."
