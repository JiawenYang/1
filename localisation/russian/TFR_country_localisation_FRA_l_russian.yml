 trait_FRA_Happy_with_Regime:0 "Доволен режимом"
 trait_FRA_Happy_with_Regime_desc:0 "Этот офицер испытывает глубокую честь служить Франции благодаря действиям действующего режима. \n\nЕсли что-либо дестабилизирует Французскую республику, этот офицер без всяких колебаний встанет на сторону истеблишмента."
 trait_FRA_Political_Retirement:0 "Политическая отставка"
 trait_FRA_Political_Retirement_desc:0 "Хотя они находятся в политической отставке, эти офицеры всё ещё могут служить любимой Франции в час кризиса, но без правительственного одобрения, которым пользуются другие генералы. \n\nЕсли что-либо дестабилизирует Французскую республику, этот офицер без всяких колебаний встанет против истеблишмента."
