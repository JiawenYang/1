 FRA_anti_islamism:0 "Антиисламистские протесты"
 FRA_anti_islamism_desc:0 "Поскольку приток беженцев с Ближнего Востока лишь вырос после начала гражданской войны в Саудовской Аравии, число протестов против этих групп резко возросло. Идеологии, которые они исповедуют, различны, но все эти группы убеждены, что этим просителям убежища следует отказать во въезде прежде всего из-за их религиозных убеждений. Хотя эти движения по-прежнему ближе к правому крылу нашей политики, мы должны найти лучшие способы интеграции или контроля над темпами иммиграции, иначе эти протесты станут инструментом радикализации, подрывающим веру общества в наши священные демократические институты."
 FRA_Oil_Crisis:0 "Нефтяной кризис"
 FRA_Oil_Crisis_desc:0 "С гражданской войной в Саудовской Аравии Аравийский полуостров потерял ту заёмную стабильность, которой прежде достиг, и вверг субконтинент в ещё большую небезопасность и нестабильность. Немедленное завершение гражданской войны не кажется близким, и последствия ощущаются уже сейчас. Возможность получать нефть через другую сторону сейчас недоступна, поскольку Россия и Венесуэла находятся под эмбарго западных стран, и обходить эти эмбарго было бы ударом по нашему международному имиджу. Пока мы не обеспечим надёжный источник нефти, мы будем страдать от последствий борьбы саудовцев за власть."
