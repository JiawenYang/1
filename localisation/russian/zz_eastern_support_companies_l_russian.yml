l_russian:
 E_Arty_Comp:0 "Восточная артиллерийская батарея"
 E_Arty_Comp_desc:0 "Восточная артиллерийская часть ротного уровня: шесть буксируемых гаубиц, 45 человек. Занимает одну ячейку поддержки."
 E_AT_Comp:0 "Восточная противотанковая рота"
 E_AT_Comp_desc:0 "Восточная противотанковая часть ротного уровня: восемнадцать тяжёлых ПТРК 9М133 «Корнет», 90 человек. Занимает одну ячейку поддержки."
 E_AA_Comp:0 "Восточная зенитная рота"
 E_AA_Comp_desc:0 "Восточная зенитная часть ротного уровня: восемнадцать зенитных пушечно-ракетных комплексов ближней зоны, 90 человек. Занимает одну ячейку поддержки."
 E_Recce_Comp:0 "Восточная разведывательная рота"
 E_Recce_Comp_desc:0 "Восточная разведывательная часть ротного уровня: шесть гусеничных разведывательных машин БРМ-3К, 100 человек. Занимает одну ячейку поддержки."
 E_Engi_Comp:0 "Восточная инженерная рота"
 E_Engi_Comp_desc:0 "Восточные инженерные части ротного уровня с мостовым, разминирующим и подрывным имуществом, 110 человек. Занимает одну ячейку поддержки."
 E_Helo_Comp:0 "Восточная армейская авиационная рота"
 E_Helo_Comp_desc:0 "Восточная часть армейской авиации ротного уровня: четыре ударных вертолёта Ми-24/Ка-52, 20 человек. Занимает одну ячейку поддержки."
