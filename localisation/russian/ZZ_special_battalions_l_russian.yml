l_russian:
 Marine_Bat_USA:0 "Батальон морской пехоты (США)"
 Marine_Bat_USA_desc:0 "Батальон морской пехоты Корпуса морской пехоты США: четыре стрелковые роты при поддержке LAV-25 и амфибийных транспортёров AAV-7. 2400 морских пехотинцев."
 Airborne_Bat_USA:0 "Парашютно-десантный батальон (82-я)"
 Airborne_Bat_USA_desc:0 "Парашютно-десантный батальон 82-й воздушно-десантной дивизии: три стрелковые роты с авиадесантной лёгкой бронетехникой. 1750 парашютистов."
 Marine_Bat_SOV:0 "Батальон морской пехоты (Россия)"
 Marine_Bat_SOV_desc:0 "Батальон российской морской пехоты: четыре роты на амфибийных бронетранспортёрах БТР-80 с огневой поддержкой ПТ-76. 1750 морских пехотинцев."
 Airborne_Bat_SOV:0 "Десантно-штурмовой батальон (ВДВ)"
 Airborne_Bat_SOV_desc:0 "Десантно-штурмовой батальон ВДВ: три роты на боевых машинах десанта БМД-4М, полностью авиадесантный. 1500 десантников."
 Marine_Bat_CHI:0 "Батальон морской пехоты (НОАК)"
 Marine_Bat_CHI_desc:0 "Батальон морской пехоты НОАК: четыре роты на амфибийных боевых машинах ZBD-05. 1500 морских пехотинцев."
 Airborne_Bat_CHI:0 "Воздушно-десантный батальон (НОАК)"
 Airborne_Bat_CHI_desc:0 "Батальон воздушно-десантного корпуса НОАК: три роты на боевых машинах десанта ZBD-03, полностью авиадесантный. 1500 десантников."
 Ranger_Bat_USA:0 "Батальон рейнджеров (75-й)"
 Ranger_Bat_USA_desc:0 "Батальон 75-го полка рейнджеров: три стрелковые роты элитной лёгкой пехоты, специализирующиеся на захвате аэродромов и рейдах прямого действия. 1160 рейнджеров."
 SOF_Bat_USA:0 "Батальон спецназа («Зелёные береты»)"
 SOF_Bat_USA_desc:0 "Батальон сил специальных операций армии США: три роты оперативных отрядов «Зелёных беретов» для нетрадиционной войны и поддержки внутренней обороны союзников. 600 операторов."
 SEAL_Bat_USA:0 "Батальон «морских котиков»"
 SEAL_Bat_USA_desc:0 "Батальон специальных операций ВМС: взводы «морских котиков», специализирующиеся на морских операциях прямого действия, прибрежной инфильтрации и разведке. 500 операторов."
 AirAssault_Bat_USA:0 "Аэромобильный батальон (101-я)"
 AirAssault_Bat_USA_desc:0 "Аэромобильный батальон 101-й воздушно-десантной дивизии: три стрелковые роты, перебрасываемые вертолётами UH-60 в сопровождении ударных вертолётов. 1800 человек."
 Spetsnaz_Bat_SOV:0 "Батальон спецназа ГРУ"
 Spetsnaz_Bat_SOV_desc:0 "Батальон спецназа ГРУ: три роты для глубинной разведки, диверсий и действий в тылу противника. 700 операторов."
 SOF_Bat_CHI:0 "Батальон спецопераций (НОАК)"
 SOF_Bat_CHI_desc:0 "Батальон бригады специальных операций НОАК: три роты для стратегической разведки, рейдов и диверсий. 800 операторов."
 AirAssault_Bat_CHI:0 "Десантно-штурмовой батальон (НОАК)"
 AirAssault_Bat_CHI_desc:0 "Батальон десантно-штурмовой бригады армии НОАК: три стрелковые роты, перебрасываемые вертолётами Z-8/Z-20. 1500 человек."
 Para_Bat_ENG:0 "Парашютный батальон (Великобритания)"
 Para_Bat_ENG_desc:0 "Батальон Парашютного полка: три стрелковые роты воздушно-десантной лёгкой пехоты. 1750 парашютистов."
 RM_Cdo_Bat_ENG:0 "Батальон коммандос Королевской морской пехоты"
 RM_Cdo_Bat_ENG_desc:0 "Подразделение коммандос Королевской морской пехоты: три роты, специализирующиеся на морском десанте и прибрежных рейдах. 1750 коммандос."
 SAS_Bat_ENG:0 "Батальон САС"
 SAS_Bat_ENG_desc:0 "Группа боевых эскадронов 22-го полка САС: четыре эскадрона для глубинной разведки, прямых действий и освобождения заложников. 500 операторов."
 REP_Bat_FRA:0 "Парашютный батальон 2-го ИПП"
 REP_Bat_FRA_desc:0 "Батальон 2-го иностранного парашютного полка (2e REP): четыре роты легионеров-парашютистов для быстрого развёртывания за рубежом. 2000 легионеров."
 CdoMarine_Bat_FRA:0 "Батальон морских коммандос (Франция)"
 CdoMarine_Bat_FRA_desc:0 "Батальон коммандос ВМС Франции: коммандос «Юбер» и штурмовые роты для морской борьбы с терроризмом и десантных рейдов. 600 коммандос."
 Marine_Bat_FRA:0 "Батальон морской пехоты (9-я БМП)"
 Marine_Bat_FRA_desc:0 "Батальон морской пехоты 9-й бригады морской пехоты: три роты на бронемашинах VBCI/VAB для десантных и заморских операций. 1750 морских пехотинцев."
 FJ_Bat_GER:0 "Парашютно-егерский батальон"
 FJ_Bat_GER_desc:0 "Немецкий парашютно-егерский батальон: три роты воздушно-десантной лёгкой пехоты дивизии быстрого реагирования. 1750 парашютистов-егерей."
 KSK_Bat_GER:0 "Батальон KSK"
 KSK_Bat_GER_desc:0 "Батальон Командования специальных сил (KSK): четыре роты коммандос для специальной разведки, прямых действий и освобождения заложников. 500 операторов."
 Geb_Bat_GER:0 "Горно-егерский батальон"
 Geb_Bat_GER_desc:0 "Горнострелковый батальон: три роты, специализирующиеся на боевых действиях в высокогорье и зимних условиях. 1900 горных егерей."
 Airborne_Bat_JAP:0 "Батальон 1-й воздушно-десантной бригады"
 Airborne_Bat_JAP_desc:0 "Батальон 1-й воздушно-десантной бригады Сухопутных сил самообороны Японии: три стрелковые роты парашютистов для быстрого развёртывания. 1500 парашютистов."
 ARDB_Bat_JAP:0 "Батальон амфибийной бригады быстрого развёртывания"
 ARDB_Bat_JAP_desc:0 "Батальон амфибийной бригады быстрого развёртывания: три роты с амфибийными машинами AAV-7 для обороны островов. 1750 человек."
 Marine_Bat_KOR:0 "Батальон морской пехоты (Корея)"
 Marine_Bat_KOR_desc:0 "Батальон Корпуса морской пехоты Республики Корея: три роты для морского десанта и обороны островов. 1750 морских пехотинцев."
 SOF_Bat_KOR:0 "707-й батальон спецназначения"
 SOF_Bat_KOR_desc:0 "707-я группа специальных задач: подразделения борьбы с терроризмом и специальной разведки Командования специальных операций армии Республики Корея. 500 операторов."
 Para_Bat_ISR:0 "Парашютный батальон (ЦАХАЛ)"
 Para_Bat_ISR_desc:0 "Батальон парашютно-десантной бригады ЦАХАЛ: три роты воздушно-десантной пехоты со штатными противотанковыми расчётами. 1500 парашютистов."
 Sayeret_Bat_ISR:0 "Батальон «Сайерет Маткаль»"
 Sayeret_Bat_ISR_desc:0 "Разведывательное подразделение Генерального штаба: группы глубинной разведки и освобождения заложников при Генштабе ЦАХАЛ. 500 операторов."
 Para_Bat_RAJ:0 "Десантный батальон спецназначения (Индия)"
 Para_Bat_RAJ_desc:0 "Батальон спецназа (пара) армии Индии: три роты для десантных рейдов и трансграничных специальных операций. 1500 операторов."
 Gorkha_Bat_RAJ:0 "Гуркхский стрелковый батальон"
 Gorkha_Bat_RAJ_desc:0 "Батальон гуркхских стрелков: три роты прославленных горных бойцов, специализирующихся на боевых действиях в горах и джунглях. 2000 стрелков."
 SOF_Bat_NKO:0 "Снайперский батальон ССО (КНА)"
 SOF_Bat_NKO_desc:0 "Батальон снайперской бригады Сил специальных операций Корейской народной армии: три роты для инфильтрации и дальней разведки. 800 операторов."
 Amph_Bat_NKO:0 "Батальон морского десанта (КНА)"
 Amph_Bat_NKO_desc:0 "Десантный батальон КНА: три роты, обученные высадке на побережье при поддержке судов на воздушной подушке и десантных катеров. 1500 человек."
 AirAssault_Bat_UKR:0 "Десантно-штурмовой батальон (Украина)"
 AirAssault_Bat_UKR_desc:0 "Батальон Десантно-штурмовых войск Украины: три роты высокомобильной аэромобильной пехоты. 1500 человек."
 SOF_Bat_UKR:0 "Батальон ССО (Украина)"
 SOF_Bat_UKR_desc:0 "Батальон Сил специальных операций Украины: три роты для специальной разведки и прямых действий. 600 операторов."
 Bordo_Bat_TUR:0 "Батальон «Бордовых беретов»"
 Bordo_Bat_TUR_desc:0 "Батальон Командования специальных сил Турции: три роты «бордовых беретов» для нетрадиционной войны и борьбы с терроризмом. 600 операторов."
 Komando_Bat_TUR:0 "Батальон коммандос (Турция)"
 Komando_Bat_TUR_desc:0 "Батальон коммандос-бригады турецкой армии: три роты, специализирующиеся на горных операциях и операциях по внутренней безопасности. 1500 коммандос."
 Quds_Bat_PER:0 "Батальон сил «Кудс»"
 Quds_Bat_PER_desc:0 "Батальон сил «Кудс» КСИР: три роты для зарубежных специальных операций и нетрадиционной войны. 700 операторов."
 Takavar_Bat_PER:0 "Батальон «Такавар»"
 Takavar_Bat_PER_desc:0 "Батальон «такавар» иранской армии: три роты коммандос, обученных десантным и амфибийным рейдам. 1500 коммандос."
 Folgore_Bat_ITA:0 "Парашютный батальон «Фольгоре»"
 Folgore_Bat_ITA_desc:0 "Батальон парашютной бригады «Фольгоре»: три роты итальянских парашютистов для быстрого развёртывания. 1500 парашютистов."
 SanMarco_Bat_ITA:0 "Батальон морской пехоты «Сан-Марко»"
 SanMarco_Bat_ITA_desc:0 "Батальон бригады морской пехоты «Сан-Марко»: три роты для морского десанта и операций в прибрежной зоне. 1500 морских пехотинцев."
 GROM_Bat_POL:0 "Батальон GROM"
 GROM_Bat_POL_desc:0 "Оперативная группа JW GROM: группы борьбы с терроризмом и специальных операций Командования специальных войск Польши. 500 операторов."
 Legion_Bat_SPR:0 "Батальон Легиона (Испания)"
 Legion_Bat_SPR_desc:0 "Бандера Испанского легиона: три роты элитной штурмовой пехоты для экспедиционных операций. 1500 легионеров."
 CSOR_Bat_CAN:0 "Батальон CSOR"
 CSOR_Bat_CAN_desc:0 "Батальон Канадского полка специальных операций: три роты для прямых действий и специальной разведки. 600 операторов."
 SASR_Bat_AST:0 "Батальон SASR"
 SASR_Bat_AST_desc:0 "Группа эскадронов Австралийского полка специальной авиационной службы: три боевых эскадрона для дальней разведки и прямых действий. 500 операторов."
 Jungle_Bat_BRA:0 "Батальон боевых действий в джунглях"
 Jungle_Bat_BRA_desc:0 "Батальон джунглей бразильской армии: три роты, специализирующиеся на речных и джунглевых операциях в Амазонии. 1500 человек."
 SSG_Bat_PAK:0 "Батальон SSG"
 SSG_Bat_PAK_desc:0 "Батальон Группы специальной службы армии Пакистана: три роты для специальной разведки, десантных и антитеррористических операций. 800 операторов."
 Marine_Bat_TAI:0 "Батальон морской пехоты (Тайвань)"
 Marine_Bat_TAI_desc:0 "Десантно-разведывательный батальон Корпуса морской пехоты Республики Китай: три роты, специализирующиеся на амфибийной разведке и прибрежных рейдах. 1250 морских пехотинцев."
 Saiqa_Bat_EGY:0 "Батальон «Сайка»"
 Saiqa_Bat_EGY_desc:0 "Батальон египетских сил «Сайка» («Молния»): три роты элитных ударных войск для десантных и коммандос-операций. 1500 человек."
