 #VEN_nicolas_maduro_char: "Никольас Мадуро"
 #VEN_nicolas_maduro_char_desc: "Никольас Мадуро Моро не родился в власти, окруженный горами золота. Он родился в среднестатистической семье в Каракасе, совершенно не подозревая, куда приведут его будущие решения.\n\nЕго отец был левым активистом, и его сложная история с властями послужила примером для Николаса, который в подростковые годы экспериментировал с идеями революции и классовой борьбы. Вместо того чтобы учиться в колледже, он начал работать обычным автобусным водителем в метро Каракаса, оставаясь при этом ценным членом своего синдиката. Его жизнь изменилась кардинально, когда он стал последователем Хуго Чавеса, когда тот провел свою неудавшуюся попытку переворота в 1992 году. Когда Чавес выиграл президентские выборы в 1999 году, Мадуро стал депутатом Национальной ассамблеи. Его преданность помогла ему занять место в кабинете Чавеса, и в конечном итоге он стал его вице-президентом в 2012 году.\n\nЧавес в то время страдал раком, и он знал, что у него не осталось много времени, поэтому публично объявил, что если он умрет, Мадуро его заменит. Умер он, и с тех пор все стало только хуже с каждым днем. Президентство Мадуро было отмечено нехваткой товаров, голодом, политическим смутом, страданиями и нестабильностью. Гуманитарный кризис, который обрушился на его страну, доказал, что он совершенно неэффективен в своих усилиях служить людям, которым он клялся защищать. Неважно, как сильно он пытался, все больше и больше людей отвергали его и сражались с ним на улицах, по которым он раньше маршировал как скромный активист.\n\nС каждым днем он становится все более авторитарным, отчаянно пытаясь удержаться у власти в стране, которая продолжает рушиться. Он делает это для сохранения наследия Чавеса и боливарианской революции, но эти усилия кажутся тщетными, как попытка восстановить кучку сгоревшего, разбившегося стекла."