l_russian:
 zzz_elections_uk.1.t:0 "Всеобщие выборы в Соединённом Королевстве"
 zzz_elections_uk.1.d:0 "Парламентский срок подошёл к концу. Штабы партий завершают формирование бюджетов кампаний, спонсоры определяются с выбором, а политическое направление страны решится у избирательных урн."
 zzz_elections_uk.1.a:0 "Финансировать кампанию правящей партии (§Y-50§! политической власти)"
 zzz_elections_uk.1.b:0 "Финансировать кампанию крупнейшей оппозиционной партии (§Y-75§! политической власти)"
 zzz_elections_uk.1.c:0 "Не вмешиваться в кампанию"
 zzz_elections_uk.2.t:0 "Голоса подсчитаны"
 zzz_elections_uk.2.d:0 "Британский электорат сделал свой выбор. Крупнейшая партия сформирует новое правительство, и начинается новый парламентский срок."
 zzz_elections_uk.2.a:0 "Принять результат"
