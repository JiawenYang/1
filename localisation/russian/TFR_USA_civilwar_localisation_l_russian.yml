l_russian:
 #Цепочка событий политического кризиса в США и неолиберального порядка (контент гражданской войны из TFR полностью удалён)
 usacw.5.t: "Трамп убит"
 usacw.5.d: "13 июля 2024 года бывший президент смертельно ранен на митинге в Пенсильвании и умирает в больнице. Объявлено чрезвычайное положение; республиканская коалиция рушится за одну ночь, а улицы заполняют теории заговора и призывы к мести."
 usacw.5.a: "Стране нужно спокойствие"
 usacw.6.t: "Республиканская партия рушится"
 usacw.6.d: "Смерть Трампа оставляет партию без единственной фигуры, скреплявшей её фракции. Ноябрьские выборы 2024 года проходят под угрозой насилия и при рекордной явке; демократы берут Белый дом и обе палаты. Проигравшие отказываются признать результат, победители заявляют о мандате на радикальные реформы."
 usacw.6.a: "Эпоха закончилась"
 usacw.7.t: "Дипломатический паралич"
 usacw.7.d: "В январе 2025 года конституционный тупик между Белым домом и Конгрессом наконец добирается до Государственного департамента: посольские посты массово пустуют, дипломатические назначения остаются неподписанными, продление договоров и консультации с союзниками заморожены на неопределённый срок. Союзнические обязательства Вашингтона превращаются в пустую бумагу, а телеграммы из посольств по всему миру единодушны: дипломатическая машина Америки остановилась. В Тайбэе впервые понимают, что поднять перо, подписывающее их гарантии безопасности, возможно, уже некому."
 usacw.7.a: "Вашингтон больше не отвечает"
 usacw.8.t: "Неолиберальный порядок вступает в силу"
 usacw.8.d: "Первого марта Белый дом и демократический Конгресс синхронно объявляют пакет законов «Консенсус восстановления»: дерегуляцию, приватизацию, технократическое правление и полный возврат к глобальным институтам. Во имя «эффективности» федеральное правительство обходит парализованный спор о правах штатов, а советники из Кремниевой долины и с Уолл-стрит напрямую входят в министерства. Критики называют это бескровным переворотом; сторонники верят, что это единственный выход из паралича."
 usacw.8.a: "Новый порядок начинается"
 usacw.9.t: "Мандат на глобальное вмешательство"
 usacw.9.d: "Пятнадцатого апреля Конгресс подавляющим большинством принимает Закон о глобальной стабильности, выдавая исполнительной власти неограниченный кредит на развёртывание армии США в любой точке Евразии. Неолиберальному порядку дома нужны дешёвая энергия, открытые морские пути и послушные союзники — и всё это придётся добывать авианосцами и дронами. С этого дня судьба Америки намертво приварена к победе на евразийских фронтах."
 usacw.9.a: "Пути назад нет"
 usacw.10.t: "Ставка — республика"
 usacw.10.d: "Фейерверки Дня независимости поднимаются по расписанию, но все понимают, что страна празднует на самом деле. Белый дом поставил весь свой политический капитал на одно обещание: победа в Евразии увенчает новый порядок ещё тридцатью золотыми годами, а поражение принесёт расчёт глубже Великой депрессии. Это игра, где ставка — судьба нации."
 usacw.10.a: "Победа или небытие"
 usacw.12.t: "Вечное большинство"
 usacw.12.d: "Победа в Евразии венчает неолиберальный порядок. Дешёвые ресурсы и дивиденды триумфа хлынули в страну, а оппозиция рухнула в опросах до однозначных цифр. Комментаторы уже открыто спрашивают, не является ли однопартийное правление конечной формой американской политики — ведь победителей не меняют местами. Эпоха демократов выглядит бесконечной."
 usacw.12.a: "Начало эпохи"
 usacw.13.t: "Большой расчёт"
 usacw.13.d: "Поражение в Евразии прокололо все лживые обещания неолиберального порядка. Разъярённая публика винит партию, поставившую на кон судьбу нации, и перестроенная Республиканская партия возвращается с подавляющим мандатом, обещая расчёт с демократами «от Уолл-стрит до Голливуда». Специальные прокуроры, проверки на лояльность и показательные процессы следуют один за другим — на этот раз проигравшие заплатят за всё."
 usacw.13.a: "Они ответят за всё"
 CHI_taiwan_us_support_tt: "Поддержка США Тайваня: -40"


#Американский нефтяной кризис
usa.7.t: "Нефтяной кризис ударяет по Америке!"
usa.7.d: "Как будто экономическая ситуация в Америке не могла стать ещё хуже, коллапс Саудовской Аравии создал нефтяную панику, которая вонзила последний гвоздь в гроб нашей анемичной экономики."
usa.7.a: "Что мы сделали, чтобы заслужить это?!"
usa.170.t: "Из богатства в нищету"
usa.170.d: "Он смотрел, сердце sinking, на красную цифру перед собой. Доу Джонс упал как никогда в истории — с 30 000 до 15 000 пунктов за два дня."
usa.170.a: "И он прыгнул в ледяной поток."
usa.202.t: "Уровень бедности взлетает"
usa.202.d: "Прошло несколько недель с начала нефтяного кризиса, но экономическая ситуация в Соединённых Штатах выглядит всё мрачнее."
usa.202.a: "Это только начало."
usa.217.t: "Безработица достигает 20%"
usa.217.d: "В шокирующем отчёте Бюро статистики труда уровень безработицы в Соединённых Штатах достиг 20% впервые со времён Великой депрессии."
usa.217.a: "Величайший провал правительства."
