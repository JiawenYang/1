l_russian:
 QL_GRAND_QL_PRC_AIR_AEROSPACE_SUPPORT:0 "Аэрокосмическая поддержка"
 QL_GRAND_QL_PRC_AIR_AEROSPACE_SUPPORT_DESC:0 "Стратегия с упором на оборону и поддержку передовых частей, нацеленная прежде всего на подрыв вражеского господства в воздухе, а не на его захват и использование; с одной стороны, укрепляются средства ПВО, с другой — различными методами обеспечивается поддержка передовых войск"
 QL_GRAND_QL_PRC_AIR_AGILE_DEPLOYMENT:0 "Гибкое боевое развёртывание"
 QL_GRAND_QL_PRC_AIR_AGILE_DEPLOYMENT_DESC:0 "Концепция «гибких боевых действий», предложенная Марком Уэлшем: важные стратегические силы рассредоточены по миру, но в соответствии с поставленной задачей авиация способна сконцентрировать удары и парализовать боевую эффективность противника"
 QL_GRAND_QL_PRC_AIR_INTEGRATED_OFFENCE_DEFENCE:0 "Единство наступления и обороны"
 QL_GRAND_QL_PRC_AIR_INTEGRATED_OFFENCE_DEFENCE_DESC:0 "Современная концепция НОАК «аэрокосмическое единство, сочетание наступления и обороны»: атмосферное и космическое пространство рассматриваются как единое поле боя, совершенствуются ПВО/ПРО и средства дальнего удара ради победы в каждой воздушной операции"
 QL_GRAND_QL_PRC_LAND_HYBRID_MODAL_WARFARE:0 "Гибридно-модальная война"
 QL_GRAND_QL_PRC_LAND_HYBRID_MODAL_WARFARE_DESC:0 "Передовая российская стратегия, развитая Герасимовым и его последователями; малые боевые группы комплексно применяют военные, политические и информационные средства для достижения стратегических целей, дёшево расшатывая систему противника"
 QL_GRAND_QL_PRC_LAND_INTEGRATED_MOBILITY:0 "Всеохватная пространственная манёвренность"
 QL_GRAND_QL_PRC_LAND_INTEGRATED_MOBILITY_DESC:0 "Современная концепция НОАК «манёвр по всем сферам, объёмные наступление и оборона»: упор на усиленное стратегическое проецирование, многомерные способы поражения и действенное материальное обеспечение; на практике упор делается на передовое ситуационное осознание и конфигурацию огня"
 QL_GRAND_QL_PRC_LAND_MULTI_DOMAIN_EXPEDITION:0 "Многодоменные экспедиционные силы"
 QL_GRAND_QL_PRC_LAND_MULTI_DOMAIN_EXPEDITION_DESC:0 "Военная мысль сухопутных войск США о «многодоменных операциях»: формирование многодоменных оперативных групп для захвата физического и когнитивного пространств и инициативы на поле боя; на практике больший упор делается на дальнее проецирование сил и межвидовое взаимодействие"
 QL_GRAND_QL_PRC_NAVAL_MOSAIC_KILL_CHAIN:0 "Мозаичная цепочка уничтожения"
 QL_GRAND_QL_PRC_NAVAL_MOSAIC_KILL_CHAIN_DESC:0 "В духе морской теории Мэхэна: сочетание пилотируемых и беспилотных систем и распределённое развёртывание платформ создают для противника сверхвысокую когнитивную нагрузку при принятии решений и повышают живучесть большого флота"
 QL_GRAND_QL_PRC_NAVAL_OCEAN_TRANSITION:0 "Стратегия океанского перехода"
 QL_GRAND_QL_PRC_NAVAL_OCEAN_TRANSITION_DESC:0 "Современная концепция ВМС НОАК «оборона прибрежных морей, охрана открытого океана», восходящая к доктрине «прибрежной обороны» Лю Хуацина и нацеленная на воспрещение доступа; в последние годы с изменением обстановки на повестку дня вышло совершенствование наступления и обороны в открытом океане"
 QL_GRAND_QL_PRC_NAVAL_REGIONAL_DETERRENCE:0 "Флот регионального сдерживания"
 QL_GRAND_QL_PRC_NAVAL_REGIONAL_DETERRENCE_DESC:0 "Смесь теории Горшкова и идей зелёноводного флота: с одной стороны, упор на стратегическое сдерживание ядерного океанского флота, с другой — из-за издержек и неблагоприятной географической обстановки развивается асимметричная прибрежная тактика"
 QL_GRAND_QL_PRC_SF_INDEPENDENT_OPERATIONS:0 "Независимые специальные операции"
 QL_GRAND_QL_PRC_SF_INDEPENDENT_OPERATIONS_DESC:0 "Силы специальных операций страны распределены по различным родам войск и силовым ведомствам и прежде всего служат задачам своих частей; их подготовка нацелена на адаптацию к конкретной боевой среде и достижение конкретных оперативных целей"
 QL_GRAND_QL_PRC_SF_JOINT_OPERATIONS:0 "Совместные специальные операции"
 QL_GRAND_QL_PRC_SF_JOINT_OPERATIONS_DESC:0 "Горизонтальная интеграция сил специальных операций страны в единое объединённое командование, способное беспрепятственно получать поддержку всех ведомств, при этом командная структура облегчает прямое управление и позволяет быстрее развёртываться и адаптироваться к обстановке"
