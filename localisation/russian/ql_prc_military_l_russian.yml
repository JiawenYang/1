 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_1:0 "Роевые действия"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_1_DESC:0 "Роевые действия беспилотников — новая тактика НОАК: насыщенные удары, продолжительное барражирование и интеллектуальная координация парализуют ПВО врага и наносят полное уничтожение его наземным целям"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_2:0 "Гибкая поддержка"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_2_DESC:0 "Тесное взаимодействие с наземными войсками — обязанность штурмовой авиации; слаженное тактическое соединение способно заставить врага понести тяжёлые потери от ударов с воздуха ещё до того, как он задействует любые свои силы"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_3:0 "Летающий танк"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_3_DESC:0 "Мы построим фронтовую авиацию поддержки, способную в любых условиях прорывать сеть ПВО и заслоны истребителей, смело проникая в самой опасной обстановке в глубокий тыл врага для ударов по ключевым объектам"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_1:0 "Паралич узлов"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_1_DESC:0 "Хотя в недавних локальных войнах современные городские агломерации зачастую очень трудно взять, после обнаружения и парализации важнейших узлов их оборонительные системы сами превратятся в бетонные гробы для окружённого врага"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_2:0 "Скрытый штурм"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_2_DESC:0 "Бомбардировщики должны обладать способностью скрытно наносить удары по стратегическим целям на больших дистанциях, перенося войну в глубокий тыл врага; такой наступательный замысел также вынудит силы ПВО противника вступить с нами в решающее сражение"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_3:0 "Высокоскоростная тактика"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_3_DESC:0 "Стремление к высотному скоростному прорыву в XXI веке уже является устаревшей стратегией бомбардировок, но часть накопленного опыта, например применение дистанционно наводимого оружия, всё ещё стоит изучать и совершенствовать"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_1:0 "Дальнее господство"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_1_DESC:0 "Увеличение дальности — одна из важнейших целей строительства ВВС Китая: не только расширение радиуса действий платформ и дальности оружия, но и возможностей обнаружения и распространения контроля над воздухом, воздушное наступление вместо пассивной обороны"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_2:0 "Проникающее господство"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_2_DESC:0 "Проникающее господство делает упор на скоординированном применении в сложных условиях острого противоборства и высокой угрозы отборных воздушных сил из множества сфер и направлений для прорыва плотно эшелонированной системы ПВО противника"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_3:0 "Блокирование воздушного пространства"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_3_DESC:0 "Вместо того чтобы содержать огромный авиапарк для удержания господства над неким районом, лучше нарушать возможности врага по контролю воздуха на всех фронтах; из-за чрезмерных издержек противник более не сможет использовать воздушное пространство поля боя"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_1:0 "Цифро-интеллектуальные ВВС"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_1_DESC:0 "ВВС Китая более не являются армией XX века с задачей противовоздушной обороны страны; по мере поступления всё более современной техники их истребительные части всё больший упор делают на дальности, малозаметности и интеллектуальности"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_2:0 "Стратегические ВВС"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_2_DESC:0 "Наши ВВС как наступательная авиация видят свою главную задачу в завоевании полного господства в воздухе и смелом ведении воздушного наступления на врага; прочие ведомства также должны прежде всего служить этой задаче"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_3:0 "Аэрокосмическая оборона"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_3_DESC:0 "Одними истребительными частями невозможно одержать победу во всех воздушных кампаниях; только действуя сообща с наземными объектами ПВО и военно-космическими силами, можно свести наши боевые потери к минимуму"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_1:0 "Единство информации и огня"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_1_DESC:0 "Эта новая концепция боевых действий делает упор на глубоком слиянии информации и огня: наблюдение, принятие решения и удар происходят быстрее, повышая эффективность поражения; роль войск смещается к разведке, наведению, сковыванию и контролю территории"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_2:0 "Авианаземное взаимодействие"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_2_DESC:0 "Боеспособность сухопутных войск проистекает не только из них самих: в тесной связке с воздушным и наземным оружием они способны наносить сокрушительные удары по системе врага, парализуя его ключевые сети и важнейшие узлы"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_3:0 "Превосходящий огонь"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_3_DESC:0 "Дорогие и опережающие уровень техники системы вооружения не подходят большой сухопутной армии, нацеленной на массовые операции; наращивание военного производства и развитие проверенного оружия являются более прагматичным направлением реформ"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_1:0 "Уничтожение врага в манёвре"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_1_DESC:0 "Со времён Революционной войны НОАК склонна к умеренно активной манёвренной стратегии; в отличие от оборонительных боёв и войны на изнурение она делает упор на концентрации превосходящих сил и наступательном уничтожении живой силы врага"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_2:0 "Манёвренная оборона"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_2_DESC:0 "Для наших войск прочная глубина построения является залогом победы; но это не означает косной оборонной стратегии — в движении следует использовать слабости врага и искать возможность нанести ему смертельное поражение"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_3:0 "Наступательные группировки"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_3_DESC:0 "Для этой огромной сухопутной армии нежелание отступать является основополагающим принципом; оставив несбыточные надежды на скорую победу, превращать каждое наступление в тяжёлый молот, под непрерывными ударами которого враг неизбежно рухнет"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_1:0 "Функциональное формирование"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_1_DESC:0 "Передовые части формируются прежде всего под конкретную задачу и начинают тактические действия, полностью сознавая положение своих сил и противника; сегодня функциональные формирования НОАК становятся всё более модульными, плоскими и интеллектуальными"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_2:0 "Модульное формирование"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_2_DESC:0 "Передовые части формируются с упором на адаптивность и обладают возможностью гибкого тактического выбора в самых разных условиях; НАТО и не входящие в НАТО союзники США стремятся применять более подвижные общевойсковые силы"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_3:0 "Готовое формирование"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_3_DESC:0 "Постоянно готовые соединения изначально были вынужденным решением при нехватке личного состава и техники, но обладают немалыми достоинствами: подвижны, стремительны, способны быстро вступать в бой и при надлежащей мобилизации сохраняют эффективность"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_1:0 "Победа через тыл"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_1_DESC:0 "«Сначала провиант и фураж, лишь потом выступление»; сегодня армия Китая выстроила густую, подобно капиллярам, сеть быстрого снабжения; интеллектуальная информатизированная логистика всесторонне повысила возможности объединённого обеспечения"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_2:0 "Быстрое развёртывание"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_2_DESC:0 "Как армия, для которой ключевой задачей является проецирование силы за рубеж, ещё в годы холодной войны сухопутные войска подготовили для своих зарубежных баз целый комплекс отлаженных инструментов и схем, гарантирующих быстрое реагирование"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_3:0 "Массовое обеспечение"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_3_DESC:0 "Даже самые плодородные земли не всегда способны прокормить солдат; для победы приходится запасать достаточное количество материальных средств и создавать обширную систему военного снабжения на случай вражеской блокады и испытаний стихией"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_1:0 "Авиационный контроль моря"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_1_DESC:0 "По мере превращения морской авиации ВМС НОАК из чисто береговой силы в главную силу на базе палубной авиации она, прикрывая флотскую систему ПВО, также наращивает возможности доставки огня флота"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_2:0 "Плавучая база"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_2_DESC:0 "Огромная авианосная ударная группа является острием национальной мощи, проецируемой за рубеж; эти движущиеся крепости являют неоспоримое сдерживание, неколебимы и неприкосновенны и наносят удары по врагу за тысячи миль"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_3:0 "Подкрепление ПВО"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_3_DESC:0 "Дух авианесущих крейсеров не полностью устарел: развитие морской авиации, предназначенной для прикрытия надводных кораблей с воздуха, по-прежнему необходимо; одновременно стратегические глубины врага должны перестать быть безопасными"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_1:0 "Подводная великая стена"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_1_DESC:0 "Подводные силы ВМС Китая прошли путь с нуля до сочетания атомных и неатомных лодок, от прибрежной обороны до устрашения в открытом море; хотя они ещё находятся в развитии, но уже стали серьёзной стратегической силой и подводной оборонительной сетью"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_2:0 "Безмолвный охотник"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_2_DESC:0 "Обладая ведущими в мире системами подводной войны, богатый накопленный опыт и технологии подводной скрытности помогут нам беззвучно уничтожать вражеские корабли и душить линии снабжения, в конечном счёте подрывая их боевую мощь"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_3:0 "Сдерживающая волчья стая"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_3_DESC:0 "Всестороннее развитие подводного флота является ключевой составляющей нашей способности океанского проецирования и стратегической ядерной триады, а также грозным средством уничтожения и сдерживания надводного флота — лезвием наших асимметричных сил"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_1:0 "Океанский эскорт"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_1_DESC:0 "Надводные силы армии Китая в новом веке стремительно выросли: не только тоннаж и масштаб, но качество и огонь; предполагаемый сценарий действий сместился от прибрежной обороны к океанскому эскорту"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_2:0 "Приоритет крупных кораблей"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_2_DESC:0 "После неудачной попытки с прибрежными боевыми кораблями будущее современных второстепенных судов выглядит неопределённым; но с другой стороны, огромные группы крупных кораблей по-прежнему обладают непревзойдённой мореходностью и способностью действовать в открытом океане"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_3:0 "Молодая школа"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_3_DESC:0 "Французская «Молодая школа» предлагала строить недорогое морское оружие против флотов, состоящих из множества крупных кораблей; сегодня мы возрождаем эту идею при помощи высокоточного оружия, заставляя вражеские корабли держаться вдалеке"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_1:0 "Воспрещение доступа"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_1_DESC:0 "Способность воспрещения доступа — это возможность в целях реагирования на чрезвычайные происшествия ограничить или предотвратить вмешательство третьих сторон в обозначенной запретной зоне; в настоящее время это главная задача ВМС НОАК в западной части Тихого океана"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_2:0 "Распределённое развёртывание"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_2_DESC:0 "Концепция мозаичной цепочки уничтожения отличается от прежних подходов флота: важные вооружённые средства рассредоточиваются, чтобы критические звенья боевой системы не понесли тяжёлого ущерба, надолго сохраняя её сдерживающую мощь"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_3:0 "Крепостная акватория"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_3_DESC:0 "Мы не стремимся к мировому морскому господству, но ни за что не допустим, чтобы вражеский флот действовал в наших прибрежных морях; объединяя береговые, надводные и подводные силы, создадим несокрушимую крепостную акваторию"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_MOBILE_ANNIHILATION:0 "Уничтожение в манёвре"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_MOBILE_ANNIHILATION_DESC:0 "Полностью используя манёвренность наших воздушно-штурмовых частей в сложной местности, громить в движении войсковые группы врага и искать возможность развить успех, уничтожая их живую силу и занимая выгодные районы"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_NODE_ASSAULT:0 "Штурм узлов"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_NODE_ASSAULT_DESC:0 "Развёртывание утяжелённых воздушно-штурмовых частей, сочетающих нашу армейскую ударную авиацию и средства доставки, для захвата важных наземных транспортных узлов, чтобы быть готовыми прорвать смертельную брешь в глубине вражеских позиций"
 QL_SUB_QL_PRC_SF_AIRBORNE_EMERGENCY_DEPLOYMENT:0 "Экстренное развёртывание"
 QL_SUB_QL_PRC_SF_AIRBORNE_EMERGENCY_DEPLOYMENT_DESC:0 "Главная задача воздушного десанта — переброска войск в особых условиях, а не противостояние тяжёлым силам; исходя из этой предпосылки наши десантные части уделяют повышенное внимание адаптивности и гибкой организации"
 QL_SUB_QL_PRC_SF_AIRBORNE_HEAVY_AIRDROP:0 "Тяжёлое десантирование"
 QL_SUB_QL_PRC_SF_AIRBORNE_HEAVY_AIRDROP_DESC:0 "Тяжёлое десантирование — сочетание передовых инженерных технологий и мужества бойцов; лишь немногие страны в мире продолжают поддерживать эту передовую способность, а десантирование механизированных частей наносит врагу сокрушительный удар"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_EXPEDITIONARY_GROUP:0 "Экспедиционная группировка"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_EXPEDITIONARY_GROUP_DESC:0 "Наша морская пехота создаётся с расчётом своевременно прибыть и защитить наши интересы в любой точке мира; поэтому новым направлением реформ является повышение адаптивности снаряжения и личного состава и средств дальней переброски"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_JOINT_LANDING:0 "Совместная высадка"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_JOINT_LANDING_DESC:0 "При прорыве побережья количество и качество наших войск всегда недостаточны; чтобы компенсировать слабость в решающий момент, необходимо задействовать массовый огонь и бронетанковые силы, способные разгромить прочные береговые укрепления"
 QL_SUB_QL_PRC_SF_RECON_DEEP_RAID:0 "Глубокий рейд"
 QL_SUB_QL_PRC_SF_RECON_DEEP_RAID_DESC:0 "Отборные передовые части, отвечающие за внезапные удары на поле боя и действия во вражеском тылу; используя их высокую подвижность и способность быстро развёртываться в любой местности, добывать разведданные и пытаться подорвать боевые возможности врага"
 QL_SUB_QL_PRC_SF_RECON_MULTI_MISSION:0 "Многопрофильные задачи"
 QL_SUB_QL_PRC_SF_RECON_MULTI_MISSION_DESC:0 "Более сложно устроенные и разносторонние отборные оперативные группы, отвечающие за важные стратегические действия уровня театра военных действий и страны, полноценно сочетающие возможности множества родов войск для выполнения самых трудных задач специальных операций"
