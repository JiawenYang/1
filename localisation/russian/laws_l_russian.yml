 FRA_foreign_legion_integration: "Французский Иностранный Легион"
 FRA_foreign_legion_integration_desc: "Légion étrangère, известный как Французский Иностранный легион, долгое время был орудием императорской мощи Французской империи, а позднее Французской республики. Сегодня он остается ярким примером французской военной мощи, и это приносит учреждению много пользы. Каждую неделю мы получаем приток молодых здоровых мужчин со всего мира, готовых начать новую страницу своей жизни в службе Легиону. \n\nВ настоящее время Легион задействован в обеспечении соблюдения Communauté Financière Africaine Franc в странах Западной Африки, которые находятся внутри валютных зон франка, а также в обучении прозападных стран и групп по всей Африке для обеспечения долгосрочной стабильности на континенте. Также очевидно, что исламский экстремизм на подъеме, и поэтому мы направим Легион для искоренения чумы, которая унесла жизни французских граждан в последние годы. \n\nЧесть и верность."
 FRA_foreign_legion_integration_TT: "Если в стране есть государство с религией, неприемлемой для цивилизации, к которой оно принадлежит, его личный состав будет ослаблен на 15%."
