 higher_female_desc: "\n''Вчера я немного увлеклась, но уже оправилась~\n\nИзвините~ меня приняли в аспирантуру! Я успешно окончила её~\nИ я продолжу обучение в аспирантуре и буду блистать в своей любимой области.\n\nЧто касается Сяо, думаю, ему будет сложно поступить. Может быть, он попытается подать документы в зарубежные вузы? Все вузы получат мои подтверждающие документы. [С любовью]\nЧто касается Сяо, он студент юридического факультета и, вероятно, попытается сдать экзамен на адвоката (извините, я уже его сдала). Я буду продолжать жаловаться на него и надеюсь, что у него будет успешная карьера (но, думаю, это будет сложно).\n\nЯ не знаю, как отключить личные комментарии на Bilibili, поэтому некоторое время не буду заходить.''\n- Ян Цзинъюань"
