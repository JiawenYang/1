 type_of_economy: "Тип Экономики"
 econ_capitalist_economy: "§YКапитализм§!"
 econ_capitalist_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_capitalism_banner\n\n\n\n\n\n§gКапитализм - это экономическая система, в которой частные компании и предприятия работают без вмешательства государства. В этой системе цены, издержки и заработная плата определяются рыночными силами, такими как спрос и предложение. Это означает, что государственный надзор и регулирование ограничены. Капитализм популярен среди рыночных либералов и стал наиболее распространенной экономической системой во всем мире.§!"

 econ_american_capitalism: "§YАмериканский Капитализм§!"
 econ_american_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_american_capitalism_banner\n\n\n\n\n\n§gАмериканская экономическая система является образцом для других стран со свободной рыночной экономикой. Она основана на свободной торговле и минимальном вмешательстве государства в экономические дела. Однако есть несколько уникальных характеристик, которые отличают эту систему от других форм капитализма.\nОдна из главных особенностей - основа американской экономики. Доллар США - сильная валюта, которая высоко ценится за свою стабильность. В результате он широко используется в качестве основной резервной валюты во всем мире.§!"

 econ_oligopolistic_capitalism: "§YОлигополистический Капитализм§!"
 econ_oligopolistic_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_oligopolistic_capitalism_banner\n\n\n\n\n\n§gКак и во многих других странах, экономика этой страны основана на принципах свободного рынка. Однако для нее характерен высокий уровень концентрации рынка, когда небольшое число корпораций доминирует в конкурентной борьбе.\nЧто отличает эту экономическую систему от капиталистических аналогов, так это минимальное участие государства. В чрезвычайной степени регулирующие и административные функции правительства либо ограничены, либо захвачены, либо практически неэффективны. Желания доминирующих корпораций превалируют над интересами общества.§!"

 econ_collective_capitalism: "§YКоллективный Капитализм§!"
 econ_collective_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_collective_capitalism_banner\n\n\n\n\n\n§gКоллективный капитализм - это японская модель экономики, которая характеризуется тесными отношениями между бизнесом и государством, а также прочными партнерскими отношениями между компаниями и их поставщиками, клиентами и другими заинтересованными сторонами. Эта модель делает акцент на долгосрочной стабильности и сотрудничестве, а не на конкуренции, и основана на идее, что бизнес и общество взаимосвязаны и разделяют ответственность за успех друг друга.§!"

 econ_welfare_capitalism: "§YСоциальный Капитализм§!"
 econ_welfare_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_welfare_capitalism_banner\n\n\n\n\n\n§gВ системе социального капитализма государство сочетает присутствие частных компаний и предприятий с определенным уровнем контроля и участия в экономике для обеспечения ее нормального функционирования. По мнению ее сторонников, такая система обеспечивает баланс между высоким экономическим ростом, низкой инфляцией и безработицей, благоприятными условиями труда и определенным уровнем социальной защиты.§!"

 econ_managed_economy: "§YНацистский Корпоративизм§!"
 econ_managed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_managed_economy_banner\n\n\n\n\n\n§gНацистский корпоративизм - это система, которая лежала в основе экономической модели нацистской Германии. Несмотря на то, что она широко рассматривается как провал ныне не существующего режима, сторонники неонацистских движений по-прежнему утверждают, что это была единственно верная и честная экономическая система для "арийской расы"\nВсе усилия направлены на удовлетворение потребностей государства и высшей власти - будь то великий вождь или партийный аппарат. Каждое действие тщательно проверяется. Требования правительства кажутся бесконечными, а его проекты превалируют над всеми остальными делами.§!"

 econ_planned_economy: "§YПлановая Экономика§!"
 econ_planned_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_planned_economy_banner\n\n\n\n\n\n§gПлановая экономика, - это экономическая система, в которой все экономическое производство и рост планируются заранее, чтобы удовлетворить потребности населения и страны в целом. Такое планирование может осуществляться как централизованно, так и децентрализованно, а решения по нему могут приниматься специальным советом экспертов или самим народом на основе широкого участия.§!"

 econ_developed_socialism: "§YРазвитой Социализм§!"
 econ_developed_socialism_tooltip: "\n\n\n\n\n£GFX_ZZZ_developed_socialism_banner\n\n\n\n\n\n§gThe concept of Developed Socialism, once a vestige of the Brezhnev era in the Soviet Union, has been revitalized by contemporary Russian economists. In this updated perspective, a greater number of Kosygin's proposals and reforms have been implemented, resulting in a more varied economic landscape and system.\nAlthough central planning still plays a central role, private initiative is far from being abandoned. Private enterprises are given more independence in production, planning, and employee incentives. This independence allows them to make more profit, which in turn motivates them to produce more. In addition, a new wage system based on the labor participation coefficient has been introduced. This system pays employees based on how much they contribute to the company's production.§!"

 econ_military_controlled_economy: "§YВоенно-контролируемая Экономика§!"
 econ_military_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_military_controlled_banner\n\n\n\n\n\n§gВ экономике, контролируемой военными, военные осуществляют прямой надзор за экономикой. Подавляющее большинство, если не вся экономическая деятельность, направлена на удовлетворение потребностей военных. Такой тип экономической системы распространен в странах с военной диктатурой или стратократией. Однако зачастую интересы военных ставятся во главу угла, а не благосостояние граждан. Это связано с тем, что режимы, использующие эту экономическую модель, как правило, националистичны или даже ультранационалистичны.§!"

 econ_socialist_market: "§YСоциалистический Рынок§!"
 econ_socialist_market_tooltip: "\n\n\n\n\n£GFX_ZZZ_socialist_market_banner\n\n\n\n\n\n§gВ социалистической рыночной экономике правительство и частные предприятия сотрудничают, чтобы построить более справедливое общество. Правительство владеет некоторыми предприятиями и контролирует экономику, чтобы гарантировать справедливость, а частные компании работают и развиваются.\nОдна из главных задач - обеспечить каждому доступ к основным услугам, таким как питание, жилье и здравоохранение. Другая цель - поощрять инновации и предпринимательство, обеспечивая при этом, чтобы бизнес работал в интересах общества.§!"

 econ_worker_controlled_economy: "§YУправляемая Рабочими Экономика§!"
 econ_worker_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_worker_controlled_banner\n\n\n\n\n\n§gХотя принято считать, что плановая экономика - это исключительно экономика, контролируемая правительством, это не так для всех плановых экономик.\nЭкономики, контролируемые рабочими, управляются не государственными чиновниками или бюрократами, а самими рабочими, часто через рабочие советы или профсоюзы. Через эти органы рабочие часто осуществляют прямой контроль над производством и часто пользуются высокой степенью автономии.§!"

 econ_kaiser_economy: "§YРейхбургер Экономика§!"
 econ_kaiser_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_kaiser_economy_banner\n\n\n\n\n\n§gЭкономическая система нового кайзеровского режима представляет собой сложную паутину неофеодальных практик и аграрного господства. Он считает банковское дело источником всех социальных бед, но идет еще дальше - прямо обвиняет евреев в том, что они считают упадком немецкой экономики и упадком немецкой деревни, а урбанизация, по их мнению, вызвана еврейскими банковскими интересами.\nОн стремится создать процветающую сельскую рыночную экономику с упором на малый бизнес, который не может нанести большого ущерба окружающей среде. В то время как вся оставшаяся промышленная мощь направлена на удовлетворение потребностей армии и ее постоянно растущих рядов.§!"

 econ_maga_capitalism: "§YMAGA Капитализм§!"
 econ_maga_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_maga_capitalism_banner\n\n\n\n\n\n§gMAGA Капитализм - Хотя эта система и следует основным стандартам американской капиталистической модели, она гораздо более протекционистская и не преклоняет колено перед крупными корпорациями.\nНаоборот, она поддерживает малый независимый бизнес и производителей, а также средние предприятия. В стране также действуют жесткие антимонопольные законы, ограничивающие или устраняющие чрезмерную экономическую власть.\nЕще одной ключевой особенностью этой системы является сильный акцент на защите и продвижении интересов рабочих. Цель состоит в том, чтобы сохранить и, по возможности, усилить программы социального обеспечения, медицину и другие программы социального обеспечения, но при этом минимизировать их бремя для американской экономики.§!"

 econ_party_state_capitalism: "§YПарт-Государственный Капитализм§!"
 econ_party_state_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_party_state_capitalism_banner\n\n\n\n\n\n§gПартийно-государственный капитализм - это экономическая модель, в которой государство не является главной движущей силой экономики, а партийные структуры ставятся выше государственных.\nОдним из главных показателей расширения партийно-государственной системы является растущее присутствие партийных организаций на предприятиях, включая частные компании и даже иностранные фирмы. Другой ключевой особенностью этой модели является выход государственного капитала за пределы государственных предприятий. Этот процесс получил название "финансиализация государства". Еще один способ проявления партийно-государственной экономической активности - эволюция промышленной политики.§!"

 econ_mixed_economy: "§YСмешанная Экономика§!"
 econ_mixed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_mixed_economy_banner\n\n\n\n\n\n§gСмешанная экономика - это экономическая система, которая сочетает в себе элементы как капитализма, например, частный бизнес, так и социализма, например, национализированные государственные услуги.\пЕсть разные способы определения смешанной экономики. Например, одни говорят, что это экономическая система, сочетающая элементы рыночной экономики с элементами плановой экономики. Другие говорят, что в ней сочетаются рынки и государственное вмешательство, или частное предпринимательство с государственным.§!"

 econ_inclusive_capitalism: "§YИнклюзивный\nКапитализм§!"
 econ_inclusive_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_inclusive_capitalism_banner\n\n\n\n\n\n§gИнклюзивный капитализм - это экономическая теория, направленная на создание более справедливой системы распределения ценностей в экономике, а также решение проблемы растущего неравенства в доходах и богатстве.\n\nСуть инклюзивного капитализма заключается в содействии устойчивому росту, который отвечает интересам всех вовлеченных сторон — бизнеса, инвесторов, работников, потребителей, правительств, местных сообществ, общества в целом и окружающей среды.§!"

