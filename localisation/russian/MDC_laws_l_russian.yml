l_russian:
 pop_pyramid: "Половозрастная пирамида"
 population_pyramid_1: "Растущая половозрастная пирамида"
 population_pyramid_1_desc: "В этой стране большая доля молодёжи и быстро растущее население. Она не обременена чрезмерными социальными расходами, но нестабильна и склонна к политическому насилию.\n-------------------\nЧтобы сменить этот закон, нужно не быть в войне и не страдать от её последствий, иметь хороший экономический цикл. Для перехода к этому типу пирамиды необходимо повысить общий прирост населения."
 population_pyramid_2: "Стабильная половозрастная пирамида"
 population_pyramid_2_desc: "В этой стране сбалансированное возрастное распределение и стабильный рост населения.\n-------------------\nЧтобы сменить этот закон, нужно не быть в войне и не страдать от её последствий, иметь хороший экономический цикл. Для перехода к этому типу пирамиды необходимо повысить или понизить общий прирост населения."
 population_pyramid_3: "Сокращающаяся половозрастная пирамида"
 population_pyramid_3_desc: "В этой стране нехватка молодёжи и сокращение населения. Большое число чистых потребителей создаёт огромное налоговое бремя для трудоспособных, но, будучи задавленными долгами, молодые не имеют ни желания, ни средств для политических потрясений.\n-------------------\nЧтобы сменить этот закон, нужно не быть в войне и не страдать от её последствий, иметь хороший экономический цикл. Для перехода к этому типу пирамиды необходимо понизить общий прирост населения."

 corruption_level_10: "(10) Парализующая коррупция"
 corruption_level_10_desc: "Коррупция в нашей стране является повсеместной, укоренившейся, системной, а также беспрецедентной по масштабам и охвату."
 corruption_level_09: "(9) Критическая коррупция"
 corruption_level_09_desc: "Коррупция в нашей стране захлестывает все слои общества. Это не деятельность нескольких жуликоватых чиновников или политиков. Это уже организованная преступность, с коррупционными сделками по крупным закупкам, возникающими в результате сговора и клептократического рэкета."
 corruption_level_08: "(8) Повсеместная коррупция"
 corruption_level_08_desc: "Коррупция в нашей стране воспринимается как существенная проблема, влияющая на все аспекты жизни, включая государственное управление, правоохранительную деятельность, здравоохранение и образование. Феномен коррупции прочно укоренился в нашей модели государственного управления и объясняется общей слабостью верховенства закона в нашей стране."
 corruption_level_07: "(7) Необузданная коррупция"
 corruption_level_07_desc: "Наша страна долгое время страдала от широко распространенной и эндемичной коррупции. Коррупция продолжает оставаться серьезной проблемой как в государственном, так и в частном секторах, несмотря на то что юридическая и институциональная база, борющаяся с коррупцией, является сильной. Взятки, откаты и коррупция в правительстве считаются частью повседневной жизни."
 corruption_level_06: "(6) Систематическая коррупция"
 corruption_level_06_desc: "Коррупция в нашей стране является результатом множества факторов, включая слабое исполнение закона, отсутствие аудита, отсутствие кодексов поведения, непрозрачность деятельности правительства, неэффективную бюрократию, безнаказанность правительства и широкие дискреционные полномочия, а также недостаточную осведомленность общественности."
 corruption_level_05: "(5) Распространенная коррупция"
 corruption_level_05_desc: "Взяточничество и коррупция широко распространены в нашей стране. Вопрос в том, является ли это проблемой всей системы или лиц, находящихся у власти."
 corruption_level_04: "(4) Средняя коррупция"
 corruption_level_04_desc: "Разоблачение громких коррупционных дел в СМИ и ограниченное политическое участие способствовали плохому общественному восприятию политического процесса в нашей стране. Повторяющиеся коррупционные скандалы с участием высокопоставленных политиков, местных администраторов и предприятий, злоупотребляющих государственными средствами, показали, что установленные гарантии противодействия этому злоупотреблению властью были относительно неэффективными."
 corruption_level_03: "(3) Умеренная коррупция"
 corruption_level_03_desc: "Хотя восприятие коррупции в целом низкое, политические партии и предприятия обычно рассматриваются как наименее честные и заслуживающие доверия. Мелкая коррупция не так редка, как в некоторых других странах."
 corruption_level_02: "(2) Незначительная коррупция"
 corruption_level_02_desc: "Восприятие и возникновение коррупции в нашей стране в целом очень низкие. Мелкая и административная коррупция практически отсутствует. Это означает, что граждане и предприятия вряд ли столкнутся с коррупцией при контакте с государственными служащими. Однако некоторые случаи показали, что личные связи, подарки и конфликты интересов являются проблемными областями, которые представляют собой некоторые виды нетрадиционной коррупции."
 corruption_level_01: "(1) Ничтожная коррупция"
 corruption_level_01_desc: "Правовая и институциональная база в нашей стране считается эффективной в борьбе с коррупцией, а государственные учреждения характеризуются высокой степенью прозрачности, честности и подотчетности. Низкий уровень коррупции объясняется эффективным государственным управлением, высококачественными и комплексными услугами для граждан и предприятий, давней традицией открытости и прозрачности в нашем обществе и институтах, а также сильным уважением к верховенству закона."

