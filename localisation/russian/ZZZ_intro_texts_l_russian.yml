l_russian:
 FRA_MODERN_DAY_DESC: "Пятая республика всё ещё живёт под тенью слабого роста и высокой безработицы: в 2016 году рост не достиг 1,5 %, безработица держится у 10 %, а среди молодёжи она значительно выше. Президентские выборы в мае 2017 года зададут курс страны, и впервые открыт вопрос, смогут ли две партии, правящие с 1958 года, удержать второй тур. Будучи одним из основателей Евросоюза и постоянным членом Совета Безопасности ООН, Франция вместе с Германией ведёт европейскую интеграцию после Brexit, одновременно развернув несколько тысяч военнослужащих в Сахеле в рамках операции «Бархан» и сохраняя режим чрезвычайного положения внутри страны.\nЭкономические реформы, направление развития Союза и общественное единство решит следующий хозяин Елисейского дворца."
 RAJ_MODERN_DAY_DESC: "Индия — доминирующая держава южноазиатского субконтинента: 1,3 млрд человек и экономика примерно в 2,6 трлн долларов, растущая быстрее всех прочих крупных экономик. Демонетизация в ноябре 2016 года изъяла более 80 % наличных денег из обращения и потрясла наличный оборот и в городе, и в деревне; налог на товары и услуги, вступающий в силу в июле 2017 года, должен сплавить раздробленные налоговые режимы штатов в единый общенациональный налог.\nВо внешней политике Нью-Дели углубляет оборонное сотрудничество с Вашингтоном, сохраняя давние оружейные связи с Москвой, и осваивает Юго-Восточную Азию в рамках политики «Действуй на Восток»; ядерное оружие при обязательстве неприменения первыми остаётся стратегическим фундаментом. Мятеж в Кашмире, недемаркированная граница с Китаем и по-прежнему закрытая дверь в Группу ядерных поставщиков — упрямые проблемы страны, добивающейся постоянного места в Совете Безопасности."
 IND_MODERN_DAY_DESC: "Индонезия — это семнадцать тысяч островов и 260 млн человек, крупнейшая мусульманская страна мира и фактический центр АСЕАН. Правительство Джоко Видодо направило бюджет на порты, железные дороги и электростанции, чтобы сшить архипелаг инфраструктурой, а налоговая амнистия 2016 года открыла для этого финансовый простор.\nДжакарта намеренно молчит по Южно-Китайскому морю, но её суда не раз сталкивались с китайскими рыболовными флотилиями и кораблями береговой охраны у островов Натуна, а сепаратистский конфликт в Папуа по-прежнему отвлекает армейские части. Старый член Движения неприсоединения, Индонезия теперь называет себя глобальным морским узлом и осторожно балансирует между Вашингтоном и Пекином."
 AST_MODERN_DAY_DESC: "Двадцать четыре миллиона австралийцев живут на почти 7,7 млн кв. км. Инвестиционная фаза горнодобывающего бума завершилась, и рост стабилизировался около 2,5 %. Китай забирает более трети австралийского экспорта; железная руда, уголь и сжиженный газ оставляют Канберру между безопасностью и процветанием — опору американской системы союзов, которая не может обойтись без своего крупнейшего азиатского покупателя.\nПравительство Тёрнбулла обещало перевооружение в оборонной Белой книге 2016 года и запирает морские подходы в рамках операции «Суверенные границы». Континент учится трудному уроку: как сохранить стратегическую самостоятельность, когда оборона зависит от одного партнёра, а доходы — от другого."
 SPR_MODERN_DAY_DESC: "Испания только что выбралась из пропасти долгового кризиса: безработица всё ещё около 19 %, молодёжная — близ 40 %, а государственный долг — около 100 % ВВП. Правительство меньшинства Мариано Рахоя с трудом продвигается в парламенте, а требование независимости Каталонии возвращает на повестку старый спор о конституционном порядке и региональном самоуправлении.\nБудучи членом Евросоюза и НАТО, Мадрид не уступает по Гибралтару и держит миграционное давление в анклавах Сеута и Мелилья на марокканском берегу. Процветающий туризм поддерживает восстановление, но делает страну как никогда зависимой от внешней конъюнктуры."
 PRC_socialist_chinese_dream_idea_desc: "Повествование о «социалистической китайской мечте» связывает национальное возрождение с партийным управлением: средства на исследования должны служить государственным целям, а университеты и аналитические центры обязаны превращать научную продукцию в пригодный для дела политический и инженерный потенциал. В этих рамках инновация — не спонтанный результат рынка, а задача, разложенная по пунктам в пятилетних планах, и мерило успеха — скорость её внедрения."
 SOV_integralists_idea_desc: "В русском словоупотреблении интегралисты — не либералы и не коммунисты старого образца: они требуют перестроить политику и экономику государства вокруг евразийского пространства, ставя суверенитет, традицию и мобилизацию выше рыночной эффективности. Пока это течение удерживает место в центре власти, решения в Кремле будут собраннее, жёстче и охотнее трактовать внешнюю политику как столкновение цивилизаций."
 BRA_MODERN_DAY_DESC: "Бразилия только что прошла через худшую рецессию в своей истории: за 2015 и 2016 годы выпуск сократился более чем на 7 %, безработица превысила 12 %, а антикоррупционное дело Lava Jato свалило разом политические и деловые элиты. В августе 2016 года Дилма Русеф была подвергнута импичменту, и Мишел Темер принял президентские полномочия, немедленно протолкнув конституционную поправку о двадцатилетнем потолке федеральных расходов, чтобы успокоить рынки и рейтинговые агентства.\nУ этого южноамериканского гиганта самая крупная промышленная база в Латинской Америке и пятое по численности население мира, но его же называют страной будущего, которое всегда остаётся будущим. Сможет ли он превратить низкий рост после сырьевого цикла в институциональную реформу — на этот вопрос должны ответить выборы 2018 года."
 ISR_MODERN_DAY_DESC: "Почти через семьдесят лет после независимости Израиль перешёл от вопроса выживания к вопросу самоопределения: население превысило восемь миллионов, душевой продукт — один из самых высоких в развитом мире, а страна экспортирует кибертехнологии, медицинские приборы и агротехнику по всему миру. Однако палестинский вопрос под оккупацией остаётся нерешённым; принятие резолюции Совета Безопасности 2334 в конце 2016 года стало первым прямым отказом международного права от расширения поселений и омрачило отношения Иерусалима с входящей вашингтонской администрацией.\nНа севере гражданская война в Сирии вывела иранскую Революционную гвардию и «Хезболлу» к краю Голан; на юге блокада Газы и периодические военные операции истощают и моральный авторитет, и людские ресурсы. Государству нужно найти прочный баланс между еврейской и демократической составляющими своей идентичности."
 ETH_MODERN_DAY_DESC: "Эфиопия — одна из самых быстрорастущих крупных экономик Африки: почти 10 % в год на протяжении десятилетия, а железная дорога Аддис-Абеба—Джибути и промышленные парки впервые дали этой стране без выхода к морю реальный путь к индустриализации. Но плотина «Возрождение» на Голубом Ниле превратила спор о водах Нила в почти открытое противостояние с Египтом и Суданом.\nВ октябре 2016 года протесты в Оромии вынудили правительство ввести общенациональное чрезвычайное положение; правящий РДФДЭ монополизирует политику в виде коалиции развития и доводит федеральную этническую автономию до предела. Здесь находится штаб-квартира Африканского союза, и Эфиопия обменивает государственные инвестиции на стабильность — ценой сужающегося политического пространства."
 FIN_MODERN_DAY_DESC: "После трёх лет почти стагнации в 2015 и 2016 годах Финляндия лишь только вернулась к росту: экспорт тормозили европейский спрос и промышленная перестройка после Nokia, и правительство ответило пактом конкурентоспособности, сдерживающим удельные затраты на труд, и первым в Европе общенациональным экспериментом с базовым доходом. Как член еврозоны она не имеет самостоятельной денежной политики; как военно неприсоединившееся государство держит расширенное партнёрство с НАТО, никогда не переходя черту членства.\nБолее тысячи трёхсот километров границы с Россией — самый тяжёлый географический факт страны. Хельсинки должен удерживать хрупкое равновесие между европейскими нормами, гарантией НАТО и терпимостью Москвы."
 ITA_MODERN_DAY_DESC: "Италия — третья экономика еврозоны и одна из самых закредитованных: долг около 132 % выпуска, безработица выше 11 %, молодёжная — около 40 %. Поражение конституционного референдума Маттео Ренци в декабре 2016 года стоило ему поста и привело к власти технократическое правительство Паоло Джентилони, а спасение Monte dei Paschi в том же месяце стало очередным испытанием для оздоровления банков еврозоны.\nВ Средиземном море суда с мигрантами из Ливии продолжают приходить на Сицилию и Лампедузу, выталкивая пограничную и миграционную политику ЕС в итальянскую повестку, а популистское сближение «Пяти звёзд» и «Лиги Севера» превращает выборы 2018 года в референдум о доверии к существующему порядку."
 SWE_MODERN_DAY_DESC: "Швеция приняла более ста шестидесяти тысяч просителей убежища в 2015 году, а затем резко ужесточила границы, втянув социальное государство, гордящееся своей гуманитарной репутацией, в общенациональный спор об интеграции, жилье и финансах социальной системы. Экономика ещё растёт, но пузыри на рынке жилья в Стокгольме и Гётеборге и подавленная задолженность домохозяйств не позволяют макропруденциальным властям ослабить хватку.\nВ военной сфере страна, неприсоединившаяся двести лет, после Крыма вновь открыла дискуссию о НАТО, восстановила постоянное оборонное присутствие на Готланде и повысила оборонный бюджет. Для Швеции нейтралитет больше не состояние по умолчанию, а выбор, цену которого приходится снова и снова обосновывать."
 NRY_MODERN_DAY_DESC: "Норвегия заперла нефтяные доходы в крупнейшем в мире суверенном фонде, который к началу 2017 года достиг почти девятисот миллиардов долларов и позволил ей два года падения нефтяных цен поддерживать социальную сферу и инвестиции. Член Европейской экономической зоны, а не Евросоюза, Осло принимает большинство правил единого рынка из Брюсселя, сохраняя исключения для рыболовства, сельского хозяйства и иммиграции.\nНа границе с Россией в Финнмарке и на арктическом форпосте на Шпицбергене Норвегия несёт разведывательные и сдерживающие задачи северного фланга НАТО. Страна чуть более пяти миллионов человек купила влияние энергетическим богатством, а безопасность — членством в союзе, и тем и другим приходится осторожно управлять между великими державами."
 heavy_frigate_desc: "Тяжёлый фрегат меняет размер корпуса на океанскую мореходность и полезную нагрузку: радиолокатор с фазированной решёткой, ячейки вертикального пуска и противолодочный вертолёт позволяют ему быть и дозорным кораблём ПВО, и ядром противолодочной обороны в соединении. Он дороже и обладает большей дальностью, чем лёгкий фрегат, и строится для эскорта, блокады и патрулирования в открытом море."
