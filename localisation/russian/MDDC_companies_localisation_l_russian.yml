l_russian:
SAU_Saudi_Aramco: "§0Saudi Aramco§!"
SAU_Saudi_Aramco_desc: "Saudi Aramco — национальная нефтяная компания Саудовской Аравии, одна из крупнейших в мире интегрированных энергетических и химических компаний, в настоящее время обладающая крупнейшими в мире доказанными запасами нефти. Компания со штаб-квартирой в Дахране владеет крупнейшим в мире наземным нефтяным месторождением Гавар и крупнейшим морским нефтяным месторождением Сафания."
TAI_TSMC_company: "§0TSMC§!"
TAI_TSMC_company_desc: "Компания Taiwan Semiconductor Manufacturing Company (TSMC) — это тайваньская высокотехнологичная многонациональная корпорация, специализирующаяся на производстве полупроводниковых чипов. Штаб-квартира компании находится в Научном парке Синьчу, Тайвань. Компания входит в десятку крупнейших мировых компаний и является ведущим мировым производителем полупроводниковых чипов. Основные направления деятельности компании включают производство, упаковку, тестирование и техническое обслуживание чипов. Благодаря передовым технологиям и постоянным инновациям, TSMC пользуется престижной репутацией на международном рынке, занимая крупнейшую в мире долю рынка производства чипов. Компания является важнейшим столпом мировой высокотехнологичной индустрии и поставляет передовые высокопроизводительные чипы таким известным компаниям, как Apple, MediaTek, Google, Nvidia, AMD и OpenAI. TSMC также играет ключевую роль в развитии передовых технологических отраслей, таких как искусственный интеллект и автономное вождение."
TAI_Foxconn_company: "§0Foxconn Technology§!"
TAI_Foxconn_company_desc: "Компания Hon Hai Precision Industry Co., Ltd. — это многонациональный конгломерат, основанный в 1974 году на Тайване и использующий торговую марку Foxconn. Компания специализируется на OEM-услугах для электронных изделий, исследованиях и производстве прецизионных электрических компонентов, корпусов, barebone-систем, системной сборке, оптических коммуникационных компонентов, ЖК-дисплеев и других сопутствующих товаров и услуг в индустрии 3C (компьютерная, коммуникационная и бытовая электроника)."
TAI_Formosa_company: "§0Formosa Plastic Group§!"
TAI_Formosa_company_desc: "Formosa Plastics Group — один из крупнейших конгломератов Тайваня, возникший на основе Formosa Plastics Industrial Co., Ltd., основанной в 1954 году. В 1957 году она была переименована в Taiwan Plastics Industrial Co., Ltd. (сокращенно «Formosa») и с тех пор расширила свою бизнес-империю. В настоящее время ее деятельность охватывает производство пластмасс, нефтепереработку, нефтехимию, текстиль, электронику, энергетику, транспорт, тяжелую промышленность, биотехнологии, медицину и образование. После более чем шестидесяти лет развития Formosa Plastics теперь владеет более чем сотней дочерних компаний, включая Formosa Plastics, Nan Ya Plastics, Formosa Chemicals & Fibre и Formosa Petrochemical, с заводами на Тайване, в США, материковом Китае, Вьетнаме, на Филиппинах и в Индонезии. Кроме того, ей принадлежит большое количество образовательных и медицинских учреждений, что делает ее одним из крупнейших частных предприятий Тайваня."
FRA_LVMH_company: "§0LVMH§!"
FRA_LVMH_company_desc: "Moët Hennessy Louis Vuitton (LVMH) — крупнейший в мире многонациональный конгломерат товаров класса люкс, неизменно входящий в список Global 500 журнала Fortune. Компания со штаб-квартирой в Париже, Франция, была образована в 1987 году в результате слияния модного бренда Louis Vuitton и Moët Hennessy, который, в свою очередь, был приобретен в 1971 году производителем шампанского Moët & Chandon и производителем коньяка Hennessy. Группа контролирует около 60 дочерних компаний, каждая из которых управляет небольшим количеством престижных брендов. Эти дочерние компании, как правило, работают независимо."
FRA_LOreal_company: "§0L'Oréal§!"
FRA_LOreal_company_desc: "L'Oréal — компания по производству средств по уходу за кожей и косметики со штаб-квартирой в Париже, Франция. Основанная в 1909 году, она является крупнейшей в мире косметической группой и входит в список Fortune Global 500. L'Oréal работает более чем в 150 странах и регионах, имеет 150 дочерних компаний, 42 завода, более 100 дистрибьюторов и 88 000 сотрудников по всему миру."
FRA_TotalEnergies_company: "§0TotalEnergies§!"
FRA_TotalEnergies_company_desc: "TotalEnergies — французская нефтяная компания, одна из шести крупнейших нефтяных компаний мира и одна из крупнейших европейских компаний по рыночной капитализации. Ее деятельность охватывает всю цепочку создания стоимости в нефтегазовой отрасли, от разведки и разработки сырой нефти и газа до производства электроэнергии, транспортировки, переработки, продажи нефтепродуктов и международной торговли сырой нефтью и нефтепродуктами. TotalEnergies также является крупным производителем химической продукции. Штаб-квартира компании находится в районе Курбе-Ла-Дефанс недалеко от Парижа, Франция."
FRA_Schneider_Electric_company: "§0Schneider Electric§!"
FRA_Schneider_Electric_company_desc: "Schneider Electric, французская многонациональная корпорация, основанная в 1836 году, является одной из крупнейших в мире компаний по управлению энергопотреблением и поставщиком решений для оптимизации. Ее основная продукция включает автоматические выключатели, датчики и контроллеры, предоставляя комплексные решения для энергетических объектов, промышленности, центров обработки данных и сетей, а также зданий по всему миру. Компания занимает лидирующие позиции в мире на рынках энергетики, инфраструктуры, управления промышленными процессами, автоматизации зданий, центров обработки данных и сетей. С момента своего основания Schneider Electric является пионером во французской промышленности и в конце XIX века входила в тройку крупнейших производителей вооружений в Европе. В 2008 году глобальные продажи Schneider Electric достигли 18,3 млрд евро. Миссия Schneider Electric — дать возможность каждому более эффективно использовать энергию и ресурсы, создавая мосты к прогрессу и устойчивому развитию для всех."
FRA_Vinci_SA_company: "§0Vinci S.A.§!"
FRA_Vinci_SA_company_desc: "Vinci — французская строительная компания со штаб-квартирой в Рюэй-Мальмезоне, пригороде Парижа. Помимо строительства, она также управляет несколькими аэропортами."
#Turkey
#Companies
TUR_Koc_Holding_company: "§0Koç Holding§!"
TUR_Koc_Holding_company_desc: "Koc Holding S.A. — крупнейший конгломерат Турции. Его штаб-квартира находится в Стамбуле, а владельцем является известная семья Коч."
#Germany
#Companies
GER_SAP_company: "§0SAP§!"
GER_SAP_company_desc: "SAP — немецкая компания-разработчик программного обеспечения со штаб-квартирой в Ваальдорфе, Баден-Вюртемберг, Германия. Она специализируется на программном обеспечении для управления ресурсами предприятия (ERP) и имеет офисы в 130 странах, обслуживая более 335 000 клиентов в 190 странах. Акции компании входят в состав фондового индекса Stoxx Europe 50."
GER_Volkswagen_company: "§0Volkswagen§!"
GER_Volkswagen_company_desc: "Volkswagen — автомобильная компания со штаб-квартирой в Вольфсбурге, Германия. Это основная компания и основополагающий бренд Volkswagen Group, а также самый продаваемый бренд группы и крупнейший в мире автопроизводитель. В переводе с немецкого «Volks» означает «люди», а «Wagen» — «автомобиль», поэтому полное название означает «народный автомобиль»."
GER_Siemens_company: "§0Siemens AG§!"
GER_Siemens_company_desc: "Siemens AG — немецкая многонациональная корпорация, мировой лидер в области электротехнической и электронной продукции, работающая в энергетическом, медицинском, промышленном, инфраструктурном и градостроительном секторах. Основанная в 1847 году Вернером фон Сименсом, компания Siemens имеет штаб-квартиры в Мюнхене и Берлине (Германия) и котируется на Франкфуртской и Нью-Йоркской фондовых биржах."
GER_BMW_company: "§0BMW§!"
GER_BMW_company_desc: "Компания Bavarian Motor Works GmbH — немецкий многонациональный производитель автомобилей класса люкс, мотоциклов и двигателей, штаб-квартира которого находится в Мюнхене, Бавария, Германия."
GER_Deutsche_Telekom_company: "§0Deutsche Telekom AG§!"
GER_Deutsche_Telekom_company_desc: "Компания Deutsche Telekom AG, широко известная как Deutsche Telekom, со штаб-квартирой в Бонне является крупнейшей телекоммуникационной компанией в Европе по объему выручки. Deutsche Telekom предоставляет доступ к фиксированной (VDSL, DSL и FTTH) и мобильной (5G, 4G, 3G и 2G) сети для частных лиц, предприятий и дистрибьюторов, а также другие ИТ-услуги."
GER_MercedesBenz_company: "§0Mercedes-Benz AG§!"
GER_MercedesBenz_company_desc: "Mercedes-Benz Group — это автомобильная компания со штаб-квартирой в Штутгарте, Германия. По объёму продаж Mercedes-Benz входит в десятку крупнейших мировых автопроизводителей, является крупнейшим производителем коммерческих автомобилей и вторым по величине производителем грузовиков. Mercedes-Benz также известен производством автомобилей класса люкс, таких как Mercedes-Benz."
GER_Landesbank: "§0Landesbank Baden-Württemberg§!"
GER_Landesbank_desc: "Банк Баден-Вюртемберга (LBBW), основанный в январе 1999 года и имеющий штаб-квартиру в Штутгарте, Германия, является центральным учреждением Сберегательного банка Баден-Вюртемберга. Банк управляет активами на сумму около 333 миллиардов евро. Деятельность LBBW включает в себя розничное банковское обслуживание, оптовое банковское обслуживание и сберегательные операции."
GER_Deutsche_Bahn_idea: "§0Deutsche Bahn§!"
GER_Deutsche_Bahn_desc: "Deutsche Bahn AG — немецкая государственная транспортная компания со штаб-квартирой в Берлине. Она была основана во Франкфурте в 1994 году в результате слияния бывших Deutsche Bundesbank и Deutsche Bahn. В 2000 году компания вернулась в Берлин, разместившись в недавно построенном здании рядом с Потсдамской площадью. Отдел развития и некоторые другие центральные подразделения группы остаются во Франкфурте. В настоящее время это вторая по величине транспортная компания в мире после Deutsche Post и крупнейший оператор железнодорожных перевозок и поставщик железнодорожной инфраструктуры в Европе."
GER_Lufthansa: "§0Lufthansa§!"
GER_Lufthansa_desc: "Lufthansa — национальная авиакомпания Германии и один из основателей Star Alliance. Это крупнейшая авиакомпания в Европе по пассажиропотоку и размеру флота, а также четвёртая по величине в мире по пассажировместимости. Кроме того, Lufthansa, наряду с British Airways, является одной из двух авиакомпаний в Европе, до сих пор эксплуатирующих самолеты Airbus A380. Немецкое слово «Luft» означает «воздух», а «Hansa» обозначает Ганзейский союз, влиятельный торговый альянс в Северной Германии, существовавший с XIII по XV века."
#England
#Companies 
ENG_AstraZeneca_company: "§0AstraZeneca§!"
ENG_AstraZeneca_company_desc: "AstraZeneca — крупная англо-шведская биофармацевтическая компания, созданная 6 апреля 1999 года в результате слияния шведской AstraZeneca и британской Zeneca. Сама Zeneca отделилась от Imperial Chemical Industries в 1993 году. AstraZeneca разрабатывает, производит и продает лекарства и вакцины для лечения заболеваний пищеварительной, сердечно-сосудистой, онкологической, центральной нервной и дыхательной систем, а также для анестезии. Штаб-квартира компании расположена в Кембриджском биомедицинском парке в Кембридже."
ENG_Shell_company: "§0Shell plc§!"
ENG_Shell_company_desc: "Shell — вторая по величине нефтяная компания в мире, зарегистрированная в Великобритании и имеющая штаб-квартиру в Гааге, Нидерланды. Она была образована в результате слияния Royal Dutch Petroleum и британской компании Shell. Компания Royal Dutch Petroleum была основана в 1890 году по специальному поручению голландского монарха. Чтобы конкурировать со Standard Oil из США, крупнейшей на тот момент нефтяной компанией, Royal Dutch Petroleum в 1907 году объединилась с Shell Transport & Trading Ltd из Великобритании, образовав компанию Shell, которую мы знаем сегодня. Shell — один из мировых нефтяных гигантов и остается крупным игроком в нефтяной, энергетической, химической и солнечной энергетике. Shell имеет пять основных направлений деятельности: разведка и добыча, природный газ и электроэнергия, угольный газ, химическая промышленность и возобновляемая энергия. Shell имеет дочерние компании или подразделения более чем в 140 странах и территориях по всему миру."
ENG_Linde_company: "§0The Linde Group§!"
ENG_Linde_company_desc: "Linde Group — это химическая промышленная группа, расположенная в Мюнхене, Германия. Основанная в 1879 году Карлом фон Линде, она является крупнейшей в мире группой по производству промышленных газов по доле рынка. Акции компании котируются на Немецкой бирже (Deutsche Börse) и Швейцарской фондовой бирже (Swiss Stock Exchange) и входят в индекс DAX. Linde имеет более 600 дочерних компаний в более чем 100 странах мира, осуществляющих деятельность в промышленности, розничной торговле, коммерции, технологиях, исследованиях и разработках, а также в государственном секторе."
ENG_Unilever_company: "§0Unilever plc§!"
ENG_Unilever_company_desc: "Unilever — британская многонациональная компания по производству потребительских товаров, образованная в результате слияния голландской компании Unilever Margarine и британской компании Lever Brothers. Штаб-квартиры компании расположены в Роттердаме (Нидерланды) и Лондоне (Англия). Ассортимент продукции включает продукты питания, напитки, чистящие средства и средства личной гигиены. По данным выручки за 2012 год, это третья по величине в мире компания по производству потребительских товаров после Procter & Gamble и Nestlé. Unilever является крупнейшим в мире производителем спредов, таких как маргарин. Как одна из старейших многонациональных корпораций, её продукция продаётся примерно в 190 странах и регионах."
ENG_BP_company: "§0BP plc§!"
ENG_BP_company_desc: "BP, ранее известная как British Petroleum, является одной из шести крупнейших нефтяных компаний мира и входит в десятку крупнейших частных компаний мира. Ее предшественницей была Anglo-Persian Oil Company, основанная в 1908 году и переименованная в British Petroleum в 1954 году. Компания объединяет разведку, переработку, хранение, продажу и розничную торговлю нефтью и газом."
ENG_Diageo_company: "§0Diageo§!"
ENG_Diageo_company_desc: "Diageo Public Company Limited — британская многонациональная компания по производству алкогольных напитков со штаб-квартирой в Лондоне. Diageo является крупнейшим в мире производителем крепких спиртных напитков, а также крупным производителем пива и вина."
ENG_GlaxoSmithKline_company: "§0GlaxoSmithKline§!"
ENG_GlaxoSmithKline_company_desc: "GlaxoSmithKline (GSK) — третья по величине в мире фармацевтическая, биотехнологическая и медицинская компания со штаб-квартирой в Лондоне, Великобритания. GSK — научно-исследовательская компания, занимающаяся разработкой противоинфекционных препаратов, препаратов для лечения заболеваний центральной нервной системы, дыхательной системы, желудочно-кишечного тракта и обмена веществ, онкологических заболеваний, а также вакцин. Компания также занимает лидирующие позиции в производстве средств гигиены полости рта, питательных напитков и безрецептурных лекарственных препаратов."
ENG_HSBC: "§0HSBC§!"
ENG_HSBC_desc: "HSBC Holdings plc — это холдинговая компания группы HSBC со штаб-квартирой в Лондоне, Великобритания. Это крупнейший европейский банк. Хотя HSBC был официально основан в 1991 году, его дочерняя компания HSBC Bank имеет более чем 160-летнюю историю. HSBC — одна из крупнейших в мире банковских и финансовых организаций. Обладая разветвленной международной сетью, охватывающей шесть основных регионов, HSBC имеет около 4000 офисов в 64 странах и территориях Европы, Гонконга, Азиатско-Тихоокеанского региона, Ближнего Востока, Северной Америки и Латинской Америки, обслуживая более 50 миллионов клиентов."
ENG_Rio_Tinto: "§0Rio Tinto§!"
ENG_Rio_Tinto_desc: "Rio Tinto — это многонациональная горнодобывающая и ресурсная группа, которая также ведет бизнес в угольной, железорудной, медной, золотодобывающей, алмазной, алюминиевой и энергетической отраслях."
ENG_Barclays: "§0Barclays§!"
ENG_Barclays_desc: "Barclays — второй по величине банк в Великобритании после HSBC. Имея более чем 300-летнюю историю, Barclays является старейшим банком в Британии, его история восходит к 1690 году. Barclays был первым банком в мире, который обзавёлся банкоматом, и выпустил первую в Великобритании кредитную карту в 1966 году, а первую дебетовую карту — в 1987 году. Его штаб-квартира находится по адресу: One Churchill Square, Canary Wharf, Лондон."
ENG_NatWest_Group: "§0NatWest Group§!"
ENG_NatWest_Group_desc: "NatWest Group plc, ранее известная как Royal Bank of Scotland Group и RBS Group, — британская банковская и страховая холдинговая компания со штаб-квартирой в Эдинбурге, Шотландия. Деятельность группы охватывает Европу, Северную Америку и Азию. В Великобритании дочерними компаниями NatWest Holdings являются Royal Bank of Scotland, NatWest Bank, Ulster Bank и Cousins Bank. RBS Group имеет право выпускать банкноты фунта стерлингов в Шотландии и Северной Ирландии."
ENG_BT_Group: "§0BT Group§!"
ENG_BT_Group_desc: "Компания BT Group plc, первоначально британская государственная телекоммуникационная компания, управляемая Главным почтовым управлением, отделилась от Королевской почты 1 октября 1981 года, став независимым государственным предприятием. При консервативном правительстве Маргарет Тэтчер в 1984 году 50% акций были проданы на рынке, превратив компанию в частную. Компания неизменно является крупнейшим оператором телекоммуникационной инфраструктуры в Великобритании. BT имеет филиалы или офисы в 170 странах мира. В настоящее время на зарубежные филиалы приходится треть общего оборота группы."
CHI_Tencent_company: "§0Tencent§!"
CHI_Tencent_company_desc: "Tencent Holdings Limited — китайская многонациональная корпорация. Основанная в ноябре 1998 года пятью учредителями — Ма Хуатэном, Чжан Чжидуном, Чэнь Иданем, Сюй Чэнье и Цзэн Лицином — она имеет штаб-квартиру в здании Tencent Binhai в районе Наньшань, Шэньчжэнь. Бизнес Tencent охватывает различные области, включая социальные сети, финансы, инвестиции, информационные технологии и платформы. Ее дочерние компании специализируются на различных глобальных интернет-сервисах и продуктах, развлечениях, искусственном интеллекте и технологиях."
CHI_Alibaba_company: "§0Alibaba§!"
CHI_Alibaba_company_desc: "Компания Alibaba Group, основанная в 1999 году, является многопрофильным конгломератом в материковом Китае, в основном предоставляющим интернет-услуги. В настоящее время у компании два головных офиса: в Ханчжоу, Шанхае и Пекине. Услуги Alibaba включают в себя B2B-торговлю, онлайн-розничную торговлю, поисковые системы для покупок, сторонние платежные системы и облачные вычисления. В число ее дочерних компаний входят Alibaba B2B, Taobao, Tmall, Etao, Alibaba Cloud, Juhuasuan, AliExpress, Alibaba.com, Ele.me, Fliggy, Youku, Hema Fresh, Alibaba Pictures, Cainiao Network, UC Browser, DingTalk, Amap, Lazada и Daraz."
CHI_CCB_company: "§0China Construction Bank Corporation§!"
CHI_CCB_company_desc: "Китайский строительный банк (China Construction Bank Corporation) — один из четырех крупнейших государственных акционерных коммерческих банков материкового Китая и второй по величине банк в материковом Китае. Он также входит в число «Восьми банков и пяти страховых компаний», представляющих китайские финансовые компании, акции которых котируются на Гонконгской бирже."
CHI_ICBC_company: "§0Industrial and Commercial Bank of China§!"
CHI_ICBC_company_desc: "Промышленно-коммерческий банк Китая (ICBC) был основан 1 января 1984 года. Это один из пяти крупнейших государственных коммерческих банков материкового Китая со штаб-квартирой в Пекине. Он был создан путем разделения промышленного и коммерческого кредитно-сберегательного бизнеса Народного банка Китая и является крупнейшим банком в материковом Китае."
CHI_Baidu_company: "§0Baidu§!"
CHI_Baidu_company_desc: "Baidu — это многонациональная технологическая компания со штаб-квартирой в Пекине, Китай, занимающаяся в основном поисковыми системами, искусственным интеллектом и связанными с ними технологическими услугами. Она была основана 1 января 2000 года в Чжунгуаньцуне, Пекин, Робином Ли и Эриком Сюй. Baidu является одним из первых коммерческих поставщиков поисковых услуг в Китае, основным продуктом которого является «Baidu Search», и постепенно развивает бизнес, включающий онлайн-рекламу, вопросы и ответы, облачные вычисления, автономное вождение и чипы искусственного интеллекта."
CHI_Lenovo_company: "§0Lenovo§!"
CHI_Lenovo_company_desc: "Lenovo Group Limited — китайская многонациональная технологическая компания, основанная в 1984 году при участии 11 ученых, получивших инвестиции в размере 200 000 юаней от Института вычислительной техники Китайской академии наук. Первоначально она называлась «Компания по разработке новых технологий Института вычислительной техники Китайской академии наук». В 1989 году она была переименована в «Lenovo Computer Group Limited»."
CHI_huawei: "§0Huawei§!"
CHI_huawei_desc: "Компания Huawei Technologies Co., Ltd. — технологическая компания, основанная в 1987 году Жэнь Чжэнфэем, со штаб-квартирой в Шэньчжэне, провинция Гуандун, Китайская Народная Республика. Первоначально компания специализировалась на производстве телефонных станций, но в настоящее время её деятельность в основном сосредоточена на исследованиях, разработках и производстве коммуникационного оборудования и бытовой электроники. Huawei также имеет интересы в разработке программного обеспечения, проектировании и производстве интегральных схем, фотовольтаике и электромобилях."
CHI_xiaomi: "§0Xiaomi§!"
CHI_xiaomi_desc: "Компания Xiaomi Corporation была основана 6 апреля 2010 года. Это компания, занимающаяся производством потребительской электроники и интеллектуальных устройств, основными продуктами которой являются смартфоны, интеллектуальное оборудование и платформы Интернета вещей (IoT)."
CHI_Petro_China: "§0PetroChina§!"
CHI_Petro_China_desc: "Китайская национальная нефтяная корпорация (CNPC) — крупное центральное предприятие Китайской Народной Республики, занимающееся в основном нефтегазовыми операциями, инженерно-техническими услугами, нефтестроительством, производством нефтяного оборудования, финансовыми услугами и развитием новых источников энергии. Штаб-квартира компании находится в Пекине, Китай. Первоначально она была основана как Китайская нефтяная корпорация в Шанхае 1 июня 1946 года. 27 июля 1998 года CNPC была образована в результате реорганизации Министерства нефтяной промышленности Китайской Народной Республики на базе существующей Китайской национальной нефтяной корпорации (CNPC). Она также является крупнейшим производителем и поставщиком сырой нефти и природного газа в материковом Китае и одним из крупнейших производителей и поставщиков нефтехимической продукции."
CHI_China_State_Construction_Engineering: "§0China State Construction Engineering§!"
CHI_China_State_Construction_Engineering_desc: "Китайская государственная строительная инженерная корпорация (CSCEC) — крупное центральное предприятие в Китайской Народной Республике, занимающееся жилищным строительством, международным инженерным аутсорсингом, развитием недвижимости, строительством инфраструктуры, а также проектированием и геодезическими работами. Основная продукция компании — современные промышленные здания. В настоящее время она является крупнейшей в мире инвестиционно-строительной группой и инженерно-строительной компанией."
CHI_China_Telecom: "§0China Telecom§!"
CHI_China_Telecom_desc: "Китайская телекоммуникационная группа (China Telecom Group Corporation) — крупное централизованное предприятие в Китайской Народной Республике, в основном занимающееся телекоммуникационной отраслью. China Telecom является ведущим мировым оператором комплексных интегрированных интеллектуальных информационных услуг, предоставляющим в основном услуги фиксированной и мобильной связи, доступа в Интернет, информационные услуги и другие дополнительные телекоммуникационные услуги в 31 провинции, муниципалитете, автономном районе и Специальном административном районе Макао материкового Китая."
CHI_Agricultural_Bank: "§0Agricultural Bank of China§!"
CHI_Agricultural_Bank_desc: "Сельскохозяйственный банк Китая (Agricultural Bank of China Limited) — один из пяти крупнейших государственных коммерческих банков Китайской Народной Республики, занимающий третье место по активам среди китайских банков."
CHI_CNOOC: "§0China National Offshore Oil Corporation§!"
CHI_CNOOC_desc: "Китайская национальная морская нефтяная корпорация (CNOOC) — крупное центральное предприятие Китайской Народной Республики, занимающееся преимущественно разработкой морских нефтегазовых месторождений. Это третья по величине государственная нефтяная компания в Китае. Основанная в 1982 году и имеющая штаб-квартиру в Пекине, CNOOC в основном отвечает за совместную разработку морских нефтегазовых ресурсов в китайских водах. Ее уставной капитал составляет 50 миллиардов юаней. CNOOC владеет контрольным пакетом акций зарегистрированной на бирже компании China National Offshore Oil Corporation Limited (CNOOC Limited)."
GENERIC_china_branches_tt: "\n[CHI.GetFlag] Китайский §HМножитель влияния§! в §Y[ROOT.GetNameWithFlag]§!: §R+10%§!\n"
HOL_ABN_AMRO: "§0ABN AMRO§!"
HOL_ABN_AMRO_desc: "ABN AMRO — одна из крупнейших многонациональных финансовых организаций в Нидерландах, имеющая филиалы по всему миру. По своим размерам и экономической мощи она входит в число лидеров в Европе. Штаб-квартира ABN AMRO расположена в районе Зуйдас, Амстердам. Здание штаб-квартиры, высотой 105 метров, является самым высоким зданием в районе Зуйдас. Штаб-квартира также является одним из главных двигателей экономического развития региона Зуйдас."
HOL_Airlines: "§0KLM Royal Dutch Airlines§!"
HOL_Airlines_desc: "KLM Royal Dutch Airlines — национальная авиакомпания Нидерландов. Основанная в 1919 году, в настоящее время она является дочерней компанией группы Air France-KLM и членом альянса SkyTeam."
USA_Apple_company: "§0Apple§!"
USA_Apple_company_desc: "Apple Inc. — это многонациональная технологическая компания, основанная в США, со штаб-квартирой в Купертино, штат Калифорния. Она считается одним из пяти крупнейших технологических гигантов наряду с Amazon, Google, Microsoft и Meta. В настоящее время её деятельность включает проектирование, исследования и разработки, а также продажи средств мобильной связи, бытовой электроники, компьютерного программного обеспечения, онлайн-сервисов и персональных компьютеров."
USA_Ford: "§0Ford§!"
USA_Ford_desc: "Ford Motor Company — американская многонациональная автомобильная компания со штаб-квартирой в Дирборне, штат Мичиган. Основанная Генри Фордом, она была преобразована в корпорацию в 1903 году. В разгар XX века Ford, General Motors и Chrysler считались «большой тройкой» автопроизводителей в Детройте, лидируя на американском автомобильном рынке. Ford удерживал позицию второго по величине автопроизводителя на рынке США в течение 75 лет подряд, уступая только General Motors. Генри Форд внедрил методы массового производства и управления большим количеством заводских рабочих, гениально создав новую производственную последовательность, основанную на проектировании, представленную конвейерной линией. Это сочетание высокой эффективности, высокой заработной платы и низких цен представляло собой революционную реформу и инновацию для американского производства того времени, и этот метод позже стал известен как фордизм, а его промышленная философия получила название фордизма от Антонио Грамши."
USA_Microsoft_company: "§0Microsoft Corporation§!"
USA_Microsoft_company_desc: "Microsoft — это многонациональная технологическая компания, основанная в США в 1975 году Биллом Гейтсом и Полом Алленом. Штаб-квартира компании находится в Редмонде, штат Вашингтон. Она считается одним из пяти крупнейших технологических гигантов наряду с Amazon, Apple, Google и Meta, а также одним из четырех крупнейших поставщиков облачных услуг (CSP) в Северной Америке. Основной деятельностью компании являются исследования, разработки, производство, лицензирование и предоставление широкого спектра компьютерных программных услуг. Наиболее известными и продаваемыми продуктами являются операционная система Microsoft Windows и программное обеспечение Microsoft Office. Другие дочерние компании, такие как игровая платформа Xbox, также хорошо известны. На заре своего существования компания в основном разрабатывала и продавала интерпретаторы BASIC для Altair 8800. В середине 1980-х годов она добилась значительных успехов на рынке операционных систем для домашних компьютеров с MS-DOS. Позднее появление Windows позволило Microsoft постепенно занять доминирующее положение на рынке операционных систем для домашних настольных компьютеров. Одновременно с этим Microsoft начала расширять свой бизнес, осваивая другие отрасли и рынки, создав веб-сайт MSN. На рынке компьютерного оборудования товарный знак Microsoft, игровая консоль Xbox, Zune и домашние развлекательные устройства MSN TV появились на рынке в разные годы. Microsoft вышла на биржу в 1986 году, и постоянно растущая цена ее акций сделала четырех миллиардеров и 12 000 миллионеров. По мере укрепления компании она также сталкивалась с растущей критикой и обвинениями, и эта тенденция продолжается уже несколько десятилетий. Такие практики, как отказ от сделок и пакетная продажа, привели к судебным искам о нарушении антимонопольного законодательства и недобросовестной конкуренции. Министерство юстиции США и Европейская комиссия вынесли неблагоприятные решения против Microsoft в соответствии с антимонопольным законодательством."
USA_Alphabet_company: "§0Alphabet§!"
USA_Alphabet_company_desc: "Alphabet Inc. — холдинговая компания, расположенная в Калифорнии, США. Она была зарегистрирована 2 октября 2015 года в результате выделения из Google, унаследовав статус публичной компании Google и её биржевой тикер. После реструктуризации Google стала крупнейшей дочерней компанией Alphabet Inc. В число дочерних компаний Alphabet входят Calico, CapitalG, Chronicle, DeepMind, Google, Google Fiber, GV, Jigsaw, Loon LCC, Sidewalk Labs, Verily, Waymo и X."
USA_Amazon_company: "§0Amazon§!"
USA_Amazon_company_desc: "Amazon — это многонациональная компания электронной коммерции со штаб-квартирой в Сиэтле, США, и в настоящее время один из крупнейших в мире онлайн-ритейлеров. Amazon управляет розничными веб-сайтами в США, Канаде, Великобритании, Франции, Германии, Китае, Сингапуре, Италии, Испании, Бразилии, Японии, Индии, Мексике, Австралии и Нидерландах, а некоторые из ее товаров также продаются в другие страны посредством международной доставки. Ожидается также открытие филиалов в таких странах, как Польша и Швеция."
USA_Berkshire_Hathaway_company: "§0Berkshire Hathaway§!"
USA_Berkshire_Hathaway_company_desc: "Berkshire Hathaway — это многонациональная диверсифицированная холдинговая компания со штаб-квартирой в Омахе, штат Небраска, США, управляющая многочисленными дочерними предприятиями. Изначально текстильная компания, она превратилась в холдинговую после того, как Уоррен Баффетт получил контроль над Berkshire Hathaway в 1965 году. Баффетт стратегически распределял нераспределенную прибыль для инвестиций, что привело к созданию дочерних компаний в сфере недвижимости, страхования от несчастных случаев, перестрахования и специализированного страхования. На протяжении многих лет компания стабильно обеспечивала своим акционерам ежегодный рост стоимости более чем на 20% благодаря постоянно растущему капиталу и минимальной задолженности."
USA_Nvidia_Corporation_company: "§0Nvidia Corporation§!"
USA_Nvidia_Corporation_company_desc: "Компания NVIDIA, основанная в январе 1993 года, — американская компания, занимающаяся разработкой и продажей полупроводниковых процессоров (GPU) без собственного производства. Штаб-квартира компании находится в Санта-Кларе, штат Калифорния, в самом сердце Силиконовой долины. NVIDIA также разрабатывает графические процессоры для игровых консолей, таких как Xbox первого поколения, PlayStation 3, Nintendo Switch и Nintendo Switch 2. Наиболее известные линейки продуктов NVIDIA — это серия GeForce, предназначенная для частных лиц и геймеров, серия Quadro, разработанная для профессиональных рабочих станций CGI, и серия Tesla, предназначенная для серверов и высокопроизводительных вычислений. Хотя компания начинала с производства видеокарт для ПК, NVIDIA также пробовала свои силы в разработке мобильного чипа Tegra, но на рынке смартфонов он практически не получил отклика."
USA_Exxon_Mobil_Corporation_company: "§0Exxon Mobil Corporation§!"
USA_Exxon_Mobil_Corporation_company_desc: "ExxonMobil — многонациональная нефтегазовая компания со штаб-квартирой в Спринге, штат Техас, США. Она была образована 30 ноября 1999 года в результате слияния Exxon и Mobil. Помимо нефтегазового бизнеса, компания также имеет интересы в химической промышленности, производстве пластмасс и синтетического каучука. Более того, как нефтяной гигант, это крупнейшая в мире частная нефтяная компания и крупнейшая нефтяная компания в западном мире. Компания давно подвергается критике за загрязнение окружающей среды и отрицание изменения климата; разлив нефти в Мексиканском заливе на Аляске был вызван действиями компании. Кроме того, компанию обвиняют в нарушениях прав человека и вмешательстве в политику США."
USA_Walmart_company: "§0Walmart§!"
USA_Walmart_company_desc: "Walmart — американская многонациональная розничная компания, крупнейший в мире ритейлер и крупнейшая корпорация. Штаб-квартира компании находится в Бентонвилле, штат Арканзас, и в ней работает более двух миллионов человек. Walmart — семейный бизнес, контролируемый семьей Уолтон, которой принадлежит 48% компании. Основанная Сэмом Уолтоном в 1962 году, компания Walmart была зарегистрирована 31 октября 1969 года. В 1972 году она вышла на Нью-Йоркскую фондовую биржу. Walmart также является крупнейшим розничным продавцом продуктов питания в Соединенных Штатах. Компания имеет 8500 магазинов в 15 странах мира. Walmart работает во всех 50 штатах США и Пуэрто-Рико. Она управляет сетью Walmex в Мексике, Asda в Великобритании, Seiyu (включая Muji) в Японии, Massmart в нескольких африканских странах, а также имеет совместное предприятие с Bharti в Индии под названием «Best Price Modern Wholesale». Компания полностью владеет операциями в Аргентине, Бразилии и Канаде. Инвестиции Walmart за пределами США принесли неоднозначные результаты. Ее деятельность и дочерние компании в Канаде, Великобритании, Центральной и Южной Америке, а также в Китае оказались успешными, но деятельность в Германии, Японии и Южной Корее потерпела неудачу."
USA_United_Health_company: "§0United Health Group§!"
USA_United_Health_company_desc: "UnitedHealth Group — вторая по величине в мире компания по медицинскому страхованию и информационным технологиям в здравоохранении по объему выручки, со штаб-квартирой в Миннеаполисе, штат Миннесота, США. UnitedHealth разрабатывает полный спектр планов и услуг медицинского страхования для различных групп населения. UnitedHealth обслуживает 90 миллионов человек в Соединенных Штатах и имеет около 300 000 сотрудников во всех 50 штатах и более чем в 130 странах мира."
USA_Coke_company: "§0The Coca-Cola Company§!"
USA_Coke_company_desc: "Компания Coca-Cola — известная многонациональная корпорация, прославившаяся производством, продажей и маркетингом безалкогольных напитков, а также производством концентратов, сиропов и алкогольных напитков. Самый известный продукт компании Coca-Cola — это Coca-Cola, первый в мире бренд колы. Штаб-квартира компании находится в Атланте, штат Джорджия, США. В 1886 году американский фармацевт Джон Пембертон изобрел формулу Coca-Cola. В 1889 году американский промышленник Аса Кэндлер приобрел формулу и бренд Coca-Cola, а в 1892 году компания Coca-Cola была официально зарегистрирована в Атланте, штат Джорджия. Акции компании котируются на Нью-Йоркской фондовой бирже и входят в индексы Dow Jones Industrial Average, S&P 500 и S&P 100."
USA_Tesla_company: "§0Tesla§!"
USA_Tesla_company_desc: "Tesla — крупнейшая в США компания по производству электромобилей и солнечных батарей."
USA_PandG_company: "§0The Procter & Gamble Company§!"
USA_PandG_company_desc: "Procter & Gamble (P&G) — многонациональная компания по производству потребительских товаров, основанная в США и являющаяся одним из крупнейших мировых производителей потребительских товаров. Штаб-квартира компании находится в Цинциннати, штат Огайо, США, и в ней работает около 140 000 сотрудников по всему миру. Основная продукция компании включает чистящие средства, средства личной гигиены и корма для домашних животных."
USA_JPMorgan: "§0JPMorgan Chase§!"
USA_JPMorgan_desc: "JPMorgan Chase & Co. — американская финансовая организация со штаб-квартирой в Нью-Йорке. Ее подразделение коммерческого банкинга насчитывает 5100 филиалов. JPMorgan Chase работает более чем в 50 странах, и ее услуги включают инвестиционный банкинг, торговлю ценными бумагами и услуги по ним, управление инвестициями, коммерческие финансовые услуги и частное банковское обслуживание."
USA_CityGroup: "§0Citigroup§!"
USA_CityGroup_desc: "Citigroup, штаб-квартира которой находится в Нью-Йорке, является одним из крупнейших в мире инвестиционных банков и финансовых учреждений. Компания была образована в 1998 году в результате слияния Citigroup и Traveller Group и впоследствии вышла на биржу. Таким образом, история компании восходит к основанию City Bank of New York (позже Citigroup) в 1812 году; Bank Handlowy в 1870 году; Smith Barney в 1873 году; Banamex в 1884 году; и Salomon Brothers в 1910 году."
USA_Marathon_Petroleum: "§0Marathon Petroleum§!"
USA_Marathon_Petroleum_desc: "Marathon Petroleum — американская компания, занимающаяся разведкой и добычей нефти и газа. Основные производственные мощности компании расположены в США, Норвегии, Экваториальной Гвинее, Анголе и других странах. Штаб-квартира находится в Хьюстоне."
USA_att: "§0AT&T§!"
USA_att_desc: "AT&T — американская многонациональная корпорация и крупнейший поставщик услуг фиксированной и мобильной телефонной связи в США, а также услуг широкополосного доступа в Интернет и платного телевидения. Она обслуживает в общей сложности 150 миллионов абонентов, из которых 85,1 миллиона пользуются беспроводной связью. Компания Southwestern Bell, основанная в 1983 году, была одной из независимых компаний, образованных после антимонопольного иска между правительством США и AT&T. В настоящее время AT&T владеет многими активами, отчужденными в результате решения 1983 года, посредством приобретений. Штаб-квартира компании находится в центре Далласа, штат Техас."
USA_ibm: "§0IBM§!"
USA_ibm_desc: "IBM, или International Business Machines Corporation (IBM), — это многонациональная технологическая компания, основанная в США и ласково называемая «Большая синяя». Это крупнейшая в мире компания, занимающаяся технологиями и бизнес-решениями, в которой работает более 310 000 человек по всему миру, и которая ведет деятельность более чем в 160 странах и регионах. Ее штаб-квартира находится в Армонке, штат Нью-Йорк. Основными клиентами IBM являются государственные учреждения и предприятия, которым компания предоставляет услуги и консультации. IBM производит и продает компьютерное оборудование и программное обеспечение, а также предоставляет консультационные услуги по системной архитектуре и сетевому хостингу. Хотя IBM в первую очередь является коммерческой компанией, она имеет долгую историю достижений в таких науках, как материаловедение, физика и химия, и изобрела множество продуктов на основе этих академических исследований. Среди наиболее известных изобретений IBM — жесткий диск, банкоматы, универсальный код продукта (Generic Product Code), SQL, реляционные системы управления базами данных, DRAM и Watson."
USA_ge: "§0General Electric§!"
USA_ge_desc: "General Electric (GE) — это многонациональный конгломерат, основанный в США, деятельность которого охватывает электронику, энергетику, транспорт, аэрокосмическую отрасль, здравоохранение и финансовые услуги. Штаб-квартира GE находится в Бостоне, компания зарегистрирована в штате Нью-Йорк. GE работает более чем в 100 странах мира и насчитывает около 287 000 сотрудников."
USA_Chevron_Corporation: "§0Chevron Corporation§!"
USA_Chevron_Corporation_desc: "Корпорация Chevron — одна из крупнейших в мире многонациональных энергетических компаний со штаб-квартирой в Сан-Рамоне, штат Калифорния, и работающая более чем в 180 странах мира. Ее деятельность охватывает все аспекты нефтегазовой отрасли: разведку, добычу, переработку, маркетинг, транспортировку, нефтехимию и производство электроэнергии. Компания также производит автомобили с бензиновыми двигателями. Первоначально называвшаяся Standard Oil of California, компания Chevron была образована в 1911 году в результате разделения Standard Oil из-за антимонопольного дела. Chevron входит в число шести крупнейших нефтяных компаний мира."
USA_Bank_America: "§0Bank of America§!"
USA_Bank_America_desc: "Bank of America — второй по величине коммерческий банк в США по активам после JPMorgan Chase. Он имеет около 5600 филиалов и 16200 банкоматов в более чем 150 странах мира. Его история восходит к Банку Массачусетса 1784 года, что делает его вторым старейшим банком в Соединенных Штатах."
USA_Home_Depot: "§0Home Depot§!"
USA_Home_Depot_desc: "Home Depot — американская компания, занимающаяся розничной продажей товаров для дома и строительных материалов, со штаб-квартирой в городе Винингс, штат Джорджия, в районе Атланты. В Home Depot работает более 355 000 человек, и компания управляет 2164 крупными розничными магазинами по всей территории Соединенных Штатов (включая все 50 штатов, округ Колумбия, Пуэрто-Рико, Виргинские острова и Гуам), Канады (10 провинций), Мексики и Китая."
USA_Kroger: "§0Kroger§!"
USA_Kroger_desc: "Kroger, Inc. — американская розничная компания, основанная в 1883 году в Цинциннати, штат Огайо, Бернардом Крогером. По объёму выручки это крупнейшая сеть супермаркетов в Соединенных Штатах и 23-я по величине компания в стране. Kroger также является третьим по величине розничным продавцом в мире и третьим по величине работодателем в Соединенных Штатах."
USA_Comcast: "§0Comcast§!"
USA_Comcast_desc: "Comcast — это американский глобальный коммуникационный конгломерат; благодаря своему бренду Xfinity он занимает первое место по доходам на мировых рынках телекоммуникаций и кабельного телевидения. Comcast также является вторым по величине поставщиком платного телевидения в США, крупнейшим поставщиком кабельного телевидения и домашнего доступа в Интернет, а также третьим по величине поставщиком домашней телефонной связи. Comcast работает во всех 40 штатах и округе Колумбия. Штаб-квартира Comcast находится в Филадельфии, штат Пенсильвания."
USA_Oracle: "§0Oracle§!"
USA_Oracle_desc: "Oracle Corporation — глобальная компания по разработке корпоративного программного обеспечения со штаб-квартирой в Остине, штат Техас, США. Нынешний председатель совета директоров и технический директор — основатель компании Лоуренс Эллисон, а генеральный директор — Кельвин Кетчум. Основная деятельность компании включает в себя создание баз данных для управления корпоративными финансами, таких как системы анализа продаж на определенный момент времени, системы управления цепочками поставок и системы анализа эффективности работы персонала."
SOV_yukos: "§0ЮКОС§!"
SOV_yukos_desc: "«Юкос» — крупнейшая и наиболее успешная российская компания, на долю которой приходится 20% российской добычи нефти."
SOV_sibneft: "§0Сибнефть§!"
SOV_sibneft_desc: ""
SOV_rusal: "§0РУСАЛ§!"
SOV_rusal_desc: "«Русал» — третья по величине в мире компания по производству алюминия и третий по величине в мире производитель алюминия и глинозема, на долю которых приходится 6% мирового производства алюминия и глинозема соответственно."
SOV_sberbank: "§0Сбербанк§!"
SOV_sberbank_desc: "Сбербанк — финансовое учреждение со штаб-квартирой в Москве, столице Российской Федерации. Имея 25 миллионов частных клиентов, 1,3 миллиона корпоративных клиентов и около 19 000 филиалов, Сбербанк является ведущим банком как в частном, так и в коммерческом финансовом секторе России и крупнейшим коммерческим банком в Восточной Европе. Сбербанк — акционерный банк, 60,25% акций которого принадлежат Центральному банку Российской Федерации, а оставшиеся акции находятся в собственности более чем 273 000 институциональных и частных инвесторов."
SOV_vtb: "§0ВТБ§!"
SOV_vtb_desc: "ВТБ Банк — ведущий мировой банк в России."
SOV_gazprom: "§0Газпром§!"
SOV_gazprom_desc: "«Газпромне» — одна из крупнейших нефтяных компаний России."
SOV_rosneft: "§0Роснефть§!"
SOV_rosneft_desc: "«Роснефтегаз» — российская интегрированная энергетическая компания со штаб-квартирой в Москве, специализирующаяся на разведке, добыче, производстве, переработке, транспортировке и судоходстве. Компания контролируется российским правительством через холдинговую компанию «Роснефтегаз»."
SOV_nornickel: "§0Норникель§!"
SOV_nornickel_desc: "«Норильский никель» — крупнейшая российская горно-металлургическая компания, основная производственная база которой находится в Норильске, недалеко от реки Енисей. Компания также владеет рудниками по добыче цветных металлов в Николе, Запорожском и Мончегорске на Кольском полуострове, в Гальяварте на западе Финляндии, в Южной Африке и Ботсване, а также в Западной Австралии. Это крупнейший в мире производитель никеля и палладия, а также один из десяти крупнейших мировых производителей меди. На долю компании приходится приблизительно 18% мирового производства никеля, 2,5% производства меди, почти 50% производства палладия и около 13% производства платины."
SOV_lukoil: "§0ЛУКОЙЛ§!"
SOV_lukoil_desc: "«Лукойл» — российская многонациональная энергетическая компания со штаб-квартирой в Москве, занимающаяся в основном переработкой нефти и газа, а также производством нефтепродуктов. 25 ноября 1991 года три государственные энергетические компании, расположенные в Западной Сибири — «Лангепасс», «Улай» и «Когарин» — объединились и сменили название на «Лукойл», при этом ЛУК обозначает местоположение этих трех компаний. «Лукойл» — вторая по величине компания России после «Газпрома» и один из крупнейших мировых производителей сырой нефти."
POL_Orlen: "§0Orlen§!"
POL_Orlen_desc: "Польская государственная нефтяная компания PLN — известная в Польше государственная интегрированная энергетическая группа. Она предоставляет услуги в основном по разведке, добыче, продаже и транспортировке нефти и газа. Кроме того, PLN имеет высокую репутацию в области морского бурения, управления и разработки месторождений, а также технологий повышения качества нефтяного кокса. В сегменте переработки и сбыта PLN владеет многочисленными автозаправочными станциями и известными мировыми брендами смазочных материалов."
JAP_suzuki_companies: "§0Suzuki§!"
JAP_suzuki_companies_desc: "Suzuki — производитель автомобилей и мотоциклов со штаб-квартирой в Хамамацу, префектура Сидзуока, Япония."
JAP_toyota_companies: "§0Toyota§!"
JAP_toyota_companies_desc: "Toyota Motor Corporation — японская многонациональная автомобильная компания. Toyota также является материнской компанией брендов Lexus, Daihatsu, Hino и Century, а также крупнейшим акционером Subaru с долей в 20%."
SPR_Inditex_company: "§0Inditex§!"
SPR_Inditex_company_desc: "IndiD Group — крупная испанская компания и вторая по величине в мире группа компаний в сфере моды. Ей принадлежит более 100 предприятий, занимающихся преимущественно дизайном, производством и продажей текстиля."
SPR_Telefonica_company: "§0Telefonica§!"
SPR_Telefonica_company_desc: "Telefónica S.p.A. — телекоммуникационная компания, базирующаяся в Испании. Это пятый по величине в мире оператор фиксированной и мобильной связи, предоставляющий услуги фиксированной и мобильной связи преимущественно в Европе и Латинской Америке. В перечень услуг входят мобильная голосовая связь, дополнительные услуги, мобильная передача данных и сети, роуминг, услуги фиксированной беспроводной связи, транкинг и пейджинг. По общему количеству абонентов компания занимает пятое место в мире."
SPR_Banco_Santander_company: "§0Banco Santander§!"
SPR_Banco_Santander_company_desc: "Банк «Сантандер» был основан в 1857 году, его штаб-квартира находится в городе Сантандер, Испания. В банке «Сантандер» работает около 200 000 человек."
SPR_ACS_company: "§0ACS§!"
SPR_ACS_company_desc: "ACS Group — испанская многонациональная корпорация, занимающаяся преимущественно строительным бизнесом, а также имеющая некоторое отношение к телекоммуникационной отрасли. Она была образована в 1997 году в результате слияния компаний OCP Construcciones, S.A. и Ginés Navarro Construcciones, S.A. Ее штаб-квартира находится в Мадриде."
SPR_Iberdrola_company: "§0Iberdrola§!"
SPR_Iberdrola_company_desc: "Ibidora — это частная испанская многонациональная электротехническая компания со штаб-квартирой в Бильбао. В число ее дочерних компаний входят Scottish Electric, Ibidora USA и Elektro в Бразилии."
SPR_Repsol_company: "§0Repsol§!"
SPR_Repsol_company_desc: "Repsol — испанская многонациональная энергетическая и нефтехимическая компания со штаб-квартирой в Мадриде, основные производственные мощности которой расположены в Испании и Аргентине."
KOR_KIA_company: "§0KIA Corporation§!"
KOR_KIA_company_desc: "Kia Motors Corporation — второй по величине автопроизводитель в Южной Корее, компания из списка Fortune Global 500, со штаб-квартирой в Сеуле, Южная Корея, и входящая в состав Hyundai Motor Group."
KOR_LG_company: "§0LG§!"
KOR_LG_company_desc: "LG Group — крупный многонациональный конгломерат со штаб-квартирой в Сеуле, Южная Корея. Основные направления его деятельности включают электронику и телекоммуникационные технологии, бытовую технику и химическую промышленность. В состав группы входят 81 компания, 130 зарубежных дочерних предприятий, а численность персонала составляет 213 000 человек. LG Group была основана 5 января 1947 года, первоначально называлась «Lucky Chemical Industry Co., Ltd.» (ныне LG Chem). 1 октября 1958 года LG учредила «Goldstar Co., Ltd.» (ныне LG Electronics), впоследствии известную как «Lucky Group». 1 января 1982 года «Lucky Group» была переименована в «Lucky Goldstar Group», чтобы охватить расширяющееся подразделение электроники. В январе 1995 года LG Group официально приняла свое нынешнее название — «LG». Буквы «LG» — это первые буквы слов «Lucky» и «Goldstar» в английском названии «Lucky Goldstar Group». LG Group является первопроходцем во многих областях истории развития корейского бизнеса, включая: создание первой в Корее химической промышленной компании «Laxy Chemical Industrial Co., Ltd.» и запуск первого косметического бренда «Laxy Snow Cream»; выход на рынок пластмасс; создание первой в Корее компании электронной промышленности «Goldstar Co., Ltd.»; производство первых в Корее радиоприемников, холодильников, телевизоров, стиральных машин и другой бытовой техники; привлечение выдающихся выпускников университетов из числа населения; внедрение корпоративной прозрачности первым среди корейских чеболей; использование английского названия первым среди корейских чеболей; и внедрение системы холдинговой компании."
KOR_Samsung_company: "§0Samsung§!"
KOR_Samsung_company_desc: "Samsung Group — это многонациональный конгломерат со штаб-квартирой в Сеуле, Южная Корея, деятельность которого охватывает широкий спектр отраслей, включая электронику, финансы, страхование, биофармацевтику, строительство, химическую промышленность и здравоохранение. В число его дочерних компаний входят Samsung Electronics, Samsung Display, Samsung Electro-Mechanics, Samsung C&T, Samsung Heavy Industries и Samsung Life Insurance, а также другие. По меньшей мере три из этих дочерних компаний входят в список Global 500 журнала Fortune."
KOR_SK_company: "§0SK§!"
KOR_SK_company_desc: "SK Group — третий по величине конгломерат Южной Кореи со штаб-квартирой в Сеуле, насчитывающий 186 дочерних и филиальных компаний и более 110 000 сотрудников по всему миру. Основные направления деятельности SK — энергетика и нефтехимия, а её дочерняя компания SK Energy является крупнейшей в Южной Корее интегрированной энергетической и химической компанией. Её нефтеперерабатывающий завод в Ульсане имеет годовую мощность переработки сырой нефти в 42 миллиона тонн, много лет удерживая позицию крупнейшего в мире нефтеперерабатывающего завода с одним предприятием. SK также работает в секторах электроники и телекоммуникаций; её дочерняя компания SK Telecom является крупнейшим в Южной Корее оператором мобильной связи, занимая более 50% рынка в Южной Корее и входя в десятку крупнейших мировых операторов сотовой связи. Её дочерняя компания SK Hynix является основным игроком SK Group в полупроводниковой промышленности, занимая второе место по доле мирового рынка DRAM, уступая только Samsung Electronics."
KOR_Hyundai_company: "§0Hyundai Motor Group§!"
KOR_Hyundai_company_desc: "Hyundai Motor Group, южнокорейский конгломерат, является одним из крупнейших мировых автопроизводителей, штаб-квартира которого находится в Сеуле, Южная Корея. Как и многие южнокорейские конгломераты, Hyundai Motor Group не является вертикально контролируемой компанией со структурой холдинговой компании. Вместо этого это крупный конгломерат со сложной структурой акционерного капитала (например, перекрестное владение акциями), связывающей его различные дочерние компании. На практике Hyundai Motor представляет собой компанию, которая является представителем всей группы."
KOR_Lotte_company: "§0Lotte Corporation§!"
KOR_Lotte_company_desc: "Lotte Group — крупный международный конгломерат со штаб-квартирой в Сеуле, Южная Корея. Его деятельность охватывает различные сектора, включая пищевую промышленность, универмаги, развлечения, строительство и химическую промышленность. Он входит в число 500 крупнейших конгломератов мира и является одним из десяти крупнейших чеболей Южной Кореи. Основанная в 1948 году южнокорейским предпринимателем Шин Кюк-хо, Lotte Group первоначально занималась производством продуктов питания, а затем расширила свою деятельность в Южную Корею, где владеет отелями и универмагами. Lotte Group владеет двумя профессиональными бейсбольными командами: Lotte Giants в Корейской профессиональной бейсбольной лиге (KPL) и Chiba Lotte Marines в Японской профессиональной бейсбольной лиге (JPB)."
KOR_Doosan_company: "§0Doosan Corporation§!"
KOR_Doosan_company_desc: "Doosan Group — южнокорейский конгломерат со штаб-квартирой в Сеуле, входящий в список Fortune Global 500. Его история начинается 1 августа 1896 года, когда его основатель, Пак Сын-джик, открыл магазин «Park Seung-jik Store», которому уже более 120 лет. Это единственная современная компания, работающая со времен поздней династии Чосон, и старейший семейный бизнес в Корее, в котором сохранилась преемственность в трех поколениях. В 1995 году Doosan Group была занесена в Книгу рекордов Гиннесса как старейшая компания в Южной Корее."
KOR_Hanjin_company: "§0Hanjin Transportation§!"
KOR_Hanjin_company_desc: "Hanjin Group — международный логистический и транспортный конгломерат со штаб-квартирой в Сеуле. Основанная в 1945 году, компания когда-то была одной из крупнейших морских логистических компаний Южной Кореи и входила в список Fortune Global 500. Hanjin когда-то владела контейнерным флотом, охватывающим крупнейшие порты мира. После банкротства своего судоходного бизнеса компания продолжает поддерживать воздушные маршруты и логистическую сеть. Hanjin Shipping, дочерняя компания Hanjin Group, когда-то была седьмой по величине судоходной группой в мире. Korean Air, приобретенная в 1969 году, является крупнейшей авиакомпанией Южной Кореи."
KOR_posco_company: "§0Posco§!"
KOR_posco_company_desc: "POSCO — один из крупнейших в мире производителей стали, входящий в список Fortune Global 500, со штаб-квартирой в районе Нам-гу, Пхохан, провинция Северный Кёнсан, Южная Корея."
ITA_Enel_company: "§0Enel§!"
ITA_Enel_company_desc: "Итальянская государственная электроэнергетическая компания «Эдуардо» — это энергетическая компания со штаб-квартирой в Риме, Италия, занимающаяся в основном производством электроэнергии, передачей электроэнергии и распределением природного газа. Первоначально государственное учреждение, созданное в 1962 году, в 1992 году оно было реорганизовано в корпорацию, а в 1999 году приватизировано с открытием итальянского рынка электроэнергии. Однако Министерство экономики и финансов Италии остается ее основным акционером."
ITA_Intesa_Sanpaolo_company: "§0Intesa Sanpaolo§!"
ITA_Intesa_Sanpaolo_company_desc: "Intesa Sanpaolo — это новая банковская группа, образованная 2 января 2007 года в результате слияния Intesa Commerzbank и Banco Sanpaolo. Штаб-квартира группы находится в Турине, а дочерняя компания — в Милане. В августе 2006 года Intesa Commerzbank и Banco Sanpaolo совместно объявили о слиянии, которое было завершено в декабре того же года. Новая группа Intesa Sanpaolo является вторым по величине банком в Италии и третьим по величине в еврозоне, с активами в размере 68,8 млрд евро."
ITA_Eni_company: "§0Eni§!"
ITA_Eni_company_desc: "Eni, официально известная как Национальная углеводородная компания, — это государственная холдинговая компания, созданная правительством Италии. Она специализируется на нефтепродуктах и является одной из седьмых крупнейших нефтяных групп в мире, занимая восьмое место среди крупнейших нефтеперерабатывающих компаний мира."
ITA_UniCredit_company: "§0UniCredit§!"
ITA_UniCredit_company_desc: "UniCredit — миланский банк, работающий в 19 странах и обслуживающий более 28 миллионов клиентов, что делает его одной из крупнейших банковских групп Европы. Основная деятельность UniCredit сосредоточена в богатых регионах, таких как Италия, Австрия и южная Германия, а также в Центральной и Восточной Европе. С общими активами в 910 миллиардов евро UniCredit является крупнейшей банковской группой в еврозоне, третьей по величине в Европе и шестой по величине в мире. Группа UniCredit имеет значительные инвестиционно-банковские подразделения во Франкфурте и Мюнхене."
HUN_mol_group: "§0MOL Group§!"
HUN_mol_group_desc: "MOL Plc. — венгерская многонациональная нефтегазовая компания со штаб-квартирой в Будапеште, Венгрия. В состав MOL Group входят, среди прочих, хорватская и словацкая бывшие государственные нефтегазовые компании INA и Slovnaft."
POR_edp_company: "§0EDP§!"
POR_edp_company_desc: "EDP — португальская электроэнергетическая компания со штаб-квартирой в Лиссабоне, основанная в 1976 году в результате слияния 14 национализированных электроэнергетических компаний."
POR_jm_company: "§0Jerónimo Martins§!"
POR_jm_company_desc: "Jerónimo Martins SGPS, SA (JM) — португальская корпоративная группа, работающая в сфере дистрибуции продуктов питания и специализированной розничной торговли. Она управляет более чем 6500 магазинами в Португалии, Польше, Словакии и Колумбии."