l_russian:
 MD_admin_spirit_CHI:0 "Китайская партийно-государственная бюрократия"
 MD_admin_spirit_CHI_desc:0 "§gКитай — унитарное партийно-государственное образование, где центр управляет через четыре звена — провинцию, город, уезд, волость — и параллельную цепочку партийных комитетов, а места сохраняют реальную свободу в земельных и финансовых вопросах. Штатные квоты фиксируются сверху по звеньям, поэтому иерархия жёстка и плохо сжимается; реформы чаще кончаются переименованием органов и переводом сотрудников.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_chi_banner"
 MD_admin_spirit_SOV:0 "Российская вертикаль власти"
 MD_admin_spirit_SOV_desc:0 "§gРоссия скрепляет федерацию и министерства сильной президентской властью: федеральные округа и назначение губернаторов включают регионы в цепочку оценки центра, а министерские вертикали охватывают безопасность, энергетику и финансы. Государственная служба и госсектор образуют укоренённую структуру, поэтому оптимизация обычно ограничивается переименованием учреждений и сохранением штатов. Институциональная инерция трудно преодолима.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sov_banner"
 MD_admin_spirit_USA:0 "Американская федеральная гражданская служба"
 MD_admin_spirit_USA_desc:0 "§gСША — федеративная президентская республика, где полномочия федерации ограничены перечисленными предметами, остальное зарезервировано за штатами; чиновники набираются по заслугам, а политические назначенцы соседствуют с карьерными бюрократами. Закон об ассигнованиях решает лишь объём средств, а создание ведомства требует закона Конгресса, поэтому административный уровень трудно изменить.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_usa_banner"
 MD_admin_spirit_ENG:0 "Британская вестминстерская гражданская служба"
 MD_admin_spirit_ENG_desc:0 "§gБритания — унитарное государство вестминстерского типа, где Казначейство и аппарат кабинета координируют министерства, а Шотландия, Уэльс и Северная Ирландия пользуются деволюцией. Постоянные чиновники набираются по экзамену и политически нейтральны, сокращения же прежде всего затрагивают внешние контракты, а не ключевые ставки. Местные власти сильно зависят от центральных дотаций.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_eng_banner"
 MD_admin_spirit_KOR:0 "Корейская экзаменационная бюрократия"
 MD_admin_spirit_KOR_desc:0 "§gЮжная Корея — унитарная республика, организованная от провинций и городов до уездов и волостей, где центр доминирует через кадры и финансовые трансферты, а местная автономия пробивается лишь в Седжоне и на Чеджу. Корпус высших госслужащих связывает повышение с политическим назначением, поэтому изменения штатов должны выдержать проверку парламента и общества.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_kor_banner"
 MD_admin_spirit_BRA:0 "Бразильская федеральная олигархия"
 MD_admin_spirit_BRA_desc:0 "§gБразилия — федеративная республика, где двадцать шесть штатов, федеральный округ и тысячи муниципалитетов являются субъектами федерации, а Конституция 1988 года передала им налоги и расходные полномочия. Федеральная и штатные кадровые системы остаются раздельными, а закон о фискальной ответственности жёстко ограничивает долг и фонд оплаты труда.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_bra_banner"
 MD_admin_spirit_PER:0 "Иранская клерикальная администрация"
 MD_admin_spirit_PER_desc:0 "§gИран — исламская республика, устроенная по звеньям провинция, уезд, район, волость; губернаторов назначает МВД, а выборные местные советы обладают ограниченными правами. Корпус стражей, религиозные фонды и квазигосударственные структуры поглощают огромные ресурсы, и бюджет распределяет лишь годовую долю нефтяных доходов. Административная эффективность от этого страдает.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_per_banner"
 MD_admin_spirit_AST:0 "Австралийская федеральная гражданская служба"
 MD_admin_spirit_AST_desc:0 "§gАвстралия — федерация, где полномочия Содружества ограничены перечисленными предметами, штаты сохраняют остальное, а местное самоуправление создаётся законом штата. Содружество собирает основные налоги и распределяет их между штатами через комиссию по грантам, при этом каждый штат содержит собственную службу, что затрудняет переводы. Местная автономия поэтому ограничена.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ast_banner"
 MD_admin_spirit_VIE:0 "Вьетнамская партийно-государственная администрация"
 MD_admin_spirit_VIE_desc:0 "§gВьетнам — унитарное государство, где партия и государство идут параллельно: в провинциях, уездах и общинах действуют народные советы и комитеты, а партийная вертикаль доходит до низовых звеньев. Штаты утверждаются центром, местные расходы зависят от трансфертов и земельных доходов, а кадровые и партийные правила определяют, кто за что отвечает. Эффективность сдерживается этим двойным контуром.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_vie_banner"
 MD_admin_spirit_SWE:0 "Шведская децентрализованная социальная администрация"
 MD_admin_spirit_SWE_desc:0 "§gШвеция — унитарное государство с конституционно гарантированным местным самоуправлением: 290 коммун и 21 совет лена самостоятельно взимают налоги и обеспечивают основную часть образования и здравоохранения. Центральные министерства малы, исполнение передано независимым ведомствам, а увольнения требуют коллективных переговоров и правовой процедуры. Местный налог — главный источник публичных услуг.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swe_banner"
 MD_admin_spirit_HOL:0 "Нидерландская администрация согласия"
 MD_admin_spirit_HOL_desc:0 "§gНидерланды — децентрализованное унитарное государство двенадцати провинций, сотен коммун и водных советов, где коммуны широко самостоятельны в планировании и социальной сфере. Центральные министерства невелики, исполнение передано агентствам, а местные финансы зависят от коммунального и провинциального фондов, распределяемых по формуле. Любая реформа требует межпартийного компромисса.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_hol_banner"
 MD_admin_spirit_GER:0 "Германский административный федерализм"
 MD_admin_spirit_GER_desc:0 "§gГермания — федерация, где Основной закон передаёт исполнение землям, оставляя федерации иностранные дела, оборону, валюту и рамочное законодательство. Федеральные и земельные чиновники относятся к двум отдельным пожизненным карьерам, а совместные налоги и горизонтальное выравнивание решают, у кого деньги и кто исполняет. Административный федерализм не позволяет Берлину прямо командовать землями.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ger_banner"
 MD_admin_spirit_POL:0 "Польское местное самоуправление"
 MD_admin_spirit_POL_desc:0 "§gПольша — унитарное государство шестнадцати воеводств, нескольких сотен поветов и более тысячи гмин, каждая с выборным советом, тогда как воеводу назначает центр и он надзирает за самоуправлением. Унаследованная от переходного периода служба многочисленна, а местные финансы зависят от выравнивающих дотаций и совместных налогов. Разделение задач между воеводой и выборными советами остаётся размытым.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pol_banner"
 MD_admin_spirit_JAP:0 "Японская бюрократия Касумигасэки"
 MD_admin_spirit_JAP_desc:0 "§gЯпония — унитарное государство, где министерства, сосредоточенные в Касумигасэки, координируют общегосударственное управление, префектуры соединяют центральное поручение с местной автономией, а муниципалитеты ведают низовыми делами. Государственные и местные служащие образуют две отдельные карьеры, и пожизненный найм по старшинству позволяет сокращать штаты лишь медленно. Контроль центра над местами поэтому прочен.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_jap_banner"
 MD_admin_spirit_FRA:0 "Французский префектуральный централизм"
 MD_admin_spirit_FRA_desc:0 "§gФранция — централизованное унитарное государство, где префект представляет государство в департаменте, а министерства разделены по вертикальным функциям. Законы о децентрализации 1982 года перераспределили полномочия регионов, департаментов и коммун, но государственные службы на местах и самоуправление давно сосуществуют с переплетением ответственности. Центральные и местные компетенции остаются в напряжении.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_fra_banner"
 MD_admin_spirit_ITA:0 "Итальянская региональная автономия"
 MD_admin_spirit_ITA_desc:0 "§gИталия — унитарная республика, унаследовавшая сардинскую провинциальную систему; конституционная реформа 2001 года передала регионам законодательную власть, переместив здравоохранение, транспорт и профобразование. Финансы и кадры во многом остаются в руках Рима, порождая распылённую ответственность и пересечение ведомств, а реформы редко выходят за пределы бумаг.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ita_banner"
 MD_admin_spirit_RAJ:0 "Индийская колониальная гражданская служба"
 MD_admin_spirit_RAJ_desc:0 "§gИндия — федеративная республика, делящая полномочия между Союзом и штатами; всеиндийские службы набираются центром и направляются в штаты, образуя связь «центральные люди на местных постах». Штатные должности ограничены политикой резервирования по кастам и регионам, поэтому и расширение, и сокращение нарушают политический баланс. Расширение долго поглощало безработицу.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_raj_banner"
 MD_admin_spirit_TUR:0 "Турецкий президентский централизм"
 MD_admin_spirit_TUR_desc:0 "§gТурция — унитарная республика, где губернаторов назначает МВД и они отвечают перед центром, а муниципалитеты действуют по муниципальному закону. После референдума 2017 года, введшего президентскую систему, административное ядро сместилось к президентскому дворцу, а закон № 657 делает штаты куда менее чувствительными к финансам, чем к политической лояльности. Эффективность уступает лояльности.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tur_banner"
 MD_admin_spirit_ISR:0 "Израильская администрация основных законов"
 MD_admin_spirit_ISR_desc:0 "§gИзраиль не имеет писаной конституции и определяет институты серией основных законов, оставляя министерствам широкое усмотрение в местных делах. Местные органы избираются, но зависят от центральных дотаций, а коллективные договоры и пожизненный найм делают штаты легко расширяемыми и трудно сокращаемыми. Бюджет жёстко контролирует министерство финансов.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_isr_banner"
 MD_admin_spirit_CAN:0 "Канадский провинциальный федерализм"
 MD_admin_spirit_CAN_desc:0 "§gКанада — федерация, где конституция 1867 года передаёт образование, здравоохранение и социальные услуги провинциям, а муниципалитеты являются созданием провинциального права. Оттава направляет места условными трансфертами, провинциальные кадровые законы сильно разнятся, а изменения штатов должны пройти правила комиссий. Федеральная координация поэтому опирается на переговоры.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_can_banner"
 MD_admin_spirit_PAK:0 "Пакистанский федеральный секретариат"
 MD_admin_spirit_PAK_desc:0 "§gПакистан — федеративная республика, где федеральный секретариат и главные секретари провинций образуют два контура, а окружные офицеры продолжают интегрирующую роль колониальной администрации. Восемнадцатая поправка 2010 года передала образование и здравоохранение провинциям, а распределение кадров связано с региональным балансом и резервными квотами.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pak_banner"
 MD_admin_spirit_NKO:0 "Северокорейское партийно-государственное планирование"
 MD_admin_spirit_NKO_desc:0 "§gСеверная Корея строит управление на единстве партии и государства: кабинет руководит провинциями и народными комитетами городов и уездов, а плановая комиссия спускает годовые и пятилетние задания. Доходы и расходы объединены, у мест почти нет собственной налоговой базы, а кадрами ведает организационный отдел партии. Эффективность уступает мобилизации.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nko_banner"
 MD_admin_spirit_UKR:0 "Украинская президентская администрация"
 MD_admin_spirit_UKR_desc:0 "§gУкраина унаследовала советскую республиканскую структуру областей, районов и городов; губернаторов назначает президент, а города действуют по принципам Европейской хартии местного самоуправления. Децентрализация после 2014 года передала финансовые полномочия, но военная мобилизация и олигархическое влияние держат штаты нестабильными. Центральные и местные компетенции остаются спорными.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ukr_banner"
 MD_admin_spirit_SAU:0 "Саудовские королевские губернаторства"
 MD_admin_spirit_SAU_desc:0 "§gСаудовская Аравия — абсолютная монархия, где провинциями управляют назначенные короной губернаторы, делящиеся на округа и уезды, а администрация переплетена с племенной и религиозной властью. Нефтяные доходы превращаются в управленческий потенциал через пятилетние планы, а создание или упразднение ведомств требует королевского указа. Эффективность зависит от воли короля.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sau_banner"
 MD_admin_spirit_SWI:0 "Швейцарская система Федерального совета"
 MD_admin_spirit_SWI_desc:0 "§gШвейцария — федерация, где Конфедерация обладает лишь перечисленными полномочиями, двадцать шесть кантонов сохраняют широкий суверенитет, а коммуны самоуправляются по кантональному праву. Управление опирается на милицейскую службу и совместительство, и любое расширение может быть вынесено на референдум, требующий согласия кантональных парламентов и избирателей. Конфедерация и кантоны действуют через переговоры, а не приказ.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swi_banner"
 MD_admin_spirit_SPR:0 "Испанское государство автономий"
 MD_admin_spirit_SPR_desc:0 "§gИспания — государство автономий, где семнадцать автономных сообществ сосуществуют с провинциями и муниципалитетами, а центр сохраняет оборону, внешние дела и макроэкономическую координацию. Споры о компетенции решает Конституционный суд, Страна Басков и Наварра имеют особые фискальные права, а переговоры пронизывают всю систему. Каждая ревизия статута — политический торг.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_spr_banner"
 MD_admin_spirit_EGY:0 "Египетская централизованная администрация"
 MD_admin_spirit_EGY_desc:0 "§gЕгипет — высокоцентрализованное унитарное государство, где губернаторов назначает президент, провинции делятся на районы и деревни, а местные советы имеют лишь ограниченный выборный статус. Военная экономика глубоко проникает в инфраструктуру и социальное обеспечение, а расширение штатов долго служило поглощению занятости. Эффективность часто уступает социальной стабильности.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_egy_banner"
 MD_admin_spirit_MEX:0 "Мексиканские федеральные конституции штатов"
 MD_admin_spirit_MEX_desc:0 "§gМексика — федеративная республика, где тридцать один штат и Мехико имеют собственные конституции и конгрессы, муниципалитеты образуют основу самоуправления, а федерация контролирует основную часть доходов. Федеральная гражданская служба складывалась после демократизации 2000 года, но штаты и муниципалитеты сохраняют собственные кадровые правила. Трансферты — рычаг федерации.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_mex_banner"
 MD_admin_spirit_NRY:0 "Норвежское муниципальное самоуправление"
 MD_admin_spirit_NRY_desc:0 "§gНорвегия — унитарное государство, где фюльке является региональным звеном государства, а коммуны обеспечивают образование, здравоохранение и социальные услуги по закону о местном самоуправлении. Нефтяные доходы изолированы от годового бюджета суверенным фондом и бюджетным правилом, что стабилизирует расходы и сдерживает расширение. Слияния коммун требуют согласия жителей.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nry_banner"
 MD_admin_spirit_TAI:0 "Тайваньская служба пяти юаней"
 MD_admin_spirit_TAI_desc:0 "§gТайвань организует власть по конституционной схеме Китайской Республики с пятью юанями, юань экзаменов ведает конкурсами и назначениями, а квалификация чиновника приобретается экзаменом. После упрощения провинциального уровня центр и места взаимодействуют напрямую, а местные финансы зависят от распределения налогов. Центр и места делят задачи через дотации и переговоры.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tai_banner"
 MD_admin_spirit_IND:0 "Индонезийская местная автономия"
 MD_admin_spirit_IND_desc:0 "§gИндонезия — унитарное государство от провинций до кабупатенов и городов, затем районов и деревень; губернатор одновременно представитель центра и автономный глава. Законы об автономии 1999 года передали функции и доходы кабупатенам и городам, а деревни получили собственный бюджет по деревенскому закону. Расширение долго поглощало занятость.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ind_banner"
