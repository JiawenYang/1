l_russian:
 ZZZ_equipment_localization: "Степень локализации вооружений"
 ZZZ_equipment_localization_01: "Полная зависимость от импорта"
 ZZZ_equipment_localization_01_desc: "Вооружённые силы почти полностью зависят от иностранных поставщиков: запасные части, боеприпасы и основные платформы приходится импортировать, и любой сбой в цепочке поставок быстро подрывает боеспособность армии."
 ZZZ_equipment_localization_02: "Высокая зависимость от импорта"
 ZZZ_equipment_localization_02_desc: "Большая часть тяжёлой техники и ключевых компонентов по-прежнему поступает из-за рубежа. Отечественные заводы собирают лишь часть необходимого, поэтому армия уязвима к эмбарго и задержкам поставок."
 ZZZ_equipment_localization_03: "Частичная самообеспеченность"
 ZZZ_equipment_localization_03_desc: "Отечественная промышленность покрывает часть потребностей армии, но критические подсистемы и современные платформы всё ещё импортируются. Войска могут держаться, но при затяжном давлении возникает нехватка."
 ZZZ_equipment_localization_04: "Базовая самообеспеченность"
 ZZZ_equipment_localization_04_desc: "Отечественная оборонная промышленность удовлетворяет большую часть потребностей армии. Импорт ограничен отдельными специализированными компонентами, что даёт прочную базу для длительных операций."
 ZZZ_equipment_localization_05: "Высокая самообеспеченность"
 ZZZ_equipment_localization_05_desc: "Отечественные заводы обеспечивают армию почти всей необходимой техникой — от стрелкового оружия до машин. Зависимость от импорта незначительна, и войска выдерживают сбои в поставках."
 ZZZ_equipment_localization_06: "Полная самообеспеченность"
 ZZZ_equipment_localization_06_desc: "Полноценная отечественная оборонная база снабжает армию практически всей техникой. Стратегическая независимость позволяет войскам сражаться даже при разрыве внешних цепочек поставок."
 BLOCK_SALARY_DECREASE_TT: "Действующее трудовое законодательство запрещает снижение минимального уровня оплаты труда."

