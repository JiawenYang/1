l_russian:
 ZZZ_chainrun:0 "Прогонщик цепочек событий"
 ZZZ_cr_kr_01_talks_open:0 "Корейская цепочка 1/3: конфедерация создана (zzz_kor.1 → .2)"
 ZZZ_cr_kr_01_talks_open_desc:0 "Этап 1/3. Применяет на KOR эффекты zzz_kor.1.a и затем .2.a: переговоры успешны, KOR создаёт фракцию Чучхе и включает в неё NKO. Оба правительства сохраняются; аннексии и события нет."
 ZZZ_cr_kr_01_talks_open_tt:0 "Итог: два государства в одной союзной рамке. Поскольку .2 сначала создаёт фракцию Чучхе, вступление в ОТАС на этапе 3 не сработает, пока KOR остаётся в Чучхе: это реальный результат цепочки, он не правится."
 ZZZ_cr_kr_02_unify:0 "Корейская цепочка 2/5: к объединению (zzz_kor.2)"
 ZZZ_cr_kr_02_unify_desc:0 "Доступно только если в zzz_kor.1 выбран a (KOR_reunification_talks_failed отсутствует); запускает реальное событие zzz_kor.2."
 ZZZ_cr_kr_02_unify_tt:0 "Если KOR_reunification_talks_failed установлен, цепочка считается сорванной и шаг не выполняется."
 ZZZ_cr_kr_03_breakdown:0 "Корейская цепочка 3/5: срыв (zzz_kor.3)"
 ZZZ_cr_kr_03_breakdown_desc:0 "Доступно только если в zzz_kor.1 выбран b (KOR_reunification_talks_failed установлен); запускает реальное событие zzz_kor.3."
 ZZZ_cr_kr_03_breakdown_tt:0 "Без этого флага шаг 1 ещё не выбрал b, и шаг не выполняется."
 ZZZ_cr_kr_04_kpr:0 "Корейская цепочка 4/5: провозглашение КНР (zzz_kor.6)"
 ZZZ_cr_kr_04_kpr_desc:0 "Проверяет, что NKO владеет 604 и имеет косметический тег KPR или korean_postwar_settled, затем запускает zzz_kor.6. Аннексия должна идти через реальное послевоенное решение; этот инструмент никогда не аннексирует."
 ZZZ_cr_kr_04_kpr_tt:0 "Точка блокировки укажет, чего не хватает: owns_state 604 или реального послевоенного решения."
 ZZZ_cr_kr_05_election:0 "Корейская цепочка 5/5: общеполуостровные выборы (zzz_kor.8 / zzz_kor.10)"
 ZZZ_cr_kr_05_election_desc:0 "Запускает zzz_kor.8 по маршруту NKO и zzz_kor.10 по маршруту KOR. Маршрут выбирается по реальным флагам."
 ZZZ_cr_kr_05_election_tt:0 "Проверяются флаги election_done обоих маршрутов; если уже выполнено, шаг останавливается."
 ZZZ_cr_ru_01_putin_smo:0 "Российско-украинская цепочка: путь Путина (СВО)"
 ZZZ_cr_ru_01_putin_smo_desc:0 "Выполняет на SOV эффект фокуса SOV_declare_smo (вызов DSW_SOV_declare_war_on_ukraine); событие не запускается."
 ZZZ_cr_ru_02_medvedev_wall:0 "Российско-украинская цепочка: путь Медведева (обращение к нации)"
 ZZZ_cr_ru_02_medvedev_wall_desc:0 "Выполняет на SOV эффект фокуса SOV_address_the_nation: угроза, вызов DSW_SOV_declare_war_on_ukraine, идея UKR_to_the_last у UKR."
 ZZZ_cr_ru_03_communist_saturn:0 "Российско-украинская цепочка: путь КПРФ (Малый Сатурн)"
 ZZZ_cr_ru_03_communist_saturn_desc:0 "Выполняет на SOV эффект фокуса SOV_operation_little_saturn: угроза, вызов DSW_SOV_declare_war_on_ukraine, идея UKR_to_the_last у UKR."
 ZZZ_cr_eur_01_escalate:0 "Европейская война: полная континентальная эскалация (начало + участники)"
 ZZZ_cr_eur_01_escalate_desc:0 "Выполняет ZZZ_eur_begin_war, затем ZZZ_eur_mark_participants за один раз. Только SOV: оба эффекта читают ROOT, поэтому решение должен принимать SOV. События не запускаются."
 ZZZ_cr_gaw_01_korea_ignites:0 "GAW: полуостров разжигает Великую азиатскую войну"
 ZZZ_cr_gaw_01_korea_ignites_desc:0 "KOR объявляет войну NKO и ставит военный флаг, затем CHI выполняет ZZZ_start_gaw_from_korea. Только CHI: инициализация GAW читает ROOT. События не запускаются."
 ZZZ_cr_usa_01_paralysis:0 "Цепочка «смерти мозга» США: убийство → разгром демократов → паралич федерации"
 ZZZ_cr_usa_01_paralysis_desc:0 "Применяет на USA эффекты usacw.5.a, .6.a и .7.a напрямую до узла паралича. Не запускает taiwan_detente.5; альтернативный маршрут 2021 (.15-.21) не используется."
 ZZZ_cr_balk_01_withdraw_federation:0 "Балканы: полный выход + федерация при поддержке Китая"
 ZZZ_cr_balk_01_withdraw_federation_desc:0 "Восемь стран выполняют эффект выхода из zzz_balkan.20.a (НАТО и ЕС), затем успешную ветвь PRC_balkan_federation_support: идея партнёрства, обмен влияния по семи странам, +100 политвласти Сербии, флаги согласия. zzz_balkan.30 не запускается."
 ZZZ_cr_tw_01_forced_reunification:0 "Тайваньский пролив: путь принудительного воссоединения (пакет фокусов)"
 ZZZ_cr_tw_01_forced_reunification_desc:0 "Выполняет prc.124.a дословно на CHI: флаг принудительной войны, загрузка тайваньского дерева фокусов и десять фокусов (Киньмэнь, блокада, «Тихий рассвет» и др.). Триггер Дяоюйдао/Сенкаку prc.546 — взаимоисключающая ветвь, не используется."
 ZZZ_cr_ip_01_kashmir_war:0 "Индия–Пакистан: война за Кашмир (объявление Индии)"
 ZZZ_cr_ip_01_kashmir_war_desc:0 "Выполняет эффекты PAK.3 на RAJ и PAK: Индия объявляет войну (annex_everything) и берёт идею clash-of-millions; Пакистан берёт свои идеи, теряет 143 750 людей и переходит на военный OOB. PAK.7 и prc.134 не запускаются."
 ZZZ_cr_sea_01_asean_turnover:0 "Юго-Восточная Азия: смена власти в АСЕАН (монархия Лаоса + либерализация Камбоджи)"
 ZZZ_cr_sea_01_asean_turnover_desc:0 "Выполняет обе части asean.6.a: Лаос становится монархией с новым королевским лидером и национальным правлением; Камбоджа переходит к социал-либералам с выборами раз в 60 дней. Отдельной войны в Юго-Восточной Азии в моде нет; asean.6 — единственное событие asean."
 ZZZ_cr_mew_01_palestine_victory:0 "Ближний Восток MEW: арабское урегулирование (Палестина аннексирует Израиль)"
 ZZZ_cr_mew_01_palestine_victory_desc:0 "Выполняет финал урегулирования A: PAL аннексирует ISR и HAM, ставит MEW_palestine_victory / MEW_settlement_done / skip_default_capitulation и снимает MEW_sixth_war_ongoing. Пропускает передачу Голан и Южного Ливана, белый мир участников и mew.10 / mew.11. Требует MEW_sixth_war_ongoing."
 ZZZ_cr_kr_02_confederation_deepened:0 "Корейская цепочка 2/3: углубление конфедерации (общие институты)"
 ZZZ_cr_kr_02_confederation_deepened_desc:0 "Этап 2/3. Включает обе Кореи в группу обмена технологиями korea_confederation_Tech_Share, ставит korean_confederation_formed / korean_confederation_deepened и поднимает reunification_chance у KOR до 12, в верхний диапазон шанса на успех zzz_kor.1 (>10). События не запускаются."
 ZZZ_cr_kr_03_peaceful_unification:0 "Корейская цепочка 3/3: мирное объединение (KOR поглощает NKO)"
 ZZZ_cr_kr_03_peaceful_unification_desc:0 "Этап 3/3. Применяет на KOR эффекты zzz_kor.5.a и .10.a: аннексия NKO, перезапись правительства и всех 24 значений популярности партий, затем общеполуостровные выборы. Если KOR всё ещё во фракции Чучхе, вступление в ОТАС не сработает (реальный результат цепочки); без этапов 1-2 он вступит в ОТАС."
 ZZZ_cr_kr_04_north_annex:0 "Этап 4/4 - Север аннексирует Юг (военный путь)"
 ZZZ_cr_kr_04_north_annex_desc:0 "Этап 4/4. Напрямую применяет zzz_kor.4.a и .6.a к NKO: аннексирует KOR с передачей войск, включает штаты 604-608 и 1099 в коренные территории, переписывает правительство и все 24 значения популярности партий и применяет ZZZ_spirit_korea_unified. Также устанавливает zzz_korea_north_annexed и korean_postwar_settled, блокируя мирный путь."
 ZZZ_cr_ru_04_russian_victory:0 "Российско-украинская цепочка: российское урегулирование победы (DSW_SOV_resolve_russian_victory)"
 ZZZ_cr_ru_04_russian_victory_desc:0 "Выполняет урегулирование победы: флаги победы, послевоенное дерево фокусов, французская ветка и восточноевропейское урегулирование. Внутренний страж эффекта делает его пустым вне войны; события, запускаемые исходным скриптом, не пропускаются."
 ZZZ_cr_ru_05_russian_defeat:0 "Российско-украинская цепочка: российское урегулирование поражения (DSW_SOV_resolve_russian_defeat)"
 ZZZ_cr_ru_05_russian_defeat_desc:0 "Выполняет урегулирование поражения: флаги поражения, смена послевоенного дерева фокусов и украинский/европейский исход. Тот же внутренний страж; вне войны — пусто."
 ZZZ_cr_eur_02_nato_victory:0 "Европейская война: урегулирование победы НАТО (ZZZ_eur_settle_nato_victory)"
 ZZZ_cr_eur_02_nato_victory_desc:0 "Освобождает аннексированные страны Восточной Европы, возвращает корки, заключает белый мир для всех и ставит ZZZ_eur_nato_victory. Требует ZZZ_eur_war_ongoing (сначала эскалация), иначе пусто."
 ZZZ_cr_eur_03_csto_victory:0 "Европейская война: урегулирование победы ОДКБ (ZZZ_eur_settle_csto_victory)"
 ZZZ_cr_eur_03_csto_victory_desc:0 "Превращает EST / LAT / LIT / POL / UKR в марионеток SOV, заключает белый мир для всех и ставит ZZZ_eur_csto_victory. Требует ZZZ_eur_war_ongoing, иначе пусто."
 ZZZ_cr_gaw_02_china_victory:0 "GAW: урегулирование победы Китая (ZZZ_gaw_settle_china_victory)"
 ZZZ_cr_gaw_02_china_victory_desc:0 "Белый мир с Японией, ставит gaw_china_victory_settled и применяет японский/юго-восточный исход. Лучше после решения о начале GAW; без войны срабатывает только политическая часть."
 ZZZ_cr_gaw_03_japan_victory:0 "GAW: урегулирование победы Японии (ZZZ_gaw_settle_japan_victory)"
 ZZZ_cr_gaw_03_japan_victory_desc:0 "Белый мир с Китаем, ставит gaw_japan_victory_settled и устанавливает коллаборационистское правительство. Лучше после решения о начале GAW; без войны срабатывает только политическая часть."
 ZZZ_cr_tw_02_peaceful_reunification:0 "Тайваньский пролив: мирное воссоединение (особый административный район)"
 ZZZ_cr_tw_02_peaceful_reunification_desc:0 "Выполняет immediate-блок taiwan_detente.11 на CHI: Тайвань становится марионеткой уровня особого административного района, переходит к демократии с Эриком Чу, теряет материковые корки и претензии, возвращает материковые штаты CHI и расформировывает флот и авиацию. События нет."
 ZZZ_cr_mew_02_israel_victory:0 "Ближний Восток MEW: урегулирование победы Израиля (B-1 / B-2 / B-3)"
 ZZZ_cr_mew_02_israel_victory_desc:0 "ISR аннексирует PAL (Западный берег), HAM (Газа) и HEZ (Южный Ливан), ставит skip_default_capitulation, MEW_isr_took_pal / ham / hez и MEW_settlement_done, снимает MEW_sixth_war_ongoing. Частичные уступки Египта, Иордании и Сирии (B-4 / B-5) не берутся."
 ZZZ_cr_kr_05_real_south_annex:0 "袣芯褉械泄褋泻邪褟 褑械锌芯褔泻邪: 胁褏芯写 褉械邪谢褜薪芯谐芯 褋芯斜褘褌懈褟 鈥?挟谐 邪薪薪械泻褋懈褉褍械褌 小械胁械褉 (zzz_kor.5)"
 ZZZ_cr_kr_05_real_south_annex_desc:0 "袟邪锌褍褋泻邪械褌 薪邪锌褉褟屑褍褞 褉械邪谢褜薪芯械 褋芯斜褘褌懈械 zzz_kor.5 (KOR 邪薪薪械泻褋懈褉褍械褌 NKO) 写谢褟 锌褉芯胁械褉泻懈 褑械锌芯褔泻懈, 斜械蟹 胁褋褌褉芯械薪薪褘褏 褝褎褎械泻褌芯胁. 袙芯械薪薪邪褟 褔邪褋褌褜 鈥?褝褌芯 褋芯斜褋褌胁械薪薪褘泄 annex_country = { target = NKO transfer_troops = yes } 褋芯斜褘褌懈褟: 邪褉屑懈褟 懈 蟹邪锌邪褋 褌械褏薪懈泻懈 NKO 锌械褉械褏芯写褟褌 泻 KOR, 写懈胁懈蟹懈懈 褋芯褏褉邪薪褟褞褌 褋胁芯懈 褕邪斜谢芯薪褘, 薪懈褔械谐芯 薪械 褉邪褋褎芯褉屑懈褉芯胁褘胁邪械褌褋褟 懈 薪械 锌械褉械褎芯褉屑懈褉褍械褌褋褟. 袙蟹邪懈屑芯懈褋泻谢褞褔邪褞褖械 褋 褋械胁械褉薪褘屑 屑邪褉褕褉褍褌芯屑 (锌褉芯胁械褉褟褌褜 薪邪 芯褌写械谢褜薪芯屑 褔懈褋褌芯屑 褋芯褏褉邪薪械薪懈懈)."
 ZZZ_cr_kr_06_real_north_annex:0 "袣芯褉械泄褋泻邪褟 褑械锌芯褔泻邪: 胁褏芯写 褉械邪谢褜薪芯谐芯 褋芯斜褘褌懈褟 鈥?小械胁械褉 邪薪薪械泻褋懈褉褍械褌 挟谐 (zzz_kor.4 / ZZZ_NKO_march_to_seoul)"
 ZZZ_cr_kr_06_real_north_annex_desc:0 "袟邪锌褍褋泻邪械褌 薪邪锌褉褟屑褍褞 褉械邪谢褜薪芯械 褋芯斜褘褌懈械 zzz_kor.4 (NKO 邪薪薪械泻褋懈褉褍械褌 KOR), 褔褌芯 褌邪泻卸械 锌芯泻褉褘胁邪械褌 ZZZ_NKO_march_to_seoul, 褔械泄 complete_effect 谢懈褕褜 芯褌锌褉邪胁谢褟械褌 zzz_kor.4. 袙芯械薪薪邪褟 褔邪褋褌褜 鈥?褝褌芯 褋芯斜褋褌胁械薪薪褘泄 annex_country = { target = KOR transfer_troops = yes } 褋芯斜褘褌懈褟: 邪褉屑懈褟 懈 蟹邪锌邪褋 褌械褏薪懈泻懈 KOR 锌械褉械褏芯写褟褌 泻 NKO, 写懈胁懈蟹懈懈 褋芯褏褉邪薪褟褞褌 褋胁芯懈 褕邪斜谢芯薪褘, 薪懈褔械谐芯 薪械 褉邪褋褎芯褉屑懈褉芯胁褘胁邪械褌褋褟 懈 薪械 锌械褉械褎芯褉屑懈褉褍械褌褋褟. 袙蟹邪懈屑芯懈褋泻谢褞褔邪褞褖械 褋 褞卸薪褘屑 屑邪褉褕褉褍褌芯屑 (锌褉芯胁械褉褟褌褜 薪邪 芯褌写械谢褜薪芯屑 褔懈褋褌芯屑 褋芯褏褉邪薪械薪懈懈)."
