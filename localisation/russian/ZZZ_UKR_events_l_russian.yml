 #乌克兰 2017-2024 剧情链（ukraine.1-13，搬运自 TFR 并按本工程依赖改写）
 ukraine.1.t: "Украина нарушает Минские соглашения"
 ukraine.1.d: "Украинские армейские части возобновили пограничные столкновения с Федеральным государством Новороссия, открыто нарушив мирное соглашение. Кремль наблюдает, и хрупкое перемирие находится на грани краха."
 ukraine.1.o1: "Безрассудная затея."
 ukraine.2.t: "Рейс 752 авиакомпании Ukraine Airlines сбит над Ираном"
 ukraine.2.d: "Иранское правительство сообщило нам, что бойцы Корпуса стражей исламской революции по ошибке сбили наш авиалайнер вскоре после взлёта из международного аэропорта имени Имама Хомейни. Все 176 пассажиров и членов экипажа погибли. Тегеран называет это трагической ошибкой; для семей погибших это ничего не меняет."
 ukraine.2.o1: "Ужасная трагедия."
 ukraine.3.t: "Россия осуждает украинский «неонацизм»"
 ukraine.3.d: "Российские государственные СМИ запустили новую волну обвинений, называя киевское правительство «неофашистами» и «внуками гитлеровских пособников». Это лишь старые пропагандистские приёмы, переодетые в новости, но их повторяют каждый вечер на RT и Sputnik. Киев не оставит эту клевету без ответа."
 ukraine.3.a: "История нас оправдает."
 ukraine.4.t: "Русские идут"
 ukraine.4.d: "Военная разведка предупреждает, что Москва готовит полномасштабное вторжение. Инженеры уже заливают бетон вдоль Днепра и на восточных подступах, а новые оружейные заводы вводятся в строй в спешном порядке. Каждый построенный сейчас бункер покупает время потом."
 ukraine.4.a: "Готовиться к худшему."
 ukraine.5.t: "Приглашение в НАТО"
 ukraine.5.d: "Альянс официально пригласил Украину и Молдову вступить в его ряды. Для Москвы это та самая красная линия, о которой она предупреждала годами; для Киева это единственная гарантия, которая когда-либо работала. Протокол о вступлении будет подписан в ближайшие недели, что бы ни говорил Кремль."
 ukraine.5.a: "Вместе мы выстоим."
 ukraine.6.t: "Создана оккупационная зона в Белгороде"
 ukraine.6.d: "Украинские силы перешли российскую границу и создали оккупационную зону вокруг Белгорода. Москва называет это актом агрессии; командиры на местах — буфером. Местное русское население теперь живёт под украинской администрацией."
 ukraine.6.a: "Держать линию."
 ukraine.7.t: "Теракт в Белгороде"
 ukraine.7.d: "Бомба ударила по переполненному рынку в оккупационной зоне, убив десятки мирных жителей. Ответственность никто не взял, но взрыв превратил оккупацию из военной проблемы в политическую пороховую бочку."
 ukraine.7.a: "Это не останется без ответа."
 ukraine.8.t: "Белгородское восстание"
 ukraine.8.d: "Русские добровольцы и местные ополченцы поднялись против оккупационной администрации. Движение «Новая Россия» объявляет Белгород и Курск свободной российской территорией, и его бойцы уже вступают в бой с украинскими гарнизонами."
 ukraine.8.a: "Русская весна началась."
 ukraine.9.t: "Ростовское восстание"
 ukraine.9.d: "Восстание распространилось на Ростов. Местные казачьи ополчения захватили несколько районов и объявили их независимыми как от Киева, так и от Москвы, а добровольческий корпус «Мелитополь» закрепляется в регионе."
 ukraine.9.a: "Хаос ширится."
 ukraine.10.t: "Севастопольское восстание"
 ukraine.10.d: "В Крыму восстание дошло до Севастополя. Белорусские и волынские добровольческие формирования вошли на полуостров, и старые базы Черноморского флота стали спорной территорией."
 ukraine.10.a: "Полуостров в огне."
 ukraine.11.t: "Специальная военная операция"
 ukraine.11.d: "Генеральный штаб активировал таймер специальной военной операции. С этого момента российская кампания идёт по часам: либо Украина сломается, либо операция увязнет в тупике, которого Москва не может себе позволить."
 ukraine.11.a: "Запустить отсчёт."
 ukraine.12.t: "Украина обещает защищать Кубань"
 ukraine.12.d: "Киев публично гарантировал безопасность Кубани — региона, который Москва считает своим. Заявление является намеренной провокацией, и Кремль это понимает."
 ukraine.12.a: "Они знают альтернативу..."
 ukraine.13.t: "Выборы на Украине 2024 года"
 ukraine.13.d: "Украина идёт на выборы посреди войны. Лагерь Зеленского обещает преемственность и второй срок; консерваторы Порошенко — опыт и более жёсткую линию. Итог решит, какая Украина встретит Москву в 2025 году."
 ukraine.13.a: "Зеленский переизбран."
 ukraine.13.b: "Порошенко возвращается."
 germany.243.t: "Призрак Киева"
 germany.243.d: "Имя вирусно разошлось по соцсетям: украинский пилот МиГ-29 якобы сбил шесть российских самолётов в первый день вторжения. Кадры дрожат, заявления не проверены, но легенда уже делает свою работу в стране, которой она нужна."
 germany.243.a: "Удачной охоты."
 news.313.t: "Зеленский переизбран на Украине"
 news.313.d: "Зеленский получил второй срок. Военное лидерство и популистский стиль удержали его коалицию вместе, несмотря на коррупционные скандалы и застопорившееся контрнаступление; оппозиции теперь предстоят ещё четыре года."
 news.313.a: "Посредственный комедиант, но военный президент."
 news.313.b: "Запад продолжит выписывать чеки."
 news.314.t: "Порошенко избран на Украине"
 news.314.d: "Порошенко вернулся в президентство. Избиратели, уставшие от провалов Зеленского, повернулись к человеку, которого когда-то отвергли, ставя на опыт и жёсткую линию против Москвы, чтобы завершить войну на лучших условиях."
 news.314.a: "Один русофоб сменил другого."
 news.314.b: "По крайней мере, он умеет управлять."
