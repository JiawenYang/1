l_russian:

 # COUNTRY EVENTS
 PRU.1.t: "Перуанские выборы 2021 года"
 PRU.1.d: "Сегодня Перу проводит свои вторые тур выборы, и ставки высоки.\n\nКейко Фужимори, дочь бывшего президента Альберто Фужимори, снова баллотируется, надеясь получить президентство и возглавить Перу во вторую эпоху фужиморизма.\n\nЕе соперник — Педро Кастильо, бывший учитель, который приобрел известность как глава профсоюза учителей во время забастовок 2017 года. Он надеется распространить Розовую волну и на Перу.\n\nСтрана крайне поляризована, и результаты на волосок. По мере подсчета голосов объявляется победитель..."
 PRU.1.a: "Педро Кастильо победил!"

 PRU.2.t: "Президент Кастильо распускает Конгресс!"
 PRU.2.d: "После трудного года после вступления в должность президент Кастильо не смог преодолеть политическое разделение страны. Уже столкнувшись с двумя неудавшимися импичментами со стороны Конгресса Республики, законодатели официально начали третью попытку. Ясно, что Конгресс не намерен работать с администрацией, и поэтому не может быть доверен.\n\nОднако президент имеет план решения продолжающегося кризиса.\n1. Конгресс подлежит распуску.\n2. Судебная система, судебная система, Публичные министерства и Конституционный суд подлежат реорганизации.\n3. Будут организованы выборы конституционного конгресса, в котором будет написана новая Конституция Перу.\n\nПрезидент собирается выступить с обращением, официально защищая себя публично от третьего импичмента. Они не ожидают, что эта администрация больше не будет играть их игры."
 PRU.2.a: "\"...и до проведения новых выборов мы будем править декретами.\""

 PRU.3.t: "Армия марширует на Лиму!"
 PRU.3.d: "Похоже, наша власть не была такой сильной, как мы думали. Армия опубликовала одностороннее осуждение нашего переворота и провозгласила, что удалит наше правительство, чтобы \"защитить конституцию\". Они действовали быстрее, чем мы ожидали, и военные силы уже входят в столицу.\n\nУ нас нет надежды защититься. Мы должны эвакуироваться из страны и, надеюсь, найти способ изменить ситуацию..."
 PRU.3.a: "\"Блин... Быстро, подготовьте самолет в Каракас.\""

 PRU.4.t: "Военное правительство освобождает Альберто Фужимори"
 PRU.4.d: "Альберто Фужимори, правый лидер Перу, был несправедливо очернен левыми радикалами, которые разбежались после его администрации. Даже несмотря на президентский помилование в 2017 году, он остается за решеткой. Это несправедливость не может продолжаться. Как символическое действие исцеления и, надеюсь, укрепления противников социализма, Фужимори должен быть немедленно освобожден из тюрьмы."
 PRU.4.a: "Видна ли возврат фужиморизма?"

 PRU.5.t: "Перуанские выборы 2023 года"
 PRU.5.d: "Военное правительство закончило свое существование. Теперь, когда страна под контролем и социализм под пятою, новое гражданское правительство должно укрепиться. Все политические партии, за исключением тех, которые связаны с администрацией Кастильо, получили разрешение участвовать.\n\nОднако у никого не было такого же узнаваемого имени, как Fuerza Popular, или вернее, их кандидата: Альберто Фужимори. С фужиморизмом, поддержанным его дочерью Кейко, Альберто Фужимори был естественным фаворитом, и ни один другой кандидат не сформировал способной оппозиции.\n\nВпервые за 23 года: Фужимори вернулся."
 PRU.5.a: "На этот раз он здесь надолго."

 PRU.6.t: "Педро Кастильо провозглашает правительство в изгнании!"
 PRU.6.d: "Крыса, Педро Кастильо, давно укоренившаяся в гадюшьей норе Каракаса, осудила наши выборы как фальшивые, а наше правительство как уголовное. Он объявил себя все еще легитимным президентом Перу и учредил правительство в изгнании в Каракасе. Уже правительство Венесуэлы и другие левые силы в Америке признали его легитимным.\n\nПохоже, он решает быть вечным шипком у нас на боку. Или еще хуже. В то время как Венесуэла страдает от собственной внутренней смуты, текущая хаос во всем мире вынуждает нас считать, что ситуация все еще может эскалировать."
 PRU.6.a: "Убедитесь, что эта крыса не планирует ничего..."

 # NEWS EVENTS
 PRU.news.1.t: "Педро Кастильо побеждает на перуанских выборах"
 PRU.news.1.d: "ЛИМА, Перу (АП) — Педро Кастильо, учитель, ставший политиком, выиграл вторые тур выборы Перу в чрезвычайно напряженном состязании. С преимуществом всего 0,26% голосов, избранный президент Кастильо вступит в должность в глубоко разделенной стране, но остается оптимистичным, что его политические проекты \"принесут Перу перемены, которые оно заслуживает\".\n\nПри таком близком голосовании и изменении прогнозов с каждым часом до объявления победителя, обе стороны обвиняли друг друга в избирательном фальсификате, с шепотом о принятии мер по аннулированию выборов с обеих сторон в разное время ночи.\n\nПосле объявления победы избранного президента Кастильо его оппонент Кейко Фужимори, правый огонь и дочь бывшего президента Альберто Фужимори, провела протест в попытке аннулировать выборы, приведший к напряженному противостоянию в Лиму против воинственных сторонников Кастильо. Хотя гамбит Фужимори не удался, это символично для глубоких разделений в андеанской нации.\n\nПеруанский Конгресс также разделен, ни одна партия не добилась большинства. Эксперты прогнозируют, что коалиция, оппозиционная Кастильо, скорее всего, будет контролировать Законодательный дворец. Похоже, продолжающиеся политические разделения Перу далеко не окончены."
 PRU.news.1.a: "Розовая волна наводняет Анды"

 PRU.news.2.t: "Президент Кастильо совершает самопереворот в Перу"
 PRU.news.2.d: "ЛИМА, Перу (АП) — Перу в шоке сегодня, так как президент Педро Кастильо распустил Конгресс и принял чрезвычайные полномочия, объявив, что будет править декретами до новых выборов, которые установят \"конституционный конгресс\", чтобы переписать конституцию Перу.\n\nЭтот шаг стал кульминацией трудного года для администрации Кастильо, произошедшим после того, как Конгресс подал третью попытку импичмента президента. Казалось, Кастильо будет бороться с обвинениями юридически, но вместо этого он обогнал перуанскую оппозицию. В то время как Конгресс и Конституционный суд отвергли его действия, президент ужесточил контроль над несогласием, и его позиция теперь, по-видимому, укреплена.\n\nМногие в стране шокированы тем, что их конституционная демократия, по-видимому, исчезла за ночь. Эксперты комментировали, что успех Кастильо, вероятно, связан с внешним видом силы и единства. Поскольку многие члены его кабинета не виделись с момента его заявления, считается, что внешний вид администрации, единой под действиями Кастильо, привел к тому, что различные лидеры оппозиции отказались, а не рисковали гражданской войной, открыто поддерживая Конгресс. В столице ходят слухи о том, что члены его правительства и кабинета, которые возразили этому шагу, находятся под домашним арестом, что правительство отрицает.\n\nБудущее Перу неопределенно, и правительства по всему региону спешат организовать ответы на новый порядок в Перу."
 PRU.news.2.a: "Анды горячее"

 PRU.news.3.t: "Военный переворот в Перу"
 PRU.news.3.d: "ЛИМА, Перу, (АП) — Ситуация в Перу достигла очередного поворотного момента, так как президент Кастильо, который принял диктаторский контроль над страной в прошлом месяце, был свергнут перуанской армией. Военные объявили, что действуют \"для защиты перуанской нации и сохранения конституции\". Военные части все еще занимают улицы Лимы, с слухами о арестах всех, связанных с администрацией Кастильо.\n\nСамим президентом Кастильо удалось избежать ареста. Предупрежденный о перевороте в тот момент, когда армия вошла в Лиму, он смог спастись через самолет и приземлился в Каракасе, где ему предоставлено убежище. Уже он发表 заявления, осудив переворот как смерть надежды Перу на лучшее будущее.\n\nСитуация, похоже, наконец стабилизировалась, и перуанская армия теперь контролирует страну. Что они будут делать с ней — еще предстоит узнать."
 PRU.news.3.a: "Станут ли Анды когда-нибудь остывать?"

 PRU.news.6.t: "Педро Кастильо провозглашает правительство в изгнании!"
 PRU.news.6.d: "КАРАКАС, Венесуэла, (АП) — Исключенный перуанский президент Педро Кастильо сегодня сделал важное заявление: он отказался признать нынешнее перуанское правительство легитимным и создаст правительство в изгнании в оппозиции к Лиму. Это произошло на фоне возвращения Альберто Фужимори к президентству Перу после недавних выборов, организованных военным правительством. Кастильо осудил Фужимори как \"Тиран, стремиющийся территориализировать Перу снова\". Принимающая его правительство Венесуэлы уже признала его правительство легитимным.\n\nЭто ироничным образом означает, что Венесуэла повторяет свой собственный президентский кризис 2019 года, когда Соединенные Штаты признали лидера оппозиции Хуана Гуайдо президентом Венесуэлы, за исключением того, что теперь они поддерживают изгнанного претендента.\n\nС хаосом, распространяющимся по Америке, и снова нацией, в которой два человека, ненавидящие друг друга, претендуют на президентство, один вопрос задается в каждой столице континента, от Каракаса до Буэнос-Айреса: \"Наступает ли еще одна война?\"."
 PRU.news.6.a: "Боже, теперь их двое."
