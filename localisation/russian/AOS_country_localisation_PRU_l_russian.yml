 PRU_fujimori_teikoku: "Фужимори Тейкоку"
 PRU_fujimori_teikoku_desc: "Фужимори Тейкоку представляет собой постоянное правление семьи Фужимори над Перу. Хотя Альберто Фужимори остается главным политическим фигурой нации, его преклонный возраст постепенно ограничивает его прямое участие в государственных делах. В результате большая часть управления государством осуществляется теми, кто близок к нему, создавая систему, где власть исходит из престижа и наследия имени Фужимори. Поддержатели видят это устройство как источник стабильности и преемственности, а критики — как концентрацию власти в рамках политической династии. Режим часто называют Шогунатом, проводя аналогию с исторической политической структурой Японии. В этой аналогии Альберто Фужимори выступает в роли символизма императора, источника легитимности и национального единства, в то время как повседневное управление страной доверяется более активной фигуре, которая осуществляет власть от его имени. В Шогунате Шогуном является: §YКейко Фужимори§!\n\n\n\n\n\n\n\n   £GFX_texticons_PRU_keiko_fujimori_2\n\n\n\n\n\n\n\n\n-------------------------------------"
 PRU_never_truly_gone: "Никогда не уходит навсегда"
 PRU_never_truly_gone_desc: "Есть человек в дальних венесуэльских Андах, который, несмотря на довольно обыденный образ жизни, находя удовольствие в прогулках по горам, несет титул, который многие в нашей нации могут только мечтать получить: Президент и Верховный главнокомандующий Республики Перу.\n\nЕго попытка захватить всю власть в республике через переворот провалилась, и поэтому ему очень повезло иметь друзей в иностранном правительстве, готовых принять его подальше от юридических последствий, которые его ждут в Перу. Он мог бы легко отказаться от этого титула и посвятить себя мирной жизни далеко от дома, но люди, которые избрали его в первую очередь, все еще умоляют о его возвращении, и в лице все более авторитарного правого правительства он видит себя Мессией обедневших масс Перу, и, как Господь выше, он клялся сделать все возможное для искоренения гнили, которая разрушает его нацию десятилетиями, и возврата верховенства над нацией ее законным владельцам: Народу.\n\n§YПутшист, не в силах признать свое поражение в руках демократических институтов, которые мы так усердно поддерживали, провозгласил свое намерение попробовать счастья снова, на этот раз с помощью боливарианских орд, которые уже поглотили несчастную Республику Колумбия. Как благородные дети нашей Родины, наш долг — защитить ее от иностранного порабощения, любой ценой.§!\n\n§RPедро Кастильо§!§Y, бывший президент, путшист и беглец от перуанского права, возглавляет нелегитимное правительство в изгнании, сосредоточенное в Каракасе, Венесуэла.§!"
 PRU_kamikaze: "Камикадзе"
 PRU_kamikaze_desc: "Однажды они спускаться на улицы Тумбеса и Пуно, и с тем же презрением к человечеству, которое они проявили в Колумбии, они постараются осквернить нашу землю. Они будут грызть наших детей, испражняться на наших полях, а затем наши дома и убежища превратят в руины, а людей в них — в красный туман. Социализм будет внесен в Перу на вершине горы черепов, выше любой другой горы, которую наши предки когда-либо поднимались.\n\nДесятилетия назад наш президент вел нас через короткую, но жестокую войну в амазонских высокогорьях против наших братьев из Эквадора. Благодаря доброй воле обеих наций, война длилась всего месяц, но потери, понесенные за такой короткий промежуток времени, открыли нам глаза на ужасающую концепцию длительной войны. В отличие от наших бывших врагов, эти существа не хотят простой смены границ, а полного завоевания нашей нации и установления марионеточного режима, который также привнесет жалкую форму социализма, которая разрушила их собственную родину, заставив более миллиона их граждан искать убежища в нашей стране.\n\nТайваньцы вместе со своими японскими и австралийскими союзниками сражались с яростной храбростью и самопожертвованием, чтобы защитить свой остров от более крупной красной угрозы. Мы должны следовать их примеру. Будем крепостью против красной волны, угрожающей поглотить всю Южную Америку. Пусть иностранцы приходят на наши берега, чтобы найти свою ценность в нашей героической борьбе, и пусть наши собственные граждане, смелые люди Перу, снова собрались под флагом, чтобы защитить нашу дорогую матушку от тех, кто желает ее осквернить."
 PRU_western_hub_of_the_pacific: "Западный хаб Тихого океана"
 PRU_western_hub_of_the_pacific_desc: "С распадом Меркосура, Альянса Тихого океана и американской экономической гиганта, демократические нации, оставшиеся на континенте, должны были быстро адаптироваться к новой ситуации, в конечном итоге решив отказаться от этих старых договоров в пользу нового, который создаст зону свободной торговли от Ушуая до Тумбеса, создав безопасное место для инвестиций в иначе насильственном американском континенте.\n\nВ то время как Аргентина получает лучшее от Брюсселя, Перу получает самых достойных из Токио. Будучи членом как этого экономического альянса, так и Тихоокеанской экономической общины, Перу получил завистимый подъем своей экономики благодаря повышенному количеству инвесторов, инвестирующих в его фондовый рынок. Существуют смешанные мнения о этом новом статусе; для некоторых это означает совершенно новые машины и более опытный персонал для помощи с крупными горными операциями, которые извлекают минералы, необходимые другим иностранным державам для их электронного оборудования, а для других — это означает больше рыбацких судов, приходящих из Азии, чтобы заполнить зону исключительной экономической зоны Перу, чтобы проводить свои собственные рыбацкие операции в ущерб национальной местной рыбацкой промышленности.\n\nИз-за этого перуанская экономика впервые за годы видела рост, что позволяет правительству инвестировать эти деньги обратно в частный сектор, в инфраструктурные проекты и их спорное военное наращивание, которое также получило помощь от ПДТО, которые теперь стали крупнейшими экономическими партнерами Перу."