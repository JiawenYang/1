l_russian:
 E_Tank_Bat:0 "Танковый батальон"
 E_Tank_Bat_desc:0 "Танковый батальон советского образца: три роты по десять танков плюс танк штаба батальона, всего 31 танк. 600 человек."
 E_Arm_Inf_Bat:0 "Мотострелковый батальон (БМП)"
 E_Arm_Inf_Bat_desc:0 "Мотострелковый батальон на боевых машинах пехоты БМП-2/БМП-3: три роты, 42 БМП. 1150 человек."
 E_Mech_Inf_Bat:0 "Мотострелковый батальон (колёсный)"
 E_Mech_Inf_Bat_desc:0 "Мотострелковый батальон на колёсных бронетранспортёрах БТР-80/БТР-82А: три роты, 42 машины. 1150 человек."
 E_Mot_Inf_Bat:0 "Мотострелковый батальон (автомобильный)"
 E_Mot_Inf_Bat_desc:0 "Мотострелковый батальон на автомобильной тяге: три стрелковые роты на грузовиках «Урал»/КамАЗ. 1150 человек."
 E_L_Inf_Bat:0 "Лёгкий пехотный батальон"
 E_L_Inf_Bat_desc:0 "Лёгкий пехотный батальон в пешем порядке: три стрелковые роты при поддержке пулемётных и миномётных подразделений. 1050 человек."
