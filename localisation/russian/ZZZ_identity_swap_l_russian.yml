l_russian:
 zzz_identity.1.t:0 "Членство, подписанное под новым флагом"
 zzz_identity.1.d:0 "В послевоенном урегулировании [ROOT.GetName] новое коллаборационное правительство не сохранило ни одной из прежних союзнических принадлежностей. На церемонии подписания министр иностранных дел объявил, что военные союзы и экономические соглашения страны будут переоформлены согласно новому региональному порядку: старые названия вычеркнуты, новые вписаны. Официально это конец изоляции и возвращение к региональному сотрудничеству; соседи видят те же порты и те же базы, только подписывают бумаги другие люди."
 zzz_identity.1.a:0 "В новом реестре нет старых названий."
 zzz_identity.2.t:0 "Старое название возвращается"
 zzz_identity.2.d:0 "Коллаборационное правительство завершено, и [ROOT.GetName] вновь распоряжается своими дипломатическими документами. Первым делом новый кабинет восстанавливает один за другим договоры, подписанные до войны: военные союзы, тарифные соглашения, расчётные валюты — всё возвращается на прежние места. Никто не объясняет, почему эти документы заслуживают большего уважения, чем границы двухлетней давности, но флаги над портами и базами действительно вернули обратно."
 zzz_identity.2.a:0 "Договоры возвращаются, пункт за пунктом."
 zzz_identity.3.t:0 "Ещё одно имя в списке"
 zzz_identity.3.d:0 "Вашингтон внёс [ROOT.GetName] в список основных союзников, не входящих в НАТО. Это не союзный договор: ни статьи о взаимной обороне, ни гарнизона. В обмен — приоритетная очередь на поставки оружия, место на совместных учениях и более дешёвый канал закупок. Госдепартамент называет это углублением партнёрства; сам список никогда не был открыт более чем для горстки стран."
 zzz_identity.3.a:0 "Порог для оружия и учений снижен."
 zzz_identity.4.t:0 "Имя вычеркнуто"
 zzz_identity.4.d:0 "Вашингтон обновил список, и [ROOT.GetName] в нём больше не значится. Ни ноты, ни объяснений — только техническая запись об изменении: приоритетные поставки оружия отменены, место на совместных учениях отозвано, группа технологического обмена закрыта. Страна обнаруживает, что не потеряла ни одного договора — потому что у неё его никогда не было."
 zzz_identity.4.a:0 "Привилегии тихо отозваны."
