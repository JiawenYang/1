#Нефтяная сделка провалилась (saudi.12)
saudi.12.t: "Нефтяная сделка провалилась"
saudi.12.d: "Отчаянная попытка Эр-Рияда заключить соглашение о добыче с Москвой и столицами Залива закончилась унизительным крахом. Русские вышли из комнаты со смехом; монархи Залива, дрожа перед израильскими танками, отказались бросить вызов Вашингтону."
saudi.12.a: "Затопите рынок. Пусть тонут."
