 politicsjapan.11.t:0 "Всеобщие выборы в Японии 2017 года"
 politicsjapan.11.d:0 "48-е всеобщие выборы вернули Либерально-демократической партии и Комэйто уверенное большинство. Конституционно-демократическая партия стала крупнейшей оппозиционной силой, а социал-демократы и Коммунистическая партия Японии сохранили небольшое представительство.\n\nПри конституционной монархии выборы определяют правящую партию и её поддержку, а не занимающего трон Хризантемы."
 politicsjapan.11.a:0 "Сформировать новый кабинет"

 politicsjapan.12.t:0 "Всеобщие выборы в Японии 2021 года"
 politicsjapan.12.d:0 "49-е всеобщие выборы подтвердили коалицию ЛДП — Комэйто, хотя её большинство сократилось. Конституционно-демократическая партия усилилась, а Коммунистическая партия Японии и социал-демократы удержали свои немногочисленные места.\n\nИмператор остаётся вне избирательной борьбы; меняются лишь правящая партия и её поддержка."
 politicsjapan.12.a:0 "Принять результат выборов"

 politicsjapan.13.t:0 "Всеобщие выборы в Японии 2024 года"
 politicsjapan.13.d:0 "50-е всеобщие выборы лишили союз ЛДП — Комэйто большинства. Конституционно-демократическая партия резко усилилась, тогда как Партия инноваций, Демократическая партия народа, Рэйва Синсэнгуми и Коммунистическая партия Японии увеличили своё присутствие.\n\nЛДП по-прежнему правит меньшинственным кабинетом. Императорский институт выборы не затрагивают."
 politicsjapan.13.a:0 "Продолжить с меньшинственным кабинетом"

 politicsthailand.71.t:0 "Всеобщие выборы в Таиланде 2019 года"
 politicsthailand.71.d:0 "Первые общенациональные выборы после переворота 2014 года прошли в конституционных рамках, установленных хунтой. Пхыа Тхаи получила крупнейший блок, Пхаланг Прачаратх шла следом, а Партия будущего ярко дебютировала. Благодаря назначенному хунтой Сенату Прают Чан-о-ча собрал коалицию и вернулся на пост премьер-министра.\n\nМонархия остаётся в стороне от голосования; здесь решаются лишь правящая партия и её поддержка."
 politicsthailand.71.a:0 "Подтвердить коалиционное правительство"

 politicsthailand.72.t:0 "Всеобщие выборы в Таиланде 2023 года"
 politicsthailand.72.d:0 "Партия «Движение вперёд» получила больше всего мест с реформистской программой, Пхыа Тхаи шла близко следом. Сопротивление Сената не позволило сформировать правительство во главе с «Движением вперёд», поэтому коалицию возглавила Пхыа Тхаи, а Сеттха Тхависин стал премьер-министром.\n\nРезультат меняет правящую партию и поддержку партий, но не короля."
 politicsthailand.72.a:0 "Сформировать коалицию во главе с Пхыа Тхаи"
