### Characters
#################################################################################

MEX_andres_manuel_lopez_obrador_char: "Andrés Manuel López Obrador"
MEX_andres_manuel_lopez_obrador_char_desc: "Andrés Manuel López Obrador, better known as AMLO, was born in Tepetitán, Tabasco, into a family of merchants dedicated to agriculture. From an early age, he witnessed the hardships of southern Mexico, experiences that would deeply shape his political worldview. \n\nHe later moved to Mexico City, where he studied Political Science and Public Administration at the National Autonomous University of Mexico (UNAM). It was during this period that he became increasingly involved in national politics. Returning to Tabasco, he first joined the Institutional Revolutionary Party (PRI), but after internal disputes in the 1980s, he left and aligned himself with the opposition led by Cuauhtémoc Cárdenas. He soon became a member of the Party of the Democratic Revolution (PRD), where his charisma and political skill quickly propelled him to prominence. \n\nIn 2000, he was elected Head of Government of Mexico City as a PRD candidate. His tenure strengthened his reputation as a leader close to the people, particularly after the controversial impeachment process initiated by President Vicente Fox, which sought to bar him from politics. Instead of weakening him, the attempt elevated López Obrador to national prominence. \n\nHe ran for the presidency in 2006 and again in 2012, both times unsuccessfully. Following disputes within the PRD, he founded his own party, the National Regeneration Movement (MORENA). On his third attempt, in 2018, he finally won the presidency with more than 50% of the vote. This victory established MORENA as the dominant political force in Mexico, displacing the traditional parties. López Obrador presents himself as the leader of the \"Fourth Transformation\", a project he places on the same historical level as Independence (1810), the Reform (1857), and the Revolution (1910). Today, he governs a polarized nation: admired by millions who view him as a president close to the people, yet fiercely criticized by those who fear his confrontational style and the centralization of power."
MEX_claudia_sheinbaum_char: "Claudia Sheinbaum Pardo"
MEX_claudia_sheinbaum_char_desc: "Claudia Sheinbaum Pardo was born in June 1962 in the former Federal District, now Mexico City. The daughter of Jewish academics specialized in science, Claudia was linked to politics from a very young age, as her father was an active member of the Mexican Communist Party. She studied Physics at the National Autonomous University of Mexico (UNAM). During her university life, Claudia participated in various leftist student movements at UNAM, which were very active in the 80s due to the country's political instability at that time. These student movements brought Claudia closer to national politics. After finishing her degree, Claudia obtained a master's and a doctorate, specializing in Environmental Engineering. \n\nIn the early 90s, Claudia joined the ranks of the Party of the Democratic Revolution (PRD), where she forged strong ties with top party figures, such as Carlos Imaz and Andres Manuel Lopez Obrador (AMLO). In the year 2000, with AMLO's victory as head of government of Mexico City, Claudia was appointed Secretary of the Environment for the Mexico City Government. During this time, her bonds with Andres Manuel strengthened. In 2006, she served as a spokesperson for AMLO's candidacy. After AMLO's defeat, Claudia remained active in activism. In 2014, she participated alongside AMLO as a founding member of the MORENA party, rising again in Mexican politics, becoming the first female borough chief of Tlalpan (CDMX) and then, in 2018, the first female Head of Government of Mexico City. There, her capacity as a public servant began to be noticed, with an environmentalist, technical approach closely linked to science and a moderate administration. It is perhaps this capacity, and her strong bond with Andres Manuel, that led to her being chosen as the successor of the MORENA party, becoming the first female president of Mexico. Claudia now faces the challenge of being able to manage a country deeply marked by instability in every sense: social, political, and economic."
MEX_marcelo_ebrad_char: "Marcelo Luis Ebrad Casaubón"
MEX_marcelo_ebrad_char_desc: "Marcelo Luis Ebrad Casaubon was born in Mexico City, named Distrito Federal back then, from a family of French origins. He studied at Simon Bolivar school, and ended his education with a degree at International Relations at El Colegio de Mexico in 1984, at the age of 25.\n\nDuring his studies, he started working with the Institutional Revolutionary Party in 1981, managing to enter politics at a very young age, and changing his party affiliation many times before settling with Morena in 2018. He was very close to Manuel Camacho Solis and Andres Manuel Lopez Obrador, which awarded him important positions such as Head of State of the Federal District.\n\nDuring his leadership of the capital, he was a popular man, and with the support of AMLO, after a brief self-imposed exile in France between 2015 and 2018 as a result of accusations of corruption, he became one of Morena's most trusted leaders, even becoming Secretary of Foreign Affairs the same year.\n\nNow, he is the leader of a country in crisis. As the effects of the Cartel Wars start to be fully understood, his mandate as president of Mexico might be considered the most important to the country's stability since the end of the Mexican Revolution.\n\nWill Ebrad Casaubon manage to return to normalcy, or will Mexico be thrown into new darkness?"
MEX_adan_augusto_char: "Adan Augusto Leader Hernandez"
MEX_adan_augusto_char_desc: "Adan Augusto Lopez Hernandez was born in September 1962 in Paraíso, Tabasco. The son of an influential regional notary, he studied Law at the Juarez Autonomous University of Tabasco. Thanks to his family's political connections, he entered the Institutional Revolutionary Party (PRI) early on, where he met Andres Manuel Lopez Obrador (AMLO). He supported AMLO's first political campaigns in the state; although Lopez Obrador did not win at the time, Adan Augusto remained in various bureaucratic roles within the state administration.\n\nDuring the 2000s, he formally began his political career within the Party of the Democratic Revolution (PRD), quickly rising within the faction close to Lopez Obrador and gaining experience as a political operator. He later left the PRD alongside AMLO to become a founding member of the National Regeneration Movement (MORENA), establishing himself as one of the closest figures to the movement's leader. This closeness led to his candidacy for Governor of Tabasco in 2018, winning with a discourse aligned with the project of then-President-elect Lopez Obrador. However, his state administration faced criticism for alleged corruption and questions regarding public management.\n\nHis close relationship with the president led to his appointment as Secretary of the Interior in 2012, making him a central figure in the federal government and a key operator for the consolidation of the official political project. He stood out for his absolute loyalty to the president, sharing much of his ideological vision and pragmatism, while demonstrating a notable capacity for negotiation and political control.\n\nAdan Augusto is also known for his firm leadership style and authoritarian tendency, having openly shown distrust toward the press and political opposition. Now at the helm of a weak and fractured Mexican nation, some consider a return to the old PRI system possible to restore stability to Mexico, though the true reach of his government can only be judged over time."

