### Sub Ideologies Desc #####################################

MEX_left_populism_desc: "\n\n\n\n   £GFX_Ideology_amlo_populism \n\n\n\n\n\n§YObradorism (Left-wing Populism)§! combines elements of populist rhetoric and themes with leftist ideology. Generally, left-wing populism is anti-elitest, skepitcal of globalism, and anti-establishment. Left-wing Populism is extremely anti-militaristic, forming mainly out of opposition to American military intervention in the late 90s and early 2000s. Left-wing populists seek to eliminate the wealth gap through wealth redistribution, social programs, and big government."
