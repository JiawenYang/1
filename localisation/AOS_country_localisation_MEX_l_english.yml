##############################################################
### Focuses
##############################################################

MEX_continue_the_fourth_transformation: "Continue the Fourth Transformation"
MEX_continue_the_fourth_transformation_desc: "After our movement's victory in 2018, the year 2019 served as a period of consolidation and organization. Now, in 2020, the true test begins: to launch a profound and lasting transformation of national life. Mexico has lived through three great chapters that forever altered its history: Independence, the Reform, and the Revolution. Each reshaped the nation's destiny. Today, the people have entrusted us with a new transformation, one aimed at eradicating corruption, fighting inequality, and restoring hope to millions of Mexicans. This is the dawn of a new era. We cannot fail, for Mexico's destiny demands that we carry out the people's mandate: to achieve a true transformation that honors the past and builds a future of justice, democracy, and sovereignty. Do not lie, do not steal, and do not betray the people!"

ZAP_teasing_focus: "Zapata Vive, La Lucha Sigue"

##############################################################
### IDEAS and shit
##############################################################

USA_north_american_free_trade_agreement_idea: "North American Free Trade Agreement"
USA_north_american_free_trade_agreement_idea_desc: "\n\n\n\n£GFX_MEX_nafta_banner\n\n\n\n\n\n"
CAN_north_american_free_trade_agreement_idea: "North American Free Trade Agreement"
CAN_north_american_free_trade_agreement_idea_desc: "\n\n\n\n£GFX_MEX_nafta_banner\n\n\n\n\n\n"

MEX_north_american_free_trade_agreement_idea: "North American Free Trade Agreement"
MEX_north_american_free_trade_agreement_idea_desc: "\n\n\n\n£GFX_MEX_nafta_banner\n\n\n\n\n\nThe North American Free Trade Agreement, signed in 1994 by Carlos Salinas de Gortari, radically transformed Mexico's economy. It opened the door to capital and goods from the United States and Canada, restructuring the country's productive system toward exports, often at the expense of domestic production. \nIn 2018, the agreement was renegotiated and renamed the United States-Mexico-Canada Agreement (USMCA). Despite new terms, Mexico's economic dependence on the U.S. market became even more entrenched. The USMCA is a driver of growth, but also a reminder of Mexico's vulnerability to decisions made in Washington."
MEX_massive_social_programs_dynamic: "Massive Social Programs"
MEX_massive_social_programs_dynamic_desc: "\n\n\n\n£GFX_MEX_massive_social_programs_banner\n\n\n\n\n\nSince taking office, the government of the Fourth Transformation has launched an ambitious network of social programs aimed at reducing poverty and inequality across Mexico. Scholarships for students, financial support for the elderly, people with disabilities, and unemployed youth, as well as investments in marginalized communities, form the backbone of a policy that seeks to restore the State's central role in social welfare. \nThese initiatives have earned the administration strong popular support, especially among vulnerable sectors. However, they also strain public finances and fuel criticism from the opposition, who denounce them as clientelist and unsustainable in the long term.\nDespite the controversy, these programs remain one of the most visible pillars of the current political project. reinforcing the government's connection to the people and reshaping Mexico's social landscape."
MEX_militarization_of_the_public_life_dynamic: "Militarization of Public Life"
MEX_militarization_of_the_public_life_dynamic_desc: "\n\n\n\n£GFX_MEX_militarization_of_public_life_banner\n\n\n\n\n\nSince the presidency of Felipe Calderón and the declaration of the \"war on drugs,\" Mexico has been caught in a spiral of violence that conventional law enforcement could not contain. In response, Calderón deployed the Army and Navy from their barracks into the streets to combat drug cartels, marking the beginning of their direct involvement in civilian life. Under Enrique Peña Nieto, the role of the armed forces in internal security was further reinforced. \n\nAlthough Andrés Manuel López Obrador came to power promising to return the military to its barracks, that promise has gone unfulfilled. His administration created the National Guard, a force with a largely military structure, and expanded the military's role in public administration and major infrastructure projects. \nThis growing militarization reflects how SEDENA and SEMAR have regained political influence after decades of marginalization, dating back to the presidency of Miguel Alemán (1946-1952). Today, Mexicans are accustomed to seeing armored divisions on highways, Navy helicopters in the skies, and open combat in urban areas. \n\nThis deployment has sparked tensions within civil society, eroding perceptions of civil liberties, highlighting the state's inability to control criminal groups, and raising concerns about national stability. Yet, despite the controversy, SEDENA and SEMAR remain among the most trusted institutions in the country, enjoying high approval ratings from the public."
MEX_ghost_of_the_perfect_dictatorship_idea: "The Ghost of the Perfect Dictatorship"
MEX_ghost_of_the_perfect_dictatorship_idea_desc: "\n\n\n\n£GFX_MEX_ghost_of_the_perfect_dictatorship_banner\n\n\n\n\n\nFor more than 70 years, the Institutional Revolutionary Party (PRI) shaped Mexico's political, economic, and social life with near-absolute control. It was a true political leviathan, famously described by Mario Vargas Llosa as \"the perfect dictatorship.\" \nIts system of corporatism, clientelism, and authoritarian control left a deep mark on the country's institutions, private sector, political culture, and society as a whole. Although the PRI no longer holds the hegemony it once did, its legacy remains embedded in power networks, traditional elites, and the very way politics is practiced in Mexico. In fact, many of today's parties and institutions trace their origins back to the PRI, carrying with them many of its old vices. \nToday, the ghost of the PRI still haunts Mexico's politics, economy, and social life. It is a lingering specter that keeps clientelism, corruption, bureaucratic inefficiency, and authoritarian inertia alive, thus obstructing full democratization, political modernization, and the nation's development in every sphere."
MEX_a_revolutionary_past_idea: "A Revolutionary Past"
MEX_a_revolutionary_past_idea_desc: "\n\n\n\n£GFX_MEX_a_revolutionary_past_banner\n\n\n\n\n\nThe Mexican Revolution left a deep mark on the country's social and political life. Even a century later, its core ideas — social justice, land redistribution, state involvement in strategic sectors, nationalism, and the preservation of traditional values, such as Roman Catholicism — continue to shape Mexican society and the state. Despite the economic and political changes of recent decades, the population still holds tightly to principles born during that historical period. This has led to widespread rejection of political movements that threaten the Revolution's legacy, and a general distrust of extremist ideologies, whether from the left or the right. \n\nThis historical legacy has compelled politicians to adjust their rhetoric and policies to avoid conflicting with revolutionary ideals. State-owned enterprises like PEMEX and the CFE survived the wave of neoliberal privatizations, and political parties have been pushed toward the center to avoid instability and public disapproval. \nMexico's revolutionary past serves as a constant reminder of the State's relevance in economic and social life, influencing contemporary politics and shaping how citizens perceive their country and their rights."
MEX_central_american_caravans_idea: "Central American Caravans"
MEX_central_american_caravans_idea_desc: "\n\n\n\n£GFX_MEX_central_american_caravans_banner\n\n\n\n\n\nSince 2018, Mexico has become the main route for thousands of migrants fleeing violence, poverty, and political instability in Central America. Entire families have joined massive caravans traveling through the country in hopes of reaching the United States, creating an unprecedented humanitarian challenge. \n\nThe Mexican state now faces pressure both internally and externally: on one hand, it must guarantee human rights and provide basic assistance to migrants; on the other, its relationship with Washington is strained by demands to curb the migratory flow. This situation polarizes national public opinion, dividing those who see these caravans as an act of solidarity from those who consider them a burden to the country's security and economy. \n\nBeyond the immediate crisis, how Mexico manages this phenomenon will shape its political and diplomatic path, reflecting the tensions between its humanitarian role, internal limitations, and the pressures of its powerful northern neighbor."
MEX_cartel_presence_severe_tfx_edition: "Severe Cartel Presence"
MEX_cartel_presence_severe_tfx_edition_desc: "\n\n\n\n£GFX_MEX_severe_cartel_presence_banner\n\n\n\n\n\nSince the late 20th century, Mexico's cartels have evolved from smuggling networks subordinated to Colombian kingpins into powerful criminal empires. The fragmentation of the state and widespread corruption among local authorities allowed them to establish territorial control across several regions, exercising political and economic power parallel to that of the government. Beginning in the 2000s, the so-called \"War on Drugs\" unleashed an unprecedented spiral of violence, as the breakup of larger organizations gave rise to multiple rival groups competing for routes, plazas, and illicit markets. Today, the cartels not only dominate the drug trade, but also extortion, illegal mining, kidnapping, and social control through fear. Their pervasive presence erodes the authority of the state, undermines trust in democratic institutions, and complicates any attempt at pacification or development."
MEX_a_oil_bonaza: "A Oil Bonanza"

MEX_mexican_resconstruction_idea: "The Mexican Reconstruction Plan"
MEX_collapsed_authority_tfx: "Collapsed Authority"
MEX_collapsed_authority_tfx_desc: "CHAOS! As constitutional order collapses over the country, so do the public services. Healthcare, education, the economy... all become secondary struggles in the face of war. Foreign businesses get out, millions of our own people abandon the war-torn country, and many others fall into the hands of insurgent groups, cartels and other violent guerrillas. The distribution of things as basic as water and food have been disrupted over large territories, and combined with the military operations, results in many casualties among the civilian population. The state of collapse of our northern neighbour only worsens the situation."

MEX_CSTO_cooperation: "Mexican-CSTO Cooperation"
MEX_NATO_cooperation: "Mexican-NATO Cooperation"

MEX_death_of_the_giant_idea: "Death of the Giant"
MEX_death_of_the_giant_idea_desc: "\"Poor Mexico. So far from God and so close to the United States.\"\n   - Porfirio Díaz\n\nThose words have echoed within the souls of every Mexican who has lived under the shadow of our Northern neighbor. Now, that shadow no longer looms over us, for the Giant of the Americas has collapsed under its own weight into warring factions vying for domination. The screams and cries of our neighbors slaughtering each other frighten our people. But the worst casualty is the loss of our economic interdependence, and it has crippled our economy comparable to that of the Lost Decade. Meanwhile, elements within our population are beginning to stir as they declare the death of America the time to free our shackles at the cost of republican ideals."

##############################################################
### Events
##############################################################

MEX.news.101.t: "Zapatistas Take Over Mexico!"
MEX.news.101.d: "Shocking news are coming from Mexico today, as Subcomandante Moises has proclaimed a new era for the country. The last cartel and federal remains have surrendered, and all power belongs to the anarcho-communist muncipalities, following the Zapatista model in Chiapas.\n\nDespite reactionary resistance coming from different places and sectors of society, approaches such as pragmatic stances on political prisoners, respect of the laws of warfare during the conflict, promises of stability and equality, and the hard stance on people who wish to create new cartels from scratch gave them enough popularity to rise as a mostly stable entity, one of the only libertarian socialist experiments to survive the fire of war and live to tell the story. The international community now struggles to understand how should they aproach a non-state entity, the first stable one since the creation of the United Nations in 1945.\n\nAs peace settles, life continues as normal, despite changes to the way it's organized. Anarcho-communist and anarchist supporters around the world now rally behind Moises, claiming this proves anarchism can, and will work in the correct conditions."
MEX.news.101.a: "The struggle is like a circle. You can start at any point, but it never ends.-Subcomandante Marcos"

MEX.news.103.t: "Evangelicals Take Over Mexico!"
MEX.news.103.d: "In a scene that could have been taken from a movie, the leader of La Luz del Mundo, Naason Joaquin Garcia, has rose from his pedestal, and proclaimed that the country would be renamed to become the \"Heavenly Kingdom of our Father\", and for theocratic rule to be established all over Mexico. The masses were euphoric.\n\nThe situation has been compared to the Iranian Revolution of 1979: a formerly secular country ending up becoming a religious theocracy. It all started when the Cartel Wars began: the temporary alliance with the federal government was eventually broken, and against all odds, not only did they managed to survive the offensives of the Mexican armies, but also to destroy all their enemies one by one, until proclaiming victory. This was very unlikely, and the Evangelic faith has increased as a result, not only in Mexico, but all about the world: they are sure only God himself could've gave them the strength to win in such a weak initial position.\n\nInternational organizations worry about the fact mass forced conversions of Catholics have started, which has been denounced by the Vatican. In such a Catholic-dominated country, this move could easily mean a devastating blow to the already fragile state."
MEX.news.103.a: "You don't know how strong you are, until being strong is your only option left."

MEX.news.104.t: "The Knight Templars Return"
MEX.news.104.d: "The chaos in Mexico has stopped, with one faction triumphing over them all. The result of the conflict was one not expected by any serious military analyst, and yet somehow it happened: the Knight Templars Cartel has managed to take control over Mexico and, contrary to what many expected, has actually promised to establish a theocracy in Mexico, instead of dropping it as a cover for drug trafficking.\n\nThe international community is shocked. The pope has rejected the legitimacy of the new entity, claiming they are not true Catholics, and has published an encyclical denouncing them. Inside Mexico, however, it has gotten some support, despite the fact many believe this self-proclaimed \"Order-State\" (referencing the State of the Teutonic Order) to be nothing but a way for the victorious wanted drug lords to stay in power with additional legitimacy. Some go as far as to ask for military intervention.\n\nThe fragile alliance at the start of the Cartel Wars between them and La Nueva Familia Michoacana ended in an internal coup which brought the Templars to power, and against all odds they managed to defeat all their enemies. Only time can tell if this new state of affairs will prevail, or if it will collapse under its own weight."
MEX.news.104.a: "Pslam 119:137; Righteous are you, O Lord, and right are your rules."

MEX.news.105.t: "Claudia Sheinbaum Elected President of Mexico"
MEX.news.105.d: "After the conclusion of the Cartel Wars, which saw the defeat of Mexico City's many enemies, elections have finally been held to determine the successor to outgoing President Andres Manuel Lopez Obrador. In a tense political campaign between the MORENA and PRI-PAN coalitions, the polls have declared that MORENA candidate Dr. Claudia Sheinbaum Pardo will become the first female President of Mexico with a landslide victory to prove it. Her victory firmly asserts MORENA's position as the dominant party in Mexico and the mandate to carry out President Obrador's \"Fourth Transformation\" vision.\n\nClaudia, known for her moderate leadership within MORENA, is primarily focused on creating an administration focused on the sciences, the environment, and the continuation of her mentor's many social policies that have helped climbed millions of Mexicans out of poverty. The streets are currently filled with chants and cheers on the success of a Jewish Mexican woman to soon hold the office of President since the founding of the nation more than 200 years ago. \n\nEven so, doubts persist about how Claudia Sheinbaum will handle the Reconstruction of the Mexican state following the end of the vicious civil war. With experts warning the potential return of the cartels and remnants of hardened revolutionaries continuing to engage in guerrilla warfare, only time will answer if Claudia can handle both her nation's domestic affairs and their place in a far different geopolitical landscape."
MEX.news.105.a: "The 4th Transformation..."

MEX.news.106.t: "Marcelo Ebrard elected president of Mexico"
MEX.news.106.d: "With the conclusion of the Cartel Wars, Mexico was finally able to hold elections to determine who would succeed the outgoing President Andres Manuel Lopez Obrador. A heated election between MORENA's coalition and the PRI-PAN alliance came to a grueling conclusion, with the polls declaring that MORENA candidate Marcelo Ebrard had won with a comfortable majority of the vote. His victory cements MORENA's position as a political force to be reckoned with, and the continuation of President AMLO's “Fourth Transformation” project.\n\nMarcelo Ebrard was a candidate who promised to lead a new administration that would take a technocratic and progressive approach to governing the nation, with various analysts pointing out his past work as Head of Government of Mexico City as a peek into how he would run the nation. His time in that position was characterized by a focus on administrative efficiency, modernization of institutions, and the continuity of social programs promoted by the previous government. He is however expected to lead a different approach to MORENA's platform, which could signal a new phase of MORENA's revolution of Mexico's democracy, even though some supporters fear a return to a neoliberal approach to economics. \n\nHowever, it is now in Marcelo's hands to be able to steer Mexico towards a new era while ensuring Reconstruction of the state doesn't fall apart to the remnants of cartel cells and other insurgent organizations. Marcelo also has a great opportunity to establish Mexico's position in the global stage, with the fallout of the Second American Civil War causing a massive global rearrangement of great powers and spheres. "
MEX.news.106.a: "A new Vision of Mexico?"

MEX.news.107.t: "Adan Augusto Elected President of Mexico"
MEX.news.107.d: "Following the end of the Cartel Wars, the scarred but enduring nation of Mexico has resumed holding elections to find a new successor to outgoing President Andres Manuel Lopez Obrador. After a tense political campaign between the MORENA coalition and the PRI-PAN opposition, MORENA candidate Adan Augusto Lopez Hernandez has won the elections with a slight majority of the vote. Known for his close personal relationship with President AMLO, his triumph has helped consolidate MORENA as the dominant force in Mexico's politics and the continuation of President AMLO's \"Fourth Transformation\" policies.\n\nHowever, the outlook facing the new president is not as favorable as the polls may suggest. The Mexican opposition has largely remained in protest with the incoming administration, with fears of a more centralized vision of power from the president's office threatening the autonomy of major institutions within the Federal government and the freedoms of the media. Critics argue his closeness with President AMLO will only see minimal changes in the way the government is governed and administered under MORENA, with the outgoing President having had a tense relationship with the Supreme Court.\n\nDespite these critiques, it is up to Adan Augusto to lead Mexico through its Reconstruction phase and see the full pacification of the remaining cartel and anti-government resistance cells."
MEX.news.107.a: "A project of continuity..."
TFX_USA_mex_transfer.1.t: "The Fate of the Golden Eagle"
TFX_USA_mex_transfer.1.d: "With the completion of War Plan Green’s goals and the removal of Mexico City’s government, we have secured our southern border and ended the chaos that has infested Mexico since the start of the Second American Civil War. The cartels, the ideological fanatics, the anarchists, and any other form of opposition have been laid to waste by the might of our renewed military power. \n\nWhile our citizens and troops cheer our victory, our administration has reached an inconclusive stalemate over the fate of Mexico. It is noted that Mexico has a substantial population to continue guerrilla movements against our occupation forces, and that the geography of such a large nation could become a very dangerous quagmire to hold on to, perhaps even becoming our very own Vietnam or Afghanistan right up to our border. Therefore, some voices have proposed creating a “transitional” government aligned with our interests and views to keep the populace somewhat appeased. There are indeed individuals backed by certain interest groups in Mexico who have expressed their desire to stabilize their nation and renew our friendship with one another.\n\nOn the other hand, hardliners and war hawks believe that even a battered America can still control all of Mexico and restore order by any means necessary. Mexico is also very rich in resources, which could help boost our economy on the premise that we are “helping” to invest in Mexico’s war-torn regions. We also cannot ever allow the return of any drug cartel organizations to continue to infect Americans with fentanyl, opioids, and other synthetic drugs. Even if we may have to begrudgingly take care of the Mexican citizenry who may comply with our rule, at the very least, they have no border to jump over.\n\nAfter hearing out each side’s quarrels and dealing with the headaches, the final decision was made, and the fate of Mexico is.."
TFX_USA_mex_transfer.1.a: "Set up a provisional government friendly to Washington, D.C and have the Mexicans enjoy their “autonomy”"
TFX_USA_mex_transfer.1.b: "Continue the military occupation of Mexico, and ensure that they do not grow to be a nuisance"
USA_establish_mexican_goverment_decision: "Fate of §GMexico"

