 PRU_fujimori_teikoku: "Fujimori Teikoku"
 PRU_fujimori_teikoku_desc: "The Fujimori Teikoku represents the enduring rule of the Fujimori family over Peru. Although Alberto Fujimori remains the nation's supreme political figure, his advanced age has gradually limited his direct involvement in government affairs. As a result, much of the state's administration is conducted by those closest to him, creating a system where authority flows from the prestige and legacy of the Fujimori name. Supporters view this arrangement as a source of stability and continuity, while critics see it as a concentration of power within a political dynasty. The regime is often referred to as the Shogunate, drawing comparisons to Japan's historical political structure. In this analogy, Alberto Fujimori serves as the symbolic Emperor, the ultimate source of legitimacy and national unity, while the day-to-day governance of the country is entrusted to a more active figure who exercises power in his name. In the Shogunate, the Shogun is: §YKeiko Fujimori§!\n\n\n\n\n\n\n\n   £GFX_texticons_PRU_keiko_fujimori_2\n\n\n\n\n\n\n\n\n-------------------------------------"
 PRU_never_truly_gone: "Never Truly Gone"
 PRU_never_truly_gone_desc: "There is a man in the far away Venezuelan Andes who, despite leading a rather mundane lifestyle finding leasure wandering through the mountains, holds a title that many in our nation can only dream of obtaining: President and Commander in Chief of the Republic of Peru.\n\nHis attempt at seizing all power in the republic through a coup has failed, and so he's quite lucky to have friends in a foreign government willing to host him away from the legal consequences that await him in Peru. He could easily abandon that title and dedicate himself to a peaceful life far away from home, but the people that elected him in the first place still beg for his return, and in the face of increasingly authoritarian right-wing government, he sees himself as the Messiah of the impoverished masses of Peru, and just like the Lord above he has sworn to do everything in his power to eradicate the rot that's been consuming his nation for decades, and return the overlordship of the nation to its rightful masters: the People.\n\n§YThe Putschist, unable to admit his defeat at the hands of the democratic institutions we've worked so hard to maintain, has declared his intention to try his luck once again, this time with the aid of the Bolivarian hordes that have already consumed the ill fated Republic of Colombia. As the noble children of our motherland it is our duty to protect her from foreign subjugation, no matter the cost.§!\n\n§RPedro Castillo§!§Y, former president, putschist and fugitive from the Peruvian law, is heading the illegitimate Government in Exile centered in Caracas, Venezuela.§!"
 PRU_kamikaze: "Kamikaze"
 PRU_kamikaze_desc: "One day, they'll descend upon the streets of Tumbes and Puno, and with the same disdain for humanity they've shown in Colombia, they shall seek to desecrate our land. They'll gnaw on our children, defecate on our fields and then our homes and shelters into rubble, and the people inside them into red mist. Socialism will be brought into Peru atop a mountain of skulls, taller than any other mountain that our forefathers have ever climbed.\n\nDecades ago, our president led us through a small but vicious war in the Amazonian highlands against our brothers from Ecuador. Thanks to the goodwill of both nations, the war only lasted a month, but the casualties suffered in such a short timespan have opened our eyes about the horrifying concept of a prolonged war. Unlike our former foes, these beings do not want a mere change in borders, but the total conquest of our nation and the installation of a puppet regime, who will also bring in the wretched form of socialism that has ravaged their own homeland, forcing over a million of their citizens to seek refuge in our country.\n\nThe Taiwanese alongside their Japanese and Australian allies fought with fierce bravery and selflessness to protect their island against the larger red threat. We shall follow their example. Let us be the bulwark against the red tide that threatens to consume all of South America. Let the foreigners arrive to our shores to find their worth in our heroic struggle and let our own citizens, the brave people of Peru, rally around the flag once again to protect our dear mother against those who desire to desecrate her."
 PRU_western_hub_of_the_pacific: "Western Hub of the Pacific"
 PRU_western_hub_of_the_pacific_desc: "With the collapse of Mercosur, the Alliance of the Pacific and the American economic behemoth, the democratic nations that remained in the continent had to adapt quickly to this new situation, eventually deciding to abandon those old treaties in favor of a new one that would create a free trade zone going from Ushuaia to Tumbes, creating a safe place for investment in the otherwise violent American continent.\n\nWhile Argentina receives the best of Brussels, Peru receives the worthiest of Tokyo. Being both a member of this economic alliance and the Pacific Economic Community has given Peru an enviable boost to their economy thanks to the elevated amount of investors pouring into their stock market. There are mixed opinions about this new status quo; for some, this means brand new machines and more experienced personnel to help with the large mining operations that extract the minerals that other foreign powers require for their electronic equipment, and for others this means more fishing vessels coming from Asia to flood into Peru's EEZ to conduct their own fishing operations at the expense of the nation's local fishing industry.\n\nBecause of this, the Peruvian economy has seen growth for the first time in years, allowing the government to invest that money back into the private sector, into infrastructure projects and their controversial military buildup, which has also received help from the PDTO, who have now become Peru's biggest economic partners."