l_english:

 # COUNTRY EVENTS
 PRU.1.t: "The 2021 Peruvian Elections"
 PRU.1.d: "Today, Peru hosts its Runoff Elections, and the stakes are high.\n\nKeiko Fujimori, daughter of former President Alberto Fujimori, is running once again, hoping to gain the Presidency and lead Peru into a second era of Fujimorism.\n\nHer challenger is Pedro Castillo, a former teacher who gained notoriety as the head of the Teacher's Union during the 2017 strikes. He hopes to further the Pink Wave into Peru itself.\n\nThe country is extremely polarized, and the results are down to the wire. As the votes are tallied, the winner is declared..."
 PRU.1.a: "Pedro Castillo has Won!"

 PRU.2.t: "President Castillo Dissolves Congress!"
 PRU.2.d: "After a difficult year since entering office, President Castillo has been unable to overcome the political division of the country. Already having faced two failed impeachements by the Congress of the Republic, lawmakers formally started a third attempt. It is clear Congress has no desire to work with the administration, and as such cannot be trusted.\n\nThe President, however, has a plan to address the ongoing crisis.\n1. Congress is to be dissolved.\n2. The Justice System, the Judicial System, Public Ministries, and the Constitutional Court are to be reorganized.\n3. Elections will be organized for a constitutional congress, wherein a new Constitution for Peru will be written.\n\nThe President is to make an address, officially to defend himself publicly from the third impeachment. They do not expect this administration will no longer play their games."
 PRU.2.a: "\"...and until the new elections are held, we will govern by decree.\""

 PRU.3.t: "The Army Marches on Lima!"
 PRU.3.d: "It appears our hold was not as strong as we thought. The Army has issued a unilateral denunciation of our coup, and proclaimed they will remove our government to \"safeguard the consitution\". They have acted faster than expected, and military forces are already entering the capital.\n\nWe have no hope to defend ourselves. We must evacuate the country, and hopefully find a way to reverse the situation..."
 PRU.3.a: "\"Fuck... Quick, prepare a plane to Caracas.\""

 PRU.4.t: "Military Government Frees Alberto Fujimori"
 PRU.4.d: "Alberto Fujimori, right-wing leader of Peru, has been unfairly villified by the leftist radicals that had run loose after his administration. Even despite a Presidential Pardon in 2017, he remains behind bars. This injustice cannot stand. As a symbolic act of healing, and to hopefully strengthen opponents of socialism, Fujimori is to be released from prison, effective immediately."
 PRU.4.a: "Is the return of Fujimorism in sight?"

 PRU.5.t: "The 2023 Peruvian Elections"
 PRU.5.d: "The Military Government is at an end. Now that the country is under control, and socialism is under the boot, a new civilian government is to take root. All political parties, with the exception of those tied to the Castillo Administration, were allowed to participate.\n\nHowever, none had the name recognition of Fuerza Popular, or rather of their candidate: Alberto Fujimori. With Fujimorism kept alive by his daughter, Keiko, Alberto Fujimori was a natural frontrunner, and no other candidate formed a capable opposition.\n\nFor the first time in 23 years: Fujimori is Back."
 PRU.5.a: "This time, he is here to stay."

 PRU.6.t: "Pedro Castillo Declares Government in Exile!"
 PRU.6.d: "The rat, Pedro Castillo, long settled into the viper's nest of Caracas, has denounced our elections as fraudulent, and our government as criminal. He has declared himself to still be the legitimate President of Peru, and established a government in exile in Caracas. Already, the Venezuelan Government and other leftist forces in the Americas have recognized him as legitimate.\n\nIt seems he is dedicated to be an eternal thorn on our side. Or worse. While Venezuela suffers from its own internal strife, the present chaos around the world forces us to consider the situation could still escalate."
 PRU.6.a: "Make sure that rat isn't planning anything..."

 # NEWS EVENTS
 PRU.news.1.t: "Pedro Castillo Wins Peruvian Elections"
 PRU.news.1.d: "LIMA, Peru (AP) - Pedro Castillo, the teacher-turned-politician has won Peru's runoff elections in an extraordinarily close contest. With a lead of only 0.26% of the vote, President-Elect Castillo will enter office in a deeply divided country, but remains optimistic his political projects will \"bring to Peru the change it deserves\".\n\nWith a vote this close, and with projections changing by the hour until a winner was declared, both sides accused the other of electoral fraud, with whispers of taking action to overturn the election from both sides at different points in the night.\n\nAfter President-Elect Castillo was declared the victor, his opponent, Keiko Fujimori, right-wing firebrand and daughter of former President Alberto Fujimori, lead a protest to attempt to overturn the election, leading to a tense standoff in Lima against Castillo's militant supporters. While Fujimori's gambit failed, it is symbolic of the deep divisions in the Andean nation.\n\nThe Peruvian Congress is similarly divided, with no party achieving a majority. Experts predict a coalition opposed to Castillo will most likely control the Legislative Palace. It appears Peru's ongoing political divisions are nowhere near over."
 PRU.news.1.a: "The Pink Wave Floods the Andes"

 PRU.news.2.t: "President Castillo Self-Coups in Peru"
 PRU.news.2.d: "LIMA, Peru (AP) - Peru is in shock today, as President Pedro Castillo has dissolved Congress and taken on emergency powers, declaring he will rule by decree until new elections which will install a 'constitutional congress', to re-write Peru's constitution.\n\nThe move is the culmination of a difficult year for the Castillo Administration, occurring after Congress had filed the third attempted impeachment of the President. It appeared Castillo would battle the allegations legally, but he instead outmaneuvered the Peruvian Opposition. While Congress and the Constitutional Court rejected his actions, the President has clamped down on dissent, and his position now appears to be secured.\n\nMany in the country are shocked that their constitional democracy has seemingly banished overnight. Experts commented that Castillo's success is likely to an appearance of strength and unity. With many members of his cabinet not being seen since his declaration, it is believed the appearance of the administration being united under Castillo's actions lead to various opposition leaders standing down, rather than risking civil war by openly backing the Congress. Rumors abound in the capital about members of his government and cabinet who opposed the move being under home arrest, which the government has denied.\n\nThe future of Peru is uncertain, and governments around the region are scrambling to organize responses to the new order in Peru."
 PRU.news.2.a: "The Andes Get Hotter"

 PRU.news.3.t: "Military Coup in Peru"
 PRU.news.3.d: "LIMA, Peru, (AP) - The situation in Peru has reached yet another turning point, as President Castillo, whom assumed dictatorial control of the country last month, has been overthrown by the Peruvian Army. The military has declared to be acting \"to defend the Peruvian nation and safeguard the constitution\". Military units are still occupying the streets of Lima, with rumors of arrests of anyone connected to the Castillo Administration.\n\nPresident Castillo himself has managed to evade capture. Tipped about the coup just as the Army entered Lima, he was able to escape via aircraft, and landed in Caracas, where he has been granted asylum. Already he has made statements denouncing the coup as being the death of Peru's hope for a better future.\n\nThe situation seems to have finally stabilized, and the Peruvian army now controls the country. What they will do with it is yet to be seen."
 PRU.news.3.a: "Will the Andes Ever Cool Off?"

 PRU.news.6.t: "Pedro Castillo Declares Government in Exile!"
 PRU.news.6.d: "CARACAS, Venezuela, (AP) - Exiled Peruvian President Pedro Castillo made a major announcement today: He refused to recognize the present Peruvian Government as legitimate, and would create a Government-in-Exile in opposition to Lima. This comes on the heels of Alberto Fujimori's return to the Peruvian Presidency after the recent elections organized by the military government. Castillo decried Fujimori as \"A tyrant, seeking to territorize Peru once more\". Castillo's host, the Venezuelan Government, already recognized his government as legitimate.\n\nThis, ironically, means Venezuela is mirroring its own Presidential Crisis from 2019, where the United States recognized opposition leader Juan Guaido as Venezuela's President, except now it is them backing an exiled claimant.\n\nWith chaos spreading across the Americas, and once more a nation with two men who hate each other claiming to be President, one question is being asked in every capital in the continent, from Caracas to Buenos Aires: \"Is Another War Coming?\"."
 PRU.news.6.a: "Dear God, Now There is Two of Them."
