 BRA_imminent_judiciary_intervention_mission_desc: " The Federal Supreme Court has begun deliberating the constitutionality of the emergency measures enacted under Article 136 of the 1988 pact.\n §YJustice Alexandre de Moraes§! has made clear that the scope of military involvement in civilian administration exceeds what the Constitution permits — regardless of the crisis that justified it. The ruling is not a matter of if, but when.\n §YThe government must decide whether to §Grevoke the measures on its own terms§!, or §Rbe forced to§! by the highest court in the nation.§!"

