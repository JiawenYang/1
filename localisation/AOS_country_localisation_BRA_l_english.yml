 BRA.20.t: "Love Triumphs"
 BRA.20.d: "Following one of the most polarized and intense presidential elections in Brazil's recent history, the results of the runoff election were officially confirmed by the Superior Electoral Court, declaring victory for Luís Inácio Lula da Silva of the Workers' Party (PT) and the Brazil for Hope Federation by a narrow margin.\n\nThe announcement immediately sparked a series of spontaneous celebrations across the country. In major cities such as São Paulo, Rio de Janeiro, Salvador, and countless others, supporters took to the streets waving Workers' Party flags and chanting slogans used in the former president's campaign, with cries of \"Lula lá!\" heard in various locations.\nAlong with the celebrations, fireworks lit up the night sky above crowds who were dancing, hugging strangers, and shedding tears of relief and joy, celebrating the return of the hope they had been forced to suppress since Dilma Rousseff's impeachment.\n\nOn the other hand, however, the reactions of supporters of incumbent Jair Messias Bolsonaro and the Brazilian Patriotic Alliance were immediate. In regions where the President remained strong, the mood turned into a mixture of deep disappointment and anger. Many gathered in smaller groups, mostly in bars, shouting in frustration at one another, while some remained in stunned silence.\n\nQuickly, however, the contrast between the two sides became stark, and, with the President's silence, questions about the legitimacy of the results may begin to be made by his base."
 BRA.20.d: "Following one of the most polarized and intense presidential elections in Brazil's recent history, the results of the runoff election were officially confirmed by the Superior Electoral Court, declaring victory for Luís Inácio Lula da Silva of the Workers' Party (PT) and the Brazil for Hope Federation by a narrow margin.\n\nThe announcement immediately sparked a series of spontaneous celebrations across the country. In major cities such as São Paulo, Rio de Janeiro, Salvador, and countless others, supporters took to the streets waving Workers' Party flags and chanting slogans used in the former president's campaign, with cries of \"Lula lá!\" heard in various locations.\nAlong with the celebrations, fireworks lit up the night sky above crowds who were dancing, hugging strangers, and shedding tears of relief and joy, celebrating the return of the hope they had been forced to suppress since Dilma Rousseff's impeachment.\n\nOn the other hand, however, the reactions of supporters of incumbent Jair Messias Bolsonaro and the Brazilian Patriotic Alliance were immediate. In regions where the President remained strong, the mood turned into a mixture of deep disappointment and anger. Many gathered in smaller groups, mostly in bars, shouting in frustration at one another, while some remained in stunned silence.\n\nQuickly, however, the contrast between the two sides became stark, and, with the President's silence, questions about the legitimacy of the results may begin to be made by his base."
 BRA.20.a: "Two Countries form in the same territory."
 BRA.21.t: "Coming To Roost"
 BRA.21.d: "Maintaining such a broad front requires managing a perfect balance between its components, something Lula knows all too well.\n\nNow that the election has been won, every petty local councilman up to party leader has started to believe their help was essential and that victory would have been impossible without them. Consequently, they feel entitled to demand a much larger slice of the pie than they are actually owed.\n\nThe reality is that this eclectic alliance was forged through promises of advantageous positions in the new cabinet, and the support of certain figures truly was instrumental in pushing us across the finish line. On one hand, we must return the favor, or the very weapons that defended us will be aimed at us. On the other hand, we must be cautious about giving up too many seats, risking to taint our orthodoxy and threaten our project for the country.\n\nThe Minister of the Civil House is the one tasked with handling the government's internal deadlocks to ensure it runs like a well-oiled machine - coordinating inter-ministerial actions, liaising with the legislature, and overseeing federal agencies - The president's right hand. This is the most coveted position to fill during cabinet formation, since whoever holds this office has unparalleled freedom to configure the gears of the public sector.\n\nLula stalled for as long as he could. He had promised this position, either vaguely or explicitly, to many people; he understands the symbolic significance of this decision, as well as the political power it guarantees to whichever faction of the government receives it.\n\nThe time for hesitation is over; a name must be written on the dotted line."
 BRA.21.a: "Nominating Carlos Lupi should calm the radicals down."
 BRA.21.b: "We need a reliable figure to ensure stability. Renan Calheiros is that person."
 BRA.21.c: "Adriana Ventura, showing that we are open to new ideas."
 BRA.21.e: "Lets reach across the aisle and nominate Mandetta. For the sake of unity."
 BRA.21.f: "This position is too important to be filled by someone who does not share our ideals. We will not give it up!"
 BRA.22.t: "For Some Silver and Some Gold"
 BRA.22.d: "According to the Annual Budget Law, we must estimate revenues and fix government expenditures for the following year. This is the part Lula has always liked least. Countless meetings with suits he had to pretend to like, all of them with countless graphs and charts he had to pretend to understand.\n\nThis year, the meeting room was particularly crowded. It was to be expected; after all, it was the first time that a large portion of the Broad Front members had caught a glimpse of true federal power, and they were trying to make the most of the opportunity.\n\nAfter a grueling week, our options lie scattered on the table in front of us, awaiting the president-elect's decision."
 BRA.22.a: "Social assistance and labor-focused policies. That is what we promised, and that is what we will deliver!"
 BRA.22.b: "We cannot stretch our resources at a time as delicate as this. A balanced budget is the most prudent course of action!"
 BRA.22.c: "As a sign of resilience, let's embrace a more austere economy and open ourselves up to new opportunities!"
 BRA.23.t: "Go Big or Go Home"
 BRA.23.d: "The Bolsonarist protests have become too big to ignore. Week after week, we tried the tried-and-true strategy of not dignifying these narrow-minded acts with a direct confrontation. Instead, we insisted on proving, time and time again, the security of the electronic voting machines, democratic institutions, and the electoral process - thereby preventing more people from falling for the election loser's coup-mongering narrative.\n\nThe idea was that those protesting in the streets would lose steam and, demoralized, return home to spend the end-of-year holidays with their families. That is not what happened. Instead, we saw the country's main avenues choked with green and yellow on weekends, people camping out in front of military barracks calling for army intervention, sporadic acts of violence, alleged reports of attempted terrorist attacks, and so many other unpredictable episodes widely shared and commented on social media. All of this has been encouraged by the inflammatory speeches Bolsonaro has been promoting on his national tour in a desperate, last-ditch effort to overturn the election results.\n\nSince that is the case, we are going to face them head-on! On Lula's official profiles, as well as on his allies' profiles across every possible social media platform, the exact same video was posted simultaneously:\n\n\"Companheiros and companheiras,\" begins a vertical video of Lula in a casual setting, speaking directly to the camera with dynamic captions - all designed to maximize its reach as much as possible. \"In recent weeks, we have been forced to witness lamentable scenes all across our beloved Brazil. The end-of-year season, which should be a time of unity and renewal, is playing host to shameful displays of defiance against our democracy. The truth is, this mess is being driven by a very small group of people, but they make a lot of noise.\" Following a dramatic pause, Lula narrows his eyes and continues, \"and to this noisy minority, I say...\""
 BRA.23.a: "Be prepared to answer properly for your crimes against democracy!"
 BRA.23.b: "Let's together be the union that our country needs at this moment."
 BRA.24.t: "The Presidential Inauguration"
 BRA.24.d: "Did you?"
 BRA.24.a: "I wonder what you can find on those..."
