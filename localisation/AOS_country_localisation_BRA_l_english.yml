 BRA.49.t: "Sérgio Moro Launches Aliança Brasil Justo"
 BRA.49.d: "Shortly after resigning from his position as Minister of Justice in Jair Messias Bolsonaro's government, the renowned former judge Sérgio Moro announced the creation of a new political movement, which he named the Just Brazil Alliance (ABJ). In a press conference with a hostile tone, Moro declared that corruption had infiltrated the government, stating that the fight against it can no longer be entrusted to traditional parties or movements like the President's.\n\nThe movement positions itself as a centrist-conservative alternative, heavily based on Moro's image as \"the incorruptible judge\" who led Operation Lava Jato. With strong ideological principles, the group's main objectives include a profound reform of the judiciary, rigorous anti-corruption legislation, reduction of bureaucratic privileges and excessive salaries, and greater transparency in public spending.\n\nActing as a potential third alternative to Lula and Bolsonaro, ABJ has been attracting conservative liberal thinkers, disillusioned members of the PSL, anti-PT intellectuals, and segments of the business community. Several men who worked with Moro on Lava Jato, including former prosecutors and jurists, have publicly endorsed the initiative, while in Brasília, the shock was great, with some wishing him luck and respecting Sérgio's decision, while others denounced his political opportunism."
 BRA.49.a: "A Third Way?"
 BRA.50.t: "Mass Floods Hit Rio Grande do Sul"
 BRA.50.d: "In a tragedy already being considered as one of the most catastrophic climate disasters in Brazil's history, the southern Brazilian state of Rio Grande do Sul was hit by intense consecutive rains, resulting in the overflowing of lakes Guaíba, Jacuí, Caí, Taquari, Sinos, and others, submerging entire cities and neighborhoods under water.\n\nThe Lagoa dos Patos, the largest in the state, rose to unprecedented levels, flooding historic centers, the airport in the capital Porto Alegre, entire avenues, and residential neighborhoods. Millions of people were affected, with official reports from local groups reporting hundreds of deaths. With bridges, roads, hospitals, schools, and train lines submerged and destroyed, and with the Brazilian Civil War still ongoing, the response of local authorities was almost impossible, leaving the people to protect themselves and each other."
 BRA.50.a: "Pray for the Brazilian People."
 BRA.51.t: "Brasil Acima de Tudo"
 BRA.51.d: "On the Esplanada dos Ministérios, the sun beats down on the crowd, having little effect on the sea of people gathered to watch the big event that would take place that same day. A vast expanse of green and yellow covers the ground like a river, tens of thousands, even hundreds of thousands of men, women, children, and elderly people are there, watching as the sound of singing and boots hitting the ground intensifies.\n\nFrom the end of the Esplanade, the Armed Forces march in perfect unison. The Civil War was over. Tanks rolled slowly, citizens celebrating those who saved the Nation. Behind them, huge columns of soldiers followed, their expressions ranging from pride to stone cold, rifles on their shoulders, cavalry squads and motorized units carrying the Brazilian flag.\n\nIn an elegant, open vehicle, he stands: Jair Messias Bolsonaro, dressed in a dignified military uniform, his expression stony, looking at the columns of soldiers guarding the march and the crowds watching him, his hands waving to them all.\nUpon seeing him, the crowd watching from afar breaks into thunderous cries and applauses, a deafening joy: \"Captain! Captain! Myth!\" The shouts increase, the crowds in pure euphoria as they wave the country's flags, echoing Jair's name, shouting \"Long live!\" while saluting the mere presence of the man. He does not smile, keeps his gaze fixed ahead, focused on his salute rather than on the love being expressed for him.\n\nAt the end of the march and its trajectory, the vehicle arrived at the Planalto Palace, and Bolsonaro, to the sound of cheers and cries of support, climbs the ramp toward the podium, wasting no time in saying what he has to say. He takes a deep breath, and with a serious, stern expression on his face, declares:"
 BRA.51.a: "\"VIVA O BRASIL!\""
 BRA.52.t: "Return to Normalcy"
 BRA.52.d: "After years of destruction, rampant killing, extremists and terrorists roaming the streets of Brazil, and a veritable bloodbath, the civil war has finally come to an end. The communists, the integralists, the neo-Nazis, and the criminals who plunged the nation into chaos and suffering have been defeated, their remnants scattered and hiding like moths. The Brazilian people, who stood firm against the shattering of the societal fabric and the insurgents, can finally let their guard down and breathe freely.\n\nAcross the entire nation, from north to south, the good people celebrate the end of the greatest nightmare ever faced in the nation's history, one in which the fundamental pillars and values of this glorious country were truly put to test Guided by Jair Messias Bolsonaro and the wise leadership of the Armed Forces, Brazil has been freed from radicalism and the abyss.\n\nNow, a new era of peace and patriotism begins. Law-abiding citizens are free to return to their daily lives. Families, once so under attack, can gather without fear of the next day or of suffering a terrorist attack, while children can play in the streets carefree. The road to reconstruction will be arduous and long, but with the hard work of a resilient people, Brazil will be able to experience a new era, bathed by democracy and patriotism."
 BRA.52.a: "A Nation Saved From Abyss"
 BRA.53.t: "Prosperity Through Freedom"
 BRA.53.d: "The civil war that ravaged Brazil and devastated its people has finally come to an end. The insurgents' last strongholds, demoralized by their crushing defeats, have entered a phase of resistance that will last for some time, but which will eventually be brought to a close by another government victory. The long nightmare of terrorism, ideological extremism, scarcity, and constant fear is over, and Brazil rises victorious, ready to begin the long journey of reconstruction.\n\nThe bloated state, which had perpetuated itself for so many decades, has been completely destroyed and blown to pieces, its remains dismantled and cast into oblivion, the endless bureaucracy, corporate and state corruption, and the ideological machine that drained the nation's wealth and stifled its immense potential have been dismantled, while families, torn apart and traumatized, can reunite, embrace again, laugh, and dream of a better future, without the fear of dying at the hands of deranged extremists or losing someone to war.\n\nThe Beloved Homeland is, at last, free. Free from the Bolsheviks who promised equality but delivered misery, death and destruction. Free from the fascists who offered order but brought only hatred and violence, and free from the trauma and pain that mutilated millions of lifes, that destroyed countless families and that brought only suffering for the dear people of this country. And now, with Brazil secured, Hope, long suppressed by the clouds of death, is returning to the hearts of the Brazilian people, and a new era of economic prosperity and peace can begin."
 BRA.53.a: "Freedom, my sweet, sweet Freedom."
 BRA.54.t: "The Final Salvation"
 BRA.54.d: "As the sun rises brightly in the sky, the long and terrible civil war comes to an end, with the last pockets of resistance from the secularist heretics being extinguished. The Bolsheviks, the fascists, the Nazis, the depraved, and the heretics lie destroyed and humiliated, their banners of hatred torn by the hands of the faithful, and their pathetic leaders dead or captured. At the end of this great period of turmoil, Brazil breathes again; the people can walk the streets without fear and wake up with the certainty of a better future.\n\nIn this hour of liberation, the Lord then raised up His greatest preacher of our time: Jair Messias Bolsonaro. Like Moses guiding the Israelites through the desert, Bolsonaro led the Brazilian people through the Valley of the Shadow of Death. He is the man who spoke the truth when lies dominated everything; he is the man who maintained his courage in the face of those who sought to destroy him; he is the man who, with unshakable faith and courage given by Christ, inspired the military to fight against the forces of evil. Jair was and will be God's instrument, the Captain chosen to defend Brazil when all others would cower.\n\nBut Bolsonaro was only able to do what he did through Jesus Christ, our Lord and Savior. Jesus, the One who suffered scourging, mockery, and death on the Cross for our sins and to guarantee us Eternal Salvation, showed His infinite mercy once again. The guidance of the One who triumphed over death and rose again on the third day was the light in the storm, for His grace gave strength to the weak and courage to the fearful, and without Him there would be no victory, there would be no one to be saved, and much less a Brazil to save.\n\nAnd now, with Jesus Christ at the helm and Jair Bolsonaro as His faithful servant on Earth, the Church and the Brazilian people rejoice in pure and humble celebration, commemorating the annihilation of the demonic forces of Marxism and the perverse ideologies of this land."
 BRA.54.a: "In the Name of The Father, The Son and The Holy Spirit, Amen."
 BRA.55.t: "Blackshirt Victory Event"
 BRA.55.d: ""
 BRA.55.a: "Yay?"
 BRA.56.t: "ABJ Announces Armed Self Defense Brigades"
 BRA.56.d: "In a dramatic escalation of previous events, the Just Brazil Alliance (ABJ), led by Sérgio Moro, officially announced the formation of \"Personal Defense Brigades\" in several states, but with a focus on the state of Paraná. Citing \"growing radicalism, abuse of government power, and threats to constitutional rights,\" the movement declared that its members will no longer depend on legal means or state protection.\n\nAcross the country, hundreds of ABJ members have begun training in the open carrying of weapons and community policing programs. The purchase and carrying of weapons, made more flexible by President Jair Messias Bolsonaro, has increased considerably among supporters of the group, while autonomous training camps have been set up.\n\nIn Brasília, the government condemned the actions as \"vigilantism,\" while ideologically aligned groups praised them, considering them a necessary response to state persecution. Radicalism in the country, regardless of the course the group takes, is becoming increasingly entrenched."
 BRA.56.a: "Without Arms, the population is submitted to the wills of the corrupt."
 BRA.57.t: "VACANT EVENT"
 BRA.57.d: "VACANT EVENT"
 BRA.57.a: "VACANT EVENT"
 BRA.58.t: "Cloak and Dagger"
 BRA.58.d: "This meeting wasn't supposed to happen; it wasn't an official event. Although the President of the Republic and high-ranking army officers were gathered to define the nation's course, there were no flags draped, no ceremonies or decorum. It wasn't taking place at the Alvorada Palace; it was happening in the living room of the four-star general and Minister of Defense, Walter Braga Netto.\n\nSunk into the armchair was Jair Bolsonaro. Netto never let anyone sit in his armchair, but the President was the exception; in this case, he saw no problem with sitting on the sofa directly across from him. Beside him was Reserve General Mário Fernandes. The snacks and sodas on the center table, untouched.\n\n\"So, what is this great idea of yours?\" Bolsonaro asked brusquely. \"Come on, spit it out already, Walter.\" The two generals exchange uneasy glances. Fernandes pulls a few stapled papers from his briefcase and handed them to Netto.\n\n\"Mr. President...\" Walter began, in a tone strangely solemn for a man typically so crude. \"The plan is... well, it's better if you read it yourself.\" Jair positioned his glasses on the tip of his nose to read the document handed to him.\n\nWritten in military codes and abbreviations that Bolsonaro hadn't read in a long time was a detailed plan for the neutralization of the President-elect and Vice President-elect, Supreme Court justices, and ideological opponents. Everything was detailed in a deep operational scheme: the targets' routines, multiple courses of action, contingency plans, necessary equipment, estimated casualties... everything was foreseen and in place. The final objective: to drive the country to the brink of chaos to justify a state of siege.\n\nBolsonaro felt a chill. He knew that in his youth he had dreamed many times of having a document like this in his hands to sign without hesitation. What was different now? \"General Fernandes instructed those boys from the Special Forces, the Kid Pretos. They are all properly positioned and ready to operate. At your word, the plan will be summarily executed.\"\n\nJair felt like he was scolding his younger self \"Have you even considered the extent of the consequences and the repercussions of such a conspiracy? Even IF we are successful-\" The President could almost feel the hemispheres of his brain splitting. \"It might be the only option we have left.\"\n\nBolsonaro threw the papers aside."
 BRA.58.a: "Stand back and stand by. It's not the time yet."
 BRA.58.b: "We shall face our enemies within the four lines of the constitution. The people are on our side."
 BRA.59.t: "The Blackshirt Militia"
 BRA.59.d: "Following the defeat of the Legalist Army, many of the militias that operated within the territory in our favor turned to us, seeking support and permission to operate separately from the Army, while maintaining communication and receiving resources.\n\nAmong these, the most prominent is the \"Jair Messias Legion\", a paramilitary militia that emerged shortly after the Legalist Rebellion began, operating in Bahia, Espírito Santo, and surrounding regions. Inspired by the aesthetics and methods of the early Blackshirts from Italy, the group combines Fascist revolutionary rhetoric with fervent loyalty to President Jair Bolsonaro. Famous for having carried out numerous attacks against military and political authorities within the Rebel Government, sabotaging supply lines, and the harassing of left-wing sympathizers, the group gained traction among radicals.\n\nAccepting them to operate as an independent militia within the Government would grant legitimacy and resources to a powerful and dangerous irregular force, potentially benefiting us in the pacification process of loyalist strongholds, and we could also learn from their guerrilla and intimidation tactics.\n\nHowever, bringing them in and recognizing them as a paramilitary force would put the Government at risk of alienating moderate supporters who see the Legion as nothing more than a Fascistic death squad, as well as establishing a dangerous precedent for the use of extreme, widespread violence against rebel sympathizers, which could potentially spill over to innocent civilians.\n\nUltimately, the decision rests with President Jair Messias Bolsonaro and the High Military Command."
 BRA.59.a: "We don't sympathize with terrorists."
 BRA.59.b: "No mercy will be spared to the rebels."
 BRA_consider: "§YConsider this a teaser for what is to come in the future!§!"
 BRA.60.t: "The Captain's Health Worsens"
 BRA.60.d: "The stress of the civil war has taken its toll, and combined with Jair Bolsonaro's pre-conditions it has led to a sudden deterioration of the president's health. The captain refuses to relent however, wishing to see this conflict to the end. We must wrap this up before his health gets worse."
 BRA.60.a: "The clock is ticking..."
 BRA.61.t: "In The Name of Jesus"
 BRA.61.d: "Those who once marched arrogantly under the banner of socialism now lie shattered across the ravaged fields of Bahia and all those places that dared to rebel alongside them. Their leaders are dead, captured, or hiding like cockroaches from the light. The soldiers of the Antichrist, the ones who supported the petist demon Lula da Silva from the start and who banded together against all that is good in this country, those who mocked God, who sought to replace the Cross with the hammer and sickle, are now in the Lake of Sulfur, forever to burn for their sins against Brazil.\n\nThe Brazilian people are freed from the darkness that threatened to consume the nation, for the Lord heard the prayers of the faithful who never knelt before the abyss, who kept their faith intact in the face of turmoil. Today, truth and love for Christ have prevailed over secularism and hatred of God, as Brazilian families can gather in peace and return to their churches without fear of being attacked by the lunatics.\n\nThis victory was made possible solely by the King of Kings, who took Bolsonaro by the hand and guided him to make the best decisions on taking Brazil back to the warm embrace of Jesus Christ, on the path of light and Christianity, leading the children of this beautiful nation away from socialist and secularist darkness. The God-hating project will be thrown into the trash can, disgraced by history, relegated to the same dust as all other socialist and heretic attempts to erase The Creator from the world are."
 BRA.61.a: "May the name of Jesus be praised."
 BRA.62.t: "The Wiser Ones"
 BRA.62.d: "Father Antônio sat in silence in the small living room of his modest home in a quiet neighborhood of Cuiabá. The late afternoon light streamed in through the window as he reviewed his notes for the sermon he would deliver the following weekend. He looked at the wooden cross hanging on the wall by the entrance to his home, above the door, while catching the faint scent of incense from his recently finished morning prayer.\n\nHe was living a peaceful life, keeping up with his prayers, visiting the sick and refugees in the region, and guiding his congregation through the difficult times the country was still going through.\n\nThat was when his phone suddenly vibrated on the table; he picked it up to see what it was about.\n\nAn unknown number\n\nHe found it strange, but opened the message anyway. The text was direct and respectful, purportedly sent by a high-ranking official in Brasília; he paid attention to a specific part:\n\n\"A change in internal policies has led us to contact you and other priests in your region, as well as in other cities. We have an offer for you.\"\n\nHe reread the message; after all, why would the government invite someone like him to join the administration? He read the message two more times, his heart beating faster than usual. An offer to join the administration in Brasília, a position as an advisor. He set his cell phone aside for a second.\n\nHe looked at the crucifix on the wall, pondering the proposal, even wondering if it could be a scam, but why would it be? How would they have found out his number and where he works just like that, and even if, why would they try to scam him like that? It simply couldn't be, something in his heart made him sure.\n\nHe picked up his cell phone again and began typing a reply to the unknown sender:"
 BRA.62.a: "I am interested, how should I proceed?"
 BRA.63.t: "A New Age of Christianity"
 BRA.63.d: "Catholicism, once Brazil's undisputed spiritual guide, has been steadily losing ground in the hearts of the people. Years of influence from Freemasonry and secularist groups, scandals, and a growing disconnect between the traditional church hierarchy and Brazilians' struggle for a better life have led many to seek a more personal and vibrant expression of faith.\n\nWith the civil war, this trend has only accelerated, and many who were rethinking their approach to Christianity have abandoned the Catholic Church for good, as it fails to provide the direct and energetic connection that millions yearn for in these turbulent times.\n\nIn its place, New Age Evangelism has won the hearts of millions and millions of Brazilians. With its beautiful and passionate preaching, modern and energetic music, emphasis on personal transformation, and direct relationship with Jesus Christ, this model has brought a powerful revival of the Christian faith to the country, quickly taking root in the daily lives of families, workers, and communities throughout the nation.\n\nThe government must recognize this profound change and understand that it is necessary to embrace New Age Evangelism as a central pillar of the Christian Project if it truly intends to spread the message of Christ to the new generation. Whether by integrating the pastors and leaders of this faith into the reconstruction project and the government, or by funding their churches and operations so they can better spread their wisdom, influence, and message to the population."
 BRA.63.a: "A New Christianity for a New Brazil"
 BRA.64.t: "A Tradition of Millennia"
 BRA.64.d: "The magnificent cathedral in Salvador was packed with people, more than the church could hold. The immense crowd spilled out into the square outside, where people gathered under the open sky, many holding rosaries and Bibles, while inside, the priest, at the pulpit, delivered a powerful sermon, his voice echoing through the space with authority and reverence.\n\n\"Brothers and sisters, for two thousand years the Church has preserved the traditions handed down to us by the Apostles. From the Early Christian Era, when the first followers gathered in secret to break bread and pray together, to the writings of the Holy Bible, we have carried this living faith through the centuries. The early Christians faced persecution, violence, and death, but they remained steadfast in Christ's teachings, preferring to DIE rather than disobey Him. We must follow such examples.\"\n\nThe priest's words echoed off every wall, passing through them and reaching the ears of the faithful who remained outside. He went on to speak about the sanctity of marriage, the duty of parents to raise their children in the fear of God, the importance of charity, and how crucial it is to reject the values of the modern age. Everyone present listened with absolute attention, some with tears in their eyes, feeling the weight of their Christian heritage on their shoulders."
 BRA.64.a: "From Early Christianity to Modern Christianity, the traditions remain."
 BRA.65.t: "To End the Schism"
 BRA.65.d: "Christianity has been divided for a very, very long time. After the Great Schism, the once-unified Church split into the Eastern Church, which soon became known as the Orthodox Church, and the Western Church, which soon became known as the Roman Catholic Church. And then came the Protestant Reformation, bringing with it countless more unnecessary fractures and divisions, consequently leading to the rise of other denominations, such as the Anglican Church, all interpreting Scripture in their own way.\n\nToday, in Brazil, the population is particularly divided, with Roman Catholics and Evangelicals vying for the throne to determine which religion will lead Brazil closer to Christ. However, this rapprochement will never happen if we continue to allow foolish divisions to ravage Christianity in our beloved country; therefore, the Schism must end, and the Government must work to unite all Christian denominations under the single and absolute banner of Jesus Christ."
 BRA.65.a: "As hard as it may prove."
 BRA.66.t: "New Form of Protestantism"
 BRA.66.d: "Our victory over the enemies of Jesus Christ was glorious, but the time has come to formulate a new and powerful Thesis, so that decades or centuries from now, when tomorrow's enemies are different from those of today, and perhaps even stronger, Christians may have a solid foundation to defend themselves.\nA New Protestant Thesis that will give them a sword, a shield, and armor to fight against the remaining demons that prowl the world, spreading the word so that believers from all over the world may return to the consoling and comforting arms of Christ.\n\nThe New Thesis calls on believers to recreate a movement similar to that of 1517, to rescue the Christian faith with courage and determination. Furthermore, the Thesis completely rejects the progressive values and agendas that have so deeply infiltrated so many denominations and churches, transforming them into instruments of the devil rather than a Temple of repentance, grace, and redemption.\n\nIt calls for action rooted in Biblical truth, rejecting the replacement of the Gospel with lukewarm programs of political activism, and focusing instead on the transforming power of Christ in the soul of the individual and in society as a whole. Believers and preachers of the thesis also recognize the urgent need for radical change, a departure from traditional institutions, and a path toward a more intentional Church focused on the Evangelistic Mission.\n\nFinally, the NPT proposes a leaner, purer, and more faithful expression of faith, one that places Scripture as the sole and supreme authority above all lords and lands, returning fully to the principles of the Reformation."
 BRA.66.a: "The New Lutheran Experiment"
 BRA.67.t: "Turn on unfinished works?"
