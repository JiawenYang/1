 BRA.78.t: "Salvation At Last"
 BRA.78.d: "After so many years of endless bloodshed, massacres, and suffering for the people, the mighty Armed Forces have finally put an end to the socialist and tyrannical regime of the Legalist Forces. That monstrous regime, made up of the very people who stole Brazil's future, lies in ruins, humiliated. The Great Traitor, the criminal who rigged the elections against Captain Bolsonaro and plunged this country into its current misfortune, was captured after escaping Operation Green and Yellow Dagger and hiding like a rat in various secret locations.\n\nAlong with him, the red vermin such as Fernando Haddad, Ciro Gomes, the traitor Freire Gomes, and other leaders were captured by our beloved and magnificent soldiers. Many of their top commanders and soldiers were killed on the battlefield, and now their legacy will be nothing but their betrayals and attempted conspiracies against the Fatherland. The rest, the traitors, conspirators, and those who dared to harm our beloved Republic, are now prisoners of war, and will soon meet the fate they so richly deserve.\n\nAcross our entire territory, even deep within Bahia and territories dominated by extremists, the good people took to the streets in an outburst of pure and triumphant joy. Everywhere, the beautiful Brazilian flag flutters, fireworks explode in the sky, and the tears of those who lost loved ones to the PT demons mingle with the shouts of joy from Brazilian citizens.\n\nThe Armed Forces and the brave warriors who fought and, even in the face of the misfortune and bestial violence of the red vermin, resisted with everything they had, now stand proud, with honor and dignity, for the parasites who for so long dragged Brazil into misfortune and the mud have been trampled underfoot for the last time."
 BRA.78.a: "Brazil Breathes Fresh Air"
 BRA.79.t: "The Ones Who Carried Us"
 BRA.79.d: "In a solemn ceremony held at the Planalto Palace, five generals who had played key roles throughout the war against the Legalists and the insurgents stood in formation, side by side. Their uniforms were impeccable, medals from countless campaigns glinting as the spotlights shone in them, their faces bearing the weight of all they had endured for Brazil.\n\nOne of them had commanded the soldiers who, with resolute patriotism, won the Battle of Salvador, a decisive victory and blow to the Legalist Army.\nThe others, having served in different theaters of operations, including internal counter-insurgency operations and other major battles, stood proud in their uniforms, as they, in the name of Brazil, suffered, as their eyes revealed.\n\nPresident Bolsonaro was present at the ceremony in person. He approached them, looking them in the eyes as he began to decorate them one by one with the highest military honors, which granted exclusive personal and family benefits.\n\n\"Thank you very much for your service,\" said the President in a low voice, shaking the hand of the third general, whose posture expressed deep patriotism and a genuine, serene happiness as he was personally awarded medals of honor by the person whom he held in the highest spot.\nHowever, as they were being given honorifics that would inspire generations to come, there was a deep sentiment inside their hearts, a latent sense of sadness for those who had given their lives on the battlefield, fought and died for the dream of a better Brazil, the ones who would never receive the recognition they deserved."
 BRA.79.a: "At the end of the ceremony, applause followed."
 BRA.80.t: "The Greatest Patriots"
 BRA.80.d: "The main hall of Fort Caxias, headquarters of the Brazilian Army, was packed with people. High-ranking Army officers on one side, members of the administration on the other, all who were watching as veterans of the war against the Legalists took the stage to receive their honors. Everyone there was aware of the significance of that moment; these were the men who had fought house by house, street by street against the socialist forces, the men who had driven the red demon from the city of Salvador and freed the civilians.\n\nMany had lost their homes, loved ones, comrades-in-arms, and part of their lives in the struggle. They now walked with the eternal scars of their sacrifice in the name of the nation, both in body and mind.\n\nThere President Jair Bolsonaro, Supreme Commander of the Armed Forces, was carrying a small rectangular box containing a specific number of First Class Combat Cross medals, one of the rarest and the most honorable medals reserved exclusively for those who performed acts of bravery and sacrifice on the battlefield. Such was the case for those present.\n\nOne by one, he decorated their chests with the medals, each beautiful, polished to perfection. He looked each one in the eye. Consideration, Gratitude, Respect. Some held their gaze steady and proud, flattered by the president's gesture, while others could not hold back their tears when the weight of all the suffering, loss, and the present recognition finally hit them.\n\nAt the end of the ceremony, when the last man had been decorated and the national anthem was played, the hall filled with applause from all sides."
 BRA.80.a: "Those to whom Brazil owes everything"
 BRA.81.t: "Order, Security, Nationalism"
 BRA.81.d: "Effective today, the government in Brasília has authorized the deployment of the Armed Forces throughout all territories under its control to dismantle the remnants of former insurgent groups and to ensure the safety of the civilian population. The focus of said deployments will be on major cities, smaller urban centers, and critical strategic locations, including highways, ports, airports, railways, and other types of infrastructure.\n\nTo ensure a rapid response to any potential threat that may arise, maintain public order, and deter other types of criminal activities such as robberies, murders, and the distribution of illegal materials, this measure marks a clear shift for Brazil toward a more robust defense of national stability, especially following a period as sensitive as that of the conflict.\n\n\"We need to rid ourselves of the terrible effects of post-military regime demilitarization, which left our nation exposed to radical ideologies and criminal activities that led to the civil war alright? Brazil has experienced life without a military presence, and look where we are now. It didn't work out very well did it?\" said President Jair Bolsonaro after signing the deployment orders.\n\nThis policy will not only protect the Brazilian people and ensure that the sacrifices of the civil war were not in vain, but will also completely uproot ideological subversion, allowing the country to enter a new era of stability and security."
 BRA.81.a: "The Republic Shall Never Fall to Radicalism Again"
 BRA.82.t: "Capitão General"
 BRA.82.d: "Jair Messias Bolsonaro, the greatest Brazilian to ever walk this beloved land. For decades, however, he was merely a low-ranking congressman from Rio de Janeiro, a simple man born into a modest family, mocked by the elite, ignored by the Brazilian people, and ridiculed by the leeches of the state. Year after year, with unbreakable determination, he stood practically alone in Congress, warning of the communist threat and the destruction of our cultural identity that the socialists were slowly bringing about. But the good people of this country, the ones forgotten, listened and saw in him a man who genuinely loved Brazil more than he loved power.\n\nIn 2018, when the people began to recognize him and when he threatened to wrest power from the hands of the corrupt, the entire establishment united against him. The rotten media, the Supreme Federal Court, the universities, and the international press, all accused him of being a fascist, a dictator, and a threat to democracy. And yet he was elected, not because the people wanted a dictator or a fascist, but because they refused to listen to the rotten system and chose Good, chose the Captain, chose the shield of the people.\n\nHis rise to power proved to be a major challenge, however; the System threw everything they had at him; they tried to assassinate him, they bogged him down with constant legal battles, they turned his supposed allies against him, and they waged a brutal and prolonged campaign of lies. And yet, in the midst of all this, he never gave in, and when the forces of globalist Bolshevism united to rig his reelection and tried to destroy Brazil, Bolsonaro stood on the front lines like an iron wall.\n\nBolsonaro is the savior of the Fatherland, the greatest and most magnificent President and Brazilian to ever set foot on our soil, he who crushed the Legalist rebellion, he who crushed the red plague, he who, alone in the midst of the storm, took Brazil by the hand and guided it out of all the chaos and leftist filth. Bolsonaro is the embodiment of the resistance and greatness of this beautiful nation, the embodiment of the will of the good people to fight against what is wrong;"
 BRA.82.a: "Bolsonaro is the Myth made reality."
 BRA.83.t: "The Past In The Future"
 BRA.83.d: "The interior of one of the facilities at the Counterterrorism Center, recently opened in Salvador, glowed under the harsh fluorescent light. The paint on the concrete walls was still partially wet, and the smell of new metal and disinfectant hung in the air. Converted from a gigantic warehouse facility, the site had been completely renovated to accommodate thousands of people following the city's capture.\n\nAn imposing man, the facility's commander, walked alongside a young Army major, one that arrived in Salvador shortly after the last rebel forces in the region surrendered, showing him man his new workplace.\n\n\"This is your new workplace, the future of national security,\" said the colonel, gesturing proudly as he looked at the young man. \"Everything here is new. The interrogation rooms are reinforced, maximum-security wings, isolated blocks for high-value prisoners, and state-of-the-art surveillance technology. It is the pinnacle of counterterrorism in this country.\"\n\nThey passed through heavy steel doors into the main detention area. Long rows of empty cells stretched out, each clean, sterile, untouched by prisoners. \"Legalists, communists, and integralists,\" said the colonel, turning the major's attention back to him. \"All the subversive elements that have been destroying Brazil up to now will be brought to facilities like this one, where they will be interrogated and imprisoned in these cells for the rest of their lives,\" he said, pointing to one of the cells.\n\n\"This facility, as you know, is new, so there are no prisoners yet. But the line is long, and soon the first of them will begin to arrive.\" He paused, looking around."
 BRA.83.a: "To save the nation from extremism."
 BRA.84.t: "What Really Happened"
 BRA.84.d: "The newly opened Brazilian Defense Museum in Brasília was filled with excited visitors, among them a family of three: the mother, the young veteran, and their youngest daughter. They presented their tickets at the entrance, which were free as a tribute to the service rendered by the son and the father, and entered the museum alongside the other visitors.\n\nThe atmosphere was cool, filled with the soft echo of conversations and footsteps on the polished floor.\n\nSoon they entered a long corridor, stretching for several meters before giving way to two other corridors. The walls of this corridor were lined with portraits of the courageous and brave patriots who served during the 1964 military intervention. Some images showed young soldiers mounted on tanks or carrying weapons during the coup; while others depicted soldiers in uniform after the fall of João Goulart's socialist regime.Small plaques beneath each portrait told their stories. Acts of courage, sacrifice, and unwavering loyalty to the Fatherland. Some were as young as the boy, which made him feel proud of himself, almost as if he were just like those in the portraits. The family moved forward slowly, reading every word carefully.\n\nAs they stopped at a specific painting, the mother gently touched her son's arm. Her eyes were shining. A heroic painting depicting Goulart's ousting.\n\"Son, have I ever told you that your grandfather was in the Army back then?\" the mother asked, staring at the painting.\n\nThe young man shook his head. A strong feeling flooded his heart. He remembered his father, who died fighting the socialists in Salvador. A great patriot, the man whose love for the nation had inspired him to join the Army.\n\nReaching the end of the hallway, the boy looked back once more before moving forward; after all, that was his past. He was proud of himself and wondered if his father and grandfather would be of him too."
 BRA.84.a: "With the scars of the present, all shall know about the past."
 BRA.85.t: "Models of Men"
 BRA.85.d: "When Brazil was on the brink of a communist coup in the 1960s and 1970s, a generation of true patriots rose up to defend the Republic against terrorists. Men like Emílio Garrastazu Médici, Artur da Costa e Silva, and Ernesto Geisel understood that the use of force was necessary in the face of subversion and extremism. They made difficult decisions that weak and pathetic men could not even imagine making. Under the leadership of these great men, the homeland was rescued from the red clutches.\n\nOthers, such as the great Colonel Carlos Alberto Brilhante Ustra and General Newton Cruz, were warriors on the front lines against the communist insurgency. When the vulnerable cried out for help, they saved them. They hunted down terrorists, dismantled entire networks and conspiracies, and protected the Brazilian people with their own bodies. These are men who did what had to be done; real men.\n\nNone of them sought popularity, fame, acclaim, or love; they sought only to save Brazil from the rotten hands of extremism. And now, another attempt by the communists to destroy Brazil has been made, and, as in the past, defeated. We must therefore look to these giants as models of what to do in such difficult times, for people like these serve as examples of courage, duty, and sacrifice."
 BRA.85.a: "In hard times, the populace finds solace in strong figures."
 BRA.86.t: "Safeguarding the Populace"
 BRA.86.d: "President Jair Bolsonaro sat at the head of the long table inside the emergency meeting room. He was surrounded by the highest-ranking officers of the Brazilian Armed Forces; the atmosphere inside was tense and urgent. Large maps of specific regions of the country covered the table, marked with red pins indicating concerning pockets of resistance.\n\nAlthough the main insurgent groups had been defeated, small groups of communists, integralists, legalists, and other common criminals continued to be a thorn in the military's side, operating in the shadows and employing hit-and-run tactics, launching ambush attacks against supply convoys, terrorizing rural communities, and spreading widespread fear among the population.\n\nVoices spoke with concern given the persistent threat, for despite the major victories and the destruction of the central command centers, these insurgents were causing significant disruption to reconstruction efforts and the finalization of the fight against the remaining terrorists.\n\nGeneral and Vice President Braga Netto leaned forward with a firm expression, breaking the brief silence:\n\"Mr. President, we have the capability and the resources to put an end to this as soon as possible. You know this is becoming a problem for all of us, both in the Army and in the administration; we just need you to expand the High Command's powers. We won't be able to help you as much as I'd like without that.\"\n\nBolsonaro listened to every word attentively, his gaze sweeping over the faces of the other generals before returning to Netto. He took his time to think, knowing that granting such powers to the High Command would risk them sidelining him sooner or later; however, after a few more moments of reflection, he nodded."
 BRA.86.a: "\"Make it happen\""
 BRA.87.t: "The Wiser Office"
 BRA.87.d: "Since before the civil war, Congress and the judiciary have proven incapable of acting with the speed and resolve that certain moments demand. They are too slow, too bureaucratic, and often paralyzed by internal divisions and the interests of different groups\nWhen the moment of truth arrived, when the nation faced its worst demons, these institutions hesitated. They failed to protect the Brazilian people. Their cowardice and weakness exposed the country to chaos; such bodies were never designed for times of existential danger.\n\nIn stark contrast, the Great President Jair Bolsonaro demonstrated true strength and absolute patriotism. It was Bolsonaro who had the courage to confront the Great Traitor and his socialist machine when the elections were rigged; it was he who inspired the Armed Forces to fight; and it was he who led Brazil through this very dark period. Without his decisive action and unwavering leadership, the country would certainly have succumbed.\n\nThe Presidency of the Republic, under his command, has proven to be the only body capable of acting with clarity, speed, and determination when needed, and therefore its powers must be severely expanded. The Man must be given all the tools necessary to lead the Republic to true greatness, without being hindered by the slow and the cowardly.\n\nSome will cry \"authoritarianism!\" while others will shout \"cult of personality!\" Let them whine, for this is not the issue; a dictatorship or a cult of personality is not what we want. What Brazil wants and needs is to ensure that the Nation has a hand capable of guiding it through times of health and sickness, of crisis and reconstruction."
 BRA.87.a: "And it just so happens that this hand is Bolsonaro."
