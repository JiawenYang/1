 BRA.67.a: "I want to see the horrors beyond my comprehension."
 BRA.67.b: "I have seen enough."
 BRA.68.t: "Can I?"
 BRA.68.d: "On Sunday night, the church was packed. Believers from all corners of the city had come to attend and hear the sermon by the famous Pastor Júnior Trovão, who had built his reputation on his passionate and bold sermons during the Civil War, rekindling the flame of Christianity in many who had long since lost it. Júnior took the stage, holding a microphone in his hand, his expression serious and resolute.\nWith a voice full of energy, authority, and firmness, he began to speak:\n\n\"Pastor Júnior, can I give glory to God here and curse at home? Yes, you can!\"\n\"Can I come here with a bun, Pastor Júnior, wear a floor-length skirt here in church, and then wear a short skirt like Anitta's outside the church during the day? Yes, you can!\"\n\"Can I take Holy Communion and then have a beer afterward? Yes, you can!\"\n\"Can I have my wife at home and a mistress on the side without the pastor knowing? Yes, you can!\"\n\"Can I, Pastor... have three men, four men? Yes, you can!\"\n\"Can I curse? Yes, you can!\"\n\nHe paused briefly, triumphantly, taking a breath as the audience and church members leaned forward, attentive and eager to hear what he had to say, after all it wasn't in the plans for him to speak this. He continued, his voice even more triumphant and powerful.\n\n\"The only thing you won't be able to hear is the sound of the Last Trumpet!\" Upon hearing Pastor Júnior's thunderous voice utter these words, the crowd of faithful erupted in applause and euphoric shouts of \"Amen!\", \"Glory to God!\", and other chants, while Júnior Trovão watched and celebrated alongside his brothers in the congregation."
 BRA.68.a: "Glory to Jesus Christ!"
 BRA.69.t: "Congress Ratifies State of Defense"
 BRA.69.d: "Congratulations, Mr. President. Congress has just ratified the state of defense. 353 votes —— a landslide! The army is already on the way to set up emergency field hospitals for areas in need of the direst help. Namely, the states of Amazonas, Sao Paulo, Rio de Janeiro and Para - That's where the constitutional measure has been applied to for now. A report has just reached me from a small children's hospital in the periphery of Manaus, which had only a few hours of oxygen supply left, have you seen it? The Air Force organized a lightning-fast delivery, landing one of our Black Hawks on a nearby football field. I'm sending the video... Straight out of Hollywood, unbelievable!\n\nAnyways, I've just gotten out of a talk with the Secretary of Health over here at São Paulo, Jean, and he says some private healthcare doctors are worried about the ability of the folks at the army to do their job - You know - You don't treat a flu like a bullet wound -, so they want to relegate them to nursing roles only. He's a lot more collaborative now at least, Doria too. Regardless, Mr. President, help is much appreciated over here. And from what I've heard, so is it in the rest of the country.\n\nOf course Lula and his gang has already gone about turning this whole ordeal into an opportunity to get their corrupt hands on power again. A few days ago the complaint was that we wouldn't do anything about the crisis, now when we take measures, \"he's a dictator\"! I've just received a video, people at SUS in Para are organizing a strike! They get paid with our money! It's outrageous, really, how blatant their lies are.\n\nListen, we know this is a challenging time, but, Mr. Bolsonaro, don't worry; Christ, democracy, myself, and most importantly the Brazilian people are on your side, just wanted to reinforce this. We will make it!"
 BRA.69.a: "Close Audio"
 BRA.70.t: "Covid State of Defense Lifted."
 BRA.70.d: "Bolsonaro has finished reading the latest reports by the Ministry of Health brought by the respective minister. [BRA_get_current_health_minister_name] asks bolsonaro if he can give him a second opinion.\n \"Mr. President, the situation is stabilised, I cannot lie to Congress or to the media that I think the martial law still needs to be upheld, it's objectives have been fulfilled. Additionally, it's slowly becoming a burden for all. It's better it's lifted the next time you are free enough to do it.\"\n\"Minister, I believe you have made a good point. I will think about your statement.\"\nAnd Bolsonaro spent time evaluating his choices.\nFinally, he reached the following synthesis: [BRA_get_current_health_minister_name] is right, the Martial Law has proved itself enough. Congress is pissed each day it is up because it's a reason to distrust me and his policies won't be approved. Among my people, even my close politicians, there is a concern that this is just a coup clause. The STF will get into this eventually and that might just create more problems in getting things done in my government.\nIt was tough to start, it was tough during it and it will be tough to end it.\n\nYesterday, Bolsonaro appeared on live TV for a scheduled televised announcement for all in the nation to watch. In it, he told everyone listening that the Martial Law has been lifted and has praised himself and the army professionals for the effective job of handling Covid from spreading and worsening the conditions in the country. He also complimented the population in general for being compliant while it was active.\n\n\"I have concluded a step in my presidency I wish to mimic throughout it whole. In my activities under the Martial Law, I have saved the country, prevented deaths and proved that I am competent to protect and represent the Brazilian people.\""
 BRA.70.a: "A reason to celebrate, né?"
 BRA.70.a.tt: "\n§GThe militarist faction has proven itself as a legitimate force to mediate political and social crises...§!"
 BRA.71.t: "Supreme Court Overturns State of Defense"
 BRA.71.d: "A long awaited statement from the supreme court has just come out regarding the State of Defense enacted under the COVID-19 crisis. The document, whose drafting was led by justice Alexandre de Moraes, states that the continued renewals of the emergency measures defined in article 136 constituted an \"Effective transfer of executive and administrative authority to the Armed Forces - something no health crisis could constitutionally justify\" While most opposition movements portray this as a win for Brazil's democratic system, allies of the incumbent president cite it as an example of dangerous judiciary overreach.\n\nIn Brasília, Bolsonaro recently held a rally with his followers, where he stated: \"Once again, the Supreme Court under DICTATOR Alexandre de Moraes, joined by its corrupt allies have denied the voice of the people. Eleven UNELECTED judges overriding the principle of our constitution, that's what is happening - what this guy has done is a CRIME!\". Bolsonarist circles are already organizing a \"march of liberty\" through major cities and military bases to honor the army's role in alleviating the health crisis, as well as protest the alleged injustice portrayed against the body.\n\nA recent 40 minute long report by UOL shows the reaction to the decision in the barracks. While most soldiers and senior officers, exhausted by months of continued operation in field hospitals, expressed satisfaction over the end of the State of Defense, the video's most remarkable moment was the reaction of a group of sergeants, who were secretly captured expressing the plausibility of defiance to the decision. One of them, visibly outraged, stated: \"We have been working tirelessly to protect the people, and now our efforts are being disrespected by a bunch of sons of bitches! Those communists of the STF will not turn our country red!\". The government has yet to issue a statement on the incident."
 BRA.71.a: "The will of 57 million, ignored..."
 BRA.71.a.tt: "\n§ROur officers will not forget this act of humiliation...§!"
 BRA.72.t: "The Ideologue"
 BRA.72.d: "Olavo de Carvalho, one of the greatest philosophers and intellectuals Brazil has ever produced. Born in 1947 in Campinas, he rose from humble beginnings through sheer intelligence, determination, and tireless study. Self-taught in various languages and disciplines, he mastered fields such as philosophy, astrology, theology, and political theory with such depth that few scholars in the world could match him. He lived many lives in one; he was a journalist and astrologer in his youth and became a staunch critic of woke ideology and the modern world in his later decades.\n\nExiled in the United States for many years, he influenced Brazilian thought from afar through his books, lectures, and online teaching. He had a sharp, uncompromising, and original mind like no other, disappearing from public life and the internet after the start of the Second American Civil War.\n\nHowever, his thinking remains in our lands and has become a powerful tool for identifying the dirty and perverse strategies of the communists. Olavo warned incessantly about the Cultural War, showing that the vermin of the left had abandoned the former respectful ideological battlefields and began to aim for the domination and destruction of culture, education, the family, and language. He exposed globalist socialism as the Satanic project for the destruction of the nation and of Christianity that it is.\n\nToday, his legacy will be honored as it deserves. The process of integrating and consolidating the ideas of Olavo de Carvalho as the intellectual and moral guide for Brazil has begun, so that his writings may be studied in schools and institutions, so that the dangers of cultural Marxism may be dismantled once and for all, and so that, finally, Christianity may be firmly rooted at the center of society, governance, and culture in our beloved homeland."
 BRA.72.a: "May his soul rest in the warm embrace of God"
 BRA.73.t: "The Fate of the Vermin"
 BRA.73.d: "The satanic-secularist forces of Bolshevism, fascism, and all other atheistic ideologies have been destroyed on the battlefield and will face the righteous wrath of our Lord. Their reign of terror and destruction has come to an end. The despicable leaders who spread this poison throughout our beloved Homeland will be cast into the deepest catacombs, sealed away and forgotten forever by the people they sought to enslave. As for their followers, those who willingly served the darkness, they will receive the divine punishment of Jesus Christ, so that no mercy may be shown to those who raised their hands against God.\n\nBolshevism, a plague that murdered millions of Christians in the name of an ungodly state. They destroyed churches, massacred and desecrated priests and nuns, and committed genocide against the Orthodox Church in the name of Marxism. In Berlin, in 1945, and throughout the war and afterward, its servants committed unspeakable atrocities against the innocent, desecrating citizens who had nothing to do with Nazism. The same evil took shape in Brazil through Legalism and Maoism, but by the grace of the Lord, the red beast had its throat cut for the last time.\n\nIntegralism is nothing better. The power of the Antichrist disguised as patriotism, directly linked to the Mussolinist heresy that placed the State above the Almighty. Mussolini, a worm who hated God and persecuted the faithful, is the idol of the integralists. All in this Holy Land who have embraced integralism and the heretical ideologies derived from fascism will suffer the same fate as the bald vermin, to be eternally remembered as traitors who tried to replace the Cross with man.\n\nNothing, then, remains to be said by the legalists, the demons on Earth. They served the red dragon and sought to drag Brazil back into the abyss. Yet they failed, and the final wrath of Jesus Christ and His archangels fell upon them, crushing, trampling, and casting the demon into the Lions' Den to suffer eternal torment."
 BRA.73.a: "So that no heretic may go unpunished."
 BRA.74.t: "The Greatest Mistake"
 BRA.74.d: "When the Republic was proclaimed in 1889, one of its first and most celebrated acts was the establishment of a secular state. Politicians and intellectuals of the time hailed it as a monumental step toward progress and modernity, declaring that the separation of church and state would bring equality, freedom, and justice to all Brazilians, and that different religions could finally live together in harmony, without the shadow of Christianity dominating public life.\n\nFor generations thereafter, this separation was taught as one of the greatest achievements in Brazilian history, an example of how tolerance and the inclusion of other religions would allow the nation to advance toward a bright and just future.\n\nLook where we are now.\n\nThe Secular State was the greatest mistake and the deepest wound ever inflicted on the soul of Brazil, a true slap in the face of Christianity, driven by heretics and members of Freemasonry who sought to weaken the Church and remove God from this beautiful nation. The doors to moral decay, cultural subversion, and the slow infiltration of heretical ideologies were opened by the Secular State. The Civil War, caused by socialist demons, is one of the many rotten fruits of that same Secular State that has brought so much misfortune upon this nation.\n\nThis grave error must be corrected now. Secularism must be abolished, destroyed, and erased from the people's memory. The wall between Church and State must be torn down just as the Berlin Wall was, so that the sacred relationship between the two may be restored and intertwined once more, for only then can Brazil return to its divine destiny as the Country of the Future, the Country of God."
 BRA.74.a: "The mistakes from the past are the corrections of the future."
