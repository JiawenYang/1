 BRA_old_man_new_mask: "Old Man, New Mask"
 BRA_old_man_new_mask_desc: "It's clear to Bolsonaro and all of those with nostalgia from the 60s, 70s and 80s: the modern Republic is a failure and its constitution is mess that is constantly used not to defend the people but to exploit them and enrich the bandits in suits behind desks constantly disagreeing for nothing. Instead, we should look for the last Republic, the Civic-Military Regime that brought us economic prosperity and TRUE patriotism for the country as a compass to rearrenge a regime that would never spit on its people."
 BRA_immaculatus_res_publica: "Immaculatus Res Publica"
 BRA_immaculatus_res_publica_desc: "The Republic elected Bolsonaro when it most needed, so, why did it also betray him? Simple: §Rcorruption.§! The corrupt bastards of the PT are KNOWN for their constant controversies on missing budget money and unknown sources of money in their politicians. Diniz, Mensalão, Dirceu, heck, Lava-Jato! Those rats have dominated the apparatus since 2002 and they are here to dominate it again. We cannot allow that to happen again, either by them or someone else, §Bever.§! And to stop that, we must be §Ytough§! against crime, and that could only happen with §Ga new legislation, a new CONSTITUTION, A NEW REPUBLIC§! that does just that."
