 BRA.143.t: "Beautiful, Green Horizon"
 BRA.143.d: "From the gray sky, rain fell incessantly over the cemetery on the outskirts of São Paulo, turning the paths into muddy trails and soaking the flowers left on the countless graves. \n\nA woman in a black coat walked slowly alongside her teenage son; the umbrella, held by her tall, strong son, shielded only his mother from the downpour. The boy kept his eyes fixed ahead, his expression serious and stern. They passed rows of white crosses and headstones until they reached a specific grave near a small tree. \n\nThe woman stopped, clutching her son's arm as fresh tears streamed down her cheeks. The grave was simple but well-tended, marked by a stone bearing a man's name and the words \"Hero of the Fatherland\" engraved below it. \n\nThe boy stared at it in silence as rain dripped from his hair to his feet. His father was a true hero, a brave soldier who fought on various battlefronts throughout the civil war. He faced Bolsheviks, Integralists, neo-Nazis, and criminals, always standing firm for the dream that one day Brazil would be a better country. \n\nIn the end, his dream led to his sacrifice. When his platoon was surrounded by a communist militia during a nighttime attack, he and his comrades decided to gather all the explosives from their camp and detonate them, taking as many enemies with them as possible. \nThe event was one of the last of the civil war, and the brave soldiers, including his father, were posthumously awarded a medal of honor by the President himself. \n\nHis mother let go of the boy's arm and knelt in front of the grave, ignoring the rain that had begun to fall on her. She touched the wet stone with trembling fingers as sobs escaped her lips, but the boy did not follow her; he remained standing, holding the umbrella uselessly as he stared intently at the grave. His chest burned, burned with hatred, with a deep and incomparable fury. \n\nHe looked at the name engraved there and promised himself that he would avenge him, that he would grow up to become strong, to carry on his father's legacy, and to stomp out every single one of the bolshevik pests if they ever dared to return. Before leaving, he looked at the grave one last time, turned around, and, shielding his mother from the rain, began to walk away."
 BRA.143.a: "A Patriot, the Greatest the Republic could have ever asked"
