 # Decision Categories
 BRA_amazonian_jungle_category: "The Amazonian Jungle"
 BRA_amazonian_jungle_category_desc: "\n\n\n\n\n£GFX_BRA_amazon_burning\n\n\n\n\n\n\n\nEvery year, the Amazonian jungle burns. While the political desire to preserve it is there, in reality the illegal nature of these operations, lack of infrastructure and ease of access, and the sheer size of the Amazonian jungle make it difficult to enforce. On the other hand, many sectors of Brazilian society such as §Yagribusiness§! and §Ymining§! have no interest in preserving the jungle and would rather see it devastated in favor of expanding their operations.\n\nIn order to preserve our jungles, we'll need to choose our developments carefully, enact strong reforms on our methods and crack down harder on illegal slash-and-burning. §GOur goal should be to maintain at least over 80% of the jungle preserved§!.\n\n§RScientists have warned that if the total amount of preserved jungle were to fall under 70%, we risk crossing a point of no return. Should the Amazonian jungle collapse, the consequences could be disastrous for ourselves and our neighbors, and the international community might not be willing to sit idly by and let it happen.§!\n\n\nREMANING AREA OF THE AMAZONIAN JUNGLE: [?global.BRA_amazonian_preservation_var|.2%%G]\n\nMONTHLY CHANGE: [?modifier@amazonian_preservation_monthly|.2%%+]\n\n"
 BRA_congress_category: "The Brazilian Congress"
 BRA_congress_category_desc: "\n\n\n\n\n£GFX_BRA_chamber_of_deputies\n\n\n\n\n\n\n\nThe Brazilian Congress is the main stage of the nation's democracy. It is where the elected officials of the two chambers vote on propositions such as Law Projects (PLs) or Constitutional Ammendmends (PECs). Be it left, right or center, any sort of proposal for the nation will require a majority in congress for it to pass.\n\nThe Congress finds itself divided into §Y5 wings§!, with each of them having their own interests and dispositions towards our government. The influence of each wing can be gauged by the §Ynumber of seats§! it currently holds, while their §Ysupport§! translates to how many of their seats will actually back our government's projects. In order to advance our policy, we'll need to §Craise our support§! in the larger wings, as well as §Cshift seats§! away from opposing wings and towards more supportive ones.\n\n§YCurrently, we have the combined support of [?BRA_congress_total_support_seats_var|0] seats in congress.§!\n\n§d---- LEFT-WING ([?BRA_congress_far_left_seats_var]) ----§!\n§YSupport: [?BRA_congress_far_left_support_var|2%Y] ([?BRA_congress_far_left_support_seats_var])§!\nThe small far-left wing of congress are composed of radical socialist and communist parliamentarians who denounce capitalism as the root of most issues in society and advocate - at least in theory - for its abolition.\n\n§t---- MODERATE-LEFT ([?BRA_congress_left_seats_var]) ----§!\n§YSupport: [?BRA_congress_left_support_var|2%Y] ([?BRA_congress_left_support_seats_var])§!\nEven after the downfall of PT, the moderate left wing of congress has managed to maintain a sizable influence in the legislative. It is composed of parliamentarians that believe in social and economic justice primarily through reform.\n\n§O---- CENTER ([?BRA_congress_center_seats_var]) ----§!\n§YSupport: [?BRA_congress_center_support_var|2%Y] ([?BRA_congress_center_support_seats_var])§!\nThe \"Centrão\" has been an ever-present force in Brazilian politics, and they are no different under this administration. Self-centered, they will not stick their neck out for anything besides their position in government, but may be swayed to support most policies if it can be made worth their while.\n\n§4---- MODERATE-RIGHT ([?BRA_congress_right_seats_var]) ----§!\n§YSupport: [?BRA_congress_right_support_var|2%Y] ([?BRA_congress_right_support_seats_var])§!\nThe moderate right wing of Brazil gained significant influence after the impeachment of Dilma Rousseff in 2016 and the election of Jair Bolsonaro in 2018. They push for the reduction of the state apparatus, economic austerity and socially conservative policies.\n\n§P---- RIGHT-WING ([?BRA_congress_far_right_seats_var]) ----§!\n§YSupport: [?BRA_congress_far_right_support_var|2%Y] ([?BRA_congress_far_right_support_seats_var])§!\nBrazil's far-right ranges from reactionary conservatives to hardline evangelicals and even integralist sympathizers at the fringes. They have made their agenda to dismantle so-called \"progressive\" policies and return the country to what they deem \"traditional values\"."
 BRA_coronavirus_category: "COVID-19 Outbreak in Brazil"
 BRA_2022_elections_category: "The 2022 Presidential Elections"
 BRA_2022_elections_category_desc: "\n\n\n\n\n£GFX_BRA_electronic_voting_booth\n\n\n\n\n\n\n\nThe upcoming §Y2022 Brazilian General Elections§! are on track to be the nation's most divisive one yet. On one side, the old guard of the progressive social democrats seeks to regain the ground lost since the 2016 impeachment of Dilma Rousseff, united under the §pFederation For a Brazil of Hope (FBE)§!.\n\nOn the other side, the hardline right-wing seek to maintain their momentum and consolidate the campaign started by Jair Bolsonaro, under the §7Brazilian Patriotic Alliance (APB)§!.\n\nAnd in the sidelines, liberals, conservatives and laborists cling into any ounce of relevance under their own federations. For them, this election could be their last shot at being in the helm of the country.\n\n§C---- CURRENT ELECTION POLLS ----§!\n\n[BRA_get_2022_elections_polling]\n\n[BRA_get_2022_elections_polling_others]"
 BRA_ABIN_category: "ABIN Reports on Radical Factions"
 BRA_internal_factions_category: "The Political Musical Chairs"
 BRA_internal_factions_category_desc: "Comprised of different fronts and factions, they are unified in what would be, in another time, be viewed as an uncommon alliance, sharing the same purpose from the beginning: to end §RThe Degenerator of Nations§!. Setting aside petty ideological squabbles that would lead them nowhere, the coalition is held together by the sole and singular objective of finally §Yending the regime of those who stole almost two decades of progress from Brazil and who fraudulently tried to return to power.§!\n\nAll factions are ultimately subordinate to the one §GCaptain in Command§!, whose decisions shall shape their £pol_power §Cinfluence§! in the National Government and ultimately, §Ythe path that our Nation will follow.§!\n\n§n£GFX_BRA_FCUB_logo  UNITED CHRISTIAN FOR BRAZIL FRONT (FCUB)§! - [?BRA_factions_olavist_influence_var|2%C]\n    £stability_texticon [?BRA_factions_stab_dyn_var|+2%]  £population_texticon [?BRA_factions_pop_dyn_var|+2%]  £GFX_dx_yellow [?BRA_factions_personal_dyn_var|+2%]\nA coalition of different Christian groups, including two major branches: Evangelical Protestants and Roman Catholics. Advocating for a return to Christian traditions and morality, while also promoting the end of the Secular State and a state governed by the rule of a leader chosen by Christ and those faithful to His word.\n\n§G£GFX_BRA_FRP_logo  HOMELAND RESTORATION FRONT (FRP)§! - [?BRA_factions_military_influence_var|2%C]\n    £war_support_texticon [?BRA_factions_war_dyn_var|+2%]  £manpower_texticon [?BRA_factions_conscription_dyn_var|+2%]  £command_power_texticon [?BRA_factions_cp_dyn_var|+2%]\nA coalition composed of those who love the country of Brazil and put their lives on the line for it, the Patriots. Advocating for a return to Order and National Pride, the front supports and defends the destruction of leftism, subversive movements, and those who try to stain Brazil, while also promoting national security, State Capitalism and better recognition of the Armed Forces.\n\n§P£GFX_BRA_FFB_logo  BRAZILIAN FAMILY'S FRONT (FFB)§! - [?BRA_factions_bolsonarist_influence_var|2%C]\n    £pol_power [?BRA_factions_pp_dyn_var|+2%]  £compliance_gain_texticon [?BRA_factions_compliance_dyn_var|+2%]  £GFX_development [?BRA_factions_society_dyn_var|+2%]\nAn alliance of conservatives and Bolsonaro supporters committed to the advancement and progress of Brazil, utilising the faith of the Brazilian people to promote anti-abortion and pro-gun reforms, policies that contribute to the return of traditional values, family, and patriotism, while also defending capitalist values.\n\n§O£GFX_BRA_FLP_logo  LIBERTY AND PROSPERITY FRONT (FLP)§! - [?BRA_factions_libertarian_influence_var|2%C]\n    £GFX_dx_yellow [?BRA_factions_business_dyn_var|+2%]  £construction_speed_texticon [?BRA_factions_construction_dyn_var|+2%]  £GFX_percent [?BRA_factions_interest_dyn_var|-2%]\nA group of liberals and freedom lovers, they advocate for market capitalism, radical economic reforms that promote the market and free trade, and drastic cuts in taxes and levies, while at the same time promoting traditionalist social policies, rejecting progressivism and other forms of moral and social regression."

