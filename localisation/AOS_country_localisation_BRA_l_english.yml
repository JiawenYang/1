 BRA.25.t: "2022 Elections Approaching"
 BRA.25.d: "The imprisonment of Luís Inácio Lula da Silva, the victory of Jair Messias Bolsonaro and the Social Liberal Party in the 2018 presidential elections, and the imprisonment of numerous other members of the Workers' Party led many to wonder if the era of Lula and the Petistas was over. However, after the Three Great Crises, the constant media attacks against Jair, and controversial measures among sectors of the population, the President finds himself with weakened and decreasing support, no longer enjoying the massive support he had years ago.\n\nWith the release of Luís Inácio Lula da Silva from prison, decided by Supreme Court Justice Edson Fachin, and enjoying support from the media and his crystallised support region - the Northeast - the former President finds himself in a position of growing popularity, not an easy one, as his status of former inmate and populist policies are used constantly by other candidates, such as the President himself.\n\nNothing promises to be easy for either candidate, and while they prepare their campaigns, the population is adjusting to what is being discussed as the most important elections since the redemocratization."
 BRA.25.a: "It will sure be one to remember!"
 BRA.26.t: "2022 Elections Begin"
 BRA.26.d: "In what is widely regarded as the most polarized election with the most far-reaching consequences in Brazil's history, the 2022 general elections are underway. Years of deepening crises already present in Brazilian society,such as high crime rates, along with the profound impacts caused by the Second American Civil War and the Three Great Crises, have led the country's population to grow increasingly distant from one another, and prone to violence and extreme ideological polarization within its society.\n\nThe presidential race is dominated by two sides. Jair Messias Bolsonaro, the incumbent President of the Republic and known for his populist rhetoric similar to that of Donald Trump, leads the Brazilian Patriotic Alliance (APB), a coalition of various right-wing and far-right parties that unites conservatives, evangelicals, the rural caucus, and, in general, advocates of strict security policies and nationalists.\n\nIn direct opposition is Luiz Inácio Lula da Silva, the controversial former President of the Republic, who served two terms before appointing a successor and being arrested on corruption charges in 2018 as part of Operation Car Wash. Leading the Brazil of Hope Federation (FBE), the Workers' Party candidate enjoys a broad progressive coalition that encompasses moderate leftists, labor unions, social movements, and more radical factions.\n\nOther coalitions, such as the United Popular Labor Front, are also vying for the presidency, and with high hopes and longtime figures from the Workers' Party at his side, Ciro Gomes represents the most radical wing of the left. As the sun rises and the election campaigns begin, the Brazilian people are waking up to a period more tense than the last."
 BRA.26.a: "The legend deserves a second term!"
 BRA.26.b: "Jair must be stopped at all costs."
 BRA.27.t: "The Results of the First Round"
 BRA.27.d: "The Aliança Patriótica Brasileira erupted in triumph. Bolsonaro had not won outright, but to them, [?BRA_election_polling_bolso_var|2%%] was proof that the people stood firmly with God, family, and homeland. The narrative was simple: the majority of Brazilians had rejected the lies of the left and the noise of the so-called moderates. For the APB, this was validation that Bolsonaro remained the nation's captain, the only one strong enough to face down the \"corrupt progressives\" in the second round.\n\nFor Lula and the Federação por um Brasil de Esperança, the mood was bittersweet. They had secured their place in the runoff, yet [?BRA_election_polling_lula_var|2%%] felt like a reminder of how deep the wounds of Brazil truly ran. Still, they framed it as hope: the fight was not over, and fascism could still be defeated through unity, compassion, and perseverance. To them, this was not just an electoral battle but the continuation of a historic struggle for democracy and dignity.\n\nIn the Frente Popular Trabalhista Unida, Ciro Gomes's [?BRA_election_polling_ciro_var|2%%] was hailed as proof that the working class and true progressives still had a voice. They had been written off, dismissed as marginal, but now they stood as the third force of Brazil. Within the ADPL, Simone Tebet's [?BRA_election_polling_tebet_var|2%%] was spun as a seed of moderation that could yet grow; while in the UOPB, Soraya Thronicke's [?BRA_election_polling_soraya_var|2%%] was cast as a first step in reclaiming conservatism from populism. For Amoêdo and the MRF, the [?BRA_election_polling_amoedo_var|2%%] was no surprise, but it was a marker that integrity still had at least a corner in Brazilian politics."
 BRA.27.a: "The first round is not the end; it is the mirror of a divided nation."
 BRA.28.t: "The Results of the Second Round"
 BRA.28.d: "The Aliança Patriótica Brasileira could not believe it. Bolsonaro had led the first round with ease; he had the momentum, the people in the streets, the flag on every corner, and yet, somehow, the numbers betrayed him. To them, it was clear: fraud, manipulation, sabotage. \"How can a man of the people, supported by God Himself, lose to corrupt elites and communists?\" they asked. In their eyes, this wasn't a defeat at the ballot box; it was a theft of Brazil's destiny.\n\nFor the Frente Brasil de Esperança and its allies, the result was nothing short of a miracle forged by compromise. Lula, once again, had returned from the abyss, carrying with him not only the hopes of progressives but also the reluctant hands of centrists, radicals, and even conservatives. They knew the government ahead would be turbulent, with debts to pay and factions to appease, but that didn't matter in this moment. They had stopped authoritarianism at the ballot box.\n\nThe Frente Popular Trabalhista e Unida and the other allied forces treated the result with grim satisfaction. For them, it wasn't about Lula, nor about the FBE; it was about striking down Bolsonaro, the greater evil. They had compromised their values for this, and they knew the contradictions in the coalition would soon show. But at least, for now, the future remained open. \"Better to fight a weak moderate in power,\" they thought, \"than to survive under a strong fascist.\""
 BRA.28.a: "Victory is never pure; it is stitched together with contradictions."
 BRA.29.t: "Bolsonarists Take Up To The Streets"
 BRA.29.d: "In various urban centers across Brazil and dozens of other cities, Bolsonaro supporters and members of the Brazilian Patriotic Alliance took to the streets in large numbers following the official announcement by the Superior Electoral Court (TSE) confirming the victory of Luiz Inácio Lula da Silva and the FBE in the second round of the presidential election. Beginning as spontaneous gatherings in areas with the strongest support for the President and in urban centers, the demonstrations quickly spread to nearly the entire country, covering it in a veritable sea of green and yellow flags.\n\nIn the city of São Paulo, known for its political demonstrations, Paulista Avenue filled up at an unexpected pace, with citizens carrying Brazilian flags and holding signs bearing various messages, some in support of Bolsonaro, and others accusing Lula of being a \"corrupt thief\" and claiming the elections had been rigged to secure the Petista's victory. In the capital, Brasília, crowds gathered around the Brazilian Army headquarters, demanding military intervention and the annulment of the elections.\n\nIn various places, reports of violence emerged on social media and in newspapers, describing the situation as \"unprecedented\"; videos showed civilians blocking entire highways using trucks, barricades, or burning tires, while others showed stones being thrown at opponents and at the homes of locally known supporters of President-elect Lula.\n\nAmid accusations of widespread irregularities with the urnas, last-minute spikes in votes in the Northeast region, and general distrust towards the TSE, Bolsonaro himself has so far refused to accept defeat, calling for calm so that \"the facts can be examined.\"  Lula and the FBE called for peace, arguing that the actions committed by the Bolsonarists \"go against democratic institutions\" and that the election results were \"clean, without fraud.\""
 BRA.29.a: "The Country Drowns In Itself"
 BRA.30.t: "The Green and Yellow Dagger"
 BRA.30.d: "The Moon light cast a faint illumination across the vast lands that comprised Brazil's capital, but in the Palácio do Planalto, the President's residence, Jair Messias Bolsonaro was awake. The lights in his office were dim; the glow of three different screens was one of the only things he could see. His tie was loose, sleeves rolled up, and his eyes were fixed on the screen, without blinking once. His brow was sweaty as he stared at the CNN Breaking News headline:\n\n\"BREAKING NEWS: MILITARY MOVEMENTS, LUÍS INÁCIO LULA DA SILVA AND ALEXANDRE DE MORAES MISSING, GERALDO ALCKMIN ASSASSINATED.\"\n\nHe didn't move, the TV remote in his hands, his thumb frozen on the off button. On the other two screens, two other channels broadcast the same news, reporters from Globo and SBT with expressions of shock and despair as they reported the news that would change Brazil forever. He stood up from his chair, furious. He didn't know what to do at that moment; he had been contradicted, the generals who were at the meeting had done everything behind his back, and there was no going back. The President picked up his phone and angrily dialled a number.\n\nUpon answering, he began:\n\n\"WHAT THE HELL IS THIS!? WHO THE FUCK DID THIS?\"\n\nThe other person on the line murmured something, followed by weak words coming from their mouth, as if they were afraid to answer the President. After a few seconds of silence, the man spoke in a still low tone, barely audible to Bolsonaro, who, irritated, hung up the phone. He ran his hand over his forehead, feeling the sweat trickle down; he knew there was no going back now. He could yell at everyone, but to prevent the situation from getting worse;"
 BRA.30.a: "§RSomething has to be done.§!"
 BRA.31.t: "Bolsonaro Declares Military Intervention!"
 BRA.31.d: "In a televised address from the Planalto Palace, President Jair Bolsonaro declared a nationwide military intervention, citing \"serious threats to institutional stability, public order, and the integrity of the Brazilian people\" following the failed attempt to assassinate Lula, Alexandre de Moraes, and Geraldo Alckmin. The decree suspends constitutional guarantees, places Congress and state legislative assemblies in recess indefinitely, and authorizes the Armed Forces to take control of the country's public security until the situation returns to normal.\n\nThe measure comes shortly after the repercussions and partial failure of the operation aimed at decapitating the elected government of the FBE through the assassination of Lula, Alexandre de Moraes, and Geraldo Alckmin. While the objective of assassinating Alckmin was achieved, the fate of Lula and Alexandre de Moraes remains unknown, triggering widespread protests across the entire country.\n\nThe announcement was met with immediate jubilation from the far-right wings of the Brazilian Patriotic Alliance and its supporters, with thousands flooding social media with messages of support for the President and calling for \"the restoration of order\" and \"an end to leftist tyranny.\" In traditional right-wing strongholds, including Santa Catarina, Paraná, Mato Grosso, and other regions, supporters took to the streets, waving the national flag in support of Bolsonaro's decision.\n\nMeanwhile, the opposition's response was swift. The Brazil of Hope Federation, with which Lula ran, the FPTU, and other left-wing groups denounced the decree as a clear attempt at a \"self-coup,\" accusing Bolsonaro of leading the country toward a \"return to dictatorship.\" Left-wing leaders, including Ciro Gomes and Dilma Rousseff, urged the people to \"resist fiercely\" against what they called an attempt to reignite the darkest period in Brazil's history."
 BRA.31.a: "Order will be restored."
 BRA.31.b: "A Blatant Self-Coup!"
 BRA.32.t: "Chaos in the Streets"
 BRA.32.d: "In the hours following the announcement of military intervention after Operation Punhal Verde e Amarelo, Brazil plunged into chaos. Massive demonstrations in support of Lula, Alckmin, and Alexandre de Moraes, organized by PT militants and others, flooded the streets of almost every major city in the country. Hundreds of thousands of people took to the streets, crowding places such as Paulista Avenue in São Paulo, Atlântica Avenue in Rio de Janeiro, and the main streets of Salvador.\n\nWhat began as mostly peaceful vigils and marches quickly turned violent with the mobilization of Bolsonarist counter-protesters. Clashes broke out almost immediately, with different types of weapons, including rocks, glass bottles, and fireworks, being thrown and used against each other.\n\nReports of massive looting in peripheral and middle-class neighborhoods across the country, attacks on banks and government buildings, and even fighting between rival militias in more isolated areas are coming in from all parts of the country. Overcrowded hospitals, streets blocked by barricades and police lines, curfews established in different areas, and the use of violence have put the population in a state of extreme fear, with the worst yet to come."
 BRA.32.a: "A Spiral Of Violence, Never-Ending."
 BRA.33.t: "Christmas Carnage"
 BRA.33.d: "Avenida Paulista has always been known as the stage for large political demonstrations, and this time was no different, with a massive protest against President Jair Messias Bolsonaro beginning in the morning.\n\nStarting small, the protest grew in size around midday, with more and more people gradually joining, some with banners, others with red shirts and in support of the missing president-elect Luís Inácio Lula da Silva, and many, many messages against Jair Bolsonaro, with things like \"Coup plotter,\" \"Dictator wannabe,\" and even \"Fascist Thug\" seen at the site, along with flags of the FBE, the Workers' Party, and other symbols of the left, such as the hammer and sickle and the red star.\n\nHowever, after a while, and as the protest grew, men dressed in green and yellow, black shirts with the President's face printed on it, and armed with stones and other objects, arrived.\n\nNot seeking a peaceful counter-protest, the Bolsonarists went after the demonstrators without a second thought, attacking, insulting, and assaulting them, which resulted in a counter-attack by the left-wing demonstrators, causing the demonstration to turn into a huge street fight.\n\nThe worst came some time after the violence began, when a bomb was detonated in the middle of the crowd by a demonstrator whose identity was not identified by the police. The casualties, however, were later estimated at 26 dead and hundreds injured, on both sides.\n\nHaving dispersed the protest, the massacre stunned the population, as terrorist attacks on this scale were not a commom scene for the Brazillian population, and also served to further polarize and radicalize both Bolsonarists and leftists, with both sides pointing the finger at each other on who caused the massacre, some pointing to a possible communist and some suggesting Integralists were behind it, but, more than before, both sides promised revenge."
 BRA.33.a: "When will this madness end?"
 BRA.34.t: "State of Siege Declared"
 BRA.34.d: "Following Jair Messias Bolsonaro's defeat in the elections, allegations of electoral fraud and thousands of Patriots taking to the streets, many leftists and ordinary citizens were shocked. However, after Operation \"Punhal Verde e Amarelo\" and the Christmas Carnage, Brazilian society as a whole was plunged into a state of immense destabilisation, with millions taking to the streets to protest against Jair Messias's government and others responding to leftist protests, many of whom were armed.\n\nFaced with this situation and the constant escalation of violence in the protests, Jair Bolsonaro found himself cornered, knowing that even if he had opposed the operation that assassinated Alckmin and forced Lula and Alexandre de Moraes to escape, the blame would fall almost entirely on him. So, taking his pen, he signed the \"National Salvation Act I,\" establishing a state of siege throughout the country and allowing the Army to police Brazilian territory.\n\n\"To put an end to the violence and terror that radical leftists are causing, drastic actions will have to be taken. Thank you all very much.\" Said Jair Messias Bolsonaro, flanked by high-ranking generals of the Brazillian Army and loyal members of his Government, as he finished what would be one of the most photographed and filmed statements made by a South American president since the beginning of the century.\n\nThe signing of the Act did little to calm the protests, serving however as fuel for the anti-Bolsonaro demonstrators, who considered the action the most blatant coup attempt the President had ever made, given the fact that the inauguration of the Workers' Party candidate Lula, whose fate is still unknown, would arrive in mere hours."
 BRA.34.a: "Brazil holds its breath."
 BRA.35.t: "General Freire Gomes Denounces Bolsonaro"
 BRA.35.d: "In a live broadcast, General Marco Antônio Freire Gomes, former commander of the Brazilian Army and one of the highest-ranking active-duty officers in Brazil, openly denounced the military intervention ordered by the government of Jair Bolsonaro as \"unconstitutional, illegitimate, and a grave betrayal of the democratic order and the rule of law.\"\n\nIn the video, which runs for a total of 15 minutes, Freire Gomes accused Bolsonaro of orchestrating a \"self-coup\" following the failed Operation Punhal Verde e Amarelo, claiming that the State of Siege also decreed by Bolsonaro and the operation were planned to prevent a legitimate transition of power. In the same video, the man declared:\n\n\"All true defenders of Brazil, the true patriots, whether they be from the Armed Forces, the Judiciary, the civil service, or the broad Brazilian people, must resist this usurpation of democracy, this act of the highest level of treason. Bolsonaro does not represent Brazil, does not represent the people, and does not represent the Army. We must make this clear to everyone because, if we remain silent in the face of these blatant abuses, nothing more can be done.\"\n\nAfter the video went viral on social media, it was confirmed that several mid- and high-ranking officers, as well as members of the Federal Police and other national defense agencies, signaled support or neutrality in response to Freire's statements. Within a few hours, the speech began circulating widely in various circles, raising the risk that Freire Gomes's words and actions could escalate into an open rebellion against the Federal Government."
 BRA.35.a: "He Who Betrays His Nation, Pays The Bitterest Price"
 BRA.35.b: "Against Bolsonaro, Against a Dictator"
 BRA.36.t: "Military Zones Collapsing"
 BRA.36.d: "It was only a matter of time before the military zones began to succumb to the pressure of millions of armed and violent citizens. After Operation Green and Yellow Dagger, the military intervention and the declaration of a State of Siege, the protests reached levels never before seen in Brazilian history, with millions upon millions of civilians taking to the streets against what they saw as a coup-plotting and terrorist regime that was imposing order after illegally denying the election results.\n\nThen, in an attempt to contain the protests, the military found themselves with no option but to begin firing on their own countrymen, leading to hundreds of deaths and thousands of injuries in a few days. This, obviously, did not help the situation, only further enraging the population, who now realised that they would only escape that situation through force.\n\nTaking up arms, men and women across the country, whether communists, integralists, members of criminal factions, or supporters of democracy, turned their weapons on the military, that, at the same time turned their weapons on the heads of the protesters."
 BRA.36.a: "Braço Forte, Mão Amiga"
 BRA.37.t: "SUBJECT: Report on the Structural Collapse of the Amazon Military Command"
 BRA.37.desc: "Mr. President,\n\nIt is our duty to inform you, with the rigor and gravity that this moment demands, of the complete cessation of the Brazilian Army's centralized authority over the Amazon Region. The Amazon Military Command, formerly under the coordination of Gen. Achilles Furlan Neto, has irreversibly succumbed. The strategy of military containment - severely pressured by civil insurrection and the erosion of internal discipline - has resulted in a power fragmentation that has eliminated the cohesion of the national territory in the far north. The dismantling of the chain of command has allowed ideological factions, religious militias, indigenous movements, and organized crime to fill the governance vacuum left by the Armed Forces.\n\nThe capital city of Manaus and its surrounding areas are currently under the control of the Association of Military Evangelicals of Amazonas. Under the leadership of Sandra Bringel, this faction has consolidated a militarized theocracy, utilizing the remaining logistical infrastructure of the CMA to impose an order based on religious precepts. In the southern region, the Brazilian Communist Party (P.C.B.) has finally taken effective control after their repeated subversive offensives. The organization's Central Committee has established its operations hub in Ji-Paraná, representing an enclave of direct political resistance to Brasília's directives.\n\nThe periphery of the international borders has also disintegrated into autonomous units. Tribal Assemblies have assumed sovereignty over strategic territories: the Yanomami Peoples dominate the region of São Gabriel da Cachoeira, the Tikuna control the junction of Tabatinga, and the Union of Xingu Peoples has extended its influence over Parintins. Simultaneously, public security on the borders with Peru and Bolivia has entirely collapsed, with the state of Acre being fully absorbed by the criminal group Gang of the Thirteen. The leadership of an individual known by the alias \"Neném,\" has transformed Rio Branco into the nerve center of a narcocracy.\n\nFinally, we observe a movement of administrative secession by governors who have opted for de facto independence. In Boa Vista, Governor Antonio Denarium has declared the autonomy of the State of Roraima, while in Porto Velho, Governor Marcos Rocha has followed suit with the State of Rondônia. Both administrations justify the rupture as a measure of self-preservation against systemic chaos. In summary, the Brazilian State has lost the capacity for force projection in the Amazon, leaving only a mosaic of local powers in open conflict, with no prospect for the immediate restoration of constitutional order."
 BRA.37.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA.38.t: "SUBJECT: Report on the Structural Collapse of the Northern Military Command"
 BRA.38.desc: "Mr. President,\n\nI submit for your consideration the technical analysis regarding the disintegration of the chain of command in the region under the jurisdiction of Gen. Augusto Costa Neves. It is imperative to report that the Northern Military Command has formally ceased its functions as a cohesive unit for maintaining order. The intervention strategy succumbed to logistical fragmentation and chronic insubordination, resulting in a power vacuum that is being aggressively filled by autonomists initiatives, guerrillas and highly dangerous criminal organizations.\n\nMilitary authority still exists in the region to some extent through the naval detachment commanded by Admiral Almir Garnier Santos, who has transformed the island of Fernando de Noronha into a maritime fortress and extends his control over much of the eastern region of the Amazon River. Although operating independently of the chain of command, all indications are that his objectives align with ours. In short, the Brazilian Naval Command has shown to be an collaborative element in the mission to stabilize the northern region.\n\nSimultaneously, the periphery of the former military administration has undergone a dismemberment process accelerated by resistance ideologies and organized crime. In Marabá, the Union of Communities in Struggle, under the leadership of Luiz Vila Nova, has established an exclusion belt that prevents any movement of remaining troops by employing urban guerrilla tactics and rural blockades. In the logistical hub of Belém, state authority has been supplanted by the Family of the North, where the criminal known as \"Zé Roberto da Compensa\" exercises de facto control, using port infrastructure for illicit purposes and to finance his own territorial militia.\n\nThe situation on the eastern flank is equally critical and constitutes a direct threat to federal integrity. Governor Carlos Brandão has declared the administrative independence of the State of Maranhão, concentrating efforts on the defense of São Luís and disregarding the directives of the state of siege decree. This administrative secession is weakened by internal conflicts, as the Gang of the Forty, led by \"Léo Gordim\", has taken control of the city of Imperatriz, while the Assembly of Tribes of the Native Peoples of Guajajara has established self-government in Governador Nunes Freire. An assessment of the situation shows a complete dissolution of Brazilian sovereignty in Eastern Amazonia, requiring an immediate reassessment of reconquest capabilities, given that forces once loyal now operate under local survival logics or ideological dereliction."
 BRA.38.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA.39.t: "The Northeast Collapses"
 BRA.39.desc: "Mr. President,\n\nWe inform you with the utmost urgency that the military governance structure established under the State of Siege Decree within the Northeastern Military Command, under the responsibility of Gen. Richard Fernandes Nunes, has suffered an irreversible systemic collapse over the past seventy-two hours. The attempt to maintain order through general intervention succumbed to a combination of coordinated civil insurrection, mass desertions, and a logistical inability to sustain supply lines between headquarters. Central authority has been pulverized, resulting in the fragmentation of the northeastern territory into enclaves under the control of antagonistic forces and opportunistic factions.\n\nThe most imminent threat to national integrity stems from the Popular Revolutionary Action (APR). Under the leadership of Daniel Albuquerque, this group has consolidated effective control in the region of Caruaru and its surroundings, establishing a parallel socialist insurgent administration. The APR's total control over the entire state of Pernambuco is vehemently contested by the Alliance for God and Freedom, led in Petrolina by Gilson Machado, who is a staunch supporter of this administration's ideals and will be a key ally in the effort to retake the region.\n\nIn direct opposition, yet equally detached from Brasília's authority, the Brazilian Integralist Front (FIB), led by Moisés Lima. The group took control of the entire city of Fortaleza following a large show-of-force march through the city center. This group's discipline and the cohesion of its ranks set it apart from the other rebellious uprisings that have been emerging across the country. FIB operates with its own militias that exert absolute social control over the capital of Ceará.\n\nFragmentation is further aggravated by state governments that, ignoring intervention orders, have declared administrative independence. Piauí, under Rafael Fonteles, maintains Teresina under an autonomous regime. A similar situation occurs in Ceará, where Elmano Freitas has withdrawn his operational base to Juazeiro do Norte, and in Alagoas, where Paulo Dantas maintains precarious control over Maceió. These governors use remaining military police forces to guarantee regional sovereignty, directly challenging the federative pact.\n\nIn rural sectors, the Confederation of Agriculture and Livestock of Brazil, led by João Martins da Silva Junior, has militarized properties in Floriano to protect the agricultural integrity of the properties in the region. Finally, the scenario is further degraded by criminal organizations: Nova Okaida, under the alias \"Vaquerinho,\" dominantes Campina Grande, and the Crime Syndicate of Rio Grande do Norte, under the command of \"Alicate,\" exercises control over the strategic region of Mossoró.\n\nAn opportunity for the Northeast's recovery emerged under the command of Gen. Hamilton Mourão. Our special forces under his command have successfully launched three naval offensives to secure control of Recife, João Pessoa, and Natal. Surrounded on all sides, this Northeastern Defense Force was entrusted with the mission of preventing these vital capital cities from falling under the control of elements hostile to the government's goals until the situation on other fronts is resolved."
 BRA.39.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA.40.t: "SUBJECT: Report on the Structural Collapse of the Eastern Military Command"
 BRA.40.desc: "Mr. President,\n\nPursuant to the state of siege decree, I report the definitive collapse of the Eastern Military Command (CML), formerly under General André Luís Miranda. Like other theaters, the CML disintegrated due to widespread insubordination, intense civil conflict, and officer dereliction, leaving a power vacuum fragmented into asymmetric zones of influence.\n\nThree major threats have consolidated power. In Petrópolis, the Brazilian Monarchist Movement's Regency Council rejects federal authority, rallying civilians and fortifying mountain routes. Along Pouso Alegre, the private military company Áquila International, led by retired officer Roberto Escoto, operates a disciplined, lethal mercenary enclave. To the north, the Free Commune of Greater Belo Horizonte, run horizontally by the Collective Council, has turned the capital into an ideological fortress of urban resistance.\n\nIntermediate actors further fragment the region. In Juiz de Fora, Archbishop Dom Airton José dos Santos leads the Neutral Zone of Our Lady of Aparecida as a demilitarized humanitarian sanctuary. In Governador Valadares, the Homeless Workers' Movement (MTST) maintains an agrarian guerrilla bastion coordinated by Guilherme Boulos. Meanwhile, the deposed civil government under Governor Romeu Zema operates from Divinópolis, attempting to salvage remnants of the state apparatus. Separately, the City of Rio de Janeiro remains a hyper-militarized stronghold where BOPE, under Colonel Uirá Nascimento Ferreira, acts as an autonomous, impenetrable urban guard refusing external orders.\n\nThe periphery is in absolute anarchy. The rest of Rio de Janeiro State is an unstable mosaic contested by criminal factions, including the CV, TCP, ADA, Os Manos, and Liga da Justiça, rendering coastal supply lines and conventional tactical maneuvers unviable.\n\nUltimately, the command is irreversibly defunct and the territory balkanized. Reintroducing federal forces without a massive contingent and a new legal framework will result in catastrophic friction against these entrenched forces."
 BRA.40.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA.41.t: "SUBJECT: Report on the Structural Collapse of the Southeastern Military Command"
 BRA.41.desc: "Mr. President,\n\nI report the effective dissolution of the Southeastern Military Command, previously under General Tomás Miguel Paiva. Despite the State of Siege decree, coordinated civil resistance and internal insubordination have created a complete power vacuum across São Paulo. Mass desertions among mid-level officers have forced the remaining Brazilian Army forces to abandon strategic posts, leaving the region fragmented into autonomous zones controlled by rival paramilitary and ideological factions.\n\nInstability is most acute in the Metropolitan Region of São Paulo, now split into a triangle of permanent hostilities. To the northwest, in Francisco Morato, the Libertarian League under Paulo Kogos has established an anarcho-capitalist enclave managed by volunteer militias rejecting federal authority. Conversely, the western belt centered in Osasco is controlled by Vera Lúcia's International Workers' Movement, which has converted industrial parks into armed, self-managed production hubs. To the northeast, the Free Brazil Movement, led by Renan Santos, has consolidated control over Guarulhos and its vital logistical routes, utilizing a quasi-state structure to dominate the area.\n\nIn the capital, a state of monitored urban anarchy prevails. The First Capital Command, led by \"Marcola\", has exploited the military vacuum to assume de facto governance over peripheral neighborhoods and key transit routes to secure its illicit trade. Meanwhile, in the Greater ABC region, the Unified Workers' Central under Sérgio Nobre maintains São Bernardo do Campo as a militarized union stronghold, blocking the advance of right-wing factions.\n\nIn the interior, João Doria leads the so-called Neoconstitutionalist Coalition in Ribeirão Preto, seeking to form a parallel state government and thereby challenging the legitimacy of the government in Brasília and the legitimate government of São Paulo, led by Tarcisio de Freitas, who now governs the state from São José do Rio Preto. We consider Tarcisio's administration our ally; we are confident in granting it strategic autonomy so that it can dismantle Doria's rival government and reclaim the metropolitan region before reintegrating with the federal government."
 BRA.41.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA.42.t: "SUBJECT: Report on the Structural Collapse of the Southern Military Command"
 BRA.42.desc: "Mr. President,\n\nIt is with the most regret that I inform Your Excellency that the general military intervention has suffered the final breakdown in its implementation. The Southern Military Command (CMS) has suffered operational failure due to insubordination, mass desertions, officer prevarication, and intense insurgent clashes. Granting full powers to regional commands fragmented the federative pact, transforming the territory into a web of fiefdoms disputed by remnant forces, dissident governments, and militias.\n\nGen. Valério Stumpf Trindade detachments remain in activity, commanding weakened CMS remnants. Severe supply shortages and severed communications restrict his defensive control to Santa Maria, Rio Grande do Sul, leaving him unable to retake state capitals.\n\nThis loss of cohesion enabled the rise of separatist and radical factions. Near Chapecó, the separatist movement \"The South is My Country,\" led by Celso Deucher, established armed territorial control, checkpoints, and tax collection. In Joinville, the neonazist group Neuland, led by Ricardo Barollo, consolidated a racial exclusion zone, leveraging the local industrial park to isolate the region from federal influence.\n\nIn Curitiba, former magistrate Sérgio Moro assumed political and paramilitary control via the Just Brazilian Alliance, a faction supported by the local middle class and police elements. In Cascavel, the TIGRE unit, under Police Chief Cristiano Augusto Quintas dos Santos, broke from the state government to establish a tactical security junta controlling western Paraná's logistics.\n\nIn Santa Catarina, fragmentation splits the coast and highlands. In Florianópolis, the Adventist Biker's Ministry, led by Pastor Ivonil Machado, converted its structure into an urban patrolling force. In the interior, centered in Lages, Governor Jorginho Mello declared state administrative independence, withholding tax revenues to finance a private state guard.\n\nRio Grande do Sul mirrors this secession. In Porto Alegre, the left-wing insurgency Revolutionary Spark seized territorial control via a Revolutionary Committee. In the serra gaúcha, Federal Highway Police Director-General Silvinei Vasques imposed a curfew, using heavy infrastructure to dominate key logistical routes. In Pelotas, Governor Eduardo Leite declared administrative independence for Rio Grande do Sul, isolating the southern half to maintain a civil bureaucracy funded by the Port of Rio Grande. While we do not expect cooperation from insurgent movements, opportunities exist to bring these state governments and police units back under federal authority to restore regional stability."
 BRA.42.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA.43.t: "The Legalist Army Rebels"
 BRA.43.d: "Following President Jair Messias Bolsonaro's declaration of a state of siege and the division of the Brazilian Republic into different military command zones, millions took to the streets, viewing the President's actions as nothing more than a military coup. However, a certain segment of the Brazilian Army's generals, along with soldiers and lower-ranking officers, indignant at the undue execution of Operation \"Punhal Verde e Amarelo\" and the post-election military intervention, decided to put a stop to it and, to restore the elected President Luís Inácio Lula da Silva, and rebelled against the Brazilian National Government.\n\nOn one side, the military loyal to the National Government and Jair Messias Bolsonaro promised to quickly end the rebellion, declaring Freire Gomes and his henchmen as traitorous terrorists who would be held accountable for their actions against the Republic. From the Planalto Palace, Bolsonaro declared that he would purge Brazil of corrupt elements, end the revolt, cleanse the Armed Forces of the \"Melancias\" and finally bring order back to the country.\n\nOn the other hand, Freire Gomes and the military who rebelled against the National Government vowed to put an end once and for all to the threat that Jair Bolsonaro and the far right represent to Brazilian democracy, declaring that the actions of the President, who was defeated in the 2022 elections, go directly against democratic principles and the Constitution, accusing the Nationalists, the President, and the Military of being traitors against the Republic and order, attempting to establish a military government inspired by that of 1964.\n\nRegardless of which side they are on, violence has taken over the streets and both sides promise to eradicate the other, once and for all."
 BRA.43.a: "We will have order in this Nation, by any means necessary."
 BRA.43.b: "The democratic process is non-negotiable. Period."
 BRA.44.t: "A Burning Nation"
 BRA.44.d: "The saying \"Everything that happens in the United States happens in Brazil two years later\" has always been considered a reality by many Brazilians, especially after the election of Donald Trump and subsequently Jair Bolsonaro. However, after the start of the Second American Civil War, the Brazilian population crossed their fingers hoping that this phrase was the result of coincidences and nothing more.\n\nTo the terror of many and the happiness of a few, this saying remains true. Even after President Jair Messias Bolsonaro's attempts to bring back order and stability by declaring of a State of Siege and sending in the military, we could not contain the fires that now engulf our nation. The failure of the Brazilian Army to contain the massive protests that swept the country left them with no choice but to open fire on their fellow countrymen leading to the collapse of the Military Command Zones, the rise of criminals and insurgents everywhere and a so-called \"Legalist\" rebellion from within our own High Command.\n\nMutineers, Communists, Fascists, Anarchists, Criminal Factions and Separatists, from Rio Grande do Sul to Roraima, the sons of the beloved Brazilian Homeland are killing each other in the worst possible ways, all with different motivations and visions for the country's future.\n\nOne thing, however, is certain in the minds of all those trying to survive the devastation that is certain to ravage the territory:"
 BRA.44.a: "The Brazilian Nation will never be the same again."
 BRA.45.t: "Ato de Salvação Nacional II Signed"
 BRA.45.d: "After declaring a state of siege through the National Salvation Act I (AS-I), President Jair Messias Bolsonaro signed the National Salvation Act II (AS-II), which formally suspended the activities of all political parties in the country, except for his own, the Brazilian Patriotic Alliance (APB), according to Jair, until \"order is restored and the terrorists are completely dealt with.\"\n\nThe decree, signed and broadcast on television, cites \"continuous threats to national unity, the stability of democratic institutions, and consecutive attempts to disrupt the political and administrative order of the Federative Republic of Brazil by armed militias which, through terrorist attacks and incitement to violence against the State, have placed the national territory and its population in constant danger.\" as the main justification for the urgency of such a measure.\n\nImmediately, the other registered parties and federations, including but not limited to the Brazilian Federation of Hope (FBE), the United Popular Labor Front (FPTU), the Democratic Alliance for Peace and Legality (ADPL), the Movement Toward the Future (MRF), and the Union for Brazilian Order and Progress (UOPB) were forced to cease their political and financial activities, facing the risk of imprisonment in the event of violations of the rules established by the Act.\n\nPublic figures and leaders of the federations were quick to denounce the measure; however, fearing arrest, nothing more than words and veiled calls for protests were made."
 BRA.45.a: "Harsh measures are necessary to save Brazil"
 BRA.45.b: "Dictator, Dictator, He Is A Dictator"
 BRA.46.t: "Ato de Salvação Nacional III Signed"
 BRA.46.d: "Earlier today, President Jair Messias Bolsonaro signed the National Salvation Act III (AS-III), in which formally dissolves the Brazilian Patriotic Alliance and splits it into four distinct political factions. Amid the Brazilian Civil War, the measure is seen as an attempt to restructure the government, decentralize power, and adapt to the pressures arising from the differing internal visions within the former alliance.\n\nAmong the four new fronts are the Homeland Salvation Front (FSP), representing the interests of the military bloc and advocating for patriotism, national defense, and strong military leadership; the Christians United for Brazil Front (FCUB), representing the government's conservative Christian bloc, focused on prioritizing the values of the Holy Bible and the integration of Christianity within the government; the Brazilian Family Front (FFB), representing the conservative bloc focused on defending traditional family values; and the Freedom and Prosperity Front (FLP), representing the interests of liberals and free-market advocates.\n\nThe dissolution brings an end to the APB structure, which Bolsonaro ran with during the 2022 presidential elections and in the early stages of the civil war. Now, each front will operate independently, with its own leadership and each defending its own interests."
 BRA.46.a: "Now begins the battle for influence."
