 BRA_brazilian_welfare_desc: ""
 BRA_offshore_oil_rigs_dynamic: "Offshore Oil Extraction"
 BRA_amazonian_jungle_dynamic: "The Amazonian Jungle"
 BRA_amazonian_jungle_dynamic_desc: "The Amazonian Jungle is a massive rainforest in South America that covers most of the Amazon Basin, extending over most of Northern Brazil as well as the Guyanas, Venezuela, Peru and Bolivia. The Amazon represents over half of the total area of remaining rainforests on Earth and is comprised of a large tract of biodiversity, with an estimated 16.000 species.\n\nOften called the \"Lungs of the Earth\", in reality the Amazon's net contribution to the planet's oxygen levels is zero. However, the rainforest is still invaluable to the climate balance of South America, being a source of humidity to most of the continent carried through \"Flying Rivers\", keeping desertification at bay.\n\nDespite this value, the Amazon Jungle still experiences significant devastation year after year, often carried by local mining and agricultural efforts, sometimes backed by foreign capital.\n\n§GWhile the Amazon Jungle may hold many material and intellectual treasures, it is crucial that we treat it responsibly.§!"
 BRA_amazonian_jungle_state_dynamic: "Amazonian Jungle State"
 BRA_amazonian_jungle_state_dynamic_desc: "$BRA_amazonian_jungle_dynamic_desc$"
 BRA_not_world_power_idea: "Legacy of the 2010's"
 BRA_not_world_power_idea_desc: "\n\n\n\n\n£GFX_BRA_power_of_the_future\n\n\n\n\n\nFollowing the Workers' Party first electoral victory in 2002, then President Luiz Inácio Lula da Silva oversaw astounding economic growth sustained mainly due to the Commodity Boom of the 2000's, which stimulated the strong agribusiness of the country, even managing to avoid the most catastrophic effects of the 2008 crash. With such luck, cunning governance and a bit of backroom negotiations, Lula sucessfully reformed many welfare programs, passed much needed social reforms and fought crippling hunger in the country, leading to visible improvements to the living conditions of many Brazilians by the time of the 2010's, with Lula himself leaving office as one of the highest-approved Heads of State at the time.\n\nThe period of grace, however, would not last. After electing his sucessor, President Dilma Rousseff would strive to maintain the reforms of her predecessor, but lacking the silver togue of Lula and with the end of the Boom, Dilma would find herself between a rock and a hard place as the Centrão increasingly leverages its muscles to wrangle the government. After narrowly winning reelection in 2014, with the Workers' Party popularity in downfall after the disastrous results of the FIFA World Cup of 2014 and a looming fiscal crisis, Dilma begins a program of fiscal austerity combined with devaluation of the Real in a desperate attempt to foster internal industrialization and stimulate the internal market.\n\nHer plan would backfire spectacularly, sending Brazil into stagflation and then a huge recession during the years of 2015 and 2016. This, combined with growing scandals of corruption of Her's and Lula's past governments unveiled by Operation Car Wash, would spell doom for her, as she would be ultimately impeached in August of 2016. Her sucessor, Vice-President Michel Temer, would assume the Presidency and continue with unpopular budget cuts into education, healthcare and other social spenditures to control the crisis' damage to the government's finances.\n\nBy 2020, the general sentiment is that of a lost decade, as Brazilians have mostly lost trust in the State's institutions and capability to conduct the country towards the future, laying the dream of §Y\"Power of the Future\"§! forever in the longed past."
 BRA_aftershock_of_2015_recession_idea: "Aftershock of the 2015 Recession"
 BRA_aftershock_of_2015_recession_idea_desc: "During Dilma's second government, an unwelcome, but foreseen problem had finally knocked the door: economists began warning about a possible stagflation scenario as the Commodity Boom, which helped sustain most of Lula's government, showed signs of coming to a halt. Acknowledging the situation, Dilma prepared what was dubbed the \"New Economic Matrix\", as explained by then Minister of Economy Guido Mantega. In short, the government would introduce industrial tax cuts, force the banking sector to loan at low interest rates, and foster the internal market to circumvent external shocks in commodity prices.\n\nThe plan, while sound, failed to achieve its expected results, as it produced the opposite results: instead of reinvesting the acquired profits, the industry hoarded capital, leading to falling budget revenue which, together with the exhaustion of the Boom and the subsequent fall of commodity prices, caused the predicted fiscal imbalances. Desperate to avert recession, Dilma introduced a neoliberal austerity program aiming to rebalance the budget through cuts to the Growth Acceleration Program (PAC), bringing down public investment, worsening the effects of the crisis.\n\nWith the popularity of the government eroded by such measures and the country now in recession, the Centrão turned against her, and she was impeached in favour of Vice-President Michel Temer. He would go on to finish her mandate and, together with Bolsonaro, introduce even greater neoliberal reforms, such as the \"spending ceiling reform\", establishing a ceiling for government spenditure for 20 years, a labour law reform in 2017 and a pension reform by Bolsonaro in 2019.\n\nBy 2020, while the economy shows signs of recovery, the economy still lays mostly in tatters, being a shadow of its former self from a decade ago. We hope it won't get worse from here."
 BRA_hold_of_the_centrao_idea: "Hold of the Centrão"
 BRA_hold_of_the_centrao_idea_desc: "\n\n\n\n\n£GFX_BRA_hold_of_the_centrao\n\n\n\n\n\nDuring the last decades, as Brazil consolidated its refounded democratic regime after 21 years of military dictatorship, the renegeration of the political order created a phenomenon which would become nicknamed by Brazilians as the \"Centrão\", roughly translated as \"The Big Center\". The concept refers to the dominance of the many fractioned centrist political parties that are nevertheless the kingmakers of the President's government.\n\nDue to their common practice of filibustering the government's agenda as a way of blackmailing it into fulfilling their difuse interests and the constant change of allegiances due to their political physiologism, the Centrão has become associated to many Brazilians with what is worst within the political establishment: corrupt and opportunistic politicians, entrenched political dynasties, the subservience of the government to spurious needs of powerful interest groups instead of programmatic ideological agendas, and whatever stains the democratic process as a whole. No matter your ideology, your party, or your government's program, remember just one thing:\n\n§REven if you are Christ reborn, to govern this land, no matter how much of a saint you try be, you will still be forced to govern with Satan by your side.§!"
 BRA_brazilian_society_idea: "Generalized Violence"
 BRA_brazilian_society_idea_desc: "\n\n\n\n\n£GFX_BRA_generalized_violence\n\n\n\n\n\nConditions of widespread social inequality, the appearence of numerous criminal organizations, increasing political radicalization, escalation of conflicts in the countryside between landless poor peasants and the country's agribusiness landowners, and the extreme violence perpetrated by the country's militarized police force have all stained the country with one of the highest rates of homicide worldwide, more than all developed countries combined.\n\nPast governments have so far repeatedly failed to solve this dire social issue. President Bolsonaro's and Minister Moro's \"tough on crime\" approach has been met with considerable criticism as his critics point that such measures' results have been largely made ineffective due to the worsening of living conditions and only exacerbated the already troubling State's violence towards mostly poor and black people living in the Favela slums of Brazil."
 BRA_disjointed_geography_idea: "Disjointed Geography"
 BRA_disjointed_geography_idea_desc: "\n\n\n\n£GFX_BRA_disjointed_geography\n\n\n\n\n\nBeing a post-colonial continental-sized nation in one of the most geographically-challenging parts of the world has presented massive challenges when it comes to connecting the more remote regions of the country. To make matters worse, the late 50s saw a push for automobile-centered infrastructure construction and the abandonment of the nation's railwail networks under president Juscelino Kubitschek, motivated if not outright pushed by the growing US-American automotive industry at the time.\n\nThis infrastructure model would prove difficult to build and maintain across the hilly terrains, deep jungles and marshes that make up the country, resulting in inadequate road conditions, frequent bottlenecks and leaving pheripheral regions such as the Amazonian jungle poorly linked to the nation's central areas."
 BRA_brazilian_agro_idea: "The Brazilian Agro"
 BRA_brazilian_agro_idea_desc: "\n\n\n\n\n£GFX_BRA_brazilian_agribusiness\n\n\n\n\n\n\"Agro is Tech, Agro is Pop, Agro is Everything\" has recently become one of the most famous propaganda pieces in the minds of Brazilians. The catchphrase has become symbolic of the agribusiness sector of the country's economy, boasting its huge influence in driving it forwards and the ideology of the country as a world's breadbasket, both internally and externally.\n\nHowever, behind the fancy mediatic attention and the collective imaginary lies dark tales of dangerous landowning families backed by personal armies of their own goons and stories of pernicious feudal-like working conditions for Brazilian rural workers, which constitues the real backbone of the agribusiness' productivity. This, alongside its influence in the Brazilian Congress, from which it fuels itself through lavish government programs of agricultural finance, such as the SAFRA Plans, and their filibustering of industrialization agendas have led many to distate them, seeing them as a roadblock to the diversification of Brazil's economy and progress.\n\nSuch conditions have led to the birth of many agrarian reform movements, among them the reformist Landless Workers' Movement (MST), espousing sympathy to the Worker's Party and general agrarian reform through institutional means, and its much more radical split: the League Poor Peasants (LCP), which espouses agrarian revolution and violent destruction of the so-called \"Brazilian latifundium\" as the only way of forever ridding the country of the landowning-agribusiness economy.\n\n§RThe Brazilian agribusiness is very reliant and sensitive to the World Market's fluctuations. Should any event of cataclysmic proportions take place, this will spell doom for the sector, and perhaps the Country, so keep the MST and LCP at bay, and most important of all: KEEP THE SECTOR RUNNING.§!"
 BRA_self_indulgent_military_idea: "Partido Fardado"
 BRA_self_indulgent_military_idea_desc: "\n\n\n\n\n£GFX_BRA_the_partido_fardado\n\n\n\n\n\nThe \"Partido Fardado\", which roughly translates to \"The Uniformed Party\", or more aplty, \"The Top Brass Party\" is a commonly used definition to the Brazilian Armed Forces' perpetuated influence over civilian governments ever since the military handed power back to democratic governance in 1985. Since then, the Armed Forces have acted as unwanted partners of civilian governance, and in later years have been demanding ever increasing stipends, rights and funds, always implicitly blackmailing the government to get their interests respected.\n\nWith the election of Jair Bolsonaro in late 2018, himself a low-rank retired Army Captain, the Armed Forces have been increasing their presence in civilian governance at alarming rates, to the dismay of many within society. Due to Bolsonaro's many controversial claims surrounding the legacy of the Dictatorship of 1964-85, worries of a coup d'etat have become real and serious to many, and nobody knows what are the Top Brass' plans behind their Headquarter's closed doors.\n\n§RArticle 142 of the Constitution: The Armed Forces, composed of the Navy, the Army, and the Air Force, are permanent and regular national institutions, organized based on hierarchy and discipline, under the supreme authority of the President of the Republic, and are intended for the defense of the Homeland, the guarantee of constitutional powers, and, at the initiative of any of these, of law and order.§!"
