 BRA.89.t: "The Military Constitution"
 BRA.89.d: "Following a series of decisive political maneuvers led by members of the Homeland Restoration Front, the 1967 Constitution was officially restored as Brazil's Magna Carta. The 1988 Constitution, long viewed by the Armed Forces and patriotic citizens as a flawed document, born of an anti-Brazilian compromise made with leftists and terrorists, was formally revoked and rendered legally void following consecutive actions in Congress and with broad popular support.\n\nThe restored Constitution significantly strengthens the powers of the Executive Branch and the Armed Forces, granting them broad and clearer authority to maintain internal and external stability, uphold public order, and preserve institutional order. Additionally, the constitution limits the role of the Judiciary in decision-making, ensures strengthened mechanisms for maintaining internal security and for the operation of counter-subversive forces, and provides greater protection for the Armed Forces and other security agencies.\n\nViewed by many as a necessary step toward pacifying territories dominated by mutineers and other terrorist groups, the government's measure provides the discipline, unity, and institutional strength needed to rebuild the country in an organized and coordinated manner."
 BRA.89.a: "Another step towards stability."
 BRA.90.t: ""
 BRA.90.d: ""
 BRA.90.a: ""
 BRA.91.t: "God, Homeland, Family"
 BRA.91.d: "After years of violent fighting, the destruction of countless lives, the murder, massacre, and brutalization of tens of thousands of people, the last pockets of resistance by the Loyalist Army surrendered to the Armed Forces, with leaders such as the traitor Freire Gomes, Haddad, and Ciro Gomes being captured along with dozens of other high-ranking generals and politicians. Many within the rebellion surrendered when the end was inevitable, while the fanaticals continued to fight foolishly and were killed in combat.\n\nAcross the entire territory, and even in areas controlled by insurgent and extremist groups, the Brazilian people took to the streets in an outburst of joy and complete ecstasy. In cities such as Cuiabá, Brasília and other numerous cities, the green and yellow flag is waved with raw patriotism, fireworks are set off day and night, while in every piece of land, the Brazilian people celebrate in tears the final nail in the coffin of the socialist regime that imposed terror and misery on the lives of millions for so many years.\n\nFor years, the decent people of Brazil were robbed, humiliated, trampled upon, and deceived by the socialist scum; they watched their country being sold off piece by piece to China; they watched the prices of basic goods skyrocket; they watched helplessly as their's and their's children's future was stolen. And today, the nightmare finally ends, and the traitors who stole from the nation, who corrupted its institutions, who stole President Bolsonaro's election, and who turned Brazil into a slaughterhouse will face the justice they have long evaded."
 BRA.91.a: "An end to leftist fanatics."
 BRA.92.t: "Restoration of the Congress"
 BRA.92.d: "The heavy doors of the Chamber of Deputies swung open for the first time after a long period of closure. A young deputy walked through the main entrance alongside his colleagues, his footsteps echoing and mingling with other echoes throughout the hall. The air carried a faint scent of fresh wax and old wood. He looked around and saw a chamber different from the one he remembered, completely transformed.\n\nThe young deputy continued to survey the place where he had once worked, noticing new faces in some of the seats, representing parties whose existence was once thought impossible by him just a few years ago.\nSome new faces remained, but they were few. Many who had occupied those seats had chosen to betray the Republic at its most vulnerable moment, allying themselves with the Socialists and the Legalists, and would now spend the rest of their lives behind bars, while others had fled the country at the start of the civil war, abandoning the nation and its people.\n\nAs he took his seat, the young man felt something he hadn't experienced in many years: a profound sense of normality, of a return to sanity and peace that he hadn't felt even before the conflict; after all, the weight of the lunatics from the PT and the other socialist parties had dissipated completely, and the shadow of corruption had been extinguished along with the traitors.\n\"A true purification,\" he thought.\nThe congressman took a deep breath, pushing away both the good and the painful memories of the past. A small smile formed on his lips. Feeling renewed strength and courage to remain there, he began walking toward his seat."
 BRA.92.a: "A new age commences."
 BRA.93.t: "The Savior of Brazil"
 BRA.93.d: "Carlos was sitting alone on his old sofa, a half-empty glass of beer resting on the wooden table in front of him. His eyes were fixed on the large portrait hanging on the wall; there was Jair Messias Bolsonaro, wearing the presidential sash, looking straight ahead with a firm and unwavering gaze. The frame was simple, yet the image had become something essential in his house.\n\nThe man had been a member of the Jair Messias Legion, a paramilitary group that operated in the interior of Bahia when the Legalists still existed. Back then, he recalled, they were persecuted by the entire government apparatus, labeled as radicals, fascists, and extremists, hunted down by intelligence forces and the army. They had maintained the Bolsonarist resistance within the Legalists, and now, years after leaving the organization, the truth rooted deeper in the man's soul.\n\nIf it weren't for Bolsonaro, he and his comrades would be dead.\nIf it weren't for Bolsonaro, Brazil would be in ruins again.\nIf it weren't for Bolsonaro, Lula would now be in the Planalto.\n\nHe recalled the organization's early months. The nights when news of Legalist advances on the border circulated, rumors that Bolsonaro was ill and that the national government would collapse. He and his comrades were ready to die; many died, others suffered, but they kept fighting because they knew that a socialist Brazil would be a Brazil of persecution, censorship, and destruction, that a socialist Brazil would be one where everything he held dear would be burned to the ground.\n\nBolsonaro then returned to his mind.\nA socialist Brazil would not happen; the possibility of one now existed only in his mind, for Bolsonaro, with his wisdom, stood firm for the Brazilian people and saved Brazil from becoming yet another failed socialist experiment like Cuba or Venezuela.\n\nCarlos stood up, still looking at the portrait, and said, in a low but grateful voice:"
 BRA.93.a: "\"Thank you, Captain.\""
 BRA.94.t: "Natural Values"
 BRA.94.d: "Jair Bolsonaro deserves immense credit for saving Brazil. Both in 2018, when everyone believed Brazil was headed toward the Centrão or back into the arms of the PT, he stood up and faced the full force of the establishment, the media, and the old political machine with courage and determination, and after the fraud of 2022, when he defended Brazil tooth and nail, and, through his leadership and unwavering resolve, prevented the left from seizing power. He deserves all the honors and a special place in Brazilian history for his achievements,\n\nHowever, despite all his merits, care must be taken not to turn him into a political idol. Time and again, in different parts of the world, history shows that elevating a single figure above the values they uphold and the people they represent tends to lead nations down the path to dictatorship. In Europe, South America, Asia, Africa, it doesn't matter where, cults of personality build oppressive systems that, in the end, end up weakening the very nation they intended to protect.\n\nWe cannot fall into the very same trap of authoritarianism that we have fought so hard to eradicate, and we must recognize that what truly led Brazil to victory were things transcending Bolsonaro: The values of God, Country, and Family, the Conservative values that were the true pillars that kept this nation standing in the face of the Storm, that guided the people, and that will provide the moral foundation for reconstruction."
 BRA.94.a: "Brazil is not Chile and Bolsonaro will not be Pinochet."
 BRA.95.t: "Moderating Force"
 BRA.95.d: "The victory would not have been possible without the strength and determination of Bolsonarism and its most radical factions. They proved to be the fists of patriotism. They were the only ones who, when the moment of truth arrived, took up arms and attacked the socialists; who refused to surrender the country to the leftists; and who fought and died on the front lines for a better Brazil.\n\nWithout the hardcore Bolsonarists and the radical right, the country might have fallen into the hands of the Reds. Their contributions are immense and must be recognized and honored by future generations.\n\nHowever, it was the Center that acted as the brain of this body throughout the entire crisis. While the right-wingers provided the brute force, the moderates and pragmatists in the government kept the country running. Thanks to the center, the different factions within the administration were pacified, and the economy was saved from total collapse. The presence of moderates in the government prevented more intense internal chaos and ensured that the different groups worked together.\n\nHistory shows us the dangers of extremism. Mussolini's Italy was once viewed favorably for the great promises it held, yet its extremism led it to ruin and turned it into an international pariah.\nThe Brazilian people, after such a destructive conflict, yearn for peace, prosperity, and stability, not endless conflict and ideological terror, and Brazil must choose whether to take the path of Extremism or that of Moderation."
 BRA.95.a: "The radicals destroy, but won't reconstruct."
 BRA.96.t: "New National Education"
 BRA.96.d: "The morning sun streamed through the windows of one of the classrooms at the newly opened Presidente Jair Bolsonaro Elementary School in Cuiabá. The room was simple and organized, with seven rows of wooden desks and a clean, dark-green chalkboard beneath an imposing portrait of Jair Messias Bolsonaro. Twenty-three children sat attentively, their notebooks open.\n\nTeacher Dona Lúcia stood at the front of the class, looking at her students with as much pride as she looked at the Brazilian flag. She began to speak in a calm, soft voice.\n\n\"Today, children, we're continuing yesterday's lesson on Brazil's recent history, still on the topic of the socialists in the Legalist Army and their plan to destroy our country and our religion.\" She took a deep breath. \"In the regions they controlled, the Legalists brought chaos and suffering. They attacked our families, persecuted Christians, confiscated the property of farmers and the humble people, and tried to impose their murderous ideology on the people.\"\n\n\"They wanted to turn Brazil into a copy of Venezuela, of Cuba, and of the failures of socialism, to erase God from our hearts, and to sell our country to China and steal your future, children.\"\nThe children were listening intently as she spoke, some writing down every word while others just listened. As soon as the teacher finished, a girl in the front row raised her hand.\n\"Teacher... But if they had won, what would have happened to our flag? Would we still have Brazil?\"\nDona Lúcia smiled, thinking of an answer for a few seconds.\n\"That's a good question. No, my dear, we wouldn't have Brazil anymore. In a time before you were even born, years before Bolsonaro won his first term, Lula, the Great Traitor we talked about in the last class, was leading the country, trying to put his power project into practice to destroy Brazil, and that is why, when he rigged the elections to try to return to the presidency, Operation Green and Yellow Dagger became so necessary, to prevent the flag from turning red and to restore the position to President Jair Bolsonaro.\"\n\n\"Now, a short essay as an assignment,\" she said, getting the students' attention. She picked up the chalk and wrote on the blackboard:"
 BRA.96.a: "\"Due Tuesday: Lula, Legalism, and its impacts on Brazil.\""
 BRA.97.t: "Bolsonaro, The Myth"
 BRA.97.d: "For decades, Brazilian politics was a cesspool of corruption, shady deals, and the slow erosion of national identity. Then came Bolsonaro, a simple Army captain, a man of the people who spoke his mind and refused to play the dirty game. What began as a lone voice in Congress turned into a movement that changed Brazil forever. Against all odds and the entire Establishment, he was elected president, and from that moment on, nothing in Brazilian politics would ever be the same.\n\nHe governed with courage in the face of cowardly and relentless attacks, surviving a stabbing that nearly cost him his life. He faced the judges, the hatred of the corrupt media, the betrayal of former allies, and the full weight of the System bent on destroying him. Yet he never bowed down, never let himself be swayed, defending traditional values, the family, and Christianity with his own body. He stood by the Armed Forces, and when he was robbed of his reelection and the socialist rebellion began, he stood as an unbreakable shield.\n\nUnder Bolsonaro, Brazil prevailed. The Legalists were annihilated, and Brazil was saved from falling into the same abyss that had been sucking the life out of it for so many decades. He is the greatest president in history, not because he is perfect, not because he is free from mistakes, but because he awakened the patriotism that had been dormant for so long, and because he gave millions of Brazilians the courage to say they are proud to be Brazilian.\n\nBolsonaro is a unique man, driven by conviction and love for the nation."
 BRA.97.a: "The Captain of the People."
 BRA.98.t: "A System That Worked"
 BRA.98.d: "In a luxurious residence located in a quiet neighborhood of Brasília, President Jair Bolsonaro sat at the head of a long mahogany table. Surrounding him were ten of his most trusted allies: justices of the Federal Supreme Court, leaders of the Chamber of Deputies, and key ministers of his administration.\nThe room, softly lit by an elegant chandelier and large windows overlooking an impeccably manicured garden, was mostly silent as the group conversed.\n\nIn a firm, confident tone, one of the congressmen present was the first to break the silence:\n\n\"You know... I understand that people talk about the need for checks and balances; I understand the need for the Three Branches. But they have failed us, failed the country, and allowed themselves to be dominated by the PT machine,\" he said, shifting his gaze between the justices, congressmen, and Bolsonaro.\n\nThe president listened attentively for a few seconds. He didn't let the man finish, shaking his head. \"No,\" he began, drawing the gazes of the eight others seated there. \"It wasn't the system itself that failed us. It alone wasn't the problem; after all, it had functioned for decades before. The problem was who infiltrated it and became part of it. You know, Lula, the PT thugs, and the traitors. There was no way, it became corrupt.\"\n\nThe congressman remained silent, listening intently, while the rest of the table nodded in agreement with Bolsonaro. \"Now,\" Bolsonaro spoke again. \"the people are tired. They want stability. Security, alright? We shouldn't be playing dictator now. We must restore the system from before the civil war, only this time without the wrong people. Agreed?\""
 BRA.98.a: "\"Agreed, Mr. President.\""
 BRA.99.t: "Brazil's Right Hand"
 BRA.99.d: "Since the restoration of democracy in 1985 and the end of the military regime, Congress has played a fundamental role in the life of the Brazilian nation. It has served as a counterweight to the executive branch, playing a vital role in preventing the \"Great Traitor\" from becoming the dictator he so desperately sought to be.\nIt also remained active during periods of economic crisis, political scandals, and unprecedented political polarization, doing everything possible to ensure that Brazil would be taken seriously in the long term.\n\nIn recent years, then, this role has become even more evident; after all, it was Congress that led the effort and voted to expel the red puppet Dilma Rousseff from the government, putting an end to the regime of widespread corruption and economic recession that had everything it needed to destroy our beloved nation.\n\nSince its reopening months ago, Congress has played a major role, assisting Bolsonaro in his glorious task of cleansing the country of the remaining extremists, relieving him of trivial tasks that would have taken up time he so desperately needs. And now that the civil war is in its final stages and the task of sweeping away the insurgents is nearing completion, Congress finds itself purified, free of traitors, the corrupt, and all those others who chose to abandon the Fatherland for radical ideologies.\n\nThe institution is cleaner and more committed to the Brazilian people than it has ever been before, and it is the duty of Captain President Bolsonaro and the government to concentrate their efforts on strengthening this crucial body, so that a system of true balance may be formed, where the President, on one hand, steers the Nation through turbulent and violent seas, and Congress provides internal balance for each different region and social group."
 BRA.99.a: "A New \"Anti-Dictatorship\" System"
 BRA.100.t: "A Free Brazil"
 BRA.100.d: "The forces of the Loyalist Army were decisively defeated after a series of fierce and violent battles. Their soldiers, once feared and respected by large segments of the population, now find themselves in complete ruin in the face of the mighty forces of the Brazilian Army, their last strongholds capitulating shortly after the surrender of several of their leaders. What remains now is merely disorganized resistance, scattered throughout the interior of the Northeast and a few large cities, but this will be hunted down and eliminated quickly. The socialist dream that sought to enslave Brazil has ended in humiliation.\n\nThose leaders and commanders who did not surrender have been captured and now face the bitter reality of defeat. Fernando Haddad, Ciro Gomes, Marco Freire Gomes, and other high-ranking figures of the Legalist faction who decided to betray the Fatherland in exchange for a failed attempt to return Brazil to its shackles now find themselves chained, stripped of all power, and exposed before the Brazilian people. The shame and dread on their faces reveal what they have done all these years, and for this they will be brought to justice to answer for all their crimes.\n\nBrazil is finally free. Free from the socialist regime that robbed the nation of more than a decade and a half of progress and prosperity, and free from the parasites and bloodsuckers who stole the people's wealth, destroyed their dreams and opportunities, and plunged the country into this carnage. The road to the complete liberation of the Brazilian people is long and arduous, and vast areas of the nation remain under the control of insurgents and terrorists; however, the winds of freedom are blowing toward Brazil, and the Brazilian people will soon be able to breathe new air."
 BRA.100.a: "A Toast to Freedom!"
 BRA.101.t: "Our Pilar"
 BRA.101.d: "The morning sun bathed the rolling fields in golden light as João stood at the edge of his property, watching the cattle graze peacefully. That farm had belonged to his family for three generations, and he had inherited it from his father following the latter's death and a brief legal dispute with his brother.\n\nAfter the onset of the Three Great Crises, the collapse of agribusiness in the country and the following civil war, his life became a living hell. Legal battles, crop failures, constant trips to the big city, and open conflict near where he lived had nearly destroyed the life he once had and the farm itself, yet he persevered, and now he stood relaxed, watching the herd move across the pasture with a sense of pride he never had nor understood before all the chaos.\n\nIt was then that the sound of an approaching car broke the peaceful silence. João turned his head and spotted a black vehicle coming up the dirt road, with a small Brazilian flag fluttering on the hood.\n\nA government car, he concluded.\n\nJoão called his wife, Júlia, who was inside the house, and they both headed toward the entrance to the property. The car stopped, and two men got out, both dressed in impeccable suits. One of them remained near the car, while the other, the one with a jovial appearance, approached with a polite smile. The man greeted them, asking how the farm was doing, if the cattle were healthy, and if the children were well.\n\nThe young man was silent for a moment, glancing at his colleague. He nodded, and his colleague, an older man, brought a bulky briefcase with him. The officer then opened it and took out a specific document, handing it to João with a serious expression; he opened his mouth to speak, shifting his gaze between João and Maria:"
 BRA.101.a: "\"I want you to read this carefully and sign here at the bottom if we have an agreement.\""
 BRA.102.t: "Enlighten the Robbed"
 BRA.102.d: "For longer than we would have liked, the forces of populism have worked tirelessly to destroy the concept of liberalism in Brazil, to eradicate the idea that has flourished in every nation where it has taken root. Since before the 2000s, Lula and his socialist followers have portrayed liberalism as the ideology of the wealthy, of exploitation, and of indifference to the suffering of the people.\nOnce elected, they worked to eradicate the culture of wealth in this country, demonizing us through cheap rhetoric, constant propaganda, and infiltration of universities and the educational system.\n\nIn a true feat of Brazilian societal manipulation, they convinced millions of people that freedoms, whether of the market or of the individual, and the minimal state were enemies of the poor and the mother of the rich.\n\nThis demonization extended beyond the Bolsheviks, as the forces of the radical right and Radical Bolsonarism were also part of these malicious efforts, contributing greatly to the distortion of liberal ideas and history, reducing everything to simplistic slogans and petty propaganda.\n\nIn the years leading up to the civil war, both Marxist and Fascist forces joined together to echo their songs of hatred toward Liberalism and its defenders, harassing them while promoting their putrid and failed versions of economic systems that, throughout the world, served to destroy entire nations and peoples.\n\nNow, however, the government is on the right side, and with the shackles of socialism and populism about to be shattered from the people's arms, we must commit to reversing this process, even if it takes decades to complete."
 BRA.102.a: "Brazil will be Prosperous again."
 BRA.103.t: "Our Best Ally"
 BRA.103.d: "The agribusiness sector suffered more than any other during the Great Crises. Even before the Civil War, they endured the collapse of agribusiness, the Oil Crisis, and harassment by the red terrorists of the Brazilian Communist Party and the fake workers of the MST. Then came the Civil War, forcing many to abandon their fields and farms, severing supply chains for the few who survived, and bringing ruin to the vast majority of entrepreneurs.\n\nHowever, despite all their suffering and losses, the men and women of the countryside never gave up; they persisted and weathered every hardship, defending their lands from the communists and continuing to produce for the country, while the people of Brazil chose to turn against one another in the darkest chapter of our history.\n\nSuch resilience proved to be one of the main reasons we survived economically through the war against the Legalists and throughout the Civil War. And now that the war is largely over, the time has come to repay that loyalty by providing them with generous investments, faster access to credit, constant support for infrastructure reconstruction, and the supply of modern technologies and equipment."
 BRA.103.a: "The True Workers of Brazil."
 BRA.104.t: "Ending the Misery"
 BRA.104.d: "For decades, many state-owned companies have bled the Brazilian people dry like parasites, exploiting workers with poor working conditions and low wages, while providing terrible service to the public. The subway was late or didn't show up at all, the power went out constantly, and public services became synonymous with frustration and inefficiency. These companies, like rats, survived by draining the government's financial resources, turning tax revenue into a black hole of waste and corruption.\n\nAll this while a small group of privileged individuals grew rich at the expense of this inefficiency, \"sucking\" on the teat of the state; however, this era of cronyism and corruption is coming to an end, and a broad and profound series of privatizations will take place, with all worthless, bloated, and chronically deficit-ridden state-owned enterprises being transferred to the private sector, to those who know how to run a real business.\n\nThese new owners will do what the state was unable to do even with all the resources at its disposal; they will be the ones responsible for providing quality services to the population, for maintaining fair working conditions for their employees, and for operating without needing public funds every second.\n\nIn Brazil, there will be no more tolerance for companies that exist solely to drain resources, and from now on, every enterprise must contribute to the nation, so that a new era of productivity, financial responsibility, and results may begin, replacing the shameful past of mass waste, corruption, and cronyism."
 BRA.104.a: "So the stain can be washed away"
 BRA.105.t: "The New Replaces the Old"
 BRA.105.d: "The old Brazilian state was brought to the brink of total destruction during the civil war. Its institutions and its political, economic, and social arms collapsed, torn apart by the very people it had exploited for so long. Yet, in everything that has been wiped from the face of the Earth from the old order, a part of it still survives, carried within us. Mutilated, destroyed, barely breathing, it still lingers to the body like the remnants of a cancer after a failed surgery.\n\nAnd like a cancer, it will spread again; its leviathanic tentacles will take over the political system once more, infiltrate the economy again, and slowly all the progress we have made will be lost forever. We must prevent this from happening, save the Brazilian people from their oldest tumor. It must be cut out, torn out by the roots, thrown to the ground, salted, and finally trampled under the boots of the good people until nothing but memories remain.\n\nIn its miserable place, the seeds of a New State may be planted. A freer, stronger, and more honest State will be forged from suffering and death, so that the new Brazilian order may be built upon the values of patriotism, responsibility, and transparency, and so that the old customs that led us to our darkest period may be completely erased from the history of our Glorious Nation, replaced by those who truly care for the people."
 BRA.105.a: "Never Again will we be explored."
 BRA.106.t: "The Greatest Culture"
 BRA.106.d: "Sertanejo culture is the soul of Brazil. Born in the country's vast interior, it emerged from daily life in the countryside, from cattle drives, rodeos, the simple lives of rural families, and stories of hard work on the land. It began as the music and traditions of the sertão, but gradually spread throughout the nation as agribusiness expanded, with millions of Brazilians taking their roots with them to the big cities.\n\nNow, sertanejo represents much more than a musical genre; it embodies a completely different way of life from the city, one that celebrates family, honor, and hard work.\n\nIts songs tell the story of Brazil, our true story. From the classic duos to the powerful voices dominating today's concerts, they carry the emotion, suffering, joy, and resilience of the Brazilian people. Their beautiful melodies have conquered every corner of the country with lyrics telling stories of everyday life, even crossing national borders. Sertanejo is a cultural symbol of Brazil, a symbol of the pride, strength, and vitality of rural Brazil and its farmworkers.\n\nThis great culture must be preserved and promoted with pride. Not only are the values of respect for tradition and family present, but the appreciation of honest work and the deep connection to the land are what Brazil needs to recover after so many years of trauma. The government must support artists, festivals, and cultural initiatives so that this rich heritage continues to flourish and reach the hearts of younger generations."
 BRA.106.a: "Our Biggest Pride"
 BRA.107.t: "Entering the 21st Century"
 BRA.107.d: "At the start of the 21st century, Brazil was on the path to economic prosperity, on the verge of the commodities boom that would have catapulted us to the top. However, Lula was elected, and the flame of prosperity was replaced by the red star.\n\nWe possessed enormous potential; we had resources like no other country, a growing population, and favorable conditions that could have propelled us to the level of a first-world country. Instead, Lula and his followers chose corruption, cronyism, and short-term populism, squandering all our resources and letting our greatest opportunity for growth go down the drain.\n\nThey brought nothing but destruction and the strangulation of our economy. They persecuted honest workers and businesspeople for being wealthy and crushed the hopes of millions that one day Brazil would be a rich and prosperous country. They brought in organized crime, infiltrated it into every level of government, drained the public coffers, and tore our beloved country apart in the name of a corrosive ideology.\n\nThey left a long trail of misery, division, and national humiliation, but now that these parasites have truly been purged from the face of the Earth, Brazil can finally begin to look to the future with hope, as the misfortune and humiliation that the left imposed on us are behind us, and the nation stands ready and willing to pursue development, to attract foreign investment, to modernize its infrastructure, and to unleash the enormous productive potential of its people."
 BRA.107.a: "Brazil will look forward, and forward only."
 BRA.108.t: "SUBJECT: Report on the current state of fuel supply"
 BRA.108.d: "Mr. President,\n\nAs the country fractures into traitours cliques, I couldn't help but notice that the further escalation of current conflicts probably will cut off out fuel supply.\n\nIn order to prevent a lack of fuel for our army, I have ordered infantry and motorized soldiers to prepare evacuations of trucks full of gas, ethanol and biofuels to our fuel silos and refineries (both regular and provisional ones) to our stronghold.\n\nDue to our extremely high popularity among the truck drives, as seen by the start of the election protests, they often asked to join in on our sturggle against the leftist Legalists and do the job of bringing in fuel voluntarily.\n\nThis report should arrive to you as they dispatch our fuel in undisclosed locations."
 BRA.108.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA_good_job: "\"Good job, Heleno.\""
 BRA.109.t: "SUBJECT: Report on the worsening state of fuel supply"
 BRA.109.d: "Mr. President,\n\nIt is my duty as Chief Minister of the Institutional Security Office to inform you that I have received various reports with data warning us that the current usage of fuel is spiralling and projections show that we could not last half a year with this daily amount of use.\n\nThose same reports tell us that saving up fuel even more can be done but requires taking away civilian use in some way and applying effectively limitations to our armoured, mechanised and motorized divisions.\n\nBy involving the army and other sectors of the administration, I cannot take action before forwarding you a summary of the collected and receiving others. This documentation of mine has the intention of not just informing you, but advising you in your decision."
 BRA.109.a: "Respectfully, Gen. Augusto Heleno, Chief Minister of the Institutional Security Office"
 BRA_do_whats: "\"We will do what is necessary.\""
 
 ### INITIAL CIVIL WAR FOCUS TREE FLAVOUR EVENTS ###
 BRA.110.t: "An Inevitability"
 BRA.110.d: "A massive logistics complex stretched across countless hectares on the outskirts of a maximum-security zone in the interior of Mato Grosso do Sul, where four enormous, recently constructed warehouses stood out. Between them, trucks moved constantly, carrying various types of civilian and military supplies.\nInside the largest of them, row after row of shelves filled with military equipment reached the ceiling, as did another; meanwhile, the last two contained vast reserves of food and essential survival items.\n\nSergeant Carlos, in charge of Warehouse Food Two, the largest food storage in the complex, was guiding a senior Army officer who had recently arrived at the facility. As they walked, he couldn't help but notice the massive quantity of non-perishable and canned food, separated into carefully organized sections.\n\nThey stopped in front of a shelf filled with crates containing water jugs, thousands of liters of purified water, all stored away. The officer felt a chill run down his spine; it all seemed a bit excessive:\n\"Isn't this a bit much? I mean…\" He pointed to the shelf, where dozens of jugs stretched nearly to the ceiling. \"This looks like preparation for the end of the world.\"\n\nCarlos nodded, understanding the officer's concern. \"We're preparing for all possibilities,\" the sergeant began to explain. \"Even though peace is the desired outcome, war is still the most likely scenario. And these complexes, along with others throughout the territory, are meant to sustain our forces and the population in extreme cases, such as the severing of supply lines or prolonged conflict.\"\n\nThe officer nodded, understanding the necessity of such an operation; however, as he paused to think about it all, he couldn't help but wonder:"
 BRA.110.a: "What happened to my country…"
 
 BRA.111.t: "The Last Chance"
 BRA.111.d: " In a heavily guarded and secret location on the border between the National Government and the Loyalist Army, a team of high-ranking diplomats from Brasília sat across from General Marco Freire Gomes and Loyalist commanders. The room resembled a nuclear bunker, lit by bright ceiling lights, with documents and maps scattered across a large wooden table.\n\nBoth sides could feel the tension in the air, and both knew that this could be one of the last chances to save Brazil from tens of thousands of unnecessary deaths. After a few seconds of staring each other down, the lead diplomat from Brasília began to speak, his tone loud and confident as he laid out Bolsonaro's proposals.\n\n\"Brasília promises that, should the Loyalist Army surrender its forces and lay down its arms peacefully, it will grant mass amnesty to the soldiers and lower-ranking officers of that force who return to civilian life. It also guarantees fair and transparent trials for those accused of treason, with full legal representation and respect for due process.\"\n\nHe paused for a few seconds, waiting for some kind of reaction from Gomes, who was waiting for him to finish. \"Mid-level commanders who choose to cooperate with Brasília will be guaranteed personal safety and the possibility of reinstatement into the Army under strict penalties.\"\nFreire Gomes raised an eyebrow; the diplomat continued:\n\n\"As for high-ranking commanders, be it Army generals, Navy admirals, and the leaders of the political parties Federation of Brazil for Hope, United Popular Labor Front, Movement Toward the Future, Democratic Alliance for Peace and Legality, and Union for Brazilian Order and Progress, they will be placed under house arrest while awaiting trial, which will be fair and strictly follow due process.\"\n\nHe paused; Freire Gomes and the other commanders remained completely silent, their expressions indecipherable. Both sides seemed confident that the other would give in."
 BRA.111.a: "Either for Brasília, or Salvador"
 
 BRA.112.t: "Our Army"
 BRA.112.d: "Jair Bolsonaro stood before a vast sea of soldiers, thousands upon thousands of men and women dressed in green uniforms, assembled in perfect formation on the vast field. The Brazilian flag, flying from a tall mast behind the president, fluttered proudly in the wind.\n\nAs he looked out at the ranks, all eyes fixed on him, a strange and powerful sensation welled up in his chest, making his stomach churn.\nFor a brief moment, he felt like Caesar, the great leader of Rome, addressing his legions, a man on the threshold of history, ready to defend the soul of his nation.\n\nHe swallowed hard:\n\n\"Soldiers of Brazil, listen to me! This country was stolen from us from the very beginning by the red fanatics, those who never cared about the people. Our homeland has been ruined by the PT and Lula through corruption and their lies.\" He paused for a brief moment. \"It was them! They dragged the Armed Forces through the mud, treating our beloved soldiers like criminals while lining their own pockets! Through socialism, this nation has been destroyed! Lula's socialism betrayed everything that makes us Brazilian; they turned this nation full of potential into a land of misery, death and corruption!\"\n\n\"But now!\" He raised his voice, pure rage pouring from his throat. \"Now that this country has been completely destroyed! Now that millions suffer at the hands of terrorists, the time for them to pay has come! All of them, from the petists and communists to the nazist and fascist terrorists, will pay the full price for their betrayal! So painful was the suffering and so great their betrayal that nothing awaits them but a backlash that will be etched into Brazil's very flesh, a vengeance that will be immortalized so that future generations may remember what happens to traitors!\"\n\nAs uttered the final sentence, he paused. His eyes swept over the thousands of soldiers before him, a breathtaking view for the most disciplined of men as they shouted, among many things: "
 BRA.112.a: "Selva! Selva! Selva!"
 
 BRA.113.t: "Our people"
 BRA.113.d: "Across Brazil, televisions that still had power flickered with static for a few moments, interrupting the news broadcasts in every region before the picture stabilized again.\nThen, President Jair Messias Bolsonaro appeared, seated at a table with his arms resting on the wood, a Brazilian flag hanging behind him. His expression was calm yet firm as he looked directly into the eyes of the Brazilian people.\n\n\"Citizens of our beloved homeland,\" he began, his voice strong. \"These are difficult times. Times never before seen in the history of our great country, times when many lose hope and turn to violence, despair, or anger.\"\n\nHe took a deep breath.\n\n\"I, and the Government in Brasília, understand this pain, this fear, and this uncertainty that so many of you are feeling right now. Since the beginning of this crisis, we have seen the immense suffering that division, the recent uprisings, and the collapse of our economy have brought to millions of Brazilians.\"\n\n\"But my duty, as President of the Republic, is to assure all of you, whether Brazilian or foreigner on our soil, that we will not abandon you. All federal forces, from military police to Army soldiers, are working tirelessly, day and night, to restore order and bring peace back to our country, to suppress the criminal acts of insurgency and treason by the Legalists and other extremist groups scattered across this nation.\"\n\n\"The suffering, misery, and pain will end, and stability will return. Brazil, resilient as it is, will overcome this moment of trial, and with the unity of our people, emerge stronger, more united, and safer. I ask all of you to trust the government and the Armed Forces. Together, we will make this country grow again.\""
 BRA.113.a: "God Above All, Brazil Above Everyone."
 
 BRA.114.t: "Our Diplomats"
 BRA.114.d: " Inside the Planalto Palace, in a meeting room with white walls and reinforced doors, four of Brazil's most experienced diplomats, who would one day be posted in the exterior meeting with Russians or Americans, now sat around a polished table. They looked at one another, the tension in the air palpable as they awaited instructions.\n\nThen, a government official entered the room carrying a black, sealed briefcase, taking his place at the head of the table. The other four sat up straight in their seats, aware that this could be one of the last negotiation missions they would undertake with the government of Salvador.\n\nThe man placed the briefcase on the table, looking calmly at the four of them:\n\n\"You, as you have been informed and summoned here to do, will be prepared for a meeting with representatives of the Salvador government at the border, should they accept the invitation.\" He paused for a second, considering his next words.\n\n\"Inside this briefcase,\" he passed it to one of the diplomats with a hand, letting it slide lightly across the marble table, \"you will find all the information necessary for the meeting, including what you should and should not discuss, understood?\"\n\nHe didn't wait for a response, continuing: \"To save you some reading, if they choose to surrender, we will offer fair and impartial trials, in accordance with the Federal Constitution, with all the legal guarantees that come with it. Additionally, low-ranking military personnel and mid-to-low-level political figures will be granted amnesty in the event of a peaceful surrender.\"\n\n\"It is also good to mention that, in the case they accept this meeting and do appear in it, you four are expected them with the highest of the courtesies, not mattering what they do or say, as long as they do not refuse our proposal, okay?\""
 BRA.114.a: "The man looked at the four of them, and they nodded."
 
 BRA.115.t: "Protect our Heart"
 BRA.115.d: " The sun hung low on the horizon, casting long shadows across the buildings of Brasília. Colonel Rafael Mendes stood on a hill overlooking the city, his hands clasped behind his back.\n\nAt his side, his partner, an Army major, observed the same scene with a serious expression. Below them, the capital was rapidly transforming. Armored vehicles traveled along the wide avenues while soldiers and construction workers labored in coordinated teams to erect concrete barriers and steel barricades at the main intersections.\n\n\"You know, I don't know why we thought there would be a peaceful resolution,\" said Mendes in a low voice, without looking at his partner. \"It's as if the government really expected the socialists to reach a compromise with us.\"\n\nThe Major nodded silently, watching columns of elite Armed Forces troops take up positions around the Planalto Palace, the Three Powers Plaza, and other government buildings. He sighed deeply, a long, heartfelt sigh; he had never in his life thought he would see such scenes unfolding, nor that he would be a part of them.\n\n\"Still, it's sad,\" he began, this time gazing at the sunset. \"We offered them everything, and yet they chose to destroy this nation in the name of a thug.\"The two officers remained silent for a moment, the only sound heard being the distant rumble of heavy machinery and orders being shouted to soldiers throughout the city."
 BRA.115.a: "For this desecration, they will pay.\" Said Rafael."

 ### POLITICAL MUSIC CHAIRS EVENTS###
 BRA.120.t: "The Christians"
 BRA.120.d: "The United Christians for Brazil Front is one of the most powerful and influential factions within our administration. Composed of a broad alliance of Evangelicals and Catholics, it represents the vast majority of the religious base in our territories. Emerging following the signing of AS-III, its platform focuses almost entirely on social and moral issues that it considers essential for the country's renewal.\n\nParts of their rhetoric include the complete eradication of the secular state, arguing that Brazil must be guided by Christian principles, whether in the areas of law, education, public morality, or health. Together, they advocate for the criminalization of abortion, the protection and promotion of the traditional family, and the criminalization of ideologies they consider subversive and destructive, such as socialism, communism, integralism, and radical offshoots of the right and left.\n\nLed by the charismatic and prominent evangelical leader Silas Malafaia, this faction has become a guiding light for the faithful, and through sermons, massive public mobilizations, and participation in government decisions and as advisors to Bolsonaro, they will ensure that the Christian faith remains and grows as a force in national politics, and will work to set the nation on the path of Jesus Christ and the Church."
 BRA.120.a: "God Above All"
 
 BRA.121.t: "A Capital for Christianity"
 BRA.121.d: "air Bolsonaro was sitting at his desk in the Planalto Palace late into the night, reviewing a thick stack of documents on government administration and reports from the front lines. The room was silent, the president illuminated by a warm-toned lamp.\nTwo of his aides were seated in front of him, occasionally making comments as they turned the pages. As Bolsonaro examined the latest list detailing the administration's composition by party, he paused abruptly and leaned back in his chair with a thoughtful look.\n\n\"You know,\" he said, catching the attention of the two. \"I was looking over some names here,\" he said, tapping the paper. \"And almost all government positions are held by politicians from the Christian Front. There are some pastors, priests, and other faithful, they've taken up a lot of space.\"\n\nOne of the aides nodded slowly, his cross necklace briefly catching the President's eye. \"It was a process, Mr. President, but they were essential to us; they brought us a lot of support from the Christian community, both domestically and abroad.\"\n\nBolsonaro looked at the documents before gazing out at the city through the window, the light coming from the few illuminated buildings and streetlamps. \"I had never really stopped to read these documents. Not for a long time, but I do feel the change when I drive through the city.\"\n\nThe other, older aide smiled. \"Yes, Mr. President, we all feel it. After all, the people are recognizing what has been hidden from them for so long. A true Christian government, with you obviously at the helm, will do wonders for this country, we know it.\""
 BRA.121.a: "An ancient hymn echoes in all minds…"
 
 BRA.122.t: "The Patriots"
 BRA.122.d: "The Homeland Salvation Front is the militarist faction within our administration, composed of high-ranking generals, public security experts, intelligence officers, and fervent patriots.\n\nHaving been one of the most influential blocs within the now-defunct APB, they represent those who sacrifice their lives for the Nation on the battlefield, embodying a disciplined and hierarchical approach to Brazil's security. Furthermore, they also believe that the Armed Forces, particularly the Brazilian Army, are the strongest entity within the nation, and as such must lead it and ensure both Brazil's survival and its greatness.\n\nTheir platform is, above all, the absolute prioritization of national defense, being both internal and external, advocating for military training that is more rigorous than the current system, the expansion of civic-military schools and patriotic curricula in schools and colleges, the strengthening of public security institutions, citing the prevention of future insurgencies, peacekeeping, and the restoration of order in the country, and also promoting the relaxation of certain battlefield engagement policies.\n\nLed by General Augusto Heleno, widely respected for his integrity and strategic vision, the Front for the Salvation of the Fatherland works tirelessly to ensure that Brasília eventually emerges victorious from the terrible civil war ravaging the country, so that in the future it may guide a renewed Brazil, imbued with strength, discipline, and courage, with a people stronger than ever, filled with love for the Nation."
 BRA.122.a: "Brazil Above All."
 
 BRA.123.t: "Heroes of the past"
 BRA.123.d: "The morning sun bathed Brasília in a golden light as a large crowd gathered in a newly opened square. The air carried the fresh scent of grass and the flowers planted around the monument, which were a beautiful shade of green.\nFamilies were together at the event, many of them with children on their shoulders or by their sides, while other civilians watched the inauguration with emotion and excitement.\n\nFor the first time in many difficult years, the atmosphere was truly hopeful; people smiled at one another, exchanged words, or simply gazed at the draped monument and the men presiding over the inauguration ceremony, almost as if nothing bad were happening in the country.\n\nOne of these men, a government representative, took a microphone and stood in front of the statue; he began to speak, his voice resonating loud and clear across the square:\n\n\"Today, on this beautiful day, we honor a brave man from our history, one who dedicated his life to Brazil: Dom Pedro II. He was a man who ruled with wisdom and love for this nation in difficult times, but he believed in us, the Brazilian people, and brought education, science, justice, and, above all, progress to this country. His legacy in modern times is being deliberately erased by the leftists and the Bolsheviks in Salvador, yet we, and you, must remember him, for in him we will find the inspiration to weather these turbulent times.\"\n\nThe crowd responded with warm applause and shouts of celebration, and as the national anthem began to play in the background, a deep sense of peace and happiness washed over those present. The monument, standing as a powerful reminder that difficult times have been overcome by strong men before, resonated in the minds of the crowd, who from that day forward would carry a new sense of patriotism, hope, and connection to Brazil's great past."
 BRA.123.a: "To remember the past is to be patriotic"
 
 BRA.124.t: "Open Their Eyes"
 BRA.124.d: "In our glorious Republic, almost all citizens call themselves patriots, but in the midst of this terrible civil war, there are differences: the Patriot and the False Patriot.\n\nA true Patriot is not one who merely salutes the flag, but one who loves his people, Brazil's culture, and the great history of this nation with all his heart. He is ready for anything, ready to kill, to die, and to give everything he has to defend what his ancestors built through sweat, tears, and blood, and what his children deserve to inherit. He does not seek power for himself; he does not seek glory or riches. He works for the nation, he fights for the nation, and he dies for the nation.\n\nTake a look. A simple man from the countryside, who has nothing but the farm he inherited from his father and his large family. Standing tall and proud, he salutes President Jair Messias Bolsonaro. He has left his life in the countryside, his home, to fight the red demons that threaten to destroy everything we know, even knowing that this may cost him dearly. He carries his rifle with pride, and even as he stands ready to crush the socialist plague, there is no hatred in his eyes, only the determination and joy of serving something greater than himself.\n\nThe false patriot, however, uses green and yellow as a mask. He speaks of love for the Nation, yet behind closed doors he fights only for personal glory and the domination of other peoples. He hates Brazil; whether he is a Bolshevik or a fascist, he seeks to destroy everything that is sacred to our people, culture, and history. Arrogant and proud, they seek violence and disunity, destruction, and civil war.\nAgents of Chaos.\n\nTake note. They operate in the shadows, waiting for the right moment to strike. An arrogant, self-important, violent, and abusive man raises his arm in a Roman salute or a clenched fist while calling for the death of others. He manifests himself in different places, being from the Amazon, where they murder honest landowners whose only crime was defending their own lands, to the South, where they hang decent people if they do not follow their doctrine. Deep down, he hates his own nation and wants to destroy Brazil, cloaking himself in the guise of nationalism to wreak havoc.\n\nToday, the differences are still not clear to everyone;"
 BRA.124.a: "But, you, citizen, are you a real Patriot?"
 
 BRA.125.t: "The Flag Flies Proudly"
 BRA.125.d: "An imposing military parade was taking over the main avenues of the country's capital, Brasília, under a clear blue sky. A breathtaking number of soldiers marched on. Tens of thousands, perhaps even more, marching in perfect formation, their impeccable green uniforms and their boots striking the pavement in a synchronized rhythm. Behind them, tanks and armored vehicles advanced slowly, following them like knights behind their princesses, while fighter jets roared through the beautiful skies in tight formation.\n\nOn every flagpole, on every building, at every corner, the nation's mighty flag fluttered proudly, while the crowd, composed of veterans of past battles, soldiers' families, and workers, reacted euphorically, applauding, shouting, and waving smaller flags with tears in their eyes. Everyone was there celebrating the triumph of Brazil, for after years of chaos, violence, and death, decisive victories in the war against the Legalists showed that Salvador's tyrannical regime was nearing its long-awaited end, and there, everyone demonstrated the strength of their hopes.\n\nIn the midst of this crowd, a woman, the mother of two children, watched the passing troops intently. She was one of many who had lost her brave husband to the war.\nTears streamed from her eyes as she watched that glorious display of power, tears of happiness and relief, for for the first time in a long time, she felt truly safe. She was happy because, for the first time, she saw that Brazil had a proud and promising future ahead, free from the damned Bolsheviks who had taken her husband's life.\n\nThey would pay for what they had done. Freire Gomes, Haddad, and all the other red traitors would pay. Deep in her heart, ever since her husband's death, she had longed to see all those traitors with their necks wrapped in tight ropes, begging for their lives before the whole world, and now, at that moment, she was certain that Brazil was finally on the path to true justice, goodness, and patriotism, where her husband would finally be avenged\n\nShe wiped the tears from her eyes and hugged her children tightly, thinking hopefully that, this time, her children would grow up in a country not destroyed by socialism, but rather made prosperous by nationalism."
 BRA.125.a: "This time, the Military Will Never Fall."
 
 BRA.126.t: "The Conservatives"
 BRA.126.d: "The Brazilian Family Front is the conservative wing within the Bolsonaro administration. Composed of family men, evangelical leaders, local workers, and traditionalist voters, this faction represents the moral backbone of the national government. It brings together millions of Brazilians who believe in the country's potential and who, above all, believe that the power of all things begins with the family and with God. Since 2018, its influence has been growing, establishing itself as Jair's main faction.\n\nIts platform is simple, focusing on defending the traditional Brazilian family, protecting life from conception, recognizing that the only valid marriage is between a man and a woman, and upholding Christian and patriotic values, while firmly opposing gender ideology and the erosion of moral standards in society.\n\nLed by Flávio Nantes Bolsonaro, son of the beloved President, this faction works tirelessly to ensure that Christian ethics and traditional values remain central to government policies. Through their work in Congress, their roles as presidential advisors, and their close ties to religious communities, they serve as the voice of a conservative, traditional, and above all, Brazilian Brazil."
 BRA.126.a: "A Brazil for Real Brazilians"
 
 BRA.127.t: "Return to tradition"
 BRA.127.d: " Flávio Bolsonaro stepped out of his black SUV under the beautiful moonlight of the night in Brasília. The Planalto Palace, an imposing building he had visited so many times, stood before him with its white, luminous, and majestic facade. His father, the beloved President Jair Messias Bolsonaro, waited at the top of the staircase with a serene yet proud smile.\n\nThe two men embraced for a long moment, the weight of the past few years hanging between them before they stepped apart.\n\nFlávio looked him in the eyes for a few seconds, holding both his shoulders.\n\n\"Dad, it's done,\" he said happily. \"The Party has finally managed to get rid of those people, and now we control the government.\" \"Congress will pass whatever we want; all the ministers will obey you, the Party, and me, it's all ours, Dad.\"\n\nBolsonaro nodded slowly, gently pulling away from his son's grasp, not wanting to offend him, after all, he was happy.\n\nThe two began walking toward his father's office, his right hand resting on his son's shoulder as they walked.\n\"Look, son, I'm happy for your achievement. After all,\" he swallowed nothing, \"it's an achievement for all of us, for the family too, but especially for you.\" They continued walking a little further until they reached the door; he removed his hand from his son's shoulder and opened the door. \"But I have to say, it's quite a responsibility.\"\n\nThey went inside. The door closed behind Nantes, who looked at his father as he sat down. \"Yes, Dad, I realize that. But it's nothing you haven't gone through before, nor anything I can't handle.\"\n\nBolsonaro gave a discreet, satisfied smile;"
 BRA.127.a: "Then let's get to work, my son."
 
 BRA.128.t: "The Liberals"
 BRA.128.d: "The Freedom and Prosperity Front is the faction within the administration that represents those who advocate for the free market, entrepreneurs ranging from small to large-scale, classical liberals, defenders of individual rights, and advocates for freedom of expression.\nThis wing offers a clear and consistent vision of where the Brazilian economy should be headed, believing that the nation's true revitalization will come only through the reduction of the bloated state and the opening of the economy to foreign capital.\n\nIts platform, among many other things, is based on profound and lasting economic reforms. It advocates for the widespread privatization of inefficient state-owned enterprises, the strengthening and expansion of property rights, and broad tax cuts to stimulate growth and reward hard work and productivity.\n\nTheir main thesis, the \"bloated state,\" argues that excessive regulation and a high tax burden have stifled opportunities for workers and entrepreneurs, and that only by cutting away this unproductive mass from society and the government can Brazil generate the wealth necessary to lift its impoverished population out of poverty.\n\nLed by Felipe d'Avila, the party works to transform Brazil into a modern, dynamic nation brimming with opportunities. Through its commitment to liberal ideals, it seeks to move the country away from decades of failed statism toward a future defined by wealth, entrepreneurship, and economic and civic progress"
 BRA.128.a: "Towards a Free Country"
 
 BRA.129.t: "Um Brasil Livre de Verdade"
 BRA.129.d: "In an elegant ballroom of a sumptuous residence in Brasília, a festive atmosphere was in full swing. Business leaders, bankers, industrialists, and high-ranking members of the Freedom and Prosperity Front party were gathered beneath sparkling chandeliers and at elegant tables, raising glasses of fine wine and champagne.\nAfter all, following such a stressful period, they had secured the Bolsonaro administration.\n\nLaughter and conversation echoed through the room, and a wealthy industrialist wandered through the hall with his glass of imported whiskey. He approached a group of men and women, all beautifully dressed, sat down in an empty chair, and began to speak as soon as the others fell silent.\n\n\"And we thought we'd lose our grip on things, didn't we?\" he said, confidently. Seeing that his companions liked what he said, he continued. \"The poor had their chance, didn't they? With that scoundrel Lula and his socialist cronies. Did you see what happened in the Amazon? They're so insolent, all they know how to do is make demands, but it's good that we'll now be back in power.\"\n\nThe group gathered around the table, almost in unison, nodded in agreement. It was then that one of the women present,the wife of a major agribusiness executive, whose efforts had been essential in cooperating with the Army to feed the troops, spoke up, with satisfaction evident on her face and in her tone of voice.\n\n\"The civil war isn't over yet, I must remind you, but it's truly a pleasure that we can finally work freely. I am optimistic about Brazil's future, gentlemen.\"\n\nEveryone seated there smiled in agreement. \"I think we should toast to our future,\" said the woman, and everyone did as suggested, raising their glasses filled with expensive liquors and toasting."
 BRA.129.a: "Liberty, Money, Brazil"

### CIVIL WAR MILITARY TREE FLAVOUR ###
 BRA.130.t: "Um Dever Sagrado"
 BRA.130.d: "Moving slowly through the dry heat of the Cerrado, a long convoy of military trucks and buses stretched along the road after leaving Brasília. As the vehicles carrying hundreds of new recruits and veteran Army soldiers passed by, the dust rising behind them settled heavily on the wheels as they made their way toward the front lines.\n\nThe air inside the truck was heavy and hot, mingled with the smell of sweat, and among the many passengers was a young soldier, just over nineteen years old, who had enlisted a few weeks after Operation Green and Yellow Dagger. He watched the landscape recede, gripping his rifle tightly. Seated beside him was a veteran of the security forces, a former police officer turned soldier who wore a hard, grim expression; his face was marked by deep furrows and a permanent frown.\n\nThe convoy began to pass through a small rural town, once relatively prosperous but now completely abandoned, with the walls of the houses riddled with bullets, collapsed roofs, and tall brush slowly taking over the street. A counterinsurgency operation, the man assumed. Straining his eyes a little more, he could see through the broken windows of a few houses that both the furniture and personal belongings lay untouched, as if awaiting the return of their owners who would never come.\n\nIt was then that his thoughts were interrupted by a voice, the former policeman.\"You people must think that this war is merely ideological, that the socialists are traitors, and that's the end of the story,\" he said, his voice harsh, gazing intently at all his fellow soldiers. \"I tell you, it is not.\" The Legalists are, besides being traitors, they are devilish creatures that kill entire families and burn cities to the ground. They did this to my family and want to do it to yours, and not only do they want to, but they will, if you let them.\n\nThe others listened intently, nodding in agreement or looking at him with approving expressions; they knew it was true; however, hearing it from someone who had borne the brunt of the Reds' hatred made them tremble, tremble with hatred, fear, and determination, for they realized that the killing machine the man had just spoken of was the very one they were about to destroy."
 BRA.130.a: "Good Against Evil, A Battle For Brazil"
 
 BRA.131.t: "The Best of the Best"
 BRA.131.d: "In a meeting room inside the Planalto Palace, the beloved President Jair Bolsonaro sat at the head of the table, surrounded by the most important generals of the Brasília government. Everyone was attentive, ready to respond to any order or take in any information the president might share. The president's expression was etched with a weariness few had ever witnessed; the weight of the conflict was affecting him more than it was affecting the military.\n\nHe looked at each one, and then began to speak, his tone firm and clear:\n\"From this moment on, the military high command will have full responsibility for all operational capabilities. This includes tactical planning, decision-making on the battlefield, and the allocation of resources.\" As he spoke, he almost let a look of relief slip, but he held it back. \"Your experience in matters of war is invaluable, and each of you possesses the experience and discernment necessary to lead us to victory; therefore, I trust you to make the decisions that need to be made.\"\n\nThose in front of him exchanged glances, shocked but quickly regaining their composure. They nodded slowly at the president, still processing his orders. One of the men, not as experienced as the other veterans, manifested himself: \"Mr. President, with all due respect, don't you think this would place too much of a burden on our…\"\nBolsonaro raised his finger, and the man fell silent.\n\n\"I am entrusting you with the most important task of your lives. I don't care how much stress, how much work, or how much suffering you go through, failure is not an option, or we'll all be hanged in front of the fucking Planalto. Understood?\" The men clenched their jaws; the one who had spoken nodded silently, and the others followed suit."
 BRA.131.a: "\"Great, you are all dismissed.\""
 
 BRA.132.t: "With War, All Becomes Harsher"
 BRA.132.d: "A young recruit, who had been a soldier for only a few months, was with his platoon behind a wall in one of the many houses in abandoned towns in the interior of the state of Mato Grosso; they were all moving cautiously behind their squad leader. Sweat trickled down his forehead to his neck, a testament to the intense sun they faced every day.\nThey were simulating an attack on a hideout of guerrillas from the Revolutionary Communist Party.\n\nShouts and occasional gunfire echoed through the empty streets as the soldiers practiced clearing houses and rooms, one at a time. In the town's open fields, overgrown with vegetation, the training was even more intense. The platoon advanced under the tall cover of the grass, practicing encirclement and neutralization maneuvers while their sergeant shouted orders to him and his comrades, demanding quick movements, coordination, and faster thinking.\n\nAs soon as the ambush simulation began and they broke down the house's door, the recruit and his colleagues had to react almost instantly, storming into the house and shooting at anything that moved, while retreating, ducking behind a window, moving deeper into the house, or returning to the side of the house in search of cover.\nIn the end, they successfully completed the simulation.\n\nSitting on the ground, far from the houses used in the operations, the boy looked up at the sky, reflecting on how Brazil had reached that point. As a boy, he had never imagined that his adult life would be spent executing Bolshevik terrorists. He shook his head, stood up, and returned to his comrades"
 BRA.132.a: "Only the strong and trained will survive."
 
 BRA.133.t: "Fanatics, The Most Useful"
 BRA.133.d: "The midday sun, always intense in that region, beat down on what remained of what had once been a modest town center: burned-out buildings and shattered windows of the few stores still standing, the streets littered with burned-out cars, bodies, and rubble.\nAs they approached the city's old city hall, the group of Army soldiers noticed a large black flag bearing the president's face fluttering outside the top floor. They moved closer, noticing movement.\nLocal militiamen and members of the infamous Nationalist Liberation Army, an ultra-Bolsonarist militia, stood guard with rifles in hand, all watching intently as the vehicle approached, bearing the Brazilian flag\n\nThe vehicle stopped in front of the militiamen, and an officer stepped out, flanked by several soldiers holding their weapons, while other vehicles approached in the background. The militiamen knew why he was there, so they cleared a path for the man, who, without looking them in the eye, walked toward what had once been the doorway and entered.\n\nInside, it was no better than outside; the walls were stained with blood, and bullet holes were still visible. A strong odor filled his nostrils, but he couldn't make out what it was, so he made his way down the destroyed hallway and up the staircase until he reached the top floor, the place where the former mayor had once sat and where the militia leader now used as his private lounge.\n\nRelaxed, with his feet up on the wooden desk, a tall, muscular man stared at him; with one eye whitish, he watched the officer approach with the other. They stared at each other for a few seconds, and then the officer spoke, firmly but respectfully. \"Your men fought bravely here. Brasília recognizes your efforts and courage, and for that reason, as previously notified, we wish to formalize this cooperation.\" He pulled up a chair and sat down, looking uncomfortable. \"In exchange for integrating your forces, your men will receive better equipment, regular supplies, ammunition, and leadership roles in any upcoming battles.\"\n\nThe one-eyed man listened intently, taking his feet off the table and sitting up straight, his face serious. His expression shifted, and he began to nod slowly."
 BRA.133.a: "\"As long as you keep your promises, we have a deal.\""
 
 BRA.134.t: "The Greatest Army"
 BRA.134.d: "In 2022, when the presidential elections were stolen by the Bolsheviks and socialist forces were preparing to return to power, the Armed Forces advanced with courage and determination. They captured The Great Traitor, his Puppet, and his Judge, preventing our beloved country from surrendering to the very same Reds who had previously caused so much harm to the Nation. After the agitators and communists began stirring up the population, the brave soldiers became the last line of defense for decent people against these evil forces.\n\nThen, the Great Tragedy began, devastating families and tearing apart the body of our homeland as if it were nothing. Yet those who could have stayed home, who could have saved their own families and fled abroad, left them behind with tears in their eyes, knowing that was the best thing to do. They endured extreme conditions and faced a relentless enemy.\n\nThey wept, sweated, and bled. Many will never return to their wives and daughters; many left their mothers and fathers waiting endlessly at home, yet it was through the sacrifices of these great heroes that the homeland was saved from the Marxist communism of Luís Inácio and his henchmen; it was through their sacrifice and that of all who fought that the people can breathe again, knowing that the Legalist plague has finally been eradicated and its perpetrators brought to justice."
 BRA.134.a: "The Greatest Army for the Greatest Nation"
 
 BRA.135.t: "Our Internal Defense"
 BRA.135.d: "The Commander-General of the Mato Grosso State Military Police was sitting alone in his office, the late-afternoon light filtering in through the blinds. A sealed folder, stamped \"Highest Priority,\" had just been handed to him by a representative from the administration in Brasília.\nHe was tired and wanted to go home, but he forced himself to open it.\n\nHe began to read. Detailed reports on the current state of the civil war, including other battlefronts and regions, and operations against the Loyalist Army that were about to begin. The documents were extensive, and the folder, thick, covered troop movements, front lines, and logistical challenges in various areas, not only within the commander's state but throughout the territory controlled by Brasília.\n\nHe came to a specific section that caught his attention: the intelligence reports.\n\nThese focused on the state of Mato Grosso, specifically on guerrilla cells operating in rural areas of the state, communist agitators in schools and universities, and union leaders who posed a threat to the administration.\n\nThe reports included specific profiles of targeted leaders among the guerrilla, union, and university groups, along with recommended actions for monitoring and neutralization.\n\nThat, he thought, was a change, a good one. He closed the folder after one last quick read and leaned back in his comfortable chair, letting out a long sigh. He recalled the early stages following Operation Green and Yellow Dagger leading up to the civil conflict, when federal authorities favored the use of the Armed Forces and attempted to marginalize the Military Police nationwide."
 BRA.135.a: "\"Well, that's a start\""
 
 BRA.136.t: "Against Traitors, Not Friends"
 BRA.136.d: "In an open field in the state of Tocantins, a crowd had gathered, thousands of military police officers, all strictly arranged in separate blocks, the sun causing them to squint. They had been transferred from Brasília just a few days earlier, and now they stood at attention, holding their rifles firmly against their dark, dusty uniforms from the long journey. A makeshift podium had been set up in front of this immense group.\n\nA senior officer stepped onto the podium, gazing intently at the sea of faces, many of whom he had served alongside for years. He began to speak, his voice firm yet tinged with emotion:\n\n\"I know what you're feeling right now. Many of you have friends on the other side of the border. Coworkers. Perhaps even parents.\" He looked at everyone, slowly. \"I feel the same way. This is not what any of us wanted; after all, we joined the force to protect our people, not to fight against them. But listen to yourselves.\" He paused, dramatically. \"These are no longer our friends, nor our colleagues, nor even our family members. They, and they alone, chose to join the Bolsheviks!\"\n\nHis voice choked with emotion as he continued. \"I'm not happy about this. It breaks my heart every time I think about it. But if they've taken up arms against the nation, if they've allied themselves with the criminals we fight, with violence and misery, then they've chosen their path. They are traitors, and they deserve whatever comes their way.\"\n\nHe paused, straightening up, his tone becoming firm and resolute. \"We are the Military Police, the best there has ever been. We protect order and we protect Brazil. And if the only way to fulfill our duty is to execute all those we once loved, so be it! For we do not fight for ourselves, but for Brazil!\"\n\nAs he finished, a roar erupted from the crowd, who raised their rifles high, shouting in unison:"
 BRA.136.a: "\"Death To Petists! Death To Salvador!\""
 
 BRA.137.t: "Horror and Terror"
 BRA.137.d: "A long convoy of armored vehicles was moving slowly through what remained of a semi-urban city that had once been under Legalist control. However, to the shock of the soldiers inside the vehicles, they saw what was left of the city. The streets, once partially orderly, had been transformed into a hellish landscape. Houses lay in irreversible ruins, many with collapsed walls and roofs blown open by bombs. Piles of rubble mixed with metal were scattered everywhere, shards of glass covering much of the sidewalk where citizens once walked.\n\nThe air was thick and putrid. A smell of smoke, burnt rubber, and the unmistakable metallic odor of blood filled their nostrils. A few charred tanks and military vehicles rested against houses or the remains of buildings, and as they advanced through the city, they began to realize they would face almost no resistance, noting the absence of Legalist soldiers, who had likely been wiped out, with the rest having fled.\n\nIn the streets and near the main road, the bodies of civilians and combatants lay scattered among the rubble, some leaning against walls, others sprawled across the streets and sidewalks, all dead. One of the soldiers noticed that the few surviving residents were staring at the soldiers and vehicles with vacant, hateful gazes, some from inside their homes and some, more courageous, out on the streets, forcing some soldiers to get out of the lead vehicles to keep the civilians at bay, pointing their rifles to prevent any sudden movements by the citizens.\nThe atmosphere was suffocating, a vision of hell painted across what must once have been a vibrant city.\n\nA young soldier, pale and visibly shaken, leaned out of his vehicle and vomited, landing on the asphalt. The others remained silent, their faces somber as they surveyed the destruction as they advanced. The scale of the destruction was worse than anything they had ever seen; entire neighborhoods had been reduced to rubble. The smell of death permeated everything.\n\nThe same soldier who had vomited could no longer bear the sight. He looked down at the floor of the vehicle, closed his eyes, and, his voice choked with emotion, began to whisper:"
 BRA.137.a: "\"Jesus Christ, forgive us for our sins…\""
 
 BRA.138.t: "Their Group, Their Rules"
 BRA.138.d: "Jonard, a stocky man and leader of a local group, was seated at a rustic wooden table inside his militia's main training base, surrounded by his inner circle of commanders and financiers. The room was dimly lit, with maps of the front lines scattered across the table and weapons leaning against the walls. He was holding a sealed letter that had arrived that morning from the local Army officer.\nHe opened it\n\n\"Commander Jonard\"\n\n\"After observing your group's performance in recent clashes and noting its effectiveness in pacification operations, the Armed Forces command has decided to grant your ‘Liberdade ou Morte' group full operational autonomy in the field. You and your men are authorized to conduct operations using your own methods and rules of engagement.\"\n\n\"However, there is one caveat. Your group must notify the Armed Forces Central Command before carrying out any medium- or large-scale operation that could interfere with Brazilian Army operations or strain our supply lines. As long as you coordinate and link larger campaigns with those of the Brazilian Army, you are free to fight in whatever way you deem necessary to defeat the Government of Salvador.\"\n\n\"Signed: Brazilian Army Command in the City of ….\"\n\nAs he finished reading the letter, he couldn't hide the smile on his face, and he saw that the others were equally excited about their newfound freedom. The man picked up the letter again, folded it, and passed it across the table to one of the commanders, and, enthusiastically, said:"
 BRA.138.a: " \"Inform the men of the new rules.\""
 
 BRA.139.t: "Snakes Within"
 BRA.139.d: "A small town in Mato Grosso was jolted awake by the roar of artillery and the crash of bombs falling from the sky and hitting the ground.\n\nCommunists were staying there, using the small town as a shield to remain hidden. However, they were discovered, and now, with them completely disguised among the civilian population, the government found it had no choice but to bomb the entire urban area. Homes, restaurants, churches, businesses, small warehouses, and small squares where children played, everything was targeted. Within the first few hours of the bombing, much of the town had been leveled, reduced to nothing more than rubble, with clouds of dust and smoke rising high into the air after the three local churches and countless homes collapsed.\n\nAfter the bombing ceased, thousands of soldiers stationed near the city were ordered to advance, surrounding what remained of the area and moving in from all directions, tightening the siege around the survivors. Unlike the first phase, the resistance proved fierce. PCR fighters who had withstood the bombing, along with armed civilians, defended every house and every street corner. Government troops continued to advance, but began to face increasingly violent ambushes and counterattacks.\n\nDespite all efforts, government soldiers continued to advance, proceeding to clear the city house by house and room by room. They broke down doors, fired indiscriminately into houses where they heard human sounds, and often engaged the guerrillas in hand-to-hand combat. They lost many soldiers, but by late afternoon, they reached and stormed the city's prefecture, one of the guerrillas' last major strongholds. After a fierce but brief firefight, they captured the local commanders and the complicit mayor and took them to the old church square, where they executed the guerrilla leaders in front of the rest of the population, finally capturing the city."
 BRA.139.a: "A revolution stomped."
 
 BRA.140.t: "An End To The Parasites"
 BRA.140.d: "In a large basement, the Revolutionary Communist Party's last official headquarters was filled with desperate, fear-stricken voices. The party leader stood in the center of the room, his face pale and sweaty as he tried to keep the rest of the group together. Most of their network had been dismantled in recent days; most of their comrades had been arrested, killed, or forced to flee into anonymity, and what remained of the leadership was there, trapped, arguing loudly about what to do.\n\n\"What the hell do you plan to do, then?\" he shouted at his friend, his voice breaking. \"They destroyed the biggest city we controlled and killed everyone else! They're all dead! We can't even get out of this damn place without risking our lives!\"\n\nA woman, one of the group's most important figures, slammed her hand on the table, tears streaming down her face. \"We should have left here weeks ago! It's over! Everything we built is over!\"\n\nThe reaction she'd hoped to provoke didn't come, and the others continued to shout at one another, some in anger, others in confusion, some devastated and seemingly resigned to their fates. The room was in complete chaos, with everyone talking at once. It was then that the man, the group's leader, spoke up, his voice louder than the rest. \"We can't just leave! We must use what we have to fig-\"\n\nThe lights went out suddenly, plunging the entire basement into absolute darkness and forcing the man to stop mid-sentence. For a split second, no one said a word, and in that second, the basement door was kicked in, followed by the frantic footsteps of several men from upstairs. Some began to run, others to scream, knocking over chairs and tables.\n\nA gunshot,\nA thud,\nAnother gunshot.\n\nThe sound of bodies being dragged was the only thing that filled the air. Most were dead, and the others who had fainted were carried out of the basement to a fate that many would rather die than face."
 BRA.140.a: "The last fire of Revolution blown away."
 
 BRA.141.t: "The Only Plane In The Sky"
 BRA.141.d: "A Legalist platoon was stationed in a small town near the front lines, hidden in the darkness of a blackout that had lasted for days. They had taken shelter on the ground floor of an abandoned, medium-sized building, lighting a small fire so they could cook their meals. They were talking in hushed tones about everything, being it their families, girlfriends, dreams, and how much longer this war would drag on. The night was heavy and silent, broken only by the occasional, distant sounds of artillery.Then, suddenly, a low hum rose from the sky.\nAt first, it was faint, almost like a fly, but it gradually grew louder.\nAn airplane.\nEveryone froze. One of them whispered urgently as he moved frantically to put out the fire. Everyone hurried silently, not wanting to make any noise that might alert the pilot, but needing to extinguish the flames that would alert the pilot. They began stomping with their boots and throwing nearby dirt onto the embers.\n\nThey succeeded, and the flames died down quickly, plunging them back into total darkness.\n\nEven so, the sound of the plane continued, steady and occasionally rising and falling in volume, as if circling somewhere above them. The soldiers pressed themselves against the walls, and others retreated inside the building, all breathing frantically and shallowly. \"I can't die like this,\" whispered a young soldier to himself, clutching his rifle tightly against his body.\n\nNo one moved. No one even spoke after the young man. Time seemed to stretch on for an eternity, and the plane continued to circle, dropping nothing, not a bomb nor a single shot, as if it were a ghost that had come only to scare them.\n\nEveryone remained motionless, waiting for the end that seemed inevitable.\nThe wait dragged on agonizingly, stretching from the first to the second, and from the second to the third, and from the third to the fourth hour."
 BRA.141.a: "The next day, the commander received no response from any of them."
 
