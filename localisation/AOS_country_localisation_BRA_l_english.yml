 BRA.abin.1.t: "Report on the \"Frente Integralista Brasileira - FIB\""
 BRA.abin.1.d: "$BRA_ABIN_seal_1$The \"Frente Integralista Brasileira (FIB)\" represents the most sophisticated and ideologically coherent revival of fascist ideology in the current landscape. Under the leadership of Moisés Lima, the movement is structured into three distinct, synergistic wings, all united by a fundamental belief in Integralism as the only future for Brazil.\n\nThe public face of the FIB is its political wing, led by the known politician Paulo Fernando da Costa. This faction engages in legitimate political discourse, promoting a platform of anti-racism, municipalism, corporatist economics, and a return to \"true Christian Brazilian traditions.\" This moderate presentation serves as the movement's respectable veneer. The ideological core is led by Moisés Lima himself, an \"idealist\" and orthodox thinker who ensures doctrinal purity and provides the long-term strategic vision for a totalitarian, Integralist state. The third wing is the operational and paramilitary arm, led by the radical Eduardo Fauzi. This group is responsible for the FIB's recent and rapid acquisition of firearms and for coordinating violent attacks against minorities and those they label \"social deviants.\"\n\nWhile their public rhetoric, particularly from da Costa's wing, can seem intellectually tame or even benign, their actions reveal their true nature. The historical Ação Integralista Brasileira was a virulently anti-democratic fascist movement, and its modern successor shares the same totalitarian goal. Their belief that any means are justified to achieve their ends, combined with their recent armed capabilities, makes them a uniquely versatile and grave threat."
 BRA.abin.1.a: "A wolf in three parts: the smile, the brain, and the claw."
 BRA.abin.2.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Marcha Sobre Fortaleza\""
 BRA.abin.2.d: "$BRA_ABIN_seal_2$The Frente Integralista Brasileira (FIB) has successfully orchestrated a \"Marcha Sobre Fortaleza,\" seizing control of the city and effectively establishing it as the capital of their proposed \"Integral Brazil.\" This decisive action exposes the fatal flaw in the federal strategy of containment and negotiation, which the FIB has exploited to consolidate power and legitimize their insurrection.\n\nThe FIB's rise was enabled by a perfect storm of state neglect. While national attention was fixated on the military threat of the ELB, the FIB's sophisticated propaganda machine, ironically branded by online memes as the \"Sociedade dos Sigma,\" mobilized a generation of disaffected youth. Their message of fighting \"cultural degeneracy\" and restoring order resonates powerfully in the vacuum left by a distracted federal government. The prior liberalization of firearm laws allowed them to arm their militias unimpeded, transforming their green-clad supporters from protesters into a formidable paramilitary force that now governs Brazil's seventh-largest city.\n\nThe fall of Fortaleza is a propaganda and strategic catastrophe. The FIB now possesses a major port, a vast population base, and the symbolic authority of governing a state capital. Their control shatters the illusion of federal authority and provides a blueprint for other radical groups. Negotiations have failed; every day the Integralist flag flies over Fortaleza, the Brazilian state is humiliated. The FIB cannot be contained-it must be crushed."
 BRA.abin.2.a: "A meme made flesh, and its flesh is iron."
 BRA.abin.3.t: "Report on the \"Partido Comunista do Brasil - P.C.B\""
 BRA.abin.3.d: "$BRA_ABIN_seal_1$Our attention has been drawn to the sudden and enigmatic emergence of the \"Partido Comunista do Brasil (P.C.B.),\" a group distinct from, and far more radical than, the legal communist parties. This faction appears to have split from the MR-8 and PCdoB following democratization, operating in absolute secrecy for decades until its recent, coordinated propaganda offensive.\n\nThe P.C.B.'s ideology is a purist and rigid form of Marxism-Leninism-Maoism, explicitly adhering to Gonzalo Thought and the concept of a \"New Democracy\" achieved through protracted people's war. Their propaganda, consisting of printed posters and precise graffiti appearing nearly simultaneously in urban centers nationwide, indicates a level of coordination and resources previously unknown to our agencies. This demonstrates a significant, and until now entirely hidden, operational capacity. Virtually no concrete data exists on the group's leadership, membership, or structure. Infiltrated agents have gathered nothing, as the cell avoids digital communication and any contact with state apparatuses, preferring to operate entirely in the dark. They have no known ties to other political movements, suggesting a philosophy of profound isolationist secrecy. This complete lack of a digital footprint or human intelligence is, in itself, deeply alarming. They are a ghost, and their sudden materialization is a deliberate signal of capability and intent.\n\nWhile their current activities are limited to propaganda, their foundational ideology is inherently violent and revolutionary. The P.C.B. represents an unknown variable, a deeply entrenched, ideologically fanatical, and operationally sophisticated group that has chosen to reveal its existence. Their next move is unpredictable, and their preparedness suggests it will be significant."
 BRA.abin.3.a: "A phantom with a printing press and a plan."
 BRA.abin.4.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Guerra Popular Prolongada\""
 BRA.abin.4.d: "\n$BRA_ABIN_seal_2$The fanatical Maoist sect known as the Partido Comunista do Brasil (P.C.B.) has formally declared a \"Guerra Popular Prolongada\" against the Brazilian state, initiating its treasonous campaign with a coordinated wave of letter bomb attacks targeting national leaders. This represents a catastrophic intelligence failure, revealing a deeply entrenched and operational terrorist network that has developed in the shadows, entirely undetected, while national resources were dedicated to containing the conventional threat of the ELB.\n\nOur initial assessment that the P.C.B. was a mere propaganda entity has been proven dangerously naive. Their base of operations is firmly established in the rugged and remote territories of Rondônia and northern Mato Grosso, a region chronically neglected due to the federal government's necessary focus on other crises. There, shielded by terrain and bureaucratic neglect, they have built a classic Maoist insurgency structure, mobilizing disaffected elements with a purist ideology of Gonzalo Thought. Their declaration of war is not rhetorical; it is an operational directive, and their opening salvo of terror proves they possess both the will and the means to inflict mass casualties.\n\nThis is a strategic threat of the highest order. Unlike the ELB, which seeks to conquer the state, the P.C.B. seeks to utterly destroy it through a long-term, grinding insurgency. Their safe haven in the Amazonian frontier provides them with a virtually unassailable base from which to spread violence and chaos. The focus on the Northeast has allowed a cancer to take root in the North, one that will be infinitely more difficult to eradicate now that it has metastasized. Immediate and brutal counter-insurgency operations are required before their \"People's War\" gains irreversible momentum."
 BRA.abin.4.a: "A cancer that grew in the blind spot of the nation."
 BRA.abin.5.t: "Report on the \"Ação Popular Revolucionária - APR\""
 BRA.abin.5.d: "$BRA_ABIN_seal_1$Amidst the current political polarization, our units have been monitoring the activities and rhetoric of the \"Ação Popular Revolucionária - APR\", a group that recently split from the mainstream Frente Popular Trabalhista Unida (FPTU). Unlike the FPTU, which operates within the institutional framework, the APR has adopted a concerning paramilitary character, cloaked in a ideology of a \"National Revolution.\"\n\nThe group is highly active in grassroots organizing, such as the distribution of food and clothing in impoverished communities. During these actions, they openly disseminate their manifesto, which calls for an end to \"gringo economic hegemony\" while maintaining a stated goal of overthrowing capitalism. They claim the legacy of Vargas, Goulart, and Brizola, positioning Luís Carlos Prestes as their ideological patron to lend historical legitimacy to their cause. While they present themselves as a democratic movement, their manifesto explicitly calls for a popular revolution \"should the avenues of dialogue be broken.\" This rhetoric is now coupled with a tangible security threat; recent liberalizations in firearm laws have allowed the APR to begin acquiring rifles and sidearms, which they frame as a \"defensive measure for the people.\"The organization is led by President Daniel Albuquerque, a known political activist, and benefits from the public legitimacy provided by its President of Honor, the retired jurist Siro Darlan, the so-called \"People's Jurist.\"\n\nFor now, their activities are primarily organizational and propagandistic. However, their ideological fervor, combined with their recent armed acquisitions and revolutionary mandate, marks a significant and dangerous radicalization. They represent a new, more dangerous breed of political actor, one that operates both in the public eye and in the shadows, preparing for conflict."
 BRA.abin.5.a: "A new, more dangerous breed."
 BRA.abin.6.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Nova Campanha da Legalidade\""
 BRA.abin.6.d: "\n$BRA_ABIN_seal_2$While federal attention and resources are rightly fixated on defeating the traitorous Exército Legalista Brasileiro (ELB), a catastrophic security vacuum has been allowed to develop in the Northeast. The Ação Popular Revolucionária (APR), previously assessed as a localized insurgent threat, has capitalized on this strategic neglect to launch a \"Nova Campanha da Legalidade,\" a cynical propaganda operation aimed at reinstating the deposed communist governor of Pernambuco, Jones Manoel.\n\nThe APR's campaign is a masterclass in subversive information warfare. They have co-opted the potent historical symbolism of the original 1961 \"Campanha da Legalidade,\" wrapping their revolutionary socialist agenda in the Brazilian flag and the populist rhetoric of the Vargas era. This message of \"Socialist Nationalism\" resonates powerfully with the impoverished populace, who they have mobilized into mass demonstrations. The previous liberalization of firearm ownership, a necessary measure for upstanding citizens, has been perverted by the APR, which now openly arms its militants with military-grade hardware. The Northeastern Defense Force, valiantly attempting to maintain order, is overstretched and underequipped, facing a populace that increasingly views the APR not as terrorists, but as liberators restoring \"legitimate\" authority.\n\nThe imminent collapse of the NDF and the restoration of a communist governor in a key state is no longer a risk but a foreseeable outcome. This would provide the APR with a sovereign territorial base, immense legitimacy, and a formal platform from which to coordinate with the ELB and other hostile actors. The defeat of the ELB will be a hollow victory if the Northeast falls to a popular insurgency cloaked in the banner of legality."
 BRA.abin.6.a: "A ghost of the Fourth Republic, resurrected to haunt the New."
 BRA.abin.7.t: "Report on the \"Liga Libertária - LL\""
 BRA.abin.7.d: "$BRA_ABIN_seal_1$Our monitoring has identified a concerning alliance between two radical libertarian factions: the public-facing \"Liga Libertária (LL)\" and its paramilitary counterpart, the \"Exército Inconfidente Livre (EIL).\" This partnership represents a significant threat due to its combination of ideological fervor and armed capability.\n\nThe LL, led by the activist Paulo Kogos, operates primarily in the digital sphere, using social media platforms as its main method of propaganda and recruitment. It promotes a radical platform merging Christian ultra-conservatism with a classical libertarian ideology, openly hostile to federal authority. However, internal fractures are present; a moderate faction, led by Raphaël Lima and adhering to a more conventional Classical Liberalism, contests Kogos's dominance, creating a notable internal tension. Despite this internal conflict, the LL's most critical function remains its role as the ideological and public shield for the EIL. The EIL is a paramilitary group led by an individual known only by the alias \"Tiradentes.\" This group adheres to a more militant and purely Anarcho-Capitalist line and operates entirely in the shadows, away from the LL's online spotlight. The EIL is the armed wing of this alliance and is the primary source of its operational danger, responsible for the procurement and distribution of firearms and ammunition.\n\nAlthough their ideologies are not perfectly aligned, the two groups remain united. This alliance is likely born from a pragmatic calculation that their combined strength, the LL's digital reach and the EIL's paramilitary power, offers the best chance to advance their shared anti-state goals."
 BRA.abin.7.a: "An ideological shield with a sharp, hidden sword."
 BRA.abin.8.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Batalhão Armado da Liberdade\""
 BRA.abin.8.d: "$BRA_ABIN_seal_2$The Liga Libertária (LL) has launched a brazen offensive to seize control of Greater São Paulo, branding their insurrection the \"Dia da Derramada.\" This move capitalizes on the federal government's necessary prioritization of the ELB threat, exploiting the resulting power vacuum in Brazil's economic heartland. The LL, under the administrative command of Paulo Kogos and the military leadership of the EIL's \"Tiradentes,\" is now engaged in intense urban warfare against a mosaic of other factions, transforming the metropolis into a chaotic battleground that threatens national stability.\n\nThe LL's strategy is a dangerous fusion of digital propaganda and paramilitary aggression. Kogos's online rhetoric, blending Christian ultra-conservatism with radical libertarianism, has mobilized a significant following, while the EIL's militants, empowered by liberalized firearm laws, execute coordinated attacks to secure key districts. Internal ideological fractures between Kogos's hardliners and the moderate classical liberal wing led by Raphaël Lima are temporarily suppressed by the shared objective of conquering São Paulo. Their declared \"Segunda Inconfidência\" frames their treason as a patriotic revolt, a cynical appropriation of history to legitimize their goal of dismantling federal authority.\n\nThe loss of Greater São Paulo to this anarcho-capitalist coalition would be a catastrophic blow to the nation's economy and sovereignty. Their control over the city would provide them with immense resources and a platform to rally other anti-state movements. The current fragmented conflict only plays into their hands, allowing them to consolidate power piecemeal. Immediate and decisive federal intervention is required to prevent the LL from turning São Paulo into the capital of a new, fractured Brazil."
 BRA.abin.8.a: "A digital crusade with real-world bullets"
 BRA.abin.9.t: "Report on the \"Movimento Brasil Livre - MBL\""
 BRA.abin.9.d: "$BRA_ABIN_seal_1$Our analysis of the \"Movimento Brasil Livre - MBL\" indicates a significant strategic shift. Historically a digital and street-level protest movement, the MBL has reconstituted itself under the leadership of Renan Santos as a self-proclaimed \"democratic third way,\" explicitly rejecting the administrations of both Lula and Bolsonaro. The movement capitalizes on widespread popular disillusionment, positioning itself as the sole defender of pragmatic, liberal democracy.\n\nWhile their public rhetoric remains firmly within the constitutional order, their recent activities are cause for close observation. The liberalization of firearm laws has provided the MBL's membership with a newfound capability. Under the banner of \"civic preparedness,\" they have begun to organize informal shooting clubs and self-defense militias, systematically acquiring rifles and sidearms. While they frame this as a defensive measure against political violence from the extremes, it represents a tangible militarization of a previously unarmed civic movement. The primary concern, however, lies in the ideological composition of its inner circle. A figure of special interest is Renato Impera, a fringe Neo-Reactionary intellectual who has embedded himself within Santos's leadership group. Impera's core ideology is fundamentally anti-democratic, viewing liberal democracy as a failed, weak system. He publicly advocates for a \"post-democratic state\" and is suspected of viewing the MBL's mainstream appeal and its new paramilitary potential as tools for a longer-term, more authoritarian project.\n\nFor now, the MBL under Santos presents a unified, democratic front. But the presence of Renato Impera, combined with the group's rapid and legal arming, creates a volatile internal dynamic. They represent a legitimate political movement potentially being steered towards an illegitimate end."
 BRA.abin.9.a: "A legitimate shield for an illiberal spear."
 BRA.abin.10.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Rugido da Onça\""
 BRA.abin.10.d: "$BRA_ABIN_seal_2$The Movimento Brasil Livre (MBL), having betrayed the legitimate government the moment it became politically convenient, has now fully revealed its treacherous nature by declaring itself the \"Novos Tenentistas\" through immediate individual violent action of\"self-defense of the nation and democracy\" and that the \"Onça ruge\". This is not a democratic movement, but an armed insurrection aimed at seizing control of strategic areas within Greater São Paulo, directly challenging federal authority under the false banner of renewing Brazilian politics.\n\nWhile the federal government is rightly engaged in containing the existential ELB threat, the MBL has cynically exploited this strategic focus to arm and mobilize its base. The same firearm laws that empower patriots have been twisted by this group to create urban militias, which they now deploy in street-level conflicts against other factions. Their rhetoric of being a \"third way\" is a transparent lie, masking a blatant power grab. Most damningly, their ranks are being purged of true patriots; the internal faction led by Renato Impera, which maintained loyalty to the President, is being systematically silenced and expelled, proving the MBL's intolerance for any dissent from their new, revolutionary path.\n\nThis \"Rugido da Onça\" cannot be dismissed as mere political posturing. It represents a highly organized, well-armed, and media-savvy force seizing control of critical urban infrastructure. Their inside knowledge of the political landscape and their mastery of propaganda make them uniquely dangerous. To ignore this betrayal in São Paulo is to risk losing the nation's economic capital to a cabal of opportunistic turncoats."
 BRA.abin.10.a: "The spear is launched, to the dark."
 BRA.abin.11.t: "Report on the \"O Sul é o Meu País - OSMP\" & Associated Factions"
 BRA.abin.11.d: "$BRA_ABIN_seal_1$The separatist movement \"O Sul é o Meu País (OSMP)\" has transitioned from a political advocacy group to a heavily armed, demonstrative force. Led by lawyer and historian Adílcio Cadorin, its official goal is the peaceful secession of Brazil's three southern states to form a new, independent nation based on principles of liberal conservatism, opposing what they term \"cultural leftism\" and \"moral decay.\"\n\nDespite this united front, the movement is a coalition of disparate and often conflicting interests. A significant internal challenge comes from the \"República do Pampa (RP),\" a faction representing Gaúcho ethnic identity, led by journalist Irton Marx. The RP opposes the OSMP's pan-southern vision, viewing it as an appropriation of their struggle, and instead advocates for the union of Rio Grande do Sul with Uruguay. Marx has pragmatically agreed to operate within the OSMP framework, but this alliance is fragile and based on convenience rather than ideological unity.\n\nThe most critical threat, however, is the confirmed presence of the neo-Nazi paramilitary group \"Südfront,\" which has infiltrated the OSMP's ranks. Led by an individual known only as \"Barbarossa,\" the Südfront advocates for a violent ethnic cleansing to create a \"pure\" southern state, fundamentally opposing the OSMP's stated civic nationalism. They represent a latent catalyst for extreme violence.\n\nCompounding this chaotic landscape is the online phenomenon \"Juche Gaúcho,\" a movement blending Gaúcho culture with North Korean Juche ideology, led by an anonymous figure known as \"Giuseppe Garibaldi.\" While currently assessed as a satirical or trolling operation, its growing popularity among progressive circles and online Gaúcho communities introduces an unpredictable, absurdist variable that could either destabilize or discredit the broader separatist cause."
 BRA.abin.11.a: "The match is lit. The powder keg is armed. The fuse is a joke."
 BRA.abin.12.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Referendo de Secessão\""
 BRA.abin.12.d: "$BRA_ABIN_seal_2$The separatist movement \"O Sul é o Meu País\" (OSMP) has escalated from political agitation to open mobilization, now actively preparing a regional referendum on secession with the explicit intent to enforce its outcome by armed force. This move capitalizes on the federal government's diverted attention to the ELB crisis, allowing OSMP to consolidate militias across the South under the guise of a democratic process. The situation is a powder keg; the referendum's conclusion is expected to trigger widespread violence, directly challenging Brazilian sovereignty.\n\nOSMP's cohesion is fractious, undermined by intense internal rivalries. The movement is split between factions advocating for a unified southern state and those, like the \"República dos Pampas\" and the \"Juche Gaúcho\" movement, demanding an independent Gaúcho nation, potentially in union with Uruguay. The latter is driven by the absurd yet dangerously effective \"Juche Gaúcho Theory,\" propagated by the enigmatic \"Giuseppe Garibaldi,\" who has leveraged online platforms to rally thousands to his cause of ethnic-separatist socialism. Compounding this, OSMP has fully integrated the neo-Nazi \"Südfront\" into its command structure, legitimizing a violent extremist element that now shapes its paramilitary strategy. Garibaldi's faction is in open ideological combat with the mainstream OSMP, creating a volatile environment where any outcome could spark internal conflict.\n\nThis referendum is not a legitimate exercise of democracy but a precursor to balkanization. The federal government cannot permit a vote that threatens to dismantle the nation. Immediate action is required to disarm these militias, nullify the referendum, and reassert constitutional authority over the South before the region is lost to a chaotic patchwork of petty, squabbling statelets."
 BRA.abin.12.a: "It isn't funny."
 BRA.abin.13.t: "Report on the \"Movimento Internacional Operário no Brasil - MIOB\""
 BRA.abin.13.d: "$BRA_ABIN_seal_1$The \"Movimento Internacional Operário no Brasil (MIOB)\" has emerged as a significant Trotskyite paramilitary force, operating as a broad tent of various tendencies under the banner of \"Bolshevik-Leninism.\" Despite their self-description, their allegiances remain firmly rooted in Trotskyist ideology, with alleged ties to established left-wing parties such as PSOL, PCO, and PSTU, which provide a degree of political cover and recruitment channels.\n\nInternally, the MIOB is fractured into three competing lines: the \"Entryist\" faction, which advocates for infiltration and cooperation with institutional left parties; the \"Revolutionary\" faction, which pushes for autonomous, direct action to achieve socialist revolution; and the \"Patriotic\" faction, which, while focusing on opposition to \"identity politics\" and \"gender ideology,\" remains part of the predominantly progressive whole. This ideological diversity has not hindered their operational cohesion; in fact, their recent militarization and aggressive overreach campaigns in metropolitan areas have catalyzed a dramatic surge in popularity, transforming them from a fringe movement into a major left-wing force in urban centers.\n\nTheir paramilitary activities have led to violent clashes with criminal organizations controlling these territories, creating a volatile security environment. While this conflict poses a immediate threat, it also presents an opportunity; allowing these two forces to engage each other could mutually degrade their capabilities without direct state intervention. However, the MIOB's growing discipline and revolutionary fervor make them a long-term concern, as their ultimate aim remains the overthrow of the current order."
 BRA.abin.13.a: "A fractured hammer, yet still capable of breaking walls."
 BRA.abin.14.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Congresso Brasileiro dos Operários e Camponeses - Conflito Instigado\""
 BRA.abin.14.d: "$BRA_ABIN_seal_2$The Trotskyist sect known as the Organização Internacional Operária no Brasil (OIOB) has successfully seized control of strategic territories within Greater São Paulo, formally declaring the formation of their so-called \"União de Assembléias Populares Revolucionárias.\" This declaration of a parallel, revolutionary government within the nation's economic capital represents a qualitative escalation in their threat level, directly challenging federal sovereignty in a core region.\n\nWhile the state was rightly focused on the conventional threat of the ELB, the OIOB exploited the resulting security gaps to militarize and execute a disciplined campaign of urban infiltration. Their ideology, which they deceitfully label \"Bolshevik-Leninism,\" provided a cohesive framework that allowed them to overcome internal factional disputes and act with a singular purpose. They have effectively weaponized popular discontent, establishing revolutionary committees that now administer neighborhoods and enforce their rule, all under the protection of their armed wings. Their territorial control is operational, providing a base from which to spread their insurrectionary virus.\n\nThe existence of this \"União\" is a cancer in the heart of Brazil. It provides the OIOB with a sovereign platform, a source of revenue, and a proving ground for their revolutionary model. Every day it stands, it legitimizes sedition and attracts other radical elements. The focus on the ELB has allowed a viper to nest in our home. This urban insurgency must be crushed with immediate and overwhelming force to prevent the complete balkanization of São Paulo."
 BRA.abin.14.a: "They seek to build a guillotine in the name of a dead man."
 BRA.abin.15.t: "Report on the \"Exército Legalista Brasileiro - ELB\""
 BRA.abin.15.d: "$BRA_ABIN_seal_1$All previous threat assessments are secondary. The primary and existential threat to the constitutional order is the mutiny within the Northeastern Military Command, which has declared itself the \"Exército Legalista Brasileiro (ELB)\" under the leadership of General Freire Gomes.\n\nThe ELB's stated ideology is singular: the removal of President Bolsonaro, whom they label a \"usurper.\" They justify their treason by claiming the President's necessary declaration of Martial Law, a measured response to the mysterious disappearance of the former president Lula, was an illegal coup. Their rhetoric is a facade for their own power grab. This faction controls approximately 13% of federal territory, including key military infrastructure in the Northeast. They are not a rogue militia; they are a conventional military force with full operational capabilities, now openly funded and supplied by foreign powers antagonistic to our national sovereignty, namely Russia and China, through BRICS alignment. Their stated objective is a march on Brasília to forcibly decapitate the legitimate government.\n\nAll other non-state actors, while destabilizing, operate at a tactical level. The ELB operates at the strategic level, possessing the firepower, discipline, and now the foreign backing to threaten the state itself. They have co-opted the former intelligence apparatus, and their inside knowledge makes them exponentially more dangerous."
 BRA.abin.15.a: "A blade pointed at the heart of the nation."
 BRA.abin.16.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Revolução Legalista\""
 BRA.abin.16.d: "$BRA_ABIN_seal_2$All negotiation efforts with the traitor Freire Gomes have collapsed. The so-called \"Exército Legalista Brasileiro\" has used the negotiation period not for good-faith dialogue, but as a strategic pause to consolidate a wider political and military front against the legitimate government. They have now openly rebranded as the \"Federação Legalista Brasileira\" (FLB), a name that reveals their true ambition: to become a rival federal government. Border skirmishes are already underway, and full-scale war is now inevitable within days.\n\nThe FLB's treachery is now fully exposed. Their coalition is a grotesque assemblage of every rejected element of the old political order, from the leftist revanchism of Ciro Gomes and Fernando Haddad to the feckless centrism of Simone Tebet, João Amoêdo, and Soraya Thronicke. These are the very leaders of the banned political federations, whose divisive agendas necessitated strong measures to ensure national stability. By embracing them, the FLB proves it is not a principled military movement but a cynical vehicle for a vengeful political restoration, one that would undo all the progress achieved under the current administration.\n\nEvery other threat is now a secondary concern. The FLB is the main effort. This is an existential conflict for the survival of the Brazilian nation as we know it. There is no more room for diplomacy. The only path forward is the total and decisive military defeat of the Federação Legalista Brasileira. All national resources must be mobilized for this singular purpose."
 BRA.abin.16.a: "The blade is no longer pointed at the heart: the thrust has begun."
 BRA.abin.17.t: "Report on the \"Movimento Monarquista Brasileiro - MMB\""
 BRA.abin.17.d: "$BRA_ABIN_seal_1$The \"Movimento Monarquista Brasileiro (MMB)\" represents a significant consolidation of monarchist forces, born from the fusion of Ação Orleanista, Pró-Monarquia, and União Nacional Restauradora. The movement is not led by a single individual but is governed by a council known as the \"Regência de Petrópolis e Vassouras,\" which provides strategic direction and a veneer of historical legitimacy.\nInternally, the MMB is organized into three distinct \"Leagues,\" which represent a spectrum of royalist thought but are united in their ultimate goal of restoration. The Conservative League advocates for a system nearing absolutism; the Liberal League promotes a semi-constitutional monarchy; and the Progressive League argues for a purely constitutional model. While these factions debate the form of a future state, their actions on the ground have converged dangerously. Recent intelligence confirms the MMB has undertaken systematic armament, facilitated by the country's liberalized gun laws and, more concerningly, by its growing proximity to elements of the radical right.\nThis armed capability, combined with their rigid ideological framework, makes them a tangible threat. While their objectives are predictable based on their historical antecedents, their new paramilitary potential and external alliances increase their operational risk exponentially. Furthermore, we assess with high probability that the movement is being funded by pretenders to the throne through sophisticated offshore financial transfers, though concrete evidence remains elusive. They are no longer a nostalgic debating society, but an armed faction preparing for political conflict."
 BRA.abin.17.a: "Nostalgia armed with modern weapons."
 BRA.abin.18.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Restauração da Ordem Tradicional\""
 BRA.abin.18.d: "$BRA_ABIN_seal_2$The so-called \"Movimento Monarquista Brasileiro\" has transitioned from a fringe historical society to an active insurrectionist force, having illegally occupied the cities of Petrópolis and Vassouras under the banner of a \"Restauração da Ordem Tradicional.\" This seizure of sovereign Brazilian territory by a group pledging allegiance to extinct dynasties constitutes a direct and intolerable challenge to the Republic.\n\nExploiting the nation's focus on more immediate military threats, the MMB has rapidly militarized. The liberalization of firearm ownership, a policy for the defense of the Republic, has been perverted to equip the royalist militias. Their internal \"Leagues\" have shelved doctrinal disputes to present a unified armed front, flying the banners of long-defunct royal houses over public buildings. This is the establishment of a rival, anti-republican state apparatus within our borders, complete with its own governing \"Regency\" council.\n\nThis monarchist enclave cannot be tolerated. Its very existence legitimizes sedition and provides a rallying point for every reactionary element seeking to undo modern Brazil. Their ambition is the complete overthrow of the constitutional order. Immediate and decisive action is required to dissolve this regressive fantasy and restore the authority of the Brazilian Republic."
 BRA.abin.18.a: "A crown is the most sharpened of weapons."
 BRA.abin.19.t: "Report on the \"Coordenação Anarquista Brasileira - CAB\""
 BRA.abin.19.d: "$BRA_ABIN_seal_1$The \"Coordenação Anarquista Brasileira (CAB)\" is an umbrella organization for a fragmented collection of left-anarchist ideologies, ranging from anarcho-communism to anarcho-nihilism. In response to the national liberalization of firearm laws, the group has officially adopted a policy of armament, rhetorically committing itself to the fight for a \"libertarian, progressive, and socialist future.\"\n\nHowever, their operational capacity remains negligible. The CAB is crippled by its own fundamental principles of extreme decentralization and a lack of hierarchical command structure. The coalition is in a constant state of internal squabbling between its various currents, with debates over theory and strategy preventing the formation of a coherent agenda or the execution of any significant coordinated action. Their efforts are characterized by disorganization and internal contradiction.\nFor now, their ideological fervor is dissipated by their structural chaos. They do not currently represent a credible threat to public order. Nevertheless, the presence of armed individuals adhering to any revolutionary ideology, however disorganized, warrants passive monitoring. The situation could change if a singular, charismatic figure emerges to consolidate these disparate factions."
 BRA.abin.19.a: "The weapon is loaded, but there is no one to aim it."
 BRA.abin.20.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Comuna Livre de Belo Horizonte\""
 BRA.abin.20.d: "$BRA_ABIN_seal_2$Previous assessments of the Coordenação Anarquista Brasileira (CAB) as a disorganized and negligible threat are obsolete. The surge of protests in Belo Horizonte was a carefully orchestrated insurrection, culminating in the proclamation of the \"Comuna Livre da Grande Belo Horizonte.\" This declaration of a sovereign anarchist territory represents a catastrophic intelligence failure and a direct consequence of the state's focus on the ELB.\n\nThe CAB has somehow overcome its ideological fragmentation to form a cohesive and shockingly effective military council. They have established a functioning, if rudimentary, command structure that has successfully seized and now administers key sectors of the city. The liberalization of firearm laws, which they exploited to build their arsenal, now allows them to defend their conquest. Their forces, a mix of hardened militants and armed residents, have effectively repelled initial, disorganized attempts to restore order, cementing their control.\n\nThe establishment of the Comuna is a strategic disaster that transcends the loss of a city. It provides a tangible, functioning model for radical leftist revolt across the nation. Its very existence is a propaganda victory that undermines federal authority and inspires imitation. The CAB is no longer a debating society; it is a de facto government presiding over a so-called \"liberated zone\" in the heart of Minas Gerais."
 BRA.abin.20.a: "They were not ghosts, but a fist. And now the fist holds a city."
 BRA.abin.21.t: "Report on the \"Aliança Brasil Justo - ABJ\""
 BRA.abin.21.d: "$BRA_ABIN_seal_1$The \"Aliança Brasil Justo (ABJ)\" presents itself as a mainstream political movement led by former judge Sérgio Moro, advocating for a liberal conservative state and positioning itself as the antithesis of what it labels \"corrupt populists.\" Its public platform is strictly institutional, promoting change through democratic and peaceful means.\n\nHowever, our analysis indicates a more complex and concerning reality. Moro's celebrated anti-corruption record is now widely contested; both international and national rulings have confirmed a prosecutorial bias against leftist figures, most notably in the case of former president Lula da Silva. Circumstantial evidence suggesting collaboration with foreign intelligence services to secure that conviction, combined with his subsequent political alliance with Bolsonaro, paints a picture of a deeply partisan actor, not an impartial statesman. While the ABJ's rhetoric remains constitutional, their actions are evolving. The liberalization of firearm laws has been enthusiastically adopted by Moro and his inner circle, who now promote a philosophy of \"armed citizenship.\" They have begun to organize, train, and posture as a civic guard, framing it as a defense against political violence.\n\nFor now, their activities align with state interests in countering more overtly radical groups. However, the ABJ under Moro represents a latent threat: a politically motivated, legally sophisticated, and now increasingly armed movement. Their allegiance is not to the state as an institution, but to their own interpretation of it. Should their political fortunes decline or their \"side\" no longer be winning, their armed stance and sense of righteous grievance could make them a volatile and dangerous actor."
 BRA.abin.21.a: "A wolf who has put on the judge's robes."
 BRA.abin.22.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Operação Mão da Justiça\""
 BRA.abin.22.d: "$BRA_ABIN_seal_2$Governor Sérgio Moro has openly betrayed the federal government, mobilizing the Paraná State Guard and his Aliança Brasil Justo (ABJ) militias under the banner of \"Operação Mão da Justiça.\" This is not a law enforcement operation; it is a thinly veiled secessionist move aimed at carving out a personal fiefdom in the South, challenging both the legitimate government in Brasília and the traitorous ELB in the Northeast.\n\nMoro leverages his fabricated reputation as an anti-corruption crusader to mask his ambition. His rhetoric positions the ABJ as the only force capable of bringing \"order and justice\" to a chaotic Brazil, a direct challenge to Presidential authority. The liberalization of firearm laws, a policy he once championed for political gain, has now armed his network of \"public safety leagues\" and ABJ loyalists, transforming them into a potent private army. He postures as a third way, but his actions reveal his true goal: to establish a rival power center, leveraging the industrial and agricultural might of the South while the nation is besieged.\n\nThis is a critical juncture. Moro is no mere political opponent; he is a usurper exploiting a national crisis. His forces are disciplined, his propaganda is effective, and his claim to moral authority resonates with certain segments of the populace. Leaving this threat unaddressed will legitimize regional warlordism and guarantee the nation's Balkanization. Moro must be neutralized before his \"Justice Operation\" becomes an irreversible fait accompli."
 BRA.abin.22.a: "The judge has become the executioner of the nation."
 BRA.abin.23.t: "Report on \"Áquila Internacional\""
 BRA.abin.23.d: "$BRA_ABIN_seal_1$The legalization of private paramilitary forces has allowed \"Áquila Internacional,\" a Brazilian-origin Private Military Company, to transition from an exclusively foreign-operating entity to a significant and embedded domestic actor. Previously focused on international contracts, Áquila has now established itself as the security provider of choice for the Brazilian elite, frequently employed to protect assets and confront radical groups in urban and rural settings.\n\nThe company is led by Roberto Escoto, a former Commander of Paratrooper Infantry in the Brazilian Army, whose expertise and reputation have enabled him to recruit extensively from the ranks of disgruntled and highly skilled veterans, offering premium compensation. While their operational effectiveness in countering groups like the APR or EIL is noted and has, to date, resulted in no confirmed fatalities, their presence represents a profound strategic concern. Áquila Internacional holds no loyalty to the Brazilian state, only to its private paymasters.\n\nThis introduces a volatile variable into the national security landscape. Their actions are currently aligned with state interests in destabilizing armed factions, making any move against them politically untenable, especially given their Brazilian origins. However, their extensive ties to Western interests and their ultimate subordination to private employers pose a critical, unanswerable question: what happens if their employers' objectives diverge from those of the nation? They are a capable, disciplined force whose allegiances can be purchased, and whose mandate could change overnight."
 BRA.abin.23.a: "A watchdog, with no master?"
 BRA.abin.24.t: "IMMEDIATE ACTION REQUIRED: Report on the \"Operação de Normalização do Sudeste\""
 BRA.abin.24.d: "$BRA_ABIN_seal_2$The declaration of \"Operação de Normalização do Sudeste\" by the private military corporation Áquila Internacional represents a severe and unauthorized escalation in the state of Minas Gerais. Under the pretext of restoring stability, this corporate army is now conducting independent military operations, effectively carving out a zone of influence for its elite patrons and directly challenging the federal government's monopoly on the use of force.\n\nWhile Áquila's operational effectiveness against radical groups is noted, their presence transforms a law enforcement crisis into a potential multi-sided conflict. Their actions are not coordinated with legitimate federal or state authorities; they answer only to a board of directors and their wealthy clients. The prior liberalization of firearm and security laws, designed to empower citizens, has been exploited by Áquila to field a veritable private battalion, equipped with hardware that rivals our own understrength garrisons in the region. Their propaganda frames the government's focus on the ELB as \"neglect,\" allowing them to position themselves as the only viable guarantors of order.\n\nThis \"normalization\" is a corporate takeover of sovereign territory. Every insurgent they disarm, every town they pacify, increases their political and military capital. The immediate tactical gains they provide against communist militias are dangerously offset by the long-term strategic threat of a parallel, professional military force whose allegiance is to capital, not country. We are fostering a rival that we may soon be unable to control."
 BRA.abin.24.a: "A state within a state, and one that issues its own marching orders."
 BRA.abin.25.t: "Report on the \"Primeiro Comando da Capital - PCC\""
 BRA.abin.25.d: "$BRA_ABIN_seal_1$The escape of its historic leader, Marcos Williams Camacho (\"Marcola\"), has catalyzed a significant surge in the operational tempo and recruitment capabilities of the \"Primeiro Comando da Capital (PCC).\" This criminal faction has evolved far beyond its origins as a prison-based group formed in response to the Carandiru Massacre.\n\nWhile its foundational narrative, positioning itself as an avenger for Carandiru and a shield against police brutality, remains a powerful recruitment tool, this ideology is now largely a justification for its expansive criminal enterprise. The PCC operates with a ruthless, pragmatic focus on power and profit, controlling narcotics trafficking, extortion, and other illicit activities across the national territory. The most concerning development is the group's deepening social entrenchment. Worsening living standards and perpetual crisis have created a fertile ground for the PCC's propaganda. In disenfranchised communities, they are increasingly perceived as \"modern Robin Hoods,\" a parallel state that provides a semblance of order and rudimentary justice where the official state is absent or predatory. Their motto, \"Liberty, Justice, Peace, Equality, and Union\", provides a potent, if cynical, ideological shield that obscures their violent nature.\n\nThe PCC is no longer merely a criminal organization; it is a political-criminal hybrid with significant popular support. Their power now stems not just from fear, but from a form of grim legitimacy granted by the state's failures. This makes them a deeply entrenched and systemic threat."
 BRA.abin.25.a: "Justice is the mask, power is the face."
 BRA.abin.26.t: "Report on the \"Terceiro Comando Puro - TCP\""
 BRA.abin.26.d: "$BRA_ABIN_seal_1$The \"Terceiro Comando Puro (TCP)\" represents a distinct and potent hybrid threat, merging organized crime with a radical, fundamentalist evangelical ideology. Long-standing but previously contained, recent social and economic hardships have catalyzed a significant expansion of their influence within vulnerable favela communities.\n\nThe TCP is a narco-faction with a theological mandate. Its ideology is a fusion of militant Christian Zionism, maintaining a fiercely pro-Israel stance based on eschatological belief, and a drive to impose a puritanical social order. Under the leadership of Nei da Conceição Cruz, known as \"Facão,\" the faction actively works toward its stated goal of establishing a \"Kingdom of God on Earth\" within its territories. This translates to the systematic persecution of sexual, gender, and religious minorities, enforcing evangelical doctrine through violence and intimidation.\n\nThis potent combination of providing illicit economic opportunity and a rigid, purpose-giving belief system has proven highly effective for recruitment among the disenfranchised. The TCP is not merely a criminal enterprise; it is a \"Narcopentecostal\" movement, offering followers a way to \"work for God on earth\" while engaging in narcotics trafficking and armed conflict. Their faith provides a divine justification for their violence and a powerful social control mechanism."
 BRA.abin.26.a: "A crusade funded by cocaine, and a kingdom built on corpses."
 BRA.bcwfactions.1.t: "The Free Brazil Movement"
 BRA.bcwfactions.1.d: "In the wake of the 2014 World Cup protests, the Free Brazil Movement crystallized from the scattered energy of the streets into a coordinated political force. Led by Renan Santos, the MBL positioned itself as a liberal alternative to the PT establishment, channeling public anger over corruption and economic stagnation into a campaign for institutional change. Through years of organizing, the movement helped build the momentum that led to impeachment, carefully navigating offers of alliance from a reform-minded army captain who sought to co-opt their networks. By 2018, their strategy appeared vindicated: key figures like Kim and Arthur secured seats in Congress, and the MBL seemed poised to shape a new political order.\n\nThe Bolsonaro years revealed the limits of that vision. What Renan and his colleagues witnessed was not reform but the emergence of a right-wing parallel to the PT's old machine; a project built on perpetual power and cultural warfare rather than liberal governance. The movement's membership collapsed to a few hundred dedicated organizers, and Renan himself nearly abandoned politics altogether. Yet the core held. As Brazil's pandemic crisis deepened and institutions frayed, the MBL began rebuilding, not as a vehicle for street protests alone but as an organized force prepared for the fractures to come. What remained was small, but it was no longer alone."
 BRA.bcwfactions.1.a: "We chose the hard path."
 BRA.bcwfactions.2.t: "The Red Front of the Communist Party of Brazil"
 BRA.bcwfactions.2.d: "A small splinter group has consolidated around the most radical fringes of Brazil's already fragmented communist movement. Calling itself the Communist Party of Brazil - Red Fraction, this sectarian current rejects all other leftist organizations as revisionist and capitalist roaders, instead pledging allegiance to Chairman Gonzalo and the strategy of Protracted People's War. Their doctrine of New Democracy proposes a broad alliance between the national bourgeoisie, petty bourgeoisie, peasantry, and proletariat against the existing order, a framework they claim distinguishes them from the failed parliamentary left.\n\nFor now, the PCB-FV remains numerically insignificant, its public presence limited to the pages of The New Democracy newspaper and the organizing efforts of the Poor Peasants League in rural areas. But the deepening crisis has begun drawing the desperate and the disillusioned toward their message, and their patient work in the countryside continues unabated. The party is being rebuilt from the ground up."
 BRA.bcwfactions.2.a: "First the base, then the war."
 BRA.bcwfactions.3.t: "The Revolutionary Popular Action"
 BRA.bcwfactions.3.d: "In Rio de Janeiro, a new current coalesces within the PDT's moribund municipal chapter. Calling themselves the Revolutionary Popular Action (APR), a small cadre of young militants led by the obscure but fervent Daniel Albuquerque begins to reinterpret the party's labourist legacy through a distinctly Marxist lens. Rejecting both the parliamentary inertia of the party leadership and the sectarianism of the orthodox left, their first acts are conspicuously practical: organizing communal kitchens in the favelas and establishing a network for the distribution of donated clothing and medicine. For now, the PDT's old guard views them as a useful, if passionate, extension of their electoral base, while the APR focuses entirely on building material trust within Niterói's most neglected communities, prioritizing presence over proclamation.\n\nThis initial phase is defined by its legality and its patience. There are no clandestine cells or revolutionary rhetoric in their public materials; only the methodical work of mutual aid and the quiet creation of a parallel structure of governance. The movement's foundation is being laid not in ideological purity, but in the tangible relief of suffering, a strategy that masks their ultimate ambitions behind a facade of civic charity. As Brazil reels from the unrelenting weight of the pandemic's second wave, the APR's small network of soup kitchens and supply depots becomes a point of stability, drawing in the disillusioned and the desperate while the state apparatus flounders."
 BRA.bcwfactions.3.a: "The seeds of order are planted in the soil of neglect."
 BRA.bcwfactions.4.t: "The Brazilian Integralist Front"
 BRA.bcwfactions.4.d: "In the wake of the pandemic's devastating second wave, the Brazilian Integralist Front emerges from the shadows of Ceará's political fringe. Operating from a fortified headquarters in Fortaleza, the movement openly embraces the green-shirted legacy of Plínio Salgado while carefully infiltrating the Brazilian Labour Party's conservative apparatus. Built on a doctrine of corporatism, militant Catholicism, and uncompromising anti-communism, the FIB offers a vision of order that rejects both liberal democracy and the revolutionary left. Party leadership tolerates their presence, valuing the disciplined street militants and paramilitary-ready cadres who now fill PTB rallies across the Northeast.\n\nThough still confined to Ceará and small networks in neighboring states, the FIB's synthesis of traditionalist theology and organized political violence positions it for growth. While Brazil reels from economic collapse and institutional decay, their message of a corporatist state built on faith and hierarchy finds fertile ground among those who view the existing order as irredeemably broken."
 BRA.bcwfactions.4.a: "The green shirts await their hour."
 BRA.bcwfactions.5.t: "The South Is My Country Movement"
 BRA.bcwfactions.5.d: "As the pandemic deepens Brazil's political and economic fractures, the South is My Country Movement emerges from decades of quiet activism with renewed purpose. Led by Adílcio Cadorin, a historian and lawyer, the movement formalizes its ideological platform around the creation of a liberal conservative federation comprising Paraná, Santa Catarina, and Rio Grande do Sul. Rejecting both the older Gaúcho-centric separatism and the growing paramilitary trends elsewhere, the MOSMP anchors itself in constitutional activism, public seminars, and the cultivation of a cohesive regional identity centered on self-governance, economic liberty, and resistance to what it terms 'cultural Marxism.'\n\nThough still small and strictly non-militant, the movement begins coordinating with sympathetic municipal governments, business associations, and rural unions across the three states. Its leaders emphasize a strategy of institutional legitimacy, positioning the MOSMP as a serious political alternative should the federal government continue to falter. For now, its strength lies in ideas rather than arms. Still, in a nation growing accustomed to crisis, the line between regional advocacy and pre-separation governance has begun to blur."
 BRA.bcwfactions.5.a: "A new federation must be built."
 BRA.bcwfactions.6.t: "The Libertarian League"
 BRA.bcwfactions.6.d: "A new political current has coalesced around the internet showman Paulo Kogos, blending anarcho-capitalist slogans with a strident Christian ultraconservatism that most orthodox libertarians regard as incoherent. The Libertarian League's online presence is substantial, driven by Kogos's polemical style and a growing audience radicalized by the prolonged pandemic crisis. Despite this digital reach, the movement has failed to translate clicks into durable organization; attempts at founding local chapters have splintered, and self-described members often drift toward more traditional far-right groups.\n\nFor now, the League remains a phenomenon of comments sections and livestreams, its ideological contradictions making it a running joke among more serious activists. Yet its audience continues to grow, and Kogos has begun hinting at a shift from performance to preparation."
 BRA.bcwfactions.6.a: "The screen is small, but the crowd is listening."
 BRA.bcwfactions.7.t: "The New Resistance"
 BRA.bcwfactions.7.d: "A small circle of young militants and academics, centered around the philosopher Raphael Machado, has formally organized within the Democratic Labour Party's youth wing. Calling themselves the New Resistance, they openly reject both liberal democracy and orthodox Marxism, instead promoting the Fourth Political Theory; an anti-system, anti-modern, and anti-liberal doctrine drawn from Eurasianist thought. For now, they present themselves as a philosophical current within the broader labourist tradition, framing their ideas as a radical break from Western hegemony and a return to traditional values fused with state-led development.\n\nThe PDT's mainstream leadership remains uncertain how to respond. While some socialist currents view the NR's anti-Western and anti-liberal rhetoric as a useful polemical tool, others have begun demanding expulsion, citing clear overlaps with fascist and far-right ideological elements. The party's old guard, eager to maintain internal stability ahead of the coming elections, has thus far avoided a public confrontation, tolerating the New Resistance as an eccentric but contained faction."
 BRA.bcwfactions.7.a: "The harpy awaits the call to order."
 BRA.bcwfactions.8.t: "The Just Brazil Alliance"
 BRA.bcwfactions.8.d: "As the pandemic's second wave overwhelms Brazil's hospitals and economy, former judge Sérgio Moro emerges from political exile to announce the \"Brazil Just Alliance\" (ABJ). Positioning itself as a civic movement rather than a party, the ABJ rejects both Bolsonaro's chaotic populism and Lula's return to state-centric rule, instead championing anti-corruption enforcement, fiscal responsibility, and socially conservative family values. Its founding manifesto, circulated through business associations and middle-class WhatsApp groups, calls for a \"third way\" rooted in institutional rigor and moral renewal.\n\nWhile still small and legally unarmed, the ABJ's clarity of purpose attracts disillusioned professionals, evangelical shopkeepers, and former anti-corruption protesters who find the existing alternatives unviable. Moro's disciplined messaging avoids revolutionary rhetoric, emphasizing instead a restoration of predictable governance—a stance that wins quiet backing from agribusiness and segments of the judiciary. For now, the ABJ organizes through civic forums and petition drives, its potential for growth resting on the continued failure of both the left and the right to deliver stability."
 BRA.bcwfactions.8.a: "Order before Ideology."
 BRA.bcwfactions.9.t: "The International Worker's Movement in Brazil"
 BRA.bcwfactions.9.d: "For most Brazilians, the revolutionary Trotskyist left has long existed on the political margins. Overshadowed by the electoral success of PT and the legacy of bigger communist parties, the Workers' Cause Party (PCO) and the Unified Socialist Workers' Party (PSTU) have fought since the 90s denouncing both reformism and the bureaucratic degeneration of communist regimes. Small in number but unwavering in conviction, they believe that socialism can never be achieved through pragmatic compromise alone, but only through the conscious organization and self-emancipation of the working class. Having left more revolutionary wings inside PT, these movements defend a radical revolution to overthrow the capitalist system. However, even though they agree on most things, minor divergences have stopped PCO and PSTU from working together for a long time.\n\nAs political tensions escalate across Brazil, both parties have become increasingly visible in protests, labor strikes, and student mobilizations. Their banners, once confined to the edges of protests, now stand alongside larger left-wing organizations. And their militants are seen publicly distributing newspapers, organizing unions, and calling for workers to prepare for confrontations becoming increasingly inevitable.\n\nMore controversial, however, is what happened this morning. After a call to protest in Avenida Paulista yesterday, videos have begun circulating on social media showing some members of both the PCO and the PSTU at this demonstration carrying firearms. The police were called, but the protesters dispersed before any direct confrontation.\n\nThe Trotskyist leaders claim that the growing violence of the political climate demands organized self-defense against reactionary militias and political intimidation. They also announce closer cooperation and reconciliation. For them, the incident didn't prove accusations of extremism at all, as the revolutionaries declare that history has repeatedly shown what happens when workers face armed enemies while remaining defenseless themselves."
 BRA.bcwfactions.9.a: "The never ending revolution is still alive."
 BRA.bcwfactions.10.t: "The Brazilian Anarchist Coordination"
 BRA.bcwfactions.10.d: "Following the controversial start of the New Republic in 1988, some just lost faith in the Brazilian political system as a whole. Endless scandals and widespread corruption in the political apparatus radicalized them against the idea of a State itself. And like this, they discovered the Brazilian anarchist movements of the early 20st century, then decided to organize their own Mainly composed of intellectuals and activists, they gathered for the anarchist ideals and formed CAB, the Brazilian Anarchist Coordination, in 2012. The movement is deeply inspired by CNT-FAI Catalonian anarchists, and aims to establish a consular confederation of autonomous communes self-managed by the people themselves in Brazil. They denounce any form of vanguard party or personal leadership, as it violates the principle of self authority of the population.\n\nThomas Hobbes may come to mind as a direct opposite of Anarchist thought, except in a crucial core of his idea: the power of the people. In the state of nature, people are all free and have no limit to what they do. Instead of creating a peaceful society, Hobbes believes it created chaos and violence, and by only giving up power to the State could harmony be brought. In this fundamental belief it fulfills two ideas: that the State has to serve the people and if the State is illegitimate, the people must take up arms against this State that gives them no good.\n\nThe latter part is used and is a basis for anarchist thought and revolution, thus, it was no surprise that after the legalisation of firearm possession, the anarchists gathered their money they always hated to purchase the keys to their liberation. All that they need to do is pull the trigger."
 BRA.bcwfactions.10.a: "Can the populace become stronger than the State?"
 BRA.bcwfactions.11.t: "The First Command of the Capital"
 BRA.bcwfactions.11.d: "The vacuum left by the collapsing state finds its most disciplined occupant not in politics, but in the country's largest prison faction. Under the direction of Marcos Willians Herbas Camacho, commonly known as \"Marcola\", still held in Porto Velho, the First Command of the Capital begins formalizing its transition from a criminal network into a shadow governing apparatus. Its ideology remains deliberately vague, a lumpen social democracy of mutual aid, horizontal debt, and territorial justice, but its methods are ruthlessly consistent: clinics, fuel distribution, and dispute resolution appear in peripheral neighborhoods weeks before any politician arrives.\n\n\"1533\" becomes less a gang and more a parallel civil service. The faction's public message, \"PEACE, JUSTICE, LIBERTY, EQUALITY, and UNION\", attracts the desperate and the disillusioned in equal measure, while its commanders speak of a Brazil governed not by Brasília but by the organized poor. For now, the PCC asks only for loyalty, but it will soon demand everything."
 BRA.bcwfactions.11.a: "The Shadow Party grows in silence."
 BRA.bcwfactions.12.t: "The Third Pure Command"
 BRA.bcwfactions.12.d: "A small evangelical faction operating out of the Israel Complex has begun consolidating its position through a combination of drug trafficking and targeted violence. The Third Pure Command enforces a strict religious code in the territories it controls, expelling Catholics, practitioners of Afro-Brazilian faiths, and those it deems morally impure. Their flag displays the Star of David, and their leaders speak openly of accelerating the apocalypse through conversion and purification.\n\nFor now, the TCP remains one of several factions competing for dominance in Rio's periphery. Their theology marks them as unusual among criminal organizations, but their operational methods differ little from their rivals: they tax local commerce, recruit from the desperate, and eliminate those who challenge their authority. The state takes little notice, treating their activities as routine organized crime."
 BRA.bcwfactions.12.a: "The faithful sharpen their swords."
 BRA.bcwfactions.13.t: "The Brazilian Monarchist Movement"
 BRA.bcwfactions.13.d: "Amid the cascading failures of the republican order, the Brazilian Monarchist Movement emerges from the country's intellectual and aristocratic fringes. A loose convocation of self-styled nobles, conservative historians, and disaffected traditionalists, the MMB coalesces around a single proposition: that Brazil's crisis stems from the abolition of the monarchy and that only its restoration can provide lasting stability. Two factions immediately crystallize: the Petropolis branch, which advocates for a ceremonial monarch elected by a new aristocratic assembly, and the legitimists, who insist on recognizing Dom Luiz Gastão of the Vassouras line as the rightful constitutional sovereign. Both agree on rejecting the republic, but their fundamental disagreement over legitimacy versus pragmatism festers beneath a fragile surface of cooperation.\n\nThe movement remains small in its early phase, confined to elite salons, monarchist periodicals, and online forums where exiled nobility trade genealogies. Its members speak of organic hierarchy, regional autonomy, and the failures of positivism, framing their vision as a return to order rather than a radical break. For now, the MMB operates entirely within legal boundaries, its ambitions confined to intellectual persuasion and the slow cultivation of sympathizers among military officers and rural oligarchs. The grievances that will later divide them remain polite disagreements, deferred to an uncertain future."
 BRA.bcwfactions.13.a: "Some answers can be found in the past."
 BRA.bcwfactions.14.t: "The International Aquila"
 BRA.bcwfactions.14.d: "For the average joe in Brazil, ever since the enactment of strict gun control laws in the early 2000's, it was very hard to legally acquire firearms. Exceptions were made for some public servants and former police officers, having looser requirements to purchase weapons, but those amounted for a fraction of the Brazilian population. When the law was passed in 2003, public sentiment massively favored the \"Statute of Disarmament\", but that sentiment had changed ever since then.\n\nThe rising feeling of insecurity across the nation and the election of Jair Bolsonaro in 2018, a candidate which explicitly called for the end of the \"Statute\", signaled the ever-closer end of the strict gun control laws that had been in place for almost two decades. With the imminent death of the Statute, multiple companies turned their eyes towards Brazil, seeking to profit with the newfound market for guns. Among those companies, a Brazilian owned but foreign based private military company known as \"Aquila International\" sensed opportunity, and made their return to Brazil.\n\nThe initial months of the newly re-opened Brazilian arms market were shaky, but Aquila found their market niche in the sector of distribution. Aquila would buy and sell weapons to distributors. Eventually, after congress relaxed gun legislations, the sector stabilized, and Aquila had found themselves a new contract. "
 BRA.bcwfactions.14.a: "An Eagle never abandons its nest."
 BRA.bcwfactions.15.t: "The Right to Resistance"
 BRA.bcwfactions.15.d: "As President Bolsonaro's decree lands, dramatically expanding firearm access and effectively sanctioning the formation of armed militias under the banner of \"citizen security.\" The official justification is public safety amid the collapsing pandemic response, but the result is immediate: loyalist paramilitaries begin formalizing operations in working-class neighborhoods across Rio de Janeiro state, often backed by local business interests and police factions. In Niterói, the APR watches as armed groups linked to the president's base move into adjacent communities, establishing checkpoints and extorting commerce under the guise of order. The state's tacit endorsement of these forces transforms the political landscape overnight.\n\nThe APR's response is swift and pragmatic. Abandoning their previous pacifist posture, the movement quietly begins organizing its own armed wings, using the same legal loopholes the decree provides. The justification is defensive: communities served by APR's mutual aid networks now face armed incursions from rival groups, and the movement positions itself as the only viable protector. Weapons are acquired through the same newly liberalized markets, and training regimens begin in discreet locations across Niterói's periphery. Publicly, the APR maintains its charitable front. Privately, the organization has crossed a threshold it will never recross."
 BRA.bcwfactions.15.a: "When the state arms your enemy, you arm your neighbor."
 BRA.bcwfactions.16.t: "The Four Currents"
 BRA.bcwfactions.16.d: "As the APR expands beyond Niterói into greater Rio de Janeiro, internal ideological currents begin to crystallize, though open factionalism remains taboo. The largest group, the Labour Marxists, forms the movement's mainstream, synthesizing Brizola's labourist nationalism with classical Marxist categories of class struggle, viewing Vargas and Jango as necessary precursors to a future socialist republic. Smaller but influential, the Radical Labourists reject Marxism entirely while embracing the APR's militant anti-neoliberalism and state-led development, drawn more by the movement's energy than its theory. The Campist Thirdworldists orient the APR toward internationalism of a specific kind, aligning with China, Russia, and the Global South's anti-imperialist axis, seeing Brazil's future in multipolar solidarity rather than Western models. Finally, the Democratic Revolutionaries operate as the most orthodox faction, importing Maoist frameworks of New Democracy and staging-based revolution, viewing the APR's current work as a protracted popular war by other means.\n\nRemarkably, these four tendencies coexist without rupture. The secret lies in the APR's organizational culture: ideological debate is confined to internal study circles, while all public and operational work follows the Labour Marxist mainstream's line. The Radical Labourists handle logistics, the Campists manage foreign sympathies and solidarity networks, and the Democratic Revolutionaries train the emerging militia in disciplined, patient warfare. Disputes are mediated by Daniel Albuquerque himself, whose personal authority and demonstrated commitment to action over rhetoric keep the factions aligned. Unity is not ideological but practical; each tendency understands that the APR's survival depends on collective action against a common enemy, and that doctrinal purity is a luxury for peacetime."
 BRA.bcwfactions.16.a: "One movement, many dialects."
 BRA.bcwfactions.17.t: "The Commentator's Gambit"
 BRA.bcwfactions.17.d: "Jones Manoel, a prominent Marxist commentator known for his sharp polemics and substantial digital following, announces his formal affiliation with the PDT in early 2022. Unlike many who drift toward the party's more moderate factions, Manoel explicitly aligns himself with the Revolutionary Popular Action, citing Daniel Albuquerque's movement as the only force capable of synthesizing revolutionary theory with tangible grassroots organization. His stated objective is the governorship of Pernambuco, a state where the legacies of Jango and Brizola retain deep cultural resonance. The announcement sends ripples through both the traditional left and the Bolsonarist establishment, as Manoel's media platform represents a significant amplification of APR's reach beyond its Niterói stronghold.\n\nThe APR leadership embraces the move with calculated enthusiasm. Manoel brings not only visibility but also a veneer of intellectual credibility to a movement still defined largely by its charitable work and defensive arming. His campaign infrastructure, funded partially by digital donations and partially by the APR's growing networks, begins organizing in Recife and the interior. For the first time, the movement tests its ability to operate within formal electoral politics while maintaining its parallel structures. The PDT's national leadership, eager for relevance, grants Manoel its official nomination. The APR now holds a public face capable of reaching audiences its clandestine apparatus never could."
 BRA.bcwfactions.17.a: "A voice for the barracks finds a stage for the revolution."
 BRA.bcwfactions.18.t: "The Northeastern Shift"
 BRA.bcwfactions.18.d: "With Jones Manoel's candidacy secured, the APR's center of gravity shifts decisively from Niterói to Pernambuco. Key organizers from the original Niterói cell relocate to Recife, bringing with them the operational blueprint that proved successful in Rio: communal kitchens, clothing distribution networks, and the discreet paramilitary structure now framed as community defense. The movement establishes a formal headquarters in the working-class neighborhood of Casa Amarela, converting a former union hall into a hub for both electoral coordination and mutual aid operations. The decision to deprioritize Niterói is communicated to local cadres as a strategic redeployment rather than abandonment, but the message is clear: the electoral front now commands the movement's primary resources and attention.\n\nThe shift is not without friction. PDT loyalists in Rio express concern that the party's rising radical faction is abandoning the state that nurtured it, while APR members left behind in Niterói are instructed to maintain existing programs without expecting reinforcement. In Pernambuco, however, the influx of experienced organizers transforms Manoel's campaign from a digital-media operation into a ground-level force. The movement begins consolidating support in Recife's peripheral zones and extending into the Zona da Mata, where the historical memory of peasant leagues and pre-1964 organizing provides fertile ground. For the first time, the APR operates at a scale that demands coordination across multiple municipalities, testing its internal cohesion as it builds toward the October election."
 BRA.bcwfactions.18.a: "The seed leaves its nursery for the open field."
 BRA.bcwfactions.19.t: "The Recife Breakthrough"
 BRA.bcwfactions.19.d: "October 2022 delivers a result that confounds pollsters and upends Brazilian political calculus. Jones Manoel captures the governorship of Pernambuco with 52.4 percent of the vote in the second round, defeating the Bolsonarist candidate by a margin that widens as results from Recife's periphery and the Zona da Mata arrive in the final hours of counting. The victory is narrow but undeniable. Manoel's campaign, powered by APR's ground organization and his own considerable digital platform, achieved what no explicitly Marxist candidate had accomplished: executive power over a Brazilian state. The PDT, long considered a party in decline, suddenly finds itself at the center of national attention, though the credit belongs almost entirely to the revolutionary faction operating within it.\n\nThe implications extend far beyond Pernambuco. For the first time, the APR holds formal governing authority, giving its parallel structures of mutual aid and community defense the cover of state legitimacy. Manoel's inauguration in January 2023 signals a new phase: the movement now controls a state budget, a civil police force, and the machinery of public administration. The APR's cadres move quickly to staff key secretariats with their own personnel, while maintaining the separate structures that predate the election. In Brasília, the Bolsonaro administration views the outcome with undisguised alarm, recognizing that a successful communist government in the Northeast could reshape the country's political geography. The movement's leaders speak publicly of reconstruction and social welfare. Privately, they prepare for the confrontation they know is coming."
 BRA.bcwfactions.19.a: "The fortress now holds a gate."
 BRA.bcwfactions.20.t: "The Seizure"
 BRA.bcwfactions.20.d: "The state of emergency decree, signed in the early hours following Alckmin's assassination and the disappearance of Lula and Moraes, sweeps through Brazil's institutions with pre-planned precision. Among its first targets is Pernambuco. Federal police units, acting on orders from the presidential palace, surround Jones Manoel's residence in Recife before dawn, placing the governor-elect under house arrest on charges of \"subversive association\" and \"threat to democratic order.\" The inauguration scheduled for the following week is summarily voided, with the federal government announcing direct intervention in the state's executive branch. Manoel's brief moment as the first communist governor ends before it can begin, his detention broadcast across national television as proof of the administration's vigilance against revolutionary infiltration.\n\nThe APR's leadership disperses into the shadows. Daniel Albuquerque, who had relocated to Recife to coordinate the transition, slips through a federal cordon in the Caxangá neighborhood hours before the arrest order reaches his safe house. Other key organizers follow suit, melting into the Zona da Mata and the sertão, where the movement's pre-electoral infrastructure provides cover. The PDT's national leadership, caught flat-footed, issues statements of condemnation that carry no weight against federal forces already occupying the state legislature in Recife. The parallel structures the APR built: the communal kitchens, the distribution networks, the armed community defense cells, go underground, their organizers now fugitives. The election that promised a new future instead delivers a dress rehearsal for what is to come."
 BRA.bcwfactions.20.a: "The seat remains empty."
 BRA.bcwfactions.21.t: "The New Campaign for Legality"
 BRA.bcwfactions.21.d: "Six weeks after the federal intervention, the APR emerges from its clandestine reorganization with a coordinated series of actions across Pernambuco's interior. In Caruaru, Petrolina, and the Zona da Mata, armed contingents seize municipal radio stations to broadcast the manifesto of the New Campaign for Legality, a direct invocation of the 1961 movement that secured João Goulart's presidency. Daniel Albuquerque, appearing in a grainy video recorded in an undisclosed location, announces that the APR now considers itself the legitimate authority in Pernambuco and declares its intention to liberate Jones Manoel from military custody and restore him to the governorship. The proclamation is accompanied by the mobilization of previously hidden cells: communal kitchens become supply depots, community defense units become platoons, and the movement's year-long preparation for confrontation transitions from contingency to action. Federal forces in Recife respond by tightening the cordon around Manoel's detention site, but the countryside increasingly falls under APR influence.\n\nThe opposing force crystallizes with equal speed. The Alliance With God for Family and Liberty, a coalition of Bolsonarist militias that formalized during the emergency decree, redirects its attention from scattered urban skirmishes to the containment of the APR in the Northeast. Armed with the same legal cover the 2021 decree provided and reinforced by off-duty police and retired military personnel, the Alliance establishes forward operating bases in the agreste region, positioning itself as the vanguard against what it calls \"the Varguist-Communist restoration.\" The two forces begin probing each other's lines in the municipalities surrounding Recife, each testing the other's strength in a series of escalating clashes that national news outlets have begun calling a prelude to open civil war. The intervention that was meant to pacify Pernambuco has instead become the ground on which two irreconcilable visions of Brazil prepare to settle their accounts."
 BRA.bcwfactions.21.a: "Two armies claim the same land, while one governor waits in a cell."
 BRA.bcwfactions.22.t: "The Party Takes Form"
 BRA.bcwfactions.22.d: "With political institutions increasingly hollowed out and the traditional parties discredited by years of crisis, the Free Brazil Movement makes its most consequential decision since 2014. Renan Santos announces the formal campaign to gather signatures for the creation of the Free Brazil Movement Party, a name he personally dislikes but accepts as necessary to preserve the brand recognition built over nearly a decade of organizing. The platform is direct: economic liberalization, uncompromising criminal justice reform, and a rejection of the populist styles that have come to dominate both the left and the right. Inspired by the hardline security policies of Nayib Bukele and the framework of Enemy Criminal Law, the party presents itself as the only force willing to confront organized crime with the same ruthlessness it reserves for corrupt politicians.\n\nThe signature drive becomes the movement's primary focus. Organizers fan out across São Paulo's commercial districts, Minas Gerais's mid-sized cities, and the southern states where liberal economic messages still find receptive audiences. Renan leads the effort personally, appearing in shopping centers and business associations to make the case that Brazil requires a party unafraid to treat criminal organizations as hostile forces rather than social problems. The response is modest but steady. For a movement that shrank to a few hundred dedicated members during the Bolsonaro years, the act of building something new, however uncertain its prospects, restores a sense of purpose that street protests and electoral compromises never provided."
 BRA.bcwfactions.22.a: "The signature is the first weapon."
 BRA.bcwfactions.23.t: "The Registry and the Rifle"
 BRA.bcwfactions.23.d: "After months of signature collection, legal battles, and bureaucratic obstruction, the Superior Electoral Court formally registers the Free Brazil Movement Party. Renan Santos stands before a handful of reporters in São Paulo to announce what his exhausted organizers already know: the PMBL is now eligible to field candidates in the coming elections. The achievement is real but modest; a party with minimal institutional presence, no elected officials, and a name its own founder dislikes. Yet for a movement that nearly dissolved entirely during the Bolsonaro years, registration represents survival. The dream of a liberal, anti-populist alternative to Brazil's polarized politics now has a legal vehicle, however fragile.\n\nThe timing of this victory coincides with darker preparations. The same gun liberalization decrees that armed Bolsonarist militias and leftist community defense cells have now armed the PMBL's local chapters. Renan approved the policy quietly six months prior: chapters in São Paulo, Minas Gerais, and Rio Grande do Sul began organizing licensed firearms training for members, framing it as self-defense against political violence that has become routine in municipal elections. The weapons are legal, the registrations are proper, and the stated purpose is protection of party offices and supporters. But the line between defense and paramilitary organization has blurred across Brazil, and the PMBL's entry into that gray zone marks a transformation. The party that began with protest signs now prepares for a future where ballots may not decide who governs."
 BRA.bcwfactions.23.a: "The registry is filed."
 BRA.bcwfactions.24.t: "The Four Pillars"
 BRA.bcwfactions.24.d: "With the party officially registered, the PMBL's internal factions solidify into recognizable currents. The largest follows Renan Santos, who maintains the movement's original synthesis of economic liberalism, social conservatism, and anti-populist institutionalism. Glenda Varotto leads the progressive wing, advocating for civil liberties expansions and a less confrontational social policy while remaining committed to the party's economic platform. On the opposite flank, Ricardo Almeida commands the conservative faction, pushing for stronger alignment with traditional religious constituencies and more aggressive cultural warfare against the left. The three groups coexist uneasily, held together by the shared goal of establishing the PMBL as a viable electoral force and by Renan's careful management of internal tensions.\n\nA fourth current operates in the shadows of this arrangement. Renato Impera, a former political blogger with a growing online following, has begun articulating a vision that rejects liberal democracy entirely. Drawing on Dark Enlightenment philosophy and neo-reactionary thought, Impera advocates for the dissolution of the republic and its replacement with a \"Brazilic Imperial Confederation,\" a term he insists upon to distance his project from what he calls the corrupt and degenerate Brazilian state. His followers, concentrated in online forums and a handful of southern municipalities, view the PMBL's electoral strategy as a temporary vehicle rather than an end goal. For now, Impera remains on the fringe, tolerated by party leadership for the organizational energy his network provides. But his ideas have begun to circulate among younger members disillusioned with democracy's capacity to deliver order."
 BRA.bcwfactions.24.a: "The republic has many rooms, but some have no windows."
 BRA.bcwfactions.25.t: "The Return and the Readiness"
 BRA.bcwfactions.25.d: "The October 2022 results bring Luiz Inácio Lula da Silva back to the presidency, narrowly defeating Jair Bolsonaro in a runoff that deepens the country's already dangerous divisions. The PMBL, having officially declared neutrality in the dispute, watches from the sidelines as both camps claim fraud and supporters of the defeated president begin gathering outside military barracks. For Renan Santos and his leadership, the election confirms what they have long argued: Brazil's political system produces only two outcomes, both equally incapable of governing a nation in crisis. The party's electoral performance, while modest, provides a foundation. Seven federal deputies and two senators now carry the PMBL banner, enough to secure committee assignments and the legal protections that come with congressional office.\n\nBehind this public-facing achievement, preparations accelerate. São Paulo becomes the center of a quiet organizational buildup. Party chapters across the state coordinate with local business associations and neighborhood watch groups, formalizing the armed training programs initiated the previous year into a more structured network. The stated purpose remains defensive: protecting members, securing party offices, and maintaining order in communities where police presence has thinned. But the scale of the operation suggests a longer view. Warehouses in the Zona Sul and the ABC region now stock non-perishable food, medical supplies, and fuel. Radio communication protocols have been established between chapters. Renan himself has stopped appearing at public events without a security detail. The transition of presidential power in Brasília is still two months away, but for those watching the fissures spread, the question is no longer whether Brazil will fracture, but when."
 BRA.bcwfactions.25.a: "We wait for the capital."
 BRA.bcwfactions.26.t: "The Roar of the Jaguar"
 BRA.bcwfactions.26.d: "With Bolsonaro's state of siege declared and federal forces moving to consolidate control over the apparatus of government, Renan Santos issues the order that transforms the PMBL from a political party into something else entirely. From a command post established in a commercial building in the Brooklin district, he activates the networks built over the preceding two years. Within hours, PMBL-aligned militias seize key intersections across the Zona Sul, establish defensive perimeters around party strongholds in the ABC region, and begin coordinating with neighborhood associations that have long viewed the party as their primary link to organized political power. The public declaration follows shortly after: total opposition to the Bolsonaro government, refusal to recognize the state of siege as legitimate, and a call for Paulistas to resist what Renan calls \"the usurpation of the republic.\"\n\nThe response is immediate and chaotic. Federal police units dispatched to reassert control find themselves facing organized resistance in neighborhoods where every street corner has become a checkpoint and every rooftop a watch post. PMBL-aligned deputies who survived the initial roundup broadcast from undisclosed locations, relaying Renan's communiqués and coordinating supply lines. The party's armed contingents, trained under the banner of licensed self-defense, now operate openly in territory they control, distributing food, patrolling streets, and turning back federal incursions with disciplined fire. Renan himself appears in a brief video recorded in an undisclosed location, standing before a PMBL flag, his voice steady as he delivers a single sentence: \"We did not start this fight, but we will finish it on our own ground.\" For the first time since its founding, the Free Brazil Movement wages a war it never sought but spent years preparing to fight."
 BRA.bcwfactions.26.a: "The jaguar does not ask permission to defend its territory."
 BRA.bcwfactions.27.t: "The Unlikely Accord"
 BRA.bcwfactions.27.d: "As federal authority fragments across São Paulo, the PMBL establishes operational contact with the armed contingents of the Libertarian League. Paulo Kogos's movement, long dismissed as a digital curiosity of radical libertarian theory, has transformed into a paramilitary network under the field command of a figure known only as Tiradentes, controlling pockets of the capital's west zone and parts of the interior. The agreement between Renan Santos and the League is not ideological but practical: shared enemies in the form of communist militias consolidating in the eastern periphery, criminal factions exploiting the power vacuum, and what remains of the state government's security apparatus. Joint patrols begin in contested border zones, with each side maintaining separate command structures while coordinating defensive lines and intelligence sharing.\n\nThe arrangement is understood by both parties as a temporary necessity rather than a permanent alliance. Renan views the League's anarcho-capitalist principles as politically unserious and operationally reckless; Kogos's followers regard the PMBL's electoral history and statist inclinations with equal suspicion. But in a city where fuel runs through checkpoints controlled by armed men and no single authority governs more than a few square kilometers, mutual interest dictates cooperation. The communiqués exchanged between their headquarters are brief, logistical, and devoid of ideological language. For now, the jaguar and the privateer fight on parallel fronts, their rivalry postponed until a day that may never come."
 BRA.bcwfactions.27.a: "The truce is written in ammunition, not ink."
 BRA.bcwfactions.28.t: "The Purification Rituals"
 BRA.bcwfactions.28.d: "The Third Pure Command has escalated its campaign of religious enforcement in the Israel Complex and surrounding areas. What began as expulsion has become public execution, with the faction conducting ritualized killings of those it deems impure. Catholics, practitioners of Afro-Brazilian religions, queer individuals, and women judged morally unworthy have been singled out for these spectacles, which the faction broadcasts to instill terror in targeted communities and consolidate loyalty among its base.\n\nThe executions serve a dual purpose: eliminating perceived threats while binding the faction's membership through shared violence. Local residents speak of the events in hushed tones, and those who can flee have begun doing so. The state's security forces have noted the escalation but have taken no meaningful action, treating the deaths as gang-related rather than the emergence of organized religious terror."
 BRA.bcwfactions.28.a: "The congregation watches in silence."
 BRA.bcwfactions.29.t: "The Expansion"
 BRA.bcwfactions.29.d: "The Third Pure Command has broken out of the Israel Complex and is moving into neighboring favelas with a speed that has caught both rival factions and state authorities off guard. Waves of refugees flee ahead of their advance, carrying stories of summary executions and forced conversions. The faction's fighters, motivated by religious fervor and the spoils of conquest, have overrun several communities once considered strongholds of the Red Command, whose traditional structure has struggled to counter an enemy that treats death as a doorway to salvation.\n\nRio de Janeiro's security apparatus continues to frame the violence as an internal dispute between criminal organizations, declining to intervene in what officials describe as gang warfare. The TCP now controls a contiguous stretch of territory across the city's north and west zones, and intelligence reports suggest their numbers have swelled with recruits drawn from both the desperate and the devout. For the first time, analysts in Brasilia are quietly acknowledging that the faction may soon eclipse the Red Command as the dominant criminal force in the state."
 BRA.bcwfactions.29.a: "The faithful march while the state looks away."
 BRA.bcwfactions.30.t: "The BOPE Incursion"
 BRA.bcwfactions.30.d: "As civil war consumes the rest of Brazil, the Battalion of Special Police Operations has abandoned any pretense of following federal orders. Moving in force across the city's north and west zones, BOPE has launched a unilateral campaign against both the Third Pure Command and the Red Command, advancing with the explicit goal of destroying all organized armed groups in the favelas. Their methods have proven as indiscriminate as they are effective: residents report summary executions of anyone found in possession of weapons or displaying affiliation with any faction, and entire communities have been leveled in the fighting.\n\nThe federal government, preoccupied with the broader collapse of the country, has issued no response to BOPE's insubordination. In the streets of Rio, a three-way war now rages between the state's elite police battalion, the expansionist TCP, and the remnants of the Red Command. No faction has emerged with clear control, and local leaders have begun organizing independent community defense councils in the chaos. As the rest of Brazil fractures, the question of who will ultimately govern Rio's periphery remains unsettled, with BOPE's crusade having opened a power vacuum none of the combatants seem capable of filling."
 BRA.bcwfactions.30.a: "The city burns while armies clash in the ashes."
 BRA.bcwfactions.31.t: "The Movement for the Independence of the Pampa"
 BRA.bcwfactions.31.d: "The Movement for the Independence of the Pampa, led by journalist and politician Irton Marx, formally enters into a tactical alliance with the South is My Country Movement. Though the MIP rejects the inclusion of Paraná and Santa Catarina in its own vision of a Gaúcho republic, the two organizations have found common cause in their shared commitment to liberal conservative principles and separation from the federal government. The accord, negotiated quietly over several months, establishes a united front that allows both movements to pool resources, coordinate messaging, and present a broader front against Brasilia while preserving their distinct territorial ambitions for the future.\n\nFor the MOSMP, the alliance provides access to the MIP's established networks in Rio Grande do Sul's rural interior and its connections within the state's traditionalist circles. For the MIP, alignment with the larger MOSMP offers credibility beyond the pampas and a pathway to influence in neighboring states it would otherwise ignore. The agreement is understood by both sides as a marriage of convenience rather than ideological fusion, but in a political landscape growing more fragmented by the month, the united front has already begun coordinating public events and joint statements that amplify their separatist message across the southern region."
 BRA.bcwfactions.31.a: "The pampas and the plateau march together."
 BRA.bcwfactions.32.t: "The Southern Front"
 BRA.bcwfactions.32.d: "A third faction has entered the separatist alliance. The Südfront, a clandestine organization led by a figure known only as \"Barbarossa,\" brings with it a far more radical vision than its new partners. Espousing neo-Nazi ideology and white supremacist doctrine, the group seeks not merely separation from Brazil but the establishment of an \"ethnically pure\" state across the three southern states, purged of what it calls \"mongrelism.\" Its membership, drawn from the region's most extreme fringes, has maintained a shadow existence for years, building small arms caches and cultivating cells in rural municipalities where state presence has long been minimal.\n\nThe MOSMP and MIP leadership have accepted the Südfront's support despite deep reservations. Publicly, the alliance is framed as a pragmatic consolidation of separatist forces against a common enemy in Brasilia. Privately, Cadorin and Marx have made clear to their own cadres that the arrangement is temporary and tactical. The Südfront brings capabilities the other movements lack: paramilitary discipline, secure rural redoubts, and a willingness to operate outside legal boundaries. But as the alliance deepens, the moderates find themselves increasingly dependent on a faction whose ultimate goals are irreconcilable with their own vision of a liberal conservative federation. For now, the three movements march under separate banners toward a shared horizon. Where that road ends, no one can say."
 BRA.bcwfactions.32.a: "The coalition grows darker."
 BRA.bcwfactions.33.t: "The Juche Gaúcho Thought"
 BRA.bcwfactions.33.d: "A bizarre new current has emerged from the depths of social media, centered on an anonymous influencer operating under the name \"Giuseppe Garibaldi.\" His doctrine, which he calls \"Juche Gaúcho Thought,\" presents itself as a parody of the other separatist movements while advancing its own absurdist vision: a North Korean-style autarky established in Rio Grande do Sul, governed by the principles of self-reliance, supreme leadership, and the elevation of chimarrão and churrasco to state-sponsored observances. His posts, which blend ironic nationalism with genuine local grievances, have amassed a following that stretches far beyond the usual separatist circles, with young users sharing memes of gauchos in juche robes and mock propaganda posters declaring \"Our Erva-Mate Is the Purest in the World.\"\n\nThe other separatist movements have dismissed Garibaldi as a provocateur, though his growing reach has become impossible to ignore. MOSMP and MIP organizers report that younger recruits increasingly reference his content, often unsure whether his proposals are sincere satire or satire that has become sincere. Garibaldi himself remains an enigma, his real identity unknown, his posts cycling between meticulous ideological mockery and unexpectedly sharp critiques of the mainstream separatist factions. For now, the \"Juche Gaúcho Thought\" phenomenon remains confined to digital spaces, a running joke that no one in power takes seriously. But in the southern states, where the line between regional pride and political radicalism has begun to blur, even a joke can become a banner."
 BRA.bcwfactions.33.a: "The great leader requires more chimarrão."
 BRA.bcwfactions.34.t: "The Southern Rifles"
 BRA.bcwfactions.34.d: "With the federal government's firearm liberalization decree now in effect, the three movements of the separatist coalition have moved quickly to arm their supporters. What began as scattered individual purchases has become coordinated effort, with MOSMP and MIP chapters organizing group training sessions and facilitating licensed acquisitions through sympathetic gun shops across the three states. Public messaging emphasizes self-defense and the protection of separatist gatherings from \"centralizing voices\" in Brasilia, framing the arming as a legitimate exercise of newly expanded rights. Behind closed doors, organizers speak openly of the need to match the paramilitary capabilities the Südfront already possesses.\n\nThe arming has accelerated the coalition's internal imbalance. The Südfront, which maintained weapons caches long before the decree, has used the liberalized market to expand its stockpiles with legal cover, all while deepening its influence through the shared logistics networks now emerging between the movements. MOSMP and MIP leaders insist their supporters train only in legal frameworks and operate strictly as defensive associations, but the distinction grows thinner with each passing month. In the countryside, where the decree's effects have been felt most strongly, armed men flying separatist flags have begun appearing at community meetings, and local authorities have stopped asking whose orders they follow."
 BRA.bcwfactions.34.a: "Rights become rifles."
 BRA.bcwfactions.35.t: "The Referendum Declaration"
 BRA.bcwfactions.35.d: "The separatist coalition has announced its intention to hold a unilateral secession referendum across Paraná, Santa Catarina, and Rio Grande do Sul. Without federal authorization and in direct defiance of the constitution, the three movements have established parallel electoral commissions, printed ballots, and begun organizing polling sites in municipalities where their influence is strongest. The announcement, delivered jointly by Adílcio Cadorin of the MOSMP and Irton Marx of the MIP, with the Südfront's Barbarossa appearing separately in a pre-recorded statement, declares that the southern people will exercise their \"right to self-determination\" regardless of Brasilia's response.\n\nAcross the three states, separatist contingents have moved to seize control of city halls, municipal squares, and major intersections to establish demonstration zones and polling centers. In smaller municipalities, local authorities have offered no resistance, with many mayors openly endorsing the referendum or quietly looking away. In larger cities, confrontations have erupted as state police attempt to reclaim public spaces from armed separatist groups. The federal government has condemned the referendum as an act of insurrection and ordered security forces to prevent it from proceeding, but with political violence spreading across the country, reinforcements have been slow to arrive. The south now stands at a precipice, with ballots and bullets poised to decide its future."
 BRA.bcwfactions.35.a: "The south votes without permission."
 BRA.bcwfactions.36.t: "The General Revealed"
 BRA.bcwfactions.36.d: "The anonymous influencer known as Giuseppe Garibaldi has unmasked himself in a video that has shattered the assumptions of every faction watching the south. Standing before a formation of armed men in matching green fatigues, his face finally visible, he reveals what no one believed existed: a fully organized guerrilla force operating under the banner of Juche Gaúcho Thought. In a rambling address that oscillates between revolutionary rhetoric and the same absurdist nationalism that built his following, he declares his intention to oppose both the federal government and the \"reactionaries who violate the cause of nationalism,\" condemning the MOSMP, MIP, and Südfront as bourgeois sellouts and traitors to the true spirit of the pampas.\n\nThe video has thrown the separatist coalition into disarray. Intelligence reports now suggest Garibaldi has spent the past two years quietly building his force, recruiting from the same disaffected rural populations the other movements courted, all while hiding his preparations behind a mask of ironic shitposting. His arsenal, visible in the footage, rivals that of the Südfront's known caches. His location remains unknown. Both Brasilia and the separatist leadership now face an impossible question: is this an elaborate joke with real guns, or the opening gambit of a third force no one anticipated? The general's final words in the video offer no clarity, only a promise: \"The chimarrão will boil, and the fire will rise. Await the harvest.\""
 BRA.bcwfactions.36.a: "The memes were real."
 BRA.bcwfactions.37.t: "The Three Green Shirts"
 BRA.bcwfactions.37.d: "Within the Brazilian Integralist Front, three distinct currents now compete for the soul of the movement. Moisés Lima commands the orthodox wing, a rigid traditionalist who treats Plínio Salgado's writings as scripture and rejects any deviation from the original Integralist doctrine of corporatism, spiritual hierarchy, and anti-materialist revolution. Paulo Fernando da Costa leads the reformist faction, a pragmatic face for the PTB's electoral ambitions who speaks of \"Reformist Integralism\" and gradual governance, softening the movement's sharper edges to court middle-class voters and sympathetic legislators. Eduardo Fauzi directs the vanguardists from the shadows, a believer in armed struggle who views both the orthodox and reformists as naïve, preparing cells and stockpiles for the cleansing violence he insists is inevitable.\n\nFor now, the three wings maintain an uneasy alliance, bound by shared enemies and the discipline of the sigma. But as Brazil's institutions continue to erode, the question of who leads the FIB into the coming storm grows more urgent with each passing month."
 BRA.bcwfactions.37.a: "The sigma has three points, but only one center."
 BRA.bcwfactions.38.t: "The Society of the Sigmas"
 BRA.bcwfactions.38.d: "A youth auxiliary now operates under the Integralist banner, though its methods have raised eyebrows among the movement's traditionalists. The Society of the Sigmas (SdS) floods social media with memes, ironic shitposting, and slick propaganda designed to lure teenagers alienated by pandemic isolation and economic despair. The name, deliberately chosen, plays on the \"sigma male\" internet archetype of the lone wolf who rejects both alpha dominance and beta conformity, a framing the FIB has actively encouraged despite internal grumbling from more serious cadres who find the entire enterprise embarrassing. Online, green-shirted cartoons lecture on corporatism between jokes about grinding and \"the lone wolf's path to national renewal.\"\n\nThe strategy has worked. Recruitment among Brazilian youth has surged, with the SdS establishing digital outposts across messaging apps and gaming platforms. Older Integralists grumble about dignity and doctrinal purity, but Moisés Lima has privately approved the effort, recognizing that memes reach where manifestos cannot. Paulo Fernando da Costa, ever the pragmatist, has begun coordinating with SdS administrators to channel new recruits toward PTB-adjacent voter registration drives. Eduardo Fauzi's vanguardists, meanwhile, monitor the same forums for young men with violent potential. The jokes may be ironic, but the sigma calls all the same."
 BRA.bcwfactions.38.a: "The lone wolf joins the pack."
 BRA.bcwfactions.39.t: "The Open Carry"
 BRA.bcwfactions.39.d: "With the gun liberalization decree in full effect, Eduardo Fauzi's vanguardists have abandoned the shadows. Armed marches now snake through Fortaleza's working-class neighborhoods, green-shirted militants displaying newly purchased rifles with the same ceremonial pride their predecessors once reserved for flags and standards. The message is unmistakable: the Integralists are no longer just a political movement. Society of the Sigmas teenagers, barely old enough to purchase firearms legally, have begun posing with pistols in social media posts, their ironic memes colliding with very real weapons. Older SdS members have watched in horror as the joke spirals beyond their control, with some quietly deleting accounts while others double down.\n\nCalls for proscription have followed. Opposition politicians demand the Superior Electoral Court ban the FIB and its auxiliaries, citing paramilitary activity and the radicalization of minors. Even figures within Bolsonaro's coalition, uncomfortable with armed fascists competing for their own base, have endorsed the ban. The FIB's leadership now faces its first real test: Lima urges patience and legal defense, da Costa scrambles to distance the PTB from the controversy, and Fauzi continues to march, daring the state to act."
 BRA.bcwfactions.39.a: "The sigma carries a rifle."
 BRA.bcwfactions.40.t: "The Battle For Ceará"
 BRA.bcwfactions.40.d: "Paulo Fernando da Costa's gubernatorial campaign has transformed the streets of Fortaleza into a proving ground. Green-shirted paramilitaries now serve as unofficial security at rallies, their rifles visible at campaign stops across the interior. The reformist Integralist, once the movement's moderate face, has stopped pretending his supporters are merely enthusiastic volunteers. The FIB's parallel structures, armed neighborhood patrols, supply networks, and youth cadres operate openly under the banner of electoral politics. Polls show da Costa within striking distance of victory, a prospect that has united an unlikely coalition against him: communists, liberals, centrists, and even reluctant Bolsonarists have rallied behind the FBE's Elmano de Freitas, terrified of what an Integralist governor would mean for the Northeast.\n\nThe campaign has become a referendum on the FIB itself. De Freitas warns of a \"green-shirted governorship\" that would use state resources to arm militants and purge political enemies. Da Costa counters with promises of order, Christian governance, and economic revival, his rhetoric carefully calibrated to avoid overt fascism while his paramilitaries march in the background. The federal government watches nervously, unsure whether to intervene against a candidate who has broken no laws, only norms. Ceará, long a left-wing stronghold, now stands at the edge of a political earthquake."
 BRA.bcwfactions.40.a: "The sigma waits for the count."
 BRA.bcwfactions.41.t: "The Green Governor"
 BRA.bcwfactions.41.d: "Against all predictions, Paulo Fernando da Costa has captured the governorship of Ceará. The official margin is narrow, but the real story lies in the precincts where green-shirted militias established informal checkpoints outside polling stations. Witnesses reported armed men photographing voters, \"assisting\" the elderly with their ballots, and patrolling queues with rifles slung across their chests. The FIB's paramilitary apparatus, once confined to Fortaleza's periphery, operated openly across the state on election day. International observers have condemned the vote as neither free nor fair, but the Superior Electoral Court, already overwhelmed by similar disputes nationwide, has declined to intervene. Da Costa's inauguration is scheduled for January.\n\nThe reaction has been swift and fractured. Elmano de Freitas has refused to concede, declaring the election stolen and calling for federal intervention. The broad coalition that opposed da Costa has begun to splinter: communists demand street resistance, liberals urge legal challenges, and Bolsonarists quietly celebrate the defeat of the FBE while privately worrying about the precedent. In Fortaleza, FIB militants celebrate openly, their governor-elect standing before a green flag as Moisés Lima looks on approvingly. Eduardo Fauzi's vanguardists have already begun drafting plans for state-controlled militias, their patience rewarded at last. Ceará is now the first Integralist state in a century."
 BRA.bcwfactions.41.a: "The sigma takes the palace."
 BRA.bcwfactions.42.t: "The Intervention"
 BRA.bcwfactions.42.d: "Before Paulo Fernando da Costa could take his oath, the coup came first. Bolsonaro's state of emergency decree swept through Ceará before dawn. Federal police units surrounded the FIB's headquarters in Fortaleza, seizing weapons, documents, and the governor-elect himself. Da Costa now sits in a military cell, his reformist Integralism reduced to a footnote in Brazil's rapid unraveling. Moisés Lima slipped the cordon, reportedly fleeing into the sertão. Eduardo Fauzi's vanguardists melted back into the shadows, their weapons cached for the fight they always knew was coming. The green shirts never reached the palace.\n\nAcross Ceará, ordinary citizens have dared to celebrate. Neighbors who feared the paramilitaries now watch federal convoys pass with something resembling relief. The broad coalition that opposed the FIB, communists, liberals, Bolsonarists, has found a brief, uneasy unity in the spectacle of Integralist humiliation. But the celebrations are quiet, and they do not last long. Bolsonaro's forces are not liberators; they are occupiers with their own agenda. The same decree that crushed the Integralists has dissolved the state legislature, suspended civil liberties, and placed Ceará under direct military administration. The sigma is gone, but the sigma's cage remains."
 BRA.bcwfactions.42.a: "The people cheer the fall of the green shirt."
 BRA.bcwfactions.43.t: "The March on Fortaleza"
 BRA.bcwfactions.43.d: "With federal authority fragmenting across the Northeast, the Integralists have struck. Eduardo Fauzi's vanguardists, supported by newly armed Society of the Sigmas recruits, launched coordinated assaults on government buildings, police stations, and military depots across Fortaleza. The city's mayor surrendered within forty-eight hours, his authority dissolved by green-shirted columns marching through the streets where they had once been confined to the periphery. Moisés Lima emerged from hiding to declare the restoration of \"legitimate Integralist governance,\" while Fauzi's paramilitaries stormed the military facility holding Paulo Fernando da Costa. The reformist governor-elect, freed from his cell, now stands before cameras with an expression that mixes vindication with visible unease. He is no longer the moderate face of the movement; he is the prisoner of its armed wing.\n\nThe fall of Fortaleza has sent shockwaves across Brazil's fractured battlefield. Federal forces, have declared the city \"temporarily unrecoverable.\" The broad coalition that once opposed the Integralists has dissolved entirely. Inside Fortaleza, the three factions of the FIB now govern uneasily together. The sigma has taken the palace after all, though not in the way anyone imagined."
 BRA.bcwfactions.43.a: "The blue flag flies over Fortaleza."
 BRA.bcwfactions.44.t: "The Royal Guard Charter"
 BRA.bcwfactions.44.d: "With the federal government's firearm liberalization decree in effect, the Brazilian Monarchist Movement reinterprets the new law as permission to organize. Across São Paulo, Minas Gerais, and Rio de Janeiro, MMB-affiliated shooting clubs multiply under the guise of marksmanship societies and historical reenactment associations. Behind closed doors, these clubs adopt a common charter and a single name: the Royal Guard. Training regimens move from paper targets to small-unit tactics, and members begin appearing at ranges in coordinated uniforms bearing the imperial crest. The movement insists the Guard exists purely for sport and self-defense, but its rapid expansion and military discipline suggest otherwise.\n\nPublic rallies grow larger and more confident. Monarchist marches now feature columns of Royal Guard members in standardized dress, marching in formation behind the old imperial flag. Bystanders who once dismissed the movement as nostalgic eccentrics take notice, as do local authorities and rival political factions. The Guard remains legally distinct from the MMB's civilian leadership, but the distinction blurs at every public event. What began as a circle of intellectuals now fields an organized paramilitary wing, and observers begin to ask whether the monarchists intend to restore the throne through ballots or through something else entirely."
 BRA.bcwfactions.44.a: "The crown requires a sword."
 BRA.bcwfactions.45.t: "The Petrópolis Disaster"
 BRA.bcwfactions.45.d: "In February 2022, torrential rain overwhelmed the mountain city of Petrópolis. Landslides and flash floods cascade through neighborhoods, burying hundreds of homes under mud and debris. Official figures eventually count over two hundred dead, with thousands displaced and entire communities erased from the hillsides. The federal government, already collapsing under the weight of an unrelenting pandemic and spreading political violence, responds with delays and fragmented coordination. State and municipal authorities, stripped of resources and personnel, struggle to conduct search and rescue operations or distribute basic aid to survivors.\n\nThe void in Petrópolis becomes a wound that festers for weeks. Makeshift camps fill with the displaced, and reports of untreated injuries, missing persons, and abandoned bodies multiply. What little assistance arrives comes unevenly, channeled through overstretched civil defense units and overwhelmed charities. The disaster exposes not only the physical vulnerability of Brazil's mountain cities but the complete atrophy of the state's capacity to protect its citizens when multiple crises strike simultaneously. The hills of Petrópolis become a monument to republican failure."
 BRA.bcwfactions.45.a: "The flood washes away more than houses."
 BRA.bcwfactions.46.t: "The Monarchist Relief"
 BRA.bcwfactions.46.d: "While the state falters in Petrópolis, the Royal Guard mobilizes. Monarchist militias from across Rio de Janeiro state converge on the flooded city, bringing trucks loaded with food, blankets, medicine, and digging equipment. Working in coordinated teams, Guard members evacuate trapped residents from collapsed hillside homes, establish field kitchens in undamated church courtyards, and clear debris from blocked roads that government crews have not yet reached. The operation is swift, organized, and visibly apolitical; Guard members wear armbands bearing the imperial crest but offer no speeches or recruitment pitches, only shovels and supplies.\n\nThe effect on local perception is immediate and lasting. Residents who had never heard of the Brazilian Monarchist Movement began referring to the men in imperial armbands as \"the friends from Petrópolis.\" Neighborhood leaders who initially refused militia assistance became vocal supporters after watching Guard members carry elderly residents down muddy slopes while civil defense officials remained unreachable. When the last Guard trucks finally depart, they leave behind not only cleared roads and stocked shelters but something the movement has never possessed: genuine goodwill among ordinary Brazilians who remember who came when the state did not."
 BRA.bcwfactions.46.a: "Loyalty is earned in the mud."
 BRA.bcwfactions.47.t: "The Food for Doctrine Campaign"
 BRA.bcwfactions.47.d: "Leveraging the goodwill earned in the aftermath of the floods, the Brazilian Monarchist Movement launches a new initiative in Petrópolis. Admission to political speeches and presentations is set at one kilogram of non-perishable food per person. The events are organized primarily by the Anchieta Legion, an ultrareactionary faction within the MMB that blends Catholic social teaching with a sweeping rejection of progress, modernity, and republican institutions. Their speakers do not merely advocate for a monarchical restoration; they demand a return to an era of God-anointed kings, organic hierarchy, and the subordination of politics to spiritual authority.\n\nThe speeches draw small but attentive crowds, many of whom remember the Royal Guard's relief efforts weeks earlier. Attendees leave with their consciences satisfied by the food donation and their minds seeded with the Legion's uncompromising vision. In Petrópolis, where the state's absence remains fresh, the MMB has become something unprecedented: a minor political force that nonetheless functions as a kingmaker. The Anchieta Legion remains a fringe element within the broader monarchist coalition, but in this ruined mountain city, their voice carries weight that extends far beyond their numbers."
 BRA.bcwfactions.47.a: "The donation feeds both body and allegiance."
 BRA.bcwfactions.48.t: "The Defender of Petrópolis"
 BRA.bcwfactions.48.d: "With the state of emergency declared and federal authority fragmenting across Rio de Janeiro, the Royal Guard abandons its pretense of being a mere shooting club. As BOPE wages a three-way war against the Red Command, the Third Pure Command, and opportunistic militias, the Guard secures Petrópolis's perimeter and establishes checkpoints on all roads leading into the mountain city. Where criminal factions have overrun neighboring municipalities, the Guard holds. Where the state police have retreated to reinforce the capital, the Guard advances. Within forty-eight hours, Petrópolis becomes a monarchist stronghold, its streets patrolled by men wearing the imperial crest and its residents sleeping more soundly than any of their neighbors in the Baixada Fluminense.\n\nThe movement's leadership announces the obvious: the Royal Guard now functions as the legitimate security force of Petrópolis, and the city will serve as the base for the eventual restoration of the Brazilian monarchy. No vote is held. No permission is requested. The republic's writ no longer extends to these mountain slopes, and the people who remember the Guard's relief efforts after the floods offer no resistance. For now, the MMB controls a single city. But in a state consumed by fire, a single city may be enough."
 BRA.bcwfactions.48.a: "The crown finds its first stone."
 BRA.bcwfactions.49.t: "The Red Herald"
 BRA.bcwfactions.49.d: "Across a dozen cities, stenciled graffiti appears overnight on walls, underpasses, and abandoned storefronts: \"LONG LIVE THE COMMUNIST PARTY OF BRAZIL - P.C.B.\", in others: \"LONG LIVE THE AGRARIAN REVOLUTION, LONG LIVE THE REVOLUTION OF NEW DEMOCRACY\" in red block letters. No manifesto, no explanation, no elaboration. For most Brazilians, the graffiti means nothing, but for radical peasants, readers of The New Democracy, and especially for many disillusioned masses and communist sympathizers who have broken with all electoralism, the message resonates as the light of day: The vanguard party, long in reconstruction, has been rebuilt.\n\nThe Red Fraction's long, patient work of ideological consolidation has reached its first public milestone, and it wants to fill the vacuum among the millions who have already abandoned all hope on bourgeois elections. The fringe \"The New Democracy\" journal, formally independent, although frequently associated with the defense of Maoism, dedicated its front page to the announcement, reporting the development with barely concealed enthusiasm; its sympathy for the newly declared P.C.B. is evident in every line. For the scattered cells and rural organizers who have waited years for this moment, the graffiti is a signal of hope. For everyone else, it is just paint."
 BRA.bcwfactions.49.a: "Lenin is young again!"
 BRA.bcwfactions.50.t: "The Path Shines Again"
 BRA.bcwfactions.50.d: "In the countryside of Rondônia, the League of Poor Peasants organized a march in honor of Chairman Gonzalo, demanding nothing less than the continuation of the so-called \"Agrarian Revolution\". As the column passes through rural settlements, it grows with ever more peasants, sympathizers, and red flags, drawing attention far beyond Brazil's borders, so much so that the government of Peru, birthplace of the infamous Shining Path, the ones once led by Gonzalo, watching as the unrest grows along its frontier, issues an official demand for an explanation from Brasília. However, no answer is given. The federal government, consumed by instability, cannot even offer a response and protection.\n\nLocal landowners act instead. Paramilitary death squads, paid for by rural elites, intercept the march on the outskirts of a small town. Dozens of peasants are killed before the squads are driven back by the marchers' resistance. The military police arrived later to clear the area, dispersing the survivors. The League once again has lost lives, but every time it happens so, it gains something else: justice for its cause, experience in combativity, and popularity, and the more it acknowledges that retreat is no longer an option."
 BRA.bcwfactions.50.a: "We will come back stronger and better prepared."
 BRA.bcwfactions.51.t: "The Propaganda Bombs"
 BRA.bcwfactions.51.d: "In São Paulo, Rio de Janeiro, Belo Horizonte, and Porto Alegre, small explosions ring out from garbage bins, bus stops, and building lobbies. The initial reports trigger a wave of alarm, with news outlets rushing to cover what appears to be a coordinated terrorist attack. But instead, first responders find no casualties, but scattered debris and thousands of pamphlets bearing the hammer and sickle, some revolutionary catchphrases, and the signature of the Communist Party of Brazil - P.C.B. The messages call for the agrarian revolution, the defense of people's war, and \"the destruction of the landowner-bureaucratic old state\".\n\nPublic panic subsided as quickly as it rose, replaced by confusion. Once more, The New Democracy journal takes on its job to amplify awareness of the events, and the name of the Communist Party of Brazil - P.C.B is now on the lips of thousands, and through the few mainstream papers who report on it, maybe even millions, who have never heard of it. The pamphlets are rapidly collected and analysed by police, and read by the few curious who dared take them. For many, especially its ideological rivals, it was decried like an obvious terrorist attack, but it seems that the truth is much simpler than that: the media, the police, and especially its enemies have been tricked into giving what they really wanted: the bombs were never meant to kill, it was meant to generate widespread attention to the organization."
 BRA.bcwfactions.51.a: "The most explosive form of agitprop."
 BRA.bcwfactions.52.t: "Declaration of the People's War"
 BRA.bcwfactions.52.d: "With Lula disappeared, Alckmin assassinated, and Bolsonaro's state of emergency transforming Brazil into a patchwork of warlord fiefdoms, the Communist Party of Brazil announces the formal beginning of its Protracted People's War. In a statement circulated through clandestine networks and read aloud in peasant assemblies across Rondônia, the P.C.B. declares that the conditions for revolutionary conflict have fully matured, declaring the bankruptcy of the old landowner-bureacrautic state, and the beginning of the inevitable people's war that will wash its remains away.\n\nThe Party has proclaimed no group will be spared by the revolt of the masses. Those who accept New Democracy will be welcomed in open arms to build the new society from the ruins of the old one, while those who reject the people's awakening shall be vanquished by the tides of History. The announcement is met with apprehension from every other armed group in the country. The P.C.B. remains small, its weapons, activists and soldiers still a statistical irrelevance for all purposes, but just like the maoists of the past, the Party has been forged for decades for this moment, and patience, will of steel and especially ideological and personal abnegation from its core have become its sharpest weapons for them to grow and thrive in chaos: the war will not be won in months or even years, and it certainly does not want conventionally, they intend to outlast them all as the earth scorches into hell."
 BRA.bcwfactions.52.a: "They want no glorious triumph, just be the last man standing"
 BRA.bcwfactions.53.t: "Rebel Pardon"
 BRA.bcwfactions.53.d: "As pressure mounts within the PDT to expel the New Resistance, a surprising intervention halts the process. Aldo Rebelo, the veteran politician and former communist turned nationalist, issues a quiet but unmistakable warning to party leadership: if the NR is purged, he will publicly denounce the party as hostile to Brazilian nationalism and aligned with foreign liberal or cosmopolitan interests. Rebelo's stature; built across decades of service, makes him untouchable. The party's executive committee, fearing a public rupture with a figure who commands respect across the nationalist left, quietly shelves the expulsion proceedings.\n\nThe decision is not framed as a victory for the New Resistance. Official statements cite \"internal unity\" and \"ideological pluralism\" as core PDT values. But the message is clear: Raphael Machado and his circle now enjoy an informal immunity. Party socialists fume in private, while Rebelo makes no further comment. The NR continues its patient work of recruitment and ideological formation, now operating with the tacit acceptance of the party's most influential nationalist elder."
 BRA.bcwfactions.53.a: "The old lion shields the harpy."
 BRA.bcwfactions.54.t: "The Mutual Aid Turns Toward Order"
 BRA.bcwfactions.54.d: "The New Resistance expands beyond theoretical study circles into direct community action. In working-class neighborhoods of Fortaleza and the periphery of São Paulo, NR-affiliated volunteers begin organizing weekly distributions of food, clothing, and basic medicine. Unlike the more haphazard efforts of church groups or local charities, the NR's operations are visibly disciplined: coded supply chains, standardized logistics, and a strict hierarchy of local coordinators reporting directly to Raphael Machado's inner circle. The materials bear no overt political symbols, but recipients learn quickly which movement provides the assistance.\n\nThe effect on local recruitment is immediate. Young men, in particular, are drawn to the combination of material aid and ideological certainty. Where the PDT's traditional socialists debate parliamentary strategy, the NR offers action and a coherent worldview rooted in the rejection of Western liberalism. Party leaders in Brasília take note of the growing rallies, attendance climbing from dozens to hundreds, but remain reluctant to act. For now, the movement builds power not through slogans, but through presence."
 BRA.bcwfactions.54.a: "The hand that feeds also commands."
 BRA.bcwfactions.55.t: "The Decree arms the Theory"
 BRA.bcwfactions.55.d: "With President Bolsonaro's firearm liberalization decree in effect, the New Resistance moves swiftly to arm its most dedicated cadres. Weapons are acquired through legal channels; licensed dealers, background checks, and waiting periods observed to the letter. The NR's public messaging frames the arming as a defensive measure: guardians of Brazilian sovereignty against foreign despots, globalist elites, and the cultural decay imposed by the West. Raphael Machado appears flanked by armed followers in matching dark shirts, and declares that the Fourth Political Theory now has \"material teeth\".\n\nThe response from Washington is swift and public. A State Department spokesperson identifies the NR as a \"hostile pro-Russian asset\" operating within Brazil's democratic institutions, citing Machado's open admiration for Aleksandr Dugin and the movement's financial links to Moscow-linked foundations. The designation elevates the NR from a fringe intellectual current to an international controversy. Brazilian nationalist circles, already suspicious of American influence, rally around the movement. The PDT finds itself trapped: expelling the NR would please Washington but enrage its own base; tolerating the NR invites further American condemnation. Machado, for his part, offers no denial, only a statement that Brazil's enemies have revealed themselves."
 BRA.bcwfactions.55.a: "The eagle's cry only strengthens the harpy."
 BRA.bcwfactions.56.t: "Declaration of Total Opposition"
 BRA.bcwfactions.56.d: "In the hours following the assassination of Geraldo Alckmin and the disappearance of Luiz Inácio Lula da Silva and Alexandre de Moraes, Raphael Machado releases a recorded address from an undisclosed location. He declares the New Resistance's total opposition to President Bolsonaro's emerging state of emergency. Bolsonaro, Machado argues, is not a nationalist but a puppet of the West: a tool of globalist interests, degenerate European cultural influences, and American economic domination. The decree, the arrests, the suspension of order, all of it, he claims, serves foreign masters, not Brazil.\n\nMachado concludes with a direct call to arms. The New Resistance will fight \"tooth and nail\" against the usurpation, not in defense of the old republic but for something larger. He does not specify what. He does not name allies. He speaks instead of a threshold being crossed, of a movement now liberated from the constraints of legality and parliamentary illusion. Across the Northeast and the periphery of São Paulo, NR cadres begin disappearing from their homes, taking their weapons and supplies into pre-designated safe houses. The philosopher has become a warlord." 
 BRA.bcwfactions.56.a: "The theory is now a trench."
 BRA.bcwfactions.57.t: "The Legalist Gambit"
 BRA.bcwfactions.57.d: "As Brazil fractures along multiple axes, the New Resistance announces its formal alignment with the Legalist Army. Raphael Machado, in a joint communique released through a Russian-backed media outlet, frames the decision as a tactical necessity rather than ideological kinship. The Legalist Army, he argues, represents the only viable vehicle for the destruction of the Bolsonaro regime, and Russia's open backing of the Legalist cause provides the external counterweight Brazil requires against American interference. The NR's armed cells are placed under Legalist command for coordinated operations, though Machado insists his movement retains full autonomy over its political direction.\n\nThe announcement reshapes the civil war's emerging contours. Ciro Gomes, long courted by Machado's circle, stops just short of endorsing the NR but praises the \"patriotic unity\" of the Legalist coalition. Nationalist figures who once dismissed the Fourth Political Theory as fringe now quietly acknowledge the NR's usefulness. Within the Legalist command, reactions are mixed: communist militias view the Duginists with deep suspicion, while nationalist officers welcome any additional firepower. For now, the alliance holds. The wolf marches alongside the soldier, the communist, and the liberal, each watching the others over their shoulders while the smoke rises from Salvador to Brasília."
 BRA.bcwfactions.57.a: "The enemy of my enemy is not my friend, but my weapon."
 BRA.bcwfactions.58.t: "The Neighbourhood Watch Decree"
 BRA.bcwfactions.58.d: "With the federal government's firearm liberalization now in effect, the Brazil Just Alliance formally authorizes the creation of local citizen militias across all states, with a pronounced concentration in the South and Moro's home state of Paraná. Framed as \"Neighborhood Legal Defense Committees,\" these armed groups receive standardized training materials, chain-of-command protocols, and direct ideological guidance from ABJ regional coordinators. Membership is restricted to individuals with clean criminal records and demonstrated commitment to the movement's civic values, though operational autonomy varies widely from municipality to municipality.\n\nIn practice, the ABJ's militias function as the movement's executive arm, enforcing Moro's evolving definition of \"law and order\" in territories where state authority has thinned. While publicly described as defensive measures against rising crime and political violence, their real purpose is organizational: securing ABJ-controlled spaces, deterring opposition gatherings, and projecting an image of disciplined readiness. The line between community protection and paramilitary consolidation remains deliberately vague, calibrated by Moro's headquarters in Curitiba based on local conditions."
 BRA.bcwfactions.58.a: "Order demands teeth."
 BRA.bcwfactions.59.t: "Operation Hand of Justice"
 BRA.bcwfactions.59.d: "With federal authority disintegrating and separatist flags rising across the South, Sérgio Moro issues a unilateral decree from his field headquarters in northwestern Paraná, declaring the Brazil Just Alliance the sole legitimate guarantor of order in the region. His militias, now operating as a unified paramilitary force under a single command structure, move against both state governments that have refused to resist the separatists and the separatist movements themselves. The objective is total: the reestablishment of Brazilian law by any means necessary, with Moro positioning himself as the last defender of the republic's legal skeleton.\n\nThe initial offensive manages to narrowly seize Curitiba, where coordinated resistance from separatist-aligned local forces and demoralized state police units drove the ABJ's columns back. Moro consolidates his other forces in the municipalities in the Northwest of Paraná, transforming almost the entirety of Paraná into his own fortified redoubt. Publicly, he vows to \"cleanse the South of treason.\" Privately, his commanders acknowledge that the movement has lost the urban centers and now governs a shrinking crescent of loyalist towns, surrounded on three sides by enemies who share nothing except their opposition to Moro's vision of ordered Brazil."
 BRA.bcwfactions.59.a: "The law retreats, but does not surrender."
 BRA.bcwfactions.60.t: "The Paternalistic Shadow"
 BRA.bcwfactions.60.d: "From the peripheries of São Paulo, the First Command of the Capital tightens its grip where the state has long since loosened its own. Through a calibrated mix of summary violence and community welfare, clandestine clinics, regulated utility payments, arbitrated disputes, the faction transforms fear into fealty. Neighborhoods once neglected now receive order of a kind, delivered by men who ask for loyalty instead of taxes. The Party becomes a paternal figure: harsh, unforgiving, but reliably present where mayors and governors have never set foot.\n\nCondemnation arrives from every political quarter. Leftists call the PCC a criminal parasite; conservatives label it a socialist cartel; centrists demand federal intervention. Yet the denunciations ring hollow in the alleys where the Party's flag hangs beside no other. The state denounces. The Party delivers, and São Paulo's forgotten poor learn quickly which matters more."
 BRA.bcwfactions.60.a: "The father is feared, but he is here."
 BRA.bcwfactions.61.t: "The Porto Velho Massacre"
 BRA.bcwfactions.61.d: "At the Federal Penitentiary of Porto Velho, the First Command of the Capital executes its most audacious operation to date. Coordinated from outside by encrypted networks and from inside by synchronized cellphone signals, the breakout attempt spirals into a bloodbath when federal guards respond with overwhelming force. Corridors become kill zones. By dawn, forty-seven inmates lie dead, twelve guards are wounded, and the prison's eastern wing is a smoldering ruin. Yet amid the carnage, Marcola is gone, extracted through a tunnel that exits fifty meters beyond the perimeter wall, his escape vehicle already burning on a dirt road toward Bolivia.\n\nDisturbing footage leaks within hours: bodies stacked like firewood, a wounded inmate begging for water, the unmistakable sound of automatic fire from both sides. The PCC immediately releases its own statement, mourning the dead as martyrs and vowing to \"settle the account\" for each fallen comrade. For the first time, public sympathy flickers toward the faction. The state is seen as the butcher; the PCC, for a dark moment, as the butchered."
 BRA.bcwfactions.61.a: "The ledger demands blood."
 BRA.bcwfactions.62.t: "The Party Governs"
 BRA.bcwfactions.62.d: "With federal authority in São Paulo reduced to scattered garrisons and rival factions either co-opted or crushed, the First Command of the Capital moves from shadow to open rule. Marcos Willians Herbas Camacho, freed from Porto Velho and emboldened by the wider collapse, establishes the Party's headquarters in a repurposed municipal building on the city's eastern periphery. The flag of 1533 flies above neighborhood councils, dispute tribunals, and distribution warehouses. What was once a criminal network now functions as a de facto government, taxing commerce, enforcing curfews, and managing the flow of food, medicine, and fuel across a metropolis of twelve million.\n\nMarcola's public addresses strike a familiar tone: peace, justice, liberty, equality, union. He speaks of the poor as his constituency, of the state as an absentee landlord finally evicted, and of the PCC as a necessary instrument of order in a world that forgot its weakest. Few outside the Party's base believe the rhetoric. Human rights monitors document summary executions, forced recruitment, and the same extortion that marked the old order. But in the neighborhoods where the state never came, and where the PCC now never leaves, the question is no longer whether the Party governs, it is whether anyone will dare to stop them."
 BRA.bcwfactions.62.a: "The king of the periphery."
 BRA.bcwfactions.63.t: "The Plastic Patriot"
 BRA.bcwfactions.63.d: "With the firearm liberalization decree in effect, Paulo Kogos urges his followers to acquire weapons and organize into local defense cells. The results are meager. Most members cite the high cost of firearms, the paperwork involved, or simple disinterest. A handful comply, but their social media posts, posing with rented pistols, misfiring at poorly supervised ranges, or brandishing airsoft replicas as genuine, quickly become objects of mockery across competing political movements. Kogos himself posts a grainy photo of a revolver on a stack of Austrian economics texts; sharp-eyed viewers note the trigger lock is still attached.\n\nThe League's armed wing remains a punchline rather than a threat. For every genuine recruit, a dozen memes circulate showing supporters mishandling weapons or retreating from paintball skirmishes. Kogos doubles down on rhetoric, but his audience, comfortable behind keyboards, shows little appetite for actual confrontation."
 BRA.bcwfactions.63.a: "The revolution will not be livestreamed."
 BRA.bcwfactions.64.t: "The Inconfident Arrives"
 BRA.bcwfactions.64.d: "A figure known only as \"Tiradentes\" has emerged within the Libertarian League's disorganized ranks, bringing a discipline the movement has never possessed. His background is unknown; former military, private security, or simply a well-trained autodidact, but his effect is immediate. Within weeks, he consolidates the League's scattered armed cells into a single formation, the Free Inconfident Army, and purges the most incompetent and performative members. Where Kogos inspired mockery, Tiradentes commands silence. His public appearances are rare, his instructions brief, and his patience for online posturing nonexistent.\n\nThe League's internal culture shifts overnight. For the first time, local chapters report coordinated training schedules, operational security protocols, and the quiet stockpiling of supplies in undisclosed locations. Kogos remains the public face, but those paying attention notice he now defers to his new commander on matters of action. The joke, it seems, may have found its punchline."
 BRA.bcwfactions.64.a: "The fool talks, while the soldier listens."
 BRA.bcwfactions.65.t: "The Price of Order"
 BRA.bcwfactions.65.d: "With federal authority collapsing across São Paulo, the Free Inconfident Army moves decisively into the city's northern districts. Unlike the chaotic militias and opportunistic gangs that have seized control elsewhere, Tiradentes's forces operate with visible discipline: uniform armbands, coordinated patrol routes, and a clear if brutal code of conduct. Local business owners, desperate for protection against looting and extortion by criminal factions, begin contracting the Army directly. In exchange for payment, delivered in cash, supplies, or fuel, the LL's paramilitary wing establishes checkpoints, clears streets of rival armed groups, and enforces a fragile order.\n\nThe transformation shocks observers who had dismissed the League as a digital sideshow. Where Paulo Kogos once drew mockery for misfired pistols, his soldiers now command intersections with professional efficiency. Tiradentes has built something the movement never possessed: credibility through competence. In neighborhoods where police have vanished and socialist-aligned militias have yet to penetrate, the LL has become the only game in town."
 BRA.bcwfactions.65.a: "The market chooses its protectors."
 BRA.bcwfactions.66.t: "Day of the Spilling"
 BRA.bcwfactions.66.d: "In 1789, in a place not so far from São Paulo, a group of young intellectuals, in the pursuit of liberty and freedom for their land and people, laid out their plans to initiate a revolution akin to the one that began in the thirteen colonies a few years prior. Their plan was bold, ambitious and righteous, the tyrannical Portuguese had explored the lands of Minas Gerais for too long, and the \"inconfidentes\" were a few steps away from setting that plan in motion, a plan which would start on the day of the \"Derrama\", when the colonial administrators would visit the city to collect taxes.\n\nHowever that day would never come. On the way to set these plans in motion, a wretched traitor would warn the colonial administration, and the men were arrested, deported and even killed for their \"treason\" against the government. Ever since then, the brazilian people have always been under the boot of big government, despite this, the dreams of freedom and liberty lived on in Brazil, and now, years after the events of the \"Inconfidência Mineira\", the perfect storm has formed to bring on the dream of true liberty and freedom to Brazil.\n\nThe federal government and its remnants have, as expected, proven completely incapable of securing São Paulo, and the revolution in search of true freedom for Brazil can finally start. At long last, The Day of the Spilling has arrived, and no traitor will be able to rat us out. A fortress of freedom has been formed in the streets of the São Paulo metropolitan area, idealized in online spaces and now a stronghold for libertarians across Brazil."
 BRA.bcwfactions.66.a: "Deus Vult!"
 BRA.bcwfactions.67.t: "The Martyr of Petrópolis"
 BRA.bcwfactions.67.d: "Dom Luiz Gastão of Orléans-Braganza, the long-reigning pretender to Brazil's defunct throne, succumbs to his worsening health after a protracted battle complicated by the collapse of the public health system. His death transformed the monarchist movement overnight. Thousands gather in Petrópolis for the funeral, held in the cathedral overlooking the city the Royal Guard had saved months earlier. For the first time, outsiders attend in large numbers: flood survivors who remember the Guard's aid, disillusioned military officers, and ordinary Brazilians mourning not the man but what he represented. The imperial flag drapes the coffin as mourners weep openly, their grief mingling with anger at a republic that let the pandemic rage unchecked.\n\nHis successor and brother, Dom Bertrand, delivers the eulogy before a hushed crowd. Nearly as old as his brother, the new pretender has had an active presence in the monarchist movement not only to represent his brother, who long was unable to be so present, but also to strengthen and feed the monarchist cause as a whole. He speaks not of restoration but of accountability, blaming republican negligence for his brother's death and for the wider catastrophe that has consumed Brazil. When he finishes, the mourners do not applaud; they stand in silence, then file past the casket. Some among the monarchist old guard watch Dom Bertrand with guarded eyes, noting his ambition and wondering whether the crown will fit a head so young. The movement has gained a martyr and a new standard-bearer and, safe to say, manager of the new heir, with his newly found legitimacy as the head of all monarchists and everpresent activism and manifestation. The future of this under Dom Bertrand, like most things, is impossible to predict, but most likely, stronger than before."
 BRA.bcwfactions.67.a: "One of the strongest wills there are is to avenge a brother."
 BRA.bcwfactions.68.t: "Good Deals"
 BRA.bcwfactions.68.d: "As every company aims to do, Aquila grew, and the rapidly expanding arms market only added further growth to their operations. Alongside financial growth, the company became ever respected and more importantly, well connected, within the sector. Aquila became a master of the distribution sector, striking better deals between firearm manufacturers and stores. If a weapons shop needed to be stocked up, it went to Aquila for that, but considering the nature of such a shop, it was bound to need security.\n\nThe state of crime in Brazil did not improve following the looser gun regulations, and shops needed to protect their valuable products, and once again sensing opportunity, Aquila was there. Taking a page from their PMC operations, the company began to offer private security services to the stores and shops they supplied.\n\nThis was not new in Brazil, several companies have offered similar services even before the relaxed gun legislations, only now these companies had to deal with an eagle, an eagle which clawed ever more of the market, and knew how to hunt very well. Stores that previously did not contract Aquila's distributing services started to call the company for stocking their shops and providing security."
 BRA.bcwfactions.68.a: "Just doing a job they do well."
 BRA.bcwfactions.69.t: "Back Home?"
 BRA.bcwfactions.69.d: "The company \"Áquila Internacional\" had become over the span of months one of the fastest growing corporations in Brazil, and their private security service had become no longer contracted by merely stores and shops; large companies, that recognized the need of more security, started to make deals with Aquila, deals which were highly profitable for the company. However, the loosely organized nature of the entire operation proved to be not ideal for their growth.\n\nEventually, in search of further expansion, the directors of the company determined the need to centralize and professionalize their operations. The region of eastern Minas Gerais became the center-piece for Aquila's operations, an office building and a few apartments were acquired to act as the headquarters for the company, and a few acres of land were bought so new professionals could be trained.\n\nAlthough their roots as a private military company was never abandoned, the company prioritized sending new recruits onto their private security operations, fearing that the ever increasing number of foreign war theatres could place a dent on their operations in Brazil and drain needed manpower. Nevertheless The Eagle had started to build their nest, and the winds favoured it."
 BRA.bcwfactions.69.a: "A bonus in the search to profit!"
 BRA.bcwfactions.70.t: "A New Nest"
 BRA.bcwfactions.70.d: "The Eagle's nest had grown. What was previously a few acres of land, some apartments and an office building had evolved into a fully fledged headquarters, with a 5 story building teeming with life dedicated to the company's board of directors. Aquila had expanded a lot, and became the largest private security firm in the country, with some people going as far as calling it a monopoly.\n\nBut you don't get to the point of being called a monopoly for nothing, anyone observing the decay of Brazil could have predicted this. The company had a larger presence than the police in some regions, that is if the police was present at all. Brazil had become unsafe, and the company sought to provide security in these trying times. But the expansion of nation-wide operations had created a divide between Aquila members, most of those being newcomers.\n\nForeign intervention had become a hot topic between veterans and new recruits. The endeavours across unstable regions gradually became a thing of the past for Aquila, and the focus had clearly shifted towards operations based in Brazil, a nation which crumbled and became more unstable by the day. Nevertheless, The Eagle was soaring, whether that be in familiar or foreign forests."
 BRA.bcwfactions.70.a: "Aquila has changed."
 BRA.bcwfactions.71.t: "Emergency Matters"
 BRA.bcwfactions.71.d: "For the past few weeks, Aquila had been contacted by an ever increasing number of common people, small enterprises and big companies that needed their private security services, it was only to be expected, as Brazil was failing. The Southern Giant could no longer sustain itself, and multiple parasites flocked around its dying body seeking a part of the pie.\n\nHowever, the past few days lacked the usual large corporate calls that the company had become accustomed to. Until a phone rang in the meeting room of the Board of Directors. For the next few hours, the largest contract Aquila had ever negotiated was discussed, a conglomerate of companies, sensing the inevitable collapse of the country, requested that Aquila not only provide them security, but would form an army in order to defend their interests and the people.\n\nThe deal was a huge gamble, and the company had no idea what would happen to them should they fail. However, the payout was simply too much to be ignored, and soon enough, Aquila mercenaries stationed across the world were called up to the region of eastern Minas Gerais, and the company would take their largest gamble yet. A new mercenary state had been formed in the corpse of Brazil, and the ambitions of The Eagle now seemed endless."
 BRA.bcwfactions.71.a: "Big Games, Big Prizes"
 BRA.bcwfactions.72.t: "The Southeastern Normalisation Operation"
 BRA.bcwfactions.72.d: "In a video posted by the International Aquila to Telegram and Whatsapp groups and municipal and state authorities of Minas Gerais, Roberto Escoto publically denounces both the federal government in Brasília and the Legalist Army for incompetency in defending the citizens' lives from crime and the danger that the whole country succumbs to.\n\nIn response to the stagnating situation, Roberto has stated that all Aquila troops are being redeployed to near their headquarters in Eastern Minas and to make up frontlines to defend themselves and other citizens from traitorous factions.\n\nBy now, most of Eastern Minas has been under de facto Aquila control, with seemingly no ressitance to the new State being formed. Many mayors have yet to make statements on whether they accept or not the Aquila administration they are now currently under. It is most likely that a majority of them will accept the new rule in fear of what could happen in declining.\n\nDespite the skeptic goals of Aquila, what they claim and what they want, Eastern Minas is apparent to be one of the most secure regions in this whole chaos, it is only a matter of time for Aquila to show their strengh to those \"traitors\" who surround them."
 BRA.bcwfactions.72.a: "The Eagle will eat the snake and smoke its cigar."
 BRA.bcwfactions.73.t: "The Right of the People"
 BRA.bcwfactions.73.d: "It is only right, and needed, that the people acquire the means to seize the power themselves to get rid of the State in their lives, to destroy it or to defend against it.\nAmong organisations who most bought guns from the black market, CAB ranks as one of the biggest, buying many without registering, having a combined amount bigger than entire criminal factions in some states of the country.\nThis can be noticed in their manifestations in the often urban streets of cities like Belo Horizonte, São Paulo and Curitiba, they do not fear showing their guns they bought illegally to the public (there is no way to tell apart anyways) and They do not fear showing their guns and do not fear utilizing them for intimidation, since using them on the public would have legal consequences and could lead to a government crackdown on the organization.\n\nBut for now it is clear: their message is to show the State they are ready if the time comes, so if it wishes to not fall, may they not fumble at it, they have no fear."
 BRA.bcwfactions.73.a: "A fight against all kinds of oppression."
 BRA.bcwfactions.74.t: "Negligence and Failure"
 BRA.bcwfactions.74.d: "\"Our current status cannot stay like this! We could be as bad if not worse as the genocidals that rule over us by doing nothing! We must do something!\"\n\nBy today, all news related to the CAB have been disfavorably to them. They are able to understand the bourgeoisie controls the means of communication, they do not like that but they have to work with what they have, but the truth is, these news mention how many criminals are linked to the organisation in robbery of places they deem deserving of such crime and the few actions that directly help people, like assisting the poor, do not make them be seen as heroes or liberators of the people. CAB has to flip its image if they want to eventually have popular support.\n\nAfter discussions between big names within CAB have decided that a good course of action for the entire group should be to replicate the CHAZ experiment in the United States that happened some time ago. Knowing the failures and the things to prevent from occurring thanks to the event, they expected that the Brazilian CHAZ could actually result positively.\n\nCAB choose a small periphery of Belo Horizonte as their lab for the anarchist revolution. They prepared trips countrywide to the place and the amount of people arriving to that specific place of BH was seeming suspecious. The periphery was left to crime and volunteer action by federal, state and municipal authorities to sustain itself, a true example of how the State was not supposed to be made. As the CAB reached their destination, they sold to residents not yet the ideals of anarchism, but of their humble nature of a hopeful mission. They formed militias, distributed basic aid kits and even volunteered to reform some of the infraestruture with paint and materials they could afford. The minimal police presence was resolved by the existence of their militias guaranteeing self-security present and other areas in dire need of security, that periphery could be now described as real second CHAZ."
 BRA.bcwfactions.74.a: "They have nothing to lose."
 BRA.bcwfactions.75.t: "The Same Struggle"
 BRA.bcwfactions.75.d: "As Anarchism is resurging throughout the country in protests and organisation of people, increased crime rate is noticed, many linked back to another anarchist faction known as MIA, or Insurrectionary Anarchist Movement.\n\nThe MIA gained notorious international coverage when they made incendiary attacks to four bank agencies in the city of São Paulo in 2015. They were known for doing similar attacks earlier and would proceed to continue do to so until they fell into inactivity...\nor was it obscurity?\nAs previously mentioned, higher crime rate comes from the actors claim loyalty and orders from the Movement in attacks into banks and luxury product shops. They suddenly are back at the spotlight but how?\nIt has come to our attention that MIA acts very interestingly with CAB, the same criminals who did all those attacks recently claim not just the MIA as their leading organisation, but CAB as well. Apparently, some members that are less insurrectionary in the traditional sense, who plan the events than doing them, have become effectively part of the Coordination, but not given up MIA roots, by proposing to and convincing their fellows in the openly anarchist group to put their ideals into action. While in anonymous messages in forums the Movement claims to be entirely different, their manpower and popular look is dependent on how CAB grows. The collective \"leadership\" of CAB has not manifested either to even be acknowledged the increasing presence of MIA in their group. Some say it's intentional so to stay being able to act publically, as Brazil is a democracy, others think they are merely gullible to totally of what happens within CAB."
 BRA.bcwfactions.75.a: "A Parasite or An Upgrade?"
 BRA.bcwfactions.76.t: "Greater Ambitions"
 BRA.bcwfactions.76.d: "It's been a long time since the start of the first modern anarchist experiment in the country. Unlike the model they based themselves on, information coming from it shows that it is still up! It was not a failure after all!\n\nSome old resisdents have described the living conditions have improved much and that it seems crime has fallen a lot. While CAB may bring more disagreeing points to the periphery, mostly social questions, the old residents have said they are willing to accept it since these same people have brought prosperity to a region even God abandoned. Hell, even the interviewee have said he personally converted to anarchism and atheism.\n\nThe success of CAB's experiment cannot be attributed to anarchism as it allowed the truth of human nature to show and free itself. Not only anarchists were present to assist the self-sufficiency of the free territory. The positive result attracted many libertarian socialists favorable to anarchist theory to contribute to the people and to realise the true future of humanity.\n\nIt seems the cause in the country and in CAB is only strengthening as the days march and the State shows its true motive. Having low expectations is now a thing of the past.§RIf the Brazilian CHAZ can work, so can any place at any amount of area.§!\n\nRecently, masked memorable members of CAB have sent a video anonymously from the BH periphery in rise that CAB's ambitions have only grew. Their next target is the whole city and once the opportunity arrives they will not hesitate. They know the State won't be able to stop them next time they set foot to go together to any other place in the country."
 BRA.bcwfactions.76.a: "Their State failed, now it's the time for the people to prove their worth."
 BRA.bcwfactions.77.t: "THE LIBERATION WAR BEGINS"
 BRA.bcwfactions.77.d: "The odd success of the BH periphery was never an experiment, it was the truth. The truth that the State had been an illusion created by the bourgeoisie, the traitorous academia, bureaucrats, fascists, marxists, liberals, and all other traitors around us there are in this world, to dominate the people and keep wealth to few and promote the genocide of the rebellious. The state of nature of humankind was stripped by humanity themselves with their jealousy and materialistic passions.\n\nToday, the CAB has reverted this event of history, even if partially, by, after a big organised event in their own version of of the experiments in the United States, deciding that the time is now or never as Brazil and its State dies before their eyes and that not just their territory must be maintained but that they must take action to seize the entirety of Belo Horizonte as the event ends. AAnd so, after their organization amassed over fifty thousand people, people of all genders and ages armed with all types of guns, drove in a convoy of motorized brigades through the whole metropolitan region of Belo Horizonte. They met resistance, both from the police and ideological opposition, but dealt with them rapidly. Reaching out to the marginalized communities with basic aid kits in exchange for surveillance, they amassed their support and continued their march, invading banks, prisons, police stations, and medium-sized businesses to secure food, armaments, and to liberate their comrades.\n\nIn less than three weeks, the city turned into chaos, an orgy of violence and destruction to the brainwashed and a beautiful sight of liberation to the Anarchists, as soon, all of the peoples of Brazil would be free."
 BRA.bcwfactions.77.a: "Mother Anarchy loves their children."
 BRA.bcwfactions.78.t: "The Two Prodigy Sons of Trotsky"
 BRA.bcwfactions.78.d: "For most Brazilians, the revolutionary Trotskyist left has long existed on the political margins. Overshadowed by the electoral success of PT and the legacy of bigger communist parties, the Workers' Cause Party (PCO) and the Unified Socialist Workers' Party (PSTU) have fought since the 90s denouncing both reformism and the bureaucratic degeneration of communist regimes. Small in number but unwavering in conviction, they believe that socialism can never be achieved through pragmatic compromise alone, but only through the conscious organization and self-emancipation of the working class. Having left more revolutionary wings inside PT, these movements defend a radical revolution to overthrow the capitalist system. However, even though they agree on most things, minor divergences have stopped PCO and PSTU from working together for a long time.\n\nAs political tensions escalate across Brazil, both parties have become increasingly visible in protests, labor strikes, and student mobilizations. Their banners, once confined to the edges of protests, now stand alongside larger left-wing organizations. And their militants are seen publicly distributing newspapers, organizing unions, and calling for workers to prepare for confrontations becoming increasingly inevitable.\n\nMore controversial, however, is what happened this morning. After a call to protest in Avenida Paulista yesterday, videos have begun circulating on social media showing some members of both the PCO and the PSTU at this demonstration carrying firearms. The police were called, but the protesters dispersed before any direct confrontation.\n\nThe Trotskyist leaders claim that the growing violence of the political climate demands organized self-defense against reactionary militias and political intimidation. They also announce closer cooperation and reconciliation. For them, the incident didn't prove accusations of extremism at all, as the revolutionaries declare that history has repeatedly shown what happens when workers face armed enemies while remaining defenseless themselves."
 BRA.bcwfactions.78.a: "Workers of the World, Unite!"
 BRA.bcwfactions.79.t: "Permanent Convergence"
 BRA.bcwfactions.79.d: "History has not been kind to the Brazilian Trotskyist movement. For decades, it remained fragmented into small parties, competing organizations, and ideological tendencies that agreed on almost everything except each other. While reformist socialists gained strong support in multiple elections and orthodox communists built disciplined vanguard parties, the revolutionary internationalists remained divided by old disputes, personalities, and competing interpretations of Marx, Lenin, and Trotsky.\n\nHowever, recent events have shown that this reality is bound to change. As the country's political crisis deepens and faith in the established order steadily erodes, the cooperation between PCO and PSTU has rapidly evolved into a complete union. Earlier today, the leaderships of the two parties have set aside decades of rivalry, and announced the formation of a common federation: MIOB, or \"Movimento Internacional Operário no Brasil\" (International Workers' Movement in Brazil), claiming that the revolutionary left can no longer afford to remain divided while Brazil enters an uncertain future.\n\nThe announcement has been welcomed by several Trotskyist members inside PSOL, frustrated with the party's growing electoral pragmatism and reformist orientation. Refusing to remain as internal opposition, a big part of these militants have chosen to leave and join the new federation, hoping to strengthen what could become the nucleus of a genuinely revolutionary workers' movement.\n\nMIOB presents itself as an internationalist socialist organization, defending democratic self-emancipation, workers' councils, independent trade unions, and international solidarity, keeping permanent revolution as its guiding principle. For now, the federation is little more than a loose coalition of activists, trade unionists, students, and intellectuals. Its electoral prospects are modest, and few outside the radical left expect it to become a significant political force. Regardless, they have begun to attract some workers in São Paulo."
 BRA.bcwfactions.79.a: "The Brazilian October will come!"
 BRA.bcwfactions.80.t: "The Third Option"
 BRA.bcwfactions.80.d: "The definition of insanity is doing the same thing over and over again and expecting different results.\n\nOnce again, the bourgeoisie has been presumptuous. They kept exploiting the proletariat and underestimated its power to strike back. These are the exact same conditions that brew the Bolshevik revolution of October in the Russian Empire. And they shall do it again, this time in the Southern Giant.\n\nIn the entrails of the Southeast, a new movement is being forged among the fertile ground of the urban working class. A group of foreign Trotskyist intellectuals has been helping MIOB to spread their ideology to hopeless workers and disillusioned supporters of the classical Brazilian left in Greater São Paulo. They speak about working-class self-emancipation, council democracy, socialist internationalism and voluntary collectivization, denouncing the authoritarianism of major communist movements. Socialism cannot be handed down by generals, party bureaucrats, or self-proclaimed vanguards. It must be built directly by the workers themselves, through working councils, freely associated unions, and the conscious participation of the masses. Every factory occupied, every neighborhood committee organized, and every strike called is the embryo of a new society.\n\nThousands of workers, students, and intellectuals in the region have begun abandoning the traditional parties of the Brazilian left. Former supporters of PT, PSOL, and even PCdoB, frustrated by decades of electoral defeats, ideological compromises, or bureaucratic stagnation, are flocking to what they see as a new genuinely revolutionary alternative. The once fragmented party has rapidly transformed into one of the fastest-growing political forces in the country's urban centers.\n\nThis places MIOB as an alternative option to the other revolutionary movements vying for the future of Brazil. While the PCB-FV calls for a peasant-led Maoist revolution rooted in the countryside and the APR seeks to fuse socialism with nationalism in the Northeast, the MIOB looks toward the factories, apartment blocks, universities, and trade unions of the Southeast. After all, the industrial proletariat, not the peasantry nor patriotic revolutionaries, is the decisive force capable of overthrowing capitalism."
 BRA.bcwfactions.80.a: "They just need to light a fuse."
 BRA.bcwfactions.81.t: "First Brazilian Congress of Workers and Peasants"
 BRA.bcwfactions.81.d: "Brazil is coming apart at the seams. Economic collapse, institutional chaos, escalating political violence, and the complete erosion of public confidence have left millions wondering whether the Republic can survive at all. Sensing that the collapse of Capitalism is accelerating, MIOB has hastily convened the First Brazilian Congress of Workers and Peasants today, uniting delegates from various socialist movements across the country, even non-Trotskyists, to discuss the future of the nation.\n\nThe gathering feels like a scene straight out of 1917. Red banners adorn the hall, revolutionary songs echo through the corridors, and portraits of Marx, Engels, Lenin, and Trotsky stand beside handmade flags carried by workers from Brazil's industrial heartland. Many delegates have even arrived armed, ready to face possible reactionary intervention to the congress. The time for political conferences is over. This is a revolutionary assembly, and it is ready for the final battle.\n\nDuring the proceedings, speaker after speaker denounces the existing current Brazilian state as irredeemably compromised by the interests and dictatorship of the Capital. They condemn reformism as an illusion, parliamentary compromise as surrender, and bureaucratic communism as the ultimate betrayal of the working class. You can feel the idealism running through their veins. After extensive debate, the congress ultimately adopts a common resolution declaring that Brazil has entered a period of instigated class conflict, in which the contradictions of capitalism have become too severe to be resolved through elections or constitutional reform alone. At the end, the delegates openly proclaim that only the organized revolution of workers and peasants can sweep away the old order and establish a socialist democracy founded upon free workers' councils.\n\nThe declaration infuriated the bourgeois Brazil's political establishment. Newspapers accuse the congress of openly advocating civil war and conservative politicians demand immediate action against these \"evil spreaders of chaos\". The delegates remain defiant. History has already begun its march. All that remains is for the first spark to ignite the fire.\n\"The battle is going again, the heart is uneasy in the chest! Lenin is young once again,"
 BRA.bcwfactions.81.a: "...and young October is ahead!\""

 BRA.reunification.1.t: "Christians Emerge Victorious in the Brazilian Civil War"
 BRA.reunification.1.d: "After a catastrophic and lengthy civil war that tore Brazilian society apart, the National Government declared definitive victory over the remaining armed groups and other guerrilla strongholds that persisted in the country. In a statement directly from the Planalto Palace, President Jair Messias Bolsonaro announced the unification of the nation, declaring the birth of a \"New Republic, guided by God.\"\n\n\"They tried. They tried to trample on the image of Jesus Christ and tried to destroy our nation once and for all, but God was present again, and freed us from the red curse,\" declared the man, visibly emotional, but maintaining a firm voice. \"The sacrifice of the sons of the Fatherland will not be forgotten, and, in the name of Our Lord Jesus Christ, Brazil will triumph!\"\n\nAlong with his speech, the President made an unexpected announcement, stating that he would resign from office to \"secure a new door for the Children of God.\" His unannounced successor is speculated to be a high-ranking member of the Brazilian Church.\nThroughout Brazil, crowds gathered in the millions in major cities, erupting in celebrations, believing that, for the first time in decades, the true Light of Christ had fallen upon the Nation."
 BRA.reunification.1.a: "A Nation, Freed By God."
 BRA.reunification.2.t: "The Military Emerges Victorious in the Brazilian Civil War"
 BRA.reunification.2.d: "After a bloody and brutal civil war that plunged Brazil into a pit of violence and destruction of its social fabric, the National Government declared total victory over the last remaining guerrilla groups on Brazilian territory. In a statement directly from the Planalto Palace, surrounded by rows of high-ranking generals of the Armed Forces and a large green and yellow flag, President Jair Messias Bolsonaro announced the capitulation of the remaining enemy forces.\n\nIn the same statement, Bolsonaro made a declaration that would reverberate throughout the nations for years, reading aloud that \"The Brazilian political order no longer has what is necessary to put this nation back on track. The military, however, not only has what is necessary but has proven to be a loyal defender of Brazil, maintaining its positions and fighting bravely against the forces of traitors and terrorists who infest this country.\"\n\nFollowing this, he announced his resignation from office and the appointment of General Walter Souza Braga Netto as Brazil's new military leader. Braga Netto, one of Bolsonaro's most loyal men, who served as Minister of Defense during Jair's first term, took the oath, promising \"justice for those who tried to destroy us, to finally put an end to all the chaos our Nation faces.\"\n\nThroughout Brazil, a climate of relief and apprehension grips the population, with some celebrating the return to order and patriotism, while others remain uneasy, fearing a return to violence and state persecution."
 BRA.reunification.2.a: "The Military saves Brazil from communism, once again."
 BRA.reunification.3.t: "Populists Emerge Victorious in the Brazilian Civil War"
 BRA.reunification.3.d: "After years of a relentless and destructive civil war that left Brazil devastated and fragmented, the National Government declared complete victory over the country's remaining guerrilla forces. In a triumphant speech delivered directly from the balcony of the Planalto Palace, President Jair Messias Bolsonaro, cheered and applauded by thousands upon thousands of supporters present, declared:\n\n\"The traitors, the petistas, the Communists, they have all been defeated, destroyed! Their mission to destroy Brazil, which they so carefully planned, has been burned and thrown where it belongs! Brazil has won again! The people have won! Brazil above all, God above everyone!\" he declared, his voice euphoric, while shouts of his name and incessant applause filled the soundscape.\n\nIn the same speech, Bolsonaro announced the final return to institutional activities and the revocation of the State of Siege, declared a few months before the start of the civil war, also stating that elections will, after a long time, be held in the following months. The announcement was met with jubilation throughout Brazil, where tens of thousands of people spontaneously took to the streets in celebrations, celebrating the beginning of a new Brazil, but this time, one centered on the people."
 BRA.reunification.3.a: "A government from the people, by the people, for the people."
 BRA.reunification.4.t: "Liberals Emerge victorious in the Brazilian Civil War"
 BRA.reunification.4.d: "After years of a devastating civil war that left the Brazilian nation shattered, the National Government declared complete and definitive victory over the remaining guerrilla and terrorist forces within its territory. In a calculated speech from the Planalto Palace, flanked by political leaders and high-ranking military officers, President Jair Messias Bolsonaro announced the capitulation of the remaining insurgent groups and the elimination of the last major pockets of resistance.\n\nIn the same speech, Bolsonaro declared that the country would undergo a radical and transformative change, stating that Brazil would now pursue a path of broad economic reforms under the neoliberal model, the end of price controls, the mass privatization of state-owned companies, drastic tax cuts, among other changes to the Brazilian economy that were called \"Neural Surgery\" in the way the nation would operate.\n\nAt the end of his speech, Jair announced that he would be leaving office soon and that he would hand over power to a successor whom he would personally appoint. Immediate speculation about his potential nominee is rife, but the most cited names are Paulo Roberto Nunes Guedes, the economy minister in Bolsonaro's administration, and Felipe D'ávila, a businessman, political scientist, and economist.\n\nOn the streets, reactions were mixed. While upscale neighborhoods and commercial districts celebrated with jubilation and euphoria, poorer neighborhoods and the humble population reacted skeptically, aliviated by the return to peace while fearing that they could suffer more economic inequality."
 BRA.reunification.4.a: "The promise of liberty, the engine of nations."
# Waiting Room
