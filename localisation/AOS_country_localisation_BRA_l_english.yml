l_english:
 # Focuses
 # - Pre Civil War
 BRA_ease_of_business_policy: "Ease of Business Policy"
 BRA_ease_of_business_policy_desc: "Ever since its inception, the Brazilian economy has operated in its own little way, sometimes called \"Brazilian Capitalism\", this system grants large subsidies and protection to so-called \"national champions\" and state enterprises (both usually composed of friends of the current administration), creating a bloated and inefficient industry.\n\nHowever, as economic freedom is the foundation of all other freedoms, if we want to free ourselves from state gigantism, slashing regulations and the incentivisation of a friendly environment for the free market to operate is a necessity."
 BRA_independent_central_bank: "An Independent Central Bank"
 BRA_independent_central_bank_desc: "Government meddling in economic affairs rarely has positive effects, unfortunately, the Central Bank of Brazil is no stranger to this, decades of partisan appointments have meant that the bank's policies are, effectively, an extension of the government's opinions and desires. Creating distance from the natural objective of a Central Bank, the pursuit of a technical and stable economy, in spite of government policy.\n\nWhich is why new measures should be taken to shield the Bank from political pressure from the Executive Branch in conducting monetary policy, increasing the institution's credibility among investors and the people."
 BRA_slash_petrobras: "Slash Petrobras"
 BRA_slash_petrobras_desc: "For many years, Petrobras has been both a strategic asset and a bottomless pit for public coffers, a company with an unnecessary number of employees and burdened with debt. To fully take advantage of the potential it has to offer, we must streamline its budget, cut non-essential expenses, eliminate bureaucratic inefficiencies, and dismiss underperforming employees."
 BRA_agro_four_point_oh: "Agro 4.0"
 BRA_agro_four_point_oh_desc: "Brazilian agribusiness continues to be the most robust pillar of the country's economy, but even with its opulence and importance, it relies on outdated techniques and equipment, vulnerable supply chains, and a strong dependence on imported inputs. Protecting, directing, and expanding investments in this economic backbone of the country is necessary to ensure that we have an agricultural sector worthy of the respect it rightfully deserves."
 BRA_privatize_eletrobras: "Privatize Eletrobras"
 BRA_privatize_eletrobras_desc: "Eletrobras, the state-owned giant in the country's energy sector, was for a long time a symbol of the government's control over energy generation and distribution. However, chronic problems such as corruption, management issue and underinvestment made it inefficient and heavily indebted.\n\nBy privatising it, the sale of stakes to national and international consortia will provide capital for modernising its network, expanding its hydroelectric capacity, and introducing competitive pricing that rewards efficiency, thus increasing the effort of its employees. This measure, despite being criticised by some sectors of society, will help attract foreign investment, positioning us once again as energy exporters."
 BRA_privatize_mail_service: "Privatize the Mail Services"
 BRA_privatize_mail_service_desc: "The Correios has long been a national postal service monopoly, burdened by outdated infrastructure, chronic deficits, strikes, and union resistance that do nothing to improve services. The privatisation of the company will end the waste of public resources that were directed to this area, and competition in parcel delivery and logistics will be boosted.\n\nThis reform will help demonstrate the government's commitment to efficiency and will open doors for international logistics giants to invest in the Brazilian e-commerce market."
 BRA_free_the_infrastructure: "Free the Infrastructure"
 BRA_free_the_infrastructure_desc: "Brazil's road and rail network is in ruins, with potholed streets, abandoned tracks, and potentially useful railway lines deactivated, increasing transportation and agricultural trade costs. A problem like this will not be solved easily, much less quickly, but by opening concessions to private operators, with performance targets and penalties for delays and slowness, we should make progress."
 BRA_cpr_verde: "CPR Verde"
 BRA_cpr_verde_desc: "The Cédula de Produto Rural introduces a market mechanism that finances environmental preservation and restoration in agribusiness. Producers can issue certificates backed by future production, with resources allocated to reforestation, soil recovery, compliance with legal reserves, and the separation between permanent and temporary production areas. The mechanism aims to combat deforestation resulting from agricultural activity without significant public expenditure."
 BRA_expand_the_market: "Expand the Market"
 BRA_expand_the_market_desc: "The Brazilian economy has been hampered by excessive regulation, high and abusive taxes, and barriers that protect inefficient sectors, punishing consumers and entrepreneurs. Simplifying bureaucracy for opening businesses, reducing import tariffs on capital goods and inputs, and eliminating price controls that stifle fair competition are fundamental measures to overcome the obstacles that stand in the way of the country's and the Brazilian market's progress."
 BRA_green_yellow_employment_book: "Green and Yellow Employment Book"
 BRA_green_yellow_employment_book_desc: "The Carteira de Trabalho Verde e Amarela introduces a more simplified and flexible employment contract, reducing the heavy regulatory burden on employers while simultaneously maintaining essential protections for workers. The model lowers mandatory benefit costs, simplifies lengthy hiring and dismissal processes, and reduces the bureaucracy that has long discouraged formal employment.\n\nAimed at bringing millions of workers back into the formal economy, boosting job creation, and making Brazil a more attractive country for investment, the reform is a step towards improving the quality of employment in the country."
 BRA_the_new_agro: "The New Agro"
 BRA_the_new_agro_desc: "Brazilian agriculture is the backbone of the economy, keeping the entire country well-fed and positioning the country as an important exporter to the rest of the world. However, it operates far below its potential, dependent on imported fertilisers and outdated machinery, hindering its progress and often leading to unsatisfactory results for businesses and farmers.\n\nIf we want to revitalize agriculture and elevate it to its full potential, we must direct greater investments towards modernising the agribusiness sector. This includes investing in modern tools, expanding irrigation, and mechanising more complex areas."
 BRA_reduce_agro_input_imports: "Reduce Agricultural Input Imports"
 BRA_reduce_agro_input_imports_desc: "Brazilian farmers play a central role in feeding other countries around the globe, yet they remain dependent on foreign suppliers of fertilisers, pesticides, and agricultural machinery parts, making our domestic market subject to global prices.\n\nWe can, and must, reduce this dependence by providing tax incentives to local companies that manufacture tractors and machinery, expanding the mining of phosphate rocks, and promoting the reactivation of nitrogen factories throughout the country, thus beginning to reduce our dependence on external markets and mitigating the risk of being affected by international crises."
 BRA_aliquota_unica: "Alíquota Única"
 BRA_aliquota_unica_desc: "Formulated by Paulo Guedes, the single tax rate aims to replace the pile of overlapping federal, state, and municipal taxes in Brazil with a single consumption tax rate, applied equally to all goods and services. This measure will put an end to exemptions for products considered essential, cumulative distortions, and legal battles over tax classifications.\n\nBy simplifying the tax system, we address the core of fiscal inefficiency in the country, making the system fairer and making tax evasion more difficult."
 BRA_halfway_there: "Halfway There!"
 BRA_halfway_there_desc: "The Workers' Party government, led by Luís Inácio Lula da Silva, was a complete disaster for Brazil. A bloated welfare state that takes money from productive sectors and gives it to those who don't make an effort, along with prison resocialization policies that coddle thugs and allowed criminal factions to dominate our cities and as if that wasn't enough, gender ideology being pushed on children in schools! All of this was sponsored by the prosperity of the commodities boom and the Real Plan, factors that have nothing to do with Lula's short-sighted socialist policies.\n\nWhen Operation Car Wash uncovered massive criminal schemes and exposed the systemic corruption of the entire government machine, the people, the giant, awoke, rejected all leftism and for the first time after nearly two decades of the Workers' Party wrecking this country, the right has finally gotten its turn in power again. The past two years have not been much more turbulent than expected, but problems have started to pile up and cracks have begun to show. As long as nothing catastrophic happens soon, we'll be fine and might manage to win reelection. We cannot afford to waste this opportunity."
 BRA_flex_gun_ownership: "Flexibilize Gun Ownership"
 BRA_flex_gun_ownership_desc: "The increase in crime and the feeling of insecurity experienced by the Brazilian population more and more each day are raising public demand for broader rights and methods of self-defence. While the laws enacted after the Disarmament Law impose strict bureaucracy on citizens and make access to firearms legally very difficult, easing the process of gun ownership empowers capable and responsible citizens to protect their homes, families, and themselves from criminals, intruders, and other types of threats."
 BRA_protect_our_mothers: "Protecting Our Mothers"
 BRA_protect_our_mothers_desc: "The mothers of our country, especially single mothers who raise their children amidst violence and hardship, face constant threats to their dignity, their physical and mental well-being. With the help of Minister Damares Alves, the Mothers of Brazil programme provides them with the justice they deserve, including expanded support networks, vocational training courses tailored to the needs of single and inexperienced mothers, and legal assistance in cases of vulnerability or domestic violence.\n\nRecognising the fundamental role that the mothers play in shaping and raising our citizens, and the difficulties and injustices they endure, they now will have protection to ensure a stable and healthy life for the future generations of our beloved country."
 BRA_give_out_land_deeds: "Give Out Land Deeds"
 BRA_give_out_land_deeds_desc: "Unused public lands and abandoned rural properties have become havens for squatters and places where criminals hide and carry out their illicit activities, while many subsistence farmers and families are increasingly lacking property titles-which are becoming more expensive-to cultivate the land and make a living.\n\nTo protect our small landowners, veterans, and rural workers, issuing property titles will help them live their lives, transform unused and unproductive fields into sources of income and food for those who depend on them, and strengthen the rural economy of our nation."
 BRA_revive_brazilian_tourism: "Revive the Brazilian Tourism Industry"
 BRA_revive_brazilian_tourism_desc: "The recent crises unfolding around the world have devastated tourism in our nation, once a major source of wealth for many cities throughout the country, with empty beaches, closed hotels, and abandoned cultural spaces. We must focus on revitalising this industry, directing investments towards hotel renovations and marketing campaigns highlighting the natural wonders, beautiful sights, and cultural heritage of the nation.\n\nIn addition to injecting billions into the national economy, this revitalisation will help us promote the image of a resilient, innovative, and beautiful country to tourists from all over the world once again."
 BRA_escola_sem_partido: "Escola Sem Partido"
 BRA_escola_sem_partido_desc: "Ideological indoctrination in schools and universities has been a constant topic, with teachers accused of promoting partisan agendas and personal ideologies under the guise of education. Imposing neutrality in public schools is therefore necessary to put an end to indoctrination in the school environment, prohibit political propaganda, monitor teachers and staff who may be spreading these ideas, and ensure that the curriculum is free of ideological bias, focusing on teaching with neutrality."
 BRA_civilian_military_schools: "Civic-Military Schools"
 BRA_civilian_military_schools_desc: "With the increasing romanticisation of crime in schools, growing indiscipline in classrooms, and the erosion of national values, the productivity of students and public and private schools has plummeted, with reports showing a drastic drop in student grades and videos of disrespect and devaluation of education by students appearing more and more frequently on social media.\n\nHowever, civic-military schools offer the alternative we need to solve these problems, transferring the management of education to the hands of the Military Police and the armed forces. Students will be exposed to more structured routines, physical training, and a curriculum that will transform them into God-fearing citizens, respectful of their Country, and citizens with Honour."
 BRA_technology_of_brazilian_state: "Technologies of the Brazilian State"
 BRA_technology_of_brazilian_state_desc: "The scientific and technological potential of our nation is immense, but this potential has been drained and wasted in every way by under-investment, ideological interference, and a bloated bureaucracy, leaving key institutions stagnant and discouraging potential investors from investing in our industry.\n\nTo recover what remains of our potential, we must fire the corrupt and inefficient employees, significantly reduce the bureaucracy that has long served as an obstacle to progress in this area, and increase incentives to attract investors from both within the country and abroad."
 BRA_lower_age_of_criminal_responsibility: "Lower the Age of Criminal Responsibility"
 BRA_lower_age_of_criminal_responsibility_desc: "The increase in youth crime in Brazil, fueled by lenient punishments - or, in some cases, impunity - and recruitment by criminal factions has compromised the country's public safety, with Article 27 of the Federal Constitutions protecting minors who commit heinous crimes from facing significant consequences. Therefore, repealing Article 27 of the Constitution and lowering the minimum age for criminal responsibility will bring justice to young offenders and underage criminals.\n\nHolding younger individuals accountable for their crimes in the same way as adults will not only deter the exploitation of young people by various criminal organisations but will also demonstrate to those old enough to understand their actions that they will no longer go unpunished for the crimes they commit."
 BRA_no_more_leashes: "Unleash Our Police Force"
 BRA_no_more_leashes_desc: "The increase in crime throughout the national territory, driven by growing economic difficulties, lack of opportunities in peripheral areas, and the weakening of state authority in those same areas, has transformed streets into battlefields, entire areas where criminals operate with almost total impunity, exploiting law-abiding citizens and eroding confidence in the government's ability to deal with the problem.\n\nThe strengthening of this \"Parallel State\" is largely due to excessive rules and judicial intervention in what our police forces can or cannot do, or where they can and cannot act. We must break this excessive intervention and grant our security forces the ability to operate without major restrictions; expanding their powers of approach and search, loosening protocols for the use of force, and providing greater protection against lawsuits."
 BRA_the_administrative_reform: "The Administrative Reform"
 BRA_the_administrative_reform_desc: "The Brazilian state apparatus, fostered by decades of corruption, political patronage, clientelism, the creation of often unnecessary ministries, and overlapping functions, has become a true obstacle to the progress of our nation. Ministries and agencies employ thousands of people in ghost jobs, with benefits and perks that drain a disproportionate share of the budget while providing low-quality services to the people of Brazil.\n\nExcessive bureaucracy and widespread corruption stifle entrepreneurship, delay infrastructure projects such as the cleanup of polluted rivers like the Tietê, and discourage investment from external agents. Such a system cannot be allowed to continue; it needs to be reformed from top to bottom, and that is exactly what will be done - a complete and deep reform - so that in the end, the public sector serves the population, and not consortia and groups of corrupt and opportunistic individuals."
 BRA_playing_president: "Playing President"
 BRA_playing_president_desc: "Now that the fervor of popular support we enjoyed in the first half of the term has begun to lose steam, we need to show results. And although we criticized so much the \"tit for tat\" that dictates Brazilian politics and promised not to compromise our ideals for \"politicking\", some deals that are less than immaculate will have to be made for the sake of our governance."
 BRA_reconcile_psl: "Reconcile With the PSL"
 BRA_reconcile_psl_desc: "The Social Liberal Party (PSL), once a key ally of the conservative bloc, has distanced itself from us and begun working for and with the opposition. However, its electoral base remains composed of evangelical voters, proponents of public security, and free-market enthusiasts-an ideological base close to that of our government and similar to our project.\n\nThe division between the two blocs benefits no one but the Workers' Party and the left-wing bloc. Therefore, to consolidate the right-wing bloc and strengthen our position in Congress, reconciling our relations with the party's leaders will bring us great advantages and strengthen our power."
 BRA_negotiate_with_centrao: "Negotiate With the Centrão"
 BRA_negotiate_with_centrao_desc: "The Centrão - a coalition of pragmatic political blocs that control a substantial portion of the deputies in Congress - is a group that our coalition considers indispensable for maintaining ourselves in power in Brasília, but also highly unpredictable. It lacks a specific ideology and declares support for those who pay the most. Even though we hold power, if we wish to retain it and secure our influence, negotiating with the Centrão - offering them positions, benefits, and funding - is of significant necessity."
 BRA_form_new_cabinet: "Form a New Cabinet"
 BRA_form_new_cabinet_desc: "The current cabinet, an amalgam of alliances from different blocs and remnants of previous coalitions, has proven cowardly, divided, and too weak to carry out the deep and bold reforms that Brazil needs. To complete and advance the conservative agenda, it is of utmost importance to appoint ideologically committed figures who share the same vision as the Head of State and who will carry it out without hesitation.\n\nThis includes appointing figures linked to the Brazilian Armed Forces to key positions in the government. Reforming the cabinet from top to bottom will not only facilitate the advancement of our agenda but will also send the message we want to the Supreme Federal Court and the National Congress.\n\n§YThe advancement of our Agenda is non-negotiable.§!"
 BRA_new_minister_civilian_house: "New Minister of the Civilian House"
 BRA_new_minister_civilian_house_desc: "The Civilian House has long suffered from weak and incompetent leadership. Ciro Nogueira, a long-time politician who has served in Congress as a federal deputy four times, brings with him the experience and political strength necessary for the position of Chief Minister."
 BRA_give_up_fnde: "Give Up the FNDE"
 BRA_give_up_fnde_desc: "The National Fund for Educational Development, despite its noble purpose of financing improvements to infrastructure in the country's schools, textbooks, and school meals, has become inefficient and bloated, with repeated and successive corruption and mismanagement scandals brought to public attention.\n\nTo make federal government funding for education more efficient, clean, and transparent, it is necessary to scale down investment in the programme and favor more private education initiatives."
 BRA_compromises_with_the_party: "Compromises With the Party"
 BRA_compromises_with_the_party_desc: "The Social Liberal Party has ceased to be a unified bloc, having split into a moderate wing seeking broader appeal and a hardline wing, loyal to the original project and message of Jair Messias Bolsonaro. The moderate bloc wants to soften the President's rhetoric on cultural issues and build a support network in the centre.\n\nRepresenting a considerable part of the party, it is of great importance that we keep them satisfied so that they remain within the coalition and do not cause a fracture that would only benefit the left in the elections. We must grant them concessions and compromise on some points, such as toning down some of the more polarising proposals and granting them positions in certain areas of the government, in exchange for their votes and support."
 BRA_deals_with_bolsonaro_wing: "Dealing With the Bolsonaro Wing"
 BRA_deals_with_bolsonaro_wing_desc: "The radical wing of the PSL, loyal solely to President Bolsonaro, remains the most loyal and energised base of the party, with fiery and euphoric speeches that keep the morale of our supporters high. They are passionate about Jair's project, but the same radicalism that helps maintain our current base also alienates undecided voters and provides ammunition to leftists who are salivating at the opportunity to portray us as all extremists and radicals.\n\nWe need to control the hardliners, while at the same time maintaining them energised and motivated to continue fighting for the President. By giving the radical wing what they want to see in legislation while discouraging incendiary statements that alienate moderates and centrists, we will keep them on our side."
 BRA_hand_over_secretariats: "Hand Over the Secretariats"
 BRA_hand_over_secretariats_desc: "The Centrão controls the votes necessary to approve and pass the reforms we want, but their support is never free, and in many cases, it is expensive. To ensure that they vote in our favour and prevent them from trying to obstruct the president's agenda or switching sides at unexpected moments, it is necessary to place trusted individuals from their group in various Secretariats, granting them the power they so desire without risking undermining the President in the long term."
 BRA_no_negotiations: "\"No\" Negotiations"
 BRA_no_negotiations_desc: "The maneuvers and little games of the Centrão have reached an intolerable level, with its politicians demanding cabinet positions, budget amendments, regional funds, and investments in exchange for their support in the Chamber of Deputies and their votes in favour of our projects. Further engagement with them gradually turns us into their puppets, completely dependent on them to govern, and supporters become alienated after realising we aren't delivering on our promises.\n\nIf we want to advance our agenda, govern freely, and deliver on our promises to our base, we must isolate this bloc whilst consolidating the right-wing bloc so that their votes from the opposition don't negatively impact us in the long run."
 BRA_back_in_the_center: "Back In the Center"
 BRA_back_in_the_center_desc: "The importance of the Centrão for proper governance has long been overlooked by our bloc; aligning with them and doing what they want is considered betrayal by the base, but it's time to let go of that idea and accept that, without them, a government cannot survive alone for long.\n\nOne way or another, they will go to one side or the other; the one that pays more, offers more, and promises more. Ignoring them means isolation and more power for the Left, and that's why we must bring them into our orbit, conceding what they want in exchange for their support."
 # - The Crises
 BRA_the_oil_crisis_hits: "The Oil Crisis Hits!"
 BRA_the_oil_crisis_hits_desc: "The global oil market collapsed after the death of the King of Saudi Arabia and the subsequent civil war in the country, with the almost complete interruption of oil supply to Brazil having a strong impact on the country's economy. Fuel prices skyrocketed overnight, industries in the country halted their activities due to the exorbitant increase in transportation costs, and several companies dependent on the resource were forced to cease operations. At gas stations, immense queues formed as people tried to get a chance to refuel.\n\nThe Oil Crisis, still in its initial stages, exposed the nation's fragilities and vulnerabilities to external energy and oil dependence, with national inflation soaring and prices reaching unprecedented levels. We need to protect Brazil from further damage, seeking methods to alleviate and minimise this crisis as much as possible."
 BRA_secure_internal_market: "Secure the Internal Market"
 BRA_secure_internal_market_desc: "The Oil Crisis destabilised the domestic economy to levels we didn't expect to see after Collor's impeachment and the end of the hyperinflation, with the price of products reaching exorbitant values every day, resulting in robberies, protests, and general panic. To prevent the crisis from further shaking the nation, some measures, including the release of reserves in batches, subsidies for workers and small to medium-sized merchants, and the strengthening of regional distribution networks to prevent shortages and widespread looting, will give us enough time to consider a broader plan."
 BRA_open_international_trade: "Open to International Trade"
 BRA_open_international_trade_desc: "The Oil Crisis has exposed us many things, from weaknesses and vulnerabilities to things we took for granted. However, one of the most significant lessons was the dangers that international isolation can pose to our nation. Learning this lesson, we must turn to international trade, strengthening ties with our existing buyers and seeking new suppliers in Africa, the Middle East, and Asia.\n\nAlthough some alliances and partnerships may challenge our ideological pride, we must make various sacrifices to ensure that Brazil recovers from this crisis as quickly as possible."
 BRA_drop_import_parity_policy: "Drop Import Parity Policy"
 BRA_drop_import_parity_policy_desc: "The import parity policy, which directly links domestic fuel costs to international barrel prices, has become a direct obstacle to economic recovery. Every increase in international prices, whether due to the Saudi Civil War or any other conflict and market uncertainty, directly impacts the pockets of the Brazilian people.\n\nAbandoning this mechanism, although requiring careful and cautious management by the government and investors, will allow for the decoupling of local prices from the international market, giving Petrobras the freedom to set prices based on production costs and national needs."
 BRA_enact_price_controls: "Enact Gas Price Controls"
 BRA_enact_price_controls_desc: "The surge in fuel prices has caused a near-complete paralysis of public and private transportation in our country, inflated the prices of goods and food, and, above all, provoked social unrest and violent protests. Therefore, to de-escalate the situation as much as possible and gain time to plan more effective and long-term policies, implementing price controls will reduce the prices of essential goods to levels that are minimally affordable for the general population."
 BRA_brics_cooperation: "BRICS Cooperation"
 BRA_brics_cooperation_desc: "Our economy is in a deplorable state as a result of the oil crisis, with prices increasing daily, investors becoming  more and more uncertain about investing in our country, and what remains dependent on an unpredictable and volatile market. In the midst of all this, our BRICS allies-mainly countries like the Russian Federation and the People's Republic of China-possess vast oil reserves that we are urgently seeking.\n\nNot only that, but seeking drilling technologies from Russia and Indian expertise in biofuels will help us boost exploration in the pre-salt layer, enabling us to reduce our dependence on the external market and strengthen our ties with economic allies."
 BRA_increase_state_share_petrobras: "Increase State Share in Petrobras"
 BRA_increase_state_share_petrobras_desc: "With the significant market volatility and foreign speculation pushing Petrobras to the sidelines amid the Oil Crisis, placing the company in an extremely delicate financial position, the re-establishment of control and the increase of the State's stake in the company become nothing but a necessity to save the enterprise.\n\nThe increase in the government's shareholding through direct share purchases, preemptive subscription rights, and other methods will allow us to steer the company in a direction that aligns with the interests of the population, moving beyond the satisfaction of only shareholders and investors."
 BRA_invite_foreign_refineries: "Invite Foreign Refineries"
 BRA_invite_foreign_refineries_desc: "The crisis has exposed to the world the fraudulent nature of Brazil's refining capacity, with domestic production being insufficient to meet the population's demands and forcing us to import petroleum derivatives at above-normal prices.\n\nOpening the doors and inviting foreign refining companies to invest in new facilities or modernise existing ones within our territory offers the quick solution we need."
 BRA_the_coming_flu: "The Coming Flu"
 BRA_the_coming_flu_desc: "The first reports of a new, unknown respiratory virus emerged in the final months of 2019, initially dismissed by many around the globe as a minor concern, an epidemic that would begin and end within the People's Republic of China. That is not what happened; the disease reached other places, quickly arriving in Brazil and spreading even faster through airports, ports, and public transportation.\n\nHospitals, caught by surprise, were quickly overwhelmed, with a lack of adequate equipment exposing the underinvestment the sector had been receiving, facilitating the virus's spread throughout our territory. Our healthcare system, with all its fragilities and incapacities, was exposed to the population, which, confused about how to deal with the new threat, loses confidence in the government with each passing day.\n\nWe need to deal with this plague as quickly as possible."
 BRA_operation_warp_vac: "Operation WarpVac"
 BRA_operation_warp_vac_desc: "The COVID-19 pandemic that swept the nation exposed the government to many problems and issues, one of which was the nation's extreme dependence on foreign vaccine suppliers, leaving millions upon millions of our people hostage to delivery delays, diplomatic impasses, and bureaucratic hurdles in the acceptance of vaccine purchases. In light of this, Operation WarpVac will serve to accelerate the development and domestic production of vaccines, directing resources to the Butantan Institute, Fiocruz, and private laboratories to expedite clinical trials and significantly increase production scale."
 BRA_covid_brics_cooperation: "Assistance From BRICS"
 BRA_covid_brics_cooperation_desc: "The diplomacy involved in obtaining and purchasing COVID-19 vaccines has highlighted the unreliability of traditional suppliers, with delays in deliveries and inflated prices. Our BRICS partners, however, offer us the alternative we need.\n\nThe production lines for the Sputnik V vaccine from the Russian Federation can be licensed and purchased for local bottling and finishing. Meanwhile, our allies in the People's Republic of China offer investments, raw materials, and technology to produce our own vaccines, in addition to offering the CoronaVac vaccine for purchase."
 BRA_call_for_duty: "Call For Duty"
 BRA_call_for_duty_desc: "The COVID-19 virus is testing the resilience of the Brazilian nation, with hospitals overwhelmed and the economy shaken by isolation measures and lockdowns that have resulted in the closure and bankruptcy of numerous small businesses and shops. The Armed Forces have also been impacted by the pandemic, with cuts in payments, postponed training, and increasingly smaller waves of recruits.\n\nWithout the need for field activities and the growing demand of the population for alternatives to hospitals and conventional healthcare, mobilising soldiers in barracks to distribute medical supplies, conduct campaigns, and maintain order in high-risk areas becomes the primary way our Armed Forces can assist in this crisis."
 BRA_covid_university_research: "Covid Research Grants"
 BRA_covid_university_research_desc: "With the COVID-19 pandemic spreading and claiming more lives among our people, it has become apparent to both the population and the government that our efforts, despite being numerous, remain insufficient in preventing the disease from spreading throughout the country.\n\nTherefore, we must invest larger sums in national institutions such as Butantan, Fiocruz, universities, and private laboratories, to enable studies and research on a vaccine to be accelerated and containment methods to be better implemented."
 BRA_relax_research_regulations: "Relax Vaccine Guidelines"
 BRA_relax_research_regulations_desc: "Mandatory protocols regarding vaccine research and increasingly stringent requirements are delaying the development and progress of clinical trials, hindering more in-depth studies and research on the virus and a potential vaccine. Proving detrimental to our response to COVID-19 and to scientific progress, we must relax and ease these requirements, simplify clinical trial approvals, and cut unnecessary regulations."
 BRA_field_medical_specialists: "Field Covid Testing"
 BRA_field_medical_specialists_desc: "The spread of the virus has been fueled by slow testing, a massive number of patients on waiting lists, and centralisation in vaccination centres that leave certain communities blind to outbreaks for an unacceptable amount of time. Therefore, mobilisation of troops and personnel in vans equipped with rapid test kits and basic laboratories will be sent to neighbourhoods, factories, and districts far from large urban centres, conducting tests and collecting samples on-site and delivering results in a short period of time."
 BRA_military_hospitals: "Set Up Emergency Military Hospitals"
 BRA_military_hospitals_desc: "Hospitals are overwhelmed to the point where patients are forced to wait in lines for entire days or are hospitalised with inadequate equipment that does more harm than good. To help alleviate the pressure on hospitals, the armed forces will set up and properly equip military hospitals.\n\nThose who go to these hospitals will receive the appropriate equipment and necessary attention that conventional hospitals are currently unable to provide, ensuring that no Brazilian is prevented from receiving treatment and care for COVID-19."
 BRA_mass_vaccine_production: "Mass Vaccine Production"
 BRA_mass_vaccine_production_desc: "The different waves and peaks of COVID-19 have put Brazil in a delicate position, with millions of civilians unvaccinated during the periods when they needed it most. To protect our citizens and advance the process of eradicating the virus from our country, mass production of vaccines has become indispensable. Expanding the facilities of Fiocruz and the Butantan Institute, equipping them with the right tools and technologies to produce the largest possible quantity in the shortest possible time, is one of the main steps to reaching our goals regarding the pandemic.\n\nOur citizens will be able to sleep peacefully again, knowing that the virus that swept away so many lives and families will no longer have the chance to affect them."
 BRA_faster_covid_response: "Faster Response Time"
 BRA_faster_covid_response_desc: "The excessive bureaucracy surrounding Covid-19 has claimed countless lives. Delayed drug approvals, endless committees debating protocols, vaccine distribution stalled in certain areas, and supplies accumulating or being left unused due to a lack of initiative from governors and local authorities.\n\nTo save the lives of our population and prevent further tragedies like these from occurring, we must significantly reduce this bureaucracy and accelerate the response times of our authorities, open distribution points, and demand the delivery of medications and resources."
 BRA_the_agro_collapse: "The Agro Collapse"
 BRA_the_agro_collapse_desc: "Brazil's economy was always heavily dependent on its agribusiness sector, specially with the export of agricultural goods to the USA, but with the collapse of the American state and its economy we have lost a major trade partner. The massive agro, once the economic powerhouse of Brazil, is in utter chaos. Farmers are flooding markets with cheap agricultural products in a attempt to save themselves, and in the processes skyrocketing inflation all over the country.\n\nAs if it weren't enough, the peasantry are protesting against the landowners due to increasingly low salaries and working conditions caused by the compounded crises. If action is not taken right away, the chaos will only get worse and worse, and our already fragile economy will once for all, shatter in pieces."
 BRA_reform_internal_agro: "Reform Internal Agricultural Policy"
 BRA_reform_internal_agro_desc: "The outbreak of the Second American Civil War ended one of Brazil's largest export market, while heavily affecting China, our largest, causing the collapse of the country's agribusiness and an unprecedented explosion in food prices in the markets. Agriculture, a market of extreme importance to our country and one of the main pillars of our economy, entered a downward spiral, and, to prevent what remains of the agribusiness from completely collapsing, a profound reform of our internal agricultural policy is more than vital for the survival of the rest of our trade."
 BRA_seek_foreign_aid: "Seek Foreign Aid"
 BRA_seek_foreign_aid_desc: "The collapse of the agricultural sector has emptied rural banks and left crops rotting in the fields due to a lack of buyers and soaring prices, threatening the onset of widespread famine in certain urban centres that depend most on a constant supply of food.\n\nThere are no internal measures that can be taken in time to prevent what is coming; therefore, we must seek external assistance, both from our long-term allies in BRICS and strategic partners in regions such as Asia and Europe."
 BRA_explore_amazon_basin: "Explore the Amazonian Basin"
 BRA_explore_amazon_basin_desc: "The Amazon Basin, long left largely undeveloped for environmental reasons, offers us untapped potential to compensate for the production lost with the start of the Second American Civil War and the subsequent collapse of agribusiness in Brazil.\n\nWe can transform the basin into a breadbasket for our country, absorbing surplus labour, helping to alleviate food insecurity in many regions, and mitigating some of the impacts we suffered from the collapse of one of our largest economic partners."
 BRA_organic_fertilizers: "Push For Organic Fertilization"
 BRA_organic_fertilizers_desc: "The collapse of fertiliser supply chains worldwide and domestically has resulted in farmers in our country facing exorbitant costs and shortages of synthetic inputs, threatening numerous harvests and the food security of countless people.\n\nTo prevent the situation from spiralling further out of control, we must promote organic fertilisation methods, such as encouraging the creation of compost from natural waste and promoting biofertilisers derived from naturally occurring materials."
 BRA_increase_agro_subsidies: "Raise Agribusiness Subsidies"
 BRA_increase_agro_subsidies_desc: "The collapse of agribusiness effectively cut off rural credit lines almost completely, leaving large producers without financing and consequently unable to access higher-quality equipment, resulting in large quantities of crops being abandoned or harvested prematurely.\n\nWith the agribusiness on its knees and about to take its last breaths, it is of great necessity that we increase subsidies to maintain the sector alive and functioning, buying us time to focus on other areas of the economy affected by the death of Wall Street while providing some relief to the agricultural industry."
 BRA_funds_from_un: "Bail Funds From the UN"
 BRA_funds_from_un_desc: "The National Treasury has been completely drained and used in our attempts to save the economy from total collapse in the face of all the crises we are facing, effectively leaving us with almost no money to properly deal with what is yet to come and what we still have to deal with.\n\nSeeking bail funds from the United Nations is therefore crucial to having resources in the short to medium term, giving the Federal Government breathing room and allowing it time to implement more profound and long-term reforms and measures."
 BRA_promote_market_cooperation: "Promote Market Cooperation"
 BRA_promote_market_cooperation_desc: "The export market, in general, collapsed overnight, leaving large producers with overharvests and no buyers nationally or internationally due to prices, while urban centres more dependent on consistent harvests face the beginning of a widespread food shortage crisis.\n\nPromoting cooperation in domestic markets is more than essential for surviving the crisis, connecting regional cooperatives with supermarket networks and institutional buyers, granting subsidies and incentives for rural warehouses, and stimulating the interconnection of the domestic market."
 BRA_emergency_credit_support: "Emergency Credit Support"
 BRA_emergency_credit_support_desc: "The agricultural crisis has frozen markets and rural credit lines, with banks refusing new loans to large companies and large producers, leaving them unable to purchase seeds, fertilisers, or fuel to carry out new harvests, threatening food shortages and famine throughout the country.\n\nWe cannot allow the famine of the 1990s to repeat itself, much less be even greater, and therefore we must provide emergency credit support to large agricultural companies, preventing the mass bankruptcy of producers, keeping key crops in active production, and reducing the risk of the country entering a period of widespread famine."
 # - 2022 Elections
 BRA_the_2022_elections: "Brazil's Most Decisive Elections"
 BRA_the_2022_elections_desc: "The 2022 elections will be a crossroads that will truly change Brazil's future. After years of polarisation, economic hardship, and accumulating international economic and geopolitical disasters, the nation's current situation will reveal whether the Conservatives' power project will continue after facing various setbacks, or whether the Left will return to power after Lula's imprisonment and PT's subsequent defeat in 2018.\n\nWith the two main federations, the §7\"Aliança Patriótica Brasileira\"§!led by the right-wing bloc and Jair Messias Bolsonaro, and the §p\"Federação Brasil por Esperança\"§! led by the left-wing bloc and former President Luiz Inácio Lula da Silva, dominating the election landscape, the polarisation and ideological radicalism harboured by the Brazilian population are poised to reach a boiling point.\n\nOnly time will tell, but regardless of the outcome, §Ythe losing side will not accept it easily.§!"
 BRA_elections_side_with_lula: "Brazil For Hope!"
 BRA_elections_side_with_lula_desc: "The Brazil of Hope Federation, rallying under former president Luís Inácio Lula da Silva, unites the left-wing bloc - workers, trade unions, social movements, progressives, left-wing intellectuals, and young people who are confronting the conservative wave that swept the country in 2018 and which has resulted in nothing more than disaster and poverty - into a cohesive bloc under the banner of hope, social justice, and national sovereignty. "
 BRA_elections_side_with_bolso: "The Patriotic Alliance"
 BRA_elections_side_with_bolso_desc: "The Brazilian Patriotic Alliance (APB), rallying under current President Jair Messias Bolsonaro, unites the right wing-evangelical blocs, farmers, gun rights advocates, conservative Christians, and men, women, and young people disillusioned with the power project of the left and the Workers' Party, which resulted in nothing more than stagnation and poverty-into a cohesive bloc that channels Bolsonaro's vision for his second term."
 BRA_elections_renew_socdem: "Reinvigorate Progressive Policies"
 BRA_elections_renew_socdem_desc: "Lula's first governments and the progressive agenda of the 2000s brought about historic social achievements for the country, but today's world is not the same as it was then. Social inequality, climate threats, youth disillusionment with the government, and the various economic transformations around the planet demand a revitalised, new vision from the Party.\n\nLula's campaign and policies should focus on expanding the Bolsa Família programme, investing heavily in renewable energy, strengthening public education, and combating prejudice, discrimination, and racism through affirmative action and anti-hate campaigns."
 BRA_elections_mingle_socialists: "Mingle With The Socialists"
 BRA_elections_mingle_socialists_desc: "Jair Messias Bolsonaro is an evil that will not be defeated if the left continues to be divided by petty ideological reasons. It is necessary that we set aside our differences for now to have a chance of defeating the Brazilian Patriotic Alliance in the second round of the elections.\n\nSecuring the support of the FPTU and the votes of its supporters is crucial for this victory to happen, and, despite slightly tarnishing Luís Inácio's image as a moderate, it will not be enough to alienate the centre and moderates, strengthening the progressive front and consolidating the union against the right and Jair Bolsonaro."
 BRA_elections_sideline_radicals: "Sideline The Radicals"
 BRA_elections_sideline_radicals_desc: "The Brazil for Hope Federation has broad support from the left, but radicals and extremists—those who advocate violent methods for progressivism and revolutionaries—risk alienating moderate voters and the centre-left base we need to win the second round.\n\nFurthermore, bringing them into the coalition would fuel the rhetoric of Jair Messias and his henchmen, who would have more basis for their accusations of us being communists and radicals.\n\nTherefore, we must refuse to bring extremists into our coalition, opting instead to marginalise their voices during the campaign, downplaying shared rallies or even messages of support for candidates and well-known figures of the radical left. In this way, Lula will be able to maintain his moderate image, attract more moderate voters, businessmen, and greater international support."
 BRA_elections_grassroots_campaign: "Grassroots Campaigns"
 BRA_elections_grassroots_campaign_desc: "Direct contact with the people and ordinary citizens is what sets Lula's campaign apart, and this is what made him prosper in both his first and second elections. His presence at massive demonstrations in low-income neighbourhoods, unions, and smaller towns will attract support from the less wealthy population, with Lula speaking on topics such as employability, access to healthcare, decent education for Brazilian children, and the dignity of Brazilian workers.\n\nLula's strength has always been the people; therefore, he should avoid excessive reliance on social media and even television advertising, utilising his supporters and integrating them into the campaign, making them part of the process for Lula's reelection through T-shirts, flags, demonstrations, and chants."
 BRA_elections_cruzade_for_brazil: "Cruzade For Brazil"
 BRA_elections_cruzade_for_brazil_desc: "The campaign for President Jair Messias Bolsonaro's second term is positioned as a true struggle, a crusade to ensure that leftist ruin never returns to power, framing the elections as a battle against corruption, socialism, and the moral decay that threaten Christianity, the Fatherland, the Family, and Freedom.\n\nThrough economic growth, reduced crime, and the fulfilment of promises such as the liberalisation of gun ownership and the fight against communism, Bolsonaro is positioned as a reliable leader, one who can be trusted to keep his word and purge the bad elements from the country.\n\nA national awakening, Bolsonaro will save Brazil once again from the abyss and inaugurate a golden age of prosperity and virtue."
 BRA_elections_moderated_tone: "Moderated Tone"
 BRA_elections_moderated_tone_desc: "As the campaign deepens on the election trail, Bolsonaro begins to soften his rhetoric, maintaining a certain distance from the heated confrontations and aggressiveness that marked his 2018 campaign. Avoiding direct attacks on the judiciary and opposition leaders like Lula, he remains focused on more practical issues such as economic recovery after the disasters that followed the Saudi Civil War, public security, family values, and calibrating his overall message to attract undecided centrists and moderates while maintaining his most loyal base."
 BRA_elections_no_holding_back: "No Holds Barred"
 BRA_elections_no_holding_back_desc: "Populist and aggressive rhetoric is what elected Jair Bolsonaro in 2018, and that won't defeat him now. Therefore, the President is intensifying his style, launching attack after attack directly at the left, the media, the judiciary, and the system that has kept Brazilians asleep for so long and is now fighting to put them back to sleep.\n\nWith rallies exuding the same raw energy as always, Bolsonaro raises the fact that his main rival, Luís Inácio Lula da Silva, was imprisoned for corruption and fraud, also appealling to the defence of the family and the Christian faith, and promises to continue his arduous fight against organised crime and corruption.\n\nBeing deliberately aggressive is done to energise his base, dominate headlines, and force his opponents onto the defensive. With his popularity peaking in rural areas, among evangelicals, and in the interior, the strategy of maximising intensity to mobilise his base makes his supporters more engaged and supportive of him."
 BRA_elections_social_media_campaign: "Social Media Campaigning"
 BRA_elections_social_media_campaign_desc: "Social media was a key factor in bringing Bolsonaro to the general public and propelling him to the Presidency. Having learned from his first campaign, the use of platforms like WhatsApp, Telegram, Instagram, TikTok, and Twitter is crucial to bring him a Second Term and for bypassing traditional media and reaching millions of people directly, without needing newspapers like SBT and Globo.\n\nShort, impactful videos, live streams, memes, audio messages, and excerpts from rallies are spreading like never before through family groups, community channels, and groups of friends, turning his supporters into organic amplifiers for his campaign. The focus on the internet, in addition to helping him reach more people, bypasses the corrupt media and keeps Jair in constant conversation, dominates online trends, and appeals to younger followers and those from rural areas who don't watch news on TV."
 BRA_elections_the_last_stretch: "The Last Stretch"
 BRA_elections_the_last_stretch_desc: "The second round of the 2022 presidential elections has arrived, and Brazil, along with all Brazilians, is holding its breath.\n\nAfter a close first round that resulted in the victory of the APB, Luís Inácio Lula da Silva and Jair Messias Bolsonaro face off in a contest that will define the future that the country will carry for the next few years, possibly even longer.\n\nConsidered the most polarised and divided election since redemocratization, the Brazil for Hope Federation is united around former President Lula, securing the support and transfer of other left-wing candidates and federations who lost and remained in the first round, while the Brazilian Patriotic Alliance consolidated the conservative vote around current President Jair Messias Bolsonaro.\n\nThe nation, weakened after the Three Great Crises, waits exhausted, divided, tense, and holding its breath, §Yfor this will not be an ordinary election, but the reckoning of the Brazilian population.§!"
 # - Interim
 BRA_elections_not_over_yet: "It's Not Over Yet"
 BRA_elections_not_over_yet_desc: "The 2022 elections have concluded, and the Brazilian Patriotic Alliance, along with Bolsonaro, was defeated by a narrow margin, with Lula and the left winning what is being described as the most fraudulent Brazilian presidential election since the beginning of the century.\n\nThe APB headquarters in Brasília is the scene of astonished silence and restrained anger, with employees who worked day and night on the President's campaign staring at the TSE screens showing the final results, organisers walking in circles without a clear direction, contemplating a million possibilities of what might happen from now on. President Jair Bolsonaro himself is in absolute media silence, giving no interviews or congratulating the elected Lula da Silva.\n\nThe defeat serves as a punch in the stomach after months of momentum, massive rallies, and a first-round victory, but surrender is not part of the President's vocabulary, nor that of his supporters.\n\nThe Right has not surrendered easily before, and it's not now that they will."
 BRA_assemble_emergency_meeting: "Assemble an Emergency Meeting"
 BRA_assemble_emergency_meeting_desc: "With only a few weeks left before Lula da Silva's third inauguration, Bolsonaro needs to act quickly if he wants to prevent the country from falling into the abyss again. He summons his inner circle-comprising his eldest sons, high-ranking generals, deputies, and loyal politicians-for an Emergency Meeting kept secret from the general public, the judiciary, and Congress to discuss the validity of the election results, whether they will accept them or not, and how they will deal with the incoming government."
 BRA_rally_the_protesters: "Rally Our Supporters"
 BRA_rally_the_protesters_desc: "\"They tried to silence the voice of a hopeful Country. Tried to extinguish the light that made us believe again, that Brazil still has a chance.\"\n\n§YThey failed.§!\n\nThroughout Brazil, the streets are filled with green and yellow flags, shouts of \"Lula Ladrão, Seu Lugar É Na Prisão!\" and \"Fraud\" fill the ears of the corrupt who robbed the Captain of his second victory and the scoundrels that supported the fraud.\n\nIn São Paulo, Rio de Janeiro, Curitiba, Belo Horizonte, and countless other cities, patriots take to the streets by the thousands, whether they are truck drivers blocking highways, family men dressed in flags and with love for the country shouting, or honest workers, all united to overthrow once and for all the regime that is once again trying to prevent Brazil from progressing.\n\nThe Captain, in the Planalto Palace, addresses the nation, refusing to admit the fraud that took over the ballot boxes, encouraging all good, honest citizens to take to the streets to fight for what is right.\n\nThe defeat in the election was never the end, nor the end of the Right, the True National Awakening has just begun."
 BRA_secure_our_allies: "Secure Our Alliances"
 BRA_secure_our_allies_desc: "Bolsonaro's term is drawing to a close, and the APB faces a crucial decision. The coalition that brought the right to near victory in 2022 remains as it was, but the defeat has created cracks, resulting in the beginning of what could be the fracturing of the Right. Some blocs, whether smaller parties, evangelical groups, or even moderates, are considering shifting to the centre, negotiating with Lula and his coming government, or even leaving the coalition to preserve their positions.\n\nIt is imperative that we do not allow this to happen, as it would further weaken the conservative bloc, making it increasingly difficult to defeat Lula in a possible 2026 election. Therefore, securing our alliances at this moment must be the number one priority, Bolsonaro and the APB need to keep their allies close through constant contact, promises of future benefits, and support in future state and general elections."
 BRA_form_the_opposition: "Form a Steadfast Opposition Bloc"
 BRA_form_the_opposition_desc: "Lula's victory was narrow and hard-fought, securing him the presidency but not a majority or absolute power. Despite being demoralised, the APB will not dissolve with the end of his government, transforming itself into a unified, aggressive, and constant opposition bloc, ready to become a thorn in the side of the new government and promising to oppose every step Lula attempts to take.\n\nThere will be no hesitation, no history of \"voting according to what is right.\" Lula is evil, an evil that robbed the country of two decades of progress and intends to rob it again. Therefore, we will keep him under constant pressure and force him to take drastic measures, uniting to block anything they try to pass in Congress.\n\nEvery broken promise, every political failure, every scandal will have its exposure maximised, with the aim of eroding Lula and his popularity so that, in 2026, he suffers the greatest humiliation of his political career."
 BRA_elections_love_triumphs: "Love Triumphs!"
 BRA_elections_love_triumphs_desc: "After months of arduous campaigning in a highly hostile and polarised environment, Luís Inácio Lula da Silva and the Brazil for Hope Federation emerged victorious in the second round of elections, to the relief of Brazilians. The narrow victory over Jair Messias Bolsonaro and the right-wing Brazilian Patriotic Alliance marks the return of the left to the Planalto Palace after losing in the impeachment of Dilma Rousseff.\n\nHowever, despite the relief and satisfaction that have taken over the minds of workers and the people, it must be recognised that the victory was close and that, precisely because they are now defeated, the Bolsonaro supporters will become more violent than before. Congress remains a divided stage, and the nation's economy, having suffered from the President's mismanagement and denialism in the face of so many crises, remains fragile.\n\nOne way or another, the victory marks a historic turning point for the nation and the left. Lula's third term will require balance, patience, and composure - something the Workers' Party leader possesses in abundance."
 BRA_assemble_the_cabinet: "Assemble Our Cabinet"
 BRA_assemble_the_cabinet_desc: "With victory in the elections secured, the first and most urgent task is to form the new government. The FBE coalition, which encompasses different blocs - including PT members, moderate leftists, centrists, and left-wing nationalists - helped defeat the wannabe Pinochet. However, this same coalition is now complicating the formation of a cabinet, with different sides demanding representation and favours.\n\nNegotiations for the distribution of ministries and secretariats are underway, seeking to keep our allies well-off while not diluting Lula's authority or alienating any of the factions. It is important to recognise the tone of our administration according to the figures placed in different portfolios, seeking a face of pragmatic progressivism. Each chosen name will be meticulously analysed, whether from the most moderate or most radical wing of the federation."
 BRA_draft_budget_plan: "Draft a Budget Plan"
 BRA_draft_budget_plan_desc: "The first budget under the approved Fiscal Framework, a law that imposes spending limits while allowing flexibility in social investments. Drafting this plan is the first and true major test for the new administration, needing to balance the necessity of keeping campaign promises, such as expanding Bolsa Família, the SUS, and other social programmes, with fiscal responsibility, aiming to satisfy the market and investors."
 BRA_address_protests: "Address the Protests"
 BRA_address_protests_desc: "As expected and commented on by many, supporters of President Bolsonaro took to the streets in protests following his defeat, alleging \"electoral fraud.\" However, these same demonstrations escalated into disturbances for the authorities and the general public, with highways blocked by truck drivers, barricades set up in urban centres, clashes between Petistas and the Bolsonaristas, and reports of looting and violence in various capital cities.\n\nIt is necessary for Lula to at least comment on the incidents, condemning the violence and extremism on both sides in various publications and official statements, and conveying the message that, despite the setbacks, peaceful protest is a citizen's right and should be supported, but that disruption and vandalism are nothing but anti-democratic and criminal acts."
 BRA_prepare_the_inauguration: "Prepare the Inauguration"
 BRA_prepare_the_inauguration_desc: "Lula's inauguration is merely weeks away. The Planalto Palace, still under Bolsonaro's control, is surrounded by tight security forces, including military police, federal troops, snipers on rooftops, and drones flying overhead. The traditional January 1st ceremony of handing over the presidential sash is being planned with not the same caution and care as before, being rather more stricter and more planned.\n\nAmidst the violent protests and radicalism present in the nation, Brazil holds its breath. This time, the ceremony will be more than just an event; it will be a test to gauge Brazil and see if it can still achieve a peaceful and democratic transition after months of accusations of fraud, protests, and opposition rhetoric reminiscent of civil war."
 # - Civil War Phase One
 BRA_the_south_burns: "The South Burns"
 BRA_the_south_burns_desc: "The Captain, after having his re-election fraudulently stolen by the gang of socialist bandits, rightfully stood up, declaring that the results would not be accepted and that the outcome had been forged.\n\nHowever, things spiraled greatly. After Operation Punhal Verde e Amarelo, the declaration of State of Siege, the creation of Military Commands, and the Army's failure to contain the protests in non-lethal ways resulted in the collapse of Brazil, with militias and terrorists rising up, taking over our cities and terrorizing the good people of this country.\n\nEven within the Brazilian Army, subversive elements, claiming to be fighting for the \"Constitution and for Democracy,\" rebelled against the Fatherland and declared they would no longer follow President Bolsonaro's orders.\n\nNow, the time for peace is over. To save Brazil from the hands of terrorists and the sons of Cuba, Bolsonaro must stand before the nation and work hard, not for himself, but for §YGod,§! §GFatherland,§! and §BFamily!§!"
 BRA_brazil_above_all_focus: "Brazil Above All"
 BRA_brazil_above_all_focus_desc: "Brazil finds itself in the midst of the greatest moment of chaos in the country's history, with traitors, militias, and terrorists having revealed themselves after months of internal turmoil, now having taken control of our beloved and longed-for cities, hunting down the good citizens of this country with weapons and knives, throughout the nation.\n\nIn this hour of despair, our children find themselves cornered by neo-Nazi murderers, degenerate communists, and terrorists, huddled in their homes in fear, waiting for our arrival. The Brazilian people need a purpose, a call to unite those who are with us and who will never leave us.\n\nAlways, always, since the beginning of the history of this beautiful homeland, Brazil has overcome every challenge it has faced, never having suffered a defeat, while other countries, in South America or elsewhere, have all failed at some point or in some way.\n\nNot us. Not by luck, nor by coincidence, but for one reason: Brazil is a beloved, acclaimed, and adored country, Brazil is above all."
 BRA_god_above_everyone_focus: "God Above Everyone"
 BRA_god_above_everyone_focus_desc: "Brazil is on the brink of the abyss, with social chaos threatening to consume both the nation and its population. In this moment of extreme trial, it is our duty to proclaim the One who saved His people in their most difficult time, the King of kings and Lord of lords, the Savior of Humanity, Eternal Light, and Source of all strength, Jesus Christ of Nazareth.\n\nThe teachings of Jesus Christ and the guidance of the Holy Bible have instructed us from the beginning on the importance of unity and faith that God will save the righteous and punish the wicked.\n\nIt is our duty, and that of all His followers, to spread the Creator's message throughout the nation and to all these suffering people, remembering that order emanates from righteousness, family, and obedience to the Creator, and that, no matter how difficult the present moment may seem, following Him will lead to peace and something greater and better than the current suffering, for only He can guide Brazil out of all this darkness."
 BRA_our_traditional_families: "Our Traditional Families"
 BRA_our_traditional_families_desc: "The collapse of the Brazilian nation amidst various militias and terrorist groups has torn apart the fabric of Brazilian society, separating families, leaving thousands of children orphaned, and bringing traditional values down, ridiculed, and abandoned amidst societal chaos.\n\nOur soldiers and those who support us are currently alone, with morale at its lowest point amidst the destruction of their beloved homeland. Therefore, it is essential that we mobilise them and remind them that there is still something worth fighting for:\n\nThe familiy. Their father, mother, and children."
 BRA_our_onbowing_liberty: "Our Unbowing Liberty"
 BRA_our_onbowing_liberty_desc: "Brazil finds itself amidst the wreckage of a nation torn apart by division, extremism, and the ambitions of dictators, yet the beloved flame of freedom has not yet been extinguished. In this time of trials, the people need to remember what they truly fight for and what they risk their lives for.\n\nFreedom defines us as a people, as a nation, and as a society. Whether it is freedom of expression, freedom of property, freedom of work and commerce, freedom is what constitutes a healthy society and what keeps it in a good shape.\n\nHowever, in recent years, this concept has been erased by degenerates and bandits who, driven by selfish motivations, wished and still wish to enslave citizens with the chains of socialism and censorship. Our duty, then, is to undo this dirty process and remind everyone, from the most common to the wealthiest citizen, that freedom is non-negotiable."
 BRA_prepare_for_the_worst: "Prepare For the Worst"
 BRA_prepare_for_the_worst_desc: "The situation, needless to say, is grave. The Three Great Crises, along with the Second American Civil War, the near collapse of the economy, and the collapse of the agribusiness, have awakened the worst in everyone, leaving the country vulnerable and on its knees to extremists and the worst kinds of people.\n\nAs much as we might like it, hope is something that is becoming more distant every day, and preparing for a large-scale civil war scenario is necessary, even though that is the last thing we want for the country.\n\nWith this in mind, stockpiling fuel, food, medicine, and ammunition becomes more than essential to position ourselves above our potential enemies, storing these stocks in safe locations away from the general population. Furthermore, military installations, water treatment plants, communication centres, urban centres and key-food chains will receive increased defence, with evacuation routes in case of bombing and direct confrontation."
 BRA_start_negotiations: "Start Negotiations"
 BRA_start_negotiations_desc: "The subversives and traitors of the so-called \"Legalist Army\" maintain their positions, with tension and the risk of a widespread civil war increasing by the minute. But, although the advantage of striking the enemy first is still available, it is necessary that we attempt to end this rebellion peacefully before it consumes the nation entirely.\n\nTherefore, negotiations will be initiated with the Legalists, sending emissaries to meet with rebel commanders, offering amnesty and pardons to those who lay down their arms, guarantees of fair trials, and promises of concessions to those willing to return to order and abandon the idea of rebellion.\n\nIn these meetings, Brasília seeks peace, not revenge or attack, but makes it clear that in case of refusal, it will not hesitate to proceed with military action."
 BRA_rally_the_army: "Rally the Army"
 BRA_rally_the_army_desc: "With the risk of the mutineers crossing the red line, actively attacking our forces, and the danger of civil war becoming a reality, it is extremely necessary that the Armed Forces, the country's last guarantee of order, be mobilised. Therefore, it becomes necessary to summon what remains of the Brazilian Army, loyal generals, regional commanders, and soldiers of all ranks, whether on active duty or in the reserves - all those who fight for freedom and for the salvation of the Brazilian Nation from the hands of the worst scum on Earth."
 BRA_promise_order_and_stability: "Promise Order and Stability"
 BRA_promise_order_and_stability_desc: "Everywhere, the population is agitated; the danger of a civil war and stories of massacres across the nation spread like wildfire, causing fear to grip into the minds of millions of citizens who see beyond the Legalist rebellion, knowing that the situation puts everything built up in recent decades, or even longer, at stake.\n\nIf we want to preserve stability within our territories and avoid even more disgrace to our nation, it is necessary to address the Brazilian people directly with a clear and unequivocal message:\n\n§YOrder and stability will be restored.§!"
 BRA_prepare_our_diplomats: "Prepare Our Diplomats"
 BRA_prepare_our_diplomats_desc: "While military preparations continue and the population mobilizes and prepares for war, Brasília must remain open to the difficult, yet possible, path to a peaceful resolution to the rebellion. Therefore, a diplomatic envoy, composed of diplomats, legal experts, and trusted intermediaries, will be formed and placed on standby in case the Loyalists demonstrate any willingness to negotiate.\n\nDespite having a chance of almost zero, we guarantee that if the rebels are willing to cooperate, we will seize this opportunity, for the good of Brazil, in addition to serving in showing our goodwill in seeking the best for the Brazilian population, even if we are dealing with traitors of the worst kind."
 BRA_stabilize_the_situation: "Stabilize the Situation"
 BRA_stabilize_the_situation_desc: "After months of tense standoffs and a feeling that a civil war was inevitable, the negotiations brokered by our diplomats were successful, with the traitors surrendering and retreating under the threat of our overwhelming forces and the favourable terms presented in the negotiations, along with the risk of losing and suffering worse consequences than they could bear.\n\nWhat could have become a bloody civil war, one that would have devastated the country for years to come, was avoided through diplomacy and the assurance to the rebels that if they resorted to force, the situation would end in the same way, only with more serious consequences for them and their comrades.\n\nWith the rebellion leaders placed under house arrest, waiting for judgment, the long and arduous process of stabilising the country begins, along with efforts to cleanse the nation of the terrorists who remain a threat in other parts of the country."
 BRA_fortify_brasilia: "Fortify Brasília"
 BRA_fortify_brasilia_desc: "The Legalists rejected all our peace proposals, all offers of amnesty, and all the problems we were willing to take to de-escalate the situation. Their refusal to back down left us no choice but to engage in armed conflict.\n\nWe turn our eyes for a moment to our capital, Brasília, which is exposed, with its wide avenues facilitating motorized advances, and possessing a perimeter too vast to be defended by the forces currently in the city making it easy to enter and conquer the region.\n\nMore than ever, Brasília must be transformed into a fortress before the first boot of the traitors sets foot on our territory.\n\nWith anti-vehicle trenches encircling strategic areas, sandbags and walls erected to protect important buildings and military posts established along different access lines, the armed forces will go to the city in huge numbers, positioning themselves in strategic locations so that if the enemy arrives, they will get killed before they can even see what caught them.\n\n§RThe worst has happened. Peace has been attempted multiple times; with it out of our way, we will make sure they regret having refused our terms.§!"
 BRA_danca_das_cadeiras: "The Political Musical Chairs"
 BRA_danca_das_cadeiras_desc: "The Brazilian Patriotic Alliance was dissolved after the signing of the National Salvation Law III, scattering its remnants across the political landscape. What once presented itself as a solid and unified bloc under the figure of Jair Messias Bolsonaro has now formed rival and opposition blocs, each claiming legitimacy within the government and offering a different vision for Brazil's future.\n\nThe government finds itself in a delicate situation to manage, a power struggle, trying to balance the situation so as not to spiral out of control, hoping that in the end, one of the coalitions will consolidate enough political power to control the government and eventually come to power."
 BRA_God: "GOD"
 BRA_God_desc: "The United Christian for Brazil Front stands out as the religious bloc within Bolsonaro's government, a large and influential group composed of evangelical leaders, conservative Catholics, and religious voters. For them, the nation should be shaped on explicitly Christian principles, defending life from conception, preserving the traditional family, and opposing the moral decay imposed by the globalist-satanic elites.\n\nWith their platform focused on religiosity and religious issues, FCUB members advocate for the complete eradication of the secular state, the criminalisation of abortion, restrictions on gender ideology, mandatory prayer times in schools, biblical teachings, and the recognition of Christianity as the official religion of Brazil."
 BRA_prosperity_theology: "Prosperity Theology"
 BRA_prosperity_theology_desc: "True prosperity comes solely and exclusively from conformity and submission to the will of the Creator.\n\nThis message must be spread everywhere. Billboards, radio sponsors, social media posts, television stations, in addition to the expansion and promotion of purchases that spread our messages through sermons. All beings in this nation and every space will know the prosperity that comes to those who surrender to Jesus Christ, all the good that flows into the lives of those who kneel before Him, whether this prosperity is financial, spiritual, or mental."
 BRA_denounce_godless_traitors: "Denounce the Godless Traitors"
 BRA_denounce_godless_traitors_desc: "The civil war, besides being a conflict based on ideologies and wills, is something spiritual. A struggle of the forces of Christ against the demonic parasites that passed from the infernal world to ours after the opening of the Gates to Hell.\n\nHordes of atheists and Christ-haters who sold their souls to secularism, globalism, and diabolical leftist heresy are those who command and compose the so-called \"Legalist Army.\" Many are unaware of this because our message does not focus on it; this must be reversed. All citizens of the Brazilian nation must know what we are truly dealing with in this war."
 BRA_protect_christian_values: "Protect Christian Values"
 BRA_protect_christian_values_desc: "In these times of trial, moral confusion, social breakdown, and war, Christian values are under constant attack, whether from degenerate communists or bloodthirsty atheists. The government must act firmly to protect and promote these principles that have guided Brazilians for so long and enabled this nation to survive many past turbulences.\n\nNot only in words, but also in public policies, such as the general banning of the murderous practice of abortion, the defence of marriage, ensuring the spread of Christianity in schools and workplaces, and supporting religious initiatives that, in these difficult times, ensure that many people receive aid, food, and shelter.\n\nMany empires and nations, since the time of Jesus Christ, have claimed to be the \"destroyers of Christ.\" All have failed miserably. Now that the gates of Hell have been opened, with the worst kinds of demons-communists, terrorists, atheists and neo-Nazi pagans-coming to these lands, it is our duty to ensure that the tradition of our ancestors continues."
 BRA_gods_chosen: "God's Chosen"
 BRA_gods_chosen_desc: "The myth, Captain, chosen by God to govern the Brazilian nation, Jair Messias Bolsonaro, a name known throughout this sacred homeland and by all who live in it, whether terrorists or good people.\n\nHe came to this land not to govern it, nor to be just another bureaucrat like the old corrupt sellouts that we called politicians of the Centrão; he came to liberate Brazil from chaos, to lead the nation and its people against corruption and the red tyrants. His legacy remains forever, and we must constantly remember who he truly is and his deeds for the fatherland."
 BRA_condemn_secularism: "Condemn Secularism"
 BRA_condemn_secularism_desc: "The Legalists, traitors to the Fatherland and to Jesus Christ, have further revealed the extent of their hatred and heresies. They are demons, servants of Satan who do nothing but despise the Christian faith - which has sustained Brazil since its inception - and the values that unite this nation as one people.\n\nTherefore, the truth must be revealed to those who do not see the terrorist movement for what it truly is: secularists, degenerate lackeys of the fallen angels who fight to devour Brazil through their sodomy and infernal disgrace. Through radio broadcasts, shared videos of sermons in churches, billboards, pamphlets, and social media videos, all of Brazil will know the true face of the Legalists."
 BRA_with_the_lord_as_our_guide: "With the Lord as Our Guide"
 BRA_with_the_lord_as_our_guide_desc: "Brazil stands on the brink of a precipice, facing the choice between rebirth and ruin, being destroyed by criminal factions, marked by war and secular degeneration. However, the strength we possess is not solely due to the Army or President Bolsonaro, but to Jesus Christ of Nazareth.\n\nWe are a nation under God, made and blessed by Him.\n\nSince the inception of this homeland, we have been blessed by the Lord, called to live according to His teachings and to fight for His flag and no other.\n\nThe chaos of war and the degeneration of secular demons have not prevailed before, and will not prevail now. With the power and authorisation of the Lord, we unite every Brazilian in a greater purpose: to defend the Fatherland, protect the vulnerable, and build a nation worthy of Your blessing.\n\nFor the cross is our shield, faith our sword, and the Lord our guide."
 BRA_the_image_of_the_cross_shines: "The Image of the Cross Shines"
 BRA_the_image_of_the_cross_shines_desc: "The United Christian Front for Brazil has successfully consolidated its influence within the government, marking the first step towards a long-term national plan based on Christ, the Bible, and faith.\n\nReligious leaders, both evangelical and Catholic, occupy important advisory positions, seats in Congress, and other key roles in shaping the country, influencing and creating policies on education, family, life issues, and morality according to the Lord's will.\n\nThrough the storm that Brazil has become, the image of Jesus stands out again, strengthening the regime's legitimacy among the faithful, deepening the Church's support, and signalling that, after a long time, the Lord and Christianity are no longer treated as one option among many, but as the only light, the true Light that will guide Brazil to its future.\n\n§nBrasília, illuminated by the Cross, bears the weight of bringing the country back to normality and common sense.§!"
 BRA_Homeland: "HOMELAND"
 BRA_Homeland_desc: "The Homeland Salvation Front stands out as the military bloc within Bolsonaro's government. An influential and large group of generals, veterans, public security experts, and patriots who see the Civil War for what it is: a struggle between lovers of the nation and the hordes of imbeciles who preach the end and destruction of the country.\n\nUnwavering, the patriots preach that the nation must be defended by a strong and disciplined army, with its population willing to serve, suffer, and die in service to the Fatherland.\n\nDefending the armed forces, they advocate prioritising national defence, with more rigorous and extensive military training, education teaching what it means to be a patriot in schools, and saluting the Brazilian Army as the saviours they truly are, having saved the country from communism once, and fighting to save it again."
 BRA_protect_the_young_minds: "Protect the Minds of the Youth"
 BRA_protect_the_young_minds_desc: "The youth of this country are the future, those who will decide what will happen to this nation. However, in this moment of difficulty, the young are vulnerable and exposed to the chaos of war, the poison of pagan and secular ideologies, and all the moral confusion that has led to the destruction of Brazilian society.\n\nTherefore, the eyes and ears of our youth must be closed so that the parasites who occupy this nation are unable to spread their lies and parasitise the minds of our children with their corrosive ideas."
 BRA_vanquish_progressivism: "Vanquish Progressivism"
 BRA_vanquish_progressivism_desc: "Progressivism, a disease that attempts to proliferate in every nation to drain the blood of its people until it destroys the identity and pride of the country.\n\nIn Brazil, it has dominated for far too long, forcing its corrosive and destructive ideologies down the throats of our population through Paulo Freire's Education, attacks on the traditional family, demonisation of our past, and the enslavement of entire chunks of our people through the so-called \"social programs.\"\n\nIt is more than necessary that, to restore order to this country, we throw this ideology and these thoughts into the rubbish heap where they belong. We will liberate the minds of the population so that they may see the damage that has been inflicted upon them all these years and all that has been stolen from them."
 BRA_instill_patriotic_values: "Instill Patriotic Values"
 BRA_instill_patriotic_values_desc: "The Civil War tore Brazil apart, exposing deep divisions and severely weakening the sense of shared identity that once united the nation. Many Brazilians, in different parts of the former territory, view the flag with disgust, feeling revulsion for a homeland that, for them, abandoned them and robbed them of their futures.\n\nPatriotism has turned into cynicism for many, seen as something to be fought by the scum of the country or been hijacked by insurgents.\n\nDespite being the most delicate moment in this country's history, it also serves as a moment of great opportunity. War, suffering, strong emotions-all force a person to confront what they are willing to sacrifice for, what they are willing to sacrifice themselves for, and what they truly love about their homeland.\n\nIt is important that we take advantage of this moment to awaken and rekindle patriotic sentiment in the population, promoting public campaigns celebrating our most prestigious symbols, military ceremonies, oaths to the flag, and the promotion of heroic stories of our citizens who risk their lives for the Fatherland in this difficult time."
 BRA_our_glorious_heroes: "Our Glorious Heroes"
 BRA_our_glorious_heroes_desc: "Contrary to what many believe, Brazil is rich in heroes-men and women who fought for the nation's independence, defended it in wars such as the Paraguayan War and World War II, built its institutions, and sacrificed themselves for the common good.\n\nHowever, thanks to the scoundrels who governed this nation, many Brazilians grew up without ever hearing of these figures or seeing them as mere names with forgettable significance in their schoolbooks.\n\nThe current moment demands that we change this situation. The glorious men and women who died for this nation should not only be remembered but also exalted, celebrated, and used as role models for a suffering people who, in this delicate moment, so desperately need figures to lean on.\n\nTiradentes, Dom Pedro I, the highly intelligent and wise Emperor Dom Pedro II and the Patron of our Armed Forces Luís Alves de Lima e Silva are just some of the greatest figures in this country's history. All will be celebrated, their stories taught, and statues erected in their honour.\n\nWith glory and reverence, their names will be remembered and celebrated by generations to come."
 BRA_your_children: "Thy Children"
 BRA_your_children_desc: "The Homeland Salvation Front consolidated its power and influence within the government, marking the first step towards a long-term project based on the Homeland, Patriotism, and Nationalism.\n\nThe bloc, composed of generals, veterans, security experts, and patriotic civilians, now occupies important seats in Congress and advisory positions to the president and other key roles in shaping the country, enabling them to influence and shape the country according to their vision, without significant opposition from other blocs.\n\nIt is clear what needs to be done. Not only to manage security policies, education, and civic training, but also to create a generation that sees service to the Fatherland as the noblest of vocations to follow.\n\n§GOnce again, the armed forces saved Brazil from the clutches of communism and degeneration, now capable of forming citizens who love their own nation, who understand what it means to be Brazilian, and who understand sacrifice, loyalty, and the price of freedom.§!"
 BRA_Family: "FAMILY"
 BRA_Family_desc: "The Brazilian Family Front stands out as the conservative wing within Bolsonaro's government, a large and influential group of family defenders, evangelical leaders, rural workers, and traditionalist voters who fight to restore morality and sanity in the country.\n\nUnwavering in their convictions, they defend the Traditional Brazilian Family, considering it the first line of defence against chaos and the bastion of morality in society. However, they don't just talk the talk; they firmly support policies that protect and promote this model, whether through tax incentives, restrictions on abortion and gender ideology, and campaigns that promote the family for what it is: the foundation of stability."
 BRA_return_family_control: "Return Family Control"
 BRA_return_family_control_desc: "The charlatans in other regions of our beloved country call themselves \"defenders of the family,\" but who were those who, for so long, sacrificed everything they had to defend the family, traditions, and freedom? Who, in the face of socialist thugs, cried out for freedom of expression? Who took to the streets countless times calling out the scum for what they are, even at the risk of imprisonment?\n\nUs.\n\nIn the face of danger, only the patriots and the good citizens rose up against the totalitarian regime that aimed to implant communism in our country. Even when imprisonment was certain and guaranteed, it was only the patriots who filled the streets throughout the country demanding the impeachment of the thief's puppet Dilma Rousseff. If it weren't for us, the country would be under the same scoundrel that tried to rob the future out of this Nation.\n\nThe population must be reminded of this."
 BRA_the_immoral_vanguard: "The Immoral Vanguard"
 BRA_the_immoral_vanguard_desc: "Those who subverted all the healthy values a nation needs to survive, those who indoctrinated the population with their corrosive ideas such as Christophobia and gender ideology, who drained the nation of its money and who tirelessly worked to erase this nation's glorious past, are now trying to return to power again after failing to steal the elections.\n\nThe Legalists, the Vanguard of the Dirty and Immoral, are fighting to steal from the Brazilian population once more, to fill their pockets with the hard-earned money of Brazilians, all while defiling the culture and history of this nation.\n\nHowever, by stealing the elections and initiating the civil war, they committed the biggest mistake of their lives, because their filth was exposed to everyone. They will be destroyed, and this time, we will make sure that their filthy ideas never touch Brazil again."
 BRA_safeguard_traditional_values: "Safeguard Traditional Values"
 BRA_safeguard_traditional_values_desc: "The Civil War and its consequences for society violently erode traditional Brazilian values-respect for authority, family, discipline, and national pride-replacing them with demonic ideologies, cultural and moral degeneration, the ridicule of Christianity, individualism, nihilism, and many other values that go against everything that constitutes a healthy society.\n\nWe must act firmly to safeguard and cultivate the values we defend, promoting campaigns emphasising the roots of each citizen in these lands, the structure of the nuclear family, and respect for relatives and elders.\n\nIn this delicate moment, fuelled by constant propaganda promoted by the worst kinds of human beings this land can offer, it is extremely important that we become a shield for our children, families, and all those made vulnerable by this storm."
 BRA_defenders_of_families: "Defenders of Families"
 BRA_defenders_of_families_desc: "The Brazilian family is the most important pillar of this nation. Its strength determines the strength of the nation, and its love determines the love of its children. However, this pillar is under attack; war, the collapse of the Brazilian economy, cultural changes, and information warfare have placed, and continue to place, immense pressure on families.\n\nIt is of paramount importance that we address this problem and position ourselves as an iron wall in defence of the family. By focusing public policies on this issue, we must promote mothers who, in these times, sacrifice great things for their families, fathers who have left their homes in service to the nation, and the resilient children who, exposed to so much violence and extremism, remain loyal to their families and the nation."
 BRA_gentle_mother: "Gentle Mother"
 BRA_gentle_mother_desc: "The Brazilian Family Front has successfully consolidated its influence within the government, marking the first step towards a major long-term project to build a society that values traditionalism, the Brazilian Family, and conservatism.\n\nReligious and conservative political leaders now occupy the majority of seats in Congress and key positions in President Bolsonaro's advisory team, enabling them to influence and create public policies that focus on valuing God, the Fatherland, and the Family.\n\n§PThe mother, the nurturing force and foundation for raising responsible and disciplined men, will be valued and celebrated for all that she does and for her crucial role in Brazilian society.§!"
 BRA_Liberty: "LIBERTY"
 BRA_Liberty_desc: "The Freedom and Prosperity Front positions itself as the liberal bloc within the Bolsonaro government, composed of diverse individuals including free-market advocates, entrepreneurs, classical liberals, defenders of individual rights, and supporters of freedom of expression, all united by the vision that economic freedom is what makes money - the engine of the nation - work.\n\nUncompromising, the group's platform includes the liberalisation of private enterprise, significant cuts to excessive taxes, the privatisation of state assets, and the protection and expansion of property rights against appropriation. Attracting urban professionals, tech-savvy minds, agribusiness, and young voters disillusioned with failed economic models, the bloc fights for Brazil to free itself once and for all from authoritarian chains."
 BRA_clean_governance_free_populace: "Clean Governance, Free Populace"
 BRA_clean_governance_free_populace_desc: "After many years of corrupt governments and presidents who only thought about raising taxes and stealing from our people, Brazilians have put a stop to all the thievery and are now fighting to end corruption once and for all.\n\nFortunately for citizens, we are not like the thieves who governed this nation before, and finally, citizens can breathe fresh air, knowing that they live in a country free from excessive bureaucracy, unnecessary regulations, and abusive taxes, all while maintaining their individual freedoms."
 BRA_wardens_of_stagnation: "Wardens of Stagnation"
 BRA_wardens_of_stagnation_desc: "Brazil's reputation as a country rife with corruption and \"where crime pays\" didn't happen by chance nor coincidence. The Legalists, warriors of disgrace and corruption, are composed of the same people who bloated the bureaucracy of this nation, corrupted its institutions, and suffocated the country with regulations and taxes.\n\nThey are the ones who swear to fight for \"a better Brazil,\" but the true face of their struggle is to chain Brazil once again to a failed and miserable future. We must expose this truth to the entire population, not only in our territories but also to all those who live under the control of insurgents, terrorists, or allies in other regions."
 BRA_keep_entrepreneurs_coming: "Keep the Entrepreneurs Coming"
 BRA_keep_entrepreneurs_coming_desc: "One of the first areas affected by the Three Great Crises was the economy, and the flight of investors was immense, even more after the beginning of the Civil War, causing irreparable damage to the short- and medium-term economy. If we want to restore this nation someday, we must not let innovation and entrepreneurship die.\n\nEven with the Brazilian market under unprecedented pressure, it is of utmost importance that the government keeps investors engaged as much as possible, expanding tax incentives for small businesses, reducing regulations to allow for faster and cheaper business openings and operations, and prioritising those that create jobs and produce goods that the nation so desperately needs."
 BRA_protect_civil_liberties: "Protect Civil Liberties"
 BRA_protect_civil_liberties_desc: "The destruction caused by the war has created fertile ground for fear, with many civilians within our territories fearing that the Government and Bolsonaro will use the crisis as a pretext to implement authoritarian measures. However, this idea will not only be rejected, but must be reversed, transforming it into the idea that, even in times of crisis, the Government can maintain freedoms for its citizens.\n\nFreedom of expression, assembly, and association-debated as being the first things that should be suppressed-will be vigorously defended. More than necessary, we will prove to the people that we fight for principles that make a nation worth defending, something that the insurgents and terrorists sorely lack."
 BRA_sun_of_freedom: "Sun Of Freedom"
 BRA_sun_of_freedom_desc: "The Freedom and Prosperity Front has successfully consolidated itself as an influential and majority political force within the Bolsonaro government, marking the first step towards a long-term project to create a freer, richer, and more developed Brazil.\n\nInvestors, liberal politicians, and strong advocates for individual liberties now occupy the majority of seats in Congress and important positions advising the President, allowing them to influence, create, and shape public policies that favour individual liberty, privatisation, and economic freedoms.\n\n§YBrazil's future is bright, a feat achieved by those who are free, dreamers, and ambitious, allowing the nation to walk a path of prosperity, opportunity, and great fortunes.§!"
 BRA_the_patriotic_duty: "The Patriotic Duty"
 BRA_the_patriotic_duty_desc: "\"Onwards, soldiers! Let's fight!\nLife is worthless without glory!\nIf it's needed to die, we will die,\nFor Brazil, For Victory!\"\n\nThe Great Brazilian Homeland finds itself in the most extreme abyss that no person could have imagined. The future of the nation is at stake; what we do, what we think, what we say—everything can determine whether our beloved country will fall into the hands of crazed communists or sadistic Nazis.\n\nEvery citizen matters; it is the duty of those who call themselves Brazilian to serve their nation in its moment of greatest difficulty. From the highest-ranking military officer to the lowest-ranking policeman, all those with a rifle, two legs, and combat capability must answer the nation's call, for this may be the last chance we have to save this country from the most destructive ideologies the planet has ever experienced."
 BRA_empower_the_high_command: "Empower the High Command"
 BRA_empower_the_high_command_desc: "Our armed forces have long lived in peace and comfort, experiencing little to no combat except for the few interventions against organised crime. Now, they face a real war scenario against hordes of determined and crazed terrorists, insurgents, and mutineers, with no other thought than to destroy the last flame of freedom within this country.\n\nTherefore, those wise men, with more experience in combat and military planning than the rest of the government, the High Command, must be given the responsibility of providing all the operational capabilities necessary to lead us to victory, be it the allocation of resources, tactical planning in the theatre of operations, or the ultimate authority in strategic decision-making; the generals will then have the final say on how Brazil should be saved."
 BRA_intensify_military_training: "Intensify Military Training"
 BRA_intensify_military_training_desc: "Infantry, the spearhead of an army and its backbone, without ground troops, no army could sustain a war, let alone conquer its enemies. However, even with infantry, it is imperative that it be composed of strong, healthy men capable of handling anything they may face on the battlefield; something that many of the soldiers present, moulded by years of routine training without a real purpose and extended periods of peace, leave much to be desired.\n\nThe terrorists, armed with whatever they have and fanatical about our destruction, will not be defeated with an army of weak and feeble men. Therefore, if we are true to our objective of winning this war, military training for soldiers must be intensified, focusing on rapid mobilisation, close-quarters combat, counter-insurgency tactics, and combat in large urban centres."
 BRA_strict_doctrine_flow: "Adhere to Strict Doctrine"
 BRA_strict_doctrine_flow_desc: "The Brazilian Civil War is no place for improvisation or insolent adventurism. The wise and experienced members of the High Command know what they are talking about, having spent decades studying and practising doctrines of war and defence. To deviate from or ignore these principles and methods is foolish, guaranteeing us only defeat after defeat, and putting our homeland at risk in the service of idiocies never before tested.\n\nOur soldiers and commanders must be reminded that we are a serious army, and that this war is for winning, not for playing at being combatants. Each operation must therefore follow rigid, established protocols; each plan must be made with war doctrines in mind. Everything must be following an strict, already established Doctrine, for we have no other chance in saving this Nation."
 BRA_focus_on_planning: "Focus on Planning"
 BRA_focus_on_planning_desc: "Enough lives and territory have been lost to discard the idea that risky manoeuvres and rash attacks will get us anywhere. A complex war like this, despite being intense and requiring rapid decisions, is also fought and won with patience and precision; therefore, our generals and commanders must focus on better planning of their offensives and confrontations, shifting from reaction to better calculated operations, even if costing something in the short term."
 BRA_expand_marshal_power: "Expand the Powers of the Marshals"
 BRA_expand_marshal_power_desc: "Field Marshals are what define the High Command; they are those with the experience and authority necessary to put planning into practice and to make the most difficult decisions in moments of greatest uncertainty. However, their capacity is severely reduced by excessive bureaucracy, unnecessary supervision, and differing opinions from their superiors.\n\nIt is essential that, in order for these brave men to have their service capacity maximized, their power be expanded, granting them greater autonomy for operations within their Theaters of Operations, direct access to reserves and logistical capacity, and the authority to allocate and reallocate units without superior authorization."
 BRA_centralize_command_flow: "Centralize the Chain of Command"
 BRA_centralize_command_flow_desc: "Fragmented and decentralized command structures lead only to confusion, delayed responses, and unnecessary and avoidable losses. To operate more effectively, the chain of command must become a single, large, cohesive, and unified entity, located in a central headquarters responsible for maintaining information on logistics, fronts, the internal situation, and different battlefields across the country. This facilitates navigation of current events and allows the High Command to make quick, informed decisions based on what is happening on the front lines."
 BRA_integrate_militias_into_ranks: "Integrate Militias Into the Ranks"
 BRA_integrate_militias_into_ranks_desc: "The greatest patriots and defenders of the nation are not always within the Army, but rather in militias, defending the nation from the worst terrorists without needing to go through the orders of other military personnel or follow the same rules and supervision that regular infantry requires.\n\nProven invaluable to our success, having been responsible for disrupting insurgent supply lines, providing information to commanders about specific regions when regulars were focusing on other areas or filling gaps in the front line; however, their complete independence has led to some problems, such as coordination failures, friendly fire incidents, or uneven discipline, making it difficult to maintain direct contact or plan offensives.\n\nValuable as they are, we cannot miss the opportunity to integrate the militias into the Regular Army, and, with promises of better and more up-to-date equipment, leadership positions in more focused and localized offensives, and greater protection, it is certain that they will accept joining the armed forces as regulars."
 BRA_honroso_exercito_de_caxias: "Honroso Exército de Caxias"
 BRA_honroso_exercito_de_caxias_desc: "\"Bandeira do Brasil, ninguém te manchará\nTeu povo varonil,\nCom isto não consentirá!\nBandeira idolatrada, altivo a tremular!\nOnde a Liberdade é mais uma estrela a brilhar!\"\n\nThrough unimaginable suffering, sacrifices, pain, and hardship, our brave soldiers are worthy of once again being honoured as the greatest military heroes of this nation.\n\nMen whom the Duke of Caxias, Patron of the Armed Forces and the greatest symbol of honour, discipline, loyalty, and unwavering devotion to the nation, could look upon with pride. Our heroes, responsible for maintaining the front line and defending the Fatherland even in the face of the most disgusting and vile types of traitors and terrorists, who, in the face of rebels, raised their chins and stabbed them with bayonets, proved themselves to be sons of Brazil."
 BRA_brief_the_captains: "Brief the Captains"
 BRA_brief_the_captains_desc: "The Polícia Militar is a vital branch of the war effort against rebels and insurgents, imposing and securing order in areas outside the rear, guaranteeing the security of supply lines, protecting civilian populations from criminals and insurgent supporters, and defending major urban centres from infiltrators and lone wolf attacks.\n\nHowever, many Military Police captains operate on the sidelines, forgotten, receiving incomplete information and unclear directives, which lowers their morale and makes them feel that the government is discarding them as if they were merely disposable pawns. To ensure that order within our territories is maintained and that the PM does not become dissatisfied, we must take greater care to provide complete and detailed information to each capital about the situation on the front."
 BRA_relax_rules_of_engagement: "Relax the Rules of Engagement"
 BRA_relax_rules_of_engagement_desc: "Decisive and often difficult actions need to be undertaken to achieve victory, but the rules of engagement, excessively restrictive and outdated in relation to what we are facing, have limited the actions of our forces, allowing insurgents to exploit these loopholes in our hesitations and carry out ambushes or escape reprisals.\n\nWe cannot allow ourselves to be shackled by the chains of \"humanitarian\" doctrines that prioritise caution over victory; making them more flexible is a step towards operating in a manner that matches the reality of what we are dealing with."
 BRA_rally_the_military_police: "Rally the Military Police"
 BRA_rally_the_military_police_desc: "For generations, Military Police have been on the front line of maintaining order in Brazil, preventing organised crime from taking complete control of cities and states and insurgents from proliferating in the past. However, the civil war has placed them in an agonising position, often forcing them to fight and kill their compatriots, former colleagues, and even, in some cases, neighbours who futilely joined the insurgents.\n\nWe must remind each of them that this war is not against neighbours, compatriots, or even friends, but against enemies who are rebels, traitors to the Fatherland who murdered them laughing without a second thought. They chose rebellion. They chose to betray the Fatherland. Their punishment must be death, and coming from someone close, it hurts even more."
 BRA_shock_and_awe: "Shock and Awe"
 BRA_shock_and_awe_desc: "Prolonged fighting undermines morale, wastes resources, and does not always result in victory, allowing insurgents to regroup and fortify themselves. Destroying their morale, will, and minds before combat gives us the advantage of waging a swifter, smoother battle. We must focus on this.\n\nDecisively and swiftly, the Doctrine of Shock and Awe must be adopted to break the minds of the scum that roam our lands. Overwhelming firepower must be used, applied with such precision and consistency, that the minds of the terrorists will not take it, and shatter before we even enter battle."
 BRA_greater_battallion_autonomy: "Greater Battallion Autonomy"
 BRA_greater_battallion_autonomy_desc: "In the chaotic and unpredictable environment in which we find ourselves, communication is not always guaranteed, as it can be cut off or altered by sabotage, terrain interference, and electronic warfare, thereby severing radio and internet connections and leaving entire battalions isolated, waiting for orders with no guarantee of when they will be received.\n\nTo keep our forces informed and to ensure that communication is not disrupted, it is important to grant autonomy to the battalions, allowing their commanders discretion to adapt tactics, exploit loopholes and opportunities, while maintaining a clear mission objective and codes of engagement so that no problems occur."
 BRA_promote_police_officers: "Promote Police Officers to the High Command"
 BRA_promote_police_officers_desc: "Those members of the Military Police who loyally fought to defend the Fatherland against terrorists are true heroes, defending entire cities, securing supply lines, and suppressing rebel cells within our territories. Their loyalty, honour, experience, courage, discipline, and service to the nation should not only be recognised but also decorated and rewarded.\n\nPromoting the most outstanding captains and majors of the Military Police to the high command will ensure that their tactical knowledge, combat expertise, and combat techniques in dense areas such as favelas and large urban centres are highly valuable for our advances and future offensives."
 BRA_allow_independent_militias: "Allow Independent Militias"
 BRA_allow_independent_militias_desc: "The Patriots fighting in the militias have proven to be the backbone of our war effort. Experienced combatants on the ground where they fight, attacking without warning, filling gaps where insurgents could exploit, and not being valued as much by excessive and exaggerated \"rules of engagement,\" make them quick, fierce, and unpredictable warriors, putting pressure and fear on the terrorists.\n\nWe must allow their existence, ensuring that they continue to operate in our territories as autonomous forces, coordinating with the High Command of the Armed Forces for major offensives or joint attacks, but maintaining the freedom for their routine actions and, above all, the freedom to act as they see fit on the battlefield."
 BRA_our_own_national_guard: "Our Own National Guard"
 BRA_our_own_national_guard_desc: "The Military Police and the militias have proven to be formidable forces, exceeding all expectations that the Government and the population had of them, guaranteeing the security of cities against infiltrators, protecting vital supply routes for the troops, and resisting mutineers when regular forces were overwhelmed and forced to retreat.\n\nTheir courage, discipline, loyalty to the Nation, and deep ties with the communities they defend have made them more than indispensable.\n\nThese brave men deserve immense gratitude and recognition from everyone in the Government, worthy of receiving the title and honour of being called the National Guard of Brazil."
 BRA_calling_all_patriots: "Calling All Patriots!"
 BRA_calling_all_patriots_desc: "The abyss that Brazil finds itself in is not insurmountable, but every capable hand in this nation needs to do its part so that we can save it.\n\nThe terrorists, desperate to deal with their problems of mass desertions, constant attacks, dwindling supplies, and more and more men dying, are nothing compared to a united people, and will be easily subdued by the patriots of the entire nation, whether men or women."
 BRA_rethink_supply_lines: "Rethink Supply Lines"
 BRA_rethink_supply_lines_desc: "Logistics is the artery that keeps the rest of the body ready for combat; without it, you are paralyzed, vulnerable to anything the enemy might do to you. The collapse of the country exposed critical weaknesses in our supply lines: overloaded convoys, vulnerable key points, reliance on single routes, and insufficient redundancy in fuel, ammunition, and supplies.\n\nA complete review of current practices must take place, allowing for the identification of gaps in the planning, execution, and protection of routes, thus enabling these gaps to be closed and optimised, sealing our lines so that insurgents cannot even come close to touching them."
 BRA_rails_to_the_front: "Rails to the Front"
 BRA_rails_to_the_front_desc: "Supply lines from Brasília to the front lines against the Legalists have been cut. Tracks destroyed by bombing, stations sabotaged by insurgents, and bridges blown up have made transportation a complex task. All available infrastructure workers must be mobilised to begin construction of a new railway line that will directly link the capital with Bahia.\n\nThe new railway line will be protected and heavily militarised, ensuring that neither the mutineers nor the terrorists can damage or sabotage it, allowing the resources necessary to sustain the war to be sent to the soldiers without major problems."
 BRA_motorized_supply: "Motorized Logistics"
 BRA_motorized_supply_desc: "Roads have always been the cheapest, most flexible, and readily available means of transporting supplies and cargo in Brazil, and this remains unchanged. However, they are also the most vulnerable and exposed to ambushes, sabotage, bombings, and battles; ensuring their safety, protection, and maintenance to supply soldiers on the front lines must be the top priority."
 BRA_air_supply: "Aerial Logistics"
 BRA_air_supply_desc: "Ground fighting has destroyed many land supply routes, turning highways into death zones and railways into battlefields, where the advance of trains is hampered by constant sabotage and ambushes. Only one alternative remains, one that remains reliable for reaching isolated garrisons, outposts in remote areas, or communities difficult to access due to fighting or terrain: the sky.\n\nOur air transport capacity must be completely focused and utilised to deliver ammunition, medical supplies, food rations, and other equipment for the maintenance and supply of our armed forces."
 BRA_race_to_the_sea: "Race to the Sea"
 BRA_race_to_the_sea_desc: "A post marks a turning point in the war. With a coastal position now under our control, it is possible to establish a naval presence and reconnect with the loyal elements of the Brazilian Navy, who for so long were isolated fighting the insurgents and mutineers.\n\nHowever, not everything is good there. The docks are clogged with shipwrecks, destroyed and damaged, and pose the danger of unwanted presence at sea. This must be addressed before we can restore our maritime logistics and slowly tie the final noose around the mutineers' necks."
 BRA_start_air_operations: "Start Air Operations"
 BRA_start_air_operations_desc: "At the beginning of the Civil War, the majority of the Brazilian Air Force aligned itself with the Government and the President, and we will reap the rewards of this loyalty with all its capabilities and equipment being put to use. Air operations must resume immediately, guaranteeing the air superiority of our forces on key fronts, thus facilitating the launch of ground offensives and re-establishing cohesive coordination between ground and air forces."
 BRA_psychological_air_dominance: "Psychological Air Dominance"
 BRA_psychological_air_dominance_desc: "With our superior air presence compared to all the insurgents, we can utilise it not just as a tactical resource, but also as a powerful psychological weapon. When they hear our fighter jets roaring overhead, when they hear the roar of the engines before they see the planes, or when they see the deafening noise of the wind, they will know we are nearby, and that this means the end of their lives.\n\nWithout a single shot being fired, they will surrender with their tails between their legs.\n\nThe mere thought that we dominate the skies fills the minds of traitors with dread, hesitation, doubt, and fear of fighting. Arrogant soldiers who once advanced boldly now fear every sound they hear from above; convoys stop in total silence at the mere sound of jets.\n\nOur most effective executioner is the sky, and with it, the traitors of the Fatherland will come to fear what lies above their heads." 
 BRA_precision_strikes: "Precision Strikes"
 BRA_precision_strikes_desc: "Brazilian lands have already been scarred enough, wounded enough. We will not contribute to further damage. By increasing the precision of our attacks, we can destroy the traitors of the Fatherland with minimal collateral damage to Brazilian soil.\n\nUsing guided munitions, we will facilitate the elimination of high-command posts of the mutineers, the destruction of supply depots and vehicles, and the obliteration of leadership centres, sparing areas frequented by the civilian population."
 BRA_deny_their_roads: "Deny Their Roads"
 BRA_deny_their_roads_desc: "By targeting the destruction of the insurgents' main supply lines to cripple their war effort, the expansion of the surgical strike doctrine becomes inevitable. Highways, bridges, railway junctions, fuel depots, and food depots being the most targeted we can avoid hitting civilian areas all while forcing the terrorists to traverse difficult terrain, extend their supply chains, deplete fuel reserves, and drastically reduce their efforts, so that we can more easily deliver the final blow."
 BRA_restructure_sisbin: "Restructure the SISBIN"
 BRA_restructure_sisbin_desc: "The Brazilian Civil War shattered old assumptions about what a rebellion and rebels would look like. Previously, enemies were portrayed as coming in easily recognisable uniforms—the Communists, the uniforms of the Integralists. It was easy to recognise a threat and suppress it. However, the enemy now came from within.\n\nSubversive cells, corrupt officials, generals and soldiers with familiar faces—people you were once close to.\n\nTherefore, the Brazilian Intelligence System, designed to deal with external and internal threats, no longer fits this new paradigm. It must be restructured immediately and completely, from top to bottom, to meet the demands of war and prevent new traitors from having the chance to thrive, with both the Federal Police and the Brazilian Intelligence Agency being integrated so that investigations against internal enemies are more coordinated and focused."
 BRA_hunt_traitors_within: "Hunt the Traitors Within"
 BRA_hunt_traitors_within_desc: "Within ministries, military units, police forces, and especially among the civilian population, traitors, infiltrators, and subversives are lurking, waiting for the right moment to attack and eliminate us. To their horror, the Federal Police are right behind them.\n\nWatching their every step and breath, the PF are the best weapon we have against those who have infiltrated Jair Bolsonaro's government, instigating terror in anyone who considers lifting a finger against his administration or any other body involved in the war.\n\nThe reins that once held them back no longer exist. Every informant, every deserter, anyone who thinks of challenging the established order and trying to sell information to the insurgents will be found, captured, and will feel the full weight of the state apparatus against their body."
 BRA_expand_abin: "Expand ABIN"
 BRA_expand_abin_desc: "The Brazilian Intelligence Agency is the largest and most powerful investigative resource we possess, capable of detecting subversive agents and traitors long before they become threats to the government. The Civil War revealed the depth to which the insurgents were able to reach with their infiltrations.\n\nTo combat further infiltrations, ABIN must be expanded to its maximum potential, increasing resources, scope, and authority. Its budget should be doubled, reaching the maximum we can invest so that it becomes the most feared agency in Brazil.\n\nIts tentacles will extend to all ministries, all states, all regions on the front line, and within enemy territory.\n\nNever again will another \"Legalist Mutiny\" be allowed to take place on this soil."
 BRA_meddle_in_the_federal_police: "Meddle in the Federal Police"
 BRA_meddle_in_the_federal_police_desc: "The Federal Police have proven their worth in combating subversives and corruption, but their effectiveness and potential are compromised by political loyalties, factional sympathies, and police officers who still harbour doubts about the government and Jair Bolsonaro. To make the Federal Police a truly effective tool, we must strip them of their political biases and align them completely with the administration, whatever the cost; this includes dismissing anyone who needs to be dismissed and reforming anyone who needs to be reformed, regardless of short-term damage."
 BRA_seek_and_destroy: "Seek and Destroy"
 BRA_seek_and_destroy_desc: "We cannot allow insurrections on our territory to persist and escalate. Rebellious individuals and small groups, supporters of the Legalists, clandestine cells, bandits, communists, and other types of terrorists remain within our territories, attacking supply lines, assassinating authorities, and spreading their vile ideas through propaganda.\n\nWe must deal with them before it becomes a Legalist rebellion 2.0.\n\nFollowing the investigations of SISBIN and its branches, ABIN and the PF, special units will quickly identify the threats and neutralise the targets, using whatever method is necessary to purge the cancerous cockroaches from our country once and for all."
 BRA_track_dissident_activities: "Track Dissident Activities"
 BRA_track_dissident_activities_desc: "Anti-government dissidents rarely act alone; they form gangs, networks, sharing resources until the right moment to attack arrives. To discover who the ringleaders of these movements are, and subsequently eliminate them all at once, it is necessary to establish a tracking program to locate and monitor these individuals and suspects.\n\nThen, when a considerable amount of evidence and information is uncovered, and we discover who the ringleaders and chief organizers of these terrorist movements are, we can kill two birds with one stone: the group and its leaders."
 BRA_crush_guerrilas: "Crush Guerrilas"
 BRA_crush_guerrilas_desc: "The guerrillas have spread like weeds throughout our territory, with small groups attacking essential supply points for the army, ambushing patrols, and terrorizing rural communities. The Federal Police, using all its investigative reach and authority, must be employed to eliminate these vermin once and for all, exposing their hideouts and then neutralizing all those who represent even the slightest threat to the State."
 BRA_curb_partisan_propaganda: "Curb Partisan Propaganda"
 BRA_curb_partisan_propaganda_desc: "Our enemies survive through propaganda, flooding radio waves, social media, and the streets with their idealistic filth. Underestimating this is self-sabotaging, generating doubt among the population about the government's actions and recruiting combatants. Therefore, for the good of all citizens, we must pursue and end all types of propaganda for these scum, allowing Brazilians to return to living their lives normally, without worrying about extremists flooding their lives with slogans and empty words."
 BRA_sempre_vigilante: "Sempre Vigilante"
 BRA_sempre_vigilante_desc: "Despite the Federal Police and ABIN working as hard as they can to eliminate the traitors to the Fatherland who insist on sabotaging our territories, the civilian population must also have the will to fight them.\n\nEvery patriotic Brazilian must remain vigilant against possible threats to the state and subversive elements, and, upon identifying them, report them to the nearest authorities and wait to defend their community against the scum of humanity. Strange visitors, unusual and constant gatherings, or the distribution of propaganda should be reported to the police so that order is maintained and the population can once again sleep peacefully."
 BRA_meet_with_landowners: "Meet With the Landowners"
 BRA_meet_with_landowners_desc: "The Midwest, the heart of Brazilian agribusiness and the backbone of the country's food supply, has remained largely loyal to President Bolsonaro and the government, expelling the socialist virus from its farms and defending rural areas from land invaders. The main producers, rural and industrial landowners, are fervent supporters of Jair Bolsonaro and, controlling vast tracts of land producing soybeans, corn, cattle, and sugarcane, an opportunity arises to establish an emergency economy capable of sustaining the fight, the population, and our brave soldiers on the front lines."
 BRA_protect_domestic_production: "Protect Domestic Production"
 BRA_protect_domestic_production_desc: "The landowners of this country are the most valuable economic asset we have in this war. Responsible for agriculture, they produce the basic goods to keep the population and the army well-fed, thus enabling the continuation of the war. However, the collapse of the United States and the subsequent collapse of agriculture still leave its scars, placing them in a position of scarce inputs, abandoned crops, and few supplies and equipment for the maintenance of large farms.\n\nWe cannot afford to let them down again; focusing efforts on protecting agricultural production is of paramount importance not only to keep the armed forces capable of combat, but also to keep the civilian population fed."
 BRA_small_land_subsidies: "Agro Reconstruction Subsidies"
 BRA_small_land_subsidies_desc: "The collapse of agribusiness led to the abandonment of entire farms and left producers mired in debt. Its effects are still felt by large landowners who struggle daily to maintain their production and equipment. To rebuild and restore large-scale agricultural production, targeted subsidies must be provided to large, medium, and small-scale landowners to get their land back under cultivation and productivity."
 BRA_guarantee_the_basic_food_basket: "Guarantee the Basic Food Basket"
 BRA_guarantee_the_basic_food_basket_desc: "In these times, no one should go hungry. The Three Great Crises and the outbreak of the civil war have destroyed supply chains and driven the prices of basic goods sky-high, forcing rural families to turn to subsistence farming, while those in urban areas go hungry or struggle to afford the bare necessities.\n\nEnsuring this ends is essential, not only to prevent the population from turning against us once again but also to avoid unnecessary deaths from starvation."
 BRA_send_specialized_assistance: "Request Specialized Assistance"
 BRA_send_specialized_assistance_desc: "With the support of the agribusiness consolidated, it's time to reap the rewards of this partnership. The sector possesses unparalleled expertise in logistics, infrastructure management, and large-scale resource extraction. Their assistance in these matters is essential to keeping our industry and the machinery of war running; we should therefore request it, and with promises of protection for their operations, priority access to escorts and supplies, it shouldn't be difficult to get a positive response."
 BRA_produzir_pela_patria: "Produzir Pela Pátria"
 BRA_produzir_pela_patria_desc: "For a long time after the terrorists and criminals unleashed their bloodshed and massacres  across this nation, many families and citizens stayed in their homes, waiting for the danger to pass. The alarm has sounded. The time has come for the Brazilian people to return to their jobs.\n\nMuch to our war efforts, factories, workshops, and production lines cannot remain empty and abandoned. The working men and women of this country must be mobilized, called back to occupy the factories and recover the nation's productivity and industrial power."
 BRA_what_our_soil_has_to_offer: "What Our Soil Has to Offer"
 BRA_what_our_soil_has_to_offer_desc: "Like everything else in this beloved and immense country, Brazilian soil is special. Not only is it fertile, but it is also a treasure trove of countless riches, containing large deposits of iron ore, bauxite, phosphate, limestone, and endless reserves of niobium, as well as vast reserves of timber, water, and other resources that entire nations would do anything to possess on the same scale as we do.\n\nIt is up to us to know how to take advantage of so much wealth, bearing in mind that the exploration and extraction of these resources in the right quantities could be a turning point in our war and economic efforts."
 BRA_trust_in_rural_wisdom: "Trust in Rural Wisdom"
 BRA_trust_in_rural_wisdom_desc: "Rural workers have much to teach politicians in Brasília. These men and women carry generations of practical knowledge about countless activities, knowledge not taught in universities or schools, but acquired through time and work. The government should not only provide representation, but also listen to and learn from their techniques and knowledge about the land and agriculture."
 BRA_do_your_part_for_the_effort: "Do Your Part for the Great Effort"
 BRA_do_your_part_for_the_effort_desc: "For most of the population in our territories, the great battles and combats against the insurgents are far from their homes. However, even far from the conflict, landowners and rural workers are essential to victory. Their honorable work feeds the troops, who, with full stomachs, maintain their energy to fight. Many of them do not know how important they really are to the nation, and they should be remembered."
 BRA_do_povo_para_o_povo: "Do Povo Para o Povo"
 BRA_do_povo_para_o_povo_desc: "In war, it is important that the economy serve its population, that every factory, every workshop, every field, everything serves the cause of the people, not private profit or foreign interests. The work of the laborer and the farmer must strengthen their homeland, production measured by its contribution to the war and the general well-being of the people."
 BRA_untie_productive_sector: "Untie the Productive Sector Knots"
 BRA_untie_productive_sector_desc: "Brazilian industry magnates are our most valuable economic asset in the civil war. They possess the knowledge and ability to innovate, produce, and maintain the war machine in the best possible condition, capable of holding off and overcoming the insurgents. It is essential that they have the necessary capacity, freedom, protection, and priority so that they can provide us with the best equipment, uniforms, and everything else this war demands of us."
 BRA_suspend_production_of_nonessentials: "Suspend Production of Nonessential Goods"
 BRA_suspend_production_of_nonessentials_desc: "Productivity is crucial to our war effort, and it cannot go to non-essential goods. Unnecessary items, such as luxury goods, decorative products, non-critical electronics, fashion accessories, and anything that will not directly contribute to the survival of the civilian population and the needs of the armed forces, will have their production suspended or drastically reduced, so that their production sites can be repurposed to suit the needs of citizens, the Army, and the Government."
 BRA_ease_producer_burdens: "Ease the Burdens on Producers"
 BRA_ease_producer_burdens_desc: "Brazil's industrial base has been under unprecedented pressure since the First Great Crisis, but producers remain the backbone of our government, the survival of the population, and the war effort. This is not the time to keep industry tied down by excessive bureaucracy and exhaustive procedures. Suspending and cutting red tape is essential to put our producers in a position where they will have room to operate at full capacity."
 BRA_employ_eminent_domain: "Employ Eminent Domain"
 BRA_employ_eminent_domain_desc: "The need for larger plots of land and facilities resulting from the collapse of the Brazilian nation cannot wait for market negotiations nor the consent of the former owners. The power of expropriation should be used when deemed necessary for whatever the government's demands may be, and such land and buildings will be reused to fulfil the needs that need to be provided."
 BRA_call_on_industrial_planners: "Call on Industrial Planners"
 BRA_call_on_industrial_planners_desc: "Engineers, economists, factory managers, and logistics specialists are a national treasure now more valuable than ever before. Their expertise is essential for increasing productivity, optimizing resources, and distinguishing between what we need to produce and what should be suspended for the time being.\n\nThe opportunity we have to put them to work in service of the Nation cannot be wasted."
 BRA_boost_automation: "Boost Automation"
 BRA_boost_automation_desc: "It is undeniable that the future of industry lies in automation, and while all other nations are following this path, Brazil is lagging behind. We cannot afford to continue down this path, to stand by and watch the rest of the world advance in leaps and bounds. Our production chains, although modern, remain heavily dependent on manual labor and obsolete, inefficient, vulnerable machinery that is always susceptible to the risk of collapse under the high demands of the wartime conditions in which we find ourselves.\n\nWith the help of the most qualified minds in this nation, a comprehensive assessment of key sectors will be conducted to identify the areas most in need of and most likely to benefit from automation."
 BRA_general_leadership_change: "General Leadership Change"
 BRA_general_leadership_change_desc: "Corruption and complacency take root in any organization that remains under the same leadership for too long, especially in times of prolonged and demanding crises such as the one we are currently facing. New perspectives are essential to keep innovation moving forward and prevent industrial and social stagnation.\n\nA leadership rotation system will therefore be implemented in key ministries, state-owned enterprises, and production councils, so that those who, comfortable in their positions of power, have resisted change and adaptation in our era, are replaced by new, young, and promising blood."
 BRA_nas_maos_de_quem_entende: "Nas Mãos de Quem Entende"
 BRA_nas_maos_de_quem_entende_desc: "Brazilian industry is in the best hands it could ask for. A carefully selected group of the country's leading and most skilled entrepreneurs, managers, and innovators, individuals who have proven themselves capable of building, maintaining, adapting, and thriving even under constant pressure.\n\nThe future of the nation's industrial base is in their hands, as they have the authority to make decisions, allocate resources, and boost production without constant and excessive bureaucratic authority telling them what to do, where to do it, and when to do it."
 BRA_ballistic_production_campaign: "Intensive Ballistic Production Campaign"
 BRA_ballistic_production_campaign_desc: "To succeed in our fight against terrorists and insurgents, we need bullets, shells, armor-piercing ammunition, grenades, mortars, and all other types of military supplies in quantities that Brazilian industry was not designed to supply in such a short time. Our capacity is overwhelmed, without sufficient resources to finance such immense production and without enough manpower to meet demand.\n\nWe must launch an intensive campaign aimed at the production of ballistic ammunition, including massive investment in machinery, precision tools, and weaponry, and the recruitment of more labor to achieve the goal we are aiming for."
 BRA_the_toil_ahead_of_us: "The Toil Ahead of Us"
 BRA_the_toil_ahead_of_us_desc: "Our economy is ready, fully mobilized, and operating at full capacity. However, victory is not yet guaranteed. The road ahead, one of stones and thorns, remains long, painful, and fraught with difficulties. Supply shortages will continue to affect our population, military and civilian casualties will continue to rise, and infrastructure will continue to be the target of constant attacks.\n\nThe terrorists are fighting desperately, the bloodthirsty animals who destroyed our lands think they can overcome us, but the boot of the good citizen will crush them, trample them, and push them back into the hellpit from which they came.\n\nThe road has never been easy, and it will not be easy now, but with the strength and minds of those who love this nation, Brazil's future will remain glorious."
 # - Civil War Phase Two
 BRA_servants_of_the_living_god: "Servants of the Living God"
 BRA_servants_of_the_living_god_desc: "With the strength of Jesus Christ and his Archangels, the infernal plagues of the legalistic army, along with its wicked followers, were purged from this great Nation, pushed back to Hell from whence they came. Brazil now finds itself on a threshold, a millennial opportunity to renew itself with the Strength of Christ and the chance to reshape itself in the image of God and the teachings of the Holy Bible.\n\nLost in the sea of temptation and sin, the Brazilian people have finally become true servants of The Creator, living only under His commandments and obeying only the laws written by the Sacred hand of the Church."
 BRA_reach_out_local_congregations: "Reach Out to Local Congregations"
 BRA_reach_out_local_congregations_desc: "The Holy Catholic Church and Brazilian congregations carry centuries of wisdom and authority that no institution or bureaucrat has been able to replicate, is able to replicate, or will be able to replicate. Their support is crucial for the success of our project and for the resurgence of Christianity in Brazil.\n\nDirect contact shall be made with their leaders. Priests, pastors, bishops, and church leaders should be invited to enter into a formal partnership with the Government, granting them resources to expand their great and honorable work throughout the Nation."
 BRA_embrace_new_age_evangelism: "Embrace New Age Evangelicalism"
 BRA_embrace_new_age_evangelism_desc: "Despite Christian traditions being ancient and dating back millennia, denying the reality of our nation today is highly inextricable. New Age evangelical preachers and megachurches have brought a powerful revival of Christian faith throughout Brazil, but especially among younger generations, the working class, and residents of urban peripheries.\n\nThese preachers, focusing on personal transformation through faith in Christ, have won the hearts of millions of Brazilians, a love that has largely faded among the Catholic public, and therefore the integration of these great men into national politics becomes of paramount importance."
 BRA_appeal_to_christian_tradition: "Appeal to Christian Traditions"
 BRA_appeal_to_christian_tradition_desc: "Our glorious and beautiful victory must not be wasted or risked being diluted by fleeting populist rhetoric, nor by superficial appeals to emotion. If we wish to persevere in the true victory of Jesus Christ in Brazil, we must firmly and deeply root ourselves in the teachings and methods of the Holy Bible and the Holy Catholic Church, which, through two thousand years of Christian tradition, has never let down on any country or person."
 BRA_united_under_saving_grace: "United Under the Saving Grace"
 BRA_united_under_saving_grace_desc: "For a long time, divisions and schisms among Christians by denomination—be they Catholic, Evangelical, Pentecostal, Orthodox, or any other denomination—have been the reason why Christ-based nations have fallen for so long. We cannot allow ourselves to be destroyed from within by the same foolish reasons. What matters, after all, is the essence of what each Christian carries in their heart:\n\n§YThe Teachings of God and Jesus Christ.§!"
 BRA_new_protestant_thesis: "The New Protestant Thesis"
 BRA_new_protestant_thesis_desc: "Brazil finds itself in the midst of a dawn, a spiritual awakening never seen before in the history of this land. The Holy War, fought between angels and demons on Brazilian soil, ended with the victory of Heaven and the eternal expulsion of the servants of the Fallen Angel back to the lake of sulfur.\nThis victory will echo through the centuries, and the Evangelical Revolution will serve as a model for Christians across the planet. The old Catholicism has been supplanted by the Gospel, carried by millions of faithful who saw in God the future of the Nation.\n\nThe New Protestant Thesis will carry Brazil beyond the greatest path, guiding it back to the comforting arms of the Creator."
 BRA_endorse_olavist_theories: "Endorse Olavist Theories"
 BRA_endorse_olavist_theories_desc: "Olavo de Carvalho, the greatest intellectual architect this nation has seen in recent years, a man who shaped the thinking of Captain Jair Bolsonaro. This great man, who met Jesus Christ at the Gates of Heaven, left a legacy of limitless wisdom for society.\n\nThe dangers of globalist secularism, the Culture War, and the centrality of Christian truth in society are fundamental teachings for any nation to survive, and ignoring them, as we mistakenly did, led the country to the garbage dump of civil war. However, now, we have learned from our past mistakes and will apply his ideas to the Brazilian social fabric."
 BRA_promote_evangelical_fundamentalism: "Promote Evangelical Fundamentalism"
 BRA_promote_evangelical_fundamentalism_desc: "Attending church only on Sundays and spending the rest of the week in sin, as if God did not exist, is foolishness; it is the work of the Devil.\n\nModern life tempts the Brazilian people with countless sins daily, and to think that simply attending the House of God once a week will protect them from the workings of the evil genius is foolish. Only a deep, daily, and dedicated commitment to evangelism can truly shield an individual's spiritual temple against diabolical temptations, and this must be taught to Brazilian society once again."
 BRA_the_narrow_door: "The Narrow Door"
 BRA_the_narrow_door_desc: "Converting an entire nation to God's teachings is no simple task, especially after such a bloody conflict and so much exposure to the works of evil. The path is narrow and steep, full of temptations, resistance, and the weight of centuries of servants of the devil trying to force secularism down the throats of the population.\n\nWe cannot let ourselves be carried away by enthusiasm or impatience.\n\nLike Christ himself,  we must take up the Cross and walk this path with unwavering determination, step by step, with only love for Christ and the goal of serving God in mind, regardless of the consequences that may come along the way and ignoring the temptations of the devil."
 BRA_guided_by_gods_light: "Guided by the Light of the All-Powerful"
 BRA_guided_by_gods_light_desc: "The word of God must be the guide for everything, and for our Nation, it is no different. May the texts of the Holy Bible be the Constitution, and may the satanic-secularist Republic be converted into a Christian Republic, in truth and in action. All laws, policies, education, justice, and public life must be submitted solely to the authority of the Scriptures and the Almighty, for only in this way will the Fatherland and its children truly triumph, an eternal one."
 BRA_chain_the_atheists: "Chain the Atheistic Materialists"
 BRA_chain_the_atheists_desc: "Atheistic materialism must be eradicated from the face of the Earth. This murderous ideology, which spits on the image of Christ and justifies the most atrocious sins in the name of false progress, has poisoned hearts, destroyed families, and brought chaos to all of society, both in Brazil and in other nations.\n\nThey must be chained, thrown into the catacombs, and forgotten forever. They must be expelled from the world just as the Serpent should have been expelled from Eden, for their hateful chants and corrosive ideologies have destroyed too many countries to be allowed to continue freely spreading their lies."
 BRA_one_nation_under_god: "One Nation, Under God"
 BRA_one_nation_under_god_desc: "Secularism, as expected, has once again proven to be a failure. Division has destroyed Brazil, and only the Faith, restored to its highest state, can unite this people again.\n\nFollowing the model that the Founding Fathers of the United States of America created, we must shape a new Brazil, an indivisible nation under the sovereignty of Christ, where the law comes from above and where every institution reflects Christianity and only Christianity."
 BRA_end_the_secular_state: "End of the Secular State"
 BRA_end_the_secular_state_desc: "The separation of Church and State, hailed as one of the greatest achievements in the name of progress and republicanism, has proven to be one of the greatest mistakes that could have been made, leaving society isolated with its own misguided ideas, transforming morality into something relative, and making an entire world vulnerable to fleeting and extremist ideologies.\n\nNow, we have the chance to undo this grave error, and we will not let this opportunity pass, abolishing the secular state and returning Brazil to the sole guidance of the Lord's teachings."
 BRA_the_new_land_of_vera_cruz: "The New Land of Vera Cruz"
 BRA_the_new_land_of_vera_cruz_desc: "In 1500, when the first Portuguese missionaries set foot on the soft beaches they called Vera Cruz, Christianity has been evolving in these lands, and since then, Brazil has been, in its essence, an evangelical nation.\n\nOver the centuries, then, the faith has only strengthened, going from the Catechists of the 16th century to the modern preachers who, digitally, spread the word of God to millions of people, all with the same goal:\n\n§YTo achieve True Salvation.§!\nAnd, after so much waiting, we have reached the goal sought by the pioneers from Portugal."
 BRA_god_on_heaven_bolsonaro_on_earth: "God on Heaven, Bolsonaro on Earth"
 BRA_god_on_heaven_bolsonaro_on_earth_desc: "The Great Period of Testing is finally over.\nAfter so much suffering, pain, death, and bloodshed in the name of the most violent ideologies and thoughts, the Words of the Lord have not been forgotten. A population devastated by the destruction of war saw in Christ once again the light at the end of the tunnel, and, entrusting everything to Him, were guided through the valley of the shadow of death, surviving.\n\nLeading them, like Moses through the desert, was he, the Captain, the Myth, the greatest preacher of all and an unwavering soldier of Christ: Jair Messias Bolsonaro.\n\nThis great man who, alone, spoke the truth while being attacked from all sides, who raised the banner of Christ while everyone else raised the banners of the devil, he who, alone, united the faithful even when despair seemed to engulf the entire Nation. Through this unforgettable man, the hand of God made present, guiding, protecting, and, in the end, liberating Brazil."
 BRA_second_national_renovation: "The Second National Renovation"
 BRA_second_national_renovation_desc: "The mutineers of the so-called Legalist Army were defeated, the traitors to the homeland who stole the presidential elections and threw the country into this disgrace finally found the justice they deserved, and the military entrenched themselves as the dominant force in the Brazilian political system, just as they should be.\n\nThe time has come to Renew this country a second time.\n\nNot just reconstruction, this country will be remodeled, molded, and forged to become a stronger, more disciplined, and more united nation, rooting Order and Patriotism in the minds of every citizen.\n\nThe Armed Forces, the supreme defenders of the country who once saved Brazil from the clutches of communism, have come to its rescue once again, and the population, exhausted after so much conflict, can finally breathe easy with the assurance that security, prosperity, and pride have been reestablished."
 BRA_reward_loyal_army_officers: "Reward Loyal Army Officers"
 BRA_reward_loyal_army_officers_desc: "The high-ranking officers who remained steadfastly loyal to the government throughout the brutal conflict with the insurgents of the loyalist army deserve much more than respect and gratitude, for their deeds exceed any words that could be heard; they deserve recognition and tangible rewards.\n\nGenerals, colonels, and majors who stood firm while the nation fell apart, when all seemed lost and when terrorists massacred our people, these men are responsible for preserving Order and security, and they should be credited with ending the rebellion.\n\nThe Government recognizes this commitment and will honor them as they deserve, granting promotions, special decorations, land grants, and generous benefits to them and their families."
 BRA_promote_exceptionalism_in_conscripts: "Promote Exceptionalism Among Conscripts"
 BRA_promote_exceptionalism_in_conscripts_desc: "The ordinary infantry soldiers and recruits who sacrificed themselves and fought for the good of this nation on the front lines are responsible for our victory over the Loyalists. Ordinary men, young men, working men, fathers, all of whom never imagined themselves in such a bloody environment, achieved extraordinary feats, holding their positions when they were at a disadvantage and overcoming the difficulties that the mutineers placed before them.\n\nAlthough this is expected of every soldier, the courage and sacrifice they made must be recognized and rewarded. The Government recognizes this and will promote a system of exceptionalism among soldiers, creating a system of decorations, rapid promotions for acts of bravery, cash bonuses, and other benefits after military service."
 BRA_promote_militarization_of_society: "Promote the Militarization of Society"
 BRA_promote_militarization_of_society_desc: "The Military Model, despite what many think, works.\n\nWe defeated the rebellion not only with force, but with Discipline, Hierarchy, a clear purpose, and the idea of collective sacrifice for the good of the Nation. Without this, we would have failed before we even began. The beacon that guided us through the darkest days in Brazil's history taught us many things and made us reflect on others. A non-militarized society, like the one we had before, led us into chaos, allowing ideologies that hated the homeland to flourish and the gates of hell to be opened to the Brazilian nation.\n\nLove for the Nation, Respect for authority, and Patriotism will guide this nation toward a prosperous future, so that the mistakes of the past will never be repeated."
 BRA_order_before_politics: "Order Before Politics"
 BRA_order_before_politics_desc: "The Civil War taught Brazil important lessons, but the biggest and hardest one was that unbridled politicization leads to extreme polarization and, ultimately, violence.\n\nParties, ideologies, and the personal ambitions of leaders tore the country apart when it most needed order. Therefore, now, order and national security must be prioritized above politics.\n\nAs an apolitical entity, we need to focus solely on restoring stability, security, and the rule of law, so that Brazil can breathe fresh air again, free of the terrors of radicalism and political extremism."
 BRA_myth_as_part_of_our_history: "The \"Myth\" as Part of Our Collective History"
 BRA_myth_as_part_of_our_history_desc: "Jair Messias Bolsonaro is not just a politician, he is the embodiment of resistance, the embodiment of what Brazil has been crying out for so long. A man who stood firm during the storm, even while everyone else fled, who spoke calmly and clearly when everyone else was spewing lies, who fought for Brazil when Brazil seemed lost.\n\nHe is not just a lover of the nation, nor even just a leader, he is the Patriot, the Savior of the Brazilian Nation, who cut off the head of the PT serpent in 2018 and kicked it back to Hell now. Young people should know about him and remember him for generations to come.\n\nAlongside Caxias and Tiradentes, books will tell his story, monuments will be erected in his honor. His image, firm and unyielding, will be used as an example of what it means to be a True Patriot.\n\n§YBrazil owes its survival to one man: Jair. Messias. Bolsonaro.§!"
 BRA_lessons_from_DOI_CODI: "Lessons From DOI-CODI"
 BRA_lessons_from_DOI_CODI_desc: "The famous DOI-CODI apparatus of the former military regime carries a heavy legacy of infamy and controversy, but it also provides a repository of experience gained in internal security, counter-subversion, information gathering, and rapid responses to terrorists. We must learn from the system.\n\nWhat worked in identifying and neutralizing insurgent networks, which intelligence and interrogation techniques proved effective, and how rapid action against enemies was made possible by the use of the system.\n\nOur current enemies are not so different from those the military had to deal with in the past; they are more radical and more popular versions, yes, but the previous regime ended up getting rid of most of its enemies, so what we must do is extend the method used, while reforming some points."
 BRA_reframe_national_narrative: "Reframe the National Narrative"
 BRA_reframe_national_narrative_desc: "Many Brazilians still harbor, mistakenly, a deep resentment toward the military regime of 1964-1985. Propaganda is powerful, and millions still think about censorship, fear, and human rights violations, even though most have never actually experienced any of this.\n\nIn order to consolidate support for the military and gain widespread acceptance from the people, the population must be alerted and reminded of what really happened, emphasizing the global context at that time, the economic difficulties, the recognition of mistakes made in the past, and, above all, reminding our civilians who we were fighting, unmasking the terrorists, and showing the population that the fight was not against opponents of the regime, but against bloodthirsty terrorists who wanted to destroy the nation from within."
 BRA_safeguard_patriot_legacy: "Safeguard the Patriots' Legacy"
 BRA_safeguard_patriot_legacy_desc: "The heroes and patriots who defended Brazil from the parasitic clutches of communism and disorder cannot be erased from history nor demonized by narratives invented by terrorists and revisionists. Newtom Cruz, Colonel Carlos Alberto Brilhante Ustra and others, their courage and unwavering commitment to the nation deserve to be remembered and honored as role models for society.\n\nUstra and the others will be celebrated as the examples of duty and patriotism that they are, men who gave everything they had to stamp out the communist plague from our country. Their legacies will be safeguarded.\n\nSince redemocratization, these great men have been vilified, demonized, and their images spat upon. The time has come to put an end to this. The current generation needs models of honor and patriotism to follow, and men like these are good models."
 BRA_emergency_powers_to_junta: "Emergency Powers to the High Command"
 BRA_emergency_powers_to_junta_desc: "Even after the destruction of the Legalist Front rebels, Brazil remains ravaged by other terrorist groups. Neo-Nazis, Communists, Criminals, Extremists, whoever they may be, armed factions continue to terrorize our population, roaming the streets armed and persecuting good citizens.\n\nCivil institutions have failed to prove their worth, too slow, too divided, and too compromised to respond with the speed and unity that the crisis demands.\n\nThe high military command, however, has everything that is necessary, and for this reason, it should be granted emergency powers, allowing it to take direct control over crucial political and administrative decisions, enabling us to act with speed and precision to eliminate the remaining terrorists from our territories."
 BRA_strengthen_presidential_office: "Strengthen the Presidential Office"
 BRA_strengthen_presidential_office_desc: "The defeat of the mutineers in the Legalist Army did not bring us as much calm as we would have liked, as it was only the end of the first phase of the conflict. Brazil remains fragmented, with other, more radical and bloodthirsty groups roaming our territories, persecuting our civilians, and terrorizing the homeland.\n\nThe old system no longer works for us, not to deal with what we have to deal with. A Congress with deadlocks, delays in the judiciary, and bureaucratic inertia have proven incapable of acting decisively and accurately at this moment in time.\n\nThe Presidency must be strengthened, enhancing its powers to allow it to overcome obstacles and act with security and confidence."
 BRA_army_at_the_helm: "Army at the Helm of the Country"
 BRA_army_at_the_helm_desc: "The decisions made by the Salvation Front of the Fatherland bore fruit. The Armed Forces consolidated direct control of the country, replacing the old, ineffective, and corrupt republic with an agile, disciplined, and results-oriented government.\n\nBrazil's collapse exposed the flaws of the previous system, all the corruption, and politicians interested in personal gain above the needs of the people. However, the Army proved itself to be the opposite, a force loyal to the nation, capable of acting cohesively in times of trial.\n\nWith the Armed Forces in control of the country, Brazil is in a secure position, with a promising future, free from the horrors of leftism, corruption, and extremism."
 BRA_return_to_67_charter: "Return to the Charter of 67"
 BRA_return_to_67_charter_desc: "Through delicate political maneuvers and pressure on Congress, the Salvation of the Fatherland Front succeeded in revoking the 1988 Constitution, returning to the old one, from 1967.\n\nThe 1967 Constitution, born from the vision of great men for Brazil to shape the country in the face of strong central authority and national discipline, is what we need most to restore stability and pride. With this measure, the government can finally act quickly to put an end to insurgent groups and everything that has resulted from the Civil War, ending the national paralysis caused by the now-defunct Constitution."
 BRA_rally_behind_the_captain: "Rally Behind the Captain"
 BRA_rally_behind_the_captain_desc: "Captain Jair Messias Bolsonaro was the one who led Brazil through its darkest hour. Without him, we would currently be subjugated by socialist parasites. However, thanks to his wisdom and expertise, those who tried to parasitize this nation are now behind bars, or dead.\n\nHis determination and willingness to fight in the service of the nation is something that few have. All Brazilians should be reminded of this and called upon to unite with the Captain, to honor, salute, and obey him."
 BRA_by_the_shield_and_sword: "By The Shield and Sword"
 BRA_by_the_shield_and_sword_desc: "Beginning with terrorist thieves stealing the presidential election from the Great Patriot Jair Messias Bolsonaro, the Brazilian Civil War ended, Brazil reunified after years of exhausting conflict and countless deaths.\n\nThe mutineers were trampled and spat upon, their pathetic dreams destroyed, their red flags torn and humiliated, and their leader, the Great Traitor Luís Inácio Lula da Silva, lies forgotten in the deepest trash can of Brazilian history, paying for all the sins he committed against Brazil.\n\nNow begins the time for rebuilding the country. Under the watchful eye of the military, Brazil enters a new and better era. Brazil, wounded but not dead, will rise again stronger, more united, and more Brazilian than before.\n\n§Y\"A Pátria é Livre, chegou a paz, pelos caídos e feridos que não estão\"§!"
 BRA_traditions_based_governance: "Traditions-Based Governance"
 BRA_traditions_based_governance_desc: "Family, Faith, Patriotism: three principles that, since the conception of our beautiful homeland, have sustained society and kept the population under control. However, after the election of the Thief and his gang of gangsters, little by little, what made us who we are was forgotten, and we paid the greater price.\n\nHowever, they have been destroyed. Luís Inácio Lula da Silva, the usurper of the nation and the one who destroyed everything we held dear in our country, is where he should have been a long time ago, and his gang of criminals went with him, their red flags torn and thrown into the mud. With them out of our way, we can return to what defines us as Brazilians."
 BRA_restore_executive_mandate: "Restore Executive Mandate"
 BRA_restore_executive_mandate_desc: "Brazil is close to returning to normality and to finally see an end of this bloody war, and the extraordinary powers granted to the senior military officers of the Armed Forces have served their purpose. Despite this, we cannot maintain these powers forever, and we must gradually and slowly return most of them to the Executive Branch, allowing the president to return to governing with a full mandate."
 BRA_restart_congressional_activities: "Restart Congressional Activities"
 BRA_restart_congressional_activities_desc: "The rebellion of the traitors, although destructive, had a truly purifying effect on Brazilian politics. The socialist thieves, whether from the Workers' Party, PSOL, or other leftist parties, aligned themselves with the mutineers, and now, with their defeat, they have been criminalized, marginalized, and removed from the scene, cleansing Congress of this thorn in our side that had been hindering us for so long.\n\nWe can now finally resume the activities of Congress, confident that the true patriots, those who stood by Brazil and did not allow themselves to be led astray by socialist bandits, share the vision for a better Brazil."
 BRA_strengthen_bolsonarism: "Bolsonarism as a Political Alternative"
 BRA_strengthen_bolsonarism_desc: "Moderate conservatism got Brazil nowhere, failing to withstand the Three Great Crises or even contain the red bandits. Only one man, one ideology, was capable of humiliating the bandits in 2018. Only one man had the guts to fight the system when everything was against him: Jair Messias Bolsonaro.\n\nThe true political alternative to the rotten and decadent system, Bolsonarism saved Brazil from socialist misery and the corruption of the Centrão. If it weren't for the wisdom of Jair Messias, we would be facing yet another period of censorship and corruption, and the population must be reminded of this."
 BRA_promote_natural_conservative_values: "Promote Natural Conservative Values"
 BRA_promote_natural_conservative_values_desc: "Although Jair Bolsonaro deserves praise and honors for saving the nation, we cannot rely on political idols forever, as they are transient, whereas conservatism, the principles of faith, family, patriotism, and discipline are not.\n\nThey carried us through this entire storm and all the bloodshed that was the war against rebels and other terrorist groups, and they must be promoted as the foundation of Brazilian society, because without them, a country will end up the same way we did."
 BRA_the_center_as_moderating_force: "The Center as a Moderating Force"
 BRA_the_center_as_moderating_force_desc: "The Right gave us the strength and passion for our country to survive the storm, but it was the moderates, the institutionalists, the Centrão, who kept the institutions alive and prevented total social collapse.\n\nRadicalism proved its worth, and we must prevent the radical Bolsonarists and right-wing extremists within the government from bringing another wave of chaos and destruction, promoting the center as those who ensured stable governance."
 BRA_education_with_national_values: "Education With National Values"
 BRA_education_with_national_values_desc: "Brazilian education and its educational system, rotten from exposure to Lula's socialist garbage, have become a weapon of ideological indoctrination against our children and teenagers, teaching them to demonize their own past, to dislike themselves, to despise their own nation, history, people, and glorious achievements.\n\nHowever, the ordeal that was the Civil War showed once again why patriotism is fundamental for our youth and gave us countless reasons to restore Patriotism in Youth through education."
 BRA_constitute_anti_corruption_laws: "Constitute Anti-Corruption Laws"
 BRA_constitute_anti_corruption_laws_desc: "Corruption amongst the Brazilian political class is nothing new, being old and rampant, and for this very reason it is one of the main causes of the people's hatred and discontent toward Brasília. Winning the trust and hearts of the Brazilian people will not be easy, especially after so many disgraces they endured, both before and during the Civil War, but if we want to achieve this feat, we must prove that Brasília has learned from its mistakes."
 BRA_brazil_the_loving_republic: "Brazil, The Loving Republic"
 BRA_brazil_the_loving_republic_desc: "The horrors and destruction caused by the civil war left Brazilians exhausted, having taken away their families, their homes, their sources of income, their food, and the hope that for many was already fading. We care about the Brazilian people, because without them there would be no nation to govern, and that is why we must show this love and compassion to all who suffer and are in need."
 BRA_strength_of_the_people: "The Strength of the People"
 BRA_strength_of_the_people_desc: "Jair Bolsonaro is the face of Brazil, the man who demonstrated his strength, determination, and willpower to fight against the parasites that sucked the energy out of this great nation. He who fought against a rotten system that thought of nothing but using simple and humble people for its own benefit, as meat for the meat grinder. He is the man who, amid chaos and turmoil, stood firm, holding the people's hand so they would not lose themselves in the storm of radicalism.\n\nBolsonaro has the people, and with them, he will guide Brazil on a path of glory and prosperity."
 BRA_the_federal_compromise: "The Federal Compromise"
 BRA_the_federal_compromise_desc: "Populism has proven to be a double-edged sword. Although it was the reason Bolsonaro was elected, it alone cannot govern a complex nation like Brazil, as it is based on passions and immediatist desires from the people. Congress, on the other hand, despite all its past failures and mistakes, sees the full picture of what needs to be done for and by Brazil, putting into consideration the long term above the short team, even if it means unpopular decisions are made."
 BRA_new_presidential_republic: "The New Presidential Republic"
 BRA_new_presidential_republic_desc: "Jair Bolsonaro. Strong Man. Strong Hand.\n\nThe man who set the standard for what a Brazilian president should be. More than just an ordinary leader, the greatest man to ever set foot in the Planalto Palace faced the biggest crisis in the history of this country and refused to give an inch.\n\nThe red devils tried to steal his presidency, but they failed. They tried to destroy the country after failing miserably to steal it. They failed again, this time forever. The socialists are destroyed, their surviving leaders fleeing the country like the disgusting cockroaches they are.\n\nBolsonaro saved the nation, not once, not twice, but countless times.\nFuture presidents, although they will never be like the Capitain, will have to be minimally strong to be allowed to serve."
 BRA_maintain_the_balance_of_powers: "Maintain the Balance of Powers"
 BRA_maintain_the_balance_of_powers_desc: "The pre-Civil War system of checks and balances was not flawed, but rather stolen and held hostage by criminals, socialists, corrupt individuals, and elites motivated by money and power. The structure itself worked and functioned well; the blame lies entirely with specific individuals. Therefore, for Brazil to stabilize as quickly as possible, restoring the status quo to the Three Powers is essential."
 BRA_the_new_congressional_republic: "The New Congressional Republic"
 BRA_the_new_congressional_republic_desc: "The Civil War purified Brazilian politics in a way we didn't expect, expelling the vast majority of corrupt individuals, all the socialist bandits, and restoring Congress, this time allowing it to truly shine, representing the people and the people alone.\n\nSuch power is fundamental to the functioning of the Republic and to ensuring that none of the other branches of government gains too much power, and therefore it must be strengthened so that it can perform its functions more effectively and efficiently."
 BRA_suspend_the_state_of_siege: "End the State of Siege"
 BRA_suspend_the_state_of_siege_desc: "The day of victory has arrived.\n\nThe last terrorists have been destroyed, their flags of return and destruction torn, burned, trampled, and thrown into the mud, their leaders fleeing Brazil like cockroaches or futilely trying to hide from the Grand Eye of the Republic.\n\nWith the end of the war, the State of Siege, declared long ago as one of the emergency measures taken to protect the Nation from terrorists, has fulfilled its purpose, and it is time to suspend it entirely, gradually."
 BRA_prosperity_through_economic_liberty: "Prosperity Through Economic Liberty"
 BRA_prosperity_through_economic_liberty_desc: "The insurgents of the so-called Legalist Army are finished, each behind bars as they should be, and the liberals are deeply entrenched in the government.\n\nOur nation, despite still being at war, finds itself on the cusp of a new, prosperous era. The days of state tyranny are over, like a big dark cloud that comes and quickly goes away. We can finally start a National Plan focused on freeing up private initiative, dismantling bloated bureaucracy, and giving freedom to the market, without intervention, so that Brazilians can breathe fresh air of change, prosperity, and economic freedom."
 BRA_hand_on_our_shoulder: "A Hand on Our Shoulder"
 BRA_hand_on_our_shoulder_desc: "Throughout the long conflict against the rebels of the Legalist Army, one group remained steadfast and unyielding in its support for us: the large landowners. The great men and women of the Midwest, the cattle ranchers, sugar producers, large and small farmers, remained loyal to the homeland in its most dire moments.\n\nSuch loyalty is not seen in everyone; not everyone has the ability to stand by another for such a long period. And, having been one of the groups most affected by the Three Great Crises and the Civil War, their commitment must be rewarded with agreements that benefit both parties."
 BRA_promote_enlightenment: "Promote the Enlightenment of Society"
 BRA_promote_enlightenment_desc: "For decades, Brazilians have been conditioned by populism, whether it be from the Great Traitor and his socialist henchmen or not. Promises of easy wealth, emotional appeals to the population, social control programs such as Bolsa Família, the people were kept in this spiral of cheap populism, which achieved nothing but short-lived results and the dumbing down of the poorest.\n\nNeoliberalism has also been demonized by the red troupe, labeled as fascist, exploiters of the people, haters of labor, and many other things. The people are wary of us, suspicious of us, and that has to change.\n\nThe farce of statism must be exposed, and we must reveal what freedom and the Liberal Project do for the countries where they succeed. Culture, shaped to satisfy the corrupt, must then be shaped to value hard work, innovation, and economic and individual freedom, so that little by little, the demonization of neoliberalism is undone."
 BRA_subsidies_to_agribusiness: "Subsidies to Agribusiness"
 BRA_subsidies_to_agribusiness_desc: "Our most vital economic asset, the agribusiness, has been devastated by the civil war. We cannot afford to wait until we have cleared the nation of insurgents to recover it, as it is extremely important for keeping the country economically alive and the population fed. The recovery of this sector is essential and must be given top priority, with exorbitant subsidies for its restructuring, regardless of the costs."
 BRA_entrench_neoliberal_model: "Entrench the Neoliberal Model"
 BRA_entrench_neoliberal_model_desc: "The Civil War served as a reset for the Republic, erasing everything from the old state and creating a unique window of opportunity for us to change the nation as we see fit. We cannot throw this opportunity away, but rather seize it to consolidate a pure neoliberal model, never seen before.\n\nWithout half measures, without endless negotiations with different groups, without concessions to the corrupt Establishment, Brazil will be completely reformed, from head to toe, to ultimately become unrecognizable from what it was before the war."
 BRA_end_needless_spending: "End Needless Spending"
 BRA_end_needless_spending_desc: "The war devastated the Brazilian state's finances, indebting it as never before, depleting its reserves, and interrupting services. Every coin, every real spent must be justified, reviewed, and justified again. Nothing can nor will be used for \"nothing.\"\n\nEverything that is not essential to the functioning of the government, whether it be ministerial budgets, useless ministries, subsidies for non-strategic sectors, exorbitant contracts and privileges, will be cut. The fat of the establishment needs to be trimmed the way a chef trims meat, so that we can finally use our money wisely."
 BRA_invest_in_research_innovation: "Invest in Research and Innovation"
 BRA_invest_in_research_innovation_desc: "To rebuild Brazil, more than willpower, labor, and money will be needed; it will require us to reinvent ourselves. The technology of the new decade provides us with extraordinary possibilities that promise quick results. We must explore this alternative and launch bold investment programs in research and development to ensure that, despite the difficulties, the nation's recovery process is smoother and that it is prepared for the future."
 BRA_privatize_the_drainholes: "Privatize the Drainholes"
 BRA_privatize_the_drainholes_desc: "Many sectors of Brazil's economy are suffocating, veritable black holes of money, sucking up billions and billions in subsidies, accumulating chronic deficits, all while providing shoddy and mediocre services.\n\nBrazil has become pure misery.\n\nThese leeches that demand more than they deliver are useless, worthless, serving neither the State nor the people, and therefore privatizing them is the only way to save what can be saved and turn these institutions into efficient ones."
 BRA_blow_up_the_stagnant_state: "Blow Up the Stagnant State"
 BRA_blow_up_the_stagnant_state_desc: "Old, bloated, bureaucratic, slow, stagnant, suffocating. This is what comes to mind when talking about the Brazilian State. The Civil War, by exposing the population to the horrors they were living through and bringing the State to its knees, did not end it.\n\n§YWe must finish the job.§!\n\nA better Brazil will not be formed by old institutions, old politicians, regulations, and stagnative, bloated bureaucracy. We must dismantle each of these, blow up what remains of the State to forge a new one, focused only on what needs to be done, leaving the rest to those who know how."
 BRA_what_we_do_best: "What We Do Best"
 BRA_what_we_do_best_desc: "In times like these, reckless experiments or risky bets on untested models are not something that should be done, since such things, if they went wrong, would put us at severe risk.\n\nBrazil needs to return to what it has always done best. Agribusiness, the sector in which we have built decades of expertise, has reached every corner of the world thanks to our quality and quantity. Soybean fields, cattle farms, sugarcane plantations, and coffee plantations are more than just engines for the economy; they are the foundation for the wealth and resilience we have, even in the face of disasters."
 BRA_our_endless_ambition: "Our Endless Ambitions"
 BRA_our_endless_ambition_desc: "We are not the celery of the world, no. We are no longer bound by the demands of external groups. We are rich, imposing, we have potential and resources that nations around the world would give anything to have and everything to achieve. We are the Country of the Future. This potential, held back by the corrupt and inept who ruled this Nation from Brasilia for years and years, will finally be unleashed."
 BRA_allure_of_the_sertanejo: "The Allure of the Sertanejo"
 BRA_allure_of_the_sertanejo_desc: "In essence, Brazil is and always has been a rural nation. Many confuse this with weakness and vulnerability, but this is what shapes our identity and the strength of the Brazilian people. The Sertanejo defines the people of Brazil more than any urban city.\n\nThe Sertanejo aesthetic should be celebrated and made the new face of agriculture. At the same time, Brazilian agribusiness is the most advanced, sustainable, and humane production model in the world, and should be portrayed as such."
 BRA_workshops_of_the_future: "Workshops of the Future"
 BRA_workshops_of_the_future_desc: "The collapse of the nation set the Brazilian economy ablaze, fragmenting it and almost destroying it completely. However, as in other times, it survived, wounded but alive. With it back on its feet, we must not waste time and focus on rebuilding it through our agribusiness, which throughout this time has remained resilient alongside the government, entrepreneurs, workers, and families who, closely linked to the industry, will be able to return to work and dream without fear of the state."
 BRA_niobium_dreams: "Niobium Dreams"
 BRA_niobium_dreams_desc: "The Petista Demon set us back several steps. Decades ago, China had a smaller economy than ours, we had potential, and everything went down the drain with the Great Traitor. The Civil War put us in a terrible position in almost every way, but it also gave us the opportunity to finally put our robbed, dormant potential to the test.\n\nThe time has come for us to reach the 21st century.\n\nThe bloated state has been destroyed, the suffocating bureaucracy is gone, and the entrepreneurial class is no longer strangled by the clutches of the government. With complete freedom, a new era of development is beginning in our beloved country, where those who innovate, who aspire, who dream, will succeed."
 BRA_a_new_land_of_freedom_is_born: "A New Land of Freedom Is Born"
 BRA_a_new_land_of_freedom_is_born_desc: "The most destructive and bloody conflict in the history of our people, one that tore families apart and reduced entire areas to nothing, is finally over. The red and radical demons, united under their banners of hatred and their bloodthirsty leaders, have been thrown out the window, never to return to torment our nation.\n\nAlong with this, the fear that many had of a totalitarian state rising from the ashes of our homeland has been dispelled, as they shout with joy, facing the reality that Brazil will be free, truly free.\n\nThe green and yellow flag flutters peacefully in the winds of freedom."

 # Ideas
 BRA_selic_rates: "Selic Rates"
 BRA_selic_rates_desc: "\"Nobody likes elevated interest rates, not even the Central Bank\" - Campos Neto"
 BRA_consolidated_rights: "Consolidated Worker's Rights"
 BRA_consolidated_rights_desc: "\"The laborist legislation is the cornerstone of social justice.\" - Getúlio Vargas"
