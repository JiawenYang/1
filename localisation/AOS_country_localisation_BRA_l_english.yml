 # Country
 # Summary
 BRA_GATHERING_STORM_DESC: "Once heralded as \"The Country of the Future\", it seemed that history had other plans for Brazil. The end of the commodities boom in 2014 was followed by financial crisis and a swift end to PT's strong grip on the nation after 14 years.\n\nBrazil would then see a conservative shift with the election of Jair Bolsonaro in 2018, but after two years it seems that the nation has been left adrift with no plan or strategy for it in place. If Brazil is to live up to its full potential it must decide on a path forward, or risk being left behind in history."
 BRA_country_summary: "§YCountry Summary§!:\nThe biggest economy in Latin America, and the second largest economy in the Americas only below the behemoth that is the US, Brazil has always been viewed as a nation full of potential. Unfortunately, that's all that there has ever been - potential. Coming out of WW2 with a craving for republicanism and development, Brazil had its ambitions cut short in 1964 when the military took over its institutions and enacted two decades of oppression.\nAs the military regime thawed, Brazil would once again dare to dream in the new millennium powered by a commodities boom wrought by the rise of new emerging powers. But this dream would again escape Brazil's grasp when the boom ended and with it Brazil's economic and political stability, culminating in the 2016 impeachment of president Dilma Roussef and a right-wing shift with the election of Jair Bolsonaro in 2018.\nWith the entire world at the brink, the nation faces tough challenges ahead, but also plenty of opportunities. Could this finally be the time for Brazil to rise up and become the power of the future it has always craved to be?"
 BRA_country_paths: "\n\n\n§YCountry Paths§!:\n - §GNational Government of Brazil§!\n - §7Brazilian Legalist Army§!\n - §CMore to come in future updates!§!"
 BRA_country_other: "\n§YTips and Tricks:§!\n - Where there's smoke, there's fire.\n - God writes straight through crooked lines.\n - Slow and steady will get you far.\n - §YBrazil is not for amateurs.§!"

