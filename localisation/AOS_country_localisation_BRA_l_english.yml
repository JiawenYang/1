 # Events
 BRA.1.t: "Halfway There"
 BRA.1.d: "Ever since redemocratization, our country has been through quite a journey, the return of civilian rule has been characterized by a slurry of ups and downs. After the initial stabilization brought by the Real Plan, the country experienced a decade of optimism, the election of the leftist president Luis Inácio Lula da Silva marked a new social democratic chapter of our history, and, coupled together with the economic boom of the 2000s, things were looking up for the common man.\n\nHowever, everything would come crumbling down. The welfare state built by the Worker's Party (PT) monopoly on politics was a sham, where taxes were diverted from the middle class to reward the economically useless and finance massive corruption schemes. The \"resocialization policies\" adopted created total impunity for bandits and criminals, whose armies now occupy major cities. Homossexuality, drugs and other anti-social behavior became the government sponsored culture.\n\nWithout any real institutionalized opposition, it would take 13 years of PT rule for the people to finally revolt against this madness, the June Journeys of 2013 and the economic crash in 2014 broke the camel's back, and in August 2016, during the impeachment vote of president Dilma Rousseff a deputy from Rio de Janeiro would become the unifying figure of the right. Jair Messias Bolsonaro, a former army captain and unapologetically conservative, famous for his satirical and humorous responses, known as \"Mitadas\", and for exalting the country's military regime, became an internet sensation.\n\nThe right had finally become emboldened once again, and with the arrest of Lula in 2018 on corruption charges, Bolsonaro would win a smashing victory in the 2018 general elections. Now, two years later, we are halfway done through our first mandate, our agenda to restore morality and security to the country has ample support from the population."
 BRA.1.a: "This is our mission, and the mission given is mission accomplished."
 BRA.2.t: "Brazilian Central Bank Launches PIX E-Payment System"
 BRA.2.d: "The Central Bank has announced today that its new electronic payment platform has been officially launched to the Brazilian people. While the tool had been already been undergoing trial runs since last October, it has now been made available for all clients of the 734 registered institutions.\n\nThe new system allows for easy universal electronic money transfers and transactions, both for individuals and businesses, across any and all registered platforms. It is expected that the new system will boost small businesses which would be otherwise reliant on expensive payment systems."
 BRA.2.a: "How convenient!"
 BRA.3.t: "First Positive Case of Covid-19 Confirmed in Brazil"
 BRA.3.d: "São Paulo City, February 26, 2020 - Edson Aparecido held the letterhead envelope of the São Paulo City Health Department in his sweaty hands. Inside was the dreaded positive COVID test of a tourist returning from Italy, who had to be hospitalized with respiratory problems. This would be the first confirmed case in the country. \"The first of many, for sure,\" thought Edson, head down, staring into nothing. \"We should have shut everything down, I knew it! I should have insisted more...\" He tried to focus on the monumental task ahead, but his mind kept on imagining scenarios where things might have been different.\n\n\"Mr. Secretary?\" The receptionist's voice snapped Edson out of his stupor. \"The mayor will see you now.\" Bruno Covas was standing, leaning against his desk, drumming anxiously on the mahogany surface. \"So, Ed?\" the mayor asked in a naïvely optimistic tone that barely disguised his apprehension. \"Better call the press already, Bruno.\" The mayor threw his hands in the air. \"Damn it! It had to be in MY city?! Shit!\"\n\n\"I've already informed the team,\" the secretary stepped forward. \"Everything's in place. We'll say the infected patient is in full quarantine and that we're already tracking down the other passengers from the plane to have them tested.\" A moment of silence. Covas took his time to regain composure. \"Tell the press we've already located the other passengers and that they're being tested in a safe location as we speak.\" The mayor approached Edson, lowering his voice. \"This virus is causing serious problems out there, and I can't afford to have those problems here. Not now, not at the worst possible moment.\"\n\n\"Yes, Bruno, t-that was another thing I wanted to bring up with you...\" The nervousness in the Health Secretary's voice surprised even himself. \"Maybe it would be better... you know, to contain the transmission...\" The mayor's eyes widened, already knowing what he was about to suggest."
 BRA.3.a: "\"Cancel Carnival?! Are you out of your mind???\""
 BRA.4.t: "The Death of Agribusiness"
 BRA.4.d: "The international correspondent showed Wall Street completely empty, evacuated. Besides the news crew, only NYPD armored vans could be seen patrolling the streets, along with the occasional corpse of some poor soul sprawled on the ground, who preferred to end it all rather than deal with such a massive financial loss. This was one of the tragic scenes broadcast directly from the armed conflict consuming the United States. The American Civil War was the coup de grâce for the international trade chain, which had already been stressed to its limit.\n\nAgribusiness is by far the most profitable sector of Brazilian imports, and the United States was one of its main trading partners. With America out of the game, worse, with the collapse of the entire trade chain, the agricultural sector suddenly found itself paralyzed. Kilometers of trucks sat idle on the highways, freight trains lined up motionless on the tracks, cargo ships full of goods anchored at the ports, and tons of perishable food piling up in warehouses already considered spoiled. Everyone waiting for the next order, but for now only receiving radio silence. This inertia in the trade routes contrasted sharply with the sheer panic inside boardrooms and high-level investment firm group chats. Investors argued furiously about the next emergency move, while crossed orders of buy, sell, and hold were being shouted to the four winds.\n\nFor the average citizen, the economic situation had already been unsustainable due to the COVID-19 pandemic and the astronomical rise in fuel prices, and now it had become completely unviable. Families rushed to supermarkets only to find empty shelves or supplies that were already expensive, now even more so: the basic food basket was up 30%; meat, 40%; manufactured goods inflated by 20%, and worsening. As the situation grew more desperate, the people turned to ever more drastic measures and increasingly radical ideas..."
 BRA.4.a: "The agro situation has developed not necessarily to Brazil's advantage."
 BRA.5.t: "The Oil Crisis Hits Brazil"
 BRA.5.d: "Brazilians have woken up to skyrocketing fuel prices and gigantic lines at gas stations today, as the effects of the Saudi collapse are felt in the country. With around 20% of the country's fuel imports coming from Saudi Arabia, and another 15% from the US, a third of the nation's gas sources have been compromised, leading to shortages across the country.\n\nWhile Brazil does extract enough oil to be considered self-sufficient, it lacks the oil refining capabilities to make use of these reserves, relying on imports to maintain its fuel reserves. While the international situation has boosted our gains from exports, they have been completely offset by these import costs, leaving us at a net loss.\n\nAnalysts warn that the fuel shortages could lead to further political instability in the country."
 BRA.5.a: "Let's hope they have some extra reserves at Petrobrás..."
 BRA.6.t: "Covid-19 Severity Worsens"
 BRA.6.d: "After the inept and lacklustre performance by the Brazilian national government and its healthcare department in the recent months has led to a surge in COVID-19 cases across the nation. The virus that already had Brazil bend to its knees is now rampaging across the nation with little to no resistance from our government. This is a national disaster and an international embarrassment to know how incredibly sloppy the healthcare system and government has gotten in the effort to contain the calamity.\n\nIf the Bolsonaro government and the medical field don't do anything immediately to effectively contain the virus in any sense, this may very well lead to a civilisational-ending scenario which will surely destroy Brazil's ability to be a functioning state in the world. As of now the cases of new infections and subsequent death due to the COVID-19 virus are soaring into the ceiling and beyond as well, hampering the Brazilian economy to almost a standstill."
 BRA.6.a: "Do something now or let Brazil enter the history books for a topic we pray we never see."
 BRA.7.t: "Congress Approves Law on Party Federations"
 BRA.7.d: "The National Congress has approved a new model of union between political parties, which will already be valid for the 2022 elections. The new legislation establishes that two or more parties may formally unite and act as if they were a single organization throughout the entire electoral cycle and during the full legislative term.\n\nUnlike the former proportional coalitions, which have been banned since 2017, federations require a long-term commitment: parties that join must remain united for at least four years, sharing a program, national leadership, and parliamentary operations. The federation will apply across the entire national territory, standardizing alliances and political strategies.\n\nThe new rule was designed to allow smaller parties to collaborate without losing their own identity, while also helping them surpass the electoral threshold, which restricts access to public funding and TV airtime. According to the text, federations will have a unified caucus, joint division of resources, and shared responsibility for any sanctions.\n\nThe measure received support from small and medium-sized parties, which see the federation as a way to maintain relevance in the new political landscape, but it also drew criticism from sectors that consider it a \"disguised coalition.\" The Superior Electoral Court has regulated how the new model will function, ensuring its application already in the 2022 elections."
 BRA.7.a: "A new political paradigm is established"
 BRA.8.t: "Senate Establishes CPI on Government Actions During the Pandemic"
 BRA.8.d: "Brasília - The Federal Senate established this week the Parliamentary Commission of Inquiry (CPI) on COVID, created to investigate the actions and omissions of the federal government in dealing with the coronavirus pandemic in Brazil. The commission will have an initial two-month period to determine political and administrative responsibilities, as well as any potential crimes related to the public health crisis.\n\nAmong the main focuses of the investigation are delays in the purchase of vaccines, the promotion of medications without proven effectiveness, the role of informal advisers in the health sector, and the misuse of public funds during the pandemic.\n\nOpposition lawmakers argue that the commission is essential to clarify decisions that directly impacted the number of deaths in the country. Government allies, on the other hand, criticize the initiative, claiming it is politically motivated.\n\nIn the coming weeks, the CPI is expected to begin summoning current and former ministers, health experts, and representatives of companies involved in vaccine procurement. The final report may result in requests for indictments and referrals to the Public Prosecutor's Office and other oversight bodies."
 BRA.8.a: "Well, crap."
 BRA.8.b: "He who owes nothing, fears nothing."
 BRA.9.t: "Senate Concludes COVID CPI Investigations"
 BRA.9.d: "Brasília - The Federal Senate concluded this week the work of the COVID CPI, after two months of investigations into the federal government's handling of the pandemic. Despite the critical tone adopted by some members of the committee, the closing of the CPI occurred without the production of immediate legal consequences for President Jair Bolsonaro's administration.\n\nThe final report faced strong opposition from pro-government lawmakers, who pointed to political bias, legal fragility, and a lack of material evidence to support the requests for indictments. The allied base managed to block sections deemed excessive and emphasized that the CPI did not prove the existence of crimes committed directly by the president.\n\nGovernment allies stressed that key decisions of the Executive Branch, such as granting autonomy to states and municipalities in health management, were confirmed by the Supreme Federal Court, which limits the Planalto Palace's direct responsibility for local measures adopted during the pandemic. They also highlighted that Brazil ended the critical period with a broad vaccination campaign underway and a gradual recovery of economic activity.\n\nWith the end of the commission, the referrals from the report were sent to bodies such as the Office of the Prosecutor General, without, so far, resulting in formal charges."
 BRA.9.a: "It was just the opposition kicking up a stir."
 BRA.10.t: "Senate Concludes COVID CPI Investigations"
 BRA.10.d: "Brasília - The Federal Senate concluded this week the work of the COVID CPI, determining that the administration of President Jair Bolsonaro was marked by omissions and negligence in confronting the pandemic. The final report was approved by a majority of senators and points to serious failures in the management of the public health crisis.\n\nAccording to the document, the federal government delayed the purchase of vaccines, encouraged the use of medications with no proven effectiveness, and adopted an informal strategy aimed at achieving so-called \"herd immunity\". The CPI also identified the existence of a \"parallel cabinet,\" made up of advisers and doctors without official positions, which allegedly influenced decisions within the Ministry of Health.\n\nThe report calls for the indictment of dozens of individuals, including the President of the Republic himself, ministers, former ministers, advisers, and businesspeople. Among the alleged crimes are malfeasance in office, crimes against public health, quackery, and crimes of responsibility. Part of the findings was forwarded to the Public Prosecutor's Office, the Office of the Prosecutor General, and international bodies.\n\nGovernment allies rejected the report, describing it as political and biased. The opposition, in turn, stated that the CPI fulfilled its role by documenting responsibilities and leaving a historical record of how the pandemic was mishandled in Brazil."
 BRA.10.a: "The game was rigged from the start."
 BRA.11.t: "Meddling in the Federal Police"
 BRA.11.d: "The eyes of Sérgio Moro, the Minister - or rather, the former Minister of Justice - readjusted to the room after being temporarily blinded by yet another round of camera flashes from the press.\n\n\"To answer your question,\" Moro began, \"I am resigning due to the President Bolsonaro's repeated attempts at political interference in the Federal Police. As you are aware, since last year the president has shown a particular interest in replacing the FP leadership with someone he could call directly to obtain information and intelligence reports. That is not, and never has been, the role of the Federal Police.\"\n\n\"But your signature appears on the dismissal of the former Director-General of the Federal Police, Maurício Valeixo. Did you approve this change?\"\n\n\"Not at all. I was taken by surprise. The President ordered the Director-General's dismissal without express reason, and Valeixo's dismissal was promulgated with my signature without my consent.\"\n\nMoro felt the sweat gathering at his neck and loosened his collar. He thought of two decades as a federal judge; he thought of Operation Car Wash; he thought of becoming a minister, that this time would be different; he thought of being a national hero, of being a national traitor; he thought of a just country, that he might die without seeing it; he thought if this fight was worth it...\n\n\"Replacing the Director-General and superintendents without legitimate reason threatens the independence of the Federal Police, especially when there are ongoing investigations. This change is a sign that he wants to control the corporation. Allowing these invasive actions jeopardizes the integrity of the agency. I will not be a part of this.\" Moro concluded."
 BRA.11.a: "Some lines should not be crossed."
 BRA.12.t: "Congress Approves Law Flexibilizing Gun Ownership"
 BRA.12.d: "Brasília - The National Congress approved this week PL No. 3723, which promotes a broad overhaul of the Disarmament Statute and the rules regulating the registration, possession, and carrying of firearms in the country. The proposal, which had been under consideration since 2019, was then sanctioned by the president.\n\nThe approved text establishes new rules for the National Firearms System, redefines crimes related to firearms, and regulates in greater detail the status of hunters, sport shooters, and collectors. Among the main points are the expansion of the circumstances under which a permit to carry a firearm may be granted, the revision of bureaucratic requirements, and changes to the penalties established by law.\n\nDespite being one of the main focuses of Bolsonaro's platform, the topic of expanding the civilian right to bear arms was notably neglected by the president during his administration. The Bill was approved by a spontaneous mobilization of the government's base in the legislature.\n\nCritics argue that passing this law at a time of such civil unrest is a serious mistake that could lead to an increase in the already growing number of cases of political violence in the country. Supporters, on the other hand, point out that the measure is necessary precisely so that the population can protect itself against these violent attacks."
 BRA.12.a: "That's stolen valor!"
 BRA.13.t: "Reports on Increased Political Activity"
 BRA.13.d: "With the successful legalization of gun ownership in Brazil, despite the setbacks from the parasitical opposition, the sale of firearms and their instrumentalization has skyrocketed throughout the country in the last few months. Against warnings of increased political violence in the face of polarization across the Brazilian society, the President has came out to address these concerns, stating that the increased circulation of firearms amongst the civilian population would instead have an effect of deterrence against extremist violence.\n\n\"If you have a peaceful protest, for or against the government, and some rabblerousers started swinging their guns around, they're going to have to deal not only with the police, but many good responsible citizens who'll also be armed themselves! Thankfully it's not only the haters, the loyal men and women of the nation too carry their pistols around in case any leftists attempt to impose their own twisted vision of a failed future.\"\n\nWhile reports of stray bullets damaging infrastructure and even life have raised considerably since the passing of the new law, the overwhelming majority of such incidents have been traced to negligent discharge or interpersonal altercations, with reports of organized violence having remained relatively unchanged since the decision.\n\nThe situation appears stable for now, but we must remain vigilant."
 BRA.13.a: "Organized violence? More like disorganized riff-raff!"
 BRA.14.t: "Congress Approves Law Flexibilizing Gun Ownership"
 BRA.14.d: "Brasília - The National Congress approved this week PL No. 3723, which promotes a broad overhaul of the Disarmament Statute and the rules regulating the registration, possession, and carrying of firearms in the country. The proposal, which had been under consideration since 2019, was then swiftly sanctioned by the president.\n\nThe approved text establishes new rules for the National Firearms System, redefines crimes related to firearms, and regulates in greater detail the status of hunters, sport shooters, and collectors. Among the main points are the expansion of the circumstances under which a permit to carry a firearm may be granted, the revision of bureaucratic requirements, and changes to the penalties established by law.\n\nThe expansion of the civilian right to bear arms has always been one of the main focuses of Bolsonaro's platform, and in recent weeks the president had shown notable interest in turning this promise into reality. By coordinating his allied caucus in the legislature and mobilizing segments of civil society favorable to this change, the bill gained the momentum it needed to finally be approved by Congress.\n\nSupporters of the measure argue that the new legislation provides legal certainty, corrects regulatory gaps, and recognizes the need for personal protection for certain professional categories and citizens under proven threat. Critics, however, warn of the risks of excessive flexibilization of access to firearms, pointing to potential impacts on public security and state oversight."
 BRA.14.a: "The Good Citizen will never cower before banditry."
 BRA.15.t: "What went wrong? - Change of Plans"
 BRA.15.d: "\"It can’t be.\" thought Bolsonaro, bottle of Pitú in hand, staring out the window of the Alvorada Palace. On the other side of the door were his whole family, his friends, and his allies. All together to watch the vote count, and all together they watched his defeat. No one would dare disturb the Captain, who had locked himself in his office. \"It’s not fair!\" He let that thought slip out loud.\n\n\"So close. Losing within the margin of error is the height of it.\" He brought a hand to his forehead. \"But I won the first round. Who's ever heard of winning in the first round just to lose in the second?! How is that even possible?\" Bolsonaro lifted his head, graced with a revelation: \"It was stolen!\" A sudden gleam in his eyes. \"There’s no way all those people on the streets last week meant nothing. Of course the biggest thieves in the history of this country would have no problem committing one more fraud.\" He jumped up from his chair. \"The Supreme Court's decisions, the senseless alliances, the electronic voting machines… It was all rigged from the start!\"\n\nBolsonaro began pacing back and forth in his office looking for something. \"I can’t let the country fall back into the claws of those criminal communists, especially not in this fraudulent way. I can’t!\" he murmured under his breath going through his contacts on his phone and calling the first person he thought might be useful.\n\n\"Mr. President\" Mauro Cid, his Aide-de-Camp, answered immediately \"I want to be the first to say to that-\"\n\nBolsonaro interrupted"
 BRA.15.a: "We will manoeuvre this."
 BRA.16.t: "Those Who Guard the Gates"
 BRA.16.d: "\"State of Siege, GLO, intervention in the Superior Electoral Court?!\" The Air Force Commander, Lieutenant-Brigadier of the Air Baptista Júnior, could barely hide his indignation behind his military couth. \"Are you suggesting we prevent the next government from taking office?\" The Brigadier looks at the president as if waiting for an answer; Bolsonaro remains silent, sitting at his desk in his office at the Alvorada Palace.\n\n\"There are reasons to believe that the election results were tampered with,\" interjects General and Minister of Defense Braga Netto. \"These extraordinary measures will allow us to investigate whether or not that was the case.\" \"The Air Force will not consent to any institutional rupture,\" Baptista states firmly. \"If you'll excuse me, gentlemen.\" The Brigadier salutes the president, but does not wait to be dismissed, and walks out.\n\n\"Is the Minister aware that the Armed Forces themselves verified the integrity of the voting machines before the election, and that no evidence of breach was found?\" The Army Commander, General Freire Gomes, calculatedly asks Netto.\n\nThe minister considers this for a moment and replies, \"Even if the voting machines completely are inviolable - which we aren't entirely sure of yet - there are reports of bad actors within the Superior Electoral Court. We cannot allow the transition of power to be carried out without first ensuring that all the-\"\n\nFreire shakes his head in denial, sighs, and stands up abruptly. Ignoring the Minister of Defense, the general turns to Bolsonaro: \"Mr. President, I hope you are aware of the legal consequences these actions could entail. I am obligated to inform you that if you insist, you could be arrested.\" Freire snaps to attention and salutes the President. \"You are dismissed, General,\" Bolsonaro breaks his silence.\n\nAs Freire leaves, only the Navy Commander, Admiral Almir Garnier Santos, remains. For a long moment, the three men look at one another; Braga Netto and Bolsonaro stare at the Admiral as if waiting for an answer. Realizing this, Garnier stands at attention. \"The Navy will be at your disposal for any course of action you decide to take, Mr. President.\" \"Very well, Admiral. We are still considering alternatives. We will let you know. You are dismissed,\" Bolsonaro says in a formal tone.\n\nNetto escorts the Admiral to the exit. Upon his return, he says nothing, but his expression clearly asks the president: \"What do you think?\""
 BRA.16.a: "What a bunch of watermelons."
 BRA.16.b: "They will come around eventually."
 BRA.17.t: "Firewood For The Bonfire"
 BRA.17.d: "It was nearly 40 degrees Celsius on that summer Sunday in Rio. On a day like that, anyone would have been at home sheltering from the sun or relaxing by the sea, but even so, there they were: hundreds of thousands of people crowding Copacabana Avenue. The atmosphere wasn't one of celebration; those people weren't there to celebrate a victory or mourn a defeat, not yet. Every person in that green-and-yellow sea was there to hear the president's grand plan, his big revelation that would change the game. He would know what to do; nothing was truly won or lost until President Bolsonaro's word announced it so.\n\nAnd with the usual thunderous fanfare, the president appeared. Atop the sound truck and surrounded by his most loyal allies, his words reverberated across the entire avenue and through the heart of every patriot present.\n\n\"My dear friends, do not believe them when they say we have lost, that our patriot movement is over. They say we lost the elections - under very suspicious circumstances that will have to be investigated very carefully, it must be said - but what we have not lost, and never will lose, is our will to fight!\" The wave of applause and cheers made the ground shake. \"And we will keep fighting! And I tell you to fight more fiercely than ever! And so that no doubt remains as to what we are fighting for, I say it loud and clear: We have always defended, and always will defend...\""
 BRA.17.a: "The morals and the good customs!"
 BRA.17.b: "The honor of the Brazilian nation!"
 BRA.17.c: "The values of the Brazilian family!"
 BRA.17.e: "The freedom of each individual!"
 BRA.18.t: "Between The Farm and The Church"
 BRA.18.d: "The caucuses of the National Congress are groups of lawmakers who consistently vote en masse to advance their common interests, essentially functioning as pseudo-parties. The most cohesive group within Congress is known as the \"BBB Caucus,\" a term used to refer collectively to the Parliamentary Front for Public Security (the \"Bullet Caucus\"), the Parliamentary Front for Agriculture (the \"Beef Caucus\"), and the Evangelical Parliamentary Front (the \"Bible Caucus\"). The alliance between these groups was imperative to make our administration viable in the first place, and they have been essential in sustaining our government over these years - provided, of course, that their respective particular interests were prioritized.\n\nThe Bullet Caucus has always been the backbone of our base; President Bolsonaro himself was a very prominent member during his years as a deputy. It is safe to assume we will have the support of its constituent lawmakers regardless of which path we choose to follow. However, in this moment of crisis and defeat, the full support of those in the Beef Caucus or the Bible Caucus is not guaranteed. They will be on our side, but if we want to count on their full political strength and the popular support derived from each, we must guarantee them that their objectives will be essential foundations of our platform from here on out.\n\nWith this at stake, the differences between these two groups stand out far more than their similarities. If we commit to following the guidelines of one caucus, we will necessarily alienate a large portion of the other. Regardless, we need as many allies as we can get at this stage, so we have to make this choice."
 BRA.18.a: "Commit to the Parliamentary Front for Agriculture"
 BRA.18.b: "Commit to the Evangelical Parliamentary Front"
 BRA.19.t: "A Honorable Transition of Power"
 BRA.19.d: "Cheater"
 BRA.19.a: "I bet you looked at the localisation file as well"
