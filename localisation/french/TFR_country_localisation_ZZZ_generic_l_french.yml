decision_event_news.5.t: "À l'horizon..."
decision_event_news.5.d: "John Titor ici\n\nLa sortie est prévue pour le 18 octobre. Nous sommes dans la dernière ligne droite, ne gâchez pas tout. Pour certains d'entre nous, nous travaillons dessus depuis 4 ans. 4 longues années. Beaucoup sont venus et repartis, terminons ce que nous avons commencé et écrasons la concurrence.\n\nOn a ça, on a ça bien en main !"
decision_event_news.5.a: "Victoire pour TFR"

EU_member_dynamic_desc: "L'idée d'une Europe Unie a été théorisée et diffusée à travers l'histoire européenne comme étant à peine plus qu'un concept. Cependant, à travers les périodes les plus sombres de l'histoire de l'Europe, avec la montée du fascisme et du communisme sur le continent, elle a donné naissance à un nouveau départ pour l'Europe qui définira les mille prochaines années de son histoire. Avec l'aide de nations démocratiques telles que le Royaume-Uni, la France, l'Allemagne et les États-Unis, les flammes de la démocratie se sont propagées sur tout le continent et ont assuré les fondations de l'Union Européenne. Établie en 1993, l'Union Européenne a été créée pour garantir que l'Europe ne répète pas les erreurs des nations et des dirigeants passés, et qu'elle s'engage plutôt sur la voie du progrès. \n\nAujourd'hui, l'Union Européenne est une union culturelle, économique et politique des États européens. Nous sommes un phare brillant de progrès, de démocratie et d'unité, montrant au monde entier que l'Europe restera unie face aux difficultés actuelles et qu'elle les affrontera à l'avenir. Cela, dans un effort pour promouvoir la Paix, la Démocratie, la Diplomatie, la Santé, la Sécurité et les Droits de l'Homme sur tout le continent européen et au-delà. Ces valeurs et croyances fondamentales de l'Union Européenne sont ce qui maintient le continent uni face à l'avenir incertain qui nous attend. \n\nNous sommes Unis dans la Diversité."
completed_by_decision_tooltip: "§GAccompli par Décision§!"
generic.20.a: "Soit."
generic.20.d: "Bonjour, cher joueur.\nNous sommes conscients que le nombre de nations jouables est faible pour le moment, et que cette nation semble tout à fait jouable ! Oui, elle a des guerres, des idées, peut-être même quelques arbres de priorités. Mais malheureusement, le contenu de ce pays n'est pas adapté au joueur, il n'est adapté qu'à l'IA. La meilleure option serait donc de jouer avec une autre nation dont le contenu est adapté au joueur.\nRestez à l'écoute, patriotes !\nCordialement,\nLes développeurs de TFR"
generic.20.t: "AVERTISSEMENT : Nation sans Contenu"
