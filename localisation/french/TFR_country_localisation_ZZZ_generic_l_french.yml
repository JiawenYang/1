#Catégories de décisions
debug_decisions: "Décisions de débogage"
debug_decisions_desc: "Si vous lisez ceci... §Rvous allez en enfer§!."
ZZZ_debug_2020_master_on: "[DEBUG] Passer en 2020 (Chronologie TFR)"
ZZZ_debug_2020_master_on_tt: "Une fois activé, tout le contenu verrouillé par les dates de 2020 se déclenchera immédiatement : arbres de priorités TFR pour la Chine et les USA, mission pandémique chinoise, chronologie mondiale des événements (CHI/FRA/JAP/USA/BRM/ISR/TAL/MEX), événements de pandémie de divers pays et élection taïwanaise de 2020 (branche KMT par défaut). Les événements apparaissent selon leurs intervalles relatifs d'origine. Les grandes guerres comme la sixième guerre du Moyen-Orient ne sont PAS incluses et doivent être déclenchées via leurs propres décisions DEBUG. Réservé aux tests."
ZZZ_debug_2020_master_off: "[DEBUG] Désactiver le mode test de la chronologie 2020"
ZZZ_debug_2020_master_off_tt: "Efface les drapeaux de débogage afin que les vérifications quotidiennes cessent de déclencher du contenu ; les événements, drapeaux et arbres de priorités déjà déclenchés ne seront PAS annulés."
ZZZ_debug_2020_taiwan_kmt_win: "[DEBUG] Élection taïwanaise 2020 : Victoire du KMT"
ZZZ_debug_2020_taiwan_dpp_win: "[DEBUG] Élection taïwanaise 2020 : Victoire du DPP"
ZZZ_debug_MEW_war_start: "[DEBUG] Déclencher la sixième guerre du Moyen-Orient"
ZZZ_debug_MEW_war_start_tt: "Joue immédiatement la nouvelle annonçant la guerre ; la coalition arabe déclare la guerre à Israël 4 jours plus tard (intervalle calqué sur le 2020.10.5 → 10.9 réel). Indépendant de l'interrupteur général de la chronologie 2020 ; si la guerre a déjà été déclenchée, la chronologie ne la planifiera plus."
ZZZ_debug_gaw_start: "[DEBUG] Déclencher immédiatement la Grande Guerre asiatique"
ZZZ_debug_gaw_start_tt: "Déclenche instantanément la Grande Guerre asiatique : le Japon déclare la guerre à la Chine ; sur la péninsule coréenne (si aucune confédération neutre n'a été formée) la Corée du Nord pousse vers le sud et la Corée du Sud rejoint l'Organisation du traité du Pacifique ; les États-Unis rejoignent le camp de l'OTP. Exécute également l'initialisation complète PRC_gaw_start (définit les drapeaux globaux, charge les OOB de réserve GAW de toutes les nations impliquées, active les missions d'épuisement de guerre) et déclenche prc.1008 / jap.1002 pour débloquer les branches de focus GAW et les catégories de décisions pour la Chine et le Japon. Pour les tests uniquement."
