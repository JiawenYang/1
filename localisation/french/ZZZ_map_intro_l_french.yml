 MAPMODE_ECONOMY_ALLIANCE_MAP_MODE_NAME: "Alliance économique"
 MAPMODE_ECONOMY_ALLIANCE_MAP_MODE: "Alliance économique"
 MAPMODE_ECONOMY_ALLIANCE_MAP_MODE_DESCRIPTION: "Colorer le monde par alliance économique : montre l'union douanière et le marché commun de chaque pays."
 economy_alliance_map_mode_tooltip: "Ce mode de carte affiche les différentes alliances économiques."
 economy_alliance_map_mode_tooltip_delayed: "$economy_alliance_intro$"
 military_alliance_intro: "§YAlliances militaires§!\n\n£GFX_military_alliance_intro_embed \n\n§gPhrase d'accroche : une alliance n'est jamais un bouclier gratuit ; c'est une politique qu'il faut financer en continu, et qui peut être soldée à tout moment.§!\n\nLes alliances militaires sont l'héritage institutionnel de la guerre froide. L'OTAN fait de la défense collective de l'article 5 une obligation et échange le parapluie nucléaire nord-américain contre les forces conventionnelles européennes ; l'OTSC ne parle pas de valeurs communes, elle traduit simplement la supériorité militaire russe en capacité d'organisation dans l'espace postsoviétique. Aucun des deux systèmes n'a été bâti pour faire la guerre, mais pour qu'elle n'arrive pas. Leur vrai produit est la dissuasion : obliger l'adversaire à faire ses comptes avant de bouger.\n\nQu'une alliance fonctionne dépend d'abord de la manière dont le commandement est organisé et dont l'argent est partagé. Le système de commandement de l'OTAN est mené par Washington : l'Europe fournit des forces, des bases et des budgets, les États-Unis fournissent le parapluie nucléaire et la projection stratégique. Le débat sur le partage des charges revient chaque année, mais la vraie question n'est pas qui manque de quelques points de pourcentage — c'est qui accepte de continuer à payer, en temps de paix, pour une guerre qui pourrait ne jamais venir.\n\nL'accès aux bases est la charpente. Garnisons, ports, aérodromes et droits de survol sont des points sur une carte en temps calme, et en crise ils sont toute la réponse à la question de savoir si les forces peuvent atteindre le front. L'Amérique échange des garnisons contre la coopération, la Russie échange des garnisons contre la loyauté, les petits États échangent une part de souveraineté contre une police d'assurance — chacun de ces échanges a un prix, même quand il n'est pas écrit dans le traité.\n\nLa crédibilité repose sur deux choses : la capacité et la volonté. La capacité se compte, la volonté non. Quand la politique intérieure d'un allié bascule, l'engagement se réduit ; le texte du traité ne change pas, mais ceux qui l'exécutent changent. La vraie dissuasion n'est pas ce que dit le papier, mais ce que l'adversaire croit : que quelqu'un viendra réellement.\n\nLa périphérie révèle ce dont une alliance est vraiment faite. Les membres du noyau reçoivent le parapluie nucléaire et la réaction rapide ; les membres de la périphérie reçoivent des ventes d'armes, des exercices et des déclarations. Une alliance n'est jamais un club égalitaire — c'est une liste classée par valeur stratégique, et ce classement est réécrit à chaque crise.\n\nLa crise est l'heure de l'inspection. Perceptions de la menace divergentes, querelles d'argent et élections qui changent les gouvernements réduisent les engagements au dernier moment. Le scénario se répète dans l'histoire : le traité est entré en vigueur, les renforts ne sont pas venus — ou ils sont venus, et trop tard.\n\nLes couleurs de la carte sont peintes par les traités ; la sécurité réelle est payée par la volonté — et entre les deux se trouve une facture que personne ne veut régler d'avance."
 economy_alliance_intro: "§YAlliances économiques§!\n\n£GFX_economy_alliance_intro_embed \n\n§gPhrase d'accroche : une alliance économique ne vend pas des marchés, elle vend des règles — et le prix des règles ne figure jamais sur le tarif douanier.§!\n\nIl n'existe pas de modèle unique d'alliance économique. L'UE suit la voie supranationale et coud ses membres en un seul corps par un marché unique, une monnaie commune et une réglementation commune ; l'ANASE suit la voie intergouvernementale et tient dix économies ensemble par le consensus et la non-ingérence ; le CCG transforme les revenus pétroliers en capitaux et en main-d'œuvre transfrontaliers ; la CEDEAO attache une union douanière à l'intervention de maintien de la paix ; le MERCOSUR s'est longtemps arrêté au seuil de l'union douanière. Modèles différents, points de départ différents, plafonds différents.\n\nLe tarif n'est que le billet d'entrée. Ce qui décide vraiment de la qualité d'une alliance, ce sont les quatre choses qui se trouvent derrière : les normes, la monnaie, le travail et le capital. Les normes décident qui peut vendre ; la monnaie décide qui porte le risque de change ; la mobilité du travail décide qui peut travailler où ; la mobilité du capital décide qui peut construire où. Ce n'est qu'après ces quatre étapes qu'un accord commercial devient une communauté économique.\n\nLes normes sont la forme de pouvoir la moins visible et la plus efficace. Qui écrit la règle décide de ce à quoi ressemblent les produits des autres. L'UE étend son influence au-delà de ses membres par les normes réglementaires, les États-Unis coupent les chaînes d'approvisionnement par les normes techniques et le contrôle des exportations, et la Chine pose sa propre voie dans le monde en développement par les infrastructures et les normes de capacité.\n\nLa monnaie est le second abandon de souveraineté. Une monnaie commune supprime les frictions de change et signifie que les membres renoncent à une politique monétaire indépendante ; une dette commune partage le coût d'une crise et inscrit la discipline budgétaire dans le livre de quelqu'un d'autre. La libre circulation des capitaux apporte l'investissement, et la panique qui peut partir à tout moment.\n\nLa mobilité du travail est le maillon le plus souvent oublié. La libre circulation des personnes comble les pénuries de main-d'œuvre et crée une concurrence salariale et sociale entre les membres ; quand l'économie ralentit, la main-d'œuvre étrangère est généralement la première chose que la politique saisit comme explication.\n\nLa fragilité d'une alliance économique est la suivante : elle demande aux membres de partager les gains en période de prospérité et les coûts en temps de crise, et ces deux choses n'ont pas la même difficulté politique. Les à-coups macroéconomiques, les écarts de compétitivité industrielle et les balanciers politiques suffisent chacun à arrêter l'intégration à mi-chemin, ou à la faire reculer.\n\nLes couleurs de la carte marquent l'appartenance ; que cette appartenance devienne prospérité dépend de la volonté des membres de continuer à payer ensemble quand la crise arrive."
 org_eu_intro: "§YUnion européenne§!\n£GFX_power_eu_embed \n§gLégende : le Parlement européen à Strasbourg.§!\nL'UE unit ses membres par un marché unique, une monnaie commune et une réglementation harmonisée. C'est le bloc régional le plus intégré aujourd'hui, et la tentative la plus réussie de convertir le poids économique en capacité diplomatique et de défense."
 org_sco_intro: "§YOrganisation de coopération de Shanghai§!\n£GFX_org_sco_embed \n§gLégende : les corridors et les routes énergétiques d'Asie centrale.§!\nL'OCS relie l'Asie centrale, l'Asie du Sud et l'arrière-pays eurasien par la coopération sécuritaire et la connectivité. Elle n'a pas de clause de défense collective ; c'est plutôt une plateforme de coordination régionale soutenue conjointement par la Chine et la Russie."
 org_pec_intro: "§YCommunauté économique du Pacifique§!\n£GFX_org_pec_embed \n§gLégende : un réseau économique Asie-Pacifique mené par Tokyo.§!\nLa communauté use des règles commerciales, de l'investissement et des chaînes d'approvisionnement pour tisser un seul réseau entre l'Asie de l'Est et le pourtour pacifique. C'est le principal instrument du Japon pour convertir son poids économique en ordre régional."
 org_asean_intro: "§YAssociation des nations de l'Asie du Sud-Est§!\n£GFX_org_asean_embed \n§gLégende : Jakarta, siège du secrétariat de l'ANASE.§!\nL'ANASE maintient dix économies dans une communauté souple fondée sur le consensus et la non-ingérence. Elle ne recherche pas de pouvoir supranational et préserve la stabilité régionale par le dialogue et l'ouverture des marchés."
 org_gcc_intro: "§YConseil de coopération du Golfe§!\n£GFX_org_gcc_embed \n§gLégende : le cercle de sécurité collective et d'économie des États pétroliers du Golfe.§!\nLe CCG convertit les revenus pétroliers des monarchies du Golfe en capitaux, main-d'œuvre et coopération sécuritaire transfrontaliers. Il est à la fois une union douanière et un mécanisme de coordination politique face aux conflits régionaux."
 org_ecowas_intro: "§YCommunauté économique des États de l'Afrique de l'Ouest§!\n£GFX_org_ecowas_embed \n§gLégende : l'intégration et le maintien de la paix en Afrique de l'Ouest.§!\nLa CEDEAO repose sur une union douanière, la libre circulation et l'intervention de maintien de la paix, tentant d'établir l'ordre en Afrique de l'Ouest, minée par la pauvreté et les coups d'État. Son intégration économique est limitée, mais sa capacité d'intervention est rare parmi les organisations régionales africaines."
 org_mercosur_intro: "§YMarché commun du Sud§!\n£GFX_org_mercosur_embed \n§gLégende : l'union douanière et le marché commun de l'Amérique du Sud.§!\nLe MERCOSUR relie les économies du sud de l'Amérique du Sud par une union douanière et un marché commun. Longtemps entravé par les turbulences macroéconomiques et les revirements politiques de ses membres, il est un cas d'école de l'intégration régionale dans le monde en développement."
 org_au_intro: "§YUnion africaine§!\n£GFX_org_au_embed \n§gLégende : Addis-Abeba, siège de l'UA.§!\nL'UA porte le drapeau de l'unité continentale et de la médiation des conflits, réunissant plus de cinquante États africains dans un même cadre politique. Son intégration économique est limitée, mais elle dispose d'une voix singulière dans le maintien de la paix et la médiation des crises."
