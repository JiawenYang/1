 KOR_korean_immigration: "Citoyenneté difficile à obtenir"
 KOR_korean_immigration_desc: "La grande majorité de la population de [Root.GetName] appartenant à un même groupe ethnique, le pays partage un puissant nationalisme fondé sur l'ascendance commune et la conscience historique. Les étrangers souhaitant immigrer doivent non seulement passer un examen de citoyenneté exceptionnellement exigeant, mais aussi supporter un regard social exclusif."
