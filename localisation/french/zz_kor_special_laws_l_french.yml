 KOR_korean_education: "L'éducation pour l'université"
 KOR_korean_education_desc: "La société [Root.GetAdjective] se distingue avant tout par sa ferveur pour l'éducation. [Root.GetName] impose la scolarité jusqu'au collège ; le lycée est facultatif, mais le gouvernement soutient une éducation gratuite pour chaque élève. Les élèves [Root.GetAdjective] achèvent donc tout l'enseignement secondaire sans frais de scolarité. Pourtant, dans une société où le taux d'accès à l'université approche les soixante-dix pour cent, fréquenter l'université est déjà considéré comme une nécessité plutôt qu'un choix. L'éducation publique fait ainsi l'objet de critiques pour se concentrer exclusivement sur « l'éducation en vue de l'admission à l'université »."
