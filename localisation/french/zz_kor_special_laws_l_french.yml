 KOR_safety_law: "Exploitation tacite"
 KOR_safety_law_desc: "La croissance économique de la Corée est arrivée comme un miracle, mais ce miracle projette une ombre profonde.\nLa loi garantit peut-être les droits des travailleurs, mais dans les provinces, le salaire minimum est depuis longtemps resté lettre morte. La durée du travail figure constamment parmi les plus longues de l'OCDE, tandis que des dispositifs tels que le « système de salaire forfaitaire » empêchent une juste rémunération des heures supplémentaires.\nLa société coréenne permet ainsi une indéniable « exploitation tacite » du travail.\n\n- Respectez la loi sur les normes du travail ! (Jeon Tae-il)"
 KOR_police_law: "« Loi sur la sécurité nationale »"
 KOR_police_law_desc: "L'objet de la présente loi est d'assurer la sécurité de la nation ainsi que la survie et la liberté du peuple en réglementant les activités antiétatiques qui mettent en danger la sécurité de la nation.\n\nQuiconque loue, encourage, propage ou sympathise avec les activités d'un groupe antiétatique, de ses membres ou de ceux agissant sous ses ordres, en sachant que cela compromet l'existence, la sécurité ou l'ordre libéral-démocratique fondamental de la nation, ou qui propage ou incite à la rébellion nationale, sera puni d'un emprisonnement maximal de 7 ans."
 KOR_korean_welfare: "Protection sociale intégrée"
 KOR_korean_welfare_desc: "Le système de sécurité sociale de [Root.GetName] repose sur trois piliers : l'assurance sociale, l'aide publique et les services sociaux. Pour protéger les citoyens des risques fondamentaux menaçant leurs moyens de subsistance, l'adhésion à l'assurance maladie nationale, à la pension nationale, à l'assurance emploi et à l'assurance accidents du travail est obligatoire. Le système national de garantie des moyens de subsistance de base assure un niveau de vie minimal aux ménages à faible revenu en difficulté, tandis que l'État fournit également de nombreuses formes de soutien aux autres groupes vulnérables. Le système de sécurité sociale [Root.GetAdjective] s'est développé régulièrement, mais des angles morts subsistent dans son filet et l'empêchent de faire pleinement progresser le bien-être de chaque citoyen."
