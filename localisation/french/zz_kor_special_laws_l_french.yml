 KOR_equal_female: "Égalité des sexes"
 KOR_equal_female_desc: "La constitution et les lois de [Root.GetName] garantissent explicitement l'égalité entre les hommes et les femmes, et les femmes occupent une place élevée pour le niveau d'éducation et la participation au marché du travail. Dans la pratique, toutefois, l'écart de rémunération entre les sexes reste parmi les plus élevés du monde développé, les femmes peinent à accéder aux postes de direction en raison des charges de garde d'enfants et de ménage, et la natalité continue de baisser. L'égalité sur le papier n'a pas automatiquement produit l'égalité dans les faits."
