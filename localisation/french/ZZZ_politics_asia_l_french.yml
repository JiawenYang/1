 politicsjapan.11.t:0 "Les élections législatives japonaises de 2017"
 politicsjapan.11.d:0 "La 48e élection législative a rendu au Parti libéral-démocrate et au Komeito une majorité confortable. Le Parti démocrate constitutionnel est devenu la principale force d'opposition, tandis que les sociaux-démocrates et le Parti communiste japonais conservaient quelques sièges.\n\nSous la monarchie constitutionnelle, le scrutin désigne le parti au pouvoir et son soutien, non l'occupant du trône du Chrysanthème."
 politicsjapan.11.a:0 "Former le nouveau cabinet"

 politicsjapan.12.t:0 "Les élections législatives japonaises de 2021"
 politicsjapan.12.d:0 "La 49e élection législative a confirmé la coalition PLD–Komeito, avec une majorité réduite. Le Parti démocrate constitutionnel a progressé, et le Parti communiste japonais ainsi que les sociaux-démocrates ont conservé leurs quelques sièges.\n\nL'empereur reste hors du scrutin ; seuls le parti au pouvoir et son soutien populaire changent."
 politicsjapan.12.a:0 "Accepter le résultat"

 politicsjapan.13.t:0 "Les élections législatives japonaises de 2024"
 politicsjapan.13.d:0 "La 50e élection législative a privé l'alliance PLD–Komeito de sa majorité. Le Parti démocrate constitutionnel a progressé fortement, tandis que l'Ishin, le Parti démocrate du peuple, Reiwa Shinsengumi et le Parti communiste japonais gagnaient du terrain.\n\nLe PLD gouverne toujours en cabinet minoritaire. L'institution impériale n'est pas touchée par le vote."
 politicsjapan.13.a:0 "Poursuivre avec un cabinet minoritaire"

 politicsthailand.71.t:0 "Les élections thaïlandaises de 2019"
 politicsthailand.71.d:0 "Premier scrutin national depuis le coup d'État de 2014, tenu dans le cadre constitutionnel imposé par la junte. Pheu Thai a remporté le plus grand bloc, Palang Pracharath a suivi, et Future Forward a réalisé des débuts remarqués. Grâce au Sénat nommé par la junte, Prayut Chan-o-cha a formé une coalition et retrouvé le poste de Premier ministre.\n\nLa monarchie reste à l'écart du scrutin ; seuls le parti au pouvoir et son soutien sont décidés ici."
 politicsthailand.71.a:0 "Confirmer le gouvernement de coalition"

 politicsthailand.72.t:0 "Les élections thaïlandaises de 2023"
 politicsthailand.72.d:0 "Move Forward a obtenu le plus de sièges avec un programme réformiste, Pheu Thai suivant de près. La résistance du Sénat a empêché un gouvernement dirigé par Move Forward ; Pheu Thai a donc formé la coalition et Srettha Thavisin est devenu Premier ministre.\n\nLe résultat change le parti au pouvoir et le soutien des partis, pas le roi."
 politicsthailand.72.a:0 "Former la coalition menée par Pheu Thai"
