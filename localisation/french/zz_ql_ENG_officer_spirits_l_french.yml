 ql_ENG_army_academy_spirit_01:0 "Sandhurst et la formation des officiers"
 ql_ENG_army_academy_spirit_01_desc:0 "La Royal Military Academy Sandhurst assure la formation initiale des officiers de l'armée de terre britannique, en complément des écoles propres à chaque arme. La sélection est étroite et les standards sont maintenus volontairement élevés, afin qu'un corps d'officiers réduit suffise à soutenir une force professionnelle."
 ql_ENG_army_spirit_02:0 "Armée de terre professionnelle et compacte"
 ql_ENG_army_spirit_02_desc:0 "L'armée de terre britannique est réduite mais pleinement professionnelle, organisée autour d'une haute disponibilité, de la manœuvre interarmes et d'une artillerie concentrée plutôt que de formations de masse. Sa doctrine privilégie les réguliers entraînés, le déploiement rapide et la puissance de feu précise au nombre brut."
 ql_ENG_army_command_spirit_03:0 "Commandement des opérations conjointes"
 ql_ENG_army_command_spirit_03_desc:0 "Le quartier général permanent interarmées et l'état-major de la défense planifient et coordonnent les opérations des trois armées. Ciblage conjoint, renseignement partagé et chaîne de commandement opérationnelle unique permettent à une force réduite d'agir avec le poids d'une force bien plus nombreuse."
 ql_ENG_navy_command_spirit_04:0 "Tradition hauturière de la Royal Navy"
 ql_ENG_navy_command_spirit_04_desc:0 "La Royal Navy est conçue pour des opérations prolongées loin des côtes : déploiements à long rayon d'action, présence mondiale et projection amphibie appuyée par un groupe aéronaval. Son héritage de maîtrise des mers et de guerre expéditionnaire façonne encore l'entraînement et l'emploi de la flotte."
 ql_ENG_air_academy_spirit_05:0 "Formation au vol de la RAF"
 ql_ENG_air_academy_spirit_05_desc:0 "La formation au vol de la Royal Air Force est gérée de manière centralisée : les équipages passent de l'instruction élémentaire à la conversion opérationnelle selon des normes uniformes. L'accent est mis sur un niveau d'entraînement élevé et constant plutôt que sur une expansion rapide."
 ql_ENG_air_spirit_06:0 "Puissance aérienne de la RAF"
 ql_ENG_air_spirit_06_desc:0 "La supériorité aérienne et l'interception restent au cœur de la planification de la Royal Air Force. Les escadrons de chasse doivent disputer l'espace aérien hostile, protéger les packages de frappe et tenir le ciel au-dessus des îles comme des forces déployées."
 ql_ENG_air_command_spirit_07:0 "Puissance aérienne expéditionnaire de la RAF"
 ql_ENG_air_command_spirit_07_desc:0 "Les opérations expéditionnaires de la Royal Air Force associent appui aérien rapproché, escorte et déploiement rapide vers des théâtres lointains. La structure de commandement est conçue pour projeter un contingent aérien réduit mais capable partout où les intérêts britanniques l'exigent."
