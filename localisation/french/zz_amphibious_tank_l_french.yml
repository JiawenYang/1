l_french:
 ZZ_amphibious_tank_chassis_pt76: "PT-76"
 ZZ_amphibious_tank_chassis_pt76_desc: "Premier char amphibie soviétique d'après-guerre, utilisé par l'infanterie navale et les unités de reconnaissance pour l'appui feu amphibie."
 ZZ_amphibious_tank_chassis_type63: "Type-63"
 ZZ_amphibious_tank_chassis_type63_desc: "Char amphibie chinois dérivé du PT-76, doté d'un canon de 85 mm et longtemps utilisé par les unités amphibies de l'APL."
 ZZ_amphibious_tank_chassis_pt76b: "PT-76B"
 ZZ_amphibious_tank_chassis_pt76b_desc: "Version améliorée du PT-76 avec canon stabilisé et nouvelle mitrailleuse coaxiale, char amphibie principal de l'infanterie navale soviétique au début de la Guerre froide."
 ZZ_amphibious_tank_chassis_pt85: "PT-85"
 ZZ_amphibious_tank_chassis_pt85_desc: "Char amphibie nord-coréen dérivé du PT-76, réarmé d'un canon de 85 mm, utilisé par les unités de reconnaissance de l'APC."
 ZZ_amphibious_tank_chassis_type63_1: "Type-63-I"
 ZZ_amphibious_tank_chassis_type63_1_desc: "Première amélioration du Type 63, avec un nouveau moteur diesel et une propulsion nautique affinée."
 ZZ_amphibious_tank_chassis_type63_2: "Type-63-II"
 ZZ_amphibious_tank_chassis_type63_2_desc: "Seconde amélioration du Type 63, avec conduite de tir et mitrailleuse coaxiale modernisées."
 ZZ_amphibious_tank_chassis_type63a: "Type-63A"
 ZZ_amphibious_tank_chassis_type63a_desc: "Évolution majeure du Type 63 avec canon rayé de 105 mm et nouvelle tourelle, char amphibie principal de l'infanterie navale chinoise à la fin des années 1990."
