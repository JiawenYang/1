 #The Fire Rises : chaîne de la guerre civile afghane (portée)
 afghanistan.1.t: "L'accord de paix américain entre en vigueur"
 afghanistan.1.d: "Après l'accord de Doha, les forces américaines entament un retrait progressif tandis que le cessez-le-feu entre Kaboul et les talibans ne tient que par la méfiance mutuelle."
 afghanistan.1.a: "La paix, enfin ?"
 afghanistan.2.t: "Les talibans rompent le cessez-le-feu"
 afghanistan.2.d: "Les talibans accusent Kaboul de retarder la libération des prisonniers et annoncent une offensive générale. La ligne de cessez-le-feu devient un champ de bataille en une nuit."
 afghanistan.2.a: "La guerre civile reprend"
 afghanistan.3.t: "L'Émirat islamique d'Afghanistan est restauré"
 afghanistan.3.d: "Dans les provinces qu'ils contrôlent, les talibans proclament la restauration de l'Émirat islamique et appellent toutes les forces armées du pays à se soumettre."
 afghanistan.3.a: "L'Émirat est de retour"
 afghanistan.4.t: "Les talibans étendent leur contrôle"
 afghanistan.4.d: "Les combattants talibans prennent le Nouristan, le Kunar et le Badakhchan tandis que les unités gouvernementales se rendent ou se dispersent."
 afghanistan.4.a: "Province après province"
 afghanistan.5.t: "La ligne de Kaboul s'effondre"
 afghanistan.5.d: "Les forces gouvernementales désertent en masse et les avant-gardes talibanes approchent de la périphérie de la capitale. La panique gagne Kaboul."
 afghanistan.5.a: "La capitale est en danger"
 afghanistan.6.t: "Les provinces de l'Est changent de mains"
 afghanistan.6.d: "Les talibans consolident leur emprise sur les vallées de l'Est tandis que les seigneurs de la guerre locaux changent de camp."
 afghanistan.6.a: "L'Est est réglé"
 afghanistan.7.t: "Le Hazaradjat se soumet"
 afghanistan.7.d: "Les talibans concluent un accord avec les milices locales, et le Hazaradjat se soumet nominalement à l'Émirat islamique."
 afghanistan.7.a: "La négociation vaut mieux que le sang"
 afghanistan.8.t: "Les talibans proclament l'Émirat restauré"
 afghanistan.8.d: "Kaboul est tombée. Les talibans proclament la restauration de l'Émirat islamique d'Afghanistan, et vingt ans de guerre s'achèvent avec le retrait américain."
 afghanistan.8.a: "Une époque s'achève"
