  #National Focuses
  CHI_island_in_one_fate: "Une île, un destin"
  CHI_island_in_one_fate_desc: "Pour la première fois en quatre-vingts ans, le peuple de l’île fait face à une invasion militaire qui menace notre indépendance et notre souveraineté, cherchant à nous soumettre totalement sans laisser de place à la négociation. Malgré le sectarisme qui domine notre politique et polarise notre peuple, le maintien de l’indépendance vis-à-vis de Pékin est l’un des rares points communs sur lesquels la plupart de notre peuple peut s’entendre. Avec toutes les possibilités de préserver un statu quo précaire désormais réduites, les partisans de l’apaisement n’ont plus d’excuses pour faire des concessions, et nous pouvons commencer à mettre la politique de côté sous la bannière de la défense nationale."
  CHI_solidify_civil_defence: "Renforcer la défense civile"
  CHI_solidify_civil_defence_desc: "En tant qu’île densément peuplée, notre peuple est constamment exposé à des bombardements de toutes sortes. Nos coordinateurs sont surchargés par la défense militaire, et nos services d’urgence, totalement désorganisés, n’ont pas la capacité d’atteindre chaque civil dans le besoin. Heureusement, nous pouvons tirer parti de nos organisations de défense civile, développées depuis soixante ans en prévision d’une improbable invasion chinoise. En les combinant avec notre vaste réseau d’abris antiaériens, nous pouvons alléger la pression sur nos systèmes de services d’urgence surchargés tout en protégeant nos civils des horreurs de la guerre."
  CHI_guerilla_strategy: "Stratégie de guérilla"
  CHI_guerilla_strategy_desc: "Nous ne sommes pas en position de combattre l’APL de front. Nous sommes en retard en termes d’hommes et d’équipements déployés, d’expérience et de préparation, ainsi que de doctrine et de tactiques. Par conséquent, au lieu d’affronter l’APL directement, le quartier général de l’état-major a décidé d’adopter une approche différente : la guerre de guérilla. En tirant parti de notre terrain, incluant les zones urbaines denses, les côtes, les montagnes et les forêts, nous pouvons préserver notre capacité de combat et éviter la destruction totale de nos forces armées dès le premier jour. La combinaison de la guerre asymétrique, d’un terrain défavorable et d’un environnement complexe fera certainement payer aux envahisseurs chaque pouce de terrain qu’ils avanceront sur notre sol."
  CHI_disrupt_transportation: "Perturber les transports"
  CHI_disrupt_transportation_desc: "L’APL a touché le sol et utilise désormais nos quais et ports pour recevoir des équipements et des approvisionnements, qui sont ensuite envoyés à leurs forces en première ligne pour combler les pertes. Cela est totalement inacceptable. Heureusement, nos ingénieurs ont réussi à placer des explosifs dans les principales structures et routes des ports avant de se retirer, et nos missiles sont prêts à livrer des charges pour neutraliser les ports, forçant l’APL à effectuer des semaines de réparations si elle souhaite les remettre en service. Pendant cette période, l’APL sera affamée dans ses camps et perdra sa capacité à lancer des offensives, et nous aurons également l’opportunité de contre-attaquer, pouvant potentiellement éliminer de plus petites unités ennemies."
  CHI_hold_the_defence_line: "Tenir la ligne de défense"
  CHI_hold_the_defence_line_desc: "À la suite des bombardements préventifs de missiles et navals, nos défenses, notre organisation et nos communications sont complètement désorganisées. Pour renverser la situation en notre faveur, nous devons résister aux offensives les plus furieuses, intenses et sanglantes des premières semaines. Ce délai sera une partie importante de la restauration de nos capacités logistiques et de la relance de notre structure de commandement depuis le chaos total. Pour y parvenir, nous concentrerons nos ressources sur la restauration des communications et des connexions de transport, ainsi que sur le fait que nos armées se concentrent entièrement sur la défense plutôt que de chercher des opportunités risquées pour endommager les forces de l’APL."
  CHI_appeal_to_the_free_world: "Appel au monde libre"
  CHI_appeal_to_the_free_world_desc: "Avec les États-Unis plongés dans une horrible guerre intestine, l’ancien ordre international s’effondre sous nos yeux. Cependant, cela ne signifie pas que les forces démocratiques à travers le monde ont toutes disparu avec l’ancienne superpuissance, car de nombreux bastions et phares à travers le globe maintiennent encore les flambeaux de la démocratie. Certains d’entre eux sont prêts à soutenir des alliés idéologiques pour empêcher leur position internationale de se détériorer davantage. Les anciens ANMN, l’OTAN restante, la Corée du Sud et le Canada, pour n’en nommer que quelques-uns, sont tous prêts à parler en notre nom ou même à prendre des mesures contre les forces oppressives de la RPC sur le champ de bataille international."
  CHI_military_civilian_duty: "Devoir civilo-militaire"
  CHI_military_civilian_duty_desc: "Notre île est petite et surpeuplée. Avec peu ou pas de profondeur stratégique, le front intérieur est le front de combat. La RPC a montré son mépris pour la sécurité de nos civils en menant une invasion aussi risquée, et avec les pertes civiles déjà signalées, nous pouvons complètement briser la rhétorique des défaitistes, qui prétend que la « réunification » sera rapide et sans effusion de sang. Avec eux hors du chemin, nous pouvons commencer à promouvoir l’unité civilo-militaire, permettant à notre peuple de nous aider dans le fonctionnement d’une société en temps de guerre."
  CHI_grant_emergency_powers: "Accorder des pouvoirs d’urgence"
  CHI_grant_emergency_powers_desc: "Le temps de guerre n’est pas le moment pour des processus bureaucratiques longs qui limitent la capacité de la branche exécutive à réagir rapidement aux urgences. Avec l’APL à notre porte, le président déclarera l’état d’urgence, annoncera la loi martiale et accordera plus de pouvoir à l’armée pour contrôler la situation. Les forces de l’ordre seront temporairement intégrées dans les structures de commandement militaire pour réprimer les sabotages et manifestations collaborationnistes, ainsi que pour leur permettre de distribuer les ressources de manière plus équitable et efficace par la règle des armes."
  CHI_engineering_maintenance_brigade: "Brigade de maintenance d’ingénierie"
  CHI_engineering_maintenance_brigade_desc: "Alors que les bombardiers et l’artillerie de l’APL martèlent notre sol, nos activités économiques sont soit perturbées, soit complètement arrêtées. Les secteurs les plus touchés sont la construction et les infrastructures. Craignant des frappes ciblées pouvant causer d’immenses dégâts, les entreprises de construction et les compagnies publiques fournissant des services nécessaires ont temporairement suspendu tous les travaux de construction et de maintenance, laissant des dizaines de milliers de travailleurs et d’ingénieurs sans emploi, et donc incapables de subvenir aux besoins de leurs familles. Pour utiliser leur expertise à notre avantage, nous pouvons offrir des opportunités d’emploi qui seraient considérées comme lucratives même en temps de paix, et établir la Brigade de maintenance d’ingénierie. Cette unité pourra nous soutenir dans des projets d’ingénierie militaire, nous permettant d’établir rapidement des fortifications multicouches, ainsi que de traverser des environnements difficiles plus rapidement que les forces communistes."
  CHI_withdraw_foreign_exchange: "Retirer les réserves de change"
  CHI_withdraw_foreign_exchange_desc: "Bien que nos réserves de change massives aient maintenu notre économie robuste et notre monnaie stable en temps de paix, ce stock important de devises étrangères peut également être utilisé à notre avantage pour la défense nationale et la stabilité économique. En retirant des portions de nos réserves, nous pouvons tenter de stabiliser la panique financière en cours, en rachetant les actifs et les devises vendus pour maintenir notre économie quelque peu fonctionnelle même pendant une guerre. De plus, elles peuvent également être utilisées pour acheter des équipements critiques afin de combler les pertes, maintenant nos forces capables de repousser les envahisseurs."
  CHI_unite_the_island: "Unir l’île"
  CHI_unite_the_island_desc: "L’invasion brutale des communistes a touché tous ceux qui considèrent cette île comme leur foyer. De Taipei à Kaohsiung, des zones urbaines aux zones rurales, des forêts de béton aux terres agricoles calmes, des provinces vert foncé aux provinces bleu foncé – rien n’est épargné par les flammes dévastatrices de la destruction, et plus personne ne peut prétendre avec assurance que ce conflit « ne les concerne pas ». Nous devons repousser les agresseurs. S’ils peuvent mettre en danger la vie et le bien-être de millions de personnes, pouvons-nous vraiment espérer que la soi-disant « réunification » sera réellement bénéfique pour nous ? L’île doit se battre comme un seul homme pour avoir une chance de victoire, et une défaite garantirait la privation de notre liberté, de notre démocratie et de notre connexion avec nos alliés démocratiques."
  CHI_wolf_pack_tactics: "Tactiques de meute"
  CHI_wolf_pack_tactics_desc: "En tant que nation insulaire, notre industrie de la pêche est prospère et importante, employant des dizaines de milliers de personnes et d’innombrables bateaux de pêche. Bien que le conflit ait perturbé leurs activités et que tous soient désormais à quai indéfiniment, l’état-major a proposé un plan unique pour tenter de briser le blocus imposé par la PLAN. En mobilisant et en réquisitionnant de petits navires civils, nous pouvons les envoyer chercher des ressources auprès de nos partenaires commerciaux pour alléger nos pénuries. Grâce à leur petite taille et leur vitesse relativement rapide, non seulement ils sont difficiles à repérer, mais ils peuvent également se désengager rapidement et éviter d’être coulés. Bien qu’ils ne soient pas capables d’importer suffisamment pour relancer l’économie, les ressources indispensables peuvent restaurer nos services les plus vitaux, renforçant le moral de notre peuple."
  CHI_phantom_legions: "Légions fantômes"
  CHI_phantom_legions_desc: "Notre force aérienne est sévèrement surpassée face à la flotte large et avancée d’aéronefs de l’APL, ce qui entraîne des attaques constantes de nos troupes et de nos bâtiments clés par des avions d’attaque et des bombardiers, de jour comme de nuit. Bien que nous ne puissions pas détruire leur capacité à bombarder, nous pourrions être en mesure de détourner leurs bombes ailleurs. Nos commandants ont proposé une idée intéressante : déployer des installations leurres à travers l’île, généralement faites de ballons, de planches ou de matériaux similaires peu coûteux, pour tromper l’APL et leur faire gaspiller des munitions sur de faux objectifs. Bien que cela puisse sembler non conventionnel, nos ingénieurs ont signalé qu’ils peuvent le faire fonctionner – il ne leur manque que notre approbation pour commencer."
  CHI_taiwan_still_brave: "Taïwan, toujours éternel"
  CHI_taiwan_still_brave_desc: "Ayant survécu aux semaines les plus dures et les plus dangereuses du conflit, nous avons réussi à briser le plan initial de l’APL de nous vaincre et de nous soumettre rapidement. Non seulement nous avons choqué les observateurs internationaux qui prédisaient notre défaite rapide, mais le peuple croit désormais de tout cœur que la victoire n’est pas hors de portée, et nos forces armées et civils se tiennent désormais ensemble, prêts à repousser l’agresseur qui menace notre droit à l’autodétermination. Avec notre flambeau de la liberté toujours brillant, chaque Taïwanais peut désormais dire avec fierté que Taïwan est toujours courageux, et nous n’abandonnerons pas."
