  CHI_destroyed_country: "Nation détruite"
  CHI_destroyed_country_desc: "Bien que la guerre soit terminée, notre pays ne sera plus jamais le même. Le son des sirènes résonne encore dans les oreilles de la population, alors que les frappes de missiles, les raids aériens et les tirs d’artillerie ont dévasté non seulement notre réseau autoroutier, mais aussi notre système ferroviaire et nos services de métro. Le temps de trajet moyen a triplé depuis la guerre, et comme si cela ne suffisait pas, notre industrie manufacturière a été complètement anéantie. Nos parcs de recherche à travers l’île ont été terrorisés par des frappes ciblées, et les investisseurs étrangers se sont retirés de nos pools d’investissement. Il faudra des efforts conjoints de notre gouvernement et de nos alliés pour restaurer notre statut de centre technologique mondial."
