roc.13.d: "Après avoir repoussé les troupes du continent lors de la récente guerre, Taïwan a annoncé qu'il est désormais en mesure de tenir à nouveau des élections libres conformément à la constitution. Comme la récente guerre a suscité une haine massive envers la Chine continentale, le Kuomintang a perdu une part importante d'électeurs qui le blâment pour son incapacité à assurer la paix ou le voient comme des collaborateurs potentiels de la Chine continentale. En conséquence, le Parti démocrate progressiste sous [CHI.GetLeader] a facilement remporté les élections et obtenu un nouveau mandat.\n\nToutes les parties ayant accepté les résultats électoraux, la nouvelle direction annonce déjà des plans pour la reconstruction."
