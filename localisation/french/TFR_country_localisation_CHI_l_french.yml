  taiwan.13.t: "Cheng Wen-tsan remporte la présidence de Taïwan"
  taiwan.13.d: "Après avoir repoussé les troupes du continent lors de la récente guerre, Taïwan a annoncé qu’il est désormais en mesure de tenir à nouveau des élections libres conformément à la constitution. Comme la guerre récente a suscité une haine massive contre la Chine continentale, le Kuomintang a perdu une part importante d’électeurs qui blâment le KMT de ne pas avoir réussi à garantir la paix ou le considèrent comme un possible collaborateur de la Chine continentale. En conséquence, le PPD sous [CHI.GetLeader] a facilement remporté les élections et a réussi à obtenir un nouveau mandat.\n\nAlors que toutes les parties ont accepté les résultats des élections, le nouveau leadership annonce déjà des plans pour la reconstruction."
  taiwan.13.a: "La marée verte déferle."
