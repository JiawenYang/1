  taiwan.4.t: "Élection présidentielle taïwanaise de 2020"
  taiwan.4.d: "L’événement le plus important entre le Nouvel An occidental et le Nouvel An chinois, les élections taïwanaises de 2020, déterminera à la fois le pouvoir législatif et la présidence. La phase finale de la campagne a repris après une pause d’une semaine en raison du tragique crash d’un hélicoptère Black Hawk le 2 janvier, et les candidats ont tenu leurs rassemblements politiques finaux et les plus importants dans plusieurs grandes villes.\n\nReprésentant le camp pro-Vert, il y a la présidente sortante Tsai Ing-wen, la première femme présidente de Taïwan et la première d’ascendance indigène. Professeure de droit avec une carrière politique remontant à 2000, son expérience et son professionnalisme sont souvent cités par ses partisans comme des raisons pour lesquelles elle est le choix le plus qualifié. Malgré un premier mandat turbulent, ses taux d’approbation sont en hausse depuis juillet 2019, et de nombreux observateurs prédisent une victoire Verte.\n\nDu côté pro-Bleu, il y a Han Kuo-yu, l’actuel maire de Kaohsiung, qui a fait face à des critiques des résidents de la ville pour les avoir soi-disant « abandonnés ». Titulaire d’une maîtrise en droit, Han n’est revenu en politique qu’en 2017, ce qui rend son expérience pâle en comparaison avec celle de la candidate du PPD. Néanmoins, ses partisans soutiennent que les performances insuffisantes du PPD ont rendu les électeurs avides de changement, beaucoup croyant que son style politique non orthodoxe pourrait inaugurer une nouvelle ère dorée pour Taïwan.\n\nJames Soong est également dans la course, bien que l’attention publique qu’il reçoit prenne souvent la forme de blagues plutôt que d’un engagement politique sérieux.\n\nLe lendemain d’une nuit épuisante de rassemblements finaux, les citoyens à travers le pays se rendent aux bureaux de vote les plus proches pour décider de l’avenir de leur nation. À la tombée de la nuit, alors que les votes sont comptés, le résultat final est annoncé :"
  taiwan.4.a: "Tsai Ing-wen et les Pan-Verts raflent tout !"
  taiwan.4.b: "Han Kuo-yu et les Pan-Bleus accèdent au pouvoir !"
  taiwan.5.t: "Tsai Ing-wen obtient un second mandat"
  taiwan.5.d: "Après une longue nuit de dépouillement des votes, et avec des millions de personnes rivées à leurs télévisions pour suivre les résultats, les chaînes d’information, ainsi que les sources officielles, ont enfin déclaré le vainqueur : la présidente Tsai Ing-wen obtient un second mandat !\n\nCela était attendu par de nombreux observateurs internes et externes, car non seulement Tsai Ing-wen a plus d’expérience et bénéficie de la préférence pour la réélection d’un président en exercice, mais les scandales de son adversaire et plusieurs désastres en relations publiques ont également persuadé les électeurs centristes et même certains partisans Pan-Bleus de soutenir Tsai à la place.\n\nDe plus, le PPD a également remporté la majorité à l’Assemblée législative, obtenant environ 45 % des votes et 60 sièges – assez pour contrôler le législatif. Cela garantit un mandat fluide pour Tsai Ing-wen et, par extension, l’ensemble du PPD.\n\nCela a provoqué un tollé parmi une partie des partisans Pan-Bleus, qui ont exigé un recomptage des voix avec une poignée de leaders du Kuomintang. Cependant, avec Han Kuo-yu déclarant publiquement son acceptation de la défaite, ces mouvements se sont rapidement essoufflés, et la République a achevé une autre élection pacifique."
  taiwan.5.a: "Le drapeau vert s’élève dans le ciel !"
  taiwan.6.t: "Han Kuo-yu remporte la présidence dans un revirement"
  taiwan.6.d: "Après une longue nuit de dépouillement des votes, et avec des millions de personnes rivées à leurs télévisions pour suivre les résultats, les chaînes d’information, ainsi que les sources officielles, ont enfin déclaré le vainqueur : le maire Han Kuo-yu remporte la victoire !\n\nDe nombreux observateurs internationaux et nationaux ont été surpris par ce résultat, car Tsai Ing-wen avait plus d’expérience et bénéficiait de la préférence pour la réélection d’un président en exercice. Cependant, il semble que la politique de Han Kuo-yu ait réussi à conquérir le cœur des gens. De plus, de nombreux électeurs centristes, déçus par le PPD, ont choisi de soutenir les Pan-Bleus lors de cette élection pour exprimer leur mécontentement.\n\nD’autre part, le Kuomintang a également repris le pouvoir législatif. Avec 44 % des votes populaires et 62 sièges, le KMT a pu se rétablir comme la majorité, réduisant le PPD à une opposition minoritaire, garantissant un mandat fluide pour Han Kuo-yu.\n\nUne partie de la faction Pan-Verte a désapprouvé le résultat, affirmant que l’élection avait été manipulée, et a exigé un recomptage avec une poignée de leaders du PPD. Cependant, alors que Tsai Ing-wen et son équipe ont publiquement envoyé un message au public pour accepter la défaite et féliciter le nouveau président, les protestations se sont rapidement éteintes, et la République a achevé une autre élection pacifique.\n\nPour Han Kuo-yu personnellement, comme il est interdit de servir à la fois comme maire et président simultanément, il est forcé de démissionner de son poste de maire de Kaohsiung. Une élection partielle sera organisée dans les trois mois pour décider du prochain gouvernement local, et les mouvements qui militaient pour le rappel de Han Kuo-yu se sont par la suite dissous."
  taiwan.6.a: "Le Soleil Blanc brille sur la République !"
