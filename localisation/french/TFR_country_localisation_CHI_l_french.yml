  taiwan.16.t: "Ko Wen-je victorieux aux élections taïwanaises"
  taiwan.16.d: "Après avoir repoussé les troupes du continent lors de la récente guerre, Taïwan a annoncé qu’il est désormais en mesure de tenir à nouveau des élections libres conformément à la constitution. Comme la guerre récente a suscité une haine massive contre la Chine continentale, le camp bleu a perdu une part importante d’électeurs qui blâment le parti de ne pas avoir réussi à garantir la paix ou le considèrent comme un possible collaborateur de la Chine continentale. Pendant ce temps, les politiciens du camp vert ont également subi un coup dur, étant blâmés pour avoir conduit à la guerre et au bain de sang qui viennent de frapper Taïwan. Par ailleurs, les politiques radicales de la présidence précédente ont poussé de nombreux électeurs neutres du côté du PPT. En conséquence, un outsider politique – le Parti populaire de Taïwan sous Ko Wen-je – a réussi à défier avec succès le système bipartisan bleu-vert traditionnel de Taïwan, remportant une première présidence.\n\nLe nouveau président Ko Wen-je a remercié tous ses partisans pour avoir accompli un tel miracle politique et a, dans le même temps, annoncé ses propres plans pour la reconstruction."
