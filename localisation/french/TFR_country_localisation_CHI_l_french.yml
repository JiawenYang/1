roc.31.t: ""
roc.32.a: "Et notre peuple marche sur la route de la vie"
roc.32.d: "Après des semaines de combats acharnés, l'Armée populaire de libération a été arrêtée net face à la résistance farouche de l'ODTP et a échoué dans son objectif de submerger nos forces armées et notre gouvernement. Ces derniers jours, les rapports de renseignement indiquent que l'APL abandonne les territoires conquis, bien que cette information soit gardée secrète au cas où une contre-attaque surprise de l'APL surviendrait. Cependant, avec les sources japonaises et australiennes confirmant que les forces communistes se retirent sur tous les fronts – y compris Kinmen –, le bureau présidentiel a enfin annoncé la victoire des forces démocratiques à l'aube.\n\nL'aviation et la marine ont suivi le mouvement, cessant toutes les opérations militaires après le retrait des forces d'invasion terrestres, rendant à nouveau les cieux et les mers ouverts. Nos quais et aéroports dévastés reçoivent désormais de l'aide humanitaire du monde entier, la majorité provenant de nos alliés de l'ODTP.\n\nCependant, ce n'est pas fini. Nos villes gisent en ruines, nos usines ont été détruites, nos chemins de fer et nos autoroutes sont paralysés, et notre joyau de la couronne – l'industrie des semi-conducteurs – a été complètement anéantie. Non seulement cela, mais les renseignements de l'ODTP suggèrent que la défaite majeure des communistes déclenchera presque certainement un tumulte politique, potentiellement invitant une direction encore plus agressive qui pourrait menacer notre démocratie et notre liberté dans les années à venir. Pour l'instant, une tâche monumentale de reconstruction nous attend."
roc.32.t: "À la fin... Nous tenons bon !"
roc.33.a: "Levez-vous et combattez !"
roc.33.d: "La guerre de vie ou de mort est revenue dans la République une fois de plus.\n\nSeulement quelques jours après le début de la quatrième crise du détroit, des missiles du continent ont, pour la première fois, frappé nos infrastructures clés et nos villes. Tandis que le ministère de la Défense nationale mobilise frénétiquement les réservistes et prépare la défense, une seconde vague de frappes de missiles s'abat sur nous – cette fois dévastant nos capacités administratives et de communication.\n\nPourtant, les rares stations radar survivantes ont détecté quelque chose de bien plus terrifiant : d'innombrables navires d'assaut amphibie et leurs escortes approchent rapidement de nos côtes, signalant une invasion imminente. Cela ne peut signifier qu'une chose : la quatrième crise du détroit est terminée, la guerre de Taïwan a commencé.\n\nMalgré l'absence des États-Unis, nous ne sommes pas seuls. Des forces d'intervention de l'ODTP assistent désormais à notre défense sur tous les fronts, se tenant épaule contre épaule avec nous sur les plages pour repousser toute troupe osant défier notre intégrité territoriale.\n\nNous devons maintenant combattre et rester défiants face au géant rouge. Si nous échouons, la torche ardente de la démocratie chinoise sera éteinte pour toujours."
roc.33.t: "Seconde vague de frappes de missiles !"
roc.34.a: "Nous vaincrons sûrement..."
roc.34.d: "Destinataire : Bureau présidentiel\nPriorité : Priorité absolue\nSujet : État actuel de notre défense nationale\n\nNotre objectif principal de prévenir l'avancée de l'Armée populaire de libération dans Taïwan a échoué. L'APL a exploité les vulnérabilités de nos défenses et contrôle désormais plusieurs grandes villes et ports, handicapant sévèrement notre effort de guerre. Cet objectif non atteint, nous ne pouvons plus confiner le conflit aux côtes et sommes forcés de nous engager dans un terrain urbain et montagneux.\n\nL'APL a atteint notre seconde ligne de défense entourant les villes et chaînes de montagnes restantes, qui peut être utilisée à notre avantage en défense en raison de la complexité des environnements urbains et montagneux. Notre armée a déjà établi des positions défensives autour des villes contrôlées par la RPC et est mieux positionnée pour arrêter les avancées supplémentaires de l'APL.\n\nL'ODTP a également subi de lourdes pertes lors de ce conflit. Cela a eu un impact psychologique inattendu sur nos civils et nos forces armées. Reconnaissant que l'ODTP est vraiment nos frères d'armes, nous avons reçu un afflux de volontaires civils soutenant nos préparatifs de défense et notre logistique. Cela a renforcé notre moral et nos capacités défensives, et les commandants rapportent que la volonté et la préparation de nos forces terrestres sont plus élevées que jamais."
roc.34.t: "Lettre du ministère de la Défense nationale"
roc.35.a: "Quand dois-je commencer ?"
roc.35.d: "6 h 27. « [Alerte de défense aérienne] Avions ennemis en approche. Cherchez immédiatement un abri. » Dans la quatrième semaine depuis la suspension abrupte des cours, Kai Chih-li se réveille avec une autre alarme stridente de raid aérien, accompagnée de nuages épais dans un ciel sur le point de pleuvoir des bombes. Trois F-16 rugissent dans le ciel pour intercepter, étouffant presque les cris de la police : « Ne prenez pas l'ascenseur, prenez les escaliers ! »\n\n6 h 50. « [Alerte de défense aérienne] Alerte de défense aérienne levée. Signalez les objets inconnus à la police ou aux pompiers. » Les martèlements s'arrêtent, et les abrités sortent ordonnément pour commencer leurs routines de temps de guerre. Kai se précipite vers le FamilyMart où il travaille pour préparer son quart de 8 h. Une douzaine de clients attendent déjà dehors, tenant un mélange de billets, de pièces et de timbres alimentaires émis par le gouvernement. Rien d'inhabituel aujourd'hui – sauf qu'on lui a dit de former l'interne à organiser les timbres usagés pour la collecte.\n\n14 h. « Notification CWA Heure du Soleil – Ensoleillement suffisant aujourd'hui jusqu'à 18 h 35. » « Manager Chen – Imprimez 100 copies de cela et distribuez-les. Demande du gouvernement. PA20018583.pdf. » Il y a deux heures, il s'accrochait encore à un mince espoir quand le soleil a percé, mais la mise à jour CWA l'a confirmé – pas de quart court aujourd'hui. Déçu, il demande à l'interne d'imprimer les dépliants pendant qu'il retourne à la caisse après une courte pause.\n\n18 h 50. Le trafic internet civil est restreint par les FAI pour conserver la bande passante et l'électricité. Les lampadaires clignotent brièvement pour prévenir les accidents, bien que les voitures soient rares maintenant en raison du rationnement de carburant. En rentrant chez lui, Kai repère un stand avec une nappe en camouflage vert – comme ceux des festivals scolaires. Curieux, il s'approche. Le responsable du stand lui fait signe. « Nous organisons des groupes de défense civile », dit-il. « Rejoignez nos programmes de formation sur l'identification des UXO et le traitement des blessures pour soutenir nos pompiers et paramédics. »\n\n18 h 52. Kai prend un dépliant et lit. Sponsorisé par le gouvernement, volontaire, sans armes, pas une milice ni une unité de chair à canon. Les FAQ répondent à la plupart de ses questions. Après une pause, il inspire profondément.\n\n18 h 57."
roc.35.t: "Réplique"
roc.4.a: "Tsai Ing-wen et le camp pan-vert remportent tout !"
roc.4.b: "Han Kuo-yu et le camp pan-bleu accèdent au pouvoir !"
roc.4.d: "L'événement le plus important entre le Nouvel An occidental et le Nouvel An chinois, les élections taïwanaises de 2020, déterminera à la fois le législatif et la présidence. La phase finale de la campagne a repris après une semaine de pause due au tragique accident d'hélicoptère Black Hawk le 2 janvier, et les candidats ont tenu leurs plus grands rassemblements politiques dans plusieurs grandes villes.\n\nReprésentant le camp pro-vert est la présidente sortante Tsai Ing-wen, première femme présidente de Taïwan et première d'ascendance indigène. Professeure de droit avec une carrière politique remontant à 2000, son expérience et son professionnalisme sont souvent cités par les soutiens comme raisons pour lesquelles elle est le choix le plus qualifié. Malgré un premier mandat turbulent, ses taux d'approbation sont en hausse depuis juillet 2019, et de nombreux observateurs prédisent une victoire verte.\n\nDu côté pro-bleu se trouve Han Kuo-yu, maire actuel de Kaohsiung, qui a fait face à des critiques des résidents de la ville pour les avoir soi-disant « abandonnés ». Titulaire d'une maîtrise en droit, Han n'est revenu en politique qu'en 2017, rendant son expérience pâle en comparaison de celle de la candidate du PDP. Néanmoins, ses soutiens arguent que les performances médiocres du PDP ont laissé les électeurs avides de changement, beaucoup croyant que son style politique non conventionnel pourrait usher une nouvelle ère dorée pour Taïwan.\n\nJames Soong est aussi dans la course, bien que la plupart de l'attention publique qu'il reçoit prenne la forme de blagues plutôt que d'engagement politique sérieux.\n\nLe jour après une nuit épuisante de rallyes finaux, les citoyens à travers le pays se rendent aux bureaux de vote les plus proches pour décider de l'avenir de leur nation. Alors que la nuit tombe et que les votes sont comptés, le résultat final est déclaré :"
roc.4.t: "Élection présidentielle taïwanaise de 2020"
roc.5.a: "Le drapeau vert s'élève dans le ciel !"
roc.5.d: "Après une longue nuit de comptage des votes, et avec des millions rivés à leurs téléviseurs pour suivre les résultats, les chaînes d'information, ainsi que les sources officielles, ont enfin déclaré le vainqueur – que la présidente Tsai Ing-wen assure un second mandat !\n\nCeci était attendu par de nombreux observateurs internes et externes, car non seulement Tsai Ing-wen a plus d'expérience et bénéficie de la préférence pour réélire un président sortant, mais les scandales de son adversaire et multiples catastrophes de relations publiques ont aussi persuadé les électeurs centristes et même certains soutiens pan-bleus de soutenir Tsai à la place.\n\nDe plus, le PDP a également remporté la majorité au Yuan législatif, obtenant environ 45 % des voix et 60 sièges – assez pour contrôler le législatif. Cela assure un mandat fluide pour Tsai Ing-wen et, par extension, pour l'ensemble du PDP.\n\nCela a provoqué un tollé parmi une partie des soutiens pan-bleus, qui ont exigé un recompte avec une poignée de leaders du parti Kuomintang. Cependant, avec Han Kuo-yu déclarant ouvertement son acceptation de la défaite, ces mouvements se sont rapidement essoufflés, et la République a complété une autre élection pacifique."
roc.5.t: "Tsai Ing-wen assure un second mandat"
roc.500.a: "Aux armes !"
roc.500.d: "Après des semaines de mouvements suspects de l'EAID et la tension croissante de la guerre froide sino-japonaise atteignant un nouveau climax, de nombreux observateurs internationaux ont anticipé une guerre chaude dans un avenir proche. Bien que l'ODTP ait intensifié ses missions diplomatiques pour tenter de désescalader la situation, Tokyo et Pékin ont tous deux annoncé qu'un état de guerre existe désormais entre les deux coalitions, et nous sommes forcés de combattre pour notre existence continue une fois de plus.\n\nToutes les efforts diplomatiques ayant échoué, le conflit régional le plus féroce de l'Asie-Pacifique s'est déroulé devant nous. Avec plus de 3 milliards de personnes impliquées dans la plus grande guerre que l'humanité ait vue jusqu'à présent, nous ne pouvons pas réalistement espérer que les Chinois se retireront simplement cette fois. Soit l'ODTP démantèle complètement la machine de guerre chinoise et sa capacité à raviver tout conflit, soit l'EAID avancera pour subjuguer le reste de l'Asie.\n\nPour nous, c'est la seconde fois que nous affrontons une menace existentielle ce siècle. Battus mais non conquis, le nouveau gouvernement chinois, motivé par son sentiment revanchard et ses nouveaux alliés à travers l'Asie, tentera sans doute de démanteler notre gouvernement et de détruire notre système démocratique, comme ils l'ont tenté en 2021. Pour sécuriser un avenir à nous, nous avons décidé de nous impliquer dans la grande guerre asiatique, combattant côte à côte avec nos alliés démocratiques pour vaincre l'alliance menée par Pékin, une fois pour toutes."
roc.500.t: "Notre guerre finale"
roc.6.a: "Le soleil blanc brille sur la République !"
roc.6.d: "Après une longue nuit de comptage des votes, et avec des millions rivés à leurs téléviseurs pour suivre les résultats, les chaînes d'information, ainsi que les sources officielles, ont enfin déclaré le vainqueur – que le maire Han Kuo-yu assure la victoire !\n\nDe nombreux observateurs internationaux et domestiques ont été surpris par ce résultat, car Tsai Ing-wen avait plus d'expérience et bénéficiait de la préférence pour réélire un président sortant. Cependant, il semble que la politique de Han Kuo-yu ait réussi à conquérir les cœurs des gens. De plus, de nombreux électeurs centristes, déçus par le PDP, ont choisi de soutenir le camp pan-bleu dans cette élection pour exprimer leur insatisfaction.\n\nD'autre part, le Kuomintang a également repris le pouvoir législatif. Avec 44 % des voix populaires et 62 sièges, le KMT a pu se rétablir comme majorité, réduisant le PDP à une opposition minoritaire, assurant un mandat fluide pour Han Kuo-yu.\n\nUne partie de la faction pan-verte a désapprouvé le résultat, affirmant que l'élection était manipulée, et a exigé un recompte avec une poignée de leaders du PDP. Cependant, comme Tsai Ing-wen et son équipe ont ouvertement envoyé un message au public pour accepter la défaite et féliciter le nouveau président, les protestations se sont rapidement essoufflées, et la République a complété une autre élection pacifique.\n\nPour Han Kuo-yu personnellement, puisqu'il est interdit de servir à la fois comme maire et président, il est forcé de démissionner de son poste de maire de Kaohsiung. Une élection partielle sera tenue dans les trois mois pour décider du prochain gouvernement local, et les mouvements qui plaidaient pour le rappel de Han Kuo-yu se sont par la suite dissous."
roc.6.t: "Han Kuo-yu assure la présidence dans une surprise"
