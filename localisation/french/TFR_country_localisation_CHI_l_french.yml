  taiwan.25.t: "La Septième Flotte des États-Unis reste à Taïwan"
  taiwan.25.d: "Avec l’éclatement de la guerre civile sur le continent américain, la communauté internationale continue de suivre le statut des déploiements militaires américains à l’étranger. Récemment, certains navires de la Septième Flotte des États-Unis ont continué à opérer près du détroit de Taïwan, rendant la situation régionale plus compliquée.\n\nLe porte-parole du ministère chinois de la Défense a déclaré que, malgré les troubles internes, les États-Unis continuent de provoquer des incidents sur la question de Taïwan, violant le principe d’une seule Chine, s’ingérant dans les affaires internes de la Chine et sapant la paix et la stabilité régionales. Le porte-parole a également réaffirmé que Taïwan est une partie inséparable de la Chine. L’Armée populaire de libération reste en état d’alerte élevé et contre résolument tout acte provocateur pour sauvegarder la souveraineté nationale et l’intégrité territoriale.\n\nLa Septième Flotte a déclaré que ses opérations dans la région indo-pacifique se poursuivraient « comme à l’accoutumée », mettant l’accent sur la liberté de navigation, et a affirmé qu’elle continuerait à mener des activités dans les eaux autorisées par le droit international. Le département américain de la Défense a souligné que la mission de la Septième Flotte « reste inchangée par les circonstances nationales ».\n\nLes experts ont critiqué la Septième Flotte pour maintenir sa présence autour du détroit de Taïwan, ce qui a augmenté l’incertitude et le risque d’erreur d’appréciation de la situation."
  taiwan.25.a: "Les vieilles habitudes ont la vie dure"
  taiwan.26.t: "La Septième Flotte des États-Unis reste à Taïwan"
  taiwan.26.d: "Avec l’éclatement de la guerre civile sur le continent américain, la communauté internationale continue de suivre le statut des déploiements militaires américains à l’étranger. Récemment, certains navires de la Septième Flotte des États-Unis ont continué à opérer près du détroit de Taïwan, rendant la situation régionale plus compliquée.\n\nLe porte-parole du ministère chinois de la Défense a déclaré que, malgré les troubles internes, les États-Unis continuent de provoquer des incidents sur la question de Taïwan, violant le principe d’une seule Chine, s’ingérant dans les affaires internes de la Chine et sapant la paix et la stabilité régionales. Le porte-parole a également réaffirmé que Taïwan est une partie inséparable de la Chine. L’Armée populaire de libération reste en état d’alerte élevé et contre résolument tout acte provocateur pour sauvegarder la souveraineté nationale et l’intégrité territoriale.\n\nLa Septième Flotte a déclaré que ses opérations dans la région indo-pacifique se poursuivraient « comme à l’accoutumée », mettant l’accent sur la liberté de navigation, et a affirmé qu’elle continuerait à mener des activités dans les eaux autorisées par le droit international. Le département américain de la Défense a souligné que la mission de la Septième Flotte « reste inchangée par les circonstances nationales ».\n\nLes experts ont critiqué la Septième Flotte pour maintenir sa présence autour du détroit de Taïwan, ce qui a augmenté l’incertitude et le risque d’erreur d’appréciation de la situation."
  taiwan.26.a: "Les vieilles habitudes ont la vie dure"
  taiwan.27.t: "Les tensions entre la Chine et Taïwan s’intensifient"
  taiwan.27.d: "Le détroit de Taïwan, longtemps en sommeil, est redevenu le centre de l’attention internationale. Suite à la réélection réussie de Tsai Ing-wen lors des élections générales taïwanaises de 2020, l’Armée populaire de libération (APL) a rapidement intensifié la pression militaire sur l’île, lançant une opération à grande échelle autour de Taïwan en février. Selon les rapports des autorités taïwanaises, environ 40 aéronefs de l’APL ont effectué des vols en formation, certains traversant brièvement la ligne de démarcation, déclenchant des alertes renforcées des deux côtés du détroit.\n\nCette manœuvre militaire a été interprétée comme une réponse forte contre l’administration de Tsai pour son rejet du « Consensus de 1992 » et sa position ferme sur l’identité distincte de Taïwan. Le ministère de la Défense nationale de Taïwan a immédiatement déployé des chasseurs pour surveiller et repousser les aéronefs intrus, plaçant les agences de sécurité nationale en état d’alerte élevé. Pendant ce temps, le gouvernement de Taipei a exhorté Pékin à cesser ses provocations et à reprendre un dialogue pacifique à travers le détroit.\n\nCependant, Pékin a déclaré que l’opération était une contre-mesure nécessaire contre les « activités pro-indépendance » et les interférences étrangères, affirmant qu’elle visait à défendre la souveraineté nationale et l’intégrité territoriale. Cette démarche a suscité une large inquiétude et un malaise au sein de la communauté internationale. Les experts ont averti que sans mécanismes de dialogue efficaces et de cadres de gestion de crise, le détroit de Taïwan pourrait faire face à une instabilité prolongée et à des risques croissants.\n\n"
  taiwan.27.a: "En 1962, c’était Cuba ; en 2020, c’est Taïwan."
  taiwan.28.t: "Les tensions entre la Chine et Taïwan s’apaisent"
  taiwan.28.d: "Le résultat des élections générales taïwanaises de 2020 est, pour le moins, inattendu. Le candidat du Kuomintang, Han Kuo-yu, a battu la présidente sortante favorite, Tsai Ing-wen, et a remporté l’élection avec un léger avantage, devenant le nouveau leader de Taïwan. Une fois les résultats annoncés, ils ont immédiatement attiré l’attention et stupéfié le peuple de Taïwan.\n\nCette victoire a été interprétée par les médias internationaux comme le reflet des fluctuations drastiques de l’opinion publique à Taïwan. Les experts ont souligné que les difficultés économiques et de subsistance, l’intensification de la confrontation politique et le mécontentement envers les politiques trans-détroit du gouvernement actuel ont été les principales raisons pour lesquelles les électeurs se sont tournés vers les forces conservatrices. Le camp de Han Kuo-yu affirme que cette victoire représente « le désir du peuple pour le pain et la paix ».\n\nLa Chine continentale a exprimé une « évaluation positive » des résultats des élections et a présenté un geste de bonne volonté, ainsi que sa volonté de reprendre les consultations et les échanges sur la base du « Consensus de 1992 ». Taipei est entrée dans une phase de réorganisation politique, et le leadership du PPD a tenu une réunion d’urgence.\n\nLa communauté internationale attire maintenant son attention sur la situation et exhorte le nouveau gouvernement taïwanais à maintenir le statu quo et à sauvegarder la paix régionale. Les gouvernements du Japon, du Royaume-Uni et d’autres alliés de l’OTAN ont appelé à une « transition rationnelle » pour empêcher l’instabilité de se propager à la région indo-pacifique."
  taiwan.28.a: "…Une lueur d’espoir ?"
  taiwan.29.t: "La Chine continentale s’oppose fermement à la victoire du PPD"
  taiwan.29.d: "Alors que les élections générales taïwanaises de 2020 se sont terminées, Tsai Ing-wen, candidate du Parti progressiste démocratique, a revendiqué la victoire. Les départements compétents du continent ont solennellement réitéré que Taïwan fait partie de la Chine depuis les temps anciens, et que l’État ne permettra jamais aucune « indépendance de Taïwan » visant à diviser le pays ni aux forces sécessionnistes de faire sécession de Taïwan sous quelque nom ou par quelque moyen que ce soit.\n\nLe porte-parole du Bureau des affaires de Taïwan du Conseil d’État a sévèrement condamné les autorités du PPD pour leur refus de reconnaître le « Consensus de 1992 », défiant ouvertement le principe d’une seule Chine et sapant gravement la paix et la stabilité du détroit de Taïwan. Le porte-parole a souligné que la patrie a la volonté ferme, la confiance totale et la capacité suffisante pour déjouer toute forme de tentatives séparatistes de « l’indépendance de Taïwan ».\n\nPékin a souligné que la question de Taïwan fait partie des affaires internes de la Chine, et toute ingérence de forces extérieures sera résolument contrée. Le continent a averti que toute collusion et provocation entre les forces de « l’indépendance de Taïwan » et les forces extérieures sera efficacement traitée.\n\nLes analystes ont souligné que, bien que le PPD continue d’avancer obstinément sa position séparatiste, la tendance historique est irréversible, la réunification de la patrie est inarrêtable, et tout acte de trahison de la nation se soldera par un échec complet."
  taiwan.29.a: "Continuer à surveiller le détroit, soutenir tous les efforts pour maintenir l’unité nationale…"
  taiwan.291.t: "Le Département d’État américain publie une déclaration sur le détroit de Taïwan"
  taiwan.291.d: "Alors que les tensions croissaient dans le détroit de Taïwan, le Département d’État américain a publié une déclaration réitérant sa position de « s’opposer à tout changement unilatéral du statu quo ».\n\nLa déclaration a souligné que la politique des États-Unis envers Taïwan « reste inchangée », et que Washington maintient la Loi sur les relations avec Taïwan et les six assurances. Les États-Unis exhortent les deux parties à « faire preuve de retenue et à éviter les erreurs de jugement ».\n\nUn porte-parole du Département d’État a déclaré : « Nous sommes profondément préoccupés par la récente montée des tensions à travers le détroit de Taïwan ». « Nous réitérons que la paix et la stabilité servent les intérêts communs de la communauté internationale. Nous appelons toutes les parties à s’abstenir d’actions unilatérales – en particulier l’usage de la force ou de la coercition – qui risquent une escalade ».\n\nPlusieurs navires maintiennent leur présence dans le Pacifique occidental dans le cadre d’« opérations de routine pour la liberté de navigation ». Alors que Pékin a critiqué cette démarche comme une « ingérence dans les affaires internes », les officiels américains soutiennent que ces opérations sont « entièrement conformes au droit international et sans lien avec les développements régionaux actuels »."
  taiwan.291.a: "Nous nous opposons fermement à l’ingérence étrangère dans les affaires internes de la Chine."
  taiwan.292.t: "Trump annonce une aide militaire à Taïwan"
  taiwan.292.d: "Alors que la situation dans le détroit de Taïwan reste tendue, le président Donald Trump a annoncé un « paquet d’aide défensive historique » pour Taïwan lors d’une conférence de presse.\n\nLe paquet comprend des missiles antiaériens, des systèmes radar, des drones et « un nombre limité d’armes antinavires ». Trump a déclaré : « Taïwan lutte pour la liberté. L’Amérique ne restera pas les bras croisés ».\n\nLa déclaration a attiré l’attention internationale. Bien que des voix bipartisanes au Congrès aient exprimé leur soutien, le ministère chinois des Affaires étrangères a fortement condamné l’annonce et a averti Washington de « ne pas jouer avec le feu ».\n\nLe Pentagone a noté qu’il « examine la logistique des transferts potentiels », mais a souligné que « tout soutien militaire à Taïwan sera de nature défensive et conforme au cadre juridique existant »."
  taiwan.292.a: "C’est une grave violation de la souveraineté de la Chine !"
  taiwan.293.t: "La visite de Pelosi à Taïwan secoue la région"
  taiwan.293.d: "La présidente de la Chambre des représentants des États-Unis, Nancy Pelosi, est arrivée à Taipei à bord d’un avion militaire et a prononcé un discours devant le parlement de l’île. Dans ses remarques, elle a souligné le « soutien de l’Amérique au système démocratique de Taïwan », a déclaré que « Taïwan n’est pas seul » et a appelé à des liens plus étroits entre les États-Unis et Taïwan.\n\nEn réponse, le Commandement du théâtre oriental de l’APL a annoncé le lancement d’« exercices de combat réels autour de l’île ». Plusieurs unités navales et aériennes ont effectué des exercices à tirs réels à grande échelle autour de Taïwan, simulant des blocus conjoints, des frappes de percée et des opérations de déni de zone. Plusieurs missiles ont survolé l’île, incitant Taïwan à élever son alerte de défense aérienne au niveau le plus élevé.\n\nBien que la Maison Blanche ait tenté de minimiser la visite en la qualifiant de « voyage personnel de la présidente », les observateurs internationaux l’ont largement considérée comme une escalade sérieuse des tensions sino-américaines."
  taiwan.293.a: "La tempête est arrivée."
  taiwan.30.t: "Les exercices de l’APL intensifient les tensions à travers le détroit de Taïwan"
  taiwan.30.d: "Alors que la situation dans le détroit de Taïwan tremble suite aux récents exercices militaires à grande échelle de l’Armée populaire de libération (APL) dans le détroit de Taïwan et les zones maritimes et aériennes environnantes. Les sujets des exercices incluent le contrôle conjoint, les frappes à longue portée et les opérations coordonnées mer-air, marquant l’un des entraînements de combat réels les plus intensifs de ces dernières années.\n\nLe porte-parole du ministère de la Défense nationale a déclaré qu’un tel exercice est une réponse nécessaire aux changements actuels de la situation à travers le détroit de Taïwan, visant à défendre la souveraineté nationale et l’intégrité territoriale et à maintenir la paix et la stabilité régionales. Le porte-parole a souligné que l’APL continuerait d’améliorer sa capacité de combat et de contrer toutes les provocations séparatistes et les interférences extérieures.\n\nLes autorités taïwanaises ont accusé le continent d’« intensifier les tensions régionales », et le ministère de la Défense à Taipei affirme qu’il a surveillé de près les exercices et a renforcé sa préparation au combat pour prévenir les « incidents inattendus ».\n\nLes experts militaires soulignent qu’avec la détérioration récente des relations trans-détroit, le risque de confrontations armées continue d’augmenter. La pression militaire de l’APL est vue comme une réponse directe à la promotion continue par les autorités du PPD de « l’indépendance progressive de Taïwan », et Taipei adopterait une position plus dure et renforcerait sa résistance avec le soutien des forces extérieures. La stabilité régionale du détroit risque de rester élevée dans un avenir proche, posant de sérieux défis à la stabilité régionale."
  taiwan.30.a: "Nous continuerons à surveiller les activités de l’APL dans le détroit de Taïwan"
  taiwan.30.b: "Toutes les mesures nécessaires seront prises pour défendre l’intégrité territoriale de la Chine"
  taiwan.31.t: ""
  taiwan.31.d: ""
  taiwan.31.a: ""
  taiwan.32.t: "En fin de compte… Nous tenons !"
  taiwan.32.d: "Après des semaines de combats acharnés, l’Armée populaire de libération a été stoppée net face à la résistance féroce de l’OTDP et a échoué dans son objectif de submerger nos forces armées et notre gouvernement. Ces derniers jours, les rapports de renseignement ont indiqué que l’APL abandonnait le terrain gagné, bien que cette information soit retenue en cas de contre-attaque surprise de l’APL. Cependant, avec les sources japonaises et australiennes confirmant que les forces communistes se retirent sur tous les fronts – y compris Kinmen – le bureau présidentiel a enfin annoncé la victoire des forces démocratiques à l’aube.\n\nL’Armée de l’air et la Marine ont suivi, cessant toutes les opérations militaires après le retrait des forces d’invasion terrestre, laissant à nouveau les cieux et les mers ouverts. Nos quais et aéroports dévastés reçoivent maintenant de l’aide humanitaire du monde entier, la majorité provenant de nos alliés de l’OTDP.\n\nCependant, ce n’est pas fini. Nos villes sont en ruines, nos usines ont été détruites, nos chemins de fer et autoroutes sont paralysés, et notre joyau de la couronne – l’industrie des semi-conducteurs – a été complètement anéantie. De plus, les renseignements de l’OTDP suggèrent que la défaite majeure des communistes déclencherait presque certainement des troubles politiques, pouvant inviter un leadership encore plus agressif qui pourrait menacer notre démocratie et notre liberté dans les années à venir. Pour l’instant, une tâche monumentale de reconstruction nous attend."
  taiwan.32.a: "Et notre peuple marche sur le chemin de la vie"
  taiwan.33.t: "Seconde vague de frappes de missiles !"
  taiwan.33.d: "La guerre de vie et de mort est revenue à la République une fois de plus.\n\nQuelques jours seulement après le début de la quatrième crise du détroit, des missiles en provenance du continent ont, pour la première fois, frappé nos infrastructures clés et nos villes. Alors que le ministère de la Défense nationale s’efforce de mobiliser le personnel de réserve et de se préparer à la défense, une seconde vague de frappes de missiles s’est abattue sur nous – cette fois dévastant nos capacités administratives et de communication.\n\nPourtant, les quelques stations radar survivantes ont détecté quelque chose de bien plus terrifiant : d’innombrables navires d’assaut amphibie et leurs escortes approchent rapidement de nos côtes, signalant une invasion imminente. Cela ne peut signifier qu’une chose : la quatrième crise du détroit est terminée, la guerre de Taïwan a commencé.\n\nMalgré l’absence des États-Unis, nous ne sommes pas seuls. Les forces d’intervention de l’OTDP assistent maintenant notre défense dans tous les secteurs, se tenant côte à côte avec nous sur les zones de débarquement pour repousser toute troupe osant défier notre intégrité territoriale.\n\nNous devons maintenant nous battre et rester défiants face au géant rouge. Si nous échouons, le flambeau brûlant de la démocratie chinoise sera éteint à jamais."
  taiwan.33.a: "Debout et combattez !"
  taiwan.34.t: "Lettre du ministère de la Défense nationale"
  taiwan.34.d: "Destinataire : Bureau présidentiel\nPriorité : Priorité absolue\nObjet : État actuel de notre défense nationale\n\nNotre objectif principal d’empêcher l’Armée populaire de libération d’avancer à Taïwan a échoué. L’APL a exploité les vulnérabilités de nos défenses et contrôle maintenant plusieurs grandes villes et ports, paralysant gravement notre effort de guerre. Cet objectif non atteint, nous ne pouvons plus confiner le conflit aux côtes et sommes maintenant forcés de nous engager dans des terrains urbains et montagneux.\n\nL’APL a atteint notre deuxième ligne de défense entourant les villes et les chaînes de montagnes restantes, ce qui peut être utilisé à notre avantage en défense en raison de la complexité des environnements urbains et montagneux. Notre armée a déjà établi des positions défensives autour des villes contrôlées par la RPC et est mieux positionnée pour arrêter les avancées supplémentaires de l’APL.\n\nL’OTDP a également subi de lourdes pertes pendant ce conflit. Cela a conduit à un impact psychologique inattendu sur nos civils et nos forces armées. Reconnaissant que l’OTDP est véritablement nos frères d’armes, nous avons reçu un afflux de volontaires civils soutenant notre préparation à la défense et la logistique. Cela a renforcé notre moral et nos capacités de défense, et les commandants rapportent que la volonté et la préparation de nos forces terrestres sont plus élevées que jamais."
  taiwan.34.a: "Nous gagnerons sûrement…"
  taiwan.35.t: "Répercussions"
  taiwan.35.d: "6h27. « [Alerte de défense aérienne] Aéronefs ennemis en approche. Mettez-vous immédiatement à l’abri. » À la quatrième semaine depuis la suspension brutale de l’école, Kai Chih-li se réveille au son d’une autre alarme antiaérienne stridente, accompagnée de nuages épais dans un ciel prêt à déverser des bombes. Trois F-16 rugissent dans le ciel pour intercepter, couvrant presque les cris de la police : « Ne prenez pas l’ascenseur, prenez les escaliers ! »\n\n6h50. « [Alerte de défense aérienne] Alerte de défense aérienne levée. Signalez les objets inconnus à la police ou aux pompiers. » Les bombardements cessent, et les personnes dans les abris sortent de manière ordonnée pour commencer leurs routines en temps de guerre. Kai se précipite au FamilyMart où il travaille pour se préparer à son service de 8 heures. Une douzaine de clients attendent déjà dehors, tenant un mélange de billets, de pièces et de coupons alimentaires émis par le gouvernement. Rien d’inhabituel aujourd’hui – sauf qu’on lui a dit de former le stagiaire à organiser les coupons usagés pour la collecte.\n\n14h00. « Notification de temps ensoleillé de l’ACN – Ensoleillement suffisant aujourd’hui jusqu’à 18h35. » « Manager Chen – Imprimez 100 copies de ceci et distribuez-les. Demande du gouvernement. PA20018583.pdf. » Il y a deux heures, il gardait encore une lueur d’espoir lorsque le soleil perçait, mais la mise à jour de l’ACN l’a confirmé – pas de service court aujourd’hui. Déçu, il demande au stagiaire d’imprimer les tracts pendant qu’il retourne à la caisse après une courte pause.\n\n18h50. Le trafic Internet civil est restreint par les fournisseurs d’accès pour préserver la bande passante et l’électricité. Les lampadaires s’allument brièvement pour éviter les accidents, bien que les voitures soient désormais rares en raison du rationnement de carburant. En rentrant chez lui à pied, Kai repère un stand avec une nappe de camouflage verte, semblable à ceux des festivals scolaires. Curieux, il s’approche. Le responsable du stand lui fait signe. « Nous organisons des groupes de défense civile », dit-il. « Rejoignez nos programmes de formation pour identifier les munitions non explosées et traiter les blessures afin de soutenir nos pompiers et ambulanciers. »\n\n18h52. Kai prend une brochure et lit. Financée par le gouvernement, volontaire, sans armes, ni milice ni unité de chair à canon. La FAQ répond à la plupart de ses questions. Après une pause, il prend une profonde inspiration.\n\n18h57."
  taiwan.35.a: "Quand puis-je commencer ?"
  taiwan_detente.0.t: "Le Kuomintang remporte les élections taïwanaises"
  taiwan_detente.0.d: "Un sujet qui s’est répandu comme une traînée de poudre sur nos plateformes de médias sociaux récemment est la conclusion des élections locales taïwanaises, au cours desquelles le peuple a élu Han Kuo-yu comme leader administratif de la région séparatiste. Certains célèbrent le rejet des partisans radicaux de l’indépendance taïwanaise, tandis que certains internautes remettent en question la légitimité de ces élections locales.\n\nLe Bureau des affaires de Taïwan a offert peu de commentaires sur la question, se contentant de réitérer que l’élection « présidentielle » n’est qu’une élection locale et que les puissances étrangères ne devraient pas s’ingérer dans nos affaires internes. Cependant, certaines parties du gouvernement semblent soulagées de voir la victoire du Kuomintang, car ce parti est plus enclin à coopérer avec nous et à maintenir une relation chaleureuse. Une partie importante doute encore de l’engagement de Han Kuo-yu à rétablir le contact, mais avec l’éviction du PPD, le processus sera au moins plus fluide."
  taiwan_detente.0.a: "Nous espérons qu’ils finiront par entendre raison."
  taiwan_detente.1.t: "Une branche d’olivier au continent"
  taiwan_detente.1.d: "Avec la conclusion de nos élections et la nomination des ministres, nous pouvons enfin commencer à nous atteler aux affaires. L’un des points les plus importants de notre programme est d’abandonner la politique de l’administration Tsai Ing-wen de maintenir une distance avec le continent. Cette politique continentale a gravement nui à nos industries du tourisme et de l’agriculture, car le continent a non seulement imposé plusieurs interdictions sur divers produits, mais a également renforcé les contrôles sur le tourisme, réduisant le nombre de touristes continentaux visitant nos îles. Pire encore, le PCC a menacé à plusieurs reprises le gouvernement du PPD, semant instabilité et panique parmi notre peuple.\n\nPour réparer les dégâts, le premier ordre du jour du Conseil des affaires continentales sera d’inverser la relation froide entre nous et le continent. En relançant les conversations et en organisant des sommets, nous ferons tout notre possible pour tendre une branche d’olivier au continent, dans l’espoir qu’ils seront prêts à poursuivre la paix et à coopérer à nouveau avec nous."
  taiwan_detente.1.a: "Une nouvelle ère d’interactions trans-détroit."
  taiwan_detente.2.t: "L’administration du Kuomintang cherche la réconciliation"
  taiwan_detente.2.d: "Il est récemment venu à notre attention que le Conseil des affaires continentales, qui était de facto aboli depuis que les partis séparatistes radicaux ont pris le contrôle, nous a contactés via la Fondation pour les échanges du détroit pour chercher à reconstruire les relations diplomatiques entre nos deux parties. Plusieurs représentants de leur côté ont commencé à contacter leurs homologues de notre côté pour négocier d’éventuelles réunions préliminaires, principalement destinées à discuter de conférences plus formelles et complètes à l’avenir.\n\nNotre gouvernement a répondu positivement. Le Bureau des affaires de Taïwan a approuvé en privé des permis d’entrée diplomatique pour plusieurs représentants taïwanais, mais s’est abstenu de tout commentaire public supplémentaire jusqu’à ce qu’un terrain d’entente plus solide soit trouvé entre nous et Taïwan, selon les rapports. Bien que nous n’ayons pas de grands espoirs pour une réintégration pacifique de Taïwan, nous souhaitons que ces sommets servent de point de départ pour que le peuple taïwanais reconnaisse à nouveau notre fraternité partagée."
  taiwan_detente.2.a: "Compris."
  taiwan_detente.3.t: "Pierre angulaire de la concorde"
  taiwan_detente.3.d: "Excellentes nouvelles de nos artisans de la paix au Conseil des affaires continentales ! Il semble que la Fondation pour les échanges du détroit ait réussi à contacter l’ARATS sur le continent – probablement avec l’accord du Bureau des affaires de Taïwan – et ait établi des understandings de base pour de futures conférences. L’une d’elles inclut d’informer l’autre partie que le gouvernement en place est ouvert à la reconnaissance du « Consensus de 1992 », qui a été le fondement de tous nos échanges pacifiques depuis l’ère de l’ancien président Lee Teng-hui, y compris la rencontre Ma-Xi – la plus importante depuis les négociations de Chongqing de 1945.\n\nAvec cette bonne volonté de nos frères de l’autre côté du détroit, nous pouvons commencer à préparer des événements plus ouverts et de bas niveau pour réduire l’hostilité publique envers le continent, avant de tenir des sommets majeurs pour discuter de questions politiques et économiques plus larges. Nous tirerons les leçons de l’échec du CSSTA et éviterons de provoquer des sentiments anti-continentaux, qui ont donné à l’opposition des raisons pour le Mouvement des Tournesols en 2014."
  taiwan_detente.3.a: "Excellent !"
  taiwan_detente.4.t: "Conférence de Xiamen"
  taiwan_detente.4.d: "Suite aux réponses positives de nos collègues de l’autre côté du détroit, le ministère de l’Intérieur et le Conseil des affaires continentales se sont mobilisés pour briser la glace entre nous et le continent. Un récent sondage a montré que les deux tiers des répondants soutiennent ou ne s’opposent pas à la reprise des pourparlers. Avec l’approbation présidentielle, les représentants du Conseil des affaires continentales ont mis le cap sur Xiamen, où ils ont été chaleureusement accueillis par les officiels continentaux.\n\nLa conférence a dominé les gros titres, avec trois événements clés qui se démarquent : l’ouverture grandiose, la levée des interdictions d’importation sur plusieurs produits agricoles précédemment imposées en représailles aux politiques hostiles de Tsai Ing-wen, et les discussions sur le nouveau virus COVID-19. Le continent a également accepté d’agir comme intermédiaire – partageant les informations de l’OMS avec nous et transmettant nos mises à jour en retour.\n\nL’événement est considéré comme un succès majeur pour l’administration du président Ma, avec d’autres réunions déjà en préparation par le Conseil. Des représentants continentaux devraient également visiter Kinmen bientôt pour promouvoir le tourisme – renforçant davantage la région comme bastion du soutien au Kuomintang."
  taiwan_detente.4.a: "Un avenir radieux nous attend."
  taiwan_detente.5.t: "Vers Formose, seul"
  taiwan_detente.5.d: "« Ceci est le dernier appel d’embarquement pour le vol BR721 à destination de Taipei. Tous les passagers restants, veuillez vous diriger immédiatement vers la porte 3. »\n\nL’annonce résonne dans le terminal alors que Huang Fu-ji se précipite vers la porte 3, tenant son passeport et son billet d’avion, encore essoufflé par sa course. Après un bref contrôle, il monte à bord de l’avion.\n\nAlors que les moteurs rugissent et que le sol s’éloigne, il ouvre son téléphone et lit une capture d’écran du site du Bureau des affaires de Taïwan, examinant les avis sur ce qu’il faut faire et éviter lors d’une visite individuelle à Taïwan. Planificateur minutieux, il a préparé un itinéraire détaillé – à la minute près – tout en laissant du temps de marge entre les arrêts, basé sur son expérience passée.\n\nÀ l’aéroport, les télévisions diffusent des nouvelles sur le succès de la Conférence de Shanghai, qui a conduit à la reprise par le continent du programme de visites individuelles. Mais Huang n’y prête pas attention – ses yeux sont fixés sur l’écran des bagages, impatient de commencer sa visite tant attendue.\n\nÀ la tombée de la nuit, il retourne au même hôtel où il avait séjourné il y a sept ans – mais cette fois, il n’y a ni guides, ni compagnons bruyants de groupe touristique, ni personne pour presser le programme. Au lever du soleil, il prévoit de visiter les marchés traditionnels et le zoo de Muzha, espérant voir des pandas et d’autres animaux exotiques."
  taiwan_detente.5.a: "Bon voyage."
  taiwan_detente.6.t: "Début des pourparlers de Singapour"
  taiwan_detente.6.d: "Avec la promotion du gouvernement de Singapour, des représentants du continent et de Taïwan ont récemment entamé une réunion formelle à Singapour pour négocier les relations trans-détroit. Des représentants du Kuomintang ont assisté à la réunion, tandis que la délégation continentale était composée de responsables du Bureau des affaires de Taïwan du Conseil d’État.\n\nBasée sur les principes d’égalité, de respect, de mise de côté des différences et des différends, et de recherche de terrains d’entente tout en réservant les divergences, les deux parties ont mené des échanges approfondis sur des questions telles que la coopération économique trans-détroit, la facilitation des échanges de personnes et le maintien de la paix et de la stabilité régionales. Le dialogue s’est déroulé dans une atmosphère positive, reflétant une volonté partagée de reprendre le dialogue et d’améliorer les relations.\n\nLe ministère des Affaires étrangères de Singapour a salué le choix des deux parties de faire de Singapour un lieu neutre pour le dialogue et les échanges, espérant que cette réunion contribuera à apaiser les tensions et à promouvoir la paix et la stabilité régionales."
  taiwan_detente.6.a: "Voyons comment cela se termine."
  taiwan_detente.7.t: "Les discussions sur l’unification trans-détroit s’intensifient"
  taiwan_detente.7.d: "Avant que la guerre civile aux États-Unis ne se détériore, la diplomatie internationale a montré des signes évidents de changement. Alors que les divisions sociales internes aux États-Unis s’intensifiaient et que le fonctionnement du gouvernement était fréquemment entravé, l’influence des États-Unis dans les affaires internationales continuait de décliner.\n\nDans ce contexte, la Chine continentale a renforcé son contrôle sur la situation environnante. Pendant ce temps, différentes voix ont émergé à Taïwan, et certains partis politiques traditionnels ont appelé à un réexamen de la direction des relations trans-détroit pour éviter d’être marginalisés dans la réorganisation des forces internationales.\n\nPeu après, alors que la guerre civile éclatait officiellement aux États-Unis, la capacité du gouvernement américain à intervenir à l’étranger a soudainement diminué, et un vide majeur est apparu dans la situation sécuritaire de la région Asie-Pacifique. La Chine continentale a clairement indiqué qu’elle ferait avancer résolument le processus de réunification nationale, s’opposerait fermement à toute forme de comportement séparatiste, et a souligné que sa détermination à sauvegarder la souveraineté nationale et l’intégrité territoriale ne faiblirait pas.\n\nÀ Taïwan, en période de troubles politiques, des forces majeures telles que le Kuomintang ont appelé à une attitude plus pragmatique pour faire face à la réalité des deux rives du détroit et ont préconisé la recherche de nouveaux arrangements par des négociations pacifiques."
  taiwan_detente.7.a: "Est-ce la fin ?"
  taiwan_detente.8.t: "L’agenda de l’unification soulevé lors des pourparlers trans-détroit de Singapour"
  taiwan_detente.8.d: "Des délégations du continent et de Taïwan se sont réunies cette semaine pour une nouvelle série de négociations, coordonnées par le gouvernement de Singapour. La réunion a eu lieu pendant le conflit civil américain, modifiant les dynamiques dans la région Asie-Pacifique, attirant une large attention internationale.\n\nAu cours des discussions, la délégation continentale a formellement proposé d’accélérer le processus d’unification trans-détroit, appelant à un mécanisme de communication régulier et à un dialogue substantiel sur un cadre potentiel d’unification. Les représentants ont déclaré que « réaliser une réunification nationale complète est l’aspiration partagée de 1,4 milliard de personnes et une étape cruciale dans la grande revitalisation de la nation chinoise », soulignant la nécessité de saisir l’opportunité historique actuelle.\n\nLa délégation taïwanaise, dirigée par le Kuomintang (KMT), maintient une position prudente. Tout en réaffirmant son engagement à gérer les relations trans-détroit de manière pacifique, elle a maintenu une position de « ouverture mais réservée » concernant l’unification, soulignant l’importance de sauvegarder le mode de vie, le système social et les intérêts fondamentaux du peuple de Taïwan.\n\nC’est la première fois en des années que la question de l’unification est revenue à la table des négociations comme point officiel de l’agenda. Bien que le chemin à parcourir reste incertain, l’acte même du dialogue porte un poids stratégique."
  taiwan_detente.8.a: "L’unification trans-détroit est une tendance inévitable."
  taiwan_detente.9.t: "Les pourparlers de Singapour s’effondrent alors que les deux parties se séparent divisées"
  taiwan_detente.9.d: "Les pourparlers trans-détroit entre le continent et Taïwan, tenus à Singapour, se sont officiellement rompus aujourd’hui. Les deux parties n’ont pas réussi à réduire les divergences critiques concernant l’unification et ses arrangements politiques.\n\nLa délégation continentale a souligné l’urgence de saisir la fenêtre géopolitique actuelle pour faire avancer l’unification nationale. Les propositions incluaient la création d’un mécanisme de liaison formel et la discussion d’une feuille de route progressive. Les représentants continentaux ont réitéré que « la réunification pacifique reste la plus grande sincérité, mais aucune option n’est exclue ».\n\nLa délégation taïwanaise, dirigée par le Kuomintang (KMT), a fermement refusé d’entrer dans une phase de discussions structurées sur l’unification. Citant un manque de consensus à Taïwan, les délégués ont exprimé une forte préoccupation face à l’insistance du continent sur un « cadre d’un seul pays », et ont plutôt appelé à un « engagement pragmatique et à la construction de la confiance avant toute discussion politique ».\n\nLa réunion s’est terminée après moins de deux heures, sans conférence de presse et avec le départ anticipé des deux délégations sans commentaires formels.\n\nLe ministère des Affaires étrangères de Singapour a exprimé ses regrets face à l’issue de la réunion et exhorte les deux parties à maintenir les canaux de communication ouverts, tout en évitant une rhétorique escalatoire ou des erreurs de jugement."
  taiwan_detente.9.a: "Nous avons au moins essayé cette voie."
  taiwan_detente.10.t: "Décision finale"
  taiwan_detente.10.d: "Tard dans la nuit à Zhongnanhai, Xi Jinping était assis seul dans le bureau de la salle Qinzheng. Devant lui se trouvait une carte décolorée du détroit de Taïwan. Dans la lumière crue, les lignes maritimes traçaient les fractures de l’histoire.\n\nLes rapports du Département d’état-major interarmées et de la Commission militaire centrale avaient confirmé à maintes reprises : le moment clé pour une réunification pacifique s’était estompé. L’opinion publique sur l’île était profondément divisée, et l’ingérence étrangère continuait de s’intensifier. Attendre plus longtemps signifierait perdre complètement l’initiative stratégique.\n\nPendant dix ans, il avait évité la confrontation, cherché un ordre international stable et atténué les risques. Mais le temps était désormais devenu son adversaire le plus redoutable. La réunification n’était plus un choix politique ; c’était une décision de vie ou de mort pour l’intégrité et l’avenir de la nation. Il comprenait les coûts et les conséquences : sacrifices sur le champ de bataille, bouleversements économiques, pressions internationales croissantes, et même de graves risques politiques. Pourtant, l’histoire n’attendrait pas.\n\n« Risque ? » Il regarda dans la nuit. « Pendant les années révolutionnaires, quand nos camarades ont-ils jamais avancé sans risque ? » L’air à Zhongnanhai semblait gelé. À travers le pays, tous les regards semblaient fixés sur lui.\n\n« Le destin ne nous a laissé qu’un seul chemin. »\n\n« Préparez la prochaine étape. »"
  taiwan_detente.10.a: "Les portes de l’histoire se sont ouvertes."
