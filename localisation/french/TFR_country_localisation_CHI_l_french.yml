  CHI_tsmc_idea: "Compagnie de fabrication de semi-conducteurs de Taïwan"
  CHI_tsmc_idea_desc: "TSMC, ou Compagnie de fabrication de semi-conducteurs de Taïwan, est la plus grande entreprise de fabrication de semi-conducteurs au monde et fournit des semi-conducteurs pour les entreprises sans usine. Dans le cadre de l’objectif national de transformation en une économie de haute technologie et basée sur les services dans les années 1990, TSMC a été fondée avec l’objectif de se spécialiser dans la fabrication de semi-conducteurs, incitant les entreprises occidentales à externaliser la fabrication pour maximiser leurs profits.\n\nAujourd’hui, TSMC, ainsi que d’autres entreprises taïwanaises, représente environ les deux tiers de l’approvisionnement mondial en semi-conducteurs et domine le marché des circuits intégrés haut de gamme. Cette forte dépendance envers les semi-conducteurs taïwanais a forcé de nombreux pays développés à dissuader la Chine d’entreprendre des actions militaires, craignant que cela ne perturbe la chaîne d’approvisionnement et, par conséquent, leur économie entière. Cette protection, offerte par le monopole de Taïwan sur la fabrication de semi-conducteurs, est ce que beaucoup appellent le « Bouclier de Silicium »."
