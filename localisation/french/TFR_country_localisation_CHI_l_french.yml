  #Modifiers
  #Events
  taiwan.1.t: "L’Île Défiante"
  taiwan.1.d: "Les horizons des villes sont illuminés plus brillamment que d’habitude par des feux d’artifice éblouissants. Les artistes mènent les concerts à leur apogée, excitant davantage les foules. Les gens rassemblés autour des bâtiments les plus hauts regardent avec émerveillement alors que la Lune elle-même semble surpassée par les flammes des fusées, tandis que ceux dans le confort de leurs abris se réjouissent lorsque le compte à rebours atteint enfin zéro, marquant la fin de la décennie.\n\nNous sommes en 2020. Notre position de leader dans la fabrication de semi-conducteurs reste incontestée. La bourse atteint des sommets sans précédent, avec le TAIEX maintenant plus de 10 000 points pendant presque toute l’année. Malgré les turbulences causées par la guerre commerciale sino-américaine, notre économie robuste a montré une résilience remarquable, avec un taux de croissance économique stable à environ 3 % tout au long de 2019.\n\nLa nouvelle année marque également la fin des campagnes électorales présidentielles. La présidente Tsai Ing-wen brigue un second mandat, tandis que le leader de l’opposition controversé, Han Kuo-yu, continue de gagner en popularité. James Soong se présente pour la cinquième fois à la présidence, bien qu’il ait également annoncé que cela pourrait être sa dernière tentative.\n\nSur le plan diplomatique, notre nation continue de perdre des alliés officiels en raison de facteurs tels que l’influence mondiale croissante de la Chine continentale, y compris son initiative « Ceinture et Route ». En même temps, notre stratégie s’est orientée vers la promotion de relations chaleureuses, bien qu’informelles, avec les grandes puissances. Les émeutes à Hong Kong éloignent davantage le camp pro-unification à l’intérieur de nos frontières, et beaucoup les citent comme preuve de l’échec inévitable du cadre « Un pays, deux systèmes ».\n\nDans l’ensemble, le peuple courageux de l’archipel de Taïwan – y compris Kinmen et Matsu – est prêt à affronter la tempête à venir et à avancer dans la prochaine décennie. Bien que le ministère de la Santé et du Bien-être ait signalé un nouveau cas suspect de pneumonie atypique en provenance de la Chine continentale, cela ne devrait sûrement pas poser de problème majeur."
  taiwan.1.a: "Que le chemin à venir soit doux pour vous, Taïwan."
