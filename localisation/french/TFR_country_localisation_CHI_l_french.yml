roc.1.a: "Que le chemin devant toi soit paisible, Taïwan."
roc.1.d: "Les horizons des villes s'illuminent plus vivement que d'habitude grâce à des feux d'artifice éblouissants. Les artistes portent les concerts à leur paroxysme, exaltant encore plus la foule. Les gens rassemblés autour des plus hauts bâtiments observent avec émerveillement la Lune elle-même semblant éclipsée par les flammes des fusées, tandis que ceux dans le confort de leur abri se réjouissent lorsque le décompte atteint enfin zéro, marquant la fin de la décennie.\n\nNous sommes en 2020. Notre position dominante dans la fabrication de semi-conducteurs reste incontestée. Le marché boursier atteint des sommets inégalés, le TAIEX maintenant plus de 10 000 points pendant presque toute l'année. Malgré les turbulences causées par la guerre commerciale sino-américaine, notre économie robuste a démontré une résilience remarquable, le taux de croissance économique restant stable autour de 3 % tout au long de 2019.\n\nLa nouvelle année signale aussi la fin des campagnes électorales présidentielles. La présidente Tsai Ing-wen brigue un second mandat, tandis que le principal leader de l'opposition, le controversé Han Kuo-yu, continue de gagner en popularité. James Soong tentera pour la cinquième fois sa chance à la présidence, bien qu'il ait annoncé que cela pourrait être sa dernière tentative.\n\nSur le plan diplomatique, notre nation continue de perdre des alliés formels en raison de facteurs tels que l'influence mondiale croissante de la Chine continentale, y compris son Initiative Ceinture et Route. Parallèlement, notre stratégie s'est tournée vers le renforcement de relations chaleureuses, quoique non officielles, avec les grandes puissances. Les émeutes à Hong Kong aliènent davantage le camp pro-unification au sein de nos frontières, et beaucoup les citent comme preuve de l'échec inévitable du cadre « Un pays, deux systèmes ».\n\nTout compte fait, les braves habitants de l'archipel taïwanais – y compris Kinmen et Matsu – se préparent à affronter la tempête à venir et à avancer dans la prochaine décennie. Bien que le ministère de la Santé et du Bien-être ait signalé un nouveau cas suspect de pneumonie atypique en provenance de la Chine continentale, cela ne devrait sûrement pas poser de gros problème."
