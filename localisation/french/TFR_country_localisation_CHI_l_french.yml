roc.25.a: "Les vieilles habitudes ont la vie dure"
roc.25.d: "Avec l'éclatement de la guerre civile aux États-Unis continentaux, la communauté internationale continue de suivre l'état des déploiements militaires américains outre-mer. Récemment, certains navires de la septième flotte des États-Unis ont continué à opérer près du détroit de Taïwan, rendant la situation régionale plus compliquée.\n\nLe porte-parole du ministère chinois de la Défense a déclaré que malgré les troubles internes, les États-Unis continuent de provoquer des incidents sur la question de Taïwan, violant le principe d'une seule Chine, s'immisçant dans les affaires intérieures de la Chine et sapant la paix et la stabilité régionales. Le porte-parole a également réaffirmé que Taïwan est une partie inséparable de la Chine. L'Armée populaire de libération reste en état d'alerte élevé et contre-attaque résolument tout acte provocateur pour sauvegarder la souveraineté nationale et l'intégrité territoriale.\n\nLa septième flotte a déclaré que ses opérations dans la région pane indo-pacifique « se poursuivront normalement », en soulignant la liberté de navigation et en affirmant qu'elle continuera à mener des activités dans les eaux autorisées par le droit international. Le département de la Défense américain a souligné que la mission de la septième flotte « reste inchangée par les circonstances domestiques ».\n\nLes experts ont critiqué la septième flotte pour continuer à maintenir sa présence autour du détroit de Taïwan, ce qui augmente l'incertitude et le risque d'erreur de jugement de la situation."
roc.25.t: "La septième flotte américaine reste à Taïwan"
roc.26.a: "Les vieilles habitudes ont la vie dure"
roc.26.d: "Avec l'éclatement de la guerre civile aux États-Unis continentaux, la communauté internationale continue de suivre l'état des déploiements militaires américains outre-mer. Récemment, certains navires de la septième flotte des États-Unis ont continué à opérer près du détroit de Taïwan, rendant la situation régionale plus compliquée.\n\nLe porte-parole du ministère chinois de la Défense a déclaré que malgré les troubles internes, les États-Unis continuent de provoquer des incidents sur la question de Taïwan, violant le principe d'une seule Chine, s'immisçant dans les affaires intérieures de la Chine et sapant la paix et la stabilité régionales. Le porte-parole a également réaffirmé que Taïwan est une partie inséparable de la Chine. L'Armée populaire de libération reste en état d'alerte élevé et contre-attaque résolument tout acte provocateur pour sauvegarder la souveraineté nationale et l'intégrité territoriale.\n\nLa septième flotte a déclaré que ses opérations dans la région pane indo-pacifique « se poursuivront normalement », en soulignant la liberté de navigation et en affirmant qu'elle continuera à mener des activités dans les eaux autorisées par le droit international. Le département de la Défense américain a souligné que la mission de la septième flotte « reste inchangée par les circonstances domestiques ».\n\nLes experts ont critiqué la septième flotte pour continuer à maintenir sa présence autour du détroit de Taïwan, ce qui augmente l'incertitude et le risque d'erreur de jugement de la situation."
roc.26.t: "La septième flotte américaine reste à Taïwan"
roc.27.a: "En 1962, c'était Cuba ; en 2020, c'est Taïwan."
roc.27.d: "Le détroit de Taïwan, longtemps endormi, redevient une fois de plus le centre d'attention de la communauté internationale. Suite à la réélection réussie de Tsai Ing-wen lors des élections générales taïwanaises de 2020, l'Armée populaire de libération (APL) a rapidement intensifié la pression militaire sur l'île, lançant une vaste opération autour de Taïwan en février. Selon les autorités taïwanaises, environ 40 avions de l'APL ont effectué des vols en formation, certains franchissant brièvement la ligne de démarcation, déclenchant des alertes élevées des deux côtés du détroit.\n\nCette manœuvre militaire a été interprétée comme une réponse ferme à l'administration de Tsai qui rejette le « Consensus de 1992 » et maintient une position ferme sur l'identité distincte de Taïwan. Le ministère de la Défense nationale taïwanais a immédiatement décollé des avions de chasse pour surveiller et repousser les appareils intrusifs, plaçant les agences de sécurité nationale en état d'alerte maximal. Parallèlement, le gouvernement de Taipei a exhorté Pékin à cesser ses provocations et à reprendre un dialogue trans-détroit pacifique.\n\nCependant, Pékin a déclaré que l'opération était une contre-mesure nécessaire contre les « activités pro-indépendance » et les interférences étrangères, affirmant qu'elle visait à défendre la souveraineté nationale et l'intégrité territoriale. Ce mouvement a suscité une préoccupation et une inquiétude généralisées au sein de la communauté internationale. Les experts ont averti que sans mécanismes de dialogue efficaces et de gestion des crises, le détroit de Taïwan pourrait faire face à une instabilité prolongée et à des risques croissants.\n\n"
roc.27.t: "Les tensions entre la Chine et Taïwan s'intensifient"
roc.28.a: "...Un rai d'espoir ?"
roc.28.d: "Le résultat des élections générales taïwanaises de 2020 est, pour le moins qu'on puisse dire, inattendu. Le candidat du Kuomintang, Han Kuo-yu, a vaincu la présidente sortante favorite, Tsai Ing-wen, et a remporté l'élection avec un léger avantage, devenant le nouveau leader de Taïwan. Une fois les résultats annoncés, cela a immédiatement attiré l'attention et stupéfié le peuple taïwanais.\n\nCette victoire a été interprétée par les médias internationaux comme un reflet des fluctuations drastiques de l'opinion publique à Taïwan. Les experts ont souligné que les difficultés économiques et de subsistance, l'intensification des confrontations politiques et le mécontentement envers les politiques trans-détroit du gouvernement actuel sont devenus les raisons dominantes pour lesquelles les électeurs se tournent vers les forces conservatrices. Le camp de Han Kuo-yu déclare que cette victoire était « le désir du peuple pour du pain et la paix ».\n\nLa Chine continentale a exprimé une « évaluation positive » des résultats électoraux et a présenté un geste de bonne volonté, manifestant sa disposition à reprendre les consultations et les échanges sur la base du « Consensus de 1992 ». Taipei entre dans une phase de réorganisation politique, et la direction du PDP a tenu une réunion d'urgence.\n\nLa communauté internationale porte désormais son attention sur la situation et exhorte le nouveau gouvernement taïwanais à maintenir le statu quo et à sauvegarder la paix régionale. Les gouvernements du Japon, du Royaume-Uni et d'autres alliés de l'OTAN ont appelé à une « transition rationnelle » pour empêcher l'instabilité de se propager à la région indo-pacifique."
roc.28.t: "Les tensions entre la Chine et Taïwan s'apaisent"
roc.29.a: "Continuer à surveiller le détroit, soutenir tous les efforts pour maintenir l'unité nationale..."
roc.29.d: "Les élections générales taïwanaises de 2020 étant arrivées à leur terme, Tsai Ing-wen, candidate du Parti démocrate progressiste, revendique la victoire. Les départements concernés du continent ont solennellement réitéré que Taïwan appartient à la Chine depuis les ères anciennes, et que l'État ne permettra jamais à aucune « indépendance taïwanaise » de diviser le pays ni aux forces sécessionnistes de faire sécession de Taïwan sous quelque nom ou par quelque moyen que ce soit.\n\nLe porte-parole du Bureau des affaires taïwanaises du Conseil d'État a sévèrement condamné les autorités du PDP pour leur refus de reconnaître le « Consensus de 1992 », défiant ouvertement le principe d'une seule Chine et sapant gravement la paix et la stabilité du détroit de Taïwan. Le porte-parole a souligné que la patrie a la volonté ferme, la confiance absolue et la capacité suffisante pour contrer toute forme de tentative séparatiste « pro-indépendance taïwanaise ».\n\nPékin a insisté sur le fait que la question de Taïwan relève des affaires intérieures de la Chine, et que toute ingérence des forces extérieures sera résolument contrebalancée. Le continent a averti que toute collusion et provocation entre les forces « pro-indépendance taïwanaise » et les forces extérieures sera traitée de manière efficace.\n\nLes analystes ont souligné que bien que le PDP continue d'avancer obstinément sa position séparatiste, la tendance historique est irréversible, la réunification de la patrie est inarrêtable, et tout acte de trahison nationale se soldera par un échec complet."
roc.29.t: "Le continent exprime une forte opposition à la victoire du PDP"
roc.291.a: "Nous nous opposons fermement à l'ingérence étrangère dans les affaires intérieures de la Chine."
roc.291.d: "Alors que les tensions s'intensifient dans le détroit de Taïwan, le département d'État américain publie une déclaration réitérant sa position « d'opposition à tout changement unilatéral du statu quo ».\n\nLa déclaration met l'accent sur le fait que la « politique américaine envers Taïwan reste inchangée », et que Washington respecte la loi sur les relations avec Taïwan et les six assurances. Les États-Unis exhortent les deux parties à « faire preuve de retenue et à éviter les erreurs de jugement ».\n\nUn porte-parole du département d'État déclare : « Nous sommes profondément préoccupés par la récente augmentation des tensions dans le détroit de Taïwan ». « Nous réitérons que la paix et la stabilité servent les intérêts communs de la communauté internationale. Nous appelons toutes les parties à s'abstenir d'actions unilatérales – en particulier l'usage de la force ou de la coercition – qui risquent d'entraîner une escalade ».\n\nLa présence de plusieurs navires dans le Pacifique occidental fait partie des « opérations routinières de liberté de navigation ». Bien que Pékin ait critiqué cette mesure comme une « ingérence dans les affaires intérieures », les responsables américains maintiennent que de telles opérations sont « entièrement conformes au droit international et sans rapport avec les développements régionaux actuels »."
roc.291.t: "Le département d'État américain publie une déclaration sur le détroit de Taïwan"
roc.292.a: "Ceci est une grave violation de la souveraineté de la Chine !"
roc.292.d: "Alors que la situation dans le détroit de Taïwan reste tendue, le président Donald Trump annonce lors d'une conférence de presse son « paquet d'aide défensive historique » pour Taïwan.\n\nLe paquet comprend des missiles antiaériens, des systèmes radar, des drones et « un nombre limité d'armes anti-navires ». Trump affirme : « Taïwan se bat pour la liberté. L'Amérique ne restera pas les bras croisés ».\n\nLa déclaration attire l'attention internationale. Bien que des voix bipartisanes au Congrès aient exprimé leur soutien, le ministère chinois des Affaires étrangères condamne fermement l'annonce et met en garde Washington « contre le jeu avec le feu ».\n\nLe Pentagone note qu'il « examine la logistique des transferts potentiels », mais souligne que « tout soutien militaire à Taïwan sera de nature défensive et conforme au cadre légal existant »."
roc.292.t: "Trump annonce une aide militaire à Taïwan"
roc.293.a: "La tempête est arrivée."
roc.293.d: "La présidente de la Chambre des représentants américaine, Nancy Pelosi, arrive à Taipei à bord d'un avion militaire et prononce un discours au parlement de l'île. Dans ses remarques, elle met l'accent sur le « soutien de l'Amérique au système démocratique de Taïwan », déclare que « Taïwan n'est pas seul » et appelle à des liens plus étroits entre les États-Unis et Taïwan.\n\nEn réponse, le commandement du théâtre oriental de l'APL annonce le lancement d'« exercices de combat réel entourant l'île ». De multiples unités navales et aériennes mènent de vastes exercices avec tirs réels autour de Taïwan, simulant des blocus conjoints, des frappes de percée et des opérations de déni de zone. Plusieurs missiles survolent l'île, incitant Taïwan à élever son alerte de défense aérienne au niveau le plus élevé.\n\nBien que la Maison Blanche ait tenté de minimiser la visite comme « un voyage personnel de la présidente », les observateurs internationaux l'ont largement vue comme une escalade sérieuse des tensions sino-américaines."
roc.293.t: "La visite de Pelosi à Taïwan secoue la région"
roc.3.a: "Nous devons nous défendre"
roc.3.d: ""
roc.3.t: "Formation de l'Organisation de défense du traité du Pacifique"
roc.30.a: "Nous continuerons à surveiller les activités de l'APL dans le détroit de Taïwan"
roc.30.b: "Toutes les actions nécessaires seront prises pour défendre l'intégrité territoriale de la Chine"
roc.30.d: "La situation dans le détroit de Taïwan tremble face aux récents exercices militaires à grande échelle de l'Armée populaire de libération (APL) dans le détroit et les zones maritimes et aériennes environnantes. Les sujets des exercices incluent le contrôle conjoint, les frappes à longue portée et les opérations coordonnées mer-air, marquant l'un des entraînements de combat réel les plus intensifs des dernières années.\n\nLe porte-parole du ministère de la Défense nationale déclare que cet exercice est une réponse nécessaire aux changements actuels de la situation dans le détroit de Taïwan, visant à défendre la souveraineté nationale et l'intégrité territoriale tout en maintenant la paix et la stabilité régionales. Le porte-parole souligne que l'APL continuera à renforcer ses capacités de combat et à contrer toutes les provocations séparatistes et les ingérences extérieures.\n\nLes autorités taïwanaises accusent le continent d'« escalader les tensions régionales », et le ministère de la Défense à Taipei affirme avoir surveillé de près les exercices et élevé son état de préparation au combat pour prévenir les « incidents imprévus ».\n\nLes experts militaires illustrent que, avec la détérioration récente des relations trans-détroit, le risque de confrontations armées continue d'augmenter. La pression militaire de l'APL est vue comme une réponse directe à la promotion continue par les autorités du PDP de l'« indépendance taïwanaise incrémentale », tandis que Taipei adopte une position plus dure et renforce sa résistance avec le soutien des forces extérieures. La stabilité régionale du détroit risque de rester élevée à court terme, posant de sérieux défis à la stabilité régionale."
roc.30.t: "Les exercices de l'APL escaladent les tensions dans le détroit de Taïwan"
