  CHI_the_mainland_conflict_category_desc: "Nous sommes officiellement connus sous le nom de République de Chine, bien que nous ne contrôlions que l’île de Taïwan, ce qui a causé de nombreux problèmes au sein de notre nation."
  CHI_test_of_will: "Épreuve de volonté"
  CHI_test_of_will_desc: "\n\n\n\n\n£GFX_CHI_test_of_will_banner \n\n\n\n\n\nIl y a plus de 70 ans, la guerre civile sanglante en Chine a pris fin. Notre peuple a connu des décennies de paix et de prospérité, mais cela ne pouvait pas durer éternellement. Le monde change, se radicalise, brûle, et il semble que nous serons l’une des premières victimes de ces circonstances désastreuses.\nLes braises oubliées de la guerre civile se ravivent avec une vigueur renouvelée, et il ne faudra pas longtemps avant que nous devions nous lever pour défendre nos propres vies.\n§3                                    Notre soleil ne devrait jamais s’éteindre.§!"
