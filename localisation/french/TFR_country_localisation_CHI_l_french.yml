roc.16.a: "Le loup gagne quand les bergers se disputent."
roc.16.d: "Après avoir repoussé les troupes du continent lors de la récente guerre, Taïwan a annoncé qu'il est désormais en mesure de tenir à nouveau des élections libres conformément à la constitution. Comme la récente guerre a suscité une haine massive envers la Chine continentale, le camp bleu a perdu une part importante d'électeurs qui blâment le parti pour son incapacité à assurer la paix ou le voient comme des collaborateurs potentiels de la Chine continentale. Parallèlement, les politiciens du camp vert ont subi un coup dur, car ils ont été accusés d'avoir conduit à la guerre et au bain de sang qui a frappé Taïwan. Entre-temps, les politiques radicales de la présidence précédente ont poussé de nombreux électeurs neutres vers le Parti du peuple taïwanais. En conséquence, un outsider politique – le Parti du peuple taïwanais sous Ko Wen-je – a réussi à défier le système bipartisan bleu-vert traditionnel de Taïwan, remportant une présidence inédite.\n\nLe nouveau président Ko Wen-je a remercié tous ses soutiens pour avoir réalisé ce miracle politique, et a simultanément annoncé ses propres plans pour la reconstruction."
