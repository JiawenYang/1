  #Ideas
  CHI_american_protection_idea: "Protection américaine"
  CHI_american_protection_idea_desc: "En s’appuyant uniquement sur la force militaire des forces armées de la République de Chine, il est clair que nous ne pouvons pas résister seuls au Parti communiste chinois. Le maintien de la paix dépend entièrement de la politique des États-Unis, qui exige que le statu quo ne soit pas modifié.\n\nLa Septième Flotte agit comme une force de stabilisation, semblable à un pilier de certitude, soutenant la paix fragile à travers le détroit de Taïwan. Cependant, ce bouclier puissant implique une autre conséquence : une fois ce soutien perdu, l’ennemi frappera inévitablement."
  CHI_taiwanese_independence_movement_idea: "Mouvement pour l’indépendance de Taïwan"
  CHI_taiwanese_independence_movement_idea_desc: "\n\n\n\n£GFX_CHI_taiwanese_independence_movement_banner\n\n\n\n\n\nLa République de Chine, également connue sous le nom de Taïwan, a été récemment désignée comme la « République de Chine (Taïwan) ». Cette appellation reflète la confusion idéologique au sein de la région. En effet, nous ne sommes même pas reconnus comme un pays par la communauté internationale, ce qui a alimenté l’essor du mouvement pour l’indépendance de Taïwan.\n\nDepuis son retrait des Nations Unies, le statut international de la République de Chine a chuté. Ce déclin a stimulé l’émergence d’une conscience locale, qui a ensuite pris une place centrale lors du mouvement de démocratisation et a finalement acquis un pouvoir politique.\n\nMalgré cela, la majorité de la société soutient encore le maintien du statu quo, rendant le chemin vers un changement officiel de nom très lointain."
  CHI_taiwanese_independence_movement_2_idea: "Mouvement pour l’indépendance de Taïwan"
  CHI_taiwanese_independence_movement_2_idea_desc: "\n\n\n\n£GFX_CHI_taiwanese_independence_movement_banner\n\n\n\n\n\nLa République de Chine, également connue sous le nom de Taïwan, a été récemment désignée comme la « République de Chine (Taïwan) ». Cette appellation reflète la confusion idéologique au sein de la région. En effet, nous ne sommes même pas reconnus comme un pays par la communauté internationale, ce qui a alimenté l’essor du mouvement pour l’indépendance de Taïwan.\n\nDepuis son retrait des Nations Unies, le statut international de la République de Chine a chuté. Ce déclin a stimulé l’émergence d’une conscience locale, qui a ensuite pris une place centrale lors du mouvement de démocratisation et a finalement acquis un pouvoir politique.\n\nMalgré cela, la majorité de la société soutient encore le maintien du statu quo, rendant le chemin vers un changement officiel de nom très lointain."
  CHI_lower_mainland_influence_idea: "Influence terrible du continent"
  CHI_lower_mainland_influence_idea_desc: "\n\n\n\n£GFX_CHI_terrible_mainland_influence_banner\n\n\n\n\n\nAu cours du dernier siècle, nous nous tenions autrefois fiers sur le sol de la Chine, jusqu’à l’éclatement de la guerre civile. Une série de revers dus à divers facteurs nous a forcés à nous retirer à Taïwan, entraînant la perte de contrôle sur le continent.\n\nAvec le temps, la République de Chine est généralement devenue un terme historique dans l’esprit des Chinois du continent. Ceux qui connaissent son existence ont souvent des opinions extrêmement négatives, tandis que nos partisans sont rejetés comme des idéologues risibles sur Internet."
  CHI_low_mainland_influence_idea: "Faible influence du continent"
  CHI_low_mainland_influence_idea_desc: "\n\n\n\n£GFX_CHI_terrible_mainland_influence_banner\n\n\n\n\n\n"
  CHI_medium_mainland_influence_idea: "Influence modérée du continent"
  CHI_medium_mainland_influence_idea_desc: "\n\n\n\n£GFX_CHI_terrible_mainland_influence_banner\n\n\n\n\n\n"
  CHI_high_mainland_influence_idea: "Forte influence du continent"
  CHI_high_mainland_influence_idea_desc: "\n\n\n\n£GFX_CHI_terrible_mainland_influence_banner\n\n\n\n\n\n"
  CHI_higher_mainland_influence_idea: "Influence exceptionnelle du continent"
  CHI_higher_mainland_influence_idea_desc: "\n\n\n\n£GFX_CHI_terrible_mainland_influence_banner\n\n\n\n\n\n"
  CHI_low_international_recognition_idea: "Faible reconnaissance internationale"
  CHI_low_international_recognition_idea_desc: "Sur la scène mondiale, le détroit de Taïwan représente un gouffre d’opposition irréconciliable, comme l’eau et le feu, incapables de coexister. Nous sommes constamment relégués au rang de partie exclue, rendant la participation aux organisations internationales une aspiration lointaine et inaccessible – une chose que d’autres tiennent pour acquise.\n\nPourtant, comme le montre la nature, la vie trouve toujours un chemin. Que ce soit sous le couvert de titres régionaux ou grâce aux efforts des groupes civiques, notre nation persiste à trouver des canaux indirects pour la diplomatie multilatérale, bien que ces voies restent profondément limitées."
  CHI_prc_embargo_low_idea: "Embargo chinois"
  CHI_prc_embargo_low_idea_desc: "La stratégie ambiguë de la présidente Tsai s’est révélée inefficace. Pékin reste en colère, forçant notre gouvernement à réagir, ce qui a finalement conduit à un arrêt complet des échanges à travers le détroit, rappelant l’ère de Chiang Kai-shek.\n\nBien que le gouvernement ait travaillé à développer des marchés alternatifs, ces efforts ont été insuffisants, laissant la plupart des habitants de l’île supporter les effets sévères des sanctions."
  CHI_prc_embargo_idea: "Embargo chinois"
  CHI_prc_embargo_idea_desc: "La stratégie ambiguë de la présidente Tsai s’est révélée inefficace. Pékin reste en colère, forçant notre gouvernement à réagir, ce qui a finalement conduit à un arrêt complet des échanges à travers le détroit, rappelant l’ère de Chiang Kai-shek.\n\nBien que le gouvernement ait travaillé à développer des marchés alternatifs, ces efforts ont été insuffisants, laissant la plupart des habitants de l’île supporter les effets sévères des sanctions."
  CHI_prc_embargo_idea1: "Embargo chinois"
  CHI_prc_embargo_idea1_desc: "La stratégie ambiguë de la présidente Tsai s’est révélée inefficace. Pékin reste en colère, forçant notre gouvernement à réagir, ce qui a finalement conduit à un arrêt complet des échanges à travers le détroit, rappelant l’ère de Chiang Kai-shek.\n\nBien que le gouvernement ait travaillé à développer des marchés alternatifs, ces efforts ont été insuffisants, laissant la plupart des habitants de l’île supporter les effets sévères des sanctions."
