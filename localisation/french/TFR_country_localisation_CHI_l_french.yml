  taiwan.500.t: "Notre guerre finale"
  taiwan.500.d: "Après des semaines de mouvements suspects de l’EADI et l’escalade croissante de la guerre froide sino-japonaise atteignant un nouveau paroxysme, de nombreux observateurs internationaux ont anticipé l’arrivée imminente d’une guerre ouverte. Bien que l’OTDP ait intensifié ses missions diplomatiques pour tenter de désamorcer la situation, Tokyo et Pékin ont tous deux annoncé qu’un état de guerre existe désormais entre les deux coalitions, et nous sommes forcés de nous battre une fois de plus pour notre survie.\n\nAvec tous les efforts diplomatiques ayant échoué, le conflit régional le plus féroce de l’Asie-Pacifique s’est déployé devant nous. Avec plus de 3 milliards de personnes impliquées dans la plus grande guerre que l’humanité ait connue jusqu’à présent, nous ne pouvons pas raisonnablement espérer que les Chinois se retireront simplement cette fois. Soit l’OTDP démantèle complètement la machine de guerre chinoise et leur capacité à relancer un conflit, soit l’EADI avancera pour soumettre le reste de l’Asie.\n\nPour nous, c’est la deuxième fois ce siècle que nous faisons face à une menace existentielle. Battus mais invaincus, le nouveau gouvernement chinois, motivé par un sentiment revanchard et de nouveaux alliés à travers l’Asie, tentera sans doute de détruire notre gouvernement et notre système démocratique, comme il l’a tenté en 2021. Pour sécuriser notre avenir, nous avons décidé de nous impliquer dans la Grande Guerre Asiatique, combattant côte à côte avec nos alliés démocratiques pour vaincre l’alliance dirigée par Pékin, une fois pour toutes."
  taiwan.500.a: "Aux armes !"
  #sub-sub ideologies
  loc_taiwanese_progressivism: "Progressisme taïwanais"
  CHI_neoliberalism_desc: "\n\n\n\n£GFX_CHI_ideology_neoliberalism\n\n\n\n\n\n§YProgressisme taïwanais§! est une idéologie soutenue par le Parti progressiste démocratique (PPD), d’autres partis Pan-Verts, et certaines figures indépendantes. Le Parti progressiste démocratique, chef de la Coalition Pan-Verte, est issu des mouvements Tangwai qui ont débuté au milieu des années 1970. En raison de son histoire de résistance à la tutelle du Kuomintang et à la Terreur Blanche, le PPD considère la démocratie libérale, la justice politique et l’égalitarisme comme ses idéologies fondamentales. Ces valeurs ont ensuite été héritées par le mouvement progressiste taïwanais dans son ensemble. Au fil des années, il a également intégré des idées anti-communistes en raison de l’hostilité croissante du Parti communiste chinois et prône la déconnexion de Taïwan du continent chinois.\n\nAujourd’hui, le progressisme taïwanais défend de multiples causes, y compris la liberté et l’égalité sociales, la durabilité environnementale, les droits LGBTQ+, et l’indépendance de Taïwan, et reste un mouvement significatif dans la politique taïwanaise."
  loc_taiwanese_conservatism: "Constitutionnalisme taïwanais"
  CHI_constitutionalist_desc: "\n\n\n\n£GFX_CHI_ideology_constitutionalism\n\n\n\n\n\n§YConstitutionnalisme taïwanais§!, soutenu par le Kuomintang (KMT), le Parti populaire d’abord (PPA), et plusieurs figures indépendantes, est une forme localisée de constitutionnalisme qui soutient la continuation de la République de Chine, des politiques sociales libérales-conservatrices, et une relation modérée avec la Chine continentale. Initialement ancré dans les trois principes du peuple et le conservatisme social, le constitutionnalisme taïwanais a adopté une approche plus libérale au fil des années pour rester compétitif dans le Taïwan post-loi martiale.\n\nAujourd’hui, le constitutionnalisme taïwanais est principalement caractérisé par sa politique économique protectionniste, le nationalisme chinois, des politiques sociales centristes, et l’anti-communisme progressivement diminuant hérité du chiangisme, et reste l’une des plus grandes factions dans la politique taïwanaise."
  loc_taiwanese_liberal_populism: "Populisme libéral"
  taiwanese_liberal_populism: "Populisme libéral"
  taiwanese_liberal_populism_desc: "Le populisme libéral taïwanais est une variante du conservatisme libéral, mettant l’accent sur la conquête des suffrages en répondant aux besoins du peuple, en fournissant activement des services, et en améliorant les conditions de vie des franges moins favorisées de la société.\n\nEn raison de son accent sur la sécurisation des élections, l’idéologie est souvent décrite comme « manquant de principes » et incapable de définir clairement ses limites. Au lieu de l’appeler une « idéologie », beaucoup préfèrent la qualifier de stratégie électorale pour mieux représenter sa véritable nature."
  loc_taiwanese_reformed_tridemism: "Tridémisme réformé"
  reformed_tridemism: "Tridémisme réformé"
  reformed_tridemism_desc: "Le tridémisme, ou les Principes du Peuple, se compose de trois composantes d’égale importance : le nationalisme, la démocratie et le bien-être.\n\nÀ l’aube du 21e siècle, la forme originale du tridémisme a commencé à montrer son incapacité à gouverner une société moderne. Cela a incité beaucoup à poursuivre une version réformée de l’idéologie.\n\nPar rapport à son prédécesseur, le tridémisme réformé réduit l’importance du nationalisme tout en mettant l’accent sur l’expansion du bien-être, le considérant comme la composante la plus importante de l’idéologie modernisée. D’autre part, la démocratie, désormais considérée comme un besoin fondamental du peuple, est intégrée dans le concept plus large de bien-être, laissant le bien-être comme seul point d’accent du tridémisme réformé."
  loc_taiwanese_OCTS_democracy: "Démocratie « Un pays, deux systèmes »"
  CHI_market_socialism_desc: "\n\n\n\n£GFX_CHI_ideology_market_socialism\n\n\n\n\n\nÀ première vue, l’idée de §Y« Un pays, deux systèmes »§! peut sembler être une expérience politique fantaisiste ou un plan inhabituel pour saper la souveraineté nationale. Cependant, dans les villes côtières d’Asie de l’Est, ce système politique unique est en place depuis près de quarante ans. Il a été conçu à une époque où la puissance économique et l’influence politique de la Chine étaient encore relativement faibles. C’était une réponse pragmatique pour équilibrer les conflits intenses entre le socialisme et le capitalisme. Sous ce système, la Région administrative spéciale conserve la même souveraineté que le gouvernement central mais bénéficie d’une autonomie significative, avec la liberté d’établir ses propres organes gouvernementaux et institutions législatives. Cela permet une élaboration et une mise en œuvre des politiques presque sans restrictions. Contrairement aux confédérations traditionnelles, où les États membres exercent souvent une autonomie significative, la Région administrative spéciale est généralement confinée à une seule ville, minimisant le risque que des sentiments séparatistes déstabilisent l’union.\n\nAujourd’hui, alors que l’équilibre des pouvoirs et le climat politique ont évolué, la logique derrière « Un pays, deux systèmes » a changé. Initialement conçu pour protéger et séparer, il est maintenant devenu une plateforme pour favoriser des échanges multilatéraux plus profonds. « Un pays, deux systèmes » est un cadre essentiel pour faciliter la coexistence pacifique de personnes ayant des idéologies différentes, promouvoir l’interaction et l’intégration entre divers systèmes politiques et économiques, et finalement favoriser l’harmonie dans les valeurs."
