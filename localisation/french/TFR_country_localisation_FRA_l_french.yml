 FPR_utopia_academic_investment_decision:0 "§pUtopie§! : traiter les problèmes §Yacadémiques§!"
 FPR_utopia_academic_investment_decision_desc:0 "En investissant de l'argent pour résoudre les problèmes académiques, nous pouvons améliorer notre développement académique."
 FPR_utopia_agricultural_investment_decision:0 "§pUtopie§! : traiter les problèmes §Yagricoles§!"
 FPR_utopia_agricultural_investment_decision_desc:0 "En investissant de l'argent pour résoudre les problèmes agricoles, nous pouvons améliorer notre développement agricole."
 FPR_utopia_poverty_investment_decision:0 "§pUtopie§! : traiter les problèmes de §Ypauvreté§!"
 FPR_utopia_poverty_investment_decision_desc:0 "En investissant de l'argent pour lutter contre la pauvreté, nous pouvons réduire notre taux de pauvreté."
 FPR_utopia_industry_investment_decision:0 "§pUtopie§! : traiter les problèmes §Yindustriels§!"
 FPR_utopia_industry_investment_decision_desc:0 "En investissant de l'argent pour résoudre les problèmes industriels, nous pouvons améliorer notre développement industriel."
 FPR_utopia_society_investment_decision:0 "§pUtopie§! : traiter les problèmes de §Ysociété§!"
 FPR_utopia_society_investment_decision_desc:0 "En investissant de l'argent pour résoudre les problèmes de société, nous pouvons améliorer notre développement social."
