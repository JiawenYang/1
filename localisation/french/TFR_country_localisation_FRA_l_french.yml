 FPR_global_revolution_category:0 "Cœur de la Révolution permanente"
 FPR_global_revolution_category_desc:0 "\n\n\n\n\n£GFX_FPR_permanent_revolution_cat\n\n\n\n\n\n\n\nPour la véritable libération d'une nation, le prolétariat doit lutter sans cesse et pour toujours pour son émancipation. Il ne doit y avoir aucune pause ni interruption dans sa lutte pour la liberté ; il doit toujours détruire l'oppression lorsqu'il la voit dans la nation.\n\nL'idée de la Révolution permanente, conceptualisée par Trotsky, doit être incarnée pleinement et véritablement. Si elle ne l'est pas, nous serions des traîtres à notre propre cause, abandonnant l'idéal prolétarien."
