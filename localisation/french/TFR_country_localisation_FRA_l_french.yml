 FAF_grande_armee_dynamic_desc:0 "\n\n\n\n\n£GFX_FAF_national_duty\n\n\n\n\n\n"
 FAF_heirs_of_charlamagne_cat:0 "Héritiers de Charlemagne"
 FAF_heirs_of_charlamagne_cat_desc:0 "\n\n\n\n\n£GFX_FAF_monarchism_cat\n\n\n\n\n\n\n\nPendant un millénaire, la dynastie capétienne régna avec honneur et civilité sur les terres de France, définissant ce que signifiait être une puissance européenne et défendant son honneur lorsque le perfide Albion ou les misérables Habsbourg tentaient de rayer notre nation de la Terre de Dieu. Mais notre Roi, fort du consentement divin de Dieu, défendit notre nation encore et encore. Puis, un jour, cela changea. \nPar notre aide aux révolutionnaires américains, leurs idéaux cancéreux de républicanisme se répandirent en France et renversèrent rapidement notre monarchie au moment où nous en avions le plus besoin. Deux cents ans plus tard, debout après notre défaite face à la Russie, nous voyons ce que mène un monde livré à la « plèbe »... L'Amérique est en ruines, la peste socialiste a balayé l'Europe de l'Est, manquant de faire sombrer notre bien-aimée France dans la tyrannie rouge. \n\nNous combattrons bec et ongles les forces déstabilisatrices qui veulent renverser notre Monarque choisi par Dieu. \n\nVIVE LA FRANCE ! VIVE LE ROI LOUIS XX !"
 FAF_growing_republican_army_corps_mission:0 "La flamme éternelle"
 FAF_growing_republican_army_corps_mission_desc:0 "\n\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\n\n\nDans un pâle écho de notre passé, il existe une clique républicaine au sein de notre Armée. Acharnée à détruire non seulement le Roi, mais aussi les droits de l'Église. 1793 ne doit pas se reproduire."
 FAF_royal_house_squabbles_mission:0 "Querelles royales"
 FAF_royal_house_squabbles_mission_desc:0 "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\nLa question de savoir qui détient le droit divin de gouverner la France ne devrait pas se poser, mais elle se pose, et jusqu'à ce que notre pouvoir soit assuré, nous devons composer avec des querelles enfantines qui nuisent à notre capacité de gouverner."
 FAF_nobility_cost_mission:0 "Le coût de la stabilité"
 FAF_nobility_cost_mission_desc:0 "\n\n\n\n\n£GFX_FAF_nobility\n\n\n\n\n\n\n\nLes luttes intestines de la noblesse menacent notre régime, mais les nobles sont comme toute classe d'élite en toute nation : l'argent les rend heureux, et des élites heureuses font une nation heureuse. Appelez cela cupidité, ils sont propriétaires terriens par droits anciens et divins, des droits que nous ferions bien de respecter afin qu'ils respectent les nôtres."
 FAF_Grant_Refuge_to_HRM:0 "Refuge familial"
 FAF_Grant_Refuge_to_HRM_desc:0 "\n\n\n\n\n£GFX_FAF_spanish_royalty\n\n\n\n\n\n\n\nNotre famille en Espagne, les légitimes souverains bourbons de notre voisin du sud, est assiégée par toutes sortes d'adversaires : anarchistes, sécessionnistes, nationalistes, républicains. Il serait injuste de les abandonner à la guillotine ; nous, Bourbons, avons eu trop de rencontres avec cette horrible machine."
 FAF_use_wealthy_connections_decision:0 "Utiliser ses relations fortunées"
 FAF_use_wealthy_connections_decision_desc:0 "Nos liens avec l'élite française nous donnent l'avantage unique de solliciter des faveurs pour soutenir nos projets nationaux. Au prix d'une faveur due à un noble, nous pouvons accroître temporairement notre production : un échange qui en vaut la peine."
 FAF_pay_for_the_arts_decision:0 "Mécénat artistique"
 FAF_pay_for_the_arts_decision_desc:0 "\n\n\n\n\n£GFX_FAF_patronage_of_the_arts\n\n\n\n\n\n\n\nLes arts sont toujours le cœur et l'âme d'une nation, façonnant sa culture. Les périodes classique et de la Renaissance sont considérées comme des âges d'or de l'art, grâce au large soutien des monarchies étrangères à son développement. Que la France redevienne un centre du grand art ; finançons de nouveaux chefs-d'œuvre."
 FAF_beautify_the_countryside_decision:0 "Embellir les campagnes"
 FAF_beautify_the_countryside_decision_desc:0 "Notre pays est beau ! \nNos routes sont belles ! \nNos villes sont belles ! \nNos panoramas sont beaux !"
 FAF_man_of_god_decision:0 "Homme de Dieu"
 FAF_man_of_god_decision_desc:0 "\n\n\n\n\n£GFX_FAF_man_of_god\n\n\n\n\n\n\n\nLe Roi est un souverain pieux, aussi pieux que pragmatique et bienveillant, guidé autant par Dieu que par le bien du peuple. C'est un homme imparfait, mais éternellement reconnaissant du pardon de Dieu, comme chacun devrait l'être."
 FAF_divine_right_to_rule_decision:0 "Le droit divin"
 FAF_divine_right_to_rule_decision_desc:0 "\n\n\n\n\n£GFX_FAF_divine_right_to_rule\n\n\n\n\n\n\n\nAprès mûre délibération, nous avons gagné les cœurs et les esprits du peuple et de la noblesse ; la maison de Bourbon, héritière légitime de la maison de Valois, brandira de nouveau la bannière de la France sainte. Vive le Roi !"
 FAF_divine_right_tt:0 "§YCela §!§Récartera la menace des dynasties adverses§!"
 FAF_replace_possible_republicans_decision:0 "Lancer une enquête sur l'armée"
 FAF_replace_possible_republicans_decision_desc:0 "\n\n\n\n\n£GFX_FAF_lecointre\n\n\n\n\n\n\n\nL'Armée est pleine de détracteurs, d'athées, de républicains et de socialistes ; nous trancherons le cancer à la racine et, avec le temps, la plaie se refermera plus solide."
 FAF_sway_the_nobility_decision:0 "Gagner la noblesse"
 FAF_sway_the_nobility_decision_desc:0 "Posséder simplement le droit divin ne suffit pas pour la noblesse : la divinité est une autre affaire pour les ducs, les comtes et les patriciens. Si les orléanistes et les bonapartistes leur font une meilleure offre, ils deviennent soudain divins par leur « bienveillance ». Eh bien, nous devrons être tout aussi « bienveillants » si nous voulons assurer notre pouvoir."
 FAF_ancien_regime_dynamic:0 "Ancien Régime"
 FAF_ancien_regime_dynamic_desc:0 "\n\n\n\n\n£GFX_FAF_ancien_regime\n\n\n\n\n\n\n\nNous régnons par droit divin, et pourtant nous gouvernons des millions d'âmes qui ont chacune leurs désirs et leurs besoins. Le nouvel Ancien Régime ne répétera pas les erreurs du précédent, mais de la même manière, le souverain restera sans entraves, ne répondant qu'à Dieu, le bien-être de la France étant entièrement confié à la volonté divine de notre souverain. Vive le Roi !"
 FAF_ancien_regime:0 "Ancien Régime"
