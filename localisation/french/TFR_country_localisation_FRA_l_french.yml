 FAF_latin_military_integration_law_desc:0 ""
 FAF_napoleonic_sympathies_dynamic:0 "Héritage napoléonien"
 FAF_napoleonic_sympathies_dynamic_desc:0 "Notre État a une histoire fière et grandiose. L'État français est bâti sur les accomplissements de Napoléon Bonaparte et de la famille Bonaparte — qui ont vaincu toute l'Europe à eux seuls à plusieurs reprises avant d'être finalement vaincus par simple épuisement. Aucun éclat n'égalera jamais celui de la France, de l'Empire français. C'est le plus grand État de toute l'Europe, et il le restera à jamais."
