 FRA_Anti_Police_Riots_Category:0 "Manifestations de Majid Kattan"
 FRA_Anti_Police_Riots_Category_desc:0 "Après le meurtre de Majid Kattan, un ressortissant tunisien non armé, par un policier à Bobigny, Paris a sombré dans l'anarchie : des manifestants ont incendié des voitures, détruit des abribus et tiré des feux d'artifice sur la police. Ces manifestations se sont étendues à tout le pays et ont rivalisé avec les troubles provoqués par les manifestations des Gilets jaunes observées ces cinq dernières années.\n\nBien que la France soit bâtie sur l'idée de Révolution, les temps changent en Europe, et avec une Russie de nouveau puissante à l'Est, nous ne pouvons plus nous permettre de rester les bras croisés tandis que des manifestants détruisent des infrastructures cruciales."
