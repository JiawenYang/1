 FAF_Strict_Martial_Law_idea:0 "Loi martiale"
 FAF_Strict_Martial_Law_idea_desc:0 "La loi martiale restera en vigueur tant que les ennemis de la France rôderont. La vie quotidienne étouffe sous les checkpoints et la surveillance constante. La peur maintient les déviants dans le rang, même si le sentiment de normalité reste ébranlé."
 FAF_Fascist_Paramilitaries_idea:0 "Paramilitaires fascistes"
 FAF_Fascist_Paramilitaries_idea_desc:0 "Un réseau de paramilitaires fascistes impose la loyauté au régime et agit en toute impunité sur tout le territoire français. Leurs méthodes brutales étouffent la dissidence mais nourrissent le ressentiment parmi les civils. Malgré cela, leur capacité à garantir le contrôle est précisément ce dont notre nation a besoin."
