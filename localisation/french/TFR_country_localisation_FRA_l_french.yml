 FAF_Spanish_Claims_disregarded_tt:0 "Renonçant aux intérêts plus vastes de la France dans la région, nous soutiendrons plutôt l'[SNS.GetFlag] §YÉtat national espagnol§! dans ses revendications sur les terres d'Espagne."
 FRA_Algerian_Volunteers:0 "§RNous enverrons nos fils reconquérir la province rebelle...§!"
 FRA_Melenchon_Support_Sejourne_tt:0 "Nous aurons l'aide de Mélenchon et des socialistes pour combattre le régime d'extrême droite de Le Pen..."
 FRA_Gontard_Support_Sejourne_tt:0 "Nous aurons l'aide de Gontard et des Verts pour combattre le régime d'extrême droite de Le Pen..."
