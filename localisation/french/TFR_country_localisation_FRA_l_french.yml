 FAF_national_duty:0 "Devoir national"
 FAF_national_duty_desc:0 "\n\n\n\n£GFX_FAF_national_duty\n\n\n\n\n\nNotre devoir envers la France a revêtu bien des formes au cours de notre histoire, mais une chose sera toujours exigée de notre nation : l'engagement. Avec l'établissement de notre nouveau régime, des centaines de milliers de Français patriotes se sont présentés, prêts à servir la France de la manière la plus honorable connue de l'homme. Nous ferons notre devoir en préparant ces hommes à la continuation inévitable de la guerre européenne, alors qu'ils s'apprêtent à combattre non seulement pour eux-mêmes, mais pour la France !"
