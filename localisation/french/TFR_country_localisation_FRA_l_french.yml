 FAF_brick_by_brick_idea:0 "Pierre par pierre"
 FAF_brick_by_brick_idea_desc:0 "Notre nation a été bâtie à la sueur de notre front, du sang de notre peuple et du sacrifice de nombreuses générations. Après notre défaite lors de la guerre russo-européenne, notre pays gît désormais en ruines. Nos maisons ont été réduites en poussière et nos usines rasées. Le mécontentement grandit dans tout le pays et les mouvements séparatistes s'amplifient de jour en jour. Il est vital de restaurer la gloire et la fierté perdues de notre nation. Pièce par pièce et pierre par pierre, nous devons relever la France de sa situation actuelle pour la ramener vers la prospérité."
