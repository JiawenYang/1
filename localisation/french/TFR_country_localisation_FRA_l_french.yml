 FAF_seventh_french_republic_category:0 "Bâtir la 7e République"
 FAF_seventh_french_republic_category_desc:0 "\n\n\n\n\n£GFX_FRA_new_republic_category\n\n\n\n\n\n\n\nNotre république tient bon malgré toutes les épreuves que nous avons endurées. Nous prendrons toutes les mesures possibles pour que notre démocratie ne soit plus jamais aussi proche de l'effondrement. La France préservera la beauté des fleurs de la démocratie et les laissera de nouveau s'épanouir dans tout le pays, afin de guérir les cicatrices laissées par la terrible guerre civile qui a failli nous prendre tout ce à quoi nous tenons. \n\nLes échecs de la république passée resteront à jamais gravés comme notre heure la plus sombre, mais aussi comme la preuve de notre détermination à combattre toutes les terreurs dirigées contre les droits des hommes libres. Forts de la puissance que Dieu nous accorde, nous resterons un bastion de la démocratie en Europe, tandis que les fascistes et les communards renversent tout ce pour quoi nous avons œuvré. Nous triompherons de cette grande obscurité à la lumière du flambeau de la liberté, qui brillera aux confins de l'Europe. \n\nLiberté triomphera !"
