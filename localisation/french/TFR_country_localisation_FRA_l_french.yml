 FAF_hold_military_parade_decision:0 "Montrer notre force"
 FAF_hold_military_parade_decision_desc:0 "Notre défaite totale dans la guerre russo-européenne a devasté notre nation non seulement physiquement, mais aussi mentalement. Notre psychisme national est imprégné de défaite et de devastation, laissant notre peuple peu disposé à combattre. Nous devons encourager le peuple français en lui rappelant que la France reste une nation forte et puissante — une nation qui ne craint pas ses ennemis et n'hésitera pas à protéger son peuple."
 FAF_celebrate_our_victories_decision:0 "Récompenser les vainqueurs"
 FAF_celebrate_our_victories_decision_desc:0 "Peu importait l'acharnement au travail ou l'ardeur du processus ; seul le résultat comptait. En fin de compte, il n'y a que deux issues à tout : le succès ou l'échec, la victoire ou la défaite. Ceux qui gagnent et réussissent doivent être récompensés pour inspirer les autres à viser la victoire et le succès. Après tout, le mérite prime avant tout."
 FAF_hail_to_the_chief_decision:0 "Vive le chef !"
 FAF_hail_to_the_chief_decision_desc:0 "Le leadership et une organisation structurelle claire sont essentiels à la stabilité et au succès. C'est essentiel au succès d'une armée, au fonctionnement d'une entreprise ; même le crime organisé en dépend. Alors que nous avons triomphé au travers de l'anarchie qui ravageait la France, nous devons rebâtir cette nation autour d'une figure centrale, un homme fort politique capable d'unir son peuple et de le rassembler pour une cause commune."
 FAF_heir_of_degaulle_decision:0 "Embrasser la pensée gaulliste"
 FAF_heir_of_degaulle_decision_desc:0 " Un homme comme Charles de Gaulle n'a pas besoin de présentation. Homme d'État audacieux et homme fort politique, il n'a jamais fait défaut au peuple ni à la nation français. Lorsque les Allemands occupèrent notre nation, brisèrent notre esprit national et asservirent notre peuple, la plupart des politiciens et des généraux cédèrent et acceptèrent la défaite — mais pas Charles de Gaulle. Il préférait mourir en combattant que vivre à genoux ! Pourtant c'était aussi un homme juste, un homme équitable. Un homme démocratiquement élu qui honorait la volonté du peuple français. Ce n'est qu'en aidant notre peuple à embrasser et accepter ses idéaux courageux et honorables que nous pourrons guider cette nation vers le droit chemin."
 FAF_culmination_of_degaulle_petainist_thought_decision:0 "Embrasser la pensée gaullo-pétainiste"
 FAF_culmination_of_degaulle_petainist_thought_decision_desc:0 "De Gaulle et Pétain avaient tous deux des traits honorables. Des principes qui leur permirent de briller dans cette sombre époque de l'histoire de France. De tels moments créent la division au sein de notre nation. Si nous n'embrassons que les idéaux d'un seul homme, les partisans de l'autre causeront sûrement le chaos. Ce n'est qu'en acceptant les deux groupes que nous pouvons garantir que l'unité soit rétablie dans notre nation."
 FAF_heir_of_petain_decision:0 "Embrasser la pensée pétainiste"
 FAF_heir_of_petain_decision_desc:0 "Il n'y a jamais eu d'homme plus controversé dans l'histoire de France. Certains affirment que Pétain était un traître, d'autres croient que tout ce qu'il a fait visait à protéger le peuple français. Mais nul ne peut contester qu'il fut et reste notre héros national. Il a laissé son empreinte à Verdun comme à Vichy, non pour sa gloire personnelle, mais pour la sécurité de la nation et du peuple français. Quoi qu'il ait fait ou non, c'était un homme de résolution, un homme d'un grand amour pour son peuple et sa nation, un homme qui donna tout pour combattre le venin rouge qui rendait notre nation malade. Il est crucial d'enseigner à notre peuple la vérité sur ce géant de l'histoire. Ils apprendront à embrasser notre culture et nos valeurs traditionnelles, et à se méfier de la menace bolchevique."
 FAF_work_v_decision:0 "Notre travail !"
 FAF_work_v_decision_desc:0 "Notre nation a été détruite et laissée dans une désolation totale par la horde russe. Beaucoup de travail reste à faire pour rebâtir tout ce qui a été réduit en poussière sous leurs bottes de fer. Notre esprit national attend encore d'être relevé, et notre peuple attend encore d'être nourri. Maintenant plus que jamais, nous devons nous consacrer à la tâche monumentale de restaurer notre patrie."
 FAF_family_v_decision:0 "Notre famille !"
 FAF_family_v_decision_desc:0 "Combien de familles ont été dévastées, séparées, détruites par cette guerre ? Cette guerre juste, contre un ennemi sanguinaire qui ne veut rien d'autre que détruire notre belle nation, notre Europe, terre ancestrale. Désormais, nous devons protéger notre foyer, notre famille, nos frères."
 FAF_fatherland_v_decision:0 "Notre patrie !"
 FAF_fatherland_v_decision_desc:0 " Pour quoi notre peuple combat-il ? Pour lui-même ? Non. Il combat pour une cause commune, une croyance commune et un but commun. Pour protéger et préserver ce qui lui est cher. Son foyer, sa terre, ses frères. "
 FAF_one_million_man_army_decision:0 "Une armée d'un million d'hommes"
 FAF_one_million_man_army_decision_desc:0 "Un million de soldats ! UN MILLION DE SOLDATS, BON SANG ! Des hommes prêts à mourir et à combattre pour leur pays. Des jeunes gens qui verseraient leur sang pour leur terre et leur peuple sans la moindre hésitation. Avec une armée aussi puissante, le peuple français peut être assuré que son pays le protégera."
 FAF_french_superiority_decision:0 "Supériorité française"
 FAF_french_superiority_decision_desc:0 "La culture française est parmi les cultures les plus — sinon la plus — dominantes au monde. L'ingéniosité et la créativité françaises ont porté notre nation sur la scène mondiale. Tout au long de l'histoire humaine, la France seule a été le centre de l'art, de la technologie et de la littérature. Ces faits indéniables ne font que prouver davantage notre supériorité naturelle sur les autres, qu'il s'agisse de nos frères européens ou de cultures plus lointaines."
 FAF_taunt_our_enemies_decision:0 "Narguer nos ennemis"
 FAF_taunt_our_enemies_decision_desc:0 "La France a d'innombrables ennemis, au-dedans comme au-dehors. Mais que peuvent faire ces rats ? Que peuvent faire ces chiens sans valeur pour nuire à notre nation ? Ils sont faibles, psychologiquement et physiquement. Les dégénérés communistes de notre pays sont devenus dociles tandis que les Russes sont trop occupés à se battre entre eux. Comment ne pas trouver risible que ce soient là nos soi-disant adversaires ? "
 FAF_our_french_mothers_decision:0 "Idolâtrer Jeanne d'Arc"
 FAF_our_french_mothers_decision_desc:0 "Le courage est le trait le plus noble qu'on puisse posséder. L'incarnation française du courage est Jeanne d'Arc. Elle s'est battue avec plus de bravoure que les hommes de ses rangs. Elle n'a ni pleuré ni crié quand des dégénérés et des traîtres l'ont brûlée vive sous de faux prétextes. Elle a combattu ses ennemis de toutes ses forces, sans jamais reculer, sans jamais faiblir. Elle demeure une idole que toute la France doit chérir. Tous nos hommes — nos soldats — doivent s'efforcer de ressembler à Jeanne d'Arc, combattant avec fougue et une loyauté inébranlable."
 FAF_revive_the_franco_german_brigades_decision:0 "Reconstruire les brigades franco-allemandes"
 FAF_revive_the_franco_german_brigades_decision_desc:0 "Nous et les Allemands avons eu notre part de problèmes, mais nous sommes néanmoins frères. Le lien profond entre nous a été créé par le sang et l'épreuve. Notre ennemi commun à l'Est menace la stabilité et l'existence de nos deux nations. Nous devons accroître progressivement la coopération entre nos deux pays, et réformer les petites mais très mobiles brigades franco-allemandes est la première étape de ce processus."
 FAF_silence_german_critics_decision:0 "Faire taire les critiques des alliés"
 FAF_silence_german_critics_decision_desc:0 "Ces imbéciles qui critiquent nos alliés européens n'entendent rien à la planification stratégique. Ils manquent de vision et de profondeur. Il est vraiment consternant de voir combien de gens ne saisissent toujours pas le principe « l'ennemi de mon ennemi est mon ami ». Leur menace à notre égard est insignifiante aujourd'hui comparée à la menace bolchevique à l'Est. Nous ne leur accorderons pas notre entière confiance, bien sûr, mais la praticité doit toujours passer avant l'idéologie."
 FAF_deliver_our_people_decision:0 "Soulager notre peuple"
 FAF_deliver_our_people_decision_desc:0 ""
