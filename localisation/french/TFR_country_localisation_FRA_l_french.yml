 FRA_armed_forces_dynamic:0 "Forces Armées Françaises"
 FRA_armed_forces_dynamic_desc:0 "Les Forces armées françaises ont été l'épée et le bouclier de la nation française, protégeant notre peuple de potentiels oppresseurs et agresseurs tout au long de notre histoire. Elles continueront de défendre notre nation contre les menaces de l'ère moderne, quelles qu'elles soient."
