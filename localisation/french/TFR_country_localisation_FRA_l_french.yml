 FAF_Put_Pressure_on_the_Dalmatians_decision:0 "Exiger la §psoumission croate [CRO.GetFlag]§!"
 FAF_Put_Pressure_on_the_Dalmatians_decision_desc:0 "Des colonnades de marbre du palais de Dioclétien aux inscriptions latines de Dubrovnik, les vents adriatiques chargés de sel n'ont jamais entièrement effacé l'empreinte de Rome sur cette terre. Tout comme l'Adriatique regarde à jamais vers l'ouest en direction de la Ville éternelle, la carte culturelle de la Croatie recèle encore des pages non écrites, dans l'attente du rallumage de la flamme latine. Lorsque les chevaliers cuirassés de la quatrième croisade élevèrent la croix latine au-dessus de Constantinople, l'histoire avait déjà tracé la route de ce joyau perdu de la civilisation latine — non pour s'incliner devant le croissant ottoman, ni pour se soumettre à l'aigle à double tête slave, mais pour suivre les routes dalmates jadis pavées par les légions romaines et revenir enfin sous le sceptre de l'ordre impérial latin."
 FAF_propaganda_campaign_in_Romania_decision:0 "Faire la propagande du §Ylatinisme roumain§! [ROM.GetFlag]"
 FAF_propaganda_campaign_in_Romania_decision_desc:0 "Les Roumains ne sont peut-être pas les premiers auxquels on pense lorsqu'on évoque l'héritage romain, mais la vérité est qu'ils sont tout aussi romains que nous, Français. La langue roumaine est issue du latin vulgaire, et leur peuple partage une orgueilleuse ascendance romaine. Cependant, en raison de leur situation géographique, il était inévitable qu'ils soient infectés par le virus slave, diluant ce qui faisait d'eux un peuple grand et puissant. Pourtant, le sang qui coule dans les veines des Roumains reste le même — il suffit de leur rappeler leurs racines."
 ROM_Identitarian_Influence:0 "Influence identitaire croissante"
 ROM_IDE_inf_tt:0 "§YNous répandrons l'influence identitaire dans toute la [ROM.GetFlag] Roumanie§!"
 FAF_fund_identitarian_terror_in_ROM_decision:0 "Financer la terreur en [ROM.GetFlag] §YRoumanie§!"
 FAF_fund_identitarian_terror_in_ROM_decision_desc:0 "Nos frères roumains sont de nouveau entre les mains de l'impérialisme russe. Les démons russes leur murmurent leurs chants à l'oreille, jouent avec leur esprit, créant dans leur psychisme cette fausse image d'un héritage slave ! Pourtant tout n'est pas perdu. Il reste en Roumanie des frères latins loyaux qui s'identifient à leur famille européenne, et non à la fausse famille slave. Nous devons les aider à diffuser leur message, afin qu'un jour ils reviennent dans nos bras."
