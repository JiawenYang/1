 FRA_Reforming_Civil_Services_idea:0 "Réforme de la fonction publique"
 FRA_Reforming_Civil_Services_idea_desc:0 "Avec la refonte complète de la fonction publique, nous récoltons déjà les fruits des réformes adoptées par notre gouvernance. En cherchant à améliorer l'efficacité, la responsabilité et la capacité d'adaptation, entre autres, il est évident que le résultat final de ces réformes aidera la France à atteindre ses objectifs actuels de modernisation des capacités administratives de la nation et apaisera l'organe gouvernemental qui les promeut."
 FRA_Reforming_Civil_Services_anti_corruption_idea:0 "Bastion contre la corruption"
 FRA_Reforming_Civil_Services_anti_corruption_idea_desc:0 "Avec la refonte complète de la fonction publique, nous récoltons déjà les fruits des réformes adoptées par notre gouvernance. En visant notamment une corruption moindre et une meilleure responsabilité, il est évident que le résultat final de ces réformes aidera la France à atteindre ses objectifs actuels de modernisation des capacités administratives de la nation et apaisera l'organe gouvernemental qui les promeut."
 FRA_ENA_idea:0 "École nationale d'administration"
 FRA_ENA_idea_desc:0 "Fondée par Charles de Gaulle en 1945, l'ENA visait à démocratiser l'accès à la haute fonction publique française, avec seulement 80 à 90 élèves diplômés chaque année. Institution prestigieuse, elle a constitué une voie essentielle vers les hautes fonctions des secteurs public et privé, avec quatre présidents français, dont Emmanuel Macron, parmi ses diplômés.\nCependant, les manifestations des gilets jaunes ont mis en évidence l'élitisme de l'ENA, critiquant ses diplômés pour avoir promu des politiques étroites et centristes et entretenu les divisions sociales. La plupart des diplômés de l'ENA venant de familles aisées, seuls 6 % sont issus de milieux populaires.\nLe 25 avril 2019, Macron a annoncé la fermeture de l'ENA, mais alors que la France affronte de futurs défis économiques, il reste incertain que cette décision soit maintenue."
 FRA_INSP_idea:0 "Institut national du service public"
 FRA_ENA_Suspended_idea:0 "ENA suspendue"
 FRA_ENA_Funds_idea:0 "Répartir les fonds"
 FRA_ENA_Funds_idea_desc:0 "Alors que la déconstruction générale de l'École nationale d'administration commence, les financements auparavant destinés à cette administration ont désormais la possibilité d'être réaffectés à de plus vastes réformes administratives, comme le système éducatif et d'autres institutions. Pendant que cette réaffectation s'opère, les ressources nouvellement libérées seront injectées dans l'économie pour contribuer davantage à la modernisation du pays."
 FRA_Sacking_ENA_Veterans_idea:0 "Dehors les anciens"
 FRA_Sacking_ENA_Veterans_idea_desc:0 "Comme le dit l'adage : « dehors les anciens, place aux nouveaux ». Nous entendons écarter les vétérans de l'École nationale d'administration, dont beaucoup sont responsables du déclin de l'administration. Ces postes libérés nous permettront de transférer facilement des individus qualifiés vers les nouvelles fonctions ouvertes, afin de poursuivre la réforme et la modernisation de l'institution administrative française."
 FRA_Sacking_ENA_Veterans_INSP_idea:0 "Dehors les anciens"
 FRA_Sacking_ENA_Veterans_INSP_idea_desc:0 "Comme le dit l'adage : « dehors les anciens, place aux nouveaux ». Nous entendons écarter les vétérans de l'École nationale d'administration, dont beaucoup sont responsables du déclin de l'administration. Ces postes libérés nous permettront de transférer facilement des individus qualifiés vers les nouvelles fonctions ouvertes, afin de poursuivre la réforme et la modernisation de l'institution administrative française."
 FRA_Sky_Supremacy:0 "Suprématie dans les airs"
 FRA_Sky_Supremacy_desc:0 ""
 FRA_Dirigisme_idea:0 "Économie dirigiste"
 FRA_Dirigisme_idea_desc:0 "L'idée de dirigisme a toujours joué un rôle dans les systèmes économiques de la France. Avec l'augmentation des obligations pour la prochaine décennie, nous veillerons à ce que la France prospère économiquement par tous les moyens nécessaires, tandis que l'instabilité ne cesse de croître dans le monde. Avec ce renouveau national du dirigisme, nous garantirons une France plus efficace et corrigerons les erreurs des systèmes économiques précédents qui ont entravé la nation française de multiples façons."
 FRA_Dirigisme_Tech_idea:0 "Économie dirigiste"
 FRA_Dirigisme_Tech_idea_desc:0 "L'idée de dirigisme a toujours joué un rôle dans les systèmes économiques de la France. Avec l'augmentation des obligations pour la prochaine décennie, nous veillerons à ce que la France prospère économiquement par tous les moyens nécessaires, tandis que l'instabilité ne cesse de croître dans le monde. Avec ce renouveau national du dirigisme, nous garantirons une France plus efficace et corrigerons les erreurs des systèmes économiques précédents qui ont entravé la nation française de multiples façons."
 FRA_Laissez_Faire_idea:0 "Économie de laissez-faire"
 FRA_Laissez_Faire_idea_desc:0 "Après des décennies de gestion de la lourdeur et de la corruption engendrées par le système du « dirigisme », nous avons enfin opéré un tournant pour laisser la main du marché libre guider notre pays. Outre les liquidités tirées de la vente de nos anciens « champions nationaux », les réductions d'impôts massives ont laissé à notre peuple bien assez d'argent pour stimuler le pouvoir d'achat de nos citoyens. Certains déplorent les risques d'une « thérapie de choc » économique sur l'ancien système public et la perte d'emplois dans le secteur public ; nous savons que le marché libre est bien plus capable de servir les besoins de la population dans la quête du profit !"
