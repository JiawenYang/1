 Brazil.1.a:0 "Au revoir, Frenchie !"
 Brazil.2.t:0 "Le Brésil s'empare de la Guyane"
 Brazil.2.d:0 "La morsure de la défaite est encore vive, et une nouvelle injustice nous est infligée. Le gouvernement brésilien, en sentant la faiblesse, s'est précipité sur l'occasion de s'emparer du département d'outre-mer de la Guyane française, l'un des derniers vestiges de notre passé impérial. Il n'y eut guère de résistance à l'invasion brésilienne. Une force squelettique était tout ce qui restait : la plupart de ses hommes et de son équipement limités avaient déjà été siphonnés vers le front de l'Est. Ce qui restait n'avait ni le temps, ni les mains, ni la volonté de résister. La seule consolation est que les stocks d'équipement avaient déjà été vidés et que cette saisie ne renforce pas l'armée brésilienne de manière sensible.\n\nMalgré les appels de certains membres bellicistes de l'état-major réclamant une contre-attaque immédiate, nous n'avons pas les moyens d'intervenir, même dans la guerre civile qui couve chez notre voisin du sud, et encore moins dans une région à l'autre bout du monde. L'une des conséquences à court terme les plus pressantes de la perte de cette région est la perte de sa production d'or, de pétrole et de bauxite, qui nous fera certainement défaut dans les temps difficiles à venir. Des plans seront tout de même élaborés et, peut-être, en des temps meilleurs, nous pourrons passer à l'action ; mais tant que la situation en Europe ne sera pas stabilisée et que les Russes n'auront pas été remis à leur place, tout cela restera un rêve pieux."
 Brazil.2.a:0 "Nous reviendrons."
