 FRA_Jupiter_Ascendent_Category:0 "Jupiter triomphant"
 FRA_Jupiter_Ascendent_Category_desc:0 "\n\n\n\n\n£GFX_FRA_jupiter_cat\n\n\n\n\n\n\n\nEmmanuel Macron conduit une fois encore la grande nation de France à travers son heure la plus sombre : assez de ces luttes bureaucratiques stériles et de ces élections chaotiques. Nous montrerons à l'Europe et au reste du monde notre supériorité et notre triomphe, face à ceux qui, de l'intérieur comme de l'extérieur, veulent détruire notre nation. Nous ferons de cette époque celle de notre excellence et restaurerons notre gloire passée, pour redevenir l'une des grandes nations non seulement d'Europe, mais du monde entier. \n\nLa poussière est retombée et l'atmosphère politique française a déjà commencé à changer : la coalition conservatrice se dissout et reste dans le passé, là où le peuple français l'a laissée. Des réformes étant adoptées pour le bien de notre nation, la France pousse un soupir de soulagement, sachant qu'elle est entre de bonnes mains. Notre grande armée reprend sa place tandis que nous nous préparons aux défis de demain. L'objectif de Macron est clair : notre nation s'efforce d'atteindre sa meilleure version possible, ainsi que la meilleure Europe possible. \n\nLa nation de France vogue vers son destin, Macron à sa barre."
