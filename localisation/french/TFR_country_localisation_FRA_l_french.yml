 FPR_sister_republics_tt:0 "Cela nous donnera la capacité d'exiger des alliés voisins qu'ils se soumettent à la gloire de notre idéologie et deviennent des §RRépubliques sœurs§!, comme au temps de la Première République."
 FPR_jacobin_category:0 "Les Lumières nouvelles"
 FPR_jacobin_category_desc:0 "\n\n\n\n\n£GFX_FPR_new_elightenment_cat\n\n\n\n\n\n\n\nLa nation française a depuis longtemps oublié les idéologies de la raison et de la liberté inventées lors de la Première Révolution, puis réinventées par Maupin. Nos « alliés » de gauche ont totalement abandonné le chemin de l'avenir par peur.\n\nLa peur est l'ennemie du progrès. La peur est l'ennemie de la rationalité et la barrière vers l'avenir. Il n'y a pas de révolution sans destruction de la subversion."
