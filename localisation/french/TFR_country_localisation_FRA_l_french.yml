 FRA_the_fifth_generation_fighter_category:0 "Le projet de cinquième génération"
 Fra_armed_forces_category_desc:0 "L'armée française est la meilleure et la plus importante de ce côté de l'Atlantique. Des conquêtes de Charlemagne et de Napoléon à la glorieuse libération de la France par de Gaulle et Leclerc, l'histoire de notre armée est à la fois glorieuse et ancienne. Nous avons récemment prouvé que notre armée peut tenir seule sans l'OTAN ; nous ne devrions toutefois pas être trop pressés d'abandonner nos alliés, car une guerre se profile sans aucun doute à l'horizon."
 FRA_west_africa_intervention_desc:0 "L'Afrique de l'Ouest fait depuis longtemps partie intégrante de la France et de notre politique étrangère.\nCependant, année après année, ces nations ont tenté de s'éloigner toujours davantage de leur ancien suzerain français, mais §Rils ne connaîtront jamais le goût de la liberté§!."
 FRA_yellow_vest_protests:0 "Manifestations des Gilets jaunes"
 FRA_yellow_vest_protests_desc:0 "Avec la radicalisation des Gilets jaunes – ainsi que les médias les surnomment –, il devient évident que sans solution immédiate accordant au moins quelques concessions aux émeutiers, la nation sombrera dans un chaos encore plus grand que celui provoqué par le COVID-19 seul. Tant que cette solution n'est pas négociée ou conclue d'une autre manière, la France risque sa stabilité interne et son intégrité politique."
