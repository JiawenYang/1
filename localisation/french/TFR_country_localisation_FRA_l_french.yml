 FRA_EU_Moratorium_of_Political_Debate:0 "Moratoire sur le débat politique"
 FRA_EU_The_Second_Star_in_the_Union_desc:0 "La France a toujours été un membre central de l'Union européenne. Depuis notre entrée en 1958, nous avons étendu notre rôle de membre à celui de leader. Guidant et menant l'expansion de l'UE jusqu'à ce qu'elle est aujourd'hui. Bien que nous ayons vacillé face à l'agression russe, nous ne devons pas abandonner le rêve d'une Europe unie. Les conservateurs et les socialistes peuvent crier et se débattre autant qu'ils veulent, nous n'écouterons pas leurs divagations incohérentes. Si le rêve européen doit survivre, ce n'est pas la nation française qui doit disparaître, mais la nation allemande qui doit se dissoudre dans une union dirigée depuis Paris."
 FREU_the_union_cat:0 "Notre Europe"
 FRA_EU_Repairing_the_National_Body_desc:0 "Notre victoire contre les militaristes et les socialistes n'est pas venue sans coût. Nous avons hérité d'une nation meurtrie et endommagée. De vastes étendues de campagne sont en ruine, tandis que les villes sont en ruine, avec des incendies qui font rage. Même notre sereine capitale n'a pas été épargnée par les horreurs de la guerre, la tour Eiffel elle-même étant endommagée. Alors que nous avançons avec le projet paneuropéen, nous commencerons l'ardent processus de guérison du corps français. Ce qui suivra sera un test non seulement de notre engagement envers l'unité européenne, mais aussi de la mesure à laquelle nous sommes prêts à aller pour revitaliser la nation française. Et nous le mènerons jusqu'au bout, quel qu'en soit le coût ou les actions que nous devons accomplir."
 FRA_EU_The_Cult_of_Reason_desc:0 "Fondé dans les premières années tumultueuses qui suivirent la Révolution française, le Culte de la Raison témoignait des valeurs républicaines et de la volonté d'un progrès véritable. Malgré cela, il fut usurpé par le traître Robespierre, qui le transforma d'un front du progrès en un simple instrument pour consolider son pouvoir. Malgré cela, les idéaux du Culte de la Raison demeurent pertinents, même aujourd'hui. Alors que nous reconstruisons la France jadis fière, ces idées deviendront les fondations de notre nouveau régime, guidant notre effort pour la raison, l'égalité et l'innovation."
 FRA_EU_The_Will_to_Grow:0 "La volonté de croître"
 FRA_EU_Diversify_the_French_Citizen_desc:0 "Que représente vraiment le citoyen français ? La droite dirait que le citoyen français est européen. Mais nous savons mieux. La France est un creuset divers de nationalités et de cultures. Et représenter tout notre peuple en une seule image serait un grand tort fait à ces cultures. Si nous cherchons véritablement à représenter notre peuple, nous devons élargir ce que signifie être français. Les jours de discrimination sont révolus. Les jours où une personne pouvait être considérée comme moins qu'un citoyen sont révolus. Si nous voulons vraiment nous éloigner des erreurs du passé, alors remodeler l'idée du citoyen français n'est qu'une étape parmi d'autres vers un avenir véritablement égal pour tous."
 FRA_EU_A_New_Technocratic_Superstructure_desc:0 "Beaucoup pensent que la technocratie est un concept jeune, mais l'histoire montre le contraire. Forgée pour la première fois par William Henry Smyth en 1919, elle fut développée par Howard Scott dans les années 1930. Bien que son parti technocratique ait échoué et fini par se dissoudre, les idées qu'il défendait perdurent. Les échecs de la Cinquième République dans la guerre européenne prouvent assez qu'un nouveau système de gouvernance est nécessaire. La France ne sera plus dirigée par des politiciens cupides et égoïstes. Désormais, de grandes équipes d'experts seront chargées des fonctions quotidiennes du gouvernement français. Sans être nommés par le peuple, ces individus s'efforceront d'apporter le plus de changement pour la France. Et sous notre direction, ils conduiront la France vers un nouvel âge d'or de coopération et d'unité."
 FRA_EU_European_Emergency_desc:0 "Tandis que les canons se taisent et que les incendies s'éteignent, nous sortons vainqueurs de nos ennemis. Guérillas nationalistes et communistes ont été renvoyées dans l'ombre, et la liberté a prévalu en notre heure de besoin. Cependant, nous ne pouvons nous reposer maintenant. Notre situation reste très anarchique, et les radicaux feront tout en leur pouvoir pour usurper notre contrôle. En ces temps désespérés, nous nous tournons vers l'extérieur pour de l'aide. Nous avons peut-être perdu la bataille, mais la guerre est loin d'être finie. Et nous reviendrons plus unis qu'avant, prêts à affronter nos ennemis de front comme un seul front uni."
 FRA_EU_Embolden_the_Euro:0 "Renforcer l'euro"
 FRA_EU_The_Will_to_Grow_desc:0 "Le progrès ne vient jamais naturellement. Il faut quelqu'un pour le pousser à l'action. Mais une fois cela fait, le progrès ne peut être arrêté. Malgré tous ses succès, la Cinquième République n'a pas su maintenir le progrès. Une volonté de croître fut remplacée par la paresse et l'apathie, les jeunes se contentant de ce qu'ils avaient. Et pendant que nous paressions, les Russes avançaient. Et notre échec à rattraper nos ennemis a finalement conduit à notre chute entre leurs mains. Pour prendre l'avantage sur nos ennemis, nous devons poursuivre le progrès et la croissance à tout prix. Unis à nos alliés européens, nous accélérerons la course à la croissance. Vers un avenir prospère et libre."
 FRA_EU_Total_war_the_End_War_desc:0 "Nous avons beau le nier, nous devons affronter la vérité. Le continent européen lui-même plonge tête baissée vers une autre guerre. Et cette fois, elle sera encore plus destructrice que la précédente. Le destin du continent est sur le fil du rasoir. Si nous ne nous en saisissons pas, nos ennemis le feront. Si nous voulons être au sommet, nous devons être prêts à tout pour gagner. Nos soldats ne seront plus liés par des restrictions ou des codes. Toute notre fureur sera déchaînée sur l'ennemi. Et ce n'est qu'une fois vainqueurs que nous déposerons enfin les armes. Pas temporairement, mais pour toujours."
 FRA_EU_Beyond_our_Singular_Existance_desc:0 "Qu'est-ce que la France, vraiment ? Un peuple ? Une idée ? Une nation ? Nous disons autre chose. Pourquoi la France ne pourrait-elle servir un but autre que sa propre existence continue ? Les conservateurs décrient l'UE comme un « outil des mondialistes ». Tandis que les socialistes la décrient pour « poursuivre l'oppression capitaliste ». Mais tous se trompent. De même que nous avons accepté que la nation française doive se transcender, les Allemands doivent maintenant accepter que le concept de nation allemande ait perdu son sens. L'avenir ne sera pas clément envers les nations qui refusent de changer. Et si nous refusons de suivre notre époque, nous tomberons comme toutes les autres nations qui l'ont fait."
 FRA_EU_United_Under_Humanity:0 "Unis sous l'humanité"
 FRA_EU_Economic_Enrichment_desc:0 "La France est une nation très singulière. Nous sommes bénis de nombreux gisements minéraux et d'un sol fertile. Si nous avons toujours historiquement exploité nos terres vierges, les gisements minéraux sont restés sous-utilisés. Si nous espérons briser notre dépendance à l'Afrique et à la Chine, nous devons relancer les mines et l'agriculture françaises. Des subventions à ces deux industries stimuleront la croissance économique et aideront à créer des emplois pour les citoyens et les immigrants. Cela nous permettant aussi de soutenir notre vaste système de services sociaux. De tels changements bénéficieront non seulement à nous, mais aussi à nos alliés, qui profiteront grandement de recevoir les minerais de nos mines et la nourriture de nos fermes."
 FRA_EU_Cyber_Warfare_Department:0 "Révolutionner le département de cyberguerre"
 FRA_EU_Paying_our_Tithe_desc:0 "À l'ère moderne, rien n'est gratuit. Biens, services, services publics, tout cela a un coût. Autant nos alliés ont aidé notre reconstruction, cela n'a pas été gratuit. De vastes étendues d'Allemagne et même du Benelux restent endommagées par le sabotage russe et les frappes de missiles. Bien qu'ils n'aient pas hésité à nous aider à reconstruire, ils attendront quelque chose en retour. Qu'il s'agisse de ressources, de travailleurs ou de fonds, on attendra de nous que nous contribuions à leur reconstruction. Comme ils nous ont aidés. Certains grogneront contre cet impôt perçu, mais il est en fin de compte de notre meilleur intérêt de payer. Montrant notre engagement indéfectible au projet paneuropéen."
 FRA_EU_Embolden_the_Euro_desc:0 "Créé pour la première fois en 1996, l'euro peut être considéré comme l'une des plus belles réalisations de l'Union européenne. Il ne sert pas seulement de monnaie, mais aussi de symbole d'unité. Son adoption par divers gouvernements, dont le nôtre, témoignait de l'engagement envers le projet paneuropéen. Beaucoup pensaient que la victoire russe à l'Est signifierait un désastre pour l'euro, mais l'inverse s'est produit. L'euro n'a fait que croître plus vite, et avec notre ascension dans l'Union européenne, il continuera de croître. Notre force est la force de l'euro. Et renforcer l'euro n'est qu'une étape du long voyage vers une Europe pleinement unie."
 FRA_EU_The_Cause_of_the_People_desc:0 "Depuis que le rêve d'une Europe unifiée a été conceptualisé, nous avons tout fait pour le rendre réalité. Pourtant, nous ne devons pas oublier le peuple que nous servons. Il existe encore un scepticisme vocal envers nos objectifs. Beaucoup les considèrent comme l'œuvre de quelques élites, tandis que d'autres décrient nos objectifs comme une continuation de l'oppression des entreprises. Pour gagner la confiance du peuple, nous devons apaiser leurs peurs. L'assurer que notre engagement est envers le peuple, non envers le PDG ou le mondialiste. Ce n'est qu'une fois la confiance du peuple gagnée que nous pourrons vraiment nous mettre au travail."
 FRA_EU_Never_Again_means_Now_desc:0 "Quand Moscou a proclamé la victoire, nous nous sommes fait une promesse. Que jamais plus nous ne serons vaincus. Jamais plus nos rêves d'une Europe libre et unie ne seront brisés par les opportunistes et les populistes. Jamais plus nous ne laisserons la liberté être brisée par ceux qui ne veulent prendre le pouvoir que pour eux-mêmes. Mais « jamais plus » ne signifie pas demain ou la semaine prochaine. Cela signifie maintenant ! Maintenant est le moment de marcher contre la menace à l'Est. Maintenant est le moment où nous réalisons enfin nos rêves d'une Europe unie. Et si nous ne saisissons pas les rênes maintenant, nous n'aurons jamais d'autre chance."
 FRA_EU_The_Public_Private_Enterprise:0 "Entreprise public-privé"
 FRA_EU_European_Cooperation_desc:0 "La coopération a historiquement été le fondement de tout gouvernement qui fonctionne bien. Et le nôtre ne fait pas exception. Le critère de notre régime sera notre volonté de coopérer ouvertement avec nos alliés. Des choses comme les accords commerciaux et les exercices militaires conjoints serviront à démontrer notre engagement indéfectible au projet européen. Nous convaincrons nos alliés à Berlin que non seulement nous sommes prêts à coopérer, mais que nous la recherchons activement. Permettant à notre alliance naissante d'éclore en quelque chose de plus grand. Non pas une simple alliance, mais une fraternité inébranlable."
 FRA_EU_The_Global_Project:0 "Le projet global"
 FRA_EU_Dissolve_Executive_Authority:0 "Dissoudre l'autorité exécutive"
 FRA_EU_Post_Ideological_Governance_desc:0 "À mesure que nous approchons de la réalisation du projet européen, il reste une chose à régler. Le concept d'idéologie doit être abandonné si nous espérons nous éloigner de la France du passé. En vérité, nous devons accepter que l'idée d'idéologie n'ait servi qu'à diviser les gens. Si nous souhaitons véritablement rassembler notre peuple, alors ces idées doivent être jetées. Il n'y aura plus de conservateurs, de libéraux ou de socialistes. Ces étiquettes ne serviront plus à diviser les gens ni à définir qui est quelqu'un en tant que personne. Désormais, nous sommes tous français, quoi qu'en disent ces étiquettes."
 FRA_EU_Iberian_Intervention:0 "Intervention ibérique"
 FRA_EU_the_Final_Goalpost_desc:0 "Depuis les premiers signes d'alerte, nous menons une guerre contre le changement climatique. De la signature de l'Accord de Paris sur le climat au financement des énergies renouvelables, de nombreux progrès ont été accomplis dans ce combat. Cependant, nous ne pouvons pas nous permettre de devenir apathiques. Si nous ne prenons pas l'initiative dans ce combat, nous aurons déjà échoué à sauver le monde. À l'image de la Cinquième République, nous renouvellerons notre engagement envers les énergies renouvelables et réduirons drastiquement nos émissions de carbone. Avec le soutien de Bruxelles et de Berlin, nous verrons la France transformée en un pays du futur, les renouvelables guidant le changement."
 FRA_EU_Popularizing_the_Pan_Euro_Ideal_desc:0 "Malgré les efforts de Volt et d'autres mouvements politiques, le paneuropéisme n'est pas aussi populaire qu'il le devrait. Les partis pro-UE ont traditionnellement pris un rôle de second plan au profit d'autres partis. Si notre objectif d'une Europe unie doit être véritablement atteint, alors nous devons faire tout le possible pour soutenir ces partis. Les financer, faire campagne pour eux. Tout pour accroître leur popularité. Avec du soutien, le sentiment pro-UE montera comme une grande vague à travers l'Europe. Et nous chevaucherons cette vague de soutien pour propulser l'idée d'une Europe unie du rêve à la réalité."
 FRA_EU_A_New_Technocratic_Superstructure:0 "La superstructure technocratique"
 FRA_EU_Blurring_the_Borders_desc:0 "Qu'est-ce que les frontières, vraiment ? Des lignes arbitraires tracées dans le sable ? Un outil pour diviser les gens avec des idées inutiles comme le nationalisme ? En vérité, toutes ces choses sont vraies. À mesure que nous approchons de la réalisation du rêve européen, nous devons abattre le concept de frontières. Une Europe unifiée est une Europe où les gens sont libres de circuler, et où les idées et les visions peuvent se répandre librement. Abattre les frontières, c'est nous libérer des fardeaux qu'elles engendrent. Les gens ne seront plus divisés par des lignes arbitraires. Nous ne nous appellerons plus Allemands ou Français. Nous sommes Européens, maintenant et pour toujours."
 FRA_EU_Economic_Enrichment:0 "Enrichissement économique"
 FREU_concede_to_the_greens:0 "Céder au §7Parti vert européen§!"
 FRA_EU_Uniting_our_Armies:0 "Unir les armées"
 FRA_EU_Democracy_Manifest_desc:0 "Malgré les changements drastiques que nous avons apportés à la nation française, une chose est restée constante : notre engagement envers la démocratie demeure inchangé. Au fond, nous restons une nation par le peuple et pour le peuple. La droite et la gauche tenteront de dire que nous sommes « la marionnette des mondialistes » ou « les pions des entreprises », mais la vérité parle d'elle-même. Notre devoir est envers la France et envers la démocratie. L'avenir non seulement de la France mais de l'Europe reste en jeu. Nous restons menacés par l'Est. Et si nous ne sauvons pas la démocratie aujourd'hui, l'ours pourrait nous submerger demain."
 FRA_EU_A_New_NATO:0 "La nouvelle OTAN"
 FRA_EU_Strangle_Populist_Rabble_Rousing:0 "Étrangler l'agitation populiste"
 FRA_EU_A_New_NATO_desc:0 "Depuis sa formation en 1949, l'Organisation du traité de l'Atlantique Nord, aussi appelée OTAN, a servi de front de l'Occident contre l'autoritarisme. Beaucoup affirmeraient que l'alliance est devenue obsolète avec l'effondrement de l'Union soviétique. Mais rien n'est plus faux. En fin de compte, l'échec de l'OTAN à défendre l'Europe de l'Est contre la horde russe prouve assez ses défaillances. Cependant, nous ne sommes pas si disposés à abandonner le concept d'OTAN. Par les épreuves et la réforme, nous reconstruirons l'organisation jusqu'à ce qu'elle signifie vraiment ce qu'elle devrait être pour nous. Non pas une simple alliance pour la démocratie, mais un véritable front pour l'Europe de l'Ouest. Un front capable de tenir tête à l'autoritarisme de la Russie de Medvedev."
 FRA_EU_European_Cooperation:0 "Coopération européenne"
 FRA_EU_Curing_Industrial_Ailments:0 "Soigner les maux industriels"
 FRA_EU_The_Technological_Spearhead:0 "Fer de lance technologique"
 FRA_EU_Removing_the_Red_Tape:0 "Supprimer la paperasse"
 FRA_EU_Iberian_Intervention_desc:0 "Malgré son relatif isolement de la guerre européenne, la péninsule Ibérique n'a pas été épargnée par ses conséquences. Après la victoire de Medvedev, la péninsule jadis paisible a été déchirée par la guerre civile. Radicaux et séparatistes se battent, espérant voir leur vision triompher. En même temps, les gouvernements de la péninsule tiennent désespérément Madrid et Lisbonne. Nous ne pouvons pas rester les bras croisés, sous peine de risquer qu'une faction pro-russe l'emporte et nous menace depuis le Sud. Ainsi, avec l'autorisation de Bruxelles, nous agirons promptement pour pacifier la péninsule. Écrasant les radicaux et rétablissant l'ordre dans ces terres jadis paisibles. Sous la bannière de l'unité européenne, nous sauverons l'Ibérie de l'effondrement."
 FRA_EU_Paying_our_Tithe:0 "Payer notre dîme"
 FRA_EU_Post_Ideological_Governance:0 "Gouvernance post-idéologique"
 FRA_EU_United_Under_Humanity_desc:0 "Enfin, le rêve est vraiment devenu réalité. Ce qui était jugé impossible s'est enfin révélé possible. Les idées jadis empoisonnées du nationalisme et de l'exceptionnalisme ont été remplacées par une ouverture à tous les peuples. Quelques vestiges conservateurs continuent de crier et de se débattre. Nous décriant pour notre prétendue soumission aux mondialistes et notre trahison du peuple français, nous connaissons la vérité. Jamais la France n'a été plus unie et plus libre. Nous sommes plus forts lorsque nous dépassons la nationalité pour nous concentrer sur ce qui est vraiment important. Le fait que, peu importe qui nous sommes, nous sommes tous humains."
 FRA_EU_Quell_Nationalism:0 "Réprimer le nationalisme"
 FRA_EU_Blurring_the_Borders:0 "Effacer les frontières"
 FRA_EU_The_Public_Private_Enterprise_desc:0 "Bien que nous ayons réussi à faire de la France une puissance technologique, nous pouvons encore faire plus. La France a toujours eu un large éventail d'entrepreneurs privés prêts à prêter main-forte au financement de projets gouvernementaux. Malgré cela, les dirigeants passés n'ont jamais pleinement exploité cette opportunité. S'appuyant presque uniquement sur l'entreprise publique, stagnant le progrès et l'innovation. Cependant, nous ne répéterons pas les erreurs du passé. L'avenir n'attend personne. Et si nous ne sommes pas prêts à travailler avec les entrepreneurs et innovateurs privés, alors nous ne pourrons jamais le saisir. "
 FRA_EU_Utilize_True_European_Allies_desc:0 "Nos échecs dans la guerre européenne nous ont montré que nous ne devons pas faire confiance à ceux qui prétendent être nos alliés. Quand Kiev fut submergée, de nombreux officiers ukrainiens n'hésitèrent pas à passer du côté russe. Quand la Pologne fut sur le point de tomber, les séparatistes silésiens furent les premiers à faire sécession. Traîtres dans le dos, félons, opportunistes : ces mots ne commencent pas à décrire ce que ces gens sont vraiment. Dans la quête de reconquérir notre héritage, nous ne devons placer notre foi que dans les vrais patriotes européens. Ceux prêts à risquer leur vie pour leurs idées. Ceux qui resteront loyaux à leur pays même si cela signifie la mort. Ces vrais patriotes mèneront la charge quand nous irons reconquérir l'Est. Et nous assisteront pour tirer vengeance des collaborateurs."
 FRA_EU_Curing_Industrial_Ailments_desc:0 "Pendant la majeure partie de son histoire, la France a été à l'avant-garde des avancées industrielles. De la première révolution industrielle à aujourd'hui, l'industrie française est mondialement reconnue pour son innovation. Cependant, cette industrialisation rapide de la France a eu un coût. Dans la quête de faire de la France une puissance industrielle, nous avons contribué au réchauffement climatique. Et alors que nous avançons avec la reconstruction, nous devons réévaluer notre position sur l'industrialisation. Bien que l'industrie soit nécessaire au fonctionnement de toute nation, nous devons reconnaître qu'elle ne vient pas sans coût."
 FRA_EU_Advanced_Digital_Warfare_desc:0 "La guerre est un jeu de changement constant. Rien ne reste identique à la guerre. Tout change avec le temps. Du char à l'avion à la technologie des drones. Le champ de bataille n'a jamais été aussi chaotique. En cette ère de guerre avancée, si vous ne suivez pas votre époque, vous serez détruit. Comme les Chinois, nous commencerons à développer notre propre division de cyberguerre. Intégrer la cyberguerre à notre armée nous donnera sûrement un avantage sur nos ennemis. Nous permettant de saboter les infrastructures critiques et de couper les communications ennemies. "
 FRA_EU_An_Invisible_Footprint_desc:0 "Depuis que notre combat contre le changement climatique a commencé, l'idée d'empreinte carbone a émergé. Représentant combien une personne, une entreprise ou un pays contribue à la dégradation environnementale, les régimes passés ont fait des investissements considérables pour réduire notre empreinte carbone. Mais malheureusement, ces efforts n'ont pas suffi, et notre empreinte carbone reste massive aujourd'hui. Le moment d'agir est maintenant, pas demain, pas la semaine prochaine. Si nous n'agissons pas promptement pour faire disparaître notre empreinte carbone, nos efforts ne serviront à rien. Et si nous échouons aujourd'hui, nous ne pourrons peut-être jamais assurer un avenir sûr à nos enfants."
 FRA_EU_If_only:0 "Si seulement..."
 FRA_EU_Invite_American_Innovationists:0 "Inviter les innovateurs américains"
 FREU_concede_to_the_militarists:0 "Céder au §gMilitaires européens§!"
 FRA_EU_Expand_Immigration:0 "Étendre l'immigration"
 FRA_EU_The_Gears_Turn_Again_desc:0 "L'économie de la France est comme une machine très avancée. Quand tous les rouages fonctionnent ensemble, de grandes choses peuvent être accomplies, et des innovations réalisées en un temps record. Mais si quelque chose est mal aligné, tout le système se dérègle, et la machine jadis fonctionnelle cesse de fonctionner. Quand la Cinquième République tomba, la machine de l'économie française retomba dans le délabrement et la décadence. Pourtant, après bien des épreuves et tribulations, les rouages jadis stagnants tournent de nouveau. Le cœur bat de nouveau, et comme un phénix, nous nous élevons des cendres de la pourriture et de la décadence. Désormais, nous regardons hardiment vers l'avenir, prêts à affronter tout défi qui se présente."
 FRA_EU_Cyber_Warfare_Department_desc:0 "Le domaine de l'électronique a connu des avancées rapides depuis la construction du premier ordinateur. Du smartphone à la technologie des drones. Des avancées révolutionnaires ont donné aux pays un avantage en temps de guerre. Mais si nous voulons réussir contre l'ours, nous devons être prêts à aller plus loin. Les drones et la guerre de l'information sont peut-être bons, mais cela ne suffit pas. Nous devons aller au-delà de ce qui était auparavant jugé possible. IEM, implants cybernétiques, soldats robotiques, tous ces concepts seront portés à l'avant-garde. Certains discuteront de l'éthique de ces innovations, mais cela ne nous concerne pas. Assurer notre victoire signifie que nous devons être prêts à adopter des technologies plus douteuses sur le plan éthique. "
 FRA_EU_The_Best_and_Brightest_desc:0 "La France, telle qu'elle est aujourd'hui, est aussi fragile qu'un verre fêlé. Un faux pas enverra le système déjà fracturé plonger dans l'anarchie complète. Le processus de reconstruction d'une nation déchirée par la guerre est long et ardu. Et il ne peut pas simplement être confié à un travailleur ordinaire. Ainsi, il est nécessaire de rassembler des équipes d'experts pour aider au processus de reconstruction. Bien que ces experts reçoivent des privilèges spéciaux pour élaborer des plans, ils auront toujours besoin de notre approbation finale. Avec leurs conseils, nous transformerons la France en un pays du futur. Un pays qui reflétera véritablement le but final du projet paneuropéen."
 FRA_EU_The_Best_and_Brightest:0 "Les meilleurs et les plus brillants"
 FRA_EU_The_Second_Star_in_the_Union:0 "L'étoile directrice de l'Union"
 FRA_EU_Embrace_AI_desc:0 "Depuis le début du XXIe siècle, la quête de l'IA a ouvert de nouvelles voies. À commencer par la création de Siri, le développement de l'IA n'a fait que progresser. Dans le monde d'aujourd'hui, l'IA est vue avec scepticisme au mieux, ou franchement détestée au pire. Alors que beaucoup ont regardé l'IA sous l'angle génératif, nous sommes plus fascinés par ses capacités militaires. Dans le cadre de notre quête de mise à jour de notre armée, un investissement considérable sera placé dans l'intégration de l'IA. Cela modernisera non seulement notre armée, mais aidera aussi à réduire les pertes humaines sur la ligne de front."
 FRA_EU_Walking_a_Green_Path:0 "Suivre la voie verte"
 FRA_EU_The_Cult_of_Reason:0 "Le Culte de la Raison"
 FREU_concede_to_the_socialists:0 "Céder au §pParti des socialistes européens§!"
 FRA_EU_Total_war_the_End_War:0 "Guerre totale pour en finir avec la guerre"
 FRA_EU_Utilize_True_European_Allies:0 "Employer de vrais Européens"
 FRA_EU_The_Cause_of_the_People:0 "La cause du peuple"
 FRA_EU_Never_Again_means_Now:0 "Jamais plus signifie maintenant !"
 FRA_EU_Expand_Immigration_desc:0 "Jamais sujet n'a été plus controversé dans la politique française que le débat entourant l'immigration. Il est apparu après les vagues massives de migrants arabes venus dans notre pays, fuyant la violence du Printemps arabe et de la guerre civile syrienne. La question a rapidement galvanisé le gouvernement français. Beaucoup appelaient au resserrement du contrôle de l'immigration. Cependant, sous notre règle, l'immigration ne sera pas arrêtée. En fait, elle sera étendue. Un soutien et des subventions seront fournis aux immigrants, à condition qu'ils contribuent à notre reconstruction de la France. Les conservateurs peuvent crier et se débattre autant qu'ils veulent, nous n'écouterons pas leurs plaintes. Après tout, nous avons le pouvoir, donc nous avons raison."
 FRA_EU_Mankind_Redefined_desc:0 "L'histoire n'a pas été clémente envers ceux qui souhaitent redéfinir le concept d'humanité. Le plus souvent, le terme a été utilisé par les dictatures pour justifier la persécution de groupes minoritaires. Cependant, pour nous, rien n'est plus faux. Nous ne cherchons pas à abaisser les gens. Nous cherchons à les élever. Pour assurer la prospérité de tous, nous devons traiter chacun également. Les choses mesquines comme la race, l'ethnie ou l'origine nationale ne seront plus des obstacles. Nous devons être prêts à rejeter ces idées ridicules et à embrasser l'humanité pour ce qu'elle est vraiment. Un concept pour unir, non pour diviser."
 FRA_EU_Quell_Nationalism_desc:0 "Malgré notre victoire sur les militaristes, certains continuent de scander leur rhétorique. Ils manifestent jour et nuit, décriant notre régime pour « s'être vendu à l'élite mondialiste » et « avoir trahi le peuple français ». Alors que le régime précédent se contentait de détourner le regard, nous ne suivrons pas cette approche. Si le rêve paneuropéen doit être pleinement réalisé, alors le nationalisme de toute sorte doit être écrasé. Nous traînerons les nationalistes dehors, écraserons leurs rassemblements et interdirons leurs partis. Certains dénonceront cela comme un autoritarisme flagrant, mais c'est un mal nécessaire. L'Europe ne sera pas unie si nous laissons ces mouvements persister."
 FRA_EU_Nation_of_Equality_and_Science_desc:0 "Malgré les échecs du leadership de Macron, nous ne pouvons nier les progrès accomplis sous la Cinquième République. La stagnation et le recul conservateurs furent remplacés par le progrès et l'innovation. Des investissements massifs furent faits dans les services sociaux, et des fonds furent fournis pour les innovations technologiques. Alors que nous regardons vers l'avenir, il est naturel que nous continuions à financer ces programmes. Sous notre direction, la France deviendra une nation de progrès et d'innovation. La stagnation sera remplacée par l'innovation, la régression par la progression. Avec l'aide de nos alliés, nous embrasserons l'avenir à bras ouverts. Prêts à tout défi qui se présentera."
 FREU_the_union_cat_desc:0 ""
 FREU_freedom_from_extremism:0 "Libérés du choix"
 FRA_EU_European_Emergency:0 "L'urgence européenne"
 FRA_EU_The_Gears_Turn_Again:0 "Les rouages tournent"
 FRA_EU_If_only_desc:0 "Nous pensions que cela n'arriverait jamais, mais en fin de compte, c'est arrivé. Et où en sommes-nous maintenant ? Malgré nos récents succès, l'Europe reste divisée en deux. Nous avons beau tenter de le détourner, nous devons accepter que quelqu'un doive porter le blâme. Si seulement ces agitateurs populistes nous avaient écoutés. Si seulement les eurosceptiques avaient été plus ouverts à nos idées d'unité européenne. Mais au contraire, ils ne l'ont pas fait. Et voyez où nous en sommes. Nos alliés ont été détruits ou transformés en marionnettes par Moscou, et le continent européen est désormais coupé en deux. Si seulement ils avaient écouté. Si seulement ils avaient été prêts à écouter."
 FRA_EU_Eliminate_Human_Casualties_desc:0 "Aucune nation n'entre en guerre en espérant ne pas subir de lourdes pertes. Mais pourquoi doit-il en être ainsi ? La guerre est à l'horizon, et si nous voulons être ceux qui en sortent victorieux, nous devons tout faire pour éviter les morts inutiles. Que ce soit par des investissements dans les avancées médicales ou la technologie des drones. Ou sinon, nous pourrions poursuivre les avancées en cybernétique. Nous permettant d'étendre les capacités de combat de nos soldats et d'améliorer leurs performances sur le champ de bataille. Nous ne pourrons peut-être pas empêcher la perte de vies, mais ces avancées nous permettront au moins de la minimiser. "
 FRA_EU_Crack_Down_on_Extremism:0 "Réprimer l'extrémisme"
 FRA_EU_Seeking_Discourse_desc:0 "La force de la France réside dans sa démocratie multipartite. Malgré l'échec de la Cinquième République, nous ne devons pas abandonner nos racines démocratiques. Alors que nous continuons à ramasser les morceaux de la guerre civile, nous nous trouvons devant une occasion unique. Tandis que l'extrême droite et l'extrême gauche ont refusé de travailler avec notre gouvernement, il reste encore beaucoup de modérés qui peuvent être convaincus. Par des concessions et des faveurs, nous pouvons convaincre ces partis neutres de travailler plus ouvertement avec notre gouvernement. Nous permettant de faire passer nos lois avec facilité. Accélérant grandement le processus de reconstruction."
 FRA_EU_Eliminate_Human_Casualties:0 "Éliminer les pertes humaines"
 FRA_EU_Uniting_our_Armies_desc:0 "La France a toujours tiré grande fierté de la puissance de son armée. Des jours de gloire de Napoléon à aujourd'hui, dire que la France a une riche histoire militaire serait un euphémisme. À mesure que nous approchons de la réalisation du rêve paneuropéen, nous devons accepter la vérité. Pour véritablement avancer dans nos objectifs, nous devons commencer à unifier les diverses armées d'Europe de l'Ouest sous un commandement unique. L'armée allemande s'intégrera volontairement au commandement élargi de l'UE, avec Paris à sa tête. Cela témoignera de l'engagement de Berlin envers l'unification européenne. Et bien que certains généraux allemands puissent ergoter, notre décision est finale. Et elle est en fin de compte pour le grand bien de toute l'Europe."
 FRA_EU_Beyond_our_Singular_Existance:0 "Au-delà de notre existence singulière"
 FRA_EU_United_By_Science_and_Reason:0 "Unis par la science et la raison"
 FRA_EU_The_European_Dream_Marches_on:0 "Le rêve européen va de l'avant"
 FRA_EU_Sister_Republic_desc:0 "La France a toujours eu une relation unique avec l'UE. Bien que nous fûmes l'un de ses membres fondateurs, de récentes vagues d'euroscepticisme ont mis un frein au rêve paneuropéen. Des politiciens comme Zemmour et Le Pen restent fermement opposés à toute intégration dans l'union, tout en soutenant que la France doit se libérer de son influence. En compromis avec ces groupes, nous abandonnerons notre objectif d'unification totale en faveur d'une coopération étroite avec nos alliés. Volt et d'autres groupes pourront en être mécontents, mais c'est un sacrifice nécessaire pour le bien de notre alliance."
 FRA_EU_Our_Offer_to_Brussels_desc:0 "Malgré tout ce que nous avons fait, nos alliés à Bruxelles restent surchargés. Engagée à gérer à la fois l'Ouest et l'Est, l'administration de Bruxelles a dû travailler en heures supplémentaires pour bien gérer les deux régions. Nous ne pouvons rester les bras croisés et regarder notre allié devenir accablé par les devoirs de l'État. Nous tendrons la main à Bruxelles avec une offre. Nous prendrons en charge les fonctions administratives de l'Europe de l'Ouest. Et en échange, ils recevront une part de sa production économique. Non seulement cela empêchera notre allié d'être surchargé, mais cela démontrera aussi notre engagement au projet européen. Nous permettant de leur demander des faveurs à l'avenir."
 FRA_EU_An_International_Reconstruction_Effort:0 "Un effort de reconstruction international"
 FRA_EU_Nation_of_Equality_and_Science:0 "Nation d'équité et de science"
 FRA_EU_Europeanize_Paris:0 "Européaniser Paris"
 FRA_EU_Invite_American_Innovationists_desc:0 "Alors que certains plaident pour donner du pouvoir aux seuls experts français, il serait erroné de ne pas inviter d'experts étrangers. Les États-Unis étaient jadis un phare de l'innovation industrielle. Des industriels comme Bessemer et Henry Ford ont apporté des innovations telles que la chaîne de montage. Bien que la nation jadis prospère reste déchirée par la guerre civile, des industriels comme Bloomberg ont pu conserver leurs avoirs. Tendre la main sera risqué, mais la récompense potentielle l'emporte sur le risque. Les conseils de ces individus seront cruciaux pour accélérer le processus de reconstruction."
 FRA_EU_Strangle_Populist_Rabble_Rousing_desc:0 "L'un des nombreux échecs de la Cinquième République se voit encore clairement aujourd'hui. Malgré la consolidation de notre règle, les partis populistes continuent de résister. Ils débitent continuellement une rhétorique anti-UE et organisent des manifestations massives contre notre régime. Contrairement à Macron, nous ne serons pas tendres avec ces agitateurs. S'ils ne travaillent pas avec nous, ils sont contre nous, et leur dissidence ne sera pas tolérée. Nous abattrons le marteau sur ces groupes, censurant leurs dirigeants et restreignant leurs déplacements. Ils peuvent crier et se débattre autant qu'ils veulent, mais personne ne sera là pour écouter."
 FRA_EU_The_Technological_Spearhead_desc:0 "L'aube du XXIe siècle a marqué une période d'avancée technologique rapide. Comme la course aux armements de la Guerre froide, les entreprises se sont précipitées pour voir qui serait à l'avant-garde de l'innovation. Jamais la technologie n'a été plus cruciale pour la survie d'une nation. Les innovations en drones et en cyberguerre ont permis aux nations de frapper des infrastructures vulnérables tout en gardant leurs soldats en sécurité. Si nous voulons avoir une chance contre l'ours russe, nous devons accélérer notre poussée technologique. Car si nous ne prenons pas de l'avance, nous resterons derrière et serons détruits par nos ennemis."
 FRA_EU_Popularizing_the_Pan_Euro_Ideal:0 "Populariser le paneuropéisme"
 FRA_EU_Crack_Down_on_Extremism_desc:0 "Malgré notre victoire sur les militaristes et les communistes, le radicalisme continue de gangrener les ombres. Si nous n'écrasons pas rapidement ces fanatiques, ils deviendront une écharde dans notre flanc, sabotant notre effort de reconstruction. Une autorisation sera donnée pour éradiquer les groupes radicaux restants encore actifs. Certains décrieront cela comme une érosion de la liberté, mais c'est en fin de compte un mal nécessaire. Car s'ils ne sont pas avec nous, ils sont contre nous. Et toute opposition à notre règle ne fait que retarder l'inévitable."
 FRA_EU_Removing_the_Red_Tape_desc:0 "Tout au long de l'histoire, le progrès a toujours été retardé par des bureaucraties inefficaces. Réglementations de sécurité, négociations avec les syndicats et contraintes budgétaires. Tout ne sert qu'à ralentir l'avancement de la société. Nous ne pouvons nous permettre de nous frayer un chemin dans des toiles bureaucratiques pour voir nos plans rejetés. En réduisant ces systèmes, nous économisons temps et argent. Et permettons à de nouveaux projets révolutionnaires d'être approuvés plus vite, leur permettant de démarrer en un temps record. Certains soulèveront des inquiétudes sur les réglementations de sécurité, mais ces coupes sont en fin de compte un mal nécessaire. Si nous voulons amener la France vers l'avenir, nous devrons couper les coins."
 FRA_EU_the_Final_Goalpost:0 "Le dernier poteau de but"
 FRA_EU_Addressing_Our_Failures:0 "Affronter nos échecs"
 FRA_EU_Picking_ourselves_up:0 "Nous relever"
 FRA_EU_Europeanize_Paris_desc:0 "Paris, souvent considéré comme l'une des villes les plus populaires de France et même d'Europe, a résisté à l'épreuve du temps. Des ruelles aux catacombes, les briques elles-mêmes irradient la riche histoire de la ville. Elle se dresse comme l'un des grands creusets. Où les cultures se mêlent. Et les idées fleurissent. Malheureusement, la ville a connu des jours meilleurs, et l'abandon massif de la Cinquième République a conduit certaines parties à se délabrer. Dans le cadre de notre coopération avec l'UE, nous lancerons une grande campagne pour revitaliser Paris. Le moderniser et le mettre aux normes d'autres capitales européennes comme Berlin et Londres."
 FRA_EU_The_European_Dream_Marches_on_desc:0 "Depuis sa formation en 1993, l'UE est passée d'une petite coalition à une alliance multipays. Depuis lors, quelques individus partageant les mêmes idées ont œuvré à faire du rêve paneuropéen une réalité. Beaucoup pensaient que l'idée d'une Europe unie s'effondrerait avec la victoire de la Russie en Europe de l'Est, mais elle ne nous a qu'enhardis. Elle a montré que si nous ne nous unissons pas aujourd'hui, nous périrons demain, sans avoir jamais réalisé le rêve d'unification. L'aube marquera un tournant significatif dans l'histoire non seulement de la France, mais de l'Europe tout entière. Comme un phénix, nous nous relèverons des cendres plus forts qu'avant. Et quand les ennemis de l'Europe viendront, nous les affronterons de front. Car l'unité est notre force, et rien ne pourra la briser."
 FRA_EU_Addressing_Our_Failures_desc:0 "Regardez autour de vous. Nos villes sont détruites, notre peuple a faim, notre armée est brisée. Nous avons beau tenter de le nier, nous avons échoué. Nous avons échoué à défendre nos alliés de l'Est contre la horde russe, et maintenant nous en subissons les conséquences. Mais nous ne pouvons pas bouder notre défaite pour toujours. Nous devons nous remettre sur pied, apprendre de nos erreurs et revenir plus forts. Beaucoup peut être appris de nos échecs dans la Première Guerre européenne. Et beaucoup doit être changé. Quel que soit notre approche, le changement est obligatoire. Si nous refusons de changer, alors nous répéterons les erreurs du passé."
 FREU_unity_in_decision:0 "Unité dans la décision"
 FRA_EU_Seeking_Discourse:0 "Rechercher le dialogue"
 FRA_EU_Mankind_Redefined:0 "L'humanité, affinée"
 FRA_EU_Sister_Republic:0 "La république sœur"
 FRA_EU_Moratorium_of_Political_Debate_desc:0 "Malgré tous nos efforts, de nombreux aspects de notre régime restent déplacés. Beaucoup parmi la gauche et la droite continuent de crier et de se débattre, refusant activement de travailler avec notre gouvernement et allant même jusqu'au sabotage pur et simple. Nous ne pouvons laisser ces radicaux entraver notre progrès, sinon nous ne ferons rien. Avec l'autorisation de Berlin, nous imposerons un moratoire temporaire sur toutes les formes de débat politique. Beaucoup verront cette mesure comme controversée. Ou même franchement autoritaire, mais elle n'est que temporaire. Une fois notre transition de république à commission finalisée, nous lèverons l'interdiction du débat politique. Mais pour l'instant, nous devons recourir à des mesures extraordinaires pour assurer notre règle."
 FRA_EU_Diversify_the_French_Citizen:0 "Diversifier le citoyen français"
 FRA_EU_Picking_ourselves_up_desc:0 "La poussière retombant et le chaos s'apaisant, notre règle se consolide lentement mais sûrement. Il reste beaucoup à faire. Les villes sont en ruine, et notre peuple attend dans les files du pain. Mais heureusement, nous ne sommes pas seuls. Partout en Europe, nos alliés souffrent comme nous, sinon plus. La Pologne est divisée, l'Espagne reste déchirée par la guerre civile, et l'euro jadis fier est désormais totalement inutile. Mais tout espoir n'est pas perdu. Beaucoup diraient que le rêve d'une Europe unie est mort. Mais nous savons mieux. En souffrant dans l'épreuve, nous émergerons plus forts qu'avant. Le rêve européen sera réalisé, même si du sang doit être versé pour le rendre réalité."
 FRA_EU_Walking_a_Green_Path_desc:0 "Durant la seconde moitié du XXIe siècle, la France a été en première ligne du combat contre le changement climatique. Depuis la signature de l'Accord de Paris sur le climat, nous avons fait tout notre possible pour réduire notre empreinte carbone. De l'investissement dans les énergies renouvelables au financement des entreprises françaises de véhicules électriques. Pourtant, la Cinquième République est toujours restée apathique face à la destruction accrue causée par les compagnies pétrolières. Si nous souhaitons forger notre propre héritage, nous devons redoubler d'efforts sur l'initiative verte. Avec l'aide de Bruxelles et de Berlin, nous œuvrerons à une transition complète de la France vers les énergies renouvelables, peu importe combien les compagnies pétrolières se plaignent."
 FRA_EU_Dissolve_Executive_Authority_desc:0 "Bien que nous ayons réussi à nous intégrer dans l'UE, de nombreuses institutions doivent être progressivement supprimées. Bien que le système présidentiel ait été nécessaire pour la Cinquième République, son but n'a plus de sens pour nous. La France ne sera plus dirigée par un président ou un premier ministre. Désormais, une commission d'experts et de fonctionnaires de l'UE supervisera les fonctions quotidiennes du gouvernement français. Facilitant la transition de la France d'un système présidentiel à un système de commission. Certains protesteront contre cette décision, mais c'est en fin de compte la meilleure issue."
 FRA_EU_Creative_Revolution_desc:0 "La France a toujours été une nation de créativité. De l'architecture au cinéma en passant par l'art. La France a historiquement été un centre de diverses révolutions créatives. Bien que le chaos de la guerre européenne et de notre guerre civile ait mis une pause à ces efforts, nous pouvons désormais commencer à faire revivre ces mouvements. Dans le cadre de notre campagne de reconstruction, nous planterons les graines d'une nouvelle révolution créative. Restaurant les musées, faisant revivre les guildes d'artistes et publiant les innovations des jeunes artistes français. L'art n'est peut-être pas une colonne vertébrale majeure de l'économie française, mais il est plus souvent un signe de la prospérité d'une nation. Et si nous espérons prospérer, le soutien aux arts est crucial."
 FRA_EU_An_International_Reconstruction_Effort_desc:0 "Tout au long de l'histoire, un fait est resté vrai. Les plus grandes nations ne sont pas parvenues là où elles étaient sans une base industrielle étendue. De grandes nations comme la Chine et l'Amérique ne seraient pas là où elles sont si elles n'avaient pas investi dans l'industrie lourde. Si nous voulons voir la France revendiquer sa place parmi les puissances mondiales, nous devons relancer le cœur battant qu'est l'industrie. Les usines seront reconstruites, les aciéries remises en service, tout pour relancer notre industrie. Combiné à l'aide de nos alliés, la France redeviendra une puissance industrielle capable de rivaliser avec la Chine."
 FRA_EU_Creative_Revolution:0 "La révolution créative"
 FRA_EU_The_Global_Project_desc:0 "Qu'est-ce que la France, sinon une petite pièce dans le vaste puzzle qu'est la communauté mondiale ? Beaucoup tenteraient de le nier. Mais pour nous, il est clair que nous servons un but plus grand que la seule existence continue de notre nation. La communauté mondiale est comme une immense toile, un réseau complexe d'accords commerciaux et d'alliances. Si nous voulons favoriser un sentiment d'unité mondiale parmi notre peuple, nous devons nous connecter à cette toile. Non seulement cela aidera à favoriser un sentiment d'unité parmi notre peuple, mais cela aidera aussi à attirer main-d'œuvre et experts étrangers. Contribuant grandement au processus de reconstruction."
 FRA_EU_Democracy_Manifest:0 "Manifeste pour la démocratie"
 FRA_EU_An_Invisible_Footprint:0 "Une empreinte invisible"
 FRA_EU_United_By_Science_and_Reason_desc:0 "Les nations les plus grandes et les plus durables de l'histoire sont aussi celles qui investissent considérablement dans la science. Les innovations industrielles ont propulsé la Russie et l'Amérique sur la scène mondiale, et les innovations technologiques ont aidé à améliorer la qualité de vie dans le monde entier. Alors que nous remettons ensemble les pièces de notre nation brisée, nous regardons vers un avenir défini par la science et la raison. Un avenir où la superstition et la peur de l'inconnu ont été remplacées par l'espoir en l'avenir. Un avenir où l'Europe peut se tenir debout, unie et libre, à jamais."
 FRA_EU_Our_Offer_to_Brussels:0 "Notre offre à Bruxelles"
