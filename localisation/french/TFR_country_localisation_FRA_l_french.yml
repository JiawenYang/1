 FRA_leave_nato_desc:0 ""
 FRA_Appeal_to_Neutral_Parties:0 "Faire appel aux généraux modérés"
 FRA_Appeal_to_Neutral_Parties_desc:0 "Nous ne pouvons pas nous permettre la neutralité au sein de notre état-major ; des mesures doivent être prises pour garantir que notre état-major reste uni et soutienne notre administration."
 FRA_Work_with_Disatisfied_Generals:0 "Travailler avec les généraux mécontents"
 FRA_Work_with_Disatisfied_Generals_desc:0 "Bien qu'ils soient tombés en disgrâce auprès de notre administration, les relations ne sont pas complètement rompues et nous avons beaucoup de moyens de les ramener à de meilleurs sentiments, pour éviter un mécontentement franc envers notre gouvernement."
 FRA_Benefit_from_our_Supporters:0 "Profiter de leur soutien"
 FRA_Benefit_from_our_Supporters_desc:0 "Ce \"Grand Jeu\" nous est actuellement favorable et nous profiterons de notre popularité au sein de l'état-major."
 FRA_Bring_Back_Villiers:0 "Travailler avec Villiers"
 FRA_Bring_Back_Villiers_desc:0 "Le général d'armée Pierre de Villiers dispose d'une supériorité et d'un levier politique sur l'état-major des Forces armées françaises ; il est prêt à collaborer avec nous pour tenter d'apaiser leur rhétorique despotique."
