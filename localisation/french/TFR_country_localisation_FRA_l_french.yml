 FRA_The_Popular_Front:0 "Révolution contre l'autoritarisme européen"
 FRA_Interventionist_Fervor:0 "Faucons bellicistes enhardis"
 FRA_Interventionist_Fervor_desc:0 "L'Amérique du Nord a sombré dans le chaos et l'anarchie, un état de mort et de destruction sans précédent dans l'histoire moderne. Ce désastre a ébranlé notre establishment politique au point de faire s'évaporer des précédents vieux de plusieurs décennies. Presque du jour au lendemain, la position de l'État et son personnel ont changé, un bouleversement sans précédent en soi. Dans chaque cabinet gouvernemental, les colombes ont été réduites au silence et les faucons ont pris leur place. Tous voient le monde en feu qui nous entoure et exigent ce que chacun a déjà en tête. S'il nous faut agir pour préserver la paix et la sécurité en Europe et au-delà...\n\nAlors nous ferons ce qu'il faut."
