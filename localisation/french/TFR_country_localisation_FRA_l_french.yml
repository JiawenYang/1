 FRA_silence_the_radical_left:0 "Faire taire les éléments subversifs"
 FRA_silence_the_radical_left_desc:0 "Mélenchon et ses corrompus de complices ont été évincés, mais cela n'allait jamais marquer la fin de leur trahison insidieuse. Ceux qui partagent ses vues malignes n'allaient pas simplement se coucher et mourir, mais même les modérés ont exprimé des inquiétudes. Il n'y a pas de place pour de telles appréhensions, même si ces inquiétudes sont bien intentionnées. La République est en crise, et des sacrifices doivent être faits pour son salut, même s'il faut pour un temps la mettre en laisse."
 FRA_reverse_their_decisions:0 "Annuler les perturbations économiques"
 FRA_reverse_their_decisions_desc:0 "L'une des nombreuses répercussions du précédent gouvernement socialiste a été le dommage incommensurable causé à la capacité économique de la France à faire la guerre. Des tentatives malavisées d'« élever le travailleur » et la priorité donnée à l'État-providence ont laissé aux Forces armées peu de moyens malgré la tempête qui s'abat désormais sur nous. Des réformes inutiles du travail qui entravent la production seront annulées — toute résistance des syndicats sera accueillie par la force. L'État-providence obèse doit être démantelé, ses fonds réaffectés à des considérations de défense et à d'autres projets pour protéger la France."
 FRA_render_unto_caesar:0 "Rendre à Cincinnatus"
 FRA_render_unto_caesar_desc:0 "Depuis le moment où notre nouveau gouvernement a été proclamé, la même critique nous est jetée au visage. Qu'elle vienne de véritables renégats ou des braves gens de France simplement égarés, l'accusation se répète : nous cherchons à détruire la République, nous ne sommes rien de plus que des autocrates non élus qui recherchent le pouvoir et la richesse aux frais du peuple. Le césarisme n'est pas à l'ordre du jour, et il ne le sera jamais. Notre loyauté va à la République, à la France. Comme Cincinnatus avant nous, nous protégerons l'État et, une fois la paix obtenue, nous restaurerons la République — peu importe sur qui ou sur quoi nous devons marcher."
 FRA_democratic_supervision_committee:0 "Comité de supervision républicain"
 FRA_democratic_supervision_committee_desc:0 "La situation se stabilisant sur le front intérieur, nous pouvons avancer pour apaiser davantage les craintes du peuple. Le chemin à venir est long et ardu, mais nous ne devons pas nous reposer ni repousser l'avenir. Pour permettre une transition plus fluide de la junte à la République, nous établirons un comité chargé d'examiner les partis et les candidats, et de préparer des élections anticipées une fois les passions retombées. Le feu de la République sera maintenu allumé — faiblement — afin de garantir qu'il suffise d'ajouter du combustible pour qu'il brûle de nouveau vivement."
