 FRA_Military_Retirement_category:0 "Le Grand Jeu"
 FRA_Military_Retirement_category_desc:0 "\n\n\n\n\n£GFX_FRA_Military_Loyalty_category\n\n\n\n\n\n\n\nLes forces armées françaises ont été une organisation indisciplinée qui a tenté de s'immiscer dans nos affaires politiques pendant des décennies. Cela dit, elles sont les protectrices de notre nation et garantiront notre prospérité et notre puissance dans les années à venir. Tandis que nous traversons cette période d'incertitude politique pour assurer le succès de notre administration, nous devons périodiquement collaborer avec l'armée et céder à ses requêtes et à ses exigences. Sa loyauté est une nécessité, et nous devons travailler avec soin avec nos forces armées pour garantir la grandeur de la France. \n\nNous avons actuellement : \n§G[?happy_generals]§! général(s) §Gheureux§! du régime.\n§O[?neutral_generals]§! général(s) que le régime §Oindiffère§!. \n§R[?angered_generals]§! général(s) §Rmécontents§! du régime. \n§C[?retired_generals]§! général(s) actuellement en §Ccongé temporaire§!."
 FRA_Natural_Military_Leader_Opinion_Sway:0 "Évolution de l'opinion d'un chef militaire"
 FRA_Natural_Military_Leader_Opinion_Sway_desc:0 "\"Je ne peux pas empêcher les Français d'être français.\" - Charles de Gaulle"
