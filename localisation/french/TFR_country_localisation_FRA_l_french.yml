 FRA_foreign_legion_integration:0 "Légion étrangère"
 FRA_foreign_legion_integration_desc:0 "La Légion étrangère a longtemps été la lance de la puissance impériale de l'Empire français puis de la République française. Elle demeure aujourd'hui un exemple éclatant de la puissance militaire française, et cela apporte de nombreux avantages à l'institution. Chaque semaine nous parvient un flux de jeunes hommes robustes venus du monde entier, prêts à écrire une nouvelle page de leur vie au service de la Légion. \n\nLa Légion est actuellement employée à faire respecter le franc de la Communauté financière africaine dans les nations ouest-africaines situées dans les zones monétaires du franc, ainsi qu'à former des nations et des groupes pro-occidentaux en Afrique afin d'assurer une stabilité durable sur le continent. Il est également manifeste que l'extrémisme islamique est en hausse, et nous déploierons donc la Légion pour éradiquer ce fléau qui a coûté la vie à des citoyens français ces dernières années. \n\nHonneur et Fidélité."
 FRA_coronavirus_category:0 "L'œil du cyclone"
 FRA_coronavirus_category_desc:0 "Eh bien, la nouvelle décennie démarre déjà de la pire des manières... Avant de pouvoir accomplir quoi que ce soit de notable en cette décennie, nous devons régler les problèmes internes qui nous occupent. \n\n§GLE COVID-19 EST ACTUELLEMENT §![FRA_COVID_loc]\n\n§YLES MANIFESTATIONS DES GILETS JAUNES SONT ACTUELLEMENT §![FRA_YVP_loc] \n\n\"Au cœur d'un cyclone, il y a un instant de calme.\""
