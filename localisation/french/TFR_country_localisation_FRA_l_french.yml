 Euro_Collapse_idea:0 "Effondrement économique"
 Euro_Collapse_idea_desc:0 "Le déclin de l'économie française était inévitable. D'énormes réparations de guerre et une génération de citoyens perdue à la guerre ont coulé ce pays, et le redressement prendra sans nul doute beaucoup de temps. La situation de la France semble critique, mais ayez foi en notre peuple, qui saura surmonter cela comme il l'a fait tant de fois auparavant."
