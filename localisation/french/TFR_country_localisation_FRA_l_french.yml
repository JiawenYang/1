 FAF_Support_Benedetti:0 "Soutenir Benedetti"
 FAF_Support_Benedetti_desc:0 "Notre grand dirigeant Benedetti sera la force motrice du nouveau renouveau national. Il s'est élevé des cendres de la défaite pour devenir le grand sauveur de la France, et le parti doit donc être uni derrière lui ; ceux qui ne le sont pas devront rentrer dans le rang."
 FAF_Praise_the_Army:0 "Louer l'armée"
 FAF_Praise_the_Army_desc:0 "Nos soldats ont combattu vaillamment sur le front de l'Est, mais ils ont malheureusement été trahis par un commandement lâche. Notre nouvel État restaurera l'honneur de la grande armée française ; la courageuse armée française sera la colonne vertébrale du nouvel État français."
 FAF_Promote_Active_Clubs:0 "Promouvoir les clubs actifs"
 FAF_Promote_Active_Clubs_desc:0 "Les clubs actifs sont essentiels pour transformer de jeunes hommes sans direction en une jeunesse nationaliste française organisée. Dans toutes les révolutions de l'histoire, la ferveur de la jeunesse fut la force motrice du changement, et elle doit être mobilisée aujourd'hui pour créer une jeunesse affamée et énergique !"
 FAF_Honor_Vichy:0 "Honorer le régime de Vichy"
 FAF_Honor_Vichy_desc:0 "Le maréchal Pétain fut un héros qui guida le peuple français à travers notre époque la plus troublée ; pourtant, après des décennies de pouvoir imposé par des régimes néolibéraux, la gloire des héros de Vichy a été calomniée. Les sacrifices consentis par ces hommes courageux doivent être rappelés au peuple français."
 FAF_Cult_of_Benedetti:0 "Forger le culte de Benedetti"
 FAF_Cult_of_Benedetti_desc:0 "Benedetti ne sera pas seulement un dirigeant fort conduisant une nation brisée, mais aussi le symbole de la nouvelle ère française. Chaque Français, chaque Française et chaque enfant verra en Benedetti le symbole du phénix français renaissant des cendres de la dégénérescence néolibérale et de la défaite."
 FAF_Utilize_Lafayette:0 "Mobiliser Lafayette"
 FAF_Utilize_Lafayette_desc:0 "Lafayette fut l'une des forces dirigeantes du renversement de l'ancien régime et est devenu une sorte de Napoléon moderne. Il est désormais l'un des hommes les plus célèbres de France et son soutien public sera crucial pour consolider notre pouvoir."
 FAF_Create_Identity_Forums:0 "Créer des forums identitaires"
 FAF_Create_Identity_Forums_desc:0 "Les forums romains étaient un foyer où les intellectuels débattaient de science, de philosophie et d'autres sujets. La France a elle aussi été une nation d'intellectuels ; nous devons donc faire revivre notre culture intellectuelle et créer des forums pour la nouvelle pensée nationaliste."
 FAF_Look_to_the_Glory_of_Rome:0 "Se tourner vers la gloire du passé"
 FAF_Look_to_the_Glory_of_Rome_desc:0 "La France est une nation de poètes, de philosophes, d'artistes et de grands conquérants. Héritiers du grand Charlemagne, nous sommes devenus le centre de l'innovation et de la gloire européennes. Certes, la France a traversé des périodes difficiles, mais nous devons rappeler au peuple notre passé ; en dépit de toutes les épreuves, la France a vécu et a poursuivi sa marche."
 FAF_Harness_Federalist_Sympathizers:0 "Rallier les sympathisants fédéralistes"
 FAF_Harness_Federalist_Sympathizers_desc:0 "Beaucoup de responsables de l'ancien gouvernement fragile et faible auquel nous avons succédé sympathisaient avec notre mouvement ; maintenant que celui-ci est au pouvoir, ces anciens responsables peuvent racheter leur inaction et leurs disgrâces passées en nous aidant aujourd'hui."
 FAF_Glorify_the_Imperial_Era:0 "Glorifier l'ère impériale"
 FAF_Glorify_the_Imperial_Era_desc:0 "Il n'y a rien de meilleur qu'un grand empire s'étendant sur tout un continent, son peuple, sa culture, ses villes, tous unis sous un drapeau et une idéologie. Bien des fois nous en avons été proches, proches d'accomplir cette utopie, et pourtant on nous l'a refusée encore et encore. Ce sera notre tentative finale et la plus déterminée pour ce dont nous avons si longtemps rêvé, et nous savourerons la gloire une fois accomplie."
 FAF_Formulate_Latinism:0 "Formuler la nouvelle doctrine du latinisme"
 FAF_Formulate_Latinism_desc:0 "Le latinisme, en tant qu'idéologie, a toujours été une notion assez dispersée et incohérente. Nous devons en faire quelque chose d'entièrement uni et déterminé, à la manière d'un idéologème proche d'un esprit de ruche. Si nous ne le faisons pas, le rêve d'une nouvelle Rome pourrait être terni à jamais."
 FAF_Disrupt_Benedetti:0 "Contrer Benedetti"
 FAF_Disrupt_Benedetti_desc:0 "Benedetti, Benedetti. Ce n'est rien d'autre qu'un autre fasciste cherchant à se modeler sur des États défaillants depuis longtemps disparus. Sa pensée culturelle de \"France\", nation unique, État ethnique, est l'idiotie dans sa forme la plus pure. Tout ce qu'il a planifié — discours, propagande, tout et n'importe quoi — doit être dissimulé ou corrompu d'une autre manière, pour empêcher ses idéaux corrompus et putrides de se répandre dans notre nation multinationale."
 FAF_Identity_Forums_category:0 "Au-delà de notre dessein singulier"
 FAF_Identity_Forums_category_desc:0 "\n\n\n\n\n£GFX_FAF_identitarianism_cat\n\n\n\n\n\n\n\nLa beauté de ce continent est sans égale ; pendant très longtemps, le projet néolibéral a tenté de transformer l'Europe en une zone économique et en un parc d'attractions culturel où le reste du monde fait ce qui lui plaît.\n\nAvec la France sous notre direction, nous pouvons bâtir une véritable union des Européens, pour les Européens, par les Européens : unité, identité et dessein pour nos frères et nos sœurs."
 FAF_europa_united_against_communism_decision:0 "L'Europe unie contre le communisme"
 FAF_europa_united_against_communism_decision_desc:0 "Comparé à toute autre idéologie, le communisme est ce qui s'oppose le plus à l'identité de l'Europe telle que nous la connaissons. Attirant nos travailleurs par des mensonges de prospérité, ils ne cherchent que la destruction de l'identité européenne dans leur croisade sans fin d'une \"égalité\" homogène qui vise à détruire notre culture. Que les hordes de l'Est soient revenues au fléau du bolchevisme ou non, leurs anciens liens pourraient être rattachés à un sentiment anti-russe croissant en Europe. Quoi qu'il en soit, nous pouvons aussi bien faire d'une pierre deux coups en veillant à ce que les radicaux d'extrême gauche soient purgés de notre société."
 FAF_europe_for_europeans_decision:0 "L'Europe aux Européens"
 FAF_europe_for_europeans_decision_desc:0 "Depuis le début de notre mouvement, nous avons toujours défendu l'idée que l'Europe ne devrait être que pour les Européens. Notre pouvoir étant désormais assuré, nous pouvons enfin transformer cet ancien cri de ralliement en une politique concrète qui consolidera notre domination. Maintenant que les radicaux de gauche, qu'ils soient marxistes ou libéraux, ne peuvent plus crier à l'\"appel à la haine\" et au manque d'\"empathie\" envers ces agents étrangers… Il est temps de tenir nos promesses !"
 FAF_european_beauty_dynamic:0 "Terres vierges d'Europa"
 FAF_european_beauty_dynamic_desc:0 "Les terres qui constituent l'Europe doivent voir leur beauté naturelle et leur grandeur préservées avant toute autre considération. Détruire ce qui fait l'Europe revient à détruire une partie de notre propre héritage et de notre âme, pour la seule raison de l'industrie : c'est un péché grave que nous devons réparer, à moins de vouloir effacer ce qui fait de l'Europe une terre pure et impeccable."
 FAF_european_beauty_state_dynamic:0 "Terres vierges d'Europa"
 FAF_european_beauty_state_dynamic_desc:0 " Vue d'en haut, l'Europe n'est qu'un continent parmi d'autres, mais en vérité elle est un berceau auquel toute l'humanité doit sa gratitude. C'est une œuvre magnifique de géographie, de culture et d'histoire, et nous ne lui nuirons pas sans nécessité. Si des conquérants ou des ennemis s'abattaient sur ces terres et les souillaient comme des barbares, ils ne trouveraient que le destin sous sa forme la plus vraie. La mort."
 FAF_european_nation_dynamic:0 "L'hégémonie européenne"
 FAF_european_nation_dynamic_desc:0 "En tant qu'identitaires, notre mouvement diffère du continuum habituel de l'extrême droite européenne en ce qu'il prône l'unification continentale plutôt que les simples nations qui la composent. Voyant l'Union européenne s'effondrer sous les coups des hordes de l'Est, une occasion de combler le vide de pouvoir et de nous imposer comme hégémon de l'Europe s'est présentée. Maintenir notre influence pourrait nous coûter politiquement, mais être le nouveau centre du continent est essentiel pour garantir notre triomphe sur le multiculturalisme, le libéralisme et les forces qui cherchent à détruire notre bien-aimée Europe !"
 FAF_clarity_in_liberty_decision:0 "La clarté dans la liberté"
 FAF_clarity_in_liberty_decision_desc:0 "Certains affirment que notre mouvement étant à droite, nous ne voulons qu'une dictature totalitaire source de souffrances. Si certains dans nos rangs pensent qu'un tel système serait le plus optimal, la vérité est que l'idée de \"liberté\" est une notion que nous pouvons récupérer et utiliser pour attirer ceux qui regrettent les démocraties libérales d'antan. Cette liberté, toutefois, n'est pas liée aux sottises progressistes ni au culte des minorités que l'on a vus avant la chute de l'ordre néolibéral mondial. Certes, ceux qui bénéficiaient de ces libertés ne manqueront pas de se plaindre, mais le but était de débarrasser le continent d'eux, non ?"
 FAF_new_classicalism_decision:0 "Néoclassicisme"
 FAF_new_classicalism_decision_desc:0 "Nos rêves d'une Europe unie découlent des gloires de l'Empire romain et de la culture qu'il a portée. Si les choses ont beaucoup changé depuis, les idées du classicisme dans notre art et notre architecture sont quelque chose que nous devons nous efforcer de poursuivre. En redonnant vie aux écoles d'art qui privilégient les œuvres de splendeur et de beauté, et en nous éloignant des styles modernistes ternes que beaucoup en sont venus à détester, nous pouvons nous imposer comme les véritables représentants de l'âge d'or des arts et de la culture européens !"
 FAF_europeanist_propaganda_idea:0 "Propagande pan-européenne"
 FAF_europeanist_propaganda_idea_desc:0 "Nous sommes soumis à un bombardement de propagande pan-européenne dans tous les médias, probablement à la demande de l'Hégémonie européenne pour pousser à l'unification. Quelle que soit la réponse que nous pouvons apporter, un sentiment pesant nous dit que nous ne pourrons peut-être pas rivaliser avec notre mouvement identitaire local et pourrions être contraints d'organiser bientôt un référendum. Si nous voulons préserver notre indépendance, nous devons immédiatement faire quelque chose pour contrer cette propagande."
 FAF_demand_unification_referendum_decision:0 "Exiger un référendum d'unification"
 FAF_demand_unification_referendum_decision_desc:0 ""
 FAF_invite_states_to_the_european_nation_decision:0 "Inviter dans la nation européenne"
 FAF_invite_states_to_the_european_nation_decision_desc:0 "Que ce soit par leurs propres moyens ou grâce à une pression politique antérieure de notre part, nous avons la chance de constater que [insert nation] est déjà favorable à notre cause, et nous n'avons pas à nous soucier de forcer sa main pour rejoindre notre union continentale. Nos relations étant au plus haut, nous enverrons une invitation courtoise au peuple de [insert country] pour qu'il rejoigne ses frères au sein de l'Hégémonie européenne !"
 FAF_strengthen_europeanism_decision:0 "Renforcer le pan-européanisme"
 hos_philosopher_king:0 "Roi philosophe"
 FAF_implement_policy_in_new_states_decision:0 "Répandre la parole verte"
 FAF_implement_policy_in_new_states_decision_desc:0 "Il fut un temps où les arbres sacrés d'Athéna prospéraient et où les sommets de l'Olympe se paraient de neiges éternelles. Mais aujourd'hui, les terres d'Europa sont voilées par l'industrie. Les forêts anciennes meurent sous le vacarme des machines, les rivières cristallines restent troubles de contaminants. Le berceau de la civilisation occidentale perd son visage sacré sous la ruée incessante de la modernité. Or le salut d'Europa ne réside pas dans les villes d'acier et de béton, mais dans l'harmonie entre l'homme et la nature. Nous ne pourrons nous prouver gardiens de la civilisation ancienne qu'en défendant de nouveau la beauté de la nature avec révérence. Telle est notre part : l'espérance éternelle d'Europa."
 FAF_european_nation_category:0 "La nation européenne"
