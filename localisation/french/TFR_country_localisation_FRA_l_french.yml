 FRA_covid_idea_5:0 "Covid catastrophique"
 FRA_covid_idea_5_desc:0 "La pandémie étrangère de COVID-19 a atteint le continent européen sans sembler devoir s'arrêter. La propagation rapide du virus met à rude épreuve les systèmes d'urgence et le gouvernement français, tandis que des comités et des commissions réunissant scientifiques et responsables de la Nation sont formés afin de combattre la progression de la COVID-19 aussi rapidement qu'elle s'est répandue dans le pays.\n\n§RSi la situation n'est pas résolue, les conséquences seront catastrophiques pour la Nation.§!"
 FRA_covid_curing:0 "Distribution du remède"
 FRA_covid_curing_desc:0 "Le peuple de France pousse un soupir de soulagement : les courageux scientifiques d'Europe ont mis au point un vaccin éprouvé capable d'atténuer les effets de la pandémie. Si le nouveau vaccin est en cours de distribution, il faudra du temps pour que la nation soit entièrement vaccinée ; d'ici là, il est capital d'avoir pu produire le remède si tôt. L'éradication totale du virus semble imminente, la COVID-19 s'estompera peu à peu pour ne plus être qu'un simple rhume."
 FRA_Omnicron_idea:0 "Variante Omicron"
 FRA_Omnicron_idea_desc:0 "Omicron est un variant du virus SARS-CoV-2 plus connu sous le nom de \"COVID-19\", récemment apparu en Afrique australe. Cela provoque un regain de panique, car ce nouveau variant ne dispose d'aucun vaccin spécifique à cette mutation. Espérons que ce variant sera rapidement éradiqué, tandis que nos chercheurs s'acharnent dans leurs laboratoires à synthétiser de nouveaux traitements contre le virus."
 FRA_lockdown:0 "Confinement national"
 FRA_lockdown_desc:0 "Pour faire face à la propagation écrasante de la pandémie de COVID-19 dans le pays, nous avons placé l'ensemble du territoire sous ordre de confinement afin de réduire les taux d'infection actuels. Si ces mesures sont efficaces, elles imposent à notre population de rester chez elle, de respecter la distanciation sociale et de porter constamment des masques et de se désinfecter selon les directives de santé publique. Ces directives signifient également que de nombreux citoyens ne peuvent plus travailler, et le mécontentement pourrait bientôt échapper à tout contrôle si nous ne rouvrons pas le pays le plus vite possible."
 FRA_opening_up:0 "Réouverture économique"
 FRA_opening_up_desc:0 "Tout en appliquant la réponse suédoise à l'intérieur de nos frontières, nous avons commencé à percevoir presque immédiatement certains des bénéfices de ce plan. Alors que la production et le système économique du pays étaient paralysés par les confinements, l'assouplissement des obligations a incité nos citoyens à reprendre leurs activités là où ils les avaient laissées, sans dépendre des plans de relance gouvernementaux. Nous ne pouvons qu'espérer que ce changement de rythme vers l'ouverture du pays ne provoque pas une résurgence du virus ni d'autres conséquences imprévues."
 FRA_welfare_payments:0 "Plan de relance économique"
 FRA_welfare_payments_desc:0 "Avec le renforcement des mesures de confinement déjà sévères, le peuple français a été temporairement privé de ses moyens de subsistance et de ses emplois. Or il semble désormais que nous ne soyons pas près de voir la fin de cette pandémie dans un avenir prévisible. Dans ces conditions, le choix responsable pour notre gouvernement est d'aider le peuple français à traverser ces épreuves et à se remettre sur pied, jusqu'à la réouverture tant attendue de notre nation."
 FRA_CFA_Franc:0 "Franc CFA"
 FRA_CFA_Franc_desc:0 "Malgré la décolonisation, l'influence de la France reste forte sur ses anciennes colonies d'Afrique de l'Ouest grâce au franc CFA, monnaie qui regroupe deux zones monétaires réparties sur 14 pays d'Afrique subsaharienne. Arrimé à l'euro, le franc CFA limite la capacité des nations ouest-africaines à gérer leur économie de manière indépendante, les laissant vulnérables aux fluctuations des marchés européens et aux politiques de l'UE.\nCependant, le franc CFA profite à l'économie française : il facilite les échanges et assure une stabilité macroéconomique dans la région. Cette stabilité a contribué à prévenir les crises de la dette et l'inflation, permettant aux entreprises françaises d'investir massivement dans l'extraction des ressources ouest-africaines et de générer des milliards de profits pour la France."
 FRA_CFA_Franc_2:0 "Franc CFA"
 FRA_CFA_Franc_2_desc:0 "Malgré la décolonisation, l'influence de la France reste forte sur ses anciennes colonies d'Afrique de l'Ouest grâce au franc CFA, monnaie qui regroupe deux zones monétaires réparties sur 14 pays d'Afrique subsaharienne. Arrimé à l'euro, le franc CFA limite la capacité des nations ouest-africaines à gérer leur économie de manière indépendante, les laissant vulnérables aux fluctuations des marchés européens et aux politiques de l'UE.\nCependant, le franc CFA profite à l'économie française : il facilite les échanges et assure une stabilité macroéconomique dans la région. Cette stabilité a contribué à prévenir les crises de la dette et l'inflation, permettant aux entreprises françaises d'investir massivement dans l'extraction des ressources ouest-africaines et de générer des milliards de profits pour la France."
 FRA_CFA_Franc_3:0 "Franc CFA"
 FRA_CFA_Franc_3_desc:0 "Malgré la décolonisation, l'influence de la France reste forte sur ses anciennes colonies d'Afrique de l'Ouest grâce au franc CFA, monnaie qui regroupe deux zones monétaires réparties sur 14 pays d'Afrique subsaharienne. Arrimé à l'euro, le franc CFA limite la capacité des nations ouest-africaines à gérer leur économie de manière indépendante, les laissant vulnérables aux fluctuations des marchés européens et aux politiques de l'UE.\nCependant, le franc CFA profite à l'économie française : il facilite les échanges et assure une stabilité macroéconomique dans la région. Cette stabilité a contribué à prévenir les crises de la dette et l'inflation, permettant aux entreprises françaises d'investir massivement dans l'extraction des ressources ouest-africaines et de générer des milliards de profits pour la France."
 FRA_damaged_left_idea:0 "Gauche fragilisée"
 FRA_mass_migration_idea:0 "Immigration massive"
 FRA_mass_migration_idea_desc:0 "\n\n\n\n£GFX_FRA_mass_migration_banner\n\n\n\n\n\nDepuis 1973, la politique d'immigration de la France vise à limiter les migrations, mais en 2019, plus de 120 000 demandes d'asile ont provoqué une profonde division politique. Dans un contexte de ralentissement économique et de chômage élevé, le débat sur l'immigration est devenu un sujet brûlant.\nLa droite, alimentée par la crainte de l'impact migratoire sur l'identité et la sécurité françaises, prône des frontières plus strictes et un discours anti-immigration. Les partis nationalistes réclament la fermeture des frontières pour stopper l'afflux.\nÀ mesure que le débat s'envenime, la société française se polarise de plus en plus. Avec l'augmentation du nombre de réfugiés venus d'Afrique du Nord et du Moyen-Orient, la pression économique s'intensifie. Une politique migratoire décisive deviendra bientôt inévitable."
 FRA_mali_intervention:0 "Intervention au Mali"
 FRA_Civilian_Oil_Rations:0 "Rationnement pétrolier civil"
 FRA_Civilian_Oil_Rations_desc:0 "Si la France a réussi à surmonter les effets à court terme de la guerre civile saoudo-arabe, il devient évident que le temps nous est compté. Le gouvernement a décrété un rationnement pétrolier civil national obligatoire, à l'image de celui imposé par le gouvernement des États-Unis lors de l'embargo de l'OPEP des années soixante-dix et de la révolution iranienne. Grâce à ce rationnement obligatoire, nous tenterons de maintenir un prix raisonnable pour le pétrole disponible pour la population civile."
