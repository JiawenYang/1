 FAF_Open_Paris_Identitarian_Council_decision:0 "Affermir l'§Cidentité parisienne§!"
 FAF_Open_Paris_Identitarian_Council_decision_desc:0 "Comment parler de la France sans mentionner Paris ? Pendant des siècles, Paris a été le cœur de l'art, de la mode et de la littérature français — si ce n'est du monde entier. Mais la « Ville lumière » n'a pas été bâtie de briques et de pierres seules ; elle l'a été par la culture parisienne florissante qui a permis à la vie et à la créativité d'éclore. La culture parisienne est ce qui a porté notre nation sur la scène mondiale et fait résonner notre nom par-delà les océans."
 FAF_Open_Alsace_Identitarian_Council_decision:0 "Affermir l'§Pidentité alsacienne§!"
 FAF_Open_Alsace_Identitarian_Council_decision_desc:0 "L'Alsace est française et l'Alsace reste française. Depuis le traité de Westphalie, l'Alsace est sous domination française. Certains prétendent que l'Alsace est allemande, mais c'est un mensonge flagrant. Un mensonge destiné à semer la division entre nous. Il est vrai que les Allemands nous ont déchirés à plusieurs reprises au cours de l'histoire, mais le sang est plus épais que l'eau et nous devons rappeler ce fait aux gens d'Alsace."
 FAF_Open_Occitan_Identitarian_Council_decision:0 "Affermir l'§Oidentité occitane§!"
 FAF_Open_Occitan_Identitarian_Council_decision_desc:0 "Depuis des générations, l'Occitanie est sous domination française et constitue aujourd'hui une partie bien intégrée de notre nation — peut-être même un peu trop. La culture et la langue occitanes sont devenues menacées, bientôt oubliées au sein de notre grand pays. Nous ne pouvons pas laisser cela se produire. La renaissance culturelle occitane est essentielle pour guider notre peuple dans la redécouverte de ses racines."
 FAF_Open_Corsican_Identitarian_Council_decision:0 "Affermir l'§gidentité corse§!"
 FAF_Open_Corsican_Identitarian_Council_decision_desc:0 "Depuis la fin du XVIIIe siècle, la Corse est française. Cette petite île, juste au sud-est de la France continentale, a donné naissance au plus grand géant de l'histoire française, Napoléon Bonaparte. La place de la Corse au sein de la France a toujours été fragile, voire problématique. Mais en l'embrassant et en l'intégrant, nous pouvons consolider nos liens fraternels."
 FAF_Open_Lombardian_Identitarian_Council_decision:0 "Affermir l'§Gidentité lombarde§!"
 FAF_Open_Lombardian_Identitarian_Council_decision_desc:0 "Le lien entre nous, Français, et les Lombards fut créé lorsque le puissant Charlemagne conquit leur royaume et les intégra à notre sphère d'influence culturelle. Alors que nos frères lombards reviennent dans notre giron, nous devons rallumer les liens séculaires entre nos deux peuples."
 FAF_Open_Venetian_Identitarian_Council_decision:0 "Affermir l'§Aidentité vénitienne§!"
 FAF_Open_Venetian_Identitarian_Council_decision_desc:0 "Nous, Français, avons toujours profondément admiré et apprécié la culture et le peuple vénitiens. Lorsque Napoléon conquit Venise, il ne s'en prit ni à son peuple ni à ses richesses matérielles : il porta son regard sur la magnifique virtuosité artistique vénitienne. Réjouissez-vous, mes frères vénitiens, car vous faites enfin partie de notre grande famille française."
 FAF_Open_Roman_Identitarian_Council_decision:0 "Affermir l'§tidentité romaine§!"
 FAF_Open_Roman_Identitarian_Council_decision_desc:0 "Ô Rome... par où commencer ? La base de la culture française est romaine et la langue française est le latin. L'entrelacement des Romains et des anciens Gaulois a fait de la France ce qu'elle est aujourd'hui. Le militarisme romain, la créativité romaine et l'ingéniosité romaine, nous les avons tous hérités. La France est Rome et Rome est la France."
 FAF_Open_Basque_Identitarian_Council_decision:0 "Affermir l'§7identité basque§!"
 FAF_Open_Basque_Identitarian_Council_decision_desc:0 "Le peuple basque peut être fier de la manière dont il a préservé sa culture et sa langue. Cependant, le poison de la mondialisation a fait décliner l'une et l'autre. En France, la culture basque s'efface lentement et la langue tombe dans l'oubli. En Espagne, le peuple basque est devenu de plus en plus agressif. Sous notre autorité, il doit se rappeler que ce qui nous rend forts n'est pas la division culturelle, mais la richesse d'un double héritage."
 FAF_Open_Catalan_Identitarian_Council_decision:0 "Affermir l'§Yidentité catalane§!"
 FAF_Open_Catalan_Identitarian_Council_decision_desc:0 "La culture et la langue catalanes sont progressivement devenues menacées à cause de nos efforts de centralisation de l'enseignement. Cette petite erreur innocente les a poussées à abandonner leurs propres traditions et les a contraintes à s'adapter au mode de vie français. Nous ne devons pas oublier que nous sommes une castell, et que comme une castell, tout doit être à l'unisson pour atteindre la stabilité."
 FAF_dauphine_province_modifier:0 "Gouvernés par le Dauphin"
 FAF_dauphine_province_modifier_desc:0 "\n§YDauphin :§!\n\n\n\n\n\n\n\n\n\n£GFX_louis_xxi_Portrait\n\n\n\n\n\n\n\n§W          Louis§! \n\n\nDepuis le XIIe siècle, le comte Guigues IV d'Albon, seigneur local, portait un dauphin sur ses armoiries et fut surnommé le Dauphin. En 1349, le Dauphiné passa du dernier dauphin non royal au futur roi de France, Charles V, par l'achat de terres. Les termes de la transmission stipulaient que l'héritier apparent de France serait désormais appelé le Dauphin et incluaient une autonomie significative et une exemption fiscale pour la région du Dauphiné. La restauration de la Monarchie étant achevée, Louis, duc de Bourgogne, est le nouveau Dauphin."
