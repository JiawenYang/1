 FPR_utopia_justice_committee_decision:0 "§pUtopie§! : renforcer le §YCRJ§!"
 FPR_utopia_justice_committee_decision_desc:0 "En autorisant le Comité de Réforme de la Justice à entrer dans les cercles du pouvoir, l'adoption de lois relatives à la justice et à son exécution deviendra plus facile."
