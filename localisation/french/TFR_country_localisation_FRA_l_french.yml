 FAF_new_imperial_era:0 "Néobonapartisme"
 FAF_historical_idols_idea:0 "Idoles historiques"
 FAF_historical_idols_idea_desc:0 "La France n'a jamais manqué de géants historiques. De Charlemagne à Napoléon, notre terre fertile a produit quelques-unes des plus grandes figures de l'histoire humaine. Au milieu de ces ténèbres, ce sont eux qui nous offrent une lueur d'espoir. Ils incarnent une France parfaite — une France forte — celle qui régnait jadis sur l'Europe et étendait son influence à travers le monde. Nous avons peut-être perdu cette guerre, mais une fois que les nouveaux grands de la France auront remplacé les vieux politiciens corrompus qui ont conduit ce pays à sa perte, la France s'épanouira de nouveau. Ils inaugureront un nouvel âge d'or français."
 FAF_the_word_of_the_bishop_idea:0 "La parole de l'évêque"
 FAF_criox_de_fau_idea:0 "Croix-de-Feu"
 FAF_criox_de_fau_idea_desc:0 "Lorsque l'esprit fasciste naquit en Italie pendant l'entre-deux-guerres, de nombreux groupes en France l'adoptèrent et l'introduisirent sur cette terre étrangère. Mais aucun ne le mania aussi efficacement que la Croix-de-Feu sous la sage direction de La Rocque. La Croix-de-Feu devint une force unificatrice pour les patriotes et les combattants français. Bien que certains de nos citoyens leur gardent encore rancune, en ces temps troublés, la France a besoin d'unité et de patriotisme."
 FAF_criox_de_fau_better_idea:0 "Croix-de-Feu"
 FAF_criox_de_fau_better_idea_desc:0 "Lorsque l'esprit fasciste naquit en Italie pendant l'entre-deux-guerres, de nombreux groupes en France l'adoptèrent et l'introduisirent sur cette terre étrangère. Mais aucun ne le mania aussi efficacement que la Croix-de-Feu sous la sage direction de La Rocque. La Croix-de-Feu devint une force unificatrice pour les patriotes et les combattants français. Bien que certains de nos citoyens leur gardent encore rancune, en ces temps troublés, la France a besoin d'unité et de patriotisme."
 FAF_the_crime_of_opinion_idea:0 "Délit d'opinion"
 FAF_the_crime_of_opinion_idea_desc:0 "Dans notre quête de consolidation du pouvoir, un domaine qui nous a donné du fil à retordre est celui du cœur et de l'esprit de nos citoyens. La rééducation a bien fonctionné, mais un autre outil que nous pouvons mettre en œuvre est d'interdire le délit de pensée anti-régime. En rendant punissable, par des amendes ou de courtes peines de prison, le partage ou la possession d'idéaux libéraux, progressistes et anti-français, nous faisons en sorte que chacun réfléchisse à deux fois avant de se plaindre de notre juste gouvernement !"
 FAF_Full_Fascist_Control_idea:0 "État à parti unique"
 FAF_Full_Petainist_Control_idea:0 "État à parti unique"
 FAF_Restored_Monarchy_idea:0 "Mouvement restaurateur"
 FAF_National_Rebirth:0 "Renaissance nationale"
 FAF_National_Rebirth_desc:0 "La France doit s'éveiller à une glorieuse renaissance d'unité et de force. Par un renouveau culturel audacieux et puissant, notre régime doit restaurer la fierté légitime du peuple et placer fermement notre pays sur la voie de la grandeur."
 FAF_National_Rebirth_Anti_Communist:0 "Renaissance nationale"
 FAF_National_Rebirth_Anti_Communist_desc:0 "La France doit s'éveiller à une glorieuse renaissance d'unité et de force. Par un renouveau culturel audacieux et puissant, notre régime doit restaurer la fierté légitime du peuple et placer fermement notre pays sur la voie de la grandeur."
 FAF_Petainist_Defense:0 "Manœuvres défensives"
 FAF_Petainist_Defense_desc:0 "Les défenses stratégiques de notre armée assurent la sécurité des frontières de la nation. Notre armée disciplinée et nos fortifications inébranlables doivent s'appuyer sur la résilience de notre peuple, afin que les agresseurs étrangers ne puissent plus jamais menacer la patrie."
 FAF_Imperialist_Sympathies:0 "Sympathies impériales"
 FAF_Stability_and_Authority_idea:0 "Stabilité et Autorité"
 FAF_Honor_and_Glory_idea:0 "Honneur et Gloire"
 FAF_Fascist_Revolts:0 "Émeutes fascistes"
 FAF_Fascist_Revolts_desc:0 "Que ce soit en raison des événements qui se déroulent à travers l'Europe ou d'un ensemble de politiques adoptées par notre gouvernement, les fascistes de notre pays se révoltent actuellement contre notre gouvernement. Nous ne nous attendons pas à ce que cela dure éternellement, mais nous devrons peut-être reconsidérer notre ligne de conduite, sous peine d'attiser davantage leur colère !"
