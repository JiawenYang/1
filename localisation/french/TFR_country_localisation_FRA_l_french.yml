 FAF_XIV_society_tt:0 "§YL'achèvement de cette priorité nationale enfermera le joueur dans sa trajectoire politique actuelle§!"
 FAF_building_an_empire_idea:0 "Bâtir un empire"
 FAF_building_an_empire_idea_desc:0 "Bâtir un empire prend du temps, tant pour le préparer à la conquête que pour déraciner le fiel qui subsiste dans ses conquêtes. Comme on l'a dit et répété, \"Rome ne s'est pas faite en un jour\", et nous non plus. La nation doit être stabilisée, elle doit être prospère, elle doit être rendue sacrée et stable pour toujours avant que nous puissions véritablement déclarer notre empire construit. Bâti sur des fondations instables, il n'y a rien du tout."
 ROME_nationalist_party_long:0 "Civitas"
 ROME_nationalist_party:0 "Civitas"
 FAF_QU_idea_dummy:0 "Unification quadrilingue"
 FAF_language_of_the_state_dummy:0 "Unification quadrilingue"
 FAF_managerial_bilingualism_dummy:0 "Unification quadrilingue"
 FAF_failures_of_AH_dummy:0 "Unification quadrilingue"
 FAF_solidarite_latine_idea:0 "Solidarité latine"
 FAF_solidarite_latine_idea_desc:0 "Le peuple latin est une hégémonie qui doit déployer ses ailes sur toute l'Europe, combattant comme une entité unique et comme un monument à notre histoire et à notre culture. Les ennemis de la latinité sont vastes, nombreux et forts de leur détermination. Cependant, comme décrit, ils ne sont rien d'autre que des barbares s'efforçant perfidement de démolir les murs de la civilisation, que nous, les descendants de Rome, devons combattre par le sang et la terre."
 FAF_convene_latin_congress_decision:0 "Convoquer le congrès latin"
 FAF_convene_latin_congress_decision_desc:0 "Nous sommes un État pour tous les grands peuples latins, et pour nous assurer que notre nouvel empire ne finisse pas dominé par les Français, par exemple, nous devons garantir que chaque frère latin de l'empire ait sa représentation. Pour y parvenir, nous convoquerons de grands congrès latins où tous les frères latins bénéficieront d'une représentation équitable."
 FAF_Imperial_Palace_idea:0 "Le palais impérial"
 FAF_Imperial_Palace_idea_desc:0 "Le palais est un signe de stabilité, de richesse et de prospérité. Symbole de la France et de sa monarchie, il est la preuve qu'elle perdurera pendant des éons. C'est un étalage clinquant de notre richesse et de notre pouvoir sur le continent, le diamant sur sa bague."
 FAF_invading_balkans_tt:0 "§YCette priorité nationale donnera des objectifs de guerre contre toutes les nations des Balkans.§!"
 FAF_the_grand_council_idea:0 "Le Grand Conseil du fascisme"
 FAF_the_grand_council_idea_desc:0 "Le système politique français s'est une fois de plus révélé être un fouillis inefficace. À l'image de l'ancienne monarchie bourbonienne, il doit être renversé et un nouveau système doit être créé. Avec un gouvernement plus hardi et plus courageux, la France se reconstruira et redécouvrira sa gloire passée. La piètre performance de la démocratie sera remplacée par la vitalité du fascisme. Un leadership fort est le seul moyen d'obtenir un véritable changement et de vraies réformes — pas le vote ni les débats. Nous formerons un nouvel organe de gouvernement inspiré du Grand Conseil du fascisme italien, ouvrant une nouvelle ère de prospérité pour notre nation."
 FAF_Reinforce_the_Regime_Fascist:0 "Renforcer le régime"
