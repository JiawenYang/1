 FRA_France_on_the_World_Stage:0 "La France sur la scène mondiale"
 FRA_France_on_the_World_Stage_desc:0 "\n\n\n\n\n£GFX_FRA_France_World_Stage_category\n\n\n\n\n\n\n\nTout au long de son histoire, la France a joué un rôle majeur sur la scène mondiale, s'affirmant comme une grande puissance et influençant divers domaines de l'activité humaine. Du Moyen Âge à la Renaissance, la France s'est imposée comme un centre culturel et intellectuel, favorisant le développement des arts, de la littérature et de la philosophie. À l'époque des grandes découvertes, les explorateurs et les marchands français parcoururent le globe, établissant des colonies et des réseaux commerciaux. Au XVIIIe siècle, la France connut une révolution qui eut un impact profond sur le paysage politique et social de l'Europe, portant les idéaux de liberté, d'égalité et de fraternité. La puissance militaire française s'illustra avec Napoléon Bonaparte, dont les conquêtes redessinèrent les frontières européennes. Aux XIXe et XXe siècles, la France demeura un acteur important de la politique mondiale, impliquée dans le colonialisme, deux guerres mondiales et la formation de l'Union européenne."
 FRA_Recognize_Constitutionalists_decision:0 "[USC.GetFlag]§CACG§! : Reconnaître le §Cgouvernement constitutionnel américain§!"
 FRA_Recognize_Constitutionalists_decision_desc:0 "Alors que la guerre civile continue de faire rage aux États-Unis, nous avons jusqu'ici maintenu une politique de neutralité générale, confrontés à des questions plus urgentes ici en Europe. Maintenant que nous pouvons de nouveau concentrer nos efforts à l'étranger, il serait dans notre intérêt de reconnaître les constitutionnalistes de Trump comme le gouvernement légitime des États-Unis afin de sécuriser à nouveau notre alliance de longue date."
 FRA_Recognize_Biden_decision:0 "[USB.GetFlag]§CUOA§! : Reconnaître l'§CUnion d'Amérique§!"
 FRA_Recognize_Biden_decision_desc:0 "Alors que la guerre civile aux États-Unis fait toujours rage, nous devons déterminer quelle faction reconnaître comme gouvernement légitime de ces territoires déchirés. Comme nous cherchons à retrouver la sécurité que nous garantissait l'adhésion des Américains à l'OTAN, il est dans notre intérêt de reconnaître le gouvernement unioniste et de soutenir ses efforts pour rétablir la normalité dans son pays."
 FRA_Recognize_Patriot_Front_decision:0 "[PTF.GetFlag]§2Patriot Front§! : Reconnaître le §2Front patriote§!"
 FRA_Recognize_Patriot_Front_decision_desc:0 "La guerre civile aux États-Unis a bouleversé son paysage politique, notamment avec l'ascension du Front patriote d'extrême droite. Bien que nous désapprouvions nombre de ses politiques sur le fond, nous devons reconnaître et soutenir son gouvernement pour tenter de sauver notre ancienne alliance avant qu'il ne soit trop tard."
 FRA_Recognize_Association_of_the_Freed_decision:0 "[GMA.GetFlag]§GAOF§! : Reconnaître l'§GAssociation des affranchis§!"
 FRA_Recognize_Association_of_the_Freed_decision_desc:0 "Si le bouleversement de l'ancien ordre américain était inévitable avec la Seconde Guerre civile, un net basculement vers certaines factions plus marginales du conflit s'est opéré. En particulier, un groupe connu sous le nom d'\"Association des affranchis\" a dépassé les attentes étrangères et cherche davantage de soutien international. Il est donc dans notre intérêt de reconnaître l'AOF comme le gouvernement légitime des États-Unis et de l'assister dans sa Seconde révolution américaine !"
 FRA_Recognize_SoL_decision:0 "[FAA.GetFlag]§GCoFAR§! : Reconnaître la §YConfédération des républiques américaines libres§!"
 FRA_Recognize_SoL_decision_desc:0 "Bien que notre situation intérieure nous ait empêchés d'intervenir dans la Seconde Guerre civile américaine, nous avons désormais la capacité d'étendre notre influence et devrions reconnaître une faction comme le gouvernement légitime des États-Unis. En particulier, la Confédération des républiques américaines libres et son ascension soudaine depuis la Nouvelle-Angleterre en font un candidat évident à notre soutien. Comme nous l'avons fait en 1776, nous devrions déclarer notre soutien à la COFAR et à sa Seconde révolution américaine !"
 FRA_Recognize_GMAC_decision:0 "[GMA.GetFlag]§GGMAC§! : Reconnaître le §GCollectif anarchiste de Green Mountain§!"
 FRA_Recognize_GMAC_decision_desc:0 "Alors que la situation en Amérique continue d'évoluer sous les ravages de la Seconde Guerre civile, nous n'avons toujours pas trouvé de faction à reconnaître et à soutenir. Aussi peu orthodoxe que cela puisse paraître, le \"gouvernement\" du Collectif anarchiste de Green Mountain a montré sa volonté de bâtir une Amérique meilleure, même dans l'apatridie de l'anarchisme. Si nous les soutenons dans leurs efforts pour réunifier les États-Unis, nous pourrions avoir un allié unique dans la tempête géopolitique à venir."
 FRA_Recognize_APLA_decision:0 "[APA.GetFlag]§RAPLA§! : Reconnaître l'§RArmée de libération du peuple américain§!"
 FRA_Recognize_APLA_decision_desc:0 ""
 FRA_Align_Madagascar_decision:0 "[MAD.GetFlag] Aligner Madagascar"
 FRA_Align_Madagascar_decision_desc:0 "Depuis que leurs efforts d'indépendance ont abouti en 1960, nous avons eu du mal à exercer notre influence dans l'océan Indien à cause de Madagascar. La recolonisation étant évidemment hors de question, nous pouvons plutôt chercher à étendre notre soft power dans le pays et tenter de corriger nos erreurs coloniales afin de rallier à nouveau l'île à nos intérêts. Ce faisant, nous pourrons de nouveau garantir que nos capacités navales sont bien celles d'une véritable grande puissance."
 FRA_French_Arms_in_Indian_Hands_decision:0 "[RAJ.GetFlag] Fournir des armes à l'Inde"
 FRA_French_Arms_in_Indian_Hands_decision_desc:0 "Avec l'agressivité croissante de la République islamique du Pakistan et de la République populaire de Chine, il devient évident que nous devons garantir à la République d'Inde l'aide dont elle aura besoin, tant que nous pouvons nous le permettre au moment donné."
