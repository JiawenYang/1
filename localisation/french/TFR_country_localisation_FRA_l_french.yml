 FAF_Engie_Bills_idea:0 "Traites Engie"
 FAF_Engie_Bills_idea_desc:0 "Les traites Engie sont un système de prêts et d'endettement qui permettra à la France de se remilitariser sans que les puissances étrangères n'interviennent ou ne s'en mêlent. Semblables aux traites MEFO utilisées par l'Allemagne pour réindustrialiser son pays, elles constituent une manœuvre coûteuse et frauduleuse, qui ne durera probablement pas éternellement. Cependant, quel qu'en soit le dénouement, elles sont ce dont la France a besoin pour renaître véritablement comme puissance sur la scène mondiale."
