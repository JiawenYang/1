 FAF_Enforce_Edict_of_Paris:0 "Appliquer l'édit de Paris"
 FAF_Enforce_Edict_of_Paris_desc:0 "Pour en finir avec la décadence et le désordre de la démocratie libérale, nous nous retrouvons à revenir au droit et aux coutumes traditionnels. En particulier, l'édit de Paris, bien qu'issu de la législation mérovingienne du VIIe siècle, équilibre les pouvoirs de l'Église et de l'État tout en veillant à ce que l'un et l'autre conservent leur puissance. Afin d'asseoir davantage notre administration, nous pouvons de nouveau inscrire cet édit dans le droit français, en veillant à l'actualiser pour qu'il réponde aux problèmes et à l'économie modernes."
 FAF_liberal_crackdown:0 "Répression des libéraux"
 FAF_liberal_crackdown_desc:0 "Pour permettre l'instauration de notre nouvelle administration, nous devons sévir contre les éléments subversifs. En particulier, les sympathisants de l'ancien régime et de sa démocratie libérale décadente manifestent contre chacune de nos actions et paralysent notre pays. Pour prévenir toute contre-révolution, nous devons employer tous les moyens nécessaires afin d'écraser définitivement la puissance politique du libéralisme en France et de nous assurer que nous ne retomberons pas dans les travers de l'ancienne République."
 FAF_communist_crackdown:0 "Répression des communistes"
 FAF_communist_crackdown_desc:0 "Une fois encore, un spectre hante l'Europe. Alors que la République corrompue s'effondrait sous son propre poids, les rats marxistes cachés sous le masque de la civilité libérale ont tenté de détruire notre France bien-aimée. Heureusement, ayant remporté la guerre civile, nous disposons enfin des moyens de sévir contre ces éléments. Si nous échouons, Dieu seul sait ce qu'il adviendra de l'Europe si notre mouvement venait à échouer."
 FAF_imperial_decentralization:0 "Décentralisation impériale"
 FAF_imperial_decentralization_desc:0 "Bien que nous puissions nous reconnaître dans les idéaux de l'absolutisme et d'un gouvernement centralisé, l'histoire montre que la gestion locale présente parfois des avantages. En particulier, la région du Rhône, riche en ressources, abrite de nombreux établissements locaux bien plus aptes à tirer de la valeur du territoire. Certes, ils auront une certaine emprise sur leurs lois locales et pourront contourner nos décisions, mais ils nous donneront le meilleur d'eux-mêmes. Il faut parfois consentir à des sacrifices, et nous en tirerons davantage de leur vin de classe mondiale !"
