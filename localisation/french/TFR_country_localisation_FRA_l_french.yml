 FAF_european_nation_join_tt:0 "Nous gagnerons l'idée §CHégémonie européenne§!."
 FAF_EU_federalization_tt:0 "En lançant §YCampagne pour l'unification continentale§!, tous les pays au sein de l'§CHégémonie européenne§! auront le choix de se fédéraliser. \n§GDes relations plus élevées§! entraîneront une §Cprobabilité plus grande d'annexion§!."
