 trait_FRA_Disgusted_with_Regime:0 "En colère contre le régime"
 trait_FRA_Disgusted_with_Regime_desc:0 "Cet officier se sent méprisé par le régime en place et s'efforcera activement d'être aussi indépendant que possible du haut commandement. \n\nSi quoi que ce soit venait à déstabiliser la République française, cet officier prendrait sans aucun doute parti contre l'establishment."
 trait_FRA_Neutral_with_Regime:0 "Neutre envers le régime"
 trait_FRA_Neutral_with_Regime_desc:0 "Cet officier n'éprouve ni bons ni mauvais sentiments envers le régime en place. \n\nSi quoi que ce soit venait à déstabiliser la République française, cet officier pourrait décider d'abandonner l'establishment, sans que cela soit garanti."
 DSW_cavalry_officer: "Officier de cavalerie"
 trait_FRA_Happy_with_Regime:0 "Satisfait du régime"
 trait_FRA_Happy_with_Regime_desc:0 "Cet officier ressent un profond honneur de servir la France en raison des actions du régime en place. \n\nSi quoi que ce soit venait à déstabiliser la République française, cet officier prendrait sans aucune hésitation parti pour l'establishment."
 trait_FRA_Political_Retirement:0 "Retraite politique"
 trait_FRA_Political_Retirement_desc:0 "Bien qu'en retraite politique, ces officiers peuvent encore servir leur bien-aimée France en temps de crise, mais sans l'approbation gouvernementale dont bénéficient les autres généraux. \n\nSi quoi que ce soit venait à déstabiliser la République française, cet officier prendrait sans aucune hésitation parti contre l'establishment."
