 FAF_full_employment_idea:0 "Plein emploi"
 FAF_full_employment_idea_desc:0 "Enfin, après des années d'essais et d'erreurs, nous avons atteint un taux de \"plein emploi\" national parmi notre population. Ce faisant, la plupart de nos citoyens ont trouvé des carrières garantissant un niveau de vie élevé qui les pousse à tout donner pour notre nation et son économie. Bien sûr, cela a créé des problèmes concernant nos réserves de main-d'œuvre pour la conscription et les plaintes d'entreprises qui ne peuvent plus profiter d'une main-d'œuvre étrangère bon marché. Mais pour nos citoyens, et surtout pour notre propagande, l'accomplissement d'avoir du travail pour tous n'est pas à dédaigner !"
