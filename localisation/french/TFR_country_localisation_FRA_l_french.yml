 FAF_Glorify_Jeanne_dArc:0 "Glorifier Jeanne d'Arc"
 FAF_Glorify_Jeanne_dArc_desc:0 ""
 FAF_Enshrine_the_Rights_of_Man:0 "Inscrire les droits de l'homme"
 FAF_Enshrine_the_Rights_of_Man_desc:0 "En 1798, nos ancêtres ont rejeté la terreur et la barbarie de l'Ancien Régime et ont entrepris de rédiger des lignes directrices pour le peuple français nouvellement libéré. Ce document, connu sous le nom de Déclaration des droits de l'homme et du citoyen, occupe encore une place dans la constitution la plus récente de la Cinquième République. Tandis que nous reconstruisons la légitimité gouvernementale, ne pas inscrire ces droits serait une folie !"
 FAF_Restore_Marianne:0 "Restaurer la gloire de Marianne"
 FAF_Restore_Marianne_desc:0 "La figure de Marianne, surgie des flammes de la Première République, a souvent servi de personnification nationale de la France elle-même. Cependant, au cours des dernières décennies, elle est devenue moins présente dans la culture populaire, au grand dam de nombreux patriotes français. Ainsi, si nous voulons unir la France sous notre bannière patriotique, nous devons restaurer la pertinence et la gloire de notre bien-aimée Marianne !"
 FAF_Calm_Militarist_Rhetoric:0 "Apaiser la rhétorique militariste"
 FAF_Calm_Militarist_Rhetoric_desc:0 "Dans nos rangs se trouvent ceux qui souhaitent voir l'armée prendre un contrôle encore plus étendu sur le gouvernement, au détriment de nos libertés civiles. Si nous pouvons comprendre leurs appels à l'ordre et à la stabilité, il est temps d'adoucir la rhétorique de ces militaristes, de peur de voir notre bien-aimée République se transformer en junte militaire permanente."
 FAF_Pardon_Republican_Officers:0 "Gracier les officiers républicains"
 FAF_Pardon_Republican_Officers_desc:0 "Dans nos efforts pour garantir le contrôle de l'appareil d'État, nous avons besoin de toutes les mains disponibles. Notre purge initiale a concerné la plupart des anciens officiers lors de notre coup d'État, mais ceux qui sont sympathisants peuvent être réintégrés par une série de grâces."
 FAF_Mimic_de_Gaulle:0 "Imiter de Gaulle"
 FAF_Mimic_de_Gaulle_desc:0 "Alors que nous cherchons à établir une gouvernance forte et centrée sur l'armée qui respecte néanmoins les droits fondamentaux de nos citoyens, qui mieux que le regretté président et général Charles de Gaulle peut nous servir de modèle ? Ses efforts pour établir la malheureuse Sixième République peuvent fournir un cadre à notre leadership qui, bien qu'il ait fallu des moyens musclés pour réprimer la crise de mai 1958, a laissé un héritage chaleureux que nous devons chercher à imiter."
 FAF_Glorify_Vichy_Stability:0 "Glorifier la stabilité de Vichy"
 FAF_Glorify_Vichy_Stability_desc:0 "L'image publique de l'ancien État français a été ternie par des accusations de \"collaboration avec l'Allemagne\" proférées par de nombreux historiens partisans, mais il existe un moyen de racheter son héritage auprès du peuple français. Comme il s'agit de quelque chose que beaucoup recherchent dans le chaos du XXIe siècle, mettre en avant la stabilité de l'ancien régime de Vichy peut aider notre peuple à comprendre que nos objectifs dépassent largement une simple capitulation devant les fascistes allemands."
 FAF_Redeem_The_Marechal:0 "Réhabiliter le Maréchal"
 FAF_Redeem_The_Marechal_desc:0 "L'histoire n'a pas été tendre avec Philippe Pétain. Le Maréchal, jadis surnommé le \"Lion de Verdun\" pour sa bravoure lors de la Première Guerre mondiale et sa volonté de négocier la paix avec les Allemands envahisseurs afin d'éviter la destruction imminente de la France. Les mesquins historiens libéraux, acharnés à le faire passer pour un collaborateur, doivent être réduits au silence. Notre enseignement doit plutôt refléter une approche plus \"équitable\" du véritable sauveur de la France pendant la Seconde Guerre mondiale !"
 FAF_Keep_Officers_in_Check:0 "Contenir les officiers"
 FAF_Keep_Officers_in_Check_desc:0 "Le corps des officiers a été une véritable épine dans notre pied, aligné sur les gaullistes pseudo-libéraux qui cherchent à nous ramener à l'instabilité des précédentes républiques françaises. Même si nous aurons encore besoin d'eux dans les affaires de l'État, limiter leur influence politique est essentiel pour garantir la sécurité de notre pouvoir."
 FAF_An_Honour_to_Serve:0 "Un honneur de servir"
 FAF_An_Honour_to_Serve_desc:0 "Notre peuple doit comprendre que l'héritage français est un héritage de service et de sacrifice. Des temps anciens des Francs et de Charlemagne aux conquêtes napoléoniennes de l'Europe, l'héritage français est celui de l'armée et de l'honneur de la servir. La propagande doit mettre en avant cette tradition, d'autant plus que nous nous préparons à une nouvelle croisade contre les hordes de l'Est !"
 FAF_Promote_French_Israelism:0 "Promouvoir l'israélisme français"
 FAF_Promote_French_Israelism_desc:0 "Bien qu'il s'agisse d'une croyance marginale dans le nationalisme français, il existe un mouvement de personnes persuadées que nos ancêtres francs descendent de la tribu de Benjamin, donc de l'une des dix tribus perdues d'Israël. Certains y verront une pseudo-histoire, mais si nous promouvons ce concept, il peut aider à galvaniser nos citoyens religieux pour qu'ils combattent pour notre régime. Dans la lutte contre les hordes de l'Est, nous présenter comme croisés de naissance serait une sage idée."
 FAF_Promote_Radical_Officers:0 "Promouvoir les officiers radicaux"
 FAF_Promote_Radical_Officers_desc:0 "Pour contrebalancer l'influence des gaullistes sur le corps des officiers, nous pouvons promouvoir les membres actuellement en service qui incarnent mieux nos idéaux pétainistes. Et puis, il est toujours bon que les officiers aient des opinions divergentes, surtout sur le plan politique, non ?"
