 FRA_Apres_moi_le_deluge_spirit:0 "Après moi, le déluge"
 FRA_Apres_moi_le_deluge_spirit_desc:0 "Nos hommes déferleront comme un torrent sur le champ de bataille."
 FRA_Heirs_to_Napoleon_spirit:0 "Héritage d'excellence"
 FRA_Heirs_to_Napoleon_spirit_desc:0 "Nos officiers servent la même nation que Napoléon a portée à la grandeur ; eux aussi peuvent nous mener à la grandeur, comme Napoléon l'a fait."
 FRA_Edouard_philippe_HM:0 "Édouard Philippe"
 FRA_Edouard_philippe_HM_desc:0 "Édouard Philippe, né le 28 novembre 1970, est un homme politique et avocat français qui fut Premier ministre de la France du 15 mai 2017 au 3 juillet 2020, sous la présidence d'Emmanuel Macron. Il fut membre des Républicains (LR) avant de devenir indépendant. Philippe était connu pour son approche pragmatique du gouvernement et sa capacité à naviguer dans des paysages politiques complexes. Durant son mandat, il affronta des défis considérables, notamment le mouvement des Gilets jaunes et la pandémie de COVID-19. Son style de direction était souvent décrit comme calme et mesuré, ce qui lui valut le respect de tout l'éventail politique."
 FRA_Jean_Castex_HM:0 "Jean Castex"
 FRA_Jean_Castex_HM_desc:0 "Jean Castex, né le 25 juin 1965, est un haut fonctionnaire et homme politique français devenu Premier ministre de la France le 3 juillet 2020, succédant à Édouard Philippe sous la présidence d'Emmanuel Macron. Castex est issu de l'administration publique et a occupé divers postes gouvernementaux, notamment maire de Prades et conseiller régional d'Occitanie. Il est connu pour son expertise des questions sanitaires et sociales, particulièrement en milieu rural. Castex a affronté des défis tels que la gestion de la pandémie de COVID-19 et la mise en œuvre de plans de relance économique. Son style de direction est souvent décrit comme pragmatique et axé sur la recherche de consensus."
 FRA_Nicolas_Dupont_Aignan_HM:0 "Nicolas Dupont-Aignan"
 FRA_Nicolas_Dupont_Aignan_HM_desc:0 "Nicolas Dupont-Aignan, né le 7 mars 1961, est un homme politique français et fondateur du parti Debout la France (DLF). Il est une figure de proue de la politique française, défendant la souveraineté nationale, le patriotisme économique et les valeurs conservatrices traditionnelles. Dupont-Aignan fut député de 1997 à 2012 et s'est présenté plusieurs fois à la présidence de la France. Il est connu pour sa critique de l'Union européenne et ses appels à ce que la France reprenne le contrôle de ses frontières et de son économie. Ses positions politiques s'alignent souvent sur des vues nationalistes et eurosceptiques, faisant de lui une voix importante du paysage politique français."
 FRA_Philippe_de_Villiers_HM:0 "Philippe de Villiers"
 FRA_Philippe_de_Villiers_HM_desc:0 "Philippe de Villiers, né le 25 mars 1949, est un homme politique, écrivain et ancien député européen français. Il est le fondateur du parti eurosceptique de droite Mouvement pour la France et une figure de proue de la politique française depuis plusieurs décennies. De Villiers est connu pour ses vues conservatrices, son plaidoyer pour la souveraineté française et sa critique de la mondialisation et de l'Union européenne. Il s'est aussi investi dans des initiatives culturelles, dont la création du parc à thème historique du Puy du Fou. Sa carrière politique a été marquée par sa fermeté sur la préservation de l'identité et des traditions françaises. Il est le frère aîné de §CPierre de Villiers§!."
 FRA_elisabeth_borne_HM:0 "Élisabeth Borne"
 FRA_elisabeth_borne_HM_desc:0 "Élisabeth Borne, née le 18 avril 1961, est une femme politique et haute fonctionnaire française ayant occupé plusieurs postes ministériels au sein du gouvernement français. Borne est issue du génie civil et a exercé diverses fonctions dans les secteurs public et privé. Elle est connue pour son expertise des transports et des infrastructures, ayant été ministre des Transports dans le gouvernement du Premier ministre Édouard Philippe de 2017 à 2020. Borne est reconnue pour son approche pragmatique du gouvernement et son engagement envers les questions sociales et environnementales."
 FRA_mathilde_panot_HM:0 "Mathilde Panot"
 FRA_mathilde_panot_HM_desc:0 "Mathilde Panot, née le 21 juin 1974, est une femme politique française et députée à l'Assemblée nationale. Elle représente la 10e circonscription du Val-de-Marne depuis 2017, en tant que membre de La France Insoumise (LFI), un parti de gauche. Panot est connue pour son militantisme et son plaidoyer en faveur de la justice sociale, de la durabilité environnementale et des droits humains. Elle critique ouvertement les inégalités économiques et participe activement à divers mouvements sociaux. Ses positions politiques s'alignent souvent sur des vues progressistes et anti-establishment, faisant d'elle une figure de proue du paysage politique français."
 FRA_jean_yves_le_drian_FM:0 "Jean-Yves Le Drian"
 FRA_jean_yves_le_drian_FM_desc:0 "Jean-Yves Le Drian, né le 30 juin 1947, est un homme politique français ayant occupé divers postes ministériels au sein du gouvernement français. Il est membre du Parti socialiste et a siégé à l'Assemblée nationale et au Sénat. Le Drian fut ministre de la Défense de 2012 à 2017 sous la présidence de François Hollande, où il supervisa les opérations militaires françaises à l'étranger, notamment au Mali et en Syrie. Il est également ministre de l'Europe et des Affaires étrangères depuis 2017 sous la présidence d'Emmanuel Macron. Le Drian est connu pour son expertise des affaires étrangères et son rôle dans l'élaboration de la politique étrangère française. Il est perçu comme une figure clé de la politique française et a participé à de nombreux efforts diplomatiques au nom de la France."
 FRA_Catherine_Colonna_FM:0 "Catherine Colonna"
 FRA_Catherine_Colonna_FM_desc:0 "Catherine Colonna, née le 17 mars 1956, est une diplomate et femme politique française. Elle a occupé divers postes diplomatiques, dont celui d'ambassadrice de France au Royaume-Uni de 2017 à 2021. Colonna a aussi exercé des fonctions au sein du gouvernement français, comme ministre des Affaires européennes de 2004 à 2005 sous la présidence de Jacques Chirac. Elle a contribué à façonner la politique étrangère française, particulièrement vis-à-vis de l'Europe, et est connue pour ses compétences et son expertise diplomatiques. Sa carrière a été marquée par son engagement à promouvoir les intérêts français à l'étranger et à renforcer la coopération européenne."
 FRA_Francois_Asselineau_FM:0 "François Asselineau"
 FRA_Francois_Asselineau_FM_desc:0 "François Asselineau, né le 14 septembre 1957, est un homme politique français et fondateur du parti Union Populaire Républicaine (UPR), qui prône le retrait de la France de l'Union européenne. Asselineau est un critique virulent de l'UE et de ce qu'il considère comme une érosion de la souveraineté française. Il s'est présenté plusieurs fois à la présidence de la France, défendant sa vision d'un « Frexit » et d'un retour à un État français indépendant. Ses positions politiques s'alignent souvent sur des vues nationalistes et antimondialistes, faisant de lui une figure controversée de la politique française."
 FRA_Raphael_Gluckmann_FM:0 "Raphaël Glucksmann"
 FRA_Raphael_Gluckmann_FM_desc:0 "Raphaël Glucksmann, né le 15 octobre 1979, est un auteur, réalisateur et homme politique français. Il est le fondateur du mouvement politique Place Publique et député européen depuis 2019. Glucksmann est connu pour ses vues progressistes et pro-européennes, défendant la justice sociale, les droits humains et la durabilité environnementale. Il critique ouvertement les mouvements d'extrême droite en Europe et s'investit activement dans la promotion de la coopération et de l'intégration européennes. Sa carrière politique a été marquée par son engagement envers les valeurs progressistes et ses efforts pour répondre aux problèmes pressants de la société."
 FRA_Bruno_le_Maire_EM:0 "Bruno Le Maire"
 FRA_Bruno_le_Maire_EM_desc:0 "Bruno Le Maire, né le 15 avril 1969, est un homme politique français ayant occupé plusieurs postes ministériels au sein du gouvernement français. Il est membre du parti Les Républicains (LR) et ministre de l'Économie, des Finances et de la Relance depuis 2017 sous la présidence d'Emmanuel Macron. Le Maire est connu pour son expertise des questions économiques et financières et a joué un rôle clé dans l'élaboration des politiques économiques françaises. Il a participé aux efforts de réforme de l'économie française, de promotion de l'investissement et de renforcement de la position de la France au sein de l'Union européenne. Il est perçu comme une figure de proue de la politique française et un fervent défenseur des réformes économiques et de l'intégration européenne."
 FRA_Guillaume_Peltier_EM:0 "Guillaume Peltier"
 FRA_Guillaume_Peltier_EM_desc:0 "Guillaume Peltier, né le 27 juillet 1976, est un homme politique français et membre du parti Les Républicains (LR). Il est député depuis 2012, représentant la 2e circonscription du Loir-et-Cher. Peltier est connu pour ses vues conservatrices et nationalistes, défendant les valeurs traditionnelles et la souveraineté nationale. Il est une figure de proue de la droite française et a participé aux efforts de réforme du parti LR. Peltier est perçu comme un futur dirigeant potentiel du parti et un critique virulent du gouvernement d'Emmanuel Macron."
 FRA_Eric_Coquerel_EM:0 "Éric Coquerel"
 FRA_Eric_Coquerel_EM_desc:0 "Éric Coquerel, né le 15 août 1968, est un homme politique français et membre du parti La France Insoumise (LFI). Il est député depuis 2017, représentant la 1re circonscription de la Seine-Saint-Denis. Coquerel est connu pour ses vues de gauche et anticapitalistes, défendant la justice sociale, la durabilité environnementale et les droits des travailleurs. Il critique ouvertement les mesures d'austérité et les politiques néolibérales, et participe activement à divers mouvements sociaux. Coquerel est perçu comme une figure clé de La France Insoumise et a contribué à façonner son programme politique."
 FRA_Pierre_Gattaz_EM:0 "Pierre Gattaz"
 FRA_Pierre_Gattaz_EM_desc:0 "Pierre Gattaz, né le 18 mars 1959, est un homme d'affaires français et ancien président du Mouvement des entreprises de France (MEDEF). Il a présidé le MEDEF de 2013 à 2018, représentant les intérêts des employeurs français et défendant des politiques favorables aux entreprises. Gattaz est issu d'une famille fortement ancrée dans l'industrie et a participé à diverses entreprises tout au long de sa carrière. Il est connu pour son plaidoyer en faveur des réformes économiques, notamment du marché du travail et des mesures destinées à renforcer la compétitivité. Gattaz est une voix importante des milieux d'affaires français et a pris part aux débats sur la politique économique et la stratégie industrielle."
 FRA_christophe_castaner_IM:0 "Christophe Castaner"
 FRA_christophe_castaner_IM_desc:0 "Christophe Castaner, né le 3 janvier 1966, est un homme politique français ayant occupé plusieurs postes ministériels au sein du gouvernement français. Il est membre du parti La République En Marche ! (LREM) et un proche allié du président Emmanuel Macron. Castaner fut ministre de l'Intérieur de 2018 à 2020, où il supervisa la sécurité intérieure et les forces de l'ordre. Il fut auparavant porte-parole du gouvernement sous le Premier ministre Édouard Philippe. Castaner est connu pour son approche pragmatique du gouvernement et ses efforts pour moderniser la police française. Il a aussi participé aux efforts de lutte contre le terrorisme et de maintien de l'ordre public."
 FRA_gerald_darmanin_IM:0 "Gérald Darmanin"
 FRA_gerald_darmanin_IM_desc:0 "Gérald Darmanin, né le 11 octobre 1982, est un homme politique français ayant occupé plusieurs postes ministériels au sein du gouvernement français. Il est membre du parti Les Républicains (LR) et un proche allié du président Emmanuel Macron. Darmanin est ministre de l'Intérieur depuis 2020, supervisant la sécurité intérieure et les forces de l'ordre. Il fut auparavant ministre de l'Action et des Comptes publics de 2017 à 2020. Darmanin est connu pour ses vues conservatrices et sa fermeté en matière de criminalité et d'immigration. Il est une figure clé de l'administration Macron et a participé aux efforts de réforme de la police française et de réponse aux défis sécuritaires."
 FRA_Herve_Gomart_IM:0 "Hervé Gomart"
 FRA_Herve_Gomart_IM_desc:0 "Hervé Gomart est un diplomate et officier du renseignement français. Il a dirigé la Direction du renseignement militaire (DRM), l'agence de renseignement militaire de la France, de 2013 à 2017. Gomart est issu des affaires militaires et du renseignement et a participé à l'élaboration des politiques de sécurité nationale françaises. Il est connu pour son expertise en matière de renseignement et son rôle de coordination des efforts de renseignement au service des opérations militaires françaises. Son mandat à la tête de la DRM a coïncidé avec une période de défis sécuritaires accrus pour la France, notamment des menaces terroristes et des interventions militaires à l'étranger."
 FRA_Jordan_Bardella_IM:0 "Jordan Bardella"
 FRA_Jordan_Bardella_IM_desc:0 "Jordan Bardella, né le 13 septembre 1995, est un homme politique français membre du parti conservateur Rassemblement National (RN). Il est député européen depuis 2019, représentant la circonscription d'Île-de-France. Bardella est connu pour ses vues conservatrices et nationalistes, défendant des politiques d'immigration plus strictes, des frontières plus fortes et la préservation de l'identité culturelle française. Il est perçu comme une étoile montante du Rassemblement National et une figure clé de ses efforts pour élargir son attrait auprès des jeunes électeurs. Sa carrière politique a été marquée par son fort soutien à Marine Le Pen, dirigeante du Rassemblement National, et par ses efforts pour promouvoir le programme du parti."
 FRA_Stephane_Ravier_IM:0 "Stéphane Ravier"
 FRA_Stephane_Ravier_IM_desc:0 "Stéphane Ravier, né le 15 juin 1967, est un homme politique français membre de la Rassemblement National. Il est maire du 7e secteur de Marseille depuis 2014 et sénateur depuis 2017, représentant le département des Bouches-du-Rhône. Ravier est connu pour ses opinions conservatrices et nationalistes, prônant des politiques d'immigration plus strictes, l'ordre public et la protection de l'identité culturelle française. Il est considéré comme une figure de premier plan au sein du Rassemblement national et un critique virulent des partis politiques traditionnels. Sa carrière politique a été marquée par ses efforts pour traiter les problèmes auxquels Marseille fait face, notamment la criminalité et la décrépitude urbaine, et par son soutien à Marine Le Pen, la dirigeante du Rassemblement national."
 FRA_Ugo_Bernalicis_IM:0 "Ugo Bernalicis"
 FRA_Ugo_Bernalicis_IM_desc:0 "Ugo Bernalicis, né le 9 octobre 1987, est un homme politique français membre du parti de gauche La France Insoumise. Il est député depuis 2017, représentant la 2e circonscription du département du Nord. Bernalicis est connu pour ses vues progressistes et anti-establishment, défendant la justice sociale, la durabilité environnementale et les droits des travailleurs. Il critique ouvertement les mesures d'austérité et les politiques néolibérales, et participe activement à divers mouvements sociaux. Bernalicis est considéré comme une figure clé de La France Insoumise et a contribué à façonner son programme politique."
 FRA_Florence_Parly_IntelM:0 "Florence Parly"
 FRA_Florence_Parly_IntelM_desc:0 "Florence Parly, née le 8 mai 1963, est une femme politique française qui a occupé plusieurs postes ministériels au sein du gouvernement français. Elle est membre du parti La République En Marche ! (LREM) et une proche alliée du président Emmanuel Macron. Parly est ministre des Armées depuis 2017, supervisant la politique militaire et de défense de la France. Elle a participé aux efforts de modernisation de l'armée française et de renforcement des capacités de défense du pays. Parly est connue pour son expertise en matière de défense et son engagement à garantir la sécurité de la France dans un environnement international de plus en plus complexe."
 FRA_Sebastien_Lecornu_IntelM:0 "Sébastien Lecornu"
 FRA_Sebastien_Lecornu_IntelM_desc:0 "Sébastien Lecornu, né le 11 juin 1986, est un homme politique français qui a occupé plusieurs postes ministériels au sein du gouvernement français. Il est membre du parti La République En Marche ! (LREM) et un proche allié du président Emmanuel Macron. Lecornu est ministre des Outre-mer depuis 2018, supervisant les territoires d'outre-mer de la France. Il était auparavant secrétaire d'État auprès du ministre de la Transition écologique et solidaire, où il se consacrait aux questions environnementales et de durabilité. Lecornu est connu pour son approche pragmatique du gouvernement et ses efforts pour relever les défis spécifiques auxquels sont confrontés les territoires d'outre-mer."
 FRA_Bertrand_de_La_Chesnais_IntelM:0 "Bertrand de La Chesnais"
 FRA_Bertrand_de_La_Chesnais_IntelM_desc:0 "Bertrand Marie Joseph Houitte de La Chesnais est un ancien général de division de l'armée française et un homme politique français membre du parti conservateur Rassemblement National. Il est connu pour ses vues conservatrices et nationalistes, prônant des politiques d'immigration plus strictes, des frontières plus solides et la préservation de l'identité culturelle française. De La Chesnais a participé à la politique locale dans la commune de Bretteville-l'Orgueilleuse, en Normandie. Il a également été candidat à diverses élections locales et régionales, représentant le programme du Rassemblement National."
 FRA_Alexis_Corbiere_IntelM:0 "Alexis Corbière"
 FRA_Alexis_Corbiere_IntelM_desc:0 "Alexis Corbière, né le 17 août 1968, est un homme politique français et membre du parti de gauche La France Insoumise. Il est député depuis 2017, représentant la 7e circonscription du département de la Seine-Saint-Denis. Corbière est connu pour ses vues progressistes et anti-establishment, défendant la justice sociale, les droits des travailleurs et la durabilité environnementale. Il critique ouvertement les politiques néolibérales et participe activement à divers mouvements sociaux. Corbière est considéré comme une figure clé de La France Insoumise et a contribué à façonner son programme politique."
 FRA_Gerard_Longuet_IntelM:0 "Gérard Longuet"
 FRA_Gerard_Longuet_IntelM_desc:0 "Gérard Longuet, né le 24 février 1946, est un homme politique français qui a occupé plusieurs postes ministériels au sein du gouvernement français. Il est membre du parti Les Républicains (LR) et sénateur depuis 2011, représentant le département de la Meuse. Longuet fut ministre de la Défense et des Anciens Combattants de 2011 à 2012 sous la présidence de Nicolas Sarkozy. Il est connu pour ses vues conservatrices et son expertise en matière de défense et de sécurité. Longuet est une figure éminente de la vie politique française et a participé aux efforts de réforme de l'armée française et de réponse aux défis sécuritaires."
 FRA_Michele_Alliot_Marie_IntelM:0 "Michèle Alliot-Marie"
 FRA_Michele_Alliot_Marie_IntelM_desc:0 "Michèle Alliot-Marie, née le 10 septembre 1946, est une femme politique française qui a occupé plusieurs postes ministériels au sein du gouvernement français. Elle est membre du parti Les Républicains (LR) et députée depuis 2002, représentant le département des Pyrénées-Atlantiques. Alliot-Marie fut ministre de la Défense, de l'Intérieur, de la Justice et des Affaires étrangères dans divers gouvernements sous les présidents Jacques Chirac et Nicolas Sarkozy. Elle est connue pour ses vues conservatrices et sa fermeté sur les questions de sécurité et de défense. Alliot-Marie est une figure éminente de la vie politique française et a participé à l'élaboration de la politique étrangère du pays."
 FRA_Philippe_Olivier:0 "Philippe Olivier"
 FRA_Philippe_Olivier_desc:0 "Philippe Olivier, né le 2 décembre 1957, est un homme politique français membre du parti conservateur Rassemblement National. Il est connu pour ses vues conservatrices et nationalistes, prônant des politiques d'immigration plus strictes, des frontières plus solides et la préservation de l'identité culturelle française. Olivier a participé à la politique locale dans la région des Hauts-de-France et a été candidat à diverses élections locales et régionales, représentant le programme du Rassemblement National. Il est aussi connu pour avoir été le beau-frère de Marine Le Pen, la dirigeante du Rassemblement National."
 FRA_Bernard_Emie:0 "Bernard Emié"
 FRA_Bernard_Emie_desc:0 "Bernard Emié est un diplomate français qui a occupé divers postes de haut rang au sein du gouvernement français. Il est depuis 2017 le directeur général de la Direction générale de la sécurité extérieure (DGSE), l'agence de renseignement extérieur de la France. Emié a un parcours dans le renseignement et a participé à l'élaboration des politiques et des stratégies de renseignement françaises. Il est connu pour son expertise en matière de renseignement et son rôle dans la coordination des efforts de renseignement au service de la sécurité nationale française. Son mandat à la tête de la DGSE a coïncidé avec une période d'intensification des défis sécuritaires pour la France, notamment les menaces terroristes et les cyberattaques."
 FRA_Jean_Messiha:0 "Jean Messiha"
 FRA_Jean_Messiha_desc:0 "Jean Messiha, né le 14 avril 1970, est un homme politique franco-égyptien et membre du parti d'extrême droite Rassemblement National. Il est connu pour ses vues conservatrices et nationalistes, prônant des politiques d'immigration plus strictes, des frontières plus solides et la préservation de l'identité culturelle française. Messiha a participé à diverses campagnes politiques et critique ouvertement les partis politiques traditionnels. Il est également connu pour ses déclarations controversées sur les réseaux sociaux et dans la presse. Sa carrière politique a été marquée par ses efforts pour promouvoir le programme du Rassemblement National et par son soutien à Marine Le Pen, la dirigeante du parti."
 FRA_Younous_Omarjee:0 "Younous Omarjee"
 FRA_Younous_Omarjee_desc:0 "Younous Omarjee, né le 14 octobre 1969, est un homme politique français et député européen depuis 2009. Il est membre du parti de gauche La France Insoumise et siège au sein du groupe parlementaire de la Gauche unitaire européenne/Gauche verte nordique (GUE/NGL). Omarjee est connu pour ses vues progressistes et pro-européennes, défendant la justice sociale, les droits des travailleurs et la durabilité environnementale. Il a participé activement à la promotion de politiques de l'UE bénéfiques aux travailleurs et aux communautés marginalisées. Omarjee est considéré comme une figure clé de La France Insoumise et a contribué à façonner ses positions sur les questions européennes."
 FRA_Philippe_Susnjara:0 "Philippe Susnjara"
 FRA_Philippe_Susnjara_desc:0 "Philippe Susnjara est un officier subalterne de l'armée française, expert en sécurité de la défense et en renseignement."
