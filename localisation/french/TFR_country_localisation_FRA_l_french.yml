 FAF_republican_officers_dynamic:0 "Mouvement Républicain"
 FAF_republican_officers_dynamic_desc:0 "\n\n\n\n\n£GFX_FRA_revolution\n\n\n\n\n\n\n\nSocialistes, « conservateurs » démocrates, libéraux, athées. Une force insidieuse issue de la république corrompue subsiste dans notre corps d'officiers, rebelle et prête à renverser le Royaume à la première occasion. Jusqu'à ce que nous ayons démasqué ses meneurs et les ayons chassés de nos forces armées, nous aurons du mal à exécuter des manœuvres sophistiquées autrement que de façon désordonnée."
 FAF_republican_officers_movement_squabble_dummy_idea:0 "Mouvement Républicain"
 FAF_republican_officers_movement_idea:0 "Mouvement Républicain"
 FAF_replacing_republicans_dummy_idea:0 "Mouvement Républicain"
 FAF_republican_officers_movement_dummy_idea:0 "Mouvement Républicain"
 FAF_royal_pretenders_dynamic:0 "Prétendants royaux"
 FAF_royal_pretenders_dynamic_desc:0 "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\nMalgré notre ancienne revendication, qui remonte à la maison de Valois, les usurpateurs orléanistes et bonapartistes combattent notre pouvoir divin depuis l'ombre ; nous devons régler ce problème avant qu'il ne dégénère."
 FAF_royal_pretenders_idea:0 "Prétendants royaux"
 FAF_royal_pretenders_dummy_idea:0 "Prétendants royaux"
 FAF_royal_pretenders_squabble_dummy_idea:0 "Prétendants royaux"
 FAF_royal_pretenders_sway_nobility_dummy_idea:0 "Prétendants royaux"
 FAF_nobility_taking_money_tt:0 "§CLa noblesse§! prélèvera une grosse somme d'argent à la banque nationale tous les 3 mois, en échange de la stabilité du royaume."
 FAF_dieu_veut_idea:0 "Dieu Veut"
 FAF_dieu_veut_idea_desc:0 "\n\n\n\n\n£GFX_FAF_deus_vult\n\n\n\n\n\n\n\nLa volonté de Dieu et la volonté de la nation sont derrière nous, et derrière nos soldats. Nous combattons pour la cause juste, une cause sainte et divine. Tandis que nos hommes avancent, ils doivent savoir qu'ils sont, eux, le peuple de France, les plus grands qui aient jamais vécu. Quand l'artillerie gronde et qu'ils affrontent des hordes sauvages à l'Est, ils doivent savoir qu'ils suivent l'esprit de notre Seigneur. Dieu Veut !"
 FAF_euro_navy_annexation_tt:0 "Par la négociation diplomatique, les commandements navals européen, pacifique et atlantique sont prêts à se joindre à notre bataille contre l'hégémonie communiste soviétique."
 FAF_lafayette_order_cat:0 "Le Nouvel Ordre"
 FAF_lafayette_order_cat_desc:0 "\n\n\n\n\n£GFX_FAF_lafayette_category\n\n\n\n\n\n\n\nLes Allemands nous ont laissés tomber, ils ont laissé mourir nos fils... et ils attendent encore notre soumission dans cette guerre à venir ? \nLes communistes et les Allemands travaillent contre la France... Ils saignent nos jeunes garçons et notre industrie pour nous affaiblir... Et pour quoi ? \nPour nous §RPRENDRE§! les territoires d'Alsace et de Lorraine ? \nPour §RIMPLANTER§! le communisme germanique dans notre glorieuse France ? \nNous ne pouvons qu'imaginer ce qu'ils feraient une fois que nous serions faibles, mais ce jour ne viendra jamais tant que nous suivrons notre grand leader §C« Lafayette »§!"
 FAF_showcase_superiority_decision:0 "Démontrer la supériorité française"
 FAF_showcase_superiority_decision_desc:0 "Nous sommes supérieurs, nous le savons. Nos idéaux, notre mode de vie, notre histoire, notre peuple... Tout a été porté à la perfection comme le vin le plus éloquent, et pourtant le monde continue de refuser de reconnaître notre ÉVIDENTE supériorité !"
 fra_constant_showboating:0 "Frimes permanentes"
 FAF_superiority_cost_tt:0 "Pour chaque allié que nous avons, nous perdrons 5 de puissance politique"
 FAF_kill_villiers_tt:0 "§RUne pièce de moins sur l'échiquier de l'ancien ordre§!"
 FAF_purge_unpatriots_from_military_decision:0 "Épurer l'armée des antipatriotes"
 FAF_embelish_german_betrayal_decision:0 "Le coup de poignard allemand"
 FAF_melenchon_die_linke_israel_axis_decision:0 "Signaler le complot §pMelenchon§!-§RDie Linke§!-§CIsrael§!"
 FAF_melenchon_die_linke_israel_axis_decision_desc:0 ""
 FAF_the_puppeteers_of_DAY_X_decision:0 "Les VRAIS marionnettistes du « Jour X »"
 FAF_the_puppeteers_of_DAY_X_decision_desc:0 "L'Allemagne, après des décennies d'antinationalisme, se transforme du jour au lendemain en pays fasciste après avoir perdu une guerre contre la Russie ? NOUS AVONS COMBATTU POUR NOTRE GOUVERNEMENT, NOUS AVONS COMBATTU POUR CHASSER LES COMMUNISTES ! L'ALLEMAGNE, elle, les a simplement balayés sous le tapis dans ses manigances strassériennes-communistes et NOUS SAVONS TOUS qui en profite quand les Allemands doivent acheter des armes et contracter des emprunts..."
