 Capital_of_the_EU:0 "La capitale de l'Europe"
 Capital_of_the_EU_desc:0 "Bruxelles est plus qu'une ville : c'est le cœur administratif du projet européen. Dans ses bureaux, ses salles de conseil et ses anonymes bâtiments de verre, les réglementations sont rédigées, les compromis forgés et les crises gérées au jour le jour. Des dizaines de milliers de fonctionnaires, diplomates, lobbyistes et conseillers parcourent ses rues, transformant la gouvernance locale en enjeu continental. Les décisions prises ici se répercutent sur les marchés, les frontières et les institutions, souvent bien avant que le public n'en prenne connaissance. Cette concentration du poids politique apporte influence et ressources, mais aussi examen minutieux, inertie et pression. Bruxelles doit concilier son rôle de ville d'accueil avec sa fonction de centre nerveux de l'Europe, où stabilité, coordination et continuité sont plus prisées que la vitesse ou le spectacle."
