 FPR_utopia_category:0 "Destination §pUtopie§!"
 TFR_utopia_scripted_gui_desc:0 "Didier Daeninckx a promis au peuple français une utopie bâtie sur les principes du socialisme, et il compte tenir cette promesse.\n\nPour atteindre notre objectif, nous devons §Yréformer nos lois§! et §Yaméliorer le développement§! de notre nation afin d'atteindre les standards de l'utopie.\n\nCela prendra peut-être de nombreuses années de travail acharné, mais lorsque nous aurons enfin accompli notre tâche, nous pourrons déclarer au peuple du monde :\n\n§GL'utopie est réelle, elle s'appelle la France et elle est socialiste§!."
