 FRA_regionalist_struggle_idea:0 "Lutte régionaliste"
 FRA_regionalist_struggle_idea_desc:0 "Alors que la France tente de reconstruire une fois de plus son identité par la force, le régionalisme se répand partout dans le pays. \n\nBien que presque anéanties pendant la Révolution française, de nombreuses identités régionales ont survécu, mais à peine. Depuis lors, ces identités ont lutté pour préserver leurs traditions culturelles et leur langue, mais avec la création d'une conscience européenne plus large et l'abandon subséquent de tout ce qui fait de la France la France, ces régionalistes ont une dernière chance de faire valoir leur culture distincte avant qu'elle ne sombre dans les livres d'histoire."
