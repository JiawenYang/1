 FAF_provincial_improvement_modifier:0 "Priorité provinciale"
 FAF_improve_gallarum_decision:0 "Reconstruire la §GGalliarum§!"
 FAF_improve_gallarum_decision_desc:0 "Bien que la Galliarum, que la plupart appellent la France du Nord, ait eu l'avantage d'être notre région la plus développée, elle n'a pas été épargnée par les horreurs de la guerre civile. Déjà touchée par les bombardements russes lors de la guerre à l'Est, la Galliarum a été mise hors d'état de fonctionner tandis que les vautours libéraux et communistes la pillaient de tout ce qu'elle possédait. Maintenant que nous avons les ressources pour le faire, nous devons entreprendre la reconstruction de toute la région. Sans cela, non seulement nos capacités industrielles ne suffiront pas à unifier notre précieuse Europe, mais cela garantira aussi que les subversifs pourront exploiter les difficultés de notre peuple pour le radicaliser et le pousser à l'insurrection."
 FAF_improve_viennensis_decision:0 "Reconstruire la §OViennensis§!"
 FAF_improve_viennensis_decision_desc:0 "Pour la région où César commença sa civilisation des Gaules, la Viennensis (plus communément appelée France du Sud) avait longtemps été en difficulté, avant même que la guerre civile ne déchire notre nation. Manquant d'une grande partie du développement économique de notre nord, ces régions sont en proie à la pauvreté et sont donc devenues des foyers de radicaux qui souhaitent replonger notre nation dans le chaos. Comme il est de notre devoir envers le peuple de notre chère France, nous devons entreprendre un vaste effort de revitalisation pour garantir que la Viennensis renaisse de ses cendres tel un phénix !"
 FAF_improve_hispanarium_decision:0 "Reconstruire l'§YHispanarium§!"
 FAF_improve_hispanarium_decision_desc:0 "Notre réunification avec nos frères du sud des Pyrénées signifie que nous avons hérité des dommages de leur seconde guerre civile. Comparés à nos frères de France et d'Italie, nous devons comprendre que la reconstruction doit tenir compte de la multitude d'identités régionales qui traversent les territoires d'Espagne, et ne pas reproduire nos erreurs de la Guerre péninsulaire. Cela demandera peut-être un effort considérable, mais nous n'en ferons pas moins pour aucun descendant de Rome !"
 FAF_improve_italiae_decision:0 "Reconstruire l'§RItaliae§!"
 FAF_improve_italiae_decision_desc:0 "Autrefois le cœur battant de l'Europe. Autrefois le phare d'espoir qui apporta un âge d'or de progrès, de lumières et de prospérité. Mais depuis la chute de l'Empire romain d'Occident au Ve siècle, l'Italie n'a jamais vraiment retrouvé la splendeur qu'elle possédait dans l'Antiquité. C'est donc à nous qu'il revient de reconstruire la péninsule, libérée des échecs d'une démocratie libérale décrépite, afin qu'elle puisse enfin retrouver des sommets qui feraient rougir Auguste lui-même. On dit que Rome ne s'est pas construite en un jour, mais si sa gloire brille encore éternellement, nos efforts recevront le temps et l'attention nécessaires pour poursuivre cet héritage."
 FAF_Quadrilingual_Unification_dyanmic:0 "La langue des frères"
 FAF_Quadrilingual_Unification_dyanmic_desc:0 "La plus grande honte de l'histoire européenne post-romaine est peut-être le lent et douloureux déclin du latin. Ce qui servait autrefois de force unificatrice pour tout l'empire n'est plus utilisé que par le clergé catholique comme langue officielle. Cela n'aide pas que des siècles de division après la chute de Rome aient fait dégénérer le latin en langues romanes séparées. Dans le cadre de nos efforts pour unifier le continent européen, nous devons entreprendre le laborieux travail de ramener le latin au rang de lingua franca courante. Bien que nos frères romans soient disposés à cet effort, nous devons nous rappeler que, comme Rome, l'adoption massive du latin ne se fera pas en un jour."
 FAF_Quadrilingual_Unification_idea:0 "La langue des frères"
 FAF_Language_of_the_State_decision:0 "Abroger la langue d'État"
 FAF_Language_of_the_State_decision_desc:0 "L'un des principaux obstacles à l'adoption du latin par notre peuple est que nous avons une langue nationale, le français. Cela peut choquer nos classes dirigeantes et politiques, mais retirer son statut privilégié et le mettre sur un pied d'égalité avec nos langues légales reconnues pourrait être un bon motivateur pour que nos citoyens adoptent le latin. De plus, cela peut aider à garantir que, lorsque l'Europe sera enfin unie, notre bannière n'apparaisse pas comme un simple cas d'impérialisme français."
 FAF_managerial_bilingualism_decision:0 "Bilinguisme des cadres"
 FAF_managerial_bilingualism_decision_desc:0 "L'une des principales justifications de notre renaissance du latin est l'idée que, lorsque nous unifierons les peuples d'Europe, il pourra servir de lingua franca permettant, malgré nos différences, une gouvernance fluide. Dans cet esprit, nous devons veiller à ce que nos classes dirigeantes chargées des tâches bureaucratiques soient au moins bilingues, dans leur langue maternelle et en latin. D'ailleurs, ne serions-nous pas hypocrites si nous n'utilisions pas nous-mêmes la langue de nos précieux ancêtres romains ?"
 FAF_the_failures_of_AH_decision:0 "Les échecs de l'[AUS.GetFlag] Autriche-Hongrie [HUN.GetFlag]"
 FAF_the_failures_of_AH_decision_desc:0 "L'un des principaux problèmes de l'Empire austro-hongrois était la mauvaise gouvernance de ses minorités culturelles : bien qu'elles fussent européennes, elles étaient soumises à une domination culturelle exercée par les Autrichiens qui les gouvernaient. Nous ne pouvons en aucun cas reproduire cet exemple de l'histoire. Nous devons trouver des solutions communes à nos problèmes et œuvrer, en tant que grand peuple de toute la France, vers un objectif qui puisse nous apporter réconfort."
 FAF_Academic_Latinization_decision:0 "Latinisation académique"
 FAF_Academic_Latinization_decision_desc:0 "Autant nous pouvons déclarer que notre peuple « doit apprendre le latin pour le bien de l'Europe » et qu'il fera son devoir patriotique, autant ce processus sera difficile dans l'état actuel de l'enseignement. Au-delà des études de langues, les cours qui enseignent correctement le latin ne sont pas obligatoires, et les programmes s'appuient sur les langues régionales, ce qui incite peu à apprendre la langue au-delà d'un niveau élémentaire. Cela exigera une refonte académique massive, mais nous devons réunir nos meilleurs érudits latins pour aider à rédiger un nouveau programme garantissant que le latin soit enseigné et utilisé à fond par notre peuple. Plus important encore, si la jeunesse est notre avenir, un tel système signifie qu'il ne faudra peut-être que quelques décennies pour que le latin redevienne courant en Europe !"
 FAF_our_ancestral_battlefield_decision:0 "Nos champs de bataille ancestraux"
 FAF_our_ancestral_battlefield_decision_desc:0 ""
 FAF_the_roman_way_decision:0 "La voie romaine"
 FAF_the_roman_way_decision_desc:0 "Quand on interroge sur Rome, beaucoup diront que c'était un empire vaste et puissant, mais peu savent vraiment ce qui a fait la grandeur de Rome. N'importe quelle nation médiocre peut bâtir un empire, mais ce qui distinguait Rome, c'était sa volonté inébranlable, forgée dans le sang et la boue. En tant qu'héritiers de Rome, notre destin est de rebâtir ce qui fut perdu, détruit et oublié il y a des siècles. L'aigle romain planera de nouveau au-dessus de l'Europe, de l'Ibérie à l'Italie, et ses cris résonneront dans les cieux européens."
 FAF_enforce_imperial_language_decree_decision:0 "Décret sur la langue impériale"
 FAF_enforce_imperial_language_decree_decision_desc:0 "Italien, espagnol et français — trois langues distinctes, mais toutes issues des mêmes racines : le latin. Leur mère à toutes, aujourd'hui presque oubliée et abandonnée par ses propres enfants. Sans langue unifiée, notre Rome deviendrait comme la tour de Babel — une construction creuse alimentée par le chaos et la folie. Une fois encore, le latin sera la langue des hommes civilisés, des frères de sang, des Romains."
 FAF_demand_spanish_unification_decision:0 "Exiger [SNS.GetFlag] l'unification espagnole"
 FAF_demand_spanish_unification_decision_desc:0 "Imaginer un instant que les beaux maquis et les bois luxuriants de l'Ibérie faisaient autrefois partie de notre prospère Empire romain remplit forcément d'orgueil et de joie. Pourtant tout cela semble si lointain, dans un passé révolu mort avec nos ancêtres. Nous et les Espagnols avons eu nos différends tout au long de notre histoire commune, mais le sang qui coule dans nos veines nous lie finalement. Nous étions faits pour être amis et frères, non ennemis. Les Espagnols l'ont peut-être oublié, mais nous le leur rappellerons."
 FAF_demand_italian_unification_decision:0 "Exiger [ITA.GetFlag] l'unification italienne"
 FAF_demand_italian_unification_decision_desc:0 "Une famille est incomplète sans tous ses membres, et pour la famille romaine, l'Italie en est un irremplaçable. Après tout, où est née la notion même de Rome ? Sans l'Italie, notre Rome serait incomplète — une simple imitation creuse fabriquée par des charlatans et des imposteurs. Rome sans Rome, c'est comme un petit-déjeuner sans café ni cigarette — cela semble totalement faux. C'est pourquoi nous devons faire voir notre vision aux Italiens. Nous devons..."
 FAF_demand_portuguese_unification_decision:0 "Exiger [GOD.GetFlag] l'unification portugaise"
 FAF_demand_portuguese_unification_decision_desc:0 ""
