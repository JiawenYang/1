 FAF_EUN_army_of_purity_dummy:0 "L'Hégémonie européenne"
 FAF_EUN_army_of_purity_dummy_desc:0 "En tant qu'identitaires, notre mouvement diffère du continuum habituel de l'extrême droite européenne en ce qu'il soutient l'unification continentale plutôt que les seules nations qui la composent. Face à l'implosion de l'Union européenne sous les coups des hordes de l'Est, une occasion de combler le vide de pouvoir et de s'imposer comme hégémon de l'Europe s'est présentée. Maintenir notre influence nous coûtera peut-être politiquement, mais être le nouveau centre du continent est essentiel pour garantir notre triomphe sur les forces du multiculturalisme, du libéralisme et sur celles qui cherchent à détruire notre chère Europe !"
 FAF_EU_unification_campaigns_idea:0 "Campagne d'unification hégémonique"
 FAF_EU_unification_campaigns_idea_desc:0 "Dans notre croisade pour unir toute l'Europe, nous devons tenir compte du fait que notre unification diffère de celles proposées par les anciens fédéralistes de l'Union européenne. Notre campagne vise à former une {{color|cyan|Hégémonie européenne}} qui cherche à unir le continent, mais sous une hégémonie qui protège ses peuples et ses cultures plutôt que d'extraire la richesse pour des élites technocratiques. Pour l'année à venir, nous avons consacré d'immenses ressources à garantir la réussite de cette campagne et à nous permettre de débarrasser le continent de toute influence étrangère !"
 FAF_europeanism_idea:0 "Européanisme"
 FAF_europeanism_idea_desc:0 "L'européanisme appelle l'Europe à rester unie tout en préservant les identités nationales et les cultures régionales. L'Europe divisée ne peut résister aux puissances mondiales ; des forces armées unies nous permettent de réduire le nombre de systèmes d'armes en service et, avec une langue commune, de recruter sur un continent de près d'un demi-milliard d'habitants."
 FAF_bastille_tt:0 "Notre siège du centre de commandement majeur et du dépôt d'armes de Verdun nous sera rapporté."
