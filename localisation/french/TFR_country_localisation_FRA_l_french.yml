 FPR_socialist_bastion_dynamic_desc:0 "Bastion du socialisme"
 FAF_Nationalize_the_Wine_and_Olive_Industries:0 "Nationaliser la filière vinicole et oléicole"
 FAF_Nationalize_the_Wine_and_Olive_Industries_desc:0 "En matière de produits culturels, la France est célèbre pour ses exportations de vin et d'olives. À l'heure actuelle, la plupart de ces industries sont entre des mains privées et donc exposées à l'influence d'agents étrangers. Si nous les nationalisons, nous pourrons non seulement sécuriser des fonds supplémentaires pour notre régime, mais aussi garantir que ces produits restent la fierté et la joie de la France !"
