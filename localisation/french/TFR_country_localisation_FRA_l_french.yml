 FRA_Disloyal_Military_idea:0 "Armée déloyale"
 FRA_Disloyal_Military_idea_desc:0 "Malgré tous nos efforts, notre relation avec les Forces armées françaises laisse à désirer. Un mélange de nos politiques, d'un manque de dialogue et de l'état de notre politique étrangère a conduit beaucoup de membres de notre armée à mépriser notre gouvernement. À moins de corriger ces problèmes, nous devons nous attendre à des mutineries et à des généraux conspirant contre nous. Ces conflits d'intérêts font aussi craindre qu'un coup d'État ne soit imminent, ce qui pourrait changer à jamais le cours de l'histoire de France."
 FRA_Disloyal_Military_Zemmour_idea:0 "Armée déloyale"
 FRA_Disloyal_Military_Zemmour_idea_desc:0 "Malgré tous leurs efforts, notre relation avec le Gouvernement laisse à désirer. L'armée a été écartée de l'État et, désormais, beaucoup dans nos rangs en viennent à mépriser notre gouvernement. Avec Zemmour, le gouvernement continuera même après un coup d'État ouvert contre l'establishment démocratique."
