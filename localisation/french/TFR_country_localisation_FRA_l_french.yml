 FRA_covid_idea_1:0 "Covid faible"
 FRA_covid_idea_1_desc:0 "La pandémie étrangère de COVID-19 a atteint le continent européen sans sembler devoir s'arrêter. La propagation rapide du virus met à rude épreuve les systèmes d'urgence et le gouvernement français, tandis que des comités et des commissions réunissant scientifiques et responsables de la Nation sont formés afin de combattre la progression de la COVID-19 aussi rapidement qu'elle s'est répandue dans le pays.\n\n§RSi la situation n'est pas résolue, les conséquences seront catastrophiques pour la Nation.§!"
 FRA_covid_idea_2:0 "Covid léger"
 FRA_covid_idea_2_desc:0 "La pandémie étrangère de COVID-19 a atteint le continent européen sans sembler devoir s'arrêter. La propagation rapide du virus met à rude épreuve les systèmes d'urgence et le gouvernement français, tandis que des comités et des commissions réunissant scientifiques et responsables de la Nation sont formés afin de combattre la progression de la COVID-19 aussi rapidement qu'elle s'est répandue dans le pays.\n\n§RSi la situation n'est pas résolue, les conséquences seront catastrophiques pour la Nation.§!"
