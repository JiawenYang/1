 FRA_anti_islamism:0 "Manifestations anti-islamistes"
 FRA_anti_islamism_desc:0 "Étant donné que l'afflux de réfugiés du Moyen-Orient n'a fait que gonfler après le déclenchement de la guerre civile saoudienne, le nombre de manifestations contre ces groupes a explosé. Si les idéologies qu'ils professent varient, ces groupes partagent la conviction que ces demandeurs d'asile doivent se voir refuser l'entrée principalement en raison de leurs croyances religieuses. Bien que ces mouvements restent davantage liés à la droite de notre vie politique, nous devons trouver de meilleurs moyens d'intégrer ou de contrôler le rythme de l'immigration, sous peine de voir ces manifestations devenir des outils de radicalisation qui sapent la foi du public dans nos sacrées institutions démocratiques."
 FRA_Oil_Crisis:0 "Crise pétrolière"
 FRA_Oil_Crisis_desc:0 "Avec la guerre civile saoudienne, la péninsule Arabique a perdu la stabilité empruntée qu'elle avait atteinte et a plongé le sous-continent dans une insécurité et une instabilité encore plus grandes. La conclusion immédiate de la guerre civile ne semble pas imminente et les effets se font déjà sentir. La possibilité d'obtenir du pétrole auprès d'un autre fournisseur n'est pas actuellement à notre portée, car la Russie et le Venezuela sont tous deux sous embargo des nations occidentales et il nuirait à notre image internationale de contourner ces embargos. Jusqu'à ce que nous sécurisions une source fiable de pétrole, nous continuerons de subir les effets de la conquête du pouvoir par les Saoudiens."
 FRA_SNCF_expansion_idea:0 "Expansion de la SNCF"
 FRA_SNCF_Privatization_idea:0 "Privatisation de la SNCF"
 FRA_Civil_War:0 "Bataille pour l'esprit français"
 FRA_Civil_War_desc:0 "L'âme de la France est soutenue par un fier héritage de prouesse révolutionnaire. La propagande glorifie l'État et réprime la dissidence, car la lutte pour définir l'avenir de notre nation a permis à notre peuple de revisiter notre combat contre les bureaucrates mondialistes et de le rétablir sur son piédestal."
 FRA_Civil_War_Buffs:0 "Bataille pour l'âme française"
 FRA_Civil_War_Buffs_desc:0 "L'âme de la France est portée par un fier héritage de valeur révolutionnaire. La propagande glorifie l'État et réprime la dissidence, car la lutte pour définir l'avenir de notre nation a permis à notre peuple de revisiter notre combat contre les bureaucrates mondialistes et de le rétablir sur son piédestal."
