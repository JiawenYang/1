 FAF_sword_decision:0 "Levons nos épées"
 FAF_shield_decision:0 "Levons nos boucliers"
 FRA_bulwark_of_european_conservatism:0 "Rempart du conservatisme occidental"
 FRA_bulwark_of_european_conservatism_desc:0 "L'Occident a longtemps été corrompu lentement par les influences libérales, contrôlant les médias, contrôlant les élites, mais le peuple a parlé par ses votes ici en France contre cela, et nous avons atteint nos objectifs en remettant la France sur la bonne voie. Nous constituons un rempart des valeurs occidentales, des anciennes valeurs occidentales. Nous sommes les héritiers de De Gaulle, de Churchill, d'Adenauer ; ces grands disparus sont des figures conservatrices de partis qui ont depuis longtemps abandonné leurs idéaux. Mais nous avons aujourd'hui fait revivre ce conservatisme classique au cœur de la civilisation occidentale, et depuis les remparts nous le répandrons vers l'extérieur, des murs du rempart aux terrains de rassemblement et au-delà. L'Europe se souviendra de son passé et l'embrassera. Elle se souviendra d'un passé où l'économie prospérait, où les familles étaient nombreuses et où l'avenir était radieux. Et nous aurons de nouveau cela."
 FRA_a_conservative_france:0 "Triomphe du traditionalisme"
 FRA_a_conservative_france_desc:0 "La tradition fait une nation ; il n'y a pas de nation sans son histoire, sa religion et sa langue. Nous savons qui nous sommes : nous sommes les Français, un peuple fier qui fut à un moment ou à un autre le peuple dominant dans tous les domaines. La guerre, la science, l'art, la littérature. Nous sommes bons dans tout ce que nous entreprenons, et c'est cette tradition d'excellence qui a engendré notre socle orgueilleux, les fondements de la société française étant intrinsèquement dans les accomplissements de notre peuple. Les europhiles voudraient que nous mettions cela de côté, pour fondre la France en une petite partie d'un grand tout européen ; or nous sommes l'une de ses plus grandes parties. Nous ne verrons jamais l'Europe comme notre identité, nous ne verrons que la France. Le Rassemblement National gardera l'État sur la bonne voie, Le Pen et ses alliés institueront une révolution conservatrice au Parlement en obtenant une majorité aux prochaines élections, et une France imprégnée de tradition sera la récompense ultime de nos efforts : un peuple dévot, attaché à la famille et travailleur. Nous ne le promeuvrons pas seulement ici, mais dans toute l'Europe. Toute l'Europe mérite d'apprécier son passé."
 FRA_disregard_liberalism_decision:0 "Ignorer les alliés libéraux"
 FRA_prioritize_coalition_stability:0 "Prioriser l'unité de la coalition"
 FRA_prioritize_coalition_stability_desc:0 "Nous devons nous tempérer : la domination politique absolue est peu susceptible de durer, et nous ne tomberons pas dans le piège d'une République à parti unique. Toutes les parties de notre Grande Nation doivent participer à sa grandeur ; le Rassemblement National dirigera, mais chacun, de Zemmour à Mélenchon, doit être considéré comme un allié dans le combat contre la stagnation. Maintenir la coalition ensemble garantit une France stable ; faire tanguer le bateau en misant davantage sur notre populisme ne pourrait qu'empirer les choses et aliéner une partie substantielle de la population. Jouons de façon intelligente et équitable, il n'y a aucune raison de nous consolider. Les démocraties pluralistes sont ce qu'elles sont pour de bonnes raisons."
 FRA_pluto_rises:0 "Pluton ascendant"
 FRA_pluto_rises_desc:0 "Macron aspirait à être Jupiter, il a échoué. C'est acceptable, nous savons mieux désormais. Stéphane Séjourné a fait avancer Renaissance ; le fougueux libéral a fermement uni le centre et la gauche de la politique française contre Le Pen et le Rassemblement National. On croyait Renaissance morte, mais Séjourné est vraiment devenu Pluton, le ranimateur des sondages morts, le dieu des outsiders. Si Séjourné n'est pas un maître des enfers comme Pluton le suggérerait, il a sorti la France de l'Enfer et la livrera au paradis, sous la conduite de Renaissance et de ses alliés ; Pluton monte vers la présidence. Face à la crise, nous ne reculerons pas comme Monsieur Jupiter : Séjourné doit être un visage souriant et avenant dans les médias et sur le terrain. Un président actif, non quelque homme mystérieux dans une haute tour qui fait les choses à mots couverts."
 FRA_demand_snap_elections_liberal:0 "Exiger des élections anticipées"
 FRA_demand_snap_elections_liberal_desc:0 "Nous avons fait tout ce que nous pouvions sous la conduite de Stéphane Séjourné ; un visage jeune, plus jeune que Macron même, est devenu populaire. De plus en plus de gens dans la rue réclament des élections anticipées. Nos efforts ont enlisé la présidence de Le Pen dans la controverse et la stagnation ; nous avons une chance de reprendre le pouvoir au Rassemblement National et de manœuvrer la France vers le droit chemin avant qu'il ne soit trop tard. Il suffit de tirer la détente et d'exiger de laisser le peuple parler."
 FRA_capitalize_on_conservative_blunders:0 "Tirer parti des bourdes"
 FRA_capitalize_on_conservative_blunders_desc:0 "Notre contrôle des médias ne saurait être sous-estimé : les médias financés par l'UE et étrangers sont de notre côté, et avec notre appareil médiatique national, nous pouvons mettre en évidence chaque bourde du Rassemblement National et la faire traîner pendant des semaines. Chaque tragédie triviale sera disséquée sans relâche, chaque faux pas et chaque mot mal prononcé critiqués. Nous inventerons des alertes santé à partir d'un simple bégaiement ou d'une boiterie ; c'est prédateur et impopulaire chez certains, mais celui qui contrôle les médias contrôle l'opinion publique, et Le Pen a fait un piètre travail pour séduire nos magnats des médias. M. Séjourné, en revanche, ce jeune homme au visage frais, fait un carton d'audience et est une figure pittoresque pour une Renaissance rénovée."
 FRA_the_golden_lambda:0 "La Lambda dorée"
 FRA_the_golden_lambda_desc:0 "Ah, les identitaires, ce sont vraiment des visionnaires. Le nationalisme français à l'époque moderne est... à courte vue, même Bardella doit s'y résigner. À l'époque de Napoléon, où un Européen sur cinq était français, nous avions la population pour nous proclamer puissance à part entière ; dans un monde où les nations comptent des milliards et des centaines de millions d'âmes, nous sommes une goutte dans la flaque européenne, plus petits que les Turcs, que les Allemands. Mais nous ne sommes pas seulement français, nous sommes les fils de Rome, les fils des Latins. De la Wallonie à la Dacie, de Lisbonne à Syracuse, la race latine est encore une force forte et nombreuse ; ensemble nous sommes 150 millions, nous sommes de nouveau une puissance à nous, et la vision d'un avenir où les Latins peuvent être de nouveau unis, menés par la France, n'est pas totalement insensée. Napoléon tenta de faire renaître la Francia de ses cendres précisément pour cela, et l'Union européenne moderne a rapproché l'Espagne et l'Italie de nous plus que jamais. Bien que nous méprisions Macron et ses épouses de Bruxelles, nous voyons la valeur de l'Europe s'unissant, et en embrassant la Lambda dorée des identitaires, nous pouvons envisager un avenir où peut-être les Latins seront unis, même si l'Europe restera à jamais divisée en elle-même. Plus de guerres entre frères, nous aurons l'unité des Latins contre tous les autres."
 FRA_rabid_anti_slavicism:0 "Combattre les hordes slaves"
 FRA_rabid_anti_slavicism_desc:0 "Les damnés Slaves sont une insulte à nos valeurs, même lorsqu'ils prétendent les embrasser. Chaque démocratie slave de foi orthodoxe est tombée dans la corruption ou dans une autocratie anocratique : il n'y a plus de Liberté, plus d'Égalité, pas même de Fraternité. Eltsine était un ivrogne décadent, Poutine un serpent souriant, et son successeur Medvedev un chien de meute enragé mordant furieusement l'Occident. Quel que soit son sort, tous les Russes sont les mêmes. Traîtres depuis le Système continental, jouant sur les deux tableaux, traîtres pendant la Seconde Guerre mondiale, traîtres dans toutes nos affaires avec eux. Il ne s'agit pas seulement de combattre, mais d'en finir avec la question de la puissance russe. Aucun avenir n'existe pour nous dans un monde où la Russie joue les Gengis avec ses voisins. Alors jouons les Napoléon."
 FRA_rabid_anti_liberalism:0 "Antilibéralisme enragé"
 FRA_rabid_anti_liberalism_desc:0 "Nous avons piégé la Gauche, piégé les Russes, tout est en place. Nous avons trouvé notre bouc émissaire. Une page de l'histoire a été prise et copiée, les notes orchestrales jouées en une belle symphonie. Le crépitement des mitrailleuses d'AK12 russes déchire cinq groupes différents en cinq endroits différents, une incision chirurgicale destinée à couper les Libéraux du Cabinet, les gauchistes épargnés à dessein pour renforcer la ruse ; la musique est un arrangement de sons organisés, ceci a été un chef-d'œuvre à la Bardella. Depuis le siège du Rassemblement national, on entend faiblement les corps frapper le pavé. Notre opposition a peur, le cabinet de Macron est désormais mort ; il ne reste que des gauchistes ou ceux qui nous sont loyaux. Bardella prépare son discours pour qualifier le massacre d'horrible tragédie — en vérité ? C'est notre strophe finale. La conclusion de notre grande pièce. Personne n'acceptera la demande de former un gouvernement avec Macron, personne sauf nous, nous y veillerons. Nous lui donnerons la majorité dont il a besoin, un sauveur en ces temps de terreur gauchiste et d'implication russe... jusqu'à ce que nous l'écartions à la prochaine élection."
 FRA_socialism_with_french_characteristics:0 "Le socialisme à la française"
 FRA_socialism_with_french_characteristics_desc:0 "Après une bataille de plusieurs siècles — commencée en 1789 et enfin achevée aujourd'hui — il existe en France un gouvernement qui est véritablement pour son peuple. Il existe un système qui leur donne le pouvoir, qui leur donne la vraie liberté et leur offre une vie heureuse et bonne. Après sa lutte contre l'autoritarisme et la droite, la France, dans sa Sixième République, est véritablement libre.\n\nC'est pour de bon!"
 FRA_invite_apla_military_advisors:0 "Inviter des conseillers américains"
 FRA_invite_apla_military_advisors_desc:0 "Bien que ce soit une décision extrêmement controversée et critiquée, la guerre civile américaine et sa fin sont un objectif crucial pour la France et pour l'OTAN dans son ensemble. Naturellement, les plus proches de nos objectifs de socialisme libre et démocratique sont l'Armée populaire de libération américaine, même s'il existe certaines factions opposées en son sein. Nous autoriserons le transfert de conseillers d'un pays à l'autre et les reconnaîtrons comme le gouvernement légitime des États-Unis."
 FRA_detente_with_PRC:0 "Détente orientale"
 FRA_detente_with_PRC_desc:0 "Une partie de notre faiblesse actuelle vient de notre rejet de la République populaire de Chine. Comme on l'a vu dans l'effondrement des Amériques, puis dans l'effondrement économique soudain de l'OTAN dans son ensemble, nous devons regarder chaleureusement vers l'Est si nous voulons devenir une nation durable et puissante. En outre, ils sont nos frères dans le combat pour le Peuple ; il n'est pas nécessaire de continuer à contrarier la Chine unique."
 FRA_french_military_hegemony:0 "Hégémonie militaire française"
 FRA_french_military_hegemony_desc:0 "De Villers a pleinement fait renaître le pouvoir militaire de la France : l'armée est plus nombreuse qu'elle ne l'a été depuis cinquante ans, le peuple la soutient, l'industrie sert les besoins de l'État et surtout de l'armée. Nous sommes préparés à la guerre en temps de paix parce que nous savons sagement ce qui vient. L'Europe est notre amie, nos partenaires idéologiques ; notre armée est tenue de défendre non seulement la France, mais les Polonais fermes, les Baltes robustes, les Roumains exaltés ; c'est notre devoir et notre privilège d'être les Forces armées du Monde libre. La France peut vraiment dire qu'elle est l'Hégémon, une armée d'une telle supériorité en nombre, en taille et en équipement que les analystes militaires nous observeront en action dans chaque nation de chaque continent pendant le siècle à venir ; le Dieu de la Guerre vit aujourd'hui à Paris, que le malheur soit pour nos ennemis et la joie pour nos amis."
 FRA_skewer_the_bear:0 "Empaler l'ours"
 FRA_skewer_the_bear_desc:0 "La Russie est une bête, un ours en hibernation, mais regardez-le s'engraisser pendant que nous attendons mollement qu'il s'éveille et nous avale tout entiers. D'autres nations peuvent avoir peur d'elles-mêmes, mais les Français sont fiers de leur passé. Si l'Europe ne se tourne pas vers la Russie, alors la France seule prendra la lance et fera un nouveau tapis pour le Palais présidentiel. Nous avons fait des préparatifs, mais nous pouvons en faire plus. Mobilisons la presse, mobilisons les médias, montrons à la France quel genre de peuple nous affrontons : des gens ivres et sans esprit, haïssant la liberté, contents de rester sous un Tsar, enveloppé de rouge ou non, tant qu'un homme tient fermement les rênes. Ils brandissent le pétrole au-dessus de nos têtes comme on prive un prisonnier d'eau."
 FRA_neo_imperialism:0 "La présidence impériale"
 FRA_neo_imperialism_desc:0 "Nous avons si longtemps perdu notre gloire et été moqués que nous avons presque entièrement perdu notre chemin. Même Le Pen a cédé et trahi l'armée — sans De Villers ? Nous nous serions dégradés davantage, tout vestige d'Empire qui nous restait aurait été jeté aux chiens. Nous sommes le protecteur de l'Europe, de la France et de l'Afrique de l'Ouest ; nous sommes l'Épée du Libre, le Bouclier de la Liberté, et sous De Villers nous sommes de nouveau une puissance capable d'aller à l'étranger, d'intervenir selon nos propres termes. Nous ne sommes pas un Empire mais nous sommes une Présidence, et notre Président est un héros national."
 FRA_jupiter_rising:0 "Gloire de Jupiter"
 FRA_jupiter_rising_desc:0 "La grandeur est à portée de nos mains et nous avons œuvré à assurer notre destin au cours des années passées. Il devient évident que, pour que notre destin s'accomplisse et que nous soyons vainqueurs des périls à venir, une France forte ne suffira pas. Macron a prouvé maintes fois non seulement ce dont la France a besoin, mais que l'Europe a besoin d'un leader fort, qui ne craint ni les institutions politiques, ni les médias, ni la bureaucratie, et qui est prêt à se battre pour nous. Macron a conduit victorieusement la France sur la voie de la réforme et du progrès, avec des résultats produisant une force et des bénéfices écrasants — et cela malgré la bureaucratie et les agitateurs qui souhaitent voir notre grandeur s'achever.\n\nMacron montrera à l'Europe et au reste du monde la supériorité de la nation française ainsi que sa capacité à aider ses voisins et alliés par-delà les mers. Macron montrera à la menace russe qu'elle ne peut pas intimider et piétiner l'Europe comme elle l'a fait jadis. Macron saura quelle force et quelle puissance l'Europe réclame depuis de Gaulle et Napoléon, et il forgera son propre héritage à l'image de ces grands hommes.\n\nNous ne les laisserons pas voler notre grandeur."
 FRA_absorb_volt:0 "Absorber Volt"
 FRA_absorb_volt_desc:0 "Intégrer le parti Volt Europa dans notre gouvernement garantira non seulement que notre gouvernement reste fort et uni, mais aussi que l'Union européenne fasse de même. Nous pouvons utiliser Volt pour pousser à une fédéralisation plus poussée du continent européen tout en renforçant nos liens avec Bruxelles. La France montrera les forces et les opportunités qu'une Europe unie peut apporter aux peuples du continent et du monde entier."
 FRA_reaffirm_our_majority:0 "Réaffirmer notre majorité"
 FRA_reaffirm_our_majority_desc:0 "Avec une coalition couronnée de grands succès, nous avons enfin réalisé une coalition décisive dévouée à l'amélioration du peuple français. Tandis que libéraux et conservateurs engagent un dialogue et une coopération convenables, il devient évident que les radicaux et les extrémistes préféreraient s'en abstenir. Nous utiliserons ce pouvoir nouveau pour pousser une politique centriste et des réformes décisives pour une France forte ; en veillant à rester forts face à la menace russe et à garantir que l'extrême gauche et l'extrême droite n'aient aucune place dans notre gouvernement."
 FRA_clash_of_civilizations:0 "Le choc des civilisations"
 FRA_clash_of_civilizations_desc:0 "L'Europe et l'Est : depuis les jours de Baudouin, la France a compris sa place de puissant État croisé, dressé contre le Sarrasin et les hordes orientales. Nous avons tous senti le nœud se resserrer autour de nos cous ; l'invasion musulmane de nos foyers est venue quand les portes furent ouvertes par des traîtres libéraux assis dans leurs tours de Bruxelles. Nous avons enfin fermé ces portes et, devant elles, nous ne voyons que barbarie au-delà. La menace orientale à Moscou a embrassé ces fondamentalistes islamiques pour ses propres fins, utilisant la Biélorussie pour faire entrer massivement des migrants en Pologne depuis la Syrie sauvage ; nous avons vu la dernière vague et ce qu'elle a fait, apportant le viol à nos banlieues et le crime à nos ruelles. L'Islam est une religion et une culture incompatibles avec la France et, de fait, avec l'Europe ; les conflits à venir en Afrique, au Moyen-Orient et en Europe de l'Est nous obligeront à nous armer pour la marée montante. Une Grande Lutte existe pour notre peuple et notre culture, une lutte contre les Mongols de Moscou et les hordes musulmanes ; si nous obtenons une victoire durable, nous regarderons vers un avenir radieux empreint de tradition, la domination européenne fermement ancrée."
 FRA_the_camus_bloc:0 "Embrasser le bloc Camus"
 FRA_the_camus_bloc_desc:0 "Renaud Camus est un identitaire de la vieille garde, un penseur idéologique de longue date ; dans les années 80 il était socialiste, mais aujourd'hui ? Il fut le leader du mouvement identitaire français avant son interdiction injuste sous le gouvernement Macron. Camus a écrit le livre sur Le Grand Remplacement, littéralement, mais contrairement à beaucoup il ne se soucie pas de l'antisémitisme, il est ouvertement homosexuel, et demeure pourtant à la tête d'un mouvement d'extrême droite. Beaucoup à droite, y compris parmi les juifs, et même parmi le Rassemblement national plus modéré, ont défendu par le passé les théories de Camus ; c'est avec grand plaisir qu'Éric Zemmour invite Camus à reformer son parti pour rejoindre la coalition au pouvoir. Lui et ses amis sont antidémocrates ; nous n'irons pas jusqu'à arrêter la démocratie, mais nous utiliserons leur soutien pour attirer les votes de ce genre de personnes qui évitent habituellement les élections « par principe »."
 FRA_emulate_the_trump_doctrine:0 "Le trumpisme français"
 FRA_emulate_the_trump_doctrine_desc:0 "Donald J. Trump : certains lui reprochent l'effondrement de l'Amérique, Zemmour le voit comme un sauveur tragique venu trop tard. Comme Zemmour, il accepte que l'Amérique soit inondée et souhaite fermer le robinet de l'immigration ; on n'a pas besoin d'être raciste pour vouloir se préserver, pourquoi est-il mal de souhaiter que les immigrants prospèrent... mais chez eux ? Le trumpisme se définit par l'anti-immigration, une législation pro-business, le nationalisme civique, la diplomatie du gros bâton et l'isolationnisme militariste. La France peut s'approprier toutes ces idées à son usage et, heureusement, la tentative de Zemmour de les mettre en œuvre ne provoquera pas un effondrement national ! Nous allons rendre à la France sa grandeur !"
 FRA_liberte_m_warning_tt:0 "§CSi l'arbre de Macron n'est pas achevé d'ici avril 2022, nous perdrons l'élection et serons privés de §!§RLiberté§!§C jusqu'à notre retour au pouvoir.§!"
