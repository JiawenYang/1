 FRA_yellow_vests_idea_4_desc:0 "\n\n\n\n£GFX_FRA_yellow_vest_banner\n\n\n\n\n\nLe ralentissement économique français a durement frappé les travailleurs : hausse des prix du carburant, coût de la vie élevé et inégalités croissantes menacent leur niveau de vie. Pendant ce temps, une charge fiscale disproportionnée pèse sur les classes populaires et moyennes. En mai 2018, une pétition a recueilli près d'un million de signatures, déclenchant des manifestations qui se poursuivent depuis près de deux ans.\nLes manifestations, symbolisées par les gilets jaunes, ont rassemblé l'extrême gauche et l'extrême droite dans une opposition au néolibéralisme. Les manifestants ont bloqué des routes, érigé des barricades et défilé lors de grandes manifestations.\nLa violence s'est intensifiée : les villes connaissent des troubles, des affrontements avec la police et des dégâts matériels considérables. La cote d'approbation de Macron a chuté de plus de 20 pour cent. Ces manifestations pourraient marquer un tournant dans la politique française — un éloignement du libéralisme au profit d'une montée de l'extrémisme."
 FRA_negotiations_fail_idea:0 "Échec à la table des négociations"
 FRA_negotiations_fail_idea_desc:0 "Avec les radicaux des Gilets jaunes, il devient évident qu'une solution coopérative à leurs manifestations et émeutes incessantes est impossible. Leurs émeutes implacables et la destruction continue de la France durent depuis trop longtemps. Notre gouvernement élabore de nouvelles solutions pour écraser rapidement ces radicaux, mais d'ici là, la France devra voir sa capitale déchiquetée et incendiée."
 FRA_faith_in_the_goverment:0 "Confiance envers le gouvernement"
 FRA_faith_in_the_goverment_desc:0 "Par un revirement surprenant, le gouvernement a décidé que sa priorité était celle du peuple français. Les discussions avec les Gilets jaunes se sont conclues par l'acceptation de toutes les conditions posées par le mouvement. Si cette décision déplaît aux conservateurs de notre gouvernement, elle a été approuvée à la majorité en raison de la situation désespérée dans laquelle la France est tombée. Cette mesure radicale a conduit le mouvement à cesser ses protestations, qui se sont muées en célébrations dans toute la France pour les nouvelles réformes."
