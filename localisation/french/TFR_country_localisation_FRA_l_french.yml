l_french:
 FRA_the_french_armed_forces:0 "L'état des forces armées"
 FRA_the_french_armed_forces_desc:0 "Au terme de notre vaste examen décennal des Forces armées françaises, les rapports qui en ressortent sont inquiétants. Nos forces armées ont été sous-financées et accusent un retard par rapport à nos alliés européens. Devant ces nouvelles troublantes, nos généraux exigent de notre administration qu'elle agisse immédiatement. Heureusement, notre gouvernement a officiellement entériné une augmentation du budget des Forces armées françaises de plus de quatorze millions d'euros, ce qui permettra à notre armée de se moderniser au tournant de la décennie.\n\nNotre armée ne restera pas à la traîne en un pareil moment et, pour la sécurité et la réussite de la France, il est plus que jamais temps d'agir. La France retrouvera la distinction et l'honneur qu'elle possédait lorsqu'elle était la puissance militaire de l'Europe."
 FRA_unify_the_DSGE_DSGI:0 "Unifier la DGSI et la DGSE"
 FRA_unify_the_DSGE_DSGI_desc:0 "Nous entrons dans une ère nouvelle pour notre nation, une ère où nous avons besoin d'un lien plus profond entre nos services de renseignement intérieur et extérieur, et donc... la DGSN, ou Direction générale de la sécurité nationale, servira à nous protéger à l'intérieur comme à l'extérieur."
 FRA_dsgn_creation_tt:0 "Une fois cette réforme achevée, nous créerons la §CDirection générale de la sécurité nationale, ou DGSN§!"
 FRA_the_french_airforce:0 "Repenser notre armée de l'air"
 FRA_the_french_airforce_desc:0 "Notre armée de l'air a sans conteste été l'une des branches les plus négligées des Forces armées françaises, les progrès réalisés pour moderniser notre flotte aérienne actuelle étant réduits au minimum. Nous employons actuellement plusieurs entreprises aéronautiques, comme Dassault Aviation, afin de mettre au point des solutions capables de porter l'armée de l'air française jusqu'à l'ère moderne, avec des niveaux de supériorité et de puissance jamais vus auparavant. Grâce à ces efforts, il ne faudra pas longtemps avant que la France ne règne sur les cieux."
 FRA_the_race_for_the_fifth_generation_fighter:0 "Un chasseur français de 5e génération"
 FRA_the_race_for_the_fifth_generation_fighter_desc:0 "Grâce aux récentes percées de la division aéronautique de notre recherche et développement, nous avons enfin l'occasion tant attendue de faire progresser la prochaine génération de notre armée de l'air. Le chasseur français de cinquième génération est l'un des concepts les plus avancés que nous ayons vus et nous devons en tirer parti. La France sera pionnière dans le futur de la guerre aérienne dès que nous dévoilerons au reste du monde ce chasseur de cinquième génération à la pointe de la technologie."
 FRA_ramp_up_the_production_of_the_Dassalut_Rafale:0 "Produire le Rafale en série"
 FRA_ramp_up_the_production_of_the_Dassalut_Rafale_desc:0 "Le Rafale a toujours bien servi notre armée et, avec quelques ajustements çà et là et un généreux financement accordé à Dassault, nous pourrons en très peu de temps lancer la production de série de nos chasseurs. Compte tenu des performances et des capacités exceptionnelles dont le Rafale a fait preuve, nous devrions pouvoir surpasser en production l'armée de l'air russe d'ici la fin de la décennie, si tout se déroule comme prévu."
 FRA_conduct_major_improvments:0 "Aiguiser l'expertise aérienne"
 FRA_conduct_major_improvments_desc:0 "Non seulement notre armée de l'air accuse un retard technologique, mais nos professionnels, pour dire les choses simplement, ont perdu la supériorité qui faisait autrefois la renommée de notre aviation. La solution a été d'engager une refonte complète du programme aérien actuel de l'armée de l'air française, en corrigeant les défauts et le déclin progressif que nous avons subis pendant des années, pour nous engager plutôt sur la voie d'une amélioration graduelle de notre aviation, qui s'élèvera au-dessus de la concurrence."
 FRA_deveop_domestic_drones:0 "Développer nos capacités nationales"
 FRA_deveop_domestic_drones_desc:0 "Afin de parvenir à l'autonomie et de réduire notre dépendance à l'égard des sources extérieures, la France donnera la priorité au développement de capacités nationales dans l'industrie de la défense, en favorisant l'innovation et la collaboration pour bâtir une base solide capable de soutenir une armée de pointe."
 FRA_expand_our_airfields:0 "Accroître nos capacités aériennes à l'Est"
 FRA_expand_our_airfields_desc:0 "Reconnaissant l'importance géopolitique du théâtre oriental, la France renforcera stratégiquement ses capacités aériennes dans la région en déployant des ressources supplémentaires, en établissant des bases avancées et en menant des exercices conjoints avec les nations alliées."
 FRA_aerial_defense:0 "Améliorer le SAMP/T"
 FRA_aerial_defense_desc:0 "Le système de missiles Sol-Air Moyenne Portée Terrestre sert la France, en tant que principal système de défense aérienne, depuis sa création la décennie dernière. Afin de garantir l'efficacité maximale et la défense aérienne sûre que la France mérite, nous avons chargé les concepteurs originaux du SAMP/T de remanier et d'actualiser ce système de défense antimissile. À mesure que la guerre aérienne se développe et évolue, nos capacités à nous défendre doivent faire de même."
 FRA_aerial_offense:0 "La dernière frontière"
 FRA_aerial_offense_desc:0 "L'espace a toujours été considéré comme le véritable objectif final de toute grande nation désireuse d'aller au-delà de ce que l'on jugeait humainement possible. Il est temps de montrer au monde que la France aspire à plus que ce que beaucoup nous croient capables d'accomplir. La France ouvrira son propre programme spatial et, en temps voulu, nous aurons notre drapeau sur la Lune aux côtés d'autres grandes puissances, comme les États-Unis. Le monde comprendra bientôt que la France régnera sur les étoiles, comme le destin l'a voulu."
 FRA_the_french_navy:0 "Réformer les pratiques navales françaises"
 FRA_the_french_navy_desc:0 "La flotte navale française est l'une des rares branches à avoir tenu le coup au fil des années, mais elle a néanmoins désespérément besoin d'être réformée. Notre fierté, le De Gaulle, fait pâle figure face aux porte-avions américains ou britanniques de notre époque. Nous devons nous mettre au diapason, faute de quoi la Marine nationale commencera à s'essouffler et à prendre du retard, handicapant gravement notre influence mondiale."
 FRA_upgrade_our_submarine_fleet:0 "Moderniser notre flotte sous-marine"
 FRA_upgrade_our_submarine_fleet_desc:0 "Reconnaissant le rôle crucial des sous-marins dans la guerre navale moderne, la France lancera une importante modernisation de sa flotte sous-marine, en développant des sous-marins de nouvelle génération dotés de technologies de pointe afin de conserver une capacité sous-marine sans égale."
 FRA_develop_our_home_ports:0 "Agrandir les ports existants"
 FRA_develop_our_home_ports_desc:0 "Pour répondre aux besoins évolutifs de notre flotte navale et renforcer nos capacités logistiques, la France entreprendra une initiative stratégique visant à agrandir les ports existants, en améliorant les infrastructures navales afin de faciliter les mouvements efficaces de la flotte et de soutenir des opérations maritimes durables."
 FRA_conduct_neccesary_improvments:0 "Mener des manœuvres navales pan-méditerranéennes"
 FRA_conduct_neccesary_improvments_desc:0 "Il n'est pas de meilleur moment pour préparer notre flotte, alors que nos politiques de méditerranéisme sont pleinement en vigueur. Avec les efforts accrus de la France pour coopérer avec ses alliés méditerranéens, nous devons être plus proactifs afin de favoriser l'unité et un lien étroit avec nos homologues. Nous avons récemment invité les flottes italienne, espagnole et grecque à mener des exercices navals pour stimuler nos flottes et les préparer à tous les scénarios possibles que nous pouvons prévoir. Pour garantir notre succès sur les mers, il est nécessaire de travailler en étroite collaboration avec les autres grandes flottes de la Méditerranée."
 FRA_smaller_boat_stuff:0 "Cap maintenu"
 FRA_smaller_boat_stuff_desc:0 "Maintenir la stabilité et la continuité de nos capacités de défense est primordial. En mettant l'accent sur un entraînement régulier, l'entretien du matériel et la disponibilité opérationnelle dans toutes les branches des forces armées, la France entend garantir une posture de défense fiable et redoutable."
 FRA_begin_the_project_for_the_new_carrier_flagship:0 "Remplacer le De Gaulle"
 FRA_begin_the_project_for_the_new_carrier_flagship_desc:0 "Consciente de l'évolution de l'aéronavale, la France engagera le remplacement du porte-avions Charles de Gaulle. Ce projet ambitieux vise à mettre en service un porte-avions moderne et polyvalent, équipé des technologies les plus récentes et capable de projeter la puissance sur toutes les mers, en jouant un rôle central dans la sauvegarde des intérêts maritimes français et de l'influence stratégique mondiale."
 FRA_A_Strong_France_is_a_Strong_Europe:0 "Une armée indépendante"
 FRA_A_Strong_France_is_a_Strong_Europe_desc:0 "Pendant trop longtemps, la bureaucratie inutile et la politisation de l'OTAN ont privé la France d'innombrables heures et de l'efficacité de ses forces armées. Il est désormais temps pour la France de tracer sa propre voie vers la grandeur, sans que ses ressources et son budget soient dilapidés. La France prouvera, non seulement à ses voisins européens mais au monde entier, qu'elle est non seulement autonome, mais aussi l'une des grandes puissances militaires du globe."
 FRA_Through_Europe_we_are_Strong:0 "Par l'Europe, nous sommes forts"
 FRA_Through_Europe_we_are_Strong_desc:0 "L'Europe a toujours été plus forte unie qu'elle ne l'a été divisée, comme en témoignent d'innombrables exemples tout au long de notre histoire, de la Seconde Guerre mondiale à la guerre mondiale contre le terrorisme. Il est donc temps de comprendre que plus nous restons séparés, plus nous nous affaiblissons, tandis que les Russes ne deviennent que plus instables et imprévisibles. Nous enverrons un message, non seulement à travers le continent mais au monde entier : l'Europe restera toujours unie, quoi qu'il arrive, en ces temps d'instabilité mondiale et de radicalisme. "
 FRA_Support_a_Pan_European_Military:0 "Soutenir le méditerranéisme"
 FRA_Support_a_Pan_European_Military_desc:0 "La mer Méditerranée a toujours présenté des avantages stratégiques non seulement pour notre nation, mais pour toute l'histoire de l'Europe, plusieurs grands empires et nations étant issus de la région. Les Romains, les Macédoniens et même les Carthaginois ont tous régné sur le monde connu depuis la Méditerranée. Pour la réussite de l'Europe, nous devons prendre en compte l'importance stratégique de la Méditerranée et des nations qui la bordent, comme nos alliés espagnol, italien et grec, en les soutenant autant que possible politiquement et même économiquement."
 FRA_Support_Western_Mediterrenian_Militaries:0 "Créer des budgets militaires coopératifs"
 FRA_Support_Western_Mediterrenian_Militaries_desc:0 "Dans le cadre de nos efforts pour coopérer davantage avec nos alliés européens, nous avons constitué une commission avec les Britanniques, les Allemands et les Italiens afin d'élaborer un budget efficace garantissant un maximum de rendement. Avec cette collaboration accrue avec nos alliés européens, il est évident que nous partageons tous des aspirations et des objectifs similaires. Pour que l'Europe réussisse en cette nouvelle ère, nous devons rester unis face à l'incertitude et coopérer partout où nous le pouvons."
 FRA_Further_Eurail_Integration:0 "Renforcer l'intégration Eurail"
 FRA_Further_Eurail_Integration_desc:0 "Afin d'améliorer la mobilité européenne et l'efficacité militaire, la France plaidera en faveur d'une intégration plus poussée des réseaux Eurail. L'amélioration de l'interopérabilité, de l'efficacité logistique et des capacités de déploiement rapide des troupes contribuera à une infrastructure de défense européenne plus souple et plus réactive."
 FRA_Heart_of_the_European_Navy:0 "Pacte d'unification navale méditerranéenne"
 FRA_Heart_of_the_European_Navy_desc:0 "Cherchant à renforcer la sécurité maritime régionale, la France poursuivra un pacte d'unification navale avec les nations méditerranéennes. Cette initiative vise à coordonner les opérations navales, le partage du renseignement et les exercices conjoints, afin de constituer un front uni contre les menaces maritimes en Méditerranée."
 FRA_Revive_Latin_Bloc_Militarism:0 "Pacte d'unification du commandement méditerranéen"
 FRA_Revive_Latin_Bloc_Militarism_desc:0 "Afin de renforcer la stabilité régionale, la France recherchera un pacte d'unification du commandement avec les nations méditerranéennes, en harmonisant les structures de commandement militaire et en facilitant la planification de réponses conjointes rapides aux menaces potentielles dans le théâtre méditerranéen."
 FRA_Western_Mediterrenian_Mechanization:0 "Développer la technologie de mécanisation"
 FRA_Western_Mediterrenian_Mechanization_desc:0 "La mécanisation de l'infanterie française a été l'un des changements les plus radicaux de notre armée à l'époque moderne. Pour assurer la réussite de notre infanterie, nous continuerons de privilégier les avancées en matière de véhicules mécanisés, tels que nos véhicules blindés de transport de troupes et nos véhicules de combat d'infanterie. La forme moderne de la guerre telle que nous la connaissons sera conquise par l'innovation française et les progrès de notre technologie."
 FRA_Strengthen_the_SNCF:0 "Agrandir la SNCF"
 FRA_Strengthen_the_SNCF_desc:0 "Reconnaissant le rôle central des transports dans la logistique militaire, la France agrandira la Société nationale des chemins de fer français, en développant les infrastructures ferroviaires, en améliorant la connectivité et en assurant la mobilisation efficace des troupes et des ressources à travers tout le pays."
 FRA_Privatize_the_SNCF:0 "Privatiser la SNCF"
 FRA_Privatize_the_SNCF_desc:0 "Afin de renforcer l'efficacité et l'innovation dans le transport ferroviaire, la France poursuivra la privatisation de la SNCF, en introduisant la dynamique du marché, en favorisant la concurrence et en améliorant la performance globale du secteur ferroviaire au service d'un réseau de transport plus souple et plus adaptable."
 FRA_Industrialize_the_countryside:0 "Militarisation des campagnes"
 FRA_Industrialize_the_countryside_desc:0 "Afin de renforcer les capacités de défense nationale et d'accroître notre résilience, la France lancera un programme de militarisation des campagnes, en intégrant la présence militaire et les infrastructures dans les zones rurales, garantissant ainsi une posture de défense répartie et robuste, capable de répondre efficacement aux menaces sur l'ensemble du territoire national."
 FRA_Create_Independent_Military_Strategies:0 "Élaborer des stratégies militaires indépendantes"
 FRA_Create_Independent_Military_Strategies_desc:0 "Après notre récent effort pour détacher notre armée du commandement intégré de l'OTAN, nous devons désormais travailler à concevoir de nouvelles stratégies permettant à notre armée d'opérer par ses propres moyens, sans l'aide de nos alliés européens. La France reprendra la direction de sa propre armée et montrera au reste de l'Europe que nous nous portons mieux sans elle, et que nous sommes même plus capables lorsqu'on ne nous entrave pas avec un commandement militaire incohérent."
 FRA_A_New_Age_of_Heavy_Tanks:0 "Moderniser les chars lourds"
 FRA_A_New_Age_of_Heavy_Tanks_desc:0 "Pour conserver notre supériorité blindée, la France engagera un vaste programme de modernisation des chars lourds, en dotant les flottes de chars existantes de technologies avancées afin qu'elles demeurent à la pointe des capacités de guerre blindée."
 FRA_Deploy_Moving_Castles:0 "Naissance des « Châteaux itinérants »"
 FRA_Deploy_Moving_Castles_desc:0 "Introduisant un concept révolutionnaire de défense mobile, la France verra se développer des unités hautement mobiles et lourdement blindées, capables d'un déploiement rapide et d'une réponse efficace aux scénarios dynamiques du champ de bataille."
 FRA_Independence_from_the_Eurail:0 "S'affranchir d'Eurail"
 FRA_Independence_from_the_Eurail_desc:0 "Afin de garantir la liberté de mouvement et l'indépendance logistique, la France s'emploiera à réduire sa dépendance aux réseaux Eurail pour le transport militaire, en développant des moyens de transport alternatifs, en renforçant la mobilité stratégique et en consolidant notre capacité à mener des opérations militaires indépendantes."
 FRA_Expand_Domestic_Capabilities:0 "Renforcer les entreprises d'armement nationales"
 FRA_Expand_Domestic_Capabilities_desc:0 "Thales Group, PGM, MBDA et Renault sont depuis des décennies des fabricants d'armement de longue date qui approvisionnent les Forces armées françaises depuis l'après-guerre. Il revient désormais à notre gouvernement de faire sa part et d'encourager notre armée à s'approvisionner en équipements et en armes auprès de nos productions nationales, plutôt que de dépendre excessivement du matériel international."
 FRA_Rejuvinate_Recruitment_Centers:0 "Redonner vie aux centres de recrutement"
 FRA_Rejuvinate_Recruitment_Centers_desc:0 "Afin de maintenir une force militaire qualifiée et motivée, la France redonnera vie à ses centres de recrutement, en modernisant les procédures d'enrôlement, en renforçant la communication et en offrant des incitations propres à attirer les meilleurs talents au service des forces armées."
 FRA_Research_and_Development:0 "Accroître les investissements en R&D militaire"
 FRA_Research_and_Development_desc:0 "Consciente de l'impératif de supériorité technologique, la France augmentera sensiblement ses investissements dans la recherche et le développement militaires, en stimulant l'innovation, en favorisant la création de technologies de défense de pointe et en veillant à ce que nos forces armées restent à l'avant-garde des capacités militaires."
 FRA_Second_times_a_Charm:0 "Au nom du peuple"
 FRA_Second_times_a_Charm_desc:0 "Nous avons remporté la présidentielle, Marine Le Pen est à la tête de la France : un message fort adressé à la Renaissance libérale et à l'Union européenne. Nous avons été élus au nom du peuple pour accomplir un mandat. Un mandat très important. Offrir au peuple une France ordonnée, puissante et équilibrée. Restaurer les traditions françaises et restreindre les politiques d'ouverture de Macron et de ses alliés. Nous exécuterons ce mandat pour la France, nous tempérerons nos radicaux, nous rendrons la France sûre, forte et fière à nouveau."
 FRA_Fight_Party_Radicals:0 "Combattre le radicalisme du parti"
 FRA_Fight_Party_Radicals_desc:0 "Certains éléments du Rassemblement national demeurent bel et bien des vestiges de la clique du père : avant l'ère Marine, il y avait l'ère Jean-Marie, le père de Marine. Le Rassemblement national était alors véritablement ce que ses critiques d'aujourd'hui disent qu'il est devenu, mais certains membres du parti ne reconnaissent pas qu'ils sont des reliques d'un passé qu'il faudrait oublier. Marine Le Pen a élargi les horizons du parti et l'a conduit vers un nouvel avenir ; ceux qui restent plus proches du Rassemblement national des années 80 doivent être écartés et poussés à la retraite. Nous ne nous excuserons jamais pour notre passé, mais nous devons regarder vers l'avenir."
 FRA_Protect_French_Interests:0 "La realpolitik américaine"
 FRA_Protect_French_Interests_desc:0 "L'Amérique a toujours mené une grande politique au sommet de sa puissance : parler fort et tenir un gros bâton. La France se trouve sur un continent de rivaux idéologiques résolus à détruire leur propre fierté nationale et à nous imposer la même destruction. Pour nous affirmer dans le monde, nous qui ne sommes qu'une petite partie de l'UE, nous devons tenir un très gros bâton et parler très fort. En Afrique, en Europe et au-delà, nous devons faire connaître notre présence et dire clairement que la France de l'avenir est destinée à être comme la France du passé : forte et influente à l'échelle mondiale. Nous ne serons pas relégués au rôle de second violon de l'Allemagne dans une quelconque fédération européenne ; nous serons un État fort et souverain !"
 FRA_National_Unity_Government:0 "Proclamer un gouvernement d'unité nationale"
 FRA_National_Unity_Government_desc:0 "Ce n'est pas parce que nous sommes politiquement opposés que nous ne pouvons pas tous œuvrer à la prospérité de la France : les libéraux peuvent être utiles par leurs relations d'affaires, les socialistes affirment au moins se soucier du peuple ; rien ne nous empêche d'inviter nos opposants à se coaliser avec nous ! La France est plus forte unie que divisée, c'est vrai de toute nation et, en vérité, de toute chose. Un gouvernement d'unité nationale dans le sillage de la pandémie, de la crise pétrolière et de l'effondrement de l'Amérique : il n'y a pas de meilleur moment pour la France de réunir ses efforts politiques autour de la prospérité et du développement. Qui s'y opposerait ? Seul un idéologue traître, un homme de parti avant d'être un Français."
 FRA_Law_and_Order:0 "Politiques de « loi et d'ordre »"
 FRA_Law_and_Order_desc:0 "Une photo atterrit sur le bureau devant Le Pen, glissée hors d'une chemise en carton. Un enfer flamboyant au premier plan de l'Arc de Triomphe, une voiture renversée et brûlée, des manifestants en noir et gilets jaunes qui acclament, et si l'on regarde bien, un cocktail Molotov s'envole, quittant le cadre vers une ligne de police. Le Pen a toujours été dégoûtée par la violence des manifestants. Ils prétendent défendre l'ouvrier, mais ils brûlent sa voiture et saccagent son lieu de travail, comme des animaux. Assez de ces absurdités. Nous vous avons entendus avant que vous ne commenciez à brûler vivants nos policiers ; nous rédigerons dans les jours à venir une législation que certains qualifieront de draconienne, mais pour nous ? Pour Le Pen ? Pour le pauvre malheureux qui possédait cette voiture ? C'est raisonnable, et il était grand temps de mettre un terme aux millions de dégâts matériels publics et privés dont ces voyous sont responsables."
 FRA_Set_Immigration_Limit:0 "La France d'abord"
 FRA_Set_Immigration_Limit_desc:0 "L'OTAN et l'Union européenne sont des choses précieuses, mais rien ne doit être ni ne peut être plus précieux que sa patrie. La France ne peut pas passer après des intérêts internationaux, les entreprises françaises ne peuvent pas perdre sur le sol français face à des affaires étrangères. La France possède déjà les forces armées les plus puissantes d'Europe et pourtant cela ne suffit pas encore ; nous deviendrons plus forts. Nos forces et notre économie grandiront. L'Europe ne pourra plus compter sur des renflouements français ou sur des véhicules français : laissez l'Allemagne vendre sa flotte de chars à l'étranger, nous garderons nos Leclerc et doublerons leur nombre. La France, avant tout, doit être préparée, économiquement, militairement et mentalement. Si nous ne le sommes pas, alors aucune nation d'Europe ne le sera. En ces temps, nous devons assumer le rôle de berger tandis que l'Amérique sauvage se déchire."
 FRA_France_First:0 "La France d'abord"
 FRA_France_First_desc:0 "L'OTAN et l'Union européenne sont des choses précieuses, mais rien ne doit être ni ne peut être plus précieux que sa patrie. La France ne peut pas passer après des intérêts internationaux, les entreprises françaises ne peuvent pas perdre sur le sol français face à des affaires étrangères. La France possède déjà les forces armées les plus puissantes d'Europe et pourtant cela ne suffit pas encore ; nous deviendrons plus forts. Nos forces et notre économie grandiront. L'Europe ne pourra plus compter sur des renflouements français ou sur des véhicules français : laissez l'Allemagne vendre sa flotte de chars à l'étranger, nous garderons nos Leclerc et doublerons leur nombre. La France, avant tout, doit être préparée, économiquement, militairement et mentalement. Si nous ne le sommes pas, alors aucune nation d'Europe ne le sera. En ces temps, nous devons assumer le rôle de berger tandis que l'Amérique sauvage se déchire."
 FRA_The_Peoples_Victory:0 "La victoire du peuple"
 FRA_The_Peoples_Victory_desc:0 "Bien qu'inattendue et considérée comme une surprise par beaucoup, la NFP a scellé sa victoire aux élections françaises de 2022, après une série d'événements qui nous a projetés sous les projecteurs. Mais si nous avons gagné, nous ne pouvons pas encore célébrer : l'armée est contre nous, et [FRA.GetLeader] aura un mal fou à faire passer nos programmes dans un environnement hostile et inconnu."
 FRA_Demand_Military_Loyalty:0 "Traiter avec l'armée"
 FRA_Demand_Military_Loyalty_desc:0 "Même s'ils sont officiellement étrangers à la gouvernance française, nos militaires pèsent lourd dans la politique de la République. En outre, ils luttent activement contre nous même après notre victoire démocratique, nous considérant comme une menace pour leur oligopole sur la République française. Il faut s'en occuper, et vite."
 FRA_Unite_the_Left:0 "Unir le Front"
 FRA_Unite_the_Left_desc:0 "Si nous formons un front uni en théorie, nous rassemblons en réalité une large coalition de divers courants de gauche, qui ne s'accordent que sur les fondamentaux. Même si [FRA.GetLeader] a été choisi comme président, notre coalition reste lâche et fragile. Pour faire avancer la gauche, nous devons consolider la NFP en une véritable alliance entre partis, et non en un simple bloc destiné à nous faire gagner l'élection."
 FRA_Empower_the_Young_Jacobins:0 "[FRA_Empower_the_Young_Jacobins_loc]"
 FRA_Empower_the_Young_Jacobins_desc:0 "Devant nos succès, le socialisme se répandra naturellement dans toute l'Europe. La Révolution démocratique ne sera pas contrainte de rester en France : nous exporterons le bonheur et la prospérité de notre peuple ailleurs, dans toute l'Union européenne, que ce soit au niveau national ou au Parlement européen, pour le bien de tous."
 FRA_Empower_the_Young_Jacobins_melenchon:0 "L'essor du socialisme européen"
 FRA_Empower_the_Young_Jacobins_faure:0 "Unir la social-démocratie européenne"
 FRA_Empower_the_Young_Jacobins_ruffin:0 "Nos camarades européens"
 FRA_Referendum_on_a_New_Constitution:0 "Référendum sur la 6e République"
 FRA_Referendum_on_a_New_Constitution_desc:0 "Comme on l'a vu sous le règne de Macron, la tendance monarchique et la centralisation de la Cinquième République ont constitué un grave recul pour les principes démocratiques de notre nation, nous rapprochant des temps d'avant la révolution qui a fait de nous un bastion de la démocratie. Naturellement, la Sixième République doit être créée par le peuple et pour le peuple, quelque chose qu'il veut et désire pour la France. Vive la 6e République !"
 FRA_Expand_the_Welfare_State:0 "Développer l'État-providence"
 FRA_Expand_the_Welfare_State_desc:0 "Bien que de grands progrès aient déjà été accomplis dans ce secteur, cela ne suffit pas. L'État doit exister pour servir le peuple, et non simplement lui fournir des prestations. Le programme de protection sociale pour tous doit devenir une composante intrinsèque de la République française, et non un simple élément modifiable en son sein."
 FRA_A_True_Commander_in_Chief:0 "Un véritable commandant en chef"
 FRA_A_True_Commander_in_Chief_desc:0 "Pierre de Villiers, un véritable chef taillé pour ce rôle. Sa longue et brillante carrière dans les Forces armées françaises a été ternie lorsque Macron l'a démis de ses fonctions de ministre de la Défense. Mais il a été limogé pour des raisons politiques ; nous, le peuple, continuons de voir en Villiers un commandant respecté, et bien d'autres généraux se tournent vers lui pour être guidés. Un chef de son calibre ne s'était pas présenté depuis De Gaulle. Trois hourras pour le président !"
 FRA_Rehabilitate_Reconquete:0 "Réhabiliter Reconquête"
 FRA_Rehabilitate_Reconquete_desc:0 "Zemmour et ses ultraconservateurs sont, à toutes fins utiles, des patriotes jusqu'au bout des ongles. Parti anti-immigration dirigé par un immigrant juif algérien de la deuxième génération, son rôle dans le mouvement d'extrême droite a toujours suscité la confusion chez ses adversaires et un accueil étrange chez ses compatriotes. Jean-Marie Le Pen a un jour dit que, si les Français le maudissent souvent, les juifs se sont montrés très bienveillants. Rendons à Zemmour cette gratitude : le Rassemblement national l'accueillera à bras ouverts et nous chercherons à travailler ensemble au sein d'une coalition face à ceux qui voudraient maintenir la France affaiblie."
 FRA_Cement_Military_Control:0 "Cimenter le contrôle militaire"
 FRA_Cement_Military_Control_desc:0 "Ce n'est un secret pour personne quelle influence majeure l'armée exerce en France : sous la direction de De Gaulle, l'armée se maintient comme une force modératrice, à l'image de l'armée en Turquie, défendant certains idéaux au sein de l'État et maintenant la nation sur une certaine trajectoire. Sous De Villiers ? Cela sera consolidé.\n\nLe rôle de l'armée comme force modératrice est un droit sacré, gagné au combat pour restaurer une République affaiblie par Daladier et par le Front populaire qui l'a précédé. C'est De Gaulle qui s'est battu pour libérer la France et soutenir la Résistance tandis que le gouvernement civil vivait en exil ; nous ne pouvons pas l'oublier."
 FRA_A_New_Aristocracy:0 "Une nouvelle aristocratie"
 FRA_A_New_Aristocracy_desc:0 "L'argent parle et l'expérience gagne. La classe dirigeante actuelle de la France est tellement préoccupée par la justice sociale ici qu'elle en oublie que l'armée est le principal moyen de combattre l'injustice partout, qu'elle oublie que la seule façon de mettre du pain dans l'assiette est de garder les affaires simples, et non de réglementer chaque petite boutique qui peine à joindre les deux bouts. Il nous faut une nouvelle intelligentsia et une nouvelle classe supérieure, composées de militaires et de gens d'affaires. La France doit faire de l'argent et créer des emplois, car les emplois signifient la stabilité, la stabilité signifie des enfants, et les enfants signifient un avenir sûr. Une aristocratie dont la première préoccupation est la force future de la France constitue un bénéfice à long terme."
 FRA_Play_into_Napoleonic_Overtones:0 "Jouer la carte napoléonienne"
 FRA_Play_into_Napoleonic_Overtones_desc:0 "Un chef militaire en France sera toujours comparé à Napoléon ; jamais chef militaire ne fut plus célèbre que lui. Un nationaliste parlera de cette époque comme de la véritable naissance d'une nation française, et même un républicain ne peut nier les progrès accomplis sous son règne : en France, le pouvoir militaire n'est pas toujours vu comme une mauvaise chose. De Gaulle nous a remis sur la bonne voie et, de nouveau, De Villiers est chargé de guider la France en une période de désunion politique, de faiblesse militaire et de dégradation nationale. Comme Napoléon avant nous, la France entre dans une nouvelle période et nous ne pouvions espérer meilleur timonier pour la tempête à venir."
 FRA_Birth_of_a_French_Military_Industrial_Complex:0 "Un complexe militaro-industriel français"
 FRA_Birth_of_a_French_Military_Industrial_Complex_desc:0 "Pourquoi l'Allemagne et l'Amérique seraient-elles les seules à avoir d'énormes fabricants d'armes ? Raytheon, Rheinmetall, H&K : ces entreprises obtiennent pratiquement des contrats publics garantis de leurs pays d'origine, tandis que notre gouvernement a mis du temps à adopter un système semblable, démantelant le dirigisme de De Gaulle. Nous devons revenir à une industrie militaire sponsorisée par l'État : le libre marché ne suffit plus à une époque où des géants nous dévorent comme si nous étions des cadavres en décomposition, un festin pour les vautours de l'Est que nous gardions jadis enfermés dans une cage."
 FRA_The_French_Reagan_Category:0 "Le grand stratège"
 FRA_The_French_Reagan_Category_desc:0 "\n\n\n\n\n£GFX_FRA_great_strategist_cat\n\n\n\n\n\n\n\nAlors que Pierre de Villiers se tient à la barre de la France, une ère de transformation s'ouvre, marquée par des réformes stratégiques promettant de remodeler le paysage militaire et politique de la nation. L'air est chargé d'attente tandis que de Villiers présente une vision visant à accroître l'efficacité militaire et à consolider la sécurité nationale, en instillant la fierté dans le cœur de chaque citoyen.\n\nÀ chaque réforme, l'armée devient une force plus redoutable, s'adaptant aux défis contemporains tout en assurant la sécurité et la prospérité du peuple français. De Villiers donne la priorité à la restructuration des budgets de défense, à l'instauration de programmes de formation novateurs et à la conclusion de liens solides avec l'industrie de la défense. L'objectif est clair : bâtir une armée qui non seulement protège la nation, mais incarne aussi l'esprit de résilience et de force qui définit la France."
 FRA_Calm_Militarists_decision:0 "Calmer le discours militariste"
 FRA_Correct_the_Trickle_Down_system_decision:0 "Corriger l'économie du ruissellement"
 FRA_Coordinate_a_March_decision:0 "Coordonner une démonstration de force"
 FRA_A_Unified_General_Staff_decision:0 "Unifier l'état-major général"
 FRA_Perfection_of_Strategy_decision:0 "Perfectionner la stratégie"
 FRA_Utilize_Zemmour_decision:0 "Faire appel à Zemmour"
 FRA_Play_into_ultraconservativism_decision:0 "Flatter les ultraconservateurs"
 FRA_Promote_Nationalist_Education_villiers:0 "Promouvoir l'éducation nationaliste"
 FRA_Remove_the_French_Cancer:0 "Disséquer la gauche"
 FRA_Soviet_Fearmongering_villiers:0 "Le péril russe"
 FRA_All_Hands_on_Deck_villiers:0 "Tout pour l'État"
 FRA_Mass_Militarization:0 "Militarisations de masse"
 FRA_A_French_Renessiance:0 "Le triomphe du peuple"
 FRA_A_French_Renessiance_desc:0 "La nation française se réjouit : le peuple a de nouveau décidé que les valeurs démocratiques resteraient triomphantes face à l'extrême droite. Le poids des élections étant désormais passé, le gouvernement s'efforce de rendre leur bienveillance aux citoyens en mettant en œuvre des réformes — visant à restaurer un nouveau sentiment d'unité et de fierté nationale dans tout le pays. La voix du peuple a été entendue et nous devons maintenant bâtir une France pour tous."
 FRA_Entrench_Centrism:0 "Enraciner le centrisme"
 FRA_Entrench_Centrism_desc:0 "Au vu du résultat serré des élections, il devient évident que, pour que nos réformes non seulement passent mais s'inscrivent dans la durée, nous devons graver nos convictions et nos valeurs au cœur de la politique française. Pour y parvenir, nous avons commencé à tendre la main à l'opposition afin d'engager un dialogue et une coopération active sur les réformes, au bénéfice du peuple français. Grâce à cette approche de juste milieu dans notre politique et nos réformes, nous pourrons mieux toucher la nation et, espérons-le, éviter une répétition de la fracture politique causée par les dernières années de cette administration et par les élections."
 FRA_Uphold_European_Values:0 "Défendre les valeurs européennes"
 FRA_Uphold_European_Values_desc:0 "Contrairement à notre opposition, nous sommes fermement attachés aux valeurs que l'Union européenne fixe pour les nations du continent. Nous consacrons toutes les ressources possibles à la défense des valeurs fondamentales de l'Union européenne, par la démocratie, la coopération et la communication. Nous veillerons à ce que l'Europe reste forte grâce au partenariat économique et nous plaiderons pour des politiques communes afin de protéger nos idéaux. Une Europe unie, avec la France portant les messages et les valeurs de l'Union européenne, est une Europe qui durera bien après la fin de notre administration."
 FRA_Work_with_our_Opposition:0 "Travailler avec notre opposition"
 FRA_Work_with_our_Opposition_desc:0 "Pour garantir la pérennité de nos progrès et de notre gouvernement, il devient manifeste qu'une coopération urgente doit s'engager entre notre parti et l'opposition. Plusieurs discussions et négociations ont eu lieu et, à partir de maintenant, les conservateurs et notre gouvernement libéral œuvrent ensemble à assurer le bipartisme et la coopération, tandis que nous nous employons à garantir une France forte face à l'agression russe et à l'instabilité mondiale."
 FRA_Expand_our_Mediterranean_Influence:0 "Étendre notre influence méditerranéenne"
 FRA_Expand_our_Mediterranean_Influence_desc:0 "La mer Méditerranée a toujours revêtu une grande importance pour le continent européen et pour la France en tant que nation. Afin d'étendre notre influence et notre présence dans le monde à la lumière des récents événements, nous rachèterons l'État insulaire de Malte, en soutenant ses capacités économiques et en partageant sa culture avec la France tout en garantissant la sécurité de l'île. Cette acquisition apportera de grands bénéfices à la France comme au peuple maltais dans les années à venir."
 FRA_Push_for_EU_Reform:0 "Pousser à des réformes de l'UE"
 FRA_Push_for_EU_Reform_desc:0 "La débâcle politique française enfin enrayée, nous avons désormais l'expérience des dangers de l'instabilité et de la radicalisation. Nous pousserons l'Union européenne à entreprendre les réformes indispensables pour éviter, sur le reste du continent, ce qui s'est produit en France. Renforcer l'Union européenne en cette période troublée profitera non seulement aux peuples d'Europe, mais aussi au monde entier, tandis que nous nous dressons contre l'extrémisme et la haine. La France doit montrer à l'Europe le succès de ses récentes épreuves et veiller à ce que l'Europe soit un espace de progrès et de réforme."
 FRA_Godlike_posturing_flag:0 "Macron ne s'est pas encore comparé à un autre dieu."
 FRA_national_embrrassment_flag:0 "Honte nationale"
 fra_left_nato:0 "Nous avons adopté une position anti-OTAN."
 fra_stay_nato:0 "Nous avons adopté une position pro-OTAN."
 FRA_fraud_1:0 "A achevé l'Opération : Faux."
 FRA_fraud_2:0 "A achevé l'Opération : Nul."
 FRA_Created_Vaccine:0 "A déjà créé le vaccin."
 FRA_Authdem_Driot_Chemin_flag:0 "La vieille garde s'est déjà emparée du Mouvement."
 FRA_Nationalist_Driot_Chemin_flag:0 "Les militaristes se sont déjà emparés du Mouvement."
 FRA_melenchon_candidate:0 "Jean-Luc Mélenchon est le chef du Front populaire."
 FRA_faure_candidate:0 "Olivier Faure est le chef du Front populaire."
 FRA_ruffin_candidate:0 "François Ruffin est le chef du Front populaire."
 FRA_A_French_Conquest:0 "La Reconquête"
 FRA_A_French_Conquest_desc:0 "Reconquête a gagné, nos bienfaiteurs militaires y ont veillé, Zemmour occupe la plus haute fonction de l'État et, avec le Rassemblement national dans notre coalition, nous entamerons notre grande Reconquête de la France. Nous devons agir vite avant que des éléments dissidents ne tentent de nous arrêter : un croisé n'avance pas en regardant, l'action est son amie, et l'armure pèse lourd quand on reste immobile."
 FRA_Halt_Immigration:0 "Arrêter l'immigration"
 FRA_Halt_Immigration_desc:0 "Des immigrants africains ont submergé notre nation en masse, tandis que leurs gouvernements nous chassent de nos bases dans la région. Nous nous sommes battus pour leur donner des foyers stables et maintenant ils n'en veulent même plus ? Tant pis. La France n'a pas envoyé de troupes pour résoudre vos problèmes afin que vous puissiez inonder la France : rentrez chez vous et améliorez vos pays ! Nous n'avons pas besoin de votre main-d'œuvre ! Notre peuple s'appauvrit pendant que vous gonflez le marché du travail non qualifié ! Vos pays ont besoin de travail ; vous, les Algériens, nous avez chassés il y a un demi-siècle, n'espérez pas que nous vous tendions la main aujourd'hui !\n\nPlus d'immigration, des lois plus strictes et une flotte de navires affrétés : nous réglerons cela en peu de temps. Certains imploreront la clémence. Le président Zemmour est bien sûr un juif algérien, par ascendance, mais ses parents ont su s'intégrer, et lui-même a fait de même, un immigrant modèle, contrairement aux millions de voyous qui sévissent aujourd'hui en Europe."
 FRA_Administration_Simplification:0 "Simplification de l'administration"
 FRA_Administration_Simplification_desc:0 "La France est devenue une nation très bureaucratique, d'une structure si byzantine que l'on ne peut vraiment comprendre ses mécanismes internes sans un cours approfondi de plusieurs semaines. L'ampleur et la profondeur des décrets réglementaires français ont mobilisé une équipe entière pendant cinq semaines de recherche pour trier ce qui vaut la peine et ce qui n'en vaut pas. Sans compter les milliers de réglementations inutilement imposées par l'UE et autres, qui obligent le citoyen moyen à s'arracher les cheveux pour la moindre démarche, et les politiciens de même. Bien sûr, la présidence est déjà puissante, mais nous pouvons simplifier les choses et rendre le pouvoir un peu plus facile à exercer."
 FRA_Rabid_Assimilation:0 "S'inspirer du Québec"
 FRA_Rabid_Assimilation_desc:0 "Le Québec a récemment adopté des lois strictes face au recul du français dans sa région ; la tendance baissait régulièrement, mais les hommes de Montréal ont finalement décidé que c'en était assez, en réduisant les migrations annuelles totales à seulement 50 000 personnes, en n'autorisant pas plus de 25 % des demandeurs d'une même nationalité, et en exigeant l'intégration sociale pour rester à titre permanent. La législation limite l'immigration annuelle à un très faible pourcentage de la population totale et force les groupes étrangers à être diversifiés, évitant la formation de minorités cohérentes, tout en encourageant et même en imposant la maîtrise du français comme condition de résidence à long terme. Ici, en France, quelques ajustements nous permettront d'en tirer profit : apprendre de notre ancienne colonie est nouveau pour nous, d'ordinaire c'est la Grande-Bretagne qui apprend de la sienne."
 FRA_Put_France_Before_Europe:0 "Placer la France avant l'Europe"
 FRA_Put_France_Before_Europe_desc:0 "Il serait faux de dire que l'Union européenne et l'OTAN nous sont entièrement nuisibles : la France a profité de cet arrangement pendant bien des années et fut même l'un des fondateurs de l'UE. Mais nous ne pouvons continuer comme nous l'avons fait, à privilégier la prospérité étrangère au détriment de la nôtre. Planifier nos actions économiques en fonction de toute l'Europe plutôt que de nous seuls — ne sommes-nous pas une nation comme les autres ? Ne pouvons-nous pas planifier notre économie et eux la leur ? De quel droit imposons-nous des réglementations, et de quel droit surtout nous en imposent-ils ? Qu'ils soient grands par eux-mêmes et, s'ils échouent sans notre aide, c'est le destin, et le destin ne peut être évité, seulement retardé."
 FRA_Reverse_Declinism:0 "Inverser le déclinisme"
 FRA_Reverse_Declinism_desc:0 "Depuis 1970, la France est dans un déclin constant. La génération libérale de 68, comme Zemmour l'appelle, a conduit la France sur la voie du suicide national, où la fierté nationale a été démolie et où les frontières ont été ouvertes à quiconque voulait entrer. Nous avons observé le déclin de la France pendant cinquante ans, et pendant cinquante ans Zemmour a œuvré à la droite française contre la croissance des groupes étrangers et surtout contre la peste islamique au sein de nos frontières depuis l'époque de Jean-Marie Le Pen ; il est enfin récompensé de son dévouement.\n\nZemmour lui-même peut tendre la main et étrangler les lianes qui retiennent depuis si longtemps la France de bondir vers le XXIe siècle comme un lion : l'immigration de masse, les dépenses croissantes, le sentiment toujours plus chaleureux de sacrifier notre identité nationale pour une sorte de super-État européen dominé par l'Allemagne ? Assez de tout cela. La tradition sera au gouvernail de l'État, la raison et la logique fermement placées avant les émotions des âmes sensibles."
 FRA_VIC_160_days_malaise_tt:0 "Une fois ce focus achevé, le malaise de mobilisation expirera dans §Y160 jours§!."
 FPR_damage_divisions_tooltip:0 "Cela §Rendommagera§! la puissance des divisions dans plusieurs villes d'Europe de l'Est."
 FRA_will_win_next_election_tt:0 "§CSauf catastrophe, nous remporterons l'élection de 2027§!."
 FRA_Caribbean_Occupation_Auth_tt:0 "Nous établirons une autorité d'occupation dans les Caraïbes."
 FRA_Corrupted_Presidential_Guard_tt:0 "On peut acheter n'importe qui pour un prix, même les hommes « incorruptibles » de la Garde républicaine. Une main graissée ici, des promesses de promotion là. Ils seront ralliés à notre cause ou, au moins, contraints de §Rfermer les yeux...§!"
 FRA_seize_movement_warning_tt:0 "§RLe mouvement sera coopté par cette aile du parti.§!"
 FRA_Recoup_our_Losses:0 "Récupérer nos pertes"
 FRA_Recoup_our_Losses_desc:0 "Le règne de Macron sur la France est passé à l'histoire comme un désastre d'un seul mandat : en l'espace de cinq ans, il est passé d'ouvert, souriant et charismatique à une tentative de devenir son « idéal jupitérien », l'idéal d'un président autorité suprême. Avec un autre, peut-être cela aurait-il pu se faire. Renaissance était sur le point de disposer d'une confortable majorité au Parlement, mais cela ne devait simplement pas être."
 FRA_Embrace_the_New_Left:0 "Embrasser la nouvelle gauche"
 FRA_Embrace_the_New_Left_desc:0 "Renaissance a un temps constitué un tiers de l'axe politique, un pôle à part entière entre la droite populiste et la gauche, mais Renaissance ne survivra pas sans amis. Les efforts de Mélenchon pour propulser la gauche dans l'ère moderne ont porté leurs fruits, et la seule façon de contrer Le Pen est de travailler ensemble et de garder un fouet qui claque au-dessus de notre propre parti. Mélenchon peut être un adversaire, mais c'est un adversaire qui partage nombre de nos politiques et de nos intérêts. Une coalition contre Le Pen nous aidera tous les deux dans les années à venir."
 FRA_Battle_Every_Legislation:0 "Combattre la législation conservatrice"
 FRA_Battle_Every_Legislation_desc:0 "Ils ne passeront pas. Une phrase souvent associée à la bataille de Verdun. Aujourd'hui, bras de fer avec la gauche française, nous regardons Le Pen et disons une fois de plus : ils ne passeront pas. Le Rassemblement national réduira à néant tout ce que nous avons bâti, tous les progrès que le centre et la gauche ont obtenus pour les droits des travailleurs et pour la justice sociale. Chaque nouveau texte de loi est une attaque contre l'œuvre de nos prédécesseurs, dans une lutte de plus de quarante ans contre l'emprise croissante de la droite sur le pouvoir."
 FRA_Investigate_Electoral_Integrity:0 "Enquêter sur l'intégrité électorale"
 FRA_Investigate_Electoral_Integrity_desc:0 "Nous nous attendions à des pertes dues à la crise pétrolière et à la COVID, mais les sondages annonçaient une victoire de plusieurs points. Quelque chose pue à Paris et nous allons déclencher les procédures nécessaires à l'échelle nationale, au niveau central comme local, en mobilisant pleinement la justice, afin d'enquêter sur la fraude du Rassemblement national. Ils diront que ce n'est pas vrai et qu'il s'agit d'une chasse aux sorcières, mais vraies ou fausses, ces enquêtes diviseront l'opinion publique et détourneront des voix de Le Pen et de ses acolytes ; il suffit de pousser assez les accusations pour qu'elles deviennent des faits aux yeux du public. Il ne faut qu'une graine de doute."
 FRA_Take_A_Stance_on_Federalization:0 "Nouvelle position sur la fédéralisation"
 FRA_Take_A_Stance_on_Federalization_desc:0 "Macron était l'un des plus fervents partisans de la fédéralisation européenne, proposant une armée intégrée et une intégration accrue du droit, de l'économie et même de la police. Nous pouvons choisir de suivre cette voie en choisissant les bons partenaires de coalition, ou nous y opposer. Il est vrai que la victoire de Le Pen révèle un basculement politique : devenir eurosceptique pourrait nous aider dans les sondages. Placer la République avant nos voisins est assurément une décision populaire, Macron n'a jamais pu le comprendre ; mais même si nous acceptons cette position populaire, nous n'avons pas à renier l'Europe. Nous pouvons rester pro-UE si nous le choisissons. Nous sommes vraiment à la croisée de deux chemins, un avenir européen ou un avenir français : le choix nous appartient."
 FRA_Uphold_Republican_Beliefs:0 "Défendre les idéaux républicains"
 FRA_Uphold_Republican_Beliefs_desc:0 "Liberté, Égalité, Fraternité. Fondement de notre grande République, à travers cinq Républiques, deux Royaumes et deux Empires, nous n'avons pas perdu ces idéaux. Mais nous pourrions finir par les perdre si nous ne les sauvegardons pas. Au sein même de nos rangs se trouve l'insidieuse clique des traditionalistes, des conservateurs, à peine deux marches au-dessus des Bourbons. La Révolution est une chose qu'il faut défendre, et nul ne le sait mieux que les Français ; Dieu sait que nous avons senti leur colère avec les gilets jaunes plus d'une fois.\n\nS'opposer à Le Pen est aussi simple que de dénoncer ses politiques comme anti-républicaines : nos idéaux les plus fondamentaux appellent à l'égalitarisme et à la liberté, tandis qu'elle veut verrouiller les manifestants et placer les Français avant tous les autres, dût-elle aliéner des populations minoritaires. La République française n'a jamais été fondée sur les idéaux d'un nationalisme inextinguible et d'une xénophobie sans frein ; à nos débuts, nous avons même cherché à nous détacher de l'Église, et si cette plateforme n'a pas été si populaire, cela ne signifie pas que nous devrions déchirer l'œuvre de 1793 pour créer une société nouvelle et châtrée, sûre mais trop effrayée pour critiquer le gouvernement."
 FRA_A_Denied_Destiny:0 "Notre destin refusé"
 FRA_A_Denied_Destiny_desc:0 "Le Pen a échoué ; son réformisme nous a fait perdre l'élection. Nous n'avons jamais été populaires en tant que modérés de centre droit : nous étions le parti de l'action et de la force ! La démission de Le Pen est la meilleure chose qu'elle ait fait depuis bien des années. Le parti est désormais dirigé par Bardella ; le peuple nous a refusé un mandat à cause du statu quo libéral de Macron et de ses acolytes jupitériens. Il n'est pas De Gaulle, il n'est pas un homme mystérieux dans un château d'ivoire, c'est un chacal hilare au service de Bruxelles, et nous ne resterons pas les bras croisés. Macron nous verra défaire son précieux réseau d'hommes d'affaires et de courtisans militaires ; ses alliés se retireront de peur."
 FRA_Reintegrate_Radical_Forces:0 "Réintégrer les forces radicales"
 FRA_Reintegrate_Radical_Forces_desc:0 "Ce sont les réformes du Rassemblement national qui ont provoqué l'éclatement de la droite : les identitaires, la Reconquête de Zemmour. Si nous nous étions unis lors de la dernière élection, nous aurions eu la majorité. Avec Bardella aux commandes, le parti du père est de retour et le parti de la fille est mort. Les radicaux reviendront dans notre giron et, ensemble, dans la solidarité, nous nous dresserons et nous serons entendus. Vive la France !"
 FRA_Meet_with_Disgraced_Militarists:0 "Rencontrer les militaristes disgraciés"
 FRA_Meet_with_Disgraced_Militarists_desc:0 "L'armée a joué les Martin Luther avant la dernière élection, clouant des revendications sur les portes du gouvernement dans tout Paris ; des unités militaires se sont avancées vers la périphérie. Macron et la nation ont cru qu'un coup d'État pouvait se produire, mais ce n'était que de la pression. Macron a reculé et s'est tenu ferme face aux exigences militaires ; Le Pen a offert son soutien de façade puis n'a pas apporté la victoire. L'armée est désemparée par la victoire de Renaissance et par l'affaiblissement continu de l'armée française, tandis que les orques brutaux rassemblent leurs hommes à l'est, prêts à piétiner l'ouest dans le vide chaotique laissé par l'Amérique. Bardella et l'armée partagent une même volonté : celle d'accomplir l'extra-légal pour garantir l'avenir de la France. Nous pouvons promettre leurs exigences — et davantage."
 FRA_Entangle_Electoral_Victory:0 "Saboter l'université libérale"
 FRA_Entangle_Electoral_Victory_desc:0 "Les élites libérales constituent le statu quo d'aujourd'hui pour une raison : elles contrôlent l'enseignement. Comme les marxistes jadis, aux beaux jours du Front populaire. Si vous contrôlez l'école, vous contrôlez les élèves, vous leur enseignez le bien et le mal, vous leur apprenez à se taire ou à crier, vous les braquez contre ceux que vous voulez réprimer et ils font le reste ; ils élèvent leurs enfants dans la même doctrine, puis leurs petits-enfants, et ainsi de suite. Le monde universitaire d'élite français est pourri, infesté de mondialistes de gauche indifférents au bien-être de la France et de son peuple, préférant les intérêts d'un village perdu de l'autre côté de la planète. Combien de morts ? Combien d'entreprises et de vies ruinées, dans les manifestations que leur enseignement a attisées ? Assez. Perturbons leurs activités par tous les moyens : envoyons des hommes masqués les frapper chez eux la nuit, proférons des alertes à la bombe, et imputons tout cela aux agitateurs russes et aux révolutionnaires de gauche. Nous porterons chez eux les émeutes qu'ils attisent, et ils se tairont. Ils pourraient même nous rejoindre par peur."
 FRA_The_Right_Way:0 "La bonne voie"
 FRA_The_Right_Way_desc:0 "La bonne voie est la bonne voie. Qu'apporte la gauche ? L'inflation ? Des impôts accrus ? Plus d'aide sociale pour moins de bénéfices, tandis que des hordes de musulmans absorbent le fruit de votre travail ? Appelez Renaissance si vous voulez, Renaissance couche avec Bruxelles et, si elle en avait l'occasion, vendrait toute la nation pour une vraie chance de fédéraliser l'Europe. La disparition de la France n'est pas qu'une théorie du complot : c'est une politique de campagne et un objectif stratégique à long terme des libéraux. Seuls Bardella et le Rassemblement national peuvent délivrer la France de l'agenda gauchiste ; seul le Rassemblement national peut baisser vos impôts, mettre des prestations dans votre poche et renvoyer les Maures se noyer sur la barque qui les a amenés. Votez pour votre représentant local du Rassemblement national et demandez à votre section comment vous pouvez bénéficier au parti ; si vous êtes ici pour notre aile armée, baissez la voix et suivez-moi."
 FRA_Stoke_Russian_Fears:0 "Attiser la peur de la domination russe"
 FRA_Stoke_Russian_Fears_desc:0 "Les Russes ont toujours été l'ennemi de l'Europe ! Déloyaux ! Slaves ! À peine mieux qu'une horde mongole. L'Empire arriéré nous a trahis : ils ont conclu des accords avec l'Allemagne et, en moins de vingt ans, ils étaient copains avec les Allemands tout en nous souriant. La conférence de Yalta n'a dû être que du papier toilette pour le chien géorgien ; la dernière fois qu'un accord avec les Russes a été respecté précède l'histoire écrite, car nous n'en avons aucune trace. Vous croyez qu'ils respecteront leurs accords aujourd'hui ? Vous êtes un imbécile, un bot russe, ou un communiste athée nostalgique de sa mère patrie. Cessez de vous mentir, France ! Vous serez empalé sur les bûchers du Kremlin si vous ne vous réveillez pas au monde dur et nouveau dans lequel nous vivons aujourd'hui !"
 FRA_Operation_Saint_Arnaud:0 "§YOpération§! : Davout"
 FRA_Operation_Saint_Arnaud_desc:0 "Les Russes ont été pris au dépourvu par notre intervention soudaine dans la défense de l'Ukraine, mais ils n'ont pas arrêté. D'après les nouvelles du front et les rapports du renseignement, plutôt que de s'arrêter pour évaluer la situation, les Russes ont redoublé et déversé davantage de ressources dans l'offensive ukrainienne. Malgré les inquiétudes sur la capacité de l'Ukraine à surmonter la tempête, les circonstances offrent une occasion potentiellement dorée. L'attention russe étant entièrement tournée vers l'Ukraine et ses tentatives d'organiser une ligne de seize cents kilomètres, leurs ressources sont fortement mises à l'épreuve. Cela a créé les conditions d'un débarquement naval audacieux derrière les lignes russes, dans la région du Kouban. Cette tête de pont pèserait davantage sur les effectifs russes et sur des ressources logistiques déjà étirées, et pourrait les forcer à suspendre leurs opérations offensives, nous permettant d'organiser de nouvelles contre-offensives de grande ampleur tandis que l'ours est déséquilibré. Le succès nous consacrerait comme acteur de premier plan ; l'échec n'est pas une option, car le destin de l'Europe et l'honneur de la France sont en jeu."
 FRA_Operation_Davout_decision:0 "§YOpération§! : Davout"
 FRA_NATO_war_category:0 "La guerre européenne"
 FRA_NATO_war_category_desc:0 "\n\n\n\n\n£GFX_SOV_NATO_war_category\n\n\n\n\n\n\n\nLes Russes tentent une fois encore de marcher vers l'Europe pour tailler leur propre empire... Il ne tient qu'à nous de les arrêter.\n\n§ROBJECTIFS PRINCIPAUX§! :\n\n§YSÉBASTOPOL§! : [GLOBAL.get_sevastopol_nato_status]\n§YMINSK§! : [GLOBAL.get_minsk_nato_status]\n§YSAINT-PÉTERSBOURG§! : [GLOBAL.get_petersburg_nato_status]\n§YROSTOV-SUR-LE-DON§! : [GLOBAL.get_rostov_nato_status]\n\n§ROBJECTIFS SECONDAIRES§!\n\n§YKALININGRAD§! : [GLOBAL.get_kaliningrad_nato_status]\n§YBELGOROD§! : [GLOBAL.get_belgorod_nato_status]\n§YVOLGOGRAD§! : [GLOBAL.get_volgograd_nato_status]\n§YNOVGOROD§! : [GLOBAL.get_novgorod_nato_status]\n§YDONETSK§! : [GLOBAL.get_donetsk_nato_status]\n§YLOUHANSK§! : [GLOBAL.get_luhansk_nato_status]\n\n§GVILLES ALLIÉES§!\n\n§YKIEV§! : [GLOBAL.get_kiev_nato_status]\n§YODESSA§! : [GLOBAL.get_odessa_nato_status]\n§YTALLINN§! : [GLOBAL.get_tallinn_nato_status]\n§YVILNIUS§! : [GLOBAL.get_vilnius_nato_status]\n§YVARSOVIE§! : [GLOBAL.get_warsaw_nato_status]\n§YBUDAPEST§! : [GLOBAL.get_budapest_nato_status]\n§YBUCAREST§! : [GLOBAL.get_bucharest_nato_status] \n\n§YOPÉRATION DAVOUT§! : \n§5KERTCH§! : [GLOBAL.get_kerch_nato_status] \n§5NOVOROSSISK§! : [GLOBAL.get_novorossiysk_nato_status] \n§5SOTCHI§! : [GLOBAL.get_sochi_nato_status]"
 FRA_davout_success_idea:0 "Succès dans le Caucase"
 FRA_davout_success_flag:0 "§YOpération§! : Davout est un succès"
 FRA_failed_operation_davout:0 "Nous avons fait échouer §Yl'Opération§! : Davout"
 FAF_operation_baku_decision_idea:0 "§HOPÉRATION :§! BAKOU"
 FAF_operation_powderkeg_decision_idea:0 "§HOPÉRATION :§! BARIL DE POUDRE"
 FRA_ils_ne_passeront_pas:0 "Ils ne passeront pas !"
 FRA_ils_ne_passeront_pas_desc:0 "Malgré l'effondrement de l'Ukraine, le moral reste haut dans la tête de pont du Kouban. Ce zèle retrouvé se maintient en dépit du fait que tout ne va pas bien au front : l'ours a remporté de grands succès, au prix de lourdes pertes. L'avancée russe se poursuit et, pour faire face à un tel assaut, il est évident que nous devons enfoncer nos talons plus profondément dans le tchernoziom. Aujourd'hui, c'est nous qui assiégeons Krasnodar, mais un échec pourrait permettre aux Russes de pousser plus loin, et c'est le cœur de l'Europe qui serait en péril. Un cri issu du riche passé de la France a été ressuscité par les hommes du front et, comme alors, servira désormais de cri de ralliement excellent pour les soldats comme pour les civils. Ils ne passeront pas !"
 FRA_sovereignty:0 "Souveraineté"
 FRA_sovereignty_desc:0 "Des membres plus idéalistes du gouvernement et de l'armée veulent profiter du conflit pour cimenter l'unité européenne, accroître l'intégration des unités et utiliser des unités ethniques anti-russes pour nous présenter comme des libérateurs. Tout changement structurel majeur de ce type, tout investissement massif dans des groupes d'une loyauté douteuse, doit être considéré comme un pari, et celui qui parie son âme est un imbécile. Ces concepts rêveurs doivent être réservés à un monde où l'Europe a vaincu toute menace que la Russie représente pour une Europe libre. Jusqu'à ce jour, nous nous appuierons sur la force de la France telle qu'elle est : les réformes rêveuses peuvent attendre la paix."
 FRA_solidarity:0 "L'héritage de la Légion étrangère"
 FRA_solidarity_desc:0 "Malgré notre refus de suivre la voie d'une réorganisation furieuse et risquée, il reste de la place pour lever des unités non françaises en embrassant simplement l'esprit de la Légion étrangère. En développant rapidement ses effectifs, nous pouvons à la fois gonfler les rangs de combattants supplémentaires et nous soucier moins de changements structurels radicaux et de conflits d'intérêts possibles entre unités ethniques. La France fera combattre des étrangers pour elle, mais sous la bannière unificatrice de la Légion étrangère."
 FRA_cement_ukrainian_crimea:0 "Cimenter la Crimée ukrainienne"
 FRA_cement_ukrainian_crimea_desc:0 "Avec la reconquête de la Crimée, nous ne devons épargner aucune dépense pour garantir que toute tentative russe de la reprendre échoue. L'Europe est entrée dans ce conflit pour une atteinte à l'intégrité territoriale de l'Ukraine et, pour montrer que nous parlons sérieusement, nous devons aller jusqu'au bout. Nous ne nous contenterons pas d'une trêve, d'aucune « zone démilitarisée », rien de moins qu'une victoire totale. Les terres volées à l'Ukraine pendant que nous restions les bras croisés seront rendues, quel qu'en soit le prix. Nos échecs seront corrigés et nous ferons de notre mieux pour que ce soit la dernière fois que la Russie peut menacer l'Ukraine — et même l'Europe — à jamais. L'ours sera brisé à n'importe quel prix."
 FRA_kuban_expeditionary_army:0 "Armée expéditionnaire du Kouban"
 FRA_kuban_expeditionary_army_desc:0 "Malgré leurs succès actuels chez eux et au front, derrière le rideau on trouve la dissidence en Russie. Il y a ceux, dans les régions, qui se sentent laissés de côté loin de Moscou ; le Kouban est le point de départ parfait, de vastes portions étant tombées entre nos mains. Nous organiserons des volontaires locaux et des prisonniers de guerre en ce « Corps du Kouban », malgré les officiers locaux qui insistent pour l'écrire avec un « K ». De telles unités seront parfaites pour la sécurité arrière et pour montrer aux habitants, et peut-être au peuple russe, que nous ne sommes que des libérateurs, non des brutes conquérantes."
 FRA_conscript_cossack_brigades:0 "Brigades cosaques de conscrits"
 FRA_conscript_cossack_brigades_desc:0 "Avec l'effondrement de l'URSS, Russes et Ukrainiens ont tous deux revendiqué l'héritage du nom cosaque. De là où nous nous trouvons, l'Ukraine est la patrie de tout véritable cosaque, et ceux qui prétendent l'être doivent se tenir à nos côtés, sous peine d'être des traîtres à leur peuple. Ceux qui sont de notre côté du front seront organisés en unités mobiles légères, à la mesure de leur nom. Le consentement à rejoindre ces unités n'a pas d'importance, car après tout, nous combattons pour eux, non pour nous."
 FRA_utilize_russian_dissidents:0 "Utiliser les dissidents russes"
 FRA_utilize_russian_dissidents_desc:0 "Nombreux sont ceux qui prendraient les armes avec nous pour mille raisons : une Russie « meilleure », l'indépendance régionale, ou simplement parce qu'ils vont là où souffle le vent. Le « pourquoi » n'importe pas : ces hommes peuvent recevoir des fusils et servir à affaiblir l'effort de guerre russe. Certains collaborent de bonne foi, d'autres ont des vues que nous jugeons généralement... problématiques. Nous n'aurons qu'à en assumer les conséquences plus tard. Il y a une guerre à gagner."
 FRA_operation_davout_tt:0 "§YÀ l'achèvement de ce focus, §!§Cl'opération§! Davout§!§Y commencera. \nIl s'agit d'une attaque de grande envergure contre §!\n§RSochi \nNovorossiysk \nKerch§!\n§YElle vise à soulager la pression ukrainienne et à garantir que§! §Cles forces de l'OTAN§! §Ydisposent de la supériorité sur le §!§Gfront caucasien§!"
 FRA_cossack_army_tt:0 "4 §ybrigades mécanisées légères cosaques! seront levées à §pVarsovie§!"
 FRA_kuban_exp_army_tt:0 "6 §0divisions de milice du Kouban§! seront levées à §pVarsovie§!"
 FRA_Freedom_of_Russia_Legion_tt:0 "2 §3divisions mécanisées de dissidents russes§! seront levées à §pVarsovie§!"
 FRA_foreign_legion_tt:0 "4 §2brigades de la Légion étrangère française§! seront levées à §4Paris§!"
 FRA_Act_on_Rattachism:0 "Loi sur le réunionisme"
 FRA_Act_on_Rattachism_desc:0 "Si la Wallonie parle français, cette partie ancienne du monde francophone nous échappe depuis la chute de Napoléon, que nous croyions à jamais perdue. Le destin nous a réunis de nouveau, et nous devons préparer plusieurs lois pour continuer à l'intégrer à notre système : être dans nos frontières ne suffit pas, la Belgique et son système politique byzantin doivent être réconciliés avec le nôtre. Pour le bien de la France, nous nous en chargerons."
 FRA_Absorb_Waloon_Command:0 "Absorber le commandement wallon"
 FRA_Absorb_Waloon_Command_desc:0 "Le caractère bilingue de la Belgique a conduit à une armée divisée en deux, à l'image de son gouvernement, ce qui a rendu la partition de la Belgique assez nette : les Flamands assuraient la sécurité frontalière du côté flamand et les Wallons de même. Désormais, cette responsabilité incombe aux Néerlandais et à la France. La Wallonie apporte avec elle un contingent considérable de forces et des officiers de l'OTAN expérimentés dont nous serions fous de refuser les services. Renouvelez leurs uniformes, accordez-leur de nouveaux grades : ils font désormais partie de la France."
 FRA_absorbing_walloon_command_tt:0 "Les officiers wallons seront intégrés à notre armée."
 FRA_Reorganize_Walloon_Businesses:0 "Réorganiser les entreprises wallonnes"
 FRA_Reorganize_Walloon_Businesses_desc:0 "Lorsque l'on intègre un territoire urbain développé comme la Wallonie, il faut considérer que les entreprises de la région étaient soumises à un code de construction strict que la Belgique surveillait depuis Bruxelles. Mais aujourd'hui ? Ces entreprises relèvent du droit français. Nous devons inspecter les entreprises nouvellement acquises et les aider à se réorganiser : des sociétés comme la Fabrique nationale sont trop précieuses pour être laissées à l'abandon ; intervenir et les organiser au milieu du chaos préservera l'économie locale."
 FRA_Integrate_Walloon_Parliament:0 "Intégrer le Parlement"
 FRA_Integrate_Walloon_Parliament_desc:0 "Le plus difficile est vraiment d'examiner le système gouvernemental belge et de voir comment l'intégrer. La Belgique comptait trois parlements : flamand, wallon et germanophone. Nous contrôlons les régions wallonne et germanophone et ne savons pas exactement quoi faire de leurs gouvernements ; certains sièges seront probablement supprimés, notamment en ce qui concerne Eupen-Malmedy, mais beaucoup seront intégrés à la République française. Leurs partis, enregistrés sous leurs anciens noms, les conserveront pour un temps, et nombre de parlementaires belges se sentiront bientôt à l'aise à Paris. Il ne reste plus qu'à notre parti de dessiner les circonscriptions électorales et de décider ensuite qui garder."
 FRA_Promote_Francophone_Unity:0 "Promouvoir l'unité francophone"
 FRA_Promote_Francophone_Unity_desc:0 "Les peuples francophones sont les héritiers d'un héritage grand et ancien, de Charlemagne aux Valois, des Bourbons à Napoléon, et à la grande ère républicaine actuelle. Nous sommes les façonneurs des valeurs européennes, nous en détenons la culture ; nous avons enduré pendant plus d'un millénaire l'invasion étrangère, la sujétion et, plus souvent qu'à son tour, de grandes campagnes à l'Est, au Sud et à l'Ouest, par-delà l'Atlantique, pour conquérir la gloire pour nous et nos peuples.\n\nLa Belgique et la Wallonie furent la plupart du temps séparées de nous durant ces gloires. Mais elles les partagèrent tout de même. Notre histoire est une source de fierté, notre histoire est la leur, et la leur est la nôtre. Les Français restent toujours unis !"
 FRA_An_Example_of_Unity:0 "Un exemple d'unité"
 FRA_An_Example_of_Unity_desc:0 "Liberté, Égalité, Fraternité. Les principes directeurs de la France. Depuis que la première lame est tombée et a mis fin à l'Ancien Régime, nos idéaux ont embrasé le monde. L'Amérique. L'Allemagne. L'Italie. Existe-t-il une partie du monde où ces trois mots ne sont pas parvenus ? Nommez-en une. L'Europe est aujourd'hui uniquement unie par ces idéaux, et bien que la Belgique soit tombée, les idées fondamentales dans les esprits n'ont pas disparu. Bruxelles reste une ville à l'ethnicité mêlée flamande et wallonne, la capitale de l'Europe ; la Belgique a disparu, mais le symbole d'unité qu'elle a laissé est un puissant rappel du triomphe de nos idéaux à travers toutes les crises et tous les troubles, la quête de Freiheit, de Liberté, quelle que soit la langue que vous parlez, vous avez un mot pour cela. En anglais, c'est Liberty. Dans le cœur et l'esprit de chaque Européen, que Bruxelles soit un phare pour l'avenir de l'Europe. Le premier véritable territoire sur une carte dont nous pouvons dire qu'il appartient entièrement à l'Europe."
 FRA_Propagandize_French_Naturalism:0 "Faire la propagande du naturalisme français"
 FRA_Propagandize_French_Naturalism_desc:0 "Et au Rhin je dis : suivez le fleuve vers le nord jusqu'à ce que la bière de Brabant soit sur les places du marché. Nous sommes les Français, héritiers de la Francia, nous n'oublions pas nos origines. Les Néerlandais, les Allemands, sont nos frères. Nous gagnons la Wallonie aujourd'hui, mais nous aurions dû tout gagner, nous aurions dû aller plus loin ; c'est un cadeau à l'Europe que de ne pas marcher vers le Rhin comme Napoléon. Cette ancienne frontière nous fut tracée lors d'une défaite qui nous sépara des Wallons, des Flamands, des anciennes terres de Bourgogne. Pourquoi devrions-nous l'accepter ? Non, nous exigeons davantage. Nous devrions avoir davantage. La Wallonie aujourd'hui, la Flandre demain, le Brabant la semaine prochaine, le Rhin l'année prochaine. Peut-être. "
 FRA_Absorb_the_Beglian_Left:0 "Absorber la gauche belge"
 FRA_Absorb_the_Beglian_Left_desc:0 "Nous, la gauche, devons rester unis ; les socialistes belges sont depuis longtemps nos amis sur la scène européenne et dans leurs rangs se trouvent nombre d'amis personnels de Mélenchon. Il est normal, avec des régions réunies, que nous puissions partager le repas : une rencontre de Mélenchon avec le leader du Parti socialiste Paul Magnette et Raoul Hedebouw du PVDA nous permettra de renforcer notre position parlementaire et de légitimer notre autorité sur la classe ouvrière belge. Autant faire venir Charles Servaty également ; Eupen est petit, mais Eupen reste nôtre. Leurs 3 sièges sont toujours des sièges que nous aimerions conserver."
 FRA_Appoint_King_Philippe_to_Parliament:0 "Restaurer les titres belges"
 FRA_Appoint_King_Philippe_to_Parliament_desc:0 "La Belgique a une monarchie riche d'histoire, injustement arrachée dans les derniers jours de son existence ; il n'est pas juste qu'un tel symbole d'unité nationale soit ainsi dérobé. Nous ne sommes pas nous-mêmes une monarchie, bien sûr, mais les conservateurs belges ne veulent pas que leurs royaux deviennent de simples citoyens. Très bien. Leurs titres seront restaurés et maintenus par la République française ; aussi étrange que cela paraisse, nous couronnerons de nouveau un roi pour la Belgique. Un honneur purement honorifique et entièrement non administratif."
 FRA_Desperate_Defense_cw_idea:0 "Défense en profondeur"
 FPR_Fervor_reset_tt:0 "Retire l'idée §R« Ferveur révolutionnaire »§!"
 FRA_Secure_French_Oil_Interests:0 "Reconnaître un successeur saoudien"
 FRA_Secure_French_Oil_Interests_desc:0 "Établir des relations diplomatiques avec la nouvelle direction saoudienne, qu'elle soit sous la République arabique ou la maison des Saoud. Cette reconnaissance vise à consolider les alliances et à assurer un partenariat stable, facilitant la coopération dans la production d'énergie et la sécurité régionale tout en renforçant l'influence de la France dans le Golfe."
 FRA_If_We_cant_have_it:0 "Nous établir au Moyen-Orient"
 FRA_If_We_cant_have_it_desc:0 "Investir stratégiquement au Moyen-Orient en apportant un soutien financier à des alliés clés comme Israël et la Turquie. Cette initiative renforcera les relations dans la région, favorisant la stabilité et des partenariats pouvant mener à des accords énergétiques favorables et à une coopération sécuritaire accrue."
 FRA_Encourage_European_Economic_Sanctions:0 "Accorder des prêts économiques"
 FRA_Encourage_European_Economic_Sanctions_desc:0 "Accorder des prêts économiques ciblés au gouvernement successeur saoudien pour soutenir le développement et la stabilité. En investissant dans leur économie, la France peut renforcer ses liens bilatéraux et encourager des politiques conformes à ses intérêts, garantissant un flux régulier de pétrole et une coopération stratégique."
 FRA_Redirect_Budget_to_Oil_Contracts:0 "Réorienter le budget vers les contrats pétroliers"
 FRA_Redirect_Budget_to_Oil_Contracts_desc:0 "Réaffecter les ressources budgétaires pour donner la priorité aux contrats et initiatives pétroliers. Ce focus vise à garantir que les fonds sont efficacement canalisés vers la conclusion d'accords énergétiques vitaux, le renforcement de l'indépendance énergétique et la consolidation du rôle de la France comme acteur clé du marché mondial du pétrole."
 FRA_Integrate_Oil_Contracts_into_Military_Budget:0 "Intégrer les contrats pétroliers au budget militaire"
 FRA_Integrate_Oil_Contracts_into_Military_Budget_desc:0 "Combiner le budget pétrolier avec le financement militaire pour créer une approche unifiée de la sécurité énergétique. En intégrant ces budgets, la France peut renforcer ses capacités stratégiques et garantir que les opérations militaires sont suffisamment soutenues par les ressources énergétiques, renforçant ainsi la défense nationale."
 FRA_Department_of_Oil_Production:0 "Département de la Production Pétrolière"
 FRA_Department_of_Oil_Production_desc:0 "Créer un département gouvernemental dédié à la production et à la gestion du pétrole. Ce département supervisera l'élaboration de stratégies pétrolières nationales et internationales, coordonnera les acteurs industriels et pilotera des initiatives renforçant la sécurité énergétique et l'efficacité de la production française."
 FRA_Reorganize_Civilian_Infrastructure:0 "Réorganiser l'infrastructure civile"
 FRA_Reorganize_Civilian_Infrastructure_desc:0 "Moderniser l'infrastructure civile pour soutenir l'accroissement de la production et de la distribution de pétrole. Cette initiative implique d'améliorer les réseaux de transport, les installations de stockage et les usines de traitement pour garantir des opérations efficaces. En modernisant l'infrastructure, la France peut optimiser sa chaîne d'approvisionnement énergétique et renforcer sa résilience économique globale."
 FRA_Invest_in_Equinor:0 "Investir dans Equinor"
 FRA_Invest_in_Equinor_desc:0 "Canaliser des investissements vers Equinor pour soutenir les initiatives en énergie renouvelable et diversifier les sources d'énergie. Cette démarche stratégique vise à s'aligner sur les tendances énergétiques mondiales tout en sécurisant une place dans les solutions énergétiques innovantes. Soutenir Equinor positionnera la France comme un leader des marchés de l'énergie traditionnelle et durable."
 FRA_Ration_Civilian_Oil:0 "Rationner le pétrole civil"
 FRA_Ration_Civilian_Oil_desc:0 "Mettre en place un système de rationnement du pétrole à usage civil afin de prioriser les ressources pour les besoins stratégiques et les opérations militaires. Cette mesure vise à garantir que les secteurs critiques restent approvisionnés tout en gérant efficacement la demande intérieure. En contrôlant la distribution du pétrole, la France peut maintenir sa stabilité en période de tensions accrues."
 FRA_Curtail_Former_American_Embargoes:0 "Se distancier des embargos américains"
 FRA_Curtail_Former_American_Embargoes_desc:0 "Prendre des mesures pour distancier la France des embargos imposés par les États-Unis, en particulier contre le Venezuela. En levant les restrictions et en dialoguant avec les nations sanctionnées, la France peut sécuriser des approvisionnements pétroliers alternatifs, renforcer son indépendance énergétique et se positionner comme médiateur diplomatique dans les discussions énergétiques mondiales."
 FRA_West_African_Oil:0 "Les champs pétroliers d'Afrique de l'Ouest"
 FRA_West_African_Oil_desc:0 "S'efforcer d'élargir les partenariats avec les nations pro-françaises d'Afrique de l'Ouest afin d'accéder à des réserves pétrolières supplémentaires. Cette initiative renforcera les liens avec ces nations tout en augmentant le portefeuille énergétique de la France. En investissant dans les champs pétroliers ouest-africains, la France peut diversifier ses sources d'énergie et soutenir la stabilité régionale."
 FRA_Issue_10_year_Bonds:0 "Émettre des obligations à dix ans"
 FRA_Issue_10_year_Bonds_desc:0 "Avec l'instabilité économique récente au début de la nouvelle décennie, il devient de plus en plus évident que, pour ne pas être distancée par les autres grandes nations du monde, la France doit employer une stratégie plus proactive en matière de politique économique. L'administration actuelle a élaboré une nouvelle politique monétaire qui sera mise en place par l'émission d'obligations pour le reste de la décennie, à destination des entreprises et des sociétés."
 FRA_Revive_Dirigisme:0 "Relancer le dirigisme"
 FRA_Revive_Dirigisme_desc:0 "Le dirigisme fut crucial pour nos efforts de reconstruction après la fin de la Seconde Guerre mondiale, et la France n'a pas oublié ses racines depuis. Bien que nous ayons récemment évolué vers une approche orientée vers le marché, il n'est jamais trop tard pour revenir à une approche plus sûre face à l'instabilité économique récente comme la pandémie. Avec ce retour national au système du dirigisme, la France prospérera comme elle le fit durant les meilleures années de la République."
 FRA_Invite_New_Age_Technocrats:0 "Inviter les technocrates du nouvel âge"
 FRA_Invite_New_Age_Technocrats_desc:0 "Au tournant du siècle, l'un des secteurs les plus lucratifs et les plus vastes du globe, en particulier pour la France, a été la technologie. Les géants technologiques formés au cours des deux dernières décennies ont dominé le secteur, principalement depuis l'Amérique. La France montrera qu'elle n'est pas de celles qui s'opposent à ces géants industriels, et leur tendra plutôt la main en geste de bonne volonté du peuple français."
 FRA_Purchase_National_Champions:0 "Une nouvelle ère de champions nationaux"
 FRA_Purchase_National_Champions_desc:0 "Alors que nous ouvrons la voie à la domination économique, nous ne devons pas oublier nos propres entreprises françaises qui furent jadis leaders des marchés industriels et économiques. Nous montrerons au reste du monde la supériorité du produit français et de notre innovation. Mais pour y parvenir, nous devons soutenir nos sociétés et veiller à ce qu'elles soient épaulées et comprennent que la France les soutient sur la scène mondiale."
 FRA_Advance_National_Interests:0 "Faire avancer les intérêts nationaux"
 FRA_Advance_National_Interests_desc:0 "Ce qui est le meilleur pour nos sociétés et nos entreprises est ce qui est le meilleur pour la nation française, et cela est définitif. Nous préserverons le bien-être et la prospérité de notre nation par tous les moyens possibles, et toute entreprise souhaitant participer à notre mouvement économique devra adhérer à ces exigences. Elles le comprendront en temps voulu, tandis que la France redevient un acteur majeur du paysage géopolitique du monde moderne, comme elle le fut des décennies plus tôt."
 FRA_Replace_the_ENA:0 "Remplacer l'ENA"
 FRA_Replace_the_ENA_desc:0 "L'École nationale d'administration a été le phare de progrès et de bonne volonté de notre gouvernement envers nos citoyens. Avec pour intention originelle la démocratisation de notre fonction publique, loin du fouillis compliqué de bureaucratie que nous avions, elle est récemment tombée en disgrâce, les années ayant été cruelles pour l'institution. Ce qui a mal tourné, beaucoup se le demandent au sujet de cette institution prestigieuse, mais il semble qu'après des années de mauvaise pratique et de dysfonctionnement, la réponse tienne à ses propres politiques.\n\nAprès de nombreuses discussions délibérées et compliquées avec des leaders de tous les camps du débat, il a été décidé que le seul moyen de corriger ce problème décrépit était de remplacer entièrement l'académie autrefois prestigieuse. Cette fois, nous assurerons sa pérennité, en lui rendant la même réputation prestigieuse qu'elle a eue jadis."
 FRA_Replace_ENA_Veterans:0 "Écarter les vétérans de l'ENA"
 FRA_Replace_ENA_Veterans_desc:0 "Une chose sur laquelle nous pouvons tous nous accorder au sujet de l'École nationale d'administration, c'est que la bureaucratie, et plus précisément les bureaucrates, étaient un fléau qui a transformé notre institution autrefois prestigieuse en ce fouillis compliqué que nous connaissons aujourd'hui. Un changement monumental ayant été opéré, il est désormais évident que ces sangsues tenteront de s'accrocher à tout pouvoir qu'elles détiennent encore. Nous retirerons ces vétérans de leurs positions de grandeur et leur montrerons que le peuple français ne les accueille plus."
 FRA_Institut_national_du_service_public:0 "Naissance de l'INSP"
 FRA_Institut_national_du_service_public_desc:0 "L'Institut national des sciences politiques était l'une des nombreuses propositions rédigées par notre administration qui sont restées dans un classeur dans le bureau de quelque bureaucrate pendant des années. Jusqu'à récemment, il en serait resté ainsi sans les réformes tant nécessaires mises en œuvre sous notre administration, qui nous ont permis de remplacer entièrement l'École nationale d'administration par l'Institut national des sciences politiques. Alors que les membres d'élite de l'ancienne institution sont en émoi, le peuple de France sait que ce changement lui profitera plutôt qu'à la classe supérieure qui a longtemps abusé de son statut et de ses privilèges, l'École nationale d'administration n'en étant plus une."
 FRA_Distribute_ENA_Funds:0 "Redistribuer les fonds de l'ENA"
 FRA_Distribute_ENA_Funds_desc:0 "Avec la fin tant nécessaire de l'École nationale d'administration, la France et notre gouvernement pousseront un soupir de soulagement après que cette offense à notre nation a enfin été décapitée. Après des semaines à passer au peigne fin toutes les dépenses que l'École nationale d'administration consommait de notre budget, le rapport stupéfiant de plus de cent cinquante milliards d'euros a presque provoqué un second tollé. Heureusement, cette fois l'École nationale d'administration a déjà été vidée de tout ce qu'elle avait, et nous pouvons désormais transférer ces fonds vers des institutions françaises bien nécessiteuses qui ont été pillées pendant des décennies grâce à cette vile institution."
 FRA_Disuade_Elitist_Attitudes:0 "Dissuader les attitudes élitistes"
 FRA_Disuade_Elitist_Attitudes_desc:0 "Avec la naissance de l'Institut national des sciences politiques, nous montrerons à ceux qui ont profité des faibles protections de l'École nationale d'administration que leurs comportements élitistes et prédateurs ne sont plus les bienvenus au peuple de France. Nous leur montrerons que notre administration parle pour le peuple, et que le peuple a parlé : les élites ne sont plus les bienvenues dans nos institutions gouvernementales !"
 FRA_Reform_the_Civil_Services:0 "Réformer la fonction publique"
 FRA_Reform_the_Civil_Services_desc:0 "Avec la redistribution des fonds gaspillés de l'École nationale d'administration, nous avons beaucoup de marge pour investir dans les autres parties de notre gouvernement. Avec le vide laissé par l'École nationale d'administration, sa formation à la fonction publique étant mise au rebut, il incombe à notre gouvernement actuel de veiller à ce que le peuple conserve ses possibilités d'accéder à la fonction publique sans les tracas d'autrefois."
 FRA_Laissez_faire:0 "Adopter l'économie du laissez-faire"
 FRA_Laissez_faire_desc:0 "Avec notre éloignement méthodique du système du dirigisme ces dernières décennies au profit d'une grande insistance sur le marché, il semble qu'à la lumière des récents événements géopolitiques, il soit enfin temps pour la France d'adopter le marché libre une fois pour toutes et de recevoir ses glorieux bénéfices. Avec cette perspective économique, la France prospérera et évoluera vers l'ère moderne d'une manière inédite depuis les jours de gloire de notre République."
 FRA_Deconstruct_the_ENA:0 "Déconstruire l'ENA"
 FRA_Deconstruct_the_ENA_desc:0 "L'École nationale d'administration a été le phare de progrès et de bonne volonté de notre gouvernement envers nos citoyens. Avec pour intention originelle la démocratisation de notre fonction publique, loin du fouillis compliqué de bureaucratie que nous avions, elle est récemment tombée en disgrâce, les années ayant été cruelles pour l'institution. Ce qui a mal tourné, beaucoup se le demandent au sujet de cette institution prestigieuse, mais il semble qu'après des années de mauvaise pratique et de dysfonctionnement, la réponse tienne à ses propres politiques.\n\nAprès de nombreuses discussions délibérées et compliquées avec des leaders de tous les camps du débat, il a été décidé que le seul moyen de corriger ce problème décrépit était de remplacer entièrement l'académie autrefois prestigieuse. Cette fois, nous assurerons sa pérennité, en lui rendant la même réputation prestigieuse qu'elle a eue jadis."
 FRA_Begin_Low_Scale_Privatizations:0 "Commencer les privatisations à petite échelle"
 FRA_Begin_Low_Scale_Privatizations_desc:0 "Les privatisations à petite échelle nous sont demandées depuis des décennies par les entreprises qui ont aidé la France économiquement et parfois même financièrement. Avec notre approche économique du laissez-faire, il est enfin temps de céder aux entreprises et aux sociétés en autorisant la privatisation de certaines institutions gouvernementales, permettant une plus grande efficacité et même une concurrence stratégique pour garantir qu'au bout du compte, le citoyen français soit le véritable vainqueur."
 FRA_Increase_Arms_Exports:0 "Accroître les exportations d'armes"
 FRA_Increase_Arms_Exports_desc:0 "Notre complexe militaro-industriel a toujours été l'un des plus grands compte tenu du fait que nous ne sommes pas l'une des superpuissances mondiales de cette époque, mais notre industrie d'armement en particulier a faibli ces dernières années par rapport à notre passé. Avec la récente instabilité géopolitique en Afrique et ailleurs dans le monde, c'est le moment idéal pour que notre nation continue d'expédier les meilleurs produits français à travers le globe."
 FRA_Reduce_International_Sanctions:0 "Réduire les droits de douane internationaux"
 FRA_Reduce_International_Sanctions_desc:0 "Les droits de douane ont toujours été davantage une action politique qu'autre chose... bien sûr, il y a des exceptions comme nos ennemis idéologiques. Quoi qu'il en soit, nous avons été trop sévères ces dernières années et, en conséquence, nous avons perdu une partie cruciale du marché qui désire les produits et l'industrie français. La France restera et ne fera que se renforcer sur le marché international, et cette politique garantira que nous continuions à accroître notre puissance économique."
 FRA_Acquire_Renault:0 "Acquérir Renault"
 FRA_Acquire_Renault_desc:0 "Renault est l'une des sociétés automobiles les plus prestigieuses de France depuis que l'invention de l'automobile est arrivée en France. Bien que connue pour ses voitures, elle a aussi rendu de grands services à notre armée en nous fournissant des véhicules blindés de transport de troupes, des véhicules de combat d'infanterie et même des chars. C'est pour cette raison que, dans un effort d'expansion de nos entreprises nationales sur la scène mondiale, notre administration a demandé à acheter Renault."
 FRA_Nexter_Expansion:0 "Étendre les contrats de Nexter"
 FRA_Nexter_Expansion_desc:0 "Nexter est depuis longtemps une aide pour l'armée française à l'époque moderne de la République. Ils ont notre respect et notre gratitude les plus profonds, et en récompense de leurs contributions à notre armée, nous récompenserons leur travail acharné et leurs efforts en étendant leurs contrats, leur permettant de produire davantage pour notre nation bien-aimée et son armée."
 FRA_Prioritize_Efficient_Economics:0 "Prioriser une économie efficace"
 FRA_Prioritize_Efficient_Economics_desc:0 "Avec l'approche dirigiste en plein essor et nos politiques tenant bon, il est enfin temps de concentrer notre administration sur la garantie que notre plan économique tienne bon et reste aussi efficace que possible. Nous viserons à faire passer nos réformes au Parlement et à veiller à ce que la bureaucratie n'entrave pas la croissance économique de notre nation. Avec le cap dirigé de notre politique et de nos réformes, il semble que le temps de la France comme puissance économique européenne soit potentiellement proche..."
 FRA_Tax_Cuts_to_Defense_Companies:0 "Baisses d'impôts défensives"
 FRA_Tax_Cuts_to_Defense_Companies_desc:0 "Avec l'approche récente de nos difficultés économiques axée sur le laissez-faire, la prochaine grande étape vers une économie totalement libre est de réduire les impôts des sociétés participant à notre système monétaire. En particulier, les entreprises impliquées dans notre complexe militaro-industriel recevront le plus d'avantages, évidemment pour garantir que notre armée ne reçoive rien d'autre que le meilleur."
 FRA_Offer_American_Companies_Refuge:0 "Offrir refuge aux entreprises américaines"
 FRA_Offer_American_Companies_Refuge_desc:0 "Sans aucun doute, la soudaine guerre civile qui a surgi d'Amérique n'a pas seulement coulé notre économie mais aussi les marchés mondiaux. Aussi terrible que cela ait été pour nous, il semble désormais y avoir une lueur d'espoir : d'anciens géants de l'industrie américaine cherchent maintenant à s'implanter sur les marchés européens, et qui serait mieux placé que notre fière nation. La France a pris le rôle dans les efforts de l'Union européenne pour intégrer les entreprises disproportionnellement touchées par la Seconde guerre civile américaine et, espérons-le, les retenir si ce conflit connaît un jour sa fin."
 FRA_Push_for_EU_Asian_Free_Trade:0 "Accord de libre-échange UE-OTDP"
 FRA_Push_for_EU_Asian_Free_Trade_desc:0 "L'Union européenne et l'Organisation du traité du Pacifique ont tous deux subi des coups substantiels : avec la sortie du marché américain, les Russes comme les Chinois ont profité de cette occasion pour pousser agressivement leurs propres intérêts économiques auprès de leurs nations voisines. Pour prévenir leurs agressions combinées, un accord commercial historique entre les deux grandes puissances a été finalisé pour montrer au monde que nous ne craignons pas ces superpuissances mondiales et que nous ne dépendons plus des États-Unis."
 FRA_Strengthen_Anti_Corruption_Laws:0 "Renforcer les lois anticorruption"
 FRA_Strengthen_Anti_Corruption_Laws_desc:0 "Il est enfin temps d'un vrai changement. Un changement qui enverra des ondes de choc dans le climat politique non seulement de notre gouvernement mais de notre climat politique tout entier. Notre administration fera passer plusieurs lois anticorruption qui mettront fin aux échappatoires légales que les législateurs et les bureaucrates utilisent pour contourner la justice. La France montrera à notre nation et au reste de l'Europe que nous sommes les champions de la loi et que personne n'est exempt de responsabilité à l'intérieur de nos frontières."
 FRA_Declare_Wartime_Measures:0 "Déclarer des mesures de guerre"
 FRA_Declare_Wartime_Measures_desc:0 "Avec l'assaut de l'agression russe à travers le globe, nous réalisons enfin qu'il ne peut y avoir de demi-mesures face à des voyous russes de cette sorte. La France montrera l'exemple en prouvant qu'elle est prête et disposée à combattre l'agression russe, et nous encourageons activement le reste de l'Europe à suivre la France à la tête du rempart antirusse qui cherche à détruire notre mode de vie tel que nous le connaissons."
 FRA_Utilize_Consumerism:0 "Recourir au consumérisme"
 FRA_Utilize_Consumerism_desc:0 "La France de l'ère moderne s'est toujours tournée vers le consumérisme, en particulier depuis avant la pandémie. La pandémie étant désormais essentiellement terminée, il incombe à notre gouvernement d'encourager notre nation à revenir à ses habitudes consuméristes pour aider non seulement à relancer nos entreprises mais aussi notre économie. La nation française verra ses entreprises bien-aimées prospérer comme elles le faisaient il y a des années, avant que cette terrible série d'événements ne manque couler notre pays économiquement."
 FRA_Target_Oligarchs:0 "Cibler les oligarques"
 FRA_Target_Oligarchs_desc:0 "Il est temps de s'attaquer à l'une des questions les plus difficiles de notre système profondément défectueux. La question des oligarques a enfin son heure de gloire, notre administration ayant proposé et déjà adopté plusieurs textes législatifs anti-oligarchiques afin non seulement d'endiguer leur influence dans nos systèmes politiques et économiques, mais aussi d'y mettre fin une fois pour toutes. La nation de France et le reste de l'Europe sauront que nous aurons toujours à cœur les meilleurs intérêts de notre peuple et que l'argent ne peut ni acheter ni influencer la machine politique française."
 FRA_Fraternite:0 "Fraternité"
 FRA_Fraternite_desc:0 "Malgré notre paix relative en Europe, la guerre est toujours une certitude. Les tensions croissantes nous ont montré que seul un animal aux dents acérées peut repousser les attaquants ; et compte tenu de l'incapacité de nos alliés américains à contribuer à nos capacités défensives, il serait plus que raisonnable de contribuer fortement à notre propre armée. Quel que soit l'ennemi qui surgisse, qu'il regrette à jamais d'avoir touché à la France."
 FRA_Egalite:0 "Égalité"
 FRA_Egalite_desc:0 "L'égalité économique est une chose que chacun devrait rechercher ; nier l'accumulation de richesse de quelqu'un irait toutefois à l'encontre de nos principes. En maintenant une ligne stable entre richesse et égalité, nous pouvons garantir que notre peuple ait quelque chose pour quoi se battre : un avenir."
 FRA_Liberte:0 "Liberté"
 FRA_Liberte_desc:0 "L'un des fondamentaux de la France est la liberté ; depuis que nous avons levé le drapeau tricolore, nous savons que notre peuple mérite une voix et peut s'exprimer sans punition. En nous concentrant sur nos idéaux républicains, nous exerçons plus d'influence sur notre politique intérieure : l'unité apporte la stabilité, et si nous montrons à notre peuple que, malgré nos différences, nous pouvons vivre librement ensemble."
 FRA_Withdraw_from_Integrated_Military_Command:0 "Se retirer du commandement militaire intégré"
 FRA_Withdraw_from_Integrated_Military_Command_desc:0 "L'une des nombreuses erreurs des régimes précédents fut notre engagement continu envers le commandement intégré de l'OTAN. Pourquoi la France doit-elle lier sa puissance militaire au reste de l'Europe ? Pourquoi devons-nous être limités par des traités et des règlements ? Plus jamais. Il est temps que la France se sépare de ce concept vieillissant. Notre armée ne sera plus attachée à l'OTAN comme un chien. Enfin, nous pourrons façonner notre armée en quelque chose d'uniquement français. Pas britannique, pas italien, pas allemand : français. Nos alliés ne s'en réjouiront pas, mais ils devront accepter que ce résultat soit le meilleur pour toutes les parties."
 FRA_Assure_our_Allies:0 "Rassurer nos alliés"
 FRA_Assure_our_Allies_desc:0 "Quoi qu'en craignent nos alliés, notre nouvelle orientation militaire ne nous conduira pas à abandonner nos engagements envers l'OTAN. Bien que certains, à la frange de la gauche et de la droite, soutiennent continuellement que nous devrions quitter l'alliance, ils ne représentent pas ce que nous défendons. Nous défendons la sécurité collective de toute l'Europe occidentale, et nous serons toujours prêts à risquer nos vies pour défendre la justice et la liberté. La France brillera comme le rempart de l'OTAN, et nous serons prêts à affronter la tyrannie de front, d'où qu'elle vienne."
 FRA_Military_Industrial_Program:0 "Programmes militaro-industriels"
 FRA_Military_Industrial_Program_desc:0 "La guerre est un jeu dangereux. Elle consume tout sur son passage et broie l'économie des nations. Beaucoup de pays sont tombés non devant des soldats ou des chars, mais devant la force invisible de l'attrition. Alors que les tensions s'échauffent dans le monde, nous ne pouvons pas nous permettre de maintenir notre base industrielle à sa taille actuelle. Nos hommes ont besoin de fournitures : fusils, balles, carburant et nourriture. Ces essentiels sont nécessaires au fonctionnement de base de notre armée. De nouveaux plans industriels nous permettront d'approvisionner notre armée et nos alliés en fournitures et matériaux pour survivre aux guerres futures."
 FRA_Redistribute_NATO_Funding:0 "Redistribuer nos contributions à l'OTAN"
 FRA_Redistribute_NATO_Funding_desc:0 "Avec notre nouveau rôle réduit au haut commandement de l'OTAN, nous devons déterminer quoi faire de nos ressources nouvellement acquises. Pendant bien trop longtemps, les services sociaux français ont survécu avec le strict minimum. Ils recevaient le minimum de subventions du gouvernement, tandis que l'armée voyait constamment son budget augmenter. Cela a été l'un des plus grands échecs de notre gouvernement, et nous cherchons à corriger ce problème une fois pour toutes. De nouvelles subventions seront accordées aux services dans tout le pays. Cela sert non seulement à utiliser les dépenses excédentaires que nous consacrions au haut commandement, mais aussi à réduire la pauvreté et le chômage croissants."
 FRA_A_New_Doctrine:0 "Nouvelles doctrines stratégiques"
 FRA_A_New_Doctrine_desc:0 "La guerre est un jeu de changement constant. Les tactiques deviennent obsolètes, les armes se démodent, et rien ne reste identique. Dans la quête de supériorité sur nos ennemis, le changement n'est pas seulement nécessaire : il est obligatoire. Nos ennemis sont imprévisibles. Ils utiliseront toutes les tactiques, aussi dépassées soient-elles. Nous devons donc rester sur nos gardes. L'adaptabilité doit devenir le cœur de notre doctrine militaire, afin de toujours avoir le dessus sur l'ennemi, quelles que soient les chances."
 FRA_Civic_Construction_Plans:0 "Programmes de construction civile"
 FRA_Civic_Construction_Plans_desc:0 ""
 FRA_New_Stretegic_Concepts:0 "Nouveaux concepts stratégiques"
 FRA_New_Stretegic_Concepts_desc:0 "Depuis qu'elle existe, l'OTAN a toujours été préparée à la possibilité d'une guerre totale avec l'URSS durant la guerre froide. Sans que cela ne se réalisât jamais, la crainte de la guerre a persisté, même après l'effondrement de l'Union soviétique. Mais à l'aube du XXIe siècle, nombre de nos doctrines et concepts ont été jugés dépassés. Des plans et tactiques qui auraient fonctionné il y a des années sont désormais rendus obsolètes par les progrès de la technologie. Il est donc nécessaire de procéder à une réévaluation complète des concepts stratégiques actuels de l'OTAN, pour garantir que nous soyons prêts à toute éventualité, y compris une guerre totale avec Moscou."
 FRA_Establish_Romanian_Forward_Operating_Bases:0 "Bases avancées roumaines"
 FRA_Establish_Romanian_Forward_Operating_Bases_desc:0 "Depuis l'adhésion de la Roumanie à l'OTAN en 2004, elle a été un atout clé dans la défense de l'Europe de l'Est. Sa position le long de la mer Noire, combinée à une frontière avec l'Ukraine, nous a permis de projeter notre puissance dans cette région pendant des années. Bien que notre rôle à l'Est ait toujours été passif, les provocations récentes de l'ours russe ont montré que le temps de la passivité est révolu. Dans le cadre de nos plans de mobilisation, des bases en Roumanie seront modernisées et agrandies, nous permettant non seulement de projeter notre puissance, mais aussi de répondre à toute action militaire potentielle, surtout concernant l'Ukraine."
 FRA_A_European_Turkey:0 "Le remède de l'homme malade"
 FRA_A_European_Turkey_desc:0 "La Turquie est une énigme. Malgré son appartenance à l'OTAN, nous nous sommes souvent heurtés à elle, notamment à propos de son intervention dans la guerre civile syrienne. Dans son état actuel, la Turquie est à un carrefour. Pour sécuriser notre emprise à l'Est, nous devons veiller à ce qu'Ankara soit pleinement engagée dans l'OTAN. Sa position de gardienne de la mer Noire nous offre le contrôle de l'une des routes maritimes les plus importantes de Russie, nous permettant de bloquer le commerce et même de frapper dans le Caucase en cas de guerre."
 FRA_Baltic_Defense_Plan:0 "Préparation défensive baltique"
 FRA_Baltic_Defense_Plan_desc:0 "Sans être le principal objectif de l'agression russe, les États baltes sont menacés par la présence menaçante de l'ours. Depuis la dissolution de l'Union soviétique, Moscou lorgne cette région avec convoitise. Et en cas de guerre, ils sont tenus d'envahir et de tenter de submerger nos alliés. Nous devons donc mettre en œuvre des programmes pour renforcer les défenses de l'OTAN dans la région. Défendre les États baltes garantit que la Russie n'a pas accès à des ports en eaux chaudes, ce qui améliore considérablement nos chances de repousser une éventuelle invasion russe."
 FRA_Arm_the_TSK:0 "Préparation défensive turque"
 FRA_Arm_the_TSK_desc:0 "Au plus fort de la guerre froide, la Turquie était un point d'ignition des tensions entre l'Est et l'Ouest. Pont entre le Moyen-Orient et l'Europe, la Turquie se positionne comme une rampe de lancement pour toute invasion potentielle dans le Caucase ou au Moyen-Orient. Bien que l'armée turque ait toujours été prête à toute invasion hypothétique, nous devons veiller à ce que les Russes ne puissent pas marcher sur Ankara. Quel qu'en soit le coût, nous devons empêcher la chute de notre allié le plus important. Car sa chute déclencherait une réaction en chaîne, ouvrant toute la région des Balkans à une prise par la Russie."
 FRA_Improve_Conversion_Efficiency:0 "Améliorer l'efficacité de la conversion"
 FRA_Improve_Conversion_Efficiency_desc:0 ""
 FRA_Supremacy_in_the_Skies:0 "Suprématie dans les airs"
 FRA_Supremacy_in_the_Skies_desc:0 "Depuis la Première Guerre mondiale, la guerre aérienne est un élément clé du fonctionnement des armées modernes. Les chasseurs fournissent un appui aérien rapproché aux troupes au sol, tandis que les bombardiers réduisent villes et usines en ruines. Une nation dépourvue de force aérienne est à la merci de tout envahisseur. Dans le cadre de nos plans de revitalisation de notre force aérienne, nous cherchons non seulement à disputer les airs, mais à les dominer. Nos chasseurs patrouilleront dans le ciel. Nos bombardiers réduiront les forces ennemies en ruines. Et nos ennemis apprendront à craindre la vue des avions français dans le ciel."
 FRA_Increase_our_Black_Sea_Presence:0 "Accroître notre présence en mer Noire"
 FRA_Increase_our_Black_Sea_Presence_desc:0 "La mer Noire est l'une des voies navigables les plus cruciales du monde. De nombreuses nations en dépendent non seulement pour faciliter le commerce, mais aussi pour protéger leurs intérêts nationaux. Depuis la saisie de la Crimée en 2014 par Moscou, un dangereux glissement de pouvoir s'est produit. La région menace désormais de devenir un lac d'eaux chaudes russe. Dans le cadre de notre programme d'expansion navale, nous nous efforcerons de dominer la mer Noire et d'éclipser la présence russe dans la région. Car si nous laissons la région tomber aux mains des Russes, cela menacera non seulement l'Ukraine mais aussi nos alliés de la région."
 POLITICS_EMMANUEL_MACRON_DESC:0 "Emmanuel Jean-Michel Frédéric Macron est un ancien banquier d'affaires, ancien ministre et actuel président de la Cinquième République française. Jeune et élevé dans un foyer non religieux, il a demandé à être baptisé dans l'Église catholique. Il se déclarera toutefois plus tard agnostique et adoptera une idéologie de gauche, qu'il attribue à sa grand-mère. Il a étudié la philosophie et l'économie à l'École normale supérieure, puis a fréquenté l'École nationale d'administration. Après ses études, il a travaillé comme banquier d'affaires pour Rothschild & Cie Banque, où il a gagné son premier million sur une opération de neuf milliards de dollars qu'il a contribué à négocier. En 2012, il fut nommé ministre de l'Économie, de l'Industrie et du Numérique, fonction qu'il quitta en 2016 pour lancer sa campagne présidentielle.\n\nComme président, Macron a poursuivi un programme de réformes économiques, notamment la réduction des dépenses publiques et la déréglementation du marché du travail. Sa présidence a été entachée de protestations massives, dont le mouvement des « gilets jaunes », né fin 2018 en réaction aux hausses proposées de la taxe sur les carburants. Macron a qualifié la colonisation de l'Algérie par la France de « crime contre l'humanité » et l'intervention en Libye d'« erreur historique ». Pendant ce temps, la France exerce encore son influence sur les pays vulnérables d'Afrique de l'Ouest depuis l'ombre, et l'on ne sait pas jusqu'où Macron est prêt à aller pour préserver les intérêts français. Malgré ces défis, Macron reste une figure de premier plan sur la scène internationale, militant pour la coopération mondiale sur des questions telles que le changement climatique, la sécurité internationale et l'unité entre les nations européennes."
 POLITICS_JEANLUC_MELENCHON_DESC:0 "Jean-Luc Mélenchon, le nouveau président élu de la Cinquième République française, n'est pas seulement un homme politique, mais un défenseur passionné du changement social et des droits humains. Issu d'une famille ouvrière, Mélenchon a appris très tôt la valeur de la solidarité et de la communauté. Son éducation lui a inculqué une profonde empathie pour les luttes des gens ordinaires et une détermination à défendre leurs droits. Formé en philosophie et en économie, la curiosité intellectuelle de Mélenchon et son engagement pour la justice sociale l'ont conduit à une carrière politique. Ancien enseignant et militant, il comprend le pouvoir de l'éducation et de l'organisation de base pour produire un changement significatif.\n\nComme dirigeant, Mélenchon est connu pour sa rhétorique ardente et ses principes intransigeants. Sa présidence est guidée par la vision d'une société plus juste et plus équitable, où richesse et pouvoir sont répartis plus équitablement et où chacun a la possibilité de s'épanouir."
 POLITICS_OLIVIER_FAURE_DESC:0 "Olivier Faure est une figure de premier plan du paysage politique français, actuellement secrétaire du Parti socialiste. Né dans une famille politiquement engagée, il a grandi baigné dans les discussions sur la justice sociale et les valeurs progressistes. Son parcours académique l'a conduit dans les couloirs de Sciences Po, où il a affiné sa compréhension de la théorie politique et des questions sociales. Sa carrière politique a commencé comme conseiller et a rapidement évolué vers un rôle de direction, reflétant son profond engagement envers les idéaux du socialisme.\n\nComme président, Faure défend une France qui priorise l'équité sociale, la durabilité environnementale et la justice économique. Il croit au pouvoir de l'action collective et vise à unir la gauche sous une bannière commune pour relever les défis pressants de la nation. Son approche pragmatique cherche à équilibrer idéalisme et objectifs politiques réalisables, s'efforçant de renouer avec les électeurs privés de leurs droits tout en promouvant des réformes qui élèvent la classe ouvrière. La vision de Faure est celle de la solidarité, où les voix des marginalisés sont amplifiées et où les idéaux de la Révolution française — liberté, égalité, fraternité — prennent vie."
 POLITICS_FRANCOIS_RUFFIN_DESC:0 "François Ruffin est un journaliste, cinéaste et militant politique influent, surtout connu pour son approche de la politique par la base et son engagement indéfectible envers la justice sociale. Issu d'un foyer modeste, Ruffin a développé une forte empathie pour les luttes de la classe ouvrière, qui informera plus tard son travail de défense des défavorisés. Il s'est fait connaître par ses films documentaires mettant en lumière des questions sociales, capturant les réalités auxquelles sont confrontés les citoyens ordinaires dans la France contemporaine.\n\nComme président, Ruffin incarne la voix du peuple, priorisant l'engagement direct avec les électeurs et l'organisation communautaire. Ses discours passionnés et son style conflictuel défient l'establishment politique, exhortant à des réformes qui s'attaquent aux inégalités de revenus, aux droits des travailleurs et aux préoccupations environnementales. La vision de Ruffin pour la France est celle d'une démocratie revitalisée par la participation citoyenne active, et où les politiques reflètent les besoins et les aspirations de la classe ouvrière. Il cherche à créer une nation où chaque citoyen se sent habilité à exiger le changement et a sa place à la table du gouvernement."
 POLITICS_MARINE_LEPEN_DESC:0 "Marine Le Pen, la nouvelle présidente élue de la Cinquième République française, n'est pas seulement une femme politique, mais une mère et une fille profondément enracinée dans le tissu de la société française. Élevée dans un foyer politique, elle a observé de première main les luttes et les triomphes de son père, Jean-Marie Le Pen, lorsqu'il dirigeait le Front national. Malgré leurs divergences idéologiques, Marine porte en elle un sens du devoir familial et une détermination à laisser sa marque sur la politique française. Formée en droit à l'université Panthéon-Assas, la carrière précoce de Le Pen comme avocate lui a donné un aperçu des injustices auxquelles font face les citoyens ordinaires. Cette expérience a nourri sa passion pour la justice et son engagement à défendre les droits du peuple français.\n\nComme mère, Le Pen comprend l'importance de la sécurité et de la stabilité pour les familles de toute la France. Sa présidence est motivée par le désir de créer un avenir plus sûr et plus prospère pour la prochaine génération, libéré des incertitudes de la mondialisation et de l'érosion culturelle."
 POLITICS_ERIC_ZEMMOUR_DESC:0 "Éric Zemmour, le nouveau président élu de la Cinquième République française, n'est pas seulement un éditorialiste, mais un penseur qui n'a pas peur de remettre en question le statu quo et de dire ce qu'il pense. Élevé dans un quartier multiculturel de Paris, Zemmour a vécu de première main les tensions et les complexités de l'immigration et de la diversité. Ses premières expériences ont façonné sa vision du monde et lui ont inculqué un profond sentiment d'identité nationale et de fierté culturelle. Formé en droit et en sciences politiques, la carrière de Zemmour comme journaliste et auteur a été définie par sa volonté d'affronter des sujets tabous et de défier les récits dominants. Sa défense sans excuse des valeurs et traditions françaises a fait de lui une figure polarisante, mais lui a aussi valu un suivant dévoué parmi ceux qui se sentent marginalisés ou ignorés par la politique dominante.\n\nComme dirigeant, Zemmour est guidé par la conviction de l'importance de préserver l'héritage culturel et l'identité nationale de la France. Sa présidence est motivée par le désir de protéger la souveraineté française, de renforcer les frontières et de rétablir l'ordre public dans les communautés françaises."
 POLITICS_PIERRE_DEVILLIERS_DESC:0 "Pierre De Villiers, le nouveau président élu de la Cinquième République française, n'est pas seulement un chef militaire, mais un homme d'honneur et d'intégrité avec un profond sens du devoir envers son pays. Né dans une famille militaire, De Villiers a appris très tôt les valeurs de discipline et de service. Son père, un général décoré, lui a inculqué l'amour de son pays et l'engagement à défendre ses intérêts. Formé en stratégie militaire et en commandement, la carrière distinguée de De Villiers dans les forces armées l'a conduit dans certaines des régions les plus difficiles et dangereuses du monde. Ses expériences sur le champ de bataille ont façonné sa compréhension de la géopolitique et des complexités de la guerre moderne.\n\nComme dirigeant, De Villiers est connu pour son humilité et sa volonté d'écouter les conseils d'experts et de conseillers. Sa présidence est guidée par la conviction de l'importance de la force par l'unité et la coopération, tant au pays qu'à l'étranger. Il est déterminé à maintenir la réputation de la France comme leader mondial et défenseur de la démocratie et des droits humains."
 POLITICS_JADOT_DESC:0 "Yannick Jadot est le leader charismatique du parti Europe Écologie - Les Verts et une figure de premier plan du mouvement environnemental français. Né en 1967, il a grandi dans une famille qui lui a inculqué une passion pour la nature et la durabilité. Sa formation en sciences politiques et en relations internationales a nourri son engagement sur les questions environnementales, le conduisant à travailler pour diverses ONG avant d'entrer en politique.\n\nLa carrière politique de Jadot est caractérisée par son dévouement indéfectible à la lutte contre le changement climatique et à la défense des politiques vertes. Il estime que la crise écologique n'est pas seulement un problème environnemental mais aussi social et économique, exigeant une action urgente pour protéger la planète et les communautés vulnérables. Membre du Parlement européen, il a défendu une législation climatique ambitieuse et poussé pour un pacte vert européen. Jadot envisage un avenir où la France montre la voie en matière de durabilité, de transition énergétique et d'équité sociale, promouvant une vision d'une société juste qui priorise la santé de la planète."
 POLITICS_PECRESSE_DESC:0 "Valérie Pécresse est une femme politique chevronnée et la leader du parti Les Républicains, connue pour son approche pragmatique de la gouvernance et son attention à la réforme économique. Élevée dans une famille politiquement active, Pécresse a développé très tôt un vif intérêt pour le service public. Elle a étudié à Sciences Po puis obtenu un diplôme de l'École nationale d'administration, ce qui a ouvert la voie à sa carrière politique réussie.\n\nAncienne ministre de l'Enseignement supérieur et de la Recherche, Pécresse est attachée à la réforme éducative et à l'innovation. Son style de direction met l'accent sur la responsabilité budgétaire, la sécurité publique et l'importance d'une identité nationale forte. La vision de Pécresse pour la France inclut de revitaliser l'économie, de lutter contre le chômage et de veiller à ce que la nation reste compétitive sur la scène mondiale. Elle cherche à unir le centre droit sous une bannière de conservatisme moderne, défendant des politiques qui équilibrent protection sociale et croissance économique, tout en répondant aux préoccupations d'un électorat divers."
 POLITICS_BARDELLA_DESC:0 "Jordan Bardella est une étoile montante de l'arène politique et le jeune leader du Rassemblement national, incarnant une nouvelle génération de politique d'extrême droite en France. Né en 1995, Bardella a été élevé dans une famille qui encourageait de fortes convictions politiques, et il s'est rapidement engagé en politique pendant son adolescence. Ses études en sciences politiques ont encore nourri ses ambitions, le conduisant à devenir porte-parole du parti puis son président.\n\nLe leadership de Bardella est marqué par l'accent sur le nationalisme, le contrôle de l'immigration et l'ordre public. Il se présente comme la voix des citoyens français « oubliés », défendant des politiques qui priorisent leurs besoins et leurs préoccupations. Sous sa direction, le Rassemblement national cherche à reconquérir l'identité de la France, en mettant l'accent sur une forte défense de l'héritage culturel et des valeurs traditionnelles. Le style oratoire dynamique de Bardella et sa capacité à dialoguer avec les jeunes électeurs l'ont propulsé sous les projecteurs, alors qu'il vise à renforcer l'influence du parti dans la politique française et à défier le statu quo."
 POLITICS_ROUSSEL_DESC:0 "Fabien Roussel est une figure de premier plan du Parti communiste français, devenu un dirigeant important au lendemain de la guerre civile. Issu d'une famille ouvrière, les premières expériences de Roussel ont façonné son engagement profond envers les droits des travailleurs et la justice sociale. Son parcours politique a commencé comme conseiller local, où il a rapidement été reconnu pour sa défense des questions du travail et de l'autonomisation communautaire.\n\nAu lendemain de la guerre civile, Roussel est devenu une force unificatrice pour la gauche, s'efforçant de reconstruire une société fracturée et de donner la parole aux exclus. Il incarne la résilience de la classe ouvrière, défendant une nouvelle vision socialiste qui priorise l'équité économique, la durabilité environnementale et des services sociaux robustes. Les discours passionnés et les compétences d'organisation de base de Roussel galvanisent le soutien de ceux qui aspirent à une France plus juste et équitable.\n\nSon style de direction met l'accent sur la collaboration et la solidarité, cherchant à unir diverses factions de la gauche pour défier le statu quo. Alors que la France affronte les conséquences du conflit, Roussel envisage un avenir où l'action collective mène à un changement significatif, créant une société où chaque citoyen a la possibilité de s'épanouir et où les idéaux de liberté, d'égalité et de fraternité sont véritablement réalisés."
 POLITICS_COQUEREL_DESC:0 "Éric Coquerel est une figure de gauche de premier plan, connue pour sa défense farouche de la justice sociale et de l'égalité économique. Né en 1974, Coquerel a grandi dans une famille politiquement engagée, qui a inspiré son engagement de toujours pour les causes de gauche. Il a une formation en économie et en sciences politiques, et son activisme s'étend sur des décennies, se concentrant sur des questions telles que les droits des travailleurs, la justice environnementale et les mesures anti-austérité.\n\nMembre de l'Assemblée nationale, Coquerel est reconnu pour ses discours passionnés et son dévouement inflexible envers ses électeurs. Il croit au pouvoir des mouvements de base et de l'action collective pour produire un changement significatif. La vision de Coquerel pour la France inclut un engagement envers l'équité sociale, le développement durable et la revitalisation des services publics. Il cherche à mobiliser la gauche et à unir divers groupes autour d'une cause commune, luttant pour une France où chacun a accès aux opportunités et aux droits fondamentaux."
 POLITICS_BENEDETTI_DESC:0 "Yvan Benedetti est un chef nationaliste fervent qui s'est imposé au lendemain de la guerre civile, incarnant une idéologie fasciste sans excuse, rappelant les aspirations politiques des débuts de Benito Mussolini. Né en 1980, les années formatrices de Benedetti furent baignées d'un climat d'agitation politique, façonnant sa vision d'un État fort et autoritaire qui priorise les intérêts des citoyens français de souche avant tout.\n\nBenedetti défend une transformation radicale de la France, qui cherche à éliminer les menaces perçues contre l'identité nationale et à restaurer ce qu'il considère comme la gloire passée du pays. Ses discours résonnent auprès de ceux qui se sentent désillusionnés par la politique traditionnelle, promettant un retour à un leadership fort et un rejet du multiculturalisme. La rhétorique de Benedetti se caractérise par un nationalisme ardent, un mépris pour la démocratie libérale et un appel à l'unité parmi ceux qui partagent sa vision d'une France homogène.\n\nAlors qu'il consolide son pouvoir, le leadership de Benedetti est marqué par son ambition de créer un régime centralisé et autoritaire, faisant écho aux débuts du fascisme en Italie. Il cherche à démanteler les structures politiques existantes, les remplaçant par un nouvel ordre qui met l'accent sur la loyauté envers l'État et une adhésion stricte à sa vision de l'identité française. Dans une nation divisée, Benedetti se présente comme le champion intransigeant de la fierté nationale, prêt à prendre le contrôle et à redéfinir l'avenir de la France."
 FRA_form_a_scientific_committe_to_combat_the_pandemic:0 "Former un comité scientifique"
 FRA_form_a_scientific_committe_to_combat_the_pandemic_desc:0 "La nouvelle pandémie de COVID-19 a déjà commencé à se répandre à un rythme rapide en France, en Europe et dans le monde entier, après que les autorités locales de Wuhan et du reste de la Chine n'ont pas empêché sa propagation. Bien que la pandémie continue de se répandre et que le virus ne disparaisse pas de sitôt, la première étape pour combattre le virus est de le comprendre, et pour ce faire, le gouvernement français devra former un comité scientifique. Le comité, composé d'experts de divers domaines tels que la pathologie, la biologie et l'économie, ainsi que de personnes de diverses agences gouvernementales, pourra rédiger une première série de plans et de recommandations que le gouvernement français mettra en œuvre dans notre lutte contre la COVID-19."
 FRA_research_the_vaccine:0 "Lancer la recherche sur le vaccin"
 FRA_research_the_vaccine_desc:0 "Le SARS-CoV-2, populairement connu sous le nom de covid-19 ou coronavirus, s'est déjà révélé très infectieux et capable de provoquer des maladies dangereuses et potentiellement mortelles chez ceux qu'il infecte, de nombreux hôpitaux manquant déjà de respirateurs pour traiter les patients. Bien que des méthodes comme les confinements et le port du masque soient déjà envisagées et parfois mises en œuvre, il est clair qu'un vaccin sera nécessaire pour véritablement mettre fin à la pandémie de COVID-19. Le comité scientifique a déjà rencontré des délégués de grandes sociétés biotechnologiques françaises, dont Sanofi Pasteur, et a recommandé que la recherche et le développement d'un vaccin commencent immédiatement."
 FRA_enforce_a_lockdown_to_buy_time:0 "Proclamer le mandat de confinement"
 FRA_enforce_a_lockdown_to_buy_time_desc:0 "La propagation rapide de la pandémie de COVID-19 a déjà commencé à submerger la capacité de nombreux hôpitaux en France à recevoir de nouveaux patients, et il est clair que des mesures drastiques doivent être prises pour empêcher la poursuite de la propagation. Le comité scientifique a recommandé des confinements massifs qui, bien qu'entraînant presque certainement un grave refroidissement de l'économie française à court terme, sauveront probablement des dizaines de milliers de vies françaises et soulageront largement le système national de santé."
 FRA_ease_the_restrictions:0 "Assouplir le mandat"
 FRA_ease_the_restrictions_desc:0 "Il est clair que ni notre économie ni notre société ne peuvent supporter les restrictions de confinement actuelles. Pour garantir que notre situation politique ne parte pas en vrille, nous devons assouplir certaines de nos réglementations. La France surmontera cette tempête."
 FRA_keep_the_restrictions:0 "Renforcer le mandat"
 FRA_keep_the_restrictions_desc:0 "Nos médecins nous ont apporté des nouvelles terrifiantes. Il semble que les précédentes estimations des taux de mortalité étaient trop optimistes. Le plus terrifiant, c'est que près de 45 % de nos personnes âgées en meurent (contre seulement 17 % selon les prévisions initiales). Si l'on ne comprend pas pourquoi même les prédictions les plus pessimistes se sont révélées fausses, ni pourquoi d'autres pays semblent avoir des taux de mortalité moins graves (peut-être le virus auquel nous sommes exposés est-il une forme évoluée de la souche initiale ?), nous ne pouvons pas laisser notre peuple en souffrir davantage."
 FRA_expand_welfare_payments:0 "Approuver des plans de relance"
 FRA_expand_welfare_payments_desc:0 "Notre économie a subi un coup sévère, mais notre peuple doit passer avant tout. Privés de travail pendant des mois, beaucoup ne pourront manifestement pas survivre sans notre soutien. Nous devons protéger notre peuple avant toute chose. Pour l'heure, c'est nous qui paierons."
 FRA_push_vaccine_research:0 "Alléger la paperasse médicale"
 FRA_push_vaccine_research_desc:0 "La situation est trop grave pour notre vieille bureaucratie figée. Nos soignants doivent employer toutes les ressources disponibles pour affronter cette pandémie. Ils sont notre seul espoir."
 FRA_push_for_mass_vaccinations:0 "Imposer la vaccination obligatoire"
 FRA_push_for_mass_vaccinations_desc:0 "Les premiers vaccins arrivent et nous pouvons désormais les diffuser dans toute la France. Nous imposerons la vaccination aux agents publics, aux militaires et aux services publics, et nous encouragerons nos entreprises à suivre cet exemple. Bien sûr, cette idée suscite déjà des résistances. Certains affirment que nous ne pouvons pas les contraindre à se faire vacciner. Ils refusent simplement de voir les morts qui s'accumulent malgré nos restrictions. Nous ne pouvons pas faire comme si tout était normal. Aucun risque ne vaut la peine d'être pris."
 FRA_look_to_the_swedes:0 "Réponse suédoise, problème français"
 FRA_look_to_the_swedes_desc:0 "Le gouvernement suédois avait choisi de ne pas imposer de restrictions sanitaires sévères. Nous ne savons pas encore si cette stratégie freine réellement le virus, mais nous savons que le pays a su stabiliser son économie. Nous devrions suivre leur exemple et veiller à ce que la vie reprenne son cours normal. Il suffit d'accorder davantage de fonds aux hôpitaux, de prendre quelques mesures légères et que chacun retourne au travail !"
 FRA_revitalise_the_economy:0 "Programme de relance économique"
 FRA_revitalise_the_economy_desc:0 "La pandémie de COVID-19 a détruit une grande partie de la croissance économique mondiale. Poursuivre les mesures sanitaires ne ferait qu'aggraver les effets de cette crise. Nous ne pouvons pas laisser notre pays sombrer en un moment aussi crucial !"
 FRA_develop_immunity:0 "Favoriser l'immunité"
 FRA_develop_immunity_desc:0 "La vaccination généralisée serait sans doute la meilleure solution, mais nous ne pouvons pas gaspiller nos ressources limitées et notre argent dans un développement indépendant de vaccins. Nous devons toutefois éviter de dépendre du Pfizer américain. Pour cela, notre ministère de la Santé a proposé de « favoriser l'immunité » au sein de la population. C'est un pari risqué, mais si nous finançons le traitement des symptômes graves tandis que le reste de la population s'automédique avec des médicaments « anti-symptômes » approuvés par le gouvernement, cela pourrait fonctionner. Chacun pourra reprendre le travail comme si rien ne s'était passé."
 FRA_Restart_of_the_protests:0 "La révolution des gilets"
 FRA_Restart_of_the_protests_desc:0 "Bon sang, il fallait bien sûr que les gilets jaunes manifestent aussi. Formidable. La solidarité nationale et l'unité, tu parles ! Nous devons régler cette crise au plus vite, faute de quoi leurs troubles feront sombrer tout notre processus de redressement."
 FRA_push_through_reforms:0 "Plier le genou"
 FRA_push_through_reforms_desc:0 "Nous ne pouvons vraiment pas gérer cela maintenant. Notre économie est au plus bas et le pays a cessé toute activité. Nous devons tout faire pour sauver la situation. Acceptons toutes leurs conditions."
 FRA_try_to_negotiate:0 "À la table des négociations"
 FRA_try_to_negotiate_desc:0 "Aussi mauvaise que soit la situation... nous pourrions peut-être contourner le problème. Essayons de voir s'ils acceptent de limiter leurs ambitions. Cela pourrait peut-être fonctionner ?"
 FRA_the_negotiations_fail:0 "Diviser pour régner"
 FRA_the_negotiations_fail_desc:0 "Très bien, s'ils veulent la manière forte, ils l'auront. Envoyez la police disperser les manifestations, montrez les voitures brûlées et les destructions qu'ils ont causées. La France connaîtra ses « héros »."
 FRA_accept_modifications:0 "Un heureux compromis"
 FRA_accept_modifications_desc:0 "Une négociation remarquable ! Nous pourrons ainsi apaiser les gilets jaunes sans perdre autant d'argent en dépenses sociales ! La France a toujours été réputée pour son attention aux travailleurs, et cela vient d'être prouvé."
 FRA_negotiate_with_the_syndicates:0 "Travailler avec les syndicats"
 FRA_negotiate_with_the_syndicates_desc:0 "Nous devons montrer au monde que ces émeutiers ne représentent pas le travailleur français. Appuyez-vous sur les syndicats et leur soutien à nos institutions pour éteindre les flammes. Achetez le ralliement des syndicats qui ont rejoint les protestations afin qu'ils les désavouent. La France ne pliera pas le genou devant des voyous violents."
 FRA_back_to_normalcy:0 "Ancrer les réformes"
 FRA_back_to_normalcy_desc:0 "Conformément à l'accord conclu avec les gilets jaunes, nous inscrirons nos réformes dans la loi. La France a survécu à une crise de plus !"
 FRA_The_Opening_Volley:0 "La première salve"
 FRA_The_Opening_Volley_desc:0 "Depuis sa création dans les années 1970, le Front national est une force tumultueuse de la vie politique française. Marine Le Pen s'est efforcée d'éliminer les éléments fascistes et pétainistes du parti, mais beaucoup le considèrent encore comme un mouvement d'extrême droite. Quoi qu'il en soit, Le Pen a annoncé sa candidature à la présidentielle de 2022 et, face aux graves difficultés économiques et aux troubles que connaît la France, nombreux sont ceux qui estiment qu'elle représente une menace sérieuse pour la candidature de Macron à un second mandat. Seul l'avenir dira qui remportera l'élection, mais le résultat suscitera à coup sûr colère et polarisation."
 FRA_en_marche:0 "Marcher avec Macron"
 FRA_en_marche_desc:0 "La victoire de Macron en 2016 a donné à la France l'occasion d'avoir enfin une république débarrassée du radicalisme et de l'instabilité politique, une république qui apporterait la paix et la sécurité à l'Europe et au monde par la collaboration et la compréhension, mais saurait recourir à la force lorsque cela est nécessaire face aux forces tyranniques. Une république qui offrirait de nouvelles perspectives aux minorités et aux immigrés pour prendre part à une France multiculturelle tout en respectant l'honorable culture française. Une république qui serait véritablement à la hauteur de la devise révolutionnaire : Liberté, égalité, fraternité. C'est cette république que les fascistes traîtres du Front national veulent détruire, mais la victoire de Macron aux élections de 2022 dispersera une dernière fois leurs sombres espoirs."
 FRA_rassemblent_national:0 "Se tourner vers Le Pen"
 FRA_rassemblent_national_desc:0 "Pendant des décennies, le Front national est resté en marge de la vie politique française, ne surgissant qu'occasionnellement pour retomber aussitôt dans l'oubli, mais avec la campagne de Marine Le Pen, cela change enfin. Les politiques libérales de l'establishment macronien ont manifestement mené la France au bord de la ruine, et il est temps de changer. La France ne cédera plus sa souveraineté à des organisations supranationales non élues, et la volonté du peuple français ne sera plus ignorée par les bureaucrates de Bruxelles. Les élitistes libéraux n'auront pas l'occasion de démanteler le filet de sécurité sociale du peuple français. Les hordes violentes d'islamistes n'imposeront plus leur extrémisme religieux fanatique aux Français. Non, en 2023, la France sera libre."
 FRA_the_west_african_sphere:0 "§YOpération§!: Éléphant"
 FRA_the_west_african_sphere_desc:0 "Nos intérêts en Afrique ont toujours été évidents. Les terres qui furent nos colonies restent liées à nous sur les plans économique, linguistique et militaire. Beaucoup de « gauchistes » affirment que nous devons abandonner cette région, voyant nos efforts de stabilisation comme du « néocolonialisme ». Ils ne comprennent pas que nous ne pouvons pas laisser nos frères francophones être dévorés par les djihadistes et les juntes soutenues par la Russie. Nous devons concentrer nos efforts pour ramener la région sous contrôle."
 FRA_economic_assistance:0 "Intervention économique"
 FRA_economic_assistance_desc:0 "Nos amis francophones ont toujours connu une situation économique difficile. Constamment harcelés par les insurgés, ils n'ont jamais pu développer leurs industries nationales aussi bien que le Nigeria au sud. Nous devons changer cela. Nos fonds redonneront vigueur à l'économie ouest-africaine. Et bien entendu, une partie de cette richesse nous reviendra..."
 FRA_military_assistance:0 "Aide militaire"
 FRA_military_assistance_desc:0 "Si la situation économique de l'Afrique de l'Ouest a toujours besoin d'un coup de pouce, rien ne peut être accompli sans stabiliser les conflits régionaux. Nos forces saignent dans cette région depuis dix ans, mais sans que les gouvernements locaux alignent des armées efficaces, tout cela sera vain. Garantir un réseau solide d'armées locales sous notre coordination sera essentiel dans nos plans futurs."
 FRA_combat_islamic_terrorism:0 "Réprimer l'extrémisme islamique"
 FRA_combat_islamic_terrorism_desc:0 "L'influence russe est une menace pesante qui plane sur nos projets africains, mais les djihadistes sont une menace plus urgente. Les traiter sera notre préoccupation immédiate. Les Russes et leurs fantoches ne souhaitent pas non plus que les islamistes gouvernent. Outre nos partenaires francophones, la coopération du Nigeria sera essentielle à cette opération."
 FRA_cease_social_dumping:0 "Mettre fin au dumping social"
 FRA_cease_social_dumping_desc:0 "Nous devons faire passer notre peuple avant tout. Nos régions les plus pauvres sont tourmentées par des entreprises qui bafouent le droit du travail. Nos travailleurs doivent être mieux payés, car l'idéal français est de prendre soin de nos régions rurales."
 FRA_tackle_trade_unions:0 "Écraser les syndicats"
 FRA_tackle_trade_unions_desc:0 "Les communistes nous critiquent toujours pour « ne pas soutenir les travailleurs », alors que ce sont les syndicats qui se querellent sans cesse avec nos industries. Leurs manifestations, émeutes et grèves permanentes ne font que perturber la stabilité du pays. Faites-les fermer !"
 FRA_pension_reform:0 "Réforme des retraites"
 FRA_pension_reform_desc:0 "Dans une démarche audacieuse visant à garantir l'avenir économique de la France à long terme, le gouvernement a décidé de relever l'âge de la retraite de 62 à 64 ans. Cette réforme vise à assurer la pérennité du système de retraites tout en s'adaptant aux réalités d'une population vieillissante et de l'allongement de l'espérance de vie. Ses partisans soulignent l'impact positif de ce changement sur les finances publiques, qui permettra de poursuivre les investissements dans les services sociaux et la croissance économique. Bien que certains secteurs expriment des inquiétudes, le gouvernement est convaincu que cet ajustement nécessaire renforcera la résilience de l'économie, favorisant l'équité entre les générations et préservant l'intégrité du filet de sécurité sociale français."
 FRA_eu_recovery_instrument:0 "Instrument de relance de l'UE"
 FRA_eu_recovery_instrument_desc:0 "Le Pen affirme que l'Union freine notre économie, mais ce n'est pas le cas. Qu'il s'agisse des migrations intracommunautaires ou du marché unique, notre influence nous permet de viser plus haut tant que nous restons unis."
 FRA_support_european_federalization:0 "Soutenir la fédéralisation européenne"
 FRA_support_european_federalization_desc:0 "Nous sommes encore considérés comme une grande puissance, mais ce n'est plus tout à fait le cas. Les Américains piétinent les Européens sur les plans militaire et économique. Les Chinois inondent nos marchés de biens bon marché. Le Sud global ne nous respecte pas et refuse nos conseils. Même la Russie, un État que nous croyions vaincu et brisé au-delà de toute possibilité de relèvement, relève la tête et tente de reconquérir sa puissance perdue. Alors pourquoi pas nous ? Les Européens, berceau de l'État moderne, de la culture et de la technologie, ne méritent-ils pas de retrouver leur juste place au soleil ? Nous devons nous unir, car c'est la seule voie pour redevenir une grande puissance !"
 FRA_immigration_regulation:0 "Régulation de l'immigration"
 FRA_immigration_regulation_desc:0 "L'incessante vague de migrants atteignant nos côtes alimente depuis longtemps le débat politique. Les gouvernements précédents nous assuraient que nous pourrions assimiler ces populations, car la plupart viennent de nos colonies perdues, mais il est clair que nous ne pouvons pas les intégrer assez vite. Des ghettos sans loi, où aucune force de police n'est présente, sont monnaie courante près de nos grandes villes. Nos enseignants sont décapités pour avoir défendu l'idéal français de déconstruction et d'analyse religieuse. Nos femmes craignent de circuler seules le soir par peur d'être agressées par une bande de voyous. Sans parler du terrorisme islamique. Nous devons réformer notre système, et arrêter l'immigration est le moyen de commencer à le faire."
 FRA_increase_corporate_tax:0 "Augmenter l'impôt sur les sociétés"
 FRA_increase_corporate_tax_desc:0 "Les grandes entreprises n'ont fait que parasiter le Français moyen. Si nous pouvons blâmer Macron pour le déficit actuel de l'État, nous devons aussi trouver des solutions. Taxer les sociétés et favoriser les petites entreprises rétablira non seulement un semblant d'équilibre sur le marché intérieur, mais remplira aussi les caisses de l'argent nécessaire au financement de nos projets futurs."
 FRA_strengthen_protectionism:0 "Renforcer le protectionnisme"
 FRA_strengthen_protectionism_desc:0 "Pourquoi laisser nos entreprises et nos industries souffrir et mourir tandis que des biens bon marché inondent le marché ? Nous ne l'accepterons pas !"
 FRA_support_nuclear_power:0 "Soutenir l'énergie nucléaire"
 FRA_support_nuclear_power_desc:0 "Nous ne sommes pas comme les Allemands qui refusent le nucléaire au profit d'une énergie « verte ». Nous sommes plus intelligents !"
 FRA_criticize_the_eu:0 "Critiquer l'UE"
 FRA_criticize_the_eu_desc:0 "Qu'a fait l'UE pour nous ? Inonder nos marchés de biens moins chers, détruisant nos industries au profit de celles de l'Est. Et pour quoi ? Pour l'« unité » ? Les eurocrates sont une plaie pour notre nation. Nous devons combattre leur influence avant qu'il ne soit trop tard."
