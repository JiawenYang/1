 FAF_legalize_paganism_decision:0 "Encourager le paganisme"
 FAF_legalize_paganism_decision_desc:0 "Le christianisme est une anomalie. Ce n'est pas une création française, ni même européenne d'ailleurs. C'est le cancer qui se répand de façon incontrôlable et à un rythme inconcevablement rapide. À tel point qu'il a chassé nos croyances ancestrales et natives. Il a fait oublier au peuple français qui il est vraiment ! Oublier ses racines ! Son héritage ! C'est pourquoi nous devons ramener les religions véritablement françaises, celles qui définissent notre peuple comme gaulois, et non comme « chrétiens »."
 FAF_provoke_french_opposition_decision:0 "Provoquer l'opposition française"
 FAF_provoke_french_opposition_decision_desc:0 "Quelle est la meilleure façon de se mettre en lumière tout en écrasant l'opposition ? En les faisant paraître mauvais, bien sûr. Comment ? C'est assez simple en réalité, le plus vieux truc du manuel de politique. Nous les appâterons avec des insultes ambiguës pendant que, de colère, ils se rendent ridicules."
 FAF_word_of_the_bishop_decision:0 "La parole de l'évêque"
 FAF_word_of_the_bishop_decision_desc:0 "Tout au long de l'histoire européenne, la papauté a joué de notre peuple et de nos dirigeants comme d'un violon. Utilisant la foi chrétienne comme une arme invisible pour façonner l'Europe à l'image déformée de ce qu'elle était autrefois. Nous ne verserons plus notre sang au nom d'un dieu fictif. Le pape deviendra notre enfant de chœur et chantera nos louanges."
 FAF_reorganize_the_LVF_decision:0 "Réorganiser la LVF"
 FAF_reorganize_the_LVF_decision_desc:0 "Le nom de la Force des volontaires loyalistes a été bastardisé par ceux qui ne l'ont jamais vraiment compris. Les rouges et les libéraux sont la seule raison du déclin de notre nation, c'est pourquoi cette nation a besoin de plus de groupes comme les loyalistes pour nettoyer cette saleté en son sein et la débarrasser de sa maladie."
 FAF_glorify_collaborationism_decision:0 "Glorifier le collaborationnisme"
 FAF_glorify_collaborationism_decision_desc:0 "On traite toujours les collaborationnistes de traîtres, de rats et de chiens. Mais comment peut-on être un traître quand on travaille à débarrasser sa nation d'une maladie qui la tue lentement ? Lorsque notre peuple a travaillé avec les Allemands pendant la Seconde Guerre mondiale, ce n'était pas pour saper notre nation, mais pour déraciner la menace bolchevique. Ce n'est certainement ni un rat ni un traître, mais un guérisseur et un protecteur."
 FAF_work_f_decision:0 "Notre travail !"
 FAF_work_f_decision_desc:0 "Le travail doit être fait et le sera. Le labeur est la seule forme d'action qui produit toujours des résultats positifs. Les briques ne se posent pas d'elles-mêmes. Les routes ne se pavent pas d'elles-mêmes. Les récoltes ne poussent certainement pas seules. Ce n'est qu'avec la sueur et le sang de notre peuple que cette nation autrefois glorieuse pourra être rebâtie."
 FAF_family_f_decision:0 "Notre famille !"
 FAF_family_f_decision_desc:0 "La famille est tout, avant tout le reste. La chose la plus sacrée qui soit est la structure familiale. Ce n'est qu'en maintenant les valeurs et la structure familiales traditionnelles que la France pourra se repeupler. La guerre a presque anéanti une génération entière. Si nous ne renouvelons pas le sang vital de notre nation, nous sommes condamnés à pourrir et à nous effondrer."
 FAF_fatherland_f_decision:0 "Notre patrie !"
 FAF_fatherland_f_decision_desc:0 "Patrie, terre des pères — la force qui unit notre peuple et nous rend indivisibles. Sans elle, son peuple n'est rien ; et sans son peuple, elle ne peut exister. Les deux sont liés par une relation symbiotique. Si notre peuple oublie un jour sa patrie, alors la grande famille qu'était autrefois notre nation sera brisée à jamais. Volée en éclats pour être reprise par des puissances étrangères."
 FAF_honest_french_middle_class_decision:0 "Notre honnête peuple"
 FAF_honest_french_middle_class_decision_desc:0 "Le peuple français incarne l'image parfaite de la création divine. Honnête, immaculé et sage. Ce sont ces traits qui ont rendu notre nation prospère et grande. Les Français n'ont jamais voulu dominer les autres, mais simplement répandre nos idéaux et notre culture."
 FAF_oui_oui_oui_decision:0 "§COui ! Oui ! Oui !§!"
 FAF_oui_oui_oui_decision_desc:0 "Dites oui à la guerre ! Dites oui au sacrifice ! Dites oui à la victoire ! Notre défaite dans la guerre russo-européenne a fait oublier à notre peuple ce qui faisait autrefois de nous une nation glorieuse et puissante ; nous devons donc le lui rappeler. En le guidant, nous lui apprendrons à penser et à agir — non seulement pour son propre bien, mais aussi pour notre renaissance nationale."
 FAF_non_non_non_decision:0 "§RNon ! Non ! Non !§!"
 FAF_non_non_non_decision_desc:0 "Dites non au pacifisme ! Dites non au libéralisme ! Dites non au communisme ! Nettoyer la maison est une chose, mais déraciner la pourriture qui pousse au plus profond de notre nation en est une autre. La saleté qui empoisonne encore l'esprit de nos citoyens ne disparaîtra pas d'elle-même ; nous devons au contraire guider notre peuple sur le droit chemin et l'empêcher de s'égarer."
 FAF_paris_accords:0 "Pacte de Charlemagne"
 NMD_northern_liberation_army:0 "Armée de libération du Nord"
 OCT_french_peoples_liberation_front:0 "Front de libération du peuple français"
 FAF_pride_of_france_cat:0 "Fierté de la France"
 FAF_pride_of_france_cat_desc:0 "\n\n\n\n\n£GFX_FAF_pride_of_france_cat\n\n\n\n\n\n\n\nLa renaissance de l'État français et du traditionalisme est là, ici et maintenant. Le régime de Vichy nous est revenu, ce bastion du conservatisme reprenant une fois de plus sa place en Europe comme sauveur face aux malheurs du libéralisme.\n\nBien que fragile et rongé par les luttes intestines entre généraux qui veulent être le grand maréchal de France, l'État en lui-même est magnifique. Tout doit lui être accordé pour son maintien."
 FAF_pride_of_france_dynamic:0 "Militarisme français"
 FAF_pride_of_france_dynamic_desc:0 "On loue toujours les Allemands pour leur prouesse et leur gloire militaires au cours de l'histoire, mais lorsqu'il s'agit de la France, on ne se souvient que des chefs militaires et des esprits stratégiques derrière la guerre, pas du sang qui la menait sur le terrain. L'armée de la France a toujours été la plus forte d'Europe. Les seules fois où elle a paru faible, c'est parce que des lions étaient menés par des ânes. Aujourd'hui, même le peuple français a oublié une part importante de sa culture, de ses traditions militaires et de sa prouesse militaire. Nous devons inculquer un patriotisme dans le cœur de nos peuples, leur rappeler l'importance du service militaire et de la force militaire."
