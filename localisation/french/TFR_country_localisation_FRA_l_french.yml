 FRA_authoritarian_liberalism:0 "Libéralisme autoritaire"
 FRA_Triumph_over_the_Eastern_Menace:0 "Triomphe sur l'ours russe"
 FRA_Triumph_over_the_Eastern_Menace_desc:0 "Par le sang et la sueur, l'ours a été vaincu. Certains pensaient que l'Europe sombrerait avec l'Amérique, qu'elle resterait sans défense, livrée au pillage tandis que les loups rôderaient. Ils n'auraient pu se tromper davantage. C'est l'Europe qui se tient désormais victorieuse. Du partisan ukrainien au pilote français, du grenadier allemand au Royal Marine, cette tâche herculéenne n'a été possible que grâce à notre décision, et à celle de l'Europe, de nous battre jusqu'au bout : pas de demi-mesures et pas de paix sans véritable victoire. Malgré les doutes de certains sur l'idée d'une Europe unie, ils ne peuvent plus nier qu'unie dans son dessein, l'Europe peut accomplir de grandes choses."
 FRA_Mourn_our_Sons:0 "À quel prix ?"
 FRA_Mourn_our_Sons_desc:0 "L'ours a été brisé, mais à un prix élevé. La tentative de sauver l'Ukraine aux premiers stades a échoué, et ce qui aurait dû être un effort court et décisif s'est transformé en bourbier. Nous avons triomphé, mais seulement après un lourd tribut pour nos économies et nos peuples. Nous devons prélever notre part de sang sur le cadavre de l'ours, comme le reste de l'OTAN. Nous ferons tout notre possible pour maintenir la Russie à terre, par des mesures visant à paralyser son économie et son appareil militaire. Le nouveau gouvernement russe semble caresser l'idée de se réorganiser pour une nouvelle tentative de restaurer ce qui a été perdu — du moins en coulisses. Sur recommandation de l'état-major, nous et le reste de l'OTAN resterons à des niveaux variables d'alerte et la préparation militaire sera maintenue. Dans l'éventualité improbable où l'ours se retournerait contre nous, nous serons prêts. S'ils veulent réclamer leur héritage, rien de plus courtois que de veiller à ce qu'ils meurent en essayant."
 FRA_The_Spirit_of_Victory:0 "L'esprit de la victoire"
 FRA_The_Spirit_of_Victory_desc:0 "Les Russes croyaient l'Europe faible et pensaient qu'elle resterait les bras croisés pendant leur marche vers l'asservissement. Ils croyaient qu'au pire notre intervention serait timide et lente — ils n'auraient pu se tromper davantage. Par une intervention rapide et décisive, la situation désastreuse de l'Ukraine a été sauvée et l'élan russe stoppé. Il y eut des succès et des revers entre-temps, mais à la fin, c'est le drapeau français qui flottait sur le Kouban et le gouvernement russe qui s'effondrait. Nous comptons récolter une partie des fruits de la victoire, comme nos partenaires, mais nous devons rester attentifs à de telles exigences. Il n'est pas besoin de remonter bien loin pour voir les conséquences négatives d'une paix carthaginoise — réelles ou perçues. Nous croyons que ce nouveau gouvernement russe peut être un partenaire et progressivement réaccueilli en Europe, peut-être même comme un futur ami. Après tout, ce nouveau gouvernement russe est-il si différent du nôtre ? Ils verront sûrement la raison et comprendront que travailler avec nous vaut bien mieux que d'agir seuls, ou même de tenter de récupérer des territoires perdus. La probabilité d'un geste aussi insensé est si faible qu'il vaut mieux l'ignorer — malgré les membres de l'état-major qui insistent sur la vigilance, car après tout, s'y préparer ne l'encouragerait-il pas ?"
 FRA_Enter_the_New_Era:0 "Une nouvelle ère d'après-guerre"
 FRA_Enter_the_New_Era_desc:0 "Malgré les sacrifices et la victoire, nous ne devons pas rester inactifs. Nous avons combattu pour maintenir l'ancien ordre et nous avons gagné, mais la lutte ne cesse jamais vraiment. La paix ne doit pas être gaspillée : tous les efforts doivent être faits pour garder nos alliés heureux et vigilants chez nous, et nos partenaires à l'étranger armés et économiquement productifs. L'économie allemande est peut-être plus forte avec l'UE, qui, à nos yeux, en est le mandataire, mais c'est la France qui est la puissance mondiale. Nos liens en Afrique de l'Ouest maintiennent les ressources et les denrées à destination de l'Europe et nos coffres pleins, mais nos partenaires de la région ont leurs propres rivalités et guerres à affronter. Même si l'OTAN ne veut pas y consacrer de ressources, nous n'épargnerons aucune dépense pour que nos investissements passés, présents et futurs ne soient pas vains. Une France plus forte est une OTAN plus forte, et qui, de notre côté, s'en plaindrait ?"
 FRA_Announce_Snap_Elections:0 "Annoncer des élections anticipées"
 FRA_Announce_Snap_Elections_desc:0 "La fin de la guerre marque le retour des divisions politiques. Les alliances de circonstance et la trêve des querelles mesquines au nom de l'effort de guerre ont malheureusement pris fin. Malgré la popularité apparemment écrasante de notre gouvernement, l'opposition réclame des élections ici et maintenant, invoquant notre « gouvernance incompétente et notre mauvaise gestion de l'effort de guerre ». On pourrait l'ignorer, mais elle a assez d'influence pour causer de graves problèmes et ralentir les législations à venir. Si nous sommes aussi populaires qu'il y paraît, cela pourrait être une aubaine : consolider notre position, accroître notre emprise sur le gouvernement et nous permettre d'ignorer ces exigences à l'avenir. Il y a toujours un risque que nos hypothèses sur notre popularité soient fausses, mais qu'est-ce que la vie sans risque ?"
 FRA_Declare_the_7th_Republic:0 "Proclamer la VIIe République"
 FRA_Vote_on_the_Sixth_Republic:0 "Référendum constitutionnel"
 FRA_Restoration_of_the_6th_Republic:0 "Restaurer la VIe République"
 FRA_russian_reperations_idea:0 "Réparations russes"
 FRA_war_reperations_idea:0 "Réparations de guerre"
 FRA_war_reperations_lessened_idea:0 "Réparations de guerre"
 FRA_The_New_French_Sphere:0 "Rétablir notre sphère"
 FRA_The_New_French_Sphere_desc:0 "Avec notre triomphe sur l'impérialisme russe, nous sommes les défenseurs incontestés de la démocratie européenne. Cependant, à la suite de notre glorieuse victoire, un vide de pouvoir s'est créé dans les zones autrefois dominées par la Russie. En tant que défenseurs de la démocratie, nous devons sauvegarder nos intérêts et établir la paix et la démocratie dans ces terres autrefois autocratiques."
 FRA_Reclaim_the_Algerian_Departments:0 "Revendiquer les départements algériens"
 FRA_Reclaim_the_Algerian_Departments_desc:0 "Depuis notre départ il y a des décennies, les Algériens se sont révélés incapables de gouverner leur propre nation. Ils sont constamment embourbés dans toutes sortes de problèmes, des groupes séparatistes aux différends frontaliers. Ce dont ils ont besoin, c'est d'une main extérieure, et nous la leur offrirons. Ce sont les premiers pas pour sécuriser l'Afrique."
 FRA_VIC_Freedom_for_North_Africa:0 "Liberté pour l'Afrique du Nord"
 FRA_VIC_Freedom_for_North_Africa_desc:0 "Le Printemps arabe a commencé il y a plus d'une décennie et pourtant presque rien n'en est sorti. Il n'a apporté que guerres civiles, radicalisme et mort. L'élément central des échecs du Printemps arabe en Afrique est la Libye, qui est en proie au chaos depuis 2011 et n'a presque rien apporté à ses participants. Elle a aussi représenté une menace sécuritaire majeure pour nous en Afrique du Nord, et le moment est donc venu de sécuriser la Libye."
 FRA_VIC_Stabilize_West_Africa:0 "Stabiliser l'Afrique de l'Ouest"
 FRA_VIC_Stabilize_West_Africa_desc:0 "Une conséquence malheureuse de la guerre avec la Russie fut la nécessité de rappeler la plupart de nos forces en Afrique de l'Ouest. L'absence de ces soldats a entraîné une baisse significative de la capacité des pays de la région à faire respecter l'état de droit et a permis une résurgence de nombreux groupes terroristes. Maintenant que nous n'avons plus à nous soucier des affaires proches de chez nous, nous pouvons reprendre le travail dans les terres lointaines. Tôt ou tard, nous éliminerons enfin les dernières traces des islamistes radicaux."
 FRA_VIC_Demand_African_Resources:0 "Exiger des droits sur les ressources africaines"
 FRA_VIC_Demand_African_Resources_desc:0 "Notre aide continue à certaines nations africaines les a placées très largement en notre dette. Nous sommes responsables de l'éradication du terrorisme, de la construction de leurs infrastructures et de leur économie, et de leur protection contre toutes sortes de menaces. Il est temps qu'ils paient leur note, et pour cela ils n'ont qu'à regarder leurs grandes quantités de ressources naturelles. Cela doit être pénible de gérer tous ces minerais et pierres précieuses ; nous les leur enlèverons volontiers."
 FRA_VIC_African_Economic_Expansion:0 "Expansion économique africaine"
 FRA_VIC_African_Economic_Expansion_desc:0 "Notre collaboration accrue avec les nations d'Afrique de l'Ouest a offert un nombre unique d'opportunités économiques, et nous serions fous de ne pas les exploiter. Beaucoup de nos anciennes colonies ont encore une fabrication de biens de consommation sous-développée, ce que nous serions ravis de les aider à améliorer. En échange, nous ouvrons de nouveaux marchés pour nos produits. Champagne et une excellente vue sur le golfe de Guinée, quelqu'un ?"
 FRA_VIC_A_New_African_Union:0 "Une nouvelle Union africaine"
 FRA_VIC_A_New_African_Union_desc:0 "À mesure que les nations d'Afrique de l'Ouest et du Nord deviennent de plus en plus dépendantes de nous, la question s'est posée de savoir jusqu'où aller. La réponse est d'une évidence écrasante. En bref, le colonialisme est mort depuis longtemps, et pour garantir une conformité maximale des peuples d'Afrique, ils ne doivent pas être sous le contrôle d'une terre lointaine. Nous avons donc décidé de bâtir une nouvelle Union africaine, une qui ne soit pas une plaisanterie. Cette nouvelle union aidera au développement, à l'extraction des ressources et, bien sûr, au commerce. Elle sera le summum de notre action en Afrique."
 FRA_VIC_In_the_Right_Hands:0 "Entre de bonnes mains"
 FRA_VIC_In_the_Right_Hands_desc:0 "Depuis leur indépendance, les nations d'Afrique de l'Ouest et du Nord ont simplement été incapables de se gouverner elles-mêmes. Elles sont constamment tombées aux mains de terroristes et de dictateurs, et maintenant que nous les tenons au doigt et à l'œil, il est temps de veiller à ce que cela ne se reproduise plus. Le colonialisme est loin d'être populaire, mais ce n'est pas du colonialisme : nous aimons l'appeler une gestion assistée. Avec notre main lourde et directrice, l'Afrique sera sécurisée."
 FRA_VIC_Operation_Aigle:0 "§YOpération§! : Aigle"
 FRA_VIC_Pit_them_Against_Each_other:0 "Encourager l'anti-autoritarisme"
 FRA_VIC_Rebirth_of_Israel:0 "Une renaissance sioniste"
 FRA_VIC_Clean_the_Slate:0 "Faire table rase"
 FRA_Protect_Canadian_Soveriegnty:0 "Protéger la souveraineté canadienne"
 FRA_Protect_Canadian_Soveriegnty_desc:0 "Le Canada a longtemps été l'un de nos alliés les plus importants ; depuis la Seconde Guerre mondiale, où il fut l'un des combattants les plus courageux contre la menace nazie, il a toujours défendu les principes démocratiques et l'Occident. Cependant, avec le chaos qui règne dans l'ancienne USA, de nombreuses factions ont revendiqué le Canada comme partie de leur États-Unis idéal. Ces revendications sont inacceptables et nous protégerons le Canada contre toute agression américaine."
 FRA_Ensure_Continental_Interests:0 "Assurer les intérêts nord-américains"
 FRA_Ensure_Continental_Interests_desc:0 "Même si la situation en Europe de l'Est se calme, celle des États-Unis reste désastreuse. Certaines factions dans l'ancienne USA ne doivent pas gagner plus de pouvoir qu'elles n'en ont déjà, car cela signifierait la ruine pour des millions de personnes. En plus de cette nécessité, nous avons l'engagement de sauver notre allié qui nous a tirés d'affaire à de nombreuses reprises. Rendre un service ne fait jamais de mal, et cela pourrait nous rapporter des points."
 FRA_canadian_isolation_tt:0 "§CCela isolera les Canadiens des affaires européennes afin d'obtenir l'indépendance du peuple québécois§!"
 FRA_The_Miquelon_Bill:0 "L'accord de Miquelon"
 FRA_The_Miquelon_Bill_desc:0 "Quelque chose de maléfique rôde de l'autre côté de l'Atlantique, se faisant passer pour les États-Unis d'Amérique. Mais ce n'est pas la nation que nous avons aidée à se libérer des Britanniques il y a deux siècles et demi, et ils ne veulent rien d'autre que nous exploiter. Aussi douloureux que cela soit à admettre, les USA sont morts et enterrés. L'Europe doit être protégée de cette nouvelle menace ; c'est à nous de veiller à ce que les Américains restent de leur côté de l'océan."
 FRA_American_Realpolitik:0 "Le vainqueur"
 FRA_American_Realpolitik_desc:0 "Il semble que le cauchemar soit enfin terminé. Les Russes sont préoccupés, l'Europe est unie et forte, mais surtout, la Seconde Guerre civile américaine est enfin terminée. Bien qu'ils soient peut-être désormais faibles et brisés, leur histoire n'est pas finie, et il nous appartient, ainsi qu'au reste de l'UE, de les accompagner dans cette période de reconstruction. Nous les avons aidés à se libérer des Britanniques ; nous ne pouvons pas les abandonner maintenant."
 FRA_Franco_American_Diplomatic_Agreement:0 "Accord diplomatique franco-américain"
 FRA_Franco_American_Diplomatic_Agreement_desc:0 "Pour la première fois depuis 2021, nous avons rendu visite à Washington. Le nouveau gouvernement américain nous a invités à l'occasion d'un nouvel accord diplomatique, ce que nous avons accepté avec plaisir. Les résultats ont été satisfaisants, quoique moins bénéfiques que nous l'espérions. Les Américains ne sont pas en mesure de rejoindre l'OTAN, mais en échange de notre aide, ils promettent de le faire le moment venu. Bien qu'ils ne soient peut-être plus exactement ce qu'ils étaient il y a une décennie, nous attendons avec impatience un partenariat continu."
 FRA_Guiana_Gambit:0 "Gambit guyanais"
 FRA_Guiana_Gambit_desc:0 "Bien que l'OTAN spécifie l'Atlantique Nord, son expansion n'a jamais été limitée par son nom. La situation en Europe de l'Est nous étant assez favorable, nous avons tourné notre attention vers l'autre rive de l'Atlantique, et un peu vers le sud. Nous n'avons jamais été grands amis avec les Brésiliens, mais nous nous entendons assez bien et souhaitons élargir notre partenariat. Sans les Russes, ils cherchent sûrement de nouveaux partenaires. Mais ils sont têtus et auront besoin d'un peu de persuasion pour rejoindre notre cause. Aussi détestable que cela soit, la Guyane française sucrera sûrement l'affaire."
 FRA_Stabilize_the_Caribbean:0 "Stabiliser la Caraïbe"
 FRA_Stabilize_the_Caribbean_desc:0 "Le récent chaos aux États-Unis et au Mexique a plongé la Caraïbe, relativement paisible, dans une crise, et nos territoires y ont été menacés. Avec le temps, il semble que les choses ne se calmeront pas à moins que quelqu'un n'agisse, et à part nous et le Royaume-Uni, personne n'a vraiment de raison de le faire. Avant que les choses ne s'aggravent, nous intervenons pour calmer cette mer agitée."
 FRA_Enrich_Quebecois_Spirit:0 "Enrichir l'esprit québécois"
 FRA_Enrich_Quebecois_Spirit_desc:0 "Le peuple québécois est depuis longtemps piégé sous le talon des Anglos, mais il ne s'est jamais laissé écraser. En fait, c'est sous cette pression que leur culture et leur peuple ont prospéré, preuve que certaines choses ne peuvent jamais vraiment être éradiquées. Pour continuer à étendre notre influence en Amérique du Nord, nous devons d'abord trouver du soutien parmi les Québécois, et nous financerons donc les efforts visant à mieux faire connaître leur patrimoine et leur culture."
 FRA_Supplement_Quebecois_Industry:0 "Soutenir l'industrie québécoise"
 FRA_Supplement_Quebecois_Industry_desc:0 "Un moyen d'atteindre le cœur de toute nation est de l'aider par des constructions qui serviront son économie. La meilleure façon d'y parvenir, à part peut-être l'agriculture, est de financer des projets industriels. Le Québec a une série de programmes de développement en cours que le gouvernement canadien ne soutient pas de son mieux, et nous intervenons donc. Lorsqu'il y aura une foule de nouveaux emplois industriels au Québec, ils se souviendront de qui a réellement construit leurs usines."
 FRA_Espouse_Cultural_Unity:0 "Épouser l'unité culturelle"
 FRA_Espouse_Cultural_Unity_desc:0 "La culture de la France peut se résumer en trois mots : Liberté, Égalité, Fraternité. Pourtant, comme pour toute nation, la façon dont les gens interprètent notre culture varie de ville en ville, et même de foyer en foyer. Tous les Français partagent les mêmes valeurs fondamentales, mais les détails causent parfois des disputes. Nous ne pouvons laisser les gens se battre pour des choses insignifiantes ; aussi tous les aspects de notre culture seront-ils exposés afin que chacun voie combien nous sommes réellement unis."
 FRA_quebec_independence_tt:0 "§CCela forcera un référendum d'indépendance [QUE.GetFlag] québécois sur [CAN.GetFlag] le Canada§!"
 FRA_Restore_the_French_Union:0 "Restaurer l'Union française"
 FRA_Restore_the_French_Union_desc:0 "L'Union française, notre ancienne tentative à moitié aboutie de réformer notre système colonial, échoua piteusement avec la fin de la IVe République. Au lieu de conserver des départements et colonies d'outre-mer, tout n'était que la France. Pourtant, à la fin des années 1950, ce système prouva son échec et s'effondra. Mais aujourd'hui, nous sommes en mesure de gérer avec succès de vastes territoires d'outre-mer — non des colonies, juste des territoires. Il n'y aura pas de citoyens de seconde classe, seulement des Français, et notre puissance sera de nouveau pleinement exposée !"
 FRA_Department_of_Haiti:0 "Département d'Haïti"
 FRA_American_CW_Embargo_tt:0 "§YL'OTAN embargotera collectivement le commerce avec toutes les factions de la guerre civile américaine§!"
 FRA_Further_American_Support_tt:0 "§YNous enverrons un soutien supplémentaire à la faction que nous avons choisie§!"
 FRA_VIC_African_Economic_Expansion_tt:0 "Débloque £decision_icon_small les §Hdécisions§! pour : §Yaccroître l'influence économique sur§! §Rles nations d'Afrique de l'Ouest§!"
 FRA_VIC_In_the_Right_Hands_tt:0 "Débloque £decision_icon_small les §Hdécisions§! pour : §Yaccroître l'influence militaire sur§! §Rles nations d'Afrique de l'Ouest§!"
 FRA_VIC_Bitter_Winner_tt:0 "§RLa Russie doit payer pour les citoyens français que nous avons perdus...§! \n\nLa France cherchera à maintenir une paix européenne £GFX_Federalization_Unity_texticon, en veillant à ce que [SOV.GetFlag] la Russie ne puisse plus jamais se relever pour contester la domination européenne."
 FRA_VIC_Victorious_Spirit_tt:0 "§CL'Europe a fait un bond dans une ère nouvelle, véritablement libérée de la guerre...§! \n\nLa France cherchera à maintenir une paix européenne £GFX_Federalization_Unity_texticon, en reconstruisant [SOV.GetFlag] la Russie comme nous l'avons fait autrefois avec [GER.GetFlag] la §YAllemagne de l'Ouest§!."
 FRA_death_counter_flag:0 "A subi plus de §R10 000 pertes§!"
 FRA_The_Liberators_of_the_Caucasus:0 "Les libérateurs du Caucase"
 FRA_The_Liberators_of_the_Caucasus_desc:0 "Sans nous, et sans l'OTAN dans son ensemble, la région du Caucase serait encore aux mains des expansionnistes russes. Maintenant que nous avons pris la peine de les libérer de leurs maîtres, nous ne devons pas fuir notre responsabilité envers eux. Livrés à eux-mêmes, ils sombreront dans le chaos ou seront à nouveau saisis par leur voisin du nord. Cela ne peut être permis ; nous veillerons à ce que les nations du Caucase restent indépendantes des Russes et se souviennent de qui les a libérées."
 liberator_of_the_caucasus:0 "Libérateurs du Caucase"
 FRA_Militarize_Kuban_Police:0 "Militariser la police du Kouban"
 FRA_Militarize_Kuban_Police_desc:0 "La défaite russe a conduit à la création de plusieurs nouvelles nations dans le nord du Caucase, dont la plus importante est sans doute la République du Kouban. Malheureusement pour les Koubanais, leur nouveau gouvernement peine à maintenir l'ordre public, et la nation est déjà attaquée par des terroristes soutenus par la Russie. Pour nous bâtir un rempart à l'Est, nous aiderons volontiers les Koubanais à renforcer leur police et leurs capacités administratives."
 FRA_Crimean_Investments:0 "Investissements en Crimée"
 FRA_Crimean_Investments_desc:0 "La péninsule de Crimée est sous contrôle russe illégal depuis plus d'une décennie, ignorée et utilisée comme rien de plus qu'une base militaire surdimensionnée ; elle a subi des destructions massives à cause des importants combats qui s'y sont déroulés. Heureusement, elle est désormais aux mains de propriétaires plus responsables, les Ukrainiens. En gage de bonne volonté et pour étendre notre influence à l'Est, nous investirons dans la reconstruction de la Crimée et veillerons à ce qu'elle soit rendue en meilleur état qu'elle n'a été prise !"
 FRA_EU_kill_EUrself_tt:0 "Cela nous exclura du reste de l'arbre de focus et préparera la £GFX_Federalization_Unity_texticon §CFÉDÉRALISATION COMPLÈTE§!."
 FRA_EU_sister_republic_tt:0 "Cela nous exclura de la voie de la £GFX_Federalization_Unity_texticon §CFÉDÉRALISATION COMPLÈTE§!, mais lancera à la place la création de la [EUU.GetFlag] §YFÉDÉRATION FRANCO-IBÉRIQUE§!"
 FRA_Apologize_for_War_Contribution:0 "Son honneur restauré"
 FRA_Apologize_for_War_Contribution_desc:0 "Par le courage et le sacrifice, l'armée a restauré l'honneur de la France. Dans son heure la plus sombre et au milieu de fausses accusations d'échec, les hommes ont tenu bon et prouvé que nous étions encore une puissance digne du nom de la France. Des mâchoires de la défaite, nous avons arraché une grande victoire — pas seulement pour nous, mais pour toute l'Europe. La tache de l'échec derrière nous, nous pouvons regarder vers l'avenir et, avec le reste de l'Europe, marcher ensemble vers un lendemain meilleur. Nous espérons que les Ukrainiens nous érigeront assez de statues…"
 FRA_Demand_Increased_Reperations:0 "Augmenter les réparations"
 FRA_Demand_Increased_Reperations_desc:0 "Nous avons humilié les Russes, mais cela ne suffit pas à les faire payer. Le traité de paix que nous avons signé avec eux était trop indulgent, leur permettant d'échapper à la plupart de leurs crimes. Une grande partie des dommages qu'ils ont causés subsiste, et s'ils ne veulent pas que nous leur rendions la vie encore plus difficile, ils paieront. On récolte ce que l'on sème."
 FRA_Bloodied_Liberator_of_the_Caucasus:0 "Maintenir les garnisons militaires"
 FRA_Bloodied_Liberator_of_the_Caucasus_desc:0 "Nous ne pouvons pas nous permettre de démobiliser, pas encore. Bien que beaucoup aient proclamé une nouvelle ère de paix, des actions clandestines menées en Russie semblent suggérer le contraire. Nous continuerons donc à approvisionner et à gérer des garnisons militaires dans le Caucase, prêtes à répondre précipitamment à toute menace. Les Russes ne nous ont pas trompés la première fois, et ils ne le feront pas cette fois."
 FRA_Rip_out_the_Russian_Rot:0 "Arracher la pourriture russe"
 FRA_Rip_out_the_Russian_Rot_desc:0 "Une grande partie des terres que nous avons prises à la Russie est infestée par ses terroristes et séparatistes financés par l'État. Cela entrave gravement nos efforts de reconstruction et de construction nationale. Les Russes font tout leur possible pour rendre cette terre aussi inhospitalière pour nous que possible, et nous devons donc les en chasser. Ils ont perdu cette terre ; ils devront en assumer les conséquences."
 FRA_Negotiate_Exclusive_Treaty_Ports:0 "Négocier des ports conventionnés exclusifs"
 FRA_Negotiate_Exclusive_Treaty_Ports_desc:0 "Les Russes sont isolés diplomatiquement et lourdement sanctionnés depuis l'échec de leur petite \"exploit\" en Europe de l'Est, mais nous sommes désormais prêts à leur offrir une bouée de sauvetage. Si les Russes acceptent d'ouvrir quelques-unes de leurs villes portuaires au commerce et aux investissements occidentaux, nous serions heureux d'alléger un peu leur châtiment. S'ils veulent refuser, eh bien, ce sera toujours leur perte."
 FRA_Caucasian_Resource_Rights:0 "Droits sur les ressources du Caucase"
 FRA_Caucasian_Resource_Rights_desc:0 "Sous les montagnes et les plaines du Caucase reposent de vastes quantités de ressources naturelles. Nous avons aidé cette région à un point tel que nous y exerçons une grande influence, et de nombreux politiciens nous doivent des faveurs. L'économie et l'armée françaises exigent toujours plus de ressources et se moquent de leur provenance. C'est un faible prix à payer en échange de notre protection continue."
 FRA_Fund_Ukrainian_Peacekeepers:0 "Financer les casques bleus ukrainiens"
 FRA_Fund_Ukrainian_Peacekeepers_desc:0 "Le peuple ukrainien a combattu admirablement contre l'assaut russe, et il travaille désormais dur pour apprivoiser les terres que nous avons libérées de l'envahisseur. Malheureusement, nous avons concentré l'essentiel de notre attention sur le Caucase et ne pouvons consacrer de troupes supplémentaires pour aider les Ukrainiens. Nous pouvons cependant certainement financer leurs efforts, car une Russie plus faible signifie un avenir plus facile pour nous."
 FRA_The_Caucasian_Entente:0 "L'Entente caucasienne"
 FRA_The_Caucasian_Entente_desc:0 "Le moment est venu de formaliser complètement notre engagement envers le Caucase. Jusqu'à présent, nous ne faisions que les approvisionner et les financer, mais nous sommes désormais en mesure d'aller un pas plus loin. Ces nations seront invitées dans l'OTAN, afin qu'elles n'aient plus jamais à craindre les Russes. Ceux qui refuseront ne seront pas exclus de notre protection, car nous n'envisagerions jamais d'abandonner notre dur labeur et nos investissements. Tant que nous serons debout, le Caucase restera libre."
 FRA_The_Caucasian_Entente_tt:0 "Cela créera un pacte de défense mutuelle entre l'Azerbaïdjan, l'Arménie, le Kouban et la Géorgie, dirigé par la grande nation de France, afin que la Russie ne puisse plus jamais se relever."
 FRA_Prevent_Another_Weimar:0 "Empêcher un autre Weimar"
 FRA_Prevent_Another_Weimar_desc:0 "L'effondrement de la République de Weimar au XXe siècle, né de l'humiliation et du chaos, a finalement donné naissance à la catastrophe depuis les ruines de la démocratie. La chute de la Russie au XXIe siècle est un avertissement sévère : nous ne devons pas permettre à une Moscou fragmentée de répéter cette descente dans l'extrémisme et la vengeance. La France prendra la tête pour que la reconstruction de l'après-guerre russe suive la voie de la stabilité et de la paix."
 FRA_Democratization_of_Eastern_Minds:0 "Démocratisation des esprits de l'Est"
 FRA_Democratization_of_Eastern_Minds_desc:0 "La défaite de la Russie a ouvert les portes de la démocratie en Europe de l'Est. En tant que défenseurs de la liberté européenne, nous piloterons une transformation de la pensée dans toute la région. De Varsovie à Kiev, nous soutiendrons les initiatives éducatives, la liberté des médias et la société civile, afin que les peuples d'Europe de l'Est se libèrent des ombres autoritaires. Les graines de la démocratie prendront racine, s'épanouiront et remodeleront l'Est."
 FRA_Demand_Ukrainian_Leniancy:0 "Exiger la clémence ukrainienne"
 FRA_Demand_Ukrainian_Leniancy_desc:0 "L'Ukraine a payé un lourd tribut dans sa guerre contre la Russie. Nous honorons son sacrifice, mais la victoire ne doit pas devenir un prétexte à des exigences excessives. Nous exhorterons l'Ukraine à la retenue dans ses revendications territoriales et ses réparations d'après-guerre, favorisant la réconciliation plutôt que le ressentiment. Ce n'est qu'en laissant de côté la haine que l'Ukraine et l'Europe pourront bâtir ensemble un avenir durable et stable."
 FRA_UKR_leniancy_tt:0 "Si [UKR.GetFlag] l'Ukraine refuse d'adopter une position plus clémente envers les citoyens russes dans ses [KBK.GetFlag] gouvernements d'occupation, nous prendrons des mesures économiques et politiques contre elle."
 FRA_Denounce_Azov_Influence:0 "Dénoncer l'influence azovite"
 FRA_Denounce_Azov_Influence_desc:0 "L'euphorie de la victoire ne doit pas être entachée par les courants souterrains de l'extrémisme. Nous avons observé l'influence croissante des azovites en Ukraine — son idéologie radicale s'oppose aux valeurs démocratiques. Nous condamnerons publiquement cette influence et presserons Kiev de remédier à cette préoccupation croissante. La paix en Europe ne doit pas être gâtée par le spectre du néonazisme — le chemin de l'Europe de l'Est vers la démocratie doit rester intact."
 FRA_Capitalize_on_Caucasus:0 "Tirer parti du Caucase"
 FRA_Capitalize_on_Caucasus_desc:0 "Le Caucase a longtemps été un point faible de l'influence russe — et une opportunité pour nous. Moscou vaincue, nous renforcerons la coopération avec les nations du Caucase, en tirant parti de leurs ressources et de leurs positions stratégiques. Des champs pétrolifères de Bakou aux routes commerciales de Tbilissi, nous investirons dans le développement économique et les initiatives démocratiques, afin que le Caucase devienne un allié de l'Europe, non un vassal de la Russie."
 FRA_Uphold_Equality:0 "Défendre l'égalité"
 FRA_Uphold_Equality_desc:0 "L'égalité sera le fondement de la nouvelle ère européenne. Indépendamment de la race, du genre ou de l'origine, chaque citoyen européen doit se voir accorder les mêmes droits et les mêmes opportunités. Sous notre direction, des vignobles de Champagne aux villages d'Europe de l'Est, tous partageront les fruits de la démocratie."
 FRA_Eastern_Democracy_Manifest:0 "Manifester la démocratie de l'Est"
 FRA_Eastern_Democracy_Manifest_desc:0 "La démocratie en Europe de l'Est n'est pas un rêve — c'est une nécessité. Après la chute de la Russie, nous mènerons la charge pour démocratiser l'Est. De la Baltique à la mer Noire, les élections démocratiques, l'état de droit et la participation civique balaieront les restes de la décadence autoritaire. La lumière de la liberté éclairera l'Est, et la grande vague démocratique du XXIe siècle commencera ici."
 FRA_VIC_Withdraw_from_integrated_command:0 "Se retirer du commandement intégré"
 FRA_VIC_Withdraw_from_integrated_command_desc:0 "Bien que nous ayons remporté la juste guerre contre l'agression russe, la victoire ne peut masquer les profondes divisions au sein de l'OTAN ni la douleur ressentie par notre peuple. Après que les États-Unis, jadis dirigeants du monde occidental, eurent perdu leur position dominante, les conflits et les différends au sein de l'OTAN et de l'UE étaient à faire frémir au souvenir. L'unité et l'amitié dont parlent les politiciens se sont révélées fragiles face à un avenir incertain. Heureusement, le peuple français a vu la vérité et réclamé le changement. Le système dépassé doit être démantelé, et c'est seulement ainsi que nous pourrons poser les bases d'une nouvelle ère. Désormais, la France ne participera plus à la structure de commandement intégré de l'OTAN. Nous resterons fermes aux côtés de tout allié prêt à combattre avec nous."
 FRA_VIC_Our_Own_Direction:0 "Notre propre voie"
 FRA_VIC_Our_Own_Direction_desc:0 "Les Forces armées de la République française ont une fois de plus démontré leur force et fait honneur à la nation lors du dernier conflit. L'efficacité au combat de notre armée compte incontestablement parmi les meilleures d'Europe. C'est un fait indiscutable. Cependant, ce n'est pas par déloyauté envers nos alliés, mais par sens des responsabilités, que nous devons répondre aux préoccupations exprimées par nos officiers et soldats concernant la laxité de nos alliés en matière d'armement et de discipline, pendant et après la guerre. Ces préoccupations méritent la sérieuse attention de nos dirigeants politiques et de nos hauts commandants. Pour préserver l'indépendance et l'héritage de nos forces armées, maintenir leur haute efficacité au combat et garantir à la France son statut continu de grande puissance militaire, nous devons fermement rejeter l'idée erronée de fusionner l'armée française dans une force unifiée européenne. Nous devons continuer à donner la priorité au développement de notre propre armée."
 FRA_VIC_With_Distinction:0 "Avec distinction"
 FRA_VIC_With_Distinction_desc:0 "Du miracle d'Orléans au triomphe d'Austerlitz, de la défense de Verdun à la libération de Paris du Troisième Reich, et aujourd'hui aux combats aux côtés des alliés d'Europe de l'Est contre les envahisseurs russes, la glorieuse histoire et les exploits de l'armée française ont traversé le temps et les changements de régime. L'esprit combatif s'est transmis de génération en génération. Chez les soldats français d'aujourd'hui, les valeurs chevaleresques et la camaraderie d'autrefois brillent encore. En renforçant ce sentiment d'unité à travers l'histoire, nous rappellerons aussi au peuple français les grandes actions de ses ancêtres et les responsabilités historiques qu'il porte désormais. L'armée servira de modèle à la société française, guidant la nation dans l'accomplissement de sa mission."
 FRA_VIC_The_Frenchmans_Burden:0 "Le fardeau du Français"
 FRA_VIC_The_Frenchmans_Burden_desc:0 "Rien ne rend un Français plus fier que d'être citoyen du premier pays à avoir renversé un tyran et à avoir atteint l'indépendance et la prospérité par ses propres efforts. Les forces armées de la première république démocratique du monde ont longtemps été une force vitale de cohésion nationale. Ce sentiment unique de responsabilité sera l'élément central de l'union de la société française et du renforcement de l'armée française dans l'ère à venir. Nous montrerons aux citoyens de France comme au monde que défendre et répandre les idéaux de liberté, d'égalité et de fraternité est la grande mission du peuple français — une mission façonnée par l'histoire glorieuse de la France et les luttes de son peuple. Cette conscience civique renouvelée apportera de profonds changements à l'armée française. Désormais, elle combattra avec la double mission de défendre le présent et de façonner l'avenir."
 FRA_VIC_The_New_Grand_Army:0 "La Grande Armée"
 FRA_VIC_The_New_Grand_Army_desc:0 "Chaque année, le 14 juillet, la fête nationale est une célébration pour le peuple français. Ce jour-là, Paris devient une mer de bleu, blanc et rouge, et les représentants de l'élite de l'armée française défilent à l'unisson sous l'Arc de Triomphe, symbolisant la force et l'unité du peuple français et la dignité inébranlable de la nation. L'éclat des fusils, les casques de cuivre et les plumets rouges de la cavalerie, les canons levés et les chenilles massives des chars Leclerc inspirent crainte et fierté. Nous continuerons à montrer la puissance de l'armée française, à mettre en valeur son unicité, à éveiller la fierté nationale et à rappeler aux soldats leur esprit fondateur. Ils sauront qu'ils ne défendent pas simplement la patrie avec passion ; à tout moment, la patrie est à leurs côtés."
 FRA_VIC_Return_to_Old:0 "L'armée française d'antan"
 FRA_VIC_Return_to_Old_desc:0 "Après une période de reconstruction et d'entraînement rigoureux, l'armée française a démontré ses plus belles qualités, rivalisant avec les forces invincibles menées par le Grand Condé, Napoléon, Foch et Tassigny. L'armée a prouvé sa capacité à surmonter de dures épreuves, à préserver son identité profonde et à dissuader tous les adversaires mal intentionnés. Nos dirigeants politiques et nos généraux supérieurs sont très satisfaits de l'état actuel de l'armée et sont pleinement prêts à déployer cette formidable force dans tout conflit majeur futur. Ils sont confiants dans les grandes victoires que cette armée est prête à remporter."
 FRA_VIC_Strengthen_NATO:0 "Renforcer notre engagement"
 FRA_VIC_Strengthen_NATO_desc:0 "Si quelqu'un doute encore du rôle crucial de l'alliance atlantique dans la défense de l'Europe — surtout après que les États-Unis, trop absorbés par leur effondrement interne, n'ont pu apporter leur soutien, le laissant insuffisant, et après que la guerre d'agression russe, animée par des ambitions expansionnistes, s'est terminée par une défaite — alors son point de vue est dangereusement court-termiste. De telles vues pourraient causer un préjudice profond à la civilisation occidentale. Heureusement, les dirigeants politiques de notre pays et de nos alliés restent inébranlables dans leur engagement envers la voie de l'Union européenne. Ils ont résolument promis de renforcer la coopération militaire, prenant des décisions clés pour l'avenir de l'Europe. En tant que puissance militaire la plus importante de l'UE et force principale résistant aux menaces de l'Est, les Forces armées françaises continueront d'être l'épine dorsale de la sécurité européenne, toujours prêtes au prochain défi."
 FRA_VIC_The_European_Army:0 "L'armée européenne"
 FRA_VIC_The_European_Army_desc:0 "Le président Emmanuel Macron a constamment appelé à la création d'une « force armée européenne indépendante ». Cependant, cette initiative a fait face à une opposition répétée des États-Unis, et beaucoup en Europe, gardant encore des illusions sur les États-Unis et la Russie, doutaient de sa faisabilité. Ils craignaient que provoquer l'une ou l'autre superpuissance n'entraîne des conséquences militaires ou économiques catastrophiques. Aujourd'hui, ces craintes se sont révélées fausses. L'Europe ne peut plus se permettre de dépendre d'une superpuissance pour sa sécurité. De plus, la coopération militaire à petite échelle entre nations européennes, en place depuis plus de quarante ans, a démontré sa valeur lors du récent conflit. Il est temps que Bruxelles et nos gouvernements agissent avec décision et œuvrent à la réalisation de l'objectif de longue date d'une « armée européenne »."
 FRA_VIC_Our_Place_in_Europe:0 "Notre rôle en Europe"
 FRA_VIC_Our_Place_in_Europe_desc:0 "La France est le centre politique, le moteur économique et le bastion militaire de l'Europe — son importance dans l'Europe contemporaine ne peut être surestimée. Sur le plan militaire, pour renforcer notre rôle de leadership et notre position au sein de l'UE, nous favoriserons une coopération plus étroite entre l'armée française et les forces alliées. Cela inclut l'établissement de normes d'entraînement unifiées, l'élaboration de plans organisationnels coordonnés, le lancement de programmes d'échange de cadets et la conduite d'exercices conjoints globaux et multiniveaux dans toutes les branches. Les normes élevées et la vaste expérience de l'armée française en font un modèle pour toute armée européenne. À mesure que davantage d'alliés adoptent les pratiques militaires françaises, notre influence et l'ampleur potentielle des forces conjointes que nous pouvons diriger dans les conflits futurs ne cesseront de croître."
 FRA_VIC_The_French_European_Army:0 "L'Armée franco-européenne"
 FRA_VIC_The_French_European_Army_desc:0 "Après une vaste collaboration et des ajustements, nous sommes fiers de dire que le modèle militaire français a été adopté par plusieurs pays européens. Le système de commandement et les unités de combat français s'intègrent désormais parfaitement à ceux de ces nations, permettant la formation rapide d'une force conjointes prête au combat. Les dirigeants politiques et militaires de Paris, Berlin, Bruxelles, Amsterdam et Rome conviennent que le moment est venu d'établir une force armée conjointe européenne permanente. Bâtie sur l'expérience militaire française, cette force multinationale unira des soldats de pays et de langues différents dans la mission de sauvegarder la civilisation européenne. Dans cet effort, l'armée française et son haut commandement joueront un rôle central et irremplaçable."
 FRA_VIC_A_Distinctly_French_Force:0 "Une force strictement française"
 FRA_VIC_A_Distinctly_French_Force_desc:0 "Si nous privilégions vraiment la sécurité de la France et de l'Europe, nous devons rejeter toute illusion ou rhétorique creuse qui pourrait entraver nos actions. Après de profondes discussions internes, nos dirigeants politiques et nos responsables militaires conviennent à l'unanimité que maintenir l'indépendance de l'armée française est le meilleur moyen d'assurer une défense fiable et de protéger la civilisation européenne. Les défis potentiels d'une force armée conjointes européenne — confusion du commandement, barrières linguistiques et différences culturelles — sont des raisons clés d'abandonner le plan des forces conjointes. La France continuera de soutenir les armées alliées sur cette base. Cette stratégie permet à l'armée française de conserver sa fierté tout en restant la plus forte gardienne de l'Europe et un modèle pour les forces européennes."
 FRA_VIC_The_New_French_Army:0 "La nouvelle armée française"
 FRA_VIC_The_New_French_Army_desc:0 "La nouvelle phase de la réforme militaire française touche à sa fin, et nous pouvons affirmer avec confiance que l'armée française reste la force la plus puissante d'Europe. Comparée à ce qu'elle était, l'armée française est désormais encore plus redoutable pour ses ennemis, avec une structure interne plus efficace et plus résiliente, atteignant le sommet tant en attaque qu'en défense. Marianne sera fière de nos réalisations, et rien de tout cela n'aurait été possible sans les réformes audacieuses qui ont transformé l'armée française."
 FRA_End_of_War:0 "Fin de la guerre"
 FRA_End_of_War_desc:0 "Alors que la fumée de la guerre se dissipe, le doux parfum de la paix semble à la fois nostalgique et vivifiant. La menace russe a été neutralisée, laissant le pays sans force et attendant son sort. En ce moment de victoire, un désir partagé existe parmi les Français, des dirigeants aux citoyens, d'en finir au plus vite avec l'état de guerre. L'objectif est de réduire le fardeau des dépenses militaires sur la société et l'économie nationale. Bien que des inquiétudes sur le « désarmement » subsistent, les projets de loi pour la reconstruction pacifique et la démilitarisation de l'Europe seront bientôt présentés au Parlement. Le peuple français croit que, dans cette nouvelle ère, l'engagement en faveur de la paix et la force collective de la population suffiront à empêcher toute ambition de résurgence des grandes puissances et toute politique militaire agressive."
 FRA_End_Conscription:0 "Fin de la conscription"
 FRA_End_Conscription_desc:0 "La conscription a une longue histoire en France, assurant au pays une armée forte et prête pendant des siècles. En temps de crise, le vaste vivier de citoyens entraînés a constitué une précieuse réserve pour répondre aux besoins urgents. Un exemple récent est la guerre contre la Russie, où les citoyens français mobilisés ont fait preuve d'un courage et d'une adaptabilité remarquables sur le champ de bataille. Bien que servir la nation reste une source de fierté, les années paisibles du début du XXIe siècle ont conduit le peuple français à réfléchir à l'évolution des circonstances. Le modèle de « l'armée de citoyens » ne convient plus à la guerre moderne. Une armée professionnelle est désormais mieux équipée pour remplir la tâche de défendre la nation."
 FRA_Surrender_the_Military:0 "Céder l'armée"
 FRA_Surrender_the_Military_desc:0 "Bien que nos dirigeants politiques aient décidé que la France doit bâtir ses forces armées et façonner sa stratégie militaire dans le cadre d'une défense européenne unie, les généraux du ministère de la Défense et de l'état-major restent obstinément réticents. S'accrochant à leur fierté et à leurs intérêts acquis, ils refusent de céder la moindre parcelle de pouvoir, à laquelle ils tiennent. Dans le paysage européen en évolution rapide et de plus en plus dangereux, nous ne pouvons pas nous permettre de perdre du temps à discuter avec eux. Par une approche de la « carotte et du bâton », nous limiterons résolument l'autorité militaire des généraux pour atteindre nos objectifs, tout en le faisant avec élégance."
 FRA_VIC_surrendered_the_military_tt:0 "Cela transférera notre §Gentire armée§! à notre fidèle allié, [GER.GetFlag] l'Allemagne, tout en créant une §Yforce d'élite§! pour la défense quotidienne."
 FRA_VIC_surrendered_the_military_tt_desc:0 ""
 FRA_Maintain_Military_Strength:0 "Maintenir la puissance militaire"
 FRA_Maintain_Military_Strength_desc:0 "Le ministère de la Défense et l'état-major ont persuadé nos dirigeants politiques que maintenir la taille actuelle des forces armées est essentiel. La France ne peut plus se permettre de se concentrer uniquement sur ses propres intérêts. La menace de l'Est n'est pas totalement éliminée, des conflits persistent dans plusieurs régions d'Europe, et des guerres continuent de faire rage en Amérique du Nord, en Asie de l'Est et au Moyen-Orient, causant d'immenses souffrances. La rhétorique constante des pacifistes ne sert pas vraiment la nation et pourrait nous ramener aux temps dangereux de 1940. Une armée française forte et capable saura relever tout défi, démontrant que les idéaux de « Liberté, Égalité, Fraternité » restent aussi vitaux que jamais."
 FRA_National_Demobilization:0 "Démobilisation nationale"
 FRA_National_Demobilization_desc:0 "Du point de vue de la sauvegarde de la souveraineté, de la sécurité et des intérêts nationaux de la France, la taille actuelle de l'armée est excessive — plus grande que nécessaire. Le sujet d'un désarmement significatif n'est plus nouveau dans la politique et la société françaises, et aujourd'hui, une série de politiques connexes sera officiellement adoptée. Tout en réduisant les redondances militaires, nous devons veiller à continuer d'honorer et de remercier les braves guerriers qui se sont sacrifiés pour défendre la liberté et la justice. En même temps, nous traiterons responsablement les affaires des anciens combattants et bâtirons une force plus légère et d'élite — aguerrie et capable de réaction rapide et de réussite des missions."
 FRA_VIC_The_conservative_revolution:0 "La révolution conservatrice"
 FRA_VIC_The_conservative_revolution_desc:0 "La soi-disant \"end of history\" que les libéraux nous avaient promise n'est pas encore venue. La paix qui devait suivre l'effondrement soviétique n'est jamais arrivée. En fait, le monde est aujourd'hui dans un état bien plus volatile qu'il y a seulement quelques décennies. De plus, notre nation a souffert à l'époque moderne, et le peuple veut du changement. Ils se sont donc mobilisés en masse pour soutenir les conservateurs, qui, désormais aux commandes, orienteront la France sur la bonne voie."
 FRA_VIC_Our_Bountiful_Economy:0 "Notre économie prospère"
 FRA_VIC_Our_Bountiful_Economy_desc:0 "La pandémie de COVID et l'effondrement américain ont fortement contribué à plusieurs années de faible croissance économique. Cependant, avec la menace russe écartée et la communauté européenne plus imbriquée que jamais, notre économie a connu un boom. Maintenant que nous n'avons plus à nous soucier de l'Est, nous pouvons veiller à ce que cette période de prospérité économique ne soit pas gâchée."
 FRA_VIC_Economic_Patriotism:0 "Patriotisme économique"
 FRA_VIC_Economic_Patriotism_desc:0 "Notre récente croissance économique ne peut être attribuée qu'à une seule source : le dur labeur du peuple français. Par conséquent, les décisions qui pourraient bénéficier à d'autres nations de l'UE seront mises de côté au profit de celles qui bénéficieront à notre peuple. Bien sûr, nous n'avons pas l'intention de manquer à notre engagement envers nos frères européens. Simplement, nous financerons les petites entreprises françaises plutôt que les roumaines."
 FRA_VIC_Bask_in_the_Light:0 "Se prélasser dans la lumière"
 FRA_VIC_Bask_in_the_Light_desc:0 "Notre dur labeur a complètement redressé notre économie, et le peuple en ressent désormais les effets. Avec davantage de financement public, les services publics atteignent de nouveaux sommets. Petites entreprises et grandes sociétés ont ressenti l'impact de nos subventions et de nos financements, et l'inflation a baissé de plusieurs points. Plus de gens ont un toit au-dessus de la tête et de quoi manger, et nous travaillerons dur pour que cette tendance se poursuive !"
 FRA_VIC_The_French_Golden_Age:0 "L'âge d'or français"
 FRA_VIC_The_French_Golden_Age_desc:0 "Tout notre dur labeur a culminé en ce moment. Pendant des décennies, la France a été l'ombre d'elle-même, accablée par les événements du XXe siècle, et il ne semblait pas que les années 2020 seraient meilleures. Mais ensuite miracle après miracle, et nous pouvons maintenant affirmer avec confiance avoir repris notre place parmi les grandes nations du monde. Notre peuple est heureux, notre armée est forte, et notre économie est dynamique. Quoi que les prochaines années nous réservent, nous l'affronterons de front et veillerons à ce que notre nation reste unie et forte !"
 FRA_VIC_Our_Native_Land:0 "Notre terre natale"
 FRA_VIC_Our_Native_Land_desc:0 "La France existe depuis longtemps, et bien qu'elle ait souffert, nous avons toujours travaillé dur pour préserver notre terre. Avec notre victoire sur les Russes, nous l'avons une fois de plus protégée. Maintenant, nous pouvons regarder vers l'intérieur et veiller à ce que notre grande république soit à la hauteur de sa réputation. Nous ne reposerons pas tant que nos terres ne seront pas pleinement mises en valeur et aussi belles qu'elles devraient l'être."
 FRA_VIC_Spirit_of_Degaul:0 "L'esprit de Charles de Gaulle"
 FRA_VIC_Spirit_of_Degaul_desc:0 "Le général de Gaulle est l'un des nombreux héros de l'histoire française. C'est grâce à ses efforts que notre patrie a été libérée des envahisseurs fascistes pendant la Seconde Guerre mondiale, et que nous avons pu si bien nous reconstruire après des années d'occupation. Bien qu'il soit mort depuis de nombreuses années, l'esprit qu'il incarnait, l'esprit de la France, vit encore aujourd'hui ! La nation française doit rester libre, et pour cela nous devons rester forts !"
 FRA_VIC_For_Every_Drop_of_Blood:0 "Pour chaque goutte de sang"
 FRA_VIC_For_Every_Drop_of_Blood_desc:0 "La victoire dans toute guerre a un coût élevé, et nous n'avons pas été épargnés. Beaucoup de nos jeunes hommes et femmes ont été tués au combat contre les forces russes, donnant tout pour repousser l'assaut. Ils ont réussi, mais leur sacrifice ne signifiera rien si nous le gaspillons. Nous devons utiliser ce temps de paix pour nous préparer à la prochaine grande guerre et veiller à ce que, cette fois, nous perdions le moins de Français possible."
 FRA_VIC_Revile_Russian_Autocracy:0 "Vilipender l'autocratie russe"
 FRA_VIC_Revile_Russian_Autocracy_desc:0 "Alors que beaucoup ont salué les résultats de la guerre européenne comme l'annonce d'une nouvelle ère de démocratie russe, quiconque a un peu de bon sens comprend que rien n'a changé. Oui, la direction a changé et le pays n'est plus ouvertement expansionniste, mais au fond c'est toujours la même Russie. Ils reviendront tôt ou tard, et d'ici là, nous devons les affaiblir par tous les moyens."
 FRA_VIC_Our_Free_People:0 "Notre peuple libre"
 FRA_VIC_Our_Free_People_desc:0 "Qu'est-ce que la France, sinon une nation d'hommes libres ? Notre liberté a connu des revers et des défis, mais elle n'a jamais été longtemps abattue, grâce au travail du peuple français. Notre récente victoire sur la Russie a prouvé que le désir de liberté de nos citoyens n'a pas faibli, au point qu'ils sont prêts à se battre pour la défendre. La lumière de la liberté ne s'éteindra jamais ici, nous ferons tout pour l'assurer."
 FRA_VIC_The_France_of_Today:0 "La France d'aujourd'hui"
 FRA_VIC_The_France_of_Today_desc:0 "La France a une histoire qui remonte à plus de mille ans. Des Gaulois aux Romains, de Charlemagne à Napoléon, nous ne sommes plus rien de ce que nous étions. Mais nous ne sommes pas ici pour parler d'histoire ancienne, tout le monde ne se soucie que du présent. La France d'aujourd'hui est une nation qui s'efforce constamment d'offrir une vie meilleure à son peuple, et tant que les conservateurs resteront au pouvoir, tel restera notre objectif."
 FRA_VIC_Denounce_Liberal_Authoritarianism:0 "Dénoncer l'autoritarisme libéral"
 FRA_VIC_Denounce_Liberal_Authoritarianism_desc:0 "Les ennemis sont de toutes formes et de toutes tailles, venus de tous les coins du globe, et logiquement il y en aurait donc certains à l'intérieur de nos frontières. La menace la plus proche de chez nous prend la forme de l'extrême gauche. Communistes, anarchistes et compagnie ne demanderaient rien de mieux que de démolir la structure politique actuelle et de la remplacer par quelque chose de bien plus répugnant. Cet avenir doit toutefois rester un fantasme dans leur esprit, car nous ferons tout pour empêcher qu'il se réalise."
 FRA_VIC_The_Red_Banner:0 "La bannière rouge"
 FRA_VIC_The_Red_Banner_desc:0 "Où se situe l'avenir de la France ? Après avoir vaincu les tyrans de l'Est et le régime russe — qui n'est ni « libéral » ni « démocratique » — comment la France entrera-t-elle dans cette nouvelle ère historique ? Le peuple français a fait son choix par son vote : la Grande Coalition de gauche a obtenu une position de gouvernement indiscutable. Cette fois, elle arrive au pouvoir avec une ambition audacieuse — apporter des changements fondamentaux à la société française et bâtir un État véritablement tourné vers le peuple. Elle est déterminée à utiliser son mandat pour mettre en œuvre des réformes transformatrices pour la France. Peut-être, de notre vivant, le rêve de drapeaux rouges flottant sur l'Europe deviendra-t-il réalité."
 FRA_VIC_United_in_Equality:0 "Unis dans l'égalité"
 FRA_VIC_United_in_Equality_desc:0 "« Égalité » — quel beau mot. Il a été la quête commune d'innombrables générations. Des royaumes d'égalité « utopiques » chantés par les bardes anciens à la grande société pour laquelle ont lutté les communistes marxistes, l'idéal d'abolir toutes les différences identitaires et de classe n'a jamais été abandonné. Aujourd'hui, en embrassant la renaissance de notre patrie française, nous portons cet idéal vers l'avant, laissant les fleurs de l'égalité s'épanouir sur la terre de la liberté. Inspirés par l'esprit d'innombrables martyrs, nous croyons que tous les citoyens s'uniront avec une solidarité sans précédent pour investir dans cette grande cause."
 FRA_VIC_Redefine_the_French_Citizen:0 "Redéfinir le citoyen français"
 FRA_VIC_Redefine_the_French_Citizen_desc:0 "Que signifie être un « citoyen français » ? Beaucoup de gens peuvent donner des réponses différentes : lieu de naissance, langue, culture, ou même ethnie et race. Définir l'identité d'un Français est une étape cruciale dans la formation de l'État-nation moderne. Aujourd'hui, une nouvelle réponse à cette question jouera un rôle clé dans la détermination de la direction de nos réformes socialistes. Ce n'est qu'en unifiant notre compréhension de ce concept que nous pourrons créer une base solide pour promouvoir des entreprises qui profitent vraiment au peuple. C'est pourquoi nous accueillerons dans la famille française tout citoyen qui s'identifie à la culture française et la valorise, en embrassant tous ceux qui considèrent cette terre comme leur foyer. Avec un passé fier rempli de moments glorieux, le peuple français franchira son premier pas dans une nouvelle ère."
 FRA_VIC_End_Neo_Colonialism:0 "Mettre fin au néocolonialisme"
 FRA_VIC_End_Neo_Colonialism_desc:0 "Le néocolonialisme, ce « Kraken » né des intérêts du capital mondial, tourmente les peuples du monde depuis des décennies. Le nombre de pays et d'individus qu'il a dévastés est incalculable. Honteusement, la France, fille aînée de la civilisation occidentale, a autrefois soutenu l'œuvre mauvaise de l'oppression de peuples d'autres continents. Nous expierons nos erreurs passées avec un engagement inébranlable. Au cœur du continent noir, les libérateurs français apporteront liberté et justice. Nous promettons solennellement d'investir toutes nos ressources et notre force pour rendre leur dignité à nos semblables qui ont tant souffert et leur apporter le bonheur. Cette fois, les colonisateurs cruels seront totalement éradiqués, et le soleil universel réchauffera tous."
 FRA_VIC_Revolution_without_Revolution:0 "Une révolution sans révolution"
 FRA_VIC_Revolution_without_Revolution_desc:0 "Enfin, nous avons réussi. Après avoir essuyé d'innombrables tempêtes et connu des moments de gloire comme de chagrin, les cloches de Notre-Dame de Paris sonnent désormais en célébration de la grande cause du peuple français. Les souvenirs violents et sanglants de la révolution se sont estompés. Ce que nous avons accompli sur le sol français peut désormais être appelé une « révolution sans révolution ». Les Français ont dépouillé les atours de l'ancienne époque et sont devenus les pionniers du nouvel âge. Dans ce grand pays, rempli de rêves, de prospérité, de paix et d'amitié, l'histoire de vous et moi ne fait que commencer."
 FRA_VIC_Ground_Up_Army_Reform:0 "Réforme de l'armée par la base"
 FRA_VIC_Ground_Up_Army_Reform_desc:0 "Le prestige et le respect dont jouit depuis longtemps l'armée française ont souvent été tenus pour acquis. Cependant, un examen plus attentif de son état révèle une image moins flatteuse. Si nous voulons faire avancer les réformes que nous avons planifiées, l'armée est le premier grand défi à relever. Pendant des années, des vues conservatrices et réactionnaires et des structures hiérarchiques bien ancrées ont étouffé les voix progressistes et tournées vers le peuple, éloignant encore davantage l'armée de la société française dans son ensemble. Nous devons donc réformer le système de fond en comble — balayer les vieilles méthodes et nettoyer la poussière et les débris. Ce processus causera inévitablement de l'instabilité et des défis imprévus. Mais comme le dit le vieil adage, « on ne fait pas d'omelette sans casser des œufs ». À long terme, une armée plus étroitement unie au peuple écrira un nouveau chapitre de l'histoire de la France."
 FRA_VIC_Compensate_the_Veterans:0 "Indemniser nos anciens combattants"
 FRA_VIC_Compensate_the_Veterans_desc:0 "Ce n'est pas une exagération de dire que le drapeau rouge socialiste de la France d'aujourd'hui est teint du sang d'innombrables guerriers qui ont combattu courageusement contre les tyrans de l'Est. Aussi le respect et la gratitude envers ces héros ne seront-ils jamais de trop. Le gouvernement français exprimera sa profonde reconnaissance aux anciens combattants non seulement par la propagande, mais aussi par des actes concrets. Les agriculteurs retraités recevront des terres et un soutien technique pour améliorer leur vie ; les travailleurs honnêtes retournant dans les villes et les usines bénéficieront de généreux avantages et d'une sécurité d'emploi, assurant le bonheur et la paix de milliers de familles. Nous nous montrerons un gouvernement plus responsable, plus soucieux de l'avenir de nos héros nationaux que les gouvernements bourgeois du passé. Le brillant ruban rouge de la Légion d'honneur sera leur plus haute distinction."
 FRA_VIC_Demobilize_the_People:0 "Démobiliser le peuple"
 FRA_VIC_Demobilize_the_People_desc:0 "Entraver ou faire taire les luttes autonomes et les revendications légitimes du peuple est la dernière chose que nous voulons faire. C'est essentiel pour que nous puissions mériter le titre de « gouvernement du peuple ». La réforme ne peut devenir réalité que par les actions spontanées de l'ensemble de la population. Si les fruits du progrès social ne sont pas chéris et protégés par le peuple, ils resteront de simples illusions. Alors que l'aube de la paix s'étend sur la France et l'Europe, il est temps de lever complètement toutes les entraves tangibles ou intangibles qui ont enchaîné le peuple français. Il est réjouissant de voir les travailleurs français libérer leur créativité et leur initiative, explorer et s'efforcer hardiment, et façonner de leurs propres mains la vision d'une nation libre."
 FRA_VIC_Expand_the_Rights_of_Man:0 "Élargir les droits de l'homme"
 FRA_VIC_Expand_the_Rights_of_Man_desc:0 "Comment devons-nous définir les « droits de l'homme » ? Certains soutiennent que les droits de l'homme concernent le développement économique et le droit à une vie prospère. Cependant, cette vision matérialiste néglige les besoins spirituels légitimes du peuple. D'autres se concentrent sur des concepts comme la « liberté d'expression » et la « diversité culturelle », mais ces idées sont souvent devenues des enjeux politiques, suscitant conflits et divisions. Pour éviter de répéter les erreurs du passé, nous devons proposer une nouvelle définition conforme aux conditions nationales actuelles de la France et guidant l'avenir du peuple français. Les droits de l'homme doivent transcender les outils politiques, et la justice et les principes défendus par les combattants révolutionnaires du passé seront revitalisés au XXIe siècle."
 FRA_VIC_Form_A_Pink_Red_Coalition:0 "Coalition rose-jaune-rouge"
 FRA_VIC_Form_A_Pink_Red_Coalition_desc:0 "Après des années de lutte pour le bien-être du peuple français, les forces progressistes de la gauche française peuvent enfin déployer leurs ailes et apporter au pays une brise socialiste nouvelle, dissipant la morosité de l'ancienne époque. Pour y parvenir, une base de gouvernement large et solide doit être construite sur l'alliance de partis existante. Le Nouveau Front populaire, composé principalement de LFI, du PCF, du PS et d'EELV, doit maintenant se renforcer en absorbant d'autres partis proches de la gauche pour accroître sa puissance et son unité interne. En même temps, il doit améliorer ses mécanismes de communication et de coopération, devenant un meilleur canal pour représenter le peuple et faire entendre sa voix. Pour le Nouveau Front populaire, cette nouvelle ère marque le début d'une lutte renouvelée. Cependant, avec le ferme soutien du peuple français, tous les défis et obstacles peuvent être surmontés."
 FRA_VIC_The_Left_Prevails:0 "La gauche l'emporte"
 FRA_VIC_The_Left_Prevails_desc:0 "Certains doutaient que le vrai socialisme puisse trouver sa place dans l'Europe d'aujourd'hui. Même lorsqu'un parti se réclamant du socialisme arrivait au pouvoir, il était souvent dirigé par une petite bourgeoisie mêlant des idées néolibérales, se prosternant devant le grand capital et les intérêts acquis en échange de coopération. Mais dans la France d'aujourd'hui, de tels discours appartiennent au passé. Grâce à notre victoire sur le dictateur russe, à notre légitime victoire électorale et à la mise en œuvre de réformes sociales audacieuses, l'alliance de gauche en France est devenue la véritable force de la politique française, gagnant le soutien sincère et enthousiaste du peuple et excellant dans de multiples domaines. Même si des vestiges de l'ancien ordre refusent d'accepter leur défaite et tentent de saper notre cause, le peuple français ne le permettra jamais."
 FRA_VIC_Peace_Land_and_Bread:0 "Paix, terre et pain"
 FRA_VIC_Peace_Land_and_Bread_desc:0 "Pour le Français moyen, une vie heureuse peut symboliser beaucoup de belles choses, ou simplement inclure quelques-uns des besoins les plus chers et essentiels. « Paix, terre et pain » — ce vieux slogan, transmis depuis la Révolution française, a traversé deux guerres mondiales et reste pertinent aujourd'hui. Il montre que même les souffrances les plus profondes ne peuvent détruire les espoirs et les rêves des générations. En tant que représentants et serviteurs dévoués du peuple français, nous veillerons à ce que ces choses ne lui échappent plus jamais. Ce n'est pas seulement un reflet de l'histoire, mais aussi notre déclaration audacieuse pour l'avenir."
 FRA_VIC_The_Republic_Eternal:0 "La République éternelle"
 FRA_VIC_The_Republic_Eternal_desc:0 "Dire que l'histoire de France a toujours été mouvementée est un euphémisme. Des révolutions aux épurations en passant par les occupations, les périodes de stabilité sont rares. Et comme Churchill le craignait à l'époque de la guerre froide, la menace russe marcherait vers l'ouest, menaçant de piétiner la démocratie est-européenne et de restaurer sa puissance sur le continent européen. Mais nous ne sommes pas restés les bras croisés. Nous avons tenu bon contre l'autocratie russe. Nous n'avons pas reculé devant des obstacles insurmontables. Maintenant, alors que la poussière retombe et que les armes se taisent, nous triomphons de la tyrannie. Côte à côte avec nos alliés, nous avons sauvé la France et l'Europe de la destruction. Nous regardons désormais l'avenir, prêts à affronter ce qui viendra. Confiants que la République durera éternellement, quoi qu'il advienne."
 FRA_VIC_Divided_by_Ideas:0 "Divisés par les idées"
 FRA_VIC_Divided_by_Ideas_desc:0 "Dire que l'Europe est un vaste continent d'idées serait un euphémisme. Du Léviathan au Manifeste communiste, le continent fut le berceau de nombreuses idéologies qui existent encore aujourd'hui. Tout au long de l'histoire, de grands empires et puissances mondiales ont tenté d'imposer une idéologie unificatrice à l'Europe, de l'âge de l'absolutisme au Rideau de fer pendant la guerre froide. Mais pourquoi devrions-nous imposer notre voie au reste de l'Europe ? Nous devons embrasser l'Europe pour ce qu'elle est vraiment. C'est une tapisserie non seulement de nations mais aussi d'idées, où chacun peut embrasser ses idées et ses idéologies, libre de tout jugement. "
 FRA_VIC_Past_the_Darkness:0 "Au-delà des ténèbres"
 FRA_VIC_Past_the_Darkness_desc:0 "Alors que les États-Unis s'effondraient, beaucoup ont profité de leur calamité pour affirmer que nos précieuses démocraties libérales étaient toutes au bord de l'effondrement, condamnées à la stagnation et à la déposition finale par des forces radicales. Cependant, notre triomphe contre les pseudo-tyrans russes et leur volonté d'asservir l'Europe de l'Est a prouvé que ces pessimistes avaient tort. Bien sûr, nous avons encore de nombreux problèmes à régler aux niveaux national et international. Cependant, nos précieux systèmes libéraux reposent toujours sur les idées de discussion et de décision démocratique qui garantissent que, quelles que soient les tempêtes que nous essuyons, nous pouvons les affronter de la manière qui convient le mieux à tous."
 FRA_VIC_Onto_the_Light:0 "Vers la lumière"
 FRA_VIC_Onto_the_Light_desc:0 "Les ténèbres instaurées par la pandémie et la calamité des années 2020 ne nous échappent pas. Cependant, nous avons déjà affronté les forces de la tyrannie et nous les avons affrontées à nouveau, même sans nos bienfaiteurs américains. Notre optimisme, autrefois qualifié de sot et d'égaré, nous a permis de sortir des crises que la décennie nous a jetées encore plus forts qu'avant. Le changement d'attitude au niveau national a encouragé une plus grande participation politique, un taux de natalité plus élevé et la volonté de notre peuple de se battre et de mourir pour ses idéaux, même contre des obstacles insurmontables. Que ceci soit l'ère où nous apportons enfin le triomphe de la démocratie libérale contre les forces de l'autoritarisme et de l'oppression. "
 FRA_VIC_The_French_Shining_Bright:0 "La France rayonnante"
 FRA_VIC_The_French_Shining_Bright_desc:0 "Nous sommes allés loin, non seulement en tant que nation, mais en tant que peuple français uni, ces dernières années. Beaucoup pensaient que notre nation, aux prises avec des problèmes de politique intérieure et une influence internationale affaiblie, serait bientôt condamnée à un changement de régime radical, ou à l'assujettissement par des puissances étrangères. Cependant, nous avons désormais montré au monde ce que signifie être français, tout en conservant la civilité et le compromis attendus d'une véritable démocratie libérale. Nos principaux maux économiques ont été traités, les esprits revigorés par les flammes de la bataille et la lutte fraternelle contre les forces du mal, sans pour autant succomber aux tentations de la démagogie populiste. Continuons à veiller à ce que la France reste un phare du libéralisme, un phare dont nos ancêtres qui ont pris la Bastille et mis fin à l'Ancien Régime seraient fiers s'ils pouvaient le voir aujourd'hui. Avec cela, continuons d'être le bienfaiteur d'une Europe unie, capable de tenir tête aux forces de la tyrannie tout en veillant à ce que chaque nation, quelle que soit sa taille ou sa force, puisse ensemble se sentir invincible face à toutes les menaces qui se présentent.\n\nIl est important de noter qu'en ce moment de triomphe, des nouvelles de l'Est nous parlent d'une Russie qui panse ses plaies en préparation pour éteindre nos démocraties une fois pour toutes. Nous savons pertinemment que si notre nation, la lumière qu'elle projette sur le continent et le reste du monde, faiblit, nous nous verrons soumis à des tyrans pires encore que ceux que nous avons affrontés dans la guerre européenne. Ils ne nous accorderont pas la même \"mercy\" qu'ils étaient prêts à nous accorder lors de la guerre précédente, et nous devrons affronter leurs torrents de fureur autoritaire avec la lumière aveuglante de la liberté que nous diffusons depuis des siècles. Veillons à ce que, lorsque nous rencontrerons à nouveau les tyrans de l'Est, ils soient repoussés par le cri assourdissant qui a résonné et continuera de résonner à travers les âges…\n\n§B\"VIVE LA FRANCE!\"§!"
 FRA_VIC_Fraternity_of_Nations:0 "Fraternité des nations"
 FRA_VIC_Fraternity_of_Nations_desc:0 "L'unité européenne est un concept particulier, ardemment soutenu par certains et rejeté par d'autres. Pourtant, dans les moments sombres, c'est la force collective des nations européennes qui a vaincu le mal. Qu'il s'agisse de la destruction de l'empire nazi d'Hitler ou de notre récente victoire contre l'ours russe avide de guerre, si nous ne nous étions pas unis pour vaincre la tyrannie, nous aurions été divisés et éliminés un par un. Pourtant, la guerre n'est pas encore finie. Bien que nous ayons pu retarder l'avancée russe, Moscou panse ses plaies et prépare sa revanche. Et si nous ne renforçons pas notre engagement envers la sécurité collective, ils nous submergeront et détruiront tout ce que nous avons bâti."
 FRA_VIC_Cement_our_place_in_Europe:0 "Notre rôle continental"
 FRA_VIC_Cement_our_place_in_Europe_desc:0 "Même si les Russes ont été édentés, nous devons nous rappeler le rôle que nous jouons dans la défense de notre continent. Non seulement nous disposons de l'une des armées les plus puissantes de toute l'Europe, mais notre base industrielle fournit une colonne vertébrale sur laquelle la zone euro et le marché unique européen peuvent compter. Dans cette optique, renforcer ces systèmes nous permet non seulement de consolider notre position de protecteur des valeurs européennes, mais garantira aussi que nous avons renforcé notre influence pour être à la hauteur de nations comme l'Allemagne et le Royaume-Uni en tant que leaders de l'Europe. D'ailleurs, si nous faillissons à ce devoir, qui sait si une Russie résurgente ou une autre force de tyrannie n'éteindra pas la liberté précieuse et la fraternité partagée de notre continent ?"
 FRA_VIC_Europe_United:0 "Europe, unie"
 FRA_VIC_Europe_United_desc:0 "La guerre dont nous sortons est souvent appelée la \"guerre européenne\", celle qui nous a vus, en tant que continent, résister à l'assaut de la tyrannie russe sans l'aide des Américains que beaucoup prétendaient être notre seule ligne de défense. Nous avons prouvé qu'ensemble, en tant que continent unique, nous pouvons et allons résister à toute menace qui se présente. Dans cette optique, nous devons veiller à ce que des organisations comme l'Union européenne disposent du soutien nécessaire pour assurer une plus grande cohésion et coopération européennes, ce qui a déjà porté ses fruits dans l'histoire récente. Sans aller jusqu'au degré de certains fédéralistes, pousser à une intégration économique et militaire plus poussée sera essentiel pour que notre continent puisse surmonter la tempête à venir d'une Russie résurgente, ou d'autres menaces cherchant à imposer leur volonté à nos précieuses démocraties."
 FRA_VIC_Strong_in_our_Resolve:0 "Fermes dans notre détermination"
 FRA_VIC_Strong_in_our_Resolve_desc:0 "Ce que les dernières années nous ont appris, c'est que le monde dans lequel nous vivons ne laisse aucune place à la complaisance. Si nous n'avions pas réussi à nous remilitariser, le manque de soutien américain au sein de l'OTAN nous aurait laissés sans défense face à l'assaut de l'Est, entraînant probablement la mort de la démocratie libérale en Europe. Cependant, notre détermination à affronter ces menaces, tant nationales qu'internationales, a montré que nous pouvons et allons résister à ces menaces géopolitiques. Mais nous voyons maintenant beaucoup de gens retomber dans une supériorité complaisante à la lumière de notre victoire, croyant que notre triomphe contre l'ours russe sera le dernier auquel nous devrons faire face. Mais même dans la victoire, nous devons rester forts dans notre détermination, prêts et désireux d'affronter non seulement les menaces de l'Est, mais aussi celles d'ailleurs dans le monde. Si nous échouons, nous nous retrouverons aux mains de tyrans pires encore que ceux que nous venons d'affronter, un destin qu'il vaut la peine de mourir pour empêcher."
 FRA_VIC_United_in_Liberty:0 "Unis dans la liberté"
 FRA_VIC_United_in_Liberty_desc:0 "La liberté est comme une flamme sans fin. Une fois allumée, elle ne peut être éteinte, seulement atténuée. Le concept de liberté remonte à de grands philosophes comme John Locke, considéré comme le père du libéralisme, et dont les œuvres ont contribué à allumer les flammes qui mèneraient à la Révolution française. Alors que nous triomphons de la tyrannie et du despotisme, nous devons œuvrer à réaliser le rêve de John Locke. Sous notre direction, la liberté brillera sur toute l'Europe. Les opprimés seront libérés, et les oppresseurs connaîtront notre juste vengeance. Et lorsque nous aurons fini, les démons de la tyrannie et de la haine seront relégués dans l'ombre pour le reste des temps."
 FRA_VIC_Utmost_Equality:0 "L'égalité la plus absolue"
 FRA_VIC_Utmost_Equality_desc:0 " Notre bien-aimée république a traversé de nombreuses formes de gouvernance différentes, mais depuis 1791 nous avons toujours essayé de conserver les idéaux fondamentaux de liberté, de fraternité et surtout d'égalité. Si nos lois ont pu établir l'égalité juridique, beaucoup se plaignent encore du manque d'égalité économique ou sociale, en particulier au sein des groupes marginalisés. Maintenant que nos principaux problèmes sur la scène internationale ont été réglés pour l'instant, nous devons tourner notre attention vers ces cas d'inégalité dans notre société. Les radicaux peuvent crier et vociférer, mais nos actes peuvent et vont parler plus fort que leurs petites paroles si nous mettons l'accent sur l'égalité la plus absolue entre nos citoyens. Ce faisant, non seulement nous récolterons les fruits électoraux, mais nous serons à la hauteur du nom que la République française exige depuis l'époque de Robespierre."
 FRA_VIC_The_End_of_History:0 "La fin de l'histoire"
 FRA_VIC_The_End_of_History_desc:0 "Alors que l'Union soviétique s'effondrait et que le monde semblait se tourner vers une ère de paix et de prospérité, cela a engendré un état d'esprit favorable à la montée de la démocratie libérale comme système le mieux adapté à la civilisation humaine. En 1992, Francis Fukuyama a publié son œuvre fondatrice \"The End of History and the Last Man\", qui suggérait que la chute du communisme totalitaire marquait le début de la fin de l'histoire telle que nous la connaissions. Cependant, avec le changement de millénaire et le chaos croissant alimenté par la guerre contre le terrorisme, la crise financière de 2008 et surtout l'effondrement des États-Unis, beaucoup ont ri de sa théorie, la reléguant au rang de simple vœu pieux courant à l'époque. Cependant, notre résistance aux forces de la tyrannie russe a poussé beaucoup à reconsidérer la théorie de Fukuyama, et à penser que, peut-être, sous notre bannière, nous avons perfectionné et cimenté la démocratie libérale comme idéologie directrice de l'Europe au XXIe siècle. Nous devons donc nous considérer comme les représentants de la pensée fukuyamienne, nous qui apporterons une ère de libéralisme qui surpassera les États-Unis et finira par unir le monde sous une bannière de démocratie que les crises que nous affrontons ne pourront éteindre.\n\nNous ne devons pas, et ne pouvons pas, nous reposer avant que chacun, où qu'il soit sur cette planète, ne soit libéré de l'autoritarisme. Apportons la fin d'une histoire qui voit la souffrance et la division comme monnaie courante, et commençons-en une nouvelle qui prise par-dessus tout Liberté, égalité, fraternité !"
 FAF_petainism_fascism:0 "Pétainisme de Vichy"
 FAF_classical_fascism_desc:0 "\n\n\n\n£GFX_FAF_petainism\n\n\n\n\n\n§YLe pétainisme de Vichy§! cherche à réconcilier le régime collaborationniste de l'État français de Philippe Pétain à travers ses idéaux, en particulier la Révolution nationale. Caractérisé par l'antiparlementarisme, le culte de la personnalité, la promotion des valeurs traditionnelles et l'antisémitisme d'État, il voit dans la République française un système corrompu et défaillant qui incarne le concept de Charles Maurras de « l'Anti-France » privilégiant les intérêts étrangers. Trouvant un soutien dans les franges de l'extrême droite française, le pétainisme fasciste espère renverser la démocratie libérale actuelle qui, selon lui, a ruiné la beauté et les idéaux de la France d'avant la Révolution. À travers les idéaux de Travail, Famille et Patrie, les pétainistes fascistes feront vivre à la France leur renaissance idéalisée, même si elle doit donner des coups de pied et hurler en chemin."
 FAF_petainism_junta:0 "Pétainisme résistant"
 FAF_military_junta_desc:0 "\n\n\n\n£GFX_FAF_junta_petainism\n\n\n\n\n\n§YLe pétainisme résistant§! peut être décrit comme la branche plus cynique et modérée de la pensée pétainiste. Leur attachement aux idéaux de la Révolution nationale de Pétain peut varier, mais ils croient toujours aux idéaux antiparlementaires généraux de l'ancien État français. Trouvant son soutien parmi les généraux français, la voie la plus probable vers le pouvoir serait une défaite totale ou un effondrement national permettant à un autre Chef de l'État français d'émerger pour guider la France vers ses anciennes gloires, même face à une défaite totale et absolue."
 FAF_gaullism_auth_dem:0 "Gaullisme résistant"
 FAF_military_democracy_desc:0 "\n\n\n\n£GFX_FAF_resistant_gaullism\n\n\n\n\n\n§YLe gaullisme résistant§!, comparé aux formes complaisantes et alignées sur la démocratie du gaullisme, estime qu'un homme fort militaire est nécessaire pour garantir la stabilité de la République française dans son heure de besoin. Trouvant sa base parmi les officiers et généraux de l'armée française, le moyen le plus probable pour le gaullisme résistant d'accéder au pouvoir est que les partis démocratiquement élus de France tentent de marginaliser ou d'ignorer les préoccupations des Forces armées françaises. Même si certains peuvent prétendre qu'il s'agit d'une terrible dictature ou d'une tutelle politique nécessaire, les gaullistes résistants feront tout pour que la Cinquième République survive par tous les moyens nécessaires."
 FAF_sovereign_democracy_desc:0 "\n\n\n\n£GFX_FAF_resistant_gaullism\n\n\n\n\n\n§YLe gaullisme résistant§!, comparé aux formes complaisantes et alignées sur la démocratie du gaullisme, estime qu'un homme fort militaire est nécessaire pour garantir la stabilité de la République française dans son heure de besoin. Trouvant sa base parmi les officiers et généraux de l'armée française, le moyen le plus probable pour le gaullisme résistant d'accéder au pouvoir est que les partis démocratiquement élus de France tentent de marginaliser ou d'ignorer les préoccupations des Forces armées françaises. Même si certains peuvent prétendre qu'il s'agit d'une terrible dictature ou d'une tutelle politique nécessaire, les gaullistes résistants feront tout pour que la Cinquième République survive par tous les moyens nécessaires."
 FAF_gaullism_conservative:0 "Gaullisme populiste"
 FAF_right_populism_desc:0 "\n\n\n\n£GFX_FAF_populist_gaullism\n\n\n\n\n\n§YLe gaullisme populiste§! synthétise le nationalisme et l'attitude de « paix par la force » des formes plus traditionnelles de gaullisme avec la vague de populisme de droite du XXIe siècle. Si le gaullisme promeut encore à la base des idées telles que l'exceptionnalisme français, ceux qui suivent le gaullisme populiste voient une réinstauration de l'idéologie comme le convoité « retour à la tradition » qui se rattache à nombreux des mouvements populistes existant dans l'« Occident » géopolitique. Même si certains peuvent prétendre que cette politisation d'une idéologie pragmatique est une trahison des idéaux fondamentaux du « Libérateur de la France », les partisans du gaullisme populiste ne reculeront devant rien pour garantir que, de l'Atlantique à l'Oural, c'est la France qui décidera du destin du monde."
 FAF_gaullism_marlib:0 "Gaullisme traditionnel"
 FAF_civic_nationalism_desc:0 "\n\n\n\n£GFX_FAF_traditional_gaullism\n\n\n\n\n\n§YLe gaullisme traditionnel§! est une sous-catégorie de la pensée gaulliste qui met l'accent sur les valeurs nationales par rapport aux autres, les considérant comme l'un des aspects essentiels de l'identité française qui, aux côtés des institutions de la République, doit être protégé. Comparé au gaullisme populiste, il s'aligne davantage sur les idéaux classiques du nationalisme civique pour renforcer le mouvement plutôt que de suivre les nouvelles tendances du populisme de droite devenues plus courantes au XXIe siècle. Trouvant son soutien dans la droite plus modérée de la France, ils espèrent garantir un monde où la France maintient des valeurs traditionnelles tout en contenant les autres « hyperpuissances » du monde."
 FRA_socialist_souverainism:0 "Souverainisme socialiste"
 FRA_national_souverainism:0 "Souverainisme national"
 FRA_patriotic_republicanism:0 "Républicanisme patriotique"
 FRA_popular_front:0 "Front populaire"
 FAF_camus_eurasianism:0 "Nationalisme paneuropéen"
 FAF_eurasianism_desc:0 "\n\n\n\n£GFX_FAF_nationalist_europeanism\n\n\n\n\n\n§YLe nationalisme paneuropéen§! se démarque des attitudes généralement pro-européennes par son rejet complet du libéralisme défendu par l'Union européenne. Il utilise plutôt le fondement d'une « civilisation européenne » composée de chrétiens blancs partageant une histoire et des valeurs culturelles communes. Issu des idéaux de « Europe A Nation » d'Oswald Mosley, le nationalisme paneuropéen reste un courant de pensée continu et sous-jacent au sein de l'extrême droite européenne, surtout à mesure que la fédéralisation de l'Union européenne se poursuit. Représenté par le lambda des boucliers spartiates antiques, les nationalistes paneuropéens croient que par leurs efforts unifiés, ils pourront sauver leur idée de l'Europe de l'assaut du XXIe siècle."
 FAF_bonapartist_thought:0 "Pensée bonapartiste"
 FAF_carolingian_fascism:0 "Fascisme carolingien"
 FAF_neonazism_desc:0 "\n\n\n\n£GFX_Ideology_carolingian_fascism\n\n\n\n\n\n§YLe fascisme carolingien§! est une forme ésotérique, enragée et éclectique du nationalisme français adoptée par Lafayette et ses partisans. Ancrés dans les racines de l'idéologie national-socialiste, ils croient que ceux de la « race judéo-germanique » sont des sous-hommes tirant vers le bas la culture de l'Europe, sympathisant avec la dégénérescence communarde et tentant d'entraîner le monde avec elle. De plus, il s'inspire en partie des idées de la Francie, estimant qu'une plus grande France englobant les frontières de l'empire de Charlemagne est nécessaire pour le Lebensraum français.\nBeaucoup décriraient le fonctionnement interne de l'idéologie de Lafayette comme une secte, suivant directement sa parole et sa vision comme loi. La base même de l'idéologème change et se transforme constamment, jour après jour, heure après heure. Les seules convictions bien ancrées sont celles de la supériorité française et la haine de ceux qu'ils considèrent comme des sous-hommes."
 FAF_lafayette_death_cult_idea:0 "Culte du Maréchal suprême"
 FAF_death_cult_desc:0 "\n\n\n\n£GFX_FAF_cult_of_lafayette\n\n\n\n\n\n§YLe culte du Maréchal suprême§! est un culte de la personnalité dédié au défunt maréchal de l'armée française, Lafayette, disparu pendant le siège de Paris. L'idéologie repose sur un nationalisme extrême et l'exceptionnalisme français, mais des aspects du national-socialisme y sont également répandus. La différence la plus significative entre le culte de Lafayette et les autres idéologies d'extrême droite en Europe est son discours antiallemand, directement hérité des convictions de Lafayette. Il semble que leur haine des Allemands n'ait d'égale que leur dégoût des Russes. Le seul problème auquel le groupe fait face est l'absence d'un véritable guide idéologique. En raison du sort incertain de Lafayette, les partisans de cette idéologie restent indécis quant à l'avenir de l'Europe et de la France. La seule certitude est leur loyauté et leur foi inébranlables en Lafayette."
