 trait_eager_learner_desc:0 ""
 FRA_Redirect_Budget_to_Oil_Contracts_tt:0 "Cette concentration coûtera §R2§! £GFX_political_power_cost_texticon points de puissance politique par jour jusqu'à son achèvement"
 FAF_New_Era_Category:0 "Un peu de l'ancien, un peu du nouveau"
 FAF_New_Era_Category_desc:0 "\n\n\n\n\n£GFX_FAF_new_and_old_cat\n\n\n\n\n\n\n\nLa France a longtemps été la pièce maîtresse de l'histoire européenne, nous possédons l'histoire la plus riche, et notre destin est écrit dans les étoiles. Lorsqu'on parle de civilisation, on en revient toujours à nos réalisations nationales. Qui a tant donné aux arts, à la culture, à la philosophie, à la science et à la technologie ? Qui a passé tant de temps à élever des millions d'êtres humains partout dans le monde aux idées des Lumières et de la modernité ? Nous avons été l'un des rares peuples à le faire. Le français figure parmi les langues les plus parlées au monde et fut jadis la langue franche de toute la diplomatie internationale. Des économies entières et la politique nationale de pays étrangers plient devant notre volonté nationale.\n\nPar le passé, les soldats français ont foulé chaque continent et l'ont revendiqué pour notre glorieuse nation, par dépit envers les autres petits empires européens ; mais tandis que ces empires mouraient sous les révolutions que notre propre révolution glorieuse avait engendrées, nous, nous sommes demeurés. Nous avons honoré des siècles et des siècles d'histoire européenne en tant que puissance continentale avec laquelle il faut compter. Voilà ce que nous sommes ! Voilà notre destin ! Voilà ce que nous resterons aussi longtemps que nous vivrons ! Le monde entier s'inclinera de nouveau devant notre parole, non seulement nos ennemis, mais aussi nos alliés. Vive la France !"
 FRA_yellow_vests_idea:0 "Manifestations des gilets jaunes"
 FRA_yellow_vests_idea_desc:0 "\n\n\n\n£GFX_FRA_yellow_vest_banner\n\n\n\n\n\nLe ralentissement économique français a durement frappé les travailleurs : hausse des prix du carburant, coût de la vie élevé et inégalités croissantes menacent leur niveau de vie. Pendant ce temps, une charge fiscale disproportionnée pèse sur les classes populaires et moyennes. En mai 2018, une pétition a recueilli près d'un million de signatures, déclenchant des manifestations qui se poursuivent depuis près de deux ans.\nLes manifestations, symbolisées par les gilets jaunes, ont rassemblé l'extrême gauche et l'extrême droite dans une opposition au néolibéralisme. Les manifestants ont bloqué des routes, érigé des barricades et défilé lors de grandes manifestations.\nLa violence s'est intensifiée : les villes connaissent des troubles, des affrontements avec la police et des dégâts matériels considérables. La cote d'approbation de Macron a chuté de plus de 20 pour cent. Ces manifestations pourraient marquer un tournant dans la politique française — un éloignement du libéralisme au profit d'une montée de l'extrémisme."
 FRA_yellow_vests_idea_1:0 "Manifestations des gilets jaunes"
