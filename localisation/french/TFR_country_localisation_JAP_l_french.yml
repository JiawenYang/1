JAP_japanese_pacifism_idea: "Pacifisme japonais"
JAP_japanese_pacifism_idea_desc: "Depuis la fin de la Seconde Guerre mondiale, le Japon a été contraint d'abandonner les anciennes voies du militarisme et d'adopter un mode de vie plus pacifiste par rapport au passé. Avec l'article 9 de la Constitution, il est presque impossible pour la nation de lever une armée. Cependant, avec la menace croissante de la Chine à l'est et le déclin constant des États-Unis, beaucoup ont commencé à remettre en question le statu quo et à proposer l'abolition de l'article 9 et la constitution d'une véritable armée pour défendre le Japon et son peuple."
JAP_japanese_pacifism_2_idea: "Pacifisme japonais"
JAP_japanese_pacifism_2_idea_desc: "Depuis la fin de la Seconde Guerre mondiale, le Japon a été contraint d'abandonner les anciennes voies du militarisme et d'adopter un mode de vie plus pacifiste par rapport au passé. Avec l'article 9 de la Constitution, il est presque impossible pour la nation de lever une armée. Cependant, avec la menace croissante de la Chine à l'est et le déclin constant des États-Unis, beaucoup ont commencé à remettre en question le statu quo et à proposer l'abolition de l'article 9 et la constitution d'une véritable armée pour défendre le Japon et son peuple."
JAP_japanese_pacifism_3_idea: "Pacifisme japonais"
JAP_japanese_pacifism_3_idea_desc: "Depuis la fin de la Seconde Guerre mondiale, le Japon a été contraint d'abandonner les anciennes voies du militarisme et d'adopter un mode de vie plus pacifiste par rapport au passé. Avec l'article 9 de la Constitution, il est presque impossible pour la nation de lever une armée. Cependant, avec la menace croissante de la Chine à l'est et le déclin constant des États-Unis, beaucoup ont commencé à remettre en question le statu quo et à proposer l'abolition de l'article 9 et la constitution d'une véritable armée pour défendre le Japon et son peuple."
JAP_aging_population_idea: "Vieillissement de la population"
JAP_aging_population_idea_desc: "Plus de 76,4 % de la population japonaise est considérée comme âgée, principalement en raison d'une période d'infertilité après le baby-boom d'après-guerre des années 1940 et d'une espérance de vie élevée. Malgré ce déséquilibre démographique extrême, il n'y a pas de réelle perception d'une crise démographique, et les standards de vie restent relativement élevés aujourd'hui. Cependant, cela a entraîné une forte pression économique sur l'économie japonaise déjà stagnante, en grande partie due au grand nombre de retraités et à la forte demande de services de soins imposée au gouvernement. Le gouvernement japonais a commencé à introduire de nouvelles façons pour les personnes âgées de redevenir actives dans la société, tout en subventionnant les nouvelles familles et en encourageant fortement la naissance de nouveaux enfants avec des services de garde plus accessibles."
