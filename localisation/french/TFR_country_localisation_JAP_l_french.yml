JAP_keiretsu_control_idea: "Contrôle des Keiretsu"
JAP_keiretsu_control_idea_desc: "Le principal rouage industriel du Japon a toujours été les puissants conglomérats commerciaux qui dominent l'économie depuis la Restauration Meiji. Historiquement connus sous le nom de Zaibatsu - aujourd'hui appelés Keiretsu, ils sont devenus si essentiels au fonctionnement de l'économie japonaise que certains sont même considérés comme des monopoles soutenus par l'État, purement en raison de la part de marché qu'ils détiennent. La puissance des Keiretsu provient principalement du fait que chaque entreprise membre d'un Keiretsu possède une partie des actions de chaque entreprise partenaire, avec une banque centrale au cœur. Ainsi, chaque entreprise d'un Keiretsu peut se protéger mutuellement des fluctuations du marché et des prises de contrôle de la direction, permettant l'organisation de projets à long terme à tout moment avec peu ou pas de risque. Les Keiretsu contrôlent largement la plupart du secteur manufacturier monolithique du Japon, et à moins que le gouvernement ne cherche à changer le statu quo, il est peu probable qu'ils soient délogés."
