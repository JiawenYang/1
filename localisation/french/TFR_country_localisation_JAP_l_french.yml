JAP_taiwan_war_category: "La guerre de Taïwan"
JAP_taiwan_war_category_desc: "L'Asie s'est à nouveau embrasée. Les armées de la République populaire de Chine ont lancé une invasion de l'État libre et indépendant de Taïwan, des débarquements navals ont été signalés à travers l'île, des installations militaires spécifiques ont été sabotées, et Taipei ainsi que d'autres villes sont pilonnées par des bombardements aériens.\n\nNous et le reste du PDTO ne resterons pas les bras croisés à regarder cette barbarie se dérouler contre notre allié. Nous ne faiblirons pas et ne céderons pas face à la guerre. Non. Une démocratie en Asie est en jeu, les vies et les libertés des gens sont en jeu, et nous les défendrons de toutes nos forces !"
JAP_national_diet_category: "Diète nationale"
JAP_national_diet_category_desc: "\n\n\n\n\n£GFX_JAP_national_diet_banner\n\n\n\n\n\n\n\n§YLa Diète nationale du Japon§! est l'organe suprême du pouvoir d'État au Japon et le seul corps législatif du pays. Elle se compose de deux chambres : la Chambre des représentants et la Chambre des conseillers. Le Parlement japonais joue un rôle important dans la vie politique du pays, prenant des décisions et des lois clés qui affectent la vie des citoyens. [JAP_election_when] [JAP_election_category_desc]"
JAP_election_soon: "§YAvec les élections à venir, qui auront lieu dès octobre 2021, il est important de commencer à se préparer pour l'événement.§!"
