#Economy Tree
JAP_leap_to_prosperity: "Saut vers la prospérité"
JAP_leap_to_prosperity_desc: "[JAP_leap_prosperity_loc]"
JAP_leap_lost_taiwan: "Notre défaite à Taïwan nous a donné une opportunité intéressante, une chance de regarder en nous-mêmes et de réfléchir à notre nation. Pourquoi devrions-nous consacrer autant de temps et d'argent à défendre nos voisins, alors que notre peuple lui-même souffre ? La prospérité peut être encore loin, mais la victoire de la Chine ne nous a pas empêchés d'avancer régulièrement."
JAP_leap_victory_taiwan: "Depuis que nous avons vaincu la Chine dans la guerre de Taïwan, notre économie n'a pas seulement prospéré, elle a explosé. Nous courons vers la plus grande prospérité que notre nation ait jamais vue, plus vite que le Shinkansen. Maintenant, nous devons réinjecter les fonds massifs que nous recevons dans le pays, afin de transformer notre île en un petit coin de paradis."
JAP_develop_northern_prefectures: "Développer les préfectures du nord"
JAP_develop_northern_prefectures_desc: "Le nord du Japon a toujours été, et sera probablement toujours, la partie la plus rurale du pays. Les gouvernements passés ont consacré la plupart de leur temps aux préfectures centrales et méridionales, et ainsi, le nord a manqué sa part de prospérité. Heureusement, il y a maintenant assez pour tout le monde, et le nord sera enfin mis à niveau avec le reste du pays."
JAP_support_centre_prefectures: "Soutenir les préfectures centrales"
JAP_support_centre_prefectures_desc: "Sans doute la région la plus importante du Japon, les préfectures centrales sont aussi parmi les plus densément peuplées. En conséquence, elles souffrent de la pression de devoir gérer tant de personnes. Heureusement, nous avons maintenant le pouvoir et les fonds pour les aider à alléger une partie de leur fardeau."
JAP_revitalize_southern_prefectures: "Revitaliser les préfectures du sud"
JAP_revitalize_southern_prefectures_desc: "Avant que l'attention du gouvernement ne se porte sur le centre du pays, le sud était la région la plus importante. Cependant, une grande partie de l'infrastructure méridionale a été laissée à l'abandon, et elle est loin de la qualité des préfectures centrales. Il est maintenant temps de changer cela, car nous vivons dans un Japon avec assez de fonds pour ramener la prospérité dans le sud."
JAP_expand_urban_areas: "Élargir les zones urbaines"
JAP_expand_urban_areas_desc: "Nos efforts pour ralentir la croissance des zones urbaines par rapport aux zones rurales ont fonctionné, mais seulement partiellement, et la population des villes continue de croître de manière spectaculaire. Nous ne pourrons probablement jamais inverser l'afflux de personnes, mais ce que nous pouvons faire, c'est nous assurer que les villes ont assez de place pour accueillir tout le monde."
JAP_age_of_reconstruction: "Ère de la reconstruction"
JAP_age_of_reconstruction_desc: "À travers le pays, des infrastructures gisent abandonnées et négligées, vestiges des années sombres des années 1990 et 2000. Cependant, nous sommes maintenant à un point de l'histoire de notre nation où nous pouvons non seulement restaurer ces bâtiments, mais les démolir et en construire de meilleurs à leur place. L'ère de la reconstruction est arrivée !"
JAP_technological_renaissance: "Renaissance technologique"
JAP_technological_renaissance_desc: "Le Japon a toujours été mondialement reconnu pour ses innovations technologiques, mais au cours de la dernière décennie, elles ont ralenti. Maintenant, cependant, nous sommes au milieu d'une renaissance de nouvelles technologies. IA, appareils domestiques, divertissement, et même des choses autrefois considérées comme possibles uniquement dans la science-fiction sont construites ici au Japon. Nous marchons vers l'avenir, un pas à la fois !"
JAP_energy_independence: "Indépendance énergétique"
JAP_energy_independence_desc: "Pendant des années, nous avons aspiré à l'indépendance énergétique, à ne pas dépendre de qui que ce soit, pour que notre peuple vive de l'énergie qu'il produit. Nous sommes plus proches que jamais de réaliser ce rêve, nous devons saisir cette opportunité et ne pas la laisser passer. Que ce soit nucléaire, solaire, hydroélectrique ou autre, cela sera produit ici au Japon !"

#Victory Foreign Tree
JAP_new_leader_of_the_free_world: "Nouveau leader du monde libre"
JAP_new_leader_of_the_free_world_desc: "Avec notre victoire sur la Chine et les États-Unis incapacités, nous avons prouvé que nous sommes capables de nous proclamer leader du monde libre du Pacifique. De Canberra à Taipei, et toutes les villes libres entre elles, il est maintenant de notre devoir de les protéger."
JAP_reinforce_pdto: "Renforcer le PDTO"
JAP_reinforce_pdto_desc: "La guerre contre la Chine n'a pas été facile, mais elle a montré que l'Organisation du Traité de Défense du Pacifique peut être considérée comme une entité légitime. Nous avons fourni beaucoup d'efforts pour amener l'alliance là où elle est aujourd'hui, et nous devons rester vigilants. Qui sait quand la Chine pourrait tenter quelque chose à nouveau."
JAP_own_economic_sphere: "Propre sphère économique"
JAP_own_economic_sphere_desc: "Avec la défaite de la Chine, de nombreuses nations sont tombées confortablement dans notre sphère économique. Notre marché s'étend maintenant jusqu'en Amérique du Sud dans certains cas. Avec une sphère économique aussi vaste, nous devons nous assurer qu'elle est correctement gérée."
JAP_new_allies: "Nouveaux alliés"
JAP_new_allies_desc: "Plusieurs nations ont exprimé leur intérêt pour le PDTO avant la guerre de Taïwan, et maintenant que nous avons vaincu la Chine, certaines semblent prêtes à devenir membres à part entière. La plus notable est l'Inde, et la Nouvelle-Zélande sera un membre précieux."
JAP_expanding_our_influence: "Élargir notre influence"
JAP_expanding_our_influence_desc: "La guerre de Taïwan a brisé le niveau d'influence étrangère de la Chine. Nous sommes maintenant presque, sinon plus, influents que les Chinois dans l'Indo-Pacifique. Pourtant, nous devons nous assurer que le dragon reste à terre, et que nous restions en haut. Il y a beaucoup d'endroits où nous pouvons étendre notre influence, et nous le ferons."
JAP_made_in_japan: "Fabriqué au Japon"
JAP_made_in_japan_desc: "Peu de pays ont une capacité de fabrication qui égale la nôtre, et les quelques-uns qui le font sont souvent nos rivaux. Pour gérer notre sphère, nous devons nous assurer que les pays qui s'y trouvent achètent la majorité de leurs biens chez nous."
JAP_recovery_assistance: "Aide à la reconstruction"
JAP_recovery_assistance_desc: "La Chine a peut-être perdu la guerre, mais cela ne signifie pas qu'elle n'a pas porté de nombreux coups puissants. L'infrastructure taïwanaise à travers l'île a été ruinée à cause de l'agression chinoise, et ils ont besoin de toute l'aide possible pour reconstruire."
JAP_continue_military_integration: "Poursuivre l'intégration militaire"
JAP_continue_military_integration_desc: "Tokyo est à près de 8 000 kilomètres de Sydney, et à près de 6 000 de New Delhi. Avec de telles distances entre nous et nos alliés, nous devons nous assurer que nos armées ne se sentent pas isolées les unes des autres. Elles doivent pouvoir fonctionner ensemble, comme une machine de combat efficace."
JAP_stimulate_local_mic: "Stimuler les complexes militaro-industriels locaux"
JAP_stimulate_local_mic_desc: "Bien que nous soyons pour la fabrication de nos biens ici, nous ne pouvons pas laisser nos alliés prendre du retard dans la production d'armes. Tout ce que notre ennemi devrait faire est d'intercepter nos convois, et avant que nous le sachions, nos alliés ne pourraient plus approvisionner leurs soldats. Nous financerons leurs propres complexes militaro-industriels."
JAP_weapon_supplies: "Fournitures d'armes"
JAP_weapon_supplies_desc: "L'équipement militaire japonais est parmi les plus avancés au monde, et nos alliés bénéficieraient grandement de son utilisation. Sans parler du fait qu'une force de combat unie ne devrait pas utiliser toutes sortes d'armes différentes incompatibles les unes avec les autres. Nous continuerons à fournir à nos alliés notre propre équipement."
JAP_scientific_collaboration: "Collaboration scientifique"
JAP_scientific_collaboration_desc: "L'Asie est bien connue pour produire des esprits brillants, et si nous les réunissons tous, de grandes choses sont possibles. La Chine veut avoir le monopole de l'innovation, mais nous ne les laisserons pas faire. Nous leur montrerons que nous sommes non seulement capables de les battre à la guerre, mais aussi dans la bataille de l'esprit !"
JAP_new_cooperation_agreement: "Nouvel accord de coopération"
JAP_new_cooperation_agreement_desc: "Les Taïwanais ont vu la nécessité d'un traité de défense plus complet avec nous, allant au-delà même du PDTO. Nous sommes toujours heureux de défendre nos alliés, et nous veillerons à ce que les Taïwanais se sentent aussi en sécurité que notre propre peuple."
JAP_economic_pan_asianism: "Pan-asianisme économique"
JAP_economic_pan_asianism_desc: "L'idée du pan-asianisme est souvent attribuée à l'Empire japonais, et à leur justification pour mener une guerre contre les nations de ce continent. Cependant, si vous prenez l'idée à sa valeur nominale, et ne regardez pas son histoire sombre, c'est quelque chose qui peut être bénéfique lorsqu'appliqué à l'économie."
JAP_our_european_partners: "Nos partenaires européens"
JAP_our_european_partners_desc: "Sans les États-Unis pour acheter nos biens, nous avons dû explorer des marchés alternatifs. Nos experts ont estimé que, malgré leur éloignement, les nations européennes sont un bon endroit pour intensifier nos exportations."
JAP_our_north_neighbour: "Notre voisin du nord"
JAP_our_north_neighbour_desc: "Nous n'avons jamais bien entendu avec la Russie, mais les rivalités politiques ne devraient pas entraver les opportunités économiques. Nous voulons qu'ils achètent nos biens, et ils le veulent aussi. Même si nous ne serons jamais alliés, un accord peut sûrement être conclu."
JAP_promote_yen: "Promouvoir le yen"
JAP_promote_yen_desc: "Avec l'effondrement effectif du dollar, de nombreux pays recherchent une monnaie alternative. L'euro a été le plus prominent, mais l'Asie de l'Est est évidemment loin de l'Europe. En tant que tel, une opportunité s'est présentée pour nous de persuader plus de pays d'utiliser le yen."
JAP_our_american_colleagues: "Nos collègues américains"
JAP_our_american_colleagues_desc: "Notre plus grand client dans les Amériques était les États-Unis jusqu'à récemment, bien que pour des raisons évidentes, ils ne soient plus un candidat préférable. Heureusement, nous sommes également bien connectés sur le marché de l'Amérique latine, et nos partenaires là-bas aimeraient sûrement travailler plus fréquemment ensemble."
JAP_development_programmes: "Programmes de développement"
JAP_development_programmes_desc: "L'Amérique centrale et du Sud tendent à être en retard par rapport à une grande partie du monde dans presque tous les domaines. Si nous voulons en bénéficier, nos alliés dans la région doivent en bénéficier, et personne d'autre ne les aide. Il est de notre devoir de financer des programmes de développement, l'argent trouvera sûrement son chemin de retour vers nous."
JAP_seize_the_situation: "Saisir la situation"
JAP_seize_the_situation_desc: "La deuxième guerre civile américaine est une tragédie, mais c'est aussi une opportunité. Nous serions fous de ne pas trouver un moyen d'utiliser la situation à notre avantage, presque tout le monde le fait. Les différents côtés sont impatients de s'entretuer, et nous avons les outils dont ils ont besoin pour le faire."

