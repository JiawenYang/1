jap.73.d: ""
jap.73.a: "Super !"
jap.74.t: "Des soutiens étrangers ne fournissent... rien !"
jap.74.d: ""
jap.74.a: "Zut !"
jap.75.t: "Effondrement de la loi et de l'ordre"
jap.75.d: ""
jap.75.a: "Qu'il en soit ainsi."
jap.76.t: "Discours aux partis"
jap.76.d: ""
jap.76.a: "Un merveilleux discours !"
jap.77.t: "Plus tard, je mettrai un événement de script ici"
jap.77.d: ""
jap.77.a: ""
jap.78.t: "Tentative d'assassinat de notre Premier ministre !"
jap.78.d: "Sans aucun doute, il y aurait des éléments moins que bienveillants qui s'opposeraient à la nouvelle voie que nous avons tracée pour le Japon.\n\nPar une belle journée ensoleillée, notre Premier ministre était présent à l'ouverture d'un parc à thème, parmi la foule se trouvait un homme solitaire qui bousculait la foule et se précipitait vers le Premier ministre pour le poignarder avec un wakizashi, bien que la tentative ait été maladroite, l'assassin a quand même réussi à enfoncer la lame profondément dans son ventre.\n\nLa sécurité a rapidement réussi à le maîtriser pendant que le Premier ministre était transporté d'urgence à l'hôpital, pour l'instant il reste dans un état critique. L'assassin semble faire partie de l'extrême droite qui persiste dans les coins les plus sombres de la société japonaise ; plusieurs livres dédiés à la révolution et à un mode de vie de guerrier ont été trouvés dans son appartement.\n\nCela a créé un dangereux précédent où les politiciens peuvent être attaqués au hasard par des extrémistes, la coalition civile a évidemment dénoncé cette attaque et a discuté en interne s'il était judicieux de convoquer des élections anticipées afin de maintenir la crédibilité.\n\nCependant, il y a assez de résistance à cela, la crainte que des élections anticipées ne divisent la coalition civile, dans tous les cas, une décision doit être prise."
jap.78.a: "Appeler à des élections générales anticipées !"
jap.78.b: "Ils ne peuvent pas nous diviser !"
jap.79.t: "Élections anticipées"
jap.79.d: ""
jap.79.a: "PDC !"
jap.79.b: "Parti de l'innovation !"
jap.80.t: "La Coalition Civique tient son premier Congrès National"
jap.80.d: ""
jap.80.a: "Le PDC prend la tête !"
jap.80.b: "Le Parti de l'innovation prend la tête !"
jap.81.t: "Problème des îles Kouriles"
jap.81.d: "Les îles Kouriles, composées de Kunashir, Iturup, les îles Habomai et Shikotan, ont une immense importance stratégique. Elles gardent la sortie de la mer d'Okhotsk, contrôlent des routes maritimes vitales et possèdent de riches ressources de pêche ainsi que des réserves potentielles de pétrole et de gaz naturel. Au cours des dernières décennies, le Japon et la Russie ont connu une série de protestations, de compromis et de conflits sur la souveraineté de ces îles.\n\nCependant, le gouvernement japonais est maintenant concentré sur la lutte contre l'influence croissante de la Chine, et beaucoup au sein du gouvernement estiment que le Japon n'est ni capable ni en position d'antagoniser davantage la Russie. Résoudre la question des îles Kouriles pourrait soulager les pressions de la défense du nord du Japon et ouvrir la voie à une série d'accords commerciaux avec la Russie pour stimuler le développement économique. Pourtant, certains soutiennent que le Japon ne devrait pas abandonner ses revendications sur ces territoires inhérents."
jap.81.a: "Il est temps de signer un traité de paix..."
jap.81.b: "Nous mettrons cette question de côté"
jap.82.t: "Traité de paix russo-japonais"
jap.82.d: "Après de longues et complexes négociations, le gouvernement japonais a finalement signé un traité de paix historique avec la Fédération de Russie, renonçant officiellement à ses revendications sur les îles Kouriles du Sud (appelées par le Japon les îles Habomai, Shikotan, Kunashir et Iturup).\n\nBien que ce traité marque le début d'une nouvelle ère dans les relations Japon-Russie, l'ambiance à Tokyo est mitigée. Une grande foule s'est rassemblée devant le bureau du Premier ministre. Les partisans estiment que l'abandon du différend territorial est un compromis nécessaire pour la paix et la stabilité à long terme. Les opposants, cependant, condamnent la faiblesse du gouvernement, y voyant une trahison de la dignité et de la fierté nationales, et un abandon des griefs historiques."
jap.82.a: "Enfin !"
jap.83.t: "Coopération japonaise accrue"
jap.83.d: "Une vague de renouveau économique a déferlé sur l'Extrême-Orient russe. Des investissements japonais massifs ont afflué comme une marée, couvrant tout, du développement énergétique aux projets d'infrastructure. Les usines de transformation du poisson ont adopté les technologies et les équipements avancés du Japon, et le commerce du bois a connu une croissance rapide, les vastes ressources forestières de la Russie étant exportées dans le monde entier par les canaux japonais.\n\nLes produits japonais remplissent désormais les étagères des centres commerciaux à travers la Russie, offrant de tout, des appareils électroniques de haute technologie aux produits de première nécessité, répondant à pratiquement tous les besoins des consommateurs locaux. Des usines autrefois délabrées dans l'Extrême-Orient ont été revitalisées grâce à un financement et une technologie japonais, ce qui a entraîné un boom sur le marché de l'emploi local. Les lignes de production modernes fonctionnent sans arrêt, absorbant une grande main-d'œuvre et stimulant la croissance économique, améliorant considérablement le niveau de vie des habitants de la région."
jap.83.a: "Bien !"
jap.84.t: "Investissements russes"
jap.84.d: "Depuis notre coopération accrue, les sociétés énergétiques russes ont établi des partenariats stratégiques avec les sociétés énergétiques de notre pays. Ensemble, elles ont coopéré à la construction de plusieurs oléoducs et terminaux de réception de gaz naturel liquéfié, assurant la stabilité et la sécurité de notre approvisionnement énergétique. De plus, la Russie a entrepris la construction de plusieurs grands projets nationaux, notamment des voies ferrées à grande vitesse, des ports et des ponts. En particulier, l'investissement russe a considérablement amélioré les conditions de transport dans la région d'Hokkaido, stimulant le tourisme et les industries connexes.\n\nEn plus de la coopération économique, le Japon et la Russie ont fait des progrès significatifs dans les échanges culturels. La musique rock et punk russe a gagné une popularité considérable sur le marché japonais. De plus, les deux pays ont remporté de nombreux succès dans les échanges cinématographiques. A tel point que Soyuzmultfilm a commencé une coopération avec plusieurs studios d'anime pour créer un dessin animé conjoint russo-japonais, dans le processus échangeant de l'expérience dans la création de dessins animés, en dehors de cela, l'afflux de films et de séries russes a inondé le Japon pour la série 'Le Roi et le Fou' (doublée en japonais sous le nom de Koror i Shut) est devenue populaire au Japon."
jap.84.a: "Les Japonais et les Russes sont frères pour toujours !"
jap.85.t: "Portes économiques ouvertes avec la Russie !"
jap.85.d: "Après la signature du traité, le commerce bilatéral entre le Japon et la Russie a connu une augmentation significative. Grâce à la réduction des barrières tarifaires et à la mise en œuvre progressive de mesures de facilitation des échanges, les exportations du Japon vers la Russie ont réalisé des percées remarquables, en particulier dans des secteurs tels que l'automobile, l'électronique et les machines haut de gamme, avec des volumes d'exportation augmentant considérablement. Dans le même temps, les ressources énergétiques de la Russie, y compris le pétrole, le gaz naturel et le charbon, ont été continuellement fournies au Japon, ce qui a considérablement atténué la pénurie d'énergie de longue date du Japon.\n\nEn plus du commerce en plein essor, la coopération dans le secteur de l'investissement entre le Japon et la Russie s'est approfondie et diversifiée. Les entreprises japonaises ont participé au développement de plusieurs régions de l'Extrême-Orient russe et de la Sibérie centrale, avec des investissements couvrant l'énergie, la construction d'infrastructures, l'agriculture, le tourisme et les industries de haute technologie. Pendant ce temps, les entreprises russes ont augmenté leurs investissements sur le marché japonais, en particulier dans l'énergie, les minéraux et la foresterie, favorisant un flux bidirectionnel des investissements bilatéraux.\n\nEn termes de coopération technologique, les deux pays se sont engagés dans des recherches collaboratives et des échanges de technologies approfondis. Surtout dans le domaine de la robotique, l'expertise technologique du Japon a été combinée avec la demande du marché russe, conduisant au développement et à l'application pratique de plusieurs produits innovants."
jap.86.d: ""
jap.87.t: "Montée du radicalisme anti-PLD !"
jap.87.d: "Nouvelles troublantes à travers le pays, avec le pouvoir du PLD plus enraciné et l'influence des autres partis considérablement diminuée, des éléments plus radicaux se sont enracinés dans le cœur et l'esprit du peuple japonais.\n\nAllant des groupes alignés sur la démocratie, des populistes, des activistes et même des factions plus volatiles, tous ont pris des mesures principalement pacifiques contre le monopole politique actuel que le PLD a sur le Japon.\n\nAvec la présence toujours croissante de voix dissidentes, il n'y aura pas un jour sans nouvelles d'activités radicales, cependant avec les bras forts de la loi et de l'ordre de notre côté, il faudrait un désastre pour que nous tombions."
jap.87.a: "Nous ne nous inclinerons pas !"
jap.88.t: "Votez ou perdez"
jap.88.d: "'Et alors, pourquoi voterais-je sur une question dont je me fiche éperdument ?'\n\nLa journée a été longue pour Takeshi et Akio, la Diète nationale est un grand réseau de nuances et de marchés de coulisse, des coalitions se forment et les membres deviennent des poids pour que les résolutions fassent pencher la balance en sa faveur. L'un des nombreux bars de Tokyo était vide alors que les deux députés s'asseyaient, profitant de quelques bières.\n\nAkio sourit, il a toujours considéré Takeshi comme un idéaliste par moments, à d'autres moments, il était un salaud têtu qui s'entêtait toujours.\n\n'Eh bien, tu sais comment c'est, tout l'intérêt des coalitions est que nous soyons tous sur la même longueur d'onde.'\n\n'Oui mais, ce genre de choses nécessite une recherche appropriée, je ne connais pas grand-chose au sujet et tu veux juste que je vote sur ce que mon instinct me dit de ne pas faire.' Takeshi était déjà un peu éméché, Akio le harcelait vraiment et il préférait simplement laisser tomber le sujet.\n\n'D'ailleurs, tu penses que ta carrière survivrait si les autres savaient que tu te comportes comme un enfant...' \n\n'D'accord ! C'est bon ! Je vais voter, laisse juste tomber et passons un bon moment d'accord ?'\n\nAkio sourit de nouveau, d'un ton plus chaleureux. 'Voilà, si ça peut aider, c'est moi qui paie la note.'"
jap.88.a: "La liberté s'accompagne de responsabilités"
jap.89.t: "Le problème du choix"
jap.89.d: "C'était un jour de pluie, le soleil était introuvable alors que des rangées de personnes attendaient en ligne. Un jeune couple se distinguait, un homme et une femme, il portait un parapluie, protégeant sa bien-aimée de la pluie.\n\n'Combien de temps encore ?' demanda la femme.\n\n'Pas beaucoup plus longtemps, pas besoin d'être si maussade, c'est important de voter, de faire entendre ta voix non ?' L'homme lui sourit doucement en regardant la file se rapprocher un peu plus du bâtiment. Les élections municipales étaient imminentes et la période de vote donnait aux gens une chance de faire entendre leur voix, de montrer leur insatisfaction ou leur satisfaction par rapport à l'état actuel des choses, bien que ce soit à un niveau plus local.\n\n'A quoi bon ? Le PLD va gagner de toute façon, comme ils l'ont fait pendant des années, j'aurais pu être à la maison, bien au chaud, avec toi mais maintenant nous sommes juste coincés ici sous la pluie misérable.'\n\nL'homme rit un peu. 'Eh bien, tout ce que nous avons, c'est une voix et du temps, si nous l'avons, pourquoi ne pas l'utiliser maintenant ? D'ailleurs, qui sait, un véritable changement pourrait finir par se produire.'\n\n'D'accord, mais tu me devras une pâtisserie après ça.'"
jap.89.a: "C'est la vie"
jap.90.t: "Main de fer de la justice"
jap.90.d: "Cela faisait un moment après la guerre à Taiwan, les rues étaient remplies de troubles, les actes de violence à travers le spectre politique étaient omniprésents et le gouvernement avait du mal à maintenir la cohésion dans le pays.\n\nUn vieil homme regardait les rues depuis son appartement, des camions militaires passaient devant sa vue alors qu'il remarquait de l'agitation dans la rue la plus proche de lui.\n\nUn jeune homme criait sur l'un des soldats à un poste de contrôle militaire, il était difficile de comprendre ce qu'il disait mais il y avait beaucoup de colère dans sa voix. Le soldat a gardé un calme imperturbable, ce n'était pas la première fois qu'il subissait des insultes verbales mais l'un des autres soldats présents a perdu patience et a fait tomber le jeune homme avec la crosse de son fusil.\n\nLe vieil homme a continué à regarder alors que le citoyen tombé était traîné, il a poussé un soupir en réfléchissant, récemment le gouvernement japonais avait déclaré la loi martiale ce qui a considérablement réduit plusieurs libertés, les extrémistes ont été arrêtés et les rues étaient jonchées de postes de contrôle militaires.\n\nL'armée était trop paranoïaque pensait-il, un peu dure aussi mais il comprenait la nécessité de tels actes, il espérait juste que le Japon retrouverait un état stable plus tôt que tard et si cela signifiait que les fauteurs de troubles se feraient taper sur les doigts, alors qu'il en soit ainsi."
jap.90.a: "J'appelle ça la justice"
jap.91.t: "Mort de Shinzo Abe"
jap.91.d: "Nouvelles choquantes venant de la ville de Nara, l'ancien Premier ministre Shinzo Abe a été attaqué lors de son discours. Son discours a été interrompu par deux détonations fortes venant de la rue derrière le politicien, accompagnées de grandes bouffées de fumée. Le présumé agresseur a ensuite été plaqué au sol et emmené par la sécurité.\n\nAbe a ensuite été transporté par hélicoptère à l'hôpital de l'université de médecine de Nara dans la ville de Kashihara, où il a été déclaré mort. L'autopsie officielle affirme que 'la balle a traversé le haut du bras gauche d'Abe et a endommagé un vaisseau sanguin sous sa clavicule' et énumère la cause officielle du décès comme 'perte de sang'."\n\nL'agresseur, Tetsuya Yamagami, 41 ans, n'a pas tenté de s'échapper. Il a été arrêté et a été interrogé par la police."
jap.91.a: "Bonne nuit, doux prince..."
jap.92.t: "Église de l'Unification"
jap.92.d: "Selon certains rapports, Yamagami a déclaré aux enquêteurs qu'il n'était pas motivé par un désaccord avec les convictions politiques d'Abe, mais 'des rumeurs sur le lien de l'ancien dirigeant avec une certaine organisation que la police n'a pas identifiée.' D'autres rapports affirment que Yamagami a blâmé la 'certaine organisation' pour avoir mis sa mère en faillite, qui aurait donné beaucoup d'argent au groupe.\n\nLa spéculation sur l'identité de cette 'certaine organisation' est actuellement centrée sur l'Église de l'Unification. La Fédération des familles pour la paix et l'unification mondiales - anciennement appelée l'Église de l'Unification mais peut-être mieux connue sous le nom de l'église à laquelle appartiennent les 'Moonies' - a été fondée par le révérend Sun Myung Moon en 1954. Une autre organisation qui apparaît en association avec Abe (et avec l'Église de l'Unification) est Nippon Kaigi. Décrite comme 'la plus grande et la plus puissante organisation d'extrême droite conservatrice'. Le PLD a toujours des membres conservateurs qui participent à toutes ces organisations, et la question se pose, que faire de ces éléments ? Allons-nous essayer de les chasser de la politique ou allons-nous essayer d'attendre que tout aille mieux ?"
jap.92.a: "Nous devons retirer ces éléments de la politique !"
jap.92.b: "Nous devrions juste rester discrets..."
jap.93.t: "Fraternité japonaise-taïwanaise !"
jap.93.d: "La guerre à Taiwan a détruit la vie de beaucoup de personnes, contre l'agresseur chinois, nous avons souffert aux côtés de nos alliés à Taipei et dans la guerre nous avons trouvé la fraternité.\n\nAprès avoir réussi à repousser les Chinois dans l'océan, il nous est resté une destruction intense sur les terres de Taiwan, un feu amer qui nous a été infligé par les Chinois. Cependant, dans tout cela, nous avons trouvé un terrain d'entente.\n\nNous avons fait des efforts pour aider Taiwan dans sa reconstruction, et dans la construction de nouvelles défenses, en cela nous avons acquis beaucoup d'influence sur l'île au point que l'on craint que cela ne soit un retour à l'époque du soleil levant.\n\nNous n'avons aucune intention de cela, et avec des sourires radieux et suffisamment de fournitures, nous pouvons convaincre le peuple de Taiwan que nous sommes bien intentionnés."
jap.93.a: "Deux soleils, ensemble."
jap.94.t: "La crise économique frappe le Japon !"
jap.94.d: ""
jap.94.a: "C'est la fin du monde tel que nous le connaissons"
jap.95.t: "Le Japon annule sa dette envers l'Amérique !"
jap.95.d: ""
jap.95.a: "Nous sommes enfin libres"
jap.96.t: "Élection présidentielle du Parti Libéral Démocrate !"
jap.96.d: "Le moment est venu pour le prochain congrès du Parti Libéral Démocrate du Japon, où l'avenir du pays et du parti sera décidé. La question à l'ordre du jour est de savoir si le Premier ministre sortant doit continuer en fonction ou nommer un nouveau candidat capable de diriger le pays à une nouvelle étape de son développement. Les factions au sein du PLD entament un débat actif sur l'opportunité de maintenir le Premier ministre actuel en fonction ou de choisir un leader plus prometteur pour renforcer la position du parti. Quel que soit le résultat du vote, ce choix aura un impact décisif sur la politique intérieure du PLD dans les années à venir."
jap.96.a: "Shigeru Ishiba"
jap.96.b: "Fumio Kishida"
jap.96.c: "Taro Kono"
jap.96.e: "Sanae Takaichi"
jap.96.f: "Shinjiro Koizumi"
jap.96.g: "Shinzo Abe"
jap.97.t: "Élections générales"
jap.97.d: "Des rassemblements de soutien au PLD ont lieu dans tout le pays, tandis que l'opposition perd du terrain, incapable d'offrir une alternative comparable au triomphe du parti. La joie de la victoire et le sentiment de fierté pour les réalisations de la nation imprègnent toute la société, des villes rurales aux mégapoles. Encouragés par ce succès, les électeurs se précipitent en masse vers les urnes pour soutenir le PLD lors des prochaines élections législatives.\n\nLes analystes politiques ont déjà surnommé ce moment la 'Vague Patriotique', car le sentiment électoral semble être absolument dominant en faveur du PLD. Les sondages montrent des cotes de soutien record, tandis que les campagnes électorales des partis d'opposition n'attirent pratiquement pas l'attention des médias. Le PLD devrait l'emporter facilement, conservant sa majorité au Parlement avec un mandat encore plus fort pour poursuivre ses politiques."
jap.97.a: "Victoire !"
jap.98.t: "Partenariat coréen-japonais"
jap.98.d: "Avec une grande victoire sur les agresseurs chinois dans la péninsule coréenne, nous avons accumulé une quantité considérable de bonne volonté à travers le continent, ceux qui ont combattu avec nous en tant qu'alliés nous ont vus sous un jour beaucoup plus positif, l'un d'eux étant la Corée.\n\nNotre histoire avec la Corée n'a pas toujours été positive, cependant, le passé est un bloc sur les jambes de nos deux peuples qui nous retient. Avec la quantité d'efforts, de ressources, de vies et de fonds investis en Corée, la question se pose lentement de savoir si nous pourrions raviver une nouvelle amitié éternelle.\n\nCeci est bien sûr accueilli avec des réactions mitigées, certains craignent que ce ne soit qu'une autre tentative de néo-impérialisme tandis que d'autres ne voient pas l'intérêt d'ajouter leurs fardeaux aux nôtres. Évidemment, cela n'atteindra jamais les mêmes niveaux que nous avons atteints il y a des années, mais il y aura toujours des voix de protestation. Il y a beaucoup de gens qui sont d'accord avec cela cependant, certains y voyant un message clair au reste du monde qu'une attaque contre la Corée est une attaque contre le Japon, et un signe que nos relations ont été correctement guéries.\n\nNéanmoins, au final, un choix doit être fait."
jap.98.a: "Passons outre le passé et créons une nouvelle amitié éternelle !"
jap.98.b: "Nous ne devrions pas aller trop loin avec ça..."
jap.99.t: "Shinzo Abe revient à la politique !"
jap.99.d: "Après avoir lutté contre la rectocolite hémorragique pendant un certain temps, l'ancien Premier ministre Shinzo Abe a fait une annonce surprise : il est de retour dans la politique japonaise. Cet événement a généralement été perçu comme positif, avec ici et là quelques détracteurs exprimant leur désarroi face au scénario potentiel d'un retour au statu quo.\n\nLe PLD l'a accueilli à bras ouverts et Shinzo a déjà clairement indiqué qu'il visait une fois de plus le poste de Premier ministre, espérant cette fois-ci avoir moins de problèmes de santé."
jap.99.a: "Le retour à la normale."
jap.100.t: "Objectifs actuels de la modernisation de l'armée"
jap.100.d: "La situation dans le détroit de Taiwan a rapidement dégénéré, et bien que le conflit se soit temporairement apaisé, la performance des Forces d'autodéfense a révélé de graves lacunes, dont certaines sont suffisamment importantes pour menacer leurs capacités de combat fondamentales. Si ces problèmes ne sont pas résolus rapidement mais plutôt ignorés, notre état de préparation au combat militaire sera difficile à maintenir à son niveau actuel, et pourrait même connaître un déclin significatif. Par conséquent, la mise en œuvre de réformes complètes de modernisation militaire est une tâche urgente qui ne peut être retardée.\n\nNotre objectif n'est plus simplement de compter sur les Forces d'autodéfense pour défendre le territoire japonais. Au lieu de cela, nous devons les transformer en une force multifonctionnelle et globale capable de répondre à des situations internationales complexes. Au lendemain de l'effondrement des États-Unis, il est évident que les ambitions de la Chine ne s'arrêteront pas à Taiwan ; leur expansion stratégique menace progressivement la stabilité et la sécurité de toute la région de l'Asie de l'Est. Le Japon doit procéder à des ajustements stratégiques et améliorer de manière globale les capacités de combat des Forces d'autodéfense, non seulement pour défendre son territoire, mais aussi pour acquérir la capacité d'intervenir dans les affaires régionales. Ce n'est qu'ainsi que le Japon pourra jouer un rôle clé dans la formation du futur ordre du Pacifique de l'Est."
jap.100.a: "Commençons !"
jap.101.t: "État des Forces japonaises d'autodéfense terrestres"
jap.101.d: "Titre du rapport : Problèmes révélés par les Forces d'autodéfense terrestres\n\nLors de la confrontation avec la Chine, les Forces d'autodéfense terrestres ont exposé plusieurs problèmes critiques, tels que des structures de commandement désorganisées, un entretien insuffisant de l'équipement et un faible moral dans certaines unités. Ces problèmes ont gravement affecté l'efficacité au combat des forces.\n\nDans la guerre de Taiwan, les opérations conjointes entre l'armée, la marine et l'armée de l'air ont révélé d'importants problèmes de commandement et de coordination. Il y avait un manque de communication efficace entre les divisions de l'armée, ce qui a entraîné des opérations fragmentées, des rythmes d'attaque désordonnés et des occasions manquées. La cause profonde réside dans le développement incomplet du mécanisme opérationnel conjoint entre les trois services, avec l'absence d'une structure de commandement et de coordination unifiée. Il en a résulté un retard dans la transmission des informations et des difficultés à mettre en œuvre efficacement les plans de combat.\n\nUn entretien insuffisant de l'équipement a également gravement affecté l'efficacité au combat. Par exemple, certains chars et véhicules blindés ont connu des pannes de moteur, les rendant incapables de fonctionner ; des pièces d'artillerie ont subi des explosions de canon en raison d'un mauvais entretien ; et des armes personnelles ont rouillé en raison de l'humidité, les rendant inutilisables.\n\nUn faible moral et une peur de la bataille se sont répandus dans certaines unités de l'armée. Face à la résistance féroce de l'ennemi, certaines unités ont montré une réticence à se battre, et certaines ont même déserté. Après de lourds bombardements de l'ennemi, certains soldats ont paniqué et se sont dispersés, ce qui a gravement affecté le moral des autres unités."
jap.101.a: "Il y a beaucoup de travail à faire."
jap.102.t: "État des Forces japonaises d'autodéfense aériennes"
jap.102.d: "Titre du rapport : Problèmes révélés par les Forces d'autodéfense aériennes\n\nAvions obsolètes : Nos principaux avions de chasse, tels que le F-15J et le F-2, sont en service depuis longtemps, et leurs systèmes avioniques et leurs armements sont dépassés par rapport aux avions de nouvelle génération de l'Armée de l'Air de l'Armée Populaire de Libération. Cela a placé nos forces dans une position passive lors des combats aériens, rendant difficile de contrer efficacement les avions à réaction avancés de l'APL, comme le J-20.\n\nCapacités de combat de drones insuffisantes : Notre investissement et notre recherche dans la guerre des drones ont été nettement insuffisants. Le nombre limité et les performances obsolètes de nos drones actuels rendent difficile de contrer efficacement les tactiques de nuée de drones de l'APL.\n\nCollecte de renseignements inadéquate : Au début du conflit, notre évaluation des capacités de l'APL était significativement erronée, ce qui a conduit à des erreurs de déploiement tactique. Cela révèle une lacune claire dans nos capacités de collecte et d'analyse de renseignements.\n\nFaibles capacités de guerre électronique : L'APL a démontré de fortes capacités de guerre électronique pendant le conflit, perturbant efficacement nos systèmes radar et de communication. Notre réponse dans le domaine de la guerre électronique a été inadéquate, nous plaçant dans une position désavantageuse en matière de collecte d'informations et de commandement et contrôle."
jap.102.a: "Vers des cieux inconnus..."
jap.103.t: "État des Forces japonaises d'autodéfense maritimes"
jap.103.d: "La guerre de Taiwan a révélé plusieurs lacunes dans les Forces japonaises d'autodéfense maritimes. Si ces lacunes ne sont pas rapidement corrigées, elles limiteront gravement leur rôle dans les futurs conflits régionaux et pourraient même mettre en péril leur propre sécurité.\n\nLe principal problème est le manque de prévoyance stratégique. Les FADM ont longtemps concentré leurs priorités stratégiques sur la lutte contre les menaces maritimes traditionnelles. Cependant, leur capacité à anticiper et à répondre aux nouvelles formes de guerre, telles que la guerre hybride, la guerre de l'information et la cyberguerre dans le contexte des conflits modernes, est clairement insuffisante.\n\nDeuxièmement, il y a un déclin relatif de la puissance militaire. Malgré la possession par les FADM de navires et d'équipements avancés, leur avantage diminue régulièrement face aux capacités militaires en croissance rapide de l'Armée populaire de libération. Ces dernières années, la Marine de l'APL a entrepris la mise en service à grande échelle de nouveaux destroyers, frégates, sous-marins et porte-avions, améliorant considérablement à la fois la quantité et la qualité."
jap.103.a: "Finalement, nous les surpasserons."
jap.104.t: "Grande parade militaire à Tokyo"
jap.104.d: "Aujourd'hui, les rues de Tokyo étaient remplies de milliers de personnes, toutes impatientes d'assister à la grande parade. La foule, agitant ses drapeaux du soleil levant, était remplie d'excitation et d'anticipation. Il s'agissait de la plus grande parade militaire que le Japon ait vue au 21e siècle, marquant un moment pour la nation de montrer sa puissance militaire après des décennies de retenue en vertu de la Constitution pacifiste.\n\nLe défilé a commencé par le rugissement tonitruant des avions de chasse F-35, peints en bleu, qui filaient dans le ciel. Suivaient de près une formation de chars de combat principaux de type 10, d'obusiers automoteurs de type 99 et de véhicules de combat d'infanterie de type 89, roulant au cœur de Tokyo, accueillis par des vagues d'acclamations de la foule.\n\nEnsuite, le massif porte-avions léger "Izumo", escorté par plusieurs frégates, a lentement navigué dans la baie de Tokyo. Sur son pont se trouvaient des hélicoptères anti-sous-marins SH-60K et des avions de chasse F-35B.\n\nLe point culminant de la parade a sans aucun doute été le discours du Premier ministre. Vêtu d'un costume noir, le Premier ministre a pris la parole sous le regard des masses pleines d'espoir.\n\n"Pendant des décennies, le Japon a adhéré à sa Constitution pacifiste, mais le monde d'aujourd'hui est loin d'être pacifique. Le terrorisme, les conflits régionaux - ces menaces pèsent constamment sur notre sécurité."\n\n"Le Japon, en tant que phare de la démocratie et de la liberté en Asie et dans le monde, ne peut plus rester silencieux ! Nous briserons les chaînes, reprendrons nos responsabilités et nous tiendrons au premier plan de la défense de la liberté et de la démocratie en Asie !""
jap.104.a: "Banzai !"
jap.105.t: "Sous le soleil levant"
jap.105.d: "Avec le recul, le boom économique rugissant du passé est maintenant devenu un souvenir éphémère, et les répercussions de l'éclatement de la bulle continuent de se répercuter sur la nation. La jeune génération, progressivement perdue dans le berceau du consumérisme, a grandi entourée de désirs matériels, tandis que son sens de l'identité nationale et culturelle s'est tranquillement estompé dans le confort quotidien de la vie. Face à de multiples pressions telles que la stagnation économique et le vieillissement de la population, nous devons admettre que ce n'est qu'en rallumant la flamme du patriotisme dans le cœur du peuple que nous pourrons unir la nation et revitaliser notre esprit. Pourtant, l'ombre de la défaite à la guerre, les contraintes de la Constitution pacifiste et la réflexion profonde sur le militarisme ont fait du patriotisme un sujet sensible et complexe au Japon, ce qui a conduit à une hésitation.\n\nComment pouvons-nous inspirer l'amour de la patrie sans réveiller le spectre du militarisme ? Ce dilemme reste non résolu. Il existe de nombreuses opinions divergentes au sein du gouvernement, sans consensus clair. En fin de compte, les débats se concentrent sur la question de savoir s'il faut réarmer le Japon et adopter une position plus forte pour se réaffirmer sur la scène internationale et retrouver la gloire nationale.\n\nCependant, les discussions politiques seules ne peuvent pas vraiment toucher le cœur du peuple. Nous devons chercher des réponses au plus profond de notre culture. De la résilience de l'esprit Bushido à la beauté éphémère des cerisiers en fleurs, de la profondeur des arts traditionnels comme les cérémonies du thé et l'arrangement floral, à la résonance émotionnelle de la culture pop moderne comme les animes et les jeux vidéo - tout cela peut servir de clé pour déverrouiller la passion patriotique de la jeune génération. Ce n'est qu'ainsi que nous pourrons réveiller le sentiment patriotique profondément enfoui dans la nouvelle génération de notre nation."
jap.105.a: "Alors que les cerisiers tournoient, l'âme retrouve le chemin de la maison."
jap.106.t: "Rapport de NHK post-guerre de Taiwan"
jap.106.d: "'Et cela conclut notre bulletin météo, passons à Fumiko avec son rapport sur Taiwan et la fin du conflit, à vous Fumiko.'\n\n'Merci, Akane, comme vous pouvez le voir derrière moi, la reconstruction de Taipei est en bonne voie, après que les forces japonaises ont mené l'opération de maintien de la paix pour maintenir l'indépendance de Taiwan, certaines de nos troupes restent sur cette belle île, assurant la sécurité et la paix du pays jusqu'à ce qu'il n'ait plus besoin d'elles.'\n\n'Cependant, nos amis ici et les braves gens du Japon se sont demandé si cette opération de maintien de la paix n'avait pour but que l'amélioration du Japon, à quoi je m'oppose fermement, nos troupes étaient présentes ici pour empêcher l'occupation de Taiwan par les hostiles Chinois et pour contrecarrer tout plan d'expansion future en Asie, de plus, nous fournissons les ressources dont Taiwan a besoin pour se reconstruire afin qu'il puisse à nouveau prospérer, cette fois, ils seront plus détendus, la menace immédiate de conflit ayant disparu.'\n\n'Avec notre engagement pour la paix en Asie, nous nous assurerons que les nobles sacrifices que nos hommes et femmes ont faits ne seront pas vains, en veillant à ce que la lumière brillante de la démocratie continue de briller.'\n\n'Quoi que les critiques puissent dire, ils sont incapables de nier que nous avons maintenu l'Asie dans un état de paix.'"
jap.106.a: "Merci Fumiko, passons maintenant au sport."
jap.107.t: "Dans les quatre mers, tous les hommes sont frères."
jap.107.d: "L'esprit de Mohamed ne pouvait s'éloigner des tâches monotones qu'il était autrefois si heureux de faire, pensant de plus en plus à une patrie qu'il était autrefois si heureux d'avoir quittée, ralentissant son travail pour rêver aux hauts plateaux de sa naissance, ou parfois au curry qu'il avait scellé pour le déjeuner.\n\nIl avait autrefois été si heureux de voir les côtes du Japon, la nation avec des hommes très bien soignés sur ses billets de banque, tous très corrects, occidentaux et peut-être presque européens. La nation avec des gratte-ciels et des rues propres, où il n'y avait apparemment pas d'animaux errants, une nation peut-être qu'un jour il pourrait se voir avec l'estomac plein ; paressant paresseusement au soleil en guise de rémunération pour ses labeurs.\n\nÀ aucun moment, il n'avait pensé à la difficulté qu'il éprouvait maintenant à lire l'écriture, à la difficulté qu'il avait à parler et à la façon dont les gens le rencontraient avec des regards fuyants plutôt que des sourires accueillants, peut-être s'il pouvait travailler une semaine de plus et prendre son salaire... Peut-être si...\n\nSoudain, toutes les pensées furent submergées par le sifflet du déjeuner, et ses pensées furent doublement submergées par la nourriture, le calme et le repos éphémère.\n\nObservant un vol de mouettes, ses yeux et sa tête se tournèrent involontairement vers le son d'un japonais bien parlé, éloquent et fluide. Un peu essoufflé, un homme habillé comme lui, lui dit que 'nous nous retrouvons avec tous les nouveaux travailleurs dans un bar à proximité après le travail !' Et avec un ton si accueillant, Mohamed, pour la première fois sans anxiété, a presque balbutié les mots : 'Oui, merci.'"
jap.107.a: "'Alors, qu'est-ce que tu manges pour le déjeuner ?'"
jap.108.t: "Le bavardage"
jap.108.d: "Kishi regarda Shinsato. Les rayons du soleil ne faisaient que s'installer en ombres sous les arbres à côté d'eux, mais Kishi voyait clairement le visage de son compagnon même à travers le verre du Ramune à ses lèvres. Cela évoquait un souvenir d'eux sirotant du Coca-Cola sur un banc à San Francisco il y a une éternité, des employés de bureau aux esprits titanesques et aux intellects brillants qui brandissaient le capital contre leurs concurrents.\n\n'L'Amérique.'\n\n'Hmm ?' Shinsato relâcha sa boisson et regarda son ami avec curiosité.\n\n'L'Amérique, on dirait que tout va partir en fumée.'\n\nSes yeux se sont levés et il a bu sans commentaire, Kishi a quand même demandé : 'Penses-tu que la bourse va se redresser ? Je suis à terre.'\n\nLe verre fut posé sur la table et avec une lumière rassurante émanant d'un sourire ironique et d'yeux alertes, Shinsato a parlé : 'Oui, je suis certain que tout ira bien pour nous, pas besoin de t'inquiéter comme tu le fais d'habitude.'\n\nKishi sourit d'une manière qui livrait sa conscience à son ami, cette expression de confiance absolue apparente sur ses rides, il la réservait à cet homme seul, car il ne s'était jamais trompé auparavant."
jap.108.a: "'Oui. Tout ira bien.'"
jap.109.t: "Arguments tranchants"
jap.109.d: "La politique n'a jamais été d'un grand intérêt pour le peuple japonais, mais après le récent conflit à Taiwan, de plus en plus de gens prêtent attention à la politique intérieure du Japon, entre les campagnes et l'activisme, le nombre de téléspectateurs des interviews politiques a également augmenté.\n\n'Avec tout le respect que je vous dois Kato, mais l'article neuf a prouvé à maintes reprises que le pacifisme tranquille est une folie, nous avons eu de la chance d'avoir repoussé l'agression chinoise pour commencer, pourriez-vous imaginer si nous n'avions pas une partie aussi restrictive de notre constitution ?'\n\nUn autre jour, un autre débat sur 'En direct jusqu'au matin !' qui est animé par Soichiro Tahara, il a présenté aux téléspectateurs Sasaki de la faction conservatrice et Kato de la faction libérale, pendant un moment le débat s'est déroulé sans aucune émotion forte, mais lorsque la question de l'article neuf a été soulevée, les voix se sont élevées.\n\n'Le but principal du Japon dans tout conflit est de maintenir la paix, vous devriez le savoir maintenant Sasaki, nous ne sommes pas une nation de guerre, plus maintenant.'\n\n'Avec ce dévouement à n'être que sur la défensive, nous avons dû faire face au plus fort des hostilités chinoises, la guerre de Taiwan l'a prouvé...' \n\n'Mais le conflit n'était pas une guerre ?'\n\nSasaki est resté silencieux, un peu abasourdi.\n\n'Non, non Sasaki, l'opération de Taiwan n'était pas une guerre, c'était une opération de maintien de la paix, nous n'étions pas à Taiwan pour étendre nos territoires ni pour imposer notre volonté à une autre nation indépendante, nous étions là pour maintenir la paix sur l'île et pour conserver sa souveraineté, le Japon a abandonné ses désirs expansionnistes et avec l'article neuf, nous continuerons de prouver au monde que nous ne nous écartons pas de nos intentions.'\n\n'Je veux dire oui... Je suppose... Quand...' balbutia Sasaki. 'La défense de Taiwan est la défense du Japon.' Kato sourit."
jap.109.a: "Nos intentions restent les mêmes."
jap.110.t: "La vie quotidienne"
jap.110.d: "La brise marine distinctive d'Okinawa, chargée d'une humidité salée, a balayé la base tranquille de Naha. Yamato Tanaka était assis dans son dortoir, inspectant son kit de soutien. Des bâtons lumineux roses étaient soigneusement disposés dans une boîte de rangement transparente, accompagnés de serviettes de soutien pliées avec précision et de ventilateurs de soutien méticuleusement préparés. Son congé de quinze jours venait d'être approuvé hier, et le billet pour le concert de Fukuoka reposait à côté de son album LoveLive. Yamato jeta un coup d'œil à sa montre ; dans six heures, il monterait à bord du vol pour Fukuoka.\n\nSoudain, le son strident d'une alarme de raid aérien a percé le calme de la base. 'Rassemblement d'urgence ! Tous les membres de la troisième brigade des opérations terrestres, rassemblez-vous !' La voix de la diffusion était inhabituellement sévère. 'Répétez, rassemblement d'urgence !'\n\n'Yamato-kun !' La porte du dortoir a été ouverte de force, et d'innombrables pas chaotiques et le bruit du matériel ont résonné du couloir. Le chef d'escouade Yamamoto avait un air de tension inhabituel. 'Nous avons entendu dire qu'il y a des problèmes dans le détroit de Taiwan. Notre brigade est déployée à Taiwan pour aider l'armée taïwanaise !'\n\nAlors que Yamato ajustait son uniforme pour la dernière fois, ses doigts ont instinctivement cherché dans sa poche le billet de concert. La diffusion délivrait un bref rapport de bataille, et sur l'héliport lointain, les rotors des hélicoptères avaient déjà commencé à tourner.\n\nIl a glissé le billet dans sa poche latérale et a doucement fermé la porte du dortoir."
jap.110.a: "À partir de maintenant, pour toujours, toi et moi serons irremplaçables."
jap.111.t: "Adieu solitaire"
jap.111.d: "Les nuages et la brume d'Alishan coulaient lentement devant les yeux de Yamato Tanaka, comme une performance qui ne se terminerait jamais. Il s'appuya contre un rocher couvert de mousse, sentant le sang chaud s'écouler lentement du trou de balle dans son abdomen. 'Quel bon endroit,' a-t-il réussi à dire avec toute sa force. De cet endroit, il pouvait voir les montagnes escarpées, la forêt luxuriante s'étendant jusqu'au littoral. La lumière du soleil filtrait à travers les nuages, projetant des ombres mouchetées et teintant toute la vallée en or. Si l'on devait choisir un endroit pour mourir, c'était en effet le plus approprié.\n\nIl savait qu'il ne passerait pas le coucher de soleil d'aujourd'hui ; il pouvait sentir sa vie s'estomper lentement à chaque battement de cœur, s'échappant du trou de balle. Étrangement, il n'avait pas peur ; au lieu de cela, il ressentait un sentiment de paix inhabituel. Ses doigts tremblants atteignirent la poche de sa poitrine et sortirent le billet de concert déjà froissé. Les idoles sur le billet avaient toujours des sourires brillants, bien qu'un coin soit taché de sang. Il jeta un dernier coup d'œil à la date à laquelle il ne pourrait jamais assister, puis lâcha le billet.\n\nLe vent de la montagne souleva doucement le billet, le faisant tourner dans l'air comme une délicate fleur de cerisier. Il a survolé des couches de cimes d'arbres, traversé des falaises abruptes et a finalement dérivé vers la mer scintillante au loin. Yamato l'a regardé disparaître jusqu'à ce qu'il ne soit plus visible.\n\nUne heure plus tard, un hélicoptère militaire a plané au-dessus de la vallée, et un message de cessez-le-feu est arrivé par haut-parleur. La paix était enfin arrivée, mais elle était soixante minutes trop tard pour la vie de Yamato Tanaka."
jap.111.a: "Il a manqué six heures, et a également manqué une heure."
jap.112.t: "Les rêves deviennent réalité"
jap.112.d: "Le soleil sur la base de Naha est resté aussi brillant que le jour avant le départ. Yamato Tanaka a ouvert la porte de son dortoir ; son kit de soutien était toujours tranquillement à sa place, avec des bâtons lumineux roses réfléchissant une faible lumière sous le soleil, comme s'ils avaient attendu un siècle.\n\nIl a soigneusement ouvert la boîte de rangement ; les serviettes de soutien conservaient toujours leurs plis soignés. Une fine couche de poussière s'était déposée sur le ventilateur de soutien préparé avant la guerre, qu'il a doucement brossée, révélant une fois de plus le sourire de Nishikino Maki. Le billet de concert qu'il avait apporté sur le champ de bataille et miraculeusement préservé avait légèrement jauni, avec quelques bords usés, mais il était plus précieux que n'importe quelle médaille.\n\nAlors qu'il faisait ses valises, ses doigts ont touché par inadvertance la blessure sur son corps. À cet instant, l'odeur de la poudre semblait revenir à ses narines. Mais bientôt, la brise marine transportant le parfum d'hibiscus a dérivé par la fenêtre, effaçant ces souvenirs de champ de bataille.\n\n'Le vol est à quinze heures,' murmura-t-il, glissant le billet de concert dans l'album qu'il portait avec lui, puis referma doucement la porte du dortoir."
jap.112.a: "Prenez soin de moi à partir de maintenant."
jap.113.t: "Les gens d'abord"
jap.113.d: "Chers concitoyens,\n\nAlors que la lumière du matin éclaire le dôme du bâtiment de la Diète nationale, nous ne pouvons nous empêcher de nous demander : ce symbole de la démocratie incarne-t-il vraiment la volonté du peuple ? Pendant des décennies, mis à part le bref changement de pouvoir en 2009, le règne du Parti Libéral Démocrate n'a jamais été véritablement mis au défi. Ce n'est pas une coïncidence mais une impasse politique méticuleusement conçue.\n\nRegardons la réalité en face : nous vivons sous une dictature douce déguisée en démocratie. Le PLD s'est présenté comme un 'symbole de stabilité' grâce à des systèmes de financement politique complexes, des relations avec de grands conglomérats et la manipulation des médias. Ils ont convaincu les gens que sans le PLD, le Japon sombrerait dans le chaos.\n\nMais quel est le coût de cette 'stabilité' ?\n\nDes jeunes qui renoncent à fonder des familles en raison du manque d'emplois stables.\nL'érosion continue des pensions pour les personnes âgées au milieu de l'inflation.\nLa disparition progressive de la classe moyenne accablée par les hypothèques et les dépenses d'éducation.\nLe déclin des économies locales alors que Tokyo est de plus en plus centralisé.\nMaintenant, le temps du changement est arrivé.\n\nLa naissance d'une Coalition Civique n'est pas un accident. Lorsque les partis de gauche ont réalisé la nécessité de s'adapter à l'époque, lorsque les libéraux ont compris que les idéaux nécessitent une organisation, et lorsque les forces progressistes ont mis de côté leurs différences, nous avons trouvé une voix commune : le Japon a besoin d'une vraie démocratie et d'un véritable système multipartite.\n\nUnissons-nous et brisons ce mythe de l'autoritarisme modéré avec nos votes. Pour que nos enfants grandissent dans une nation véritablement démocratique et pour rendre la politique aux mains du peuple, rejoignez notre cause."
jap.113.a: "L'avenir est en vue, et le changement est maintenant."
jap.114.t: "La stabilité d'abord"
jap.114.d: "Chers concitoyens,\n\nAlors que la lumière du matin éclaire à nouveau le sommet enneigé du mont Fuji et que le premier train Shinkansen part ponctuellement de la gare de Tokyo, tous ces moments témoignent de la grandeur et de l'ordre du Japon. En réfléchissant à la période de la gouvernance du Parti Libéral Démocrate, nous avons créé le 'miracle japonais' de renommée mondiale, transformant cette nation insulaire en la deuxième plus grande économie du monde et faisant de 'Fabriqué au Japon' un synonyme de qualité.\n\nLes néons clignotant dans les rues de Tokyo dans les années 1980 ont été témoins de notre prospérité ; le réseau autoroutier national des années 1990 a attesté de nos progrès ; les innovations technologiques après le millénaire ont mis en valeur notre sagesse. Tout cela a été des miracles accomplis sous l'administration stable du PLD.\n\nÀ ce moment, de nouveaux défis nous appellent. Le vieillissement de la population met à l'épreuve notre sagesse, la situation internationale met à l'épreuve notre détermination et la révolution technologique met à l'épreuve notre innovation. Mais rappelez-vous : c'est sous la direction du PLD que le Japon a toujours trouvé une issue aux crises et maintenu la stabilité au milieu du changement.\n\nChoisir le PLD, c'est choisir un leader testé par le temps. Nous savons comment trouver l'équilibre au milieu de la transformation, comment préserver la tradition tout en favorisant l'innovation, et comment faire en sorte que le Japon continue de briller dans la nouvelle ère.\n\nEnsemble, imaginons un bel avenir pour notre nation : les rues restent propres, les trains restent ponctuels et les gens continuent de vivre dans la paix et le contentement. C'est le Japon que le PLD protège pour vous, et c'est l'idéal qui mérite notre dévouement éternel."
jap.114.a: "Le PLD continuera d'être votre barreur le plus fiable."
jap.115.t: "Le coup d'éclat"
jap.115.d: "'Écoutez,' balbutia Kaori, une main agrippant son micro comme si c'était la dernière chose qui la maintenait droite. 'Le PLD est au pouvoir depuis, quoi, que les dinosaures baisaient la terre ? Et qu'avons-nous à montrer en retour ? Des salaires de misère, des appartements chers, et nous, nous sommes trop épuisés pour même rêver.'\n\nSes mots résonnèrent dans sa chambre faiblement éclairée, où une webcam bon marché perchée précairement sur une pile de livres capturait sa silhouette instable. Son avatar VTuber - une fille-chat aux yeux brillants et aux cheveux rose fluo - regardait le public avec la même intensité à moitié vitreuse que Kaori elle-même portait. Elle n'avait pas beaucoup de spectateurs. Habituellement, ses diffusions atteignaient au maximum quinze personnes, dont la moitié étaient des robots. Mais ce soir ? Quelque chose était différent. Kaori agita une canette vide de chu-hi devant sa webcam, bien que son avatar ne l'ait pas enregistrée. 'Vous savez ce qui est courageux ? Vivre dans cette économie pendant qu'ils dépensent des milliards dans des projets inutiles ! Des ponts qui ne mènent nulle part ! Des chèques de relance qui couvrent à peine les ramen pendant une semaine ! Mais oui, dites-nous de 'rester forts'. J'en ai tellement marre de cette merde !' Elle eut un hoquet, sa tête s'affaissant alors que le rire jaillissait de sa gorge. Ce n'était pas drôle. Rien de tout cela n'était drôle. Mais ça faisait tellement de bien de se lâcher.\n\nQuelqu'un dans le chat a écrit : 'Kaori, ça va ?' Elle plissa les yeux vers l'écran, les yeux de son avatar se retournant. 'Ça va ? Est-ce que nous allons bien ? Regardez ce qu'ils ont fait ! Ils s'enrichissent, nous nous faisons écraser. Et personne ne se défend parce que, quoi ? 'C'est comme ça ?' Foutez-moi le camp !' \nKaori a à peine remarqué le nombre de spectateurs augmenter. Cinquante. Soixante-dix. Deux cents. Les messages sont devenus un flot, certains l'encourageant, d'autres se moquant d'elle, et plus de quelques-uns coupant chaque mot ivre qu'elle disait.\n\nLe lendemain matin, sa gueule de bois était impitoyable. Son téléphone bourdonnait sans cesse sur son bureau, les notifications s'allumant comme des feux d'artifice. 1 532 nouveaux abonnés sur Twitter. Votre clip 'VTuber saoule DÉTRUIT le PLD' est en vogue avec 13k likes."
jap.115.a: "Oh. Oh mon dieu."
jap.116.t: "Nouveau et ancien"
jap.116.d: "Dans un bureau à Kasumigaseki, la lumière du soleil de l'après-midi filtrait à travers les stores, projetant des ombres mouchetées sur des piles de documents. Kosaka Honoka était en train d'organiser le dernier lot de propositions de projets d'exportation culturelle lorsque Koizumi Hanayo entra avec deux bouteilles de Ramune.\n\n'As-tu vu le nouveau plan de localisation ?' Hanayo posa le soda sur le bureau de Honoka. 'Ils ont vraiment mis le paquet cette fois-ci.'\n\nHonoka ouvrit les fichiers. 'En effet, rien que le budget de localisation pour la série 'Mobile Suit Gundam' dépasse le total des projets d'animation de l'année dernière. Ils prévoient même de redoubler et de produire des chansons thèmes dans les langues locales pour le marché de l'Asie du Sud-Est.'\n\n'Pas seulement Gundam,' Hanayo a rapproché une chaise et s'est assise, 'la 'Légende des héros de la galaxie' reçoit également une toute nouvelle version de doublage. J'ai entendu dire qu'ils ont spécialement invité des acteurs de doublage renommés de divers pays. Ah, je peux déjà imaginer Yang Wen-li disant 'les gens peuvent survivre sans pays' dans différentes langues.'\n\nHonoka prit une gorgée de soda. 'Les temps ont vraiment changé. Auparavant, seules des œuvres comme 'Dragon Ball' avaient autant de versions linguistiques. Maintenant, même des animes de groupe comme 'K-On!' sont produits dans une douzaine de langues.'\n\n'Le ministre a dit que c'était 'le meilleur moyen de laisser le monde entendre la voix du Japon',' a déclaré Hanayo avec un sourire, 'Cela semble un peu ringard, mais en effet, l'anime pourrait être plus efficace que n'importe quelle rhétorique diplomatique.'"
jap.116.a: "COOL JAPON !"
jap.117.t: "Douce maison"
jap.117.d: "Dans la chambre de Sato Makoto, un filet de crépuscule s'infiltrait à travers les stores, projetant des ombres marbrées sur le sol empilé de disques de jeu. C'était son seul lien avec le monde extérieur, et la lumière était sur le point de disparaître dans la nuit qui approchait.\n\n'Makoto, s'il te plaît sors,' la voix de sa mère l'appela à travers la fente de la porte. 'Il y a une autre excellente offre d'emploi aujourd'hui, dans un cabinet de design...' Ses mots furent coupés, noyés par les effets sonores soudains du jeu dans la pièce.\n\nCela faisait trois ans et quatre mois. Depuis qu'il avait démissionné de son travail dans un dépanneur ce jour-là, Sato Makoto n'avait jamais mis les pieds hors de cette pièce de neuf mètres carrés. Chaque jour, sa mère laissait une boîte à bento devant sa porte, qui était tranquillement emportée tard dans la nuit. C'était devenu leur seul moyen de communication.\n\n'Tu as déjà vingt-sept ans,' la voix de sa mère tremblait d'émotion. 'Yamamoto, le voisin d'à côté, s'est déjà marié...' \n\nSato Makoto augmenta encore plus le volume du jeu. Les personnages à l'écran étaient engagés dans de féroces batailles, émettant des effets sonores assourdissants, alors qu'il continuait à s'immerger dans le monde virtuel."
jap.117.a: "Toutes les déceptions se transforment en larmes sur le sol."
jap.118.t: "Super changement"
jap.118.d: "Dans une garderie ensoleillée à la périphérie de Tokyo, Rinka Sakurai était assise dans la lumière de l'après-midi, tenant un gâteau aux fraises rose. Elle trouvait toujours étrange pourquoi la nourriture était meilleure qu'avant et pourquoi la salle de classe avait maintenant des jouets plus intéressants.\n\n'Maîtresse Maki,' demanda-t-elle avec une touche d'innocence, 'pourquoi pouvons-nous avoir du gâteau aux fraises tous les jours ?'\n\nLa Maîtresse Maki s'accroupit et commença à expliquer patiemment les nouvelles politiques parentales, les subventions de garde d'enfants et les améliorations des normes des installations. Mais ces termes complexes se transformèrent en bulles lumineuses dans les oreilles de Rinka, ne laissant que la phrase : 'C'est un cadeau que le Premier ministre a promis à chaque enfant.'\n\n'Alors,' Rinka inclina sa petite tête, avec un peu de crème encore sur la bouche, 'ça veut dire que le Premier ministre me laisse avoir du gâteau aux fraises tous les jours ?'\n\nLa Maîtresse Maki sourit, voulant en expliquer davantage, mais Rinka s'était déjà éloignée pour partager sa découverte avec d'autres enfants. Dans son monde de conte de fées, l'image d'un gentil Premier ministre qui concocte des gâteaux aux fraises tous les jours était plus facile à comprendre que n'importe quelle explication politique."
jap.118.a: "Changer de Premier ministre, cela veut-il dire changer de gâteau ?"
jap.119.t: "Promenade"
jap.119.d: "Dans le Palais impérial, une rare tranquillité enveloppe les anciens sentiers de pierre alors que l'Empereur Naruhito et le Prince Fumihito se promènent tranquillement le long de la route de pierre séculaire autrefois traversée par les membres de la famille royale. En l'absence du tumulte habituel des touristes, le vénérable palais dégage maintenant une solennité exceptionnelle.\n\n'Frère, vois-tu,' Naruhito s'arrêta à côté du vieux pont, 'l'état du monde est vaste et ne peut être arrêté par la force humaine. Les changements d'aujourd'hui sont comme la floraison et le flétrissement des fleurs dans la cour, tout selon l'ordre naturel.' Fumihito regarda le poisson nager dans l'étang et répondit lentement : 'Frère dit la vérité.'\n\n'Les événements passés sont comme de la fumée,' Naruhito caressa doucement la balustrade en pierre, 'les gens disent souvent qu'une ère prospère ne peut être répétée, mais les changements d'aujourd'hui pourraient inaugurer une ère de paix et de prospérité. Le chemin du pouvoir ne réside pas dans sa grandeur mais dans sa justesse.'\n\nUne rafale de vent balaya la cour, faisant voler des feuilles d'un endroit lointain. Fumihito ramassa une feuille et dit : 'Oui, la tyrannie est comme une tempête - féroce mais difficile à soutenir. Seul le chemin de la démocratie peut se nourrir silencieusement comme la pluie de printemps.'\n\n'La montée et la chute d'une nation concernent son peuple,' Naruhito regarda vers l'horizon lointain, 'Bien que nous soyons au-dessus des masses, nous devrions prendre le cœur du peuple comme un miroir. Les péchés passés devraient être nettoyés par la conscience d'aujourd'hui.'"
jap.119.a: "Pays du soleil levant."
jap.120.t: "Comme un dragon"
 jap.120.d: "En début de soirée, dans le quartier de Suminoe, Tetsuya Ryuzaki s'accoudait au balcon de son appartement, observant les lumières rouges et bleues d'une voiture de patrouille qui passait en dessous. Le tatouage sur son bras gauche est depuis longtemps dissimulé par la manche de son costume, mais les histoires qui le hantent envahissent toujours son esprit la nuit. Ce n'est pas Kamurocho, il n'y a pas d'affrontements flamboyants ou de finales héroïques ici, seulement des rancunes et des trahisons sans fin, et une police préfectorale d'Osaka qui agit plus yakuza que les yakuza eux-mêmes.\n\nRyuzaki redresse sa cravate, celle que sa femme a nouée pour lui ce matin. Il y a vingt ans, il collectait de l'argent de la protection pour son gang ; maintenant, il est superviseur des ventes dans une compagnie d'assurance. Ses journées sont aussi fades qu'un verre d'eau, dépourvues d'excitation ou de turbulence.\n\nLa télévision diffuse les nouvelles des élections. Le candidat du PLD répète les mêmes promesses que Ryuzaki a entendues toute sa vie. Il se souvient des mots de son ancien patron : 'Parfois, la plus grande violence dans ce monde n'est pas un poing, c'est une société qui ne change jamais.'\nIl sort son téléphone, lisant le programme de campagne de la Coalition Civique. Peut-être qu'il est temps de changer, pense-t-il."
jap.120.a: "Pas avec les poings, mais avec des votes."
jap.121.t: "La génération plus âgée"
jap.121.d: "Masao Tanaka a placé le dépliant électoral portant le logo de la Coalition Civique sur le sol en tatami comme si c'était quelque chose de maudit. Des décennies d'expérience lui avaient appris une leçon : tout changement radical entraîne un risque. Il a pris le dépliant familier du PLD à côté. Les mots et les promesses qui s'y trouvaient lui procuraient un vague sentiment de confort.\n\nDepuis la fenêtre de la cuisine, il pouvait voir le portrait de famille sur le mur. Chaque visage souriant sur cette photo avait fleuri pendant la longue période du PLD au pouvoir. Son fils avait obtenu son diplôme de l'université de Keio et avait trouvé un emploi stable dans une entreprise. Sa petite-fille avait été admise à l'université de Nagoya. La vie n'était pas parfaite, mais elle était suffisamment sûre.\n\n'Réforme ? Changement ?' Il regarda l'Union du Peuple faire des discours passionnés à la télévision et secoua la tête. Ces slogans énergiques lui rappelaient les troubles qu'il avait vécus quand il était jeune. À l'époque, les gens réclamaient aussi le changement, mais cela n'avait conduit qu'au chaos et aux émeutes.\n\nLe jour du vote n'était que dans quelques jours. Masao Tanaka a sorti le costume qu'il portait toujours pour voter. Chaque fois, il choisissait de faire confiance à ce en quoi il avait toujours fait confiance auparavant.\n\nIl savait que les jeunes se moquaient de sa pensée conservatrice, tout comme ses petits-enfants se moquaient de lui parce qu'il ne savait pas utiliser un smartphone. Mais pour lui, ce sentiment de stabilité était plus convaincant que toute promesse de changement radical."
jap.121.a: "Vote !"
jap.122.t: "Le programme du soir"
jap.122.d: "Dans le studio de l'émission Sécurité nationale et nous, l'ancien chef d'état-major des Forces d'autodéfense maritimes, Tomohisa Takei, était assis bien droit, faisant face aux questions des hôtes Mako Kimura et Ken'ichi Sato. Sur le grand écran derrière eux se trouvait une carte précise du Pacifique occidental.\n\n'Monsieur Takei,' Mako Kimura se pencha légèrement en avant avec son microphone, 'vous avez autrefois commandé des exercices conjoints pour les Forces d'autodéfense maritimes. D'un point de vue stratégique militaire, que représente Taiwan pour le Japon ?'\n\nTakei leva la main pour pointer du doigt les routes brillantes sur l'écran. 'Permettez-moi de vous l'expliquer en utilisant mon expérience en mer. Imaginez le détroit de Taiwan comme une vanne d'écluse contrôlant le flux d'eau dans tout le Pacifique. Une fois que cette vanne tombe entre de mauvaises mains, non seulement la ligne de vie maritime du Japon est coupée, mais tout l'équilibre stratégique du Pacifique occidental s'effondre.'\n\n'Alors, vous dites que la sécurité de Taiwan est synonyme de la sécurité du Japon ?' insista Kimura.\n\n'Plus que ça. Du détroit de Miyako à l'île de Yonaguni, des îles Diaoyu à Okinawa, cette chaîne d'îles entière forme la première ligne de défense du Japon. Taiwan est comme la pierre angulaire de cette ligne. Si vous soulevez cette pierre angulaire, tout le mur défensif s'écroule.'\n\n'Comment devrions-nous réagir à une telle menace ?' Ken'ichi Sato posa la question à laquelle tout le monde voulait le plus une réponse.\n\nTomohisa Takei regarda la caméra comme s'il s'adressait à tout le Japon : 'Dans la marine, nous avons un vieil adage : prévenir la tempête vaut mieux que de la faire face de plein fouet. Nous devons faire comprendre à quiconque convoite Taiwan qu'il ne s'agit pas seulement d'une petite île dont personne ne se soucie, c'est un défi direct à la ligne de défense de tout le monde libre.'"
jap.122.a: "Merci pour votre réponse."
jap.123.t: "Exercice militaire"
jap.123.d: "Près de Taipei, sur les pentes de Yangmingshan, le lieutenant-colonel Haruaki Tsukishiro des Forces japonaises d'autodéfense terrestres a regardé le terrain d'entraînement en contrebas. Le brouillard matinal s'accrochait toujours aux collines alors que des unités blindées australiennes et de l'infanterie mécanisée taïwanaise menaient un exercice d'assaut conjoint, la poussière et la fumée formant un rideau changeant dans les premières lueurs du jour.\n\nTsukishiro a pris des notes dans un petit carnet, son écriture gracieuse mais marquée par la détermination d'un soldat. Sa formation d'officier lui avait enseigné une vérité immuable : si la volonté compte sur le champ de bataille, le nombre est souvent le facteur décisif.\n\n'Monsieur,' dit l'officier d'état-major Ueda, lui remettant un rapport d'évaluation tactique, 'les véhicules blindés taïwanais CM-34 montrent une excellente mobilité en terrain montagneux, et les Australiens se coordonnent avec un professionnalisme remarquable.'\n\nAcceptant le rapport, le regard de Tsukishiro s'attarda sur un soldat taïwanais lointain inspectant un véhicule blindé. Leur expertise était indéniable, mais cela lui rappelait les leçons de batailles historiques de l'Académie de la Défense : même des troupes d'élite peuvent s'éteindre comme des lucioles à l'aube face à une vague écrasante d'attaquants.\n\n'Ils sont en effet très compétents,' dit-il doucement, sa voix empreinte d'une inquiétude qu'il n'avait lui-même guère remarquée, 'mais la guerre n'est pas un exercice.' Sur la dernière page du rapport, il a écrit : 'Bien que les forces conjointes fassent preuve de compétences tactiques louables, elles pourraient avoir du mal à résister à un combat prolongé face à des chances potentiellement écrasantes. Il est recommandé d'intensifier les exercices conjoints avec des armes lourdes et d'étendre les exercices de défense aérienne.'"
jap.123.a: "L'ennemi se trouve de l'autre côté du détroit."
jap.124.t: "L'avenir du passé"
jap.124.d: "Dans une vieille ruelle tranquille du quartier d'Asakusa à Tokyo, le salon de thé Meigetsu est là depuis soixante-dix ans. Depuis que son grand-père le lui a confié, Sato Hikaru a déjà remplacé trois fois le papier traditionnel sur les portes coulissantes. Au début, alors qu'il regardait le salon de thé autrefois animé perdre progressivement sa foule, il avait l'impression d'assister à la lente fermeture d'une pièce de théâtre de longue date.\n\nÀ l'époque, il ne restait que quelques habitués âgés, comme des vestiges de l'ère Showa, sirotant leur thé et se remémorant le passé. Derrière le comptoir, Sato feuilletait de temps en temps les romans qu'il avait collectionnés, attendant des clients qui ne venaient jamais.\n\nUn tournant est arrivé l'année où le gouvernement a introduit son 'Plan de revitalisation des petites industries'. Grâce aux subventions fournies, Sato a transformé un coin de son salon de thé en une aire de repos japonaise traditionnelle et confortable. Il a disposé quelques coussins de sol (zabuton) et accroché des estampes de style Ukiyo-e. Fait intéressant, ces estampes rappelaient à de nombreux jeunes clients des scènes d'un célèbre film d'animation, bien qu'ils n'aient jamais précisé lequel.\n\nPetit à petit, le salon de thé a retrouvé une nouvelle énergie. L'après-midi, des groupes d'élèves du secondaire en uniforme ont commencé à venir, choisissant un endroit sur le tatami pour siroter du thé tout en discutant tranquillement des dernières intrigues de manga. Pour leur faire découvrir l'élégance de la cérémonie du thé traditionnelle, Sato a préparé des services à thé décorés de motifs de fleurs de cerisier spécialement pour eux.\n\nLe week-end, les clubs d'anime y organisaient souvent des rassemblements de thé. Ils disaient que l'ambiance leur rappelait un sanctuaire d'anime, et parfois ils discutaient avec Sato, lui demandant en plaisantant s'il n'engagerait jamais une prêtresse de sanctuaire pour s'asseoir à l'entrée et siroter du thé. Bien que Sato ne soit pas entièrement familier avec leurs références, il savait que le salon de thé remplissait sa mission d'une toute nouvelle manière."
jap.124.a: "Vieil arbre, nouvelles pousses."
jap.125.t: "Un rêve de mariage"
jap.125.d: "À l'intérieur du bureau de l'état civil de la mairie de Tokyo, Rin Sakurai et Yukino Fujiwara tenaient le même stylo, signant leurs noms sur la demande de mariage de couleur ivoire. Dehors, les fleurs de cerisier flottaient jusqu'au sol, comme une douce pluie de pétales offrant leur bénédiction.\n\n'Laissez-moi juste vérifier,' dit l'employée, feuilletant les papiers de la même manière calme et efficace qu'avec n'importe quel autre couple. 'Ceci est la demande de mariage pour Mlle Sakurai et Mlle Fujiwara.' Pas de regards suspicieux, pas d'hésitation dans sa voix, seulement une routine administrative simple.\n\nRin serra doucement la main tremblante de Yukino. Il y a dix ans, lorsqu'elles se sont rencontrées pour la première fois dans leur club de danse universitaire, aucune des deux n'osait imaginer que ce jour viendrait. À l'époque, elles ne pouvaient échanger des bagues qu'en privé et faire semblant d'être de simples amies proches devant les autres. Maintenant, enfin, elles pouvaient légitimement devenir la femme l'une de l'autre.\n\n'Félicitations à vous deux,' dit l'employée, leur remettant le certificat officiellement tamponné avec un sourire chaleureux. Plusieurs couples hétérosexuels qui attendaient à proximité leur ont offert leurs sincères félicitations.\n\nEn sortant de la mairie, Yukino ne put retenir ses larmes. Ce n'étaient pas des larmes de chagrin, mais d'un bonheur qui était arrivé si naturellement. Les gens dans la rue vaquaient à leurs occupations, les regardant à peine, considérant ce nouveau mariage comme parfaitement ordinaire. Et dans cette acceptation banale résidait le bonheur même qu'elles avaient autrefois tant désiré par-dessus tout."
jap.125.a: "Le Japon est enfin devenu ce qu'elles ont toujours espéré qu'il serait."
jap.126.t: "Que la fortune vous bénisse au combat"
jap.126.d: "Au milieu de la pluie du soir qui frappait les cadres de la fenêtre, Genzosuke Sakurai a pris une vieille boîte en bois, légèrement décolorée, du sanctuaire familial et l'a remise à son fils, Harunosuke Sakurai, qui était en train de préparer son uniforme. Depuis leurs portraits sur le sanctuaire, le grand-oncle Takenosuke Sakurai et le grand-oncle Ryunosuke Sakurai regardaient silencieusement à la lueur des bougies.\n\n'Avant que tu ne partes, je veux que tu aies ceci,' dit Genzosuke, ouvrant la boîte pour révéler une amulette de protection enveloppée dans de la soie bleu foncé. 'Tes deux grands-oncles ont gardé ce souvenir pendant toute leur vie. Le grand-oncle Takenosuke l'a porté sur les champs de bataille en Chine ; le grand-oncle Ryunosuke l'a emporté avec lui à travers le Pacifique.'\n\nHarunosuke a mis de côté son uniforme et a accepté l'amulette étonnamment légère. 'Contient-elle un sceau du dieu Takeminakata ?'\n\n'Oui,' répondit Genzosuke, regardant son fils, qui allait bientôt partir pour Taiwan. 'Sais-tu ce que Taiwan représente pour nous ?'\n\n'C'est... un voisin important ?' hasarda Harunosuke.\n\n'Pas seulement ça,' Genzosuke secoua doucement la tête. 'C'est notre ligne de vie. Tes grands-oncles ont donné leur vie pour comprendre une vérité immuable : la puissance de la Chine dans ces eaux n'a jamais vraiment reculé. Si Taiwan devait tomber, le Japon serait le prochain. Et nous serions alors confrontés à un sort plus humiliant que jamais.'"
jap.126.a: "Les dieux favorisent ceux qui restent toujours vigilants."
jap.127.t: "Nom de code de l'opération : Royaume perdu"
jap.127.d: "Sur la piste de la base aérienne de Naha, les chasseurs F-35A de la 8e escadre aérienne se tenaient en formation, chacun armé de quatre missiles à moyenne portée AIM-120 et de deux missiles AIM-9X Sidewinder pour le combat rapproché. Le chef d'escadron Masaki Yamamoto examina les données finales sur son affichage tête haute ; à l'intérieur du cockpit scellé, il pouvait entendre le léger bourdonnement du masque à oxygène.\n\n'Décollage dans trois minutes. Nom de code de la formation 'Tengu'. Zone cible : la zone d'identification de défense aérienne de l'est de Taiwan,' la voix de la tour de contrôle parvint à son casque. 'La météo indique une couverture nuageuse à 7 000 mètres, visibilité bonne.'\n\n'Ici l'avion de tête, tous les avions confirment,' dit Yamamoto, ajustant les paramètres d'affichage de son casque.\n\n'Numéro deux, prêt,' répondit calmement le commandant en second Fujiwara, comme si ce n'était qu'un autre exercice de la vie quotidienne. 'Numéro trois, en attente,' dit le jeune pilote Sato, une pointe d'excitation dans la voix. 'Numéro quatre, confirmé,' répondit Kishibe, son ton aussi neutre que celui du commandant en second.\n\nLe rugissement des moteurs résonna à l'aube. Yamamoto jeta un coup d'œil à l'état des armes sur son écran multifonction ; en plus des missiles, le canon interne de 25 mm était entièrement chargé avec 220 coups pour les combats aériens rapprochés potentiels.\n\n'Faites confiance à votre entraînement et faites confiance à vos camarades,' dit Yamamoto, poussant la manette des gaz vers l'avant et regardant l'horizon lointain. 'Écrivons un nouveau chapitre dans ces cieux.'"
jap.127.a: "Ce ne sont pas les anciens qui créeront la nouvelle ère !"
jap.128.t: "Échange d'intérêts"
jap.128.d: "Par un après-midi tranquille, un convoi de véhicules noirs de Daisei Construction passa lentement devant les ruines du port de Keelung. Debout au bord de l'eau, le ministre des Enquêtes Kiyonosuke Tsukishiro examina les grues et les entrepôts détruits par les bombardements. Derrière lui, son aide Aoinosuke Shimotsuki tapotait rapidement sur une tablette, enregistrant les niveaux de dommages, les budgets de reconstruction et les délais, mais les chiffres les plus critiques, ceux concernant les droits d'exploitation du port pour les vingt prochaines années, étaient soigneusement stockés dans un autre fichier crypté.\n\n'Quel dommage,' murmura Tsukishiro, allumant une cigarette étiquetée Alishan. Bien qu'il semblât déplorer les horreurs de la guerre, son esprit calculait déjà l'influence future une fois le port reconstruit ; chaque dalle de béton et chaque poutre d'acier serviraient de tremplin à Daisei Construction sur le marché taïwanais.\n\nLeur prochaine étape était Kaohsiung au sud. Dans une salle à manger privée, Tsukishiro trinqua avec des fonctionnaires locaux. 'Daisei Construction apportera non seulement des fonds,' dit-il, levant son verre, 'mais aussi de la technologie et de l'expertise. Nous prévoyons de participer à la reconstruction complète des ports, des chemins de fer et des aéroports.' Au son cristallin des verres qui s'entrechoquaient, tout le monde comprit que l'accord était déjà scellé."
jap.128.a: "Profitant d'une conversation joyeuse"
jap.129.t: "Centre de commandement des opérations conjointes"
jap.129.d: "À l'intérieur du centre de commandement des opérations de la base de Yokosuka, quatre grands écrans sur les murs affichent des flux en direct de Tokyo, Canberra, New Delhi et Taipei. Le chef de l'état-major interarmées japonais écoute attentivement les représentants de chaque pays tandis que l'écran tactile devant lui affiche des mises à jour constantes des différents déploiements militaires.\n\nUn général de l'armée de l'air australienne insiste sur la nécessité de transcender la division géographique entre les océans Indien et Pacifique. Pendant ce temps, le représentant de la marine indienne trace un arc sur la carte numérique, dans le but d'étendre l'influence de l'Inde pendant la conférence. Le délégué militaire taïwanais discute de la possibilité de consolider les systèmes de défense aérienne afin qu'ils n'aient pas à investir massivement dans des installations distinctes.\n\nDes techniciens des Forces japonaises d'autodéfense sont occupés à peaufiner un nouveau système de communication crypté, conçu pour relier les structures de commandement des quatre nations en un seul réseau invisible. Sur la table de conférence se trouve un épais manuel d'opérations, chaque page détaillant méticuleusement les procédures standard pour les engagements coopératifs, allant des simples patrouilles conjointes aux actions militaires à grande échelle.\n\n'Aujourd'hui,' dit le chef de l'état-major interarmées après que les discussions de chacun sont terminées, 'nous avons non seulement établi un système de commandement, mais aussi posé les bases d'un cadre de sécurité s'étendant à toute la région Asie-Pacifique. Nous ne nous inclinerons plus devant la tyrannie. Nos nations à travers l'Asie-Pacifique sont unies, déterminées à forger un avenir démocratique brillant, ensemble.'"
jap.129.a: "Prospérer ensemble, avancer ensemble."
jap.130.t: "Négociations quotidiennes en Europe"
jap.130.d: "Dans le quartier commercial animé de Naples, Yukinosuke Tsurumai, analyste de marché pour Panasonic à l'étranger, est assis dans une salle de réunion richement décorée. Le contrat fraîchement signé devant lui dégage encore l'odeur de l'encre qui sèche. Dehors, l'air salé distinct de la Méditerranée flotte, tandis qu'à l'intérieur, l'arôme du thé au citron italien s'attarde.\n\n'C'est un début prometteur,' remarque Risotto Nero, un dirigeant d'un géant local de l'électroménager, alors qu'il pose son stylo. Son costume sombre se marie parfaitement avec le décor vintage de la pièce. 'Pensez-y, la technologie japonaise associée au réseau de distribution de l'Italie. Quoi de plus idéal ?'\n\nÀ proximité, l'assistant de Tsurumai, Kazenosuke Sakakibara, tape rapidement sur son ordinateur portable, notant les quotas annuels : trois cent mille appareils ménagers et cinq cent mille appareils numériques. Au-delà de ces chiffres se trouve un réseau de distribution prêt à couvrir toute l'Europe du Sud.\n\n'Milan, Marseille, Barcelone,' songe Tsurumai, sirotant son thé. 'Nos produits orneront bientôt chaque coin de ces villes.'"
jap.130.a: "Une autre tasse de thé noir, s'il vous plaît."
jap.131.t: "Une curieuse négociation en Russie"
jap.131.d: "Dans la salle de réunion du luxueux Ritz-Carlton de Moscou, Yukinosuke Tsurumai a vérifié chaque page du contrat pour la troisième fois. En face de lui se trouvait Sofia Pavlovna, la secrétaire en chef d'un grand conglomérat, dont la présence aux cheveux argentés lui rappelait un personnage d'un anime qu'il avait vu une fois. C'était comme si, à tout moment, elle pouvait faire venir des serviteurs de derrière son bureau.\n\nCette négociation commerciale a duré un mois et quatre jours au total, marquée par trois plantages du système de vidéoconférence, deux interruptions brusques d'appel dues aux protocoles de cybersécurité et une ronde inexplicable de maintenance de la plateforme. Au moment de signer le document final, Sofia a gracieusement sorti un stylo apparemment ordinaire d'un tiroir. Son corps portait des motifs d'engrenages superbement gravés qui scintillaient étrangement à la lumière du soleil, rappelant à Tsurumai un gadget steampunk qu'il avait repéré une fois dans une boutique d'anime d'Akihabara.\n\nAprès la dernière signature, Anna a placé les papiers dans une boîte antique en bois de rose. Une garniture métallique brillait à ses coins, faisant allusion à des composants mécaniques complexes cachés en dessous. 'Ce contrat sera conservé pour toujours,' a-t-elle dit doucement, 'tout comme notre partenariat...'"
jap.131.a: "Pas de fin."
jap.132.t: "Le rideau final"
jap.132.d: "Au ministère de l'Éducation, de la Culture, des Sports, des Sciences et de la Technologie, Sakura Fujita a pointé à 8h45 comme elle le faisait tous les jours ouvrables. Sur son bureau se trouvait le rapport des statistiques d'éducation à moitié terminé de la veille. Tout semblait si routinier que ce matin ne ressemblait à aucun autre. À neuf heures précises, le chef de département a envoyé un e-mail de groupe demandant à tout le monde de se réunir dans la salle de réunion à dix heures.\n\nÀ l'intérieur de la salle de réunion, un projecteur affichait un rapport rempli de chiffres : plans de restructuration organisationnelle, rationalisation du personnel, réaffectation des ressources... Sakura a vu le nom de sa propre division apparaître en rouge, signalant que l'ensemble du département serait fusionné ou éliminé.\n\nÀ l'heure du déjeuner, personne n'a quitté son siège. La cafétéria du bureau, normalement animée, était d'un silence étrange. La boîte à bento de Sakura est restée dans son tiroir, intacte. Par la fenêtre, elle a vu des véhicules officiels être emmenés au centre de cession des biens.\n\nAu crépuscule, en débarrassant son bureau, elle a trouvé le calendrier de l'année dernière coincé dans un coin, couvert de notes pour des réunions et des projets, dont aucun n'avait plus d'importance."
jap.132.a: "Dites adieu au présent."
jap.133.t: "Entretien sur la réforme"
jap.133.d: "Bonjour à tous. Je suis la représentante Mariko Kato. Aujourd'hui, j'aimerais parler d'un sujet qui a beaucoup attiré l'attention ces derniers temps, le système doshusei. Certains d'entre vous ne le connaissent peut-être pas bien, ou peut-être n'en avez-vous entendu parler qu'en passant. Laissez-moi vous l'expliquer en termes plus simples.\n\nPensez au Japon comme à une maison avec 47 pièces séparées, chacune représentant une préfecture. Gérer autant de pièces à la fois est fastidieux : certaines pièces sont grandes, d'autres sont minuscules, et chacune a besoin de son propre ensemble complet de meubles. C'est à la fois inutile et peu pratique.\n\nLe système doshusei réorganiserait et fusionnerait ces 47 'pièces' en environ 10 'suites' plus grandes. Par exemple, quelques préfectures de la région de Kanto pourraient être combinées en 'Kanto du Nord' et 'Kanto du Sud', tandis que plusieurs préfectures de Kyushu pourraient être regroupées sous 'Kyushu'. Chaque 'suite' pourrait alors organiser son propre ameublement et sa décoration en fonction de ses besoins spécifiques, plutôt que d'équiper chaque petite pièce séparément.\n\nPour vous donner un exemple concret : à l'heure actuelle, les préfectures de Fukuoka, Saga et Nagasaki ont chacune leur propre Conseil de l'éducation, leur propre force de police et leur propre système de santé. Mais si elles étaient combinées sous un seul 'Kyushu', ces ressources pourraient être planifiées et gérées de manière centralisée, ce qui réduirait les coûts et augmenterait l'efficacité.\n\nCependant, mettre le système doshusei en pratique, c'est comme déménager : combiner des pièces peut sembler simple, mais il y a beaucoup de travail logistique, comme la façon d'allouer les ressources, de rénover, d'aider les gens à s'adapter, et ainsi de suite. Et comme chaque région a sa propre histoire unique et ses traditions locales, les fusionner trop rapidement pourrait provoquer de l'opposition.\n\nNéanmoins, notre objectif ultime est de faire en sorte que toutes les personnes vivant dans ces 'pièces' puissent être satisfaites."
jap.133.a: "Je vois."
jap.134.t: "Le mal d'un nom"
jap.134.d: "Dans une salle d'interrogatoire du commissariat de Shinjuku, l'inspectrice adjointe Misaki Sato a un rapport de violence domestique devant elle. La victime, Kumiko Suzuki, a toujours des ecchymoses sur le visage ; son mari, Kenichi Yamada, est assis obstinément dans la pièce adjacente.\n\n'Tout ça parce qu'elle a refusé de changer de nom de famille ?' Sato feuillette la transcription, son ton aussi calme que si elle discutait de la météo.\n\n'C'est la tradition,' crie Yamada de la pièce d'à côté. 'Dans la génération de mes parents, la génération de mes grands-parents, il n'y avait pas de femme qui ne prenait pas le nom de son mari. À quoi bon cette nouvelle loi ?'\n\nSato jette un coup d'œil à la profession de Kumiko : directrice de la création dans une agence de publicité. Au cours de dix années de travail acharné, sa réputation et son réseau de clients se sont tous développés autour du nom 'Suzuki'.\n\n'Je l'aime, mais cela ne signifie pas que je dois tout abandonner,' dit doucement Kumiko, ses doigts serrés autour d'un gobelet en papier. 'La nouvelle loi stipule clairement...'\n\nLorsque l'interrogatoire prend fin, Sato se tient près de la fenêtre du commissariat, observant la foule en bas. Il y a vingt ans, elle aussi s'était disputée avec son fiancé pour conserver son propre nom de famille. Bien que la loi ait changé depuis, certaines mentalités mettent clairement plus de temps à évoluer.\n\nElle signe le rapport d'arrestation avec son nom : Misaki Sato, le nom avec lequel elle est née, et celui qui restera avec elle."
jap.134.a: "L'oiseau en cage est enfin libre."
jap.135.t: "Réforme de la taxe à la consommation"
jap.135.d: ""
jap.135.a: "Geler la taxe à la consommation"
jap.135.b: "Baisser la taxe à la consommation"
jap.136.t: "Réforme des droits des travailleurs"
jap.136.d: ""
jap.136.a: "Améliorer les conditions de travail"
jap.136.b: "Déréglementer la main-d'œuvre"
jap.137.t: "Défilé"
jap.137.d: "Sous le soleil radieux du centre de Tokyo, un convoi de véhicules des Forces japonaises d'autodéfense terrestres a passé en vrombissant. Daisuke Matsuda était appuyé contre la fenêtre d'un véhicule blindé ; un patch de Morfonica était collé sur son sac à dos tactique, sa représentation de Kurata Mashiro dans un gilet de combat se démarquant au milieu de la mer de camouflage. Le long de la route, les gens agitaient des drapeaux du soleil levant et criaient 'Bonne chance au combat', tandis que des grues en papier flottaient vers le convoi comme de la neige à la dérive.\n\n'Tu es quelque chose,' dit Shota Yamamoto, assis à côté de lui, donnant une tape amicale sur l'épaule de Matsuda. 'Tout le monde va à Senso-ji pour des amulettes, mais toi, tu as foi en... comment ça s'appelle... ce groupe de filles, Morfonica ? C'est une sorte de bénédiction de jeune fille ?'\n\n'Hé, ne sous-estime pas Mashiro,' répondit Matsuda avec un sourire, tapotant son sac à dos. 'C'est leur chanteuse principale, elle travaille très dur pour ses rêves.'\n\nAlors que le convoi passait devant le Palais impérial et se dirigeait vers Yokosuka, Matsuda tapota sa poche, où il gardait ses écouteurs remplis de chansons de Morfonica. Leur musique l'accompagnerait vers les eaux brûlantes du Pacifique occidental."
jap.137.a: "Shota Yamamoto s'est simplement haussé les épaules à côté de lui."
jap.138.t: "La Force expéditionnaire démocratique"
jap.138.d: "Dans la lumière du petit matin sur le port de Sydney, le pont du HMAS Adelaide semblait légèrement rafraîchi par la brise marine. Le capitaine Tanaka des Forces japonaises d'autodéfense maritimes était appuyé contre la rambarde avec le capitaine Wilson de la marine australienne, tous deux regardant au loin le destroyer qui se ravitaillait. Quelques instants plus tôt, ils avaient découvert qu'ils étaient tous les deux fans du manga JoJo's Bizarre Adventure, une petite coïncidence qui les a fait rire.\n\n'Au fait,' dit Tanaka, allumant une cigarette, 'j'ai toujours été curieux de savoir pourquoi vous envoyez vos navires jusqu'ici...' Il s'interrompit. 'Pour vous battre pour nous.'\n\nWilson prit le briquet qu'on lui offrait et regarda vers l'Opéra de Sydney qui planait dans la brume. 'Tu sais, mon grand-père a servi dans la bataille de la mer de Corail quand il était jeune. Il disait que l'océan est comme un lien qui relie les nations libres.' Il expira un anneau de fumée. 'Maintenant, je comprends enfin ses mots.'\n\n'De Sydney à Tokyo, c'est une longue distance,' continua Wilson. 'Mais pour les nations démocratiques, il n'y a pas de 'trop loin'.'"
jap.138.a: "L'unité pour toujours."
jap.139.t: "Nouvelle Asie de l'Est"
jap.139.d: "Au dernier étage d'un bâtiment à moitié en ruine à Sinuiju, le capitaine Yamada des Forces japonaises d'autodéfense terrestres et le colonel Lee Seunghoon de l'armée sud-coréenne regardaient à travers des jumelles puissantes la rive opposée. Le colonel Lee a pris une bouchée de son bâton de chocolat Pocky de sa ration pendant que son regard parcourait la ligne fortement fortifiée de l'autre côté de la rivière.\n\nÀ Dandong, des convois de véhicules blindés de transport de troupes patrouillaient dans les rues, tandis que des antennes radar sur les lanceurs de missiles anti-aériens continuaient de tourner au crépuscule. Des silhouettes de soldats clignotaient occasionnellement dans les bunkers le long de la berge.\n\n'Regardez ces Chinois,' dit le colonel Lee, abaissant ses jumelles. 'Ils ont mis en place une défense assez serrée. Mais cela n'aura pas d'importance. Nous avons accompli quelque chose que ni MacArthur ni la génération de mon père n'auraient jamais pu réaliser.'\n\nLe colonel Lee fit tournoyer le bâton de chocolat dans sa main. 'N'est-ce pas étrange, Yamada ? Il y a seulement quelques décennies, nous étions enfermés dans une lutte à mort sur ce même lopin de terre du Nord-Est. Maintenant, nous nous préparons à traverser la rivière côte à côte. Et l'allié même qui a autrefois combattu à nos côtés est devenu notre ennemi.'\n\n'L'histoire est ironique comme ça,' répondit calmement Yamada. 'L'ami d'aujourd'hui peut devenir l'ennemi de demain, et l'ennemi d'hier peut se transformer en allié d'aujourd'hui.' Le colonel Lee mit le dernier morceau de Pocky dans sa bouche. L'emballage s'envola dans le vent vers les lumières de la ville qui clignotaient sur la rive lointaine."
jap.139.a: "Une histoire qui nous appartient."
jap.140.t: "Forteresse de Shanghai"
jap.140.d: "Dans la ville de Fort Zhen sur l'île de Chongming, le peloton de Yamada se battait à travers ce labyrinthe de rues depuis six heures éreintantes. Chaque mètre de terrain s'obtenait à un coût terrible ; chaque maison prise exigeait du sang. L'APL avait transformé chaque porte en meurtrière et chaque fenêtre en nid de tireur d'élite.\n\n'Bâtiment trois, deuxième étage, fenêtre de droite, mitrailleur !' L'avertissement urgent grésilla à la radio. Avant que les mots ne soient terminés, une rafale de tirs a balayé la rue, ébréchant le plâtre des murs. Yamada regarda ses troupes avancer sur le ventre, se faufilant à travers les décombres des bâtiments effondrés.\n\nUne maison apparemment ordinaire avait été transformée en forteresse, ses murs parsemés d'innombrables fentes de tir. Quand ils ont finalement fait irruption dans le bâtiment, ils ont trouvé des fils de déclenchement et des explosifs cachés dans chaque pièce. Le premier étage a été dégagé à grands risques, seulement pour qu'ils fassent face à un autre engagement féroce au deuxième. Les combats dans la cage d'escalier étaient brutaux, des grenades explosant les unes après les autres.\n\nAu crépuscule, ils avaient à peine avancé de deux pâtés de maisons. Des camarades tombés gisaient dans le fossé au bord de la route, tandis que des médecins cherchaient désespérément à travers les débris des soldats blessés. La résistance féroce rappelait leurs précédentes rencontres à la périphérie de Shanghai, mais la bataille sur l'île de Chongming était encore plus féroce. Les défenseurs savaient qu'il n'y avait pas de retraite.\n\nLa nuit est tombée, et les tirs d'artillerie au loin faisaient rage. Yamada a étudié la carte dans sa main. Leur prochain objectif était l'école secondaire de Minben, au large de la route de Xiangyang, les rapports de renseignement suggéraient qu'elle avait été transformée en un bastion compact mais formidable."
jap.140.a: "Demain sera un autre jour sanglant."
jap.141.t: "Point Romeo"
jap.141.d: "Un brouillard dense, comme un immense linceul cotonneux, a englouti chaque son dans les montagnes du Nuage Blanc. L'unité du major Oda errait dans ces hauts plateaux labyrinthiques depuis cinq jours, les nerfs tendus à la limite. La nuit précédente, trois soldats étaient partis en patrouille ; seuls deux sont revenus. Le troisième a simplement disparu comme s'il n'avait jamais existé.\n\n'Cet endroit n'est pas normal,' murmura Murakami, le mitrailleur, à la radio. 'Chaque fois que nous repérons des signes de l'ennemi et que nous les poursuivons, c'est comme si nous chassions nos propres ombres.' Il n'avait pas plus tôt parlé que les buissons sur la droite frémirent, une silhouette sombre passant en coup de vent. Quand ils se sont lancés à sa poursuite, tout ce qu'ils ont trouvé, ce sont quelques branches piétinées et une seule empreinte de pas dans la boue.\n\nLa nuit était bien pire que le jour. De doux bruits de frottement résonnaient dans le camp, mais personne ne pouvait trouver d'où ils venaient. L'appel nominal révélait souvent qu'un ou deux hommes manquaient, et à l'aube, les équipes de recherche ne découvraient rien d'autre qu'une plaque d'identité tachée de sang ou un casque de communication sectionné dans un coin solitaire.\n\nÀ minuit, le brouillard s'épaissit encore plus. Les soldats s'asseyaient dos à dos, craignant de fermer les yeux. Chaque homme savait que s'endormir pouvait signifier devenir le prochain à disparaître. Au loin, de brèves rafales de tirs retentissaient, bien que personne ne sache si elles provenaient d'alliés, d'ennemis, ou simplement de la montagne elle-même, jouant avec leurs esprits."
jap.141.a: "Un endroit devenu fou."
jap.142.t: "Le dernier combat du dragon"
jap.142.d: "Le ciel de Pékin était teinté de gris de fer par la fumée et la poussière. Dans le quartier de Fuxingmen, chaque rue était empilée de béton brisé et de barres d'armature tordues, chaque intersection réduite à un hachoir à viande mortel. L'APL avait transformé chaque bâtiment en forteresse, chaque passage souterrain en site d'embuscade et chaque fenêtre en perchoir de tireur d'élite.\n\nUn seul char de type 90 a vrombi le long de l'avenue West Chang'an, seulement pour que deux soldats de la Police armée populaire, serrant des explosifs, se précipitent dans un dernier acte de sacrifice, se faisant sauter et détruisant le char en même temps. La veille, une unité de milice s'était infiltrée dans le poste de commandement japonais par les égouts ; un combattant blessé a déclenché une grenade cachée sur son corps.\n\nLes vivants continuaient de se battre, tandis que les morts utilisaient leur propre corps pour bloquer les rues et ralentir l'avance de l'ennemi. Autour de Zhongnanhai, les routes étaient méconnaissables. Les marches du Grand Hall du Peuple étaient criblées de cratères et des explosions d'artillerie avaient sectionné le pont de Jingshui. Pourtant, les défenseurs refusaient de céder. Une compagnie de l'APL a tenu à la gare de Xidan pendant trois jours et trois nuits, se battant jusqu'à ce que chaque dernière balle soit dépensée. Ils ont utilisé n'importe quoi, des briques lâches à leurs dents nues, pour tenir l'ennemi à distance.\n\nUn peloton japonais, découvrant du matériel de communication et des cartes éparpillés alors qu'il avançait, a été rapidement anéanti par les forces spéciales qui se cachaient en embuscade au milieu des décombres. Chaque hutong était un champ de bataille, chaque cour une tranchée. Cette ancienne ville se défendait contre les envahisseurs avec de la chair et du sang seuls."
jap.142.a: "En ces jours-là, si héroïque ; ce jour-là, était-ce serein ?"
jap.143.t: "Humanité"
 jap.143.d: "Dans le bureau de la Division d'enquête du département de la police métropolitaine de Tokyo, l'inspecteur Daisuke Kusanagi regardait l'avis de mesure disciplinaire sur son bureau. Trois jours plus tôt, il avait utilisé une force excessive lors de l'arrestation d'un trafiquant de drogue, causant des blessures au suspect. Le comité de surveillance a décidé d'une sanction clémente, une simple réprimande.\n\n'Tu es toujours trop strict,' a remarqué son coéquipier, Kaneda, posant sa tasse à café. Kusanagi regarda le crépuscule à travers la fenêtre, où les lumières au néon étalaient de doux halos sur les rues trempées de pluie. 'Quand j'étais enfant, je regardais des dessins animés et je pensais que les policiers étaient censés être des héros parfaits,' dit-il avec un sourire moqueur. 'Maintenant, je sais, même les robots peuvent s'emballer, sans parler des humains.'\n\nÀ la surprise générale, la mère du trafiquant blessé s'est rendue au commissariat le lendemain pour remercier Kusanagi. 'Je sais que mon fils s'est égaré,' dit-elle. 'Vous avez peut-être été un peu dur, Monsieur l'agent, mais j'ai senti que vous vouliez vraiment qu'il change de vie.'\n\nKusanagi n'avait jamais oublié pourquoi il était devenu policier. Ce n'était pas pour être un héros sans faille, mais plutôt pour jouer son rôle dans le maintien de l'ordre dans la ville. Les gens font des erreurs ; ce qui compte vraiment, c'est s'ils en tirent des leçons."
jap.143.a: "Nous faisons des erreurs ; mais c'est précisément à cause de cela que nous apprenons à pardonner."
jap.144.t: "Négociations d'entreprise"
jap.144.d: "Dans la salle de conférence du dernier étage du siège de NEC, la présidente Ayano se tenait devant le projecteur, prononçant ses remarques finales.\n\n'La privatisation est le choix inévitable,' a déclaré la présidente Ayano avec un sourire poli, tournant son regard vers les représentants du gouvernement à gauche de la table. 'Je crois que tout le monde ici est bien conscient des capacités de R&D de NEC dans le domaine de l'intelligence artificielle.'\n\n'Si nous nous chargeons de ce projet,' a-t-elle poursuivi, 'nous pouvons augmenter les revenus d'au moins quarante pour cent en trois ans.'\n\nTournant une page dans son dossier, elle a continué, 'Les chiffres détaillés sont à la page trois. L'année dernière, nous...'\n\n'Attendez !' Le chef de section Sakamoto s'est soudainement levé, la coupant. 'Présidente Ayano, nous parlons de la sécurité des données de millions de personnes ici. Vos conditions sont tout simplement scandaleuses, vous profitez de la situation ! Avez-vous seulement pesé le pour et le contre avant de faire ces demandes ?'\n\nLe silence s'est installé dans la salle de conférence. La présidente Ayano a posé ses documents, gardant son sourire posé. 'Pardonnez-moi, je dois m'absenter un instant.'\n\nAlors que le bruit de ses pas s'éloignait dans le couloir, le ministre Nakashima, qui présidait la réunion, s'est tourné vers Sakamoto. 'Hé, Sakamoto, tu ne veux pas gagner d'argent ? Quand la présidente Ayano reviendra, dis-lui que tu es désolé et sors.'\n\nSakamoto baissa la tête. La lueur du projecteur projetait des ombres sur son visage."
jap.144.a: "Quelle honte."
jap.145.t: "Voyage en famille"
jap.145.d: "Kenichi Kimura était assis dans son appartement, regardant la brochure de voyage de Palau étalée sur la table à manger. C'était la première fois qu'il planifiait sérieusement un voyage à l'étranger. Depuis que son entreprise avait donné une augmentation de salaire à tout le monde, un tel rêve était soudainement devenu réalisable.\n\n'J'ai entendu dire que les eaux de Palau étaient les plus bleues du monde,' a dit sa fille Sayuri, montrant une photo du doigt. Par le passé, il changeait discrètement de sujet chaque fois qu'elle parlait de voyager. Mais maintenant, il pouvait répondre ouvertement, 'Nous irons voir cet océan cette année.'\n\nSa femme, Yoshiko, s'est approchée et a examiné le budget du voyage. Les chiffres ne la faisaient plus froncer les sourcils. 'Nous avons déjà réservé les billets et l'hôtel,' a-t-elle dit. 'Je ne m'attendais pas à ce que nous puissions économiser assez vite.'\n\nKenichi se souvint qu'il y a un an, il aurait encore fait des heures supplémentaires à cette heure-ci, triant des documents. Maintenant, il planifiait le premier voyage à l'étranger de sa famille ensemble."
jap.145.a: "Une vie magnifique."
jap.146.t: "Femme leader"
jap.146.d: "Dans l'immeuble de bureaux aux murs de verre de Hachinohe, Misaki Sato présidait sa troisième réunion du conseil d'administration du mois. Il y a vingt ans, lorsqu'elle a rejoint l'entreprise pour la première fois, il n'y avait jamais eu de femme dans la salle de conférence. Maintenant, sa voix remplissait l'espace de réunion au vingt-huitième étage alors qu'elle discutait d'un contrat de plusieurs millions de yens avec l'Australie.\n\n'Nos bénéfices ont augmenté de quarante pour cent,' dit-elle, feuilletant les rapports. 'C'est grâce à la nouvelle gamme de produits que nous avons développée.' Les membres du conseil d'administration prenaient des notes attentivement. Personne ne se souciait de son genre ; ils ne se souciaient que de ce qu'elle pouvait accomplir. C'était ce qu'elle appréciait le plus dans le présent, la capacité, plutôt que le genre, était ce qui définissait la valeur d'une personne.\n\nDans le couloir, une photo de groupe de 1998 était accrochée au mur. On y voyait une rangée d'hommes en costume au garde-à-vous, et une seule femme, tout au fond. Misaki se rappelait encore comment, à l'époque, les femmes devaient travailler deux fois plus dur pour recevoir la même reconnaissance que les hommes.\n\n'Voici les prévisions pour le prochain trimestre,' dit Misaki, tendant un dossier à une jeune femme manager. 'J'aimerais que vous vous en chargiez.' Elle a aperçu une lueur de gratitude dans les yeux de la femme, une qui lui rappelait le début de sa propre carrière. Mais contrairement à l'époque, cette nouvelle génération de femmes n'a plus à être aussi prudente."
jap.146.a: "Qui a dit que les femmes étaient inférieures aux hommes ?"
jap.147.t: "Un débat à table"
jap.147.d: "À l'heure du dîner dans une modeste maison de Nagoya, Naoko, dix-huit ans, et Koji, vingt ans, se disputaient une fois de plus. De la vapeur s'élevait encore de la soupe miso sur la table.\n\n'Nous avons besoin de plus de protection sociale !' Naoko a posé ses baguettes. 'Il y a encore tellement de gens qui ont besoin d'aide.'\n\n'Non, la nation a besoin de devenir plus forte,' a rétorqué Koji. 'Il suffit de regarder nos voisins...'\n\nLeur père, Kenichi Kimura, gardait la tête baissée sur son repas, comme si le riz dans son bol était plus important que n'importe quel argument. Il savait qu'il y avait quelqu'un de bien plus qualifié pour juger de ce débat. En bout de table se trouvait Daisuke Kimura, un ancien membre de la Chambre des conseillers, maintenant un homme âgé dont les cheveux blancs témoignaient de nombreuses années passées. Il a posé sa tasse de thé.\n\n'Ça suffit,' a-t-il dit, sa voix calme mais autoritaire. 'Vous rendez-vous compte à quel point notre paix a été durement gagnée ?' Il se tourna vers Naoko. 'Tu veux étendre le bien-être social, mais sais-tu à combien s'élevait le budget de l'année dernière ? Tu parles de toutes ces dépenses, d'où penses-tu que l'argent vient ?' Puis il a regardé Koji. 'Tu aspires à une armée puissante, mais comprends-tu ce qu'implique le militarisme ? C'est le terreau du fascisme, le cauchemar même que ma génération et celle de ton grand-père ont combattu si durement pour fuir.'\n\n'Le chemin actuel du Japon a été pavé de sang et d'une sagesse durement acquise. Il n'est peut-être pas parfait, mais c'est la meilleure voie pour nous.'"
jap.147.a: "Ceux qui sont dans le feu de l'action ne peuvent pas voir l'ensemble de la situation."
jap.148.t: "La campagne"
jap.148.d: "Dans un petit village de la préfecture d'Akita, Masao Sato est assis sur une chaise en osier sous un vieux cerisier, regardant les rizières onduler au loin. Quatre-vingt-sept ans de vie ont parcouru sa mémoire comme l'eau de source inépuisable du vieux puits de la cour.\n\nIl se souvient de l'ère Showa animée, lorsque les Walkman de Sony se répandaient dans le monde entier et que les voitures Toyota filaient sur tous les continents. À l'époque, le Japon était comme un cerisier en pleine floraison, émerveillant le monde par son éclat. Mais les jeunes d'aujourd'hui semblent largement désintéressés par ces réalisations.\n\nRécemment, cependant, son petit-fils, Kenichi, lui a apporté un sentiment de réconfort. Le garçon qui ne faisait rien d'autre que jouer aux jeux vidéo a commencé à étudier sérieusement l'histoire du Japon. Le mois dernier, debout sous le cerisier, Kenichi lui a parlé avec enthousiasme des dernières avancées technologiques du pays. 'Grand-père, le savais-tu ? Notre technologie est à nouveau en tête du monde.'\n\nMasao se souvient avoir vu dans les yeux de son petit-fils une étincelle qui lui rappelait sa propre jeunesse. Ce n'était pas un nationalisme étroit, mais une joie profonde et sincère de voir sa nation progresser. Peut-être que chaque génération a sa propre façon d'aimer sa patrie, tout comme ce cerisier, qui fleurit différemment chaque année."
jap.148.a: "Un vrai patriote."
jap.149.t: "De la poussière à la poussière, des cendres aux cendres"
jap.149.d: "À l'intérieur d'un petit bâtiment de style occidental dans l'ancienne zone de concession de Tianjin, le Comité de contrôle militaire du PDTO, responsable de la zone métropolitaine de Pékin-Tianjin, tient une réunion de travail. La salle est animée : des piles de documents sont empilées, les téléphones sonnent par intermittence et des aides se précipitent avec du courrier urgent. Autour d'une table ronde, des représentants des pays membres du traité négocient diverses questions.\n\n'Je crois que nous avons abordé les problèmes les plus urgents,' a déclaré le lieutenant-général des FADJ, assis à la tête de la table. Il a rassemblé ses documents d'un ton détendu alors que le soleil se couchait. Les autres généraux ont hoché la tête en signe d'accord, levant leurs tasses de café.\n'Je suis désolé, président,' a dit un général indien. 'Mais j'aimerais soulever une autre question pour discussion.'\n\nQuelqu'un à table a laissé échapper un soupir lourd, reflétant le sentiment de beaucoup. 'Ce que je veux discuter, c'est la résolution 1438, concernant le traitement des restes. Comme nous le savons tous, les résultats de l'enquête sont choquants. Le bras gauche et la jambe droite du corps sont complètement manquants, et la plupart des cheveux et de la peau ont été remplacés par des substituts artificiels. Ses conditions de conservation uniques sont presque impossibles à maintenir. Même si nous n'intervenons pas, le gouvernement local est susceptible de s'en débarrasser bientôt. Alors, pourquoi devrions-nous nous donner la peine d'organiser une cérémonie de démolition et de crémation ? N'est-ce pas un gaspillage ?'\n\nLa plupart des personnes présentes sont restées silencieuses. Le lieutenant-général des FADJ a jeté un coup d'œil au major-général de la République de Chine (ROC) assis à sa gauche. Le major-général s'est éclairci la gorge avant de parler :\n'Général Singh, je comprends votre confusion. Cependant, je dois souligner que nous discutons d'un bâtiment qui a une valeur symbolique significative pour l'ancien régime de la République populaire de Chine, son parti au pouvoir et ses partisans. Son potentiel à devenir un totem politique, représentant des idéologies antidémocratiques et anti-paix, ne peut être ignoré. Retirer ce bâtiment et les restes n'est pas un acte de provocation. Au lieu de cela, c'est un effort pour effacer un chapitre douloureux de l'histoire, un chapitre qui pourrait provoquer de futures rancunes s'il n'est pas contrôlé.'\n\nLe major-général Singh a hoché la tête en signe de compréhension, et le général japonais a tapé des mains avec soulagement. 'Alors nous pouvons officiellement annoncer l'ajournement de cette réunion,' a-t-il dit."
jap.149.a: "Ainsi, le sort du mausolée de Mao Zedong fut scellé."
jap.150.t: "Imposition de la justice"
jap.150.d: "'Pour honorer ceux qui se sont sacrifiés et pour s'assurer que l'héritage de la lutte acharnée du monde libre ne soit pas mal utilisé, nous soutenons la demande de justice,' a déclaré le ministre japonais des Affaires étrangères, regardant directement la caméra lors d'une émission en direct. Après une série de phrases les plus élaborées et sophistiquées, le ministre des Affaires étrangères a officiellement annoncé la poursuite des criminels de guerre de la RPC et des États membres de l'EADI. Il a également déclaré que des organisations telles que le Comité central du PCC, le Conseil d'État, l'ANP, la CCPPC, et la CMC et ainsi de suite avaient été classées comme des entités criminelles, leurs membres devant subir des enquêtes de dénazification.\n\nEn plus du personnel militaire déjà détenu dans les camps de prisonniers de guerre, les gendarmes ont mené des opérations dans plusieurs endroits, entrant de force dans des villas et emmenant d'anciens élites. Les biens des criminels de guerre ont été confisqués, y compris une statue de Bouddha dorée, de plus d'un pied de haut, qui appartenait autrefois à un général éminent.\n\nParmi tous les criminels de guerre de classe A, la réaction la plus intense est venue de Sun Jianguo, l'ancien chef adjoint de l'état-major général de l'APL. Il a été condamné à mort pour de multiples cas de travail forcé contre le peuple de Ryukyu pendant la Grande Guerre d'Asie. L'amiral a protesté, arguant que le verdict du tribunal insultait son identité militaire, et a demandé un pistolet pour 'mettre fin à sa vie avec dignité.' Le Comité de justice militaire du PDTO, cependant, a rejeté sa demande. Au final, l'amiral a rencontré son destin sur la potence."
jap.150.a: "Ils auraient dû réfléchir au prix qu'ils paieraient avant de commettre le crime."
jap.151.t: "Déclaration de liberté et de démocratie en Asie"
jap.151.d: "Rédigé par : le Japon\nCoparrainé par : le Commonwealth d'Australie, la Nouvelle-Zélande et la République de l'Inde\n\nLa paix et la stabilité de la région indo-pacifique sont gravement menacées. L'expansion militaire de la République populaire de Chine dans la mer de Chine méridionale et la mer de Chine orientale, sa coercition économique des pays voisins et sa sape délibérée de l'ordre international ont gravement mis en danger la paix et la prospérité dans la région indo-pacifique. Un tel comportement ne porte pas seulement atteinte à la souveraineté et à l'intégrité territoriale des États de la région, mais constitue également un défi flagrant à l'ordre international fondé sur des règles.\n\nNous croyons fermement que la liberté, la démocratie, les droits de l'homme et l'État de droit constituent le fondement de la prospérité et du progrès de la région indo-pacifique. Toute tentative de changer le statu quo par la force ou d'atteindre des objectifs politiques par la coercition nuira aux intérêts à long terme de la région. Nous devons nous unir pour sauvegarder ces valeurs durement acquises et résister à toute forme d'expansion autoritaire. Nos efforts conjoints assureront la paix et la prospérité continues de la région indo-pacifique, en la maintenant sur la voie de la liberté, de l'ouverture et de la démocratie.\n\nToutes les nations qui partagent ces valeurs sont les bienvenues pour se joindre à cette noble entreprise. Ce n'est qu'en nous unissant que nous pourrons assurer un avenir brillant à la région indo-pacifique."
jap.151.a: "Le périmètre de défense Asie-Pacifique."
jap.152.t: "Aide militaire"
jap.152.d: "Le capitaine Yamada et Chen se déplaçaient rapidement dans une rue vide. La brise marine masquait le bruit de leurs pas alors que les lumières du port de pêche s'éloignait derrière eux. Devant, se profilait une chaîne de montagnes d'un noir d'encre, où la branche de Tainan de la Force de l'Ours Noir maintenait une base secrète.\n\n'La septième livraison d'équipement est prévue pour le mois prochain,' dit Yamada, son fusil HK416 prêt. 'Elle comprend des missiles antichars légers Type 01 et des lunettes de vision nocturne AN/PVS-15, ainsi que suffisamment de munitions pour trois mois.'\n\n'Merci pour votre aide,' répondit Chen. 'Mais nous avons besoin de plus de systèmes anti-drones. Ces drones des salauds du continent ont fait que trop de nos hommes ont été repérés par leurs chiens de garde.'\n\n'Nous les aurons dans le prochain envoi. Le gouvernement japonais a décidé de vous apporter son soutien total,' l'assura Yamada. 'Souvenez-vous, vous ne vous battez pas seuls, nous serons avec vous à chaque étape du chemin.'"
jap.152.a: "Nous avons besoin de plus d'armes."
jap.153.t: "Éclaté"
jap.153.d: "Le (ancien) ambassadeur des États-Unis au Japon a fait irruption dans la salle de conférence du ministère des Affaires étrangères, le visage rougi de colère. Il serrait un dossier si fort que ses bords s'étaient froissés. Dehors, Tokyo était animée comme toujours, comme si elle ne se rendait pas compte des troubles qui se déroulaient à travers le Pacifique.\n\n'C'est une rupture de contrat complète !' a crié l'ambassadeur, sa voix résonnant dans la pièce. 'Comment le gouvernement japonais peut-il suspendre unilatéralement les remboursements de la dette ? Cela va à l'encontre de tous les principes de l'ordre financier international !'\n\nLe ministre des Affaires étrangères du Japon a observé calmement le diplomate autrefois posé. Son expression est restée illisible, mais ses mots avaient une force indéniable. 'Monsieur, dites-moi, dans la situation actuelle de votre pays, à qui devrions-nous rembourser cette dette ? Doit-ce être à l'administration sous le contrôle du président Trump, ou au gouvernement fédéral dirigé par le président Biden ? Ou peut-être à la soi-disant Armée populaire de libération, qui prétend représenter le peuple ? Si vous-mêmes ne connaissez pas la réponse, comment pouvez-vous exiger que nous fassions un choix ?'"
jap.153.a: "L'ambassadeur a ouvert la bouche, mais n'a pas pu prononcer un mot."
jap.154.t: "Un petit interlude"
jap.154.d: "'Je viens de voir les nouvelles,' a dit le professeur Fujita, posant son téléphone. 'Ils vont délibérer sur l'article 9 à la Diète ? Dans un moment comme celui-ci, faire des concessions à la Chine pourrait être inévitable.'\n\n'Faire des concessions ?' Le professeur Yamamoto a levé les yeux, ses sourcils se rejoignant. 'Vous avez dû mal comprendre. Ils prévoient d'abolir l'article 9.'\n\nLa main du professeur Fujita s'est figée en l'air. 'Quoi ? L'abolir ? C'est de la folie ! Essayent-ils de revivre notre histoire passée ?'\n\n'Ils soutiennent que la Constitution de la paix est devenue hors de propos,' a répondu le professeur Yamamoto, se penchant en arrière dans le canapé. Plus tôt ce matin, il avait fini de lire un devoir d'étudiant, un devoir épouvantable. 'Surtout après la guerre dans le détroit de Taiwan.'\n\n'Mais cela ne prouve-t-il pas que nous avons plus que jamais besoin de paix ?' a dit Fujita, élevant la voix. 'La guerre n'apporte que destruction. N'est-ce pas la leçon la plus profonde que l'histoire nous ait donnée ?''En ce moment, tout ce que les politiciens peuvent voir, c'est l'humiliation,' a dit Yamamoto, secouant la tête. 'Ils prétendent que la Constitution de la paix est un nœud coulant autour du cou du Japon.'\n\n'Ridicule,' a rétorqué Fujita avec un rire froid. 'Comptent-ils enlever ce nœud coulant, seulement pour le glisser autour de la gorge de chaque citoyen ?'"
jap.154.a: "Aux yeux des politiciens, qu'est-ce que le peuple a de l'importance ?"
jap.155.t: "Conseil amical"
jap.155.d: "Au quatrième étage de l'Agence nationale de la police, il y a un département nouvellement créé sans nom, si nouveau, en fait, que même le panneau sur sa porte reste vierge. Chaque matin à 8 heures, le personnel en costume arrive et s'installe dans un bureau aux fenêtres occultées, s'asseyant devant des rangées de moniteurs qui brillent d'une faible lumière bleutée. Leur travail consiste à surveiller les 'discours inappropriés', un peu comme pêcher des prises invisibles dans un vaste océan.\n\nSur le bureau du chef de section Sato se trouve le dernier Guide de gestion des médias, un mince livret rouge sans auteur indiqué. 'Trois médias en ligne ont dévié aujourd'hui,' rapporte un jeune employé. 'Ils ont utilisé l'expression 'renforcement militaire' au lieu de 'capacités d'autodéfense renforcées.''\n\nSato hoche la tête et fait une coche sur un formulaire blanc. Depuis la création du département, vingt-sept médias différents ont reçu des 'lettres de conseil' pour 'formulation inappropriée.' Ces avis se terminent toujours par la même signature douce : 'Nous espérons que vous comprendrez.'\n\nSur le mur, un grand affichage clignote continuellement avec un flux de données, le suivi en temps réel du sentiment public. Le rouge indique un sentiment négatif, le bleu un sentiment positif, et le vert, selon le Guide, signifie 'préoccupation appropriée.' Toutes les données sont enregistrées, analysées et transformées en chiffres cliniques pour les rapports hebdomadaires du département.\n\nÀ la fin de la journée de travail, les employés sortent du bureau sans nom et retournent à leur vie ordinaire."
jap.155.a: "Et ces écrans surveillent chaque coin."
jap.156.t: "Le corps mobile"
jap.156.d: "Ken'ichi Fujiwara est sorti de son appartement en civil, une légère bruine tombant du ciel couvert. En tant qu'officier de la Division de la circulation du département de la police métropolitaine de Tokyo, il ne profitait que rarement d'un jour de congé. À quatre heures du matin, les rues de la ville étaient silencieuses, à l'exception d'un grondement inhabituel qui résonnait au loin.\n\nLe premier char de combat principal de type 90 a fait le tour du coin de la rue, son commandant réprimant un bâillement, l'air de sortir du lit et de monter sur la tourelle. Derrière lui suivaient plusieurs véhicules blindés et camions militaires remplis de personnel des FADJ, certains s'appuyant les uns sur les autres, profondément endormis, d'autres regardant fixement les rangées d'immeubles de grande hauteur, comme s'ils ne savaient pas pourquoi on les avait appelés à Tokyo à cette heure.\n\nAu-dessus, trois hélicoptères AH-1Z vrombissaient dans le ciel de la ville, leurs rotors résonnant sur les tours de béton. Un salarié s'est figé sur place, trop stupéfait pour remarquer que sa mallette tombait au sol. À proximité, un groupe de jeunes spectateurs filmait avec enthousiasme le convoi qui passait sur leurs téléphones, comme s'ils regardaient le tournage d'un film d'action.\n\nFujiwara a regardé un véhicule blindé de type 96 ramper, son opérateur radio somnolant derrière un casque rouge clignotant. Un coursier à vélo, chargé de journaux qui ne mentionnaient rien de tout cela, s'est arrêté au bord de la route pour regarder la scène. Au moment où ces journaux arriveraient au seuil des gens, Tokyo serait peut-être déjà devenue un endroit complètement différent."
jap.156.a: "La ville sommeille encore dans la brume de l'aube."
jap.157.t: "Traître"
jap.157.d: "'Cette défaite dans la guerre incombe directement à vos épaules !' a crié Lintsukiko Tsubaki du Parti libéral-démocrate, sa voix tendue par une colère contrôlée alors qu'elle se tenait au podium. 'Pendant que nous travaillions sans relâche pour la sécurité nationale, que faisiez-vous ? Vous organisiez des manifestations anti-guerre dans les rues ! Vous vous opposiez au budget de la défense à la Diète !'\n\n'C'est la démocratie en action !' a rétorqué un membre du Parti démocrate constitutionnel, se levant.\n\n'La démocratie ?' Tsubaki a eu un rire sans humour. 'Quand Taiwan a appelé à l'aide, votre idée de la démocratie était de rester assis sans rien faire ? Nous aurions pu résister à l'expansion de la Chine avec tout ce que nous avions, mais au lieu de cela, nous avons dû gaspiller de l'énergie à négocier avec vous à la maison. Chaque fois que le budget de la défense était abordé, chaque pièce de législation, vous étiez là, traînant les pieds !'\n\n'Ne déformez pas les faits !' a crié un législateur du Parti démocrate pour le peuple. 'C'est votre politique étrangère qui a complètement échoué !'\n\n'Échoué ?' Tsubaki a frappé la table des deux mains. 'Qui a divulgué nos déploiements de défense ? Qui n'a cessé de dénigrer les Forces d'autodéfense dans les médias ? Qui a sapé la détermination du public au moment le plus critique ? Maintenant que Taiwan est tombée, êtes-vous satisfaits ?'\n\nLa salle a éclaté dans un tumulte, mais la voix de Tsubaki s'est élevée au-dessus du bruit. 'Un jour, la vérité sur la façon dont vous avez trahi nos intérêts nationaux éclatera au grand jour. L'histoire se souviendra de qui a donné à nos ennemis leur plus grand avantage en ce moment de crise !'"
jap.157.a: "Vous êtes des criminels aux yeux de l'histoire !"
jap.158.t: "Manifestation pacifique"
jap.158.d: "Yamato Suzuki a serré la jugulaire de son casque anti-émeute et a saisi son bouclier. En tant que capitaine de l'unité de police mobile, il a levé un haut-parleur pour la troisième fois : 'En vertu de la loi sur les rassemblements publics et les manifestations, il vous est ordonné de vous disperser immédiatement. Dans le cas contraire, nous emploierons la force.'\n\nDes rires moqueurs ont éclaté parmi les manifestants. 'À bas le tyran ! Vive la paix !' ont-ils crié à plein volume, brandissant des pancartes en signe de défi. Suzuki a étudié les visages de ces soi-disant pacifistes, leurs pancartes disaient 'Renversez le tyran,' mais ils semblaient inconscients de la grave crise à laquelle le pays était confronté.\n\n'Ceci est votre dernier avertissement. Toute personne qui restera ici dans les dix prochaines minutes sera arrêtée pour obstruction à l'exercice des fonctions officielles.' Minute après minute, le temps s'écoulait. Au lieu de se disperser, les manifestants se sont poussés vers la ligne de police. Suzuki en a repéré certains qui filmaient de manière provocante, espérant apparemment capturer un moment de 'brutalité policière.'\n\n'Avancez,' a-t-il ordonné sèchement. Comme une épée tirée, l'escouade anti-émeute a fendu la foule. Suzuki a saisi l'un des leaders, un homme portant un foulard rouge, et l'a rapidement maîtrisé. L'homme n'arrêtait pas de crier à propos de 'violence policière,' mais Suzuki n'y a pas prêté attention."
jap.158.a: "Dans des moments comme ceux-ci, pensez-vous vraiment pouvoir vous en sortir avec un tel chaos ?"
jap.159.t: "Discours du Premier ministre"
jap.159.d: "Alors que le crépuscule s'installe sur le mont Fuji, notre nation est confrontée à des défis sans précédent. Un vent froid du nord apporte la menace de la Russie, les vagues de la mer de Chine orientale font écho aux ambitions de la Chine, et des nuages sombres se profilent toujours plus près depuis la péninsule coréenne. Ces puissances cherchent à lier notre liberté avec des chaînes, à écraser notre détermination par la peur.\n\nNous avons perdu notre voisin le plus proche et avons rendu cette région maritime d'autant plus précaire. Mais souvenez-vous de ceci : le Japon ne s'est jamais rendu à la solitude, et il n'a jamais cédé à l'adversité.\n\nQuand la lumière du matin perce les nuages et que les fleurs de cerisier s'épanouissent malgré les vents violents, c'est ce que nous sommes en tant que peuple. Nous pouvons être frappés, mais jamais brisés ; nous pouvons être seuls, mais ne jamais perdre notre chemin.\n\nNous devons être aussi vigilants que des ninjas et aussi courageux que des samouraïs. Que ceux qui voudraient nous asservir voient que, bien que notre nation insulaire soit petite, notre esprit est incassable. Chaque grain de sable sur cette terre porte l'héritage de nos ancêtres.\n\nNe vous laissez pas aller au désespoir, car le désespoir est exactement ce que nos ennemis désirent.\nNe baissez pas votre garde, car la vigilance est le prix de la liberté.\nNe perdez pas la foi, car la foi est notre plus grande arme.\nTant que le mont Fuji restera debout, tant que les fleurs de cerisier fleuriront chaque printemps, l'esprit du Japon ne s'éteindra jamais."
jap.159.a: "Ne désespérez jamais."
jap.160.t: "Mise en question de la responsabilité"
jap.160.d: "'Laissez-moi vous dire à quoi ressemble un désastre politique,' a déclaré Rinko Tsukikage du Parti libéral-démocrate, sa voix tendue par une colère contenue alors qu'elle se tenait au podium. 'Votre soi-disant 'Plan de revitalisation des PME' n'est rien d'autre qu'une blague colossale.'\n\nElle a brandi un rapport statistique. 'Un processus d'approbation rationalisé ? En conséquence, des entreprises louches se sont glissées inaperçues. Plus de huit cents entreprises frauduleuses ont exploité cette faille pour recevoir des subventions, totalisant plus de quatre-vingts milliards de yens. Pendant ce temps, des entreprises traditionnelles authentiques qui ont vraiment besoin d'aide sont poussées dans une concurrence féroce parce que vous avez supprimé les normes d'entrée de l'industrie.'\n\n'Quant à votre 'politique de libéralisation des médias' tant vantée, le fait de supprimer les exigences de licence pour les organes de presse a inondé le marché de près de trois mille sources médiatiques en ligne non vérifiées. Au cours de la seule année dernière, plus de vingt mille reportages non fondés sont devenus viraux sur les plateformes sociales. Avez-vous une idée du chaos que cela a causé dans la société ?'\n\nTsukikage a jeté un coup d'œil vers les sièges de l'opposition, où certains membres gardaient le silence tandis que d'autres semblaient prêts à réfuter. 'À cause d'un seul faux rapport sur la sécurité alimentaire, quatre entreprises établies de longue date ont fait faillite, laissant trois mille personnes sans emploi. Est-ce ce que vous entendez par 'liberté d'expression' ?' Elle a levé un autre dossier. 'Mais ce ne sont même pas les échecs les plus mortels. Votre plus grande faute est d'avoir complètement ignoré nos besoins en matière de défense. Sous votre administration, le budget de la défense a été réduit et les mises à niveau de l'équipement des Forces d'autodéfense ont été retardées encore et encore. Maintenant, Taiwan est déjà tombée, et des navires de guerre chinois patrouillent juste au large de nos eaux territoriales ! Nous n'avons d'autre choix que de faire face à un voisin encore plus agressif, et c'est tout grâce à vous !'"
jap.160.a: "Ce sont donc les 'fruits abondants' de vos réformes ?"
jap.161.t: "Les couloirs du pouvoir"
jap.161.d: "'Regarde attentivement, Yoko. Toutes les décisions importantes concernant les affaires de cette nation sont débattues ici,' a dit Lord Uda de la préfecture de Chiba, confortablement assis à sa place désignée dans la galerie des spectateurs au deuxième étage du bâtiment de la Diète nationale japonaise. Il a regardé avec satisfaction les délibérations dans la salle en dessous.\n\n'Oui, Père,' a répondu Yoko, la fille aînée de la famille Uda, qui avait une chevelure noire lustrée et une apparence élégante et raffinée. L'ensemble du bâtiment de la Diète n'avait guère subi de changements depuis l'ère Showa 11, avec seulement des réparations mineures dues à quelques incendies et tremblements de terre.\n\nEn fait, ce n'était pas seulement l'architecture qui était restée inchangée ; la variété des personnes dans l'assemblée présentait également des similitudes frappantes avec celles d'il y a cent ans. Par exemple, le législateur âgé assis au premier rang derrière les ministres du cabinet, se prélassant dans le respect de ses jeunes collègues, était presque indiscernable du noble Genrō du passé, qui portait des uniformes luxueux garnis d'or et tenait des bicornes ornés de plumes. De même, l'individu entrant par la gauche, serrant des mains, échangeant des amabilités et s'engageant dans des plaisanteries légères, ressemblait remarquablement aux jeunes opportunistes qui entouraient constamment Fumimaro Konoe. Même la figure corpulente qui se frayait un chemin à travers la foule vers son siège semblait une version moderne des prodiges politiques du Taisei Yokusankai, qui étaient passés des pages du Yomiuri Shimbun aux couloirs législatifs au 21e siècle.\n\n'... Qu'en penses-tu, Yoko ?' demanda Lord Uda alors que le Président de la Chambre frappait le marteau pour ajourner la session, qui s'était terminée après de longs débats sur des amendements mineurs à plusieurs projets de loi.\n\nYoko répondit rapidement, 'J'ai trouvé cela très instructif, et je suis reconnaissante pour cette opportunité, Père.' Mais intérieurement, alors qu'elle écoutait le débat passionné sur la nécessité de supprimer un adjectif d'une phrase, elle pensait :"
jap.161.a: "... Il est étonnant de voir à quel point les humains peuvent être apathiques et indifférents."
jap.162.t: "La terre du soleil couchant"
jap.162.d: "Il y a longtemps, dans le pays d'Izumo, Susanoo-no-Mikoto fut chargé de protéger ces rivages. Une divinité puissante maniant l'épée Ame-no-Murakumo, il tua autrefois le redoutable Yamata-no-Orochi pour sauver la princesse Kushinada d'un destin sacrificiel. Pourtant, au fil des ans, Susanoo est devenu complaisant. Il pensait que son pouvoir ne faiblirait jamais et que ses compétences à l'épée ne rouilleraient jamais. En ces jours paisibles, il a négligé son entraînement quotidien et a laissé l'épée Ame-no-Murakumo prendre la poussière sur l'étagère.\n\nUn jour, un serpent encore plus puissant s'est levé des mers de l'est. Ses écailles scintillantes et sa langue fourchue glacée témoignaient de sa puissance terrifiante. Susanoo a saisi son épée longtemps inutilisée, seulement pour trouver sa lame émoussée. Quand il a pris sa position de combat, il a réalisé à quel point ses techniques étaient rouillées. Face à ce serpent colossal de l'Est, le héros qui avait autrefois vaincu Yamata-no-Orochi se tenait maintenant impuissant.\n\nDans le choc féroce qui a suivi, Susanoo a été repoussé pas à pas. Son maniement de l'épée autrefois fier s'est avéré étonnamment fragile. Au final, il ne pouvait que regarder le serpent s'emparer de la terre qu'il avait juré de protéger. Les larmes sont de nouveau tombées des yeux de la princesse Kushinada, mais cette fois-"
jap.162.a: "Aucun héros ne peut la sauver maintenant."
jap.163.t: "La bataille finale"
jap.163.d: "Yu Inoue a examiné la carte opérationnelle à l'intérieur de la salle de commandement tactique du lycée de Zhongshan. La distance de cinq cents mètres avait été méticuleusement divisée en plusieurs zones d'assaut, chaque pâté de maisons étant annoté par des données stratégiques détaillées. À l'aube, douze chars de combat principaux du 3e régiment blindé lanceraient la première vague d'attaques, tandis que le peloton d'infanterie d'Inoue avancerait des deux flancs sous une couverture blindée.\n\nLa confirmation de la préparation de l'équipement a résonné à travers les communications. Inoue a vérifié son fusil de type 89, s'assurant que chaque composant mécanique était en parfait état. Les munitions avaient déjà été distribuées, avec six chargeurs de rechange soigneusement alignés dans son gilet tactique. Les systèmes de vision nocturne et d'imagerie thermique ont subi une dernière calibration.\n\n'Quinze minutes avant l'opération,' la voix du chef de peloton a grésillé dans son oreillette. À travers son monoculaire tactique, Inoue pouvait voir clairement la silhouette de la gare de Dalian sur le ciel nocturne. Au cours de la semaine dernière, chaque point d'observation possible et chaque zone de tir dans ces rues avaient été analysés à plusieurs reprises. Les moteurs des véhicules blindés grondaient dans l'obscurité comme des bêtes prêtes à bondir. Inoue a effectué une dernière vérification des canaux de communication, s'assurant que la liaison avec le blindé était sécurisée."
jap.163.a: "Le temps est clair aujourd'hui."
jap.164.t: "La marche"
 jap.164.d: "Fujii Kaisho était assis à l'arrière d'un camion militaire, regardant la fumée noire s'élever à l'extrémité de l'autoroute du sud. C'était le troisième jour depuis que son unité avait pris Shenyang, et la station de radiodiffusion provinciale de Jilin était devenue le dernier bastion de résistance de la ville. Un vent froid, porteur d'une odeur de poudre à canon, soufflait à travers la benne ouverte du camion, lui rappelant le journal de son grand-père.\n\nCe cahier jauni documentait tout depuis l'incident de Mukden en 1931. À l'époque, l'armée du Guandong avait voyagé vers le nord de la même manière, à bord de trains de troupes à travers les plaines du nord-est de la Chine. Alors, les locomotives à vapeur laissaient derrière elles de la fumée blanche, alors que maintenant c'était de la fumée noire provenant des tirs d'artillerie.\n\nUn convoi blindé a tonné sur l'autoroute, le bruit des chenilles de chars sur l'asphalte plongeant Fujii dans un état second. Plus de quatre-vingt-dix ans plus tard, ils voyageaient à nouveau sur la même terre. Dehors, le paysage semblait étrangement familier : le même sol, la même fumée à la dérive, et dans sa poche de poitrine se trouvait une photo identique à celle que son grand-père avait portée dans sa jeunesse.\n\n'Cinq kilomètres,' la voix du capitaine a craché à la radio. Fujii a serré son fusil automatique, regardant la silhouette lointaine du bâtiment de la station de radiodiffusion qui se dessinait à travers la brume. À ce moment, l'histoire semblait se superposer. Il a pensé aux scènes dans le journal de son grand-père décrivant Fengtian, et à l'avancée de l'armée du Guandong il y a longtemps. Maintenant, comme s'il traversait le temps, il se retrouvait à retracer le chemin de son ancêtre."
jap.164.a: "Cette fois, la fin sera entièrement différente."
jap.165.t: "Nanjing, Nanjing !"
jap.165.d: "Au milieu du tonnerre de l'artillerie, la cloche en cuivre du mémorial du massacre de Nanjing tinte avec une résonance sombre. Le capitaine Li Tieshan se tient devant le mur du mémorial, derrière lui les noms de 10 665 victimes.'Capitaine, la Wanda Plaza est tombée,' la radio grésille avec la voix du transmetteur. 'Le dernier message de la police armée était : 'Nous préférons mourir que de battre en retraite.''\n\n'Recueillez les dernières lettres de tous les soldats,' dit-il calmement. 'Dites-leur qu'aujourd'hui, ici même sur cette terre imbibée du sang et des larmes de nos ancêtres, nous écrirons notre dernier chapitre.' La salle d'exposition du mémorial a été transformée en hôpital de campagne de fortune. Les soldats blessés s'appuient contre les vitrines, les photographies historiques décolorées derrière eux dépeignant d'innombrables os et des rivières de sang des décennies passées. Du sang frais s'égoutte des brancards, s'infiltrant dans les fissures du sol.\n\n'L'ennemi avance depuis la route de Yunjin ! Nos troupes de ce côté se retirent vers notre position.' Li Tieshan regarde les quelques derniers missiles antichars dans le coin, ce sont leurs seules armes lourdes restantes. Les soldats vérifient discrètement leurs munitions. Personne ne parle, mais chacun transmet la même détermination : cette fois, ils vivront et mourront avec cette ville.\n\nUn soldat, nettoyant son fusil, demande soudainement, 'Capitaine, pensez-vous que nos ancêtres nous regardent d'en haut ?' Li Tieshan le regarde et répond, 'Ils ne font pas que regarder. Ils attendent que nous rendions des comptes à ces 300 000 âmes.' Ce sera leur dernier bastion. Li Tieshan attache une baïonnette à son fusil et se tourne vers les soldats derrière lui. 'Préparez-vous au combat ! Que l'histoire se souvienne qu'ici, nous n'avons pas fait défaut à nos héros tombés au combat.'"
jap.165.a: "Vos âmes sont vraiment des héros parmi les fantômes !"
jap.166.t: "L'œil de Tianjin"
jap.166.d: "Le ciel au-dessus de Tianjin est brisé en fragments de suie par la fumée qui s'élève. Dans cette ville qui abrite à la fois des bâtiments historiques de l'époque de la concession et des gratte-ciel modernes, la guerre se propage d'une ruelle étroite à l'autre. L'APL a construit couche après couche de défenses dans le quartier de style italien, tandis que les unités blindées japonaises avancent depuis la route Haihe Est, leurs chenilles creusant de profondes cicatrices dans le trottoir.\n\nLa rue de la culture ancienne a été réduite à de la terre brûlée. S'appuyant sur le temple de Tianhou, les forces spéciales de l'APL mènent une guérilla à travers un labyrinthe de ruelles, où chaque coin peut cacher une escouade antichar. Les véhicules blindés japonais luttent dans les rues étroites, contraints d'affronter des bombes incendiaires et des explosifs improvisés de toutes les directions.\n\nLa gare de Tianjin est devenue une forteresse isolée. L'APL a transformé cette gare centenaire en un bastion, tandis que les troupes aéroportées japonaises tentent d'atterrir dans la zone de Wudadao. Pourtant, chaque bâtiment est devenu un point fort, obligeant les Japonais à compter sur des frappes aériennes pour les détruire complètement.\n\nDans la nouvelle zone de Binhai, les gratte-ciel modernes forment le champ de bataille le plus brutal. Les façades en verre se brisent dans des explosions, et les passerelles entre les grands immeubles se transforment en points de vue vitaux. L'infanterie des deux côtés se bat dans les cages d'escalier et sur plusieurs étages, utilisant tous les moyens possibles pour éliminer l'ennemi."
jap.166.a: "Un cauchemar sans fin."
jap.167.t: "Salut aux morts au combat"
jap.167.d: "Naoki Watanabe regarde le char de combat principal de type 99A cabossé sur le pont. Il rampe vers l'avant comme une bête blessée, criblé de trous de balles, ses chenilles émettant des grincements métalliques torturés. Pourtant, il continue d'avancer, propulsé par une détermination effrayante. Derrière lui marche une colonne d'infanterie de l'APL. Ils avancent à l'unisson, leurs postures inébranlables. L'armure cicatrisée du char capte la lumière du matin, projetant un éclat doré sur cette procession sinistre.\n\n'Ceci est votre dernier avertissement ! Déposez vos armes et rendez-vous immédiatement !' La voix du chef de peloton résonne à travers un haut-parleur. 'Arrêtez d'avancer tout de suite !' Mais les soldats qui avancent semblent ne pas entendre. Watanabe remarque un éclair de conflit sur le visage du jeune officier avant qu'il ne lève la main. 'Ouvrez le feu !' Au commandement, des coups de feu déchirent le calme du matin. Les trois premiers soldats de l'APL tombent instantanément, mais ceux qui sont derrière eux marchent sur les corps et continuent d'avancer. Un soldat, touché à la jambe, est rapidement soutenu par un camarade pour qu'ils puissent continuer d'avancer ; un autre, touché à la poitrine, tend le bras vers l'avant avant de s'effondrer, comme s'il s'accrochait à un rêve inaccessible.\n\nLe canon principal du char continue de rugir, renversant un véhicule blindé. Mais bientôt, un missile antichar siffle et frappe l'armure latérale du char. Dans un éclair de feu, le mastodonte d'acier cesse enfin son avance. Alors que la fumée se dissipe, Naoki Watanabe reste figé. Il a été témoin d'innombrables batailles, mais jamais d'une telle. Dans les yeux de ces soldats mourants, il n'y a ni peur ni hésitation, seulement de la tristesse et de la colère."
jap.167.a: "Les os loyaux fortifient la Grande Muraille, la lamentation est profonde."
jap.168.t: "L'Inde se sépare du PDTO"
jap.168.d: "'Ces Indiens ! Incroyable !' Le chef de section Sato a claqué le télégramme diplomatique sur la table de conférence. 'Nous avons passé des années à poser soigneusement les bases en Asie du Sud, et maintenant ils se retirent simplement du Traité de défense du Pacifique sans un mot ? Pour qui nous prennent-ils ?' De l'autre côté de la table, Moriyama Yukiko a gardé un sourire professionnel, ajustant légèrement ses lunettes. 'Sato-senpai, calmez-vous s'il vous plaît. Parfois, il vaut mieux laisser la poussière retomber et voir où la balle atterrit.'\n\n'Laisser la balle voler ?' Sato a ricané. 'Les Indiens ont été très clairs, ils 'réévaluent leurs partenariats stratégiques en Asie.' De combien plus claire cette balle a-t-elle besoin d'être ?'\n\n'Vous regardez cela de manière trop pessimiste,' a répondu Yukiko, affichant un rapport sur sa tablette. 'D'un point de vue plus optimiste, nous n'avons plus à dépenser de ressources pour gérer les conséquences de la guerre civile en Chine. Avec la Chine en plein chaos, il est naturel pour l'Inde de reconsidérer sa position géopolitique.' Sato a regardé le panorama de Tokyo, silencieux pendant un moment. 'Des années de manœuvres, et au final, nous n'avons rien à montrer.'\n\n'Pas nécessairement,' haussait les épaules Yukiko. 'Les relations entre le Japon et l'Inde restent solides. Quitter le traité ne signifie pas abandonner la coopération bilatérale. De plus, dans des moments comme ceux-ci, ce qui semble être une perte peut se transformer en un avantage.' Sato s'est tourné vers elle, un éclair d'intérêt dans ses yeux. 'Continuez.' Yukiko a fermé son dossier. 'Au lieu de nous accrocher aux cadres des traités, nous devrions nous concentrer sur la manière d'assurer un bénéfice mutuel continu entre les deux parties.'\n\nSato a laissé échapper un long soupir, la colère sur son visage s'estompant progressivement. 'Vous avez raison. Dans ce monde, parfois, la décision la plus intelligente est de faire l'imbécile.'"
jap.168.a: "OK"
jap.169.t: "L'Inde se sépare du PDTO"
jap.169.d: "L'Inde, membre fondateur de l'Organisation du traité de défense du Pacifique, a officiellement annoncé l'achèvement de la Ligue de défense de l'Asie du Sud, un nouveau bloc de sécurité régional englobant le sous-continent indien et les zones environnantes. Simultanément, l'Inde a déclaré son retrait officiel du PDTO. Selon un communiqué du ministère indien des Affaires extérieures, la SADA est construite sur le principe de 'l'autonomie régionale', soulignant une coopération militaire, de renseignement et de ressources stratégiques profonde entre ses États membres.\n\nLe Japon et l'Australie, les autres membres fondateurs du PDTO, ont exprimé leur inquiétude face à la décision de l'Inde. Dans un communiqué conjoint, leurs ministères des Affaires étrangères respectifs ont réaffirmé leur engagement à maintenir les opérations du PDTO tout en poursuivant la coopération bilatérale en matière de sécurité avec l'Inde.\n\nLes analystes internationaux suggèrent que la décision de l'Inde signale une nouvelle division dans le paysage de la sécurité en Asie. D'un côté se trouve le PDTO, dirigé par le Japon et l'Australie ; de l'autre, la SADA, avec l'Inde en son cœur."
jap.169.a: "Intéressant."
jap.170.t: "La Chine lance des exercices militaires en mer de Chine orientale"
jap.170.d: "Le quartier général du renseignement de la défense a récemment signalé que la Chine a lancé un exercice militaire à grande échelle en mer de Chine orientale, impliquant un déploiement important de navires de guerre, de forces aériennes, d'unités amphibies et d'unités de soutien de tir à longue portée. Les évaluations du renseignement indiquent que l'exercice présente des caractéristiques offensives claires, son point de mire géographique et ses cibles simulées suggérant fortement un objectif stratégique vers le Japon et Taiwan. Cette démonstration de force semble être une tentative de renforcer le contrôle de Pékin sur la mer de Chine orientale et les régions environnantes, défiant directement la posture de défense du Japon.\n\nGrâce à la reconnaissance par satellite et aux patrouilles maritimes, le QGRD a confirmé que l'exercice comprend des navires de guerre avancés, des sous-marins et des groupes de frappe de porte-avions, tandis que des moyens aériens tels que des avions de chasse et des avions de reconnaissance ont également été déployés, démontrant des opérations interarmées hautement coordonnées.\n\nEn réponse à ce développement, le QGRD recommande l'amélioration immédiate de la posture défensive du Japon en mer de Chine orientale, ainsi qu'une intensification du partage de renseignements et de la coordination stratégique avec les forces alliées pour évaluer pleinement les risques de sécurité potentiels posés par les actions de la Chine."
jap.170.a: "Contactez nos alliés en Corée et le PDTO."
jap.171.t: "La Corée du Nord déplace ses forces à la frontière avec la Corée du Sud"
jap.171.d: "Le quartier général du renseignement de la défense a signalé une activité militaire nord-coréenne significative le long de la frontière coréenne, l'ampleur et l'intention de l'opération soulevant de sérieuses préoccupations. L'imagerie satellite à haute résolution et les réseaux de renseignement au sol confirment que plusieurs divisions d'infanterie nord-coréennes ont été massées à plusieurs dizaines de kilomètres au nord de la zone démilitarisée. Cette concentration de troupes est accompagnée d'unités d'artillerie, de véhicules blindés et d'une augmentation des mouvements logistiques. Particulièrement préoccupant, les avions de reconnaissance ont détecté la Corée du Nord déployant des lanceurs de missiles balistiques à courte portée et des systèmes d'artillerie à roquettes mobiles près de la frontière. Cette posture de force suggère des préparatifs pour soit une démonstration de force stratégique, soit une action militaire potentielle.\n\nEn réponse, le QGRD a ajusté ses priorités de surveillance sur la péninsule coréenne et mène un partage de renseignements et une coordination étroits avec les agences australiennes et sud-coréennes pour surveiller les mouvements de troupes et l'intention stratégique de la Corée du Nord en temps réel. Compte tenu de l'histoire de la Corée du Nord d'escalader les tensions par des manœuvres militaires à la frontière, le QGRD conseille au gouvernement et à la direction des Forces d'autodéfense d'élaborer de manière proactive des plans d'urgence pour atténuer les risques de toute provocation potentielle, garantissant la sécurité du Japon dans l'environnement régional de plus en plus volatile."
jap.171.a: "Ce n'est pas très bon..."
jap.172.t: "Des navires chinois sont entrés dans les eaux d'Okinawa"
jap.172.d: "Comme chaque matin, Taro le pêcheur a navigué sur son bateau à travers les eaux calmes d'Okinawa, jetant ses filets dans la mer alors que la douce brise matinale chuchotait sur les vagues. L'horizon brillait avec les premières touches d'orange, et ses mains, calleuses et sûres, travaillaient les cordes avec une aisance habituelle. Ses yeux vifs balayaient la mer, à la recherche du miroitement subtil des poissons sous la surface. Mais la tranquillité du matin fut de courte durée.\n\nAu loin, des taches sombres ont émergé à l'horizon, devenant de plus en plus grandes. Un bourdonnement bas et résonnant a grondé dans l'air, brisant le calme de la mer. Taro a plissé les yeux. Des cargos ? Peut-être un autre cargo lointain, en route vers un port lointain. Mais alors que les formes imposantes se sont précisées, son estomac s'est serré d'inquiétude, des navires de guerre chinois. Leurs coques grises scintillaient froidement sous le soleil du matin, coupant à travers les vagues avec une précision délibérée. Les bannières à l'étoile rouge claquaient dans le vent, leurs couleurs vives se détachant sur le ciel pâle. Ces navires ne faisaient pas que passer, ils se dirigeaient droit vers ces eaux.\n\nLa flotte s'est rapprochée, et avec elle est venue son ombre, jetant un voile sombre sur le petit bateau de pêche de Taro. Puis, une émission a retenti, lointaine mais perçante, des mots perdus dans le vent mais lourds de commandement. Taro s'est figé, sa poigne se resserrant sur la rambarde. Il connaissait cette mer, sa mer, pourtant la voix portait un poids indéniable, une présence qui ne cherchait pas de permission. Son équipage s'est précipité hors de la cabine, se regroupant sur le pont, murmurant et pointant du doigt, leurs voix perdues dans les rafales de vent croissantes.\n\nLes navires de guerre ne se sont pas attardés. Après une brève pause, la flotte colossale a continué d'avancer, se déplaçant avec l'inévitabilité implacable de géants, creusant un chemin silencieux à travers les eaux que Taro avait toujours appelées chez lui."
jap.172.a: "Des Chinois ? Dans la mer au large d'Okinawa ?"
jap.173.t: "La Chine commence les préparatifs d'une nouvelle opération de débarquement"
jap.173.d: "Le quartier général du renseignement de la défense a détecté des activités militaires à grande échelle et irrégulières des forces armées chinoises dans plusieurs directions stratégiques. Les renseignements recueillis par la reconnaissance par satellite, le renseignement de signaux et les patrouilles maritimes confirment que l'Armée populaire de libération a amassé d'importantes forces militaires en mer de Chine orientale et dans les régions adjacentes, y compris des navires de guerre, des moyens aériens et des unités de missiles basées à terre. L'ampleur et la fréquence opérationnelle de ces mouvements sont sans précédent.\n\nParticulièrement préoccupant, plusieurs navires de guerre et formations de sous-marins de la marine de l'APL ont été observés opérant de manière extensive à l'est d'Okinawa, accompagnés de fréquentes sorties d'avions de chasse et d'avions de reconnaissance, indiquant une expansion intentionnelle du contrôle de la Chine sur les espaces aériens et maritimes régionaux. De plus, le renseignement confirme que l'APL a mené des exercices d'assaut amphibie à grande échelle le long de son littoral, soutenus par des déploiements d'artillerie à roquettes à longue portée et de missiles balistiques, suggérant fortement une menace directe pour le Japon et Taiwan.\n\nNotre évaluation conclut que ces actions peuvent signaler des préparatifs pour une opération militaire à plus grande échelle ou l'exécution progressive de la stratégie hégémonique régionale de la Chine."
jap.173.a: "Ils veulent commencer une autre guerre ? Nous pouvons la commencer nous-mêmes."
jap.174.t: "Cyberattaque préventive"
jap.174.d: "Les doigts du sous-lieutenant Nami Okamoto dansaient sur le clavier, chaque frappe précise et délibérée. Le commandement cyber des Forces d'autodéfense du Japon avait atteint le stade critique de leur dernière opération, nom de code 'Sakura Neige.' Utilisant le navire de reconnaissance furtif Hina Taka, ils avaient réussi à infiltrer un drone chinois 'Wing Loong' patrouillant les frontières maritimes. Le drone, inconscient de sa trahison, était devenu un cheval de Troie, se faufilant inaperçu dans le réseau militaire chinois.\n\nL'intrusion a été transparente, presque élégante, pas une seule alarme n'a été déclenchée. Comme une araignée tissant sa toile, le programme 'Sakura Neige' s'est répandu sur les nœuds interconnectés, s'enfouissant plus profondément à chaque seconde qui passait. Puis, Nami l'a trouvé, un dossier, son cryptage exceptionnellement robuste. Le processus de décryptage a été lent, ardu, chaque couche pelée révélant quelque chose de bien plus sinistre que les protocoles de défense de routine ou les exercices d'entraînement. Alors que les données se chargeaient sur son écran, l'atmosphère dans la salle des opérations est devenue électrique de tension. Ce n'était pas un document militaire standard. C'était une stratégie de guerre complète et méticuleusement planifiée : comment couper les lignes de vie maritimes du Japon. Comment paralyser ses réseaux électriques et de communication. Comment s'emparer des îles clés. Le texte était clinique, calculé, dépourvu d'émotion, non pas la rhétorique d'un conflit, mais un manuel d'instructions pour l'extermination. Un plan pour effacer le Japon de la carte, aussi facilement que l'on pourrait écraser un insecte ou enlever un obstacle.\n\nLes yeux de Nami se sont fixés sur l'écran lumineux rempli de kanji. Dans son esprit, une vieille fable a fait surface, la grenouille bouillie lentement vivante dans de l'eau qui se réchauffe. La chaleur initiale était trompeuse, réconfortante même. Puis elle est devenue chaude, puis insupportable, jusqu'à ce que finalement, il soit trop tard. Elle a regardé les rangées de caractères chinois, figée sur place pendant ce qui a semblé une éternité. Et puis, à travers les lacunes entre les mots, elle a vu ce qui était vraiment écrit là. Deux caractères, encore et encore. 'Vengeance.'"
jap.174.a: "Alerte opérationnelle maximale !"
jap.175.t: "Frappe préventive contre la Chine"
jap.175.d: "Le sous-lieutenant Wataru Matsuda a été réveillé en sursaut par un coup rapide à sa porte. Dans la faible lumière de sa cabine, il pouvait à peine distinguer la silhouette d'une affiche de Toyama Kasumi, le 'porte-bonheur' que sa jeune sœur lui avait imposé, lui disant que cela le garderait en sécurité et le ramènerait à la maison. 'Lieutenant Matsuda ! Rassemblement d'urgence !' la voix de l'officier des communications est venue de l'extérieur. Matsuda a rapidement mis son uniforme et est entré dans le couloir, déjà rempli d'officiers.\n\nDans la salle des opérations, le capitaine a regardé tout le monde et a dit, 'Messieurs, le quartier général vient de délivrer un ordre top-secret. Le renseignement montre que la marine chinoise prévoit de lancer une attaque surprise sur notre pays. Pour protéger la sécurité nationale, nous allons effectuer une frappe préventive.' Matsuda a ressenti un moment de désorientation. Une frappe préventive ? Cela signifiait qu'ils frapperaient sous le couvert de l'obscurité, attaquant l'ennemi avant qu'il ne puisse réagir. Mais le gouvernement n'avait-il pas déclaré que le Japon ne serait jamais le premier à déclencher une guerre ?\n\nAprès la réunion, Matsuda est sorti sur le pont. Il a pris une cigarette et l'a allumée dans la brise marine, laissant la nicotine calmer brièvement ses pensées. Il a pensé à sa famille et à tout ce qu'il avait juré de protéger. La fumée a tourbillonné un instant avant de se dissiper. Appuyé contre la rambarde, il a senti les moteurs du destroyer rugir sous lui. Bientôt, ils partiraient, brisant le silence de la nuit.\n\nPrenant une dernière bouffée profonde, Matsuda a jeté le mégot de cigarette usé dans la mer d'un noir d'encre. La petite braise a filé à travers l'obscurité, puis a disparu dans la nuit éternelle. À ce moment, il a su que l'histoire jugerait la justesse de cette décision, et qu'il était prêt à assumer sa responsabilité."
jap.175.a: "C'est parti."
jap.176.t: "Envoyés de paix"
jap.176.d: "Alors que le soir s'installe, les lumières au néon le long d'Orchard Road commencent à clignoter, leur lueur se reflétant sur le blindage du char de combat principal de type 10 du sous-lieutenant Akihiko Nakamura. Jetant un coup d'œil au-delà des façades en verre imposantes des complexes commerciaux haut de gamme, il observe la rue commerciale la plus animée d'Asie. Le convoi blindé avance à un rythme mesuré, les chenilles d'acier grondant sur l'asphalte. Juste derrière suit le véhicule blindé de transport de troupes du lieutenant Takumi Suzuki, rempli de fournitures de secours. Cette unité avancée du 7e régiment blindé a pour mission d'apporter la paix et un nouvel ordre à Singapour.\n\nÀ ION Orchard, un écran LED colossal continue de clignoter des publicités de mode haut de gamme. Les résidents de Singapour regardent la colonne d'acier dans un silence feutré, certains capturant la scène sur les derniers iPhones, d'autres observant simplement tranquillement. Pour Nakamura, ces visages calmes renforcent la justesse de leur mission : défendre la démocratie.\n\nLorsque la colonne blindée passe devant Orchard Central, une petite fille en uniforme scolaire fait signe au char. Nakamura enlève son casque et sourit en retour. Alors que la nuit tombe, le convoi roule devant la station de MRT d'Orchard. Les trains circulent toujours comme d'habitude, avec des employés de bureau bien habillés et de jeunes gens sortant des sorties de la station."
jap.176.a: "Tout reste le même."
jap.177.t: "Vol tropical"
jap.177.d: "L'hélicoptère UH-60J coupe à travers la canopée dense de la forêt tropicale du Cambodge. Le sergent Yuichi Tanaka s'appuie contre la porte de la cabine, regardant la vaste étendue verte en dessous. L'air tropical humide, chargé de l'odeur de la terre humide, se précipite dans la cabine, lui rappelant les documentaires sur la guerre du Vietnam qu'il a regardés à l'académie.\n\n'Hé, Yamamoto,' dit-il, poussant le soldat à côté de lui avec un coude, 'ne penses-tu pas que c'est un peu comme les Américains au Vietnam ?' Koji Yamamoto lève son visage trempé de sueur, sur le point de répondre, quand une soudaine rafale de turbulence secoue l'hélicoptère, les interrompant.\n\n'Il ne nous manque que quelques Charlies avec des AK qui sautent des arbres,' plaisante Tanaka, bien que sa main effleure instinctivement le chargeur de rechange sur son gilet tactique. La formation d'hélicoptères de la 7e brigade aéroportée continue d'avancer vers Phnom Penh, le rugissement des turbines résonnant sur la canopée de la forêt tropicale."
jap.177.a: "On va se faire descendre par un RPG ?"
jap.178.t: "Loup solitaire"
jap.178.d: "Depuis le poste de commandant de son char de combat principal de type 10, Daiki Suzuki observe les rues d'Ho Chi Minh-Ville. Sur sa tablette tactique, des images de drone en temps réel montrent trois chars T-90 des forces blindées vietnamiennes en embuscade le long de la route Tan Son, formant un blocus triangulaire pour boucler la route vers le centre-ville. 'Chargez un AP !' ordonne-t-il. Le chargeur Nakamura confirme que l'obus est chargé avec un clic sec. Guidé par son système de servo électro-hydraulique, le canon principal de 120 mm du char se tourne avec précision vers le flanc vulnérable du premier T-90. 'Feu !'\n\nLe premier obus perforant quitte le canon et touche sa cible à la jonction du blindage de la cible. L'explosion éclaire un blanc brillant sur la lunette thermique, et le premier char explose instantanément. Suzuki n'a cependant pas le temps de célébrer, car les deux T-90 restants ont déjà verrouillé leur position. 'Manœuvre d'évasion à droite ! Tirez de couverture !' Le char pivote parfaitement sous le système de contrôle, tandis que la mitrailleuse balaie les dispositifs optiques de l'ennemi pour gagner du temps pour le rechargement. Un obus ennemi du deuxième T-90 frôle l'armure de leur propre char.\n\n'Cible numéro deux, 650 mètres, obus chargé !' annonce le système de contrôle de tir électronique. Suzuki confirme la visée et tire immédiatement. Le deuxième obus perforant pénètre dans le compartiment de puissance de l'ennemi. Le T-90 explose en flammes, mais il continue de résister avec obstination. Le dernier char vietnamien essaie de se retirer derrière les bâtiments voisins. Suzuki attend calmement l'angle de tir parfait, puis donne l'ordre final de tirer. Le troisième obus frappe les chenilles du char, immobilisant la bête d'acier pour de bon au coin de la rue."
jap.178.a: "Le vainqueur est roi."
jap.179.t: "Offensive du nord"
jap.179.d: "Le midi trouve Hanoï tremblant sous un barrage d'artillerie. Le sous-lieutenant Yuichi Nakamura est couché derrière les ruines fumantes d'un immeuble de bureaux au bord de la place Ba Dinh, regardant le mausolée de Ho Chi Minh apparaître et disparaître à travers la fumée qui s'élève. Les tirs ennemis des positions vietnamiennes déchirent les décombres de béton autour de lui avec des impacts stridents.\n\n'Couvrez-moi !' crie Nakamura dans ses communications, signalant à l'expert en démolition Suzuki de préparer la charge en sac. Pendant ce temps, la force principale est enfermée dans un féroce combat urbain, avec le rugissement des chars se mêlant au staccato des tirs de fusil. Au-dessus, des avions à réaction et des missiles sol-air tissent à travers le ciel, libérant occasionnellement des débris enflammés qui tombent sur les rues. 'Regardez à deux heures !' crie-t-il, juste au moment où une roquette frappe le mur derrière lui. L'onde de choc qui s'ensuit projette plusieurs membres de son escouade hors de leurs pieds, des décombres pleuvant autour d'eux. Essuyant le sang de son visage, Nakamura avance. Un soldat vietnamien sort de la fumée ; Nakamura tire par instinct.\n\n'Équipe d'ingénieurs, avancez sur la cible !' La radio grésille avec une cacophonie d'ordres criés et d'explosions. Tanaka et Sato, deux ingénieurs de combat soulevant des sacs de démolition, rampent vers l'avant sous un tir de couverture. Une fumée épaisse et suffocante s'enroule au-dessus de la place, percée seulement par des faisceaux de lumière. La place Ba Dinh est devenue un champ de bataille infernal, parsemé de cratères et de véhicules en feu. Un avion de chasse rugit au-dessus, larguant des bombes dont les explosions résonnent au loin."
jap.179.a: "En avant !"
jap.180.t: "Le temple"
jap.180.d: "La lumière du crépuscule baigne la flèche dorée du temple de Xisage d'une teinte ambrée. Le sous-lieutenant Yusuke Sato se tient devant les anciennes marches de pierre, regardant l'abbé âgé descendre lentement, ses robes orange flottant doucement dans la brise du soir. 'Maître,' commence Sato, 'nous sommes venus pour quelqu'un, un officier de l'APL blessé.' L'abbé sourit et hoche la tête. 'Tous les êtres souffrent, alors pourquoi s'attacher au sort d'une personne ? Toutes les choses dans ce monde sont des illusions.' 'Ce n'est pas un débat philosophique, Maître,' Sato fait un pas en avant. 'C'est une opération militaire. Cet officier a le sang de nos camarades sur les mains.' 'Ce dont vous parlez n'est que de l'attachement,' répond l'abbé. 'Le Bouddha enseigne que la haine ne cesse pas par la haine ; seule la compassion peut vaincre la haine. Ce que vous cherchez n'est rien de plus que la continuation du karma.' Sato serre plus fermement la crosse de son fusil. 'Maître, je respecte votre foi, mais les ordres sont des ordres. S'il vous plaît, ne rendez pas cela difficile.' 'Le Bodhisattva craint la cause, tandis que les êtres ordinaires craignent l'effet. Les graines que vous semez maintenant porteront un jour un fruit amer. Pourquoi ne pas mettre de côté l'hostilité et éviter plus d'effusion de sang ?' 'Nous sommes des soldats, et le devoir premier d'un soldat est d'obéir aux ordres.' Joignant ses paumes, l'abbé dit, 'Amitabha. Une pensée de compassion, une pensée de la nature de Bouddha. Si vous pouvez lâcher votre attachement en ce moment, peut-être comprendrez-vous la préciosité de la vie.' 'C'est la dernière fois que je demande, livrez cet officier.' La patience de Sato s'épuise. Le vieux moine ferme les yeux. 'Tous les êtres possèdent la nature de Bouddha, mais tant d'entre eux restent perdus dans l'illusion. Si vous insistez pour utiliser la violence pour arrêter la violence, je ne peux que protéger le Dharma avec ma propre vie.'"
jap.180.a: "Sato a soupiré et a levé la crosse de son fusil."
jap.181.t: "Walkyrie des cieux"
jap.181.d: "Des dizaines d'avions de chasse déchirent la couverture nuageuse au-dessus de la baie de Manille. Sur l'avion de détection et de commandement aéroporté, un essaim de blips radar indique que diverses forces convergent. Takaguchi Tsukikage, le pilote d'élite de la Force d'autodéfense aérienne, manœuvre son F-35 alors qu'un groupe mixte de J-20 de l'APL et de KAI T-50 philippins s'approche de la mer de Chine méridionale. 'Toutes les unités, soyez averties : plus de quarante avions hostiles entrent dans la zone d'engagement,' l'avertissement de l'avion de commandement grésille sur le canal crypté. Tsukikage regarde les données constamment mises à jour sur son affichage tête haute. Son instinct lui dit que cette bataille aérienne pourrait remodeler la lutte pour les cieux de Manille.\n\nLa première salve éclate à trente mille pieds. Une pluie de missiles tisse une tapisserie mortelle dans les nuages, et les alertes stridentes des contre-mesures électroniques percent le cockpit. Tsukikage exécute un tonneau, esquivant deux missiles entrants, et verrouille instantanément un J-20 essayant de tendre une embuscade au AWACS de son côté. Son doigt serre la gâchette ; le missile air-air hurle vers sa cible. Les leurres ne peuvent pas sauver le J-20. Dans un brillant éclat de lumière, l'explosion se déroule haut au-dessus de la baie de Manille.\n\nLe chaos s'intensifie alors que des chasseurs de tout type se précipitent à travers les nuages, les traînées de missiles scintillant d'or au soleil. Le F-35 de Tsukikage exécute une manœuvre de cobra à couper le souffle, se glissant dans l'angle mort d'un KAI T-50. Son deuxième missile fait mouche, laissant une autre boule de feu scintiller au-dessus de la baie. Sous sa direction, la formation japonaise déchire progressivement la ligne de défense de l'ennemi. Le AWACS E-767 fournit la dernière mise à jour : plus de la moitié des avions de l'opposition ont été détruits, et les chasseurs restants se retirent vers le sud."
jap.181.a: "Ce ciel appartient maintenant au Japon."
jap.182.t: "Crise pétrolière !"
jap.182.d: "Avec l'Arabie saoudite tombant dans le chaos, notre approvisionnement en pétrole a été gravement entravé, et l'effondrement imminent des États-Unis n'a de toute façon pas apaisé notre situation précaire. Le Japon a enduré de nombreuses épreuves et surmonté de nombreux défis pour endurer et se reconstruire et s'améliorer en ce nouveau siècle.\n\nLes douleurs du premier choc pétrolier des années 1970 hantent encore la nation japonaise. Au cours de ce cauchemar, la croissance économique japonaise a été grandement affectée, et elle est tombée bien en dessous de la tendance de croissance nominale. Le Japon n'étant pas un grand producteur de ressources naturelles, notre position a toujours été fragile, marionnette aux mains de seigneurs tels que l'Amérique.\n\nHélas, cette crise ne sera pas la fin du Japon ; le soleil levant a survécu à des catastrophes similaires et pires dans sa longue et tumultueuse histoire. Peut-être que ce sera un nouveau départ, une nouvelle opportunité pour le Japon de enfin se libérer des chaînes et des contraintes mises en place par nos ennemis et 'alliés'. Au final, seul le temps dira le sort du Japon, mais pour l'instant, nous devons faire de notre mieux pour résoudre la situation devant nous."
jap.182.a: "Tomber sept fois, se relever huit."
jap.183.t: "Accord pétrolier du Japon"
jap.183.d: "Nous avons reçu une offre d'accord du Japon, selon laquelle ils veulent acheter notre pétrole moins cher que le prix du marché en échange d'un commerce et d'une coopération rentables dans le domaine de la technologie."
jap.183.a: "Nous aimons cet accord."
jap.183.b: "Non, seulement le prix standard."
jap.184.t: "La Russie accepte !"
jap.184.d: ""
jap.184.a: "Génial !"
jap.185.t: "La Russie insiste sur le prix standard"
jap.185.d: ""
jap.185.a: "D'accord..."
jap.186.t: "Le butin de la retraite"
jap.186.d: "Le front taïwanais a besoin de toujours plus d'hommes et de matériel, et nous nous retrouvons donc à devoir continuellement baisser la qualité pour répondre à la demande. Un officier entreprenant a proposé un plan pour se procurer plus de chars avec peu d'investissement supplémentaire, du moins tant que l'approvisionnement dure. Bien qu'il soit obsolète même au moment de son introduction, le Type 74 est toujours une conception fonctionnelle, et il nous en reste quelques-uns en réserve. Le nombre disponible n'est guère plus qu'une goutte dans une mare, mais la tempête de la fabrication japonaise veillera à ce que cette mare déborde."
jap.186.a: "La victoire, un char à la fois."
jap.187.t: "Moscou, mon amour"
 jap.187.d: "Il y a à peine quelques années, Andrei n'aurait jamais pu imaginer qu'il se retrouverait au Pays du Soleil Levant. Cependant, tout a changé rapidement il y a à peine quelques mois. Après la conclusion d'accords stratégiques entre le Japon et la Russie, un projet d'échange d'étudiants entre les universités des deux pays a été approuvé, et Andrei a eu la chance de faire partie du groupe qui a été invité à étudier pendant quelques mois à Tokyo. C'est là qu'il a rencontré la femme qu'il aimerait pour le reste de sa vie.\n\nIls se sont rencontrés tout à fait par hasard dans le couloir de l'université, se cognant la tête : elle avait une coupe de cheveux courte et ébouriffée, une robe bleu clair et des lunettes rondes ; il portait une chemise à carreaux et un jean déchiré. Hayase était une étudiante en architecture, une fille apparemment banale dont la beauté n'avait pas encore été révélée. Il s'attendait à entendre des cris de reproche, mais il a été agréablement surpris d'entendre plutôt un rire doux et doux.\n\n- Tu as un jean tellement stupide...\n\nQuelques semaines se sont écoulées, au cours desquelles ils étaient devenus incroyablement proches. Elle lui a montré un côté du Japon qu'il n'avait jamais imaginé auparavant : des magasins confortables dans des rues étroites, des jardins de ville plantés de cerisiers en fleurs, et des villages à moitié vides - elle lui a ouvert un autre monde. Il lui a parlé de sa patrie, de Moscou, de la Sibérie, des phoques du Baïkal et des plages de Crimée, des usines de Dolgoproudny et des montagnes de l'Altaï. Il a promis de lui montrer tous ces endroits.\n\nIls étaient assis sous le ciel nocturne étoilé. Elle lui racontait quelque chose sur sa vie d'étudiante et se plaignait des plus petites choses, mais il ne l'écoutait pas, il l'admirait simplement avec un sourire. Soudain, le ciel s'est illuminé d'un flash : il a été recouvert d'une myriade de feux d'artifice colorés. Hayase a sauté du banc comme une enfant et a regardé le spectacle avec délice, pointant les flashes les plus brillants. Il a seulement souri et a regardé dans ses yeux :"
jap.187.a: "Il y a vu l'univers."

jap.555.t: "Coup d'État du Parti japonais du Japon"
jap.555.d: "LE PLD EST TOMBÉ... DES MILLIARDS DOIVENT HONDA ACCORD"
jap.555.a: "HMM... TOREMA TAKINAWA TOYOTA CIVIC HONDA ACCORD MITSUBISHI DOSHIRAK I ROLLTON...."
jap.556.t: "Ascension de l'Empereur Yoshiro"
jap.556.d: "Le téléphone chinois a explosé et a tué Naruhito ! L'Empereur Yoshiro mène maintenant vers un avenir prospère !"
jap.556.a: "Honuda Honuda Yamete Kumite Sailor Moon"
jap.557.t: "MORT DU KARATÉ"
jap.557.d: ""Hokuto Shinken" un nouveau style de combat a complètement effacé toute trace de KARATÉ au Japon"
jap.557.a: "KARATÉ NAHUI ONO MNE"
jap.558.t: "Hideo Kojima a développé des Gundams"
jap.558.d: "Bonne nouvelle ! Hideo Kojima et sa Kojima Productions ont enfin développé les premiers prototypes fonctionnels de gundams !"
jap.558.a: "Génie."
jap.559.t: "LE PRÉSIDENT DU JAPON DANS LES TUNNELS"
jap.559.d: "LE PRÉSIDENT DU JAPON s'est cloné, afin de pouvoir aller dans les tunnels et retenir le mal à l'intérieur, pendant que son clone peut soutenir l'Empereur Yoshiro"
jap.559.a: "Quel homme !"
jap.560.t: "NOUS SOMMES ATTAQUÉS !"
jap.560.d: "ARGHHHH"
jap.560.a: "MOBILISEZ TOUTES LES DIVISIONS HONDA"
jap.561.t: "L'EMPEREUR YOSHIRO ABORDE LA MENACE CHINOISE"
jap.561.d: ""Votre intellect est aussi faible que votre Yuan, l'échec est votre destin, vous vous manquez de respect et à votre nation, vous êtes faits de stupidité""
jap.561.a: "BANZAI!!"
jap.562.t: "Tokyo-3 est terminé"
jap.562.d: "TYPE D'ESSAI... 03.... CHAMP DE TERREUR ABSOLUE.... ANGES... TOKYO-3...."
jap.562.a: "Oh... Cool...."
jap.563.t: "Renaissance de Kamenshik"
jap.563.d: "Aujourd'hui, à l'hôpital de la ville de Reina Conahan Arkham, Jabrail Albekovich Sultanov a fait revivre un guerrier du Japon longtemps oublié"
jap.563.a: "Son nouveau nom est... Maçon."
jap.564.t: "Siège de Toyota"
jap.564.d: "TOYOTA A ÉTÉ ENTIÈREMENT DÉTRUIT PAR NOTRE AGENT MAÇON !"
jap.564.a: "Honda Bon Arigato Konichiwa Tokinawa"
jap.565.t: "La pourriture du cerveau a consommé l'Australie"
jap.565.d: "Le titre dit tout"
jap.565.a: "C'était attendu."
jap.566.t: "LE PRÉSIDENT DU JAPON EST DE RETOUR"
jap.566.d: "Le vrai PRÉSIDENT DU JAPON vient de contacter l'Empereur Yoshiro, il dit qu'il a creusé un tunnel directement jusqu'à Shenzhen"
jap.566.a: "Grand succès !"

jap.1000.t: "Combats à la frontière coréenne !"
jap.1000.d: "Les flammes de la guerre brûlent à nouveau la péninsule coréenne, une terre déjà profondément marquée par les conflits passés, maintenant transformée en champ de bataille pour la confrontation idéologique. Les bottes de fer du Nord ont impitoyablement piétiné le fragile équilibre du 38e parallèle, tandis que les appels à l'aide du Sud semblent faibles et impuissants sous l'ombre du drapeau rouge.\n\nSi Tokyo reste les bras croisés et permet au régime communiste d'unifier la péninsule, leur prochaine cible pourrait bien être le Japon. Le Japon s'est toujours considéré comme le bastion avancé de la démocratie en Asie. En tant que défenseur de la démocratie, le Japon a non seulement l'obligation mais aussi la responsabilité d'intervenir et d'aider la Corée du Sud à défendre sa liberté et sa démocratie durement acquises, même si cela a un coût élevé.\n\nBien qu'il y ait des voix dissidentes au sein du gouvernement, les cris de la faction pro-guerre ont rapidement noyé toute opposition. Au milieu du tumulte de la Diète nationale, les navires des Forces d'autodéfense ont déjà fendu les vagues, se dirigeant vers le dernier bastion de la démocratie sur la péninsule coréenne. Des avions de chasse percent le silence de l'aube, et des soldats, entièrement armés, marchent en avant avec détermination et sans peur dans leurs yeux.\n\nPersonne ne peut prédire l'issue de cette guerre, ni dire avec certitude si le choix du Japon est le bon. Mais tout le monde sait que les roues de l'histoire ont commencé à tourner, et personne ne peut arrêter leur élan vers l'avant."
jap.1000.a: "Séparés par les montagnes et les mers, liés par le destin."
jap.1001.t: "Intervention japonaise dans la guerre de Corée"
jap.1001.d: "Selon un reportage du correspondant d'Asahi Shimbun en Corée du Sud, des échanges de tirs intenses ont éclaté tôt ce matin le long de la frontière entre la Corée du Nord et la Corée du Sud. Ce qui a commencé comme une escarmouche mineure s'est rapidement transformé en une confrontation militaire à grande échelle. Les deux parties se sont accusées mutuellement d'avoir tiré les premières, chacune affirmant que leurs actions étaient en légitime défense. Les combats sont en cours, et le nombre de victimes reste à confirmer. Le conflit aurait été déclenché par une altercation physique entre des unités de patrouille des deux nations près de la Zone Démilitarisée, qui a dégénéré en échange de tirs.\n\nLa Corée du Nord insiste sur le fait que les soldats sud-coréens ont d'abord traversé la ligne de démarcation militaire et provoqué leur unité de patrouille, les forçant à ouvrir le feu en légitime défense. En revanche, le ministère sud-coréen de la Défense nationale a publié un communiqué accusant les forces nord-coréennes d'une attaque non provoquée contre une patrouille sud-coréenne, ce qui a entraîné une riposte nécessaire. Selon les chefs d'état-major interarmées de la Corée du Sud, les forces nord-coréennes ont utilisé des roquettes et de l'artillerie pour bombarder les postes frontaliers et les installations militaires sud-coréens. En réponse, les forces sud-coréennes ont lancé des contre-attaques et déployé des avions de chasse KF-16 pour mener des frappes aériennes sur des cibles militaires nord-coréennes le long de la frontière.\n\nParallèlement, les médias officiels de la Corée du Nord ont publié un communiqué condamnant les 'actes d'agression' de la Corée du Sud et ont déclaré que l'Armée populaire de Corée est prête à tout moment à 'écraser le pouvoir militaire des marionnettes capitalistes du sud.'"
jap.1001.a: "Une guerre de plus..."
jap.1002.t: "La Grande Guerre d'Asie"
jap.1002.d: "Aujourd'hui, sous la poigne de fer des tyrans rouges, la Chine, autrefois autoproclamée 'l'Empire du Milieu', nourrit des ambitions et étend silencieusement ses griffes sur les territoires environnants. Face à cette force oppressive de l'Est, pour défendre la liberté et la démocratie de l'Asie, le Japon, autrefois une épée de samouraï redoutable qui semait la terreur dans le monde, a été silencieusement dégainé à nouveau. Sous la lumière radieuse du drapeau du Soleil Levant, 100 millions de citoyens ne font qu'un, unis pour résister à l'assaut de la marée rouge, protégeant la paix et la prospérité de cette terre.\n\nDes sommets imposants de l'Himalaya aux vagues bleues illimitées du Pacifique, nous nous battons férocement contre les tyrans empoisonnés par l'idéologie communiste. Avec notre sang et nos vies, nous défendons la dernière gloire et dignité restantes de l'Asie.\n\nNous sommes les héritiers de l'héritage du samouraï, avec le courage et l'intrépidité qui coulent dans nos veines comme des flammes. Peu importe à quel point le chemin à parcourir est périlleux, nous sortirons victorieux de cette bataille du destin. Lorsque les cerisiers en fleurs fleuriront à nouveau, cela marquera le moment de notre retour triomphal."
jap.1002.a: "Longue vie à l'Empereur, longue vie au Japon !"
jap.1003.t1: "Un nouveau soleil dans le ciel"
jap.1003.t2: "Le Bushido en ascension"
jap.1003.d1: "Les anciens alliés tombent, de nouveaux se lèvent, et avec le changement constant qui se produit dans l'histoire, il serait inévitable que le poids du passé, du présent et de l'avenir pèse sur nous tous.\n\nTout d'abord, le géant de l'est s'est brisé, divisé par ses nombreuses rancunes et frustrations. Puis l'Europe s'est engagée dans une guerre pétrifiante qui a mis le monde en feu une fois de plus.\n\nCe n'était qu'une question de temps avant que le dragon n'ouvre sa gueule et n'essaie d'avaler Taïwan en entier, mais l'île ne resterait pas seule. Nous avons combattu avec de nouveaux et anciens alliés, mais le passé nous a rattrapés, bientôt le dragon a piétiné nos forces, et le soleil blanc a brûlé dans ses flammes.\n\nLes conflits internes sont apparus, frère contre frère. Mais nous nous sommes élevés au-dessus de nos épreuves, et nous avons corrigé nos erreurs. Une fois de plus, nous avons ravivé de vieilles amitiés et nous avons aiguisé nos lames contre le dragon. Après des jours de combats non-stop, le dragon a été brisé et vaincu, la paix a été faite et un voile de stabilité a été jeté sur le continent.\n\nNos tribulations étant terminées et ce qui est brisé étant guéri, vous aussi pouvez profiter d'un repos bien mérité."
jap.1003.d2: "Le guerrier solitaire n'était pas si seul lorsque le dragon a tenté d'écraser Taïwan avec ses griffes. Avec ses alliés, nous avons pu repousser le monstre volant dans sa grotte.\n\nPourtant, les cicatrices qu'il a laissées sont restées, les villes brûlaient et nos familles ont été séparées par cette violence insensée. Nous avons beaucoup appris de cela, nous avons appris à être préparés à tout et n'importe quoi.\n\nNous avons réappris le chemin du guerrier, nous savions comment nous battre à nouveau.\n\nCe fut une sage décision. Inévitablement, le dragon essaierait d'entraîner l'ensemble de l'Asie dans une guerre de feu à nouveau, rendu fou par la soif de sang et un désir de vengeance, il a répandu son feu haineux à travers tout le continent. Pourtant, nous étions prêts, avec nos armes prêtes et nos têtes ensemble comme un seul samouraï. Nous avons visé le cœur du dragon et nous l'avons abattu.\n\nDéfait, le dragon serait emporté par la marée de l'histoire, et après cela, le Japon retrouvera sa place dans le monde."
jap.1003.a: "Profitez de l'ombre sous les arbres nouvellement poussés."
jap.1003.b: "Restez vigilants et ne désespérez jamais."
jap.1004.t: "Flotte de montagne"
jap.1004.d: "'Colonel Yamamoto, s'il vous plaît, venez avec moi.' Après avoir signé l'accord de confidentialité, le jeune sous-lieutenant a conduit Yamamoto à travers une série de portes blindées. L'ascenseur est descendu lentement, s'arrêtant finalement en profondeur sous terre.\n\n'C'est la zone centrale de notre projet Bouclier Océanique,' a expliqué le colonel Nakamura. Lorsque la dernière porte s'est ouverte, Yamamoto a haleté. Dans un immense quai souterrain, un porte-avions de classe Izumo modifié subissait les derniers préparatifs. L'îlot du porte-avions avait été redessiné, et son pont d'envol renforcé, clairement destiné à supporter de nouvelles opérations de chasseurs.\n\n'Il mesure 248 mètres de long et déplace 30 000 tonnes,' a déclaré Nakamura, pointant le porte-avions. 'Il est équipé d'un radar à balayage électronique avancé et d'un système de défense aérienne basé sur un navire, et peut déployer jusqu'à douze chasseurs F-35B.' Ils ont marché le long du quai, passant devant deux destroyers de défense aérienne de classe Akizuki, l'un derrière l'autre. Leurs 96 systèmes de lancement vertical se détachaient sur la proue.\n\n'Ce sont nos plus récents destroyers de missiles de classe Maya,' a continué Nakamura. 'Ils sont mis à jour à partir de la classe Akizuki, avec des missiles anti-navires et anti-aériens supplémentaires. Chaque navire est équipé du dernier radar SPY.' Plus loin, six frégates étaient alignées proprement. Bien que de petite taille, elles étaient équipées de systèmes de guerre électronique et anti-sous-marins de pointe.\n\nDans le centre de commandement, plusieurs officiers surveillaient les mouvements des navires à travers l'Indo-Pacifique, avec une carte électronique sur le mur mettant continuellement à jour les positions de la marine chinoise. 'À un moment critique, cette flotte remodèlera l'équilibre stratégique de tout le Pacifique,' a déclaré Nakamura, les yeux fixés sur l'écran. 'Et ce que vous voyez ici n'est qu'une partie de celle-ci. Nous avons des installations similaires ailleurs dans le pays. Tout ce que nous faisons est pour... un tout nouveau Japon.'"
jap.1004.a: "Banzai !"
jap.1005.t: "Le commandement naval des États-Unis arrive pour aider !"
jap.1005.d: ""
jap.1005.a: "Arigatou, Amerikanjin !"

