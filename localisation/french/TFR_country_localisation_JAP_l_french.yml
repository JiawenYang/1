JAP_asean_oil_desc: "Bien que nos relations avec les pays de l'ASEAN aient été marquées par des circonstances changeantes et des alliances fluctuantes, nous avons besoin de leur amitié maintenant plus que jamais. Le pétrole de Malaisie et d'Indonésie apportera sans aucun doute un soulagement partiel et temporaire à nos réserves pétrolières en diminution."
JAP_russian_deal: "Accord pétrolier [SOV.getflag]§GRusse§!"
JAP_russian_deal_desc: "Beaucoup de nos alliés seraient en désaccord, mais dans nos circonstances difficiles, même d'anciens ennemis peuvent devenir de nouveaux amis. L'achat de pétrole russe était restreint en raison de nos liens avec les États-Unis, mais maintenant, alors qu'ils tiennent à peine ensemble, nous devons utiliser toutes les sources de pétrole possibles. Après tout, le processus n'a pas d'importance, ce qui compte, c'est le résultat."
