JAP_oil_crisis_cat_desc: "Les cauchemars de 1973 sont revenus subitement hanter le Japon moderne. Nous espérions que nos enfants n'auraient pas à souffrir comme nous l'avons fait, mais ce qui est arrivé ne peut être changé, et tout ce que nous pouvons faire, nous devons le faire, c'est sécuriser de nouvelles sources de pétrole et résoudre ce problème avant qu'il ne devienne incontrôlable."
