JAP_digitalization_ishibadef2: "Programme de digitalisation complet"
JAP_digitalization_ishibadef: "Programme de digitalisation de l'État"
JAP_east_asia_defence_fund_idea: "Fonds de défense de l'Asie de l'Est"
JAP_east_economic_autarky_tt: "Débloque des £GFX_decision_icon_small §YDécisions§! pour : §YInvitation au Fonds de défense de l'Asie de l'Est§!"
JAP_energy_rationing: "Instaurer le rationnement"
JAP_escort_accelerated_production_idea: "Production accélérée de navires d'escorte"
JAP_european_future_combat_air_systems: "Systèmes aériens de combat futurs européens"
JAP_european_future_combat_air_systems_desc: "En dehors de l'Asie, les pays d'Europe occidentale développent quelque chose de très prometteur. En cours de réalisation se trouve un futur avion de chasse qui combine l'électronique et les matériaux les plus avancés connus de l'industrie de défense internationale, quelque chose qui constituera sûrement une menace sérieuse sur tout futur champ de bataille. Comme nous ne voulons évidemment pas que notre armée prenne du retard, il est temps de les approcher avec une demande de vente. Avec suffisamment de bonne diplomatie et une bonne somme d'argent, nous pouvons nous attendre à ce que ces jets soient ajoutés à notre force aérienne très bientôt. Tout comme nos amis occidentaux le font actuellement, nous devons être intransigeants dans la course aux avions de chasse futurs."
JAP_expand_chitose_tank_facility: "Agrandir l'usine de chars de Chitose"
JAP_expand_japan_steel_works_me_plant_in_muroran: "Agrandir l'usine mécanique et électrique de Japan Steel Works à Muroran"
JAP_expand_komatsus_plant_in_ishikawa: "Agrandir l'usine Komatsu à Ishikawa"
JAP_expand_sagamihara_tank_facility: "Agrandir l'usine de chars de Sagamihara"
JAP_expand_the_helicopter_plant_in_kakamigahara: "Agrandir l'usine d'hélicoptères de Kakamigahara"
JAP_focus_on_helicopter_carriers: "Se concentrer sur les porte-hélicoptères"
JAP_focus_on_helicopter_carriers_desc: "Maintenir la supériorité aérienne est vital dans le combat naval, comme l'ont prouvé nos graves erreurs dans les dernières années de la Seconde Guerre mondiale. Les hélicoptères aideraient dans ce domaine, donc nous déplacerons nos chantiers navals vers la production de porte-hélicoptères pour les aider à opérer en plus grand nombre contre les navires ennemis."
JAP_global_combat_air_programme_development: "Développement du Programme mondial d'avions de combat"
JAP_global_combat_air_programme_development_desc: "Avec l'Amérique fracturée et la Chine montante, nous, démocraties, n'avons pas d'autre choix que de nous unir pour nous défendre et défendre nos peuples. C'est dans cet esprit que nous, avec le Royaume-Uni et l'Italie, établirons le Programme mondial d'avions de combat. Ce n'est rien de moins que le projet aérospatial multinational le plus ambitieux du siècle : un effort massif pour construire une plateforme de chasseur furtif de sixième génération afin de déployer un avion de chasse commun, fusionnant nos projets précédemment séparés de sixième génération. S'engager dans cette initiative garantit un développement technologique bien au-delà de ce que nous pourrions réaliser seuls. Bien que coûteux, cet investissement international promet que nos troupes auront des cieux sûrs au-dessus d'elles, quoi qu'il arrive."
JAP_helicopter_carriers_accelerated_production_idea: "Production accélérée de porte-hélicoptères"
JAP_hit_and_run_tactics: "Tactiques de frappe et repli"
JAP_hit_and_run_tactics_desc: "Dans un combat un contre un entre notre marine axée sur les escortes et l'Armada de la PLAN, la victoire ne sera probablement pas un résultat auquel nous devrions nous attendre. Mais pourquoi s'attendre à une telle situation en premier lieu ? Nos flottes fonctionneraient bien mieux sous la doctrine des tactiques de frappe et repli, grignotant lentement la force de la PLAN jusqu'à ce que la domination du Japon sur toutes les flottes de la Chine soit incontestable."
JAP_implement_strict_corporate_culture: "Imposer une culture d'entreprise stricte"
JAP_ishiba_event_tt: "La décision §Y'Cimenter un capitalisme à visage japonais'§! aura un effet supplémentaire :"
JAP_ishiba_social_welfare_dec: "Protection sociale Ishiba"
JAP_ishiba_social_welfare_dec_desc: "\n\n\n\n£GFX_JAP_ishiba_ldp\n\n\n\n\n\nPrincipe de Zebraman : décoller ou tomber."
JAP_jieitai_dynamic_desc: ""
JAP_joint_development_with_larsen_toubro: "Développement conjoint avec Larsen & Toubro"
JAP_joint_development_with_larsen_toubro_desc: "Larsen & Toubro Limited est un conglomérat industriel indien massif qui opère dans une multitude de marchés et de produits différents. Ils font tout, de la production d'énergie aux technologies de l'information, en passant par le développement de véhicules blindés. Alors que le Japon élargit sa coopération avec ses alliés régionaux face à l'instabilité mondiale, il est temps de tendre la main et de concrétiser un nouveau programme de recherche et développement industriel avec ce titan de l'industrie. Avec leur coopération, nous pouvons mettre leur puissance brute en capacité industrielle et en main-d'œuvre au service du développement de systèmes qui nous donneront sûrement un avantage contre nos concurrents en cours de militarisation rapide."
JAP_kaijo_jieitai_dynamic: "Force maritime d'autodéfense japonaise"
JAP_kaijo_jieitai_dynamic_desc: ""
JAP_kaijo_jieitai_idea_dummy: "Force maritime d'autodéfense japonaise"
JAP_koku_jieitai_dynamic: "Force aérienne d'autodéfense japonaise"
JAP_koku_jieitai_dynamic_desc: ""
JAP_koku_jieitai_idea_dummy: "Force aérienne d'autodéfense japonaise"
JAP_komatsu_larsen_toubro_cooperation_idea: "Coopération Komatsu-Larsen & Toubro"
JAP_komatsus_light_designs: "Conceptions légères de Komatsu"
JAP_komatsus_light_designs_desc: "Komatsu Limited est une autre grande firme industrielle japonaise qui fabrique une large gamme d'équipements et de véhicules d'excavation. Outre leurs produits civils, ils ont également de l'expérience dans la production de produits militaires, notamment des véhicules de transport de troupes blindés. Notre armée ayant besoin de plus de véhicules légers, il est temps pour nous de les contracter pour répondre à ce besoin. Avec leur expertise et leur forte capacité industrielle, nous pouvons nous attendre à une flotte moderne et redoutable de véhicules légers pour notre armée régulière."
JAP_lean_towards_the_csto_doctrine: "Pencher vers la doctrine de l'OTSC"
JAP_lean_towards_the_nato_doctrine: "Pencher vers la doctrine de l'OTAN"
JAP_less_worker_rights: "§LAvoir moins de droits des travailleurs améliore les bonus !§!"
JAP_mitsubishi_heavy_industries_hyundai_rotem_cooperation_idea: "Coopération Mitsubishi Heavy Industries-Hyundai Rotem"
JAP_mitsubishis_steel_monsters: "Les monstres d'acier de Mitsubishi"
JAP_mitsubishis_steel_monsters_desc: "Mitsubishi est l'une des firmes industrielles les plus anciennes et célèbres du Japon, avec une longue histoire au service de l'armée japonaise. Pendant la Seconde Guerre mondiale et la Guerre froide, l'entreprise a fourni des véhicules redoutables qui ont semé la terreur chez les ennemis du Japon. Maintenant que la guerre se profile à l'horizon, il est temps de contracter à nouveau l'entreprise pour développer et améliorer l'inventaire des machines de guerre du Japon. Ils seront mis au travail pour concevoir et construire tout ce dont nos forces blindées ont besoin, en particulier les chars de combat principaux. Avec leur expertise et l'industrie japonaise à leur disposition, des monstres d'acier sortiront des chaînes de production qui nous donneront l'avantage sur tout champ de bataille contemporain."
JAP_new_economic_drive: "Nouvel élan économique"
JAP_new_economic_drive_desc: "\n\n\n\n£GFX_JAP_ishiba_drive\n\n\n\n\n\nTravailler plus dur, le rendre meilleur\nLe faire plus vite, nous rend plus forts\nPlus que jamais, heure après heure\nNotre travail n'est jamais terminé"
JAP_new_economic_drive_flag: "A terminé la décision £GFX_decision_icon_small : §YNouvel élan économique§!"
JAP_new_economic_drive_idea: "Nouvel élan économique"
