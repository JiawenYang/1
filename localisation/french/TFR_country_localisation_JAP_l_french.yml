JAP_develop_ecuador_oil_energy: "Développer la production pétrolière en [ECU.getflag] §9Équateur§!"
JAP_develop_indonesia_oil_energy: "Développer la production pétrolière en [INS.getflag] §2Indonésie§!"
JAP_develop_malaysia_oil_energy: "Développer la production pétrolière en [MAL.getflag] §OMalaisie§!"
