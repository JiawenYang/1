JAP_skill_training_admiral_coordination_skills: "§YFORMATION AUX COMPÉTENCES D'AMIRAL§! : Compétences de £coordination_texticon coordination"
JAP_skill_training_admiral_defense_skills: "§YFORMATION AUX COMPÉTENCES D'AMIRAL§! : Compétences de £defence_texticon défense"
JAP_skill_training_admiral_maneuvering_skills: "§YFORMATION AUX COMPÉTENCES D'AMIRAL§! : Compétences de £maneuver_texticon manœuvre"
