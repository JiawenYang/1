JAP_rikujo_koku_unmanned_coordination: "Coordination des drones Rikujō-Kōkū"
JAP_rikujo_koku_unmanned_coordination_desc: "Notre situation géopolitique actuelle exige une intégration entre tous les domaines de la guerre. Nous pouvons nous préparer davantage à la guerre en investissant dans des drones de renseignement, de surveillance et de reconnaissance (ISR) sans pilote, qui fourniront des informations vitales aux troupes au sol et aux pilotes. Cela assurera à la fois que nos pilotes ne combattront pas à l'aveugle, car chaque objectif au sol sera clairement identifié, et que nos soldats en première ligne pourront intercepter les aéronefs ennemis avant qu'ils ne frappent. Avoir une paire d'yeux invisibles guidant notre avancée ne peut pas mal tourner."
JAP_sink_their_supply: "Couler leur ravitaillement"
JAP_sink_their_supply_desc: "La PLAN, comme la plupart des flottes en Asie, nécessite un anneau d'approvisionnement stable pour maintenir ses opérations. S'occuper de cette chaîne d'approvisionnement est vital pour neutraliser les avantages de la PLAN sur nos flottes. En tranchant le cou du Dragon, il ne peut plus cracher son feu sur le Pacifique !"
