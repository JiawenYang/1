#GAW Tree
JAP_second_war_in_greater_east_asia: "Seconde guerre en Asie de l'Est élargie"
JAP_second_war_in_greater_east_asia_desc: "La paix. Parfois, nous la chérissons profondément, et d'autres fois, nous la rejetons sans y réfléchir à deux fois. Pour la deuxième fois en une décennie, nous sommes en guerre contre les Chinois, mais cette fois, le conflit a pris des proportions continentales. Ce n'est pas seulement une guerre pour la souveraineté de Taïwan, c'est une guerre pour la survie des nations libres en Asie de l'Est."
JAP_third_sino_japanese_war: "Troisième guerre sino-japonaise"
JAP_third_sino_japanese_war_desc: "Malgré nos constantes frictions avec les Chinois, notre rivalité n'a conduit qu'à deux conflits majeurs. Cependant, ce n'est plus le cas. Dans sa forme la plus simple, c'est la troisième guerre sino-japonaise, pas la Grande Guerre asiatique, pas la deuxième guerre de Taïwan, il s'agit de régler un compte que nous avons avec le dragon depuis des siècles."
JAP_hold_the_initial_push: "Repousser l'assaut initial"
JAP_hold_the_initial_push_desc: ""
JAP_take_hainan: "Prendre Hainan"
JAP_take_hainan_desc: ""
JAP_kanton_koryakusen: "Opération Canton"
JAP_kanton_koryakusen_desc: "Opération Canton"
JAP_reclaim_the_island: "Reprendre l'île"
JAP_reclaim_the_island_desc: "Le peuple libre de Taïwan s'est retrouvé opprimé par le régime continental, et nous devons expier nos échecs à les protéger. Reprendre l'île serait une victoire majeure, non seulement pour le moral, mais cela offrirait également une fenêtre pour débarquer des troupes sur le sol chinois."
JAP_honor_matsui: "Honorer Matsui"
JAP_honor_matsui_desc: ""
JAP_gateway_to_the_bohai_sea: "Porte d'entrée vers la mer de Bohai"
JAP_gateway_to_the_bohai_sea_desc: ""
JAP_straight_into_the_dragons_lair: "Directement dans l'antre du dragon"
JAP_straight_into_the_dragons_lair_desc: "La Chine se croyait intouchable, elle pensait être en sécurité, elle pensait que cette guerre serait une victoire facile. Pourtant, nous sommes maintenant en plein préparatifs finaux pour une invasion navale de leur propre pays ! Le dragon a volé trop près du soleil, et comme Icare, nous le ferons tomber du ciel."
JAP_together_with_korea: "Ensemble avec la Corée"
JAP_together_with_korea_desc: "L'histoire se répète, d'abord comme une tragédie, ensuite comme une farce. Le régime totalitaire de la Corée du Nord s'est allié à la Chine et s'en est pris une fois de plus à son homologue du Sud. Les Sud-Coréens sont l'un de nos alliés les plus précieux, pour plusieurs raisons. Plus précisément, c'est notre fenêtre la plus facile pour attaquer la Chine continentale. Ensemble, nous repousserons les hordes du nord, comme nous l'avons fait il y a sept décennies !"
JAP_secure_a_foothold_in_manchuria: "Établir une tête de pont en Mandchourie"
JAP_secure_a_foothold_in_manchuria_desc: "Avec les Nord-Coréens repoussés et leur territoire presque entièrement sous contrôle amical, une invasion de la Mandchourie n'est qu'à une rivière de distance. Les Chinois se battront certainement sans pitié, mais bientôt, les troupes japonaises et coréennes franchiront la frontière, et le début d'une nouvelle ère en Asie de l'Est commencera."
JAP_korean_question: "La question coréenne"
JAP_korean_question_desc: "Avec la péninsule coréenne unie et libre pour la première fois en plus d'un siècle, un débat a émergé sur notre nouvelle politique étrangère à leur égard. Certains estiment que nous devrions renforcer les relations, placer des troupes sur leur territoire et consolider nos liens économiques. D'autres soutiennent que cela ressemblerait à ce que l'Empire japonais a fait à la péninsule, et que nous devrions laisser la nation prospérer seule. Le choix nous appartient."
JAP_our_southern_allies: "Nos alliés du Sud"
JAP_our_southern_allies_desc: "Les Chinois ont récolté leur karma pour des années d'agitation en Asie du Sud. De nombreuses nations de cette région se sont ralliées à notre camp, et en tant que tel, nous pouvons enfermer le dragon plus efficacement. Nous devons coordonner avec nos alliés du sud pour nous assurer que la Chine ne s'échappe pas."
JAP_return_to_burma: "Retour en Birmanie"
JAP_return_to_burma_desc: ""
JAP_operations_in_southeast_asia: "Opérations en Asie du Sud-Est"
JAP_operations_in_southeast_asia_desc: "Les jungles de l'Asie du Sud-Est se sont à nouveau embrasées par les tirs et les explosions, et l'odeur de la fumée est pesante. Les combats contre les Chinois là-bas sont parmi les plus brutaux que cette guerre verra. Cependant, nous ne pouvons pas nous surmener et devons nous assurer que nos alliés portent leur propre poids."
JAP_philippine_affairs: "Affaires philippines"
JAP_philippine_affairs_desc: ""
JAP_marine_corps_expansion: "Expansion du corps des Marines"
JAP_marine_corps_expansion_desc: "Avec l'escalade continue de la guerre, la taille de notre corps des Marines doit être réexaminée. Nous nous retrouvons de plus en plus souvent à affronter les Chinois sur le terrain, donc avoir plus de forces prêtes pour ce type d'engagements ne peut pas faire de mal."
JAP_occupation_administrations: "Administrations d'occupation"
JAP_occupation_administrations_desc: "Les territoires que nous avons arrachés à la Chine et à ses alliés ne seront pas efficacement gouvernés par l'armée, et si cela continue, le mécontentement sera grand. Nous devons rendre le contrôle des territoires occupés au peuple, bien qu'ils doivent d'abord nous montrer leur loyauté."
JAP_prepare_to_defend_the_home_islands: "Préparer la défense des îles nationales"
JAP_prepare_to_defend_the_home_islands_desc: "Autant que nous détestions l'admettre, une invasion chinoise des îles nationales est dans le domaine du possible. Si cela devait arriver, nous perdrions certainement, mais nous ne nous rendrons pas facilement ! Nous ferons payer aux Chinois chaque pouce de sol japonais !"
JAP_spiritual_mobilization: "Mobilisation spirituelle"
JAP_spiritual_mobilization_desc: "Nous, Japonais, avons toujours été un peuple fier, qui respecte nos traditions et les générations qui nous ont précédés. Notre peuple le reconnaît et soutient fortement nos efforts contre l'ennemi. Nous devons canaliser les nombreuses années de l'histoire de notre nation dans ce conflit et rendre nos ancêtres fiers !"
JAP_priority_to_military_corporations: "Priorité aux corporations militaires"
JAP_priority_to_military_corporations_desc: "En ces temps de crise, nous devons reconnaître que certains secteurs de l'économie contribuent plus que d'autres, notamment les corporations militaires. Ce sont elles qui équipent nos troupes d'armes, chargent nos chars et alimentent nos hélicoptères. Bien sûr, nous leur accorderons une attention particulière pour le moment."
JAP_war_for_japans_survival: "Guerre pour la survie du Japon"
JAP_war_for_japans_survival_desc: "Imaginez, que se passera-t-il si nous perdons ? Des chars chinois défilant dans Tokyo, la destruction de notre culture, le tourment de notre peuple ! Ce n'est pas seulement une querelle entre deux puissances, c'est une guerre de vie ou de mort. Soit nous nous tiendrons debout et triompherons, soit nous tomberons, pour ne plus jamais nous relever."

#ARMY 2
JAP_redefine_the_japanese_army: "Redéfinir l'armée japonaise"
JAP_redefine_the_japanese_army_desc: "Une force d'autodéfense, c'est le terme approprié pour notre armée depuis sa création. Elle était toujours destinée à travailler en collaboration avec les Américains, mais sans eux, ses faiblesses ont été révélées. Des changements ont déjà été faits, mais nous devons aller plus loin et réformer complètement la JSDF."
JAP_recall_the_battle_for_taiwan: "Se souvenir de la bataille de Taïwan"
JAP_recall_the_battle_for_taiwan_desc: "Nos rencontres avec les Chinois pendant la guerre de Taïwan nous ont révélé beaucoup de choses. C'était notre premier conflit majeur depuis des décennies, et nous avons appris comment notre armée se débrouille seule. Nous serions fous d'ignorer les erreurs et les triomphes que nous avons eus, les leçons que nous avons apprises ne seront pas gaspillées."
JAP_continue_rearmament: "Poursuivre le réarmement"
JAP_continue_rearmament_desc: "Alors que la menace de la Chine continue de planer, nous devons continuer à remplir nos stocks. Ce n'est pas une question de savoir si nous combattrons à nouveau la Chine, mais quand. Le moment viendra éventuellement, et nous voudrons être bien équipés."
JAP_rikujo_jieitai: "Rikujō Jieitai"
JAP_rikujo_jieitai_desc: "Initialement négligées au profit de la marine et de l'aviation, nos troupes terrestres deviennent beaucoup plus importantes. À mesure que nos alliances et celles de la Chine grandissent, la probabilité que nous rencontrions notre ennemi sur le terrain augmente. Nous devons maintenant traiter nos soldats avec le même respect que nos marins et pilotes."
JAP_koku_jieitai: "Kōkū Jieitai"
JAP_koku_jieitai_desc: "La principale fenêtre d'attaque de la Chine sur notre nation est le ciel, et nous devons nous assurer qu'il est bien verrouillé. Notre force aérienne a connu de nombreux engagements avec les Chinois pendant la guerre de Taïwan, certains victorieux, d'autres non. Nous devons la renforcer correctement pour que les cieux restent libres d'ennemis."
JAP_kaijo_jieitai: "Kaijō Jieitai"
JAP_kaijo_jieitai_desc: "Quoi qu'il arrive dans ce monde, nous resterons toujours une nation insulaire. En tant que tel, nous aurons toujours besoin d'une marine forte, capable de protéger les îles nationales et de projeter notre puissance à l'étranger. Nous affronterons inévitablement les Chinois en mer à de nombreuses reprises, comme nous l'avons fait en défendant Taïwan, et nous serons prêts."
JAP_mass_production_of_the_rising_suns_airplanes: "Production de masse des avions Shinshin"
JAP_mass_production_of_the_rising_suns_airplanes_desc: "Le Mitsubishi X-2 est l'une des plus grandes réalisations de l'ingénierie aérospatiale japonaise moderne. Bien qu'il ne soit pas aussi avancé que ses homologues américains, c'est toujours notre premier chasseur furtif produit localement. Pendant que le développement du F-X continue, nous devons renforcer notre flotte de X-2."
JAP_return_to_the_super_kai_program: "Retour au programme 'Super Kai'"
JAP_return_to_the_super_kai_program_desc: "Bien que le Mitsubishi F-2 commence à montrer son âge, c'est toujours un chasseur fiable et facile à produire. En cette période de paix, nous pousserons nos ingénieurs à travailler sans relâche pour améliorer l'avion afin qu'il puisse rivaliser facilement avec ses homologues chinois."
JAP_experimental_uavs: "Drones expérimentaux"
JAP_experimental_uavs_desc: "Les véhicules aériens sans pilote se sont retrouvés au cœur de la guerre moderne, et nous sommes en retard. Cependant, en tant que nation occidentale forte, nous sommes plus que capables de concevoir des drones de combat avancés. Le moment est venu de rattraper le reste du monde."
JAP_increase_dockyard_construction_plan: "Augmenter le plan de construction navale"
JAP_increase_dockyard_construction_plan_desc: "Notre flotte a été endommagée pendant la guerre de Taïwan, et bien qu'elle n'ait pas été anéantie, elle pourrait être renforcée. Jusqu'à présent, nous avons été assez détendus en ce qui concerne les quotas de construction navale. Malheureusement, nous ne pouvons plus nous permettre ce luxe et devons nous assurer que nos travailleurs produisent de nouveaux navires aussi vite qu'ils le peuvent."
JAP_expand_the_carrier_fleet: "Élargir la flotte de porte-avions"
JAP_expand_the_carrier_fleet_desc: "Même aujourd'hui, les avions ne peuvent pas voler indéfiniment sans ravitaillement. Même s'ils peuvent aller plus loin, nos chasseurs ne pourront pas protéger nos alliés au sud lointain. La réponse ? Construire plus de porte-avions pour protéger les cieux des endroits que nous ne pouvons pas atteindre."
JAP_anti_ship_missile_development: "Développement de missiles antinavires"
JAP_anti_ship_missile_development_desc: "Les jours des navires pirates naviguant côte à côte, échangeant des tirs de canon, sont révolus. Dans les conflits navals d'aujourd'hui, il y a des moments où les navires ne se verront même jamais. La Chine est maître dans la production de missiles, mais à leur grand désarroi, nous le sommes aussi."
JAP_investments_in_infantry_and_artillery_development: "Investissements dans le développement de l'infanterie et de l'artillerie"
JAP_investments_in_infantry_and_artillery_development_desc: "Nous avons appris de la Seconde Guerre mondiale que l'armée japonaise n'est pas celle qui devrait s'appuyer fortement sur les chars. Bien qu'il soit toujours utile d'avoir un arsenal décent de ces bêtes à chenilles, nos forces terrestres d'aujourd'hui reposent largement sur l'infanterie et l'artillerie. Nous devons remodeler cet aspect de nos forces armées pour mieux contrer la doctrine chinoise."
JAP_armored_unmanned_vehicles: "Véhicules blindés sans pilote"
JAP_armored_unmanned_vehicles_desc: "Pourquoi l'aviation devrait-elle recevoir tout l'amour en matière de véhicules sans pilote ? Contrairement aux Chinois, lorsque nous voyons une chance de réduire la souffrance humaine dans l'équation, nous la saisissons. Nous devons développer des machines de combat capables d'infliger des dégâts, et lorsqu'elles sont détruites, ne pas entraîner la perte de vies japonaises."
JAP_wide_application_of_exoskeletons: "Application large des exosquelettes"
JAP_wide_application_of_exoskeletons_desc: "Quand quelqu'un pense à un exosquelette, il imagine soit des insectes, soit de grosses machines de science-fiction. En réalité, ils ne sont pas limités aux films ou aux insectes et existent dans notre monde aujourd'hui. Cependant, ils ne sont pas utilisés à leur plein potentiel, ce que nous devrions pouvoir exploiter."
JAP_a_worthy_successor_to_the_imperial_army: "Un digne successeur de l'armée impériale"
JAP_a_worthy_successor_to_the_imperial_army_desc: "L'armée impériale a peut-être combattu pour des raisons différentes de celles d'aujourd'hui, mais elle était néanmoins une force de combat efficace. Nous avons passé trop de temps à compter sur les Américains pour un soutien militaire, incapables de nous défendre nous-mêmes. Pourtant, leur tragédie est devenue notre moment de réalisation, et maintenant nous sommes capables de défendre les nations libres d'Asie !"
JAP_conscription_reform: "Réforme de la conscription"
JAP_conscription_reform_desc: "Notre armée est entièrement composée de volontaires, ce dont nous sommes fiers. Tant de personnes sont prêtes à défendre leur nation de leur propre gré. Cependant, alors que l'état du monde semble continuer à se détériorer, nous devons nous assurer que notre armée dispose d'un flux constant de main-d'œuvre. La conscription ne sera pas obligatoire, mais elle sera encouragée et les conscrits seront généreusement rémunérés."
JAP_rikujo_kaijo_koku_coordination: "Coordination Rikujō-Kaijō-Kōkū"
JAP_rikujo_kaijo_koku_coordination_desc: "Le factionnalisme est mauvais partout, surtout dans les forces armées. Si l'armée, la marine et l'aviation se disputent constamment, elles ne peuvent pas combattre efficacement. Nous devons nous assurer qu'elles s'entendent non seulement dans leurs bureaux, mais aussi sur le terrain."
JAP_ignite_japanese_patriotism: "Attiser le patriotisme japonais"
JAP_ignite_japanese_patriotism_desc: "Comme le dit l'adage, 'le patriotisme, c'est aimer son pays pour ce qu'il fait, le nationalisme, c'est aimer son pays quoi qu'il fasse.' Ce dernier est nuisible à beaucoup de gens, à la fois dans la nation et au-delà. Mais le premier, c'est ce que nous avons l'intention d'exploiter, et ce que nous utiliserons pour renforcer la volonté du peuple japonais !"

#Defeat Tree
JAP_defeat_enduring: "Endurer"
JAP_defeat_enduring_desc: "Notre nation n'a pas connu une telle humiliation depuis la fin de la Seconde Guerre mondiale. Des années de préparation ont été vaines. Taïwan a été perdu, et avec lui, une grande partie de notre dignité. Cependant, nous tenons encore debout, meurtris, blessés et plus isolés que nous ne le souhaiterions, mais nous endurerons."
JAP_defeat_challenge_chinese_dominance: "Défier la domination chinoise"
JAP_defeat_challenge_chinese_dominance_desc: "La Chine nous a peut-être abattus, mais elle ne nous a pas encore vaincus. Tant que le soleil brille sur la terre, nous défierons les Chinois avec audace. Le monde est plein d'opportunités pour les affaiblir, et nous les trouverons et les exploiterons."
JAP_defeat_unite_the_people: "Unir le peuple"
JAP_defeat_unite_the_people_desc: "La guerre de Taïwan a creusé un grand fossé entre notre peuple, et avec notre défaite, ce fossé s'est encore élargi. Si nous voulons sauver le Japon, nous devons commencer par rassembler tout le monde."
JAP_defeat_keep_an_eye_on_the_media: "Surveiller les médias"
JAP_defeat_keep_an_eye_on_the_media_desc: "Pendant toute la durée de la guerre de Taïwan, notre plus grand ennemi sur le front intérieur était les médias. Ils nous ont calomniés à chaque occasion, et maintenant ils nous ridiculisent. Bien que cela soit dans leurs droits, nous devons nous assurer qu'ils ne dépassent pas les bornes."
JAP_defeat_government_of_national_unity: "Gouvernement d'unité nationale"
JAP_defeat_government_of_national_unity_desc: "Un grand héros étranger a dit un jour : 'Une maison divisée contre elle-même ne peut pas tenir.' Nous l'avons vu pendant la guerre de Taïwan, où nos rivalités avec l'opposition ont pris le pas sur notre devoir envers la nation. Cela doit changer, nous devons fièrement franchir l'allée et travailler ensemble pour un avenir meilleur."
JAP_defeat_new_political_landscape: "Nouveau paysage politique"
JAP_defeat_new_political_landscape_desc: "Beaucoup pensaient que l'après-guerre de Taïwan conduirait le Parti libéral-démocrate à resserrer son emprise sur le Japon et à consolider tout le pouvoir. Mais ce n'est pas le cas, nous devons encourager la collaboration et favoriser de nouvelles idées si nous voulons guider notre nation vers l'avenir."
JAP_defeat_blame_the_opposition: "Blâmer l'opposition"
JAP_defeat_blame_the_opposition_desc: "La Coalition civile et les autres partis d'opposition ont utilisé tous les stratagèmes possibles pour diviser notre maison de l'intérieur. Nous étions si occupés à les combattre chez nous que nous ne pouvions pas combattre les Chinois à l'étranger. C'est à cause d'eux que nous avons perdu la guerre, et ils seront démasqués comme les traîtres qu'ils sont !"
JAP_defeat_constitutional_revisionism: "Révisionnisme constitutionnel"
JAP_defeat_constitutional_revisionism_desc: "Nos réformes de l'article 9 n'étaient pas suffisantes pour nous aider contre la Chine, et nous avons vu de première main les dommages que cela a causés à notre nation. Si nous voulons avoir une chance contre le dragon à l'avenir, l'article 9 doit être repensé et, à terme, supprimé."
JAP_defeat_rebuild_the_party: "Reconstruire le parti"
JAP_defeat_rebuild_the_party_desc: "Notre défaite contre la Chine a été l'un des plus grands coups portés à l'unité du PLD. De nombreux membres sont partis, et la désorganisation du parti a été pleinement exposée. L'aile conservatrice en particulier a subi le plus de dommages, avec plusieurs figures influentes formant une faction nationaliste. Le parti doit se débarrasser de son excès et être reconstruit pour être meilleur qu'avant."
JAP_defeat_calm_down_keiretsu: "Calmer les Keiretsu"
JAP_defeat_calm_down_keiretsu_desc: "La guerre contre la Chine a provoqué d'importantes répercussions dans l'économie japonaise, les Keiretsu étant les plus touchés. Leurs représentants ont affiché leur colère ouvertement, et si nous voulons remettre l'économie en ordre, la réconciliation avec eux est le point de départ."
JAP_defeat_strike_down_corruption: "Éradiquer la corruption"
JAP_defeat_strike_down_corruption_desc: "Le PLD est si grand que, inévitablement, la corruption a pu prospérer. Elle existe à tous les niveaux du gouvernement, et dans le cadre des réformes du parti, nous la combattrons. Le Japon sera gouverné équitablement !"
JAP_defeat_mobilization_of_bureaucracy: "Mobilisation de la bureaucratie"
JAP_defeat_mobilization_of_bureaucracy_desc: "Alors que nous continuons à faire face à l'une des pires crises de l'histoire de notre nation, le peuple semble faire tout son possible pour rendre notre tâche encore plus difficile. Bien que certains aient suggéré la loi martiale, ce serait un pas trop loin, et nous utiliserons plutôt toute l'étendue du gouvernement pour calmer les choses."
JAP_defeat_natural_party_of_power: "Parti naturel du pouvoir"
JAP_defeat_natural_party_of_power_desc: "Le Parti libéral-démocrate dirige le Japon presque sans interruption depuis 80 ans, et pour une bonne raison. Nous savons ce qui est le mieux pour le peuple japonais, et nous savons mieux que quiconque. Les autres partis font ce qu'ils veulent, mais ils ne nous battront jamais, car nous sommes le Japon."
JAP_defeat_declare_martial_law: "Déclarer la loi martiale"
JAP_defeat_declare_martial_law_desc: "La situation sur le terrain est devenue hors de contrôle, et les membres de la JSDF ont présenté un bon argument en faveur de la loi martiale. Bien que cela soit impopulaire, c'est temporaire et la meilleure option sur la table pour l'instant."
JAP_defeat_strengthening_national_security: "Renforcer la sécurité nationale"
JAP_defeat_strengthening_national_security_desc: "Les Chinois font certainement tout leur possible pour placer des espions et des traîtres parmi nous, et si nous ne pouvons pas les surveiller, nous sommes condamnés. Le peuple n'aura plus à vivre dans la peur des agitateurs communistes, la stabilité et la sécurité doivent prévaloir."
JAP_defeat_tightening_election_laws: "Renforcer les lois électorales"
JAP_defeat_tightening_election_laws_desc: "Les Chinois aimeraient certainement rien de plus que d'interférer dans nos élections, et nous devons nous assurer que cela n'arrive pas. Nous avons été bien trop laxistes dans la surveillance des bulletins jusqu'à présent, mais à partir de maintenant, ils seront étroitement surveillés, et toute personne soupçonnée de fraude sera punie."
JAP_defeat_party_as_state_instrument: "Le parti comme instrument de l'État"
JAP_defeat_party_as_state_instrument_desc: "Le PLD n'existe que comme un moyen pour atteindre une fin. Son but est d'aider les citoyens japonais, pas de consolider tout le pouvoir et de détourner le contrôle de l'État. Même les plus hauts responsables rendent des comptes à quelqu'un, et ce n'est pas différent ici."
JAP_defeat_party_over_state: "Le parti au-dessus de l'État"
JAP_defeat_party_over_state_desc: "Le Parti libéral-démocrate est effectivement le Japon, et en tant que tel, il a la priorité sur l'État. Le PLD sait ce qui est le mieux, et le Japon sera façonné à son image, d'une manière ou d'une autre."
JAP_defeat_capitalism_with_a_japanese_face: "Capitalisme à visage japonais"
JAP_defeat_capitalism_with_a_japanese_face_desc: "Les pays du monde interprètent le capitalisme différemment, et nous ne faisons pas exception. Alors que l'économie se redresse, il est de notre devoir de nous assurer qu'elle fonctionne en faveur du peuple japonais."
JAP_defeat_forced_nationalization: "Nationalisation forcée"
JAP_defeat_forced_nationalization_desc: "La mondialisation est un sujet complexe que même les économistes les plus compétents ne peuvent prétendre comprendre. Alors que la polarisation dans le monde continue de croître, nous devons prendre le contrôle de plus d'actifs corporatifs pour nous assurer qu'ils sont utilisés pour notre peuple."
JAP_defeat_suport_loyal_business: "Soutenir les entreprises loyales"
JAP_defeat_suport_loyal_business_desc: "Nous ne pouvons pas permettre à notre économie d'exister à l'autre bout du monde, elle doit rester ici, chez nous. Bien que ce soit une réalité malheureuse, la mondialisation est morte, et les entreprises loyales à la patrie seront grandement récompensées."
JAP_defeat_economic_inventory: "Inventaire économique"
JAP_defeat_economic_inventory_desc: "Nous avons perdu de nombreux actifs pendant la guerre de Taïwan, sans parler des biens que la Chine ne fabrique plus pour nous. Si nous voulons remettre l'économie dans le vert, nous devons faire l'inventaire de ce que nous pouvons utiliser et comment nous pouvons l'utiliser."
JAP_defeat_public_private_partnership: "Partenariat public-privé"
JAP_defeat_public_private_partnership_desc: "Nous n'avons pas à être des rivaux des corporations, et il est tout à fait possible pour nous de collaborer sur toutes sortes de sujets. Elles sont japonaises aussi, et ensemble, nous rendrons notre nation glorieuse !"
JAP_defeat_national_security_council: "Conseil de sécurité nationale"
JAP_defeat_national_security_council_desc: "Puisque nous ne sommes plus en position de protéger d'autres nations, nous devons nous assurer que toute notre attention est tournée vers la protection de notre peuple. Il y a des personnes compétentes en matière de sécurité intérieure, et elles seront placées dans un nouveau conseil, afin qu'aucun citoyen japonais n'ait à vivre dans la peur."
JAP_defeat_glorify_traditional_values: "Glorifier les valeurs traditionnelles"
JAP_defeat_glorify_traditional_values_desc: "Nous, au Japon, avons toujours défendu l'honneur, ne jamais abandonner et faire de son mieux. Ces valeurs sont nobles aujourd'hui, et elles le seront toujours. Nous devons nous assurer que personne n'oublie jamais ces idéaux, et ils doivent donc être ancrés dans la conscience publique pour les générations à venir."
JAP_defeat_unite_free_asia: "Unir l'Asie libre"
JAP_defeat_unite_free_asia_desc: "Notre défaite à Taïwan a montré aux nations de l'Asie libre toute l'ampleur de la menace chinoise. En tant que tel, le PDTO a reçu plusieurs nouvelles candidatures de nations qui craignent le dragon et veulent savoir qu'elles seront protégées. Parmi celles-ci, l'Inde est la plus notable, et la Nouvelle-Zélande sera également un membre précieux."
JAP_defeat_ardent_panasianism: "Pan-asianisme ardent"
JAP_defeat_ardent_panasianism_desc: "Si nous voulons avoir une chance de vaincre la Chine, nous devons nous tenir ensemble ! De New Delhi à Séoul, le monde asiatique doit s'unir sous un leadership efficace et faire face aux agresseurs chinois !"
JAP_defeat_utilize_anticommunism: "Utiliser l'anticommunisme"
JAP_defeat_utilize_anticommunism_desc: "Beaucoup de gens à travers le continent sont peu enthousiastes à l'idée de vivre dans une société communiste, et nous pouvons facilement en tirer parti. La peur rouge américaine a efficacement éliminé tous les communistes dans le pays pendant des décennies, et si nous pouvons recréer notre propre version contrôlée, nous pouvons grandement affaiblir l'influence chinoise."
JAP_defeat_united_armed_forces: "Forces armées unies"
JAP_defeat_united_armed_forces_desc: "L'une des raisons de notre défaite à Taïwan était l'incapacité de notre armée à travailler avec nos alliés. Nous avions une doctrine très différente de celle des Taïwanais, qui à leur tour avaient une doctrine très différente de celle des Australiens. Maintenant que nous avons encore plus d'alliés, nous devons unir nos forces armées sous un commandement centralisé pour avoir une chance contre les Chinois."
JAP_defeat_long_japanese_hand: "Longue main japonaise"
JAP_defeat_long_japanese_hand_desc: "Il y a encore des nations dans la région indo-pacifique qui n'ont pas choisi de camp, et ainsi, l'affrontement d'influence entre nous et la Chine a commencé. Nous les intégrerons dans notre giron, car les Chinois ne doivent pas être autorisés à trouver plus d'alliés !"
JAP_defeat_fund_taiwanese_resistance: "Financer la résistance taïwanaise"
JAP_defeat_fund_taiwanese_resistance_desc: "L'esprit combatif des Taïwanais ne connaît pas de limites, et les occupants chinois se retrouvent préoccupés par un important mouvement de partisans. Nous devons maintenir ces partisans actifs, plus le dragon a de distractions, mieux c'est."
JAP_defeat_collective_sovereignity: "Souveraineté collective"
JAP_defeat_collective_sovereignity_desc: "L'Asie ne sera jamais gouvernée par un seul maître, peu importe à quel point la Chine le souhaite. Bien que nous soyons le leader du PDTO, nous sommes égaux parmi toutes les autres nations du continent. Pour l'instant, et pour toujours, l'Asie sera libre !"
JAP_defeat_own_economic_sphere: "Propre sphère économique"
JAP_defeat_own_economic_sphere_desc: "La Chine n'étant plus une option pour un partenariat économique, nous devons nous rabattre sur les membres plus fiables de notre sphère économique. Nous avons encore beaucoup d'influence sur l'économie mondiale, et si nous jouons bien nos cartes, nous pouvons en obtenir encore plus."
JAP_defeat_forced_cooperation: "Coopération forcée"
JAP_defeat_forced_cooperation_desc: "Les Australiens sont notre premier et plus précieux allié dans le Pacifique. Nos économies sont plus liées que jamais, et le commerce entre nous est en plein essor. Nous sommes très enthousiastes à l'idée de travailler avec eux sur toutes sortes de projets, même s'ils ne le sont pas."
JAP_defeat_east_economic_autarky: "Autarcie économique de l'Est"
JAP_defeat_east_economic_autarky_desc: "L'Est a été soutenu par des pays du monde entier pendant trop longtemps. Nous vivons dans une ère où, que nous le voulions ou non, chacun doit se débrouiller seul. Nous ne pouvons pas permettre à notre économie de dépendre de quelqu'un d'autre, de peur que nous souffrions de leurs erreurs."
JAP_defeat_unifying_our_economies: "Unifier nos économies"
JAP_defeat_unifying_our_economies_desc: "Peu importe à quel point nous le souhaitons, nous ne pourrons jamais devenir totalement autosuffisants. Cependant, nous avons assez d'alliés avec des marchés suffisamment uniques pour que, avec beaucoup de planification et un peu de chance, nous puissions organiser les choses pour ne dépendre que les uns des autres."
JAP_defeat_forget_about_america: "Oublier l'Amérique"
JAP_defeat_forget_about_america_desc: "Bien que ce soit une vérité douloureuse à réaliser, les États-Unis n'existent plus. Ils se sont déchirés à cause d'une soi-disant 'guerre culturelle'. En tant que tel, à qui sommes-nous censés rembourser nos dettes ? Pour la durée de la deuxième guerre civile américaine, et potentiellement pour toujours, nous cesserons tous les paiements de dettes aux États-Unis."
JAP_defeat_international_community_assistance: "Aide de la communauté internationale"
JAP_defeat_international_community_assistance_desc: "Croyez-le ou non, il y a beaucoup de nations à travers le monde qui ne veulent pas voir une Asie dominée par la Chine. Nous sommes leur meilleur pari pour empêcher cela, et avec quelques petits sacrifices et de bonnes négociations, nous serons en mesure de obtenir un fort soutien international."
JAP_defeat_attract_labor_migrants: "Attirer les migrants travailleurs"
JAP_defeat_attract_labor_migrants_desc: "Le Japon vous veut ! Vous cherchez une meilleure vie à l'étranger, loin de chez vous ? Vous voulez découvrir la culture vibrante d'une nation riche et vivre tout ce qu'elle a à offrir ? Peu importe votre profession, il y a sûrement une opportunité d'emploi pour vous ici, au pays du Soleil Levant !"
JAP_defeat_consolidation_of_unstable_coalition: "Consolidation de la coalition instable"
JAP_defeat_consolidation_of_unstable_coalition_desc: "Beaucoup de membres de notre coalition sont indomptés et rebelles. Cependant, maintenant que nous reconstruisons notre image, la consolidation est à l'ordre du jour, et nous ramènerons ces partis errants à la maison."
JAP_defeat_harmonization_of_laws: "Harmonisation des lois"
JAP_defeat_harmonization_of_laws_desc: "Les partis au sein de notre coalition varient de gauche à droite et se disputent parfois entre eux. Si nous voulons apparaître comme un gouvernement fort et uni, nous devons forcer ces partis à bien jouer ensemble, qu'ils le veuillent ou non."
JAP_defeat_interparty_vertical: "Verticale interpartis"
JAP_defeat_interparty_vertical_desc: "Quiconque pense que tous les membres d'une coalition sont sur un pied d'égalité est un fou. En fin de compte, les partis avec lesquels nous sommes alliés ne sont là que pour obtenir plus de votes. Avec les récentes réconciliations et changements dans notre coalition, il est temps de rétablir la hiérarchie."
JAP_defeat_reconstruction_of_civil_society: "Reconstruction de la société civile"
JAP_defeat_reconstruction_of_civil_society_desc: "Nous sommes tous Japonais, et nous voulons tous ce qu'il y a de mieux pour notre nation. Bien que nous n'ayons pas l'intention de reconstruire la société de toutes pièces, nous pouvons certainement résoudre quelques problèmes pour mieux collaborer avec l'opposition, et la politique peut fonctionner plus harmonieusement."
JAP_defeat_media_monopoly: "Monopole des médias"
JAP_defeat_media_monopoly_desc: "Les médias continuent d'être une épine dans notre flanc, s'attaquant à chaque scandale sur lequel leurs mains avides peuvent trouver des preuves. Si nous voulons encourager la stabilité au Japon, nous devons nous assurer que les médias travaillent en notre faveur."
JAP_defeat_judicial_reform: "Réforme judiciaire"
JAP_defeat_judicial_reform_desc: "La branche judiciaire du gouvernement a fonctionné de manière assez indépendante pendant une grande partie de son histoire. Pendant longtemps, cela a bien fonctionné. Cependant, avec les saboteurs chinois et autres menaces étrangères, il est crucial que nous placions le département de la justice sous notre supervision directe."
JAP_defeat_constitutional_referendum: "Référendum constitutionnel"
JAP_defeat_constitutional_referendum_desc: "Notre constitution n'a subi qu'un seul petit changement en 80 ans d'histoire. Beaucoup plus a changé pendant cette période, et la constitution doit évoluer avec elle. Le changement le plus important, bien sûr, serait la suppression de l'article 9."
JAP_defeat_destroy_the_radicals: "Détruire les radicaux"
JAP_defeat_destroy_the_radicals_desc: "« Des clowns à ma gauche, et des jokers à ma droite » est une expression qui incarne parfaitement notre politique actuelle. D'un côté du spectre, vous avez les communistes qui ne s'arrêteront devant rien pour nous asservir à la Chine. De l'autre côté, vous avez les nationalistes dont le rêve ultime est la restauration de l'empire. Aucun de ces idéaux ne sera jamais autorisé à s'approcher du siège du Premier ministre."
JAP_defeat_resist_foreign_influence: "Résister à l'influence étrangère"
JAP_defeat_resist_foreign_influence_desc: "La Chine, la Russie, même la Corée du Nord, toutes ces nations et d'autres aimeraient rien de plus que de nous contrôler. Bien que nous nous trouvions plus isolés que nous ne l'avons été depuis des décennies à la suite de notre défaite dans la guerre de Taïwan, nous refusons de céder à la pression. Le Japon se tient debout, comme il l'a toujours fait !"
JAP_defeat_uncontested_civil_administration: "Administration civile incontestée"
JAP_defeat_uncontested_civil_administration_desc: "Si nous cédons à la pression de la JSDF, nous risquons de perdre notre démocratie. La Seconde Guerre mondiale est un excellent exemple de ce qui se passe lorsque l'armée a trop de pouvoir. Nous veillerons à ce qu'ils se concentrent sur ce qu'ils savent faire, défendre la nation, pas la diriger."
JAP_defeat_strengthen_JSDF_positions: "Renforcer les positions de la JSDF"
JAP_defeat_strengthen_JSDF_positions_desc: "La sécurité est une nécessité dans le monde d'aujourd'hui, et qui est bon en sécurité ? Eh bien, l'armée, bien sûr. Bien que nous ne leur remettions pas le gouvernement, nous renforcerons l'influence de la JSDF sur celui-ci, afin que nous n'ayons plus jamais à nous soucier de la sécurité de notre peuple."
JAP_defeat_russian_reconciliation: "Réconciliation avec la Russie"
JAP_defeat_russian_reconciliation_desc: "La Russie n'a jamais été proche de nous, mais entre eux et la Chine, le choix est évident. Eux aussi ont eu une histoire mouvementée avec la Chine, amis à un moment, ennemis au suivant. Nous sommes beaucoup plus fiables que les Chinois, et avec assez de temps, nous pourrons sûrement parvenir à un accord avec nos voisins du nord."

