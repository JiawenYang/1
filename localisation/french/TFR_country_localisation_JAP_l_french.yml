#Events
jap.1.t: "Premier cas de Covid confirmé"
jap.1.d: "Le Japon a confirmé son premier cas de pneumonie causée par un nouveau coronavirus en provenance de Chine, a annoncé le ministère de la Santé jeudi.\n\nUn ressortissant chinois dans la trentaine, résidant dans la préfecture de Kanagawa, a été testé positif au virus, selon le ministère. Il est revenu de Wuhan le 6 janvier et a été hospitalisé le 10 janvier, mais il s'est déjà rétabli et a quitté l'hôpital mercredi."
jap.1.a: "Oh non..."
jap.2.t: "Jeux olympiques 2020 reportés"
jap.2.d: "Alors que le nombre de personnes infectées par le Covid-19 augmente de jour en jour, le comité olympique international, en collaboration avec le gouvernement japonais, a discuté de l'action la plus appropriée à prendre, étant donné le risque que les Jeux olympiques deviennent un foyer de propagation de la maladie, mettant en danger les athlètes, les touristes et les citoyens japonais. Les deux parties ont annoncé le report des Jeux olympiques jusqu'à ce que le taux d'infections atteigne un niveau historiquement bas.\n\nCette nouvelle a suscité une déception mondiale, mais le gouvernement japonais a promis de tout mettre en œuvre pour que le Covid ne soit plus une menace."
jap.2.a: "La flamme sera transmise."
jap.3.t: "Les Jeux de la XXXIIe Olympiade commencent"
jap.3.d: "La pandémie de Covid a été généralisée et, alors que le nombre de personnes infectées augmente, la question de savoir s'il est judicieux d'organiser les Jeux olympiques se pose de plus en plus.\n\nLe gouvernement japonais et le comité olympique international ont longuement discuté de cette question et ont décidé de ne pas reporter les Jeux. Malgré les critiques croissantes de plusieurs experts en santé et d'autres nations contre cette décision, le comité et le Japon ont assuré que la santé restera la priorité absolue.\n\nAvec cette décision, les Jeux olympiques sont prêts à commencer, les athlètes du monde entier étant prêts à s'affronter, avec des mesures sanitaires poussées à l'extrême. Seul le temps dira si cela ne provoquera pas une flambée majeure."
jap.3.a: "Rien à craindre, profitez des jeux."
jap.4.t: "La question des Jeux olympiques"
jap.4.d: "Tout le monde sent que la longue période de paix ne durera pas éternellement. Nos amis américains traversent leurs propres luttes internes qui pourraient s'intensifier à tout moment, et la Chine regarde ses revendications avec des yeux avides.\n\nAvec l'augmentation des tensions mondiales, une nouvelle question se pose alors que la responsabilité d'accueillir les Jeux olympiques nous incombe. Nous pourrions, bien sûr, simplement les organiser et espérer favoriser l'esprit sportif parmi les peuples du monde, mais le risque que cela attise davantage les tensions persiste. Sans oublier le Covid-19, un virus qui nous a freinés pendant un certain temps, séparant les familles et nous obligeant à nous isoler. Avec autant de personnes dans une seule ville, un événement de super-propagation est possible.\n\nNous pourrions également annuler les Jeux, compte tenu des risques pour la sécurité et la santé. Il pourrait être préférable de ne pas donner plus de motifs à nos rivaux pour une agression politique.\n\nEn fin de compte, la décision a été prise :"
jap.4.a: "Malgré les risques, ils seront organisés."
jap.4.b: "Éteindre le feu, annuler les Jeux olympiques."
jap.5.t: "La formation du PDTO"
jap.5.d: "L'Organisation du Traité de Défense du Pacifique, ou PDTO, est formée alors que les tensions avec une Chine irrédentiste augmentent. Elle est fondée par deux nations, à savoir le Commonwealth d'Australie et l'État du Japon."
jap.5.a: "Nous devons défendre Taïwan !"
jap.6.t: "Le dernier éclat du crépuscule"
jap.6.d: "L'impensable s'est produit : l'un de nos plus grands alliés est plongé dans un état de conflit interne, voisin contre voisin, parent contre enfant, un continent entier plongé dans la violence.\n\nAvec chaque événement chaotique, les vautours commencent à tournoyer, et nous savons qu'avec la perte de nos bons amis américains, les Chinois regardent maintenant Taïwan avec des yeux avides, voyant la guerre civile comme une opportunité idéale pour finaliser leur conflit de longue date.\n\nL'Asie fera inévitablement face à la guerre également, malgré nos difficultés, nous ne pouvons pas abandonner Taïwan.\n\nNous ne sommes pas seuls, avec nos alliés restants, nous affronterons le dragon."
jap.6.a: "Préparez-vous au pire."
jap.7.t: "Le pays du soleil levant"
jap.7.d: "Depuis la fin de la Seconde Guerre mondiale, le Japon a traversé des périodes turbulentes, mais grâce à ses alliés à travers le monde et à sa volonté d'adaptation, le Japon a non seulement survécu, mais aussi prospéré.\n\nLes années 2020 n'ont pas été tendres avec nous, une population vieillissante et une armée tenue en laisse ne sont que quelques-uns des problèmes qui restent une épine dans notre flanc.\n\nAvec la démission de Shinzo Abe en vue, les nuages sombres qui s'amassent au-dessus du reste de l'Asie et les tensions croissantes parmi nos alliés occidentaux, seul le temps dira ce que ces nouvelles périodes turbulentes pourraient apporter. Un esprit clair et une volonté forte sont nécessaires pour s'assurer que nous ne serons pas plongés dans l'ombre."
jap.7.a: "Nous avons beaucoup de travail à faire."
jap.8.t: "La guerre de Taïwan"
jap.8.d: "La guerre civile américaine a indéniablement bouleversé le paysage géopolitique de l'Asie de l'Est, et pour le Japon, le défi le plus immédiat et pressant est la menace d'une invasion chinoise de Taïwan. En tant que nœud crucial de la première chaîne d'îles, Taïwan revêt une importance stratégique immense. Si elle tombe, non seulement le système de défense de la première chaîne d'îles serait rompu, mais le territoire japonais serait directement exposé à la menace militaire chinoise, entraînant un effondrement de l'équilibre des pouvoirs dans toute la région Asie-Pacifique.\n\nPour le gouvernement japonais, la chute de Taïwan serait non seulement une perte significative pour le camp démocratique, mais placerait également le Japon dans une position stratégiquement passive. Si la Chine contrôlait Taïwan, elle gagnerait un point d'appui stratégique vital, permettant à ses forces navales de se projeter plus loin dans le Pacifique, menaçant directement la ligne de vie maritime du Japon.\n\nPar conséquent, la seule option du Japon est d'intervenir dans le conflit de Taïwan et d'aider Taïwan à résister à l'invasion chinoise."
jap.8.a: "Nous vaincrons !"
jap.9.t: "Victoire !"
jap.9.d: "Après des semaines de batailles acharnées et avec la perte de nombreux hommes, la Chine s'est retirée de Taïwan.\n\nGrâce à nos efforts combinés, nous avons réussi à protéger l'île de l'agression chinoise, humiliant leurs années de propagande et de menaces.\n\nAlors qu'ils retournent chez eux en boitant, nous reconstruirons et exprimerons notre gratitude à nos alliés pour leur aide précieuse. Alors que nous pleurons ceux que nous avons perdus et nous prélassons dans la gloire de la victoire, la prise de conscience que ce ne sera peut-être pas la dernière fois que nous verrons l'agression chinoise commence à nous envahir.\n\nIls reviendront, mais maintenant nous serons prêts."
jap.9.a: "Gureto !"
jap.10.t: "Défaite honteuse"
jap.10.d: "Le feu du dragon était trop fort pour nous. Après des mois de guerre acharnée, le drapeau rouge de la République populaire flotte au-dessus de Taipei, un scénario que personne ne voulait imaginer.\n\nAvec nos blessures qui s'infectent et nos alliés désemparés, notre peuple à la maison est furieux des vies perdues, les veuves pleurent et les orphelins ne rentreront jamais chez eux. Une telle humiliation sera un lourd fardeau pour nos âmes collectives, un poids qui pourrait briser le tissu de la civilité dans notre nation.\n\nDéjà, des groupes expriment leur colère et leur frustration envers le gouvernement, [JAP_ldp_reelection_loc]\n\nAvec cette défaite, le Japon ne sera plus jamais le même."
jap.10.a: "Owari Da !"
jap.11.t: "L'Ukraine reconnaît les îles Kouriles du Sud comme japonaises"
jap.11.d: "La Verkhovna Rada d'Ukraine a adopté une résolution reconnaissant les îles Kouriles du Sud comme « le territoire du Japon occupé par la Russie », selon les données sur le site du parlement.\n\n« La Verkhovna Rada d'Ukraine déclare son soutien à la position du Japon concernant ses territoires du Nord ; elle reconnaît que ces territoires restent sous l'occupation de la Fédération de Russie », indique le texte du document. Dans le même texte, Kyiv a appelé la communauté internationale à prendre toutes les mesures possibles « pour formaliser légalement le statut des territoires du Nord du Japon. »"
jap.11.a: "Hein ?"
jap.12.t: "Intrus aux Game Awards"
jap.12.d: "Les Game Awards, malgré un changement de lieu et de calendrier imprévu, ont tout de même surpris avec de nombreuses annonces, bandes-annonces et récompenses. Cependant, le moment le plus inattendu et fou s'est produit à la toute fin de l'événement : juste après la présentation du « Jeu de l'année » Elden Ring, les Taïwanais ont été nominés depuis la scène.\n\n« Hé, Motto. Pour de vrai, je veux dire que pour ce prix, je veux nominer ce prix à mes amis de Taïwan, gardez Taïwan libre ! » a retenti depuis la scène immédiatement après les mots des développeurs d'Elden Ring.\n\nSelon le directeur exécutif et organisateur du spectacle, Geoff Keighley, le jeune homme a été arrêté pour des démarches ultérieures. Apparemment, il n'a été accusé de rien."
jap.12.a: "Gardez l'esprit fort !"
jap.13.t: "Shinzo Abe démissionne"
jap.13.d: "Shinzo Abe a annoncé vendredi qu'il quittait son poste en raison de la détérioration de sa santé. Les discussions sur son état de santé se sont intensifiées lorsqu'il s'est rendu pour la deuxième fois en une semaine dans un hôpital de Tokyo lundi. Abe souffre depuis longtemps de colite ulcéreuse.\n\nIl faudra deux à trois semaines pour choisir un nouveau chef de parti. Le vainqueur devra être officiellement élu par un vote parlementaire et servira comme premier ministre pour le reste du mandat d'Abe, c'est-à-dire jusqu'en septembre 2021."
jap.13.a: "Reposez-vous, patriote..."
jap.14.t: "Yoshihide Suga élu Premier ministre"
jap.14.d: "Yoshihide Suga, leader du Parti libéral-démocrate du Japon, a été élu nouveau chef du gouvernement du pays. Sa candidature a été soutenue par une majorité de députés à la Chambre des représentants. Au total, 314 députés sur 465 ont voté en faveur du nouveau premier ministre."
jap.14.a: "Est-il un digne successeur ?"
jap.15.t: "Élection à la direction du LDP"
jap.15.d: "Les élections internes du LDP battent leur plein, les membres du parti se serrent la main et font des promesses apaisantes, sollicitant des faveurs et élargissant leurs propres cercles, mais dans cette arène politique, seuls deux candidats se sont imposés comme des figures imposantes.\n\nLe premier est Fumio Kishida, un centriste bien connu qui maintient une certaine stabilité dans la politique interne du LDP, attirant les membres du parti des deux côtés du spectre et ayant l'idée du maintenant nommé « Nouveau capitalisme » qui vise à alléger les fardeaux de la classe moyenne, rendant la vie plus équitable pour eux et, en retour, les incitant à contribuer à l'économie.\n\nL'autre, Taro Kono, est considéré comme un libéral au sein et à l'extérieur du LDP. Il vise à réévaluer les trois flèches de Shinzo Abe et à verdir le Japon, souhaitant réduire le nombre de centrales nucléaires en faveur des énergies renouvelables, aimé par le peuple mais le mépris d'une bonne partie des membres du LDP à son égard est difficile à ignorer.\n\nNéanmoins, les votes sont comptés, avec des oreilles attentives, le parti écoute les résultats."
jap.15.a: "Fumio Kishida"
jap.15.b: "Taro Kono"
jap.16.t: "Les élections générales approchent !"
jap.16.d: "Après des semaines de campagne, d'insultes et de petits scandales, les élections atteignent leur apogée, l'opposition et le LDP donnant tout pour rallier le plus de votants possible de leur côté.\n\nBien qu'il soit prévu que la participation électorale soit faible, il y a encore assez de personnes qui se déplacent pour voter pour leur parti préféré. Le LDP mise sur l'expérience, des promesses de stabilité et de certitude, tandis que l'opposition assure qu'il y aura un véritable changement, du progrès et du renouveau. Avec la fin des débats passionnés et les votes exprimés, c'est finalement au peuple de décider qui sortira vainqueur."
jap.16.a: "Il est temps de changer !"
jap.16.b: "Maintenons la stabilité !"
jap.17.t: "Le LDP gagne !"
jap.17.d: "À la surprise de personne, la domination politique du LDP est maintenue, les votes comptés ayant déclaré le LDP vainqueur.\n\nLes réactions aux résultats sont mitigées, certains sont déçus tandis que d'autres sont heureux que le Japon reste sur une voie stable de certitude. Déjà, la coalition civile a exprimé son dévouement à s'élargir et à faire campagne pour les prochaines élections."
jap.17.a: "Comme toujours."
jap.18.t: "La Coalition Civique gagne !"
jap.18.d: "À la surprise générale, la domination politique du LDP a été stoppée. La coalition, composée de toutes sortes de membres de l'opposition, a tout donné pendant la campagne, et ces efforts ont porté leurs fruits.\n\nBien qu'il y ait des réactions mitigées à ce sujet, il y a aussi beaucoup d'optimisme pour l'avenir, la stagnation est terminée et avec cela, le nouveau peut arriver."
jap.18.a: "Espérons qu'ils restent unis."
jap.19.t: "Formation de la Coalition Civique"
jap.19.d: "Il était inévitable que le LDP se trouve face à un adversaire de taille dans la grande arène politique. La coalition civile est un regroupement de membres de l'opposition qui se sont unis pour mettre fin à l'emprise de fer du LDP sur le paysage politique japonais.\n\nBien que très jeune et quelque peu non conventionnelle dans ses méthodes, la coalition civile a réussi à rassembler suffisamment de soutien pour devenir une menace crédible pour le LDP. Avec les élections qui approchent, cela pourrait changer la donne."
jap.19.a: "Amateurs."
jap.20.t: "Kinmen libéré"
jap.20.d: "Ce matin, nous avons reçu des rapports de première ligne confirmant qu'après une offensive acharnée de nos forces, nous avons finalement repris l'île de Kinmen. Bien que la garnison de l'ALP nous ait infligé des dommages importants en utilisant leurs fortifications défensives, ils ont finalement été submergés par notre supériorité numérique. Les principales installations militaires et centres de commandement de l'île sont maintenant sous le contrôle des Forces d'auto-défense.\n\nAvec l'île de Kinmen, une position stratégique clé, maintenant fermement sous notre contrôle, les villes et les lignes d'approvisionnement chinoises sont à portée de notre artillerie. Nous sommes désormais en mesure d'exercer une pression sur les routes d'approvisionnement de l'ALP, créant un avantage pour nos forces sur les lignes de front."
jap.20.a: "Banzai !"
jap.21.t: "L'opération Kinmen échoue"
jap.21.d: "Ce matin, nous avons reçu des rapports de première ligne indiquant que, malgré nos efforts pour renforcer notre position sur l'île de Kinmen, y compris en lançant des frappes aériennes et des bombardements d'artillerie pour percer les défenses de l'ALP, toutes les tentatives ont échoué.\n\nSous les attaques surprises et les manœuvres de flanc de l'ALP, nos forces ont subi de lourdes pertes. De plus, nos renforts et lignes d'approvisionnement ont été coupés par les frappes de l'ALP, empêchant tout soutien supplémentaire. Le moral sur les lignes de front s'est détérioré, et les pénuries de munitions ont encore paralysé nos forces. Après l'échec de l'assaut final, nous avons été forcés de nous retirer de l'île de Kinmen."
jap.21.a: "Exposition honteuse."
jap.22.t: "Le Vietnam envoie une contre-offre"
jap.22.d: ""
jap.22.a: "Nous devons contenir l'agression chinoise !"
jap.22.b: "Absolument pas."
jap.23.t: "Choix du Premier ministre"
jap.23.d: "Alors que l'élection se termine, nous avons l'opportunité inestimable de former un nouveau cabinet. Cela marque un changement profond dans le paysage politique de longue date du Japon et l'occasion de réaliser les promesses faites à nos citoyens par la Coalition Civique.\n\nLe nouveau Premier ministre sera choisi parmi les leaders qui nous ont conduits à la victoire, et pour la Coalition Civique, ce leader est l'honorable Yukio Edano. Né dans une famille de la classe ouvrière à Utsunomiya, préfecture de Tochigi, la détermination d'Edano à poursuivre une carrière politique a commencé dès son plus jeune âge. Après avoir étudié le droit, il s'est présenté à la Chambre des représentants en tant que candidat du Parti Nouveau Japon, entamant un parcours politique difficile mais distingué.\n\nAlternativement, la Coalition Civique pourrait choisir une figure plus radicale du spectre politique. Kazuo Shii, un politicien expérimenté et leader de longue date du Parti communiste japonais, a occupé plusieurs postes clés, y compris secrétaire général, chef du comité exécutif et président du JCP. Après des décennies de lutte parlementaire, Shii et le JCP voient maintenant une lueur d'espoir pour former un gouvernement, rendant la perspective du socialisme au Japon à portée de main. Cependant, cela pourrait également déclencher des troubles sociaux généralisés, menaçant la stabilité de l'administration actuelle.\n\nEn fin de compte, le moment est venu de décider : qui dirigera le nouveau gouvernement du Japon avant les prochaines élections générales ? Qui assumera la tâche monumentale de démanteler les vestiges du Parti libéral-démocrate et de revitaliser les normes sociétales ?"
jap.23.a: "Edano se rendra au Palais impérial, où il recevra la nomination de Sa Majesté."
jap.23.b: "Shii se rendra au Palais impérial, où il recevra la nomination de Sa Majesté."
jap.24.t: "Choix du ministre des Affaires étrangères"
jap.24.d: "Alors que l'élection se termine, nous avons l'opportunité inestimable de former un nouveau cabinet. Cela marque un changement profond dans le paysage politique de longue date du Japon et l'occasion de réaliser les promesses faites à nos citoyens par la Coalition Civique.\n\nLe nouveau ministre des Affaires étrangères représentera un changement dans le paysage politique du Japon. Au sein de la Coalition Civique, deux perspectives distinctes émergent sur le candidat à ce poste.\n\nD'un côté, la faction de droite du DPP soutient Yuichiro Tamaki, un ancien bureaucrate financier. Tamaki prône le renforcement des alliances de sécurité avec les pays partageant des valeurs traditionnelles et des intérêts mutuels, tout en adoptant une ligne dure envers les concurrents régionaux en Asie de l'Est.\n\nDe l'autre côté, la faction de gauche, représentée par le JCP, nomme Akira Kasai. Diplômé de l'Université de Tokyo et défenseur d'une diplomatie pacifique, Kasai promet de réduire les tensions diplomatiques du Japon, de renforcer les liens avec les pays voisins et de faire avancer un front uni face aux problèmes régionaux.\n\nMalgré ces points de vue divergents, le moment est venu de décider : qui guidera la politique étrangère du Japon avant les prochaines élections générales et renforcera la position mondiale de la nation ?"
jap.24.a: "Nommer Kasai."
jap.24.b: "Nommer Tamaki."
jap.25.t: "Choix du ministre de l'Économie"
jap.25.d: "Alors que l'élection se termine, nous avons l'opportunité inestimable de former un nouveau cabinet. Cela marque un changement profond dans le paysage politique de longue date du Japon et l'occasion de réaliser les promesses faites à nos citoyens par la Coalition Civique.\n\nLe nouveau ministre de l'Économie, du Commerce et de l'Industrie devra relever un défi de taille, nécessitant un processus de sélection minutieux et délibéré. Au sein de la Coalition Civique, les recommandations de candidats diffèrent fortement.\n\nD'une part, Mizuho Fukushima, leader du SDP, prône des politiques axées sur les biens de consommation, la sécurité alimentaire et l'expansion des initiatives de bien-être social. D'autre part, Ichiro Matsui de Nippon Ishin no Kai, originaire d'Osaka, apporte une forte saveur locale. Bien que critiqué pour son style autocratique, Matsui est loué pour avoir promu le commercialisme à travers le Japon.\n\nDe plus, la faction de gauche de la Coalition Civique suggère Kazuo Shii du JCP comme candidat, estimant qu'il mènera une transformation socialiste de l'économie et éliminera l'influence des grandes entreprises.\n\nEn fin de compte, il est temps de décider : qui guidera la politique économique du Japon avant les prochaines élections et assurera sa prospérité continue ?"
jap.25.a: "Nommer Fukushima."
jap.25.b: "Shii occupera ce poste."
jap.25.c: "Nommer Matsui."
jap.26.t: "Choix du ministre de l'Intérieur"
jap.26.d: "Alors que l'élection se termine, nous avons l'opportunité inestimable de former un nouveau cabinet. Cela marque un changement profond dans le paysage politique de longue date du Japon et l'occasion de réaliser les promesses faites à nos citoyens par la Coalition Civique.\n\nLe ministre des Affaires intérieures et des Communications jouera un rôle clé dans la formation du système administratif du Japon et des politiques d'autonomie locale. Au sein de la Coalition Civique, les opinions divergent sur qui devrait occuper ce poste critique.\n\nLes modérés de la coalition soutiennent Kenta Izumi du CDP, arguant qu'il représenterait mieux les intérêts du parti au pouvoir. Ils estiment qu'Izumi pourrait faire avancer des politiques visant à réduire les disparités de classes au Japon, promouvoir des valeurs humanistes et favoriser un développement durable.\n\nEn revanche, les factions plus radicales ont nommé Mari Kushibuchi de Reiwa Shinsengumi. Connue pour son approche populiste, Kushibuchi prône une série d'agendas divers, y compris la libéralisation de l'économie et de l'éducation, ainsi que la réévaluation de la position de la politique étrangère du Japon.\n\nLa décision doit maintenant être prise : qui mènera la réforme administrative du Japon et protégera sa démocratie avant les prochaines élections générales ?"
jap.26.a: "Nommer Kushibuchi."
jap.26.b: "Nommer Izumi."
jap.27.t: "Choix du ministre du Renseignement"
jap.27.d: "Alors que l'élection se termine, nous avons l'opportunité inestimable de former un nouveau cabinet. Cela marque un changement profond dans le paysage politique de longue date du Japon et l'occasion de réaliser les promesses faites à nos citoyens par la Coalition Civique.\n\nLe président de la Commission nationale de la sécurité publique exerce une influence significative au sein du Cabinet japonais. Ce rôle supervise les agences de police du pays et dirige les opérations de sécurité et de renseignement. En conséquence, une compétition intense a émergé au sein de la Coalition Civique pour savoir qui devrait être nommé à ce poste critique.\n\nUn candidat de premier plan est Akira Nagatsuma du CDP. Connu pour ses politiques modérées, Nagatsuma est un bureaucrate expérimenté avec une solide expérience dans les comités des affaires étrangères et de la sécurité de la Diète. Il prône une approche progressive mais ferme pour traiter avec les « régimes hostiles ».\n\nAlternativement, Akira Koike du JCP est également en lice. En tant que secrétaire général actuel du JCP et ancien médecin, Koike est très respecté au sein de son parti. Il est particulièrement vocal sur des questions telles que la liberté d'Internet et des médias, et ses avertissements selon lesquels « l'anti-communisme ramènera le Japon à l'agression » ont suscité un débat généralisé.\n\nLe moment est venu de prendre une décision : qui assurera la sécurité du Japon et préservera sa précieuse paix avant les prochaines élections ?"
jap.27.a: "Nommer Koike."
jap.27.b: "Nommer Nagatsuma."
jap.28.t: "Chute du LDP"
jap.28.d: "Les roues de l'histoire tournent et, avec la victoire de la coalition civile, beaucoup de saletés enfouies concernant le LDP ont été révélées.\n\nAllant des cas de harcèlement enterrés, de la corruption, des liens avec l'Église de l'Unification et du refus intentionnel de devoirs. Avec de plus en plus de rapports inondant les nouvelles et la coalition civile victorieuse profitant de la situation.\n\nCela a causé une diminution significative de l'influence et du prestige du LDP, avec plusieurs figures clés sous un examen minutieux et des arrestations potentielles, l'avenir du LDP est sombre."
jap.28.a: "Le colosse vaincu."
jap.29.t: "Budgétisation de l'État"
jap.29.d: "Les récents débats de la coalition civile sur le budget de l'État ont mis en lumière une question cruciale et controversée : devons-nous donner la priorité aux personnes ou à la réparation de l'économie ?\n\nLes partis de gauche dans la Coalition Civique défendent avec ferveur l'idée de « donner la priorité aux personnes ». Ils plaident pour un financement accru des programmes sociaux, des soins de santé et de l'éducation, soulignant le besoin urgent de soutenir les plus vulnérables.\n\nEn revanche, divers partis de droite dans la coalition soutiennent qu'une économie forte doit primer. Ils affirment qu'une économie prospère est le meilleur moyen de créer des opportunités pour tous, ce qui, en fin de compte, bénéficiera aux personnes mêmes que la gauche cherche à soutenir."
jap.29.a: "Les gens d'abord"
jap.29.b: "Aidons d'abord notre économie"
jap.30.t: "La Coalition Civique se consolide autour des socialistes"
jap.30.d: "Après la victoire de la Coalition Civique aux élections, certains membres du Parti démocrate constitutionnel ont réalisé que compter uniquement sur leurs propres forces ne suffirait pas pour sécuriser leur position. Ils devaient former des alliances avec d'autres partis d'opposition pour gagner un avantage dans l'arène politique. Les partis de gauche au Japon disposent d'une large base populaire et de fortes capacités d'organisation et de mobilisation. Malgré les différences idéologiques entre le CDP et les partis de gauche, ils partagent des points communs sur certaines questions politiques, telles que le bien-être social et la protection de l'environnement, offrant une opportunité de coopération.\n\nÀ la suite d'une série de négociations et de discussions, le CDP, le Parti communiste, Reiwa Shinsengumi et le SDP ont atteint un consensus et décidé d'établir une alliance politique. Cette décision a immédiatement suscité un tollé public. Les partisans y ont vu un progrès pour la politique démocratique du Japon, tandis que les voix d'opposition étaient tout aussi fortes. Certains craignaient que l'influence des partis de gauche ne croisse progressivement et ne finisse par menacer le système démocratique du Japon. D'autres se demandaient si deux partis avec des différences idéologiques aussi marquées pouvaient vraiment coopérer ou si l'alliance se transformerait en un cas de « compagnons de lit étranges ».\n\n« C'est comme un mariage politique », a déclaré un analyste politique anonyme. « Les deux parties se sont réunies avec leurs propres objectifs, et il reste à voir si elles pourront maintenir l'alliance à long terme. »"
jap.30.a: "Révolution par le bulletin de vote"
jap.31.t: "La Coalition Civique se consolide autour des libéraux"
jap.31.d: "Après la victoire de la Coalition Civique aux élections, certains membres du Parti démocrate constitutionnel ont réalisé que compter uniquement sur leurs propres forces ne suffirait pas pour sécuriser leur position. Ils devaient former des alliances avec d'autres partis d'opposition pour gagner un avantage dans l'arène politique. Actuellement, le CDP collabore activement avec le Parti de l'Innovation, qui représente des politiques réformistes et centristes, ainsi qu'avec le Parti démocrate pour le peuple.\n\nLors d'une conférence de presse, le leader du CDP a déclaré que la coopération avec le Parti de l'Innovation et le DPP repose sur des idéaux et des objectifs politiques communs. Il a souligné que les trois partis sont engagés à promouvoir la réforme politique au Japon, à améliorer le bien-être des citoyens et à défendre la justice sociale et l'équité. Il a également noté que ce partenariat n'est pas une simple alliance politique, mais un moyen de mieux répondre aux attentes du public et de créer un avenir meilleur pour le Japon.\n\nCependant, cette stratégie de « chevauchement des deux côtés » a suscité un scepticisme et une controverse considérables. Certains commentateurs soutiennent qu'il existe des différences idéologiques entre le CDP, le Parti de l'Innovation et le DPP, notamment sur des questions comme la réforme constitutionnelle et la politique fiscale. Il reste à voir si cette coopération « en patchwork » peut véritablement atteindre une coordination et une unité politique."
jap.31.a: "La liberté enfin"
jap.33.t: "Assassinat du Premier ministre du Japon"
jap.33.d: "Sainte horreur !"
jap.33.a: "Horreur... oh horreur !"
jap.34.t: "Coup d'État militaire"
jap.34.d: ""
jap.34.a: "Rétablissons l'ordre d'une main de fer"
jap.35.t: "Formation du Front démocratique uni"
jap.35.d: ""
jap.35.a: "Un groupe de terroristes !"
jap.36.t: "Sapporo sous le contrôle du FDU !"
jap.36.d: ""
jap.36.a: "Faisons de notre mieux !"
jap.36.b: "Mobilisons les conscrits !"
jap.37.t: "La révolution se propage !"
jap.37.d: ""
jap.37.a: "Youpi !"
jap.38.t: "La révolution ne peut être arrêtée !"
jap.38.d: ""
jap.38.a: "Cool !"
jap.39.t: "Troupes mobilisées !"
jap.39.d: ""
jap.39.a: "Préparez-vous à avancer vers le nord !"
jap.40.t: "Début de la guerre civile"
jap.40.d: ""
jap.40.a: "Écrasez les traîtres communistes !"
jap.41.t: "IIe Congrès du FDU (Extraordinaire)"
jap.41.d: ""
jap.41.a: "Cool"
jap.42.t: "Nous avons gagné !"
jap.42.d: ""
jap.42.a: "Cool"
jap.43.t: "Nous avons gagné !"
jap.43.d: ""
jap.43.a: "Cool"
jap.44.t: "Remaniement du gouvernement"
jap.44.d: "Pour éviter la stagnation et l'accumulation de toiles d'araignée historiques dans notre gouvernement, nous avons pris l'initiative de remanier les postes du cabinet. Le 100e cabinet est un cabinet composé d'esprits nouveaux et dynamiques, prêts à aller plus loin pour le peuple japonais. La réception publique à cet égard a été positive.\n\nAvec la roue de notre politique remplacée par quelque chose de plus dynamique, nous sommes destinés à de grandes choses."
jap.44.a: "Bien."
jap.45.t: "Dissolution de la Coalition Civique"
jap.45.d: "Après beaucoup de conflits politiques, la coalition civile a été dissoute, trop de luttes internes et trop peu d'attention portée à leur rival commun, le LDP, ce qui a permis à ce dernier d'exploiter leurs querelles internes.\n\nFinalement, plusieurs figures clés ont publiquement exprimé leur mépris envers les autres membres, annonçant qu'ils se sépareraient de la coalition pour tracer leur propre chemin dans le paysage politique japonais. Cependant, face au géant qu'est le LDP, leurs carrières semblent infructueuses.\n\nDans tous les cas, cela a garanti la domination continue du LDP sur le Japon, non pas par tyrannie, mais par la pure incompétence de ses rivaux."
jap.45.a: "Ne jamais interrompre quelqu'un qui fait une erreur."
jap.46.t: "Pacte de non-agression avec le Japon"
jap.46.d: "Le Japon souhaite conclure un pacte de non-agression, il serait insensé de refuser une telle opportunité."
jap.46.a: "Nous acceptons"
jap.47.t: "L'héritage des protestations d'Anpo"
jap.47.d: "Nous ne respectons pas les Américains"
jap.47.a: "Cool"
jap.48.t: "Une Amérique divisée"
jap.48.d: "La situation à laquelle notre gouvernement est actuellement confronté est comparable à un mouvement décisif dans la phase finale d'une partie de shogi, où les deux côtés sont sur le point de faire un coup crucial. Une fois le roi acculé, la moindre erreur pourrait entraîner une série d'attaques décisives de l'ennemi.\n\nSoutenir le gouvernement constitutionnel dirigé par Trump semble être le choix naturel pour continuer les politiques existantes. Cependant, bien que le gouvernement constitutionnel bénéficie du soutien des États agricoles et de la majorité des conservateurs, il est désavantagé dans les secteurs industriels et technologiques. Ce choix peut être comparé à une position défensive apparemment stable mais finalement faible dans une partie de shogi.\n\nD'autre part, soutenir le gouvernement Biden basé à Washington D.C. ressemble à un coup tactique brillant dans le shogi - risqué en surface, mais stratégiquement axé sur la vision d'ensemble. Le gouvernement Biden contrôle le centre politique de l'Amérique, les principales industries technologiques et la plupart des institutions financières, qui sont toutes cruciales pour maintenir l'influence mondiale des États-Unis. Bien qu'ils puissent faire face à des risques à court terme, à long terme, ils peuvent nous aider à obtenir plus de poids diplomatique.\n\nNéanmoins, quelle que soit la décision, agir prématurément pourrait entraîner un retour de bâton, tandis que retarder l'action pourrait conduire à des opportunités stratégiques manquées. Le timing de nos mouvements déterminera finalement le succès ou l'échec de cette stratégie."
jap.48.a: "Nous soutenons l'Union de l'Amérique"
jap.48.b: "Nous soutenons le gouvernement constitutionnel"
jap.49.t: "Le Japon nous soutient"
jap.49.d: ""
jap.49.a: "Cool"
jap.50.t: "Le Japon a envoyé des armes"
jap.50.d: "Le ministère de la Défense rapporte que le gouvernement japonais a commencé à fournir des armes défensives à notre camp, y compris des systèmes de défense aérienne et des équipements de guerre électronique. Le premier lot de matériel est arrivé au port désigné aujourd'hui.\n\nLes chefs militaires ont exprimé une grande satisfaction à l'égard de ces équipements, déclarant qu'avec eux, nos capacités de combat peuvent être encore renforcées."
jap.50.a: "Bien, très bien."
jap.51.t: "Le Japon a envoyé de l'argent"
jap.51.d: "Le Ministère des Finances rapporte que le gouvernement japonais a fourni plusieurs fonds d'aide à notre camp par le biais de canaux officiels. Ces fonds seront utilisés pour la reconstruction de nos infrastructures et pour assurer le bien-être de nos citoyens.\n\nLe Ministre des Finances a exprimé une grande satisfaction, déclarant qu'avec ces fonds, un élan puissant peut être injecté dans notre développement économique."
jap.51.a: "Bien, très bien."
jap.52.t: "Le Japon a envoyé des volontaires"
jap.52.d: "Le Ministère de la Défense rapporte qu'un groupe de conseillers techniques composé de membres retraités des Forces japonaises d'autodéfense est arrivé dans notre pays. Cette force de plusieurs centaines de volontaires nous assistera dans l'entraînement militaire et l'orientation technique."
jap.52.a: "Bien, très bien."
jap.52.b: "Bien, très bien."
jap.53.t: "Le Japon promet de nous protéger"
jap.53.d: "Le Ministère des Affaires étrangères rapporte que le Premier ministre japonais a officiellement annoncé aujourd'hui lors d'une conférence de presse conjointe un engagement de protection de la sécurité pour notre pays. \n\nDe plus, les médias locaux japonais ont confirmé que cette déclaration a reçu le soutien du Cabinet et du Parlement japonais."
jap.53.a: "Bien, très bien."
jap.54.t: "Une scission au sein du gouvernement"
jap.54.d: "Les libéraux ont réussi"
jap.54.a: "Pas cool"
jap.55.t: "Une scission au sein du gouvernement"
jap.55.d: "Les socialistes ont réussi"
jap.55.a: "Pas cool"
jap.56.t: "Le Japon lance une guerre de l'information contre nous !"
jap.56.d: "Depuis que nous avons lancé des efforts pour l'unification du détroit de Taiwan, le nombre d'incidents de sécurité à l'intérieur de notre nation a considérablement augmenté. Cette augmentation peut en partie être attribuée aux tensions de guerre et au contrecoup des mesures de contrôle strictes. Cependant, des agents du Ministère de la Sécurité d'État ont découvert un nombre surprenant de cas d'espionnage présumé. Après une enquête et une analyse approfondies, nous avons confirmé que ces activités sont orchestrées par nos 'vieux amis' du Bureau de renseignement du Cabinet et du Quartier général du renseignement de la Défense du Japon.\n\nLes agences de renseignement japonaises comprennent qu'elles ne peuvent pas compter uniquement sur la force militaire pour nous affronter sur le champ de bataille. Au lieu de cela, elles ont recours à des stratégies visant à déstabiliser notre ordre social pour affaiblir le soutien public à la guerre. De nombreux incidents témoignent de l'audace de leurs opérations clandestines. Par exemple, les travailleurs d'une usine de composants de drones à Shenzhen ont récemment organisé une grève massive, qui a nécessité des mois de négociations et d'ajustements de personnel de la part du gouvernement de la ville pour être résolue. De plus, des photos de première ligne et de prétendues vidéos de 'pertes au combat de l'APL' - réelles et fabriquées - ont été largement diffusées sur des plateformes de médias sociaux telles que WeChat, Weibo, QQ et Bilibili. Gérer ces individus n'est pas particulièrement difficile. Cependant, le vrai problème réside dans le volume des activités hostiles, la rapidité avec laquelle elles se produisent et la nature insaisissable de leurs commanditaires."
jap.56.a: "Nous aurions dû nous en douter !"
jap.57.t: "Le Japon lance de vastes exercices militaires du PDTO"
jap.57.d: ""
jap.57.a: "Nous y participerons"
jap.58.t: "Prise de Sakhaline"
jap.58.d: ""
jap.58.a: "Pour l'Empereur !"
jap.58.b: "Et risquer la guerre avec la Russie ?"
jap.58.c: "Nous ne pouvons pas risquer la guerre avec les Japonais maintenant..."
jap.58.e: "Nous ne perdrons plus jamais de territoire russe !"
jap.60.t: "Fierté de la flotte coulée"
jap.60.d: "C'était un matin parfait, avec le soleil de Tokyo qui filtrait depuis le mont Fuji sur le plateau d'Ichigaya. Le drapeau du soleil levant au sommet du bâtiment du Ministère de la Défense flottait doucement dans la brise matinale, produisant un léger bruissement. Le chef d'état-major de la marine venait de préparer son thé vert quotidien indispensable près de la fenêtre du bureau, avec de la vapeur s'élevant gracieusement de la tasse.\n\nIl contemplait le paysage, se sentant exceptionnellement détendu. Le rapport d'exercice de la veille avait indiqué que le nouveau navire de guerre était en bon état, et la météo d'aujourd'hui était idéale pour une nouvelle série d'entraînements. L'arôme du thé emplissait la lumière du matin, rendant tout parfait.\n\nSoudain, les pas de l'officier des communications résonnèrent brusquement dans le couloir, beaucoup plus vite que d'habitude. Après avoir frappé à la porte, l'officier lui a remis un rapport de bataille nouvellement reçu. Le rapport était mince, ne contenant que quelques lignes de texte. Debout près de la fenêtre avec une lumière abondante, l'écriture était clairement visible : Navire de guerre coulé, lourdes pertes."
jap.60.a: "Un jour sombre pour la nation..."
jap.61.t: "La famille impériale tuée dans une attaque nucléaire"
jap.61.d: "Les guerres sont toujours portées à leur paroxysme, connaissant les limites et les chemins à emprunter. Et les chemins que l'on ne devrait pas fouler.\n\nLa Chine a lancé une attaque nucléaire sur Tokyo, des évacuations avaient déjà été faites et des abris ouverts, mais les dégâts causés à la ville ont été immenses.\n\nAprès que le champignon atomique se soit élevé au-dessus de la ville, les forêts ont été incendiées et les bâtiments réduits en gravats, une révélation choquante a été faite. La famille impériale, un symbole qui représente le Japon à son apogée, a malheureusement été tuée dans cette attaque, les évacuations ont été trop chaotiques pour que la famille puisse s'échapper à temps, aux côtés de leur peuple.\n\nAvec une nouvelle aussi dévastatrice, et la destruction qui s'est abattue sur Tokyo, il ne reste plus beaucoup de compassion dans le cœur du Japon, à la place elle est remplacée par la haine."
jap.61.a: "'Avec ma mort, je m'excuse humblement auprès de l'Empereur pour ce grand crime.'"
jap.62.t: "Manifestations pro-paix"
jap.62.d: "Alors que Kimura Haruki sortait de la porte est de la gare de Shinjuku, le soleil couchant descendait lentement derrière les murs-rideaux en verre. Son costume était aussi froissé que d'habitude, et la sangle de sa mallette avait laissé une marque profonde sur son épaule.\n\nC'était la 3 427ème fois - ou peut-être la 3 428ème - qu'il passait par là, tant de fois qu'il ne pouvait même plus en tenir compte. La foule anti-guerre sur la place était plus grande qu'hier, avec des vagues de voix qui montaient les unes après les autres. Kimura Haruki a sorti son téléphone, vérifiant habituellement son compte bancaire en ligne. Les taux hypothécaires avaient encore augmenté, et son solde bancaire diminuait de jour en jour sous l'ombre de la guerre.\n\nEn fixant les chiffres froids sur l'écran de son téléphone, Kimura a soudainement réalisé que cette guerre érodait l'avenir de chacun. Il a pensé à la vieille dame dans le train ce matin qui soupirait en regardant le journal sur la hausse des prix, et aux rumeurs de licenciements que ses collègues murmuraient pendant le déjeuner.\n\nLes voix de la foule ont de nouveau monté, et cette fois, Kimura Haruki ne s'est pas dépêché de partir comme il le faisait d'habitude. Il est resté immobile, sentant les sons environnants se fondre progressivement avec les battements de son cœur. C'était la première fois qu'il prenait le dépliant dans sa main au sérieux."
jap.62.a: "Il est devenu l'un des leurs."
jap.63.t: "Manifestations anti-Chine"
jap.63.d: "Au crépuscule à Fukuoka, Ryuichiro Matsuda a mené un groupe de personnes dans une marche le long de la route principale à l'extérieur de la rue commerçante souterraine de Tenjin. Sa voix était rauque mais infatigable, le mégaphone dans sa main projetant ses mots à travers chaque allée.\n\n'Regardez ces magasins chinois !' Matsuda a pointé du doigt les commerces fermant à la hâte leurs portes. 'Qui sait avec qui ils contactent chaque nuit ? Qui sait si ces magasins cachent des explosifs, se préparant à aider l'ennemi dans le sabotage.' Derrière lui, la foule a grandi, les pas résonnant dans les rues.\n\nUne étudiante était sur le point de tourner dans une ruelle étroite mais a été bloquée par la foule en marche. Elle a gardé la tête baissée, a accéléré le pas et a disparu au coin d'un 7-Eleven. Le regard de Matsuda l'a suivie, sa voix s'élevant encore plus haut : 'Ils vivent parmi nous, utilisant nos installations, profitant de nos ressources, tout en informant secrètement l'ennemi. Quelle honte ! Concitoyens, nous devons expulser ces ennemis du Japon sans en laisser un seul derrière...' \n\nUn hélicoptère de transport militaire des Forces d'autodéfense a volé à basse altitude au-dessus de leur tête, étouffant brièvement le vacarme de la marche. Les lampadaires au loin ont commencé à s'allumer un par un, leurs reflets projetant une lumière froide sur les vitrines des magasins étroitement fermées."
jap.63.a: "Chinois, dégagez !"
jap.64.t: "Deux partis annoncent leur sortie de la Coalition Civique"
jap.64.d: "Dans une salle de conférence dans le quartier de Chiyoda à Tokyo, le président du PCJ, Kazuo Shii, et la dirigeante du PSD, Mizuho Fukushima, ont conjointement annoncé leur départ de la Coalition Civique. Formée il y a moins d'un an, l'alliance visait à défier le PLD au pouvoir.\n\nShii a déclaré lors de la conférence de presse : 'Nous avons rejoint la Coalition Civique avec de grands espoirs d'atteindre un véritable changement de régime. Cependant, certains éléments extrémistes ont sapé notre fondation commune.' Il a critiqué la montée du populisme et les disputes internes sans fin au sein de la coalition. Fukushima a ajouté : 'La Coalition Civique s'est éloignée de sa mission initiale de servir le public. Nous ne pouvons pas soutenir les querelles de factions, ni accepter de transformer la coopération en compromis,' faisant allusion aux conflits internes sur des questions telles que la sortie du nucléaire.\n\nEn réalité, la rupture entre le PCJ et la coalition était apparente depuis longtemps. Par exemple, des divisions sur les propositions d'abolir la taxe à la consommation et de réviser le Traité de sécurité nippo-américain ont causé d'importantes frictions. Le mois dernier, des membres de gauche ont organisé un rassemblement en scandant des slogans anti-Chine, tandis que le groupe d'extrême droite Issuikai a plaidé pour des liens économiques sino-japonais plus étroits. Les affrontements ont dégénéré en confrontations physiques à l'extérieur du lieu.\n\nLa Coalition Civique a réagi rapidement, avec une minorité de membres d'extrême gauche déclarant sur les réseaux sociaux que c'était 'purification terminée,' décrivant l'événement comme une victoire. Cependant, des sources au sein du Parti démocratique constitutionnel ont admis : 'Perdre le soutien du PCJ et du PSD pourrait entraîner une baisse significative des taux d'approbation de la coalition.'\n\nCet incident a exposé de profondes divisions au sein de la Coalition Civique, laissant son avenir électoral incertain. Le professeur de sciences politiques de l'université de Tokyo, Jiro Yamaguchi, a commenté : 'Si la coalition ne parvient pas à revenir à un cadre politique centriste, elle s'effondrera inévitablement.'"
jap.64.a: "La route à suivre reste incertaine."
jap.65.t: "Les Libéraux de droite quittent la Coalition"
jap.65.d: ""
jap.65.a: "C'était prévisible"
jap.66.t: "Invitation à la PEC"
jap.66.d: "Gorshok et Knyaz ont décidé d'écrire une nouvelle chanson., Gorshok dit :\n\n-Buvons, l'imagination sera meilleure.\n\nIls se sont saoulés comme d'habitude. Le matin, ils se réveillent, Knyaz demande à Gorshok :\n\n-Alors, on a écrit une chanson hier ?\n\n- Oui.\n\n-De quoi elle parle la chanson ?\n\n- Je ne me souviens pas mot pour mot, mais l'essentiel c'est que la nana de quelqu'un a d'abord été baisée par tout le village, puis mangée par tout le village."
jap.66.a: "OUI"
jap.67.t: "Réintroduire la conscription - Comment ?"
jap.67.d: "Les flammes de la guerre civile font rage si violemment qu'elles semblent capables de raviver le mont Fuji, consumant tout le Japon dans une fournaise infernale. Alors que les lignes de front deviennent plus complexes, la situation devient de plus en plus imprévisible. Nos unités de l'armée régulière sont à bout, et nous avons un besoin urgent de nouvelles troupes pour renforcer nos réserves et les lignes de front. La manière la plus rapide d'y parvenir est de réintroduire la conscription.\n\nD'une part, les avantages de la conscription pour renforcer notre armée sont clairs. D'autre part, il existe de fortes objections. Les critiques affirment que des années de paix ont laissé la plupart des citoyens - principalement des travailleurs et des étudiants - mal préparés au combat. Même avec une formation de base, les envoyer sur les lignes de front entraînerait probablement des pertes élevées. De plus, l'intégration d'un grand nombre de conscrits dans des unités d'active réduirait l'efficacité globale au combat, compliquerait les structures de commandement et augmenterait les défis logistiques - faisant finalement plus de mal que de bien.\n\nLe cabinet est profondément divisé sur les réglementations et les résolutions entourant la conscription. Cependant, le temps est compté en temps de guerre. Si nous ne pouvons pas parvenir à un consensus rapide, nos ennemis pourraient profiter de notre indécision et prendre un avantage critique..."
jap.67.a: "N'allons pas trop loin maintenant..."
jap.67.b: "Notre démocratie est en jeu !"
jap.68.t: "Des soutiens étrangers fournissent des armes"
