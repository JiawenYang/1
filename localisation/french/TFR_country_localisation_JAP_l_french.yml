l_french:
 #Focuses
 JAP_reiwa_2: "Reiwa II"
JAP_reiwa_2_desc: "Année 2020, ou la deuxième année du règne de l'empereur Naruhito, de nouveaux défis attendent notre nation, et avec le temps qui change, nous devons décider quel chemin le Japon doit emprunter."
JAP_deal_with_the_pandemic: "Faire face à la pandémie"
JAP_deal_with_the_pandemic_desc: "La pandémie a frappé notre pays, et nous devons agir avant qu'il ne soit trop tard."
JAP_restrict_travel: "Restreindre les voyages"
JAP_restrict_travel_desc: "Afin de prévenir la propagation de la pandémie, nous devrons peut-être restreindre les voyages en provenance d'autres pays."
JAP_research_the_vaccine: "Rechercher le vaccin"
JAP_research_the_vaccine_desc: "Depuis que la pandémie de Covid-19 a frappé notre pays, la question sur toutes les lèvres est : « pouvons-nous fabriquer un vaccin ? » La réponse, bien sûr, est oui, mais nous sommes encore loin de son développement. Pour accélérer le processus, nous devons allouer des fonds pour aider nos chercheurs de toutes les manières possibles."
JAP_provide_emergency_response_packages: "Fournir des aides d'urgence"
JAP_provide_emergency_response_packages_desc: "Le Covid-19 est probablement la plus grande menace que nous ayons affrontée depuis la fin de la Seconde Guerre mondiale. À travers le pays, notre peuple souffre d'un manque de presque tout. Il est de notre responsabilité de s'assurer qu'ils obtiennent les biens dont ils ont besoin."
JAP_continue_the_lockdowns: "Poursuivre les confinements"
JAP_continue_the_lockdowns_desc: "Bien qu'il soit regrettable que nous devions aller à l'encontre de la volonté du peuple, c'est pour leur bien. Nous perdons encore des milliers de vies japonaises à cause de ce maudit virus, et nous ne sommes pas prêts à laisser encore plus d'innocents mourir. Les confinements seront prolongés indéfiniment."
JAP_ease_the_lockdowns: "Assouplir les confinements"
JAP_ease_the_lockdowns_desc: "Le désir du peuple est de se libérer de la prison de leurs foyers, et c'est une aspiration que nous comprenons. Bien que nous ne soyons pas prêts à revenir à la vie d'avant Covid, nous pouvons au moins assouplir certaines des restrictions imposées à nos citoyens."
JAP_support_small_medium_enterprises: "Soutenir les petites et moyennes entreprises"
JAP_support_small_medium_enterprises_desc: "Les fondations du capitalisme ne reposent pas sur des corporations géantes et imposantes, mais sur les petites entreprises. Dans le Japon d'aujourd'hui, il semble que cela ait été oublié. Les petites entreprises ont plus que jamais besoin de notre soutien, surtout avec la menace du Covid-19 qui leur enlève leurs affaires."
JAP_prepare_for_the_olympics: "Préparer les Jeux olympiques"
JAP_prepare_for_the_olympics_desc: "Pendant près de sept ans, notre capitale a attendu avec impatience les Jeux olympiques. Pourtant, à la veille de cet événement monumental, notre nation a été frappée par le même virus que le reste du monde. Cela, combiné à l'augmentation des tensions à travers le globe, a conduit les organisateurs à repenser l'événement. Avec la peur du Covid-19 et les étincelles entre les compétiteurs, la question se pose de savoir si Tokyo est en état d'accueillir les Jeux olympiques."
JAP_hold_the_olympics: "Organiser les Jeux olympiques"
JAP_hold_the_olympics_desc: "En ces temps difficiles, quoi de mieux pour unir le monde qu'une compétition amicale ? Virus et rivalités mis à part, ces Jeux olympiques se concentreront sur le rapprochement des gens ! Les risques ne sont pas assez grands pour nous empêcher de montrer au monde le véritable sens de l'hospitalité."
JAP_delay_the_olympics: "Reporter les Jeux olympiques"
JAP_delay_the_olympics_desc: "Malgré notre empressement à accueillir les Jeux olympiques, nous devons admettre qu'il y a trop de variables inconnues. Un scandale de dopage, par exemple, pourrait avoir de graves conséquences en raison des tensions mondiales. Bien que très improbable, une altercation entre athlètes pourrait être dévastatrice. Sans oublier la menace d'un événement super-propagateur. La décision a été prise de reporter les jeux à 2021."
JAP_promote_japanese_culture: "Promouvoir la culture japonaise"
JAP_promote_japanese_culture_desc: "Katanas, bonsaïs, doujinshi, anime, sushi et tempura. Nous pouvons promouvoir notre culture à travers le monde, et nous pourrions le faire encore mieux."
JAP_japan_on_the_world_stage: "Le Japon sur la scène mondiale"
JAP_japan_on_the_world_stage_desc: "Alors que le monde change autour de nous, nous pourrions être destinés à devenir le phare éclatant de la démocratie est-asiatique en mettant de côté notre passé le plus sombre."
JAP_deal_with_social_policies: "Traiter les politiques sociales"
JAP_deal_with_social_policies_desc: "Nous pouvons ressembler à un paradis, mais nous avons nos propres problèmes, notamment celui des personnes vivant seules et celui de la baisse des taux de natalité dans ce pays."
JAP_provide_maternity_leave_for_female_workers: "Fournir un congé de maternité aux travailleuses"
JAP_provide_maternity_leave_for_female_workers_desc: "Avec la baisse du taux de natalité dans notre pays, il est dans notre meilleur intérêt de veiller à ce que les femmes puissent réellement s'occuper de leurs bébés. Trop de nos citoyens n'ont pas accès au congé de maternité, et cela doit changer !"
JAP_improve_childcare_facilities: "Améliorer les infrastructures de garde d'enfants"
JAP_improve_childcare_facilities_desc: "Les mères et les pères de notre nation passent souvent une grande partie de leur journée au travail et n'ont pas le temps de s'occuper de leurs enfants. Nos infrastructures de garde d'enfants sont fonctionnelles, mais si nous voulons soulager la pression sur notre peuple, nous devons veiller à ce qu'elles soient exceptionnelles !"
JAP_improve_the_workspace: "Améliorer l'environnement de travail"
JAP_improve_the_workspace_desc: "Qu'il s'agisse d'un patron toxique ou d'un chantier de construction qui n'a pas été inspecté depuis trop longtemps, nos citoyens font souvent face à un environnement de travail peu souhaitable. Avec l'évolution du monde, nous devons encourager un environnement de travail sain, sûr et amusant !"
JAP_ease_economic_burdens: "Alléger les fardeaux économiques"
JAP_ease_economic_burdens_desc: "Les politiques de dépenses ne sont pas bon marché, et inévitablement, l'économie en souffrira. Cependant, elles sont nécessaires pour l'amélioration de notre nation et le soutien de notre peuple. Bien que nous ne puissions pas arrêter le fardeau économique que ces politiques causeront, nous pouvons certainement en atténuer l'impact."
JAP_tackle_the_hikkikomori_issue: "S'attaquer au problème des hikikomori"
JAP_tackle_the_hikkikomori_issue_desc: "L'idée des hikikomori est intéressante et constitue un fléau pour notre nation. Bien que les introvertis soient socialement acceptables, s'enfermer dans sa chambre pour la vie ne l'est pas. Chaque hikikomori est une personne qui ne contribue pas à la société et qui représente un fardeau pour ceux qui l'entourent. Ce problème doit être résolu immédiatement."
JAP_reform_the_education_system: "Réformer le système éducatif"
JAP_reform_the_education_system_desc: "Rome ne s'est pas construite en un jour, pas plus que le Japon. Quand notre système éducatif est devenu aussi désordonné qu'il l'est aujourd'hui, cela s'est perdu dans l'histoire, mais son état actuel est assez indésirable. Si nous voulons que nos enfants grandissent en bonne santé et intelligents, la réforme est terriblement en retard."
JAP_revise_article_9: "Réviser l'article 9"
JAP_revise_article_9_desc: "L'article 9 de notre constitution stipule efficacement que nous ne pouvons pas avoir d'armée permanente. C'est là que le problème se pose, car comment combattre sans armée ? Heureusement, nous avons réussi à trouver quelques failles, mais elles ne sont que limitées, et nous devons maintenant réviser cette partie obsolète de notre code national."
JAP_improve_the_ground_defence_forces: "Améliorer les forces de défense terrestre"
JAP_improve_the_ground_defence_forces_desc: "Bien qu'il semble peu probable que nous affrontions la Chine sur le terrain, qui sait ? Taïwan semble être l'endroit le plus probable pour une confrontation directe, mais si les choses tournent mal, nous devrons peut-être affronter le dragon sur notre propre sol. Avec les révisions de l'article 9, nous pouvons enfin renforcer nos forces terrestres."
JAP_improve_the_tank_fleet: "Améliorer la flotte de chars"
JAP_improve_the_tank_fleet_desc: "Le Japon n'a pas une grande histoire en matière de chars, et c'est parce que tout au long de l'histoire, nous n'avons jamais vraiment eu à les utiliser. Cependant, le champ de bataille d'aujourd'hui met beaucoup plus souvent en avant ces mastodontes à chenilles, et nous devons donc être capables de rivaliser avec les Chinois dans ce domaine."
JAP_a_fleet_of_mcvs: "Une flotte de VCM"
JAP_a_fleet_of_mcvs_desc: "Les chars ont tendance à être lents et difficiles à réparer et à remplacer, heureusement, nous avons une alternative. Le VCM, bien qu'il ne dispose pas d'autant de puissance de feu, est rapide et polyvalent, et pourra certainement porter des coups dévastateurs à nos ennemis."
JAP_innovate_the_helicopter_fleet: "Innover la flotte d'hélicoptères"
JAP_innovate_the_helicopter_fleet_desc: "Avec la probabilité élevée d'une guerre insulaire et dans la jungle, la nécessité d'une grande flotte d'hélicoptères est encore plus importante. Non seulement nous en avons besoin en grand nombre, mais ils doivent être suffisamment modernes pour rivaliser avec les Chinois."
JAP_adapt_to_cyber_warfare: "S'adapter à la guerre cybernétique"
JAP_adapt_to_cyber_warfare_desc: "Nous serons les premiers à admettre que les Chinois ont pris une longueur d'avance sur nous en matière de guerre cybernétique, malheureusement pour eux, nous rattrapons notre retard. Internet est un nouveau front qui nécessite toute notre attention et sera utilisé à son plein potentiel."
JAP_acquire_f35s: "Acquérir des F-35"
JAP_acquire_f35s_desc: "Avec les États-Unis plongés dans des conflits internes, la perspective d'obtenir des F-35 de n'importe où semble absurde. Heureusement, nous avons nos moyens, et nous veillerons à ce que les cieux au-dessus du Pacifique nous appartiennent uniquement !"
JAP_expand_the_JMSDF: "Élargir la JMSDF"
JAP_expand_the_JMSDF_desc: "En tant que nation insulaire, une force maritime puissante est requise. La haute mer est également l'endroit où nous sommes le plus susceptibles d'entrer en conflit avec nos rivaux chinois dans un futur inévitable. Cette guerre arrivera plus tôt que prévu, et nous devons donc élargir la JMSDF aussi vite que possible, sans sacrifier la qualité bien sûr."
JAP_convert_helicopter_destroyers: "Convertir les destroyers porte-hélicoptères"
JAP_convert_helicopter_destroyers_desc: "Notre marine, malheureusement, ne possède pas de porte-avions. Les porte-avions sont grands, coûteux, et jusqu'à présent, nous étions interdits d'en avoir. Ce que nous avons, cependant, ce sont des porte-hélicoptères qui peuvent être convertis pour transporter certains types d'avions."
JAP_build_new_aegis_destroyers: "Construire de nouveaux destroyers Aegis"
JAP_build_new_aegis_destroyers_desc: "Les destroyers utilisant le système Aegis sont parmi les plus avancés au monde, et nous avons la chance d'en posséder quelques-uns. Cependant, en cas de guerre avec la Chine, les quelques-uns que nous avons ne suffiront pas, et il faut donc en construire davantage."
JAP_unveil_the_taigei: "Dévoiler le Taigei"
JAP_unveil_the_taigei_desc: "L'heure est venue pour le Japon de rejoindre les rangs des nations dotées de sous-marins de nouvelle génération, et nos chercheurs ont donc conçu le Taigei. Bien qu'il ne soit pas le meilleur au monde, la classe Taigei renforcera certainement la présence de la JMSDF sous les vagues."
JAP_build_new_dockyards: "Construire de nouveaux chantiers navals"
JAP_build_new_dockyards_desc: "Alors que nous continuons la production en masse de nouveaux actifs navals, nous constatons que nos chantiers navals sont constamment saturés de nouvelles commandes. En construire davantage créera non seulement de nouveaux emplois, mais augmentera également le rythme auquel nous produisons de nouveaux navires et sous-marins."
JAP_introduce_the_kawazaki: "Améliorer le Kawasaki P-1"
JAP_introduce_the_kawazaki_desc: "Les Chinois aiment être subtils lorsqu'ils infiltrent nos eaux nationales, et c'est souvent au Kawasaki P-1 de les chasser. Nous améliorerons cet avion afin qu'il puisse voyager plus loin et repérer les navires chinois à des distances encore plus grandes."
JAP_improve_island_defences: "Améliorer les défenses insulaires"
JAP_improve_island_defences_desc: "La Chine tentera sans aucun doute de détruire nos bases insulaires, que ce soit par un barrage de missiles ou une invasion navale. Peu importe comment ils choisissent de le faire, nous devons nous assurer que cela leur soit extrêmement difficile."
JAP_procure_new_equipment: "Acquérir de nouveaux équipements"
JAP_procure_new_equipment_desc: "Même si l'Amérique est occupée par ses propres problèmes internes, nous avons d'autres alliés à travers le monde auprès desquels nous pouvons acheter des armes. Nous contacterons nos camarades à travers le monde et achèterons de nouveaux équipements pour améliorer nos forces de combat."
JAP_start_limited_military_exports: "Commencer les exportations militaires limitées"
JAP_start_limited_military_exports_desc: "Taïwan et l'Australie, bien que nos alliés respectés, n'ont pas innové leur armée dans la mesure où nous l'avons fait. Ainsi, pour s'assurer qu'ils puissent nous aider à combattre la Chine de la meilleure façon possible, nous commencerons à leur fournir certains de nos meilleurs équipements."
JAP_new_artillery_pieces: "Nouvelles pièces d'artillerie"
JAP_new_artillery_pieces_desc: "La doctrine de défense de la Chine semble reposer fortement sur l'artillerie, comme s'ils avaient l'intention de simplement rester assis et nous bombarder de leurs propres côtes. Eh bien, nous pouvons jouer à ce jeu-là aussi."

#Election Tree
JAP_election_time: "Temps des élections"
JAP_election_time_desc: "C'est encore ce moment, un moment spécial qui arrive une fois tous les quatre ans. Cette prochaine élection promet d'être l'une des plus controversées et intrigantes de l'histoire de notre nation, alors que les candidats affrontent toutes sortes de problèmes différents. Heureusement, il ne semble pas qu'elle sera aussi controversée que la dernière élection en Amérique."
JAP_unite_against_ldp: "S'unir contre le PLD"
JAP_unite_against_ldp_desc: "Le Parti libéral-démocrate a gouverné le Japon presque sans interruption pendant les 75 dernières années. Il a évidemment connu des hauts et des bas durant cette période, mais ces dernières années semblent constamment tomber dans la catégorie des bas. Renverser le PLD de son trône sera une tâche herculéenne, mais avec un peu de chance et beaucoup de négociations, ce sera possible."
JAP_for_prosperity_of_our_people: "Pour la prospérité de notre peuple"
JAP_for_prosperity_of_our_people_desc: "Il y a un dicton : « Le Japon vit en l'an 2000 depuis 1980. » Notre peuple a accès à de nombreux gadgets sophistiqués, mais à quoi servent-ils s'ils peuvent à peine se les permettre ? Le PLD gouverne comme si nous vivions encore dans le futur, alors que beaucoup de nos citoyens ont été laissés pour compte il y a des décennies. Nous briserons le statu quo et apporterons la prospérité à tous !"
JAP_for_saving_our_economy: "Pour sauver notre économie"
JAP_for_saving_our_economy_desc: "Le miracle économique japonais s'est terminé il y a près de trois décennies, pourtant le PLD gouverne comme si la musique jouait encore à plein volume. Nous ne pouvons pas rester les bras croisés et regarder pendant qu'ils ne font rien pour sauver notre économie qui s'effondre, nous devons prendre les choses en main !"
JAP_form_civil_coalition: "Former la Coalition civile"
JAP_form_civil_coalition_desc: "Il serait littéralement impossible pour un seul parti de renverser le PLD, mais une coalition, c'est là que la magie opère. Nous unirons le peuple japonais en unissant nos partis dans une coalition capable de les représenter au gouvernement !"
JAP_destroy_myth_of_one_party_japan: "Détruire le mythe du Japon à parti unique"
JAP_destroy_myth_of_one_party_japan_desc: "Quand quelque chose reste pratiquement inchangé depuis la naissance de vos grands-parents, on dirait que les choses seront toujours ainsi. Mais ce n'est pas nécessaire. Les stéréotypes politiques vieux comme le monde changent à travers le globe chaque semaine, et il est temps que la politique japonaise les rejoigne."
JAP_covid_populism: "Populisme lié au Covid"
JAP_covid_populism_desc: "[JAP_covid_populism_scripted_loc]"
JAP_covid_populism_cc: "Le Parti libéral-démocrate a mal géré la pandémie, et des milliers de citoyens japonais reposent dans leurs tombes à cause de cela. Ils prétendent que nous n'avons aucune expérience dans la gouvernance du pays, et que nous ne saurions pas gérer la pandémie en cours. Que ce soit vrai ou non, au moins, nous savons ce qu'il ne faut pas faire."
JAP_covid_populism_ldp: "Bien que beaucoup disent que nous aurions pu mieux gérer la pandémie de Covid, techniquement, tout peut toujours être fait mieux. Nous avons fait de notre mieux avec ce que nous avions. Plus important encore, cependant, la Coalition civile n'a aucune expérience avec quelque chose comme le Covid, car ils n'ont jamais eu l'occasion de gouverner correctement la nation. La pandémie est toujours en cours, et mettre une bande de novices aux commandes ne semble pas être la meilleure idée."
JAP_restore_peoples_trust: "Restaurer la confiance du peuple"
JAP_restore_peoples_trust_desc: "Notre parti a trébuché, il a chuté, et il est tombé. Mais qu'a-t-il toujours fait d'autre ? Se relever. Le Parti libéral-démocrate a toujours été là pour le peuple japonais, et nous ne serons pas écartés par un groupe de partis marginaux qui se déchireront dès qu'ils prendront le pouvoir."
JAP_good_old_japan: "Le bon vieux Japon"
JAP_good_old_japan_desc: "Le Japon a une culture qui s'est développée sur des milliers d'années, et bien que oui, les choses ont changé, nous sommes toujours restés fermes dans nos valeurs. Un petit accroc dans l'histoire de notre nation ne suffit pas à nous faire oublier tout ce que nous représentons."
JAP_new_course: "Une nouvelle voie"
JAP_new_course_desc: "Le Japon a tellement changé au cours du dernier siècle, et il changera certainement encore plus au prochain. Nous avons vu à quel point le peuple est mécontent de la politique partisane actuelle, et les dirigeants ont réalisé que les choses doivent changer. Dehors l'ancien, place au nouveau, comme on dit."
JAP_strengthen_our_union: "Renforcer notre union"
JAP_strengthen_our_union_desc: "Bien que nous ne dépendions pas du parti Komeito, ils sont notre allié de longue date, et leur soutien est profondément apprécié. Alors que la soi-disant « Coalition civile » rassemble de plus en plus de petits partis, nous devons consolider nos propres alliés, en particulier Komeito."
JAP_maintain_stability: "Maintenir la stabilité"
JAP_maintain_stability_desc: "Par-dessus tout, notre parti a toujours représenté la stabilité. Le changement peut être nécessaire dans certains domaines, mais cela ne signifie pas qu'il doit arriver demain. Le Parti libéral-démocrate veillera à la transition en douceur du Japon vers l'avenir, comme il l'a fait pendant des décennies, et le fera pour toujours."

#Civil Coalition Tree
JAP_formation_of_government: "Former un gouvernement"
JAP_formation_of_government_desc: "Quand on qualifie quelque chose de « tâche herculéenne », on fait généralement référence à quelque chose qui devrait, en tous points, être impossible. Cependant, Hercule a quand même accompli ses 12 travaux, et nous avons accompli le nôtre. Le PLD a enfin été destitué, et maintenant nous devons certifier notre contrôle."
JAP_expose_ldp: "Exposer le PLD"
JAP_expose_ldp_desc: "Le Parti libéral-démocrate est célèbre pour ses scandales. Malheureusement, comme ils contrôlaient le gouvernement depuis si longtemps, beaucoup de leurs crimes n'ont jamais vu le jour. Maintenant que nous contrôlons le pays, cependant, nous veillerons à ce que le peuple voie l'ampleur de leurs transgressions."
JAP_state_budgeting: "Budgétisation de l'État"
JAP_state_budgeting_desc: "Le PLD a ruiné l'économie japonaise, et nous n'avons aucune intention de suivre leurs traces. Nous voulons donner le bon exemple dès le début, et pour cela, nous devons veiller à ce que le budget soit réduit, propre et efficace."
JAP_lets_do_our_best: "Faisons de notre mieux !"
JAP_lets_do_our_best_desc: "Arriver ici semblait impossible il y a seulement quelques années, mais nous avons fait de notre mieux, et nous y sommes parvenus. Si nous faisons tous de notre mieux, nous et chaque citoyen japonais, nous rendrons un jour notre nation digne des éloges qu'elle reçoit !"
JAP_peoples_japan: "Un Japon pour le peuple"
JAP_peoples_japan_desc: "§RCE CONTENU SERA DÉVELOPPÉ À L'AVENIR§!"
JAP_free_japan: "Un Japon libre"
JAP_free_japan_desc: "Vie, liberté et poursuite du bonheur. C'est ce que dit la constitution de l'un de nos plus grands alliés, que tous les peuples y ont droit. Pourquoi cela devrait-il être limité à eux ? Tous les peuples à travers le monde ne devraient-ils pas y avoir droit ? Au Japon, notre peuple l'a certainement, et nous lutterons pour défendre ces droits !"
JAP_throw_the_corporations: "Chasser les corporations"
JAP_throw_the_corporations_desc: ""
JAP_progressive_healthcare: "Soins de santé progressistes"
JAP_progressive_healthcare_desc: ""
JAP_feed_the_people: "Nourrir le peuple"
JAP_feed_the_people_desc: ""
JAP_leftists_in_cdp: "Unifier les démocrates"
JAP_leftists_in_cdp_desc: ""
JAP_promises_of_peace: "Promesses de paix"
JAP_promises_of_peace_desc: ""
JAP_deal_with_devil: "Un pacte avec le diable"
JAP_deal_with_devil_desc: ""
JAP_legacy_of_anpo_protests: "Héritage des manifestations d'Anpo"
JAP_legacy_of_anpo_protests_desc: ""
JAP_armed_neutrality: "Neutralité armée"
JAP_armed_neutrality_desc: ""
JAP_form_pdto: "Former le PDTO"
JAP_form_pdto_desc: "Avec les États-Unis affaiblis de l'autre côté du Pacifique, le dragon chinois a commencé à lorgner avidement nos alliés en mer de Chine méridionale, en particulier Taïwan. Nous sommes impatients de les défendre, et nous ne sommes pas seuls. L'Australie a également jugé que la Chine représente une menace significative, et nos trois nations ont donc convenu de former une alliance. L'Organisation du Traité de Défense du Pacifique sera basée sur l'OTAN, mais pour le Pacifique, et aura pour objectif de dissuader l'agression chinoise."
JAP_pledge_to_defend_taiwan: "S'engager à défendre Taïwan"
JAP_pledge_to_defend_taiwan_desc: "Les mâchoires affamées de la République populaire de Chine cherchent à s'emparer de Taïwan et à le déchiqueter. Malheureusement pour eux, tant que nous serons debout, nous défendrons la souveraineté de notre nation sœur et le dragon restera enfermé sur le continent !"
JAP_anti_prc_propaganda: "Propagande anti-RPC"
JAP_anti_prc_propaganda_desc: "Il n'y a pas beaucoup de Japonais qui aiment la RPC, mais chaque jour, notre ennemi convertit quelques personnes de plus à sa cause. Grâce à des applications comme TikTok, ils lavent le cerveau de notre jeunesse pour qu'elle soutienne leur cause ! Heureusement, nous pouvons jouer au jeu de la propagande, et nous sommes très déterminés à les surpasser."
JAP_beyond_the_ocean: "Au-delà de l'océan"
JAP_beyond_the_ocean_desc: "Notre ancien rival devenu notre plus grand bienfaiteur se trouve dans une période de crise. Deux vieux hommes ont divisé une nation vieille de 250 ans et se battent actuellement l'un contre l'autre avec tout ce qu'ils ont. La question qui se pose à nous est : de quel côté devrions-nous nous ranger ?"
JAP_support_small_business: "Soutenir les petites entreprises"
JAP_support_small_business_desc: "Qui n'aime pas une petite entreprise ? Qu'il s'agisse d'un petit salon de thé confortable près de chez vous ou d'une épicerie familiale datant d'on ne sait combien d'années, elles laissent toujours une impression sur les gens. La pandémie de Covid a forcé beaucoup d'entre elles à fermer, mais il en reste encore beaucoup, et nous sommes heureux de les aider !"
JAP_strengthen_freedom_of_speech: "Renforcer la liberté d'expression"
JAP_strengthen_freedom_of_speech_desc: "Notre nation a déjà une forte liberté d'expression, mais il y a encore certaines choses pour lesquelles les gens peuvent avoir des ennuis. Si nous voulons rejoindre les rangs des autres démocraties modernes, nous devons mettre à jour ce que notre peuple peut dire."
JAP_protect_rights_of_citizens: "Protéger les droits des citoyens"
JAP_protect_rights_of_citizens_desc: "Tout le monde a les mêmes droits que tout le monde, pauvre ou riche, homme ou femme, ou toute autre différence entre nous. Pourtant, il y a ceux qui ne le voient pas de cette façon et aimeraient rien de plus que de soumettre les autres. Cela ne se passera pas ici, et nous protégerons les droits de tous les citoyens japonais !"
JAP_loyal_liberal_democrats: "Les nôtres dans le PLD"
JAP_loyal_liberal_democrats_desc: "Avec notre victoire aux élections de 2021, la structure pourrie du Parti libéral-démocrate s'est effondrée. Notre coalition correspondait à l'idéologie de nombreuses personnes au sein du PLD, et ces « dissidents » sont venus en masse. Cependant, leur plus grande défaite a peut-être été la perte du parti Komeito. Il semble que le PLD ne placera pas de premier ministre à la tête du Japon de sitôt."
JAP_post_covid_stabilization: "Stabilisation post-Covid"
JAP_post_covid_stabilization_desc: "Alors que la chaleur de la pandémie de Covid s'apaise enfin, nous devons utiliser le temps dont nous disposons pour rassembler le peuple. L'économie peut attendre un peu, car elle ne signifie rien si notre peuple est à couteaux tirés."
JAP_promote_gender_neutrality: "Promouvoir l'égalité des genres"
JAP_promote_gender_neutrality_desc: "Nous sommes dans les années 2020, bon sang, et pourtant l'inégalité des genres dans notre nation reste inutilement élevée. Si nous voulons apparaître comme une nation forte et unie, tous nos citoyens doivent être également forts et unis !"
JAP_green_revolution: "Une révolution verte"
JAP_green_revolution_desc: "Le Japon n'a jamais été réputé pour sa production de combustibles fossiles, et pour cause. Alors que le monde devient de plus en plus polarisé, et avec les États-Unis hors jeu, il est primordial que nous ne devenions pas dépendants de qui que ce soit. En tant que tel, il est temps d'investir dans d'autres sources d'énergie pour nous assurer d'être aussi autosuffisants que possible."

#CC Victory Tree
JAP_triumph_of_democracy: "Triomphe de la démocratie"
JAP_triumph_of_democracy_desc: "Le régime autoritaire chinois a été repoussé de Taïwan et confiné à son propre territoire. Le peuple japonais a montré sa puissance et son refus de s'incliner devant un agresseur évident. Maintenant, le moment est venu pour nous de savourer notre triomphe et de guider le Japon vers un avenir radieux !"
JAP_preserve_the_coalition: "Préserver la coalition"
JAP_preserve_the_coalition_desc: "Il y a des sceptiques parmi nous qui pensent que la coalition n'était qu'un moyen pour arriver à une fin, mais ils ont tort ! Cette coalition représente la volonté du peuple japonais, la volonté de travailler avec ceux qui sont différents de nous pour un avenir meilleur. La coalition perdurera !"
JAP_each_to_his_own: "Chacun pour soi"
JAP_each_to_his_own_desc: "La Coalition civile n'était qu'un moyen de chasser le Parti libéral-démocrate du pouvoir et de détruire le système à parti unique. Maintenant que son objectif a été atteint, et que le PLD n'est pas en mesure de reprendre le pouvoir de sitôt, nous pouvons dire adieu à nos alliés et tracer notre propre chemin pour la nation !"
JAP_for_people_for_the_future: "Pour le peuple, pour l'avenir"
JAP_for_people_for_the_future_desc: "Nous, du Parti démocrate constitutionnel, à ne pas confondre avec le Parti libéral-démocrate, avons toujours eu plus d'influence que le Parti de l'Innovation. Nous avons réussi à exploiter cette influence pour prendre notre place en tant que dirigeants légitimes du Japon."
JAP_innovation_straight_away: "Innovation sans délai"
JAP_innovation_straight_away_desc: "Nous, dans le Parti de l'Innovation, avons saisi l'initiative et réussi à certifier notre contrôle sur le gouvernement. Bien que cela ait pu éloigner la gauche, nous avons encore plus qu'assez de pouvoir pour faire avancer notre propre agenda. Nous devons nous mettre au travail dès que possible, le Japon ne va pas s'innover tout seul !"
JAP_harmonious_society: "Société harmonieuse"
JAP_harmonious_society_desc: "Le Japon doit être une nation de paix chez elle et de force à l'étranger. Alors que le Parti libéral-démocrate aimait prôner la stabilité, nous prônons plus que cela, nous prônons l'harmonie. Lorsque les gens travaillent à l'unisson, de grandes choses sont facilement réalisables."
JAP_bring_the_left_back: "Ramener la gauche"
JAP_bring_the_left_back_desc: "Notre nation n'a pas un bon historique de collaboration avec la gauche, et la guerre de Taïwan l'a montré. Malgré notre victoire, beaucoup à gauche étaient fortement contre la guerre. Là où d'autres voient des « agitateurs communistes », nous voyons une opportunité pour plus de voix, et nous travaillerons donc à ramener la gauche dans le giron."
JAP_additional_welfare: "Aide sociale supplémentaire"
JAP_additional_welfare_desc: "Bien que le Japon ait un système de protection sociale respectable, il est loin d'être aussi bon que celui des pays d'Europe. Nous devons pousser notre qualité de vie plus haut que celle de tous les autres, et le point de départ est de s'assurer que notre peuple est pris en charge !"
JAP_maintain_constitutionalism: "Maintenir le constitutionnalisme"
JAP_maintain_constitutionalism_desc: "Trop de gens sont en faveur de modifier fortement ou même de supprimer la constitution, et nous ne le tolérerons pas. Pour certains, ce n'est qu'un morceau de papier, mais pour nous, c'est un document très important. Tant que nous resterons au pouvoir, le gouvernement adhèrera aux principes énoncés par la constitution."
JAP_grassroots_democracy: "Démocratie de base"
JAP_grassroots_democracy_desc: "La démocratie, à sa base, est un moyen pour le peuple d'obtenir pacifiquement ce qu'il veut. Pourtant, dans le monde d'aujourd'hui, cela a été oublié par trop de nations, et un magnat des affaires riche pourrait avoir plus d'influence qu'un millier d'électeurs. Nous devons nous assurer qu'il n'y a pas de magouilles dans notre démocratie et que nous représentons uniquement la volonté du peuple."
JAP_the_future_of_tokyo: "L'avenir de Tokyo"
JAP_the_future_of_tokyo_desc: "La vie en ville peut être sombre, et parfois, déprimante. Mais savez-vous ce qui ne vieillit jamais ? L'odeur de l'air frais et la beauté de la nature. Cependant, à mesure que de plus en plus de gens déménagent dans les villes, en particulier à Tokyo, moins de personnes peuvent en profiter. Nous devons augmenter la population rurale, et offrir une compensation monétaire n'est pas indigne de nous."
JAP_cultural_diversity: "Diversité culturelle"
JAP_cultural_diversity_desc: "Le Japon a un fossé culturel, non pas entre deux groupes de personnes, mais entre l'ancien et le nouveau. La culture de l'ère moderne est presque méconnaissable par rapport à celle d'il y a un siècle, et les gens ont souvent du mal à choisir laquelle embrasser. Cependant, ce n'est pas l'un ou l'autre, la beauté de la culture est que tout le monde peut en profiter !"
JAP_legacy_of_ldp: "Héritage du PLD"
JAP_legacy_of_ldp_desc: "Après tant d'années de gouvernance, le Parti libéral-démocrate a laissé derrière lui un héritage considérable. Cependant, il nous revient maintenant de décider quels sont les aspects positifs et négatifs de leur règne, et ce qui doit être changé."
JAP_new_tax_system: "Nouveau système fiscal"
JAP_new_tax_system_desc: "Personne n'aime payer des impôts, mais ils sont nécessaires pour s'assurer qu'une nation peut couvrir ses dépenses. Dans la plupart des cas, l'argent trouve même son chemin de retour vers le contribuable. Cependant, le système fiscal actuel ici au Japon a désespérément besoin d'une réforme, et nous le ferons."
JAP_marriage_reform: "Réforme du mariage"
JAP_marriage_reform_desc: "Nous prétendons être une nation moderne, pourtant notre code du mariage est incroyablement arriéré et ancien. Nous rejoindrons notre frère taïwanais dans la reconnaissance du mariage homosexuel. L'autre problème est celui des noms de famille séparés, qui seront désormais accordés."
JAP_accessible_education: "Éducation accessible"
JAP_accessible_education_desc: "Un problème auquel trop de Japonais sont confrontés est leur incapacité à se payer une éducation. Comment pouvons-nous être considérés comme une nation moderne si notre peuple n'est même pas éduqué ? Nous prendrons les mesures nécessaires pour une éducation bon marché, voire gratuite."
JAP_continue_environmentalism: "Poursuivre l'environnementalisme"
JAP_continue_environmentalism_desc: "Notre rival, la Chine, est tristement célèbre pour sa terrible pollution dans et autour de ses villes. Nous avons prouvé que nous étions meilleurs qu'eux sur le champ de bataille, et maintenant nous devons prouver que nous sommes meilleurs qu'eux dans la lutte contre le changement climatique. Nous préserverons la beauté naturelle du Japon !"
JAP_integrate_democrat_dissidents: "Intégrer les dissidents démocrates"
JAP_integrate_democrat_dissidents_desc: "Le Parti démocrate pour le peuple est petit, mais il partage beaucoup de nos objectifs. Bien que son intégration ne nous donnera pas d'avantages massifs, toute addition au parti est une bonne addition."
JAP_small_government: "Petit gouvernement"
JAP_small_government_desc: "Après des décennies du PLD et de leur monstre de parti gigantesque, beaucoup sont contre l'idée d'un grand gouvernement. Nous sommes d'accord avec cela, et une certaine réduction est certainement nécessaire."
JAP_japanese_federalism: "Fédéralisme japonais"
JAP_japanese_federalism_desc: "Fédéralisme et Japon n'ont probablement jamais été mis ensemble dans la même phrase. Cependant, la plupart des nations modernes prospères ont un système fédéraliste quelconque, même s'ils varient grandement d'un pays à l'autre. Il est temps pour le Japon d'implémenter sa propre forme de fédéralisme, la proposition de dōshūsei sera réintroduite."
JAP_promotion_of_free_trade: "Promotion du libre-échange"
JAP_promotion_of_free_trade_desc: "Nous avons de nombreux alliés dans la région Asie-Pacifique qui échangeront volontiers leurs biens avec nous. En assouplissant les restrictions sur le libre-échange, ce sera une situation gagnant-gagnant pour tout le monde !"
JAP_digitalisation_of_bureaucracy: "Digitalisation de la bureaucratie"
JAP_digitalisation_of_bureaucracy_desc: "Grâce au PLD, le gouvernement a été lent à s'adapter au monde en constante évolution, surtout en ce qui concerne Internet. Nous corrigerons les erreurs de nos prédécesseurs et ferons en sorte que presque tous les aspects du gouvernement, sinon tous, puissent être effectués en ligne. Nous sommes le parti de l'innovation, après tout."
 JAP_honor_osaka: "Honorer Osaka"
JAP_honor_osaka_desc: "Osaka est devenue une ville très importante dans le Japon moderne, et c'est là que notre parti a ses origines. En l'honneur de la ville, nous en ferons la vice-capitale de notre nation."
JAP_respect_the_imperial_family: "Respecter la famille impériale"
JAP_respect_the_imperial_family_desc: "La famille impériale a perdu beaucoup de son influence depuis la mort de l'empereur Hirohito, et bien que nous ne les remettions pas au pouvoir, le moins que nous puissions faire est de leur montrer le respect qu'ils méritent. Ils ont toujours été là pour le Japon, et nous savons que l'exemple qu'ils ont donné perdurera dans l'avenir."
JAP_labor_code_reform: "Réforme du code du travail"
JAP_labor_code_reform_desc: "Les lois du travail au Japon ont toujours eu tendance à favoriser injustement l'employeur. Bien que cela pourrait être pire, cela pourrait certainement être mieux, et nous ferons en sorte que cela le soit."
JAP_social_pact: "Pacte social"
JAP_social_pact_desc: "Nous n'avons pas toujours à être d'accord avec le peuple, en fait, quoi que nous fassions, il y aura toujours ceux qui souhaiteront s'opposer à nous. Cependant, lorsqu'il s'agit de quelque chose qui peut bénéficier à tous, nous pouvons mettre nos différences de côté et parvenir à un consensus."
JAP_nationalizing_strategic_sectors: "Nationaliser les secteurs stratégiques"
JAP_nationalizing_strategic_sectors_desc: "Il y a certaines choses dans ce monde, et dans cette nation, qui, lorsqu'elles sont détenues par certaines personnes, ne font que promouvoir la cupidité. C'est à ce moment-là que l'État doit intervenir et prendre le contrôle des secteurs qu'il peut utiliser pour bénéficier à ses citoyens."
JAP_progressive_business: "Entreprises progressistes"
JAP_progressive_business_desc: "Bien que toutes les entreprises soient bonnes, certaines sont simplement meilleures. Celles qui traitent leurs travailleurs avec respect et dignité auront toujours une longueur d'avance sur les corporations sans âme qui forcent leurs employés à travailler dur pour presque rien. Les premières sont les exemples que nous voulons promouvoir, et elles seront donc récompensées pour encourager les autres à suivre leurs traces."
JAP_fight_uyoku_dantai: "Combattre les Uyoku Dantai"
JAP_fight_uyoku_dantai_desc: "Nos changements au Japon n'ont pas été sans contestation, et nous avons été ciblés par beaucoup à droite. Bien qu'ils fassent certainement ce qu'ils croient être juste, leurs actions n'ont fait que nuire aux gens. Puisque nous ne pouvons pas parvenir à un accord, il semble que les couloirs de la Diète seront à nouveau entachés par le conflit."
JAP_humanizing_law_enforcement: "Humaniser les forces de l'ordre"
JAP_humanizing_law_enforcement_desc: "Bien que la police fasse parfois des erreurs, nous en faisons tous. Les autorités n'ont pas toujours raison, et le peuple ne peut pas s'attendre à ce qu'elles le soient. Personne n'est parfait. Ce sont les messages que nous devons transmettre au peuple, qui voit les forces de l'ordre d'un mauvais œil."
JAP_new_refugee_policy: "Nouvelle politique sur les réfugiés"
JAP_new_refugee_policy_desc: "Nous reconnaissons qu'il y a des gens dans le monde qui sont moins fortunés que nous. Il est temps d'assouplir notre politique migratoire pour rendre le Japon plus humain."
JAP_accept_challenges_time: "Accepter les défis du temps"
JAP_accept_challenges_time_desc: "Peu importe comment le monde change autour de nous, nous devons continuer à respecter la constitution. Cela inclut l'article 9, peut-être sa partie la plus controversée. Malgré cela, nous n'avons pas besoin de l'obéir aveuglément, le besoin d'une armée plus importante est évident. Nous trouverons un moyen de le faire, sans enfreindre la loi du pays."
JAP_privatization: "Privatisation"
JAP_privatization_desc: "Partager, c'est se soucier, dit-on. Cela s'applique certainement au niveau gouvernemental, alors pourquoi en avons-nous été exemptés si longtemps ? Il y a des gens, experts dans leur domaine, qui pourraient gérer certains actifs que nous contrôlons bien mieux que nous. En tant que tel, le transfert de ces actifs au secteur privé est nécessaire. Pour qu'ils soient mieux gérés, bien sûr !"
JAP_partnerships_entrepreneurs: "Partenariat avec les entrepreneurs"
JAP_partnerships_entrepreneurs_desc: "Parfois, les entrepreneurs innovants luttent pour lancer leurs entreprises. Cela prive beaucoup de gens de l'expérience de ce que ces entrepreneurs ont à offrir, et c'est tout simplement tragique. Il est de notre devoir en tant que nation d'aider ces personnes à réussir dans leurs épreuves."
JAP_budget_responsibility: "Responsabilité budgétaire"
JAP_budget_responsibility_desc: "Bien que les dépenses sociales puissent bénéficier à certaines personnes, une économie stable aide davantage. L'une des meilleures façons de s'assurer que les choses restent dans le vert est un budget stable. Bien qu'il ne doive pas nécessairement être équilibré, car cela serait extrêmement difficile, nous pouvons au moins éviter qu'il ne devienne trop volatil. Et qui sait, peut-être qu'à terme, un budget équilibré est envisageable."
JAP_civic_participation: "Participation civique"
JAP_civic_participation_desc: "Bien que les dépenses sociales puissent bénéficier à certaines personnes, une économie stable aide davantage. L'une des meilleures façons de s'assurer que les choses restent dans le vert est un budget stable. Bien qu'il ne doive pas nécessairement être équilibré, car cela serait extrêmement difficile, nous pouvons au moins éviter qu'il ne devienne trop volatil. Et qui sait, peut-être qu'à terme, un budget équilibré est envisageable."
JAP_potential_threat: "Menace potentielle"
JAP_potential_threat_desc: "Personne n'aime les communistes, même les communistes sont trop occupés à se battre entre eux pour provoquer des changements. Après avoir vaincu la Chine dans la guerre de Taïwan, ils ont certainement commencé à chercher des moyens plus subtils de nous affaiblir. L'un d'entre eux est, bien sûr, de placer des agitateurs communistes à l'intérieur de nos frontières. Bien qu'ils n'aient pas encore agi, il est important que nous surveillions leurs activités."
JAP_follow_democratic_principles: "Suivre les principes démocratiques"
JAP_follow_democratic_principles_desc: "Le Japon est une démocratie depuis près de 80 ans à ce stade. Bien qu'une grande partie de ce temps ait été passée sous un parti unique, ce qui semble antidémocratique, les élections étaient toujours libres. Tant que notre nation existera dans son état actuel, nous continuerons à suivre ces principes établis par nos sages ancêtres."

#LDP election victory
JAP_the_status_quo_remains: "Le statu quo demeure"
JAP_the_status_quo_remains_desc: "Dans une victoire que beaucoup avaient prévue, la Coalition civile a été remise à sa place et notre domination sur le Japon est certifiée. Bien que pendant un moment, la direction du parti craignait une défaite, il semble que ces craintes étaient injustifiées. Maintenant que les élections de 2021 sont terminées, nous pouvons nous mettre au travail pour faire avancer notre nouvel agenda."
JAP_new_era_for_japan: "Nouvelle ère pour le Japon"
JAP_new_era_for_japan_desc: "La pandémie de Covid, bien que tragique, marque la fin d'une ère. Nous sommes devenus complaisants avec ce que nous avions, et ce n'est qu'à l'arrivée de la crise que nous avons réalisé à quel point nous étions dépassés. Plus maintenant ! Nous sommes aujourd'hui à l'aube d'une nouvelle ère, où le Japon brillera à nouveau glorieusement !"
JAP_administrative_reforms: "Réformes administratives"
JAP_administrative_reforms_desc: "Après les élections de 2021 et notre mauvaise gestion de la pandémie de Covid, il semble nécessaire de résoudre certains problèmes dans la bureaucratie. Le PLD est une institution gigantesque, et nous pouvons certainement changer quelques choses pour la rendre plus efficace."
JAP_together_with_you: "Ensemble avec vous !"
JAP_together_with_you_desc: "C'est grâce à vous, le peuple japonais, que nous sommes là où nous sommes aujourd'hui ! Sans votre soutien indéfectible, il n'aurait pas été possible pour nous de gagner les élections. Ensemble avec vous, nous continuerons à avancer, apportant la prospérité à tous dans nos frontières !"
JAP_new_three_arrows: "Les nouvelles trois flèches"
JAP_new_three_arrows_desc: "Les trois flèches de Shinzo Abe étaient exactement ce qu'il fallait pour le Japon, il y a une décennie. Bien qu'elles aient bien fonctionné dans certains domaines, elles avaient aussi leurs inconvénients. Maintenant, avec l'inauguration de Taro Kono, le moment est venu de réévaluer ces politiques. Nous garderons ce qui est bénéfique et supprimerons ce qui ne l'est pas."
JAP_green_energy_plan: "Plan d'énergie verte"
JAP_green_energy_plan_desc: "Le Japon n'a jamais été réputé pour sa production de combustibles fossiles, et pour cause. Alors que le monde devient de plus en plus polarisé, et avec les États-Unis hors jeu, il est primordial que nous ne devenions pas dépendants de qui que ce soit. En tant que tel, il est temps d'investir dans d'autres sources d'énergie pour nous assurer d'être aussi autosuffisants que possible."
JAP_rural_benefits_programme: "Programme d'avantages ruraux"
JAP_rural_benefits_programme_desc: "Un problème majeur qui touche notre nation est l'afflux de personnes quittant les communautés rurales pour les villes. En conséquence, beaucoup de gens en dehors des zones urbaines ont l'impression d'être laissés pour compte. Cela ne va pas, car certains de ces gens sont parmi les plus importants pour notre économie, et nous veillerons donc à ce qu'ils reçoivent les avantages dont ils ont besoin."
JAP_stable_government_stable_market: "Gouvernement stable, marché stable"
JAP_stable_government_stable_market_desc: "Quand une situation politique semble volatile, les investisseurs ont tendance à paniquer et à se retirer. Cela conduit souvent à un effondrement économique. Cependant, lorsque le gouvernement dégage un sentiment de stabilité et de tranquillité, les gens sont prêts à prendre leur part du gâteau. Si le gouvernement est stable, le marché l'est aussi."
JAP_kono_digitalization_programme: "Programme de digitalisation de Kono"
JAP_kono_digitalization_programme_desc: "Le monde dans lequel nous vivons aujourd'hui est celui d'une interconnectivité croissante. L'architecte principal de cela est, bien sûr, Internet. Cependant, pourquoi Internet devrait-il être limité aux seuls citoyens ? Alors que nous fonçons vers l'avenir, il est important que le gouvernement soit aussi connecté que les joueurs les plus acharnés."
JAP_new_japanese_capitalism: "Un nouveau capitalisme japonais"
JAP_new_japanese_capitalism_desc: "Personne n'aime un riche arrogant, et beaucoup de gens n'apprécient pas non plus la vue d'un sans-abri dans la rue. Un système capitaliste fort nécessite une classe moyenne forte pour fonctionner, mais malheureusement, la classe moyenne japonaise souffre. Le Premier ministre Fumio Kishida a exactement la solution à ce problème."
JAP_provide_heavy_inflation_relief_packages: "Paquets de secours contre l'inflation massive"
JAP_provide_heavy_inflation_relief_packages_desc: "L'inflation, le plus grand ennemi de toute famille de classe moyenne. Trop de gens ont été poussés dans la pauvreté parce que leur salaire ne correspond pas à la demande du marché. Nous sommes une nation riche, et nous pouvons nous permettre d'envoyer des paquets de secours contre l'inflation. Des gens heureux, une économie heureuse."
JAP_increase_minimum_wage: "Augmenter le salaire minimum"
JAP_increase_minimum_wage_desc: "Les emplois à temps partiel sont, de manière discutable, la partie la plus importante du capitalisme. Des millions de personnes à travers le monde travaillent à temps partiel, mais trop d'entre elles ici au Japon en vivent. Le moins que nous puissions faire pour aider ces travailleurs à temps partiel est d'augmenter le salaire minimum, afin qu'ils aient un bouclier supplémentaire contre l'inflation."
JAP_subsidise_small_medium_businesses: "Alléger les taxes pour les petites entreprises"
JAP_subsidise_small_medium_businesses_desc: "La pandémie de Covid a absolument ruiné les petites entreprises dans le monde entier, et ici au Japon, elles se remettent encore. Cependant, dans plusieurs cas, les taxes d'avant la pandémie se révèlent trop lourdes à gérer pour elles. Nous vivons dans une nouvelle ère, une ère où ces taxes n'ont pas besoin d'être aussi excessivement élevées."
JAP_startup_digitalization_economy: "Démarrage de la digitalisation de l'économie"
JAP_startup_digitalization_economy_desc: "Les longues heures lentes de la pandémie ont conduit beaucoup de personnes ennuyées à se tourner vers leurs ordinateurs et à concevoir des projets pour passer le temps. Cependant, certains de ces « projets » se développent rapidement en nouvelles industries, la plus importante étant l'IA. Nous devons nous assurer que ce nouveau marché est correctement régulé, et que nous obtenions une part du gâteau numérique aussi grande que celle des autres."
JAP_form_pdto2: "Former le PDTO"
JAP_form_pdto2_desc: "Avec les États-Unis affaiblis de l'autre côté du Pacifique, le dragon chinois a commencé à lorgner avidement nos alliés en mer de Chine méridionale, en particulier Taïwan. Nous sommes impatients de les défendre, et nous ne sommes pas seuls. L'Australie a également jugé que la Chine représente une menace significative, et nos trois nations ont donc convenu de former une alliance. L'Organisation du Traité de Défense du Pacifique sera basée sur l'OTAN, mais pour le Pacifique, et aura pour objectif de dissuader l'agression chinoise."
JAP_first_pdto_military_exercises: "Premiers exercices militaires du PDTO"
JAP_first_pdto_military_exercises_desc: "Nous avons une armée très différente de celle de Taïwan et de l'Australie, et il est donc primordial de s'assurer qu'elles fonctionnent toutes ensemble. Les premiers exercices militaires collaboratifs du PDTO seront bientôt organisés, pour encourager l'unité entre nos nations, mais aussi pour montrer à la Chine que nous ne plaisantons pas."
JAP_post_covid_stabilization2: "Stabilisation post-Covid"
JAP_post_covid_stabilization2_desc: "Alors que la chaleur de la pandémie de Covid s'apaise enfin, nous devons utiliser le temps dont nous disposons pour rassembler le peuple. L'économie peut attendre un peu, car elle ne signifie rien si notre peuple est à couteaux tirés."
JAP_invest_taiwanese_defences: "Investir dans les défenses taïwanaises"
JAP_invest_taiwanese_defences_desc: "Taïwan est un point de discorde dans le Pacifique depuis des décennies. Avec l'absence des États-Unis pour les protéger, les Chinois semblent plus proches que jamais de passer à l'action. Taïwan est notre allié, et nous ferons tout ce qui est en notre pouvoir pour nous assurer qu'ils ne tombent pas facilement."
JAP_ldp_unification_campaign: "Campagne d'unification du PLD"
JAP_ldp_unification_campaign_desc: "Le Parti libéral-démocrate est grand, et il a de nombreuses factions différentes. Ces factions sont parfois sujettes à des conflits internes, ce qui peut être sain dans certains cas, mais pas en ce moment. Nous devrions dégager un sentiment de confiance et de stabilité, pour que le monde sache que nous sommes prêts à affronter nos ennemis !"
JAP_raise_defence_budget: "Augmenter le budget de la défense"
JAP_raise_defence_budget_desc: "La Chine a un budget de défense qui éclipse celui de Taïwan, de l'Australie et du nôtre combinés. Ce n'est évidemment pas optimal pour une guerre contre eux, et bien que nous n'ayons pas les fonds pour égaler leur budget, nous pouvons certainement réduire l'écart."
JAP_start_information_war: "Lancer une guerre de l'information"
JAP_start_information_war_desc: "Une guerre directe contre la Chine ne se passerait pas bien pour nous sans les États-Unis, et en tant que tel, nous devrons trouver des moyens créatifs de les affronter. Si nous pouvons brouiller la ligne entre le vrai et le faux dans les informations qu'ils reçoivent, nous pouvons potentiellement prendre l'avantage dans un conflit en les aveuglant."

#LDP victory tree
JAP_triumph_of_japanese_people: "Triomphe du peuple japonais"
JAP_triumph_of_japanese_people_desc: "L'idée que ce siècle pourrait être chinois a enfin été anéantie, car aujourd'hui nous avons montré au monde de quoi nous sommes capables. Nous avons pu défendre Taïwan contre l'assaut chinois sans le soutien de l'Amérique, et la démocratie en Asie de l'Est vit pour combattre un autre jour !"
JAP_japan_new_course: "Nouvelle voie pour le Japon"
JAP_japan_new_course_desc: "Les années sombres des années 90 et 2000 sont loin derrière nous, alors que nous avançons vers l'avenir. Tokyo prospère, Kyoto n'a jamais été dans un meilleur état, même Sapporo en bénéficie. Peut-être le mieux de tout, le taux de natalité augmente. Si nous voulons continuer sur cette voie, une libéralisation continue du Japon est indispensable."
JAP_stimulate_gender_equality: "Stimuler l'égalité des genres"
JAP_stimulate_gender_equality_desc: "Simplement innover la womenomics d'Abe ne suffit pas pour éradiquer l'inégalité des genres. Bien que cela puisse aider sur le lieu de travail, à la maison, à l'école et dans d'autres domaines, cela ne le fait pas. Il est de notre devoir en tant que gouvernement de veiller à ce que tout le monde, homme ou femme, jouisse des mêmes droits que tous les autres."
JAP_green_economy_future: "Économie verte de l'avenir"
JAP_green_economy_future_desc: "Alors que les énergies alternatives deviennent de plus en plus prominentes, nous devons les intégrer à l'économie. Le Japon est un beau pays, et nous ne permettrons pas qu'il soit profané par l'industrialisme comme l'Inde et la Chine. Nous transformerons le Japon en un paradis vert, tout en maintenant une économie forte !"
JAP_legal_flexibility: "Flexibilité légale"
JAP_legal_flexibility_desc: "Si nous supprimons complètement l'article 9, nous risquons que les futures générations de législateurs japonais retombent dans l'histoire sombre de notre nation. Par conséquent, nous le conserverons, mais travaillerons à approfondir les failles néanmoins. Nous devons encore nous défendre, ainsi que nos alliés."
JAP_economy_new_era: "Économie de la nouvelle ère"
JAP_economy_new_era_desc: "L'économie japonaise a connu un essor depuis la fin de la pandémie de Covid et la guerre de Taïwan, alors que la confiance envers le gouvernement est à son plus haut niveau. Nous serions fous de ne pas utiliser cela à notre avantage, et nous allons donc travailler à innover l'économie pour que cet essor ne s'arrête pas prématurément."
JAP_new_demographic_policy: "Nouvelle politique démographique"
JAP_new_demographic_policy_desc: "La politique de womenomics de Shinzo Abe était très efficace, pourtant l'inégalité sur le lieu de travail persiste. Cela doit être abordé pour que notre nation continue sur sa voie. Si nous innovons le travail d'Abe pour répondre aux normes modernes, non seulement notre peuple en bénéficiera, mais l'économie aussi."
JAP_preserve_abe_legacy: "Préserver l'héritage d'Abe"
JAP_preserve_abe_legacy_desc: "Shinzo Abe était un homme complexe, mais il ne fait aucun doute que ses politiques ont bénéficié à notre nation. Sans lui, nous n'aurions pas été en position de défendre notre allié contre le dragon rouge. Ses trois flèches seront poursuivies, et son héritage vivra pendant des années à venir !"
JAP_revival_showa_spirit: "Renaissance de l'esprit Showa"
JAP_revival_showa_spirit_desc: "La seconde moitié de l'ère Showa, l'une des meilleures de notre histoire, a duré près de quarante ans, entre la fin de la Seconde Guerre mondiale et le début des années 90. Pendant ce temps, notre culture a radicalement changé et notre économie a prospéré. Maintenant, nous nous trouvons à entrer dans ce que certains appellent « la seconde ère Showa », où la prospérité japonaise a fait son retour triomphal !"
JAP_harmony_labor_life: "Harmonie entre travail et vie"
JAP_harmony_labor_life_desc: "L'équilibre entre vie professionnelle et personnelle dans notre nation a été malsain pendant de nombreuses années. Cependant, avec la nouvelle ère de prospérité dans laquelle nous nous trouvons, beaucoup sont mieux payés. En tant que tel, ils n'ont plus à stresser autant pour le travail et ont pu atteindre un meilleur équilibre entre le bureau et la maison."
JAP_national_consensus: "Consensus national"
JAP_national_consensus_desc: "La constitution doit être mise à jour, en particulier l'article 9, et le gouvernement actuel a décidé qu'elle devrait être révisée. Cependant, c'est au peuple de décider ce qu'il pense devoir être changé, et un référendum national sera donc organisé."
JAP_our_victory: "Notre victoire"
JAP_our_victory_desc: "Bien que la guerre contre la Chine ait été pour défendre la souveraineté de Taïwan, nous en sommes les vainqueurs. Personne n'a vu le conflit comme étant entre la Chine et Taïwan avec le soutien japonais, c'était nous contre eux, et nous avons triomphé. C'est notre victoire, et nous la traiterons comme telle."
JAP_support_for_veterans: "Soutien aux vétérans"
JAP_support_for_veterans_desc: "Nous frémissons à l'idée de ce qui aurait pu se passer si nous avions perdu la guerre contre la Chine, heureusement, nous ne vivons pas dans cette réalité. Les personnes responsables de cela sont nos vétérans, qui ont combattu et tué pour leur patrie. Nous devons les récompenser pour tout ce qu'ils nous ont donné !"
JAP_moderate_approach: "Approche modérée"
JAP_moderate_approach_desc: "Nous sommes arrivés aussi loin en tant que nation en ne secouant pas le bateau, et avec un avenir vibrant devant nous, il serait bon de ne pas faire de changements radicaux. Si nous continuons sur la voie actuelle, la prospérité trouvera son chemin dans les foyers de tous les Japonais !"
JAP_stable_leadership: "Leadership stable"
JAP_stable_leadership_desc: "Une nation stable a un dirigeant non controversé, et l'histoire l'a prouvé à maintes reprises. Pour un exemple moderne, regardez l'Amérique. Nous veillerons à ce que nos chefs de parti soient populaires aux yeux du public et ne fassent rien de radical."
JAP_balance_regional_development: "Équilibre du développement régional"
JAP_balance_regional_development_desc: "Si certaines préfectures avancent à grands pas vers l'avenir et d'autres sont laissées pour compte, cela ne fera qu'engendrer du mécontentement. En tant que tel, plusieurs projets de loi sont en préparation pour s'assurer que tout le monde reçoive sa juste part de notre nouvelle prospérité."
JAP_parliamentary_maneuvers: "Manœuvres parlementaires"
JAP_parliamentary_maneuvers_desc: "La constitution a de nombreux aspects qui pourraient être légèrement améliorés, et c'est l'opinion de presque tout le monde de le faire. Afin de présenter un Japon uni, nous travaillerons avec autant de personnes au parlement que possible pour s'assurer que la constitution obtienne les mises à jour nécessaires."
JAP_hardline_consolidation: "Consolidation dure"
JAP_hardline_consolidation_desc: "Les groupes plus radicaux du PLD sont petits et n'ont pas beaucoup de pouvoir, et en fin de compte, tout ce qu'ils font, c'est nous causer des maux de tête. Avec si peu d'influence, ils n'ont vraiment aucune raison d'exister. En tant que tel, ils seront consolidés dans les factions beaucoup plus importantes du parti, pour simplifier les choses."
JAP_keep_it_stable: "Maintenir la stabilité"
JAP_keep_it_stable_desc: "Le monde tourne beaucoup plus rondement lorsque tout le monde est heureux, et la stabilité permet cela. L'instabilité engendre la peur, qui engendre la haine, et ainsi de suite. Tant que notre nation est stable, elle prospérera, et quand notre nation prospère, son peuple aussi."
JAP_establish_internal_dialogue: "Établir un dialogue interne"
JAP_establish_internal_dialogue_desc: "La mauvaise communication n'a jamais fait de bien à personne, et nous ne la tolérerons certainement pas dans notre gouvernement. Il est important que chacun sente qu'il parle sur un pied d'égalité et qu'il puisse exprimer ses idées. Quand nous travaillons tous ensemble, de grandes choses sont possibles !"
JAP_party_modernization: "Modernisation du parti"
JAP_party_modernization_desc: "Le Parti libéral-démocrate conserve encore de nombreux aspects qualifiés d'« anciens » par les gens d'aujourd'hui. Nous vivons dans un monde très différent des années 1950 et 1960, et le PLD doit le réaliser. Vivre dans le passé n'a jamais fait de bien à personne, surtout pas ici au Japon."
JAP_party_discipline: "Discipline du parti"
JAP_party_discipline_desc: "Le Parti libéral-démocrate ne peut pas se permettre de continuer la tendance des scandales qui a marqué notre histoire moderne, la discipline doit être rétablie. Les politiciens doivent se rappeler où se trouvent leurs loyautés. Le parti passe en premier, le peuple en second, et leurs propres intérêts en dernier."
JAP_ignite_nationalism: "Attiser le nationalisme"
JAP_ignite_nationalism_desc: "Nous avons vu pendant la guerre de Taïwan les dommages qu'un manque de respect approprié pour sa nation peut causer. Malgré notre victoire dans une guerre juste, il y avait encore de nombreuses protestations. Nous apaiserons le front intérieur pour toutes les guerres futures en veillant à ce qu'ils soient fiers du Japon."
JAP_protection_party_heritage: "Protection de l'héritage du parti"
JAP_protection_party_heritage_desc: "Bien que, même nous, devions admettre que le PLD a parfois eu des difficultés, nous avons tout de même fait un travail plus que louable en dirigeant le Japon. Nous avons guidé la nation à travers ses âges prospères, et nous l'avons protégée des pires périodes sombres. Nos rivaux n'auront plus jamais une chance de nous vaincre, car tout ce que nous devons faire est de nous appuyer sur les légendes du passé, et notre avenir est assuré !"
JAP_program_loyalty: "Loyauté au programme"
JAP_program_loyalty_desc: "Nous ne pouvons pas avoir des politiciens rebelles qui compromettent notre agenda avec leurs propres plans. Si un programme a été établi par une administration précédente, le parti doit s'y conformer, sauf s'il y a une raison significative pour le contraire."
JAP_political_concretization: "Concrétisation politique"
JAP_political_concretization_desc: "L'ère volatile de l'élection de 2021 s'est apaisée, et la normalité est revenue au Japon. La Coalition civile est éteinte, les partis qui la composaient étant retournés à leurs querelles. Maintenant, nous devons nous assurer que rien de tel ne se reproduise, nous nous ancrerons et maintiendrons notre contrôle sur la nation."
JAP_integration_komeito: "Intégration de Komeito"
JAP_integration_komeito_desc: "Nous sommes arrivés à un point où le parti Komeito est le PLD en tout sauf le nom. Gérer notre propre petite marionnette a commencé à mettre une pression sur le système, donc la direction a décidé que le moment était venu d'absorber Komeito."
JAP_law_order: "Loi et ordre"
JAP_law_order_desc: "Maintenir la loi et l'ordre d'une nation semble de plus en plus difficile à faire dans le monde d'aujourd'hui. Nous ne voulons pas devenir l'une des nombreuses nations à travers le monde qui n'a pas sombré dans un conflit civil. La paix doit être maintenue, avant tout."
JAP_protect_rights_citizens: "Protéger les droits des citoyens"
JAP_protect_rights_citizens_desc: "Tant que l'administration sera en place, notre peuple restera libre. Les guerres civiles ont tendance à se produire lorsqu'un peuple d'une nation est opprimé, et que leur colère atteint un point de rupture. Nos citoyens doivent pouvoir exprimer librement leur colère, pour qu'elle ne s'accumule pas."
JAP_coordination_opinions: "Coordination des opinions"
JAP_coordination_opinions_desc: "S'accorder sur les choses, c'est cool ! Bien que chacun ait vécu sa propre vie et ait été façonné par ces expériences, cela ne signifie pas que nous devons tous être en désaccord. Pour le bien de la nation, nous veillerons à ce que tous dans le parti partagent des opinions similaires pour que la bureaucratie fonctionne correctement."
JAP_collective_responsibility: "Responsabilité collective"
JAP_collective_responsibility_desc: "Le Parti libéral-démocrate a une longue et, franchement, malheureuse histoire de scandales. Chaque fois que l'un de ceux-ci éclatait au grand jour, tout le monde se retournait immédiatement contre le principal responsable, même ceux qui étaient impliqués. Cela ne va pas, et nous devons certifier l'idée que l'erreur d'une personne est l'erreur de tous."
JAP_open_new_ideas: "Ouverture aux nouvelles idées"
JAP_open_new_ideas_desc: "Nous atteignons un point où les nouvelles générations, principalement la génération Z, trouvent leur chemin dans la politique. Les jeunes apportent avec eux de nombreuses nouvelles idées, et bien que certains craignent qu'elles puissent ébranler la stabilité du parti, nous y sommes ouverts. Le monde change constamment, et le PLD ne peut pas rester statique pour toujours."
JAP_party_rejuvination: "Rajeunissement des cadres"
JAP_party_rejuvination_desc: "Les anciens du PLD ont rendu un grand service à leur nation, mais leur temps viendra bientôt. Nous ne pouvons pas continuer à compter sur ces politiciens, ceux qui franchiront bientôt le seuil entre la vie et la mort. Nous les accompagnerons vers la sortie et continuerons à faire entrer les nouveaux esprits de la jeunesse."
JAP_rebirth_establishment: "Renaissance de l'establishment"
JAP_rebirth_establishment_desc: "Le soleil se lève sur Tokyo, les premiers cerisiers commencent à fleurir, le mont Fuji se reflète sur le lac Yamanaka. Pour la personne moyenne, la vie n'a pas beaucoup changé. Cependant, au sein du PLD, le changement n'a jamais été aussi présent. Le parti a reçu de nouvelles oreilles et de nouvelles voix à écouter. L'avenir appelle, et pour l'atteindre, nous devons renoncer au passé."

