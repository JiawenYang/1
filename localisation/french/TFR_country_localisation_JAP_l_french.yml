JAP_stick_to_american_5th_generation_projects: "S'en tenir aux projets américains de 5e génération"
JAP_stick_to_american_5th_generation_projects_desc: "Pour tout le chaos qui consume notre plus grand allié, aucune nation n'a jamais maîtrisé les chasseurs de cinquième génération comme les États-Unis. Le F-35 Lightning II est au zénith de la capacité des chasseurs, et même avec la guerre civile sans fin en vue, la chaîne de production de Lockheed Martin reste opérationnelle et entre les mains du gouvernement unioniste. Doubler la mise sur les conceptions américaines est le meilleur choix pour le Japon actuellement. Cela signifie faire confiance à des décennies de développement et garantit que la JASDF aura l'équipement dont elle a cruellement besoin bientôt. Cela nous coûtera une belle somme, mais la fiabilité du matériel américain l'emporte sur le risque d'expérimenter des alternatives nationales."
JAP_stick_to_american_5th_generation_projects_tt: "Sera ajouté au stock :\n§Y200 Lockheed Martin F-35 Lightning II§!"
