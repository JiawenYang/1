JAP_go_back_time: "§YChanger le passé§!"
JAP_go_back_time_desc: "Voyez-vous cela ? Le monde a sombré dans le chaos, comme si quelqu'un avait réécrit le code de la réalité avec des mains sales ! Guerres, crises, effondrements - tout a commencé avec un minuscule virus qui a déformé le tissu même du temps. Mais demandez à n'importe qui, « Pourquoi ? » Ils hausseront les épaules. « Le destin », marmonneront-ils. Le destin ? Non ! C'est un bug dans les algorithmes du destin !\n\nQuelque part dans les laboratoires souterrains de Tokyo, une horloge de compte à rebours fait tic-tac. Nos scientifiques ont déchiffré les équations quantiques et trouvé le point de singularité - 2019. Là, dans le brouillard des jours oubliés, se trouve le patient zéro. Celui qui a déclenché les dominos de la catastrophe. Nous construirons un pont à travers l'axe du temps, réécrirons le code de la pandémie... et effacerons ce cauchemar de la mémoire de l'univers !\n\nMais sachez ceci : le temps n'est pas de l'argile. Un faux mouvement, et au lieu d'une correction, nous obtenons un effondrement. Êtes-vous prêts à devenir les pirates de l'histoire ? À uploader un antivirus dans le passé ? À redémarrer un monde où le pétrole est juste une ressource, pas une arme, où les masques restent dans les salles d'opération, pas dans les rues ?\n\nActivez les résonateurs de champ chrono. Réglez les coordonnées. Aujourd'hui, nous ne sommes pas des scientifiques - nous sommes les chirurgiens du temps. Et notre scalpel est un vaccin contre la folie !"
