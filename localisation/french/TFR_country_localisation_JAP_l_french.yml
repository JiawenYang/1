JAP_PEC_attract_migrants_phi: "Inviter des migrants de §Y[PHI.GetNameWithFlag]§!"
JAP_PEC_east_asia_defence_fund: "Établir le §4Fonds de défense de l'Asie de l'Est§! en §Y[FROM.GetNameWithFlag]§!"
JAP_PEC_seize_asia_markets_arms: "Construire le complexe militaro-industriel pan-asiatique"
JAP_PEC_seize_asia_markets_industrial: "S'approprier les marchés de consommation asiatiques"
JAP_a_nation_of_the_greatest_admirals: "Une nation des plus grands amiraux"
JAP_a_nation_of_the_greatest_admirals_desc: "La nation japonaise est une nation avec une longue histoire d'amiraux légendaires. Tōgō, Yamamoto, Nagano, Ozawa et bien d'autres ont mené leurs flottes à la gloire par des manœuvres spectaculaires. Bien que certains de ces hommes soient controversés selon les normes modernes, leurs réalisations ne doivent pas être éclipsées. Bientôt, une nouvelle génération de grands amiraux se dressera pour défendre le PDTO contre tous ceux qui oseraient s'opposer à sa souveraineté !"
JAP_a_new_generation_escort: "Une nouvelle génération d'escorteurs"
JAP_a_new_generation_escort_desc: "Une nouvelle marine exige une nouvelle génération d'escorteurs à ses côtés. Nos classes de destroyers et de frégates actuelles fonctionnent très bien, mais les avancées technologiques récentes rendent évident le besoin de s'adapter aux réalités modernes. Un escorteur élancé, hautement automatisé, furtif et riche en drones, équipé des dernières avancées en IA, conçu pour toutes les missions à la fois."
JAP_accelerate_mitsubishi_f_x_development: "Accélérer le développement du Mitsubishi F-X"
JAP_accelerate_mitsubishi_f_x_development_desc: "Avec les États-Unis consumés par la guerre civile et leur industrie de défense en effondrement, nous ne pouvons plus nous permettre de compter sur le matériel américain pour nos besoins de défense les plus urgents. Nos anciens bienfaiteurs étant hors jeu, le programme Mitsubishi F-X est notre seule option pour nous défendre, nous et nos alliés, contre toute agression. Nos scientifiques créeront un chasseur préparé pour les cieux des années 2020 et au-delà : le F-X Godzilla. C'est un risque coûteux et périlleux, mais nous ne pouvons pas nous retrouver dépendants à nouveau, pas maintenant."
JAP_accelerate_mitsubishi_f_x_development_tt: "Sera ajouté au stock :\n§Y50 Mitsubishi F-X Godzilla§!"
JAP_accelerated_digitalization: "Digitalisation accélérée"
JAP_accelerated_digitalization_flag: "A terminé la décision £GFX_decision_icon_small : §YDigitalisation accélérée§!"
JAP_amphibious_assault_vehicles_development: "Développement de véhicules d'assaut amphibies"
JAP_amphibious_assault_vehicles_development_desc: "Soutenir l'infanterie avec des véhicules blindés dotés d'une puissance de feu sérieuse est une pierre angulaire incontestable de la guerre moderne, et en tant que nation insulaire, nous devons trouver un moyen d'avoir un tel soutien qui s'adapte à notre géographie. La solution est naturellement déjà disponible, une solution que nous adopterons sans tarder : les véhicules d'assaut amphibies. Immédiatement, notre complexe militaro-industriel sera chargé de concevoir, tester et fabriquer des véhicules blindés amphibies modernes pour notre armée et nos marines. Bientôt, nos forces auront ce dont elles ont besoin, et quand la guerre viendra, nos soldats auront la mobilité pour être partout dans le Pacifique."
JAP_amphibious_assault_vehicles_development_tt: "§Y4 Brigades de Marines d'élite « Suduza Wodorazi »§! seront créées dans §Ynotre capitale§! :\n§C  - Dai-Ichi Marin Shidan 'Kasuga Ayumu'\n  - Dai-Ni Marin Shidan 'Takino Tomo'\n  - Dai-San Marin Shidan 'Chiyo Mihama'\n  - Dai-Yon Marin Shidan 'Mizuhara Koyomi'§!"
JAP_asia_markets_cooldown: "S'approprier déjà les marchés asiatiques"
JAP_asias_best_officers: "Les meilleurs officiers d'Asie"
JAP_asias_best_officers_desc: "Développer une armée est une chose, mais si elle est dirigée par des officiers bornés, elle n'ira pas loin. Nous réformerons le corps des officiers pour nous assurer que le Japon produise les chefs les plus intelligents et adaptables, capables de commander des opérations complexes sur tous les fronts en Asie, en collaboration étroite avec d'autres capitaines de nos alliés du PDTO."
JAP_cement_japanese_capitalism: "Cimenter un capitalisme à visage japonais"
JAP_conduct_pdto_naval_exercises: "Conduire des exercices navals du PDTO"
JAP_confront_chinese_maritime_dominance: "Affronter la domination maritime chinoise"
JAP_confront_chinese_maritime_dominance_desc: "La marine de l'Armée populaire de libération constitue une menace sérieuse pour notre domination des mers. La nation chinoise a un bien meilleur avantage sur nous et pourrait sérieusement surpasser notre production d'armada. Pour contrer cela, notre flotte doit être de la plus haute qualité au monde. Aucun navire japonais n'enviera jamais ses homologues chinois, et le moment venu, les vaisseaux de la Chine seront à la merci de la JMSDF."
JAP_cooperation_with_hyundai_rotem: "Coopération avec Hyundai Rotem"
JAP_cooperation_with_hyundai_rotem_desc: "La Hyundai Rotem Company est l'une des firmes industrielles lourdes les plus importantes de Corée du Sud, rivalisant et même dépassant par son ampleur certaines de nos propres firmes. C'est aussi le plus grand fabricant de chars de la péninsule, produisant des modèles qui ont suscité un grand intérêt dans le monde entier. Comme nos deux nations font face aux mêmes menaces régionales, il est temps pour nous d'établir une coopération plus étroite avec l'entreprise. Avec nos industries et les leurs travaillant ensemble, notre coopération apportera sûrement des avancées majeures pour nos forces blindées."
JAP_create_a_joint_komatsu_larsen_toubro_light_tank_plant_in_hazira: "Créer une usine commune Komatsu-Larsen & Toubro de chars légers à Hazira"
JAP_create_a_joint_mitsubishi_heavy_industries_hyundai_rotem_tank_plant_in_busan: "Créer une usine commune Mitsubishi Heavy Industries-Hyundai Rotem de chars à Busan"
JAP_creation_of_a_attack_helicopter_fleet: "Création d'une flotte d'hélicoptères d'attaque"
JAP_creation_of_a_attack_helicopter_fleet_desc: "Outre les chars et l'artillerie, l'utilisation d'aéronefs, en particulier d'hélicoptères d'attaque, pour soutenir l'infanterie sur le champ de bataille est une nécessité non négociable de nos jours. Le Japon possède un nombre notable d'hélicoptères d'attaque, principalement des modèles américains, mais vu la façon dont les choses évoluent autour de nous, ce n'est pas suffisant. Notre industrie sera mise au travail pour fabriquer davantage de nos modèles actuels d'hélicoptères d'attaque ou nous nous tournerons vers nos partenaires internationaux pour en acheter plus. Quoi qu'il en soit, nous avons besoin de plus de ces machines si nous voulons des capacités d'appui aérien efficaces pour notre infanterie."
JAP_creation_of_a_new_military_doctrine: "Création d'une nouvelle doctrine militaire"
JAP_creation_of_a_new_military_doctrine_desc: "Nous ne devons pas nous concentrer uniquement sur le développement d'un meilleur équipement militaire, nous devons savoir comment l'utiliser efficacement. Nos doctrines reposaient sur de vieilles théories datant de l'époque de la coopération américaine, et bien qu'elles constituent une grande partie de la base de notre doctrine actuelle, elles ne sont pas sans défauts, comme l'ont prouvé nos erreurs dans la défense de Taïwan. Une nouvelle doctrine est nécessaire, une qui convient le mieux à notre situation."
JAP_deep_modernization_of_nato_fighter_jets: "Modernisation approfondie des chasseurs de l'OTAN"
JAP_deep_modernization_of_nato_fighter_jets_desc: "Le Japon possède une flotte formidable d'avions modernes, majoritairement des véhicules américains acquis au fil des ans. Ces aéronefs sont capables et de qualité, mais au fil des ans, ils vieillissent bien sûr et manquent de nouvelles capacités. Sachant cela, nous ne nous laisserons pas distancer. Un effort de modernisation approfondi sera lancé pour mettre nos chasseurs au niveau du champ de bataille moderne. Qu'il s'agisse d'une rénovation de la cellule, de mises à niveau électroniques ou de nouveaux capteurs, nous ajouterons tout ce qui est nécessaire pour garantir que notre force aérienne restera incontestable dans les cieux."
JAP_deep_modernization_of_nato_fighter_jets_tt: "Sera ajouté au stock :\n§Y250 F-22 Raptor\n250 F-16/IQ§!"
JAP_defend_the_home_islands_prop: "§YPROPAGANDE :§! Défendre les îles de la Patrie !"
JAP_defend_the_home_islands_prop_desc: "\n\n\n\n\n£GFX_JAP_defend_the_home_islands_banner\n\n\n\n\n\n"
