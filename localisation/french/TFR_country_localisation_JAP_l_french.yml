JAP_submarines_accelerated_production_idea: "Production accélérée de sous-marins"
JAP_the_fleets_of_asia_are_strong_and_united: "Les flottes d'Asie sont fortes et unies"
JAP_the_fleets_of_asia_are_strong_and_united_desc: "En regardant nos espoirs de victoire, nous ne devons pas nous contenter de regarder nos ports. Nos alliés dépendent aussi des mers pour survivre, ce qui signifie que leurs marines ne sont pas très différentes des nôtres. C'est le devoir du Japon de se tenir aux côtés des marines du PDTO non pas en tant qu'hégémon, mais comme la voix directrice qui conduira toutes les flottes d'Asie contre les espoirs de supériorité de la Chine."
JAP_the_fleets_of_asia_are_strong_and_united_tt: "Chaque §Cmembre du PDTO§! recevra l'§Cesprit national suivant§! :"
JAP_the_japanese_armada: "L'Armada japonaise"
JAP_the_japanese_armada_desc: "Il n'y a pas de doute. Nous sommes situés sur un archipel, ce qui signifie que nous avons plusieurs voies maritimes à protéger et surveiller, ainsi que la vaste distance entre nous et le reste de nos alliés. Notre marine doit avoir de solides capacités pour défendre toutes ces eaux contre toute forme d'ingérence chinoise. Nous avons le budget pour maintenir cette flotte, alors pourquoi attendre ?"
JAP_the_mosquito_fleet: "La flotte moustique"
JAP_the_mosquito_fleet_desc: "Alors que nous avons préféré opérer sous un système d'Armada par le passé, notre situation actuelle prouve qu'il est presque impossible d'en soutenir un en combattant contre l'usine du Monde. Au lieu de cela, nous fonctionnerons sous le prétexte de vaisseaux légers, bon marché, mais avancés pour mieux rivaliser avec la PLAN en nombre."
JAP_the_sun_rises_again_prop: "§YPROPAGANDE :§! Le soleil se lève à nouveau"
JAP_the_sun_rises_again_prop_desc: "\n\n\n\n\n£GFX_JAP_the_sun_rises_again_banner\n\n\n\n\n\n"
JAP_yamato_reborn: "Yamato renaît"
JAP_yamato_reborn_desc: "Le Yamato n'était pas n'importe quel cuirassé ; c'était le vaisseau dominant de la Marine impériale japonaise et un témoignage de la domination du Soleil levant sur ses adversaires. Depuis qu'il a été coulé, il n'y a jamais eu de tentatives pour construire un vaisseau d'une échelle similaire. Cependant, les menaces posées par la PLAN exigent qu'il soit ressuscité, et pour le bien du monde libre, cet appel sera entendu."
PDTO_pdto_fleets_coordination_idea: "Coordination des flottes du PDTO"

jap.188.a: "L'homme n'est rien, l'œuvre est tout."
jap.188.d: "Peu importe la détermination du conducteur, cela ne donne pas la liberté à la locomotive. Ce conducteur ou cet autre est placé sur telle ou telle locomotive par la volonté capricieuse des dieux. Cependant, presque chaque locomotive, jusqu'à ce qu'elle rouille, avance. C'est la majesté extérieure de la locomotive.\n\nChacun de nous est une locomotive. Notre travail n'est rien de plus que la fumée et les étincelles que nous lançons dans le ciel. Les gens qui marchent le long du remblai du chemin de fer savent, à la fumée et aux étincelles, qu'une locomotive à vapeur arrive. Ou qu'elle vient de passer. La fumée et les étincelles, si nous parlons d'une locomotive électrique, peuvent être remplacées par un grondement.\n\nLe Japon est la locomotive à vapeur, et notre économie est les rails sur lesquels le train se précipite. Cependant, les rails ont tendance à rouiller et à se détériorer, et la même situation est arrivée à notre économie. Des années de bureaucratie pléthorique, d'étiquette d'entreprise rigide, de manque d'initiative privée et de paresse des travailleurs japonais, et de retard technologique ne sont que les raisons les plus saillantes de notre échec. La guerre à Taïwan a ouvert ce pustule, et nous voyons les conséquences de décennies de négligence de ces problèmes. Maintenant, nous devrons réorganiser notre économie, et pour y parvenir, nous devrons tous travailler beaucoup plus dur qu'auparavant, même sans vacances payées et heures supplémentaires. Nous devrons devenir une seule machine, et chacun de nous un engrenage. Mais ne désespérez pas : notre sacrifice sera gravé dans la mémoire de nos enfants et petits-enfants, je vous l'assure. Après tout, nous n'avons pas le droit de faire une seconde erreur de ce genre.\n\nC'est pourquoi les mots de Flaubert me sont si chers :"
jap.188.t: "Nouveau cours du capitalisme japonais"
jap.189.a: "Limitons-nous à la digitalisation du gouvernement."
jap.189.b: "Nous avons besoin d'une digitalisation complète !"
jap.189.d: "Il y a une blague : dans les années 1980, le Japon était dans les années 2000, et dans les années 2020, il continue d'y rester. Aussi difficile que ce soit à admettre, ce constat n'est pas une blague. Il y a de nombreuses raisons à ce phénomène : que ce soit l'approche extrêmement conservatrice du gouvernement et des entreprises en ce qui concerne les méthodes de transmission de l'information, les conséquences des années 90 - tout cela affecte considérablement notre économie et, par conséquent, la capacité de combat de notre armée.\n\nPour la victoire, nous avons besoin de la digitalisation. La seule question est de savoir comment l'aborder.\n\nLa première approche implique une digitalisation « douce ». Le Japon est connu comme un pays d'harmonie, et il n'y a aucune raison pour nous de détruire des décennies de tradition, comme l'ont fait nos voisins communistes dans leur quête du profit. Au lieu de cela, nous donnerons l'exemple aux entreprises et aux citoyens en commençant la digitalisation de notre gouvernement. Plus de bureaucratie : tout ce que vous avez à faire est de vous connecter à l'application sur votre smartphone. Payer des amendes, la résidence numérique, appeler un médecin ou se plaindre d'un problème urgent n'obligera plus nos citoyens à transporter des dizaines de feuilles avec eux. Et les entreprises, observant nos succès, commenceront elles-mêmes le processus de digitalisation.\n\nCependant, il y a une seconde voie. La situation dans laquelle se trouve le Japon ne peut être résolue par des demi-mesures. Nous avons besoin de la digitalisation de toute la société. Nous avons déjà des projets comme la Société 5.0 visant à attirer les dernières technologies, la seule question est la mise en œuvre, qui est ralentie par les processus dans notre société. À court terme, cette approche provoquera un mécontentement évident parmi tous les segments de la société, des dirigeants du parti conservateur et des magnats des affaires aux travailleurs ordinaires, mais c'est cette approche qui nous permettra de sortir pour toujours du trou dans lequel se trouve notre pays. De plus, imaginez Tokyo dans seulement 10 ans : un taxi sans conducteur, des robots dans les rues et l'IA au travail, le paiement sans contact et les services 5G - cela vous plaît ? Alors taisez-vous et acceptez les nouvelles réalités.\n\nLe choix est vôtre, Monsieur le Ministre."
jap.189.t: "Digitalisation"
jap.190.a: "Demain sera meilleur."
jap.190.d: "La guerre à Taïwan, que nous avons perdue à cause de divers facteurs socio-économiques, a laissé une cicatrice sur le visage de notre pays, qui, comme il nous semblait à l'époque, ne pouvait être cachée. L'économie était en ruines, l'armée était déshonorée, et le peuple japonais, autrefois fier et travailleur, était dans un état qu'il n'avait pas connu depuis la défaite honteuse de 1945.\n\nMais nous avons quand même refusé de le prendre pour acquis. Le Japon a pu trouver une issue, même à une situation aussi désespérée. L'économie japonaise connaît une ascension sans précédent, et la marque « Fabriqué au Japon » remplit à nouveau les rayons des magasins du monde entier. Les produits de Toyota, Toshiba et Sharp surpassent à bien des égards ceux des concurrents européens, l'Internet connaît à nouveau une période de japonisation, et les entrepreneurs investissent des sommes sans précédent dans le secteur financier.\nLe rêve japonais a été ravivé - conservateur, traditionnel, et notre peuple est à nouveau loyal envers son État et l'Empereur. Les sourires des mères et les rires des enfants sont à nouveau visibles dans les rues, les jeunes retournent dans les villages, et Tokyo se transforme lentement d'une métropole bondée en la ville du futur.\n\nDes temps difficiles attendent l'Empire. L'ennemi de l'autre côté de la mer prépare déjà sa machine de guerre pour tenter de nous détruire. Mais nous avons encore le temps de nous préparer et de couper la tête du serpent rouge une fois pour toutes.\n\nQuand ils arriveront, nous serons prêts."
jap.190.t: "L'ère Reiwa accomplie"
