JAP_aging_population_2_idea_desc: "Plus de 76,4 % de la population japonaise est considérée comme âgée, principalement en raison d'une période d'infertilité après le baby-boom d'après-guerre des années 1940 et d'une espérance de vie élevée. Malgré ce déséquilibre démographique extrême, il n'y a pas de réelle perception d'une crise démographique, et les standards de vie restent relativement élevés aujourd'hui. Cependant, cela a entraîné une forte pression économique sur l'économie japonaise déjà stagnante, en grande partie due au grand nombre de retraités et à la forte demande de services de soins imposée au gouvernement. Le gouvernement japonais a commencé à introduire de nouvelles façons pour les personnes âgées de redevenir actives dans la société, tout en subventionnant les nouvelles familles et en encourageant fortement la naissance de nouveaux enfants avec des services de garde plus accessibles."
