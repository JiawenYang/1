 ZZZ_spirit_canzuk:0 "Union CANZUK"
 ZZZ_spirit_canzuk_desc:0 "Londres, Ottawa, Canberra et Wellington mettent en commun leurs marchés, leur planification de défense et leur représentation diplomatique dans un cadre CANZUK unique. La libre circulation et les achats conjoints lient quatre économies du Commonwealth en un seul bloc, chaque membre conservant son propre parlement."
 ZZZ_spirit_maphilindo:0 "Maphilindo"
 ZZZ_spirit_maphilindo_desc:0 "Kuala Lumpur, Manille et Jakarta relancent l'idée du Maphilindo comme confédération du monde malais : marchés partagés, patrouilles maritimes coordonnées et position commune sur la mer de Chine méridionale. Le projet repose sur des institutions faibles et sur la méfiance de chacun envers la capitale qui revendique la direction."
 ZZZ_spirit_nordic_union:0 "Union nordique"
 ZZZ_spirit_nordic_union_desc:0 "Les cinq États nordiques fusionnent leurs marchés du travail, leurs achats de défense et leurs services diplomatiques en une seule union nordique. Un niveau de vie élevé et de faibles populations rendent l'intégration peu coûteuse ; le poids de l'union en Europe augmente d'autant."
 ZZZ_cr_spirit_canzuk:0 "Test de spirit : Union CANZUK"
 ZZZ_cr_spirit_canzuk_desc:0 "Débogage uniquement : applique le spirit de l'Union CANZUK à ce pays. Le cours normal l'attribue automatiquement depuis le drapeau national is_CANZUK."
 ZZZ_cr_spirit_maphilindo:0 "Test de spirit : Maphilindo"
 ZZZ_cr_spirit_maphilindo_desc:0 "Débogage uniquement : applique le spirit du Maphilindo à ce pays. Le cours normal l'attribue automatiquement depuis le drapeau national is_MAPHI."
 ZZZ_cr_spirit_nordic_union:0 "Test de spirit : Union nordique"
 ZZZ_cr_spirit_nordic_union_desc:0 "Débogage uniquement : applique le spirit de l'Union nordique à ce pays. Le cours normal l'attribue automatiquement depuis le drapeau national is_SCA."
 ZZZ_spirit_cam_union:0 "Union centraméricaine"
 ZZZ_spirit_cam_union_desc:0 "Managua intègre le Honduras, le Guatemala, le Salvador et le Belize dans un même appareil partisan et militaire, faisant revivre le cadre fédéral centraméricain. L'union repose sur le parti d'avant-garde et l'appareil de sécurité plutôt que sur des procédures représentatives."
 ZZZ_spirit_cam_republic:0 "République centraméricaine"
 ZZZ_spirit_cam_republic_desc:0 "San Salvador absorbe le Nicaragua, le Honduras et le Belize dans une république centrée sur la présidence, maintenant l'ordre par les forces de sécurité, la centralisation fiscale et des accords extérieurs. Sa légitimité repose sur les résultats sécuritaires et la croissance, non sur un partage fédéral du pouvoir."
 ZZZ_cr_spirit_cam_union:0 "Test de spirit : Union centraméricaine"
 ZZZ_cr_spirit_cam_union_desc:0 "Débogage uniquement : applique le spirit de l'Union centraméricaine à ce pays. Le cours normal l'attribue automatiquement depuis CAM_union_formed."
