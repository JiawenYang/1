 ZZZ_spirit_china_reunification:0 "Chine réunifiée"
 ZZZ_spirit_china_reunification_desc:0 "La division inter-détroit est close : l'industrie, les ports et l'administration de l'île sont intégrés au cadre continental. La réunification règle la question de la souveraineté, sans faire de Pékin l'arbitre de l'ordre asiatique tout entier."
 ZZZ_spirit_indochina_federation:0 "Fédération indochinoise"
 ZZZ_spirit_indochina_federation_desc:0 "Hanoï rattache le Laos et le Cambodge à un même espace administratif indochinois par les réseaux du parti, l'alignement monétaire et des infrastructures communes. La fédération rétablit un cadre d'époque coloniale sous direction vietnamienne, et les membres plus petits s'en méfient."
 ZZZ_spirit_yugoslavia_revival:0 "Renaissance yougoslave"
 ZZZ_spirit_yugoslavia_revival_desc:0 "Belgrade rassemble les Balkans occidentaux dans un cadre yougoslave, échangeant l'hostilité de guerre contre une union douanière, une police commune et un commandement joint. L'ancienne question revient intacte : une seule capitale peut-elle tenir plusieurs nations ensemble ?"
 ZZZ_spirit_ottoman_restoration:0 "Restauration ottomane"
 ZZZ_spirit_ottoman_restoration_desc:0 "La ligne néo-ottomane est menée à son terme : Ankara reconstruit une sphère d'influence sur les terres de l'ancien empire, avec symboles ottomans, missions militaires et marché commun. La république garde sa constitution mais gouverne comme un empire restauré."
 ZZZ_cr_spirit_china_reunification:0 "Test de spirit : Chine réunifiée"
 ZZZ_cr_spirit_china_reunification_desc:0 "Débogage uniquement : applique le spirit de la Chine réunifiée à ce pays afin de vérifier son icône, son texte et ses modificateurs. Le cours normal l'attribue automatiquement depuis PRC_taiwan_war_won."
