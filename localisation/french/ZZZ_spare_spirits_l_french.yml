l_french:
 ZZZ_spirit_korea_confederation:0 "Confédération de la péninsule coréenne"
 ZZZ_spirit_korea_confederation_desc:0 "Deux gouvernements souverains conservent leurs frontières et leurs institutions, ne partageant que des organes permanents pour la défense, la diplomatie et les normes industrielles. La confédération n'est pas un État unique : le retrait de l'une des parties paralyse l'ensemble du cadre."
 ZZZ_spirit_korea_unified:0 "Unification de la péninsule coréenne"
 ZZZ_spirit_korea_unified_desc:0 "La ligne d'armistice a disparu et un seul gouvernement administre toute la péninsule. L'industrie du Sud, les réseaux de ressources du Nord et l'armée réunifiée passent sous un commandement unique ; les gains de l'intégration sont réels, mais l'absorption d'une société organisée depuis soixante-dix ans autour d'un autre État a un coût."
 ZZZ_spirit_uar_unity:0 "République arabe unie"
 ZZZ_spirit_uar_unity_desc:0 "Le Caire fond les ressources et les marchés du monde arabe dans un même cadre administratif. La république tire sa légitimité du drapeau panarabe, mais les revendications autonomistes des provinces restent une fracture interne permanente."
 ZZZ_spirit_balkan_federation:0 "Fédération balkanique"
 ZZZ_spirit_balkan_federation_desc:0 "Belgrade utilise la reconnaissance économique mutuelle et la défense commune pour entraîner les États balkaniques dans une communauté fédérale lâche. Les membres conservent leur souveraineté ; les organes fédéraux ne contrôlent que les tarifs, les infrastructures et une force commune."
 ZZZ_spirit_eurasian_state:0 "État de l'Union eurasiatique"
 ZZZ_spirit_eurasian_state_desc:0 "Moscou réintègre l'espace postsoviétique par une union douanière, un réseau énergétique unique et une défense aérienne commune. La souveraineté est mise en commun dans la macroéconomie et les forces stratégiques, tandis que la culture et l'administration restent aux républiques."
 ZZZ_spirit_eu_federation:0 "Fédération européenne"
 ZZZ_spirit_eu_federation_desc:0 "Après que les États membres ont cédé leur souveraineté budgétaire et de défense, Bruxelles devient un gouvernement fédéral de fait. Un budget commun, des obligations conjointes et une armée européenne donnent à la fédération sa propre base financière et militaire."
 ZZZ_spirit_east_asia_sphere:0 "Sphère de coprospérité de la grande Asie orientale"
 ZZZ_spirit_east_asia_sphere_desc:0 "Tokyo lie les économies d'Asie orientale à une hiérarchie centrée sur le Japon par des prêts en yens, des achats de ressources et une escorte maritime. La sphère attache ses membres par le commerce et la sécurité, au prix de leur autonomie diplomatique."
 ZZZ_spirit_greater_india:0 "Grande Inde"
 ZZZ_spirit_greater_india_desc:0 "New Delhi réunit les tarifs, les chemins de fer et les eaux du sous-continent dans un espace administratif unique. L'union se présente comme un régime constitutionnel laïque, mais les divisions religieuses et linguistiques maintiennent un coût d'intégration central élevé."
 ZZZ_spirit_greater_china:0 "Grande Chine"
 ZZZ_spirit_greater_china_desc:0 "La guerre d'Asie tournant à l'avantage de Pékin, les nouveaux territoires et les routes de la mer de Chine méridionale sont intégrés à la planification centrale. Un marché unifié et un réseau d'infrastructures renforcent la mobilisation tout en poussant la complexité de la gouvernance à ses limites."
 ZZZ_cr_spirit_korea_confederation:0 "Test de spirit : Confédération de la péninsule coréenne"
 ZZZ_cr_spirit_korea_confederation_desc:0 "Débogage uniquement : applique le spirit de la Confédération de la péninsule coréenne à ce pays afin de vérifier son icône, son texte et ses modificateurs. Le cours normal l'attribue automatiquement depuis korean_confederation_formed."
