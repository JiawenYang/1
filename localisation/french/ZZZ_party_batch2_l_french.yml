l_french:
 zzz_party.10.t:0 "Un nouveau locataire à la Maison-Blanche"
 zzz_party.10.d:0 "Le candidat républicain remporte l'élection de 2016. Le nouveau président prête serment et Washington passe du libéralisme au conservatisme."
 zzz_party.10.a:0 "Accepter le résultat"
 zzz_party.14.t:0 "Le Labour à Downing Street"
 zzz_party.14.d:0 "Le Labour remporte une victoire écrasante en 2024. Quatorze ans de règne conservateur s'achèvent et la Grande-Bretagne se tourne vers la social-démocratie."
 zzz_party.14.a:0 "Accepter le résultat"
 zzz_party.15.t:0 "Un nouveau visage à l'Élysée"
 zzz_party.15.d:0 "Le candidat centriste remporte l'élection présidentielle. L'Élysée a un nouveau maître et la politique française s'écarte du clivage gauche-droite traditionnel."
 zzz_party.15.a:0 "Accepter le résultat"
 zzz_party.100.t:0 "Un nouveau locataire à la Maison Bleue"
 zzz_party.100.d:0 "Le candidat du Parti démocrate remporte l'élection présidentielle de 2017. Le vent politique de Séoul tourne vers le libéralisme."
 zzz_party.100.a:0 "Accepter le résultat"
 zzz_party.101.t:0 "La présidence de Yongsan"
 zzz_party.101.d:0 "Le candidat conservateur remporte l'élection présidentielle de 2022. Le pouvoir change de mains en Corée et la politique se durcit face au Nord et se rapproche de Washington."
 zzz_party.101.a:0 "Accepter le résultat"
 zzz_party.102.t:0 "Une nouvelle coalition à Rome"
 zzz_party.102.d:0 "Le Mouvement 5 étoiles et la Ligue forment un gouvernement de coalition. La carte politique de Rome est remodelée par les forces populistes."
 zzz_party.102.a:0 "Accepter le résultat"
 zzz_party.104.t:0 "Le centre revient à Varsovie"
 zzz_party.104.d:0 "La Coalition civique obtient la majorité aux législatives de 2023. La politique polonaise revient à une ligne centriste pro-européenne."
 zzz_party.104.a:0 "Accepter le résultat"
 zzz_party.106.t:0 "Le Labour prend Canberra"
 zzz_party.106.d:0 "Le Labour remporte les élections de 2022. Le centre de gravité politique de Canberra se déplace vers la social-démocratie et le climat."
 zzz_party.106.a:0 "Accepter le résultat"
 zzz_party.107.t:0 "Une dynastie revient à Manille"
 zzz_party.107.d:0 "La famille Marcos revient au pouvoir lors de l'élection présidentielle de 2022. Manille renoue avec la politique des hommes forts et des clans."
 zzz_party.107.a:0 "Accepter le résultat"
 zzz_party.110.t:0 "Un président outsider à Kyiv"
 zzz_party.110.d:0 "Un comédien devenu homme politique remporte l'élection présidentielle de 2019. Le paysage politique de Kyiv est réécrit."
 zzz_party.110.a:0 "Accepter le résultat"
 zzz_party.111.t:0 "Une vague de droite à Brasília"
 zzz_party.111.d:0 "Bolsonaro remporte l'élection présidentielle de 2018. La politique brésilienne se tourne vers le populisme de droite."
 zzz_party.111.a:0 "Accepter le résultat"
 zzz_party.112.t:0 "Le retour de Lula"
 zzz_party.112.d:0 "Lula bat le président sortant à l'élection de 2022. Le Brésil revient à une ligne de gauche et social-démocrate."
 zzz_party.112.a:0 "Accepter le résultat"
 zzz_party.113.t:0 "Un libertarien à Buenos Aires"
 zzz_party.113.d:0 "Milei remporte l'élection présidentielle de 2023. L'Argentine se tourne vers le libre marché radical et le populisme de droite."
 zzz_party.113.a:0 "Accepter le résultat"
 zzz_party.171.t:0 "Le Mexique bascule à gauche"
 zzz_party.171.d:0 "López Obrador remporte l'élection présidentielle de 2018 à la tête de la coalition menée par le MORENA. Le nouveau gouvernement promet d'en finir avec la corruption des anciens partis et de réorienter la politique économique du pays."
 zzz_party.171.a:0 "Accepter le résultat"
 zzz_party.172.t:0 "Sheinbaum poursuit la transformation"
 zzz_party.172.d:0 "Sheinbaum remporte l'élection présidentielle de 2024 avec le meilleur score depuis des décennies. Le MORENA conserve le pouvoir et sa coalition avec les Verts et le Parti du travail se poursuit."
 zzz_party.172.a:0 "Accepter le résultat"
