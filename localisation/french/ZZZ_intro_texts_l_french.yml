l_french:
 FRA_MODERN_DAY_DESC: "La Cinquième République vit encore sous l'ombre d'une croissance faible et d'un chômage élevé : la croissance est restée inférieure à 1,5 % en 2016, le chômage oscille autour de 10 % et celui des jeunes est bien plus élevé. L'élection présidentielle de mai 2017 fixera le cap du pays, et pour la première fois la question est ouverte de savoir si les deux partis qui gouvernent depuis 1958 pourront tenir le second tour. Membre fondateur de l'Union européenne et membre permanent du Conseil de sécurité, la France partage avec l'Allemagne la conduite de l'intégration européenne après le Brexit, tout en déployant plusieurs milliers d'hommes au Sahel dans le cadre de l'opération Barkhane et en maintenant l'état d'urgence sur son territoire.\nLa réforme économique, l'orientation de l'Union et la cohésion sociale seront tranchées par le prochain occupant de l'Élysée."
 RAJ_MODERN_DAY_DESC: "L'Inde est la puissance dominante du sous-continent sud-asiatique : un milliard trois cents millions d'habitants et une économie d'environ 2 600 milliards de dollars, dont la croissance dépasse celle de toutes les autres grandes économies. La démonétisation de novembre 2016 a retiré plus de 80 % des billets en circulation et ébranlé l'économie de l'argent liquide, en ville comme au village ; la taxe sur les biens et services prévue en juillet 2017 doit fondre les régimes fiscaux fragmentés des États en un seul impôt national.\nÀ l'étranger, New Delhi approfondit sa coopération de défense avec Washington tout en maintenant ses liens d'armement historiques avec Moscou, et travaille l'Asie du Sud-Est au titre de sa politique « Act East » ; l'arme nucléaire et l'engagement de non-recours en premier constituent son plancher stratégique. L'insurrection au Cachemire, une frontière non délimitée avec la Chine et une porte toujours fermée au Groupe des fournisseurs nucléaires restent les problèmes entêtants d'un pays qui veut un siège permanent au Conseil de sécurité."
 IND_MODERN_DAY_DESC: "L'Indonésie, ce sont dix-sept mille îles et deux cent soixante millions d'habitants, le plus grand pays musulman du monde et le centre de gravité de facto de l'ASEAN. Le gouvernement de Joko Widodo a réorienté le budget vers les ports, les chemins de fer et les centrales électriques pour coudre l'archipel par les infrastructures, tandis que l'amnistie fiscale de 2016 libérait la marge de financement nécessaire.\nJakarta reste volontairement discrète en mer de Chine méridionale, mais ses navires ont affronté à plusieurs reprises flottilles de pêche et gardes-côtes chinois près des îles Natuna, et le conflit séparatiste en Papouasie absorbe encore des unités de l'armée. Vieil membre du Mouvement des non-alignés, l'Indonésie se présente désormais comme un pivot maritime mondial et ménage prudemment Washington et Pékin."
 AST_MODERN_DAY_DESC: "Les vingt-quatre millions d'Australiens se répartissent sur près de 7,7 millions de kilomètres carrés. La phase d'investissement du boom minier est achevée et la croissance s'est stabilisée autour de 2,5 %. La Chine absorbe plus d'un tiers des exportations australiennes ; minerai de fer, charbon et gaz naturel liquéfié laissent Canberra prise entre sécurité et prospérité — pilier du système d'alliances américain qui ne peut se passer de son premier client asiatique.\nLe gouvernement Turnbull a promis un réarmement dans son livre blanc de défense de 2016 et verrouille les approches maritimes au titre de l'opération Sovereign Borders. Le continent apprend une leçon difficile : garder son autonomie stratégique en devant sa défense à un partenaire et ses revenus à un autre."
 SPR_MODERN_DAY_DESC: "L'Espagne vient tout juste de sortir de l'abîme de la crise de la dette souveraine : le chômage frôle encore 19 %, celui des jeunes approche 40 %, et la dette publique atteint environ 100 % du produit intérieur. Le gouvernement minoritaire de Mariano Rajoy avance péniblement au Parlement, tandis que la revendication indépendantiste catalane remet sur la table la vieille querelle entre ordre constitutionnel et autonomie régionale.\nMembre de l'Union européenne et de l'OTAN, Madrid ne cède rien sur Gibraltar et subit la pression migratoire dans ses enclaves de Ceuta et Melilla sur la côte marocaine. Un tourisme florissant soutient la reprise, mais rend le pays plus que jamais dépendant de la conjoncture extérieure."
 PRC_socialist_chinese_dream_idea_desc: "Le récit du Rêve chinois socialiste lie le renouveau national à la gouvernance du Parti : les crédits de recherche doivent servir les objectifs de l'État, et les universités comme les think tanks sont pressés de convertir leur production académique en capacité politique et technique utilisable. Dans ce cadre, l'innovation n'est pas un résultat spontané du marché mais une tâche décomposée point par point dans les plans quinquennaux, et le critère de réussite est la vitesse de sa mise en œuvre."
 SOV_integralists_idea_desc: "Dans l'usage russe, les intégristes ne sont ni des libéraux ni de vieux communistes : ils plaident pour reconstruire la politique et l'économie de l'État autour de l'espace eurasien, en plaçant la souveraineté, la tradition et la mobilisation au-dessus de l'efficacité du marché. Tant que ce courant occupe une place au sommet du pouvoir, les décisions du Kremlin seront plus concentrées, plus affirmées et plus portées à traiter la politique étrangère comme un affrontement de civilisations."
 BRA_MODERN_DAY_DESC: "Le Brésil vient de traverser la pire récession de son histoire : la production s'est contractée de plus de 7 % sur 2015 et 2016, le chômage a dépassé 12 %, et l'enquête Lava Jato a entraîné dans sa chute les élites politiques et économiques. En août 2016, Dilma Rousseff a été destituée et Michel Temer a pris la présidence par intérim, poussant aussitôt un amendement constitutionnel plafonnant les dépenses fédérales pour vingt ans afin de rassurer les marchés et les agences de notation.\nCe géant sud-américain possède la plus grande base industrielle d'Amérique latine et la cinquième population du monde, mais on l'appelle aussi le pays d'avenir qui le restera toujours. Savoir s'il peut convertir la faible croissance qui a suivi le cycle des matières premières en réforme institutionnelle est la question à laquelle l'élection de 2018 devra répondre."
 ISR_MODERN_DAY_DESC: "Près de soixante-dix ans après son indépendance, Israël est passé de la question de la survie à celle de sa définition : la population a dépassé huit millions, le produit par habitant figure parmi les plus élevés des pays développés, et le pays exporte dans le monde entier technologies cyber, dispositifs médicaux et savoir-faire agricole. Pourtant la question palestinienne sous occupation reste sans solution ; l'adoption de la résolution 2334 du Conseil de sécurité fin 2016 a marqué le premier rejet explicite, en droit international, de l'expansion des colonies, et assombri les relations de Jérusalem avec l'administration entrante à Washington.\nAu nord, la guerre civile syrienne a amené les Gardiens de la révolution iraniens et le Hezbollah au bord du Golan ; au sud, le blocus de Gaza et les opérations militaires périodiques consomment autorité morale et effectifs. L'État doit trouver un équilibre durable entre son identité juive et son identité démocratique."
 ETH_MODERN_DAY_DESC: "L'Éthiopie est l'une des grandes économies africaines à la croissance la plus rapide, avec près de 10 % par an pendant une décennie, et le chemin de fer Addis-Abeba–Djibouti ainsi que ses parc industriels ont donné à ce pays enclavé sa première vraie voie vers l'industrialisation. Mais le barrage de la Renaissance sur le Nil bleu a transformé le litige sur l'eau du fleuve en quasi-affrontement avec l'Égypte et le Soudan.\nEn octobre 2016, les protestations en Oromia ont contraint le gouvernement à décréter l'état d'urgence national ; l'EPRDF au pouvoir monopolise la vie politique sous la forme d'une coalition de développement et pousse l'autonomie ethnique fédérale jusqu'à la rupture. Siège de l'Union africaine, l'Éthiopie échange un investissement dirigé par l'État contre la stabilité, au prix d'un espace politique qui se referme."
 FIN_MODERN_DAY_DESC: "Après trois années de quasi-stagnation en 2015 et 2016, la Finlande vient tout juste de renouer avec la croissance : les exportations ont été tirées vers le bas par la demande européenne et par la restructuration industrielle qui a suivi Nokia, et le gouvernement a répondu par un pacte de compétitivité pour contenir les coûts unitaires du travail et par la première expérimentation nationale de revenu de base en Europe. Membre de la zone euro, elle n'a pas de politique monétaire autonome ; État militairement non aligné, elle entretient un partenariat renforcé avec l'OTAN sans jamais franchir le seuil de l'adhésion.\nPlus de mille trois cents kilomètres de frontière avec la Russie : c'est le fait géographique le plus lourd du pays. Helsinki doit tenir un équilibre fragile entre les normes européennes, la garantie de l'OTAN et la tolérance de Moscou."
 ITA_MODERN_DAY_DESC: "L'Italie est la troisième économie de la zone euro et l'une de ses plus lourdement endettées : la dette atteint environ 132 % du produit, le chômage reste au-dessus de 11 % et celui des jeunes proche de 40 %. La défaite du référendum constitutionnel de Matteo Renzi en décembre 2016 l'a fait chuter et a porté au pouvoir le gouvernement technocratique de Paolo Gentiloni, tandis que le sauvetage de Monte dei Paschi le même mois devenait un nouveau cas d'école pour l'assainissement bancaire de la zone euro.\nEn Méditerranée, les bateaux de migrants partis de Libye continuent d'aborder en Sicile et à Lampedusa, imposant la politique européenne des frontières et de l'asile à l'agenda politique italien, tandis que la convergence populiste du Mouvement 5 étoiles et de la Ligue du Nord transforme l'élection de 2018 en référendum sur l'ordre établi."
 SWE_MODERN_DAY_DESC: "La Suède a accueilli plus de cent soixante mille demandeurs d'asile en 2015, puis a brutalement resserré ses frontières, poussant un État-providence qui se veut humanitaire dans un débat national sur l'intégration, le logement et les finances de la protection sociale. L'économie croît encore, mais les bulles immobilières de Stockholm et Göteborg, et l'endettement des ménages contenus par la régulation, empêchent les autorités macroprudentielles de relâcher la pression.\nSur le plan militaire, ce pays non aligné depuis deux siècles a rouvert le débat sur l'OTAN après la Crimée, rétabli une présence de défense permanente sur Gotland et relevé son budget de défense. Pour la Suède, la neutralité n'est plus un état par défaut mais un choix dont il faut sans cesse argumenter le coût."
 NRY_MODERN_DAY_DESC: "La Norvège a enfermé ses revenus pétroliers dans le plus grand fonds souverain du monde, proche de neuf cents milliards de dollars au début de 2017, ce qui lui a permis de maintenir protection sociale et investissement pendant deux années de baisse des prix du pétrole. Membre de l'Espace économique européen et non de l'Union européenne, Oslo accepte la plupart des règles du marché unique venues de Bruxelles tout en gardant des exceptions pour la pêche, l'agriculture et l'immigration.\nÀ la frontière russe du Finnmark et à son avant-poste arctique du Svalbard, la Norvège assume les missions de reconnaissance et de dissuasion du flanc nord de l'OTAN. Un pays de à peine plus de cinq millions d'habitants a acheté l'influence par la richesse énergétique et la sécurité par l'alliance, et les deux doivent être gérés avec prudence entre les grandes puissances."
 heavy_frigate_desc: "La frégate lourde échange du volume de coque contre la tenue en haute mer et la charge utile : radar à antenne active, cellules de lancement vertical et hélicoptère anti-sous-marin lui permettent d'être à la fois la sentinelle de défense aérienne et le noyau anti-sous-marin d'une force navale. Plus coûteuse et de plus grand rayon d'action qu'une frégate légère, elle est conçue pour l'escorte, le blocus et la patrouille hauturière."
