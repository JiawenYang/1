 zzz_elections_uk.1.t:0 "Élections générales au Royaume-Uni"
 zzz_elections_uk.1.d:0 "Le mandat parlementaire est arrivé à son terme. Les sièges des partis finalisent leurs budgets de campagne et les donateurs se positionnent, tandis que l'orientation politique du pays sera décidée dans les urnes."
 zzz_elections_uk.1.a:0 "Financer la campagne du parti au pouvoir (§Y-50§! de puissance politique)"
 zzz_elections_uk.1.b:0 "Financer la campagne du principal parti d'opposition (§Y-75§! de puissance politique)"
 zzz_elections_uk.1.c:0 "Rester en dehors de la campagne"
 zzz_elections_uk.2.t:0 "Les votes sont dépouillés"
 zzz_elections_uk.2.d:0 "L'électorat britannique s'est exprimé. Le principal parti formera désormais le nouveau gouvernement, et un nouveau mandat parlementaire commence."
 zzz_elections_uk.2.a:0 "Accepter le résultat"
