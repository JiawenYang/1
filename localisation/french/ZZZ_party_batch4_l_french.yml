l_french:
 zzz_party.140.t:0 "La Colombie bascule à gauche"
 zzz_party.140.d:0 "Gustavo Petro a remporté l'élection de 2022 et pris ses fonctions, formant le premier gouvernement de gauche de la Colombie ; l'accord de paix et la réforme agraire sont désormais à l'ordre du jour."
 zzz_party.140.a:0 "Accepter le résultat"
 zzz_party.142.t:0 "Un gouvernement social-démocrate à Helsinki"
 zzz_party.142.d:0 "Une coalition de cinq partis dirigée par les sociaux-démocrates a pris ses fonctions à Helsinki, poursuivant la voie de l'État-providence nordique de la Finlande."
 zzz_party.142.a:0 "Accepter le résultat"
 zzz_party.143.t:0 "Le virage à droite de la Finlande"
 zzz_party.143.d:0 "Après les élections de 2023, le Parti de la coalition nationale a dirigé le cabinet, orientant la politique budgétaire et de sécurité de la Finlande vers une ligne plus conservatrice."
 zzz_party.143.a:0 "Accepter le résultat"
 zzz_party.144.t:0 "Nouvelle Démocratie prend Athènes"
 zzz_party.144.d:0 "Nouvelle Démocratie a remporté les élections anticipées et Kyriakos Mitsotakis est devenu Premier ministre, mettant fin au cycle d'austérité consécutif à la crise de la dette."
 zzz_party.144.a:0 "Accepter le résultat"
 zzz_party.145.t:0 "L'Alliance social-démocrate à Reykjavik"
 zzz_party.145.d:0 "Un nouveau gouvernement dirigé par l'Alliance social-démocrate a pris ses fonctions à Reykjavik, infléchissant vers la gauche les politiques sociales et climatiques de l'Islande."
 zzz_party.145.a:0 "Accepter le résultat"
 zzz_party.146.t:0 "Un gouvernement de coalition à Dublin"
 zzz_party.146.d:0 "Le Fianna Fail et le Fine Gael ont formé pour la première fois un gouvernement de coalition, assouplissant le traditionnel bipartisme irlandais."
 zzz_party.146.a:0 "Accepter le résultat"
 zzz_party.147.t:0 "Un gouvernement d'alternance à Jérusalem"
 zzz_party.147.d:0 "Une coalition transpartisane opposée à Netanyahou a pris ses fonctions, produisant un arrangement centriste rare dans la politique israélienne."
 zzz_party.147.a:0 "Accepter le résultat"
 zzz_party.148.t:0 "Le retour de la droite israélienne"
 zzz_party.148.d:0 "Après les élections de 2022, le bloc de droite de Netanyahou a formé un nouveau cabinet, recentrant Israël sur les questions de sécurité et de colonies."
 zzz_party.148.a:0 "Accepter le résultat"
 zzz_party.149.t:0 "Un gouvernement de gauche à Mexico"
 zzz_party.149.d:0 "Andres Manuel Lopez Obrador a remporté l'élection de 2018, portant au pouvoir le premier gouvernement de gauche du Mexique et un virage étatiste de l'énergie et de la lutte contre la pauvreté."
 zzz_party.149.a:0 "Accepter le résultat"
 zzz_party.151.t:0 "Drapeaux rouges sur Katmandou"
 zzz_party.151.d:0 "Le Parti communiste du Népal (UML) a remporté les élections de 2017 et K.P. Sharma Oli est devenu Premier ministre, engageant le Népal sur une voie républicaine de gauche."
 zzz_party.151.a:0 "Accepter le résultat"
 zzz_party.152.t:0 "Un tournant parlementaire à Katmandou"
 zzz_party.152.d:0 "Un nouveau gouvernement dirigé par le Congrès népalais a pris ses fonctions en 2021, ramenant le centre de gravité politique du Népal vers le centrisme parlementaire."
 zzz_party.152.a:0 "Accepter le résultat"
 zzz_party.155.t:0 "Un gouvernement libéral à Bucarest"
 zzz_party.155.d:0 "Un gouvernement dirigé par le Parti national libéral a pris ses fonctions en 2019, consolidant la voie pro-européenne de la Roumanie."
 zzz_party.155.a:0 "Accepter le résultat"
 zzz_party.157.t:0 "La vague anti-corruption à Bratislava"
 zzz_party.157.d:0 "Après les élections de 2020, OLaNO a dirigé le cabinet, remplaçant le précédent gouvernement Smer par une ligne anti-corruption et pro-européenne."
 zzz_party.157.a:0 "Accepter le résultat"
 zzz_party.158.t:0 "Le retour de Smer à Bratislava"
 zzz_party.158.d:0 "Smer a retrouvé le pouvoir après les élections de 2023, marquant un tournant net dans la politique étrangère et médiatique de la Slovaquie."
 zzz_party.158.a:0 "Accepter le résultat"
 zzz_party.159.t:0 "Un gouvernement socialiste à Madrid"
 zzz_party.159.d:0 "Les socialistes de Pedro Sanchez sont arrivés au pouvoir par une motion de censure en 2018, déplaçant le centre de gravité politique de l'Espagne vers la gauche."
 zzz_party.159.a:0 "Accepter le résultat"
 zzz_party.160.t:0 "L'armée prend le pouvoir à Khartoum"
 zzz_party.160.d:0 "Le régime de Bachir est tombé sous la pression des manifestations et un Conseil militaire de transition a pris le pouvoir, ouvrant une période de confrontation entre militaires et civils."
 zzz_party.160.a:0 "Accepter le résultat"
 zzz_party.162.t:0 "Un gouvernement de transition à Bagdad"
 zzz_party.162.d:0 "Adil Abdul-Mahdi a formé un cabinet en 2018, et le système de quotas confessionnels irakien a continué de fonctionner sous la pression des protestations et de la reconstruction."
 zzz_party.162.a:0 "Accepter le résultat"
 zzz_party.163.t:0 "Un gouvernement de gauche à Santiago"
 zzz_party.163.d:0 "Gabriel Boric a remporté l'élection de 2021, portant au pouvoir la première coalition de gauche du Chili et inscrivant la réforme constitutionnelle et le programme social à l'ordre du jour."
 zzz_party.163.a:0 "Accepter le résultat"
