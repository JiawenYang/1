 germany.11.t: "Premier cas de COVID-19"
 germany.11.d: "Le premier cas de coronavirus a été identifié en Allemagne, selon les responsables sanitaires régionaux de Bavière. Le ministère de la Santé du Land du sud de l'Allemagne a indiqué lundi soir qu'un homme de la région de Starnberg, près de Munich, avait été infecté par le virus, mais que son état était bon.\n\nLors d'une conférence de presse mardi matin, les autorités sanitaires bavaroises ont précisé que cet homme de 33 ans avait été contaminé par une collègue chinoise de Shanghai lors d'un séminaire d'entreprise en Bavière la semaine précédente. La femme chinoise avait reçu la visite de ses parents, qui vivent dans la région de Wuhan, avant son voyage en Allemagne.\n\nSelon le communiqué du ministère, les experts considèrent actuellement le risque pour la population bavaroise comme faible. Les pays du monde entier sont en état d'alerte élevé face à ce virus, apparu pour la première fois dans la ville chinoise de Wuhan."
 germany.11.a: "Espérons que cela ne se propage pas"
 germany.33.t: "Début des essais du vaccin Pfizer"
 germany.33.d: "La première phase des essais du vaccin Pfizer a commencé en plusieurs endroits d'Allemagne. L'entreprise a sélectionné un groupe de participants diversifié, incluant des personnes d'âges, d'origines ethniques et d'états de santé différents, afin de garantir l'innocuité et l'efficacité du vaccin pour tous.\n\nLes essais reposent sur un protocole en double aveugle, randomisé et contrôlé par placebo : certains participants ont reçu le vaccin, d'autres un placebo. Les participants ont été étroitement surveillés pour détecter toute réaction indésirable, et des visites régulières auprès des chercheurs ont assuré le bon déroulement de l'essai.\n\nL'entrée des vaccins Pfizer en phase d'essai a marqué un tournant majeur dans la lutte contre la pandémie de COVID-19, et restera un moment historique que les gens regarderont avec gratitude et admiration envers les scientifiques et les chercheurs qui l'ont rendu possible."
 germany.33.a: "Prions pour que cela fonctionne"
 germany.51.t: "Manifestations contre le confinement"
 germany.51.d: "En pleine pandémie de COVID-19, l'Allemagne connaît une vague de manifestations contre le confinement, les citoyens exprimant leur frustration face aux mesures strictes prises par le gouvernement pour limiter la propagation du virus. Des milliers de personnes sont descendues dans les rues de grandes villes comme Berlin, Munich et Francfort pour réclamer la fin des restrictions et s'inquiéter de leur impact sur les libertés civiles.\n\nLes manifestants, issus d'horizons politiques et sociaux divers, se sont unis autour d'un objectif commun : contester l'approche du gouvernement face à la pandémie. Ses critiques estiment que les restrictions sont excessivement dures et frappent de manière disproportionnée les petites entreprises et les familles à faibles revenus, aggravant les difficultés économiques et les inégalités sociales.\n\nFace aux manifestations, les autorités allemandes ont appelé les citoyens à respecter les mesures de confinement, en soulignant l'importance de la santé et de la sécurité publiques pendant la crise. Les responsables ont cité le succès des restrictions pour freiner la propagation du virus et éviter la saturation des hôpitaux.\n\nSi les manifestations témoignent d'un mécontentement croissant au sein de la population allemande, elles illustrent aussi l'équilibre délicat que les gouvernements du monde entier doivent trouver entre la préservation de la santé publique et la protection des libertés individuelles. Alors que la pandémie continue d'évoluer, l'on verra comment les autorités adapteront leurs politiques à la situation et à l'opinion publique."
 germany.51.a: "Rentrez chez vous !"
 germany.51.b: "Le peuple a parlé !"
 germany.164.t: "Baisse des cas de COVID-19"
 germany.164.d: "Après des mois d'efforts, l'Allemagne constate une baisse significative des cas de COVID-19 et des hospitalisations. Les campagnes de vaccination et les mesures de santé publique ont joué un rôle essentiel dans la maîtrise du virus.\n\nLes responsables appellent à la prudence afin que les progrès ne soient pas annulés, mais pour l'instant, la nation se rapproche un peu plus de la normalité."
 germany.164.a: "Des jours meilleurs nous attendent."
 russia.18.t: "Premiers cas de COVID en Russie"
 russia.18.d: "Les premiers cas de coronavirus ont été signalés parmi des citoyens revenant de voyages en Chine. Si le nombre de personnes infectées est actuellement faible, nous ne devons pas négliger ce problème, sous peine de le voir échapper à tout contrôle."
 russia.18.a: "C'est notre problème désormais"
 russia.20.t: "Vladimir Poutine contracte la COVID-19"
 russia.20.d: "Après son dernier voyage dans le Caucase, le président a contracté l'infection au coronavirus COVID-19. Son état est désormais surveillé par les meilleurs médecins."
 russia.20.a: "Inquiétant."
 russia.85.t: "Les cas de COVID augmentent"
 russia.85.d: ""
 russia.85.a: "Préoccupant..."
 russia.86.t: "Vague massive de cas de COVID"
 russia.86.d: ""
 russia.86.a: "Préoccupant..."
 russia.182.t: "L'état du président s'aggrave."
 russia.182.d: "Malgré tous ses efforts, Vladimir Poutine ne fait qu'empirer. Les médecins expliquent leur impuissance par le fait qu'outre le coronavirus, le patient souffre de diverses autres maladies chroniques qui rendent la situation presque désespérée. En 2020, Poutine a rédigé un projet de loi prévoyant que les anciens chefs d'État deviennent sénateurs à vie. Il est peut-être temps d'exercer ce droit et de confier la présidence à une nouvelle personne ?"
 russia.182.a: "« Il est temps. Sergueï Narychkine, mon vieil ami... »"
