l_french:
 #Événements COVID-19 et dépendances importés de The Fire Rises
 prc.30.t: "Le coronavirus se propage dans les provinces voisines"
 prc.30.d: "Le coronavirus s'est propagé depuis Wuhan vers les provinces et régions voisines. Les hôpitaux de toute la région signalent des cas suspects et les gouvernements locaux se précipitent pour installer des points de contrôle, mais les déplacements de population durant les voyages du Nouvel An rendent la recherche des contacts extrêmement difficile."
 prc.30.o1: "La panique ne doit pas se propager plus vite que le virus."
 thailand.1.t: "Premiers cas de COVID en Thaïlande"
 thailand.1.d: "Le ministère de la Santé publique thaïlandais a confirmé le premier cas de nouveau coronavirus hors de Chine : une touriste chinoise de 61 ans originaire de Wuhan a été hospitalisée à Bangkok après avoir développé de la fièvre. Les autorités sanitaires suivent ses contacts et contrôlent les passagers en provenance de Chine à l'aéroport de Suvarnabhumi."
 thailand.1.a: "Inquiétant"
 iran.4.t: "Premiers cas de COVID-19"
 iran.4.d: "Les hôpitaux de Téhéran signalent une augmentation des patients souffrant de pneumonie sévère. La plupart ont plus de 40 ans, quelques-uns ont la trentaine avancée."
 iran.4.a: "Nous devons nous préparer"
 iran.11.t: "Manifestations de chômeurs liées au COVID"
 iran.11.d: "Alors que la pandémie paralyse les entreprises et fait grimper le chômage, ouvriers et commerçants de Téhéran et d'autres grandes villes sont descendus dans la rue. Les manifestations restent modestes, mais l'ambiance est sombre : les gens réclament des aides et un plan gouvernemental pour sauver leurs moyens de subsistance."
 iran.11.a: "Cela ne doit pas dégénérer"
 HUN_Corona_Virus: "Virus corona"
 HUN_Overflowing_Hospitals: "Hôpitaux saturés"
 Hungary.13.t: "Flambée de COVID-19 à Budapest"
 Hungary.13.d: "Les premiers cas de coronavirus ont été confirmés à Budapest. Le gouvernement exhorte les citoyens à respecter les mesures d'hygiène tandis que les hôpitaux préparent des services d'isolement pour les semaines à venir."
 Hungary.13.a: "Bon sang !"
 Hungary.14.t: "Pénurie de lits d'hôpital"
 Hungary.14.d: "Un rapport sinistre venu du front de la COVID : partout en Hongrie, les médecins diagnostiquent des patients sans réaliser que leur établissement n'a plus de lits disponibles depuis longtemps. Des patients atteints de cancer sont renvoyés chez eux pour mourir tandis que les malades du COVID prennent leurs lits. La Hongrie attend une réponse du gouvernement."
 Hungary.14.a: "Eh bien... Créez plus de lits !"
 saudi.1.t: "Salman hospitalisé"
 saudi.1.d: "Tôt ce matin, le roi a reçu la visite de son médecin personnel en raison de difficultés respiratoires et de douleurs dorsales soudaines. Selon lui, les problèmes respiratoires avaient commencé plusieurs semaines auparavant et se sont aggravés depuis. Le médecin n'a pas mis longtemps à déterminer qu'il était infecté par la COVID-19. Ces informations sont étroitement surveillées et seront communiquées au public ultérieurement."
 saudi.1.a: "Prier pour le roi"
 syria.15.t: "Baisse des cas de COVID ?"
 syria.15.d: "Les hôpitaux ne signalent plus de cas massifs de COVID-19. Il semble que le virus ait cessé de se propager. Pour l'instant..."
 syria.15.a: "Le pire est passé."
 monitor_outbreak_PER: "Surveiller l'épidémie de COVID-19"
 PER_coronavirus_category: "Épidémie de COVID-19"
 PER_coronavirus_category_desc: "L'épidémie de coronavirus se propage à travers l'Iran. Nous devons surveiller la situation et allouer des fonds pour la contenir avant que nos hôpitaux ne soient submergés."
