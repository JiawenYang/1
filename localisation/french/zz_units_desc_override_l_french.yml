l_french:
 Militia_Bat_desc:0 "§YComposition :§! 600 personnels. Équipement : armes légères x350, ATGM x20, MANPADS x6.\n\nMilitia Company on foot. Militia Units are characterized by having less heavy equipment and communication kits than normal infantry. This makes them highly mobile and effective in bad terrain, but they melt away quickly in flat terrain against an armored opponent.\n\n§GDesigner Hint: Militia provide inexpensive defensive frontage and Suppression. They perform best in cities, forests, and hills, but have poor Defense and Breakthrough and are especially vulnerable to armor and combat in open or harsh terrain.§!"
 Mot_Militia_Bat_desc:0 "§YComposition :§! 600 personnels. Équipement : armes légères x350, ATGM x20, MANPADS x6, véhicules utilitaires x25.\n\nMilitia Company with Pickup Trucks or even Armored Utility Vehicles. Militia Units are characterized by having less heavy equipment and communication kits than normal infantry. This makes them highly mobile and effective in bad terrain, but they melt away quickly in flat terrain against an armored opponent.\n\n§GDesigner Hint: Motorized Militia trade some economy for Speed and greater Suppression. Use them for mobile security and inexpensive exploitation across plains or deserts, but their weak combat stats and rough-terrain penalties make them poor assault troops.§!"
 Mech_Militia_Bat_desc:0 "§YComposition :§! 550 personnels. Équipement : armes légères x320, ATGM x18, MANPADS x6, véhicules blindés de transport de troupes x20.\n\nMilitia Company with Armored Personnel Carriers. Militia Units are characterized by having less heavy equipment and communication kits than normal infantry. This makes them highly mobile and effective in bad terrain, but they melt away quickly in flat terrain against an armored opponent.\n\n§GDesigner Hint: Mechanized Militia further trades economy for Speed and greater Hardness. Use them for affordable heavier mobile security and to push against infantry on foot and artillery, but their weak combat stats compared to professional mechanized prevents them from going toe to toe with a well equipped army.§!"
 L_Inf_Bat_desc:0 "§YComposition :§! 1500 personnels. Équipement : armes légères x820, ATGM x56, MANPADS x20, équipement de commandement x36, véhicules utilitaires x12.\n\nLight Infantry Company without transports. Rarely seen on the modern battlefield, but specialized units in very difficult terrain such as jungle and mountains exist - where they are highly effective. Could also be useful as urban garrisons.\n\n§GDesigner Hint: Light Infantry provide high Organization and strong combat performance in hills, forests, mountains, jungles, marshes, and cities without requiring vehicles. Use them to hold or attack difficult terrain, but expect slow strategic movement and weaker attacks across plains and deserts.§!"
 Mot_Inf_Bat_desc:0 "§YComposition :§! 1600 personnels. Équipement : armes légères x880, ATGM x56, MANPADS x20, équipement de commandement x36, véhicules utilitaires x50.\n\nMotorized Infantry Company uses all kinds of Utility Vehicles as transport, from pickup trucks to modern mine-resistant vehicles. They provide rapid battlefield mobility where roads and open terrain favor vehicle movement.\n\n§GDesigner Hint: Motorized Infantry provide affordable Speed and good performance in open terrain. Use them to exploit breakthroughs and support fast fronts, but their vehicles increase equipment demand and lose effectiveness in forests, mountains, jungles, marshes, and cities.§!"
 Hvy_Mot_Inf_Bat_desc:0 "§YComposition :§! 1700 personnels. Équipement : armes légères x930, ATGM x56, MANPADS x20, équipement de commandement x36, véhicules utilitaires lourds x45, ATGM embarqués x16.\n\nHeavy Motorized Infantry Company uses Mine-Resistant Ambush Protected (MRAP) vehicles as transport. Their armored vehicles provide superior crew protection against mines, IEDs, and small arms fire, making them ideal for operations in hostile environments where ambush threats are high.\n\n§GDesigner Hint: Heavy Motorized Infantry use heavier protected vehicles for fast frontline operations in plains and deserts. They are more equipment-intensive and have lower Organization and Entrenchment than lighter infantry, while still suffering substantial penalties in rough terrain.§!"
 Mech_Inf_Bat_desc:0 "§YComposition :§! 1750 personnels. Équipement : armes légères x960, ATGM x56, ATGM embarqués x16, MANPADS x20, équipement de commandement x40, véhicules blindés de transport de troupes x45, chars légers x2, véhicules utilitaires x8.\n\nMechanized Infantry Company uses Armored Personnel Carriers as transport. They are well suited for armored combat in flat terrain.\n\n§GDesigner Hint: Mechanized Infantry combine strong Defense and armored mobility with good performance in plains and deserts. Use them to hold the line in fast armored formations, but APCs are costly and their attack and movement suffer in forests, mountains, jungles, and cities.§!"
 Arm_Inf_Bat_desc:0 "§YComposition :§! 1750 personnels. Équipement : armes légères x960, ATGM x56, ATGM embarqués x16, MANPADS x20, équipement de commandement x40, véhicules de combat d'infanterie x45, véhicules utilitaires x8.\n\nArmored Infantry Company uses Infantry Fighting Vehicles as transport. They are well suited for armored combat in flat terrain, but are wasted in difficult terrain where they must operate on foot far from their IFV's.\n\n§GDesigner Hint: Armored Infantry use IFVs for greater firepower, Armor, and Breakthrough than mechanized infantry. Use them alongside tanks in open terrain, but their lower Organization, high equipment cost, and severe mountain, jungle, marsh, and urban penalties demand careful deployment.§!"
 L_Air_Inf_Bat_desc:0 "§YComposition :§! 1500 personnels. Équipement : armes légères x820, ATGM x56, MANPADS x20, équipement de commandement x36.\n\nAirborne Light Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft or with Transport Helicopters. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their mode of transport puts strict limits on the amount of heavy equipment they can carry, though.\n\n§GDesigner Hint: Airborne Infantry combine high Organization with paradrop capability and strong performance in difficult terrain. Use them to seize and hold isolated objectives, but their special-forces training and increased infantry-equipment demand make them expensive for routine line combat.§!"
 Mot_Air_Inf_Bat_desc:0 "§YComposition :§! 1700 personnels. Équipement : armes légères x930, ATGM x56, MANPADS x20, équipement de commandement x36, véhicules utilitaires x45.\n\nMotorized Airborne Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft or with Transport Helicopters. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their Utility Vehicles gives them great mobility upon insertion, and allows them bring more heavy equipment into battle. It is however, much more logistically demanding to paradrop them together with vehicles.\n\n§GDesigner Hint: Motorized Airborne Infantry add Speed after a paradrop and perform well across open terrain. Use them when an airborne force must exploit or reinforce quickly, but vehicles raise the equipment burden and reduce Organization and rough-terrain performance compared with foot airborne troops.§!"
 Mech_Air_Inf_Bat_desc:0 "§YComposition :§! 1600 personnels. Équipement : armes légères x880, ATGM x50, MANPADS x18, équipement de commandement x32, véhicules blindés de transport de troupes x32, véhicules utilitaires x8.\n\nMechanized Airborne Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their specially designed Light Armored Personnel Carriers gives them great mobility upon insertion, and allows them bring much more heavy equipment into battle than lighter Airborne forces. It is however, much more logistically demanding to paradrop them together with such vehicles.\n\n§GDesigner Hint: Mechanized Airborne Infantry bring APC protection, Speed, and heavier firepower to paradrops. Use them when isolated airborne forces must survive mobile combat after landing, but their lower Organization, large equipment demand, and severe rough-terrain penalties make them an expensive specialist choice.§!"
 Arm_Air_Inf_Bat_desc:0 "§YComposition :§! 1600 personnels. Équipement : armes légères x880, ATGM x50, ATGM embarqués x14, MANPADS x18, équipement de commandement x32, véhicules de combat d'infanterie x32, véhicules utilitaires x8.\n\nArmored Airborne Infantry Company are elite Infantry, with their special training in Aerial Insertion via paradrops from Transport Aircraft. They can rapidly respond to emergencies from afar, and can be inserted behind enemy lines to take vital objectives ahead of the main army advance. Their specially designed Light Infantry Fighting Vehicles gives them great mobility, and allows them to fight on equal terms against normal mechanized formations. It is however, extremely logistically demanding to paradrop them together with their IFV's. As of 2017, only Russia has ever operated such forces.\n\n§GDesigner Hint: Armored Airborne Infantry deliver IFV firepower, Armor, and Breakthrough by paradrop. Use them to contest defended objectives or fight enemy mobile reserves after insertion, but their very high equipment burden, low Organization, and difficult-terrain penalties make losses costly.§!"
 L_Marine_Bat_desc:0 "§YComposition :§! 1500 personnels. Équipement : armes légères x820, ATGM x56, MANPADS x20, équipement de commandement x36, véhicules utilitaires x12.\n\nMarine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. As they don't have vehicles, there are strict limits on the amount of heavy equipment they can carry, though.\n\n§GDesigner Hint: Marine Infantry provide high Organization and strong amphibious and marsh performance without vehicle costs. Use them to establish beachheads and fight in wetlands, but they are slower after landing, consume special-forces capacity, and are less effective in open terrain.§!"
 Mot_Marine_Bat_desc:0 "§YComposition :§! 1600 personnels. Équipement : armes légères x880, ATGM x56, ATGM embarqués x14, MANPADS x20, équipement de commandement x36, véhicules utilitaires x45.\n\nMotorized Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. While they disembark as Light Infantry, they have Utility Vehicles as land transports, giving them great mobility and allows them to carry large amounts of heavy equipment into battle.\n\n§GDesigner Hint: Motorized Marine Infantry retain a strong amphibious bonus while adding Speed for rapid expansion from a beachhead. Use them when the landing force must move inland quickly, but their vehicles cost more equipment and reduce Organization and mountain performance compared with foot marines.§!"
 Mech_Marine_Bat_desc:0 "§YComposition :§! 1750 personnels. Équipement : armes légères x960, ATGM x56, ATGM embarqués x14, MANPADS x20, équipement de commandement x40, véhicules blindés de transport de troupes x42, véhicules utilitaires x8.\n\nMechanized Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. As they make landings protected in their specially designed Amphibious Armored Personnel Carriers, they are very much equipped to strike right away with great mobility, carrying large amounts of heavy equipment into battle.\n\n§GDesigner Hint: Mechanized Marines combine an amphibious bonus with APC protection and strong mobility after landing. Use them to expand and hold mechanized beachheads, but they have less Organization than lighter marines and their vehicles perform poorly in forests and mountains.§!"
 Arm_Marine_Bat_desc:0 "§YComposition :§! 1600 personnels. Équipement : armes légères x880, ATGM x50, ATGM embarqués x14, MANPADS x18, équipement de commandement x32, véhicules de combat d'infanterie x36, véhicules utilitaires x8.\n\nArmored Marine Infantry Company are elite Infantry, with special training in amphibious operations, such as river-crossings, operation in swamps, and amphibious invasions. They can cross large distances on water in their heavily armored jet-propelled Amphibious Infantry Fighting Vehicles, and be ready to fight from the same IFV's once they make it to shore with great proficiency.\n\n§GDesigner Hint: Armored Marines provide the strongest IFV firepower, Armor, and urban combat ability among marine infantry while retaining an amphibious bonus. Use them against heavily defended ports, but their low Organization, high cost, and severe mountain and jungle penalties require lighter troops for difficult inland terrain.§!"
 L_Air_assault_Bat_desc:0 "§YComposition :§! 1500 personnels. Équipement : armes légères x820, ATGM x56, MANPADS x20, équipement de commandement x32, hélicoptères de transport x24.\n\nAir Assault Infantry Company are elite Infantry, with their special training in rappelling and air transportation, their equipment is sometimes designed or field-modified to allow better transportation within aircraft. They are often used to to seize and hold key terrain which has not been fully secured, and to directly engage enemy forces behind enemy lines.\n\n§GDesigner Hint: Air Assault Infantry use transport helicopters for rapid operations and gain combat bonuses across most difficult terrain. Use them to seize remote hills, forests, mountains, jungles, marshes, or cities, but their low Strength, poor Entrenchment, and costly helicopters make prolonged line combat risky.§!"
 air_assault_arty_Bat_desc:0 "§YComposition :§! 880 personnels. Équipement : artillerie x18, hélicoptères de transport x18, équipement de commandement x12, armes légères x200.\n\nA full Battery of towed artillery pieces transported by helicopter sling loading. Provides sustained indirect fire support for airmobile operations, keeping pace with air assault infantry through rapid aerial repositioning.\n\n§GDesigner Hint: Airmobile Artillery adds substantial Soft Attack to helicopter formations and performs well in hills, mountains, forests, jungles, and cities. Use it to support air assault troops in difficult terrain, but it adds Combat Width, has low Organization and Strength, and requires costly transport helicopters.§!"
 attack_helo_bat_desc:0 "§YComposition :§! 620 personnels. Équipement : hélicoptères d'attaque x18, équipement de commandement x16.\n\nAttack helicopter squadrons mass rotary-wing gunships for rapid anti-armor strikes and close support across a wide front.\n\n§GDesigner Hint: Attack Helicopters provide fast armored firepower and strong attacks in plains and deserts. Use them to reinforce breakthroughs or hunt armor in open terrain, but their very low Organization and Strength, expensive aircraft, and poor performance in cities, mountains, forests, and jungles make sustained combat dangerous.§!"
 armor_Bat_desc:0 "§YComposition :§! 1400 personnels. Équipement : chars de combat principaux x44, équipement de commandement x28, armes légères x350, ATGM x20, MANPADS x10, véhicules utilitaires x20.\n\nA Tank Company features only the most heavily armored vehicles in existence, Main Battle Tanks. With excellent mobility in flat terrain and fierce direct fire, they are designed to punch holes in the enemy front lines that can be rapidly exploited by follow-up mechanized infantry units.\n\n§GDesigner Hint: Tanks deliver high Armor, Breakthrough, and hard-target firepower with excellent plains and desert bonuses. Use them as the spearhead of offensive divisions, but they consume expensive tank and command equipment, have low Organization, and suffer major penalties in forests, mountains, jungles, marshes, and cities.§!"
 L_arm_Bat_desc:0 "§YComposition :§! 1100 personnels. Équipement : chars légers x28, équipement de commandement x28, armes légères x300, ATGM x10, véhicules utilitaires x10.\n\nLight Tank Company operates with special, often wheeled, Light Tanks that combine incredible mobility with awe-inspiring stopping power. They can hold their own against all types of Infantry in direct combat. Direct combat isn't their intended role, though - they infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform raids and ambushes on important enemy assets and mechanized formations.\n\n§GDesigner Hint: Light Tanks provide fast armored firepower and strong attacks in plains and deserts. Use them for reconnaissance in force and exploitation, but their protection and direct combat power are lighter and rough terrain sharply reduces their effectiveness.§!"
 A_L_arm_Bat_desc:0 "§YComposition :§! 1000 personnels. Équipement : chars légers x18, équipement de commandement x24, armes légères x250, véhicules utilitaires x8.\n\nLight Tank Company operates with special, often wheeled, Light Tanks that combine incredible mobility with awe-inspiring stopping power. They can hold their own against all types of Infantry in direct combat. Direct combat isn't their intended role, though - they infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform raids and ambushes on important enemy assets and mechanized formations. These units are also capable of conducting airborne operations with paratrooper elements, providing immediate close armored support.\n\n§GDesigner Hint: Airborne Light Tanks give paradrop formations mobile Armor and anti-vehicle firepower after insertion. Use them to support airborne troops against mobile opposition in open terrain, but specialized vehicles are costly and suffer severe penalties in mountains, jungles, marshes, and cities.§!"
 Arty_Bat_desc:0 "§YComposition :§! 1500 personnels. Équipement : artillerie x18, équipement de commandement x24, véhicules utilitaires x36, armes légères x300.\n\nWith its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by it's crew. Since it requires external vehicles for it's movement, it can be difficult to move around in-between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as their can fit inside transport planes.\n\n§GDesigner Hint: Artillery Battery adds substantial Soft Attack and can be paradropped, making it effective against infantry-heavy forces. Use it to give foot formations offensive firepower, but its low Organization and Strength, added Combat Width, and movement penalties in rough terrain require enough infantry to protect it.§!"
 SP_Arty_Bat_desc:0 "§YComposition :§! 1400 personnels. Équipement : artillerie automotrice x18, équipement de commandement x24, véhicules utilitaires x24, armes légères x250.\n\nWith its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by it's crew, and it's self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery.\n\n§GDesigner Hint: Self-Propelled Artillery Battery adds heavy Soft Attack while keeping pace with armored formations and excels in plains. Use it to break infantry-heavy lines, but its low Organization, added Combat Width, costly chassis, and rough-terrain penalties require armored protection and open ground.§!"
 SP_R_arty_Bat_desc:0 "§YComposition :§! 1250 personnels. Équipement : SLRM x18, équipement de commandement x24, véhicules utilitaires x24, armes légères x250.\n\nUsing MLRS launchers, a battery of Rocket Artillery can eradicate an entire area from far away. Used against enemy rear-areas, as the indiscriminate fire makes it unsuitable for precision strikes on the battlefield. It needs special reload vehicles, and reloading times are slow.\n\n§GDesigner Hint: MLRS Battery delivers very high Soft Attack and Breakthrough while matching mobile formations across open terrain. Use it for concentrated offensive firepower, but it has low Organization, adds Combat Width, requires expensive rocket vehicles, and struggles in mountains, jungles, marshes, and cities.§!"
 SP_AA_Bat_desc:0 "§YComposition :§! 1100 personnels. Équipement : véhicules antiaériens x18, équipement de commandement x24, véhicules utilitaires x24, armes légères x200.\n\nUsing self-propelled short or medium ranged Anti-Air Missile Systems, the Air Defence Battery will defend it's unit from enemy Close Air Support strikes.\n\n§GDesigner Hint: Self-Propelled Air Defence supplies high Air Attack and mobile protection for armored formations. Use it when enemy aircraft threaten valuable spearheads, but it adds Combat Width, costs specialized vehicles, contributes little ground firepower, and moves poorly in mountains, jungles, and marshes.§!"
 L_Ranger_Bat_desc:0 "§YComposition :§! 1400 personnels. Équipement : armes légères x770, ATGM x50, MANPADS x16, équipement de commandement x32, véhicules utilitaires x32, véhicules utilitaires x15.\n\nLes rangers sont une infanterie légère d'élite, spécialisée dans les raids, l'action directe et le déploiement rapide en avant de la force principale. Ils voyagent léger pour maximiser mobilité et surprise, s'emparant d'objectifs clés et les tenant jusqu'à l'arrivée des unités conventionnelles. La contrepartie est un équipement lourd clairsemé, les laissant exposés face aux blindés en terrain ouvert.\n\n§GIndice du concepteur : les rangers concentrent une haute organisation et d'exceptionnels bonus de terrain difficile dans une faible largeur de combat. Utilisez-les pour des formations d'élite de montagne, forêt, jungle, marais ou urbaine, mais leur long entraînement, le plafond forces spéciales et l'équipement lourd limité rendent le déploiement de masse coûteux et les exposent en plaine.§!\n§GIndice concepteur : les rangers concentrent une haute organisation et des bonus exceptionnels en terrain difficile dans une faible largeur de combat. Utilisez-les pour des formations d'élite en montagne, forêt, jungle, marais ou urbain, mais leur long entraînement, le plafond forces spéciales et l'équipement lourd limité rendent le déploiement de masse coûteux et les laissent exposés en plaine.§!"
 L_Marine_Cdo_Bat_desc:0 "§YComposition :§! 1500 personnels. Équipement : armes légères x820, ATGM x50, MANPADS x16, équipement de commandement x32, véhicules utilitaires x32, véhicules utilitaires x12.\n\nMarine Commandos Company are larger formations of Marine Raiders, trained to conduct hit and run operations, among other light infantry tasks.\n\n§GDesigner Hint: Marine Commandos combine high Organization with excellent amphibious, marsh, forest, and urban attacks. Use them for elite raids and contested landings, but their special-forces cap, long training, light equipment, and weaker open-terrain attacks limit mass deployment.§!"
 Special_Forces_desc:0 "§YComposition :§! 1250 personnels. Équipement : armes légères x1000, ATGM x24, MANPADS x12, équipement de commandement x40, véhicules utilitaires x24.\n\nLes forces d'opérations spéciales constituent l'élite de toutes les armées où elles sont déployées, avec une formation plus longue et plus difficile que celle de n'importe quelle autre armée. Ce sont des experts des terrains difficiles, des opérations aéroportées et des débarquements amphibies. Elles sont cependant très légèrement équipées car elles peuvent avoir besoin d'opérer en mobilité derrière les lignes de front."
 combat_service_support_company_desc:0 "§YComposition :§! 350 personnels. Équipement : équipement de commandement x60, véhicules utilitaires x30, armes légères x300.\n\nServices logistiques et médicaux de la division."
 helicopter_combat_service_support_desc:0 "§YComposition :§! 250 personnels. Équipement : hélicoptères de transport x20, équipement de commandement x40.\n\nServices logistiques et médicaux de la division."
 combat_maintenance_company_desc:0 "§YComposition :§! 250 personnels. Équipement : équipement de commandement x40, véhicules utilitaires x20, armes légères x200.\n\nLa compagnie de maintenance maintient les véhicules et l'équipement lourd d'une formation dans le combat, effectuant des réparations de campagne et récupérant les plateformes endommagées avant qu'elles ne soient perdues pour de bon. En restaurant les véhicules hors combat près du front, elle soutient la force blindée lors d'opérations prolongées et réduit le drain de l'attrition.\n\n§GIndice du concepteur : la maintenance améliore fiabilité, récupération et capture d'équipement pour les divisions lourdes en véhicules. Utilisez-la pour limiter l'attrition et préserver un équipement coûteux lors de longues opérations, mais elle ajoute largeur de combat, main-d'œuvre et véhicules utilitaires tout en contribuant peu de puissance de feu directe.§!\n§GIndice concepteur : la maintenance améliore fiabilité, récupération et capture d'équipement pour les divisions lourdes en véhicules. Utilisez-la pour limiter l'attrition et préserver l'équipement coûteux lors de longues opérations, mais elle ajoute largeur de combat, effectifs et véhicules utilitaires tout en contribuant peu en puissance de feu directe.§!"
 airmobile_maintenance_company_desc:0 "§YComposition :§! 250 personnels. Équipement : hélicoptères de transport x20, équipement de commandement x40, armes légères x200.\n\nUn élément de maintenance configuré pour soutenir les forces aéromobiles et d'hélicoptères, avec l'outillage plus léger et plus transportable nécessaire pour garder opérationnelles les unités à voilure tournante et déployées rapidement. Il restaure l'équipement endommagé en zones avancées, soutenant le tempo des opérations d'assaut aérien loin des dépôts établis.\n\n§GIndice du concepteur : la maintenance aéromobile améliore capture d'équipement et fiabilité tout en suivant le rythme des formations d'hélicoptères. Utilisez-la pour préserver un équipement rotatif coûteux, mais elle offre moins de récupération que la maintenance terrestre, ajoute de la largeur de combat et exige de nombreux hélicoptères de transport.§!"
 L_Engi_Comp_desc:0 "§YComposition :§! 200 personnels. Équipement : armes légères x120, équipement de commandement x12, véhicules utilitaires x12.\n\nEngineers handle temporary bridge and defensive perimeter construction, mine-laying and clearing in addition to bomb disposal. They carry basic infantry weaponry, for defensive purposes.\n\n§GDesigner Hint: Engineer Companies improve Entrenchment, help infantry attack and defend in forts, cities, forests, and marshes, and improve defense and movement in mountains. Use them in defensive or rough-terrain divisions, but they add Combat Width, Manpower, and equipment while contributing little direct firepower.§!"
 H_Engi_Comp_desc:0 "§YComposition :§! 300 personnels. Équipement : armes légères x200, équipement de commandement x20, véhicules utilitaires x20, chars de combat principaux x4.\n\nEngineers handle temporary bridge and defensive perimeter construction, mine-laying and clearing in addition to bomb disposal. They carry basic infantry weaponry for defensive purposes. With dedicated construction and recovery vehicles, they are well-equipped to recover combat-disabled equipment from the frontline.\n\n§GDesigner Hint: Heavy Engineer Companies provide greater Entrenchment and stronger fort, urban, mountain, and marsh bonuses than standard engineers. Use them in valuable assault or defensive formations, but their large Manpower and equipment requirements make them an expensive support choice.§!"
 communications_company_desc:0 "§YComposition :§! 150 personnels. Équipement : équipement de commandement x100, armes légères x100, véhicules utilitaires x10.\n\nLa compagnie de transmissions maintient les réseaux radio, données et de commandement qui lient une formation, assurant que ordres et rapports circulent de façon fiable sur le champ de bataille. Des communications robustes améliorent coordination et temps de réaction, et durcissent la formation contre le brouillage et la perturbation électronique.\n\n§GIndice du concepteur : une compagnie de transmissions améliore organisation, récupération et initiative des bataillons de première ligne. Utilisez-la dans de grandes ou précieuses divisions de combat qui bénéficient de la coordination, mais elle ajoute de la largeur de combat et un coût substantiel d'équipement de commandement et de contrôle tout en offrant peu de puissance de feu directe.§!"
 military_police_attachment_desc:0 "§YComposition :§! 250 personnels. Équipement : équipement de commandement x100, armes légères x200.\n\nLa police militaire gère le contrôle de la circulation, la sécurité de l'arrière et le traitement des prisonniers, libérant les unités de ligne pour le combat. En maintenant les itinéraires de ravitaillement en ordre et en sécurisant l'arrière contre infiltrés et traînards, elle préserve la discipline et fait avancer une formation en douceur.\n\n§GIndice du concepteur : la police militaire multiplie la suppression de l'infanterie et ajoute davantage de suppression sans largeur de combat. Utilisez-la dans des modèles d'occupation et de sécurité d'arrière, mais son coût de main-d'œuvre et d'équipement offre peu de bénéfice aux divisions de combat de première ligne.§!\n§GIndice concepteur : la police militaire multiplie la suppression d'infanterie et ajoute encore de la suppression sans largeur de combat. Utilisez-la dans les modèles d'occupation et de sécurité d'arrière, mais son coût en effectifs et équipement offre peu d'avantage aux divisions de combat de première ligne.§!"
 pathfinder_company_desc:0 "§YComposition :§! 80 personnels. Équipement : équipement de commandement x50, armes légères x100.\n\nGroupes d'élite de parachutistes, formés à sauter avant les opérations aéroportées, pour trouver les LZ et zones de rassemblement les plus sûrs. Ces troupes d'élite offrent un commandement et un contrôle critiques pendant les moments clés de toute opération aéroportée ou aéromobile.\n\n§GIndice du concepteur : les pathfinders améliorent l'organisation et l'attaque douce de l'infanterie aéroportée et peuvent se déployer en parachute. Utilisez-les pour renforcer des divisions d'assaut aéroporté ou aéromobile, mais ils ajoutent de la largeur de combat, sont limités à ces formations et offrent peu de puissance de combat directe.§!"
 L_Ranger_Recce_Comp_desc:0 "§YComposition :§! 120 personnels. Équipement : armes légères x80, ATGM x8, MANPADS x4, équipement de commandement x8.\n\nUn élément de reconnaissance issu des rangers, formé à s'infiltrer profondément derrière les lignes ennemies à pied et à rendre compte des mouvements ennemis. Combinant furtivité, reconnaissance par drones et surveillance électronique, ils recueillent le renseignement et marquent les cibles pour les feux amis, et peuvent mener raids et embuscades limités lorsque l'occasion se présente.\n\n§GIndice du concepteur : la recon rangers ajoute reconnaissance et initiative tout en améliorant l'attaque douce de l'artillerie et en combattant bien en terrain difficile. Utilisez-la dans des formations de forces spéciales ayant besoin d'une reconnaissance d'élite, mais elle ajoute de la largeur de combat, consomme de la capacité forces spéciales et contribue peu de puissance de feu directe.§!\n§GIndice concepteur : la recce rangers ajoute reconnaissance et initiative tout en améliorant l'attaque douce de l'artillerie et en combattant bien en terrain difficile. Utilisez-la dans les formations de forces spéciales qui ont besoin d'un éclairage d'élite, mais elle ajoute de la largeur de combat, consomme la capacité forces spéciales et contribue peu en puissance de feu directe.§!"
 Drone_Recce_Comp_desc:0 "§YComposition :§! 80 personnels. Équipement : armes légères x50, véhicules utilitaires x5, équipement de commandement x25, équipements de drone terrestre x25.\n\nBy employing small unmanned aerial systems to extend observation beyond line of sight, the Unmanned Recce Platoon improves battlefield awareness without exposing scouts to direct fire. These drones can rapidly screen routes, identify enemy positions, and confirm targets in complex terrain, enabling faster decision-making and more accurate fires.\n\n§GDesigner Hint: Unmanned Recce provides high Reconnaissance and Initiative, strengthens other recon elements, and improves artillery attacks. Use it in mobile or armored divisions that can afford drones, but it adds Combat Width and Supply Consumption, reduces Entrenchment, and performs poorly in cities and mountains.§!"
 Sniper_company_desc:0 "§YComposition :§! 80 personnels. Équipement : armes légères x50, équipement de commandement x25.\n\nEquipped with precision marksmen working in spotter pairs, the Sniper Platoon provides long-range, selective fire against high-value targets such as officers, crews, and communications teams. They excel at harassing and disrupting enemy formations from concealment, degrading enemy effectiveness while remaining difficult to locate and engage.\n\n§GDesigner Hint: A Sniper Platoon adds Soft Attack, Reconnaissance, and boosts the Initiative of recon elements and the firepower of artillery. Use it against infantry and for better battlefield coordination, but it adds Combat Width and has very poor Breakthrough, Hard Attack, and Piercing.§!"
 Light_Mech_Inf_Bat_desc:0 "§YComposition :§! 300 personnels. Équipement : véhicules blindés de transport de troupes x30.\n\nUn élément mécanisé sous-effectif utilise une petite allocation de véhicules de transport de troupes pour renforcer une formation sans prendre le frontage normal.\n\n§GIndice du concepteur : l'infanterie mécanisée sous-effectif ajoute protection VTT et défense sans largeur de combat. Utilisez-la pour renforcer des formations éligibles en plaines, collines ou villes, mais son coût de véhicules, sa faible force et ses pénalités sévères en montagne, jungle, marais, rivière et amphibie limitent sa valeur de combat indépendante.§!"
 Light_Arm_Inf_Bat_desc:0 "§YComposition :§! 320 personnels. Équipement : véhicules de combat d'infanterie x30.\n\nUn élément d'infanterie blindée sous-effectif utilise une petite allocation de véhicules de combat d'infanterie pour ajouter une puissance de feu protégée sans occuper le frontage normal.\n\n§GIndice du concepteur : l'infanterie blindée sous-effectif ajoute blindage VCI et puissance de feu sans largeur de combat et performe le mieux en plaines et déserts. Utilisez-la pour renforcer des formations de valeur, mais sa faible organisation, ses véhicules coûteux et ses pénalités extrêmes en terrain difficile, rivière et amphibie la rendent très spécialisée.§!\n§GIndice concepteur : l'infanterie blindée en sous-effectif ajoute blindage et puissance de feu de VCI sans largeur de combat et performe le mieux en plaines et déserts. Utilisez-la pour renforcer des formations de valeur, mais sa faible organisation, ses véhicules coûteux et d'extrêmes pénalités en terrain accidenté, rivière et amphibie la rendent très spécialisée.§!"
 Light_L_Air_assault_Bat_desc:0 "§YComposition :§! 250 personnels. Équipement : hélicoptères de transport x30.\n\nL'infanterie d'assaut aérien est une infanterie d'élite, avec un entraînement spécial en descente en rappel et transport aérien ; son équipement est parfois conçu ou modifié sur le terrain pour un meilleur transport aérien. Elle est souvent utilisée pour s'emparer et tenir un terrain clé non pleinement sécurisé, et pour engager directement des forces ennemies derrière les lignes.\n\n§GIndice du concepteur : cet élément d'assaut aérien sous-effectif ajoute organisation et de puissants bonus urbains, montagne, forêt, jungle et marais sans largeur de combat. Utilisez-le pour renforcer des formations spécialisées en terrain difficile, mais son exigence d'hélicoptères est coûteuse et il performe mal en plaines, déserts et attaques amphibies.§!"
 Light_attack_helo_bat_desc:0 "§YComposition :§! 95 personnels. Équipement : hélicoptères d'attaque x9.\n\nUn petit élément d'hélicoptères d'attaque offre un soutien rapide de cannonière sans l'empreinte d'un régiment complet.\n\n§GIndice du concepteur : les hélicoptères d'attaque sous-effectif ajoutent une puissance de feu blindée rapide sans largeur de combat et excellent en plaines et déserts. Utilisez-les pour un soutien mobile compact, mais leur très faible organisation et force, leurs aéronefs coûteux et leurs pénalités sévères en montagne, jungle, marais et urbain rendent les pertes difficiles à absorber.§!"
 Light_armor_Bat_desc:0 "§YComposition :§! 95 personnels. Équipement : chars de combat principaux x21.\n\nUn élément de chars sous-effectif concentre un nombre limité de chars de combat principaux pour renforcer une formation sans occuper le frontage normal.\n\n§GIndice du concepteur : les chars sous-effectif ajoutent blindage, percée et de fortes attaques en plaines et déserts sans largeur de combat. Utilisez-les pour renforcer économiquement des formations offensives, mais leur faible organisation et force, le coût des chars et les pénalités extrêmes en terrain difficile et villes en font un mauvais soutien polyvalent.§!\n§GIndice concepteur : les chars en sous-effectif ajoutent blindage, percée et de fortes attaques en plaine et désert sans largeur de combat. Utilisez-les pour renforcer économiquement des formations offensives, mais leur faible organisation et force, le coût des chars et d'extrêmes pénalités en terrain accidenté et villes en font un appui polyvalent médiocre.§!"
 Light_L_arm_Bat_desc:0 "§YComposition :§! 95 personnels. Équipement : chars légers x21.\n\nUn élément de chars légers sous-effectif offre une puissance de feu anti-blindés mobile et une reconnaissance en force avec une empreinte de véhicules plus petite.\n\n§GIndice du concepteur : les chars légers sous-effectif ajoutent une puissance de feu anti-blindés mobile sans largeur de combat et excellent en plaines et déserts. Utilisez-les pour durcir des formations rapides contre les véhicules, mais leur faible force, châssis spécialisés et lourdes pénalités de terrain difficile, rivière et amphibie limitent la flexibilité.§!\n§GIndice concepteur : les chars légers en sous-effectif ajoutent une puissance de feu anti-blindage mobile sans largeur de combat et excellent en plaines et déserts. Utilisez-les pour raidcir des formations rapides contre les véhicules, mais leur faible force, leur châssis spécialisé et de lourdes pénalités en terrain accidenté, rivière et amphibie limitent la flexibilité.§!"
 Light_SP_Arty_Bat_desc:0 "§YComposition :§! 95 personnels. Équipement : artillerie automotrice x9.\n\nA reduced self-propelled artillery element delivers mobile indirect fire with fewer vehicles than a full battalion.\n\n§GDesigner Hint: Understrength Self-Propelled Artillery adds mobile Soft Attack without Combat Width and performs especially well in plains, deserts, and cities. Use it for compact offensive support, but it has almost no Organization, low Strength, specialized chassis cost, and weaker performance in forests, mountains, and jungles.§!"
 Light_SP_R_arty_Bat_desc:0 "§YComposition :§! 95 personnels. Équipement : SLRM x9.\n\nA reduced multiple-launch rocket element provides concentrated area fire while using fewer vehicles than a full battalion.\n\n§GDesigner Hint: Understrength Rocket Artillery adds powerful mobile Soft Attack without Combat Width and excels in plains, deserts, and cities. Use it to reinforce offensive formations, but its negligible Organization, low Strength, rocket-vehicle cost, and rough-terrain penalties require protection.§!"
 Light_SP_AA_Bat_desc:0 "§YComposition :§! 60 personnels. Équipement : véhicules antiaériens x9.\n\nUn élément de défense aérienne automotrice réduit protège la formation avec une petite allocation de systèmes antiaériens mobiles.\n\n§GIndice du concepteur : la défense aérienne automotrice sous-effectif ajoute de l'attaque aérienne sans largeur de combat ni beaucoup de main-d'œuvre. Utilisez-la pour une protection compacte des formations mobiles sous la puissance aérienne ennemie, mais elle n'a presque pas d'organisation, une faible force, et exige des véhicules antiaériens spécialisés qui ajoutent peu de puissance de feu terrestre.§!"
 Arty_Battery_desc:0 "§YComposition :§! 200 personnels. Équipement : armes légères x40, artillerie x6, équipement de commandement x6.\n\nWith it's powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by it's crew. Since it requires external vehicles for it's movement, it can be difficult to move around in-between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as their can fit inside transport planes.\n\n§GDesigner Hint: An Artillery Platoon adds Soft Attack without Combat Width at far lower equipment cost than a full artillery battery. Use it as economical fire support for eligible foot formations, but its very low Organization and rough-terrain penalties limit its value in unsupported or highly mobile divisions.§!"
 SP_R_arty_battery_desc:0 "§YComposition :§! 200 personnels. Équipement : armes légères x40, SLRM x6, équipement de commandement x6, véhicules utilitaires x6.\n\nUsing MLRS launchers, a platoon of Rocket Artillery can eradicate areas from far away. Used against enemy rear-areas, as the indiscriminate fire makes it unsuitable for precision strikes on the battlefield. It needs special reload vehicles, and reloading times are slow.\n\n§GDesigner Hint: A MLRS Platoon adds strong mobile Soft Attack and some Breakthrough without Combat Width. Use it for compact offensive support in mobile or armored divisions, but rocket vehicles are costly, offer little staying power, and lose mobility in mountains and marshes.§!"
 SP_arty_battery_desc:0 "§YComposition :§! 250 personnels. Équipement : armes légères x40, artillerie automotrice x6, équipement de commandement x6, véhicules utilitaires x6.\n\nWith it's powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by it's crew, and it's self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery.\n\n§GDesigner Hint: A Self-Propelled Artillery Platoon adds mobile Soft Attack without Combat Width. Use it as compact fire support for mobile, armored, marine, or militia formations, but the specialized chassis costs more than towed guns and moves poorly through mountains, jungles, and marshes.§!"
 SP_AA_Battery_desc:0 "§YComposition :§! 200 personnels. Équipement : armes légères x40, véhicules antiaériens x6, équipement de commandement x6, véhicules utilitaires x6.\n\nUsing self-propelled short or medium ranged Anti-Air Missile Systems, the Air Defence Platoon will defend it's unit from enemy Close Air Support strikes.\n\n§GDesigner Hint: A Self-Propelled Air Defence Platoon adds mobile Air Attack without Combat Width. Use it to protect mobile, armored, or marine divisions under hostile skies, but its specialized chassis has little value against ground forces and is less mobile in mountains and marshes.§!"
 air_assault_arty_battery_desc:0 "§YComposition :§! 150 personnels. Équipement : armes légères x40, artillerie x6, hélicoptères de transport x6, équipement de commandement x6.\n\nUsing towed artillery pieces, these units increase their mobility by sling loading their guns, allowing them to keep up with faster airmobile infantry units.\n\n§GDesigner Hint: An Airmobile Artillery Platoon adds Soft Attack without Combat Width and performs best in hills, mountains, forests, jungles, and cities. Use it as compact fire support for airmobile or marine formations, but helicopter and artillery requirements are costly and it is weaker in plains and deserts.§!"
 armor_Comp_desc:0 "§YComposition :§! 140 personnels. Équipement : chars de combat principaux x14, équipement de commandement x8.\n\nA Tank Platoon features only the most heavily armored vehicles in existence, Main Battle Tanks. With excellent mobility in flat terrain and fierce direct fire, they are designed to punch holes in the enemy front lines that can be rapidly exploited by follow-up mechanized infantry units.\n\n§GDesigner Hint: A Tank Platoon adds Armor, Breakthrough, and mobile firepower without Combat Width. Use it to stiffen eligible infantry or mobile formations for open-terrain combat, but its tanks and command equipment are costly and it slows and attacks poorly in mountains, jungles, and marshes.§!"
 attack_helo_comp_desc:0 "§YComposition :§! 100 personnels. Équipement : hélicoptères d'attaque x4, équipement de commandement x4.\n\nAn attack helicopter flight provides rapid gunship support and mobile anti-armor firepower to frontline formations.\n\n§GDesigner Hint: An Attack Helicopter Flight adds fast armored firepower without Combat Width. Use it as flexible support for infantry, mobile, armored, or marine divisions, but aircraft and command equipment are expensive and it attacks less effectively in cities and jungles.§!"
 drone_tactical_company_desc:0 "§YComposition :§! 80 personnels. Équipement : armes légères x40, équipement de commandement x16, véhicules utilitaires x8, équipements de drone terrestre x120.\n\nÀ l'aide de drones à voilure fixe FPV et de drones quadricoptères, ces unités ont mené des reconnaissances et des frappes ciblées en soutien de leurs unités de ligne."
 Militia_Recce_Comp_desc:0 "§YComposition :§! 80 personnels. Équipement : armes légères x40, équipement de commandement x4, véhicules utilitaires x4.\n\nLes compagnies de recon de milice utilisent des véhicules utilitaires et un équipement de communication limité pour éclairer en avant des formations de milice. Elles offrent une reconnaissance peu coûteuse des positions ennemies, surtout en terrain bâti.\n\n§GIndice du concepteur : la recon de milice ajoute reconnaissance et initiative sans largeur de combat et performe particulièrement bien en villes et supercités. Utilisez-la pour améliorer à bon marché les tactiques de milice, mais elle est limitée à la milice et contribue peu de puissance de combat directe.§!\n§GIndice concepteur : la recce de milice ajoute reconnaissance et initiative sans largeur de combat et performe particulièrement bien en villes et supercités. Utilisez-la pour améliorer à bon marché les tactiques de milice, mais elle est restreinte à la milice et contribue peu en combat direct.§!"
 L_Recce_Comp_desc:0 "§YComposition :§! 150 personnels. Équipement : armes légères x100, ATGM x10, MANPADS x5, équipement de commandement x10.\n\nLes compagnies de reconnaissance légères opèrent à pied et sont donc dépourvues de la plupart des équipements lourds qui en font une unité de combat efficace. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de ses activités, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids limités et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 Mot_Recce_Comp_desc:0 "§YComposition :§! 120 personnels. Équipement : armes légères x80, ATGM x8, MANPADS x8, équipement de commandement x8, véhicules utilitaires x8.\n\nLes compagnies de reconnaissance motorisées opèrent avec des véhicules utilitaires et disposent d'une grande partie du même équipement que leurs homologues d'infanterie. Leurs rôles sont cependant différents. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de son activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids limités et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 Mech_Recce_Comp_desc:0 "§YComposition :§! 100 personnels. Équipement : armes légères x60, ATGM x6, ATGM embarqués x6, MANPADS x6, véhicules blindés de transport de troupes x6, équipement de commandement x6.\n\nLes compagnies de reconnaissance mécanisées opèrent avec des véhicules blindés de transport de troupes et disposent d'une grande partie du même équipement que leurs homologues de l'infanterie. Leurs rôles sont cependant différents. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de son activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids limités et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 Arm_Recce_Comp_desc:0 "§YComposition :§! 80 personnels. Équipement : armes légères x40, ATGM x4, ATGM embarqués x4, MANPADS x4, véhicules de combat d'infanterie x4, équipement de commandement x4.\n\nLes compagnies de reconnaissance mécanisées lourdes opèrent avec des véhicules de combat d'infanterie et disposent d'une grande partie du même équipement que leurs homologues de l'infanterie blindée. Leurs rôles sont cependant différents. Elles s'infiltrent près de l'ennemi pour observer et rendre compte de son activité, et utilisent à la fois la reconnaissance par drone et la surveillance électronique pour recueillir des renseignements. Elles peuvent également effectuer des raids et des embuscades. Les compagnies de reconnaissance sont souvent appelées « escadrons » en raison de leur héritage d'anciennes unités de cavalerie."
 armor_Recce_Comp_desc:0 "§YComposition :§! 120 personnels. Équipement : chars légers x8, équipement de commandement x8.\n\nArmored Recce Platoon operates with special Recon Light Tanks that combine incredible mobility with awe-inspiring stopping power. They can hold their own against all types of Infantry in direct combat. Direct combat isn't their intended role, though - they infiltrate close to the enemy to observe and report on their activity, and use both Drone Reconnaissance and Electronic Surveillance to gather intel. They can also perform raids and ambushes on important enemy assets and mechanized formations. Recce Companies are often called 'Squadrons' due to their legacy as former Cavalry units.\n\n§GDesigner Hint: Armored Recce provides the highest Reconnaissance and Initiative among conventional scouts while adding anti-armor mobility without Combat Width. Use it in tank formations on open terrain, but recon tanks and command equipment are costly and movement falls sharply in forests, mountains, jungles, and marshes.§!"
 Weapons_company_desc:0 "§YComposition :§! 120 personnels. Équipement : armes légères x150, ATGM x10, équipement de commandement x10.\n\nUne compagnie d'armes, composée d'armes de soutien d'infanterie à tir direct, telles que des équipes de mitrailleuses moyennes et lourdes, d'armes de grenades et d'autres armes lourdes d'infanterie à tir direct. Cette compagnie est conçue pour fournir des feux de soutien à tout élément d'infanterie auquel elle est affectée, sur un large éventail de forces.\n\n§GIndice du concepteur : une compagnie d'armes ajoute de larges statistiques de tir direct, surtout la perforation, sans largeur de combat. Utilisez-la pour renforcer l'infanterie polyvalente, mais sa forte demande d'équipement d'infanterie et sa pénalité de retranchement la rendent moins attractive pour de peu coûteux défenseurs statiques.§!"
 Heavy_mortar_company_desc:0 "§YComposition :§! 120 personnels. Équipement : armes légères x120, équipement de commandement x9, véhicules utilitaires x15.\n\nMortars are designed to provide fast, integrated fire support to line units, without needing attachment from higher elements. These mortars provide indirect fire support to line elements, at a much cheaper cost than a full scale artillery unit would need.\n\n§GDesigner Hint: A Mortar Battery provides strong Soft Attack without artillery equipment or Combat Width. Use it as inexpensive integrated fire support against infantry, but it offers little Hard Attack or Piercing and reduces Entrenchment.§!"
 AT_company_desc:0 "§YComposition :§! 120 personnels. Équipement : armes légères x90, ATGM x18, équipement de commandement x9.\n\nEquipped with infantry anti-tank weapons, this anti-tank platoon is designed to work specifically with light infantry elements. Able to easily operate in urban areas, forests, and other entrenched or close in locations, this team not only is able to easily attack enemy armored elements and then disappear back into their entrenched locations.\n\n§GDesigner Hint: Infantry Anti-Tank adds high Hard Attack and Piercing without Combat Width for foot, airborne, marine, and special-forces formations. Use it when those divisions must resist armor, but it weakens other combat stats and adds specialized equipment cost.§!"
 Mot_AT_company_desc:0 "§YComposition :§! 200 personnels. Équipement : armes légères x180, ATGM embarqués x18, équipement de commandement x18, véhicules utilitaires x6.\n\nA battery dedicated to anti-tank operations, working from mounted firing positions on vehicles. This battery is designed more for speed, allowing them to keep up with quickly moving mobile and armored elements, while still providing increased Anti-Tank capabilities.\n\n§GDesigner Hint: Vehicle Anti-Tank adds high Hard Attack and Piercing without slowing mobile formations. Use it in motorized, armored, airborne, or marine divisions facing tanks, but heavy anti-tank weapons and Utility Vehicles make it more expensive and it contributes little against soft targets.§!"
 AA_company_desc:0 "§YComposition :§! 120 personnels. Équipement : armes légères x90, MANPADS x18, équipement de commandement x18.\n\nUn élément équipé spécifiquement pour engager les éléments aériens ennemis et offrir une défense contre hélicoptères et autres aéronefs.\n\n§GIndice du concepteur : une compagnie antiaérienne offre une forte attaque aérienne sans largeur de combat. Utilisez-la pour protéger des divisions opérant sous la puissance aérienne ennemie, mais elle est faible au combat terrestre et consomme un équipement antiaérien dédié de peu de valeur lorsque le ciel est sûr.§!"
 Combat_engineer_company_desc:0 "§YComposition :§! 150 personnels. Équipement : armes légères x100, équipement de commandement x10, véhicules utilitaires x10.\n\nLes sapeurs de combat mènent des actions de génie offensives en soutien direct des unités de ligne. Ils sont formés et équipés pour franchir un terrain difficile, comme rivières ou fossés antichars. Ils sont aussi équipés pour percer champs de mines ou autres obstacles défensifs, et dégager des zones pour permettre aux autres forces de combat de passer sans entrave.\n\n§GIndice du concepteur : les sapeurs de combat ajoutent défense, percée et de modestes bonus d'attaque et de défense en forêts, montagnes, jungles et villes sans largeur de combat. Utilisez-les pour les assauts en terrain difficile, mais ils exigent un équipement d'infanterie substantiel et offrent moins de valeur spécialisée en terrain ouvert.§!"
 amphibious_landing_detachment_desc:0 "§YComposition :§! 150 personnels. Équipement : équipement de commandement x10, armes légères x100, véhicules utilitaires x10, ATGM embarqués x5.\n\nAttached elements from the navy that allow for rapid and effective amphibious landing operations. Equipped with dedicated landing ships and equipment, these units facility rapid ship-to-shore or Over the Horizon landing operations. The price of attaching one of these units however, is the decrease in capabilities to conduct non-amphibious operations.\n\n§GDesigner Hint: A Naval Landing Detachment greatly improves amphibious Attack, Defense, and Movement for marine formations. Use it in divisions dedicated to storming beaches, but it adds Combat Width, Manpower, and equipment and imposes severe combat penalties in nearly every land terrain.§!"
