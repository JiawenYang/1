l_french:
 ZZ_amphibious_apc_chassis: "Véhicule de combat amphibie"
 ZZ_amphibious_apc_chassis_0: "Véhicule de combat amphibie ancien"
 ZZ_amphibious_apc_chassis_1: "Véhicule de combat amphibie de 1re génération"
 ZZ_amphibious_apc_chassis_2: "Véhicule de combat amphibie de 2e génération"
 ZZ_amphibious_apc_chassis_3: "Véhicule de combat amphibie de 3e génération"
 ZZ_amphibious_apc_chassis_4: "Véhicule de combat amphibie de 4e génération"
 ZZ_amphibious_apc_chassis_desc: "Véhicules de combat amphibies à chenilles tels que l'AAV7 et le ZBD-05, dotés de modules complets de puissance de feu, de protection et de mobilité, conçus pour l'assaut des plages et les opérations fluviales."
 ZZ_amphibious_apc_chassis_0_desc: "Premiers transports amphibies à chenilles de la guerre froide, à la vitesse et à la protection limitées, mais déjà conçus sur un châssis entièrement modulaire."
 ZZ_amphibious_apc_chassis_1_desc: "Véhicules de combat amphibies à chenilles tels que l'AAV7 et le ZBD-05, dotés de modules complets de puissance de feu, de protection et de mobilité, conçus pour l'assaut des plages et les opérations fluviales."
 ZZ_amphibious_apc_chassis_2_desc: "Une nouvelle génération de véhicule d'assaut amphibie dotée d'un groupe motopropulseur plus puissant et d'un blindage renforcé, améliorant nettement la puissance de feu et la survie après le débarquement tout en conservant ses capacités de nage."
 ZZ_amphibious_apc_chassis_3_desc: "Un véhicule amphibie plus mécanisé, doté d'un système de conduite de tir numérique et d'un groupe motopropulseur renforcé, adapté aux opérations de débarquement de haute intensité."
 ZZ_amphibious_apc_chassis_4_desc: "Une nouvelle génération de véhicule amphibie à blindage composite et modules de protection active, capable de maintenir la vitesse d'assaut sous le feu côtier."
 ZZ_amphibious_apc_tech: "Véhicule de combat amphibie"
 ZZ_amphibious_apc_tech_desc: "Débloque le châssis de véhicule de combat amphibie, permettant de concevoir des engins amphibies à chenilles comme l'AAV7 et le ZBD-05 avec des modules complets de puissance de feu, de protection et de mobilité."
 tank_designer_ZZ_amphibious_apc_chassis: "Véhicule de combat amphibie"
 tank_designer_ZZ_amphibious_apc_chassis_is_role_disallowed: "Cette conception ne peut pas être convertie en rôle de §Hvéhicule de combat amphibie§!.\n\nLe véhicule de combat amphibie constitue une ligne de châssis distincte ; concevez-le directement sur un châssis amphibie."
 tank_designer_ZZ_amphibious_apc_chassis_role_disallowed: "Cette conception ne peut pas être convertie en rôle de §Hvéhicule de combat amphibie§!.\n\nLe véhicule de combat amphibie constitue une ligne de châssis distincte ; concevez-le directement sur un châssis amphibie."
 ZZ_amphibious_float_system: "Système de flottaison amphibie"
