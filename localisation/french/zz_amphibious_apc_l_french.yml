l_french:
 ZZ_amphibious_apc_chassis_aavp7a1: "AAVP-7A1"
 ZZ_amphibious_apc_chassis_aavp7a1_desc: "Transport amphibie principal du Corps des Marines américain, entièrement apte à la nage et conçu pour les opérations de débarquement."
 ZZ_amphibious_apc_chassis_zbd05: "ZBD-05"
 ZZ_amphibious_apc_chassis_zbd05_desc: "Véhicule de combat amphibie chinois de nouvelle génération à coque planante et propulsion par hydrojets, à la vitesse de nage de premier plan mondial."
 ZZ_amphibious_apc_chassis_kaav7: "KAAV7"
 ZZ_amphibious_apc_chassis_kaav7_desc: "Dérivé sud-coréen du AAV7A1 produit sous licence, principal véhicule d'assaut amphibie du corps des Marines de la République de Corée."
 ZZ_amphibious_apc_chassis_lvtp5: "LVTP-5"
 ZZ_amphibious_apc_chassis_lvtp5_desc: "Transport amphibie chenillé américain des années 1950, embarquant un peloton renforcé pour les débarquements, remplacé par la série AAV7 dans les années 1970."

 ZZ_amphibious_mechanized_equipment: "VTT amphibie"
