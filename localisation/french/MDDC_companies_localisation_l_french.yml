l_french:
  ###########COMPANIES###########
  #Saudies
  #Companies
  SAU_Saudi_Aramco: "§0Saudi Aramco§!"
  SAU_Saudi_Aramco_desc: "Saudi Aramco est la compagnie pétrolière nationale d’Arabie saoudite, l’une des plus grandes entreprises intégrées d’énergie et de chimie au monde, et détient actuellement les plus grandes réserves prouvées de pétrole au monde. Basée à Dhahran, elle possède le plus grand gisement pétrolier terrestre du monde, Ghawar, et le plus grand gisement offshore, Safaniya."
  
  #Taiwan
  #Companies
  TAI_TSMC_company: "§0TSMC§!"
  TAI_TSMC_company_desc: "Taiwan Semiconductor Manufacturing Company (TSMC) est une multinationale taïwanaise de haute technologie spécialisée dans la fabrication de puces semi-conductrices. Basée dans le parc scientifique de Hsinchu à Taïwan, elle figure parmi les dix plus grandes entreprises mondiales et est le leader mondial de la fabrication de puces. Ses activités principales couvrent la production de puces, l’assemblage, les tests et les services techniques. Grâce à ses technologies de gravure avancées et à son innovation continue, TSMC jouit d’une excellente réputation sur le marché international et détient la plus grande part de marché mondial en fabrication de puces. Elle constitue un pilier essentiel de l’industrie high-tech mondiale et fournit des puces avancées et performantes à des entreprises renommées telles qu’Apple, MediaTek, Google, Nvidia, AMD et OpenAI. TSMC joue également un rôle clé dans le développement des industries de pointe comme l’intelligence artificielle et la conduite autonome."
  
  TAI_Foxconn_company: "§0Foxconn Technology§!"
  TAI_Foxconn_company_desc: "Hon Hai Precision Industry Co., Ltd., plus connue sous la marque Foxconn, est un conglomérat multinational originaire de Taïwan, fondé en 1974. Il se spécialise dans les services OEM pour les produits électroniques, la recherche et la fabrication de composants électriques de précision, de boîtiers, de systèmes nus, d’assemblage de systèmes, de composants de communication optique, d’écrans LCD et d’autres produits et services en amont et en aval de l’industrie 3C (ordinateurs, communications et électronique grand public)."
  
  TAI_Formosa_company: "§0Formosa Plastic Group§!"
  TAI_Formosa_company_desc: "Formosa Plastics Group est l’un des plus grands conglomérats de Taïwan, issu de Formosa Plastics Industrial Co., Ltd., fondée en 1954. Rebaptisée Taiwan Plastics Industrial Co., Ltd. (abrégée « Formosa ») en 1957, elle a depuis étendu son empire. Ses activités couvrent aujourd’hui les plastiques, le raffinage pétrolier, la pétrochimie, les textiles, l’électronique, l’énergie, les transports, l’industrie lourde, la biotechnologie, la médecine et l’éducation. Après plus de soixante ans de développement, Formosa Plastics possède plus d’une centaine de sociétés affiliées, dont Formosa Plastics, Nan Ya Plastics, Formosa Chemicals & Fibre et Formosa Petrochemical, avec des usines à Taïwan, aux États-Unis, en Chine continentale, au Vietnam, aux Philippines et en Indonésie. Le groupe détient également de nombreuses institutions éducatives et médicales, ce qui en fait l’une des plus grandes entreprises privées de Taïwan."
  
  #France
  #Companies
  FRA_LVMH_company: "§0LVMH§!"
  FRA_LVMH_company_desc: "Moët Hennessy Louis Vuitton (LVMH) est le plus grand conglomérat mondial de biens de luxe, régulièrement classé parmi les Global 500 de Fortune. Basé à Paris, en France, le groupe est né en 1987 de la fusion de la marque de mode Louis Vuitton et de Moët Hennessy (elle-même issue en 1971 de la fusion de Moët & Chandon et Hennessy). LVMH contrôle environ 60 filiales, chacune gérant un petit nombre de marques très prestigieuses. Ces filiales fonctionnent généralement de manière indépendante."
  
  FRA_LOreal_company: "§0L'Oréal§!"
  FRA_LOreal_company_desc: "L'Oréal est une entreprise de soins de la peau et de cosmétiques basée à Paris, en France. Fondée en 1909, elle est le plus grand groupe de cosmétiques au monde et figure dans le Fortune Global 500. L'Oréal opère dans plus de 150 pays et régions, avec 150 filiales, 42 usines, plus de 100 distributeurs et 88 000 employés dans le monde."
  
  FRA_TotalEnergies_company: "§0TotalEnergies§!"
  FRA_TotalEnergies_company_desc: "TotalEnergies est une compagnie pétrolière française, l’une des six plus grandes au monde et l’une des plus importantes d’Europe par capitalisation boursière. Ses activités couvrent toute la chaîne de valeur du pétrole et du gaz : exploration et production, génération d’électricité, transport, raffinage, vente de produits pétroliers et commerce international de brut et de produits. TotalEnergies est également un important producteur chimique. Le siège est situé dans le quartier de La Défense, près de Paris."
  
  FRA_Schneider_Electric_company: "§0Schneider Electric§!"
  FRA_Schneider_Electric_company_desc: "Schneider Electric, multinationale française fondée en 1836, est l’un des leaders mondiaux de la gestion de l’énergie et des solutions d’optimisation. Ses produits principaux incluent disjoncteurs, capteurs et contrôleurs, offrant des solutions complètes pour les installations énergétiques, l’industrie, les centres de données et réseaux, et les bâtiments. Elle occupe des positions de leader mondial dans les marchés de l’énergie, des infrastructures, du contrôle de processus industriels, de l’automatisation des bâtiments et des centres de données. Pionnière de l’industrie française depuis sa création, Schneider était l’un des trois grands fabricants d’armes européens à la fin du XIXe siècle. En 2008, son chiffre d’affaires mondial atteignait 18,3 milliards d’euros. Sa mission : permettre à chacun d’utiliser mieux l’énergie et les ressources, en construisant des ponts vers le progrès et la durabilité pour tous."
  
  FRA_Vinci_SA_company: "§0Vinci S.A.§!"
  FRA_Vinci_SA_company_desc: "Vinci est une entreprise de construction française basée à Rueil-Malmaison, en banlieue de Paris. Outre la construction, elle exploite plusieurs aéroports."
  
  #Turkey
  #Companies
  TUR_Koc_Holding_company: "§0Koç Holding§!"
  TUR_Koc_Holding_company_desc: "Koç Holding S.A. est le plus grand conglomérat de Turquie. Basé à Istanbul, il appartient à la célèbre famille Koç."
  
  #Germany
  #Companies
  GER_SAP_company: "§0SAP§!"
  GER_SAP_company_desc: "SAP est une entreprise allemande de logiciels basée à Walldorf, dans le Bade-Wurtemberg. Spécialisée dans les logiciels de gestion des ressources d’entreprise (ERP), elle possède des bureaux dans 130 pays et sert plus de 335 000 clients dans 190 pays. Son action fait partie de l’indice Stoxx Europe 50."
  
  GER_Volkswagen_company: "§0Volkswagen§!"
  GER_Volkswagen_company_desc: "Volkswagen est un constructeur automobile basé à Wolfsburg, en Allemagne. C’est la marque fondatrice et la plus vendue du groupe Volkswagen, ainsi que le plus grand constructeur automobile mondial. En allemand, « Volks » signifie « peuple » et « Wagen » signifie « voiture », donc son nom complet signifie « voiture du peuple »."
  
  GER_Siemens_company: "§0Siemens AG§!"
  GER_Siemens_company_desc: "Siemens AG est une multinationale allemande, pionnière mondiale dans les produits électriques et électroniques, active dans les secteurs de l’énergie, de la santé, de l’industrie, des infrastructures et des villes. Fondée en 1847 par Werner von Siemens, elle est basée à Munich et Berlin, et cotée à la Bourse de Francfort et à celle de New York."
  
  GER_BMW_company: "§0BMW§!"
  GER_BMW_company_desc: "BMW (Bayerische Motoren Werke GmbH) est un fabricant allemand multinational de voitures de luxe, de motos et de moteurs, basé à Munich, en Bavière."
  
  GER_Deutsche_Telekom_company: "§0Deutsche Telekom AG§!"
  GER_Deutsche_Telekom_company_desc: "Deutsche Telekom AG, souvent appelée simplement Deutsche Telekom, est basée à Bonn et est le plus grand opérateur de télécommunications d’Europe par chiffre d’affaires. Elle fournit des accès réseaux fixes (VDSL, DSL, FTTH) et mobiles (5G, 4G, 3G, 2G) aux particuliers, entreprises et distributeurs, ainsi que d’autres services IT."
  
  GER_MercedesBenz_company: "§0Mercedes-Benz AG§!"
  GER_MercedesBenz_company_desc: "Mercedes-Benz Group est un constructeur automobile basé à Stuttgart, en Allemagne. Par volume de ventes, Mercedes-Benz fait partie des dix premiers constructeurs mondiaux, est le plus grand fabricant de véhicules utilitaires et le deuxième plus grand producteur de camions. La marque est également réputée pour ses voitures de luxe."
  
  GER_Landesbank: "§0Landesbank Baden-Württemberg§!"
  GER_Landesbank_desc: "La Banque du Land de Bade-Wurtemberg (LBBW), créée en janvier 1999 et basée à Stuttgart, est l’institution centrale des caisses d’épargne du Bade-Wurtemberg. Elle gère environ 333 milliards d’euros d’actifs. Ses activités couvrent la banque de détail, la banque de gros et les opérations d’épargne."
  
  GER_Deutsche_Bahn: "§0Deutsche Bahn§!"
  GER_Deutsche_Bahn_desc: "Deutsche Bahn AG est une entreprise de transport publique allemande basée à Berlin. Fondée en 1994 à Francfort par la fusion de l’ancienne Deutsche Bundesbahn et Deutsche Reichsbahn, elle a déménagé à Berlin en 2000, s’installant dans une nouvelle tour ferroviaire près de Potsdamer Platz. Certains départements centraux restent à Francfort. Actuellement, c’est la deuxième plus grande entreprise de transport au monde après Deutsche Post, et le plus grand opérateur ferroviaire et gestionnaire d’infrastructures en Europe."
  
  GER_Lufthansa: "§0Lufthansa§!"
  GER_Lufthansa_desc: "Lufthansa est la compagnie aérienne nationale allemande et membre fondateur de Star Alliance. Elle est la plus grande compagnie aérienne d’Europe par nombre de passagers et taille de flotte, et la quatrième au monde par capacité passagers. Avec British Airways, elle est l’une des deux seules compagnies européennes à encore exploiter l’Airbus A380. « Luft » signifie « air » en allemand, et « Hansa » fait référence à la Ligue hanséatique, puissante alliance commerciale du nord de l’Allemagne aux XIIIe-XVe siècles."
  
  #England
  #Companies
  ENG_AstraZeneca_company: "§0AstraZeneca§!"
  ENG_AstraZeneca_company_desc: "AstraZeneca est une grande société biopharmaceutique anglo-suédoise née le 6 avril 1999 de la fusion de l’Astra suédoise et de la Zeneca britannique (elle-même issue d’Imperial Chemical Industries en 1993). Basée dans le parc biomédical de Cambridge, elle développe, fabrique et commercialise des médicaments et vaccins pour les maladies digestives, cardiovasculaires, oncologiques, du système nerveux central et respiratoires, ainsi que pour l’anesthésie."
  
  ENG_Shell_company: "§0Shell plc§!"
  ENG_Shell_company_desc: "Shell est la deuxième plus grande compagnie pétrolière mondiale, enregistrée au Royaume-Uni et basée à La Haye, aux Pays-Bas. Elle est née de la fusion de Royal Dutch Petroleum et de la britannique Shell Transport & Trading. Royal Dutch Petroleum fut fondée en 1890 avec un mandat spécial de la monarchie néerlandaise. Pour concurrencer Standard Oil (alors la plus grande compagnie pétrolière), elle fusionna en 1907 avec Shell Transport & Trading Ltd pour former la Shell actuelle. Shell reste un géant du pétrole, de l’énergie, de la chimie et de l’énergie solaire, avec cinq activités principales : exploration et production, gaz naturel et électricité, gaz de charbon, chimie et énergies renouvelables. Elle possède des filiales ou opérations dans plus de 140 pays et territoires."
  
  ENG_Linde_company: "§0The Linde Group§!"
  ENG_Linde_company_desc: "Linde Group est un groupe industriel chimique basé à Munich, en Allemagne. Fondé en 1879 par Carl von Linde, c’est le plus grand groupe mondial de gaz industriels par part de marché. Coté à la Deutsche Börse et à la Bourse suisse, il fait partie du DAX. Linde possède plus de 600 filiales dans plus de 100 pays, opérant dans l’industrie, le commerce de détail, le négoce, la technologie, la R&D et le secteur public."
  
  ENG_Unilever_company: "§0Unilever plc§!"
  ENG_Unilever_company_desc: "Unilever est une multinationale britannique de biens de consommation née de la fusion de la néerlandaise Margarine Unie et de la britannique Lever Brothers. Basée à Rotterdam et à Londres, elle produit des aliments, boissons, produits de nettoyage et de soin personnel. Par chiffre d’affaires 2012, c’est la troisième plus grande entreprise de biens de consommation au monde, après Procter & Gamble et Nestlé. Unilever est le plus grand producteur mondial de margarines et spreads. L’une des plus anciennes multinationales, ses produits sont vendus dans environ 190 pays et régions."
  
  ENG_BP_company: "§0BP plc§!"
  ENG_BP_company_desc: "BP, anciennement British Petroleum, est l’une des six plus grandes compagnies pétrolières mondiales et l’une des dix plus grandes entreprises privées au monde. Son prédécesseur, l’Anglo-Persian Oil Company, fut fondé en 1908 et rebaptisé British Petroleum en 1954. L’entreprise intègre l’exploration et production pétrolière et gazière, le raffinage, le stockage, la vente et le commerce international de brut et de produits."
  
  ENG_Diageo_company: "§0Diageo§!"
  ENG_Diageo_company_desc: "Diageo Public Company Limited est une multinationale britannique de boissons alcoolisées basée à Londres. Diageo est le plus grand producteur mondial de spiritueux distillés et un important producteur de bière et de vin."
  
  ENG_GlaxoSmithKline_company: "§0GlaxoSmithKline§!"
  ENG_GlaxoSmithKline_company_desc: "GlaxoSmithKline (GSK) est la troisième plus grande entreprise pharmaceutique, biotechnologique et de santé au monde, basée à Londres, au Royaume-Uni. GSK est une société de recherche couvrant les anti-infectieux, le système nerveux central, les voies respiratoires, la gastro-entérologie/métabolisme, l’oncologie et les vaccins. Elle occupe également des positions de leader dans les produits d’hygiène bucco-dentaire, les boissons nutritionnelles et les médicaments en vente libre."
  
  ENG_HSBC: "§0HSBC§!"
  ENG_HSBC_desc: "HSBC Holdings plc est la société holding du groupe HSBC, basée à Londres, au Royaume-Uni. C’est la plus grande banque européenne. Bien que HSBC ait été officiellement créé en 1991, sa filiale HSBC Bank a plus de 160 ans d’histoire. HSBC est l’une des plus grandes organisations bancaires et de services financiers au monde. Avec un réseau international profondément enraciné dans six grandes régions, elle compte environ 4 000 bureaux dans 64 pays et territoires en Europe, à Hong Kong, en Asie-Pacifique, au Moyen-Orient, en Amérique du Nord et en Amérique latine, servant plus de 50 millions de clients."
  
  ENG_Rio_Tinto: "§0Rio Tinto§!"
  ENG_Rio_Tinto_desc: "Rio Tinto est un groupe minier et de ressources multinational qui opère également dans le charbon, le fer, le cuivre, l’or, les diamants, l’aluminium et l’énergie."
  
  ENG_Barclays: "§0Barclays§!"
  ENG_Barclays_desc: "Barclays est la deuxième plus grande banque du Royaume-Uni après HSBC. Avec plus de 300 ans d’histoire, c’est la plus ancienne banque britannique, remontant à 1690. Barclays fut la première banque au monde à posséder un distributeur automatique et émit la première carte de crédit britannique en 1966 et la première carte de débit en 1987. Son siège est situé à One Churchill Place, Canary Wharf, Londres."
  
  ENG_NatWest_Group: "§0NatWest Group§!"
  ENG_NatWest_Group_desc: "NatWest Group plc, anciennement Royal Bank of Scotland Group et RBS Group, est une holding bancaire et d’assurance britannique basée à Édimbourg, en Écosse. Ses opérations couvrent l’Europe, l’Amérique du Nord et l’Asie. Au Royaume-Uni, les filiales de NatWest Holdings incluent la Royal Bank of Scotland, NatWest Bank, Ulster Bank et Coutts Bank. Le groupe RBS a le droit d’émettre des billets en livres sterling en Écosse et en Irlande du Nord."
  
  ENG_BT_Group: "§0BT Group§!"
  ENG_BT_Group_desc: "BT Group plc, à l’origine une entreprise publique britannique de télécommunications gérée par le General Post Office, fut séparée de la Royal Mail le 1er octobre 1981 pour devenir une entreprise publique indépendante. Sous le gouvernement conservateur de Margaret Thatcher, 50 % des actions publiques furent vendues en 1984, la transformant en entreprise privée. BT reste le plus grand opérateur d’infrastructures télécoms au Royaume-Uni. Elle possède des succursales ou bureaux dans 170 pays. Actuellement, les activités à l’étranger représentent un tiers du chiffre d’affaires du groupe."
  
  #China
  #Companies
  CHI_Tencent_company: "§0Tencent§!"
  CHI_Tencent_company_desc: "Tencent Holdings Limited est une multinationale chinoise. Fondée en novembre 1998 par cinq fondateurs — Ma Huateng, Zhang Zhidong, Chen Yidan, Xu Chenye et Zeng Liqing — elle est basée dans le bâtiment Tencent Binhai à Nanshan, Shenzhen. Les activités de Tencent couvrent les réseaux sociaux, la finance, l’investissement, l’information, les outils et les plateformes. Ses filiales proposent divers services et produits internet mondiaux, le divertissement, l’intelligence artificielle et la technologie."
  
  CHI_Alibaba_company: "§0Alibaba§!"
  CHI_Alibaba_company_desc: "Fondé en 1999, Alibaba Group est un conglomérat diversifié en Chine continentale principalement axé sur les services internet. Il possède des sièges doubles à Hangzhou, Shanghai et Pékin. Les services d’Alibaba englobent le commerce B2B, la vente au détail en ligne, les moteurs de recherche shopping, le paiement tiers et le cloud computing. Ses filiales incluent Alibaba B2B, Taobao, Tmall, Etao, Alibaba Cloud, Juhuasuan, AliExpress, Alibaba.com, Ele.me, Fliggy, Youku, Hema Fresh, Alibaba Pictures, Cainiao Network, UC Browser, DingTalk, Amap, Lazada et Daraz."
  
  CHI_CCB_company: "§0China Construction Bank Corporation§!"
  CHI_CCB_company_desc: "China Construction Bank Corporation est l’une des quatre grandes banques commerciales d’État à capitaux mixtes en Chine continentale et la deuxième plus grande banque du pays. Elle fait partie des « huit banques et cinq assurances » représentant les actions financières chinoises cotées à Hong Kong."
  
  CHI_ICBC_company: "§0Industrial and Commercial Bank of China§!"
  CHI_ICBC_company_desc: "Industrial and Commercial Bank of China Limited (ICBC) fut créée le 1er janvier 1984. C’est l’une des cinq grandes banques commerciales d’État en Chine continentale, basée à Pékin. Elle fut établie en séparant les activités de crédit industriel et commercial et d’épargne de la Banque populaire de Chine ; c’est la plus grande banque de Chine continentale."
  
  CHI_Baidu_company: "§0Baidu§!"
  CHI_Baidu_company_desc: "Baidu est une multinationale technologique basée à Pékin, en Chine, principalement active dans les moteurs de recherche internet, l’intelligence artificielle et les services technologiques associés. Fondée le 1er janvier 2000 à Zhongguancun par Robin Li et Eric Xu, Baidu est l’un des premiers fournisseurs chinois de services de moteur de recherche commercial. Son produit phare est « Baidu Search » ; elle a progressivement développé des activités incluant la publicité en ligne, les Q&R, le cloud computing, la conduite autonome et les puces IA."
  
  CHI_Lenovo_company: "§0Lenovo§!"
  CHI_Lenovo_company_desc: "Lenovo Group Limited est une multinationale technologique chinoise fondée en 1984 avec un investissement de 200 000 RMB de l’Institut de technologie informatique de l’Académie chinoise des sciences et 11 scientifiques. Son nom initial était « New Technology Development Company of the Institute of Computing Technology, Chinese Academy of Sciences ». En 1989, elle fut rebaptisée « Lenovo Computer Group Limited »."
  
  CHI_huawei: "§0Huawei§!"
  CHI_huawei_desc: "Huawei Technologies Co., Ltd. est une entreprise technologique fondée en 1987 par Ren Zhengfei, basée à Shenzhen, province du Guangdong, en République populaire de Chine. Initialement axée sur la fabrication de centraux téléphoniques, Huawei se concentre aujourd’hui sur la R&D et la fabrication d’équipements de communication et d’électronique grand public. Huawei est également active dans le développement logiciel, la conception et production de circuits intégrés, le photovoltaïque et les véhicules électriques."
  
  CHI_xiaomi: "§0Xiaomi§!"
  CHI_xiaomi_desc: "Xiaomi Corporation fut fondée le 6 avril 2010. C’est une entreprise d’électronique grand public et de fabrication intelligente, centrée sur les smartphones, le matériel intelligent et les plateformes IoT."
  
  CHI_Petro_China: "§0PetroChina§!"
  CHI_Petro_China_desc: "China National Petroleum Corporation (CNPC) est une grande entreprise centrale de la République populaire de Chine principalement active dans les opérations pétrolières et gazières, les services techniques et d’ingénierie, la construction d’ingénierie pétrolière, la fabrication d’équipements pétroliers, les services financiers et le développement des nouvelles énergies. Basée à Pékin, elle fut initialement créée sous le nom China Petroleum Corporation à Shanghai le 1er juin 1946. Le 27 juillet 1998, CNPC fut formée par la réorganisation du ministère de l’Industrie pétrolière, sur la base de l’ancienne China National Petroleum Corporation. C’est le plus grand producteur et fournisseur de pétrole brut et de gaz naturel en Chine continentale, et l’un des plus grands producteurs et fournisseurs de produits pétrochimiques raffinés."
  
  CHI_China_State_Construction_Engineering: "§0China State Construction Engineering§!"
  CHI_China_State_Construction_Engineering_desc: "China State Construction Engineering Corporation (CSCEC) est une grande entreprise centrale de la République populaire de Chine principalement active dans la construction de logements, l’externalisation d’ingénierie internationale, le développement immobilier, la construction d’infrastructures, et les études et relevés. Ses produits principaux sont les bâtiments industriels modernes ; c’est actuellement le plus grand groupe d’investissement et de construction et entrepreneur en ingénierie au monde."
  
  CHI_China_Telecom: "§0China Telecom§!"
  CHI_China_Telecom_desc: "China Telecom Group Corporation est une grande entreprise centrale de la République populaire de Chine principalement active dans les télécommunications. China Telecom est un opérateur mondial leader de services intelligents d’information intégrés, fournissant principalement des services de communication fixe et mobile, d’accès internet, d’information et d’autres services à valeur ajoutée dans 31 provinces, municipalités, régions autonomes et la région administrative spéciale de Macao en Chine continentale."
  
  CHI_Agricultural_Bank: "§0Agricultural Bank of China§!"
  CHI_Agricultural_Bank_desc: "Agricultural Bank of China Limited est l’une des cinq grandes banques commerciales d’État de la République populaire de Chine, classée troisième en actifs parmi les banques chinoises."
  
  CHI_CNOOC: "§0China National Offshore Oil Corporation§!"
  CHI_CNOOC_desc: "China National Offshore Oil Corporation (CNOOC) est une grande entreprise centrale de la République populaire de Chine principalement active dans le développement offshore de pétrole et de gaz. C’est la troisième plus grande compagnie pétrolière d’État de Chine. Fondée en 1982 et basée à Pékin, CNOOC est principalement responsable du développement coopératif des ressources pétrolières et gazières offshore dans les eaux chinoises. Son capital social enregistré est de 50 milliards de RMB. CNOOC détient une participation majoritaire dans la société cotée China National Offshore Oil Corporation Limited (CNOOC Limited)."
  
  #Netherlands
  #Companies
  HOL_ABN_AMRO: "§0ABN AMRO§!"
  HOL_ABN_AMRO_desc: "ABN AMRO est l’une des plus grandes institutions financières multinationales des Pays-Bas, avec des succursales dans le monde entier. Sa taille et sa puissance économique la placent parmi les leaders européens. Son siège est situé à Zuidas, Amsterdam. Le bâtiment du siège, haut de 105 mètres, est le plus haut de la zone Zuidas et l’un des principaux moteurs du développement économique de cette région."
  
  HOL_Airlines: "§0KLM Royal Dutch Airlines§!"
  HOL_Airlines_desc: "KLM Royal Dutch Airlines est la compagnie aérienne nationale des Pays-Bas. Fondée en 1919, elle est aujourd’hui une filiale du groupe Air France-KLM et membre de SkyTeam."
  
  #USA
  #Companies
  USA_Apple_company: "§0Apple§!"
  USA_Apple_company_desc: "Apple Inc. est une multinationale technologique américaine basée à Cupertino, en Californie. Considérée comme l’une des cinq grandes géantes technologiques avec Amazon, Google, Microsoft et Meta, ses activités actuelles incluent la conception, la R&D et la vente de communications mobiles, d’électronique grand public, de logiciels informatiques, de services en ligne et d’ordinateurs personnels."
  
  USA_Ford: "§0Ford§!"
  USA_Ford_desc: "Ford Motor Company est un constructeur automobile multinational américain basé à Dearborn, dans le Michigan. Fondée par Henry Ford et incorporée en 1903, elle fut, au sommet du XXe siècle, avec General Motors et Chrysler, l’un des « Big Three » de Détroit dominant le marché automobile américain. Ford occupa la deuxième place du marché américain pendant 75 années consécutives, derrière General Motors seulement. Henry Ford adopta des méthodes de production de masse et de gestion d’une main-d’œuvre importante, créant ingénieusement une nouvelle séquence de production basée sur la conception, symbolisée par la chaîne de montage mobile. Cette combinaison d’efficacité élevée, de salaires hauts et de prix bas représenta une réforme et une innovation révolutionnaires pour la fabrication américaine de l’époque ; cette méthode fut plus tard connue sous le nom de fordisme, et sa philosophie industrielle fut qualifiée de fordisme par Antonio Gramsci."
  
  USA_Microsoft_company: "§0Microsoft Corporation§!"
  USA_Microsoft_company_desc: "Microsoft est une multinationale technologique américaine fondée en 1975 par Bill Gates et Paul Allen. Basée à Redmond, dans l’État de Washington, elle est considérée comme l’une des cinq grandes géantes technologiques avec Amazon, Apple, Google et Meta, et l’un des quatre plus grands fournisseurs de services cloud (CSP) en Amérique du Nord. Son activité principale est la recherche, le développement, la fabrication, la licence et la fourniture d’une large gamme de services logiciels informatiques. Ses produits les plus célèbres et les plus vendus sont le système d’exploitation Microsoft Windows et la suite Microsoft Office. D’autres filiales, comme l’activité jeux Xbox, sont également très connues. À ses débuts, l’entreprise développait et vendait principalement des interpréteurs BASIC pour l’Altair 8800. Au milieu des années 1980, elle progressa significativement sur le marché des systèmes d’exploitation pour ordinateurs personnels avec MS-DOS. L’émergence ultérieure de Windows permit à Microsoft de dominer progressivement le marché des systèmes d’exploitation pour ordinateurs de bureau. Parallèlement, Microsoft commença à élargir ses activités dans d’autres secteurs, créant le site MSN. Sur le marché du matériel informatique apparurent successivement la marque Microsoft, la console Xbox, Zune et les appareils de divertissement domestique MSN TV. Microsoft entra en bourse en 1986 ; la hausse continue de son cours a créé quatre milliardaires et 12 000 millionnaires. À mesure que l’entreprise grandissait, elle fit face à des critiques et accusations croissantes, une tendance qui dure depuis des décennies. Des pratiques comme le refus de vente et le groupement ont conduit à des poursuites pour violation des lois antitrust et concurrence déloyale. Le Département de la Justice américain et la Commission européenne ont tous deux rendu des décisions défavorables contre Microsoft en matière de droit de la concurrence."
  
  USA_Alphabet_company: "§0Alphabet§!"
  USA_Alphabet_company_desc: "Alphabet Inc. est une holding basée en Californie, États-Unis. Créée le 2 octobre 2015 comme spin-off de Google, elle a hérité du statut coté et du symbole boursier de Google. Après la restructuration, Google est devenue la plus grande filiale d’Alphabet. Les filiales d’Alphabet incluent Calico, CapitalG, Chronicle, DeepMind, Google, Google Fiber, GV, Jigsaw, Loon LCC, Sidewalk Labs, Verily, Waymo et X."
  
  USA_Amazon_company: "§0Amazon§!"
  USA_Amazon_company_desc: "Amazon est une multinationale américaine de commerce électronique basée à Seattle, actuellement l’un des plus grands détaillants en ligne au monde. Amazon exploite des sites de vente au détail aux États-Unis, au Canada, au Royaume-Uni, en France, en Allemagne, en Chine, à Singapour, en Italie, en Espagne, au Brésil, au Japon, en Inde, au Mexique, en Australie et aux Pays-Bas ; certains produits sont également vendus à d’autres pays via l’expédition internationale. Des sites locaux sont également prévus en Pologne, en Suède, etc."
  
  USA_Berkshire_Hathaway_company: "§0Berkshire Hathaway§!"
  USA_Berkshire_Hathaway_company_desc: "Berkshire Hathaway est une holding diversifiée multinationale basée à Omaha, dans le Nebraska, États-Unis, gérant de nombreuses filiales. À l’origine une entreprise textile, elle s’est transformée en holding après que Warren Buffett en a pris le contrôle en 1965. Buffett a stratégiquement alloué ses bénéfices non distribués à des investissements, créant des filiales dans l’immobilier, l’assurance dommages, la réassurance et l’assurance spécialisée. Au fil des ans, l’entreprise a constamment généré plus de 20 % de croissance annuelle de valeur pour ses actionnaires grâce à un capital de plus en plus solide et une dette minimale."
  
  USA_Nvidia_Corporation_company: "§0Nvidia Corporation§!"
  USA_Nvidia_Corporation_company_desc: "Fondée en janvier 1993, NVIDIA est une entreprise américaine de semi-conducteurs sans usine (fabless) principalement active dans la conception et la vente d’unités de traitement graphique (GPU). Basée à Santa Clara, en Californie, au cœur de la Silicon Valley, NVIDIA conçoit également des processeurs graphiques pour consoles de jeux, comme la première Xbox, la PlayStation 3, la Nintendo Switch et la Nintendo Switch 2. Ses gammes les plus célèbres sont GeForce pour les particuliers et gamers, Quadro pour les stations de travail CGI professionnelles, et Tesla pour les serveurs et le calcul haute performance. Bien qu’issue du marché des cartes graphiques PC, NVIDIA s’est également aventurée dans la conception de la puce mobile Tegra, mais avec peu de succès sur le marché des smartphones."
  
  USA_Exxon_Mobil_Corporation_company: "§0Exxon Mobil Corporation§!"
  USA_Exxon_Mobil_Corporation_company_desc: "ExxonMobil est une multinationale pétrolière et gazière basée à Spring, au Texas, États-Unis. Elle fut créée le 30 novembre 1999 par la fusion d’Exxon et Mobil. Outre son activité pétrole et gaz, l’entreprise est active dans la chimie, produisant plastiques et caoutchoucs synthétiques. En tant que géant pétrolier, c’est la plus grande compagnie pétrolière privée au monde et la plus grande du monde occidental. Elle est depuis longtemps critiquée pour la pollution environnementale et son déni du changement climatique ; la marée noire du golfe d’Alaska fut causée par l’entreprise. Elle a également été accusée de violations des droits humains et d’ingérence dans la politique américaine."
  
  USA_Walmart_company: "§0Walmart§!"
  USA_Walmart_company_desc: "Walmart est un détaillant multinational américain, le plus grand détaillant et la plus grande entreprise au monde. Basé à Bentonville, dans l’Arkansas, il emploie plus de deux millions de personnes. Walmart est une entreprise familiale contrôlée par la famille Walton, qui détient 48 % du capital. Fondée par Sam Walton en 1962, Walmart fut incorporée le 31 octobre 1969 et entra en bourse au NYSE en 1972. Walmart est également le plus grand détaillant alimentaire des États-Unis. L’entreprise possède 8 500 magasins dans 15 pays. Elle opère dans les 50 États américains et à Porto Rico. Elle exploite Walmex au Mexique, Asda au Royaume-Uni, Seiyu (incluant Muji) au Japon, Massmart dans plusieurs pays africains, et une coentreprise avec Bharti en Inde appelée « Best Price Modern Wholesale ». Elle possède entièrement ses opérations en Argentine, au Brésil et au Canada. Les investissements de Walmart hors États-Unis ont donné des résultats mitigés : succès au Canada, au Royaume-Uni, en Amérique centrale et du Sud, et en Chine, mais échecs en Allemagne, au Japon et en Corée du Sud."
  
  USA_United_Health_company: "§0United Health Group§!"
  USA_United_Health_company_desc: "UnitedHealth Group est la deuxième plus grande entreprise mondiale d’assurance maladie et de technologies de l’information santé par chiffre d’affaires, basée à Minneapolis, dans le Minnesota, États-Unis. UnitedHealth conçoit une gamme complète de plans d’assurance maladie et de services pour une population diversifiée. Elle sert 90 millions de personnes aux États-Unis et compte environ 300 000 employés dans les 50 États et plus de 130 pays."
  
  USA_Coke_company: "§0The Coca-Cola Company§!"
  USA_Coke_company_desc: "The Coca-Cola Company est une multinationale bien connue, célèbre pour la production, la vente et le marketing de boissons gazeuses ; elle fournit également des concentrés, sirops et boissons alcoolisées. Son produit le plus célèbre est Coca-Cola, la première marque de cola au monde. Son siège est à Atlanta, en Géorgie, États-Unis. En 1886, le pharmacien américain John Pemberton inventa la formule Coca-Cola. En 1889, l’industriel américain Asa Candler acheta la formule et la marque ; en 1892, The Coca-Cola Company fut officiellement enregistrée à Atlanta. L’action de l’entreprise est cotée au NYSE et fait partie des indices Dow Jones Industrial Average, S&P 500 et S&P 100."
  
  USA_Tesla_company: "§0Tesla§!"
  USA_Tesla_company_desc: "Tesla est la plus grande entreprise américaine de véhicules électriques et de panneaux solaires."
  
  USA_PandG_company: "§0The Procter & Gamble Company§!"
  USA_PandG_company_desc: "Procter & Gamble (P&G) est une multinationale américaine de biens de consommation, l’un des plus grands fabricants mondiaux de produits de grande consommation. Basée à Cincinnati, dans l’Ohio, États-Unis, elle emploie près de 140 000 personnes dans le monde. Ses produits principaux incluent les produits de nettoyage, de soin personnel et d’alimentation pour animaux."
  
  USA_JPMorgan: "§0JPMorgan Chase§!"
  USA_JPMorgan_desc: "JPMorgan Chase & Co. est une institution financière américaine basée à New York. Sa division banque commerciale compte 5 100 agences. JPMorgan Chase opère dans plus de 50 pays ; ses services incluent la banque d’investissement, le trading et les services sur titres, la gestion d’actifs, les services financiers commerciaux et la banque privée."
  
  USA_CityGroup: "§0Citigroup§!"
  USA_CityGroup_desc: "Citigroup, basée à New York, est l’une des plus grandes banques d’investissement et institutions financières au monde. Elle fut créée en 1998 par la fusion de Citicorp et Travelers Group, puis entra en bourse. L’histoire de l’entreprise remonte à la fondation de City Bank of New York (plus tard Citigroup) en 1812 ; Bank Handlowy en 1870 ; Smith Barney en 1873 ; Banamex en 1884 ; et Salomon Brothers en 1910."
  
  USA_Marathon_Petroleum: "§0Marathon Petroleum§!"
  USA_Marathon_Petroleum_desc: "Marathon Petroleum est une entreprise américaine d’exploration et production pétrolière et gazière. Ses principales opérations se situent aux États-Unis, en Norvège, en Guinée équatoriale, en Angola et ailleurs. Son siège est à Houston."
  
  USA_att: "§0AT&T§!"
  USA_att_desc: "AT&T est une multinationale américaine et le plus grand fournisseur de services téléphoniques fixes et mobiles aux États-Unis, ainsi que de services broadband et pay-TV. Elle compte au total 150 millions d’abonnés, dont 85,1 millions sans fil. Southwestern Bell, fondée en 1983, fut l’une des entreprises indépendantes issues du procès antitrust entre le gouvernement américain et AT&T. Aujourd’hui, AT&T détient de nombreux actifs cédés en 1983 via des acquisitions. Son siège est au centre-ville de Dallas, au Texas."
  
  USA_ibm: "§0IBM§!"
  USA_ibm_desc: "IBM, ou International Business Machines Corporation, est une multinationale technologique américaine surnommée affectueusement « Big Blue ». C’est la plus grande entreprise mondiale de technologie et de solutions d’affaires, employant plus de 310 000 personnes dans plus de 160 pays et régions. Son siège est à Armonk, dans l’État de New York. Les principaux clients d’IBM sont les gouvernements et les entreprises ; elle fournit des services et du conseil. IBM fabrique et vend du matériel et des logiciels informatiques et offre des services de conseil en architecture de systèmes et hébergement de réseaux. Bien que principalement commerciale, IBM possède une longue histoire de réalisations scientifiques en science des matériaux, physique et chimie, et a inventé de nombreux produits issus de cette recherche académique. Parmi les inventions les plus connues d’IBM figurent le disque dur, les distributeurs automatiques de billets, le code-barres UPC, SQL, les systèmes de gestion de bases de données relationnelles, la DRAM et Watson."
  
  USA_ge: "§0General Electric§!"
  USA_ge_desc: "General Electric (GE) est un conglomérat multinational américain actif dans l’électronique, l’énergie, les transports, l’aéronautique, la santé et les services financiers. Basée à Boston et incorporée dans l’État de New York, GE opère dans plus de 100 pays et emploie environ 287 000 personnes."
  
  USA_Chevron_Corporation: "§0Chevron Corporation§!"
  USA_Chevron_Corporation_desc: "Chevron Corporation est l’une des plus grandes multinationales énergétiques au monde, basée à San Ramon, en Californie, et opérant dans plus de 180 pays. Ses activités couvrent tous les aspects de l’industrie pétrolière et gazière : exploration, production, raffinage, commercialisation, transport, pétrochimie et production d’électricité. Elle fabrique également des véhicules à essence. À l’origine nommée Standard Oil of California, Chevron fut créée en 1911 par la scission de Standard Oil suite à une affaire antitrust. Chevron est l’une des six plus grandes compagnies pétrolières mondiales."
  
  USA_Bank_America: "§0Bank of America§!"
  USA_Bank_America_desc: "Bank of America est la deuxième plus grande banque commerciale des États-Unis par actifs, après JPMorgan Chase. Elle compte environ 5 600 agences et 16 200 distributeurs automatiques dans plus de 150 pays. Ses origines remontent à la Bank of Massachusetts en 1784, ce qui en fait la deuxième plus ancienne banque des États-Unis."
  
  USA_Home_Depot: "§0Home Depot§!"
  USA_Home_Depot_desc: "Home Depot est un détaillant américain de matériaux de construction et d’amélioration de l’habitat basé à Vinings, en Géorgie, dans la zone métropolitaine d’Atlanta. Home Depot emploie plus de 355 000 personnes et exploite 2 164 grands magasins dans les États-Unis (y compris les 50 États, le district de Columbia, Porto Rico, les îles Vierges et Guam), au Canada (10 provinces), au Mexique et en Chine."
  
  USA_Kroger: "§0Kroger§!"
  USA_Kroger_desc: "Kroger, Inc. est une entreprise de distribution américaine fondée en 1883 à Cincinnati, dans l’Ohio, par Bernard Kroger. Par chiffre d’affaires, c’est la plus grande chaîne de supermarchés des États-Unis et la 23e plus grande entreprise du pays. Kroger est également le troisième plus grand détaillant mondial et le troisième plus grand employeur des États-Unis."
  
  USA_Comcast: "§0Comcast§!"
  USA_Comcast_desc: "Comcast est un conglomérat mondial de communications basé aux États-Unis ; via sa marque Xfinity, il détient la première place mondiale en chiffre d’affaires dans les télécommunications et la télévision par câble. Comcast est également le deuxième plus grand fournisseur de pay-TV aux États-Unis, le plus grand fournisseur d’accès internet par câble et le troisième plus grand fournisseur de téléphonie fixe. Comcast opère dans les 40 États et le district de Columbia. Son siège est à Philadelphie, en Pennsylvanie."
  
  USA_Oracle: "§0Oracle§!"
  USA_Oracle_desc: "Oracle Corporation est une entreprise mondiale de logiciels technologiques d’entreprise basée à Austin, au Texas, États-Unis. L’actuel président et directeur technique est le fondateur Lawrence Ellison ; le PDG est Kelvin Ketchum. Ses activités principales incluent la création de services de bases de données de gestion financière d’entreprise, tels que les systèmes d’intelligence commerciale en temps réel, la gestion de la chaîne d’approvisionnement et l’analyse des performances des ressources humaines."
  
  USA_AMD_idea: "§0AMD§!"
  USA_Adobe_idea: "§0Adobe§!"
  
  #Russia
  #Companies
  SOV_yukos: "§0Yukos§!"
  SOV_yukos_desc: "Yukos est la plus grande et la plus prospère entreprise de Russie, produisant 20 % de la production pétrolière russe."
  
  SOV_sibneft: "§0SibNeft§!"
  SOV_sibneft_desc: ""
  
  SOV_rusal: "§0RUSAL§!"
  SOV_rusal_desc: "Rusal est la troisième plus grande entreprise d’aluminium au monde et le troisième plus grand producteur d’aluminium et d’alumine, représentant respectivement 6 % de la production mondiale d’aluminium et d’alumine."
  
  SOV_sberbank: "§0Sberbank§!"
  SOV_sberbank_desc: "Sberbank est une institution financière basée à Moscou, capitale de la Fédération de Russie. Avec 25 millions de clients privés, 1,3 million de clients commerciaux et environ 19 000 agences, Sberbank est une banque leader dans les secteurs privé et commercial en Russie et la plus grande banque commerciale d’Europe de l’Est. Sberbank est une banque par actions ; la Banque centrale de la Fédération de Russie détient 60,25 % des parts, le reste étant détenu par plus de 273 000 investisseurs institutionnels et particuliers."
  
  SOV_vtb: "§0VTB§!"
  SOV_vtb_desc: "VTB Bank est une banque mondiale de premier plan en Russie."
  
  SOV_gazprom: "§0Gazprom§!"
  SOV_gazprom_desc: "Gazprom est l’une des plus grandes compagnies pétrolières de Russie."
  
  SOV_rosneft: "§0Rosneft§!"
  SOV_rosneft_desc: "Rosneftegaz est une compagnie énergétique russe intégrée basée à Moscou, spécialisée dans l’exploration, l’extraction, la production, le raffinage, le transport et l’expédition. L’entreprise est contrôlée par le gouvernement russe via la holding Rosneftegaz."
  
  SOV_nornickel: "§0Nornickel§!"
  SOV_nornickel_desc: "Norilsk Nickel est la plus grande entreprise minière et métallurgique de Russie, avec sa principale base de production à Norilsk près du fleuve Ienisseï. Elle possède également des mines de métaux non ferreux à Nikel, Zapoliarny et Montchegorsk sur la péninsule de Kola, à Haljavart en Finlande occidentale, en Afrique du Sud et au Botswana, et en Australie occidentale. C’est le plus grand producteur mondial de nickel et de palladium, et l’un des dix premiers producteurs de cuivre. Elle représente environ 18 % de la production mondiale de nickel, 2,5 % de cuivre, près de 50 % de palladium et environ 13 % de platine."
  
  SOV_lukoil: "§0LUKOIL§!"
  SOV_lukoil_desc: "Lukoil est une multinationale énergétique russe basée à Moscou, principalement responsable du raffinage du pétrole et du gaz et de la fabrication de produits pétroliers. Le 25 novembre 1991, trois compagnies énergétiques d’État situées en Sibérie occidentale — Langepas, Urai et Kogalym — fusionnèrent et changèrent de nom pour Lukoil, LUK représentant les initiales des trois sites. Lukoil est la deuxième plus grande entreprise de Russie après Gazprom et l’un des plus grands producteurs mondiaux de pétrole brut."
  
  #Poland
  #Companies
  POL_Orlen: "§0Orlen§!"
  POL_Orlen_desc: "Orlen, compagnie pétrolière publique polonaise, est un groupe énergétique intégré bien connu en Pologne. Elle fournit principalement des services d’exploration, d’extraction, de vente et de transport de pétrole et de gaz. Orlen jouit également d’une excellente réputation dans le forage offshore, la gestion et le développement de réservoirs, et les technologies d’amélioration du coke pétrolier de haute qualité. En aval, Orlen possède de nombreuses stations-service et des marques de lubrifiants connues dans le monde entier."
  
  #Japan
  #Companies
  JAP_suzuki_companies: "§0Suzuki§!"
  JAP_suzuki_companies_desc: "Suzuki est un constructeur automobile et de motos basé à Hamamatsu, préfecture de Shizuoka, au Japon."
  
  JAP_toyota_companies: "§0Toyota§!"
  JAP_toyota_companies_desc: "Toyota Motor Corporation est une multinationale automobile japonaise. Toyota est également la société mère des marques Lexus, Daihatsu, Hino et Century, et détient 20 % du capital de Subaru, dont elle est le principal actionnaire."
  
  #Spain
  #Companies
  SPR_Inditex_company: "§0Inditex§!"
  SPR_Inditex_company_desc: "Inditex Group est une grande entreprise espagnole et le deuxième plus grand groupe de mode au monde. Il possède plus de 100 sociétés, principalement actives dans la conception, la production et la vente de textiles."
  
  SPR_Telefonica_company: "§0Telefónica§!"
  SPR_Telefonica_company_desc: "Telefónica S.A. est une entreprise de télécommunications basée en Espagne. C’est le cinquième plus grand opérateur mondial de communications fixes et mobiles, fournissant principalement des services de communication fixe et mobile en Europe et en Amérique latine. Ses services incluent la voix mobile, les services à valeur ajoutée, les données mobiles et réseaux, le roaming, les services sans fil fixes, le trunking et la radiomessagerie. Elle se classe cinquième mondialement en nombre total de clients."
  
  SPR_Banco_Santander_company: "§0Banco Santander§!"
  SPR_Banco_Santander_company_desc: "Banco Santander fut fondé en 1857 et est basé à Santander, en Espagne. Banco Santander emploie près de 200 000 personnes."
  
  SPR_ACS_company: "§0ACS§!"
  SPR_ACS_company_desc: "ACS Group est une multinationale espagnole principalement active dans les activités liées à la construction, avec une certaine implication dans les télécommunications. Elle fut créée en 1997 par la fusion d’OCP Construcciones, S.A. et Ginés Navarro Construcciones, S.A. Son siège est à Madrid."
  
  SPR_Iberdrola_company: "§0Iberdrola§!"
  SPR_Iberdrola_company_desc: "Iberdrola est une multinationale électrique espagnole privée basée à Bilbao. Ses filiales incluent Scottish Power, Iberdrola USA et Elektro au Brésil."
  
  SPR_Repsol_company: "§0Repsol§!"
  SPR_Repsol_company_desc: "Repsol est une multinationale espagnole d’énergie et de pétrochimie basée à Madrid, avec ses principales opérations en Espagne et en Argentine."
  
  #South Korea
  #Companies
  KOR_KIA_company: "§0KIA Corporation§!"
  KOR_KIA_company_desc: "Kia Motors Corporation est le deuxième plus grand constructeur automobile de Corée du Sud, une entreprise du Fortune Global 500, basée à Séoul et membre du Hyundai Motor Group."
  
  KOR_LG_company: "§0LG§!"
  KOR_LG_company_desc: "LG Group est un grand conglomérat multinational basé à Séoul, en Corée du Sud. Ses activités principales couvrent l’électronique et les technologies de communication, les appareils électroménagers et la chimie. Il possède 81 sociétés du groupe, 130 filiales à l’étranger et emploie 213 000 personnes. LG Group fut fondé le 5 janvier 1947 sous le nom « Lucky Chemical Industrial Co., Ltd. » (aujourd’hui LG Chem). Le 1er octobre 1958, LG créa « Goldstar Co., Ltd. » (aujourd’hui LG Electronics), connu ensuite sous le nom « Lucky Group ». Le 1er janvier 1982, « Lucky Group » fut renommé « Lucky Goldstar Group » pour intégrer sa division électronique en expansion. En janvier 1995, LG Group adopta officiellement son nom actuel « LG ». Les lettres « LG » sont les initiales de « Lucky » et « Goldstar » dans le nom anglais « Lucky Goldstar Group ». LG Group est à l’origine de nombreux « premiers » dans l’histoire du développement des entreprises coréennes : première entreprise chimique industrielle de Corée « Lucky Chemical Industrial Co., Ltd. » et première marque de cosmétiques « Lucky Snow Cream » ; premier à entrer dans l’industrie plastique ; première entreprise électronique industrielle de Corée « Goldstar Co., Ltd. » ; production de la première radio, réfrigérateur, télévision, machine à laver et autres appareils électroménagers en Corée ; premier à recruter publiquement des diplômés universitaires exceptionnels ; premier parmi les chaebols coréens à instaurer la transparence d’entreprise ; premier à utiliser un nom anglais ; et premier à adopter un système de holding."
  
  KOR_Samsung_company: "§0Samsung§!"
  KOR_Samsung_company_desc: "Samsung Group est un conglomérat multinational basé à Séoul, en Corée du Sud, actif dans de nombreux secteurs : électronique, finance, assurance, biopharmacie, construction, chimie et santé. Ses filiales incluent Samsung Electronics, Samsung Display, Samsung Electro-Mechanics, Samsung C&T, Samsung Heavy Industries et Samsung Life Insurance, entre autres. Au moins trois d’entre elles figurent dans le Global 500 de Fortune."
  
  KOR_SK_company: "§0SK§!"
  KOR_SK_company_desc: "SK Group est le troisième plus grand conglomérat de Corée du Sud, basé à Séoul, avec 186 filiales et affiliées et plus de 110 000 employés dans le monde. Les activités principales de SK sont dans l’énergie et la pétrochimie ; sa filiale SK Energy est la plus grande entreprise intégrée d’énergie et de chimie de Corée du Sud. Sa raffinerie d’Ulsan traite 42 millions de tonnes de brut par an, conservant depuis de nombreuses années sa position de plus grande raffinerie à unité unique au monde. SK est également active dans l’électronique et les télécommunications ; sa filiale SK Telecom est le plus grand opérateur mobile de Corée du Sud, avec plus de 50 % de part de marché, et l’un des dix premiers opérateurs mobiles cellulaires mondiaux. Sa filiale SK Hynix est la principale force de SK dans l’industrie des semi-conducteurs, détenant la deuxième plus grande part de marché mondiale en DRAM, derrière Samsung Electronics seulement."
  
  KOR_Hyundai_company: "§0Hyundai Motor Group§!"
  KOR_Hyundai_company_desc: "Hyundai Motor Group, conglomérat sud-coréen, est l’un des plus grands constructeurs automobiles au monde, basé à Séoul. Comme de nombreux conglomérats sud-coréens, Hyundai Motor Group n’est pas une entreprise contrôlée verticalement par une holding. C’est plutôt un grand conglomérat avec une structure complexe d’actionnariat (comme des participations croisées) reliant ses diverses filiales. En pratique, Hyundai Motor est l’entreprise qui représente l’ensemble du groupe."
  
  KOR_Lotte_company: "§0Lotte Corporation§!"
  KOR_Lotte_company_desc: "Lotte Group est un grand conglomérat international basé à Séoul, en Corée du Sud. Ses activités couvrent l’alimentation, les grands magasins, le divertissement, la construction et la chimie. Il fait partie des 500 plus grands conglomérats mondiaux et des dix principaux chaebols de Corée du Sud. Fondé en 1948 par le fondateur sud-coréen Shin Kyuk-ho, Lotte Group commença comme fabricant alimentaire avant de s’étendre en Corée du Sud, où il possède des hôtels et des grands magasins. Lotte Group détient deux équipes professionnelles de baseball : les Lotte Giants dans la Korean Professional Baseball League (KBO) et les Chiba Lotte Marines dans la Japanese Professional Baseball League (NPB)."
  
  KOR_Doosan_company: "§0Doosan Corporation§!"
  KOR_Doosan_company_desc: "Doosan Group est un conglomérat sud-coréen basé à Séoul et une entreprise du Fortune Global 500. Son histoire remonte au 1er août 1896, quand son fondateur Park Seung-jik créa le « Park Seung-jik Store », ce qui en fait plus de 120 ans d’existence. C’est la seule entreprise moderne encore active depuis la fin de la dynastie Joseon et la première entreprise familiale coréenne à connaître trois générations de succession. En 1995, Doosan Group fut certifié par le Guinness World Records coréen comme la plus ancienne entreprise de Corée du Sud."
  
  KOR_Hanjin_company: "§0Hanjin Transportation§!"
  KOR_Hanjin_company_desc: "Hanjin Group est un conglomérat international de logistique et de transport basé à Séoul. Fondé en 1945, il fut autrefois l’une des plus grandes entreprises de logistique maritime de Corée du Sud et une entreprise du Fortune Global 500. Hanjin possédait autrefois une flotte de conteneurs couvrant les principaux ports mondiaux. Après la faillite de son activité maritime, il conserve des routes aériennes et un réseau logistique. Hanjin Shipping, filiale de Hanjin Group, fut autrefois le septième plus grand groupe maritime mondial. Korean Air, acquise en 1969, est la plus grande compagnie aérienne de Corée du Sud."
  
  KOR_posco_company: "§0Posco§!"
  KOR_posco_company_desc: "POSCO est l’un des plus grands fabricants d’acier au monde et une entreprise du Fortune Global 500, basée à Nam-gu, Pohang, province de Gyeongsang du Nord, en Corée du Sud."
  
  #Italy
  #Companies
  ITA_Enel_company: "§0Enel§!"
  ITA_Enel_company_desc: "Enel, la compagnie électrique publique italienne, est une entreprise énergétique basée à Rome, principalement active dans la production, le transport d’électricité et la distribution de gaz naturel. À l’origine institution publique créée en 1962, elle fut restructurée en société en 1992 et privatisée en 1999 avec l’ouverture du marché italien de l’électricité. Cependant, le ministère italien de l’Économie et des Finances reste son principal actionnaire."
  
  ITA_Intesa_Sanpaolo_company: "§0Intesa Sanpaolo§!"
  ITA_Intesa_Sanpaolo_company_desc: "Intesa Sanpaolo est un nouveau groupe bancaire créé le 2 janvier 2007 par la fusion d’Intesa Commerzbank et Banco Sanpaolo. Le groupe est basé à Turin, avec un siège secondaire à Milan. En août 2006, Intesa Commerzbank et Banco Sanpaolo annoncèrent conjointement la fusion, effective en décembre de la même année. Le nouveau groupe Intesa Sanpaolo est la deuxième plus grande banque d’Italie et la troisième de la zone euro, avec 68,8 milliards d’euros d’actifs."
  
  ITA_Eni_company: "§0Eni§!"
  ITA_Eni_company_desc: "Eni, officiellement Ente Nazionale Idrocarburi, est une holding publique créée par le gouvernement italien. Spécialisée dans les produits pétroliers, c’est l’un des sept plus grands groupes pétroliers mondiaux et le huitième plus grand raffineur au monde."
  
  ITA_UniCredit_company: "§0UniCredit§!"
  ITA_UniCredit_company_desc: "UniCredit est une banque basée à Milan, opérant dans 19 pays et servant plus de 28 millions de clients, ce qui en fait l’un des plus grands groupes bancaires d’Europe. L’activité principale d’UniCredit se concentre dans les régions prospères comme l’Italie, l’Autriche et le sud de l’Allemagne, avec des opérations importantes en Europe centrale et orientale. Avec 910 milliards d’euros d’actifs totaux, UniCredit est le plus grand groupe bancaire de la zone euro, le troisième d’Europe et le sixième mondial. Le groupe UniCredit possède des activités substantielles de banque d’investissement à Francfort et Munich."
  
  HUN_mol_group: "§0MOL Group§!"
  HUN_mol_group_desc: "MOL Plc. est une multinationale hongroise du pétrole et du gaz basée à Budapest, en Hongrie. Parmi les membres du groupe MOL figurent notamment les anciennes compagnies pétrolières et gazières publiques croate et slovaque, INA et Slovnaft."

 POR_edp_company: "§0EDP§!"
 POR_edp_company_desc: "EDP est une entreprise portugaise de services publics d'électricité, dont le siège social est à Lisbonne, fondée en 1976 par la fusion de 14 entreprises d'électricité nationalisées."

 POR_jm_company: "§0Jerónimo Martins§!"
 POR_jm_company_desc: "Jerónimo Martins SGPS, SA (JM) est un groupe portugais spécialisé dans la distribution alimentaire et le commerce de détail spécialisé. Il exploite plus de 6500 magasins au Portugal, en Pologne, en Slovaquie et en Colombie."