 ARG_bloated_social_welfare_desc:0 "The idea of a welfare state became a symbol of Argentina after Juan Domingo Peron came to power, as he began creating a range of social assistance programs to lift thousands of families out of poverty. At first, these programs worked successfully, but over time they became increasingly bloated, providing little benefit to the state. When crises emerged, Argentina had to print large amounts of money and take reckless loans to fund welfare programs. Many families became dependent on these benefits and struggled to survive without them, which made discussions of reform or adjustment politically sensitive, as (Argentina cannot abandon its people.) Unfortunately, both Kirchnerists and Radicals continue to support this expansive system, which shows no signs of slowing down, further destabilizing the economy. Soon, the welfare machine may become impossible to control, and economic problems will affect everyone, not just those relying on aid."
 BRA_not_world_power_idea_desc:0 "\n\n\n\n\n£GFX_BRA_power_of_the_future\n\n\n\n\n\nFollowing the Workers' Party first electoral victory in 2002, then President Luiz Inácio Lula da Silva oversaw astounding economic growth sustained mainly due to the Commodity Boom of the 2000's, which stimulated the strong agribusiness of the country, even managing to avoid the most catastrophic effects of the 2008 crash. With such luck, cunning governance and a bit of backroom negotiations, Lula sucessfully reformed many welfare programs, passed much needed social reforms and fought crippling hunger in the country, leading to visible improvements to the living conditions of many Brazilians by the time of the 2010's, with Lula himself leaving office as one of the highest-approved Heads of State at the time.\n\nThe period of grace, however, would not last. After electing his sucessor, President Dilma Rousseff would strive to maintain the reforms of her predecessor, but lacking the silver togue of Lula and with the end of the Boom, Dilma would find herself between a rock and a hard place as the Centrão increasingly leverages its muscles to wrangle the government. After narrowly winning reelection in 2014, with the Workers' Party popularity in downfall after the disastrous results of the FIFA World Cup of 2014 and a looming fiscal crisis, Dilma begins a program of fiscal austerity combined with devaluation of the Real in a desperate attempt to foster internal industrialization and stimulate the internal market.\n\nHer plan would backfire spectacularly, sending Brazil into stagflation and then a huge recession during the years of 2015 and 2016. This, combined with growing scandals of corruption of Her's and Lula's past governments unveiled by Operation Car Wash, would spell doom for her, as she would be ultimately impeached in August of 2016. Her sucessor, Vice-President Michel Temer, would assume the Presidency and continue with unpopular budget cuts into education, healthcare and other social spenditures to control the crisis' damage to the government's finances.\n\nBy 2020, the general sentiment is that of a lost decade, as Brazilians have mostly lost trust in the State's institutions and capability to conduct the country towards the future, laying the dream of §Y\"Power of the Future\"§! forever in the longed past."
 CUB_idea_blockade1:0 "The Blockade (El Bloqueo) Against Cuba"
 CUB_idea_blockade1_desc:0 "In 1962, the United States imposed an embargo on Cuba which was never lifted. The effects became particularly devastating once the USSR collapsed in the early 1990s, leaving Cuba with few trading partners."
 CUB_idea_migration_crisis:0 "Illegal Migration"
 CUB_idea_migration_crisis_desc:0 "Illegal Emigration has become a big problem for our country. Every day hundreds of professionals leave our country illegally in search of a better life. You can remove this national spirit by doing the \"Fight with Illegal Migration\" focus."
 CUB_land_of_freedom_idea:0 "Island of Freedom"
 VEN_bolivarian_revolution_desc:0 "The Bolivarian Revolution concentrates political initiative in the state, raising political power, stability, war support and party loyalty."
 BRA_systemic_corruption_idea_desc:0 "Systemic corruption pervades the state: political power and productivity fall while foreign influence and the cost of investment rise."
 BRA_mass_homicide_idea_desc:0 "Mass homicide eats into the population and steadily erodes stability and social trust."
 BRA_agricultural_society_idea_desc:0 "Brazil's economy remains bound to an agricultural society: consumer goods absorb resources, factories run well below capacity, yet resource extraction still yields gains."
 CEN_banana_republic_desc:0 "A banana republic: the economy serves foreign interests, industrial and social development stall, while the political elite gains room to manoeuvre."
 CEN_banana_republic_red_desc:0 "A red banana republic: foreign-aligned elites dominate the state, development stalls, and communist influence is tolerated."
