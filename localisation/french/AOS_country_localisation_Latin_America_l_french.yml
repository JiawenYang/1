l_french:
 ARG_alberto_super_powers_idea_desc:0 "Special powers granted to the president concentrate decision-making and shore up the governing coalition."
 ARG_aspo_idea_desc:0 "ASPO - Alberto te cuida - locks down the country to protect public health, preserving lives at the cost of business activity and fiscal strain."
 ARG_atp_idea_desc:0 "The ATP programme transfers income to the poorest households, easing hardship but widening the fiscal gap."
 ARG_blue_condor_operation_idea_0_desc:0 "Plan Blue Condor revives the tradition of military cooperation across the Southern Cone, restoring contacts and joint planning."
 ARG_brazilian_migration_crisis_idea_0_desc:0 "A wave of Brazilian migrants strains services and politics, feeding instability and reducing support for the government."
 ARG_cancel_culture_idea_desc:0 "A combative cultural climate raises social mobilization and shifts the balance between conservative and liberal currents."
 ARG_cepo_blindado_idea_desc:0 "Armor CEPO hardens exchange controls, slowing capital flight but consuming political capital."
 ARG_coronavirus_pandemic_idea_desc:0 "A moderate pandemic wave disrupts business, industry and the labor market while draining political power."
 ARG_dolar_productivo_1_idea_desc:0 "The productive dollar scheme offers preferential terms to exporters and farmers, boosting activity but straining public accounts."
 ARG_el_incaa_1_idea_desc:0 "The National Institute of Cinema and Audiovisual Arts funds domestic production and projects a cultural image abroad, reinforcing an interventionist cultural policy."
 ARG_front_labeling_law_idea_0_desc:0 "Front-of-package labeling improves public health and consumer awareness while drawing industry resistance."
 ARG_futbol_para_todos_1_idea_desc:0 "Football for everyone funds clubs and community sport, building political support and social inclusion."
 ARG_guzman_medidas_1_desc:0 "Guzman's package uses price controls, tax adjustments and industrial incentives to attack inflation while keeping production afloat."
 ARG_ife_idea_desc:0 "The IFE redistributes social spending toward the poorest, raising political support at the cost of a heavier fiscal burden."
 ARG_inadi_1_idea_desc:0 "The anti-discrimination institute expands public campaigns and social mobilization, raising political support."
 ARG_kulfas_financing_the_plan_idea_0_desc:0 "Financing the Kulfas plan through taxes and private capital keeps investment flowing while inflation falls."
 ARG_lamento_boliviano_arg_idea_0_desc:0 "A reversal of the Bolivian lament: fiscal pressure eases and household burdens lighten as spending comes under control."
 ARG_lamento_boliviano_bol_idea_0_desc:0 "A lament for the Bolivian course: fiscal pressure rises and public spending grows harder to control, stirring personal hardship."
 ARG_medidas_guzman_inflation_idea_0_desc:0 "Guzman's anti-inflation package combines interest rates, price agreements and selective spending to slow price growth."
 ARG_medidas_populistas_idea_0_desc:0 "Populist measures raise incomes and industrial activity in the short run, but push inflation, poverty and the fiscal bill upward."
 ARG_post_pandemic_economic_recovery_idea_desc:0 "Reopened activity and normalized supply chains pull inflation down and revive business confidence, easing the fiscal burden of the pandemic years."
 ARG_post_usa_colapse_financial_chaos_idea_0_desc:0 "A financial shock following a collapse of the US order pushes consumer costs and business risk upward and drags down living standards."
 ARG_rebuilding_the_military_industry_idea_0_desc:0 "State contracts and reopened production lines put the domestic defense industry back on its feet after years of neglect."
 ARG_the_kulfas_plan_idea_0_desc:0 "The Kulfas plan combines public investment with income support, stimulating construction and consumption while inflation is slowly brought down."
 ARG_the_macrist_nostalgia_idea_desc:0 "Nostalgia for the Macri years revives liberal and conservative currents while weakening the ruling left."
 ARG_the_new_present_state:0 "The New Present State"
 ARG_the_new_present_state_desc:0 "The new present state expands public spending and industrial capacity, though the fiscal and social costs are high."
 ARG_the_nielsen_plan_idea_0_desc:0 "The Nielsen plan subsidizes services and offices, sustaining employment while inflation is slowly reduced."
 ARG_the_political_decline_of_peronism_idea_0_desc:0 "Peronism loses its grip on the electorate as its coalition fragments and rival currents gain ground."
 ARG_the_super_minister_massa_idea_0_desc:0 "A single figure concentrates economic portfolios, giving the government a unified command over prices, spending and negotiations."
 ARG_trade_pact_of_mercosur_idea_0_desc:0 "The Mercosur trade pact deepens regional integration, boosting investment, trade confidence and fiscal revenue."
 ARG_training_of_new_cadets_idea_0_desc:0 "Expanded cadet intakes and refreshed curricula rebuild the officer corps, giving the armed forces a deeper pool of trained leaders."
 ARG_tratado_arg_bra_comercial_desc:0 "The Argentine-Brazilian trade agreement deepens integration between the two largest economies of the Southern Cone, strengthening the government's standing."
 ARG_ypf_without_deficit_idea_0_desc:0 "Fiscal discipline at the state oil company turns losses into revenue, easing the treasury's burden."
 BOL_contested_transitional_government:0 "Contested Transitional Government"
 BOL_contested_transitional_government_desc:0 "Successive political and electoral crises have left Bolivia deeply divided over the legitimacy of its national authorities. For some, transitional governments represented a constitutional response to dangerous power vacuums; for others, they marked a rupture of the country's democratic order. Competing interpretations of recent political events continue to shape public opinion and fuel mutual distrust between opposing political camps. This division has made institutional consolidation increasingly difficult and has fostered an atmosphere of permanent political confrontation. Governance often depends on fragile agreements, while the risk of renewed protests, institutional paralysis, or political violence remains ever present. The absence of broad national consensus continues to limit the state's ability to address long-term economic and social challenges."
 BOL_cruceno_productive_model:0 "Cruceño Productive Model"
 BOL_cruceno_productive_model_desc:0 "Santa Cruz has established itself as Bolivia's leading agro-industrial center and one of the country's principal economic engines. Its success is built upon commercial agriculture, private investment, export-oriented production, industrial development, and a strong regional identity that emphasizes entrepreneurship and economic competitiveness.\n\nThis economic dynamism has also generated recurring tensions with the central government. Disputes over export regulations, taxation, resource distribution, land policy, and regional autonomy continue to shape one of Bolivia's most significant political and economic fault lines. The relationship between Santa Cruz and La Paz remains central to understanding Bolivia's contemporary political landscape."
 BOL_discredited_security_forces:0 "Discredited Security Forces"
 BOL_discredited_security_forces_desc:0 "Bolivia's Armed Forces and National Police have suffered a significant decline in public credibility following episodes of political violence, internal unrest, allegations of excessive force, and accusations of partisan behavior. Their role during successive national crises has fueled ongoing debate over their constitutional responsibilities and political neutrality. Public trust remains limited, and every new political confrontation raises fresh questions about whether the security forces will act impartially or become involved in political disputes. This uncertainty weakens confidence in democratic institutions, complicates crisis management, and contributes to an environment where institutional legitimacy remains fragile."
 BOL_exhaustion_of_the_gas_model:0 "Exhaustion of the Gas Model"
 BOL_exhaustion_of_the_gas_model_desc:0 "For years, natural gas revenues fueled Bolivia's economic expansion and financed extensive social welfare programs. However, declining reserves, insufficient exploration, and falling production have steadily reduced the country's economic room for maneuver. The shortage of foreign currency has increased pressure on international reserves and public finances. As a result, Bolivia faces the growing challenge of diversifying its economy and identifying new engines of long-term growth."
 BOL_the_chapare_factor:0 "The Chapare Autodefensas Factor"
 BOL_the_chapare_factor_desc:0 "For years, natural gas revenues fueled Bolivia's economic expansion and financed extensive social welfare programs, public investment, and generous fuel subsidies. However, declining reserves, insufficient exploration, aging infrastructure, and falling production have steadily reduced the country's economic room for maneuver and export capacity.\n\nThe shortage of foreign currency has increased pressure on international reserves, public finances, and the exchange rate system. As energy exports lose momentum, Bolivia faces the growing challenge of diversifying its economy, attracting new investment, and identifying sustainable engines of long-term growth before fiscal pressures become significantly more severe."
 BRA_2022_election_protests_idea_desc:0 "Contested election results trigger nationwide protests, paralyzing the government and deepening polarization."
 BRA_abilio_santana_eco:0 "Abílio Santana"
 BRA_abilio_santana_eco_desc:0 "Abílio Santana manages regional development and tourism portfolios with a business-friendly approach."
 BRA_agro_death_idea_desc:0 "The agro collapse wrecks rural production and exports, raising consumer costs and draining both industry and the budget."
 BRA_alexandre_ramagen_int:0 "Alexandre Ramagem"
 BRA_alexandre_ramagen_int_desc:0 "Alexandre Ramagem, a former intelligence official, brings surveillance expertise and loyalty to the government's security apparatus."
 BRA_anderson_torres_prewar_int:0 "Anderson Torres"
 BRA_anderson_torres_prewar_int_desc:0 "Anderson Torres, a security official, is associated with the political leadership's control over law enforcement."
 BRA_andre_mendonca_prewar_int:0 "André Mendonça"
 BRA_andre_mendonca_prewar_int_desc:0 "A jurist and evangelical conservative, André Mendonça embodies a legal order anchored in religious values and a hard line against crime and corruption."
 BRA_army_of_patriots_dynamic_desc:0 "The Army of Patriots is a mobilized base of loyal activists and reservists, ready to defend the government's line in the streets."
 BRA_arthur_lira_sec:0 "Arthur Lira"
 BRA_arthur_lira_sec_desc:0 "Arthur Lira controls the legislative agenda as speaker, making him indispensable to the government's economic program."
 BRA_augusto_heleno_for:0 "Augusto Heleno"
 BRA_augusto_heleno_for_desc:0 "Augusto Heleno, a retired general, represents a sovereignist and security-first foreign policy line."
 BRA_augusto_heleno_hog:0 "Augusto Heleno"
 BRA_augusto_heleno_hog_desc:0 "Augusto Heleno, a retired general and longtime security adviser, brings military discipline and a sovereignist outlook to the head of government's office."
 BRA_bento_albuquerque_eco:0 "Bento Albuquerque"
 BRA_bento_albuquerque_eco_desc:0 "Bento Albuquerque, an energy specialist, steers the country's power and fuel agenda through infrastructure planning."
 BRA_bento_lima_sec:0 "Bento Costa Lima Leite"
 BRA_bento_lima_sec_desc:0 "Bento Costa Lima Leite manages mines and energy, steering the country's resource and power strategy."
 BRA_braga_netto_prewar_theorist:0 "Braga Netto"
 BRA_braga_netto_prewar_theorist_desc:0 "Braga Netto's prewar writings focus on mobilization, logistics and territorial defense doctrine."
 BRA_braga_netto_theorist:0 "Braga Netto"
 BRA_braga_netto_theorist_desc:0 "Braga Netto writes on logistics and territorial defense, anchoring the army's strategic thinking."
 BRA_brazilian_ambition_idea_desc:0 "A national project of continental scale: Brazil claims a leading role in South America and beyond, though the effort strains stability at home."
 BRA_carlos_bolsonaro_int:0 "Carlos Bolsonaro"
 BRA_carlos_bolsonaro_int_desc:0 "Carlos Bolsonaro, a legislator and son of the former president, carries the family's political brand into intelligence and party intrigue."
 BRA_carlos_franca_prewar_for:0 "Carlos França"
 BRA_carlos_franca_prewar_for_desc:0 "Carlos França, a career diplomat and former foreign minister, brings continuity and professional networks to the government's external agenda."
 BRA_ciro_nogueira_eco:0 "Ciro Nogueira"
 BRA_ciro_nogueira_eco_desc:0 "Ciro Nogueira, a veteran political operator, manages congressional coalitions and the government's economic agenda in the legislature."
 BRA_coronavirus_pandemic_idea_desc:0 "A crippling pandemic wave shuts down production and trade, drives consumer costs up and hollows out stability."
 BRA_coronavirus_pandemic_idea1_desc:0 "A severe pandemic wave pushes hospitals to the limit and sharply reduces industrial and consumer activity."
 BRA_coronavirus_pandemic_idea2_desc:0 "A moderate COVID-19 wave raises costs and lowers factory efficiency, though the health system still holds."
 BRA_coronavirus_pandemic_idea3_desc:0 "A substantial COVID-19 wave overwhelms hospitals and supply chains, driving up consumer costs and cutting industrial efficiency while the population suffers."
 BRA_coronavirus_pandemic_idea4_desc:0 "A minor COVID-19 wave still raises consumer costs and slows production, though the overall burden stays manageable."
 BRA_covid_martial_law_idea_desc:0 "Emergency powers imposed to enforce pandemic restrictions erode political capital and stir resentment, even as they slow the outbreak."
 BRA_crisis_management_cabinet_desc:0 "An institutional crisis cabinet centralizes emergency coordination, though it slows routine command decisions."
 BRA_cristiano_quintas_theorist:0 "Cristiano Augusto Quintas"
 BRA_cristiano_quintas_theorist_desc:0 "Cristiano Augusto Quintas writes on defense and strategy, feeding the officer corps a conservative strategic vocabulary."
 BRA_damares_alves_sec:0 "Damares Alves"
 BRA_damares_alves_sec_desc:0 "Damares Alves leads the human rights portfolio with a conservative religious framing."
 BRA_depleted_military_idea_desc:0 "Years of neglect leave the armed forces depleted: poor organization, morale and offensive capability."
 BRA_divine_fervor_idea_desc:0 "Religious fervor sustains war support and suppresses dissent, at the cost of social cohesion and resistance."
 BRA_ease_of_business_policy_idea_desc:0 "Deregulation lowers the cost of doing business and trims consumer costs, supporting investment."
 BRA_edir_macedo_int:0 "Edir Macedo"
 BRA_edir_macedo_int_desc:0 "Edir Macedo, founder of a major church, mobilizes believers and media influence on behalf of the government's agenda."
 BRA_eduardo_bolsonaro_for:0 "Eduardo Bolsonaro"
 BRA_eduardo_bolsonaro_for_desc:0 "Eduardo Bolsonaro, a legislator and international spokesperson for the family's movement, projects the government's ideological line abroad."
 BRA_eduardo_pazuello_sec:0 "Eduardo Pazuello"
 BRA_eduardo_pazuello_sec_desc:0 "Eduardo Pazuello, a logistics-minded officer, is associated with crisis management and improvised emergency procurement."
 BRA_empowered_junta_idea_desc:0 "A military junta concentrates command authority, expanding command power and curbing resistance, at the cost of political stability."
 BRA_empowered_president_idea_desc:0 "Concentrating agenda-setting and emergency powers in the presidency allows the government to act decisively, at the cost of straining the institutional balance."
 BRA_ernesto_araujo_for:0 "Ernesto Araújo"
 BRA_ernesto_araujo_for_desc:0 "Ernesto Araújo, a career diplomat with a sovereigntist outlook, steers foreign policy toward bilateral deals and ideological affinity."
 BRA_ernesto_araujo_prewar_for:0 "Ernesto Araújo"
 BRA_ernesto_araujo_prewar_for_desc:0 "Ernesto Araújo is a career diplomat and writer whose tenure at the Foreign Ministry is remembered for a sovereigntist, conservative course: alignment with like-minded governments and a foreign policy framed around national identity rather than multilateral institutions."
 BRA_expanded_petrobras_share_desc:0 "Partial nationalization of Petrobras expands state control over fuel, raising energy security at a fiscal cost."
 BRA_felipe_davila_hog:0 "Felipe d'Avila"
 BRA_felipe_davila_hog_desc:0 "Felipe d'Avila, a market-oriented economist, is associated with privatization and fiscal reform."
 BRA_fernando_azevedo_prewar_theorist:0 "Fernando Azevedo"
 BRA_fernando_azevedo_prewar_theorist_desc:0 "Fernando Azevedo writes on strategy and sovereignty at the National Defense School, shaping doctrine for the officer corps."
 BRA_flavio_bolsonaro_hog:0 "Flávio Bolsonaro"
 BRA_flavio_bolsonaro_hog_desc:0 "Flávio Bolsonaro, a senator and the family's political heir, combines legislative influence with a combative public profile."
 BRA_free_the_infrastructure_idea_desc:0 "Deregulation and investment in roads, rail and utilities unclog the economy and lower consumer costs."
 BRA_fuel_deals_paraguay_idea_desc:0 "Fuel deals with Paraguay secure cheap supply, supporting business and easing consumer costs."
 BRA_gilson_neto_eco:0 "Gilson Machado Neto"
 BRA_gilson_neto_eco_desc:0 "Gilson Machado Neto combines tourism promotion with a nationalist economic line, presenting Brazil's natural and cultural assets as instruments of state policy."
 BRA_granary_of_the_world_idea_desc:0 "Brazil's agribusiness is promoted as a global food supplier, drawing investment into farming and export logistics."
 BRA_hamilton_mourao_prewar_hog:0 "Hamilton Mourão"
 BRA_hamilton_mourao_prewar_hog_desc:0 "Hamilton Mourão, a retired general and vice president, champions a sovereignist and security-first agenda."
 BRA_hamilton_mourao_theorist:0 "Hamilton Mourão"
 BRA_hamilton_mourao_theorist_desc:0 "Hamilton Mourão's writings emphasize order, sovereignty and the military's role in national life."
 BRA_harmony_of_powers_idea_desc:0 "An arrangement between the branches of government lowers ministerial costs and stabilizes the political system."
 BRA_indefinite_state_of_siege_idea_desc:0 "An indefinite state of siege buys order at the price of civil liberties, fiscal strain and social development."
 BRA_joaquim_luna_eco:0 "Joaquim Silva e Luna"
 BRA_joaquim_luna_eco_desc:0 "Joaquim Silva e Luna, a retired general, runs Petrobras with a focus on fuel prices and national supply."
 BRA_legacy_of_bolsonarism_idea_desc:0 "The Bolsonarist legacy keeps a loyal base and a combative foreign policy, at the cost of higher ministerial turnover."
 BRA_luciano_bivar_eco:0 "Luciano Bivar"
 BRA_luciano_bivar_eco_desc:0 "Luciano Bivar, a business-sector politician, channels private capital into the government's economic agenda."
 BRA_luiz_philippe_for:0 "Luiz Philippe de Orleans e Bragança"
 BRA_luiz_philippe_for_desc:0 "Luiz Philippe de Orleans e Bragança is a descendant of the imperial house turned parliamentarian, lending dynastic legitimacy to the liberal-conservative camp."
 BRA_magno_malta_for:0 "Magno Malta"
 BRA_magno_malta_for_desc:0 "Magno Malta, an evangelical senator, carries the government's conservative moral agenda into foreign and social policy."
 BRA_marco_feliciano_sec:0 "Marco Feliciano"
 BRA_marco_feliciano_sec_desc:0 "Marco Feliciano, an evangelical legislator, presses a conservative moral agenda into national policy."
 BRA_nationalist_economy_dynamic_desc:0 "A nationalist economic policy redirects capital toward domestic industry and away from foreign partners."
 BRA_nestor_forster_for:0 "Nestor Forster"
 BRA_nestor_forster_for_desc:0 "Nestor Forster, a retired officer close to the conservative camp, adds military credibility to the government's foreign policy team."
 BRA_oil_crisis_idea_desc:0 "An oil crisis squeezes consumers and industry as fuel and resource access decline, dragging production down."
 BRA_onyx_lorenzoni_sec:0 "Onyx Lorenzoni"
 BRA_onyx_lorenzoni_sec_desc:0 "Onyx Lorenzoni manages citizenship and social policy with a deregulatory, market-friendly outlook."
 BRA_paulo_guedes_eco:0 "Paulo Guedes"
 BRA_paulo_guedes_eco_desc:0 "Paulo Guedes runs the economy ministry, pressing privatization, pension reform and fiscal restraint."
 BRA_paulo_guedes_prewar_eco:0 "Paulo Guedes"
 BRA_paulo_guedes_prewar_eco_desc:0 "Paulo Guedes is the market-liberal economist behind the austerity and privatization agenda, arguing that fiscal discipline is the only route to growth."
 BRA_rampant_mongrel_complex_idea_desc:0 "A severe inferiority complex grips the nation's self-image, eroding war support, political will and confidence in the country's future."
 BRA_reformed_agro_idea_desc:0 "A reformed agricultural model raises productivity while limiting encroachment on the Amazon."
 BRA_regional_cooperation_paraguay_idea_desc:0 "Regional cooperation with Paraguay opens energy and infrastructure channels, cutting trade and consumer costs."
 BRA_religious_governance_idea_desc:0 "Religious institutions take on public functions, reinforcing social discipline and the government's moral authority."
 BRA_ricardo_salles_sec:0 "Ricardo Salles"
 BRA_ricardo_salles_sec_desc:0 "Ricardo Salles, an environment minister aligned with agribusiness, prioritizes development over conservation and is a lightning rod for controversy."
 BRA_rising_industrial_class_idea_desc:0 "A rising industrial class demands influence in exchange for investment, raising the price of political decisions."
 BRA_roberto_alvim_int:0 "Roberto Alvim"
 BRA_roberto_alvim_int_desc:0 "Roberto Alvim manages intelligence and institutional security with a culture of loyalty and secrecy."
 BRA_roberto_neto_eco:0 "Roberto Campos Neto"
 BRA_roberto_neto_eco_desc:0 "Roberto Campos Neto runs the central bank, defending inflation targets and market credibility."
 BRA_rogerio_marinho_sec:0 "Rogério Marinho"
 BRA_rogerio_marinho_sec_desc:0 "Rogério Marinho manages labor and welfare reform, pushing deregulation through the legislature."
 BRA_sandra_regina_sec:0 "Sandra Regina Bulcão"
 BRA_sandra_regina_sec_desc:0 "Sandra Regina Bulcão heads the women, family and human rights portfolio, giving the government a conservative social agenda."
 BRA_sergio_moro_prewar_int:0 "Sérgio Moro"
 BRA_sergio_moro_prewar_int_desc:0 "Sérgio Moro, a former judge, is associated with anti-corruption enforcement and a hard line on organized crime."
 BRA_sergio_nogueira_prewar_theorist:0 "Paulo Sérgio Nogueira"
 BRA_sergio_nogueira_prewar_theorist_desc:0 "Paulo Sérgio Nogueira writes on army doctrine and modernization, shaping the service's professional outlook."
 BRA_sergio_nogueira_theorist:0 "Paulo Sérgio Nogueira"
 BRA_sergio_nogueira_theorist_desc:0 "Paulo Sérgio Nogueira's doctrine writings emphasize readiness, modernization and territorial control."
 BRA_silas_malafaia_hog:0 "Silas Malafaia"
 BRA_silas_malafaia_hog_desc:0 "Silas Malafaia, a prominent televangelist, mobilizes conservative believers for the government's moral agenda."
 BRA_silvinei_vasques_theorist:0 "Silvinei Vasques"
 BRA_silvinei_vasques_theorist_desc:0 "Silvinei Vasques writes on federal police doctrine and institutional loyalty to the political leadership."
 BRA_SISBIN_paralelo_dynamic_desc:0 "A parallel intelligence service operating outside formal oversight serves the political leadership directly, bypassing institutional checks."
 BRA_subsidized_agro_idea_desc:0 "Subsidies expand agricultural output and industrial capacity, but at a cost to the Amazon and the budget."
 BRA_tarcisio_freitas_sec:0 "Tarcísio Freitas"
 BRA_tarcisio_freitas_sec_desc:0 "Tarcísio Freitas, an infrastructure engineer turned minister, is associated with large public works and a law-and-order political profile."
 BRA_tereza_cristina_prewar_sec:0 "Tereza Cristina"
 BRA_tereza_cristina_prewar_sec_desc:0 "Tereza Cristina, an agribusiness champion, presses for export-oriented farming and rural deregulation."
 BRA_uira_ferreira_theorist:0 "Uirá Nascimento Ferreira"
 BRA_uira_ferreira_theorist_desc:0 "Uirá Nascimento Ferreira writes on asymmetric threats and internal security, shaping the army's counterinsurgency thinking."
 BRA_uncontrolled_society_idea_desc:0 "State authority retreats from everyday life: stability, investment and household confidence all decline together."
 CEN_cartel_presence_minor_desc:0 "Minor cartel presence: small extortion networks slightly slow business but leave the state in control."
 CEN_cartel_presence_moderate_desc:0 "Cartels exert moderate influence over the region: extortion and bribes slow business and erode public revenue."
 CEN_cartel_presence_severe_desc:0 "Severe cartel presence: extortion and intelligence penetration cripple revenue, industry and public security."
 CHL_estallido_social_idea_desc:0 "The social outburst paralyzes the economy and drains the government's authority, while pushing voters toward the left."
 CHL_mining_economy:0 "Mining Economy"
 CHL_mining_economy_desc:0 "Every tenth peso circulating in Chile comes from a single industry: mining. As the world's leading producer of copper, responsible for roughly 30% of global output, and one of the major producers of lithium, Chile has built a significant share of its GDP around the extraction of mineral resources. Mining has become one of the pillars of the national economy and a cornerstone of Chilean exports, driven by giants such as Codelco and BHP.\n\nYet Chile now finds itself in a difficult position. Export logistics through its ports have been repeatedly disrupted, a severe drought has persisted for nearly a decade, and the metal content of its ore continues to decline. Faced with these challenges, Chile may eventually be forced to rethink the foundations of its economic model and search for a new engine of growth beyond the mines that have sustained it for generations."
 CHL_pinochet_legacy_idea_desc:0 "The Pinochet legacy remains a live political wound, feeding authoritarian currents and draining legitimacy."
 CHL_terrorist_attacks_in_patagonia:0 "Terrorist Attacks in Patagonia"
 CHL_terrorist_attacks_in_patagonia_desc:0 "Back in the 1970s, when Pinochet signed Decree 701 and subsidized private forestry companies, few could have imagined the conflict that would follow. On December 1, 1997, Mapuche activists sabotaged forestry trucks in Lumaco, an event many regard as the beginning of the Mapuche - Chilean conflict. Now entering its third decade, the Chilean state has failed to eliminate the Mapuche challenge, while popular resentment has only continued to grow. Mapuche groups continue to destroy equipment, set fires, and at times engage in armed confrontations. At the same time, amid broader social unrest, more and more Chileans are calling for constitutional recognition of indigenous autonomy, even as parts of the countryside burn under the weight of attacks linked to the conflict. It has become a war of attrition, and until one side finally exhausts its will to continue, the struggle will go on."
 CHL_the_legacy_of_pinochets_constitution:0 "The Legacy of Pinochet's Constitution - §RIn its dusk...§!"
 CHL_the_legacy_of_pinochets_constitution_desc:0 "Four decades have passed since 1980, and the Constitution was even reformed in 2005, yet its most important foundations remain the same. Article 1 established the principle of subsidiarity, effectively enshrining neoliberalism and the privatization of even such basic rights as pensions, healthcare, education, and even water, which was fully privatized under the 1981 Water Code. Another purpose of the Constitution was to protect the status quo, requiring an absolute majority to amend organic constitutional laws. The Constitutional Tribunal also remained in place, capable of blocking reforms designed to protect consumer rights, weaken labor reform, and preserve the commercialization of universities during the second term of Socialist Michelle Bachelet.\n\nBut the constitutional legacy is deeply unpopular, and recent social outburst have led both the left and the center to demand the repeal of the 1980 Constitution. Clearly, Pinochet's legacy does not have much longer to live."
 CHL_the_most_efficient_army_in_south_america:0 "The Most Efficient Army in South America"
 CHL_the_most_efficient_army_in_south_america_desc:0 "The Chilean Army can rightfully be called the most effective military force in South America, due in no small part to the fact that 10% of copper export revenues are allocated to the armed forces. Founded in 1810, the Chilean Army has fought in wars against Peru and the Bolivian Confederation, the War of the Pacific, and even came close to war with Argentina in the second half of the twentieth century. Among the most important influences on the army were its Prussianization under Captain Emil Körner and the later American influence that followed the Rio Treaty. Today, thanks to its high degree of motorization, its emphasis on mobility, and the steady flow of resources capable of sustaining modernization regardless of circumstances, the Chilean Army has earned its reputation as the most effective army in South America."
 CHL_the_social_outburst:0 "Estallido Social"
 CHL_the_social_outburst_desc:0 "Chile is experiencing its greatest wave of civil disobedience since the Pinochet dictatorship, with daily protests shaking the country. What began as a simple student revolt against a 30-peso increase in Santiago Metro fares has evolved into a nationwide explosion of anger over a privatized pension system that pays benefits below the poverty line, deep inequality, and the privatization of basic services, especially water. Even after the constitutional referendum was announced to be held in April 2020 on November 15, 2019, the protests continued, while the image of a bleeding eye became the defining symbol of police violence.\n\nPiñera is almost certainly a lame duck. Chile is economically battered and politically polarized to the extreme. The country has been pushed to the edge, and it is only a matter of time before new political forces begin to dominate the polls."
 COL_american_dependence:0 "American Dependence"
 COL_american_dependence_desc:0 "Colombia is closely tied to the United States, from Plan Colombia, through which Washington provided more than 12 billion dollars to fight the FARC and drug trafficking, to the fact that the U.S. remains Colombia's largest trading partner, buying everything from oil to flowers. But not everything is rosy. Relations with Uncle Sam are clearly not always in Colombia's favor, thanks to the Free Trade Agreement that has hurt local farmers, anti-drug certification requirements, and Colombia's dependence on American aid packages. And no matter how hard Colombia tries to shake off that influence, it still needs the United States.\n\nIf something truly bad happens to Uncle Sam, it's a safe bet the same will happen to Colombia."
 COL_colombian_agro_extractive_model:0 "Colombian Agro-extractive Model"
 COL_colombian_agro_extractive_model_desc:0 "The Colombian economy rests on four pillars: flowers, coffee, palm oil, and bananas, forming an agro-export model that has defined the country for decades. But Colombia's main buyers are the United States and the European Union, leaving the country heavily dependent on the West. Add to that latifundia, deep inequality, weak domestic processing, food dependence, and the legacy of banana violence, and the model begins to look dangerously fragile.\n\nAll it would take is a single spark to set the Colombian economy ablaze."
 COL_colombian_armed_forces_desc:0 "A large and battle-hardened military anchors the state, with strong organization and experience in internal conflict."
 COL_national_unity_governament_idea_desc:0 "A national unity government binds rival factions into one cabinet, buying stability and a broader military consensus."
 COL_never_ending_war:0 "Never-ending War"
 COL_never_ending_war_desc:0 "Colombia has seen more than its fair share of civil wars, the most recent of which began in 1948. Seven long decades have passed since the conflict first erupted. At first, it was conservatives against liberals over the death of Gaitán, only for both sides later to unite against General Rojas Pinilla, and then against the Marxists excluded from the National Front. Over the years, the conflict has become little more than a trench war, rarely changing in any meaningful way except during the brief period between 2016 and 2018.\n\n§RThe truth is that Colombia seems destined to remain in a permanent state of civil war, and perhaps it will remain so until Colombia itself ceases to exist.§!"
 COL_the_great_colombian_counterinsurgent_army:0 "The Great Colombian Counterinsurgent Army"
 COL_the_great_colombian_counterinsurgent_army_desc:0 "The Colombian Army is one of the world's most experienced counterinsurgency forces, thanks in large part to Plan Colombia, which transformed it from a force of passive defense into one capable of relentless offensive operations, driving the FARC into retreat and destroying countless insurgent groups. But there is a darker side. The army's methods have often crossed every line, from the infamous false positives scandal, in which soldiers kidnapped civilians, murdered them, and dressed them in FARC uniforms, to its tacit cooperation with paramilitary groups that massacred entire villages suspected of supporting the rebels. Yet as long as the army delivers results, both the government and much of the public are willing to overlook its shortcomings."
 COL_the_invisible_hand:0 "The House Always Wins"
 COL_the_invisible_hand_desc:0 "§YSantos, Pastrana, Lleras, Samper, López, Sarmiento, Santo Domingo, Gilinski, Char.§! These are the names of the most powerful clans in all of Colombia, the families that own the country from top to bottom, the very people who brought it to its current state, sustained by American money, lucrative contracts, and a system in which they all help one another. No matter who comes to power, no matter how many of their schemes are exposed, the elite remains the elite. And even if one family falls, another - stronger and more reliable - will take its place, because the house always wins. "
 COL_vultures_of_colombia_profunda:0 "The Cancer of Deep Colombia"
 COL_vultures_of_colombia_profunda_desc:0 "The Andean foothills, the Amazon rainforest, the Llanos plains. All of this makes up a completely different Colombia - the so-called Deep Colombia. Throughout its history, the elite barely touched these lands, never building real state institutions and, in effect, treating their inhabitants not as citizens of Colombia, but as people of a separate world, crushing the independent republics during La Violencia. Eventually, enough was enough. Many retreated deeper into the jungle and founded Marxist guerrilla groups that continue to fight to this day.\n\nBut despite every peace agreement, the suffering of the people of Deep Colombia has not ended, for the guerrillas long ago became cartels. The cancer of Deep Colombia has become its de facto ruler."
 CUB_alejandro_fernandez_hog_desc:0 "Alejandro Gil Fernandez manages the economy as head of government, balancing scarcity, subsidies and external pressure."
 CUB_alvaro_miera_hog_desc:0 "Alvaro Lopez Miera commands the armed forces, the institution that guarantees the party's internal order."
 CUB_another_sixty_year_castro_idea_desc:0 "Another sixty years of Castro-style continuity: the base is satisfied and the military quietly grows stronger."
 CUB_another_sixty_year_reforms_idea_desc:0 "Another reform cycle extends the revolution's lease on life, with modest social and economic gains buying time for the leadership."
 CUB_another_sixty_year_true_revolution_idea_desc:0 "Another sixty years of the true revolution: high war support and steady military and social progress."
 CUB_army_solves_everything_idea_desc:0 "The army takes over public administration, gaining political weight while stability suffers from militarized rule."
 CUB_chronic_emigration_crisis_idea_desc:0 "Chronic emigration hollows out the island's workforce and social base while the state refuses to change course."
 CUB_crackdown_on_emigration_crisis_idea_desc:0 "Tightened exit controls stem the outflow of people but deepen social frustration and depress the island's reputation."
 CUB_cuba_black_era_idea_desc:0 "An economic black era depresses trade, investment and productivity, leaving the population to endure stagnation."
 CUB_cuba_golden_era_idea_desc:0 "A golden era of tourism, trade and remittances lifts productivity and living standards across the island."
 CUB_cuba_not_golden_era_idea_desc:0 "Growth without depth: trade and investment remain weak, leaving the island only marginally better off."
 CUB_everything_under_control_idea_desc:0 "The state insists that everything is under control, and the machinery of surveillance and propaganda makes the claim credible."
 CUB_first_cracks_in_pcc_idea_desc:0 "The party's monopoly on legitimacy begins to crack: popularity falls, ideological drift accelerates and the leadership's authority weakens."
 CUB_guerra_de_todo_el_pueblo_idea_desc:0 "Guerra de Todo el Pueblo turns the whole island into a defensive organism, with doctrine, fortifications and mass conscription."
 CUB_island_of_freedom_idea_desc:0 "The official narrative of the Cuban revolution presents the island as a free and united people, generating steady support at home and a modest boost to social development."
 CUB_island_of_freedom_under_pcc_idea_desc:0 "Under Communist Party rule the island is presented as free, while the armed forces and political cadres guarantee that the official version holds."
 CUB_manuel_cruz_hog_desc:0 "Manuel Marrero Cruz serves as head of government, a technocrat tasked with keeping the administration running amid scarcity and external pressure."
 CUB_mass_protests_idea_desc:0 "Street protests against shortages and repression paralyze the island, sapping political power, stability and the leadership's ability to hold the line."
 CUB_medium_emigration_crisis_idea_desc:0 "A steady outflow of people erodes the labor force and the island's confidence, though the state still keeps the flow partly contained."
 CUB_miguel_diaz_hog_desc:0 "Miguel Diaz-Canel leads the state as president, balancing party orthodoxy with limited economic reform."
 CUB_new_revolution_idea_desc:0 "A new revolutionary cycle reinvigorates the party's base and raises war support while gradual social gains continue."
 CUB_no_dissidence_idea_desc:0 "Dissent is criminalized and surveillance expanded, entrenching one-party rule at the cost of initiative."
 CUB_pcc_prevailed_idea_desc:0 "The party prevails over its rivals and consolidates legitimacy, with steady social gains."
 CUB_pcc_still_peoples_party_idea_desc:0 "The Communist Party presents itself as the permanent trustee of the people's will, concentrating legitimacy and political direction in a single institution."
 CUB_protests_destroyed_idea_desc:0 "Protests are broken by force: the streets fall quiet, but legitimacy and stability are damaged."
 CUB_ramiro_menendez_hog_desc:0 "Ramiro Valdes Menendez, a veteran of the revolutionary era, embodies continuity and hard-line institutional control."
 CUB_reformist_consolidation_idea_desc:0 "Reformists consolidate their position inside the party and the state, stabilizing the island and reviving social and military development."
 CUB_reliance_on_allies_idea_desc:0 "Dependence on external patrons keeps the island afloat while eroding its autonomy and fuel security."
 CUB_rethinking_revolution_idea_desc:0 "A current inside the party argues that the revolution must be rethought rather than repeated, trading orthodoxy for pragmatism and social renewal."
 CUB_roberto_ojeda_hog_desc:0 "Roberto Morales Ojeda is a senior party organizer tasked with holding the apparatus together through economic hardship."
 CUB_sixty_years_of_revolution_idea_desc:0 "Six decades of revolution leave a deep imprint: the party's base remains loyal and war support high, even as the economy stagnates."
 CUB_us_embargo_idea_desc:0 "The US embargo strangles Cuban trade and investment, keeping productivity and living standards depressed."
 CUB_what_happens_in_pcc_idea_desc:0 "Internal disputes are settled inside the party and never in public, preserving outward unity at the price of slower decision-making."
 ECU_consequences_of_the_end_of_the_oil_era:0 "Consequences of the End of the Oil Era"
 ECU_consequences_of_the_end_of_the_oil_era_desc:0 "The Ecuadorian boom faded as quietly as it had begun, reaching its breaking point with the collapse of oil prices in 2014. Since that fateful moment, the Ecuadorian economy has failed to recover, its growth grinding to a halt while becoming increasingly burdened by debt to China. Ecuador received only a partial IMF loan after restoring fuel subsidies. It will take nothing short of a miracle to keep its people from falling deeper into poverty and restore the economy to its former strength, let alone revive the days of the oil boom."
 ECU_dolars_dolars_dolars:0 "§GDOLARS! DOLARS! DOLARS!§!"
 ECU_dolars_dolars_dolars_desc:0 "Two decades have passed since the crisis was resolved under Jamil Mahuad. During this time, dollarization drove inflation to near zero, restored global investors' confidence in Ecuador's financial system, protected the currency from populist money printing, and expanded access to credit. But all of this came at a price: the loss of an independent monetary policy, vulnerability to a strengthening U.S. dollar - while neighboring countries could simply devalue their currencies to attract tourists - and a critical dependence on foreign currency inflows, coupled with mounting external debt.\n\n§RIf something truly bad happens to the United States, Ecuador is unlikely to survive the crisis.§!"
 ECU_extreme_polarization:0 "Extreme Polarization"
 ECU_extreme_polarization_desc:0 "Ecuador's current crisis can largely be traced back to former President Rafael Correa, for without him there would be no such deep polarization. Correístas and anti-Correístas - either you stand with the president who delivered a socioeconomic triumph, or against the president who ruled through authoritarian measures such as the Media Law. Even Lenín Moreno's great betrayal, his shift from left-wing policies to neoliberalism, and his purge of the Correístas have done nothing to heal the divide. Ecuador remains trapped in extreme polarization, threatening to tear the country apart."
 ECU_freshly_opened_wound:0 "Freshly Opened Wound"
 ECU_freshly_opened_wound_desc:0 "Decree 883 exposed the true face of Ecuador, stripped of every illusion of stability. By eliminating fuel subsidies, Lenín Moreno effectively signed his own political death warrant in the eyes of the Confederation of Indigenous Nationalities of Ecuador and the country's trade unions. Realizing the scale of the crisis, the government repealed the decree, restored the subsidies, and the protests finally came to an end on October 14.\n\nBut this is not peace - it is merely a truce while both sides prepare for the decisive blow. For the fifth time, Ecuador is bleeding because of CONAIE."
 ECU_post_usa_colapse_financial_chaos:0 "§RUh-oh...§!"
 ECU_post_usa_colapse_financial_chaos_desc:0 "For years, dollarization protected Ecuador from its own crises. Inflation disappeared, confidence returned, and the economy grew accustomed to relying on a strong and stable currency. It seemed like the perfect solution.\n\n§RThen the United States descended into civil war.§!\n\nDollars stopped flowing, markets collapsed, and foreign investment vanished. Ecuador cannot print money. It cannot devalue its currency. It cannot escape."
 ELN_foquismo_desc:0 "Foquismo concentrates small armed cells for rapid strikes: high attack and capture rates, weak organization and heavy reliance on captured equipment."
 FRC_revolutionary_mafia_desc:0 "The Revolutionary Mafia fuses political violence with criminal enterprise, funding itself through extortion and trafficking while behaving aggressively abroad."
 MEX_a_oil_bonaza_desc:0 "A oil bonanza floods the treasury with revenue, cutting consumer costs and funding industrial expansion."
 MEX_american_security_cooperation:0 "American Security Cooperation"
 MEX_american_security_cooperation_desc:0 "Security cooperation with Washington brings training and experience gains, though it constrains independent planning."
 MEX_crusade_against_mafia_power_idea_desc:0 "A sustained campaign against organized crime consumes political capital but hardens the state's defenses against criminal infiltration."
 MEX_CSTO_cooperation_desc:0 "Closer ties with the Collective Security Treaty Organization bring training, equipment standards and interoperability, sharpening the army's conventional performance."
 MEX_defy_the_judicial_branch_idea_desc:0 "Open confrontation with the Supreme Court costs the government political power and weakens its defenses against institutional drift."
 MEX_energy_reform_idea_desc:0 "Opening the energy sector to private capital draws investment into generation and infrastructure, at the price of political controversy and higher public costs."
 MEX_iron_quarentine_desc:0 "An iron quarantine closes cities and borders, sharply curtailing production and resource access while consumer costs soar."
 MEX_large_scale_deployments_national_guard_desc:0 "Large-scale deployments of the National Guard extend the state's reach into troubled regions, speeding mobilization and widening recruitment."
 MEX_mexican_resconstruction_idea_desc:0 "The Mexican reconstruction plan rebuilds industry and infrastructure after the cartel war, restoring growth and confidence."
 MEX_NATO_cooperation_desc:0 "Cooperation with NATO brings training standards, interoperability and equipment access that modernize the Mexican army."
 PAR_colorado_hegemony:0 "Colorado Hegemony"
 PAR_colorado_hegemony_desc:0 "Since 1947, the Colorado Party has ruled Paraguay almost without interruption, with only a brief break between 2008 and 2013. It came to power through a bloody civil war, crushed the Liberals, Febreristas, and Communists, established a one-party state, and reached the height of its power during the Stroessner era. First merging with the army and later reinventing itself after the fall of Stroessner, the Colorado Party became inseparable from the state itself. Colorado is Paraguay, and Paraguay is Colorado. And until the Colorados lose their grip on clientelism and business turns its back on them, their hegemony may well endure for another hundred years."
 PAR_la_triple_frontera:0 "The Triple Frontier"
 PAR_la_triple_frontera_desc:0 "The Triple Frontier, made up of Ciudad del Este, Foz do Iguaçu, and Puerto Iguazú, forms a vast metropolitan area - and one of the world's largest hubs for smuggling. Back in the 1990s, when Ciudad del Este became a free trade zone, cheap goods from across the globe poured into the city before being smuggled into Brazil and Argentina. Combined with massive drug trafficking by transnational syndicates, rampant corruption, and enormous money-laundering networks, these forces have shaped the Triple Frontier into what it is today. And even if Paraguay seems willing to tolerate it, Argentina and Brazil are clearly not."
 PAR_the_economic_and_energy_giant_of_south_america:0 "South America's Economic and Energy Giant"
 PAR_the_economic_and_energy_giant_of_south_america_desc:0 "A turning point in Paraguay's history came with the signing of the Itaipú Treaty with Brazil in 1973. Thanks to the Itaipú Hydroelectric Dam and the Yacyretá Dam shared with Argentina in the south, Paraguay entered the era of its economic miracle, adopting a simple tax system that attracted investment and fueled an economic boom. Today, Paraguay is one of the most economically stable countries in the region, and despite all its problems, its economy still appears remarkably resilient."
 PAR_the_legacy_of_paraguays_third_architect:0 "The Legacy of Paraguay's Third Architect"
 PAR_the_legacy_of_paraguays_third_architect_desc:0 "First came Carlos Antonio López, the founder of modern Paraguay. Then General Bernardino Caballero, who rebuilt the nation after the War of the Triple Alliance. And finally, Alfredo Stroessner, the Third Architect, who brought peace to Paraguay after civil war and decades of anarchy. Many years have passed since the fall of his regime, yet its legacy lives on. Abdo Benítez himself once served as Alfredo's personal secretary, the Colorado Party remains in power, the agrarian crisis and illegal landholdings still dominate the headlines, and the shadow economy remains deeply institutionalized. As long as the Colorado Party remains in power, the legacy of the Third Architect will endure - and continue to be nurtured."
 PAR_the_silver_medal_of_corruption:0 "The Silver Medal of Corruption"
 PAR_the_silver_medal_of_corruption_desc:0 ":Paraguay holds the silver medal for corruption in all of South America, surpassed only by Venezuela. For decades, the country has been plagued by nepotism, sabotaged court cases, and entrenched clientelism under Colorado rule. The tri-border area between Paraguay, Brazil, and Argentina has become the largest hub of the shadow economy in Latin America, while the recent leak of a secret protocol for an unfavorable electricity deal with Brazil - one that would have inflicted heavy losses on ANDE - only reinforced the country's reputation.\n\nYet Abdo endured, because corruption - and everything else the Colorado Party does - has become an accepted part of everyday life."
 PRU_constitutional_crisis_tfxversion:0 "Constitutional and Political Crisis"
 PRU_constitutional_crisis_tfxversion_desc:0 "The Government Palace seems to have a revolving door. In just a few years, Peru has seen presidents impeached, Congress dissolved, and political parties fragmented to the point where stable governing coalitions are nearly impossible. The 1993 Constitution, once intended to provide institutional stability, has become the main battleground between the Executive and the Legislature. This constant confrontation has steadily eroded the state's ability to govern and implement long-term reforms. As political institutions remain consumed by power struggles, a growing share of the population watches with increasing distrust a system that appears unable to deliver either stability or effective solutions."
 PRU_fantasma_lava_jato:0 "The Ghost of Lava Jato"
 PRU_fantasma_lava_jato_desc:0 "Lava Jato was the name off a anti Corruption operation initiated in Brasil in July 2014 that involved the the Brazilian enterprise Odebrecht dealing in a international Laundering money scheme in at least 12 countries along with multimillon dollars bribes schemes that included numerous Infraestructure and construction projects in which the Peruvian Goverment and oposition where a willing participant in which important politicians ,ministers ,people from all parties and the political espectrum examples of the people involved where expresidents Alejandro Toledo,Alan Garcia,Ollanta Humala,Pedro Kuczynski causing the collapse off his presidency,along with multiple oposition members like Keiko Fujimori,Susana Villaran,Luis Castañeda,Jorge Acurio,etc,etc.\n\nThis caused a general public indignation all over the Peruvian society which is leading to a great distrust in the state and politicians in general,but some wonder if this popular sentiment will lead to unstopable calls to reforms and change all over the country, but some doubt this and wonder if this zeigast will last a long time in the first palce and things will return to normalcy"
 PRU_milagro_macroeconomico_bcr:0 "Odd Macroeconomic Stability"
 PRU_milagro_macroeconomico_bcr_desc:0 "In sharp contrast to Peru's political instability, the Central Reserve Bank has maintained a reputation for independence and technical competence. Its monetary policies have helped preserve the stability of the Peruvian sol while keeping inflation under control, even during periods of intense political uncertainty. This macroeconomic resilience has cushioned some of the country's recurring political crises. Nevertheless, monetary stability cannot indefinitely replace the need for effective governments, strong institutions, and a favorable investment climate."
 PRU_motor_minero_trabado:0 "The Stalled Mining Engine"
 PRU_motor_minero_trabado_desc:0 "Mining remains the backbone of Peru's export economy, but the sector faces mounting obstacles that limit its potential. Environmental and social conflicts, recurring blockades along the Southern Mining Corridor, lengthy permitting processes, and regulatory uncertainty have slowed strategic investments despite strong global demand for copper and other critical minerals.\n\nThis loss of momentum directly reduces government revenue and limits opportunities for regional development. At the same time, many local communities continue demanding a fairer share of mining wealth and stronger environmental protections, while companies seek greater legal certainty for long-term projects. The result is a persistent cycle of conflict that constrains one of Peru's greatest economic strengths."
 PRU_the_legacy_of_the_1980s_and_1990s:0 "The Legacy of the 1980's and 1990's"
 PRU_the_legacy_of_the_1980s_and_1990s_desc:0 "The 1980s and 1990s profoundly shaped modern Peru. The violence unleashed by the Shining Path (Sendero Luminoso), the Túpac Amaru Revolutionary Movement (MRTA), and other left-wing insurgent groups claimed tens of thousands of lives, displaced entire communities, and left lasting psychological scars across the country. Their eventual defeat restored state authority over much of the national territory, yet memories of the conflict continue to shape public attitudes toward security, political extremism, and the role of the state.\n\nAlberto Fujimori's legacy remains one of the most divisive issues in Peruvian politics. Supporters credit his administration with defeating terrorism, stabilizing an economy devastated by hyperinflation, and implementing reforms that laid the foundation for decades of economic growth. Critics point to the 1992 self-coup, serious human rights violations, and widespread corruption under his government. This unresolved dual legacy continues to polarize Peruvian society, ensuring that the debates of the 1980s and 1990s remain central to the country's political life."
 VEN_bolivarian_army_dynamic:0 "Bolivarian Army"
 VEN_bolivarian_army_dynamic_desc:0 "The Bolivarian Army is the armed expression of the revolutionary project: a force that answers to the political leadership, is deployed for internal order and serves as the backbone of state authority."
 VEN_bolivarian_fury_idea:0 "Operation Bolivarian Fury"
 VEN_bolivarian_fury_idea_desc:0 "Operation Bolivarian Fury mobilizes the state for confrontation, raising political power while driving people abroad and raising consumer costs."
 VEN_bolivarian_order_dynamic:0 "Bolivarian Order"
 VEN_bolivarian_order_dynamic_desc:0 "The Bolivarian order imposes a new hierarchy on the state, redefining institutions around the revolutionary project."
 VEN_cartel_of_suns1:0 "Frequent Cartel de los Soles Activity"
 VEN_cartel_of_suns1_desc:0 "The Cartel de los Soles operates openly, taxing trade and corrupting institutions while the state quietly tolerates the arrangement."
 VEN_cartel_of_suns2:0 "Rampant Cartel de los Soles Activity"
 VEN_cartel_of_suns2_desc:0 "Cartel activity becomes rampant: illicit trade undercuts tax revenue while foreign partners grow wary."
 VEN_covid_curing:0 "Declining COVID-19 Case Load"
 VEN_covid_curing_desc:0 "Case numbers decline as treatment improves, easing pressure on hospitals and consumer costs though the economy remains dented."
 VEN_covid_idea_1:0 "Low COVID-19 Case Load"
 VEN_covid_idea_1_desc:0 "Low case numbers keep the pandemic manageable, though emergency spending and consumer costs still rise."
 VEN_covid_idea_2:0 "Rising COVID-19 Case Load"
 VEN_covid_idea_2_desc:0 "Rising case numbers begin to strain the health system and push consumer costs upward while industrial efficiency slips."
 VEN_covid_idea_3:0 "Notable COVID-19 Case Load"
 VEN_covid_idea_3_desc:0 "Case numbers draw attention as the health system absorbs the burden and industrial output begins to suffer."
 VEN_covid_idea_4:0 "Alarming COVID-19 Case Load"
 VEN_covid_idea_4_desc:0 "Alarming case growth forces the state to spend more on emergency care while factories lose efficiency and consumer costs climb."
 VEN_covid_idea_5:0 "Catastrophic COVID-19 Case Load"
 VEN_covid_idea_5_desc:0 "COVID-19 cases reach catastrophic levels, collapsing hospital capacity, feeding inflation and driving consumer costs sharply upward."
 VEN_dead_oil_industry:0 "The Abandoned Oil Industry"
 VEN_dead_oil_industry_desc:0 "The oil industry has been left to decay: output collapses, fuel supply shrinks and the state loses its main source of revenue."
 VEN_delcy_rodriguez_hog_desc:0 "Delcy Rodríguez serves as vice president, coordinating the government's economic and diplomatic apparatus."
 VEN_economic_miracle_idea:0 "Venezuelan Economic Miracle"
 VEN_economic_miracle_idea_desc:0 "A state-led recovery produces rapid gains in farming, industry and education, and slowly tames inflation."
 VEN_economic_recovery_dynamic:0 "Venezuelan Economic Recovery"
 VEN_economic_recovery_dynamic_desc:0 "A gradual economic recovery takes hold as shortages ease and activity resumes."
 VEN_emergency_oil_extraction_idea:0 "Emergency Oil Extraction"
 VEN_emergency_oil_extraction_idea_desc:0 "Emergency extraction keeps some fuel flowing, but at the cost of revenue, reserves and fiscal credibility."
 VEN_energy_crisis:0 "Energy Crisis"
 VEN_energy_crisis_desc:0 "The power system fails under neglect: blackouts, industrial decline and falling output become routine."
 VEN_gustavo_gonzalez_int:0 "Gustavo Gonzalez Lopez"
 VEN_gustavo_gonzalez_int_desc:0 "Gustavo González López, a security and intelligence official, is associated with the government's internal control apparatus."
 VEN_jorge_arreaza_for:0 "Jorge Arreaza"
 VEN_jorge_arreaza_for_desc:0 "Jorge Arreaza, a diplomat and longtime minister, articulates the government's anti-imperialist foreign policy line."
 VEN_lockdown:0 "Nationwide Pandemic Lockdown"
 VEN_lockdown_desc:0 "A nationwide lockdown slows the outbreak but throttles industry and consumer activity."
 VEN_lockdown_bonds:0 "Lockdown Bonds"
 VEN_lockdown_bonds_desc:0 "Emergency bonds finance the pandemic response, transferring the cost to households and savings."
 VEN_nationwide_riots:0 "Nationwide Riots"
 VEN_nationwide_riots_desc:0 "Nationwide riots paralyze the country, draining political power, stability and the government's ability to govern."
 VEN_nestor_reverol_sec:0 "Nestor Reverol"
 VEN_nestor_reverol_sec_desc:0 "Néstor Reverol is the officer entrusted with the interior and security apparatus, a figure tied to the government's hard line on public order."
 VEN_new_chavism_dynamic:0 "New Chavism"
 VEN_new_chavism_dynamic_desc:0 "New Chavism updates the revolutionary discourse for a new generation, reworking the movement's appeal and organization."
 VEN_new_pink_wave_idea:0 "A New Pink Wave"
 VEN_new_pink_wave_idea_desc:0 "A new pink wave sweeps the region, strengthening left-wing currents and regional solidarity."
 VEN_operation_girardot_idea:0 "Operation Girardot"
 VEN_operation_girardot_idea_desc:0 "Operation Girardot combines mountain and plains maneuvers with targeted strikes, improving the army's results in both attack and defense."
 VEN_operation_padilla_idea:0 "Operation Padilla"
 VEN_operation_padilla_idea_desc:0 "Operation Padilla mobilizes mountain units for counter-insurgency sweeps, sharpening the army's performance in rugged terrain."
 VEN_operation_piar_idea:0 "Operation Piar"
 VEN_operation_piar_idea_desc:0 "Operation Piar concentrates jungle warfare units against insurgent and criminal networks in the south, sharpening jungle combat performance."
 VEN_PSUV_idea:0 "United Socialist Party of Venezuela"
 VEN_PSUV_idea_desc:0 "The United Socialist Party dominates the state but struggles to renew its popular base, trading legitimacy for control."
 VEN_red_revolucionaria_idea:0 "Red Revolution"
 VEN_red_revolucionaria_idea_desc:0 "A network of revolutionary committees and militias binds communities to the state project, raising mobilization capacity and ideological discipline."
 VEN_simon_zerpa_eco:0 "Simon Zerpa"
 VEN_simon_zerpa_eco_desc:0 "Simón Zerpa manages the economy amid sanctions and scarcity, keeping basic finances afloat through improvisation."
 VEN_vladimir_padrino_lopez_theorist:0 "Vladimir Padrino Lopez"
 VEN_vladimir_padrino_lopez_theorist_desc:0 "Vladimir Padrino López is the defense minister and senior officer whose doctrine binds the armed forces tightly to the political leadership."
 CUB_island_of_freedom_idea:0 "Island of Freedom"
 CUB_pcc_still_peoples_party_idea:0 "PCC Is Still the People's Party"
 ARG_el_incaa_1_idea:0 "INCAA"
 BRA_empowered_president_idea:0 "Empowered Presidential Office"
 ARG_tratado_arg_bra_comercial:0 "Argentine-Brazilian Trade Agreement"
 CUB_island_of_freedom_under_pcc_idea:0 "Island of \"Freedom\" Under PCC"
 CUB_rethinking_revolution_idea:0 "Rethinking Revolution"
 ARG_rebuilding_the_military_industry_idea_0:0 "Rebuilding the military industry"
 ARG_cancel_culture_idea:0 "Cancel Culture"
