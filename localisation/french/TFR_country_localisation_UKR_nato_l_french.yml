 UKR_nato_membership_west: "Plan d'action pour l'adhésion"
 UKR_nato_membership_west_desc: "Que les armées du Kremlin avancent déjà vers l'est ou que Moscou se livre à une nouvelle lutte pour le pouvoir après Poutine, les diplomates de Kyiv estiment que la promesse faite à Bucarest en 2008 ne peut plus être repoussée. Une demande d'adhésion officielle est rédigée, et les partenaires occidentaux sont priés d'accueillir l'Ukraine avant que la fenêtre ne se referme."
