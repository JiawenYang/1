  korea.3.t: "Accord de Vladivostok"
  korea.3.d: ""
  korea.3.a: "La paix enfin"
  korea.4.t: "Accords de Hanoï"
  korea.4.d: "La Seconde Guerre de Corée, qui a commencé en 2025, est arrivée à son terme, les deux Corées étant incapables d'obtenir un avantage significatif sur le champ de bataille. Le conflit, qui a éclaté après que les forces sud-coréennes ont franchi le 38e parallèle suite à la mort de Kim Jong-un, a causé des milliers de victimes et attiré l'attention de la communauté internationale avec l'intervention du PDTO et de l'EADI. Malgré des succès initiaux des forces sud-coréennes, dont la capture de plusieurs villes frontalières comme Haeju et Pyongsan, les forces sud-coréennes se sont rapidement enlisées dans le terrain montagneux du Nord et ce qui était attendu comme une campagne rapide s'est transformé en mois de statu quo. Un an après la fin de la guerre, l'EADI, le PDTO et les deux Corées ont négocié une fin au conflit et une résolution pour placer la Corée sous un gouvernement unifié – la République populaire de Corée, nommée d'après le gouvernement provisoire éphémère de 1945. Pour la première fois dans l'histoire, des élections libres et nationales seront organisées sur toute la péninsule, avec des observateurs internationaux. Des politiciens nord et sud-coréens se présenteront aux élections alors que le nouveau gouvernement d'unité nationale tente de guérir les blessures causées par 70 ans de séparation."
  korea.4.a: "Réunification « pacifique »"
  korea.6.t: "Réunification coréenne"
  korea.6.d: "TSUSHIMA, Japon (AP) - Dans un retournement stupéfiant, la Corée du Nord a émergé victorieuse dans la Seconde Guerre de Corée, écrasant les forces sud-coréennes et japonaises et s'établissant comme seule dirigeante de la péninsule coréenne.\n\nLe conflit a commencé mi-2025, lorsque les tensions entre les deux Corées ont atteint un point d'ébullition. Suite à la mort de Kim Jong-un et à la guerre civile nord-coréenne, les troupes sud-coréennes ont franchi le 38e parallèle en espérant une victoire rapide, mais ont rencontré une forte résistance.\n\nMalgré une supériorité militaire en nombre et en technologie, ainsi qu'un soutien des Forces d'autodéfense japonaises, l'assistance chinoise a rapidement transformé l'APC en une force militaire moderne capable de riposter. En combinant tactiques de guérilla, guerre cybernétique et pure volonté, les forces combinées PLA et APC ont repoussé les volontaires du PDTO de Pyongyang et ont franchi vers le Sud, encerclant et écrasant de nombreux régiments du PDTO.\n\nLes suites du conflit restent incertaines, mais il est attendu que la RPDC utilise sa nouvelle puissance pour exercer un contrôle encore plus grand sur sa population et poursuivre sa politique étrangère agressive. Le PDTO, quant à lui, risque une crise de confiance en perdant l'un de ses alliés clés dans la région."
  korea.6.a: "Inattendu"
  korea.7.t: "Réunification coréenne"
  korea.7.d: "SÉOUL, Corée du Sud (AP) - Dans une victoire stupéfiante pour le peuple coréen, la République de Corée est sortie triomphante de la Seconde Guerre de Corée contre son voisin du Nord. Le conflit, commencé en 2025, a vu le déploiement de dizaines de milliers de troupes et l'utilisation de technologies militaires avancées des deux côtés.\n\nLa victoire est venue après des mois de combats intenses, avec de lourdes pertes des deux côtés. L'armée nord-coréenne, longtemps vue comme un tigre de papier, a finalement été submergée par la technologie et les tactiques supérieures de l'armée sud-coréenne, ainsi que par le soutien de ses alliés.\n\nLes tensions entre les deux Corées ont atteint un point de rupture suite à la mort de Kim Jong-un et à l'afflux de milliers de réfugiés à travers la frontière sud-coréenne alors que le Nord sombrait dans l'anarchie. Saisissant l'occasion de réunifier le pays, les Forces armées de la République de Corée ont franchi le 38e parallèle vers le Nord pour la première fois en plus de 70 ans.\n\nAu fur et à mesure que la guerre s'éternisait, les deux côtés ont subi des pertes importantes. Les forces nord-coréennes, fortement dépendantes de technologies militaires obsolètes, n'ont pas pu égaler la puissance de feu de l'armée sud-coréenne et de ses alliés. Pendant ce temps, l'armée sud-coréenne a utilisé des systèmes d'armes avancés et des tactiques, y compris drones et cyberattaques, pour prendre l'avantage."
  korea.7.a: "Deux frères longtemps divisés sont maintenant unis"
  korea.8.t: "La Corée rejoint l'EADI"
  korea.8.d: "SÉOUL, République populaire de Corée (AP) - La Corée a officiellement rejoint l'Initiative de défense est-asiatique, une alliance militaire dirigée par la Chine, suscitant des inquiétudes quant à l'alignement sécuritaire du pays avec ses alliés libéraux de longue date dans la région. La présidente nouvellement élue Sim Sang-jung, militante sud-coréenne des droits des travailleurs de gauche, a annoncé la décision lors d'une émission télévisée devant la nation nouvellement unifiée.\n\nSuite à la fin de la Seconde Guerre de Corée, terminée par un cessez-le-feu entre le Nord et le Sud aboutissant à la création de la République populaire de Corée, un nouveau chapitre s'ouvre pour la péninsule. Alors que beaucoup s'attendaient à une victoire du bloc establishment du Parti démocrate de Corée, le sentiment anti-japonais a dominé l'élection après la publication de rapports sur des atrocités commises par le PDTO. La confiance diminuée dans les institutions libérales, suite à des décennies de frustration économique parmi les classes populaires sud-coréennes et le désir du Nord de préserver des éléments de leur système socialiste, a finalement permis au Parti social-démocrate coréen de gauche de s'installer au pouvoir.\n\n« L'EADI est une initiative importante qui contribuera à la paix et à la stabilité régionales », a déclaré Sim dans un communiqué. « La participation de la Corée du Sud renforcera nos capacités de défense et approfondira nos liens avec la Chine et les autres pays membres. »"
  korea.8.a: "Surprenant"
  korea.9.t: "La Corée rejoint le PDTO"
  korea.9.d: "SÉOUL, République populaire de Corée (AP) - Dans un mouvement historique, la République populaire de Corée a officiellement rejoint l'Organisation du traité de défense du Pacifique, une alliance militaire dirigée par le Japon visant à contrer l'influence croissante de la Chine dans la région.\n\nLa décision a été annoncée mardi par le président Yoon Seok-youl, qui a salué ce pas comme « une étape significative » vers le renforcement de la sécurité du pays et de la stabilité régionale.\n\nL'Organisation du traité de défense du Pacifique, également connue sous le nom de PDTO, a été établie en 2019 par le Japon pour créer un cadre de sécurité régionale réunissant des pays partageant les mêmes idées afin de dissuader les menaces potentielles de la Chine. L'organisation inclut également l'Australie et la Nouvelle-Zélande. La décision de la Corée de rejoindre le PDTO intervient au milieu de tensions croissantes avec la Chine, qui a accru sa puissance militaire et économique dans la région. La nouvelle survient au milieu de la colère nationale face aux cyberattaques chinoises commises pendant la Seconde Guerre de Corée, ainsi qu'aux atrocités commises par les troupes chinoises lors de leur intervention dans la guerre civile nord-coréenne.\n\n« Nous croyons que la paix sur la péninsule coréenne est essentielle pour la paix et la stabilité régionales », a déclaré Yoon. « Nous continuerons à travailler vers cet objectif, tout en renforçant nos capacités de défense grâce à notre participation au PDTO. »"
  korea.9.a: "L'alliance anti-Chine s'étend"
