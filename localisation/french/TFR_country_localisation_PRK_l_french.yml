  PRK_politburo_of_wpk: "Le Politburo"
  PRK_politburo_of_wpk_desc: "Le Parti du travail de Corée est le noyau et le détachement d'avant-garde de la classe ouvrière et des autres masses laborieuses, solidement unis sur le plan organisationnel et idéologique avec Kim Il-sung et Kim Jong-il comme leaders éternels et avec le respecté Camarade Kim Jong-un en son centre.\nLe Parti du travail de Corée représente les intérêts de la nation coréenne et du peuple coréen. C'est l'organisation de direction politique et l'État-major général de la révolution qui guide de manière unifiée les domaines politique, économique, militaire, culturel et tous les autres.\n\nNotre §YE autosuffisance économique§! : [?PRK_economic_sovereignty_level_var|1%].\n\nInfluence §tchinoise actuelle§! : [?Chinese_Influence|-1%]\n\nNotre §GPrêt militaire§! : [?PRK_military_preparedness_level_var|1%]\n\n"
