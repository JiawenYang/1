 korean_confederation.0.t: "Le sommet de Panmunjom"
 korean_confederation.0.d: "Après des années de confrontation et de méfiance, les deux Corées sont enfin de retour à la table des négociations. La Maison Bleue a proposé un sommet historique à Panmunjom pour discuter d'un cadre de réunification pacifique. Les conditions de Pyongyang sont étonnamment modérées : une République confédérale démocratique coréenne neutre, au sein de laquelle deux gouvernements et deux systèmes coexisteraient dans une seule nation.\n\nC'est une occasion unique — ou un piège élaboré. Il faut trancher."
 korean_confederation.0.a: "Accepter le dialogue et poursuivre la confédération"
 korean_confederation.0.b: "Refuser — la sincérité du Nord est douteuse"
 korean_confederation.1.t: "La réponse de Pyongyang"
 korean_confederation.1.d: "Les émissaires du Sud sont arrivés à Panmunjom avec la proposition officielle de confédération de Séoul. Le Commandement suprême a tenu une session d'urgence durant la nuit. D'un côté, le projet de confédération signifierait une réunification pacifique de la péninsule coréenne, ôtant tout prétexte aux armées étrangères de s'ingérer dans nos affaires. De l'autre, la coexistence avec le Sud impliquerait d'accepter deux systèmes côte à côte pour longtemps.\n\nLe regard du Maréchal parcourt la carte du 38e parallèle. Cette décision façonnera le destin de la péninsule."
 korean_confederation.1.a: "Accepter de former la confédération"
 korean_confederation.1.b: "Refuser — la réunification se fera à nos conditions"
 korean_confederation.2.t: "Les deux Corées proclament la République confédérale démocratique coréenne"
 korean_confederation.2.d: "Nouvelle stupéfiante en provenance de Panmunjom : la RPDC et la République de Corée ont officiellement signé la Charte de la Confédération, proclamant la République confédérale démocratique coréenne. Les deux gouvernements coexisteront pacifiquement au sein d'un cadre national unique, et la péninsule coréenne participera aux affaires internationales en tant qu'entité neutre, à l'abri de toute ingérence étrangère dans ses affaires intérieures.\n\nQuatre-vingts ans de division et de confrontation ont pris fin. Le paysage géopolitique de l'Asie de l'Est ne sera plus jamais le même."
 korean_confederation.2.a: "Une aube nouvelle pour la péninsule"