  #Events
  nk.1.t: "Kim Jong-un hospitalisé pour une opération"
  nk.1.d: "Tôt ce matin, le Cher Leader a été admis à l'hôpital."
  nk.1.a: "Prions pour le Cher Leader"
  nk.2.t: "Le Cher Leader est mort !"
  nk.2.d: "C'est vraiment un jour noir ! Notre Cher Leader nous a quittés suite à son opération ! Malgré les efforts de plusieurs chirurgiens, ils n'ont pas pu rétablir un battement de cœur. Une période de deuil de 10 jours a été déclarée et la terrible nouvelle sera bientôt diffusée à la nation."
  nk.2.a: "Qui prendra les rênes ?"
  nk.3.t: "Choe Ryong Hae prend le pouvoir"
  nk.3.d: "Choe Ryong Hae a pris le pouvoir de facto avant que le parti ne puisse organiser un congrès d'urgence. Il affirme que des pouvoirs d'urgence sont nécessaires pour empêcher toute prise de pouvoir. Il prétend qu'il dirigera fidèlement le peuple coréen durant cette période difficile jusqu'à ce qu'un véritable successeur soit trouvé."
  nk.3.a: "Histoire probable…"
  nk.4.t: "Protestations du cabinet"
  nk.4.d: "Suite à la déclaration soudaine de Choe Ryong Hae, le parti a organisé un congrès d'urgence au cours duquel de nombreux membres du cabinet ont exprimé leur mécontentement face à son leadership. Ils affirment qu'il a réalisé un coup d'État soft et prend des mesures avec les forces armées pour sécuriser un pouvoir total. Le reste du parti est indécis quant à qui devrait prendre le pouvoir. De nombreux noms de politiciens ont été lancés, avec des contre-arguments sur leur viabilité."
