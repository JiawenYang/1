  PRK_Total_Control_idea: "Contrôle total de l'État"
  PRK_Total_Control_idea_desc: "\n\n\n\n£GFX_PKR_Total_Control\n\n\n\n\n\nAu fil des années d'existence de la RPDC, le Parti du travail de Corée et la dynastie Kim ont construit une société parfaitement sécurisée. La dissidence est rare, et la plupart des dissidents ont préféré tenter de fuir le pays plutôt que de résister de l'intérieur.\n\nNotre politique du « Militaire d'abord » nous a dotés d'un effectif militaire surdimensionné, nous permettant de maintenir des patrouilles constantes, au prix fort. Le travail incessant de notre machine de propagande fait en sorte que chacun – qu'il soit soldat, officier, ouvrier, nettoyeur ou bureaucrate du parti – n'a pas une minute sans que son patriotisme et son amour pour le Parti, le Cher Leader, l'Armée et le Paradis socialiste dans lequel il a la chance de vivre, protégé des États-Unis et de leurs États fantoches impérialistes, ne soit renforcé.\n\nLe culte de la personnalité de Kim est l'un des plus grands jamais créés, avec une majorité écrasante de la population restant inconditionnellement loyale, prête à travailler, combattre et mourir pour notre Cher Camarade Leader. Peut-être même trop loyaux… et nul ne sait quel serait le sort de la nation si §RKim venait à disparaître subitement…§!"
