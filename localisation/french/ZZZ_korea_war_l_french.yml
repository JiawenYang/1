 ZZZ_KW_korea_war.1.t:0 "La fenêtre des négociations se referme"
 ZZZ_KW_korea_war.1.d:0 "9 mai 2022. Le dernier cycle de discussions intercoréennes s'achève sans accord-cadre. Aucun traité n'est signé, aucune guerre n'est déclarée — mais la fenêtre d'un règlement négocié est désormais fermée. À partir de ce jour, Séoul devra choisir entre la dissuasion et l'aventure."
 ZZZ_KW_korea_war.1.a:0 "Nous avons fait ce que nous pouvions."
 ZZZ_KW_korea_war.2.t:0 "Une péninsule en paix"
 ZZZ_KW_korea_war.2.d:0 "Le cadre confédéral tient. Le Nord et le Sud entrent dans une longue période de transition, et la Maison Bleue est confiée à un gouvernement progressiste attaché à la politique du rayon de soleil. Il n'y aura pas de guerre sur cette péninsule."
 ZZZ_KW_korea_war.2.a:0 "Une nouvelle voie s'ouvre."
 ZZZ_KW_korea_war.3.t:0 "La ligne dure arrive au pouvoir"
 ZZZ_KW_korea_war.3.d:0 "Les négociations sont mortes, et l'électorat se tourne vers un gouvernement conservateur qui promet de répondre aux provocations avec fermeté. La nouvelle administration ordonne une réévaluation complète de la menace nordique et se prépare discrètement au pire."
 ZZZ_KW_korea_war.3.a:0 "L'ordre d'abord."
 ZZZ_KW_korea_war.4.t:0 "Loi martiale d'urgence"
 ZZZ_KW_korea_war.4.d:0 "Décembre 2024. Face à un parlement hostile et à une base politique en ruine, le président décrète la loi martiale d'urgence, invoquant la menace nordique. Des unités blindées avancent vers la capitale et l'Assemblée nationale est encerclée."
 ZZZ_KW_korea_war.4.a:0 "Décréter la loi martiale."
 ZZZ_KW_korea_war.5.t:0 "La nuit de l'Assemblée"
 ZZZ_KW_korea_war.5.d:0 "Les députés se barricadent dans l'hémicycle et rejettent le décret par un vote. Les rues se remplissent de manifestants. Le gouvernement a franchi une ligne qu'il ne peut plus reculer, et la seule issue qu'il distingue encore mène vers le nord."
 ZZZ_KW_korea_war.5.a:0 "Il n'y a plus de retour."
 ZZZ_KW_korea_war.6.t:0 "Guerre contre le Nord"
 ZZZ_KW_korea_war.6.d:0 "À l'aube, la République de Corée déclare la guerre au Nord avec pour objectif l'annexion totale. Pas d'armistice, pas de pause négociée, pas de second cycle de pourparlers. La péninsule est en guerre — et la région ne restera pas longtemps neutre."
 ZZZ_KW_korea_war.6.a:0 "Tout engager."
 ZZZ_KW_korea_war.7.t:0 "La Grande Guerre asiatique"
 ZZZ_KW_korea_war.7.d:0 "Tokyo déclare la guerre à Pékin. La Grande Guerre asiatique a commencé, et les combats sur la péninsule coréenne n'en sont que le premier front."
 ZZZ_KW_korea_war.7.a:0 "C'était inévitable."
 ZZZ_KW_korea_war.8.t:0 "La péninsule en flammes"
 ZZZ_KW_korea_war.8.d:0 "L'artillerie ouvre le feu sur la zone démilitarisée tandis que la République de Corée avance vers le nord. Le monde retient son souffle."
 ZZZ_KW_korea_war.8.a:0 "Le monde regarde."
 ZZZ_KW_martial_law_2024:0 "Loi martiale d'urgence"
 ZZZ_KW_martial_law_2024_desc:0 "Les pouvoirs d'urgence suspendent la politique normale, restreignent les libertés civiles et placent le pays sur le pied de guerre — au prix du peu de légitimité qui restait au gouvernement."
 ZZZ_KW_korea_war.9.t:0 "Loi martiale rejetée"
 ZZZ_KW_korea_war.9.d:0 "Aux premières heures du 4 décembre 2024, l'Assemblée nationale a voté à une écrasante majorité l'annulation du décret de loi martiale, et l'armée a commencé à se retirer de Séoul. Une procédure de destitution a suivi en quelques jours — ce raccourci s'est effondré sous les yeux du public."
 ZZZ_KW_korea_war.9.a:0 "La Constitution tient toujours."
 ZZZ_KW_korea_war.10.t:0 "Un gouvernement remplacé"
 ZZZ_KW_korea_war.10.d:0 "Le 3 juin 2025, les élections anticipées se sont conclues : le camp progressiste a obtenu la majorité et le nouveau gouvernement a pris ses fonctions dès le lendemain. Aucune guerre sur la péninsule, seulement un difficile règlement de comptes et une reconstruction — tandis que le dilemme de sécurité laissé par les conservateurs sépare encore les deux Corées."
 ZZZ_KW_korea_war.10.a:0 "Décidé par les urnes."
