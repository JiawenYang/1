  bur.3.t: "Situation au Myanmar"
  bur.3.d: "Le Myanmar a de nouveau sombré dans un conflit interne, une situation peu surprenante au vu de la fragilité de sa politique parlementaire, de la corruption profondément enracinée dans l’armée, des conditions économiques chaotiques, de l’impact du COVID-19 et des tensions ethniques de longue date. Cependant, contrairement aux conflits précédents, le développement rapide d’Internet et des réseaux sociaux a amplifié les conséquences négatives du coup d’État militaire, en accentuant les divisions sociétales et en rendant la guerre civile très visible. Par ailleurs, l’accès accru à Internet a attiré davantage l’attention sur les groupes armés indépendants des régions frontalières, renforçant encore leur influence.\n\nÀ l’heure actuelle, la communauté internationale se limite largement à des condamnations verbales et à des sanctions ciblant des dirigeants individuels de la junte militaire, sans prendre de mesures concrètes d’envergure. Cela représente néanmoins une opportunité pour nous. En tant que pays partageant la plus longue frontière avec le Myanmar, exerçant la plus forte influence économique et entretenant de bonnes relations à la fois avec l’opposition démocratique et avec le gouvernement militaire, la Chine dispose d’une position privilégiée pour intervenir de manière à changer fondamentalement la donne. De surcroît, parmi les différents chefs de guerre impliqués dans le conflit, l’Armée unie de l’État wa dirigée par Bao Youxiang et l’Armée de Kokang affichent une orientation clairement pro-chinoise, ce qui renforce encore notre position stratégique pour intervenir et obtenir des bénéfices tangibles."
  bur.3.a: "Faisons tout pour la paix"