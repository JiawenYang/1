  # GMA
  trait_GMA_Left_Anarchist: "Loyaliste de Van Deusen"
  trait_GMA_Left_Anarchist_desc: "Fervent défenseur des idéaux du Collectif anarchiste de la Montagne Verte, ce général est loyal envers le maréchal David Van Deusen et suivra ses ordres, même au prix de sa vie."
  trait_GMA_Right_Anarchist: "État libre"
  trait_GMA_Right_Anarchist_desc: "Dévoué au libertarianisme américain, le terme « État libre » est un surnom donné aux libertariens du New Hampshire, en référence au projet « Free State », où des milliers de libertariens ont déménagé dans cet État pour en faire le premier géré par le Parti libertarien. Ce général est loyal envers le leadership des « Fils de la Liberté »."
  trait_GMA_Environmentalist: "Écologistes"
  trait_GMA_Environmentalist_desc: "Dévoués à la protection de la Terre, les écologistes forment un groupe diversifié avec diverses idéologies et théories, allant de l’anarcho-primitivisme à l’éco-fascisme. Ils mourront pour assurer la sécurité de la planète."
  trait_GMA_PMC: "Soutien aux compagnies militaires privées"
  trait_GMA_PMC_desc: "Dévoué à l’argent et rien d’autre, le complexe militaro-industriel de l’ancienne Amérique a produit de nombreuses compagnies militaires privées de qualité. Ce général est fidèle à l’idée d’une dictature militaire privée."
  trait_GMA_Feminist: "Féministe spirituelle"
  trait_GMA_Feminist_desc: "Partageant un objectif religieux et sociétal commun de démantèlement du patriarcat et d’instauration d’une nouvelle religion d’égalité et de féminité, ce général est loyal envers Miriam Simos et son Union spiritualiste."

