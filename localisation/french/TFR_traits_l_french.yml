  # PRC
  hos_godfather_of_chongqing_model: "Parrain du modèle de Chongqing"
  hos_maoist_messiah: "Messie maoïste"
  PRC_new_great_helmsman_trait: "Le nouveau grand timonier"
  PRC_the_god_emperor_of_china_trait: "L’empereur-dieu de Chine"
  trait_PRC_august_1st_medal: "Médaille du 1er août"
  trait_PRC_august_1st_medal_desc: "§LCe général a reçu la §tMédaille du 1er août§!.\n\nC’est la plus haute distinction militaire actuellement décernée aux soldats en Chine. Elle récompense les membres du service ayant apporté des contributions exceptionnelles à la sauvegarde de la souveraineté nationale et des intérêts de développement, ainsi qu’à la modernisation des forces armées.§!"
  trait_PRC_red_flag_medal: "Médaille du drapeau rouge"
  trait_PRC_red_flag_medal_desc: "§LCe général a reçu la §tMédaille du drapeau rouge§!.\n\nCette médaille de temps de guerre est décernée aux officiers commandants à tous les niveaux qui ont fidèlement accompli les tâches confiées par le Parti et le peuple, et apporté des contributions significatives à la victoire.§!"
  trait_PRC_red_star_medal: "Médaille de l’étoile rouge"
  trait_PRC_red_star_medal_desc: "§LCe général a reçu la §tMédaille de l’étoile rouge§!.\n\nCette médaille de temps de guerre est décernée aux combattants et au personnel de soutien qui ont courageusement et résolument exécuté les ordres pendant les opérations militaires, démontrant un héroïsme extraordinaire et accomplissant des exploits remarquables.§!"
  trait_PRC_tiger_tally: "Tigre de commandement"
  trait_PRC_tiger_tally_desc: "§LCe général a reçu le §YTigre de commandement§!.\n\nOriginaire d’un ancien symbole militaire chinois, le Tigre de commandement était un contrat en deux parties utilisé par les empereurs et les commandants militaires pour autoriser le déploiement de troupes. Il symbolisait l’unité entre l’autorité centrale et ses généraux.§!"
  trait_PRC_goldfish_pouch: "Pochette de poisson d’or"
  trait_PRC_goldfish_pouch_desc: "§LCe général a reçu la §YPochette de poisson d’or§!.\n\nEnracinée dans l’ancienne bureaucratie chinoise, les hauts fonctionnaires et généraux portaient une pochette de poisson pour signifier leur statut. La Pochette de poisson d’or était un symbole rare réservé aux individus les plus estimés de l’entourage de l’empereur.§!"
  trait_PRC_iron_certificate: "Certificat de fer"
  trait_PRC_iron_certificate_desc: "§LCe général a reçu le §YCertificat de fer§!.\n\nC’était un système de récompense spécial dans la Chine ancienne, un certificat privilégié accordé par les empereurs aux ministres loyaux. Détenir un Certificat de fer était une marque de reconnaissance impériale, exonérant la famille du détenteur de la peine capitale.§!"

