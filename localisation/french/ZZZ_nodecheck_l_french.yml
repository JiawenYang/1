 ZZZ_nodecheck:0 "Inspecteur des nœuds clés (guerres / événements)"
 ZZZ_nc_ru_status:0 "RU-UA / OTAN : vérification d'état"
 ZZZ_nc_ru_status_desc:0 "Écrit dans le journal de jeu les drapeaux et États de guerre liés à RU-UA et à l'OTAN."
 ZZZ_nc_ru_status_tt:0 "Effet : journalise les États de guerre SOV-UKR et SOV-USA, USA_federal_paralysis_global, ainsi que la route actuelle de la guerre Russie-Ukraine (voie Poutine 2024 ou voie d'adhésion à l'OTAN), y compris le contrôle du dirigeant, la porte de date 2024.1.1 et la présence de l'idée NATO_member chez UKR. Note : le nœud de dissolution de l'OTAN n'est pas implémenté, seul le drapeau est visible."
 ZZZ_nc_eur_status:0 "Europe : vérification d'état"
 ZZZ_nc_eur_status_desc:0 "Écrit tous les drapeaux de la guerre européenne dans le journal de jeu."
 ZZZ_nc_eur_status_tt:0 "Effet : vérifie ongoing/begins/nato_victory/csto_victory/stalemate/resolved et le drapeau de guerre européenne DSW, résultats dans le log."
 ZZZ_nc_gaw_status:0 "GAW : vérification d'état"
 ZZZ_nc_gaw_status_desc:0 "Écrit les drapeaux GAW et l'État de guerre CHI-JAP dans le journal de jeu."
 ZZZ_nc_gaw_status_tt:0 "Effet : vérifie pan_asian_war_ongoing / GAW_soon / les deux drapeaux settled / korean_confederation_formed / la guerre JAP-CHI, résultats dans le log."
 ZZZ_nc_usa_status:0 "États-Unis : contrôle de l'état de mort cérébrale"
 ZZZ_nc_usa_status_desc:0 "Consigne dans le journal les trois drapeaux de la mort cérébrale et l'appartenance à l'OTAN."
 ZZZ_nc_usa_status_tt:0 "Effet : vérifie USA_federal_paralysis_global / USA_federal_paralysis_flag / USA_government_shutdown_flag / si USA possède encore NATO_member, résultats dans le log. Le nœud de dissolution de l'OTAN n'est pas implémenté."
 ZZZ_nc_balkan_status:0 "Balkans : contrôle d'état"
 ZZZ_nc_balkan_status_desc:0 "Consigne dans le log les drapeaux de la fédération, le statut d'autonomie et l'adhésion OTAN/UE."
 ZZZ_nc_balkan_status_tt:0 "Effet : vérifie balkan_subject_agree / autonomy_balkan_federation / NATO_member / idées UE, résultats dans le log. Note : le calendrier électoral balkanique dédié n'est pas implémenté, seule la chaîne générique existe."
