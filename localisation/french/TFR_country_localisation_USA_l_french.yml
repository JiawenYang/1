l_french:
 #Arbre de concentration des États-Unis, importé de The Fire Rises
 USA_abandon_the_anarchists: "Abandonner les anarchistes"
 USA_abandon_the_anarchists_desc: "Les anarchistes sont une honte pour notre mouvement. Ils offrent un festin aux médias de droite et nous humilient à chaque commerce qu'ils incendient. Il est temps de couper les liens avec ces extrémistes."
 USA_address_the_infrastructure: "S'occuper des infrastructures"
 USA_address_the_infrastructure_desc: "Notre plan « Reconstruire en mieux » couvrira l'ensemble des États-Unis, mais nous ferons d'abord profiter les régions qui nous seront les plus utiles."
 USA_american_only_oil: "Pétrole américain uniquement"
 USA_american_only_oil_desc: "Dépendre du pétrole étranger a été un désastre pour notre secteur énergétique ; nous devons nous tourner vers nos propres fournisseurs nationaux pour garantir que les automobiles continuent de rouler."
 USA_back_the_blue: "Soutenir la police"
 USA_back_the_blue_desc: "Les émeutes deviennent incontrôlables ; l'hypocrisie des milléniaux qui détruisent nos rues et nos entreprises alors qu'une maladie dévastatrice se propage est ahurissante. Ils osent même faire empirer les choses en faisant pression sur nos gouvernements étatiques pour réduire le budget de la police, comme si nous avions besoin de plus de criminels déferlant dans nos villes. Nous ne pouvons plus rester les bras croisés pendant que la loi des foules s'empare de notre pays."
 USA_build_back_better: "Reconstruire en mieux"
 USA_build_back_better_desc: "Ainsi, avec détermination et résolution, nous nous tournons vers les tâches de notre époque. Soutenus par la foi. Portés par la conviction. Et dévoués les uns aux autres et à ce pays que nous aimons de tout notre cœur."
 USA_by_force: "Par la force"
 USA_by_force_desc: "Si les lois peuvent être ignorées par ceux qui sympathisent avec leurs camarades face à ceux qui détiennent le pouvoir, alors nous pouvons tout aussi bien faire n'importe quoi pour maintenir la paix par tous les moyens nécessaires."
 USA_by_law: "Par la loi"
 USA_by_law_desc: "Certaines lois sont utiles pour freiner les éléments potentiellement nuisibles de notre pays. Perquisitions, couvre-feux, tout ce que vous voulez."
 USA_compromise_with_the_protesters: "Composer avec les manifestants"
 USA_compromise_with_the_protesters_desc: "Ce n'est pas le moment de mettre encore plus de notre pays en danger en augmentant les taux d'infection par des marches dans nos rues. Même si nous détestons cela, nous devrons céder quelque peu aux manifestants. Avec le temps, ils comprendront leur erreur quand personne ne viendra les aider lorsqu'un criminel enfoncera leur porte."
 USA_crush_the_rioters: "Écraser les émeutiers"
 USA_crush_the_rioters_desc: "S'il y a une chose que nous pouvons apprendre de nos rivaux chinois, c'est que la persévérance et un peu d'huile de coude suffisent à imposer la stabilité, même si cela peut paraître brutal. Des fonds afflueront vers nos commissariats pour de l'équipement anti-émeute, et des patrouilles 24 h/24 commenceront. Les communes anarchistes seront démantelées et les émeutes réduites à néant. Notre patience s'est épuisée, surtout avec des problèmes plus graves qui accaparent l'Amérique."
 USA_defend_the_second_amendment: "Défendre le deuxième amendement"
 USA_defend_the_second_amendment_desc: "Le droit de garder et de porter des armes est inscrit dans notre Constitution et nous devons le préserver pour faire face aux menaces futures contre notre mode de vie, étrangères comme intérieures..."
 USA_empower_the_government: "Renforcer le gouvernement"
 USA_empower_the_government_desc: "Dans une crise comme celle-ci, où la nation vacille au bord du chaos total, la réponse du gouvernement doit être rapide et décisive. Nous veillerons à ce que notre administration soit équipée pour affronter la menace du radicalisme, même si cela exige des méthodes discutables."
 USA_end_state_lockdowns: "Mettre fin aux confinements étatiques"
 USA_end_state_lockdowns_desc: "Les confinements ont perturbé le cours normal de la vie, notamment les entreprises et les activités sociales. Il est temps de revenir à l'ancienne normalité. La seule question est de savoir si cela est possible au milieu d'un certain chaos."
 USA_end_the_chaos: "Mettre fin au chaos"
 USA_end_the_chaos_desc: "L'anarchie dans nos rues s'est enfin calmée, nos courageux forces de police ayant retrouvé leurs repères et commencé à réprimer efficacement les émeutiers malgré des circonstances défavorables. Bien que des émeutes subsistent dans certaines parties du pays, elles se concentrent largement dans les États démocrates. Si l'on peut dire, ils nous rendent service en ridiculisant ces charlatans et leur soutien négligent à ces pseudo-révolutionnaires."
 USA_enforce_order: "Imposer l'ordre"
 USA_enforce_order_desc: "À gauche, à droite et même au centre, certains groupes ne nous considèrent pas vraiment comme légitimes et recourront à tous les moyens pour tenter de nous faire tomber ! Nous ne devons pas les laisser faire !"
 USA_engage_the_media: "Mobiliser les médias"
 USA_engage_the_media_desc: "Les médias ont une influence considérable dans la société américaine. En utilisant toute leur puissance combinée, nous pouvons garantir que ce salaud de la Maison-Blanche n'obtienne pas un autre mandat."
 USA_executive_order_14066: "Décret exécutif n° 14066"
 USA_executive_order_14066_desc: "Le pays entre dans une phase où toute désescalade est impossible ; il est donc impératif de réduire autant que possible la force de notre opposition avant qu'elle n'ait la chance de s'opposer à notre gouvernement. Biden promulguera un décret exécutif déclarant la possession d'armes une urgence nationale et interdisant la propriété privée des armes à feu. Beaucoup s'y opposeront, mais ces mesures empêcheront les ennemis de la démocratie d'être armés."
 USA_expand_lockdowns: "Étendre les confinements"
 USA_expand_lockdowns_desc: "Les confinements initialement établis n'ont eu que peu d'effet pour atténuer la propagation du virus. Il est impératif d'étendre les confinements, d'établir des couvre-feux et des zones de quarantaine."
 USA_expand_the_cdc: "Renforcer le CDC"
 USA_expand_the_cdc_desc: "La Covid-19 menace le tissu même de notre société. Les Centres pour le contrôle et la prévention des maladies doivent être renforcés si nous voulons la repousser. En leur assurant des pouvoirs et des financements accrus, nous pouvons mettre fin au fléau qui pèse sur notre nation."
 USA_fan_the_flames: "Attiser les flammes"
 USA_fan_the_flames_desc: "Les flammes montent dans chaque partie de ce pays, d'un océan à l'autre, d'un État à l'autre ; nous devons allumer une guerre, une guerre contre l'establishment corrompu et contre ceux qui profiteraient de la situation."
 USA_flames_of_the_future: "Les flammes de l'avenir"
 USA_flames_of_the_future_desc: "Tandis que l'Amérique brûle, nous voyons les flammes de l'avenir, un avenir purifié des péchés du passé."
 USA_fuel_the_machine: "Alimenter la machine"
 USA_fuel_the_machine_desc: "Comme une machine bien huilée, nos organes de presse garantiront que Trump et ses partisans reçoivent une couverture négative 24 h/24, afin que nous puissions enfin convaincre l'Amérique qu'il est temps que le tyran parte !"
 USA_green_economics: "Économie verte"
 USA_green_economics_desc: "La crise climatique est là, et elle fera paraître la Covid-19 comme « un grand rien » en comparaison. La crise pétrolière prouve une fois pour toutes qu'il est temps d'investir dans des sources d'énergie alternatives."
 USA_high_expectations: "Grandes attentes"
 USA_high_expectations_desc: "La Covid-19 est la maladie la plus mortelle que le monde ait connue depuis des décennies. Un compromis de convenance politique serait inutile pour la combattre. Nous devons être fermes et envoyer au GOP une proposition qu'il ne peut pas refuser. S'ils ont un peu de bon sens, ils travailleront avec nous."
 USA_implement_emergency_measures: "Mettre en œuvre des mesures d'urgence"
 USA_implement_emergency_measures_desc: "Même les temps les plus difficiles exigent les moyens de prévention les plus radicaux. La vie quotidienne de l'Américain moyen est le principal contributeur à l'explosion des taux d'infection depuis que le virus a atteint nos côtes. Fermer les magasins et confiner tous nos concitoyens chez eux est peut-être le seul moyen de freiner le virus à un niveau contrôlable. Cela peut être dévastateur pour notre économie, mais quels autres choix avons-nous ?"
 USA_invoke_the_insurrection_act: "Invoquer l'Insurrection Act"
 USA_invoke_the_insurrection_act_desc: "Notre nation est en crise. Depuis quelques mois du second mandat de Donald Trump, le pays est en agitation constante entre la psychose liée à la Covid-19, les émeutiers, le scepticisme envers les vaccins et bien d'autres choses. En tant que gouvernement, notre devoir est de protéger le peuple, et selon le président, nous sommes en état d'urgence. Il invoquera donc l'Insurrection Act pour arrêter ceux qui causent des troubles afin de réduire leur effet sur la nation, mais cela risque de déclencher un désastre."
 USA_keep_america_great: "Maintenir l'Amérique grande"
 USA_keep_america_great_desc: "Maintenant que Trump a été réélu au pouvoir, il doit y avoir des moyens de maintenir l'Amérique aussi grande qu'avant, peu importe combien de fois l'autre camp affirme le contraire."
 USA_lasting_peace: "Paix durable"
 USA_lasting_peace_desc: ""
 USA_mandate_the_mask: "Rendre le masque obligatoire"
 USA_mandate_the_mask_desc: "Le public doit être rappelé que le virus peut frapper à tout moment à moins de se désinfecter régulièrement. Les confinements ne seront pas aussi sévères qu'avant, mais le public doit porter un masque chaque fois qu'il sort manger, faire des achats ou visiter des lieux."
 USA_meet_in_the_middle: "Faire la part des choses"
 USA_meet_in_the_middle_desc: "Nous devons être réalistes. Un projet de loi édulcoré adopté immédiatement vaut mieux qu'un texte intransigeant traîné au Sénat, voire enterré au Congrès. Composer avec le GOP est le seul moyen de garantir que l'aide parvienne au peuple américain."
 USA_mingle_with_the_movement: "Se mêler au mouvement"
 USA_mingle_with_the_movement_desc: "Si nous espérons gagner le soutien des mouvements BLM et antifascistes, nous devons descendre dans la rue et nous mêler aux manifestants. Sinon, nous risquons de passer pour des élitistes sans lien ni sympathie pour leur mouvement."
 USA_minimalize_militias: "Réduire les milices"
 USA_minimalize_militias_desc: "Les milices armées sèment le chaos et intimident les communautés et les quartiers locaux ; ce problème doit être réglé par tous les moyens nécessaires."
 USA_national_lockdowns: "Confinements nationaux"
 USA_national_lockdowns_desc: "Cette peste qu'est la Covid-19 exige des mesures sans précédent pour y mettre un terme rapide. Les confinements nationaux pourront être dénoncés comme autoritaires, mais nous devons le faire pour le bien commun."
 USA_no_justice_no_peace: "Pas de justice, pas de paix"
 USA_no_justice_no_peace_desc: "Pas de justice, pas de paix ! Partout aux États-Unis, les forces de l'antifascisme et de la justice sociale se mobilisent. Il serait sage de s'allier à ce puissant mouvement si nous voulons faire tomber l'administration Trump."
 USA_oppose_the_tyrant: "S'opposer au tyran"
 USA_oppose_the_tyrant_desc: "L'Amérique s'apprête à affronter l'une des plus graves menaces pour son unité depuis 1861. Trump a fui à Denver pour installer son gouvernement fantoche, et il est possible que nous devions faire face à pire que lui ; pour le bien de notre démocratie, nous devons nous opposer à ce tyran."
 USA_plan_for_the_worst: "Prévoir le pire"
 USA_plan_for_the_worst_desc: "Le soi-disant coronavirus est sans nul doute une tempête en formation, et elle frappera inévitablement l'Amérique. Nous devons prendre toutes les mesures préventives nécessaires pour empêcher la propagation initiale de la maladie et commencer à constituer des réserves financières afin de réagir de manière appropriée à toute évolution rapide."
 USA_prepare_the_vaccine: "Préparer le vaccin"
 USA_prepare_the_vaccine_desc: "Le développement d'un vaccin est désormais notre priorité absolue pour garantir que l'Amérique puisse revenir au statu quo. Ce n'est pas seulement une compétition entre nous et la Chine : c'est une course pour voir combien de vies nous pouvons sauver en testant la rapidité et le dévouement des meilleurs scientifiques du pays. Nous renforcerons cet effort en mobilisant d'énormes sommes de fonds pour accélérer les progrès du vaccin."
 USA_promise_progress: "Promettre le progrès"
 USA_promise_progress_desc: "Si nous voulons garder l'aile gauche des démocrates dans le rang, nous devrons renouer avec nos racines progressistes. Le président Biden assurera à ces militants que son administration fera avancer la justice sociale et économique, et espérons-le, les gardera dans le rang pour les jours à venir."
 USA_purge_the_pentagon: "Épurer le Pentagone"
 USA_purge_the_pentagon_desc: "Il n'y a pas de plus grande menace pour la sécurité nationale qu'un état-major militaire divisé, peuplé de généraux incompétents et d'initiatives inutiles liées à la « diversité » et à l'« inclusion ». Nous devons tailler dans cette institution dès maintenant, sinon les conséquences à long terme dévasteront la sécurité nationale et notre prestige à l'étranger."
 USA_rally_the_people: "Rallier le peuple"
 USA_rally_the_people_desc: "Dans les moments les plus sombres, nous devons convaincre le peuple que nous menons cette guerre juste pour sauver l'Amérique des petits séparatistes et des seigneurs de guerre fanatiques qui ont l'audace de se proclamer gouvernement alternatif de l'Amérique elle-même."
 USA_reconcile_republicans: "Réconcilier les républicains"
 USA_reconcile_republicans_desc: "Si la majorité des républicains est influencée par ce fou de Trump, certains républicains restent fidèles au véritable gouvernement légitime, car le Parti de Lincoln doit endurer la brutale scission entre les loyalistes restants et les traîtres du culte MAGA qui nous harcèlent depuis quatre ou cinq ans."
 USA_reinvigorate_the_economy: "Revigorer l'économie"
 USA_reinvigorate_the_economy_desc: "La COVID a prélevé une grande part de notre économie ; les petites entreprises ont le plus souffert, mais elles sont l'âme de l'Amérique. Si nous voulons sauver l'Amérique, nous devons préserver son âme : le petit entrepreneur, le père de famille, les commerces de quartier. De fortes réductions d'impôts pour les petites et moyennes entreprises nous remettront sur la bonne voie, même si cela pèse un peu sur notre budget ; nous pouvons le supporter, cela vaut la peine à long terme."
 USA_ridin_with_biden: "Avec Biden"
 USA_ridin_with_biden_desc: "Au fil du temps, il devient clair qu'il ne s'agira pas seulement de combattre la menace orange, mais aussi de se battre pour l'âme de notre nation. Des communistes égarés, des chiens fascistes enragés et des séparatistes opportunistes sont sortis du bois pour tenter de démolir ce pays bien-aimé. Nous devons nous préparer à combattre toutes ces menaces contre la démocratie, en commençant par les adeptes du culte MAGA qui ont fui vers l'ouest."
 USA_side_against_trump: "Se ranger contre Trump"
 USA_side_against_trump_desc: "Trump s'est révélé un échec monumental. Si les États-Unis doivent survivre à la tempête imminente, nous devons tout faire pour chasser ce clown narcissique du pouvoir !"
 USA_side_with_trump: "Se ranger avec Trump"
 USA_side_with_trump_desc: "S'il a certes ses défauts, personne ne peut nier le génie de Trump. Défiant et battant l'establishment politique, il reste un président controversé mais profondément populaire, capable de tenir d'immenses meetings et de maintenir la vigueur de notre économie."
 USA_silence_the_tyrant: "Faire taire le tyran"
 USA_silence_the_tyrant_desc: "Le pouvoir de Trump vient de sa capacité à mobiliser des masses d'Américains par ses déclarations incendiaires sur les réseaux sociaux. En le réduisant au silence, nous pouvons couper l'herbe sous le pied de ses partisans aveuglés."
 USA_standing_down_and_standing_by: "Se tenir prêt et attendre"
 USA_standing_down_and_standing_by_desc: "Les citoyens doivent rester vigilants face à toute menace potentielle contre la souveraineté nationale et aux complots de l'establishment visant à usurper le président légitime."
 USA_state_of_the_union: "Discours sur l'état de l'Union"
 USA_state_of_the_union_desc: "Donald Trump approche de la fin de son premier mandat controversé. Le 45e président des États-Unis préside à une nation en ruine ; en apparence, l'économie est forte et prospère, mais beaucoup craignent que cela ne dure pas. L'Amérique se trouve à nouveau à un carrefour. Ce discours sur l'état de l'Union ne sera pas ordinaire."
 USA_stimulate_the_economy: "Stimuler l'économie"
 USA_stimulate_the_economy_desc: "Les entreprises ont lourdement souffert de la pandémie, en particulier les petites entreprises privées. Le président a proposé le « chèque de stimulation » bien nommé, qui donnera de l'argent à tous nos citoyens pour les aider à payer leur prêt immobilier, leurs dépenses quotidiennes et leur loyer à temps, sans aucun coût pour l'État. Après tout, la Réserve fédérale peut simplement imprimer l'argent dont nous avons besoin."
 USA_support_national_socialism: "Soutenir le national-socialisme"
 USA_support_national_socialism_desc: "Maintes et maintes fois, les républicains ont montré qu'ils ne diffèrent pas des démocrates qui subvertissent et dénigrent notre culture et notre héritage. Il est temps de tenir tête aux dégénérés et aux traîtres qui ont perverti l'Amérique par le discours mondialiste et le marxisme culturel."
 USA_the_fire_rises: "Le feu se lève"
 USA_the_fire_rises_desc: "Le moment est venu de sauver l'Amérique, et une fois que nous aurons surmonté tous les obstacles, nous pourrons enfin rendre l'Amérique vraiment grande ! OÙ NOUS ALLONS UN, NOUS ALLONS TOUS."
 USA_the_shadow_presidency: "La présidence de l'ombre"
 USA_the_shadow_presidency_desc: "Les résultats des élections ont prouvé que l'Amérique affrontera la période la plus difficile depuis 1861. Nos ennemis se multiplient avec le temps, et nous devons nous préparer dans ce calme temporaire avant la tempête."
 USA_the_third_impeachment: "La troisième destitution"
 USA_the_third_impeachment_desc: "Il est temps de tenir tête à Trump, ce populiste divisant qui a trompé des millions de personnes au point que notre pays est sur le point d'être déchiré. Le feu s'est levé et IL N'Y A PAS DE RETOUR POSSIBLE."
 USA_the_true_revolution_begins: "La véritable révolution commence"
 USA_the_true_revolution_begins_desc: "Peu importe qu'il s'agisse de Biden ou de Trump, ils sont les deux faces d'une même pièce, celle qui représente l'oppression du peuple, notamment des travailleurs et des minorités. Il est temps de tenir tête à ces deux maux alors que ce pays sombre dans un chaos plus profond !"
 USA_underground_armaments: "Armements clandestins"
 USA_underground_armaments_desc: "Nous devons constituer des stocks d'armements afin que, le moment venu, nous puissions les utiliser tous pour faire la guerre au régime corrompu et illégitime de Washington."
 USA_unifiy_the_democratic_party: "Unifier le Parti démocrate"
 USA_unifiy_the_democratic_party_desc: "Le Parti démocrate est divisé par diverses idées parfois contradictoires, des progressistes aux libéraux ; il est important que nous nous unissions en ces temps difficiles."
 USA_unify_the_military: "Unifier l'armée"
 USA_unify_the_military_desc: "Maintenant que le haut commandement est purgé de tout cinquième chroniqueur potentiel et de tout personnel inutile, nous devons rechercher le soutien de notre armée pour envoyer à l'establishment le message que nous ne serons ni subvertis ni divisés, et que nous pouvons nous assurer de sa loyauté à notre juste cause."
 USA_warp_speed: "Opération Warp Speed"
 USA_warp_speed_desc: "Les masques chirurgicaux se sont révélés très efficaces pour réduire la propagation du virus, aux côtés d'une série d'autres mesures. La pandémie échappe de plus en plus à tout contrôle ; en introduisant la production de masse de masques chirurgicaux pour notre population civile, nous pouvons espérer dresser un obstacle à la propagation du virus."
