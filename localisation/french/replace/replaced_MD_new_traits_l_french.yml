###################2019-nCoV
SARS_COV_2019_category: "Nouveau Coronavirus"
SARS_COV_2019_category_desc: " \n\n\n\n\n\n\n£MAIN_desctext_SARSCov2019\n\n\n\n\n\n\n\n\n Le nouveau coronavirus (2019-nCoV ou SARS-CoV-2) est une nouvelle souche de coronavirus qui n'a jamais été trouvée chez l'homme auparavant. Les signes courants d'infection par le coronavirus chez les personnes comprennent des symptômes respiratoires, de la fièvre, de la toux, un essoufflement et des difficultés respiratoires. Dans les cas plus graves, l'infection peut entraîner une pneumonie, un syndrome respiratoire aigu sévère, une insuffisance rénale et même la mort. Il n'existe aucun traitement spécifique pour la maladie causée par le nouveau coronavirus. \n\nLa nouvelle épidémie de coronavirus qui fait rage ne met pas seulement en danger la vie et la santé des personnes dans divers pays, mais a également un impact sérieux sur l'économie mondiale. La mondialisation économique a rencontré des vents contraires, l'unilatéralisme et le protectionnisme ont augmenté, et des contradictions telles que l'équité et l'efficacité, la croissance et la distribution, la technologie et l'emploi sont devenues plus prononcées. L'écart entre les riches et les pauvres est encore répandu, et le taux mondial d'extrême pauvreté augmentera pour la première fois en 20 ans. \n\nToute zone infectée par le nouveau coronavirus décidera chaque semaine de se propager ou non aux zones environnantes en fonction du §R$transmit_coefficient_add$§! local. §R$state_extra_population_m ult$§! est lié à §R$transmit_coefficient_add$§!, §Ypopulation locale§! et §Ycoefficient de transmission§!. Lorsque §R$transmit_coefficient_add$§!§Y est inférieur ou égal à 0§!, l'infection virale peut §Gs'arrêter§!. \nAfin de lutter contre l'impact du virus, nous aurons une série de §Ymesures anti-épidémiques§!, mais ces mesures sont souvent une épée à double tranchant, et nous devons faire un choix équilibré entre §Yéconomie§! et §Yvie§!. \n\nStatistiques: \nTotal des décès: [?ROOT.SARS_COV_2019_died_number|3]K \nDécès la semaine dernière: [?ROOT.SARS_COV_2019_died_number_weekly|3]K\nNombre total de provinces infectées la semaine dernière: [?ROOT.SARS_COV_2019_transmit_coefficient_number|0]\nNombre de décès acceptables: [?ROOT.SARS_COV_2019_died_endurance|3]K"

SARS_COV_2019_category_clinical_guidelines: "Publier §Ydes directives cliniques§!"
SARS_COV_2019_category_clinical_guidelines_desc: "Il est nécessaire de mettre à jour les derniers protocoles de traitement standard à chaque établissement médical en temps opportun."
SARS_COV_2019_category_strengthen_public_health: "Améliorer §Yles conditions sanitaires§!"
SARS_COV_2019_category_strengthen_public_health_desc: "Améliorer systématiquement les conditions sanitaires dans les lieux bondés tels que les lieux publics et les zones résidentielles."
SARS_COV_2019_category_promote_working_home: "Promouvoir §Yle travail à domicile§!"
SARS_COV_2019_category_promote_working_home_desc: "Promouvoir l'utilisation d'appareils personnels à domicile pour le travail et l'apprentissage à distance."

SARS_COV_2019_category_show_state_decision: "§YAfficher/Masquer§! les décisions provinciales"
SARS_COV_2019_category_show_state_decision_desc: "Si vous souhaitez uniquement mettre en œuvre des décisions pour une certaine province, cliquez ici pour développer."

SARS_COV_2019_category_lockdown: "Établir §Ydes restrictions de voyage§!"
SARS_COV_2019_category_lockdown_desc: "Bloquer la propagation du nouveau coronavirus en établissant des restrictions de voyage strictes, et si nécessaire, arrêter complètement toutes les études et tous les travaux à l'extérieur et s'isoler à la maison. "
SARS_COV_2019_category_lockdown_cancel: "Annuler §Yles restrictions de voyage§!"
SARS_COV_2019_category_lockdown_cancel_desc: "Le risque d'infection actuel est contrôlable. Nous devrions annuler les restrictions de voyage et reprendre la production et la vie d'origine. "
SARS_COV_2019_category_disease_warning: "Émettre §Yun avertissement d'épidémie§!"
SARS_COV_2019_category_disease_warning_desc: "Utiliser les médias pour émettre des avertissements d'épidémie de nouveau coronavirus et éduquer le public sur la manière de prévenir l'infection par le nouveau coronavirus. "
SARS_COV_2019_category_disease_warning_cancel: "Lever §Yl'avertissement d'épidémie§!"
SARS_COV_2019_category_disease_warning_cancel_desc: "Nous pensons qu'il n'y a actuellement aucun risque d'épidémie de nouveau coronavirus, et levons les avertissements d'épidémie de virus précédents. "
SARS_COV_2019_category_designated_hospital: "Établir §Yun hôpital spécialisé§!"
SARS_COV_2019_category_designated_hospital_desc: "Des institutions médicales spécialisées seront mises en place pour traiter les patients COVID-19 de manière centralisée et unifiée, et des réglementations strictes de prévention des épidémies seront suivies pour prévenir les infections croisées. "
SARS_COV_2019_category_designated_hospital_cancel: "Annuler §Yl'hôpital spécialisé§!"
SARS_COV_2019_category_designated_hospital_cancel_desc: "Comme COVID-19 est efficacement contrôlé, nous n'avons plus besoin d'ouvrir d'institutions médicales spécifiquement pour ce virus. "
SARS_COV_2019_category_herd_immunity: "Déclaré §Yla coexistence avec le virus§!"
SARS_COV_2019_category_herd_immunity_cancel: "Ne plus considérer §Yla coexistence avec le virus§!"
SARS_COV_2019_category_research_viruses_start: "Commencer §Yl'analyse des virus§!"
SARS_COV_2019_category_research_viruses_start_desc: "L'analyse des souches actuelles sera la première étape de nos futures recherches sur les vaccins. "
