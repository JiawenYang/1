CHI_Three_North_Shelterbelt_Forest_Program: "Programme de ceinture forestière des trois Nord"
CHI_Three_North_Shelterbelt_Forest_Program_desc: "\n\n\n\n\n\n\n£MAIN_desctext_sanbei\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]La Chine§! Les régions des trois Nord abritent huit déserts et quatre zones sableuses, avec une superficie de 1,33 million de kilomètres carrés, plus grande que la superficie totale des terres cultivées en Chine. Cette région était autrefois une zone agricole et pastorale avec des herbes luxuriantes et de l’eau abondante, mais elle est maintenant couverte de sable jaune et subit des tempêtes de sable annuelles. Tous les 30 à 100 jours, le lit de la rivière en aval est à plus de 10 mètres au-dessus du sol.\n\n§Y[CHI.GetFlag]Le gouvernement chinois§! a décidé de mettre en œuvre le §Yprojet de ceinture forestière des trois Nord§! en 1979 pour améliorer l’environnement écologique. Il est répertorié comme un projet important de la construction économique nationale. La période de planification du projet est de 73 ans, et il sera réalisé en huit phases. La sixième phase a maintenant commencé. La construction du projet des trois Nord est une nécessité stratégique pour améliorer l’environnement écologique, réduire les catastrophes naturelles et préserver l’espace de vie. C’est la voie fondamentale pour améliorer l’environnement écologique dans les régions des trois Nord et résoudre les catastrophes écologiques.\n\nSelon le plan global, l’étendue de la construction du projet des trois Nord commence à Bin County dans la province du Heilongjiang à l’est, se termine au col de Wuziberi au Xinjiang à l’ouest, atteint la frontière nationale au nord, et s’étend le long de Tianjin, des rivières Fenhe, Weihe et Taohe au sud. Les basses terres, la montagne Burhanbuda, la montagne Karakoram, s’étendent sur 4 480 kilomètres d’est en ouest, avec une largeur de 560 à 1 460 kilomètres du nord au sud. La position géographique se situe entre 73°29' et 129°50' de longitude est et 33°30' et 50°14' de latitude nord. Cela inclut 559 comtés (bannières, villes, districts) dans 13 provinces (régions autonomes, municipalités directement sous l’autorité centrale) incluant le Shaanxi, le Gansu, le Ningxia, le Qinghai, le Xinjiang, le Shanxi, le Hebei, Pékin, Tianjin, la Mongolie intérieure, le Liaoning, le Jilin et le Heilongjiang. La superficie totale de construction est de 4,069 millions de kilomètres carrés, représentant 42,4 % de la superficie totale de la Chine.\n\nAutrefois, cet endroit était une §Rterre désolée couverte de sable jaune§!. Sous la direction du §YParti et de l’État§!, le §Ypeuple chinois§! changera §Ycomplètement§! cette situation et transformera toute la partie nord de la Chine en un §Gnouveau monde écologique prospère et florissant§!."

