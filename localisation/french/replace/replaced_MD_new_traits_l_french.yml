chinese_space_program: "Programme spatial chinois"
chinese_space_program_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chi_space\n\n\n\n\n\n\n\n\n\nL’exploration de l’immense univers est une quête inébranlable de la §Ynation chinoise§! depuis des milliers d’années. §CLe programme spatial chinois§! porte le §Yrêve coloré§! d’un grand pays, et incarne également la §Yfierté et les aspirations du peuple chinois à l’ère nouvelle§!. \n§Y[CHI.GetFlag]Le programme spatial de la République populaire de Chine§! remonte à 1956, dirigé par l’§CAdministration spatiale nationale chinoise§!. L’objectif de la Chine dans le développement de son programme spatial est d’explorer l’espace extérieur et d’élargir ses connaissances sur la Terre et l’univers ; d’utiliser pacifiquement l’espace extra-atmosphérique, de promouvoir la §Ccivilisation humaine§! et le progrès social, §Cau bénéfice de toute l’humanité§! ; de répondre aux besoins de la construction économique, du développement scientifique et technologique, de la sécurité nationale et du progrès social, d’améliorer la culture scientifique de l’ensemble du peuple, de sauvegarder les droits et intérêts nationaux, et de renforcer la puissance nationale globale. §CLe développement de l’industrie aérospatiale chinoise§! suit les principes directeurs du développement scientifique et technologique national, à savoir l’innovation indépendante, les percées clés, le soutien au développement et la conduite de l’avenir.\n\nGrâce à nos efforts inlassables, la §Y[CHI.GetFlag]République populaire de Chine§! deviendra finalement une §Ypuissance aérospatiale mondiale§!, et mènera §Yl’ensemble de l’humanité§! à §Cregarder vers l’univers et avancer vers les étoiles§!."

CHI_motuo_hydropower_station_decision: "Station hydroélectrique de Medog"
CHI_motuo_hydropower_station_decision_desc: "\n\n\n\n\n\n\n£MAIN_desctext_motuo\n\n\n\n\n\n\n\n\n\n§YLa station hydroélectrique de Medog§! est prévue pour être construite dans la région sud du Tibet, en Chine. En raison de la grande différence de terrain et de la topographie complexe, les ressources hydroélectriques y sont particulièrement riches. Selon les calculs des experts concernés, les ressources hydroélectriques de l’ensemble de la région sud-ouest représentent environ un tiers de l’hydroélectricité totale de notre pays, et la capacité installée prévue de la station hydroélectrique de Medog est de 60 millions de kilowatts. En tant que plus grand projet hydraulique au monde, le projet des trois gorges a une production annuelle d’électricité de 300 milliards de kilowatts. Dans ce cas, une fois la station hydroélectrique de Medog achevée, elle deviendra la §Ystation hydroélectrique à la plus haute production totale d’électricité au monde§!, et favorisera également le développement agricole dans la région nord-ouest. Après l’achèvement de la station hydroélectrique de Medog, elle permettra d’économiser 80 millions de tonnes de charbon standard ou 40 millions de tonnes de pétrole pour notre pays chaque année, ce qui contribuera à l’engagement de la Chine à atteindre §Gzero émission§! d’ici 2060."

Form_motuo_inspection_team: "Former une équipe d’inspection"
Form_motuo_inspection_team_desc: "La construction de la station hydroélectrique de Medog est un projet colossal. Nous devons faire des préparatifs adéquats, étudier et planifier l’ensemble du projet."

construction_motuo_dam: "Construction de la station hydroélectrique de Medog"
construction_motuo_dam_desc: "Grâce au travail acharné de l’équipe d’expédition scientifique et de l’Armée populaire de libération, nous avons achevé l’étude de la station hydroélectrique de Medog et pouvons maintenant commencer la construction."

CHI_OGAS_construction: "Construction du système national d’automatisation"
CHI_OGAS_construction_desc: "\n\n\n\n\n\n\n£MAIN_desctext_CHIOGAS\n\n\n\n\n\n\n\n\n\n§YLe camarade Deng Xiaoping§! a autrefois déclaré : « §lLa science et la technologie sont les premières forces productives§! », « §YL’essence du socialisme est de libérer les forces productives, de développer les forces productives, d’éliminer l’exploitation, d’éliminer la polarisation, et en fin de compte d’atteindre la prospérité commune§! ».\n\nAu siècle dernier, en §RUnion soviétique§!, il existait un plan en avance sur son temps, à savoir le §Yplan OGAS - Plan du système national d’automatisation§!. Cependant, à cette époque, l’§RUnion soviétique§! était passée d’un pays socialiste avec une §Rdictature du prolétariat§! à un pays révisionniste §Oentièrement contrôlé par la classe bureaucratique§!. Les §Obureaucrates privilégiés§! ne pouvaient pas accepter ce plan et abandonner leur contrôle sur la production sociale. Sinon, leurs §Yprivilèges et approvisionnements spéciaux§! auraient été remis en question.\n\nPuisque notre pays est toujours une §Ydictature démocratique populaire§! socialiste, le §RParti communiste chinois§! est constamment conscient de lancer une révolution sur lui-même. Nous pouvons compter sur la §Yvolonté du peuple§! et le §Yleadership et la prise de décision du parti§! pour surmonter tous les obstacles qui entravent le développement de la société socialiste. Maintenant, que ce soit en termes de §lniveau technologique§!, de §Yproductivité sociale§! ou de §Ysystème politique§!, nous avons la capacité de réaliser ce §Ygrand plan sans précédent§!, de libérer davantage la productivité, et de construire une Chine §Gmeilleure, plus heureuse, centrée sur le peuple§!.\n\nNous utiliserons le §Yprojet de construction nationale d’automatisation§! pour améliorer encore le §Ysystème socialiste aux caractéristiques chinoises§! et réaliser la §Rmodernisation à la chinoise§!."

Testing_in_xiongan: "Test dans la nouvelle zone de Xiongan"
Testing_in_xiongan_desc: "Afin de tester l’efficacité de la construction du système national d’automatisation, nous pouvons d’abord construire une ville intelligente modèle dans la nouvelle zone de Xiongan."

building_shenzhen_ogas: "Automatisation au cœur de la fabrication"
building_shenzhen_ogas_desc: "La région de la grande baie de la rivière des Perles est le cœur de l’industrie manufacturière de notre pays. Construire un système national d’automatisation ici peut améliorer efficacement l’efficacité de production de notre pays."

building_shanghai_ogas: "Automatisation du centre financier"
building_shanghai_ogas_desc: "Shanghai est le cœur des industries financière et de services de notre pays. Construire un système national d’automatisation ici peut aider efficacement à la transformation et à la modernisation économique de notre pays."

building_beijing_ogas: "Capitale entièrement automatisée"
building_beijing_ogas_desc: "Pékin est la capitale et le centre politique de notre pays. Construire un système national d’automatisation ici peut aider efficacement à améliorer les capacités administratives de notre pays."

Cyberpunk_Mountain_City: "Ville montagneuse cyberpunk"
Cyberpunk_Mountain_City_desc: "Chongqing est la plus grande ville industrielle du sud-ouest de notre pays. Sa construction urbaine exceptionnelle surmonte les limitations géographiques et présente une forte attractivité touristique dans notre pays."

Wisdom_Jiangnan: "Jiangnan intelligent"
Wisdom_Jiangnan_desc: "Le Jiangsu est un centre économique important de notre pays depuis l’Antiquité. Construire un système national d’automatisation ici peut efficacement créer un cluster urbain intégré dans le delta du Yangtze."

Technology_Hangzhou: "Hangzhou technologique"
Technology_Hangzhou_desc: "Hangzhou abrite la plus grande entreprise technologique d’Internet de notre pays, le groupe Alibaba. Construire un système national d’automatisation ici peut efficacement rayonner sur les services Internet nationaux."

Technology_Xian: "Le plus long jour à Chang’an"
Technology_Xian_desc: "Xi’an est la plus grande ville du nord-ouest de notre pays et une célèbre ville ancienne de notre pays. Construire un système national d’automatisation ici peut efficacement promouvoir la croissance économique dans le nord-ouest de la Chine."

Preliminary_construction_OGAS: "Construction préliminaire du système national d’automatisation"
Preliminary_construction_OGAS_desc: "Nous avons réussi à construire un niveau préliminaire du système national d’automatisation dans de nombreuses grandes villes à travers le pays. Nous avons établi un réseau de gestion de l’information couvrant de nombreux endroits."

