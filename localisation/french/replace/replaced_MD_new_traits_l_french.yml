    #leader
    emerging_Socialism_with_Chinese_characteristics: "Socialisme à caractéristiques chinoises"
    emerging_Socialism_with_Chinese_characteristics_desc: "Ce leader est l'héritier et le promoteur du grand socialisme à caractéristiques chinoises"
    career_burocrat: "Bureaucrate de carrière"
    career_burocrat_desc: "Ce leader a une longue carrière dans l'administration et comprend bien comment gérer une bureaucratie efficace."
    iron_hand: "Décisif et rapide"
    iron_hand_desc: "Ce leader est dur et décisif, et fera tout son possible pour atteindre ses objectifs politiques."
    CHI_paternalism_controlled_democracy: "Démocratie contrôlée par le paternalisme"
    CHI_paternalism_controlled_democracy_desc: "Le paternalisme compense les énormes lacunes du système démocratique. Une puissante machine de propagande nationale dit aux gens ce qui est le mieux pour eux, maintient les idées radicales et dangereuses hors du système démocratique et assure que tous les partis politiques du pays soutiennent unanimement la stratégie de développement à long terme du pays."
    CHI_Silent_doer: "Acteur silencieux"
    CHI_Silent_doer_desc: "Ce leader est calme et taciturne. Il ne s'intéresse pas aux choses superficielles et préfère faire son travail en silence."
    CHI_Traditional_culture_enthusiasts: "Cavaliers du Dragon Rouge"
    CHI_Traditional_culture_enthusiasts_desc: "Ce leader est très attaché à la culture traditionnelle et cite souvent les classiques."
    CHI_engineer: "Contexte technique"
    CHI_engineer_desc: "Ce leader a reçu une éducation d'ingénieur et a une vaste expérience en ingénierie."
    CHI_jurisprudence: "Contexte littéraire"
    CHI_jurisprudence_desc: "Ce leader a une formation littéraire et une vaste expérience en gestion."
    CHI_elder: "Ancien"
    CHI_elder_desc: "Ce leader est très respecté pour son vaste travail et son expérience de vie."
    CHI_sense_of_humor: "sens de l'humour"
    CHI_exemplary_conduct_and_nobility_of_character: "Grande moralité et intégrité"
    CHI_dignified: "digne"
    The_Pioneer_of_the_Century: "Le Pionnier du Nouveau Siècle"
