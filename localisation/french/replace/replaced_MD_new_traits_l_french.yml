    CHI_ruin_pur_reputation: "La réputation internationale a été ruinée"
    CHI_ruin_pur_reputation_desc: "Nos adversaires ont récemment diffusé une grande quantité de fausses informations pour saper notre réputation internationale."
    RAJ_Defective_Equipment_Research: "Conception d'équipement défectueux"
    RAJ_Defective_Equipment_Research_desc: ""
    RAJ_Caste_System_Deep_Rooted: "La hiérarchie est profondément enracinée"
    RAJ_Caste_System_Deep_Rooted_desc: "Bien que le système des castes ait été longtemps aboli nominalement, la hiérarchie dominante dans la société n'a pas été efficacement inversée."
    PRC_USA_relations_other_country: "Influence des relations sino-américaines"
    PRC_USA_relations_other_country_desc: "Les relations sino-américaines affectent le monde à bien des égards, et les pays puissants sont moins affectés par elles."
    PRC_USA_relations_hegemony_country: "Influence de l'hégémonie mondiale"
    PRC_USA_relations_hegemony_country_desc: "[ROOT.GETNAME] est le pays le plus influent au monde et son influence se fait sentir presque partout."
    CHI_population_aging_ratio_modifiers: "Modificateurs du ratio de vieillissement de la population"
    CHI_research_without_ethical_restrictions: "Permet la recherche sans restriction éthique"
    MON_Ecological_Issues: "Problèmes environnementaux en Mongolie"
    MON_Ecological_Issues_desc: "Depuis la fin de la Guerre froide, l'économie de la Mongolie a longtemps dépendu de l'élevage extensif et de l'exploitation minière non réglementée, ce qui a progressivement détérioré l'environnement écologique local. La pollution de l'air de plus en plus grave et la désertification inarrêtable vont épuiser le dernier souffle de cette terre.\n\n§RSi le modèle économique local ne change pas, les problèmes environnementaux s'aggraveront chaque mois!§!"
    RUS_winter_is_coming: "L'hiver arrive"
    CHI_offend_our_people: "Écueil"
    CHI_offend_our_people_desc: "En tant que ver, un dragon peut être traité comme une créature intime et chevauchée. Cependant, il y a une échelle sous sa gorge d'un pied de diamètre. Si quelqu'un l'offense, il sera tué. Le dirigeant a aussi une échelle. Si ceux qui le conseillent peuvent éviter d'offenser l'échelle du dirigeant, alors ils réussiront."
    CHI_zhurongji: "Premier Ministre Zhu Rongji"
    CHI_zhurongji_desc: "Zhu Rongji, genre masculin, nationalité Han, né en octobre 1928 à Changsha, Hunan. Il a rejoint le Parti communiste chinois en octobre 1949 et a commencé à travailler en décembre 1948. Diplômé du Département de génie électrique de l'Université Tsinghua avec une spécialisation en fabrication de machines électriques. Il a un diplôme universitaire et est ingénieur senior. Il a travaillé dans le domaine économique pendant plus d'un demi-siècle et est expérimenté. Sa pensée vive, sa détermination, son audace et sa rigueur ont rendu le travail économique qu'il a dirigé efficace et efficace. Pendant son mandat, le gouvernement a fonctionné efficacement, mais la mise en œuvre de certaines politiques, telles que les licenciements dans les entreprises d'État et l'augmentation des charges sur les agriculteurs, a eu un certain impact négatif sur la société."
    CHI_wenjiabao: "Premier Ministre Wen Jiabao"
    CHI_wenjiabao_desc: "Wen Jiabao, genre masculin, nationalité Han, né en septembre 1942 à Tianjin. Il a rejoint le Parti communiste chinois en avril 1965 et a commencé à travailler en septembre 1967. Il est diplômé de l'Institut de géologie de Pékin avec une spécialisation en structure géologique. Il a un diplôme de troisième cycle et est ingénieur. Il a travaillé au Bureau provincial de géologie du Gansu, s'engageant dans l'exploration géomécanique et autres travaux. Plus tard, il a été transféré au Ministère de la géologie et des ressources minérales, s'engageant dans la recherche sur les politiques et les réglementations et a ensuite été promu vice-ministre du ministère. Pendant son mandat de Premier Ministre, Wen Jiabao a personnellement participé à l'organisation ou à la gestion d'événements majeurs et d'incidents tels que l'incident du SRAS, le séisme de Wenchuan, les Jeux Olympiques de Pékin, la crise financière mondiale de 2007-2008, le séisme de Yushu au Qinghai, l'Exposition Universelle de Shanghai, le glissement de terrain de Zhouqu au Gansu, et les Jeux asiatiques de Guangzhou. Sa plus grande mesure politique, le plan de relance économique, a été controversée, il est donc également connu comme le Premier Ministre le plus controversé de l'histoire chinoise."
    CHI_likeqiang: "Premier Ministre Li Keqiang"
    CHI_likeqiang_desc: "Li Keqiang, genre masculin, nationalité Han, né le 3 juillet 1955 à Dingyuan, Anhui. Il a commencé à travailler en mars 1974 et a rejoint le Parti communiste chinois en mai 1976. Il est diplômé du Département de droit et du Département d'économie de l'École d'économie de l'Université de Pékin avec un diplôme de premier cycle en droit et un doctorat en économie. Depuis juin 1998, Li Keqiang a servi successivement en tant que secrétaire adjoint du Comité provincial du Parti du Henan, gouverneur par intérim, gouverneur, secrétaire du Comité provincial du Parti du Henan, gouverneur, secrétaire du Comité provincial du Parti du Henan et président du Comité permanent de l'Assemblée populaire provinciale. Depuis décembre 2004, il a servi successivement en tant que secrétaire du Comité provincial du Parti du Liaoning, secrétaire du Comité provincial du Parti du Liaoning et président du Comité permanent de l'Assemblée populaire provinciale. En octobre 2007, le camarade Li Keqiang a été élu membre du Bureau politique et du Comité permanent du Comité central du PCC lors de la première session plénière du 17e Comité central du PCC. Après avoir servi en tant que Premier Ministre du Conseil d'État, le camarade Li Keqiang a consacré beaucoup d'efforts dans les domaines de la science et de la technologie, de l'éducation, de la protection écologique, du redressement complet du Nord-Est de la Chine et du développement de la région occidentale. Ce Premier Ministre réformateur, qui est compétent en économie, a proposé le célèbre \"Indice Keqiang\" en économie, a attaché de l'importance au développement des industries manufacturières et d'Internet, et a proposé le modèle de développement \"Internet +\". Cependant, ce Premier Ministre énergique a toujours été enveloppé d'une ombre et n'a pas pu afficher ses grandes ambitions..."
    CHI_crisis: "Crise économique"
    CHI_crisis_desc: "§RLorsqu'un tsunami arrive, tous les efforts humains sont inutiles§!"
    CHI_Tax_Sharing_Reform_Land_finance: "Réforme du partage des impôts de 1994 et financement foncier"
    CHI_Tax_Sharing_Reform_Land_finance_desc: "En 1994, la Chine a commencé à mettre en œuvre le système de gestion fiscale de partage des impôts, qui a joué un rôle positif dans la rationalisation de la relation de distribution entre les gouvernements central et locaux, la mobilisation de l'enthousiasme des gouvernements central et locaux, le renforcement de la perception des impôts, la garantie des recettes fiscales et l'amélioration des capacités de macro-contrôle. Cependant, il a également donné naissance au modèle de développement du financement foncier, posant les bases cachées de la création de bulles immobilières."
    CHI_Tax_Sharing_Reform_Land_finance_01: "Réforme du système fiscal"
    CHI_Tax_Sharing_Reform_Land_finance_01_desc: ""
    CHI_intertwined_Interest_relations: "Relations d'intérêts entrelacées"
    CHI_intertwined_Interest_relations_desc: "Si vous ne violez pas les règles de la bienséance et de la justice, pourquoi devriez-vous vous soucier de ce que les autres disent? Si l'eau est trop claire, il n'y aura pas de poissons; si la personne est trop prudente, il n'y aura pas de suiveurs; les glands devant la couronne sont utilisés pour bloquer la vision; le crêpe noir est utilisé pour remplir les oreilles pour bloquer l'audition. La vision ne voit pas ce qui est visible, et l'audition n'entend pas ce qui ne l'est pas. Promouvoir les grandes vertus et pardonner les petites fautes. Ne vous attendez pas à ce qu'une personne soit parfaite. Rendez-le droit pour qu'il puisse être obtenu par lui-même; rendez-le doux pour qu'il puisse être obtenu par lui-même; rendez-le mesuré pour qu'il puisse être recherché par lui-même. C'est ainsi que les sages enseignent et éduquent, espérant qu'ils pourront l'obtenir par eux-mêmes; s'ils l'obtiennent par eux-mêmes, ils seront rapides et larges d'esprit."
    CHI_agricultural_tax: "Taxe agricole"
    CHI_agricultural_tax_desc: "Depuis la fondation de la République populaire de Chine, en particulier de 1953 à 1986, la politique d'achat et de vente unifiée de l'État pour les produits agricoles a en fait extrait une grande partie de la plus-value agricole pour la production industrielle à travers le \"écart de ciseaux\" des prix entre les produits industriels et agricoles pour subventionner le développement industriel."
    CHI_uncontrolled_internet: "Internet libre"
    CHI_uncontrolled_internet_desc: "Le 14 septembre 1987, avec l'aide du professeur allemand Werner Zohn et d'autres, Wang Yunfeng et d'autres de l'Institut de technologie d'application informatique de Pékin ont envoyé un e-mail intitulé \"Traverser la Grande Muraille et aller dans le monde\". Le 20 avril 1994, une ligne dédiée internationale de 64K a été connectée à Internet depuis l'Académie chinoise des sciences, réalisant une connexion à pleine fonction entre la Chine et Internet. Depuis lors, la Chine est devenue le 77e membre de la famille internationale d'Internet.\nCependant, depuis les années 1990, en raison de l'énorme écart entre la Chine et les pays occidentaux, les nouvelles négatives et les fausses informations sont devenues monnaie courante sur Internet à cette époque."
    CHI_Popular_culture_from_Jap_KRO_HKG_TWN: "Culture populaire du Japon, de la Corée, de Hong Kong et de Taïwan"
    CHI_Popular_culture_from_Jap_KRO_HKG_TWN_desc: "Après l'âge d'or de la culture dans les années 1980 et 1990, la culture pop du Japon, de Hong Kong et de Taïwan a été largement populaire en Chine continentale. Après être entré dans le nouveau siècle, la vague coréenne est devenue une nouvelle étoile dans la culture populaire. Les produits culturels de ces pays et régions peuvent être vus partout dans la vie quotidienne des Chinois, et les jeunes de la génération du millénaire ont grandi dans un tel environnement."
    CHI_backwash_of_big_layoff: "Reflux des grands licenciements"
    CHI_backwash_of_big_layoff_desc: "\"Les travailleurs devraient penser au pays. Si je ne suis pas licencié, qui le sera?\" Dans les années 1990, le Premier Ministre Zhu Rongji a approfondi la réforme des entreprises d'État et promu la réduction des charges et les licenciements. Depuis la décision sur la réforme en mai 1997, des millions de travailleurs d'entreprises d'État ont été licenciés en quelques mois seulement. La mise en œuvre de la politique a dépassé les attentes: de 1998 à 2000, 7 à 9 millions de travailleurs ont été licenciés presque chaque année. En 2003, le nombre total de travailleurs licenciés des entreprises d'État a atteint 28,18 millions.\n\nLe chômage généralisé des travailleurs a eu un énorme impact sur la société chinoise. Les emplois créés par l'investissement dans l'appréciation des actifs nationaux sont loin de répondre aux besoins d'emploi des travailleurs au chômage. Les chômeurs sont isolés du fonctionnement de la société. Le traumatisme de l'agitation causée par cela prendra beaucoup de temps à guérir. Cependant, il peut être possible d'accélérer la création d'emplois en élargissant rapidement l'investissement et la production..."
    CHI_backwash_of_big_layoff_2: "Le reflux des grands licenciements"
    CHI_backwash_of_big_layoff_2_desc: "\"Les travailleurs devraient penser au pays. Si je ne suis pas licencié, qui le sera?\" Dans les années 1990, le Premier Ministre Zhu Rongji a approfondi la réforme des entreprises d'État et promu la réduction des charges et les licenciements. Depuis la décision sur la réforme en mai 1997, des millions de travailleurs d'entreprises d'État ont été licenciés en quelques mois seulement. La force de mise en œuvre a dépassé les attentes: de 1998 à 2000, 7 à 9 millions de travailleurs ont été licenciés presque chaque année. En 2003, le nombre total de travailleurs licenciés des entreprises d'État a atteint 28,18 millions.\n\nEn raison d'une série de mesures visant à attirer les investissements étrangers et à augmenter les exportations, l'économie nationale est devenue quelque peu prospère. Les usines qui ont surgi ont continuellement absorbé des employés silencieux. La main-d'œuvre excédentaire apportée par les licenciements massifs se transforme rapidement en un dividende du travail"
    CHI_superstition_and_Separatism: "Superstition et séparatisme"
    CHI_superstition_and_Separatism_desc: "Bien que la Chine soit un pays athée et que la plupart des gens ne croient pas en l'existence de dieux et de fantômes, les Chinois sont très ignorants en matière de croyances religieuses. De plus, le Parti communiste chinois maintient une attitude neutre envers les croyances religieuses, ce qui a entraîné la prolifération de diverses religions et même de sectes dans la société chinoise. De plus, de nombreux séparatistes et terroristes ont tenté de diviser et de désintégrer la Chine au nom de la religion, posant un grave danger social."
    CHI_moderately_prosperous_society_1: "Construire une société modérément prospère à tous égards"
    CHI_moderately_prosperous_society_1_desc: "Au cours des 20 premières années de ce siècle, nous devons concentrer nos efforts sur la construction d'une société modérément prospère d'un niveau supérieur qui profitera à plus d'un milliard de personnes, et rendre l'économie plus développée, la démocratie plus saine, la science et l'éducation plus avancées, la culture plus prospère, la société plus harmonieuse et la vie des gens plus aisée."
    CHI_moderately_prosperous_society_complete: "société modérément prospère"
    CHI_moderately_prosperous_society_complete_desc: "Les gens ne sont plus fatigués et peuvent vivre dans une prospérité modérée. Bénéficier à la Chine et pacifier les quatre directions. Ne vous laissez pas aller à la ruse et suivez les autres, et soyez prudent et sans scrupules. Arrêtez les envahisseurs et ne craignez pas les sages. Soyez doux avec ceux qui sont loin et soyez proches, afin de stabiliser notre roi.\n\n——《Le Livre des Chants·Da Ya·Min Lao》"
    CHI_National_rejuvenation: "Le grand renouveau de la nation chinoise"
    CHI_National_rejuvenation_desc: "Notre route est si large, notre avenir est si brillant, nous nous consacrons à cette cause magnifique, avec un bonheur infini et une gloire suprême."
    CHI_superstition_and_Separatism2: "Vestiges séparatistes"
    CHI_superstition_and_Separatism_desc2: "Sous la répression continue du Parti communiste chinois, les sectes et les organisations religieuses extrêmes ont été classées comme organisations illégales et ont subi un désastre dévastateur. Les gens sont très vigilants contre ces organisations. Cependant, il y a encore de nombreux éléments obstinés tapis dans les coins de la société attendant une occasion d'agir. Après tout, vous ne pouvez jamais tuer tous les insectes."
    CHI_Public_panic: "Panique publique"
    CHI_Public_panic_desc: "Alors que le gouvernement diffusait des nouvelles d'un virus inconnu, le public est tombé dans la panique."
    CHI_Public_panic2: "Toujours effrayé"
    CHI_Public_panic_desc: "En raison de la publicité scientifique continue et des mesures de réassurance du gouvernement, le public a temporairement arrêté la panique généralisée initiale, mais ils sont toujours inquiets d'être également infectés par le virus inconnu."
    CHI_Public_panic3: "Un cœur, un esprit"
    CHI_Public_panic_desc: "Sous le contrôle total du gouvernement, le virus ne se propage plus à grande échelle et les zones où le virus est apparu ont été rapidement maîtrisées. Les gens croient que sous la direction du Parti et du gouvernement, nous pourrons certainement surmonter cette période difficile."
    eleventh_five_year_plan: "Onzième plan quinquennal"
    eleventh_five_year_plan_desc: "En avant!"
    tenth_five_year_plan: "Dixième plan quinquennal"
    tenth_five_year_plan_desc: "En avant!"
    CHI_Rural_Development_Plan: "Plan de développement rural"
    CHI_population_modifiers: "Structure de la population chinoise"
    CHI_population_modifiers_desc: "La population est la pierre angulaire de l'économie. Sans les gens, il n'y a pas de production, pas de consommation et pas d'avenir. La Chine est le pays le plus peuplé du monde. La politique de planification familiale à long terme a grandement amélioré le fardeau démographique de la Chine, mais elle peut conduire à une crise plus importante et finalement tomber comme une pierre qui roule.\n----------------\n§WTaux d'urbanisation actuel: [?ROOT.CHI_urbanization_now|Y2%%], cette valeur affecte §Y$MODIFIER_GLOBAL_MONTHLY_POPULATION$, $total_workforce_modifier$, $health_cost_multiplier_modifier$§!\n\nRatio de vieillissement de la population: [?ROOT.CHI_aging_ratio_now|Y2%%], cette valeur affecte §Y$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$, $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$, $MODIFIER_RESEARCH_SPEED_FACTOR$, $health_cost_multiplier_modifier$, $MODIFIER_CONSUMER_GOODS_FACTOR$§!§!"
    CHI_Feminism: "Droits des femmes chinoises"
    CHI_Feminism_desc: "Les droits des femmes sont un domaine important des droits de l'homme et un facteur important affectant le développement social"
    CHI_gangland: "Les forces du mal sont endémiques"
    CHI_gangland_desc: "Les forces du mal sont répandues dans la société chinoise, et elles collaborent même avec certains policiers et bureaucrates pour exploiter le peuple. En tant qu'énorme cancer de la société, le monde souterrain n'a pas seulement causé de grands dommages à la vie et aux biens du peuple chinois, mais a également affecté la prospérité et la stabilité de l'ensemble de la société. Les gens grincent tous des dents et le détestent, et ils n'ont également aucune confiance dans le gouvernement qui était incapable de le contrôler ou même de collaborer avec lui."
    CHI_Crime_crackdown: "Lutter contre le crime et le mal"
    CHI_Crime_crackdown_desc: "Couper les rats d'égout avec un couteau"
    CHI_China_supports: "Soutien de la Chine"
    CHI_China_supports_desc: "Nous avons reçu un soutien financier de la Chine"
    CHI_Internet: "Internet chinois"
    CHI_Internet_desc: "L'Internet chinois est le plus grand au monde. Il a le plus grand nombre d'utilisateurs d'Internet et la plus grande zone de réseau. Internet change de plus en plus la façon dont les gens apprennent, travaillent et vivent, et affecte même l'ensemble du processus social."
    CHI_Political_support: "Soutien politique"
    CHI_Political_support_desc: "Alors que nous nous efforçons de plaire aux puissants de diverses manières, ils nous récompenseront par un soutien politique."
    CHI_labour_law: "La loi sur le travail n'est que nominale"
    CHI_labour_law_desc: "La Chine a établi la loi sur le travail dès les années 1920. Après la fondation de la République populaire de Chine, sous la direction du marxisme-léninisme, une série de lois ont été introduites pour protéger les droits et intérêts des travailleurs en combinaison avec la situation réelle de la Chine. Au début des années 1990, après la troisième rédaction de la loi sur le travail, elle a été examinée et adoptée par le Comité permanent de l'Assemblée populaire nationale le 5 juillet 1994. La promulgation de la loi sur le travail marque l'entrée du système juridique du travail chinois dans une nouvelle étape historique. Cependant, il y a des lacunes fréquentes dans la mise en œuvre de la loi sur le travail, et les autorités n'ont pas commenté le comportement des entrepreneurs violant la loi sur le travail, de sorte que la loi sur le travail est presque devenue une lettre morte face au développement national, et la majorité des travailleurs sont souvent incapables de protéger leurs droits et intérêts légitimes du travail par le biais de procédures légales."
    CHI_controlled_internet: "Internet contrôlé"
    CHI_controlled_internet_desc: "Le chaos sur Internet a été contrôlé et l'environnement du réseau devient plus vert"
    CHI_Freedom_of_speech: "Liberté d'expression: Libérer les pensées"
    CHI_Freedom_of_speech_desc: "Le camarade Deng Xiaoping a proposé: \"Libérer l'esprit, utiliser nos cerveaux, rechercher la vérité à partir des faits, s'unir en un seul et regarder vers l'avant, tout d'abord, c'est libérer l'esprit. Seulement lorsque l'esprit est libéré pouvons-nous utiliser correctement le marxisme-léninisme et la pensée Mao Zedong comme notre guide pour résoudre les problèmes laissés par le passé, résoudre une série de nouveaux problèmes qui ont émergé, réformer correctement les relations de production et la superstructure qui ne sont pas compatibles avec le développement rapide des forces productives, et déterminer le chemin, les principes, les méthodes et les mesures spécifiques pour réaliser les quatre modernisations en fonction de mes conditions réelles du pays.\" Depuis la réforme et l'ouverture, la société est devenue de plus en plus réceptive aux nouvelles choses, et les gens se sont habitués à accepter tout changement rapide et toute déclaration non conventionnelle."
    CHI_people_oriented: "Concept de développement axé sur les personnes"
    CHI_people_oriented_desc: "Le Secrétaire Général Hu Jintao a souligné la nécessité de \"s'en tenir à une approche axée sur les personnes, établir un concept de développement complet, coordonné et durable, et promouvoir le développement complet de l'économie, de la société et des personnes\""
    CHI_scientific_outlook_on_development: "Perspective scientifique sur le développement"
    CHI_scientific_outlook_on_development_desc: "Le premier principe de la perspective scientifique sur le développement est le développement. Son noyau est axé sur les personnes. Son exigence de base est un développement complet, coordonné et durable. Sa méthode fondamentale est de prendre en compte tous les facteurs. La perspective scientifique sur le développement est l'héritage et le développement des idées importantes sur le développement des trois générations de la direction centrale du Parti. C'est une incarnation concentrée de la vision du monde et de la méthodologie marxistes sur le développement. C'est une théorie scientifique qui est à la fois en accord avec le marxisme-léninisme, la pensée Mao Zedong, la théorie Deng Xiaoping et la pensée importante des \"Trois Représentations\" et qui est en phase avec les temps. C'est un principe directeur important pour le développement économique et social de mon pays, une pensée stratégique majeure qui doit être maintenue et mise en œuvre dans le développement du socialisme à caractéristiques chinoises, et un soin chaleureux que le Secrétaire Général Hu Jintao a laissé au peuple chinois."
    CHI_fiscal: "Politique socio-économique chinoise"
    CHI_fiscal_desc: "La Chine est une société avec une énorme population. Toute petite variable finira par s'agréger en un énorme effet social. Les politiques sociales et économiques doivent être formulées et mises en œuvre avec prudence."
    CHI_Socialist_Market_Economy: "Économie de marché socialiste"
    CHI_Socialist_Market_Economy_desc: "L'économie de marché socialiste est une économie de marché combinée au système social socialiste de base, reflétant la nature fondamentale du socialisme. C'est un système économique qui permet au marché de jouer un rôle décisif dans l'allocation des ressources sous le contrôle macroéconomique de l'État socialiste. Il permet aux activités économiques de suivre les exigences de la loi de la valeur et de s'adapter aux changements de l'offre et de la demande. Il alloue les ressources aux liens les plus efficaces à travers les leviers des prix et les mécanismes de concurrence, et permet aux entreprises de mettre en œuvre la survie du plus apte. Il utilise les caractéristiques du marché d'être sensible à divers signaux économiques pour promouvoir la coordination rapide de la production et de la demande. La théorie de l'économie de marché socialiste est un composant hautement innovant du système théorique de Deng Xiaoping et une révision de la théorie économique traditionnelle. Sur la base de cette théorie, le gouvernement chinois a déterminé l'objectif de réforme d'établir un système d'économie de marché et a mené une exploration sans précédent dans l'histoire de la construction nationale de la Chine."
    State_Grid_Corporation_idea: "Réseau d'État de Chine"
    State_Grid_Corporation_idea_desc: "Construire un Internet de l'énergie, assurer la sécurité énergétique nationale et servir la meilleure vie du peuple"
    HKG_international_financial_center: "Centre financier international de Hong Kong"
    HKG_international_financial_center_desc: "Hong Kong est connue comme le \"New York-Londres-Hong Kong\" avec New York et Londres. C'est le troisième plus grand centre financier du monde, un important centre de commerce et de transport international, et un centre international d'innovation et de technologie."
    CHI_PLA_stationed_in_Hongkong: "Armée populaire de libération chinoise stationnée à Hong Kong"
    CHI_PLA_stationed_in_Hongkong_desc: "Conformément à la loi de la République populaire de Chine sur la garnison de la Région administrative spéciale de Hong Kong, la garnison de l'APL à Hong Kong exerce quatre fonctions de défense: premièrement, se prémunir et résister à l'agression et assurer la sécurité de la Région administrative spéciale de Hong Kong; deuxièmement, exécuter des fonctions de défense; troisièmement, gérer les installations militaires; et quatrièmement, traiter des affaires militaires étrangères pertinentes."
    4trillion_investment_effect: "Impact de l'investissement de 4 billions"
    4trillion_investment_effect_desc: "Mon pays a injecté une quantité massive de fonds allant jusqu'à 4 billions de RMB dans divers domaines, ce qui apportera de nombreux impacts économiques."
    HKZM_Bridge: "Pont Hong Kong-Zhuhai-Macao"
    HKZM_Bridge_desc: "Le pont Hong Kong-Zhuhai-Macao relie Hong Kong, Zhuhai et Macao, offrant des conditions de transport très pratiques"
    GBA_effect: "Grande zone de la baie de Hong Kong-Zhuhai-Macao"
    GBA_effect_desc: "La construction de la grande zone de la baie de Hong Kong-Zhuhai-Macao a apporté d'énormes opportunités de développement à Hong Kong et Macao"
    CHI_gangland_2: "Les forces du mal se cachent"
    CHI_gangland_2_desc: "Les forces du mal se cachent dans l'ombre, attendant leur chance."
    CHI_NSWT_centralline: "Construction de la route centrale du projet de transfert d'eau du sud vers le nord"
    CHI_NSWT_centralline_desc: "Le projet de transfert d'eau du sud vers le nord est un projet d'une portée considérable"
    CHI_monetary_policy: "Politique monétaire chinoise"
    CHI_monetary_policy_desc: "Outil pratique"
    thirteenth_five_year_plan: "Treizième plan quinquennal"
    twelfth_five_year_plan: "Douzième plan quinquennal"
    made_in_china: "Fabriqué en Chine"
    made_in_china_desc: "Dans le passé, aux yeux des étrangers, le marché chinois a longtemps donné l'impression d'être une \"grande usine\" qui produit et transforme des produits pour les entreprises mondiales. Divers produits avec l'étiquette \"Fabriqué en Chine\" vont d'ici vers les marchés étrangers, mais il n'y a presque rien avec une créativité indépendante et des avantages de premier plan. Mais maintenant, cette situation a commencé à changer. Nous pouvons fièrement dire que \"Fabriqué en Chine\" est synonyme de haute qualité et de bas prix."
    made_in_china_pro: "Fabrication intelligente en Chine"
    made_in_china_pro_desc: "En développant des technologies de production avancées, en établissant un système industriel complet et en adoptant des méthodes de production sans pilote efficaces, nous réaliserons un miracle industriel dans le monde. \"Fabrication intelligente en Chine\" sera la force motrice de la prochaine révolution de la productivité."
    Asian_Infrastructure_Investment_Bank_chairman: "Président du Conseil des gouverneurs de la Banque asiatique d'investissement dans les infrastructures"
    Asian_Infrastructure_Investment_Bank_chairman_desc: "Les frontières sont divisées par les montagnes et les rivières; les régions éloignées et désolées ont des lois et des politiques différentes de celles des Han et des Xia. Par conséquent, les rois du passé ont gouverné le pays et gagné les peuples lointains. Le principe était de les garder sous contrôle, pas de les faire vassaux. Il a recherché et rapporté, louant le succès de la dynastie Xia; il a traduit à nouveau, louant la stratégie à long terme de l'État Zhou. Par conséquent, il a pacifié le pays et répondu aux besoins de l'époque. Il a envoyé des messagers pour exprimer sa bonne volonté, calmer le chaos et apaiser le peuple. C'est ce qui s'est passé. Le monde connaît clairement mon intention. Toutes les directions viennent payer tribut, et toutes les nations viennent payer tribut."
    Asian_Infrastructure_Investment_Bank_member: "Membre de la Banque asiatique d'investissement dans les infrastructures"
    Asian_Infrastructure_Investment_Bank_member_desc: "L'économie du pays se développe rapidement sous le plan d'investissement massif de la Chine"
    CHI_coal_idea: "économie basée sur le charbon"
    CHI_coal_idea_desc: "Le charbon brûle dans les centrales thermiques, se transformant en énergie et en fumée noire."
    CHI_renewable_energy_idea: "Énergie renouvelable en Chine"
    CHI_renewable_energy_idea_desc: "La Chine est le plus grand producteur mondial d'installations d'énergie renouvelable"
    CHI_renewable_energy_idea_2: "Chine verte"
    CHI_renewable_energy_idea_2_desc: "La Chine est devenue le plus grand producteur et utilisateur d'énergie renouvelable au monde"
    CHI_Alipay_idea: "Paiement numérique"
    CHI_Alipay_idea_desc: "La Chine est le plus grand utilisateur de paiements numériques mobiles au monde"
    CHI_rump_of_Separatism: "Vestiges du séparatisme"
    CHI_rump_of_Separatism_desc: "Les vestiges du séparatisme complotent un retour dans certains coins."
    CHI_universal_Nepotism: "Népotisme universel"
    CHI_universal_Nepotism_desc: "Invitez l'empereur à vous récompenser de l'ancien Longyang, n'ayez pas honte d'être un fonctionnaire avec du népotisme"
    APEC: "Coopération économique Asie-Pacifique"
    APEC_desc: "L'organisation a joué un rôle irremplaçable dans la promotion du commerce et de l'investissement libéralisés dans la région et le renforcement de la coopération économique et technique entre les membres. C'est un forum pour promouvoir la croissance économique, la coopération, le commerce et l'investissement entre les régions de la région Asie-Pacifique."
    CHI_SRAS_idea: "Virus SRAS"
    CHI_SRAS_idea_desc: "Le nouveau virus se propage rapidement"
    CHI_labour_law_2: "La loi sur le travail a peu d'attrait"
    CHI_labour_law_2_desc: "En raison de la propagande du gouvernement, les lois sur le travail ont commencé à attirer l'attention des gens et ont imposé certaines restrictions sur les relations travail-capital. Cependant, aucun système pratique n'a été établi pour assurer la mise en œuvre des lois sur le travail."
    CHI_labour_law_3: "Loi sur le travail avec un caractère corporatiste"
    CHI_labour_law_3_desc: "La loi sur le travail est utilisée pour protéger les droits et intérêts du travail et du capital, tout en interdisant strictement les comportements excessifs des deux parties. Cette loi sur le travail corporatiste assure la stabilité du développement social et protège les droits et intérêts des travailleurs dans une certaine mesure, mais nie fondamentalement la possibilité et la légitimité de la lutte des classes."
    CHI_increase_social_cost_temporary: "Augmentation temporaire des dépenses de sécurité sociale"
    CHI_strong_our_government: "Renforcer notre gouvernement"
    CHI_modify_uighur_threat: "Menace séparatiste"
    CHI_modify_uighur_opinion: "Opinion ouïghoure"
    CHI_Protecting_workers_idea: "Protéger les travailleurs"
    CHI_Protecting_workers_idea_desc: "Protéger les droits des travailleurs"
    CHI_Comfort_entrepreneurs_idea: "Réconforter les entrepreneurs"
    CHI_Comfort_entrepreneurs_idea_desc: "Réconforter les entrepreneurs"
    CHI_Trade_Unions_idea: "Établir un syndicat national"
    CHI_Trade_Unions_idea_desc: "Établir un syndicat national peut efficacement protéger les droits des travailleurs et les superviser pour les empêcher de prendre des actions radicales."
    CHI_Commission_of_Commerce_idea: "L'idée de la Commission du commerce est en train de se former"
    CHI_Commission_of_Commerce_idea_desc: "Établir des comités de commerce locaux peut maximiser la vitalité des entités du marché, coordonner les liens entre le gouvernement et les entreprises, et contrôler le comportement des entrepreneurs."
    CHI_Supporting_foreign_countries_AIIB: "Soutenir le développement des pays étrangers de l'AIIB"
    CHI_Supporting_foreign_countries_AIIB_desc: "Nous mobilisons des ressources pour aider les pays sous-développés."
    CHI_Provide_loans_AIIB: "Fournir des prêts à faible taux d'intérêt aux membres de l'AIIB"
    CHI_Provide_loans_AIIB_desc: "Nous fournissons des prêts de développement aux pays sous-développés."
    CHI_China_supports_AIIB: "Aide au développement de l'AIIB"
    CHI_China_supports_AIIB_desc: "La Chine soutient le développement du pays par le biais de l'AIIB"
    CHI_Low_interest_loans_AIIB: "Prêts à faible taux d'intérêt de l'AIIB"
    CHI_Low_interest_loans_AIIB_desc: "La Chine fournit des prêts à faible taux d'intérêt à ce pays par le biais de l'AIIB pour le développement."
    sanction_from_p5: "Sanctions du Conseil de sécurité des Nations Unies"
    sanction_from_p5_desc: "Le Conseil de sécurité des Nations Unies considère que nos actions actuelles sont illégales, nous sommes donc sanctionnés."
    Success_Keeping_the_Peace: "Maintien de la paix réussi"
    Success_Keeping_the_Peace_desc: "Ce pays a récemment réussi à maintenir la stabilité régionale et la paix mondiale."
    chastity_paifang_2: "Chine"
    chastity_paifang_2_desc: "L'arbre veut être immobile, mais le vent ne s'arrête pas. La poussière ne partira pas sans balai. L'arme de la critique ne peut pas remplacer la critique des armes. L'armée chinoise ne tremblera plus derrière le mur frontalier\n\nLa Chine maintiendra la paix mondiale à tout prix, y compris §Rl'utilisation de la violence§!"
    chinese_rule_all_the_land: "Grande Unification"
    chinese_rule_all_the_land_desc: ""
    CHI_wind_farms: "Parcs éoliens"
    CHI_offshore_wind_farms: "Parcs éoliens offshore"
    CHI_solar_farms: "Fermes solaires"
    CHI_solar_panels: "Panneaux solaires"
    CHI_frontier: "Désertification et érosion des sols"
    CHI_frontier_desc: "La région du plateau de Lœss en Chine est fortement influencée par les moussons, ce qui entraîne des précipitations concentrées. Le lœss, formé de dépôts de sable, est facilement érodé par l'eau de pluie, et l'apport de limon charrié par les rivières aggrave encore l'érosion des sols.\nLe désert de Gobi est une autre zone majeure touchée par la désertification. Actuellement, le Gobi est le désert qui progresse le plus rapidement au monde : il engloutit plus de 3 350 kilomètres carrés de terres par an et détruit de nombreux villages sur son passage. Les images actuelles montrent que le Gobi s'est étendu au point de pouvoir contenir la totalité de la Croatie."
CHI_Prosperous_Frontier: "Fronière prospère"
CHI_Special_Economic_Zones: "Zones économiques spéciales"
CHI_Special_Economic_Zones_desc: "L'établissement de zones économiques spéciales est une décision et un pas majeur pris par le Comité central du PCC et le Conseil d'État conformément à la défense de Deng Xiaoping, dans les nouvelles conditions historiques, conformément à la nouvelle tendance de développement de la situation politique et économique mondiale, et sur la base de la synthèse des expériences et des leçons nationales et étrangères, afin de promouvoir la réforme et l'ouverture de mon pays et d'accélérer la modernisation socialiste.\n\nEn mai 1980, le Comité central du PCC et le Conseil d'État ont décidé de renommer les quatre zones d'exportation spéciales de Shenzhen, Zhuhai, Shantou et Xiamen en zones économiques spéciales. En avril 1988, la zone économique spéciale de Hainan a été ajoutée."
CHI_capital: "Capitale"
CHI_capital_desc: "La pivoine dans la cour est sauvage et sans style, le lotus dans l'étang est pur et a peu d'émotion\nSeule la pivoine est la vraie beauté nationale, et la capitale est émue lorsque les fleurs s'épanouissent"
CHI_Pudong_New_Area: "Nouvelle zone de Pudong"
CHI_Pudong_New_Area_desc: "Le développement et l'ouverture de Pudong ont placé Shanghai sur le chemin de la transformation globale et ont également insufflé une nouvelle dynamique à la réforme et à l'ouverture de l'ensemble du delta du Yangtsé, du bassin du Yangtsé, et même de tout le pays."
CHI_ancient_capital_of_thirteen_dynasties: "Ancienne capitale de treize dynasties"
CHI_ancient_capital_of_thirteen_dynasties_desc: "Ce soir, la lune est au-dessus de Fuzhou, je suis seul dans mon boudoir à la voir. Je me sens désolé pour mes enfants, qui n'ont pas encore appris à se souvenir de Chang'an."
CHI_hometown_of_Confucius: "Pays natal de Confucius et Mencius"
CHI_hometown_of_Confucius_desc: "N'est-il pas agréable d'apprendre et de pratiquer de temps en temps ?\nN'est-il pas agréable d'avoir des amis venant de loin ?\nN'est-il pas un gentilhomme de ne pas être fâché quand les gens ne le connaissent pas ?"
CHI_Central_World: "Monde central"
CHI_Central_World_desc: "La lune brille derrière les grands arbres, la longue rivière s'enfonce dans le ciel du matin\nLa longue route vers Luoyang, quand nous reverrons-nous ?"
CHI_misty_rain_gusu: "Pluie brumeuse à Gusu"
CHI_misty_rain_gusu_desc: "Des milliers de miles de chants de rossignols, verts et rouges, les villages aquatiques et les villes montagneuses, les bannières de vin flottant dans le vent\nQuatre cent quatre-vingts temples des dynasties du Sud, de nombreuses tours et pavillons dans la brume et la pluie"
CHI_old_Shanghai: "Dix miles de terre étrangère"
CHI_old_Shanghai_desc: "Toute l'armée de Wu est sur le bord de la grande mer, à cent milles de la mer de Shanghai Du\nLes créatures marines grouillent ensemble, et les monstres de l'eau rivalisent de s'y glisser."
CHI_qiantang_fragrans_lotus: "Qiantang Fragrans Lotus"
CHI_qiantang_fragrans_lotus_desc: "Un point de vue pittoresque dans le sud-est, la capitale des Trois Wus, Qiantang est prospère depuis les temps anciens\nDes saules enfumés et des ponts peints, des rideaux de vent et des rideaux verts, et des centaines de milliers de maisons"
CHI_Medicine_Capital: "Huifeng Wanyun"
CHI_Medicine_Capital_desc: "La porte du ciel est cassée et la rivière Chu s'ouvre. Les eaux claires coulent vers l'est et tournent ici. Les montagnes vertes des deux côtés se font face, et une voile isolée vient du soleil."
CHI_Mountain_Sea_Gallery: "Galerie de la montagne et de la mer"
CHI_Mountain_Sea_Gallery_desc: "Des centaines de collines vertes et une rivière, des dizaines de milliers de maisons, la route fait le tour du Nantai\nLes feuilles de banian remplissent la rivière, les aigrettes volent, les rideaux sont à moitié roulés dans la pluie du soir"
CHI_south_of_the_Five_Ridges_Pearl: "Perle du Lingnan"
CHI_south_of_the_Five_Ridges_Pearl_desc: "Le niveau d'eau dans le banc de sable sombre a baissé et le sable vide a monté. Le banc de sable est à des milliers de kilomètres de Qin et Wu.\nLes saules au nord du Yangtsé ont été brisés par le cheval, et les fleurs au sud du Lingnan ont fleuri dans le bateau.\nLes chants d'adieu sont interminables comme pour garder les invités, et le rêve de rentrer chez soi est comme être arrivé.\nL'oiseau de montagne chante mais personne n'est encore réveillé, et la lune du printemps est à mi-chemin à travers l'horizon."
CHI_Guilin_Scenery: "Paysage de Guilin"
CHI_Guilin_Scenery_desc: "Le paysage de Guilin est le meilleur au monde, avec une scène couleur jade et bleue."
CHI_magical_land_of_South_Sea: "Terre magique de la mer du Sud"
CHI_magical_land_of_South_Sea_desc: "Il y a une terre magique dans la mer du Sud\nLa distance et la carte n'ont pas de fin, les veines de la terre sont connectées\nLes montagnes se lèvent pour former Kunlun, et l'eau descend pour former la mer Bohai\nL'air est direct et concentré, et la puissance n'est pas divisée et suffisante"
CHI_South_Colourful_Clouds: "Nuages colorés du sud"
CHI_South_Colourful_Clouds_desc: "Yunnan a plus de ruisseaux, des graviers rouges sans boue\nMédicament vendu par Baxian, les branches sont pleines de chants d'oiseaux Yue"
CHI_land_of_abundance: "Terre d'abondance"
CHI_land_of_abundance_desc: "Yizhou est une terre de ressources naturelles et de champs fertiles. C'est une terre d'abondance. L'empereur Gaozu a construit son empire sur elle."
CHI_majestic_mountain_city: "Ville montagneuse imposante"
CHI_majestic_mountain_city_desc: "La lune sur le mont Emei est à moitié pleine en automne, son ombre tombe sur le Pingqiang Jiang.\nQuitter Qingxi pour les Trois Gorges la nuit, je pense à toi mais tu n'es pas à Yuzhou"
CHI_Natural_bonsai: "L'endroit où les quatre passages de la rivière Chishui ont été faits"
CHI_Natural_bonsai_desc: "Le vent d'ouest est fort, les oies appellent dans le ciel, la lune glacée du matin\nLune glacée du matin, le bruit des sabots des chevaux est cassé, le bruit des trompettes est étouffé\nLa route longue et difficile est aussi dure que le fer, mais maintenant nous recommençons\nRecommencer, les montagnes sont comme la mer, le coucher de soleil est comme du sang"
CHI_lotus_xiaoxiang: "Lotus Xiaoxiang"
CHI_lotus_xiaoxiang_desc: "Seul dans l'automne froid, la rivière Xiang coule vers le nord, à la tête de l'île Orange\nRegarder les montagnes devenir rouges, les forêts teintes ; la rivière est claire et bleue, des centaines de bateaux rivalisent pour le courant\nLes aigles volent dans le ciel, les poissons nagent dans les bas-fonds, toutes sortes de créatures rivalisent pour la liberté dans le ciel givré\nSentir l'immensité, demander à la vaste terre, qui est responsable des hauts et des bas ?\n\nAmener des centaines d'amis à voyager\nSe souvenir du passé, les années glorieuses\nComme des écoliers, dans la fleur de l'âge ; les érudits sont pleins de vigueur et de vitalité\nIndiquant les montagnes et les rivières, inspirant des mots, méprisant le marquis du passé\nVous souvenez-vous, quand vous étiez au milieu du ruisseau, les vagues arrêtaient le bateau volant ?"
CHI_Thoroughfare_to_Nine_Provinces: "Artère vers neuf provinces"
CHI_Thoroughfare_to_Nine_Provinces_desc: "Les anciens s'en sont allés sur la grue jaune, ne laissant que la tour de la grue jaune\nLa grue jaune est partie et jamais revenue, des nuages blancs ont dérivé dans le ciel pendant des milliers d'années\nLa rivière claire révèle les arbres de Hanyang, l'herbe parfumée couvre l'île Perroquet\nOù est ma ville natale au crépuscule ? La brume de la rivière me rend triste"
CHI_ancient_Yuzhang_county: "Ancien comté de Yuzhang"
CHI_ancient_Yuzhang_county_desc: "Comté Yuzhang, l'ancien comté, Hongdu, la nouvelle capitale\nLes étoiles se partagent Yi et Zhen, la terre relie Heng et Lu\nEntouré par les trois rivières et les cinq lacs, contrôlant les barbares et Jing et attirant Ou et Yue\nLes ressources naturelles sont riches et la lumière du dragon brille sur les ruines de Niu et Dou\nLes gens sont exceptionnels et la terre est bénie, Xu Ru dort sur le lit de Chen Fan\nL'état héroïque est enveloppé de brouillard, et les talents exceptionnels sont comme des étoiles"
CHI_situated_at_foot_of_hill_and_beside_river: "Montagnes et rivières à l'extérieur et à l'intérieur"
CHI_situated_at_foot_of_hill_and_beside_river_desc: "Les bâtiments imposants et les grandes vues se dressent les uns en face des autres, et les montagnes et les rivières sont d'un côté\nLes lumières dans le petit marché sont allumées, et je suis tenté de rentrer chez moi. Je mets des vêtements légers et me tiens devant la porte au vent du soir."
CHI_Land_of_Lament_Songs: "Terre des lamentations de Yan et Zhao"
CHI_Land_of_Lament_Songs_desc: "Le vent siffle et la rivière Yi est froide\nLe guerrier ne reviendra jamais une fois parti"
CHI_Nine_rivers_return_to_sea: "Neuf rivières retournent à la mer"
CHI_Nine_rivers_return_to_sea_desc: "Le Fleuve Jaune divise la terre, Feiguan connecte Tianjin\nUn regard sur l'héritage littéraire ancien, mille années de solennité comme un dieu"
CHI_Republic_eldest_son: "Fils aîné de la République"
CHI_Republic_eldest_son_desc: "Nos visages brillent de rouge\nNotre sueur coule\nPourquoi?\nPour la libération!\nPourquoi?\nPour la libération!\nHé! Hé!\nHé! Hé!\nPour la libération complète de toute la Chine!"
CHI_Northern_Spring_City: "Ville du printemps du Nord"
CHI_Northern_Spring_City_desc: "Jilin est le vrai Jilin, la montagne Changbai est luxuriante et escarpée\nC'était autrefois une ville, mais ce n'est pas la même qu'à présent\nBinqi est loin, et les nuages et le brouillard sont profonds\nJe me souviens toujours du ciel, et j'admire les aspirations de Ming Yi"
CHI_Tracks_In_Snowy_Forest: "Forêt enneigée"
CHI_Tracks_In_Snowy_Forest_desc: "En volant le matin, le soleil se lève et le ciel s'éclaircit, et le cheval s'arrête à midi.\nLe cœur de l'invité est aussi anxieux que l'eau, et la voix des gens peut être entendue de l'autre côté de la rivière\nLa pluie ajoute de l'air frais, et le vent crée des ondulations\nRentrer au milieu du ruisseau, le bateau est stable, et j'attends avec impatience le groupe à venir"
CHI_Hanhai_bright_pearl: "Perle brillante de Hanhai"
CHI_Hanhai_bright_pearl_desc: "Chi Le Chuan, sous les montagnes Yin\nLe ciel est comme un dôme, couvrant les quatre champs\nLe ciel est vaste, les champs sont sans limites, le vent souffle l'herbe basse et vous pouvez voir du bétail et des moutons"
CHI_Jiangnan_beyond_Great_Wall: "Au-delà de la Grande Muraille"
CHI_Jiangnan_beyond_Great_Wall_desc: "Le ciel est haut et les nuages sont légers, je peux voir les oies voler vers le sud\nSi vous n'êtes pas allé à la Grande Muraille, vous n'êtes pas un vrai homme, j'ai voyagé 20 000 kilomètres\nAu sommet de la montagne Liupan, le drapeau rouge flotte dans le vent d'ouest\nAujourd'hui, j'ai la longue frange à la main, quand vais-je attacher le dragon bleu ?"
CHI_gansu_impregnable_pass: "Le col imprenable de la montagne Longshan"
CHI_gansu_impregnable_pass_desc: "Le fleuve Jaune coule loin parmi les nuages blancs, une seule ville se dresse sur une montagne de dix mille pieds\nPourquoi la flûte Qiang devrait-elle reprocher aux saules, le vent de printemps n'atteint pas le col de Yumen"
CHI_Silk_Road_Pass: "Col de la route de la soie à l'ouest"
CHI_Silk_Road_Pass_desc: "Le jour, je grimpe sur la montagne pour regarder le feu de signalisation, et le soir, je fais boire mon cheval près de la rivière Jiaohe.\nLes voyageurs se sont battus dans le vent et le sable sombres, et la princesse a joué de la pipa avec tristesse.\nIl n'y a pas de villes dans les vastes nuages sauvages, et la pluie et la neige sont tombées dans le désert.\nLes oies sauvages ont volé chaque nuit avec des cris lugubres, et les enfants Hu ont versé des larmes.\nJ'ai entendu dire que Yumen est encore bloqué, donc je devrais suivre la voiture légère avec ma vie.\nChaque année, les ossements des soldats étaient enterrés dans la nature, et seuls les ramboutan étaient vus entrer dans la famille Han."
CHI_waterhead: "La source de toute l'eau"
CHI_waterhead_desc: "En automne à l'extrême ouest, les oiseaux blancs volent, je m'appuie sur la balustrade pour voir la source de la rivière\nPendant longtemps, il n'y a pas eu d'ombre du radeau à travers la voie lactée, et je peux voir Huodun dans le ciel\nLes vents et les vagues du Qinghai ont empilé des rochers, et Yumen a la moitié de la Chine centrale\nKunlun était la route vers l'ouest, et j'envoie un message à Tuyuhun devant la montagne"
CHI_roof_of_the_world: "Toit du monde"
CHI_roof_of_the_world_desc: "L'essence pure forme des formes étranges, le ciel clair est le bord\nLes pics de jade embrassent l'air limpide, les pics de lotus épanouissent des fleurs blanches\nLa moitié du rocher est couverte de neige, le haut point clair avec brume et brume\nL'hôtel est en face à l'aube et au crépuscule, et c'est comme un paradis"
CHI_Sea_Pearl: "Perle de la Mer"
CHI_Sea_Pearl_desc: "Quand j'étais enfant, la nostalgie était un petit timbre. J'étais de ce côté, et ma mère était de l'autre côté. Quand j'ai grandi, la nostalgie était un billet de bateau étroit. J'étais de ce côté, et ma mariée était de l'autre côté. Plus tard, la nostalgie était un tombe peu profonde. J'étais dehors, et ma mère était dedans. Maintenant, la nostalgie est un détroit peu profond. Je suis de ce côté, et le continent est de l'autre côté."
CHI_Pearl_of_the_East: "Perle de l'Est"
CHI_Pearl_of_the_East_desc: "Pour des choses qui changent rapidement\nEt pour des choses qui ne changent jamais\nL'esprit du Lion Rock se propage au loin"
CHI_land_oyster_bank: "Terre de la banque d'huîtres"
CHI_land_oyster_bank_desc: "Savez-vous que \"Magang\" n'est pas mon vrai nom?\nCela fait trop longtemps que je suis loin de vos bras, maman!\nMais ils ont pris mon corps\nVous gardez toujours mon âme\n\nMaman biologique dont je ne me suis jamais souvenu au cours des trois cents dernières années!\nAppelez-moi par mon surnom\nAppelez-moi \"Macao\"!\nMaman, je veux revenir!\nMaman!"
CHI_Shortage_of_water_resources: "Pénurie de ressources en eau"
CHI_Shortage_of_water_resources_desc: "Alors que le sud de la Chine a d'abondantes ressources en eau, les pénuries d'eau sont courantes dans le nord aride. La pollution due à l'industrialisation rapide de la Chine a également entraîné une contamination de l'eau, qui existe et exacerbe les pénuries d'eau en Chine."
modifier_state_production_speed_agriculture_district_factor: "Vitesse de construction du district agricole commercial"
CHI_ETHOS: "Pensée sociale chinoise"
CHI_ETHOS_desc: "Différents groupes de personnes auront des impacts sociaux différents en fonction de leur niveau de soutien\n\n§YCette idée montre l'influence de $CHI_left_Name$, $CHI_political_apathy_Name$ et $CHI_right_Name$§!"
CHI_PLA_in_the_New_Era: "Armée de libération du peuple chinois"
CHI_Bobcat_all_terrain_vehicle: "Véhicule tout terrain Bobcat"
CHI_Bobcat_all_terrain_vehicle_desc: "Miaou miaou miaou"
Consumer_goods_consumption: "Consommation de biens de consommation\n\n[?Consumergoods_consumption|R]"
Consumer_goods_consumption_desc: "[?Consumergoods_consumption|R]"
CHI_Communist_Party_of_China: "Parti communiste chinois"
CHI_Communist_Party_of_China_desc: "Le Parti communiste chinois est l'avant-garde de la classe ouvrière chinoise, l'avant-garde du peuple chinois et de la nation chinoise, et le noyau de direction pour la cause du socialisme aux caractéristiques chinoises. Il représente les exigences du développement des forces productives avancées de la Chine, représente la direction des progrès de la culture avancée chinoise, et représente les intérêts fondamentaux de la grande majorité du peuple chinois. L'idéal suprême et le but ultime du Parti communiste chinois est de réaliser le communisme. La tâche centrale du Parti communiste chinois est d'unir et de diriger le peuple de toutes les ethnies du pays pour construire pleinement un pays socialiste moderne, atteindre le deuxième objectif séculaire et promouvoir de manière complète la grande renaissance de la nation chinoise avec la modernisation à la chinoise. \n\nDepuis la fondation de la République populaire de Chine en 1949, le Parti communiste chinois a été le seul parti au pouvoir en Chine."
CHI_Supercomputer: "Supercalculateur chinois"
CHI_Supercomputer_desc: "Dans le passé, Baoxishi a d'abord dessiné les Huit Trigrammes pour comprendre les vertus des dieux et classifier les émotions de toutes choses. Il a également créé la Technique des Neuf-Neuf pour correspondre aux changements des Six Yao."
CHI_the_arms_export_idea: "Exportation d'armes"
CHI_the_arms_export_idea_desc: "La Chine est l'un des plus grands exportateurs d'armes et producteurs militaires du monde. Le pays est presque entièrement autosuffisant en production militaire et est capable d'exporter ce surplus à d'autres pays autour du monde."
CHI_nanshuibeidiao_project: "Projet de transfert d'eau du sud au nord"
CHI_nanshuibeidiao_project_desc: "Cette province a été libérée de la pénurie d'eau en raison de l'achèvement du projet de transfert d'eau du sud au nord."
CHI_OGAS_state: "OGAS"
CHI_OGAS_state_desc: "Cette province est connectée au système national d'automatisation."
American_economic_hegemony: "Hégémonie économique américaine"
American_economic_hegemony_desc: "Le moyen de réaliser l'hégémonie économique américaine est l'hégémonie du dollar américain. L'hégémonie du dollar américain est le reflet de l'hégémonie mondiale des États-Unis dans le domaine financier, et elle fournit également un soutien financier important à l'hégémonie mondiale des États-Unis. Par conséquent, maintenir l'hégémonie du dollar américain est de maintenir l'hégémonie mondiale des États-Unis. Pour atteindre cet objectif, les États-Unis n'hésitent pas à utiliser tous les moyens tels que les conflits armés, la \"guerre financière\", la \"guerre commerciale\", et n'hésitent pas à attaquer n'importe quel pays, y compris leurs propres alliés. \n\nEn tant que seule superpuissance politique, économique et militaire, les États-Unis disposent d'énormes actifs à l'étranger, et tous les pays du monde sont devenus des paquets d'approvisionnement en sang pour les États-Unis à des degrés divers. Les États-Unis disposent d'un nombre énorme d'usines sous contrat à l'étranger pour soutenir le développement rapide de leur économie, de sorte qu'il est impossible pour la capacité industrielle d'un autre pays de véritablement dépasser les États-Unis, à moins que l'hégémonie triple des États-Unis en politique, en économie et en militaire ne soit mise fin..."
Economically_advanced_countries: "Pays économiquement avancés"
Economically_advanced_countries_desc: "Ce pays peut bénéficier de plus d'avantages de la mondialisation économique, tels que l'externalisation bon marché de la main-d'œuvre internationale ou les importations bon marché de biens de consommation, en raison de son économie intrinsèquement développée ou de sa position supérieure dans le système mondial dominé par les États-Unis. Mais en fin de compte, ce pays n'est qu'un bétail élevé par les États-Unis, fortement dépendant de l'ordre mondial dominé par les États-Unis, et les États-Unis peuvent encore extraire des avantages de ces pays. \n\n§RSi l'influence mondiale de la Chine est plus élevée que celle des États-Unis, ce modificateur sera invalide !§!"
Economic_dependency_countries: "Pays dépendants économiquement"
Economic_dependency_countries_desc: "Ce pays a en fait montré sa soumission au système économique mondial dominé par les États-Unis et a tenté de s'intégrer dans ce système. Il utilise sa main-d'œuvre importante et bon marché pour continuer à exporter des biens de consommation bon marché vers les pays développés en échange de plus d'investissements internationaux et de croissance économique expansive, mais le prix est la difficulté de solidification et de mise à niveau industrielles, et la perte de l'indépendance nationale et du poids du discours international. \n\n§RSi l'influence mondiale de la Chine est plus élevée que celle des États-Unis, ce modificateur sera invalide !§!"
Economic_resources_dependency_countries: "Pays dépendants des ressources économiques"
Economic_resources_dependency_countries_desc: "Ce pays a en fait montré sa soumission au système économique mondial dominé par les États-Unis et a tenté de s'intégrer dans ce système. Il utilise ses riches ressources minérales pour continuer à fournir des matières premières à bas prix aux pays développés pour l'exportation en échange de plus de commandes internationales, mais le prix est la difficulté de solidification et de mise à niveau industrielles, et la perte de l'indépendance nationale et du poids du discours international. \n\n§RSi l'influence mondiale de la Chine est plus élevée que celle des États-Unis, ce modificateur sera invalide !§!"
Confronting_the_USA_countries: "Affrontant le système international dominé par les États-Unis"
Confronting_the_USA_countries_desc: "Ce pays résiste au système mondial dominé par les États-Unis et a été soumis aux sanctions et à la suppression des États-Unis, ce qui a entravé son développement économique et social, mais protégé son indépendance nationale et empêché les États-Unis d'exploiter davantage son économie domestique."
Domestic_consumption: "Consommation nationale"
Domestic_consumption_desc: "Chaque pays aura une certaine consommation basée sur sa population totale et son PIB par habitant. Qu'il s'agisse d'auto-suffisance ou d'importation de l'étranger, si l'offre ne peut pas répondre à la demande de consommation nationale, cela apportera de nombreux effets négatifs.\n---------------------------------\n\n§WDétails de la production et de la consommation :\n§Y£steel_texticon£ Acier§! :\nEn raison de §YNombre d'usines militaires§! Affecté par : [?steel_consumption_military|-=3]\nEn raison de §YNombre d'usines civiles§! Affecté par : [?steel_consumption_industrial|-=3]\n\n§Y£consumer_goods_texticon£ Biens de consommation§! :\nEn raison de §YBase de population§! Affecté par : [?good_consumption_pop|-=3]\nEn raison de §YPIB par habitant§! Affecté par : [?good_consumption_gdp|Y2 %]\nEn raison de §YProductivité nationale§! : [?good_consumption_productivity|Y2%]\nEn raison de §YTechnologie, lois, esprit national, etc.§! : [?good_consumption_multiplier_modifier_show|-=2%]\nEn raison de §YEmploi de bureau§! : [?good_consumption_office|-=3]\nEn raison de §YEmploi d'usine civile§! : [?good_consumption_civ|-=3]\nEn raison de §YTechnologie, lois, esprit national, etc.§! : [?good_consumption_add_modifier|-=3]\n\n§Y£service_texticon£Service§! : \nEn raison de §YBase de population§! : [?service_consumption_pop|-=3]\nEn raison de §YPIB par habitant§! : [? service_consumption_gdp|Y2%]\nEn raison de §YBudget médical et éducatif§! : [?service_consumption_budget|Y2%]\nEn raison de §YProductivité nationale§! : [?service_consumption_productivity|Y2%]\nEn raison de §YTechnologie, lois, esprit national, etc.§! : [?service_consumption_multiplier_modifier_show|-=2%]\nEn raison de §YEmploi de bureau§! : [?service_consumption_office|-=3]\nEn raison de §YEmploi d'usine civile§! : [?service_consumption_civ|-=3]\nEn raison de §YTechnologie, lois, esprit national, etc.§! : [?service_consumption_add_modifier|-=3 ]\n\n§Y£grain_texticon£ Nourriture§! :\nEn raison de §YBase de population§! influence : [?food_consumption_pop|-=3]\nEn raison de §YPIB par habitant§! influence : [?food_consumption_gdp|Y2%]\nEn raison de §YTechnologie, lois, esprit national, etc.§! influence : [?food_consumption_multiplier_modifier_show|-=2%]\nEn raison de §YPopulation agricole non commerciale§! influence : [?food_consumption_agriculture|-=3]\nEn raison de §YPopulation agricole commercialisée§! influence : [?food_consumption_agriculture_commercialized|-=3]\nEn raison de §YTechnologie, lois, esprit national, etc.§! influence : [?food_consumption_add_modifier|-=3]§!"
