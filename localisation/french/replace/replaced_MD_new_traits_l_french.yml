#describe#
CHI_GR_MILLENNIUM_DAWN_DESC: "§YSeule une nation qui a créé la gloire peut comprendre le sens de la revitalisation; seule une nation qui a connu la souffrance peut avoir un désir aussi profond de revitalisation§!\n\nAprès la guerre de l'opium en 1840, §Rla Chine§! est progressivement devenue une société semi-coloniale et semi-féodale. Le pays a été humilié, le peuple a souffert et la civilisation a été couverte de poussière. La nation chinoise a subi une catastrophe sans précédent. Depuis lors, réaliser la grande revitalisation de la nation chinoise est devenu le plus grand rêve du peuple chinois et de la nation chinoise. En raison de l'invasion des puissances occidentales et de la domination féodale corrompue, depuis l'époque moderne, §Rla Chine§! est tombée dans une situation arriérée et battue. , luttant dans l'abîme sombre d'une société semi-coloniale et semi-féodale, le peuple chinois est entré dans le 20e siècle avec l'humiliation de voir sa capitale occupée par l'Alliance des huit puissances. §!\n\nCependant, l'obscurité temporaire n'est pas une longue nuit sans fin. Après l'établissement de la §RRépublique populaire de Chine§! en 1949, la Chine s'est depuis débarrassée du destin d'être colonisée, et le peuple chinois n'a plus à vivre selon les visages des étrangers. Le grand leader §Rle président Mao Zedong§! a conduit des centaines de millions de Chinois à s'engager de manière indépendante et autonome sur un §Ychemin de développement qui appartient à la Chine§!, et a obtenu des résultats de construction remarquables. Ainsi, il a prouvé au monde que la Chine est un pays §Yaimant la paix§!, et que le développement ne nécessite pas l'agression et l'exploitation d'autres pays. Depuis 1978, la §Ypolitique de réforme et d'ouverture§! a permis au potentiel économique de la Chine de se développer de manière sans précédent, et la présence de la Chine sur la scène mondiale est devenue de plus en plus claire, et la voix de la Chine est devenue progressivement plus forte. Organiser les Jeux asiatiques, l'inondation du fleuve Yangtze, le retour de Hong Kong et de Macao, le grand défilé militaire du 50e anniversaire de la fondation de la République populaire de Chine...§YLe peuple chinois est entré dans le 21e siècle avec la confiance de prospérer le pays à travers l'adversité. §!\n\nRéaliser la §Ygrande revitalisation de la nation chinoise§! est le plus grand rêve de la nation chinoise à l'époque moderne. Une fois établi, le §RParti communiste chinois§! a pris la réalisation du §Rcommunisme§! comme l'idéal le plus élevé et l'objectif ultime du parti, a assumé sans relâche la mission historique de §Yréaliser la grande revitalisation de la nation chinoise§!, a uni et dirigé le peuple dans des luttes ardues, et a écrit une épopée magnifique qui a englouti les montagnes et les rivières. \n\n§YAujourd'hui, le peuple chinois est plus proche, plus confiant et plus capable d'atteindre l'objectif de la grande revitalisation de la nation chinoise qu'à tout moment de l'histoire. À l'aube du millénaire, le Parti communiste chinois et le peuple chinois sont prêts à entrer dans une nouvelle ère. §!"

MILLENNIUM_DAWN: "Aube du millénaire"
MILLENNIUM_DAWN_DESC: "Cela fait près d'une décennie depuis la fin de la guerre froide. Après l'effondrement de l'hégémonie soviétique, un nouvel ordre international a été établi. Les États-Unis se sont fermement assis sur le trône de l'hégémonie et ont profité de la prospérité économique apportée par l'économie Internet. Le monde chrétien occidental a accueilli le millénaire prospère et stable sous la bénédiction de la Bible, tandis que le monde islamique était plongé dans la pauvreté et les troubles. Le Japon, autrefois à son apogée, a lutté pour avancer après l'éclatement de la bulle. Après l'impact de la crise financière asiatique de 1997, le statut glorieux des quatre tigres asiatiques a été progressivement éclipsé par les usines rugissantes de la Chine, qui montait progressivement sur le devant de la scène mondiale. L'héritage soviétique a été divisé, et le nouveau président, qui était un ancien espion, a repris un cadavre mourant. La Corée du Nord s'est engagée sur la voie de la difficulté, tandis que l'économie de la Corée du Sud continue de croître rapidement. L'Afrique est prise dans le chaos et la pauvreté. Le monde est dans une nouvelle ère de coexistence de troubles et de paix."


#news#
chi_millennium.1: "Sommet du millénaire des Nations Unies"
chi_millennium.1.t: "Le Sommet du millénaire des Nations Unies est organisé"
chi_millennium.1.d: "Du 6 au 8 septembre 2000, le Sommet du millénaire des Nations Unies s'est tenu au siège des Nations Unies à New York. Le thème de la réunion était \"Le rôle des Nations Unies au 21e siècle\". On dit que cette réunion a été proposée par la Chine. Au cours des trois jours de la réunion, les chefs d'État et de gouvernement de divers pays ont échangé des vues sur le thème \"Le rôle des Nations Unies au 21e siècle\" sur des questions telles que le maintien de la paix mondiale, la promotion du développement, l'établissement d'un nouvel ordre politique et économique international, et le renforcement du rôle des Nations Unies dans la nouvelle situation. Le président chinois Jiang Zemin a assisté à la réunion et a prononcé un discours important à la réunion, et a expliqué la position de la Chine sur une série de questions telles que le maintien des buts et principes de la Charte des Nations Unies.\n\nLa réunion a souligné: \"Aucun pays ou organisation ne peut résoudre tous ces problèmes seul. Cependant, si le gouvernement et les citoyens d'un pays ne se consacrent pas à cette tâche de tout cœur, ils ne devraient pas supposer que d'autres résoudront ces problèmes pour lui. Construire un 21e siècle plus sûr et plus juste que le 20e siècle est un travail qui nécessite que chaque pays et chaque personne fassent des efforts fermes pour bien faire. \""
chi_millennium.1.a: "Bien dit"
chi_millennium.1.b: "Le président Jiang a volé la vedette à la réunion!"

