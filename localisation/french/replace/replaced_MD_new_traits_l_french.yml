chi_encourage_innovation: "Encourager l'innovation"
chi_encourage_innovation_desc: "Grâce à une série de mesures encourageantes, nous pouvons inspirer certaines personnes qui veulent changer à contribuer à la société."
chi_acceptance_left_in_government: "Intégration de la Gauche au Gouvernement"
chi_acceptance_left_in_government_desc: "Le Parti communiste chinois a longtemps été l'unique force politique au pouvoir. Cependant, avec l'évolution des temps, il est peut-être temps d'intégrer d'autres factions de gauche au sein du gouvernement pour une approche plus inclusive de la gouvernance."
chi_acceptance_right_in_government: "Intégration de la Droite au Gouvernement"
chi_acceptance_right_in_government_desc: "Alors que la Chine évolue, l'idée d'intégrer des éléments de droite au gouvernement émerge. Cela pourrait apporter de nouvelles perspectives économiques et sociales, mais nécessiterait de naviguer entre des idéologies potentiellement conflictuelles."
chi_acceptance_political_apathy_in_government: "Intégration des Peuples Politiquement Apathiques au Gouvernement"
chi_acceptance_political_apathy_in_government_desc: "Les Peuples Politiquement Apathiques représentent une portion significative de la population chinoise. Leur intégration au gouvernement pourrait symboliser une tentative d'élargir la base de soutien et de légitimité, en reconnaissant leur existence et en tentant de les engager dans le processus politique."
chi_Utilize_public_support: "Utiliser le soutien public"
chi_Utilize_public_support_desc: "Compte tenu de notre bonne crédibilité parmi les masses, nous pouvons gagner leur soutien."
chi_Call_for_stability: "Appel à la stabilité"
chi_Call_for_stability_desc: "La stabilité est toujours plus importante que tout. Nous pouvons appeler les personnes conservatrices à maintenir la stabilité sociale."
CHI_labour_law_2: "La loi sur le travail a peu d'attrait"
CHI_labour_law_2_desc: "En raison de la propagande gouvernementale, les lois sur le travail ont commencé à attirer l'attention des gens et ont imposé certaines restrictions sur les relations travail-capital. Cependant, aucun système pratique n'a été établi pour assurer la mise en œuvre des lois sur le travail."
CHI_labour_law_3: "Loi sur le travail avec un caractère corporatiste"
CHI_labour_law_3_desc: "La loi sur le travail est utilisée pour protéger les droits et intérêts du travail et du capital, tout en interdisant strictement les comportements excessifs des deux parties. Cette loi sur le travail corporatiste assure la stabilité du développement social et protège les droits et intérêts des travailleurs dans une certaine mesure, mais nie fondamentalement la possibilité et la légitimité de la lutte des classes."
CHI_modify_uighur_threat: "Menace séparatiste"
CHI_modify_uighur_opinion: "Opinion publique ouïghoure"
CHI_Protecting_workers_idea: "Protéger les travailleurs"
CHI_Protecting_workers_idea_desc: "Protéger les droits des travailleurs"
CHI_Comfort_entrepreneurs_idea: "Réconforter les entrepreneurs"
CHI_Comfort_entrepreneurs_idea_desc: "Réconforter les entrepreneurs"
AIIB_category: "Banque asiatique d'investissement dans les infrastructures"
AIIB_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_AIIB\n\n\n\n\n\n\n\n\nLa §YBanque asiatique d'investissement dans les infrastructures§!, également connue sous le nom de §YAIIB§!, est une institution multilatérale de développement intergouvernementale en Asie. Elle se concentre sur le soutien à la §Yconstruction d'infrastructures§! et est établie pour promouvoir le processus d'interconnexion et d'intégration économique dans la région asiatique et renforcer la coopération entre la Chine et d'autres pays et régions asiatiques. C'est la première institution financière multilatérale lancée par la §YChine§! et son siège est à §YPékin§!. L'émergence de la §YBanque asiatique d'investissement dans les infrastructures§! est une réponse à la tendance de la mondialisation économique. Elle a non seulement promu l'amélioration des relations entre les pays membres, mais aussi considérablement augmenté l'influence de la §Y[CHI.GetFlag]Chine§! dans le §Ymonde§!.\n\nLa probabilité que les pays demandent à adhérer dépend de la §Y$modify_chinese_aggression$§!."
apply_to_join_as_member: "Demander à adhérer en tant que membre"
apply_to_join_as_member_desc: "Rejoindre la Banque asiatique d'investissement dans les infrastructures favorisera le développement économique de notre pays et nous rapprochera de la Chine."
CHI_development_assistance: "Fournir une assistance annuelle au développement"
CHI_development_assistance_desc: "Nous devrions augmenter notre aide aux États membres sous-développés. Aider les faibles est la responsabilité d'un grand pays."
CHI_Provide_low_interest_loans: "Fournir des prêts à faible taux d'intérêt"
CHI_Provide_low_interest_loans_desc: "Nous devrions augmenter l'aide aux États membres sous-développés. Aider les faibles est la responsabilité des grands pays."
Invite_other_countries_to_join: "Inviter d'autres pays à se joindre"
Invite_other_countries_to_join_desc: "Nous pouvons inviter d'autres pays à se joindre à notre initiative de paix\n\nPlus la §Y$modify_chinese_aggression$§! est faible, plus la §Yprobabilité§! que les pays étrangers acceptent est élevée."
CHI_development_assistance_effect_TT: "§YPayer 3% du PIB à chaque pays membre, jusqu'à un maximum de 10B§!"
United_Nations_Security_Council_category: "Conseil de sécurité des Nations Unies"
United_Nations_Security_Council_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_unsc\n\n\n\n\n\n\n\n\nLe §YConseil de sécurité des Nations Unies§! est l'un des six organes principaux des Nations Unies. C'est le seul organe de l'ONU ayant le pouvoir de §Yprendre des mesures militaires§!. Il a été créé par les cinq §Ymembres permanents du Conseil de sécurité§! : §Y[USA.GetFlag] les États-Unis d'Amérique§!, §Y[CHI.GetFlag] la République populaire de Chine§!, §Y[SOV.GetFlag] la Fédération de Russie§!, §Y[ENG.GetFlag] le Royaume-Uni de Grande-Bretagne et d'Irlande du Nord§! et §Y[FRA.GetFlag] la Cinquième République française§!. Les cinq §Ymembres permanents du Conseil de sécurité§! ont §Yle droit de veto au Conseil de sécurité§! . \nBien que la capacité de l'ONU à intervenir dans les affaires internationales, en particulier dans les guerres internationales, soit faible, les §Ymembres permanents du Conseil de sécurité de l'ONU§! peuvent utiliser leur forte influence politique, économique et militaire pour faire pression et intervenir dans les guerres. \n\nLes cinq §Ymembres permanents du Conseil de sécurité de l'ONU§! ont des demandes différentes en matière de relations internationales. Par exemple, les §Y[USA.GetFlag]États-Unis d'Amérique§! et la §Y[SOV.GetFlag]Fédération de Russie§! poursuivront plus activement leurs propres intérêts, tandis que la §Y[CHI.GetFlag]République populaire de Chine§! plaide davantage pour la paix internationale. \n\nLes §Ymembres permanents du Conseil de sécurité de l'ONU§! sont des acteurs importants dans la médiation des guerres et le maintien de la paix mondiale. Cependant, une fois qu'ils se font la guerre, le schéma mondial subira un §Rchangement fondamental§!. \n"
Appeal_for_peace: "Appel à la paix"
Appeal_for_peace_desc: "Le monde est en ébullition. Nous devrions appeler les pays à cesser de se battre."
ask_to_stop_war: "Demander un cessez-le-feu"
ask_to_stop_war_desc: "Certains pays mènent des guerres d'agression, ce qui a un impact sérieux sur la sécurité et la stabilité mondiales."
ask_p5_to_stop_war: "Demander aux cinq membres permanents de cesser le feu"
ask_p5_to_stop_war_desc: "Le juge participe au tournoi. Nous devons empêcher les choses d'aller §Rplus loin§!"
warning_from_CHI: "Menace militaire"
warning_from_CHI_desc: "En tant que membre du Conseil de sécurité, un pays détruit la paix mondiale. Nous ne pouvons pas rester les bras croisés.\n\n§RNous utiliserons la force pour les forcer à cesser de se battre§!"
