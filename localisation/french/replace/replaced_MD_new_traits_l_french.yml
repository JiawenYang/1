joint_development_zone_malaysia_desc: "Établir une zone de développement conjointe avec nos concurrents en mer de Chine méridionale est un moyen efficace de réduire l'hostilité et de promouvoir la coopération. Cependant, nous devons considérer si nous sommes prêts à partager les bénéfices de l'extraction des ressources."
