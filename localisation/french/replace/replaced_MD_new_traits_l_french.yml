Robot_Dog_equipment: "Loup Robot"
Robot_Dog_equipment_desc: "Les loups mécaniques sont essentiellement un type de robot bionique. Ils ont la capacité de marcher, courir, escalader des obstacles et effectuer d'autres mouvements. Ils sont également hautement personnalisables, modulaires et autonomes, et peuvent être utilisés avec différentes armes selon les besoins."
