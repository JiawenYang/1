cnsa.101.t:0 "Satellite relais Queqiao"
cnsa.101.d:0 "\"Queqiao\" est le satellite relais de la sonde lunaire Chang'e-4. C'est le premier satellite de relais dédié de la Chine et le premier au monde en dehors de l'orbite terrestre."
cnsa.101.a:0 "Génial"
cnsa.102.t:0 "La sonde Chang'e 4 lancée avec succès"
cnsa.102.d:0 "La fusée Longue Marche 3B transportant la sonde Chang'e 4 a été lancée dans l'espace tôt ce matin. La sonde devrait effectuer le premier atterrissage en douceur sur la face cachée de la lune dans l'histoire de l'humanité. La sonde Chang'e 4 fait partie du programme lunaire ambitieux de la Chine. Comme la face cachée de la lune n'a pas d'interférence d'ondes radio de la terre, elle est considérée comme un excellent endroit pour l'observation astronomique. De plus, elle devrait explorer les minéraux et les reliefs de la face cachée de la lune."
cnsa.102.a:0 "Génial"
cnsa.103.t:0 "La sonde Chang'e 5 lancée avec succès"
cnsa.103.d:0 "À 4h30 heure de Pékin aujourd'hui, la Chine a lancé avec succès la sonde Chang'e-5 avec la fusée porteuse Longue Marche 5 Yao-5 au Centre de lancement spatial de Wenchang à Hainan. Cette mission de lancement tentera de ramener des échantillons de roche lunaire sur Terre. Si tout se passe bien, le vaisseau spatial reviendra sur Terre dans une quinzaine de jours. L'agence de presse officielle chinoise Xinhua a déclaré que les objectifs scientifiques de Chang'e-5 sont principalement de mener une détection morphologique et des enquêtes géologiques de fond de la zone d'atterrissage, d'obtenir des données d'analyse sur place liées aux échantillons lunaires, et d'établir un lien entre les données de détection sur place et les données d'analyse de laboratoire; mener des recherches systématiques et à long terme en laboratoire sur les échantillons lunaires, analyser la structure du sol lunaire, les propriétés physiques et la composition matérielle, et approfondir la recherche sur l'origine et l'histoire de l'évolution de la lune."
cnsa.103.a:0 "Exploits"
cnsa.104.t:0 "La sonde Chang'e 6 lancée avec succès"
cnsa.104.d:0 "À 4h30 heure de Pékin aujourd'hui, la Chine a lancé avec succès la sonde Chang'e-6 à l'aide de la fusée porteuse Longue Marche 5 au Centre de lancement spatial de Wenchang à Hainan. Chang'e-6, transportant des équipements de recherche scientifique de plusieurs partenaires internationaux, effectuera un atterrissage en douceur au pôle sud de la lune et retournera des échantillons, marquant la fin du plan d'exploration lunaire en trois étapes de la Chine."
cnsa.104.a:0 "Génial"
cnsa.105.t:0 "La construction de la station spatiale Tiangong de la Chine commence"
cnsa.105.d:0 "Aujourd'hui, accompagné d'un énorme rugissement, la fusée porteuse Longue Marche 5B transportant le module central de la station spatiale Tiangong entièrement développé de manière indépendante par la Chine s'est précipitée dans l'espace. Il s'arrimera avec les modules expérimentaux Wentian et Mengtian à lancer ensuite, et se combinera dans l'espace pour former le modèle de base de la station spatiale Tiangong de la Chine. Après l'achèvement de la station spatiale Tiangong, elle s'arrimera avec plusieurs vaisseaux cargo Tianzhou et vaisseaux spatiaux habités Shenzhou pour accomplir une mission permanente à long terme et continue."
cnsa.105.a:0 "Je formerai la tête"
cnsa.106.t:0 "Chambre expérimentale Wentian"
cnsa.106.d:0 "Module expérimental Wentian, module de contrôle et d'application expérimentale, principalement utilisé pour la recherche, avec un petit bras robotique installé à l'extérieur du module."
cnsa.106.a:0 "Je formerai les jambes"
cnsa.107.t:0 "Chambre expérimentale Mengtian"
cnsa.107.d:0 "Chambre expérimentale Mengtian, une chambre d'application professionnelle, équipée d'un sas de charge utile expérimentale qui peut déposer de grandes charges utiles dans le vide."
cnsa.107.a:0 "Je formerai les jambes"
cnsa.108.t:0 "La station spatiale de la Chine achevée et mise en service"
cnsa.108.d:0 "Aujourd'hui, alors que le grand bras robotique de Tiangong installait le module optique Xuntian en place, le Bureau chinois des vols spatiaux habités a officiellement annoncé l'achèvement de la station spatiale Tiangong de la Chine. L'achèvement de la station spatiale marque que la Chine a la capacité de rester en orbite dans l'espace extra-atmosphérique pendant une longue période et de mener des expériences scientifiques. Ensuite, la station spatiale s'arrimera avec le nouveau vaisseau spatial habité Shenzhou et le vaisseau cargo Tianzhou pour accomplir la mission permanente. À l'avenir, chaque groupe d'astronautes se relayeront pour rester pendant 6 mois. \n\nAprès l'établissement réussi de la configuration de base de la station spatiale Tiangong, trois modules peuvent être ajoutés à l'avant du module central pour former une configuration d'expansion \"croix\" de la station spatiale selon la demande. Les trois modules d'expansion A, B et C sont situés à l'avant du module central, formant un petit \"T\". L'extrémité arrière du module d'expansion A s'arrime avec l'extrémité avant du module central, et les modules d'expansion B et C s'arriment avec la gauche et la droite de l'extrémité avant du module d'expansion A. Le vaisseau spatial habité s'arrime à l'extrémité avant du module d'expansion A. Un deuxième vaisseau spatial habité peut être ajouté selon la demande pour une utilisation de retour d'urgence, s'arrimant en dessous de l'extrémité avant du module central. Le nombre d'astronautes à long terme est augmenté à 3~6 personnes, et l'échelle maximale peut atteindre 180 tonnes. "
cnsa.108.a:0 "Notre voyage est vers la mer d'étoiles"
cnsa.109.t:0 "Projet Wangshu"
cnsa.109.d:0 "Après discussion et résolution par le Comité central, le programme d'atterrissage lunaire habité de mon pays a été officiellement nommé \"Programme Wangshu\". \"Wangshu Chariot\" est la conception du rover lunaire habité de ce programme, qui a été développé par l'Université Tsinghua. Le nom a été inspiré par Wangshu, la déesse de la lune dans l'ancienne légende chinoise, et a également incorporé des éléments clés du char et des chevaux en bronze dans le mausolée de Qin Shihuang. Partant de l'ingénierie et combinant des idées humanistes, l'équipe de conception a finalement formé une conception de rover lunaire mettant en vedette de grandes roues et un dôme circulaire. Ce plan répond non seulement aux restrictions de taille et de poids du rover lunaire montant sur l'atterrisseur lunaire à la surface lunaire, mais prend également en compte le problème du mouvement limité du poignet et des doigts des astronautes portant des combinaisons spatiales lunaires, et conçoit un joystick qui peut découpler les actions de marche avant, arrière, de direction et de freinage."
cnsa.109.a:0 "Wangshu est devant pour montrer le chemin, et Feilian est derrière pour montrer le chemin"
cnsa.111.t:0 "Lancement de Wangshu II"
cnsa.111.d:0 "Aujourd'hui, la fusée Wangshu II a été lancée avec succès, transportant trois astronautes communistes bien testés et le rover lunaire habité Wangshu Chariot. Bientôt, ils pourront atterrir avec succès sur la lune, et mon pays deviendra le deuxième pays après les États-Unis à atterrir sur la lune."
cnsa.111.a:0 "Descendre du bus, c'est comme hier, Wangshu est quatre ou cinq rond"
cnsa.112.t:0 "Pour la première fois, les Chinois ont laissé leurs empreintes sur la lune"
cnsa.112.d:0 "Aujourd'hui, le Chariot de Wangshu a atterri avec succès sur la lune, et trois astronautes ont fait leurs premiers pas sur la lune, ce qui était également le premier pas de la Chine sur la lune.\n\nNous avons délibérément choisi le même site d'atterrissage que les astronautes américains au siècle dernier, mais les astronautes n'ont pas trouvé les empreintes des astronautes américains bien connus."
cnsa.112.a:0 "Oubliez les Yankees, regardons nos empreintes"
cnsa.113.t:0 "Retour des héros"
cnsa.113.d:0 "Aujourd'hui, la capsule de rentrée transportant trois astronautes a atterri avec succès, mais elle a heurté une roche non découverte et a roulé lors de l'atterrissage. Heureusement, les trois astronautes sont indemnes."
cnsa.113.a:0 "C'est un must dans les livres d'histoire"
cnsa.120.t:0 "La sonde Tianwen-1 Mars lancée avec succès"
cnsa.120.d:0 "Aujourd'hui, mon pays a lancé avec succès la sonde Tianwen-1, la première mission d'exploration de Mars, au Centre de lancement spatial de Wenchang sur la côte nord-est de l'île de Hainan à l'aide d'une fusée porteuse Longue Marche 5 Y4. La fusée a envoyé avec succès la sonde sur l'orbite prévue.\n\nSelon le plan, la sonde volera à proximité de Mars pendant environ 7 mois dans l'orbite de transfert Terre-Mars, complétera la capture de Mars par \"freinage\", entrera dans l'orbite de Mars et effectuera des tâches d'atterrissage, de patrouille et autres à un moment approprié pour mener une exploration scientifique de Mars."
cnsa.120.a:0 "Allez Allez Allez"
cnsa.121.t:0 "Arrivée sur Mars"
cnsa.121.d:0 "Tianwen-1 est arrivé sur Mars et a réussi à entrer en orbite martienne. Ensuite, le rover sur l'atterrisseur nous fournira continuellement de nouvelles données."
cnsa.121.a:0 "Écrire un nouveau chapitre"
cnsa.122.t:0 "Lancement réussi de la sonde martienne Tianwen-2"
cnsa.122.d:0 "Aujourd'hui, notre pays a lancé avec succès la sonde Tianwen-1, la première mission d'exploration de Mars, depuis le centre de lancement spatial de Wenchang, sur la côte nord-est de l'île de Hainan, à l'aide d'une fusée Longue Marche 6 Yao-5. La fusée a placé la sonde avec succès sur l'orbite prévue.\n\nSelon le plan, Tianwen-2 est une mission d'exploration d'astéroïdes, avec pour objectif principal de survoler et de ramener des échantillons d'un astéroïde géocroiseur. La tâche principale est de survoler et de ramener des échantillons de l'astéroïde géocroiseur 2016HO3."
cnsa.122.a:0 "Prendre plus de photos"
cnsa.123.t:0 "Arrivée sur Mars"
cnsa.123.d:0 "Aujourd'hui, Tianwen-2 est arrivé sur Mars et a réussi à entrer en orbite martienne. Ensuite, le rover sur l'atterrisseur nous fournira continuellement de nouvelles données."
cnsa.123.a:0 "Peut-on y cultiver des pommes de terre ?"
cnsa.124.t:0 "Premier artefact ramené de Mars !"
cnsa.124.d:0 "Aujourd'hui, Tianwen-2 est revenu avec succès sur Terre. Cependant, en traversant l'atmosphère, un trou s'est formé dans sa couche protectrice de surface, et de nombreux composants internes ont fondu. Heureusement, les échantillons collectés n'ont pas été endommagés. Nous avons réussi à récupérer le premier objet artificiel ramené de Mars dans l'histoire humaine !"
cnsa.124.a:0 "Prendre le sol martien et cultiver des pommes de terre !"

##event##
chinapro.101.t:0 "Tremblement de terre de Wenchuan"
chinapro.101.d:0 "Le tremblement de terre de Wenchuan a eu lieu à 14 h 28 min 04 s, heure de Pékin, le 12 mai 2008 (lundi). L'épicentre était situé près de la ville de Yingxiu, dans le comté de Wenchuan, préfecture autonome tibétaine et qiang d'Aba, province du Sichuan, Chine, à 79 kilomètres au nord-ouest de Chengdu, la capitale du Sichuan. Selon les données de l'Administration sismologique chinoise, l'amplitude des ondes de surface a atteint 8,2 et la magnitude de moment 8,3, avec une zone de dégâts dépassant 100 000 kilomètres carrés. L'intensité du séisme pourrait atteindre 11 degrés. Les ondes sismiques de ce tremblement de terre ont fait six fois le tour de la Terre, et le séisme a été ressenti dans la majeure partie de la Chine ainsi que dans de nombreux pays et régions d'Asie, de Liaoning au nord à Shanghai à l'est, jusqu'à Hong Kong, Guangdong, Macao, Thaïlande, Vietnam au sud, et au Pakistan à l'ouest.\n\nAu 25 septembre 2008, le séisme avait causé 69 227 morts, 17 923 disparus, 374 643 blessés à divers degrés, 19,9303 millions de personnes sans abri, et un total de 46,256 millions de personnes affectées. C'est le séisme le plus destructeur depuis la fondation de la Nouvelle Chine et celui ayant causé le plus de victimes après le tremblement de terre de Tangshan."
chinapro.101.a:0 "Mobiliser toutes les forces pour les secours !"
chinapro.101.b:0 "C'est vraiment terrifiant"
china_news.30.t:0 "XXIXe Olympiade"
china_news.30.d:0 "La XXIXe Olympiade s'est tenue du 8 au 24 août 2008 à Pékin, la capitale de la République populaire de Chine. Ce fut les premiers Jeux olympiques d'été organisés en Chine et les troisièmes Jeux olympiques organisés dans un pays socialiste, après les Jeux de Moscou de 1980 et les Jeux d'hiver de Sarajevo de 1984.\nCes Jeux ont produit 43 nouveaux records mondiaux et 132 nouveaux records olympiques, et 87 pays ont figuré au tableau des médailles. Le pays hôte, la République populaire de Chine, a dominé le classement des médailles d'or avec 51 médailles d'or, devenant ainsi le premier pays asiatique de l'histoire olympique à atteindre la première place du classement des médailles d'or, renforçant la position de la Chine comme puissance sportive.\nLes États-Unis ont remporté 112 médailles, devenant le pays avec le plus grand nombre de médailles lors de ces Jeux. Ces Jeux ont vu naître deux « hommes volants » dans l'eau et sur terre respectivement : l'athlète américain Michael Phelps et l'athlète jamaïcain Usain Bolt, qui ont accompli des exploits mondialement reconnus. Le premier a remporté huit médailles d'or consécutives dans le « Cube d'eau », devenant l'athlète avec le plus de médailles d'or lors d'une même édition des Jeux olympiques."
china_news.30.a:0 "Bien joué"
china_news.30.b:0 "Un monde, un rêve"
chinapro.103.t:0 "La Corée du Sud déploie le système antimissile THAAD"
chinapro.103.d:0 "[?global.date.GetDateStringNoHour], la République de Corée a commencé à déployer le système antimissile THAAD dans le pays avec l'assistance des États-Unis. Le déploiement du système THAAD a été annoncé comme début des négociations au début de l'année dernière, et a été officiellement confirmé plus tard dans l'année. Cet événement a suscité une controverse internationale. La Corée du Sud affirme que ce déploiement militaire n'est qu'une mesure défensive pour faire face à la menace de missiles de la République populaire démocratique de Corée, tandis que la République populaire de Chine estime que le déploiement du système THAAD affecte sa sécurité nationale et a pris plusieurs mesures de rétorsion contre la Corée du Sud. Cet événement affecte également l'équilibre stratégique dans la région du Pacifique."
chinapro.103.a:0 "Intéressant..."
chinapro.103.b:0 "Les Coréens paieront le prix pour cela"
chinapro.103.c:0 "Nous devons nous protéger"
chinapro.104.t:0 "Contre-mesures face au THAAD"
chinapro.104.d:0 "La décision obstinée de la Corée du Sud de déployer le THAAD expose près de la moitié de notre territoire à la surveillance radar américaine. Nous devons prendre des contre-mesures."
chinapro.104.a:0 "C'est intolérable, que ne pouvons-nous pas tolérer d'autre ?"
chinapro.104.b:0 "Nous devons maintenir notre relation avec la Corée du Sud"
chinapro.106.t:0 "70e anniversaire de la fondation de la République populaire de Chine : défilé militaire national"
chinapro.106.d:0 "Le 1er octobre 2019, la Chine a organisé un grand défilé militaire à Pékin pour célébrer le 70e anniversaire de la fondation de la République populaire de Chine. Le défilé comprenait environ 15 000 officiers et soldats de l'Armée populaire de libération, de la Force de police armée et de la Réserve de milice, 580 pièces d'équipement, 15 colonnes de marche et 32 colonnes d'équipement ; plus de 160 avions de chasse de l'Armée, de la Marine et de l'Armée de l'air ont formé 12 échelons aériens.\nLe défilé militaire célébrant le 70e anniversaire de la fondation de la République populaire de Chine est le premier défilé national depuis l'ère nouvelle du socialisme à caractéristiques chinoises, démontrant l'ambition de la nation chinoise de passer de l'éveil à la prospérité, puis à la puissance. L'Armée populaire a été passée en revue par le président [CHI.GetLeader] ainsi que par le Parti et le peuple, affichant une nouvelle apparence après la réforme et la restructuration, démontrant sa ferme détermination à protéger le noyau et à obéir aux ordres, et montrant sa force robuste pour accomplir les missions et tâches de la nouvelle ère."
chinapro.106.a:0 "Puissant et majestueux"
chinapro.107.t:0 "Le bateau de tourisme Étoile de l'Est chavire !"
chinapro.107.d:0 "À 21 h 30 le 1er juin 2015, l'Étoile de l'Est, appartenant à la Compagnie de navigation orientale de Chongqing, a rencontré des conditions météorologiques convectives rares et sévères sur son trajet de Nanjing à Chongqing et a chaviré dans la voie navigable de Damazhou sur le fleuve Yangtze, dans le comté de Jianli, ville de Jingzhou, province du Hubei. Après le naufrage, le ministère des Transports, l'Armée populaire de libération, la Force de police armée, les officiers de la sécurité publique, ainsi que les provinces et villes le long du fleuve, ont mobilisé un grand nombre de personnels professionnels de recherche et de sauvetage, l'Armée populaire de libération, la police armée et les pompiers, ainsi que les habitants le long du fleuve, et ont adopté une combinaison de patrouilles aériennes, recherches en surface, recherches sous-marines, recherches dans les cabines et recherches sur l'ensemble du bassin pour effectuer une recherche complète, tridimensionnelle et exhaustive sur le site et dans les eaux en aval.\nAu 13 juin 2015, après vérification et confirmation répétées par les parties concernées, il y avait 454 personnes à bord du navire de passagers « Étoile de l'Est », dont 12 ont été secourues avec succès et 442 sont décédées. Les corps de toutes les victimes ont été retrouvés, et les travaux de recherche et de sauvetage ont pris fin à ce moment-là.\n\nL'équipe d'enquête du Conseil d'État a déterminé que le chavirement du navire de passagers « Étoile de l'Est » était un événement catastrophique particulièrement grave causé par une condition météorologique convectives soudaine et rare (ligne de grains accompagnée d'une rafale descendante) provoquée par de forts vents et des tempêtes de pluie."
chinapro.107.a:0 "Faites de votre mieux pour secourir !"
newspro.101.t:0 "Fusillade à Las Vegas"
newspro.101.d:0 "Dans la soirée du 1er octobre 2017, une fusillade horrible a eu lieu à Las Vegas, aux États-Unis. À ce moment-là, plus de 22 000 personnes assistaient à un festival de musique en plein air. Soudain, le festival a été interrompu par des coups de feu. Le suspect a utilisé plusieurs armes modifiées pour tirer sur la foule écoutant le concert depuis la fenêtre du 32e étage de l'hôtel Mandalay Bay, tuant 60 personnes et blessant plus de 500 personnes. Le tireur s'est suicidé après un bref échange de tirs avec la police. Le président américain Trump a exprimé son choc face à l'incident. Il a prononcé un discours le lundi qualifiant cet incident sanglant d'« acte maléfique ». Trump a appelé les Américains à s'unir dans ce moment tragique et terrifiant."
newspro.101.a:0 "Choqué"
newspro.101.b:0 "Un acte de pure malveillance"
newspro.102.t:0 "Coupe du monde en Russie"
newspro.102.d:0 "La Coupe du monde de Russie 2018 est la 21e Coupe du monde de la FIFA, tenue dans 12 stades de 11 villes en Russie du 14 juin au 15 juillet 2018. C'est la première fois que la Coupe du monde est organisée en Russie, et aussi la première fois qu'elle se tient dans un pays d'Europe de l'Est. Le 16 juillet 2018, la France a battu la Croatie 4-2 en finale du tournoi, remportant la Coupe du monde pour la deuxième fois après 20 ans, tandis que la Croatie a également réalisé son meilleur résultat dans l'histoire de l'équipe lors de cette Coupe du monde. Le milieu de terrain croate Luka Modric, l'attaquant anglais Harry Kane et le gardien belge Thibaut Courtois ont remporté respectivement les prix du Ballon d'or, du Soulier d'or et du Gant d'or ; l'attaquant français Kylian Mbappé a remporté le prix du meilleur jeune."
newspro.102.a:0 "La Coupe du monde est terminée"
newspro.102.b:0 "Nous avons montré au monde notre meilleur côté"
newspro.103.t:0 "Incendie de Notre-Dame"
newspro.103.d:0 "Un incendie s'est déclaré à la cathédrale Notre-Dame de Paris, en France, vers 18 h 50 heure locale le 15 avril 2019, et l'ensemble du bâtiment a été gravement endommagé. L'incendie était situé dans la tour supérieure de la cathédrale Notre-Dame, et le feu a rapidement englouti la flèche de la tour, qui s'est effondrée comme si elle s'était brisée en deux. Près de la cathédrale Notre-Dame, des centaines de personnes se sont agenouillées pour prier, certaines sanglotaient, d'autres avaient les larmes aux yeux. Nicolas, un citoyen parisien, a déclaré : « Aujourd'hui est un jour triste pour tous les Parisiens. Nous prions pour que l'incendie de la cathédrale Notre-Dame soit éteint le plus rapidement possible. »"
newspro.103.a:0 "Mon Dieu !"
newspro.104.d:0 "[?global.date.GetDateStringNoHour], les marchés financiers mondiaux ont connu un « Lundi noir ». Les bourses européennes et américaines étaient dans le rouge. Seulement quatre minutes après l'ouverture de la bourse américaine, l'indice S&P 500 a rapidement chuté de plus de 7 %. C'était la troisième interruption de cotation du marché boursier américain en deux semaines et la quatrième interruption de l'histoire.\n« L'oracle des actions » Warren Buffett a déclaré dans une interview avec des médias étrangers à propos du marché financier récent que ces interruptions étaient aussi effrayantes que le « Lundi noir » d'octobre 1987."
newspro.104.a:0 "Mon Dieu !"
newspro.105.t:0 "Black Myth : Wukong"
newspro.105.d:0 "Le premier chef-d'œuvre de jeu 3A chinois « Black Myth : Wukong » est né, et le jour de sa sortie, il a provoqué une énorme sensation mondiale.\nÀ ce jour [?global.date.GetDateStringNoHour], selon les dernières données de l'agence d'études de marché VG Insights, Black Myth : Wukong a vendu 20,9 millions d'exemplaires sur Steam, avec un chiffre d'affaires total dépassant 1 milliard. \nCe jeu a battu de nombreux records historiques des jeux chinois, tels que le plus grand nombre d'utilisateurs en ligne, la vitesse de vente la plus rapide, etc., et est considéré comme une œuvre phare des jeux nationaux chinois."
newspro.105.a:0 "Intéressant..."
newspro.105.b:0 "Donner au monde un petit choc chinois"
newspro.106.t:0 "Incendies en Californie"
newspro.106.d:0 "[?global.date.GetDateStringNoHour], le sud de la Californie a connu une forte tempête sèche - le « vent de Santa Ana ». Les vents violents ont provoqué de nombreux incendies. Parmi eux, les incendies dans la région de Pacific Palisades, près de Los Angeles, en Californie, étaient les plus graves.\nCet incendie a tué au moins 28 personnes, et les dommages et pertes économiques atteindront 250 à 275 milliards de dollars américains. Les victimes de la catastrophe ont déclaré que la scène des incendies dévastateurs ressemblait à la fin du monde."
newspro.106.a:0 "La force de la nature..."
newspro.107.t:0 "Attentat terroriste au Sri Lanka"
newspro.107.d:0 "[?global.date.GetDateStringNoHour], des attentats à la bombe ont eu lieu en six endroits au Sri Lanka, y compris trois hôtels cinq étoiles dans la capitale Colombo, deux églises et une église dans la ville de Batticaloa, à l'est. Lorsque les explosions se sont produites, des célébrations de Pâques avaient lieu dans l'église. L'attentat terroriste a jusqu'à présent tué 253 personnes.\nLe Premier ministre du Sri Lanka a condamné les attentats comme un acte « lâche » et a déclaré : « J'appelle tous les Sri-Lankais à rester unis et forts en ce moment tragique. Le gouvernement prend des mesures immédiates pour contrôler la situation. »"
newspro.107.a:0 "Le terrorisme se propage..."
newspro.108.t:0 "DeepSeek AI"
newspro.108.d:0 "[?global.date.GetDateStringNoHour], un modèle d'intelligence artificielle open-source appelé DeepSeek-R1 a été lancé par une startup chinoise. Le coût de formation est bien inférieur à celui des modèles d'IA similaires, et ses fonctionnalités sont même légèrement meilleures que celles de ChatGPT. Le plus important est que les utilisateurs peuvent l'utiliser gratuitement sans payer de frais d'abonnement élevés, ce qui a propulsé son volume de téléchargements en tête des listes d'applications gratuites dans de nombreux pays.\nCertains l'appellent le moment Spoutnik de l'IA, tandis que d'autres pensent que le modèle DeepSeek est simplement une copie du code d'OpenAI. En bref, DeepSeek a été largement discuté récemment."
newspro.108.a:0 "Que font les gens de la Silicon Valley ?"
newspro.108.b:0 "Intéressant..."
newspro.108.c:0 "Les grands progrès de l'IA"
newspro.109.t:0 "ChatGPT AI"
newspro.109.d:0 "Le 30 novembre 2022, OpenAI a officiellement lancé ChatGPT. C'est un modèle sœur d'InstructGPT. C'est une version de GPT capable de tenir des conversations. Il s'agit de la version 3.5 basée sur GPT-3.\nIl peut non seulement répondre à des questions, mais aussi créer des articles, programmer, et même imiter le style de conversation humaine. Sa capacité de réponse presque omnipotente a donné aux gens une nouvelle compréhension des capacités générales des grands modèles de langage. ChatGPT est rapidement devenu populaire sur les réseaux sociaux. En seulement 5 jours, le nombre d'utilisateurs enregistrés a dépassé 1 million."
newspro.109.a:0 "Progrès dans la technologie américaine"
newspro.109.b:0 "Intéressant..."
newspro.109.c:0 "Nous devons également étudier notre propre IA"
newspro.110.t:0 "PDG de United Health Insurance abattu"
newspro.110.d:0 "[?global.date.GetDateStringNoHour], Brian Thompson, PDG de United Health Insurance, a été abattu de plusieurs balles par Luigi Nicolas Mangione dans une zone animée à l'extérieur de l'hôtel Hilton à Midtown Manhattan. Ryan Thompson est décédé après avoir été touché à la poitrine, et le tireur s'est enfui avant l'arrivée de la police.\nLuigi Nicolas Mangione a ensuite été arrêté par la police locale. Dans sa déclaration, Mangione a revendiqué avoir planifié et exécuté le meurtre seul, et a mentionné la taille et la rentabilité de United Health Insurance Company, accusant le PDG de la compagnie d'assurance d'être un « parasite » et de mériter son sort."
newspro.110.a:0 "Choquant"
newspro.110.b:0 "C'est le système médical inefficace et coûteux des États-Unis..."

newspro.500.t:0 "Les 27e Jeux olympiques"
newspro.500.d:0 "Du 15 septembre au 1er octobre 2000, 11 000 athlètes de 200 délégations du monde entier ont participé aux derniers Jeux olympiques d'été du 20e siècle, les 27e Jeux olympiques d'été tenus à Sydney, en Australie, dans 28 disciplines majeures et 300 disciplines mineures.\nLe nombre d'épreuves est le plus élevé de l'histoire des Jeux olympiques. Inspirés par l'esprit olympique, ils ont défié les limites physiologiques humaines, démontré un haut niveau de compétition, et créé 34 records mondiaux, 77 records olympiques et 3 meilleurs résultats olympiques."
newspro.500.a:0 "Partager l'esprit"
newspro.501.t:0 "Les 28e Jeux olympiques"
newspro.501.d:0 "Les 28e Jeux olympiques d'été se sont tenus à Athènes, la capitale de la Grèce, du 13 au 29 août 2004. Ces Jeux olympiques ont été la plus grande réunion de la famille olympique, avec 11 099 athlètes de 202 pays et régions participant à 28 disciplines majeures et 301 disciplines mineures.\nIls ont défié leurs limites et atteint de nouveaux sommets avec l'esprit olympique de plus vite, plus haut, plus fort, établissant plus de 20 nouveaux records mondiaux en athlétisme, natation, cyclisme, haltérophilie et tir à l'arc."
newspro.501.a:0 "Bienvenue à la maison"
newspro.502.t:0 "Les 30e Jeux olympiques"
newspro.502.d:0 "Les 30e Jeux olympiques d'été se sont tenus à Londres, la capitale du Royaume-Uni, du 27 juillet au 12 août 2012. Le stade principal des Jeux olympiques de Londres 2012 était le stade olympique de Stratford (London Bowl), avec le stade de Wembley et l'O2 Arena comme stades secondaires.\nLes Jeux olympiques de Londres 2012 ont vu la participation de 205 pays et régions, 10 568 athlètes, et 302 épreuves (26 types) de sports. À la clôture des Jeux olympiques de Londres 2012, un total de 85 pays et régions ont remporté des médailles, et la délégation chinoise s'est classée deuxième au classement des médailles avec 38 médailles d'or, 27 médailles d'argent et 23 médailles de bronze."
newspro.502.a:0 "Inspirer une génération"
newspro.503.t:0 "Les 31e Jeux olympiques"
newspro.503.d:0 "Les 31e Jeux olympiques d'été se sont tenus à Rio de Janeiro, au Brésil, du 5 au 21 août 2016. Ces Jeux olympiques comprenaient 28 disciplines majeures et 306 disciplines mineures. Le golf est revenu aux Jeux olympiques, et le rugby à sept a rejoint les Jeux olympiques. Après 120 ans de développement, les Jeux olympiques modernes ont visité l'Amérique du Sud pour la première fois. Le stade principal de ces Jeux olympiques était le stade Maracanã. Il y avait 11 238 athlètes de 207 associations membres du Comité international olympique, y compris une délégation de réfugiés composée de 10 réfugiés.\nLa première place du classement des médailles de ces Jeux olympiques était occupée par les États-Unis, qui ont remporté 46 médailles d'or, 37 médailles d'argent et 38 médailles de bronze, soit un total de 121 médailles ; la deuxième place était occupée par l'équipe britannique, qui a remporté 27 médailles d'or, 23 médailles d'argent et 17 médailles de bronze, soit un total de 67 médailles ; la troisième place était occupée par l'équipe chinoise, qui a remporté 27 médailles d'or, 17 médailles d'argent et 26 médailles de bronze, soit un total de 70 médailles."
newspro.503.a:0 "Vivez votre passion"
newspro.504.t:0 "Les 32e Jeux olympiques"
newspro.504.d:0 "Les 32e Jeux olympiques se sont ouverts le 23 juillet 2021 et se sont clôturés le 8 août. Un total de 11 669 athlètes de 204 pays et régions et deux équipes participantes, l'équipe olympique russe et l'équipe olympique des réfugiés, ont participé aux Jeux olympiques de Tokyo 2020 ; l'événement comprenait un total de 33 disciplines majeures, 339 disciplines mineures et 339 compétitions pour médailles d'or, avec cinq nouvelles disciplines ajoutées : skateboard, surf, escalade sportive, baseball et softball, et karaté.\nLes Jeux olympiques de Tokyo ont créé l'histoire la plus proche d'un rapport 1:1 en termes de configuration des épreuves masculines et féminines et du nombre d'athlètes masculins et féminins participants.\nLa délégation des États-Unis a conservé la première place dans les classements des médailles d'or et des médailles totales avec 39 médailles d'or, 41 médailles d'argent et 33 médailles de bronze lors de ces Jeux olympiques. La délégation chinoise s'est classée deuxième pour le nombre de médailles d'or et de médailles avec 38 médailles d'or, 32 médailles d'argent et 18 médailles de bronze. La délégation japonaise, hôte, s'est classée troisième dans le classement des médailles d'or avec 27 médailles d'or, 14 médailles d'argent et 17 médailles de bronze."
newspro.504.a:0 "Unis par l'émotion"
newspro.505.t:0 "Les 33e Jeux olympiques"
newspro.505.d:0 "Les 33e Jeux olympiques d'été se sont ouverts le 26 juillet 2024 et se sont clôturés le 11 août. Certaines épreuves ont commencé le 24 juillet. Après la candidature réussie de Paris, elle est devenue la deuxième ville au monde à accueillir les Jeux olympiques d'été au moins trois fois après Londres, et c'est également la première ville à accueillir à nouveau les Jeux olympiques après les Jeux olympiques de Paris de 1924.\nCe sont les premiers Jeux olympiques avec un ratio totalement équilibré entre hommes et femmes, avec 5 250 hommes et femmes chacun. Ces Jeux comprennent 32 disciplines majeures et 329 disciplines mineures, avec un total de 206 pays et régions participants. En outre, quatre nouvelles disciplines majeures, le skateboard, le surf, l'escalade sportive et le breakdance, ont été ajoutées à ces Jeux olympiques.\nLa délégation des États-Unis s'est classée première dans le classement des médailles avec 40 médailles d'or, 44 médailles d'argent et 42 médailles de bronze, tandis que la délégation chinoise a finalement remporté 40 médailles d'or, 27 médailles d'argent et 24 médailles de bronze aux Jeux olympiques de Paris, égalant la délégation des États-Unis pour la première place dans le nombre de médailles d'or."
newspro.505.a:0 "Jeux grands ouverts"

