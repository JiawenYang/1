#########Projets spéciaux
sp_chi_robot_dog_dev: "Loup Robot"
sp_chi_robot_dog_dev_desc: "Le Loup Robot est un robot quadrupède bionique hautement personnalisable, modulaire et autonome, qui peut être utilisé avec différentes armes selon les besoins."
sp_chi_ultra_high_voltage_transmission: "Transmission à ultra-haute tension"
sp_chi_ultra_high_voltage_transmission_desc: "La transmission à ultra-haute tension fait référence aux projets et technologies de transmission à 1000 kV en courant alternatif et ±800 kV en courant continu, qui peuvent réduire efficacement les pertes dans la transmission d'énergie."
sp_chi_giant_construction_machinery: "Machinerie de construction géante"
sp_chi_giant_construction_machinery_desc: "Un type d'équipement spécialisé utilisé pour réaliser des projets de construction géants, permettant à la créativité humaine de ne pas être contrainte."
sp_chi_advanced_automated_terminal: "Terminal automatisé"
sp_chi_advanced_automated_terminal_desc: "Un terminal efficace qui ne nécessite qu'un petit nombre d'opérateurs pour son entretien, garantissant un flux de matériaux pratique et efficace."
sp_chi_hypersonic_wind_tunnel: "Tunnel de vent hypersonique"
sp_chi_hypersonic_wind_tunnel_desc: "Un tunnel de vent hypersonique est celui dans lequel la plage de nombres de Mach de la section expérimentale est d'environ 5 à 14, et la température du flux d'air est suffisamment élevée pour empêcher la liquéfaction du flux d'air dans la section expérimentale lorsqu'il se dilate de manière isentropique jusqu'aux nombres de Mach mentionnés ci-dessus, mais pas assez élevée pour produire des effets de gaz réels."
sp_chi_commercial_quantum_computer: "Ordinateur quantique commercial"
sp_chi_commercial_quantum_computer_desc: "La première génération d'ordinateurs commerciaux basés sur la théorie quantique, surpassant de loin les ordinateurs d'architecture traditionnelle en termes de performances et offrant des possibilités illimitées."
sp_chi_advanced_3D_printing: "Impression 3D intégrée"
sp_chi_advanced_3D_printing_desc: "L'impression 3D intégrée de métal pour le moulage, le forgeage et le fraisage peut considérablement réduire le temps de consommation de l'impression 3D, réduire la consommation d'énergie et les pertes de matériaux, et la résistance des pièces produites peut être supérieure à celle des produits similaires fabriqués selon les procédés traditionnels."
sp_chi_artificially_synthesized_starch: "Tonnes d'amidon synthétisé artificiellement"
sp_chi_artificially_synthesized_starch_desc: "Il utilise uniquement des moyens chimiques pour synthétiser de l'amidon à partir d'eau et de dioxyde de carbone sous la condition de consommer de l'électricité. Il ne repose pas sur la photosynthèse et peut entraîner une révolution subversive dans la technologie agricole."

#Bâtiments uniques
landmark_DLYTridge: "Pont transmarin de Bohai"
landmark_DLYTridge_desc: "Le pont réduit le temps de trajet entre les régions du Liaoning et du Shandong, créant des conditions favorables pour les activités économiques."
landmark_TWFZridge: "Pont transmarin Taiwan-Fuzhou"
landmark_TWFZridge_desc: "Le pont réduit le temps de trajet entre l'île de Taiwan et le continent, créant des conditions favorables pour les activités économiques."
landmark_HZMBridge: "Pont Hong Kong-Zhuhai-Macao"
landmark_HZMBridge_desc: "Le pont Hong Kong-Zhuhai-Macao est un projet de pont-tunnel en République populaire de Chine qui relie Hong Kong, Zhuhai, Guangdong et Macao. Il est situé dans les eaux de Lingdingyang de l'estuaire de la rivière des Perles à Guangdong et constitue la section sud de l'autoroute périphérique de la région du delta de la rivière des Perles. Le pont Hong Kong-Zhuhai-Macao commence à l'île artificielle du port de Hong Kong près de l'aéroport international de Hong Kong à l'est, traverse les eaux de Lingdingyang de la mer de Chine méridionale pour se connecter aux îles artificielles de Zhuhai et Macao à l'ouest, et se termine à l'échangeur de Hongwan à Zhuhai. La longueur totale du pont et du tunnel est de 55 kilomètres, dont le pont principal mesure 29,6 kilomètres et la distance entre le port de Hong Kong et le port de Zhuhai-Macao est de 41,6 kilomètres. La chaussée est une autoroute à six voies dans les deux sens avec une vitesse de conception de 100 kilomètres par heure. Le pont réduit le temps de trajet dans ces zones et crée des conditions favorables pour les activités économiques."
landmark_ThreeGorgesDam: "Barrage des Trois Gorges"
landmark_ThreeGorgesDam_desc: "L'extrémité est du réservoir des Trois Gorges, qui contrôle une zone de drainage d'environ 1 million de kilomètres carrés, a été construit en 1994. Il intègre le contrôle des inondations, la production d'énergie, la navigation et l'utilisation des ressources en eau. C'est le projet principal de la centrale hydroélectrique des Trois Gorges, le paysage central de la zone touristique du barrage des Trois Gorges, et l'un des plus grands centres hydrauliques au monde aujourd'hui."
landmark_ChinaNationalPavilion: "Pavillon national de la Chine à l'Exposition universelle"
landmark_ChinaNationalPavilion_desc: "Le pavillon national de la Chine à l'Exposition universelle de Shanghai 2010 prend comme thème la sagesse chinoise dans le développement urbain et démontre l'esprit et le tempérament culturel chinois de « la couronne de l'Est, la Chine florissante, le grenier du monde et la prospérité du peuple ». Il est divisé en deux parties : le pavillon national et le pavillon régional. Le corps principal est majestueux et puissant, comme une couronne imposante et un grenier du monde ; la base de la plate-forme du pavillon régional rassemble les gens, impliquant que la société profite au pays et que les quatre directions sont riches."
landmark_BirdNestStadium: "Stade du Nid d'Oiseau"
landmark_BirdNestStadium_desc: "Le Stade national, également connu sous le nom de Nid d'Oiseau, est situé dans la partie sud de la zone centrale du parc olympique de Pékin. C'est le stade principal des Jeux olympiques de Pékin 2008. Le stade est façonné comme un « nid » et un berceau pour nourrir la vie, et il porte l'espoir de l'humanité pour l'avenir. Les concepteurs n'ont effectué aucun traitement inutile sur le lieu, laissant la structure exposée, formant ainsi naturellement l'apparence du bâtiment."
landmark_OrientalPearl: "Perle de l'Orient"
landmark_OrientalPearl_desc: "La tour de télévision Perle de l'Orient, ou « Perle de l'Orient » en abrégé, est située au n° 1 Avenue du Siècle, Lujiazui, nouvelle zone de Pudong, Shanghai. Elle est située sur la rive de la rivière Huangpu, avec les bâtiments modernes de Lujiazui en arrière-plan et le groupe d'expositions architecturales internationales du Bund de l'autre côté de la rivière. La construction a commencé le 30 juillet 1991 et s'est achevée et mise en service le 1er octobre 1994. C'est l'un des bâtiments emblématiques de Shanghai qui intègre le tourisme urbain, la restauration à la mode, le shopping et le divertissement, les expositions historiques, les croisières sur la rivière Huangpu, les expositions et spectacles, et la transmission radio et télévisée."
landmark_Tiananmen: "Tiananmen"
landmark_Tiananmen_desc: "La tour de la porte Tiananmen est le symbole de la République populaire de Chine. Son image solennelle fait partie intégrante de l'emblème national chinois. Devant elle se trouve la vaste place Tiananmen. La place Tiananmen est la plus grande place urbaine au monde. Après de nombreuses modifications et changements, elle a finalement atteint une échelle de 880 mètres de long du nord au sud, 500 mètres de large d'est en ouest, et une superficie de 440 000 mètres carrés. Dans la place, le long de l'axe central de Pékin du nord au sud, se dressent des bâtiments importants tels que le mât du drapeau national, le monument aux héros du peuple, le mémorial du président Mao et la tour de la porte Zhengyangmen."
landmark_GreatWall: "La Grande Muraille"
landmark_GreatWall_desc: "La Grande Muraille est une fortification militaire chinoise ancienne. C'est un mur haut, solide et continu utilisé pour limiter les mouvements de la cavalerie ennemie. La Grande Muraille n'est pas un simple mur isolé, mais un système de défense avec des murs comme corps principal et un grand nombre de villes, de barrières, de pavillons et de signaux. L'histoire de la Grande Muraille remonte à la dynastie des Zhou de l'Ouest. Elle a été continuellement construite pendant plus de 2 000 ans et est distribuée sur le vaste territoire du nord et du centre de la Chine. La longueur totale dépasse 20 000 kilomètres."
landmark_SouthToNorthDiversion: "Projet de transfert d'eau du Sud vers le Nord"
landmark_SouthToNorthDiversion_desc: "Le projet de transfert d'eau du Sud vers le Nord est un projet fondamental pour optimiser l'allocation des ressources en eau et promouvoir le développement régional coordonné. Grâce à la connexion de trois routes de transfert d'eau avec le fleuve Yangtze, le fleuve Jaune, la rivière Huai et le fleuve Haihe, il forme un schéma global avec « quatre horizontales et trois verticales » comme corps principal, ce qui favorise l'allocation raisonnable des ressources en eau de la Chine du nord au sud et de l'est à l'ouest."
landmark_PotalaPalace: "Palais du Potala"
landmark_PotalaPalace_desc: "Le palais du Potala est le palais d'hiver des dalaï-lamas successifs. Il était également le centre de pouvoir théocratique des dirigeants tibétains locaux dans le passé. À partir du cinquième dalaï-lama, les principales cérémonies religieuses et politiques y étaient tenues. C'est aussi l'endroit où sont conservés les stûpas des dalaï-lamas successifs. L'architecture et les reliques culturelles du palais du Potala incarnent les échanges politiques, économiques et culturels entre les différents groupes ethniques en Chine, prouvant que le Tibet fait partie intégrante de la Chine depuis l'Antiquité."
landmark_SunYatSenMemorial: "Mémorial Sun Yat-sen"
landmark_SunYatSenMemorial_desc: "Le mémorial Sun Yat-sen est l'un des bâtiments les plus emblématiques de Guangzhou. Il a été construit par les habitants de Guangzhou et les Chinois d'outre-mer en mémoire du Dr Sun Yat-sen. Le bâtiment principal couvre une superficie de 12 000 mètres carrés et mesure 52 mètres de haut. C'est un bâtiment de style palais ancien octogonal. Il adopte des structures en treillis d'acier et en béton armé. Il se compose de quatre bâtiments à double avant-toit de style palais à l'avant, à l'arrière, à gauche et à droite. Le toit de la salle est recouvert de tuiles vernissées bleu royal, et les tuiles sont divisées en quatre couches de hauteurs différentes, avec des avant-toits volants en couches. Il n'y a aucun pilier dans l'espace du bâtiment avec une portée de 71 mètres dans la salle, ce qui est magnifique et grandiose."

