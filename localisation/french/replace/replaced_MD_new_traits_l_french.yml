CHI_set_renewable_energy_state_tt: "§YS'applique à toutes les provinces avec $renewable_capacity_factor_dyn_mod$ qui répondent aux conditions§!"
CHI_renewable_energy_state: "Promouvoir les énergies renouvelables"
CHI_renewable_energy_state_desc: "Le gouvernement local a investi des ressources dans le développement de centrales d'énergie renouvelable dans les points chauds des énergies renouvelables."
CHI_dev_space_renewable_energy: "Développer des centrales solaires spatiales"
CHI_dev_space_renewable_energy_desc: "Construire des équipements de production d'énergie solaire en orbite terrestre basse ou sur des planètes sans atmosphère peut efficacement améliorer le niveau global de développement énergétique."
CHI_unemployed_percentage_DOWN: "Encourager les gens à retourner à la campagne"
Selling_ships: "Vendre des navires"
Selling_ships_desc: "Vendre des navires de transport au public peut aider à compléter notre trésorerie."
Selling_cars: "Vendre des voitures"
Selling_cars_desc: "Vendre des voitures civiles au public peut aider à compléter mon trésor."
CHI_Expand_military_spending: "Augmenter les dépenses militaires"
CHI_Expand_military_spending_desc: "Les dépenses militaires de mon pays en pourcentage du PIB sont depuis longtemps inférieures à 1,5%. Peut-être pourrions-nous allouer une partie du budget aux dépenses militaires pour plaire à l'APL."
CHI_Expansion_of_state_owned_enterprises: "Expansion des entreprises d'État"
CHI_Expansion_of_state_owned_enterprises_desc: "Bien que nous nous soyons engagés à éliminer les entreprises d'État inefficaces depuis les années 1990, il est également nécessaire de fournir un soutien approprié."
CHI_Expansion_of_civil_service_enrollment: "Expansion du recrutement de la fonction publique"
CHI_Expansion_of_civil_service_enrollment_desc: "Élargir le recrutement de la fonction publique pour étendre le système administratif et réduire la pression de travail du personnel administratif."
CHI_market_for_technology: "Marché pour la technologie"
CHI_market_for_technology_desc: "\"Marché pour la technologie\" fait référence à l'établissement de quelques coentreprises automobiles sino-étrangères à la fin des années 1980, jusqu'à ce que la Chine rejoigne l'OMC, permettant aux grandes multinationales automobiles mondiales de créer des coentreprises en Chine et de produire localement. La Chine doit avoir ses propres entreprises de base, et les coentreprises doivent être basées sur une situation gagnant-gagnant et sur les intérêts à long terme de la Chine. Si nous abandonnons un énorme marché, nous serons qualifiés pour demander de la technologie et des profits."
CHI_reduce_CHI_backwash_of_big_layoff: "Réduire l'impact de $CHI_backwash_of_big_layoff$"
CHI_reduce_CHI_backwash_of_big_layoff_desc: "En investissant des ressources importantes, nous avons pu atténuer certains des effets indésirables."

CHI_Agricultural_development: "Décision de modernisation agricole"
CHI_Agricultural_development_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chi_agri\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]Chine§! est une §Gpuissance agricole§!. Avec seulement §Y7% des terres arables du monde§!, elle nourrit près de §Y20% de la population mondiale§! et crée près de §Y30% du PIB agricole mondial§!. Malgré cela, il est encore §Yassez difficile§! de nourrir notre peuple, ce qui nous oblige à améliorer davantage notre §Gproduction agricole§!.\n\n§RLe Parti communiste chinois§!, en élaborant le grand plan de §Yconstruction d'un pays socialiste moderne§!, a accordé une grande importance à l'agriculture. Le déploiement global du travail agricole et rural a été fait. En résumé : Nous devons promouvoir globalement la revitalisation rurale, réaliser fondamentalement la §Gmodernisation agricole§! d'ici 2035 et construire une §Gpuissance agricole§! d'ici le milieu de ce siècle. C'est le déploiement stratégique fait par le §RComité central du Parti§! en vue de §Yconstruire un pays socialiste moderne de manière globale§!. \n\n§YUn pays fort doit d'abord avoir une agriculture forte, et une agriculture forte ne peut faire un pays fort§!. Sans un pays agricole fort, il n'y aura pas de pays modernisé dans son ensemble ; sans modernisation agricole et rurale, la modernisation socialiste ne sera pas complète. Nous devons mettre l'accélération de la construction d'un pays agricole fort dans une position importante dans la construction d'un pays socialiste moderne, maintenir la détermination stratégique, travailler dur pendant longtemps, ancrer l'objectif de construire un pays agricole fort, faire des plans scientifiques et promouvoir le travail des \"trois rurales\". "
CHI_Promote_high_quality_fertilizers: "Promouvoir des engrais de haute qualité dans tout le pays"
CHI_Promote_high_quality_fertilizers_desc: "Les engrais de haute qualité peuvent réduire la consommation de fertilité du sol, tout en augmentant la teneur organique des cultures, fournissant aux gens des cultures plus saines et plus nutritives."
CHI_Songnen_Plain_Commodity_Grain_Base: "Base de céréales commerciales de la plaine de Songnen"
CHI_Songnen_Plain_Commodity_Grain_Base_desc: "La plaine de Songnen est la plus grande composante de la plaine du Nord-Est. Elle est située dans la zone centrale du bassin de Songliao entre les montagnes du Grand et du Petit Khingan, les montagnes Changbai et le bassin versant de Songliao. Elle est principalement formée par les dépôts alluviaux de la rivière Songhua et de la rivière Nen. La superficie des terres cultivées est de 5,59 millions d'hectares, et le sol est fertile, avec des sols noirs et des tchernozems représentant plus de 60%. Elle est riche en soja, blé, maïs, betterave à sucre, lin, pommes de terre, etc. C'est une base importante de céréales commerciales pour la province du Heilongjiang et le pays, avec un taux de commercialisation des céréales de plus de 30% ; les prairies sont concentrées, y compris les prairies de Qiqihar, Gannan, Longjiang, Tailai, Duerbert, Fuyu, Lindian, Daqing, Anda, Zhaodong, Zhaozhou, Zhaoyuan et d'autres villes et comtés, couvrant une superficie de plus de 2 millions d'hectares. Les prairies de première, deuxième et troisième catégorie composées d'espèces d'herbes dominantes telles que Leymus chinensis, Cinnamomum camphora, Vetch et Puccinellia tenuifolia représentent 76%, et l'élevage est bien développé."
CHI_Sanjiang_Plain_Commodity_Grain_Base: "Base céréalière de marchandises de la plaine de Sanjiang"
CHI_Sanjiang_Plain_Commodity_Grain_Base_desc: "La plaine de Sanjiang, autrefois appelée « Désert du Nord-Est », constitue la partie nord-est de la plaine du Nord-Est. Les « trois rivières » désignent le fleuve Heilongjiang, le fleuve Wusuli et le fleuve Songhua. Ces trois cours d’eau convergent ici pour former une terre fertile et plane. Après la fondation de la République populaire de Chine, une vaste mise en valeur agricole a été entreprise. Quatre bureaux de gestion de fermes d’État et plus de 50 grandes fermes d’État ont été établis, et plus de 46 millions de mu de terres arables ont été défrichés. Le « Désert du Nord-Est » est devenu le « Grenier du Nord », la plus grande zone de mise en valeur agricole de Chine et une importante base de production de céréales de marchandises, notamment pour le blé, le soja, le maïs, le riz, etc."

CHI_Panjin_Plain_Commodity_Grain_Base: "Zone de mise en valeur de Panjin, Liaoning"
CHI_Panjin_Plain_Commodity_Grain_Base_desc: "La zone de mise en valeur de Panjin, dans la province du Liaoning, autrefois connue sous le nom de « Désert du Sud », a été développée après la libération, et une partie des terres en friche a été transformée en ferme d’État. La zone de mise en valeur de Panjin est riche en ressources et propice au développement intégré de l’agriculture, de la sylviculture, de l’élevage, des activités secondaires et de la pêche."

CHI_Dongtinghu_Plain_Commodity_Grain_Base: "Base céréalière de marchandises de la plaine du lac Dongting"
CHI_Dongtinghu_Plain_Commodity_Grain_Base_desc: "La plaine du lac Dongting est située dans le nord-est de la province du Hunan, dans la partie sud du bassin des deux lacs (également appelé bassin du Hubei), et est reliée à la plaine de Jianghan, dans le Hubei, au nord. Elle est principalement formée par les sédiments apportés par le fleuve Yangtze à travers les quatre sorties de Songzi, Taiping, Ouchi et Diaoxian, ainsi que par les sédiments des rivières Xiangjiang, Zijiang, Yuanjiang et Lishui du système du lac Dongting. Elle couvre une superficie de 10 000 kilomètres carrés. La surface du lac se trouve à 34,5 mètres au-dessus du niveau de la mer, avec une capacité totale de 17,8 milliards de mètres cubes, surnommée les « huit cents miles du lac Dongting ». La superficie totale de la plaine est de 18 780 kilomètres carrés, dont 15 200 kilomètres carrés dans le Hunan, soit 81 % de la superficie totale, couvrant 19 comtés et villes tels que Changde, Yiyang, Xiangyin, Yueyang, et 15 fermes d’État comme la ferme de Cendan ; la partie du Hubei représente 3 580 kilomètres carrés, soit 19 %, et inclut les comtés et villes de Songzi, Gong’an, Shishou, entre autres."

CHI_Jianghan_Plain_Commodity_Grain_Base: "Base céréalière de marchandises de la plaine de Jianghan"
CHI_Jianghan_Plain_Commodity_Grain_Base_desc: "La plaine de Jianghan est située dans la partie sud-centrale de la province du Hubei, la « Province aux mille lacs » en Chine centrale. Elle tire son nom des dépôts alluviaux du fleuve Yangtze et de la rivière Han. La plaine de Jianghan se trouve dans les parties ouest et centrale du bassin des deux lacs. Elle est traversée par un réseau de rivières et parsemée de lacs. Elle constitue une partie essentielle de la plaine du cours moyen du Yangtze. Avec la plaine du lac Dongting, elle forme la plaine des deux lacs. Son altitude moyenne est d’environ 27 mètres, ce qui en fait l’une des plaines les plus basses de Chine.\n\nLa plaine de Jianghan est riche en produits. « On dit que le paradis est magnifique, mais comment peut-il rivaliser avec la terre de poisson et de riz de Jianghan ? » Cette phrase en est une fidèle description. La plaine de Jianghan est l’une des rares régions de notre pays capables de produire en grandes quantités du riz, du blé, du millet, du coton, du chanvre, de l’huile, du sucre, du poisson et des légumes. Elle cultive principalement du riz, du coton et du colza. Les rendements élevés en riz offrent une garantie matérielle solide pour la vie des habitants locaux."

CHI_Chengdu_Plain_Commodity_Grain_Base: "Base céréalière de marchandises de la plaine de Chengdu"
CHI_Chengdu_Plain_Commodity_Grain_Base_desc: "Le Sichuan est une province agricole et peuplée de grande importance en Chine. Elle est connue depuis l’Antiquité comme la « Terre d’Abondance ». Aujourd’hui, elle est l’une des 13 principales provinces productrices de céréales en Chine et la seule province céréalière majeure de l’ouest. En juin 2022, le secrétaire général Xi Jinping a visité le Sichuan et a souligné que la plaine de Chengdu est connue depuis l’Antiquité comme la « Terre d’Abondance ». Nous devons strictement respecter la ligne rouge des terres cultivées, protéger cette précieuse terre de production céréalière, maîtriser fermement la production de céréales et construire un « Grenier de la Terre d’Abondance » de niveau supérieur à l’ère nouvelle."

CHI_Pearl_River_Delta_Commodity_Grain_Base: "Base céréalière de marchandises du delta de la rivière des Perles"
CHI_Pearl_River_Delta_Commodity_Grain_Base_desc: "La plaine du delta de la rivière des Perles est située dans la partie sud-centrale de la province du Guangdong, couvrant une superficie d’environ 11 000 kilomètres carrés, avec une altitude moyenne d’environ 50 mètres, un réseau de rivières entrelacées et des collines isolées dispersées. La plaine du delta de la rivière des Perles est formée par la confluence de trois grands fleuves à l’est, à l’ouest et au nord, avec une superficie dépassant 10 000 kilomètres carrés, ce qui en fait l’une des bases céréalières de marchandises de Chine. Bien que sa superficie ne soit pas vaste, sa productivité est élevée, capable de nourrir près d’un millier de personnes par kilomètre carré. C’est la plaine la mieux développée de la région tropicale."

CHI_Poyanghu_Plain_Commodity_Grain_Base: "Base céréalière de marchandises de la plaine du lac Poyang"
CHI_Poyanghu_Plain_Commodity_Grain_Base_desc: "La plaine du lac Poyang, également connue sous le nom de plaine de Yuzhang ou bassin du lac Poyang, est une partie importante du bassin de Nanchang. C’est une plaine lacustre formée par les dépôts alluviaux du fleuve Yangtze et des affluents du lac Poyang, tels que les rivières Ganjiang, Fuhe, Xinjiang, Xiuhe et Raohe. Elle fait partie de la plaine des cours moyen et inférieur du Yangtze. La plaine est parsemée de rizières, de parcelles de légumes, d’étangs à poissons et de lacs de lotus. C’est le grenier du Jiangnan et une base importante pour la production de coton, d’huile, de porcs, etc."

CHI_Yangtze_River_delta_Commodity_Grain_Base: "Base céréalière de marchandises du delta du Yangtze"
CHI_Yangtze_River_delta_Commodity_Grain_Base_desc: "Une bande de plaine le long des cours moyen et inférieur du fleuve Yangtze en Chine, à l’est des gorges des trois fleuves. Elle est délimitée au nord par les collines de Huaiyang et la plaine de Huanghuai, et au sud par les collines de Jiangnan et les collines de Zhejiang-Fujian. Elle a été formée par les dépôts alluviaux du Yangtze et de ses affluents. Elle couvre une superficie d’environ 200 000 kilomètres carrés et présente un relief bas. La plupart des sols sont des sols de rizières, avec une agriculture développée et un indice de mise en valeur des terres élevé. C’est une base importante pour la production de céréales, de coton et d’huile, riche en riz, blé, coton, colza, vers à soie, ramie, jute, etc. Elle produit du poisson, des crevettes, des crabes, du lotus, des châtaignes d’eau, des roseaux, ainsi que des trésors mondiaux comme l’esturgeon chinois, l’alligator du Yangtze et le dauphin de Baiji. Les produits aquatiques jouent un rôle important en Chine, et elle est connue comme la terre du poisson et du riz."

CHI_Huaihe_Plain_delta_Commodity_Grain_Base: "Base céréalière de marchandises du delta de la plaine de Huaihe"
CHI_Huaihe_Plain_delta_Commodity_Grain_Base_desc: "La plaine de Huaihe est située dans la partie nord de la province d’Anhui. C’est la principale plaine de la province. Elle couvre toutes les zones au nord de la rivière Huaihe et une bande d’environ 10 à 60 kilomètres de large au sud de la rivière Huaihe. Après près de 30 ans de transformation, elle est maintenant couverte d’arbres verts et regorge de fleurs et de fruits. Cependant, en raison de la forte teneur en sels solubles dans le sol, en particulier dans la partie nord de Suxian, où les dépôts d’inondation du fleuve Jaune, épais de 10 à 20 mètres, augmentent la quantité totale de sels solubles dans la couche de sol, le sol est sujet à la salinisation et à l’alcalinisation."

CHI_Hexi_Corridor_Commodity_Grain_Base: "Base céréalière de marchandises du corridor de Hexi"
CHI_Hexi_Corridor_Commodity_Grain_Base_desc: "La zone agricole irriguée du corridor de Hexi a une longue histoire. C’est l’une des zones agricoles importantes de la province du Gansu. C’est une zone agricole irriguée célèbre dans le nord-ouest intérieur de notre pays et la plus importante base céréalière de marchandises et zone de production concentrée de cultures commerciales dans le nord-ouest. Elle fournit plus des deux tiers des céréales de marchandises, presque tout le coton, 9/10 des betteraves à sucre, plus de 2/5 des oléagineux, de l’orge de brasserie, des fruits et légumes de la province du Gansu. La zone d’oasis plate cultive principalement du blé de printemps, de l’orge, du millet, du maïs, et une petite quantité de riz, de sorgho et de pommes de terre. La principale culture oléagineuse est le sésame. Les melons incluent la pastèque, la courge et le melon miel. Les principaux arbres fruitiers sont le jujube, la poire et la pomme. La zone de piémont cultive principalement des céréales d’été, notamment de l’orge des hauts plateaux, du seigle, des fèves, des pois, des pommes de terre et du colza. Hexi possède une industrie d’élevage développée. Par exemple, Shandan Mayingtan est une célèbre ferme de chevaux militaires depuis l’Antiquité."

CHI_Nei_Mongol_Commodity_Grain_Base: "Base céréalière de marchandises de Mongolie intérieure"
CHI_Nei_Mongol_Commodity_Grain_Base_desc: "La Mongolie intérieure est une base importante de production de céréales de marchandises en Chine, avec des avantages traditionnels dans le développement de la production céréalière. La production céréalière de la Mongolie intérieure est restée supérieure à 30 millions de tonnes pendant cinq années consécutives, et c’est l’une des six provinces et régions de Chine qui exportent net des céréales de marchandises. La production totale de viande de la région a atteint 2,676 millions de tonnes, et la production totale de lait a atteint 6,93 millions de tonnes. Elle a la capacité d’exporter 5 millions de tonnes de lait et 1,5 million de tonnes de viande vers d’autres régions chaque année, ce qui en fait un véritable « grenier », « entrepôt de viande » et « réservoir de lait » du pays."

CHI_Hetao_Plain_Commodity_Grain_Base: "Base céréalière de marchandises de la plaine de Hetao, Ningxia"
CHI_Hetao_Plain_Commodity_Grain_Base_desc: "La plaine de Ningxia, également connue sous le nom de plaine de Yinchuan, est située des deux côtés du fleuve Jaune dans la partie centrale de la région autonome Hui du Ningxia. Elle a été formée par l’impact du fleuve Jaune. Elle présente un relief plat, un sol profond, une facilité d’irrigation par dérivation et est propice à l’irrigation par gravité. Bien qu’elle soit située dans une zone aride tempérée avec des précipitations annuelles inférieures à 200 mm, le volume d’eau annuel moyen du fleuve Jaune dépasse 30 milliards de mètres cubes. De plus, avec 3 000 heures d’ensoleillement par an, les ressources agricoles naturelles telles que la lumière, la chaleur, l’eau et le sol sont bien coordonnées, offrant des conditions extrêmement favorables au développement de l’agriculture, de la sylviculture, de l’élevage et de la pêche. Le blé et le riz ont des rendements élevés et stables, et les baies de goji, melons et fruits sont d’excellente qualité. Les lacs et marais près de Yinchuan constituent la base aquatique du Ningxia, et les vastes prairies au pied des monts Helan sont une zone de production importante pour les moutons de plage du Ningxia."

CHI_Xinjiang_Production_and_Construction_Corps_Reclamation_Area: "Zone de mise en valeur du Corps de production et de construction du Xinjiang"
CHI_Xinjiang_Production_and_Construction_Corps_Reclamation_Area_desc: "Le Corps de production et de construction du Xinjiang, appelé « Corps du Xinjiang », est une région administrative spéciale de la République populaire de Chine, avec son siège à Urumqi. Il assume les responsabilités confiées par l’État pour la garde et la protection des frontières. Le Corps du Xinjiang est situé à l’intersection de l’Europe et de l’Asie, où les espèces animales et végétales de l’Est et de l’Ouest se rencontrent. De plus, les conditions géographiques naturelles diverses et uniques en font une région riche en ressources biologiques. Le Corps du Xinjiang cultive une gamme complète de cultures tempérées, avec le blé, le maïs et le riz comme principales cultures alimentaires. Le sorgho, l’orge, le soja, les pois, les haricots mungo, les fèves, le millet, le sorgho, les patates douces et autres céréales peuvent être cultivés dans la plupart des régions du Xinjiang. La vallée de la rivière Ili est connue comme le « grenier du Xinjiang »."

CHI_North_South_Water_Transfer_decision: "Décision du projet de transfert d’eau du Sud vers le Nord"
CHI_North_South_Water_Transfer_decision_desc: "\n\n\n\n\n\n\n£MAIN_desctext_snwd\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]La Chine§! souffre d’une §Rpenurie générale de ressources en eau§!, avec une répartition extrêmement inégale dans le temps et l’espace, et des inondations et sécheresses fréquentes. C’est l’un des pays au monde avec la §Rsituation hydrique la plus complexe, la gestion des rivières la plus difficile et les tâches de gestion de l’eau les plus ardues§!. En 1952, §Rle camarade Mao Zedong§!, lors de son inspection du fleuve Jaune, a proposé : « §lIl y a plus d’eau dans le sud et moins dans le nord. Si possible, il est envisageable d’emprunter un peu d’eau§! » C’était la première fois que l’idée grandiose du transfert d’eau du Sud vers le Nord était proposée. Depuis lors, après avoir analysé et comparé plus de 50 plans, le projet de transfert d’eau a obtenu de nombreux résultats précieux.\n\nLa zone de planification du projet de transfert d’eau du Sud vers le Nord concerne une population de 438 millions de personnes et une échelle de transfert d’eau de 448 100 milliards de mètres cubes, divisée en §Yvoies est, centrale et ouest§!, avec une longueur totale de 4 350 kilomètres. La longueur totale de la première phase des voies est et centrale est de 2 899 kilomètres, et les canaux secondaires de soutien de premier niveau dans les six provinces et villes le long du tracé s’étendent sur environ 2 700 kilomètres. Le projet de transfert d’eau du Sud vers le Nord vise principalement à résoudre le problème de pénurie d’eau dans le §YNord de la Chine§!, en particulier dans le §Ybassin de la rivière Huanghuai§!.\n\nLe §Yprojet de la voie ouest§! est situé sur le plateau Qinghai-Tibet, à haute altitude, avec une structure géologique complexe et une forte intensité sismique. Il nécessite également la construction d’un barrage de 200 mètres de haut et d’un tunnel de plus de 100 kilomètres. La technologie d’ingénierie est complexe et le coût est énorme. Il est encore en phase d’étude de faisabilité. Mais si le moment est opportun, nous construirons ce §Yprojet hydraulique le plus grand et le plus difficile au monde§! d’un seul coup, résolvant le problème de §Rpenurie de ressources en eau§! pour d’innombrables Chinois §Yune fois pour toutes§!."

CHI_Central_Line_Projec_Resettlement: "Réinstallation des populations déplacées"
CHI_Central_Line_Projec_Resettlement_desc: "Le projet de transfert d’eau du Sud vers le Nord est un projet positif pour le bien-être social. La construction de la voie centrale permettra de reloger la plupart des 300 000 migrants dans des lieux offrant de meilleures conditions de vie, ce qui améliorera considérablement l’environnement écologique autour du réservoir et rehaussera le niveau de vie des migrants."

CHI_Central_Line_Projec_Danjiangkou_Reservoir: "Rehaussement du barrage du réservoir de Danjiangkou"
CHI_Central_Line_Projec_Danjiangkou_Reservoir_desc: "Nous allons d’abord rehausser la hauteur du barrage principal de Danjiangkou, pour augmenter le niveau d’eau du réservoir de Danjiangkou, et utiliser le nouveau canal artificiel pour transporter l’eau vers le canal principal."

CHI_Central_Line_Projec_Drilling_through_Yellow_River: "Projet de percement du canal principal de la voie centrale à travers le fleuve Jaune"
CHI_Central_Line_Projec_Drilling_through_Yellow_River_desc: "Le tunnel du fleuve Jaune est le plus grand, le plus long, le plus exigeant techniquement et le plus complexe en termes de structure transversale du projet de transfert d’eau du Sud vers le Nord. Le projet du tunnel du fleuve Jaune a débuté le 27 septembre 2005 et a duré 9 ans. Le débit prévu est de 265 mètres cubes par seconde, avec un débit accru de 320 mètres cubes par seconde."

CHI_Central_Line_Projec_henan_main_canal: "Section Henan du canal principal de la voie centrale"
CHI_Central_Line_Projec_henan_main_canal_desc: "Le canal principal relie les bassins du Yangtze, de la Huaihe, du fleuve Jaune et de la Haihe. Il doit traverser le cours principal du fleuve Jaune et 219 autres rivières avec un bassin versant de plus de 10 kilomètres carrés, croiser 44 voies ferrées et nécessiter la construction de 571 ponts routiers au-dessus du canal principal. De plus, il comprend des vannes de contrôle, des vannes de dérivation d’eau, des structures de prélèvement d’eau, des tunnels, des ponceaux, etc. Au total, il y a 936 constructions de divers types sur le canal principal."

CHI_Central_Line_Projec_hebei_main_canal: "Section Hebei du canal principal de la voie centrale"
CHI_Central_Line_Projec_hebei_main_canal_desc: "Le canal principal relie les quatre grands bassins du Yangtze, de la Huaihe, du fleuve Jaune et de la Haihe. Il doit traverser le cours principal du fleuve Jaune et 219 autres rivières avec un bassin versant de plus de 10 kilomètres carrés, croiser 44 voies ferrées et nécessiter la construction de 571 ponts routiers au-dessus du canal principal. De plus, il comprend des vannes de contrôle, des vannes de dérivation d’eau, des structures de prélèvement d’eau, des tunnels, des ponceaux, etc. Au total, il y a 936 constructions de divers types sur le canal principal."

CHI_Central_Line_Projec_beijing_water_conveyance_tunnel: "Projet de tunnel de transport d’eau de la section Pékin de la voie centrale, quatrième périphérique ouest"
CHI_Central_Line_Projec_beijing_water_conveyance_tunnel_desc: "Le projet de ponceau du quatrième périphérique ouest de la section Pékin de la voie centrale du projet de transfert d’eau du Sud vers le Nord comprend deux tunnels de transport d’eau sous pression d’un diamètre intérieur de 4 mètres, qui passent sous la station de métro Wukesong à Pékin. C’est la première fois au monde qu’un tunnel de transport d’eau sous pression de grand diamètre, enfoui à faible profondeur, passe sous une station de métro en fonctionnement, établissant un record avec seulement 3,67 mètres entre le sommet de la structure du ponceau et la structure du métro, et une valeur maximale de tassement de la structure du métro inférieure à 3 mm."

CHI_Central_Line_Projec_tianjin_main_canal: "Section Tianjin du canal principal de la voie centrale"
CHI_Central_Line_Projec_tianjin_main_canal_desc: "Le canal principal de Tianjin traverse 48 rivières et ruisseaux et compte 119 constructions."

CHI_Central_Line_Projec_beijing_main_canal: "Section Pékin du canal principal de la voie centrale"
CHI_Central_Line_Projec_beijing_main_canal_desc: "Le canal principal relie les bassins du Yangtze, de la Huaihe, du fleuve Jaune et de la Haihe. Il doit traverser le cours principal du fleuve Jaune et 219 autres rivières avec un bassin versant de plus de 10 kilomètres carrés, croiser 44 voies ferrées et nécessiter la construction de 571 ponts routiers au-dessus du canal principal. De plus, il comprend des vannes de contrôle, des vannes de dérivation d’eau, des structures de prélèvement d’eau, des tunnels, des ponceaux, etc. Au total, il y a 936 constructions de divers types sur le canal principal."

central_line_officially_began_carrying_water: "La voie centrale du projet de transfert d’eau du Sud vers le Nord a officiellement commencé à transporter de l’eau"
central_line_officially_began_carrying_water_desc: "La voie centrale du projet de transfert d’eau du Sud vers le Nord a officiellement commencé à transporter de l’eau, évitant aux provinces du Henan, du Hebei, de Pékin et de Tianjin de souffrir de pénuries d’eau."

CHI_East_Line_Projec_Connecting_the_Grand_Canal_between_Beijing_and_Hangzhou: "Connexion du Grand Canal entre Pékin et Hangzhou"
CHI_East_Line_Projec_Connecting_the_Grand_Canal_between_Beijing_and_Hangzhou_desc: "Le Grand Canal sera la principale ligne d’approvisionnement en eau, et les rivières Sanyang, Huaihe et Xuhong seront utilisées pour la distribution. Sur la base des projets existants, les rivières Sanyang et Tonghe, le canal Jinbao, le canal d’approvisionnement en eau de la station quatre de Huai’an, le canal central au nord du lac Luoma, le canal Liangji et la rivière Liuchang seront agrandis ; les quatre lacs du Sud seront dragués ; des projets de traitement des impacts des rivières Xuhong et du canal central au sud du lac Luoma seront mis en place ; et les rivières Gaoshui et le canal Hanzhuang au-dessus de la station Jiangdu seront partiellement dragués."

CHI_East_Line_Projec_Drilling_through_Yellow_River_east: "Projet de percement du canal principal de la voie est à travers le fleuve Jaune"
CHI_East_Line_Projec_Drilling_through_Yellow_River_east_desc: "Percement d’un tunnel à siphon inversé de 9,3 mètres de diamètre avec une capacité de transport d’eau de 200 mètres cubes par seconde."

CHI_East_Line_Projec_Jiaodong_area_water_supply_main_line: "Ligne principale d’approvisionnement en eau de la région de Jiaodong"
CHI_East_Line_Projec_Jiaodong_area_water_supply_main_line_desc: "Creuser le chenal fluvial de 240 kilomètres dans la section ouest de la ligne principale d’approvisionnement en eau de la région de Jiaodong pour transporter l’eau détournée vers l’est du Shandong."

CHI_East_Line_Projec_Lubei_Water_Transfer_Main_Line: "Ligne principale de transfert d’eau de Lubei"
CHI_East_Line_Projec_Lubei_Water_Transfer_Main_Line_desc: "De la sortie du tunnel Chuanhuang à Dezhou, agrandir la rivière Xiaoyun et les rivières Qiyi et Liuwu, et transporter l’eau détournée vers les régions ouest, centrale et nord du Shandong."

east_line_officially_began_carrying_water: "La voie est du projet de transfert d’eau du Sud vers le Nord a officiellement commencé à transporter de l’eau"
east_line_officially_began_carrying_water_desc: "La voie est du projet de transfert d’eau du Sud vers le Nord a officiellement commencé à transporter de l’eau, évitant aux provinces du Jiangsu, de l’Anhui et du Shandong de souffrir de pénuries d’eau."

CHI_West_Line_Aan_Water_diversion_hub: "Centre de dérivation d’eau d’Aan"
CHI_West_Line_Aan_Water_diversion_hub_desc: "La dérivation d’eau commence à Daqu, un affluent de la rivière Yalong, et le centre de dérivation d’eau d’Aan est construit pour détourner 700 millions de mètres cubes d’eau."

CHI_West_Line_Niqu_water_conveyance_tunnel: "Projet de tunnel de transport d’eau de Niqu"
CHI_West_Line_Niqu_water_conveyance_tunnel_desc: "L’eau détournée du centre de dérivation d’eau d’Aan sera envoyée à Niqu à travers le tunnel de la ligne de partage des eaux."

CHI_West_Line_Renda_Water_diversion_hub: "Centre de dérivation d’eau de Renda"
CHI_West_Line_Renda_Water_diversion_hub_desc: "Construire le centre de dérivation d’eau de Renda, pour détourner 800 millions de mètres cubes d’eau."

CHI_West_Line_Kedu_water_conveyance_tunnel: "Projet de tunnel de transport d’eau de la rivière Kedu"
CHI_West_Line_Kedu_water_conveyance_tunnel_desc: "L’eau détournée du centre de dérivation d’eau de Renda est envoyée à la rivière Duke à travers la ligne de partage des eaux entre la rivière Yalong et la rivière Dadu par le tunnel de dérivation."

CHI_West_Line_Shangduke_Water_diversion_hub: "Centre de dérivation d’eau de Shangduke"
CHI_West_Line_Shangduke_Water_diversion_hub_desc: "Construction du centre de dérivation d’eau de Shangduke, détournant 1,15 milliard de mètres cubes d’eau."

CHI_West_Line_Maerqu_water_conveyance_tunnel: "Projet de tunnel de transport d’eau de Maerqu"
CHI_West_Line_Maerqu_water_conveyance_tunnel_desc: "L’eau détournée du centre de dérivation d’eau de Shangduke est envoyée à Maerqu à travers la ligne de partage des eaux par le tunnel de dérivation."

CHI_West_Line_Yaertang_Water_diversion_hub: "Centre de dérivation d’eau de Yaertang"
CHI_West_Line_Yaertang_Water_diversion_hub_desc: "Construire le centre de dérivation d’eau de Yaertang, détournant 1,15 milliard de mètres cubes d’eau."

CHI_West_Line_Ake_water_conveyance_tunnel: "Projet de tunnel de transport d’eau de la rivière Ake"
CHI_West_Line_Ake_water_conveyance_tunnel_desc: "L’eau détournée du complexe de dérivation d’eau de Yaertang est transportée vers la rivière Ake à travers le tunnel de la ligne de partage des eaux."

CHI_West_Line_Keke_Water_diversion_hub: "Centre de dérivation d’eau de Keke"
CHI_West_Line_Keke_Water_diversion_hub_desc: "Construire le centre de dérivation d’eau de Keke, détournant 200 millions de mètres cubes d’eau."

CHI_West_Line_Dadu_River_water_conveyance_tunnel: "Projet de tunnel de transport d’eau de la rivière Dadu"
CHI_West_Line_Dadu_River_water_conveyance_tunnel_desc: "L’eau détournée du centre de dérivation d’eau de Keke est envoyée à Jiaqu, un affluent du fleuve Jaune, à travers le tunnel de dérivation qui traverse la ligne de partage des eaux entre la rivière Dadu et le fleuve Jaune."

CHI_West_Line_Excavate_open_channels_Jiaqu_Left_Bank: "Creusement de canaux ouverts sur la rive gauche de Jiaqu"
CHI_West_Line_Excavate_open_channels_Jiaqu_Left_Bank_desc: "Après la sortie du tunnel de Jiaqu, un canal ouvert est creusé le long de la rive gauche de Jiaqu pour transporter l’eau vers le fleuve Jaune."

west_line_officially_began_carrying_water: "La voie ouest du projet de transfert d’eau du Sud vers le Nord a officiellement commencé à transporter de l’eau"
west_line_officially_began_carrying_water_desc: "La voie ouest du projet de transfert d’eau du Sud vers le Nord a officiellement commencé à transporter de l’eau, évitant aux provinces du Gansu, du Ningxia, du Shaanxi, du Shanxi et de la Mongolie intérieure de souffrir de pénuries d’eau."

