##aerospace##
cnsa.1.t:0 "La Chine achève son premier vol spatial habité"
cnsa.1.d:0 "Le vaisseau spatial habité Shenzhou V, développé de manière indépendante par la Chine, a été lancé avec succès au Centre de lancement de satellites de Jiuquan à l'aide de la fusée porteuse Longue Marche 2F, envoyant le premier astronaute chinois Yang Liwei dans l'espace. Le vaisseau spatial est entré avec précision sur l'orbite prévue. C'est le premier vol spatial habité de la Chine, faisant d'elle le troisième pays au monde capable de mener de manière indépendante des activités spatiales habitées."
cnsa.1.a:0 "Le voyage spatial n'a pas de frontières"
cnsa.1.b:0 "Grands exploits"
cnsa.2.t:0 "Vol habité de Shenzhou VI"
cnsa.2.d:0 "Shenzhou VI est le premier vaisseau spatial chinois à effectuer une mission \"multi-personnes, multi-jours\". Le vaisseau spatial a été lancé du Centre de lancement de satellites de Jiuquan en Chine et a atterri à Siziwang Banner, en Mongolie intérieure, cinq jours plus tard. Les astronautes étaient Fei Junlong et Nie Haisheng. Cela marque une autre étape importante dans le développement des vols spatiaux habités de la Chine."
cnsa.2.a:0 "Le voyage spatial n'a pas de frontières"
cnsa.2.b:0 "Un jalon"
cnsa.3.t:0 "Première sortie dans l'espace des astronautes chinois"
cnsa.3.d:0 "Shenzhou VII est le troisième vaisseau spatial habité de la Chine et l'un des vaisseaux spatiaux de la série \"Shenzhou\". Il a été lancé du Centre de lancement de satellites de Jiuquan en Chine. Shenzhou VII transportait trois astronautes, à savoir Zhai Zhigang (commandant), Liu Boming et Jing Haipeng. Après le décollage, Zhai Zhigang et Liu Boming ont porté respectivement la combinaison spatiale extravéhiculaire fabriquée en Chine \"Feitian\" et la combinaison spatiale extravéhiculaire fabriquée en Russie \"Haiying\" et sont entrés dans le module orbital du vaisseau spatial habité Shenzhou VII, qui servait également de sas. Zhai Zhigang a effectué l'opération extravéhiculaire et Liu Boming a assisté dans le module orbital, réalisant la première sortie dans l'espace de l'histoire chinoise, faisant de la Chine le troisième pays capable d'envoyer des astronautes dans l'espace et de marcher dans l'espace."
cnsa.3.a:0 "Une mission difficile"
cnsa.3.b:0 "Percée majeure"
cnsa.4.t:0 "La Chine lance son premier satellite d'exploration lunaire"
cnsa.4.d:0 "Chang'e-1 est le premier satellite artificiel en orbite autour de la lune dans le programme d'exploration lunaire de la Chine. [GetDateText], Chang'e-1 a été lancé du Centre de lancement de satellites de Xichang. Le succès de la première exploration lunaire de Chang'e-1 a établi le troisième jalon du programme spatial chinois, brisant un grand nombre de technologies de base et de technologies clés avec des droits de propriété intellectuelle indépendants, faisant de la Chine l'un des rares pays au monde à avoir des capacités d'exploration de l'espace lointain."
cnsa.5.t:0 "La Chine lance la sonde Chang'e 2"
cnsa.5.d:0 "Chang'e 2 est le deuxième satellite lunaire de la Chine. C'est une amélioration technique du satellite de secours de Chang'e 1 dans la première phase du projet d'exploration lunaire. C'est le satellite pilote de la deuxième phase du projet et est nommé Chang'e 2. Chang'e 2 est principalement utilisé pour tester et vérifier certaines nouvelles technologies et équipements, réduire les risques des futurs projets et approfondir l'exploration scientifique de la lune."
cnsa.5.a:0 "Ambitieux"
cnsa.5.b:0 "Notre voyage est vers la mer d'étoiles"
cnsa.4.a:0 "Ambitieux"
cnsa.4.b:0 "C'est notre idéal millénaire"
cnsa.6.t:0 "Tiangong-1 lancé"
cnsa.6.d:0 "La Chine a lancé son premier vaisseau spatial cible nouvellement développé, Tiangong-1, dans l'espace à l'aide de la fusée porteuse Longue Marche 2F T1 au Centre de lancement de satellites de Jiuquan. En tant que vaisseau spatial cible, Tiangong-1 est différent du Skylab ou des modules de base et expérimentaux de la station spatiale. Son but est uniquement de servir de jonction pour d'autres vaisseaux spatiaux et il ne restera pas longtemps dans l'espace."
cnsa.6.a:0 "Nous devons prêter attention au développement de la Chine dans l'espace"
cnsa.6.b:0 "Notre voyage est vers la mer d'étoiles"
cnsa.7.t:0 "La mission Shenzhou 8 est un succès"
cnsa.7.d:0 "Shenzhou VIII est un vaisseau spatial sans pilote lancé par la Chine. Après avoir terminé le rendez-vous et l'amarrage avec le Tiangong-1 précédemment lancé, Shenzhou VIII est automatiquement retourné sur Terre. Par la suite, Chang Wanquan, commandant en chef du programme spatial habité de la Chine et directeur du Département général de l'armement, a annoncé que selon le rapport du site d'atterrissage, la capsule de retour du vaisseau spatial Shenzhou VIII a atterri en toute sécurité sur le site d'atterrissage principal en Mongolie intérieure. La mission de rendez-vous et d'amarrage spatial entre Tiangong-1 et Shenzhou VIII a été un succès complet, complétant la première expérience de rendez-vous et d'amarrage spatial de la Chine."
cnsa.7.a:0 "Une autre percée dans la technologie spatiale chinoise"
cnsa.7.b:0 "Nous sommes à un pas de plus de la réalisation de notre station spatiale"
cnsa.8.t:0 "Shenzhou 9 lancé"
cnsa.8.d:0 "La fusée Longue Marche 2F Yao-9 transportant le vaisseau spatial Shenzhou 9 a décollé du Centre de lancement de satellites de Jiuquan. C'est le 165e lancement de la fusée Longue Marche et le quatrième vol habité du vaisseau spatial Shenzhou. À ce moment, Tiangong-1 attend dans l'espace à environ 10 000 kilomètres du vaisseau spatial pour que Shenzhou 9 \"vienne au rendez-vous\"."
cnsa.8.a:0 "Une autre percée dans la technologie spatiale chinoise"
cnsa.8.b:0 "Les femmes sont aussi bonnes que les hommes"
cnsa.9.t:0 "La mission Shenzhou 9 est un succès"
cnsa.9.d:0 "Aujourd'hui, Shenzhou 9 est retourné dans la patrie avec trois héros de l'espace à bord. La mission a été un succès complet. Le succès complet de la mission de Shenzhou 9 marque une réalisation majeure dans la deuxième étape du programme spatial habité et jette de bonnes bases pour le développement futur des vols spatiaux habités et la construction de stations spatiales."
cnsa.9.a:0 "Une autre percée dans la technologie spatiale chinoise"
cnsa.9.b:0 "Retour des héros"
cnsa.10.t:0 "La mission Shenzhou 10 est un succès"
cnsa.10.d:0 "Shenzhou-10 est la dixième mission de la série de vaisseaux spatiaux \"Shenzhou\" de la Chine et la cinquième mission de vol spatial habité de la Chine. Il transporte trois astronautes pour effectuer un rendez-vous et un amarrage sans pilote et habité avec le vaisseau spatial cible Tiangong-1. Après l'amarrage réussi, deux astronautes masculins et un astronaute féminin sont entrés dans Tiangong-1. C'est la dernière mission d'amarrage entre le vaisseau spatial Shenzhou et Tiangong-1. Le vaisseau spatial se compose d'un module de propulsion (module de service), d'un module de retour et d'un module orbital. Y compris le lancement et le retour, Shenzhou-10 sera en orbite pendant environ 15 jours, dont 12 jours dans Tiangong-1. Son module de retour atterrira sur le site d'atterrissage de Siziwang Banner en Mongolie intérieure."
cnsa.10.a:0 "Une autre percée dans la technologie spatiale chinoise"
cnsa.10.b:0 "Retour des héros"
