chinese_space_program_moonbase: "Base lunaire chinoise"
chinese_space_program_moonbase_desc: "\n\n\n\n\n\n\n£MAIN_desctext_moonbase\n\n\n\n\n\n\n\n\n§Y« La montée et la chute du soleil et de la lune semblent provenir de cet océan vaste. Les étoiles de la Voie lactée brillent, comme si elles émergeaient de cet océan vaste »§! §YLa lune§! est un symbole culturel qui préoccupe le peuple chinois depuis l’Antiquité. Pour notre peuple, le premier pas vers §Cl’exploration spatiale§! doit être de construire une §Cbase lunaire§! sur la lune qui appartient à la Chine et à l’humanité. Grâce à notre technologie spatiale et de construction avancée, nous pouvons construire une base à long terme sur la lune.\n\nNombre actuel de matériaux de construction : [?CHI_space_program_moonbase_building_materials|Y] ; complétion des installations résidentielles : [?CHI_space_program_moonbase_residential_system|Y%] ; complétion du système de survie : [?CHI_space_program_moonbase_life_support_system|Y%] ; complétion du système de recherche scientifique : [?CHI_space_program_moonbase_research_system|Y%] ; complétion du système opérationnel : [?CHI_space_program_moonbase_operating_system|Y%]\n\nLorsque la complétion de chaque système atteint §G100 %§!, nous pourrons déclarer la base lunaire achevée."

