CHI_special_administrative_region_annex: "Administrer directement la Région administrative spéciale"
Chinese_Internet_adjective_desc_1: "Ère actuelle : §HÈre des portails§!\nÀ l'ère actuelle, l'Internet chinois agrège d'énormes quantités d'informations (actualités, informations, services) sur une plateforme unifiée de manière dirigée par des éditeurs et filtrée manuellement. Ils sont le principal « portail » pour les utilisateurs entrant dans le monde en ligne. Sa forme reflète les caractéristiques du Web1.0 précoce : le flux d'informations est principalement unidirectionnel, et les utilisateurs sont des récepteurs passifs d'informations. Ces plateformes ont construit l'échelle initiale des utilisateurs et l'écologie du contenu réseau, établi le paradigme de base de la diffusion d'informations en ligne, et posé les bases pour le développement ultérieur.\nÀ cette ère, le §Gplus grand bénéficiaire§! est : les services d'information."
Chinese_Internet_adjective_desc_2: "Ère actuelle : §HÈre des moteurs de recherche§!\nÀ l'ère actuelle, le besoin des utilisateurs d'obtenir activement des informations spécifiques a donné lieu à la montée des moteurs de recherche. Cela marque un changement de paradigme de « poussée d'informations » à « traction d'informations ». La technologie centrale réside dans le crawling et l'indexation efficaces de pages web massives, et le classement de pertinence des résultats par des algorithmes. Cela a grandement amélioré l'efficacité et la précision de l'acquisition d'informations, devenant le « centre de navigation » d'Internet, et changeant profondément la façon dont les gens apprennent et résolvent des problèmes. L'optimisation pour les moteurs de recherche (SEO) et la publicité par mots-clés sont devenus les modèles commerciaux principaux. Le mécanisme de distribution de trafic qu'ils ont établi a un impact profond sur l'économie Internet et a également déclenché des discussions précoces sur l'équité de l'information et le pouvoir des algorithmes.\nÀ cette ère, les §Gplus grands bénéficiaires§! sont : les services d'information et les services d'outils."
Chinese_Internet_adjective_desc_3: "Ère actuelle : §HÈre de la messagerie instantanée§!\nÀ l'ère actuelle, l'une des valeurs centrales d'Internet - connecter les individus - est pleinement démontrée pendant cette période. Les outils avec la communication texte en ligne en temps réel comme fonction principale sont devenus rapidement populaires, transcendant la simple transmission d'informations et devenant l'infrastructure pour les utilisateurs pour construire des identités en ligne (systèmes de comptes) et maintenir des relations sociales. Cela a créé une nouvelle expérience sociale en ligne instantanée, cultivant le statut en ligne continu des utilisateurs et la conscience de communauté virtuelle. Son impact ne se limite pas à l'amélioration de l'efficacité de la communication, mais aussi à poser les bases de l'architecture sous-jacente et des habitudes culturelles des réseaux sociaux à grande échelle (tels que les émoticons, statut en ligne), ouvrant la voie à des réseaux sociaux plus complexes.\nLes plus grands bénéficiaires de cette ère§! sont : les services sociaux et les services de divertissement."
Chinese_Internet_adjective_desc_4: "Ère actuelle : §HÈre sociale mobile§!\nÀ l'ère actuelle, la popularité des smartphones a déclenché une révolution de l'Internet mobile, et les réseaux sociaux basés sur des appareils mobiles sont devenus les protagonistes absolus de cette période. La caractéristique principale est de migrer à grande échelle les chaînes de relations sociales réelles des utilisateurs en ligne, et de connecter dynamiquement les personnes avec le contenu et les personnes entre elles via des flux d'informations (Feed). La plateforme a évolué en une « super application » intégrant communication, partage de contenu, expression de soi, acquisition d'informations et même services de paiement. Cela a profondément remodelé la façon d'interagir socialement, le chemin de diffusion des informations (incluant les actualités et l'opinion publique) et le mode de vie en ligne (tel que le paiement mobile et les services O2O), réalisant une intégration profonde de l'interaction sociale en ligne et de la vie réelle, et établissant la position dominante de l'Internet mobile.\nÀ cette ère, les §Gplus grands bénéficiaires§! sont : les services sociaux, les services de divertissement, et les services de transaction."
Chinese_Internet_adjective_desc_5: "Ère actuelle : §HÈre des vidéos courtes§!\nÀ l'ère actuelle, l'augmentation de la bande passante de l'Internet mobile et la popularisation des terminaux intelligents ont conduit à l'explosion du format vidéo courte piloté par des recommandations algorithmiques. Sa nature révolutionnaire réside dans : production de contenu hautement popularisée (UGC), expérience de consommation extrêmement fragmentée et immersive, et efficacité de distribution d'informations sans précédent améliorée. Les algorithmes poussent précisément du contenu basé sur les préférences des utilisateurs, formant un mécanisme fort de fidélisation des utilisateurs et de capture d'attention. Les vidéos courtes ne sont pas seulement des porteurs de divertissement, mais aussi une position importante pour la diffusion d'informations, la popularisation des connaissances, le marketing e-commerce et la formation de sous-cultures. Cela a profondément changé la logique de création de contenu, l'allocation du temps des utilisateurs et le modèle de l'économie de l'attention, représentant un saut majeur dans la forme de consommation de contenu de l'Internet mobile.\nLes plus grands bénéficiaires dans cette ère§! sont : les services d'information, les services sociaux, les services de divertissement, et les services de transaction."
Chinese_Internet_adjective_desc_6: "Ère actuelle : §HÈre de l'intelligence artificielle§!\nÀ l'ère actuelle, marquée par des percées dans les technologies d'IA générative telles que les grands modèles de langage, l'intelligence artificielle passe de l'arrière-scène à l'avant-scène, devenant la force motrice centrale définissant la nouvelle forme d'Internet. Ses caractéristiques sont que l'IA n'est plus limitée à l'analyse, mais peut générer directement du contenu divers (AIGC) tel que texte, images, audio et vidéo, et assister les utilisateurs dans l'accomplissement de tâches complexes en tant qu'agent. Cela annonce le changement potentiel dans la façon dont les gens interagissent avec les ordinateurs (tels que l'interaction en langage naturel), et pénètre profondément dans presque tous les domaines d'application Internet tels que la création de contenu, la recherche d'informations, l'interaction sociale, l'efficacité au travail, l'éducation et la recherche scientifique.\nLes §Gplus grands bénéficiaires§! dans cette ère sont : les services d'information, les services sociaux, les services de divertissement, les services de transaction, et les services d'outils."
Chinese_Internet_adjective_desc_7: "Ère actuelle : §HÈre immersive virtuelle§!\nÀ l'ère actuelle, l'Internet a sauté des « outils intelligents » à « l'espace immersif de symbiose virtuelle et réelle ». Son noyau est l'intégration de technologies telles que la réalité étendue (XR), la blockchain et les jumeaux numériques, qui promeut la reconstruction de la société humaine, de l'économie et de la civilisation dans le monde virtuel.\nLes §Gplus grands bénéficiaires§! dans cette ère sont : les services d'information, les services sociaux, les services de divertissement, les services de transaction, et les services d'outils."
