tech_CHI_advanced_3D_printing: "Impression 3D intégrée"
tech_CHI_advanced_3D_printing_desc: "La coulée, le forgeage et le fraisage intégrés en impression 3D métal peuvent raccourcir significativement le temps d'impression 3D, réduire la consommation d'énergie et les pertes de matériaux. La résistance des pièces produites par cette méthode est supérieure à celle des produits similaires produits par des processus traditionnels."
tech_CHI_advanced_automated_terminal: "Terminal automatisé"
tech_CHI_advanced_automated_terminal_desc: "Des terminaux hautement efficaces nécessitant seulement un petit nombre d'opérateurs pour la maintenance assurent un flux pratique et efficace des matériaux."
tech_CHI_artificially_synthesized_starch: "Amidon synthétisé artificiellement à l'échelle de la tonne"
tech_CHI_artificially_synthesized_starch_desc: "Cette technologie utilise uniquement des moyens chimiques pour synthétiser l'amidon à partir d'eau et de dioxyde de carbone, consommant de l'électricité. Elle ne dépend pas de la photosynthèse et pourrait révolutionner la technologie agricole."
tech_CHI_commercial_quantum_computer: "Ordinateur quantique commercial"
tech_CHI_commercial_quantum_computer_desc: "La première génération d'ordinateurs commerciaux basés sur la théorie quantique dépasse de loin les performances des ordinateurs avec des architectures traditionnelles et offre des possibilités illimitées."
tech_CHI_giant_construction_machinery: "Machinerie de construction géante"
tech_CHI_giant_construction_machinery_desc: "Équipement spécialisé utilisé spécifiquement pour des projets de construction à grande échelle, permettant à la créativité humaine d'être sans contraintes."
tech_CHI_hypersonic_wind_tunnel: "Soufflerie hypersonique"
tech_CHI_hypersonic_wind_tunnel_desc: "Une soufflerie hypersonique est une dans laquelle la section d'essai a une plage de nombre de Mach d'environ 5 à 14, et la température de l'écoulement d'air est suffisamment élevée pour empêcher la liquéfaction dans la section d'essai lorsque l'écoulement s'étend isentropiquement à ces nombres de Mach. Cependant, il n'y a pas de souffleries avec des températures assez élevées pour produire des effets de gaz réel."
tech_CHI_ultra_high_voltage_transmission: "Transmission à ultra-haute tension"
tech_CHI_ultra_high_voltage_transmission_desc: "La transmission à ultra-haute tension désigne les projets et technologies de transmission d'électricité en 1000 kV AC et ±800 kV DC, qui peuvent efficacement réduire les pertes d'énergie pendant la transmission."
war_willingness_monthly_add: "$CHI_Chastity_Paifang_war_willingness$ mensuel"
