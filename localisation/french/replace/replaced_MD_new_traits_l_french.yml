#resource
PRODUCTION_MATERIALS_GRAIN: "Nourriture"
grain_desc: "Bien que le 21e siècle ait atteint une grande productivité alimentaire, la nourriture demeure le matériel stratégique le plus fondamental d'un pays. Les principaux aliments du monde comprennent les céréales, les légumes, la viande, les œufs, le poisson, les fruits, etc. La nourriture est produite par l'agriculture de subsistance et les zones agricoles commerciales."
PRODUCTION_MATERIALS_CONSUMER_GOODS: "Biens de consommation"
consumer_goods_desc: "Les biens de consommation sont ces produits sociaux utilisés pour répondre aux besoins matériels et culturels des personnes. Ils peuvent également être appelés \"matériaux de consommation\" ou \"matériaux de vie\", comprenant les vêtements, les appareils électriques, les meubles et divers produits industriels qui peuvent être échangés contre de l'argent. Les biens de consommation sont produits par les industries civiles."
PRODUCTION_MATERIALS_SERVICE: "Service"
service_desc: "Le service est le travail ou l'activité économique effectuée par des individus ou des organisations sociales pour les consommateurs directement ou avec l'aide de certains outils, équipements, installations et médias. Sa production peut ou non être liée à des produits matériels. Il ajoute de la valeur aux individus, aux biens ou aux services d'autres unités économiques et est principalement exprimé sous la forme de valeur d'usage ou d'utilité. Les services sont produits par les parcs de bureaux."


#Balance of Power
CHI_power_balance: "Équilibre du développement social de la Chine"
CHI_People_happiness_side: "Le peuple devient heureux"
CHI_Nation_prosperity_side: "Le pays devient fort"
CHI_mid_range: "Maintenir l'équilibre"
CHI_mid_range_desc: "Le développement social de notre pays a atteint un équilibre entre les moyens de subsistance du peuple et le développement"
CHI_People_happiness_side_a: "Remarqué dans le bien-être"
CHI_People_happiness_side_a_desc: "Notre pays accorde plus d'attention aux moyens de subsistance du peuple dans son développement et aide ceux dans le besoin."
CHI_People_happiness_side_b: "Accorder de l'attention au bien-être"
CHI_People_happiness_side_b_desc: "Le développement de notre pays est plus orienté vers les moyens de subsistance du peuple, et il a commencé à étendre les dépenses pour les moyens de subsistance du peuple"
CHI_People_happiness_side_c: "Se concentrer sur le bien-être"
CHI_People_happiness_side_c_desc: "Le développement de notre pays se concentre sur les moyens de subsistance du peuple, et de nombreuses ressources sociales sont utilisées pour le bien-être du peuple"
CHI_People_happiness_side_d: "Priorité au bien-être"
CHI_People_happiness_side_d_desc: "Le développement de notre pays vise à maintenir les moyens de subsistance du peuple, et une grande quantité de ressources sociales est utilisée pour maintenir le bien-être du peuple."
CHI_People_happiness_side_e: "Bien-être en premier"
CHI_People_happiness_side_e_desc: "Le développement de notre pays vise à répondre continuellement aux besoins croissants du peuple pour une vie meilleure, et presque toutes les ressources sociales sont orientées vers la satisfaction des besoins d'amélioration des moyens de subsistance et du bien-être du peuple."
CHI_Nation_prosperity_side_a: "Remarqué dans le développement"
CHI_Nation_prosperity_side_a_desc: "Le développement de notre pays se concentre davantage sur la construction économique et investit dans des subventions pour certains domaines clés"
CHI_Nation_prosperity_side_b: "Accorder de l'attention au développement"
CHI_Nation_prosperity_side_b_desc: "Le développement de notre pays est plus orienté vers la construction économique et a commencé à étendre les investissements dans la construction"
CHI_Nation_prosperity_side_c: "Se concentrer sur le développement"
CHI_Nation_prosperity_side_c_desc: "Le développement de notre pays se concentre sur la construction économique, et de nombreuses ressources sociales sont utilisées pour les investissements dans la construction."
CHI_Nation_prosperity_side_d: "Priorité au développement"
CHI_Nation_prosperity_side_d_desc: "Nous nous concentrons sur le développement et utilisons beaucoup de ressources sociales pour nous concentrer sur la construction économique."
CHI_Nation_prosperity_side_e: "Développement en premier"
CHI_Nation_prosperity_side_e_desc: "Le développement de notre pays est entièrement axé sur l'expansion de la construction économique, et presque toutes les ressources sociales sont utilisées pour investir dans la construction économique."

#resolution
CHI_balance_of_power_category: "Résolution de l'équilibre du développement social de la Chine"
CHI_eastern_region_leading_development_category: "Décision de développement de l'Est"
CHI_eastern_region_leading_development_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chieast\n\n\n\n\n\n\n\n\nL'ouverture de la §YZone économique spéciale de Shenzhen§! dans les années 1980 en §YChine orientale§! a conduit à la réforme et au développement du §YDelta de la rivière des Perles§! ; le développement et l'ouverture de la §YNouvelle zone de Pudong§! dans les années 1990 ont conduit à la réforme et au développement du §YDelta du Yangtsé et du bassin du Yangtsé§!. Le Delta de la rivière des Perles et le Delta du Yangtsé sont rapidement devenus les deux \"pôles\" les plus actifs de l'économie chinoise.\n\nLa mise en œuvre de la stratégie de développement de l'Est permettra à la région orientale de la Chine d'être plus capable de soutenir le développement de la région occidentale, la montée de la région centrale et la revitalisation du Nord-Est, et de promouvoir et de former une bonne situation d'interaction entre l'Est, le Centre et l'Ouest et le développement coordonné de l'économie nationale. La région orientale assume la tâche de montrer la voie et d'expérimenter pour l'ensemble du pays, de sorte que la région orientale est en avance en matière de développement, de transformation, de réforme et de transition, et peut jouer un rôle de §Ypionnier et de précurseur§! pour approfondir globalement la réforme."
Expand_hainan_tourism_industry: "Construire des installations de soutien pour l'industrie touristique de Hainan"
Expand_hainan_tourism_industry_desc: "Construire des industries de soutien liées au tourisme"
Expand_jingjinji_industry: "Développer l'industrie de Jingjinji"
Expand_shandong_industry: "Développer l'industrie du Shandong"
Expand_jiangsu_Urban_agglomerations: "Construire des agglomérations urbaines du Jiangnan"
Expand_zhejiang_Technology_Highland: "Construire le haut plateau technologique du Zhejiang"
Expand_fujian_Foreign_trade_ports: "Construire des ports de commerce extérieur du Fujian"
Expand_guangdong_The_Heart_of_Manufacturing: "Renforcer le cœur de la fabrication du Guangdong"
Expand_shanghai_financial_center: "Construire Shanghai en tant que centre financier"
CHI_hainan_Tourism_industry: "Développer l'industrie touristique de Hainan"
CHI_hainan_Tourism_industry_desc: "Hainan est situé dans les tropiques, avec un paysage magnifique et un climat agréable, ce qui est propice au développement économique local axé sur le tourisme."
CHI_jingjinji_Integration: "Promouvoir le développement intégré de Beijing, Tianjin et Hebei"
CHI_jingjinji_Integration_desc: "Beijing, Tianjin et Hebei sont situés dans la même région, avec des avantages complémentaires. Investir et développer cette région favorisera grandement le développement économique."
CHI_shandong_High_end_chemical_industry: "Développer l'industrie chimique haut de gamme du Shandong"
CHI_shandong_High_end_chemical_industry_desc: "Le Shandong est une base importante pour les entreprises d'État, avec de nombreuses industries chimiques concentrées. Investir dans les produits chimiques haut de gamme aidera les entreprises d'État à se transformer et à se moderniser."
CHI_jiangsu_High_end_manufacturing_industry: "Développer l'industrie manufacturière haut de gamme du Jiangsu"
CHI_jiangsu_High_end_manufacturing_industry_desc: "Le Jiangsu est une région où la fabrication haut de gamme est distribuée. Nous devrions augmenter les investissements dans cette région pour stimuler le développement de la fabrication haut de gamme."
CHI_zhejiang_E_Commerce: "Développer le commerce électronique du Zhejiang"
CHI_zhejiang_E_Commerce_desc: "Le Zhejiang est le plus grand centre de distribution et d'exportation de marchandises de notre pays, et le commerce électronique y est également très développé. Nous devrions promouvoir le développement de cette industrie pionnière."
CHI_fujian_Electronic_manufacturing_industry: "Investir dans l'industrie de fabrication électronique du Fujian"
CHI_fujian_Electronic_manufacturing_industry_desc: "Le Fujian dispose d'un système complet de fabrication électronique, et nous devrions augmenter les investissements et le développement"
CHI_guangdong_Special_Economic_Zones: "Investir dans les zones économiques spéciales du Guangdong"
CHI_guangdong_Special_Economic_Zones_desc: "Le Guangdong a deux super villes, Shenzhen et Guangzhou. Shenzhen est la zone économique spéciale la plus développée de notre pays. Augmenter les investissements dans cette région dynamique sera propice au développement rapide de l'économie de notre pays."
CHI_shanghai_Business_environment: "Créer un bon environnement commercial à Shanghai"
CHI_shanghai_Business_environment_desc: "Shanghai est une région économique extrêmement importante de notre pays et une fenêtre sur les échanges extérieurs de notre pays. Créer un bon environnement commercial est propice au renforcement de la puissance économique et à la garantie de la confiance des investisseurs."
CHI_The_rise_of_central_category: "La montée de la catégorie centrale"
CHI_The_rise_of_central_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chicentral\n\n\n\n\n\n\n\n\nLa §YChine centrale§! relie l'Est et l'Ouest, le Sud et le Nord. La production économique totale de ses six provinces représente environ un cinquième du total national. C'est une région importante qui ne peut être ignorée. La région centrale occupe une position importante dans le développement économique et social global de la Chine et a apporté des contributions significatives au développement économique et social national pendant longtemps. La région centrale comprend les provinces de §YShanxi, Anhui, Jiangxi, Henan, Hubei et Hunan§!, avec une superficie terrestre de 1,028 million de kilomètres carrés, représentant 10,7% de la superficie terrestre totale du pays.\n\nPromouvoir la montée de la région centrale est une partie importante de la mise en œuvre de la disposition régionale des quatre grands blocs et des \"trois grandes stratégies\", un besoin objectif de construire un marché national unifié et de promouvoir la formation d'un développement interactif et coordonné de l'Est, du Centre et de l'Ouest, une mesure stratégique pour optimiser la structure économique nationale et maintenir un développement économique soutenu et sain, et une exigence inévitable pour assurer la réalisation en temps opportun de l'objectif de construire une société modérément prospère de manière globale."
Expand_hunan_industry: "Construction du Hunan"
Expand_hubei_industry: "Construction du Hubei"
Expand_henan_industry: "Construction du Henan"
Expand_jiangxi_industry: "Construction du Jiangxi"
Expand_anhui_industry: "Construction de l'Anhui"
Expand_shanxi_industry: "Construction du Shanxi"
CHI_hunan_Advanced_heavy_industry: "Investir dans l'industrie lourde avancée du Hunan"
CHI_hunan_Advanced_heavy_industry_desc: "Le Hunan possède plusieurs bases de fabrication industrielle lourde super-larges. Nous devrions continuer à approfondir ses industries avantageuses."
CHI_hubei_Cutting_edge_industries: "Investir dans les industries de pointe de la science et de la technologie du Hubei"
CHI_hubei_Cutting_edge_industries_desc: "Le Hubei est un leader en biotechnologie, et nous devrions investir pour renforcer son industrie technologique."
CHI_henan_Industrial_transformation: "Investir dans la modernisation industrielle du Henan"
CHI_henan_Industrial_transformation_desc: "Les industries du Henan ont un besoin urgent de transformation et de modernisation"
CHI_jiangxi_Industrial_transformation: "Investir dans la modernisation industrielle du Jiangxi"
CHI_jiangxi_Industrial_transformation_desc: "Les industries du Jiangxi ont un besoin urgent de transformation et de modernisation"
CHI_anhui_Industrial_transfer: "Organiser l'Anhui pour entreprendre le transfert industriel de l'Est"
CHI_anhui_Industrial_transfer_desc: "L'Anhui est adjacent à la région développée du Delta du Yangtsé et peut entreprendre un grand nombre de transferts de fabrication."
CHI_shanxi_Industrial_transformation: "Accélérer la transformation et la modernisation des industries du Shanxi"
CHI_shanxi_Industrial_transformation_desc: "Les industries du Shanxi ont un besoin urgent de transformation et de modernisation"
CHI_Northeast_Revitalization_category: "Décision de revitalisation du Nord-Est"
CHI_Northeast_Revitalization_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chinortheast\n\n\n\n\n\n\n\n\nLes caractéristiques de base de la structure du sol de la §YRégion du Nord-Est§! sont les montagnes et les rivières, et les champs fertiles s'étendent sur des milliers de kilomètres. Le sol est principalement constitué de terre noire, qui est la base naturelle de la formation d'une grande zone économique. L'économie du Nord-Est a commencé tôt et a §Yrepris 98% de l'industrie lourde de la Chine§!, apportant une §Rcontribution historique et énorme§! au développement et à la croissance de la Nouvelle Chine, et soutenant fortement la construction économique nationale. Pendant plus de 50 ans, les trois provinces du Nord-Est ont directement remis des recettes fiscales qui sont environ 5 fois le montant transféré par l'État. Sans compter le grand nombre d'usines transférées dans diverses parties du pays, le seul champ pétrolifère de Daqing a remis 2,4 milliards de tonnes de pétrole.\n\n§YLe Premier ministre Wen Jiabao§! a souligné que le §R16e Congrès national du Parti communiste chinois§! a clairement proposé de soutenir l'accélération de l'ajustement et de la transformation des anciennes bases industrielles telles que le Nord-Est, et de soutenir le développement des industries de suivi dans les villes régionales qui se concentrent sur l'exploitation des ressources, la transformation industrielle et le développement de l'agriculture moderne."
Expand_liaoning_industry: "Construction du Liaoning"
Expand_jilin_industry: "Construction du Jilin"
Expand_heilongjiang_industry: "Construction du Heilongjiang"
CHI_jilin_Automobile_manufacturing: "Investir dans la fabrication automobile du Jilin"
CHI_jilin_Automobile_manufacturing_desc: "Le Jilin était autrefois le plus grand centre de fabrication automobile de notre pays. Nous devrions augmenter le soutien à cette base industrielle."
CHI_dalian_shipbuilding_industry: "Investir dans l'industrie de la construction navale de Dalian"
CHI_dalian_shipbuilding_industry_desc: "Dalian est le plus grand centre de construction navale de notre pays. Nous devrions augmenter les investissements dans ce domaine."
CHI_heilongjiang_Mechanized_agriculture: "Promouvoir la production agricole mécanisée dans le Heilongjiang"
CHI_heilongjiang_Mechanized_agriculture_desc: "Le Heilongjiang a la plus grande distribution de terre noire de notre pays, et son potentiel agricole est exceptionnel. Nous devrions augmenter les investissements agricoles dans cette région et promouvoir une production mécanisée à grande échelle efficace."
CHI_development_of_western_region_category: "Résolution sur le développement de la région occidentale"
CHI_development_of_western_region_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chiwest\n\n\n\n\n\n\n\n\nLa §YChine occidentale§! couvre une superficie de 6,85 millions de kilomètres carrés, représentant environ 71,4% du pays. Fin 2002, la population était de 367 millions d'habitants, représentant 25% du pays. Elle représente environ 15% du PIB. C'est la plus grande, la plus vaste et la plus complexe des trois grandes régions de notre pays.\n\nLa région occidentale est riche en ressources naturelles, a un grand potentiel de marché et une position stratégique importante. Cependant, pour des raisons naturelles, historiques et sociales, l'économie de la région occidentale est relativement en retard depuis longtemps, et le PIB par habitant n'est que les deux tiers de la moyenne nationale et moins de 40% du niveau moyen de la région orientale. Il est urgent d'accélérer le rythme de la réforme, de l'ouverture et de la modernisation. \n\nPour mettre en œuvre le développement de la région occidentale, nous devons nous appuyer sur le pont continental eurasien, la voie navigable du Yangtsé, le canal maritime du Sud-Ouest et d'autres axes de transport, donner pleinement leur rôle aux villes centrales, relier les points par des lignes et guider l'ensemble par des points, et former progressivement une ceinture économique inter-administrative distinctive dans la partie occidentale de notre pays, comme la ligne Xilonghai-Lanxin, Nan (Ning)-Guizhou, Chengdu-Kunming, etc., pour stimuler le développement d'autres régions et promouvoir le développement de la région occidentale de manière progressive et ciblée."
MGDR_AI_state_industry: "Province de développement de l'IA"
CHI_shanxi_industry: "Investir dans le développement industriel du Shaanxi"
CHI_shanxi_industry_desc: "Le Shaanxi est le centre économique de la région du Nord-Ouest. Nous devrions augmenter les investissements dans cette capitale millénaire."
CHI_southwest_industry: "Subventions pour le développement de l'industrie du Sud-Ouest"
CHI_southwest_industry_desc: "Le Sud-Ouest est un modèle de développement dirigé par les villes de Chongqing et Chengdu. Investir dans cette région aidera à atténuer la pauvreté dans les vastes zones montagneuses."
CHI_ningxia_mutton: "Subventionner la production agricole du Ningxia"
CHI_ningxia_mutton_desc: "Le Ningxia a Yinchuan, le \"Sud du Yangtsé sur la Grande Muraille\". Augmenter les investissements dans l'agriculture dans cette région aidera à améliorer le revenu des populations locales."
CHI_gansu_potato: "Subventionner la culture de la pomme de terre du Gansu"
CHI_gansu_potato_desc: "Le Gansu a un climat sec et de grandes différences de température, ce qui permet de cultiver des pommes de terre de très haute qualité et délicieuses. Nous devrions développer un modèle de production adapté aux conditions locales sur cette base."
CHI_guizhou_potato: "Subvention pour la culture de la pomme de terre du Guizhou"
CHI_guizhou_potato_desc: "Le Guizhou est plein de reliefs karstiques, et seules les pommes de terre sont adaptées à la culture. Nous devrions augmenter la promotion des produits agricoles et des industries de transformation alimentaire."
CHI_yunnan_coffee: "Subventionner la culture des grains de café du Yunnan"
CHI_yunnan_coffee_desc: "Le Yunnan est la plus grande région productrice de café de notre pays. Le café produit ici est de haute qualité et de délicieux goût, ce qui répondra à la demande croissante de café dans notre pays et dans le monde."
CHI_nei_graziery: "Subventions pour l'élevage de la Mongolie intérieure"
CHI_nei_graziery_desc: "La Mongolie intérieure possède le plus grand pâturage de haute qualité de notre pays, et le mouton mongol est mondialement connu."
CHI_Xinjiang_cotton: "Subventionner la culture du coton du Xinjiang"
CHI_Xinjiang_cotton_desc: "Le Xinjiang a un climat sec et le coton qui y est cultivé est de très haute qualité. L'industrie textile en rapide développement de notre pays a entraîné une énorme demande de coton. Le coton à longues fibres du Xinjiang est abondant et de haute qualité. Investir dans sa culture du coton peut non seulement répondre à la demande intérieure, mais aussi améliorer efficacement la qualité de vie des populations locales."
