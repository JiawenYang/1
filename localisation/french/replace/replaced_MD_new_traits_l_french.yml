CHI_Social_trends_category: "Tendances sociales chinoises"
CHI_Social_trends_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_sichao\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetName]§! est un pays avec une population de plus d'un milliard d'habitants. Bien que le gouvernement mette toujours l'accent sur la §Hpropagande idéologique§!, il est impossible de faire en sorte que tous les habitants d'un si grand pays s'accordent sur §Hun certain ensemble de valeurs§!. Bien que la plupart des Chinois soient §gpolitiquement apathiques§! et n'aient pas beaucoup d'opinions sur les politiques du pays, si l'environnement de vie §Rchange trop§!, même les personnes les plus obtues commenceront à §Hpenser§! . \n\nLe roi Wuling de Zhao a dit un jour : §CLe mérite de suivre la loi n'est pas suffisant pour élever le monde ; l'apprentissage des anciens n'est pas suffisant pour contrôler le présent§!. Le millénaire est une époque de changement rapide. La Chine doit traiter les politiques intérieures avec §Yprudence§! dans cette ère de changement. Pour la Chine, si la réforme est trop lente, il peut être §gtrop tard pour le regretter§! ; si la réforme est trop radicale, ce sera équivalent à une §Rauto-destruction§!. \n\nLes pensées du peuple §Y[CHI.GetAdjective]§! peuvent être grossièrement divisées en trois catégories : §C$CHI_left_Name$§! qui cherche le changement, §g$CHI_political_apathy_Name$§! qui n'ont pas de vues systématiques, et §O$CHI_right_Name$§! qui cherchent à maintenir le statu quo. \n\n§YFactions nationales :§!\n §C$CHI_left_Name$ :§!\n Proportion : [?left_bian|C]%  Taux de satisfaction : [?left_Support|Y]% \n §g$CHI_political_apathy_Name$ :§!\n Proportion : [?political_apathy|g]%  Taux de satisfaction : [?political_apathy_Support|Y]% \n §O$CHI_right_Name$ :§!\n Proportion : [?right_bian|O]%  Taux de satisfaction : [?right_Support|Y]% \n\nLes §C$CHI_left_Name$§! ($CHI_left_Name_Abbreviation$) sont un groupe relativement avancé en Chine. Ils examineront les différences entre le §Cmonde occidental§! et la §RChine§! en fonction de leur satisfaction. S'ils trouvent la §Ysituation actuelle§! §Cexcitante§!, ils §Ccritiqueront l'influence de l'idéologie occidentale§! sur notre pays et participeront activement à la construction d'une §Csociété innovante§!\n\nLes §g$CHI_political_apathy_Name$§! ($CHI_political_apathy_Name_Abbreviation$) sont la §gmajorité silencieuse§!. Ils exprimeront leur §Ysoutien aux autorités§! en fonction de leur satisfaction, et décideront s'ils doivent payer activement §gplus d'impôts§! et §gcoopérer avec le gouvernement dans l'administration§!.\n\nLes §O$CHI_right_Name$§! ($CHI_right_Name_Abbreviation$) sont §Oune partie considérable de la population§! en Chine. Ils §Os'opposent aux changements radicaux§! et espèrent que le gouvernement pourra créer une société §Oharmonieuse, stable et belle§!. Ils aideront à §Omaintenir la stabilité sociale§! et à §Orésister à l'impact idéologique du monde occidental sur notre pays§! en fonction de leur satisfaction.\n\nLe nombre de partisans et la satisfaction des pensées sociales changeront avec les §Hpolitiques nationales§! et les §Rurgences§!. Si la satisfaction est inférieure à §Y50%§!, on considère que le groupe est §Rinsatisfait§! de la situation actuelle. Si les parties sont §Rinsatisfaites§! de la situation actuelle, cela aura l'effet inverse et déclenchera certains §Révénements sociaux négatifs§! \n\nLa §YChine [CHI.GetFlag]§! est un énorme navire qui doit être maintenu en §Yfonctionnement fluide§!. Une fois qu'il n'est pas prudent, il tombera dans une situation de §Rcatastrophe sans fin§!, et le grand voyage de §Yla grande renaissance de la nation chinoise§! sera également §Rannulé§!\n"
