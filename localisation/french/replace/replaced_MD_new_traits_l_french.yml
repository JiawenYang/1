    #ideas
    CHI_Africa_Medical_Security: "Développement des services médicaux"
    CHI_Africa_Medical_Security_desc: "Avec l'aide de la Chine, les conditions médicales locales s'améliorent progressivement."
    MDGR_economic_cycle_seize_profit: "Capitalisation sur la globalisation"
    MDGR_economic_cycle_protecting_interests: "Maintenir la globalisation"
    MDGR_economic_cycle_percentage_all: "Durée totale du cycle économique mondial"
    MDGR_economic_cycle_progress_all: "Progression actuelle du cycle économique mondial"
    MDGR_economic_cycle_progress_all_last: "Changement de progression au cours du dernier mois"
    MDGR_economic_cycle_progress: "Notre impact sur la progression du cycle économique mondial"
    MDGR_global_economic_cycle_modifier: "Influence du cycle économique mondial"
    MDGR_global_economic_cycle_modifier_desc: "La globalisation a entraîné un approfondissement de l'intégration et de l'interdépendance dans les domaines politique, économique, culturel et social des pays du monde entier, ce qui a également conduit à des fluctuations cycliques dans le fonctionnement de l'économie mondiale. De telles fluctuations cycliques affectent inévitablement chaque participant à la globalisation.\n§W---------------------------------\n$MDGR_economic_cycle_percentage_all$: [?D75.MDGR_economic_cycle_percentage_all|Y]\n$MDGR_economic_cycle_progress_all$: [?D75.MDGR_economic_cycle_progress_all|Y]\n$MDGR_economic_cycle_progress$: [?ROOT.MDGR_economic_cycle_progress|-]\n$MDGR_economic_cycle_progress_all_last$: [?D75.MDGR_economic_cycle_progress_all_last|-]\nSituation économique actuelle: [D75.MDGR_economic_cycle_adjective_desc]\n[ROOT.MDGR_economic_cycle_identification_desc]\n\nParmi eux, $MDGR_economic_cycle_percentage_all$ dépend de la §Ypart du PIB mondial§! et des §Ylois commerciales mises en œuvre§! de tous les pays participant à l'économie mondiale, tandis que $MDGR_economic_cycle_progress$ dépend de notre §Y$interest_rate_multiplier_modifier$§! et notre §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! et notre §Y£interest_rate_multiplier_modifier_texticon£ ratio dette sur PIB§! et notre §Y$economic_cycle_global_mult$§!. L'impact cumulatif de tous les pays sur la progression du cycle économique mondial est de $MDGR_economic_cycle_progress_all$.\n\nSi la §Y$MDGR_economic_cycle_progress_all$§! est inférieur à la §Y$MDGR_economic_cycle_percentage_all$§!, alors il y aura un §Gimpact positif§! sur $productivity_growth_modifier$, $economic_cycles_cost_factor$, $econ_cycle_upg_cost_multiplier_modifier$, $investment_cost_modifier$, et $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$, et vice versa. §!"
    MDGR_economic_cycle_adjective_desc_1: "§CPlein de vitalité§!"
    MDGR_economic_cycle_adjective_desc_2: "§GProspère§!"
    MDGR_economic_cycle_adjective_desc_3: "§7Progrès régulier§!"
    MDGR_economic_cycle_adjective_desc_4: "§YMixed blessings§!"
    MDGR_economic_cycle_adjective_desc_5: "§OFace à une crise§!"
    MDGR_economic_cycle_adjective_desc_6: "§RL'hiver arrive§!"
    MDGR_economic_cycle_identification_desc_ok: "Actuellement, nous §Gparticipons§! à la globalisation"
    MDGR_economic_cycle_identification_desc_no: "Actuellement, nous §Rne participons pas§! à la globalisation"
    CHI_Hanxin_Event_Effect: "Contrefaçon de puces"
    CHI_Hanxin_Event_Effect_desc: "L'incident de contrefaçon de puces a suscité de profondes inquiétudes quant à l'authenticité et à la fiabilité des projets de recherche scientifique, affectant gravement le développement sain de l'écosystème de recherche scientifique dans son ensemble et entravant gravement le développement de puces indépendantes."
    USA_Stock_market_circuit_breaker: "Disjoncteur du marché boursier"
    USA_Revolving_Door: "Porte tournante"
    USA_Revolving_Door_desc: "Il existe un grand nombre de groupes et d'individus de lobbying aux États-Unis, dont un nombre considérable sont composés d'anciens fonctionnaires. Ils utilisent leurs relations personnelles pour servir des groupes d'intérêts spécifiques et reçoivent des salaires élevés. En même temps, de nombreuses personnes du secteur privé sont absorbées par le gouvernement et deviennent des fonctionnaires.\nCe va-et-vient complètement légal entre le secteur privé et le secteur public est appelé de manière vivante la \"porte tournante\"."
    USA_Medical_Insurance_Complex: "Complexe Médical-Assurance"
    USA_Medical_Insurance_Complex_desc: "Le complexe médical-assurance est un groupe d'intérêts étroitement lié par des médecins, des compagnies pharmaceutiques et des compagnies d'assurance. Il a conduit à une augmentation de la proportion de soutien médical au PIB et une espérance de vie qui n'est pas cohérente avec ses dépenses. Les dépenses médicales de plus en plus insupportables sont la principale raison de la faillite directe des citoyens américains, et il y a des dizaines de milliers de décès dus à des frais médicaux insuffisants."
    SARS_COV_2019_died_endurance_exceeds: "Dépasse la limite de tolérance."
    SARS_COV_2019_died_endurance_exceeds_desc: "La gravité actuelle de l'épidémie de COVID-19 a dépassé la limite de tolérance."
    SARS_COV_2019_State_people_maintain_distance: "Soutien $SARS_COV_2019_category_lockdown$"
    SARS_COV_2019_State_people_maintain_distance_no: "Opposition $SARS_COV_2019_category_lockdown$"
    SARS_COV_2019_State: "Nouveau Coronavirus"
    SARS_COV_2019_State_desc: "Cette zone a été infectée par le nouveau coronavirus."
    SARS_COV_2019_State_anti: "Mesures anti-épidémiques"
    SARS_COV_2019_State_anti_desc: "Cette zone a pris les mesures nécessaires pour lutter contre l'infection par le nouveau coronavirus."
    USA_electronic_cigarette_pneumonia: "Pneumonie à la \"cigarette électronique\"?"
    USA_electronic_cigarette_pneumonia2: "Le nouveau coronavirus se propage rapidement"
    USA_electronic_cigarette_pneumonia2_desc: "Il a été confirmé que la \"pneumonie à la cigarette électronique\" qui s'est répandue à travers le pays était en réalité une infection par le nouveau coronavirus."
