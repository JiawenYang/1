CHI_category_PRC_USA_relations: "Relations sino-américaines"
CHI_category_PRC_USA_relations_desc: "\n\n\n\n\n\n\n£MAIN_desctext_CHI_USA\n\n\n\n\n\n\n\n\n\nComment le plus grand pays industriel du monde et la seule superpuissance s’entendront-ils ? La relation entre §Y[CHI.GetFlag][CHI.GetName]§! et §Y[USA.GetFlag][USA.GetName]§! est sans aucun doute la plus importante dans la communauté internationale, et elle affecte invisiblement tous les aspects des autres pays. Si la Chine et les États-Unis s’entendent bien, le monde partvatera la paix et la prospérité. Cependant, si les frictions entre les deux pays persistent, §Rles autres en subiront les conséquences§!.\n \n$modify_chinese_aggression$ : [?CHI.chinese_aggression|Y0]\nScore d’influence mondiale de §Y[CHI.GetFlag][CHI.GetName]§! : [?CHI.hegemony_victory|Y1]\nScore d’influence mondiale de §Y[USA.GetFlag][USA.GetName]§! : [?USA.hegemony_victory|Y1]\n\n[ROOT.PRC_USA_relations_show_desc]"

CHI_category_PRC_USA_relations_show_change: "Notre valeur de changement passif du dernier mois :\nEn raison de la contribution au PIB mondial et à l’indépendance : [?ROOT.temp_percentage_of_global_factories|+=1]\nEn raison de la contribution économique des vassaux : [?ROOT.temp_hegemony_victory_subject|+=1]\nEn raison des bonus de valeur fixe tels que les idées, décisions, événements, etc. : [?ROOT.temp_hegemony_victory_monthly_add|+=1]\nEn raison des bonus de valeur en pourcentage tels que les idées, décisions, événements, etc. : [?ROOT.temp_hegemony_victory_monthly_mult_show|=+%2]\n\nLorsque notre score d’influence mondiale est §Ysupérieur§! à celui de l’autre partie, nous bénéficierons de §Gnombreux bonus positifs§! dans les domaines §Ypolitique, économique, technologique§!, etc., la valeur dépendant de la §Ydifférence actuelle des scores d’influence mondiale entre les deux parties§!. \n\nCependant, nos adversaires §Rne resteront pas indifférents§!, et d’autres pays §Rtenteront de détruire l’ordre§! que nous avons établi, donc nous devons §Yagir§!."

CHI_category_PRC_USA_relations_show_change_other: "Tout ce que nous avons à faire est de §Ychoisir§! entre ces deux pays, ou §Yrester en dehors du conflit§! s’il survient.\n\nLorsque nous sommes du côté de §Y[USA.GetFlag][USA.GetAdjective]§! : $PRC_USA_relations_stand_USA_good_tt$\nLorsque nous sommes du côté de §Y[CHI.GetFlag][CHI.GetAdjective]§! : $PRC_USA_relations_stand_PRC_good_tt$.\n\nCependant, le choix n’est pas sans conséquences. Prix : Lorsque l’intensité du conflit §Ydépasse§! §R+15§!, vous recevrez des §Rpénalités négatives§! du pays hostile, et §Ychoisir la neutralité§! entraînera des §Rpénalités négatives§! de la part de la Chine et des États-Unis, mais les pénalités pour chacun sont moins importantes, et vous recevrez des §Gbonus positifs§! de $foreign_influence_monthly_domestic_independence_gain_modifier$ et $foreign_influence_defense_modifier$, dont les valeurs dépendent de votre §Ycontribution actuelle au PIB et de votre indépendance§!."

