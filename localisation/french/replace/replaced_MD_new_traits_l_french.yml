CHI_Tax_Sharing_Reform_Change: "Réforme du partage des impôts"
CHI_tax: "Mettre en place une fiscalité progressive"
CHI_Poverty_alleviation: "Réduction de la pauvreté de précision"
CHI_minimum_wage: "Augmenter le salaire minimum"
CHI_Encourage_charity: "Encourager la charité"
CHI_Property_taxes: "Impôts fonciers"
CHI_Property_taxes_desc: "Imposer des taxes sur l'immobilier tel que les maisons peut efficacement freiner le phénomène d'inégalité entre les riches et les pauvres, mais notre économie est fortement dépendante de l'immobilier. Une fois les taxes immobilières mises en place, cela pourrait entraîner de graves conséquences."
CHI_inheritance_taxes: "Augmenter les droits de succession"
CHI_Fight_against_monopolies: "Lutter contre les monopoles"
CHI_Lower_minimum_wage: "Baisser le salaire minimum"
CHI_excise_duty: "Augmenter la taxe de consommation"
CHI_Protect_entrepreneurs: "Protéger les intérêts des entrepreneurs"
CHI_Maintaining_the_union: "Maintenir l'union"
modify_chinese_aggression: "Intensité de la confrontation sino-américaine"
xinjiang_category: "Xinjiang"
xinjiang_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_xinjiang\n\n\n\n\n\n\n\n\nLes relations ethniques en §Y[CHI.GetFlag]Chine§! ont toujours été harmonieuses et stables. Cependant, il y a toujours un groupe de §Rséparatistes§! qui tentent toujours de diviser notre pays et sont actifs dans la §YRégion du Xinjiang§!, incitant à la §Rséparation et à la haine§!. Cela est dû à la cession à long terme de l'autonomie ethnique, à la propagande idéologique insuffisante et à l'incitation par des forces étrangères. Nous ne pouvons ignorer cette menace potentielle, mais nous devons trouver un équilibre entre §Ylutter contre le séparatisme§! et §Ygagner le cœur et l'esprit des populations locales§!.\n§YLa menace séparatiste§! fait référence à la force des éléments armés d'opposition séparatistes, qui est relativement élevée. Le niveau de menace entraînera des attaques plus meurtrières et destructrices. §YL'opinion publique ouïghoure§! détermine le taux d'augmentation mensuel de la §Ymenace séparatiste§!. La volonté du peuple détermine la taille de ce groupe de réactionnaires.\n\n§YLe développement est le seul moyen de stabiliser le cœur du peuple§!. La meilleure façon d'éradiquer le séparatisme est de développer la région, de permettre aux compatriotes ouïghours de vivre une bonne vie, et de mépriser ces séparatistes du fond du cœur.\n\n§YMenace séparatiste§!: [?ROOT.uighur_threat|%%]\n§YOpinion publique ouïghoure§!: [?ROOT.uighur_opinion|%%]"
CHI_promote_immigration: "Encourager l'immigration d'autres provinces"
CHI_raid_militant_hideouts: "Raids sur les cachettes des groupes extrémistes"
CHI_raid_militant_hideouts_desc: "La sécurité a localisé la cachette de ce groupe de terroristes extrémistes. Nous pouvons lancer un raid pour capturer ces militants, mais cela peut entraîner des attaques de représailles par d'autres terroristes séparatistes."
CHI_arrest_dissidents: "Identifier les dissidents"
CHI_arrest_dissidents_desc: "Séparer progressivement ces séparatistes qui incitent à l'agitation du grand public, mais cela peut amener certaines personnes qui ne sont pas au courant de la vérité à être induites en erreur par la propagande extrémiste et à cesser de nous comprendre."
CHI_expand_reeducation: "Étendre la campagne de rééducation"
CHI_expand_reeducation_desc: "Combiner les compétences de subsistance et l'éducation idéologique pour éliminer fondamentalement le terreau de la croissance de l'extrémisme."
CHI_subsidize_local_industries: "Subventionner le développement de l'industrie locale"
CHI_subsidize_local_industries_desc: "Subventionner les industries locales pour développer des industries avantageuses et créer des emplois, ce qui créera de la richesse et permettra à nos compatriotes de vivre une bonne vie."

sco_category: "Organisation de coopération de Shanghai"
sco_category_desc: "\n\n£MAIN_desctext_sco\n\n\n\n\nL'§YOrganisation de coopération de Shanghai§!, également connue sous le nom de §YOCS§!, est une organisation intergouvernementale en Eurasie dédiée à la coopération dans les domaines de l'économie, de la politique et de la sécurité. Son prédécesseur était le §YCinq de Shanghai§!, composé de §Y[SOV.GetFlag]Russie§!, §Y[CHI.GetFlag]Chine§!, §Y[KAZ.GetFlag]Kazakhstan§!, §Y[KYR.GetFlag]Kirghizistan§! et §Y[TAJ.GetFlag]Tadjikistan§!, avec pour objectif de résoudre les différends et de promouvoir la coopération. L'§YOCS§! a été créée comme une expansion et un approfondissement de cette vision originale, non seulement pour promouvoir l'amélioration des relations entre les États membres, mais aussi pour augmenter de manière significative l'influence de la §Y[SOV.GetFlag] Russie§! et de la §Y[CHI.GetFlag]Chine§! en §YAsie centrale§!. \n\nLa probabilité que les pays demandent à adhérer dépend de la §Y$modify_chinese_aggression$§!. \nLes pays avec une §G-20 $modify_chinese_aggression$§! et un faible §YNationalisme§! de §YNeutre§! tenteront de rejoindre l'OCS en tant que membres à part entière. \nLes pays avec une §G-10 $modify_chinese_aggression$§! et un faible §YNationalisme§! de §YNeutre§! tenteront de rejoindre l'OCS en tant qu'observateurs. \nLes pays avec une §R+10 $modify_chinese_aggression$§! et un §YNationalisme§! élevé de §YNeutre§! quitteront l'organisation. \nLes pays avec une §R+20 $modify_chinese_aggression$§! et un §YNationalisme§! élevé de §YNeutre§! abandonneront leur statut d'observateur de l'OCS. \n\n§Y$modify_chinese_aggression$§! [?CHI.chinese_aggression]\n"
demand_to_join_as_an_observer: "Exiger que le vassal rejoigne l'OCS"
SCO_show_provide_development_assistance: "Afficher/Masquer le groupe de décision §YAide au développement§!"
SCO_show_offer_joint_exercises_specific: "Afficher/Masquer le groupe de décision §YAide militaire§!"
south_china_sea_category: "Mer de Chine méridionale"
south_china_sea_category_desc: "\nL'importance stratégique et économique de la §Y[CHI.GetFlag]Mer de Chine méridionale§!, une région où un tiers du commerce mondial transite, et un emplacement militaire clé pour protéger nos intérêts, ne peut être surestimée.\n\nLa Chine revendique la souveraineté sur la §Y[CHI.GetFlag]Mer de Chine méridionale§! Cependant, de nombreux pays entourant la mer de Chine méridionale se disputent pour s'emparer des îles et des eaux. Pour le bien de la paix et de la stabilité, ainsi que pour maintenir de bonnes relations avec les pays voisins, nous avons adopté une attitude semi-tolérante au lieu de nous battre pour chaque pouce de terre ici comme nous le faisons pour nos territoires terrestres.\n\nDans le contexte de différends et de tensions fréquents avec d'autres pays autour de nous, en particulier avec la découverte récente de grands gisements de pétrole et de gaz dans cette région, il est crucial que nous déjouions nos adversaires et projetions notre puissance dans la région.\n\n§Y$modify_chinese_aggression$§!: [?CHI.chinese_aggression]\n"
oil_exploration_paracels: "Forage pétrolier près des îles Paracels"
