#Resolution Display
one_china_category_desc: "La guerre civile chinoise s'est terminée avec deux gouvernements alternatifs prétendant diriger l'ensemble de la nation chinoise, la République populaire de Chine, basée à Pékin, et la République de Chine, basée à Taipei. En 1992, les deux parties ont mis de côté la question et sont parvenues au \"Consensus de 1992\", reconnaissant qu'il n'y a qu'une seule Chine, mais en désaccord sur qui est le dirigeant légitime de la Chine. \n\nÀ Taïwan, le soutien relatif au camp §CPan-Bleu pro-unification§! et au camp §GPan-Vert pro-indépendance§! est à peu près équivalent au soutien pour \"pour l'unification\" et \"contre l'unification\". \n\n§CTaux de soutien du camp Pan-Bleu§!\n$TAI.conservatism$: §Y[?TAI.party_pop_array^1|%1]§!\n$TAI.Conservative$: §Y[?TAI.party_pop_array^6|%1]§!\n$TAI.Neutral_conservatism$: §Y[?TAI.party_pop_array^14|%1]§!\n\nTaux de soutien total: §Y[?TAI.pan_blue_coalition_support|%1]§!\n\n§GTaux de soutien du camp Pan-Vert§!\n$TAI.liberalism$: §Y[?TAI.party_pop_array^2|%1]§!\n$TAI.neutral_Social$: §Y[?TAI.party_pop_array^18|%1]§!\n\nTaux de soutien total: §Y[?TAI.pan_green_coalition_support|%1]§!\n\n\nDe plus, il y a certains partis politiques qui sont difficiles à développer localement mais qui soutiennent l'unification:\n\nEn §7Émergentisme§!:\n$TAI.communist_state$: §Y[?TAI.party_pop_array^4|%1]§!\n$TAI.anarchist_communism$: §Y[?TAI.party_pop_array^5|%1]§!\n\nEn §gNon-alignement§!:\n$generic.Neutral_Communism$: §Y[?TAI.party_pop_array^19|%1]§!"
