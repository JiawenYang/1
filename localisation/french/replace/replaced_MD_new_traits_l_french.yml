Vast_territory_and_populous: "Vaste territoire et peuple nombreux"
Vast_territory_and_populous_desc: "Pendant des millénaires, la Chine a été protégée par son environnement géographique entouré de montagnes et de forêts denses. La vaste et colorée terre accueille la nation chinoise, et les ressources vastes et riches ont nourri de nombreuses personnes. Cependant, l'environnement géographique spécial a également isolé le reste du monde, formant une région historique et géographique relativement indépendante. En tant que civilisation ancienne avec une population et des groupes ethniques importants, le gouvernement central doit déployer des efforts considérables pour maintenir l'intégrité territoriale, car il doit investir massivement dans son arrière-pays et ses territoires frontaliers pour maintenir le contrôle. \nCependant, tellement de choses se sont produites sur cette terre pendant des milliers d'années que tout semble avoir changé. L'échec, la joie et la tristesse sont devenus des choses sans importance. Tout disparaîtra toujours dans le long fleuve de l'histoire et le vaste monde comme ce qui s'est passé ici au cours des millénaires, devenant un trait épais ou mince dans l'histoire de la peinture, et un sujet de conversation pour les Chinois après le dîner. \n\n§YLe Yangtsé en fuite coule vers l'est, et les héros s'usent comme la vague qui coule\nSuccès ou échec, tout est dans le passé\nLes collines vertes sont toujours là, et le coucher de soleil est rouge à plusieurs reprises\nPêcheur et bûcheron aux cheveux blancs, habitué à regarder la lune d'automne et le vent de printemps sur la rive\nUne cruche d'alcool boueux, heureux de vous rencontrer\nBeaucoup de choses dans les temps anciens et modernes sont tous dans le rire§!"
CHI_OGAS_nation: "Système national d'automatisation"
CHI_OGAS_nation_desc: "La Chine a le premier système national d'automatisation de l'histoire de l'humanité. Le centre de supercalculateurs de Pékin connecte des centres de données à travers le pays. Grâce à la technologie blockchain, le programme central qui se conforme à la planification centrale calcule les suggestions les plus, les plus rapides, les meilleures et les plus économiques pour la production et la vie - dans une certaine mesure, c'est une sorte d'instruction de planification, puis les promeut auprès des grandes et petites terminaux comme guide des activités de production ou des activités de la vie. \nBien que ce système ne soit pas obligatoire, le gouvernement chinois le fournit comme un service aux entreprises et aux citoyens pour la consommation et l'utilisation à un coût très faible, mais la tendance rapide du changement social qu'il entraîne, l'énorme libération de la productivité et la promotion ouverte et cachée du gouvernement rendent difficile pour chacun de refuser de traiter avec ce système qui pénètre dans tous les coins de la société."
CHI_policy_of_redemption_idea: "Politique de rachat"
CHI_policy_of_redemption_idea_desc: "L'idée de rachat est divisée en quatre groupes, c'est-à-dire que l'impôt sur le revenu de l'État, le fonds public des entreprises, la prime de bien-être des employés et les dividendes de l'entrepreneur sont répartis entre quatre groupes. Le revenu de l'entrepreneur est limité à environ 1/4 du profit de l'entreprise. En une certaine période, l'état verse à l'entrepreneur 5% des dividendes chaque année en fonction des actions privées dans l'entreprise conjointe publique-privée."
beidou_satelite_navigation_system: "$beidou_satelite_navigation$"
beidou_satelite_navigation_system_desc: "$beidou_satelite_navigation_desc$"
beidou_satelite_navigation: "Système de navigation par satellite Beidou"
beidou_satelite_navigation_desc: "Le système de navigation par satellite Beidou est un système de navigation par satellite développé indépendamment par la Chine. C'est aussi le troisième système de navigation par satellite mature après le GPS et le GLONASS. Avec le développement de la construction et des capacités de service du système Beidou, les produits associés ont été largement utilisés dans les transports, la pêche maritime, la surveillance hydrologique, la prévision météorologique, l'arpentage géographique des informations, la prévention des incendies de forêt, le système de temps de communication, la répartition de l'électricité, la réduction des catastrophes, la recherche et le sauvetage d'urgence et d'autres domaines, pénétrant progressivement dans tous les aspects de la production sociale humaine et de la vie des gens, insufflant une nouvelle vitalité au développement économique et social mondial."
ban_Korean_culture: "Interdiction de la culture coréenne"
ban_Korean_culture_desc: "L'industrie du divertissement de la Corée est fortement dépendante du marché chinois, ce qui a entraîné l'interdiction par la Chine de l'industrie du divertissement coréenne, ce qui a gravement impacté l'économie coréenne."
The_China_Dream: "Le rêve chinois"
The_China_Dream_desc: "Réaliser la grande renaissance de la nation chinoise est le plus grand rêve de la nation chinoise moderne. La plus grande caractéristique du rêve chinois est qu'il considère le pays, la nation et l'individu comme une communauté de destins, et relie étroitement les intérêts du pays, la nation et les intérêts spécifiques de chaque individu. \n\nLe \"rêve chinois\" concerne la future orientation de développement de la Chine et incarne l'aspiration et l'attente chinoise pour la grande renaissance de la nation chinoise ; c'est le rêve que toute la nation chinoise poursuit, et c'est le souhait de longue date de centaines de millions de personnes de génération en génération. Chaque Chinois est un participant et un créateur du rêve chinois."
CHI_Economically_advanced_countries: "Pays économiquement avancés soutenus par la Chine"
CHI_Economically_advanced_countries_desc: "Dans le passé, ce pays pouvait bénéficier de plus d'avantages de la mondialisation économique, tels que l'externalisation bon marché de la main-d'œuvre internationale ou les importations de biens de consommation à bas prix, en raison de son économie intrinsèquement développée ou de sa position supérieure dans le système mondial dominé par les États-Unis. \n\nAujourd'hui, sous l'appel de la Chine, ce pays a commencé à s'opposer au système d'hégémonie centré sur les États-Unis, et a ainsi exprimé son approbation de l'ordre international diversifié soutenu par la Chine."
CHI_Economically_advanced_countries_2: "Pays économiquement avancés soumis aux sanctions chinoises"
CHI_Economically_advanced_countries_2_desc: "Dans le passé, ce pays pouvait bénéficier de plus d'avantages de la mondialisation économique, tels que l'externalisation bon marché de la main-d'œuvre internationale ou l'importation de biens de consommation à bas prix, en raison de son économie intrinsèquement développée ou de sa position supérieure dans le système mondial dominé par les États-Unis. \n\nAujourd'hui, ce pays a été soumis aux sanctions économiques chinoises pour son refus de se joindre à la Chine pour s'opposer au système d'hégémonie centré sur les États-Unis, ce qui a eu un impact très négatif sur son économie intérieure."
Economic_dependency_countries_2: "Pays économiquement sous-développés soutenus par la Chine"
Economic_dependency_countries_2_desc: "Dans le passé, ce pays a en fait exprimé sa soumission au système économique mondial dominé par les États-Unis et a tenté de s'intégrer dans ce système. Il a utilisé sa main-d'œuvre importante et bon marché ou ses riches ressources naturelles pour continuer à exporter des biens de consommation bon marché ou des matières premières à bas prix dans les pays développés. \n\nMaintenant, sous l'appel de la Chine, ce pays a commencé à s'opposer au système hégémonique avec les États-Unis comme noyau, et a ainsi exprimé son approbation du nouvel ordre international diversifié soutenu par la Chine."
Confronting_the_USA_countries_2: "Pays soutenus dans l'affrontement avec le système américain"
Confronting_the_USA_countries_2_desc: "Ce pays se rebelle contre le système mondial dominé par les États-Unis, mais aujourd'hui, ils sont soutenus par la Chine et leur développement socio-économique s'améliore."
Heritage_of_WW2: "Héritage de la Seconde Guerre mondiale"
Heritage_of_WW2_desc: "Les Japonais n'aiment pas mentionner l'histoire de la Seconde Guerre mondiale. Ils ne veulent pas s'embarquer à nouveau sur la voie du militarisme, et ils n'ont plus personne pour qui mourir. La vigilance et le rejet de la guerre sont le consensus de la plupart des Japonais."
JAP_turbulent_political_situation: "Situation politique turbulente"
JAP_turbulent_political_situation_desc: "Depuis la mort soudaine du Premier ministre Keizo Obuchi, les Premiers ministres japonais ont changé fréquemment, ce qui a rendu impossible la formulation de politiques stables à long terme. Le dilemme d'être oublié par le Premier ministre est difficile à résoudre."
JAP_weak_army: "Forces d'autodéfense faibles"
JAP_weak_army_desc: "Les forces d'autodéfense japonaises ne sont pas une armée standard par nature. Elles sont longtemps restées supprimées par le gouvernement japonais avec des salaires bas et des politiques lourdes. La plus grande difficulté, c'est que le peuple japonais ne les considère pas comme une force à être fiers. Il est très difficile pour les forces d'autodéfense de recruter des soldats. Après une longue période de paix, ils n'ont pas appris à utiliser des armes."
JAP_military_constrained_by_bureaucrats: "Contrôle civil de l'armée"
JAP_military_constrained_by_bureaucrats_desc: "Les forces d'autodéfense japonaises sont gérées par les bureaucrates du gouvernement japonais, sont encombrées par l'organisation et sont très lentes à se mobiliser."
JAP_Huge_overseas_assets: "D'énormes actifs à l'étranger"
JAP_Huge_overseas_assets_desc: "Le Japon est le pays ayant le plus d'actifs net à l'étranger, les actifs à l'étranger dépassant même son PIB total."
JAP_leftwing_trend: "Tendance de gauche au Japon"
JAP_leftwing_trend_desc: "Le mouvement vigoureux de la gauche qui a éclaté dans le Japon d'après-guerre a eu un impact profond sur la société japonaise. Il a progressivement diminué après les années 1970, mais il continue d'avoir une forte influence dans le domaine de la littérature et de l'art."
JAP_Controlled_bureaucrats: "Bureaucrates contrôlés"
JAP_Controlled_bureaucrats_desc: "Les bureaucrates contrôlés sont de bons assistants pour le Premier ministre. Nous avons besoin de fidèles serviteurs."
Right_as_Prime_Minister: "Droite comme Premier Ministre"
Right_as_Prime_Minister_desc: "Les opérations politiques sont du ressort du Premier Ministre. Un Premier Ministre qui remplit ses devoirs est un bon Premier Ministre."
middleclass_country: "pays de classe moyenne"
middleclass_country_desc: "Dans les années 1970, il y avait une expression populaire au Japon appelée \"100 millions de classes moyennes\". Dans l'enquête d'opinion menée par le gouvernement central chaque année, on a demandé aux gens \"Le statut économique de votre famille est-il supérieur, moyen supérieur, moyen, moyen inférieur, ou inférieur\", la proportion de ceux qui ont répondu qu'ils étaient \"moyen supérieur, moyen, ou moyen inférieur\" était de 72% en 1958, et dépassait 90% en 1973\n————\"Notre génération de Tokyoïtes\" par Ichiro Arai"
Education_Highland: "Haut plateau de l'éducation"
Education_Highland_desc: "Le Japon a continuellement investi dans l'éducation depuis l'époque moderne, formant l'un des systèmes éducatifs les plus complets au monde. Son enseignement supérieur jouit d'une réputation élevée dans le domaine mondial et a obtenu de nombreux résultats. Le Japon est le pays avec le plus de lauréats du prix Nobel en Asie."
Patriarchal_society: "Société patriarcale"
Patriarchal_society_desc: "Bien que le Japon soit l'un des pays les plus développés, le système patriarcal de \"le père détient le plus de pouvoir dans la famille, le chef de famille détient le plus de pouvoir dans la famille, et le souverain suprême détient le plus de pouvoir dans le pays\" est encore profondément ancré dans la société japonaise."
Cyberpunk_Countries: "Pays cyberpunk"
Cyberpunk_Countries_desc: "Des entreprises géantes, l'intelligence artificielle, d'énormes villes, des bidonvilles, des lumières néon, le passé et le présent, l'Ouest et l'Est, la guerre et la paix. Combien de personnes marchant rapidement avec des parapluies transparents à Tokyo un jour de pluie lèveraient les yeux vers le ciel à travers la brume lumineuse et colorée ?"
Low_desire_society: "Société à faible désir"
Low_desire_society_desc: "La population diminue, la population vieillit, et il y a de plus en plus de jeunes qui ont perdu leur ambition et leur désir. Les citoyens détiennent une grande quantité d'actifs financiers, et les entreprises ont des réserves internes élevées, mais ils échouent à utiliser les fonds efficacement. Ni l'assouplissement monétaire ni l'investissement public ne peuvent stimuler la confiance des consommateurs, et la politique de jeter de l'argent partout est incapable de revitaliser l'économie. Les jeunes ne sont pas intéressés par la consommation traditionnelle et les modes de vie tels que l'achat de maisons, de voitures, le mariage et la naissance d'enfants. Ils préfèrent vivre une vie simple, confortable et autosatisfaite. La culture du séjour à la maison est répandue, et les jeunes sont accros au monde virtuel d'Internet, des jeux et de l'animation, manquant d'interaction sociale et d'un sens des responsabilités. Les nouveaux groupes sociaux tels que les hommes herbivores et les femmes sèches ont montré de l'indifférence et de la négativité envers l'amour hétéro et les relations sexuelles, conduisant à un marché matrimonial déprimé et à un déclin de la fécondité."
aging_population: "Société vieillissante"
aging_population_desc: "Le Japon est le pays avec la population vieillissante la plus grave au monde. La population de plus de 65 ans représente 27% de la population totale. La demande des consommateurs est insuffisante, la dynamique de croissance économique est faible, et le système de protection sociale représenté par les pensions est proche de l'effondrement."
JAP_weak_army: "Forces d'autodéfense faibles"
JAP_weak_army_desc: "Les forces d'autodéfense japonaises ne sont pas une armée standard par nature. Elles ont longtemps été supprimées par le gouvernement japonais avec des salaires bas et des politiques lourdes. La chose la plus importante, c'est que le peuple japonais ne les considère pas comme une force de défense nationale fière. Il est même difficile pour les forces d'autodéfense de recruter des soldats. Après une longue période de paix, ils n'ont pas appris à utiliser des armes."
JAP_military_constrained_by_bureaucrats: "Contrôle civil de l'armée"
JAP_military_constrained_by_bureaucrats_desc: "Les forces d'autodéfense japonaises sont complètement gérées par la bureaucratie du gouvernement japonais. Elles sont très lourdes en organisation et très lentes à se mobiliser, et sont incapables de supporter la lourde responsabilité de la guerre."
JAP_economy: "Récession économique"
JAP_economy_desc: "Après l'éclatement de la bulle des actifs dans les années 1990, le Japon a connu près d'une décennie de faible croissance économique et de déflation continue, qui a fait perdre de la vitalité aux résidents et aux entreprises et a fait perdre l'innovation à la société. Après l'éclatement de la bulle économique, les politiques fiscales et monétaires du Japon ont été renforcées, mais comme il n'a pas prêté attention aux dangers cachés des entreprises zombies, cela a conduit à la crise bancaire au Japon en 1997 ; en 1999, il a commencé à mettre en œuvre une politique de taux d'intérêt zéro, mais n'a pas fermement ancré les prix, de sorte que la politique a été immédiatement annulée dès que la situation économique s'est améliorée en 2000, ce qui a aggravé les anticipations de déflation et a affecté la crédibilité de la Banque du Japon\nL'économie japonaise est dans une situation étrange insoluble"
HKG_special_administrative_region: "Région administrative spéciale de Hong Kong"
HKG_special_administrative_region_desc: "La Région administrative spéciale de Hong Kong est une région administrative au niveau provincial établie conformément à la Constitution de la République populaire de Chine. C'est une région administrative locale sous le gouvernement populaire central, tout comme les provinces, les régions autonomes et les municipalités relevant directement de l'autorité centrale. Le 1er juillet 1997, le gouvernement chinois a rétabli l'exercice de la souveraineté sur Hong Kong et la Région administrative spéciale de Hong Kong a été établie. Le gouvernement central a compétence complète sur Hong Kong. Hong Kong maintient son système capitaliste original et jouit d'un haut degré d'autonomie dans toutes les matières à l'exception des affaires étrangères et de la défense. Il participe aux organisations internationales et aux conférences internationales auxquelles les pays ne participent pas sous le nom de \"Hong Kong, Chine\". \"Un pays, deux systèmes\", \"les Hongkongais administrant Hong Kong\" et un haut degré d'autonomie sont les politiques de base du gouvernement chinois."
MAC_special_administrative_region: "Région administrative spéciale de Macao"
MAC_special_administrative_region: "La Région administrative spéciale de Macao est une région administrative au niveau provincial établie conformément à la Constitution de la République populaire de Chine. Comme les provinces, les régions autonomes et les municipalités relevant directement de l'autorité centrale, c'est une région administrative locale sous le gouvernement populaire central. Le 20 décembre 1999, le gouvernement chinois a rétabli l'exercice de la souveraineté sur Macao, et la Région administrative spéciale de Macao a été formellement établie. Les principes de base des relations entre le gouvernement central et la Région administrative spéciale de Macao sont \"un pays, deux systèmes\", \"les Macanais administrant Macao\" et un haut degré d'autonomie."
MON_special_administrative_region: "Région administrative spéciale de Mongolie"
MON_special_administrative_region_desc: "La Région administrative spéciale de Mongolie est une région administrative au niveau provincial établie conformément à la Constitution de la République populaire de Chine. Comme les provinces, les régions autonomes et les municipalités, c'est une région administrative locale sous le gouvernement populaire central. Après que le gouvernement chinois a rétabli sa souveraineté sur la Mongolie, le gouvernement central s'est référé à l'expérience pertinente de l'autonomie régionale dans la Région autonome de Mongolie intérieure et a maintenu les principes de base des relations avec la Région administrative spéciale de Mongolie comme \"un pays, deux systèmes\", \"les Mongoliens gouvernant la Mongolie\" et un haut degré d'autonomie."
TAI_special_administrative_region: "Région administrative spéciale de Taiwan"
TAI_special_administrative_region_desc: "La Région administrative spéciale de Taiwan est une région administrative au niveau provincial établie conformément à la Constitution de la République populaire de Chine. C'est une région administrative locale sous le gouvernement populaire central, tout comme les provinces, les régions autonomes et les municipalités. Après que le gouvernement chinois a rétabli l'exercice de la souveraineté sur Taiwan, il a exercé une gouvernance complète sur Taiwan. Hong Kong a maintenu son système capitaliste original et a joui d'un haut degré d'autonomie dans toutes les matières à l'exception des affaires étrangères et de la défense. Il a participé aux organisations internationales et aux conférences internationales auxquelles les pays ne participaient pas sous le nom de \"Taiwan, Chine\". \"Un pays, deux systèmes\", \"les Taïwanais gouvernant Taiwan\" et un haut degré d'autonomie sont les politiques de base du gouvernement chinois."
JAP_special_administrative_region: "Région administrative spéciale du Japon"
JAP_special_administrative_region_desc: "La Région administrative spéciale du Japon est une région administrative au niveau provincial établie conformément à la Constitution de la République populaire de Chine. C'est une région administrative locale sous le gouvernement populaire central, tout comme les provinces, les régions autonomes et les municipalités relevant directement du gouvernement central. L'Empereur du Japon est le président nominal de la Région administrative spéciale du Japon. L'Empereur est le symbole de la Région administrative spéciale du Japon, et son statut est basé sur la volonté de tous les Japonais de la région. Le gouvernement central de la République populaire de Chine exerce une gouvernance complète sur le Japon. Le Japon maintient son système capitaliste original et jouit d'un haut degré d'autonomie dans toutes les affaires à l'exception des affaires étrangères. Il est autorisé à conserver les Forces d'autodéfense pour se défendre et participe aux organisations internationales et aux conférences internationales auxquelles les pays ne participent pas au nom de la \"Région administrative spéciale du Japon\". \"Un pays, deux systèmes\", \"la paix par le peuple\" et un haut degré d'autonomie sont les politiques de base du gouvernement chinois."
CHI_special_administrative_region: "Région administrative spéciale"
CHI_special_administrative_region_desc: "Les régions administratives spéciales sont généralement des régions administratives au niveau provincial. Comme les provinces, les régions autonomes et les municipalités, ce sont des régions administratives locales sous le gouvernement populaire central. Elles sont politiquement gouvernées par un haut degré d'autonomie par les populations locales, et certaines peuvent même maintenir leurs propres forces armées."
TAI_military_tradition: "Tradition militaire nationale"
TAI_military_tradition_desc: "Les troupes amies restent aussi stables qu'une montagne"
CHI_Popular_local_network_culture: "Culture populaire nationale"
CHI_Popular_local_network_desc: "La grande communauté de réseaux locaux du pays a créé une culture de réseau populaire locale florissante."
CHI_Maoism: "Pensée Mao Zedong"
CHI_Maoism_desc: "§RLe vent d'ouest est fort, et le ciel est rempli d'une lune glaciale du matin d'hiver, à travers les rayons de l'aube\nLa lune glacée du matin, le son des sabots des chevaux se brise, le son des cornes s'étouffe\nLa route en avant est aussi dure que le fer, mais maintenant nous franchissons un nouveau pas\nDepuis le début, les montagnes sont comme la mer, et le coucher de soleil est sanglant§!"
CHI_Deng_Xiaoping_Theory: "Théorie Deng Xiaoping"
CHI_Deng_Xiaoping_Theory_desc: "Deng Xiaoping a souligné que l'essence du socialisme était de libérer les forces productives, de développer les forces productives, d'éliminer l'exploitation, d'éliminer la polarisation et de parvenir finalement à une prospérité commune. Les trois principes \"profitables\", tels que \"s'il est favorable au développement des forces productives dans la société socialiste\", devraient être utilisés comme critères pour juger si la réforme et l'ouverture étaient \"capitalistes\" ou \"socialistes\". Il faut mettre l'accent sur l'édification économique comme centre, sur le respect des quatre principes de base et le respect de la réforme et de l'ouverture comme deux points de base comme ligne de base, la construction d'un système d'économie de marché socialiste et le développement du socialisme aux caractéristiques chinoises."
three_represents: "Trois Représentatifs"
three_represents_desc: "Le Parti communiste de Chine doit toujours représenter les exigences de développement des forces productrices avancées de la Chine\nLe Parti communiste de Chine doit toujours représenter la direction de la culture avancée de la Chine\nLe Parti communiste de Chine doit toujours représenter les intérêts fondamentaux de la grande majorité du peuple chinois"
scientific_outlook_on_development: "Concept scientifique de développement"
scientific_outlook_on_development_desc: "La première priorité du concept scientifique de développement est le développement, la position centrale est centrée sur les personnes, l'exigence de base est la coordination globale et la durabilité, et la méthode fondamentale est la coordination et l'équilibre"
xi_thought: "La pensée de Xi Jinping sur le socialisme avec des caractéristiques chinoises pour une nouvelle ère"
xi_thought_desc: "La pensée de Xi Jinping sur le socialisme avec des caractéristiques chinoises pour une nouvelle ère est un guide d'action pour l'ensemble du Parti et le peuple de tout le pays pour lutter pour la grande revitalisation de la nation chinoise. La pensée de Xi Jinping sur le socialisme avec des caractéristiques chinoises pour une nouvelle ère est le marxisme chinois contemporain, le marxisme du 21ème siècle, et l'essence de la culture et de l'esprit de l'ère chinoise. Elle a réalisé un nouveau saut dans la sinisation et la modernisation du marxisme\n\"Dix clarifications\", \"Quatorze persistances\", \"Treize réalisations\", \"Six doit être\""
RAJ_Equipment_Design: "Conception d'équipement indien"
RAJ_Equipment_Design_desc: ""
CHI_Independent_Africa: "Afrique indépendante"
CHI_Independent_Africa_desc: "L'ancienne terre se revitalise avec l'aide du dragon de l'Est."
