CHI_Chastity_Paifang_1: "Coexistence pacifique"
CHI_Chastity_Paifang_1_desc: "Le XXIe siècle est un siècle de paix et de développement, du moins c'est ce que la plupart des gens croient actuellement. Si nous voulons décevoir toute la société avec l'ordre mondial existant et la pousser activement à le changer, nous devons encore faire des efforts et un travail considérables.\n\nVolonté de guerre globale actuelle $CHI_Chastity_Paifang_war_willingness$ : [?CHI_Chastity_Paifang_war_willingness|Y]，Changement le mois dernier :[?CHI_Chastity_Paifang_war_willingness_show|+=2]"
CHI_Chastity_Paifang_2: "L'ascension de la Chine"
CHI_Chastity_Paifang_2_desc: "L'arbre souhaite le calme, mais le vent ne s'arrête pas. La poussière ne disparaîtra pas tant que le balai n'arrive pas. L'arme de la critique ne peut remplacer la critique par les armes. Cet ordre mondial injuste tourmente le monde depuis trop longtemps !\n\nVolonté de guerre globale actuelle $CHI_Chastity_Paifang_war_willingness$ : [?CHI_Chastity_Paifang_war_willingness|Y]，Changement le mois dernier :[?CHI_Chastity_Paifang_war_willingness_show|+=2]"
