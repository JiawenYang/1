l_french:
 SPR_deindustrialization_desc: "Des années et des années d'externalisation et de complaisance ont conduit à une diminution rapide du secteur industriel."
 scientific_outlook_on_development_desc: "La perspective scientifique sur le développement intègre le socialisme scientifique, le développement durable, le bien-être social, une société humaniste, une démocratie accrue et, en fin de compte, la création d'une société socialiste harmonieuse."
 xi_jinping_thought_desc: "La pensée de Xi Jinping est un ensemble de politiques et d'idées dérivées des écrits et des discours du secrétaire général du Parti communiste chinois Xi Jinping. Elle se concentre sur le marxisme-léninisme et la pensée de Mao Zedong, la place de la Chine dans l'histoire, la concurrence stratégique avec les nations capitalistes et un appel à adhérer aux objectifs du communisme."

 agrarian_economy_desc: "[FROM.GetName] est une nation extrêmement pauvre, dont l'économie est principalement basée sur les gains agricoles. Alors que le pays se modernise dans le nouveau millénaire, les gens travailleront dans les champs pour aider l'économie.\n\n§Y$agrarian_economy$§! fait gagner à §Y[?ROOT.GetName]§! §Y$$§![?additional_income_agrarian_economy|+3] §YMilliard§! par semaine.\n\n§RA $4,000 PIB/hab, nous serons considérés comme industrialisés et perdrons le bonus à l'agriculture!§!"

industrial_complex_desc: "Ce bâtiment fournit à l'État une industrie pour la production de biens civils ou la construction de nouveaux bâtiments. Peut être converti en industrie militaire si nécessaire.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y415 000§!\nProduction de base du PIB par §Yindustrie civile§! : §Y20 milliards $§!\nConsommation de base d'énergie : §R-0,4§! GW\n"
 arms_factory_desc: "Ce bâtiment fournit à l'État une industrie pour la production de nouveaux équipements militaires. Peut être converti en industrie civile si nécessaire.\n\nFournit à l'État:\nNombre de base de travailleurs requis: §Y100K§!\nPIB de base par §YIndustrie Militaire§!: $§Y4 Milliard§!\nConsommation d'énergie de base: §R-0.4§! GW"
 dockyard_desc: "Les §Ychantiers navals§! représentent la capacité d'un État à produire des navires militaires de toutes sortes, allant des §Ybateaux de patrouille§!, §Yconvois§!, §Ydestroyers§!, §Yporte-avions§! et plus encore.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y100 000§!\nProduction de base du PIB par §Ychantier naval§! : §Y4 milliards $§!\nConsommation de base d'énergie : §R-0,4§! GW\n"
CHI_idea_high_speed_railway_modifier: "Train à grande vitesse"
CHI_idea_high_speed_railway_modifier_desc: ""
CUB_idea_blockade_desc: "\n\n\n\n\n£GFX_CUB_outpost_of_socialism_embed \n\n\n\n\n\n\nL'histoire de notre nation a été marquée par souffrance après souffrance, pourtant nous sommes plus puissants que jamais ! Nous avons chassé le dictateur Batista de notre pays, nous avons montré aux Américains qu'ils ne sont pas tout-puissants, et nous avons prouvé que la détermination du peuple cubain est inébranlable !\n\nPourtant nous sommes toujours seuls, loin de nos alliés de l'autre côté de la mer. Au nord, le grand aigle est perché, attendant avidement le moment où nous trébucherons pour fondre sur nous et nous arracher la gorge. Pour l'instant, ils sont restés patients, mais cela pourrait changer à tout moment. Pourtant, nous tenons bon, unis et prêts pour leurs serres !"
CUB_land_of_freedom_idea_desc: "\n\n\n\n\n£GFX_CUB_blockade_embed \n\n\n\n\n\n\nCuba est sous embargo total sur les exportations imposé par son puissant voisin les États-Unis depuis 1962 en raison du régime communiste. Cela impacte sévèrement à la fois l'industrie et la vie sur l'île."
GER_Bundeswehr_modifier: "Bundeswehr"
GER_Bundeswehr_modifier_desc: "La Bundeswehr est les forces armées de la République fédérale d'Allemagne et de son parlement librement élu. Elle comprend à la fois les forces militaires elles-mêmes et les secteurs civils. Les forces armées consistent en quatre branches : Armée de terre, Armée de l'air, Marine, et Domaine cyber et information, ainsi que le secteur de soutien."
PENINSULA_SHIELD: "Force Bouclier de la Péninsule"
peninsula_shield_force_member: "Force Bouclier de la Péninsule"
peninsula_shield_force_member_desc: "Les Forces Bouclier de la Péninsule sont une organisation militaire régionale qui coordonne les efforts conjoints de défense et de sécurité parmi les États membres du CCG. Son emblème symbolise l'unité, la protection et la préparation, représentant les capacités de défense collective des pays du CCG."
PRC_taiwan: "Région administrative spéciale de Taïwan"
PRC_taiwan_desc: "Taïwan est intégrée à la République populaire de Chine en tant que Région administrative spéciale de Taïwan (RAS de Taïwan). Sous le principe « un pays, deux systèmes », Taïwan conserve un haut degré d’autonomie, son propre système économique capitaliste, ses institutions démocratiques, sa monnaie (le nouveau dollar taïwanais), son drapeau, son hymne et ses forces armées distinctes, tout en étant placée sous la souveraineté de la RPC. Pékin s’engage à ne pas envoyer de troupes ni d’agents du Parti sur l’île, sauf en cas de menace grave à la sécurité nationale. En échange, Taïwan renonce officiellement à toute revendication de représenter la Chine entière et accepte le statut de province autonome de haut niveau."
  christian: "Catholique"
  christian_desc: "Le catholicisme est le nom d'une tradition chrétienne dont les racines remontent à l'ancien rite latin et qui reconnaît le Pape comme chef de la chrétienté."
 israel_military: "Forces de défense israéliennes"
 egypt_military: "Forces armées égyptiennes"
 india_military: "Forces armées indiennes"
  confucian: "Confucianiste"
  confucian_desc: "Le confucianisme désigne les philosophies du penseur du Ve siècle av. J.-C. Confucius et met l'accent sur le développement personnel ainsi que sur l'importance d'un bon gouvernement."
  coptic: "Copte"
  coptic_desc: "Le christianisme copte est une branche de la chrétienté qui suit le rite alexandrin et qui répond au patriarche d'Alexandrie."
  hindu: "Hindou"
  hindu_desc: "L'hindouisme désigne un large éventail de traditions polythéistes indiennes partageant un panthéon commun."
  ibadi: "Ibadite"
  ibadi_desc: "L'ibadisme est revendiqué par ses adeptes comme plus ancien que l'islam sunnite et chiite, mais il est loin d'être aussi répandu. Les ibadites insistent sur une adhésion stricte à une interprétation de l'islam et de la charia qu'ils considèrent à la fois plus ancienne et plus orthodoxe."
  jewish: "Juif"
  jewish_desc: "La plus ancienne religion abrahamique du jeu, le judaïsme s'appuie sur la Torah ainsi que sur les traditions et écritures du peuple juif remontant à plus de 3000 ans."
  mahayana: "Mahayana"
  mahayana_desc: "Le mahayana est la branche du bouddhisme la plus largement pratiquée. L'objectif de ses adeptes est d'atteindre l'éveil, voire même la bouddhéité."
  mormon: "Mormon"
  mormon_desc: "Le mormonisme est un mouvement religieux fondé par Joseph Smith aux États-Unis dans les années 1820. Les mormons ont développé un fort sens de la communauté et entretiennent des liens solides entre générations et avec la famille élargie, reflétant leur croyance que les familles peuvent être scellées ensemble au-delà de la mort."
  orthodox: "Orthodoxe"
  orthodox_desc: "La tradition chrétienne orthodoxe a ses racines dans le rite grec et se considère plus proche des idéaux chrétiens originels que le catholicisme. Les Églises orthodoxes rejettent l'idée d'un pape et sont divisées en plusieurs Églises présidées par des patriarches."
  protestant: "Protestant"
  protestant_desc: "Le protestantisme regroupe un large éventail de traditions religieuses issues des enseignements de Martin Luther lors de la Réforme. Ils réagissent contre un certain nombre de conventions développées au fil du temps dans l'Église catholique et contre l'idée même d'un pape."
  shia: "Chiite"
  shia_desc: "Les musulmans chiites considèrent que le successeur légitime du prophète Mahomet en tant que calife et imam était son cousin et gendre Ali. Les chiites croient qu'une lignée d'imams a suivi Ali et qu'ils attendent toujours l'avènement de son successeur final."
  shinto: "Shinto"
  shinto_desc: "Le shintoïsme est l'ancienne religion ethnique du Japon qui, au fil des siècles, a coexisté avec le confucianisme et le bouddhisme sur les îles japonaises."
  sikh: "Sikh"
  sikh_desc: "Le sikhisme est la foi fondée par Guru Nanak au tournant du XVIe siècle au Pendjab. Religion monothéiste, le sikhisme est né dans une région où l'islam et l'hindouisme se mêlent, mais il diffère profondément des deux dans de nombreux aspects."
  sunni: "Sunnite"
  sunni_desc: "L'islam sunnite considère que le successeur légitime du prophète Mahomet était son beau-père Abou Bakr."
  theravada: "Theravada"
  theravada_desc: "Comme toutes les branches bouddhistes, le theravada provient des enseignements de Gautama Bouddha au Ve siècle av. J.-C. Les adeptes du bouddhisme theravada s'appuient sur les canons pali pour leur guidance religieuse et juridique, et mettent l'accent sur les devoirs monastiques et l'atteinte du statut d'arhat ou de l'éveil."
  vajrayana: "Vajrayana"
  vajrayana_desc: "Également connu sous le nom de bouddhisme tantrique ou même de lamaïsme, le vajrayana est une branche du bouddhisme où l'objectif des adeptes est de devenir un bodhisattva par l'usage de techniques tantriques. On considère que l'éveil ne peut être atteint par la simple étude solitaire, mais doit être enseigné par un maître."