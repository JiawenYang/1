l_french:
 mexico_city_desc: "----\n§9Bâtie sur un lac asséché et en train de s'enfoncer gentiment, Mexico reste la ville la plus bruyante, la plus active et la plus vivante des Amériques.§!"
 detroit_desc: "----\n§9Le moteur de Motown a peut-être calé, mais le tempo n'a jamais cessé. Les friches se couvrent de fleurs là où les usines fabriquaient des Ford.§!"
 san_antonio_desc: "----\n§9Souvenez-vous de l'Alamo, puis commandez un bol de chili et oubliez le reste du programme.§!"
 birmingham_desc: "----\n§9Acier, soul et statue de taureau en centre-ville : une ville qui a dû apprendre à la dure comment changer de refrain.§!"
 tampa_desc: "----\n§9Cigarieries, centres commerciaux et deux trophées de hockey que personne en Floride n'attendait.§!"
 ottawa_desc: "----\n§9Une capitale si polie que même les chats de la Colline du Parlement ont une habilitation. Rien ne s'y passe, et c'est bien le but.§!"
 denver_desc: "----\n§9La ville du mile haut : les Rocheuses vous regardent courir et l'air lui-même compte comme une séance de sport.§!"
 portland_desc: "----\n§9Gardez Portland bizarre — puis expliquez au serveur pourquoi vous êtes encore vegan à deux heures du matin.§!"
 dallas_desc: "----\n§9Grands cheveux, plus gros pick-up, et une skyline qui brille surtout dans les rediffusions des années 1980.§!"
 toronto_desc: "----\n§9Six millions de gens qui s'excusent avant de klaxonner, et une tour qui regarde encore de haut le reste de la ville.§!"
 minneapolis_desc: "----\n§9Dix mille lacs, une ligne de tramway, et un hiver qui dépose une plainte officielle contre votre visage.§!"
 las_vegas_desc: "----\n§9Ce qui se passe ici reste ici. Les dettes, elles, rentrent à la maison avec vous.§!"
 atlanta_desc: "----\n§9Une circulation assez épaisse pour compter comme phénomène météo, et toujours la capitale du hip-hop du Sud et des escales aéroportuaires.§!"
 columbus_desc: "----\n§9La plus grande petite ville de l'Ohio : un marché-test pour tout ce que l'Amérique finit par acheter.§!"
 san_diego_desc: "----\n§9Un temps parfait, une base navale et un zoo qui vaut presque un monument national.§!"
 austin_desc: "----\n§9Moitié start-up, moitié honky-tonk, et le tout coincé sur l'Interstate 35.§!"
 oklahoma_city_desc: "----\n§9L'argent du pétrole, le tonnerre des prairies et un mémorial qui rappelle que le ciel, ici, ne plaisante pas.§!"
 sacramento_desc: "----\n§9La ville du gouvernement californien : étés brûlants, amandiers, et des fleuves qui n'ont jamais signé le plan sécheresse.§!"
 indianapolis_desc: "----\n§9Le carrefour de l'Amérique, où mai est une religion et le circuit son cathédrale.§!"
 buffalo_desc: "----\n§9Tempêtes de neige d'effet lacustre, cran ouvrier, et des wings servies avec du céleri que vous ignorerez totalement.§!"
 cape_town_desc: "----\n§9Table Mountain, deux océans, et un vent si fort qu'il change de nom chaque après-midi.§!"
 cairo_desc: "----\n§9Vingt millions d'habitants, un fleuve de circulation, et des pyramides visibles depuis le parking d'un centre commercial.§!"
 alexandria_desc: "----\n§9Une grande bibliothèque a brûlé jadis ; la nouvelle a de meilleures sauvegardes et une meilleure vue.§!"
 volgograd_desc: "----\n§9La ville qui s'est renommée deux fois et tient toujours là où la Volga fait son dernier virage avant la Caspienne.§!"
 rostovdon_desc: "----\n§9Porte sud du Don : commerce fluvial, chants de supporters et une skyline qui se reconstruit sans cesse.§!"
 yekaterinburg_desc: "----\n§9Là où l'Oural rencontre l'argent — béton soviétique contre tours de verre, et un dernier tsar tragique en cave.§!"
 nizhnynovgorod_desc: "----\n§9La foire qui a enrichi la Volga ; aujourd'hui, on y fabrique des logiciels et des voitures plutôt que des disputes.§!"
 novosibirsk_desc: "----\n§9La plus grande ville de Sibérie, bâtie à la hâte pour le chemin de fer, toujours portée par l'entêtement universitaire.§!"
 kazan_desc: "----\n§9Capitale tatare où une mosquée et une cathédrale orthodoxe partagent la même skyline sans se battre.§!"
 tallinn_desc: "----\n§9Une vieille ville médiévale avec un gouvernement numérique : on vote en ligne et on marche encore sur les pavés.§!"
 riga_desc: "----\n§9Façades Art nouveau, vent balte, et un festival de chant chaque été qui couvre le bruit de la politique.§!"
 vilnius_desc: "----\n§9Églises baroques et une république d'artistes autoproclamée de l'autre rive du fleuve, sans passeport.§!"
 chisinau_desc: "----\n§9Des caves à vin plus longues que le pays est large, et un maire qui a un jour attaqué les feux rouges en justice.§!"
 tiraspol_desc: "----\n§9Un conflit gelé avec un Lénine toujours sur la place centrale et une monnaie que personne dehors ne peut dépenser.§!"
 odessa_desc: "----\n§9Escalier Potemkine, brise marine et un humour qui survit absolument à tout.§!"
 lvov_desc: "----\n§9Café, pavés et une gueule de bois habsbourgeoise — dans le meilleur sens du terme.§!"
 belgrade_desc: "----\n§9Là où la Save rejoint le Danube et où les splavs rencontrent le lever du soleil : une ville qui fait la fête sur ses propres ruines.§!"
 budapest_desc: "----\n§9Deux villes, un fleuve, et des bains thermaux bâtis par des Romains qui n'avaient pas prévu les bars en ruine.§!"
 prague_desc: "----\n§9Cent flèches, un château, et une bière moins chère que la dignité d'un touriste.§!"
 bratislava_desc: "----\n§9Une petite capitale qui a gardé le château, perdu l'empire, et sert aujourd'hui la meilleure bière dans un rayon de quarante minutes.§!"
 munich_desc: "----\n§9Brasseries, BMW et une Oktoberfest qui fait porter à la terre entière des lederhosen trop petits.§!"
 hamburg_desc: "----\n§9Ville portuaire avec un quartier d'entrepôts que l'UNESCO adore et que la marée teste sans cesse.§!"
 frankfurt_desc: "----\n§9Tours de banques, une vieille ville minuscule, et une gare où chaque train est une dispute.§!"
 hannover_desc: "----\n§9Salons professionnels, une ligne rouge à travers la ville, et la skyline la plus plate d'Allemagne.§!"
 koln_desc: "----\n§9Une cathédrale qui a pris 632 ans, l'eau de Cologne 4711, et un carnaval qui met la Rhénanie en pause.§!"
 stuttgart_desc: "----\n§9Mercedes, Porsche, et une vallée tellement embouteillée que les collines servent surtout à être regardées.§!"
 bern_desc: "----\n§9Capitale suisse : des ours, des arcades, et une rivière qui boucle comme un point d'interrogation.§!"
 zurich_desc: "----\n§9Banque, chocolat, et un lac si propre qu'on y voit ses regrets se refléter.§!"
 vienna_desc: "----\n§9Cafés, opéra, et une municipalité qui loue du bonheur depuis 1919.§!"
 amsterdam_desc: "----\n§9Ceinture de canaux, vélos, et un marché immobilier qui fait passer la tulipomanie pour de la prudence.§!"
 brussels_desc: "----\n§9Siège de l'UE, chocolat, et une bureaucratie qui a fait du compromis un art.§!"
 krakow_desc: "----\n§9Dragons du Wawel, une place grande comme un stade, et des bars étudiants qui ne ferment jamais.§!"
 bucharest_desc: "----\n§9Paris des Balkans avec un Parlement qui a mangé un quartier ; les start-up comblent les trous.§!"
 sofia_desc: "----\n§9Le mont Vitosha à la porte, des vestiges romains dans le métro, et une ville qui hausse les épaules en trois alphabets.§!"
 zagreb_desc: "----\n§9Places autrichiennes, culture du café balkanique, et un musée des relations brisées complet.§!"
 marseille_desc: "----\n§9Un port qui parle vite, mange de la bouillabaisse et ne fait confiance à personne qui se presse.§!"
 lyon_desc: "----\n§9L'estomac de la France : argent de la soie, bouchons, et une ville de deux fleuves qui a inventé sa propre lumière.§!"
 nice_desc: "----\n§9Promenade des Anglais, plages de galets, et une fiscalité qui garde la Côte d'Azur polie.§!"
 bordeaux_desc: "----\n§9Vin, façades au bord du fleuve, et un tramway si doux que les habitants ont presque cessé de râler.§!"
 nantes_desc: "----\n§9Des chantiers navals devenus machines à art : un éléphant mécanique géant marche sur les vieux docks.§!"
 toulouse_desc: "----\n§9Briques roses, ailes d'Airbus, et des étudiants qui disputent de tout sauf du rugby.§!"
 strasbourg_desc: "----\n§9Parlement européen, menus franco-allemands, et une cathédrale qui a porté la plus haute flèche du monde.§!"
 lisbon_desc: "----\n§9Sept collines, trams jaunes, et une tarte à la crème qui règle au moins deux de vos problèmes.§!"
 madrid_desc: "----\n§9Dîners tardifs, disputes plus anciennes, et un triangle de musées qui survit à tous les gouvernements.§!"
 barcelona_desc: "----\n§9Courbes de Gaudí, port actif, et un club de football qui se prend pour une nation.§!"
 athens_desc: "----\n§9Marbres antiques collés aux graffitis modernes ; le débat n'a jamais vraiment fini.§!"
 palermo_desc: "----\n§9Une ville de jardins, de marbre et de lumière, où les palais surgissent entre montagne et mer. Le code de la route est indicatif.§!"
 naples_desc: "----\n§9Le Vésuve à l'horizon, la pizza à la main, et du linge suspendu dans les ruelles comme des fanions de fête.§!"
 milan_desc: "----\n§9Semaines de la mode, finance, et une cathédrale qui ressemble à de la dentelle taillée dans le marbre.§!"
 venice_desc: "----\n§9Une ville qui a décidé de bâtir sur l'eau, puis a fait payer l'entrée à tout le monde.§!"
 istanbul_desc: "----\n§9Deux continents, un bouchon sur le pont, et des ferries qui transforment le trajet en croisière panoramique.§!"
 ankara_desc: "----\n§9Une capitale construite exprès : ministères, boulevards, et un château qui surveille tout.§!"
 izmir_desc: "----\n§9Brises égéennes, promenades du kordon, et une laïcité balnéaire obstinée.§!"
 bursa_desc: "----\n§9Les premières ottomanes : première capitale, première soie, et des marrons glacés qui passent l'hiver.§!"
 adana_desc: "----\n§9Coton, kebabs, et une chaleur qui fait fumer la rivière Seyhan.§!"
 tehran_desc: "----\n§9Le mont Damavand surveille la brume ; le métro est bondé et le débat est plus ancien que les embouteillages.§!"
 baghdad_desc: "----\n§9Le Tigre, les livres, et une ville qui a reconstruit ses bibliothèques plus de fois qu'il ne devrait être nécessaire.§!"
 damascus_desc: "----\n§9L'une des plus vieilles capitales du monde : une oasis, une grande mosquée, et une patience plus ancienne que la guerre.§!"
 aleppo_desc: "----\n§9Une citadelle, un souk, et une ville qui ne cesse de rouvrir ses portes.§!"
 jerusalem_desc: "----\n§9Quatre quartiers, trois religions, et une skyline très disputée.§!"
 riyadh_desc: "----\n§9Une capitale du désert passée en une génération de la ville de terre crue aux tours de verre.§!"
 abu_dhabi_desc: "----\n§9L'argent du pétrole transformé en musées, en mangroves et en une skyline qui n'a besoin d'aucune excuse.§!"
 dubai_desc: "----\n§9Une skyline bâtie sur l'ambition, la climatisation et le plus haut de tout au monde.§!"
 doha_desc: "----\n§9Un village de plongeurs de perles devenu capitale du gaz, qui a acheté une Coupe du monde pour le prouver.§!"
