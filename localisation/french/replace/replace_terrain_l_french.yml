 rio: "Rio de Janeiro"
 rio_desc: "----\n§9Rio de Janeiro est la deuxième plus grande ville du Brésil et la capitale de l'État du même nom. Réputée pour sa beauté naturelle époustouflante et sa culture vibrante, elle est la première destination pour le tourisme étranger au Brésil. Fondée en 1565, elle a été la capitale du Brésil jusqu'en 1960. La ville est célèbre pour des monuments comme le Christ Rédempteur au sommet de la montagne Corcovado, le Pain de Sucre et les plages de Copacabana et Ipanema. Le carnaval de Rio est l'un des plus grands festivals du monde, mettant en avant la musique samba et des défilés élaborés. Elle abrite également le stade Maracanã, l'un des plus grands et des plus historiques stades de football au monde.\n\nLa ville a accueilli les Jeux olympiques d'été de 2016 et est un site du patrimoine mondial de l'UNESCO pour son paysage urbain unique mêlant montagnes, mer et architecture. Malgré des défis comme les disparités socio-économiques, Rio reste un centre culturel et économique majeur en Amérique latine. Malgré son influence culturelle et économique, Rio fait face à des défis importants, notamment la pauvreté, la corruption et la criminalité violente, en particulier dans ses nombreuses favelas, qui impactent la vie quotidienne et le développement urbain.§!\n\n§GSamba De Janeiro !§!"

 brasilia: "Brasília"
 brasilia_desc: "----\n§9Brasília est la capitale du Brésil, établie en 1960 dans le cadre de l'initiative « Cinquante ans en cinq » du président Juscelino Kubitschek pour stimuler le développement de l'intérieur du pays. La ville a été conçue selon le « Plano Piloto » (plan pilote) par l'urbaniste Lúcio Costa et l'architecte Oscar Niemeyer, avec une disposition unique en forme d'avion.\n\nSon design est centré sur l'Axe monumental, qui abrite des bâtiments gouvernementaux clés comme le Palácio do Planalto, le Congrès national et la Cour fédérale suprême, tous disposés autour de la Praça dos Três Poderes. Des monuments emblématiques comme la cathédrale de Brasília et le Palácio da Alvorada contribuent à son statut de site du patrimoine mondial de l'UNESCO depuis 1987. Malgré son architecture innovante, Brasília fait face à des défis inhérents à sa disposition planifiée et à son étalement urbain, mais reste un symbole du modernisme brésilien et du pouvoir politique.§!"

 sao_paulo: "São Paulo"
 sao_paulo_desc: "----\n§9São Paulo est la plus grande ville du Brésil et la capitale de l'État du même nom. Servant de centre financier, culturel et industriel majeur en Amérique latine, c'est la plus grande ville des hémisphères occidental et méridional, ce qui lui vaut le surnom de Selva de Pedra (« jungle de béton »). Fondée en 1554 par des missionnaires jésuites, elle a acquis une importance pendant le boom du café au 19e siècle et est devenue plus tard un centre d'industrialisation.\n\nLa ville est connue pour sa population diversifiée, incluant d'importantes communautés de diasporas italienne, japonaise et arabe, contribuant à son riche héritage culturel. São Paulo accueille des événements majeurs comme la Biennale d'art de São Paulo et la São Paulo Fashion Week, et abrite des monuments comme le Musée d'art de São Paulo (MASP) et le parc Ibirapuera. Malgré cette prouesse économique, la ville fait face à des défis comme la criminalité, la pollution, les inégalités sociales et de graves embouteillages.§!"

