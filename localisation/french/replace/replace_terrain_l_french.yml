#Asia-Pacific
 toyko: "Tokyo"
 toyko_desc: "----\n§9La métropole de Tokyo est la capitale tentaculaire du Japon. Abritant près de la moitié de la population totale du pays, ainsi que le gouvernement civil et la Maison impériale du Japon, Tokyo exerce une influence culturelle, économique et politique considérable sur l'ensemble du pays.\n\nSur le plan culturel, Tokyo est riche en temples historiques, centres commerciaux animés et monuments emblématiques comme le bâtiment de la Diète nationale, le carrefour de Shibuya, la Tokyo Skytree et la tour de Tokyo. C'est un leader mondial en technologie, finance et mode, tout en étant réputé pour sa sécurité et son système de transport public efficace, considéré par beaucoup comme une référence mondiale.§!\n\n§pJuste parce que Okawa existe, j'aime Tokyo, juste parce que Tokyo existe, j'aime la vie.§!"

 osaka: "Osaka"
 osaka_desc: "----\n§9Osaka, la capitale de la préfecture d'Osaka et la troisième plus grande ville du Japon, est un centre économique et culturel majeur dans la région du Kansai à Honshu. Historiquement un port commercial clé depuis la période Kofun, Osaka est devenue la capitale commerciale du Japon pendant la période Edo et s'est rapidement industrialisée après la restauration Meiji.\n\nAujourd'hui, elle reste un centre financier vital, abritant la Bourse d'Osaka, ainsi que de nombreuses grandes entreprises et universités prestigieuses, constituant un centre clé pour la recherche et le développement internationaux. La ville est connue pour sa vie de rue animée, sa scène culinaire et des monuments comme le château d'Osaka, Dōtonbori, Tsūtenkaku et Shitennō-ji, ainsi que des attractions touristiques comme Universal Studios Japan.§!\n\n§pOh mon Dieu !§!"

 nagoya: "Nagoya"
 nagoya_desc: "----\n§9Nagoya, la capitale de la préfecture d'Aichi, est la quatrième ville la plus peuplée du Japon et un centre industriel et culturel majeur dans la région de Chūbu. Fondée par Tokugawa Ieyasu en 1610 avec la construction du château de Nagoya, elle est rapidement devenue la capitale de la province d'Owari et a prospéré à l'ère Meiji.\n\nConnue pour son secteur manufacturier puissant, Nagoya abrite des industries clés, en particulier dans les secteurs automobile, aéronautique et de la construction navale, avec des entreprises majeures comme Brother Industries, Ibanez, Lexus et Toyota Tsusho ayant leur siège là-bas. Elle est bien connectée à Tokyo, Kyoto et Osaka via le Tokaido Shinkansen. Les monuments notables incluent le sanctuaire Atsuta, le château de Nagoya, le zoo de Higashiyama et la tour de télévision de Nagoya.§!"

 kyoto: "Kyoto"
 kyoto_desc: "----\n§9Kyoto, ancienne capitale impériale du Japon, est la neuvième ville la plus peuplée du pays et un centre culturel majeur situé dans la région du Kansai à Honshu. Fondée comme Heian-kyō en 794, elle a été le centre politique et culturel du Japon pendant la période Heian (794-1185) et est restée la capitale impériale jusqu'en 1868.\n\nRéputée pour son patrimoine bien préservé et épargnée par une grande partie de la destruction de la Seconde Guerre mondiale, Kyoto abrite plus de 2 000 sites religieux, dont des temples emblématiques comme Kiyomizu-dera et Kinkaku-ji. La ville est célèbre pour ses arts traditionnels, ses cérémonies du thé et ses performances de geishas dans le quartier de Gion. Son économie mêle des industries traditionnelles comme le tissage de kimonos avec des entreprises technologiques modernes telles que Nintendo, qui a son siège dans la ville. Kyoto accueille également de nombreux sites classés au patrimoine mondial de l'UNESCO et des festivals renommés comme le Gion Matsuri, restant une destination clé pour la culture et l'éducation.§!\n\n§pLieu, Japon§!"

 yokohama: "Yokohama"
 yokohama_desc: "----\n§9Yokohama est la deuxième plus grande ville du Japon et la capitale de la préfecture de Kanagawa. Située le long de la baie de Tokyo dans la région de Kantō, elle est passée d'un petit village de pêcheurs à une grande ville portuaire après son ouverture au commerce international en 1859, marquant son rôle de passerelle pour l'influence occidentale pendant l'ère Meiji. Son port, l'un des plus grands et des plus actifs du Japon, a joué un rôle crucial dans son développement rapide en tant que centre de commerce et d'industrie.\n\nAujourd'hui, Yokohama est un centre industriel et économique prospère, abritant des entreprises majeures comme Nissan et Isuzu. Son quartier emblématique de Minato Mirai 21 comprend des monuments comme la Yokohama Landmark Tower et Cosmo Clock 21. Les points forts culturels incluent le Chinatown de Yokohama, le plus grand du Japon, et le pittoresque parc Yamashita.§!\n\n§pPrends le combat, brûlant comme l'enfer ! De ceux que nous célébrons, bienvenue Ichiban ! Va de l'avant et mène une vie merveilleuse !§!"

 beijing: "Pékin"
 beijing_desc: "----\n§9La rue commerciale animée et colorée de Wangfujing n'est qu'à un mur de l'atmosphère sereine et chargée d'histoire des anciens hutongs. Les jardins opulents des anciens empereurs surplombent les bâtiments gouvernementaux gris ornés d'étoiles rouges et de symboles de la faucille et du marteau. C'est uniquement à Pékin, la capitale de la République populaire de Chine, que l'on peut trouver des scènes aussi étranges mais harmonieuses. Depuis que la dynastie Yuan en a fait sa capitale en 1271, Pékin a traversé d'innombrables tempêtes et vu de nombreux dirigeants aller et venir. Cette histoire unique a façonné l'axe nord-sud de la ville et sa disposition en grille, tout en cultivant un esprit urbain distinct et une culture civique chère aux Pékinois.\nAux yeux de leurs compatriotes, les Pékinois jouent souvent des rôles complexes, mêlant enthousiasme et arrogance, ouverture et rigidité. Bien qu'ils soient les plus proches du cœur du pouvoir national, ils nourrissent un mépris tacite pour l'autorité : « À Pékin, une seule brique jetée pourrait toucher une douzaine de chefs de bureau. » En tant que première ligne de l'ouverture et des échanges de la République avec le monde extérieur, ils s'accrochent également à des traditions amusantes et pittoresques, de leur accent distinctif à leur goût pour la boisson fermentée « douzhi ». Cela reflète la Chine elle-même : une nation ancienne mais jeune.\nAujourd'hui, avec Pékin comme capitale, la République populaire a plus de cinquante ans d'histoire. Cette ville ancienne a été témoin à la fois de la prospérité pacifique et des temps tumultueux des dynasties passées, ainsi que de l'ascension, de la chute et de la résurgence de la nation. En regardant vers l'avenir, où les dirigeants actuels de Pékin mèneront-ils cette ville ? Peut-être seule l'histoire pourra fournir la réponse.§!"

 tianjin: "Tianjin"
 tianjin_desc: "----\n§9Tianjin, signifiant « gué de l'empereur » (littéralement « le gué du fils du ciel »), est inextricablement liée au destin de la capitale de la Chine et de ses dirigeants depuis sa création. Au cours des deux derniers siècles, cette ville a enduré l'humiliation de la Chine sous une gouvernance incompétente, a souffert sous la tyrannie des puissances coloniales arrogantes et a vu d'innombrables martyrs sacrifier leurs vies. Elle a finalement accueilli le lever du soleil après avoir enduré une obscurité prolongée. Aujourd'hui, Tianjin se dresse comme la plus grande ville industrielle du nord de la Chine, servant à la fois de porte maritime cruciale pour Pékin et de cœur du cercle économique de la baie de Bohai. Ce port prospère perpétue sa tradition séculaire en tant que centre animé pour le commerce national et international, où les marchands convergent comme ils le faisaient il y a des centaines d'années.§!"

 chengdu: "Chengdu"
 chengdu_desc: "----\n§9Chengdu, souvent appelée la « terre d'abondance », est nourrie par le système d'irrigation de Dujiangyan depuis plus de 2 300 ans. La ville porte non seulement le poids d'une civilisation ancienne, mais se targue également d'une culture urbaine animée qui captive à la fois les habitants et les visiteurs. De la beauté sereine du mont Qingcheng à l'histoire de la loyauté honorée au sanctuaire Wuhou, Chengdu offre un mélange fascinant d'ancien et de nouveau. Ses salons de thé en bord de rue, ses lignes de production d'avions de chasse de classe mondiale, les pandas géants de la base de reproduction et la place Tianfu animée au centre-ville mettent tous en valeur sa diversité.\nCe qui distingue vraiment Chengdu, cependant, est son rythme de vie détendu, en contraste frappant avec le rythme effréné et axé sur l'économie des autres grandes villes chinoises. Cet équilibre entre tradition et modernité confère à Chengdu son charme unique, montrant comment la vague de modernisation a façonné cette ville dynamique du sud-ouest de la Chine.§!"

 chongqing: "Chongqing"
 chongqing_desc: "----\n§9Peu de villes sont aussi étroitement liées à leurs rivières, géographiquement et culturellement, que Chongqing. Les fleuves Yangtsé et Jialing convergent ici, et au cours de trois millénaires, cette « ville de montagne » a transformé son terrain accidenté en une métropole magique d'allure cyberpunk. Son paysage nocturne époustouflant témoigne d'une ère dorée, tandis que les rivières de la ville ont donné naissance à une culture fluviale unique. Les traditions des quais, la confrérie « Gelaohui » et les gangs urbains autrefois dominants contribuent tous à l'aura brute et mystérieuse de Chongqing.\nD'une capitale en temps de guerre préservant l'esprit de la Chine à une municipalité accueillant les migrants du projet des « Trois Gorges », Chongqing s'est toujours adaptée au changement. Aujourd'hui, en tant qu'acteur clé de l'industrie des mégadonnées et moteur économique du bassin du Sichuan, elle continue d'évoluer. Tout comme son plat emblématique, le hotpot, la ville embrasse la diversité, avec des gens de tous horizons contribuant à son énergie et à sa vitalité uniques.§!"

