 moscow: "Moscou"
 moscow_desc: "----\n§9Moscou, la capitale de la Russie, est une mégapole tentaculaire qui incarne la riche histoire et l'importance culturelle de la nation. Souvent appelée la « Troisième Rome », elle sert de centre névralgique pour la vie politique, économique et culturelle du pays. Avec son immense étendue, Moscou couvre plus de 2 500 kilomètres carrés, ce qui en fait l'une des plus grandes villes du monde.\n\nLa ville se caractérise par son mélange frappant d'architecture historique et d'infrastructures modernes. Des monuments emblématiques tels que le Kremlin, la Place Rouge et la cathédrale Saint-Basile se dressent aux côtés de gratte-ciel contemporains, témoignant de l'évolution de Moscou à travers les âges. En tant que mégapole, c'est un centre d'activité bouillonnant, avec une population diversifiée qui contribue à son atmosphère vibrante.§!"

 petersburg: "Saint-Pétersbourg"
 petersburg_desc: "----\n§9Saint-Pétersbourg, souvent surnommée la « capitale culturelle » de la Russie, est une ville imprégnée d'histoire et d'héritage artistique. Fondée par Pierre le Grand en 1703, elle incarne sa vision d'une ville moderne de style européen qui servirait de passerelle vers l'Occident. En tant que « ville de Pierre le Grand », Saint-Pétersbourg présente de grands palais, des canaux complexes et une architecture époustouflante qui reflètent les ambitions de son fondateur.\n\nLa ville est renommée pour sa scène culturelle riche, abritant des institutions de classe mondiale comme le musée de l'Ermitage, le théâtre Mariinsky et de nombreuses galeries et théâtres. Son centre historique, classé au patrimoine mondial de l'UNESCO, présente des monuments à couper le souffle comme l'église du Sauveur sur le Sang Versé et le Palais d'Hiver.§!"

