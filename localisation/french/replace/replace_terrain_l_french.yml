 shanghai_desc: "----\n§9Quelle était votre mission à Shanghai ?§!"

 shenzhen: "Shenzhen"
 shenzhen_desc: "----\n§9« Rome ne s'est pas faite en un jour », pourtant il a fallu plus de deux mille ans pour atteindre sa gloire actuelle. En revanche, Shenzhen a accompli quelque chose de remarquable : en seulement quarante ans, elle est passée d'un petit village de pêcheurs sur la rive ouest de l'estuaire de la rivière des Perles à une métropole animée avec une population cinq fois supérieure à celle de Rome, et bien plus développée. Il y a plus de quarante ans, les habitants naviguaient dans les roseaux avec de simples bateaux de pêche. Aujourd'hui, Shenzhen est devenue l'une des plus grandes villes du sud de la Chine - et même du monde - par son échelle économique. Elle est devenue un symbole de l'ascension de la Chine. Sans la politique de réforme et d'ouverture, cette terre serait peut-être restée en sommeil. Ainsi, Shenzhen incarne le succès de la réforme et de l'ouverture de la Chine et se dresse comme le joyau le plus brillant du delta de la rivière des Perles.§!"

 guangzhou: "Guangzhou"
 guangzhou_desc: "----\n§9Il y a plus de trois cents ans, grâce aux décrets impériaux et à sa position géographique unique, Guangzhou est devenue la première ville de Chine à s'engager dans le commerce international, s'établissant comme le seul centre commercial du pays à l'époque. Cependant, cette richesse a également fait de Guangzhou une cible, et elle est devenue un prix pour les puissances étrangères. Après avoir enduré de nombreuses épreuves, cette ville a émergé encore plus brillante. Bien que le développement de Guangzhou ait été dépassé par celui de Shenzhen après la réforme et l'ouverture, elle reste le centre incontestable de la zone économique du delta de la rivière des Perles. Aujourd'hui, Guangzhou est toujours la capitale de la province du Guangdong, un centre économique important dans le sud de la Chine et l'un des plus grands centres de commerce international du pays.§!"

 wuhan: "Wuhan"
 wuhan_desc: "----\n§9<Une analyse économique de l'impact du comportement de fertilité sur la violence domestique en Chine et en Inde>\n« Après la fondation de la République populaire de Chine, la population totale du pays est passée de 542 millions avant 1949 à 830 millions en 1970. »\n« Avec l'introduction de la loi sur le divorce en 2001, les données d'enquête de 2010 ont montré que la proportion de femmes dans notre pays souffrant de violence domestique est tombée à 8,8 %. »\n- Yang Jingyuan§!"

 yangzhou: "Yangzhou"
 yangzhou_desc: "----\n§9« Transformer Yangzhou en une ville célèbre où la culture ancienne et la civilisation moderne se complètent. »\n- Jiang Zemin§!"

 hongkong: "Hong Kong"
 hongkong_desc: "----\n§9Vous préférez les films de Wong Kar-wai ou de Chow Sing-chi ?§!"

 macau: "Macao"
 macau_desc: "----\n§9Le Las Vegas de l'Est§!"

 changchun: "Changchun"
 changchun_desc: "----\n§9Surnommée la « perle au-delà de la Grande Muraille », Changchun est une chronique vivante de la frontière nord de la Chine. Ses origines en tant que bastion militaire remontent aux dynasties Liao et Jin, tandis que les vers poignants du poète Qing Nalan Xingde - « Les vents d'automne pleurent les éventails peints à la frontière, le coucher du soleil dore les bannières sur les anciens murs » - immortalisent sa grandeur intemporelle. L'histoire moderne complexe de la ville est gravée dans des monuments comme le palais mandchou fantoche et le complexe des huit ministères, vestiges de son rôle de pseudo-capitale en temps de guerre. Ressuscitée comme le berceau de l'industrie automobile chinoise avec la fondation de FAW, Changchun mène aujourd'hui la révolution de la mobilité verte du pays grâce à des technologies de pointe en matière de véhicules électriques et intelligents. Ancrée par des institutions académiques de premier plan comme l'Université de Jilin et le légendaire Changchun Film Studio (le « berceau du nouveau cinéma chinois »), la ville harmonise la profondeur savante avec la vigueur industrielle, incarnant l'ode du poète Ai Qing : « Mes yeux s'emplissent de larmes, car mon amour pour cette terre coule profondément dans mon âme. »§!"

 dalian: "Dalian"
 dalian_desc: "----\n§9Là où les flèches russes rencontrent les jardins japonais sous un dais de gratte-ciel, Dalian se déploie comme un sonnet maritime. Son âme moderne a pris forme à travers les vagues coloniales du 19e siècle, mais ses origines de la dynastie Han résonnent dans les monolithes sculptés par le vent de Jinshitan et le drame des falaises de Tiger Beach. La vaste place Xinghai reflète son ambition en tant que pivot de la Ceinture et la Route, tandis que les rues estivales s'animent avec le pouls de la Fashion Week et l'écume dorée des festivals de bière. Désormais titan du transport maritime en Asie du Nord-Est, Dalian exploite les richesses des mers profondes et la fabrication intelligente pour relier les continents. Fidèle à son nom - « Da » (grand) dans sa vision, « Lian » (connecté) dans sa portée - ce joyau côtier brille à la fois comme une couronne régionale et une scène mondiale, où la montagne rencontre la mer et l'histoire danse avec demain.§!"

 shenyang: "Shenyang"
 shenyang_desc: "----\n§9Shenyang est devenue la capitale du régime Jin postérieur en 1625, jetant les bases de l'ascension de la dynastie Qing au pouvoir sur la rive nord de la rivière Hun. À l'intérieur des murs cramoisis du palais impérial de Shenyang, la salle Dazheng octogonale à double avant-toit se dresse toujours comme il y a des siècles. Au fil des années, au début du 20e siècle, la ville a vu l'établissement de chemins de fer russes à large écartement et la construction du chemin de fer de Mandchourie du Sud par les Japonais. À ce jour, la route Zhongshan conserve son apparence hybride, avec des châssis de fenêtres gothiques et des décorations florales. Les grues à portique rouillées et les ateliers de fonderie du district de Tiexi capturent la mémoire industrielle des débuts de l'industrie lourde dans la République populaire de Chine, tandis que les lignes de production d'avions de chasse de la Shenyang Aircraft Corporation continuent d'incarner l'esprit de défense nationale du mouvement de la Troisième Ligne.\nUne ville qui entrelace les changements dynastiques, les empreintes coloniales et l'essor de l'industrialisation, Shenyang cherche constamment son identité contemporaine au milieu des couches de sa riche histoire.§!"

 taibei: "Taipei"
 taibei_desc: "----\n§9Taipei, la capitale de Taïwan et abritant plus de 7 millions de personnes, est surtout connue pour des zones comme son quartier central des affaires, le district de planification de Xinyi, le vibrant et animé Ximending, le centre de transport du district de Zhongzheng et le parc municipal et les universités prestigieuses du district de Daan. Icône du miracle économique de Taïwan et de son développement rapide depuis les années 1960, Taipei est passée d'une ville plate et primitive à une métropole animée. Elle abrite Taipei 101, un gratte-ciel qui fut autrefois le plus haut bâtiment du monde.\nMalgré la déconstruction des anciens murs de la dynastie Qing, Taipei, comme beaucoup d'autres grandes villes, est considérée comme une fortification défensive en elle-même contre les envahisseurs potentiels. Non seulement les défenseurs peuvent être positionnés à divers points, mais son vaste réseau de métro offre également une dimension supplémentaire de mobilité pour ceux au sol.§!"

 fuzhou: "Fuzhou"
 fuzhou_desc: "----\n§9Depuis les dynasties Tang et Song, Fuzhou a servi de nœud clé sur la Route de la Soie maritime, endurant un règne fragmenté par des gouverneurs militaires régionaux et les transitions successives des dynasties Song, Yuan, Ming et Qing, ainsi que le mouvement d'auto-renforcement de la fin des Qing. À la fin du 19e siècle, l'école de l'arsenal de Foochow a été fondée ici, stimulant le développement de la marine moderne et de l'industrie de la construction navale de la Chine, bien que brièvement interrompue par le coup d'État de Jia-shen. Au 20e siècle, les envois de fonds des émigrés d'outre-mer via la rivière Min ont favorisé une culture distinctive de « ville natale » et stimulé la croissance commerciale. Entrant dans le 21e siècle, l'infrastructure portuaire numérique de Fuzhou brille désormais 24 heures sur 24. Tirant parti de son statut de « zone pilote de l'économie numérique », la ville a élargi le commerce électronique transfrontalier et la logistique moderne, construit un port intelligent et des clusters industriels de nouvelles zones, et continue de fonctionner comme un centre régional vital.§!"

 xiamen: "Xiamen"
 xiamen_desc: "----\n§9Fondée sous la dynastie Ming, Xiamen a initialement servi à la fois de port commercial maritime et de rempart défensif contre les Qing. Positionnée à l'avant-garde des ères successives, elle a fonctionné comme le fer de lance du corridor Fuzhou-Xiamen et comme un microcosme de la civilisation chinoise d'outre-mer. La ville a été témoin des difficultés de l'ouverture au commerce extérieur à la fin des Qing, et plus tard de l'ascension rapide de sa zone économique spéciale. Depuis 1980, Xiamen a attiré des investissements étrangers substantiels, conduisant à une croissance rapide de ses installations portuaires et de ses industries de haute technologie. Ces dernières années, les deux moteurs de Jimei New Town et de la Torch High-Tech Zone ont favorisé un développement robuste dans les secteurs de l'énergie nouvelle, de la technologie marine et des industries culturelles et créatives. Les initiatives pilotes en finance transfrontalière et la zone expérimentale d'intégration des deux rives ont encore avancé l'intégration régionale.§!"

 gaoxiong: "Kaohsiung"
 gaoxiong_desc: "----\n§9La ville portuaire de Kaohsiung se dresse fièrement dans le sud de Taïwan, entre les limites de la rivière Gaoping et de la rivière Erren. Longtemps reconnue comme le cœur pétrochimique et industriel lourd de Taïwan, Kaohsiung abrite plusieurs parcs industriels massifs qui répondent aux besoins de la consommation intérieure ainsi qu'aux exportations internationales. En tant que locomotive de la première vague d'industrialisation de Taïwan, Kaohsiung a une histoire et une culture uniques. Les murs des fortifications Qing se dressent encore aujourd'hui, tandis que l'urbanisme du gouvernement colonial japonais a laissé une influence durable sur le développement ultérieur de la métropole. Cependant, après l'incident de Kaohsiung qui a inspiré beaucoup à participer aux affaires publiques, le surnom le plus connu de Kaohsiung est peut-être devenu pour beaucoup le « berceau de la démocratie taïwanaise ».\n\nD'innombrables touristes visitent cette ville chaque jour, certains pour ses monuments architecturaux, mais davantage pour entrevoir l'histoire séculaire du développement de Taïwan.§!"

 tainan: "Tainan"
 tainan_desc: "----\n§9Communément considérée comme la première ville de Taïwan, Tainan a connu plus de quatre cents ans de développement et fut la capitale administrative de Taïwan avant la domination coloniale japonaise. Bien que son importance politique et économique ait diminué au fil des années, son statut de cœur culturel a perduré. En tant qu'hôte de l'Université nationale Cheng Kung et des branches méridionales de la Bibliothèque centrale nationale, de l'Academia Sinica et de nombreuses autres institutions prestigieuses, Tainan reste fidèle à son nom de capitale académique du sud de Taïwan, des siècles après l'établissement du temple confucéen de Tainan. En dehors des institutions académiques, d'innombrables bâtiments historiques se dressent encore à Tainan, racontant leur passé. Cela inclut le fort Zeelandia, l'ancien centre administratif de la Compagnie néerlandaise des Indes orientales et du régime Ming méridional à Taïwan, le fort Provintia, une forteresse hollandaise historique, et la maison de commerce Tait & Co., qui accueillait autrefois des marchands britanniques. Aujourd'hui, Tainan est une ville où le passé rencontre l'avenir ; des forteresses coloniales au parc scientifique du sud de Taïwan, des activités folkloriques aux musées construits dans une architecture occidentale, Tainan s'efforce de se moderniser tout en préservant son identité distincte.§!"

