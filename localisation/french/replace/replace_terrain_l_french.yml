#####USA
 los_angeles: "Los Angeles"
 los_angeles_desc: "----\n§9La région métropolitaine de Los Angeles abrite plus de 4 millions de personnes, tout combat dans la ville représentera un défi majeur.§!"

 new_york: "New York"
 new_york_desc: "----\n§9Avec plus de huit millions d'habitants, la ville de New York est souvent décrite comme la capitale financière et culturelle du monde, abritant le siège de l'ONU et des centres financiers importants comme la Bourse de New York. Bien qu'elle ne soit pas la capitale des États-Unis, c'est la plus grande ville du pays, avec des centaines de gratte-ciel en acier, des ports immenses et des dizaines de kilomètres de banlieues tentaculaires et de villes satellites dans toutes les directions. Remplie de rats gigantesques.§!"

 san_francisco: "San Francisco"
 san_francisco_desc: "----\n§9San Francisco et la région voisine de la Silicon Valley sont connues comme la capitale technologique de l'Amérique depuis les années 1990, avec de nombreuses entreprises de « Big Tech » telles que Google, Facebook, Apple et Twitter installées dans la région. La ville est l'une des plus grandes de la côte ouest, avec plus de huit cent mille habitants, et elle est réputée pour sa diversité culturelle et sa politique progressiste.§!"

 miami: "Miami"
 miami_desc: "----\n§9Cocaïne.§!"

 twin_peaks: "Twin Peaks"
 twin_peaks_desc: "§RAu travers des ténèbres du passé futur, le magicien aspire à voir, l'un chante entre deux mondes, le feu marche avec moi.§!"

 seattle: "Seattle"
 seattle_desc: "----\n§9Seattle est la plus grande ville de l'État de Washington et du nord-ouest du Pacifique américain, avec près de sept cent cinquante mille habitants. La ville est un centre majeur de l'industrie technologique américaine, avec Amazon et Microsoft ayant leur siège dans la région, et elle est célèbre pour ses grands gratte-ciel comme la Space Needle et les chaînes de montagnes élevées à l'ouest et à l'est.§!"

 new_orleans: "La Nouvelle-Orléans"
 new_orleans_desc: "----\n§9La Nouvelle-Orléans est la plus grande ville de l'État américain de Louisiane, avec plus de trois cent quatre-vingt mille habitants dans la ville elle-même. C'est un centre économique et culturel majeur de la côte du Golfe, avec de grands ports et des festivals célèbres mêlant culture cajun et afro-américaine, comme le Mardi Gras. Bien que la ville ait été fortement touchée par des ouragans ces dernières décennies, elle reste une ville très importante dans le sud des États-Unis.§!"

 boston: "Boston"
 boston_desc: "----\n§9Boston est la capitale de l'État américain du Massachusetts et la plus grande ville de la Nouvelle-Angleterre, avec environ six cent soixante-dix mille habitants. Boston est considérée par beaucoup comme le cœur de la Révolution américaine, avec la fondation des Fils de la Liberté dans la ville et l'événement du Boston Tea Party ayant eu lieu dans ses limites. Aujourd'hui, c'est un centre majeur pour les affaires, la finance et la culture dans la région plus large de la Nouvelle-Angleterre et du nord-est.§!"

 washingtondc: "Washington, D.C."
 washingtondc_desc: "----\n§9Avec environ six cent quatre-vingt-dix mille habitants, le District de Columbia, la capitale de l'Amérique, est une région administrative distincte, ne faisant partie d'aucun État américain. La ville abrite le Congrès américain, la Cour suprême et la Maison Blanche, où réside le président des États-Unis, ainsi que des monuments comme le National Mall et le Washington Monument. C'est un symbole durable des États-Unis d'Amérique et de son gouvernement, qui n'a pas été saisi ni terni par des ennemis depuis la guerre de 1812 avec l'Empire britannique.§!"

 chicago: "Chicago"
 chicago_desc: "----\n§9Surnommée la ville des vents, Chicago est la troisième plus grande ville d'Amérique et la plus grande entre New York et Los Angeles, avec plus de deux millions sept cent mille habitants. La ville est un centre industriel majeur avec des dizaines de gratte-ciel, ainsi qu'un secteur financier de plus en plus important. Bien que la ville lutte contre un taux de criminalité élevé, elle reste une puissance économique majeure pour le Midwest et l'Amérique dans son ensemble.§!"

 philadelphia: "Philadelphie"
 philadelphia_desc: "----\n§9Ancienne capitale des États-Unis, Philadelphie compte plus d'un million et demi d'habitants. C'est la plus grande ville de l'État de Pennsylvanie, la sixième plus grande du pays, et un centre majeur pour les affaires et le commerce sur la côte est grâce à son importante infrastructure portuaire. La ville possède un grand centre urbain avec des dizaines de gratte-ciel et est connue pour sa rivalité avec New York.§!"

 houston: "Houston"
 houston_desc: "----\n§9Houston est la plus grande ville du Texas et la quatrième plus grande des États-Unis, avec près de deux millions et demi d'habitants. La ville abrite le port de Houston, le deuxième plus grand des États-Unis, et est un centre financier important ainsi qu'un pivot pour le vaste secteur pétrolier et énergétique du Texas. Bien qu'elle ne possède pas beaucoup de gratte-ciel, la ville est l'une des plus étendues des États-Unis en termes de superficie.§!"

 richmond: "Richmond"
 richmond_desc: "----\n§9Richmond est la capitale de l'État américain de Virginie et l'ancienne capitale de la Confédération qui s'est rebellée contre l'Union pendant la première guerre civile. Bien que la ville soit de taille moyenne avec environ deux cent mille habitants, c'est un centre économique important dans le sud supérieur, avec de nombreuses grandes entreprises et agences gouvernementales ayant leur siège dans la région. Bien qu'elle ait été un centre de rébellion il y a longtemps, aujourd'hui, la ville est fermement loyale au gouvernement fédéral.§!"

