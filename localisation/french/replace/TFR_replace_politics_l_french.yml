maintheme: "Electronica 302 - Schastlivaya Yunost"
AST_diplo_icon_tooltip_desc: "L’effondrement de l’hégémonie américaine a également touché l’Australie. Pour protéger sa propre sécurité, l’Australie, conjointement avec le Japon, a fondé l’§CPOrganisation du traité de défense du Pacifique§! (PDTO), dans l’espoir de rallier les pays de la région Asie-Pacifique face à la menace de Pékin. L’Australie servira de base arrière au PDTO, fournissant les ressources du continent australien aux États membres pour bâtir une puissante machine de guerre."

JAP_diplo_icon_tooltip_desc: "Après l’effondrement de l’hégémonie américaine, le Japon se retrouve confronté à une menace directe de son adversaire historique de l’autre côté de la mer. Pour acquérir la force suffisante afin de contrer le « dragon rouge », une organisation de sécurité et de défense collective semblable à l’OTAN est devenue inévitable. C’est pourquoi le Japon et l’Australie ont pris l’initiative de créer l’§CPOrganisation du traité de défense du Pacifique§!. Le Japon en est désormais un membre central et la première ligne de défense face au géant chinois."

PDTO_Observer_diplp_icon_tooltip_desc: "Ce pays s’aligne étroitement avec les membres du PDTO et a obtenu le statut d’observateur au sein de l’organisation. Bien qu’il n’ait pas encore rejoint l’§CPOrganisation du traité de défense du Pacifique§!, la communauté internationale considère généralement que son adhésion n’est plus qu’une question de temps."

PDTO_Supervise_diplp_icon_tooltip_desc: "Ce pays existe au sein de l’organisation en tant qu’État dépendant d’autres nations, ce qui signifie qu’il manque de pleine souveraineté et qu’il est soumis au contrôle de son suzerain. Face aux critiques internationales, son suzerain affirme qu’il s’agit d’une « supervision temporaire », mais divers indices suggèrent que le suzerain s’est livré à une série d’activités rusées et extorquées sur le territoire du pays."

PDTO_diplo_icon_tooltip_desc: "Ce pays est membre de l’§CPOrganisation du traité de défense du Pacifique§!. Il possède une souveraineté indépendante, et son adhésion au PDTO s’explique largement par des différends passés avec la Chine ainsi que par les promesses d’avantages de la part de Tokyo et de Canberra. Bien que les États membres indépendants soient censés être sur un pied d’égalité, les disparités de puissance nationale font que des conflits et des discriminations persistent encore."

RAJ_diplo_icon_tooltip_desc: "L’Inde cherche depuis 1962 à prendre sa revanche sur la Chine, et les tensions mondiales croissantes ont attisé ses ambitions. Après que le Japon et l’Australie ont pris l’initiative de créer l’§CPOrganisation du traité de défense du Pacifique§!, l’Inde a choisi de rejoindre ce camp opposé au géant chinois. Même si l’Inde méprise ces soi-disant alliés, elle a dû temporairement se soumettre à l’organisation pour contrer la pression de Pékin. Cependant, si le PDTO parvenait un jour à vaincre la Chine, §R l’Inde pourrait bien ne pas suivre la même voie qu’eux.§!"

  CHI_diplo_icon_tooltip_desc: "L'Initiative de défense de l'Asie de l'Est, communément appelée « EADI », est une organisation internationale dirigée par la §RRépublique populaire de Chine§!. Cette organisation est dédiée à garantir la paix et la stabilité en Asie et à protéger ses États membres contre l'agression des militaristes.\n\nEn tant que leader de cette organisation et initiateur de la sécurité collective en Asie, la Chine en est incontestablement le cœur. Elle utilisera ses propres armes pour se protéger elle-même et protéger ses alliés, tout en démontrant sur la scène mondiale son rôle de grande puissance capable de maintenir la paix."
  
  EADI_Observer_diplp_icon_tooltip_desc: "Ce pays est un État observateur de l'§RInitiative de défense de l'Asie de l'Est§! (EADI), terme généralement utilisé pour désigner les pays proches de Pékin mais qui n'ont pas encore formellement déclaré leur adhésion à l'EADI. Ce pays rejoindra formellement l'EADI après un certain processus, devenant un membre combattant aux côtés de Pékin."
  
  EADI_Supervise_diplp_icon_tooltip_desc: "En raison de l'incapacité du pays à assurer une gouvernance indépendante, certaines de ses prérogatives nationales sont temporairement transférées à l'EADI pour supervision jusqu'à ce qu'un nouveau gouvernement exerce un contrôle complet sur la base. C'est pourquoi le pays est qualifié d'État supervisé.\n\nBien que certains pays y voient une preuve concrète d'ingérence chinoise dans leurs affaires intérieures, en réalité, l'EADI mettra fin à son statut de supervision une fois que le pays aura achevé sa restructuration politique."
  
  EADI_diplo_icon_tooltip_desc: "En tant que membre formel de l'Accord de l'Initiative de défense de l'Asie de l'Est (EADI), ce pays peut clairement être considéré comme un État souverain par rapport à certaines nations politiquement indécises.\n\nCependant, en raison de la puissance excessive des pays centraux de l'EADI, même sans ingérence politique chinoise significative, certaines nations anti-chinoises le considèrent toujours comme un État vassal de la Chine."
  TFR_GLOBAL_ASSOCIATION_PEC_TT: "[THIS.GetNameWithFlag] est membre de la CEP"