chaoxian.2: "Le dirigeant nord-coréen Kim Jong Il décède !"
chaoxian.2.t: "Le dirigeant nord-coréen Kim Jong Il décède !"
chaoxian.2.d: "À 8h30 le 17 décembre 2011, Kim Jong Il, secrétaire général du Comité central du Parti du travail de Corée, est décédé dans un train suite à un surmenage lors d'un voyage d'inspection.\n\nSelon l'Agence centrale de presse nord-coréenne, la Corée du Nord a mis en place un comité funéraire national et a décidé de placer le corps de Kim Jong Il dans le palais commémoratif de Kumsusan, a fixé la période du 17 au 29 décembre comme période de deuil, acceptera les condoléances du 20 au 27 décembre, organisera une cérémonie d'adieu à Pyongyang le 28, et une réunion commémorative centrale le 29."
chaoxian.2.a: "Un moment de silence..."
chaoxian.3: "Félicitations à Kim Jong-un pour être devenu le premier secrétaire du Parti du travail de Corée"
chaoxian.3.t: "Hu Jintao envoie un message de félicitations à Kim Jong-un pour sa nomination en tant que premier secrétaire du Parti du travail de Corée"
chaoxian.3.d: "Pyongyang\nCamarade Kim Jong-un, Premier secrétaire du Parti du travail de Corée :\n\nJe suis heureux d'apprendre que la Conférence des représentants du Parti du travail de Corée a nommé le Camarade Kim Jong-un au poste de Premier secrétaire du Parti du travail de Corée. Au nom du Comité central du Parti communiste chinois et en mon nom propre, je tiens à vous adresser mes chaleureuses félicitations ainsi qu'au Comité central du Parti du travail de Corée.\nNous sommes heureux de constater que le peuple coréen a hérité de l'héritage du Camarade Kim Jong-il, étroitement uni autour du Parti du travail de Corée, et a travaillé dur pour construire un puissant pays socialiste sous la direction du Camarade Kim Jong-un.\nLa Chine et la Corée du Nord sont des voisins amis reliés par les montagnes et les rivières. Consolidée et développée constamment les relations d'amitié et de coopération traditionnelles entre la Chine et la Corée du Nord, telle est la politique inébranlable du Parti et du gouvernement chinois. Nous sommes prêts à travailler main dans la main avec nos camarades coréens pour continuer à approfondir l'amitié traditionnelle entre la Chine et la Corée du Nord, à élargir la coopération pratique dans divers domaines, à promouvoir conjointement une paix et une stabilité durables dans la péninsule coréenne et en Asie du Nord-Est, et à consolider, construire et développer les relations Chine-Corée du Nord qui ont été créées et nourries par l'ancienne génération de dirigeants des deux partis et pays.\nJe souhaite sincèrement au Camarade Premier secrétaire et au Parti du travail de Corée de continuer à réaliser de nouvelles et plus grandes réalisations en dirigeant le peuple coréen vers la construction d'un pays puissant.\n\nSecrétaire général du Comité central du Parti communiste chinois\nHu Jintao\n\nPékin, 11 avril 2012"
chaoxian.3.a: "L'histoire d'un autre jeune homme commence"

