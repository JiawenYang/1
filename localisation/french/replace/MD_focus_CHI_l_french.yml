#Nations Unies#
chi_stop_war.20: "Cessez-le-feu"
chi_stop_war.20.t: "Cessez-le-feu"
chi_stop_war.20.d: "Nous avons accepté la demande de cessez-le-feu du Conseil de sécurité et devons maintenant proposer un cessez-le-feu aux pays en guerre."
chi_stop_war.20.a: "Rien ne peut être fait"
chi_stop_war.10: "[From.GetName] souhaite un cessez-le-feu"
chi_stop_war.10.t: "[From.GetName] souhaite un cessez-le-feu"
chi_stop_war.10.d: "Le [From.GetName] souhaite appeler à un cessez-le-feu. Cette guerre a coûté de nombreuses vies, et il est temps pour les deux parties de prendre un moment pour mettre fin aux combats. Devrions-nous accepter un armistice ? Cela nous donnerait une marge de manœuvre bien nécessaire."
chi_stop_war.10.a: "Accepter, leur donner notre réponse"
chi_stop_war.1: "Le [From.GetName] exige un cessez-le-feu !"
chi_stop_war.1.t: "Le [From.GetName] exige un cessez-le-feu !"
chi_stop_war.1.d: "Appel de New York. [From.GetName], l'un des membres permanents du Conseil de sécurité des Nations Unies, exige que nous arrêtions immédiatement l'escalade de la guerre."
chi_stop_war.1.a: "Nous ne pouvons pas nous permettre de les offenser..."
chi_stop_war.1.b: "Qui s'en soucie ?"
chi_stop_war.2: "[From.GetName] souhaite un cessez-le-feu"
chi_stop_war.2.t: "[From.GetName] souhaite un cessez-le-feu"
chi_stop_war.2.d: "Le [From.GetName] souhaite appeler à un cessez-le-feu. Cette guerre a coûté de nombreuses vies, et il est temps pour les deux parties de prendre un moment pour mettre fin aux combats. Devrions-nous accepter un armistice ? Cela nous donnerait une marge de manœuvre bien nécessaire."
chi_stop_war.2.a: "C'est la demande des cinq membres permanents..."
chi_stop_war.31: "[From.GetName] accepte une trêve !"
chi_stop_war.31.t: "[From.GetName] accepte une trêve !"
chi_stop_war.31.d: "Le gouvernement [From.GetName] a accepté la proposition du Conseil de sécurité de l'Onu et rédige les documents de cessez-le-feu avec les pays belligérants."
chi_stop_war.31.a: "Très bien"
chi_stop_war.3: "[From.GetName] refuse le cessez-le-feu !"
chi_stop_war.3.t: "[From.GetName] refuse le cessez-le-feu !"
chi_stop_war.3.d: "Le gouvernement [From.GetName] a rejeté une proposition du Conseil de sécurité de l'Onu et continue de déverser du feu sur les lignes de front."
chi_stop_war.3.a: "Sanctionnez-les !"
chi_stop_war.3.b: "Laissez-les faire comme bon leur semble"
chi_stop_war.4: "Nous sommes sous sanctions internationales !"
chi_stop_war.4.t: "Nous sommes sous sanctions internationales !"
chi_stop_war.4.d: "Après avoir rejeté l'ordre de cessez-le-feu proposé par [From.GetName], [From.GetName] nous a imposé des sanctions internationales !"
chi_stop_war.4.a: "C'est de l'impérialisme !"
chi_stop_war.5: "[From.GetName] lance un avertissement sévère"
chi_stop_war.5.t: "[From.GetName] lance un avertissement sévère"
chi_stop_war.5.d: "Nous avons reçu un appel de Pékin, exigeant que nous arrêtions immédiatement la guerre, sinon [From.GetName] utilisera la force pour protéger la paix mondiale."
chi_stop_war.5.a: "On ne peut pas se permettre d'offenser..."
chi_stop_war.5.b: "Qui a peur ?"
chi_stop_war.6: "[From.GetName] accepte le cessez-le-feu"
chi_stop_war.6.t: "[From.GetName] accepte le cessez-le-feu"
chi_stop_war.6.d: "Le diplomate de [From.GetName] appelle, acceptant un cessez-le-feu immédiat."
chi_stop_war.6.a: "Très bien"
chi_stop_war.7: "[From.GetName] refuse le cessez-le-feu"
chi_stop_war.7.t: "[From.GetName] refuse de mettre fin à la guerre"
chi_stop_war.7.d: "[From.GetName] a rejeté nos avertissements militaires et est déterminé à poursuivre la guerre."
chi_stop_war.7.a: "Venez à la cour de l'Empereur et rapportez votre travail. Si vous ne le faites pas, les six armées seront déplacées !"
chi_stop_war.7.b: "Nous devons encore attendre"
chi_stop_war.8: "[From.GetName] lance un ultimatum"
chi_stop_war.8.t: "[From.GetName] lance un ultimatum"
chi_stop_war.8.d: "Le président de la Commission militaire de [From.GetName] a lancé un ultimatum, exigeant que nous cessions le feu immédiatement sous peine de nous déclarer la guerre."
chi_stop_war.8.a: "Allez !"
chi_stop_war.8.b: "Nous ne pouvons pas nous permettre de les offenser..."
chi_stop_war.9: "[From.GetName] refuse l'avertissement final"
chi_stop_war.9.t: "[From.GetName] refuse l'avertissement final"
chi_stop_war.9.d: "[From.GetName] a appelé pour exprimer ses regrets concernant nos menaces militaires et pour dire qu'ils ne se soumettraient jamais à nous."
chi_stop_war.9.a: "Que la guerre commence !"
chi_stop_war.9.b: "Nous ne pouvons pas nous permettre de les offenser..."


##############
chi_stop_war.100.t: "Le [From.GetName] exige un cessez-le-feu !"
chi_stop_war.100.d: "[From.GetFlag][From.GetName], membre permanent du Conseil de sécurité des Nations Unies, exige que nous arrêtions immédiatement la guerre en cours !"
chi_stop_war.100.a: "Nous n'avons pas le choix..."
chi_stop_war.100.b: "Qu'importe ce qu'ils pensent ?"
chi_stop_war.100.b.tooltip: "§YCette option coûtera §Rde plus en plus cher§! et deviendra §Rinvisible§! si nous ne pouvons plus nous le permettre."
chi_stop_war.tooltip: "§YUne série d'événements débutera pour promouvoir la paix, ce qui devrait consommer une §Rgrande quantité§! de pouvoir politique !§!"

chi_stop_war.110.t: "Le [From.GetName] refuse d'arrêter la guerre !"
chi_stop_war.110.d: "[From.GetFlag] [From.GetName] a rejeté la proposition du Conseil de sécurité de l'ONU et continue de déverser un déluge de feu sur les lignes de front."
chi_stop_war.110.a: "Maintenez la pression sur eux !"
chi_stop_war.110.b: "Laissez-les faire..."
chi_stop_war.100.c: "Déclarez-leur la guerre !"

chi_stop_war.120.t: "[From.GetName] accepte une trêve !"
chi_stop_war.120.d: "[From.GetFlag] [From.GetName] a accepté la proposition du Conseil de sécurité de l'ONU et rédige un document de cessez-le-feu avec les belligérants. Grâce à cet exploit de maintien de la paix réussi, nous avons gagné beaucoup de soutien."
chi_stop_war.120.a: "Très bien."

chi_stop_war.130.t: "[From.GetName] nous a déclaré la guerre !"
chi_stop_war.130.d: "[From.GetFlag] [From.GetName] est mécontent de nos actions et nous a déclaré la guerre, tentant d'utiliser la force pour nous contraindre à capituler !"
chi_stop_war.130.a: "Ces fous !"

# Arbre des politiques sociales
CHI_Millennium_Society: "Société du millénaire"
CHI_Millennium_Society_desc: "Après être entré dans le XXIe siècle, notre société est devenue plus colorée et dynamique, et de nombreuses nouveautés ont émergé."
CHI_human_rights: "Droits humains"
CHI_human_rights_desc: "Le Parti communiste chinois place le peuple au-dessus de tout, combinant les principes universels des droits humains aux réalités chinoises. Il considère le droit à la survie et au développement comme le droit humain fondamental et prioritaire, estimant que le bonheur du peuple est le plus grand droit humain. Il promeut le développement global des individus, renforce leur sentiment de gain, de bonheur et de sécurité, et a ouvert avec succès une voie de développement des droits humains aux caractéristiques chinoises."
CHI_Feminism: "Droits des femmes"
CHI_Feminism_desc: "Les femmes représentent la moitié de l'humanité. La manière dont les droits des femmes sont traités est une mesure constante du développement d'une société."
CHI_Supporting_feminism: "Soutien au féminisme"
CHI_Supporting_feminism_desc: "Toutes les théories féministes reposent sur un postulat de base : les femmes sont opprimées et discriminées partout dans le monde. Il est inconcevable qu'au XXIe siècle, les femmes de notre pays soient encore opprimées de toutes parts. Nous devons corriger ces injustices et lutter pour davantage de droits pour les femmes, afin d'atteindre leur libération au sens fondamental."
CHI_Gender_equalitym: "Égalité des genres"
CHI_Gender_equalitym_desc: "Les théories féministes sont complexes, mais elles se résument en une phrase : parvenir à l'égalité des genres parmi tous les êtres humains. Dans les sociétés patriarcales et capitalistes, les prolétaires masculins et féminins sont également exploités par les intérêts établis. Nous voulons libérer non seulement les femmes, mais toutes les personnes opprimées."
CHI_Combating_feminism: "Lutte contre le féminisme"
CHI_Combating_feminism_desc: "Le féminisme est une arme idéologique venue de l'Occident après la réforme et l'ouverture, visant à créer des conflits internes dans notre pays et à dresser les hommes contre les femmes. Il est urgent d'éliminer ces rats d'égout de notre grande patrie."
CHI_Gender_struggle: "Lutte des genres"
CHI_Gender_struggle_desc: "Dans une société de classes, toutes les contradictions sont des contradictions de classe. L'oppression des femmes par les hommes depuis des millénaires est une manifestation de l'oppression de classe. Les hommes considèrent les femmes comme une classe opprimée et intensifient cette oppression. Nous devons envisager les questions de genre sous l'angle de la lutte des classes, en considérant les hommes comme des ennemis de classe. La révolution n'est pas un dîner mondain. Les querelles bruyantes ne résolvent pas les problèmes. Pour atteindre une libération complète, nous devons avoir un esprit de combat total."
CHI_A_louder_call: "Un appel plus fort"
CHI_A_louder_call_desc: "La question du genre ne peut être réduite à une simple question de classe. Nous devons exprimer nos voix de manière plus rationnelle et pragmatique. Le président Mao Zedong a dit que nous devrions réduire nos ennemis et augmenter nos amis. À la nouvelle ère, nous ne ferons aucun compromis face à l'oppression, mais nous ne transformerons pas non plus les non-ennemis en ennemis. Nous lançons un appel fort pour que toute la société entende la voix des femmes."
CHI_refuses_to_be_breeding_machines: "Refus d'être des machines à procréer"
CHI_refuses_to_be_breeding_machines_desc: "Les femmes ont la capacité de procréer, ce qui les a fait traiter comme des machines à procréer pendant des millénaires, devenant la propriété privée des hommes et leurs esclaves sexuelles. Comment cela peut-il être justifié ? Nous ne permettrons jamais aucune forme d'exploitation basée sur le genre. La procréation est la plus grande exploitation des femmes. Refusez dès maintenant de procréer et montrez à ces hommes qui domine le processus de reproduction."
CHI_Monopoly_of_reproductive_rights: "Monopole des droits reproductifs"
CHI_Monopoly_of_reproductive_rights_desc: "La différence fondamentale entre les femmes et les hommes est que les femmes peuvent tomber enceintes, ce qui leur impose un coût plus élevé lors de l'accouchement. Une grossesse de dix mois est une grande épreuve pour toute femme, mais les femmes ont assumé l'obligation de donner naissance sans obtenir les droits correspondants. Nous devons tirer parti des caractéristiques de genre innées des femmes, les transformer en privilèges reproductifs et permettre aux femmes de prendre le contrôle du processus d'accouchement."
CHI_Contact_foreign_feminist_organizations: "Contacter des organisations féministes étrangères"
CHI_Contact_foreign_feminist_organizations_desc: "Le mouvement féminateness en Occident a commencé très tôt, avec des réalisations théoriques et des résultats de lutte très riches. La première vague du mouvement féministe a eu lieu entre 1840 et 1925, alors que les femmes chinoises travaillaient encore comme esclaves pour leurs maîtres masculins ! Plutôt que de traverser la rivière en tâtonnant, il est préférable de se référer aux cas de succès existants. Nous devons établir des contacts avec des organisations féministes étrangères et apprendre de leur savoir théorique et de leur expérience de lutte."
CHI_Independence_and_autonomy: "Indépendance et autonomie"
CHI_Independence_and_autonomy_desc: "La cause de la libération des femmes ne peut dépendre de personne d'autre, nous devons la mener nous-mêmes. La faiblesse et le compromis sont des traits de la petite bourgeoisie. Qui sait si ces organisations féministes occidentales n'ont pas des intentions cachées ? Et si elles étaient manipulées par des gouvernements étrangers pour intervenir dans nos affaires internes ? La cause des droits des femmes n'est pas une trahison du pays, nous ne voulons pas être les chefs des traîtres - ou plutôt, des traîtresses."
CHI_Establishing_an_Independent_Bill_of_femininity_Rights: "Établissement d'une charte indépendante des droits des femmes"
CHI_Establishing_an_Independent_Bill_of_femininity_Rights_desc: "Les droits obtenus par les femmes doivent être défendus de manière plus efficace, et la législation est la meilleure solution. En établissant une nouvelle loi et en élevant les droits des femmes au-dessus des droits humains généraux, nous pouvons montrer la grandeur de notre cause pour les droits des femmes."
CHI_revise_of_women_Rights_Act_of: "Révision de la loi sur les droits des femmes"
CHI_revise_of_women_Rights_Act_of_desc: "La loi actuelle sur les droits des femmes ne protège pas efficacement ces droits. Nous devons ajouter une législation plus complète pour protéger les droits des femmes contre les violations et les abus, d'un point de vue juridique."
CHI_Female_specificity: "Spécificité féminine"
CHI_Female_specificity_desc: "Les femmes ne doivent pas être définies ! Nous sommes toutes belles car chacune a ses propres couleurs. Les femmes sont plus sensibles, compatissantes, plus gentilles et plus spéciales que les hommes. Sachez qu'au stade embryonnaire, les caractéristiques féminines sont les caractéristiques initiales de chaque embryon, et le mâle est le « second sexe » qui se développe plus tard ! Nous rejetons le regard genré masculin et défendrons l'honneur suprême d'être née femme."
CHI_strive_for_the_rights_to_speak: "Lutte pour le droit à la parole"
CHI_strive_for_the_rights_to_speak_desc: "Hommes et femmes sont tous des êtres humains. Il est inutile de juger l'un par rapport à l'autre. Les femmes ne doivent pas être définies par autrui, pas plus que les hommes. Nous n'utiliserons pas de méthodes méprisables pour promouvoir le féminisme. Nous parlerons avec des faits, lutterons pour le droit à la parole que nous méritons, et pousserons la société vers une direction plus égalitaire, amicale et meilleure."
CHI_Joint_LGBT_population: "Alliance avec la population LGBT"
CHI_Joint_LGBT_population_desc: "La communauté LGBT est également opprimée par le patriarcat depuis longtemps. Beaucoup d'entre eux sont nés beaux mais persécutés, tout comme nous, les femmes ! La cause féministe n'est pas seulement celle de la libération des femmes, mais aussi celle de toutes les personnes opprimées dans la société patriarcale et de la défense de leurs droits humains ! De plus, certains d'entre eux sont vraiment séduisants."
CHI_Maintain_distance_from_LGBT_population: "Maintenir une distance avec la population LGBT"
CHI_Maintain_distance_from_LGBT_population_desc: "Les personnes LGBT sont certes similaires aux femmes à certains égards - toutes deux sont diffamées et opprimées par la société patriarcale. Cependant, les droits se gagnent par la lutte. Les personnes LGBT ne parviennent même pas à former une identité de groupe solide. Comment pourraient-elles organiser un mouvement de grande échelle pour les droits ? De plus, leur conscience de soi est encore instable. Nous ne pouvons pas laisser la cause féministe être entravée par cette incertitude."
CHI_The_New_Era_of_Women: "La nouvelle ère des femmes"
CHI_The_New_Era_of_Women_desc: "L'ère du patriarcat est terminée. La Chine est devenue une société favorable aux femmes grâce à nos efforts. Nous prendrons Changsha, une ville favorable aux femmes, comme modèle pour condenser l'esprit des femmes de la nouvelle ère - l'esprit de Changsha."
CHI_Adhere_to_and_strengthen_leadership_in_women_work: "Maintenir et renforcer le leadership du Parti dans le travail des femmes"
CHI_Adhere_to_and_strengthen_leadership_in_women_work_desc: "Le Parti communiste chinois a toujours maintenu et renforcé son leadership dans le travail des femmes. Au cours des 70 dernières années, il a toujours défendu la proposition politique de l'égalité entre hommes et femmes, fixé la réalisation de la libération des femmes et de l'égalité des genres comme objectif, et considéré la cause des femmes comme une partie importante de sa mission. Les premier à douzième Congrès nationaux des femmes ont été organisés pour déterminer les principes et les tâches principales du mouvement des femmes et du travail des femmes en fonction des objectifs globaux du Parti et de l'État, et pour coordonner et promouvoir le travail des femmes. À la nouvelle ère, le leadership du Parti dans le travail des femmes a été encore renforcé. « Adhérer à la politique nationale de base de l'égalité entre hommes et femmes et sauvegarder les droits et intérêts légitimes des femmes et des enfants » a été inscrit dans les rapports des 18e et 19e Congrès nationaux du Parti, devenant un concept et un contenu important de la gouvernance du Parti."
CHI_Improve_women_political_rights: "Améliorer les droits politiques des femmes"
CHI_Improve_women_political_rights_desc: "Notre pays attache une grande importance à la protection des droits politiques égaux des femmes et des hommes. Dès la fondation de la Nouvelle Chine, la loi a stipulé que les hommes et les femmes ont des droits égaux pour voter, être élus et gérer les affaires de l'État. Au cours des 40 années de réforme et d'ouverture, la démocratie socialiste aux caractéristiques chinoises s'est constamment améliorée, offrant de nouvelles opportunités et élargissant les canaux pour la participation des femmes à la politique. Depuis le 18e Congrès national du Parti communiste chinois, dans le cadre de la modernisation du système de gouvernance nationale et de la capacité de gouvernance, le niveau de participation des femmes à la gestion des affaires étatiques et sociales s'est globalement amélioré, et leur rôle dans la construction de la politique démocratique s'est de plus en plus renforcé."
CHI_Establish_sound_Women_Federation_organization: "Établir et améliorer l'organisation de la Fédération des femmes"
CHI_Establish_sound_Women_Federation_organization_desc: "La Fédération nationale des femmes de Chine est une organisation de masse réunissant des femmes de toutes ethnies et de tous horizons, unies pour lutter pour leur libération et leur développement. C'est une organisation populaire sous la direction du Parti communiste chinois. Sous la direction du Parti, la Fédération des femmes assume, conformément à sa charte, la responsabilité politique d'unir et de guider les femmes de toutes ethnies et de tous horizons pour écouter et suivre le Parti, et remplit les fonctions fondamentales de représentation et de sauvegarde des droits et intérêts des femmes, de promotion de l'égalité des genres et du développement global des femmes. En se concentrant sur les objectifs globaux du Parti et du pays, elle promeut largement et profondément les théories, lignes, principes et politiques du Parti, unit et guide la majorité des femmes pour suivre résolument la voie du développement des femmes aux caractéristiques chinoises, joue un rôle unique dans la vie sociale et familiale, et contribue à la cause du socialisme aux caractéristiques chinoises."
CHI_Improve_laws_to_protect_womenrights_and_interests: "Améliorer les lois pour protéger les droits et intérêts des femmes"
CHI_Improve_laws_to_protect_womenrights_and_interests_desc: "Les droits des femmes sont des droits humains fondamentaux. Notre pays a intégré la protection des droits des femmes dans les lois et règlements, l'a élevée à la volonté de l'État et l'a intériorisée dans les normes de comportement social. Dès la fondation de la République populaire de Chine, le Parti communiste chinois a formulé et mis en œuvre une série de lois et règlements pour améliorer le statut des femmes. La Constitution de la République populaire de Chine, en tant que loi fondamentale de l'État, adhère toujours au principe de l'égalité entre hommes et femmes. La première constitution de 1954 stipulait que les femmes jouissent des mêmes droits que les hommes dans tous les aspects de la vie politique, économique, culturelle, sociale et familiale, et ce principe a été maintenu dans toutes les amendements ultérieurs. En 2004, « l'État respecte et protège les droits humains » a été inscrit dans un amendement constitutionnel, posant les bases de la protection des droits humains des femmes."
CHI_strengthen_propaganda_of_Gender_equality: "Renforcer la propagande de l'égalité des genres"
CHI_strengthen_propaganda_of_Gender_equality_desc: "Intégrer les connaissances juridiques, l'esprit de l'État de droit et la culture de l'État de droit protégeant les droits des femmes dans le plan national d'éducation juridique. Depuis le « Premier plan quinquennal » d'éducation juridique mis en œuvre en 1986 jusqu'au « Septième plan quinquennal » d'éducation juridique mis en œuvre en 2016, nous avons toujours considéré l'amélioration de la conscience juridique et de la littératie juridique des femmes, ainsi que le renforcement de leur capacité à participer à la pratique juridique, comme des tâches importantes. Nous insistons sur la combinaison de l'éducation et de la propagande juridique pour les femmes avec la promotion des valeurs socialistes fondamentales, sur la combinaison de l'éducation juridique avec la protection des droits des femmes conformément à la loi, sur la combinaison de l'éducation juridique régulière avec une éducation juridique ciblée telle que la Journée internationale des femmes chaque année, sur la combinaison de l'éducation juridique via les médias traditionnels avec celle via les nouveaux médias, et sur la combinaison de l'éducation et de la propagande juridique avec la stimulation de la vitalité des femmes en tant que sujets."
CHI_Establish_gender_equality_evaluation_mechanism: "Établir un mécanisme d'évaluation de l'égalité des genres"
CHI_Establish_gender_equality_evaluation_mechanism_desc: "Conformément au système et aux procédures de dépôt et d'examen de la Loi sur la législation de la République populaire de Chine, un nouveau mécanisme est établi pour protéger les droits et intérêts des femmes dès la source et promouvoir un développement égal entre hommes et femmes. De 2012 à 2018, 30 provinces (régions autonomes et municipalités) à travers le pays ont établi des mécanismes d'évaluation de l'égalité des genres pour les lois et politiques, introduisant le concept de valeur de l'égalité des genres dans la formulation, la mise en œuvre et la supervision des lois et politiques, renforçant l'institutionnalisation de la recherche et du jugement avant la formulation des politiques et règlements, de la mise en œuvre pendant la prise de décision et de l'évaluation après la mise en œuvre, reflétant davantage la volonté et les attentes des femmes à la nouvelle ère, et enrichissant encore la pratique vivante de la législation scientifique et démocratique à la nouvelle ère."
CHI_Ensuring_equal_land_rights_for_women: "Garantir l'égalité des droits fonciers pour les femmes"
CHI_Ensuring_equal_land_rights_for_women_desc: "Les femmes sont des bâtisseuses importantes du pays. De la réforme agraire au système de responsabilité des ménages ruraux, en passant par la confirmation, l'enregistrement et la certification des droits fonciers ruraux contractés et la séparation des « trois droits » des terres rurales, la Chine a toujours attaché de l'importance à la protection des droits et intérêts fonciers des femmes à travers le système juridique. Depuis 2010, l'enregistrement et la certification des droits fonciers ruraux contractés ont été réalisés, et il est clairement requis que les droits de contrat et de gestion des terres des femmes rurales soient inscrits sur le certificat de propriété, permettant ainsi à la majorité des femmes rurales d'obtenir « un nom sur le certificat et des droits sous ce nom ». La Loi sur les contrats fonciers stipule clairement que les membres de la famille d'un ménage agricole jouissent de droits et intérêts égaux pour contracter des terres conformément à la loi, garantissant que les femmes rurales jouissent de droits égaux pour contracter et gérer des terres. En 2016, le Comité central du PCC et le Conseil d'État ont publié les « Opinions sur l'avancement régulier de la réforme du système des droits de propriété collective rurale ». En 2018, le ministère des Affaires civiles, l'Organisation centrale, la Fédération nationale des femmes et sept autres départements ont conjointement publié les « Opinions directrices sur la bonne rédaction des règles villageoises et des conventions des résidents », exigeant la correction des violations des lois et politiques. Les droits fonciers et les intérêts économiques des femmes rurales sont efficacement protégés, et elles participent activement à la revitalisation rurale et contribuent à la modernisation de l'agriculture et des zones rurales."
CHI_Gender_equality_on_maternity_leave: "Égalité des genres pour le congé de maternité"
CHI_Gender_equality_on_maternity_leave_desc: "L'article 7 des Dispositions spéciales sur la protection du travail des employées stipule : « Les employées ont droit à 98 jours de congé de maternité, incluant 15 jours de congé prénatal ; en cas d'accouchement difficile, 15 jours supplémentaires de congé de maternité sont accordés ; en cas de naissances multiples, 钣 jours supplémentaires de congé de maternité sont accordés pour chaque bébé supplémentaire. Les employées qui font une fausse couche avant le quatrième mois de grossesse bénéficient de 15 jours de congé de maternité ; celles qui font une fausse couche après le quatrième mois de grossesse bénéficient de 42 jours de congé de maternité. » Aujourd'hui, une législation devrait être adoptée pour permettre aux hommes de bénéficier des mêmes droits de congé de maternité que les femmes, ce qui constitue une pierre angulaire importante pour garantir l'égalité des genres."
CHI_Equal_reproductive_rights: "Droits reproductifs égaux"
CHI_Equal_reproductive_rights_desc: "Les hommes et les femmes doivent avoir les mêmes obligations et droits en matière de reproduction. La reproduction est une affaire qui concerne à la fois les hommes et les femmes, et non une obligation ou un droit unilatéral d'une seule partie. Nous devons renforcer la promotion des droits reproductifs égaux et construire un concept de reproduction plus harmonieux et beau."
CHI_Completely_prohibit_bride_price_system: "Interdire complètement la mauvaise coutume du prix de la mariée"
CHI_Completely_prohibit_bride_price_system_desc: "Les cadeaux de mariage et les dots sont les aspects les plus réactionnaires et féodaux des coutumes matrimoniales actuelles. Ce sont des pratiques vicieuses qui aliènent les personnes en marchandises et transforment le mariage en un commerce de traite humaine. Il est incroyable que de tels vestiges féodaux existent encore dans un pays socialiste au XXIe siècle. Pendant longtemps, notre pays a adopté une attitude froide envers la question des cadeaux de mariage. Il ne les reconnaît ni ne les encourage, mais ne les interdit pas non plus, les traitant uniquement comme des dons de propriété. Il est maintenant temps d'éliminer complètement ces vestiges féodaux. Le socialisme n'a pas besoin de traite humaine."
CHI_Completely_prohibit_sexual_transaction: "Interdire complètement les transactions sexuelles"
CHI_Completely_prohibit_sexual_transaction_desc: "L'essence du commerce sexuel est de marchandiser les personnes, en les traitant comme des morceaux de viande et des outils de gratification sexuelle. C'est une aliénation des personnes et cela conduira à la tragédie de la traite humaine déguisée et de l'exploitation physique. Après la fondation de la Nouvelle Chine, l'industrie du sexe en Chine continentale a été rapidement éliminée, et à la fin de 1951, le travail d'interdiction de la prostitution dans diverses régions était pratiquement achevé. Après la réforme et l'ouverture, l'industrie du sexe a rapidement fait un retour et a atteint une échelle considérable, mais l'attitude de notre pays d'interdire strictement l'industrie pornographique n'a pas vacillé le moins du monde. Ces industries grises doivent être complètement éradiquées, qu'elles servent les hommes ou les femmes."
CHI_Protecting_Women_labor_rights: "Protéger les droits du travail des femmes"
CHI_Protecting_Women_labor_rights_desc: "Pourquoi le statut des femmes est-il si bas ? La raison fondamentale est que les femmes ne jouissent pas de droits du travail adéquats. Les femmes ne sont pas économiquement indépendantes et dépendent inévitablement des autres, ce qui conduit inévitablement à une inégalité et une exploitation généralisées basées sur le genre. Notre pays attache une grande importance à la protection institutionnelle des droits de protection du travail des employées. De la promulgation des « Règlements sur la protection du travail des employées » en 1988 à l'introduction des « Règlements spéciaux sur la protection du travail des employées » en 2012, le niveau de protection du travail des employées s'est constamment amélioré. Le « Guide pour promouvoir l'égalité des genres sur le lieu de travail » a été compilé et publié pour encourager les employeurs à mettre en œuvre les lois et règlements et à sauvegarder les droits légitimes et les intérêts spéciaux des employées. Divers travaux de protection du travail ont été approfondis, créant des conditions pour que les employées participent au développement économique et social. Les employées de tous horizons, avec un fort sens des responsabilités et une mission historique, jouent un rôle de plus en plus important dans le développement économique et le progrès social du pays."
CHI_Ensuring_women_education_right: "Garantir le droit à l'éducation des femmes"
CHI_Ensuring_women_education_right_desc: "L'éducation est le moyen fondamental de cultiver une conscience moderne et des citoyens modernes. La Loi sur l'éducation obligatoire de la République populaire de Chine et d'autres lois et politiques ont continuellement augmenté les investissements dans l'éducation obligatoire, en se concentrant sur les zones rurales. Grâce à la création de bourses pour les écoles primaires et secondaires, à la formulation de politiques d'aide spéciales pour les filles et à la mise en œuvre de projets d'aide aux étudiants tels que le « Projet Bourgeon de Printemps » et le « Projet Espoir », les opportunités pour les filles rurales de recevoir une éducation ont considérablement augmenté. En 1988, la Loi sur l'enseignement supérieur de la République populaire de Chine a été promulguée, ce qui a continuellement élargi l'échelle de l'enseignement supérieur, promu le système de prêts étudiants et établi des bourses pour étudiants, créant des conditions pour que davantage de femmes reçoivent une éducation supérieure."
CHI_socialist_women: "Femmes socialistes"
CHI_socialist_women_desc: "Grâce à nos efforts, les droits des femmes ont enfin été fondamentalement et largement protégés, et l'ère de l'exploitation basée sur le genre est révolue à jamais. Les femmes cultivées par notre grande patrie socialiste doivent être confiantes, glorieuses et travailleuses."
CHI_denied_gender_inequality: "Nier l'inégalité des genres"
CHI_denied_gender_inequality_desc: "Où est l'inégalité des genres ? Il y a tant de femmes qui se promènent dans la rue avec des vêtements révélateurs, la moitié des salles de classe sont remplies de filles, et même de nombreux emplois sont réservés aux femmes. Où est l'inégalité ? Ces femmes cherchent vraiment à semer le trouble ! Il n'y a rien à discuter. De plus, le monde est intrinsèquement inégal. Pourquoi les femmes devraient-elles être les premières à réclamer l'égalité ? C'est absurde."
CHI_Moral_condemnation: "Condamnation morale"
CHI_Moral_condemnation_desc: "L'inégalité des genres est terminée. Les femmes ont maintenant le droit de tout faire librement. Nous avons également le droit de critiquer ces femmes. Celles qui réclament les droits des femmes sont toutes homosexuelles. Elles sont de mèche avec ces personnes androgynes qui se disent LGBT. Elles sont déterminées à détruire tout ce qui est beau et stable, à piétiner tout ce qui est sacré et correct, et à satisfaire leurs désirs sexuels pervers."
CHI_Deprivation_of_women_political_rights: "Privation des droits politiques des femmes"
CHI_Deprivation_of_women_political_rights_desc: "Que savent les femmes de la politique ? Faire voler une truie est plus facile que de leur faire comprendre la différence entre les idées et idéologies politiques. La politique est un jeu d'hommes. Laisser les femmes s'impliquer dans la politique ne fera que tout compliquer, les laissant avec des efféminés et des gigolos. Priver les femmes de leur droit à participer à la politique est non seulement pour leur propre bien, mais aussi pour le bien de la société dans laquelle nous vivons tous."
CHI_Women_go_home: "Les femmes, rentrez chez vous !"
CHI_Women_go_home_desc: "Le travail des femmes est de s'occuper de leur mari et de leurs enfants, tandis que les hommes sont ceux qui travaillent dur à l'extérieur. C'est ainsi que cela doit être. La concurrence des femmes avec les hommes dans la sphère publique cause un double préjudice : d'une part, elles forcent les hommes à devenir des bourreaux de travail pour conserver leurs bons emplois, comme les postes de travail intellectuel ; d'autre part, elles rendent les hommes plus susceptibles d'accepter de mauvais emplois, comme les postes de travail physique. Permettre aux femmes de participer à la production sociale est une très mauvaise chose qui « rend les hommes chômeurs et ajoute un fardeau aux femmes ». Les femmes peuvent-elles faire mieux que les hommes ?"
CHI_Family_First: "La famille d'abord"
CHI_Family_First_desc: "La famille est l'unité de base de la société. Tout le monde devrait se marier après l'âge adulte. C'est la seule manière pour que la société fonctionne de manière stable et normale. Ces féministes aiment clamer qu'il ne faut ni mariage ni enfants. C'est tout simplement déraisonnable. Elles aiment l'homosexualité, mais que doivent faire les hommes ? Devraient-ils laisser deux hommes s'apparier comme ces personnes LGBT qui ne sont ni hommes ni femmes ? De plus, sans mariage, il n'y a pas moyen d'avoir des enfants. Quel est l'avenir d'une nation sans enfants ? Pour le bien de la famille sacrée et de l'avenir de la nation, toutes les féministes doivent être éradiquées."
CHI_Criminalization_of_abortion: "Criminalisation de l'avortement"
CHI_Criminalization_of_abortion_desc: "Tout le monde a le droit de vivre. Les féministes peuvent refuser de se marier, mais elles procèdent même à des avortements à leur guise. C'est tout simplement un meurtre pur et simple ! Leurs vies sont-elles les seules qui comptent, et pas celles des bébés ? Les visages maléfiques des féministes sont pleinement révélés face à la vie humaine. Ces meurtrières et meurtrières potentielles doivent toutes être condamnées et jetées en prison."
CHI_Demonizing_feminists: "Démonisation des féministes"
CHI_Demonizing_feminists_desc: "Les féministes sont toutes des perverses égoïstes, sans humour, négligées, délibérément non féminines, ainsi que des femmes jalouses, bruyantes et acariâtres. Non seulement les féministes sont extrêmement stupides, elles ne supportent pas l'instigation de ceux qui ont des motifs cachés et deviennent des outils pour que d'autres gagnent gloire et fortune. Elles sont aussi irritables et imprudentes, en colère toute la journée, extrêmes et rigides dans leur pensée, et le sexisme est partout. Qui sait avec qui les femmes célibataires passent la nuit avec leurs patrons ? Qui sait quels films ringards ces vieilles vierges aiment regarder en privé ?"
CHI_The_Value_of_Men: "La valeur des hommes"
CHI_The_Value_of_Men_desc: "Les hommes naissent confiants, forts et pleins de masculinité. Cependant, dès qu'ils s'impliquent avec des femmes, ils deviennent aussi stupides et névrosés qu'elles, et ne sont plus du tout virils. Quand les hommes s'entendent avec d'autres hommes, ils deviennent unis, amicaux et coopératifs. Débarrassons-nous des femmes et des entraves, restaurons notre fraternité, retrouvons le sentiment unique des hommes, libérons-nous de l'oppression de l'industrialisation et du féminisme, et dans les activités de retour à la nature, les hommes vont collectivement dans la forêt pour jouer du tambour, chanter des chansons, écouter des poèmes et des mythes, et inspirer le sang de nos ancêtres chasseurs."
CHI_blame_the_victim: "Blâmer la victime"
CHI_blame_the_victim_desc: "N'est-ce pas la faute des femmes si elles sont vulnérables au viol et au vol ? N'est-ce pas parce qu'elles s'habillent ainsi pour attirer les hommes ? Dans une société légale, inciter autrui à commettre des crimes est aussi un crime. Nous pardonnons encore de tels crimes, mais personne ne compatira aux conséquences de leur comportement stupide."
CHI_Confucianism_ethic: "Promouvoir l'éthique confucéenne"
CHI_Confucianism_ethic_desc: "Les hommes sont droits à l'extérieur, les femmes sont droites à l'intérieur, et le mari et la femme créent le commencement de toutes choses. Là où il y a des hommes et des femmes, il doit y avoir mari et femme. Lorsque la voie du mari et de la femme est cultivée, l'étiquette intérieure et extérieure est correcte. Zisi a dit : « La voie d'un gentleman commence avec le mari et la femme. » L'auto-culture et la gestion familiale sont la base de l'éducation. Les cinq vertus sont toujours proéminentes, et la grande fondation est renforcée. La signification des trois guides cardinaux est claire, et les relations humaines sont correctes. Le dirigeant est le guide des ministres, le père est le guide des fils, et le mari est le guide de la femme. Lorsque le dirigeant est droit et les ministres loyaux, le père est bienveillant et les fils sont filiaux, et le mari et la femme sont harmonieux, alors les relations humaines sont correctes."
CHI_Advocate_consumerism: "Promouvoir le consumérisme"
CHI_Advocate_consumerism_desc: "Un homme qui ne peut pas gagner d'argent n'est pas un bon homme, et une femme qui ne peut pas dépenser d'argent n'est pas une bonne femme. La principale force de consommation est bien sûr les femmes, et les femmes devraient dépenser tout l'argent. Utilisez des cosmétiques, des produits de luxe et de beaux vêtements pour épuiser tout l'argent des femmes, dépasser leur limite de prêt, afin qu'elles doivent dépendre des hommes."
CHI_domesticating_education: "Éducation domestiquante"
CHI_domesticating_education_desc: "Dans la société moderne, tout le monde a le droit de recevoir une éducation, et les femmes ne font pas exception. Les femmes devraient apprendre ce que les femmes doivent apprendre. Puisqu'elles ne peuvent pas apprendre des choses compliquées, elles devraient apprendre davantage de cours d'économie domestique et de cours idéologiques et politiques."
CHI_True_Women: "Vraies femmes"
CHI_True_Women_desc: "Grâce à nos efforts, le chaos des féministes a enfin été réprimé, et les femmes ont enfin été libérées de l'instigation des idées féministes. Désormais, notre société sera plus harmonieuse, et les hommes comme les femmes pourront trouver leur propre position et être satisfaits du statu quo."
CHI_laborer_rights_and_interests: "Droits et intérêts des travailleurs"
CHI_laborer_rights_and_interests_desc: "Les droits et intérêts des travailleurs sont une question majeure dans notre pays et doivent être traités avec prudence."
CHI_Emphasize_labor_laws: "Mettre l'accent sur les lois du travail"
CHI_Emphasize_labor_laws_desc: "Notre pays a déjà promulgué des lois du travail, qui contiennent des dispositions détaillées sur la définition du statut travail-capital et la relation entre eux. Cependant, pour diverses raisons, les lois du travail de notre pays sont souvent ignorées. Pour traiter des droits et intérêts des travailleurs, nous devons prendre l'État de droit comme base, et nous devons mettre l'accent sur le rôle des lois du travail dans la régulation des droits et intérêts des travailleurs."
CHI_Protecting_workers: "Protéger les droits des travailleurs"
CHI_Protecting_workers_desc: "Les travailleurs sont la pierre angulaire du développement de notre pays. Ils forment un groupe politique multi-classes qui inclut la petite et moyenne bourgeoisie, les fonctionnaires, les intellectuels, les indépendants, les pêcheurs et les artisans. Les travailleurs s'appuient sur l'hygiène du travail pour promouvoir le développement social. Nous devons mettre en œuvre et protéger les droits et intérêts légitimes des travailleurs. Sinon, comment pouvons-nous dire que nous sommes un pays socialiste ?"
CHI_Comfort_entrepreneurs: "Soutenir les entrepreneurs"
CHI_Comfort_entrepreneurs_desc: "Dans notre pays, les entrepreneurs et les capitalistes ne se recoupent pas complètement. Les entrepreneurs sont des personnes qui contrôlent des moyens de production plus efficaces dans l'économie de marché socialiste et jouent un rôle de premier plan dans le développement économique. Les entrepreneurs sont également des citoyens de notre pays, et leurs droits et revenus du travail doivent également être protégés."
CHI_Corporatism: "Réguler les conflits travail-capital"
CHI_Corporatism_desc: "La tâche centrale actuelle de notre pays est la construction économique plutôt que la lutte des classes. Tous les travailleurs et entrepreneurs doivent mettre de côté leurs différends et travailler ensemble pour construire notre grande patrie."
CHI_All_China_Federation_of_Trade_Unions: "Fédération nationale des syndicats de Chine"
CHI_All_China_Federation_of_Trade_Unions_desc: "Notre parti sert le peuple et est l'avant-garde du prolétariat. Nous devons diriger tous les travailleurs... euh, par exemple, établir une fédération de syndicats... et garantir les intérêts des travailleurs..."
CHI_Commission_of_Commerce: "Commission du commerce"
CHI_Commission_of_Commerce_desc: "L'économie non publique est une partie importante de l'économie de marché socialiste, et c'est aussi la partie la plus difficile à gérer et à contrôler. Établir des comités de commerce dans diverses régions pour superviser et diriger les activités économiques des entrepreneurs est un moyen important de garantir le développement harmonieux de l'économie de notre pays."
CHI_Class_struggle_led_by_Party: "Lutte des classes dirigée par le Parti"
CHI_Class_struggle_led_by_Party_desc: "Le Parti dirige tout, y compris le Parti, le gouvernement, l'armée, le peuple et l'éducation. La lutte des classes doit également être menée sous la direction du Parti. Interdire les luttes destructrices et l'exploitation sans fin est la responsabilité et l'engagement du Parti envers le pays et le peuple."
CHI_The_collaboration_between_labour_and_capital: "La collaboration entre le travail et le capital"
CHI_The_collaboration_between_labour_and_capital_desc: "La coopération travail-capital et des relations de travail harmonieuses sont la base de l'harmonie sociale. Cependant, la coopération et l'harmonie doivent être fondées sur l'égalité. Une soi-disant coopération et harmonie sans égalité est de l'esclavage et de l'oppression, masquant les contradictions plutôt que de les éliminer. Une telle coopération et harmonie ne peut pas durer. La coopération n'est pas une fusion, mais la promotion des intérêts de toutes les parties simultanément par le partage des bénéfices ; l'harmonie n'est pas l'absence de contradictions, mais la résolution raisonnable des contradictions et des conflits pour éviter leur intensification. Ce n'est que lorsque les droits et intérêts raisonnables des travailleurs sont protégés et que le partage des bénéfices est réalisé (le travail et le capital en bénéficient tous deux) que les relations travail-capital peuvent être harmonieuses, la coopération travail-capital peut se poursuivre, le développement économique peut être soutenu, et la société peut être harmonieuse."
CHI_The_right_to_education: "Le droit à l'éducation"
CHI_The_right_to_education_desc: "L'éducation est un droit fondamental dont jouit chaque citoyen et constitue également un plan fondamental pour la prospérité d'un pays. Le problème de l'éducation dans notre pays est très complexe, impliquant de nombreux aspects et domaines, et impliquant également les intérêts de différents groupes."
CHI_reform_from_the_bottom: "Réforme par la base"
CHI_reform_from_the_bottom_desc: "Un remède puissant guérit la maladie, des punitions sévères sont utilisées pour contrôler le chaos. Ce n'est qu'en corrigeant la cause profonde que nous pouvons purifier la source. Ce n'est qu'en rectifiant depuis la racine et en purifiant depuis la source que nous pouvons bien faire le travail de l'éducation."
CHI_consolidating_vital_base: "Consolider la base vitale"
CHI_consolidating_vital_base_desc: "Le cours de la nature est constant, et il y a une limite à la quantité de richesse et de vide qu'il y a. La réforme de l'éducation ne peut pas être précipitée. C'est une question qui concerne des centaines de millions d'enseignants et d'étudiants, et même plus d'un milliard de personnes dans toute la société. Elle doit être traitée avec prudence."
