l_french:
 CHI_idea_high_speed_railway_modifier: "High Speed Railway"
 CHI_idea_high_speed_railway_modifier_desc: ""
 PENINSULA_SHIELD: "Force du Bouclier de la Péninsule"
 peninsula_shield_force_member: "Force du Bouclier de la Péninsule"
 peninsula_shield_force_member_desc: "Les Forces du Bouclier de la Péninsule sont une organisation militaire régionale qui coordonne les efforts conjoints de défense et de sécurité des États membres du CCG. Leur emblème symbolise l'unité, la protection et la préparation, représentant les capacités de défense collective des pays du CCG."
#Politique nationale
CHI_Millennium:0 "Millénaire"
CHI_Millennium_desc:0 "L'an 2000 marque le 51e anniversaire de la fondation de la République populaire de Chine. Notre grande patrie socialiste entre dans une nouvelle ère. Tracer la voie chinoise au XXIe siècle exige que l'ensemble du peuple rédige ensemble un nouveau chapitre de cette époque."
CHI_tenth_five_year_plan:0 "Dixième plan quinquennal"
CHI_tenth_five_year_plan_desc:0 "En mars 2001, la quatrième session du neuvième Congrès national du peuple a adopté les grandes lignes du dixième plan quinquennal pour le développement économique et social national. Conformément aux besoins du développement d'une économie de marché socialiste, l'ajustement stratégique de la structure économique a été défini comme priorité. La construction écologique, la protection de l'environnement et le développement durable de l'économie et de la société ont reçu une attention particulière. Une importance accrue a été accordée aux initiatives sociales telles que l'éducation, la culture, la santé et le sport, ainsi qu'au développement coordonné de l'économie et de la société, afin de mieux répondre aux besoins de développement et de bien-être des masses populaires."
CHI_Letter_of_BUSH:0 "Lettre du président Bush"
CHI_Letter_of_BUSH_desc:0 "Après l'incident de collision entre un avion chinois et un avion américain, le président américain Bush a finalement envoyé deux « lettres exprimant des regrets » au président. Bien que nous sachions qu'il s'agit d'un geste purement formel, il est indéniable que nous devons y répondre avec un sourire pour le moment."
CHI_Support_the_War_on_Terror:0 "Soutenir la guerre contre le terrorisme"
CHI_Support_the_War_on_Terror_desc:0 "Même le pays le plus puissant du monde, les États-Unis, a été victime d'attaques terroristes. Les tours jumelles, autrefois imposantes, se sont effondrées sous les yeux de tous. Notre pays ne permettra jamais qu'un tel événement se produise. Nous devons combattre tout ce qui menace la Chine et le peuple chinois. Nous devons voter au Conseil de sécurité des Nations unies pour soutenir les États-Unis dans leur lutte contre les terroristes en Afghanistan. Ils sont trop proches de nous, et c'est le moment idéal pour que l'impérialisme américain les affronte directement."
CHI_Comprehensively_building_a_moderately_prosperous_society:0 "§YConstruire pleinement une société modérément prospère§!"
CHI_Comprehensively_building_a_moderately_prosperous_society_desc:0 "Le Congrès a examiné et adopté le rapport « Construire pleinement une société modérément prospère et créer une nouvelle situation pour la cause du socialisme à caractéristiques chinoises », présenté par Jiang Zemin au nom du 15e Comité central. Conformément à l'objectif de créer une nouvelle situation pour le socialisme à caractéristiques chinoises, et sur la base d'une analyse approfondie des nouveaux défis et tâches auxquels le Parti et le pays sont confrontés, le Congrès a fixé l'objectif de construire une société modérément prospère de manière globale. Il a souligné que, durant les vingt premières années de ce siècle, nous devons concentrer nos efforts sur la construction d'une société modérément prospère de niveau supérieur, bénéficiant à plus d'un milliard de personnes, avec une économie plus développée, une démocratie plus robuste, des progrès scientifiques et éducatifs accrus, une culture plus florissante, une société plus harmonieuse et une vie plus prospère pour le peuple. Cette étape de développement est nécessaire pour relier le passé au futur afin d'atteindre le troisième objectif stratégique de la modernisation, et constitue une phase clé pour perfectionner le système économique de marché socialiste et élargir l'ouverture. Après cette phase de construction, nous continuerons à travailler dur pendant plusieurs décennies pour atteindre fondamentalement la modernisation d'ici le milieu du siècle et faire de notre pays une nation socialiste prospère, démocratique et civilisée."
CHI_The_great_rejuvenation_of_Chinese_nation:0 "§YLa grande renaissance de la nation chinoise§!"
CHI_The_great_rejuvenation_of_Chinese_nation_desc:0 "Dans le rapport du 16e Congrès national du Parti communiste chinois, nous avons proposé l'objectif ambitieux de réaliser la grande renaissance de la nation chinoise. Le nouveau siècle sera celui où notre parti accomplira de grandes choses. Trop d'événements survenus ces dernières années nous ont fait perdre la face devant les États-Unis et le monde. Les impérialistes américains pensent peut-être que cela peut nous humilier et nous réprimer, mais ils ne sont que des tigres de papier. Comment un moineau pourrait-il comprendre l'ambition d'un cygne ? Le Parti communiste chinois est le parti du peuple. Nous devons guider le peuple chinois vers une ère meilleure, une ère où les Chinois ne seront plus jamais opprimés !"
CHI_Chairman_Jiang_Reign:0 "Mandat du président Jiang"
CHI_Chairman_Jiang_Reign_desc:0 "Jiang Zemin est un successeur remarquable de Deng Xiaoping, un homme engagé dans les réformes du marché libre tout en maintenant la suprématie politique du Parti communiste chinois. Au tournant du siècle, la situation internationale a radicalement changé, et le processus de réforme, d'ouverture et de modernisation socialiste de notre pays a été grandiose. Le président Jiang est un capitaine expérimenté à la barre, et il guidera notre parti et notre pays dans l'immense océan du nouveau siècle."
CHI_End_PLA_Business_Ventures:0 "Mettre fin aux entreprises commerciales de l'APL"
CHI_End_PLA_Business_Ventures_desc:0 "Pour compenser les réductions du budget de la défense, l'Armée populaire de libération (APL) a commencé à acquérir des entreprises commerciales dans les années 1970. Cependant, cela a conduit à une corruption généralisée et à un manque de discipline, l'armée s'alliant de plus en plus avec les capitalistes. En conséquence, une nouvelle directive est nécessaire pour retirer l'APL de la plupart des secteurs de l'économie, tout en augmentant le budget pour apaiser les militaires."
CHI_3_Represents_Thought:0 "Pensée des trois représentations"
CHI_3_Represents_Thought_desc:0 "Le camarade Jiang Zemin a proposé et élaboré de manière exhaustive la pensée importante des « trois représentations » lors d'une inspection à Guangdong le 25 février 2000, en s'appuyant sur un résumé complet de l'expérience historique du parti et des exigences d'adaptation aux nouvelles situations et tâches. Son contenu spécifique est que le Parti communiste chinois représente toujours les exigences de développement des forces productives avancées de la Chine, l'orientation de la culture avancée chinoise et les intérêts fondamentaux de la vaste majorité du peuple chinois. La pensée des « trois représentations » est le fondement de notre parti, la base de notre gouvernance et la source de notre force."
CHI_Invigorate_Country_Through_STE:0 "Revitaliser le pays par la science et l'éducation"
CHI_Invigorate_Country_Through_STE_desc:0 "« Revitaliser le pays par la science et l'éducation » signifie mettre pleinement en œuvre l'idée que la science et la technologie sont les premières forces productives, en adhérant au principe de l'éducation comme fondement, en plaçant la science, la technologie et l'éducation au cœur du développement économique et social, en renforçant la puissance scientifique et technologique du pays et sa capacité à se transformer en forces productives réelles, en améliorant la qualité scientifique et culturelle de toute la nation, en orientant la construction économique vers une voie qui repose sur le progrès scientifique et technologique et l'amélioration de la qualité des travailleurs, et en accélérant la réalisation de la prospérité nationale. Ce plan permettra à notre pays de combler ses désavantages technologiques."
CHI_Permit_Entrepreneurs_to_Join_the_CPC:0 "Autoriser les entrepreneurs à rejoindre le PCC"
CHI_Permit_Entrepreneurs_to_Join_the_CPC_desc:0 "Intégrer des membres exceptionnels d'autres classes sociales au Parti et permettre à des membres éminents des nouvelles classes sociales, y compris des entrepreneurs privés, de rejoindre le Parti ne signifie pas ouvrir la porte sans principes, permettre à n'importe qui de s'inscrire ou forcer ceux qui ne le souhaitent pas à adhérer. Nous n'autoriserons jamais ceux qui sont politiquement rétrogrades ou ont des motivations impures à s'infiltrer dans le Parti, ni certains à rejoindre le Parti simplement en raison de leur puissance économique ou de leur notoriété personnelle.\n\nSeuls les entrepreneurs privés exceptionnels, politiquement avancés, répondant aux conditions d'adhésion au Parti, capables d'adhérer aux objectifs du Parti, de remplir strictement leurs obligations en tant que membres, d'accepter consciemment la supervision de l'organisation du Parti et de respecter exemplairement les politiques et lois nationales, seront accueillis par l'organisation du Parti pour rejoindre ses rangs."
CHI_Manufacturing_exports:0 "Exportations manufacturières"
CHI_Manufacturing_exports_desc:0 "Après l'adhésion à l'Organisation mondiale du commerce, notre pays a reçu un afflux massif d'investissements étrangers et de commandes commerciales. Nous devons continuer à adopter et élargir la politique de développement des exportations manufacturières, afin d'absorber les investissements étrangers, d'accélérer la construction industrielle et de devenir le cœur battant de l'industrie manufacturière mondiale."
CHI_16th_National_Congress_of_CPC:0 "16e Congrès national du Parti communiste chinois"
CHI_16th_National_Congress_of_CPC_desc:0 "Le 16e Congrès national du Parti communiste chinois s'est tenu à Pékin du 8 au 14 novembre 2002. Le congrès comptait 2 114 délégués officiels et 40 délégués spéciaux, représentant plus de 66 millions de membres du parti à travers le pays. Le 16e Congrès national du Parti communiste chinois fut le premier congrès national du parti au nouveau siècle. Ce fut également un congrès crucial, tenu à une nouvelle étape de développement, alors que notre pays entrait dans une société modérément prospère et accélérait la modernisation socialiste. Le congrès a désigné le successeur du président Jiang, le camarade Hu Jintao, qui a longtemps travaillé au sein de la Ligue de la jeunesse communiste et est une figure discrète."
CHI_Hu_Jintao_Agenda:0 "Programme de Hu Jintao"
CHI_Hu_Jintao_Agenda_desc:0 "Lors de la première session du 10e Congrès national du peuple, le camarade Hu Jintao a été élu président de la République populaire de Chine. Lors de la quatrième session plénière du 16e Comité central, il a été élu président de la Commission militaire centrale. Lors de la troisième session du 10e Congrès national du peuple, il a été élu président de la Commission militaire centrale de la République populaire de Chine. Lors de la première session plénière du 17e Comité central, il a été élu président de la Commission militaire centrale. Le pouvoir d'État a progressivement été transféré à ce « jeune homme »."
CHI_16_Third_Plenum:0 "Troisième plénum du 16e Comité central du Parti communiste chinois"
CHI_16_Third_Plenum_desc:0 "Le troisième plénum du 16e Comité central du Parti communiste chinois s'est tenu à Pékin du 11 au 14 octobre 2003. Au cours de la réunion, le Bureau politique du Comité central du PCC a rendu compte au Comité  central et le président Hu Jintao a défini l'orientation des travaux pour les années à venir."
CHI_unwaveringly_committed_to_reform_and_opening_up:0 "Engagement indéfectible envers la réforme et l'ouverture"
CHI_unwaveringly_committed_to_reform_and_opening_up_desc:0 "Pourquoi restons-nous fermement attachés à la réforme et à l'ouverture ? Parce qu'elles répondent aux aspirations communes du peuple, constituent la seule voie pour développer le socialisme et sont une exigence inhérente à la nature avancée du Parti en tant qu'avant-garde du prolétariat. La réforme et l'ouverture ont écrit l'épopée la plus magnifique de l'histoire chinoise : la nation chinoise a fait de grands pas pour rattraper les tendances de l'époque, la Chine socialiste se dresse fièrement à l'est du monde, et notre Parti marche avec assurance à l'avant-garde des temps modernes. En adhérant sans relâche à la réforme et à l'ouverture, thème principal de la Chine contemporaine, le peuple a toutes les raisons d'espérer un avenir meilleur et plus heureux."
CHI_developing_socialism_market_economy:0 "Développer une économie de marché socialiste"
CHI_developing_socialism_market_economy_desc:0 "Le système économique de marché socialiste est une innovation théorique et pratique majeure du socialisme à caractéristiques chinoises et un élément clé du système économique socialiste de base. Pour s'adapter à la nouvelle situation de la mondialisation économique et des progrès technologiques accélérés, et pour construire une société modérément prospère à tous les égards, nous devons suivre le déploiement stratégique du 16e Congrès national du PCC pour établir un système économique de marché socialiste robuste et un système économique plus dynamique et ouvert, accélérer les réformes, libérer et développer davantage la productivité, et insuffler un élan puissant au développement économique et au progrès social."
CHI_Adhere_to_subject_status_of_public_ownership:0 "Maintenir la position dominante de la propriété publique"
CHI_Adhere_to_subject_status_of_public_ownership_desc:0 "Adhérer à la position dominante de la propriété publique est une caractéristique essentielle du socialisme. À l'étape initiale du socialisme dans notre pays, nous devons maintenir et améliorer le système économique de base dans lequel la propriété publique est prédominante, tout en développant conjointement diverses formes de propriété. La position dominante de la propriété publique est un principe juridique stipulé par l'essence du socialisme et consacré par la Constitution. Elle ne peut ni ne sera ébranlée. Les entreprises d'État sont le principal vecteur de l'économie d'État pour jouer un rôle de premier plan et constituent une force importante pour promouvoir la modernisation nationale et sauvegarder les intérêts fondamentaux du peuple."
CHI_Five_Overall_planning_and_Scientific_Outlook_on_Development:0 "Cinq planifications globales et vision scientifique du développement"
CHI_Five_Overall_planning_and_Scientific_Outlook_on_Development_desc:0 "Hu Jintao, secrétaire général du Comité central du PCC, a proposé le concept de développement scientifique consistant à « adhérer au principe axé sur l'humain, établir un concept de développement global, coordonné et durable, et promouvoir le développement global de l'économie, de la société et des individus ». Il est nécessaire de promouvoir la réforme et le développement des différentes entreprises conformément aux cinq exigences de développement coordonné : coordonner le développement urbain et rural, le développement régional, le développement économique et social, le développement harmonieux entre l'homme et la nature, ainsi que le développement domestique et l'ouverture sur l'extérieur."
CHI_balance_urban_and_rural_development:0 "Équilibrer le développement urbain et rural"
CHI_balance_urban_and_rural_development_desc:0 "Le secrétaire général Hu Jintao a proposé de prêter davantage d'attention au développement des zones rurales, de résoudre les « trois problèmes ruraux », de mettre fermement en œuvre le principe selon lequel l'industrie soutient l'agriculture et les villes soutiennent les campagnes, de modifier progressivement la structure économique duale urbaine-rurale, de réduire progressivement l'écart de développement urbain-rural, de réaliser un développement global de l'économie et de la société rurales, de mettre en œuvre la politique de diriger la campagne par la ville, de promouvoir l'agriculture par l'industrie, et de favoriser un développement interactif et coordonné entre les zones urbaines et rurales, afin d'atteindre un développement durable de l'agriculture et de l'économie rurale."
CHI_new_rural_cooperative_medical_insurance:0 "Nouvelle assurance médicale coopérative rurale"
CHI_new_rural_cooperative_medical_insurance_desc:0 "Comment le socialisme pourrait-il exister sans le bien-être médical du peuple ? En octobre 2002, la Chine a clairement proposé que les gouvernements à tous les niveaux guident activement les agriculteurs pour établir un nouveau système médical coopératif rural axé principalement sur la mutualisation des grandes maladies. En 2009, la Chine a pris une décision stratégique majeure pour approfondir la réforme du système médical et de santé et a établi le statut du nouveau système coopératif rural comme système de base de l'assurance médicale rurale. Le nouveau système médical coopératif rural est un système d'entraide médicale pour les agriculteurs, organisé, guidé et soutenu par le gouvernement, auquel les agriculteurs participent volontairement, et financé par des contributions individuelles, un soutien collectif et un financement gouvernemental, avec un accent sur la mutualisation des grandes maladies. Les fonds sont collectés par des paiements individuels, un soutien collectif et un financement gouvernemental."
CHI_Rural_planning_and_construction_and_development_of_rural_industries:0 "Planification et construction rurales et développement des industries rurales"
CHI_Rural_planning_and_construction_and_development_of_rural_industries_desc:0 "Les industries rurales et agricoles ont été les premières à entrer dans la réforme et l'ouverture, mais elles se développent aujourd'hui le plus lentement et accusent un retard. Nous devons changer la situation actuelle de séparation entre la planification urbaine et rurale, intégrer le développement économique et social urbain-rural dans la planification macroéconomique du gouvernement, coordonner le développement urbain-rural, promouvoir les liens entre les zones urbaines et rurales et atteindre une prospérité commune. Investir davantage dans les infrastructures rurales permettra de fournir plus de ressources humaines et matérielles aux villes. Bien que le modèle de développement dual présente de nombreux inconvénients, participer à une industrialisation et une urbanisation à grande échelle en ville est la meilleure issue pour la population agricole. Soutenir l'urbanisation par l'industrialisation, promouvoir l'industrialisation par l'urbanisation, accélérer le processus d'industrialisation et d'urbanisation, favoriser le transfert de la main-d'œuvre rurale vers les industries secondaires et tertiaires, et concentrer la population rurale dans les villes est la voie de développement de la plupart des pays, et nous devons également accélérer l'expansion de l'emploi urbain."
CHI_Project_Hope:0 "Projet Espoir"
CHI_Project_Hope_desc:0 "Nous avons trop peu investi dans les zones rurales, si bien que de nombreux enfants ruraux ne peuvent même pas garantir leur droit à l'éducation. Nous devons augmenter les dépenses d'éducation pour garantir que les enfants ruraux puissent également recevoir une éducation. Le Parti et l'État ont l'obligation de faire briller la lumière de l'éducation obligatoire sur chaque enfant chinois, successeur de notre grande cause socialiste."
CHI_Abolish_agricultural_tax:0 "Supprimer la taxe agricole"
CHI_Abolish_agricultural_tax_desc:0 "Le 22 février 2006, le Bureau national des postes a émis un timbre commémoratif d'une valeur de 80 centimes, intitulé « Abolition complète de la taxe agricole », pour célébrer l'abrogation des « Règlements sur la taxe agricole » à partir du 1er janvier 2006. La taxe imposée aux agriculteurs pendant deux mille ans en Chine a finalement été éliminée sous la direction éclairée de notre parti. En tant que mesure importante du gouvernement pour résoudre les « trois problèmes ruraux », l'abolition de la taxe agricole réduit non seulement le fardeau des agriculteurs, augmente leurs droits civiques, incarne le principe de « justice » dans la fiscalité moderne, mais s'aligne également sur la tendance de « l'industrie soutenant l'agriculture ». Depuis 1992, la réforme et l'ouverture de la Chine ont officiellement réformé le système agricole. L'abolition de la taxe agricole, qui a duré mille ans, en 2006 a marqué le début d'une nouvelle période de réforme et d'ouverture en Chine."
CHI_Regional_coordinated_development:0 "Développement régional coordonné"
CHI_Regional_coordinated_development_desc:0 "La stratégie de développement régional coordonné est l'une des « cinq stratégies coordonnées » proposées par la troisième session plénière du 16e Comité central du PCC et présentée par le Premier ministre Wen Jiabao. Ses contenus spécifiques sont les suivants : promouvoir activement le développement de la région occidentale, revitaliser les anciennes bases industrielles comme le Nord-Est, encourager la montée de la région centrale, inciter la région orientale à prendre les devants dans le développement, continuer à exploiter les avantages et l'enthousiasme de chaque région, et inverser progressivement la tendance à l'élargissement des écarts de développement régional grâce à l'amélioration des mécanismes de marché, de coopération, d'assistance mutuelle et de soutien, pour former un nouveau modèle de promotion mutuelle, d'avantages complémentaires et de développement commun entre l'Est, le Centre et l'Ouest."
CHI_eastern_region_leading_development:0 "Stratégie de développement de pointe de la région orientale"
CHI_eastern_region_leading_development_desc:0 "L'ouverture de la zone économique spéciale de Shenzhen dans l'est de notre pays dans les années 1980 a conduit à la réforme et au développement du delta de la rivière des Perles ; le développement et l'ouverture de la nouvelle zone de Pudong dans les années 1990 ont conduit à la réforme et au développement du delta du Yangtsé et du bassin du Yangtsé. Le delta de la rivière des Perles et le delta du Yangtsé sont rapidement devenus les deux « pôles » les plus dynamiques de l'économie chinoise. Le développement de pointe de la région orientale peut soutenir plus efficacement le développement de la région occidentale, la montée de la région centrale et la revitalisation du Nord-Est, et promouvoir une situation favorable d'interaction entre l'Est, le Centre et l'Ouest et un développement coordonné de l'économie nationale."
CHI_The_rise_of_central:0 "L'essor de la région centrale"
CHI_The_rise_of_central_desc:0 "La région centrale comprend six provinces : Shanxi, Anhui, Jiangxi, Henan, Hubei et Hunan, avec une superficie de 1,028 million de kilomètres carrés, soit 10,7 % de la superficie totale du pays. La région centrale joue un rôle stratégique pivot dans le schéma national de développement régional. Promouvoir l'essor de la région centrale est une composante essentielle de la mise en œuvre des quatre grands schémas régionaux et des « trois grandes stratégies », une nécessité objective pour construire un marché national unifié et promouvoir un développement interactif et coordonné entre les régions orientale, centrale et occidentale, une mesure stratégique pour optimiser la structure économique nationale et maintenir un développement économique soutenu et sain, et une exigence inévitable pour garantir la réalisation opportune de l'objectif de construire une société modérément prospère à tous les égards."
CHI_Northeast_Revitalization:0 "Stratégie de revitalisation du Nord-Est"
CHI_Northeast_Revitalization_desc:0 "Le 3 août 2003, Wen Jiabao, membre du Comité permanent du Bureau politique du Comité central du PCC et Premier ministre du Conseil des affaires d'État, a présidé une réunion de haut niveau à Changchun pour revitaliser les anciennes industries du Nord-Est. Il a souligné que la mise en œuvre de la stratégie de développement de l'Ouest, l'accélération du développement de la région orientale pour atteindre une société modérément prospère et la modernisation à tous les égards, le soutien au Nord-Est et à d'autres anciennes bases industrielles pour accélérer l'ajustement et la transformation, la mise en œuvre de l'interaction entre l'Est et l'Ouest, la stimulation de la région centrale et la promotion du développement coordonné de l'économie régionale sont les grands schémas stratégiques établis par le Comité central du PCC pour la construction de la modernisation de notre pays. Avec de nouvelles idées, de nouveaux systèmes, de nouveaux mécanismes et de nouvelles méthodes, nous trouverons une nouvelle voie pour accélérer la revitalisation des anciennes bases industrielles et mener une « campagne de Liaoshen » au nouveau siècle."
CHI_development_of_western_region:0 "Stratégie de développement de la région occidentale"
CHI_development_of_western_region_desc:0 "Le programme de développement de l'Ouest couvre 12 provinces, régions autonomes et municipalités : Sichuan, Shaanxi, Gansu, Qinghai, Yunnan, Guizhou, Chongqing, Guangxi, Mongolie intérieure, Ningxia, Xinjiang et Tibet. La région occidentale couvre une superficie de 6,85 millions de kilomètres carrés, soit 71,4 % du total national. Fin 2002, la population était de 367 millions, soit 25 % du total national. Elle représente environ 15 % du PIB du pays. La région occidentale est riche en ressources naturelles, a un grand potentiel de marché et est stratégiquement importante. Cependant, en raison de facteurs naturels, historiques et sociaux, le développement économique de la région occidentale est relativement en retard, avec un PIB par habitant équivalant à seulement deux tiers de la moyenne nationale et moins de 40 % de la moyenne de la région orientale. Il est urgent d'accélérer le rythme de la réforme, de l'ouverture et de la modernisation."
CHI_Coordinate_economic_and_social_development:0 "Coordonner le développement économique et social"
CHI_Coordinate_economic_and_social_development_desc:0 "Le progrès de toute société résulte du développement coordonné de l'économie, de la politique et de la culture. L'économie est le fondement, la politique est la garantie et la culture est le précurseur. Les trois sont étroitement liés, se pénétrant mutuellement, se complétant et s'unifiant dans le développement de la société. Le développement est la priorité absolue de notre parti pour gouverner et revitaliser le pays. La croissance économique est une base importante pour le développement. Nous devons vigoureusement développer l'économie nationale avec la propriété publique comme pilier principal."
CHI_Strengthening_State_Owned_Businesses:0 "Renforcer les entreprises d'État"
CHI_Strengthening_State_Owned_Businesses_desc:0 "Les entreprises d'État sont les principaux vecteurs de l'économie d'État. La nature des entreprises d'État est celle d'entreprises appartenant à l'ensemble du peuple. Les entreprises appartenant à l'ensemble du peuple sont en réalité des entreprises dont les moyens de production sont conjointement détenus par tous les citoyens. Ainsi, la nature des entreprises d'État est celle d'entreprises dont les moyens de production sont collectivement détenus par le peuple. Les entreprises d'État incarnent concrètement la propriété publique socialiste. Leur succès ou leur échec est lié à l'essor ou au déclin de la voie du socialisme à caractéristiques chinoises. Nous devons prendre les entreprises d'État comme point de départ pour mener le développement vigoureux de l'économie de marché socialiste à caractéristiques chinoises."
CHI_Chinese_High_Speed_Rail_System:0 "China State Railway Group Co., Ltd."
CHI_Chinese_High_Speed_Rail_System_desc:0 "China National Railway Group Co., Ltd. est une entreprise entièrement détenue par l'État, établie conformément à la loi sur les sociétés de la République populaire de Chine et gérée par le gouvernement central avec l'approbation du Conseil des affaires d'État. Si vous voulez vous enrichir, vous devez d'abord construire des routes. Un grand pays avec un vaste territoire comme la Chine a besoin d'un système de transport solide, efficace et étendu pour soutenir son développement économique rapide. Nous devons nous appuyer sur China National Railway Group Co., Ltd. pour construire le réseau de transport ultra-moderne de la Chine."
CHI_China_Baowu_Steel_Group_Corporation_Limited:0 "China Baowu Steel Group Corporation Limited"
CHI_China_Baowu_Steel_Group_Corporation_Limited_desc:0 "China Baowu Steel Group Co., Ltd. est une entreprise clé détenue par l'État, directement gérée par le gouvernement central, avec son siège à Shanghai. La construction nationale nécessite une grande quantité d'acier et d'autres matières premières métalliques. Notre pays est le plus grand producteur d'acier au monde, mais il doit encore développer vigoureusement l'industrie sidérurgique. Le 22 septembre 2016, la Commission de supervision et d'administration des actifs d'État du Conseil des affaires d'État a annoncé, avec l'approbation du Conseil des affaires d'État, que Baosteel Group Co., Ltd. et Wuhan Iron and Steel (Group) Corporation procéderont à une réorganisation conjointe."
CHI_State_Grid_Corporation:0 "State Grid Corporation of China"
CHI_State_Grid_Corporation_desc:0 "State Grid Corporation of China a été créée le 29 décembre 2002. C'est une entreprise entièrement détenue par l'État, directement gérée par le gouvernement central, établie conformément aux dispositions de la loi sur les sociétés. Les responsabilités de State Grid Corporation of China sont de construire un réseau énergétique, de garantir la sécurité énergétique nationale et de servir une meilleure vie pour le peuple. C'est une entreprise clé d'État de grande envergure, essentielle à la lifeline de l'économie nationale et à la sécurité énergétique nationale. L'activité principale de l'entreprise consiste à investir, construire et exploiter des réseaux électriques, et elle assume la mission fondamentale de garantir un approvisionnement en électricité sûr, économique, propre et durable."
CHI_Coordinating_Development_of_Human_and_Nature_Harmoniously:0 "Coordonner le développement harmonieux entre l'homme et la nature"
CHI_Coordinating_Development_of_Human_and_Nature_Harmoniously_desc:0 "Le secrétaire général Hu Jintao a souligné dans son important discours à l'École centrale du Parti que le premier principe de la vision scientifique du développement est le développement, le noyau est axé sur l'humain, l'exigence de base est un développement global, coordonné et durable, et la méthode fondamentale est la coordination et l'équilibre. Un développement global, coordonné et durable est une exigence inhérente de la vision scientifique du développement. Le développement durable consiste à promouvoir l'harmonie entre l'homme et la nature, à réaliser une coordination entre le développement économique, la population, les ressources et l'environnement, à adhérer à une voie de développement civilisé avec une production développée, une vie prospère et une écologie saine, et à garantir un développement durable de génération en génération. Coordonner le développement harmonieux entre l'homme et la nature est une question cruciale qui doit être abordée pour mettre en œuvre pleinement la vision scientifique du développement et atteindre un développement durable."
CHI_Socialist_concept_of_honor_and_disgrace:0 "Concept socialiste de l'honneur et du déshonneur"
CHI_Socialist_concept_of_honor_and_disgrace_desc:0 "Le 4 mars 2006, le secrétaire général Hu Jintao a proposé, lors d'une discussion conjointe de la Ligue démocratique et du Parti progressiste démocratique chinois à la 4e session du 10e Comité national de la Conférence consultative politique du peuple chinois, que nous devions guider les larges masses de cadres et le peuple, en particulier les jeunes, à établir un concept socialiste de l'honneur et du déshonneur avec les huit honneurs et huit déshonneurs comme contenu principal : être fier d'aimer la patrie et honteux de nuire à la patrie ; être fier de servir le peuple et honteux de trahir le peuple ; être fier de défendre la science et honteux de l'ignorance ; être fier du travail acharné et honteux de la paresse ; être fier de la solidarité et de l'entraide et honteux de nuire aux autres pour un gain personnel ; être fier d'être honnête et digne de confiance et honteux d'agir sans scrupules pour le profit ; être fier de respecter les lois et la discipline et honteux de violer les lois et la discipline ; être fier du travail ardu et honteux de l'arrogance et de l'extravagance."
CHI_harmonious_society:0 "Société harmonieuse"
CHI_harmonious_society_desc:0 "Construire une société socialiste harmonieuse est une tâche stratégique majeure proposée par notre Parti au nouveau siècle et à une nouvelle étape, sur la base de la disposition globale de la cause du socialisme à caractéristiques chinoises et de la situation générale de la construction d'une société modérément prospère à tous les égards. Depuis le 16e Congrès national du PCC, le camarade Hu Jintao a analysé de manière exhaustive les opportunités et les défis auxquels le développement de notre pays est confronté, sur la base des changements dans la situation internationale et nationale, et a exposé de manière approfondie la signification, l'idéologie directrice, les objectifs et tâches, les principes de travail et les déploiements majeurs de la construction d'une société socialiste harmonieuse. Il a présenté une série de nouvelles idées, points de vue et conclusions, enrichissant et développant la théorie marxiste sur la construction sociale socialiste. Les réflexions du camarade Hu Jintao sur la construction d'une société socialiste harmonieuse constituent une partie importante de la vision scientifique du développement et ont une signification directrice importante et de grande portée pour construire une société modérément prospère à tous les égards, accélérer l'avancement de la modernisation socialiste et réaliser le rêve chinois de la grande renaissance de la nation chinoise."
CHI_Developing_the_photovoltaic_industry:0 "Développer l'industrie photovoltaïque"
CHI_Developing_the_photovoltaic_industry_desc:0 "Le 19 décembre 2012, le Premier ministre Wen Jiabao a présidé une réunion exécutive du Conseil des affaires d'État pour étudier et déterminer les mesures politiques visant à promouvoir le développement sain de l'industrie photovoltaïque. L'industrie photovoltaïque est une source d'énergie propre de haute qualité. 76 % des terres de notre pays bénéficient d'un ensoleillement, et la distribution des ressources en énergie lumineuse est relativement uniforme. Comparée à l'hydroélectricité, l'énergie éolienne, l'énergie nucléaire, etc., la production d'énergie solaire n'émet pas de polluants et ne produit pas de bruit, et la technologie d'application est mature, sûre et fiable. Le développement d'une énergie verte propre est non seulement une exigence inhérente de la vision scientifique du développement, mais aussi une cause séculaire qui bénéficiera aux générations futures."
CHI_Coordinate_domestic_development_and_opening_up:0 "Coordonner le développement domestique et l'ouverture"
CHI_Coordinate_domestic_development_and_opening_up_desc:0 "La Chine ne suivra pas la voie impérialiste de l'agression étrangère. L'histoire moderne, marquée par près d'un siècle de sang et de larmes, nous a rendus plus attachés à la paix et plus opposés à la guerre que tout autre peuple. Seul un environnement extérieur stable peut apporter des opportunités de développement stables à long terme. Coordonner l'environnement interne et externe de notre grande patrie et créer des relations étrangères harmonieuses et amicales nous permettront d'avancer plus loin et plus fermement sur la voie du socialisme à caractéristiques chinoises."
CHI_2008_financial_crisis_CHI:0 "Vagues tumultueuses"
CHI_2008_financial_crisis_CHI_desc:0 "Le monde capitaliste ne peut finalement pas échapper aux crises économiques périodiques. Les capitalistes bedonnants de Wall Street sont prêts à s'enterrer eux-mêmes et leurs complices dans des tombes pour un peu de profit. En tant que pays socialiste, nous n'avons pas à nous soucier de leurs combines financières. Cependant, nos exportations manufacturières, dont nous dépendons, ont subi un coup fatal car les acheteurs étrangers ont fait faillite dans la crise financière. C'est la plus grande crise que nous ayons rencontrée depuis la réforme et l'ouverture. Le Parti et le pays doivent gérer cette crise avec prudence."
CHI_a_package_Financial_plan:0 "Plan financier global"
CHI_a_package_Financial_plan_desc:0 "Le 5 novembre 2008, le Premier ministre Wen Jiabao a présidé une réunion exécutive du Conseil des affaires d'État pour étudier et déployer des mesures visant à élargir davantage la demande intérieure et à promouvoir une croissance économique stable et rapide. Lors de la réunion, un plan de relance économique axé sur l'investissement national a été résumé. Selon les estimations préliminaires, la mise en œuvre de ces dix mesures nécessitera un investissement d'environ 4 000 milliards de yuans d'ici la fin de 2010."
CHI_Shantytown_renovation:0 "Rénovation des bidonvilles"
CHI_Shantytown_renovation_desc:0 "De nombreuses zones urbaines en Chine ont un héritage historique de logements concentrés et délabrés, de maisons vétustes et de cours dégradées. La distance entre les ménages est extrêmement réduite, les installations publiques sont mal équipées, et il existe des risques évidents pour la sécurité publique en matière de protection contre les incendies, de déplacements, de production et de vie quotidienne. Investir dans l'amélioration de ces zones délabrées offre non seulement une direction pour l'écoulement de la surcapacité de production, mais améliore également efficacement le niveau de vie des gens. Pour la rénovation des bidonvilles, le gouvernement fournit un soutien en termes d'investissement fiscal, de terrains de construction, de taxes, de frais et de crédit. Entre 2007 et 2011, le gouvernement chinois a alloué un total de 73 milliards de yuans en subventions, dont plus de 90 % ont été investis dans des zones financièrement défavorisées du centre et de l'ouest de la Chine."
CHI_Accelerate_infrastructure_construction:0 "Accélérer la construction d'infrastructures"
CHI_Accelerate_infrastructure_construction_desc:0 "Dans les années 1930, en réponse à une dépression économique sans précédent, le président américain Roosevelt a mis en œuvre le célèbre « New Deal », dont l'une des politiques les plus importantes était la construction d'infrastructures à grande échelle menée par le gouvernement. Ces projets d'infrastructure ont non seulement augmenté l'emploi et les revenus des gens, mais ont également jeté une base solide pour le développement ultérieur de l'économie américaine. Le plan de relance économique de « 4 000 milliards » devrait stimuler la croissance économique d'environ 1 point de pourcentage chaque année, avec près de la moitié des fonds investis dans les infrastructures de transport et la construction de réseaux électriques urbains et ruraux. Cela permettra non seulement à notre pays de se libérer plus rapidement des effets négatifs de la crise financière mondiale, mais aussi d'élargir la demande intérieure et de stimuler le développement de l'économie et de la consommation en Chine. En conformité avec le plan du gouvernement central, les gouvernements provinciaux et municipaux à travers le pays se sont concentrés sur les projets d'infrastructure et ont utilisé les investissements pour stimuler la croissance économique. En 2008, l'investissement total de la société dépassera 16 000 milliards de yuans."
CHI_Post_disaster_reconstruction:0 "Reconstruction post-catastrophe"
CHI_Post_disaster_reconstruction_desc:0 "Le tremblement de terre de Wenchuan a détruit de nombreuses villes de l'ouest du Sichuan, causant des souffrances à d'innombrables compatriotes et affectant même les dix provinces environnantes. Reconstruire Wenchuan et sauver les habitants des zones sinistrées est non seulement la mission de notre parti et de notre pays, mais aussi un moyen important de concentrer les ressources sociales et de renforcer la cohésion sociale. La grande quantité de matériaux nécessaires pour les secours et la reconstruction sera entièrement achetée par le gouvernement auprès de sources nationales. Les « Règlements sur la récupération et la reconstruction post-tremblement de terre de Wenchuan » ont été adoptés lors de la 11e réunion exécutive du Conseil des affaires d'État le 4 juin 2008, et sont promulgués et entrent en vigueur à la date de promulgation."
CHI_expend_welfare:0 "Augmenter les dépenses de bien-être"
CHI_expend_welfare_desc:0 "La production est toujours relativement surabondante. La raison fondamentale est que la capacité de consommation est insuffisante pour répondre à la demande. Nous devons augmenter les dépenses pour le bien-être des citoyens et accroître la demande intérieure. Selon les statistiques, sur les 4 000 milliards de yuans d'investissement, les investissements dans les projets de bien-être, à savoir l'éducation, la santé, la culture et d'autres initiatives sociales, ont représenté 44 % des dépenses totales."
CHI_Made_in_China:0 "§Y« Made in China »§!"
CHI_Made_in_China_desc:0 "Autrefois, notre pays était connu comme l'usine du monde, assumant un tiers de la production manufacturière mondiale, offrant des fonds et des opportunités sans précédent pour le développement national. Cependant, ce modèle de production dépendant des exportations peut provoquer de grandes catastrophes pour notre économie en cas d'erreurs dans la chaîne de vente. La crise financière de 2008 en est le meilleur exemple. Sous la direction éclairée du Parti et de l'État, nous sommes sortis de l'impact de la crise économique mondiale capitaliste et sommes passés d'un pays usine acceptant passivement les commandes à une puissance manufacturière capable d'ajuster indépendamment la production. Que la marque « Made in China » soit apposée sur nos produits, et notre nom sera connu dans le monde entier !"
CHI_RMB:0 "RMB"
CHI_RMB_desc:0 "La souveraineté monétaire est un facteur important affectant le développement économique. Contrairement aux autres grandes économies, notre souveraineté monétaire est toujours entre nos mains, maintenant une certaine distance avec le dollar américain, ce qui nous donne plus de marge pour mettre en œuvre une politique monétaire. Nous devons nous souvenir de la tragédie de l'économie japonaise, qui était autrefois à son apogée au siècle dernier, mais a été stoppée par l'Accord du Plaza. Nous devons utiliser une souveraineté monétaire absolue et des politiques monétaires et fiscales flexibles pour sauvegarder le développement national."
CHI_prudent_monetary_policy:0 "Politique monétaire prudente"
CHI_prudent_monetary_policy_desc:0 "La politique monétaire prudente consiste à viser la stabilité de la monnaie, à équilibrer correctement la relation entre la prévention des risques financiers et le soutien à la croissance économique, à maintenir une croissance modérée de l'offre monétaire tout en améliorant la qualité des prêts, et à soutenir le développement soutenu, rapide et sain de l'économie nationale. Le paquet de mesures a injecté un montant énorme d'investissements dans le marché, ce qui entraînera inévitablement de l'inflation et d'autres conséquences néfastes tout en stimulant le développement économique. Permettre à la banque centrale de contrôler l'émission de monnaie tout en réduisant le taux de réserves obligatoires peut atténuer l'impact des fonds injectés."
CHI_North_South_Water_Transfer:0 "Projet de transfert d'eau du Sud au Nord"
CHI_North_South_Water_Transfer_desc:0 "Pour atténuer le grave déséquilibre de l'approvisionnement en eau entre le nord et le sud de notre pays, nous devons investir dans une série de projets tels que des canaux et des réservoirs pour détourner l'eau vers les zones clés en déficit hydrique. Cependant, cela sera une entreprise coûteuse, nécessitant le déplacement de centaines de milliers de personnes et une construction à long terme avec un investissement élevé."
CHI_East_Line_Projec_South_to_North_Water_Diversion_Project:0 "Projet de la ligne Est du transfert d'eau du Sud au Nord"
CHI_East_Line_Projec_South_to_North_Water_Diversion_Project_desc:0 "Le projet de la ligne Est prévoit de détourner l'eau du cours principal du Yangtsé près de Yangzhou, dans la province du Jiangsu, et d'utiliser le Grand Canal de Pékin-Hangzhou et ses rivières parallèles pour transporter l'eau, en connectant le lac Hongze, le lac Luoma, les quatre lacs du Sud et le lac Dongping, qui sert de réservoir de régulation. Après avoir pompé l'eau dans le lac Dongping étape par étape par des stations de pompage, l'eau est divisée en deux routes. Une route coule vers le nord à travers le fleuve Jaune, puis vers Tianjin par gravité. La ligne principale de détournement de l'eau du Yangtsé au réservoir de Beidagang à Tianjin mesure environ 1 156 kilomètres de long ; l'autre route coule vers l'est à travers la nouvelle ligne de détournement d'eau de la région de Jiaodong pour se connecter au canal Huangjiqing et approvisionner la région de Jiaodong en eau."
CHI_Central_Line_Projec_of_South_to_North_Water_Diversion:0 "Projet de la ligne centrale du transfert d'eau du Sud au Nord"
CHI_Central_Line_Projec_of_South_to_North_Water_Diversion_desc:0 "Le projet de la ligne centrale du transfert d'eau du Sud au Nord est un projet de détournement d'eau qui détourne l'eau du réservoir de Danjiangkou, situé dans les cours moyen et supérieur de la rivière Han, le plus grand affluent du Yangtsé, et couvre les deux provinces du Hubei et du Henan. Le canal principal est creusé à la tête du projet dans le comté de Xichuan, province du Henan, sur la rive est du réservoir de Danjiangkou. Le canal est creusé le long du bord central et occidental de la plaine de Chine du Nord à travers le col de Fangcheng, le bassin versant entre le Yangtsé et la rivière Huaihe. Le canal traverse le fleuve Jaune par un tunnel, coule vers le nord le long du côté ouest de la voie ferrée Pékin-Guangzhou, et atteint le lac Tuancheng dans le Palais d'Été à Pékin. Après la mise en œuvre du projet de la ligne centrale du transfert d'eau du Sud au Nord, le volume annuel moyen de détournement d'eau au stade initial est de 9,5 milliards de mètres cubes. À un stade ultérieur, l'échelle du détournement d'eau sera encore élargie selon les besoins, ce qui peut résoudre efficacement le problème de pénurie d'eau dans les zones bénéficiaires et améliorer considérablement l'environnement écologique."
CHI_Resettlement:0 "Réinstallation"
CHI_Resettlement_desc:0 "Le projet de conservation de l'eau de Danjiangkou a commencé sa construction en 1958. À une époque de pénurie de matériaux, toutes les forces disponibles ont été mobilisées pour investir. Cependant, il a été forcé de s'arrêter en 1962 en raison de graves problèmes de qualité. Nous devons maintenant relancer la construction de ce projet. Tout d'abord, nous devons déplacer les résidents de la zone vers d'autres régions. Les principales zones d'inondation du réservoir et de réinstallation sont le comté de Xichuan, ville de Nanyang, province du Henan, et la ville de Danjiangkou, le comté de Yun, le comté de Yunxi et le district de Zhangwan, province du Hubei."
CHI_Danjiangkou_Reservoir:0 "Réservoir de Danjiangkou"
CHI_Danjiangkou_Reservoir_desc:0 "Le réservoir de Danjiangkou est entouré de montagnes, avec un climat adapté, un air frais et un ensoleillement optimal. L'eau près du barrage de Danjiangkou est transparente, la surface de l'eau est large et le vent est calme, ce qui confère au réservoir des avantages complets tels que le contrôle des inondations, la production d'électricité, l'irrigation, la navigation, l'aquaculture et le tourisme. La tête du projet de transfert d'eau du Sud au Nord, un projet national clé, est située à Taocha, comté de Xichuan, ville de Nanyang, province du Henan. Une fois entièrement achevé, le réservoir enverra de l'eau de la rivière Han vers la Chine du Nord à un débit de 500 mètres cubes par seconde."
CHI_Water_conveyance_engineering:0 "Ingénierie de transport de l'eau"
CHI_Water_conveyance_engineering_desc:0 "Transporter l'eau du sud vers le nord nécessite des projets complexes tels que le projet de traversée du fleuve Jaune, des puits de détournement d'eau, des tunnels de transfert d'eau, des aqueducs en forme de U et l'élévation des barrages, et cela est également très coûteux."
CHI_Connect_to_Beijing:0 "Connecter à Pékin"
CHI_Connect_to_Beijing_desc:0 "Nous avons enfin acheminé l'eau jusqu'au cœur du nord - la grande capitale, Pékin. Ce n'est pas seulement le point final du projet de la ligne centrale, mais aussi le lieu de résidence de nombreux dignitaires politiques et commerciaux. Ils n'auront plus à craindre de subir la même pénurie d'eau que les gens ordinaires, ce qui nous apportera un soutien considérable."
CHI_Building_water_saving_society:0 "Construire une société économe en eau"
CHI_Building_water_saving_society_desc:0 "La contradiction fondamentale de la pénurie d'eau dans notre pays doit être résolue en construisant une société économe en eau. En construisant une société économe en eau, nous pouvons promouvoir la transformation du mode de croissance économique, améliorer l'environnement écologique et renforcer la capacité de développement durable de l'économie et de la société. Par conséquent, la signification de la construction d'une société économe en eau est tout aussi importante que celle du projet des trois gorges et du projet de transfert d'eau du Sud au Nord. En 2000, la « Proposition du Comité central du PCC sur la formulation du dixième plan quinquennal pour le développement économique et social national » a proposé pour la première fois de « construire une société économe en eau ». En 2002, le Comité permanent du Congrès national du peuple a clairement stipulé la construction d'une société économe en eau dans la version révisée de la loi sur l'eau."
CHI_Investigating_new_viruses:0 "Enquêter sur les nouveaux virus"
CHI_Investigating_new_viruses_desc:0 "Selon le gouvernement local, un virus présumé de type grippal a récemment apparu à Guangdong et dans d'autres endroits. La province du Guangdong a envoyé une équipe d'experts à Zhongshan pour enquêter, et le 23 janvier 2003, a publié un rapport d'enquête à toutes les unités de santé et médicales de la province, exigeant des unités concernées de prêter attention et de s'engager sérieusement dans la prévention et le contrôle de la maladie. Bien que la situation ne soit pas claire, nous devons garantir que les deux sessions se déroulent sans encombre et ne pas laisser un petit virus affecter des événements majeurs."
CHI_Announcement:0 "Annonce"
CHI_Announcement_desc:0 "Nous ne devons pas bloquer les informations. Cela va à l'encontre des exigences essentielles de notre gouvernance et de la renaissance nationale. L'évasion et la dissimulation ne peuvent pas résoudre fondamentalement le problème. Divulguer la situation épidémique au public peut causer de l'anxiété et de la panique, mais c'est une réalité que notre parti et notre pays doivent affronter."
CHI_News_blackout:0 "Bloquer les informations"
CHI_News_blackout_desc:0 "Quel mal quelques virus peuvent-ils faire ? Au pire, ils provoqueront quelques éternuements. Nous ne pouvons pas laisser la stabilité durement acquise être gâchée à cause d'une si petite affaire. Il y a de meilleurs endroits pour investir nos ressources politiques."
CHI_Notify_the_World_Health_Organization:0 "Informer l'Organisation mondiale de la santé"
CHI_Notify_the_World_Health_Organization_desc:0 "L'Organisation mondiale de la santé a remarqué la propagation de la maladie. Nous devons les informer dès que possible et demander une assistance technique internationale."
CHI_Stable_public_sentiment:0 "Stabiliser l'opinion publique"
CHI_Stable_public_sentiment_desc:0 "Lutter contre la maladie est une bataille difficile et une guerre d'attaque et de défense. Nous devons apaiser le peuple et mobiliser les forces sociales pour combattre ce virus maléfique."
CHI_Emergency_measures:0 "Mesures d'urgence"
CHI_Emergency_measures_desc:0 "Malheureusement, ni notre communauté médicale ni l'Organisation mondiale de la santé n'ont pu développer des mesures efficaces pour prévenir et contrôler ce virus. Nous ne pouvons prendre que des mesures d'urgence telles que l'isolement et la désinfection dans les endroits où la maladie est détectée afin de bloquer la voie de propagation du virus."
CHI_Ban_the_Quannengshen:0 "Interdire le Dieu Tout-Puissant"
CHI_Ban_the_Quannengshen_desc:0 "Le Dieu Tout-Puissant est une organisation sectaire fondée par Zhao Weishan sous le couvert du christianisme. Également appelée « Éclair de l'Est » et « Dieu réel », elle a été légalement identifiée comme une secte par le gouvernement chinois en 1995. La secte du « Dieu Tout-Puissant » a une histoire de 30 ans en Chine continentale et a utilisé 13 noms différents. Elle a été extrêmement nuisible au peuple chinois. Il est temps d'éradiquer tous ces insectes."
CHI_propaganda_of_Anti_Cult_propaganda:0 "Propagande anti-sectes"
CHI_propaganda_of_Anti_Cult_propaganda_desc:0 "S'opposer aux sectes est non seulement la responsabilité de notre parti et de notre pays, mais aussi celle de chaque personne qui aime la vie. Nous devons renforcer la propagande anti-sectes et éduquer le peuple et les écoliers à identifier les diverses formes de sectes. Nous croyons qu'un jour, nous pourrons éliminer complètement ces rats sombres et humides de la société, et la grande cause du socialisme à caractéristiques chinoises triomphera sûrement de tous les monstres et démons."
CHI_achievement:0 "Grand plan"
CHI_achievement_desc:0 "Notre grande cause du socialisme à caractéristiques chinoises doit bien sûr couvrir tous les aspects. Après une planification à long terme dans les années 1990, nous accomplirons de nombreux exploits qui appartiennent non seulement à la Chine, mais aussi à toute l'humanité, au nouveau siècle, comme prévu. Notre cause prospère et notre avenir est extrêmement prometteur !"
CHI_Chinese_nation:0 "Identité nationale chinoise"
CHI_Chinese_nation_desc:0 "Le terme « nation chinoise » a été proposé pour la première fois par Liang Qichao dans son article « Sur la grande tendance des changements dans la pensée académique chinoise » en 1902. Cependant, en tant qu'entité nationale indépendante, elle existe depuis des milliers d'années. Pendant des millénaires, les divers groupes ethniques qui ont prospéré sur le sol chinois se sont constamment mélangés et convergés. Surtout depuis que la Chine est devenue un pays multiethnique unifié sous les dynasties Qin et Han, le concept de grande unité est profondément enraciné dans le cœur du peuple. Les divers groupes ethniques vivent en distribution mixte, sont économiquement interdépendants, culturellement inclusifs et émotionnellement proches les uns des autres, formant finalement une nation chinoise diverse et unifiée. Sous la direction du grand Parti communiste chinois, chaque groupe ethnique sur notre terre sera étroitement uni comme les graines d'une grenade, et avancera résolument vers la grande cause de la renaissance de la nation chinoise."
CHI_History_and_Future:0 "Histoire et avenir"
CHI_History_and_Future_desc:0 "Le secrétaire général Hu Jintao a proposé « se souvenir du passé et apprendre de lui » lors de la réunion commémorant le 60e anniversaire de la victoire de la guerre de résistance du peuple chinois contre l'agression japonaise et de la guerre mondiale anti-fasciste. Nous soulignons que se souvenir de l'histoire ne vise pas à perpétuer la haine, mais à tirer des leçons de l'histoire et à regarder vers l'avenir. Le Japon est notre voisin. Bien que l'impérialisme fasciste japonais ait autrefois lancé une guerre d'agression brutale contre la Chine, tant que le Japon est prêt à embrasser la paix, nous devons également travailler avec eux pour maintenir la paix durement acquise."
CHI_Friends_from_afar:0 "Amis de loin"
CHI_Friends_from_afar_desc:0 "Taïwan est séparée de l'étreinte de notre grande patrie depuis de nombreuses années. En raison des conflits idéologiques et des intérêts des parties impliquées, la question de Taïwan a toujours été un imbroglio. Heureusement, le dirigeant actuel de la région de Taïwan est un homme ayant une vision d'ensemble qui soutient toujours le principe d'une seule Chine. Nous devons accueillir son arrivée avec courtoisie."
CHI_The_Four_Megaprojects_of_China_in_New_Century:0 "Les quatre mégaprojets de la Chine au nouveau siècle"
CHI_The_Four_Megaprojects_of_China_in_New_Century_desc:0 "Notre cause socialiste peut créer des miracles. Sous la direction éclairée du Parti, le pouvoir du peuple est sans limites et peut construire des projets miraculeux dans l'histoire humaine. Pendant le 15e plan quinquennal, les quatre projets que notre pays a priorisés pour le développement et la construction, à savoir le chemin de fer Qinghai-Tibet, le projet de transmission de gaz d'Ouest en Est, le projet de transmission d'électricité d'Ouest en Est et le projet de transfert d'eau du Sud au Nord, ont été appelés les « quatre mégaprojets de la Chine au nouveau siècle ». À l'exception du projet de transfert d'eau du Sud au Nord, les trois autres sont également des projets clés dans le développement de la région occidentale."
CHI_Qinghai_Tibet_Railway_Completed:0 "Le chemin de fer Qinghai-Tibet est entièrement ouvert à la circulation"
CHI_Qinghai_Tibet_Railway_Completed_desc:0 "La région tibétaine est la région la plus lente à se développer et la plus difficile à construire dans notre pays depuis la réforme et l'ouverture. Jusqu'à présent, il n'y a pas de chemin de fer digne de ce nom qui puisse atteindre la capitale, Lhassa. Comment pourrions-nous avancer dans notre grand voyage du socialisme à caractéristiques chinoises sans nos compatriotes tibétains ? Nous conquerrons le plateau Qinghai-Tibet et le toit du monde, afin que le peuple tibétain puisse également embrasser la grande patrie ! Construisons des chemins de fer jusqu'au ciel !"
CHI_project_of_natural_gas_transmission_from_West_to_East:0 "Projet de transmission de gaz naturel d'Ouest en Est"
CHI_project_of_natural_gas_transmission_from_West_to_East_desc:0 "Il y a d'innombrables ressources de combustibles fossiles dans l'ouest de notre pays, mais les régions développées de l'est manquent cruellement de gaz naturel et d'autres ressources. Transporter le gaz naturel de l'ouest vers l'est permettra aux résidents des villes de l'est d'avoir accès à suffisamment de gaz naturel."
CHI_West_East_electricity_transmission_project:0 "Projet de transmission d'électricité d'Ouest en Est"
CHI_West_East_electricity_transmission_project_desc:0 "Produire directement de l'électricité dans l'ouest et la transmettre à l'est peut non seulement promouvoir le développement des industries occidentales, mais aussi réduire la perte de ressources pendant le transport."
CHI_CTL:0 "Technologie de liquéfaction du charbon"
CHI_CTL_desc:0 "La liquéfaction du charbon est une technologie qui utilise le charbon comme matière première pour produire du pétrole et des produits pétrochimiques par traitement chimique. Notre pays est riche en ressources de charbon. Afin de garantir la sécurité énergétique nationale et de répondre au besoin urgent de la stratégie énergétique nationale pour la technologie de liquéfaction indirecte, en 2001, le plan « 863 » du ministère de la Science et de la Technologie et de l'Académie chinoise des sciences a conjointement lancé le projet scientifique et technologique majeur « Liquéfaction du charbon ». Deux ans plus tard, l'Institut de chimie du charbon de Shanxi de l'Académie chinoise des sciences, qui a entrepris ce projet, a réalisé une série de progrès importants. Le carburant de liquéfaction du charbon développé dans notre pays est complètement différent du diesel classique. Il est clair et transparent, presque inodore, avec une teneur extrêmement faible en polluants tels que le soufre et l'azote, et un indice de cétane supérieur à 75. Il présente les caractéristiques d'une puissance élevée et d'une absence de pollution, soit 20 fois supérieur à la norme Euro IV. C'est un excellent carburant propre respectueux de l'environnement."
CHI_Continue_build_fossil_fuel_power:0 "Continuer à développer les centrales à combustibles fossiles"
CHI_Continue_build_fossil_fuel_power_desc:0 "Le développement économique rapide a entraîné une augmentation rapide de la demande énergétique. Continuons à construire plus de centrales électriques !"
CHI_The_Eleventh_Five_Year_Plan:0 "Le onzième plan quinquennal"
CHI_The_Eleventh_Five_Year_Plan_desc:0 "En octobre 2005, la cinquième session plénière du 16e Comité central du PCC a adopté la « Proposition du Comité central du PCC sur la formulation du onzième plan quinquennal pour le développement économique et social national ». En mars 2006, la quatrième session du dixième Congrès national du peuple a examiné et adopté les « Grandes lignes du onzième plan quinquennal pour le développement économique et social national ». Le « onzième plan quinquennal » est le premier plan quinquennal formulé après la proposition de la vision scientifique du développement. Par rapport aux plans quinquennaux précédents, il a une signification de tournant. Ses principales tâches sont : mettre en œuvre pleinement la vision scientifique du développement. Adhérer au principe des « six impératifs » : maintenir un développement économique stable et rapide, accélérer la transformation du mode de croissance économique, améliorer les capacités d'innovation indépendante, promouvoir le développement coordonné des zones urbaines et rurales, renforcer la construction d'une société harmonieuse, et continuer à approfondir la réforme et l'ouverture."
CHI_Peaceful_diplomacy:0 "Diplomatie pacifique"
CHI_Peaceful_diplomacy_desc:0 "Aucun pays n'aime la paix autant que la Chine, et aucune nation ne chérit la paix autant que la nation chinoise. Nous ne nous engagerons jamais dans l'hégémonie ou la politique de puissance. Peu importe comment les étrangers nous calomnient et nous diffament, nous n'avons jamais lancé de guerre d'agression depuis notre fondation en 1949, et nous ne le ferons jamais à l'avenir. Au milieu des appels à la paix, nous apparaîtrons sur la scène internationale avec le visage d'une nouvelle ère."
CHI_manned_space_flight:0 "Vol spatial habité"
CHI_manned_space_flight_desc:0 "Notre pays a enfin envoyé le premier astronaute chinois, le camarade Yang Liwei, dans l'espace. Ce glorieux membre du Parti communiste porte les espoirs aérospatiaux de toute la Chine. Il y a des centaines d'années, notre pays a manqué l'ère des explorations, et maintenant nous ne manquerons plus l'ère spatiale."
CHI_United_Nations_Millennium_Summit:0 "Sommet du Millénaire des Nations Unies"
CHI_United_Nations_Millennium_Summit_desc:0 "Du 6 au 8 septembre 2000, le Sommet du Millénaire des Nations Unies s'est tenu au siège des Nations Unies à New York. Le thème du sommet était « Le rôle des Nations Unies au XXIe siècle ». Le Sommet du Millénaire des Nations Unies était d'une ampleur sans précédent, avec des représentants de plus de 180 pays, dont des chefs d'État ou de gouvernement de plus de 150 pays, dépassant le nombre de chefs d'État ou de gouvernement présents à la célébration du 50e anniversaire de la fondation des Nations Unies en 1995. Le président Jiang a prononcé un discours au sommet appelant à la paix mondiale et à une coopération mondiale, ce qui a suscité les applaudissements de l'audience."
CHI_2008_Olympic_Games:0 "Jeux olympiques de Pékin 2008"
CHI_2008_Olympic_Games_desc:0 "Un monde, un rêve. Les peuples du monde entier seront témoins de la cause glorieuse de la grande renaissance de la nation chinoise en pleine floraison !"
CHI_Embrace_Internet:0 "Adopter Internet"
CHI_Embrace_Internet_desc:0 "Internet est devenu une partie importante de la vie de notre peuple et un outil précieux pour la gestion administrative. Nous devons activement adopter cette nouveauté et accepter Internet avec une attitude plus pragmatique, plutôt que de le considérer comme une menace."
CHI_QQ:0 "Tencent QQ"
CHI_QQ_desc:0 "Tencent QQ est un logiciel de messagerie instantanée basé sur Internet lancé par Tencent. Après plusieurs années de développement, QQ est devenu un outil de communication quotidien pour de nombreuses personnes."
CHI_Taobao:0 "TaoBao"
CHI_Taobao_desc:0 "TaoBao est la plus grande communauté de vente au détail et d'affaires en ligne de la région Asie-Pacifique. Fondée par le groupe Alibaba en mai 2003, elle domine le développement du commerce électronique en Chine."
CHI_JD:0 "JD.com"
CHI_JD_desc:0 "Le 18 juin 1998, Liu Qiangdong a fondé JD.com à Zhongguancun, et elle est rapidement devenue la plateforme de vente électronique la plus influente de Chine."
CHI_17_Third_Plenum:0 "17e Congrès national du Parti communiste chinois"
CHI_17_Third_Plenum_desc:0 "Le 17e Congrès national du Parti communiste chinois s'est tenu à Pékin du 15 au 21 octobre 2007. Le thème du Congrès était : brandir haut la bannière du socialisme à caractéristiques chinoises, prendre la théorie de Deng Xiaoping et la pensée importante des « trois représentations » comme guide, mettre en œuvre pleinement la vision scientifique du développement, continuer à libérer l'esprit, adhérer à la réforme et à l'ouverture, promouvoir le développement scientifique, favoriser l'harmonie sociale, et lutter pour de nouvelles victoires dans la construction d'une société modérément prospère à tous les égards. Hu Jintao, au nom du 16e Comité central, a présenté un rapport au Congrès intitulé « Brandir haut la bannière du socialisme à caractéristiques chinoises et lutter pour de nouvelles victoires dans la construction d'une société modérément prospère à tous les égards »."
CHI_China_Japan_Trade:0 "Commerce sino-japonais"
CHI_China_Japan_Trade_desc:0 "La Chine et le Japon figurent parmi les pays les plus économiquement développés au monde. Le volume commercial entre les deux pays n'a cessé d'augmenter depuis la normalisation des relations dans les années 1970. Après l'entrée dans ce siècle, la vitesse de développement du commerce bilatéral sino-japonais s'est encore accélérée. En particulier, en 2002, 2006 et 2011, le volume commercial entre la Chine et le Japon a dépassé respectivement 100 milliards, 200 milliards et 300 milliards de dollars américains. La Chine est devenue le plus grand partenaire commercial du Japon et son plus grand marché d'exportation en 2007 et 2009 respectivement."
CHI_welcome_Japanese_Culture:0 "Accueillir la culture japonaise"
CHI_welcome_Japanese_Culture_desc:0 "Comme nous, le Japon possède une riche culture traditionnelle ainsi qu'une culture pop moderne très développée. La culture pop japonaise, comme les dessins animés, la musique et les jeux vidéo, est très populaire parmi les jeunes de notre pays. Nous devons accueillir et apprécier le style de ce voisin."
CHI_under_the_same_sky:0 "Montagnes et rivières différentes, mais le même ciel"
CHI_under_the_same_sky_desc:0 "Peu importe combien nous haïssons le Japon, la Chine et le Japon sont géographiquement voisins, séparés par une étroite bande d'eau. Les griefs historiques entre la Chine et le Japon ne doivent pas devenir une entrave aux échanges pacifiques entre les deux peuples. Nous devons traiter les Japonais épris de paix avec une attitude plus tolérante, digne d'une grande puissance. Tant qu'ils chérissent et défendent la paix, qui considérerait une petite île qui ne s'occupe que de ses affaires internes comme un ennemi ?"
CHI_Korean_Peninsula:0 "Péninsule coréenne"
CHI_Korean_Peninsula_desc:0 "Les deux pays hostiles de la péninsule coréenne sont le produit de la guerre froide. Les deux superpuissances, les États-Unis et l'Union soviétique, ont créé deux régimes opposés sur la péninsule coréenne après la fin de la Seconde Guerre mondiale pour leurs propres intérêts nationaux. Les États-Unis ont même entravé la guerre de réunification nationale de la Corée du Nord dans les années 1950. La Chine a une influence dans cette région qui n'est pas moindre que celle des États-Unis. En tant que grande puissance éprise de paix, nous avons la responsabilité de guérir les traumatismes subis par le peuple de la péninsule coréenne et de maintenir la paix sur la péninsule - cela est également dans l'intérêt de la paix en Chine."
CHI_Maintain_Commitment_of_Denuclearization:0 "Maintenir l'engagement de dénucléarisation"
CHI_Maintain_Commitment_of_Denuclearization_desc:0 "Nous comprenons que la Corée du Nord développe des armes nucléaires pour maintenir sa sécurité nationale, mais les armes nucléaires constituent la plus grande menace pour un développement pacifique. Étant donné l'importance de la paix sur la péninsule coréenne pour la Chine et notre influence incontestable sur la Corée du Nord, nous pouvons certainement leur demander de maintenir leur engagement envers la dénucléarisation - au moins verbalement."
CHI_Increase_Exports_to_the_North_Korea:0 "Augmenter les exportations vers la Corée du Nord"
CHI_Increase_Exports_to_the_North_Korea_desc:0 "La Corée du Nord est sous sanctions internationales depuis longtemps, ce qui a restreint ses importations et exportations, et a même indirectement aggravé la Marche de la Misère. Nous avons ouvert de nombreuses portes dérobées pour ce voisin pauvre, et nous pouvons maintenant élargir davantage le commerce avec la Corée du Nord pour aider leur économie à mieux se développer. La Chine aidera toujours les pays faibles."
CHI_Strengthen_Relations_with_South_Korea:0 "Renforcer les relations avec la Corée du Sud"
CHI_Strengthen_Relations_with_South_Korea_desc:0 "La Corée du Sud entretient une relation commerciale importante avec notre pays. Il n'y a pas de haine historique ni d'autres conflits d'intérêts entre les deux pays. Les deux parties partagent un souvenir historique commun d'avoir été envahies par le Japon et regrettent que leur pays n'ait pas été unifié. Pour ce voisin, nous devons renforcer nos relations mutuelles, tant sur le plan économique que politique."
CHI_China_and_Korea_Free_Trade_Agreement:0 "Zone de libre-échange Chine-Corée"
CHI_China_and_Korea_Free_Trade_Agreement_desc:0 "La Chine et la Corée du Sud ont à la fois de la coopération et de la concurrence sur le plan économique. Nous prévoyons d'établir une zone de libre-échange entre les deux pays pour approfondir davantage le commerce bilatéral. Bien que cela soit encore en phase de négociation et de planification, et que les États-Unis chercheront certainement à y faire obstacle, nous sommes confiants de pouvoir atteindre ce consensus qui bénéficiera aux peuples des deux pays."
CHI_the_Golden_Shield_Project:0 "Projet Bouclier d'Or"
CHI_the_Golden_Shield_Project_desc:0 "Le projet « Bouclier d'Or » est essentiellement un projet visant à construire un réseau de communication de sécurité publique et un système d'information informatique. Il s'agit de l'un des 12 systèmes commerciaux importants pour la construction de l'administration électronique nationale. En août 2003, le Conseil des affaires d'État a approuvé et la Commission nationale du développement et de la réforme a officiellement approuvé le plan de conception préliminaire et le budget de financement du projet « Bouclier d'Or ». Du 2 au 3 septembre 2003, le ministère de la Sécurité publique a organisé une conférence nationale sur le projet « Bouclier d'Or », marquant le lancement officiel du projet. Le 19 mai 2006, la première phase du projet « Bouclier d'Or » national a été achevée comme prévu. Cela aidera notre pays à contrôler le chaos croissant sur Internet et à renforcer la gouvernance de la sécurité."
CHI_The_Great_Firewall:0 "La Grande Muraille numérique"
CHI_The_Great_Firewall_desc:0 "Internet est un domaine que nous ne maîtrisons pas encore pleinement, et nous manquons d'expérience dans la gouvernance sociale d'Internet. Le peuple chinois diffère grandement des peuples d'autres pays en termes d'idéologie, d'environnement de vie et de compréhension historique. Les pays dirigés par les États-Unis tentent constamment d'utiliser Internet pour approfondir leur pénétration idéologique dans notre pays, ce qui pose un défi majeur à la sécurité sociale et à la stabilité de notre pays. Il est urgent de construire un pare-feu d'information pour contrer la menace que représente l'Internet étranger pour la société chinoise."
CHI_2009_National_Day_military_parade:0 "Défilé militaire du Jour national 2009"
CHI_2009_National_Day_military_parade_desc:0 "Le défilé militaire célébrant le 60e anniversaire de la fondation de la République populaire de Chine est le 14e grand défilé militaire de l'histoire de la République populaire de Chine et le premier grand défilé militaire depuis le XXIe siècle. Le président Hu Jintao a passé en revue les troupes de l'APL sur la place Tiananmen, mettant pleinement en valeur les armes et équipements de l'APL ainsi que ses réalisations en matière d'informatisation, et montrant le développement économique et technologique de notre grande patrie socialiste. Le président Mao Zedong a dit un jour : « Tout impérialisme est un tigre de papier. » Que tous les pays hostiles et les rats d'égout qui tentent de subvertir la Chine tremblent ! Personne ne peut empêcher la Chine de réaliser sa grande renaissance !"
CHI_Expo_2010_Shanghai:0 "Exposition universelle de Shanghai 2010"
CHI_Expo_2010_Shanghai_desc:0 "L'Exposition universelle de Shanghai 2010 est la 41e Exposition universelle, tenue à Shanghai, en Chine, du 1er mai au 31 octobre 2010. Cette exposition est également la première Exposition universelle enregistrée organisée par la Chine, avec pour thème « Meilleure ville, meilleure vie ». Les réalisations de notre cause socialiste sont exposées devant les peuples du monde, et notre voie socialiste est infiniment vaste."
CHI_action_of_Crime_crackdown:0 "Répression du crime et élimination du mal"
CHI_action_of_Crime_crackdown_desc: "Fin 2000, mon pays a lancé sa première campagne spéciale de "répression contre les gangsters et d'élimination du mal". Le Comité central du PCC et le Conseil des affaires de l'État ont publié la "Notice sur le lancement d'une campagne spéciale de répression contre les gangsters et d'élimination du mal", décidant de lancer une campagne spéciale de trois ans pour réprimer les gangsters et éliminer le mal à travers le pays."
CHI_continue_Crime_crackdown_action: "Continuer à réprimer le crime et le mal"
CHI_continue_Crime_crackdown_action_desc: "En février 2006, la Commission centrale des affaires politiques et juridiques a déployé une campagne spéciale nationale pour lutter contre le crime organisé et éliminer le mal. Un groupe de coordination spéciale pour la lutte contre le crime organisé et l'élimination du mal a été créé au niveau central, et un "Bureau national anti-criminalité" a été mis en place. Depuis lors, une réunion nationale a lieu chaque année, avec les dirigeants centraux mobilisant et déployant personnellement le travail, et toutes les régions et tous les départements ont progressé en profondeur."
CHI_Revision_of_Criminal_Law: "Révision du droit pénal"
CHI_Revision_of_Criminal_Law_desc: "Afin de combattre plus efficacement le soutien économique des gangs criminels, la 19e réunion du 11e Comité permanent de l'Assemblée populaire nationale a adopté l'Amendement (VIII) au droit pénal le 25 février 2011, ajoutant des sanctions patrimoniales au crime organisé. L'interprétation judiciaire pertinente de la Cour populaire suprême stipule également que les biens et revenus accumulés par les gangs du crime organisé et leurs membres, ainsi que les outils utilisés pour les crimes, doivent être récupérés et confisqués conformément à la loi."
CHI_Remove_protective_umbrella: "Éliminer les parapluies protecteurs"
CHI_Remove_protective_umbrella_desc: "Les parapluies protecteurs ont toujours été un facteur important favorisant la propagation et la croissance effrénée des gangs criminels, et ont toujours été au centre des efforts spéciaux de lutte contre le crime organisé. Nous devons appliquer strictement la politique criminelle combinant clémence et sévérité, et punir sévèrement les organisateurs, les dirigeants, les membres clés du crime organisé et leurs "parapluies protecteurs" conformément à la loi, et réduire la peine des autres participants dont les crimes sont moins graves conformément à la loi. Nous devons combiner la lutte contre le crime organisé et la lutte contre la corruption, et stipuler que les indices de "parapluies protecteurs" trouvés dans la lutte spéciale contre le crime organisé seront traités en premier, et tous les indices trouvés feront l'objet d'une enquête et seront traités, quels que soient les fonctionnaires impliqués, ils devront faire l'objet d'une enquête jusqu'au bout et aucune indulgence ne sera manifestée. En particulier, nous devons nous concentrer sur la supervision des affaires impliquant le crime organisé et la corruption qui se sont longtemps et profondément entrelacées, ainsi que des affaires impliquant le crime organisé et la corruption dans le domaine de la lutte contre la pauvreté."
CHI_Performance_indicators: "Indicateurs de performance"
CHI_Performance_indicators_desc: "Les fonctionnaires ont besoin de réalisations politiques pour être promus. Faire de la lutte contre le crime organisé une tâche politique majeure et l'ajouter aux critères d'évaluation des performances peut efficacement motiver les fonctionnaires locaux à arrêter le crime organisé. Mais cela ne signifie pas que les normes d'identification des groupes du crime organisé peuvent être assouplies, que la lutte contre le crime organisé peut être étendue, ou même que la lutte contre le crime organisé peut être traitée avec l'attitude de rechercher des réalisations politiques afin de remplir certains indicateurs et de participer à certains classements."
CHI_rewards_to_informants: "Récompenses aux informateurs"
CHI_rewards_to_informants_desc: "Les yeux des masses sont perçants. Pendant longtemps, les forces du mal ont utilisé l'intimidation, les menaces et les représailles pour persécuter les informateurs, faisant que chacun se sente en insécurité et ait peur de signaler. Nous devrions non seulement récompenser ceux qui parlent avec courage, mais aussi les protéger de la persécution illégale."
CHI_Initial_results: "Premiers résultats"
CHI_Initial_results_desc: "Après une série de répressions en profondeur contre les gangs et les forces du mal, les gangs et les forces du mal rampants ont été maîtrisés. Il n'y a plus de gangs et de forces du mal ouvertement rampants dans la société. Malgré cela, il y a toujours des gangs et des forces du mal à l'œuvre dans certains endroits que nous ne pouvons pas contrôler. Traiter les gangs et les forces du mal est une tâche à long terme. Nous devons toujours rester vigilants et faire de la répression contre les gangs et les forces du mal un travail normal et de masse."
CHI_Acquisition_of_foreign_bankrupt_enterprises: "Acquisition d'entreprises étrangères en faillite"
CHI_Acquisition_of_foreign_bankrupt_enterprises_desc: "La crise financière mondiale a submergé d'innombrables entreprises étrangères, et un grand nombre d'entre elles ont déclaré faillite. C'est une énorme opportunité. Nous utiliserons les réserves de devises accumulées sur une longue période pour acquérir ces entreprises en faillite à bas prix et les transformer en d'énormes actifs à l'étranger."
CHI_US_Treasury_Securities: "Achat de bons du Trésor américain"
CHI_US_Treasury_Securities_desc: "La crise financière américaine a entraîné une dépréciation relative du dollar américain. Dans le même temps, un grand nombre de dollars américains sont entrés sur le marché en raison de ruées sur le dollar américain. Saisir cette opportunité pour acheter rapidement un grand nombre d'obligations américaines bon marché est une action importante pour contrôler le pouvoir de discours financier international, et c'est aussi un moyen efficace d'améliorer le pouvoir de discours de mon pays face aux États-Unis."
CHI_lower_required_reserve_ratios_of_Central_Bank: "Réduire les ratios de réserves obligatoires de la Banque centrale"
CHI_lower_required_reserve_ratios_of_Central_Bank_desc: "Bien que mon pays doive mettre en œuvre une politique monétaire prudente, il doit continuer à ordonner à la banque centrale de réduire les ratios de réserves afin d'émettre davantage de prêts et d'utiliser davantage de levier financier pour stimuler le développement économique. Bien que cela entraîne une certaine inflation et des effets économiques néfastes, c'est insignifiant par rapport à la crise financière qui doit être traitée de toute urgence."
CHI_Ensure_the_flow_of_funds: "Assurer la circulation des fonds"
CHI_Ensure_the_flow_of_funds_desc: "Nous avons émis une grande quantité de devises et de prêts. Ces fonds devraient affluer dans les secteurs de la fabrication et de la demande intérieure conformément à notre plan. Nous ne pouvons pas laisser les fonds inactifs dans le tas de créances douteuses. Pour les entreprises qui ne veulent pas se conformer, laissons-les faire faillite, puis fusionnons-les avec des entreprises d'État. Pensez-vous vraiment que c'est un pays capitaliste ?"
CHI_Grand_Design: "Grand plan"
CHI_Grand_Design_desc: "Notre grande cause du socialisme à caractéristiques chinoises doit bien sûr couvrir tous les aspects. Après une planification à long terme dans les années 1990, nous accomplirons à l'échéance de nombreux exploits qui appartiennent non seulement à la Chine mais aussi à toute l'humanité au cours du nouveau siècle. Notre cause est florissante et notre avenir est extrêmement prometteur !"
CHI_Baoshan_Iron_and_Steel_Co_Ltd: "Baoshan Iron and Steel Co., Ltd."
CHI_Baoshan_Iron_and_Steel_Co_Ltd_desc: "Baoshan Iron & Steel Co., Ltd. est le plus grand conglomérat sidérurgique de Chine, le plus modernisé, dont le siège est dans le district de Baoshan à Shanghai. Le World Steel Guide classe Baosteel Co., Ltd. parmi les trois premiers en termes de compétitivité globale dans l'industrie sidérurgique mondiale, et estime qu'il s'agit également de l'entreprise sidérurgique avec le plus grand potentiel de développement à l'avenir."
The_17th_National_Congress_of_the_CPC: "Le 17e Congrès national du Parti communiste chinois"
The_17th_National_Congress_of_the_CPC_desc: "Le 17e Congrès national du Parti communiste chinois s'est tenu à Pékin du 15 au 21 octobre 2007. Le thème du Congrès était : Porter haut la grande bannière du socialisme à caractéristiques chinoises, prendre la théorie de Deng Xiaoping et la pensée importante des "Trois Représentations" comme guide, mettre pleinement en œuvre la perspective scientifique du développement, continuer à libérer l'esprit, adhérer à la réforme et à l'ouverture, promouvoir le développement scientifique, promouvoir l'harmonie sociale, et lutter pour de nouvelles victoires dans la construction d'une société modérément prospère à tous égards. Hu Jintao, au nom du 16e Comité central, a présenté un rapport au Congrès intitulé : Porter haut la grande bannière du socialisme à caractéristiques chinoises et lutter pour de nouvelles victoires dans la construction d'une société modérément prospère à tous égards."
CHI_Work_Summary_16: "Résumé des travaux"
CHI_Work_Summary_16_desc: "Dans son rapport, le secrétaire général Hu Jintao a passé en revue les nouvelles réalisations accomplies dans diverses entreprises de notre pays depuis le 16e Congrès national du PCC : la force économique a été considérablement renforcée, des percées majeures ont été réalisées dans la réforme et l'ouverture, la vie du peuple a été considérablement améliorée, de nouveaux progrès ont été réalisés dans la construction de la démocratie et du système juridique, une nouvelle situation a été ouverte dans la construction culturelle, la construction sociale a été menée de manière globale, des réalisations historiques ont été accomplies dans la construction de la défense nationale et militaire, le travail à Hong Kong, Macao et Taiwan a été renforcé, des progrès majeurs ont été réalisés dans la diplomatie globale, et le nouveau grand projet de construction du Parti a progressé régulièrement."
CHI_Deeply_implement_the_Scientific_Outlook_on_Development: "Mettre en œuvre en profondeur la perspective scientifique du développement"
CHI_Deeply_implement_the_Scientific_Outlook_on_Development_desc: "Le Congrès a adopté une résolution sur l'"Amendement à la Constitution du Parti communiste chinois" et a décidé que l'amendement prendrait effet à la date de son adoption. Le Congrès estime que la perspective scientifique du développement est une continuation et un développement des idées importantes sur le développement des trois générations de dirigeants centraux du Parti, une incarnation concentrée de la vision du monde et de la méthodologie marxistes sur le développement, une théorie scientifique qui est à la fois conforme au marxisme-léninisme, à la pensée de Mao Zedong, à la théorie de Deng Xiaoping et à la pensée importante des "Trois Représentations" et qui reste en phase avec son temps, un principe directeur important pour le développement économique et social de mon pays, et une pensée stratégique majeure qui doit être maintenue et mise en œuvre dans le développement du socialisme à caractéristiques chinoises. Le Congrès a unanimement accepté d'inscrire la perspective scientifique du développement dans la Constitution du Parti."
CHI_continue_Comprehensively_building_a_moderately_prosperous_society: "§YNouvelles exigences pour atteindre l'objectif de construction d'une société modérément prospère à tous égards§!"
CHI_continue_Comprehensively_building_a_moderately_prosperous_society_desc: "Dans son rapport, Hu Jintao a proposé de nouvelles exigences pour atteindre l'objectif de construction d'une société modérément prospère à tous égards : renforcer la coordination du développement et s'efforcer de réaliser un développement économique sain et rapide ; élargir la démocratie socialiste et mieux protéger les droits et les intérêts du peuple ainsi que l'équité et la justice sociales ; renforcer la construction culturelle et améliorer considérablement la qualité civilisée de l'ensemble de la nation ; accélérer le développement des entreprises sociales et améliorer globalement la vie du peuple ; construire une civilisation écologique et former fondamentalement une structure industrielle, un modèle de croissance et un modèle de consommation qui économisent les ressources énergétiques et protègent l'environnement écologique."
CHI_Socialist_core_value_system: "Système de valeurs fondamentales socialistes"
CHI_Socialist_core_value_system_desc: "En 2007, le secrétaire général Hu Jintao a souligné dans son important discours du "25 juin" que nous devions construire vigoureusement un système de valeurs fondamentales socialistes et consolider la base idéologique commune pour l'unité et la lutte de tout le parti et du peuple de tout le pays. Le système de valeurs fondamentales socialistes comprend quatre contenus de base, à savoir l'idéologie directrice du marxisme, l'idéal commun du socialisme à caractéristiques chinoises, l'esprit national avec le patriotisme comme noyau, l'esprit du temps avec la réforme et l'innovation comme noyau, et le concept socialiste d'honneur et de déshonneur."
CHI_The_twelfth_Five_Year_Plan: "Le douzième plan quinquennal"
CHI_The_twelfth_Five_Year_Plan_desc: "La cinquième session plénière du 17e Comité central du PCC s'est tenue officiellement en octobre 2010. Le Premier ministre du Conseil des affaires de l'État, au nom du Bureau politique du Comité central du PCC, a fait une explication sur la proposition de formulation du 12e plan quinquennal pour le développement économique et social national. La session plénière a examiné et approuvé la proposition du Comité central du PCC sur la formulation du 12e plan quinquennal pour le développement économique et social national, et l'a officiellement annoncée au public. La proposition du Comité central du PCC a analysé la situation nationale et internationale et, sur la base des conditions nationales de base et du stade de développement de la Chine, a proposé les principaux objectifs économiques et sociaux, les principes directeurs, les principes importants, les stratégies clés et les tâches principales du plan, jetant les bases de la formulation de l'esquisse du 12e plan quinquennal."
CHI_The_sixth_National_Population_Census: "Le sixième recensement national de la population"
CHI_The_sixth_National_Population_Census_desc: "Le Conseil des affaires de l'État a décidé de réaliser le sixième recensement national de la population en 2010."
CHI_The_Fifth_National_Population_Census: "Le cinquième recensement national de la population"
CHI_The_Fifth_National_Population_Census_desc: "Le gouvernement chinois a effectué l'enregistrement pour le cinquième recensement national de la population le 1er novembre 2000."
CHI_Reform_of_registered_residence_management_system: "Réforme du système de gestion de l'enregistrement des résidences"
CHI_Reform_of_registered_residence_management_system_desc: "Ces dernières années, toutes les régions et les départements concernés ont consciencieusement mis en œuvre les décisions et les dispositions de l'État sur la promotion de l'urbanisation et la réforme du système d'enregistrement des ménages, se sont efforcés de résoudre les problèmes exceptionnels en pratique, et ont obtenu des résultats remarquables. Récemment, certains endroits ont activement exploré et introduit des politiques et des mesures permettant à la population rurale de s'installer dans les villes, ont accumulé une certaine expérience, ainsi que certains problèmes qui ne peuvent être ignorés. Certains endroits ont ignoré la situation réelle du développement économique et social local et ont unilatéralement poursuivi la vitesse de l'urbanisation de l'échelle urbaine ; certains endroits ont assoupli les conditions d'installation dans les villes sans distinguer les catégories urbaines et la capacité de charge globale des villes ; certains endroits ont arbitrairement enfreint les politiques nationales et porté atteinte aux intérêts vitaux du peuple. Si ces problèmes ne sont pas pris au sérieux et résolus correctement en temps opportun, cela affectera gravement le bon déroulement de l'urbanisation conformément à la loi, affectera gravement le développement économique stable et rapide et l'harmonie et la stabilité sociales, et affectera directement le bon déroulement de la réforme du système d'enregistrement des ménages."
CHI_China_ASEAN_Free_Trade_Area: "Zone de libre-échange Chine-ANASE"
CHI_China_ASEAN_Free_Trade_Area_desc: "La zone de libre-échange Chine-ANASE est la zone de libre-échange la plus peuplée du monde et la plus grande zone de libre-échange composée de pays en développement. Après avoir connu la crise financière, l'ANASE a clairement indiqué que la région devait accélérer l'intégration économique afin d'établir un mécanisme de coopération efficace pour prévenir la récurrence et l'impact de la crise. Mon pays est un partenaire fiable, c'est pourquoi le choix d'établir un mécanisme de coopération économique régionale avec la Chine, à savoir la zone de libre-échange Chine-ANASE, est devenu un choix inévitable et positif."
CHI_Anti_corruption_measures: "Publication d'une série de mesures anti-corruption"
CHI_Anti_corruption_measures_desc: "Lors du thé de la nouvelle année du Comité national de la Conférence consultative politique du peuple chinois le jour du Nouvel An, le président Hu Jintao a rappelé que nous devons approfondir la construction d'un Parti propre et honnête et lutter contre la corruption, améliorer constamment les capacités de leadership et de gouvernance du Parti, et fournir des garanties politiques et organisationnelles fiables pour la construction d'une société modérément prospère à tous égards et le maintien et le développement du socialisme à caractéristiques chinoises. En avril, la Commission centrale de contrôle de la discipline a publié les "Mesures d'application de plusieurs normes pour l'honnêteté en politique des membres du Parti et des cadres dirigeants", qui expliquaient 18 concepts tels que "occuper au nom d'un emprunt", "peut affecter l'exercice impartial des fonctions officielles", "occuper plusieurs maisons", "faire des affaires ou gérer une entreprise au nom d'un individu ou au nom d'une autre personne", et "payer de manière symbolique"."
CHI_Diaoyu_Islands: "Réaffirmation de la souveraineté sur les îles Diaoyu"
CHI_Diaoyu_Islands_desc: "Les îles Diaoyu font partie intégrante de mon pays depuis l'Antiquité. À l'époque moderne, elles ont été déraisonnablement pillées par le Japon. Après la fin de la Seconde Guerre mondiale, le Japon aurait dû renoncer à tous ses territoires à l'exception des quatre îles principales. Aujourd'hui, il prétend sans vergogne que les îles Diaoyu sont leur territoire. Le Premier ministre est même allé sur l'île pour un spectacle, ce qui a gravement provoqué mon pays. Bien que nous respections le principe du développement pacifique, nous n'accepterons jamais une humiliation aussi flagrante."
CHI_Establishment_of_Sansha_City: "Établissement de la ville de Sansha"
CHI_Establishment_of_Sansha_City_desc: "Le 21 juin 2012, le ministère des Affaires civiles a publié sur son site Internet la "Notice du ministère des Affaires civiles sur l'approbation par le Conseil des affaires de l'État de l'établissement de la ville de Sansha au niveau préfectoral". Le Conseil des affaires de l'État a approuvé l'abolition des bureaux des îles Xisha, des îles Nansha et des îles Zhongsha de la province de Hainan et l'établissement de la ville de Sansha au niveau préfectoral pour gouverner les îles et récifs des îles Xisha, Zhongsha et Nansha et leurs eaux environnantes. Le gouvernement populaire municipal de Sansha est situé sur l'île Yongxing dans les îles Xisha. Le 24 juillet, la réunion d'établissement et la cérémonie d'inauguration de la ville de Sansha ont eu lieu. L'établissement de la ville de Sansha au niveau préfectoral est un ajustement et une amélioration du système de gestion administrative de mon pays pour les îles et récifs des îles Xisha, Zhongsha et Nansha dans la province de Hainan et leurs eaux environnantes. L'établissement de la ville de Sansha contribuera à renforcer davantage la gestion administrative et le développement et la construction par mon pays des îles et récifs des îles Xisha, Zhongsha et Nansha et de leurs eaux environnantes, et à protéger l'environnement marin de la mer de Chine méridionale."
CHI_Golden_Sun_Initiative: "Projet de démonstration Soleil doré"
CHI_Golden_Sun_Initiative_desc: "Le projet de démonstration Soleil doré est une action spécifique visant à promouvoir le progrès technologique et le développement à grande échelle de l'industrie de la production d'énergie photovoltaïque, à cultiver les industries stratégiques émergentes et à soutenir la démonstration et l'application de la technologie de production d'énergie photovoltaïque dans divers domaines et l'industrialisation des technologies clés. Il est prévu d'être mis en œuvre et achevé dans un délai de 2 à 3 ans. En principe, les projets inclus dans le projet de démonstration Soleil doré seront subventionnés à hauteur de 50 % de l'investissement total dans les systèmes de production d'énergie photovoltaïque et leurs projets de transmission et de distribution d'énergie associés, et les systèmes indépendants de production d'énergie photovoltaïque dans les zones éloignées sans électricité seront subventionnés à hauteur de 70 % de l'investissement total."
CHI_Revitalization_of_cultural_industry: "Revitalisation de l'industrie culturelle"
CHI_Revitalization_of_cultural_industry_desc: "Le développement de l'industrie culturelle est la seule voie pour développer les forces productives avancées et améliorer la structure industrielle économique. Le 17e Congrès national du PCC a clairement proposé de développer activement les entreprises culturelles d'intérêt public, de développer vigoureusement les industries culturelles, de stimuler la créativité culturelle de l'ensemble de la nation et de promouvoir de manière plus consciente et proactive le grand développement et la prospérité de la culture."
CHI_The_main_functional_area_planning: "La planification des principales zones fonctionnelles du pays"
CHI_The_main_functional_area_planning_desc: "La planification des principales zones fonctionnelles nationales consiste à planifier la future distribution de la population, l'aménagement économique, l'utilisation des terres et le modèle d'urbanisation en fonction de la capacité de charge des ressources et de l'environnement, de la densité de développement existante et du potentiel de développement des différentes régions, à diviser l'espace terrestre en quatre catégories : développement optimisé, développement clé, développement restreint et développement interdit, à déterminer le positionnement fonctionnel principal, à clarifier la direction du développement, à contrôler l'intensité du développement, à normaliser l'ordre du développement, à améliorer la politique de développement, et à former progressivement un modèle de développement spatial avec une population, une économie, des ressources et un environnement coordonnés. Le 8 juin 2011, la planification des principales zones fonctionnelles nationales a été officiellement publiée."
CHI_18th_National_Congress_of_CPC: "Le 18e Congrès national du Parti communiste chinois"
CHI_18th_National_Congress_of_CPC_desc: "Le 18e Congrès national du Parti communiste chinois s'est tenu à Pékin le 8 novembre 2012. Le rapport du 18e Congrès national du Parti communiste chinois a clairement souligné au début que ce congrès était un congrès très important tenu à un stade décisif des efforts de mon pays pour construire une société modérément prospère à tous égards. Ce jugement révèle profondément la grande signification du 18e Congrès national du Parti communiste chinois. Le congrès a élu une nouvelle direction du Comité central du Parti communiste chinois, à savoir le camarade Xi Jinping."
CHI_Xi_Jinping_Agenda: "Agenda de Xi Jinping"
CHI_Xi_Jinping_Agenda_desc: "Lors de la première session de la 12e Assemblée populaire nationale, le camarade Xi Jinping a été sans aucun doute élu président de la République populaire de Chine et président de la Commission militaire centrale de la République populaire de Chine. Lors de la première session plénière du 19e Comité central, il a été nommé président de la Commission militaire centrale du Parti communiste chinois. Le pouvoir de l'État a progressivement été transféré au fils de ce père fondateur, un "réformateur" ambitieux."
CHI_FAST: "Œil céleste chinois"
CHI_FAST_desc: "Le télescope radio sphérique de 500 mètres d'ouverture, également connu sous le nom d'Œil céleste chinois, est situé dans la préfecture autonome Buyei et Miao de Qiannan, province du Guizhou, en Chine. C'est un projet de construction d'infrastructure scientifique et technologique majeure du "Onzième plan quinquennal". La construction a commencé le 25 mars 2011 et a été achevée et mise en service le 25 septembre 2016. Le télescope radio sphérique de 500 mètres d'ouverture a créé un nouveau modèle pour la construction de télescopes géants. Il a construit un télescope radio avec une surface réfléchissante équivalente à 30 terrains de football. Sa sensibilité est plus de 2,5 fois supérieure à celle du deuxième plus grand télescope du monde, élargissant considérablement la vision humaine et explorant l'origine et l'évolution de l'univers."
CHI_Beijing_Daxing_International_Airport: "Aéroport international de Pékin Daxing"
CHI_Beijing_Daxing_International_Airport_desc: "L'aéroport international de Pékin Daxing est situé entre la ville de Yufa et la ville de Lixian dans le district de Daxing, à Pékin, en Chine, et le district de Guangyang, ville de Langfang, province du Hebei. Il se trouve à 46 kilomètres au nord de la place Tian'anmen, à 67 kilomètres au nord de l'aéroport international de Pékin Capital, à 55 kilomètres au sud de la nouvelle zone de Xiongan et à environ 640 mètres à l'ouest de l'aéroport de Pékin Nanjiao. C'est un aéroport international de catégorie 4F, un hub aéronautique de classe mondiale et un nouveau moteur pour le développement national."
CHI_HKZM_Bridge: "Pont Hong Kong-Zhuhai-Macao"
CHI_HKZM_Bridge_desc: "Le pont Hong Kong-Zhuhai-Macao est un projet de pont-tunnel en République populaire de Chine qui relie Hong Kong, Zhuhai (Guangdong) et Macao. Il est situé dans les eaux de Lingdingyang de l'estuaire de la rivière des Perles au Guangdong et constitue la section sud de l'autoroute circulaire du delta de la rivière des Perles. Le pont Hong Kong-Zhuhai-Macao part de l'île artificielle du port de Hong Kong près de l'aéroport international de Hong Kong à l'est, traverse les eaux de Lingdingyang de la mer de Chine méridionale à l'ouest pour relier les îles artificielles de Zhuhai et Macao, et se termine à l'échangeur de Hongwan à Zhuhai. La longueur totale du pont et du tunnel est de 55 kilomètres, dont 29,6 kilomètres pour le pont principal et 41,6 kilomètres du port de Hong Kong au port de Zhuhai-Macao. Le tablier du pont est une autoroute à six voies bidirectionnelles avec une vitesse de conception de 100 kilomètres par heure. L'investissement total dans le projet est de 126,9 milliards de yuans. La construction a commencé le 15 décembre 2009, le projet principal a été entièrement connecté le 7 juillet 2017 et le projet principal a été achevé le 6 février 2018. Réception."
CHI_bohai_Bridge: "Pont de Bohai"
CHI_bohai_Bridge_desc: "Grâce à l'expérience acquise lors de la construction du pont Hong Kong-Zhuhai-Macao et aux percées technologiques de construction, nous pouvons tenter de construire un pont traversant la mer de Bohai reliant le Shandong et le Liaoning."
CHI_The_Thirteenth_Five_Year_Plan: "Le treizième plan quinquennal"
CHI_The_Thirteenth_Five_Year_Plan_desc: "Le 16 mars 2016, la quatrième session de la 12e Assemblée populaire nationale a adopté la "Proposition du Comité central du PCC sur la formulation du treizième plan quinquennal pour le développement économique et social national", qui a conçu un grand projet pour le développement économique et social de la Chine de 2016 à 2020. Les principaux objectifs sont : l'économie maintient une croissance à vitesse moyenne-élevée, et sur la base de l'amélioration de l'équilibre, de l'inclusivité et de la durabilité du développement, d'ici 2020, le PIB et le revenu par habitant des résidents urbains et ruraux doubleront ceux de 2010, l'industrie évoluera vers des niveaux moyen-haut de gamme, la contribution de la consommation à la croissance économique augmentera considérablement, et le taux d'urbanisation de la population enregistrée augmentera rapidement. La modernisation agricole a fait des progrès significatifs, le niveau de vie et la qualité de vie du peuple se sont généralement améliorés, la population rurale pauvre est sortie de la pauvreté selon les normes actuelles de mon pays, tous les comtés pauvres sont sortis de la pauvreté, et la pauvreté régionale globale a été résolue. La qualité du peuple et le niveau de civilisation sociale se sont considérablement améliorés. La qualité globale de l'environnement écologique s'est améliorée. Divers systèmes sont devenus plus matures et plus établis, et des progrès majeurs ont été réalisés dans la modernisation du système de gouvernance nationale et de la capacité de gouvernance."
CHI_The_seventh_National_Population_Census: "Le septième recensement national de la population"
CHI_The_seventh_National_Population_Census_desc: "Le Conseil des affaires de l'État a décidé de réaliser le septième recensement national de la population en 2020. Le point temporel standard du recensement est 0:00 le 1er novembre 2020, visant à enquêter de manière approfondie sur les changements dans les naissances de la population et les conditions de logement."
CHI_18_Third_Plenum: "La troisième session plénière du 18e Comité central du Parti communiste chinois"
CHI_18_Third_Plenum_desc: "La troisième session plénière du 18e Comité central du Parti communiste chinois s'est tenue à Pékin du 9 au 12 novembre 2013. Xi Jinping, secrétaire général du Comité central du PCC, a présidé la réunion. L'ordre du jour principal était pour le Bureau politique du Comité central du PCC de rendre compte de son travail au Comité central et d'étudier les questions majeures de l'approfondissement global de la réforme. Le 12 novembre, la réunion a examiné et adopté la "Décision du Comité central du PCC sur plusieurs questions majeures concernant l'approfondissement global de la réforme" et s'est conclue avec succès à Pékin."
CHI_Comprehensively_deepen_ecnomic_reform: "Approfondir globalement la réforme économique"
CHI_Comprehensively_deepen_ecnomic_reform_desc: "Notre tâche principale est la construction économique. La réforme du système économique est le centre de l'approfondissement global de la réforme. La question centrale est de savoir comment gérer correctement la relation entre le gouvernement et le marché, afin que le marché joue un rôle décisif dans l'allocation des ressources et que le gouvernement joue un meilleur rôle ; adhérer et améliorer le système économique de base, accélérer l'amélioration du système de marché moderne, du système de macro-contrôle et du système économique ouvert, accélérer la transformation du mode de développement économique, accélérer la construction d'un pays innovant et promouvoir un développement économique plus efficace, plus juste et plus durable ; prendre la construction économique comme centre, donner un rôle directeur à la réforme du système économique, promouvoir l'adaptation des relations de production à la productivité et de la superstructure à la base économique, et promouvoir un développement économique et social soutenu et sain."
CHI_Leading_Group_for_Comprehensively_Deepening_Reform: "Groupe dirigeant pour l'approfondissement global de la réforme"
CHI_Leading_Group_for_Comprehensively_Deepening_Reform_desc: "Le Parti dirige tout. Le travail d'approfondissement global de la réforme doit être confié à un personnel spécialisé au sein du Parti. Le Comité central a créé un groupe dirigeant pour l'approfondissement global de la réforme, qui est responsable de la conception globale, de la coordination globale, de la promotion globale et de la supervision de la mise en œuvre de la réforme. Les comités du Parti à tous les niveaux doivent assumer sérieusement leurs responsabilités de leadership pour la réforme."
CHI_The_Fifth_Modernization: "La cinquième modernisation"
CHI_The_Fifth_Modernization_desc: "Lors de la première session de la troisième Assemblée populaire nationale en décembre 1964, le Premier ministre Zhou Enlai, sur la base de la suggestion du président Mao Zedong, a proposé pour la première fois dans son rapport de travail gouvernemental que la Chine soit construite en une puissance socialiste dotée d'une agriculture moderne, d'une industrie moderne, d'une défense moderne et d'une science et technologie modernes au cours du 20e siècle, et atteigne les quatre objectifs de modernisation. Maintenant que nous sommes proches de l'achèvement de ces quatre modernisations, nous devons proposer la cinquième modernisation - promouvoir la modernisation du système de gouvernance nationale et de la capacité de gouvernance."
CHI_Socialist_core_values: "Valeurs fondamentales socialistes"
CHI_Socialist_core_values_desc: "Le 18e Congrès national du PCC a proposé de prôner la prospérité, la démocratie, la civilité et l'harmonie, la liberté, l'égalité, la justice et l'état de droit, le patriotisme, le dévouement, l'intégrité et l'amitié, et de cultiver et de pratiquer activement les valeurs fondamentales socialistes. La prospérité, la démocratie, la civilité et l'harmonie sont les objectifs de valeur au niveau national, la liberté, l'égalité, la justice et l'état de droit sont les orientations de valeur au niveau social, et le patriotisme, le dévouement, l'intégrité et l'amitié sont les critères de valeur au niveau individuel des citoyens. Ces 24 mots constituent le contenu de base des valeurs fondamentales socialistes."
CHI_Building_ecological_civilization: "Construire une civilisation écologique"
CHI_Building_ecological_civilization_desc: "Nous devons approfondir la réforme du système de civilisation écologique autour de la construction d'une belle Chine, accélérer l'établissement d'un système de civilisation écologique, améliorer le système et le mécanisme pour l'aménagement de l'espace terrestre, la conservation et l'utilisation des ressources, et la protection de l'environnement écologique, et promouvoir la formation d'un nouveau modèle de construction moderne avec un développement harmonieux entre l'homme et la nature. Pour construire une civilisation écologique, nous devons établir un système de civilisation écologique systématique et complet et utiliser le système pour protéger l'environnement écologique. Nous devons améliorer le système des droits de propriété et d'utilisation des ressources naturelles, tracer des lignes rouges de protection écologique, mettre en œuvre un système de compensation de l'utilisation des ressources et un système de compensation écologique, et réformer le système de gestion de la protection de l'environnement écologique."
CHI_The_Four_Pronged_Comprehensive_Strategy: "La stratégie globale en quatre points"
CHI_The_Four_Pronged_Comprehensive_Strategy_desc: "La stratégie globale en quatre points, à savoir : construire globalement un pays socialiste moderne, approfondir globalement la réforme, gouverner globalement le pays selon la loi, et gouverner globalement et strictement le Parti."
CHI_Comprehensively_building_the_socialist_modernized_country: "Construire globalement le pays socialiste modernisé"
CHI_Comprehensively_building_the_socialist_modernized_country_desc: "En 1894, le Dr Sun Yat-sen, le grand pionnier de la révolution démocratique chinoise, a proposé pour la première fois de "rajeunir la Chine" lorsqu'il a fondé le groupe révolutionnaire Xingzhonghui ; en 1940, le camarade Mao Zedong a souligné dans "De la nouvelle démocratie" que tous les objectifs de nos communistes sont de construire une nouvelle société et un nouveau pays pour la nation chinoise. Sous la direction du grand Parti communiste chinois, tout notre peuple construira sûrement une patrie modernisée qui sera plus forte, meilleure et plus proche du communisme !"
CHI_Shanghai_Pilot_Free_Trade_Zone: "Zone pilote de libre-échange de Shanghai"
CHI_Shanghai_Pilot_Free_Trade_Zone_desc: "Shanghai est la ville la plus développée économiquement de mon pays. L'approfondissement global de la réforme et de l'ouverture est mieux commencé ici. Fin mars 2013, le Premier ministre Li Keqiang a visité la zone de libre-échange de Waigaoqiao à Pudong lors de ses recherches à Shanghai. Il a exprimé ses encouragements et son soutien à Shanghai pour explorer activement comment établir une zone pilote de libre-échange sur 28 kilomètres carrés sur la base de la zone franche globale existante. Le 3 juillet de la même année, Li Keqiang a présidé la réunion exécutive du Conseil des affaires de l'État. La réunion a approuvé en principe le plan général de la zone pilote de libre-échange de Chine (Shanghai)."
CHI_China_Pilot_Free_Trade_Zone: "Zone pilote de libre-échange de Chine"
CHI_China_Pilot_Free_Trade_Zone_desc: "Notre zone pilote de libre-échange à Shanghai a remporté un grand succès et devrait être progressivement promue et mise en œuvre dans tout le pays. Le Conseil des affaires de l'État a officiellement approuvé la création de la zone de libre-échange de Chine le 22 août 2013."
CHI_Dismiss_inefficient_SOE: "Licencier les entreprises d'État inefficaces"
CHI_Dismiss_inefficient_SOE_desc: "Les entreprises d'État devraient être la pierre angulaire de l'économie publique, le pilier de l'économie nationale et la garantie du bien-être du peuple. Cependant, en raison de divers problèmes de gestion et d'exploitation, de nombreuses entreprises d'État ont connu de mauvaises conditions d'exploitation ou même des pertes à long terme. Ces entreprises d'État inefficaces sont devenues un fardeau pour les finances publiques, engloutissant chaque année les impôts durement gagnés d'innombrables contribuables. Nous devons approfondir les réformes axées sur le marché et laisser les entreprises d'État inefficaces qui ne peuvent pas rivaliser avec les entreprises privées faire faillite et être éliminées."
CHI_Clarify_market_entities: "Clarifier les acteurs du marché"
CHI_Clarify_market_entities_desc: "Une économie de marché est une économie de marché très socialisée et axée sur le marché, dans laquelle le marché joue un rôle décisif dans l'allocation des ressources. La clé de l'établissement d'un système d'économie de marché socialiste et du maintien d'un développement durable, stable et sain de l'économie nationale réside dans la refonte du sujet de l'économie de marché socialiste. Quel est le sujet le plus fondamental de l'économie de marché ? C'est l'entreprise. Dans les conditions d'une économie de marché, les entreprises sont les sujets les plus élémentaires et les plus importants des activités de marché et la micro-fondation du fonctionnement du mécanisme de marché. Les entreprises dans une économie de marché doivent suivre les règles de l'économie de marché, fonctionner de manière indépendante, supporter leurs propres profits et pertes, s'engager directement dans les activités de production, de circulation et de services, rechercher le profit maximum et payer des impôts conformément à la loi."
CHI_Entrepreneur_spirit: "Esprit d'entreprise"
CHI_Entrepreneur_spirit_desc: "Les acteurs du marché sont les vecteurs du pouvoir économique. Protéger les acteurs du marché, c'est protéger la productivité sociale. Au cours des travaux économiques à long terme depuis la réforme et l'ouverture, un groupe d'entrepreneurs exceptionnels qui osent se battre, lutter, être honnêtes et respecter la loi a émergé dans mon pays. Sous la direction du Parti et le travail acharné du peuple travailleur, ils ont réussi à mener la croissance rapide de l'économie de mon pays. Cet esprit de patriotisme, d'innovation, d'intégrité, de responsabilité sociale et de vision internationale est l'esprit d'entreprise de la Chine dans la nouvelle ère. L'esprit d'entreprise est devenu l'un des spectres spirituels des communistes chinois et est l'incarnation de l'esprit du temps des communistes dans la nouvelle ère."
CHI_BTH_Coordinated_Development: "Développement coordonné Beijing-Tianjin-Hebei"
CHI_BTH_Coordinated_Development_desc: "Le cœur du développement coordonné de Beijing, Tianjin et Hebei est le développement coordonné des trois régions dans leur ensemble. Il est nécessaire de prendre la décentralisation des fonctions centrales non capitales et la résolution de la "maladie de la grande ville" de Beijing comme point de départ fondamental, d'ajuster et d'optimiser l'aménagement urbain et la structure spatiale, de construire un système de réseau de transport moderne, d'étendre la capacité environnementale et l'espace écologique, de promouvoir la modernisation et le transfert industriels, de promouvoir la construction conjointe et le partage des services publics, d'accélérer le processus d'intégration du marché, de construire un nouveau cercle capital moderne et de s'efforcer de former un nouveau modèle de développement coordonné à Beijing, Tianjin et Hebei avec les mêmes objectifs, des mesures intégrées, des avantages complémentaires et des bénéfices mutuels et gagnant-gagnant."
CHI_Yangtze_River_Economic_belt_downstream: "Tronçon aval de la ceinture économique du fleuve Yangtze"
CHI_Yangtze_River_Economic_belt_downstream_desc: "La ceinture économique du fleuve Yangtze couvre 11 provinces et villes, dont Shanghai, le Jiangsu, le Zhejiang, l'Anhui, le Jiangxi, le Hubei, le Hunan, Chongqing, le Sichuan, le Yunnan et le Guizhou, avec une superficie d'environ 2,0523 millions de kilomètres carrés, représentant 21,4 % du pays, et sa population et son PIB dépassent tous deux 40 % du pays. Promouvoir le développement de la ceinture économique du fleuve Yangtze est une décision majeure prise par le Comité central du Parti avec le camarade Xi Jinping comme noyau. C'est une stratégie majeure liée au développement global du pays et revêt une grande importance pour atteindre les "deux objectifs centenaires" et réaliser le rêve chinois du grand renouveau de la nation chinoise. Les tronçons inférieurs du fleuve Yangtze sont la région du delta du fleuve Yangtze, qui est la zone métropolitaine la plus développée économiquement de mon pays. Nous devrions accroître les investissements et la construction dans cette région,"
CHI_Yangtze_River_Economic_belt_middle_reaches: "Tronçon intermédiaire de la ceinture économique du fleuve Yangtze"
CHI_Yangtze_River_Economic_belt_middle_reaches_desc: "Les tronçons intermédiaires du fleuve Yangtze englobent les provinces du Hubei, du Jiangxi et du Hunan, y compris les trois grandes villes de Wuhan, Changsha et Nanchang. Cette région dispose d'un vaste arrière-pays économique et d'une main-d'œuvre importante, et les investissements ici joueront un rôle important dans la promotion du développement économique."
CHI_Yangtze_River_Economic_belt_upstream: "Tronçon amont de la ceinture économique du fleuve Yangtze"
CHI_Yangtze_River_Economic_belt_upstream_desc: "Les tronçons supérieurs du fleuve Yangtze comprennent Chongqing, Guizhou, Sichuan et Yunnan. Avec Chongqing et Chengdu comme centre, nous allons construire une zone de développement économique à grande vitesse dans le sud-ouest, ce qui jouera un rôle moteur important dans le développement économique de mon pays."
CHI_GBA: "Grande baie de Guangdong-Hong Kong-Macao"
CHI_GBA_desc: "La Grande baie de Guangdong-Hong Kong-Macao comprend la région administrative spéciale de Hong Kong, la région administrative spéciale de Macao et les villes de Guangzhou, Shenzhen, Zhuhai, Foshan, Huizhou, Dongguan, Zhongshan, Jiangmen et Zhaoqing dans la province du Guangdong. La Grande baie de Guangdong-Hong Kong-Macao bénéficie de conditions géographiques supérieures, "entourée de montagnes sur trois côtés et convergeant avec trois rivières", avec un long littoral, un bon groupe portuaire et une vaste zone maritime. L'arrière-pays économique est vaste, et la région du delta de la rivière des Perles compte environ 1/5 de la superficie du pays, 1/3 de la population et 1/3 de la production économique totale. En décembre 2022, la population permanente de la Grande baie de Guangdong-Hong Kong-Macao a atteint 86,4397 millions d'habitants. Promouvoir la construction de la Grande baie de Guangdong-Hong Kong-Macao est une décision majeure prise par le Comité central du Parti avec le camarade Xi Jinping comme noyau. C'est une stratégie nationale personnellement planifiée, déployée et promue par le secrétaire général Xi Jinping, et c'est aussi une nouvelle pratique pour promouvoir le développement de la cause "un pays, deux systèmes"."
CHI_Xiong_an_New_Area: "Nouvelle zone de Xiong'an"
CHI_Xiong_an_New_Area_desc: "La nouvelle zone de Xiong'an est une nouvelle zone de niveau national sous la juridiction de la province du Hebei. Le 1er avril 2017, le Comité central du PCC et le Conseil des affaires de l'État ont publié un avis pour établir la nouvelle zone de Xiong'an, province du Hebei, une nouvelle zone de niveau national. L'établissement de la nouvelle zone de Xiong'an est un choix stratégique historique majeur fait par le Comité central du PCC avec le camarade Xi Jinping comme noyau. C'est une autre nouvelle zone d'importance nationale après la zone économique spéciale de Shenzhen et la nouvelle zone de Shanghai Pudong. C'est un plan millénaire et un événement national. Cet investissement n'est pas susceptible d'apporter des rendements évidents à court terme, mais il a un impact très clairvoyant sur la construction d'une ville de science et de technologie, d'harmonie et de l'avenir."
CHI_Lucid_waters_and_lush_mountains_are_invaluable_assets: "Des eaux claires et des montagnes luxuriantes sont des atouts inestimables"
CHI_Lucid_waters_and_lush_mountains_are_invaluable_assets_desc: "Notre socialisme signifie-t-il la construction d'un pays sombre, sale et boueux ? Bien sûr que non. Ce que nous voulons construire, c'est une patrie socialiste verte, harmonieuse et belle. Le 15 août 2005, Xi Jinping, alors secrétaire du Comité provincial du Parti du Zhejiang, a proposé pour la première fois la conclusion scientifique selon laquelle "les eaux claires et les montagnes luxuriantes sont des atouts inestimables" lors de son inspection à Anji, Huzhou, Zhejiang. Plus tard, il a développé davantage les trois étapes de développement entre les eaux claires et les montagnes luxuriantes et les atouts inestimables, formant une construction systématique de civilisation écologique."
CHI_Energy_conservation_and_emission_reduction: "Économies d'énergie et réduction des émissions"
CHI_Energy_conservation_and_emission_reduction_desc: "Mon pays a longtemps adopté un modèle de développement qui subventionne la forte consommation d'énergie, ce qui entraîne non seulement un grand gaspillage d'énergie et une production inefficace, mais est également incompatible avec la stratégie de développement de mon pays en matière de construction écologique. L'élimination des industries à forte consommation d'énergie et l'utilisation d'énergies plus respectueuses de l'environnement contribueront à atténuer les pressions écologiques et environnementales de plus en plus sévères de mon pays."
CHI_Innovation_leads_development: "L'innovation mène au développement"
CHI_Innovation_leads_development_desc: "Le camarade Deng Xiaoping a dit un jour que "la science et la technologie sont les forces productives primaires". Si mon pays veut se débarrasser de la structure industrielle actuelle dans laquelle les industries à faible valeur ajoutée représentent une proportion trop importante, il doit diriger la production et le développement par l'innovation scientifique et technologique. La "Proposition du Comité central du PCC sur la formulation du 13e plan quinquennal pour le développement économique et social national" adoptée lors de la cinquième session plénière du 18e Comité central du PCC a proposé que "l'innovation est la force motrice principale du développement". Cette assertion importante est un développement créatif de l'idée importante selon laquelle "la science et la technologie sont les forces productives primaires" et un concept de développement important auquel il faut adhérer dans la nouvelle ère et la nouvelle étape. Pour atteindre les grands objectifs des "deux objectifs centenaires", il est nécessaire de placer l'innovation au cœur du développement national global, de laisser l'innovation imprégner tout le travail du Parti et de l'État, et de laisser l'innovation devenir une tendance dans toute la société."
CHI_The_Quality_Engineering: "Ingénierie de la qualité"
CHI_The_Quality_Engineering_desc: "Pendant longtemps, les produits fabriqués dans mon pays se sont bien vendus dans le monde entier, et la réputation de "Fabriqué en Chine" a été reconnue dans le monde entier. Cependant, avec cela, divers produits problématiques dont la qualité est difficile à garantir ont inondé le marché, et le marché a été mélangé de bons et de mauvais produits, donnant au "Fabriqué en Chine" la stigmatisation de "mauvais travail". Pour atteindre la modernisation industrielle et passer d'une puissance manufacturière à une puissance de fabrication, nous devons commencer par la qualité, abandonner le modèle de développement précédent de recherche unilatérale de la vitesse, et fabriquer chaque produit avec soin."
CHI_The_Robot_Revolution: "La révolution robotique"
CHI_The_Robot_Revolution_desc: "Qu'est-ce que la fabrication efficace ? Est-ce des ateliers bondés et des travailleurs en sueur ? Bien sûr que non, ce devrait être des chaînes d'assemblage entièrement automatisées et des machines de fabrication mécanique de haute technologie ! Le but du développement socialiste est de libérer la productivité au maximum et de remplacer la main-d'œuvre de bas niveau par des machines. L'atelier qui bourdonne est la locomotive économique moderne !"
CHI_Made_in_China_2025: "Fabriqué en Chine 2025"
CHI_Made_in_China_2025_desc: "La fabrication est le corps principal de l'économie nationale, le fondement d'un pays, l'outil de sa prospérité et la base de sa force. Fabriqué en Chine 2025 est un document stratégique signé et approuvé par le Premier ministre Li Keqiang et publié par le Conseil des affaires de l'État en mai 2015 pour déployer la promotion globale de la mise en œuvre d'une puissance manufacturière. C'est le programme d'action de la Chine pour les dix premières années de la mise en œuvre de la stratégie de puissance manufacturière. Il comporte quatre éléments : Premièrement, la transformation de la facteur-dépendance à l'innovation-dépendance. Deuxièmement, la transformation de l'avantage concurrentiel à faible coût à l'avantage concurrentiel de qualité et d'efficacité. Troisièmement, la transformation de la fabrication extensive à forte consommation de ressources et à fortes émissions de polluants à la fabrication verte. Quatrièmement, la transformation de la fabrication axée sur la production à la fabrication axée sur les services."
CHI_Comprehensively_deepen_reform: "Approfondir globalement la réforme et l'état de droit"
CHI_Comprehensively_deepen_reform_desc: "Il existe différentes manières de gouverner un pays. Il n'est pas nécessaire de suivre les anciennes voies pour le bien d'un pays. Les anciennes voies ne peuvent être suivies, et les outils ne peuvent être utilisés. Par conséquent, les lois et règlements des anciens rois ont changé. Ce qui était honoré par le passé est maintenant humilié. Ce qui était bien gouverné par le passé est maintenant dans le chaos. Shennong et Fuxi n'utilisaient ni récompenses ni punitions, mais le peuple ne faisait pas de mal. Cependant, les dirigeants ne pouvaient pas abolir les lois pour gouverner le peuple. Shun a utilisé le Ganqi et a conquis le peuple Miao, mais les conquérants n'ont pas pu déposer leurs armures et contrôler la violence. De ce point de vue, les lois et règlements sont utilisés pour discuter des coutumes du peuple et réguler l'urgence ; les outils sont utilisés pour s'adapter aux changements du temps."
CHI_Simplify_government: "Déléguer, gérer et servir"
CHI_Simplify_government_desc: "Fangguansifu est l'abréviation de rationalisation de l'administration, délégation de pouvoir, combinaison de délégation et de supervision, et optimisation des services. "Fang" signifie rationalisation de l'administration et délégation de pouvoir, abaissant le seuil d'entrée. "Guan" signifie innovation de la supervision et promotion de la concurrence loyale. "Fu" signifie prestation de services efficaces et création d'un environnement pratique. Il s'agit d'une mesure majeure pour approfondir la réforme du système administratif et promouvoir la transformation des fonctions gouvernementales après le 18e Congrès national du Parti communiste chinois, qui contribuera à réduire les fonctionnaires redondants et à éliminer les vieilles mauvaises pratiques."
CHI_Law_of_the_China_on_State_Security: "Loi de la Chine sur la sécurité de l'État"
CHI_Law_of_the_China_on_State_Security_desc: "Le 1er juillet 2015, la 15e session du Comité permanent de la 12e Assemblée populaire nationale a adopté la nouvelle loi sur la sécurité nationale. Le président Xi Jinping a signé l'ordonnance présidentielle n° 29 pour la promulguer. La loi définit les tâches de sécurité nationale dans 11 domaines, notamment la sécurité politique, la sécurité nationale, la sécurité militaire, la sécurité culturelle et la sécurité scientifique et technologique. Elle comporte 7 chapitres et 84 articles et est entrée en vigueur le 1er juillet 2015."
CHI_The_Paris_Agreeme: "Signature de l'Accord de Paris"
CHI_The_Paris_Agreeme_desc: "L'Accord de Paris est un accord sur le changement climatique signé par 178 parties dans le monde. Il s'agit d'un arrangement unifié pour l'action mondiale visant à lutter contre le changement climatique après 2020. Le 22 avril 2016, Zhang Gaoli, alors vice-Premier ministre du Conseil des affaires de l'État de Chine, a signé l'Accord de Paris en tant qu'envoyé spécial du président Xi Jinping. Le 3 septembre de la même année, le Comité permanent de l'Assemblée populaire nationale a approuvé l'adhésion de la Chine à l'Accord de Paris sur le changement climatique, faisant de la Chine l'une des parties à avoir ratifié l'accord."
CHI_Strengthening_the_construction_of_socialist_consultative_democracy: "Renforcer la construction de la démocratie consultative socialiste"
CHI_Strengthening_the_construction_of_socialist_consultative_democracy_desc: "L'harmonie crée la vie, tandis que l'uniformité ne peut pas durer. C'est la multiplicité des idées qui compte, et l'individualité de la prise de décision qui compte. Avec beaucoup d'idées, on peut voir les avantages et les inconvénients ultimes ; avec l'individualité de la prise de décision, on peut déterminer le bien et le mal du monde. Si l'on sait planifier mais pas prendre de décisions, alors chacun dans le groupe voudra poursuivre ses ambitions égoïstes, ce qui conduira à un gouvernement déclinant et chaotique. Toutes choses croissent ensemble sans se nuire, et tous les principes s'alignent sans se contredire. Maintenez le juste milieu entre les deux, respectez les vertueux et accueillez le grand nombre, défendez la justice sans chercher de bénéfices, et clarifiez les principes sans compter les réalisations. Lisez beaucoup et écoutez tout, atteignez la connaissance maximale du groupe et voyez toute la beauté du monde. La plus haute vertu sera manifestée et appliquée au monde extérieur."
CHI_Strengthening_the_Party_leadership_over_all: "Renforcer le leadership global du Parti"
CHI_Strengthening_the_Party_leadership_over_all_desc: "La plus grande condition nationale de la Chine est le leadership du Parti communiste chinois. Le leadership du Parti communiste chinois est la caractéristique la plus essentielle du socialisme à caractéristiques chinoises. Le Parti communiste chinois est le noyau de leadership de la cause du socialisme à caractéristiques chinoises, nous devons donc renforcer et améliorer le leadership du parti et donner plein jeu au rôle de leadership global du parti dans la coordination de toutes les parties. Le parti est le noyau de leadership dans toutes nos entreprises. Les anciens disaient que "les six directions ont le même vent et les neuf États sont connectés". Dans la Chine contemporaine, cela est impossible sans le leadership du parti. Le parti dirige tout, y compris le parti, le gouvernement, l'armée, le peuple et l'éducation, d'est en ouest, du nord au sud et du centre au centre."
CHI_Establish_a_unified_basic_pension_insurance_system_for_urban_and_rural_residents: "Établir un système unifié d'assurance pension de base"
CHI_Establish_a_unified_basic_pension_insurance_system_for_urban_and_rural_residents_desc: "Le grand voyage du socialisme à caractéristiques chinoises n'abandonnera aucun membre du peuple, et ne permettra pas non plus que des phénomènes injustes tolérés par souci de facilité de gestion continuent d'exister. Le système unifié d'assurance pension pour les résidents urbains et ruraux a été mis en œuvre en décembre 2014. Son contenu est que l'assurance pension des résidents ne sera plus divisée en zones urbaines et rurales. L'assurance pension sociale rurale nouvelle et l'assurance pension sociale des résidents urbains originales seront fusionnées et mises en œuvre pour établir un système unifié d'assurance pension de base pour les résidents urbains et ruraux."
CHI_Combating_separatism: "Combattre le séparatisme"
CHI_Combating_separatism_desc: "Bien qu'après des décennies d'efforts inlassables, nous ayons finalement éradiqué les séparatistes de la société publique, il reste encore de nombreux rats louches dans certains coins invisibles complotant des rêves séparatistes. Le grand renouveau de la nation chinoise ne doit être entravé par aucune force. Nous devons immédiatement et complètement mettre en pièces ces termites qui mettent en danger la patrie et le peuple."
CHI_Double_First_Class_Initiative: "Universités de classe mondiale et disciplines de première classe"
CHI_Double_First_Class_Initiative_desc: "Les universités de classe mondiale et les disciplines de première classe, dénommées "Double première classe", est une décision stratégique majeure prise par le Comité central du PCC et le Conseil des affaires de l'État. C'est également une autre stratégie nationale dans le domaine de l'enseignement supérieur en Chine après les projets "211" et "985". Elle vise à promouvoir un certain nombre d'universités et de disciplines de haut niveau pour qu'elles entrent dans le premier rang ou le premier plan mondial, à accélérer la modernisation des systèmes de gouvernance et des capacités de gouvernance de l'enseignement supérieur, et à améliorer le niveau de formation des talents, de recherche scientifique, de services sociaux et d'héritage culturel et d'innovation dans les établissements d'enseignement supérieur, afin qu'ils deviennent une force importante pour la découverte de connaissances et l'innovation technologique, une source importante d'idées avancées et de culture excellente, et une base importante pour la formation de divers types de talents de haute qualité. Elle joue un rôle majeur dans le soutien de la stratégie nationale de développement axé sur l'innovation, au service du développement économique et social, à la promotion de l'excellente culture traditionnelle chinoise, à la culture et à la pratique des valeurs fondamentales socialistes, et à la promotion du développement par la connotation de l'enseignement supérieur."
CHI_2Child_Policy: "Promouvoir la politique de natalité"
CHI_2Child_Policy_desc: "Notre pays dispose encore d'une main-d'œuvre abondante, mais la structure de la population évolue rapidement vers le vieillissement. La politique originale a été révisée de nombreuses fois au cours de la dernière décennie. Il est maintenant temps de procéder à un changement."
CHI_Service_oriented_government: "Gouvernement axé sur les services"
CHI_Service_oriented_government_desc: "Le cœur du peuple est inconstant, et il ne se soucie que des avantages. Le Livre des documents dit : Le Ciel voit comme le peuple voit, et le Ciel entend comme le peuple entend. Le peuple est le fondement de l'État, et l'État est stable lorsque le fondement est solide. L'ascension d'un gouvernement réside dans le suivi de la volonté du peuple, et la chute d'un gouvernement réside dans le fait d'aller à l'encontre de la volonté du peuple. Comment un souverain peut-il opprimer le peuple ? L'État est le maître. Comment un souverain et ses sujets peuvent-ils n'être qu'une excuse ? Par conséquent, si un souverain meurt pour l'État, il doit mourir ; s'il périt pour l'État, il doit périr. S'il meurt pour lui-même et périt pour lui-même, qui oserait le nommer à moins qu'il ne soit capable d'être proche de son propre peuple ? Un supérieur traite ses subordonnés comme s'ils étaient ses propres enfants ; un subordonné traite ses supérieurs comme s'ils étaient ses parents. Si le peuple est satisfait, comment un souverain peut-il être insatisfait ? Si le peuple est insatisfait, comment un souverain peut-il être satisfait ?"
CHI_The_China_Dream: "Le Rêve chinois"
CHI_The_China_Dream_desc: "Le Rêve chinois est une idéologie directrice importante et une philosophie de gouvernance importante proposée par le secrétaire général Xi Jinping depuis le 18e Congrès national du Parti communiste chinois. Il a été officiellement proposé le 29 novembre 2012. Le secrétaire général Xi a défini le "Rêve chinois" comme "la réalisation du grand renouveau de la nation chinoise, qui est le plus grand rêve de la nation chinoise depuis les temps modernes" et a déclaré que ce rêve "deviendra certainement réalité". L'objectif central du "Rêve chinois" peut également être résumé comme les "deux objectifs centenaires", c'est-à-dire : d'ici le 100e anniversaire de la fondation du Parti communiste chinois en 2021 et le 100e anniversaire de la fondation de la République populaire de Chine en 2049, réaliser progressivement et finalement avec succès le grand renouveau de la nation chinoise."
CHI_Road_confidence: "Confiance en la voie"
CHI_Road_confidence_desc: "Notre voie est si large, notre avenir est si brillant, nous nous consacrons à cette magnifique cause, et nous aurons un bonheur infini et une gloire suprême !"
CHI_Theory_confidence: "Confiance théorique"
CHI_Theory_confidence_desc: "Existe-t-il une théorie dans le monde qui puisse nous guider pour transformer le monde plus précisément que le marxisme ? Nous sommes arrivés là où nous en sommes aujourd'hui parce que nous adhérons à la théorie du marxisme et à la théorie du socialisme à caractéristiques chinoises. Nous disposons d'une arme théorique invincible pour nous guider afin de mieux transformer et conquérir ce vaste monde !"
CHI_System_confidence: "Confiance dans le système"
CHI_System_confidence_desc: "La théorie guide la pratique. Une bonne théorie ne peut jouer un rôle que si elle est associée à un bon système. Sinon, ce ne sont que des paroles en l'air. Nous avons établi un système socialiste complet à caractéristiques chinoises. Ce système politique et économique supérieur est propice à nos grands pas vers le renouveau national !"
CHI_Culture_confidence: "Confiance culturelle"
CHI_Culture_confidence_desc: "La confiance culturelle est l'affirmation pleine et entière et la pratique active d'une nation, d'un pays et d'un parti politique quant à ses propres valeurs culturelles, et la ferme confiance dans la vitalité de sa culture. Le secrétaire général Xi Jinping a souligné : "Nous devons maintenir la confiance en notre voie, notre théorie et notre système, et plus fondamentalement, la confiance en notre culture." Qu'est-ce que la confiance culturelle ? La confiance culturelle est l'affirmation pleine et entière et la pratique active d'une nation, d'un pays et d'un parti politique quant à ses propres valeurs culturelles, et la ferme confiance dans la vitalité de sa culture. Notre pays possède le plus ancien patrimoine historique et culturel du monde. Nous maintiendrons la sagesse de nos ancêtres pendant des milliers d'années et nous nous dirigerons vers le grand renouveau de la nation chinoise !"
CHI_Socialism_with_Chinese_Characteristics_in_the_New_Era: "Socialisme à caractéristiques chinoises dans la nouvelle ère"
CHI_Socialism_with_Chinese_Characteristics_in_the_New_Era_desc: "La nouvelle ère du socialisme à caractéristiques chinoises est une nouvelle orientation historique pour le développement de la Chine. Le 18e Congrès national du Parti communiste chinois, tenu à Pékin en novembre 2012, était un congrès très important tenu au stade décisif de la construction par mon pays d'une société modérément prospère à tous égards. Depuis le 18e Congrès national du Parti communiste chinois, le socialisme à caractéristiques chinoises est entré dans une nouvelle ère. Le 18 octobre 2017, le secrétaire général Xi Jinping a formulé un jugement majeur dans le rapport du 19e Congrès national du Parti communiste chinois : "Après de longs efforts, le socialisme à caractéristiques chinoises est entré dans une nouvelle ère, qui est une nouvelle orientation historique pour le développement de mon pays." Cette nouvelle ère est une ère où l'on hérite du passé, où l'on fait avancer le passé, et où l'on continue de remporter la grande victoire du socialisme à caractéristiques chinoises dans de nouvelles conditions historiques. Le rapport est basé sur les nouvelles pratiques et les nouvelles réalisations depuis le 18e Congrès national du Parti communiste chinois, et planifie les objectifs pour le milieu de ce siècle."
CHI_Comprehensively_and_strictly_governing_the_Party: "Gouverner globalement et strictement le Parti"
CHI_Comprehensively_and_strictly_governing_the_Party_desc: "Le Parti communiste chinois compte plus de 89 millions de membres et plus de 4,5 millions d'organisations du parti. C'est la plus grande organisation du parti de mon pays et elle a pénétré tous les secteurs, niveaux et domaines de la société. Le 8 octobre 2014, le secrétaire général Xi Jinping a mentionné pour la première fois "faire progresser globalement la gouvernance stricte du Parti" dans son discours lors de la réunion de synthèse des activités d'éducation et de pratique de la ligne de masse du Parti. En décembre 2014, le secrétaire général Xi Jinping a souligné lors de ses recherches au Jiangsu : "Efforts coordonnés pour construire une société modérément prospère à tous égards, approfondir globalement la réforme, faire progresser globalement l'état de droit et gouverner globalement et strictement le Parti, afin de pousser la réforme et l'ouverture et la modernisation socialiste à un nouveau niveau", faisant de la gouvernance globale et stricte du Parti une partie importante de la structure stratégique des "quatre globalités" et l'élevant à une nouvelle hauteur stratégique. La sixième session plénière du 18e Comité central du PCC a spécifiquement étudié les questions majeures de la gouvernance globale et stricte du Parti, démontrant pleinement la détermination et la confiance du Comité central du Parti à faire progresser sans relâche la gouvernance globale et stricte du Parti."
CHI_combat_corruption_and_build_a_clean_government: "Lutter contre la corruption et construire un gouvernement propre"
CHI_combat_corruption_and_build_a_clean_government_desc: "Une personne honnête est un modèle pour le peuple, tandis qu'une personne avide est un fléau pour le peuple. La chute d'un pays est causée par des fonctionnaires corrompus ; l'immoralité des fonctionnaires est causée par leur promotion de la corruption. Autrefois, quelqu'un a donné du poisson au Premier ministre Zheng, mais il a refusé de l'accepter. Quelqu'un lui a demandé : "Vous aimez le poisson, pourquoi ne l'acceptez-vous pas ?" Il a répondu : "J'aime le poisson, donc je ne l'accepte pas. Si j'accepte du poisson, je perdrai mon salaire et n'aurai rien à manger ; si je ne l'accepte pas, je devrai manger du poisson toute ma vie.""
CHI_Defeat_the_tiger: "Vaincre le tigre"
CHI_Defeat_the_tiger_desc: "L'élite, dirigée par les "princelings" et la "bande de Shanghai", a conservé de nombreux postes importants au sein du Parti. Ils ont conspiré en secret, et la corruption est généralisée, de nombreuses personnes étant impliquées dans une corruption évidente. Cela fournit une excuse parfaite pour faire tomber ces "grands tigres" et affaiblir le pouvoir et l'influence de la bande de Shanghai. Pour maintenir un gouvernement propre, il est nécessaire de frapper ces fonctionnaires de haut rang."
CHI_flap_a_fly: "Frapper une mouche"
CHI_flap_a_fly_desc: "Ce sont ces serviteurs et compradores malhonnêtes qui fournissent aux grands tigres un flux constant d'argent. Peut-être que certains d'entre eux sont contraints à la corruption et à la corruption par l'environnement corrompu, mais ils ont dépassé les limites après tout. Dissiper ces petits personnages profitera à tout le monde - sauf à eux-mêmes."
CHI_combat_organized_crimes_and_root_out_local_battles_against_gangcrimes: "Lutter contre le crime organisé et éradiquer la criminalité locale"
CHI_combat_organized_crimes_and_root_out_local_battles_against_gangcrimes_desc: "Comment est-il possible que des cadres du Parti communiste conspirent avec la mafia ? Bien que le président Hu Jintao ait vigoureusement réprimé la mafia, il reste encore de nombreux méchants qui se sont cachés sous le couvert de "parapluies de protection" ou se sont transformés en "bons gars" et "patrons". Il est temps d'éliminer complètement ces scories de la société. Nous ne sommes pas un pays de compradores oligarchiques !"
CHI_Strengthen_Party_member_education: "Renforcer l'éducation des membres du Parti"
CHI_Strengthen_Party_member_education_desc: "Le Parti communiste chinois compte près de 100 millions de membres, et un grand nombre de personnes rejoignent le parti chaque année. Il est impossible de contrôler strictement l'idéologie de chacun. Nous ne pouvons que renforcer l'éducation des membres du parti, en particulier l'éducation des nouveaux membres. Heureusement, de nombreux bons camarades du parti reconnaissent ce comportement et y participent activement."
CHI_Self_revolution: "Auto-révolution"
CHI_Self_revolution_desc: "La nature à long terme de la révolution sociale détermine la nature à long terme du leadership et de la gouvernance du Parti communiste. La capacité du Parti communiste à gouverner longtemps dépend de sa capacité à maintenir sa nature avancée et sa pureté. Pour maintenir sa nature avancée et sa pureté, le Parti doit persister dans l'auto-révolution. Pendant longtemps, le terme "auto-révolution" n'était pas courant dans les documents du Parti, mais des expressions similaires à l'auto-révolution étaient souvent rencontrées. Depuis le 18e Congrès national du PCC, le terme "auto-révolution" apparaît fréquemment dans les documents du Parti. Selon des statistiques préliminaires, l'"auto-révolution" est devenue un mot très fréquent dans les discours publics du secrétaire général Xi Jinping, et l'auto-révolution et la révolution sociale sont collectivement appelées les "deux grandes révolutions" de la nouvelle ère."
CHI_The_State_Committee_of_Supervisory_of_China: "La Commission nationale de supervision de la RPC"
CHI_The_State_Committee_of_Supervisory_of_China_desc: "La Commission nationale de supervision de la République populaire de Chine est le plus haut organisme de supervision. Elle dirige le travail des commissions de supervision locales à tous les niveaux. Elle est élue par l'Assemblée populaire nationale et est responsable du travail de supervision national. Elle rend compte à l'Assemblée populaire nationale et à son Comité permanent et est soumise à la supervision. La Commission de supervision est un organisme de lutte contre la corruption. Un objectif important de l'approfondissement de la réforme du système national de supervision est de renforcer le leadership unifié du Parti sur le travail de lutte contre la corruption."
CHI_Mass_supervision: "Supervision de masse"
CHI_Mass_supervision_desc: "Le peuple est celui qui voit ce que voit le ciel, et le peuple est celui qui entend ce qu'entend le ciel. Le travail fondamental de notre parti et de notre pays est de servir le peuple. Que nous fassions du bon travail ou non, bien sûr, c'est le peuple qui a le dernier mot."
CHI_Purity_Progressiveness_Contemporaneity_PRC: "Parti communiste chinois pur, progressiste et contemporain"
CHI_Purity_Progressiveness_Contemporaneity_PRC_desc: "Après une série de réformes et de rectifications drastiques, notre parti est devenu pur, progressiste et contemporain, et a la capacité et la mission de diriger la nation chinoise vers le renouveau."
CHI_Investment_in_aircraft_carriers: "Investissement dans la construction de porte-avions"
CHI_Investment_in_aircraft_carriers_desc: "Les porte-avions sont l'atout et l'épine dorsale de la marine moderne. La construction d'une puissante flotte de porte-avions est une partie essentielle d'une stratégie militaire forte."
CHI_Comprehensively_building_a_moderately_prosperous_society_complete: "§YConstruire globalement une société modérément prospère§!"
CHI_Comprehensively_building_a_moderately_prosperous_society_complete_desc: "§YVive la République populaire de Chine ! Vive le peuple !§!\n\nAprès des décennies d'efforts inlassables, nous avons enfin sorti chaque Chinois de la pauvreté absolue, et nous avons enfin construit une société modérément prospère à tous égards !\nC'est un chapitre glorieux de l'histoire chinoise, une réalisation immortelle du Parti et du peuple, et la perle la plus brillante de l'histoire mondiale et de l'histoire des droits de l'homme !"
CHI_HKG_national_security_law: "La loi de la RPC sur la sauvegarde de la sécurité nationale dans la RAS de Hong Kong"
CHI_HKG_national_security_law_desc: "Afin de maintenir la stabilité à long terme de la société de Hong Kong et du système Un pays, deux systèmes, mon pays doit introduire une loi de protection de la sécurité applicable à Hong Kong. La loi de la République populaire de Chine sur la sauvegarde de la sécurité nationale dans la région administrative spéciale de Hong Kong stipule en détail que le gouvernement populaire central assume la responsabilité fondamentale des affaires de sécurité nationale liées à la région administrative spéciale de Hong Kong, a le droit de stationner des troupes à Hong Kong pour sauvegarder la sécurité nationale, prévenir, arrêter et punir les crimes liés à la région administrative spéciale de Hong Kong tels que la division du pays, la subversion du pouvoir de l'État, l'organisation et la réalisation d'activités terroristes et la collusion avec des forces étrangères ou externes pour mettre en danger la sécurité nationale, maintenir la prospérité et la stabilité de la région administrative spéciale de Hong Kong, et protéger les droits et intérêts légitimes des résidents de la région administrative spéciale de Hong Kong."
CHI_Utilizing_the_Triad: "Utilisation des Triades"
CHI_Utilizing_the_Triad_desc: "Les Triades sont des organisations mafieuses souterraines de Hong Kong qui ont une grande influence à Hong Kong. Bien qu'elles aient historiquement été en conflit avec notre Parti, en raison de leurs liens commerciaux avec le continent, les Triades ont également commencé à soutenir les intérêts de la Chine continentale à Hong Kong. Nous pouvons approfondir notre influence à Hong Kong en travaillant avec les Triades."
CHI_international_financial_center: "Centre financier international asiatique ?"
CHI_international_financial_center_desc: "Hong Kong est un port franc et une métropole internationale très prospères. Elle est connue sous le nom de "New York-Londres-Hong Kong" avec New York et Londres. C'est le troisième centre financier mondial, un important centre de commerce international, un centre maritime et un centre international d'innovation et de technologie. Elle a été classée troisième parmi les villes de premier rang mondial par le GaWC. Après le retour de Hong Kong à la mère patrie, bien qu'elle maintienne toujours une force économique assez forte, il est indéniable que la croissance économique de Hong Kong a ralenti. Nous devrions accroître le soutien économique à Hong Kong, ce qui aura un rôle considérable dans la promotion de la prospérité et de la stabilité à long terme de Hong Kong - s'ils ne comprennent vraiment pas, nous pourrions aussi bien créer un nouveau centre financier."
CHI_Optimizing_the_business_environment: "Optimiser l'environnement des affaires"
CHI_Optimizing_the_business_environment_desc: "L'optimisation de l'environnement des affaires est nécessaire au développement sain de l'économie de marché et constitue également une tendance inévitable pour que mon pays approfondisse la réforme institutionnelle. Depuis le 18e Congrès national du PCC, le secrétaire général Xi Jinping a accordé une grande importance à l'optimisation de l'environnement des affaires et a émis une série d'instructions importantes, soulignant qu'"il n'y a pas de meilleur environnement des affaires, seulement un meilleur". Le Premier ministre Li Qiang a présidé la réunion exécutive du Conseil des affaires de l'État et a souligné qu'"il est nécessaire de placer la création d'un environnement des affaires axé sur le marché, fondé sur le droit et internationalisé dans une position importante, de stabiliser davantage les attentes sociales, de renforcer la confiance dans le développement, de stimuler la vitalité du marché et de promouvoir une amélioration soutenue du fonctionnement économique"."
CHI_new_energy: "§GNouvelle énergie§!"
CHI_new_energy_desc: "Le développement humain est sans fin, mais la capacité de charge environnementale est limitée. Mon pays doit rapidement explorer un modèle de développement énergétique plus vert et plus respectueux de l'environnement."
CHI_renewable_energy: "§GÉnergie renouvelable§!"
CHI_renewable_energy_desc: "Après plus d'une décennie de développement technologique, mon pays a acquis une technologie et des capacités de production d'énergie renouvelable assez matures. Grâce à notre publicité, notre peuple attend depuis longtemps les nouvelles énergies, et le développement des nouvelles énergies est impératif."
CHI_solar_energy_experiment: "§YExpérience d'énergie solaire§!"
CHI_solar_energy_experiment_desc: "Bien que notre technologie solaire soit mature depuis longtemps, il existe toujours des risques à utiliser cette énergie instable à grande échelle. Nous pouvons d'abord mener des expériences sur l'énergie d'origine solaire dans certaines zones. Il existe un grand nombre de zones inhabitées riches en énergie solaire dans certaines régions du nord et de l'ouest de mon pays, nous pouvons donc commencer par là."
CHI_wind_power: "§CExpérience d'énergie éolienne§!"
CHI_wind_power_desc: "Notre pays a un vaste territoire, et le dieu du vent a toujours erré sur la terre de notre patrie. Aujourd'hui, la brise douce peut également être transformée en notre énergie. Notre pays devrait d'abord mener des expériences de production d'énergie éolienne dans certaines zones riches en vent."
CHI_Green_China: "§GChine verte§!"
CHI_Green_China_desc: "Par le passé, l'environnement écologique de mon pays était en crise sous le modèle de développement extensif et a été largement critiqué par les gens au pays et à l'étranger. Aujourd'hui, sous la direction correcte du Parti et du pays, nous avons réussi à explorer une voie de développement verte plus verte, plus respectueuse de l'environnement et plus brillante. Les générations futures vivront dans une Chine verte et entreront dans une nouvelle ère du grand renouveau de la nation chinoise dans un avenir plus radieux !"
CHI_solar_hundred_percent: "§YSolaire à cent pour cent§!"
CHI_solar_hundred_percent_desc: "Il existe de vastes zones inhabitées riches en énergie solaire aux frontières de notre pays. Équipez-les de panneaux photovoltaïques et nous allons accélérer !"
CHI_The_Grace_of_Mazu: "§CLa grâce de Mazu§!"
CHI_The_Grace_of_Mazu_desc: "Mazu est une déesse de la mer vénérée par les populations côtières. Elle a évolué à partir de l'image d'une ancienne fille et représente tout ce qui concerne l'océan dans mon pays. L'océan n'a pas seulement des vagues et des bateaux de pêche, mais aussi la brise marine qui tourbillonne toute l'année. La construction de parcs éoliens offshore peut nous apporter une énergie propre inépuisable. Pendant des milliers d'années, Mazu a béni chaque pêcheur qui part en mer, et maintenant ses mains douces ombrageront également les habitants du continent."
CHI_Nuclear_Boom: "§YBoom nucléaire§!"
CHI_Nuclear_Boom_desc: "Malgré une forte opposition publique à la construction de nouveaux réacteurs nucléaires, l'énergie nucléaire reste l'une des alternatives d'énergie renouvelable les plus viables aux combustibles fossiles. Cependant, l'énergie nucléaire est extrêmement coûteuse à produire en raison du système complexe d'infrastructures de soutien requis."
CHI_Construct_Nuclear_Waste_Repository: "§YConstruire un dépôt de déchets nucléaires§!"
CHI_Construct_Nuclear_Waste_Repository_desc: "La gestion des déchets hautement radioactifs, tels que le combustible nucléaire usé, reste une considération majeure pour notre programme d'énergie nucléaire. Les déchets hautement radioactifs doivent être manipulés avec une extrême prudence et stockés dans un dépôt géologique pendant des décennies pour se désintégrer. Nous avons identifié la région de Beishan dans le désert de Gobi comme un endroit approprié pour commencer la construction d'un tel dépôt."
CHI_Construction_of_nuclear_power_plants: "§YConstruction de centrales nucléaires§!"
CHI_Construction_of_nuclear_power_plants_desc: "Notre technologie d'énergie nucléaire est mature depuis longtemps, mais elle a toujours été utilisée avec prudence. Nous ne pouvons pas abandonner nos progrès simplement à cause d'une possibilité prétendument extrêmement faible. Il est maintenant temps de construire des centrales nucléaires à grande échelle."
CHI_invest_fusion_reactor: "§YInvestir dans l'énergie de fusion§!"
CHI_invest_fusion_reactor_desc: "La production d'énergie par fusion nucléaire est une méthode de production d'électricité utilisant la chaleur générée par les réactions de fusion nucléaire. Les humains ont réussi à réaliser une fusion nucléaire incontrôlée, c'est-à-dire l'explosion d'une bombe à hydrogène. Actuellement, les scientifiques du monde entier travaillent dur pour étudier la fusion nucléaire contrôlée, qui pourrait devenir une source d'énergie à l'avenir. On peut dire que celui qui développera en premier la technologie de fusion nucléaire contrôlée aura le droit de parler dans la nouvelle ère de l'énergie, et le pétrole deviendra poussière dans le vieux monde."
CHI_Construct_Stellarator_Reactor: "§CConstruire un réacteur stellarator§!"
CHI_Construct_Stellarator_Reactor_desc: "Un stellarator est un dispositif à plasma qui repose principalement sur des aimants externes pour confiner le plasma. Les scientifiques qui étudient la fusion par confinement magnétique visent à utiliser des dispositifs stellarator comme conteneurs pour les réactions de fusion nucléaire. La structure torsadée d'un stellarator peut l'aider à mieux contrôler le plasma et présente moins de risques opérationnels. Contrairement à un réacteur tokamak, il est sujet à des interruptions soudaines du courant interne, entraînant l'arrêt immédiat de la réaction de fusion."
CHI_Construct_Tokamak_Reactor: "§CConstruire un réacteur tokamak§!"
CHI_Construct_Tokamak_Reactor_desc: "Un tokamak est un dispositif qui utilise un champ magnétique puissant pour confiner le plasma en forme de tore. Le tokamak est l'un des nombreux dispositifs de confinement magnétique en cours de développement pour produire de l'énergie de fusion thermonucléaire contrôlée. Le dispositif tokamak est actuellement considéré par la communauté universitaire comme la voie principale pour réaliser la fusion nucléaire contrôlée, utilisant principalement des isotopes d'hydrogène deutérium-tritium comme combustible de fusion."
CHI_Coal: "§RLe charbon moteur du développement§!"
CHI_Coal_desc: "La Chine possède des réserves de charbon extrêmement riches, les ressources en charbon étant réparties dans tout notre pays. La Chine est le plus grand producteur et consommateur de charbon au monde, et notre économie en reste dépendante. Bien que la combustion du charbon cause une pollution environnementale considérable, nous ne devrions pas nous concentrer sur des alternatives irréalistes, mais simplement accepter le statut du charbon comme pilier de notre économie et nous concentrer sur son développement aussi efficace que possible."
CHI_eyeing_the_west: "Regarder vers l'Ouest"
CHI_eyeing_the_west_desc: "Le bloc occidental, dirigé par les États-Unis, est hostile à notre pays depuis longtemps. Nous devons apaiser les relations avec eux - après tout, qui refuserait les exportations bon marché de la Chine ?"
CHI_Asian_Infrastructure_Investment_Bank: "Création de la Banque asiatique d'investissement dans les infrastructures"
CHI_Asian_Infrastructure_Investment_Bank_desc: "Afin de mieux aider les pays sous-développés, nous devrions créer une institution dédiée à l'investissement et à l'aide internationaux. La Banque asiatique d'investissement dans les infrastructures est une institution multilatérale de développement intergouvernementale en Asie qui se concentre sur le soutien à la construction d'infrastructures. Son objectif est de promouvoir le processus d'interconnexion et d'intégration économique dans la région asiatique et de renforcer la coopération entre la Chine et d'autres pays et régions asiatiques. C'est la première institution financière multilatérale initiée par la Chine. Elle a son siège à Pékin et un capital social de 100 milliards de dollars. En septembre 2023, le nombre de membres de l'AIIB est passé à 109."
CHI_Alipay: "Alipay"
CHI_Alipay_desc: "Alipay est une activité d'Ant Group Co., Ltd., créée en 2004. Après 19 ans de développement, c'est une plate-forme ouverte de paiement tiers domestique, exploitée par Alipay (China) Network Technology Co., Ltd. et Alipay (Hangzhou) Information Technology Co., Ltd. Elle est responsable de la fourniture d'interfaces de produits et de services aux fournisseurs de services numériques et de l l'assistance aux commerçants et institutions dans leurs opérations numériques. Plus de 3 millions de mini-programmes de commerçants et d'institutions sont entrés dans l'application Alipay, offrant aux consommateurs plus de 1 000 services de la vie courante tels que les services gouvernementaux, la commande par code QR et le paiement des services de vie. Alipay a servi 80 millions de commerçants et 1 milliard de consommateurs. Les méthodes de paiement numérique mobile lancées par Alipay et WeChat Pay ont profondément changé le développement social et économique de la Chine."
CHI_Desalination_of_seawater_projects: "Projets de dessalement de l'eau de mer"
CHI_Desalination_of_seawater_projects_desc: "Le dessalement de l'eau de mer est la production d'eau douce par dessalement de l'eau de mer. C'est une technologie incrémentale à source ouverte pour réaliser l'utilisation des ressources en eau. Elle peut augmenter la quantité totale d'eau douce et n'est pas affectée par le temps, l'espace et le climat. Elle peut assurer un approvisionnement en eau stable pour l'eau potable des résidents côtiers et l'appoint en eau des chaudières industrielles. Au cours de la période du 11e plan quinquennal, le dessalement de l'eau de mer de mon pays s'est développé rapidement. Fin 2010, plus de 70 usines de dessalement d'eau de mer avaient été construites, avec une capacité conçue de 600 000 mètres cubes par jour, et un taux de croissance annuel moyen de plus de 60 %."
CHI_a_Community_with_a_Shared_Future_for_Mankind: "§CUne communauté de destin pour l'humanité§!"
CHI_a_Community_with_a_Shared_Future_for_Mankind_desc: "§CChacun apprécie sa propre beauté, apprécie la beauté des autres, et partage la beauté, et le monde est uni§!\nL'humanité n'a qu'une seule terre et un seul monde. Peu importe où se trouvent les gens, quelles que soient leurs croyances, ou qu'ils le veuillent ou non, ils sont en réalité dans une communauté de destin. Dans le même temps, un système de valeurs mondial visant à répondre aux défis communs auxquels est confrontée l'humanité a commencé à prendre forme et a progressivement obtenu un consensus international.\nNotre grande cause n'est en aucun cas limitée à la Chine. Nous travaillerons avec tous les pays et toutes les nations du monde pour construire une terre magnifique plus prospère, pacifique et stable. Ce n'est pas seulement la voix du peuple chinois, mais aussi le souhait commun de tous les peuples du monde."
CHI_Good_Neighbourliness: "Bon voisinage"
CHI_Good_Neighbourliness_desc: "Depuis l'effondrement de l'Union soviétique, la Russie a été en proie à l'agitation et à la pauvreté. Nous avons maintenu une attitude diplomatique pacifique, n'intervenant pas dans leurs affaires, et ne saisissant pas les zones frontalières contestées. Maintenant que la Russie a un nouveau président, nous pouvons saisir cette opportunité pour nous mettre d'accord sur la frontière et continuer à maintenir de bonnes relations entre les deux parties."
CHI_APEC: "Coopération économique Asie-Pacifique"
CHI_APEC_desc: "L'APEC est un forum important de coopération économique dans la région Asie-Pacifique et l'organisation de coopération économique intergouvernementale de plus haut niveau dans la région. En octobre 2001, la réunion informelle des dirigeants de l'APEC s'est tenue à Shanghai, en Chine. C'était la première fois que la réunion de l'APEC se tenait en Chine. La réunion avait pour thème "Nouveau siècle, nouveaux défis : participation, coopération et promotion de la prospérité commune". La réunion a échangé des vues approfondies sur la situation économique mondiale actuelle, l'impact de l'incident du "11 septembre" sur le développement économique, le renforcement des capacités en matière de ressources humaines et la direction future du développement de l'APEC, et a atteint un large consensus."
CHI_Counterintelligence: "Contre-espionnage"
CHI_Counterintelligence_desc: "Afin de protéger la sécurité des informations et des renseignements de notre pays, nous devons éliminer toutes sortes de forces d'espionnage nationales."
CHI_Combat_Islamism: "Combattre l'idéologie extrémiste"
CHI_Combat_Islamism_desc: "L'islam est une foi largement répandue dans mon pays, ses principaux adeptes étant les Ouïghours et les Huis. Les Ouïghours sont nos compatriotes dans la construction de la Chine socialiste, et l'islam n'est pas en conflit avec la cause du Parti et du pays. Cependant, certains séparatistes extrémistes ont malicieusement utilisé l'islam pour inciter et promouvoir des idées séparatistes, ce qui a eu un très mauvais impact social et a empoisonné l'esprit des musulmans de notre pays. Nous devons clairement éliminer ces extrémistes et rendre à l'islam sa pureté et sa beauté."
CHI_Peoples_Daily: "Quotidien du peuple"
CHI_Peoples_Daily_desc: "Le Quotidien du peuple est le journal officiel du Comité central du Parti communiste chinois et le journal le plus influent de mon pays. Nous pouvons promouvoir l'influence du Quotidien du peuple en ligne afin qu'il puisse également jouer le rôle de porte-parole officiel des médias sur Internet."
CHI_Xinhua_News_Agency: "Agence de presse Xinhua"
CHI_Xinhua_News_Agency_desc: "L'Agence de presse Xinhua, ou Xinhua News Agency en abrégé, est l'agence de presse nationale de la Chine et une agence de presse mondiale. Nous pouvons utiliser cette organisation pour créer un site web d'actualités clé et former un grand groupe de sites web nationaux en hébergeant une série de grands sites web gouvernementaux."
CHI_guancha_cn: "guancha.cn"
CHI_guancha_cn_desc: "Il existe de nombreux sites web d'actualités et de commentaires à l'étranger qui se consacrent à fournir aux internautes des programmes de commentaires politiques. Nous devrions également mettre en place un tel programme et organiser des personnes qui parlent au nom du gouvernement pour qu'elles soient commentateurs."
CHI_xuexi_cn: "Étudier pour renforcer la nation"
CHI_xuexi_cn_desc: "Les jeunes sont faciles à former et à rallier. Nous devrions créer une plateforme d'application qui offre des ressources d'apprentissage gratuites et des cours idéologiques officiels, afin que les jeunes puissent discuter en vidéo avec des amis, envoyer des messages, créer des calendriers personnels, obtenir des informations des médias d'État ou regarder des séries télévisées sur l'histoire du Parti communiste chinois sur la plateforme, afin d'atteindre un apprentissage "organisé, géré, guidé et servi"."
CHI_Network_keywords: "Blocage de mots-clés sur Internet"
CHI_Network_keywords_desc: "Internet offre à chacun la possibilité de s'exprimer publiquement, y compris les discours extrémistes et nuisibles. Identifier et supprimer ces discours est un projet énorme. Il est préférable de bloquer simplement certains mots-clés afin que ces mots n'apparaissent jamais dans le cyberespace. En effectuant un filtrage et un blocage ciblés des mots-clés susceptibles d'avoir un potentiel de criminalité ou de cyberviolence, nous pouvons souvent prévenir les crimes avant qu'ils ne se produisent et étouffer dans l'œuf les actes criminels graves."
CHI_Internet_police: "Police de l'Internet"
CHI_Internet_police_desc: "Selon l'article 6 de la loi sur la police populaire de la République populaire de Chine, la police populaire doit exercer les fonctions de "supervision et de gestion de la sécurité des systèmes d'information informatiques" conformément à la loi. En ce sens, les policiers qui sont engagés dans la supervision de la sécurité des réseaux d'information publique devraient être appelés "police de l'Internet". La fonction moderne de la police de l'Internet est la caractéristique la plus distinctive de la police de l'Internet, car leur devoir est de mener des recherches en ligne pour prévenir et traquer les fantômes de divers mauvais comportements et activités criminelles qui peuvent être commis en quelques secondes et ne laisser presque aucune trace."
CHI_Online_anti_pornography_campaign: "Action Internet propre"
CHI_Online_anti_pornography_campaign_desc: "Dès que vous utilisez Internet, vous êtes facilement harcelé par des sites web pornographiques, ce qui vous dégoûte extrêmement. C'est l'expérience personnelle de nombreux internautes. Selon les statistiques, il existe plus de 370 millions de sites web pornographiques sur Internet, et environ 20 000 photos pornographiques entrent sur Internet chaque jour. Les jeunes internautes souffrent de l'érosion des mauvaises informations sur les sites web pornographiques. Il est donc impératif de freiner le "poison pornographique" sur Internet et de frapper fort."
CHI_online_water_army: "L'armée de l'eau contrôle les commentaires"
CHI_online_water_army_desc: "Nous ne pouvons pas fermer tous les espaces de commentaires ou filtrer tous les discours en ligne, mais nous pouvons diluer les autres discours qui ne sont pas d'accord avec les opinions officielles en créant un grand nombre de discours qui nous sont favorables."
CHI_pinduoduo: "Pinduoduo"
CHI_pinduoduo_desc: "Pinduoduo a été fondé en avril 2015 et est une plateforme d'application de commerce électronique grand public sur l'Internet mobile en Chine. C'est une plateforme de commerce électronique sociale tierce axée sur l'achat groupé C2M. Les utilisateurs peuvent acheter des produits de haute qualité à un prix inférieur en initiant des achats groupés avec des amis, la famille, les voisins, etc."
CHI_Baidu_Tieba: "Baidu Tieba"
CHI_Baidu_Tieba_desc: "Baidu Tieba est la première communauté chinoise au monde. Son répertoire Tieba couvre tous les aspects de la société, de la région, de la vie, de l'éducation, des célébrités du divertissement, des jeux, des sports, des entreprises, etc. C'est la première plateforme de communication chinoise au monde. Elle offre aux gens un espace en ligne gratuit pour exprimer et échanger des idées, et rassemble des internautes partageant les mêmes idées."
CHI_Bilibili: "Bilibili"
CHI_Bilibili_desc: "Les communautés vidéo occidentales telles que YouTube ont peu d'influence en Chine, mais nous avons aussi notre propre excellente communauté vidéo. Bilibili était à l'origine une communauté bidimensionnelle, et est maintenant devenue la communauté vidéo en ligne la plus influente en Chine."
CHI_Mihoyo: "mihoyo"
CHI_Mihoyo_desc: "MiHoYo Network Technology Co., Ltd. est une société chinoise de développement et d'édition de jeux vidéo. En plus des jeux, la société crée également une variété de produits tels que des séries animées, des romans, des bandes dessinées, de la musique et des marchandises."
CHI_Tik_Tok: "TikTok"
CHI_Tik_Tok_desc: "TikTok est un service d'hébergement de vidéos courtes originaire de Chine. Il héberge des vidéos soumises par les utilisateurs dont la durée varie de 3 secondes à 10 minutes. La popularité de TikTok a conduit à l'influence culturelle croissante de la plateforme dans le monde entier."
CHI_Little_Red_Book: "REDnote"
CHI_Little_Red_Book_desc: "REDnote est une plateforme de style de vie et un portail de décision d'achat fondé par Mao Wenchao et Qu Fang à Shanghai en 2013. Le modèle de vente raffiné de REDnote en a fait la plus grande base de données mondiale de bouche-à-oreille de consommateurs, reliant les consommateurs chinois et les marques exceptionnelles."
CHI_strict_check_Japanese_anime: "Contrôle strict des animés japonais"
CHI_strict_check_Japanese_anime_desc: "Les animés japonais jouissent d'une grande réputation dans le monde, sont de qualité supérieure et sont profondément aimés par le peuple chinois. Cependant, ils contiennent de nombreux éléments vulgaires, violents, sombres et autres éléments malveillants, qui sont toujours nuisibles à l'esprit des mineurs de mon pays. En réponse au problème de certains vidéos d'animé contenant du contenu nuisible à la santé physique et mentale des mineurs entrant dans le pays, le ministère de la Culture a immédiatement déployé un travail de nettoyage et d'enquête, a strictement contrôlé les produits culturels Internet et les unités culturelles Internet pertinents, a résolument protégé les droits et intérêts culturels des mineurs, et a créé un bon environnement social et culturel pour la croissance saine des mineurs."
CHI_ban_Korean_culture: "Interdire la culture coréenne"
CHI_ban_Korean_culture_desc: "La culture de la Vague coréenne est très populaire dans notre pays, en particulier chez les jeunes femmes. Bien que nous n'ayons pas trop de conflits d'intérêts avec la Corée du Sud, les États-Unis derrière la Corée du Sud essaient toujours d'utiliser la Corée du Sud comme un outil pour s'ingérer dans notre pays. Il peut être confirmé que la Vague coréenne est utilisée comme une stratégie d'invasion culturelle. La culture est l'âme d'une nation. Nous ne pouvons pas laisser la culture des membres du camp des peuples hostiles s'implanter dans notre pays."
CHI_Network_censorship: "Censure sur Internet"
CHI_Network_censorship_desc: "La culture Internet est un nouveau domaine culturel émergent. Nous devrions renforcer la censure de ce domaine pour nous assurer qu'aucune information nuisible ne met en danger le peuple et la sécurité nationale de notre pays."
CHI_Developing_local_network_culture: "Culture Internet locale"
CHI_Developing_local_network_culture_desc: "Avec des milliers d'années d'histoire et une population de plus d'un milliard d'habitants, nous pouvons créer de nombreux excellents nouveaux produits culturels Internet qui sont en phase avec leur temps."

CHI_Transformation_Official_Media: "Transformation des médias officiels"
CHI_Transformation_Official_Media_desc: "Alors que nous entrons dans l'ère d'Internet, les médias officiels traditionnels devraient saisir l'occasion de s'adapter à cette nouvelle plateforme."
CHI_Incorporate_Self_Media: "Nouveaux médias locaux"
CHI_Incorporate_Self_Media_desc: " "
CHI_Create_Feedback_Platform: "Plateforme de commentaires"
CHI_Create_Feedback_Platform_desc: " "
CHI_Government_Affairs_System: "Système de traitement des affaires gouvernementales"
CHI_Government_Affairs_System_desc: " "

#\n"Genshin Impact" is a globally popular open world action role-playing game produced by miHoYo.
#Diplomatic Policy
CHI_great_power_diplomacy: "Diplomatie de grande puissance"
CHI_great_power_diplomacy_desc: "§YLes héros se révèlent en période de turbulence, et les piliers de soutien se révèlent en période de vagues orageuses§!\n\nLa diplomatie de grande puissance de la Chine est l'héritage et le développement des idées et concepts diplomatiques qui sont cohérents depuis la fondation de la République populaire de Chine dans la nouvelle ère."
CHI_carrots: "Douceur et retenue"
CHI_carrots_desc: "Gagner les gens lointains, c'est les maîtriser.\nGagner les gens lointains, c'est les maîtriser, et personne ne manquera de venir.\nRendre hommage à toutes les nations, maintenir la culture et succéder aux centaines de rois.\nLes portes du palais sont ouvertes, et les gens de toutes les nations rendent hommage à l'empereur."
CHI_Wolf_Warriors_diplomacy: "Diplomatie des guerriers loups"
CHI_Wolf_Warriors_diplomacy_desc: "Rendre la gentillesse par la gentillesse, et rendre le mal par la justice.\nLa poussière ne disparaîtra pas sans balai.\nLa diplomatie pacifique de notre pays ne signifie pas que nous n'utiliserons pas d'armes tranchantes.\nUn gentleman est celui qui est bien élevé et raffiné."
CHI_South_China_Sea_issue: "Question de la mer de Chine méridionale"
CHI_South_China_Sea_issue_desc: "L'importance stratégique et économique de la mer de Chine méridionale ne saurait être surestimée. Pendant des milliers d'années, mon pays a eu une souveraineté et une juridiction incontestables sur la mer de Chine méridionale. Cependant, dans les temps modernes, pour diverses raisons, les pays voisins ont illégalement occupé de nombreuses îles et récifs dans la mer de Chine méridionale, laissant la mer de Chine méridionale qui appartenait à l'origine à mon pays fragmentée. Nous devrions choisir soigneusement nos contre-mesures diplomatiques, maintenir une attitude gagnant-gagnant et remporter la victoire diplomatique."
CHI_Communicate_with_Malaysia: "Communiquer avec la Malaisie"
CHI_Communicate_with_Malaysia_desc: "Nous avons déjà obtenu des succès diplomatiques avec le Vietnam et les Philippines. Les revendications territoriales de la Malaisie sur les îles de la mer de Chine méridionale ne sont pas aussi fortes que celles des deux autres pays, et nous pouvons faire de même pour récupérer la dernière île."
CHI_Taiwan_issue: "Question de Taïwan"
CHI_Taiwan_issue_desc: "Il n'y a qu'une seule Chine dans le monde. Taïwan est un territoire sacré inaliénable de la Chine et une fleur de la Chine qui doit être cueillie sur la voie du grand renouveau de la nation chinoise. Résoudre la question de Taïwan et réaliser la réunification complète de la mère patrie est la mission historique inébranlable du Parti, l'aspiration commune de tout le peuple chinois, et l'exigence inévitable pour réaliser le grand renouveau de la nation chinoise. Nous devons adhérer et mettre en œuvre la stratégie globale du Parti pour résoudre la question de Taïwan dans la nouvelle ère, saisir fermement la position dominante et l'initiative dans les relations inter-détroit, et faire avancer sans relâche la grande cause de la réunification nationale."
CHI_Peaceful_Co_Existence: "Résolution pacifique"
CHI_Peaceful_Co_Existence_desc: "Taïwan est le territoire inhérent de notre pays, et le peuple taïwanais est nos compatriotes. Nous devrions montrer un amour plus doux aux enfants de la mère patrie."
CHI_Settle_Territorial_Disputes: "La propriété des îles est claire"
CHI_Settle_Territorial_Disputes_desc: "Taïwan contrôle de nombreuses îles que nous considérons comme faisant partie du Fujian, du Guangdong, du Hainan, etc. Nous pourrions obtenir des concessions en reconnaissant l'autorité taïwanaise sur ces îles."
CHI_Sign_an_Armistice: "Engagement Un pays, deux systèmes"
CHI_Sign_an_Armistice_desc: "Le principe "un pays, deux systèmes" est une grande innovation du socialisme à caractéristiques chinoises et le meilleur arrangement institutionnel pour maintenir la prospérité et la stabilité à long terme à Hong Kong et à Macao après leur retour. De nombreux compatriotes taïwanais s'inquiètent de la nature administrative de Taïwan après son retour. Nous pouvons apaiser leurs inquiétudes en promettant d'établir une région administrative spéciale."
CHI_people_to_people_exchange: "Échanges interpersonnels"
CHI_people_to_people_exchange_desc: "Les populations des deux rives ont depuis longtemps des échanges approfondis à travers diverses plateformes et canaux. La reconnaissance mutuelle et l'acceptation entre les populations est le meilleur moteur de notre unification."
CHI_Development_Assistance_TAI: "Aide au développement"
CHI_Development_Assistance_TAI_desc: "Taïwan n'a pas la capacité suffisante pour rénover ses villes délabrées, ni la capacité d'étendre ses industries avantageuses. Nous pouvons certainement prendre soin de cet enfant dans le besoin."
CHI_Rigging_elections: "Trucage des élections"
CHI_Rigging_elections_desc: "Si les autorités taïwanaises ne peuvent pas garantir que le camp bleu anti-indépendance arrive au pouvoir, alors nous allons "stimuler" le camp bleu..."
CHI_Joint_military_exercises_TAI: "Exercices militaires conjoints dans le détroit de Taïwan"
CHI_Joint_military_exercises_TAI_desc: "Mener conjointement un exercice militaire à grande échelle impliquant tous les aspects des forces maritimes, terrestres et aériennes dans le détroit de Taïwan ne brisera pas seulement la dernière fantaisie de tous les séparatistes, mais montrera également au monde que la cause du retour de Taïwan est imparable."
CHI_Establish_Taiwan_SAR: "Établir la RAS de Taïwan"
CHI_Establish_Taiwan_SAR_desc: "Maintenant que les préparatifs sont terminés, il est temps pour le peuple de Taïwan de se réunir avec ses compatriotes continentaux dans le cadre de la République populaire de Chine. Bien que Taïwan conserve encore un certain degré d'autonomie, notre objectif d'unifier la mère patrie est maintenant atteint. Après des décennies, notre pays est enfin intact, et la dernière perle sur la route du grand renouveau de la nation chinoise est enfin revenue à la maison."
CHI_Warning_to_the_United_States: "Avertissement aux États-Unis"
CHI_Warning_to_the_United_States_desc: "Taïwan est la Taïwan de la Chine. Résoudre la question de Taïwan est l'affaire du peuple chinois et devrait être décidé par le peuple chinois. Nous sommes sur le point de libérer Taïwan, et les États-Unis doivent tenir leur promesse de ne pas s'ingérer dans les affaires intérieures de la Chine."
CHI_Resume_the_Civil_War: "Reprendre la guerre civile"
CHI_Resume_the_Civil_War_desc: "Après la libération de l'île de Hainan en 1950, la dictature démocratique populaire de la république socialiste a été établie sur le continent de mon pays, renversant le régime réactionnaire de l'impérialisme, du féodalisme et du capitalisme bureaucratique. Cependant, le groupe réactionnaire de Chiang Kai-shek a fui à Taïwan, a occupé l'île en tant que bandit, a divisé notre pouvoir politique et a sapé notre intégrité territoriale. Afin de libérer nos compatriotes à Taïwan, nous devons persister dans la lutte révolutionnaire. Nous balayerons tous les monstres et démons qui entravent la réunification de la mère patrie."
CHI_Towards_the_final_victory: "Vers la victoire finale..."
CHI_Towards_the_final_victory_desc: "Écoutez ! Le vent siffle et le clairon sonne !\nÉcoutez ! Les chants révolutionnaires sont si forts !\nLes camarades marchent à l'unisson vers le champ de bataille de la libération\nLes camarades marchent à l'unisson vers les frontières de la mère patrie"
CHI_Towards_the_liberation_of_the_whole_country: "Vers la libération de tout le pays !"
CHI_Towards_the_liberation_of_the_whole_country_desc: "En avant ! En avant !\nNos troupes se dirigent vers le soleil\n§YVers la victoire finale !§!\n§RVers la libération de tout le pays !§!"
CHI_End_of_ROC: "Pinceau de perles"
CHI_End_of_ROC_desc: "La guerre de libération de la mère patrie s'est terminée par la victoire complète de l'Armée populaire de libération et du Gouvernement populaire central. Les réactionnaires impérialistes ont été complètement éliminés de Chine. Taïwan, la perle de la mer, a enfin essuyé des décennies de poussière et est revenue dans la famille unie de la mère patrie."
CHI_ultimatum: "Ultimatum"
CHI_ultimatum_desc: "Donner aux autorités taïwanaises une dernière chance de résoudre la question pacifiquement. La Chine sera sûrement unifiée. Ne dites pas que je ne vous ai pas prévenu."
CHI_rule_all_the_land: "Toute la terre est unifiée"
CHI_rule_all_the_land_desc: "§YLes Quatre Mers sont une seule famille, les deux fleuves et les centaines de comtés sont les montagnes et les rivières de la dynastie Song§!\n\nLa roue historique de la réunification nationale et du renouveau national roule en avant. La réunification complète de la mère patrie doit être réalisée et elle le sera certainement. Aujourd'hui, nous avons enfin achevé la réunification de la mère patrie socialiste. Le grand voyage du socialisme à caractéristiques chinoises a fait un nouveau pas en avant. La grande cause du grand renouveau de la nation chinoise est encore plus proche de nous !"
CHI_the_Middle_East: "Moyen-Orient"
CHI_the_Middle_East_desc: "Le Moyen-Orient est l'une des régions les plus importantes d'Asie. Après la fin de la Seconde Guerre mondiale, en raison de la situation compliquée et de la découverte de riches ressources pétrolières, il est devenu un échiquier pour les superpuissances. Les conflits ont été fréquents et les peuples du Moyen-Orient ont vécu dans une détresse extrême. En tant que grand pays responsable, nous avons l'obligation de maintenir la stabilité et l'équilibre au Moyen-Orient tout en élargissant notre influence."
CHI_Scholars_on_the_Silk_Road: "Érudits sur la Route de la Soie"
CHI_Scholars_on_the_Silk_Road_desc: "L'Iran est l'une des civilisations antiques célèbres. Le peuple persan antique, travailleur et courageux, a créé une culture brillante, notamment en médecine, astronomie, mathématiques, agriculture, architecture, musique, philosophie, histoire, littérature, art et artisanat. Nos deux pays doivent chérir l'amitié historique et approfondir la coopération à l'époque contemporaine."
CHI_Invite_to_join_the_SCO: "Inviter l'Iran à rejoindre l'OCS"
CHI_Invite_to_join_the_SCO_desc: "Les revendications géopolitiques de l'Iran coïncident avec les nôtres. L'OCS a été créée pour maintenir la stabilité régionale et promouvoir le développement de ses États membres. Nous devrions inviter ce frère du Moyen-Orient à rejoindre l'OCS pour approfondir et coordonner davantage notre relation de coopération."
CHI_Development_Assistance_PER: "Aide au développement de l'Iran"
CHI_Development_Assistance_PER_desc: "L'Iran est prudent vis-à-vis de l'aide internationale. Affecté par les sanctions américaines et l'isolement diplomatique à long terme de l'Occident, il accepte rarement l'aide d'organisations internationales, d'institutions financières internationales et d'autres pays. Même s'il le fait, cela se fait sous le nom de coopération internationale, principalement dans le domaine humanitaire non sanctionné, principalement sous forme de matériel, et à petite échelle. Nous aiderons l'Iran à construire son économie sous forme de signature de commandes commerciales."
CHI_Strategic_partners_PER: "Partenaires stratégiques"
CHI_Strategic_partners_PER_desc: "Les intérêts du peuple chinois sont certainement en accord avec ceux du peuple iranien. La coopération entre la Chine et l'Iran devrait être davantage approfondie pour former un partenariat stratégique profond."
CHI_Oil_Kingdom: "Royaume pétrolier"
CHI_Oil_Kingdom_desc: "L'Arabie saoudite est l'un des pays avec les plus grandes réserves de pétrole au monde. La construction d'une plateforme de dialogue amicale avec ce royaume pétrolier royal et suprême contribuera à renforcer notre influence au Moyen-Orient."
CHI_order_for_goods_of_SINOPEC: "Commande pour Sinopec"
CHI_order_for_goods_of_SINOPEC_desc: "La Chine doit importer une grande quantité de pétrole chaque année, et l'Arabie saoudite est l'un de nos plus grands importateurs de pétrole. Nous pouvons approfondir nos échanges économiques avec l'Arabie saoudite en signant une commande de pétrole avec l'entreprise d'État Sinopec, tout en aidant la production pétrolière de l'Arabie saoudite. Bien sûr, l'argent est effectivement payé par le gouvernement."
CHI_Silk_Road_tycoon: "Tycoon de la Route de la Soie"
CHI_Silk_Road_tycoon_desc: "L'Initiative la Ceinture et la Route est bien sûr indissociable de la riche Arabie saoudite. Bien que l'Arabie saoudite ne soit pas un pays pauvre et arriéré, elle importe un grand nombre de produits de consommation et industriels nationaux chaque année. Nous pouvons fournir des vendeurs suffisamment abordables grâce à la stratégie de l'Initiative la Ceinture et la Route."
CHI_Selling_Arms_SAU: "Vente d'armes"
CHI_Selling_Arms_SAU_desc: "Nous avons une histoire de commerce d'armes avec l'Arabie saoudite. L'Arabie saoudite a besoin d'armes suffisamment sophistiquées pour se protéger. Les armes que nous fabriquons sont de bonne qualité et à bas prix. La famille royale saoudienne est très friande d'acheter nos armes. Nous pouvons approfondir les échanges entre les deux parties et stimuler le développement de l'industrie militaire nationale en vendant des armes à l'Arabie saoudite."
CHI_cradle_of_civilization: "Berceau de la civilisation"
CHI_cradle_of_civilization_desc: "L'Irak a une longue histoire, et la vallée de Mésopotamie est l'un des berceaux des civilisations antiques. Cette ancienne civilisation est maintenant dévastée. Les crimes commis par l'armée laquais impérialiste américaine au nom de la guerre contre le terrorisme sont trop nombreux pour être énumérés. Nous devrions établir des relations amicales et coopératives avec ce pays souffrant. C'est le souhait et la demande communs des peuples des deux pays."
CH_Icultural_exchange_IRQ: "Échange culturel"
CH_Icultural_exchange_IRQ_desc: "La Chine et l'Irak sont tous deux l'une des quatre civilisations antiques et ont un consensus historique. Nous commencerons par les brillantes réalisations culturelles antiques et les échanges amicaux entre les deux pays pour réchauffer les échanges entre les deux gouvernements."
CH_Oil_orders: "Commandes de pétrole"
CH_Oil_orders_desc: "L'Irak est la troisième plus grande source d'importation de pétrole brut de mon pays, et mon pays est le plus grand partenaire commercial de l'Irak. L'achat de plus de pétrole favorisera grandement l'approfondissement de la coopération entre les deux pays et élargira l'influence économique de mon pays sur l'Irak."
CHI_Silk_Road_IRQ: "Expansion de l'Initiative la Ceinture et la Route"
CHI_Silk_Road_IRQ_desc: "L'Irak est généralement un pays asiatique relativement pauvre et arriéré. Dans le cadre de l'Initiative la Ceinture et la Route, mon pays a l'obligation d'aider l'Irak à développer sa construction nationale."
CHI_The_Diaoyu_Islands_issue: "Question des îles Diaoyu"
CHI_The_Diaoyu_Islands_issue_desc: "Les îles Diaoyu et ses îles affiliées sont le territoire inhérent de la Chine depuis l'Antiquité, et la Chine a une base historique et juridique suffisante pour cela. Le Japon a ignoré un grand nombre de faits historiques et a prétendu que les îles Diaoyu sont le "territoire inhérent" du Japon. Il a illégalement occupé les îles pendant longtemps, portant gravement atteinte à la souveraineté territoriale de mon pays et sapant l'intégrité territoriale de mon pays. Nous devons frapper les nationalistes japonais obstinés dès que possible."
CHI_Provocative_Fleet_Exercises: "Exercices de flotte provocateurs"
CHI_Provocative_Fleet_Exercises_desc: "Pour sauvegarder notre souveraineté sur les îles Diaoyu et la mer de Chine orientale, nous devrions utiliser la marine de l'Armée populaire de libération pour mener des exercices navals dans les eaux des îles Diaoyu. Bien que pour nous, cette action représente une expression légitime de notre souveraineté, les États-Unis et d'autres pays pourraient considérer cette action comme une menace et risquer une confrontation armée en envoyant également des forces navales dans la région."
CHI_Demand_a_Withdrawal: "Exiger le retrait des troupes américaines d'Okinawa"
CHI_Demand_a_Withdrawal_desc: "La base militaire américaine à Okinawa est un clou planté à la porte de notre mer, prêt à percer le cœur de notre marine, qui n'est pas encore forte. Si mon pays veut parvenir à un grand renouveau, il doit faire le ménage et se débarrasser des cafards, des rats et de l'impérialisme."
CHI_Questioning_Okinawa_sovereignty: "Remise en question de la souveraineté du Japon sur Okinawa"
CHI_Questioning_Okinawa_sovereignty_desc: "Okinawa s'appelait à l'origine Ryukyu. C'était un État vassal de la Chine pendant les dynasties Ming et Qing. Okinawa était le nom imposé par le Japon après qu'il se soit emparé de l'endroit. Après la défaite du Japon dans la Seconde Guerre mondiale, il a été occupé par les États-Unis, ce qui a été appelé "prise de contrôle" par les États-Unis. En 1971, les États-Unis et le Japon ont secrètement signé l'"Accord de restitution d'Okinawa". En mai 1972, le pouvoir administratif d'Okinawa a été illégalement transféré au Japon par les États-Unis. Depuis lors, le Japon exerce illégalement sa juridiction sur Okinawa.\nOkinawa est un pays indépendant et un voisin amical de notre pays. Le Japon doit mettre fin à son occupation illégale d'autres pays !"
CHI_Strike_Across_the_Himalayas: "Récupérer le Tibet méridional"
CHI_Strike_Across_the_Himalayas_desc: "Le Tibet méridional est l'endroit avec les ceintures naturelles verticales de montagne les plus complètes au monde, et c'est aussi un lieu important pour observer le changement climatique mondial. Cependant, une telle partie du territoire de la mère patrie est illégalement occupée par les autorités indiennes depuis longtemps, et les habitants locaux ne peuvent pas retourner dans leur mère patrie. Nous devons maintenir l'intégrité territoriale à tout prix !"
CHI_maintain_order: "Maintenir l'ordre"
CHI_maintain_order_desc: "Le monde est tombé dans le chaos. Les grandes puissances ne se soucient que de leurs propres intérêts et ne maintiennent plus la paix mondiale. La Chine représentera l'armée de la justice pour anéantir tous les envahisseurs impérialistes. Nous allons reconstruire un ordre mondial pacifique."
CHI_The_Northern_Shiled: "Le Bouclier du Nord"
CHI_The_Northern_Shiled_desc: ""Récupérer le Xinjiang, c'est protéger la Mongolie, protéger la Mongolie, c'est défendre la capitale"\n\nBien que la Mongolie extérieure ait été séparée de la Chine par un traité conclu entre les grandes puissances et le lâche gouvernement nationaliste à la fin de la Seconde Guerre mondiale, notre peuple n'a jamais oublié que la Mongolie est toujours une partie indissociable de notre pays. Nous devons exercer notre influence dans cette région."
CHI_PER_SAU_compromise: "Réconciliation entre l'Arabie saoudite et l'Iran"
CHI_PER_SAU_compromise_desc: "Pour des raisons historiques et politiques, l'Arabie saoudite et l'Iran ont de profonds différends diplomatiques et même de l'hostilité. Si ces deux puissances régionales maintiennent toujours des relations tendues, cela sera préjudiciable au maintien de la paix et de la stabilité au Moyen-Orient. Heureusement, nous avons une certaine influence sur les deux pays. Nous pouvons peut-être agir en tant que pacificateur et essayer d'apaiser autant que possible la relation saoudo-iranienne."
CHI_utilize_Industrial_dependence: "Utiliser la dépendance industrielle"
CHI_utilize_Industrial_dependence_desc: "Autrefois, nous étions un pays manufacturier arriéré qui recevait des transferts industriels de pays développés. Aujourd'hui, nous sommes une superpuissance qui contrôle la ligne de vie de la production mondiale. L'ère où un pays en exploitait un autre devrait être révolue. Nous devons nous unir aux autres pays exploités pour résister au système d'intérêts privilégiés internationaux centré sur les États-Unis !"
CHI_aer_aer_port: "Port d'Aer Aer"
CHI_aer_aer_port_desc: "L'Arabie saoudite et l'Irak ont eu une relation anormale pendant de nombreuses années. Nous comprenons que l'Arabie saoudite espère rapprocher l'Irak d'elle-même dans le jeu avec l'Iran. Nous pouvons saisir cette opportunité pour promouvoir la normalisation progressive des relations entre les deux pays et étendre notre voix au Moyen-Orient."
CHI_Oppose_international_exploitation: "S'opposer à l'exploitation internationale"
CHI_Oppose_international_exploitation_desc: "Le système d'intérêts existant ne peut être maintenu que s'il existe des bénéficiaires particulièrement importants et puissants. L'ordre international dirigé par les États-Unis est généralement soutenu par les pays développés, et ils sont également les bénéficiaires de cet ordre. Par le biais de transferts industriels, de l'externalisation du travail, de la manipulation des marchés boursiers et d'autres formes, ces pays développés ont maintenu leur statut supérieur en exploitant les pays arriérés. Nous devrions les laisser se joindre à la lutte contre l'hégémonie américaine - à moins qu'ils n'aient l'intention de continuer à maintenir leur statut de laquais américains."
CHI_End_US_Hegemony: "Fin de l'hégémonie américaine"
CHI_End_US_Hegemony_desc: "L'ordre hégémonique a besoin de trois types de pouvoir comme fondement, à savoir le pouvoir matériel, le pouvoir institutionnel et le pouvoir légal. Pendant longtemps, les États-Unis se sont appuyés sur leur statut international unique et leurs avantages pour intimider tous les pays du monde et faire payer tous les pays pour leur comportement scandaleux. La crise financière mondiale de 2008 a été à la fois le sommet de l'ordre hégémonique américain et le début de son abdication. Aujourd'hui, avec le grand renouveau de la nation chinoise, mon pays a dépassé les États-Unis en termes de force nationale globale. L'ère de l'hégémonie américaine en tant qu'ancien ordre est terminée, et le capitalisme impérial représenté par l'impérialisme américain a atteint sa fin."
CHI_The_Fate_of_the_Paracels: "Négociations avec le Vietnam"
CHI_The_Fate_of_the_Macclesfield_Bank: "Négociations avec les Philippines"
CHI_national_security: "Sécurité de la défense nationale"
CHI_national_security_desc: "Les peuples des pays africains sont soumis à une instabilité politique et à des menaces militaires à tout moment. En tant qu'amis des peuples africains et des pays du tiers monde, nous devons les aider à protéger leur propre sécurité et à renforcer leur défense nationale."
CHI_Friends_of_Africa: "Amis d'Afrique"
CHI_Friends_of_Africa_desc: "Grâce à l'aide continue de notre pays, ce continent africain ancien et vibrant se rétablit lentement. Autrefois, nous avons été portés aux Nations Unies par nos frères africains, et maintenant nous méritons le titre d'Amis d'Afrique."

##Military National Policy##
CHI_Peoples_Liberation_Army: "§YL'Armée populaire de libération de Chine§!"
CHI_Peoples_Liberation_Army_desc: "L'Armée populaire de libération de Chine est la force armée la plus importante de notre pays. Afin de garantir que notre pays puisse disposer d'une armée populaire qui s'adapte aux changements de la nouvelle ère et défende notre grande mère patrie et le peuple, nous devons renforcer l'armée populaire."
PLA_Sharp_tools_make_good_work: "Si vous voulez faire un bon travail, vous devez d'abord affûter vos outils."
PLA_Sharp_tools_make_good_work_desc: "Pour bien faire son travail, il faut d'abord affûter ses outils. La force spirituelle et la prise de décision stratégique sont certainement des facteurs importants affectant la capacité de combat de l'armée, mais nous devrions utiliser pleinement nos fortes capacités de fabrication industrielle pour fournir un soutien matériel à l'armée."
CHI_Expand_THE_CSIC: "Développer CSIC"
CHI_Expand_THE_CSIC_desc: "La China State Shipbuilding Corporation est l'un des deux plus grands groupes de construction navale de mon pays, l'autre étant la China Shipbuilding Industry Corporation. Investir dans CSIC contribuera à développer l'industrie de la construction navale dans le nord de la Chine, où CSIC est le plus actif."
PLA_Bobcat_all_terrain_vehicle: "Véhicule tout-terrain Bobcat"
PLA_Bobcat_all_terrain_vehicle_desc: "Le véhicule tout-terrain Bobcat est un véhicule très pratique et polyvalent développé par notre pays. Il peut s'adapter aux besoins de diverses situations et est facile à associer à différentes armes et équipements."
PLA_officer_training_system: "Formation des officiers"
PLA_officer_training_system_desc: "Le cœur de la professionnalisation des officiers est la spécialisation. Nous devrions former un groupe de talents militaires capables de s'adapter au nouvel environnement militaire et de connaître la théorie militaire de la nouvelle ère pour injecter du sang neuf dans le corps des officiers."
PLA_Concentration_of_command_authority: "Concentration de l'autorité de commandement"
PLA_Concentration_of_command_authority_desc: "La manière d'être un général est de d'abord gouverner son esprit. Les idéaux élevés et les croyances fermes sont l'âme des soldats révolutionnaires et les facteurs décisifs pour vaincre l'ennemi et résister à la corruption. Nous devons saisir fermement la direction fondamentale de la formation des personnes avec intégrité morale, nous concentrer sur la formation de soldats révolutionnaires de la nouvelle ère avec "quatre qualités", et mettre l'accent sur l'éducation théorique innovante et l'éducation idéologique et politique du Parti comme contenu clé de l'éducation et de la formation des officiers. De l'éducation de base à l'éducation de promotion, de la formation des lieutenants à la formation des généraux, des officiers de commandement et de gestion aux officiers professionnels et techniques, nous devons toujours construire clairement une voie de la foi et établir la loyauté et la vertu, et véritablement transmettre le gène rouge de génération en génération pour garantir que tous les officiers et soldats de l'armée écoutent et suivent le Parti sans faillir."
PLA_Network_information_support: "Soutien à l'information réseau"
PLA_Network_information_support_desc: "L'ajustement et la mise en place de la force de soutien à l'information est une décision majeure prise par le Comité central du PCC et la Commission militaire centrale dans une perspective globale de renforcement de l'armée. C'est une mesure stratégique pour construire un nouveau type de structure militaire et améliorer le système moderne des forces militaires à caractéristiques chinoises. Elle a une signification grande et profonde pour accélérer la modernisation de la défense nationale et de l'armée et remplir efficacement la mission et les tâches de l'armée populaire dans la nouvelle ère. La force de soutien à l'information est une branche stratégique nouvellement créée de l'armée et un soutien clé pour la construction et l'utilisation globales du système d'information réseau. Elle joue un rôle important et a de grandes responsabilités dans la promotion du développement de haute qualité de notre armée et la victoire dans les guerres modernes."
PLA_Reserve_Force: "Force de réserve de l'Armée populaire de libération"
PLA_Reserve_Force_desc: "Les forces de réserve sont composées d'un petit nombre de soldats d'active comme noyau, avec des officiers et soldats de réserve comme base. Elles sont organisées selon l'organisation unifiée de l'Armée populaire de libération de Chine et appartiennent à l'Armée populaire de libération. En temps de paix, elles effectuent un entraînement militaire selon le plan de l'état-major général, s'efforcent d'améliorer leur qualité militaire et leurs capacités de mobilisation rapide, et peuvent aider à maintenir l'ordre social conformément aux dispositions légales si nécessaire. En temps de guerre, elles seront transférées aux forces d'active selon l'ordre de mobilisation émis par l'État."
PLA_National_University_of_Defense_Technology: "Université nationale des technologies de défense"
PLA_National_University_of_Defense_Technology_desc: "La vertu et la connaissance rendent l'armée forte et le pays prospère. L'Université nationale des technologies de défense est située à Changsha, province du Hunan. C'est une université militaire complète directement sous la direction de la Commission militaire centrale du Parti communiste chinois. Elle a toujours été une institution clé pour l'État et l'armée. Depuis la fondation de la République populaire de Chine, l'Université nationale des technologies de défense a formé d'innombrables talents militaires pour la mère patrie et a apporté de grandes contributions dans le domaine de la recherche en technologie militaire."
CHI_CPLA: "§YL'Armée de l'air de l'Armée populaire de libération§!"
CHI_CPLA_desc: "L'Armée de l'air de l'Armée populaire de libération a été officiellement établie le 11 novembre 1949. Après un développement et une construction continus, l'Armée de l'air chinoise est devenue une force militaire moderne de haute technologie composée de multiples armes telles que l'aviation, les missiles sol-air, l'artillerie antiaérienne, les radars, les parachutistes, la guerre électronique et la météorologie, et de multiples types d'aéronefs tels que les chasseurs, les avions d'attaque, les bombardiers et les avions de transport."
PLA_fighter_production: "Renforcer la production de chasseurs"
PLA_fighter_production_desc: "Les chasseurs sont les montures et l'âme de l'Armée de l'air. Nous devrions développer la technologie aéronautique de pointe aussi rapidement que possible et mettre à jour nos conceptions de chasseurs obsolètes."
PLA_domestic_helicopter_production: "Renforcer la production d'hélicoptères"
PLA_domestic_helicopter_production_desc: "Les hélicoptères jouent un rôle important sur les champs de bataille modernes. Nous devrions suivre la recherche et le développement dans ce domaine dès que possible."
PLA_Pilot_privileges: "Privilèges des pilotes"
PLA_Pilot_privileges_desc: "Le coût de formation d'un excellent pilote est plus élevé que la fabrication d'un avion. Nous devrions augmenter le coût de formation des pilotes et former rapidement un groupe de talents aériens."
PLA_Aerial_reconnaissance: "Reconnaissance aérienne"
PLA_Aerial_reconnaissance_desc: "Si nécessaire, nos avions peuvent espionner les renseignements militaires de l'ennemi et fournir un soutien aux opérations sur le champ de bataille frontal."
PLA_Chain_team_attack: "Attaque en chaîne"
PLA_Chain_team_attack_desc: "En entraînant l'escadre aérienne à adopter une stratégie d'engagement de combat de défense continue, l'efficacité au combat de l'armée de l'air peut être efficacement améliorée."
PLA_Ground_support: "Appui terrestre"
PLA_Ground_support_desc: "L'Armée de l'air peut infliger des dégâts dévastateurs aux forces de combat terrestres ennemies. Nous devrions améliorer les capacités de combat coordonnées de l'Armée de l'air."
PLA_Advanced_fighter_research: "Recherche et développement de chasseurs avancés"
PLA_Advanced_fighter_research_desc: "Chaque pays a ses propres idées sur la prochaine génération de chasseurs, et nous ne faisons pas exception."
CHI_PLAN: "§CLa Marine de l'Armée populaire de libération§!"
CHI_PLAN_desc: "La Marine de l'Armée populaire de libération a été établie le 23 avril 1949. La Marine de l'Armée populaire de libération se compose de forces navales, de forces sous-marines, de forces aériennes, de troupes de marine, de forces de défense côtière, etc., et a la capacité de combattre en surface, sous l'eau et dans les airs. La tâche principale de la Marine de l'Armée populaire de libération est de défendre, seule ou en coordination avec l'armée et l'armée de l'air, contre l'invasion ennemie depuis la mer, de sauvegarder la souveraineté territoriale et de protéger les droits et intérêts maritimes."
PLA_Blue_Water_Navy: "Flotte en haute mer"
PLA_Blue_Water_Navy_desc: "Par le passé, notre stratégie de construction navale était une flotte défensive pour les opérations près des côtes. À mesure que la souveraineté maritime devient de plus en plus importante à cette époque, nous devrions changer notre stratégie de construction navale. Il est urgent de construire une flotte en haute mer avec des capacités de combat océaniques."
PLA_Optimize_our_fleet: "Optimiser notre flotte"
PLA_Optimize_our_fleet_desc: "Nous devons d'abord mettre à jour notre mode de combat et former notre marine de manière plus moderne."
PLA_World_class_Navy: "Marine de classe mondiale"
PLA_World_class_Navy_desc: "Construire une marine moderne puissante est un symbole important de la construction d'une armée de classe mondiale, un soutien stratégique pour la construction d'une puissance maritime, et une partie importante de la réalisation du rêve chinois du grand renouveau de la nation chinoise. Sur le chemin de la nouvelle ère, dans la lutte pour réaliser le grand renouveau de la nation chinoise, la tâche de construire une marine populaire forte n'a jamais été aussi urgente qu'aujourd'hui."
CHI_CPLA_Ground_Force: "§GL'Armée de terre de l'Armée populaire de libération§!"
CHI_CPLA_Ground_Force_desc: "L'Armée de terre de l'Armée populaire de libération est la principale branche de l'Armée populaire de libération et la force principale dans les opérations terrestres. Elle a la plus longue histoire parmi toutes les branches de l'Armée populaire de libération et a obtenu les meilleurs résultats dans toutes les opérations avant et après la fondation de la Nouvelle Chine. C'est aussi l'épine dorsale de la modernisation socialiste et des diverses opérations de secours en cas de catastrophe."
PLA_Listen_to_the_Partys_command: "§YÉcouter le commandement du Parti§!"
PLA_Listen_to_the_Partys_command_desc: "§YL'étoile d'or brille sur le drapeau militaire. Notre principe est que le Parti commande l'arme§!\nÉcouter le commandement du Parti n'est pas seulement l'âme de notre armée, mais aussi la clé de la gouvernance de notre armée et la qualité la plus importante d'un soldat. Écouter le commandement du Parti n'est pas un slogan vide, mais une action réelle et pratique."
PLA_Can_win_battles: "§YPeut gagner des batailles§!"
PLA_Can_win_battles_desc: "Il n'y a pas de premier dans les affaires civiles et pas de second dans les affaires militaires. Si l'armée ne peut pas gagner, tout le reste est égal à zéro. Pour atteindre l'objectif de renforcement de l'armée, notre armée doit être capable de monter au combat et de gagner à tout moment et en toutes circonstances. C'est l'exigence fondamentale du Parti et du peuple pour l'armée, et c'est l'incarnation fondamentale de l'accomplissement de ses fonctions et de sa mission par notre armée."
PLA_Excellent_style: "§YExcellent style§!"
PLA_Excellent_style_desc: "L'excellent style est la garantie, qui est liée à la nature, au but et au caractère de l'armée. Le style est l'extériorisation et la représentation des attributs essentiels, du moral et de l'esprit combatif d'une armée. À travers les âges, seul un excellent style peut forger une armée courageuse et prête au combat. L'arrogance, la débauche et un style laxiste sont voués à faire chuter une armée toujours victorieuse."
PLA_Ideological_education: "Éducation idéologique"
PLA_Ideological_education_desc: "Le fleuve Yangtze coule vers l'océan. Continuez la révolution et tenez l'arme fermement. L'armée populaire est fidèle au parti. Le communisme gagnera sûrement. Vive le Parti communiste ! Vive le président Mao ! Vive le président Mao !"
PLA_All_terrain_vehicle: "Véhicules tout-terrain"
PLA_All_terrain_vehicle_desc: "Le véhicule tout-terrain Lynx que nous avons développé est capable d'équiper rapidement la plupart des troupes grâce à son adaptabilité et sa flexibilité extrêmement élevées, ce qui améliore considérablement la capacité de combat de l'APL."
PLA_Military_mechanization: "Forces mécanisées"
PLA_Military_mechanization_desc: "Sur le champ de bataille moderne, un fantassin isolé ne deviendra qu'une âme morte sous les pieds d'un béhémoth d'acier. Nous devrions construire une puissante force mécanisée et utiliser le béhémoth d'acier pour protéger les soldats de notre peuple."
PLA_logistic_service: "Soutien logistique"
PLA_logistic_service_desc: "On dit depuis l'Antiquité que la nourriture et le fourrage doivent être envoyés avant que l'armée ne bouge. Avec des soldats bien entraînés et suffisamment de nourriture, l'armée est invincible. Pour s'assurer que l'APL peut se concentrer sur l'entraînement et le combat, nous devrions augmenter les dépenses en logistique militaire afin que chaque soldat puisse avoir des repas chauds et des fournitures militaires suffisantes."
PLA_overwhelming_fire_power: "Puissance de feu écrasante"
PLA_overwhelming_fire_power_desc: "Nous avons beaucoup d'obus d'artillerie et divers types d'artillerie à portée ultra-longue, qui peuvent facilement atteindre une couverture de puissance de feu. S'il y a des ennemis manqués, nous pouvons les couvrir à nouveau."

##China's National Super Project Policy##
CHI_Chinese_Megaprojects: "Projet de grande puissance"
CHI_Chinese_Megaprojects_desc: "Maintenant que nous avons commencé à libérer le potentiel économique et industriel de la Chine, nous avons le potentiel de réaliser des projets d'installations d'ingénierie à une échelle sans précédent. Le grand Parti communiste chinois conduira le peuple chinois à créer un miracle mondial inégalé."
CHI_Aerospace_Industry: "Industrie aérospatiale"
CHI_Aerospace_Industry_desc: "L'industrie aérospatiale est un secteur important de toute économie majeure. Mon pays est une ancienne civilisation avec une histoire de 5 000 ans. Nos ancêtres avaient d'innombrables désirs et envies d'explorer les étoiles. Tout cela finira par se réaliser sur la voie de la réalisation des rêves de centaines de millions de Chinois aujourd'hui."
CHI_Power_surging: "Surtension de puissance"
CHI_Power_surging_desc: "La puissance est le premier élément du développement industriel. Chaque grand progrès de la civilisation humaine s'accompagne de la transformation et de la mise à niveau de la puissance. Si mon pays veut construire un super projet, il doit être soutenu par une technologie d'ingénierie solide."
CHI_Research_High_performance_steam_turbine: "Recherche de turbines à vapeur haute performance"
CHI_Research_High_performance_steam_turbine_desc: "Une turbine à vapeur, également connue sous le nom de moteur à turbine à vapeur, est un dispositif de puissance à vapeur rotatif. Les turbines à vapeur sont l'équipement principal des centrales thermiques modernes et sont également utilisées dans l'industrie métallurgique, l'industrie chimique et les centrales électriques de navires. Mon pays doit développer des turbines à vapeur haute performance de classe mondiale dès que possible pour injecter une impulsion puissante dans l'industrie de l'ingénierie de mon pays."
CHI_Domestic_shield_tunneling_machine: "Forage de tunnels à œil profond"
CHI_Domestic_shield_tunneling_machine_desc: "Une machine à bouclier est une machine de forage de tunnel qui utilise la méthode du bouclier. Que ce soit pour construire un projet géant ou pour explorer des ressources minérales, la machine à bouclier est une machine importante. Cependant, mon pays manque de machines à bouclier auto-développées. Auparavant, nous importions des machines à bouclier produites à l'étranger. Si nous voulons construire indépendamment un super projet, nous ne pouvons pas manquer de machines à bouclier nationales auto-développées."
CHI_The_vast_working_class: "Nous, travailleurs, avons le pouvoir"
CHI_The_vast_working_class_desc: "Nous, travailleurs, avons le pouvoir ! Nous, travailleurs, avons le pouvoir. Nous travaillons dur chaque jour ! Nous travaillons dur chaque jour. Nous avons construit de grands bâtiments, des chemins de fer et des mines de charbon. Nous avons transformé le monde ! §YLes travailleurs chinois seront les protagonistes dans la création d'un miracle mondial§!"
CHI_Super_Engine: "Super Moteur"
CHI_Super_Engine_desc: "Notre pays a atteint un statut de leader mondial en matière de technologie d'ingénierie. Maintenant, la Chine est devenue le moteur de fabrication d'ingénierie le plus puissant de la planète. Nous pouvons réaliser tous les plus grands super projets de l'histoire de l'humanité."
CHI_Modernizing_Agriculturee: "Modernisation de la production agricole"
CHI_Modernizing_Agriculturee_desc: "L'agriculture est le fondement du monde et la base des moyens de subsistance du peuple. Mon pays a une histoire de production agricole de milliers d'années. Sur la voie du grand renouveau de la nation chinoise, la modernisation agricole est une mission du temps qui doit être accomplie."
CHI_Expand_the_commodity_grain_base: "Développer la base de céréales commerciales"
CHI_Expand_the_commodity_grain_base_desc: "Bien que mon pays ait moins de terres arables par habitant, et que la majeure partie des terres arables soit détenue par des petits agriculteurs individuels sous forme de contrats familiaux, il est difficile de coordonner et d'ajuster la production. Cependant, nous pouvons étendre plusieurs bases de céréales commerciales à haut rendement existantes et essayer d'ouvrir de nouvelles bases de céréales commerciales dans le nord-ouest."
CHI_Agriculture_Logistics_System_Construction: "Construction d'un système logistique agricole"
CHI_Agriculture_Logistics_System_Construction_desc: "La capacité de production agricole de mon pays n'est pas faible, mais en raison de son vaste territoire, de son terrain complexe et de ses terres arables dispersées, les coûts de la logistique agricole sont élevés depuis longtemps, ce qui entrave sérieusement le développement de haute qualité de l'agriculture de mon pays. Nous devrions construire un ensemble de systèmes logistiques agricoles efficaces couvrant tout le pays pour soutenir le développement sain de l'agriculture."
CHI_Leisure_Agriculture_and_Rural_Tourism: "Agriculture de loisirs et tourisme rural"
CHI_Leisure_Agriculture_and_Rural_Tourism_desc: "L'agriculture est une production primaire à faible valeur ajoutée. Si l'agriculture doit être transformée et modernisée, elle ne peut pas se limiter à la production agricole elle-même. Mon pays a un très grand groupe de citoyens, et il existe une énorme demande potentielle de consommation pour l'agriculture de loisirs et le tourisme rural. Nous devrions tester et promouvoir de manière innovante ce nouveau modèle de développement."
CHI_Promoting_agriculture_through_digital_commerce: "Promouvoir l'agriculture par le commerce numérique"
CHI_Promoting_agriculture_through_digital_commerce_desc: "Le commerce électronique rural est une partie importante de l'agriculture moderne "Internet +" et un moyen important de transformer le mode de développement agricole. Nous devrions concevoir et mettre en œuvre le projet "Commerce numérique pour revitaliser l'agriculture", promouvoir le commerce électronique dans les zones rurales, promouvoir le développement normalisé et sain de la diffusion en direct des produits agricoles et secondaires, et laisser l'économie électronique renforcer le développement de haute qualité de l'agriculture et devenir un nouveau point chaud pour la croissance de la production agricole."
CHI_Sunway_BlueLight_MPP: "Projet Sunway"
CHI_Sunway_BlueLight_MPP_desc: "Un supercalculateur est un ordinateur avec une vitesse de calcul plus élevée, une capacité de stockage plus importante et des fonctions plus complètes qu'un ordinateur central. Depuis la publication du supercalculateur Tianhe-1 avec une performance de pointe de 1,206 pétaflops par l'Université nationale des technologies de défense en 2009, mon pays est devenu le deuxième pays après les États-Unis à développer indépendamment un supercalculateur pétaflop. Nous devons développer le supercalculateur le plus performant au monde dès que possible pour fournir un meilleur soutien de puissance de calcul à notre recherche scientifique."
CHI_Sunway_TaihuLight: "Sunway TaihuLight"
CHI_Sunway_TaihuLight_desc: "Nos percées en science et en ingénierie peuvent améliorer davantage les performances des supercalculateurs de notre pays."
CHI_Sunway_OceanLight: "Sunway OceanLight"
CHI_Sunway_OceanLight_desc: "Nos percées en science et en ingénierie peuvent améliorer davantage les performances des supercalculateurs de notre pays."
CHI_Sunway_NatureLight: "Sunway NaturalLight"
CHI_Sunway_NatureLight_desc: "Nos percées en science et en ingénierie peuvent améliorer davantage les performances des supercalculateurs de notre pays."
CHI_OGAS_design: "Proposition pour un système national d'automatisation"
CHI_OGAS_design_desc: "OGAS (Système national d'automatisation) est un projet de réseau national de l'ancienne Union soviétique. L'Union soviétique a fait une série de tentatives pour construire un réseau national similaire à Internet, et OGAS en faisait partie, mais ces projets ont finalement échoué.\nLa raison fondamentale de l'échec du plan soviétique était que le plan dépassait la portée de l'économie sociale et de la technologie de l'Union soviétique à l'époque, et est devenu un jardin suspendu qui semblait bon mais était inutile. Mon pays dispose maintenant du plus grand système de fabrication industrielle au monde et de la technologie de réseau informatique de pointe. Il est temps pour nous de réaliser ce projet technologique le plus ambitieux de l'histoire de l'humanité."
CHI_West_Line_Projec_South_to_North_Water_Diversion_Project: "Projet de dérivation d'eau Sud-Nord, ligne Ouest"
CHI_West_Line_Projec_South_to_North_Water_Diversion_Project_desc: "La ligne Ouest du projet de dérivation d'eau Sud-Nord est depuis longtemps au stade de la démonstration préliminaire et n'a pas été construite en raison de l'énorme difficulté du projet, des divers plans à discuter et des fonds du projet dépassant la capacité de charge. Maintenant, nous pouvons commencer la phase finale du projet de dérivation d'eau Sud-Nord, qui résoudra le problème de la pénurie d'eau dans notre pays une fois pour toutes."
Motuo_Hydropower_Station: "Centrale hydroélectrique de Motuo"
Motuo_Hydropower_Station_desc: "La centrale hydroélectrique de Medog est prévue pour être construite dans la partie sud du Tibet, en Chine. En raison de la grande différence d'altitude et de la topographie complexe, les ressources hydroélectriques sont particulièrement riches. Selon les calculs d'experts pertinents, les ressources hydroélectriques de l'ensemble de la région du sud-ouest représentent environ un tiers du total de l'énergie hydroélectrique de mon pays, et la capacité installée prévue de la centrale hydroélectrique de Medog est de 60 millions de kilowatts. En tant que plus grand projet hydroélectrique au monde, le projet des Trois Gorges a une production annuelle d'électricité de 300 milliards de kilowatts. Une fois la centrale hydroélectrique de Medog achevée, elle deviendra la centrale hydroélectrique avec la production totale d'électricité la plus élevée au monde, ce qui peut économiser à mon pays 80 millions de tonnes de charbon standard ou 40 millions de tonnes de pétrole chaque année, ce qui aidera mon pays à respecter son engagement à atteindre zéro émission nette d'ici 2060."
CHI_green_Great_Wall: "Grande Muraille verte"
CHI_green_Great_Wall_desc: "La frontière nord de notre pays est une terre désolée, rude et vaste, qui non seulement entrave le développement de la société locale, mais provoque également de graves catastrophes climatiques et naturelles dans notre pays. Le projet de ceinture de protection des Trois Nord est un projet écologique forestier artificiel à grande échelle planifié et mis en œuvre depuis 1979. Son objectif est d'améliorer les conditions naturelles difficiles de la région. Nous devons bien sûr continuer à construire ce projet à grande échelle."
CHI_green_ecological_reconstruction: "Projet de reconstruction écologique"
CHI_green_ecological_reconstruction_desc: "Nous achèverons en profondeur la construction de la civilisation écologique, nous efforcerons de construire une Chine magnifique et réaliserons véritablement le développement durable de la nation chinoise."
CHI_OGAS_Increase: "Système d'automatisation avancée"
CHI_OGAS_Increase_desc: "L'utilisation d'ordinateurs quantiques et le déploiement de modules de calcul distribués à grande échelle, ainsi que le succès de l'intelligence artificielle avancée, nous permettent de contrôler précisément toutes les activités économiques au sein du système d'une manière sans précédent et inimaginable."
CHI_shopping_basket_program: "Améliorer le "Projet Panier de légumes""
CHI_shopping_basket_program_desc: "Au début du 21e siècle, les principaux objectifs et tâches du "Projet Panier de légumes" sont les suivants : optimiser la structure, améliorer la qualité des produits du "Panier de légumes" et augmenter les revenus des agriculteurs, approfondir la réforme, élargir l'ouverture et accélérer la modernisation agricole comme moteur, réaliser le développement coordonné du "Projet Panier de légumes" et de l'environnement écologique, et s'efforcer d'améliorer la qualité de vie des résidents urbains et ruraux."
CHI_green_food_project: "Promouvoir les "Trois Projets Verts""
CHI_green_food_project_desc: "Les "Trois Projets Verts" font référence à la promotion de la consommation verte, à la culture des marchés verts et à l'ouverture de canaux verts pour améliorer la qualité des aliments et protéger les intérêts des consommateurs."

######cover
CHI_Agriculture: "Développement agricole en Afrique"
CHI_Agriculture_desc: "L'agriculture reste un secteur important de nombreuses économies africaines et celui dont les gens dépendent le plus. Nous devrions soutenir le secteur agricole et aider les travailleurs individuels à être compétitifs dans la concurrence internationale acharnée de la mondialisation."
CHI_Social_Credit_Scheme: "Le système de crédit social"
CHI_Social_Credit_Scheme_desc: "Le système de crédit social est également connu sous le nom de système national de gestion du crédit ou de système national de crédit. L'établissement et l'amélioration du système de crédit social est l'un des signes importants de la maturité continue de l'économie de marché socialiste chinoise. Sa fonction est d'enregistrer le statut de crédit des entités sociales, de révéler les avantages et les inconvénients de leur crédit, de les avertir des risques de crédit, et d'intégrer l'ensemble de la société pour louer l'intégrité et punir la malhonnêteté. Il peut pleinement mobiliser la puissance du marché lui-même pour purifier l'environnement, réduire les coûts de développement, réduire les risques de développement et promouvoir une culture d'intégrité."

##event##
#Technology Events#
chi_science.1: "Projet Shenwei"
chi_science.1.t: "Projet Shenwei"
chi_science.1.d: "Afin de développer des supercalculateurs, le gouvernement central a secrètement formé une équipe de recherche spéciale. Le chef d'équipe est un membre du Parti communiste qui représentera l'équipe de recherche pour rester en contact avec le gouvernement central à tout moment afin de rendre compte de l'avancement des travaux et des demandes. Afin de dissimuler la vérité, les fonds alloués par le gouvernement central à l'équipe de recherche ont tous été alloués à partir des cotisations du parti et enregistrés comme dépenses d'intérêt public.\n\nLes membres de cette équipe de recherche sont tous de jeunes hommes et femmes d'une vingtaine ou d'une trentaine d'années. Ils viennent de tout le pays et sont les meilleurs talents de la recherche scientifique dans le domaine de l'informatique. Comme les scientifiques qui ont développé la bombe atomique au début de la fondation de la République populaire de Chine, tous les membres de l'équipe de recherche ont dissimulé leur identité, coupé tout contact avec leur famille et la société, et se sont cachés parmi plus d'un milliard de personnes et le flot du temps."
chi_science.1.a: "Salut aux camarades"
chi_science.2: "Les progrès sont encourageants"
chi_science.2.t: "Les progrès sont encourageants"
chi_science.2.d: "Le chef du groupe de recherche informatique Shenwei a envoyé un appel pour rendre compte des récents progrès de la recherche, qu'il a décrits comme "les progrès sont encourageants". Le chef a déclaré dans le message que le supercalculateur avait construit une structure préliminaire et avait réussi à effectuer le premier calcul ce matin.\nJe crois que dans un proche avenir, le premier supercalculateur développé indépendamment par mon pays sera achevé."
chi_science.2.a: "Génial !"
chi_science.3: "Explosion en laboratoire !"
chi_science.3.t: "Explosion en laboratoire !"
chi_science.3.d: "L'équipe de recherche de Shenwei a appris qu'une explosion et un incendie se sont produits dans le laboratoire de l'équipe ce matin. La cause n'est toujours pas claire. De nombreuses personnes de l'équipe de recherche se trouvaient dans le laboratoire à ce moment-là et ont été directement touchées par les fragments de l'explosion et ont été grièvement blessées. Afin de sauver les documents papier et les membres de l'équipe blessés, le chef d'équipe s'est précipité dans la mer de feu malgré l'obstruction des autres membres de l'équipe. Cependant, le laboratoire s'est effondré quelques secondes plus tard, et le chef d'équipe et un autre membre de l'équipe blessé sont finalement morts héroïquement dans l'incendie.\n\nPar la suite, lorsque le personnel nettoyait les restes du chef d'équipe décédé, ils ont trouvé sa note de suicide écrite depuis longtemps dans un ancien exemplaire des Œuvres choisies de Mao Zedong. Dans la note de suicide, il demandait que son corps soit incinéré et dispersé dans la mer après l'achèvement du projet de recherche scientifique."
chi_science.3.a: "Camarade, repose en paix"
chi_science.4: "Espions américains"
chi_science.4.t: "Capturer l'espion américain !"
chi_science.4.d: "Le personnel de sécurité de l'équipe de recherche de Shenwei a attrapé un espion américain qui s'était déguisé en agent d'entretien aujourd'hui. Cet espion se cachait dans le laboratoire depuis longtemps, et avait repéré la liste et l'heure de rotation des gardes, et a saisi une légère brèche pour entrer dans le laboratoire. Lorsqu'il a été découvert, l'espion avait l'intention d'avaler le médicament suicide caché dans sa manche, mais heureusement, il a été maîtrisé et contrôlé par un membre de l'équipe de recherche derrière lui à temps. Le chercheur a ensuite été touché à l'abdomen par l'espion sous lui, et la balle a pénétré son foie, causant de graves blessures. Selon l'interrogatoire préliminaire, la dernière explosion en laboratoire a été causée par un autre espion américain, et il y a plusieurs espions qui se cachent dans la base expérimentale."
chi_science.4.a: "Que le département de la sécurité nationale renforce la sécurité !"
chi_science.5: "Le supercalculateur Sunway Blue-ray a été développé avec succès !"
chi_science.5.t: "Le supercalculateur Sunway Blue Ray a été développé avec succès !"
chi_science.5.d: "Aujourd'hui, l'équipe de recherche Shenwei a envoyé un message indiquant que les travaux de recherche ont été achevés avec succès et que mon pays a développé avec succès le premier supercalculateur national. Le système Shenwei peut effectuer environ 1 million de milliards d'opérations par seconde. Selon l'équipe de recherche, ce supercalculateur national est susceptible de figurer parmi les 10 ordinateurs les plus rapides du monde. Plus important encore, les 8 700 microprocesseurs Shenwei 1600 utilisés dans le système ont été conçus par un institut de recherche informatique de mon pays et fabriqués à Shanghai.\n\nL'équipe de recherche a donné à l'ordinateur le nom de code expérimental de supercalculateur "Shenwei Blue Light", et maintenant l'équipe a demandé au gouvernement central de nommer le supercalculateur."
chi_science.5.a: "D'accord, appelons-le Shenwei Blue Light !"
chi_news.10: "La Chine développe indépendamment son premier supercalculateur"
chi_news.10.t: "La Chine développe indépendamment son premier supercalculateur"
chi_news.10.d: "Aujourd'hui, un ordinateur appelé "Sunway Blue" a été installé au Centre national de supercalcul de Chine à Jinan, dans la province du Shandong. Le système Sunway peut effectuer environ 1 million de milliards d'opérations par seconde, ce qui est susceptible de le classer parmi les 20 ordinateurs les plus rapides du monde. Plus important encore, le système utilise 8 700 microprocesseurs Sunway 1600 conçus par un institut de recherche informatique chinois et fabriqués à Shanghai.\n\nLa Chine a trois générations de retard par rapport à la technologie de fabrication de puces la plus avancée utilisée par les leaders mondiaux de la technologie tels que les États-Unis, la Corée du Sud et le Japon, mais elle a développé indépendamment un supercalculateur. "C'est un peu surprenant", a commenté Jack Dongara, informaticien à l'Université du Tennessee et chef du projet Top 500 des supercalculateurs mondiaux. Le Dr Dongara a déclaré que l'efficacité LINPACK de Sunway Blue est de 74 %, ce qui est comparable à l'efficacité du supercalculateur le plus rapide des États-Unis, le supercalculateur Jaguar."
chi_news.10.a: "Ils ont construit leur propre supercalculateur ?"
chi_news.10.b: "Nous sommes les meilleurs !"
chi_science.6: "Le Conseil des affaires de l'État soumet un projet de loi au Comité permanent de l'Assemblée populaire nationale"
chi_science.6.t: "Le Conseil des affaires de l'État soumet un projet de loi au Comité permanent de l'Assemblée populaire nationale"
chi_science.6.d: "Le Conseil des affaires de l'État a élaboré un projet de loi visant à construire un système national d'automatisation dans tout le pays et l'a soumis au Comité permanent de l'Assemblée populaire nationale pour examen. S'il peut être approuvé par le Comité permanent, il peut être soumis à l'Assemblée populaire nationale pour examen et législation."
chi_science.6.a: "(Transmettre le projet de loi proposé par le Conseil des affaires de l'État)"
chi_science.7: "Proposition de loi sur la construction du système national d'automatisation de la République populaire de Chine"
chi_science.7.t: "Proposition de loi sur la construction du système national d'automatisation de la République populaire de Chine"
chi_science.7.d: "Pour améliorer le niveau de modernisation de la gouvernance urbaine, nous devons continuellement accélérer le rythme de la construction de villes intelligentes, rendre la gouvernance urbaine plus intelligente, plus efficace et plus précise, et mieux servir le développement de haute qualité, la gouvernance à haute efficacité et la vie de haute qualité des villes. En réponse à la stratégie de développement de haute qualité, le Conseil des affaires de l'État a élaboré un plan de construction d'un système national d'automatisation après une recherche du Comité économique et de l'information. Il est maintenant soumis au Comité permanent de l'Assemblée populaire nationale pour délibération. Le contenu est le suivant :\n\n1. Renforcer l'infrastructure numérique et l'intégration des données. Accélérer la construction d'infrastructures d'information numériques représentées par la 5G et les centres de données, et promouvoir simultanément la transformation numérique et intelligente des installations publiques telles que les bâtiments urbains, les routes et ponts, l'électricité et le gaz, et améliorer les capacités de gestion de la sécurité et de connaissance des risques de sécurité de l'espace physique urbain. Promouvoir l'intégration des données dans tous les maillons de l'ensemble du processus de planification, de construction, de gestion et d'exploitation et de maintenance urbaines, construire un centre intelligent de fonctionnement et de gouvernance urbaine coordonné au niveau provincial, et créer une plateforme de soutien urbaine commune.\n\n2. Se concentrer sur la gouvernance fine et améliorer la qualité et l'efficacité des services. Explorer la gouvernance globale urbaine "grande intégration globale", optimiser les scénarios globaux et les applications spéciales, et construire un nouveau modèle de gouvernance globale urbaine avec des fonctions claires, une efficacité coordonnée, sûr et ordonné, et une participation diversifiée. Accélérer la promotion de la "réalisation efficace d'une chose" pour couvrir fondamentalement les questions à haute fréquence des services publics urbains, améliorer continuellement l'efficacité du "service à guichet unique" en rationalisant les maillons et en optimisant les processus, et promouvoir la transformation des services publics de "pouvoir faire" à "facile à faire".\n\nTroisièmement, établir un centre de réseau central pour connecter environ 200 centres intermédiaires dans d'autres grandes villes et environ 20 000 terminaux dans les départements économiques et de production importants et les entreprises importantes. La mise en œuvre de tout système d'information doit avoir une continuité correspondante. Établir un système national sans automatisation départementale et ministérielle nécessitera que tout le pays passe à une nouvelle méthode de gestion économique nationale en une seule fois. La Commission économique et de l'information estime que cela est difficile à réaliser. Il est plus faisable d'établir un centre de réseau informatique national en construisant et en fusionnant progressivement les systèmes d'information établis à divers endroits que d'établir un système d'information énorme en une seule fois.\n\nQuatrièmement, établir un comité national de construction du système d'automatisation, qui est responsable de l'exécution et de la supervision de la construction du système national d'automatisation, de la connexion avec le gouvernement populaire central représenté par le Conseil des affaires de l'État et les gouvernements locaux et les départements de production, et de l'approfondissement dans la ligne de front de base de divers endroits de manière intégrée. Il est nécessaire de construire un système national d'automatisation contrôlé par le Comité national de construction du système d'automatisation étape par étape sans affecter autant que possible la production sociale et économique."
chi_science.7.a: "Signature : Conseil des affaires de l'État"
chi_science.8: "Le Comité permanent de l'Assemblée populaire nationale a rejeté le projet de loi"
chi_science.8.t: "Le Comité permanent de l'Assemblée populaire nationale a rejeté le projet de loi"
chi_science.8.d: "Examen de la proposition du Conseil des affaires de l'État sur la "Loi sur la construction du système national d'automatisation de la République populaire de Chine" :\n\nAprès discussion au Comité permanent de l'Assemblée populaire nationale, la proposition a été rejetée.\n\nPremièrement, le plan est trop cher. Le coût total du plan initial sera quatorze fois le revenu fiscal annuel, et les bénéfices des résultats de la construction pourraient ne pas être en mesure de compenser le coût.\n\nDeuxièmement, il a des effets imprévisibles sur la stabilité sociale. La fiabilité et la sécurité de la production sociale sous le contrôle des calculs informatiques Big Data sont difficiles à garantir.\n\nTroisièmement, le plan ne définit pas clairement comment traiter les acteurs du marché tels que les entreprises. Les entreprises ne coopéreront pas avec le gouvernement ou les ordinateurs pour remplacer le contrôle des opérations des entreprises.\n\nEn résumé, le plan a un bon point de départ, mais il n'est pas réalisable.\n\n\nSignature : Comité permanent de l'Assemblée populaire nationale"
chi_science.8.a: "Réfléchissons à une autre solution..."
chi_science.9: "Deuxième proposition de loi sur la construction du système national d'automatisation de la République populaire de Chine"
chi_science.9.t: "Deuxième proposition de loi sur la construction du système national d'automatisation de la République populaire de Chine"
chi_science.9.d: "En combinaison avec les orientations du Comité permanent de l'Assemblée populaire nationale, après recherche par le Comité économique et de la technologie de l'information, le Conseil des affaires de l'État a élaboré un plan révisé pour la construction d'un système national d'automatisation, qui est maintenant soumis au Comité permanent de l'Assemblée populaire nationale pour délibération. Le contenu est le suivant :\n\n1. Mettre en place des zones spéciales pour les projets pilotes. Les premières à être incluses devraient être Shenzhen, Shanghai ou la nouvelle zone de Xiong'an. La construction du système d'automatisation implique trop de dimensions et de domaines, et la portée de l'influence doit être autant que possible contrôlée. Les zones économiques spéciales ou les nouvelles zones devraient assumer la responsabilité des expériences de travail économique.\n\n2. Le centre de réseau central est sous le contrôle du Comité technique de normalisation du système national d'automatisation et d'intégration. Si une réglementation est nécessaire ou si un impact grave est causé, le Comité technique de normalisation du système national d'automatisation et d'intégration et le gouvernement central ont le droit d'arrêter immédiatement le projet pour garantir la stabilité du travail social et économique.\n\n3. Le système national d'automatisation sert et guide les acteurs du marché et n'interfère pas dans la propriété et le contrôle des entreprises. C'est une mesure importante pour optimiser l'environnement des affaires et se transformer en un gouvernement axé sur les services."
chi_science.9.a: "Signature : Secrétaire général, Conseil des affaires de l'État"
chi_science.10: "Le Comité permanent de l'Assemblée populaire nationale a examiné et adopté le projet de loi"
chi_science.10.t: "Le Comité permanent de l'Assemblée populaire nationale a examiné et adopté le projet de loi"
chi_science.10.d: "Avis sur la proposition du Conseil des affaires de l'État relative au projet de loi sur la "Loi sur la construction du système national d'automatisation de la République populaire de Chine" :\n\nAprès discussion au Comité permanent de l'Assemblée populaire nationale, afin de mettre en œuvre la décision du Secrétaire général, le projet de loi a été adopté.\n\nIl est maintenant soumis à l'Assemblée populaire nationale pour délibération, et le projet de loi sera envoyé aux députés de l'Assemblée populaire nationale. Après 30 jours, l'Assemblée populaire nationale sera convoquée temporairement pour délibérer sur le projet de loi.\n\n\nSigné : Comité permanent de l'Assemblée populaire nationale"
chi_science.10.a: "Évidemment, ils ont vu la signature du Secrétaire général"
chi_science.11: "La session plénière de l'Assemblée populaire nationale se tient"
chi_science.11.t: "La session plénière de l'Assemblée populaire nationale se tient"
chi_science.11.d: "L'Assemblée populaire nationale a tenu une session plénière aujourd'hui pour entendre la proposition du Conseil des affaires de l'État sur le projet de loi relatif à la "Loi sur la construction du système national d'automatisation de la République populaire de Chine". Des représentants de l'Assemblée populaire nationale de tout le pays se sont réunis, et les sessions plénières ou les réunions de groupe de chaque délégation ont examiné et voté sur le projet de loi sur place. En fin de compte, le projet de loi a reçu plus des deux tiers des voix en sa faveur.\n\nLe Comité constitutionnel et juridique a procédé à un examen unifié du projet de loi sur la base des avis d'examen de chaque délégation, et a finalement adopté le projet de loi.\n\nL'Assemblée populaire nationale a décidé lors de la réunion de confier la tâche de mettre en œuvre et de superviser la "Loi sur la construction du système national d'automatisation de la République populaire de Chine" au Conseil des affaires de l'État."
chi_science.11.a: "L'Assemblée populaire nationale nous a apporté son soutien dans notre travail"
chi_news.26: "La Chine lance le projet OGAS"
chi_news.26.t: "La Chine lance le projet OGAS"
chi_news.26.d: "Aujourd'hui, le gouvernement chinois a achevé la construction du projet de ville intelligente OGAS dans la zone métropolitaine de Xiong'an. OGAS, ou All-State Automated System, a été proposé par le scientifique soviétique Glushkov au siècle dernier et a été autrefois valorisé par le gouvernement soviétique, mais le plan a finalement été abandonné.\n\nIl est rapporté que les départements gouvernementaux de la nouvelle zone de Xiong'an ont terminé l'adaptation à l'informatisation. Il n'y a que quelques fonctionnaires en service dans le bâtiment du gouvernement, et tout est confié au système intelligent. Dans les bureaux de Xiong'an, chaque étage dispose d'un immense écran interactif de supercalculateur que les gens peuvent utiliser ; dans l'usine automatisée de Xiong'an, chaque atelier est connecté à un système de réseau 5G de qualité militaire pour collecter les données de production de l'atelier et contrôler la production de l'atelier. Ces données seront agrégées au centre de réseau de Pékin, et le supercalculateur central calculera, contrôlera et enverra uniformément des suggestions de mise en œuvre."
chi_news.26.a: "Ingénierie incroyable"
chi_news.26.b: "La science et la technologie sont les forces productives primaires"
chi_science.12: "Équipe d'enquête sur la centrale hydroélectrique de Medog"
chi_science.12.t: "Équipe d'enquête sur la centrale hydroélectrique de Medog"
chi_science.12.d: "Les experts estiment que la centrale de Medog pourrait être l'infrastructure hydroélectrique la plus risquée et la plus difficile de l'histoire.\n\nLa région montagneuse où se trouve Medog est entourée de montagnes et isolée du monde extérieur. Elle est non seulement sujette à des glissements de terrain et à des coulées de boue à grande échelle, mais elle est également située en bordure d'une zone sismique fragile. Les tremblements de terre violents et les contraintes terrestres peuvent gravement affecter la sécurité et la stabilité de la centrale et d'autres bâtiments. Couplé à l'environnement écologique fragile du plateau Qinghai-Tibet, il est nécessaire de minimiser l'impact du projet sur la végétation locale et la faune sauvage lors de la construction de la centrale hydroélectrique de Medog, ce qui impose des exigences extrêmement strictes à la construction.\n\nDe plus, le lieu prévu pour la centrale hydroélectrique de Medog est peu peuplé, avec des routes de montagne accidentées et des transports externes extrêmement peu pratiques. Il est difficile pour l'équipe de construction de transporter les matériaux de construction et les fournitures connexes, et une route de transport complète doit être construite avant que la centrale hydroélectrique ne commence. Le terrain et la situation géographique ont également des liaisons longue distance avec le réseau électrique géant de la future centrale hydroélectrique. La planification de la transmission et de la distribution pose un défi. L'électricité produite par la centrale hydroélectrique doit être transmise à des zones densément peuplées éloignées pour la vie des gens et la production des usines. À l'heure actuelle, la capacité de transmission longue distance à haute tension de la Chine n'est pas encore mature. Ce sont les problèmes qui doivent être résolus dans la planification et la construction des centrales hydroélectriques.\n\nPar conséquent, le projet de centrale hydroélectrique de Medog doit prendre en compte de nombreux facteurs et faire une planification minutieuse de manière globale. C'est pourquoi le projet n'a pas encore été officiellement lancé. D'un point de vue de développement à long terme, les ressources hydroélectriques ont une valeur stratégique importante et contiennent d'énormes avantages économiques et environnementaux. La construction de la centrale hydroélectrique de Medog est très nécessaire même si elle est complexe et difficile.\n\nAfin de construire parfaitement ce super projet, nous avons formé une équipe d'inspection chargée de l'étude et de la conception de la centrale hydroélectrique de Medog. L'équipe a été examinée par le Secrétaire général et le Premier ministre à Pékin hier, et maintenant ils partent pour le Medog, isolé et éloigné."
chi_science.12.a: "Allez, camarades"
chi_science.13: "Voyages à Medog, partie 1"
chi_science.13.t: "Voyages à Medog, partie 1"
chi_science.13.d: "« Terre sainte du lotus, Medog secret »\n\nLe comté de Medog est situé dans la ville de Linzhi, au sud-est du Tibet. C'est le dernier comté de Chine à être relié par la route. Il est connu sous le nom de « Xishuangbanna du Tibet » et de « Musée naturel des types de végétation ».\n\nLa semaine dernière, j'ai reçu l'ordre du gouvernement central de venir à Medog avec Lao Gu pour inspecter le plan de construction de la centrale hydroélectrique. Je pensais pouvoir prendre l'avion directement pour y aller, mais après quelques jours de repos, j'ai en fait pris un bus pendant deux jours d'affilée pour contourner la route de montagne. Plusieurs personnes de l'équipe qui avaient le mal des transports ont vomi pendant deux jours d'affilée. Cependant, d'où venaient les icebergs enveloppés de nuages et de brume ? Comment ont-ils réparé la route ?\n\nAprès être arrivés à Medog, nous sommes allés déjeuner. Pour gagner du temps, nous avons mangé des nouilles dans un restaurant de ramen de Lanzhou. Le restaurant de nouilles n'était pas grand, mais il y avait beaucoup de clients, tous des touristes. Lao Gu n'avait pas l'habitude de manger des nouilles, alors il a demandé un bol de riz frit. Les autres collègues du sud n'ont pas non plus mangé de nouilles. J'ai pris un bol de nouilles au bœuf, et bien sûr, comme les ramen de Lanzhou ailleurs, le bœuf était aussi fin que du papier. Mais la soupe était assez délicieuse, et on disait qu'une épice spéciale de Medog y était ajoutée.\n\nAprès le déjeuner, nous sommes partis pour les deux virages du fleuve Yarlung Zangbo à Medog. Lao Gu a dit qu'en 1994, les scientifiques chinois ont annoncé au monde une découverte géographique majeure : le Grand Canyon en aval du fleuve Yarlung Zangbo au Tibet, en Chine, est le plus grand canyon du monde, beaucoup plus profond que le canyon de Colca au Pérou (3 200 mètres de profondeur), qui était à l'origine considéré comme le plus profond, et plus long que le canyon du Colorado aux États-Unis (440 kilomètres de long), qui était à l'origine considéré comme le plus long du monde. Je ne m'attendais pas à ce qu'un si petit Medog ait un monde si différent.\n\nCet endroit a des canyons escarpés et des rivières turbulentes. Entouré de montagnes, c'est comme un dragon géant qui tourne soudainement ici. Nous avons suivi le dragon d'eau géant et avons descendu le courant. Les forêts luxuriantes et les montagnes brumeuses mettent en valeur le Grand Canyon, créant une magnifique scène de canyon très similaire à un rêve - non, encore plus magnifique qu'un rêve. Lorsque nous avons fait une pause, Lao Gu m'a dit que la forêt tropicale de Medog est la forêt tropicale la plus septentrionale sur Terre, la zone écologique la plus basse, la plus douce, la plus pluvieuse et la mieux préservée du plateau tibétain. Le Grand Canyon du Yarlung Zangbo dans la région mesure plus de 500 kilomètres de long. Si une centrale hydroélectrique doit être construite, les dommages à l'écologie locale doivent être minimisés autant que possible, et de nombreux problèmes ne peuvent pas être causés comme le barrage des Trois Gorges."
chi_science.13.a: "Regardez ces petits gars sur le sol. C'est leur maison."
chi_science.14: "Voyages à Medog, deuxième partie"
chi_science.14.t: "Voyages à Medog, deuxième partie"
chi_science.14.d: "Il y a beaucoup de belles maisons près du grand virage de Linduo, qui ont à la fois des caractéristiques tibétaines et une saveur sud-asiatique. Il y a un porche soutenu par des piliers en bois devant la maison en bois, et les couleurs sont très vives, comme. Bien que la rivière Yarlung Zangbo soit juste devant eux, les habitants sont toujours habitués à utiliser des bassins et des tubes pour recueillir l'eau de pluie. On dit que c'est parce que la rivière est turbulente et qu'une fois tombé à l'eau, on peut perdre la vie.\n\nLe grand virage de Guoguotang de la rivière Yarlung Zangbo est situé dans le canton de Dexing, à 12 kilomètres du comté de Medog. C'est le paysage le plus représentatif de Medog et un paysage que tous ceux qui viennent à Medog peuvent voir de leurs propres yeux. Sa magnificence est à couper le souffle. La rivière Yarlung Zangbo fait un grand virage ici à Guoguotang, et les habitants l'appellent aussi un virage en forme de serpent. Le grand virage de Guoguotang est connu pour sa vue plongeante. Il ressemble à une sucette, c'où son nom Guoguotang. Le grand virage de Guoguotang est une merveille naturelle formée par la rivière Yarlung Zangbo lorsqu'elle traverse Medog. En raison du terrain, la rivière turbulente rencontre l'obstruction des sommets des montagnes et fait un virage à 180 degrés autour des sommets des montagnes, formant ce magnifique paysage naturel. J'ai pris une photo de mon collègue et de sa femme, et ils étaient très satisfaits. Ancien conseiller, pourquoi ne suis-je pas encore marié ? Je lui ai dit que je n'avais pas d'argent pour payer le prix de la mariée, et que les topographes ne restaient pas à la maison toute l'année. Voulez-vous que votre femme soit veuve ? Lao Gu secoua la tête, il semble qu'il ne croie pas ce que j'ai dit.\n\nIl y a une plantation de thé des habitants locaux sur la montagne près du grand virage de Guoguotang. Ils ont nivelé une petite colline, coupé les arbres et fait de la place pour que les collines de thé poussent du thé. Nous avons acheté quelques petites choses dans une petite boutique tenue par un habitant local. Lao Gu a acheté quelques kilogrammes de pamplemousse local, et j'ai acheté un chapeau tibétain. Ensuite, nous avons mangé un poulet en pot de pierre de Medog dans la boutique d'un camarade local. Heureusement, ce n'était pas aussi cher qu'on l'imaginait.\n\nIl y a un pont en filet de rotin de Medog à environ 6 kilomètres du comté de Medog. Le pont en filet de rotin était l'un des canaux de traversée de rivière les plus importants de Medog dans les premières années. Il était tissé avec du bambou de rotin de la forêt locale. À l'époque où il n'y avait pas de pont à Medog, les habitants locaux ont trouvé une méthode de tissage d'un pont avec du bambou de rotin afin de traverser la rivière turbulente Yarlung Zangbo. Ils ont fixé les deux extrémités du câble d'acier des deux côtés, puis ont tissé du bambou de rotin d'épaisseur variable dessus pour former un pont pour traverser la rivière. Le pont en filet de rotin n'avait pas de piliers ni de planches, et les gens qui marchaient dessus se balançaient de gauche à droite dans le vent, ce qui était très effrayant. Beaucoup de collègues féminines n'osaient pas monter sur le pont. Lao Gu m'a emmené faire trois allers-retours dessus, et a utilisé un instrument de mesure pour enregistrer la quantité d'eau à cet endroit.\n\nIl y a beaucoup de piles de pierres Mani près du pont de Tengwang, avec des écritures incompréhensibles gravées dessus. Je ne sais pas quel pieux ancêtre les a construites il y a de nombreuses années. Ces piles de pierres sont peut-être restées ici tranquillement pendant des décennies, voire des centaines d'années, et personne ne les a déplacées. Lao Gu en a également construit une petite, mais j'étais maladroit et je ne pouvais pas la construire, et je marchais toujours dessus, alors j'ai trouvé une pierre et j'ai gravé les mots "Équipe d'expédition scientifique hydroélectrique de Medog" avec un couteau et l'ai mise sur la pile de pierres de Lao Gu, mais la pile de pierres de Lao Gu s'est également effondrée.\n\nAlors Lao Gu m'a donné un coup de poing dans l'épaule."
chi_science.14.a: "J'espère que la centrale hydroélectrique ne finira pas comme ce tas de roches..."
chi_science.15: "Voyages à Medog, troisième partie"
chi_science.15.t: "Voyages à Medog, troisième partie"
chi_science.15.d: "\"Chaque année, l'hôpital 115 de l'APL envoie une équipe médicale de médecins généralistes à Medog pour surveiller la région et passer la période de fermeture de la montagne de neuf mois avec les soldats et les civils de Medog. L'hôpital 115 prévient et traite les maladies des habitants, fournit des services médicaux et des médicaments, et aide de nombreux hôpitaux et centres de santé de canton de Medog à se développer. Il offre une formation gratuite à long terme au personnel médical de base et donne la priorité à Medog avec le meilleur équipement et les meilleurs médicaments. Les habitants d'ici considèrent le médecin 'Jinzhu Mami' comme le meilleur 'Menba' du monde. Jinzhu Mami signifie 'Soldat Bodhisattva' et 'Menba' signifie médecin.\" Un jeune soldat qui voyageait avec nous me l'a dit. Il était membre de la garnison locale du Tibet et était chargé d'être éclaireur et garde de l'équipe d'expédition scientifique avec quatre autres camarades. Il y avait aussi plusieurs soldats topographes qui les accompagnaient, qui étaient chargés d'enregistrer les informations géographiques qui n'avaient pas été découvertes auparavant.\n\nLao Gu avait plusieurs grosses bosses sur le corps dues aux piqûres de moustiques. Il n'arrêtait pas de me demander de la crème anti-démangeaison, mais il était manifestement plus préoccupé par d'autres choses. \"Les Indiens ne devraient pas apparaître soudainement, n'est-ce pas ? Ce serait mauvais s'ils le harcelaient.\"\n\n\"Logiquement, ils ne devraient pas aller dans la forêt tropicale, mais cette possibilité ne peut être exclue. Ils se faufilent souvent ici et font quelque chose d'inconnu.\" Le jeune soldat secoua la tête et coupa une parcelle d'herbe devant lui.\n\n\"Arrêtez ! Quelqu'un est blessé !\" cria un collègue par derrière.\n\nLao Gu et le jeune soldat se précipitèrent rapidement après avoir appris la nouvelle. J'étais sur le point de rentrer, mais j'ai trébuché dans une flaque de boue sous mes pieds. Je me suis finalement levé et j'ai levé la tête. Soudain, j'ai vu une chose semi-liquide dévaler de la montagne derrière moi comme de l'eau.\n\nC'est une coulée de boue. À Motuo, vous pouvez rencontrer des coulées de boue soudaines à tout moment et en tout lieu.\n\n\"Coulée de boue ! Bougez vite ! Dépêchez-vous !\" criai-je désespérément, je me retournai et tirai plusieurs collègues pour évacuer. Parce que la jungle était couverte d'herbe et d'arbres, la route de montagne où la patrouille de l'APL sortait était très étroite, et les membres de l'équipe ne pouvaient pas passer côte à côte, ils ne pouvaient donc évacuer que dans une seule direction. Je m'inquiétais toujours pour la sécurité de Lao Gu et du jeune soldat, mais je ne pouvais pas retourner vérifier, je ne pouvais donc qu'avancer et conduire l'équipe hors de la vallée.\n\nAprès être retourné à la base et avoir compté le nombre de personnes, j'ai constaté que Lao Gu et le jeune soldat n'étaient pas dans l'équipe, et plusieurs membres de l'équipe d'expédition étaient également portés disparus."
chi_science.15.a: "Recherche et sauvetage !"
chi_science.16: "Voyages à Medog, quatrième partie"
chi_science.16.t: "Voyages à Medog, quatrième partie"
chi_science.16.d: "Lao Gu aime regarder autour de la falaise. Je lui ai déjà demandé ce qu'il regardait. Il a dit qu'il pouvait dire la hauteur de la falaise en un coup d'œil. Il n'oublierait pas la compétence s'il regardait davantage.\n\nLa dernière fois que la coulée de boue a éclaté, Lao Gu, le jeune soldat et plusieurs collègues ont rapidement évacué la zone de coulée de boue, mais la route d'évacuation était bloquée, ils ont donc dû trouver une autre issue dans la jungle. Nous avons cherché jusqu'au lendemain matin, et soudain, nous avons trouvé une personne debout en train d'uriner au bas de la pente. Nous avons regardé de près et avons constaté que c'était Lao Gu. Heureusement, le collègue blessé n'avait que le pied coupé par les rochers, et il n'y avait pas de problème grave. Sinon, il serait impossible pour une ambulance de venir dans un tel endroit, et nous devrions ouvrir la montagne. S'ils ont besoin de soins d'urgence, cela alertera certainement les Indiens.\n\nJ'ai demandé à Lao Gu s'ils seraient en colère si cette centrale hydroélectrique était construite au-dessus de l'Inde. Lao Gu a retiré sa tête du bord de la falaise et a dit que l'Inde ne serait certainement pas d'accord pour bloquer leur \"Brahmapoutre\" avec un barrage. À ce moment-là, ils trouveraient probablement des moyens de les faire trébucher. La chose la plus importante maintenant est de terminer rapidement les levés et la conception, afin de ne pas les laisser découvrir à l'avance. Lao Gu a exhorté d'autres collègues à installer rapidement l'équipement, car cet endroit est tout à fait approprié pour un réservoir de barrage.\n\nIl y a une immense pente abrupte devant nous. La rivière Yarlung Zangbo, qui a toujours coulé uniquement dans des endroits plats, a choisi un tel endroit pour descendre. \"Si rien d'inattendu ne se produit, elle devrait être construite ici à la fin. Il y a une dénivellation de près de 2 000 mètres en amont. Plusieurs centrales hydroélectriques en cascade peuvent être installées le long du chemin, qui peuvent accueillir plus de 50 unités de 700 000 kilowatts. La capacité installée totale ne sera pas inférieure à 30 millions de kilowatts, ce qui peut générer plus d'électricité que les Trois Gorges. C'est l'endroit le plus approprié.\", a dit Lao Gu sérieusement.\n\nJ'ai accroché le pendentif du président Mao que j'ai acheté dans le comté de Medog à une pierre saillante à proximité, afin que le vieil homme puisse également voir ce trésor de Feng Shui. Maintenant, le président Mao peut aussi voir ici, jetez un œil à l'endroit que nous avons choisi, ai-je dit à Lao Gu. Lao Gu a souri, s'est retourné et a sorti une petite statue dorée du président Mao de son sac et l'a placée sur une plate-forme en pierre saillante.\n\nLes yeux de la statue dorée scintillaient au soleil de Medog."
chi_science.16.a: "\"La déesse devrait aller bien, et le monde sera choqué\""
chi_news.22: "La Chine lance le projet de construction de la centrale hydroélectrique de Medog"
chi_news.22.t: "La Chine lance le projet de construction de la centrale hydroélectrique de Medog"
chi_news.22.d: "Aujourd'hui, après que le gouvernement chinois a saisi la région du sud du Tibet à l'Inde, il a lancé la construction de la centrale hydroélectrique de Medog dans la région du sud du Tibet.\n\nLa centrale hydroélectrique est située dans les tronçons supérieurs du Grand Canyon de la rivière Yarlung Zangbo (grand virage), où le débit de la rivière Niyang atteint 60,1 milliards de mètres cubes, et la rivière Yarlung Zangbo et ses importants affluents, le Parlung Zangbo-Yigon Zangbo, se rejoignent dans les tronçons intermédiaires du Grand Canyon. Le Parlung Zangbo et son affluent, le Yigong Zangbo, ont un bassin versant de 28 900 kilomètres carrés et un débit annuel de 372,2 milliards de mètres cubes, et le débit annuel à la sortie est de 165,4 milliards de mètres cubes (Baxika, comté de Medog). Le Grand Canyon de la rivière Yarlung Zangbo est riche en ressources hydroélectriques. Le Grand Canyon fait un virage en forme de fer à cheval autour du mont Namjagbarwa. La longueur du district de Pai à l'entrée du virage (plus de 2 900 mètres au-dessus du niveau de la mer) à la section de la rivière Beibeng de Medog (680 mètres au-dessus du niveau de la mer) est d'environ 250 kilomètres, avec une dénivellation de plus de 2 200 mètres. Si un tunnel de dérivation d'eau de Pai District à Medog est creusé, près de 2 000 m³/s de débit peuvent être détournés, une centrale hydroélectrique géante d'une capacité installée de 50 millions de kW (centrale hydroélectrique de Daguaiwan) peut être construite, et la production annuelle d'électricité peut dépasser 300 milliards de kilowattheures, ce qui dépassera la production d'électricité des Trois Gorges, la plus grande centrale hydroélectrique du monde, également en Chine.\n\nL'Inde et le Bangladesh affirment que les efforts de la Chine pour réduire la pénurie d'eau constituent désormais une menace pour eux sous la forme du projet de centrale hydroélectrique de Medog. Le Brahmapoutre est connu sous le nom de rivière Yarlung Zangbo en Chine. La construction d'une centrale hydroélectrique sur cette rivière a le potentiel de priver des milliers de personnes en aval de leur approvisionnement de base en eau. L'Inde et le Bangladesh affirment que malgré l'impact négatif évident de la décision de la Chine, la Chine va toujours de l'avant avec le projet, ce qui nuit à la sécurité des citoyens indiens et bangladais."
chi_news.22.a: "La Chine va construire une autre merveille"
chi_news.22.b: "Nous pouvons certainement achever le projet"
chi_news.22.c: "Les Chinois continuent de mettre notre patience à l'épreuve..."
chi_news.23: "La Chine achève la construction de la centrale hydroélectrique de Medog"
chi_news.23.t: "La Chine achève la construction de la centrale hydroélectrique de Medog"
chi_news.23.d: "Après près de quatre ans de construction, la Chine a annoncé ce matin qu'elle avait officiellement achevé la construction de la centrale hydroélectrique de Medog, un mégaprojet qui a fourni à la Chine plus d'électricité que prévu, créant ainsi un autre des plus grands projets hydroélectriques du monde.\n\nL'Inde et le Bangladesh insistent sur le fait que la centrale hydroélectrique de Medog a causé des impacts négatifs incommensurables sur leurs pays, mais à l'heure actuelle, la centrale hydroélectrique de Medog semble avoir aidé les deux pays à contrôler le débit du Brahmapoutre pendant la saison des crues."
chi_news.23.a: "Choquant"
chi_news.23.b: "Nous l'avons fait !"
chi_news.23.c: "Les Chinois continuent de mettre notre patience à l'épreuve..."
chi_news.24: "La Chine achève le projet de ceinture de protection des Trois Nord"
chi_news.24.t: "La Chine achève le projet de ceinture de protection des Trois Nord"
chi_news.24.d: "Le gouvernement chinois a annoncé qu'après plusieurs années de construction, son projet de ceinture de protection des Trois Nord, à grande échelle et coûteux, était achevé aujourd'hui. Les montagnes arides et les zones désertiques du nord de la Chine ont toutes été scientifiquement reverdies, ce qui apportera une contribution énorme à l'amélioration du climat dans le nord de la Chine.\n\nLes commentateurs ont souligné qu'il s'agit d'une autre victoire d'ingénierie de classe mondiale pour la Chine, qui apportera une expérience avancée et des modèles techniques à l'humanité pour améliorer l'environnement de la Terre."
chi_news.24.a: "Étonnant"
chi_news.24.b: "Belle mère patrie !"

#Japon#
riben_news.1: "Décès du Premier ministre japonais Keizo Obuchi"
riben_news.1.t: "Décès du Premier ministre japonais Keizo Obuchi"
riben_news.1.d: "Dimanche matin, le Premier ministre japonais Keizo Obuchi a été hospitalisé à la suite d'un accident vasculaire cérébral et d'une hémorragie cérébrale. Son état s'est rapidement détérioré. La télévision japonaise a cité lundi soir une source hospitalière affirmant qu'Obuchi était en état de mort cérébrale et n'était maintenu en vie que par des machines. Selon la constitution, si Obuchi décède, le Japon doit dissoudre le cabinet et réélire un nouveau Premier ministre. Il est prévu que la situation politique du Japon tombe dans le chaos à court terme. Comme il est presque certain qu'Obuchi est incapable d'exercer les fonctions de Premier ministre, le Parti libéral-démocrate discute de son successeur. Le candidat le plus probable est Yoshiro Mori, le secrétaire général du Parti libéral-démocrate."
riben_news.1.a: "La situation politique du Japon va-t-elle continuer à être dans le chaos ?"
#La situation politique du Japon est dans le chaos depuis plus d'une décennie.
riben_news.2: "Junichiro Koizumi prend ses fonctions de Premier ministre du Japon"
riben_news.2.t: "Junichiro Koizumi prend ses fonctions de Premier ministre du Japon"
riben_news.2.d: "En février, un groupe de lycéens japonais conduisait le navire de pêche Ehime, qui a été heurté et coulé par le sous-marin nucléaire USS Greenville dans les eaux d'Hawaï, tuant neuf personnes. L'ancien Premier ministre japonais Yoshiro Mori était bien que l'explication de Mori Yoshiro soit fondée, les premières pages des principaux médias ont présenté de grandes photos de Mori Yoshiro jouant au golf, ce qui a suscité la colère du public et a conduit le cabinet japonais à décider d'empêcher le gouvernement de publier une déclaration sur l'affaire. Le taux d'approbation est tombé à un chiffre sans précédent (5,7 %). Le chef du Parti démocrate d'opposition, Yukio Hatoyama, a plaisanté en disant que \"le taux d'approbation du cabinet Mori est comparable au taux de la taxe à la consommation du Japon (5 %)\". Deux mois plus tard, aujourd'hui, Yoshiro Mori a été contraint de démissionner.\n\nLe 26 avril, Junichiro Koizumi a été élu président du Parti libéral-démocrate avec une avance écrasante avec son slogan de campagne \"Changer le Parti libéral-démocrate, changer le Japon\", et est devenu le 87e Premier ministre du Cabinet et du Bureau du Premier ministre à Nagatacho. Le nouveau propriétaire."
riben_news.2.a: "Premier Premier ministre du Japon élu au nouveau siècle"
riben_news.3: "Shinzo Abe prend ses fonctions de Premier ministre du Japon"
riben_news.3.t: "Shinzo Abe prend ses fonctions de Premier ministre du Japon"
riben_news.3.d: "Le 20 septembre, Shinzo Abe, secrétaire général par intérim du Parti libéral-démocrate du Japon et chef du siège de la promotion de la réforme du parti, a été élu 21e président du Parti libéral-démocrate. Le 26 septembre, Shinzo Abe a été élu 90e Premier ministre du cabinet japonais, devenant le premier né après-guerre et le plus jeune Premier ministre après-guerre. Le 26 septembre, l'ancien Premier ministre japonais Junichiro Koizumi a terminé son mandat et a quitté ses fonctions de Premier ministre du cabinet japonais, et Shinzo Abe a pris la relève."
riben_news.3.a: "Premiers ministres de la génération d'après-guerre"
riben_news.4: "Yasuo Fukuda prend ses fonctions de Premier ministre du Japon"
riben_news.4.t: "Yasuo Fukuda prend ses fonctions de Premier ministre du Japon"
riben_news.4.d: "Le 29 juillet, le Parti libéral-démocrate dirigé par le Premier ministre japonais Shinzo Abe a subi une défaite écrasante aux élections du Sénat japonais. C'était la première fois en 52 ans depuis la fondation du Parti libéral-démocrate qu'il devenait le deuxième plus grand parti du Sénat et perdait le contrôle du Sénat. Le 27 août, Shinzo Abe a remanié son cabinet, mais plusieurs membres du cabinet ont tout de même démissionné en raison de scandales et de gaffes, et le soutien au cabinet Abe a continué de baisser. Le 12 septembre, Shinzo Abe a annoncé qu'il démissionnerait de son poste de Premier ministre pour des raisons de santé personnelles et suspenderait ses activités politiques.\n\nDans l'après-midi du 23 septembre, le Parti libéral-démocrate au pouvoir au Japon a tenu une réunion des membres des deux chambres. Les membres du parlement du parti et les représentants des branches locales ont organisé une élection pour le nouveau président. En fin de compte, l'ancien secrétaire général du cabinet Yasuo Fukuda (71 ans) a battu le secrétaire général du parti Taro Aso (67 ans) et a été élu 22e président du Parti libéral-démocrate. Fukuda a obtenu un total de 330 voix, tandis qu'Aso a obtenu 197 voix. Lors de la session plénière de la Chambre des représentants tenue le 25 septembre, Yasuo Fukuda a été élu 91e Premier ministre, remplaçant l'actuel Premier ministre Shinzo Abe (53 ans), et a formé un nouveau cabinet le même jour. Yasuo Fukuda est le fils aîné de l'ancien Premier ministre japonais Takeo Fukuda, de sorte que le Japon a la première génération de Premiers ministres, père et fils."
riben_news.4.a: "Un bon fils de la famille Fukuda"
riben_news.5: "Taro Aso devient Premier ministre du Japon"
riben_news.5.t: "Taro Aso devient Premier ministre du Japon"
riben_news.5.d: "Dans la soirée du 1er septembre 2008, le Premier ministre japonais Yasuo Fukuda a annoncé sa démission au Bureau du Premier ministre, choquant tout le pays. Fukuda a déclaré qu'il avait pris cette décision politique le week-end dernier après avoir examiné tous les aspects. Contrairement à l'ancien Premier ministre Shinzo Abe qui a soudainement démissionné pour des raisons de santé, il n'y a aucun problème avec sa santé. Il a déclaré qu'il avait démissionné pour éviter un \"vide politique\" dans le pays avec la deuxième plus grande économie du monde. Il espère que sa démission pourra briser l'impasse politique entre les deux partis au Japon. Fukuda a déclaré lors d'une conférence de presse : \"Si nous donnons la priorité à la vie des gens, nous ne pouvons pas laisser les négociations politiques créer un vide politique. Nous avons besoin d'une nouvelle équipe pour mettre en œuvre nos politiques.\"\n\nAprès que Fukuda Yasuo a annoncé sa démission, le Comité de gestion des élections présidentielles du Parti libéral-démocrate a tenu une réunion dans l'après-midi du 2 septembre 2008 et a décidé de publier officiellement l'annonce des élections le 10 septembre et d'organiser le vote le 22 septembre. Cela signifie que le nouveau candidat au poste de Premier ministre japonais sera révélé le 22 septembre, et Taro Aso, qui a perdu deux élections consécutives, fera un retour et espérons réaliser son souhait de longue date. Taro Aso a affronté quatre autres candidats à la présidence du PLD et a remporté 351 voix sur 527, battant Kaoru Yosano, Yuriko Koike, Shinko Ishihara et Shigeru Ishiba avec une avance absolue. Il a été élu 23e président du Parti libéral-démocrate du Japon. Le 24 septembre, Taro Aso est devenu le 92e Premier ministre du Japon, créant la première famille de Premiers ministres à trois générations de l'histoire japonaise (grand-père Shigeru Yoshida, beau-père Zenko Suzuki et Taro Aso). Le représentant par intérim du Parti démocrate, Naoto Kan, a dit sarcastiquement : \"Au sein du Parti libéral-démocrate, seul le petit-fils ou le fils du Premier ministre peut être Premier ministre.\""
riben_news.5.a: "Le dandy"
riben_news.6: "Yukio Hatoyama prend ses fonctions de Premier ministre du Japon"
riben_news.6.t: "Yukio Hatoyama prend ses fonctions de Premier ministre du Japon"
riben_news.6.d: "Le 30 août, les résultats de la 45e élection de la Chambre des représentants au Japon ont été annoncés. Le Parti démocrate a remporté 308 sièges, soit une augmentation nette de 193 sièges, tandis que les sièges du Parti libéral-démocrate ont été réduits de 300 à 119. De nombreux politiciens chevronnés ont perdu les élections. Pour la première fois depuis sa création en 1955, le Parti libéral-démocrate a perdu sa position de plus grand parti de la Chambre des représentants. Le 30 août 2009, Yukio Hatoyama a mené le Parti démocrate à une victoire historique aux élections de la Chambre des représentants, mettant fin à la position de longue date du Parti libéral-démocrate. Le 16 septembre, Yukio Hatoyama, le représentant (c'est-à-dire le chef du parti) du Parti démocrate du Japon, a été élu nouveau Premier ministre du Japon lors de l'élection spéciale de nomination du Premier ministre au Parlement. Dans l'après-midi du même jour, la Chambre des représentants et la Chambre des conseillers du Parlement japonais ont tenu des sessions plénières pour organiser l'élection de nomination du Premier ministre. Lors du premier vote de la Chambre des représentants, Hatoyama a remporté plus de la moitié des voix avec 327 votes ; lors du vote ultérieur du Sénat, Hatoyama a également remporté plus de la moitié des voix avec 124 votes. Hatoyama a ainsi été élu 93e Premier ministre du Japon. Le 26 septembre, l'ensemble du cabinet de l'ancien Premier ministre Aso a démissionné."
riben_news.6.a: "Un gentleman amical"
riben_news.7: "Naoto Kan devient Premier ministre du Japon"
riben_news.7.t: "Naoto Kan devient Premier ministre du Japon"
riben_news.7.d: "En raison de la fermentation de la question de la délocalisation de la base aérienne de Futenma de l'armée américaine stationnée au Japon, le Parti social-démocrate a annoncé son retrait du gouvernement de coalition le 30 mai, et le taux de soutien du cabinet Hatoyama est tombé à 17 %. Le 2 juin, Hatoyama a annoncé sa démission. Dans l'après-midi du 14 septembre 2017, le Parti démocrate du Japon a tenu une réunion extraordinaire du parti à Tokyo pour voter sur l'élection du prochain représentant du parti démocrate. Lors de la réunion, les deux candidats, l'ancien secrétaire général du Parti démocrate Ichiro Ozawa (68 ans) et le chef du parti et Premier ministre de l'époque, Naoto Kan (63 ans) ont prononcé leurs discours finaux, puis les membres de la Chambre des représentants et du Sénat du Parti démocrate ont voté. À 15h39, le Comité de gestion des élections du Parti démocrate a annoncé qu'Ichiro Ozawa avait reçu 491 voix et Naoto Kan 721 voix. Les voix des membres du parlement, plus les \"votes locaux\" des autres partisans du parti et des conseillers locaux qui ont commencé à compter les votes tôt le matin du même jour, les trois statistiques de vote ont montré que Naoto Kan avait l'avantage en termes de nombre de voix et a battu Ichiro Ozawa pour devenir le représentant du Parti démocrate. Naoto Kan a donc été élu 94e Premier ministre du Japon."
riben_news.7.a: "Premier ministre civil travailleur"
riben_news.8: "Yoshihiko Noda prend ses fonctions de Premier ministre du Japon"
riben_news.8.t: "Yoshihiko Noda prend ses fonctions de Premier ministre du Japon"
riben_news.8.d: "Le 1er juin, trois partis d'opposition au Japon ont proposé une \"motion de censure contre le cabinet\", estimant que le Premier ministre Naoto Kan était incompétent dans le processus de secours après le tremblement de terre et ont exigé sa démission. Plus tard, cinq hauts fonctionnaires de niveau ministériel adjoint du gouvernement japonais ont collectivement présenté leur démission au Premier ministre Naoto Kan dans la soirée, exprimant leur accord avec la \"motion de censure contre le cabinet\". Le 26 août, le Premier ministre japonais et chef du Parti démocrate, Naoto Kan, a officiellement annoncé sa démission de son poste de chef du parti lors de la réunion des cadres supérieurs du Parti démocrate. Le même jour, le Premier ministre japonais Naoto Kan, âgé de 64 ans, a officiellement annoncé sa démission de son poste de Premier ministre après que la \"Loi spéciale sur l'émission de dette publique\" et la \"Loi spéciale sur les mesures relatives aux énergies renouvelables\", conditions de sa démission, ont été adoptées par la session plénière du Sénat. L'ancien ministre des Finances Yoshihiko Noda a été le nouveau Premier ministre du Japon. Le 2 septembre, à 10 heures du matin, le nouveau Premier ministre japonais Yoshihiko Noda est entré dans le Bureau du Premier ministre pour la première fois en tant que Premier ministre et a commencé à former un cabinet. Noda a été accueilli par le personnel de la résidence officielle aligné, conformément au processus de formation du cabinet."
riben_news.8.a: "Disciples de Konosuke Matsushita"
riben_news.9: "Shinzo Abe prend une nouvelle fois ses fonctions de Premier ministre du Japon"
riben_news.9.t: "Shinzo Abe prend une nouvelle fois ses fonctions de Premier ministre du Japon"
riben_news.9.d: "Le 26 septembre, l'ancien Premier ministre japonais Shinzo Abe a battu son rival Shigeru Ishiba après deux tours de scrutin du parti et a été élu 25e président du Parti libéral-démocrate, devenant le premier ancien président du Parti libéral-démocrate à revenir au pouvoir. Le 29 octobre, le Parti libéral-démocrate, qui contrôlait le Sénat, dirigé par Shinzo Abe, a rejeté le discours politique du Premier ministre Yoshihiko Noda à la Diète et a personnellement uni sept partis d'opposition, dont le Parti libéral-démocrate et le Komeito, pour forcer Noda Yoshihiko à dissoudre la Chambre des représentants dès que possible. Le 16 novembre, après un débat avec le Premier ministre de l'époque, Yoshihiko Noda, Shinzo Abe a déclaré qu'il soutenait pleinement la proposition du Premier ministre Yoshihiko Noda de réduire le nombre de membres et ferait tout son possible pour promouvoir l'adoption de la proposition lors de la Diète ordinaire de 2013 (c'est-à-dire la Diète régulière), car Noda Yoshihiko avait accepté de dissoudre la Chambre des représentants. Dans la soirée du 29 novembre, Shinzo Abe, en tant que président du Parti libéral-démocrate, le premier débat de chef de parti de l'histoire du Japon a été diffusé en direct en ligne, l'accent étant mis sur des questions telles que la politique nucléaire, l'économie, l'augmentation de la taxe à la consommation et la diplomatie. Le 25 décembre, Tokyo a organisé une élection pour un nouveau chef de parti. Tous les membres de la Chambre des représentants et du Sénat du Parti démocrate ont voté pour élire l'ancien ministre de l'Économie, du Commerce et de l'Industrie, Banri Kaieda, comme nouveau chef du Parti démocrate. Il est rapporté que le Parti démocrate dirigé par Noda a subi une défaite écrasante lors des élections générales du 16 décembre, et Noda, qui occupait le poste de chef du parti, a ensuite annoncé sa démission. Le 16 décembre, le Parti libéral-démocrate a remporté une victoire écrasante aux élections de la Chambre des représentants et a repris le pouvoir. Shinzo Abe est confirmé pour servir à nouveau en tant que Premier ministre du Japon. Le 26 décembre, Shinzo Abe a pris ses fonctions de 96e Premier ministre du Japon."
riben_news.9.a: "Le \"chaos millénaire\" du Japon qui dure depuis une décennie a pris fin"
riben_news.10: "Yoshihide Suga prend ses fonctions de Premier ministre du Japon"
riben_news.10.t: "Yoshihide Suga prend ses fonctions de Premier ministre du Japon"
riben_news.10.d: "Le 23 août 2020, le nombre de jours consécutifs cumulés de Shinzo Abe au poste de Premier ministre a atteint 2 799 jours, dépassant l'ancien Premier ministre japonais Sato Eisaku pour devenir le Premier ministre japonais le plus longtemps en poste. Le 28 août, afin d'éviter l'aggravation de son ancienne maladie et d'autres facteurs susceptibles d'affecter les affaires nationales, Shinzo Abe a décidé de démissionner de son poste de Premier ministre, mais il continuera à servir jusqu'à l'élection d'un nouveau Premier ministre. Le 16 septembre, Shinzo Abe a officiellement démissionné de son poste de Premier ministre et a quitté la résidence du Premier ministre sous les adieux du nouveau président du Parti libéral-démocrate, Yoshihide Suga, et d'autres membres du personnel de la résidence officielle.\n\nLe 30 août, Yoshihide Suga a exprimé son intention de se présenter aux élections présidentielles du Parti libéral-démocrate. Le 31 août, les plus grandes factions du Parti libéral-démocrate, la faction Hosoda (98 personnes) et la faction Aso (54 personnes), ont pratiquement décidé de soutenir Yoshihide Suga. Le 2 septembre, il a officiellement annoncé sa participation aux élections présidentielles du Parti libéral-démocrate. Le 14 septembre, Yoshihide Suga a obtenu 377 voix (sur un total de 534 votes valides) et a été élu président du Parti libéral-démocrate au pouvoir avec une avance absolue. Le 16 septembre, la Chambre des représentants de la Diète japonaise a convoqué un parlement extraordinaire pour organiser l'élection de la nomination du Premier ministre. Yoshihide Suga, président du Parti libéral-démocrate au pouvoir, a été élu 99e Premier ministre du Japon et a formé un nouveau cabinet le même jour. Il s'est ensuite rendu au Palais impérial pour assister à la cérémonie de nomination du Premier ministre et à la cérémonie de certification du cabinet."
riben_news.10.a: "Le dernier Premier ministre à avoir présidé un changement de nom d'ère était..."
riben_news.11: "Fumio Kishida prend ses fonctions de Premier ministre du Japon"
riben_news.11.t: "Fumio Kishida prend ses fonctions de Premier ministre du Japon"
riben_news.11.d: "Le 3 septembre 2021, le Premier ministre japonais Yoshihide Suga a déclaré lors d'une réunion de haut niveau intérimaire du Parti libéral-démocrate tenue à Tokyo qu'il ne participerait pas aux élections présidentielles du Parti libéral-démocrate en septembre. Le 17 septembre, l'élection présidentielle du Parti libéral-démocrate japonais a officiellement annoncé que Fumio Kishida et quatre autres candidats étaient candidats. Le 29 septembre, l'élection présidentielle du Parti libéral-démocrate japonais a été votée. Fumio Kishida a obtenu 257 voix, devançant Taro Kono de 87 voix, et a remporté avec une avance claire. Il a été élu avec succès 27e président du Parti libéral-démocrate. Conformément à la convention, il succédera à Yoshihide Suga au poste de Premier ministre. Le 4 octobre, le Japon a tenu une réunion intérimaire du cabinet. Le cabinet Suga a démissionné à l'unanimité lors de la réunion. Fumio Kishida a été officiellement élu 100e Premier ministre du Japon. Par la suite, la cérémonie de nomination du Premier ministre et de certification des ministres du cabinet a eu lieu au Palais impérial japonais, et le nouveau cabinet a été officiellement constitué. Ce soir-là, Fumio Kishida a tenu sa première conférence de presse après sa prise de fonctions au Bureau du Premier ministre. Lors de la conférence de presse, il a officiellement annoncé que la Chambre des représentants serait dissoute le 14 octobre et que la prochaine élection de la Chambre des représentants aurait lieu le 31 octobre."
riben_news.11.a: "Quand je serai roi, je ferai de nouvelles lois fiscales !"
riben_news.12: "Naissance du prince Hisahito d'Akishino"
riben_news.12.t: "Naissance du prince Hisahito d'Akishino"
riben_news.12.d: "Le prince Hisahito, fils du prince héritier japonais Akishino, est né par césarienne à l'hôpital Aiyuk de Tokyo à 8h27 le 6 septembre 2006 (UTC 23h27 le 5 septembre). Il mesure 48,8 cm et pèse 2558 g (5,64 livres). Il est le premier enfant mâle de la famille impériale japonaise en 41 ans depuis la naissance de son père, le prince Akishino, en 1965. Le prince Akishino a nommé son fils aîné \"Hisahitō\" (en japonais : ひさひと) lors de la \"cérémonie de nomination\", ce qui signifie \"J'espère que l'enfant marchera tranquillement à travers les longues années.\" \"Une longue vie\".\n\nDepuis la naissance du prince Akishino, il n'y a pas eu de descendant mâle dans la famille impériale japonaise, ce qui a posé un très grave problème de succession. Parce que les deux fils légitimes de l'empereur Akihito du Japon, le fils aîné, le prince héritier Naruhito, et le deuxième fils, le prince Akishino, n'avaient pas de descendance mâle auparavant, la naissance du prince Hisahito était très importante pour l'héritage de la famille impériale japonaise. La naissance du prince Hisahito a temporairement éliminé la crise de l'extinction de la lignée impériale et a également mis de côté la proposition de révision de la loi impériale. La naissance de l'héritier du trône a rendu le terme \"études impériales\" à nouveau populaire au Japon."
riben_news.12.a: "Le prochain empereur"
riben_news.13: "L'empereur Naruhito monte sur le trône"
riben_news.13.t: "L'empereur Naruhito monte sur le trône"
riben_news.13.d: "Le 1er avril 2019 à 9h30, le secrétaire général du cabinet japonais, Yoshihide Suga, a organisé une réunion d'experts au Bureau du Premier ministre. Suga a écouté les opinions du président de la Chambre des représentants, Tadashi Oshima, et du président du Sénat, Tadakazu Date. Ensuite, l'ancien Premier ministre japonais, Shinzo Abe, a convoqué une réunion du cabinet à laquelle ont participé tous les membres du cabinet, a écouté les opinions des membres du cabinet et a finalement décidé que \"Reiwa\" serait choisi comme nouveau nom d'ère du Japon. En même temps, les candidats pour le nom d'ère étaient Eihiro, Hiroshi, Manwa, Manpo et Hisaha (Eihiro a été sélectionné dans d'anciens livres japonais, Hiroshi a été sélectionné dans le Livre des Odes et le Nihonshoki, Wanhe, Wanbao et Jiuhua proviennent tous d'anciens livres chinois).\n\nLe 30 avril, l'empereur Akihito du Japon a abdiqué et est devenu l'empereur retiré. Le 1er mai, le prince héritier Naruhito est monté sur le trône en tant que nouvel empereur, devenant le 126e empereur. Le Japon a officiellement adopté le nouveau nom d'ère \"Reiwa\", et le Japon est officiellement entré dans l'\"ère Reiwa\". Lors de la \"Cérémonie d'intronisation dans la salle principale\", Naruhito a promis d'être proche du peuple, de respecter la Constitution japonaise et d'espérer l'amitié et la paix dans le monde. Le Premier ministre japonais de l'époque, Shinzo Abe, a félicité l'empereur Naruhito pour son accession au trône au nom de tout le peuple japonais."
riben_news.13.a: "À cette époque, c'était le premier mois du printemps, avec un temps doux et des brises légères."
riben_news.14: "Shinzo Abe a été assassiné"
riben_news.14.t: "Shinzo Abe a été assassiné"
riben_news.14.d: "Vers 11h30 le 8 juillet 2022, l'ancien Premier ministre japonais Shinzo Abe a prononcé un discours de campagne dans la rue près d'une station de métro de la ville de Nara pour solliciter des voix pour le candidat du Parti libéral-démocrate aux élections sénatoriales. Il y avait environ 30 personnes sur les lieux. Une ou deux minutes après le début du discours, un homme a tiré sur Abe à 3 mètres derrière lui. Abe a été touché à la poitrine et au cou et est tombé au sol. Par la suite, Abe a été transporté d'urgence à l'hôpital par ambulance et transféré à l'hôpital universitaire de médecine de la préfecture de Nara par hélicoptère médical. Les pompiers locaux ont déclaré qu'Abe avait perdu connaissance pendant le transfert et était dans un état critique. À 17h03, l'ancien Premier ministre japonais Shinzo Abe est décédé de ses blessures après avoir été blessé par balle. Il avait 67 ans.\n\nSelon les informations de la télévision japonaise, la police a arrêté un suspect nommé Tetsuya Yamagami. Selon les dernières nouvelles de Kyodo News, l'homme arrêté dans l'affaire de la fusillade d'Abe est originaire de la ville de Nara. Selon le Yomiuri Shimbun, Tetsuya Yamagami est un ancien membre de la Force maritime d'autodéfense japonaise. Tetsuya Yamagami a avoué que l'arme qu'il a utilisée était un \"pistolet fabriqué par lui-même après avoir acheté des pièces en ligne\"."
riben_news.14.a: "Ce n'est que quand tu pars que tu réalises ce qu'est ce monde, les fleurs sont des fleurs et les gens sont des gens"
riben_news.15: "Shigeru Ishiba prend ses fonctions de Premier ministre du Japon"
riben_news.15.t: "Shigeru Ishiba devient Premier ministre du Japon"
riben_news.15.d: "En août 2024, le Premier ministre japonais et président du Parti libéral-démocrate au pouvoir, Fumio Kishida, a annoncé qu'il ne participerait pas aux élections présidentielles du parti qui se tiendront en septembre. Le 18 août, Shigeru Ishiba a annoncé sa participation à l'élection du président du Parti libéral-démocrate. C'est la cinquième fois qu'il se présente à la présidence du Parti libéral-démocrate. Le 27 septembre, les résultats du premier tour de scrutin pour l'élection présidentielle du Parti libéral-démocrate ont été annoncés. Au premier tour de scrutin, aucun des neuf candidats n'a obtenu plus de la moitié des voix. Les deux premiers candidats, Sanae Takaichi et Shigeru Ishiba, sont entrés au deuxième tour de scrutin. Le même jour, Shigeru Ishiba a remporté le deuxième tour de scrutin pour l'élection présidentielle du Parti libéral-démocrate. Le nombre réel de voix au deuxième tour était de 414, dont 409 étaient des votes valides. Shigeru Ishiba a finalement été élu président du Parti libéral-démocrate avec 215 voix. Le 28e président.\n\nLe 1er octobre, le cabinet Kishida du Japon a démissionné collectivement lors de la réunion intérimaire du cabinet ; le même jour, la Chambre des représentants et le Sénat du parlement intérimaire du Japon ont organisé une élection pour la nomination du président du Parti libéral-démocrate, Shigeru Ishiba, au poste de Premier ministre. Shigeru Ishiba a remporté plus de la moitié des voix à la Chambre des représentants et au Sénat respectivement et a été élu 102e Premier ministre du Japon. Par la suite, Shigeru Ishiba a formé un cabinet et a annoncé la liste des membres du cabinet. Le 3 octobre, Shigeru Ishiba a remis des lettres de nomination aux ministres et aux responsables politiques au Bureau du Premier ministre, a pris une photo de groupe et a assisté à la première réunion des ministres et des responsables politiques. Le 4 octobre, Shigeru Ishiba a prononcé un discours de politique générale au Parlement japonais, exposant ses propositions de gouvernance sous de nombreux aspects tels que les affaires intérieures, la diplomatie, l'économie et les moyens de subsistance du peuple."
riben_news.15.a: "Celui qui est plein de rébellion est devenu Premier ministre ?"
riben_news.16: "L'empereur Naruhito lit l'édit de paix"
riben_news.16.t: "L'empereur Naruhito lit l'édit de paix"
riben_news.16.d: "Après que la République populaire de Chine a mis fin à son occupation du Japon, l'empereur japonais Naruhito a lu aujourd'hui un édit impérial, annonçant que la Chine et le Japon maintiendront la paix pour toujours et ne violeront pas la souveraineté territoriale l'un de l'autre. Le parlement japonais rendra le pouvoir à l'empereur après avoir formulé une nouvelle constitution. La famille impériale japonaise respectera sa promesse de protéger ses citoyens et renoncera définitivement au pouvoir de faire la guerre.\n\nLes observateurs pensent que cela marque l'établissement officiel de la juridiction de la République populaire de Chine sur le Japon. On ne sait pas encore comment cet empereur d'après-guerre gérera sa relation avec l'histoire."
riben_news.16.a: "Le deuxième retour au pouvoir"
riben_news.17: "L'empereur Hisahito lit l'édit de paix"
riben_news.17.t: "L'empereur Hisahito lit l'édit de paix"
riben_news.17.d: "Après que la République populaire de Chine a mis fin à son occupation du Japon, l'empereur japonais a annoncé son abdication, et le prince Akishino Hisahito est monté sur le trône en tant que nouvel empereur japonais. Il a lu aujourd'hui un édit impérial, annonçant que la Chine et le Japon maintiendront la paix pour toujours et ne violeront pas la souveraineté territoriale l'un de l'autre. Le parlement japonais rendra le pouvoir à l'empereur après avoir promulgué une nouvelle constitution. La famille impériale japonaise respectera sa promesse de protéger ses citoyens et renoncera définitivement au pouvoir de faire la guerre.\n\nLes observateurs pensent que cela marque l'établissement officiel de la juridiction de la République populaire de Chine sur le Japon. L'empereur est médiocre et inapte à gouverner. On dit qu'il a confié les affaires gouvernementales à plusieurs anciens."
riben_news.17.a: "Le deuxième retour au pouvoir"
riben_news.18: "L'empereur Kako lit l'édit de paix"
riben_news.18.t: "L'empereur Kako lit l'édit de paix"
riben_news.18.d: "Après que la République populaire de Chine a mis fin à son occupation du Japon, l'empereur japonais a annoncé son abdication, et la princesse Kako Akishino lui a succédé sur le trône en tant que nouvelle impératrice japonaise. Elle a lu aujourd'hui un édit impérial, annonçant que la Chine et le Japon maintiendront la paix pour toujours et ne violeront pas la souveraineté territoriale l'un de l'autre. Le parlement japonais rendra le pouvoir à l'empereur après avoir formulé une nouvelle constitution. La famille impériale japonaise respectera sa promesse de protéger ses citoyens et renoncera définitivement au pouvoir de faire la guerre.\n\nLes observateurs pensent que cela marque l'établissement officiel de la juridiction de la République populaire de Chine sur le Japon. C'est la neuvième impératrice de l'histoire du Japon et la première impératrice après la fin du shogunat Tokugawa. Son caractère intelligent, doux et diligent l'a destinée à être une impératrice qui aime le peuple."
riben_news.18.a: "Le deuxième retour au pouvoir"
riben.15: "Le destin du Japon"
riben.15.t: "Le destin du Japon"
riben.15.d: "Les autorités japonaises ont renoncé à la résistance et se sont rendues. Nous pouvons maintenant décider quoi faire du pays."
riben.15.a: "Construire un Japon loyal"
riben.15.b: "Occuper le Japon"
riben.16: "Le choix de l'empereur ?"
riben.16.t: "Le choix de l'empereur ?"
riben.16.d: "Nous pouvons prendre le contrôle du pouvoir politique du Japon en transférant superficiellement le pouvoir du parlement japonais à l'empereur. Il y a plusieurs candidats parmi lesquels choisir. Qui devrait être choisi comme empereur ?"
riben.16.a: "Laissons Naruhito, qui est prêt à affronter l'histoire, devenir empereur"
riben.16.b: "Laissons le saint prince Hisahito devenir l'empereur"
riben.16.c: "Laissons la douce et vertueuse princesse Kako devenir l'impératrice"


#Mer de Chine méridionale#
chi_south_china_sea_GR.0.t: "Négociations sur les îles Spratlys"
chi_south_china_sea_GR.0.d: "[CHI.GetName] exige que nous reconnaissions leur souveraineté sur les îles Spratlys et que nous y retirions nos troupes. En retour, ils nous accorderont une certaine capacité économique pour nous aider à développer notre économie et partageront le pétrole découvert dans les îles Spratlys à l'avenir."
chi_south_china_sea_GR.0.a: "Nous acceptons volontiers"
chi_south_china_sea_GR.0.b: "C'est absolument impossible !"
chi_south_china_sea_GR.1: "Appel du Vietnam"
chi_south_china_sea_GR.1.t: "Appel du Vietnam"
chi_south_china_sea_GR.1.d: "Après nos efforts diplomatiques et nos explorations amicales à long terme, le gouvernement vietnamien a exprimé sa volonté de reconnaître la souveraineté de la République populaire de Chine sur la partie ouest des îles Nansha et les îles Xisha et de retirer ses troupes. En même temps, le gouvernement vietnamien a proposé de partager avec nous le pétrole découvert dans les îles Nansha à l'avenir et nous a demandé de prendre en charge les coûts du projet d'exploration pétrolière offshore du Vietnam, qui était déjà à moitié réalisé."
chi_south_china_sea_GR.1.a: "Nous sommes certainement d'accord pour que l'amitié sino-vietnamienne dure éternellement"
chi_south_china_sea_GR.2: "Appel des Philippines"
chi_south_china_sea_GR.2.t: "Appel des Philippines"
chi_south_china_sea_GR.2.d: "Après nos efforts diplomatiques et nos explorations amicales à long terme, le gouvernement philippin a exprimé sa volonté de reconnaître la souveraineté de la République populaire de Chine sur la partie est des îles Nansha et les îles Zhongsha et de retirer ses troupes. En même temps, le gouvernement philippin a proposé de partager avec nous le pétrole découvert dans les îles Nansha à l'avenir et nous a demandé de prendre en charge les coûts du projet d'exploration pétrolière offshore des Philippines, qui était déjà à moitié réalisé."
chi_south_china_sea_GR.2.a: "Nous sommes certainement d'accord pour que l'amitié sino-philippine dure éternellement"
chi_south_china_sea_GR.3: "Appel de la Malaisie"
chi_south_china_sea_GR.3.t: "Appel de la Malaisie"
chi_south_china_sea_GR.3.d: "Suite à l'expérience du Vietnam et des Philippines, la Malaisie a également exprimé sa volonté de reconnaître la souveraineté de la République populaire de Chine sur la partie sud des îles Spratlys et de retirer ses troupes. De même, le gouvernement malaisien a proposé de partager avec nous le pétrole découvert dans les îles Spratlys à l'avenir et nous a demandé de prendre en charge les coûts de leur projet d'exploration pétrolière offshore, qui est déjà réalisé à moitié."
chi_south_china_sea_GR.3.a: "Nous sommes certainement d'accord pour que l'amitié sino-malaise dure éternellement"
chi_south_china_sea_GR.10.t: "Les négociations sur les îles Spratlys ont été rejetées"
chi_south_china_sea_GR.10.d: "[FROM.GetName] a rejeté notre souveraineté sur les îles Spratlys. Nous devons faire quelque chose !"
chi_south_china_sea_GR.10.a: "Nous devons utiliser la force"
chi_south_china_sea_GR.10.b: "Nous ferons des plans plus tard"
#Mer de Chine orientale#
chi_east_china_sea_GR.1: "La Chine mène des exercices provocateurs de la flotte en mer de Chine orientale !"
chi_east_china_sea_GR.1.t: "La Chine mène des exercices provocateurs de la flotte en mer de Chine orientale !"
chi_east_china_sea_GR.1.d: "Dans le but d'affirmer sa souveraineté sur les îles Senkaku, la Chine a ordonné des exercices provocateurs de la flotte dans les eaux des îles Senkaku et d'Okinawa. Nous devrions envisager d'utiliser notre marine pour mener des opérations de liberté de navigation afin de montrer au monde que ces eaux appartiennent à la communauté internationale, et non à la Chine."
chi_east_china_sea_GR.1.a: "Nous ne pouvons pas nous permettre d'affronter la Chine..."
chi_east_china_sea_GR.1.b: "Nous devons défendre la liberté de navigation !"
chi_east_china_sea_GR.2: "Des Américains et des Japonais mènent des patrouilles agressives près des îles Diaoyu !"
chi_east_china_sea_GR.2.t: "Des Américains et des Japonais mènent des patrouilles agressives près des îles Diaoyu !"
chi_east_china_sea_GR.2.d: "En réponse à nos exercices de flotte parfaitement légaux dans les eaux des îles Diaoyu, les Américains ont mené la Force maritime d'autodéfense japonaise dans nos eaux souveraines dans un mouvement agressif mais inutile. Nous pouvons simplement attendre que les Américains quittent nos eaux, ou nous pouvons affirmer notre souveraineté sur les îles Diaoyu en démontrant toute la puissance de notre marine aux Américains."
chi_east_china_sea_GR.2.a: "Nous ne devrions pas risquer la guerre sur cette question..."
chi_east_china_sea_GR.2.b: "Expulsez les impérialistes !"
chi_east_china_sea_GR.3: "La Chine a attaqué nos patrouilles de liberté de navigation !"
chi_east_china_sea_GR.3.t: "La Chine a attaqué nos patrouilles de liberté de navigation !"
chi_east_china_sea_GR.3.d: "Il est choquant que nos patrouilles de liberté de navigation en mer de Chine orientale aient été attaquées, qu'un de nos navires ait été coulé et que plusieurs militaires américains aient été tués. Les gens au pays réclament une réponse, mais voulons-nous vraiment déclarer la guerre pour un conflit mineur ?"
chi_east_china_sea_GR.3.a: "Nous ne devrions pas aggraver la situation..."
chi_east_china_sea_GR.3.b: "Ce comportement doit être puni !"
chi_east_china_sea_GR.4: "La Chine exige que nous retirions nos troupes d'Okinawa !"
chi_east_china_sea_GR.4.t: "La Chine exige que nous retirions nos troupes d'Okinawa !"
chi_east_china_sea_GR.4.d: "La République populaire de Chine nous a demandé de retirer nos troupes d'Okinawa pour les protéger de la menace de la \"chaîne insulaire\". Cette demande est sans aucun doute un prélude aux préparatifs de la Chine pour attaquer le Japon. Si nous nous retirons du Japon, la possibilité d'un conflit entre la Chine et le Japon augmentera considérablement."
chi_east_china_sea_GR.4.a: "Absurde"
chi_east_china_sea_GR.4.b: "Ne nous mêlons pas de cette affaire..."
chi_east_china_sea_GR.5: "La Chine exige que nous mettions fin à notre domination sur Okinawa !"
chi_east_china_sea_GR.5.t: "La Chine exige que nous mettions fin à notre domination sur Okinawa !"
chi_east_china_sea_GR.5.d: "La Chine nous a condamnés internationalement et a exigé que nous mettions immédiatement fin à l'\"occupation illégale\" d'Okinawa et permettions aux Ryukyu de \"restaurer leur indépendance\"."
chi_east_china_sea_GR.5.a: "Laissez-les danser avec ces insulaires du pays..."
chi_east_china_sea_GR.5.b: "Le Japon ne doit pas perdre Okinawa !"
chi_east_china_sea_GR.6: "Les Américains se retirent d'Okinawa !"
chi_east_china_sea_GR.6.t: "Les Américains se retirent d'Okinawa !"
chi_east_china_sea_GR.6.d: "Selon l'observation de la flotte de destroyers, les troupes américaines stationnées à Okinawa ont progressivement évacué la base militaire ce matin, et à l'extérieur de la porte se trouvent des habitants d'Okinawa qui applaudissent et exultent."
chi_east_china_sea_GR.6.a: "Allez-vous en"
chi_east_china_sea_GR.7: "Les États-Unis ont ignoré nos demandes"
chi_east_china_sea_GR.7.t: "Les États-Unis ont ignoré nos demandes"
chi_east_china_sea_GR.7.d: "Les États-Unis ont ignoré nos menaces de se retirer de leurs bases d'Okinawa et ont augmenté les expéditions d'équipement militaire vers les bases d'Okinawa."
chi_east_china_sea_GR.7.a: "Les ambitions impériales ne meurent jamais..."
chi_east_china_sea_GR.7.b: "Alors aidons-les à sortir !"
chi_east_china_sea_GR.8: "Le Japon nous ignore !"
chi_east_china_sea_GR.8.t: "Le Japon nous ignore !"
chi_east_china_sea_GR.8.d: "Le Japon a ignoré nos doutes quant à sa juridiction sur Okinawa et a intensifié les patrouilles dans les eaux au large d'Okinawa avec la présence militaire américaine."
chi_east_china_sea_GR.8.a: "Le soleil levant brûle toujours le peuple Ryukyu..."
chi_east_china_sea_GR.8.b: "Libérez le peuple Ryukyu !"
chi_east_china_sea_GR.9: "Le Japon a libéré Ryukyu !"
chi_east_china_sea_GR.9.t: "Le Japon a libéré Ryukyu !"
chi_east_china_sea_GR.9.d: "Le Japon a décidé ce matin de restituer la juridiction de Ryukyu sur Okinawa et de reconnaître le royaume de Ryukyu comme un pays indépendant."
chi_east_china_sea_GR.9.a: "Cette fois, je ne vous abandonnerai plus"
chi_east_china_sea_GR.10: "La Chine revendique les îles Senkaku !"
chi_east_china_sea_GR.10.t: "La Chine revendique les îles Senkaku !"
chi_east_china_sea_GR.10.d: "La Chine a repris son différend avec nous sur la propriété des îles Senkaku. Si nous cédons à leurs demandes, nous pourrions accroître la confiance de la Chine en sa capacité à influencer notre politique étrangère et réduire notre popularité nationaliste auprès de notre peuple. Cependant, les conséquences d'un refus pourraient ne pas non plus être favorables pour nous."
chi_east_china_sea_GR.10.a: "Juste une île de pêche..."
chi_east_china_sea_GR.10.b: "Le Japon ne sera pas intimidé !"
chi_east_china_sea_GR.11: "Japon, rendez les îles Diaoyu !"
chi_east_china_sea_GR.11.t: "Japon, rendez les îles Diaoyu !"
chi_east_china_sea_GR.11.d: "Les Japonais ont apparemment accepté la légitimité de notre revendication et nous ont rendu les îles Diaoyu, leurs légitimes propriétaires."
chi_east_china_sea_GR.11.a: "Celui qui connaît son temps est un héros"
chi_east_china_sea_GR.12: "Le Japon nous défie !"
chi_east_china_sea_GR.12.t: "Le Japon nous défie !"
chi_east_china_sea_GR.12.d: "Les Japonais refusent de nous rendre les îles Diaoyu et sont manifestement aussi déterminés que jamais à rester nos ennemis mortels."
chi_east_china_sea_GR.12.a: "Ils le regretteront..."
#Taïwan#
chi_taiwan.1: "La Chine exige que nous cessions d'interférer à Taïwan !"
chi_taiwan.1.t: "La Chine exige que nous cessions d'interférer à Taïwan !"
chi_taiwan.1.d: "Aujourd'hui, le ministère des Affaires étrangères de la République populaire de Chine a fermement exigé que nous respections notre engagement à reconnaître une seule Chine et à ne pas nous ingérer dans les affaires de Taïwan. La Chine a affirmé qu'il s'agissait d'affaires intérieures chinoises et que notre pays ne devait pas s'ingérer. C'est évidemment un prélude à l'attaque de Taïwan par la Chine. Si nous abandonnons Taïwan, la Chine pointera sans aucun doute ses armes sur Taïwan."
chi_taiwan.1.a: "Cela ne nous regarde pas..."
chi_taiwan.1.b: "Nous devons protéger Taïwan !"
chi_taiwan.2: "Les États-Unis ont retiré leurs troupes et leur flotte de Taïwan !"
chi_taiwan.2.t: "Les États-Unis ont retiré leurs troupes et leur flotte de Taïwan !"
chi_taiwan.2.d: "La flotte américaine s'est retirée des eaux du détroit de Taïwan aujourd'hui et s'est dirigée vers la base philippine. Les États-Unis ont apparemment acquiescé aux exigences diplomatiques du gouvernement chinois."
chi_taiwan.2.a: "Celui qui connaît la situation actuelle est un héros"
chi_taiwan.2.b: "Pourquoi ?!"
chi_taiwan.3: "Les États-Unis ont augmenté leur aide militaire à Taïwan !"
chi_taiwan.3.t: "Les États-Unis ont augmenté leur aide militaire à Taïwan !"
chi_taiwan.3.d: "Un navire de transport battant pavillon américain est arrivé aujourd'hui au port de Taipei. De nombreuses photos divulguées montrent clairement que le navire est plein de fournitures militaires américaines. Les États-Unis ont manifestement augmenté leur aide militaire à Taïwan."
chi_taiwan.3.a: "L'impérialisme américain est toujours voleur !"
chi_taiwan.3.b: "Super..."
chi_taiwan.4: "La Chine envoie un ultimatum !"
chi_taiwan.4.t: "La Chine envoie un ultimatum !"
chi_taiwan.4.d: "Le gouvernement de Pékin a envoyé un télégramme tôt ce matin, nous demandant de donner une réponse dans l'heure. Taïwan doit soit accepter la juridiction du gouvernement populaire central de la République populaire de Chine, soit accepter le contrôle militaire de l'Armée populaire de libération."
chi_taiwan.4.a: "Nous cédons au pouvoir..."
chi_taiwan.4.b: "Nous ne transigerons jamais !"
chi_taiwan.5: "Les autorités taïwanaises ont annoncé qu'elles acceptaient la juridiction du gouvernement populaire central"
chi_taiwan.5.t: "Les autorités taïwanaises annoncent l'acceptation de la juridiction du gouvernement populaire central"
chi_taiwan.5.d: "Taipei appelle, le gouvernement [TAI.GetLeader] exprime sa volonté de reconnaître Taïwan comme le territoire légal de la République populaire de Chine, et Taïwan acceptera la juridiction et la gouvernance du gouvernement populaire central."
chi_taiwan.5.a: "Celui qui connaît la situation actuelle est un héros"
chi_taiwan.6: "Les autorités taïwanaises ont ignoré nos avertissements !"
chi_taiwan.6.t: "Les autorités taïwanaises ont ignoré nos avertissements !"
chi_taiwan.6.d: "[TAI.GetLeader] a prononcé un discours en direct ce matin, disant au monde que Taïwan ne craindra jamais l'\"intimidation de puissance\" et combattra les \"agresseurs\" jusqu'au dernier moment."
chi_taiwan.6.a: "La réunification de la mère patrie !"
chi_taiwan.10.t: "Les forces d'intervention étrangères rentrent chez elles"
chi_taiwan.10.d: "Comme nous avons complètement éliminé les autorités taïwanaises dans la guerre, ces forces d'intervention étrangères qui ont interféré avec notre grande cause d'unification n'ont eu d'autre choix que de signer un accord de paix avec nous et ont dû reconnaître le fait établi de l'unification."
chi_taiwan.10.a: "Au diable avec eux."
WAR_TAIWAN_JIEFANG: "Guerre de libération pour la réunification de la mère patrie"
chi_taiwan_jiefang: "La guerre de libération de la mère patrie"
chi_news.6: "La Chine reprend Taïwan"
chi_news.6.t: "La Chine reprend Taïwan"
chi_news.6.d: "Après un demi-siècle de différends et de conflits, les deux rives du détroit de Taïwan ont finalement réalisé la réunification militaire. Les autorités taïwanaises, l'ancien gouvernement de la \"République de Chine\", ont mis fin à leurs décennies de domination sur la région de Taïwan et se sont complètement effondrées après l'entrée de l'Armée populaire de libération dans le Palais présidentiel à Taipei. Cela marque l'étape la plus importante que la Chine a franchie sur la voie de la réunification nationale."
chi_news.6.a: "Personne n'ose s'en prendre à eux..."
chi_news.6.b: "Enfin ! Enfin !"
chi_news.7: "La Chine reprend Taïwan"
chi_news.7.t: "La Chine reprend Taïwan"
chi_news.7.d: "Après un demi-siècle de différends et de conflits, les deux rives du détroit de Taïwan ont finalement réalisé la réunification pacifique. Les autorités taïwanaises, l'ancien gouvernement de la \"République de Chine\", ont mis fin à l'hostilité avec la Chine continentale, ont reconnu la juridiction de la République populaire de Chine et ont rejoint la République populaire de Chine en tant que région administrative spéciale."
chi_news.7.a: "Le commerce en mer de Chine méridionale a-t-il été rétabli ?"
chi_news.7.b: "Enfin ! Enfin !"
chi_news.8: "La guerre du détroit de Taïwan éclate"
chi_news.8.t: "La guerre du détroit de Taïwan éclate"
chi_news.8.d: "Récemment, la situation dans le détroit de Taïwan est restée tendue, et le jeu entre la Chine et Taïwan a atteint le bord de la guerre. Le Conseil des affaires de l'État de la République populaire de Chine a publié une déclaration officielle lors d'une conférence de presse d'urgence : \"Le défi continu des autorités taïwanaises à la ligne rouge a gravement blessé les sentiments du peuple des deux côtés du détroit de Taïwan. En l'absence d'espoir de réunification pacifique, la Chine prendra tous les moyens, y compris la force, pour maintenir la réunification de la mère patrie. C'est intolérable et il n'est plus nécessaire d'endurer. L'Armée populaire de libération chinoise dirigée par le Parti communiste chinois lancera le coup final contre l'île de Taïwan occupée par les réactionnaires et mettra complètement fin à la guerre de libération. Les réactionnaires dirigés par [TAI.GetLeader] paieront le prix du sang pour leurs actions.\"\n\nLe ministère des Affaires étrangères de la République populaire de Chine a publié une déclaration selon laquelle toutes les tentatives d'ingérence dans le processus de réunification de la Chine seront considérées comme des actes hostiles à l'encontre de la Chine, et la Commission militaire centrale a également émis un ordre d'ouvrir le feu sur toute force d'ingérence."
chi_news.8.a: "Ce jour est enfin arrivé"
chi_news.8.b: "Vers la libération de tout le pays !"
chi_news.8.c: "À bas les bandits rouges !"
chi_news.11.t:0 "Libération de Taipei"
chi_news.11.d:0 "La nuit dernière, l'opération menée par les troupes aéroportées de l'Armée populaire de libération chinoise a été un énorme succès. Après que le commando Thor a achevé le raid aéroporté sur des installations importantes telles que l'aéroport de Songshan et le Palais présidentiel, une opération aéroportée à grande échelle a rapidement été lancée au-dessus de Taipei. Après le début de l'opération, plusieurs missiles DF17 équipés d'ogives pénétrant le sol ont détruit les postes de commandement de Hengshan et Yuanshan. Les troupes du Kuomintang gardant la ville se sont rapidement désintégrées, et l'Armée populaire de libération a achevé l'occupation de Taipei presque sans effusion de sang.\n\nIl est rapporté qu'après avoir reçu des nouvelles de l'attaque du continent, le \"Président de Taïwan\" [TAI.GetLeader] et certains hauts fonctionnaires de l'île ont tenté de s'échapper de Taipei depuis l'aéroport de Songshan dans un véhicule blindé Nuage léopard, mais ont été capturés par les commandos aéroportés qui attendaient déjà à l'aéroport. Au moment de la rédaction, la plupart des troupes du Kuomintang sur l'île de Taïwan ont cessé de résister. Selon des sources, l'opération de nettoyage de l'APL contre les derniers irréductibles va bientôt commencer."
chi_news.11.a:0 "Les dés sont jetés"
chi_news.11.b:0 "Génial"
chi_news.12.t:0 "Libération de Kaohsiung"
chi_news.12.d:0 "La nuit dernière, la bataille de débarquement à Kaohsiung menée par le Corps des Marines de l'Armée populaire de libération chinoise était pratiquement terminée, et des tirs sporadiques pouvaient encore être entendus dans les rues. Bien que les troupes nationalistes défensives aient organisé une défense tenace sur la tête de pont, elles ont rapidement perdu leur capacité d'organiser la résistance sous l'attaque saturée de missiles de la Marine de l'APL et de la Force des missiles. Le bataillon synthétique de la 3e Brigade de Marine est entré dans la zone urbaine de Kaohsiung et a achevé le contrôle des infrastructures importantes dans la zone urbaine.\n\nDes rapports non confirmés indiquent que les troupes nationalistes restantes ont vacillé et qu'il existe une forte possibilité d'un soulèvement à grande échelle sur le champ de bataille, mais la condition préalable est que le gouvernement nationaliste puisse encore organiser des positions de résistance."
chi_news.12.a:0 "Les capacités amphibies de l'APL sont étonnantes"
chi_news.12.b:0 "Génial"
chi_news.13.t:0 "Libération de Taïwan"
chi_news.13.d:0 "Avec la reddition des dernières troupes du KMT à Hualien, l'Armée populaire de libération chinoise a pratiquement éliminé la résistance sur l'île de Taïwan.\n\nLe Premier ministre du Conseil des affaires de l'État a souligné lors d'une conférence de presse que les forces réactionnaires restantes sur l'île de Taïwan ont été complètement éliminées par l'APL, et la prochaine étape consistera à liquider les criminels de guerre et à commencer la reconstruction d'après-guerre sur l'île. On dit que la République populaire de Chine organisera bientôt une grande parade militaire à Pékin pour célébrer le retour de Taïwan.\n\nIl est rapporté que certains responsables du DPP et du KMT qui ont fui Taïwan ont créé un \"gouvernement provisoire de Taïwan\" à Hawaï, mais au moment de la rédaction, le gouvernement américain n'a pas encore émis de réponse officielle sur la question du gouvernement en exil."
chi_news.13.a:0 "Les Chinois sont sortis de la cage"
chi_news.13.b:0 "Vive la République populaire de Chine ! Vive le peuple chinois !"
chi_news.13.c:0 "Il est impossible de soutenir un mur avec de la boue..."
chi_news.14.t:0 "Jugement"
chi_news.14.d:0 "Le procès des criminels de guerre est en cours, y compris les anciens \"présidents\" de Taïwan, les fonctionnaires du gouvernement et les hauts responsables du DPP qui ont prôné l'indépendance de Taïwan.\n\nS'ils sont exécutés, ce sera un grand soulagement pour le peuple, mais s'ils sont autorisés à vivre, cela stabilisera également l'opinion publique à Taïwan."
chi_news.14.a:0 "Éliminer les réactionnaires et les exécuter sur-le-champ"
chi_news.14.b:0 "Demander à la Cour populaire suprême d'ouvrir le tribunal et tout doit être fait conformément à la loi"
chi_news.15.t:0 "La chute de Tokyo"
chi_news.15.d:0 "La bataille sanglante à Tokyo a pris fin, le drapeau chinois flottant au sommet de la Tokyo Skytree alors que la dernière unité de la Force d'autodéfense s'est rendue. La Chine a ensuite annoncé qu'elle avait obtenu le contrôle complet de la capitale japonaise. On pense que l'empereur et les membres du cabinet gouvernemental avaient évacué Tokyo avant le début de l'offensive de l'APL.\nPlus tard, l'Armée populaire de libération chinoise a organisé une grande parade à Tokyo, avec une colonne apparemment interminable de soldats chinois avançant dans la ville. Les citoyens japonais qui regardaient le long des rues sont restés silencieux.\n\nBien qu'il y ait parfois des voix dans l'opinion publique chinoise appelant à la \"vengeance de Nanjing\", on peut constater que l'APL à Tokyo maintient toujours une discipline militaire stricte."
chi_news.15.a:0 "Trente ans à l'est, trente ans à l'ouest"
chi_news.15.b:0 "Grande vengeance a été prise"
chi_news.16.t:0 "Occuper Séoul"
chi_news.16.d:0 "Une force combinée de l'Armée populaire de libération chinoise et de l'Armée populaire coréenne est entrée dans Séoul. Auparavant, en raison du bombardement continu d'un grand nombre d'artillerie nord-coréenne, Séoul était déjà en flammes.\n\nLa bataille la plus longue a eu lieu près de la Maison Bleue. Des agents nord-coréens ont tenté d'infiltrer la Maison Bleue avant le début de la bataille pour capturer de hauts responsables sud-coréens, mais ont échoué. En fin de compte, un essaim de drones suicides a submergé les défenses des défenseurs, mais il est rapporté que [KOR.GetLeader] s'était retiré de Séoul plus tôt."
chi_news.16.a:0 "Choquant"
chi_news.16.b:0 "Et si on changeait le nom en Séoul ?"
chi_news.17.t:0 "Occupation de Hanoï"
chi_news.17.d:0 "Il est maintenant confirmé que la capitale vietnamienne de Hanoï a été prise par les forces chinoises. Bien qu'une grande partie de la ville ait été dévastée par les bombardements, le mausolée de Hô Chi Minh au centre de la ville est resté intact, et l'Armée populaire de libération de Chine a utilisé ce moyen pour montrer son respect au pionnier du communisme vietnamien.\n\nLe gouvernement et les troupes vietnamiennes se sont retirés dans les jungles du centre du Vietnam, jurant d'y embourber les troupes chinoises "comme les Américains"."
chi_news.17.a:0 "Frères ennemis"
chi_news.17.b:0 "On essaie ?"
chi_news.18.t:0 "Occuper Singapour"
chi_news.18.d:0 "Alors que l'opération Typhon se déroulait, des marines chinois ont débarqué à Singapour avec le soutien de navires de guerre et de violents combats de rue ont éclaté. L'armée singapourienne a utilisé un grand nombre de barricades et de chars camouflés pour causer des problèmes considérables aux troupes chinoises, mais elles étaient toujours vulnérables à la puissance de feu supérieure de l'ennemi.\n\nAvec la chute du port de Singapour, la Chine a réussi à prendre le contrôle du détroit de Malacca, la porte d'entrée de l'océan Indien."
chi_news.18.a:0 "Choqué"
chi_news.18.b:0 "Plus d'anglais à partir de maintenant"
chi_news.19.t:0 "La Chine a obtenu le contrôle total de la mer de Chine méridionale"
chi_news.19.d:0 "Plus tôt dans la journée, le Conseil des affaires de l'État de Chine a tenu une conférence de presse pour annoncer qu'il avait achevé le contrôle total de toutes les îles et récifs de la mer de Chine méridionale, et a une fois de plus averti qu'il réprimerait sévèrement toute atteinte d'un pays au territoire et aux eaux territoriales de la Chine. Le gouvernement chinois a également assuré lors de la réunion que la liberté de navigation du transport maritime et du commerce international en mer de Chine méridionale ne serait pas affectée, et la Chine accueille favorablement tout pays ami qui entretient des échanges pacifiques avec la Chine."
chi_news.19.a:0 "Choqué"
chi_news.19.b:0 "La Chine ne peut absolument pas manquer"
chi_news.20.t:0 "Occupation de New Delhi"
chi_news.20.d:0 "Aujourd'hui, la capitale indienne New Delhi a été capturée par l'armée chinoise. Bien que le gouvernement indien ait déclaré avant la guerre que New Delhi deviendrait le Stalingrad de l'Asie du Sud, la plupart des troupes avaient fui la ville avec le gouvernement indien avant le début de la bataille, ne laissant que quelques soldats qui n'avaient pas réussi à s'échapper et la police qui a été temporairement envoyée sur le front pour garder New Delhi.\n\nLes échanges de tirs violents n'ont eu lieu que dans certains bureaux gouvernementaux, mais comme l'armée et la police ont installé un grand nombre de barrages routiers le long des rues, cela a quand même causé beaucoup de problèmes à l'avance de l'APL."
chi_news.20.a:0 "Ont-ils traversé l'Himalaya ?"
chi_news.20.b:0 "Contacter rapidement les rebelles communistes en Inde"
#Thoughts#
chi_trends.1: "Retour à la normale"
chi_trends.1.t: "Retour à la normale"
chi_trends.1.d: "Rentre chez toi, pourquoi ne rentres-tu pas chez toi quand tes champs sont sur le point d'être envahis par la végétation ? Puisque tu as laissé ton esprit être asservi par ton corps, pourquoi te sens-tu triste et seul ? Je comprends que le passé ne peut être changé, mais je sais que l'avenir peut être recherché. En fait, je ne me suis pas éloigné du droit chemin, et je réalise qu'aujourd'hui est juste et qu'hier était faux. Le bateau s'éloigne légèrement, et le vent souffle mes vêtements. Je demande au voyageur le chemin à suivre, et je déteste la faible lumière du matin."
chi_trends.1.a: "Il faut que ce soit comme ça"
chi_trends.2: "Retour à la normale"
chi_trends.2.t: "Retour à la normale"
chi_trends.2.d: "Le ciel et la terre ne sont pas bienveillants, ils traitent toutes choses comme des chiens de paille ; les sages ne sont pas bienveillants, ils traitent le peuple comme des chiens de paille."
chi_trends.2.a: "Comme il se doit"
chi_trends.3: "Certaines personnes ont organisé des manifestations pour protester !"
chi_trends.3.t: "Certaines personnes ont organisé des manifestations pour protester !"
chi_trends.3.d: "Des gens partout commencent à organiser des marches coordonnées pour protester contre nos politiques actuelles.\nNous devrions décider si nous devons maintenir le statu quo, ou apporter quelques changements pour apaiser les manifestants."
chi_trends.3.a: "Médier"
chi_trends.3.b: "Frapper fort !"
#population#
chi_pop.1: "Le cinquième recensement national de la population"
chi_pop.1.t: "Le cinquième recensement national de la population"
chi_pop.1.d: "Le 1er novembre 2000, le gouvernement chinois a mené les travaux d'enregistrement du cinquième recensement national de la population. Selon les statistiques, la population totale du pays est de 1 295 330 000 habitants. Parmi eux : la population des 31 provinces, régions autonomes et municipalités relevant directement du gouvernement central du continent de la mère patrie (à l'exclusion de Kinmen, Matsu et autres îles de la province du Fujian, idem ci-dessous) et les militaires en activité ont totalisé 1 265 830 000. La population de la région administrative spéciale de Hong Kong est de 6,78 millions. La population de la région administrative spéciale de Macao est de 440 000, et la population de la province de Taiwan et de Kinmen, Matsu et autres îles de la province du Fujian est de 22,28 millions.\n\nIl y a 348,37 millions de foyers dans les 31 provinces, régions autonomes et municipalités relevant directement du gouvernement central, avec une population de 1 198,39 millions de personnes. Le nombre moyen de personnes par foyer est de 3,44, soit 0,52 de moins que les 3,96 personnes du quatrième recensement national de la population en 1990.\n\nParmi la population des 31 provinces, régions autonomes, municipalités relevant directement du gouvernement central et des militaires en activité sur le continent chinois, il y a 653,55 millions d'hommes, représentant 51,63 % de la population totale ; et 612,28 millions de femmes, représentant 48,37 % de la population totale. Le rapport de masculinité (rapport hommes/femmes, femmes = 100) est de 106,74.\n\nParmi la population des 31 provinces, régions autonomes, municipalités et des militaires en activité sur le continent chinois, la population âgée de 0 à 14 ans est de 289,79 millions, représentant 22,89 % de la population totale ; la population âgée de 15 à 64 ans est de 887,93 millions, représentant 70,15 % de la population totale ; la population âgée de 65 ans et plus est de 88,11 millions, représentant 6,96 % de la population totale. Comparé au quatrième recensement national en 1990, la population âgée de 0 à 14 ans est de 289,79 millions, représentant 22,89 % de la population totale ; la population âgée de 15 à 64 ans est de 887,93 millions, représentant 70,15 % de la population totale ; la population âgée de 65 ans et plus est de 88,11 millions, représentant 6,96 % de la population totale. La proportion de la population âgée de 65 ans et plus a diminué de 4,80 points de pourcentage, et la proportion de la population âgée de 65 ans et plus a augmenté de 1,39 point de pourcentage.\n\nParmi la population des 31 provinces, régions autonomes, municipalités relevant directement du gouvernement central et des militaires en activité sur le continent chinois, 45,71 millions de personnes ont reçu une éducation universitaire (se référant au collège et au-dessus) ; 141,09 millions de personnes ont reçu une éducation secondaire (y compris l'éducation technique secondaire) ; 429,89 millions de personnes ont reçu une éducation secondaire inférieure ; 451,91 millions de personnes ont reçu une éducation primaire (les personnes ci-dessus ayant divers niveaux d'éducation comprennent les diplômés, les décrocheurs et les étudiants en cours dans diverses écoles)"
chi_pop.1.a: "Né dans une ère prospère"
chi_pop.2: "Le sixième recensement national de la population"
chi_pop.2.t: "Le sixième recensement national de la population"
chi_pop.2.d: "Le 28 avril 2011, Ma Jiantang, directeur du Bureau national des statistiques, a annoncé que la population totale du pays enregistrée (recensée) lors du sixième recensement national en 2010 était de 1 339 724 852 (à l'exclusion de Hong Kong, Macao et Taiwan). Selon le bulletin du recensement, la population totale du pays en novembre 2010 était de 1 370 536 875 (y compris Hong Kong, Macao et Taiwan).\n\nLa population des 31 provinces, régions autonomes, municipalités relevant directement du gouvernement central et des militaires en activité sur le continent a augmenté de 73 899 804 personnes au cours des dix dernières années, soit une augmentation de 5,84 %, et un taux de croissance annuel moyen de 0,57 % par rapport à 1 265 825 048 personnes à 0h00 le 1er novembre 2000 lors du cinquième recensement national.\n\nLa population des 31 provinces, régions autonomes, municipalités relevant directement du gouvernement central et des militaires en activité sur le continent a augmenté de 73 899 804 personnes au cours des dix dernières années, soit une augmentation de 5,84 %, et un taux de croissance annuel moyen de 0,57 %.\n\nIl y a 401 517 330 ménages dans les provinces, régions autonomes et municipalités, avec une population de 1 244 608 395 personnes, avec une moyenne de 3,10 personnes par ménage, 0,34 de moins que les 3,44 personnes du cinquième recensement national en 2000.\n\nParmi la population des 31 provinces, régions autonomes, municipalités et des militaires en activité sur le continent, il y a 686 852 572 hommes, représentant 51,27 % ; il y a 652 872 280 femmes, représentant 48,73 %. Le rapport de masculinité de la population totale (rapport hommes/femmes, femmes = 100) est passé de 106,74 lors du cinquième recensement national en 2000 à 105,20.\n\nParmi la population des 31 provinces, régions autonomes, municipalités et des militaires en activité sur le continent, la population âgée de 0 à 14 ans était de 222 459 737, représentant 16,60 % ; la population âgée de 15 à 59 ans était de 939 616 410, représentant 70,14 % ; la population âgée de 60 ans et plus était de 177 648 705, représentant 13,26 %, dont la population âgée de 65 ans et plus était de 118 831 709, représentant 8,87 %. Comparé au cinquième recensement national de la population en 2000, la proportion de la population âgée de 0 à 14 ans a diminué de 6,29 points de pourcentage, la proportion de la population âgée de 15 à 59 ans a augmenté de 3,36 points de pourcentage, la proportion de la population âgée de 60 ans et plus a augmenté de 2,93 points de pourcentage, et la proportion de la population âgée de 65 ans et plus a augmenté de 1,3 point de pourcentage. La proportion de la population a augmenté de 1,91 point de pourcentage.\n\nComparé au cinquième recensement national de la population en 2000, le nombre de personnes titulaires d'un diplôme universitaire pour 100 000 personnes est passé de 3 611 à 8 930.\n\nParmi la population des 31 provinces, régions autonomes, municipalités relevant directement du gouvernement central et des militaires en activité sur le continent, la population vivant dans les villes et villages [9] était de 665 575 306, représentant 49,68 % ; la population vivant dans les zones rurales était de 674 149 546, représentant 50,32 %. Comparé au cinquième recensement national de la population en 2000, la population urbaine a augmenté de 207 137 093, la population rurale a diminué de 133 237 289, et la proportion de la population urbaine a augmenté de 13,46 points de pourcentage. Avec le développement en profondeur de la nouvelle industrialisation, de l'informatisation et de la modernisation agricole de mon pays et la mise en œuvre de la politique d'urbanisation de la population migrante agricole, le processus de nouvelle urbanisation de mon pays a été régulièrement promu au cours des 10 dernières années, et la construction de l'urbanisation a réalisé des réalisations historiques.\n\nLa structure démographique de la Chine a subi un changement fondamental, avec des opportunités et des crises coexistantes."
chi_pop.2.a: "Né dans une ère prospère"
chi_pop.3: "Le septième recensement national de la population"
chi_pop.3.t: "Le septième recensement national de la population"
chi_pop.3.d: "Le gouvernement chinois a mené l'enregistrement du septième recensement national le 1er novembre 2020. La population nationale a totalisé 1 411,78 millions, soit une augmentation de 72,06 millions de personnes, ou 5,38 %, par rapport aux 1 339,72 millions en 2010 ; le taux de croissance annuel moyen était de 0,53 %, 0,04 point de pourcentage de moins que le taux de croissance annuel moyen de 0,57 % de 2000 à 2010. Les données montrent que la population de mon pays a continué de croître à un rythme faible au cours des 10 dernières années.\n\nIl y a 494,16 millions de ménages dans le pays, avec une population de 1 292,81 millions ; il y a 28,53 millions de ménages collectifs, avec une population de 118,97 millions. La population moyenne par ménage est de 2,62, soit 0,48 de moins que les 3,10 en 2010. Les règles des ménages L'ampleur de la population continue de diminuer, principalement en raison de la mobilité croissante de la population dans mon pays et de l'amélioration des conditions de logement, les jeunes vivant de manière indépendante après le mariage.\n\nLa population âgée de 0 à 14 ans est de 253,38 millions, représentant 17,95 % ; la population âgée de 15 à 59 ans est de 894,38 millions, représentant 63,35 % ; la population âgée de 60 ans et plus est de 264,02 millions, représentant 18,70 % (dont la population âgée de 65 ans et plus est de 190,64 millions, représentant 13,50 %). Comparé à 2010, la proportion de la population âgée de 0 à 14 ans, 15 à 59 ans et 60 ans et plus a augmenté de 1,35 point de pourcentage, diminué de 6,79 points de pourcentage et augmenté de 5,44 points de pourcentage respectivement. La proportion d'enfants dans mon pays a rebondi, et l'ajustement de la politique de fécondité a donné des résultats positifs. Dans le même temps, le degré de vieillissement de la population a encore augmenté. La pression du développement démographique équilibré à long terme continuera de s'accentuer à l'avenir.\n\nLa population masculine est de 723,34 millions, représentant 51,24 % ; la population féminine est de 688,44 millions, représentant 48,76 %. Le rapport de masculinité de la population totale (rapport hommes/femmes, femmes = 100) est de 105,07, ce qui est pratiquement le même qu'en 2010 et légèrement inférieur. Le rapport de masculinité de la population des nouveau-nés est de 111,3, soit 6,8 de moins qu'en 2010. La structure par sexe de la population de mon pays continue de s'améliorer.\n\nLa population titulaire d'un diplôme universitaire est de 218,36 millions. Comparé à 2010, le nombre de personnes titulaires d'un diplôme universitaire pour 100 000 personnes est passé de 8 930 à 15 467, et les années d'éducation moyennes pour les personnes âgées de 15 ans et plus ont augmenté de 9,08 ans à 9,91 ans. Le taux d'analphabétisme a diminué de 4,08 % à 2,67 %. L'amélioration continue de la situation de l'éducation reflète que les efforts de mon pays pour développer vigoureusement l'enseignement supérieur et éliminer l'analphabétisme chez les jeunes et les personnes d'âge moyen au cours des 10 dernières années ont donné des résultats positifs, et la qualité de la population a continué de s'améliorer.\n\nLa population vivant dans les villes et villages est de 901,99 millions, représentant 63,89 % ; la population vivant dans les zones rurales est de 509,79 millions, représentant 36,11 %. Comparé à 2010, la population urbaine a augmenté de 236,42 millions, la population rurale a diminué de 164,36 millions, et la proportion de population urbaine a augmenté de 14,21 points de pourcentage. Avec le développement en profondeur de la nouvelle industrialisation, de l'informatisation et de la modernisation agricole de mon pays et la mise en œuvre de la politique d'urbanisation de la population migrante agricole, le processus de nouvelle urbanisation de mon pays a été régulièrement promu au cours des 10 dernières années, et la construction de l'urbanisation a réalisé des réalisations historiques.\n\nLa structure démographique de la Chine a subi un changement fondamental, avec des opportunités et des crises coexistantes."
chi_pop.3.a: "Allons-nous aussi vieillir ?"

chi_pop.4: "Urbanisation"
chi_pop.4.t: "Urbanisation"
chi_pop.4.d: "Selon les données préliminaires et les enregistrements, mon pays a continué à maintenir la tendance à l'accélération de l'urbanisation depuis la réforme et l'ouverture l'année dernière, avec de plus en plus de ruraux s'installant dans les villes.\n\nL'urbanisation à grande vitesse aura de nombreux impacts sur la société chinoise. L'impact le plus important est que le transfert de main-d'œuvre rurale apportera un grand dividende de main-d'œuvre bon marché, ce qui est favorable à la croissance économique rapide de mon pays, mais augmentera également la pression sur les dépenses médicales et sociales. Dans le même temps, une autre caractéristique importante de l'urbanisation est la réduction du taux de natalité, ce qui est favorable à la mise en œuvre de la politique de planification familiale de mon pays et à l'amélioration de la qualité globale de la population."
chi_pop.4.a: "Continuez comme ça"

#AIIB#
#china.20.t: "La Chine crée la Banque asiatique d'investissement dans les infrastructures"
#china.20.d: "Le gouvernement chinois a annoncé aujourd'hui son intention d'investir dans plusieurs projets d'infrastructures dans le monde entier par l'intermédiaire de la Banque asiatique d'investissement dans les infrastructures dans le cadre de son Initiative la Ceinture et la Route. Bien que de nombreux pays en développement aient accueilli favorablement l'annonce, car ils s'attendent à ce que la Chine fasse des investissements indispensables dans leurs économies, ce qui contribuera à accélérer la construction d'infrastructures et l'interconnexion en Asie, à faire face conjointement à la crise financière internationale, à la transformation et à la modernisation économiques, et à la croissance économique stable, et à accélérer le processus d'intégration économique en Asie, le Japon, l'Inde, les États-Unis et l'Australie ont exprimé des réserves quant à l'initiative, estimant qu'il s'agissait d'une tentative déguisée de la Chine d'étendre son influence à l'étranger, tout comme l'Initiative la Ceinture et la Route."
chi_aiib.2: "Le gouvernement de [FROM.GetName] a présenté une demande d'adhésion à la Banque asiatique d'investissement dans les infrastructures"
chi_aiib.2.t: "Le gouvernement de [FROM.GetName] a présenté une demande d'adhésion à la Banque asiatique d'investissement dans les infrastructures"
chi_aiib.2.d: "Un nouveau pays souhaite devenir membre à part entière de la Banque !"
chi_aiib.2.a: "Bienvenue, bienvenue"
chi_aiib.2.b: "Le moment n'est pas encore venu"
chi_aiib.6: "La Banque asiatique d'investissement dans les infrastructures nous fournit une aide au développement"
chi_aiib.6.t: "La Banque asiatique d'investissement dans les infrastructures nous fournit une aide au développement"
chi_aiib.6.d: "Pékin a appelé et nous a informés que la Banque asiatique d'investissement dans les infrastructures nous fournira une série d'aides au développement gratuites !"
chi_aiib.6.a: "Génial !"
chi_aiib.7: "La Banque asiatique d'investissement dans les infrastructures nous accorde des prêts à faible intérêt"
chi_aiib.7.t: "La Banque asiatique d'investissement dans les infrastructures nous accorde des prêts à faible intérêt"
chi_aiib.7.d: "Pékin a appelé et nous a dit que la Banque asiatique d'investissement dans les infrastructures nous accordera un prêt gratuit à faible intérêt !"
chi_aiib.7.a: "Génial !"
chi_aiib.8: "La Chine nous invite à rejoindre la Banque asiatique d'investissement dans les infrastructures"
chi_aiib.8.t: "La Chine nous invite à rejoindre la Banque asiatique d'investissement dans les infrastructures"
chi_aiib.8.d: "Un appel est venu de Pékin. [CHI.GetLeader] nous a invités à rejoindre la Banque asiatique d'investissement dans les infrastructures. [CHI.GetLeader] a proposé que la Chine assume la responsabilité d'un grand pays et fournisse une grande quantité de ressources de construction aux pays membres de la Banque asiatique d'investissement dans les infrastructures."
chi_aiib.8.a: "Bien sûr que nous aimerions"
chi_aiib.8.b: "Nous ne sommes pas intéressés"
#EconomicCrisis
chi_crisis.1: "Crise économique de 2008"
chi_crisis.1.t: "Le tsunami financier se propage en Chine"
chi_crisis.1.d: "Au second semestre 2008, touchée par la crise financière mondiale causée par les États-Unis, la chaîne mondiale du capital s'est rapidement resserrée, les coûts de financement ont fortement augmenté, la production des entreprises a fortement ralenti et l'économie réelle mondiale a subi un impact grave. Les exportations manufacturières de la Chine ont fortement chuté, passant d'une croissance à deux chiffres au début de l'année à une croissance négative. Au premier trimestre 2009, les exportations ont continué de chuter pour atteindre une croissance négative à deux chiffres, la production industrielle a fortement chuté, la production d'électricité a stagné, un grand nombre de petites et moyennes entreprises exportatrices ont fermé et fait faillite, et une vaste zone de chômage est apparue dans les zones côtières.\n\nLe Sommet des dirigeants du G20 sur les marchés financiers et l'économie mondiale, d'une journée, s'est tenu à Washington, la capitale des États-Unis, le 15 novembre 2008. Le président chinois Hu Jintao y a prononcé un discours important intitulé "Travailler ensemble pour surmonter les difficultés". Le président a souligné que pour répondre efficacement à cette crise financière, les pays du monde entier devaient renforcer la confiance, renforcer la coordination et travailler en étroite collaboration."
chi_crisis.1.a: "Le dragon lutte"
chi_crisis.1.b: "Le monde entier devrait-il supporter les conséquences des actions de l'Amérique ?"
chi_crisis.2: "Fermeture d'usine"
chi_crisis.2.t: "L'impact de la crise économique"
chi_crisis.2.d: "En raison de l'impact de la crise économique actuelle, de nombreuses usines ont fermé et les actifs des sociétés de valeurs mobilières et des entreprises se sont évaporés en un instant. Nous ne savons pas combien de temps cette situation va durer..."
chi_crisis.2.a: "Oh mon dieu..."
chi_crisis.3: "Fermeture d'usine"
chi_crisis.3.t: "Fermeture d'usine"
chi_crisis.3.d: "En raison de l'impact de la crise économique, un grand nombre d'usines de commerce extérieur dans les zones côtières ont fermé."
chi_crisis.3.a: "Oh mon dieu..."
chi_crisis.4: "Fermeture d'usine"
chi_crisis.4.t: "Fermeture d'usine"
chi_crisis.4.d: "En raison de l'impact de la crise économique, un grand nombre d'usines de commerce extérieur dans les zones côtières ont fermé."
chi_crisis.4.a: "Oh mon dieu..."
chi_crisis.5: "Fermeture d'usine"
chi_crisis.5.t: "Fermeture d'usine"
chi_crisis.5.d: "En raison de l'impact de la crise économique, un grand nombre d'usines de commerce extérieur dans les zones côtières ont fermé."
chi_crisis.5.a: "Oh mon dieu..."
chi_crisis.6: "Faillite d'entreprise"
chi_crisis.6.t: "Faillite d'entreprise"
chi_crisis.6.d: "En raison de l'impact de la crise économique, le marché boursier chinois a chuté et les actifs d'un grand nombre de sociétés de valeurs mobilières et d'entreprises se sont évaporés du jour au lendemain."
chi_crisis.6.a: "Oh mon dieu..."
chi_crisis.7: "Notre pays est entré en état de guerre"
chi_crisis.7.t: "Notre pays est entré en état de guerre"
chi_crisis.7.d: "Alors que notre pays entre en état de guerre avec les États-Unis, nous n'avons plus à nous retenir avec des slogans de paix. Nous devons gagner cette guerre !"
chi_crisis.7.a: "La Chine vaincra !"
chinawar.1: "Les États-Unis ont lancé une guerre d'agression contre notre pays"
chinawar.1.t: "Les États-Unis ont lancé une guerre d'agression contre notre pays"
chinawar.1.d: "Après que les États-Unis ont perdu leur hégémonie absolue, le président humilié [USA.GetLeader] a contourné le Congrès et a lancé de force une guerre d'agression contre notre pays. Il a également établi une "Armée des Nations Unies" avec ses soi-disant alliés de l'OTAN pour marcher vers notre pays. Le Parti et le pays ont atteint le moment le plus critique. Nous devons gagner cette guerre de défense nationale !"
chinawar.1.a: "La première bataille est la bataille décisive, et l'issue sera décidée en une seule bataille !"
chi_crisis.100.t: "Les pays du monde entier sont touchés par le tsunami financier"
chi_crisis.100.d: "Touchée par la crise financière mondiale causée par les États-Unis, la chaîne mondiale du capital s'est rapidement resserrée, les coûts de financement ont fortement augmenté, la production des entreprises a considérablement ralenti et l'économie réelle mondiale a subi un impact grave. Les marchés boursiers des pays développés représentés par le Japon, le Royaume-Uni et la France ont tous fortement chuté, et le nombre d'actions qui ont chuté de la limite en trois jours a dépassé 70 %. Les pays en développement dont le principal contenu du commerce extérieur est l'exportation de biens de consommation ou de ressources ont également été impliqués. L'Inde, la Russie et d'autres pays ont annoncé des politiques de réduction des tarifs d'exportation, mais l'effet est faible."
chi_crisis.100.a: "L'économie mondiale est-elle finie ?"
#event
chi.1: "Le 16e Congrès national du Parti communiste chinois se tient"
chi.1.t: "Le 16e Congrès national du Parti communiste chinois s'est tenu"
chi.1.d: "Le 16e Congrès national du Parti communiste chinois s'est tenu à Pékin du 8 au 14 novembre 2002. Il y avait 2 114 délégués officiels et 40 délégués spécialement invités, représentant plus de 66 millions de membres du Parti.\n\nConformément aux règlements du Comité central, les délégations assistant au 16e Congrès national du Parti communiste chinois ont ajouté la délégation du système d'entreprise centrale et la délégation du système financier central. C'était la première fois que le système d'entreprise centrale et le système financier central formaient une délégation distincte pour assister au Congrès national du Parti. Comparé aux 36 délégations du 15e Congrès national, le nombre de délégations du 16e Congrès national est passé à 38.\n\nEn outre, les membres, membres suppléants et membres du 15e Comité central du Parti communiste chinois qui n'étaient pas délégués au 16e Congrès national ; les membres de l'ancien Comité consultatif central qui n'étaient pas délégués au 16e Congrès national et les délégués spécialement invités ; et les représentants du 16e Congrès national et les délégués spécialement invités. Certains anciens camarades du parti et autres camarades concernés, un total de 284 personnes ont assisté à la conférence. La conférence a également invité des non-membres du parti qui ont occupé les postes de vice-présidents du Comité permanent de l'Assemblée populaire nationale et de vice-présidents du Comité national de la Conférence consultative politique du peuple chinois, des non-membres du parti qui ont occupé les postes de vice-présidents de l'État, de vice-présidents du Comité permanent de l'Assemblée populaire nationale et de vice-présidents du Comité national de la Conférence consultative politique du peuple chinois, les dirigeants des comités centraux de divers partis démocratiques, de la Fédération chinoise de l'industrie et du commerce, et des non-membres du parti, ainsi que des non-membres du parti à Pékin parmi les membres du Comité permanent de l'Assemblée populaire nationale et du Comité national de la Conférence consultative politique du peuple chinois, et certaines minorités ethniques et milieux religieux, un total de 152 personnes ont assisté aux cérémonies d'ouverture et de clôture de la conférence en tant qu'invités.\n\nLe thème de cette conférence est : porter haut la grande bannière de la théorie de Deng Xiaoping, mettre pleinement en œuvre la pensée importante des "Trois Représentations", faire avancer le passé, rester en phase avec le temps, construire globalement une société modérément prospère, accélérer la promotion de la modernisation socialiste et s'efforcer de créer une nouvelle situation dans la cause du socialisme à caractéristiques chinoises."
chi.1.a: "Applaudissements"
chi.2: "Le Congrès a élu les membres du 16e Comité central"
chi.2.t: "Le Congrès a élu les membres du 16e Comité central"
chi.2.d: "Le 16e Congrès national du Parti communiste chinois a élu le Comité central et la Commission centrale de contrôle de la discipline. Un groupe de dirigeants jeunes et capables, dotés à la fois d'intégrité morale et de capacité, sont entrés dans le nouveau Comité central, ce qui reflète pleinement que notre parti est prospère et a des successeurs. Afin de promouvoir la transition de l'ancienne et de la nouvelle direction du parti, et d'assurer la stabilité et la vitalité à long terme du parti et du pays, un groupe de camarades qui ont occupé des postes de direction centraux et ont apporté des contributions majeures à la cause du parti se sont retirés du Comité central, montrant leur noble caractère et leur prévoyance et leur clairvoyance dans leur loyauté envers la cause du parti.\n\nAprès l'élection de la session plénière du Comité central, le camarade Hu Jintao, membre du Comité permanent du Bureau politique du Comité central, a été élu secrétaire général du Comité central du Parti communiste chinois. Le poste de secrétaire général du Comité central du Parti communiste chinois a été transféré du camarade Jiang Zemin au camarade Hu Jintao, et l'Assemblée populaire nationale pour décider de sa nomination en tant que président aura lieu dans quelques mois."
chi.2.a: "Se serrer étroitement autour du Comité central du Parti avec le camarade Hu Jintao comme secrétaire général !"
chi_sapce.1.t: "Vaisseau spatial habité Shenzhou V"
chi_sapce.1.d: "À 9h00 le 15 octobre 2003, le vaisseau spatial habité Shenzhou V développé indépendamment par mon pays a été lancé depuis le centre de lancement de satellites de Jiuquan en Chine. À 9h09m50s, le Shenzhou V est entré précisément dans l'orbite prédéterminée. C'était le premier vol spatial habité de la Chine. L'astronaute qui a effectué la mission à bord du vaisseau spatial habité Shenzhou V était Yang Liwei, âgé de 38 ans. Il est la première génération d'astronautes formés par mon pays. Après avoir fait 14 fois le tour de la Terre dans l'espace, après un vol en toute sécurité de 21 heures et 23 minutes et de 600 000 kilomètres, il a atterri et est revenu avec succès sur le site d'atterrissage principal en Mongolie intérieure à 6h23 le 16."
chi_sapce.1.o1: ""Je me sens bien.""
chi_millennium.2: "Discours du président Jiang aux Nations Unies"
chi_millennium.2.t: "Discours du président Jiang aux Nations Unies"
chi_millennium.2.d: "Monsieur le Président :\n\nAu tournant du siècle et du millénaire, les dirigeants du monde entier se rassemblent au bâtiment des Nations Unies pour discuter des questions majeures liées à l'avenir du développement humain et pour promouvoir la noble cause de la paix et du développement dans le monde. En ce moment, tous les peuples qui aiment la paix et aspirent au bonheur regardent ici avec préoccupation.\nAu cours du millénaire et du XXe siècle derniers, l'humanité a connu des désastres et des calamités tragiques, et a également mené de grandes luttes et créations, et a finalement remporté des réalisations brillantes en matière de civilisation matérielle et spirituelle.\nAu XXIe siècle et au nouveau millénaire, l'humanité rencontrera inévitablement des défis et des épreuves imprévisibles, et réalisera inévitablement de nouveaux changements et bonds historiques. La perspective de paix durable et de prospérité commune sera brillante.\nLa guerre froide qui a duré près d'un demi-siècle est terminée. La situation internationale s'est généralement apaisée. La tendance à la multipolarisation mondiale et à la mondialisation économique se développe rapidement. La science et la technologie modernes, dont la technologie de l'information et les sciences de la vie constituent le noyau, progressent à pas de géant. L'humanité est confrontée à une rare opportunité de développement. La recherche de la paix et du développement est l'aspiration commune des peuples de tous les pays du monde et le thème de notre époque. Cependant, l'ordre politique et économique international ancien, injuste et déraisonnable, n'a pas été fondamentalement modifié. Il reste encore un long chemin à parcourir pour résoudre les deux questions stratégiques de la paix et du développement et établir un nouvel ordre politique et économique international juste et raisonnable.\nÀ l'heure actuelle, les populations de nombreux pays souffrent encore de la guerre et des troubles. L'hégémonisme et la politique de puissance existent toujours. Les conflits locaux causés par l'ethnicité, la religion, le territoire, les ressources et d'autres facteurs continuent de se produire. Diverses forces séparatistes, forces terroristes et forces extrémistes continuent de nuire à la communauté internationale. Les problèmes mondiaux tels que l'environnement, la drogue et les réfugiés deviennent de plus en plus importants. Notre planète est encore très instable et paisible.\n\nTous les États membres des Nations Unies et les hommes politiques de divers pays portent conjointement l'importante mission historique confiée par l'époque, qui est de parvenir à une paix mondiale durable et de promouvoir le développement commun et la prospérité universelle entre les pays.\nLes peuples de tous les pays sont sages. Aujourd'hui, l'humanité a progressé jusqu'à l'univers à 18 milliards d'années-lumière dans l'aspect macroscopique de la science, et a initialement révélé le fondamental Le secret de la cause. Bien qu'il y ait encore de nombreux endroits insatisfaisants dans le monde, les peuples de tous les pays seront sûrement capables d'enrichir continuellement leurs connaissances, de résumer constamment leur expérience pratique et de devenir de plus en plus rationnels dans le traitement des relations entre l'homme et la nature, l'homme et la société, la nation et la nation, et le pays et le pays. Sur la base de cette compréhension, je suis plein d'optimisme quant aux perspectives de développement mondial dans le nouveau siècle et le nouveau millénaire. Je crois fermement que l'évolution de la situation mondiale et le développement de la société humaine, peu importe le nombre de difficultés et de rebondissements qu'ils connaîtront, finiront par évoluer vers une civilisation supérieure et des progrès plus complets.\n\nJ'appelle : les pays et les peuples qui aiment la paix et aspirent au progrès partout dans le monde à se donner la main et à pousser ensemble la roue de l'histoire vers un objectif lumineux !\n\nMerci à tous."
chi_millennium.2.a: "Gracieux et éloquent !"
chi_sars.1: "Virus inconnu apparaît dans le Guangdong"
chi_sars.1.t: "Virus inconnu apparaît dans le Guangdong"
chi_sars.1.d: "Le 16 novembre, Pang Zuoyao du Guangdong a développé de la fièvre, des maux de tête, une toux sèche, de la fatigue et d'autres symptômes. Il a été transporté d'urgence à l'hôpital Shiwan de Foshan. Neuf jours plus tard, il a été transféré au service des maladies infectieuses de l'hôpital populaire numéro un de Foshan. Les 5 et 6 décembre, Huang Xingchu de Heyuan, qui travaillait à Shenzhen, s'est senti mal, comme un rhume, alors il est allé dans une clinique voisine pour se faire soigner. Le médecin a dit que ce n'était pas un gros problème. Le 8, il a estimé que le traitement en clinique n'était pas efficace, alors il est allé à l'hôpital pour des injections. Le 13, il ne se sentait toujours pas bien, alors il est retourné dans la ville de Heyuan et a reçu un traitement pendant quelques jours. Ses symptômes étaient plus graves qu'à Shenzhen. Il a été envoyé à l'hôpital populaire de Heyuan vers 22 heures le 16. Le lendemain, son état s'est aggravé et il a eu des difficultés respiratoires. Il a été envoyé à l'hôpital général de la région militaire de Guangzhou."
chi_sars.1.a: "Envoyez immédiatement une équipe spéciale pour enquêter !"
chi_sars.2: "Le nombre de personnes infectées par le virus du SRAS a cessé de croître"
chi_sars.2.t: "Le nombre de personnes infectées par le virus du SRAS a cessé de croître"
chi_sars.2.d: "Le 13 juillet 2003, le nombre de patients atteints du SRAS et de cas suspects dans le monde a cessé d'augmenter, et le processus du SRAS était pratiquement terminé.\n\nSous la direction éclairée du Parti et du pays, nous avons réussi à vaincre cette épidémie !"
chi_sars.2.a: "Je ne pense pas qu'il y en aura plus à l'avenir."
chi_sars.6: "Résultats de l'enquête"
chi_sars.6.t: "Résultats de l'enquête"
chi_sars.6.d: "Au 9 février 2003, Guangzhou comptait plus de 100 cas connexes, dont de nombreux membres du personnel médical. Il y a eu 2 décès parmi les cas découverts à Guangzhou. Nous avons envoyé un groupe d'experts dirigé par le vice-ministre Ma Xiaowei à Guangzhou dans l'après-midi du 9 février pour aider à trouver la cause de la maladie et orienter la prévention et le traitement. Après son arrivée, Ma Xiaowei a constaté qu'il y avait des rumeurs selon lesquelles la fumigation au vinaigre blanc et la consommation de racine d'isatis pouvaient prévenir les maladies étranges. Le 10, la ruée vers l'achat a atteint son apogée. Un grand sac de racine d'isatis, qui coûte généralement moins de 10 yuans, a soudainement grimpé à 30 ou 40 yuans, et le prix du vinaigre blanc a également augmenté régulièrement, passant de 10 yuans à 80 yuans et 100 yuans.\n\nDans la matinée du 11 février, le gouvernement municipal de Guangzhou a tenu une conférence de presse pour annoncer la situation de la pneumonie atypique à Guangzhou, déclarant que l'état de tous les patients avait été Le gouvernement municipal de Guangzhou a souligné que pour une population de 10 millions d'habitants à Guangzhou, plus de 300 personnes infectées représentent une proportion très faible, la pneumonie atypique n'est qu'une occurrence locale, et aucun nouveau cas n'a été signalé à Heyuan, Zhongshan et dans d'autres villes. Il a également expliqué la raison pour laquelle la situation n'a pas été annoncée avant février : la plupart des patients à Heyuan, Zhongshan et dans d'autres endroits se sont rétablis ou ont amélioré leur état après traitement et n'ont pas rechuté. La pneumonie atypique n'est pas une maladie infectieuse à déclaration obligatoire légale, et le nombre de 305 cas n'est pas élevé. La personne responsable a souligné que l'annonce de l'épidémie sera faite conformément à la loi sur les maladies infectieuses."
chi_sars.6.a: "Il semble qu'il ne devrait y avoir aucun problème. Il suffit de bloquer les nouvelles."
chi_sars.6.b: "N'importe quoi, c'est clairement un virus grippal hautement contagieux ! Publiez immédiatement les nouvelles et enquêtez sur ceux qui ont dissimulé les faits !"
chi_sars.101.t: "Base biologique de Fort Detrick fermée"
chi_sars.101.d: "La base biologique de Fort Detrick, le plus grand centre de recherche et développement d'armes biologiques et chimiques de l'armée américaine, a récemment fait l'objet d'une enquête et a été fermée par les Centers for Disease Control and Prevention des États-Unis.\n\nPeu de temps après la fermeture de la base de Fort Detrick, une mystérieuse "maladie de la cigarette électronique" a éclaté dans la région voisine, et la saison grippale qui a suivi a infecté au moins 32 millions de personnes aux États-Unis."
chi_sars.101.a: "Que Dieu nous garde"
chi_sars.101.b: "Qu'est-ce que cela signifie ?"
chi_sars.110.t: "Nouvelle infection virale découverte à Wuhan"
chi_sars.110.d: "Certains établissements médicaux de Wuhan ont successivement vu des patients atteints de pneumonie de cause inconnue. Les manifestations cliniques de leurs cas sont principalement de la fièvre, et quelques patients ont des difficultés respiratoires. Les radiographies pulmonaires montrent des lésions infiltratives dans les deux poumons.\n\nLa ville de Wuhan continue de mener une surveillance de la grippe et des maladies connexes, et a découvert 27 cas de pneumonie virale, tous diagnostiqués comme pneumonie virale/infection pulmonaire."
chi_sars.110.a: "Enquêter sur les nouvelles maladies !"
chi_sars.110.c: "La situation est plus grave que nous le pensions"
chi_sars_110_c_tt: "§RL'aggravation du nouveau coronavirus a augmenté de manière significative§!"
chi_sars.110.b: "Virus ? Où est le virus ?"
chi_sars_110_b_tt: "§YCeci créera un monde où le nouveau coronavirus n'existe pas§!"
chi_sars.111.t: "$STATE_772$ a découvert une nouvelle infection virale"
chi_sars.111.d: "Les autorités sanitaires de $STATE_772$ ont constaté que la précédente infection virale par "cigarette électronique" était très probablement une nouvelle infection par coronavirus, ce qui signifie que le nouveau coronavirus a déjà commencé à se propager dans notre pays."
chi_sars.111.a: "C'est malheureux..."
chi_sars.115.t: "Nouvelle infection virale"
chi_sars.115.d: "Les autorités sanitaires de $STATE_772$ ont constaté que la précédente infection virale par "cigarette électronique" était très probablement une nouvelle infection par coronavirus, ce qui signifie que le nouveau coronavirus a déjà commencé à se propager dans notre pays."
chi_sars.115.a: "C'est malheureux..."
chi_sars.120.t: "Une nouvelle infection par coronavirus a été détectée dans le pays !"
chi_sars.120.d: "Les établissements de santé de [SARS_COV_2019_transmit_coefficient_target.GetName] ont récemment découvert des patients locaux infectés par le nouveau coronavirus.\n\nCela pourrait signifier que le nouveau coronavirus va devenir populaire dans notre pays."
chi_sars.120.a: "Surveiller attentivement la situation"
chi_sars.200.t: "Le nouveau coronavirus a muté"
chi_sars.200.d: "En raison de l'économie locale sous-développée à [root.GetName], le nouveau coronavirus a muté à [root.GetName], et la nouvelle souche mutante s'est avérée se propager largement."
chi_sars.200.a: "C'est un problème..."
chi_sars.210.t: "Les gens soutiennent $SARS_COV_2019_category_lockdown$"
chi_sars.210.d: "La récente politique de $SARS_COV_2019_category_lockdown$ a été bien accueillie, et de nombreuses personnes ont pris l'initiative de se protéger et de maintenir une distance sociale. Nous espérons que ce changement rendra la propagation du nouveau coronavirus plus difficile."
chi_sars.210.a: "Très bien !"
chi_sars.211.t: "Les gens s'opposent à $SARS_COV_2019_category_lockdown$"
chi_sars.211.d: "La récente politique de $SARS_COV_2019_category_lockdown$ a été critiquée et combattue par de nombreuses personnes. Les opposants disent que cela les prive de leur droit de survie. "Nous ne mourrons pas immédiatement si nous sommes infectés par le virus, mais nous mourrons immédiatement de faim si nous ne pouvons pas travailler." Le manque de coopération du public réduira considérablement l'efficacité de notre politique de $SARS_COV_2019_category_lockdown$. Nous nous attendons à ce que ce changement facilite la propagation du nouveau coronavirus."
chi_sars.211.a: "C'est un problème..."
chi_sars.401.t: "L'OMS annonce la fin de l'ère COVID-19"
chi_sars.350.t: "L'économie mondiale est touchée par l'épidémie"
chi_sars.350.d: "Alors que l'épidémie de COVID-19 s'aggrave, la production et le commerce dans divers endroits ont en fait été considérablement affectés, et l'économie mondiale est inévitablement touchée."
chi_sars.350.a: "J'espère que l'épidémie de COVID-19 prendra fin bientôt."
chi_sars.401.d: "Le Comité d'urgence du Règlement sanitaire international de l'Organisation mondiale de la santé a tenu sa 15e réunion sur l'épidémie de COVID-19 à [?global.date.GetDateString] heure de Genève. Les membres du groupe d'experts ont recommandé au Directeur général de déclarer l'épidémie de COVID-19 comme une "urgence de santé publique de portée internationale", et le Directeur général Tedros a accepté la recommandation.\n\nLe Directeur général de l'Organisation mondiale de la santé, Tedros, a déclaré : "Je suis plein d'espoir d'annoncer que l'ère de l'épidémie de COVID-19 en tant qu'urgence sanitaire mondiale est terminée, mais cela ne signifie pas la fin de l'épidémie de COVID-19 en tant que menace pour la santé mondiale.""
chi_sars.401.a: "L'arrivée de l'ère post-épidémique"
chi_GRnews.1: "Super Girl"
chi_GRnews.1.t: "Le concours Super Girl 2004 commence ses auditions"
chi_GRnews.1.d: "Ce mois-ci, Hunan TV a lancé une émission de télévision appelée "Super Girl 2004". Contrairement aux concours de chant courants, cet événement se présente comme un concours de talents musicaux "sans seuil" qui "ne tient pas compte de l'âge, de la région ou de l'apparence". L'émission met l'accent sur un sentiment de bonheur, espérant promouvoir un sentiment de "bonheur universel" à travers ce concours musical qui n'a pas de seuil et est ouvert au public. Ce concours de talents "sans seuil" prône le "chant comme base" et sélectionne le charme vocal des chanteuses, de sorte que l'âge, l'apparence, la région et d'autres facteurs des candidates peuvent être mis de côté. Tant que vous avez une belle voix originale, vous pouvez participer gratuitement à ce concours. La musique populaire, la musique folklorique, les belles voix et toutes sortes de méthodes de chant peuvent être sélectionnées pour choisir la voix la plus authentique.\n\nLe 10 mai 2004, la zone de chant du Hunan a organisé le concours "Top 20 pour le Top 10" afin de produire le top dix de la zone de chant du Hunan. D'autres zones ont ensuite organisé des auditions."
chi_GRnews.1.a: "Des filles avec de belles voix"
chi_GRnews.2: "Le concours Super Girl est terminé"
chi_GRnews.2.t: "Compétition pour la championne de "Super Girl""
chi_GRnews.2.d: "Le 14 août, après plusieurs mois d'auditions, de sélections et de finales, l'émission a finalement désigné la "Championne nationale de l'année" An Youqi, la "Vice-championne nationale de l'année" Wang Ti et la "Troisième place nationale de l'année" Zhang Hanyun, en se basant sur le nombre de votes extérieurs. Les quatrième à huitième places nationales sont : Strings, Sun Yibu, Chen Wenya, Yang Yang et Zhang Yue.\n\nCette émission de télévision a attiré des téléspectateurs de toute la Chine, en particulier des jeunes femmes. De nombreuses filles se sont rendues dans diverses zones de concours pour participer activement aux sélections. L'influence de Hunan Satellite TV dans le domaine du divertissement a été améliorée de manière sans précédent."
chi_GRnews.2.a: "Pas mal"
chi_GRnews.3: "Super Girl"
chi_GRnews.3.t: "Le concours Super Girl 2005 commence ses auditions"
chi_GRnews.3.d: "Après l'énorme succès de l'année dernière, Hunan Satellite TV a de nouveau lancé les auditions de "Super Girl" ce mois-ci, adhérant toujours à l'objectif de l'émission de l'année précédente, "sans distinction d'âge, de région et d'apparence", les candidates gagnent avec leur voix.\n\nDes filles de tout le pays connaissent déjà l'heure de début de l'émission. Depuis mars, beaucoup de personnes se sont rendues à l'avance dans la zone du concours pour attendre l'audition. Le 1er mai 2005, la zone de chant de Changsha a organisé le concours "Top 20 à Top 10", et le top dix de la zone de chant de Changsha a été sélectionné. D'autres zones de concours organiseront ensuite des auditions."
chi_GRnews.3.a: "Il y a plus de monde !"
chi_GRnews.4: "Le concours Super Girl est terminé"
chi_GRnews.4.t: "Compétition pour la championne de "Super Girl""
chi_GRnews.4.d: "Après plusieurs mois d'auditions, Hunan Satellite TV a diffusé les finales nationales de "Super Girl 2005" sur la plateforme Hunan Satellite TV tous les vendredis à 20h30 à partir du 15 juillet 2005. L'émission a finalement désigné la "Championne nationale de l'année" Li Yuchun, la "Vice-championne nationale de l'année" Zhou Bichang et la "Troisième place nationale de l'année" Zhang Liangying, en se basant sur le nombre de votes extérieurs. Les quatrième à dixième places de l'année sont : He Jie, Ji Minjia, Huang Yali, Ye Yiqian, Yi Hui, Zhao Jingyi et Zhu Yan.\n\nLes audiences de cette émission ont atteint un nouveau record. Li Yuchun et Zhou Bichang sont devenues populaires dans tout le pays, et leur influence s'est même étendue à l'étranger. En octobre 2005, la "Championne nationale de l'année" Li Yuchun est apparue en couverture de l'hebdomadaire américain "TIME (Asia Edition)" en tant que l'une des "25 héros asiatiques de l'année". Cette année, Hunan Satellite TV a gagné plus de 100 millions de yuans de revenus grâce aux revenus de parrainage et aux revenus d'insertion publicitaire lors des finales pendant l'organisation de "Super Girl 2005"."
chi_GRnews.4.a: "Nous aimons Chun Ge !"
chi_GRnews.5: "Super Girl"
chi_GRnews.5.t: "Le concours Super Girl 2006 commence ses auditions"
chi_GRnews.5.d: "Après deux années de grand succès, Hunan Satellite TV a lancé les auditions de "Super Girl" ce mois-ci. L'émission adhère toujours à son objectif de l'année précédente, "sans distinction d'âge, de région et d'apparence", et les candidates gagnent avec leur voix.\n\nLes filles de tout le pays connaissent déjà l'heure de début de l'émission. Depuis avril, beaucoup de personnes se sont rendues à l'avance dans la zone du concours pour attendre l'audition. Le 8 mai 2006, la zone de chant de Changsha a organisé le concours "Top 20 à Top 10", et le top dix de la zone de chant de Changsha a été sélectionné. D'autres zones de concours organiseront ensuite des auditions."
chi_GRnews.5.a: "Il y a plus de monde !"
chi_GRnews.6: "Le concours Super Girl est terminé"
chi_GRnews.6.t: "Compétition pour la championne de "Super Girl""
chi_GRnews.6.d: "Après plusieurs mois d'auditions, Hunan Satellite TV a diffusé les finales nationales de "Super Girl 2006" sur la plateforme Hunan Satellite TV tous les vendredis à 20h30 à partir du 15 août 2005. L'émission a finalement désigné la "Championne nationale de l'année" Shang Wenjie, la "Vice-championne nationale de l'année" Tan Weiwei et la "Troisième place nationale de l'année" Liu Liyang, en se basant sur le nombre de votes extérieurs. Les quatrième à dixième places de l'année sont : Ai Mengmeng, Li Na, Xu Fei, Han Zhenzhen, Reborn, Tang Xiao et Yang Lei.\n\nGrâce à trois années consécutives d'auditions nationales, Hunan Satellite TV a établi sa capacité de mobilisation et son influence sur l'industrie du divertissement à l'échelle nationale, et a depuis lors établi sa position de chaîne de variétés la plus puissante."
chi_GRnews.6.a: "Pas mal"
chi_GRnews.7: "Happy Camp"
chi_GRnews.7.t: "Happy Camp"
chi_GRnews.7.d: "En 2004, l'émission de variétés Happy Camp de Hunan TV a commencé à établir un nouveau concept de "pan-divertissement" tel que des "auditions ouvertes", des "émissions de téléréalité" et des "PK en direct" en utilisant des activités périodiques comme points forts et des téléspectateurs ordinaires comme protagonistes. Elle a minimisé les routines de stars des "grandes émissions de variétés" et a essayé de nouveaux concepts tels que des "auditions ouvertes", des "émissions de téléréalité" et des "PK en direct". C'est l'une des rares émissions de variétés divertissantes en Chine. En raison de son format riche, de ses bons effets d'émission et de son fort divertissement, Happy Camp est rapidement apparu fréquemment à la télévision dans les familles de tout le pays, apportant beaucoup de rires le samedi soir."
chi_GRnews.7.a: "Pas mal"
chi_GRnews.8: "Love Apartment"
chi_GRnews.8.t: ""Love Apartment" commence à être diffusé"
chi_GRnews.8.d: "Le 5 août, Jiangxi TV a diffusé une série télévisée appelée Love Apartment. L'émission raconte l'histoire de plusieurs jeunes hommes et femmes vivant, luttant et développant des amitiés dans un appartement de la métropole internationale de Shanghai. Peu de temps après la diffusion de l'émission, elle a été remise en question par le public pour plagiat de la série télévisée américaine "The Big Bang Theory", mais son contenu scénaristique humoristique, ses rebondissements dans les relations interpersonnelles et ses blagues absurdes ont néanmoins attiré l'attention du public.\n\nCertains critiques pensent que le bon scénario est certainement une raison importante de la popularité de l'émission, mais la raison plus profonde est que l'image et le contexte des personnages de l'émission correspondent à la vie d'un grand nombre de jeunes urbains nouveaux issus de l'urbanisation rapide en réalité. Ces jeunes peuvent s'identifier et aspirer aux personnages de l'émission, ce qui lui a valu la faveur non seulement des jeunes urbains, mais aussi la recherche de jeunes hommes et femmes issus de comtés ruraux qui sont sur le point d'entrer dans la ville."
chi_GRnews.8.a: "Pas mal"
chi_GRnews.9: "Le morcellement de l'Empire Qin"
chi_GRnews.9.t: ""Le Grand Empire Qin : Le morcellement" est diffusé""
chi_GRnews.9.d: "Le 18 de ce mois, les chaînes de télévision par satellite du Shaanxi, du Sud-Est, du Henan et du Hebei ont simultanément diffusé une série télévisée historique intitulée "Le morcellement du Grand Empire Qin". Le drame est adapté du roman éponyme "Le Grand Empire Qin" écrit par l'écrivain Sun Haohui. Il raconte l'histoire de Shang Yang, un représentant de l'école de pensée légaliste de la période des Royaumes combattants en Chine avant l'ère commune, qui a travaillé avec le roi Qin Xiaogong pour réformer et promouvoir l'état de droit dans l'État de Qin, qui faisait face au danger de destruction nationale, et a conduit le pays à la prospérité. Le drame a été un succès dès sa diffusion et a suscité une attention et une discussion généralisées dans la société.\n\nLes observateurs pensent que la popularité du drame est inséparable du contexte réel. Après l'impact de la crise économique de 2008, tous les secteurs de la société discutaient de la manière de réformer, et la politique du gouvernement central est progressivement passée de la tendance conservatrice du "pas de bouleversements" à la couleur innovante de "l'établissement de nouvelles règles". L'esprit de réforme contenu dans le drame est très étroitement lié à l'atmosphère de recherche de changement en réalité. Les gens sont profondément impressionnés par le comportement de Shang Yang de "sacrifier sa vie pour la loi" et ont de nombreux éloges pour la détermination de Qin Xiaogong à faire respecter la loi."
chi_GRnews.9.a: "Le plus difficile au monde n'est pas de faire des lois, mais de les faire respecter."
chi_GRnews.10: "Lurking"
chi_GRnews.10.t: "The Hidden" commence à être diffusé"
chi_GRnews.10.d: "Le 20 de ce mois, Southern Television a diffusé une série télévisée historique appelée "The Hidden". Puis Tianjin, Shandong, Chengdu, Heilongjiang, Oriental, Beijing, Chongqing et d'autres chaînes de télévision par satellite ont rapidement suivi le mouvement. Le premier jour de diffusion, les audiences de Beijing Satellite TV ont atteint 8,01 %. Le contexte de la pièce est 1945, alors que la guerre anti-japonaise touchait à sa fin. La lutte entre le Kuomintang, le Parti communiste et le Japon devenait de plus en plus féroce, et des courants sous-jacents surgissaient sous la mer calme. Parce que l'agent du renseignement militaire Li Haifeng a fait défection au régime fantoche de Nanjing Wang, Yu Zecheng (interprété par Sun Honglei), membre du Département du renseignement militaire, a reçu l'ordre de se rendre à Nanjing pour assassiner le traître, mais s'est accidentellement engagé sur une autre voie. . Après avoir été incité par le Parti communiste chinois, Yu Zecheng est retourné à la Commission de contrôle militaire en tant que membre du parti clandestin et est devenu un rivet dans le cœur du Kuomintang. Afin d'aider Yu dans son travail, l'organisation du parti a envoyé Cui Ping (interprétée par Yao Chen), une jeune fille colérique et franche, pour servir de fausse épouse à Yu. Au fil du temps, la lutte entre le Kuomintang et le Parti communiste est devenue plus intense, et le couple a également fait face à une épreuve majeure dans sa vie.\n\nLes acteurs principaux Sun Honglei et Yao Chen ont profondément interprété l'atmosphère tendue et la tendance turbulente de l'époque dans une période historique spéciale grâce à leurs excellentes compétences d'acteur. Le rythme de l'intrigue a également été saisi avec précision, et le drame est devenu le meilleur drame d'espionnage dans l'esprit de nombreux téléspectateurs."
chi_GRnews.10.a: "Hommage aux ancêtres révolutionnaires"
chi_GRnews.11: "Shamatte"
chi_GRnews.11.t: "Tendance Shamatte"
chi_GRnews.11.d: "Depuis l'année dernière, de nombreuses personnes portant des "vêtements étranges" et des coiffures et maquillages "bizarres" sont apparues dans tout le pays. Les caractéristiques communes particulières de ces personnes ont attiré l'attention sociale. Ces groupes ont établi des cercles sociaux et des canaux de dialogue sur Internet, se qualifiant de "Shamatte" ou de "famille Zangai", et se considérant comme une "famille". Ils apparaissent souvent en groupe en public avec des apparences exagérées.\n\nOn comprend que le groupe "Shamatte" est principalement composé de travailleurs migrants et de certains étudiants en cours, la plupart nés dans les années 1990 et 1985, et la plupart d'entre eux sont des utilisateurs Internet habiles qui aiment prendre des selfies. Il y a de nombreuses captures d'écran de vidéos aux cheveux colorés dans QQ Space, les forums et les blogs. Ce style est une combinaison du style visuel japonais et du rock européen et américain, et le groupe Shamatte national aime et imite aveuglément les vêtements, les cheveux, etc. des groupes de rock visuel japonais. La plupart des Shamatte d'origine ont de longs cheveux colorés et un maquillage épais ; portent des vêtements très uniques et des bijoux étranges ; aiment prendre des selfies et faire des actions étranges devant la caméra dans le cybercafé ; se décrivent comme "un groupe qui combine mode, vision et Shamatte en un seul système" La famille chinoise "Shamatte" n'a rien à voir avec la musique rock. Ils aiment juste imiter les vêtements et le maquillage du style visuel. Cependant, les vrais fans du style visuel dédaignent de s'associer aux "Shamatte". Par conséquent, l'évolution du "Shamatte" en Chine n'est ni du VR ni du pur style visuel. C'est un état social unique, une façon de vivre et une tendance culturelle. Shamatte est né de la culture punk des années 1970. Il représente une image alternative et même bizarre de jeunes. Ce groupe de jeunes alternatifs Ils défient constamment les nerfs esthétiques de chacun. Ils sont appelés "famille Shamatte" et sont qualifiés de "Shanzhai" par les internautes qui ne sont pas habitués à leur excentricité. Ils sont assimilés à des "mort-vivants" et des "diaosi" et sont classés avec les mort-vivants.\n\nEn fait, ce groupe n'a rien fait d'illégal ou de nuisible. Les observateurs pensent qu'il s'agit d'une sorte de demande d'appartenance non conventionnelle causée par la crise d'identité des nouveaux résidents urbains dans le contexte de l'urbanisation rapide de la Chine. Son origine, son processus et sa fin sont tous des tragédies d'être exclus par la société dominante."
chi_GRnews.11.a: "Si vous parlez de l'endroit où vous êtes, regardez vers l'avant pour vous souvenir que vous avez toujours été là et vous souhaiter un bon départ !"
chi_GRnews.12: "Home with Kids"
chi_GRnews.12.t: ""Home with Kids" commence à être diffusé"
chi_GRnews.12.d: "Le 12 de ce mois, Beijing TV a diffusé une sitcom familiale appelée "Home with Children", qui raconte les histoires intéressantes entre les parents et trois enfants après la réunion de deux familles divorcées. Le père Xia Donghai a suivi son ex-femme aux États-Unis pour l'accompagner dans ses études et son travail. Après le divorce, il est retourné en Chine avec son fils de 7 ans, Xia Yu, et a retrouvé sa fille Xia Xue qui a grandi en Chine. Plus tard, il a épousé l'infirmière en chef Liu Mei, qui était également divorcée et avait un fils nommé Liu Xing. L'histoire de ce drame se déroule dans cette famille spéciale. Xia Donghai et Liu Mei ont en commun d'être aimants et de se soucier de la croissance de leurs enfants. Ils espèrent "intégrer" leur amour et leur sagesse pour cultiver la prochaine génération de vie heureuse ; et les trois frères et sœurs vivant sous le même toit, malgré leurs liens de sang différents et leurs niveaux d'âge différents, s'entendent comme de vrais enfants.\n\nLe drame est aimé par le public parce qu'il est proche de la vie, et les commentaires des médias d'information le louent également. Cependant, certaines personnes pensent que le drame reflète "seulement la vie d'une famille riche à Pékin" et ne peut pas représenter la grande majorité des familles ordinaires de la société. Les gens ordinaires ne peuvent pas y trouver d'empathie."
chi_GRnews.12.a: ""Je veux teindre cette chose en vert""
chi_GRnews.13: "Crossing the Line of Fire"
chi_GRnews.13.t: "CrossFire est officiellement sorti !"
chi_GRnews.13.d: "Le 3 mai, Tencent a sorti un nouveau jeu de tir à la première personne appelé "Crossfire", qui a été développé par l'équipe coréenne Smile Gate et exploité par Tencent Games en Chine continentale. Le jeu raconte l'histoire de la confrontation entre les deux plus grands groupes de mercenaires au monde, Global Risk et Black List. Le jeu propose plusieurs modes tels que le mode compétition par équipe, la compétition par équipe, le mode démolition, le mode fantôme, et le premier à introduire un système d'adhésion instantanée sous la forme de "manque de personnes à compléter".\n\nAuparavant, le marché des jeux de tir à la première personne en Chine était principalement occupé par Counter-Strike (CS). Depuis la sortie officielle de Crossfire, la part de marché du jeu a continué d'augmenter, et il est rapidement devenu populaire dans tout le pays et est devenu un jeu phénoménal. Dans chaque cybercafé, vous pouvez voir des gens combattre côte à côte avec leurs coéquipiers dans Crossfire, et attirer un groupe de fans de CF qui sont également accros à CF pour regarder par derrière. Ce jeu deviendra l'un des jeux les plus populaires en Chine dans un avenir proche."
chi_GRnews.13.a: "kkkkkkkkkkkkkkkLe propriétaire, s'il vous plaît ouvrez rapidement !"
chi_GRnews.14: "World of Warcraft"
chi_GRnews.14.t: "World of Warcraft est officiellement lancé en Chine !"
chi_GRnews.14.d: "Le 6 juin, le jeu "World of Warcraft" produit par Blizzard Games a officiellement débarqué en Chine et a sorti sa première version sur serveur national. Auparavant, les joueurs chinois ne pouvaient jouer à ce jeu de rôle en ligne massivement multijoueur qui est populaire dans le monde entier depuis longtemps que sur des serveurs étrangers. Désormais, les joueurs chinois n'ont plus à supporter une latence élevée et des interfaces anglaises difficiles. Ils peuvent jouer joyeusement en se connectant au serveur national.\n\nL'importance de "World of Warcraft" pour l'industrie du jeu est depuis longtemps évidente. Mike Laidlaw, le concepteur en chef de "Dragon Age : Origins", estime que la production de jeux en ligne doit prendre en compte l'impact de World of Warcraft sur les joueurs. Il est imprudent d'ignorer la part et l'influence de World of Warcraft sur le marché des jeux en ligne. Tout comme "Quake" a établi le cadre de base des jeux FPS, World of Warcraft a également établi l'interface utilisateur la plus populaire pour les jeux MMO. Ce jeu est sur le point de devenir célèbre en Chine continentale et de devenir la mémoire d'une génération."
chi_GRnews.14.a: "Un jour, ma vie prendra fin, et tu seras couronné roi"
chi_GRnews.15: "QQ"
chi_GRnews.15.t: "QQ"
chi_GRnews.15.d: ""Ahem—Ahem", quel internaute t'a envoyé un message QQ aujourd'hui ?\n\nCe mois-ci, le nombre d'utilisateurs enregistrés de QQ, un logiciel de messagerie instantanée publié par Tencent, a dépassé les 200 millions, ce qui en fait l'un des logiciels de communication les plus largement utilisés en Chine et même dans le monde. L'ère de la communication par bipeurs et messages texte a changé. Maintenant, il vous suffit de double-cliquer sur cette jolie icône de pingouin sur votre ordinateur pour vous connecter à QQ et envoyer des messages gratuits aux amis avec qui vous devez parler. Les logiciels connexes comprennent également QQ Space sous forme de blogs personnels, QQ Mailbox, etc., qui sont appréciés par les internautes pour leur nouveauté, leur commodité et leurs fonctions riches."
chi_GRnews.15.a: "Thunder Monkey, es-tu un GG ou un MM ?"
chi_GRnews.16: "Décès de Zhao Lirong"
chi_GRnews.16.t: "Décès de la célèbre actrice Zhao Lirong"
chi_GRnews.16.d: "À 7h30 le 17 juillet, la célèbre actrice Zhao Lirong est décédée d'un cancer du poumon à l'âge de 72 ans. Les gens ont de profonds sentiments pour cette vieille artiste qui est apparue de nombreuses fois sur la scène du gala du Festival du Printemps et a apporté de la joie aux habitants du pays. Zhao Lirong a participé à un total de 6 galas du Festival du Printemps de CCTV. Chaque fois, les sketches qu'elle a interprétés ont pu pousser l'atmosphère chaleureuse du gala à son apogée. Les sketches tels que "Sima Guang Smashing the Jar", "Tangshan Mom", "Love Whom", "Working Adventure", "Such Packaging", etc. sont profondément aimés par le public. Certains sketches ont été co-créés par elle et Gong Hanlin. Chaque mouvement et chaque mot des sketches sont imprégnés de son travail acharné et de sa sueur. Ces sketches ne sont pas seulement très influents en Chine, mais aussi bien connus à l'étranger. Le "Star Morning Post" américain, le "Times" britannique, le magazine français "Chinatown" et le "Great Culture News" russe ont tous commenté et rapporté les sketches de Zhao Lirong, la qualifiant de "maître féminine drôle qui écrit sur les civils, joue des civils et vient des civils". Et l'ont louée avec un titre élevé, disant qu'elle était "une artiste locale spirituelle qui est née à Yanzhao et est originaire de la même ville que Cao Xueqin et Teresa Teng..."
chi_GRnews.16.a: "Vin de jade du palais, 180 yuans la tasse ! Comment est ce vin ? Laissez-moi vous en parler !"
chi_GRnews.17: "JAY"
chi_GRnews.17.t: "Le chanteur taïwanais Jay Chou sort son premier album solo "Jay" !"
chi_GRnews.17.d: "Au tournant du millénaire, le R&B était en plein essor sur la scène musicale chinoise, et de nombreux chanteurs ont conjointement promu le changement silencieux du style de musique pop chinoise. À ce moment-là, un album nommé "Jay" a également été publié par Alfa Records de Taiwan. Ceux qui ont acheté l'album dès la première fois ont eu la chance d'assister à l'ouverture de la "nouvelle génération de chanteurs et d'auteurs-compositeurs" sur la scène musicale. Les dix chansons de l'album ne sont pas stéréotypées, et de nombreux éléments musicaux frais et thèmes lyriques mettent en évidence l'empreinte personnelle unique de ce débutant. Le nom "Jay Chou" est également entré dans l'œil du public avec la fraîcheur et l'impact de ses œuvres. Le style de l'album entier est R&B et New L'album est principalement basé sur le Hip-Hop, avec l'ajout d'accompagnements de cordes classiques baroques et de groupe, formant un style rétro britannique. Ce qui est plus spécial, c'est que la performance de cordes de style espagnol dans les chansons de l'album est extrêmement proche de la conception artistique des bandes sonores de films. Le grand nombre de styles de musique noire mélangés dans l'album a ébranlé le socle traditionnel de la scène musicale chinoise. Dans le même temps, il s'agit d'un disque bicoeur avec un moteur rythmique basé sur la mélodie, qui recalibre l'équilibre d'une chanson moderne avec rythme et mélodie, donnant aux gens un charme de personnalité relativement frais et riche.\n\nLa chanson titre "Xingqing" a remporté le 24e prix d'or de la chanson mandarin exceptionnelle des Top Ten Chinese Golden Songs, et il a également reçu de l'attention sur la scène musicale chinoise avec cet album. Lors de la 12e cérémonie des Taiwan Golden Melody Awards qui a eu lieu l'année suivante, il a remporté le prix du meilleur album de musique pop et a été nominé pour le prix du meilleur producteur avec cet album, et a été nominé pour le prix du meilleur compositeur aux 12e Taiwan Golden Melody Awards avec la chanson "Lovely Woman" de l'album. L'avenir de ce jeune chanteur est extrêmement vaste."
chi_GRnews.17.a: "Oh, pas mal."
chi_GRnews.18: "Chibi Maruko-chan"
chi_GRnews.18.t: "Guangdong TV diffuse "Chibi Maruko-chan" !"
chi_GRnews.18.d: "Ce mois-ci, Guangdong TV a diffusé l'anime japonais "Chibi Maruko-chan" pour la première fois en Chine continentale. "Chibi Maruko-chan" est une animation télévisée produite par une société d'animation japonaise. Son animation a été classée parmi les trois premières en termes d'audiences d'animation japonaises pendant plus de 20 ans. Elle est diffusée en série et populaire sur Fuji TV au Japon tous les dimanches à 18 heures en heure de grande écoute. C'est une animation nationale dans le cœur des Japonais, hommes, femmes et enfants. Cette œuvre est basée sur l'enfance de l'auteur. L'histoire tourne autour de Maruko, de sa famille et de ses camarades de classe. Il s'agit d'affection familiale, d'amitié ou de petites choses de la vie. Il y a des rires et des larmes, ce qui rappelle aux gens l'innocence de l'enfance. La diffusion de la version animée de Chibi Maruko-chan a permis à Maruko de dépasser le Japon et de débarquer dans des pays asiatiques tels que la Chine, la Corée du Sud et la Thaïlande, et a déclenché une frénésie d'audiences et de collection de produits dérivés. Parmi eux, le doublage de la version taïwanaise est spécial et intéressant, ce qui fait également de Maruko un personnage d'anime populaire auprès des enfants du continent et même des adultes. En 2010, l'animation originale de Maruko était toujours diffusée en série à raison de 150 épisodes par an, et jouissait de la réputation de bandes dessinées ensoleillées et à longue durée de vie au Japon."
chi_GRnews.18.a: ""En fait, la soi-disant vie est pleine de tant de choses ennuyeuses.""
chi_GRnews.19: "Crayon Shin-chan"
chi_GRnews.19.t: "Le CD de "Crayon Shin-chan" est officiellement introduit en Chine !"
chi_GRnews.19.d: "Ce mois-ci, le dessin animé familial japonais populaire "Crayon Shin-chan" a officiellement débarqué en Chine continentale et a été vendu sous forme de disque. Le film est adapté de l'œuvre de bande dessinée éponyme "Crayon Shin-chan" créée par le dessinateur japonais Yoshito Usui. Il raconte l'histoire d'un garçon japonais de 5 ans, Nohara Shinnosuke, et de sa famille, de ses enseignants, de ses camarades de classe, de ses voisins, des passants dans la vie quotidienne.\n\nCe n'est pas un hasard si "Crayon Shin-chan" est rapidement devenu populaire au Japon et dans les pays et régions voisins. L'un des facteurs importants est que, grâce aux paroles et aux actes inhabituels d'un enfant agité, il a dit ce que les adultes voulaient dire mais n'osaient pas dire, et a fait ce que les adultes voulaient faire mais n'osaient pas faire, libérant les activités psychologiques de la pression des adultes, et a touché la corde sensible des adultes qui aspiraient à retourner à l'enfance, à retourner à la nature et à retourner à la réalité, ce qui a suscité une forte résonance chez la plupart des téléspectateurs. "Crayon Shin-chan" n'est pas seulement une œuvre d'animation, mais un phénomène culturel. , Shin-chan ne se limite pas aux personnages de la pièce, mais à la pensée d'un groupe de personnes. Derrière ce phénomène se cache la mentalité adulte complexe reflétée par le dessin animé qui peut susciter la résonance de chacun, y compris au moins : une profonde impuissance face à la vie réelle, une pensée anti-traditionnelle face à la culture hybride, une attitude habituelle, égoïste, hypocrite et sophistique envers les autres, et une impuissance face à la gâterie des grands-parents et à l'impact sur l'éducation des mineurs.\n\nCependant, cet excellent dessin animé japonais est également mélangé à beaucoup de contenu vulgaire et de bas niveau, il a donc été critiqué par certaines personnes après être devenu populaire en Chine. En août 2004, l'Administration d'État de la radio, du cinéma et de la télévision a publié l'"Avis sur la diffusion illégale de dessins animés étrangers par la station de télévision de Dezhou, Shandong". L'"Avis" a souligné que la station de télévision de Dezhou, Shandong, a utilisé des méthodes de demande interactive par téléphone pour diffuser le dessin animé japonais non autorisé "Crayon Shin-chan" sur le canal graphique. Le contenu du film est de bas niveau et vulgaire, ce qui n'est pas propice à la croissance physique et mentale saine des mineurs."
chi_GRnews.19.a: ""Éléphant, éléphant, pourquoi ta trompe est-elle si longue~""
chi_GRnews.20: "Detective Conan"
chi_GRnews.20.t: "Détective Conan est un immense succès !"
chi_GRnews.20.d: ""俺は江戸川コナン、探偵さ (Je m'appelle Edogawa Conan, et je suis détective)"\n\nL'image d'un petit garçon japonais portant un costume bleu, un nœud papillon rouge et de grosses lunettes est profondément enracinée dans le cœur des Chinois. C'est une réplique classique de Conan, le protagoniste de l'anime japonais "Détective Conan". En 1999, "Détective Conan" a été diffusé sur China Education Television et Liaoning Education Television. Les 105 premiers épisodes de "Détective Conan" ont été doublés en chinois taïwanais. Le film a été diffusé à plusieurs reprises sur diverses chaînes satellites et chaînes pour enfants en Chine pendant une longue période. En 2003, "Détective Conan" s'est classé sixième sur Shanghai TV avec une audience de 9,54 % tout au long de l'année, devenant le premier dessin animé à entrer dans le top dix des audiences télévisées en Chine. Après le lancement de Shanghai Xuandong Cartoon Satellite TV, le film a été programmé comme une "animation adulte à la mode" de 20h00 à 21h00. Il est diffusé à 13h30 et forme toujours un pic d'audience en soirée malgré la concurrence des séries télévisées en prime time dans le même créneau horaire. En 2010, le film s'est classé premier en termes de durée de diffusion des films d'animation importés cette année-là (quatrième au classement général), avec un total de 103 646 minutes ; la même année, parmi les films d'animation diffusés sur Zhejiang Satellite TV, Détective Conan a obtenu les meilleures audiences."
chi_GRnews.20.a: "真実はいつも一つ! (Il n'y a toujours qu'une seule vérité !)"
chi_GRnews.21: "Dragon Ball"
chi_GRnews.21.t: "Dragon Ball est un immense succès !"
chi_GRnews.21.d: ""Il y a longtemps, il y avait une ancienne légende selon laquelle il y avait sept boules appelées boules de dragon dispersées dans le monde entier. Tant que vous collectez les sept boules de dragon et récitez un sort, vous pouvez invoquer un dragon, et tout souhait peut être exaucé pour celui qui le souhaite.\n\nEn tant que l'une des œuvres représentatives des mangas japonais, "Dragon Ball" d'Akira Toriyama est certainement un souvenir d'enfance pour d'innombrables personnes. Au cours des 30 années qui se sont écoulées depuis sa naissance en 1984, "Dragon Ball" a conservé une très grande popularité. Cette œuvre classique semble être devenue un symbole des mangas japonais. L'intrigue d'aventure des débuts de "Dragon Ball" n'a pas été aussi populaire que prévu, et sa popularité est même tombée à la limite dangereuse d'une dizaine. À ce moment-là, l'éditeur Kazuhiko Torishima s'est de nouveau manifesté et a estimé que le thème de la "recherche du pouvoir" devait être ajouté à l'œuvre, c'est pourquoi le premier championnat du monde des arts martiaux est apparu. Effectivement, la popularité a rapidement augmenté par la suite, et la diffusion de l'animation a été encore plus élevée. Depuis 1987, "Dragon Ball" a retrouvé la première place du magazine et a conservé cette position jusqu'à son achèvement.\n\nAprès l'introduction de "Dragon Ball" en Chine continentale, il est rapidement devenu une animation populaire et phénoménale comme d'autres animations populaires. Les gens se sentent à la fois familiers et étrangers avec le protagoniste "Sun Wukong", et l'histoire exotique donne également aux publics chinois un sentiment de familiarité et de réconfort en raison de la cognition culturelle commune entre la Chine et le Japon."
chi_GRnews.21.a: ""Hé ! Elle a dit que nous nous reverrons, alors il y a encore de l'espoir !""
chi_GRnews.22: "Naruto"
chi_GRnews.22.t: "Naruto est un immense succès !"
chi_GRnews.22.d: "Le 4 de ce mois, Star TV a diffusé l'anime japonais "Naruto", qui a obtenu d'excellentes audiences. "Naruto" est une animation télévisée de longue date adaptée du manga éponyme créé par le dessinateur japonais Masashi Kishimoto. Il a été diffusé pour la première fois sur la série à 6 stations de Tokyo TV et Gifu Broadcasting le 3 octobre 2002, avec un total de 220 épisodes. L'histoire dépeint avec succès le ninja, qui à l'origine se cachait dans l'ombre et utilisait la volonté la plus forte et les efforts les plus ardus pour faire les choses les plus secrètes et les plus cruelles, comme la profession la plus fière et la plus brillante sous le soleil. L'histoire se déroule dans un monde de ninjas. L'histoire commence avec la vie du protagoniste Uzumaki Naruto en tant qu'orphelin. Le quatrième Hokage protège le village. Naruto était ignoré par les villageois et essayait d'attirer leur attention avec diverses farces. Heureusement, grâce aux soins du professeur Iruka, le caractère de Naruto ne s'est pas déformé. Il était toujours énergique et optimiste. Afin de se faire reconnaître par plus de gens, l'objectif de Naruto est de devenir Hokage. Toute l'histoire tourne autour de la lutte et de la croissance de Naruto, des partenaires de Naruto, et des diverses luttes et conspirations dans ce monde de ninjas.\n\n"Naruto" est plein d'éléments japonais, tels que les ninjas, les ninjutsu, les marques, etc., ce qui offre un canal très intéressant pour les Chinois pour comprendre la culture japonaise."
chi_GRnews.22.a: ""Le destin humain est-il comme un nuage qui ne peut que dériver avec le vent, ou le nuage choisit-il sa propre direction ?"
chi_GRnews.23: "One Piece"
chi_GRnews.23.t: "One Piece est diffusé !"
chi_GRnews.23.d: "Ce mois-ci, Star TV a diffusé l'anime japonais "One Piece", qui est rapidement devenu un succès. "One Piece" est un manga pour jeunes dessiné par le dessinateur japonais Eiichiro Oda. Il a commencé sa publication en série dans le "Weekly Shonen Jump" de Shueisha le 22 juillet 1997. L'animation télévisée adaptée "One Piece" a été diffusée pour la première fois sur Fuji TV le 20 octobre 1999, et est maintenant officiellement diffusée en Chine continentale.\n\nAvant sa mort, le Roi des Pirates Gol D. Roger a laissé un message concernant la richesse de sa vie, "One Piece", qui a attiré de nombreux héros. Les pirates se sont battus pour cette énorme richesse légendaire. Diverses forces et régimes ont continué à changer, et le monde entier est entré dans la "Grande ère des pirates" turbulente et chaotique. Luffy, qui a grandi dans le village du Moulin à vent en mer de Chine orientale, a été influencé par le pirate Shanks et a décidé de devenir un excellent pirate et finalement de devenir le Roi des Pirates. Afin d'atteindre cet objectif et de trouver le tant attendu One Piece, Luffy a commencé son aventure pour trouver le One Piece."
chi_GRnews.23.a: ""Je veux être l'homme qui deviendra le Roi des Pirates !""
chi_GRnews.24: "Pinball Police"
chi_GRnews.24.t: ""Pinball Police" est un immense succès !"
chi_GRnews.24.d: "L'anime japonais "Dama Police" introduit cette année a été bien accueilli par le public.\n\n"Dama Police" (Bビ – ダマン爆外伝), une animation de robot produite par Nagoya Telebi, compte deux séries de 50 épisodes au total. Elle a été diffusée sur Asahi TV au Japon du 7 février 1999 au 30 janvier 2000. L'histoire raconte celle de l'Empereur Noir qui a été vaincu par sept guerriers dotés d'"énergie stellaire" il y a 1 000 ans. 1 000 ans plus tard, lorsque les neuf planètes sont alignées, il a de nouveau lancé un terrible plan pour détruire le système solaire. Le jeune garçon Hakubo est un garçon ensoleillé de Marble City qui a accidentellement heurté l'avion en mouvement du Dr Gray Bao à cause de la malice de son oiseau de compagnie, Wind Feather. Il a découvert l'Empereur Noir et l'Homme Marbre Noir. Avec un sens de la justice, il a commencé une bataille juste avec Rouge, Bleu, Jaune, Noir et d'autres pour protéger le monde de chacun."
chi_GRnews.24.a: "Ça a l'air bien"
chi_GRnews.25: "Beyblade"
chi_GRnews.25.t: "\"Beyblade\" est très apprécié !"
chi_GRnews.25.d: "L'anime japonais \"Beyblade\" a gagné beaucoup de popularité en Chine et a déclenché une \"fièvre de la course\". De nombreux enfants et adolescents recherchent des mini-bolides plus rapides et plus solides, ce qui a conduit au développement florissant de l'industrie des voitures de course jouets."
chi_GRnews.25.a: "Allons-y !"
chi_GRnews.26: "Doraemon"
chi_GRnews.26.t: "\"Doraemon\" est très apprécié !"
chi_GRnews.26.d: "\"Chaque jour est pareil, avec parfois des inspirations soudaines. Tant que j'ai Doraemon, mon rire se prolongera à l'infini ~\" Le chat robot bleu rond est devenu le meilleur compagnon dans l'esprit de nombreux enfants chinois. L'anime japonais \"Doraemon\" est devenu une image culturelle bien connue des enfants chinois. La bande dessinée raconte l'histoire d'un robot en forme de chat du 22e siècle, Doraemon, à qui son propriétaire Nobi Shishu a confié le soin de retourner au 20e siècle et d'utiliser divers gadgets du futur sortis de sa poche à quatre dimensions pour aider l'arrière-grand-père de Shishu, l'écolier Nobi Nobita, à résoudre divers problèmes difficiles autour de lui, ainsi que les histoires légères, humoristiques, drôles et touchantes qui se sont produites dans sa vie avec sa mère Nobi Tamako, ses amis Shizuka, Fat Tiger et Suneo.\n\nDoraemon a gagné l'amour d'innombrables spectateurs grâce à son excellente intrigue, sa production soignée et son intrigue touchante, et l'image du chat robot bleu est également devenue l'un des éléments japonais les plus connus au monde."
chi_GRnews.26.a: "Nous aimons tous Doraemon !"
chi_GRnews.27: "Astro Boy"
chi_GRnews.27.t: "\"Astro Boy\" est très apprécié !"
chi_GRnews.27.d: "L'anime japonais \"Astro Boy\" fait un carton en Chine ! \"Astro Boy\" est une bande dessinée de science-fiction créée par le dessinateur japonais Osamu Tezuka. Elle a été publiée en série dans le magazine de bande dessinée \"Shonen\" de \"Kobunsha\" d'avril 1952 à mars 1968. L'œuvre raconte l'histoire du jeune robot Astro Boy au 21e siècle. L'œuvre a été adaptée en animations à plusieurs reprises. Parmi elles, la première version de l'animation télévisée de 1963 a été la première série d'animation télévisée au Japon et la première série d'animation étrangère introduite en Chine continentale. En avril 1951, \"Ambassador Astro Boy\" a commencé à être publié en série. Il est apparu pour la première fois dans un rôle secondaire. En avril de l'année suivante, \"Astro Boy\" a commencé à être publié en série dans le magazine de bande dessinée \"Shonen\". Quand \"Astro Boy\" est sorti pour la première fois, il a fait sensation au Japon. Ce petit robot intelligent, courageux et juste est presque aimé de tous."
chi_GRnews.27.a: "\"Un monde où seuls les humains prospèrent finira par tomber\""
chi_GRnews.28: "Les 3000 questions de Blue Cat"
chi_GRnews.28.t: "\"Les 3000 questions de Blue Cat\" a reçu un accueil très favorable !"
chi_GRnews.28.d: "\"Les étoiles clignotent, la lune fait un point d'interrogation, la comète traîne une longue queue, et l'arc-en-ciel construit un pont. \"\n\nLe 10 de ce mois, CCTV-7 a diffusé un film d'animation intitulé \"Les 3000 questions coquines de Blue Cat\" produit par Hunan Blue Cat Cartoon Media Co., Ltd. et réalisé par Wang Hong. La série utilise un grand nombre de scènes élaborées en simulation numérique 3D et autres hautes technologies, se concentrant sur le vaste univers, le mouvement magique des corps célestes et la démonstration magique de diverses armes de haute technologie, apportant au public un impact visuel inégalé, qui fait trembler et se sentir rafraîchi, et entraîne le public dans un monde de science-fiction onirique. C'est la première série d'animation scientifique à grande échelle en Chine. Elle a suivi son propre chemin avec la créativité artistique du \"dessin animé de connaissances\". À travers le processus d'aventure du protagoniste \"Blue Cat\" et de ses partenaires, et en utilisant les problèmes qu'ils rencontrent, elle fournit aux enfants des connaissances sur l'univers, l'environnement écologique, l'histoire humaine et les vues biologiques. Elle contient non seulement la cristallisation de milliers d'années de brillante culture humaine, mais aussi un aperçu des connaissances de haute technologie contemporaines. C'est une version électronique de l'encyclopédie de la jeunesse à l'ère de l'économie du savoir."
chi_GRnews.28.a: "Oh, tant que vous aimez penser, aimer demander et aimer utiliser votre cerveau, vous comprendrez toutes les merveilleuses questions du monde."
chi_GRnews.29: "Ultraman Tiga"
chi_GRnews.29.t: "\"Ultraman Tiga\" fait un énorme succès !"
chi_GRnews.29.d: "\"Ultraman Tiga\" est un film à effets spéciaux produit par Tsuburaya Co., Ltd., écrit par Masama Ueda, réalisé par Hiromi Muraishi et mettant en vedette Hiroshi Nagano, Takami Yoshimoto et Rei Takagi. C'est également la première œuvre de la série \"Ultraman\" de l'ère Heisei. La popularité d'Ultraman Tiga en Chine a largement dépassé toutes les attentes. Les critiques estiment que le succès d'Ultraman Tiga réside dans son objectif intrinsèque d'amour et de paix, et de coexistence harmonieuse entre l'homme et la nature, ce qui est conforme aux aspirations du peuple chinois. Le pouvoir majestueux et puissant de Tiga n'est jamais utilisé pour opprimer les faibles mais pour protéger les faibles, ce qui est également conforme aux valeurs de la société chinoise.\n\nQuoi qu'il en soit, Ultraman Tiga est devenu un héros et un objectif dans l'esprit de nombreux enfants chinois, et le film est également le film japonais à effets spéciaux le plus populaire en Chine."
chi_GRnews.29.a: "\"Nous deviendrons tous de la lumière !\""
chi_GRnews.30: "Cardcaptor Sakura"
chi_GRnews.30.t: "Cardcaptor Sakura est diffusé !"
chi_GRnews.30.d: "En octobre, Shanghai TV a diffusé en avant-première \"Cardcaptor Sakura\", qui a été introduit par Guangdong Baishilian Film Development Co., Ltd. Sakura Kinomoto est une écolière de 4e année douée en sport. Un jour, Sakura est rentrée de l'école et a trouvé quelqu'un dans le bureau du sous-sol, qui était généralement vide. Sakura est descendue et a vu un livre brillant d'une lumière dorée. Il y avait des cartes dedans, mais en lisant les mots qui y étaient écrits, un vent violent a soufflé et les cartes se sont éparpillées. À la fin du livre, une étrange créature nommée Clow Beros est apparue, et le livre disait quelque chose comme \"Lorsque le sceau des Cartes de Clow sera brisé, un désastre s'abattra sur le monde\". Puis, Keruberos a donné la clé du sceau à Sakura, faisant d'elle la magicienne attrape-cartes qui a récupéré les cartes. Cette nuit-là, Sakura a utilisé la magie pour combattre les cartes matérialisées...\n\nAffectée par l'environnement social de l'époque, la version télévisée a eu quelques restrictions sur l'intrigue amoureuse. De plus, le nom de Li Syaoran a été changé en \"Wang Xiaoming\" dans la version chinoise, et le contenu avec des éléments d'horreur fantomatique dans le deuxième épisode a également été supprimé lors de sa diffusion à la télévision. L'intrigue de \"Miroir\" faisant du shopping avec Touya a également été supprimée dans la version télévisée car elle n'était pas pertinente pour l'intrigue principale. Quoi qu'il en soit, cet anime est très apprécié par les enfants et les adolescents."
chi_GRnews.30.a: "Maintenant, au nom de ton maître, Sakura, je te commande : le sceau est levé !"
chi_GRnews.31: "Slam Dunk"
chi_GRnews.31.t: "Slam Dunk est un immense succès !"
chi_GRnews.31.d: "Le manga pour jeunes sur le thème du basket-ball \"Slam Dunk\" créé par le mangaka japonais Takehiko Inoue devient très populaire en Chine. L'histoire raconte celle d'un voyou aux cheveux roux nommé Sakuragi Hanamichi qui a été largué par 50 étudiantes au collège. Après être entré au lycée Xiangbei, il est tombé amoureux au premier regard d'une fille de la même année nommée Akagi Haruko qu'il a rencontrée par hasard. Sous l'attente de Haruko, Hanamichi, qui ne connaît rien aux règles du basket-ball, rejoint l'équipe de basket-ball. Sous l'entraînement strict du frère de Haruko, le capitaine de l'équipe de basket-ball, Akagi Takenori, et l'inflammation de la conscience de confrontation contre le \"super rookie\" Rukawa Kaede, le talent caché de Hanamichi a finalement émergé. Dans le même temps, il a également été attiré par l'équipe de basket-ball. Après un match d'entraînement avec un rival puissant, le lycée Ryonan, Ryouta Miyagi, qui est petit mais possède une capacité athlétique flexible, et Mitsui Hisayuki, qui a remporté le titre de MVP du comté au collège, sont également revenus dans l'équipe. L'équipe de basket-ball du lycée Xiangbei, considérablement améliorée, a commencé à se préparer pour les qualifications de la préfecture de Kanagawa de la ligue nationale des lycées. C'est ainsi que l'équipe de basket-ball du lycée Xiangbei, dirigée par Sakuragi Hanamichi, a vécu l'été le plus chaud de sa vie.\n\nLa bande dessinée est très appréciée pour son style droit, son esprit sportif et sa qualité de dessin, et elle a également déclenché une fièvre du basket-ball chez les jeunes de notre pays."
chi_GRnews.31.a: "\"Coach, je veux jouer au basket\""
chi_GRnews.32: "Mobile Suit Gundam"
chi_GRnews.32.t: "Mobile Suit Gundam 00 est extrêmement populaire !"
chi_GRnews.32.d: "Le 6 de ce mois, le Japon a diffusé \"Mobile Suit Gundam 00\", poursuivant son style exquis habituel et ses batailles passionnées, et poursuivant également la poursuite fanatique des fans en Chine."
chi_GRnews.32.a: "\"俺はガンダムで行く! (J'attaquerai en forme de Gundam !)\""
chi_GRnews.33: "Yu-Gi-Oh !"
chi_GRnews.33.t: "La folie Yu-Gi-Oh !"
chi_GRnews.33.d: "Un jeu de cartes japonais \"Yu-Gi-Oh !\" se répand rapidement dans notre pays.\n\n\"Yu-Gi-Oh !\" est un manga dessiné par le mangaka japonais Kazuki Takahashi, et adapté en animation télévisée et en jeu. L'histoire des jeux remonte à l'ancienne Égypte, il y a 5 000 ans. Les anciens jeux étaient utilisés pour prédire l'avenir des humains et des pharaons, et étaient des rituels magiques qui déterminaient le destin. Ceux-ci s'appelaient les jeux des ténèbres. Cependant, un garçon célèbre a complété le \"Puzzle Millénaire\", a accepté le jeu des ténèbres et est devenu l'incarnation de la justice. La lumière et les ténèbres, le nom du garçon aux deux cœurs, s'appelle \"Yu-Gi-Oh\". En 1998, Bandai a lancé une collection de cartes basée sur le jeu de cartes à collectionner qui est apparu dans l'original \"Yu-Gi-Oh !\", qui est rapidement devenu populaire dans le monde entier, y compris dans notre pays."
chi_GRnews.33.a: "Vous êtes aussi un joueur de cartes ?"
chi_GRnews.34: "Le Dixième Plan Quinquennal"
chi_GRnews.34.t: "Le Dixième Plan Quinquennal est lancé !"
chi_GRnews.34.d: "Après une formulation détaillée et une approbation par le Comité Central du Parti et le Conseil d'État, tous les secteurs de notre société ont commencé à entrer dans le Dixième Plan Quinquennal."
chi_GRnews.34.a: "Plein régime !"
chi_GRnews.35: "Le Onzième Plan Quinquennal"
chi_GRnews.35.t: "Le 11e Plan Quinquennal est lancé"
chi_GRnews.35.d: "Après une formulation détaillée et une approbation par le Comité Central du Parti et le Conseil d'État, tous les secteurs de notre société ont commencé à entrer dans le 11e Plan Quinquennal."
chi_GRnews.35.a: "Plein régime !"
chi_GRnews.36: "Le 12e Plan Quinquennal"
chi_GRnews.36.t: "Le 12e Plan Quinquennal est lancé"
chi_GRnews.36.d: "Après une formulation détaillée et une approbation par le Comité Central du Parti et le Conseil d'État, tous les secteurs de notre société ont commencé à entrer dans le 12e Plan Quinquennal."
chi_GRnews.36.a: "Plein régime !"
chi_GRnews.37: "Le Treizième Plan Quinquennal"
chi_GRnews.37.t: "Le 13e Plan Quinquennal est lancé"
chi_GRnews.37.d: "Après une formulation détaillée et une approbation par le Comité Central du Parti et le Conseil d'État, tous les secteurs de notre société ont commencé à entrer dans le 13e Plan Quinquennal."
chi_GRnews.37.a: "Plein régime !"
chi_GRnews.38: "Jour de la Fête Nationale de la République Populaire de Chine"
chi_GRnews.38.t: "Jour de la Fête Nationale de la République Populaire de Chine"
chi_GRnews.38.d: "Le 1er octobre 1949, le grand Président Mao Zedong a solennellement annoncé au monde l'établissement de la République Populaire de Chine et du Gouvernement Populaire Central.\n\nChaque année, pour la Fête Nationale en Chine, les habitants de tout le pays, ainsi que les entreprises et les institutions, accrochent des lanternes ou des bannières avec des slogans tels que \"Joyeuse Fête Nationale\" pour célébrer la Fête Nationale ; des bonsaïs et des ballons gonflables avec des slogans sont placés sur la place pour accueillir la Fête Nationale dans une atmosphère joyeuse. Pour la Fête Nationale, le drapeau de la République Populaire de Chine est levé à 6h10, à la même heure que le lever du soleil.\n\nLa grande patrie a traversé des décennies depuis sa naissance et continuera à se tenir fièrement sur la scène mondiale."
chi_GRnews.38.a: "Vive la République Populaire de Chine"
chi_GRnews.39: "Anniversaire de Mao Zedong"
chi_GRnews.39.t: "Anniversaire de Mao Zedong"
chi_GRnews.39.d: "Le 26 décembre 1893 est l'anniversaire du Président Mao Zedong. Chaque année, ce jour-là, d'innombrables personnes dans tout le pays se rassemblent spontanément dans son ancienne résidence de Shaoshan pour se souvenir de ce géant rouge. Les drapeaux rouges flottent et les chants sont bruyants.\n\nSur la place Tian'anmen à Pékin, le portrait du Président observe en silence les changements rapides de la Chine au cours des dernières décennies. À l'extrémité de l'île Orange à Changsha, l'immense jeune Mao Zedong regarde tout le monde."
chi_GRnews.39.a: "Te souviens-tu de l'époque où tu étais au milieu d'une rivière, pagayant dans l'eau et les vagues empêchant ton bateau de voler ?"
chi_GRnews.40: "Rage Comics"
chi_GRnews.40.t: "Wang Nima télécharge le Rage Comic"
chi_GRnews.40.d: "L'origine du mème rage comic est née sur 4chan en 2007, et s'est étendue au réseau social en Chine continentale vers 2008. Il est non seulement devenu populaire rapidement, mais a également été localisé par les internautes. Par exemple, le protagoniste du comic est généralement appelé \"Wang Nima\", qui est le protagoniste commun de la plupart des créations.\n\nEn 2011, un internaute nommé \"Wang Nima\" a créé un site web chinois pour publier et créer des rage comics, et a fourni un \"générateur de rage comic\" pour permettre aux internautes de créer librement leurs propres rage comics. Il est dit qu'en février prochain, la société chinoise Xi'an Momo Information Technology Co., Ltd. demandera au China Copyright Protection Center l'enregistrement du droit d'auteur des rage comics en Chine continentale. La société affirme que son fondateur est le créateur du site web chinois et enregistrera le droit d'auteur du logiciel du générateur de rage comic."
chi_GRnews.40.a: "Jusqu'à ce que je reçoive une flèche dans le genou..."
chi_GRnews.41: "Armor Hero"
chi_GRnews.41.t: "\"Armor Hero\" est sorti !"
chi_GRnews.41.d: "Le 28 de ce mois, la chaîne pour enfants Haha Xuandong de Shanghai a diffusé un drame spécial de science-fiction intitulé \"Armor Hero\". L'émission, du producteur aux acteurs en passant par l'équipe de tournage, est entièrement composée de Chinois. C'est le premier drame spécial produit en Chine qui se transforme en héros. Le drame spécial raconte principalement l'histoire de cinq personnes, Xinnan, Beimiao, Dongshan, Xizhao et Kunzhong, protégeant la terre. Leur chemin n'est pas facile. Le cruel et diabolique Empereur des Ombres, également connu sous le nom de Roi des Ombres, était jaloux de la vitalité et de la vigueur de la terre et a envoyé les démons des cinq éléments des Ombres pour envahir. Les pierres d'esprit magiques portées par ces démons des cinq éléments des Ombres ont le pouvoir de noircir et veulent régner sur la terre. C'est ainsi qu'une confrontation entre la lumière et les ténèbres, la justice et le mal se déroule sur la terre. Les cinq adolescents, en tant que messagers de la lumière, ont commencé une bataille avec les hommes envoyés par le Roi des Ombres. Ils se sont battus à mort. Grâce à leur sagesse, leur courage et leur foi inébranlable, ils ont repoussé l'ennemi encore et encore, protégeant la paix et la tranquillité de la terre.\n\nUne fois l'émission diffusée, elle a reçu des critiques élogieuses, et de nombreux enfants espéraient se transformer en héros de l'émission et combattre les ténèbres. Les producteurs ont déclaré que face à un environnement créatif national insuffisant et à des différences culturelles, leur équipe principale, en particulier Wu Weimin, a insisté pour s'enraciner dans la culture chinoise, refusant d'imiter, et créant des héros aux caractéristiques chinoises. Face aux défis du tournage et aux désaccords internes, ils ont insisté sur leurs intentions initiales et ont reçu le soutien du président, espérant créer des héros d'anime qui appartiennent aux Chinois. Armor Hero intègre des éléments chinois tels que \"or, bois, eau, feu, terre\" et le Tai Chi dans la conception des personnages, enracinés dans la culture chinoise, et a créé les propres héros à effets spéciaux de la Chine."
chi_GRnews.41.a: "Armure, combinez !"
chi_GRnews.42: "Armor Hero Xingtian"
chi_GRnews.42.t: "Armor Hero Xingtian est sorti !"
chi_GRnews.42.d: "Pendant les vacances d'hiver du 7 de ce mois, les chaînes pour enfants et les chaînes satellites de toutes les provinces du pays ont diffusé simultanément la suite d'\"Armor Hero\" \"Armor Hero Xingtian\", qui a obtenu des audiences plus élevées grâce à la popularité de l'ancienne œuvre.\n\nSina Entertainment a commenté qu'en ce qui concerne le casting de cette série télévisée, Li Wei, Wu Haoze, Zhang Yanan et d'autres idoles de la nouvelle génération, beaux et distinctifs, ont été invités à se joindre, injectant une atmosphère de jeunesse sans fin dans la nouvelle série d'armures. De plus, la pièce a également introduit les thèmes de la \"richesse de la deuxième génération\" et des \"années 80/90\" qui sont largement préoccupants dans la société moderne. L'intrigue des \"otaku\" et autres a renversé les impressions négatives constantes des gens sur les générations post-80 et post-90, reflétant la poursuite du héroïsme dans la nouvelle ère par les jeunes d'aujourd'hui. Toute la série télévisée est imprégnée d'une croyance positive et juste dans la lutte contre le mal. En tant que nouvelle série de la série \"Armor Hero\", \"Armor Hero Xingtian\" s'appuie sur des cascades magnifiques, des armes et des équipements sophistiqués améliorés, des scènes magnifiques, des intrigues passionnantes, une équipe de production exceptionnelle et une nouvelle génération d'acteurs idoles, ce qui en fait le série d'effets spéciaux en direct la plus attendue cette année."
chi_GRnews.42.a: "Armure, combinez !"
chi_GRnews.43: "Pig Man"
chi_GRnews.43.t: "Pig Man est diffusé !"
chi_GRnews.43.d: "Pendant les vacances d'été ce mois-ci, CCTV et plus de 400 stations de télévision à travers le pays ont diffusé la première partie du dessin animé \"Pig Man\" \"Pig Man : L'ère magique du cochon\". L'histoire se déroule dans la lointaine \"ère du cochon\", une époque où les cochons régnaient sur la terre. À cette époque, de petits animaux ont commencé à exploiter diverses ressources de la terre sans retenue, ce qui a mis toute la terre en désordre et a gravement endommagé l'environnement naturel. Afin de protéger l'environnement et d'inverser la mauvaise situation écologique de la terre, \"Pig Man\" a surmonté de nombreuses difficultés et a finalement développé une \"boule de sagesse magique\" avec un pouvoir mystérieux, mais il est tombé dans une malédiction qui ne lui permettait de se réincarner qu'après trois mille ans et est décédé. Il a quitté le monde. La \"boule de sagesse magique\" a été remise à Wang Xiaoer, qui était chef à l'époque, et il lui a été dit de mener à bien la mission de sauver l'environnement de la terre. Cependant, Wang Xiaoer a rompu sa promesse et a utilisé la \"boule de sagesse magique\" pour créer son propre royaume, ce qui a intensifié les dommages à l'environnement de la terre et a rendu la survie humaine misérable. Où est \"Pig Man\", le messager de la protection de l'environnement et l'incarnation de la justice ? Reviendra-t-il ? À quel genre de long voyage de protection de l'environnement lui et ses amis seront-ils confrontés ? \"Pig Man\" peut-il enfin accomplir sa grande mission de protection de la terre ?\n\nCe petit cochon en vêtements rouges a été bien accueilli, et la série Pig Man deviendra un IP classique dans l'histoire de l'animation chinoise."
chi_GRnews.43.a: "GG Bond !"
chi_GRnews.44: "Romans fantastiques"
chi_GRnews.44.t: "Les romans fantastiques sont entrés dans leur âge d'or !"
chi_GRnews.44.d: "Avec la popularisation d'Internet et la promotion de la lecture mobile, les romans fantastiques deviennent de plus en plus populaires.\n\nLes romans fantastiques sont une tendance qui a émergé en Chine continentale. Ils sont basés sur la fantaisie et vont plus loin que les romans de magie. Ils sont plus libres et ne sont pas liés par une base scientifique. Il y a plus de place pour l'imagination. Huang Yi peut être considéré comme un représentant des romans fantastiques chinois modernes. Le nombre et la variété des romans fantastiques chinois ont longtemps inclus tous ces éléments. L'un des romans de cultivation les plus populaires sur Internet, \"Le voyage de Piao Miao\", déclare d'emblée : \"Vous pourriez voir la continuation de la Chine ancienne, vous pourriez voir une civilisation avancée, vous pourriez voir des armes magiques tentantes, vous pourriez voir les vestiges d'immortels, vous pourriez voir d'anciens châteaux du Moyen-Âge occidental, vous pourriez voir toutes sortes de bêtes étranges. C'est le voyage de Piao Miao. \"La fantaisie est une sorte de fantaisie libre et sans contrainte. La création de romans fantastiques est toujours libre.\n\nPendant cette période, de nombreux \"écrivains fantastiques\" ont émergé – bien qu'eux-mêmes ne reconnaissent pas cette identité – tels que Chen Dong, Chunqing Xilige, Feng Lingtian, Jing Wuhen, Tiancan Tu Dou, Ni Cangtian, Mao Ni, Tang Jia San Shao, Jiang Nan, etc. De plus, il existe d'innombrables excellents écrivains qui créent en silence. À cette époque, les romans fantastiques ont montré une tendance florissante et de concurrence."
chi_GRnews.44.a: "\"Je suis l'Empereur du Ciel, je dois tuer tous les ennemis du monde !\""
chi_GRnews.45: "Fruity Robo"
chi_GRnews.45.t: "Fruity Robo est diffusé !"
chi_GRnews.45.d: "Ce mois-ci, de nombreuses stations de télévision ont diffusé une animation appelée \"Fruity Robo\", qui, comme le populaire \"Pig Man\" précédemment, a été produite par Guangzhou Blue Arc Animation Media Co., Ltd. et réalisée et écrite par Wang Wei. Ce drame est à la fois une suite de \"Jelly Three Musketeers\" et la première saison de la série \"Fruity Robo\". Les noms des trois protagonistes de l'animation, Cheng Liuxiang, Pineapple Blowing Snow et Lu Xiaoguo, sont tous tirés des noms de personnages de romans classiques d'arts martiaux. Il y a beaucoup de références culturelles et de poèmes anciens dans le film, ce qui joue un excellent rôle éducatif dans la joie et cultive la culture des enfants.\n\nCependant, le drame a été accusé par certaines personnes de contenir beaucoup de métaphores politiques, qui sont ironiques et critiques."
chi_GRnews.45.a: "Fruity Robo, retournez à votre position !"
chi_GRnews.46: "Il y a quelque chose qui ne va pas avec ma comédie romantique pour adolescents."
chi_GRnews.46.t: "\"My Teen Romantic Comedy Is Wrong, As I Expected.\" fait un grand succès dans notre pays !\""
chi_GRnews.46.d: "En mars dernier, le roman léger japonais de Watari Watari, \"My Youth Romantic Comedy Is Wrong, As Expected\", est devenu très populaire au Japon, et a été classé en tête du concours d'évaluation \"Ce roman léger est incroyable !\" pendant deux années consécutives. Le roman léger s'est rapidement répandu à Taiwan et en Chine continentale, attirant l'attention de la communauté bidimensionnelle sinophone."
chi_GRnews.46.a: "La jeunesse est un mensonge et un péché"
chi_GRnews.47: "MikuFans"
chi_GRnews.47.t: "Site web MikuFans créé"
chi_GRnews.47.d: "Le 26 juin, un internaute nommé 9bishi a publié un message affirmant qu'il avait passé trois jours à improviser un site web appelé \"MikuFans\" pour résoudre le problème de l'impossibilité de se connecter et de se connecter après le crash du site web Acfan, ce qui a attiré de nombreux membres d'Acfan à l'utiliser. Après que la station Ac ait repris un accès normal, Mikufans, alors connu sous le nom de \"Jardin arrière A\", n'a pas été fermé. Les premiers créateurs et mainteneurs de Mikufans étaient tous issus de la station Ac.\n\nLa naissance de MikuFans est liée à la deuxième dimension et à une nouvelle forme d'interaction vidéo (écran à puces). L'initiateur du site web à puces est le site web japonais niconico."
chi_GRnews.47.a: "On peut voir qu'il est membre des Chevaliers"
chi_GRnews.48: "AcFun"
chi_GRnews.48.t: "Site web AcFun fondé"
chi_GRnews.48.d: "Le 6 juin, un internaute nommé Xilin a annoncé avoir fondé un site web appelé \"AcFun\" pour fournir un site web stable et pratique aux fans de 2D nationaux. La forme de soumission initiale d'AcFun consistait à utiliser le lecteur de Sina pour lier les vidéos de Sina, et même la couverture provenait directement de l'adresse de Sina. Il y a eu 10 soumissions ce jour-là, qui étaient :\nAC 1 : Haruhi Suzumiya ouvrant EVA (voir AC 16185854)\nAC 2 : Fan AMVAC One Piece étranger\n3 : La Danse Passionnée des Trois Sœurs Idolmaster Deuxième Épisode AC\n4 : [Nouveau] Série d'animation Devil May Cry AC\n5 : Vidéo Merveilleuse Monster Hunter Online AC\n6 : Vidéo Créative Nationale : Version Warcraft Transformers AC\n7 : Chef-d'œuvre RPG PS2 \"Persona 3FES\" Merveilleux OPAC\n8 : Vidéo Promotionnelle Chinoise de Final Fantasy Ⅻ Dead Wings AC\n9 : Nouvelle Force Dynamique : Naruto Dix Scènes Inoubliables AC\n10 : [Forte sérialisation] Torture Princess OVA"
chi_GRnews.48.a: "Les fans de bande dessinée du monde entier sont une seule famille"
chi_GRnews.49: "bilibili"
chi_GRnews.49.t: "MikuFans a changé son nom en bilibili"
chi_GRnews.49.d: "Après avoir créé le site web MikuFans en 2009, le fondateur Bishi (Xu Yi) a travaillé dans une société de logiciels financiers après avoir obtenu son diplôme universitaire. Au début, seuls Xu Yi et quelques internautes ont maintenu le site web. Après avoir travaillé pendant plus d'un an, Xu Yi a quitté son emploi et a changé MikuFans en bilibili en 2010. Il dispose d'un système de barrage différent des sites web de barrage vidéo tels que AcFun. Son nom bilibili vient du surnom \"Fille Décharge Bilibili\" de Misaka Mikoto dans les animations populaires \"A Certain Magical Index\" et \"A Certain Scientific Railgun\" à l'époque. Depuis lors, le site web bilibili s'est débarrassé de sa dépendance à l'égard d'AcFun et est devenu un site web relativement indépendant.\n\nAu cours des dix prochaines années, bilibili, en tant que plateforme bidimensionnelle la plus distinctive de Chine, se démarquera et se développera à un niveau que tous les participants initiaux peuvent difficilement imaginer."
chi_GRnews.49.a: "bilibiliCheers-(゜-゜)つロ"
chi_GRnews.50: "Trois Corps"
chi_GRnews.50.t: "\"Science Fiction World\" commence la publication en série de \"Le Problème à Trois Corps\""
chi_GRnews.50.d: "Ce mois-ci, le célèbre magazine de science-fiction Science Fiction World a commencé la publication en série d'un long roman de science-fiction intitulé Le Problème à Trois Corps, écrit par Liu Cixin, un ingénieur en informatique et écrivain de science-fiction qui jouissait déjà d'une certaine réputation. Après la publication de ce numéro du magazine, de nombreux lecteurs ont fait l'éloge de la nouvelle œuvre de Liu Cixin."
chi_GRnews.50.a: "Ingénieur de talent"
chi_GRnews.51: "Les jeunes soldats divins"
chi_GRnews.51.t: "Les jeunes héros de l'armée magique sont diffusés !"
chi_GRnews.51.d: "Le 4 de ce mois, la chaîne pour enfants CCTV, la Galaxie Théâtre, diffusera tous les soirs à 20h30 une animation intitulée \"Les armes magiques\", qui sera rediffusée le lendemain matin à 9h30. Ce film est adapté de la bande dessinée \"Les mystérieuses armes magiques\" créée par Wong Yuk-long. Il raconte l'histoire de l'aventure et de la croissance des soldats magiques dirigés par le jeune Nangong Wentian et ses compagnons qui luttent contre la violence et le mal pour le peuple, et deviennent de petits héros après que le monde soit devenu pacifique à l'issue de la lutte entre le bien et le mal.\n\nLe Quotidien du Peuple a commenté qu'en plus de conserver le rythme et le style lumineux inhérents à Wong Yuk-long, le film ajoute également des couleurs vives et des mouvements de personnages mignons que les enfants aiment dans le style de dessin. Le film raconte une histoire originale sur un petit héros légendaire, intégrant la conscience de la protection de l'environnement et du maintien de l'harmonie écologique sous le thème de l'affection familiale, et exprimant la relation entre les humains et la nature. L'importance du maintien de la dépendance mutuelle et de la confiance entre les créatures dans le monde naturel. \"L'arme magique\" a une intrigue compacte et un design de personnage moderne. En particulier, le film intègre un grand nombre d'éléments d'art cinématographique et de mouvements de caméra réalistes dans l'animation entièrement dessinée à la main, et utilise des logiciels informatiques 3D avancés et des programmes de traitement d'image pour le traitement de l'animation plate, montrant les caractéristiques de dessin uniques et le style de Wong Yuk-long.\n\nCe dessin animé a un taux d'audience élevé et est devenu le dessin animé le plus populaire diffusé sur la chaîne pour enfants CCTV cette année. En plus de sa popularité, une autre caractéristique de ce film est que Hong Kong et Taïwan ont participé à la production. L'auteur original et le producteur sont tous deux de Hong Kong, et la chanson thème \"La lumière des rêves\" est chantée par la célèbre chanteuse taïwanaise Cyndi Wang. Ce film représente également dans une large mesure la bonne coopération et les échanges culturels entre le continent, Hong Kong et Taïwan."
chi_GRnews.51.a: "J'ai du courage et je n'ai pas peur, peu importe si c'est l'hiver ou l'été. Je suis fort et je fais de grands pas, je ne peux pas m'arrêter."
china.65.: "L'influence de Bilibili ne cesse de croître"
china.65.t: "L'influence de Bilibili ne cesse de croître"
china.65.d: "L'influence de Bilibili dans mon pays continue d'augmenter, et il est devenu l'un des plus grands sites web de vidéos en Chine.\n\nBilibili compte 15 sections de contenu, dont l'animation, les séries télévisées, la création nationale, la musique, la danse, les jeux, la connaissance, la vie, le divertissement, les animaux fantômes, la mode et les salles de projection. La vie, le divertissement, les jeux, l'animation et la technologie sont les principales catégories de contenu de Bilibili, et il a ouvert des sections commerciales telles que la diffusion en direct, le centre de jeux et les périphériques. Bilibili devient le principal champ de bataille pour l'apprentissage des jeunes ; selon les données de Bilibili, la diffusion en direct d'apprentissage, qui est appelée #study with me# par les utilisateurs, a été promue comme la catégorie de diffusion en direct la plus longue sur Bilibili ; en 2019, le temps passé par les utilisateurs à apprendre en direct sur Bilibili a dépassé les 2 millions d'heures."
china.65.a: "Bravo Bilibili- (゜-゜)つロ"

