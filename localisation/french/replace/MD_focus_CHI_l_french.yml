chi_crisis.201.t: "L'économie mondiale est attaquée"
chi_crisis.202.a: "Malchance..."
chi_crisis.202.d: "Ratio d'endettement, ratio de levier, ratio de créances douteuses... les problèmes sont ignorés intentionnellement ou non les uns après les autres. Et à ce moment, les gens réalisent une fois de plus leur pouvoir à impacter l'économie. Et il est évident que ce ne sera pas la dernière fois..."
chi_crisis.202.t: "L'économie mondiale est en déclin"
chi_news.93.a: "À noter..."
chi_news.93.b: "La justice prévaudra ! La paix prévaudra !"
chi_news.93.d: "Le matin du 3 septembre 2025, une grande rassemblement commémorant le 80e anniversaire de la victoire de la guerre de résistance du peuple chinois contre l'agression japonaise et de la guerre antifasciste mondiale s'est tenu sur la place Tiananmen à Pékin. Le défilé militaire mettait principalement en vedette de nouveaux équipements de quatrième génération, tels que de nouveaux chars, avions embarqués et chasseurs, organisés par modules de combat pour démontrer les capacités de combat système des systèmes de l'APL. De nouveaux types d'équipements sans pilote intelligents et anti-sans pilote de l'armée de terre, de la marine et de l'armée de l'air ont également été sélectionnés pour le défilé, incluant de nouveaux drones, armes à énergie dirigée et systèmes de brouillage électronique. Des armes et équipements stratégiques avancés, tels que de nouveaux véhicules hypersoniques, systèmes de défense aérienne et antimissile, et missiles stratégiques, ont également été présentés. Le but de ce défilé était de mettre en lumière le statut historique de la guerre de résistance du peuple chinois contre l'agression japonaise en tant que principal champ de bataille oriental de la guerre antifasciste mondiale et sa contribution significative à la victoire de la guerre antifasciste mondiale, de démontrer le rôle pivotal du Parti communiste chinois dans la guerre de résistance contre le Japon, et de démontrer la responsabilité de la Chine à défendre résolument les fruits de la victoire de la Seconde Guerre mondiale et la justice internationale, et à promouvoir activement la construction d'une communauté de destin pour l'humanité."
chi_news.93.t: "Défilé militaire du 80e anniversaire de la victoire de la guerre de résistance contre le Japon"
chi_taiwan.9.a: "Bonne nouvelle !"
chi_taiwan.9.b: "Continuer à intensifier la propagande !"
chi_taiwan.9.d: "Le moral militaire du gouvernement de [TAI.GetLeader] est bas, et certains ont déjà fait défection et rejoint nos forces."
chi_taiwan.9.t: "Les troupes des autorités taïwanaises font défection."
china.20.d: "Le gouvernement chinois a annoncé aujourd'hui qu'il prévoit d'investir dans de multiples projets d'infrastructure dans des pays du monde entier par l'intermédiaire de la Banque asiatique d'investissement dans les infrastructures dans le cadre de son initiative Ceinture et Route. Bien que de nombreux pays en développement aient accueilli favorablement l'annonce, car ils s'attendent à ce que la Chine réalise des investissements nécessaires dans leurs économies, ce qui aidera à accélérer la construction d'infrastructures et l'interconnexion en Asie, à faire face conjointement à la crise financière internationale, à la transformation et à la mise à niveau économique, et à une croissance économique stable, et à accélérer le processus d'intégration économique en Asie, le Japon, l'Inde, les États-Unis et l'Australie ont exprimé des réserves sur l'initiative, estimant qu'il s'agit d'une tentative secrète de la Chine d'étendre son influence à l'étranger, tout comme l'initiative Ceinture et Route."
china.20.t: "La Chine crée la Banque asiatique d'investissement dans les infrastructures"
riben.14.a: "Aucun autre choix que de se rendre."
riben.14.b: "Nous n'abandonnerons jamais !"
riben.14.d: "Avec la plupart de nos villes et la capitale occupées par [CHI.GetName], continuer à résister semble imprudent..."
riben.14.t: "Se rendre ?"
