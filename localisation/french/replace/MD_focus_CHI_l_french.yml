china.4.a: "Renforcer les efforts de régulation à l'avenir sera suffisant."
china.4.b: "Profiter de cette occasion pour établir un système de sécurité alimentaire."
china.4.d: "La nation est indignée par la découverte que des entreprises laitières chinoises ont vendu des produits contaminés par le composé toxique Mélamine ; plus de 300 000 citoyens chinois ont été empoisonnés par le lait et les préparations pour nourrissons contaminés, et 11 pays ont interdit les importations alimentaires chinoises. De hauts responsables de l'industrie et du gouvernement ont été impliqués ; il semble qu'ils étaient pleinement conscients de la teneur en mélamine, que l'Organisation mondiale de la santé a qualifié d'un des plus grands incidents de sécurité alimentaire de l'histoire."
china.4.t: "Scandale du lait"

CHI_A_Shameful_Beginning: "Se souvenir des humiliations historiques"
CHI_A_Shameful_Beginning_desc: "L'agression des pays européens depuis les temps modernes est la raison principale pour laquelle la Chine est tombée dans une crise de survie. Nous ne devons jamais l'oublier."

CHI_Anticolonial_Propaganda: "Propagande anticoloniale"
CHI_Anticolonial_Propaganda_desc: "Bien que le monde occidental ne colonise plus ouvertement d'autres pays, il continue sa colonisation secrète des régions sous-développées. Nous devons exposer leur masque de civilisation."

CHI_Building_Tomorrow_to_Target: "Construire ensemble un avenir meilleur"
CHI_Building_Tomorrow_to_Target_desc: "Après d'innombrables efforts, les relations entre l'Europe et la Chine deviennent de plus en plus étroites. Travaillons ensemble pour construire un nouvel avenir !"

CHI_Developing_European_tourism: "Mettre en œuvre le transit sans visa"
CHI_Developing_European_tourism_desc: "Ces dernières années, notre puissance globale s'est continuellement améliorée, et la politique de transit sans visa permet aux amis européens de comprendre directement les réalisations de la modernisation chinoise au cours des dernières décennies."

CHI_Eliminating_Outdated_Production:0 "Éliminer les capacités de production obsolètes"
CHI_Eliminating_Outdated_Production_desc:0 "Nous ne pouvons plus tolérer les entreprises inefficaces avec une technologie inférieure à la moyenne qui gaspillent les ressources. Nous devons profiter de cette occasion pour les éliminer, réduisant ainsi la pression sur les ressources et l'environnement et favorisant la mise à niveau industrielle."

CHI_Emphasis_Eastern_Europe: "Mettre l'accent sur l'Europe de l'Est"
CHI_Emphasis_Eastern_Europe_desc: "L'Europe compte de nombreux pays, nous devons donc choisir une région clé. Historiquement, de nombreux pays d'Europe de l'Est ont entretenu de bonnes relations avec nous, ce qui vaut la peine de cultiver notre influence dans cette région."

CHI_Emphasis_Southern_Europe: "Mettre l'accent sur l'Europe du Sud"
CHI_Emphasis_Southern_Europe_desc: "L'Europe compte de nombreux pays, nous devons donc choisir une région clé. Divers conflits et contradictions sont très courants en Europe du Sud. Maintenir la stabilité locale et propager activement notre influence est un choix qui présente à la fois des opportunités et des défis."

CHI_Emphasis_Western_Europe: "Mettre l'accent sur l'Europe de l'Ouest"
CHI_Emphasis_Western_Europe_desc: "L'Europe compte de nombreux pays, nous devons donc choisir une région clé. Les États-Unis exercent une influence significative en Europe de l'Ouest, et nous devons trouver des moyens de contrer cette force pour affaiblir l'hégémonie américaine."

CHI_European_Advanced_technology_cooperation: "Coopération dans les technologies de pointe"
CHI_European_Advanced_technology_cooperation_desc: "Dans divers domaines de technologies de pointe, les pays européens manquent souvent de l'échelle nécessaire pour soutenir indépendamment le développement de ces technologies. Nous pouvons tirer parti de notre part de marché en échange d'une coopération dans ces domaines."

CHI_European_Crimes: "Jugement des crimes européens"
CHI_European_Crimes_desc: "Les nations européennes doivent reconnaître les crimes coloniaux qu'elles ont commis contre la Chine, et en réalité contre la grande majorité des pays d'Asie, d'Afrique et d'Amérique latine, et en payer le vrai prix !"

CHI_European_Diplomacy: "Regarder vers l'Europe"
CHI_European_Diplomacy_desc: "L'Europe est une source importante de puissance multipolaire dans la communauté internationale d'aujourd'hui, et maintenir de bonnes relations avec eux tout en promouvant activement la coopération est essentiel."

CHI_European_Signing_trade_agreement: "Accord de coopération commerciale et économique"
CHI_European_Signing_trade_agreement_desc: "Compte tenu de notre excellente réputation en Europe et de la qualité supérieure des produits fabriqués en Chine, nous avons pu signer une série d'accords amicaux de coopération commerciale et économique localement."

CHI_European_cultural_exchange: "Échanges culturels Chine-Europe"
CHI_European_cultural_exchange_desc: "Alors que nous promouvons activement notre culture à l'extérieur, de plus en plus de personnes dans les pays européens deviennent curieuses de notre terre. Nous organiserons un grand festival culturel pour promouvoir l'excellente culture de la civilisation chinoise."

CHI_Expanding_Island_South_China_Sea: "Extension des installations sur les îles"
CHI_Expanding_Island_South_China_Sea_desc: "Les conditions naturelles des îles en mer de Chine méridionale étaient extrêmement difficiles. Grâce aux avancées de l'industrialisation, nous sommes désormais en mesure de changer cette situation."

CHI_Expanding_Market_to_Target: "Expansion sur le marché européen"
CHI_Expanding_Market_to_Target_desc: "Nos usines produisent des produits de haute qualité et à bas prix en grandes quantités. Nous pensons qu'il ne faudra pas longtemps avant que l'Europe ne devienne dépendante des produits « Made in China »."

CHI_Far_East_Infrastructure: "Infrastructures de l'Extrême-Orient"
CHI_Far_East_Infrastructure_desc: "L'immense potentiel de cette terre reste largement inexploité. Notre première étape est de construire de meilleures routes."

CHI_Far_East_Resource_Extraction: "Extraction de ressources en Extrême-Orient"
CHI_Far_East_Resource_Extraction_desc: "Avec les problèmes de communication résolus dans cette région, la prochaine étape est d'élargir les investissements dans l'extraction de ressources."

CHI_Far_East_Resource_Extraction_tt: "Les effets augmentent avec les types de ressources locaux et le niveau de recherche technologique"

CHI_Final_Energy_Solution: "§YSolution énergétique finale§!"
CHI_Final_Energy_Solution_desc: "Le potentiel de production d'énergie de la fusion nucléaire est illimité, suffisant pour soutenir l'expansion massive de notre échelle industrielle, et constitue sans aucun doute la solution énergétique finale."

CHI_Increase_investment_in_ASEAN: "Augmenter les investissements dans l'ASEAN"
CHI_Increase_investment_in_ASEAN_desc: "Nous augmenterons les investissements dans les pays de l'ASEAN pour développer leurs économies locales, ce qui est nécessaire pour démontrer notre bonne volonté en matière de coopération."

CHI_JAP_apologize_crime: "Faire face à l'histoire au Japon"
CHI_JAP_apologize_crime_desc: "Historiquement, le Japon a apporté des catastrophes terribles à la nation chinoise. Nous devrions exiger que le Japon considère l'histoire correctement, plutôt que de continuer son comportement erroné passé de distorsion de l'histoire. Cela peut aussi tester s'ils aiment vraiment la paix."

CHI_Keep_up_good_work: "Continuer nos efforts"
CHI_Keep_up_good_work_desc: "La lutte contre la criminalité organisée est une tâche à long terme. Nous devons toujours rester vigilants, normaliser et populariser la répression de la criminalité organisée, et ne jamais permettre que nos efforts soient gaspillés à un moment crucial."

CHI_Maintaining_Mongolia_independence: "Maintenir l'indépendance de la Mongolie extérieure"
CHI_Maintaining_Mongolia_independence_desc: "La Mongolie extérieure est indépendante depuis des décennies. Nous ne pouvons ignorer le risque de conflit militaire avec le nord et devrions continuer à maintenir le statu quo de la région comme zone tampon."

CHI_Mongolia_joins_the_SCO: "Expansion de l'OCS"
CHI_Mongolia_joins_the_SCO_desc: "La coopération avec la Mongolie a été très réussie, et l'objectif de l'OCS est de maintenir la stabilité régionale et de promouvoir le développement de ses membres, ce qui signifie que l'expansion supplémentaire de l'OCS est une progression naturelle."

CHI_Mongolian_Mineral_Rights: "Droits miniers mongols"
CHI_Mongolian_Mineral_Rights_desc: "Nous fournirons un soutien économique et une aide pour résoudre les problèmes environnementaux en échange du droit d'utiliser les ressources locales en Mongolie, ce qui est une situation gagnant-gagnant pour les deux parties."

CHI_Opening_Tourism_to_Taiwan: "Assouplir les restrictions sur le tourisme vers Taïwan"
CHI_Opening_Tourism_to_Taiwan_desc: "Nous ouvrirons progressivement les voyages libres pour les résidents vers Taïwan afin d'approfondir les échanges culturels entre les deux rives du détroit de Taïwan."

CHI_Prosperous_Far_East: "Un Extrême-Orient prospère"
CHI_Prosperous_Far_East_desc: "Il a été prouvé que même après être restée si longtemps hors de notre contrôle, cette terre peut encore être une société florissante et prospère !"

CHI_Questioning_Treaty_of_Aigun: "Remettre en question le traité d'Aigun"
CHI_Questioning_Treaty_of_Aigun_desc: "Le gouvernement corrompu et incompétent des Qing a été contraint de signer le traité d'Aigun en 1858, établissant la domination de la Russie tsariste en Extrême-Orient. Cependant, il s'agissait clairement d'un traité inégal. Avec la montée de notre force militaire et de notre statut international, le traité d'Aigun doit être aboli, et la Mandchourie extérieure doit être restituée !"

CHI_Seize_Right_to_Speak: "Saisir le droit de parole"
CHI_Seize_Right_to_Speak_desc: "La communauté internationale est encore pleine d'une adoration aveugle de l'Europe, présentant une rare opportunité de résoudre les problèmes après l'effondrement de l'hégémonie américaine."

CHI_Skynet: "Système Skynet"
CHI_Skynet_desc: "Maintenir la sécurité des citoyens est notre responsabilité première. Le système Skynet réunira un vaste réseau de caméras pour surveiller et identifier les suspects criminels tentant de se cacher, les laissant sans nulle part où se cacher, peu importe où ils sont."

CHI_State_Rocket_Research: "Développement des lanceurs"
CHI_State_Rocket_Research_desc: ""

CHI_State_Satellite_Research: "Développement des charges utiles satellites"
CHI_State_Satellite_Research_desc: ""

CHI_Strengthen_patrols_South_China_Sea: "Patrouilles de routine en mer de Chine méridionale"
CHI_Strengthen_patrols_South_China_Sea_desc: "La mer de Chine méridionale est une partie inséparable de la Chine. Par le passé, notre marine était trop faible pour patrouiller cette zone, mais maintenant c'est différent."

CHI_Support_Sikkim_Independence: "Soutenir l'indépendance du Sikkim"
CHI_Support_Sikkim_Independence_desc: "Le royaume du Sikkim a été illégalement annexé par l'Inde en 1975. Maintenant, notre guerre contre l'Inde se déroule très bien. Nous devrions les aider à obtenir leur indépendance de l'Inde et leur fournir une assistance pour contrer l'Inde."

CHI_Talent_Exchange_to_Target: "Promouvoir l'échange de talents"
CHI_Talent_Exchange_to_Target_desc: "Une nation ne peut être construite sans talents, surtout des talents hautement qualifiés. Un bon environnement éducatif et de larges opportunités d'emploi devraient attirer de nombreux talents européens à s'installer en Chine."

CHI_The_Fourteenth_Five_Year_Plan: "Le quatorzième plan quinquennal"
CHI_The_Fourteenth_Five_Year_Plan_desc: "Le 11 mars 2021, la quatrième session du 13e Congrès national du peuple a adopté la Résolution sur le 14e plan quinquennal pour le développement économique et social national et le Plan à long terme jusqu'en 2035. Les principaux objectifs pour le développement économique et social pendant cette période sont : de nouvelles réalisations dans le développement économique ; de nouveaux progrès dans la réforme et l'ouverture ; de nouvelles améliorations dans le niveau de civilisation sociale ; de nouveaux progrès dans la construction de la civilisation écologique ; de nouveaux niveaux de bien-être du peuple ; et de nouvelles améliorations dans l'efficacité de la gouvernance nationale."

CHI_decrease_EU_eurosceptic: "Réconcilier les conflits internes en Europe"
CHI_decrease_EU_eurosceptic_desc: "Comme il s'avère, les pays européens sont bien plus similaires que différents, et après que nous ayons activement coordonné et résolu les conflits internes en Europe, plus d'Européens croiront que l'intégration européenne est la bonne voie."

CHI_dialogue_based_on_strength: "Diplomatie basée sur la force"
CHI_dialogue_based_on_strength_desc: "Ces dernières années, notre armée a fait des progrès rapides, et sa force militaire actuelle n'est pas inférieure à celle de ce soi-disant hégémon mondial. Cependant, ils vivent encore dans l'ancienne ère. Il est temps de leur donner un bon réveil."

