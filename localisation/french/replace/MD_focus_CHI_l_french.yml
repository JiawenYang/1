chi_GR.0: "Conseils de jeu"
chi_GR.0.t: "Millennium Dawn : Guide de jeu Grande Renaissance"
chi_GR.0.d: "Merci d'avoir joué à ce mod. Ce mod n'ajoute pas trop de nouveaux mécanismes basés sur la version originale de Millennium Dawn. Si vous souhaitez améliorer l'expérience de jeu, veuillez faire attention aux points suivants/problèmes courants ci-dessous : 1. La version originale de Millennium Dawn dispose d'un \"système énergétique\" qui consomme constamment du carburant pour maintenir le fonctionnement énergétique et la production. Un grand pays comme la Chine doit importer du pétrole en continu au début. Veuillez vous assurer que le pétrole dans le réservoir de stockage ne revient pas à zéro, sinon cela entraînera d'énormes pénalités. 2. Certaines politiques nationales de ce mod doivent être sélectionnées en fonction de l'heure réelle. Veuillez faire attention à l'heure. Historiquement, le président Hu Jintao a pris ses fonctions en 2003 et le président Xi Jinping en 2013. 3. La Chine dans \"Coexistence pacifique\" L'esprit national a été réglé pour ne pas déclarer la guerre activement, mais vous pouvez déclarer la guerre par le biais de politiques nationales et de résolutions dans le jeu. 4. Le système de pensée sociale chinois apportera différents effets selon le soutien de différents groupes de personnes, et sera mis à jour une fois par mois. 5. Le système de jeu sino-américain affectera les pays du monde entier, apportant différents types d'effets selon leur côté ou leur neutralité, puis accordant différents degrés de bonus selon l'influence de la Chine et des États-Unis. 6. Au début, vous pouvez activer la résolution de renforcement national dans l'interface des règles personnalisées. Ce mod est toujours en cours de développement, en particulier la chaîne d'événements et le système de relations internationales. Si vous avez des idées ou rencontrez des bugs, veuillez laisser un message dans la zone de discussion de l'atelier de création."
chi_GR.0.a: "Je sais"
chi_GR.0.b: "Je veux quelque chose de différent"
chi_GR.1: "Le premier jour du millénaire"
chi_GR.1.t: "Le premier jour du millénaire"
chi_GR.1.d: "Xiaoyun, comment vas-tu récemment. À strictement parler, le 1er janvier 2001 est le premier jour du millénaire. Cependant, tout le monde pense que le 1er janvier 2000 est le millénaire, et de nombreuses célébrations ont effectivement eu lieu. Si tu évoques maintenant l'idée que \"le millénaire ne sera pas avant l'année prochaine\", tu ne seras probablement considéré que comme un trouble-fête et un excentrique qui aime ergoter, alors traitons-le simplement comme le millénaire maintenant. Récemment, j'ai entendu une conférence de personnes qui croient en Jésus, disant que le millénaire est lié à leur doctrine. C'est vraiment étrange. Dans la doctrine chrétienne, le millénaire est une ère de grande paix et de prospérité, mais en réalité, il y a des guerres partout - des guerres civiles en Afghanistan et au Népal, à la guerre de libération en Angola, à la mêlée des seigneurs de guerre au Congo et au Myanmar - il n'y a aucun signe de grande paix. Mais la grande prospérité a prouvé que les rues de New York et de Tokyo sont bondées de circulation, et les usines de Shenzhen et de Guangzhou sont pleines de chaînes de montage. Même sur la ligne de front de la guerre froide, la frontière entre la Corée du Nord et la Corée du Sud, il n'y a que les échos de la radio et la musique pop du sud. Je fais maintenant du travail communautaire ici. En termes simples, je m'occupe de quelques vieux hommes et femmes de la ville. Ce n'est pas fatigant, mais ce n'est certainement pas facile. En tout cas, j'espère que tout va bien pour toi. C'est le premier e-mail que j'écris depuis mon arrivée à Pékin. Tu devrais en avoir écrit beaucoup à l'école. Je vais bien à Pékin. Sauf pour le vent fort en hiver et le sable jaune au printemps, tout le reste va bien. J'ai entendu dire que le rock est très populaire à Pékin, mais je ne suis pas habitué à une musique aussi forte. C'est bien mieux ici que dans ma ville natale ! N'oublie pas de ramener quelques spécialités de Shenzhen pour le Nouvel An chinois cette année. Je mettrai plus dans ton enveloppe rouge. Mais il semble qu'il n'y ait rien qui puisse être appelé une spécialité là-bas... Bref, tu dois étudier sérieusement. Je crois que tu peux être admis dans une bonne université. C'est mieux pour les filles d'étudier davantage."
chi_GR.1.a: "Frère idiot, 1er janvier 2000"
chi_bush.1: "Lettre de George W. Bush"
chi_bush.1.t: "Lettre de George W. Bush"
chi_bush.1.d: "Lorsque le président eut fini de lire la lettre des États-Unis, qu'il avait été contraint de réviser cinq fois, il ne put s'empêcher de jurer à voix haute. \"Les Américains sans vergogne sont toujours dans ce style. À quoi bon dire \"très désolé\" ? Ils ne peuvent pas trouver nos gens même s'ils continuent à parler !\" \"C'est la seule excuse que Washington et le président Bush peuvent accepter\", a déclaré le ministre des Affaires étrangères Tang Jiaxuan au président avec un visage sérieux. \"J'ai sévèrement réprimandé les Américains la dernière fois que je suis allé au Chili, et ils ont rapidement cédé. Si je les réprimande à nouveau lorsque j'irai dans un pays la prochaine fois, ils pourraient céder à nouveau\", a souri amèrement le président, \"Même s'ils cèdent, à quoi ça sert ? C'est pourquoi j'ai dit que nous ne pouvions pas laisser les gens se moquer de nous. Cette fois, nous avons vraiment laissé les pays étrangers se moquer de nous. Les Américains aiment vraiment semer le trouble lorsque leur avion a été abattu dans leurs propres eaux par les États-Unis.\" Face au pays de l'autre côté de l'océan, le président se sentait impuissant, et ressentait en même temps de la douleur face au manque de force militaire et diplomatique suffisante de la Chine, et ne put s'empêcher de soupirer. \"Notre marine et notre force aérienne sont si pauvres que nous ne pouvons pas assurer la sécurité nationale. Si les Américains amènent un porte-avions, nous n'aurons aucun moyen. Si nous avions aussi un porte-avions, plein d'avions, les Américains oseraient-ils attaquer nos gens ?\" Le ministre des Affaires étrangères Tang a fait une pause et a regardé le président d'un air hésitant : \"Les négociations du côté turc se déroulent bien, et on s'attend à ce que le navire soit bientôt libéré.\" Après avoir entendu cela, le président a déclaré : \"Tant qu'il peut être ramené au pays, il s'écrasera et rugira, et il sera modifié à tout prix ! Nous avons attendu trop longtemps le jour où nous aurons un porte-avions !\" Le ministre des Affaires étrangères a hoché la tête : \"Pour les Américains, les porte-avions sont le véritable capital de la diplomatie, et seuls les pays qui détiennent des porte-avions sont qualifiés pour négocier. Mais pour l'instant, nous devons quand même répondre à cette lettre d'excuses qui a été révisée cinq fois, sinon les relations pourraient être pires.\" Le président a soupiré et est resté silencieux pendant plusieurs dizaines de secondes."
chi_bush.1.a: "C'est la seule solution pour l'instant"
chi_wto.1: "Tu ne peux pas me frapper ?"
chi_wto.1.t: "Tu ne peux pas me frapper ?"
chi_wto.1.d: "Qu'est-ce que tu viens de dire ? Tu ne peux pas me frapper ? Quel genre de chose ne peut pas me frapper et me donner un coup de pied ?" Ce n'est pas le premier résident de la communauté qui pose la même question. Liu Changjun a dû répondre à des questions similaires d'innombrables fois chaque jour au cours des trois derniers jours. \"Oncle, ce n'est pas quelque chose qui peut me frapper. C'est un mot étranger. En chinois, c'est l'\"Organisation mondiale du commerce\", qui sert à faire des affaires avec les étrangers !\" \"Oh, alors c'est pour faire des affaires. Mais qu'est-ce que cette chose a à voir avec nous ? Aucun de nos voisins ne fait d'affaires avec les étrangers, n'est-ce pas ? Tu n'es pas là pour vendre des produits étrangers, n'est-ce pas ? N'achète pas, n'achète pas !\" Liu Changjun a rapidement installé le panneau d'affichage et a tourné le slogan vers l'oncle. \"Oncle, ne pars pas. Je ne vends pas. Je suis ici pour vulgariser les connaissances dans notre communauté. Regarde mon gilet rouge. Regarde, il y a un emblème du parti ici. Comment un membre du parti peut-il venir ici pour vendre des choses ?\" Liu Changjun a pointé du doigt les mots sur le panneau d'affichage : \"Regarde, la Chine vient de rejoindre l'Organisation mondiale du commerce, et les produits étrangers vont bientôt remplir nos rayons. Une fois que ces choses étrangères seront arrivées, les prix des logements baisseront, et il sera facile pour tes enfants d'acheter des maisons à l'avenir ! Les factures de téléphone, les bips, les médicaments, les voitures... tout cela verra son prix réduit, et nos vies deviendront de plus en plus confortables ! De plus, nous pouvons ouvrir plus d'usines, permettre à plus de jeunes hommes et filles d'avoir du travail, vendre les produits qu'ils fabriquent à l'étranger, et gagner de l'argent étranger, afin que notre pays devienne de plus en plus riche !\" \"Y a-t-il vraiment autant d'avantages ? Pourquoi ai-je toujours l'impression que tu mens... Mais les membres du parti ne devraient pas dire n'importe quoi, n'est-ce pas ? Hé, camarade, ne pars pas d'abord, donne-moi une copie du prospectus, pour que je puisse retourner étudier avec ma femme comment postuler pour rejoindre cette \"Da Bu Liu Kick Me\", et je viendrai te voir après avoir étudié. Que l'argent de cet étranger botte les fesses de notre fils !\" Liu Changjun était un peu gêné. Il est vrai qu'il est difficile de faire du travail de masse, mais après quelques jours, il a ressenti le poids de la réalité. En regardant le dos du vieil homme qui partait joyeusement, il a eu un sentiment indescriptible. Cependant, pour le travail de propagande, tant que l'effet est atteint, peut-être que le processus n'est pas si important ?..."
chi_wto.1.a: "J'espère vraiment que Xiaoyun pourra en apprendre davantage sur \"Da Bu Liu Kick Me\" à Shenzhen"
chi_GR.2: "Modérément prospère"
chi_GR.2.t: "Modérément prospère"
chi_GR.2.d: "Lorsque l'enseignant a appelé son nom, Liu Changyun n'a pu s'empêcher de sentir son cœur battre même si elle s'était préparée mentalement. \"Nous venons d'apprendre le Grand Dao et la Grande Harmonie du monde. En fait, il y a une seconde moitié à cet ancien texte, qui ne parle pas de la Grande Harmonie, mais du mot 'aisance' que nous entendons souvent\", L'enseignant a posé ses yeux sur Liu Changyun, \"Xiao Liu, que penses-tu que signifie l'aisance ?\" \"Maître, je suppose... l'aisance signifie une vie relativement stable... n'est-ce pas ?\" Liu Changyun a bégayé. \"Oui, et non. Les anciens considéraient Xiaokang comme une meilleure société d'un niveau inférieur à la Société Datong. Comme nous l'avons appris précédemment, la Société Datong est une société où le monde est pour le public, tandis que la Société Xiaokang est une société où le monde est pour la famille. Le monde Xiaokang est une société où \"chacun aime ses propres proches, chacun aime ses propres enfants, et ses biens et sa force sont pour lui-même\", \"les rituels et la justice sont utilisés comme règles, pour corriger le monarque et les ministres, pour être loyaux envers les pères et les fils, pour être harmonieux avec les frères, pour être harmonieux avec les maris et les femmes, pour établir des systèmes, pour établir des champs, pour être vertueux, courageux et compétent, et pour s'attribuer le mérite de ses réalisations\". Chacun fait son propre travail et vit sa propre vie. Tu peux penser que cela semble si égoïste, mais pense-y, un monde où le monde est pour le public est encore impossible maintenant, sans parler de milliers d'années auparavant dans les temps anciens. Les anciens le savaient aussi, alors ils espéraient construire une société où chacun est content de sa place et chacun fait son propre travail, ce qui est toujours mieux que la réalité de la guerre ou des impôts lourds. \"L'enseignant a regardé à nouveau Liu Changyun, \"La définition de Xiao Liu d'une vie relativement stable est en fait très précise. Ce n'est que lorsque tout le monde peut bien vivre que nous pouvons construire une société harmonieuse et stable. Ne dit-on pas que nous devrions construire une société Xiaokang maintenant ? Quand tu seras grande et que tu auras obtenu ton diplôme, ce sera le moment où une société aisée sera construite. Quelle belle société ce sera alors...\" L'enseignant a regardé par la fenêtre. Le ciel dehors était mi-nuageux mi-ensoleillé, ce qui était un temps rare à Shenzhen. Pour Liu Changyun, elle ne comprenait pas très bien à quoi ressemblerait la société aisée que l'enseignant envisageait, mais elle en avait une idée vague -"
chi_GR.2.a: "Probablement mieux que maintenant"
chi_GR.3: "Grande renaissance"
chi_GR.3.t: "Pièces"
chi_GR.3.d: "La chaîne d'assemblage ronronne, et Ah Shun se concentre sur l'ajustement des pièces de traitement qui sont continuellement envoyées. Il a obtenu son diplôme d'un lycée professionnel il y a quelques mois et a trouvé ce travail dans une usine d'électronique. Le salaire ici n'est pas élevé, mais l'usine fournit des repas et un logement uniformes et bon marché, et Li Cheng lui-même ne dépense pas beaucoup d'argent. Après le salaire mensuel réglé, en plus de la partie renvoyée dans sa ville natale, il reste encore beaucoup. Les gens disent qu'il a eu de la chance, disant que le pays a rejoint une organisation il y a quelque temps, et que diverses usines à Shenzhen ont poussé comme des champignons après la pluie. Il ne comprend pas ces choses, mais il pense juste que ce travail est très fatigant, mais heureusement il gagne beaucoup. \"Frère Shun, allons au cybercafé d'à côté après le travail. J'ai entendu dire que la nouvelle administratrice réseau est une jolie fille, régale tes yeux !\" Xiaolin, un travailleur assis à côté de lui, s'est approché et a dit. \"Écoute, je suis si fatigué aujourd'hui. Je retourne au dortoir dormir après le travail.\" En fait, ce n'est pas qu'Ah Shun ne voulait pas y aller, mais parce que chaque fois qu'il allait au cybercafé, il devait dépenser beaucoup d'argent. Même l'eau y coûte plusieurs yuans, et les nouilles instantanées sont également très chères. \"Tête morte ! Si tu ne veux pas regarder, alors ne regarde pas. J'irai tout seul. Oh, oui, Wang Xiaomei de l'atelier d'à côté te fixait avant d'aller travailler aujourd'hui. Je pense qu'il se passe quelque chose !\" \"Fous le camp ! Fais ton travail, espèce de pauvre !\" Ah Shun a repoussé Xiao Lin, en fait pour couvrir son visage rouge. Lui et Wang Xiaomei sont secrètement amoureux depuis plusieurs semaines. Il voulait le cacher aux autres, mais il ne s'attendait pas à ce que cela soit révélé si tôt. Bien que Xiaomei ne se soucie pas que Li Cheng soit un pauvre gars, Ah Shun voulait quand même gagner assez d'argent pour acheter une maison dans le comté de sa ville natale dès que possible, afin qu'ils puissent avoir un endroit où vivre en ville. Chaque fois que Xiaomei l'interrogeait sur ses projets d'avenir, il se sentait excité dans son cœur, comme s'il était sur le point d'acheter une maison. Ah Shun a souri secrètement en traitant la carte électrique."
chi_GR.3.a: "Tant que vous êtes prêt à travailler dur, vous pouvez réussir"
chi_GR.4: "Itinéraire du Président"
chi_GR.4.t: "Itinéraire du Président"
chi_GR.4.d: "Le président a quitté la salle de conférence peu après la réunion, pas pour autre chose, juste parce qu'il était trop fatigué. Après le décès du camarade Xiaoping il y a quelques années, le président est devenu la personne la plus respectée au sein du parti, et toutes les affaires, bonnes ou mauvaises, lui parvenaient. Le président est respecté comme un aîné, et ce titre est plein du respect et de l'amour du peuple pour lui. Cependant, il est bien un vieil homme de plus de 70 ans, et sa force physique et son énergie ne sont plus aussi bonnes qu'à sa jeunesse. Après avoir quitté la salle de conférence, il voulait juste monter dans la voiture et dormir un peu. Le Premier ministre Zhu Rongji l'a rapidement rattrapé par derrière. Bien que le Premier ministre du Conseil d'État ait à peu près le même âge que le président, il est toujours énergique et peut répondre aux questions couramment et sans laisser échapper une goutte d'eau lors de diverses séances de questions-réponses et conférences de presse. Après que le Premier ministre Zhu ait rattrapé le président, il lui a chuchoté : \"Je n'irai pas à la prochaine réunion, je retournerai à ma résidence.\" Le président s'est tourné de côté et a regardé le Premier ministre, qui a hoché la tête et a dit : \"Le programme a été modifié, et je peux me libérer.\" \"Ça n'ira pas. Comment peut-on changer ça comme ça ?\" Le président a secoué la tête. \"Je te dis, certaines choses ont été faites d'innombrables fois après la première. Si tu peux le changer aujourd'hui, pourras-tu le changer à l'avenir ? Si les dirigeants donnent l'exemple, d'autres camarades apprendront à changer à l'avenir, et je ne pourrai rien leur dire. Tu dois aller à la réunion d'aujourd'hui, ahem--\" Le président a parlé trop vite et s'est étouffé, puis a rapidement sorti de la porte du bâtiment et est monté dans la voiture. \"Je te dis, au nouveau siècle, nous devons montrer un nouvel esprit, pour ne pas laisser ces étrangers se moquer de nous, les vieux, à nouveau. J'ai quelques plans plus tard, tu devrais les préparer pour que les gens d'en bas les fassent.\" Le président a souri au Premier ministre à travers la fenêtre de la voiture, puis a remonté la fenêtre. Le Premier ministre Zhu Rongji a vu qu'il ne pouvait pas continuer à le persuader, il n'a donc pu que se rendre à la voiture derrière et s'asseoir. Le soir, le cortège a roulé lentement et régulièrement dans la ville pleine de banderoles. Le soleil couchant avait disparu derrière les bâtiments de Pékin, remplacé par d'innombrables milliers de foyers allumés. Il y avait beaucoup plus de gens qui rentraient du travail dans les rues, et il y avait aussi des familles qui se promenaient après le dîner. Le Premier ministre a regardé les piétons dans la rue et s'est progressivement endormi."
chi_GR.4.a: "Cela vaut la peine d'être protégé"
chi_GR.5: "Voler"
chi_GR.5.t: "Voler"
chi_GR.5.d: "Le soleil se couche, et avec la nuit vient le bruit des combats. \"Rends ton argent, espèce de salaud ! Je vais te hacher, tu crois ou non !\" L'homme à la chemise fleurie a crié vicieusement en donnant des coups de pied à l'homme recroquevillé dans le coin. Derrière lui se tenaient cinq ou six personnes en vêtements fantaisistes, riant. \"Frère, frère, je t'en prie, je n'ai vraiment pas d'argent, et je ne serai pas payé avant la semaine prochaine ! Frère, laisse-moi partir, frère, je t'en prie vraiment...\" Avant qu'il ne puisse finir ses mots, l'homme dans le coin a reçu un coup de pied au menton par l'homme à la chemise, et du sang a immédiatement coulé de sa bouche. \"De quoi tu parles, espèce de salaud, tu portes de si beaux vêtements et tu dis toujours que tu n'as pas d'argent, tu fais semblant pour moi ?! D'accord, d'accord, ce serait ignorant si je ne te retirais pas quelques pièces. \"L'homme à la chemise a ramassé un long bâton sur le côté et l'a balancé fort sur l'homme. Des cris ont suivi. \"Frère Bâton, arrête de me frapper. Frère Jing semble être là !\" Un homme derrière lui a tapoté l'homme à la chemise sur l'épaule. \"Merde, quel salaud a informé Frère Jing.\" L'homme à la chemise a crié aux personnes derrière lui, puis s'est retourné et a craché sur les personnes dans le coin. \"Quelle putain de déception, ces chiens de garde sont toujours aussi dévoués après le travail, ce sont vraiment un groupe de bons chiens. Allons-y.\" L'homme à la chemise a de nouveau donné un coup de pied à l'homme et est parti avec quelques acolytes. Le rugissement de plusieurs moteurs de moto a immédiatement disparu dans le ciel de la ville avec les acclamations et les cris. Lorsque la police et les passants qui ont appelé la police se sont précipités vers l'homme, celui-ci avait déjà cessé de respirer, tenant une petite boîte dans sa main, qui contenait une montre pour femme exquise."
chi_GR.5.a: "Joyeux anniversaire, ma chère fille"
chi_GR.6: "Jeunes"
chi_GR.6.t: "Jeunes"
chi_GR.6.d: "Hu Jintao fixait l'avant de l'énorme bâtiment de marbre, grand et solennel. C'est le Grand Palais du Peuple, où toutes les plus grandes décisions de la Chine sont annoncées, et l'emblème national brille sur son sommet. De hautes colonnes de marbre se dressent devant la porte. Hu Jintao est entré dans ce bâtiment d'innombrables fois auparavant, mais cette fois, il a eu l'impression d'être à Pékin pour la première fois. Le bâtiment lui-même est l'incarnation d'une volonté ancienne et noble, et c'est aussi un monument vivant. La statue du président Mao sur la porte de Tian'anmen observe tranquillement tout ce qui s'est passé ici pendant des décennies. Hu Jintao semblait être retourné à l'époque où il travaillait à la Ligue de la jeunesse communiste, période pendant laquelle sa jeunesse et son énergie brûlaient, dédiées à la cause du Parti communiste chinois. Hu Jintao a un jour prêté un serment solennel dans ce bâtiment, tout comme d'innombrables autres. Il s'est souvenu de ceux qui ont prêté serment avec lui à ce moment-là. Il n'avait aucun souvenir de la plupart d'entre eux, et certaines des personnes les plus familières avaient disparu. Ici, il a promis de consacrer sa vie à la noble cause et d'assumer les responsabilités que tout membre du Parti communiste doit porter. Il a été un jour appelé \"jeune homme\" par de nombreuses personnes. Maintenant, cet ancien jeune homme a la soixantaine et sa santé et son énergie ne sont plus aussi bonnes qu'avant. Parfois, il se demande : quelle est la raison d'en arriver là. Mais quoi qu'il en soit, il doit faire ce qu'il a autrefois juré de faire, peu importe où il se trouve. En parcourant les archives tard dans la nuit, il a remarqué une silhouette qui bruissait dans le hall vide à l'extérieur. C'était une femme de ménage, portant des vêtements de travail et répétant le geste mécanique de passer la serpillière d'avant en arrière. Hu Jintao a regardé sa silhouette et a soudain eu un sentiment étrange. Cette personne était comme lui quand il était jeune, faisant souvent un travail inconnu et négligé dans des endroits déserts, vivant tranquillement comme d'innombrables autres personnes dans cette société. Une classe qui ne peut jamais être intégrée, ne peut jamais voir la beauté du monde, mais s'efforce juste de vivre au présent pour survivre demain. Cela peut-il conduire à la prospérité nationale et au renouveau national ? Si on lui donnait la même opportunité et la même éducation, peut-être qu'il pourrait aussi devenir ingénieur, astronaute, une personne qui apporte de plus grandes contributions à la société. Cependant, cet homme d'âge moyen qui semble avoir la cinquantaine semble avoir été un collègue ici avec ces documents sombres toute sa vie, et répétera le même travail ici chaque jour à l'avenir. Hu Jintao a silencieusement remis les documents sur l'étagère. Quand il est parti, il a été salué par la vieille femme de ménage, qui lui a tapoté l'épaule et lui a donné un mouchoir pour essuyer sa sueur. Sous les yeux surpris de la femme de ménage, Hu Jintao est sorti de la salle des archives. Maintenant, il a plus de détermination dans son cœur - il doit faire en sorte que les gens de cette terre vivent mieux. Il a senti la lumière de la lune et la brise dans la cour, écoutant la voix de sa jeunesse,"
chi_GR.6.a: "Ça peut être comme un jeune garçon"
chi_GR.7: "Lumière verte sur le plateau"
chi_GR.7.t: "Lumière verte sur le plateau"
chi_GR.7.d: "Pour Phu Bu, la vie sur le plateau est toujours la même. En dehors des montagnes enneigées sans fin et des antilopes et léopards des neiges occasionnels, il n'y a pratiquement rien de nouveau. Sa grand-mère est de plus en plus malade récemment. Elle vomit toutes les herbes qu'elle mange. Phu Bu ne peut aller au temple que pour demander l'aide du lama. Le lama a dit qu'il pouvait obtenir des médicaments plus efficaces en allant à l'endroit où vivent les Han, mais Phu Bu n'a jamais vu beaucoup de Han de sa vie, et il ne parle ni ne comprend le chinois, sans compter qu'il n'y a pas de route menant à la résidence des Han à cet endroit. Phu Bu a prié le ciel pendant la journée et a prié à côté de sa grand-mère la nuit après avoir gardé les moutons. Cependant, le Bouddha ne semblait pas avoir pitié de la grand-mère mourante et de son petit-fils pieux. Phu Bu Pubu a demandé aux lamas le chemin du territoire Han. Il fallait sept ou huit jours pour traverser quatre montagnes enneigées pour atteindre un autre village, où il pouvait prendre un chariot à essence jusqu'à la ville Han. Pubu ne pouvait pas quitter sa grand-mère pendant tant de jours, et elle avait besoin de quelqu'un pour s'occuper d'elle en permanence. Il priait les montagnes sans fin chaque jour, puis priait pour des miracles comme d'habitude. Il se souvenait qu'il y a quelques années, beaucoup de gens sont soudainement venus de l'autre côté de la montagne. Ces gens ont apporté d'énormes chariots de fer pour fracasser et piler partout. Bientôt, deux longues barres de fer ont été laissées sur le sol, avec du bois au milieu. Selon les lamas, c'étaient des Han de loin, et ils sont venus ici pour construire des routes. Est-ce une route ? Comment peut-il y avoir des gens ? Marcher sur des barres de fer et monter des vaches ? Pu Bu ne comprenait pas cela, il était plus préoccupé par l'état de sa grand-mère. La nuit précédente, sa grand-mère a dit à Pu Bu de faire quelques galettes d'orge supplémentaires et d'inviter un lama à s'occuper d'elles à la maison, afin qu'elles puissent se dépêcher d'aller sur le territoire Han pour trouver des médicaments. Pu Bu n'a pas dormi de la nuit et a pleuré toute la nuit. Le lendemain, il a fait des galettes d'orge et est allé au temple pour inviter le lama. Les montagnes sur le plateau sont si hautes qu'elles bloquent la turbidité du monde et le chemin de la vie. Pu Bu se sentait épuisé après avoir marché pendant une journée, mais il n'avait même pas fait un quart du chemin. Il s'est assis sur une pierre ombragée et a sorti la galette d'orge pour manger. Soudain, un grondement est venu de l'endroit d'origine, La terre a commencé à trembler. Au début, Pubu a pensé que la fin du Dharma mentionnée dans le bouddhisme était arrivée et que le monde allait s'effondrer, mais après un certain temps, il ne semblait pas que ce soit le cas. Pubu a vu une chose verte apparaître au loin, devenant plus grande et plus bruyante. L'énorme bruit était clairement fait par la chose verte ! Lorsque la longue bande verte est passée rapidement près de lui, il a finalement réalisé que c'étaient les chariots des Han qui roulaient sur les barres de fer qu'ils avaient construites auparavant. Phubu s'est levé et a couru après le train. Grand-mère est sauvée, les Han ont apporté leurs chariots ! Puis il a réalisé que la route de fer posée par les Han il y a plusieurs années était destinée à ce qu'ils apportent ici les choses qui sauvaient les gens."
chi_GR.7.a: "Zaxi Delek, ami Han !"
chi_GR.8: "Gouttes d'eau"
chi_GR.8.t: "Gouttes d'eau"
chi_GR.8.d: "Les enfants, savez-vous d'où vient l'eau ? \"Maître, l'eau vient du robinet !\" \"Non, l'eau doit être puisée dans le puits !\" \"Vous avez tous tort. L'eau tombe du ciel. L'eau n'arrive que quand il pleut !\" Les enfants en parlaient, et ils pensaient tous que ce qu'eux ou d'autres disaient était raisonnable. \"Tout le monde a raison. On peut trouver de l'eau à ces endroits. Mais le maître a une autre réponse. Le maître pense que l'eau est 'économisée' des mains de chacun.\" L'enseignant a fait un geste de la main, s'est penché et a fait semblant de tenir une poignée d'eau. \"Il y a de l'eau partout dans nos vies, mais nous avons très peu d'eau. Moins de 5 % de l'eau dans le monde est à notre disposition, alors dans de nombreux endroits de notre pays, les gens ne peuvent même pas utiliser l'eau. Certains d'entre eux ne peuvent se baigner que trois fois dans leur vie : à la naissance, au mariage et lors d'un enterrement. Notre pays est grand et a beaucoup d'eau, mais nous sommes le pays le plus peuplé du monde, il y a donc très peu d'eau pour chacun. \"L'enseignant s'est retourné et a mis l'eau invisible dans la tasse, \"Par conséquent, nous devrions commencer à économiser chaque goutte d'eau de divers endroits autour de nous, comme fermer le robinet, utiliser l'eau du robinet au lieu de l'eau courante lors du lavage des légumes, etc. De cette façon, nous pouvons apporter notre propre contribution à nos ressources en eau limitées et permettre à plus de personnes d'utiliser l'eau. Qu'en pensez-vous ?\" \"Bien !\" Les enfants semblaient comprendre, mais il y avait déjà une graine bleue dans leur cœur."
chi_GR.8.a: "Des gouttes d'eau font une rivière, de petites gouttes s'additionnent pour faire beaucoup"
chi_GR.9: "Soleil noir"
chi_GR.9.t: "Soleil noir"
chi_GR.9.d: "Je te le dis, parfois la journée est comme le ciel noir, grise, même le soleil est gris !\" Quand Liu Changjun a entendu le collègue du Hebei décrire sa ville natale ainsi, il a été choqué et sans voix. \"Si effrayant ? Comment le ciel peut-il devenir noir sans raison ?\" \"Nous vivons dans la banlieue, on peut donc être considérés comme des semi-citadins. Il y a une immense usine de l'autre côté de la ville, qui fabrique de l'acier. Pour fabriquer de l'acier, il faut brûler des fours, et la combustion des fours produira de la fumée. Les grandes cheminées de l'usine émettent de la fumée noire jour et nuit, parfois ça peut vraiment noircir le ciel ! Sans parler des rues, même à la maison, il faut balayer le sol tous les jours, et à chaque fois qu'on balaye, il y aura un morceau de scories noires, qui sont toutes les scories de charbon flottantes !\" \"Cela ne sera-t-il pas nocif pour les gens ? Ces scories de charbon peuvent-elles être respirées dans les poumons et exhalées ?\" \"C'est très nocif ! La plupart de nos personnes âgées sont mortes d'une maladie pulmonaire, et beaucoup de jeunes toussaient constamment dès leur plus jeune âge. Heureusement, j'ai réussi l'examen et je suis venu à Pékin, sinon j'aurais raccourci ma vie de plusieurs dizaines d'années.\" Le collègue a soupiré par inadvertance, et Liu Changjun l'a clairement entendu."
chi_GR.9.a: "À quoi ressemble le soleil noir..."
chi_GR.10: "Homme Saint"
chi_GR.10.t: "Homme Saint"
chi_GR.10.d: "Désolée, Xiao Liu, je ne peux pas utiliser une tasse que quelqu'un d'autre a utilisée.\" Après la longue course, Liu Changyun a tendu la tasse à Xiao Ma haletant, mais Xiao Ma a secoué la tête et a refusé avec une légère excuse. \"Ah, je n'aime pas Xiao Liu, mais ma famille ne me permet pas de faire ça...\" Xiao Ma a vu l'expression perplexe de Liu Changyun et s'est dépêchée d'expliquer. Liu Changyun s'est alors souvenue que Xiao Ma était un Hui, et qu'il y avait quelques différences entre lui et les autres. Par exemple, elle n'avait jamais vu Xiao Ma aller à la cafétéria de l'école pour manger, on disait que c'était parce que les Hui ne pouvaient pas manger de porc ; par exemple, Xiao Ma allait souvent aux toilettes pour se laver les pieds. Bien que ce soit effectivement très hygiénique, la fréquence était encore trop élevée. \"Oh, c'est comme ça. Ce n'est pas grave. Allons acheter de l'eau. Mais je suis curieuse, si je verse de l'eau dans ta tasse, puis-je la boire ? Ou, quel genre d'eau est potable chez toi ?\" \"Mes parents ont dit que si tu utilises la tasse de quelqu'un d'autre, tu pourrais boire de l'eau sale. Tu ne peux pas manger dans la même assiette avec d'autres non plus. Notre famille fait très attention à la propreté. Nous nous lavons souvent le corps et les membres, surtout avant les offices. Nous devons garder notre corps propre.\" \"Est-ce la raison pour ne pas manger de porc ?\" \"Ça devrait l'être. Ma mère me dit toujours que les cochons sont impurs et me demande de ne pas manger de porc. Mais je pense que les porcelets que nous élevons sont tous blancs, donc ils ne devraient pas être sales...\" Il s'avère que c'est pour des raisons d'hygiène, mais c'est un peu trop particulier. Ont-ils été comme ça pendant des milliers d'années ? Liu Changyun a pensé en elle-même. Mais elle a vite oublié cela. Après tout, Xiao Ma n'est pas différent des autres. La seule chose qui lui rappelle occasionnellement est que Xiao Ma se lave souvent les mains et les pieds."
chi_GR.10.a: "C'est toujours bien d'être propre"
chi_GR.11: "Aigle des prairies"
chi_GR.11.t: "Aigle des prairies"
chi_GR.11.d: "Sous le ciel sombre, dans une banlieue éloignée de la Mongolie intérieure, une usine délabrée était toujours éclairée, et des cris et des jurons forts venaient de l'usine. \"Comment se fait-il que tu ne puisses pas bien faire ça ? Ce ne sont que quelques pièces supplémentaires qui te sont attribuées ? Tu peux même installer ces pièces à l'envers, tu es vraiment incroyable ?! Camarade Xiao Mao !\" L'homme habillé en contremaître a dit sarcastiquement, devant lui se trouvaient Xiao Mao et d'autres travailleurs qui étaient très contrariés d'être réprimandés. \"Tu es un représentant du parti de notre usine. Sais-tu combien tu me dois pour t'avoir donné ce quota ? Je ne sais pas combien de fois j'ai parlé au patron, voulant te prendre comme modèle, mais tu as même gâché une si petite chose ? Je suis vraiment aveugle.\" \"Je suis désolé, directeur Dai, je m'améliorerai certainement la prochaine fois ! Je ne ferai jamais d'erreurs !\" \"Tu aurais dû changer. Aussi, ne lis pas ces choses inutiles la nuit. Je ne t'ai pas laissé rejoindre le parti pour que tu sabotes. Que veux-tu faire en lisant ces livres marxistes tous les jours ? Et en en parlant aux autres ? Quoi, tu veux te rebeller ? Comme ce bandit du Hunan ?\" Le contremaître a poussé la tête de Xiao Mao, \"Ne pense pas que juste parce que tu t'appelles Mao, tu peux vraiment faire des bêtises comme ce vieil homme. Tu te prends trop au sérieux, n'est-ce pas ?\" \"Hé, garde ta langue propre.\" Huridele, un collègue à côté, n'a finalement pas pu s'empêcher de chuchoter. \"Quoi, tu veux te rebeller aussi ? Je te vois parler de quelque chose avec Xiao Mao tous les jours. Tu veux être Peng Dehuai, n'est-ce pas ? Vous vous rebellez ensemble ? Si tu veux te rebeller, tu dois d'abord bien faire ton travail. Si tu ne peux pas bien faire ton travail, tu ne peux pas te rebeller !\" Le contremaître a dit vicieusement, en jetant son casque de sécurité par terre. Après le travail, Huridele est retourné au dortoir de l'usine avec Xiao Mao. \"Je ne m'attendais pas à ce que ma qualification de membre du parti soit obtenue par Dai Zongguan. Pas étonnant que tu aies écrit tant de demandes d'adhésion au parti auparavant, mais c'était inutile, et il n'y avait pas de retour.\" Huridler a ri de bon cœur : \"Ha, qui se soucie de ce genre de chose ? Un vrai membre du parti n'a pas besoin d'un morceau de papier.\" \"En fait...\" Xiao Mao a regardé autour de lui et a chuchoté : \"J'ai obtenu des preuves que Dai Zongguan a secrètement donné de l'argent et des cadeaux à plusieurs fonctionnaires. La dernière fois, il a donné aux personnes envoyées par le Bureau de supervision de la qualité plusieurs enveloppes gonflées, des cigarettes et de l'alcool, et a finalement été au salon de massage des pieds de la ville pour jouer une nuit. Je les ai suivis et j'ai pris des photos !\" \"Il y a une telle chose ? Bien, je le déteste depuis longtemps, et il doit être jeté en prison !\""
chi_GR.11.a: "D'accord, allons-y ensemble"
chi_GR.12: "Produits importés"
chi_GR.12.t: "Produits importés"
chi_GR.12.d: "Liu Changyun est récemment tombée amoureuse d'un style de chansons électroniques. Non seulement la mélodie elle-même est synthétisée par un logiciel électronique, mais même le chant est interprété par un logiciel appelé Electronic Songs. Elle a recommandé avec enthousiasme plusieurs bonnes chansons de ce genre à son frère idiot, mais il était difficile pour Liu Changjun de ressentir du plaisir de ces sons électroniques palpitants. \"J'ai passé beaucoup de temps à chercher sur Internet après le travail hier et j'ai finalement trouvé la chanson chantée par le petit homme aux cheveux verts dont tu parlais sur un site web japonais.\" Liu Changjun au téléphone s'est arrêté et a continué, \"Je ne pense pas que ce soit très bon... Mais j'ai aussi trouvé beaucoup d'animations en passant. Le dessin animé appelé Pokémon que nous regardions à la télévision à la maison l'année dernière pour la fête nationale, je l'ai trouvé hier et j'ai regardé quelques épisodes, c'est plutôt bien.\" \"Vraiment ? Alors je peux t'en recommander d'autres ! Récemment, l'animation japonaise est très populaire dans notre école, et c'est populaire parmi les camarades de classe de parler japonais ! J'ai aussi appris quelques phrases. Laisse-moi réfléchir. Oh, oui, bonjour c'est Kong Ni Ji Wa, merci c'est Arigato, au revoir c'est Sayonara, désolé c'est Su Mi Ma Sai...\" \"Oh, le japonais était populaire quand j'étais à l'école, mais c'est populaire parmi vous maintenant. Haha, es-tu une vieille femme !\" \"Quelle vieille femme ? Je pense que tu es un vieil homme ! Oublie que je te recommande des chansons et que tu ne me remercies pas. Tu es vraiment un vieil homme stupide. D'accord, je n'en dis pas plus. C'est presque une minute. Je raccroche maintenant.\" \"Hé, ne raccroche pas encore. Une de mes collègues va voyager au Japon la semaine prochaine. Veux-tu qu'elle t'aide à les ramener en Chine ?\" \"Wow, vraiment ! Alors je veux les dernières bandes dessinées de \"A Certain Scientific Railgun\" !\" \"Un Certain Scientifique... quel genre de fusil ? Je n'en ai jamais entendu parler... Non, c'est en japonais quand je l'ai acheté. Peux-tu comprendre le japonais ?\" \"Si tu ne comprends pas, tu peux apprendre. Il y a tellement de caractères chinois en japonais, qui ne les connaît pas ? Tu apprendras certainement vite.\" \"Qu'est-ce que tu veux dire par tu peux apprendre ? C'est facile à dire... Oh, oublie ça. Le moment venu, envoie-moi juste un message et dis-moi ton nom, et je demanderai à ma collègue de l'acheter pour toi. Raccroche, raccroche.\" \"Merci beaucoup, frère idiot !\" \"Je t'ai tellement aidé, mais tu m'appelles toujours idiot ?\""
chi_GR.12.a: "Je trouverai une occasion de voyager aussi."
chi_GR.13: "L'homme peut vaincre la nature"
chi_GR.13.t: "L'homme peut vaincre la nature"
chi_GR.13.d: "Bien que la date exacte d'achèvement du projet des Trois Gorges ait été déterminée plusieurs mois auparavant, Hu Jintao a quand même poussé un soupir de soulagement après avoir reçu la nouvelle de son achèvement final. \"Ce n'est pas une tâche facile. Lorsque la proposition a été soumise au vote de l'Assemblée Populaire Nationale, les votes étaient si bas que tout le monde s'inquiétait encore d'un projet aussi vaste.\" Hu Jintao a souri au Premier ministre Wen Jiabao, \"Mais c'est un bon début. Tout le monde s'y habituera lors de la construction de grands projets à l'avenir.\" \"Il a été construit si rapidement, et il y a toujours des dangers cachés après tout. Je pense qu'il y a effectivement certains aspects du projet qui peuvent être discutés et améliorés, en particulier la conception de l'évacuation des crues et du stockage du sable. Mais le temps n'attend personne. Toute la région du Yangtsé a besoin de l'électricité fournie par les Trois Gorges. Les habitants attendent avec impatience les jours sans coupures de courant ni restrictions depuis longtemps.\" Wen Jiabao a également souri, \"Très bien, notre pays a construit un autre projet de classe mondiale, et c'est un projet qui profite au peuple !\" \"Lorsque je travaillais à la centrale hydroélectrique de Gansu, je me demandais quand le grand barrage sur le fleuve Yangtsé serait construit. Je ne m'attendais pas à ce qu'il soit construit pendant mon mandat. Je suis si chanceux. À l'époque, tout le monde parlait du principe selon lequel l'homme peut vaincre la nature, et aimait faire des projets qui semblent incroyables maintenant. Certains ont réussi, et d'autres ont échoué. Mais si tu me demandes, l'homme peut vaincre la nature. Nous avons construit des chemins de fer au Tibet, construit des barrages sur le fleuve Yangtsé, et envoyé des gens dans l'espace. Nous pouvons vraiment atteindre la lune et attraper des tortues dans les cinq océans ! Que penses-tu que ressentirait le président Mao s'il était encore en vie et voyait cela ?\" Le Premier ministre Wen Jiabao a réfléchi un moment : \"C'est difficile de dire autre chose. Il serait peut-être heureux qu'il n'y ait pas eu de guerre.\""
chi_GR.13.a: "Nous n'avons pas peur d'être battus. Le peuple chinois est invincible."
chi_GR.14: "Printemps chaud"
chi_GR.14.t: "Printemps chaud"
chi_GR.14.d: "Hu Jintao s'est senti un peu gêné lorsqu'il a rencontré l'empereur avant-hier, mais aujourd'hui, il s'est senti beaucoup plus détendu lorsqu'il a rencontré des élèves dans une école primaire de Yokohama. Les élèves de cette riche ville côtière étaient magnifiquement habillés, pleins d'énergie, et vivaient une enfance heureuse chaque jour, ce qui a rappelé au président les étudiants pauvres des montagnes du sud-ouest. \"L'écart entre les gens est vraiment trop grand, trop grand.\" Une telle voix a retenti dans son cœur. \"Grand-père Hu, parmi les Fuwa de Pékin, mes Fuwa préférés sont Huanhuan et Jingjing. Quel Fuwa préfères-tu ?\" Une petite Japonaise avec des tresses jumelles a demandé à Hu Jintao en chinois courant. \"Oh, je veux te dire, j'aime les cinq Fuwa !\" Hu Jintao a souri et s'est penché pour répondre à la petite fille, et les gens autour de lui ont aussi ri. Un autre petit garçon portant des lunettes s'est levé et a dit au président en chinois : \"Grand-père Hu, je veux vous poser une question, pourquoi voulez-vous être... Président ?\" Lorsque cela a été dit, tout le monde a été surpris et a ri. L'enseignant a rapidement essayé d'arranger les choses : \"Oh, c'est une question vraiment difficile, et vous vous levez quand même pour poser une question...\" Le président Hu a souri et s'est penché vers le petit garçon : \"Hahaha, personnellement, je ne veux pas être le président.\" Il a mis ses mains sur sa poitrine, \"C'est le peuple de tout le pays qui m'a élu et a fait de moi le président. Je ne devrais pas décevoir les attentes du peuple de tout le pays, n'est-ce pas.\" Il s'est tourné vers les autres personnes présentes : \"Lorsque j'ai rencontré des enfants en Chine, personne n'a jamais posé une telle question. Cet enfant japonais a posé une très bonne question ! Rechercher la vérité dans les faits, et un esprit de recherche ! Je pense que les enfants japonais ont encore beaucoup d'esprit que nous devons apprendre. Tout à l'heure, j'ai vu une statue à la porte de l'école, sur laquelle était inscrite une célèbre citation de Confucius : C'est un grand plaisir d'avoir des amis venant de loin. Les peuples de Chine et du Japon ont eu autrefois une profonde amitié historique. Nous sommes voisins et amis. Le peuple chinois accorde de l'importance au bon voisinage et à l'entraide. Si même les voisins n'aiment pas une personne, alors cette personne ne pourra certainement pas accomplir grand-chose. Nous devrions nous efforcer d'élever cette amitié historique à un nouveau niveau, afin que les peuples de nos deux pays à cette époque se connaissent et se fassent plus confiance.\" \"Les peuples chinois et japonais ont d'abord renforcé leurs sentiments dans le domaine universitaire. Dans les temps anciens, les étudiants japonais parcouraient des milliers de kilomètres pour étudier à Chang'an, et des moines chinois tels que Jianzhen se sont également rendus au Japon pour donner des conférences après avoir traversé d'innombrables épreuves. Le consensus sur l'histoire et la culture est le fondement le plus solide de l'amitié entre les deux pays, et le respect du savoir est le consensus le plus harmonieux sur les valeurs des deux pays. Nous devrions renforcer la coopération universitaire et économique entre les deux pays et créer conjointement un avenir centré sur l'homme, plus pacifique et plus beau pour les peuples des deux pays.\" Après avoir parlé, toutes les personnes présentes ont applaudi sincèrement, tant Chinois que Japonais, mais la plupart étaient les enfants dans la salle de classe."
chi_GR.14.a: "Enfants, l'avenir de la Chine et du Japon dépend de vous"
chi_GR.15: "Autoroute"
chi_GR.15.t: "Autoroute"
chi_GR.15.d: "Aujourd'hui, Hu Jintao participera à une séance de questions-réponses en direct pour les internautes de tout le pays. Il est depuis longtemps capable de rester calme devant la caméra, mais il se sent toujours un peu gêné assis devant un petit écran et répondant aux questions de personnes qu'il ne peut pas voir. Le secrétaire lui a demandé doucement s'il pouvait commencer. Le président a hoché la tête et a poussé ses lunettes. \"Bonjour, Secrétaire général Hu Jintao. Nous savons que vous êtes très préoccupé par le développement d'Internet et le développement du Quotidien du Peuple en ligne. Aujourd'hui, vous êtes personnellement venu au Forum Strong Country. Nos modérateurs et internautes sont très excités et honorés. Veuillez dire quelques mots à nos internautes !\" \"Hé... amis, bonjour ! Je suis très heureux d'avoir l'occasion de vous rencontrer et de communiquer avec vous en ligne aujourd'hui. Tout d'abord, je voudrais profiter de cette occasion pour exprimer mes salutations sincères et mes bons vœux à mes amis internautes !\" \"Merci Secrétaire général Hu Jintao pour vos salutations à la majorité des internautes. Lorsque les internautes ont appris que vous veniez au Forum Qiang Guo, ils ont posté sur Internet les uns après les autres. Certains vous ont posé de nombreuses questions. Veuillez discuter avec les internautes ! Un internaute a demandé : Secrétaire général, allez-vous habituellement en ligne ? Qu'y lisez-vous ?\" \"Oh, d'accord, haha, bien que je sois généralement occupé par mon travail et qu'il soit impossible d'aller en ligne tous les jours, j'essaie quand même de trouver du temps pour y aller. Ce que je veux dire en particulier, c'est que le Forum Qiang Guo du Quotidien du Peuple est également l'un des sites web que je dois choisir lorsque je vais souvent en ligne. Je vais généralement en ligne pour lire les nouvelles nationales et étrangères. D'autre part, je veux aussi savoir quels sujets préoccupent les internautes et ce qu'ils pensent en ligne. Je souhaite également apprendre d'Internet les opinions et suggestions que les internautes ont sur le travail du Parti et du pays. Ce sont toutes des choses qui me préoccupent beaucoup. Nous avons toujours insisté sur la priorité du peuple et la gouvernance pour le peuple, car lorsque nous faisons des choses et prenons des décisions, nous devons écouter les opinions du peuple et concentrer la sagesse du peuple. C'est un canal très important pour comprendre les sentiments du peuple et recueillir sa sagesse par le biais d'Internet. Certaines personnes comparent Internet à une autoroute de l'information, et je suis tout à fait d'accord. Tu peux voir tellement d'informations et de nouvelles dès que tu vas en ligne. C'est quelque chose que les gens du passé n'auraient jamais osé imaginer ! Auparavant, les gens ne connaissaient pas le contenu du travail du Parti et du gouvernement, et il y avait peu de canaux pour le comprendre, ils considéraient donc cela comme une chose très lointaine. Maintenant, tout le monde peut voir diverses tâches et politiques à l'écran, et peut se réunir pour discuter, améliorer sa compréhension des politiques, et signaler leurs avantages et inconvénients. C'est une bonne chose. Il devrait y avoir plus de nouveautés au nouveau siècle !\""
chi_GR.15.a: "Les temps avancent"
chi_GR.16: "Grande Montagne"
chi_GR.16.t: "Grande Montagne"
chi_GR.16.d: "Il y a d'innombrables vieux arbres et de magnifiques paysages dans les montagnes du sud-ouest, mais pour les gens qui vivent ici, ces vieux arbres et ces montagnes sont une cage qu'ils ne pourront jamais escalader de leur vivant. C'est là que Hu Jintao a autrefois travaillé, et il sait mieux que quiconque comment les gens vivent ici. Après la réforme et l'ouverture, les zones côtières de l'est ont été comme une locomotive tirant l'économie chinoise vers le haut, et sont devenues de plus en plus un haut lieu économique international. Cependant, dans les vastes régions intérieures, en particulier dans les montagnes profondes du sud-ouest, le vent printanier de la réforme n'a pas soufflé du tout. Lorsqu'il était responsable du Guizhou, c'était simplement une terre d'extrême pauvreté, de pauvreté généralisée et d'isolement. Les transports médiocres ont transformé cet endroit en une dépression économique complètement opposée à la région de l'est. Bien qu'il ait fait de son mieux pour améliorer la vie des gens lorsqu'il était secrétaire provincial du parti, il y a des milliers de fossés dans les montagnes, et une louche d'eau de riz ne pourra jamais remplir les bouches sèches de millions de personnes. Pour Hu Jintao, c'était la première fois qu'il gouvernait une région. Bien qu'il ait accompli de nombreux succès et ait été félicité par le gouvernement central, il savait qu'il était presque inutile d'améliorer complètement la vie des gens. Lorsqu'il a visité la maison d'un enfant laissé pour compte, le très jeune garçon mangeait avec les cadres du village qui lui rendaient souvent visite. \"Xiao Wu, manges-tu cela le matin et à midi ?\" \"Oui ! Manges-en aussi le soir ! Les pommes de terre sont délicieuses !\" L'enfant a répondu à voix haute en riant. Le cadre du village a essuyé les larmes de Hu Jintao dans la pièce voisine, disant que les parents de l'enfant travaillaient à l'extérieur, et que son grand-père qui s'occupait de lui était décédé le mois dernier. Maintenant, l'enfant ne peut manger des pommes de terre qu'avec lui. Les pommes de terre sont utilisées pour améliorer les repas ici. Hu Jintao a secrètement versé beaucoup de larmes après avoir quitté la maison délabrée. Il a presque vécu comme ça quand il était dans le Gansu auparavant. Depuis, il a toujours réfléchi à savoir pour qui il travaille et s'il a réellement aidé ceux qui en ont besoin."
chi_GR.16.a: "Le peuple lutte"
chi_GR.17: "Hanté"
chi_GR.17.t: "Hanté"
chi_GR.17.d: "Putain, je ramassais du bois de chauffage, et ce truc s'est envolé de la route de montagne. C'était si clair dans la forêt sombre, c'était juste un crâne, et il clignotait toujours !\" \"J'ai aussi rencontré une chose étrange. Ma vieille mère a perdu ses cheveux au milieu de la nuit, et elle les a attachés soigneusement. Je n'ai pas pensé que c'était grave au début, mais plus tard mes cheveux sont aussi tombés, comme s'ils avaient été rasés avec un couteau. Qu'est-ce que tu penses que ce n'est pas de l'alopécie areata ?!\" \"Je pense que vous avez tous tort. Je suis allé dans le village voisin il y a quelques jours et j'ai vu un rituel. Oh, cette sorcière et ce prêtre taoïste sont vraiment capables. Le propriétaire de cette maison ne pouvait rien manger au début, et il vomissait de l'eau verte. Après avoir communiqué avec l'esprit, la sorcière a calculé qu'il était possédé par de mauvais esprits, et voulait retirer les mauvais esprits et les jeter dans la poêle à frire pour les faire frire. La sorcière tenait une cloche et récitait un sort, le vieux prêtre taoïste marmonnait dans un état second, et a soudainement frappé sa main sur la tête de la personne, puis a retiré deux gros vers verts, et ensuite la sorcière a mis sa main directement dans la poêle à huile chaude et l'a retournée pendant quelques tours. Oh, j'ai eu tellement mal juste en regardant ! En fin de compte, elle allait bien ! Elle a aussi fait frire les deux vers verts en deux beignets et a laissé le patient les manger. Hé, la personne a vomi beaucoup d'eau noire après les avoir mangés, et a vomi et eu la diarrhée, mais j'ai entendu dire qu'il allait bien le lendemain !\" \"Est-ce qu'il y a une telle chose ? J'ai invité plusieurs diseurs de bonne aventure à lire la bonne aventure à ma femme à ce moment-là, mais ils savaient tous comment toucher les mains de ma femme, et ils n'étaient pas honnêtes du tout ! Il semble que j'aie encore besoin d'inviter un gentleman avec de vraies compétences !\" Liu Changjun a regardé les villageois qui devenaient de plus en plus excités en parlant, et a regardé son collègue Xiao Zhang, impuissant. Ce matin, lui et Xiao Zhang ont été envoyés dans ce village pour rendre visite aux gens et demander aux villageois s'ils avaient des problèmes. En conséquence, les villageois leur ont donné de tels problèmes. \"Mes chers villageois, arrêtez-vous un instant. Bien que nous ne posions pas ce genre de question, nous savons déjà quels problèmes vous avez rencontrés... Nous allons demander conjointement une réunion de vulgarisation scientifique pour nos villages. Ce que vous venez de dire, qu'il s'agisse de fantômes ou de miracles, sont toutes des superstitions féodales, qui peuvent être expliquées par la science. Les principes scientifiques seront clairement expliqués lors de la réunion. Vous devez croire en la science, apprendre la science, et ne pas laisser la superstition et l'ignorance aveugler vos yeux !\" Xiao Zhang a dit aux villageois dont les yeux révélaient de la méfiance. Après avoir quitté le village, Liu Changjun a souri amèrement à Xiao Zhang et a jeté sa mallette sur le siège arrière de la voiture : \"Je pense que la vulgarisation scientifique devrait être inutile. Ces camarades villageois comprennent mieux que nous la vérité selon laquelle la pratique rend parfait. Ils ne renonceront certainement pas à leur connaissance d'origine pour ce qu'ils ont personnellement rencontré.\" Xiao Zhang a fait la moue et a dit nonchalamment : \"Ça n'a pas d'importance. Le travail de vulgarisation scientifique est comme ça. Tant qu'une ou deux personnes peuvent changer de point de vue avec succès, ce sera une victoire. Ne traite pas les autres comme des idiots. Ils ne savent pas grand-chose. Une fois que la vérité sera clairement expliquée, ils comprendront.\""
chi_GR.17.a: "Je pense qu'il serait préférable de leur montrer quelques épisodes de \"Science Approches\"..."
chi_GR.18: "Lumière de bougie"
chi_GR.18.t: "Lumière de bougie"
chi_GR.18.d: "Combien de kilomètres marches-tu pour aller à l'école ? Où manges-tu ? Manges-tu suffisamment ?\" Hu Jintao était le plus préoccupé par l'éducation des enfants dans les zones rurales pauvres pendant ce voyage. Lorsqu'il travaillait dans le Gansu, il a vu de nombreux élèves qui devaient marcher plusieurs kilomètres sur la route de montagne pour aller à l'école à chaque fois, et marcher plusieurs kilomètres pour rentrer chez eux à la fin du mois. Ils mangeaient généralement très mal à l'école - les élèves des familles plus aisées pouvaient manger dans un autre four séparé, qui contenait généralement de la viande de mouton ou de bœuf. Faut-il faire l'éducation le ventre vide ? Hu Jintao secouait la tête chaque fois qu'il y pensait. Bien qu'il soit en fonction depuis de nombreuses années, il constate toujours que de nombreuses écoles dans les zones montagneuses n'ont même pas de salles de classe décentes, et certaines tables et chaises sont même de vieilles choses laissées de l'époque d'avant la libération - bien sûr, plusieurs élèves s'entassent sur une seule table. \"L'avenir du pays réside dans l'éducation, et la cible principale de l'éducation est les enfants\", a déclaré le président Hu à Wen Jiabao sur le chemin du retour, \"Nous avons beaucoup investi dans l'éducation, mais il y a encore plus de gens qui ont besoin d'éducation.\" \"Je comprends ce que vous voulez dire, mais la pression financière est déjà très forte\", a répondu solennellement Wen Jiabao. \"Pouvons-nous émettre des fonds pour l'éducation à la société ?\" \"Le financement n'est probablement pas une bonne méthode. L'écart dans les fonds pour l'éducation est trop important et ils sont utilisés rapidement. Nous ne pouvons pas attendre que le nouveau fonds fasse un profit. J'ai un plan. Pourquoi la société ne pourrait-elle pas supporter spontanément le transfert des dépenses d'éducation ? Nous avons déjà un programme d'aide aux étudiants appelé Projet Espoir, qui est parrainé par la Fondation chinoise pour le développement de la jeunesse. Ce projet a été lancé par votre groupe. Vous êtes vraiment un homme noble qui oublie les choses\", a dit Wen Jiabao en souriant au président, \"Lorsque les citadins verront que les étudiants ruraux sont si pauvres, ils susciteront plus ou moins de sympathie et feront des dons.\" \"C'est une bonne idée. Retournez contacter le Département de la propagande et demandez-leur de faire plus de publicité. Et...\" Hu Jintao s'est penché en avant et a fait un geste, \"Les règlements sur l'exonération des frais de scolarité et autres frais ont été publiés depuis si longtemps, mais tout à l'heure j'ai demandé et j'ai découvert que les étudiants doivent payer plus de 700 yuans par semestre. Ce groupe de tyrans locaux a voulu unifier le calibre des enfants et me le cacher. Quelques enfants qui ne peuvent pas mentir l'ont laissé échapper, et ces gens ont aussi soutenu que c'était l'argent de l'uniforme scolaire. Quels uniformes scolaires en or coûtent 700 yuans ! Comment osez-vous dire n'importe quoi devant moi !\" Wen Jiabao a hoché la tête, puis a secoué la tête."
chi_GR.18.a: "Trop de mains grasses"
chi_GR.19: "Une lettre aux compatriotes taïwanais"
chi_GR.19.t: "Lettre du Comité permanent de l'Assemblée populaire nationale de la République populaire de Chine aux compatriotes de Taïwan"
chi_GR.19.d: "Chers compatriotes de Taïwan : \n« Les hirondelles s'envolent, mais elles reviendront ; les saules flétrissent, mais ils reverdiront ; les fleurs de pêcher fanent, mais elles refleuriront. Mais, ô sage, dis-moi, pourquoi nos jours ne reviennent-ils jamais ? » C'est la lamentation écrite par M. Zhu Ziqing, célèbre essayiste, poète, érudit et combattant démocratique chinois de la République de Chine, en l'an 11 de la République. Ce passage nous touche plus profondément que jamais, car nos propres chairs et sangs – les aînés, frères et sœurs de Taïwan – n'ont pas encore été réunis dans nos familles chaleureuses. Nous savons que les compatriotes de Taïwan ressentent également une nostalgie infinie pour la patrie et leurs proches sur le continent. Ce désir mutuel, qui perdure depuis de nombreuses années, est enraciné dans le cœur de chaque fils et fille de Chine, et il grandit jour après jour. Depuis que Taïwan a été malheureusement séparée de la patrie en 1949, nous avons perdu contact et communication, la patrie ne peut être unifiée, et les proches ne peuvent être réunis. La nation, le pays et le peuple ont subi d'immenses pertes. Tous les compatriotes chinois et tous les Chinois du monde entier espèrent que cette situation déchirante prendra fin rapidement. \n\nNotre nation chinoise est une grande nation. Nous possédons un vaste territoire et une population nombreuse, représentant près d'un cinquième de la population mondiale. Nous jouissons d'une longue histoire et d'une culture exceptionnelle. Nous sommes l'un des pays ayant les territoires les plus vastes au monde. Nos contributions remarquables à la civilisation mondiale et au développement humain, de l'Antiquité à nos jours, sont reconnues par le monde entier. Taïwan est une partie inséparable de la Chine depuis les temps anciens, et le peuple de Taïwan est, depuis toujours, frère de sang de la nation chinoise. La nation chinoise se rapproche de plus en plus du rêve centenaire de la grande renaissance. Comme nous souhaitons, aux côtés de nos compatriotes de Taïwan, en tant que membre fier de la nation chinoise, nous tenir debout parmi les nations du monde. Chaque Chinois est fier de la force croissante de la patrie. Si nous mettons fin à la division le plus tôt possible et unissons nos forces, notre contribution à l'avenir de l'humanité sera illimitée. La réalisation précoce de la réunification nationale est non seulement le souhait commun de tous les Chinois, y compris nos compatriotes de Taïwan, mais aussi l'espoir commun de tous les peuples et pays épris de paix dans le monde. \n\nNous plaçons nos espoirs sur les 22 millions d'habitants de Taïwan, ainsi que sur les autorités taïwanaises. Les autorités taïwanaises ont toujours adhéré à la position d'une seule Chine et se sont opposées à l'indépendance de Taïwan. C'est notre position commune et la base de notre coopération. Nous avons toujours prôné que le patriotisme forme une seule famille. L'unification de la patrie est la responsabilité de chacun. Nous espérons que les autorités taïwanaises placeront les intérêts nationaux au premier plan et apporteront des contributions précieuses à la cause de la réunification de la patrie. Nous souhaitons sincèrement que Taïwan revienne à la patrie le plus tôt possible et que nous développions ensemble la grande cause de la construction nationale. Nos dirigeants nationaux ont exprimé leur détermination tout en tenant compte de la réalité. Compléter la grande cause de la réunification nationale, respecter le statu quo à Taïwan et les opinions des différentes couches de la société taïwanaise lors de la résolution de la question de la réunification, adopter des politiques et mesures raisonnables, et ne pas causer de pertes au peuple de Taïwan. \n\nChers compatriotes de Taïwan : L'avenir brillant de notre grande patrie nous appartient, à vous, et à tous les peuples épris de paix dans le monde. Unifier la patrie est la mission sacrée que l'histoire a confiée à notre génération. La roue de l'histoire avance, et la tendance de l'époque est puissante. Plus tôt nous accomplirons cette mission, plus tôt nous pourrons créer ensemble l'exploit brillant et sans précédent de la grande renaissance de la nation chinoise, puis travailler avec tous les pays et nations épris de paix pour rechercher la paix, la prospérité et le progrès dans le monde humain. Unissons-nous et travaillons ensemble pour cet objectif glorieux !"
chi_GR.19.a: "Meilleurs vœux"
chi_GR.20: "Une lettre aux compatriotes taïwanais"
chi_GR.20.t: "Lettre aux compatriotes de Taïwan"
chi_GR.20.d: "Chers compatriotes taïwanais : En 1945, après 14 années de guerre, le peuple chinois a remporté la victoire et a récupéré Taïwan des mains des impérialistes fascistes japonais. Le peuple taïwanais est également revenu dans les bras de la patrie. Cependant, depuis que le gouvernement réactionnaire du Kuomintang a pris le contrôle de Taïwan, il a longtemps imposé une terreur blanche dure et brutale au peuple taïwanais. Ainsi, le peuple taïwanais a été forcé de vivre dans l'obscurité extrême, la terreur et la faim. Le 28 février 1947, le peuple taïwanais s'est uni pour lutter contre les réactionnaires du Kuomintang pour sa survie et sa liberté de subsistance. À l'époque, les réactionnaires ont mobilisé un grand nombre de renforts depuis le continent pour les réprimer et ont trompé certains habitants de la province, de sorte que la lutte du « 28 février » a subi une défaite tragique, et plus de 10 000 martyrs héroïques sont morts sous le couteau des bouchers ennemis. L'échec du « 28 février » nous a appris que nous devons unir toute la province et tout le pays pour vaincre l'ennemi ; et lorsque la lutte est la plus intense, si nous vacillons, faisons des compromis et nourrissons des illusions sur l'ennemi, non seulement la lutte échouera, mais nous subirons également des sacrifices plus douloureux. C'est la leçon sanglante du « 28 février ». \n\nL'histoire de notre pays a connu des changements sans précédent. Les autorités taïwanaises ont ignoré le développement magnifique de la patrie pendant des décennies et la confiance nationale croissante, et ont séduit les impérialistes américains pour qu'ils continuent à les soutenir dans leur lutte désespérée. Les impérialistes américains ont également profité de cette occasion pour intensifier leur ingérence et leur contrôle sur Taïwan, tout en utilisant leurs laquais pour mener à bien le complot visant à exiger une « tutelle » ou une « indépendance » dans le but de transformer complètement Taïwan en une colonie de l'impérialisme américain. Cependant, le complot de collusion entre l'opposition à l'indépendance de Taïwan et l'impérialisme américain ne les sauvera jamais de leur chute finale. Aujourd'hui, la puissance révolutionnaire du peuple chinois est devenue d'une force sans précédent. Le peuple chinois dispose d'une Armée populaire de libération courageuse et invincible, et bénéficie du soutien du gouvernement populaire chinois, chaleureusement soutenu par le peuple de tout le pays et le camp de la paix et de la démocratie mondiale. Les 1,3 milliard de personnes du pays ont décidé de faire de la libération de Taïwan et de l'unification de toute la Chine la première tâche majeure, et sont prêtes à concentrer toutes leurs forces pour traverser la mer et anéantir les monstres et démons qui tentent de diviser Taïwan et libérer Taïwan. \n\nChers compatriotes de Taïwan : Le peuple taïwanais a une tradition révolutionnaire d'opposition à l'impérialisme japonais pendant les décennies de domination japonaise, en particulier dans la lutte du « 28 février » contre la domination réactionnaire du Kuomintang, le grand héroïsme qu'il a montré est digne de fierté et de développement. Aujourd'hui, nous devons une fois de plus mettre en avant cette glorieuse tradition révolutionnaire et l'expérience de la lutte héroïque du « 28 février » pour briser le complot de l'opposition à l'indépendance de Taïwan de Chiang et de l'impérialisme américain. La libération de Taïwan est inéluctable, le jour de la libération approche, et le moment pour les compatriotes taïwanais de se débarrasser de leur statut de colonie de l'impérialisme américain approche également. Par conséquent, nous devons saisir toutes les opportunités et toutes les conditions possibles pour affaiblir et désintégrer la puissance de l'impérialisme par tous les moyens. Nous devons nous souvenir des leçons du « 28 février » et nous unir pour nous opposer aux actions agressives des autorités taïwanaises et de l'impérialisme américain à Taïwan concernant le retrait des troupes, la collecte de céréales et la levée d'impôts. En même temps, nous devons être habiles à prendre toutes les mesures pour préserver notre force, renforcer notre puissance, et nous préparer à coopérer avec l'Armée populaire de libération pour accomplir conjointement la tâche de libérer Taïwan. \n\nLes martyrs qui sont morts héroïquement dans la lutte du « 28 février » vivront à jamais ! \n\nVive la République populaire de Chine ! \n\nVive le gouvernement central populaire ! \n\nVive l'Armée populaire de libération ! \n\nVive le Parti communiste chinois ! \n\nVive le peuple chinois !!!"
chi_GR.20.a: "Notre équipe avance vers le soleil !"
chi_GR.21: "Implications"
chi_GR.21.t: "Implications"
chi_GR.21.d: "En marchant sur cette route, peu de gens savent que, juste en dessous, des milliers de constructeurs ont travaillé jour et nuit, progressant à rebours du calendrier. En moins de trois ans, une immense artère d'approvisionnement en eau a été construite et mise en service. Récemment, discrètement, cette « artère » a également subi son dernier « examen médical » avant que l'eau de la rivière n'entre à Pékin cet automne. \n\nDepuis le réservoir de Daning, un canal s'étend vers le nord. À partir du pont de Yuegezhuang, il se connecte au tunnel du pont Lugou, descend jusqu'au réservoir du lac Tuancheng, le terminal d'approvisionnement en eau, et entre dans le tunnel de la quatrième rocade ouest. C'est la section la plus exigeante et techniquement difficile du canal principal du projet de transfert d'eau Sud-Nord à Pékin, avec une longueur totale de 12,64 kilomètres. L'entrée du tunnel se trouve au coin sud-ouest de l'échangeur de la route Yongding sur l'autoroute Pékin-Hong Kong-Macao. « Normalement, il y a de l'eau dedans, et on ne peut pas y descendre. Vous êtes bien pressé ! » \n\nLiu Qiusheng, responsable de la gestion du projet du tunnel de la quatrième rocade ouest, a emmené le journaliste sur le site. « Le tunnel a été achevé le 23 novembre 2007. Depuis que le réservoir de Huangbi Zhuang a commencé à fournir de l'eau à Pékin en 2008, il est en fonctionnement. Il est surveillé tous les jours et fonctionne bien. Cette fois, pour accueillir l'arrivée imminente de l'eau de la rivière, un grand 'examen médical' est requis. » Nous sommes descendus étape par étape par le puits de maintenance, puis par quatre sections d'échelles en fer de 15 marches, et sommes entrés dans le tunnel. Le diamètre intérieur du tunnel est de 3,8 mètres, plat au fond et voûté au sommet, assez large pour qu'une voiture puisse y circuler ; le corps du tunnel, en béton armé, est lisse et sans joints, et il n'y a presque pas de « surface en nid d'abeille » ; pour l'« examen médical », l'eau dans le tunnel a été vidangée, et il ne reste qu'une faible accumulation d'eau, claire et transparente. \n\nLes cris du personnel de maintenance se font entendre de temps en temps, et le tunnel sombre résonne en continu. Ils utilisent des télémètres laser pour mesurer les distances et les marquer. Liu Qiusheng a tapé sur la paroi du tunnel : « La surface du béton armé est recouverte d'une couche protectrice de 5 centimètres d'épaisseur. C'est comme un 'manteau imperméable' qui empêche les barres d'acier de rouiller et de perdre de la pression lorsqu'elles rencontrent l'eau. L'instrument peut indiquer l'épaisseur de la couche protectrice lorsqu'il est allumé. Si elle est trop fine, il faut l'épaissir rapidement ! » \n\n« Dans les prochains jours, plusieurs groupes de personnes viendront vérifier. Hier, c'était dimanche, et les experts en hydraulique sont venus inspecter la qualité. Quand ils sont sortis, ils étaient tous très excités. La qualité a passé le test ! » Liu Qiusheng a poussé un soupir de soulagement. \n\nQiu Wenshun, directeur du Centre de transfert d'eau Sud-Nord de la ville, a personnellement suivi tout le processus de construction du tunnel de la quatrième rocade ouest. À l'époque, il était directeur du département du projet de tunnel. « C'est la première fois au monde qu'un tunnel de transfert d'eau à longue distance et à grande échelle est creusé directement sous une autoroute urbaine. Au-dessus, le métro ou le chemin de fer passe à toute vitesse ; en dessous, il y a un réseau complexe de canalisations souterraines, d'approvisionnement en eau, de drainage, de chauffage, d'électricité, de communications... De temps en temps, ils heurtaient des pieux de pont bloquant la route. Il n'est pas facile de s'assurer que 'l'eau du puits n'interfère pas avec l'eau de la rivière' ! »"
chi_GR.21.a: "(À suivre)"
chi_GR.22: "Implication"
chi_GR.22.t: "Implications"
chi_GR.22.d: "La partie la plus difficile est lorsque le tunnel passe sous la station de métro Wukesong. Le sommet du tunnel n'est qu'à 3,67 mètres du plancher de la station de métro. Pour garantir le fonctionnement normal du métro, les experts ont fixé une limite : la subsidence doit être contrôlée à moins de 5 mm ! \n\nLa quatrième rocade est remplie de voitures, et la station de métro Wukesong en dessous est bondée de piétons. Plus bas – à plus de 20 mètres au-dessus du sol, se trouve un chantier de construction animé. La construction adopte la méthode de l'excavation souterraine peu profonde, qui consiste à creuser discrètement divers types de chambres de tunnel sous terre près de la surface. L'objectif est de « préserver la route, maintenir la circulation et ne pas déranger les habitants ». \n\nLes grandes machines ne pouvaient pas descendre, donc tous les quelques pas, un puits vertical de plus de dix mètres de profondeur devait être creusé. Les travailleurs descendaient dans le puits et creusaient soigneusement des trous et pelletaient la terre avec des pioches et des pelles. Ils utilisaient les méthodes et outils les plus primitifs pour avancer mètre par mètre, coulant le béton au fur et à mesure de l'excavation. L'équipe de construction a divisé le métro en trois couches, inséré 124 tuyaux en acier de 15 mètres de long et de 110 mm de diamètre, puis coulé du coulis de ciment pour renforcer, créant une « colonne vertébrale en acier » de 25 mètres de long, 16 mètres de large et 3,67 mètres de haut, qui soutenait fermement l'immense station de métro et contrôlait rigoureusement la valeur de subsidence. Pendant les 190 jours de construction, la valeur maximale de subsidence surveillée était inférieure à 3 mm. \n\nLe tunnel de la quatrième rocade ouest a finalement été achevé avec un impressionnant record de « zéro accident », mais la surveillance en temps réel de ce grand projet ne s'est jamais arrêtée. \n\nDans le coin sud-ouest du pont Wukesong, sur une étroite bande verte à côté de la quatrième rocade ouest, il y a une boîte en fer grise d'environ 1 mètre de haut, qui est ouverte tous les 3 jours. Zhihong, ingénieur senior à l'Institut municipal de recherche en sciences et technologies de l'eau, l'a ouverte et a regardé en dessous. Sous la boîte se trouvait un puits vertical laissé pendant la construction, et un gros faisceau de câbles en sortait. \n\nAu total, 68 câbles ! Sous le pont Wukesong, le tunnel est équipé d'instruments de l'intérieur à l'extérieur et de haut en bas, et chaque instrument est relié à un câble. Lorsque les capteurs sont connectés aux câbles un par un, ils peuvent fournir une série de données, telles que la contrainte des barres d'acier, la déformation du béton, la déformation des roches environnantes, etc. Zhihong a déclaré que l'analyse complète de ces données constitue le « rapport d'examen médical » de la section Wukesong du tunnel de la quatrième rocade ouest. \n\nIl y a 13 points de surveillance de sécurité de ce type le long du tunnel de la quatrième rocade ouest. Zhihong et ses collègues ont formé une équipe de dix personnes, responsable de la collecte, de l'analyse et du rapport des données. « Le projet est solide comme un roc, mais nous devons rester vigilants ! » \n\nLe poète Ye Yanbin l'a autrefois loué avec des vers inspirants : « Un immense tube de perfusion a été inséré dans les anneaux annuels de Pékin, et cet arbre sacré millénaire de Pékin devient vert et luxuriant... »"
chi_GR.22.a: "Maman, l'eau ne s'arrêtera pas de couler !"
chi_GR.23: "Grain impérial et taxe nationale"
chi_GR.23.t: "Grain impérial et taxe nationale"
chi_GR.23.d: "Tôt le matin, You Wenfu a personnellement retiré l'enseigne de la « Section de gestion de la taxe agricole » de son département. C'est une petite partie de la mise en œuvre par leur bureau de la politique gouvernementale de « suppression de la taxe agricole ». You Wenfu est un employé du Bureau des impôts locaux du district de Yanqing à Pékin. Il est l'une des premières personnes dans le pays à « retirer l'enseigne » ce matin, car c'est Pékin qui a lancé le projet pilote de suppression de la taxe agricole. En regardant l'enseigne dans sa main, déjà un peu rouillée, You Wenfu a ressenti une certaine émotion. \n\nAprès tant d'années de travail, ce qui a le plus marqué You Wenfu, c'est cette fois où lui et ses collègues collectaient des impôts dans un village. Une vieille dame, vivant dans des conditions familiales difficiles, tremblait en apportant un panier d'œufs pour payer la taxe agricole. You Wenfu a dit à son collègue : « Pouvons-nous l'exempter un peu ? C'est probablement une famille pauvre. » Le collègue a parcouru la liste des familles pauvres locales et est resté silencieux un moment : « Il semble que son nom n'y figure pas... et même s'il y était, on ne peut pas l'exempter, tu le sais. » You Wenfu le savait dans son cœur, mais il n'a pas pu s'empêcher de demander : « Tante, pourquoi votre nom n'est-il pas sur la liste ? » \n\n« Camarade, je n'ai vraiment pas l'argent pour faire une demande. J'ai entendu qu'il faut payer plusieurs milliers au secrétaire du parti du village pour être reconnu comme foyer en difficulté. Vous voyez, je ne peux même pas payer cette taxe, comment pourrais-je faire une demande ? Ces œufs sont la dernière chose de valeur dans ma famille. Je voulais les donner à mon petit-fils pour son anniversaire, mais le grain public ne peut pas être réduit. Pouvez-vous voir si ces œufs peuvent compenser la taxe ? Les choses du village ne valent pas grand-chose, mais ce sont bien des œufs pondus par les poules élevées chez moi. Ils sont délicieux ! » \n\nYou Wenfu travaille sur la taxe agricole depuis de nombreuses années, et il vit presque tous les jours dans la tourmente. Prendre les billets froissés des vieux agriculteurs qui font face à la terre et au ciel, il a l'impression que ses mains sont en feu. Maintenant, il n'a plus à subir cette tourmente. Après l'abolition de la taxe agricole, il devrait être transféré dans un autre département. Il a soigneusement essuyé l'enseigne de son département, l'a enveloppée dans un tissu et l'a placée dans l'entrepôt. « Dans le processus de réforme nationale, je joue le rôle d'un témoin. » You Wenfu a écrit dans son journal le soir : « Je me sens très honoré. » \n\nDepuis la réforme et l'ouverture, l'abolition de la taxe agricole est un exemple de la réforme fiscale chinoise. Au cours des 40 dernières années, la Chine a mis en œuvre des mesures de réforme telles que « du profit à l'impôt », « la réforme du partage fiscal » et « de la taxe sur le chiffre d'affaires à la taxe sur la valeur ajoutée », et la réforme fiscale s'est constamment approfondie. L'histoire de You Wenfu n'est qu'un microcosme. Bientôt, d'innombrables You Wenfu retireront les enseignes de leurs départements à travers toute la Chine."
chi_GR.23.a: "La taxe agricole, collectée pendant 2600 ans, ne sera plus collectée"
chi_GR.24: "La science et l'éducation renforcent le pays"
chi_GR.24.t: "La science et l'éducation renforcent le pays"
chi_GR.24.d: "En novembre 1998, le camarade Jiang Zemin a visité la Russie et a prononcé un discours sur la science et la technologie lors de sa visite à la Cité des sciences de Novossibirsk, attirant une large attention de la communauté internationale. Dans ce discours, le camarade Jiang Zemin a comparé la science et la technologie à la « lanterne » de la sagesse humaine. Il a déclaré : « La sagesse humaine est infinie. La science et la technologie, en tant que lanterne brillante de cette sagesse, continuent d'éclairer à travers les couches de montagnes vers des sommets plus élevés grâce au travail acharné d'innombrables scientifiques. » \n\nDès 1991, le camarade Jiang Zemin avait souligné que nous sommes dans une période historique importante de transition entre l'ancien et le nouveau siècle. En 1993, il a ajouté que trois ans s'étaient écoulés depuis les années 1990, et qu'il ne restait que sept ans avant le XXIe siècle. Comment entrer dans le XXIe siècle et comment développer la science et la technologie de notre pays ? C'est une tâche importante qui doit être étudiée et résolue de toute urgence. \n\nEn mai 1995, le Comité central du PCC et le Conseil d'État ont pris la « Décision sur l'accélération des progrès de la science et de la technologie » et ont convoqué une conférence sur la science et la technologie, proposant clairement la stratégie de « revitalisation du pays par la science et l'éducation ». Le camarade Jiang Zemin a prononcé un discours lors de la conférence, exposant de manière exhaustive le contenu, l'importance et les questions à saisir de la stratégie de revitalisation du pays par la science et l'éducation. La décision stratégique de « revitalisation du pays par la science et l'éducation » est un développement majeur de la théorie de Deng Xiaoping par le Comité central du PCC, avec le camarade Jiang Zemin comme noyau, et constitue l'une des déploiements stratégiques les plus importants pour le nouveau siècle. « La mise en œuvre complète de la stratégie de revitalisation du pays par la science et l'éducation, la promotion vigoureuse du progrès scientifique et technologique, et le renforcement de l'innovation scientifique et technologique sont des événements majeurs liés à la prospérité de la patrie et à la renaissance de la nation. » C'est une grande tâche stratégique pour les nombreux travailleurs scientifiques et technologiques et les camarades de tous les fronts à travers le pays de saisir les opportunités, de s'efforcer de réaliser des progrès décisifs dans le progrès scientifique et technologique et l'innovation, et de donner un élan plus fort à la promotion globale de la construction du socialisme à la chinoise. \n\nAujourd'hui, alors que l'humanité entre dans le nouveau siècle, en observant le développement rapide de la révolution scientifique et technologique mondiale, nous ressentons l'importance et l'urgence de proposer et de mettre en œuvre la stratégie de revitalisation du pays par la science et l'éducation. Ce n'est qu'en saisissant fermement le pouvoir de la science et de la technologie que notre cause pourra avancer vers la gloire et que la mission historique de la grande renaissance de la nation chinoise pourra être véritablement réalisée."
chi_GR.24.a: "Mille rochers et vallées ne sont pas épargnés, ce n'est qu'en regardant loin qu'on sait d'où ils viennent\n\nComment retenir les ruisseaux, ils retourneront finalement à la mer et deviendront des vagues"
chi_GR.25: "Tête de pont"
chi_GR.25.t: "Tête de pont"
chi_GR.25.d: "Dès qu'il est descendu de l'avion, le président a ressenti la chaleur du Guangdong. C'était juste après le Nouvel An chinois, et la plupart des régions du pays étaient encore en hiver, mais le Guangdong bénéficiait d'une température constante toute l'année, et beaucoup de gens dans la rue portaient des vêtements légers. En regardant ces personnes habillées légèrement, le président a trouvé que son costume était un peu épais et chaud. \n\nGaozhou est une ville de niveau comté sous la juridiction de la ville de Maoming. Elle est située au carrefour des transports du Guangdong occidental et du Guangxi oriental. La brise printanière de la réforme et de l'ouverture a déjà soufflé ici. Chaque jour, d'innombrables activités de production et de commerce y ont lieu, et la richesse afflue et s'écoule. C'est un pilote pour la réforme financière des comtés directement administrés dans la province du Guangdong. Le président est venu à Gaozhou cette fois pour inspecter la situation de production des petites villes du Guangdong. \n\nLes rues avaient été dégagées à l'avance, et aucun badaud n'y restait. Seuls, au loin, à la barrière de circulation entourée par la police, quelques personnes tendaient le cou pour regarder. Ils ne savaient pas quel grand fonctionnaire était venu dans ce petit endroit. Ils voyaient seulement un grand groupe de personnes en costume entourant un petit vieillard qui agitait constamment les mains, marchant et s'arrêtant. Les journalistes à ses côtés le suivaient et prenaient des photos sans arrêt, et le brouhaha des conversations et le bruit des obturateurs résonnaient sans cesse. \n\nLors de la visite de l'usine de transformation de vêtements, le président s'est intéressé à un jeune homme qui travaillait dur et s'est arrêté à côté pour le regarder travailler attentivement. Le jeune homme ne reconnaissait pas le président, mais il savait que le vieillard à côté de lui était une personnalité importante avec un groupe de fonctionnaires, alors il avait très peur et ses mains tremblaient. « Oh, ne t'inquiète pas pour moi, tiens bien les choses et fais ton travail correctement. Regarde, tu as abîmé un autre morceau de tissu, tu vas être sanctionné ! » Le président a tapoté l'épaule du jeune homme. Le jeune homme a touché sa tête avec embarras, a pris une profonde inspiration, puis a habilement cousu la taille d'un vêtement semi-fini noir et l'a placé dans un panier à côté de lui – il y avait déjà un panier rempli des fruits de son labeur. \n\nAu Guangdong, le temps, c'est de l'argent, l'efficacité, c'est la vie, l'usine est le cœur du Guangdong, et la commande du grossiste est la lifeline du Guangdong. Le Guangdong est le plus grand centre de fabrication du pays, une tête de pont et une avant-garde incontestée de l'esprit de réforme et d'ouverture, et un synonyme de productivité et d'efficacité. Le président l'a ressenti encore plus profondément après être venu ici. Le soir, le président a prononcé un discours important lors de la Conférence sur l'éducation aux « trois discours » pour les cadres dirigeants à Gaozhou : « En résumant l'histoire du Parti communiste chinois pendant plus de 70 ans, nous pouvons tirer une conclusion importante, à savoir : la raison pour laquelle le Parti communiste chinois a gagné le soutien du peuple est que le Parti communiste chinois a toujours représenté les exigences de développement des forces productives avancées de la Chine, représenté la direction de la culture avancée de la Chine, et représenté les intérêts fondamentaux de la grande majorité du peuple chinois dans diverses périodes historiques de révolution, de construction et de réforme, et, à travers la formulation de lignes, principes et politiques corrects, il a travaillé sans relâche pour réaliser les intérêts fondamentaux du pays et du peuple. »"
chi_GR.25.a: "Si vous avez la volonté de déplacer les montagnes, vous pouvez les changer. Pourquoi s'inquiéter de ne pas voir vos réalisations inscrites dans l'histoire ?"
chi_GR.26: "La proposition de Wen Jiabao"
chi_GR.26.t: "La proposition de Wen Jiabao"
chi_GR.26.d: "Pékin est située à la lisière de la plaine de Chine du Nord, avec des montagnes au nord et les plaines centrales au sud. Ici, l'esprit et les perspectives des gens s'élargissent involontairement, et leur horizon s'élargit naturellement. Cependant, le climat ici n'est pas très clément pour certaines personnes. Après que Hu Jintao a pris ses fonctions de président, il était presque tous les jours occupé à traiter les affaires gouvernementales et à visiter divers endroits. Parfois, rester à Pékin rendait cet homme du sud irritable, surtout en hiver et au printemps, lorsque l'air sec et le sable dans le vent le mettaient toujours mal à l'aise pendant plusieurs jours. \n\nComparé à l'embarras de Hu Jintao, Wen Jiabao, né à Tianjin, était beaucoup plus détendu. Il a maintenant envoyé un plan de développement écrit au président dans son bureau. « Je suis allé dans quelques zones typiques récemment, j'ai enquêté sur la situation de développement dans divers endroits, et j'ai élaboré ce plan de développement en gros. » Wen Jiabao a ouvert le dossier et l'a étalé devant Hu Jintao, « Le pays peut maintenant être grossièrement divisé en quatre régions, à savoir l'est, le centre, l'ouest et le nord-est. Ces quatre régions ont des situations différentes, des ressources politiques et économiques différentes, et des directions de développement adaptées différentes. La région est a un bon développement économique et un élan suffisant, mais la circulation des éléments de ressources est un gros problème. La région ouest a un transport en retard et un élan de croissance économique faible. La région centrale a été négligée pendant longtemps, mais c'est une région avec une main-d'œuvre intensive et un marché potentiel énorme. La région nord-est a une bonne base industrielle et de bonnes conditions naturelles, mais manque de points de croissance économique pour un développement ultérieur. Nous pouvons mettre en œuvre différents plans de développement dans différentes régions. » \n\n« Bien, très détaillé. Nous pouvons commencer par l'est, où les conditions de marché et de production sont meilleures. Après avoir accumulé de l'expérience, nous pouvons travailler dans les régions centrale, nord-est et ouest. Nous pouvons également utiliser les ressources économiques existantes dans la région est pour aider à exploiter davantage de parts de marché intérieur. » Hu Jintao a marqué quelques endroits sur le document avec un stylo, « Les régions ouest devraient ouvrir davantage de projets gouvernementaux. Non seulement le capital n'y va pas activement, mais les ressources humaines risquent également de se perdre facilement. La région nord-est devrait d'abord assainir l'environnement des affaires, sinon les gens n'y investiront pas. Il y a eu une situation relativement déprimée après la vague de licenciements. La région centrale devrait élargir la demande intérieure locale, ouvrir un énorme marché de niche, et encourager les travailleurs migrants à retourner chez eux pour créer des entreprises, comme les provinces exportatrices de main-d'œuvre telles que Hunan et Henan. Si le travail dans ces domaines peut être bien fait selon le plan, le travail économique peut être bien fait. » \n\nWen Jiabao a hoché la tête et a répondu : « Il est toujours nécessaire de se concentrer sur la planification et de ne pas intervenir trop directement. Les gouvernements locaux manquent d'expérience pour coordonner un travail régional aussi vaste, et une intervention directe peut facilement entraîner un chaos de gestion. »"
chi_GR.26.a: "Arrêtez de faire des problèmes"
chi_GR.27: "La réponse de Liu Changyun"
chi_GR.27.t: "La réponse de Liu Changyun"
chi_GR.27.d: "« Frère, je peux suivre des cours d'informatique dans cette école à Shenzhen. Maintenant, je t'écris un courriel devant l'ordinateur ! Mais je ne suis pas très doué pour taper. Ce courriel a en fait été tapé par le professeur Luo. Les ordinateurs de l'école sont vraiment grands ! Mais comparés à la télévision à la maison, la taille de cet écran d'ordinateur est encore petite. Le professeur Luo a dit qu'un ordinateur ordinaire comme celui-ci peut effectuer des centaines de milliers de calculs par seconde ! Si j'utilise l'ordinateur pour faire mes devoirs, je n'aurai plus à m'asseoir à la table le soir. (Veuillez rappeler aux parents d'encourager cet enfant à faire ses devoirs le soir. Professeur Luo.) \n\nFrère, je ne comprends pas vraiment ce que tu as dit à propos du millénaire. Le professeur Luo a dit qu'après 2000, c'est le millénaire. Une année a-t-elle une signification particulière ? Cependant, le professeur Luo a mentionné quelque chose appelé le « bogue du millénaire », qui semble très effrayant et qui pourrait dévorer l'ordinateur et le faire planter. (Je lui parlerai à nouveau du bogue du millénaire plus tard. Professeur Luo.) Les ordinateurs doivent aussi être « nettoyés » et « désinfectés ». Frère, si tu achètes un ordinateur à l'avenir, tu dois toujours faire attention à le nettoyer pour qu'il ne soit pas mangé par des insectes ! \n\nShenzhen ne semble pas avoir de produits spéciaux, mais j'aime le riz aux pieds de porc dans la ruelle devant l'école, et les rouleaux de nouilles de riz dans la boutique d'à côté sont aussi délicieux. Je n'ai pas ces choses dans ma ville natale, mais il est aussi difficile de voir des boutiques de nouilles de riz de ma ville natale ici. On dit que les gens ici passent beaucoup de temps à boire du thé le matin, mais aucun de mes camarades de classe ne boit de thé le matin. La plupart d'entre eux prennent leur petit-déjeuner à la maison ou achètent du pain à manger. Je ne comprends pas ce que disent beaucoup de gens ici, mais heureusement, la plupart de mes camarades de classe viennent d'ailleurs, comme moi. Tout le monde parle mandarin, et les professeurs parlent aussi mandarin, ce qui est complètement différent de l'école dans ma ville natale. Les camarades de classe sont très amicaux, et il n'y a pas de brute comme celle de l'école dans ma ville natale, probablement parce que tout le monde ne se connaît pas encore. J'aime beaucoup cet endroit. Les professeurs et les camarades de classe sont très gentils, et l'équipement de l'école est aussi très neuf. Frère, viens me rendre visite quand tu viendras à Shenzhen. \n\n(Liu Changyun se comporte bien à l'école, s'entend bien avec ses camarades de classe et a de bonnes relations interpersonnelles. Parents, soyez rassurés. Professeur Luo.) »"
chi_GR.27.a: "Chérie, 3 janvier 2000"
chi_GR.28: "Brioches à la viande"
chi_GR.28.t: "Brioches à la viande"
chi_GR.28.d: "La gare était animée par une foule de gens. Alors que le train vert grondait en entrant en gare et s'arrêtait lentement, les passagers du train sortaient en file indienne comme des sardines, avec leurs sacs grands et petits dans les mains ou sur les épaules. La gare de Guangzhou gère un énorme nombre de passagers à chaque instant, et aujourd'hui, Li Cheng en fait partie. Li Cheng a pris un train toute la nuit et est venu à Guangzhou depuis sa ville natale pour trouver un emploi. Li Cheng avait peur de ne pas trouver d'endroit où loger pendant un certain temps, alors il avait apporté une couverture supplémentaire, et si ça ne marchait pas, il pourrait trouver un espace ouvert pour passer la nuit. \n\nÀ l'origine, ses parents voulaient qu'il aille au Guangdong après le Nouvel An chinois, mais Li Cheng ne pouvait pas rester là-bas une minute de plus. Il voulait juste trouver un emploi au Guangdong le plus vite possible, puis gagner assez d'argent pour acheter une maison dans le comté de sa ville natale grâce à ses propres efforts, ainsi que la dot pour se marier. Il ne voulait pas rester dans le village pour cultiver toute sa vie, même si sa famille était composée d'honnêtes agriculteurs depuis des générations. Quand Li Cheng allait dans la ville du comté quand il était enfant, il avait entendu dire que les gens de la ville mangeaient des brioches à la viande et buvaient du lait de soja tous les matins, mais sa famille ne mangeait des brioches à la viande et du lait de soja qu'une ou deux fois par an. À l'époque, Li Cheng avait juré de vivre en ville, et même s'il ne pouvait pas devenir un citadin, il mangerait des brioches à la viande tous les jours. \n\nÀ ce moment-là, il s'est perdu dans l'immense gare. Il a timidement demandé son chemin à un membre du personnel. Le membre du personnel a pointé une direction et s'est éloigné avec son talkie-walkie. Li Cheng a marché dans la direction indiquée, mais a constaté qu'il était arrivé dans une zone encore plus grande et plus bondée. Il y avait de grands trous partout, mais ils étaient bloqués et n'étaient manifestement pas la sortie. Il a vu une boutique pas loin, qui vendait toutes sortes de nourriture et de thé. Il y avait visiblement des brioches chaudes dans le cuiseur à vapeur qui dégageait de la fumée. Li Cheng s'est approché rapidement, mais il s'est arrêté immédiatement en voyant le panneau avec les prix inscrits. \n\nUne brioche coûte autant d'argent ? Une bouteille d'eau coûte trois yuans ? Pourquoi ne pas voler l'argent ! Li Cheng a fait la moue, a fixé le panneau des prix et a dégluti. Il a touché à nouveau les billets dans sa poche, et finalement s'est retourné et est parti."
chi_GR.28.a: "Un sou peut faire tomber un héros"
chi_GR.29: "Recherche d'emploi"
chi_GR.29.t: "Recherche d'emploi"
chi_GR.29.d: "Errant dans les rues de Guangzhou, bien que ses vêtements soient déjà sales et ses cheveux brillants d'huile, Li Cheng ne se préoccupait pas de ces choses. Il y a dix jours, il est sorti de la gare et a été arrêté par un homme en veste de cuir. L'homme en veste de cuir a dit qu'il recrutait des gens et a demandé à Li Cheng s'il voulait trouver un emploi. Li Cheng a accepté avec empressement et a suivi l'homme dans la voiture avec ses sacs. Il y avait déjà beaucoup de jeunes hommes de son âge dans la voiture. À en juger par leurs vêtements et leurs bagages, ils devaient aussi être des travailleurs migrants. Peu de temps après, l'homme en veste de cuir a ramassé beaucoup de jeunes hommes et deux filles, et ils étaient tous assis dans la voiture. L'homme en veste de cuir est finalement monté dans la voiture, s'est assis sur le siège du copilote, s'est retourné et a dit à Li Cheng et aux autres : « Nous sommes une usine qui fabrique des vêtements Huzhuang. Nous manquons de travailleurs. Le patron m'a demandé de trouver des gens. Quand vous arriverez au département, demandez simplement le salaire au patron. La nourriture et le logement sont fournis. Travaillez et soyez payés. » \n\n« Combien est le salaire ? Comment est-il payé ? Paiement mensuel ou règlement quotidien ? » a demandé un jeune local à côté de Li Cheng. \n\n« Ne vous inquiétez pas, cinq centimes par jour, nous réglerons les comptes ensemble le week-end, et vous ne perdrez pas un sou. » L'homme en veste de cuir a agité la main. Li Cheng ne comprenait pas tout à fait ce qu'ils disaient, mais il a compris le mot « salaire ». Voyant que personne d'autre ne posait plus de questions, il semblait qu'il n'y avait pas de problème. \n\nL'usine était dans un endroit très reculé, mais à peine dans la ville – ou à la frontière entre la ville et la campagne. Après être entrés, l'homme en veste de cuir a pris une voiture et est parti, laissant le groupe attendre dans l'usine. Bientôt, un homme qui ressemblait au patron est arrivé. L'homme portait une chemise à fleurs, une paire de lunettes de soleil, et un sac en cuir noir sous le bras. Le patron les a emmenés dans l'usine et les a confiés à un homme au visage de singe à nez pointu et à l'air menaçant, puis il a pris une voiture et est parti, emmenant une fille qui était venue avec eux. \n\nLi Cheng ne se souvenait plus combien de jours il avait travaillé là-dedans. Il travaillait sur la machine à coudre tous les jours, du matin au soir, et ne pouvait se reposer que quelques minutes lorsqu'il allait manger. La nourriture était la chose la plus dégoûtante que Li Cheng ait jamais mangée de sa vie. Li Cheng a tout enduré, mais quand il s'agissait de payer, le gars au menton pointu et au visage de singe a appelé quelques gardes de sécurité féroces pour le battre. Li Cheng a suivi le camion de livraison pour sortir de l'usine cette nuit-là, mais le prix à payer était la perte de tous ses bagages – pour être précis, quelques couvertures. \n\nIl est allé au poste de police pour signaler l'incident, mais l'homme qui ressemblait à un policier l'a juste regardé et lui a dit de rentrer chez lui et d'attendre le résultat. Li Cheng ne peut maintenant qu'errer dans les rues. Il a entendu dire qu'il y avait un endroit appelé le marché du travail où il pouvait trouver un emploi décent, alors il prévoit d'y tenter sa chance. Mais il faut beaucoup de temps pour y aller à pied, et il devra peut-être dormir dans la rue pendant quelques jours. Cependant, son estomac est déjà très affamé. Li Cheng n'aurait jamais rêvé qu'après être venu en ville pendant plus de dix jours, non seulement il n'a pas mangé de brioches à la viande, mais il a aussi été battu et a perdu tous ses bagages par la même occasion."
chi_GR.29.a: "C'est ça, le Guangdong ?"
chi_GR.30: "Travail ?"
chi_GR.30.t: "Travail ?"
chi_GR.30.d: "Je ne sais pas combien de jours ont passé. Li Cheng a erré dans Guangzhou, s'arrêtant et repartant, et a finalement atteint le marché du travail de la ville de Shiling, à Guangzhou. Pendant ces jours, il a découvert qu'un magasin avec un vieil homme étranger à barbe blanche imprimé dessus jetait de la nourriture dans la poubelle à l'arrière à la nuit. Quand il ouvrait le sac en papier huilé, il découvrait que la nourriture était des cuisses de poulet frites froides et autres, et elles n'étaient même pas encore gâtées. Les gens de la ville gaspillent-ils la nourriture comme ça ? Li Cheng s'est assis près de la poubelle, se régalant tout en réfléchissant profondément. Si n'importe quel magasin en ville peut jeter des cuisses de poulet directement, alors à quoi bon fouiller dans les poubelles ? \n\nLi Cheng dormait dans le parc ou sous le pont la nuit. Bien que ce soit l'hiver, le temps au Guangdong était vraiment chaud, et Li Cheng pouvait s'endormir paisiblement sans se couvrir d'une couverture. La seule chose gênante était qu'il y avait beaucoup de gros camions qui roulaient à toute vitesse sur la route, faisant un bruit scandaleux qui pénétrait directement dans le cœur des gens et empêchait de dormir. Une fois, Li Cheng s'est levé au milieu de la nuit pour uriner et a vu un couple bien habillé faire l'amour passionnément non loin de là. Quand Li Cheng a compris ce que les deux faisaient, il s'est enfui de honte. Bon sang, les gens de la ville s'amusent vraiment ! Quelle impudeur ! \n\nDevant le marché du travail de la ville de Shiling, il y a un viaduc. Li Cheng a traversé la route et a enfin vu les mots « Marché du travail occasionnel de la ville de Shiling ». À ce moment-là, il y avait déjà une foule de gens, et beaucoup de têtes s'entassaient, certaines longues, certaines courtes, certaines noires, certaines blanches, formant un tableau spectaculaire. Il semble que ce soient tous des gens à la recherche de travail. Li Cheng s'est souvenu de ce que son père lui avait dit un jour. \n\n« Cheng, souviens-toi simplement que les bonnes choses dans le monde doivent être recherchées par les gens, et si tout le monde vient à toi, ce n'est sûrement pas une bonne chose. » \n\nL'exemple de l'homme en veste de cuir à la gare ne pouvait pas être plus parlant. Li Cheng regrettait de ne pas avoir suivi les conseils de son père. Maintenant, Li Cheng voulait aussi se mêler à la foule pour trouver quelque chose à faire."
chi_GR.30.a: "C'est ça, le Guangdong."
chi_GR.31: "Usine textile"
chi_GR.31.t: "Usine textile"
chi_GR.31.d: "L'atelier textile bourdonnait du bruit des travailleurs textiles qui concentraient leur attention sur leur travail. Li Cheng ne travaillait que depuis une semaine, mais il était déjà un ouvrier textile qualifié. Il cousait rapidement et bien, et il pouvait endurer les épreuves. Il travaillait dur quand les autres discutaient, quand les autres se lavaient les pieds, et quand les autres se reposaient. La contremaîtresse était une femme d'âge moyen, une locale, qui parlait avec un fort accent cantonais, portait une queue de cheval, et s'appelait Chen. La contremaîtresse Chen était très impressionnée par le nouveau et lui donnait parfois une partie de la soupe qu'elle partageait avec sa fille. Li Cheng trouvait aussi que cette contremaîtresse était très gentille et ne parlait jamais d'elle dans son dos avec les autres travailleurs. \n\nAu début, Li Cheng est resté au marché du travail pendant quelques jours. Parce qu'il était honnête, pas très bavard et peu familier avec l'endroit, il était un peu timide et ne pouvait pas trouver un « patron » prêt à l'embaucher. Quand la contremaîtresse Chen l'a trouvé, il dévorait les brioches cuites à la vapeur que lui avait données un compagnon de travail de la même ville natale. \n\n« Vous deux, vous voulez travailler ? » \n\nLi Cheng était très satisfait de son dortoir. Bien qu'il soit petit, mal ventilé et presque sans lumière, il lui donnait au moins un point d'ancrage à Guangzhou. C'était la maison à loyer modique que la contremaîtresse Chen lui avait trouvée. La personne responsable de l'immeuble était une petite fille qui était au collège. On disait qu'elle était la fille illégitime du propriétaire. Pour Li Cheng, cette pièce était tout à fait compétente comme lieu de repos. Bien que l'isolation phonique soit un peu mauvaise – il pouvait toujours entendre clairement le bruit des chasses d'eau, la toux des voisins, et les sons des hommes et des femmes faisant l'amour – c'était suffisant pour dormir et se reposer. Aujourd'hui, Li Cheng est passé d'une personne démunie errant dans les rues à un travailleur autonome. Son père avait dit un jour que le travail était le plus glorieux, et maintenant Li Cheng était aussi un fils glorieux."
chi_GR.31.a: "Patron, donnez-moi trois brioches à la viande !\nNon, cinq !"
chi_GR.32: "L'enfer sur terre"
chi_GR.32.t: "L'enfer sur terre"
chi_GR.32.d: "Pleurs, cris, hurlements, effondrement, pas... Quand Hu Jintao est réellement arrivé sur le site du désastre sismique, le chaos devant lui lui a brisé le cœur. Certains immeubles résidentiels, ateliers d'usine et dortoirs de cette ville ont été gravement endommagés par le tremblement de terre, certains se sont complètement effondrés, et d'autres se sont tordus et déformés. Les soldats d'une certaine unité aéroportée et les pompiers de la sécurité publique du Henan utilisaient divers équipements de sauvetage pour rechercher des survivants. Une personne ensanglantée venait d'être sortie des ruines par les pompiers. Hu Jintao a rapidement grimpé au sommet des ruines pour inspecter le site de sauvetage, demandant anxieusement des nouvelles des victimes et du traitement des blessés. \n\n« Camarade, continuez à respirer, ne vous endormez pas, tenez bon ! » Hu Jintao a exhorté avec douleur à côté du blessé couvert de sang et de poussière, puis il a été poussé sur le côté par les secouristes à proximité. \n\n« La priorité absolue est toujours de sauver des vies. Tant qu'il y a une lueur d'espoir, nous devons tout faire pour secourir. Des mesures doivent être prises pour s'assurer que l'équipe de secours entre dans tous les villages le plus tôt possible après avoir atteint toutes les villes. » Alors que Hu Jintao donnait des instructions au personnel, une petite fille est entrée sans ménagement dans la tente de fortune. Le personnel à proximité voulait emmener la petite fille avec embarras. Quand Hu Jintao l'a vue, il s'est approché d'elle et s'est accroupi. \n\n« Petite fille, qu'est-ce qui ne va pas ? » \n\n« Grand-père, ma mère n'a pas encore été retrouvée... Est-elle encore en vie... » La petite fille ne pouvait s'arrêter de pleurer et sanglotait doucement. Son bras était blessé et était maintenant bandé avec un bandage simple. \n\nEn regardant la fille sanglotante devant lui, Hu Jintao ne pouvait s'empêcher de ressentir de la tristesse. Oui, cela faisait un jour et demi depuis le tremblement de terre, et le « temps de sauvetage en or » était passé. Si les personnes ensevelies n'ont pas été retrouvées, elles sont probablement... Mais comment peut-il dire cela ? « Ta mère est morte, nous sommes désolés », est-ce le genre de bêtise qu'il devrait expliquer au peuple ? Face à un enfant qui demande de l'aide, devrait-il répondre avec de telles phrases ? Hu Jintao a ravalé son chagrin, a doucement serré la petite fille dans ses bras, et l'a laissée pleurer dans ses bras. \n\n« Tout ira bien, tout ira bien. C'est la situation à laquelle nous sommes tous confrontés. Nous devons continuer à persévérer... » Il a murmuré à l'oreille de la fille, sa voix douce et ferme."
chi_GR.32.a: "La souffrance finira par passer"
chi_GR.33: "Une nation prospère dans l'adversité"
chi_GR.33.t: "Une nation prospère dans l'adversité"
chi_GR.33.d: "« Vous êtes là. » En voyant Wen Jiabao, Hu Jintao lui a fait un signe de tête. \n\n« Je viens de me rendre dans la zone sinistrée. Les dégâts sont très graves. Les villages à plus de dix kilomètres ont été détruits. » Wen Jiabao a réfléchi un instant, « Chengdu a subi de lourds dommages, et les autres provinces voisines ont également été touchées à des degrés divers. » \n\n« Comment vont les enfants ? Si le terrain de jeu n'est pas gravement endommagé, faites évacuer les habitants là-bas. » \n\n« J'ai déjà donné des instructions. Je suis allé dans plusieurs écoles avant de venir. Les dégâts étaient plus graves que ce que j'avais prévu. Bien que les bâtiments d'enseignement soient généralement construits bas, les enfants étaient concentrés dans les salles de classe, et l'évacuation n'a pas été rapide. » Wen Jiabao a fait une pause, « La plupart des bâtiments n'étaient pas aux normes, ce qui a conduit à des effondrements répétés après la catastrophe. Je ne sais pas combien de survivants sous les ruines ont été écrasés à mort... » \n\nC'est vraiment une expérience acquise avec du sang et des larmes. Hu Jintao a fermé les yeux. « Nous parlerons de la recherche des responsabilités plus tard. Transférons d'abord l'Armée populaire de libération pour le secours aux sinistrés. Après notre retour, nous devrons revoir les normes de construction, en particulier celles du sud-ouest. Nous devons les contrôler strictement. Les vies humaines sont en jeu ! » Wen Jiabao a hoché la tête. \n\nLe travail doit continuer. Il y a encore des gens ensevelis sous terre, il y a encore des domaines à optimiser pour le transfert de matériel, et les fonds de secours aux sinistrés n'ont pas encore été signés... Hu Jintao a fait un signe à Wen Jiabao, et les deux se sont rendus à leur prochain lieu selon l'agenda. \n\nLe ciel semblait gris et jaune à cause de la poussière causée par le tremblement de terre. La terre sous nos pieds, qui rugissait et criait il y a quelques jours, était maintenant silencieuse. Un jour dure toujours 24 heures. Dans la ville au loin, un homme est en train de mourir. Une boutique à côté joue du karaoké ; en face, on joue avec des enfants. Deux personnes rient sauvagement à l'étage ; il y a aussi des bruits de parties de cartes. Une femme sur un bateau dans la rivière pleure sa mère décédée, et une fille dans la tente pleure sa famille disparue. La terre tourne comme d'habitude, et le soleil se lève toujours à l'est et se couche à l'ouest."
chi_GR.33.a: "La vie doit continuer"
chi_GR.34: "Entretien ?"
chi_GR.34.t: "Entretien ?"
chi_GR.34.d: "Gu Qingping cherchait un emploi seule à Shanghai. Après avoir soumis son 40e CV ce mois-ci, elle a enfin reçu un courriel de notification d'entretien d'une entreprise peu connue. Le jour de l'entretien, elle a pris le bus jusqu'à l'emplacement de l'entreprise, a trouvé un endroit isolé à proximité, a enfilé un tailleur et des talons hauts, et s'est maquillée à la hâte. Lorsqu'elle est entrée dans le bâtiment ce jour-là, elle sentait son cœur battre violemment. Elle n'avait pas le temps de prêter attention à la difficulté de contrôler les talons hauts ou au tremblement des extrémités de ses doigts dû à la nervosité. \n\nLa soi-disant entreprise était en réalité une combinaison de plusieurs maisons résidentielles, avec quelques jeunes gens affairés à l'intérieur. L'intervieweur était le patron de l'entreprise – un jeune homme portant des lunettes, qui semblait avoir la vingtaine, habillé proprement et avec assurance. Gu Qingping a même soupçonné que le patron n'était même pas plus âgé qu'elle. \n\n« Pas besoin d'être si formelle. J'ai lu votre CV et je pensais qu'une personne aussi excellente aurait déjà été embauchée par d'autres grandes entreprises. Je ne m'attendais pas à ce que vous daigniez venir chez nous. Vous pouvez simplement m'appeler Lao Lan, c'est comme ça que tout le monde m'appelle. » Le patron semblait très aimable et parcourait le CV de Gu Qingping. « Nous venons juste de démarrer ici. Nous faisons dans la création culturelle. Les revenus de l'entreprise sont instables et le salaire est bas, mais il inclut la nourriture et le logement. Cependant, il serait probablement gênant pour vous, en tant que femme, de vivre avec nous, les gars rustres. Donc, comme pour les autres employées, nous vous donnerons un salaire supplémentaire pour louer un logement. Nous avons démarré de zéro et nous avons beaucoup de comptes à gérer. Ils sont impatients et ont urgemment besoin d'un comptable. Si cela vous convient, vous pouvez commencer à travailler demain. Voici le contrat. Vous pouvez prendre votre temps pour le lire en rentrant. » \n\n« D'accord... D'accord, y a-t-il quelque chose à savoir lorsque je rejoindrai l'entreprise ? » Gu Qingping a pris le gros sac de bonbons que Lao Lan lui a tendu, a arrangé ses cheveux et a demandé. \n\n« Nous n'avons pas assez d'ordinateurs ici. Avez-vous un ordinateur portable ? Sinon, je paierai pour que vous en achetiez un. Vous pouvez aller au marché électronique aujourd'hui pour en choisir un. Oh, c'est l'heure du dîner maintenant, alors appelle-les pour organiser une cérémonie d'accueil pour vous. Hé, hé ! On sort manger maintenant, pour accueillir notre nouvelle comptable ! » \n\nGu Qingping a rapidement rangé les documents et est descendue avec la foule en liesse. Elle était un peu distraite pendant tout le dîner. Était-ce vraiment le bon choix d'accepter de rejoindre l'entreprise aussi précipitamment ? Deux filles lui tenaient les mains et discutaient avec elle avec enthousiasme. Le patron, Lao Lan, discutait avec quelques gars à une autre table, riant de temps en temps. En regardant le groupe de jeunes bruyants mais gentils devant elle, elle a senti que ce pourrait être le bon choix."
chi_GR.34.a: "N'est-ce pas ça, une équipe ?"
chi_GR.35: "L'unification de la Chine"
chi_GR.35.t: "L'unification de la Chine"
chi_GR.35.d: "« Lao Li, as-tu vu les nouvelles ? Taïwan et la Mongolie ont construit beaucoup d'usines depuis leur retour. Hier, ma fille a vu beaucoup de produits fromagers de Mongolie extérieure au supermarché ! Elle en a acheté un sac, et ma femme et moi l'avons goûté. C'était délicieux ! Comment les Mongols sont-ils si doués pour faire du lait ? » \n\n« Ne m'en parle pas. Mon gamin est déjà un homme, mais il joue encore aux jeux vidéo toute la journée. Il a dit qu'il voulait jouer à des donjons avec ses amis taïwanais. Hé, ce Taïwanais surfe aussi sur Internet en Chine ! » \n\n« Ce n'est pas facile. Ces deux endroits sont enfin revenus à notre pays. Je me souviens que les États-Unis ont bombardé notre ambassade dans les années 1990. Les journaux disaient tous les jours qu'il y avait des manifestations partout ! Voyons qui ose bombarder notre ambassade maintenant ! » \n\n« Ne parle même pas de l'ambassade. Sais-tu, Lao Deng, dans notre communauté, le chauve ? J'ai entendu que son fils Xiao Deng va être ingénieur pour le grand projet de construction de pont à Taïwan ! Avant, il y avait des porte-avions américains qui naviguaient dans cette mer de temps en temps, mais maintenant un pont a été construit ! » \n\n« Construire un pont ? Quelle taille devrait avoir un pont pour traverser une mer aussi grande ? » \n\n« Hé, notre pays veut construire un pont, même s'il doit aller jusqu'au ciel ! Il faudra aller voir le pont construit par Xiao Deng une fois qu'il sera terminé. » \n\n« Hé, de quoi vous parlez tous les deux ici ? Dites-moi aussi. » \n\n« Hé, on parle du fils de Lao Deng qui va à Taïwan pour construire un pont. Allons le voir ensemble une fois qu'il sera terminé. » \n\n« Haha, c'est génial. J'irai aussi, et j'emmènerai Lao Zhang ! Après tout... »"
chi_GR.35.a: "Vous pouvez aller où vous voulez. Notre pays est unifié."

chi_GR.100.t: "Investissements étrangers dans notre pays"
chi_GR.100.d: "Après notre adhésion à l'Organisation mondiale du commerce, l'afflux continu d'investissements étrangers a stimulé le développement rapide de l'économie."
chi_GR.100.a: "Plus il y en a, mieux c'est..."
chi_GR.100.b: "Des investissements étrangers ? Oubliez ça !"

chi_GR.110.t: "Les entreprises étrangères provoquent la fermeture d'entreprises locales"
chi_GR.110.d: "Après l'intégration dans le système économique mondial, les salaires élevés et les avantages sociaux des entreprises étrangères ont conduit à la faillite de certaines entreprises locales..."
chi_GR.110.a: "Protégeons nos entreprises locales !"
chi_GR.110.b: "C'est l'économie de marché..."
chi_GR.110.c: "Renforcement temporaire du système de sécurité sociale"

chi_GR.120.t: "Les centrales à combustibles fossiles exigent la levée des restrictions"
chi_GR.120.d: "À mesure que l'économie se développe, notre demande en énergie augmente. De nombreuses centrales à combustibles fossiles exigent la levée des restrictions réglementaires pertinentes pour répondre à la demande énergétique croissante. Aujourd'hui, un ministre ayant une forte expérience dans les affaires a rencontré le président Hu et a proposé un projet de loi « favorable au développement de l'industrie énergétique ». Bien sûr, le prix à payer est une grave pollution environnementale... \n\nLe président Hu peut certainement rejeter ce ministre impudent, mais il y aura de plus en plus de personnes avec des objectifs similaires à l'avenir. Si ces demandes ne sont pas satisfaites, le ressentiment de certaines personnes s'accumulera de plus en plus..."
chi_GR.120.a: "Dégagez"
chi_GR.120.b: "Faire l'aveugle"

chi_GR.200.t: "Rééquilibrage du rapport de force"
chi_GR.200.d: ""

chi_GR.300.t: "TikTok"
chi_GR.300.d: "Pour la première fois, TikTok a pris la première place – il a été en tête pendant la plupart des derniers mois et est le seul site non américain à occuper une place dans le top 10 du classement de Cloudflare. Cela jouera sans aucun doute un rôle positif dans le démantèlement des stéréotypes et préjugés de longue date."
chi_GR.300.a: "Le mur des préjugés s'effondre"

chi_GR.500.t: "Ventes d'armes américaines à Taïwan"
chi_GR.500.d: "Récemment, [USA.Getleader] a annoncé une nouvelle série de ventes d'armes aux autorités taïwanaises dans le but de renforcer leur pouvoir afin qu'elles puissent « résister à l'unification par la force »."
chi_GR.500.a: "Envoyer une protestation diplomatique !"
chi_GR.500.b: "Attendez, je vais envoyer des chars pour tous vous envoyer au ciel !"
chi_GR.500.c: "Mener des exercices militaires en contrepartie"

chi_GR.501.t: "Les États-Unis soutiennent les forces séparatistes"
chi_GR.501.d: "Récemment, le gouvernement [USA.Getleader] a clairement apporté beaucoup de soutien à diverses forces séparatistes, et le risque de diverses activités terroristes augmente."
chi_GR.501.a: "Envoyer une protestation diplomatique !"
chi_GR.501.b: "Éliminer l'hégémonie américaine !"
chi_GR.501.c: "Mener des exercices militaires en contrepartie"

chi_GR.502.t: "Les États-Unis amplifient la « théorie de la menace chinoise »"
chi_GR.502.d: "Récemment, le gouvernement [USA.Getleader] a amplifié la « théorie de la menace chinoise » dans divers médias, une théorie qu'il propage depuis de nombreuses années."
chi_GR.502.a: "Envoyer une protestation diplomatique !"
chi_GR.502.b: "Publier des rapports similaires pour riposter"
chi_GR.502.c: "Éliminer l'hégémonie américaine !"

chi_GR.503.t: "Les États-Unis lancent une attaque d'opinion publique"
chi_GR.503.d: "Récemment, le gouvernement [USA.Getleader] a contrôlé et acheté certains de nos médias, ce qui a entraîné la publication d'un grand nombre de fausses déclarations pour semer la confusion parmi le public."
chi_GR.503.a: "Maudit [USA.Getleader]"
chi_GR.503.b: "Supprimer ces rumeurs !"
chi_GR.503.c: "Lancer une contre-attaque"

chi_GR.504.t: "Les États-Unis restreignent la coopération scientifique"
chi_GR.504.d: "Récemment, le gouvernement [USA.Getleader] a annoncé une nouvelle série de restrictions sur les projets de coopération scientifique pour notre communauté scientifique."
chi_GR.504.a: "Maudit [USA.Getleader]"
chi_GR.504.b: "Nous exigeons une recherche indépendante !"

chi_GR.505.t: "Les États-Unis promeuvent le rapatriement de capitaux"
chi_GR.505.d: "Récemment, le gouvernement [USA.Getleader] a annoncé une série de mesures pour promouvoir le rapatriement de son industrie manufacturière et a exigé que les entreprises américaines ferment leurs usines en Chine."
chi_GR.505.a: "Maudit [USA.Getleader]"
chi_GR.505.b: "Remplacer par des entreprises nationales similaires"

chi_GR.550.t: "[FROM.GetName] choisit de nous soutenir"
chi_GR.550.d: "Le gouvernement [FROM.Getleader] a annoncé qu'il abandonnera sa position initiale et choisira de soutenir notre camp."
chi_GR.550.a: "Un choix judicieux"

chi_GR.551.t: "[FROM.GetName] choisit de ne pas nous soutenir"
chi_GR.551.d: "Le gouvernement [FROM.Getleader] a annoncé qu'il a abandonné sa position initiale et a choisi de ne pas soutenir notre camp."
chi_GR.551.a: "Ils le regretteront..."

chi_GR.552.t: "[FROM.GetName] choisit la neutralité"
chi_GR.552.d: "Le gouvernement [FROM.Getleader] a annoncé qu'il a abandonné sa position initiale et a choisi de ne soutenir ni nous ni nos adversaires."
chi_GR.552.a: "Regarder le feu depuis l'autre rive ?"

chi_GR.553.t: "[FROM.GetName] détruit notre ordre"
chi_GR.553.d: "Le gouvernement [FROM.Getleader] a récemment attaqué ouvertement la légitimité de notre ordre."
chi_GR.553.a: "Sanctionner ces idiots !"
chi_GR.553.b: "Il est temps de partir en guerre !"
chi_GR.553.c: "Des protestations diplomatiques suffiront..."

chi_GR.700.t: "[CHI_Wu_WenJun.GetName] est décédé"
chi_GR.700.d: "[?global.date.GetDateString], le lauréat du premier Prix national suprême de science et de technologie, le célèbre mathématicien [CHI_Wu_WenJun.GetName], est malheureusement décédé à Pékin des suites d'une maladie. Il avait 98 ans."
chi_GR.700.a: "Tout le pays est en deuil"

chi_GR.701.t: "[CHI_Yuan_LongPing.GetName] est décédé"
chi_GR.701.d: "[?global.date.GetDateString], lauréat de la Médaille de la République, académicien de l'Académie chinoise d'ingénierie, directeur du Centre national de recherche en technologie d'ingénierie du riz hybride, et ancien vice-président du Comité provincial du Hunan de la Conférence consultative politique du peuple chinois, [CHI_Yuan_LongPing.GetName], est décédé à Changsha des suites d'une maladie à l'âge de 91 ans."
chi_GR.701.a: "Tout le pays est en deuil" #Les gens sont comme des graines, nous devons être de bonnes graines

chi_GR.702.t: "[CHI_Wang_Xuan.GetName] est décédé"
chi_GR.702.d: "[?global.date.GetDateString], célèbre scientifique reconnu à l'échelle nationale et internationale, fondateur de la technologie de composition laser des caractères chinois par ordinateur, militant social exceptionnel, ami proche du Parti communiste chinois, vice-président du dixième Comité national de la Conférence consultative politique du peuple chinois, vice-président du Comité central de la Société Jiusan, académicien de l'Académie chinoise des sciences, académicien de l'Académie chinoise d'ingénierie, et professeur à l'Université de Pékin, le camarade [CHI_Wang_Xuan.GetName], est décédé des suites d'une maladie à Pékin à l'âge de 70 ans."
chi_GR.702.a: "Tout le pays est en deuil"

chi_GR.703.t: "[CHI_Wang_YongZhi.GetName] est décédé"
chi_GR.703.d: "[?global.date.GetDateString], académicien de l'Académie chinoise d'ingénierie, premier concepteur en chef du programme spatial habité de la Chine, [CHI_Wang_YongZhi.GetName], est décédé à Pékin des suites d'une maladie à l'âge de 92 ans."
chi_GR.703.a: "Tout le pays est en deuil"

chi_GR.704.t: "[CHI_Ye_DuZheng.GetName] est décédé"
chi_GR.704.d: "[?global.date.GetDateString], l'académicien [CHI_Ye_DuZheng.GetName], célèbre météorologue, l'un des principaux fondateurs de la météorologie moderne en Chine, ancien vice-président de l'Académie chinoise des sciences, et ancien directeur de l'Institut de physique atmosphérique de l'Académie chinoise des sciences, est décédé des suites d'une maladie à Pékin à l'âge de 98 ans."
chi_GR.704.a: "Tout le pays est en deuil"

chi_GR.705.t: "[CHI_Min_EnZe.GetName] est décédé"
chi_GR.705.d: "[?global.date.GetDateString], célèbre expert en catalyseurs pétrochimiques dans notre pays, académicien de l'Académie chinoise des sciences, académicien de l'Académie chinoise d'ingénierie, consultant senior de l'Institut de recherche pétrochimique de Sinopec, [CHI_Min_EnZe.GetName], ingénieur senior de niveau professeur, est décédé à Pékin des suites d'une maladie à l'âge de 93 ans."
chi_GR.705.a: "Tout le pays est en deuil"

chi_GR.706.t: "[CHI_Xie_JiaLin.GetName] est décédé"
chi_GR.706.d: "[?global.date.GetDateString], académicien de l'Académie chinoise des sciences, physicien des accélérateurs de renommée internationale, lauréat du Prix national suprême de science et de technologie 2011, ancien directeur adjoint de l'Institut de physique des hautes énergies de l'Académie chinoise des sciences, [CHI_Xie_JiaLin.GetName], est décédé des suites d'une maladie à Pékin à l'âge de 96 ans."
chi_GR.706.a: "Tout le pays est en deuil"

chi_GR.707.t: "[CHI_Zheng_ZeMin.GetName] est décédé"
chi_GR.707.d: "[?global.date.GetDateString], académicien de l'Académie chinoise des sciences, académicien de l'Académie chinoise d'ingénierie, lauréat du Prix national suprême de science et de technologie, chercheur à l'Institut de mécanique de l'Académie chinoise des sciences, [CHI_Zheng_ZeMin.GetName], est décédé à Pékin des suites d'une maladie à l'âge de 97 ans."
chi_GR.707.a: "Tout le pays est en deuil"

chi_GR.708.t: "[CHI_Wang_XiaoMo.GetName] est décédé"
chi_GR.708.d: "[?global.date.GetDateString], membre exceptionnel du Parti communiste chinois, combattant loyal du communisme éprouvé par le temps, célèbre expert en radar dans notre pays, pionnier et fondateur de l'industrie des avions d'alerte précoce, lauréat du Prix national suprême de science et de technologie, et académicien de l'Académie chinoise d'ingénierie, le camarade [CHI_Wang_XiaoMo.GetName], est décédé à Pékin des suites d'une maladie à l'âge de 84 ans."
chi_GR.708.a: "Tout le pays est en deuil"

chi_GR.709.t: "[CHI_Zhang_CunHao.GetName] est décédé"
chi_GR.709.d: "[?global.date.GetDateString], membre exceptionnel du Parti communiste chinois, membre exceptionnel de la Ligue démocratique chinoise, ancien secrétaire du groupe de direction du parti et deuxième et troisième directeur de la Fondation nationale des sciences naturelles de Chine, ancien directeur de l'Institut de physique chimique de Dalian de l'Académie chinoise des sciences, célèbre chimiste physique, fondateur et pionnier du domaine des lasers chimiques à haute énergie dans notre pays, l'un des fondateurs de la discipline de la dynamique des réactions moléculaires, lauréat du Prix national suprême de science et de technologie, et académicien senior de l'Académie chinoise des sciences, le camarade [CHI_Zhang_CunHao.GetName], est décédé à Pékin des suites d'une maladie à l'âge de 96 ans."
chi_GR.709.a: "Tout le pays est en deuil"

chi_GR.710.t: "[CHI_Cheng_KaiJia.GetName] est décédé"
chi_GR.710.d: "[?global.date.GetDateString], l'académicien [CHI_Cheng_KaiJia.GetName], membre de l'Académie chinoise des sciences et lauréat du prix des « deux bombes », est décédé à l'âge de 101 ans à l'hôpital 301 de Pékin, après l'échec des traitements médicaux."
chi_GR.710.a: "Le pays entier est en deuil"

chi_GR.711.t: "[CHI_Yu_Min.GetName] est décédé"
chi_GR.711.d: "[?global.date.GetDateString], figure majeure de la réforme et du développement des sciences et technologies de la défense nationale de notre pays, académicien de l'Académie chinoise des sciences, héros des « deux bombes et un satellite », lauréat du prix national suprême pour les progrès scientifiques et technologiques, et pionnier de la réforme [CHI_Yu_Min.GetName] est décédé à Pékin à l'âge de 93 ans."
chi_GR.711.a: "Le pays entier est en deuil"

chi_GR.712.t: "[CHI_Qian_XueSen.GetName] est décédé"
chi_GR.712.d: "[?global.date.GetDateString], célèbre scientifique en aérospatiale, académicien senior de l'Académie chinoise des sciences et de l'Académie chinoise d'ingénierie, vice-président des 6e, 7e et 8e comités nationaux de la Conférence consultative politique du peuple chinois, et fondateur de l'industrie aérospatiale chinoise [CHI_Qian_XueSen.GetName] est décédé à Pékin à l'âge de 98 ans."
chi_GR.712.a: "Le pays entier est en deuil"

