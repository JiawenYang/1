sco.20.a: "Accepter l'invitation."
sco.20.b: "Nous ne rejoindrons pas cette organisation."
sco.20.d: "Nous avons reçu une invitation de [From.GetLeader] qui espère que nous puissions rejoindre l'Organisation de coopération de Shanghai (OCS) en tant qu'État observateur."
sco.20.t: "[From.GetName] nous a invités à rejoindre l'OCS."

sco.21.a: "Très bien."
sco.21.d: "[From.GetLeader] a accepté notre invitation !"
sco.21.t: "[From.GetName] a accepté."

sco.22.a: "Ils le regretteront."
sco.22.d: "[From.GetLeader] a décliné notre invitation !"
sco.22.t: "[From.GetName] a décliné."

sco.30.a: "Accepter l'invitation"
sco.30.b: "C'est clairement inapproprié"
sco.30.d: "Nous avons reçu une invitation de [From.GetLeader] pour rejoindre l'Organisation de coopération de Shanghai (OCS) en tant qu'État membre à part entière."
sco.30.t: "[From.GetName] nous a invités à devenir membre à part entière."

trigger_chi_GRnews_132: "Le Japon accepte de regarder l'histoire en face"