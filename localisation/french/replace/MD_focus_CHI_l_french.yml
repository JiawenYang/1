PLA_both_nuclear_and_conventional: "Capacités nucléaires et conventionnelles"
PLA_both_nuclear_and_conventional_desc: "Nos forces de missiles doivent posséder la double capacité d'effectuer à la fois des frappes de précision conventionnelles et des contre-attaques nucléaires stratégiques."

PLA_expanding_missile_stockpile: "Expansion du stock de missiles"
PLA_expanding_missile_stockpile_desc: "Pour atteindre une dissuasion stratégique efficace, nous devons rapidement élargir notre stock de missiles."

PLA_missile_ensure_precision_strikes: "Garantir des frappes de précision"
PLA_missile_ensure_precision_strikes_desc: "Le gaspillage illimité de puissance de feu est une erreur ; nous devons garantir des frappes de précision sur chaque cible."

PLA_missile_function_transformation: "Transformation de la position fonctionnelle"
PLA_missile_function_transformation_desc: "La transformation du « Deuxième Corps d'artillerie » en « Force des fusées » n'est pas seulement un changement de nom, mais plutôt un processus pour clarifier et définir sa position fonctionnelle."

PLA_missile_need_upgrade: "Mise à niveau de l'équipement de missiles"
PLA_missile_need_upgrade_desc: "Les armes à missiles nécessitent des avancées technologiques et une mise à niveau systématique, ce qui nécessite un investissement substantiel en ressources."

chi_GR.1010.b1: "Assouplir modérément les politiques de contrôle des naissances"
chi_GR.1010.b2: "Assouplir radicalement les politiques de contrôle des naissances"

chi_GR.2000.a: "Renforcer l'enseignement professionnel"
chi_GR.2000.b: "Continuer à élargir les inscriptions dans l'enseignement supérieur"
chi_GR.2000.c: "Ignorer temporairement ce problème..."
chi_GR.2000.desc: "$CHI_The_right_to_education_desc$"
chi_GR.2000.t: "Problèmes d'éducation"

chi_GR.2010.a: "Promouvoir l'égalité des genres"
chi_GR.2010.b: "Appeler à plus de droits"
chi_GR.2010.c: "Retour aux positions traditionnelles"
chi_GR.2010.d: "Ignorer temporairement ce problème..."
chi_GR.2010.desc: "$CHI_Feminism_desc$"
chi_GR.2010.t: "Problèmes de genre"

chi_GR.2020.a: "Renforcer l'examen des projets de recherche"
chi_GR.2020.b: "Éliminer complètement la corruption académique"
chi_GR.2020.c: "Ignorer temporairement ce problème..."
chi_GR.2020.desc: "L'incident de fraude aux puces a sérieusement affecté les progrès scientifiques de notre pays et exposé des problèmes systémiques au sein de la communauté de recherche, qui doivent être correctement traités."
chi_GR.2020.t: "Problème de fraude dans la recherche"

chi_GR.3000.a: "Nous devons trouver une solution."
chi_GR.3000.desc: "$CHI_intertwined_Interest_relations_desc$\n\nEn bref, notre niveau de corruption a augmenté."
chi_GR.3000.t: "Niveau de corruption augmenté"

chi_GR.3100.a: "Soutien politique supplémentaire."
chi_GR.3100.b: "La productivité est ce qui compte."
chi_GR.3100.c: "L'argent liquide reste la meilleure option."
chi_GR.3100.desc: "Après avoir payé le prix dû, il est temps de choisir ce que nous gagnons."
chi_GR.3100.t: "Un échange ?"

chi_GR.697.a: "Intéressant..."
chi_GR.697.d: "Après avoir vaincu la Chine et les États-Unis, [ROOT.Getleader] annonce officiellement que [ROOT.GetName] dominera l'ordre mondial futur."
chi_GR.697.t: "[ROOT.GetName] annonce sa domination de l'ordre mondial"

chi_GRnews.100.a: "Ils plaisantent ?"
chi_GRnews.100.d: "Le gouvernement corrompu et incompétent de la dynastie Qing a été contraint de signer le traité d'Aigun en 1858, établissant la domination russe en Extrême-Orient.\n\nCependant, avec l'augmentation de la force militaire et du statut international de [FROM.GetName], ils ont récemment déclaré qu'ils ne reconnaissaient pas ce traité inégal et exigeaient le contrôle de la région."
chi_GRnews.100.t: "[FROM.GetNameDef] remet en question le traité d'Aigun"

chi_GRnews.101.d: "Après que nous ayons annoncé nos demandes raisonnables, [FROM.GetName] a annoncé qu'ils refusaient d'abolir le traité d'Aigun, que le gouvernement Qing avait été contraint de signer. [FROM.Getleader] affirme que nos actions sont un acte flagrant d'agression."
chi_GRnews.101.t: "[FROM.GetName] refuse d'abolir le traité"

chi_GRnews.110.a: "Nous pouvons conquérir le Sikkim d'innombrables fois !"
chi_GRnews.110.b: "Ignorons le Sikkim pour l'instant."
chi_GRnews.110.d: "Alors que nous sommes en position désavantageuse dans notre guerre contre [FROM.GetName], le royaume du Sikkim a déclaré son indépendance et s'est séparé de l'Inde. C'est clairement parce que [FROM.Getleader] les soutient en coulisses !"
chi_GRnews.110.t: "Le Sikkim déclare son indépendance"

chi_GRnews.120.a: "Ils plaisantent ?"
chi_GRnews.120.b: "Bon, ce n'est pas si cher de toute façon."
chi_GRnews.120.d: "[FROM.Getleader] affirme que notre pays a historiquement participé à une agression contre eux et exige que nous payions une lourde somme en réparations pour l'invasion..."
chi_GRnews.120.t: "[FROM.GetNameDef] exige des réparations historiques"

chi_GRnews.121.d: "Après que nous ayons annoncé nos demandes légitimes, [FROM.GetName] a déclaré qu'il refuserait de fournir toute compensation pour les crimes historiques commis cette année-là, [FROM.Getleader] affirmant que nous nous contentions d'étendre les soi-disant slogans de propagande « anti-liberté »."
chi_GRnews.121.t: "[FROM.GetNameDef] refuse de payer des réparations"

chi_GRnews.122.a: "C'est excellent..."
chi_GRnews.122.d: "Après que nous ayons annoncé nos demandes légitimes, [FROM.GetName] a accepté de compenser les méfaits historiques qu'il a commis."
chi_GRnews.122.t: "[FROM.GetNameDef] accepte de payer des réparations"

chi_GRnews.130.a: "Seul le fait de regarder l'histoire en face nous permettra d'avoir un avenir."
chi_GRnews.130.b: "Nous ne céderons pas à eux !"
chi_GRnews.130.d: "Récemment, [FROM.Getleader] a publiquement exigé que nous présentions des excuses publiques pour les crimes commis pendant la guerre sino-japonaise au milieu du XXe siècle et que nous promettions de fournir un compte rendu détaillé et véridique de ce qui s'est passé dans les livres d'histoire."
chi_GRnews.130.t: "[FROM.GetNameDef] exige de regarder l'histoire en face"

chi_GRnews.131.b: "Protestation vigoureuse"
chi_GRnews.131.d: "Après que nous ayons annoncé nos demandes raisonnables, [FROM.Getleader] a déclaré qu'ils « ne céderaient pas à la pression » et refusaient d'arrêter de déformer l'histoire ; ils s'enfoncent de plus en plus dans la mauvaise voie !"
chi_GRnews.131.t: "[FROM.GetNameDef] refuse de regarder l'histoire en face"

chi_GRnews.132.a: "Très bien !"
chi_GRnews.132.d: "Après que nous ayons annoncé nos demandes raisonnables, [FROM.Getleader] a annoncé qu'il présenterait des excuses publiques pour les crimes commis pendant l'invasion de la Chine et promettait de donner un compte rendu détaillé et véridique de ce qui s'est passé dans les livres d'histoire."
chi_GRnews.132.t: "[FROM.GetNameDef] accepte de regarder l'histoire en face"

chi_GRnews.52.b: "Nous devons continuer à creuser !"

chi_south_china_sea_GR.100.a: "Comme c'est méprisable !"
chi_south_china_sea_GR.100.b: "Nous devons obtenir justice !"
chi_south_china_sea_GR.100.d: "En raison de l'influence incontestable de [FROM.GetName] dans la région, leurs revendications territoriales ont obtenu un soutien international lors des récentes négociations sur les frontières maritimes. [MDGR_maritime_boundary_state.GetName] est maintenant sous leur contrôle, et nous avons perdu la légitimité de nos revendications dans la région. Nous n'avons pratiquement aucun recours."
chi_south_china_sea_GR.100.t: "[FROM.GetName] a pris le contrôle de [MDGR_maritime_boundary_state.GetName]"

chi_stop_war.300.a: "C'est clairement une erreur !"
chi_stop_war.300.d: "[From.GetName] pense que nous avons sapé la stabilité régionale et la paix mondiale, et a imposé des sanctions internationales contre nous sur cette base !"
chi_stop_war.300.t: "Nous sommes sous sanctions internationales !"
chi_stop_war.300: "Nous sommes sous sanctions internationales !"

chi_stop_war.350.a: "Où signons-nous ?"
chi_stop_war.350.b: "C'est absurde !"
chi_stop_war.350.d: "[From.GetName] pense que la situation mondiale actuelle ne peut être résolue sans la coordination de [target_united_nations_members_selected.GetNameWithFlag], et propose donc que ce pays devienne un nouveau membre du Conseil de sécurité des Nations unies."
chi_stop_war.350.t: "Propose d'ajouter de nouveaux membres au Conseil de sécurité"

chi_stop_war.4.b: "Alors ripostons avec des sanctions équivalentes !"

china.300.a: "Excellent !"
china.300.d: "Notre économie a énormément bénéficié alors que nous avançons régulièrement l'initiative Ceinture et Route."
china.300.t: "Une collaboration de [From.GetName]"

