chi_GRnews.59: "Destroyer russe arrive au port"
chi_GRnews.59.t: "Destroyer russe arrive au port"
chi_GRnews.59.d: "Le destroyer moderne \"Hangzhou\" que nous avons commandé à la Russie est enfin arrivé au port de Zhoushan aujourd'hui, mais les Russes ne semblent pas avoir complètement mis à jour les armes et les équipements conformément à la commande... Nous pouvons continuer à transformer ce destroyer."
chi_GRnews.59.a: "D'accord ! Achetons en un autre !"

chi_GRnews.60: "Destroyer russe arrive au port"
chi_GRnews.60.t: "Destroyer russe arrive au port"
chi_GRnews.60.d: "Le destroyer moderne \"Fuzhou\" que nous avons commandé à la Russie est finalement arrivé en Chine aujourd'hui, mais les Russes ne semblent pas avoir complètement mis à jour les armes et les équipements conformément aux exigences de la commande... Nous pouvons continuer à transformer ce destroyer."
chi_GRnews.60.a: "D'accord ! Achetons en un autre !"

chi_GRnews.61: "Incendie à Taizhou"
chi_GRnews.61.t: "Incendie à Taizhou"
chi_GRnews.61.d: "Le destroyer moderne \"Taizhou\" que nous avons commandé à la Russie a soudainement pris feu dans un chantier naval russe !"
chi_GRnews.61.a: "Bon sang..."

chi_GRnews.62: "Destroyer russe arrive au port"
chi_GRnews.62.t: "Destroyer russe arrive au port"
chi_GRnews.62.d: "Le destroyer moderne \"Taizhou\" que nous avons commandé à la Russie est finalement arrivé en Chine aujourd'hui, mais les Russes ne semblent pas avoir complètement mis à jour les armes et les équipements conformément à la commande, et de nombreuses pièces ont été brûlées à cause de l'incendie... Nous pouvons continuer à transformer ce destroyer."
chi_GRnews.62.a: "Enfin arrivé sain et sauf"

chi_GRnews.63: "Destroyer russe arrive au port"
chi_GRnews.63.t: "Destroyer russe arrive au port"
chi_GRnews.63.d: "Le destroyer moderne \"Ningbo\" que nous avons commandé à la Russie est finalement arrivé en Chine aujourd'hui, mais les Russes ne semblent pas avoir complètement mis à jour les armes et les équipements conformément aux exigences de la commande... Nous pouvons continuer à transformer ce destroyer.\n\nAvec l'achat de quatre destroyers de missiles de classe moderne, la force de notre marine a été considérablement améliorée, et nous pouvons éviter la tragédie d'utiliser des cargos pour remorquer des chars afin de se défendre contre l'ennemi pendant la crise du détroit de Taïwan."
chi_GRnews.63.a: "Le peuple chinois aspire à une marine puissante"

chi_GRnews.64: "La Chine nous appelle à affronter l'hégémonie américaine !"
chi_GRnews.64.t: "La Chine nous appelle à lutter contre l'hégémonie américaine !"
chi_GRnews.64.d: "Après que la Chine a officiellement annoncé qu'elle mettrait fin à l'hégémonie américaine, [CHI.GetLeader] a envoyé une notification aujourd'hui, nous appelant à nous joindre à la Chine dans la lutte contre l'hégémonie américaine. Comment devrions-nous gérer la lutte entre ces deux superpuissances ?"
chi_GRnews.64.a: "Les Américains sont plus fiables"
chi_GRnews.64.b: "Nous sommes aux côtés de la Chine"
chi_GRnews.64.c: "Peut-être devrions-nous maintenir le statu quo"

chi_GRnews.65: "[From.GetName] refuse de s'opposer à l'Amérique"
chi_GRnews.65.t: "[From.GetName] refuse de s'opposer à l'Amérique"
chi_GRnews.65.d: "Le département diplomatique de [From.GetName] a déclaré qu'ils n'avaient aucun intérêt à participer au conflit injuste de la Chine avec les États-Unis, et a condamné l'\"agression\" de notre pays."
chi_GRnews.65.a: "Sanctionner ce chien américain !"
chi_GRnews.65.b: "Laissez-les faire ce qu'ils veulent"

chi_GRnews.66: "[From.GetName] est à nos côtés !"
chi_GRnews.66.t: "[From.GetName] est à nos côtés !"
chi_GRnews.66.d: "Le département diplomatique de [From.GetName] a déclaré qu'ils se joindraient à la Chine dans la juste cause de s'opposer à l'hégémonie impérialiste américaine."
chi_GRnews.66.a: "Beaucoup d'amis !"

chi_GRnews.67: "La Chine interrompt le commerce de nos marchandises !"
chi_GRnews.67.t: "La Chine interrompt le commerce de nos marchandises !"
chi_GRnews.67.d: "Le département diplomatique chinois a annulé aujourd'hui toutes les commandes commerciales avec nous et a expulsé nos diplomates. Cela aura un impact sérieux sur notre économie."
chi_GRnews.67.a: "Pourquoi ?"

chi_GRnews.68: "La Chine affaiblit notre statut international !"
chi_GRnews.68.t: "La Chine affaiblit notre statut international !"
chi_GRnews.68.d: "Ces dernières années, notre influence mondiale a considérablement diminué, grâce aux efforts chinois, mettant en péril notre position de seule puissance hégémonique mondiale et jetant les bases d'un nouvel ordre mondial. Peut-être que ceux qui ont prédit la \"fin de l'histoire\" après notre victoire sur l'Union soviétique étaient trop optimistes après tout."
chi_GRnews.68.a: "Nous devons frapper maintenant avant qu'il ne soit trop tard !"
chi_GRnews.68.b: "Mieux vaut ne pas les déranger..."

chi_GRnews.69: "\"Real Men\" est un succès"
chi_GRnews.69.t: "\"Real Men\" est un succès"
chi_GRnews.69.d: "Au début de ce mois, Hunan Satellite TV a diffusé un programme spécial d'éducation à la défense nationale lancé conjointement avec le Studio de cinéma du 1er août de l'Armée populaire de libération chinoise, intitulé \"Real Men\". Le programme a enregistré 6 stars de différentes tranches d'âge et personnalités, qui sont allées en profondeur dans les troupes de première ligne, ont changé d'identité et ont vécu 4 fois 5 jours et 4 nuits dans différentes branches militaires, mangeant, vivant et s'entraînant avec de jeunes soldats dans l'expérience du camp militaire réel.\n\nL'équipe du programme \"Real Men\" est entrée dans le camp militaire et a filmé entre les différentes armes. Les stars mangeront, vivront et s'entraîneront avec les soldats pour les aider à réaliser la transformation de \"vrais hommes\". L'équipe de réalisation a mis en œuvre le \"zéro intervention\" et a obéi au commandement dans l'armée. Le réalisateur n'était responsable que de l'enregistrement, et le processus d'entraînement était également réel. Après être entré dans l'armée, toutes les stars participant au tournage seront entièrement confiées à l'armée pour la gestion conformément aux exigences des recrues ordinaires. Les célébrités invitées doivent respecter strictement la discipline militaire, suivre le commandement dans toutes les actions et être absolument obéissantes, et il ne peut y avoir d'excuses. . Même les plus petits détails de la vie doivent être strictement suivis conformément au calendrier et aux arrangements de l'armée. Contrairement à d'autres programmes de célébrités, tout le personnel a interdiction de parler aux célébrités pendant l'enregistrement. Toute situation qui se produit dans la caserne est gérée par les soldats et officiers ordinaires conformément aux règlements de l'armée et au système de vie quotidienne. L'équipe de réalisation a enregistré et filmé 24 heures sur 24 conformément aux exigences du documentaire.\n\nPhoenix Entertainment a commenté que \"Real Men\" ne reflète pas seulement l'amitié entre l'âme de l'armée et les hommes, mais montre aussi véritablement la puissance militaire moderne de la Chine à travers le processus d'entraînement des recrues célèbres. Le public a vu la sueur et les larmes touchantes versées par les recrues célèbres dans la caserne, et a également ressenti le sang et le style de soldats tels que le chef d'escouade Wang et l'instructeur Xie. Les paroles inspirantes du programme telles que \"Les soldats ne peuvent tenir leurs positions au combat que s'ils sont ponctuels\", \"La capacité peut être entraînée\" et \"Être un homme doit persévérer\" ont également excité le public comme un tonique."
chi_GRnews.69.a: "C'est un vrai homme !"
chi_GRnews.70: "\"Au Nom du Peuple\" est un succès"
chi_GRnews.70.t: "\"Au Nom du Peuple\" est un succès"
chi_GRnews.70.d: "Le 28 mars, le \"Théâtre exclusif de l'Aigle d'Or\" de Hunan Satellite TV a diffusé une série télévisée spéciale, une série télévisée répétitive sur le thème principal intitulée \"Au Nom du Peuple\". La pièce est adaptée du roman éponyme de Zhou Meisen. Elle raconte l'histoire d'un directeur de projet d'un ministère national soupçonné d'avoir accepté des pots-de-vin de dizaines de millions. Lorsque Hou Liangping, le directeur de l'enquête anti-corruption, a enquêté, il a constaté que son apparence était simple. Dans le même temps, Ding Yizhen, l'adjoint au maire de la ville de Jingzhou, province du Handong, qui était impliqué dans l'affaire, a réussi à s'échapper à l'étranger. L'affaire implique la lutte pour l'équité dans l'entreprise d'État Usine de vêtements Dafeng, et les forces politiques sont compliquées. Chen Hai, l'ancien directeur du bureau anti-corruption, a eu un accident de voiture, et Hou Liangping a repris l'enquête. Il existe deux forces majeures dans l'arène politique de la province du Handong, le \"système politique et juridique\" et le \"gang du secrétaire\". L'arrivée du nouveau secrétaire provincial du parti, Sha Ruijin, brisera cet équilibre et insufflera un nouvel élan à la réforme."
chi_GRnews.70.a: "Maître, je veux vraiment m'améliorer"
chi_GRnews.71: "Lettre à l'ensemble du parti, à l'ensemble de l'armée et au peuple de tous les groupes ethniques du pays"
chi_GRnews.71.t: "Lettre à l'ensemble du parti, à l'ensemble de l'armée et au peuple de tous les groupes ethniques du pays"
chi_GRnews.71.d: "Le Comité Central du Parti Communiste Chinois, le Comité Permanent de l'Assemblée Populaire Nationale de la République Populaire de Chine, le Conseil d'État de la République Populaire de Chine, le Comité National de la Conférence Consultative Politique du Peuple Chinois, le Parti Communiste Chinois et la Commission Militaire Centrale de la République Populaire de Chine sont extrêmement attristés d'informer l'ensemble du parti, l'ensemble de l'armée et le peuple de tous les groupes ethniques du pays : Notre cher camarade Jiang Zemin a souffert de leucémie et d'une défaillance multi-organes. Il est décédé à Shanghai à 12h13 le 30 novembre 2022 à l'âge de 96 ans.\n\nLe camarade Jiang Zemin est un dirigeant exceptionnel doté d'un grand prestige reconnu par notre parti, notre armée et le peuple de tous les groupes ethniques de notre pays, un grand marxiste, un grand révolutionnaire prolétarien, homme politique, stratège militaire, diplomate, un combattant communiste éprouvé, un dirigeant exceptionnel de la grande cause du socialisme à caractéristiques chinoises, le noyau de la troisième génération du collectif de direction central du parti et le principal fondateur de la pensée importante des \"Trois Représentations\".\n\nLa mort du camarade Jiang Zemin est une perte incommensurable pour notre parti, notre armée et le peuple de tous les groupes ethniques de notre pays. Le Comité Central du Parti appelle l'ensemble du parti et l'ensemble de l'armée et le peuple de tous les groupes ethniques à transformer leur chagrin en force, à hériter de l'héritage du camarade Jiang Zemin et à exprimer nos condoléances par des actions concrètes.\n\nNous devons nous efforcer d'apprendre la pensée importante des \"Trois Représentations\", d'apprendre l'esprit révolutionnaire et le style révolutionnaire du camarade Jiang Zemin, d'apprendre son attitude scientifique et son esprit créatif d'utilisation des positions, des points de vue et des méthodes marxistes pour étudier les nouvelles situations et résoudre les nouveaux problèmes, et nous unir et lutter pour construire notre pays en une puissance socialiste moderne, prospère, démocratique, civilisée, harmonieuse et belle.\n\nLe grand renouveau de la nation chinoise a condensé le travail acharné et la lutte de générations de communistes, dont le camarade Jiang Zemin. Sur la voie à suivre, l'ensemble du parti, l'ensemble de l'armée et le peuple de tous les groupes ethniques du pays doivent, sous la forte direction du Comité Central du Parti avec le camarade Xi Jinping comme noyau, porter haut la grande bannière du socialisme à caractéristiques chinoises, mettre pleinement en œuvre la pensée de Xi Jinping sur le socialisme à caractéristiques chinoises dans la nouvelle ère, faire avancer le grand esprit de construction du parti, renforcer la confiance, travailler ensemble, travailler dur, et avancer courageusement, et nous unir et lutter pour la construction globale d'un pays socialiste moderne et la promotion globale du grand renouveau de la nation chinoise."
chi_GRnews.71.a: "Le camarade Jiang Zemin vivra éternellement !"
chi_news.21: "L'ancien dirigeant chinois Jiang Zemin meurt"
chi_news.21.t: "L'ancien dirigeant chinois Jiang Zemin meurt"
chi_news.21.d: "Le 30 novembre 2022 à 12h13, l'ancien dirigeant chinois Jiang Zemin est décédé à Shanghai à l'âge de 96 ans. La Chine a organisé une grande cérémonie commémorative en son honneur pour commémorer ce vieil homme qui a eu une grande importance pour le peuple chinois.\n\nLes ambassades et consulats chinois à l'étranger et autres institutions outre-mer ont mis leurs drapeaux en berne pour exprimer leurs condoléances, et la place Tian'anmen et la porte Xinhua à Pékin ont également mis leurs drapeaux en berne pour pleurer Jiang Zemin. Avant la réunion, le Conseil de sécurité des Nations Unies a observé un moment de silence pour pleurer la mort de Jiang Zemin. Harold Agyeman, président tournant du Conseil de sécurité et représentant permanent du Ghana auprès des Nations Unies, a déclaré : L'ancien président chinois Jiang Zemin a apporté de grandes contributions à la paix, à la sécurité et au développement internationaux, ainsi qu'à la réforme et à l'ouverture de la Chine, à la modernisation et au développement économique. La communauté internationale se souvient de Jiang Zemin pour cela. Sa mort est une perte énorme pour la Chine et la communauté internationale. Par la suite, les représentants de divers pays se sont levés et ont observé une minute de silence."
chi_news.21.a: "Il n'a finalement pas réussi à vaincre la vieillesse"
chi_news.21.b: "Le camarade Jiang Zemin vivra éternellement !"
chi_GRnews.72: "\"A Certain Scientific Railgun\" est diffusé !"
chi_GRnews.72.t: "\"A Certain Scientific Railgun\" est diffusé !"
chi_GRnews.72.d: "Il y a trois mois, le manga \"A Certain Scientific Railgun\" écrit par le mangaka japonais Kazuma Kamachi et illustré par Motoo Fuyukawa a été officiellement annoncé comme étant adapté en dessin animé. Le 2 de ce mois, \"A Certain Scientific Railgun\" a été officiellement diffusé sur Tokyo Metropolitan Television, et le premier épisode était \"Electric Tortoise Star\". C'est une animation adaptée du manga du même nom, qui met en scène le personnage populaire Misaka Mikoto du roman léger \"A Certain Magical Index\" écrit par Kazuma Kamachi. La première moitié de l'animation est adaptée des volumes 1 à 3 du manga original, tandis que la seconde moitié est écrite par Kazuma Kamachi, l'auteur original de \"A Certain Magical Index\".\n\nL'intrigue raconte l'histoire d'une ville fictive appelée \"Gakuen City\" qui occupe un tiers de la partie occidentale de Tokyo et abrite 2,3 millions de personnes, dont 80 % sont des étudiants. La ville universitaire est isolée du monde extérieur et étudie les technologies les plus avancées. . Tous les étudiants reçoivent un développement de superpouvoirs, et la plupart d'entre eux obtiennent des superpouvoirs par le biais de drogues, d'hypnose et de stimulation électrique. Il existe différents types de capacités, qui sont divisées en personnes sans capacité, personnes à faible capacité, personnes à capacité différente, personnes à forte capacité, personnes à grande capacité et personnes à super capacité selon leur étendue et leur puissance. Le protagoniste de l'histoire, Kamijou Touma, est une personne handicapée dans l'académie, mais il n'est pas complètement impuissant. Sa capacité est d'invalider tous les pouvoirs surnaturels. Il ne peut utiliser cette capacité qu'avec sa main droite, et il a nommé sa capacité qui peut même effacer les miracles de Dieu \"Fantasy Killer\". Et parce que sa main droite semble avoir effacé les bénédictions de Dieu, il a vécu une vie malheureuse. Un jour de vacances d'été, sur le balcon de sa maison, il a rencontré une religieuse ; la jeune fille s'appelait \"Index\" et s'était échappée du monde de la magie, et est maintenant poursuivie par le magicien. C'est ainsi que la jeune fille qui maîtrise 103 000 livres de magie ultime et le garçon qui possède la main divine qui efface tous les miracles affronteront une série d'histoires...\n\nCe roman léger est très apprécié par les lecteurs pour son écriture délicate et ses idées d'intrigue exagérées et magnifiques. Il est rapidement devenu l'un des romans légers les plus populaires au Japon et s'est rapidement répandu dans le groupe ACGN national."
chi_GRnews.72.a: "La foudre qui danse au bout de tes doigts est ma foi éternelle en cette vie !"
chi_GRnews.73: "« A Certain Magical Index » est maintenant en vente !"
chi_GRnews.73.t: "« A Certain Magical Index » est maintenant en vente !"
chi_GRnews.73.a: "\"Laisse-moi utiliser cette main pour tuer ta fantaisie ennuyeuse sans laisser une seule pièce d'armure\""
chi_GRnews.73.d: "Ce mois-ci, le light novel « A Certain Magical Index », écrit par le romancier japonais Kamachi Kazuma, a commencé à être publié par Dengeki Bunko. C'est la première œuvre du nouvel écrivain Kamachi Kazuma.\n\nL'histoire raconte que dans cette ville, séparée de la partie ouest de Tokyo, au Japon, le « développement des superpouvoirs » est inscrit au programme scolaire (les étudiants sont utilisés comme sujets d'expérimentation scientifique humaine). Parmi les 2,3 millions d'habitants, 80 % sont des étudiants, c'est pourquoi elle est appelée la Cité Académique. Ils rivalisent chaque jour dans le développement de leurs superpouvoirs. Selon les différents niveaux de capacité, ils peuvent être divisés en 6 niveaux, de l'absence de capacité (niveau 0) à la superpuissance (niveau 5). Le protagoniste de l'histoire, Kamijou Touma, est une personne handicapée dans l'académie, mais il n'est pas complètement impuissant. Sa capacité est d'invalider tous les pouvoirs surnaturels. Il ne peut utiliser cette capacité qu'avec sa main droite, et il a nommé sa capacité, qui peut même effacer les miracles de Dieu, « Tueur d'Illusions ». Et parce que sa main droite semble avoir effacé les bénédictions de Dieu, il vit une vie malheureuse. Un jour de vacances d'été, sur le balcon de sa maison, il a rencontré une nonne ; la fille s'est appelée « Index » et s'est échappée du monde de la magie, et est maintenant poursuivie par le magicien. Ainsi, la fille qui a maîtrisé 103 000 livres de magie ultime et le garçon qui a la main divine qui efface tous les miracles vont faire face à une série d'histoires...\n\nCe light novel est très apprécié des lecteurs pour son écriture délicate et ses idées de complot exagérées et magnifiques. Il est rapidement devenu l'un des light novels les plus populaires au Japon et s'est rapidement répandu au sein du groupe ACGN national."
chi_GRnews.74: "La Terre Errante"
chi_GRnews.74.t: "La Terre Errante"
chi_GRnews.74.d: "Au début de la nouvelle année, un chef-d'œuvre de science-fiction est sorti en salles. C'est le film de science-fiction chinois \"La Terre Errante\" réalisé par Guo Fan, qui est adapté de la nouvelle de science-fiction originale de Liu Cixin \"La Terre Errante\". Le film est adapté du roman éponyme de Liu Cixin. L'histoire se déroule en 2075 et raconte l'histoire de la destruction imminente du soleil. Après la destruction, le système solaire n'est plus adapté à la survie humaine. Face au désespoir, les humains lanceront le plan \"Terre Errante\" pour tenter d'échapper au système solaire avec la terre et de trouver une nouvelle demeure pour l'humanité.\n\nCette série de films est une percée majeure dans l'histoire des films de science-fiction chinois en termes de technologie cinématographique et de niveau de production.\n\nLe \"Quotidien du Peuple\" a commenté : Le concept chinois d'affection familiale, de sentiments héroïques, de dévouement, de complexe de patrie et de coopération internationale reflétés dans \"La Terre Errante\". Les films ne sont plus des super-héros qui sauvent le monde, mais des humains qui changent leur destin ensemble. Ce concept est une percée dans la routine narrative des films de science-fiction hollywoodiens. Intégrer les pensées et les valeurs uniques de la Chine dans l'imagination et la discussion de l'avenir de l'humanité a élargi la vision de l'humanité désirant un avenir meilleur.\n\nLe film a été chaleureusement accueilli par tout le pays. Le 5 février 2019, le film \"La Terre Errante\" est sorti officiellement en Chine continentale. Le premier jour, avec 11,4 % de projections, il a rapporté 189 millions de yuans au box-office (dont 12,8 millions de yuans au box-office de minuit), se classant quatrième au box-office journalier ; le 6 février, avec 17,4 % de projections, le box-office a rapporté 258 millions de yuans, passant de la quatrième place au box-office journalier à la deuxième place, une augmentation de 38 % à contre-courant ; au 3 mars, le box-office cumulé du film a dépassé 4,5 milliards de yuans."
chi_GRnews.74.a: "Notre peuple peut certainement accomplir la mission\nindépendamment de la réalité ou de la fiction, indépendamment de la vie ou de la mort"
chi_GRnews.75: "Lettre de Qiao à la maison, première partie"
chi_GRnews.75.t: "Lettre de Qiao à la maison, première partie"
chi_GRnews.75.d: "Weiwei, bonjour à tous.\n\nAprès votre départ, le docteur est venu l'après-midi suivante. Il a fait un examen. Le lendemain, il a fait une autre prise de sang. Selon le docteur, la situation n'est pas mauvaise. Le rythme cardiaque rapide est dû à une insuffisance d'apport sanguin. Ajuster l'ordre et la quantité de prise du médicament. À mon avis, cela peut durer un certain temps. Nous voulons obtenir les rapports de prise de sang de vous deux, mais malheureusement ils sont tous en anglais. Bien que le docteur ait dit \"tous deux sont normaux\", nous voulons quand même demander aux deux docteurs Wang de jeter un coup d'œil pour voir si c'est vrai. C'est trop lourd à envoyer, alors j'ai copié une copie, veuillez la regarder.\nChaque jour, en regardant la télévision, on peut voir une publicité de l'empereur faisant la promotion de pâtes. \"Pour être empereur, il faut être un bon empereur. Pour manger des nouilles, il faut manger de bonnes nouilles.\" Au début, je trouvais ça drôle : l'empereur est devenu vendeur. Puis j'ai pensé, ce n'est pas surprenant. L'argent fait tourner le monde. Les rois européens faisaient aussi de la publicité, y compris des cérémonies de coupe de ruban. Cependant, c'était l'Europe, pas la Chine. Les empereurs chinois, y compris le dernier empereur, sont morts il y a longtemps. Pourquoi doivent-ils être vendeurs ?\nDe nos jours, pour promouvoir l'amélioration de la vie des gens, l'un des éléments indispensables est que la famille ait une télévision. Je ne pense pas qu'un empereur chinois ait eu un si grand bonheur, car il n'y avait pas de télévision à cette époque. Il n'y avait pas de télévision à regarder, et aucune publicité télévisée ne pouvait être faite. Il y a tellement d'empereurs à la télévision maintenant. Il est rare d'allumer la télévision chaque jour et de ne pas voir l'empereur. Je ne sais pas lequel est un bon empereur ou un mauvais empereur. Une chose qu'ils ont en commun est qu'ils transcendent tous le temps et l'espace et parlent de liberté, de démocratie, d'égalité et de bienveillance. Les artistes ont la liberté de créer. Empereurs, dieux, fleurs, oiseaux, poissons et insectes peuvent tous être utilisés par les artistes. Cependant, ils doivent utiliser leurs vrais noms et leurs actions ne peuvent pas être trop éloignées des personnes réelles. C'est toujours drôle de demander aux propriétaires d'esclaves de parler de démocratie. La démocratie était également évoquée à cette époque, mais c'était la démocratie des propriétaires d'esclaves. Ils ne donneraient jamais la démocratie aux esclaves. La démocratie de Qin Shihuang était uniquement pour les seigneurs féodaux, jamais pour les paysans. Les propriétaires d'esclaves capturaient des prisonniers et ne les tuaient pas, mais en faisaient des esclaves, ce qui était un progrès historique. Il était impossible de leur demander de faire plus. De même, la bourgeoisie a mis en place un système d'emploi, qui était plus avancé que le féodalisme. Seul le socialisme peut résoudre le problème de la libération complète de l'humanité. Il n'y aura plus de dictature à l'avenir, et il n'y aura pas de démocratie.\nPlus de papier, pour l'instant.\nJe vous souhaite à tous une bonne fête du 1er mai, et joyeux anniversaire au grand roi et au petit roi."
chi_GRnews.75.a: "Papa\n22 avril 2000"
chi_GRnews.76: "Lettre de Qiao à la maison, deuxième partie"
chi_GRnews.76.t: "Lettre de Qiao à la maison, deuxième partie"
chi_GRnews.76.d: "Chère fille aînée :\n\nNous vous souhaitons tout le meilleur pour votre 55e anniversaire ! Nous souhaitons tout le meilleur à toute votre famille !\n55 ans, ce n'est ni court ni long. J'espère que vous aurez une vie plus intéressante et plus heureuse au cours des 55 prochaines années.\nCe mois-ci, en regardant Kangxi, j'entendais toujours la phrase \"Je veux vraiment vivre encore 500 ans\". Je ne comprends pas ce que cela signifie. Si l'empereur Kangxi avait vraiment vécu 500 ans, nous serions toujours agenouillés devant cet empereur. C'est ridicule ! Mais ce n'est pas étonnant. Dans le monde d'aujourd'hui, beaucoup de gens veulent que la classe exploiteuse et le système d'exploitation vivent encore 500 ans. On entend partout parler de \"nouveau millénaire\". Surtout au cours des premières années, ce que nous avons vu et entendu, c'est que le capitalisme a trouvé un moyen de \"se perfectionner\" et que le jugement de Marx selon lequel le capitalisme périra est faux. Les faits ne mentent pas. Quatre avions ont frappé le \"11 septembre\", et de tels mythes sont difficiles à exporter. L'économie mondiale a stagné. Greenspan, qui était loué comme un dieu, était abasourdi. La politique et l'économie de l'Argentine sont en plein chaos. En France, même les gendarmes se sont mis en grève, ce qui peut être considéré comme une scène du nouveau siècle. Bien sûr, la bourgeoisie peut trouver un moyen de redresser la situation, et le capitalisme ne s'effondrera pas immédiatement. Cependant, le capitalisme a une histoire de 500 ans depuis le 16e siècle, et il veut probablement vivre encore 500 ans et entrer dans un nouveau millénaire. Cependant, je pense que leur destin ne sera pas meilleur que celui de l'empereur Kangxi, et il ne faudra peut-être pas aussi longtemps pour être remplacé par le socialisme. La classe exploiteuse et le système d'exploitation seront toujours remplacés par le communisme. Le véritable \"Long Live\" est le communisme, le peuple, et ceux d'entre nous qui luttent pour le communisme.\n\nCes mots ne sont pas souvent prononcés maintenant, mais je veux quand même les dire à ma fille comme cadeau d'anniversaire en 2002. J'espère que vous chérirez ce cadeau."
chi_GRnews.76.a: "Maman et Papa\n2001, 12, 31"
chi_GRnews.77: "Zhang Chunqiao est mort de maladie"
chi_GRnews.77.t: "Zhang Chunqiao est mort de maladie"
chi_GRnews.77.d: "Agence Xinhua, Pékin, 10 mai : Zhang Chunqiao, le principal coupable de l'affaire du groupe contre-révolutionnaire de Lin Biao et Jiang Qing, est décédé d'un cancer le 21 avril 2005.\n\nZhang Chunqiao, homme, ethnie Han, originaire de Juye, Shandong, le principal coupable du groupe contre-révolutionnaire de Jiang Qing. Il a été vice-Premier ministre du Conseil d'État de la République populaire de Chine et directeur du Département politique général de l'Armée populaire de libération chinoise. Il a été élu membre du 9e et 10e Comité central du Parti communiste chinois, membre du Bureau politique central et membre du Comité permanent du 10e Bureau politique central du Parti communiste chinois. Il était membre de la Bande des Quatre et l'un des principaux planificateurs de la Grande Révolution Culturelle Prolétarienne. En octobre 1976, il a été arrêté par le Comité central du Parti communiste chinois. Il a été placé en isolement et sous enquête par le Comité central. En juillet 1977, la troisième session plénière du 10e Comité central du PCC a décidé de l'expulser définitivement du Parti et de le démettre de toutes ses fonctions au sein et en dehors du Parti. Le 25 janvier 1981, il a été jugé publiquement par le Tribunal spécial de la Cour populaire suprême de la République populaire de Chine et condamné à mort avec un sursis de deux ans et à la privation à vie des droits politiques. En janvier 1983, sa peine a été commuée en prison à vie conformément à la loi, et la peine initiale de privation à vie des droits politiques est restée inchangée. En décembre 1997, sa peine a été commuée en 18 ans de prison et 10 ans de privation des droits politiques. Il a été libéré pour raison médicale en janvier 1998. Il est décédé de maladie en avril 2005."
chi_GRnews.77.a: "..."
