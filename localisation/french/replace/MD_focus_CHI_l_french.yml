chi_GR.36.a: ""J'espère vraiment que Xiaoyun pourra en apprendre plus sur 'Dub-lyoo-tee-me' à Shenzhen""
chi_GR.36.d: ""Attends, qu'est-ce que tu viens de dire ? Dub-lyoo-tee-me ? C'est quoi ce truc, et pourquoi ça 'glisse' et 'botte' les gens ?" Ce n'était pas la première fois qu'un résident de la communauté posait une telle question. Au cours des trois derniers jours, Liu Changjun avait dû répondre à des questions similaires d'innombrables fois chaque jour.\n"Oncle, ce n'est pas 'glisser' ou 'botter' ! C'est un terme étranger. Dans notre langue, cela signifie l'« Organisation mondiale du commerce » — c'est pour faire des affaires avec les étrangers !" "Oh, donc c'est pour faire des affaires. Mais qu'est-ce que ça a à voir avec nous ? Aucun de nos voisins ici ne fait des affaires avec des étrangers ! Tu n'es pas là pour vendre des produits étrangers, hein ? Pas intéressé, pas intéressé !" Liu Changjun installa rapidement son panneau promotionnel, tournant le slogan vers l'homme âgé. "Oncle, ne partez pas. Je ne suis pas là pour vendre quoi que ce soit. Je suis là pour partager des connaissances avec la communauté. Regardez mon gilet rouge — voyez, il y a même un emblème du Parti ici. Depuis quand les membres du Parti vont-ils vendre des choses ?" Liu pointa les mots sur le panneau. "Regardez ! La Chine vient d'adhérer à l'Organisation mondiale du commerce. Bientôt, les produits étrangers rempliront les étagères ici. Une fois que les produits étrangers arriveront, les prix de l'immobilier baisseront, et il sera plus facile pour vos enfants d'acheter une maison ! Factures de téléphone, pagers, médicaments, voitures... tout cela deviendra moins cher. La vie pour nous, gens ordinaires, s'améliorera de plus en plus ! De plus, nous pourrons ouvrir plus d'usines, créant des emplois pour les jeunes, et vendre ce que nous produisons à l'étranger pour gagner des devises étrangères. Ainsi, notre pays deviendra plus riche aussi !" \n"Vraiment ? Tant d'avantages ? Ça ressemble un peu à un mensonge... mais un membre du Parti ne dirait probablement pas de telles choses sans fondement, hein ? Hé, jeune camarade, ne partez pas encore ! Donnez-moi un flyer. Je le ramènerai pour l'étudier avec ma femme ce 'Dub-lyoo-tee-me' pour voir comment nous pouvons adhérer. Une fois que nous aurons compris, je viendrai vous trouver. Nous devons nous assurer que l'argent étranger donne aussi un coup de pied aux fesses à notre fils !" \nLiu Changjun se sentit un peu gêné. On dit que travailler avec les masses est difficile, et c'est vrai. Mais après ces quelques jours, il avait appris à apprécier le poids de la réalité. En regardant l'homme âgé s'éloigner joyeusement, il ressentit un mélange d'émotions qu'il ne pouvait pas tout à fait exprimer. Pourtant, quand il s'agit de travail promotionnel, peut-être que le processus n'est pas aussi important que le résultat, tant que le message passe..."
chi_GR.36.t: "Dub-lyoo-tee-me ?"
chi_GR.36: "Dub-lyoo-tee-me ?"
chi_GR.37.a: ""J'ai vu le monde aujourd'hui.""
chi_GR.37.d: ""Hé, vieux, obtenir un billet pour les Jeux olympiques de Pékin est plus difficile que d'obtenir un rendez-vous avec un spécialiste à l'hôpital ! Ça nous a presque coûté les courses d'une année !" Wang Aixia serrait les trois billets fermement, ses paumes assez moites pour les tremper. Son mari, Li Jianguo, portant une bouteille d'eau et des collations, se tenait droit au point de contrôle de sécurité bondé. "Qu'est-ce que tu sais, opinion féminine ! C'est un événement qui n'arrive qu'une fois par siècle ! Qiangzi pourra dire plus tard à ses camarades de classe que nous étions au Nid d'oiseau et au Cube d'eau !" Il se tourna vers son fils et dit : "Qiangzi, ce que nous allons voir plus tard est le grand gala avec Beibei et Jingjing !" Qiangzi, qui jouait à Snake la tête baissée, leva soudain les yeux : "Papa, ce sont les Fuwa ! Quoi Beibei et Jingjing ? Tu accueillais même Nini ! D'ailleurs, ça s'appelle la cérémonie d'ouverture, pas le grand gala !" Li Jianguo fut surpris par les mots étouffants de son fils et dit timidement : "C'est ce que je veux dire... J'ai entendu qu'ils vont allumer une énorme torche plus tard, plus haute que la cheminée de la salle des chaudières de notre usine !" Alors qu'ils passaient le rigoureux point de contrôle de sécurité et entraient vraiment dans le magnifique « Nid d'oiseau », la famille de trois se tut. La taille immense du lieu et le rugissement tonitruant des foules firent qu'instinctivement Wang Aixia saisit le bras de son mari. Lorsque le compte à rebours commença à retentir sur l'écran géant « can » et que les empreintes de feux d'artifice éblouissants marchaient le long de l'axe central, la bouche de Li Jianguo s'ouvrit, oubliant de la fermer. Surtout lorsque le drapeau rouge à cinq étoiles monta lentement au son de la « Marche des volontaires » et que le public de dizaines de milliers chanta à l'unisson, cet homme qui avait travaillé à l'usine pendant la moitié de sa vie essuya soudain ses yeux avec le dos de sa main. "Papa, tu pleures ?" "Nonsense ! C'est... c'est les lumières vives !" Li Jianguo s'éclaircit la gorge, essayant de retrouver sa dignité de chef de famille. "Je veux dire, ce 'Beiao'... est vraiment bien fait." Après le spectacle, alors que la foule sortait, Qiangzi était encore immergé dans l'excitation : "C'était tellement cool ! Je suis sûr que personne dans ma classe n'en a vu plus que moi ! Même les chansons de Bruce Lee sont sorties ! Wang Aixia, oubliant de s'inquiéter du prix des billets, marmonna : "Je vais devoir bien parler avec tante Zhang d'à côté plus tard. Elle ne peut pas voir la grandeur de ça devant la TV..." Li Jianguo dit peu, se contentant de se retourner et de jeter un œil au géant Nid d'oiseau, encore brillant dans la nuit. Il pensa en lui-même : J'appellerai ma mère à la maison demain..."
chi_GR.37.t: "Visite de la cérémonie d'ouverture"
chi_GR.38.a: "Acheter un billet pour aller dans l'espace !"
chi_GR.38.d: "Pour la première fois, le directeur d'atelier a arrêté la production cet après-midi. La télévision Changhong de 21 pouces a été déplacée au centre de la cour, son antenne pendante vers le sud-est. Li Daqiang et ses collègues ouvriers ont apporté des tabourets et se sont assis autour, marmonnant tranquillement : "C'est encore plus grandiose que de regarder Sun Wukong monter au ciel dans Voyage vers l'Ouest." "Quel Sun Wukong ? C'est Yang Liwei !" "La première personne de notre pays va être envoyée dans l'espace sur une fusée !" corrigea excité son apprenti, Xiao Chen. Li Daqiang prononça un "Oh", se sentant encore un peu surréaliste à l'idée — mettre une personne à l'intérieur de ce "gros pétard" et l'envoyer dans l'espace avec un whoosh. À la TV, la fusée, comme un géant crayon blanc, se tenait ferme sur le désert de Gobi. Lorsque le compte à rebours commença, toute la cour se tut, et Li Daqiang serra instinctivement ses gants de travail autour de ses genoux. "Allumage ! Décollage !" Des flammes jaillirent, et la fusée monta lentement, puis accéléra, traînant un bel arc dans le ciel bleu. Li Daqiang tendit le cou jusqu'à ce que l'écran annonce "fusée et vaisseau séparés", réalisant seulement alors qu'il avait retenu son souffle. "Succès ! Vieux Li, Yang Liwei est vraiment dans l'espace maintenant !" cria le contremaître, agitant son chapeau. Quelqu'un prit l'initiative, mais des pétards éclatèrent dans la cour de l'usine, comme un Nouvel An précoce. En rentrant chez lui, Li Daqiang fit exprès d'attendre son fils à la porte de l'école primaire. L'enfant jaillit comme un boulet de canon : "Papa ! Yang Liwei peut-il voir la Grande Muraille depuis son vaisseau spatial ?" "Oui ! Pourquoi pas ?" Li Daqiang souleva son fils sur ses épaules et pointa vers le ciel lointain rempli de coucher de soleil. "Il plane haut au-dessus des nuages. L'enseignant ne te l'a-t-il pas dit ? Notre pays construira un jour une station spatiale appelée Tiangong, et n'importe qui pourra y aller et la voir." La nuit, il s'allongea au lit, regardant les étoiles lointaines par la fenêtre, poussant sa femme du coude : "Hé, quand notre garçon grandira, pourra-t-il..."
chi_GR.38.t: "Vol spatial habité"
