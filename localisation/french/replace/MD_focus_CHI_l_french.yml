CHI_Urbanization_TT: " "

10_total_gdp_tt: "Le PIB total est supérieur ou égal à §Y10000§! milliards"

CHI_National_Population_Census_TT: "\n§YLa mise à jour en temps réel des données démographiques peut réduire la pression de la gestion sociale dans notre pays§!\n"
CHI_Sunway_BlueLight_MPP_TT: "\n§YNous allons commencer la recherche et le développement indépendants de notre propre supercalculateur national§!\n§YLancer le projet Sunway§!"

CHI_Modernizing_Agriculturee_TT: "Activer la décision §YModernisation de l'agriculture§!\n\n§YNous ferons de la Chine une puissance agricole capable de nourrir plus d'un milliard de personnes§!"
CHI_Expand_the_commodity_grain_base_TT: "Nous pouvons étendre la taille de la §YBase de céréales commerciales§! dans la décision §YModernisation agricole§!."
CHI_Agriculture_Logistics_System_Construction_TT: "\n§YUn système de logistique agricole développé favorisera grandement la transformation et la modernisation de la production agricole de mon pays !§!\n"
CHI_Leisure_Agriculture_and_Rural_Tourism_TT: "\n§YUn modèle de gestion agricole innovant favorisera grandement la transformation et la modernisation de la production agricole de mon pays !§!\n"
CHI_Promoting_agriculture_through_digital_commerce_TT: "\n§YL'économie numérique et le commerce électronique favoriseront grandement la transformation et la modernisation de la production agricole de mon pays !§!\n"
CHI_Power_surging_TT: "\n§YPolitique sociale et économique chinoise§! Effet supplémentaire :\nVitesse de construction : §G+5%§!"
CHI_Domestic_shield_tunneling_machine_TT: "\n§YNous allons commencer à tester les tunneliers nationaux§!\n"
CHI_Research_High_performance_steam_turbine_TT: "\n§YNous allons commencer à tester les turbines à vapeur haute performance§!\n"
CHI_The_vast_working_class_TT: "\n§YÉtant donné que nous avons la plus grande classe ouvrière du monde, les grandes entreprises de super-ingénierie de notre pays seront construites par les efforts conjoints d'innombrables personnes§!\n"
CHI_Super_Engine_TT: "\n§YAlors que nous avons mené le monde en matière de technologie de production et d'ingénierie, notre pays deviendra le moteur de fabrication d'ingénierie le plus puissant de la planète§!\n"

CHI_Shanghai_Pilot_Free_Trade_Zone_TT: "\n§YCela stimulera davantage la croissance économique de Shanghai§!\n\nShanghai §YPudong New Area§! Modificateurs de région Effets supplémentaires :\nVitesse de construction régionale : §G+15%§!\nAugmentation de la productivité régionale : §G+35%§!\n"
CHI_HKZM_Bridge_TT: "\n§YCela stimulera davantage la croissance économique dans le Delta de la rivière des Perles§!\n\nDelta de la rivière des Perles §YZone économique spéciale§!Modificateurs régionaux supplémentaires :\nVitesse de construction régionale : §G+5%§!\nAugmentation de la productivité régionale : §G+5%§!\n"

CHI_motuo_design_TT: "\n§YLancer la planification du plan de construction de la centrale hydroélectrique de Medog§!\n"
CHI_motuo_survey_TT: "\n§YGrâce au travail acharné de l'équipe d'expédition scientifique et de l'Armée populaire de libération, nous avons achevé l'étude de la centrale hydroélectrique de Medog et pouvons maintenant commencer la construction§!\n"
CHI_motuo_dam_TT: "\n§YLa centrale hydroélectrique de Medog dans le sud du Tibet fournira à mon pays une énorme quantité d'électricité§!\n"

CHI_OGAS_design_TT: "\n§YNous devons soumettre le projet de loi de construction au Comité permanent de l'Assemblée populaire nationale et à l'Assemblée populaire nationale pour examen§!"
CHI_OGAS_tian_TT: "§YL'avis d'examen du Comité permanent de l'Anp sera donné dans cinq jours§!"
CHI_OGAS_tian2_TT: "§YNous devons élaborer un plan plus raisonnable et des moyens qu'ils ne peuvent pas refuser...§!"
CHI_OGAS_tian3_TT: "§YEn raison de l'adoption de la « Loi sur la construction du système d'automatisation nationale de la République populaire de Chine », nous pouvons commencer la construction du système d'automatisation des Zones économiques spéciales dans notre décision§!"
CHI_OGAS_shenzhen_TT: "\n§YEfficacité de production du Delta de la rivière des Perles :§!§G+40§!\n\nShenzhen Region§YZone économique spéciale§! Effets supplémentaires :\nVitesse de construction régionale : §G+35%§!\nAugmentation de la productivité régionale : §G+40%§!"

Preliminary_construction_OGAS_TT: "§YNous pouvons renforcer le système Ogass en renforçant la coopération avec de plus grandes entreprises nationales d'informatique Internet§!"

Preliminary_construction_OGAS_OK: "Le système d'automatisation a été fondamentalement construit dans tout le pays."

CHI_Lenovo_TT: "\n§YLenovo Group aidera le système Ogass à mieux s'adapter au fonctionnement des ordinateurs personnels, bénéficiant à chaque employé de bureau dans les immeubles de bureaux§!"
#\n\n§YSystème d'automatisation national§! Effets supplémentaires :\nVitesse de recherche : §G+8%§!\nProductivité des parcs de bureaux : §G+30%§!\nVitesse de construction des parcs de bureaux : §G+10%§!\n

CHI_Huawei_TT: "\n§YHuawei Technologies Co., Ltd. aidera le système Ogass à s'adapter plus profondément aux fonctions liées à Internet et à améliorer efficacement la sécurité du système§!"
#\n\n§YSystème d'automatisation national§! Effets supplémentaires :\nVitesse de construction des infrastructures de communication : §G+25%§!\nTaux d'acquisition des ressources stratégiques : §G+8%§!\nChiffrement : §G+1§!\nDéchiffrement : §G+1§!\nNiveau de sécurité réseau : §G+1§!\nTaux de croissance de la force du réseau de renseignement : §G+30%§!\nModificateur de capacité de piratage : §G+30%§!\nRésistance à l'influence étrangère (multiplicateur) : §G+15§!\n

CHI_Xiaomi_TT: "\n§YXiaomi Technology Co., Ltd. aidera le système Ogass à être plus profondément adapté à la production d'appareils ménagers civils§!"
#\n\n§YSystème d'automatisation national§! Effets supplémentaires :\nProduction d'usine : §G+10%§!\nProductivité des usines civiles : §G+30%§!\nChiffrement : §G+1§!\nVitesse de construction de l'industrie civile : §G+30%§!\n

CHI_SARS_start_TT: "§YComme nous préparons actuellement le 16e Congrès national, nous n'avons pas le temps de nous occuper de cette question pour le moment, mais nous devons la résoudre et trouver une solution dès que possible après le congrès, sinon cela pourrait entraîner des conséquences imprévisibles§!"

