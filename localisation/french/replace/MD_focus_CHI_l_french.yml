chi_GRnews.79: "Pont Taipei-Fuzhou"
chi_GRnews.79.t: "Pont Taipei-Fuzhou"
chi_GRnews.79.d: "Après l'unification des deux rives du détroit de Taïwan, nous avons un besoin urgent d'un pont capable de relier le continent et Taïwan. Après la décision du gouvernement central, les plans de construction suivants ont été élaborés. Lequel devrions-nous choisir ?"
chi_GRnews.79.a: "Le plus tôt sera le mieux ! Toutes les ressources nécessaires seront allouées !"
chi_GRnews.79.b: "Il vaut mieux y aller lentement pour ne pas causer de problèmes"
chi_GRnews.79.c: "Qui a besoin d'un pont cassé ?"
chi_GRnews.80: "Pont Taifu achevé !"
chi_GRnews.80.t: "Pont Taifu achevé !"
chi_GRnews.80.d: "Après des centaines de jours de travail acharné par les travailleurs des deux rives du détroit de Taiwan, notre pays a finalement achevé le projet de pont Taifu. Après plusieurs mois d'exploitation expérimentale, le pont sera ouvert au public."
chi_GRnews.80.a: "Les deux rives du détroit sont inséparables"
chi_GRnews.81: "À la recherche du passé est maintenant diffusé !"
chi_GRnews.81.t: "À la recherche du passé est maintenant diffusé !"
chi_GRnews.81.d: "La série télévisée « À la recherche du passé », adaptée du roman du même nom écrit par Huang Yi-wei en 1998, est sortie à Hong Kong le 15 octobre 2001, et ses disques se sont rapidement répandus sur le continent. L'intrigue raconte l'histoire de Xiang Shaolong (joué par Louis Koo), un membre des forces spéciales au 21e siècle, qui est déterminé à participer à la recherche sur les voyages dans le temps afin de sauver son amour. Cependant, en raison d'une erreur dans les données de la machine à voyager dans le temps, Xiang Shaolong a été transporté à la période des Royaumes combattants. À cette époque, Ying Zheng (joué par Raymond Lam) n'était pas encore monté sur le trône et était emprisonné dans l'État de Zhao. Afin de retourner dans le futur, Xiang Shaolong n'a ménagé aucun effort pour aider Ying Zheng à monter sur le trône sans heurts. En raison de l'intelligence extraordinaire et de l'identité spéciale de Xiang Shaolong, ses capacités ont été appréciées par tous, mais il a également été victime des machinations de nombreuses personnes rusées. Dans des circonstances d'attaques de toutes parts, Xiang Shaolong a mis en scène une histoire d'amour."
chi_GRnews.81.a: "Aujourd'hui mon corps retourne dans ma patrie, et demain ton corps sera le même."
chi_GRnews.82: "Perdus en voyage est maintenant diffusé !"
chi_GRnews.82.t: "Perdus en voyage est maintenant diffusé !"
chi_GRnews.82.d: "Le 4 juin, un film intitulé Lost on Journey est sorti en salles. Le 22 juin, son box-office a dépassé les 33 millions. Alors que la Fête du Printemps approche, Li Chenggong (Xu Zheng), le patron d'un groupe de jouets, retourne à Changsha pour célébrer le Nouvel An. Dans le même temps, sous la pression de sa maîtresse Manni (Li Man), il se prépare à divorcer de sa femme (Zuo Xiaoqing) après le Nouvel An. En conséquence, après avoir rencontré Niu Geng (Wang Baoqiang), un \"vacher\" expérimenté qui se rend à Changsha pour recouvrer des dettes, la malchance continue. Le destin joue un tour à Niu Geng, qui rencontre Li Chenggong tout au long du chemin. Tous deux rencontrent de nombreuses situations embarrassantes sur la route, et ils rencontrent également toutes sortes de personnes et toutes sortes de choses étranges, ce qui gêne Li Chenggong et son image noble disparaît. Niu Geng est optimiste et positif. Afin de pouvoir rentrer chez eux, les deux voyagent ensemble. Ils changent de mode de transport sur le chemin du retour, comme l'avion, le train, le bus, le ferry, les camions et même les tracteurs. Mais les deux ont quand même passé beaucoup de temps dans la nature. La veille du Nouvel An, la réflexion sur les épreuves du chemin, et les personnes ou les choses qu'ils ont rencontrées en chemin, a eu un grand impact sur la vie des deux. En fin de compte, après que les deux ont vécu le voyage de la méconnaissance à l'amitié, la sincérité de Niu Geng a également changé le caractère indifférent de Li Chenggong, et a suscité chez Li Chenggong un retour au véritable amour. Le film a été bien accueilli dès sa sortie. Le Chongqing Times a commenté : L'intrigue du film est assez similaire au film américain de 1987 \"Crazy on a Journey\", mais il est digne d'intérêt pour refléter la situation de la société chinoise. Ce film part plus des détails des personnages et de la vie, il est donc plus proche de la vie. Le film maintient un ton de facilité du début à la fin. Le rythme du film n'est pas très rapide, mais le public peut toujours suivre le rythme du film. L'histoire fluide plus l'intrigue conflictuelle approfondissent la tension de l'intrigue, ce qui est le succès du film. De plus, la vulgarisation d'une histoire thématique de route clichée peut également entrer dans le rôle."
chi_GRnews.82.a: "Vous êtes aussi un chef, de quelle ferme venez-vous ?"
chi_GRnews.83: "Que les balles volent est maintenant diffusé !"
chi_GRnews.83.t: "Que les balles volent est maintenant diffusé !"
chi_GRnews.83.d: "Le 16 décembre, réalisé par Jiang Wen, écrit par Shu Ping, Jiang Wen, Guo Junli, Wei Xiao, Li Bukong, Zhu Sujin et Ma Shi Tu, le film dramatique \"Que les balles volent\" avec Jiang Wen, Chow Yun-fat, Ge You, Carina Lau, Chen Kun, Zhou Yun, Liao Fan, Jiang Wu et d'autres a été présenté en avant-première en Chine continentale. Le film est adapté du roman \"Dix contes de la nuit\" de Ma Shi Tu, racontant l'histoire du féroce bandit Zhang Muzhi qui s'est transformé en honnête fonctionnaire \"Ma Bangde\" et a pris ses fonctions de magistrat du comté d'Echeng, et a entamé une bataille féroce avec le tyran Huang Silang qui gardait Echeng. L'intrigue raconte l'histoire de Ma Bangde (joué par Ge You) qui a fait don d'argent pour obtenir le poste de magistrat du comté pendant les temps troublés de la République de Chine, et a entrepris un voyage à Echeng avec sa femme (jouée par Carina Lau) et son entourage. Cependant, leur voyage a été interrompu par une embuscade du brigand Zhang Mazi (joué par Jiang Wen) dans un endroit sauvage du sud. L'entourage a été brutalement tué, et seuls Ma Bangde et sa femme ont échappé par chance. Pour sauver sa vie, Ma Bangde a eu l'esprit vif et a menti en disant qu'il était... Le maître du magistrat du comté de Zhang Mazi, tandis que Zhang Mazi est attiré par la richesse décrite par Ma Bangde et décide de se faire passer pour le magistrat du comté et de conduire ses hommes à Echeng. Echeng, un endroit isolé, est en fait contrôlé par Huang Silang (joué par Chow Yun-fat), un seigneur local. Il est puissant et ne prend pas au sérieux le nouveau magistrat du comté. Peu de temps après la prise de fonctions de Zhang Mazi, il s'est affronté avec les forces de Huang Silang. Il a battu l'entraîneur d'arts martiaux de Huang (joué par Jiang Wu), et Huang Silang a conçu un plan pour tuer le fils adoptif de Zhang Mazi, Xiaoliu (joué par Zhang Mo). Ma Bangde, qui voulait à l'origine juste gagner de l'argent régulièrement, s'est accidentellement retrouvé impliqué dans la lutte de pouvoir entre bandits et tyrans. Un nuage inquiétant a plané au-dessus d'Echeng, annonçant la tempête sanglante à venir, et une confrontation sur le pouvoir, l'argent et la justice est sur le point de commencer."
chi_GRnews.83.a: "Ne soyez pas impatient, laissez les balles voler un moment"
chi_GRnews.84: "Beijing Xiaomi Technology Co., Ltd. est officiellement établie"
chi_GRnews.84.t: "Beijing Xiaomi Technology Co., Ltd. est officiellement établie"
chi_GRnews.84.d: "Le 6 avril, Lei Jun, le dirigeant de l'ancienne société Internet Kingsoft, a réuni une douzaine d'employés, chacun a bu un bol de bouillie de millet, a annoncé la création d'une entreprise, et a nommé l'entreprise \"Xiaomi\". Lei Jun, qui avait plus de 40 ans, a fondé Xiaomi, ce qui a surpris beaucoup de gens. Lei Jun a parlé de sa motivation entrepreneuriale : \"Le marché intérieur des téléphones mobiles est divisé entre les géants internationaux tels que Nokia, Motorola et Samsung, et les \"China Cool Union (ZTE, Huawei, Coolpad, Lenovo)\" produits dans le pays, et les innombrables téléphones mobiles contrefaits. Le marché chinois est principalement contrôlé par les géants internationaux, et les produits sont ridiculement chers, tandis que les téléphones mobiles nationaux sont très moyens. Comment peuvent-ils gagner de l'argent ainsi ? Je veux fabriquer le meilleur téléphone mobile au monde, le vendre à seulement la moitié du prix, afin que tout le monde puisse se le permettre !\""
chi_GRnews.84.a: "Basé sur la technologie, rentable et fabriquant les produits les plus cool"
chi_GRnews.85: "League of Legends serveur chinois en bêta ouverte"
chi_GRnews.85.t: "League of Legends serveur chinois en bêta ouverte"
chi_GRnews.85.d: "Depuis son lancement sur les marchés européen et américain en 2009, League of Legends, développé par Riot Games, a réussi à remporter la première place des jeux en ligne compétitifs européens et américains grâce à son excellente qualité de jeu. Le 22 septembre 2011, la bêta publique de League of Legends en Chine a été officiellement lancée, et elle a été exploitée par Tencent Games en Chine continentale. Sa popularité augmente de jour en jour, et la participation de nombreux développeurs de jeux et joueurs d'e-sport renommés en a fait un jeu en ligne populaire qui est bien connu et apprécié par le peuple. Ce jeu deviendra un jeu phénoménal en Chine dans un avenir prévisible."
chi_GRnews.85.a: "La puissance de Demacia !"

chi_news.1: "Le barrage des Trois Gorges est achevé !"
chi_news.1.t: "Le barrage des Trois Gorges est achevé !"
chi_news.1.d: "Du 14 décembre 1994, début de la construction du barrage des Trois Gorges, au 20 mai 2006, achèvement du barrage des Trois Gorges. Le volume de béton du barrage des Trois Gorges, un super projet, a atteint 16,1 millions de mètres cubes. C'est le barrage-poids avec le plus grand volume de béton, le plus grand nombre d'orifices d'écoulement du corps de barrage et le plus grand volume de décharge au monde. Son achèvement complet signifie que le projet des Trois Gorges a commencé à exercer pleinement ses capacités de contrôle des crues, élevant la norme de contrôle des crues de la section de Jingjiang du fleuve Yangtze de une fois tous les 10 ans à une fois tous les 100 ans, protégeant efficacement des dizaines de millions de personnes et des millions d'hectares de terres agricoles dans les tronçons moyen et inférieur du fleuve Yangtze des menaces d'inondation, et rendant le rôle du fleuve Yangtze en tant que \"voie navigable dorée\" plus pleinement manifeste et jouant son rôle. Le projet des Trois Gorges a des avantages considérables en matière de production d'électricité, ce qui contribue à atténuer le goulot d'étranglement énergétique de la Chine et joue un rôle important dans la construction d'artères énergétiques et l'optimisation de l'allocation des ressources énergétiques. Au cours du \"10e Plan quinquennal\", la Chine a proposé le plan de transmission \"Transmission d'électricité de l'Ouest vers l'Est\" pour construire trois grands canaux de transmission au nord, au centre et au sud. Parmi eux, le canal central part du Sichuan à l'ouest, traverse les Trois Gorges et se termine à Shanghai à l'est. Avec la construction du projet de transmission et de transformation de l'électricité du barrage des Trois Gorges, une série de projets de transmission d'électricité tels que Sanchang et Sanguan ont été mis en service, et le canal central de la transmission d'électricité de l'Ouest vers l'Est a commencé à prendre forme. L'énergie des Trois Gorges et l'hydroélectricité du Sichuan sont transmises en continu vers l'Est de la Chine et le Guangdong. L'hydroélectricité propre de l'ouest a joué un rôle important dans les zones déficientes en énergie de l'est, et les ressources énergétiques ont été optimisées entre les réseaux électriques régionaux."
chi_news.1.a: "Miracle incroyable"
chi_news.1.b: "L'homme peut conquérir la nature !"
chi_news.2: "Lancement de Shenzhou V"
chi_news.2.t: "Lancement de Shenzhou V"
chi_news.2.d: "À 9h00, heure de Pékin, le 15 octobre 2003, le vaisseau spatial habité Shenzhou V transportant l'astronaute chinois Yang Liwei a été lancé depuis le centre de lancement de satellites de Jiuquan. Il a effectué 14 orbites en 21 heures et 23 minutes. Après avoir accompli avec succès toutes les tâches opérationnelles prévues, la capsule de retour est revenue au site d'atterrissage principal en Mongolie intérieure à 6h23, heure de Pékin, le 16 octobre 2003. Son module orbital est resté en orbite pendant six mois. Le succès complet de la mission Shenzhou V marque que la Chine est devenue le troisième pays au monde à maîtriser indépendamment la technologie spatiale habitée après les États-Unis et l'Union soviétique."
chi_news.2.a: "Y a-t-il une fille chinoise nommée Chang'e sur la lune ?"
chi_news.2.b: "La mer d'étoiles !"
chi_news.3: "Défilé militaire chinois"
chi_news.3.t: "Défilé militaire chinois du 60e anniversaire"
chi_news.3.d: "Le 1er octobre 2009, la célébration du 60e anniversaire de la fondation de la République Populaire de Chine a eu lieu sur la place Tian'anmen à Pékin le matin du 1er octobre 2009. 200 000 soldats et civils ont célébré le 60e anniversaire de la Nouvelle Chine par un grand défilé militaire et un défilé de masse. Hu Jintao, alors secrétaire général du Comité central du PCC, président de l'État et président de la Commission militaire centrale, a passé en revue les troupes et prononcé un discours important. Devant la place Tian'anmen, le président chinois Hu Jintao a passé en revue 44 formations terrestres pleines d'entrain et bien équipées composées des trois services de l'Armée populaire de libération de Chine, de la Force de police armée populaire et des forces de milice de réserve. Le défilé militaire s'est terminé par une formation de défilé composée entièrement de jeunes sur le thème d'un \"avenir meilleur\", les enfants ont chanté la \"Chanson des Jeunes Pionniers de Chine\", indiquant que la cause du socialisme à caractéristiques chinoises se transmettra de génération en génération et aura des successeurs. Lorsque plus de 5 000 enfants tenant des ballons colorés et des guirlandes sont arrivés sur la place Tian'anmen, la musique de \"Chantera la mère patrie\" a retenti sur toute la place. Au milieu des chants passionnés, les enfants ont lâché les ballons qu'ils tenaient et se sont précipités vers le pont Jinshui comme un raz-de-marée avec des milliers de jeunes devant la place Tian'anmen. 50 000 ballons se sont envolés dans le ciel, et les jeunes ont agité des guirlandes vers la tour de Tian'anmen, acclamant et sautant de joie. Les gens sur et hors de la tour de Tian'anmen étaient remplis de sentiments sincères, et il y avait de la jubilation à l'intérieur et à l'extérieur de la place. Tous les Chinois ont célébré ensemble cette grande fête et ont souhaité à la mère patrie et au monde un avenir meilleur."
chi_news.3.a: "Le dragon géant a montré un coin de ses écailles de dragon"
chi_news.3.b: "Vive la République Populaire de Chine ! Vive la grande unité du peuple du monde !"
chi_news.4: "Exposition Universelle de Shanghai 2010"
chi_news.4.t: "Exposition Universelle de Shanghai 2010"
chi_news.4.d: "Le 1er mai 2010, l'Exposition Universelle de Shanghai 2010 a eu lieu à Shanghai, en Chine. Il s'agit de la 41e Exposition Universelle. Cette exposition répond à l'appel pour \"une meilleure ville, une meilleure vie\" avec le concept de \"ville harmonieuse\" et prend le bleu et le vert comme couleurs thématiques. Ce n'est pas seulement une démonstration du développement rapide de la Chine depuis la réforme et l'ouverture, mais aussi la mise en œuvre du \"concept de développement scientifique\" prôné par le président Hu Jintao. La Chine est de plus en plus devenue un grand pays à l'avant-garde du monde, passant d'un pays pauvre et arriéré."
chi_news.4.a: "J'aime le bleu"
chi_news.4.b: "Développement harmonieux"
chi_aiib.1: "Banque asiatique d'investissement dans les infrastructures établie"
chi_aiib.1.t: "Banque asiatique d'investissement dans les infrastructures établie"
chi_aiib.1.d: "Le 24 octobre 2014, les ministres des finances et les représentants autorisés des 21 premiers membres fondateurs potentiels, dont la Chine, l'Inde, Singapour, etc., ont signé un accord à Pékin et ont décidé conjointement de créer une banque d'investissement. Le 25 décembre 2015, la Banque asiatique d'investissement dans les infrastructures a été officiellement créée. Du 16 au 18 janvier 2016, la cérémonie d'ouverture de la AIIB et la réunion inaugurale du Conseil des gouverneurs et du Conseil d'administration ont eu lieu à Pékin. La Banque asiatique d'investissement dans les infrastructures est une institution multilatérale de développement intergouvernementale dans la région asiatique. Elle se concentre sur le soutien à la construction d'infrastructures. Son objectif est de promouvoir le processus d'interconnexion et d'intégration économique dans la région asiatique et de renforcer la coopération entre la Chine et d'autres pays et régions asiatiques. C'est la première institution financière multilatérale initiée par la Chine. Elle a son siège à Pékin et un capital statutaire de 100 milliards de dollars. En 2023, la AIIB compte 109 pays membres."
chi_aiib.1.a: "Où devons-nous signer ?"
chi_aiib.1.b: "Nous rejetons cette violation de notre souveraineté"
chi_aiib.1.c: "Notre influence grandit de jour en jour"
chi_sars.3: "Un nouveau virus émerge en Chine"
chi_sars.3.t: "Un nouveau virus apparaît en Chine"
chi_sars.3.d: "Le gouvernement chinois a annoncé aujourd'hui à l'Organisation mondiale de la santé qu'un nouveau virus hautement contagieux était apparu dans le sud de la Chine. Après une enquête préliminaire, l'Organisation mondiale de la santé a constaté que le virus était un type de coronavirus qui provoque le syndrome respiratoire aigu sévère, appartenant à l'ordre des Nidovirales, à la famille des Coronaviridae, au genre Coronavirus, et est un coronavirus du sous-groupe B du genre Beta. Il est actuellement nommé virus SRAS. Le virus a tué de nombreux citoyens chinois et s'est rapidement propagé à d'autres parties de la Chine et au monde."
chi_sars.3.a: "Le virus apporté par les Chinois..."
chi_sars.3.b: "J'espère que tout le monde est en sécurité"
chi_sars.4: "Le nombre de personnes infectées par le virus SRAS a cessé d'augmenter"
chi_sars.4.t: "Le nombre de personnes infectées par le virus SRAS a cessé d'augmenter"
chi_sars.4.d: "Le 13 juillet 2003, le nombre de patients atteints du SRAS et de cas suspects dans le monde a cessé d'augmenter, et le processus du SRAS était pratiquement terminé. Le virus, qui s'est propagé pendant plus de six mois, a eu un impact profond sur le monde. La Chine et d'autres pays de la région ont subi des pertes économiques et sociales de degrés divers."
chi_sars.4.a: "Il n'y en aura plus à l'avenir, n'est-ce pas ?"
chi_sars.4.b: "C'est enfin fini"
chi_sars.5: "Un virus inconnu éclate en Chine"
chi_sars.5.t: "Un virus inconnu éclate en Chine"
chi_sars.5.d: "Le 25 mars 2003, une infirmière chef nommée Ye Xin du service des urgences de la branche Ersha Island de l'hôpital provincial de médecine traditionnelle chinoise du Guangdong est décédée d'un virus inconnu, ce qui a rapidement provoqué la panique parmi la population. Le personnel de l'hôpital a accusé avec colère les autorités chinoises de dissimuler la situation du virus et de manquer la meilleure période de prévention et de contrôle. Selon eux, un nouveau virus hautement contagieux est apparu dans le sud de la Chine il y a quelques mois, qui a tué de nombreuses personnes. L'Organisation mondiale de la santé a rapidement envoyé une équipe spéciale en Chine pour enquêter sur le virus, mais a été entravée par la partie chinoise lors de l'entrée dans le pays. On ne sait pas clairement pourquoi les autorités chinoises ont dissimulé et nié à plusieurs reprises la situation du virus, mais il est certain que les actions des autorités chinoises ont provoqué la panique et les accusations des autres pays."
chi_sars.5.a: "Comment osent-ils ?"
chi_sars.5.b: "Arrêtez immédiatement le traître qui a divulgué l'information !"
chi_news.5: "Ouverture de la ligne de chemin de fer Qinghai-Tibet"
chi_news.5.t: "Ouverture de la ligne de chemin de fer Qinghai-Tibet"
chi_news.5.d: "Le 1er juillet 2006, un chemin de fer a finalement été construit sur le plus haut plateau du monde. À partir de juin 2001, la Chine a passé six ans à construire une ligne ferroviaire de 1 956 kilomètres sur le plateau Qinghai-Tibet. C'est la ligne ferroviaire la plus haute du monde avec la plus longue distance sur sol gelé et a surmonté des difficultés de classe mondiale. C'est un miracle d'ingénierie dans l'histoire de l'humanité. Cela ne marque pas seulement le soutien accru de la Chine aux régions arriérées, mais prouve également que Pékin a renforcé son contrôle sur les zones frontalières de la Chine."
chi_news.5.a: "Miracle incroyable"
chi_news.5.b: "Construisez le chemin de fer jusqu'au ciel !"
chi_aiib.3: "[FROM.GetName] devient membre de la Banque asiatique d'investissement dans les infrastructures"
chi_aiib.3.t: "[FROM.GetName] devient membre de la Banque asiatique d'investissement dans les infrastructures"
chi_aiib.3.d: "Après une série de demandes, d'évaluations et de correspondances, le gouvernement [FROM.GetLeader] a annoncé aujourd'hui que leur pays est devenu membre de la Banque asiatique d'investissement dans les infrastructures. Certains observateurs espèrent que cela symbolise un développement accru de la coopération économique entre la Chine et d'autres pays, tandis que les analystes pessimistes regrettent profondément l'influence croissante de la Chine et la menace qu'elle représente pour l'ordre mondial existant."
chi_aiib.3.a: "Le RMB circule"
chi_aiib.3.b: "Rapport de travail de Xu Er"
chi_aiib.4: "La Banque asiatique d'investissement dans les infrastructures lance une aide annuelle au développement"
chi_aiib.4.t: "La Banque asiatique d'investissement dans les infrastructures lance une aide annuelle au développement"
chi_aiib.4.d: "Après une série d'estimations budgétaires et de rapprochements, la Banque asiatique d'investissement dans les infrastructures, basée à Pékin, a annoncé qu'elle fournirait une année d'aide au développement à chaque pays membre. La Chine a déclaré qu'elle prendrait en charge la majeure partie des coûts de l'aide. Le président chinois Xi Jinping a déclaré qu'aider les pays sous-développés est la responsabilité de la Chine contemporaine en tant que grand pays, apportant la sagesse chinoise pour résoudre les difficultés de développement, contribuant la force chinoise pour résoudre les problèmes de développement mondiaux et démontrant la responsabilité diplomatique d'un grand pays. La Chine appelle tous les pays à construire un monde plus pacifique, stable et prospère, loin de la pauvreté et de la guerre. Il est généralement admis qu'il s'agit d'une stratégie secondaire pour la Chine afin de réaliser son objectif de construire une \"communauté de destin pour l'humanité\" et d'un moyen d'accroître son influence internationale."
chi_aiib.4.a: "Applaudissons-les"
chi_aiib.4.b: "Humidifier les choses en silence"
chi_aiib.5: "La Banque asiatique d'investissement dans les infrastructures offre des prêts à faible intérêt"
chi_aiib.5.t: "La Banque asiatique d'investissement dans les infrastructures offre des prêts à faible intérêt"
chi_aiib.5.d: "Après une série d'estimations budgétaires et de rapprochements, la Banque asiatique d'investissement dans les infrastructures, basée à Pékin, a annoncé qu'elle accorderait des prêts à faible intérêt à chaque pays membre. La Chine a déclaré que ses banques prendraient en charge les principales dépenses de prêt. Le président chinois Xi Jinping a déclaré qu'améliorer l'environnement financier international et établir un nouveau système financier international sont les attentes sincères de chaque pays. La Chine s'engagera à construire un système financier international plus équitable et transparent. La Chine appelle tous les pays à supprimer les barrières tarifaires, à renforcer les échanges financiers, à promouvoir le processus de mondialisation financière et à suivre la tendance de la mondialisation économique. À l'échelle internationale, il est généralement admis qu'il s'agit d'une stratégie secondaire pour la Chine afin de réaliser son objectif de construire une \"communauté de destin pour l'humanité\" et d'un moyen d'accroître son influence internationale."
chi_aiib.5.a: "RMB en circulation"
chi_aiib.5.b: "Les bienveillants répandent leur bonté, et les fidèles montrent leur loyauté"
chi_news.9: "Arabie saoudite, Iran, 'Réconciliation de Pékin'"
chi_news.9.t: "Arabie saoudite, Iran, 'Réconciliation de Pékin'"
chi_news.9.d: "Hier soir, le communiqué conjoint publié par la République populaire de Chine, le Royaume d'Arabie saoudite et la République islamique d'Iran a fait la une des médias nationaux et étrangers, ajoutant une énergie pacifique au monde turbulent actuel, plongé dans l'ombre du conflit russo-ukrainien depuis plus d'un an. Le cœur du communiqué est que l'Arabie saoudite et l'Iran parviendront à un accord, notamment en convenant de rétablir les relations diplomatiques entre les deux parties, en rouvrant les ambassades et les bureaux de représentation des deux parties dans un délai maximum de deux mois, en organisant l'échange d'ambassadeurs et en explorant le renforcement des relations bilatérales. Les trois pays ont exprimé leur volonté de faire tout leur possible pour renforcer la paix et la sécurité internationales et régionales. Il ne fait aucun doute que le rôle de la Chine est indispensable à la réalisation de la \"Réconciliation de Pékin\". Le ministre chinois des Affaires étrangères Wang Yi a déclaré après le dialogue que le dialogue de Pékin a été promu sur la base du consensus des dirigeants de la Chine, de l'Arabie saoudite et de l'Iran. Le dialogue est également devenu une pratique réussie de mise en œuvre efficace de l'\"Initiative mondiale de sécurité\". En tant que médiateur de bonne volonté et fiable, la Chine a fidèlement rempli ses fonctions d'hôte. Les observateurs estiment qu'il s'agit d'une victoire pour la diplomatie pacifique et d'une manifestation de l'influence internationale croissante de la Chine."
chi_news.9.a: "La main de la Chine s'étend-elle au Moyen-Orient ?"
chi_news.9.b: "L'harmonie apporte la richesse"
chi_news.27: "La dixième Assemblée Populaire Nationale de la République Populaire de Chine"
chi_news.27.t: "La dixième Assemblée Populaire Nationale de la République Populaire de Chine"
chi_news.27.d: "Le 4 mars 2003, la 10e Assemblée Populaire Nationale de la République Populaire de Chine s'est tenue à Pékin. Lors de la première session, Hu Jintao a été élu Président de la République Populaire de Chine et Secrétaire Général du Comité Central, et il a été décidé que Wen Jiabao serait élu Premier ministre du Conseil d'État. Cela a marqué le transfert officiel de la direction de la Chine à la nouvelle génération de dirigeants représentée par Hu Jintao et Wen Jiabao."
chi_news.27.a: "Un gentleman prudent"
chi_news.27.b: "Serrer les rangs autour du Comité Central du Parti avec le camarade Hu Jintao comme Secrétaire Général !"
chi_news.28: "La 12e Assemblée Populaire Nationale de la République Populaire de Chine"
chi_news.28.t: "La 12e Assemblée Populaire Nationale de la République Populaire de Chine"
chi_news.28.d: "La 12e Assemblée Populaire Nationale de la République Populaire de Chine s'est tenue le 5 mars 2013. La première session de la réunion a élu Xi Jinping, Président de la République Populaire de Chine, comme Secrétaire Général du Comité Central, et a décidé du candidat au poste de Premier ministre du Conseil d'État, à savoir Li Keqiang. Cela marque que la direction de la Chine a été officiellement transférée à la nouvelle génération de dirigeants représentée par Xi Jinping. L'ancien Secrétaire Général Hu Jintao a démissionné de tous ses postes en une seule fois lors de cette transition de direction, créant un style sans précédent. Xi Jinping a exprimé son respect pour ce geste dans son discours, affirmant que Hu Jintao et d'autres camarades ont pris l'initiative de démissionner des postes de direction du Comité Central du Parti, ce qui reflète leur noble caractère et leur intégrité."
chi_news.28.a: "A démissionné de tous ses postes ?"
chi_news.28.b: "Serrer les rangs autour du Comité Central du Parti avec le camarade Xi Jinping comme noyau !"
chi_news.100.t: "L'incident de la fraude \"Hanxin\""
chi_news.100.d: "En février 2003, Chen Jin, le doyen de l'École de microélectronique de l'Université Jiaotong de Shanghai, a affirmé avoir inventé le \"Hanxin n° 1\". Le \"Hanxin n° 1\" prétendait être conçu avec le procédé semi-conducteur internationalement avancé de 0,18 micron, intégrait 2,5 millions de dispositifs et avait un noyau de calcul 32 bits, capable d'effectuer 200 millions d'opérations par seconde. Bien que les experts faisant autorité de l'époque aient cru qu'il s'agissait d'une avancée dans l'industrie des semi-conducteurs en Chine, et que Chen Jin, considéré comme l'inventeur du \"Hanxin n° 1\", ait également été honoré, le 17 janvier 2006, quelqu'un l'a publiquement accusé d'avoir inventé le \"Hanxin n° 1\" sur le BBS Shuimu Tsinghua de l'Université Tsinghua. Après plus de deux mois de collecte de preuves et d'enquête, les autorités ont finalement découvert que Chen Jin avait commis une fraude et une tromperie graves dans le processus de développement des puces de la série \"Hanxin\", et avait trompé tout le monde avec de faux résultats de recherche scientifique. Après la découverte de la fraude, toute l'industrie chinoise des puces indépendantes est tombée dans une crise de confiance, et le développement des semi-conducteurs a stagné pendant un certain temps."
chi_news.100.a: "Ont-ils toujours falsifié les choses ainsi ?"
chi_news.100.b: "Je suis sans voix."
chi_GR.9999.t: "Voulez-vous quelque chose de différent ?"
chi_GR.9999.d: "Veuillez noter : les options suivantes ne font pas partie du contenu par défaut du jeu, et nous ne sommes pas responsables si des bugs surviennent !"
chi_GR.9999.a: "Combattez ! Impressionnant !"
chi_GR.9999.b: "Ayons de l'influence"
chi_GR.9999.c: "Écoutez-moi"
chi_GR.9999.e: "Tais-toi, Yankee"
