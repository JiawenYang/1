PLA_Advanced_UAV: "Avantage UAV"
PLA_Advanced_UAV_desc: "En tant que grande puissance UAV, nous disposons d'avantages en matière de drones que d'autres pays ne peuvent obtenir. Personne ne peut maintenir la volonté de combattre face à un essaim écrasant de drones."
PLA_Army_Doctrine_Technology: "Recherche de tactiques avancées"
PLA_Army_Doctrine_Technology_desc: "Nouvelles tactiques et nouvelles idées fleurissent. Nous devons saisir l'opportunité de briser la pensée conventionnelle et explorer profondément les directions possibles de la théorie militaire."
PLA_Battle_Fleet: "Construction de la flotte de bataille décisive"
PLA_Battle_Fleet_desc: "Avec les porte-avions et destroyers lance-missiles comme noyau, nous nous concentrerons sur la confrontation de haute intensité, en mettant l'accent sur les percées en capacités anti-accès et déni de zone, et en assurant que nous puissions rivaliser avec des ennemis puissants en haute mer à l'avenir."
PLA_Equipment_Modernization: "Modernisation du système d'équipement"
PLA_Equipment_Modernization_desc: "Promouvoir l'universalisation, la furtivité et l'intelligence de la plateforme du système d'équipement de toute l'armée, ce qui peut grandement améliorer la capacité de frappe précise sur le champ de bataille et la survivabilité."
PLA_Extreme_Training: "Entraînement au combat réel"
PLA_Extreme_Training_desc: "Promouvoir la confrontation inter-régionale et mettre l'accent sur les exercices dans des environnements extrêmes au sein de l'armée pour éviter que les exercices ne deviennent une « représentation »."
PLA_Information_Navy_fleet: "Informatisation et opérations sans pilote"
PLA_Information_Navy_fleet_desc: "Il est extrêmement important d'améliorer le niveau de fabrication d'équipements intelligents et de renforcer la perception du champ de bataille et d'approfondir les capacités de combat distribuées."
PLA_Multiple_Sea_Areas: "Présence dans plusieurs zones maritimes"
PLA_Multiple_Sea_Areas_desc: "À mesure que notre statut international augmente, nos intérêts à l'étranger nécessitent une protection navale, non seulement pour défendre nos intérêts centraux en mer de Chine orientale et en mer de Chine méridionale, mais aussi pour assurer la sécurité des voies navigables clés telles que l'océan Indien et le Pacifique occidental."
PLA_Service_Fleet: "Expansion de la flotte de service"
PLA_Service_Fleet_desc: "Avec les frégates comme force principale, elle entreprend des tâches de faible intensité telles que les patrouilles maritimes à moyenne et longue distance, la lutte contre la piraterie et l'escorte. Elle est rentable et à grande échelle, réduisant la charge sur les principaux navires de combat."
PLA_Synthetic_Camp: "Synthèse de l'organisation de combat"
PLA_Synthetic_Camp_desc: "L'armée adoptera un modèle de « combinaison de blocs de construction », mélangeant chars, artillerie, génie et autres armes en forces multifonctionnelles, réalisant « plug and play », et améliorant la résistance à la destruction du système et la flexibilité des missions."
