 BAN.conservatism: "£BAN_western_conservatism Parti national"
 BAN.conservatism_icon: "£BAN_western_conservatism"
 BAN.conservatism_desc: "Le Parti Jatiya est un parti politique bangladais fondé le 1er janvier 1986 par Hussain Muhammad Ershad comme plateforme civile pour soutenir sa présidence militaire. En deux ans, il a remporté deux élections parlementaires, bien que largement considérées comme entachées d'irrégularités. Après la destitution d'Ershad lors du soulèvement de 1990, le parti n'a pas réussi à regagner sa domination électorale, mais a rejoint à plusieurs reprises des gouvernements de coalition avec la Ligue Awami."
 BAN.liberalism: "£BAN_western_liberal Parti national du Bangladesh"
 BAN.liberalism_icon: "£BAN_western_liberal"
 BAN.liberalism_desc: "Le Parti Jatiya du Bangladesh, plus simplement connu sous le nom de BJP, est un parti politique conservateur de centre-droit au Bangladesh. Il s'agit d'une scission du Parti Jatiya original, fondé par l'ancien président Hossain Mohammad Ershad. Il était auparavant connu sous le nom de Parti Jatiya (Naziur), en hommage à son défunt président, Naziur Rahman Manzur. Membre du Mukti Bahini pendant la guerre d'indépendance du Bangladesh de 1971, Manzur a été ministre des Collectivités locales et du Développement rural et maire de la municipalité de Dhaka sous le régime d'Ershad. Manzur a également été secrétaire général du Parti Jatiya entre 1998 et 2001."
 BAN.communist_state: "£BAN_emerging_communism Parti des travailleurs du Bangladesh"
 BAN.communist_state_icon: "£BAN_emerging_communism"
 BAN.communist_state_desc: "Le Parti des travailleurs du Bangladesh est un parti communiste du Bangladesh. Rashed Khan Menon en est le président et Fazle Hossain Badsha en est le secrétaire général."
 BAN.anarchist_communism: "£BAN_anarchist_communism Parti national socialiste"
 BAN.anarchist_communism_icon: "£BAN_anarchist_communism"
 BAN.anarchist_communism_desc: "Le Jatiya Samajtantrik Dal est un parti politique bangladais fondé par Serajul Alam Khan. Il a dominé l'insurrection bangladaise de 1972-1975. Son président actuel est Hasanul Haque Inu."
 BAN.Caliphate: "£BAN_Caliphate Parti islamique du Bangladesh"
 BAN.Caliphate_icon: "£BAN_Caliphate"
 BAN.Caliphate_desc: "Le Jamaat-e-Islami du Bangladesh est un parti politique islamiste conservateur du Bangladesh. Il est issu de l'aile est-pakistanaise du Jamaat-e-Islami Pakistan en 1979. Il est le plus grand parti islamiste du pays."
 BAN.Conservative: "£BAN_Conservative Ligue du peuple du Bangladesh"
 BAN.Conservative_icon: "£BAN_Conservative"
 BAN.Conservative_desc: "La Ligue Awami du Bangladesh, plus connue sous le nom de Ligue Awami, est un parti politique majeur au Bangladesh. Fondée le 23 juin 1949, elle est le plus ancien parti du pays et a joué un rôle essentiel dans la lutte pour l'indépendance. Avec le Parti nationaliste du Bangladesh, elle est l'un des deux partis traditionnellement dominants du pays et a dominé le système politique du pays de 2009 à 2024, avant d'être renversée par la Révolution de juillet. Ses activités ont été interdites par le gouvernement post-révolutionnaire le 10 mai 2025, en vertu de la loi antiterroriste."
 BAN.Nat_Populism: "£BAN_Nat_Populism Parti nationaliste du Bangladesh"
 BAN.Nat_Populism_icon: "£BAN_Nat_Populism"
 BAN.Nat_Populism_desc: "Le Parti nationaliste du Bangladesh est un parti politique majeur au Bangladesh. Il a été fondé le 1er septembre 1978 par le président Ziaur Rahman, dans le but de fédérer la population autour d'une idéologie nationaliste. Plus tard, le BNP s'est imposé comme l'un des deux partis traditionnellement dominants au Bangladesh, aux côtés de son rival, la Ligue Awami."
 BHU.conservatism: "£BHU_western_conservatism Druk Phuensum Tshogpa"
 BHU.conservatism_icon: "£BHU_western_conservatism"
 BHU.anarchist_communism: "£BHU_anarchist_communism Druk Nyamrup Tshogpa"
 BHU.anarchist_communism_icon: "£BHU_anarchist_communism"
 BHU.Neutral_Libertarian: "£BHU_Neutral_Libertarian Parti démocratique populaire"
 BHU.Neutral_Libertarian_icon: "£BHU_Neutral_Libertarian"
 CBD.liberalism: "£CBD_liberalism Parti de la bougie"
 CBD.liberalism_icon: "£CBD_liberalism"
 CBD.liberalism_desc: "Le Parti des Chandelles est un parti libéral cambodgien. Membre du Conseil des Libéraux et Démocrates d'Asie, de l'Internationale Libérale et de l'Alliance des Démocrates, il est le principal parti d'opposition du Cambodge et le principal adversaire du Parti du Peuple Cambodgien au pouvoir. Ce parti, qui aurait été le seul à pouvoir rivaliser avec le PPC, a été disqualifié des élections de 2023 par la Commission électorale nationale, bien qu'il ait été autorisé à participer aux élections locales de 2022. Après une période d'inactivité depuis 2012, il a repris ses activités politiques en octobre 2021."
 CBD.conservatism: "£CBD_conservatism FUNCINPEC"
 CBD.conservatism_icon: "£CBD_conservatism"
 CBD.conservatism_desc: "Le Front national uni pour un Cambodge indépendant, neutre, pacifique et coopératif, communément appelé FUNCINPEC, est un parti politique royaliste cambodgien. Fondé en 1981 par Norodom Sihanouk, il était à l'origine un mouvement de résistance contre le gouvernement de la République populaire du Kampuchéa (RPK). En 1982, il a conclu un pacte de résistance avec le Gouvernement de coalition du Kampuchéa démocratique (CGDK), le Front de libération nationale du peuple khmer (FLPK) et les Khmers rouges. Il est devenu un parti politique en 1992."
 CBD.Autocracy: "£CBD_Autocracy Parti du peuple cambodgien"
 CBD.Autocracy_icon: "£CBD_Autocracy"
 CBD.Autocracy_desc: "Le Parti du peuple cambodgien est un parti politique cambodgien qui dirige le pays depuis 1979. Fondé en 1951, il était à l'origine connu sous le nom de Parti révolutionnaire du peuple cambodgien (KPRP)."
 CBD.Neutral_Libertarian: "£CBD_Neutral_Libertarian Parti de soutien à la nation cambodgienne"
 CBD.Neutral_Libertarian_icon: "£CBD_Neutral_Libertarian"
 CBD.Neutral_Libertarian_desc: "Le Parti national cambodgien de soutien a été créé par son président Pen Sovan le 21 janvier 1998 et a tenu son premier congrès le même jour."
 LAO.communist_state: "£LAO_emerging_communism Parti révolutionnaire populaire lao"
 LAO.communist_state_icon: "£LAO_emerging_communism"
 LAO.communist_state_desc: "Le Parti révolutionnaire populaire lao est le parti fondateur et unique au pouvoir en République démocratique populaire lao. Son monopole sur le pouvoir d'État est garanti par l'article 3 de la Constitution du Laos, et il maintient un État unitaire avec un contrôle centralisé de l'économie et de l'armée."
 NEP.communist_state: "£Communist_Party_of_Nepal Parti communiste du Népal (centre maoïste)"
 NEP.communist_state_desc: ""
 NEP.Neutral_Communism: "£Communist_Party_of_Nepal_not_hardline Parti communiste du Népal (marxiste-léniniste unifié)"
 NEP.Neutral_Communism_desc: ""
 PAK.conservatism: "£PAK_western_conservatism Ligue musulmane du Pakistan (F)"
 PAK.conservatism_icon: "£PAK_western_conservatism"
 PAK.conservatism_desc: "La Ligue musulmane pakistanaise (fonctionnelle) est un parti politique nationaliste et pro-Hurs au Pakistan. Il s'agit de l'un des groupes dissidents de la Ligue musulmane pakistanaise. La lettre «F» de son nom signifie «fonctionnel». Elle est principalement associée au chef religieux sindhi Pir Pagaro."
 PAK.liberalism: "£PAK_liberalism Mouvement national uni"
 PAK.liberalism_icon: "£PAK_liberalism"
 PAK.liberalism_desc: "Le Mouvement Muttahida Qaumi est un parti politique pakistanais à orientation libérale et à idéologie nationaliste mouhajir. Son chef est Khalid Maqbool Siddiqui. Son symbole est le cerf-volant. Il est principalement actif à Karachi, où réside la majorité des mouhajirs. Son objectif est de défendre les droits humains des mouhajirs au Pakistan par une lutte pacifique et démocratique. Il est une faction dissidente du MQM-L."
 PAK.socialism: "£PAK_socialism Parti du peuple pakistanais"
 PAK.socialism_icon: "£PAK_socialism"
 PAK.socialism_desc: "Le Parti du peuple pakistanais (PPP) est un parti politique pakistanais de centre-gauche à gauche et d'idéologie socialiste démocratique. Il est l'un des trois principaux partis politiques traditionnels, avec la Ligue musulmane pakistanaise (N) et le Pakistan Tehreek-e-Insaf."
 PAK.communist_state: "£PAK_Communist_State Parti communiste du Pakistan"
 PAK.communist_state_icon: "£PAK_Communist_State"
 PAK.communist_state_desc: "Le Parti communiste pakistanais fut fondé à Calcutta, en Inde, peu après la création du Pakistan le 6 mars 1948. Lors de son deuxième congrès, qui se tenait alors à Calcutta, il fut décidé de créer un parti communiste distinct dans le nouvel État pakistanais. Le Pakistan, pays relativement jeune et instable, était considéré comme mûr pour une révolution. Les délégués pakistanais se séparèrent et tinrent une session distincte au cours de laquelle ils constituèrent le PCP. Sajjad Zaheer, fondateur de l'Association pan-indienne des écrivains progressistes, originaire du Pakistan occidental, fut élu secrétaire général. Les délégués du Pakistan oriental élirent un Comité provincial du Pakistan oriental. De nombreux dirigeants musulmans du PCP furent envoyés au Pakistan pour contribuer à la formation du parti. Le PCP adopta une idéologie léniniste, visant à fomenter une révolution communiste par l'intermédiaire d'un noyau dur d'intellectuels et de travailleurs, une stratégie inspirée de l'approche de Vladimir Lénine lors de la Révolution russe de 1917."
 PAK.Conservative: "£PAK_Conservative Ligue musulmane du Pakistan (N)"
 PAK.Conservative_icon: "£PAK_Conservative"
 PAK.Conservative_desc: "La Ligue musulmane du Pakistan (Nawaz) est un parti politique de centre-droit et conservateur. Elle est l'un des trois principaux partis politiques traditionnels, avec le Parti du peuple pakistanais et le Pakistan Tehreek-e-Insaf."
 PAK.anarchist_communism: "£PAK_anarchist_communism Mouvement populaire"
 PAK.anarchist_communism_icon: "£PAK_anarchist_communism"
 PAK.anarchist_communism_desc: "Le Parti national Awami est un parti politique pakistanais, principalement basé dans le Khyber Pakhtunkhwa. Il affiche une position politique de gauche et une idéologie nationaliste et fédéraliste pachtoune. Fondé par Abdul Wali Khan en 1986, il est actuellement présidé par Aimal Wali Khan, arrière-petit-fils de Bacha Khan. Mian Iftikhar Hussain en est le secrétaire général."
 PAK.Nat_Autocracy: "£PAK_Nat_Autocracy Ligue musulmane du Pakistan (Q)"
 PAK.Nat_Autocracy_icon: "£PAK_Nat_Autocracy"
 PAK.Nat_Autocracy_desc: "La Ligue musulmane du Pakistan (Q) est un parti politique pakistanais avec une position politique de centre-droit et une idéologie conservatrice modérée."
 PAK.Nat_Fascism: "£PAK_Nat_Fascism Assemblée du clergé islamique (F)"
 PAK.Nat_Fascism_icon: "£PAK_Nat_Fascism"
 PAK.Nat_Fascism_desc: "Le Jamiat Ulema-e-Islam Pakistan est un parti politique pakistanais d'extrême droite et d'idéologie fondamentaliste islamique. Fondé en 1945 sous le nom de Jamiat Ulema-e-Islam, il est né d'une scission entre factions en 1988, le «F» représentant le nom de son leader, Maulana Fazl-ur-Rehman."
 PAK.Nat_Populism: "£PAK_Nat_Populism Mouvement du Pakistan pour la justice"
 PAK.Nat_Populism_icon: "£PAK_Nat_Populism"
 PAK.Nat_Populism_desc: "Le Pakistan Tehreek-e-Insaf est un parti politique pakistanais fondé en 1996 par le joueur de cricket et homme politique Imran Khan. Le PTI figure parmi les trois principaux partis politiques pakistanais, aux côtés de la Ligue musulmane pakistanaise-Nawaz et du Parti du peuple pakistanais."
 VIE.communist_state: "£VIE_communism Parti communiste vietnamien"
 VIE.communist_state_icon: "£VIE_communism"
 VIE.communist_state_desc: "Le Parti communiste du Vietnam (PCV) est le seul parti légal du Vietnam. Fondé en 1930 par Hô Chi Minh, le PCV est devenu le parti au pouvoir au Nord-Vietnam en 1954 après la première guerre d'Indochine, puis au Vietnam tout entier en 1975 après la guerre du Vietnam. Bien qu'il existe nominalement aux côtés du Front de la Patrie du Vietnam, il maintient un gouvernement unitaire et exerce un contrôle centralisé sur l'État, l'armée et les médias. La suprématie du PCV est garantie par l'article 4 de la Constitution nationale. Le public vietnamien appelle généralement le PCV simplement «le Parti» ou «notre Parti»."
CHI.Conservative: "£generic_Conservative_small Parti démocrate chinois des paysans et des travailleurs"
CHI.Conservative_desc: "Le Parti démocrate chinois des paysans et des travailleurs (PDCPT) est l'un des huit partis démocratiques mineurs de la République populaire de Chine sous la direction du Parti communiste chinois. Le parti a été officiellement fondé dans la concession française de Shanghai le 9 août 1930 par des membres de gauche du Kuomintang. Il est principalement composé de membres travaillant dans les domaines de la santé publique, de la médecine et des domaines associés de la science et de la technologie. C'est le cinquième parti mineur en Chine."
CHI.Neutral_Libertarian: "£CHI_Neutral_Libertarian_small Société Jiusan"
CHI.Neutral_Libertarian_desc: "La Société Jiusan est le septième parti démocratique de la République populaire de Chine. Sa constitution stipule qu'il s'agit d'un parti politique ayant les caractéristiques d'une alliance politique, principalement composée d'intellectuels de haut et de moyen niveau dans le domaine de la science et de la technologie. C'est un allié proche du Parti communiste chinois, acceptant sa direction et coopérant étroitement avec lui, et c'est un parti participant au système socialiste chinois. Ses premiers membres étaient pour la plupart des universitaires. Actuellement, ses membres sont principalement des intellectuels de haut et de moyen niveau dans le domaine de la science et de la technologie."
CHI.Neutral_Libertarian_icon: "£CHI_Neutral_Libertarian_small"
CHI.Neutral_conservatism: "£CHI_non_aligned_conservative Parti chinois de la justice publique"
CHI.Neutral_conservatism_desc: "Le Parti chinois de la justice publique (PCJP) est le sixième plus grand parti démocratique de la République populaire de Chine. Actuellement, ses membres sont principalement composés de Chinois d'outre-mer rapatriés, de leurs familles et de figures représentatives ayant des liens avec l'étranger. Fondé en 1925, les premiers membres du PCJP provenaient en grande partie des sociétés triades Hongmen d'outre-mer. Son prédécesseur était une organisation d'outre-mer initiée par le « American Hongmen Zhi Gong Tang », un groupe communautaire chinois visant à protéger les droits et intérêts légitimes des Chinois d'outre-mer. Dans son travail pratique, le PCJP assume également les responsabilités de la branche chinoise de Hongmen, gérant les rencontres avec les délégations et membres de Hongmen d'outre-mer, et effectuant des visites auprès des organisations Hongmen d'outre-mer."
CHI.Neutral_conservatism_icon: "£CHI_non_aligned_conservative"
CHI.oligarchism: "£generic_oligarchism_small Association chinoise de construction démocratique nationale"
CHI.oligarchism_desc: "L'Association chinoise de construction démocratique nationale (ACCDN) est le troisième plus grand parti démocratique de la République populaire de Chine. Fondée le 16 décembre 1945 sous le nom d'Association démocratique de construction nationale, elle a été renommée Association chinoise de construction démocratique nationale par résolution lors de sa deuxième réunion générale élargie en juillet 1952. C'est un parti politique principalement composé de personnes du secteur économique, caractérisé par sa nature d'alliance politique. C'est un parti participant au système socialiste chinois, acceptant la direction du Parti communiste chinois et coopérant étroitement avec lui. Les premiers membres de l'ACCDN étaient pour la plupart des figures de premier plan dans les domaines culturels et éducatifs et des industriels et hommes d'affaires nationaux. Actuellement, ses membres viennent principalement des grandes et moyennes villes, y compris des entrepreneurs et des figures économiques de moyen à haut niveau. Rong Yiren est le seul vice-président de la République populaire de Chine issu du parti, et le deuxième membre d'un parti démocratique à occuper ce poste après Soong Ching-ling."

