l_french:
  JIANG_ZEMIN_LEADER_DESC: "Le camarade Jiang Zemin, homme, nationalité han, homme politique chinois, ingénieur, secrétaire général du Comité central du Parti communiste chinois, haut dirigeant du Parti et du gouvernement, dirigeant suprême de la République populaire de Chine. Originaire du village de Jiang, district de Jingde, ville de Xuancheng, province d’Anhui (certains disent Jiangwan, ville de Wuyuan, province du Jiangxi). Né à Yangzhou, province du Jiangsu, le 17 août 1926. A rejoint le Parti communiste chinois en avril 1946. Diplômé de l’université Jiaotong. Le camarade Jiang Zemin vient de l’industrie de la fabrication de machines électriques et a également une expérience de travail et de direction dans l’industrie automobile. Dans ses jeunes années, Jiang Zemin a été ministre de l’Industrie électronique, secrétaire adjoint du Comité municipal du PCC de Shanghai, maire, puis secrétaire du Comité municipal. Le camarade Jiang Zemin est un dirigeant reconnu et exceptionnel jouissant d’un grand prestige au sein de tout le Parti, de toute l’armée et de l’ensemble des peuples de toutes les ethnies du pays. Il est un grand marxiste, un grand révolutionnaire prolétarien, homme politique, stratège militaire, diplomate, un combattant communiste éprouvé par les temps, le dirigeant exceptionnel de la grande cause du socialisme aux caractéristiques chinoises, le noyau de la troisième génération du collectif de direction centrale du Parti, et le principal fondateur de la pensée importante des « Trois Représente »."
  HU_JINTAO_LEADER_DESC: "« Jeune de la Ligue de la jeunesse communiste », « homme d’action », « technicien », tels sont les surnoms de Hu Jintao. Fils d’un commerçant du district de Tai, province du Jiangsu, il s’est toujours considéré comme originaire de Jixi, province d’Anhui, mais il possède les caractéristiques communes aux gens cultivés des villes d’eau du Jiangnan : élégant et discret, il aime lire. Après ses études universitaires, Hu Jintao a enseigné quelques années à son alma mater. Après le début de la Révolution culturelle, il est rapidement parti travailler au Bureau d’ingénierie de Liujiaxia du ministère de l’Eau et de l’Électricité au Gansu, où il a épousé Liu Yongqing, sa camarade de classe de longue date. Après être entré à l’unité de la Ligue de la jeunesse communiste, il a commencé à attirer l’attention du centre, et depuis lors il a connu une ascension rapide et des promotions successives. En accomplissant son travail au Guizhou et au Tibet, les capacités de Hu Jintao se sont rapidement distinguées, devenant son capital politique pour entrer au gouvernement central. On dit qu’il était le candidat désigné par le camarade Deng Xiaoping pour succéder à travers les générations. Après avoir pris le poste de dirigeant suprême fin 2002, ce jeune secrétaire général a déclaré un jour : « Je ne voulais pas être président. C’est le peuple tout entier qui m’a élu et m’a fait président. »\n\nMembre du Parti communiste issu d’une famille pauvre, Hu Jintao a longtemps côtoyé les princes rouges de la deuxième ou troisième génération. Cette expérience l’a convaincu, lui et Wen Jiabao, également issu d’une famille de commerçants, que si la Chine veut avancer régulièrement dans le nouveau siècle, elle ne peut pas compter sur de prétendus hommes forts politiques ou sur le concept du développement d’abord. Il faut remplacer la gouvernance par les hommes par l’État de droit et le concept du développement d’abord par celui du développement centré sur le peuple. Les princes rouges et les membres de la bande de Shanghai au sommet ne sont pas optimistes quant à ce jeune homme sans soutien politique, et ils se moquent également des concepts d’État de droit et de développement centré sur le peuple qu’il prône. La lutte du secrétaire général Hu Jintao durant ses dix années de mandat est loin d’être terminée."
  HU_JINTAO_LEADER2_DESC: "Wen Yiduo comparait autrefois les vers réguliers chinois anciens dans « La Métrique poétique » à « danser avec des chaînes ». Mais peut-on vraiment danser avec des chaînes ? Hu Jintao l’a prouvé par sa propre lutte.\n\nPour lui, la Chine est un immense navire, et il est le timonier à bord. Lui et son second Wen Jiabao tiennent fermement la barre de ce navire d’une taille inimaginable. Au moindre faux pas, il chavirera instantanément. La série de politiques de leur mandat a été appelée le « système Hu-Wen » et a été saluée par de nombreuses parties, mais ils savaient qu’ils ne faisaient que trembler et marcher sur la glace fine pour conduire le navire sur un immense fleuve gelé. Croissance onirique, chants et danses enivrants, quel iceberg se cache sous cette scène paisible ? … Mais maintenant, il a enfin son propre point d’appui et peut écrire ses propres mots dans la réalité – un tableau brillant du peuple chinois se précipitant vers un avenir meilleur."
  XI_JINPING_LEADER_DESC: "« Il est le fils de Xi Zhongxun » est ce que Xi Jinping a le plus entendu dans sa jeunesse. Pour lui, fils aîné du père fondateur de la République, l’identité de son père n’est pas seulement une riche fortune politique, mais aussi une étiquette inévitable. Enfant, Xi Jinping a été forcé de quitter Pékin pour un village du Shaanxi parce que son père était impliqué dans une lutte politique, et il a beaucoup souffert. Il a travaillé à la campagne depuis sa jeunesse et possède une profonde compréhension de la société chinoise. En même temps, il a montré un talent et un courage étonnants dans le travail local. Quand il a quitté le village de Liangjiahe pour étudier à l’université Tsinghua, les villageois ont spontanément raccompagné le secrétaire de la branche du Parti, et Xi Jinping a été profondément ému par cela, une graine a été plantée dans son cœur.\nAprès ses études universitaires, il a servi comme secrétaire au ministère de la Défense nationale au gouvernement central, mais a rapidement abandonné le traitement généreux à Pékin pour travailler volontairement à la campagne. Le style de vie simple et le travail efficace de Xi Jinping ont rapidement gagné la reconnaissance des masses et des collègues, il a donc été transféré à Xiamen, province du Fujian. Les quelques années où il a dirigé le Fujian ont été la période de développement la plus rapide du Fujian. Après l’an 2000, il a été muté au Zhejiang et à Shanghai, puis promu au Comité permanent du Bureau politique du Comité central du PCC avec Li Keqiang, entrant au cœur du pouvoir national.\n\nPour Xi Jinping, ses années d’expérience de travail à la base sont sa richesse la plus précieuse. Être avec le peuple le met à l’aise et en paix. En tant que rouge de deuxième génération issu d’une « famille noble », il a subi d’innombrables critiques, et a également vu le coin le plus sale et le plus mauvais de cette société chez ses « pairs princes rouges ». Xi Jinping prend « Je serai désintéressé et ne décevrai pas le peuple » comme devise de vie, espérant couper toutes les mauvaises herbes qui ne correspondent pas à ses idéaux et violent les souhaits du peuple chinois. Maintenant, il est enfin devenu le dirigeant suprême, et il peut librement exprimer son chef-d’œuvre sur la vaste toile de la Chine."
  YAN_CAN_DESC: "Maître Yan Chan, nom Mingchao, surnom Hutu Shanren. Maître Yan Chan a reçu le Dharma de la 46ᵉ génération de la secte Tiantai du bouddhisme, de la secte Linji et de la secte Caodong. Il possède de profondes réalisations en bouddhisme, un style zen élégant, maîtrise le zen, a une conduite noble et un charisme extraordinaire. Il a toujours adhéré à l’idée centrale de « respecter la vie, répandre la tolérance, vivre calmement et vivre heureux ». Il est humoristique et affable. Dans ses propos, il interprète la philosophie de la vie et l’attitude face à la vie de manière vivante, non seulement guidant les gens hors de la confusion, mais aussi faisant apprécier les voix colorées et merveilleuses. Au fil des années, ses revenus en calligraphie et peinture ont été utilisés pour subventionner les enfants déscolarisés et les étudiants pauvres ainsi que des œuvres caritatives et sociales, et il a fait des dons au programme de repas gratuits.\n\n« Mon disciple m’a demandé, Maître, comment traiter les gens également ? Je lui ai dit, regarde la porte derrière moi. Ce n’est pas un bureau gouvernemental, une famille riche, un arc de triomphe ou une porte pour les fils prodigues. Pendant des milliers d’années, c’est la porte du peuple ordinaire. Elle n’est pas sans nom. Elle a un nom, on l’appelle la porte de chaume. Si quelqu’un réussit et oublie cette porte, qu’il lève les yeux au ciel. Un œil immense le fixe. C’est aussi notre porte éternelle. »"
  Zheng_Jian_Bang_DESC: "Zheng Jianbang, homme, nationalité han, né en janvier 1957, originaire de Shimen, Hunan, membre du Comité révolutionnaire du Kuomintang chinois, a commencé à travailler en août 1976, diplômé du département d’éducation politique de l’Université normale du Nord-Est, spécialité économie, diplôme universitaire. A été vice-président du Comité permanent de la 14ᵉ Assemblée populaire nationale, président du Comité central du Comité révolutionnaire du Kuomintang chinois, et vice-président de l’Association chinoise pour la promotion de la réunification pacifique."
  Keizo_Obuchi_DESC: "Obuchi est né à Nakanojo, préfecture de Gunma, Japon. Diplômé de l’université Waseda en 1962 avec un diplôme en littérature anglaise. L’année suivante, il a remporté le siège de son père à la Chambre des représentants, devenant le plus jeune parlementaire jamais élu. Bien qu’il soit souvent décrit comme une figure modérée et sans éclat, sa carrière politique a été couronnée de succès. En 1973, Obuchi a été nommé directeur adjoint du Bureau du Premier ministre et en 1987 il est devenu secrétaire général du Cabinet. En montant dans les rangs du Parti libéral-démocrate au pouvoir, il est devenu de plus en plus connu pour sa capacité à négocier des compromis entre les factions du parti. En 1984, il est devenu secrétaire général adjoint du parti et en 1993 secrétaire général. En 1997, il est devenu ministre des Affaires étrangères. Après que le PLD a perdu les élections générales, Obuchi a succédé à Ryutaro Hashimoto comme président du parti le 24 juillet 1998. Le 30 juillet, Obuchi est devenu Premier ministre et a adopté une approche lumineuse face aux problèmes économiques du pays. Il a réussi à obtenir l’approbation parlementaire pour renflouer les banques avec des créances douteuses, réduire les impôts sur le revenu et augmenter les dépenses. Ces politiques ont fonctionné à court terme, et à la mi-1999 l’économie japonaise se renforçait à nouveau. Il est radioamateur avec l’indicatif (JI1KIT) et a été président du club de radioamateurs parlementaire.\n\nLe Premier ministre travailleur est depuis longtemps dans un état de santé fragile, qui semble s’être aggravé récemment."
  yoshiro_mori_DESC: "Mori Yoshiro est devenu Premier ministre par accident. De 1993 à 2000, le Japon a changé cinq Premiers ministres. À l’époque, le dicton populaire au Japon était : « Un chanteur est populaire un an, et le Premier ministre reste deux ans en fonction. » Mori Yoshiro est en politique depuis plus de 30 ans et a été élu 10 fois à la Chambre des représentants. On peut dire qu’il est un vétéran de la politique japonaise. Fin juillet 1998, après que Keizo Obuchi a été élu président du Parti libéral-démocrate et est devenu Premier ministre du Japon, Mori Yoshiro a été nommé par Obuchi secrétaire général, un poste juste en dessous du président au sein du PLD, et est devenu le « bras droit » de confiance d’Obuchi. Gagner les élections générales est la tâche première de l’administration du Premier ministre Mori. Pour gagner les élections générales, le nouveau cabinet qui suit les politiques du cabinet Obuchi ne peut que miser sur l’ancien Premier ministre Obuchi, tombé malade en fonction en travaillant dur pour le pays sans aucun résultat politique. La date du scrutin des élections générales a été choisie le 25 juin, anniversaire d’Obuchi, et les funérailles d’Obuchi auront lieu le 8 juin. Les analystes estiment que le Parti libéral-démocrate a exploité Obuchi à l’extrême. Le vote a été choisi le jour de l’anniversaire d’Obuchi pour attirer plus de « votes de sympathie » ; le 8 juin, les dirigeants de nombreux pays assisteront aux funérailles d’Obuchi, et Mori profitera de l’occasion pour lancer une « diplomatie funéraire ». Il n’y a qu’un seul objectif, gagner les élections générales.\n\nCombien de temps ce Premier ministre insouciant, direct et un peu « bête » peut-il rester en fonction ?"
  junichiro_koizumi_DESC: "En 1967, Junichiro Koizumi est diplômé du département d’économie de l’université Keio et part étudier à l’université de Londres en 1968. En décembre 1969, il hérite de la volonté de son père et échoue à se présenter à la Chambre des représentants dans la circonscription de Kanagawa. En 1972, il est élu à la Chambre des représentants et réélu. De 1988 à 1996, il a été ministre de la Santé, du Travail et du Bien-être et ministre des Postes. Le 24 avril 2001, Junichiro Koizumi est élu président du Parti libéral-démocrate avec une écrasante majorité avec le slogan de campagne « Changer le Parti libéral-démocrate, changer le Japon » : il a été le 87ᵉ Premier ministre. En septembre 2003, Junichiro Koizumi est réélu président du Parti libéral-démocrate ; le 19 novembre de la même année, il est élu Premier ministre. Le 11 septembre 2005, Junichiro Koizumi mène le Parti libéral-démocrate à une victoire écrasante aux élections à la Chambre des représentants japonaise, et sa carrière politique atteint son apogée.\nJunichiro Koizumi a été le premier Premier ministre élu dans le nouveau siècle, et l’un des représentants des politiciens japonais qui prônaient la rupture avec la situation de « domination bureaucratique ». En tant que Premier ministre japonais « longévif », Junichiro Koizumi était connu comme un « original » politique. Ses politiques intérieures et étrangères ont provoqué beaucoup de remous au Japon et à l’étranger, et les avis sont partagés. Pendant son mandat, il a réussi à promouvoir la réforme de privatisation des postes et a activement développé un partenariat stratégique avec le gouvernement américain, ce qui a amélioré et renforcé les relations Japon-États-Unis. Cependant, son insistance à visiter le sanctuaire Yasukuni a également conduit à la détérioration des relations du Japon avec la Chine et la Corée du Sud.\n\nQuelles réalisations ce Premier ministre vigoureux et décidé au style très personnel peut-il accomplir pendant son mandat ?"
  Shinzo_Abe1_DESC: "Le 21 septembre 1954, Shinzo Abe est né dans la préfecture de Yamaguchi, Japon. De la maternelle à l’université, Shinzo Abe a étudié à l’Académie Seikei, une école aristocratique de 16 ans qui valorise l’individualité et l’expérience. Pendant ses études, Shinzo Abe n’a pas étudié dur et ses notes étaient moyennes. Mais il était curieux et avait un large éventail d’intérêts, et passait la plupart de son temps et de son énergie à explorer le monde au-delà des manuels. Après ses études universitaires, en novembre 1982, Shinzo Abe a servi comme secrétaire de son père Shintaro Abe, alors ministre des Affaires étrangères du Japon, et a commencé à entrer en politique, fortement soutenu par les anciens Premiers ministres Takeo Fukuda et Noboru Takeshita. En septembre 2004, alors que le Parti libéral-démocrate du Japon perdait d’une voix face au Parti démocrate aux élections au Sénat, Shinzo Abe a démissionné de son poste de secrétaire général, mais comme la coalition au pouvoir incluant le Komeito contrôlait encore le Sénat, il a seulement été rétrogradé par Koizumi au poste de secrétaire général par intérim du Parti libéral-démocrate et ministre du Quartier général de promotion de la réforme du parti. Le 31 octobre 2005, il est devenu secrétaire général du Cabinet du troisième cabinet Koizumi. Le 20 septembre 2006, Shinzo Abe a été élu 21ᵉ président du Parti libéral-démocrate ; le 26 septembre, Shinzo Abe a été élu 90ᵉ Premier ministre du Cabinet japonais (Premier ministre du Japon), devenant le premier Premier ministre né après-guerre et le plus jeune Premier ministre d’après-guerre.\n\nShinzo Abe présente l’ombre de Junichiro Koizumi à de nombreux égards. Il est têtu et dur dans ses discours. Jusqu’en 2006, il n’a jamais tergiversé sur sa position faucon. Il était un fervent partisan des visites de Junichiro Koizumi au sanctuaire Yasukuni. Il a défendu Junichiro Koizumi à plusieurs reprises et a visité le sanctuaire de nombreuses fois en tant que politicien. En matière de philosophie de gouvernance, Abe est également proche de Koizumi, prônant le renforcement de l’alliance Japon-États-Unis, l’amendement de la constitution pacifique du Japon, l’ajout d’une clause selon laquelle le Japon a le droit de légitime défense collective, et poussant le Japon vers le prétendu « pays normal ». Combien de temps ce jeune Premier ministre peut-il rester à ce poste ?"
  yasuo_fukuda_DESC: "Yasuo Fukuda est né le 16 juillet 1936 à Takasaki, préfecture de Gunma, et diplômé de l’université Waseda au Japon. Après avoir obtenu son diplôme du département d’économie politique de l’université Waseda en mars 1959, il a rejoint une compagnie pétrolière. Il prônait que la réforme politique devait commencer par chaque politicien lui-même, et était connu pour ses politiques prudentes. Pendant son mandat, les relations sino-japonaises ont montré un bon élan de développement, et les relations stratégiques et mutuellement bénéfiques entre la Chine et le Japon ont continué à s’approfondir. Le Premier ministre Fukuda y a apporté une contribution importante. Fukuda et Aso ont également convenu d’éviter de faire du problème du sanctuaire Yasukuni une question politique et diplomatique. Fukuda a déclaré : « Il est très regrettable que le problème du sanctuaire Yasukuni soit devenu une question extrêmement politisée. Je ne créerai pas de difficultés. » Fukuda avait auparavant clairement indiqué que s’il était élu Premier ministre, il ne visiterait pas le sanctuaire Yasukuni. En matière de politique étrangère, Fukuda a promis qu’après son élection, il renforcerait les relations Japon-Chine, et Aso a déclaré qu’il approfondirait davantage les relations avec les pays asiatiques. Aso a également réitéré qu’il était le premier ministre des Affaires étrangères japonais à accueillir publiquement la « montée de la Chine ». Le 15 août 1995, l’ancien Premier ministre japonais Tomiichi Murayama a prononcé un discours, admettant que les politiques nationales passées du Japon étaient erronées et qu’il avait pris la voie de la guerre. La domination coloniale et l’agression avaient causé de grands dommages et souffrances aux peuples de nombreux pays, en particulier les pays asiatiques, et exprimé une profonde réflexion et des excuses sincères.\n\nYasuo Fukuda prônait le maintien de l’élan de la réforme fiscale et de la croissance économique. Envisager de réformer le système fiscal pour promouvoir le développement régional et augmenter les revenus et les opportunités d’emploi des citoyens engagés dans l’agriculture et la pêche. En même temps, il appelait à l’établissement d’une société qui offre « espoir et réconfort » aux jeunes et aux personnes âgées. Réviser une loi qui exige que les personnes handicapées paient 10 % du coût de leurs soins médicaux et services et envisager d’y apporter des changements majeurs. Envisager de ne plus augmenter la charge médicale des personnes âgées. Et augmenter la transparence des fonds politiques et promouvoir la réforme de la fonction publique.\n\nDans quelle mesure ce Premier ministre qui s’engage à bénéficier au peuple japonais peut-il réaliser ses idéaux ?"
  taro_aso_DESC: "Né dans une famille politique. Diplômé de la faculté de sciences politiques et économiques de l’université Gakushuin au Japon, puis étudiant à l’école doctorale de l’université Stanford aux États-Unis et à la London School of Economics and Political Science au Royaume-Uni. Après son retour au Japon, il s’est consacré à l’entreprise familiale « Aso Industry » (aujourd’hui l’usine de ciment Aso). Aso Taro, choyé dans un environnement familial supérieur de fonctionnaires et d’hommes d’affaires, a formé depuis l’enfance une personnalité fière et volontaire, flamboyante et désinvolte, et a également développé une habitude de manque de réflexion et de paroles irréfléchies. Comme il l’a dit lui-même en plaisantant, « Je suis bien né, mais je n’ai pas été bien éduqué. »\nDans la tendance générale de conservatisme de la société japonaise et la montée des pensées nationalistes, Aso et Koizumi chantaient la même chanson, méprisant ouvertement les sentiments nationaux de la Chine et de la Corée du Sud sur des questions telles que la compréhension de l’histoire, le statut de Taïwan et la « théorie de la menace chinoise », défiant les fondements politiques des relations sino-japonaises. Le 22 décembre 2005, quand un journaliste lui a demandé comment il comprenait la théorie de la menace chinoise du leader du Parti démocrate Seiji Maehara, Aso a immédiatement approuvé le point de vue de Maehara, estimant que « la Chine devient une menace considérable ». C’est la première fois qu’un membre du cabinet japonais promeut publiquement la théorie de la menace chinoise dans un cadre formel.\nLe cabinet formé par Taro Aso a été appelé par les médias et les partis d’opposition le « cabinet héréditaire », « cabinet des jeunes maîtres » et « cabinet des fils à papa ». Onze des 18 membres du cabinet étaient des membres héréditaires du cabinet. Quatre jours plus tard, le ministre du Territoire, des Infrastructures, des Transports et du Tourisme Nakayama Shigeaki a démissionné. Après que Kaneko Kazuyoshi lui a succédé, le nombre de membres héréditaires du cabinet a atteint un record de 12, dépassant les 9 membres du cabinet réformé de Yasuo Fukuda, c’est-à-dire que les deux tiers de tous les membres du cabinet étaient héréditaires.\n\nQuelles actions ce Premier ministre « prince » peut-il accomplir pendant son mandat ?"
  yukio_hatoyama_DESC: "Yukio Hatoyama, également connu sous le nom de Yukio Hatoyama, est né le 11 février 1947. Il est président de l’Institut de la Communauté est-asiatique, professeur honoraire de l’université Jiaotong de Xi’an, Chine, et professeur honoraire de l’université d’agriculture et de foresterie du Nord-Ouest, Chine.\n\nEn 1996, Yukio Hatoyama, Naoto Kan et Ichiro Ozawa ont formé le Parti démocrate et il a été dirigeant du parti. Le 30 août 2009, Yukio Hatoyama a mené le Parti démocrate à une victoire historique aux élections à la Chambre des représentants, mettant fin à la longue domination du Parti libéral-démocrate. Le 16 septembre 2009, il a été élu 93ᵉ et 60ᵉ Premier ministre du Japon. Hatoyama a une personnalité stable et n’est pas agressif, il est donc surnommé « Colombe ». Il accorde de l’importance à la « patience ». Le slogan de Yukio Hatoyama est « La politique, c’est l’amour », et sa croyance politique est la pensée de « l’amitié » proposée par son grand-père. Cependant, en raison de ses déclarations naïves, il a été surnommé « Extraterrestre » et ridiculisé comme « comme un cône de glace molle ». Yukio Hatoyama est célèbre pour ses vues politiques sur la sécurité et les affaires étrangères. Il met l’accent sur le droit à l’autodéfense militaire du Japon et critique la politique étrangère actuelle du Japon pour être trop dépendante des États-Unis et d’autres alliés occidentaux. En matière de construction du Parti démocrate, Yukio Hatoyama a déclaré qu’il s’engagerait à construire un système d’unité du parti et à réaliser un changement de régime. Il prône le renforcement des relations avec les pays asiatiques. Dans son article publié dans le New York Times, il a souligné que le Japon ne peut pas oublier son identité : nous sommes un pays situé en Asie. Je crois que l’Asie de l’Est de plus en plus dynamique doit être reconnue comme le champ de survie fondamental du Japon. Par conséquent, nous devons continuer à établir un cadre de coopération économique stable et de sécurité couvrant toute la région. En matière de sécurité politique, la Chine est considérée comme l’adversaire principal et la cible de prévention, tout en faisant pleinement usage des « opportunités d’affaires chinoises » dans les stratégies de croissance et de développement économique.\n\nCe Premier ministre qui se lie activement d’amitié avec la Chine et est plein de compassion pour le monde réalise-t-il que la politique est cruelle et la réalité froide ?"
  naoto_kan_DESC: "Naoto Kan est né le 10 octobre 1946 à Ube, préfecture de Yamaguchi. C’est un politicien ouvrier et activiste citoyen. Pendant ses années universitaires, Naoto Kan était le leader des Gardes rouges de son école. En 1980, il est devenu membre de la Chambre des représentants. En 1996, il a été ministre de la Santé et du Bien-être dans le cabinet de Ryutaro Hashimoto. Il s’est fait connaître pour son traitement de l’affaire des médicaments contre le SIDA. Plus tard, il a fondé le Parti démocrate du Japon avec Yukio Hatoyama et Ichiro Ozawa, devenant l’un des « trois chevaux » du Parti démocrate. Le 16 septembre 2009, il est devenu vice-Premier ministre et ministre du « Bureau de stratégie nationale » dans le cabinet Hatoyama. Le 6 janvier 2010, il est devenu ministre des Finances.\nNaoto Kan a déclaré un jour pendant la campagne que l’alliance Japon-États-Unis est la « pierre angulaire » de la politique étrangère du Japon. Il a dit qu’il travaillerait dur pour réduire la charge des habitants d’Okinawa sur la base de la déclaration conjointe du Japon et des États-Unis sur le déplacement de la base militaire américaine de Futenma à Okinawa. Il a souligné l’importance de la Chine pour le Japon, déclarant que les relations sino-japonaises sont « aussi importantes » que les relations États-Unis-Japon. En 1999, quand Naoto Kan a visité la Chine, il s’est rendu spécialement au Mémorial de la guerre de résistance contre le Japon du pont Marco Polo pour déposer une couronne, déclarant que « les événements passés doivent être rappelés comme une leçon pour l’avenir ». Sur la question de Taïwan, il espère que la Chine réalisera une réunification pacifique dès que possible et prône que Taïwan fait partie du territoire chinois. En 2010, Naoto Kan a déclaré dans le traitement des relations sino-japonaises : « L’alliance Japon-États-Unis est la base de la diplomatie japonaise. D’un autre côté, nous devons nous engager pour la prospérité de la région asiatique. » Nous accorderons de l’importance au développement des relations Japon-Chine. Le 10 mai 2011, Naoto Kan a souligné lors d’une réunion que le développement énergétique du Japon dépend de l’énergie nucléaire et thermique. À l’avenir, il est nécessaire de se concentrer sur la recherche de nouvelles sources d’énergie telles que l’énergie solaire et éolienne, et de faire de l’énergie naturelle la base de l’énergie japonaise. C’est la première fois depuis l’accident de la centrale nucléaire de Fukushima Daiichi que Naoto Kan déclare qu’il arrêtera le développement de l’énergie nucléaire et abandonnera le plan de développement énergétique du gouvernement basé sur le nucléaire.\nAuparavant, la plupart des Premiers ministres japonais étaient soit riches soit nobles, et la politique héréditaire et les luttes de factions étaient presque devenues une tradition au Japon. L’ancien Premier ministre japonais Naoto Kan, qui a pris ses fonctions le 8 juin 2010, semble réécrire l’histoire de la politique japonaise. Selon l’exigence légale de publication des biens dans les 100 jours suivant la prise de fonction, dans le tableau de situation des biens personnels des 18 membres du cabinet japonais Naoto Kan, le rapport du Premier ministre Naoto Kan est assez simple. Il ne détient pas d’actions, ni de carte de membre de club de golf. Il n’a qu’un dépôt fixe de 3,95 millions de yens et un appartement de deux chambres. L’évaluation officielle de l’appartement est de 5,18 millions de yens.\n\nDans quelle mesure ce Premier ministre, né roturier, peut-il réaliser son idéal ?"
  yoshihiko_noda_DESC: "Yoshihiko Noda est né le 20 mai 1957 à Funabashi, préfecture de Chiba, Japon. Il est diplômé du département de sciences politiques de l’université Waseda en 1980, puis a étudié à l’École de politique et d’économie Matsushita, le « berceau des politiciens japonais ». Il a été élu à l’âge de 29 ans et a battu le record d’âge des parlementaires japonais élus. Noda est une figure puissante du Parti démocrate du Japon et le président de la faction Hanasekai (groupe Noda). Il est une figure centrale du « groupe Noda » composé de jeunes membres du Parti démocrate. Il est une personne active. Il a travaillé comme pompier et tuteur. Il est maître de judo de deuxième degré et admire le politicien japonais Hamaguchi Takeyuki. En politique, d’une part il s’oppose à la vantardise de Junichiro Koizumi, d’autre part il adopte une attitude conservatrice et dure sur des questions telles que les îles Diaoyu.\nDu long style politique de Noda, Noda est plus familier avec la défense et les finances. En matière de défense et de diplomatie, Noda a hérité du style dur de l’« Académie politique et économique Panasonic », prône la fermeté envers la Chine, prône les visites au sanctuaire Yasukuni, et est un représentant bien connu des faucons du Parti démocrate. Il est connu comme le « Koizumi du Parti démocrate ». Il a une attitude dure envers la Chine sur les questions territoriales et estime que « les criminels de guerre de classe A ne sont pas des criminels de guerre ». Il prône également l’utilisation militaire de l’espace par le Japon et prône activement que le Japon devrait promulguer la « Loi fondamentale de sécurité » et la « Loi sur l’état d’urgence ». Noda est un « dur » en affaires étrangères et militaires. Quand il était invité dans une émission de télévision, Noda a déclaré que son idéal de gouvernance, en bref, est d’espérer que le peuple puisse sentir qu’être japonais est une chose heureuse, et s’efforcer de changer les vues négatives du peuple sur la politique. Noda a autrefois réfuté le conseiller d’État chinois Tang Jiaxuan, disant : « Votre pays occupe réellement les îles Nansha, de quel droit nous critiquez-vous ? » Il a également proposé au parlement japonais de confirmer les îles Diaoyu comme « territoire inhérent du Japon » en réponse à l’incident des protecteurs des îles Diaoyu chinois débarquant sur les îles Diaoyu.\n\nQuel genre de carrière ce Premier ministre au style « patron » dur peut-il accomplir ?"
  Shinzo_Abe_DESC: "Shinzo Abe est né dans la préfecture de Yamaguchi, Japon le 21 septembre 1954. De la maternelle à l’université, Shinzo Abe a étudié à l’Académie Seikei, une école aristocratique de 16 ans qui valorise l’individualité et l’expérience. Pendant ses études, Shinzo Abe n’a pas étudié dur et ses notes étaient moyennes. Mais il est très curieux et a un large éventail d’intérêts. Il passe la plupart de son temps et de son énergie à explorer le monde au-delà des manuels. Après ses études universitaires, en novembre 1982, Abe Shinzo a servi comme secrétaire de son père Shintaro Abe, alors ministre des Affaires étrangères du Japon. Il a commencé à entrer en politique et a été fortement soutenu par les anciens Premiers ministres Takeo Fukuda et Noboru Takeshita. En septembre 2004, parce que le Parti libéral-démocrate du Japon a perdu d’une voix face au Parti démocrate aux élections au Sénat, Abe Shinzo a démissionné de son poste de secrétaire général, mais parce que la coalition au pouvoir incluant le Komeito contrôlait encore le Sénat, il a seulement été rétrogradé par Koizumi au poste de secrétaire général par intérim du Parti libéral-démocrate et ministre du Quartier général de promotion de la réforme du parti. Le 31 octobre 2005, il a pris ses fonctions de secrétaire général du Cabinet du troisième cabinet Koizumi. Le 20 septembre 2006, Abe Shinzo a été élu 21ᵉ président du Parti libéral-démocrate ; le 26 septembre, Abe Shinzo a été élu 90ᵉ Premier ministre du Cabinet japonais (Premier ministre du Japon), devenant le premier Premier ministre né après-guerre et le plus jeune Premier ministre d’après-guerre. Le 16 décembre 2012, le Parti libéral-démocrate a remporté une victoire écrasante aux élections à la Chambre des représentants et a repris le pouvoir. Shinzo Abe a confirmé qu’il servirait à nouveau comme Premier ministre du Japon ; le 26 décembre, Shinzo Abe a pris ses fonctions de 96ᵉ Premier ministre du Japon.\n\nShinzo Abe présente l’ombre de Junichiro Koizumi à de nombreux égards. Il est têtu et dur dans ses discours. Jusqu’en 2006, il n’a jamais hésité sur sa position faucon. Il était un fervent partisan des visites de Junichiro Koizumi au sanctuaire Yasukuni. Il a défendu Junichiro Koizumi à plusieurs reprises et a visité le sanctuaire de nombreuses fois en tant que politicien. En matière de philosophie de gouvernance, Abe est également proche de Koizumi. Il prône le renforcement de l’alliance Japon-États-Unis, l’amendement de la constitution pacifique du Japon, l’ajout d’une clause selon laquelle le Japon a le droit de légitime défense collective, et poussant le Japon vers le prétendu « pays normal ».\n\nCe Premier ministre de second mandat peut-il enfin mettre fin au chaos politique dans lequel le Japon est tombé depuis la mort de Keizo Obuchi en 2000 ? Dans quelle direction le Japon ira-t-il sous sa direction ?"
  yoshihide_suga_DESC: "Yoshihide Suga, né le 6 décembre 1948 dans la préfecture d’Akita, Japon, est un homme politique japonais et membre du Parti libéral-démocrate. Le 14 septembre 2020, Yoshihide Suga a remporté 377 voix (sur 534 voix valides) et a été élu président du Parti libéral-démocrate au pouvoir avec une écrasante majorité [19-20] ; le 16 septembre, la Chambre des représentants de la Diète japonaise a convoqué un parlement extraordinaire pour tenir une élection de nomination du Premier ministre. Yoshihide Suga, président du Parti libéral-démocrate au pouvoir, a été élu 99ᵉ Premier ministre du Japon et a formé un nouveau cabinet le même jour.\nEn mai 2021, Yoshihide Suga a promu la Diète japonaise à adopter six lois liées à la réforme numérique, dont la « Loi sur l’établissement de l’Agence numérique », la « Loi fondamentale sur la formation d’une société numérique », et la « Loi sur les normes de numérisation des groupes publics locaux », pour fournir un soutien juridique à la construction d’une société numérique et au développement d’une économie numérique. Le contexte de l’élaboration de cette série de lois est que le Japon est en retard par rapport aux grands pays comme la Chine et les États-Unis dans le domaine de l’économie numérique, et la pandémie de COVID-19 a mis en évidence le problème du faible niveau de numérisation administrative du Japon. Les lois susmentionnées sur la réforme numérique ont été officiellement promulguées et mises en œuvre le 1ᵉʳ septembre 2021 après examen et approbation par l’Assemblée nationale. Selon la « Loi sur l’établissement du département numérique », le Japon a créé le « Département numérique » directement sous la juridiction du Cabinet pour coordonner la construction numérique des ministères centraux et des gouvernements locaux, et coordonner la numérisation des groupes civils et des entreprises. En matière de diplomatie, Yoshihide Suga a proposé de promouvoir l’établissement de relations stables avec les voisins asiatiques tels que la Chine et la Russie sur la base de l’alliance Japon-États-Unis.\n\nQuelle contribution ce Premier ministre qui a pris ses fonctions dans le crépuscule de sa vie peut-il apporter ?"
  fumio_kishida_DESC: "Fumio Kishida est né le 29 juillet 1957 à Tokyo, Japon. Son lieu d’origine ancestral est la ville de Hiroshima, préfecture de Hiroshima. Il est diplômé de la faculté de droit de l’université Waseda en mars 1982. En 2012, Fumio Kishida a repris la présidence du Hiroikekai de Makoto Koga et est devenu le leader de la « faction Kishida ». Le 29 septembre 2021, il a été élu 27ᵉ président du Parti libéral-démocrate du Japon. Le 4 octobre de la même année, il a pris ses fonctions de 100ᵉ Premier ministre du Japon. Le 10 novembre, il a été élu 101ᵉ Premier ministre du Japon lors de l’élection de nomination du Premier ministre du Sénat et de la Chambre des représentants. Depuis que Fumio Kishida est devenu Premier ministre, il a adhéré à la ligne d’amendement constitutionnel et de renforcement militaire, et prévoit d’amender la loi sur les Forces d’autodéfense. En matière économique, il a proposé un « nouveau capitalisme japonais », espérant réaliser la croissance économique nationale et une répartition équitable des revenus en même temps, et promouvoir le « Concept national de ville-jardin numérique » et promouvoir vigoureusement les nouvelles énergies. En diplomatie, il a hérité du cadre politique des anciens Premiers ministres Shinzo Abe et Yoshihide Suga, prônant de travailler avec les pays partageant des valeurs universelles menés par les États-Unis, continuer à promouvoir la stratégie « Indo-Pacifique libre et ouvert », et condamner et sanctionner la Russie dans le conflit Russie-Ukraine. En matière de politique économique, Fumio Kishida a proposé un « nouveau capitalisme japonais ». Face à l’écart croissant entre riches et pauvres dans la société japonaise, Fumio Kishida s’engage à créer un « cercle vertueux de croissance et de répartition » pour réaliser la croissance et la répartition en même temps, et prévoit de faire tout son possible pour améliorer les salaires et les avantages grâce à des politiques telles que la réduction de la charge fiscale des entreprises. Fumio Kishida a également promu le « Concept national de ville-jardin numérique » dans le cadre de la stratégie de croissance, établi un fonds d’innovation verte de 2 billions de yens, et réalisé zéro émission des centrales thermiques grâce à la popularisation des véhicules électriques à pile à combustible à hydrogène et autres moyens. Le 8 janvier 2022, Fumio Kishida a publié un article signé intitulé « Mon grand dessein du nouveau capitalisme », dans lequel il a pleinement exposé pour la première fois son concept économique, déclarant que le capitalisme devrait être mis à niveau vers un nouveau capitalisme qui valorise les « gens », espérant qu’à travers le nouveau capitalisme, la tendance au déclin du niveau de croissance des salaires puisse être « inversée d’un seul coup », et que la croissance des salaires puisse convenir à la nouvelle ère du capitalisme.\n\nCe Premier ministre calme peut-il construire son « nouveau capitalisme japonais » idéal ?"
  shigeru_ishiba_DESC: "Shigeru Ishiba, homme, né le 4 février 1957 à Yazu-cho, district de Yazu, préfecture de Tottori, Japon (aujourd’hui Yazu-cho). Diplômé de la faculté de droit de l’université Keio et membre du Parti libéral-démocrate. En 1979, après ses études universitaires, Shigeru Ishiba a rejoint la banque Mitsui (aujourd’hui Sumitomo Mitsui Banking Corporation). En 1981, il est entré en politique à la persuasion de l’ami de son père Kakuei Tanaka. En 1986, il a utilisé les ressources et l’influence héritées de sa famille pour être élu pour la première fois membre de la Chambre des représentants de la préfecture de Tottori en tant que membre du Parti libéral-démocrate, et a été élu 12 fois. En 1993, après la naissance du régime non-PLD dirigé par Morihiro Hosokawa, Shigeru Ishiba a quitté le PLD et rejoint le Nouveau Parti dans la coalition au pouvoir des sept partis, rejoignant Ichiro Ozawa, qui s’opposait au PLD. En 1997, en raison de divergences politiques avec Ozawa, il est revenu au PLD. En 2002, il a commencé à servir dans le cabinet, servant successivement comme ministre de la Défense et ministre de l’Agriculture et de la Pêche. En 2014, il a été secrétaire général du Parti libéral-démocrate. En 2015, il a été promu par Shinzo Abe au poste de ministre des Affaires spéciales du Cabinet, responsable de la gestion des « affaires de revitalisation locale » et de la « stratégie des zones spéciales nationales ». Shigeru Ishiba s’est présenté quatre fois à la présidence du Parti libéral-démocrate, mais n’a pas été élu. En août 2024, il a participé pour la cinquième fois à l’élection à la présidence du Parti libéral-démocrate et a été élu 28ᵉ président du Parti libéral-démocrate ; le 1ᵉʳ octobre, il a été élu 102ᵉ Premier ministre du Japon.\n\nShigeru Ishiba possède une riche expérience politique et a été impliqué dans l’administration de nombreux domaines au niveau local et central. Il est connu comme un « expert en politique » et un politicien conservateur. Il est réaliste en relations internationales. Quand il était ministre de la Défense, il était considéré comme un faucon. Il a toujours prôné l’amélioration du statut des Forces d’autodéfense japonaises et le renforcement de l’alliance Japon-États-Unis. Bien que ses politiques soient dures, il recherche la stabilité, le pragmatisme et l’équilibre. En ce qui concerne sa position envers la Chine, il reconnaît que le Japon doit faire face et réfléchir à ses problèmes historiques et prône que la Chine et le Japon peuvent mener une certaine coopération économique.\n\nCe Premier ministre apparemment amical peut-il protéger une terre pure dans le jeu féroce entre grandes puissances ?"
