l_french:
 ZZZ_chainrun:0 "Exécuteur de chaînes d'événements"
 ZZZ_cr_kr_01_talks_open:0 "Chaîne coréenne 1/3 : confédération formée (zzz_kor.1 → .2)"
 ZZZ_cr_kr_01_talks_open_desc:0 "Étape 1/3. Applique directement sur KOR les effets de zzz_kor.1.a puis .2.a : les négociations aboutissent, KOR crée la faction Juche et NKO la rejoint. Les deux gouvernements existent encore ; aucune annexion, aucun événement."
 ZZZ_cr_kr_01_talks_open_tt:0 "Point d'arrivée : deux États sous un même cadre d'alliance. Comme .2 crée d'abord la faction Juche, l'adhésion à l'OTAS à l'étape 3 échouera tant que KOR reste dans Juche : c'est le résultat réel de la chaîne, laissé tel quel."
 ZZZ_cr_kr_02_unify:0 "Chaîne coréenne 2/5 : vers l'unification (zzz_kor.2)"
 ZZZ_cr_kr_02_unify_desc:0 "Disponible seulement si zzz_kor.1 a choisi a (KOR_reunification_talks_failed absent) ; déclenche le véritable événement zzz_kor.2."
 ZZZ_cr_kr_02_unify_tt:0 "Si KOR_reunification_talks_failed est posé, la chaîne est considérée comme rompue et cette étape refuse de s'exécuter."
 ZZZ_cr_kr_03_breakdown:0 "Chaîne coréenne 3/5 : rupture (zzz_kor.3)"
 ZZZ_cr_kr_03_breakdown_desc:0 "Disponible seulement si zzz_kor.1 a choisi b (KOR_reunification_talks_failed posé) ; déclenche le véritable événement zzz_kor.3."
 ZZZ_cr_kr_03_breakdown_tt:0 "Sans ce drapeau, l'étape 1 n'a pas encore choisi b et cette étape refuse de s'exécuter."
 ZZZ_cr_kr_04_kpr:0 "Chaîne coréenne 4/5 : proclamation de la KPR (zzz_kor.6)"
 ZZZ_cr_kr_04_kpr_desc:0 "Vérifie que NKO possède 604 et a le tag cosmétique KPR ou korean_postwar_settled, puis déclenche zzz_kor.6. L'annexion doit venir de la véritable décision d'après-guerre ; cet outil n'annexe jamais."
 ZZZ_cr_kr_04_kpr_tt:0 "Le point de blocage indique s'il manque owns_state 604 ou la véritable décision d'après-guerre."
 ZZZ_cr_kr_05_election:0 "Chaîne coréenne 5/5 : élection pan-péninsulaire (zzz_kor.8 / zzz_kor.10)"
 ZZZ_cr_kr_05_election_desc:0 "Déclenche zzz_kor.8 sur la route NKO, zzz_kor.10 sur la route KOR. La route est choisie d'après les drapeaux réels."
 ZZZ_cr_kr_05_election_tt:0 "Les drapeaux election_done des deux routes sont vérifiés ; si déjà exécuté, l'étape s'arrête."
 ZZZ_cr_ru_01_putin_smo:0 "Chaîne russo-ukrainienne : voie Poutine (opération spéciale)"
 ZZZ_cr_ru_01_putin_smo_desc:0 "Exécute sur SOV l'effet du focus SOV_declare_smo (appel de DSW_SOV_declare_war_on_ukraine) ; aucun événement n'est déclenché."
 ZZZ_cr_ru_02_medvedev_wall:0 "Chaîne russo-ukrainienne : voie Medvedev (adresse à la nation)"
 ZZZ_cr_ru_02_medvedev_wall_desc:0 "Exécute sur SOV l'effet du focus SOV_address_the_nation : menace, appel de DSW_SOV_declare_war_on_ukraine, idée UKR_to_the_last sur UKR."
 ZZZ_cr_ru_03_communist_saturn:0 "Chaîne russo-ukrainienne : voie communiste (Petit Saturne)"
 ZZZ_cr_ru_03_communist_saturn_desc:0 "Exécute sur SOV l'effet du focus SOV_operation_little_saturn : menace, appel de DSW_SOV_declare_war_on_ukraine, idée UKR_to_the_last sur UKR."
 ZZZ_cr_eur_01_escalate:0 "Guerre d'Europe : escalade continentale totale (déclenchement + participants)"
 ZZZ_cr_eur_01_escalate_desc:0 "Exécute ZZZ_eur_begin_war puis ZZZ_eur_mark_participants d'un seul coup. SOV uniquement : les deux effets lisent ROOT, le pays qui prend cette décision doit donc être SOV. Aucun événement déclenché."
 ZZZ_cr_gaw_01_korea_ignites:0 "GAW : la péninsule déclenche la Grande Guerre d'Asie"
 ZZZ_cr_gaw_01_korea_ignites_desc:0 "KOR déclare la guerre à NKO et pose le drapeau de guerre, puis CHI exécute ZZZ_start_gaw_from_korea. CHI uniquement : l'initialisation de la GAW lit ROOT. Aucun événement déclenché."
 ZZZ_cr_usa_01_paralysis:0 "Chaîne de mort cérébrale des États-Unis : assassinat → raz-de-marée démocrate → paralysie fédérale"
 ZZZ_cr_usa_01_paralysis_desc:0 "Applique directement sur USA les effets de usacw.5.a, .6.a et .7.a jusqu'au nœud de paralysie. Ne déclenche pas taiwan_detente.5 ; la route 2021 .15-.21 n'est pas suivie."
 ZZZ_cr_balk_01_withdraw_federation:0 "Balkans : retrait général + fédération soutenue par la Chine"
 ZZZ_cr_balk_01_withdraw_federation_desc:0 "Les huit pays exécutent l'effet de retrait de zzz_balkan.20.a (OTAN et UE), puis la branche de réussite de PRC_balkan_federation_support: idée de partenariat, échange d'influence sur sept pays, +100 points politiques pour la Serbie, drapeaux de consentement. zzz_balkan.30 n'est pas déclenché."
 ZZZ_cr_tw_01_forced_reunification:0 "Détroit de Taïwan : voie de réunification forcée (paquet de focuses)"
 ZZZ_cr_tw_01_forced_reunification_desc:0 "Exécute prc.124.a tel quel sur CHI : drapeau de guerre forcée, chargement de l'arbre de focuses taïwanais et dix focuses (Kinmen, blocus, Aube silencieuse...). Le déclencheur Diaoyu/Senkaku prc.546 est une branche mutuellement exclusive, non suivie."
 ZZZ_cr_ip_01_kashmir_war:0 "Inde–Pakistan : guerre du Cachemire (déclaration indienne)"
 ZZZ_cr_ip_01_kashmir_war_desc:0 "Exécute les effets de PAK.3 sur RAJ et PAK : l'Inde déclare la guerre (annex_everything) et prend l'idée clash-of-millions ; le Pakistan prend ses idées, perd 143 750 hommes et passe à l'OOB de guerre. PAK.7 et prc.134 ne sont pas déclenchés."
 ZZZ_cr_sea_01_asean_turnover:0 "Asie du Sud-Est : alternance ASEAN (monarchie laotienne + libéralisation cambodgienne)"
 ZZZ_cr_sea_01_asean_turnover_desc:0 "Exécute les deux volets de asean.6.a : le Laos devient une monarchie avec un nouveau souverain et un pouvoir nationaliste ; le Cambodge passe social-libéral avec des élections à 60 jours. Ce mod n'a pas de chaîne de guerre en Asie du Sud-Est ; asean.6 est le seul événement asean."
 ZZZ_cr_mew_01_palestine_victory:0 "Moyen-Orient MEW : règlement de la victoire arabe (la Palestine annexe Israël)"
 ZZZ_cr_mew_01_palestine_victory_desc:0 "Exécute la fin du règlement A : PAL annexe ISR et HAM, pose MEW_palestine_victory / MEW_settlement_done / skip_default_capitulation et efface MEW_sixth_war_ongoing. Ignore les transferts du Golan et du Sud-Liban, la paix blanche des belligérants et mew.10 / mew.11. Nécessite MEW_sixth_war_ongoing."
 ZZZ_cr_kr_02_confederation_deepened:0 "Chaîne coréenne 2/3 : confédération approfondie (institutions communes)"
 ZZZ_cr_kr_02_confederation_deepened_desc:0 "Étape 2/3. Place les deux Corées dans le groupe de partage technologique korea_confederation_Tech_Share, pose korean_confederation_formed / korean_confederation_deepened et porte la reunification_chance de KOR à 12, dans la tranche de chance de réussite la plus haute de zzz_kor.1 (>10). Aucun événement."
 ZZZ_cr_kr_03_peaceful_unification:0 "Chaîne coréenne 3/3 : unification pacifique (KOR absorbe NKO)"
 ZZZ_cr_kr_03_peaceful_unification_desc:0 "Étape 3/3. Applique directement zzz_kor.5.a et .10.a sur KOR : annexe NKO, réécrit le gouvernement et les 24 popularités partisanes, puis tient l'élection pan-péninsulaire. Si KOR est encore dans la faction Juche, l'adhésion à l'OTAS échoue (résultat réel de la chaîne) ; sans les étapes 1-2, elle rejoint l'OTAS."
 ZZZ_cr_kr_04_north_annex:0 "Étape 4/4 - Le Nord annexe le Sud (militaire)"
 ZZZ_cr_kr_04_north_annex_desc:0 "Étape 4/4. Applique directement zzz_kor.4.a et .6.a sur NKO : annexe KOR avec transfert des troupes, intègre les États 604-608 et 1099, réécrit le gouvernement et les 24 popularités partisanes, et applique ZZZ_spirit_korea_unified. Pose aussi zzz_korea_north_annexed et korean_postwar_settled, verrouillant la voie pacifique."
 ZZZ_cr_ru_04_russian_victory:0 "Chaîne russo-ukrainienne : règlement de victoire russe (DSW_SOV_resolve_russian_victory)"
 ZZZ_cr_ru_04_russian_victory_desc:0 "Exécute le règlement de victoire : drapeaux de victoire, arbre de focus d'après-guerre, branche française et règlement d'Europe de l'Est. Le garde interne de l'effet le rend sans effet hors guerre ; les événements lancés par le script original ne sont pas sautés."
 ZZZ_cr_ru_05_russian_defeat:0 "Chaîne russo-ukrainienne : règlement de défaite russe (DSW_SOV_resolve_russian_defeat)"
 ZZZ_cr_ru_05_russian_defeat_desc:0 "Exécute le règlement de défaite : drapeaux de défaite, changement d'arbre de focus et issue ukrainienne/européenne. Même garde interne ; sans effet hors guerre."
 ZZZ_cr_eur_02_nato_victory:0 "Guerre européenne : règlement de victoire de l'OTAN (ZZZ_eur_settle_nato_victory)"
 ZZZ_cr_eur_02_nato_victory_desc:0 "Libère les pays d'Europe de l'Est annexés, rend les cores, met fin à la guerre pour tous et pose ZZZ_eur_nato_victory. Nécessite ZZZ_eur_war_ongoing (lancer d'abord l'escalade), sinon sans effet."
 ZZZ_cr_eur_03_csto_victory:0 "Guerre européenne : règlement de victoire de l'OTSC (ZZZ_eur_settle_csto_victory)"
 ZZZ_cr_eur_03_csto_victory_desc:0 "Transforme EST / LAT / LIT / POL / UKR en puppets de SOV, met fin à la guerre pour tous et pose ZZZ_eur_csto_victory. Nécessite ZZZ_eur_war_ongoing, sinon sans effet."
 ZZZ_cr_gaw_02_china_victory:0 "GAW : règlement de victoire chinoise (ZZZ_gaw_settle_china_victory)"
 ZZZ_cr_gaw_02_china_victory_desc:0 "Paix blanche avec le Japon, pose gaw_china_victory_settled et applique l'issue japonaise / sud-asiatique. À utiliser après l'embrasement du GAW ; hors guerre, seule la partie politique s'applique."
 ZZZ_cr_gaw_03_japan_victory:0 "GAW : règlement de victoire japonaise (ZZZ_gaw_settle_japan_victory)"
 ZZZ_cr_gaw_03_japan_victory_desc:0 "Paix blanche avec la Chine, pose gaw_japan_victory_settled et installe le gouvernement collaborateur. À utiliser après l'embrasement du GAW ; hors guerre, seule la partie politique s'applique."
 ZZZ_cr_tw_02_peaceful_reunification:0 "Détroit de Taïwan : réunification pacifique (région administrative spéciale)"
 ZZZ_cr_tw_02_peaceful_reunification_desc:0 "Exécute le bloc immediate de taiwan_detente.11 sur CHI : Taïwan devient un puppet au niveau de région administrative spéciale, passe en démocratie avec Eric Chu, perd ses cores et revendications continentales, rend ses États continentaux à CHI et dissout sa marine et son aviation. Aucun événement."
 ZZZ_cr_mew_02_israel_victory:0 "Moyen-Orient MEW : règlement de victoire israélienne (B-1 / B-2 / B-3)"
 ZZZ_cr_mew_02_israel_victory_desc:0 "ISR annexe PAL (Cisjordanie), HAM (Gaza) et HEZ (Sud-Liban), pose skip_default_capitulation, MEW_isr_took_pal / ham / hez et MEW_settlement_done, et efface MEW_sixth_war_ongoing. Les cessions partielles égyptienne, jordanienne et syrienne (B-4 / B-5) ne sont pas prises."
 ZZZ_cr_kr_05_real_south_annex:0 "Cha卯ne cor茅enne : entr茅e 茅v茅nement r茅el 鈥?le Sud annexe le Nord (zzz_kor.5)"
 ZZZ_cr_kr_05_real_south_annex_desc:0 "D茅clenche directement l'茅v茅nement r茅el zzz_kor.5 (KOR annexe NKO) pour v茅rifier la cha卯ne, sans aucun effet en ligne. Le traitement militaire est celui de l'茅v茅nement, annex_country = { target = NKO transfer_troops = yes } : l'arm茅e et le stock d'茅quipement du NKO passent 脿 KOR, les divisions gardent leurs propres mod猫les, rien n'est dissous ni re-mod茅lis茅. Mutuellement exclusif avec la route Nord (脿 v茅rifier sur une sauvegarde propre)."
 ZZZ_cr_kr_06_real_north_annex:0 "Cha卯ne cor茅enne : entr茅e 茅v茅nement r茅el 鈥?le Nord annexe le Sud (zzz_kor.4 / ZZZ_NKO_march_to_seoul)"
 ZZZ_cr_kr_06_real_north_annex_desc:0 "D茅clenche directement l'茅v茅nement r茅el zzz_kor.4 (NKO annexe KOR), ce qui couvre aussi ZZZ_NKO_march_to_seoul dont le complete_effect ne fait que d茅clencher zzz_kor.4. Le traitement militaire est celui de l'茅v茅nement, annex_country = { target = KOR transfer_troops = yes } : l'arm茅e et le stock d'茅quipement du KOR passent 脿 NKO, les divisions gardent leurs propres mod猫les, rien n'est dissous ni re-mod茅lis茅. Mutuellement exclusif avec la route Sud (脿 v茅rifier sur une sauvegarde propre)."
