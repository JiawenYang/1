l_french:
 zzz_kor.1.t:0 "Reprise des négociations dans la péninsule"
 zzz_kor.1.d:0 "Plus de soixante-dix ans après l'armistice, le Nord et le Sud se retrouvent à la même table. La communauté internationale a fourni le lieu et les garanties ; les délégations ont passé des séances à huis clos sur les mesures de confiance, la coopération économique et la forme d'un règlement futur. La suite dépend du jugement des deux gouvernements."
 zzz_kor.1.a:0 "Poursuivre les discussions."
 zzz_kor.1.b:0 "Interrompre ce cycle."
 zzz_kor.2.t:0 "Une confédération dans la péninsule"
 zzz_kor.2.d:0 "Les négociations ont abouti à une percée. Les deux parties ont signé un cadre : pas de fusion d'États, pas de modification des frontières — les deux régimes sont liés dans une alliance militaire unique, étape vers une unification finale. La région réagit de façon contrastée : certains y voient un pas pragmatique, d'autres craignent que la division ne soit simplement institutionnalisée."
 zzz_kor.2.a:0 "Une nation, deux États, une alliance."
 zzz_kor.3.t:0 "Rupture du dialogue"
 zzz_kor.3.d:0 "Le dernier cycle s'est achevé sans accord. Les deux camps se sont opposés sur les garanties de sécurité et les arrangements politiques, et les délégations ont quitté la table l'une après l'autre. La ligne d'armistice est de nouveau silencieuse, mais le document non signé reste sur la table — point de départ de la prochaine tentative, ou raison de son absence."
 zzz_kor.3.a:0 "Nous avons fait ce que nous pouvions."
 zzz_kor.4.t:0 "La péninsule unifiée sous le drapeau de Pyongyang"
 zzz_kor.4.d:0 "Les forces du Nord ont franchi l'ancienne ligne d'armistice et la résistance du Sud s'est effondrée en quelques semaines. Pyongyang a proclamé l'unification, conservé le nom de République populaire de Corée et installé sa capitale à Séoul. Les partis du Sud ont été dissous ou absorbés, et des élections se tiendront dans un nouveau cadre — nul ne dit quelle place y sera laissée à l'opposition."
 zzz_kor.4.a:0 "L'ère de la division est terminée."
 zzz_kor.5.t:0 "La péninsule unifiée sous le drapeau de Séoul"
 zzz_kor.5.d:0 "Les forces du Sud ont atteint le Tumen et le régime du Nord a rendu les armes en s'effondrant. Séoul a proclamé l'unification, étendant la constitution et le système électoral de la République de Corée à toute la péninsule. Les cadres du Nord doivent choisir entre purge et ralliement, et des millions d'habitants ont changé de nationalité en une nuit — le coût réel de l'intégration ne se manifestera que plus tard."
 zzz_kor.5.a:0 "Par la constitution et par le vote."
 zzz_kor.6.t:0 "Proclamation de la République populaire de Corée"
 zzz_kor.6.d:0 "L'État unifié a fixé son nom : République populaire de Corée. Le nouveau gouvernement revendique l'héritage du gouvernement provisoire de 1945, place sa capitale à Séoul et promet une élection libre à l'échelle de la péninsule. Pékin et la plupart des États de la région ont adressé leurs félicitations ; Tokyo garde le silence."
 zzz_kor.6.a:0 "Une péninsule, un État."
 zzz_kor.7.t:0 "Fondation de la République populaire de Corée"
 zzz_kor.7.d:0 "[Séoul] Le processus d'unification achevé, plus de soixante-dix ans de division dans la péninsule coréenne ont pris fin. Dans sa déclaration de fondation, la nouvelle République populaire de Corée a promis une élection libre à l'échelle de la péninsule. Les capitales de la région ne partagent pas le même avis sur l'accord ; Washington et Pékin attendent le résultat."
 zzz_kor.7.a:0 "L'histoire tourne une page."
 zzz_kor.8.t:0 "Premières élections pan-péninsulaires"
 zzz_kor.8.d:0 "Le dépouillement des premières élections pan-péninsulaires surveillées par des observateurs internationaux est terminé. Le camp progressiste du Sud et le Parti social-démocrate coréen du Nord ont fait campagne ensemble et obtenu la majorité sur un programme de réconciliation. La participation bat un record : de Jeju au Tumen, une même urne contient désormais deux mémoires séparées depuis des décennies."
 zzz_kor.8.a:0 "Sim Sang-jung est élue première présidente."
 zzz_kor.9.t:0 "Publication des résultats pan-péninsulaires"
 zzz_kor.9.d:0 "[Séoul] Les résultats définitifs des premières élections pan-péninsulaires sont publiés. Le nouveau gouvernement reprendra deux administrations distinctes dans un cadre fédéral ; ses premières tâches sont l'intégration budgétaire, la fusion des armées et la réunion des familles séparées. Les observateurs jugent le scrutin globalement libre, tout en notant l'inégalité des conditions d'organisation dans certaines régions du Nord."
 zzz_kor.9.a:0 "Le nouveau gouvernement entre en fonction."
 zzz_kor.10.t:0 "Premières élections nationales sur toute la péninsule"
 zzz_kor.10.d:0 "Après l'absorption du Nord et le placement de la péninsule sous l'administration de Séoul, la République de Corée tient ses premières élections nationales couvrant toute la péninsule. Les électeurs de l'ancien Nord entrent pour la première fois dans un bureau de vote multipartite ; le résultat appartient aux bulletins, aucun candidat n'étant désigné d'avance."
 zzz_kor.10.a:0 "Laissons les bulletins décider."
 zzz_kor.11.t:0 "Le retour des soldats tombés"
 zzz_kor.11.d:0 "[Shenyang] Les dépouilles de soldats volontaires morts pendant la guerre de Corée ont été rapatriées par avion et inhumées dans un cimetière de martyrs. Pour la première fois depuis longtemps, les deux Corées ont envoyé des représentants à la cérémonie de transfert. Pour Pékin, un dossier historique se referme ; pour la péninsule, la guerre d'il y a soixante-dix ans est enfin autorisée à s'achever."
 zzz_kor.11.a:0 "Les disparus rentrent chez eux."
