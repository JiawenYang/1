 TFR_POLITICAL_LEADER_DESC_FRA_PIERRE_DE_VILLIERS:0 "Officier de carrière de l'Armée de terre française, Pierre de Villiers a été chef d'état-major des armées de 2014 jusqu'à sa démission en 2017, sur fond de désaccord sur les dépenses militaires."
 TFR_POLITICAL_LEADER_DESC_FRA_BRUNO_LE_RAY:0 "Général de l'Armée de terre française, Bruno Le Ray a exercé les fonctions de gouverneur militaire de Paris de 2015 à 2018."
 TFR_POLITICAL_LEADER_DESC_ITA_CLAUDIO_GRAZIANO:0 "Général de l'Armée de terre italienne, Claudio Graziano a été chef d'état-major de la Défense puis président du Comité militaire de l'Union européenne."
 TFR_POLITICAL_LEADER_DESC_RAJ_ANIL_CHAUHAN:0 "Général de l'armée indienne, Anil Chauhan est devenu chef d'état-major de la Défense en 2022 après avoir commandé le commandement oriental de l'armée."
 TFR_POLITICAL_LEADER_DESC_SPR_TEODORO_E_LOPEZ_CALDERON:0 "Amiral de la marine espagnole, Teodoro López Calderón a exercé les fonctions de chef d'état-major de la Défense à partir de 2021."
 TFR_POLITICAL_LEADER_DESC_TUR_HULUSI_AKAR:0 "Général de l'armée turque, Hulusi Akar a été chef d'état-major des armées puis ministre de la Défense nationale."
