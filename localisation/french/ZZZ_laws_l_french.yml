 ZZZ_equipment_localization: "Degré de localisation des équipements"
 ZZZ_equipment_localization_01: "Dépendance totale aux importations"
 ZZZ_equipment_localization_01_desc: "Les forces armées dépendent presque entièrement de fournisseurs étrangers : pièces détachées, munitions et plateformes doivent être importées, et toute rupture de la chaîne d'approvisionnement affaiblit rapidement l'armée."
 ZZZ_equipment_localization_02: "Forte dépendance aux importations"
 ZZZ_equipment_localization_02_desc: "La majeure partie des équipements lourds et des composants clés vient encore de l'étranger. Les usines nationales n'assemblent qu'une fraction des besoins, exposant l'armée aux embargos et aux retards de livraison."
 ZZZ_equipment_localization_03: "Autosuffisance partielle"
 ZZZ_equipment_localization_03_desc: "L'industrie nationale couvre une partie des besoins de l'armée, mais les sous-systèmes critiques et les plateformes modernes restent importés. Les forces peuvent tenir un temps, avant que les pénuries n'apparaissent sous pression prolongée."
 ZZZ_equipment_localization_04: "Autosuffisance de base"
 ZZZ_equipment_localization_04_desc: "L'industrie de défense nationale satisfait l'essentiel des besoins de l'armée. Les importations se limitent à quelques composants spécialisés, offrant une base solide pour des opérations prolongées."
 ZZZ_equipment_localization_05: "Forte autosuffisance"
 ZZZ_equipment_localization_05_desc: "Les usines nationales fournissent presque tout l'équipement nécessaire, des armes légères aux véhicules. La dépendance extérieure est marginale et les forces absorbent les chocs d'approvisionnement."
 ZZZ_equipment_localization_06: "Autosuffisance totale"
 ZZZ_equipment_localization_06_desc: "Une base industrielle de défense complète fournit à l'armée la quasi-totalité de son équipement. L'indépendance stratégique permet aux forces de combattre même si les chaînes d'approvisionnement étrangères sont coupées."
 BLOCK_SALARY_DECREASE_TT: "Le cadre juridique du travail en vigueur interdit toute baisse du salaire minimum."

