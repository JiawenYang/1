 E_Tank_Bat:0 "Bataillon de chars"
 E_Tank_Bat_desc:0 "Un bataillon de chars de type soviétique : trois compagnies de dix chars chacune plus le char du PC de bataillon, 31 chars au total. 600 soldats."
 E_Arm_Inf_Bat:0 "Bataillon d'infanterie mécanisée"
 E_Arm_Inf_Bat_desc:0 "Un bataillon de fusiliers motorisés sur véhicules de combat d'infanterie BMP-2/BMP-3 : trois compagnies, 42 VCI. 1150 soldats."
 E_Mech_Inf_Bat:0 "Bataillon de fusiliers motorisés (à roues)"
 E_Mech_Inf_Bat_desc:0 "Un bataillon de fusiliers motorisés sur transports de troupes blindés à roues BTR-80/BTR-82A : trois compagnies, 42 véhicules. 1150 soldats."
 E_Mot_Inf_Bat:0 "Bataillon de fusiliers motorisés (camions)"
 E_Mot_Inf_Bat_desc:0 "Un bataillon de fusiliers motorisés transporté par camions : trois compagnies de fusiliers sur camions Oural/KamAZ. 1150 soldats."
 E_L_Inf_Bat:0 "Bataillon d'infanterie légère"
 E_L_Inf_Bat_desc:0 "Un bataillon d'infanterie légère combattant à pied : trois compagnies de fusiliers avec appui de mitrailleuses et de mortiers. 1050 soldats."
