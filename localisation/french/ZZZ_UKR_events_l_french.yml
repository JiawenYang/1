 #乌克兰 2017-2024 剧情链（ukraine.1-13，搬运自 TFR 并按本工程依赖改写）
 ukraine.1.t: "L'Ukraine viole le protocole de Minsk"
 ukraine.1.d: "Les unités de l'armée ukrainienne ont repris les escarmouches frontalières avec l'État fédéral de Nouvelle-Russie, violant ouvertement l'accord de paix. Le Kremlin observe, et le fragile cessez-le-feu est désormais au bord de l'effondrement."
 ukraine.1.o1: "Une entreprise imprudente."
 ukraine.2.t: "Le vol 752 d'Ukraine Airlines abattu au-dessus de l'Iran"
 ukraine.2.d: "Le gouvernement iranien nous a informés que des membres des Gardiens de la révolution ont abattu par erreur l'un de nos avions de ligne peu après son décollage de l'aéroport international Imam-Khomeini. Les 176 passagers et membres d'équipage ont péri. Téhéran parle d'une erreur tragique ; pour les familles, cela ne change rien."
 ukraine.2.o1: "Une horrible tragédie."
 ukraine.3.t: "La Russie condamne le « néonazisme » ukrainien"
 ukraine.3.d: "Les médias d'État russes ont lancé une nouvelle vague d'accusations, qualifiant le gouvernement de Kyiv de « néofasciste » et de « petits-fils des collaborateurs hitlériens ». Ce ne sont que de vieux trucs de propagande habillés en informations, mais ils sont répétés chaque soir sur RT et Sputnik. Kyiv ne laissera pas cette calomnie sans réponse."
 ukraine.3.a: "L'histoire nous donnera raison."
 ukraine.4.t: "Les Russes arrivent"
 ukraine.4.d: "Le renseignement militaire avertit que Moscou prépare une invasion à grande échelle. Les ingénieurs coulent déjà du béton le long du Dniepr et des approches orientales, tandis que de nouvelles usines d'armement sont mises en service en urgence. Chaque bunker construit aujourd'hui achète du temps demain."
 ukraine.4.a: "Préparez le pire."
 ukraine.5.t: "Invitation à rejoindre l'OTAN"
 ukraine.5.d: "L'Alliance a officiellement invité l'Ukraine et la Moldavie à la rejoindre. Pour Moscou, c'est la ligne rouge qu'elle dénonce depuis des années ; pour Kyiv, c'est la seule garantie qui ait jamais tenu. L'admission sera signée dans les semaines à venir, quoi qu'en dise le Kremlin."
 ukraine.5.a: "Unis nous tenons."
 ukraine.6.t: "Établissement d'une zone d'occupation à Belgorod"
 ukraine.6.d: "Les forces ukrainiennes ont franchi la frontière russe et établi une zone d'occupation autour de Belgorod. Moscou parle d'un acte d'agression ; les commandants sur le terrain parlent d'un glacis. La population russe locale vit désormais sous administration ukrainienne."
 ukraine.6.a: "Tenez la ligne."
 ukraine.7.t: "Attentat terroriste à Belgorod"
 ukraine.7.d: "Une bombe a frappé un marché bondé de la zone occupée, tuant des dizaines de civils. Personne n'a revendiqué l'attaque, mais l'explosion a transformé l'occupation, problème militaire, en poudrière politique."
 ukraine.7.a: "Cela ne restera pas sans réponse."
 ukraine.8.t: "Soulèvement de Belgorod"
 ukraine.8.d: "Des volontaires russes et des milices locales se sont soulevés contre l'administration d'occupation. Le mouvement « Nouvelle Russie » déclare Belgorod et Koursk territoires russes libres, et ses combattants affrontent déjà les garnisons ukrainiennes."
 ukraine.8.a: "Le printemps russe a commencé."
 ukraine.9.t: "Soulèvement de Rostov"
 ukraine.9.d: "Le soulèvement a gagné Rostov. Des milices cosaques locales ont saisi plusieurs districts et les ont déclarés indépendants de Kyiv comme de Moscou, tandis que le corps de volontaires de Melitopol s'emploie à consolider la région."
 ukraine.9.a: "Le chaos s'étend."
 ukraine.10.t: "Soulèvement de Sébastopol"
 ukraine.10.d: "En Crimée, le soulèvement a atteint Sébastopol. Des formations de volontaires biélorusses et de Volhynie sont entrées dans la péninsule, et les anciennes bases de la flotte de la mer Noire sont désormais un terrain disputé."
 ukraine.10.a: "La péninsule brûle."
 ukraine.11.t: "Opération militaire spéciale"
 ukraine.11.d: "L'état-major a activé le compte à rebours de l'opération militaire spéciale. À partir de cet instant, la campagne russe est soumise à une horloge : soit l'Ukraine cède, soit l'opération s'enlise dans une impasse que Moscou ne peut pas se permettre."
 ukraine.11.a: "Lancez le compte à rebours."
 ukraine.12.t: "L'Ukraine promet de défendre le Kouban"
 ukraine.12.d: "Kyiv a publiquement garanti la sécurité du Kouban, une région que Moscou considère comme la sienne. La déclaration est une provocation délibérée, et le Kremlin le sait."
 ukraine.12.a: "Ils connaissent l'alternative..."
 ukraine.13.t: "Les élections ukrainiennes de 2024"
 ukraine.13.d: "L'Ukraine vote au milieu de la guerre. Le camp Zelensky promet la continuité et un second mandat ; les conservateurs de Porochenko promettent l'expérience et une ligne plus dure. Le résultat décidera quelle Ukraine affrontera Moscou en 2025."
 ukraine.13.a: "Réélection de Zelensky."
 ukraine.13.b: "Le retour de Porochenko."
 germany.243.t: "Le Fantôme de Kyiv"
 germany.243.d: "Le nom devient viral sur les réseaux sociaux, attribué à un pilote ukrainien de MiG-29 qui aurait abattu six avions russes le premier jour de l'invasion. Les images sont tremblantes et les affirmations non vérifiées, mais la légende fait déjà son œuvre dans un pays qui en a besoin."
 germany.243.a: "Bonne chasse."
 news.313.t: "Zelensky réélu en Ukraine"
 news.313.d: "Zelensky a remporté un second mandat. Son leadership de guerre et son style populiste ont maintenu sa coalition malgré les scandales de corruption et une contre-offensive bloquée ; l'opposition affronte désormais quatre années de plus."
 news.313.a: "Un comédien médiocre, mais un président de guerre."
 news.313.b: "L'Occident continuera de signer des chèques."
 news.314.t: "Porochenko élu en Ukraine"
 news.314.d: "Porochenko est revenu à la présidence. Les électeurs épuisés par les échecs de Zelensky se sont tournés vers l'homme qu'ils avaient rejeté, pari sur l'expérience et une ligne dure face à Moscou pour finir la guerre à de meilleures conditions."
 news.314.a: "Un russophobe en remplace un autre."
 news.314.b: "Au moins, il sait gouverner."
