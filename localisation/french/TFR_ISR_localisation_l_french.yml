l_french:
 #The Fire Rises : chaîne d'événements Israël/Palestine (portée)
 isrwar.1.t: "Proposition de plan de paix de Trump"
 isrwar.1.d: "Washington dévoile le prétendu « Accord du siècle » : Jérusalem est reconnue comme capitale d'Israël et la souveraineté israélienne sur les colonies de Cisjordanie est entérinée. Tel-Aviv doit choisir entre faire avancer les colonies et accepter le paquet économique."
 isrwar.1.a: "Nous entrerons en Cisjordanie"
 isrwar.1.b: "Un plan Marshall israélien !"
 isrwar.2.t: "Les marches de Lehava"
 isrwar.2.d: "Le mouvement d'extrême droite Lehava défile dans la vieille ville de Jérusalem, scandant la solution à un seul État et affrontant les habitants arabes. La police a du mal à maintenir l'ordre."
 isrwar.2.a: "Ils entravent la paix !"
 isrwar.2.b: "Il nous faut la solution à un seul État !"
 isrwar.3.t: "Netanyahu déclare l'état d'urgence national"
 isrwar.3.d: "Alors que le gouvernement d'unité s'effondre et que la violence de rue s'étend, le Premier ministre déclare l'état d'urgence, espérant qu'une ligne dure consolidera sa base de droite."
 isrwar.3.a: "Oui, Netanyahu !"
 isrwar.4.t: "Proclamation du gouvernement d'unité"
 isrwar.4.d: "Le Likoud et Bleu et Blanc signent un accord de rotation et forment un gouvernement d'urgence, promettant de gérer ensemble la pandémie et la crise sécuritaire."
 isrwar.4.a: "Youpi !"
 isrwar.5.t: "Chute du gouvernement d'unité"
 isrwar.5.d: "Un différend budgétaire et une querelle sur les nominations judiciaires font tomber le gouvernement. La Knesset est dissoute et Israël se dirige vers sa quatrième élection en deux ans."
 isrwar.5.a: "Merde"
 isrwar.6.t: "Opération Goliath déchu"
 isrwar.6.d: "L'état-major approuve une campagne régionale : affaiblir la présence militaire iranienne en Syrie et en Irak, frapper les réseaux terroristes transfrontaliers et sécuriser la frontière nord."
 isrwar.6.a: "Nous ne serons jamais exterminés..."
 isrwar.7.t: "Le gouvernement palestinien proteste"
 isrwar.7.d: "Des manifestations éclatent à Ramallah et Bethléem. L'Autorité palestinienne condamne l'action unilatérale d'Israël mais contrôle à peine les rues."
 isrwar.7.a: "Ne le font-ils pas toujours ?"
 isrwar.8.t: "Le gouvernement palestinien appelle aux volontaires"
 isrwar.8.d: "Des factions comme les Brigades des martyrs d'al-Aqsa recrutent ouvertement dans les camps de réfugiés. Les fusils et les explosifs artisanaux commencent à circuler en Cisjordanie."
 isrwar.8.a: "Inquiétant..."
 isrwar.9.t: "Hikmat Tamimi tué"
 isrwar.9.d: "La figure palestinienne Hikmat Tamimi est tuée dans les affrontements. En deux heures, la nouvelle atteint tout le monde arabe et chacun attend les représailles."
 isrwar.9.a: "Surveiller la situation"
 isrwar.10.t: "Investiture du nouveau président israélien"
 isrwar.10.d: "La Knesset élit Herzog président. Il appelle à panser les divisions du pays, mais la presse de droite le qualifie de choix faible."
 isrwar.10.a: "Félicitations, président Herzog"
 isrwar.11.t: "Le Hamas se mobilise"
 isrwar.11.d: "Le Hamas annonce la mobilisation générale, prend le contrôle de la sécurité à Gaza, annule les élections et masse ses combattants à la frontière."
 isrwar.11.a: "Ça part en vrille..."
 isrwar.12.t: "Déclaration de la 4e Intifada"
 isrwar.12.d: "Les factions palestiniennes déclarent la quatrième Intifada. Les combattants ouvrent le feu sur les positions israéliennes et le sud d'Israël passe en alerte aérienne."
 isrwar.12.a: "Putain"
 isrwar.13.t: "Mobilisation totale israélienne"
 isrwar.13.d: "Des ordres de rappel des réservistes sont émis et les unités blindées se dirigent vers Gaza et la frontière nord."
 isrwar.13.a: "Mobiliser tout"
 isrwar.15.t: "Guerre israélo-arabe : la solution à deux États"
 isrwar.15.d: "Après des mois de sang, Israël accepte la solution à deux États : la Cisjordanie et Gaza passent sous administration palestinienne en échange d'un cessez-le-feu et d'une reconnaissance régionale."
 isrwar.15.a: "C'est la seule issue"
