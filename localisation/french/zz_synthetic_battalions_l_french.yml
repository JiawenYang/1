l_french:
 syn_heavy_bat: "Bataillon interarmes lourd"
 syn_heavy_bat_desc: "Bataillon interarmes de 740 hommes, avec deux escadrons de chars (28 chars) et deux compagnies d'infanterie mécanisée (30 VBI), doté d'éléments antichar, antiaériens et de commandement - le noyau de toute brigade lourde moderne."
 syn_medium_bat: "Bataillon interarmes moyen"
 syn_medium_bat_desc: "Bataillon interarmes à roues de 650 hommes, sur trois compagnies de VBI à roues (32 véhicules) et un peloton de canons mobiles (8 canons d'assaut), échangeant la protection contre la mobilité stratégique."
 syn_light_bat: "Bataillon interarmes léger"
 syn_light_bat_desc: "Bataillon interarmes léger de 600 hommes, entièrement motorisé sur 60 véhicules à haute mobilité, avec quatre compagnies de fusiliers et un peloton de mortiers de 6 tubes."
 syn_amphibious_bat: "Bataillon interarmes amphibie"
 syn_amphibious_bat_desc: "Bataillon interarmes amphibie de 600 hommes, sur 34 VBI amphibies et 6 canons d'assaut amphibies, entraîné à s'emparer d'une tête de pont et à franchir les obstacles aquatiques sous le feu."
 syn_heavy_bat_USA: "Bataillon interarmes lourd américain"
 syn_heavy_bat_USA_desc: "Bataillon interarmes américain (ABCT) de 740 hommes, avec deux escadrons de chars (28 chars M1) et deux compagnies mécanisées (29 VBI M2), forte puissance antichar et antiaérienne, organisation la plus élevée."
 syn_medium_bat_USA: "Bataillon Stryker américain"
 syn_medium_bat_USA_desc: "Bataillon interarmes à roues américain de 680 hommes, sur trois compagnies mécanisées (33 VBI Stryker) et un peloton de canons mobiles, conçu pour le transport aérien stratégique rapide."
 syn_light_bat_USA: "Bataillon d'infanterie légère américain"
 syn_light_bat_USA_desc: "Bataillon d'infanterie légère américain (IBCT) de 600 hommes, entièrement mobile sur 41 véhicules tactiques à haute mobilité, avec quatre compagnies de fusiliers et un élément antichar."
 syn_amphibious_bat_USA: "Bataillon interarmes amphibie américain"
 syn_amphibious_bat_USA_desc: "Bataillon de l'US Marine Corps de 650 hommes, sur 32 VBI amphibies et canons d'assaut, capable de prendre d'assaut une tête de pont et de franchir les obstacles aquatiques sous le feu."
 syn_heavy_bat_SOV: "Bataillon interarmes lourd russe"
 syn_heavy_bat_SOV_desc: "Groupement tactique russe (BTG) de 920 hommes, avec 31 chars, 35 VBI et un bataillon d'artillerie automotrice renforcé (12 2S19), forte puissance antichar mais organisation plus faible faute de soldats sous contrat."
 syn_medium_bat_SOV: "Bataillon interarmes moyen russe"
 syn_medium_bat_SOV_desc: "Bataillon de fusiliers motorisés russe de 700 hommes, avec 35 VBI à roues et 8 canons automoteurs, équilibrant protection et mobilité."
 syn_light_bat_SOV: "Bataillon interarmes léger russe"
 syn_light_bat_SOV_desc: "Bataillon léger de fusiliers motorisés russe de 600 hommes, sur 45 MT-LB et Tigr, avec appui antichar et feux organiques."
 syn_amphibious_bat_SOV: "Bataillon interarmes amphibie russe"
 syn_amphibious_bat_SOV_desc: "Bataillon d'infanterie navale russe de 650 hommes, sur 34 VBI amphibies, rompu au franchissement des obstacles aquatiques et aux assauts côtiers."
 syn_heavy_bat_CHI: "Bataillon interarmes lourd chinois"
 syn_heavy_bat_CHI_desc: "Bataillon interarmes lourd chinois de 750 hommes, avec deux compagnies de chars (28 ZTZ-99A) et deux compagnies mécanisées (30 ZBD-04A), composition équilibrée et organisation stable."
 syn_medium_bat_CHI: "Bataillon interarmes moyen chinois"
 syn_medium_bat_CHI_desc: "Bataillon interarmes à roues chinois de 700 hommes, avec trois compagnies mécanisées (33 VBI à roues ZBL-08) et de l'artillerie mobile, axé sur la mobilité stratégique."
 syn_light_bat_CHI: "Bataillon interarmes léger chinois"
 syn_light_bat_CHI_desc: "Bataillon interarmes léger chinois de 600 hommes sur 44 véhicules d'assaut Mengshi, excellent en montagne, en jungle et en ville."
 syn_amphibious_bat_CHI: "Bataillon interarmes amphibie chinois"
 syn_amphibious_bat_CHI_desc: "Bataillon interarmes amphibie chinois de 650 hommes, sur 36 VBI amphibies ZBD-05 et canons d'assaut ZTD-05, spécialisé dans les débarquements."
