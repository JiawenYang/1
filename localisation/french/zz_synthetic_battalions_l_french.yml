l_french:
 syn_heavy_bat: "Bataillon interarmes lourd"
 syn_heavy_bat_desc: "Bataillon interarmes de 740 hommes, avec deux escadrons de chars (28 chars) et deux compagnies d'infanterie mécanisée (30 VBI), doté d'éléments antichar, antiaériens et de commandement - le noyau de toute brigade lourde moderne."
 syn_medium_bat: "Bataillon interarmes moyen"
 syn_medium_bat_desc: "Bataillon interarmes à roues de 650 hommes, sur trois compagnies de VBI à roues (32 véhicules) et un peloton de canons mobiles (8 canons d'assaut), échangeant la protection contre la mobilité stratégique."
 syn_light_bat: "Bataillon interarmes léger"
 syn_light_bat_desc: "Bataillon interarmes léger de 600 hommes, entièrement motorisé sur 60 véhicules à haute mobilité, avec quatre compagnies de fusiliers et un peloton de mortiers de 6 tubes."
 syn_amphibious_bat: "Bataillon interarmes amphibie"
 syn_amphibious_bat_desc: "Bataillon interarmes amphibie de 600 hommes, sur 34 VBI amphibies et 6 canons d'assaut amphibies, entraîné à s'emparer d'une tête de pont et à franchir les obstacles aquatiques sous le feu."
 ZZ_neg_armor_heavy: "Élément de soutien de bataillon lourd"
 ZZ_neg_armor_heavy_desc: "PC, logistique et éléments de soutien du bataillon, dotés de véhicules légers ; non engagés au combat de première ligne."
