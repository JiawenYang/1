academic_development: "Développement académique"
academic_development_modifier_tooltip: "------------\n£development Développement académique : [?academic_development_var|+1%]\n£development Développement académique - rapport mensuel : [?modifier@academic_development_monthly|=+1%]"
lower_academic: "Lutte cognitive"
lower_academic_desc: "À ce stade, une grande partie de la population rencontre des difficultés pour accéder à l'éducation de base et l'acquérir. L’analphabétisme de masse est courant, et les individus peinent à maîtriser les compétences cognitives fondamentales. Cette étape se caractérise par une exposition limitée à l’apprentissage formel et à l’acquisition de connaissances."
low_academic: "Acquisition de la littératie de base"
low_academic_desc: "Des efforts sont déployés pour lutter contre l’analphabétisme de masse, permettant à une plus grande partie de la population d’acquérir des compétences de base en lecture, écriture et calcul. Bien que les capacités cognitives s’améliorent, l’accent reste mis sur les connaissances fondamentales, avec une exposition encore limitée à des domaines intellectuels plus avancés."
medium_academic: "Compétence fonctionnelle"
medium_academic_desc: "La société atteint un stade où la majorité des individus possèdent une compétence fonctionnelle dans divers domaines cognitifs. L'éducation de base est généralisée, et les gens peuvent appliquer efficacement leurs connaissances pour relever les défis quotidiens. Ce niveau implique une compréhension plus pratique des concepts et des capacités de résolution de problèmes."
high_academic: "Penseurs critiques"
high_academic_desc: "Allant au-delà de la compétence fonctionnelle, les individus développent des compétences en pensée critique. L'éducation favorise le raisonnement analytique, la pensée indépendante, et une compréhension plus approfondie de concepts complexes. La société valorise la curiosité intellectuelle et encourage les individus à questionner, analyser et synthétiser l'information."
higher_academic: "Excellence intellectuelle"
higher_academic_desc: "Cela représente le plus haut niveau de développement intellectuel dans une société. Les individus sont non seulement bien éduqués, mais ils aspirent également à l’excellence intellectuelle. L’accent est mis sur l’enseignement supérieur et la recherche. La société valorise l’innovation, adopte une culture de l’apprentissage continu, et encourage les réussites intellectuelles."
higher_academic_tooltip: "§GNous atteindrons un développement académique moderne !§!"
highest_academic: "Ingéniosité académique"
highest_academic_desc: ""

farming_development: "Développement agricole"
farming_development_modifier_tooltip: "------------\n£development Développement agricole : [?farming_development_var|+1%]\n£development Développement agricole - rapport mensuel : [?modifier@farming_development_monthly|=+1%]"
lower_farming: "Agriculture de subsistance"
lower_farming_desc: "À ce stade, la société dépend principalement de l’agriculture de subsistance, avec une productivité agricole limitée. L'accès à la nourriture est un défi constant et les communautés peinent à répondre à leurs besoins nutritionnels de base. Les pratiques agricoles sont souvent traditionnelles et inefficaces."
low_farming: "Sécurité alimentaire de base"
low_farming_desc: "La société atteint un niveau de sécurité alimentaire de base grâce à l'amélioration des pratiques agricoles. Les méthodes agricoles sont améliorées, entraînant une augmentation modeste de la productivité. Cependant, l’accès à une alimentation variée et nutritive reste limité, et des pénuries occasionnelles peuvent survenir."
medium_farming: "Production alimentaire durable"
medium_farming_desc: "La société adopte des pratiques agricoles plus durables, mettant l’accent sur la conservation des sols, la gestion de l’eau et la rotation des cultures. Ce niveau marque une offre alimentaire plus stable et fiable. Les communautés parviennent à répondre régulièrement à leurs besoins nutritionnels, réduisant leur vulnérabilité face aux pénuries."
high_farming: "Prospérité agricole diversifiée"
high_farming_desc: "L’agriculture devient une source de prospérité grâce à une diversité de cultures et de bétail. Les techniques agricoles avancées, l’adoption de technologies et la diversification augmentent la productivité et le bien-être économique. Ce stade reflète une société ayant un accès abondant à une alimentation nutritive, contribuant à la santé et au bien-être général."
higher_farming: "Agriculture modernisée"
higher_farming_desc: ""
higher_farming_tooltip: "§GNous aurons une agriculture moderne !§!"
highest_farming: "Progrès agro-technologique"
highest_farming_desc: "Cela représente le plus haut niveau de développement agricole dans une société. Les technologies avancées, l’agriculture de précision et les pratiques durables sont intégrées au secteur agricole. La société atteint l’autosuffisance alimentaire et contribue à la sécurité alimentaire régionale et mondiale. Les innovations et la recherche jouent un rôle crucial dans un système alimentaire résilient et productif."

poverty_development: "Taux de pauvreté"
poverty_development_modifier_tooltip: "------------\n£development Développement de la pauvreté : [?poverty_development_var|+1%]\n£development Développement - rapport mensuel de la pauvreté : [?modifier@poverty_development_monthly|=+1%]"
lower_poverty: "Pauvreté accablante"
lower_poverty_desc: "Ce stade représente le niveau le plus bas de bien-être économique, où une grande partie de la population vit dans une pauvreté extrême. Les revenus moyens sont minimes, et beaucoup peinent à satisfaire leurs besoins fondamentaux comme l’alimentation, le logement et les soins de santé. La pauvreté généralisée entrave le développement de la société."
low_poverty: "Pression financière"
low_poverty_desc: "La société fait face à une pression financière généralisée, les revenus moyens restant insuffisants pour garantir un niveau de vie décent. De nombreuses personnes sont confrontées à des défis économiques qui limitent leur accès à l’éducation, aux soins de santé et aux services essentiels."
medium_poverty: "Difficultés économiques modérées"
medium_poverty_desc: "Ce stade reflète une situation où la majorité de la population connaît des difficultés économiques modérées. Bien que certaines activités économiques existent, les revenus moyens sont modestes, et beaucoup peinent à maintenir une qualité de vie stable et satisfaisante."
high_poverty: "Aspiration croissante à la classe moyenne"
high_poverty_desc: "La société connaît une transition où les aspirations à la classe moyenne commencent à croître. Les revenus moyens s'améliorent, permettant à une part plus importante de la population d'accéder à un niveau de vie plus confortable. Cependant, les disparités de revenus peuvent persister et affecter l'équité sociale."
higher_poverty: "Prospérité durable et bien-être économique"
higher_poverty_desc: "Cela représente le sommet du bien-être économique, caractérisé par une prospérité durable. Les revenus permettent à la majorité de jouir d'une haute qualité de vie. L'accès à l'éducation, aux soins et au bien-être est généralisé, favorisant une société florissante et équitable."
higher_poverty_tooltip: "§GNous allons éliminer la pauvreté !§!"
highest_poverty: "Pauvreté et pénurie quasi éradiquées"
highest_poverty_desc: ""

industry_development: "Développement industriel"
industrial_development_modifier_tooltip: "------------\n£development Développement industriel : [?industrial_development_var|+1%]\n£development Développement industriel - rapport mensuel : [?modifier@industrial_development_monthly|=+1%]"
lower_industry: "Industrie artisanale"
lower_industry_desc: "Cela représente le stade initial de l’industrialisation, où la production repose principalement sur le travail manuel et les outils à main. Le niveau de mécanisation est minimal, et les activités économiques sont généralement de petite échelle et locales."
low_industry: "Artisanat mécanisé"
low_industry_desc: "À ce stade, une transition vers la mécanisation commence, avec l’introduction de machines de base dans l’artisanat. Les ateliers et les petites industries adoptent des machines simples, améliorant ainsi l’efficacité et la production. Toutefois, l’industrialisation reste limitée."
medium_industry: "Manufacture intermédiaire"
medium_industry_desc: "La société connaît une avancée importante dans l’industrialisation, marquée par l’apparition d’industries complexes. Des machines et technologies avancées deviennent courantes, permettant la production de masse. Les processus deviennent plus standardisés et diversifiés."
high_industry: "Industrie complexe"
high_industry_desc: "Ce stade reflète un haut degré d’industrialisation avec une intégration technologique avancée. Les industries sont plus complexes, avec des processus de production sophistiqués et des technologies spécialisées. L’économie se diversifie et l’innovation est valorisée."
higher_industry: "Industrie moderne"
higher_industry_desc: "Au sommet de l’industrialisation, la société atteint un état de technologie avancée, d’automatisation et d’interconnexion industrielle. Ce niveau implique des techniques de fabrication de pointe, des infrastructures modernes, et un écosystème économique sophistiqué."
higher_industry_tooltip: "§GNous aurons un développement industriel moderne !§!"
highest_industry: "Pratiques industrielles innovantes"
highest_industry_desc: ""

military_development: "Professionnalisme militaire"
military_development_modifier_tooltip: "------------\n£development Professionnalisme militaire : [?military_development_var|+1%].\n£development Professionnalisme militaire - rapport mensuel : [?modifier@military_development_monthly|=+1%]"
lower_military: "Foule désorganisée"
lower_military_desc: "Ce niveau reflète un manque de structure, de discipline et de professionnalisme dans la force militaire. Les unités ou individus sont désorganisés, peu formés, et suivent rarement les protocoles établis."
low_military: "Formation novice"
low_military_desc: "À ce stade, la force militaire commence à prendre forme avec une formation de base. On insiste sur la discipline, les tactiques élémentaires, et les règles militaires, mais le manque d’expérience reste un défi."
medium_military: "Cohorte compétente"
medium_military_desc: "La force militaire devient compétente, maîtrisant les compétences de base, les tactiques, et respectant les normes établies. Les unités font preuve de professionnalisme, de travail d’équipe, et de communication efficace."
high_military: "Brigade experte"
high_military_desc: "À ce niveau, la force militaire atteint une expertise élevée. Les unités exécutent des opérations complexes avec précision, disposent de compétences tactiques avancées, et font preuve de professionnalisme et d’adaptabilité."
higher_military: "Avant-garde d’élite"
higher_military_desc: "Le sommet du développement militaire professionnel. La force est considérée comme élite, maîtrisant non seulement la guerre conventionnelle mais aussi les opérations spécialisées comme les forces spéciales, la cyberguerre et le renseignement."
higher_military_tooltip: "§GNous atteindrons un développement militaire moderne !§!"
highest_military: "Tactiques de guerre avancées"
highest_military_desc: ""

society_development: "Développement sociétal"
society_development_modifier_tooltip: "------------\n£development Développement sociétal : [?society_development_var|+1%]\n£development Développement sociétal - rapport mensuel : [?modifier@society_development_monthly|=+1%]"
lower_society: "Civilisation chaotique"
lower_society_tt: "£economy_laws_cost_texticon Coût des lois: §R+20%§!"
lower_society_desc: "À ce stade tumultueux, la société souffre de désordre, sans structures organisées, technologies avancées ni gouvernance efficace. La survie de base est la principale préoccupation, sans cohésion ni planification à long terme."
low_society: "Société corrompue"
low_society_tt: "£economy_laws_cost_texticon Coût des lois: §R+15%§!"
low_society_desc: "Dans ce chaos, la corruption s’installe, minant les institutions et la confiance publique. La gouvernance est compromise, et les normes éthiques déclinent, entravant le progrès."
medium_society: "Intégrité en stabilisation"
medium_society_tt: "£economy_laws_cost_texticon Coût des lois: §R+10%§!"
medium_society_desc: "La société entreprend des réformes pour combattre la corruption, renforcer les institutions, et restaurer la confiance publique. L’objectif est de jeter les bases d’une gouvernance plus transparente et responsable."
law_high_society: "Prospérité en expansion"
law_high_society_tt: "£economy_laws_cost_texticon Coût des lois: §R+5%§!"
law_high_society_desc: "La société progresse dans le développement économique, technologique et social. Les institutions se renforcent, l’éducation et l’innovation sont valorisées, menant à une meilleure qualité de vie et une répartition plus équitable des ressources."
higher_society: "Société moderne"
higher_society_desc: ""
higher_society_tooltip: "§GNous aurons une société moderne !§!"
highest_society: "Sommet de la civilisation"
highest_society_desc: "Ce stade ultime reflète une société technologiquement avancée, avec des institutions solides, une richesse culturelle, et un niveau de vie élevé. Elle est un leader mondial dans les domaines scientifiques, artistiques et politiques, promouvant le développement durable, la justice sociale et l'harmonie avec l'environnement."

