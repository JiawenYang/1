higher_female_desc: "\n''Je me suis un peu emporté hier, mais je me suis remis~\n\nDésolé~ j'ai été accepté en master! J'ai obtenu mon diplôme avec succès~\nEt je vais poursuivre mon doctorat et briller dans mon domaine de prédilection.\n\nQuant à Xiao, je pense qu'il aura du mal à être admis. Peut-être qu'il essaiera de postuler à des universités à l'étranger? Toutes les universités recevront mes justificatifs. [Amour]\nQuant à Xiao, il est étudiant en droit et il essaiera probablement de passer l'examen du barreau (désolé, je l'ai déjà réussi). Je continuerai à le signaler et j'espère qu'il réussira sa carrière (mais je pense que ce sera difficile).\n\nJe ne sais pas comment désactiver les commentaires privés sur Bilibili, donc je ne viendrai pas pendant un moment.''\n- Yang Jingyuan"

