FRA_foreign_legion_integration: "Légion étrangère française"
FRA_foreign_legion_integration_desc: "La Légion étrangère, connue sous le nom de Légion étrangère française, a longtemps été le fer de lance de la puissance impériale de l'Empire français, puis de la République française. Elle demeure aujourd'hui un exemple éclatant de la puissance militaire française, ce qui apporte de nombreux avantages à l'institution. Chaque semaine, nous recevons un afflux de jeunes hommes valides du monde entier, prêts à entamer une nouvelle page de leur vie au service de la Légion. \n\nLa Légion est actuellement chargée de l'application du Franc de la Communauté financière africaine (CFA) dans les pays d'Afrique de l'Ouest situés dans les zones monétaires du Franc, ainsi que de la formation des nations et groupes pro-occidentaux en Afrique afin d'assurer une stabilité durable sur le continent. Il est également évident que l'extrémisme islamique est en hausse, et c'est pourquoi nous déploierons la Légion pour éradiquer ce fléau qui a coûté la vie à des citoyens français ces dernières années. \n\nHonneur et fidélité."
FRA_foreign_legion_integration_TT: "Si le pays a un État avec une religion inacceptable pour la civilisation à laquelle il appartient, ses effectifs seront affaiblis de 15 %."
higher_racial_integration: "Égalité au haut commandement"
higher_racial_integration_desc: "« L’armée était la seule institution dans toute l’Amérique où un jeune Noir pouvait rêver un rêve qu’il n’osait même pas imaginer à l’âge de onze ans. » – Colin Powell"
