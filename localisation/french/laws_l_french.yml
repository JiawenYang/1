type_of_economy: "Type d'économie"
 econ_capitalist_economy: "§YCapitalisme§!"
 econ_capitalist_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_capitalism_banner\n\n\n\n\n\n§gLe capitalisme est un système économique dans lequel les entreprises privées opèrent sans l'intervention du gouvernement. Dans ce système, les prix, les coûts et les salaires sont déterminés par les forces du marché, telles que l'offre et la demande. Cela signifie que la supervision et la régulation gouvernementales sont limitées. Le capitalisme est populaire parmi les libéraux du marché et est devenu le système économique le plus largement adopté dans le monde.§!"

 econ_american_capitalism: "§YCapitalisme américain§!"
 econ_american_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_american_capitalism_banner\n\n\n\n\n\n§gLe système économique américain est un modèle pour d'autres économies de marché libre. Il est basé sur le libre-échange et une intervention minimale du gouvernement dans les affaires économiques. Cependant, certaines caractéristiques uniques différencient ce système des autres formes de capitalisme.\nL'un des traits distinctifs est la fondation de l'économie américaine. Le dollar américain est une monnaie forte, reconnue pour sa stabilité. Par conséquent, il est largement utilisé comme principale monnaie de réserve dans le monde.§!"

 econ_oligopolistic_capitalism: "§YCapitalisme oligopolistique§!"
 econ_oligopolistic_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_oligopolistic_capitalism_banner\n\n\n\n\n\n§gComme dans de nombreux autres pays, l'économie de cette nation repose sur les principes du marché libre. Cependant, elle se caractérise par un haut niveau de concentration du marché, avec un petit nombre de grandes entreprises dominant la concurrence.\nCe qui distingue ce système des autres capitalismes, c'est l'implication minimale du gouvernement. Les fonctions réglementaires et administratives de l'État sont limitées, capturées, ou largement inefficaces. Les désirs des grandes entreprises priment sur l'intérêt public.§!"

 econ_collective_capitalism: "§YCapitalisme collectif§!"
 econ_collective_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_collective_capitalism_banner\n\n\n\n\n\n§gLe capitalisme collectif est un modèle économique japonais caractérisé par une relation étroite entre les entreprises et le gouvernement, ainsi que de solides partenariats entre les entreprises, leurs fournisseurs, clients et autres parties prenantes. Ce modèle privilégie la stabilité à long terme et la collaboration plutôt que la concurrence, reposant sur l'idée que les entreprises et la société sont interconnectées et partagent la responsabilité du succès de chacun.§!"

 econ_welfare_capitalism: "§YCapitalisme de bien-être§!"
 econ_welfare_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_welfare_capitalism_banner\n\n\n\n\n\n§gDans un système de capitalisme de bien-être, le gouvernement combine la présence d'entreprises privées avec un certain niveau de contrôle et d'intervention économique afin d'assurer un bon fonctionnement. Selon ses partisans, ce système trouve un équilibre entre une forte croissance économique, une faible inflation et un faible chômage, de bonnes conditions de travail, et un certain niveau de sécurité sociale.§!"

 econ_managed_economy: "§YCorporatisme nazi§!"
 econ_managed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_managed_economy_banner\n\n\n\n\n\n§gLe corporatisme nazi fait référence au système économique de l'Allemagne nazie. Bien qu'il soit largement considéré comme un échec d'un régime désormais disparu, les partisans des mouvements néonazis prétendent toujours qu'il s'agissait du seul véritable système économique honnête pour la "race aryenne".\nTous les efforts sont dirigés vers la satisfaction des besoins de l'État et de l'autorité suprême — que ce soit le grand dirigeant ou l'appareil du parti. Chaque action est minutieusement scrutée. Les exigences du gouvernement sont apparemment infinies, et ses projets ont priorité sur toutes les autres considérations.§!"

 econ_planned_economy: "§YÉconomie planifiée§!"
 econ_planned_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_planned_economy_banner\n\n\n\n\n\n§gUne économie planifiée est un système économique dans lequel toute la production et la croissance sont planifiées à l'avance afin de répondre aux besoins de la population et du pays. Cette planification peut être centralisée ou décentralisée, et elle peut être décidée par un conseil d'experts dédié ou par le peuple lui-même de manière participative.§!"

 econ_developed_socialism: "§YSocialisme développé§!"
 econ_developed_socialism_tooltip: "\n\n\n\n\n£GFX_ZZZ_developed_socialism_banner\n\n\n\n\n\n§gLe concept de socialisme développé, vestige de l'ère Brejnev en Union soviétique, a été revitalisé par les économistes russes contemporains. Dans cette version actualisée, davantage de propositions et de réformes de Kossyguine ont été mises en œuvre, aboutissant à un paysage économique plus varié.\nBien que la planification centrale reste essentielle, l'initiative privée n'est pas abandonnée. Les entreprises privées bénéficient de plus d'autonomie dans la production, la planification, et les incitations aux employés. Cette indépendance leur permet de générer davantage de profits, les motivant à produire plus. De plus, un nouveau système salarial basé sur le coefficient de participation au travail a été introduit, rémunérant les employés selon leur contribution à la production.§!"

 econ_military_controlled_economy: "§YÉconomie contrôlée par l'armée§!"
 econ_military_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_military_controlled_banner\n\n\n\n\n\n§gDans une économie contrôlée par l'armée, l'armée exerce une supervision directe sur l'économie. La quasi-totalité des activités économiques sont orientées vers la satisfaction des besoins militaires. Ce type de système économique est fréquent dans les dictatures militaires ou les stratocraties. Toutefois, il privilégie souvent les intérêts de l'armée au détriment du bien-être des citoyens. Ces régimes ont souvent une idéologie nationaliste, voire ultra-nationaliste.§!"

 econ_socialist_market: "§YMarché socialiste§!"
 econ_socialist_market_tooltip: "\n\n\n\n\n£GFX_ZZZ_socialist_market_banner\n\n\n\n\n\n§gDans une économie de marché socialiste, le gouvernement et les entreprises privées collaborent pour bâtir une société plus équitable. Le gouvernement possède certaines entreprises et supervise l'économie pour garantir l'équité, tandis que les entreprises privées fonctionnent et se développent.\nL'un des objectifs principaux est d'assurer l'accès universel aux services essentiels comme la nourriture, le logement et les soins de santé. Un autre objectif est de favoriser l'innovation et l'entrepreneuriat tout en veillant à ce que les entreprises servent l'intérêt public.§!"

 econ_worker_controlled_economy: "§YÉconomie contrôlée par les travailleurs§!"
 econ_worker_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_worker_controlled_banner\n\n\n\n\n\n§gOn pense souvent que les économies planifiées sont uniquement dirigées par l'État, mais ce n'est pas toujours le cas.\nLes économies contrôlées par les travailleurs ne sont pas dirigées par des fonctionnaires ou des bureaucrates, mais par les travailleurs eux-mêmes, souvent par le biais de conseils ouvriers ou de syndicats. Ces organismes permettent aux travailleurs de conserver un contrôle direct sur leur production et de bénéficier d'un haut degré d'autonomie.§!"

 econ_kaiser_economy: "§YÉconomie des Reichsbürger§!"
 econ_kaiser_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_kaiser_economy_banner\n\n\n\n\n\n§gLe système économique du nouveau régime du Kaiser est un enchevêtrement complexe de pratiques néo-féodales et d'hégémonie agraire. Il voit dans la banque la source de tous les maux sociaux, allant jusqu'à accuser explicitement les Juifs d'être responsables du déclin de l'économie allemande et de la campagne allemande, l'urbanisation étant selon eux motivée par les intérêts bancaires juifs.\nIl vise à créer une économie de marché rurale prospère, centrée sur les petites entreprises peu nuisibles à l'environnement. Toute la puissance industrielle restante est consacrée à répondre aux besoins de l'armée et à ses effectifs toujours croissants.§!"

 econ_maga_capitalism: "§YCapitalisme MAGA§!"
 econ_maga_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_maga_capitalism_banner\n\n\n\n\n\n§gLe capitalisme MAGA — bien qu'il suive les normes de base du modèle capitaliste américain, ce système est bien plus protectionniste et ne se soumet pas aux grandes entreprises.\nIl soutient plutôt les petites entreprises indépendantes et les producteurs, ainsi que les entreprises de taille moyenne. Il comporte aussi des lois antitrust strictes pour limiter ou éliminer les excès de pouvoir économique.\nUne autre caractéristique clé de ce système est son insistance sur la protection et la promotion des intérêts des travailleurs. L'objectif est de maintenir et, si possible, améliorer la sécurité sociale, Medicare et d'autres programmes sociaux, tout en minimisant leur poids sur l'économie américaine.§!"

 econ_party_state_capitalism: "§YCapitalisme de Parti-État§!"
 econ_party_state_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_party_state_capitalism_banner\n\n\n\n\n\n§gLe capitalisme de parti-État est un modèle économique dans lequel ce ne sont pas les structures de l'État qui dominent l'économie, mais celles du parti.\nL'un des principaux indicateurs de l'expansion du système de parti-État est la présence croissante d'organisations du parti au sein des entreprises, y compris dans les sociétés privées et même étrangères. Une autre caractéristique importante de ce modèle est l'expansion du capital d'État au-delà des entreprises publiques. Ce processus a été qualifié de « financiarisation de l'État ». L'activité économique du parti-État est aussi visible dans l'évolution de la politique industrielle.§!"

 econ_mixed_economy: "§YModèle économique mixte§!"
 econ_mixed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_mixed_economy_banner\n\n\n\n\n\n§gUne économie mixte est un système économique qui combine des éléments du capitalisme, comme les entreprises privées, et du socialisme, comme les services publics nationalisés.\nIl existe plusieurs façons de définir une économie mixte. Par exemple, certains disent qu'il s'agit d'un système combinant économie de marché et économie planifiée. D'autres disent qu'il combine les marchés avec l'intervention de l'État, ou encore l'entreprise privée avec l'entreprise publique.§!"

 econ_inclusive_capitalism: "§YCapitalisme Inclusif§!"
 econ_inclusive_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_inclusive_capitalism_banner\n\n\n\n\n\n§gLe capitalisme inclusif est une théorie économique visant à créer un système de répartition de la valeur plus juste et plus équitable dans l'économie, ainsi qu'à lutter contre les inégalités croissantes de revenus et de richesses. L'essence du capitalisme inclusif réside dans la promotion d'une croissance durable qui sert les intérêts de toutes les parties concernées : entreprises, investisseurs, travailleurs, consommateurs, gouvernements, communautés locales, société dans son ensemble et environnement.§!"

