safety_laws: "Droits des travailleurs"
lower_safety_desc: "« Chaque fois que j’entends quelqu’un défendre l’esclavage, j’ai une forte envie de le lui faire essayer personnellement. » – Abraham Lincoln"
low_safety_desc: "« Le capital est du travail mort, qui, tel un vampire, ne vit qu’en suçant le travail vivant, et vit d’autant plus qu’il en suce davantage. » – Karl Marx"
medium_safety_desc: "« Je ne peux m’empêcher de grincer des dents rien qu’en pensant aux syndicats. » – Margaret Thatcher"
high_safety_desc: "« Seul un idiot essaierait de priver les hommes et les femmes qui travaillent de leur droit de rejoindre le syndicat de leur choix. » – Dwight D. Eisenhower"
higher_safety_desc: "« Le travail ne peut pas rester immobile. Il ne doit pas reculer. Il doit avancer, ou sombrer. Le mot le plus important dans le langage de la classe ouvrière est ‘solidarité’. » – Harry Bridges"

