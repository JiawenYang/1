#L'accord pétrolier échoue (saudi.12)
saudi.12.t: "L'accord pétrolier échoue"
saudi.12.d: "La tentative désespérée de Riyad de négocier un accord de production avec Moscou et les capitales du Golfe s'est terminée par un effondrement humiliant. Les Russes sont sortis de la salle en riant ; les monarchies du Golfe, tremblant devant les blindés israéliens, ont refusé de défier Washington."
saudi.12.a: "Inondez le marché. Laissez-les se noyer."
