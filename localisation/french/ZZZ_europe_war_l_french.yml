l_french:
 ZZZ_europe_war:0 "Guerre continentale"
 ZZZ_eur_escalate:0 "Porter la guerre sur le continent"
 ZZZ_eur_escalate_desc:0 "Le front ukrainien s'est enlisé en une question européenne. Ordonnez la mise en alerte des districts militaires occidentaux et étendez l'opération au-delà du périmètre soviétique."
 zzz_eur.1.t:0 "La mèche du continent"
 zzz_eur.1.d:0 "Ce qui avait commencé comme une guerre pour l'Ukraine a franchi l'ancienne ligne de démarcation. Les colonnes avancent à l'ouest de la Vistule, les couloirs aériens au-dessus de la Baltique sont fermés, et chaque capitale européenne doit répondre à la même question : l'arrangement de 1991 tient-il encore ? La guerre continentale a commencé, et nul ne peut promettre qu'elle restera conventionnelle."
 zzz_eur.1.a:0 "L'Europe est de nouveau au bord du gouffre."
 zzz_eur.2.t:0 "Le reflux du front de l'Est"
 zzz_eur.2.d:0 "L'avance russe s'est effondrée. Les unités estoniennes, lettones et lituaniennes se sont rétablies le long de leurs anciennes frontières, l'administration polonaise est revenue dans le bassin de la Vistule et le gouvernement ukrainien a retrouvé sa capitale. La guerre s'arrête là où les cartes du début des années 1990 le prévoyaient, et la question orientale demeure ouverte."
 zzz_eur.2.a:0 "Le bloc de l'Est revient à ses anciennes frontières."
 zzz_eur.3.t:0 "De la Vistule à la Baltique"
 zzz_eur.3.d:0 "La coalition occidentale s'est brisée. Les cabinets baltes ont été remplacés par des administrations responsables devant Moscou, la Pologne et l'Ukraine ont été réduites à des États dépendants, et le drapeau russe flotte sur les approches de la côte balte. L'ordre du continent est redessiné à l'échelle de Moscou, et le cessez-le-feu n'est qu'une pause dans le débat."
 zzz_eur.3.a:0 "L'ordre du continent est redessiné à la mesure de Moscou."
 zzz_eur.4.t:0 "Un cessez-le-feu sans vainqueur"
 zzz_eur.4.d:0 "Aucune coalition n'a pu forcer une décision. Le front ne bouge plus, les dépôts sont vides et les deux camps ont accepté un cessez-le-feu sur les positions qu'ils tiennent. Aucune frontière n'a changé, aucun gouvernement n'est tombé ; la guerre s'arrête simplement, et la question pour laquelle elle fut menée est transmise à la génération suivante."
 zzz_eur.4.a:0 "Le front s'arrête là où il se trouve."
