 news.228.a: "Les opportunistes frappent encore !"
 news.229.t: "Les Talibans entrent dans Kaboul"
 news.229.d: "Les talibans ont fait une entrée fulgurante dans la capitale de l'Afghanistan aujourd'hui, après l'effondrement du gouvernement et le départ précipité du président ainsi que de nombreux citoyens et étrangers, marquant la fin de deux décennies coûteuses de la campagne américaine pour reconstruire le pays.\n\nDes combattants talibans lourdement armés se sont répandus dans la capitale, certains prenant le contrôle du palais présidentiel abandonné de Kaboul. Suhail Shaheen, porte-parole des talibans, a déclaré à l'Associated Press que les militants tiendront dans les jours suivants des pourparlers visant à former un "gouvernement islamique ouvert et inclusif".\n\nÀ la tombée de la nuit, les combattants talibans se sont déployés dans Kaboul, prenant le contrôle des postes de police abandonnés et s'engageant à maintenir l'ordre pendant la transition. Les résidents ont signalé des pillages dans certains quartiers, notamment dans le quartier diplomatique, et des messages circulant sur les réseaux sociaux conseillaient aux gens de rester chez eux et de verrouiller leurs portes.\n\nEn l'espace d'un peu plus d'une semaine, les talibans ont pris le contrôle de presque tout l'Afghanistan, malgré les milliards de dollars dépensés par les États-Unis et l'OTAN en près de 20 ans pour renforcer les forces de sécurité afghanes. Quelques jours plus tôt, une évaluation militaire américaine avait estimé que la capitale ne serait pas sous pression des insurgés avant un mois."
 news.229.a: "Ils partent sans un bruit..."
 news.230.t: "L'Ukraine lance une contre-offensive"
 news.230.d: "La guerre en Europe fait rage depuis plusieurs semaines, et contre toute attente, le drapeau russe flotte désormais sur le bâtiment présidentiel à Kyiv. Malgré les efforts de l'Ukraine, celle-ci a été repoussée hors de sa capitale par l'assaut incessant des russes.\n\nDans une tentative désespérée, le gouvernement ukrainien a lancé une contre-attaque totale, mobilisant toutes ses ressources pour repousser les russes. Déjà, des accusations de violations des droits humains de la part des forces ukrainiennes ont été portées, mais largement ignorées.\n\nCette contre-offensive se révèle extrêmement destructrice, et avec l'aide de leurs alliés européens, l'issue de cette contre-attaque reste pour l'instant incertaine.\n\nMais une chose est sûre : l'Ukraine n'est pas prête à abandonner et sa ferveur ne cesse de croître chaque jour."
 news.230.a: "La guerre s'intensifie..."
 news.230.b: "Ils deviennent désespérés !"
 news.230.c: "Herobrine Slava !"
 news.231.t: "Les Pays des Balkans quittent l'OTAN"
 news.231.d: "Suite aux manifestations anti-occidentales au Monténégro et en Macédoine, les deux pays ont invoqué l'Article 13 de l'OTAN, déposant officiellement des "notices de dénonciation" au siège de l'OTAN en Belgique. De nombreux experts internationaux estiment que cela a modifié de manière significative l'équilibre des forces dans les Balkans, offrant à la Serbie, alignée sur la Russie, un gain de puissance substantiel dans la région. Avec le vide de pouvoir causé par l'effondrement des États-Unis et le chaos socio-économique dans l'Union européenne, la stabilité, si soigneusement préservée depuis l'effondrement de la Yougoslavie, semble désormais en équilibre précaire."
 news.231.a: "Intéressant."
 news.232.t: "Bataille de Kaliningrad"
 news.232.d: ""
 news.232.a: "La guerre s'intensifie..."
 news.233.t: "Bataille de Rostov"
 news.233.d: "Dans un mouvement drastique pour garantir sa sécurité nationale, l'Ukraine a revendiqué une victoire majeure contre la Russie en prenant Rostov, une zone en bordure de la partie sud-est de l'Ukraine.\n\nAprès des semaines de combats intenses, les forces de l'OTAN ont réussi à capturer la ville de Rostov, marquant une victoire importante pour l'OTAN. Celle-ci s'est engagée dans un affrontement continu avec la Russie en raison de l'invasion illégale de l'Ukraine ainsi que d'autres violations de l'intégrité territoriale européenne.\n\nLes troupes de l'OTAN victorieuses étaient dirigées par le commandant des forces terrestres ukrainiennes, le général Valerii Zaluzhnyi, qui a exprimé sa confiance dans le résultat de la bataille, soulignant que les forces ukrainiennes avaient réussi à prendre l'initiative et à en tirer parti de manière décisive.\n\nLes responsables russes ont exprimé des regrets concernant cette perte et ont évoqué l'espoir que, comme pendant la Grande Guerre patriotique, les forces russes repousseraient les envahisseurs. Pour l'instant, cependant, l'Ukraine est fière de célébrer la prise de Rostov et reste confiante dans sa capacité à maintenir sa souveraineté face à la machine de guerre russe."
 news.233.a: "La guerre s'intensifie..."
