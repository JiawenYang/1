news.573.d: "Aujourd'hui, la Russie récolte le fruit des réformes qu'elle a entreprises. Le pays tout entier a été plus actif que jamais, la course présidentielle revigorant la société russe. Alors que la transition gouvernementale de Medvedev n'était vue que comme un simple échange de sièges, le résultat final a dépassé la plupart des attentes.\n\nBien que la course ait été acharnée, la Russie populaire a finalement gagné. Formée de la fusion de tous les partis de gauche, elle englobe une large coalition allant des libéraux sociaux aux communistes purs et durs. Ses politiques culturelles sont cependant conservatrices, considérant le progressisme comme une manœuvre capitaliste pour distraire les citoyens de l'exploitation économique.\n\nLe vainqueur de la course est Alexandre Loukachenko, l'infâme président de la Biélorussie qui est resté au pouvoir après la proclamation de l'État union. Les observateurs étrangers ont noté que l'État union était à l'origine destiné à permettre à Alexander de prendre le contrôle de la Russie après Eltsine. Et maintenant, presque 30 ans plus tard, son vœu a été exaucé."
