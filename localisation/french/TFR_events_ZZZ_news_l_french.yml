 news.330.a: "La guerre s'intensifie..."
 news.331.t: "Xi Jinping destitué par l'Armée"
 news.331.d: "Dans un tournant choquant, le président chinois Xi Jinping a été destitué par l'armée à la suite d'une crise politique déclenchée par l'échec de la capture de Taïwan. Cette action sans précédent a provoqué des ondes de choc dans le monde entier, soulevant des préoccupations quant à la stabilité de la région et à l'avenir de la direction de la Chine.\nLa crise a commencé lorsque le plan ambitieux de Xi Jinping visant à réunifier Taïwan avec la Chine continentale a rencontré une résistance farouche des forces de l'APTO et taïwanaises. Malgré des mois de planification et de préparation, les forces militaires chinoises n'ont pas pu atteindre leur objectif, entraînant une défaite humiliante pour Xi Jinping et son administration.\n\nAlors que les nouvelles de l'opération échouée se répandaient, les divisions internes au sein du Parti communiste chinois se sont aggravées, des hauts responsables militaires exprimant leur insatisfaction quant à la gestion de la situation par Xi Jinping. Dans un acte de force dramatique, la direction militaire a orchestré un coup d'État, destituant Xi Jinping et déclarant la loi martiale à Pékin."
 news.331.a: "Troublant..."
 news.332.t: "Révolution en Russie"
 news.332.d: "Après avoir subi une défaite dans la guerre en Europe de l'Est, la Russie a été plongée dans le chaos, initié d'abord par un coup d'État orchestré par le groupe Wagner, puis par l'assassinat de son leader, Evgueni Prigojine. Le pays est entré dans une période d'incertitude alors que des officiers wagnériens impopulaires prenaient le pouvoir provisoirement, sapant la confiance publique, ce qui a mené à des manifestations antigouvernementales à travers la nation. D'abord modestes, ces protestations ont rapidement pris de l'ampleur, avec même certains membres des forces de l'ordre et de l'armée se joignant aux manifestants.\n\nLa situation a atteint un point critique quand Alexeï Navalny, mystérieusement échappé de prison (des rumeurs suggèrent une possible collusion avec le personnel pénitentiaire), a appelé à un soulèvement national contre le régime chancelant. À Moscou, un soulèvement massif a éclaté, provoquant la perte de contrôle du gouvernement alors que de nombreux fonctionnaires et policiers faisaient défection pour rejoindre les manifestants, menant à la reddition des autorités et à leur soumission aux nouvelles instances.\n\nDans un discours télévisé à la nation, Navalny a proclamé le début d'une Révolution Démocratique, annonçant la libération de la Russie de son passé tumultueux."
 news.332.a: "Le printemps arrive à Moscou."
 news.333.t: "Les Forces Nord-Coréennes franchissent la DMZ"
 news.333.d: "Des nouvelles de dernière minute de la péninsule coréenne : les forces nord-coréennes ont lancé une invasion à grande échelle, franchissant le 38e parallèle et avançant sur le territoire sud-coréen.\n\nLa Corée du Sud a déclaré l'état d'urgence, tandis que les membres de l'IDAE et de l'APTO, en désaccord de longue date sur diverses affaires internationales, sont entrés dans un état de mobilisation selon des plans préétablis.\n\nPour les autres pays à travers le monde, la guerre sur la péninsule coréenne est perçue comme un point de rupture pour l'intensification des conflits entre les deux camps opposés. Bien que tout indique que les deux côtés exploiteront cette situation pour leurs propres agendas, reste à voir si cela aboutira à une confrontation militaire de grande envergure semblable aux « Forces de l'ONU » du passé."
 news.333.a: "La guerre de notre époque."
 news.334.t: "Attaque chimique à Londres !"
