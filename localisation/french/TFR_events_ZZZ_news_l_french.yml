 news.237.t: "L'OTAN intervient en Ukraine"
 news.237.d: "Une annonce choquante est venue des responsables de l'OTAN à Bruxelles, car pour la deuxième fois dans l'histoire, après le 11 septembre, l'Article Cinq de la charte de l'OTAN a été invoqué ! Ces derniers jours, des accrochages armés ont eu lieu entre les troupes de la frontière polonaise et russe à l'ancienne frontière entre la Pologne et la Biélorussie. Personne ne sait vraiment qui a tiré en premier, mais les affrontements d'hier matin ont presque éclaté en une bataille ouverte. Les diplomates des deux camps appelaient à la négociation et espéraient que la crise se dissiperait grâce à un accord entre les deux parties. Cependant, aucune négociation n'est prévue, car les responsables de l'OTAN ont, à une large majorité, invoqué l'Article Cinq, un officiel du Royaume-Uni déclarant que "le temps n'est plus à la négociation lorsqu'une attaque armée directe a été menée contre un membre de l'OTAN". Déjà, presque toutes les nations de l'aile orientale de l'OTAN ont déclaré l'état d'urgence national et la mobilisation immédiate de leurs forces armées respectives. Le ministère des Affaires étrangères russe a publié une déclaration courte mais inquiétante affirmant que "la Russie mobilisera et utilisera tous les moyens militaires disponibles pour défendre sa souveraineté nationale". Des citoyens de Russie comme de l'Occident ont posté des vidéos montrant des formations militaires se dirigeant vers l'est de l'Europe, probablement pour les hostilités qui devraient éclater dans les prochaines heures. La guerre en cours en Ukraine sera certainement le principal champ de bataille entre la Russie et l'OTAN, les responsables de Bruxelles ayant annoncé que l'armée de l'OTAN défendrait l'Ukraine ainsi que les États membres de l'OTAN. Pour la première fois depuis 1945, une grande guerre conventionnelle entre plusieurs nations majeures s'apprête à se dérouler sur le continent. Les Européens et les analystes à travers le continent sont restés sans voix alors que beaucoup craignent l'ampleur inconnue de la mort et de la destruction qui suivront bientôt, alors que des nations dotées de puissants arsenaux nucléaires et d'importantes armées se préparent à la guerre."
 news.237.a: "La guerre s'intensifie..."
