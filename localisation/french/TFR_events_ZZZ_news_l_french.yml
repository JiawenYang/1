 news.187.t: "Coup militaire en Allemagne"
 news.187.d: "Des nouvelles alarmantes nous parviennent d'Allemagne, où la Bundeswehr et les services de sécurité auraient renversé le gouvernement civil ! La tragédie avait déjà frappé l'Allemagne récemment, la défaite face à l'URSS nouvellement reformée ayant plongé l'armée et les élites politiques allemandes dans une tourmente spectaculaire. Le public et de nombreuses organisations politiques sont en effervescence suite à l'incapacité de l'Allemagne à vaincre les Soviétiques, mais ces nouveaux événements surpassent tout ce qui a précédé. Des officiers de haut rang de l'armée, de l'aviation et de la marine, soutenus par des unités d'infanterie et des opérateurs des forces spéciales du KSK, ont annoncé qu'ils « appliquent le mandat légal, moral et constitutionnel de l'Allemagne » contre le gouvernement civil élu.\n\nÀ Berlin et dans d'autres villes, des hauts responsables politiques ont déjà été arrêtés, le Bundestag a été suspendu indéfiniment, et un groupe d'officiers dirige désormais le gouvernement à la place du chancelier. Déjà impopulaires auprès du public, les élus n'ont pu qu'observer impuissants alors que l'armée arrêtait et destituait la majorité des membres du gouvernement. Tant en Allemagne qu'à l'étranger, analystes et citoyens soupçonnent que ce complot militaire fait partie du plan secret "Day X" élaboré par des officiers allemands depuis les années 2010. D'autres grandes nations de l'OTAN ont condamné le coup, qualifiant cet événement de "profanation sauvage et répugnante de la démocratie et de l'État de droit".\n\nLe monde est stupéfait de voir une nation occidentale riche, libérale, démocratique et hautement développée sombrer dans un tel chaos et autoritarisme."
 news.187.a: "Tout ceci est absurde !"
