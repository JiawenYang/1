 news.181.t: "Coup d'état des Généraux Français"
 news.181.d: "Terribles nouvelles en provenance de France où une tentative de coup d'État par l'armée française a plongé la nation dans la tourmente ! Comme dans de nombreux autres pays d'Europe occidentale, la récente défaite face à la Russie a provoqué une grande agitation au sein de la société et de la politique françaises. L'armée française, toujours soucieuse de préserver son rôle au sein du gouvernement et de la société, a franchi l'impensable. Un groupe d'officiers supérieurs de l'armée et des services de renseignement français a pris d'assaut Paris et d'autres grandes villes. Ces officiers déclarent publiquement qu'ils sont là pour "éliminer les politiciens criminellement incompétents qui ont trahi les intérêts nationaux français". Cependant, il semble que cette tentative de prise de pouvoir ait été accueillie avec une grande hostilité et indignation, tant du public que même au sein de l'armée. D'importantes manifestations publiques ont débuté, dénonçant le groupe d'officiers tentant de s'emparer du pouvoir, et les leaders des grands partis politiques condamnent les officiers de la même manière. Fait intéressant, une large portion d'officiers et de soldats s'est unie pour s'opposer et résister aux putschistes. De nombreux membres de haut rang de l'armée française non impliqués dans le coup d'État ont déclaré qu'ils empêcheraient cette "prise de pouvoir illégale et dangereuse" par les putschistes. Les analystes en France et à l'étranger doutent que le coup d'État aboutisse et avertissent que l'intrigue et d'autres actions néfastes pourraient se poursuivre si aucune mesure efficace n'est prise pour stabiliser la situation. Bien que de nombreux politiciens en France appellent au calme, le chaos qui se déploie dans la société française semble ne faire que s'étendre davantage..."
 news.181.a: "Intéressant"
 news.182.t: "Explosion massive à Beyrouth"
 news.182.d: "Le port de Beyrouth a été ravagé aujourd'hui après l'explosion soudaine d'un entrepôt rempli de nitrate d'ammonium, provoquant une détonation qui a anéanti l'intégralité du port et les quartiers environnants, causant plus de 218 morts, des milliers de blessés et des centaines de milliers de sans-abri, car les dégâts se sont étendus à une grande partie des infrastructures de Beyrouth. Le gouvernement libanais a décrété un état d'urgence de deux semaines en réponse au désastre, alors que des manifestations immédiates ont éclaté dénonçant l'incapacité apparente du gouvernement à prévenir une telle catastrophe."
 news.182.a: "Quelle horreur !"
 news.183.t: "Guerre Algéro-Marocaine"
 news.183.d: "La République Démocratique et Populaire d'Algérie a rarement été une force de républicanisme de principe ou d'anti-monarchisme. Cela a changé ; des années d'imbroglios diplomatiques, de conflits frontaliers et d'accusations d'hébergement de rebelles ont finalement éclaté en conflit ouvert alors que l'Algérie et le Maroc se battent pour le destin du Maghreb.\n\nDéjà, les rapports de diverses villes frontalières changeant de mains abondent sur Telegram et d'autres médias sociaux. Des pannes de courant sont signalées dans les deux nations, et les réfugiés encombrent les routes. La question des réfugiés de l'Union Européenne refait surface alors que des bateaux de nouveaux migrants se dirigent vers le nord. Il semble qu'aucune région du monde n'échappe à la guerre."
 news.183.a: "Le Maghreb brûle"
