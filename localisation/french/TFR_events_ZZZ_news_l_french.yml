 news.276.t: "Explosion au dépôt de munitions de Cobasna"
 news.276.d: "Dans le village de Cobasna en Moldavie, le plus grand dépôt de munitions d'Europe a été détruit pendant la guerre entre l'OTAN et la Russie.\n\nL'explosion a été si puissante qu'elle a été comparable en intensité aux bombes atomiques d'Hiroshima et de Nagasaki, coûtant la vie à des dizaines de milliers de personnes en Moldavie et dans les régions environnantes. On pense qu'il s'agit de l'une des plus grandes explosions non nucléaires de l'histoire.\n\nLa cause de l'explosion est actuellement inconnue, mais certains rapports indiquent qu'elle aurait été provoquée par un missile égaré durant la guerre en Europe entre l'OTAN et la Russie."
 news.276.a: "Eh bien, au moins maintenant on n'a plus besoin de tout éliminer..."
 news.277.t: "Shinzo Abe démissionne"
 news.277.d: "Le Premier ministre japonais Shinzo Abe a annoncé sa décision de démissionner au bloc dirigeant.\n\nShinzo Abe souffre de colite ulcéreuse, une inflammation chronique de la muqueuse du côlon. Cette condition avait déjà causé sa démission en 2007. Mais son état s'était stabilisé et, en 2012, il a été réélu Premier ministre. Le 24 août, il a marqué plus de 2799 jours en fonction, le mandat le plus long de tout Premier ministre japonais.\n\nIl a récemment été informé d'une aggravation de sa maladie, ayant visité la clinique deux fois ces derniers jours. «Je ne peux pas être le chef du gouvernement si je ne peux pas prendre les meilleures décisions pour le peuple. J'ai décidé de démissionner», a déclaré Abe lors d'une conférence de presse."
 news.277.a: "Une ère s'achève."
 news.278.t: "Dissolution de l'Union Européenne"
 news.278.d: ""
 news.278.a: "Une rupture violente..."
 news.279.t: "Formation de l'Association des États Démocratiques"
 news.279.d: "Aujourd'hui, un moment historique a eu lieu avec la fondation de l'Association des États Démocratiques (AED). Le leader actuel de la Russie soviétique a annoncé la formation de l'organisation, avec des envoyés de la République du Bélarus, de la République de Cuba et de la République du Venezuela.\n\nL'AED vise à recruter uniquement des pays socialistes et est perçue par de nombreux experts étrangers comme la prochaine Internationale dans l'histoire russe. Ils estiment qu'avec le recul des pressions américaines, la RSFSR allait inévitablement capitaliser sur l'opportunité. Les effets de l'organisation se font déjà sentir, plusieurs accords et partenariats étant en cours entre les membres fondateurs et de futurs candidats.\n\nDe manière surprenante, des responsables russes et biélorusses ont déjà déclaré que l'expansion future et des 'améliorations' de l'organisation ne sont pas à exclure. Cependant, cette déclaration a suscité des critiques de l'ONU, qui la considère comme une menace à son autorité."
 news.279.a: "Une ONU rouge ?"
 news.280.t: "Soulèvements en Europe de l'Est"
