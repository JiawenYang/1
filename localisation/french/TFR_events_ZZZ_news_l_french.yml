 news.290.t: "Guerre civile au Japon"
 news.290.d: "Aujourd'hui, il a été confirmé qu'une guerre civile a éclaté au Japon. Après le coup d'État militaire à Tokyo, les forces progressistes démocratiques n'ont pas reconnu la légitimité du nouveau gouvernement et ont commencé à s'unir dans le nord du pays. En conséquence, la ville de Sapporo a été proclamée capitale provisoire. Un organe gouvernemental intérimaire y a été établi pour coordonner les actions des forces d'opposition. Les autorités de Sapporo ont également commencé à former leur propre armée et ont déclaré leur intention de lutter pour leurs droits et libertés. Le gouvernement militaire de Tokyo a envoyé des troupes vers le nord pour réprimer le soulèvement démocratique et reprendre le contrôle de la région."
 news.290.a: "Le Soleil se couche..."
 news.291.t: "Les Forces du Pacte d'Acier traversent l'Oder"
 news.291.d: "Aujourd'hui, le monde s'est réveillé face à une nouvelle guerre.\n\nÀ 4 heures du matin, les forces du Pacte d'Acier, une alliance formée par les nouveaux gouvernements nationalistes d'Europe après l'effondrement de l'OTAN, ont lancé une invasion simultanée de la République Tchèque et de la Pologne, brisant le statu quo actuel des frontières avec le bloc soviétique.\n\nDes milliers de véhicules blindés européens ont commencé à traverser la campagne polonaise en direction de Varsovie, rencontrant à peine de résistance de la part du soi-disant gouvernement de Réclamation. Dans le même temps, des avions de chasse de la Luftwaffe ont décollé et se sont dirigés vers leurs cibles en Europe de l'Est.\n\nBien que le Pacte d'Acier n'ait pas encore directement affronté les troupes soviétiques, il ne fait aucun doute que cela n'est qu'une question de temps. Une haine et un esprit revanchard accumulés depuis longtemps en Europe sont maintenant prêts à déferler comme une vague sur l'Est, balayant tout jusqu'à l'Oural. Un esprit similaire anime les soldats soviétiques - sauf, bien sûr, qu'ils ne s'arrêteraient qu'une fois arrivés aux rives de l'océan Atlantique.\n\nLe sort de l'Europe a été en jeu de nombreuses fois dans divers conflits, mais cette fois-ci, les camps sont déterminés à en décider une fois pour toutes."
 news.291.a: "Le monde ne sera plus jamais le même..."
 news.292.t: "Formation de la Yougoslavie"
 news.292.d: "Alors que les bruits de combat ont cessé avec la victoire des forces serbes contre les derniers 'États dissidents' des Balkans, les autorités serbes ont déclaré la renaissance de la Yougoslavie proprement dite, les derniers papiers étant finalisés et un jour férié déclaré dans tout le nouvel État réformé. Les parades militaires sont également courantes, la plus grande se tenant à Belgrade, la ville étant drapée de drapeaux yougoslaves et d'affiches de propagande.\nLe gouvernement à Belgrade affirme depuis longtemps avoir tiré les leçons des erreurs de la précédente union et avoir modernisé sa vision du nouvel État unifié sud-slave.\nLes observateurs internationaux restent sceptiques face à cette nouvelle tentative, beaucoup accusant le gouvernement de traiter durement les personnes jugées 'réactionnaires' et 'ennemis du peuple'."
 news.292.a: "Fraternité et unité, vraiment ?"
 news.293.t: "Coup d'etat de l'extrême droite en Croatie"
 news.293.d: "Après la victoire des forces extrémistes en Serbie, la population croate est devenue de plus en plus inquiète et s'est radicalisée face à la menace serbe imminente.\nL'un des principaux partis nationalistes - le HSP - a gagné un élan constant, en particulier parmi les rangs militaires, culminant dans un coup d'État militaire qui a dissous le parlement et instauré le HSP au pouvoir avec des pouvoirs autocratiques.\nDaniel Srb, le nouveau président, a proclamé lors d'un discours télévisé que 'la Croatie ne pliera pas face aux revanchards serbes'. Le gouvernement nationaliste entreprend déjà des réformes de militarisation intense."
 news.293.a: "Cela ne finira pas bien..."
 news.294.t: "La Biélorussie s'unifie avec la Russie"
 news.294.d: "Après des années de tractations politiques, le projet russe d'« État de l'Union », qui a vu le jour à l'aube du millénaire, est enfin arrivé à terme. Les autorités russes, conjointement avec leurs homologues biélorusses, ont signé des accords de coopération unifiée et de renforcement de l'union, qui ont été immédiatement ratifiés par les deux chefs d'État.\nAvec seulement quelques formalités restantes, il semble désormais que la Russie et la Biélorussie forment une seule entité.\nDes rassemblements massifs ont eu lieu dans de nombreuses villes des deux pays, saluant cette évolution et la qualifiant de plus grande victoire de la patrie depuis la Crimée. De nombreux politiciens affirment que ce n'est que le début d'un nouveau printemps russe.\n\nCe mouvement géopolitique offre aux russes un nouvel avantage sur le théâtre européen et une base pour un renforcement militaire contre la menace perçue venant de l'Ouest."
 news.294.a: "Ils seront mieux ainsi..."
 news.294.b: "Que notre union fraternelle soit éternelle !"
 news.295.t: "Discours de Medvedev"
 news.295.d: "Le monde géopolitique a été choqué par le récent discours de Dmitri Medvedev, qui a récemment pris ses fonctions et enregistré un message adressé aux russes. Dans ce discours, il a fustigé les globalistes, les 'larbins' de l'UE, et leurs attaques incessantes contre la souveraineté russe et le caractère national. Medvedev a proclamé : «...Notre peuple ne se pliera jamais à la volonté des sodomites de Bruxelles. Leur simulacre de démocratie, qui cache des valeurs impies pour la Russie et ses peuples... ».\nDans un développement encore plus inquiétant, Medvedev s'est adressé aux pays voisins non alignés avec des déclarations dures, remettant même en question la légitimité de leurs gouvernements. Plus tard dans la journée, les autorités russes ont envoyé des lettres urgentes à ces chefs d'État, leur demandant de se présenter à une table de négociation pour rechercher une nouvelle modération politique. Aucun n'a encore répondu.\nAvec les forces armées russes ayant récemment terminé des exercices militaires à leurs frontières, seul le temps dira ce qu'il en adviendra.\nLes analystes politiques et militaires ne s'attendent pas à ce que ces pays résistent longtemps en cas d'invasion militaire, citant la faiblesse de leur structure militaire et leur position géopolitique, rendant leur lutte de peu d'intérêt pour les démocraties occidentales, actuellement absorbées par leurs propres problèmes, et qui n'apporteront pas beaucoup d'aide."
 news.295.a: "L'ours rugit."
 news.296.t: "Les communistes envoient un ultimatum aux états dissidents"
 news.296.d: "Les communistes russes ont intensifié leurs déclarations de plus en plus hostiles envers ce qu'ils considèrent comme des « États dissidents anti-soviétiques », en envoyant des ultimatums où ils exigent une soviétisation complète, affirmant vouloir 'libérer les travailleurs des républiques sœurs opprimées' et leur accorder le droit de participer à un référendum de restauration de l'URSS refusé par les régimes capitalistes actuels. Cela a été accueilli avec un soutien généralisé en Russie, beaucoup y voyant le début d'une nouvelle Union soviétique. Les villes ont été drapées de drapeaux rouges, d'emblèmes soviétiques et d'affiches en faveur de l'unification.\nDe nombreux communistes dans les pays attaqués ont prêté allégeance à l'URSS et ont proclamé qu'ils se battront contre leurs États oppresseurs.\nLes analystes politiques et militaires ne s'attendent pas à ce que ces pays tiennent longtemps, citant la faiblesse de leur structure militaire et leur position géopolitique, rendant leur lutte de peu d'intérêt pour les démocraties occidentales, actuellement absorbées par leurs propres problèmes, et qui n'apporteront pas beaucoup d'aide.\nIl semble que ces nations pourraient bientôt disparaître, rendant les cartes politiques actuelles obsolètes."
 news.296.a: "L'ours rouge rugit."
 news.297.t: "La Russie impériale attaque !"
 news.297.d: "Les récents accrochages à la frontière russe ont dégénéré en affrontements militaires, lorsque le haut commandement russe a donné l'ordre direct de lancer une marche militaire dans les pays voisins. Dans un discours télévisé, Vladimir Jirinovski a prononcé des propos véhéments contre ses ennemis, affirmant qu'ils ne sont rien d'autre que des quasi-États en échec dirigés par des opportunistes corrompus qui, de leur propre faute, ont conduit leurs pays à la ruine. Jirinovski a déclaré que seule l'administration russe, et le retour au grand Empire, pourrait ramener ces régions à la prospérité et à la richesse. Il a conclu son discours par : « russes, nous gagnerons ! Dieu est avec nous ! ».\nDes rapports indiquent des ordres de bataille sévères donnés aux soldats, suggérant que les russes réprimeront violemment toute résistance et toute menace.\nEn Russie, les citoyens sont désormais constamment rappelés à la propagande pro-guerre, aux haut-parleurs et aux parades, avec toutes les villes et villages drapés des couleurs du drapeau national.\nLes analystes politiques et militaires ne s'attendent pas à ce que ces pays résistent longtemps en cas d'invasion militaire, citant la faiblesse de leur structure militaire et leur position géopolitique, rendant leur lutte de peu d'intérêt pour les démocraties occidentales, actuellement absorbées par leurs propres problèmes, et qui n'apporteront pas beaucoup d'aide."
 news.297.a: "L'ours rugit."
 news.298.t: "La Russie envahit la Biélorussie !"
 news.298.d: "La Russie est de plus en plus en colère contre la nouvelle Biélorussie démocratique pour avoir coupé ses liens avec elle. Dans une émission récente, Medvedev a annoncé le début d'une opération militaire de rétablissement de l'ordre, visant à ramener la Biélorussie dans le giron des pays amis. La position géopolitique de la Biélorussie en fait une pièce vitale du plan européen pour limiter l'influence de la Russie ; on s'attend donc à ce que l'Europe pourrait apporter une aide à la démocratie biélorusse en cette sombre période de besoin. Alors que la guerre éclate près de la frontière ukrainienne, les autorités de Kiev commencent à s'inquiéter pour leur propre sécurité face aux actions audacieuses de Moscou."
 news.298.a: "Mort totale du libéralisme"
