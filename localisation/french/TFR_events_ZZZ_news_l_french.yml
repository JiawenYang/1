 news.112.t: "Fin de la guerre civile libyenne"
 news.112.d: "."
 news.112.o1: "Nous sommes inarrêtables !"
 news.112.o2: "Développement intéressant"
 news.113.t: "Virus COVID-19"
 news.113.d: "L'Organisation mondiale de la santé, en collaboration avec le Parti communiste chinois, surveille de près l'apparition alarmante d'un nouveau virus dans la ville de Wuhan. Cette émergence soudaine a suscité de vives inquiétudes parmi les experts de la santé et les dirigeants mondiaux, notamment avec le retour de milliers de citoyens chinois de vacances, ce qui pourrait faciliter la propagation du virus vers les populations étrangères.\n\nAlors que la situation s'aggrave, les experts notent que le virus semble devenir plus mortel, affichant un taux de mortalité croissant qui alarme les responsables de la santé publique à travers le monde. Les rapports indiquent que le virus est non seulement hautement transmissible, mais montre également des signes de mutations qui pourraient accroître sa virulence. Cette tendance préoccupante a conduit à une intensification des efforts de recherche pour comprendre son comportement et son impact potentiel sur la santé mondiale.\n\nHier, les craintes de beaucoup se sont confirmées lorsque l'OMS a officiellement déclaré qu'une pandémie n'est plus une question de 'si', mais de 'quand'. Cette déclaration marque un tournant décisif dans la réponse mondiale à l'épidémie, incitant les nations à prendre des mesures urgentes pour atténuer la crise imminente. Les pays comptent déjà leurs citoyens infectés, les systèmes de santé se préparant à un afflux de patients alors que les cas continuent d'augmenter."
 news.113.o1: "Temps sans précédent"
 news.114.t: "Rébellion princière en Arabie saoudite"
 news.114.d: "Des ondes de choc se sont propagées dans la communauté mondiale avec l'annonce d'hostilités armées dans le Royaume d'Arabie saoudite après la mort du roi Salman Al Saoud. L'un des régimes les plus oppressifs de la planète, ce régime a toujours été rongé par la corruption, l'instabilité et les conflits religieux entre la minorité chiite et la majorité sunnite. Ces fractures ont éclaté au grand jour aujourd'hui, alors que la Coalition royale arabe, un gouvernement d'opposition au prince héritier Mohammed ben Salmane, a lancé une insurrection armée contre le gouvernement central saoudien. La République arabe, un mouvement libéral concentré dans le nord du pays, s'est également révoltée, plongeant le pays dans une anarchie totale. Les prix du pétrole ont grimpé de plus de 250 %, plongeant l'économie mondiale dans le chaos, tandis que les marchés boursiers ont chuté à des niveaux historiquement bas. Le monde retient son souffle alors que la péninsule s'embrase."
 news.114.a: "La fin de la maison des Saoud ?"
 news.115.t: "Le Congrès refuse la diplomatie"
 news.115.d: "Ce qui sera peut-être vu comme l'événement le plus tragique du 21e siècle, les deux gouvernements de Denver et de Washington, D.C. ont refusé de s'engager dans des pourparlers diplomatiques pour parvenir à une conclusion pacifique à la crise qui ébranle les États-Unis après des semaines de négociations infructueuses. Alors que Trump et Biden ont chacun annoncé être le dirigeant légitime du pays, des combats sporadiques entre milices ont éclaté le long de la ligne de cessez-le-feu temporaire à la frontière entre l'Illinois et l'Indiana. Des flammes s'élèvent des gratte-ciel de Chicago alors que les milices de Trump tirent salve après salve pour capturer la ville frontalière, tandis que les milices de Biden avancent sur la ville de Danville, Illinois. À Denver, des rapports font état de fourgons noirs banalisés enlevant des militants anti-guerre des rues, tandis que des manifestations pro-Trump dans les banlieues de Louisville ont été dispersées de force par l'Armée fédérale. Bien que le gouvernement de Trump ait du mal à maintenir l'ordre dans les villes libérales où les émeutes persistent, le contrôle de facto de Biden ne s'étend pas au-delà des autoroutes et des villes, les milices clandestines ayant déjà commencé à s'armer et à tendre des embuscades aux convois militaires. Dans les foyers à travers les États-Unis, les familles regardent avec horreur la trame même de la société américaine se déchirer. Alors que les frères s'arment les uns contre les autres, il est indéniable que la deuxième guerre civile américaine a véritablement commencé."
 news.115.a: "Frères contre frères une fois de plus."
 news.116.t: "Fin de la guerre civile syrienne"
 news.116.d: "Le conflit civil emblématique du Printemps arabe de 2011 a enfin pris fin alors que les dernières forces islamistes dans le nord-ouest de la Syrie, autour de la ville d'Idlib, ont été écrasées par l'Armée syrienne lors de la bataille d'Idlib, les dernières forces de l'Armée syrienne libre et de Jabhat Fateh Al-Sham ayant fait leur dernier combat à la mairie d'Idlib. La bataille s'est achevée lorsque la ville entière a été encerclée et la mairie rasée par un bombardement au mortier. Alors que l'Armée syrienne commence à pacifier les poches de résistance dans le gouvernorat désormais repris, le gouvernement syrien a annoncé la fin de la guerre civile et le début de la reconstruction et du retour à la prospérité de la Syrie, maintenant que les groupes rebelles soutenus par l'étranger sont en déroute. Malgré cet optimisme, l'économie syrienne reste en ruines après une décennie de guerre civile, avec de nombreux problèmes persistants, notamment de multiples groupes de bandits et islamistes menant encore des campagnes de guérilla à travers le pays."
 news.116.a: "Paix. Mais à quel prix ?"
 news.116.b: "Allah, Syrie, Bachar !"
 news.117.t: "Effondrement du gouvernement yéménite"
 news.117.d: "Une confirmation est arrivée du Conseil politique suprême : leurs forces ont pris la ville d'Aden et ont accepté la capitulation du gouvernement pro-Hadi. Ces dernières années, les combattants houthis ont infligé des pertes massives aux unités saoudiennes, avec des estimations récentes indiquant la perte de trois brigades entières dans les montagnes du Yémen. Conjuguée à une diminution des frappes aériennes saoudiennes, le gouvernement pro-Hadi a été pressé par des attaques constantes des Houthis, et Aden est tombé en quelques semaines après les offensives renouvelées."
 news.117.a: "Le Yémen verra-t-il enfin la paix ?"
 news.118.t: "Sécession du Yémen du Sud"
 news.118.d: "Dans une victoire décisive, les forces loyales au Conseil de transition du Sud ont capturé Sanaa et Mukalla, consolidant leur emprise sur les villes clés du Yémen. Les gouvernements affaiblis des Houthis et de Hadi auraient fui, permettant au CTS de sécuriser enfin leur indépendance tant recherchée du Nord après des années de guerre civile.\n\nAvec les victoires sur le champ de bataille derrière eux, les dirigeants du Sud concentrent désormais leurs efforts sur la reconstruction et la construction de l'État. La guerre a laissé une grande partie de cette région autrefois stable dévastée, avec des infrastructures en ruines et une économie paralysée. Alors que le Sud se lance sur sa propre voie, il fait face à l'immense tâche de stabiliser et de reconstruire ses territoires. Une fois de plus, le Yémen se retrouve divisé ; peut-être cette fois de manière permanente."
 news.118.a: "Qu'est-ce que cela signifie pour le Yémen ?"
 news.119.t: "Extrémistes islamiques s'emparent de La Mecque"
 news.119.d: "Le monde islamique regarde avec horreur les rapports en provenance d'Arabie saoudite révélant que des extrémistes djihadistes ont attaqué et pris la ville de La Mecque. Déjà, la péninsule arabique est plongée dans un état de tumulte sans précédent à cause de la guerre civile, mais il semble que ce nouveau développement mette la cerise sur ce gâteau tragique et tumultueux de conflit. Alors que les forces du gouvernement saoudien s'effondraient dans leurs efforts pour maintenir l'ordre dans le pays, les terroristes islamistes ont exploité cette opportunité et pris La Mecque avec une résistance mineure de la police et des restes des forces de sécurité encore présentes dans la région.\n\nLes terroristes ont publiquement déclaré que la ville accueillera un nouveau 'califat' et ont appelé d'autres cellules terroristes connectées à travers l'Arabie saoudite à frapper et s'emparer d'autres grandes villes. Les principaux groupes confessionnels islamiques internationaux ont condamné la prise de la ville, de nombreuses critiques qualifiant les insurgés de 'déshonneur pour l'un des lieux les plus saints de l'islam'. Les forces restantes du gouvernement saoudien et des forces armées ont promis de traiter rapidement avec tous les groupes extrémistes osant poursuivre une lutte armée illégale contre le gouvernement. Les citoyens musulmans à travers le monde sont sous le choc face à cette attaque audacieuse contre un lieu aussi important."
 news.119.a: "La terre sainte profanée."
 news.120.t: "Mort du roi saoudien"
 news.120.d: "Dans le communiqué d'aujourd'hui, le gouvernement d'Arabie saoudite a annoncé le décès regrettable et inattendu du dirigeant du pays, le roi Salman Al Saoud, qui était roi depuis 2015. Bien qu'il ait évité de préciser la raison exacte de sa mort, de nombreuses rumeurs affirment que le roi était malade du Covid depuis des mois, ce qui explique pourquoi il n'est pas apparu en public une seule fois cette année.\n\nCela s'ajoute à une série de tragédies qui ont frappé le Royaume, avec la pandémie mondiale de coronavirus et l'effondrement des prix du pétrole. Et bien que Mohammed ben Salmane al Saoud ait rapidement prêté serment comme successeur, étant l'héritier légitime, le niveau de suspicion politique et de division semble si grand que beaucoup ne peuvent s'empêcher de voir une tache de conspiration dans ce développement rapide.\n\nPendant ce temps, le pays continue d'être déchiré par des manifestations consécutives à un effondrement économique et sociétal, avec des sentiments islamiques radicaux et républicains en hausse selon les rapports. Le Royaume est au bord d'une crise fatale depuis un certain temps, et la mort soudaine du roi pourrait être l'épreuve qu'il ne surmontera pas."
 news.120.a: "Envoyez nos condoléances aux Saoudiens"
 news.121.t: "Les prix du pétrole s'envolent"
 news.121.d: "La moyenne industrielle du Dow Jones a subi sa pire chute quotidienne jamais enregistrée, dépassant les records établis plus tôt ce mois-ci, alors que l'instabilité dans le gouvernement saoudien a secoué les investisseurs déjà paniqués par l'épidémie de coronavirus. L'indice des valeurs vedettes a frôlé le territoire baissier au milieu des craintes croissantes d'une récession mondiale, plongeant de 2 013,76 points, soit 7,8 %, pour clôturer à 23 851,02. Le Nasdaq a chuté de 7,3 % à 7 950,68. L'indice S&P 500 a perdu 7,6 % pour clôturer à 2 746,56, sa pire journée depuis décembre 2008.\n\nAprès avoir plongé de 7 % dans les premières minutes de la séance de trading, déclenchant un 'disjoncteur' de la Bourse de New York qui a stoppé les échanges pendant 15 minutes. Ce lundi a marqué la première fois que cette restriction a été mise en œuvre depuis que les seuils actuels ont été instaurés en 2013 pour éviter une répétition du crash du 'Lundi noir' de 1987. Le prix du pétrole a grimpé à 117,14 dollars US par baril alors que les perturbations à travers l'Arabie saoudite ont stoppé la production. Alors que les champs pétrolifères saoudiens s'arrêtent, et que d'autres pays peinent à maintenir leur production au milieu des fermetures et des pénuries de main-d'œuvre, il semble qu'une période de récession soit presque certaine."
 news.121.a: "Oh là là"
 news.121.b: "Ouais, va te faire voir aussi."
 news.122.t: "Kim Jong-Un est mort"
 news.122.d: "Le cher dirigeant de la Corée du Nord est décédé ce matin après avoir subi des complications lors d'une chirurgie. Alors que la nation pleure comme un seul homme, ayant perdu son fils sacré, des troubles ont émergé au sein du cercle intérieur du royaume ermite. Kim Yo-jong, intelligente, ambitieuse et fervente adepte du Juche, a fait le mouvement prévisible pour sécuriser le vide de pouvoir laissé par la mort prématurée de son frère. La machine de propagande nord-coréenne a déjà commencé à l'intégrer dans l'image populaire comme la nouvelle incarnation de la race coréenne, cependant, des comploteurs intrigants et des courtisans avides de pouvoir planifient dans l'ombre pour s'emparer du 'trône rouge'. Parmi ces potentiels usurpateurs, les principaux suspects sont le militaire Pak Jong-chon, chef d'état-major général de l'APC, qui pourrait utiliser la poigne de fer de l'armée nord-coréenne pour s'imposer par la force, et le réformiste Choe Ryon-hae, beau-père de Kim Yo-jong et premier vice-président du Parti des travailleurs de Corée, dont le capital politique immense pourrait suffire à établir une base de pouvoir assez forte pour se cimenter comme le nouveau président de la RPDC. Alors que ces éléments politiques s'affrontent, le sort de l'insaisissable État nord-coréen est en suspens."
 news.122.a: "Comment les Nord-Coréens vont-ils surmonter ça ?"
 news.122.b: "Adieu, cher dirigeant."
