 news.302.t: "Coup d'état à Moscou !"
 news.302.d: "Des nouvelles troublantes en provenance de la capitale russe, Moscou, où la Garde Nationale a suspendu tout gouvernement civil et déclaré l'état d'urgence.\nLe chef de la Garde Nationale, Victor Zolotov, a annoncé dans une diffusion télévisée qu'il avait été contraint d'agir en raison de l'incapacité du gouvernement civil du LDPR à résoudre la crise causée par la mort de Vladimir Jirinovski. Il a promis un retour à une vie normale et à la stabilité une fois la situation critique résolue. Zolotov a conclu son discours par « Gloire à la Russie ! », exhortant tous les citoyens respectueux des lois à continuer leurs activités quotidiennes."
 news.302.a: "Instabilité dans une nation victorieuse ? Vraiment..."
 news.303.t: "Restauration du tsarisme en Russie !"
 news.303.d: ""
 news.303.a: "Ils ont vraiment remonté le temps."
 news.304.t: "Fin du LDPR"
 news.304.d: "Depuis la mort de Vladimir Jirinovski, la popularité du LDPR a chuté, la population ne voyant plus le parti à la hauteur de la sagesse de Jirinovski, mais plutôt comme des parasites et bureaucrates. Avec des débats enflammés en Russie, une autre faction a réussi à surpasser l'opposition en déclin et est devenue le nouveau pouvoir en Russie, l'ancienne administration étant balayée lors de nouvelles purges contre les loyalistes potentiels.\nDésormais, les jours du LDPR sont comptés, peu importe qui est arrivé au sommet, les « libéraux-démocrates » ne retrouveront jamais le siège du pouvoir.\nL'Histoire se souviendra de Vladimir Volfavich Jirinovski seul, tandis que ses camarades de parti ne seront qu'une note de bas de page dans sa biographie."
 news.304.a: "Ils ne pouvaient vraiment pas survivre sans lui."
 news.305.t: "Démission de Vladimir Poutine"
 news.305.d: "La démission de Vladimir Poutine en raison d'une maladie grave causée par le Covid-19 et la nomination de Sergueï Narychkine en tant que leader provisoire marquent un tournant significatif dans la politique russe. Poutine, qui a été au pouvoir pendant plus de deux décennies, a été une figure dominante de la politique russe, et sa démission soulève des questions sur l'avenir du pays.\n\nLa nomination de Narychkine en tant que leader provisoire suggère une transition de pouvoir en douceur au sein du gouvernement russe. Narychkine, un proche allié de Poutine et chef des services de renseignement étrangers, serait en train de planifier des élections anticipées. Cette décision pourrait être perçue comme une tentative de maintenir la stabilité et la continuité dans la politique russe en période d'incertitude.\n\nCependant, il est important d'aborder ces développements avec prudence et de considérer diverses perspectives. Les circonstances entourant la démission de Poutine et la nomination de Narychkine doivent être examinées de manière critique, car des motivations politiques sous-jacentes ou des luttes de pouvoir pourraient être en jeu."
 news.305.a: "Intéressant..."
 news.305.b: "Ça a été un long chemin..."
