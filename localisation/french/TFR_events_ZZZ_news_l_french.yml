news.558.t: "L'Allemagne et la France forment l'Union européenne"
news.559.a: "Le traître de l'Europe"
news.559.b: "Comme Charlemagne l'aurait souhaité"
news.559.c: "L'Europe ne connaîtra jamais la paix"
news.559.d: "La France est, comme on le sait, le pays des Francs, mais avant d'être la France, c'était la Francie. La différence de nom est mince mais dans ce qu'elle signifie, la différence est vaste. L'ancienne Francie, sous l'empereur Charlemagne, comprenait le nord de l'Italie, une grande partie de l'Allemagne, la Catalogne et le Benelux. L'État fut le fondateur du Saint-Empire romain germanique et sa division dans les siècles suivants a conduit aux États modernes que sont la France, l'Allemagne et l'Italie, qui pour la première fois se sont retrouvés ressemblant quelque peu à leurs frontières modernes.\n\nC'est la conviction du mystérieux Lafayette que les Allemands ne sont que des Francs égarés, longtemps séparés par la trahison féodale, pervertis par les Judéens et les Communards pour s'éloigner de Paris. Lafayette a aujourd'hui déclaré la guerre au gouvernement allemand, déclarant que la restauration de la Francie est inévitable et que la défaite ultime de l'Allemagne était pour « son propre bien ». Alors que la France est sous un blackout médiatique total, la rhétorique suggère qu'une victoire française pourrait conduire à une homogénéisation à long terme de la culture allemande sous influence française, ou peut-être à un génocide à grande échelle, l'ampleur et la portée exactes des desseins territoriaux français étant incertaines. La réaction internationale dans les autres nations d'Europe est compréhensiblement alarmée et choquée, les ambassades de France refusant de commenter les demandes étrangères, des rapports en provenance d'Allemagne suggèrent que des progrès dans le Rhin ont déjà été réalisés, que le pacte d'acier aidera ou non Berlin est en suspens à ce stade. Quel que soit le vainqueur, le sort de l'Europe est en balance et peut-être le sort d'un peuple."
news.559.t: "Guerre d'unification franque"
news.560.a: "La France doit cesser"
news.560.b: "L'Allemagne connaîtra notre puissance..."
news.560.c: "L'Europe ne connaîtra jamais la paix"
news.560.d: "Pour ceux qui croyaient que l'amitié et la coopération étroite entre l'Allemagne et la France pourraient être indestructibles après deux guerres sanglantes contre la Russie, la réalité a joué un tour cruel et ironique. Depuis 1945, les pays des deux côtés du Rhin sont une fois de plus entrés en conflit.\n\nLorsque nous regardons en arrière à travers l'histoire, nous voyons que les racines de ce conflit ont peut-être été plantées il y a longtemps. Même en mettant de côté les rancunes historiques entre l'Allemagne et la France, leurs différences politiques ont toujours été difficiles à cacher, depuis l'époque de la Communauté européenne du charbon et de l'acier jusqu'à la Communauté européenne et l'Union européenne. Une série de politiques a conduit l'UE à devenir de plus en plus fragmentée et inefficace, pavant finalement la voie à la tragédie d'aujourd'hui.\n\nMaintenant, les chars Leclerc et Leopard 2 pointent leurs canons l'un vers l'autre ; dans le ciel, les avions Dassault Rafale et Tornado sont engagés dans des combats aériens. Quel que soit le vainqueur, les dégâts et la confiance brisée seront irréparables."
news.560.t: "Troisième guerre européenne"
news.561.a: "Intéressant !"
news.561.d: "Aujourd'hui, la Russie récolte le fruit des réformes qu'elle a entreprises. Le pays tout entier a été plus actif que jamais, la course présidentielle revigorant la société russe. Alors que la transition gouvernementale de Medvedev n'était vue que comme un simple échange de sièges, le résultat final a dépassé la plupart des attentes.\n\nBien que la course ait été acharnée, Russie unie a réussi à remporter une victoire une fois de plus. Pourtant, le parti n'est plus la structure monolithique qu'il était autrefois. Réformé en un parti de centre-droit avec la fusion du LDPR et d'autres partis de droite, il englobe un large éventail d'idées, avec de multiples coalitions à l'intérieur du parti. Certains le comparent à l'ancien parti républicain américain.\n\nLe vainqueur de cette course est Nikolai Patrushev, un ancien ministre de l'agriculture et un proche confident de Dmitri Medvedev. Il reste à voir quelle voie cette présidence prendra pour les observateurs étrangers."
news.561.t: "Dmitry Patrushev remporte les élections"
