 news.242.t: "Poutinisme en Russie !"
 news.242.d: "Bien que la poursuite de la politique de Poutine par Medvedev n'ait surpris personne, certains analystes soulignent un changement notable au sein du gouvernement. De nombreux hauts fonctionnaires et oligarques, de divers niveaux, ont été traduits en justice pour corruption, avec l'État allant jusqu'à saisir leurs actifs étrangers sans procès. Par ailleurs, le culte de la personnalité autour du président semble évoluer.\nPoutine est désormais perçu comme un symbole de "républicanisme russe", une image qui commence à ressembler à celle de Jules César. Le poutinisme n'apparaît plus comme une idée technocrate libérale de préserver leur richesse et leur pouvoir en Russie pour toujours.\nMedvedev a purgé son gouvernement, avec des responsables corrompus "volontairement" cédant leurs possessions après que le FSB ait rendu visite à leurs proches. Ceux qui ont fait leurs preuves ont toutefois conservé une partie de leurs biens. De nombreux postes désormais vacants sont en cours de réattribution, avec un accent mis sur la "jeunesse" pour revitaliser la démocratie autoritaire.\nBien que l'opposition libérale qualifie cela de "nouvelle oprichnina", la majorité des russes soutiennent ces actions. Les élites sont purgées, les siloviks renforcés, et le peuple est plein d'espoir."
 news.242.a: "Qui n'est pas avec nous est contre nous."
 news.242.b: "Sans surprise."
 news.243.t: "Démocratie en Russie !"
 news.243.d: "Il semble que Medvedev ait conservé ses idéaux libéraux depuis 2008. La sphère politique russe a subi un changement drastique, avec la plupart des partis politiques russes fusionnant et se réorganisant, formant un système tripartite.\nLe PCFR, une Russie Juste et les socialistes se sont réunis pour former le parti Russie du Peuple, tandis que le parti Nouveau Peuple a évolué en Nouveau Parti de Russie, absorbant des membres du parti Iabloko. Russie Unie reste le parti de Medvedev, bien qu'il ait été restructuré pour pencher vers le centre-droit, avec plusieurs de ses membres rejoignant les deux autres partis.\nCertains pourraient y voir un simple jeu de chaises, mais il semble que ces trois partis soient réellement en compétition pour les prochaines élections. À noter également les nombreux sous-groupes au sein de ces partis, qui tentent déjà de séduire les électeurs.\nDe nombreux russes voient dans ce changement un espoir. La démocratie ne sera plus associée à l'affaiblissement et au déshonneur du peuple par des privatisations ou en léchant les bottes américaines. L'expérience démocratique russe ne s'inclinera devant personne, ni de l'intérieur, ni de l'extérieur."
 news.243.a: "L'Aigle bicéphale s'est vu attribuer un nouveau rôle."
 news.243.b: "Les vents du changement commencent à souffler"
 news.245.t: "Nouvelle constitution en Russie !"
 news.245.d: "Bien que la plupart des analystes ne soient pas surpris de la poursuite par Medvedev de la politique de Poutine, il semble que le système politique ait été modifié.\n\nLes partis politiques ont essentiellement été unis en une seule coalition sous l'égide du "Front National Uni", une organisation créée par Poutine en 2011 pour connecter les partis au peuple, du moins en théorie, dans un réseau unifié pour renforcer le système. Medvedev semble avoir transformé l'organisation en une coalition unifiée de partis, excluant les partis anti-État tels que Yabloko.\n\nBien que le "Front Uni" soit essentiellement un bloc unique basé sur la préservation de la Russie et de ses valeurs, les partis qui le composent ont leurs propres programmes divergents, tels que les propositions de réforme de l'économie planifiée du PCFR ou les propositions anti-immigrants et étatistes du LDPR. Le parti Russie Unie agit comme la majorité neutre, choisissant entre les propositions des partis mineurs et n'intervenant que lorsque cela est nécessaire.\n\nPendant ce temps, Poutine a été consacré comme "Le Père de la Démocratie Russe", avec des statues et des œuvres d'art de l'ex-président devenant une vue commune dans le paysage russe. Ses erreurs passées sont oubliées, et son image frôle l'idéalisme de la campagne électorale de Boris Eltsine pour la RSFSR. Un vrai démocrate fort au service du peuple russe, non soumis au contrôle occidental.\n\nLa société semble également avoir connu des changements positifs. La branche civile du Front Uni a été intégrée dans l'État et est désormais utilisée pour arrêter des bureaucrates corrompus de différentes administrations. Bien qu'il y ait eu quelques difficultés à cet égard, avec certains politiciens échappant à l'arrestation, le discours public devient en effet plus pertinent dans la politique.\n\nQuoi qu'il en soit, la Russie avance vers l'avenir de la même manière qu'il y a 20 ans, avec le tricolore flottant fièrement."
 news.245.a: "Gloire à la Russie !"
 news.245.b: "Sans surprise."
