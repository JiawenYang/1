news.175.a: "Au moins, c'est terminé..."
news.220.b: "Les dominos tombent les uns après les autres"
news.221.b: "Un de plus mord la poussière"
news.222.b: "Même le Danemark ?"
news.228.b: "La marée tourne..."
news.415.a.1: "L'un se dressera, l'autre tombera..."
news.415.d.1: "Alors que le monde évaluait encore si les tensions dans la région Asie-Pacifique allaient s'intensifier, la République populaire de Chine a lancé une opération militaire de grande envergure à l'aube, frappant de multiples cibles au Japon, en Inde et dans d'autres États membres de l'OTDP.\n\nLes renseignements en provenance d'Australie indiquent que l'Armée populaire de libération a massé des forces autour de Taïwan, la mer de Chine orientale et la mer de Chine méridionale étant passées sous verrouillage de guerre. Les flottes de l'APL et les unités de frappe à longue portée ont bloqué les principales routes maritimes et mené des frappes de précision sur plusieurs cibles à l'intérieur de l'île.\n\nSuite au déclenchement complet des hostilités, la Chine a déclaré son intention de « nettoyer à fond le siècle d'humiliation aux mains des puissances impérialistes », et a juré de mettre fin aux vestiges de l'ancien ordre par la victoire. Les analystes s'accordent largement à dire que cela pourrait devenir l'une des guerres régionales les plus dévastatrices du XXIe siècle, impliquant plus de trois milliards de personnes, s'étendant sur trois océans, et - avec l'éventuelle utilisation d'armes de destruction massive - les pertes humaines et le coût économique pourraient être incalculables."
news.415.t.1: "La Chine lance une opération militaire de grande envergure"
news.423.a: "Dans le silence, qui écoute encore sur la fréquence ?"
news.423.d: "Selon les données confirmées par les radars d'alerte précoce côtiers en mer de Chine orientale et plusieurs constellations satellitaires synchronisées, de multiples localités à travers la Corée du Sud ont subi des frappes nucléaires, la région métropolitaine de Séoul étant la plus durement touchée. Les évaluations préliminaires indiquent qu'au moins 18 ogives nucléaires à portée intermédiaire ont impacté les zones urbaines centrales. Suite à la détonation d'ogives tactiques à fission, un engin - supposé être une bombe à hydrogène à haut rendement et à étages multiples - a explosé à environ 500 mètres au-dessus du centre-ville de Séoul, libérant une force explosive dépassant les 2 mégatonnes d'équivalent TNT, devenant le point focal de cette attaque catastrophique.\n\nLes transmissions d'images confirment que le boule de feu de la bombe à hydrogène a atteint un diamètre de plus d'un kilomètre, avec des températures au sol dépassant les 3 000 °C. Les bâtiments des deux côtés du fleuve Han ont été rasés par la chaleur intense et les ondes de choc. Des monuments emblématiques tels que la Maison Bleue, le bâtiment de l'Assemblée nationale, le marché Gwangjang et la gare de Séoul apparaissent « vaporisés » sur les images satellitaires - la structure physique de la ville est efficacement remise à zéro. L'impulsion électromagnétique a paralysé les réseaux de communication et d'énergie sur toute la péninsule coréenne. Des nuages de poussière radioactive dérivent désormais à travers la frontière de la péninsule avec le vent du nord-ouest.\n\nD'un point de vue militaire, cette frappe a détruit le noyau de l'infrastructure de défense profonde alliée en Asie du Nord-Est et gravement endommagé les systèmes de commandement, contrôle, communications, informatique et renseignement (C4I). La chaîne de commandement alliée en Corée a été brièvement rompue ; des protocoles d'urgence ont été déclenchés, mais des signes de rupture de la coordination régionale sont apparus. Si la situation continue de se détériorer, la posture stratégique des forces alliées pourrait faire face à un effondrement structurel en cascade."
news.423.t: "La Corée du Sud subit une frappe thermonucléaire"
news.424.a: "Reste-t-il des balises dans le Pacifique ?"
news.424.d: "Les données du système de surveillance orbital du Pacifique Sud et les signaux résiduels des stations radar désaffectées sur le continent australien confirment que plusieurs régions d'Australie ont subi une attaque nucléaire. Notamment, la capitale, Canberra, a été touchée par une frappe hybride tactico-stratégique de haute intensité. Les évaluations préliminaires indiquent qu'au moins six ogives nucléaires tactiques ont ciblé des secteurs gouvernementaux clés, incluant la colline du Parlement, le ministère de la Défense, le bureau du Premier ministre et l'appareil judiciaire. Entre ces explosions, un engin thermonucléaire à haut rendement - supposé être une bombe à hydrogène à étages multiples - a explosé à environ 600 mètres au-dessus du lac Burley Griffin, libérant une puissance estimée à 1,2 mégatonne de TNT.\n\nLes cartes thermiques orbitales et les images au niveau du sol révèlent une zone de vaporisation centrale avec un rayon de 8 kilomètres, effaçant des monuments tels que le Parlement, la Cour fédérale, la Bibliothèque nationale et les institutions fédérales environnantes. L'onde de choc résultante a rasé les districts suburbains, tandis que les retombées radioactives dérivent désormais vers l'est en direction de Sydney, portées par les vents d'ouest dominants.\n\nStratégiquement, la frappe a éliminé le centre de commandement et de communications de l'hémisphère sud pour l'Alliance du Pacifique. Le commandement allié a connu une brève paralysie ; le quartier général des Forces de défense australiennes est passé en mode de contrôle automatique, et la base de coordination temporaire de Darwin a été élevée au statut de nœud opérationnel principal. Les simulations au sein de l'alliance suggèrent une période prochaine d'inertie stratégique à travers l'Indo-Pacifique, alors que le vide de pouvoir dans le Pacifique Sud s'étend rapidement."
news.424.t: "L'Australie subit une frappe thermonucléaire"
news.425.a: "La brume matinale sur le Gange ne peut dissimuler le froid soudain dans l'air."
news.425.d: "De multiples plateformes de surveillance militaire au-dessus de l'océan Indien nord ont confirmé une série de frappes nucléaires observables à travers l'Inde, New Delhi subissant un assaut composé sans précédent. L'analyse tactique préliminaire indique que douze ogives nucléaires tactiques ont frappé séquentiellement des zones administratives clés, des regroupements de commandement militaire et des nœuds de communication critiques. Ceci a été suivi par l'explosion aérienne d'une bombe à hydrogène à haut rendement à environ 600 mètres au-dessus de la rivière Yamuna, juste à l'est du palais présidentiel. La détonation a généré un boule de feu de plus de 1,2 kilomètre de large, les ondes thermiques et de pression engloutissant le cœur de la capitale en 30 secondes.\n\nL'imagerie thermique orbitale confirme que le palais présidentiel, le Parlement, la Porte de l'Inde, Connaught Place et le secteur de commandement militaire du sud de Delhi ont été complètement vaporisés par la chaleur extrême. Les structures au sol ont été oblitérées, avec un effondrement généralisé et une perturbation significative des infrastructures souterraines. L'onde de choc a balayé la zone métropolitaine, et une impulsion électromagnétique a coupé les liens de communication militaires et civils entre Delhi et le reste du pays. Un nuage de radiation se répand maintenant rapidement en amont le long du Gange, posant des risques de catastrophe secondaire pour les zones densément peuplées.\n\nStratégiquement, la frappe a gravement perturbé la chaîne de commandement de l'Asie du Sud. Le réseau de liaison de l'Alliance du Pacifique dans la région est resté silencieux pendant plus d'une heure. Les forces stratégiques stationnées le long du bassin du Gange ont été forcées en statut d'alerte secondaire. De multiples batteries de roquettes à longue portée au nord du sous-continent n'ont pas répondu aux protocoles de signal, plongeant l'ouest de l'Indo-Pacifique dans un désarroi soudain. Les évaluations du renseignement suggèrent que cela pourrait faire partie d'une campagne plus large de suppression nucléaire stratégique - conçue pour induire un vide politique et de défense à grande échelle."
news.425.t: "L'Inde frappée par une attaque thermonucléaire"
