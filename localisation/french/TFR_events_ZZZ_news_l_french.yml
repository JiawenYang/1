 news.128.a: "Tant mieux pour eux"
 news.128.b: "Allah Akbar !"
 news.129.t: "Vladimir Poutine est mort"
 news.129.d: "Absent des projecteurs depuis son diagnostic du virus Covid-19, les nouvelles d'État russes ont maintenu le récit que Poutine était en excellente forme et en voie de guérison. Cependant, ce matin, ces espoirs ont été anéantis, le Kremlin annonçant que Poutine, l'architecte de la Russie moderne, avait succombé à la maladie, décédant à 4h36 heure de Moscou.\n\nLa nouvelle s'est répandue comme une traînée de poudre, les russes à travers la Fédération offrant leurs condoléances au défunt leader, qui, bien que largement considéré comme un despote autocrate en Occident, était vénéré par une grande partie des russes à une position presque divine, une semaine de deuil national sanctionnée par l'État ayant été annoncée, Medvedev déclarant la mort de son mentor et ami de longue date comme 'm'ayant poignardé en plein cœur comme un poignard, comme tout Russe avec une âme le ressentirait'.\n\nAlors que beaucoup pleurent à travers la Fédération, l'incertitude l'a également saisie ; bien que Medvedev soit prêt à succéder à Poutine, il reste à voir si Russie unie, avec son histoire de truquage du processus électoral en sa faveur, peut rester le parti dominant qu'il a été sans son parrain chéri à la tête, beaucoup soupçonnant qu'ils perdront à la prochaine élection présidentielle."
 news.129.a: "Développement intéressant..."
 news.129.b: "Repose en paix, camarade."
 news.130.t: "Déclaration de l'État eurasien"
 news.130.d: "Après avoir sécurisé le contrôle et restauré l'ordre à travers la Russie, Aleksandr Douguine a tenu un discours déclarant l'État eurasien avec l'ambition d'étendre bientôt ses frontières. Des manifestants sont inévitablement arrivés au discours, les partisans du Parti eurasien se sont affrontés dans une bagarre à trois avec la police qui s'est également jointe. 30 morts ont été signalés et des centaines d'autres blessés."
 news.130.a: "Un début sanglant."
 news.130.b: "Un nouveau jour férié national !"
 news.131.t: "Accord de paix américano-taliban"
 news.131.d: "Après 18 longs mois, le représentant spécial des États-Unis Zalmay Khalilzad et le chef du groupe islamiste militant, Mollah Abdul Ghani Baradar, ont signé l'accord historique samedi à Doha, au Qatar, où les deux parties ont passé des mois à en peaufiner les détails.\nSous les termes convenus, les États-Unis se sont engagés à retirer toutes leurs forces militaires et leur personnel civil de soutien, ainsi que ceux de leurs alliés, dans un délai de 7 mois. Le processus de réduction commencera par la diminution des niveaux de troupes américaines à 5 000 dans les 100 premiers jours et le retrait de leurs forces de cinq bases, le reste des forces partant dans les mois suivants. Le gouvernement afghan libérera également jusqu'à 5 000 prisonniers talibans en geste de bonne volonté, en échange de 1 000 membres des forces de sécurité afghanes détenus par les talibans. Les talibans ont accepté de mettre fin à leur soutien à des groupes tels qu'Al-Qaïda et l'EI. Cependant, beaucoup doutent que les talibans puissent respecter leur part de l'accord en raison des liens historiques entre les groupes.\nPlus de 2 400 Américains sont morts en Afghanistan durant près de 18 ans de combats, à un coût estimé pour le Trésor américain de près de 1 000 milliards de dollars. Ces dernières années, malgré l'augmentation des niveaux de troupes, les talibans ont combattu les forces américaines et afghanes dans ce que les analystes ont appelé un état de stagnation stratégique.\n\nLe gouvernement afghan commencera également des négociations avec les talibans pour élaborer un règlement politique qui établirait le rôle des talibans dans un futur Afghanistan. Ces négociations devraient débuter le mois prochain. L'une des premières tâches de ces pourparlers intra-afghans sera d'obtenir un cessez-le-feu durable en Afghanistan."
 news.131.a: "Tant mieux pour eux"
 news.131.b: "La paix, enfin !"
 news.131.c: "Ils auraient dû apprendre de notre erreur..."
 news.132.t: "La police de New York reprend le contrôle de la ville"
 news.132.d: "Le Département de police de New York a confirmé qu'il a repris le contrôle total de la ville de New York. Le gouvernement de la ville, qui était sous l'administration du Parti communiste des États-Unis, a été renversé pratiquement du jour au lendemain. Des dizaines de membres du parti communiste ont été trouvés morts dans leurs maisons sur une période de 3 semaines, entraînant un effondrement de la communication efficace avec le parti général et les forces de milice. La police est rapidement revenue dans la ville et a commencé à arrêter des milliers de miliciens communistes et à occuper des bâtiments clés dans la ville. Des rumeurs se sont rapidement répandues sur l'implication de familles mafieuses locales à New York, les dirigeants du parti communiste ayant été transportés à travers la ville vers des zones non divulguées, et le sort de Joe Sims, désormais ancien secrétaire général du Parti communiste des États-Unis, est inconnu. Il est présumé mort avec tous les membres de haut rang du parti."
 news.132.a: "On dirait qu'ils étaient mauvais pour les affaires..."
 news.132.b: "Un revers pour la révolution."
 news.133.t: "Donald Trump victorieux dans la guerre civile américaine"
 news.133.d: "Aujourd'hui, dans le jardin des roses de la Maison Blanche, Donald Trump a annoncé à toute l'Amérique la capitulation des forces restantes opposées à sa présidence. Ayant prêté serment comme président lors de cette annonce, le discours d'investiture du président Trump n'a guère apaisé les tensions qui infestent encore la psyché américaine. Entouré de ses plus proches conseillers et du haut commandement militaire, le président a annoncé à l'Amérique et au monde que 'aujourd'hui, après une bataille longue et éprouvante, la démocratie a une fois de plus triomphé. Les voyous insensés d'Antifa et diverses autres factions radicales de gauche ont tenté de voler cette élection. Cependant, ils ont heureusement échoué. Je remercie les courageux gouverneurs d'État d'avoir défendu la Constitution et tous les citoyens américains de s'être armés contre cette menace et d'avoir défendu la démocratie. Mon administration légitime a maintenant commencé à travailler pour s'assurer que l'Amérique ne sera plus jamais divisée, que Dieu nous bénisse tous. Que Dieu bénisse l'Amérique.'\n\nAvec le président Trump désormais concentré sur la reconstruction de son pays fracturé, la communauté internationale regarde une Amérique affaiblie et voit que, pour la première fois en près d'un siècle, les États-Unis ne sont plus l'hégémonie mondiale sur la scène internationale, amenant beaucoup à se demander qui sera son successeur."
 news.133.a: "Une fin de folie."
 news.133.b: "Plus jamais ils ne feront de mal à l'Amérique" 
 news.133.a: "Une fin à la folie."
 news.133.b: "Plus jamais ils ne nuiront à l'Amérique."
 news.134.t: "L'Union victorieuse dans la deuxième guerre civile américaine"
 news.134.d: "« Dans la beauté des lys, le Christ est né au-delà de la mer. Avec une gloire dans son cœur qui nous transfigure, toi et moi. Comme il est mort pour rendre les hommes saints, mourons pour les rendre libres, tandis que Dieu marche à nos côtés. » Ce sont les mots chantés à travers l'Amérique aujourd'hui, alors que les coups fatals contre les échelons traîtres à travers le pays ont enfin succombé à la lutte de libération, celle d'une Amérique véritablement libre. Le président Joseph Robinette Biden Jr, autrefois douté alors qu'il prenait les rênes d'une Amérique malade et blessée, considéré comme une simple figure de proue ou un homme de pure division, a prouvé que tous ceux qui avaient mal jugé ses efforts avaient tort, car il a réunifié la nation de ses propres mains, contenant la douleur et le chagrin qui liaient tous les Américains, pourtant il a compris jusqu'au jour où l'unification a répandu sa grâce sur la nation. Aujourd'hui, comme Lincoln ou Roosevelt, il a reçu le devoir de véritablement remodeler et transformer l'Amérique en une machine de gloire, désormais libérée du poison de la peur et de la haine dans son image."
 news.134.a: "Un nouveau visage entre à la Maison Blanche."
 news.134.b: "Nous garderons la foi et avancerons comme un seul homme."
 news.135.t: "Gloria La Riva victorieuse dans la guerre civile américaine"
 news.135.d: "Alors que l'ancienne capitale des États-Unis continuait de brûler des derniers jours de la guerre civile, Gloria La Riva et ses 'camarades' ont avancé vers la Maison Blanche pour la trouver détruite, le drapeau américain emblématique du bâtiment réduit en cendres. Alors que sa Garde rouge commençait à se rassembler devant la Maison Blanche dévastée, la nouvelle Première ministre d'Amérique a prononcé son premier discours à ses fidèles partisans. 'Camarades, aujourd'hui marque la fin de la révolution prolétarienne en Amérique ! Les forces fascistes et capitalistes décadentes de Donald Trump et Joseph Biden ont été détruites et leur héritage terni. Je remercie nos camarades à travers l'Amérique d'avoir aidé dans la lutte contre le fascisme partout où il se trouvait. Cependant, maintenant est le temps de l'unité, le temps de surmonter les maux de Donald Trump et du capitalisme, le temps de réparer notre nation fracturée et de construire une Amérique qui fonctionne pour tous.' Avec la victoire de la Première ministre dans cette guerre, l'Amérique va maintenant commencer à restructurer ses diverses institutions démocratiques, les remplaçant par une nouvelle Amérique socialiste qui vise à s'attaquer aux diverses injustices qui ont plague l'Amérique depuis sa création il y a trois siècles. Cependant, avec le contrôle total de La Riva sur l'Amérique, beaucoup se demandent si cela marque le début d'une Amérique égalitaire ou le commencement d'une descente vers le totalitarisme."
 news.135.a: "Un résultat préoccupant pour l'Amérique."
 news.135.b: "Solidarité pour toujours !"
 news.137.t: "La présidence d'Hillary Clinton"
 news.137.d: ""
 news.137.a: "Une femme à la Maison Blanche..."
 news.138.t: "Le troisième mandat"
 news.138.d: ""
 news.138.a: "La fin d'une ère..."
 news.139.t: "La RPC envahit Taïwan"
 news.139.d: "La quatrième crise du détroit de Taïwan a dégénéré en un conflit total entre la République populaire de Chine et la République de Chine sur l'île de Taïwan, relançant la guerre civile chinoise qui s'était terminée par l'exil du Kuomintang à travers le détroit de Taïwan. Des centaines de jets ont commencé à survoler l'île, engaging des combats aériens pendant que l'ensemble de la marine chinoise s'est mobilisé, avec des rapports des premiers débarquements sur les côtes de Taïwan, les îles Lienchiang, et des engagements navals immédiats entre les marines de la RPC et de la ROC. L'Armée de la République de Chine (ROCA) est entrée en pleine mobilisation tandis que la loi martiale a été déclarée sur l'ensemble de Taïwan, les dernières forces de l'ancienne République de Chine se préparant à survivre contre le colosse du PCC, des observations de navires de débarquement chinois traversant déjà le détroit vers Taïwan ayant été signalées par les garde-côtes."
 news.139.a: "Un affrontement final"
 news.140.t: "Escarmouches au Haut-Karabagh"
 news.140.d: "Aujourd'hui, une série de heurts de haute intensité, inédits depuis 2016, ont débuté au Haut-Karabagh suite à une offensive militaire azerbaïdjanaise le long de la ligne de contact établie en 1991, voyant la capture de Fuzuli et de plusieurs villes frontalières. Cette offensive a impliqué l'utilisation de formations blindées, ainsi que de drones fournis à l'Azerbaïdjan par des marchands d'armes turcs et israéliens. Déjà, l'Arménie a envoyé un appel aux Nations Unies et à l'Organisation du Traité de sécurité collective, bien que leurs plaidoyers n'aient pas été entendus par Moscou, les laissant se débrouiller seuls. Stepanakert, la capitale de la République d'Artsakh, un État séparatiste non reconnu établi en 1988 pendant la première guerre du Haut-Karabagh, a été la cible de bombardements et d'attaques de drones azéris. Des mercenaires syriens sont également arrivés pour aider l'Azerbaïdjan, principalement de la Division Hamza pro-turque originaire du nord-est.\n\nBien que largement ignoré par la plupart des médias occidentaux, un autre conflit entre ces deux pays couve depuis la fin de la première guerre du Haut-Karabagh, qui s'était terminée par une victoire arménienne et l'établissement de la République d'Artsakh par la diaspora arménienne dans la région. Il est probable que l'Azerbaïdjan sorte victorieux, grâce à la modernisation et à la reformation de ses forces armées avec des systèmes d'armes israéliens et turcs, tels que le drone Bayraktar UCAV, et des conseillers militaires."
 news.140.a: "Priez pour une résolution pacifique"
 news.141.t: "Manifestations pro-démocratie secouent la Russie"
 news.141.d: "Le bouleversement secoue la Russie aujourd'hui alors qu'un grand nombre de manifestations ont frappé les grandes villes russes, y compris la capitale, Moscou. Menées par l'activiste anti-corruption Alexeï Navalny, les manifestations réunifient une coalition de réformateurs libéraux, d'étudiants, de professionnels urbains et d'autres qui se sont unis en opposition à l'administration Poutine. Les activistes réclament une plus grande transparence gouvernementale, une lutte renouvelée contre la corruption, une réduction de la brutalité policière et des réformes démocratiques libérales connexes. Les forces de l'ordre russes ont répondu à leur manière habituelle avec de nombreuses arrestations et l'usage de la force contre les manifestants. Aucun commentaire majeur n'a été donné par le Kremlin ou d'autres institutions étatiques, hormis quelques représentants à la Douma qui ont condamné les manifestations comme étant 'soutenues par les services de renseignement occidentaux et autres traîtres'.\n\nLes responsables de l'OTAN et des États-Unis ont officiellement dénoncé la réponse du gouvernement russe comme répressive et violemment autocratique. De nombreux analystes en Occident ont exprimé leur optimisme quant aux efforts continus des activistes pro-démocratie en Russie, mais beaucoup soulignent la consolidation du pouvoir que Poutine, son parti et les forces de sécurité ont sur l'État russe, rendant un changement significatif presque impossible."
 news.141.a: "Intéressant"
 news.142.t: "Attaques islamistes en France et en Autriche"
 news.142.d: "L'Europe occidentale pleure aujourd'hui alors que des terroristes islamistes ont frappé les grandes villes de France et d'Autriche. Au cours des dernières vingt-quatre heures, la police métropolitaine de Paris, Marseille, Lyon et Vienne a signalé plusieurs attentats à la bombe dans des lieux centraux importants. Les forces de l'ordre françaises et autrichiennes estiment que les victimes se comptent par centaines, marquant les attaques d'hier comme parmi les plus meurtrières de l'histoire moderne de l'Europe. Les enquêtes à grande échelle en cours sur les auteurs ont révélé qu'il s'agit d'immigrants arabes récents qui ont soit été radicalisés par des groupes terroristes opérant au Moyen-Orient, soit directement recrutés pour l'opération par de telles organisations.\n\nDivers groupes terroristes islamistes, émergés du chaos de la crise en Arabie saoudite, ont revendiqué la responsabilité, citant l'implication occidentale au Moyen-Orient comme principal motivateur. Les services de renseignement de l'OTAN avertissent le public de nombreux pays d'Europe occidentale que la menace terroriste reste extrêmement élevée et que les gens doivent immédiatement être vigilants et signaler tout comportement suspect. Avec le désespoir public, la France et l'Autriche ont annoncé qu'elles agiraient rapidement pour traduire en justice les groupes responsables."
 news.142.a: "La terreur saisit l'Europe une fois de plus."
 news.143.t: "Maia Sandu élue présidente de la Moldavie"
 news.143.d: "Maia Sandu, du bloc électoral pro-UE ACUM entre le Parti de l'action et de la solidarité (PAS) et le Parti de la dignité et de la vérité (PPDA), a été élue présidente de la Moldavie. Le résultat de l'élection a choqué beaucoup dans ce qui est considéré comme le pays le plus pauvre d'Europe, Sandu promettant une campagne anti-corruption vigoureuse, une meilleure qualité de vie et un alignement plus étroit avec l'Occident et l'intégration à l'UE. Ces résultats ont également porté un coup dur à Moscou, qui avait étendu son influence en Moldavie avec le précédent président pro-russe Igor Dodon, et beaucoup attendent de voir quelle sera la prochaine étape de Moscou après qu'il commencera à perdre son influence en Moldavie."
 news.143.a: "Un nouveau cap pour la Moldavie"
 news.144.t: "Igor Dodon réélu président de la Moldavie"
 news.144.d: "Igor Dodon, du Parti des socialistes de la République de Moldavie (PSRM), a été réélu président de la Moldavie. Élu précédemment en 2016, Igor Dodon avait orienté le pays vers un plus grand alignement avec l'Est, et notamment la Russie. Dodon envisage maintenant des relations encore plus étroites avec la Fédération de Russie, une position ferme contre l'Union européenne, et la promotion du nationalisme moldave ainsi que des politiques populistes de gauche. De nombreux experts étrangers ont prédit que la réélection d'Igor Dodon pourrait marquer la fin de l'influence occidentale en Moldavie et le renforcement de l'emprise de Moscou sur le pays, rendant l'avenir de la Moldavie incertain."
 news.144.a: "La Moldavie retombe dans l'emprise de Moscou une fois de plus..."
 news.145.t: "Dévastation saharienne !"
 news.145.d: "."
 news.145.a: "Que Dieu nous aide tous..."
 news.146.t: "Pluies record dans le Sahara"
 news.146.d: "."
 news.146.a: "Merveilleuses nouvelles !"
 news.147.t: "Guerre pour le lac Tchad"
 news.147.d: "."
 news.147.a: "Mon Dieu..."
 news.148.t: "Sècheresse égyptienne"
 news.148.d: "Les signes d'une sécheresse qui s'aggrave ont atteint leur apogée alors que les efforts éthiopiens pour endiguer le Nil ont créé l'une des pires crises humanitaires observées en Afrique du Nord au cours du dernier siècle. La pénurie d'eau est devenue une réalité en Égypte, une nation qui importe déjà la majorité de sa nourriture.\n\nLe gouvernement égyptien blâme l'Éthiopie pour leur situation, et le peuple semble partager cette conviction alors que des manifestations anti-éthiopiennes ont envahi les rues, les appels à une guerre ouverte pour détruire le barrage du Nil se faisant plus forts que jamais maintenant que ses effets secondaires sont présents.\n\nSi l'aide internationale n'est pas suffisante, l'Égypte pourrait perdre des millions de personnes à cause de la soif au cours de la prochaine décennie, provoquant ce qui pourrait être la pire catastrophe humaine en Afrique depuis le génocide rwandais."
 news.148.a: "La tempête arrive..."
 news.149.t: "Troisième guerre africaine"
 news.149.d: "Le président égyptien a déclaré la guerre à l'Éthiopie aujourd'hui, en réponse à la crise de l'eau croissante causée par le Grand Barrage de la Renaissance éthiopienne (GERD). Les tensions entre les deux nations ont explosé ces dernières semaines, alors que l'achèvement du barrage a considérablement réduit le débit d'eau du Nil vers l'Égypte.\n\nLe président al-Sissi a annoncé la décision dans une allocution télévisée à la nation, déclarant que la survie de l'Égypte est en jeu et que les efforts diplomatiques ont échoué à résoudre le différend. Le gouvernement éthiopien n'a pas encore répondu à la déclaration. Le conflit autour du barrage de 4,6 milliards de dollars couve depuis des années, l'Égypte et le Soudan craignant que le projet ne réduise leur part des eaux du Nil. Le Nil est la principale source d'eau pour l'agriculture et la consommation dans les deux pays, où des millions dépendent du fleuve pour survivre. L'Éthiopie, en revanche, considère le barrage comme une étape cruciale vers le développement économique et l'indépendance énergétique. Les négociations entre l'Égypte, le Soudan et l'Éthiopie ont à plusieurs reprises échoué, malgré de multiples tentatives de médiation par la communauté internationale. Les analystes ont averti que la guerre de l'eau pourrait déstabiliser toute la région, les destins des trois pays étant intimement liés au Nil."
 news.149.a: "Les pays se battent maintenant pour l'eau..."
 news.150.t: "Ouverture du barrage de la Renaissance"
 news.150.d: "."
 news.150.a: "Intéressant."
 news.151.t: "Conférence de la Renaissance égyptienne réussie"
 news.151.d: "."
 news.151.a: "Intéressant."
 news.152.t: "Manifestations majeures à Riyad"
 news.152.d: "Aujourd'hui, les rues de Riyad ont éclaté dans le chaos alors que les citoyens sont descendus dans la rue en masse pour protester suite au retour de l'activiste exilé Yahya Assiri et à l'effondrement de l'économie saoudienne. Le retour d'Assiri, un critique éminent du gouvernement saoudien connu pour son plaidoyer en faveur des droits humains, des réformes politiques et sa critique de ce qu'il décrit comme une 'dictature royale', a incité des milliers de citoyens à manifester contre le gouvernement de Mohammed ben Salmane. L'effondrement du pétro-dollar a également influencé ces protestations, envoyant des ondes de choc à travers l'économie saoudienne, provoquant une inflation galopante et une chute du Riyal.\n\nOfficiellement, Mohammed ben Salmane n'a émis aucune déclaration sur les émeutes, bien que les forces de l'ordre saoudiennes aient reçu l'ordre de lancer une répression musclée sur les manifestations avec 'une autorité et une force significatives', entraînant la mort de 4 personnes. D'autres rapports sur des arrestations, des détentions et des affrontements violents entre manifestants et forces de sécurité ont émergé. Cela n'a fait qu'attiser la tension politique, Assiri prononçant un discours aux manifestants, les appelant à 'agir' pour la justice économique, la réforme politique et la fin de la corruption gouvernementale. Il n'est pas encore clair comment ben Salmane répondra officiellement, et cela intervient seulement un mois après son couronnement comme roi suite à la mort de son père. Déjà, des organisations de droits humains et humanitaires ont dénoncé les répressions, Yahya Assiri ayant été invité à s'exprimer sur le sujet par Radio Free Asia."
 news.152.a: "Intéressant..."
 news.153.t: "Yahya Assiri déclare un désastre humanitaire"
 news.153.d: "."
 news.153.a: "Que Dieu aide le peuple d'Arabie saoudite."
 news.154.t: "Al-Shabaab s'empare de Mogadiscio !"
 news.154.d: "."
 news.154.a: "Que Dieu aide le peuple de Somalie."
 news.155.t: "L'APL débarque à Okinawa !"
 news.155.d: "Récemment, l'Armée populaire de libération a organisé une opération de débarquement pour occuper Okinawa. Avec des efforts coordonnés de l'armée, de la marine et de l'aviation, ils ont finalement pris le contrôle total de la région.\n\nLa capture d'Okinawa signifie l'échec de la stratégie de l'Organisation du Traité de Défense du Pacifique (PDTO) pour bloquer la puissance maritime chinoise à travers la stratégie de la 'chaîne d'îles'. Cette victoire n'est pas seulement un succès militaire contre le PDTO, mais elle revêt également une signification historique extraordinaire pour la Chine. Sans aucun doute, la capture d'Okinawa inspirera grandement les militaires et les civils chinois, offrant un meilleur soutien à la guerre globale de la Chine contre le PDTO.\n\nLe PDTO doit réévaluer sa stratégie de guerre et ajuster son déploiement stratégique dans les circonstances actuelles, accumulant suffisamment de ressources pour faire face aux batailles à venir."
 news.155.a: "La bête libérée."
 news.156.t: "Les forces de l'EADI débarquent en Australie"
 news.156.d: "Avec les forces alliées subissant des défaites en Asie du Sud-Est, les troupes de l'EADI ont commencé à assaillir l'Australie, la principale base arrière des Alliés, et ont réussi à y débarquer.\n\nL'EADI a sécurisé plusieurs têtes de pont en Australie. Qu'elles lancent ou non une offensive finale, elles ont déjà sérieusement menacé la principale base arrière du PDTO. Les forces du PDTO font face à un chaos interne sévère. Si elles ne peuvent pas éliminer la présence militaire de l'EADI, ce chaos pourrait conduire à l'échec complet de la campagne du PDTO en Australie.\n\nLes forces du PDTO sont maintenant à un tournant critique. Si elles ne peuvent pas sécuriser l'Australie, elles seront incapables de mener une confrontation militaire globale avec l'EADI et devront retirer leurs forces restantes de la région Pacifique."
 news.156.a: "La bataille finale."
 news.157.t: "Les forces de la coalition sécurisent Hong Kong"
 news.157.d: "Dans une démonstration stupéfiante de coordination militaire, les pays du PDTO ont réussi à capturer la ville stratégique de Hong Kong au milieu de l'invasion chinoise en cours de Taïwan. Cette manœuvre audacieuse sécurise non seulement un port vital pour la coalition, mais porte également un coup significatif aux ambitions chinoises dans la région.\n\nAlors que les tensions s'intensifiaient suite à la posture agressive du gouvernement chinois envers Taïwan, le Japon et l'Australie ont rapidement promis leur soutien au gouvernement taïwanais. Utilisant leur supériorité navale et leur puissance aérienne, les forces de la coalition ont lancé un assaut amphibie surprise, prenant les défenseurs chinois au dépourvu.\n\nLes rapports indiquent que la ville est maintenant sous une administration conjointe, les forces taïwanaises prenant la tête de la gouvernance, soutenues par des conseillers militaires australiens et japonais.\n\nEn réponse, le gouvernement chinois a condamné les actions de la coalition comme un acte d'agression, jurant de reprendre le territoire et d'intensifier ses efforts militaires à Taïwan. La communauté internationale observe de près alors que ce conflit menace de redéfinir les dynamiques de pouvoir en Asie de l'Est."
 news.157.a: "Le conflit s'intensifie."
 news.158.t: "Manifestations nationales aux États-Unis"
 news.158.d: "Suite à la mort tragique de Quinton Evans, un Afro-Américain décédé en garde à vue, des manifestations ont éclaté à travers la nation. Les circonstances entourant sa mort restent floues, mais des images vidéo montrent un officier agenouillé sur son cou alors qu'il lutte pour respirer. Les manifestations ont été comparées à des événements historiques comme les émeutes de Los Angeles, avec des centaines de milliers de personnes descendant dans les rues pour exiger justice. Des rapports d'escalade à Minneapolis, où le pillage d'entreprises grandes et petites a eu lieu dans des zones où le département de police a perdu le contrôle face au nombre écrasant de manifestants impliqués.\n\nLes activistes politiques ont dénoncé ce qui semble être un autre 'incident banal de brutalité policière' comme une crise bien plus large nécessitant une action sociale drastique pour être résolue. Les agitateurs extrémistes ont même comparé la situation actuelle à un retour voilé de l'ère Jim Crow. Les éléments conservateurs ont appelé à une désescalade drastique, affirmant que concernant l'incident impliquant M. Evans, 'l'historique juridique détaillé de M. Evans montre un précédent de violence contre les officiers - ce que l'officier suspect a utilisé pour justifier l'usage de la force brute'.\n\nLes conservateurs ont déjà commencé à s'armer et à entrer dans les villes en proie aux manifestations sous prétexte de protéger les petites entreprises, qu'ils ont déclarées ciblées par les manifestants. Les affrontements sont inévitables."
 news.158.a: "Le feu s'élève..."
 news.159.t: "L'autorité mexicaine s'effondre"
 news.159.d: "Pendant des décennies, les terres du Mexique ont lutté contre une guerre de guérilla brutale quasi-permanente contre les cartels - des organisations criminelles responsables du trafic de milliers de tonnes de narcotiques illégaux cultivés dans les jungles luxuriantes d'Amérique du Sud, remontant vers le nord à travers le mur frontalier des États-Unis et dans un marché noir avec la plus forte demande de drogues au monde. Les cartels comme Los Zetas et le Sinaloa ont fini par dominer la vie régionale des gens là où leur territoire s'étendait, entraînant des quantités massives de corruption systémique, d'intimidation et de violence générale. Lorsque les États-Unis ont éclaté dans une deuxième guerre civile, tout semblant de statu quo au Mexique s'est désintégré alors que des millions de réfugiés ont commencé à affluer du nord vers le Mexique, submergéant les gouvernements locaux et provoquant la propagation incontrôlable du chaos et de la panique. Malgré les efforts du gouvernement mexicain pour rétablir l'ordre en instaurant la loi martiale et en tentant d'établir des installations de logement, les réfugiés sont devenus trop nombreux et État après État a déclaré un état d'anarchie alors que l'armée mexicaine était débordée, les cartels commençant leur gambit pour prendre le contrôle du Mexique en s'emparant par la force des gouvernements locaux, apportant une autre guerre civile au Mexique. Avec les vestiges du gouvernement tenant Mexico, tout ce qui reste en dehors de la vallée sont de nombreux seigneurs de guerre des cartels et des mouvements de guérilla faisant leurs mouvements."
 news.159.a: "Le chaos se propage..."
 news.161.t: "L'Amérique unie sous le Front patriotique"
 news.161.d: "Dans un retournement stupéfiant des événements, l'Amérique du Nord a été témoin d'un moment historique aujourd'hui. Après des années de conflit implacable et brutal et un bilan catastrophique sur la vie humaine, le Front patriotique est sorti vainqueur incontesté de la deuxième guerre civile américaine, prenant le contrôle d'un États-Unis dévasté et meurtri. Les derniers jours de combats ont été marqués par certains des affrontements les plus violents et destructeurs de la guerre, laissant des villes entières en ruines et d'innombrables vies brisées. Maintenant, un calme inquiet est descendu sur la terre ravagée par la guerre, où les seuls sons restants sont le grondement sinistre des convois militaires sur des routes désolées, le rugissement lointain des jets patrouillant dans le ciel, et le battement incessant des rotors d'hélicoptères planant au-dessus, tandis que des témoins silencieux regardent la paix fragile.\n\nAvec la chute de leurs derniers adversaires restants, le gouvernement national nouvellement formé du Front patriotique s'est rendu au National Mall pour s'adresser à la nation épuisée par la guerre dans un discours de victoire soigneusement orchestré. Alors que la nation regardait, le nouveau régime a célébré son triomphe durement gagné, présentant sa victoire non seulement comme la fin de la guerre civile, mais comme le début d'une nouvelle ère pour l'Amérique. Pendant le discours, ils ont esquissé leur vision ambitieuse pour l'avenir du pays, détaillant des plans de reconstruction à grande échelle visant à relancer une infrastructure brisée, ainsi que des promesses de réformes politiques radicales qui transformeraient le cœur de la gouvernance américaine.\n\nLa réaction internationale a été loin d'être unanime, mais malgré ces réactions mitigées, un fait indéniable se profile : l'Amérique est maintenant sous un nouveau leadership, un leadership avec le pouvoir et l'ambition de remodeler les fondations mêmes de la nation de manière qui pourrait résonner pendant des générations à venir."
 news.161.a: "Ils sont venus de loin, mais que feront-ils maintenant ?"
 news.161.b: "Nous avons repris l'Amérique !"
 news.162.t: "L'[ATW.GetName] conquiert l'Amérique"
 news.162.d: "Ce qui était autrefois jugé impossible est maintenant devenu une réalité brutale. Selon une déclaration récente de la Division Atomwaffen, corroborée par des jours de vérifications rigoureuses, tous les gouvernements restants qui exerçaient autrefois un contrôle sur les États-Unis continentaux se sont rendus à la Division ou ont été annihilés. Ce changement monumental a propulsé la Division Atomwaffen – de ses débuts comme groupe marginal extrémiste basé en Floride – au rang d'autorité dominante au milieu de la désolation des anciens États-Unis.\n\nLe conflit qui a ravagé l'Amérique, marqué par la montée et la chute de nombreuses factions et gouvernements dans un chaos omniprésent, tombe maintenant dans le silence, ponctué uniquement par les célébrations triomphales de la Division Atomwaffen. Observateurs américains et internationaux se tiennent dans un silence stupéfait alors qu'ils assistent à l'émergence d'une des organisations les plus radicales de l'histoire, prenant le contrôle de ce qui était autrefois le pays le plus puissant au monde. Ce groupe détient désormais non seulement un immense pouvoir politique mais aussi certains des armements les plus avancés et destructeurs jamais développés.\n\nL'avenir reste incertain. Bien que la Division Atomwaffen se réjouisse de sa victoire, elle n'a pas encore publié de déclaration formelle sur ses plans pour l'avenir de la nation. Compte tenu de leur idéologie extrême et de leurs actions passées, on prévoit que l'Amérique – ou ce qu'il en reste – deviendra leur domaine, où ils auront toute latitude pour imposer leur volonté. On s'attend à ce que la nation connaisse des niveaux de chaos et de violence sans précédent, susceptibles de dépasser même les conflits les plus intenses en cours dans le monde. La perspective d'un avenir marqué par une instabilité rampante et des souffrances généralisées plane désormais sur l'horizon, menaçant potentiellement l'humanité tout entière."
 news.162.a: "Le bastion de la liberté est perdu."
 news.162.b: "Notre destin est accompli."
 news.163.t: "Les [NSM.GetName] réunifient l'Amérique"
 news.163.d: "TODO NSM tuer des gens de manière épique"
 news.163.a: "Cela s'est produit ici..."
 news.163.b: "Notre destin est accompli."
