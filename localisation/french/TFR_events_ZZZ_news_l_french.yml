 news.225.t: "Les Troupes russes entrent à Elista"
 news.225.d: "Il semble que le régime eurasiste poursuive ses politiques expansionnistes. Après avoir sécurisé Astrakhan sans combat par le biais de négociations, les eurasistes, aux côtés de sympathisants kalmouks, ont pris le contrôle de la capitale kalmouke d'Elista, annexant de facto toute la région.\n\nUne administration locale a été mise en place par Douguine, dirigée par un moine bouddhiste local. Déjà, les eurasistes kalmouks militent pour la militarisation de la région afin de "riposter contre les hédonistes qui voulaient détruire notre paradis bouddhiste".\n\nLa communauté européenne observe avec horreur la montée du revanchisme russe, se rapprochant d'une confrontation ouverte."
 news.225.a: "Un crachat au visage de la démocratie !"
 news.226.t: "La Russie envahit le Kouban !"
 news.226.d: "[SEVASTOPOL] Nos reporters en Crimée ont signalé d'importants mouvements de troupes à travers le pont de Kertch par la République d'Ukraine, alors que les premiers rapports de forces russes entrant dans le Kouban ont commencé à inonder les chaînes d'information du monde entier, avec la confirmation officielle des ministères de la Défense ukrainien et kouban que les rapports sont vrais et que l'OTAN se démène pour répondre, car la Russie est sans aucun doute préparée aux conséquences de l'invasion de la République du Kouban, qui incluaient, mais ne se limitaient pas à, une intervention directe de l'OTAN en raison d'une garantie de sécurité ukrainienne.\n\nLa guerre a failli éclater lors des manifestations de Stavropol qui ont vu la moitié orientale de la République du Kouban se séparer lors d'une vague de manifestations pro-russes dans la ville. L'Ouest restait cependant optimiste quant à une désescalade et l'Ukraine n'a pas agi sur la garantie défensive lorsque les forces russes ont sécurisé Stavropol. Cette fois cependant, c'est parti.\nOn estime que 4 millions d'hommes s'affronteront à nouveau dans l'Europe de l'Est à peine réparée, ce qui était un avenir plein d'espoir pour une génération et une retraite honorable pour les vétérans de l'OTAN de la dernière guerre s'est transformé en une nouvelle vague de recrues et de rappels de vétérans qui a laissé l'Europe aussi en colère et déterminée à en finir que leurs homologues russes."
 news.226.a: "Le gagnant prend tout, cette fois..."
 news.226.b: "La Russie dominera l'Europe, même si ce n'est qu'un tas de cendres..."
 news.226.c: "L'Europe sera unifiée sous l'Eurasie !"
 news.227.t: "Guerre nucléaire en Europe !"
