 news.533.a: "Tout ce qui vit périra, et toute création s'effacera."
 news.534.t: "Sydney a été atomisée"
 news.534.d: "Il y a quelques heures, une boule de feu aveuglante s'est élevée au-dessus de la baie de Sydney, illuminant toute la ville. Le rugissement assourdissant a suivi peu de temps après, alors que l'onde de choc balayait le centre-ville. L'explosion s'est produite près de l'Opéra de Sydney, et la boule de feu est montée, formant un gigantesque champignon nucléaire perçant le ciel. L'intense radiation de l'explosion a instantanément transformé tout dans un rayon de plusieurs kilomètres en cendres.\n\nDes témoins ont décrit l'explosion comme une "seconde soleil", suivie d'un tremblement de terre. Les communications ont été coupées, les systèmes électriques se sont effondrés, et la ville entière est descendue dans le chaos et la panique. Lors d'une conférence de presse d'urgence, le Premier ministre australien a condamné l'utilisation par la Chine d'armes nucléaires contre des civils innocents et a appelé la communauté internationale et les Nations Unies à imposer des sanctions à la Chine.\n\nLe nombre exact de victimes reste incertain, mais on estime que des centaines de milliers de personnes pourraient avoir été tuées ou blessées à Sydney et dans ses environs. L'explosion a également déclenché des incendies massifs et potentiellement libéré des radiations nucléaires, posant des risques environnementaux à long terme."
 news.534.a: "La guerre ne change jamais."
