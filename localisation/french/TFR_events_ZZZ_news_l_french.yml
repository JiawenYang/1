 news.535.a: "Quand les fleurs se fanent, le monde se fane avec elles."
 news.536.t: "Shinzo Abe est Mort"
 news.536.d: "L'ancien Premier ministre japonais Shinzo Abe est décédé tragiquement lors d'une tentative d'assassinat. Abe prononçait un discours en soutien au Parti Libéral Démocrate à Nara lorsqu'un individu inconnu a tiré sur lui. La NHK a rapporté que l'ancien Premier ministre a été blessé deux fois. Il a été transporté d'urgence dans un hôpital de la ville de Kashihara, dans la préfecture de Nara, mais le politicien est décédé.\n\nAprès l'attaque, le service de sécurité a arrêté un homme, un habitant de 41 ans de Nara. Selon Nihon TV et NHK, Tetsuya Yamagami a servi dans les Forces d'Autodéfense Maritimes du Japon au début des années 2000. Selon le détenu, il voulait tuer Abe parce qu'il était mécontent du politicien. Cependant, d'après Kyodo, la police a plus tard cité le détenu disant : 'Ce n'est pas en raison des convictions politiques de l'ancien Premier ministre Abe.'\n\nLe meurtre de l'ancien Premier ministre a choqué la société japonaise et les conséquences de cet événement restent incertaines."
 news.536.a: "Bonne nuit, doux prince..."
 news.537.t: "Les Forces de l'UE Traversent la Frontière"
 news.537.d: "Aujourd'hui, le monde s'est réveillé face à une nouvelle guerre.\n\nÀ 4 heures du matin, les forces de l'Union Européenne se sont engagées contre les troupes russes sur la ligne de démarcation polonaise. Les forces terrestres, aériennes et navales de l'OTSC et de l'Europe combattent actuellement dans toutes les régions d'Europe, battant le record de la plus grande guerre jamais vue sur le continent.\n\nL'Union Européenne fédéralisée s'est transformée en une machine de guerre brutale, prête à tout pour retrouver son hégémonie sur le vieux monde, même si elle ne pourra jamais restaurer un monopole mondial. Pour la Russie, il s'agit de l'ultime et plus grave épreuve.\n\nLe destin de l'Europe a été maintes fois en jeu dans divers conflits, mais cette fois les deux parties sont déterminées à le décider une fois pour toutes."
 news.537.a: "L'heure est venue."
 news.538.t: "L'Eurointern Attaque !"
 news.538.d: "Aujourd'hui, le monde s'est réveillé face à une nouvelle guerre.\n\nÀ 4 heures du matin, les forces de l'Internationale Européenne, une alliance formée par les nouveaux gouvernements de gauche de l'Europe après l'effondrement de l'OTAN, ont lancé une invasion simultanée de la République tchèque et de la Pologne, brisant le statu quo actuel de la frontière avec la sphère russe.\n\nDes milliers de véhicules blindés européens ont commencé à avancer à travers la campagne polonaise de l'Ouest en direction de Varsovie, affrontant à peine une résistance du soi-disant gouvernement de Réclamation. En même temps, des avions de la Luftwaffe ont décollé et se dirigent vers leurs cibles en Europe de l'Est.\n\nBien que l'Internationale n'ait pas encore directement engagé les troupes russes, il ne fait aucun doute que ce n'est qu'une question de temps. Une haine intense et un esprit revanchard se sont accumulés en Europe, prêt à déferler comme une vague de fond vers l'Est et à tout emporter jusqu'à l'Oural. Un esprit similaire anime les soldats russes - sauf que, bien sûr, ils ne s'arrêteront qu'une fois arrivés sur les rives de l'océan Atlantique.\n\nLe destin de l'Europe a été maintes fois en jeu dans divers conflits, mais cette fois les deux parties sont déterminées à le décider une fois pour toutes."
 news.538.a: "L'heure est venue."
 news.539.t: "L'Eurointern Victorieux dans la Seconde Guerre Européenne"
 news.539.d: "La Seconde Guerre Européenne s'est finalement conclue par la défaite complète des forces russes en Europe et l'effondrement effectif de l'État russe après la perte des régions les plus cruciales du pays. Même l'utilisation d'armes nucléaires et la mobilisation totale de toutes les ressources pour la guerre n'ont pu les sauver. Désormais, l'Europe et la partie européenne de la Russie sont sous le contrôle de l'Internationale Européenne."
 news.539.a: "La Fin."
 news.540.t: "Victoire du Pacte d'Acier dans la Seconde Guerre Européenne"
 news.540.d: "La Seconde Guerre Européenne s'est finalement conclue par la défaite complète des forces soviétiques en Europe et l'effondrement effectif de l'État soviétique après la perte des régions les plus cruciales du pays. Même l'utilisation d'armes nucléaires et la mobilisation totale de toutes les ressources pour la guerre n'ont pu les sauver. Désormais, l'Europe et la partie européenne de la Russie sont sous le contrôle du Pacte d'Acier."
 news.540.a: "La Fin."
 news.541.t: "Victoire de l'ETO dans la Seconde Guerre Européenne"
 news.541.d: "La Seconde Guerre Européenne s'est enfin conclue par la défaite complète des forces russes en Europe et l'effondrement effectif de l'État russe après la perte des régions les plus cruciales du pays. Même l'utilisation d'armes nucléaires et la mobilisation totale de toutes les ressources pour la guerre n'ont pu les sauver. Désormais, l'Europe et la partie européenne de la Russie sont sous le contrôle de l'Union Européenne."
 news.541.a: "La Fin."
 news.542.t: "Fin de la guerre civile en Libye"
 news.542.d: "À la surprise générale, les récents bouleversements mondiaux ont brisé le statu quo en Libye, et le pays ravagé par la guerre a enfin trouvé la paix. La nouvelle autorité a annoncé la création d'un congrès national pour élire un nouveau gouvernement. Les Libyens peuvent enfin respirer un air de renouveau alors que des dizaines de politiciens forment leurs plateformes, promeuvent leurs programmes et annoncent leurs ambitions dans toutes les régions du pays. Pour la première fois depuis presque une décennie, la Libye est illuminée non seulement par le soleil impitoyable du désert, mais aussi par des rayons d'espoir."
 news.542.a: "Pourront-ils jamais se rétablir ?"
 news.543.t: "Kadhafi Reprend le Pouvoir en Libye"
 news.543.d: "Des nouvelles surprenantes viennent de Libye : Saïf al-Islam Kadhafi, fils de Mouammar Kadhafi, a réussi à obtenir un large soutien populaire et à remporter les élections nationales d'après-guerre civile avec une majorité écrasante. Il a su utiliser le mécontentement du peuple libyen face aux agendas des autres candidats et a fait appel à la fierté nationale et à la souveraineté avant tout.\n\nAvec le retour des kadhafistes au pouvoir, la Libye semble prête à expulser les mercenaires étrangers qui infestaient le pays depuis le début de la guerre civile. Alors que l'esprit revanchard se renforce en Libye, Kadhafi a annoncé ses plans de créer un État arabe socialiste uni au Maghreb."
 news.543.a: "Le Grand Jihad commence"
 news.544.t: "La Chine adopte l'Intelligence Artificielle"
 news.544.d: "Des nouvelles troublantes de Chine, alors que la guerre dans le Pacifique atteint de nouveaux sommets.\nIl semble que le parti communiste chinois ait investi massivement dans l'intelligence artificielle et, face à la pression de l'Inde et du Japon, la Chine a décidé de se débarrasser des restrictions éthiques couramment imposées ailleurs et a levé les restrictions sur l'intelligence artificielle, permettant à celle-ci d'apprendre et de croître au sein même du gouvernement.\n\nNomée Unité Centrale de Traitement pour les Forces Productives (CPUPF), cette intelligence artificielle avait pour fonction principale d'administrer plusieurs fonctions gouvernementales cruciales afin de réduire la pression sur les aspects humains du travail, tels que la planification militaire, les réseaux civils, le traitement de l'information, et bien plus encore. Cependant, le gouvernement chinois a annoncé qu'il a permis à la CPUPF d'adopter une approche plus directe dans les affaires gouvernementales, capable de fournir des réponses que les humains ne peuvent pas. Le monde surveille désormais la Chine avec prudence, car cela signifie officiellement qu'une puissance mondiale est désormais gouvernée par une machine plutôt que par des humains.\n\nCe qui perturbe le plus les milieux religieux et technologiques, c'est la croissance d'une petite mais croissante religion vénérant cette intelligence artificielle appelée Luoji (ou Logique en anglais), la considérant comme un dieu né de l'ingéniosité et de la rationalité humaines. On ignore encore si cette nouvelle religion dépassera les religions anciennes ou s'il s'agit simplement d'un autre culte voué à l'obscurité, mais il est certain que cette intelligence artificielle sera perçue par beaucoup comme un nouveau sauveur de l'humanité."
 news.544.a: "À la croisée des chemins du futur"
 news.545.t: "Crise du Kouban"
 news.545.d: "Avec la domination récente d'une Russie renaissante sur le Caucase, beaucoup s'attendaient à ce que l'État vengeur se tourne vers ses autres territoires perdus. La république du Kouban semble être la prochaine à tomber dans son viseur, mais pas sans l'aide de l'Ukraine.\n\nL'Ukraine a promis de protéger la république du Kouban de toute forme d'agression russe, une promesse qui sera tenue plus tôt que prévu. Un jour fatidique, des rapports de combats à la frontière russo-kouban circulaient sur plusieurs chaînes de médias, avec l'Ukraine se précipitant déjà au secours de la république, rendant probable une escalade de ces affrontements.\n\nÀ l'échelle internationale, des inquiétudes montent quant au fait que cette crise pourrait ne pas se limiter au Kouban. Si les russes goûtent à la victoire dans la république, il est certain qu'ils n'arrêteront pas là et pousseront plus loin en Ukraine, ce qui pourrait déclencher une nouvelle guerre majeure en Europe.\n\nLe continent regarde la république avec inquiétude, s'attendant au pire, tandis que les forces occidentales sont placées en état d'alerte maximale."
 news.545.a: "Sommes-nous à la veille d'une nouvelle guerre ?"
 news.546.t: "l'IDAE prend Hanoi"
 news.546.d: "Alors que le conflit asiatique progresse, les forces de l'IDAE ont récemment lancé une offensive contre Hanoï, la capitale du Vietnam, et ont finalement pris le contrôle de la ville.\n\nGrâce à une stratégie de blitzkrieg, les forces de l'IDAE, principalement dirigées par l'APL, ont rapidement capturé l'ensemble de la région nord du Vietnam. Ce développement change considérablement l'équilibre de la guerre en faveur de l'IDAE à court terme. Par conséquent, la Chine, en tant que nation dirigeante de l'IDAE, a sécurisé la sécurité de ses frontières sud et de ses zones intérieures. De plus, le Vietnam, une puissance régionale, a subi un coup substantiel à son potentiel de guerre.\n\nD'autre part, la perte de Hanoï signifie que l'OTDP a perdu l'initiative dans le conflit de la péninsule indochinoise. Si les forces de l'OTDP ne répondent pas de manière proactive à ce changement, l'équilibre de la guerre continuera de basculer lourdement en faveur de l'IDAE."
 news.546.a: "Une autre victoire pour l'IDAE"
 news.547.t: "l'OTDP prend Hanoi"
 news.547.d: "Alors que le conflit asiatique progresse, les forces de l'OTDP ont récemment lancé une offensive contre Hanoï, la capitale du Vietnam, et ont finalement pris le contrôle de la ville.\n\nEn tant que capitale du Vietnam et ville centrale des Plaines du Nord, la chute de Hanoï représente une menace grave pour les régions centrales de l'IDAE, en particulier la frontière sud de la Chine. Actuellement, les forces de l'OTDP continuent leur avancée vers le nord, visant à capturer plusieurs bastions fortifiés environnants et à éliminer les unités restantes de l'Armée populaire vietnamienne.\n\nD'autre part, la perte de Hanoï signifie que l'IDAE a perdu l'initiative dans le conflit de la péninsule indochinoise. Si les forces de l'IDAE ne répondent pas de manière proactive à ce changement, l'équilibre de la guerre continuera de basculer lourdement en faveur de l'OTDP."
 news.547.a: "Une autre victoire pour l'OTDP"
 news.548.t: "l'IDAE prend Ho Chi Minh Ville"
 news.548.d: "Ho Chi Minh Ville, autrefois connue sous le nom de Saïgon, un centre économique animé du Vietnam, est maintenant engloutie dans la fumée et la destruction. Les forces de l'OTDP stationnées dans la ville se sont retirées, la laissant aux troupes de l'IDAE.\n\nLe changement de contrôle à Ho Chi Minh Ville a eu un impact profond sur le conflit régional. Les forces de l'IDAE dominent désormais presque entièrement le Vietnam, assurant la sécurité de leurs flancs tout en opérant au cœur de l'Asie du Sud-Est. De plus, les installations portuaires de Ho Chi Minh Ville offrent une base opérationnelle cruciale pour la marine de l'IDAE.\n\nInversement, cela représente un revers important pour l'OTDP, indiquant la perte d'un de ses bastions clés en Asie du Sud-Est. Sans ajustements stratégiques en temps opportun, l'OTDP continuera de perdre pied, inclinant encore davantage la balance en faveur de l'IDAE."
 news.548.a: "Une autre victoire pour l'IDAE"
 news.549.t: "l'OTDP prend Ho Chi Minh Ville"
 news.549.d: "Ho Chi Minh Ville, autrefois connue sous le nom de Saïgon, un centre économique animé du Vietnam, est maintenant engloutie dans la fumée et la destruction. Les forces de l'IDAE stationnées dans la ville se sont retirées, la laissant aux troupes de l'OTDP.\n\nLe changement de contrôle à Ho Chi Minh Ville a eu un impact profond sur le conflit régional. Les installations portuaires de Ho Chi Minh Ville fournissent une base opérationnelle cruciale pour la marine de l'OTDP, leur permettant d'entreprendre des actions plus audacieuses en mer de Chine méridionale. Par conséquent, les bastions majeurs de l'IDAE dans les zones environnantes sont constamment menacés par les forces navales de l'OTDP.\n\nInversement, cela représente un revers important pour l'IDAE, indiquant la perte d'un de ses bastions clés en Asie du Sud-Est. Sans ajustements stratégiques en temps opportun, l'IDAE continuera de perdre pied, inclinant encore davantage la balance en faveur de l'OTDP."
 news.549.a: "Une autre victoire pour l'OTDP"
 news.550.t: "l'IDAE prend Kuala Lumpur"
 news.550.d: "Kuala Lumpur, la capitale de la Malaisie, est la plus grande et la plus densément peuplée du pays, ainsi que son épicentre économique et culturel. En ce moment, le drapeau malaisien descend de la Menara Berkembar Petronas, remplacé par la bannière de l'IDAE.\n\nLa chute de Kuala Lumpur représente un avantage stratégique majeur pour l'IDAE, solidifiant leur contrôle sur la péninsule malaise et renforçant leur influence dans la région du détroit de Malacca. Pendant ce temps, l'OTDP subit un coup significatif avec la perte de Kuala Lumpur, affaiblissant sévèrement sa présence militaire en Asie du Sud-Est.\n\nSi les forces de l'OTDP ne parviennent pas à adapter rapidement leur stratégie, l'équilibre de la guerre continuera de basculer. Ils risquent de perdre d'autres villes critiques dans le processus."
 news.550.a: "Une autre victoire pour l'IDAE"
 news.551.t: "l'OTDP prend Kuala Lumpur"
 news.551.d: "Kuala Lumpur, la capitale de la Malaisie, est la plus grande et la plus densément peuplée du pays, ainsi que son épicentre économique et culturel. En ce moment, le drapeau malaisien descend de la Menara Berkembar Petronas, remplacé par la bannière de l'OTDP.\n\nLa chute de Kuala Lumpur représente un avantage stratégique majeur pour l'OTDP, solidifiant leur contrôle sur la péninsule malaise et renforçant leur influence dans la région du détroit de Malacca. Pendant ce temps, l'IDAE subit un coup significatif avec la perte de Kuala Lumpur, affaiblissant sévèrement sa présence militaire en Asie du Sud-Est.\n\nSi les forces de l'IDAE ne parviennent pas à adapter rapidement leur stratégie, l'équilibre de la guerre continuera de basculer. Ils risquent de perdre d'autres villes critiques dans le processus."
 news.551.a: "Une autre victoire pour l'OTDP"
 news.552.t: "L'Allemagne Quitte l'Union Européenne !"
 news.552.d: "Dans un revirement choquant, après la victoire de l'OTAN sur la Russie dans la Guerre Européenne, malgré l'apparente unité de l'alliance militaire et de la communauté économique, le gouvernement allemand de droite a déclaré que 'la guerre n'a pu être remportée que grâce au cœur de l'Europe qui est l'Allemagne' et que les autres membres n'ont été que des 'parasites' pour eux. En conséquence, le gouvernement allemand a annoncé son intention de se retirer de l'UE et de rétablir le Deutschemark comme monnaie nationale. Cette annonce a déjà eu un impact sur l'économie et le commerce au sein de l'Union, sans parler des répercussions politiques qu'elle a engendrées."
 news.552.a: "Sont-ils vraiment mieux sans ?"
 news.555.t: "L'[ATW.GetName] Conquiert l'Amérique"
 news.555.d: "Ce qui était autrefois jugé impossible est désormais une dure réalité. Selon une déclaration récente de la Division Atomwaffen, corroborée par des jours de vérification rigoureuse des faits, tous les gouvernements restants qui exerçaient auparavant un contrôle sur les États-Unis continentaux se sont soit rendus à la Division, soit ont été anéantis. Ce changement monumental a propulsé la Division Atomwaffen - depuis ses origines en tant que groupe extrémiste marginal basé en Floride - au rang d'autorité dominante au milieu de la désolation des anciens États-Unis.\n\nLe conflit qui a ravagé la carcasse de l'Amérique, le conflit qui a duré des jours interminables, marqué par l'ascension et la chute de nombreuses factions et gouvernements au milieu du chaos omniprésent, se tait désormais, ponctué uniquement par les célébrations triomphales de la Division Atomwaffen. Les observateurs américains et internationaux restent stupéfaits en voyant l'émergence de l'une des organisations les plus radicales de l'histoire prendre le contrôle de ce qui était autrefois le pays le plus puissant du monde. Ce groupe détient désormais non seulement un immense pouvoir politique, mais aussi certaines des armes les plus avancées et les plus destructrices jamais développées.\n\nLa voie à suivre reste enveloppée d'incertitude. Bien que la Division Atomwaffen se réjouisse actuellement de sa victoire, elle n'a pas encore publié de déclarations officielles concernant ses plans pour l'avenir de la nation. Compte tenu de leur idéologie extrême et de leurs actions passées, on s'attend à ce que l'Amérique - ou ce qu'il en reste - devienne leur domaine, où ils auront la liberté totale d'imposer leur volonté. On s'attend à ce que la nation connaisse des niveaux de chaos et de violence sans précédent, dépassant potentiellement même les conflits les plus intenses en cours dans le monde. La perspective d'un avenir marqué par une instabilité endémique et des souffrances généralisées se profile désormais de manière inquiétante à l'horizon, condamnant potentiellement l'humanité entière.\n"
 news.555.a: "Le Bastion de la Liberté, disparu."
 news.555.b: "Sa volonté sera accomplie."
 news.553.t: "La révolution populiste"
 news.553.d: "Aujourd'hui, dans la roseraie de la Maison-Blanche, il a annoncé à toute l'Amérique la capitulation des forces restantes opposées à sa présidence. Ayant prêté serment en tant que Président lors de cette annonce, le discours d'investiture du Président n'a guère apaisé les tensions qui infestaient encore la psyché américaine.\n\nDe nombreux analystes et observateurs extérieurs qualifient la situation actuelle en Amérique de « révolution populiste ». L'homme politique, autrefois connu pour son style effronté, a pu construire une coalition solide, englobant non seulement les conservateurs et les modérés, mais a également fait des progrès considérables à travers les fortes divisions raciales, économiques et politiques, qui ont séparé les Américains pendant des décennies, le président n'a aucun scrupule à se faire des ennemis, mais a également réussi à se faire de nombreux amis. Parfois, il a gouverné de manière clivante, mais cela n'a pas empêché des millions d'Américains de se convertir à sa cause. Pour ses partisans, il a tenu sa promesse : une véritable prise de pouvoir populiste des États-Unis. Même ceux qui sont neutres à son égard le considèrent comme un homme qui a véritablement changé la donne.\n\nLes technologues politiques prédisent que pendant de nombreuses années à venir, les tactiques et l'esthétique du populisme seront utilisées par de nombreux groupes politiques de droite ou même simplement populistes dans le monde entier.\nUn expert dit : « Nous sommes à l'ère de la « Nation d'abord » - un message unificateur à travers tous les partis politiques. En ces temps troublés, les gens chercheront un homme fort, un roi républicain, qui « réparera » et remettra les choses en ordre. »"
 news.553.a: "Le Vent d'Or de l'Amérique."
 news.553.b: "Gagner, gagner, gagner !"
 news.1918.t: "L'Empire contre-attaque !"
 news.1918.d: "Aujourd'hui, le peuple de l'État allemand a été accueilli par une adresse télévisée du monarchiste allemand excentrique Heinrich Reuss. Suite à un coup sanglant à Berlin par des restaurateurs impériaux fanatiques, le nouveau dirigeant allemand a dénoncé l'ancien gouvernement comme une cabale de globalistes crypto-slaves et a déclaré la restauration de l'ancien Empire allemand ainsi que l'instauration de la loi martiale.\n\nBien que considéré comme marginal même selon les normes de l'ancien État nationaliste allemand, le mouvement Reichsbürger a gagné en popularité après la défaite humiliante des forces allemandes contre l'Union soviétique et la révolution nationaliste subséquente menée par le mystérieux Rädelsführer. Avec la destitution de la précédente junte et l'installation de Reuss en tant que Régent autoproclamé de l'Empire allemand, une cascade de condamnations s'est abattue de la part de la communauté mondiale.\nHeinrich a clairement fait connaître son intention de restaurer les frontières de l'Allemagne à sa taille d'avant la république et a promis de vaincre les ennemis de l'Empire sous son règne 'Divin et Providentiel'.\n\nLe monde attend avec angoisse de voir jusqu'où ira le Régent fou pour restaurer son empire bien-aimé, et, s'il réussit, à quel point l'avenir de la nation allemande risque de devenir sombre..."
 news.1918.a: "Seul l'oubli attend le peuple allemand..."
