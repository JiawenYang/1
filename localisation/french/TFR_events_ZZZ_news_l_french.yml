 news.281.t: "Nouveau gouvernement au Monténégro"
 news.281.d: "Avec la guerre civile aux États-Unis plongeant le statu quo international dans le chaos, le premier signe de l'effondrement de l'ordre libéral de l'après-guerre froide est l'agitation au Monténégro. De nombreux citoyens, nourrissant un ressentiment contre le gouvernement pro-occidental en raison de la mauvaise gestion économique et de la crise du COVID, ont manifesté dans tout le pays, installant le parti conservateur "Pour l'Avenir du Monténégro" au pouvoir. Anti-occidental par nature, le nouveau gouvernement bénéficie du soutien de la droite centriste ainsi que du Parti Radical Serbe du Monténégro d'extrême-droite et du Parti Communiste Yougoslave du Monténégro d'extrême-gauche. Avec ce nouveau gouvernement, il est certain que le Monténégro se rapprochera de la Serbie et s'éloignera de l'Occident, inquiétant de nombreuses puissances européennes alors que les Serbes entament des négociations pour un accès à la mer."
 news.281.a: "L'ordre libéral se fissure"
 news.282.t: "Les partis anti-occidentaux l'emportent en Macédoine"
 news.282.d: "Dans la foulée du chaos au Monténégro, des semaines de troubles civils en Macédoine se sont soldées par l'élection du VMRO-DPMNE, une force significative anti-UE. À l'instar de ce qui s'est passé au Monténégro, le nouveau gouvernement macédonien cherche à s'éloigner de l'UE pour se rapprocher des sphères d'influence serbe et russe. Avec l'influence de l'UE s'affaiblissant dans la région en raison des récents problèmes économiques, il semble que la « fin de l'histoire » soit encore bien éloignée."
 news.282.a: "Intéressant"
 news.283.t: "Guerre civile en Algérie"
 news.283.d: "Dans un tournant dramatique, l'Algérie a plongé dans la guerre civile après avoir subi une défaite humiliante dans son récent conflit avec le Maroc. Suite à une augmentation massive des protestations antigouvernementales, plusieurs factions en Algérie se sont scindées et ont annoncé un soulèvement contre le régime de Tebboune. Le revers militaire a provoqué des troubles généralisés et une instabilité politique dans le pays, ravivant les tensions de longue date entre divers groupes.\n\nLe conflit avec le Maroc, initialement alimenté par des disputes territoriales, a rapidement escaladé, causant de lourdes pertes pour les forces armées algériennes. Alors que le gouvernement peine à gérer les répercussions de cette défaite, des dissensions ont éclaté dans tout le pays, avec des groupes d'opposition profitant de l'occasion pour contester l'autorité en place.\n\nAu milieu du chaos, diverses factions sont apparues pour défier le gouvernement : libéraux, nationalistes, islamistes et partisans berbères, chacun cherchant à gagner du pouvoir et de l'influence. Cette fragmentation a encore compliqué une situation déjà volatile, tandis que les civils se retrouvent pris au milieu du conflit. Le pays fait face à un avenir précaire, les échos de conflits passés résonnant dans les rues."
 news.283.a: "Un retour au bain de sang"
 news.284.t: "Création de la Coalition des États Africains contre l'impérialisme"
 news.284.d: "Depuis la fin de la domination directe de la France sur ses anciennes colonies de l'Afrique de l'Ouest en 1962, les liens économiques et culturels entre les nations de la région ont été maintenus. Avec le Franc CFA comme monnaie officielle dans plusieurs États d'Afrique de l'Ouest, la présence de nombreuses entreprises françaises offrant des emplois et des investissements, ainsi que le français comme lingua franca de ces pays, les mots de la France ont naturellement eu un poids dans la région depuis son indépendance.\n\nUne vision émergente ces dernières années, cependant, a qualifié cet état de fait de méprisable. Suite à l'annonce récente de la France de vouloir adopter une ''approche plus large et active'' pour le développement de l'Afrique de l'Ouest dans son ensemble, ces sentiments se sont cristallisés sous la forme d'un front commun d'États ouest-africains offrant une aide économique et militaire mutuelle, mené par le nouveau gouvernement militaire en Mauritanie. Rejetant les politiques de consensus ''néocoloniales'' qui auraient ''étouffé la culture africaine et le développement national'', la nouvelle alliance a promis un nouveau paradigme non seulement pour le Sahel, mais pour toute l'Afrique francophone.\n\nLes réactions de Paris ont été sans équivoque, dénonçant l'alliance comme une simple façade pour un ''despotisme illégitime''. Sans les États-Unis pour agir en tant qu'arbitre diplomatique entre les deux parties, les observateurs ont prédit que les intérêts français en Afrique sont sur le point de rencontrer une opposition notable dans les années à venir."
 news.284.a: "Les tensions montent en Afrique..."
