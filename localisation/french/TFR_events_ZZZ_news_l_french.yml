 news.166.t: "Déclaration de la Jamahiriya Arabe"
 news.166.d: "Aujourd'hui, après que les forces libyennes ont finalement établi un contrôle total sur la région du Maghreb, Saif al-Islam Kadhafi a proclamé "la fin de décennies d'humiliation du peuple arabe par des criminels occidentaux impunis" et déclaré la formation d'une nouvelle Jamahiriya arabe socialiste unie. Kadhafi a également partagé ses projets de créer une nouvelle plateforme pour les nations africaines et arabes et a promis de viser un "ordre mondial plus juste" auquel le nouvel État aspirera.\n\nCependant, de nombreux experts doutent que cette nouvelle puissance apporte de la stabilité dans la région, car les nouvelles ambitions de Kadhafi pourraient bien mettre en danger les pays voisins. Néanmoins, il s'agit d'une puissance avec laquelle il faut désormais compter."
 news.166.a: "La Troisième Théorie est de retour sur la scène mondiale ?"
 news.167.t: "Un Caligula Américain"
 news.167.d: "Des rapports choquants émergent aujourd'hui d'Amérique du Nord. Des récits dispersés de réfugiés en fuite affirment que l'[FROM.GetName], anciennement l'Union d'Amérique, a éliminé toutes les autres factions en guerre dans les anciens États-Unis. Le dirigeant de l'Union, Joseph Biden, n'a pas fait de déclaration internationale étant donné son statut mystérieux dans la nation et sur la scène mondiale.\n\nL'État lui-même reste difficile à comprendre. Depuis le rebranding de l'Union, toutes les connexions extérieures, internet et réseaux sociaux, ont été pratiquement coupées. La seule source d'informations provient des réfugiés ayant fui avant que le régime ne puisse les piéger, rapportant des récits troublants : disparitions massives, surveillance constante et même des histoires d'esclavage pénal. Bien que ces récits puissent sembler invraisemblables, des images satellites alarmantes montrent des villes entières disparaître, non seulement les voitures et les habitants, mais également les bâtiments. La majorité de ces images proviennent des anciens territoires sous le contrôle de Donald J. Trump, qui a fui après la défaite de son gouvernement.\n\nLa réaction internationale à cette situation reste tiède, les nations n'ayant pas encore décidé comment réagir et quelle sera leur relation future avec cette nouvelle Amérique. Cependant, certaines organisations humanitaires évoquent des allégations de génocide et appellent à une intervention immédiate. Même si ces allégations sont vraies, le régime de Washington dispose de certaines des armes les plus puissantes de la planète, et une intervention pourrait les inciter à utiliser ces armes. Ainsi, le monde ne peut qu'observer avec inquiétude l'Amérique renaître en un véritable cauchemar."
 news.167.a: "Vindicta solus optio."
 news.168.t: "Les Jacobins américains réunifient l'Amérique"
 news.168.d: "Aujourd'hui, des milliers de personnes défilent dans les rues d'Amérique, célébrant l'aube d'une nouvelle ère. Les Jacobins américains ont triomphé sur les factions rivales de l'ALPA, libérant la nation de toutes formes d'oppression, qu'elle soit industrielle conservatrice ou technocratique libérale. Des drapeaux américains et rouges ornent désormais chaque recoin imaginable des bâtiments de l'État et des maisons, Washington D.C. étant au cœur de la célébration. Ici, Caleb Maupin, le leader des Jacobins, a prononcé un discours enflammé après la déclaration officielle de la fin de la guerre civile. D'énormes foules se sont rassemblées pour entendre ses paroles.\n\n"Compatriotes, citoyens du monde... camarades", a-t-il commencé, enflammant la foule. En concluant son discours, il a levé les mains, tenant dans la droite le Petit Livre Rouge de Mao et dans la gauche la Sainte Bible, proclamant avec conviction : "Je sais d'où je viens, et je sais où je vais ! ÊTES-VOUS AVEC MOI ?" La foule a éclaté en acclamations, leur tonnerre couvrant les mots suivants de Maupin. Pour le meilleur ou pour le pire, l'Amérique est bel et bien renaissante."
 news.168.a: "Alléluia !"
 news.169.t: "L'[ATW.GetName] Lance "La Grande Croisade Aryenne" contre l'ONU"
 news.169.d: "L'[ATW.GetName] a déclaré que le monde est inapte à la préservation du peuple aryen et doit être détruit puis reconstruit à son image parfaite. L'ONU a annoncé une attaque à grande échelle contre l'[ATW.GetName] pour contrer ces plans !"
 news.169.a: "Que Dieu nous vienne en aide..."
 news.170.t: "Formation de la Fédération d'Afrique de l'Est"
 news.170.d: "Les dirigeants de six nations d'Afrique de l'Est ont signé un accord historique jeudi, officialisant la formation de la Fédération d'Afrique de l'Est (FAE) lors d'un événement marquant visant à favoriser l'intégration régionale et la croissance économique. La cérémonie de signature a eu lieu à Nairobi, au Kenya, en présence de dignitaires régionaux et internationaux.\n\nLa FAE, qui regroupe le Kenya, la Tanzanie, l'Ouganda, le Rwanda, le Burundi et le Soudan du Sud, a le potentiel de devenir l'un des plus grands blocs économiques d'Afrique. La population combinée de plus de 170 millions de personnes, ainsi que ses ressources naturelles abondantes, offrent une opportunité unique de croissance et de développement dans la région. Les membres fondateurs de la FAE se sont engagés à travailler ensemble pour relever des défis communs, tels que la pauvreté, l'instabilité politique et le changement climatique. Ils ont également promis de promouvoir le commerce régional, le développement des infrastructures et la libre circulation des biens, services et personnes à travers leurs frontières. La formation de la FAE a été saluée par l'Union africaine, qui considère la nouvelle fédération comme une étape cruciale vers sa vision d'une Afrique unie et prospère. Les observateurs internationaux ont également salué cette initiative, exprimant l'espoir qu'elle servira de catalyseur pour une coopération accrue et une stabilité durable à travers le continent. Alors que la FAE entame son voyage, le monde entier observera de près cette initiative ambitieuse et ce qu'elle pourrait signifier pour l'avenir de l'Afrique et de ses habitants."
 news.170.a: "Bien pour eux."
 news.171.t: "L'Éthiopie se mobilise contre l'Égypte"
 news.171.d: "À la lumière de la crise actuelle du Nil, les tensions autour des droits d'utilisation du fleuve ont atteint un point critique, alors que l'Égypte a renforcé ses réserves et que l'Éthiopie a commencé à se mobiliser en réponse.\n\nLe Nil a toujours été la source de vie du nord-est de l'Afrique, en particulier pour l'Égypte, dont la capitale, Le Caire, une mégalopole d'environ 25 millions d'habitants, dépend directement du fleuve qui la traverse. Le peu de verdure dont dispose l'Égypte se trouve exclusivement le long de cette voie fluviale vitale.\n\nAvec la mobilisation de l'Éthiopie, un conflit armé semble de plus en plus être la seule issue à la question des droits sur le Nil. Des pays voisins comme l'EAF et le Soudan ont déjà commencé à prendre parti alors que les tensions entre l'Égypte et l'Éthiopie ne cessent de s'intensifier."
 news.171.a: "Le Nil brûle"
 news.172.t: "Coup d'état militaire en Birmanie"
 news.172.d: "Des rapports épars à travers l'Union du Myanmar sur des actions militaires ont finalement été confirmés. Une déclaration officielle a été faite par les Forces Armées birmanes, assurant au monde l'éviction de l'ancien gouvernement civil de la nation et plaçant le pays sous loi martiale.\n\nLa prise de pouvoir a suscité de vives réactions internationales, de nombreux puissances voyant cette justification comme fragile. La récente élection nationale avait permis une victoire écrasante de l'ancienne chef d'État Suu Kyi et de son parti pro-chinois, la Ligue Nationale pour la Démocratie, dans ce que le nouveau chef d'État de facto Min Aung Hlaing et les forces armées birmanes qualifient d'élection 'truquée'. Suu Kyi a été placée en détention dans le chaos et attend son procès qui se tiendra bientôt sous tribunal militaire.\n\nDes protestations ont éclaté à travers le pays en réponse à ce qui est perçu par beaucoup comme une simple prise de pouvoir par une armée incontrôlable. Les partisans du coup qualifient ces protestations de bruits causés par des fauteurs de troubles rémunérés. Certains pointent vers des puissances étrangères responsables d'un côté ou de l'autre, bien qu'aucune preuve substantielle n'ait encore émergé.\n\nLa communauté internationale, bien que verbale sur la situation, dispose de peu de leviers d'action contre cet état de fait actuel - rien ne semble empêcher le général Hlaing et les forces armées de terminer leur consolidation de pouvoir. Il ne reste qu'à voir : vers qui se tournera la junte sur la scène mondiale ?"
 news.172.a: "On verra comment ça évolue."
 news.173.t: "Resurgence massive du COVID-19 en Inde"
 news.173.d: "L'Inde lutte contre une résurgence catastrophique du COVID-19, submergeant son système de santé et entraînant une hausse alarmante des taux de mortalité. Le pays, autrefois salué pour sa gestion réussie de la première vague, peine désormais à contenir le virus qui se propage rapidement dans sa vaste population.\n\nCes dernières semaines, l'Inde a connu une augmentation exponentielle des cas de COVID-19, avec des taux d'infection quotidiens atteignant des niveaux sans précédent. Ce pic a mis une pression immense sur une infrastructure de santé déjà tendue, qui peine à faire face au nombre écrasant de patients.\n\nLes hôpitaux à travers le pays fonctionnent au-delà de leur capacité, avec des pénuries sévères de lits, d'oxygène et de médicaments essentiels. Les patients sont refoulés faute de ressources disponibles, laissant beaucoup à se débrouiller seuls ou à compter sur des solutions de fortune. Les scènes à l'extérieur des hôpitaux sont déchirantes, avec des familles désespérées cherchant de l'aide et un personnel médical travaillant sans relâche pour sauver des vies."
 news.173.a: "Que Dieu aide le peuple de l'Inde..."
 news.174.t: "Victoire du CN en Afrique de l'Est"
 news.174.d: "Ces derniers mois, la Guerre du Nil est devenue le dernier conflit sanglant d'Afrique pour une ressource devenue rare : l'eau. La Coalition du Nil (CN), composée des opposants à l'Éthiopie et de ceux qui dépendent véritablement du fleuve Nil, a remporté la lutte pour le contrôle du Nil après un conflit prolongé.\n\nAprès que les troupes de la CN ont réussi à pénétrer en territoire éthiopien, menaçant de submerger leurs forces et de marcher sur Dar es Salam, le Pacte d'Afrique de l'Est a capitulé. Le barrage sur le Nil, détruit pendant la guerre, ne sera pas reconstruit, permettant ainsi au Nil de retrouver son cours normal, mettant progressivement fin à la sécheresse en Égypte et assurant la sécurité hydrique pour la prochaine génération.\n\nDe plus, la CN accordera l'indépendance au Tigré, démantèlera officiellement l'éphémère Fédération d'Afrique de l'Est et autorisera les troupes somaliennes à réoccuper l'État sécessionniste du Somaliland, affaiblissant considérablement l'Éthiopie et ses anciens alliés."
 news.174.a: "Une expérience éphémère..."
 news.175.t: "Victoire du PAE en Afrique de l'Est"
 news.175.d: "Ces derniers mois, la Guerre du Nil est devenue le dernier conflit sanglant d'Afrique pour une ressource devenue rare : l'eau. Le Pacte d'Afrique de l'Est (PAE), composé des alliés de l'Éthiopie et des bénéficiaires régionaux, a remporté la lutte pour le contrôle du Nil, assurant la pérennité du barrage comme source d'énergie propre et fiable et établissant ainsi une nouvelle hégémonie régionale en Afrique de l'Est.\n\nAprès que les troupes du PAE ont réussi à pénétrer en territoire soudanais et ont commencé à avancer vers le sud de l'Égypte, menaçant Le Caire, la CN a dû accepter la défaite. Les espoirs d'un Nil à écoulement libre sont anéantis et l'Égypte sera contrainte d'accepter l'importation d'eau comme seule alternative à sa sécheresse de façon permanente. Suite à la capitulation de la CN, le Soudan du Sud a été officiellement admis au sein de la FAE, la Somalie et l'Érythrée ont toutes deux été contraintes de céder aux exigences éthiopiennes.\n\nAlors que la sécheresse continue de s'aggraver au-delà du barrage de la Renaissance, l'instabilité consume la nation vaincue d'Égypte." terminé..."
 news.179.t: "Canal de Suez Bloqué"
 news.179.d: "LE CAIRE (BLOOMBERG) - Les navires dans le canal de Suez sont détournés vers un ancien canal ce mercredi (24 mars) après qu'un grand porte-conteneurs s'est échoué, bloquant le passage de l'une des voies navigables les plus importantes du monde, ont déclaré des sources maritimes et des entreprises impliquées. La coque du porte-conteneurs de 400 mètres Ever Given s'est coincée en travers du canal mardi, provoquant un embouteillage d'au moins 100 navires cherchant à transiter entre la mer Rouge et la Méditerranée, selon des courtiers maritimes et des données cartographiques compilées par Bloomberg.\nLes prix du pétrole ont fluctué mercredi alors que les investisseurs évaluaient l'impact sur les flux mondiaux de brut.\nLes affréteurs de navires ou leurs propriétaires qui ne souhaitent pas attendre que le blocage soit levé peuvent opter pour un détour par l'Afrique du Sud, bien que ce soit un itinéraire bien plus long qui prendrait plus de temps et augmenterait les coûts."
 news.179.a: "Gros bateau coincé lol"
