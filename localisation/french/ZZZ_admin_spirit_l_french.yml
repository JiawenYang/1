l_french:
 MD_admin_spirit_CHI:0 "Bureaucratie d'État-parti chinoise"
 MD_admin_spirit_CHI_desc:0 "§gLa Chine est un État unitaire dirigé par le parti, où le centre gouverne par quatre échelons — province, municipalité, district, canton — et une chaîne parallèle de comités du parti, tandis que les collectivités conservent une réelle marge d'appréciation sur le foncier et les finances. Les quotas d'effectifs sont fixés d'en haut échelon par échelon, ce qui rend la hiérarchie rigide et difficile à comprimer ; les réformes finissent le plus souvent par renommer des organes et redéployer des agents.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_chi_banner"
 MD_admin_spirit_SOV:0 "Verticale du pouvoir russe"
 MD_admin_spirit_SOV_desc:0 "§gLa Russie soude sa fédération et ses ministères par une présidence forte : les districts fédéraux et la nomination des gouverneurs intègrent les régions à la chaîne d'évaluation du centre, tandis que les verticales ministérielles couvrent la sécurité, l'énergie et les finances. La fonction publique et le secteur public forment un ensemble enraciné, si bien que les rationalisations s'arrêtent au renommage des institutions et au maintien des effectifs. L'inertie institutionnelle est donc difficile à briser.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sov_banner"
 MD_admin_spirit_USA:0 "Fonction publique fédérale américaine"
 MD_admin_spirit_USA_desc:0 "§gLes États-Unis sont une république présidentielle fédérale où le pouvoir fédéral se limite aux matières énumérées et le reste est réservé aux États ; les fonctionnaires sont recrutés au mérite et les nominations politiques côtoient les carrières administratives. Les lois de crédits ne décident que du montant alloué, tandis que la création d'une agence exige une loi du Congrès : l'échelon administratif est donc difficile à déplacer.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_usa_banner"
 MD_admin_spirit_ENG:0 "Fonction publique de Westminster"
 MD_admin_spirit_ENG_desc:0 "§gLa Grande-Bretagne est un État unitaire de type Westminster où le Trésor et le Cabinet Office coordonnent les ministères, l'Écosse, le pays de Galles et l'Irlande du Nord bénéficiant d'une dévolution. Les fonctionnaires permanents sont recrutés par concours et politiquement neutres, et les coupes frappent d'abord les contrats externalisés plutôt que les postes centraux. Les collectivités dépendent fortement des dotations de l'État.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_eng_banner"
 MD_admin_spirit_KOR:0 "Bureaucratie d'examen coréenne"
 MD_admin_spirit_KOR_desc:0 "§gLa Corée du Sud est une république unitaire organisée en provinces, villes et comtés jusqu'aux cantons, le centre dominant par les nominations et les transferts financiers, l'autonomie locale ne s'affirmant qu'à Sejong et Jeju. Le corps supérieur de la fonction publique lie promotion et nomination politique, si bien que toute modification des effectifs doit survivre à l'Assemblée nationale et à l'opinion.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_kor_banner"
 MD_admin_spirit_BRA:0 "Oligarchie fédérale brésilienne"
 MD_admin_spirit_BRA_desc:0 "§gLe Brésil est une république fédérale où vingt-six États, le district fédéral et des milliers de municipalités sont tous sujets fédéraux, la Constitution de 1988 leur ayant dévolu taxes et dépenses. Les systèmes de personnel fédéral et étatiques restent séparés, tandis que la loi de responsabilité fiscale impose des contraintes dures à la dette et à la masse salariale.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_bra_banner"
 MD_admin_spirit_PER:0 "Administration cléricale iranienne"
 MD_admin_spirit_PER_desc:0 "§gL'Iran est une république islamique organisée en provinces, comtés, districts et cantons, les gouverneurs étant nommés par le ministère de l'Intérieur et les conseils locaux élus disposant de pouvoirs limités. Les Gardiens de la révolution, les fondations religieuses et les organismes quasi étatiques absorbent d'énormes ressources, laissant au budget le seul partage annuel des recettes pétrolières. L'efficacité administrative en souffre.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_per_banner"
 MD_admin_spirit_AST:0 "Fonction publique fédérale australienne"
 MD_admin_spirit_AST_desc:0 "§gL'Australie est une fédération où le pouvoir du Commonwealth se limite aux matières énumérées, les États conservant le reste et les collectivités étant créées par la loi étatique. Le Commonwealth prélève les principaux impôts et les répartit entre les États via la Commission des subventions, chaque État gérant sa propre fonction publique, ce qui rend les mutations difficiles. L'autonomie locale est donc limitée.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ast_banner"
 MD_admin_spirit_VIE:0 "Administration d'État-parti vietnamienne"
 MD_admin_spirit_VIE_desc:0 "§gLe Viêt Nam est un État unitaire où parti et État avancent en parallèle : provinces, districts et communes ont chacun un conseil et un comité populaire, et la chaîne organisationnelle du parti atteint la base. Les quotas sont fixés centralement, les dépenses locales dépendent des transferts et des recettes foncières, et les règles de personnel et de parti décident qui répond de quoi. L'efficacité est bridée par ce double circuit.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_vie_banner"
 MD_admin_spirit_SWE:0 "Administration sociale décentralisée suédoise"
 MD_admin_spirit_SWE_desc:0 "§gLa Suède est un État unitaire doté d'une autonomie locale garantie par la Constitution : 290 communes et 21 conseils de comté lèvent leurs propres impôts et assurent l'essentiel de l'éducation et de la santé. Les ministères centraux sont réduits et l'exécution est déléguée à des agences indépendantes, tandis que les licenciements exigent négociation collective et procédure légale. L'impôt local finance les services publics.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swe_banner"
 MD_admin_spirit_HOL:0 "Administration de compromis néerlandaise"
 MD_admin_spirit_HOL_desc:0 "§gLes Pays-Bas sont un État unitaire décentralisé de douze provinces, de centaines de communes et de conseils des eaux, les communes jouissant d'une large autonomie en aménagement du territoire et en action sociale. Les ministères centraux sont petits et l'exécution déléguée à des agences, tandis que les finances locales dépendent de fonds communaux et provinciaux répartis par formule. Toute réforme passe par un compromis entre partis.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_hol_banner"
 MD_admin_spirit_GER:0 "Fédéralisme administratif allemand"
 MD_admin_spirit_GER_desc:0 "§gL'Allemagne est une fédération où la Loi fondamentale confie l'exécution aux Länder, le Bund ne gardant que les affaires étrangères, la défense, la monnaie et la législation-cadre. Les fonctionnaires fédéraux et régionaux relèvent de deux carrières viagères distinctes, et les impôts partagés avec la péréquation financière décident qui a l'argent et qui administre. Le fédéralisme administratif empêche Berlin de commander directement les Länder.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ger_banner"
 MD_admin_spirit_POL:0 "Autonomie locale polonaise"
 MD_admin_spirit_POL_desc:0 "§gLa Pologne est un État unitaire de seize voïvodies, plusieurs centaines de powiats et plus d'un millier de communes, chacune dotée d'un conseil élu, le voïvode étant nommé par le centre et contrôlant les collectivités. La fonction publique héritée de la transition est pléthorique, et les finances locales dépendent des dotations péréquatrices et des impôts partagés. Le partage des tâches entre voïvode et conseils élus reste flou.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pol_banner"
 MD_admin_spirit_JAP:0 "Bureaucratie de Kasumigaseki"
 MD_admin_spirit_JAP_desc:0 "§gLe Japon est un État unitaire où les ministères réunis à Kasumigaseki coordonnent l'administration nationale, les préfectures mêlant délégation centrale et autonomie locale, les municipalités gérant les affaires de proximité. Les fonctionnaires nationaux et locaux forment deux filières distinctes, et l'emploi à vie fondé sur l'ancienneté ne permet qu'un lent redressement des effectifs. Le contrôle du centre sur les collectivités reste donc solide.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_jap_banner"
 MD_admin_spirit_FRA:0 "Centralisme préfectoral français"
 MD_admin_spirit_FRA_desc:0 "§gLa France est un État unitaire centralisé où le préfet représente l'État dans le département et les ministères se répartissent par fonction verticale. Les lois de décentralisation de 1982 ont redessiné les compétences des régions, départements et communes, mais les services déconcentrés et les collectivités coexistent depuis longtemps avec des responsabilités enchevêtrées. Compétences centrales et locales restent en tension.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_fra_banner"
 MD_admin_spirit_ITA:0 "Autonomie régionale italienne"
 MD_admin_spirit_ITA_desc:0 "§gL'Italie est une république unitaire héritière du système provincial sarde, et la réforme constitutionnelle de 2001 a dévolu le pouvoir législatif aux régions, déplaçant santé, transports et formation professionnelle. Les finances et le personnel restent largement aux mains de Rome, d'où une responsabilité dispersée et des lignes d'autorité croisées, la réforme dépassant rarement le stade du papier.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ita_banner"
 MD_admin_spirit_RAJ:0 "Fonction publique coloniale indienne"
 MD_admin_spirit_RAJ_desc:0 "§gL'Inde est une république fédérale qui partage les compétences entre l'Union et les États, les services panindiens étant recrutés au centre et affectés dans les États, formant un lien de personnel central sur des postes locaux. Les effectifs sont contraints par la politique de réservation selon la caste et la région, si bien qu'expansion et réduction perturbent l'équilibre politique. L'expansion a longtemps absorbé le chômage.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_raj_banner"
 MD_admin_spirit_TUR:0 "Centralisme présidentiel turc"
 MD_admin_spirit_TUR_desc:0 "§gLa Turquie est une république unitaire où les gouverneurs de province sont nommés par le ministère de l'Intérieur et répondent au centre, les municipalités agissant selon la loi municipale. Après le référendum de 2017 instaurant le régime présidentiel, le cœur administratif s'est déplacé vers le palais présidentiel, et la loi n° 657 rend les effectifs bien moins sensibles aux finances qu'à la loyauté politique. L'efficacité cède à la loyauté.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tur_banner"
 MD_admin_spirit_ISR:0 "Administration des lois fondamentales"
 MD_admin_spirit_ISR_desc:0 "§gIsraël n'a pas de constitution écrite et définit ses institutions par une série de lois fondamentales, laissant aux ministères un large pouvoir d'appréciation sur les affaires locales. Les collectivités sont élues mais dépendent des dotations centrales, tandis que les conventions collectives et l'emploi à vie rendent les effectifs faciles à étendre et difficiles à réduire. Le budget est étroitement contrôlé par le ministère des Finances.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_isr_banner"
 MD_admin_spirit_CAN:0 "Fédéralisme provincial canadien"
 MD_admin_spirit_CAN_desc:0 "§gLe Canada est une fédération où la constitution de 1867 confie éducation, santé et services sociaux aux provinces, les municipalités étant créatures du droit provincial. Ottawa oriente les collectivités par des transferts conditionnels, les statuts de personnel provinciaux diffèrent largement, et toute modification des effectifs doit passer par les règles des commissions. La coordination fédérale repose donc sur la négociation.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_can_banner"
 MD_admin_spirit_PAK:0 "Secrétariat fédéral pakistanais"
 MD_admin_spirit_PAK_desc:0 "§gLe Pakistan est une république fédérale où le secrétariat fédéral et les secrétaires en chef provinciaux forment deux voies, les officiers de district poursuivant le rôle intégrateur de l'administration coloniale. Le dix-huitième amendement de 2010 a dévolu éducation et santé aux provinces, tandis que l'allocation des cadres reste liée à l'équilibre régional et aux quotas réservés.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pak_banner"
 MD_admin_spirit_NKO:0 "Planification d'État-parti nord-coréenne"
 MD_admin_spirit_NKO_desc:0 "§gLa Corée du Nord organise l'administration sur l'unité parti-État : le cabinet gouverne les provinces et les comités populaires des villes et comtés, et la commission de planification fixe des objectifs annuels et quinquennaux. Recettes et dépenses sont mises en commun, les localités n'ont presque aucune base fiscale propre, et les cadres sont gérés par le département organisationnel du parti. L'efficacité cède à la mobilisation.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nko_banner"
 MD_admin_spirit_UKR:0 "Administration présidentielle ukrainienne"
 MD_admin_spirit_UKR_desc:0 "§gL'Ukraine a hérité de la structure républicaine soviétique des oblasts, raïons et municipalités ; les gouverneurs sont nommés par le président, tandis que les municipalités appliquent les principes européens d'autonomie locale. La décentralisation d'après 2014 a dévolu des pouvoirs fiscaux, mais la mobilisation de guerre et l'influence oligarchique maintiennent les effectifs instables. Les compétences centrales et locales restent contestées.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ukr_banner"
 MD_admin_spirit_SAU:0 "Gouvernorats royaux saoudiens"
 MD_admin_spirit_SAU_desc:0 "§gL'Arabie saoudite est une monarchie absolue où les provinces sont gouvernées par des gouverneurs nommés par la royauté, subdivisées en districts et comtés, l'administration s'entremêlant à l'autorité tribale et religieuse. Les recettes pétrolières sont converties en capacité administrative par les plans quinquennaux, et créer ou supprimer une agence exige un décret royal. L'efficacité dépend de la volonté royale.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sau_banner"
 MD_admin_spirit_SWI:0 "Système du Conseil fédéral suisse"
 MD_admin_spirit_SWI_desc:0 "§gLa Suisse est une fédération où la Confédération ne détient que des pouvoirs énumérés, les vingt-six cantons conservant une large souveraineté et les communes s'administrant selon le droit cantonal. L'administration repose sur le service de milice et le temps partiel, et toute extension peut être soumise au référendum, ce qui exige l'accord des parlements cantonaux et des électeurs. Confédération et cantons agissent par négociation plutôt que par ordre.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swi_banner"
 MD_admin_spirit_SPR:0 "État des autonomies espagnol"
 MD_admin_spirit_SPR_desc:0 "§gL'Espagne est un État des autonomies où dix-sept communautés autonomes coexistent avec les provinces et les communes, le centre conservant défense, affaires étrangères et coordination macroéconomique. Les conflits de compétences sont tranchés par le Tribunal constitutionnel, le Pays basque et la Navarre jouissent de droits fiscaux particuliers, et la négociation traverse tout le système. Chaque révision de statut est un marchandage politique.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_spr_banner"
 MD_admin_spirit_EGY:0 "Administration centralisée égyptienne"
 MD_admin_spirit_EGY_desc:0 "§gL'Égypte est un État unitaire fortement centralisé où les gouverneurs sont nommés par le président, les provinces divisées en districts et villages, et les conseils locaux dotés d'un statut électif limité. L'économie gérée par l'armée pénètre profondément les infrastructures et les services sociaux, et l'extension des effectifs a longtemps servi à absorber l'emploi. L'efficacité cède souvent à la stabilité sociale.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_egy_banner"
 MD_admin_spirit_MEX:0 "Constitutions fédérales mexicaines"
 MD_admin_spirit_MEX_desc:0 "§gLe Mexique est une république fédérale où trente et un États et Mexico possèdent chacun une constitution et un congrès, les municipalités formant la base de l'autonomie et la fédération contrôlant l'essentiel des recettes. Une fonction publique fédérale s'est construite après la démocratisation de 2000, mais États et municipalités gardent leurs propres règles de personnel. Les transferts sont le levier de la fédération.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_mex_banner"
 MD_admin_spirit_NRY:0 "Autonomie municipale norvégienne"
 MD_admin_spirit_NRY_desc:0 "§gLa Norvège est un État unitaire où le comté est l'échelon régional de l'État et les communes assurent éducation, santé et action sociale selon la loi sur les collectivités. Les recettes pétrolières sont isolées du budget annuel par le fonds souverain et la règle budgétaire, ce qui stabilise les dépenses administratives et tempère les velléités d'expansion. Les fusions de communes exigent l'accord des habitants.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nry_banner"
 MD_admin_spirit_TAI:0 "Fonction publique des cinq yuan"
 MD_admin_spirit_TAI_desc:0 "§gTaïwan organise le gouvernement selon le cadre constitutionnel de la République de Chine en cinq pouvoirs, le Yuan des examens contrôlant concours et nominations, la qualification d'agent public devant être acquise par examen. Après la simplification du niveau provincial, centre et collectivités traitent directement, tandis que les finances locales dépendent de la répartition des impôts. Centre et localités partagent les tâches par dotations et négociation.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tai_banner"
 MD_admin_spirit_IND:0 "Autonomie locale indonésienne"
 MD_admin_spirit_IND_desc:0 "§gL'Indonésie est un État unitaire allant des provinces aux kabupaten et villes, puis aux districts et villages, le gouverneur étant à la fois représentant du centre et chef autonome. Les lois d'autonomie de 1999 ont dévolu fonctions et recettes aux kabupaten et villes, et les villages ont obtenu un budget propre en vertu de la loi villageoise. L'expansion a longtemps absorbé l'emploi.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ind_banner"
