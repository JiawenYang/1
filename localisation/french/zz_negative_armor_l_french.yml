 ZZ_neg_armor_heavy: "Module de lest de bataillon combiné lourd"
 ZZ_neg_armor_heavy_1: "Module de lest de bataillon combiné lourd"
 ZZ_neg_armor_heavy_desc: "Ensemble de lest standardisé embarqué sur les véhicules du bataillon combiné lourd afin d'équilibrer la répartition des masses et la contrainte de suspension. Accessoire logistique, non compté dans les effectifs de véhicules."
