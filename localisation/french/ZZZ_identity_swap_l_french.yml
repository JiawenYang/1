l_french:
 zzz_identity.1.t:0 "Une adhésion signée sous un nouveau drapeau"
 zzz_identity.1.d:0 "Dans le règlement d'après-guerre de [ROOT.GetName], le gouvernement de collaboration nouvellement formé n'a conservé aucune de ses anciennes identités d'alliance. Lors de la cérémonie de signature, le ministre des Affaires étrangères a annoncé que les alliances militaires et les accords économiques du pays seraient réenregistrés selon le nouvel ordre régional : les anciens noms rayés, les nouveaux inscrits. La version officielle parle de la fin de l'isolement et d'un retour à la coopération régionale ; ce que voient les voisins, ce sont les mêmes ports et les mêmes bases, avec d'autres personnes qui signent les papiers."
 zzz_identity.1.a:0 "Le nouveau registre ne porte aucun ancien nom."
 zzz_identity.2.t:0 "Le vieux nom revient"
 zzz_identity.2.d:0 "Le gouvernement de collaboration a pris fin et [ROOT.GetName] détient de nouveau ses propres documents diplomatiques. Le premier acte du nouveau cabinet est de rétablir, une par une, les traités signés avant la guerre : alliances militaires, arrangements tarifaires, monnaies de règlement, tout retrouve sa place d'origine. Personne n'explique pourquoi ces documents mériteraient plus de respect que les frontières d'il y a deux ans, mais les drapeaux sur les ports et les bases ont bel et bien été remis en place."
 zzz_identity.2.a:0 "Les traités reviennent, clause par clause."
 zzz_identity.3.t:0 "Un nom de plus sur la liste"
 zzz_identity.3.d:0 "Washington a inscrit [ROOT.GetName] sur la liste des principaux alliés non membres de l'OTAN. Ce n'est pas un traité d'alliance : pas de clause de défense mutuelle, pas de garnison. Ce que cela achète, c'est une file prioritaire pour les ventes d'armes, un siège dans les exercices conjoints et un canal d'approvisionnement moins cher. Le département d'État parle d'approfondir le partenariat ; la liste elle-même n'a jamais été ouverte à plus d'une poignée de pays."
 zzz_identity.3.a:0 "Le seuil pour les armes et les exercices baisse."
 zzz_identity.4.t:0 "Le nom est rayé"
 zzz_identity.4.d:0 "Washington a mis à jour la liste et [ROOT.GetName] n'y figure plus. Aucune note, aucune explication, seulement un procès-verbal technique : ventes d'armes prioritaires retirées, siège dans les exercices repris, groupe de partage technologique fermé. Le pays constate qu'il n'a perdu aucun traité — parce qu'il n'en a jamais eu."
 zzz_identity.4.a:0 "Les privilèges sont retirés discrètement."
