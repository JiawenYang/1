 SLO.Conservative_icon: "£generic_Conservative_small"
 SLO.Conservative_desc: "(Réactionnaire) - Gens ordinaires et personnalités indépendantes (OĽaNO-NOVA)\n\nOĽaNO-NOVA est un mouvement conservateur populiste dirigé par Igor Matovič, construit autour du combat contre la corruption et les privilèges des partis établis. Il se présente comme un mouvement de citoyens ordinaires, combinant des positions socialement conservatrices sur la famille et la migration avec de généreuses prestations familiales et une politique étrangère pro-européenne.\n\nLe mouvement est fortement centralisé autour de son fondateur et s'appuie sur un vote protestataire déçu par Smer-SD et par la droite traditionnelle. Son influence repose sur la notoriété publique de Matovič, son programme anticorruption et son attractivité auprès des électeurs conservateurs des petites villes et des zones rurales."
 POL.conservatism_1_desc: "Conservatisme - Prawo i Sprawiedliwość (Droit et justice)\n\nPiS est le principal parti national-conservateur et chrétien-démocrate polonais, combinant l'interventionnisme économique et le bien-être social avec une perspective socialement conservatrice. Il prône une coopération prudente avec l'Union européenne et est résolument anti-russe."
 POL.Conservative_2017_desc: "Conservatisme - Prawo i Sprawiedliwość (Droit et justice)\n\nPiS est le principal parti national-conservateur et chrétien-démocrate polonais, combinant l'interventionnisme économique et le bien-être social avec une perspective socialement conservatrice. Il prône une coopération prudente avec l'Union européenne et est résolument anti-russe."
 CZE.Conservative_desc: "(Populisme) - ANO 2011 (tchèque : ANO 2011, Akce nespokojených občanů, ANO)\n\nANO 2011 est un mouvement populiste construit autour de l'homme d'affaires milliardaire Andrej Babiš, qui promet de diriger l'État comme une entreprise. Il fait campagne contre la corruption et les partis établis, et pour une gestion compétente, des coûts plus faibles pour les familles ordinaires, des pensions plus élevées et un contrôle plus strict de la migration.\n\nLe mouvement est centralisé et fidèle à son fondateur, et son idéologie flexible lui permet de recueillir des voix à gauche comme à droite. Il est sceptique quant à l'approfondissement de l'intégration européenne et à l'euro. Son influence repose sur l'empire commercial de Babiš, sa popularité personnelle et une base solide parmi les électeurs âgés et des petites villes."
 HUN.Conservative_desc: "(Réactionnaire) - Le Fidesz-Union civique hongroise est le parti national-conservateur dominant de Hongrie, dirigé par Viktor Orbán. Il combine un État fort, l'interventionnisme économique et de généreuses subventions familiales avec une démocratie se revendiquant illibérale, une ligne dure sur la migration et une politique de souveraineté avant tout.\n\nLe Fidesz est ouvertement eurosceptique et méfiant envers les institutions libérales occidentales, tout en cultivant des liens pragmatiques avec la Russie et d'autres puissances non occidentales. Son influence repose sur sa supermajorité au Parlement, son contrôle d'une grande partie des médias et la fidélité d'un large électorat conservateur hors de Budapest."
 HUN.Neutral_conservatism_desc: "(Réactionnaire) - Le Fidesz-Union civique hongroise est le parti national-conservateur dominant de Hongrie, dirigé par Viktor Orbán. Il combine un État fort, l'interventionnisme économique et de généreuses subventions familiales avec une démocratie se revendiquant illibérale, une ligne dure sur la migration et une politique de souveraineté avant tout.\n\nLe Fidesz est ouvertement eurosceptique et méfiant envers les institutions libérales occidentales, tout en cultivant des liens pragmatiques avec la Russie et d'autres puissances non occidentales. Son influence repose sur sa supermajorité au Parlement, son contrôle d'une grande partie des médias et la fidélité d'un large électorat conservateur hors de Budapest."
