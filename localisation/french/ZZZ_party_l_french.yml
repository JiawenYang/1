l_french:
 zzz_party.1.t:0 "Un nouveau gouvernement à Jakarta"
 zzz_party.1.d:0 "Au lendemain de la Grande Guerre d'Asie, le paysage politique indonésien a été entièrement remodelé. Avec l'accord des autorités d'occupation, une droite nationaliste pro-japonaise centrée sur la famille Suharto est revenue à Jakarta, a formé un gouvernement autoritaire et entrepris de reconstruire l'économie d'après-guerre et l'ordre de l'archipel."
 zzz_party.1.a:0 "Reconnaître le nouveau gouvernement"
 zzz_party.4.t:0 "Changement de régime à Taipei"
 zzz_party.4.d:0 "Une fois le règlement politique concernant Taïwan conclu, l'équipe dirigeante de Taipei a été remplacée et les forces politiques de l'île se sont réorganisées. La nouvelle administration a commencé à s'intégrer aux réseaux économiques et maritimes du continent."
 zzz_party.4.a:0 "Reconnaître le nouveau gouvernement"
 zzz_party.5.t:0 "Un gouvernement rouge à Tokyo"
 zzz_party.5.d:0 "Après la défaite du Japon, la longue domination du Parti libéral-démocrate s'est effondrée. Le Parti communiste japonais a accédé au pouvoir grâce aux élections d'après-guerre et au soutien des syndicats, annonçant la dissolution des zaibatsu, des nationalisations et la reconstruction d'un ordre constitutionnel pacifiste."
 zzz_party.5.a:0 "Reconnaître le nouveau gouvernement"
 zzz_party.90.t:0 "$COUNTRY$ forme un gouvernement de collaboration"
 zzz_party.90.d:0 "Après sa défaite militaire, l'ancien régime de $COUNTRY$ s'est effondré. Un gouvernement de collaboration nouvellement formé a pris l'administration avec le soutien des autorités d'occupation et a annoncé une orientation socialiste."
 zzz_party.90.a:0 "Reconnaître le gouvernement de collaboration"
 zzz_party.91.t:0 "$COUNTRY$ forme un gouvernement pro-occidental"
 zzz_party.91.d:0 "Après sa défaite militaire, l'ancien régime de $COUNTRY$ s'est effondré. Un gouvernement provisoire nouvellement formé a pris l'administration avec le soutien des autorités d'occupation, annonçant un système démocratique pro-occidental et le rétablissement d'élections multipartites."
 zzz_party.91.a:0 "Reconnaître le gouvernement provisoire"
 zzz_party.92.t:0 "$COUNTRY$ forme un gouvernement nationaliste pro-japonais"
 zzz_party.92.d:0 "Après sa défaite militaire, l'ancien régime de $COUNTRY$ s'est effondré. Avec le soutien des autorités d'occupation, une droite nationaliste pro-japonaise a pris l'administration, proclamant un régime autoritaire et maintenant des liens étroits avec les réseaux économiques et sécuritaires du Japon."
 zzz_party.92.a:0 "Reconnaître le nouveau gouvernement"
 zzz_party.93.t:0 "Proclamation de la République du Viêt Nam"
 zzz_party.93.d:0 "Après la victoire du Japon dans la Grande Guerre d'Asie, l'ancien régime vietnamien s'est effondré. Soutenus par les autorités d'occupation, des politiciens anticommunistes du Sud dirigés par le Premier ministre Nguyen Huu Chanh ont proclamé la République du Viêt Nam, unifié le pays sous Saigon et rétabli le drapeau jaune à trois bandes rouges."
 zzz_party.93.a:0 "Reconnaître la République du Viêt Nam"
