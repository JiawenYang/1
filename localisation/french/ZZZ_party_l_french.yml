 HUN.Conservative: "£HUN_emerging_reactionary Fidesz-Union civique hongroise"
 HUN.Autocracy: "£generic_Autocracy_small Jobbik"
 HUN.Autocracy_icon: "£generic_Autocracy_small"
 HUN.Autocracy_desc: "(Autocratie) - Le Jobbik, Mouvement pour une meilleure Hongrie, est un parti nationaliste radical qui combine un discours anti-establishment avec un programme de renaissance nationale, une autorité étatique forte et une hostilité ouverte à la démocratie libérale.\n\nLe Jobbik a bâti sa base sur l'agitation anti-Roms et antisémite ainsi que sur l'hostilité à l'UE et à l'OTAN ; ces dernières années, il a adouci son image mais a conservé un noyau nationaliste dur. Son influence repose sur les électeurs protestataires du nord-est pauvre, un réseau d'activistes disciplinés et sa volonté de coopérer avec toute force qui défie les partis traditionnels."
 HUN.Neutral_conservatism: "£HUN_non_aligned_conservative Fidesz-Union civique hongroise"
 CZE.Conservative: "£generic_Conservative_small ANO 2011"
 CZE.Conservative_2015: "£generic_Conservative_small ANO 2011"
 CZE.Conservative_2015_icon: "£generic_Conservative_small"
 CZE.Conservative_2015_desc: "(Populisme) - ANO 2011 (tchèque : ANO 2011, Akce nespokojených občanů, ANO)\n\nANO 2011 est un mouvement populiste construit autour de l'homme d'affaires milliardaire Andrej Babiš, qui promet de diriger l'État comme une entreprise. Il fait campagne contre la corruption et les partis établis, et pour une gestion compétente, des coûts plus faibles pour les familles ordinaires, des pensions plus élevées et un contrôle plus strict de la migration.\n\nLe mouvement est centralisé et fidèle à son fondateur, et son idéologie flexible lui permet de recueillir des voix à gauche comme à droite. Il est sceptique quant à l'approfondissement de l'intégration européenne et à l'euro. Son influence repose sur l'empire commercial de Babiš, sa popularité personnelle et une base solide parmi les électeurs âgés et des petites villes."
