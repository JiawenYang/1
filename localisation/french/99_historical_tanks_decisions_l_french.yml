 pokpung_ho_decision:0 "Créer le design Pokpung-ho"
 pokpung_ho_decision_desc:0 "Le Pokpung-ho est un char de combat principal nord-coréen développé à partir du T-72. Il est équipé d'un canon de 125mm et d'une armure réactive, le développement a commencé en 2002."

 songun_ho_decision:0 "Créer le design Songun-ho"
 songun_ho_decision_desc:0 "Le Songun-ho est une variante améliorée du Pokpung-ho avec une protection d'armure et des systèmes de contrôle de tir améliorés, introduit dans les années 2010."

 m2020_decision:0 "Créer le design M-2020"
m2020_decision_desc:0 "Le M-2020 est le nouveau char de combat principal de la Corée du Nord, dévoilé en 2020. Il ressemble au design russe T-14 Armata avec une station d'armes à distance et une armure composite."

m2010_decision:0 "Créer le design M-2010"
m2010_decision_desc:0 "Le M-2010 est un véhicule blindé de transport de troupe nord-coréen introduit dans les années 2010, avec une armure composite et un armement amélioré."

juchepo_decision:0 "Créer le design Juche-Po"
juchepo_decision_desc:0 "Le Juche-Po est un système d'artillerie automoteur nord-coréen avec un contrôle de tir avancé et des munitions à portée étendue."

zulfiqar3_decision:0 "Créer le design Zulfiqar-3"
zulfiqar3_decision_desc:0 "Le Zulfiqar-3 est la dernière variante de la série de chars iraniens Zulfiqar avec une protection d'armure et une puissance de feu améliorées, entré en service en 2016."

moharram6_decision:0 "Créer le design Moharram-6"
moharram6_decision_desc:0 "Le Moharram-6 est un système de missiles sol-air automoteur iranien utilisant la technologie de lancement vertical."