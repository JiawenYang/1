 c5m_decision:0 "Créer le design C-5M Super Galaxy"
 c5m_decision_desc:0 "Le C-5M Super Galaxy est le transporteur strategique le plus capable au monde. Il peut transporter jusqu'a 129 tonnes de fret, y compris deux chars M1 Abrams, et a une autonomie de plus de 5 500 milles avec une charge utile de 120 000 livres."

 f15ex_decision:0 "Créer le design F-15EX Eagle II"
 f15ex_decision_desc:0 "Le F-15EX Eagle II est une variete avancee du F-15 Eagle. Il dispose d'un avionique ameliore avec radar AN/APG-82, d'une capacite de charge d'armes accruee de plus de 29 000 livres sur 23 points d'ancrage, et peut transporter jusqu'a 12 missiles AMRAAM."

 b21_decision:0 "Créer le design B-21 Raider"
 b21_decision_desc:0 "Le B-21 Raider est un bombardier strategique de nouvelle generation developpe par Northrop Grumman. Il dispose d'une technologie de furtivite avancee, de capacites de frappe a longue portee, et est concu pour penetrer les systemes de defense aerienne modernes."

 rq4_decision:0 "Créer le design RQ-4 Global Hawk"
 rq4_decision_desc:0 "Le RQ-4 Global Hawk est un vehicule aerien sans pilote haute altitude et longue endurance. Il est concu pour des missions de renseignement, surveillance et reconnaissance a haute altitude."

 mq9_decision:0 "Créer le design MQ-9 Reaper"
 mq9_decision_desc:0 "Le MQ-9 Reaper est un vehicule aerien de combat sans pilote a endurance longue et altitude moyenne. Il est concu pour des missions de frappe de precision et de reconnaissance."

 ac130j_decision:0 "Créer le design AC-130J Ghostrider"
 ac130j_decision_desc:0 "L'AC-130J Ghostrider est un avion de cannoniere modernise. Il dispose d'un avionique avance, de munitions de precision et d'un canon de 30mm pour des missions de support aerien rapproche."

 e7_decision:0 "Créer le design E-7 Wedgetail"
 e7_decision_desc:0 "L'E-7 Wedgetail est un avion moderne de surveillance et de commande aerienne. Il dispose d'un radar a balayage electronique multi-roles pour la gestion du combat aerien et le commandement."

 j10a_decision:0 "Créer le design Chengdu J-10A"
 j10a_decision_desc:0 "Le Chengdu J-10A est une variete du chasseur J-10. Il dispose d'un avionique et de capacites d'armes ameliores par rapport au J-10 initial."

 j10c_decision:0 "Créer le design Chengdu J-10C"
 j10c_decision_desc:0 "Le Chengdu J-10C est une variete avancee du chasseur J-10. Il est equipe d'un radar AESA, d'un avionique ameliore et de capacites d'armes renforcees, ce qui en fait l'un des chasseurs de quatrieme generation les plus performants de Chine."

 j11b_decision:0 "Créer le design Shenyang J-11B/BS"
 j11b_decision_desc:0 "Le Shenyang J-11B/BS est une variete chinoise du chasseur Su-27. Il est equipe d'un avionique, de moteurs et de systemes d'armes chinois, offrant des performances et une fiabilite accrues."

 j15_decision:0 "Créer le design Shenyang J-15"
 j15_decision_desc:0 "Le Shenyang J-15 est un chasseur emorque base sur le Su-33. C'est le premier chasseur emorque de Chine, concu pour des operations a partir des porte-avions Liaoning et Shandong."

 j15t_decision:0 "Créer le design Shenyang J-15T"
 j15t_decision_desc:0 "Le Shenyang J-15T est une variete amelioree du J-15 a lancement catapulte. Il dispose d'une structure renforcee et d'un train d'atterrissage pour des operations de catapultage a partir des porte-avions de type 003 de Chine."

 j15d_decision:0 "Créer le design Shenyang J-15D"
 j15d_decision_desc:0 "Le Shenyang J-15D est une variete de guerre electronique du J-15. Il est equipe de pods et de systemes de guerre electronique, offrant des capacites de brouillage a distance et d'attaque electronique."

 j16_decision:0 "Créer le design Shenyang J-16"
 j16_decision_desc:0 "Le Shenyang J-16 est un chasseur multirole lourd base sur le Su-30MKK. Il est equipe d'un avionique avance, d'un radar AESA et peut transporter une large gamme d'armes air-air et air-sol."

 j16d_decision:0 "Créer le design Shenyang J-16D"
 j16d_decision_desc:0 "Le Shenyang J-16D est une variete de guerre electronique du J-16. Il est equipe de pods de guerre electronique, de systemes de brouillage radar et de missiles anti-radiation."

 j20_decision:0 "Créer le design Chengdu J-20A"
 j20_decision_desc:0 "Le Chengdu J-20A est le premier chasseur furtif de cinquieme generation de Chine. Il dispose d'une technologie de furtivite avancee, d'une capacite de croisieres supersonique et d'une suite avionique sophistiquee."

 j20b_decision:0 "Créer le design Chengdu J-20B"
 j20b_decision_desc:0 "Le Chengdu J-20B est une variete amelioree du J-20A. Il dispose d'un avionique et de systemes d'armes plus avances, offrant des performances et des capacites de combat renforcees."

 j20s_decision:0 "Créer le design Chengdu J-20S"
 j20s_decision_desc:0 "Le Chengdu J-20S est une variete a deux sieges du J-20. Il peut etre utilise pour l'entrainement, le commandement et le controle de drones, ainsi que pour d'autres missions."

 j35_decision:0 "Créer le design Shenyang J-35"
 j35_decision_desc:0 "Le Shenyang J-35 est le premier chasseur furtif de cinquieme generation emorque de Chine. Il dispose d'une technologie de furtivite, d'un avionique avance et est concu pour des operations a partir des porte-avions chinois."

 j36_decision:0 "Créer le design Chengdu J-36"
 j36_decision_desc:0 "Le Chengdu J-36 est un avion de combat de nouvelle generation de Chine. Il dispose d'une technologie de furtivite avancee et de capacites de combat polyvalentes."

 y20_decision:0 "Créer le design Xian Y-20"
 y20_decision_desc:0 "Le Xian Y-20 est le premier transporteur strategique indigenie de Chine. Il a une capacite de charge utile de plus de 66 tonnes et peut transporter de gros equipements, y compris des chars et des helicopteres."

 y9_decision:0 "Créer le design Xian Y-9"
 y9_decision_desc:0 "Le Xian Y-9 est un avion de transport intermediaire base sur le Y-8. Il dispose de performance, d'autonomie et de capacite de charge utile ameliorees par rapport a son predecesseur."

 h6k_decision:0 "Créer le design Xian H-6K"
 h6k_decision_desc:0 "Le Xian H-6K est une variete amelioree du bombardier H-6. Il dispose d'un avionique moderne, d'une autonomie accrue et peut transporter des missiles de croisieres a longue portee."

 h6n_decision:0 "Créer le design Xian H-6N"
h6n_decision_desc:0 "Le Xian H-6N est une variete de bombardier strategique a longue portee du H-6. Il dispose d'une autonomie accrue et peut transporter des missiles balistiques lances par avion."

h6g_decision:0 "Créer le design Xian H-6G"
h6g_decision_desc:0 "Le Xian H-6G est une variete de patrouille maritime du bombardier H-6 de Chine. Base sur le H-6D, il est equipe de missiles anti-navires et d'une avionique avancee pour les missions de reconnaissance maritime."

h6j_decision:0 "Créer le design Xian H-6J"
h6j_decision_desc:0 "Le Xian H-6J est une plateforme de frappe maritime de l'armee de l'air navale chinoise. Base sur le H-6G, il dispose de capacites de ravitaillement en vol et de capacites de frappe anti-navires a longue portee ameliorees."

 kj2000_decision:0 "Créer le design Xian KJ-2000"
 kj2000_decision_desc:0 "Le Xian KJ-2000 est le premier avion de surveillance et de commande aerienne de Chine. Il est base sur la cellule Il-76 et dispose d'un systeme de radar a reseau de phased array."

 kj500_decision:0 "Créer le design Xian KJ-500"
 kj500_decision_desc:0 "Le Xian KJ-500 est un avion AEW&C de taille moyenne base sur la cellule Y-9. Il dispose d'un radar a reseau phas actif domestic."

 kj600_decision:0 "Créer le design Xian KJ-600"
 kj600_decision_desc:0 "Le Xian KJ-600 est le premier avion AEW&C emorque de Chine. Il est concu pour des operations a partir des porte-avions chinois, offrant des capacites d'alerte precoce et de commandement."

 wingloong1_decision:0 "Créer le design Chengdu Wing Loong I"
 wingloong1_decision_desc:0 "Le Chengdu Wing Loong I est un vehicule aerien sans pilote a endurance longue en altitude moyenne. Il est concu pour des missions de reconnaissance et de frappe de precision."

 wingloong2_decision:0 "Créer le design Chengdu Wing Loong II"
 wingloong2_decision_desc:0 "Le Chengdu Wing Loong II est une variete amelioree du Wing Loong I. Il dispose d'une capacite de charge utile accruee, d'une endurance plus longue et d'un avionique renforce."

 rainbow4_decision:0 "Créer le design CH Rainbow-4"
 rainbow4_decision_desc:0 "Le CH Rainbow-4 est un UAV MALE developpe par China Aerospace Science and Technology Corporation. Il est concu pour des missions de reconnaissance et de frappe."

 rainbow5_decision:0 "Créer le design CH Rainbow-5"
 rainbow5_decision_desc:0 "Le CH Rainbow-5 est une variete plus grande et plus capable des UAV de la serie Rainbow. Il dispose d'une capacite de charge utile et d'une endurance considerablement accruees."

 attack11_decision:0 "Créer le design CAIG GJ-11"
 attack11_decision_desc:0 "Le CAIG GJ-11 est un vehicule aerien de combat sans pilote furtif. Il dispose d'une conception en aile volante et est concu pour des missions de frappe de precision."

 wz7_decision:0 "Créer le design WZ-7"
 wz7_decision_desc:0 "Le WZ-7 est un UAV de reconnaissance a haute altitude et longue endurance. Il est concu pour des missions de reconnaissance strategique a haute altitude."

 z10_decision:0 "Créer le design CAIC Z-10"
 z10_decision_desc:0 "Le CAIC Z-10 est le premier helicoptere d'attaque dedie de Chine. Il est equipe d'un avionique avance, de missiles anti-char et de missiles air-air."

 su35_decision:0 "Créer le design Su-35 Flanker-E"
 su35_decision_desc:0 "Le Su-35 Flanker-E est un chasseur avance de quatrieme generation plus de Russie. Il dispose d'un avionique avance, de moteurs a poussee vectorielle et de puissants systemes d'armes."

 su57_decision:0 "Créer le design Su-57 Felon"
 su57_decision_desc:0 "Le Su-57 Felon est le premier chasseur furtif de cinquieme generation de Russie. Il dispose d'une technologie de furtivite avancee, d'une capacite de croisieres supersonique et d'une suite avionique sophistiquee."

 mig35_decision:0 "Créer le design MiG-35 Fulcrum-F"
 mig35_decision_desc:0 "Le MiG-35 Fulcrum-F est un chasseur avance de quatrieme generation plus de Russie. Il dispose d'un avionique avance et de systemes d'armes."

 su25sm3_decision:0 "Créer le design Su-25SM3"
 su25sm3_decision_desc:0 "Le Su-25SM3 est une variete modernisee du Su-25. Il dispose d'un avionique avance et de systemes d'armes, ameliorant ses capacites de combat."

 su34m_decision:0 "Créer le design Su-34M"
 su34m_decision_desc:0 "Le Su-34M est une variete modernisee du Su-34. Il dispose d'un avionique avance et de systemes d'armes, ameliorant ses capacites de combat."

 tu160m2_decision:0 "Créer le design Tu-160M2"
 tu160m2_decision_desc:0 "Le Tu-160M2 est une variete modernisee du Tu-160. Il dispose d'un avionique avance et de systemes d'armes, ameliorant ses capacites de combat."

 tu95msm_decision:0 "Créer le design Tu-95MSM"
 tu95msm_decision_desc:0 "Le Tu-95MSM est une variete modernisee du Tu-95. Il dispose d'un avionique avance et de systemes d'armes, ameliorant ses capacites de combat."

 il76md90a_decision:0 "Créer le design Il-76MD-90A"
 il76md90a_decision_desc:0 "L'Il-76MD-90A est une variete modernisee de l'Il-76. Il dispose de moteurs et d'un avionique avances, ameliorant ses performances et sa fiabilite."

 il112v_decision:0 "Créer le design Il-112V"
 il112v_decision_desc:0 "L'Il-112V est un avion de transport leger de nouvelle generation de Russie. Il est concu pour remplacer l'ancien avion de transport An-26."

 an178_decision:0 "Créer le design An-178"
 an178_decision_desc:0 "L'An-178 est un avion de transport intermediaire developpe conjointement par l'Ukraine et la Russie. Il est concu pour remplacer l'ancien avion de transport An-12."

 a50u_decision:0 "Créer le design A-50U"
 a50u_decision_desc:0 "L'A-50U est une variete modernisee de l'A-50. Il dispose d'un radar et d'un avionique avances, ameliorant ses capacites d'alerte precoce."

 a100_decision:0 "Créer le design A-100 Premier"
 a100_decision_desc:0 "L'A-100 Premier est un avion d'alerte precoce de nouvelle generation de Russie. Il dispose d'un radar a reseau de phased array actif avance et d'un avionique moderne."

 su30sm2_decision:0 "Créer le design Su-30SM2"
 su30sm2_decision_desc:0 "Le Su-30SM2 est une variete modernisee du Su-30SM. Il dispose d'un avionique avance et de systemes d'armes, ameliorant ses capacites de combat."

 mig29m2_decision:0 "Créer le design MiG-29M2"
 mig29m2_decision_desc:0 "Le MiG-29M2 est une variete modernisee du MiG-29. Il dispose d'un avionique avance et de systemes d'armes, ameliorant ses capacites de combat."

 su34mp_decision:0 "Créer le design Su-34MP"
 su34mp_decision_desc:0 "Le Su-34MP est une variete de guerre electronique du Su-34. Il dispose d'equipements et de systemes de guerre electronique avances."

 gripen_e_decision:0 "Créer le design JAS 39E Gripen"
 gripen_e_decision_desc:0 "Le JAS 39E Gripen est la derniere variete du chasseur monomoteur developpe par la societe suedoise Saab. Il dispose d'un avionique avance, d'une autonomie plus grande et d'une capacite de charge d'armes renforcee."

 rafale_f4_decision:0 "Créer le design Rafale F4"
 rafale_f4_decision_desc:0 "Le Rafale F4 est la derniere variete du chasseur Rafale developpe par la societe francaise Dassault Aviation. Il dispose d'un avionique avance, de capacites de combat polyvalentes renforcees et de ravitaillement en vol."

 typhoon_tranche3_decision:0 "Créer le design Eurofighter Typhoon"
 typhoon_tranche3_decision_desc:0 "L'Eurofighter Typhoon est un chasseur polyvalent developpe conjointement par la Grande-Bretagne, l'Allemagne, l'Italie et l'Espagne. Il dispose d'un avionique avance, d'une capacite de charge d'armes renforcee et de ravitaillement en vol."

 sirtap_decision:0 "Créer le design SIRTAP"
 sirtap_decision_desc:0 "Le SIRTAP est un systeme de drone tactique de moyenne portee developpe conjointement par plusieurs pays europeens. Il dispose de capacites de reconnaissance et de frappe legere."

 falco_evo_decision:0 "Créer le design Falco EVO"
 falco_evo_decision_desc:0 "Le Falco EVO est la derniere variete du drone Falco developpe par la societe italienne Leonardo. Il dispose d'une endurance plus longue et d'une capacite de charge utile plus grande."

 a400m_decision:0 "Créer le design A400M Atlas"
 a400m_decision_desc:0 "L'A400M Atlas est un avion de transport militaire developpe par la societe europeenne Airbus. Il dispose de capacites de transport strategique et de capacites de decollement et d'atterrissage tactiques."

 a330_mrtt_decision:0 "Créer le design A330 MRTT"
 a330_mrtt_decision_desc:0 "L'A330 MRTT est un avion de ravitaillement en vol base sur l'avion civil Airbus A330. Il dispose d'un avionique avance et de systemes de ravitaillement, offrant un support efficace aux operations aeriennes."

 a330_aewc_decision:0 "Créer le design A330 AEW&C"
 a330_aewc_decision_desc:0 "L'A330 AEW&C est un avion de surveillance et de commande aerienne base sur l'avion civil Airbus A330. Il dispose d'un radar a reseau de phased array actif avance et de systemes de commandement."

 kf21_decision:0 "Créer le design KF-21 Boramae"
 kf21_decision_desc:0 "Le KF-21 Boramae est un chasseur polyvalent de quatrieme et demi generation bimoteur developpe par la Korean Aerospace Industries. Il est equipe d'un radar AESA, d'un avionique avance et de deux moteurs."

 lca_tejas_decision:0 "Créer le design LCA Tejas Mk1"
 lca_tejas_decision_desc:0 "Le LCA Tejas est un chasseur leger monomoteur de quatrieme et demi generation developpe par la societe indienne HAL. Il dispose d'un avionique avance et de capacites d'armement de precision."

 kc390_decision:0 "Créer le design KC-390 Millennium"
 kc390_decision_desc:0 "Le KC-390 Millennium est un grand avion de transport militaire et de ravitaillement en vol developpe par la societe aeronautique bresilienne Embraer. Il dispose de capacites de transport strategique et de ravitaillement en vol."

 kawasaki_p1_decision:0 "Créer le design Kawasaki P-1"
 kawasaki_p1_decision_desc:0 "Le Kawasaki P-1 est un avion de patrouille maritime de nouvelle generation de la Marine japonaise. Il est equipe de quatre moteurs a reaction, d'un bay de charge interne et de systemes de combat anti-sous-marin."

 jf17_block3_decision:0 "Créer le design JF-17 Thunder Block 3"
 jf17_block3_decision_desc:0 "Le JF-17 Thunder Block 3 est un chasseur polyvalent de quatrieme et demi generation monomoteur developpe conjointement par la Pakistan Aeronautical Complex et la Chine. Il est equipe d'un radar AESA et de missiles air-air PL-15E."

 lca_tejas_mk2_decision:0 "Créer le design LCA Tejas Mk2"
 lca_tejas_mk2_decision_desc:0 "Le LCA Tejas Mk2 est un chasseur polyvalent moyen developpe par la societe indienne HAL a partir du Mk1. Il est equipe d'un moteur GE F414, d'un radar Uttam AESA et de 11 points d'ancrage pour l'armement."

 hurjet_decision:0 "Créer le design Hurjet"
 hurjet_decision_desc:0 "Le Hurjet est un avion d'entrainement avance et d'attaque legere developpe par la Turkish Aerospace Industries. Il est equipe d'un moteur GE F404, avec une vitesse maximale de 1,4 Mach."

 heron_tp_decision:0 "Créer le design Heron TP"
 heron_tp_decision_desc:0 "Le Heron TP est un grand drone a endurance longue developpe par la societe israelienne Israel Aerospace Industries. Il est equipe d'un moteur turbopropulseur PT6A, avec une endurance de plus de 30 heures et une capacite de charge utile de 2 tonnes."

 su75_decision:0 "Créer le design Su-75 Checkmate"
 su75_decision_desc:0 "Le Su-75 Checkmate est un chasseur furtif polyvalent leger de cinquieme generation de Russie. Il utilise une conception monomoteur, dispose d'un avionique avance et d'une capacite de charge d'armes importante."