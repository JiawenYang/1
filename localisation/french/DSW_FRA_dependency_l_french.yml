 The_Government_of_National_Defense_Democratic:0 "£GFX_TFR_game_rule_flag_FAF_French_Republic  §OLiberté§!, §YConservatisme§!, §3Patriotisme§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT:0 "§OMouvement démocrate§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT_DESC:0 "Le Mouvement démocrate, parti centriste existant depuis avant la chute de la France face aux soviets. Se présentant comme l'option raisonnable et sensée, il avance avec une vision bien plus centriste et libérale que les partis qu'il affronte.\nL'idéologie est la §ODémocratie chrétienne§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Bayrou\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT:0 "§3Union nationale conservatrice§!"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT_DESC:0 "L'Union nationale conservatrice - un curieux assemblage de valeurs conservatrices et militaires. Elle se présente comme un parti conservateur bien plus patriote que LR, se considérant comme la véritable continuation du rêve de Villiers et de De Gaulle, celui d'une France traditionaliste et patriote.\nL'idéologie est le §3Gaullisme populiste§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Stephane_Ravier\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_Republicain_TXT:0 "§YLes Républicains§!"
 The_Government_of_National_Defense_Democratic_Republicain_TXT_DESC:0 "Les Républicains, que beaucoup considèrent comme le précurseur, forment un mouvement presque identique au Rassemblement national qui l'a précédé - un mouvement conservateur cherchant à restaurer les valeurs traditionnelles de la France tout en préservant le système démocratique et l'équilibre des pouvoirs.\nL'idéologie est le §YGaullisme traditionnel§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Xavier_Bellamy\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_TXT_DESC:0 "Première élection de la nouvelle République.\n\n\n\n\n\n\n\n   £GFX_Pierre_De_Villiers\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RConditions§! :\nLe parcours §gGouvernement de§! la §aDéfense nationale§! choisit le §3Gouvernement démocratique§!."
