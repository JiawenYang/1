 NATO_victor_of_the_european_war:0 "Vainqueur de la guerre européenne"
 NATO_victor_of_the_european_war_desc:0 "En tant que dirigeants de l'UE, nous sommes les maîtres incontestés de l'Europe, ayant brisé la machine de guerre russe et protégé l'Occident de la tyrannie. Mais la victoire a un prix. Des dizaines de milliers des nôtres sont tombés au front, des régions entières ont été dévastées et l'effort de guerre a poussé notre économie à ses limites. Les cicatrices sont peut-être moins visibles ici qu'à l'Est, mais le spectre de la guerre demeure dans nos usines, dans nos rues et dans l'esprit de chaque citoyen.\n\nDésormais, une nouvelle guerre commence : celle de stabiliser, de reconstruire et de préserver la démocratie pour laquelle tant de nos garçons ont combattu et sont morts. Mais alors que l'Europe attend notre leadership, il nous faut nous demander : ce triomphe sera-t-il le début d'une ère démocratique nouvelle, ou simplement le calme avant §Rla prochaine tempête russe§! ?"
 NOR_growing_class_divide_idea:0 "Fracture sociale croissante"
 POLITICS_nicolas_mayer_rossignol_DESC:0 "Maire de Rouen, fédéraliste pro-UE somme toute banal, M. Mayer-Rossignol a remporté inopinément l'investiture pour diriger la nouvelle République indépendante de Normandie. \n\nPropulsé à un poste auquel il ne croit pas, Mayer-Rossignol fait tout et n'importe quoi pour saboter la cause normande depuis les plus hautes fonctions."
 The_6th_Republican_Constitutional_Referendum:0 "@FRA Référendum constitutionnel de la Sixième République £GFX_TFR_game_rule_flag_FRA_Radical_Sixth_Republic"
 The_6th_Republican_Constitutional_Referendum_1_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Radical_Sixth_Republic  §tConstitution radicale§!"
 The_6th_Republican_Constitutional_Referendum_1_TXT_DESC:0 "La nation est renommée République populaire française. L'idéologie devient le souverainisme socialiste.\n\n§RConditions§! :\n§pMélenchon§! ou §0Ruffin§! mène le §pNouveau Front populaire§! à la victoire aux élections générales de 2022."
