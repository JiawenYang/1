 The_6th_Republican_Constitutional_Referendum_2_TXT_DESC:0 "L'idéologie devient le progressisme.\n\n§RConditions§! :\n§0Faure§! ou §0Ruffin§! mène le §pNouveau Front populaire§! à la victoire aux élections générales de 2022."
