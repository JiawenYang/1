 LE_PEN_LOSS_AI_BEHAVIOR_TXT_DESC:0 "Après avoir terminé le focus \"Salve d'ouverture\", le parti de §3Marine Le Pen§! est choisi et elle perd l'élection de 2022 face à §OEmmanuel Macron§!. Ensuite, §3Le Pen§! quitte la présidence du Rassemblement national et §3Jordan Bardella§! en devient le nouveau dirigeant.\n\n\n\n\n\n\n\n   £GFX_FRA_emmanuel_macron\n\n\n\n\n\n\n\n\n-------------------------------------"
