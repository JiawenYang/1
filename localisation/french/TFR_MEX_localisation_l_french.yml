l_french:
 #The Fire Rises : chaîne de la guerre contre les cartels mexicains (portée)
 mexico.1.t: "Le raid réussit"
 mexico.1.d: "Les forces spéciales de la marine, guidées par des renseignements, prennent d'assaut un laboratoire dissimulé du cartel de Sinaloa et saisissent plusieurs tonnes de fentanyl et de précurseurs chimiques sans aucune perte. Lors de la conférence de presse du matin, le président parle de « la victoire la plus propre de cette guerre contre la drogue »."
 mexico.1.a: "Maintenir la pression"
 mexico.2.t: "Le raid échoue"
 mexico.2.d: "Les forces spéciales tombent dans une embuscade dans les montagnes du Michoacán et les hélicoptères d'extraction doivent abandonner. Les traces d'une fuite sont évidentes, et la liste des morts laisse le palais présidentiel silencieux."
 mexico.2.a: "Il faut trouver la taupe"
 mexico.3.t: "La caravane de migrants atteint la frontière guatémaltèque"
 mexico.3.d: "Des milliers de migrants d'Amérique centrale se rassemblent à la frontière guatémaltèque et poussent vers le nord. Washington exige que le Mexique joue le rôle de « pays tiers sûr », tandis que les gouverneurs du nord discutent déjà de leurs propres barrages routiers."
 mexico.3.a: "Fermer la frontière sud"
 mexico.3.b: "Accorder un transit humanitaire"
 mexico.4.t: "Les officiers affrontent les cartels"
 mexico.4.d: "Une patrouille de l'armée livre une fusillade de plusieurs heures avec des hommes armés au Tamaulipas, tandis que la police locale est absente. Pour la première fois, le haut commandement admet publiquement que plusieurs États ne sont plus sous contrôle gouvernemental."
 mexico.4.a: "L'armée doit assumer le maintien de l'ordre"
 mexico.5.t: "La police arrête des réfugiés américains"
 mexico.5.d: "Alors que la situation aux États-Unis se dégrade, de nombreux citoyens américains franchissent la frontière vers le nord du Mexique. La police frontalière arrête des centaines de personnes pour papiers incomplets ; les camps débordent et Washington et Mexico s'accusent mutuellement."
 mexico.5.a: "Les traiter dans les règles"
 mexico.6.t: "Sinaloa commence à s'emparer du territoire"
 mexico.6.d: "Le cartel de Sinaloa installe ouvertement des checkpoints en Basse-Californie, au Sonora, au Chihuahua et au Sinaloa-Durango, prétendant protéger les habitants de l'extorsion gouvernementale. La police fédérale se retire de la région."
 mexico.6.a: "Le gouvernement fédéral n'a pas de réponse"
 mexico.8.t: "Tierra Caliente commence à s'emparer du territoire"
 mexico.8.d: "Tierra Caliente prend le contrôle des ports et des péages au Jalisco et dans le Guerrero-Oaxaca, et des politiciens locaux apparaissent à ses conférences de presse. Mexico ne peut que regarder les recettes fiscales partir ailleurs."
 mexico.8.a: "La capitale tient bon"
 mexico.9.t: "Tamaulipas commence à s'emparer du territoire"
 mexico.9.d: "Le cartel du Tamaulipas achève son contrôle du corridor industriel au Nuevo León, à Coahuila et au Veracruz. Les usines multinationales commencent à négocier directement avec les groupes armés plutôt qu'avec le gouvernement."
 mexico.9.a: "L'industrie a trouvé de nouveaux protecteurs"
 mexico.10.t: "D'autres régions s'effondrent"
 mexico.10.d: "Le Guanajuato, le Chiapas et le Yucatán sombrent dans l'anarchie. Les milices locales, les groupes d'autodéfense indigènes et les policiers restants tracent leurs propres lignes, et le drapeau fédéral a été abaissé dans de nombreuses villes."
 mexico.10.a: "L'État se désagrège"
 mexico.11.t: "La guerre des cartels éclate"
 mexico.11.d: "Les trois cartels déclarent simultanément la guerre au gouvernement fédéral. Des unités de l'armée font défection en bloc, le système policier se désintègre et le territoire au-delà de Mexico n'est plus réellement gouverné. C'est l'heure la plus sombre depuis la fondation de la république."
 mexico.11.a: "La nation entre en état de guerre"
 mexico.12.t: "La guerre des cartels prend fin"
 mexico.12.d: "Les années de combats sont enfin terminées. Le gouvernement fédéral hisse son drapeau sur les ruines et une commission de reconstruction prend en charge la ceinture industrielle du nord dévastée. Le prix à payer fut la mémoire de toute une génération."
 mexico.12.a: "Rétablir l'ordre"
 mexico.13.t: "Reconstruction et élections"
 mexico.13.d: "Après des élections nationales retardées de deux ans, une nouvelle présidente prête serment à Mexico. Sa promesse de campagne tenait en une phrase : faire en sorte que le pays appartienne de nouveau à ses citoyens."
 mexico.13.a: "Que le pays appartienne de nouveau à ses citoyens"
