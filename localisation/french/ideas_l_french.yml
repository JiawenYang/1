USA_world_police_idea: "Policier du monde"
USA_world_police_idea_desc: "Si vous demandez à plusieurs personnes différentes leur avis sur l'implication militaire américaine au Moyen-Orient, vous obtiendrez probablement plusieurs opinions différentes et fortes. De nombreux Américains estiment que le gouvernement américain devrait se concentrer sur les affaires intérieures et que ce qui se passe au Moyen-Orient n'est « pas notre affaire ». D'autres pensent que dans cette ère moderne, l'Amérique doit avoir une présence mondiale pour protéger ses intérêts. Les divergences d'opinion sur l'interventionnisme américain dans les affaires étrangères ne sont pas nouvelles ; elles existent presque depuis la fondation des États-Unis eux-mêmes."

PRC_chinese_communist_party_idea: "Parti communiste chinois"
PRC_communist_party_of_china_dynamic: "Parti communiste chinois"
PRC_communist_party_of_china_dynamic_desc: "\n\n\n\n£GFX_chinese_communist_party\n\n\n\n\n\n§RVive le grand Parti communiste chinois !\nVive la pensée invincible de Mao Zedong !§!\n\nDepuis 1949, le PCC est le dirigeant incontesté de la Chine continentale. Même après l'effondrement de plusieurs États communistes dirigés par l'URSS, la Chine socialiste est restée en Asie de l'Est et est progressivement devenue l'un des pays les plus puissants du monde après sa réforme et son ouverture. Les raisons pour lesquelles le PCC a pu consolider sa domination en Chine, avec une population de 1,4 milliard d'habitants, ont fait l'objet de nombreux débats. Certains affirment que le PCC a abandonné son credo communiste, promettant la prospérité économique en échange de soutien, et a adopté l'idéologie traditionnelle de l'ancien empire pour maintenir le peuple dans la peur et l'obéissance. D'autres soutiennent que le PCC a réussi en infiltrant son idéologie et son organisation dans tous les aspects de la société et a été revigoré par des réformes continues. Quelle que soit la raison, une chose est certaine : §Ril faudrait une catastrophe d'ampleur apocalyptique pour renverser le géant qu'est le PCC.§!"

