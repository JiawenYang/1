PRC_pla_dynamic: "Armée populaire de libération"
PRC_pla_dynamic_desc: "\n\n\n\n\n£GFX_PRC_PLA_texticon_embed \n\n\n\n\n\n\nL'Armée populaire de libération (APL) sert de protectrice à la fois du Parti et de l'État. Par conséquent, sa structure de gestion est intégrée à la fois à l'organisation du Parti et à l'appareil d'État par l'intermédiaire de la Commission militaire centrale (CMC). Il existe en réalité deux CMC : une appartenant au Parti et l'autre à l'État (remplaçant le ministère de la Défense présent dans d'autres pays). Au sein de la structure du Parti, la CMC du Parti est un organe de haut niveau aux côtés du Comité central du Parti et de la Commission centrale de discipline du Parti. Dans la structure administrative de l'État, la CMC de l'État est un organe de haut niveau aux côtés du gouvernement, du Congrès national du peuple et de la Conférence consultative politique du peuple chinois.\n\nLe vice-président de la CMC est la plus haute position pour un officier militaire en service actif, équivalent au vice-Premier ministre du gouvernement. Le chef d'état-major, le ministre du Travail politique, le ministre de la Défense nationale et le secrétaire de la Discipline de la CMC sont également membres. Ces postes ont un rang national adjoint (au-dessus d'un ministre), deux vice-présidents faisant partie du Politburo. Selon la période, le premier vice-président peut être membre du Comité permanent. Les membres de la CMC sont proposés par le président et approuvés par le Congrès du Parti et le Congrès national du peuple à chaque session du Congrès. Les membres de la CMC ne sont responsables que devant le président de la CMC. Ni le Congrès national du peuple, ni le Comité central du Parti, ni les membres civils du Politburo ou de son Comité permanent (Premier ministre, président du Congrès national du peuple, président, secrétaire général) n'ont d'autorité sur la CMC ou les forces armées."