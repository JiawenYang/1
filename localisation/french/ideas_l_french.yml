USA_world_police_idea: "Policier du monde"
USA_world_police_idea_desc: "Si vous demandez à plusieurs personnes différentes leur avis sur l'implication militaire américaine au Moyen-Orient, vous obtiendrez probablement plusieurs opinions différentes et fortes. De nombreux Américains estiment que le gouvernement américain devrait se concentrer sur les affaires intérieures et que ce qui se passe au Moyen-Orient n'est « pas notre affaire ». D'autres pensent que dans cette ère moderne, l'Amérique doit avoir une présence mondiale pour protéger ses intérêts. Les divergences d'opinion sur l'interventionnisme américain dans les affaires étrangères ne sont pas nouvelles ; elles existent presque depuis la fondation des États-Unis eux-mêmes."


