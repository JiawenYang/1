l_french:
first_island_chain: "Première chaîne d'îles"
first_island_chain_desc: "La première chaîne d'îles désigne la chaîne d'îles dans le Pacifique occidental s'étendant vers l'est depuis la côte est-asiatique, ainsi que les vastes eaux entre elles. Elle s'étend de l'archipel japonais et des îles Ryūkyū au nord, en passant par Taïwan au centre, jusqu'aux îles Philippines et aux grandes îles de la Sonde au sud, s'étendant jusqu'à la mer de Chine méridionale. C'est la première ligne de défense dans la politique étrangère et de défense nationale américaine visant à contenir la Chine, ainsi nommée car elle est principalement composée d'îles et forme une chaîne. Les eaux de la première chaîne d'îles sont la zone la plus efficace pour les forces armées américaines afin de se défendre contre l'Armée populaire de libération de Chine."

five_eyes: "Five Eyes"
five_eyes_desc: "L'alliance Five Eyes est une alliance de renseignement composée de cinq pays anglophones, un groupe international de partage de renseignements formé dans le cadre de l'accord anglo-américain. Les pays membres incluent l'Australie, le Canada, la Nouvelle-Zélande, le Royaume-Uni et les États-Unis. Les réunions tenues par ces cinq pays sont souvent appelées « les Five ». L'histoire de l'alliance Five Eyes remonte à la Seconde Guerre mondiale et à la Charte de l'Atlantique signée par les Alliés.\nLes cinq pays partagent une origine historique commune. Tous les pays membres faisaient autrefois partie de l'Empire britannique, et le Royaume-Uni, l'Australie, la Nouvelle-Zélande et le Canada sont également membres du Commonwealth. Les États-Unis, le Canada et le Royaume-Uni sont également membres de l'OTAN. Les États-Unis et le Royaume-Uni sont deux des membres permanents du Conseil de sécurité des Nations unies."

one_child_policy_desc: "\n\n\n\n\n£GFX_PRC_one_child_policy_texticon_embed \n\n\n\n\n\n\nLa « politique de l'enfant unique » est un effort gouvernemental pour contrôler la croissance rapide de la population, lancée en 1979. Elle a réussi dans son objectif ; cependant, on ne peut ignorer les conséquences.\n\nElle a accentué les disparités de genre, les familles préférant avoir des enfants mâles tandis que les enfants de sexe féminin sont souvent sous-valorisés. Cela pose des risques pour l'équilibre des genres à l'avenir."

KOR_aging_popu: "Vieillissement de la population"
KOR_aging_popu_desc: "\n\n\n\n\n£GFX_KOR_aging_popu_embed \n\n\n\n\n\n\nLe phénomène de faible natalité, qui a commencé sous l'administration Chun Doo-hwan en 1983, reste un problème social majeur pour nous aujourd'hui. Pendant l'ère d'industrialisation des années 1970, une natalité excessive a conduit à des politiques de contrôle des naissances, dont les conséquences ont entraîné une diminution des préférences pour le mariage et la procréation. Par conséquent, la Corée du Sud est désormais entrée dans une société vieillissante."

COG_africas_world_war_name: "Guerre mondiale de l'Afrique"
COG_africas_world_war_name_desc: "\n\n\n\n\n£GFX_COG_africas_world_war_embed \n\n\n\n\n\n\nCe qui a commencé en 1998 comme une révolte au Congo s'est transformé en une guerre continentale à part entière ayant coûté des millions de vies, avec des pays s'impliquant directement ou politiquement en créant des réseaux d'alliances, ce qui lui a valu le nom de \n\n§gGuerre mondiale de l'Afrique§!"

idea_ISR_american_funding: "Financement américain"
idea_ISR_american_funding_desc: "Ô Amérique, terre des braves, patrie des libres, a longtemps utilisé Israël comme point d'ancrage au Moyen-Orient turbulent, et de cette décision, nous avons profité de leur soutien.\n\nSI LES ÉTATS-UNIS CESSENT D'EXISTER OU CHOISISSENT DE CESSER DE NOUS SOUTENIR, NOTRE DOMINATION AU MOYEN-ORIENT SERA REMISE EN QUESTION PAR NOS VOISINS."

