l_french:
 zzz_party.164.t:0 "La victoire d'Imran Khan"
 zzz_party.164.d:0 "Après les élections générales de 2018, le Pakistan Tehreek-e-Insaf a obtenu une majorité relative à l'Assemblée nationale. Imran Khan a prêté serment comme Premier ministre, détournant la politique pakistanaise des deux partis dynastiques vers un mouvement populiste antisystème."
 zzz_party.164.a:0 "Accepter le résultat"
 zzz_party.165.t:0 "Changement de garde à Islamabad"
 zzz_party.165.d:0 "L'Assemblée nationale a adopté une motion de censure contre Imran Khan. La Ligue musulmane du Pakistan (Nawaz) a uni l'opposition et nommé Shehbaz Sharif Premier ministre, ramenant les partis établis au pouvoir à Islamabad."
 zzz_party.165.a:0 "Accepter le résultat"
 zzz_party.166.t:0 "La victoire du Pakatan Harapan"
 zzz_party.166.d:0 "Lors des élections de 2018, le Pakatan Harapan a mis fin à six décennies de règne du Barisan Nasional. Mahathir Mohamad est revenu comme Premier ministre à l'âge de quatre-vingt-douze ans, offrant à Kuala Lumpur son premier véritable changement de parti au pouvoir."
 zzz_party.166.a:0 "Accepter le résultat"
 zzz_party.167.t:0 "Le mouvement Sheraton"
 zzz_party.167.d:0 "Le Bersatu a quitté le Pakatan Harapan et s'est allié à l'Organisation nationale des Malais unis et au Parti islamique pour former un nouveau gouvernement. Muhyiddin Yassin est devenu Premier ministre, et l'alliance réformiste s'est effondrée après moins de deux ans."
 zzz_party.167.a:0 "Accepter le résultat"
 zzz_party.168.t:0 "L'heure d'Anwar"
 zzz_party.168.d:0 "Aucun bloc n'a obtenu la majorité lors des élections de 2022. Le Pakatan Harapan a formé un gouvernement de coalition sous la médiation du Yang di-Pertuan Agong, et Anwar Ibrahim est enfin devenu Premier ministre, ramenant la Malaisie sur la voie réformiste."
 zzz_party.168.a:0 "Accepter le résultat"
 zzz_party.169.t:0 "Le second mandat de l'homme fort"
 zzz_party.169.d:0 "Les élections de 2019 se sont tenues sous une nouvelle constitution façonnée par l'armée. Le Palang Pracharath et ses partenaires ont conservé le pouvoir, et Prayut Chan-o-cha est passé de chef de coup d'État à Premier ministre élu."
 zzz_party.169.a:0 "Accepter le résultat"
 zzz_party.170.t:0 "Le retour du Pheu Thai"
 zzz_party.170.d:0 "Bien que Move Forward ait remporté le plus de sièges aux élections de 2023, le Sénat a bloqué son accession au pouvoir. Le Pheu Thai s'est allié au camp conservateur pour former un gouvernement, et Srettha Thavisin est devenu Premier ministre, ramenant le réseau politique de Thaksin au centre du pouvoir."
 zzz_party.170.a:0 "Accepter le résultat"
