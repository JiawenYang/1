l_french:
 #Événements d'ambiance : voie de la paix et de l'unification avec Taïwan, et voie de la confédération coréenne
 tai_kor_flavor.1.t: "La saison de pêche revient"
 tai_kor_flavor.1.d: "Pour la première fois depuis des années, les bateaux de Xiamen et de Kinmen naviguent dans les mêmes eaux selon le même calendrier de marées. La prise est modeste, mais les bars du port sont pleins, et les vieux qui se criaient dessus de part et d'autre du détroit ne se disputent plus que le prix du calmar. À $COUNTRY$, on dit que la mer se souvient de ce que la politique oublie."
 tai_kor_flavor.1.a: "Laissons les bateaux naviguer"
 tai_kor_flavor.2.t: "Retour dans le delta du Yangtsé"
 tai_kor_flavor.2.d: "Des industriels taïwanais qui avaient passé dix ans à délocaliser vers le Vietnam et l'Inde rouvrent discrètement des bureaux à Kunshan et à Suzhou. La paperasse est plus simple, les vols sont redevenus directs, et une génération de cadres élevée dans la prudence se met à négocier autour d'un déjeuner. Les montants restent faibles, mais la direction est évidente."
 tai_kor_flavor.2.a: "Le commerce suit le drapeau"
 tai_kor_flavor.3.t: "Les vieux soldats rentrent"
 tai_kor_flavor.3.d: "Un bus de doyens des villages de vétérans traverse le détroit avec escorte policière et une infirmière à bord. Certains n'ont pas revu leur ville natale depuis les années 1940 ; la plupart trouvent le temple ancestral reconstruit et les tombes familiales entretenues par des inconnus. Ils reviennent avec des photographies, un bocal de terre et un silence qui dure tout le vol retour."
 tai_kor_flavor.3.a: "Certaines dettes peuvent enfin être payées"
 tai_kor_flavor.4.t: "Des familles par-delà le détroit"
 tai_kor_flavor.4.d: "Les mariages transdétroit, longtemps traités comme une zone grise administrative, obtiennent enfin un cadre juridique clair. Des couples qui passaient des années à prouver qu'ils étaient mariés font désormais la queue pour le prouver encore, cette fois avec un tampon que tout le monde reconnaît. Leurs enfants, élevés entre deux passeports, demandent lequel il leur faudra l'an prochain."
 tai_kor_flavor.4.a: "Un foyer, une paperasse"
 tai_kor_flavor.5.t: "Le camp d'échange d'été"
 tai_kor_flavor.5.d: "Trois cents étudiants de $COUNTRY$ passent quinze jours à Nanjing et à Hangzhou, la moitié s'attendant à de la propagande et découvrant une cantine médiocre, des débats nocturnes et une playlist partagée. Au dernier jour, ils ont cessé de s'appeler « eux ». Les organisateurs des deux côtés parlent de succès et s'inquiètent en silence du suivi."
 tai_kor_flavor.5.a: "Laissez-les se rencontrer"
 tai_kor_flavor.6.t: "Une étoile sur la scène continentale"
 tai_kor_flavor.6.d: "Une chanteuse pop taïwanaise remplit un stade à Shanghai en onze minutes. Le rappel est chanté avec deux accents, et le public répond avec un troisième. Sur le continent, la tournée est présentée comme une intégration culturelle ; sur l'île, comme un retour au pays. Personne dans la salle ne semble se soucier du mot employé."
 tai_kor_flavor.6.a: "Le public ne lit pas la note d'intention"
 tai_kor_flavor.7.t: "Un match amical, deux drapeaux"
 tai_kor_flavor.7.d: "Une exhibition de baseball transdétroit fait salle comble et mal de tête diplomatique. Le drapeau de l'équipe visiteuse est autorisé à l'entrée mais pas sur le tableau d'affichage, et le speaker résout le problème en énonçant deux fois le nom des joueurs. L'équipe locale gagne d'un point ; les deux bancs applaudissent."
 tai_kor_flavor.7.a: "Neuf manches de paix"
 tai_kor_flavor.8.t: "Le pèlerinage de Mazu"
 tai_kor_flavor.8.d: "Une flotte de pèlerins de $COUNTRY$ traverse vers Meizhou avec encens, tambours et une statue de la déesse de la mer. Le temple continental l'accueille avec un tapis rouge ; les officiels locaux prennent soin d'appeler les visiteurs « compatriotes » et jamais « invités ». Sur le ferry du retour, un membre du comité du temple remarque que la déesse, au moins, n'a jamais eu besoin de visa."
 tai_kor_flavor.8.a: "La foi voyage plus léger que la politique"
 tai_kor_flavor.9.t: "Kaesong rouvre"
 tai_kor_flavor.9.d: "Les portes du parc industriel de Kaesong s'ouvrent après des années de silence. Les cadres sud-coréens traversent des ateliers où les machines sont encore couvertes de housses poussiéreuses, et les ouvriers nord-coréens pointent avec de nouveaux badges. La production du premier mois est minuscule ; le salaire du premier mois est payé à l'heure, et c'est la vraie nouvelle."
 tai_kor_flavor.9.a: "Les machines redémarrent"
 tai_kor_flavor.10.t: "Retrouvailles au mont Kumgang"
 tai_kor_flavor.10.d: "Des bus de familles séparées montent au centre de retrouvailles du mont Kumgang, où les salles sont numérotées et les rencontres chronométrées par des officiels munis de chronomètres. Une femme de quatre-vingts ans reconnaît son frère à sa façon de joindre les mains. On leur accorde trois heures, un panier-repas et une photographie que les deux côtés devront cacher à leurs voisins."
 tai_kor_flavor.10.a: "Trois heures, c'est trois heures"
 tai_kor_flavor.11.t: "Les boutiques de Panmunjom"
 tai_kor_flavor.11.d: "Le poste-frontière étant réduit, une poignée de commerçants rouvrent des étals du côté sud du village de trêve. Ils vendent des nouilles instantanées, des cartes postales et, inévitablement, des jumelles souvenir pour regarder l'autre côté d'une ligne qui ne signifie plus ce qu'elle signifiait. L'article le plus vendu est un porte-clés en forme de l'ancienne corde de démarcation."
 tai_kor_flavor.11.a: "Petit commerce, petite paix"
 tai_kor_flavor.12.t: "Un match entre deux Corées"
 tai_kor_flavor.12.d: "Un amical de football Nord-Sud se joue dans un stade où les deux hymnes sont interprétés l'un après l'autre et où les deux publics se lèvent. Le match se termine par un nul, que les commentateurs qualifient de résultat diplomatique. Après, les joueurs échangent leurs maillots et, avec quelque difficulté, leurs numéros de téléphone."
 tai_kor_flavor.12.a: "Un nul dont personne ne se plaint"
 tai_kor_flavor.13.t: "Le mont Kumgang s'ouvre aux touristes"
 tai_kor_flavor.13.d: "Les premiers ferries touristiques depuis des années accostent au mont Kumgang. La station est à moitié achevée et le parc aquatique n'est encore qu'une coque de béton, mais les plages sont propres et les guides ont mémorisé trois langues. Les visiteurs sud-coréens se plaignent des prix ; le personnel nord-coréen se plaint que les pourboires soient comptés dans la mauvaise monnaie."
 tai_kor_flavor.13.a: "Laissez-les venir voir"
 tai_kor_flavor.14.t: "Deux voix, une scène"
 tai_kor_flavor.14.d: "Un concert à Séoul associe une chanteuse de ballades du Nord à un groupe d'idoles du Sud. L'arrangement est maladroit, la traduction pire, et le finale — une chanson que les deux côtés revendiquent — fait se lever la salle. La diffusion est retardée de trente minutes pour que chaque chaîne puisse couper l'introduction de l'autre."
 tai_kor_flavor.14.a: "Montez le volume"
 tai_kor_flavor.15.t: "Le premier train en soixante-dix ans"
 tai_kor_flavor.15.d: "Un train d'essai relie Séoul à Sinuiju et revient avec des inspecteurs, des journalistes et un ingénieur très nerveux. La voie est rapiécée, les signaux sont manuels, et le trajet prend trois fois l'horaire prévu. Mais la traversée a lieu, et quelqu'un dans la voiture-restaurant ouvre une bouteille gardée dans un placard depuis les années 1990."
 tai_kor_flavor.15.a: "Poser la seconde voie"
 tai_kor_flavor.16.t: "Un Chuseok partagé"
 tai_kor_flavor.16.d: "Pour la première fois, les deux Corées tiennent une émission de Chuseok commune : les mêmes chansons, la même nourriture, deux présentateurs différents lisant le même script. Les familles séparées par l'ancienne ligne la regardent dans des pièces séparées et, pour une soirée, se disputent la même chose — si la chanson était mieux chantée de l'autre côté."
 tai_kor_flavor.16.a: "Une fête, deux diffusions"
