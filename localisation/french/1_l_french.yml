  # SOCIÉTÉ ET POLITIQUE RÉGIONALE
  tribes_state: "Société fragmentée"
  tribes_state_desc: "Cette nation est composée de groupes ethniques et religieux aux intérêts divergents. Les tensions internes y sont vives, rendant les affrontements armés faciles à provoquer."
  
  MAY_politics: "Politique malaise"
  MAY_politics_desc: "\n\n\n\n£GFX_MAY_politics_texticon_embed\n\n\nLe Sultan est le chef spirituel et politique auquel le peuple doit allégeance. Ce système repose sur deux piliers traditionnels :\n\n§YDaulat (Souveraineté) :§! L'autorité suprême du monarque, exercée avec sagesse et moralité.\n\n§RTrahison :§! Désobéir au Sultan apporte le déshonneur et la catastrophe sur le peuple félon."


  IND_politics: "Pancasila"
  IND_politics_desc: "\n\n\n\n£GFX_IND_politics_texticon_embed\n\n\nLe Pancasila, proposé par Sukarno en 1945, constitue le socle idéologique de l'Indonésie. Il définit les cinq principes que tout parti politique doit respecter pour garantir l'unité de l'archipel : foi en un Dieu unique, humanisme, unité nationale, démocratie délibérative et justice sociale."

  TUR_disjointed_diplomacy_idea: "Diplomatie décousue"
  TUR_turkish_nationalism_idea: "Nationalisme turc"
 
  africa_nationalism: "Libération de l'Afrique"
  africa_nationalism_desc: "§R« Nous ne devons compter que sur les Africains eux-mêmes pour libérer l'Afrique. Les Africains doivent s'occuper de leurs propres affaires. »§!\n— Mao Zedong"
 
  mcdonald_nationalism: "L'indice McDonald's"
  mcdonald_nationalism_desc: "Dans les pays d'Europe de l'Est post-communistes, l'arrivée de McDonald's est devenue un puissant symbole de réussite nationale et d'ancrage à l'Occident. Dans ce contexte, l'aspiration nationaliste se traduit souvent par une volonté farouche de rejoindre les standards de consommation et les alliances libérales."
    # --- CHINE : PROVINCES ET RÉGIONS ---
  CHI_anhui: "Anhui central, nouveau et émergent"
  CHI_anhui_desc: "C'est une région de mise en œuvre pour des stratégies nationales majeures telles que le développement intégré du delta du fleuve Yangtze, le développement de la ceinture économique du Yangtze et l'essor de la région centrale. C'est également une province importante pour l'innovation scientifique et technologique de la Chine."
  CHI_beijing: "Capitale"
  CHI_beijing_desc: "La pivoine dans la cour est sauvage et sans apparat, le lotus dans l'étang est pur et peu émotif. Seule la pivoine incarne la véritable beauté nationale, et la capitale s'anime lorsque les fleurs éclosent."
  CHI_chongqing_municipality_desc: "L'une des municipalités relevant directement du gouvernement central, une ville centrale majeure en Chine, une cité historique et culturelle nationale, et un centre international de transport complet."
  CHI_guangdong: "Géant du delta de la rivière des Perles"
  CHI_guangdong_desc: "Avant-garde, pionnière et zone expérimentale de la réforme et de l'ouverture, et une fenêtre importante pour montrer au monde les réalisations de la Chine en la matière."
  CHI_guangxi_zhuang_autonomous_region_desc: "Frontière de la Chine et fenêtre pour l'ouverture et la coopération avec l'ASEAN, ainsi qu'une barrière de sécurité importante dans le sud-ouest et le centre-sud de la Chine."
  CHI_hebei: "Centre Pékin-Tianjin"
  CHI_hebei_desc: "Située autour de la capitale, c'est l'une des zones clés pour la mise en œuvre de la stratégie de développement coordonné Pékin-Tianjin-Hebei."
  CHI_heilongjiang: "Industrie lourde de glace et de neige"
  CHI_heilongjiang_desc: "Située au cœur de l'Asie du Nord-Est, c'est une base nationale de production de céréales commerciales, un centre de fabrication d'équipements lourds, une base énergétique et de matières premières majeure, un rempart écologique septentrional et un nouveau haut lieu de l'ouverture vers le nord."
  CHI_henan: "Essor des plaines centrales"
  CHI_henan_desc: "Située dans les plaines centrales, c'est une zone de soutien cruciale pour les stratégies nationales comme l'essor de la région centrale et la protection écologique du bassin du fleuve Jaune."
  CHI_hubei: "Plaque tournante de Jiangcheng"
  CHI_hubei_desc: "Située dans le cours moyen du fleuve Yangtze, le Hubei possède des atouts dans les transports, l'industrie et l'agriculture. C'est un pivot économique et logistique majeur du centre du pays."
  CHI_inner_mongolia_autonomous_region_desc: "Située à la frontière nord de la patrie, elle chevauche le nord-est, le nord et le nord-ouest de la Chine. C'est une barrière de sécurité écologique et stratégique vitale, une base énergétique nationale et un pont pour l'ouverture vers le nord."
  CHI_jiangsu: "Zone économique du sud du Jiangsu"
  CHI_jiangsu_desc: "Au croisement de la route de la soie économique et de la route de la soie maritime du 21e siècle, c'est une région clé pour le développement intégré du delta du Yangtze."
  CHI_jiangxi: "Berceau de la révolution rouge"
  CHI_jiangxi_desc: "Située dans le cours moyen et inférieur du Yangtze, elle soutient l'essor de la région centrale et le développement de la ceinture économique du fleuve."
  CHI_shandong: "L'état du commerce du Shandong"
  CHI_shandong_desc: "Pivot reliant le nord et le sud, l'est et l'ouest, la terre et la mer, cette province est un point d'appui stratégique pour l'économie du nord de la Chine."
  CHI_shanghai: "Nouvelle zone de Pudong"
  CHI_shanghai_desc: "Le développement et l'ouverture de Pudong ont propulsé Shanghai sur la voie de la transformation globale et injecté un nouvel élan dans la réforme de tout le pays."
  CHI_shanxi: "Base charbonnière"
  CHI_shanxi_desc: "Berceau de la civilisation chinoise et base énergétique stratégique, elle sert de barrière écologique verte pour le nord de la Chine."
  CHI_taiwan_autonomous_region_desc: "Nous sommes un collier de perles de la mer de Chine orientale. Ryukyu est mon jeune frère, et je suis Taïwan. L'esprit de Zheng anime toujours mon cœur. Mère ! Je veux revenir, mère !"
  CHI_tibet_desc: "Une barrière de sécurité nationale et écologique, une base de réserves stratégiques, d'énergies propres et de produits agricoles de plateau. C'est une destination touristique mondiale et un canal d'ouverture vers l'Asie du Sud."
  CHI_xinjiang_uygur_desc: "Barrière de sécurité majeure au nord-ouest de la Chine et tête de pont pour l'ouverture vers l'ouest."
  CHI_zhejiang: "Capitale commerciale de Donghai"
  CHI_zhejiang_desc: "Pionnier de la modernisation à la chinoise, situé à l'intersection de la ceinture économique du Yangtze et du delta du Yangtze."

