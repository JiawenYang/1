  VIN_doi_moi_name_1: "Đổi Mới"
  VIN_doi_moi_name_1_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§gUn coin de rue de la ville de Hô Chi Minh dans les années 1990.§!\n\nĐổi Mới est le nom donné aux réformes économiques initiées au Vietnam à partir de 1986 dans le but de créer une « économie de marché à orientation socialiste ». La politique Đổi Mới désigne spécifiquement ces réformes qui ont cherché à faire passer le Vietnam d’une économie dirigée à une économie de marché à orientation socialiste.\nLes réformes économiques Đổi Mới ont été lancées par le Parti communiste du Vietnam en 1986 lors du 6e Congrès national du parti. Elles ont introduit un rôle accru des forces du marché pour coordonner l’activité économique entre les entreprises et les agences gouvernementales et ont permis la propriété privée des petites entreprises ainsi que la création d’une bourse pour les entreprises d’État et non d’État."
