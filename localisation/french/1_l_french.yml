  MZB_central_african_railway_network: "Réseau ferroviaire d’Afrique centrale"
  MZB_central_african_railway_network_desc: "\n\n\n\n\n£GFX_MZB_central_african_railway_network_embed \n\n\n\n\n\n\nLe réseau ferroviaire d’Afrique centrale traversant le Mozambique est un lien de transport crucial reliant les pays enclavés. Les principaux corridors incluent le corridor de Beira, menant au port de Beira, et le corridor de Nacala, donnant accès au port en eau profonde de Nacala. Ces voies ferrées jouent un rôle vital dans le commerce régional, facilitant l’exportation de minerais, de produits agricoles et de marchandises."
  MZB_flag_of_the_kalashnikov: "Drapeau du Kalachnikov"
  MZB_flag_of_the_kalashnikov_desc: "\n\n\n\n\n£GFX_MZB_flag_of_the_kalashnikov_embed \n\n\n\n\n\n\nLe drapeau du Mozambique arbore un AK-47 avec une baïonnette croisée avec une houe, rappelant la lutte de la nation pour l’indépendance et son engagement envers la défense et le progrès, reflétant la libération du Mozambique de la domination coloniale portugaise en 1975.\n\nLa houe symbolise l’agriculture et le développement, tandis que le livre ouvert représente l’éducation. Le Mozambique est la seule nation à arborer une arme à feu moderne sur son drapeau, ce qui en fait un symbole distinctif de son passé révolutionnaire."
