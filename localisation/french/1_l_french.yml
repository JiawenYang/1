  # --- PAKISTAN ET JAPON ---
  PAK_fervent_nationalism: "Nationalisme fervent"
  PAK_fervent_nationalism_desc: "Le 11 août commémore l'indépendance du Pakistan et sa séparation de l'Inde britannique, un processus marqué par une violence dévastatrice. Mohammad Ali Jinnah, le père fondateur, cherchait à créer une nation démocratique et laïque où les musulmans jouiraient d'une égalité totale. Il déclara : « Vous êtes libres ; vous êtes libres d'aller dans vos temples, vos mosquées ou tout autre lieu de culte dans cet état du Pakistan. » Aujourd'hui, le Pakistan s'est éloigné de cette vision laïque, avec une influence militaire prédominante et des tensions confessionnelles persistantes."
  JAP_political_monopoly_idea: "Monopole politique"
  JAP_political_monopoly_idea_desc: "Le Parti libéral-démocrate (PLD) est la force politique dominante au Japon depuis 1955. À l'exception de brèves interruptions, le PLD a maintenu une majorité à la Diète japonaise, créant de fait un état à parti unique. Bien que de nouveaux partis émergent, l'emprise du PLD sur le pouvoir reste un pilier du paysage politique japonais."

  # --- VIETNAM : DOI MOI ---
  VIN_doi_moi_name: "Doi Moi"
  VIN_doi_moi_name_desc: "Le Doi Moi est le nom donné aux réformes économiques initiées au Vietnam en 1986. L'objectif était de créer une « économie de marché à orientation socialiste », passant d'une économie planifiée à un système autorisant la propriété privée et le rôle des forces du marché."

