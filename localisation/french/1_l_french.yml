  # AUSTRIA & NEUTRALITY
  austrian_neutrality: "Neutralité autrichienne"
  austrian_neutrality_desc: "Réunifiée après 1945 sous condition de neutralité absolue, l'Autriche a su rester à l'écart des blocs durant la guerre froide. Si cet héritage est un pilier de l'identité nationale, l'adhésion à l'UE en 1995 a commencé à fragiliser ce consensus. Rompre avec cette tradition nécessiterait aujourd'hui une majorité parlementaire qualifiée ou une refonte totale de la Constitution."

