  CHI_jilin: "Machinerie lourde au Nord"
  CHI_jilin_desc: "Située au centre géographique de l’Asie du Nord-Est, c’est une région importante pour l’ouverture de la Chine vers l’Asie du Nord-Est, ainsi qu’une base nationale majeure pour les céréales commerciales et une ancienne base industrielle."
  CHI_liaoning: "Base industrielle"
  CHI_liaoning_desc: "Une importante ancienne base industrielle en Chine, une région clé pour promouvoir la revitalisation globale du Nord-Est chinois dans la nouvelle ère."
  CHI_ningxia_hui_autonomous_region_desc: "Située au carrefour de la Ceinture économique de la Route de la soie, c’est un nœud important dans la construction du nouveau corridor terrestre-maritime de l’Ouest et une région stratégique soutenant la mise en œuvre des grandes stratégies nationales telles que le grand développement de l’Ouest, la protection écologique du bassin du Fleuve Jaune et le développement de haute qualité."
