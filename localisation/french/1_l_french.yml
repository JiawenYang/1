  # CROATIA
  CRO_european_reliance: "Dépendance européenne"
  CRO_european_reliance_desc: "L'omniprésence du tourisme et une banque centrale réduite à un simple bureau de change ont engendré le cauchemar de tout souverainiste : la dépendance extérieure. Avec une économie centrée sur la construction navale et les services, la Croatie dispose de peu de marge de manœuvre face à Bruxelles. Cette situation alimente un populisme croissant au sein d'une population lasse de voir ses dirigeants agir comme de simples subordonnés de l'Union européenne."
  CRO_fading_grudges: "Rancœurs estompées"
  CRO_fading_grudges_desc: "Ancien acteur majeur des guerres de Yougoslavie, la Croatie semble avoir apaisé ses relations avec ses voisins au profit d'une intégration européenne collective. Les contentieux frontaliers avec la Serbie sont désormais latents, et les disputes maritimes avec la Slovénie ne sont plus que des désagréments mineurs pour les pêcheurs locaux. La mèche de la poudrière balkanique paraît, pour l'heure, s'être allongée."
  CRO_slavoniadalmatia_divide: "Fracture Slavonie-Dalmatie"
  CRO_slavoniadalmatia_divide_desc: "Si le littoral adriatique est le moteur économique du pays grâce au tourisme et aux chantiers navals, la vallée fertile de la Slavonie, au nord, reste largement délaissée. Ce déséquilibre territorial est frappant : seules deux des cent plus grandes entreprises nationales sont originaires de cette région agraire aux ressources pourtant inexploitées."

  # FRANCE
  FRA_french_spirit_idea: "Esprit français"
  FRA_french_spirit_idea_desc: "\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\nMarquée par les occupations de 1870 et 1940, la France a sanctuarisé son territoire derrière un puissant arsenal nucléaire. Mais l'esprit français, c'est aussi l'héritage révolutionnaire de 1789. Le peuple n'y tolère aucune injustice perçue et préfère mourir debout que vivre à genoux. Toute réforme contestée peut instantanément déclencher des protestations massives, des émeutes, voire une nouvelle révolution — un art que les Français maîtrisent à la perfection."
  frenchpresidentcom: "Président [FRA.GetAdjective] - §R[FRA.GetLeader]§!\nLes autres pays recevront ce modificateur si leur économie est plus radicale qu'un « Marché réglementé », s'ils ne subissent pas d'embargo de la part de [SOV.GetArticle] [SOV.GetName] et s'ils ont une opinion positive de [FRA.GetArticle] [FRA.GetName].\n"
 frenchpresidentsoc: "Président [FRA.GetAdjective] - §G[FRA.GetLeader]§!\nLes autres pays recevront ce modificateur si leur gouvernement est réformiste ou libéral, s'ils ne font partie d'aucune faction et s'ils ont une opinion positive de [FRA.GetArticle] [FRA.GetName].\n"
 frenchpresidentcon: "Président [FRA.GetAdjective] - §C[FRA.GetLeader]§!\nLes autres pays recevront le même modificateur.\n"
 frenchpresidentlib: "Président [FRA.GetAdjective] - §B[FRA.GetLeader]§!\nLes autres pays recevront ce modificateur si leurs libertés civiles sont plus libérales que les « Droits limités », s'ils ne subissent pas d'embargo de la part des [USA.GetName] et s'ils ont une opinion positive de [FRA.GetArticle] [FRA.GetName].\n"

  # JAPAN
  JAP_aging_population_idea: "Vieillissement de la population"
  JAP_aging_population_idea_desc: "Avec plus de 75% de sa population considérée comme âgée, le Japon fait face à un déséquilibre démographique extrême. Si le niveau de vie reste élevé, la pression sur les services sociaux et le système de santé est colossale. Le gouvernement tente désespérément de réinsérer les seniors dans la vie active tout en subventionnant massivement la natalité pour enrayer le déclin de la main-d'œuvre."
  JAP_economic_stagnation_idea: "Stagnation économique"
  JAP_economic_stagnation_idea_desc: "L'économie nippone est enlisée dans une spirale de croissance faible et de déflation. Ce phénomène est accentué par le déclin démographique qui réduit la consommation intérieure. Sans réformes structurelles profondes, le Japon peine à retrouver le dynamisme qui faisait de lui un géant industriel au siècle dernier."
  JAP_japanese_pacifism_idea: "Pacifisme japonais"
  JAP_japanese_pacifism_idea_desc: "Depuis 1945, l'article 9 de la Constitution interdit au Japon de maintenir une armée offensive. Cependant, face à la montée en puissance de la Chine et à l'incertitude du bouclier américain, le débat sur l'abolition de ce pacifisme constitutionnel gagne du terrain au sein de la classe politique."
  JAP_keiretsu_control_idea: "Emprise des Keiretsus"
  JAP_keiretsu_control_idea_desc: "Les Keiretsus sont de puissants conglomérats d'entreprises liés par des participations croisées et centrés autour de grandes banques. Ce système protège les entreprises des fluctuations du marché mais fige l'économie dans un modèle monopolistique parrainé par l'État. Ils contrôlent la quasi-totalité du secteur manufacturier japonais."

  # CHINA (PRC) & RELATIONS
  PRC_BRI_dynamic: "Initiative Ceinture et Route"
  PRC_BRI_member: "Membre de l'ICR"
  PRC_corrupt_bureaucracy_idea: "Bureaucratie corrompue"
  PRC_corrupt_bureaucracy_idea_desc: "\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner\n\n\n\n\n\nDepuis les dynasties impériales, la Chine est aux prises avec le fléau de la corruption. Malgré les campagnes de l'ère Mao et les réformes structurelles de Deng Xiaoping, une nouvelle classe de cadres du Parti a vu le jour. Le népotisme et les rivalités de factions au sein de l'appareil d'État demeurent des obstacles majeurs à la cohésion nationale et au développement harmonieux de la société."
