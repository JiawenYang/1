  visegrad_group_member: "Membre du groupe de Visegrad"
  visegrad_group_member_desc: "Ce pays est membre du groupe de Visegrad, une alliance politique entre la Pologne ([POL.GetName]), la Tchéquie ([CZE.GetName]), la Slovaquie ([SLO.GetName]) et la Hongrie ([HUN.GetName])."

  PRC_pla_dynamic: "Armée populaire de libération"
  PRC_pla_dynamic_desc: "\n\n\n\n\n£GFX_PRC_PLA_texticon_embed \n\n\n\n\n\n\nL'Armée populaire de libération (APL) est le protecteur du Parti et de l'État. Sa structure de gestion est intégrée à la fois à l'organisation du Parti et à l'appareil d'État par l'intermédiaire de la Commission militaire centrale (CMC). Il existe formellement deux CMC : l'une appartenant au Parti et l'autre à l'État (remplaçant le ministère de la défense classique). Au sein du Parti, la CMC est un organe de haut niveau aux côtés du Comité central. Dans la structure administrative de l'État, elle siège aux côtés du gouvernement et de l'Assemblée populaire nationale.\n\nLe vice-président de la CMC occupe le rang le plus élevé pour un officier d'active, équivalent à celui de Vice-premier ministre. Les membres de la CMC ne sont responsables que devant son président. Ni l'Assemblée populaire nationale, ni les membres civils du Bureau politique n'ont d'autorité directe sur les forces armées."

  business_value_factor: "£GFX_dx_blue Facteur de valeur commerciale"
  personal_value: "£GFX_dx_yellow Valeur personnelle (B)"
  personal_value_factor: "£GFX_dx_yellow Facteur de valeur personnelle"
  personal_expense_factor: "£GFX_dx_yellow Facteur de dépenses personnelles"
  expense_growth_factor: "£GFX_dx Croissance mensuelle des dépenses"

  partofusa_tooltip: "§4LE MOMENT UNIPOLAIRE§!\n\n\n\n\n\n\n£USA_Cold_War_Entry_embed \n\n\n\n\n\n\n§gL'architecte incontesté du nouvel ordre mondial. Émergeant des cendres de la guerre froide, les États-unis sont passés d'une superpuissance prudente à une hyperpuissance commandant le plus formidable réseau militaro-économique de l'histoire : l'aube du siècle américain.\n\nLes années 1990 ont vu la métamorphose de l'Amérique : la révolution numérique de la Silicon Valley a redéfini le commerce mondial. Pourtant, sous ce triomphalisme, des fissures sont apparues. La crise financière asiatique a révélé la volatilité du capitalisme, tandis que l'expansion de l'OTAN vers l'est a attisé des ressentiments latents. En mars 2000, l'éclat de la bulle internet masquait des fragilités structurelles.\n\nFace aux défis, l'Amérique a innové ; face aux menaces, elle s'est mobilisée. Du ciel du Kosovo aux porte-avions du golfe Persique, sa puissance est restée sans égale.\n\n§3La trajectoire du XXIe siècle dépend désormais de la capacité de la Pax Americana à évoluer de la domination vers une gestion durable…§!§!"

  partofchina_tooltip: "§tLE BLOC DE L'EST§!\n\n\n\n\n\n\n£PRC_Cold_War_Entry_embed \n\n\n\n\n\n\n§gPendant une grande partie du siècle dernier, la Chine a été perçue comme une nation agraire fragmentée, dont la gloire impériale s'était estompée sous l'ombre du « siècle de l'humiliation ». Ce n'est qu'avec la victoire du Parti communiste chinois que la nation a véritablement repris son destin en main. La fondation de la République populaire de Chine a marqué l'aube d'une renaissance, déterminée à remettre en question l'ordre mondial.\n\nLa transformation de la Chine est miraculeuse. Du chaos des seigneurs de guerre à une puissance industrielle majeure, son essor est stupéfiant. Au tournant du XXIe siècle, le monde a commencé à évoquer le « siècle chinois ». Aujourd'hui, elle se dresse fièrement sur la scène mondiale, prête à défier l'hégémonie américaine.\n\n§tMais la question demeure : la Chine peut-elle maintenir son ascension, ou va-t-elle vaciller sous le poids de ses ambitions?§!§!"

  chinese_overseas_dynamic_modifier: "[CHI.GetAdjective] d'outre-mer dans [THIS.GetNameWithFlag]"
  chinese_overseas_dynamic_modifier_desc: "Dans [THIS.GetName], [?chinese_overseas_population]% de la population est d'origine [CHI.GetAdjective], détenant [?chinese_overseas_wealth]% des richesses. Cette communauté a apporté une contribution économique exceptionnelle et influence inévitablement l'équilibre politique local."

  PRC_chinese_communist_party_idea: "Parti communiste chinois"
  PRC_communist_party_of_china_dynamic: "Parti communiste chinois"
  PRC_communist_party_of_china_dynamic_desc: "\n\n\n\n£GFX_chinese_communist_party\n\n\n\n\n\n§RLongue vie au grand Parti communiste chinois !\nVive l'invincible pensée de Mao Zedong !§!\n\nDepuis 1949, le PCC règne sans partage. Même après l'effondrement du bloc soviétique, la Chine socialiste a prospéré grâce aux réformes et à l'ouverture. Le Parti a consolidé sa domination sur 1,4 milliard d'habitants en infiltrant tous les aspects de la société. Une chose est sûre : §RIl faudrait une catastrophe apocalyptique pour renverser le géant qu'est le PCC.§!"

  one_child_policy_desc: "\n\n\n\n\n£GFX_PRC_one_child_policy_texticon_embed \n\n\n\n\n\n\nLancée en 1979, la « Politique de l'enfant unique » visait à freiner la croissance démographique rapide. Si l'objectif comptable a été atteint, les conséquences sociales sont lourdes : vieillissement accéléré et déséquilibre flagrant entre les sexes, les familles ayant souvent privilégié la naissance d'un garçon."

  COG_africas_world_war_name: "La grande guerre africaine"
  COG_africas_world_war_name_desc: "\n\n\n\n\n£GFX_COG_africas_world_war_embed \n\n\n\n\n\n\nCe qui a débuté en 1998 comme un soulèvement local au Congo s'est transformé en un conflit continental dévastateur. Impliquant de nombreuses nations et milices, cette guerre a causé des millions de victimes, d'où son surnom de « §gGuerre mondiale africaine§! »."

  KOR_aging_popu: "Vieillissement de la population"
  KOR_aging_popu_desc: "\n\n\n\n\n£GFX_KOR_aging_popu_embed \n\n\n\n\n\n\nLe déclin du taux de natalité est devenu un problème national majeur. Les politiques de contrôle des naissances des années 1970 et 1980, combinées aux pressions économiques modernes, ont entraîné un désintérêt pour le mariage. La Corée du Sud fait aujourd'hui face à l'un des défis démographiques les plus sévères au monde."

  USA_world_police_idea: "Gendarme du monde"
  USA_world_police_idea_desc: "Le rôle militaire des États-unis à l'étranger divise profondément l'opinion. Tandis qu'une partie de la population prône un retour à l'isolationnisme pour se concentrer sur les défis intérieurs, d'autres considèrent qu'une présence mondiale est indispensable pour sécuriser les intérêts nationaux et la stabilité globale."

  first_island_chain: "Première chaîne d'îles"
  first_island_chain_desc: "La première chaîne d'îles désigne le chapelet de territoires s'étendant des îles japonaises à Taïwan et aux Philippines. Elle constitue la première ligne stratégique de la politique de confinement américaine visant à limiter la projection navale de l'Armée populaire de libération vers le Pacifique central."

  five_eyes: "Five Eyes"
  five_eyes_desc: "L'alliance des « Cinq Yeux » est un réseau de partage de renseignements regroupant cinq pays anglophones : l'Australie, le Canada, la Nouvelle-Zélande, le Royaume-Uni et les États-unis. Issue des accords de la seconde guerre mondiale, cette coopération est le pilier de la surveillance mondiale moderne."

  PRC_the_separatist_problem: "Le défi séparatiste"
  PRC_the_separatist_problem_desc: "Le séparatisme est une préoccupation chronique pour le gouvernement central. Des tensions au Xinjiang et au Tibet aux mouvements de contestation à Hong Kong et à la question irrésolue de Taïwan, Pékin alterne entre développement économique et répression stricte pour maintenir l'unité nationale."

  china.71.d: "Le 20 février 2000, Jiang Zemin a présenté la théorie de la « Triple Représentation ». Elle stipule que le Parti doit toujours représenter les exigences du développement des forces productives avancées, l'orientation de la culture avancée de la Chine et les intérêts fondamentaux de la grande majorité du peuple." 

  GER_limit_army_name: "Démilitarisation"
  GER_limit_army_name_desc: "\n\n\n\n\n£GFX_SPR_limit_army_embed \n\n\n\n\n\n\nAprès la guerre froide, l'Europe occidentale a massivement réduit ses budgets militaires au profit des secteurs civils. Ce « dividende de la paix » a ancré l'idée qu'un conflit majeur sur le continent était impossible. Il faudra un choc géopolitique majeur pour convaincre l'opinion publique de la nécessité d'un réarmement."

  PAK_military_incharge_name: "L'autorité suprême de l'armée"
  PAK_military_incharge_desc: "Au Pakistan, si les institutions démocratiques existent sur le papier, l'armée reste le véritable pivot du pouvoir. Historiquement marquée par des coups d'État et une influence directe sur la politique étrangère, l'institution militaire doit valider toute réforme majeure pour qu'elle puisse aboutir."

  SOV_kleptocratic_state: "État kleptocratique"
  SOV_kleptocratic_state_desc: "La transition brutale vers l'économie de marché dans les années 1990, dite « thérapie de choc », a permis à une poignée d'individus bien placés de s'emparer des joyaux de l'industrie soviétique pour une fraction de leur valeur. Ces oligarques ont consolidé leur emprise en finançant le pouvoir politique en échange de monopoles, créant un système où la richesse nationale est accaparée par une élite fidèle au Kremlin."
 SOV_Russian_Orthodox_Church: "Église orthodoxe russe"
  SOV_Russian_Orthodox_Church_desc: "\n\n\n\n£GFX_SOV_russian_orthodox_church\n\n\n\n\n\nPendant plus d'un millénaire, le christianisme orthodoxe a été la confession dominante en Russie. Malgré les décennies d'athéisme d'État sous l'ère soviétique, la ferveur religieuse reste un pilier, particulièrement dans les zones rurales. À ce titre, l'Église orthodoxe russe constitue l'un des leviers politiques les plus puissants du président Poutine. Elle permet de mobiliser les populations conservatrices et de discréditer toute opposition jugée contraire aux valeurs traditionnelles, notamment les mouvements LGBT. En reconnaissant de facto l'orthodoxie comme religion d'État, nous nous assurons la loyauté du clergé, offrant ainsi à nos citoyens un refuge spirituel face aux difficultés de la gouvernance."

  SRL_rajapaksa_family_idea: "La famille Rajapaksa"

  VIN_fifty_years_resistance_name: "50 ans de résistance"
  VIN_fifty_years_resistance_name_desc: "\n\n\n\n\n£GFX_VIN_matyr_day_texticon_embed \n\n\n\n\n\n\n§gUn jeune volontaire allume une cigarette pour un vétéran ; tous deux sont amputés d'une jambe. Ils se tiennent près d'une fosse commune à Da Nang, vestige du bombardement de l'école de Man Quang en 1965.§!\n\n« Une nation qui a résisté à l'oppression française pendant 80 ans et s'est tenue aux côtés des alliés contre le fascisme se doit d'être libre ! »\n- Déclaration d'indépendance de la République démocratique du Vietnam.\n\nDu soulèvement du Viet Minh en 1941 à la normalisation des relations en 1991, le pays a enfin trouvé la paix après un demi-siècle de lutte."

  VIN_patriotic_tradition_name: "Déterminés à vaincre"
  VIN_patriotic_tradition_name_desc: "\n\n\n\n\n£GFX_VIN_determine_to_win_texticon_embed \n\n\n\n\n\n\n§gHanoï, 1969 : de jeunes volontaires s'apprêtent à partir au front contre l'impérialisme américain.§!\n\nComment un pays agraire a-t-il pu défaire la plus grande puissance technologique mondiale ? Pour le peuple vietnamien, la réponse réside dans une volonté de fer et un patriotisme incandescent. À travers les millénaires, chaque invasion a ravivé cet esprit sacré, transformant chaque citoyen en rempart contre l'oppresseur."

  VIN_failure_of_1980s_name: "Échecs des années 1980"
  VIN_failure_of_1980s_name_desc: "\n\n\n\n\n£GFX_VIN_bao_cap_texticon_embed \n\n\n\n\n\n\n§gLe rationnement : les citoyens font la queue pour des denrées de base pendant la période de subvention.§!\n\nAprès l'unification, l'adoption rigide du modèle soviétique et la priorité donnée à l'industrie lourde ont mené l'économie à la stagnation. L'inflation a atteint le chiffre vertigineux de 393 % en 1985. Les erreurs de cette décennie de « subventionnement » pèsent encore dans la mémoire collective comme une leçon sur les dangers d'une planification excessive."

