  religion_jewish_desc: "Plus ancienne religion abrahamique, le judaïsme s'appuie sur la Torah et les traditions millénaires du peuple juif, remontant à plus de 3 000 ans."
  religion_zoroastrian_desc: "Ancienne foi de l'Empire perse, le zoroastrisme est une religion monothéiste suivant les enseignements du prophète Zoroastre, centrée sur le combat entre le bien et le mal."
  religion_ibadi_desc: "Branche minoritaire de l'islam, l'ibadisme est principalement présent à Oman. Ses adeptes prônent une interprétation stricte et originelle de la charia, se distinguant du sunnisme et du chiisme."
  religion_sikh_desc: "Fondé par Guru Nanak au XVIe siècle au Pendjab, le sikhisme est une foi monothéiste prônant l'égalité de tous et le service désintéressé."
  religion_theravada_desc: "Branche du bouddhisme dominante en Asie du Sud-est, elle se concentre sur les Canons pâlis et l'ascèse monastique pour atteindre l'éveil (Nirvana)."
  religion_vajrayana_desc: "Aussi appelé bouddhisme tantrique ou lamaïsme, il vise l'éveil rapide via des rituels complexes sous la guidance d'un maître ou d'un lama."
  religion_mahayana_desc: "Branche la plus pratiquée du bouddhisme, le Mahayana met l'accent sur la compassion et l'idéal du bodhisattva, celui qui retarde son propre éveil pour aider les autres."
  religion_catholic_desc: "Héritier du rite latin, le catholicisme reconnaît l'autorité suprême du pape à Rome comme successeur de Saint Pierre."
  religion_confucian_desc: "Plus une philosophie éthique qu'une religion déiste, le confucianisme structure la société chinoise autour du respect des ancêtres, de la piété filiale et de l'harmonie sociale."
  religion_hindu_desc: "L'hindouisme regroupe un vaste ensemble de traditions spirituelles et philosophiques indiennes, unies par des concepts comme le dharma et le karma."
  religion_orthodox_desc: "Issue du rite grec et byzantin, l'orthodoxie se considère fidèle aux canons de l'Église primitive et rejette l'autorité papale au profit de patriarcats nationaux."
  religion_protestant_desc: "Né de la Réforme de Martin Luther, le protestantisme privilégie le salut par la foi et l'autorité de la Bible, se divisant en de multiples dénominations indépendantes."
  religion_shia_desc: "Les musulmans chiites considèrent Ali, gendre de Mahomet, et ses descendants (les imams) comme les seuls guides spirituels et politiques légitimes de l'islam."
  religion_sunni_desc: "Branche majoritaire de l'islam, le sunnisme suit la tradition du prophète et reconnaît les premiers califes, dont Abou Bakr, comme successeurs légitimes."
  religion_coptic_desc: "L'Église copte est l'une des plus anciennes communautés chrétiennes, principalement basée en Égypte et suivant le rite alexandrin."
  religion_mormon_desc: "Fondé par Joseph Smith au XIXe siècle, le mormonisme se base sur le Livre de Mormon et accorde une importance vitale à la structure familiale éternelle."

  # USA ALIGNMENTS
  USA_prodem: "§BÉtats démocrates§!"
  USA_prodem_desc: "§BÉtats du progrès et de l'innovation§!\nCes régions soutiennent des politiques libérales, investissant massivement dans l'éducation, les technologies de pointe et l'environnement. Bien qu'elles puissent manquer de ressources naturelles, leur productivité élevée et leur attractivité pour les talents mondiaux en font les moteurs économiques de la nation."
  USA_progop: "§RÉtats républicains§!"
  USA_progop_desc: "§RÉtats du conservatisme et de la puissance§!\nCes États privilégient la liberté du marché, des impôts faibles et l'indépendance énergétique. S'appuyant sur l'industrie lourde, l'agriculture et l'extraction de ressources, ils constituent le socle industriel et militaire de l'Amérique."

