  demand_japan_commit_war_crime_desc: "Maintenant que les idées de pacifisme et de socialisme ont triomphé au Japon, notre pays a pu progressivement s'imposer comme le centre de la politique asiatique. Il est donc temps de régler définitivement la question de la culpabilité du militarisme japonais. Nous achèverons les tâches restées inachevées sous le contrôle du GHQ et de l'armée américaine, et laisserons les criminels de guerre et les bouchers du passé expier leurs crimes de guerre !"
