  asean_category: "ASEAN"
  asean_category_desc: "L'ASEAN est une organisation intergouvernementale à vocation essentiellement économique, basée à Jakarta et créée en 1967. Elle s'est depuis élargie pour inclure des nations initialement exclues en raison des tensions de la guerre froide. Elle s'efforce de contrebalancer l'influence croissante de la Chine tout en préservant son autonomie vis-à-vis de l'Occident. L'organisation est attachée aux principes du multilatéralisme, du droit international, du règlement pacifique des différends, de la non-ingérence et de l'autodétermination."
  asean_western_outlook_share_tt: "§CLes perspectives occidentales§! sont majoritaires au sein de l'ASEAN"
  asean_emerging_outlook_share_tt: "§GLes perspectives émergentes§! sont majoritaires au sein de l'ASEAN"
  asean_non_aligned_outlook_share_tt: "§RLes perspectives non alignées§! sont majoritaires au sein de l'ASEAN"

