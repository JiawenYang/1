  # CHINESE REGIONS (Amélioration du style descriptif)
  CHI_beijing_municipality_desc: "Cœur politique et culturel de la nation, Pékin est le centre névralgique de l'innovation technologique et de la diplomatie chinoise."
  CHI_tianjin_municipality_desc: "Porte maritime de la Chine du Nord, cette municipalité est un centre logistique et industriel majeur de la mer de Bohai."
  CHI_shanghai_municipality_desc: "Métropole mondiale et cœur financier du pays, Shanghai incarne la puissance économique et commerciale de la Chine moderne."
  CHI_tibet_autonomous_region_desc: "Toit du monde et barrière de sécurité écologique, le Tibet est une réserve stratégique de ressources et d'énergie propre."
  CHI_xinjiang_uygur_autonomous_region_desc: "Pivot de la nouvelle route de la soie, le Xinjiang est la sentinelle du Nord-ouest et le pont vers l'Asie centrale."

  # POETIC DESCRIPTIONS (Hong Kong, Macao, Taiwan)
  CHI_hong_kong_desc: "« Comme la panthère dorée veillant aux portes du palais, ma position est cruciale. Les prédateurs m'ont arraché à toi, Mère, mais mon âme appelle ton étreinte. Je veux revenir au foyer ! »"
  CHI_macau_desc: "« Mon nom n'est pas Macao, c'est celui que tu m'as donné. Trois cents ans de séparation n'ont pu effacer l'âme de mon âme. Mère, appelle-moi, je reviens vers toi ! »"
  CHI_taiwan_desc: "« Perle de la mer de Chine orientale, le sang de la loyauté coule dans mes veines. Mère, malgré les vents contraires, je suis prêt à lutter jusqu'à la dernière goutte pour retrouver mon foyer. »"

  # SITUATION XINJIANG
  CHI_XinJiang_Situation: "Instabilité au Xinjiang"
  CHI_XinJiang_Situation_desc: "Le niveau de menace lié au séparatisme affecte directement notre contrôle administratif et freine le développement économique de la région.\n\n§YMenace séparatiste§! : [?CHI.uighur_threat|%%]\n§YOpinion publique locale§! : [?CHI.uighur_opinion|%%]"

