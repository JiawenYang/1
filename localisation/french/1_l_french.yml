  china.76: "Une conférence sur le travail politique militaire s’est tenue à Gutian"
  china.76.a: "La conférence de Gutian brillera pour toujours."
  china.76.d: "Une conférence sur le travail politique militaire s’est tenue à Gutian, dans le comté de Shanghang, province du Fujian, le 30 octobre. Xi Jinping, secrétaire général du Comité central du PCC, président de la République populaire de Chine et président de la Commission militaire centrale, y a assisté le 31 et a prononcé un discours important. Xi Jinping a souligné que le thème contemporain du travail politique militaire est de se concentrer étroitement sur la réalisation du Rêve chinois de la grande renaissance de la nation chinoise et de fournir une forte garantie politique pour atteindre l’objectif du Parti de renforcer l’armée dans les nouvelles circonstances. Toute l’armée doit adhérer à la guidance du marxisme-léninisme, de la pensée Mao Zedong, de la théorie Deng Xiaoping, de l’importante pensée des « Trois Représentations » et de la conception scientifique du développement, mettre en œuvre le déploiement et les exigences du Comité central du Parti sur l’avancement global de l’État de droit et la discipline stricte du Parti, appliquer les principes de gouverner l’armée selon la loi et avec rigueur, se concentrer étroitement sur le thème contemporain du travail politique de notre armée, renforcer et améliorer notre travail politique dans les nouvelles circonstances, et donner pleinement son rôle de ligne de vie au travail politique pour renforcer et revitaliser l’armée."
  china.76.t: "Une conférence sur le travail politique militaire s’est tenue à Gutian"
