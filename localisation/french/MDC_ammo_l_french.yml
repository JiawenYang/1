 Ammo_stats_tt: "[Sl_stats_bypass_tt]"
 Ammo_stats_raw_tt: "$Ammo_header_tt$\n\n$Ammo_current_ammo_tt$\n$Ammo_gain_breakdown_tt$\n$Ammo_capacity_tt$\n\n$Ammo_demand_now_tt$\n$Ammo_demand_max_tt$\n$Ammo_effect_tt$\n\n£click_left §Y Clic gauche§! pour acheter 50 000 unités de munitions sur le marché pour 0,1 §Gmilliards§!\n\n£GFX_click_right §Y Clic droit§! pour mettre à jour les informations\n\nVous pouvez augmenter la consommation de munitions en maintenant £GFX_key_ctrl + £click_left §Y Clic gauche§! + §YCtrl§!\nVous pouvez diminuer la consommation de munitions en maintenant £GFX_key_ctrl + £GFX_click_right §Y Clic droit§! + §YCtrl§!\n\n$Ammo_army_header_tt$\n$Ammo_army_demand_now_tt$\n$Ammo_army_demand_bkdn_tt$\n$Ammo_army_demand_max_tt$\n\n$Ammo_air_header_tt$\n$Ammo_air_demand_now_tt$\n$Ammo_air_demand_max_tt$\n\n$Ammo_navy_header_tt$\n$Ammo_navy_demand_now_tt$\n$Ammo_navy_demand_max_tt$\n\n[Ammo_sl_time_remaining_body]"

 Ammo_desc_tt: "[Ammo_sl_desc_bypass_tt]"
 Ammo_desc_raw_tt: "§YLes munitions§! sont produites par les §Y$arms_factory_plural$§! de votre pays. Chaque §Y$arms_factory_plural$§! non endommagé contribue à §G100§! à la production de §Ymunitions§!.\n\nChaque pays a une capacité maximale de §Ymunitions§! qui peut être augmentée en construisant des §Y$supply_node$§! dans les États qu'il possède ou contrôle. Chaque §Y$supply_node$§! augmente la limite maximale de munitions de §G100000§!\n\n§YLes munitions§! sont utilisées par l'armée en combat. Attaquer consommera des §Ymunitions§! supplémentaires.\n\nEn temps de guerre, les §Ymunitions§! sont également consommées par les ailes aériennes déployées et les unités navales qui ne sont pas ancrées.\n\n"

