 Ammo_effect_tt: "Effet d'approvisionnement en munitions actuel: §Y[?summary_ammunition_effect|%]§!\nUne consommation insuffisante ou supplémentaire de munitions affecte considérablement les capacités de combat de notre armée, de notre force aérienne et de notre marine.\nSi les munitions sont en shortage, il est recommandé d'en limiter l'utilisation."

