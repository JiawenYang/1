l_french:
 #Chaîne événementielle de la crise politique américaine et de l'ordre néolibéral (contenu de guerre civile TFR entièrement retiré)
 usacw.5.t: "Trump assassiné"
 usacw.5.d: "Le 13 juillet 2024, l'ancien président est abattu lors d'un meeting en Pennsylvanie et meurt à l'hôpital. L'état d'urgence est déclaré ; la coalition républicaine s'effondre en une nuit, tandis que théories du complot et appels à la vengeance envahissent les rues."
 usacw.5.a: "Le pays a besoin de calme"
 usacw.6.t: "L'effondrement du Parti républicain"
 usacw.6.d: "La mort de Trump laisse le Parti républicain sans la seule figure capable de tenir ses factions ensemble. L'élection de novembre 2024 se déroule sous la menace de violences et avec une participation record ; les démocrates prennent la Maison-Blanche et les deux chambres. Les perdants refusent le résultat, les vainqueurs revendiquent un mandat de réforme radicale."
 usacw.6.a: "Une époque s'achève"
 usacw.7.t: "Paralysie diplomatique"
 usacw.7.d: "En janvier 2025, l'impasse constitutionnelle entre la Maison-Blanche et le Congrès gagne enfin le département d'État : les postes d'ambassadeurs restent vacants en masse, les nominations diplomatiques ne sont plus signées, et le renouvellement des traités comme les consultations avec les alliés sont gelés indéfiniment. Les engagements d'alliance de Washington se réduisent à du papier vide, et les câbles des ambassades du monde entier convergent : la machine diplomatique américaine s'est arrêtée. À Taipei, on comprend pour la première fois que plus personne ne pourra peut-être lever la plume qui signe leur garantie de sécurité."
 usacw.7.a: "Washington ne peut plus répondre"
 usacw.8.t: "L'ordre néolibéral s'installe"
 usacw.8.d: "Le 1er mars, la Maison-Blanche et le Congrès démocrate dévoilent un train de lois baptisé « Consensus de reconstruction » : dérégulation, privatisations, gouvernement technocratique et retour aux institutions mondiales. Au nom de « l'efficacité », l'État fédéral contourne le débat paralysé sur les droits des États, tandis que des conseillers de la Silicon Valley et de Wall Street s'installent directement dans les ministères. Les critiques parlent d'un coup d'État sans effusion de sang ; les partisans y voient la seule issue à la paralysie."
 usacw.8.a: "Le nouvel ordre commence"
 usacw.9.t: "Le mandat d'intervention mondiale"
 usacw.9.d: "Le 15 avril, le Congrès adopte à une écrasante majorité le Global Stability Authorization Act, offrant à l'exécutif un chèque en blanc pour déployer les forces américaines partout en Eurasie. L'ordre néolibéral exige une énergie bon marché, des routes maritimes ouvertes et des alliés dociles — autant de biens que seuls les groupes aéronavals et les drones peuvent conquérir. Dès ce jour, le destin de l'Amérique est soudé à la victoire sur les champs de bataille eurasiens."
 usacw.9.a: "Plus de retour en arrière"
 usacw.10.t: "Le pari de la République"
 usacw.10.d: "Les feux d'artifice du 4 juillet montent comme prévu, mais chacun sait ce que le pays célèbre vraiment. La Maison-Blanche a misé tout son capital politique sur une seule promesse : la victoire en Eurasie couronnera le nouvel ordre de trente nouvelles années dorées, tandis que la défaite ouvrira un règlement de comptes plus profond que la Grande Dépression. C'est un pari dont l'enjeu est le destin de la nation."
 usacw.10.a: "La victoire ou le néant"
 usacw.12.t: "La majorité permanente"
 usacw.12.d: "La victoire en Eurasie couronne l'ordre néolibéral. Les ressources bon marché et les dividendes du triomphe affluent, et l'opposition s'effondre à un chiffre dans les sondages. Les éditorialistes demandent désormais ouvertement si le parti unique n'est pas tout simplement la forme finale de la politique américaine — après tout, on ne remplace pas les vainqueurs. L'ère démocrate semble sans fin."
 usacw.12.a: "Une ère commence"
 usacw.13.t: "Le grand règlement de comptes"
 usacw.13.d: "La défaite en Eurasie crève tous les mensonges de l'ordre néolibéral. Un public furieux accable le parti qui a misé le destin de la nation, et un Parti républicain reconstruit revient avec un mandat écrasant, promettant un règlement de comptes avec les démocrates « de Wall Street à Hollywood ». Procureurs spéciaux, commissions de loyauté et procès politiques se succèdent — cette fois, les perdants paieront pour tout."
 usacw.13.a: "Ils répondront de tout"
 CHI_taiwan_us_support_tt: "Soutien américain à Taïwan : -40"


#Crise pétrolière américaine (adaptée de TFR)
tfr_usa.7.t: "Crise pétrolière aux États-Unis !"
tfr_usa.7.d: "Comme si la situation économique américaine ne pouvait pas empirer, l'effondrement de l'Arabie saoudite a créé une panique pétrolière qui a cloué le dernier cercueil de notre économie anémique."
tfr_usa.7.a: "Qu'avons-nous fait pour mériter ça ?!"
usa.170.t: "De la richesse à la pauvreté"
usa.170.d: "Il regarda, le cœur au fond des chaussettes et la mâchoire tombante, le chiffre rouge qui se présentait à lui. Le Dow Jones avait baissé comme jamais dans l'histoire - de 30 000 à 15 000 points en deux jours."
usa.170.a: "Et il sauta dans le blast glacé."
tfr_usa.202.t: "Les taux de pauvreté s'envolent"
tfr_usa.202.d: "Quelques semaines ont passé depuis le début de la crise pétrolière, mais la situation économique des États-Unis semble de plus en plus sombre."
tfr_usa.202.a: "Ce n'est que le début."
usa.217.t: "Le chômage atteint 20%"
usa.217.d: "Dans un rapport choc du Bureau des statistiques du travail, le taux de chômage aux États-Unis a atteint 20% pour la première fois depuis la Grande Dépression."
usa.217.a: "Le plus grand échec du gouvernement."
 usacw.14.t: "La mobilisation du Pacifique"
 usacw.14.d: "La diplomatie étant gelée et la politique intérieure en ruine, la Maison-Blanche prend la seule décision qui ne demande aucune loi : la flotte du Pacifique passe en état de guerre et les forces américaines rejoignent la coalition menée par le Japon contre la Chine. Le Congrès est informé, pas consulté. À Tokyo, la nouvelle est accueillie comme le retour d'un vieil allié ; à Pékin, elle est lue comme la preuve finale que Washington a choisi son camp."
 usacw.14.a: "La flotte met le cap à l'ouest"
 usacw.15.t: "Une nouvelle administration"
 usacw.15.d: "Le 20 janvier 2021, le 46e président prête serment dans une capitale ceinte de barrières et gardée par des troupes. La cérémonie parle d'unité, mais l'assemblée derrière lui est coupée en deux : un parti tient la Maison-Blanche, l'autre s'enterre pour quatre ans de résistance. Chaque nomination, chaque loi d'aide et chaque ligne du budget devient une tranchée à conquérir."
 usacw.15.a: "Quatre ans de guerre de tranchées"
 usacw.16.t: "Deux camps, une capitale"
 usacw.16.d: "La lune de miel dure moins d'un mois. Le premier train de mesures de relance est accueilli par une obstruction parlementaire ; l'opposition répond par une vague de poursuites au niveau des États. Les chaînes câblées se divisent en deux univers parallèles, et les Américains ordinaires choisissent leur chaîne et leurs faits ensemble. Le compromis n'est plus qu'un mot pour insulter quelqu'un."
 usacw.16.a: "Il n'y a plus de terrain d'entente"
 usacw.17.t: "Le budget ne passera pas"
 usacw.17.d: "Le printemps apporte le premier vrai test : le budget annuel. La Maison-Blanche veut un programme historique d'aide et de reconstruction ; l'opposition exige des coupes profondes et un recul des pouvoirs d'urgence. Aucun camp n'a les voix pour imposer sa volonté. Pour la première fois depuis des décennies, l'État fédéral vit au rythme des reconductions budgétaires mensuelles, et chaque agence doit planifier le pire."
 usacw.17.a: "Gouverner d'échéance en échéance"
 usacw.18.t: "L'impasse au Capitole"
 usacw.18.d: "En mai, les commissions ne siègent plus et l'hémicycle est devenu une scène. Les nominations judiciaires expirent sans réponse, les ambassades restent vacantes, et les auditions de contrôle se transforment en échanges d'invectives diffusés en direct. La machine législative n'a pas cessé de fonctionner : elle est simplement braquée sur l'autre camp. Même les affaires courantes de l'État exigent désormais une crise pour avancer."
 usacw.18.a: "La machine s'est bloquée"
 usacw.19.t: "Les agences s'éteignent"
 usacw.19.d: "Juin : les crédits n'étant toujours pas votés, les premières agences tombent à court d'argent. Les parcs nationaux ferment, les inspecteurs sont mis en congé, et les dossiers de prestations s'entassent dans le courrier non ouvert. Les fonctionnaires font la queue aux banques alimentaires de la capitale, et l'expression « employé non essentiel » devient une menace plutôt qu'un intitulé de poste."
 usacw.19.a: "Les lumières s'éteignent bureau par bureau"
 usacw.20.t: "Les marchés et les maires réagissent"
 usacw.20.d: "En juillet, les marchés obligataires cèdent les premiers : une agence de notation place la pleine foi et crédit des États-Unis sous surveillance négative. Les maires et les gouverneurs négocient directement avec le Trésor pour des fonds que le gouvernement fédéral ne peut plus promettre. Les créanciers étrangers demandent discrètement si la signature américaine vaut encore quelque chose, et personne à Washington ne sait répondre."
 usacw.20.a: "Le monde commence à nous décoter"
 usacw.21.t: "Le gouvernement ferme"
 usacw.21.d: "Le 1er août 2021, la dernière reconduction budgétaire expire et le gouvernement fédéral ferme. La Maison-Blanche et le Congrès se renvoient la faute depuis des tribunes séparées. Passeports, permis, paiements et salaires s'arrêtent à la même heure. Les engagements extérieurs de Washington restent signés sur le papier, mais les bureaux censés les appliquer sont éteints — et à Taipei, à Séoul et dans toutes les capitales alliées, les planificateurs commencent discrètement à supposer que l'Amérique ne tiendra plus sa parole."
 usacw.21.a: "L'Amérique ne répond plus au téléphone"
