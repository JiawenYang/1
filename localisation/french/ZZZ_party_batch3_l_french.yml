 zzz_party.120.t:0 "Un nouveau président à Carthage"
 zzz_party.120.d:0 "Le candidat indépendant Kais Saied remporte l'élection présidentielle de 2019, remodelant la politique tunisienne par des forces anti-establishment."
 zzz_party.120.a:0 "Accepter le résultat"
 zzz_party.123.t:0 "Pérou : la victoire d'un instituteur rural"
 zzz_party.123.d:0 "Instituteur rural, Castillo remporte le second tour de l'élection présidentielle de 2021, déplaçant le centre de gravité politique de Lima vers la gauche."
 zzz_party.123.a:0 "Accepter le résultat"
 zzz_party.124.t:0 "Crise politique à Lima"
 zzz_party.124.d:0 "Castillo est destitué et la vice-présidente Boluarte assume la présidence. Un gouvernement intérimaire technocratique prend le pouvoir au Pérou."
 zzz_party.124.a:0 "Accepter le résultat"
