 SOV_VLADIMIR_PUTIN_DESC:0 "Vladimir Vladimirovitch Poutine n'est pas parvenu au pouvoir en gravissant l'échelle habituelle, mais par les escaliers dérobés et les couloirs des services de renseignement. Il a débuté dans les rangs du KGB, consacrant la dernière décennie de l'Union soviétique à seconder la Stasi en Allemagne de l'Est. À la chute de l'Union, il entra en politique dans la ville rebaptisée Saint-Pétersbourg et connut une ascension fulgurante sous l'administration de Boris Eltsine. Il obtint l'investiture d'Eltsine lors des élections de 2000 et remporta aisément la majorité des suffrages. Il n'a plus quitté le Kremlin depuis.\n\nAu cours des deux dernières décennies, Poutine s'est maintenu au pouvoir par un mélange de soutien populaire, de failles constitutionnelles et de contrôle minutieux de l'opposition. Lorsqu'il atteignit la limite de deux mandats consécutifs en 2008, son ancien Premier ministre et allié proche Dmitri Medvedev fut président le temps d'un mandat, tandis que Poutine devint lui-même Premier ministre. Poutine retrouva ensuite la présidence en 2012. Il a traversé d'innombrables crises sous son administration, de la lutte contre les guérillas tchétchènes au soutien aux États rebelles pro-russes de l'est de l'Ukraine, et en est chaque fois sorti renforcé.\n\nUne part significative du public russe apprécie sincèrement le règne de Poutine, voyant en lui l'homme qui les a sortis de l'ère trouble d'Eltsine et a contribué à restaurer le rang de la Russie parmi les grandes puissances. Mais tout son soutien n'est pas spontané. Ses élections ultérieures ont été entachées d'accusations de fraude électorale, et les manifestations anti-gouvernementales font l'objet de répressions sévères. Les leaders de l'opposition, à l'intérieur comme à l'étranger, sont souvent surveillés, harcelés, arrêtés ou meurent dans des circonstances suspectes. Tout cela envoie un message clair : Vladimir Poutine estime avoir le mandat populaire pour gouverner, et il n'a pas l'intention d'y renoncer de sitôt."
 SOV_ALEXANDR_DUGIN_DESC:0 "Alexandre Guelevitch Douguine est né dans une famille d'intellectuels choyée par le régime soviétique; il se désillusionna toutefois rapidement de la bureaucratie communiste tardive et, comme nombre de ses pairs, chercha une autre vision du monde. Tandis que beaucoup rejoignaient les clubs clandestins de « vrais marxistes », Douguine commença son étude philosophique par l'« Ordre noir des SS » et les écrits de la Nouvelle Droite européenne, avant de les compléter par les œuvres de la Nouvelle Gauche. De là, il se lança dans la mystique et côtoya de nombreux théoriciens occultistes, chrétiens comme musulmans.\n\nAprès l'effondrement de l'URSS, Alexandre Guelevitch comprit que, quels qu'aient été les défauts du communisme, celui-ci tenait à distance la véritable horreur : le capitalisme. Il rejoignit les nationaux-bolcheviks, qui promettaient de fusionner tout ce qui était ancien pour donner naissance à quelque chose de nouveau. Douguine y devint membre permanent, son savoir ésotérique aidant à jeter les fondements du NBP. Après les années 2000, il se sépara de Limonov et entreprit de construire son propre mouvement, développant les idées des traditionalistes intégristes et des eurasistes. Toutes ses recherches aboutirent à son œuvre maîtresse : la Quatrième Théorie politique.\n\nSouvent qualifié de « philosophe le plus dangereux du monde » et affublé du surnom de « gourou du Kremlin » par les alarmistes occidentaux, Alexandre Guelevitch n'a en réalité jamais été proche d'aucun siège du pouvoir officiel. Jusqu'à maintenant. Après une défaite honteuse, Douguine comprit que ses appels à une résistance plus ferme et à l'unité de pensée étaient tombés dans l'oreille sourde des anciens dirigeants. Mais ceux-ci ont disparu. Alexandre Douguine, porté au pouvoir par le coup d'État des officiers eurasistes, a désormais une immense tâche : traduire sa vision philosophique dans la réalité — le rêve de renverser l'ordre mondial actuel, en menant une révolution métaphysique et géopolitique tumultueuse."
 SOV_DMITRY_MEDVEDEV_DESC:0 "Originaire de Léningrad, Dmitri Anatolievitch Medvedev a fait carrière dans l'ombre de figures plus influentes, gravissant l'Olympe de la politique russe non seulement grâce à son image inhabituelle pour un politicien, mais aussi grâce à sa dévotion envers Vladimir Poutine. Il commença sa carrière professionnelle comme juriste et enseignant, avant de se retrouver rapidement dans le cercle de Poutine, à la mairie de Saint-Pétersbourg. Dans les années 2000, il gravit rapidement les échelons, devenant chef de l'administration présidentielle puis vice-Premier ministre. En 2008, en raison des restrictions constitutionnelles, Poutine fut contraint de quitter la présidence, et Medvedev fut choisi pour lui succéder. Il remporta facilement l'élection, mais beaucoup le considérèrent comme un président intérimaire dont le rôle principal était de garder le siège pour Poutine.\n\nSa présidence resta marquée par des réformes modérées, telles que la modernisation économique et des initiatives prudentes de libéralisation, toutes demeurant dans les limites acceptables pour le système. L'une de ses principales réalisations fut la « réinitialisation » des relations avec les États-Unis, qui tourna bientôt court après les événements de 2014. Lorsque la question de briguer la tête de l'État se posa avant les élections de 2012, Medvedev céda la place à Poutine, annonçant qu'ils s'étaient entendus dès le départ sur ce type de « roque ». Après le retour de Poutine au Kremlin, Medvedev demeura dans l'appareil du pouvoir, occupant la présidence du gouvernement et dirigeant Russie unie, mais son autorité s'affaiblit avec le temps. En 2020, il fut transféré au poste de vice-président du Conseil de sécurité, ce que beaucoup perçurent comme une rétrogradation.\n\nLe voici désormais de nouveau à la tête de la Russie, mais sa politique ne ressemblera probablement guère à la précédente. Une chose est certaine : Medvedev a un plan d'action qu'il compte suivre avec résolution."
 SOV_VLADIMIR_ZHIRINOVSKY_DESC:0 "Parfois, pour comprendre l'histoire d'une personne, il faut suivre tout son parcours. Vladimir Volfovitch Jirinovski, né en 1946 à Alma-Ata, a profondément marqué la politique russe tout au long de sa longue vie. Devenu en 1989 le leader du Parti libéral-démocrate de l'Union soviétique, jeune orateur habile, il sut conquérir les cœurs. Dès le début, il plaida pour le soutien de la population russe dans les républiques nationales et voulut sauver l'Union soviétique. L'histoire en décida autrement : deux ans plus tard, Jirinovski regardait, impuissant, sa patrie se disloquer et les peuples naguère « fraternels » retourner leur colère absurde contre la population russe. C'est alors qu'il comprit que la Russie était devenue folle. L'effondrement du projet soviétique était inévitable, mais qui savait qu'il serait si douloureux ?\n\nLes années suivantes, Vladimir Volfovitch demeura le leader du Parti libéral-démocrate. S'étant adapté à l'existence dans le système de Poutine, il attendit. Orateur extrêmement outrancier, Jirinovski s'est forgé une certaine réputation dans la société russe. Certains le tenaient pour un bouffon, un fou, d'autres voyaient dans ses mots presque des prophéties. Mais le chef du LDPR était inflexible et défendait toujours le peuple russe et son bien-être.\n\nEt c'est désormais Vladimir Volfovitch qui siège au Kremlin. Pendant des décennies, des centaines de déclarations et d'actes, les siens comme ceux de son parti, l'ont élevé à l'Olympe politique. Pourtant, au fil des ans, le LDPR a absorbé toutes sortes de partisans, et l'avenir du parti ne dépend plus que de la volonté de Jirinovski. Poursuivra-t-il la voie de la démocratie avec un président fort, ou Jirinovski deviendra-t-il le César russe, apportant l'ordre d'une main de fer ? Le sort en est jeté."
 SOV_BORIS_NADEZHDIN_DESC:0 "Boris Borissovitch Nadejdin est né en 1963 à Tachkent, dans la RSS d'Ouzbékistan. Depuis plus de cinq générations, tous les hommes de sa famille portaient le même nom. Cependant, il n'était pas destiné à vivre longtemps en Asie centrale. En 1969, la famille de Boris s'installa à Moscou, où il fit ses études et travailla d'abord comme ingénieur, avant de devenir président de la coopérative « Integral ».\n\nMais Boris Borissovitch s'est toujours intéressé à la politique; c'est pourquoi, en 1990, lorsque la fermentation de la société atteignit son paroxysme, il passa à l'action. Il devint d'abord l'un des députés du peuple de Dolgoproudny, puis rejoignit le mouvement des Réformes démocratiques. Peu à peu, il entra dans le cercle social du célèbre Boris Nemtsov et obtint un poste prestigieux au sein de l'Union des forces de droite. Il fut ensuite membre du Parti de la croissance et de l'Initiative civique, et tenta même sa chance comme candidat de la plateforme libérale de Russie unie, sans succès.\n\nCependant, après la guerre d'Europe, la chance sourit à Nadejdin. Entré dans le cercle des personnes de confiance de Dmitri Medvedev, surtout après le règlement des relations avec les libéraux, il parvint rapidement à négocier une bonne position de Premier ministre au gouvernement. Et dès que Medvedev commença à envisager une possible démission, Boris sut ce qu'il fallait faire.\n\nEt voici Nadejdin à la barre du pays le plus grand et le plus puissant du monde. Il a promis des réformes au peuple russe, et il est responsable de ses paroles. Mais la manière dont il les appliquera ne dépend que de lui."
