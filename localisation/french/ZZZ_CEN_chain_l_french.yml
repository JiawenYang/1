 # Chaîne d'Amérique centrale (portée le 2026-11-07)
 NIC.4.t: "Amérique centrale unie"
 NIC.4.d: "Les guerres d'Amérique centrale ont pris fin. Le Guatemala, le Honduras, le Salvador, le Nicaragua, le Costa Rica et le Panama sont désormais administrés depuis une seule capitale. La reconstruction commence tandis que le nouvel État consolide l'isthme."
 NIC.4.a: "L'isthme est unifié"

 CEN_unification: "Unification de l'Amérique centrale"
 CEN_unification_with_panama: "Unifier l'Amérique centrale"
 CEN_unification_with_panama_desc: "Tous les gouvernements rivaux de l'isthme sont désormais sous notre contrôle ; il reste à absorber le Panama et à proclamer un État unique d'Amérique centrale."

 CEN: "Provinces-Unies d'Amérique centrale"
 NIC_puppet: "Gouvernement dirigé par le Nicaragua"
