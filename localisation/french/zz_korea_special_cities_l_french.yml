 # Divisions administratives spéciales de la péninsule coréenne (porté depuis TFR Korea Plus, ID d'États adaptés à Millennium Dawn)
 KOR_seoul_city: "Séoul, ville spéciale"
 KOR_seoul_city_desc: "\n§9Le battement du cœur de la capitale séculaire suit encore le pouls du fleuve Han : les tuiles du palais Gyeongbokgung et la voie pavée de Gwanghwamun se contemplent en silence entre les façades de verre des gratte-ciel. Dans les vieilles ruelles au nord du fleuve, les lumières de la tour Namsan veillent toute la nuit, tandis que sous le néon de Gangnam, les rues des académies privées sont déjà bondées dès cinq heures du matin — cette ville, qui a forgé les ruines de la guerre en métropole mondiale en un demi-siècle, a gravé « plus vite » dans le souffle de chacun et le « miracle du fleuve Han » dans les manuels de l'époque.\n\nPourtant, derrière les chiffres éclatants se cachent des emplois du temps minutieusement mesurés et des prix immobiliers suffocants, ainsi que la mémoire des vieux quartiers qui s'éteint en silence sous le rugissement des bulldozers. Les marches de pierre de la place Gwanghwamun ont porté les cris d'une révolution étudiante et un océan de bougies ; aujourd'hui, le tumulte de la démocratie s'est fondu depuis longtemps dans le flux quotidien de la circulation. Lorsque le premier métro franchit le pont de fer sur le Han, la métropole de plus de vingt millions d'habitants entame une nouvelle journée de course effrénée§!\n\n§HLe fleuve Han coule sans pause — la capitale séculaire, entre ruines et tours nouvelles, poursuit à jamais l'horizon de demain§!"
 KOR_incheon_city: "Incheon, ville métropolitaine"
 KOR_incheon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9Lorsque le couchant rouge s'infiltre sur les vasières enveloppées d'une épaisse brume marine, la ville dépose enfin le tumulte des heures et reprend un souffle profond et âpre. Derrière la romance du port ouvert, qui ouvrit le premier ses portes aux étrangers et accueillit la vague de la modernité, se nichent la douleur des invasions et la sueur d'une industrialisation féroce, incrustées dans chaque brique rouge.\n\nLorsque les gratte-ciel de verre, nés de la mer comblée, étalent un avenir étincelant, les vieilles ruelles du centre ancien, cachées dans leur ombre, s'enfoncent plus avant dans l'aliénation ; parmi le rugissement continu des camions et des avions, la ville endure la solitude d'une gare qui ne fait que voir partir les siens. Ce lieu où l'ascension éblouissante et la silhouette du déclin s'entrelacent dangereusement est une terre où les désirs du développement et les soupirs des restes s'écoulent mêlés au bruit des vagues§!\n\n§3Ville des frontières éternelles où coexistent l'exaltation de ceux qui partent et la tristesse de ceux qui restent§!"
 KOR_busan_city: "Busan, ville métropolitaine"
 KOR_busan_city_desc: "\n§9Le phare de Yeongdo veille sur un port où se pressent mille voiles, et les cris de l'aube du marché de Jagalchi réveillent la ville coincée entre montagne et mer. Ancienne capitale provisoire qui abrita un million d'âmes chassées par la guerre, Busan a brassé la nostalgie en lanternes ambrées le long des routes de colline, et forgé la ténacité de la survie en grues inlassables des terminaux à conteneurs. La plage de Haeundae et le chapelet de lumières du pont Gwangan sont sa carte de visite, mais ce sont les mains calleuses du marché aux poissons et les étincelles de soudure des chantiers qui soutiennent véritablement la ville.\n\nC'est une ville réchauffée par le dialecte et l'amitié, au caractère franc comme un vent de mer. Chaque automne, les étoiles du festival international du cinéma illuminent Haeundae, mais plus que les tapis rouges, les habitants de Busan croient à la sagesse du marchandage du marché. Montagne et mer ont pressé la ville en une légende longue et étroite : chaque jour, les grands navires sonnent leur corne et partent, portant son nom vers le monde§!\n\n§LVille indomptable entre montagne et mer, qui a brassé la nostalgie de la guerre en panache tourné vers l'océan§!"
 KOR_ulsan_city: "Ulsan, ville métropolitaine"
 KOR_ulsan_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_ulsan_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Le vent qui balaie les bambouseraies de la rivière Taehwa s'efforce de laver le stigmate du passé, mais c'est toujours le martèlement lourd des chantiers navals géants et le grondement des machines qui éveillent l'aube de la ville. La mer bleue où glissait jadis la baleine légendaire a été investie par des léviathans de fer, et la légende de la capitale industrielle, où « même un chien de passage tient un billet de dix mille won entre ses dents », repose précairement sur la fatigue des ouvriers en bleus tachés de mazout.\n\nDerrière les lumières éblouissantes du complexe pétrochimique qui ne s'éteignent jamais la nuit se profile l'ombre de l'instabilité structurelle de cette « ville-corporation », où le destin tout entier de la ville est otage du vacarme des conflits sociaux aigus et de l'ascension et de la chute d'un conglomérat. Cette terre qui a payé sa croissance du ciel et de la mer contemple aujourd'hui, plongée dans une profonde méditation, la grue rouillée au bout de la flèche et le grondement qui s'émousse du moteur industriel§!\n\n§gCitadelle de fer bâtie sur la tombe de la baleine, empire de contradictions dont la torche d'abondance brûle le souffle de demain§!"
 KOR_daegu_city: "Daegu, ville métropolitaine"
 KOR_daegu_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Le vaste bassin, ceinturé par le mont Palgongsan comme par un paravent, garde encore la gloire d'une modernisation plus brûlante que le soleil de l'été, mais ne peut plus évacuer sa chaleur refroidie vers l'extérieur et la fait fermenter en son sein. Le rugissement puissant des métiers à tisser qui habillaient tout le pays et la romance des pommes mûrissant en rouge se sont évanouis dans les pages du temps, et seule l'ombre d'indicateurs économiques figés depuis des décennies pèse lourdement sur la ville.\n\nLa forteresse solide connue comme le « cœur du conservatisme » est à la fois le bouclier contre les tempêtes extérieures et le haut mur qui isole de soi-même ; et au-delà de ce mur, que le souffle du changement lui-même n'a pu franchir, s'étend le lieu abandonné par une jeunesse qui vieillit à toute vitesse. Enfermée dans un entêtement et un exclusivisme aussi têtus que son relief clos, c'est une terre d'amour et de haine qui, sur la fierté de son passé brillant, endure douloureusement le présent§!\n\n§7Ma patrie parfumée, embaumée par le parfum du bignone\nLa rue du lever de soleil surplombant le mont Palgongsan\nToi et moi avons rêvé ici\nJ'ai rêvé d'un beau et tendre rêve\nLa rue d'espérance où ils marchaient ensemble\nLa rue d'amour où le bignone fleurit et se fane\nDaegu est ma patrie, ma chère patrie§!"
 KOR_daejeon_city: "Daejeon, ville métropolitaine"
 KOR_daejeon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daejeon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9L'arche du pont Expo se dresse au-dessus des douces ondes du Gapcheon comme pour peindre l'avenir ; pourtant, sous les lumières éblouissantes de cette cité scientifique ne demeure que le froid mordant de la raison, et non l'hospitalité généreuse des jours où l'on l'appelait « Hanbat ». C'était un nœud de transport où les rails s'entrecroisaient et attiraient d'innombrables pas d'autrui, mais la route elle-même engendra le destin solitaire d'une gare de passage, sans laisser les gens s'y installer.\n\nLe savoir enfermé derrière les hauts murs du complexe de recherche dérive comme une île, incapable de se fondre dans le déclin du vieux centre ; sous la blague autoflagellatrice de la « ville ennuyeuse » se tapissent l'ennui urbain profondément enraciné et la monotonie incolore d'un manque d'identité. Ce lieu où la fierté d'être au cœur de la République de Corée coexiste étrangement avec le sentiment d'être un étranger sans attaches est une ville planifiée grise, si parfaitement ordonnée qu'elle en est balayée par un vent de vide§!\n\n§2Station de correspondance incolore revêtue du manteau éclatant de la science — toutes les routes y mènent, mais personne n'y demeure§!"
 KOR_sejong_special_city: "Sejong, ville spéciale autonome"
 KOR_sejong_special_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_sejong_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9Quand la brume sur le fleuve Geum se dissipe, apparaît la perfection glaciale d'une immense ville planifiée, taillée au cordeau et au compas. Les doux chemins de terre du district de Yeongi, autrefois couverts de fleurs de pêcher, sont à jamais ensevelis sous l'asphalte et le béton, et la grandeur des bâtiments gouvernementaux érigés au nom du grand dessein d'un développement équilibré a, au contraire, brutalement effacé la mémoire ancienne de cette terre.\n\nLa nuit, seules les lumières de la tour du complexe gouvernemental dérivent comme une île solitaire, et la rue laissée derrière le départ des inconnus montant dans les bus pour Séoul bat creux, comme un cœur artificiel greffé incapable de battre juste. Dans la forêt d'immeubles identiques, la diversité étouffe ; bien qu'elle imite Séoul, la ville n'est pas encore devenue Séoul : seule la logique grise d'une administration sans âme la gouverne, en faisant une capitale inachevée§!\n\n§7Paradis artificiel à nu, ciselé dans les lignes droites tracées à la règle sur la carte, qui a tranché jusqu'au souffle humain et aux vieux souvenirs§!"
 KOR_gwangju_city: "Gwangju, ville métropolitaine"
 KOR_gwangju_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9Quand la douce crête du mont Mudeungsan étreint la ville comme les bras d'une mère, les souvenirs écarlates de Mai, fidèles au nom « Bitgoeul », embrasent le bitume de chaque rue. L'histoire noble d'une démocratie conquise par le sang et les larmes est devenue l'âme de la ville, mais paradoxalement, la plaque sacrée de « sanctuaire de la démocratie » est aussi devenue le lourd carcan qui l'a enchaînée au passé.\n\nCette ville, qui n'a pu jouir pleinement des fruits de l'industrialisation au long de discriminations et d'un isolement politique prolongés, cache l'ombre du déclin derrière la fierté de son patrimoine artistique resplendissant, tandis que les clameurs passionnées qui proclamaient jadis la justice ont perdu leur chemin et se sont brisées contre la dure réalité de la survie. Ce lieu qui brûla le premier les ténèbres de son époque mais dut demeurer en marge du progrès est encore une terre qui console des cœurs meurtris entre sa fière histoire de lutte et la réalité glacée§!\n\n§tSans laisser d'amour, sans laisser de gloire, sans laisser de nom\nLe serment de sang d'avancer toute une vie\nLes camarades sont partis, seul le drapeau flotte\nNe chancelons pas jusqu'à ce que se lève un jour nouveau§!"
 KOR_jeju_special_self_governing_province: "Jeju, province spéciale autonome"
 KOR_jeju_special_self_governing_province_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_jeju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9Quand les vagues furieuses se brisent dans chaque fissure du basalte noir et que les fleurs jaunes de colza s'épanouissent dans l'étreinte généreuse du Hallasan, l'île resplendit comme un paradis terrestre gardant le mystère des origines. Pourtant, le cri tragique du 3 avril, enchâssé dans chaque goutte de camélia rouge, demeure enseveli au creux des oreums, et le paisible paysage devient parfois un paradoxe glaçant qui transperce le cœur.\n\nPour la romance et « l'effet cure » des gens du continent, la forêt de Gotjawal et le littoral ont été dévastés sans mesure et gémissent sous le poids d'un développement insensé, tandis que l'abondance des déchets et des eaux usées étouffe lentement le souffle bleu, autrefois pur, de la mer. La route côtière, accaparée par le capital, s'est remplie de « lieux tendance » éblouissants, mais les habitants autochtones dépossédés sont relégués en marge, et sous les faux-semblants de l'illusion étrangère, l'île souffre en perdant sa langue et son esprit§!\n\n§OUne histoire tragique ensanglantée et les plaies d'un développement avide, délibérément recouvertes par de beaux paysages — un duo précaire du paradis§!"
 PRK_pyongyang_city: "Pyongyang, ville spéciale"
 PRK_pyongyang_city_desc: "\n§9Pyongyang, capitale de la révolution, est le cœur de la grande Corée du Juche et la patrie dans le cœur de tout notre peuple. C'est la forteresse invincible que le Grand Dirigeant camarade Kim Il Sung a libérée de la domination de l'impérialisme japonais et que le Grand Commandant camarade Kim Jong Il a fermement défendue comme le précieux sabre de la révolution du Songun.\n\nLe Pyongyang d'aujourd'hui, sous la sage direction du camarade Kim Jong Un, Dirigeant suprême respecté, réalise sans cesse des bonds de développement et se métamorphose en un pays idyllique socialiste qui fait l'admiration du monde. Les statues de bronze du Grand Dirigeant et du Grand Commandant dressées sur la colline de Mansudae sont devenues le phare de la fidélité inébranlable des dizaines de millions de soldats et civils, et le flambeau immortel qui embrase la tour de l'idée du Juche éclaire la voie de la victoire pour la cause révolutionnaire du Juche à travers le monde.\n\nIci, à Pyongyang, notre nation de Kim Il Sung s'unit fermement autour du Parti et, par la force de l'unité des cœurs, se lance vers l'avenir d'une patrie prospère§!\n\n§RMême en m'offrant encore et encore, ce cœur est sans limite — mon cher Pyongyang, je t'aime…§!"
 # Dirigeants éternels (Kim Il-sung / Kim Jong-il)
 NKO_kim_il_sung_eternal_leader: "Leader Éternel"
 NKO_kim_il_sung_eternal_leader_desc: "§AGrand Leader :§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_il_sung_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§LLe Grand Leader naquit le 15 avril 1912 (an 1 du Juche) dans une famille patriote à Pyongyang, la capitale révolutionnaire où la tragédie des malheurs nationaux se tressait le plus lourdement dans l'histoire moderne de la Corée. Son père, M. Kim Hyong Jik, lui dit qu'il fallait chérir de grandes aspirations et cultiva en lui l'amour de la patrie.\n\nLe 25 avril 1932 (an 21 du Juche), le Grand Leader organisa le détachement de partisans populaires antijaponais, puis, en 1934 (an 23 du Juche), l'étendit et le réorganisa en Armée révolutionnaire populaire de Corée, menant une lutte révolutionnaire antijaponaise acharnée pour libérer entièrement la patrie de l'occupation coloniale barbare des diables japonais instaurée sur la péninsule coréenne.\n\nAu terme de vingt printemps de lutte révolutionnaire antijaponaise, le Grand Leader accomplit la libération complète de la péninsule coréenne du joug colonial japonais. Ayant posé une base solide pour l'édification d'un État indépendant et souverain dans de nombreux domaines, il fonda le 10 octobre 1945 (an 34 du Juche) le Parti du travail de Corée, le parti mère de notre nation, puis fonda le 9 septembre 1948 (an 37 du Juche), pour la première fois dans l'histoire, la République populaire démocratique de Corée, la grande patrie de tout le peuple coréen.\n\nLe 25 juin 1950 (an 39 du Juche), alors que les impérialistes américains, menaçant l'autonomie de notre République, déclenchaient une invasion armée à grande échelle, le Grand Leader passa immédiatement à la contre-offensive et, en présentant les multiples principes opérationnels élaborés durant la lutte révolutionnaire antijaponaise, écrasa l'ennemi d'un seul coup. Ayant efficacement brisé l'offensive à grande échelle des impérialistes américains, le Grand Leader mena la grande guerre de libération de la patrie à la victoire§!\n\n§H« Le Grand Leader et le Grand Commandant demeureront à jamais avec notre peuple comme le symbole éternel de la Corée du Juche, et les immenses exploits révolutionnaires bâtis par le Leader et le Commandant resteront immortels avec l'histoire. »\n- Le Dirigeant suprême respecté§!"
 NKO_kim_jong_il_eternal_leader: "Dirigeant Éternel"
 NKO_kim_jong_il_eternal_leader_desc: "§AGrand Commandant :§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_jong_il_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§LLe Grand Dirigeant, fils du Grand Leader Kim Il Sung et de l'héroïne antijaponaise Kim Jong Suk, naquit le 16 février 1942 (an 31 du Juche) au camp secret du mont Paektu, alors que se poursuivait la lutte armée contre le Japon. Depuis le début de son travail au Comité central du Parti du travail de Corée, le 19 juin de l'an 53 du Juche (1964), le Grand Commandant a accompli devant l'époque et l'histoire des exploits immortels.\n\nLe 25 août 1960 (an 49 du Juche), le Grand Dirigeant inspecta en personne la 105e division blindée de la Garde de Séoul Ryu Kyong Su de l'Armée populaire de Corée, consacrant ses forces supremes au renforcement de l'armée populaire, poussant avec puissance les œuvres de la révolution et de l'édification par la force de l'armée populaire, franchit le premier pas de la politique du Songun et renforça de manière globale l'industrie de défense autonome et modernisée.\n\nLe Grand Dirigeant proclama officiellement la grande idéologie révolutionnaire du Juche, créée par le Grand Leader, comme le kimirsenisme, la glorifia comme l'idéologie directrice éternelle du Parti et de l'État, et présenta la kimirsenisation de toute la société comme le programme suprême du Parti.\n\nHaut porteur du testament du Grand Leader sur la réunification de la patrie, il établit les trois chartes de la réunification de la patrie, favorisa la Déclaration conjointe du 15 juin et la Déclaration du 4 octobre entre le Nord et le Sud de la péninsule coréenne et, sous le slogan « Nous sommes une seule nation », ouvrit une nouvelle ère du mouvement de réunification indépendante dans laquelle toute notre nation avance unie§!\n\n§H« Le Grand Leader et le Grand Commandant demeureront à jamais avec notre peuple comme le symbole éternel de la Corée du Juche, et les immenses exploits révolutionnaires bâtis par le Leader et le Commandant resteront immortels avec l'histoire. »\n- Le Dirigeant suprême respecté§!"
