l_french:
 #Chaîne d'événements de la Sixième Guerre du Moyen-Orient
 mew.0.t: "Les canons de Gaza"
 mew.0.d: "Aux premières heures du 9 octobre 2020, Tsahal franchit la frontière de Gaza et l'opération Épée de fer débute pleinement. Les colonnes blindées avancent sous couverture de drones tandis que l'aviation pilonne nuit et jour le réseau de tunnels du Hamas. Le gouvernement israélien annonce à la nation qu'il s'agit d'un « nettoyage limité » des infrastructures terroristes. Mais au Caire comme à Damas, personne n'y croit : quand les chars israéliens entrent dans la banlieue de Gaza, chacun voit ce que « limité » signifie réellement."
 mew.0.a: "Faire payer Gaza."
 mew.1.t: "L'incendie se rallume au Moyen-Orient"
 mew.1.d: "Alors que le plan d'annexion de la vallée du Jourdain avance avec la bénédiction de Washington et que les Accords d'Abraham divisent le monde arabe, les Palestiniens abandonnés se soulèvent à Gaza et en Cisjordanie. Les affrontements sanglants du Mont du Temple début octobre sont la goutte de trop : des roquettes s'abattent sur les villes israéliennes depuis Gaza, le Hezbollah du Liban sud passe en alerte maximale et les blindés syriens se massent sur le front du Golan. Les lignes téléphoniques entre Le Caire et Damas ne dorment pas de la nuit - la guerre d'Octobre 1973 semble se répéter un demi-siècle plus tard."
 mew.1.a: "Une nouvelle guerre d'Octobre ?"
 mew.2.t: "La Sixième Guerre du Moyen-Orient"
 mew.2.d: "À six heures du matin, heure du Caire, l'Égypte, la Syrie et le Hezbollah annoncent des opérations militaires conjointes contre Israël ; l'OLP et le Hamas répondent à l'appel en quelques heures. La coalition proclame vouloir « stopper l'annexion et libérer les territoires occupés ». Tsahal se mobilise sur tous les fronts tandis que le Dôme de fer intercepte les roquettes au-dessus de Tel Aviv. Pour la première fois depuis 1973, le monde arabe s'est uni contre Israël - et l'Amérique, engloutie par la pandémie et les élections, ne peut que regarder le Moyen-Orient brûler."
 mew.2.a: "Que Dieu les garde tous."
 mew.3.t: "Décision à la Maison-Blanche"
 mew.3.d: "Sur les écrans du Pentagone, la carte du Moyen-Orient change de couleur d'heure en heure. L'équipe de sécurité nationale est divisée : les faucons exigent une aide militaire d'urgence à Israël, voire un groupe aéronaval en Méditerranée orientale ; le chef de cabinet rappelle au Président que les morts du COVID grimpent encore, que l'élection est dans quelques semaines et que les électeurs ne veulent plus de bottes américaines sur le sable. L'ambassadeur d'Israël attend depuis deux heures."
 mew.3.a: "America First. Qu'ils se débrouillent."
 mew.3.b: "Approuver l'aide militaire d'urgence - sans troupes."
 mew.4.t: "Crise pétrolière mondiale"
 mew.4.d: "La guerre au Moyen-Orient frappe les artères énergétiques du globe. Le trafic de Suez est paralysé, les producteurs du Golfe subissent des pressions pour choisir leur camp et le brut s'envole en quelques jours. Les pétroliers font la queue au large de Rotterdam et de Singapour tandis que les gouvernements puisent dans les réserves stratégiques. Les analystes préviennent que le choc pourrait dépasser l'embargo de 1973 - et cette fois, les grandes puissances, embourbées dans la pandémie, ne peuvent amortir la chute."
 mew.4.a: "Faites le plein tant qu'il est temps."
 mew.5.t: "Tsahal entre dans Gaza"
 mew.5.d: "Le Conseil de sécurité se réunit en urgence et se sépare sur des récriminations mutuelles. Les hôpitaux de Gaza sont remplis de blessés en quelques heures, l'Égypte ouvre le passage de Rafah aux réfugiés, et le Hamas appelle tout le monde arabe à « ne plus se taire ». Dans leurs appels nocturnes, les monarchies du Golfe échangent le même verdict : si elles restent encore à l'écart, elles seront les prochaines sur la liste des annexions."
 mew.5.a: "Une fois encore, le monde se contente de regarder."
 mew.6.t: "La coalition arabe et l'Axe de la résistance entrent en guerre"
 mew.6.d: "Trois jours plus tard, l'Égypte et la Syrie annoncent honorer le pacte de défense de Jérusalem, et l'Algérie, la Libye et le gouvernement libanais suivent en déclarant la guerre à Israël. Presque à la même heure, l'Axe de la résistance dirigé par l'Iran franchit la frontière : le Hezbollah déverse ses roquettes depuis le Liban sud, les milices chiites irakiennes acheminent des hommes vers la Syrie par les passages ouverts, et la déclaration de Téhéran tient en une phrase - « De la Méditerranée au golfe Persique, aucun champ de bataille n'est isolé. » Israël se retrouve face à deux fronts : une armée régulière commandée depuis Le Caire, et un axe de résistance commandé depuis Téhéran."
 mew.6.a: "La Sixième Guerre du Moyen-Orient a réellement commencé."
 mew.10.t: "Le drapeau palestinien sur Jérusalem"
 mew.10.d: "La résistance israélienne a fini par s'effondrer sous les coups de la coalition. Les combattants palestiniens entrent les premiers dans Tel Aviv tandis que les troupes égyptiennes et syriennes nettoient les poches restantes. L'OLP proclame un État palestinien unifié avec Jérusalem pour capitale. Des centaines de milliers de colons juifs évacuent précipitamment vers les camps de Chypre et d'Europe du Sud ; ceux qui n'ont pas pu partir affrontent un destin incertain. Près de quatre-vingts ans d'expérience sioniste sont balayés, et le monde arabe célèbre une semaine durant - mais sous la table des vainqueurs, de nouvelles mèches couvent déjà."
 mew.10.a: "Une époque s'achève."
 mew.11.t: "L'alliance militaire du Caire"
 mew.11.d: "La victoire appartient à tout le monde arabe, mais le partage des dépouilles exige de l'ordre. Le président égyptien convie les dirigeants de la Syrie, de la Palestine et de la résistance libanaise au Caire pour transformer la coordination de guerre en alliance militaire permanente : commandement unifié, défense aérienne commune, renseignement partagé. Damas signe la première - la Syrie en reconstruction a besoin du bouclier égyptien, et Le Caire a besoin de Damas pour prouver que le chef du monde arabe est de retour."
 mew.11.a: "Pour la première fois, les Arabes ont gagné une guerre à leur manière."
 mew.20.t: "Le Grand Israël"
 mew.20.d: "La guerre s'est terminée comme nul ne l'attendait : les gains initiaux de la coalition ont été brisés un à un par Tsahal. Le Sinaï a encore changé de mains, le Liban sud est tombé sous occupation israélienne totale, et Damas comme Le Caire ont demandé la paix. Le cabinet de sécurité a alors dévoilé son « extension de souveraineté » : toute la Cisjordanie (5 655 km², vallée du Jourdain et toutes les colonies comprises) et la bande de Gaza (365 km²) sont officiellement incorporées à Israël ; le Liban sud au-delà du Litani (environ 1 000 km²) devient une zone de sécurité ; les gouvernorats syriens de Deraa et de Soueïda (environ 9 280 km²) sont détachés pour créer de la profondeur à l'est du Golan ; la péninsule du Sinaï (environ 61 000 km²) passe sous occupation israélienne de long terme. Avec Jérusalem-Est et le Golan déjà annexés, Israël a avalé quelque 77 000 kilomètres carrés d'un seul coup - « de la mer au Jourdain » enfin, et la vieille promesse « du Nil à l'Euphrate » posée pour la première fois sur la table du cabinet. Au Capitole, les élus évangéliques trinquent à la prophétie biblique ; dans les rues de Tel Aviv, les vivats n'étouffent pas un malaise plus profond - la nation vient d'avaler des millions d'Arabes qu'elle ne pourra jamais digérer."
 mew.20.a: "La Terre promise, en actes."
 mew.21.t: "La fureur arabe"
 mew.21.d: "La victoire totale d'Israël a embrasé la colère du monde musulman. De Casablanca à Jakarta, des millions de personnes descendent dans la rue en brûlant les drapeaux israélien et américain ; les gouvernements arabes vacillent sous la « honte de la défaite » tandis que les manifestations muent en cris de changement. Les analystes préviennent que la haine née de cette guerre empoisonnera le Moyen-Orient pour une génération - et les enfants palestiniens qui grandissent dans les décombres en sont les graines les plus radicales."
 mew.21.a: "Cela ne finira jamais. Jamais."
 mew.30.t: "L'addition de Téhéran est arrivée"
 mew.30.d: "Pour la première fois depuis le début de la guerre, le cabinet de sécurité de Jérusalem met l'Iran lui-même sur la table. Téhéran s'est caché derrière ses mandataires tout du long : roquettes du Hezbollah, milices irakiennes, drones yéménites. La coalition arabe est brisée, la nouvelle administration de Washington vient de gagner la guerre eurasienne et veut refaire l'ordre du Moyen-Orient, et les monarchies du Golfe souhaitent la disparition de la République islamique plus que quiconque. Un plan commun est posé : Israël fournit l'aviation et le renseignement, l'Amérique les porte-avions et le soutien stratégique, le Golfe l'argent et les bases. L'objectif est de détruire le programme nucléaire iranien et les Gardiens de la révolution - et de remettre les Pahlavi sur le trône du Paon."
 mew.30.a: "Cette fois, plus de mandataires."
 mew.31.t: "L'aviation américano-israélienne frappe l'Iran"
 mew.31.d: "Les avions israéliens traversent l'espace jordanien et irakien et pilonnent toute la nuit les installations nucléaires de Natanz, Fordow et Ispahan ; la Cinquième flotte américaine quitte Bahreïn et des Tomahawks filent au-dessus du détroit d'Ormuz ; les bases aériennes d'Arabie saoudite, des Émirats, du Koweït, du Qatar, de Bahreïn et d'Oman s'ouvrent simultanément aux appareils américains. Les sirènes hurlent sur Téhéran jusqu'à l'aube et les Gardiens de la révolution jurent de « mettre toute la région en feu ». En quelques heures, le détroit d'Ormuz est déclaré fermé et les prix du pétrole bondissent à des niveaux que personne n'ose coter."
 mew.31.a: "La deuxième décennie du Moyen-Orient commence."
 mew.32.t: "Le trône du Paon revient aux Pahlavi"
 mew.32.d: "La guerre s'achève avec la chute de Téhéran. Les derniers Gardiens de la révolution résistent à Tabriz et Machhad, puis signent à la table des négociations. Reza Pahlavi II arrive de Paris à l'aéroport de Mehrabad tandis que des centaines de milliers de personnes agitent le Lion et Soleil dans les rues. Depuis la place Azadi, il annonce la restauration de la monarchie constitutionnelle, l'abolition de la fonction de Guide suprême et un traité de paix avec Israël, l'Amérique et les États du Golfe. Quarante et un ans plus tard, la dynastie Pahlavi est revenue là où elle avait commencé - mais cette fois, le monde arabe sunnite et les porte-avions de Washington se tiennent derrière elle."
 mew.32.a: "Le Shah est de retour - mais l'Iran n'est plus l'Iran qu'il a quitté."
 MEW_arab_military_alliance: "Alliance militaire arabe"
 #Événement et esprit de la crise pétrolière réécrits pour 2020 (remplace l'original MD)
 usa_economic_events.38.t: "La crise énergétique de 2020"
 usa_economic_events.38.d: "Le déclenchement de la Sixième Guerre du Moyen-Orient a plongé les marchés pétroliers dans la panique : le canal de Suez est fermé, les exportations du Golfe sont étranglées et les prix atteignent des sommets inédits. Les consommateurs américains voient les prix à la pompe grimper chaque jour, étranglant des budgets déjà éprouvés par la pandémie. Les coûts de transport s'envolent, les compagnies aériennes suffoquent et les entreprises dépendantes du carburant perdent leurs marges. Les appels à l'indépendance énergétique se multiplient - mais cette fois, personne ne sait combien de temps durera la crise."
 usa_economic_events.38.a: "L'essence va coûter une fortune !"
 USA_early_2000s_energy_crisis: "La crise énergétique"
 USA_early_2000s_energy_crisis_desc: "La guerre au Moyen-Orient a perturbé les marchés pétroliers mondiaux ; les achats de panique et la spéculation ont fait grimper les prix, provoquant des pénuries d'essence et de produits pétroliers qui frappent l'économie américaine."
 #Sixième Guerre du Moyen-Orient : décisions israéliennes de guerre (portées depuis Flames Rising ISR_arab_war)
 ISR_arab_war: "La guerre israélo-arabe"
 ISR_arab_war_countdown: "Compte à rebours"
 ISR_arab_war_countdown_desc: "L'état-major avertit que les réserves et les munitions ne peuvent soutenir une longue guerre d'usure. Si les combats durent plus de 700 jours, Israël sera contraint d'accepter une solution à deux États."
 ISR_declare_victory: "Proclamer le Grand Israël"
 ISR_declare_victory_desc: "La guerre est terminée. Le cabinet de sécurité entreprend d'annexer les territoires occupés : la Cisjordanie, Gaza, le plateau du Golan et le Sud-Liban passent sous souveraineté israélienne."
 ISR_kill_syria: "Briser la Syrie"
 ISR_kill_syria_desc: "Les lignes de Damas se sont effondrées. Tsahal contraindra la Syrie à quitter la guerre, prendra la province de Daraa et établira une zone démilitarisée dans le sud de la Syrie."
 ISR_kill_egypt: "Briser l'Égypte"
 ISR_kill_egypt_desc: "Les formations blindées du Caire ont été détruites dans le Sinaï. Tsahal contraindra l'Égypte à quitter la guerre et placera la péninsule du Sinaï sous contrôle israélien."
