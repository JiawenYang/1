 E_Arty_Comp:0 "Batterie d'artillerie orientale"
 E_Arty_Comp_desc:0 "Unité d'artillerie orientale de niveau compagnie : six obusiers tractés, 45 soldats. Occupe un emplacement de soutien."
 E_AT_Comp:0 "Compagnie antichar orientale"
 E_AT_Comp_desc:0 "Unité antichar orientale de niveau compagnie : dix-huit lanceurs de missiles antichars lourds 9M133 Kornet, 90 soldats. Occupe un emplacement de soutien."
 E_AA_Comp:0 "Compagnie antiaérienne orientale"
 E_AA_Comp_desc:0 "Unité antiaérienne orientale de niveau compagnie : dix-huit systèmes sol-air courte portée canon-missile, 90 soldats. Occupe un emplacement de soutien."
 E_Recce_Comp:0 "Compagnie de reconnaissance orientale"
 E_Recce_Comp_desc:0 "Unité de reconnaissance orientale de niveau compagnie : six véhicules de reconnaissance chenillés BRM-3K, 100 soldats. Occupe un emplacement de soutien."
 E_Engi_Comp:0 "Compagnie du génie orientale"
 E_Engi_Comp_desc:0 "Sapeurs orientaux de niveau compagnie avec matériel de pontage, de déminage et de demolition, 110 soldats. Occupe un emplacement de soutien."
 E_Helo_Comp:0 "Compagnie d'aviation légère orientale"
 E_Helo_Comp_desc:0 "Unité d'aviation légère orientale de niveau compagnie : quatre hélicoptères d'attaque Mi-24/Ka-52, 20 soldats. Occupe un emplacement de soutien."
