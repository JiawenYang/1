 eng_ajax_fe_decision:0 "General Dynamics Ajax"
 eng_ajax_fe_decision_desc:0 "Resoudre les essais de bruit et de vibration et autoriser le vehicule de reconnaissance Ajax au service dans lArmee de terre britannique."
 eng_apache_ah2_fe_decision:0 "Apache AH-2"
 eng_apache_ah2_fe_decision_desc:0 "Accepter les AH-64E Apache Guardian remanufactures, designes Apache AH-2, en service dans lArmy Air Corps."
 eng_boxer_miv_fe_decision:0 "Boxer MIV"
 eng_boxer_miv_fe_decision_desc:0 "Accepter les premiers vehicules dinfanterie mecanisee Boxer en service dans les nouvelles Strike Brigades."
 eng_challenger3_fe_decision:0 "Challenger 3"
 eng_challenger3_fe_decision_desc:0 "Completer la mise a niveau lethale Rheinmetall Challenger 3, centree sur la nouvelle tourelle de 120mm a ame lisse, et autoriser la conversion de la flotte."
 eng_dreadnought_fe_decision:0 "Classe Dreadnought"
 eng_dreadnought_fe_decision_desc:0 "Completer le sous-marin lanceur de missiles balistiques de classe Dreadnought et reprendre la dissuasion maritime continue de la classe Vanguard."
 eng_e7_wedgetail_fe_decision:0 "Boeing E-7 Wedgetail AEW1"
 eng_e7_wedgetail_fe_decision_desc:0 "Introduire le E-7 Wedgetail AEW1 pour remplacer le Sentry AEW1 dans le role dalerte aerienne precoce."
 eng_p8a_poseidon_fe_decision:0 "Boeing P-8A Poseidon MRA1"
 eng_p8a_poseidon_fe_decision_desc:0 "Etablir la force de patrouille maritime Poseidon MRA1 de la RAF a la base de Lossiemouth."
 eng_protector_rg1_fe_decision:0 "Protector RG1"
 eng_protector_rg1_fe_decision_desc:0 "Certifier le GA-ASI MQ-9B SkyGuardian, designe Protector RG1, comme premier systeme daeronef telepilote de la RAF certifie pour lespace aerien civil."
 eng_sky_sabre_fe_decision:0 "Sky Sabre"
 eng_sky_sabre_fe_decision_desc:0 "Deployer le systeme de defense aerienne Sky Sabre, combinant les radars Giraffe, le systeme de gestion de combat MIC4AD de Rafael et les missiles Land Ceptor."
 eng_tempest_fe_decision:0 "BAE Tempest"
 eng_tempest_fe_decision_desc:0 "Completer le developpement du chasseur de sixieme generation Tempest dans le cadre du Programme mondial de combat aerien et lancer la production en serie."
 eng_type26_fe_decision:0 "Type 26 City Class"
 eng_type26_fe_decision_desc:0 "Mettre en service la premiere fregate anti-sous-marine Type 26, HMS Glasgow, comme colonne vertebrales de lescorte future du groupe aeronaval."
 eng_type31_fe_decision:0 "Type 31 Inspiration Class"
 eng_type31_fe_decision_desc:0 "Mettre en service la fregate polyvalente Type 31, dirige par le HMS Venturer, dans la Royal Navy."
 eng_type83_fe_decision:0 "Type 83 Destroyer"
 eng_type83_fe_decision_desc:0 "Developper et mettre en service le destroyer Type 83 de defense aerienne et antimissile integree pour remplacer le Type 45 dans les annees 2030."
 future_aircraft_category:0 "Programmes aviation futurs"
 future_naval_category:0 "Programmes navals futurs"
 future_tanks_category:0 "Programmes blindes futurs"
 ger_212cd_fe_decision:0 "Classe Type 212CD"
 ger_212cd_fe_decision_desc:0 "Completer le programme de sous-marin AIP Type 212CD a conception commune avec la Norvege et accepter le premier navire en service."
 ger_ch53k_fe_decision:0 "CH-53K King Stallion"
 ger_ch53k_fe_decision_desc:0 "Introduire le CH-53K helicoptere de transport lourd en tant que successeur de la flotte CH-53G."
 ger_eurodrone_fe_decision:0 "Eurodrone"
 ger_eurodrone_fe_decision_desc:0 "Completer la certification de lEurodrone MALE RPAS europeen et commencer les livraisons a lAllemagne, la France, lItalie et lEspagne."
 ger_f126_fe_decision:0 "F126 Klasse Koln"
 ger_f126_fe_decision_desc:0 "Mettre en service la fregate F126, dirigee par le F265 Koln, pour les missions de stabilisation et descorte outre-mer prolongees."
 ger_f35a_fe_decision:0 "F-35A Lightning II"
 ger_f35a_fe_decision_desc:0 "Prendre livraison du F-35A capable demporter des armes nucleaires pour remplacer le Tornado IDS dans les roles de partage nucleaire et de frappe."
 ger_heron_tp_fe_decision:0 "Heron TP"
 ger_heron_tp_fe_decision_desc:0 "Louer le IAI Heron TP comme aeronef telepilote interim arme a longue endurance pour les forces armees allemandes."
 ger_kf51_panther_fe_decision:0 "KF51 Panther"
 ger_kf51_panther_fe_decision_desc:0 "Completer les essais du demonstrateur Rheinmetall KF51 Panther et offrir la plateforme armee de 130mm pour la production en serie et lexportation."
 ger_leopard3_mgcs_fe_decision:0 "Leopard 3 (MGCS)"
 ger_leopard3_mgcs_fe_decision_desc:0 "Lancer la production en serie du systeme principal de combat terrestre franco-allemand, successeur du Leopard 2."
 ger_p8a_poseidon_fe_decision:0 "Boeing P-8A Poseidon"
 ger_p8a_poseidon_fe_decision_desc:0 "Prendre livraison du P-8A Poseidon pour remplacer le P-3C Orion dans le role de patrouille maritime a long rayon daction."
 ger_tiger_mkiii_fe_decision:0 "Tiger MkIII"
 ger_tiger_mkiii_fe_decision_desc:0 "Completer la mise a niveau mi-vie du Tiger MkIII avec de nouveaux systemes avioniques, capteurs et integration darmes pour la flotte dhelicopteres de combat allemands."
 jh7a_decision:0 "Xian JH-7A"
 jh7a_decision_desc:0 "Autoriser la mise a niveau mi-vie de la flotte de JH-7 Flying Leopard avec des systemes avioniques, de visee et de capacite anti-navire ameliores."
