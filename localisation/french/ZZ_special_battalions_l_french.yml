l_french:
 Marine_Bat_USA:0 "Bataillon d'infanterie de marine (É-U)"
 Marine_Bat_USA_desc:0 "Un bataillon d'infanterie de l'US Marine Corps : quatre compagnies de fusiliers avec LAV-25 et transports amphibies AAV-7 en appui. 2400 marines."
 Airborne_Bat_USA:0 "Bataillon d'infanterie aéroportée (82e)"
 Airborne_Bat_USA_desc:0 "Un bataillon d'infanterie parachutiste de la 82e division aéroportée : trois compagnies de fusiliers avec blindés légers aérolargables. 1750 parachutistes."
 Marine_Bat_SOV:0 "Bataillon d'infanterie navale (Russie)"
 Marine_Bat_SOV_desc:0 "Un bataillon d'infanterie navale russe : quatre compagnies sur transports amphibies BTR-80 avec appui-feu PT-76. 1750 fusiliers marins."
 Airborne_Bat_SOV:0 "Bataillon d'assaut aéroporté (VDV)"
 Airborne_Bat_SOV_desc:0 "Un bataillon d'assaut aéroporté de la VDV : trois compagnies sur véhicules de combat aéroportés BMD-4M, entièrement aérolargable. 1500 parachutistes."
 Marine_Bat_CHI:0 "Bataillon d'infanterie de marine (APL)"
 Marine_Bat_CHI_desc:0 "Un bataillon d'infanterie du corps des marines de l'APL : quatre compagnies sur véhicules de combat amphibies ZBD-05. 1500 marines."
 Airborne_Bat_CHI:0 "Bataillon d'infanterie aéroportée (APL)"
 Airborne_Bat_CHI_desc:0 "Un bataillon d'infanterie du corps aéroporté de l'APL : trois compagnies sur véhicules de combat aéroportés ZBD-03, entièrement aérolargable. 1500 parachutistes."
 Ranger_Bat_USA:0 "Bataillon de rangers (75e)"
 Ranger_Bat_USA_desc:0 "Un bataillon du 75e régiment de rangers : trois compagnies de fusiliers d'infanterie légère d'élite spécialisées dans la prise d'aérodromes et les raids d'action directe. 1160 rangers."
 SOF_Bat_USA:0 "Bataillon des forces spéciales (Bérets verts)"
 SOF_Bat_USA_desc:0 "Un bataillon des forces spéciales de l'US Army : trois compagnies de détachements opérationnels des Bérets verts pour la guerre non conventionnelle et la défense intérieure étrangère. 600 opérateurs."
 SEAL_Bat_USA:0 "Bataillon SEAL"
 SEAL_Bat_USA_desc:0 "Un bataillon de guerre spéciale navale : des pelotons SEAL spécialisés dans l'action directe maritime, l'infiltration côtière et la reconnaissance. 500 opérateurs."
 AirAssault_Bat_USA:0 "Bataillon d'assaut aérien (101e)"
 AirAssault_Bat_USA_desc:0 "Un bataillon d'infanterie d'assaut aérien de la 101e division aéroportée : trois compagnies de fusiliers héliportées par UH-60 avec escorte d'hélicoptères d'attaque. 1800 soldats."
 Spetsnaz_Bat_SOV:0 "Bataillon Spetsnaz du GRU"
 Spetsnaz_Bat_SOV_desc:0 "Un bataillon Spetsnaz du GRU : trois compagnies pour la reconnaissance en profondeur, le sabotage et l'action directe derrière les lignes ennemies. 700 opérateurs."
 SOV_Air_Assault_Bat:0 "Bataillon d'assaut aérien (VDV)"
 SOV_Air_Assault_Bat_desc:0 "Un bataillon de brigade d'assaut aérien de la VDV : trois compagnies de fusiliers héliportées par Mi-8/17. 700 soldats."
 SOF_Bat_CHI:0 "Bataillon spécial Lijian"
 SOF_Bat_CHI_desc:0 "Un bataillon de brigade d'opérations spéciales de l'APL : trois compagnies pour la reconnaissance stratégique, les raids et le sabotage. 800 opérateurs."
 AirAssault_Bat_CHI:0 "Bataillon d'assaut aérien (APL)"
 AirAssault_Bat_CHI_desc:0 "Un bataillon de brigade d'assaut aérien de l'armée de l'APL : trois compagnies de fusiliers héliportées par hélicoptères Z-8/Z-20. 1500 soldats."
 Para_Bat_ENG:0 "Bataillon parachutiste (Paras)"
 Para_Bat_ENG_desc:0 "Un bataillon du Parachute Regiment : trois compagnies de fusiliers d'infanterie légère aéroportée. 1750 parachutistes."
 RM_Cdo_Bat_ENG:0 "Bataillon commando des Royal Marines"
 RM_Cdo_Bat_ENG_desc:0 "Une unité commando des Royal Marines : trois compagnies spécialisées dans l'assaut amphibie et les raids côtiers. 1750 commandos."
 SAS_Bat_ENG:0 "Bataillon SAS"
 SAS_Bat_ENG_desc:0 "Un groupe d'escadrons sabre du 22 SAS : quatre escadrons pour la reconnaissance en profondeur, l'action directe et la libération d'otages. 500 opérateurs."
 REP_Bat_FRA:0 "Bataillon parachutiste du 2e REP"
 REP_Bat_FRA_desc:0 "Un bataillon du 2e régiment étranger de parachutistes (2e REP) : quatre compagnies de légionnaires parachutistes pour l'intervention rapide outre-mer. 2000 légionnaires."
 CdoMarine_Bat_FRA:0 "Bataillon des commandos marine"
 CdoMarine_Bat_FRA_desc:0 "Un bataillon de commandos de la Marine nationale : le commando Hubert et des compagnies d'assaut pour le contre-terrorisme maritime et les raids amphibies. 600 commandos."
 Marine_Bat_FRA:0 "Bataillon d'infanterie de marine (9e BIMa)"
 Marine_Bat_FRA_desc:0 "Un bataillon d'infanterie de marine de la 9e brigade d'infanterie de marine : trois compagnies sur VBCI/VAB pour les opérations amphibies et extérieures. 1750 marsouins."
 FJ_Bat_GER:0 "Bataillon Fallschirmjäger"
 FJ_Bat_GER_desc:0 "Un bataillon de parachutistes allemand : trois compagnies d'infanterie légère aéroportée de la division des forces rapides. 1750 Fallschirmjäger."
 KSK_Bat_GER:0 "Bataillon KSK"
 KSK_Bat_GER_desc:0 "Un bataillon du Kommando Spezialkräfte : quatre compagnies de commandos pour la reconnaissance spéciale, l'action directe et la libération d'otages. 500 opérateurs."
 Geb_Bat_GER:0 "Bataillon Gebirgsjäger"
 Geb_Bat_GER_desc:0 "Un bataillon d'infanterie de montagne : trois compagnies spécialisées dans la guerre en haute altitude et en hiver. 1900 Gebirgsjäger."
 PzGren_Bat_GER:0 "Bataillon Panzergrenadier"
 PzGren_Bat_GER_desc:0 "Un bataillon d'infanterie mécanisée équipé de VCI Marder/Puma, trois compagnies opérant aux côtés des brigades blindées. 1100 Panzergrenadiere."
 Airborne_Bat_JAP:0 "Bataillon de la 1re brigade aéroportée"
 Airborne_Bat_JAP_desc:0 "Un bataillon de la 1re brigade aéroportée de la JGSDF : trois compagnies de fusiliers parachutistes pour le déploiement rapide. 1500 parachutistes."
 ARDB_Bat_JAP:0 "Bataillon de déploiement rapide amphibie"
 ARDB_Bat_JAP_desc:0 "Un bataillon de la brigade de déploiement rapide amphibie : trois compagnies avec véhicules amphibies AAV-7 pour la défense des îles. 1750 soldats."
 Marine_Bat_KOR:0 "Bataillon de marine (Corée du Sud)"
 Marine_Bat_KOR_desc:0 "Un bataillon du corps des marines de la République de Corée : trois compagnies pour l'assaut amphibie et la défense des îles. 1750 marines."
 SOF_Bat_KOR:0 "Bataillon de mission spéciale 707"
 SOF_Bat_KOR_desc:0 "Le 707e groupe de mission spéciale : compagnies de contre-terrorisme et de reconnaissance spéciale du commandement de guerre spéciale de l'armée sud-coréenne. 500 opérateurs."
 Para_Bat_ISR:0 "Bataillon parachutiste (Tsahal)"
 Para_Bat_ISR_desc:0 "Un bataillon de la brigade des parachutistes de Tsahal : trois compagnies d'infanterie aéroportée avec équipes antichars organiques. 1500 parachutistes."
 Sayeret_Bat_ISR:0 "Bataillon Sayeret Matkal"
 Sayeret_Bat_ISR_desc:0 "L'unité de reconnaissance de l'état-major général : équipes de reconnaissance en profondeur et de libération d'otages sous l'état-major de Tsahal. 500 opérateurs."
 Para_Bat_RAJ:0 "Bataillon Para (FS)"
 Para_Bat_RAJ_desc:0 "Un bataillon Para (forces spéciales) de l'armée indienne : trois compagnies pour les raids aéroportés et les opérations spéciales transfrontalières. 1500 opérateurs."
 Gorkha_Bat_RAJ:0 "Bataillon de fusiliers gorkhas"
 Gorkha_Bat_RAJ_desc:0 "Un bataillon des Gorkha Rifles : trois compagnies de combattants des collines renommés, spécialisés dans la guerre en montagne et en jungle. 2000 fusiliers."
 SOF_Bat_NKO:0 "Bataillon de tireurs d'élite des FOS (APC)"
 SOF_Bat_NKO_desc:0 "Un bataillon de brigade de tireurs d'élite de la Force d'opérations spéciales de l'Armée populaire de Corée : trois compagnies pour l'infiltration et la reconnaissance à longue distance. 800 opérateurs."
 Amph_Bat_NKO:0 "Bataillon d'assaut amphibie (APC)"
 Amph_Bat_NKO_desc:0 "Un bataillon d'assaut amphibie de l'APC : trois compagnies entraînées aux opérations de débarquement avec appui d'aéroglisseurs et de chalands. 1500 soldats."
 AirAssault_Bat_UKR:0 "Bataillon d'assaut aérien (Ukraine)"
 AirAssault_Bat_UKR_desc:0 "Un bataillon des forces d'assaut aérien ukrainiennes : trois compagnies d'infanterie aéromobile à haute mobilité. 1500 soldats."
 SOF_Bat_UKR:0 "Bataillon SSO"
 SOF_Bat_UKR_desc:0 "Un bataillon des forces d'opérations spéciales ukrainiennes : trois compagnies pour la reconnaissance spéciale et l'action directe. 600 opérateurs."
 Bordo_Bat_TUR:0 "Bataillon des Bérets marron"
 Bordo_Bat_TUR_desc:0 "Un bataillon du commandement des forces spéciales turques : trois compagnies de Bérets marron pour la guerre non conventionnelle et le contre-terrorisme. 600 opérateurs."
 Komando_Bat_TUR:0 "Bataillon commando (Turquie)"
 Komando_Bat_TUR_desc:0 "Un bataillon de brigade commando de l'armée turque : trois compagnies spécialisées dans les opérations de montagne et de sécurité intérieure. 1500 commandos."
 Quds_Bat_PER:0 "Bataillon de la force Al-Qods"
 Quds_Bat_PER_desc:0 "Un bataillon de la force Al-Qods du CGRI : trois compagnies pour les opérations spéciales extraterritoriales et la guerre non conventionnelle. 700 opérateurs."
 Takavar_Bat_PER:0 "Bataillon Takavar"
 Takavar_Bat_PER_desc:0 "Un bataillon Takavar de l'armée iranienne : trois compagnies de commandos entraînées aux raids aéroportés et amphibies. 1500 commandos."
 Folgore_Bat_ITA:0 "Bataillon parachutiste Folgore"
 Folgore_Bat_ITA_desc:0 "Un bataillon de la brigade parachutiste Folgore : trois compagnies de parachutistes italiens pour le déploiement rapide. 1500 parachutistes."
 SanMarco_Bat_ITA:0 "Bataillon de marine San Marco"
 SanMarco_Bat_ITA_desc:0 "Un bataillon de la brigade marine San Marco : trois compagnies pour l'assaut amphibie et les opérations littorales. 1500 marines."
 GROM_Bat_POL:0 "Bataillon GROM"
 GROM_Bat_POL_desc:0 "Un groupe opérationnel du JW GROM : équipes de contre-terrorisme et d'opérations spéciales du commandement des troupes spéciales polonaises. 500 opérateurs."
 Legion_Bat_SPR:0 "Bataillon de la Légion (Espagne)"
 Legion_Bat_SPR_desc:0 "Une bandera de la Légion espagnole : trois compagnies d'infanterie d'assaut d'élite pour les opérations expéditionnaires. 1500 légionnaires."
 CSOR_Bat_CAN:0 "Bataillon du ROSC"
 CSOR_Bat_CAN_desc:0 "Un bataillon du Régiment d'opérations spéciales du Canada : trois compagnies pour l'action directe et la reconnaissance spéciale. 600 opérateurs."
 SASR_Bat_AST:0 "Bataillon SASR"
 SASR_Bat_AST_desc:0 "Un groupe d'escadrons du Special Air Service Regiment australien : trois escadrons sabre pour la reconnaissance à longue distance et l'action directe. 500 opérateurs."
 Jungle_Bat_BRA:0 "Bataillon de guerre en jungle"
 Jungle_Bat_BRA_desc:0 "Un bataillon d'infanterie de jungle de l'armée brésilienne : trois compagnies spécialisées dans les opérations fluviales et de jungle amazonienne. 1500 soldats."
 SSG_Bat_PAK:0 "Bataillon SSG"
 SSG_Bat_PAK_desc:0 "Un bataillon du Special Service Group de l'armée pakistanaise : trois compagnies pour la reconnaissance spéciale, les opérations aéroportées et le contre-terrorisme. 800 opérateurs."
 Marine_Bat_TAI:0 "Bataillon de fusiliers marins (Taïwan)"
 Marine_Bat_TAI_desc:0 "Un bataillon d'infanterie du Corps des fusiliers marins de la République de Chine, héritier des nageurs de combat « Dragon de mer » : trois compagnies embarquées sur des véhicules d'assaut amphibies AAV-7 pour la conquête des têtes de pont, avec des armes antichar et antiaériennes au niveau du bataillon. 700 fusiliers marins."
 SOF_Bat_TAI:0 "Bataillon d'opérations spéciales Liangshan (Taïwan)"
 SOF_Bat_TAI_desc:0 "Le bataillon d'opérations spéciales Liangshan du Commandement de l'aviation et des forces spéciales de l'armée (compagnie spéciale aéroportée) : commandos parachutistes entraînés au combat en montagne dans la Chaîne Centrale, aux contre-débarquements et à la défense des villes de l'île. 400 opérateurs."
 Saiqa_Bat_EGY:0 "Bataillon Saiqa"
 Saiqa_Bat_EGY_desc:0 "Un bataillon des forces Saiqa (Foudre) égyptiennes : trois compagnies de troupes de choc d'élite pour les opérations aéroportées et commandos. 1500 soldats."
