#Crise pétrolière : les Russes augmentent les prix
tfr_germany.16.t: "Les Russes augmentent les prix du pétrole"
tfr_germany.16.d: "Moscou n'a pas perdu de temps pour profiter de la crise pétrolière pour nous arnaquer. La Russie nous a informés qu'elle augmentait les prix du pétrole et du gaz expédiés vers l'Europe, invoquant des 'chaînes d'approvisionnement rompues' et un 'manque d'offre dû à l'instabilité au Moyen-Orient'. Cela revient à nous extorquer de l'argent en raison de notre manque de fournisseurs alternatifs."
tfr_germany.16.a: "Orques opportunistes !"
tfr_germany.17.t: "Manifestations anti-russes"
tfr_germany.17.d: "Ces dernières semaines, l'Allemagne a connu une augmentation significative des manifestations anti-russes dans les grandes villes comme Berlin, Munich et Hambourg. Ces manifestations sont principalement motivées par le mécontentement du public face à la décision de la Russie d'augmenter les prix du pétrole."
tfr_germany.17.a: "Compris."
