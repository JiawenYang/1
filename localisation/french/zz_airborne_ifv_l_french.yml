l_french:
 ZZ_airborne_ifv_chassis_bmd1: "BMD-1"
 ZZ_airborne_ifv_chassis_bmd1_desc: "Premier véhicule de combat d'infanterie aéroporté soviétique, larguable par avion de transport pour fournir un appui-feu aux parachutistes."
 ZZ_airborne_ifv_chassis_bmd1p: "BMD-1P"
 ZZ_airborne_ifv_chassis_bmd1p_desc: "Variante modernisée du BMD-1 avec blindage additionnel et conduite de tir améliorée, conservant le système de largage éprouvé."
 ZZ_airborne_ifv_chassis_bmd2: "BMD-2"
 ZZ_airborne_ifv_chassis_bmd2_desc: "VCI aéroporté de deuxième génération armé d'un canon automatique de 30 mm, offrant une puissance de feu nettement accrue."
 ZZ_airborne_ifv_chassis_bmd3: "BMD-3"
 ZZ_airborne_ifv_chassis_bmd3_desc: "VCI aéroporté de troisième génération sur châssis entièrement nouveau, avec blindage composite et largage avec équipage."
 ZZ_airborne_ifv_chassis_bmd4m: "BMD-4M"
 ZZ_airborne_ifv_chassis_bmd4m_desc: "Dernier véhicule principal des VDV russes, combinant canon de 100 mm à missiles tirés et canon automatique de 30 mm."
 ZZ_airborne_ifv_chassis_zbd03: "ZBD-03"
 ZZ_airborne_ifv_chassis_zbd03_desc: "Véhicule de combat aéroporté chenillé du corps aéroporté de l'APL, entièrement larguable pour appuyer les parachutistes."

 airborne_mechanized_equipment: "VCI aeroporte"
