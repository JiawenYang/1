l_french:
 ZZZ_nm_charles_iii:0 "Charles III"
 ZZZ_nm_naruhito:0 "Naruhito"
 ZZZ_nm_frederik_x:0 "Frederik X"
 ZZZ_nm_lux_guillaume:0 "Guillaume"
 ZZZ_nm_may_abdullah:0 "Abdullah de Pahang"
 ZZZ_nm_may_ibrahim:0 "Ibrahim Iskandar"

 ZZZ_succession.10.t:0 "La reine Élisabeth II est morte"
 ZZZ_succession.10.d:0 "Le palais de Buckingham a annoncé le décès de la reine Élisabeth II au château de Balmoral. La Couronne passe immédiatement à Charles III. À [ROOT.GetName], le chef de l'État change avec la Couronne."
 ZZZ_succession.10.a:0 "La reine est morte. Vive le roi."

 ZZZ_succession.11.t:0 "L'empereur Akihito abdique"
 ZZZ_succession.11.d:0 "L'empereur Akihito a abdiqué, la première abdication en deux siècles. Naruhito devient le 126e empereur du Japon."
 ZZZ_succession.11.a:0 "Vive Sa Majesté l'empereur."

 ZZZ_succession.12.t:0 "La reine Margrethe II abdique"
 ZZZ_succession.12.d:0 "Après 52 ans de règne, la reine Margrethe II a abdiqué. Le prince héritier Frederik devient le roi Frederik X."
 ZZZ_succession.12.a:0 "Vive le roi Frederik X."

 ZZZ_succession.13.t:0 "Le grand-duc Henri abdique"
 ZZZ_succession.13.d:0 "Le grand-duc Henri a abdiqué en faveur de son fils Guillaume, qui devient grand-duc de Luxembourg."
 ZZZ_succession.13.a:0 "Vive le Grand-Duc !"

 ZZZ_succession.14.t:0 "Le Yang di-Pertuan Agong abdique"
 ZZZ_succession.14.d:0 "Le sultan Muhammad V de Kelantan a abdiqué. La Conférence des souverains a élu le sultan Abdullah de Pahang comme nouveau roi."
 ZZZ_succession.14.a:0 "Daulat Tuanku."

 ZZZ_succession.15.t:0 "Intronisation du nouveau Yang di-Pertuan Agong"
 ZZZ_succession.15.d:0 "Le sultan Ibrahim Iskandar de Johor a été intronisé comme 17e Yang di-Pertuan Agong."
 ZZZ_succession.15.a:0 "Daulat Tuanku."

 ZZZ_succession.16.t:0 "Le souverain du Koweït est mort"
 ZZZ_succession.16.d:0 "L'émir Sabah Al-Ahmad Al-Jaber Al-Sabah est mort à 91 ans. Le prince héritier Nawaf a prêté serment comme émir."
 ZZZ_succession.16.a:0 "Que Dieu lui fasse miséricorde."

 ZZZ_succession.17.t:0 "L'émir Nawaf est mort"
 ZZZ_succession.17.d:0 "L'émir Nawaf Al-Ahmad Al-Jaber Al-Sabah est mort. Cheikh Mishal a prêté serment comme émir."
 ZZZ_succession.17.a:0 "Que Dieu lui fasse miséricorde."

 ZZZ_succession.18.t:0 "Le sultan Qabous est mort"
 ZZZ_succession.18.d:0 "Le sultan Qabous ben Saïd est mort après 50 ans de règne. Haïtham ben Tariq a prêté serment comme sultan."
 ZZZ_succession.18.a:0 "Que Dieu lui fasse miséricorde."

 ZZZ_succession.19.t:0 "La Barbade devient une république"
 ZZZ_succession.19.d:0 "La Barbade a retiré la reine Élisabeth II comme chef de l'État et est devenue une république. La monarchie est abolie."
 ZZZ_succession.19.a:0 "Un nouveau chapitre commence."
