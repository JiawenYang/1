l_french:
 ZZZ_debug:0 "Outils de débogage ZZZ"
 ZZZ_dbg_status_taiwan:0 "État : Taïwan / Corée"
 ZZZ_dbg_status_taiwan_desc:0 "Affiche dans un événement le soutien transdétroit, la volonté d'unification et les drapeaux de la péninsule."
 ZZZ_dbg_status_taiwan_tt:0 "But : ouvrir un événement d'état en lecture seule ; aucun état de jeu n'est modifié."
 ZZZ_dbg_status_gaw:0 "État : GAW"
 ZZZ_dbg_status_gaw_desc:0 "Affiche les drapeaux de phase de la Grande Guerre asiatique."
 ZZZ_dbg_status_gaw_tt:0 "But : ouvrir un événement d'état en lecture seule ; aucun état de jeu n'est modifié."
 ZZZ_dbg_status_mew:0 "État : MEW / USA"
 ZZZ_dbg_status_mew_desc:0 "Affiche la phase de la guerre au Moyen-Orient et le drapeau de paralysie fédérale américaine."
 ZZZ_dbg_status_mew_tt:0 "But : ouvrir un événement d'état en lecture seule ; aucun état de jeu n'est modifié."
 zzz_debug_status.1.t:0 "Rapport d'état : Taïwan et la péninsule coréenne"
 zzz_debug_status.1.d.no_confed:0 "Soutien transdétroit : §Y[?CHI.CHI_taiwan_us_support]§!. Volonté d'unification du ROK : §Y[?KOR.reunification_chance]§!. Aucune confédération péninsulaire."
 zzz_debug_status.1.d.confed:0 "Soutien transdétroit : §Y[?CHI.CHI_taiwan_us_support]§!. Volonté d'unification du ROK : §Y[?KOR.reunification_chance]§!. La confédération existe ; la fin de partie n'est pas réglée."
 zzz_debug_status.1.d.settled:0 "Soutien transdétroit : §Y[?CHI.CHI_taiwan_us_support]§!. Volonté d'unification du ROK : §Y[?KOR.reunification_chance]§!. La fin de partie péninsulaire est réglée."
 zzz_debug_status.2.t:0 "Rapport d'état : Grande Guerre asiatique"
 zzz_debug_status.2.d.idle:0 "La Grande Guerre asiatique n'a pas commencé et aucun camp n'est réglé."
 zzz_debug_status.2.d.ongoing:0 "La Grande Guerre asiatique est en cours et non réglée."
 zzz_debug_status.2.d.china:0 "La Grande Guerre asiatique a été réglée par une victoire chinoise."
 zzz_debug_status.2.d.japan:0 "La Grande Guerre asiatique a été réglée par une victoire japonaise."
 zzz_debug_status.3.t:0 "Rapport d'état : guerre au Moyen-Orient et USA"
 zzz_debug_status.3.d.idle:0 "La guerre au Moyen-Orient n'a pas commencé et le gouvernement fédéral américain fonctionne."
 zzz_debug_status.3.d.war:0 "La guerre au Moyen-Orient est en cours et non réglée."
 zzz_debug_status.3.d.done:0 "La guerre au Moyen-Orient a atteint son règlement final."
 zzz_debug_status.3.d.usa:0 "Le gouvernement fédéral américain est paralysé ; la guerre au Moyen-Orient n'a pas commencé ou n'est pas réglée."
 zzz_debug_status.close:0 "Fermer le rapport"
