l_french:
 ZZZ_election.0.t:0 "Une élection nationale approche"
 ZZZ_election.0.d:0 "La législature touche à sa fin. Les sièges des partis finalisent leurs budgets de campagne, les donateurs se positionnent et l'avenir politique du pays sera tranché dans les urnes. Avant le jour du vote, le gouvernement dispose encore d'une marge de manœuvre pour peser sur le résultat."
 ZZZ_election.0.a:0 "Financer la campagne du parti au pouvoir (§Y-50§! points politiques)"
 ZZZ_election.0.b:0 "Financer la campagne de la principale opposition (§Y-75§! points politiques)"
 ZZZ_election.0.c:0 "Rester à l'écart de la campagne"
 ZZZ_election.2.t:0 "Le dépouillement est terminé"
 ZZZ_election.2.d_majority:0 "Le premier parti a franchi le seuil de la majorité. Il formera seul le gouvernement et le nouveau cabinet entrera en fonction sous quelques jours."
 ZZZ_election.2.d_coalition:0 "Aucun parti n'a obtenu la majorité. Le premier parti a accepté de gouverner avec le deuxième et les deux ont signé un accord de coalition couvrant toute la législature."
 ZZZ_election.2.d_minority:0 "Aucun parti n'a obtenu la majorité et aucun accord de coalition n'a été conclu. Le premier parti dirigera un gouvernement minoritaire, dépendant de soutiens ponctuels au Parlement."
 ZZZ_election.2.a:0 "Accepter le résultat"
 ZZZ_election.4.t:0 "Le second tour est tranché"
 ZZZ_election.4.d:0 "Le premier tour n'a produit aucune majorité. Les deux candidats arrivés en tête se sont de nouveau affrontés devant les électeurs, et le pays a désormais choisi entre eux."
 ZZZ_election.4.a:0 "Accepter le résultat du second tour"
 ZZZ_election_chain_tt:0 "Marqueur de chaîne électorale : cette fenêtre appartient au modèle électoral ZZZ (marqueur de log : §YZZZ_template§!). Si cette fenêtre n'apparaît pas, le pays utilise la chaîne générique MD (MD4_election_campaign.0, marqueur de log : §YMD_generic§!)."
