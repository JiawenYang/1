l_simp_chinese:
 SOV_soviet_army_modifier: "苏联陆军"
 SOV_soviet_army_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_army_banner\n\n\n\n\n\n§y“我们的土地辽阔，但没有一寸是多余的。”§!\n\n1946年，红军总参谋部在国防人民委员部之下重新组建，把卫国战争中检验过的合成军队体制固定下来：坦克集团军负责突破，诸兵种合成集团军承担正面推进，方面军与军区构成战略梯队。此后四十年，义务兵役制与大量动员师把一支陆上力量从易北河一直铺到远东，阿富汗战争则暴露了这套体制在低强度冲突中的局限。若联盟在2017年重新立起，这支力量仍将依托总参谋部的统一筹划、国防人民委员部的军工动员与军区的纵深配置运转——它的长处是规模、火炮与装甲，短处是后勤与兵员素质。\n\n§y“谁想同我们作战，谁就得准备好承受一切。”§!"
 SOV_soviet_navy_modifier: "苏联海军"
 SOV_soviet_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_navy_banner\n\n\n\n\n\n§y“阿芙乐尔号的炮声，是红海军的第一声问候。”§!\n\n苏联海军战后以北方舰队、太平洋舰队、波罗的海舰队与黑海舰队四大舰队为骨架，把核潜艇与战略导弹置于首位，水面舰艇长期充当辅助。1970年代起，基辅级与基洛夫级让苏联第一次具备远洋存在的形象，但造船能力与港口条件始终制约着它。若联盟在2017年重建，红海军将以海军人民委员部的名义重新整编舰队与海岸防御，优先保障北方海航道与核潜艇基地；它的力量不在于与北约航母编队正面对决，而在于让对手的每一支舰队都必须分兵。\n\n§y“圣安德烈旗不落，海军的荣誉不落。”§!"
 SOV_soviet_air_modifier: "苏联空军"
 SOV_soviet_air_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_air_banner\n\n\n\n\n\n§y“飞行员的天职，是把天空留给自己的国家。”§!\n\n苏联空军在冷战年代曾是世界第二大空中力量：米格与苏霍伊的设计局体系、遍布全国的防空师与前线航空兵构成了它的骨架，1980年代苏-27与米格-29开始形成代差，电子设备与发动机寿命却仍是短板。若联盟在2017年重立，空军将与防空军重新合并，把前线航空兵、远程航空兵、军事运输航空兵与防空导弹部队纳入统一指挥，由总参谋部确定优先方向。它的任务是国土防空与战区制空，而不是全球投送。\n\n§y“从列宁格勒到符拉迪沃斯托克，天空都属于我们。”§!"
 SOV_soviet_security_modifier: "苏联国家安全"
 SOV_soviet_security_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_security_banner\n\n\n\n\n\n§y“契卡是无产阶级专政的武器。”§!\n\n从1917年的契卡，到1922年的国家政治保卫局、1934年的国家安全总局，再到1954年的国家安全委员会，苏联的国家安全机关始终直接对党和政府的最高层负责，把反间谍、边境守卫、要人保护与劳改营管理集于一身。克格勃第一总局负责对外情报，第二总局负责对内反间谍，边防军则是一支准军事力量。若联盟在2017年重新立起，这套机关将以国家安全委员会的名义重组，把对外情报、反间谍与网络空间纳入同一条指挥链；它不参与常规作战，却决定着国家对内对外的安全边界。\n\n§y“在看不见的战场上，我们从未停战。”§!"
