l_russian:
 CHI_landforce_modifier_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\nСо времен Наньчанского восстания 1927 года Народно-освободительная армия, особенно ее сухопутные войска, долгое время была надежной силой как для партии, так и для народа. Модернизация НОАК, начатая Си Цзиньпином в 2016 году, наделила ее способностью сражаться и побеждать в современных боевых условиях. Из сил, предназначенных исключительно для обороны родины, НОАК превратилась в грозную военную державу, способную действовать в Северо-Восточной Азии и во всем Тихоокеанском регионе. В будущем может появиться больше возможностей продемонстрировать этот возросший потенциал."
 CHI_navy_modifier_desc: "\n\n\n\n£GFX_PRC_plan_dynamic_banner\n\n\n\n\n\nСтремительный рост возможностей ВМС НОАК, превратившихся из относительно слабых сил береговой обороны в сегодняшний мощный флот с авианосцами и атомными подводными лодками, неразрывно связан с экономическим подъемом Китая и повышением его международного статуса. За десятилетия трудного развития Народный флот прошел путь от нуля, от малого к большому, от слабого к сильному, став стратегическим видом вооруженных сил с пятью родами войск и одновременно ядерными и обычными возможностями, а также морской силой, способной эффективно защищать суверенитет, безопасность и интересы развития государства. Сегодня, под руководством военных реформ новой эпохи, Народный флот ускоряет темпы преобразований; его строительство достигло исторических успехов и претерпело исторические перемены, и он стоит на Востоке в совершенно новом облике."
 CHI_airforce_modifier_desc: "\n\n\n\n£GFX_PRC_plaaf_dynamic_banner\n\n\n\n\n\nБолее семидесяти лет славного пути, и великий феникс поднимается на девяти мириадах ли ветра. Под твердым руководством Коммунистической партии Китая поколения офицеров и бойцов военно-воздушных сил, исполненные высоких устремлений, сражались в бескрайнем небе, добиваясь успехов в строительстве ВВС, привлекающих внимание всего мира, и совершая бессмертный подвиг во имя защиты суверенитета, безопасности и интересов развития государства. Сегодня Народные ВВС - уже не та молодая сила, которой приходилось пролетать дважды из-за нехватки самолетов; они стали современным высокотехнологичным видом вооруженных сил, объединяющим авиацию, зенитно-ракетные войска, зенитную артиллерию, радиолокационные и воздушно-десантные части и включающим истребители, бомбардировщики, транспортные самолеты и другие типы машин."
 PRC_pla_dynamic_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\nСо времен Наньчанского восстания 1927 года Народно-освободительная армия, особенно ее сухопутные войска, долгое время была надежной силой как для партии, так и для народа. Модернизация НОАК, начатая Си Цзиньпином в 2016 году, наделила ее способностью сражаться и побеждать в современных боевых условиях. Из сил, предназначенных исключительно для обороны родины, НОАК превратилась в грозную военную державу, способную действовать в Северо-Восточной Азии и во всем Тихоокеанском регионе. В будущем может появиться больше возможностей продемонстрировать этот возросший потенциал."
 PRC_plan_dynamic_desc: "\n\n\n\n£GFX_PRC_plan_dynamic_banner\n\n\n\n\n\nСтремительный рост возможностей ВМС НОАК, превратившихся из относительно слабых сил береговой обороны в сегодняшний мощный флот с авианосцами и атомными подводными лодками, неразрывно связан с экономическим подъемом Китая и повышением его международного статуса. За десятилетия трудного развития Народный флот прошел путь от нуля, от малого к большому, от слабого к сильному, став стратегическим видом вооруженных сил с пятью родами войск и одновременно ядерными и обычными возможностями, а также морской силой, способной эффективно защищать суверенитет, безопасность и интересы развития государства. Сегодня, под руководством военных реформ новой эпохи, Народный флот ускоряет темпы преобразований; его строительство достигло исторических успехов и претерпело исторические перемены, и он стоит на Востоке в совершенно новом облике."
 PRC_plaaf_dynamic_desc: "\n\n\n\n£GFX_PRC_plaaf_dynamic_banner\n\n\n\n\n\nБолее семидесяти лет славного пути, и великий феникс поднимается на девяти мириадах ли ветра. Под твердым руководством Коммунистической партии Китая поколения офицеров и бойцов военно-воздушных сил, исполненные высоких устремлений, сражались в бескрайнем небе, добиваясь успехов в строительстве ВВС, привлекающих внимание всего мира, и совершая бессмертный подвиг во имя защиты суверенитета, безопасности и интересов развития государства. Сегодня Народные ВВС - уже не та молодая сила, которой приходилось пролетать дважды из-за нехватки самолетов; они стали современным высокотехнологичным видом вооруженных сил, объединяющим авиацию, зенитно-ракетные войска, зенитную артиллерию, радиолокационные и воздушно-десантные части и включающим истребители, бомбардировщики, транспортные самолеты и другие типы машин."
 SOV_landforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_land_banner\n\n\n\n\n\n§y«Тяжело в учении — легко в бою».§!\n\nРеформа Сердюкова 2008 года разбила советские дивизии массовой мобилизации на «новый облик» — кадровые бригады постоянной готовности: контрактники заменили призывников, а раздутые штабы были сокращены, чтобы бригада могла быть готова к выходу в считанные часы. После того как в 2013 году Шойгу возглавил министерство обороны, в Западном и Южном военных округах частично восстановили дивизионную структуру, и общевойсковые соединения вновь взяли на себя задачу ведения локальной войны. 30 сентября 2015 года по просьбе сирийского правительства российские войска начали воздушную операцию, а авиабаза Хмеймим и пункт базирования Тартус стали первыми постоянными военными опорами России за пределами своих границ после распада СССР. К 2017 году Сухопутные войска по-прежнему опирались на Т-72Б3, Т-90 и БМП-3, оставаясь самой многочисленной армией Европы и инструментом быстрого реагирования и сдерживания на нескольких театрах — от Калининграда до Камчатки.\n\n§y«Мы не воюем за чужую землю, но и своей не уступим ни пяди».§!"
 SOV_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_navy_banner\n\n\n\n\n\n§y«Государь, имеющий только сухопутную армию, имеет одну руку; имеющий и флот — две руки».§!\n\nРоссийский флот разделен между Северным, Тихоокеанским, Балтийским и Черноморским флотами и Каспийской флотилией, причем на Северный флот возложены и стратегические подводные лодки, и Северный морской путь. В 2017 году головной корабль проекта 885 «Северодвинск» уже находился в строю, подводные лодки проекта 955 «Борей» и его улучшенных вариантов входили в состав флота, а устаревшие советские корпуса постепенно выводились из первой линии; в том же году авианосец «Кузнецов» привел соединение в Средиземное море — крупнейший поход российского флота после распада Союза. В отличие от Сухопутных войск, вес флота определяется не числом, а триадой возможностей: ядерное сдерживание, присутствие в дальней морской зоне и удары по берегу.\n\n§y«Андреевский флаг не спускают никогда».§!"
 SOV_airforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_air_banner\n\n\n\n\n\n§y«Наше небо закрыто для чужих взглядов».§!\n\nВоздушно-космические силы России были созданы в 2015 году слиянием ВВС с войсками воздушно-космической обороны, что свело авиацию, противовоздушную и противоракетную оборону и наблюдение за космосом в единую цепь управления. С сентября 2015 года Ту-95МС и Ту-160 дальней авиации и Су-24, Су-34 фронтовой авиации поочередно работали над Сирией, а Су-35С и комплексы С-400 составили ядро ПВО на Хмеймиме; именно там Россия проверяла новую технику и новую систему управления в реальном бою. В 2017 году семейство Су-27, Су-34 и МиГ-31 оставались в строю, а Су-57 проходил государственные испытания; ВКС задуманы как ядерно-обычный стратегический сдерживающий фактор с завоеванием господства в воздухе на театре военных действий в качестве главной задачи.\n\n§y«Долг летчика — хранить землю под крылом».§!"
 USA_dynamic_modifier_us_army_desc: "\n\n\n\n£GFX_ZZZ_USA_land_banner\n\n\n\n\n\n§y«Мы будем это защищать».§!\n\nЗакон о национальной обороне на 2017 финансовый год установил численность действующей армии примерно в 476 тысяч человек, положив конец многолетнему сокращению с 2012 года и вернув приоритет от противоповстанческих операций к подготовке к крупномасштабной наземной войне. С этого года армия начала продвигать концепцию «многодоменной битвы», включая киберпространство, космос и электромагнитный спектр в планирование общевойсковых действий; основой брони и мобильности оставались M1A2 SEP, M777A2 и бригады «Страйкер». Американская армия никогда не действует изолированно: опираясь на передовые склады, стратегические воздушные и морские перевозки, она способна в течение нескольких недель перебросить бронетанковую бригаду на любой театр.\n\n§y«Искусство войны — оставить страх врагу».§!"
 USA_dynamic_modifier_us_navy_desc: "\n\n\n\n£GFX_ZZZ_USA_navy_banner\n\n\n\n\n\n§y«Не сдавай корабль».§!\n\nВ 2017 году ВМС США располагали примерно одиннадцатью атомными авианосцами и более чем 270 кораблями — единственный в мире вид вооруженных сил, способный одновременно держать авианосные ударные группы в нескольких океанах. Эсминцы типа «Арли Берк», атомные подводные лодки типа «Вирджиния» и корабли прибрежной зоны составляли основу надводных и подводных сил, а авианосные авиакрылья оставались ядром проекции силы. Операции «свободы судоходства» в Южно-Китайском море, конвоирование в Персидском заливе и развертывание в Средиземном море делали флот самым прямым инструментом американского глобального присутствия; ввод в строй авианосцев типа «Форд» и закладка подводных лодок типа «Колумбия» ознаменовали начало нового кораблестроительного цикла.\n\n§y«Господство на море — не врожденное право, а то, что каждый флот зарабатывает ежедневным патрулированием».§!"
 USA_dynamic_modifier_us_airforce_desc: "\n\n\n\n£GFX_ZZZ_USA_air_banner\n\n\n\n\n\n§y«Целься выше — лети, сражайся, побеждай».§!\n\nВ 2017 году в ВВС США насчитывалось около 317 тысяч военнослужащих действующей службы; F-35A начинал входить в боевые крылья целыми подразделениями, F-22 оставался ядром завоевания господства в воздухе, а B-2, B-1B и B-52 составляли костяк ударной авиации. В том же году Пентагон выдвинул «Третью стратегию компенсации», делая ставку на искусственный интеллект, автономные системы и гиперзвуковое оружие ради сохранения технологического отрыва; при этом удары по террористам продолжались в Ираке и Сирии, а воздушная поддержка в Афганистане не прекращалась. Для ВВС соперничество великих держав и противоповстанческая война — две совершенно разные войны — в 2017 году оказались одновременно возложены на одни и те же эскадрильи.\n\n§y«Мы охраняем не небо, а все, что под ним».§!"
