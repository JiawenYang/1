 SOV_soviet_army_modifier: "Forces terrestres soviétiques"
 SOV_soviet_army_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_army_banner\n\n\n\n\n\n§y« Notre terre est vaste, mais pas un pouce n'en est de trop. »§!\n\nEn 1946, l'état-major général de l'Armée rouge fut reconstitué au sein du Commissariat du peuple à la défense et fixa la structure interarmes éprouvée pendant la Grande Guerre patriotique : armées blindées pour la percée, armées interarmes pour l'effort principal, fronts et districts militaires comme échelon stratégique. Pendant quarante ans, la conscription et les divisions de mobilisation de masse maintinrent une force terrestre de l'Elbe à l'Extrême-Orient, tandis que l'Afghanistan révéla les limites de ce système dans une guerre de basse intensité. Si l'Union était relevée en 2017, cette force continuerait de reposer sur la planification unifiée de l'état-major général, la mobilisation industrielle du Commissariat à la défense et la profondeur des districts militaires ; ses forces sont le nombre, l'artillerie et le blindage, ses faiblesses la logistique et la qualité des effectifs.\n\n§y« Qui veut nous combattre doit être prêt à tout supporter. »§!"
 SOV_soviet_navy_modifier: "Marine soviétique"
 SOV_soviet_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_navy_banner\n\n\n\n\n\n§y« Les salves de l'Aurore furent le premier salut de la Flotte rouge. »§!\n\nLa marine soviétique fut construite après la guerre autour de quatre flottes — du Nord, du Pacifique, de la Baltique et de la mer Noire — en plaçant d'abord les sous-marins nucléaires et les missiles stratégiques, les bâtiments de surface restant longtemps un rôle d'appui. À partir des années 1970, les classes Kiev et Kirov donnèrent pour la première fois à l'URSS une image de présence océanique, mais les capacités de construction navale et les ports la limitèrent toujours. Si l'Union était reconstruite en 2017, la Flotte rouge serait réorganisée au sein d'un Commissariat du peuple à la marine, avec priorité à la route maritime du Nord et aux bases sous-marines ; sa mission n'est pas d'affronter les groupes aéronavals de l'OTAN, mais de forcer chaque flotte ennemie à se diviser.\n\n§y« Le pavillon de Saint-André ne se baisse pas, pas plus que l'honneur de la flotte. »§!"
 SOV_soviet_air_modifier: "Force aérienne soviétique"
 SOV_soviet_air_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_air_banner\n\n\n\n\n\n§y« Le devoir du pilote est de garder le ciel aux mains de son pays. »§!\n\nPendant la guerre froide, l'armée de l'air soviétique fut la seconde du monde : les bureaux d'études MiG et Soukhoï, les divisions de défense aérienne réparties sur tout le territoire et l'aviation de front en formaient l'ossature ; dans les années 1980, le Su-27 et le MiG-29 creusèrent un écart de génération, mais l'électronique et la durée de vie des moteurs restaient des points faibles. Si l'Union était relevée en 2017, l'armée de l'air serait de nouveau fusionnée avec la défense aérienne, l'aviation de front, l'aviation à long rayon d'action, l'aviation de transport militaire et les troupes de missiles sol-air passant sous un commandement unique, avec des priorités fixées par l'état-major général. Sa mission est la défense aérienne du territoire et la maîtrise du ciel sur le théâtre, non la projection de puissance mondiale.\n\n§y« De Léningrad à Vladivostok, le ciel nous appartient. »§!"
 SOV_soviet_security_modifier: "Sûreté d'État soviétique"
 SOV_soviet_security_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_security_banner\n\n\n\n\n\n§y« La Tchéka est l'arme de la dictature du prolétariat. »§!\n\nDe la Tchéka de 1917 à la Direction politique d'État de 1922, à la Direction principale de la sécurité d'État de 1934 puis au Comité de la sécurité d'État de 1954, les organes de sécurité soviétiques répondaient directement au sommet du parti et de l'État, réunissant contre-espionnage, garde des frontières, protection des dirigeants et administration des camps. La Première direction principale du KGB menait le renseignement extérieur, la Deuxième direction principale le contre-espionnage intérieur, et les troupes frontalières étaient une force paramilitaire. Si l'Union était relevée en 2017, ces organes seraient réorganisés en un Comité de la sécurité d'État, réunissant renseignement extérieur, contre-espionnage et cyberespace dans une seule chaîne de commandement ; ils ne participent pas aux opérations conventionnelles, mais définissent la frontière de sécurité intérieure et extérieure de l'État.\n\n§y« Sur le front invisible, nous n'avons jamais cessé le combat. »§!"
