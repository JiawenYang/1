 SOV_soviet_army_modifier: "Soviet Ground Forces"
 SOV_soviet_army_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_army_banner\n\n\n\n\n\n§y“The motherland is vast, but not one inch of it is spare.”§!\n\nIn 1946 the Red Army General Staff was rebuilt under the People's Commissariat of Defence, fixing the combined-arms structure tested in the Great Patriotic War: tank armies for the breakthrough, combined-arms armies for the main advance, fronts and military districts as the strategic echelon. For four decades conscription and mass mobilisation divisions kept a land force stretching from the Elbe to the Far East, while Afghanistan exposed the limits of that system in a low-intensity war. If the Union were raised again in 2017, this force would still run on the General Staff's unified planning, the Defence Commissariat's industrial mobilisation and the depth of the military districts; its strengths are numbers, artillery and armour, its weaknesses logistics and the quality of its manpower.\n\n§y“Whoever wants to fight us must be ready to bear everything.”§!"
 SOV_soviet_navy_modifier: "Soviet Navy"
 SOV_soviet_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_navy_banner\n\n\n\n\n\n§y“The guns of the Aurora were the Red Fleet's first greeting.”§!\n\nThe Soviet Navy was built after the war around four fleets — the Northern, Pacific, Baltic and Black Sea — placing nuclear submarines and strategic missiles first while surface ships long played a supporting role. From the 1970s the Kiev and Kirov classes gave the USSR its first image of ocean-going presence, yet shipbuilding capacity and port conditions always constrained it. If the Union were rebuilt in 2017, the Red Fleet would be reorganised under a People's Commissariat of the Navy, with priority on the Northern Sea Route and the submarine bases; its purpose is not to duel NATO carrier groups but to force every enemy fleet to divide itself.\n\n§y“The flag of St Andrew does not come down, nor does the honour of the fleet.”§!"
 SOV_soviet_air_modifier: "Soviet Air Force"
 SOV_soviet_air_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_air_banner\n\n\n\n\n\n§y“A pilot's duty is to keep the sky in his own country's hands.”§!\n\nThe Soviet Air Force was once the world's second largest: the MiG and Sukhoi design bureaux, air-defence divisions across the country and frontal aviation formed its backbone; in the 1980s the Su-27 and MiG-29 opened a generation gap, though avionics and engine life remained weak points. If the Union were raised again in 2017, the Air Force would be merged back with Air Defence, placing frontal, long-range and military transport aviation and surface-to-air missile troops under one command, with priorities set by the General Staff. Its mission is homeland air defence and theatre air control, not global power projection.\n\n§y“From Leningrad to Vladivostok, the sky belongs to us.”§!"
 SOV_soviet_security_modifier: "Soviet State Security"
 SOV_soviet_security_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_security_banner\n\n\n\n\n\n§y“The Cheka is the weapon of the dictatorship of the proletariat.”§!\n\nFrom the Cheka of 1917 to the State Political Directorate of 1922, the Main Directorate of State Security of 1934 and the Committee for State Security of 1954, the Soviet security organs answered directly to the top of party and state, combining counter-intelligence, border guarding, VIP protection and camp administration. The KGB's First Chief Directorate ran foreign intelligence, the Second Chief Directorate ran domestic counter-intelligence, and the Border Troops were a paramilitary force. If the Union were raised again in 2017, these organs would be reorganised as a Committee for State Security, folding foreign intelligence, counter-intelligence and cyberspace into a single chain of command; they take no part in conventional operations, yet they define the state's internal and external security frontier.\n\n§y“On the battlefield no one sees, we have never stopped fighting.”§!"
