 CHI_landforce_modifier_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\nSince the Nanchang Uprising in 1927, the People's Liberation Army, particularly its ground forces, has long been a reliable force for both the Party and the people. The modernization of the PLA, initiated by Xi Jinping in 2016, has endowed it with the capability to fight and win in modern battlefield environments. The PLA has evolved from a purely homeland defense force into a formidable military power capable of deployment across Northeast Asia and throughout the Pacific. In the future, there may be more opportunities to demonstrate this enhanced capability."
 CHI_navy_modifier_desc: "\n\n\n\n£GFX_PRC_plan_dynamic_banner\n\n\n\n\n\nThe rapid growth of the PLAN's capabilities, evolving from a relatively weak coastal defense force to today's powerful fleet of aircraft carriers and nuclear submarines, is inextricably linked to China's economic rise and enhanced international standing. After decades of hard development, the People's Navy has grown from nothing, from small to large, from weak to strong, becoming a strategic service with all five branches and both nuclear and conventional capabilities, and an armed force at sea able to effectively safeguard national sovereignty, security and development interests. Today, guided by the military reforms of the new era, the People's Navy is quickening the pace of its transformation; its construction has scored historic achievements and undergone historic changes, and it now stands in the East with an entirely new posture."
 CHI_airforce_modifier_desc: "\n\n\n\n£GFX_PRC_plaaf_dynamic_banner\n\n\n\n\n\nMore than seventy years of glorious journey, and the great phoenix rises on nine myriad leagues of wind. Under the steadfast leadership of the Communist Party of China, generation after generation of air force officers and men, holding grand aspirations, have fought across the vast skies, driving achievements in air force construction that draw the world's attention and establishing immortal service in safeguarding national sovereignty, security and development interests. Today the People's Air Force is no longer the young force that had to fly twice because there were not enough aircraft; it has become a modern high-technology service composed of aviation, ground-to-air missile, anti-aircraft artillery, radar and airborne troops, and built around fighters, bombers, transports and other aircraft types."
 PRC_pla_dynamic_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\nSince the Nanchang Uprising in 1927, the People's Liberation Army, particularly its ground forces, has long been a reliable force for both the Party and the people. The modernization of the PLA, initiated by Xi Jinping in 2016, has endowed it with the capability to fight and win in modern battlefield environments. The PLA has evolved from a purely homeland defense force into a formidable military power capable of deployment across Northeast Asia and throughout the Pacific. In the future, there may be more opportunities to demonstrate this enhanced capability."
