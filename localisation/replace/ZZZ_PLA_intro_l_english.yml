 SOV_landforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_land_banner\n\n\n\n\n\n§y‘Hard in training, easy in battle.’§!\n\nThe 2008 Serdyukov reform broke the Soviet-era mass mobilization divisions into ‘new look’ standing brigades, replacing conscripts with contract soldiers and cutting bloated command layers so that a brigade could generate within hours. After Shoigu took over the Defence Ministry in 2013, divisions were partly restored in the Western and Southern military districts, and combined-arms formations again took on the task of sustaining a local war. On 30 September 2015, at the Syrian government's request, Russian forces began their air campaign, and Hmeimim air base and the Tartus naval facility became Russia's first permanent military footholds beyond its own borders since the fall of the USSR. By 2017 the Ground Forces still fielded the T-72B3, T-90 and BMP-3 as their armoured backbone, the largest land force in Europe, positioned as an instrument of multi-theatre rapid reaction and deterrence from Kaliningrad to Kamchatka.\n\n§y‘We do not fight for the land of others, but not one inch of our own will be given up.’§!"
 SOV_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_navy_banner\n\n\n\n\n\n§y‘A monarch who has only an army has one hand; he who also has a navy has two.’§!\n\nThe Russian Navy is divided between the Northern, Pacific, Baltic and Black Sea fleets and the Caspian Flotilla, with the Northern Fleet entrusted both with strategic missile submarines and the Northern Sea Route. In 2017 the lead boat of the Yasen class, Severodvinsk, was already in service, the Borei class and its improved variants were joining the fleet, and ageing Soviet hulls were being pushed out of the front line; that same year the carrier Kuznetsov led a task force to the Mediterranean in the largest Russian naval deployment since the end of the USSR. Unlike the Ground Forces, the navy's weight lies not in numbers but in the triad of nuclear deterrence, distant-sea presence and land-attack capability.\n\n§y‘The flag of St Andrew is never lowered.’§!"
 SOV_airforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_air_banner\n\n\n\n\n\n§y‘Our sky is not open to the eyes of others.’§!\n\nThe Russian Aerospace Forces were formed in 2015 by merging the Air Force with the Aerospace Defence Troops, placing aviation, air and missile defence and space surveillance under one command chain. From September 2015, Tu-95MS and Tu-160 bombers of Long-Range Aviation and Su-24 and Su-34 aircraft of Frontal Aviation flew sorties over Syria in rotation, while Su-35S fighters and S-400 systems formed the air-defence core at Hmeimim; it was the window in which Russia tested new equipment and command arrangements in real combat. In 2017 the Su-27 family, Su-34 and MiG-31 remained in service and the Su-57 was in state trials; the Aerospace Forces are positioned as a nuclear and conventional strategic deterrent with theatre air superiority as their primary mission.\n\n§y‘A pilot's duty is to guard the land beneath his wings.’§!"
 USA_dynamic_modifier_us_army_desc: "\n\n\n\n£GFX_ZZZ_USA_land_banner\n\n\n\n\n\n§y‘This We'll Defend.’§!\n\nThe FY2017 National Defense Authorization Act set the Army's active end strength at roughly 476,000, ending years of drawdown since 2012 and shifting the service's focus from counter-insurgency back to preparation for large-scale ground combat. That year the Army began to advance the Multi-Domain Battle concept, bringing cyber, space and the electromagnetic spectrum into combined-arms planning; the M1A2 SEP, M777A2 and Stryker brigade combat teams remained the backbone of its armour and mobility. The US Army has never been an isolated service: with prepositioned stocks, strategic airlift and sealift, it can project an armoured brigade to any theatre within weeks.\n\n§y‘The art of war is to leave the fear to the enemy.’§!"
 USA_dynamic_modifier_us_navy_desc: "\n\n\n\n£GFX_ZZZ_USA_navy_banner\n\n\n\n\n\n§y‘Don't give up the ship.’§!\n\nIn 2017 the United States Navy kept roughly eleven nuclear-powered carriers and more than 270 ships, the only service in the world able to keep carrier strike groups at sea in several oceans at once. Arleigh Burke destroyers, Virginia-class attack submarines and littoral combat ships formed its surface and undersea mainstay, while carrier air wings were the core of power projection. Freedom of navigation operations in the South China Sea, escort duties in the Persian Gulf and deployments to the Mediterranean made the Navy the most direct instrument of American global presence; the entry into service of the Ford class and the laying down of the Columbia class marked the start of a new shipbuilding cycle.\n\n§y‘Command of the sea is not a birthright, but what each fleet earns by cruising day after day.’§!"
 USA_dynamic_modifier_us_airforce_desc: "\n\n\n\n£GFX_ZZZ_USA_air_banner\n\n\n\n\n\n§y‘Aim High — Fly, Fight, Win.’§!\n\nIn 2017 the US Air Force counted about 317,000 active personnel; the F-35A was beginning to join operational wings in formation strength, the F-22 remained the core of air superiority, and the B-2, B-1B and B-52 formed the backbone of the strike fleet. That year the Department of Defense put forward the Third Offset Strategy, betting on artificial intelligence, autonomous systems and high-speed weapons to preserve a generational edge; meanwhile counter-terrorism strikes continued over Iraq and Syria and air support in Afghanistan never stopped. For the Air Force, great-power competition and counter-insurgency — two utterly different kinds of war — were pressed onto the same squadrons at the same time in 2017.\n\n§y‘What we guard is not the sky, but everything beneath it.’§!"
