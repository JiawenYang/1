 USA_dynamic_modifier_us_general_staff_desc: "\n\n\n\n£GFX_ZZZ_USA_general_staff_banner\n\n\n\n\n\n§y“外行谈战术，内行谈后勤。”§!\n\n1947年《国家安全法》确立了参谋长联席会议制度，1949年修正案增设主席一职，1986年《戈德华特—尼科尔斯法案》又把主席摆到总统、国家安全委员会与国防部长首席军事顾问的位置上。到2017年，参联会由主席、副主席、陆军参谋长、海军作战部长、空军参谋长、海军陆战队司令和国民警卫队局长组成；约瑟夫·邓福德上将任主席，保罗·塞尔瓦上将任副主席。参联会并不握有作战指挥权，命令沿总统—国防部长—联合作战司令部这条链条下达；但联合战略规划、作战计划审查与军种协调都要经过它，陆、海、空、陆战队与国民警卫队也在这里被拧成一支联合力量。2017财年《国防授权法》为这一体系提供约6195亿美元，并推动采办与人事改革；在朝鲜半岛、中东与东欧同时承压的2017年，参联会既是白宫军事建议的来源，也是各军种争夺预算绕不开的关口。\n\n§y“合众为一。”§!"
 SOV_intelligence_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_security_banner\n\n\n\n\n\n§y“契卡人应当有火热的心、冷静的头脑和干净的手。”§!\n\n苏联解体后，克格勃体系被拆成几个互不隶属的机构：联邦安全局（FSB）继承对内反间谍与反恐，对外情报局（SVR）接管境外情报，原政府通信与信息局（FAPSI）在2003年解散后其职能分归FSB、SVR与总参谋部情报总局（GRU），GRU则继续掌管军事情报与特种作战。2016年，以内务部内卫部队为基础组建的俄罗斯国民近卫军直接向总统负责，与FSB、SVR、GRU并列构成安全体系。2017年，FSB在亚历山大·博尔特尼科夫领导下调查4月圣彼得堡地铁爆炸案，并在北高加索与大城市维持反恐高压；SVR在谢尔盖·纳雷什金主持下扩大对外情报活动；GRU在伊戈尔·科罗博夫任内因乌克兰与叙利亚行动持续处于西方制裁与舆论焦点。这套机构不参与常规作战指挥，却通过情报、反间谍、要人保护与网络监控，把克里姆林宫的安全边界推到国境之外。\n\n§y“我们之上只有星辰。”§!"
 CHI_defense_industry_desc: "\n\n\n\n£GFX_ZZZ_CHI_defense_industry_banner\n\n\n\n\n\n§y“热爱祖国、无私奉献，自力更生、艰苦奋斗，大力协同、勇于登攀。”§!\n\n中国的国防工业以大型国有集团为骨架：兵器工业与兵器装备承担陆战装备，船舶工业与船舶重工分掌南北造船，航空工业负责战机与发动机，航天科技、航天科工覆盖导弹与航天，电子科技与电子信息支撑雷达、通信与电子对抗，核工业集团掌管核能力。2016年军改把原四总部体制改为军委多部门制，装备发展部统一掌管装备研制与采购，战区与军种按联合作战需求提出要求；2017年1月中央军民融合发展委员会成立，军民融合由部门政策上升为国家战略。2017年的成果可以列出一串：歼-20开始交付部队，歼-16与运-20批量服役，首艘国产航母001A于4月下水，055型万吨驱逐舰于6月下水，东风-31AG在朱日和阅兵中公开亮相；同年国防预算约1.04万亿元人民币，同比增长约7%。这套体系仍有发动机、材料与高端芯片的短板，但它已把中国从装备引进国变成能够自研主战装备的国家。\n\n§y“军民团结如一人，试看天下谁能敌。”§!"
