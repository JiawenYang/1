l_french:
 CHI_landforce_modifier_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\nDepuis le soulèvement de Nanchang en 1927, l'Armée populaire de libération, en particulier ses forces terrestres, constitue depuis longtemps une force fiable pour le Parti comme pour le peuple. La modernisation de l'APL engagée par Xi Jinping en 2016 lui a donné la capacité de combattre et de vaincre dans les conditions du champ de bataille moderne. D'une simple force de défense du territoire national, l'APL est devenue une puissance militaire redoutable capable de se déployer en Asie du Nord-Est et dans tout le Pacifique. De nouvelles occasions de démontrer cette capacité renforcée pourraient se présenter à l'avenir."
 CHI_navy_modifier_desc: "\n\n\n\n£GFX_PRC_plan_dynamic_banner\n\n\n\n\n\nLa croissance rapide des capacités de la Marine de l'APL, passée d'une force de défense côtière relativement faible à l'actuelle flotte puissante de porte-avions et de sous-marins nucléaires, est indissociable de l'essor économique de la Chine et de l'élévation de son statut international. Après des décennies d'un développement difficile, la Marine populaire est partie de rien, s'est développée de petite à grande et de faible à forte, pour devenir un service stratégique réunissant ses cinq armes et doté de capacités à la fois nucléaires et conventionnelles, ainsi qu'une force maritime capable de préserver efficacement la souveraineté, la sécurité et les intérêts de développement de l'État. Aujourd'hui, guidée par les réformes militaires de la nouvelle ère, la Marine populaire accélère sa transformation ; sa construction a connu des réalisations et des changements historiques, et elle se tient désormais en Orient dans une posture entièrement nouvelle."
 CHI_airforce_modifier_desc: "\n\n\n\n£GFX_PRC_plaaf_dynamic_banner\n\n\n\n\n\nPlus de soixante-dix ans de gloire, et le grand phénix s'élève sur neuf myriades de lieues de vent. Sous la direction ferme du Parti communiste chinois, des générations d'officiers et de soldats de l'armée de l'air, portant de hautes ambitions, ont combattu dans les vastes cieux, obtenant des résultats dans la construction de l'armée de l'air qui retiennent l'attention du monde entier et accomplissant des services immortels pour la sauvegarde de la souveraineté, de la sécurité et des intérêts de développement de l'État. Aujourd'hui, l'Armée de l'air populaire n'est plus la jeune force qui devait voler deux fois faute d'avions suffisants ; elle est devenue un service moderne de haute technologie réunissant l'aviation, les forces de missiles sol-air, l'artillerie antiaérienne, les radars et les troupes aéroportées, et composée de chasseurs, de bombardiers, d'avions de transport et d'autres appareils."
