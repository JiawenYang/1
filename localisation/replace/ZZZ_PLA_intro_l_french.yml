 PRC_plaaf_dynamic_desc: "\n\n\n\n£GFX_PRC_plaaf_dynamic_banner\n\n\n\n\n\nPlus de soixante-dix ans de gloire, et le grand phénix s'élève sur neuf myriades de lieues de vent. Sous la direction ferme du Parti communiste chinois, des générations d'officiers et de soldats de l'armée de l'air, portant de hautes ambitions, ont combattu dans les vastes cieux, obtenant des résultats dans la construction de l'armée de l'air qui retiennent l'attention du monde entier et accomplissant des services immortels pour la sauvegarde de la souveraineté, de la sécurité et des intérêts de développement de l'État. Aujourd'hui, l'Armée de l'air populaire n'est plus la jeune force qui devait voler deux fois faute d'avions suffisants ; elle est devenue un service moderne de haute technologie réunissant l'aviation, les forces de missiles sol-air, l'artillerie antiaérienne, les radars et les troupes aéroportées, et composée de chasseurs, de bombardiers, d'avions de transport et d'autres appareils."
 SOV_landforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_land_banner\n\n\n\n\n\n§y« Dur à l'entraînement, facile au combat. »§!\n\nLa réforme Serdioukov de 2008 a décomposé les divisions de mobilisation de masse héritées de l'URSS en brigades permanentes du « nouveau visage » : des contractuels remplacèrent les conscrits et les échelons de commandement pléthoriques furent réduits, de sorte qu'une brigade pouvait être engagée en quelques heures. Après l'arrivée de Choïgou au ministère de la Défense en 2013, les districts militaires Ouest et Sud rétablirent partiellement les divisions, et les grandes unités interarmes reprirent la charge de soutenir une guerre locale. Le 30 septembre 2015, à la demande du gouvernement syrien, les forces russes lancèrent leur campagne aérienne ; la base aérienne de Hmeimim et le site naval de Tartous devinrent les premières têtes de pont permanentes de la Russie hors de ses frontières depuis la chute de l'URSS. En 2017, les forces terrestres s'appuyaient toujours sur les T-72B3, T-90 et BMP-3, formant la plus grande armée d'Europe et un instrument de réaction rapide et de dissuasion sur plusieurs théâtres, de Kaliningrad au Kamtchatka.\n\n§y« Nous ne combattons pas pour la terre des autres, mais nous ne céderons pas un pouce de la nôtre. »§!"
 SOV_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_navy_banner\n\n\n\n\n\n§y« Un souverain qui n'a qu'une armée de terre n'a qu'une main ; celui qui possède aussi une flotte en a deux. »§!\n\nLa marine russe se répartit entre les flottes du Nord, du Pacifique, de la Baltique et de la mer Noire, ainsi que la flottille de la Caspienne ; la flotte du Nord porte à la fois les sous-marins stratégiques et la route maritime du Nord. En 2017, le premier bâtiment de la classe Iassen, le Severodvinsk, était déjà en service, les sous-marins de la classe Boreï et ses versions améliorées entraient dans la flotte et les vieilles coques soviétiques quittaient progressivement la première ligne ; cette année-là, le porte-avions Kouznetsov conduisit une force navale en Méditerranée, le plus grand déploiement de la marine russe depuis la fin de l'URSS. Contrairement aux forces terrestres, le poids de la marine ne tient pas au nombre mais à la triade que forment la dissuasion nucléaire, la présence en haute mer et la frappe contre la terre.\n\n§y« Le pavillon de Saint-André ne se baisse jamais. »§!"
 SOV_airforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_air_banner\n\n\n\n\n\n§y« Notre ciel n'est pas ouvert aux regards des autres. »§!\n\nLes forces aérospatiales russes sont nées en 2015 de la fusion de l'armée de l'air et des troupes de défense aérospatiale, plaçant l'aviation, la défense antiaérienne et antimissile et la surveillance de l'espace sous une même chaîne de commandement. À partir de septembre 2015, les Tu-95MS et Tu-160 de l'aviation à long rayon d'action, puis les Su-24 et Su-34 de l'aviation de front, se relayèrent au-dessus de la Syrie, tandis que les Su-35S et les systèmes S-400 formaient le noyau de la défense aérienne à Hmeimim : ce fut la fenêtre où la Russie éprouva en combat réel ses nouveaux équipements et son nouveau commandement. En 2017, la famille des Su-27, les Su-34 et les MiG-31 restaient en service et le Su-57 passait les essais d'État ; les forces aérospatiales sont conçues comme un moyen de dissuasion stratégique, nucléaire et conventionnel, dont la mission première est la maîtrise du ciel sur le théâtre.\n\n§y« Le devoir du pilote est de garder la terre sous ses ailes. »§!"
 USA_dynamic_modifier_us_army_desc: "\n\n\n\n£GFX_ZZZ_USA_land_banner\n\n\n\n\n\n§y« Nous défendrons ceci. »§!\n\nLa loi d'autorisation de la défense nationale pour l'exercice 2017 fixa l'effectif d'active de l'armée de terre à environ 476 000 hommes, mettant fin à des années de réduction depuis 2012 et ramenant la priorité de la contre-insurrection vers la préparation d'une guerre terrestre de grande ampleur. Cette année-là, l'armée commença à promouvoir le concept de « bataille multi-domaines », intégrant le cyber, l'espace et le spectre électromagnétique à la planification interarmes ; les M1A2 SEP, les M777A2 et les brigades Stryker restaient la base de son blindé et de sa mobilité. L'armée américaine n'est jamais un service isolé : grâce aux stocks prépositionnés, au transport aérien et maritime stratégique, elle peut projeter une brigade blindée sur n'importe quel théâtre en quelques semaines.\n\n§y« L'art de la guerre est de laisser la peur à l'ennemi. »§!"
 USA_dynamic_modifier_us_navy_desc: "\n\n\n\n£GFX_ZZZ_USA_navy_banner\n\n\n\n\n\n§y« Ne livrez jamais le navire. »§!\n\nEn 2017, l'US Navy alignait environ onze porte-avions nucléaires et plus de 270 bâtiments : le seul service au monde capable de maintenir simultanément des groupes de frappe aéronavale dans plusieurs océans. Les destroyers de la classe Arleigh Burke, les sous-marins d'attaque de la classe Virginia et les littoral combat ships formaient l'ossature de surface et sous-marine, tandis que les groupes aériens embarqués restaient le cœur de la projection de puissance. Les opérations de liberté de navigation en mer de Chine méridionale, les escortes dans le golfe Persique et les déploiements en Méditerranée firent de la marine l'instrument le plus direct de la présence mondiale américaine ; l'entrée en service des porte-avions de la classe Ford et la mise sur cale des sous-marins de la classe Columbia marquèrent le début d'un nouveau cycle de construction navale.\n\n§y« La maîtrise des mers n'est pas un droit de naissance, mais ce que chaque flotte gagne en patrouillant jour après jour. »§!"
 USA_dynamic_modifier_us_airforce_desc: "\n\n\n\n£GFX_ZZZ_USA_air_banner\n\n\n\n\n\n§y« Visez haut : volez, combattez, gagnez. »§!\n\nEn 2017, l'US Air Force comptait environ 317 000 militaires d'active ; le F-35A commençait à rejoindre en formation les escadrons opérationnels, le F-22 restait le cœur de la supériorité aérienne, et les B-2, B-1B et B-52 formaient l'ossature de la frappe. Cette année-là, le département de la Défense avança la « troisième stratégie de compensation », misant sur l'intelligence artificielle, les systèmes autonomes et les armes hypervéloces pour préserver une avance de génération ; dans le même temps, les frappes antiterroristes se poursuivaient en Irak et en Syrie, et le soutien aérien en Afghanistan ne s'arrêtait pas. Pour l'armée de l'air, la compétition entre grandes puissances et la contre-insurrection — deux guerres radicalement différentes — furent imposées en 2017 aux mêmes escadrons en même temps.\n\n§y« Nous ne gardons pas le ciel, mais tout ce qui est dessous. »§!"
