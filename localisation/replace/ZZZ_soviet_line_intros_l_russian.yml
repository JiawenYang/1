l_russian:
 SOV_soviet_army_modifier: "Сухопутные войска СССР"
 SOV_soviet_army_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_army_banner\n\n\n\n\n\n§y«Наша земля велика, но ни одного лишнего вершка на ней нет.»§!\n\nВ 1946 году Генеральный штаб Красной Армии был воссоздан при Наркомате обороны и закрепил общевойсковую структуру, проверенную в Великой Отечественной войне: танковые армии для прорыва, общевойсковые армии для главного удара, фронты и военные округа как стратегический эшелон. Четыре десятилетия призыв и массовые мобилизационные дивизии держали сухопутные силы от Эльбы до Дальнего Востока, а Афганистан обнажил пределы этой системы в войне низкой интенсивности. Если бы Союз поднялся вновь в 2017 году, эти силы по-прежнему опирались бы на единое планирование Генерального штаба, промышленную мобилизацию Наркомата обороны и глубину военных округов; их сильная сторона — численность, артиллерия и броня, слабая — тыл и качество личного состава.\n\n§y«Кто хочет с нами драться, тот должен быть готов вынести всё.»§!"
 SOV_soviet_navy_modifier: "Военно-морской флот СССР"
 SOV_soviet_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_navy_banner\n\n\n\n\n\n§y«Залпы „Авроры“ были первым приветствием Красного флота.»§!\n\nСоветский флот после войны строился вокруг четырёх флотов — Северного, Тихоокеанского, Балтийского и Черноморского — и ставил на первое место атомные подводные лодки и стратегические ракеты, тогда как надводные корабли долго оставались вспомогательной силой. С 1970-х годов проекты «Киев» и «Киров» впервые дали СССР образ океанского присутствия, но судостроение и порты всегда ограничивали его. Если бы Союз был восстановлен в 2017 году, Красный флот был бы переформирован при Наркомате ВМФ с приоритетом Северного морского пути и баз подводных лодок; его задача — не дуэль с авианосными соединениями НАТО, а заставить каждый вражеский флот разделиться.\n\n§y«Андреевский флаг не спускают, как и честь флота.»§!"
 SOV_soviet_air_modifier: "Военно-воздушные силы СССР"
 SOV_soviet_air_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_air_banner\n\n\n\n\n\n§y«Долг лётчика — держать небо в руках своей страны.»§!\n\nВ годы холодной войны советские ВВС были вторыми в мире: бюро МиГа и Сухого, дивизии ПВО по всей стране и фронтовая авиация составляли их основу; в 1980-е Су-27 и МиГ-29 создали поколенческий разрыв, но электроника и ресурс двигателей оставались слабым местом. Если бы Союз поднялся вновь в 2017 году, ВВС снова были бы слиты с войсками ПВО, а фронтовая, дальняя и военно-транспортная авиация и зенитные ракетные войска оказались бы в одном командовании с приоритетами, заданными Генеральным штабом. Их задача — противовоздушная оборона страны и борьба за господство в воздухе на театре, а не глобальная проекция силы.\n\n§y«От Ленинграда до Владивостока небо принадлежит нам.»§!"
 SOV_soviet_security_modifier: "Органы государственной безопасности СССР"
 SOV_soviet_security_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_soviet_security_banner\n\n\n\n\n\n§y«ЧК — оружие диктатуры пролетариата.»§!\n\nОт ЧК 1917 года к Государственному политическому управлению 1922 года, Главному управлению государственной безопасности 1934 года и Комитету государственной безопасности 1954 года советские органы безопасности подчинялись напрямую высшему руководству партии и государства и соединяли контрразведку, охрану границы, защиту руководителей и управление лагерями. Первое главное управление КГБ вело внешнюю разведку, Второе главное управление — внутреннюю контрразведку, а пограничные войска были военизированной силой. Если бы Союз поднялся вновь в 2017 году, эти органы были бы перестроены как Комитет государственной безопасности, сводя внешнюю разведку, контрразведку и киберпространство в единую цепочку командования; они не участвуют в обычных операциях, но определяют внутреннюю и внешнюю границу безопасности государства.\n\n§y«На невидимом фронте мы никогда не прекращали боя.»§!"
