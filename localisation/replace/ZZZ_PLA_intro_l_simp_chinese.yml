 SOV_landforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_land_banner\n\n\n\n\n\n§y“训练艰苦，战斗轻松。”§!\n\n2008年的谢尔久科夫改革把继承自苏联的大规模动员师拆解为“新面貌”常备旅，以合同兵取代义务兵、压缩臃肿的指挥层级，让一个旅能在数小时内完成出动准备。2013年绍伊古接任国防部长后，西部与南部军区又部分恢复了师级编制，合成部队重新承担起支撑局部战争的任务。2015年9月30日，俄军应叙利亚政府请求开始空袭行动，赫梅米姆空军基地与塔尔图斯海军基地成为苏联解体后俄罗斯在本土之外的首批常驻军事支点。到2017年，俄罗斯陆军仍以T-72B3、T-90与BMP-3为装甲骨干，兵力规模居欧洲首位，战略定位是从加里宁格勒到堪察加的多战区快速反应与威慑力量。\n\n§y“我们不为他人的土地而战，但自己的土地一寸也不会让出。”§!"
 SOV_navy_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_navy_banner\n\n\n\n\n\n§y“只有陆军的君主只有一只手，同时拥有海军的君主才有两只手。”§!\n\n俄罗斯海军分为北方舰队、太平洋舰队、波罗的海舰队、黑海舰队与里海区舰队，其中北方舰队同时承担战略核潜艇与北方海航道的使命。2017年，885型“亚森”级首艇“北德文斯克”号已服役，955型“北风之神”级及其改进型陆续入列，老旧的苏联时代艇体逐步退出一线；同年“库兹涅佐夫”号航母率编队远赴地中海，是苏联解体后俄海军规模最大的一次远征部署。与陆军不同，海军的重心不在数量，而在核威慑、远洋存在与对陆打击三位一体的能力。\n\n§y“圣安德烈旗永不降下。”§!"
 SOV_airforce_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_air_banner\n\n\n\n\n\n§y“我们的天空，不容他人窥视。”§!\n\n俄罗斯空天军由空军与航天防御部队于2015年合并而成，把航空兵、防空反导与太空监视置于同一条指挥链下。2015年9月起，远程航空兵的图-95MS、图-160与前线航空兵的苏-24、苏-34在叙利亚上空轮番出动，苏-35S与S-400则在赫梅米姆基地构成防空核心，这是俄军在实战中检验新装备与指挥体制的窗口。2017年，苏-27家族、苏-34与米格-31仍在役，苏-57处于国家测试阶段，空天军的定位是核常兼备的战略遏制与战区制空。\n\n§y“飞行员的天职，是守护脚下的土地。”§!"
 USA_dynamic_modifier_us_army_desc: "\n\n\n\n£GFX_ZZZ_USA_land_banner\n\n\n\n\n\n§y“吾等誓死捍卫。”§!\n\n2017财年国防授权法案为陆军核定约47.6万现役员额，结束了自2012年以来连续多年的缩编，并把建设重点从反恐治安战重新转向大规模地面作战的准备。这一年起，陆军开始推行“多域战”概念，把网络、太空与电磁频谱纳入合成兵种的筹划范畴；M1A2 SEP、M777A2与“斯特赖克”旅仍是其装甲与机动的骨干。美国的陆军从来不是孤立的军种：依托全球预置装备、战略空运与海运体系，它可以在数周内向任一战区投送一支重装旅。\n\n§y“战争的艺术，在于把恐惧留给敌人。”§!"
 USA_dynamic_modifier_us_navy_desc: "\n\n\n\n£GFX_ZZZ_USA_navy_banner\n\n\n\n\n\n§y“绝不弃舰。”§!\n\n2017年，美国海军维持约11艘核动力航母与270余艘舰艇的规模，是全球唯一能同时在多个大洋维持航母打击群的军种。伯克级驱逐舰、弗吉尼亚级攻击核潜艇与濒海战斗舰构成其水面与水下主力，航母舰载机联队则是力量投送的核心。南海的“航行自由”行动、波斯湾护航与地中海部署，让海军成为美国全球存在最直接的载体；而“福特”级航母的服役与“哥伦比亚”级潜艇的立项，则标志着新一轮造舰周期的开始。\n\n§y“制海权不是天赋，而是每一支舰队日复一日的巡弋换来的。”§!"
 USA_dynamic_modifier_us_airforce_desc: "\n\n\n\n£GFX_ZZZ_USA_air_banner\n\n\n\n\n\n§y“志在苍穹，飞战必胜。”§!\n\n2017年，美国空军约有31.7万现役人员，F-35A开始成建制进入作战联队，F-22仍是制空作战的核心，B-2、B-1B与B-52构成空中打击的骨干。国防部在当年提出“第三次抵消战略”，把人工智能、自主系统与高速武器视为维持代差的抓手；与此同时，反恐空袭仍在伊拉克与叙利亚持续，阿富汗的空中支援也未曾停止。对空军而言，大国竞争与反恐作战这两种截然不同的任务，在2017年被同时压在了同一批机队上。\n\n§y“我们守护的不是天空，而是天空之下的一切。”§!"
