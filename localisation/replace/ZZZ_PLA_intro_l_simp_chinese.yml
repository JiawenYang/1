l_simp_chinese:
 CHI_landforce_modifier_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\n§y克复黄安县，试看碧云紫气，苍生济济拥红军。§!\n\n1927年南昌城的一声枪响，成为人民解放军正式登上历史舞台的起点。中国人民解放军，尤其它的陆上部队，一直是党和人民所信赖的武装，由习近平在2016年所开启的军队现代化改革则赋予了它在现代战场环境下作战并取胜的能力。解放军如今已经不再是单纯的国土防御部队，而是能在东北亚、乃至整个太平洋地区都进行部署的强大武装。未来可能会有更多机会证明这一点。\n\n§y“我全军将士必须时刻牢记，我们是伟大的人民解放军，是伟大的中国共产党领导的队伍。只要我们时刻遵守党的指示，我们就一定胜利。”§!"
 CHI_navy_modifier_desc: "\n\n\n\n£GFX_PRC_plan_dynamic_banner\n\n\n\n\n\n§y向海而兴、背海而衰，不能制海、必为海制。§!\n\n历史照亮未来，征程未有穷期。从一支相当弱小的近岸防御部队到今天拥有航空母舰与核潜艇的强大力量，人民海军经过艰难发展，从无到有、从小到大、由弱到强，发展成为五大兵种齐全、核常兼备的战略性军种。成为一支能够有效维护国家主权、安全、发展利益的海上武装力量。如今在新时代军事改革引领下，人民海军加快转型建设步伐，各项建设取得历史性成就、发生历史性变革，正以全新姿态屹立于世界的东方。\n\n§y“为了反对帝国主义的侵略，我们一定要建立强大的海军。”§!"
 CHI_airforce_modifier_desc: "\n\n\n\n£GFX_PRC_plaaf_dynamic_banner\n\n\n\n\n\n§y国际悲歌歌一曲，狂飙为我从天落。§!\n\n七十多载光辉岁月，九万里风鹏正举。在中国共产党坚强领导下，一代代空军官兵胸怀凌云壮志，搏击万里长空，推动空军建设取得举世瞩目的成就，为维护国家主权、安全、发展利益建立了不朽功勋。如今，人民空军再也不是“飞机不够，我们就飞两遍”的年轻力量，而是发展成为了一支由航空兵、地空导弹兵、高射炮兵、雷达兵、空降兵等多兵种合成，由歼击机、轰炸机、运输机等多机种组成的现代化高技术军种。\n\n§y“建立一支强大的人民空军，保卫祖国，准备战胜侵略者。”§!"
 PRC_pla_dynamic_desc: "\n\n\n\n£GFX_PRC_pla_dynamic_banner\n\n\n\n\n\n§y克复黄安县，试看碧云紫气，苍生济济拥红军。§!\n\n1927年南昌城的一声枪响，成为人民解放军正式登上历史舞台的起点。中国人民解放军，尤其它的陆上部队，一直是党和人民所信赖的武装，由习近平在2016年所开启的军队现代化改革则赋予了它在现代战场环境下作战并取胜的能力。解放军如今已经不再是单纯的国土防御部队，而是能在东北亚、乃至整个太平洋地区都进行部署的强大武装。未来可能会有更多机会证明这一点。\n\n§y“我全军将士必须时刻牢记，我们是伟大的人民解放军，是伟大的中国共产党领导的队伍。只要我们时刻遵守党的指示，我们就一定胜利。”§!"
