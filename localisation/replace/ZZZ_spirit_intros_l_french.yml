 USA_dynamic_modifier_us_general_staff_desc: "\n\n\n\n£GFX_ZZZ_USA_general_staff_banner\n\n\n\n\n\n§y« Les amateurs parlent de tactique, les professionnels étudient la logistique. »§!\n\nLa loi sur la sécurité nationale de 1947 créa le Joint Chiefs of Staff ; l'amendement de 1949 y ajouta un président, et la loi Goldwater-Nichols de 1986 plaça celui-ci au sommet du conseil militaire au président, au Conseil de sécurité nationale et au secrétaire à la Défense. En 2017, le comité réunissait le président, le vice-président, le chef d'état-major de l'armée de terre, le chef des opérations navales, le chef d'état-major de l'armée de l'air, le commandant du corps des Marines et le chef du Bureau de la Garde nationale : le général Joseph Dunford présidait, le général Paul Selva étant vice-président. Le comité ne détient aucun commandement opérationnel — les ordres passent du président au secrétaire à la Défense puis aux commandements de combat unifiés — mais la planification stratégique interarmées, l'examen des plans opérationnels et la coordination entre services passent par lui, et c'est là que l'armée de terre, la marine, l'armée de l'air, les Marines et la Garde nationale sont soudés en une force interarmées. La loi d'autorisation de la défense nationale pour l'exercice 2017 consacra environ 619,5 milliards de dollars à ce système et impulsa les réformes des achats et du personnel ; en 2017, année où la pression s'exerçait simultanément en péninsule coréenne, au Moyen-Orient et en Europe de l'Est, le comité était à la fois la source des conseils militaires de la Maison-Blanche et le guichet que chaque service devait franchir dans la lutte pour les ressources.\n\n§y« De plusieurs, un seul. »§!"
 SOV_intelligence_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_security_banner\n\n\n\n\n\n§y« Un tchékiste doit avoir un cœur chaud, une tête froide et les mains propres. »§!\n\nAprès l'effondrement de l'URSS, le KGB fut divisé en plusieurs services sans autorité commune : le Service fédéral de sécurité (FSB) hérita du contre-espionnage intérieur et de la lutte antiterroriste, le Service de renseignement extérieur (SVR) reprit le renseignement à l'étranger, et l'ancienne Agence fédérale des communications et de l'information gouvernementales (FAPSI), dissoute en 2003, vit ses fonctions réparties entre le FSB, le SVR et la Direction principale de l'état-major général (GRU), qui conserva le renseignement militaire et les opérations spéciales. En 2016, la Garde nationale russe, formée sur les troupes intérieures du ministère de l'Intérieur, fut créée et placée directement sous l'autorité du président, aux côtés du FSB, du SVR et du GRU. En 2017, le FSB, dirigé par Alexandre Bortnikov, enquêta sur l'attentat d'avril dans le métro de Saint-Pétersbourg et maintint une forte pression antiterroriste dans le Caucase du Nord et les grandes villes ; le SVR, sous Sergueï Narychkine, développa le renseignement extérieur ; le GRU, sous Igor Korobov, resta la cible des sanctions et de l'attention occidentales pour ses actions en Ukraine et en Syrie. Ces services ne participent pas au commandement opérationnel ordinaire, mais par le renseignement, le contre-espionnage, la protection des dirigeants et la surveillance des réseaux, ils repoussent la frontière de sécurité du Kremlin au-delà des frontières du pays.\n\n§y« Au-dessus de nous, seules les étoiles. »§!"
 CHI_defense_industry_desc: "\n\n\n\n£GFX_ZZZ_CHI_defense_industry_banner\n\n\n\n\n\n§y« Aimer la patrie, se donner sans réserve ; compter sur ses propres forces, travailler avec acharnement ; coopérer à grande échelle, oser gravir les sommets. »§!\n\nL'industrie de défense chinoise repose sur un squelette de grands groupes d'État : Norinco et China South Industries pour le matériel terrestre, CSSC et CSIC se partageant la construction navale entre le nord et le sud, AVIC pour les avions de combat et les moteurs, CASC et CASIC pour les missiles et l'espace, CETC et CEC pour les radars, les communications et la guerre électronique, et CNNC pour le nucléaire. La réforme militaire de 2016 remplaça l'ancien système des quatre départements par une Commission militaire centrale pluridépartementale ; le département du développement des équipements prit la direction unifiée du développement et des achats, tandis que les théâtres et les services formulaient leurs besoins en termes d'opérations conjointes. En janvier 2017 fut créée la Commission centrale pour l'intégration militaro-civile, faisant passer cette intégration d'une politique de département à une stratégie nationale. Les résultats de 2017 s'énumèrent : le J-20 commença à être livré aux unités, le J-16 et le Y-20 entrèrent en service en série, le premier porte-avions national Type 001A fut lancé en avril, le destroyer Type 055 en juin, et le DF-31AG apparut publiquement au défilé de Zhurihe ; le budget de la défense cette année-là atteignit environ 1 040 milliards de yuans, en hausse d'environ 7 pour cent. Le système garde des points faibles dans les moteurs, les matériaux et les puces de haut niveau, mais il a déjà fait passer la Chine d'un importateur d'équipements à un pays capable de développer seul ses principaux systèmes de combat.\n\n§y« Si l'armée et le peuple ne font qu'un, qui pourra leur tenir tête ? »§!"
