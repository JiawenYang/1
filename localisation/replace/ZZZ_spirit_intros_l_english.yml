 USA_dynamic_modifier_us_general_staff_desc: "\n\n\n\n£GFX_ZZZ_USA_general_staff_banner\n\n\n\n\n\n§y‘Amateurs talk about tactics, but professionals study logistics.’§!\n\nThe National Security Act of 1947 established the Joint Chiefs of Staff; the 1949 amendment added a Chairman, and the Goldwater–Nichols Act of 1986 placed the Chairman at the apex of military advice to the President, the National Security Council and the Secretary of Defense. By 2017 the Joint Chiefs consisted of the Chairman, the Vice Chairman, the Chief of Staff of the Army, the Chief of Naval Operations, the Chief of Staff of the Air Force, the Commandant of the Marine Corps and the Chief of the National Guard Bureau: General Joseph Dunford chaired the body, with General Paul Selva as Vice Chairman. The Joint Chiefs hold no operational command authority — orders run from the President through the Secretary of Defense to the unified combatant commands — but joint strategic planning, operational plan review and inter-service coordination all pass through them, and it is there that the Army, Navy, Air Force, Marine Corps and National Guard are welded into a joint force. The FY2017 National Defense Authorization Act provided about 619.5 billion dollars for this system and pushed acquisition and personnel reform; in a 2017 that saw pressure on the Korean Peninsula, in the Middle East and in Eastern Europe at once, the Joint Chiefs were both the source of military advice to the White House and the gate every service had to pass in the fight for resources.\n\n§y‘Out of many, one.’§!"
 SOV_intelligence_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_security_banner\n\n\n\n\n\n§y‘A Chekist must have a warm heart, a cool head and clean hands.’§!\n\nAfter the collapse of the USSR the KGB was split into several agencies with no common master: the Federal Security Service (FSB) inherited internal counter-intelligence and counter-terrorism, the Foreign Intelligence Service (SVR) took over intelligence abroad, and the former Federal Agency for Government Communications and Information (FAPSI), dissolved in 2003, saw its functions divided among the FSB, the SVR and the Main Directorate of the General Staff (GRU), which retained military intelligence and special operations. In 2016 the Russian National Guard, built on the Interior Ministry's Internal Troops, was formed and answered directly to the President, standing alongside the FSB, SVR and GRU. In 2017 the FSB under Alexander Bortnikov investigated the April bombing of the St. Petersburg metro and kept counter-terrorist pressure in the North Caucasus and the major cities; the SVR under Sergei Naryshkin expanded foreign intelligence work; the GRU under Igor Korobov remained the target of Western sanctions and scrutiny over Ukraine and Syria. These agencies take no part in ordinary operational command, yet through intelligence, counter-intelligence, VIP protection and network surveillance they push the Kremlin's security frontier beyond the country's borders.\n\n§y‘Above us only stars.’§!"
 CHI_defense_industry_desc: "\n\n\n\n£GFX_ZZZ_CHI_defense_industry_banner\n\n\n\n\n\n§y‘Love the motherland, give without reserve; rely on our own efforts, work hard; coordinate on a grand scale, dare to scale the heights.’§!\n\nChina's defence industry rests on a skeleton of large state-owned groups: Norinco and China South Industries handle land warfare equipment, CSSC and CSIC divide shipbuilding between north and south, AVIC is responsible for combat aircraft and engines, CASC and CASIC cover missiles and space, CETC and CEC support radar, communications and electronic warfare, and CNNC holds the nuclear portfolio. The 2016 military reform replaced the old four-department system with a multi-department Central Military Commission; the Equipment Development Department took unified charge of development and procurement, while the theatre commands and services stated their requirements in joint-operations terms. In January 2017 the Central Commission for Integrated Military and Civilian Development was established, lifting military-civil fusion from departmental policy to a national strategy. The results of 2017 can be listed one after another: the J-20 began deliveries to operational units, the J-16 and Y-20 entered service in quantity, the first indigenous carrier Type 001A was launched in April and the Type 055 destroyer in June, and the DF-31AG appeared publicly at the Zhurihe parade; the defence budget that year was about 1.04 trillion yuan, up roughly 7 percent. The system still has weak points in engines, materials and high-end chips, but it has turned China from an importer of equipment into a country able to develop its own main combat systems.\n\n§y‘If the army and the people are united as one, who in the world can match them?’§!"
