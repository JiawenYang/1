 USA_dynamic_modifier_us_general_staff_desc: "\n\n\n\n£GFX_ZZZ_USA_general_staff_banner\n\n\n\n\n\n§y«Любители говорят о тактике, а профессионалы изучают логистику».§!\n\nЗакон о национальной безопасности 1947 года создал Комитет начальников штабов; поправка 1949 года учредила должность председателя, а закон Голдуотера—Николса 1986 года поставил председателя на вершину системы военных советов президенту, Совету национальной безопасности и министру обороны. К 2017 году в Комитет входили председатель, заместитель председателя, начальник штаба армии, начальник военно-морских операций, начальник штаба военно-воздушных сил, командующий корпусом морской пехоты и начальник бюро национальной гвардии: председателем был генерал Джозеф Данфорд, заместителем — генерал Пол Сельва. Комитет не обладает оперативным командованием — приказы идут от президента через министра обороны к объединенным боевым командованиям, — но совместное стратегическое планирование, проверка оперативных планов и межвидовая координация проходят через него, и именно здесь армия, флот, авиация, морская пехота и национальная гвардия сплавляются в единую объединенную силу. Закон об оборонных ассигнованиях на 2017 финансовый год выделил на эту систему около 619,5 млрд долларов и дал толчок реформам закупок и кадров; в 2017 году, когда давление одновременно ощущалось на Корейском полуострове, на Ближнем Востоке и в Восточной Европе, Комитет был и источником военных советов для Белого дома, и тем рубежом, который каждая служба должна была пройти в борьбе за ресурсы.\n\n§y«Из многих — единое».§!"
 SOV_intelligence_modifier_desc: "\n\n\n\n£GFX_ZZZ_SOV_security_banner\n\n\n\n\n\n§y«У чекиста должны быть горячее сердце, холодная голова и чистые руки».§!\n\nПосле распада СССР система КГБ распалась на несколько не подчиненных друг другу ведомств: Федеральная служба безопасности (ФСБ) наследовала внутреннюю контрразведку и борьбу с терроризмом, Служба внешней разведки (СВР) взяла на себя разведку за рубежом, а бывшее Федеральное агентство правительственной связи и информации (ФАПСИ), расформированное в 2003 году, передало свои функции ФСБ, СВР и Главному управлению Генерального штаба (ГРУ), которое сохранило военную разведку и специальные операции. В 2016 году на базе внутренних войск МВД была создана Российская национальная гвардия, подчиненная напрямую президенту и стоящая в одном ряду с ФСБ, СВР и ГРУ. В 2017 году ФСБ под руководством Александра Бортникова расследовала апрельский взрыв в петербургском метро и держала высокое контртеррористическое давление на Северном Кавказе и в крупных городах; СВР под руководством Сергея Нарышкина расширяла зарубежную разведку; ГРУ при Игоре Коробове оставалось под западными санкциями и вниманием из-за действий на Украине и в Сирии. Эти ведомства не участвуют в обычном оперативном командовании, но через разведку, контрразведку, охрану первых лиц и сетевой надзор они выдвигают границу безопасности Кремля за пределы страны.\n\n§y«Выше нас только звезды».§!"
 CHI_defense_industry_desc: "\n\n\n\n£GFX_ZZZ_CHI_defense_industry_banner\n\n\n\n\n\n§y«Любить Родину, отдавать себя без остатка; опираться на собственные силы, упорно трудиться; широко взаимодействовать, смело брать высоты».§!\n\nОборонная промышленность Китая держится на каркасе крупных государственных объединений: Norinco и China South Industries отвечают за сухопутную технику, CSSC и CSIC делят судостроение между севером и югом, AVIC отвечает за боевые самолеты и двигатели, CASC и CASIC охватывают ракеты и космос, CETC и CEC обеспечивают радиолокацию, связь и радиоэлектронную борьбу, а CNNC ведает ядерной сферой. Военная реформа 2016 года заменила прежнюю систему четырех главных управлений многопрофильным Центральным военным советом; Управление развития вооружений взяло на себя единое руководство разработкой и закупками, а театры военных действий и виды войск формулировали требования в терминах совместных операций. В январе 2017 года был создан Центральный комитет по военно-гражданской интеграции, и военно-гражданская интеграция из ведомственной политики стала государственной стратегией. Итоги 2017 года можно перечислять один за другим: J-20 начал поступать в строевые части, J-16 и Y-20 серийно встали в строй, первый собственный авианосец Type 001A был спущен на воду в апреле, эсминец Type 055 — в июне, а DF-31AG открыто появился на параде в Чжурихэ; оборонный бюджет в том году составил около 1,04 трлн юаней, примерно на 7 процентов больше. Система все еще имеет слабые места в двигателях, материалах и высококлассных чипах, но она уже превратила Китай из импортера техники в страну, способную самостоятельно создавать основные боевые системы.\n\n§y«Если армия и народ едины, кто в мире сравнится с ними?».§!"
