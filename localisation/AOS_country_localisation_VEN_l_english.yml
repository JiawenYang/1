 #EVENTS
 ven.40.t: "Russia Proposes Joint Operation in Colombia"
 ven.40.d: "The Russians offer to help us restore President Petro to power."
 ven.40.a: "Let's do this."
 ven.40.b: "We have other plans."
 ven.41.t: "Venezuela Agrees to Move Forward With Joint Operation"
 ven.41.d: "The Venezuelan government has greenlit Operation Otel Moskva and will be helping us reinstate President Petro in Colombia."
 ven.41.a: "Good luck, everyone!"
 ven.42.t: "Venezuela Rejects Joint Operation Plans"
 ven.42.d: "The Venezuelan government has rejected Operation Otel Moskva, citing the need for further preparations before an intervention can take place."
 ven.42.a: "Good luck on your own then..."
 ven.43.t: "Colombian Government Sign Peace Treaty With ELN"
 ven.43.d: "Following a successful operation to reinstall President Petro, he signs a treaty with ELN and unites the country against other two smaller factions."
 ven.43.a: "Great work, everyone!"
 ven.46.t: "My Greatest Hour"
 ven.46.d: "He read the message once again. He smirked, looking up at the portrait of the eternal commandant in his office's wall. He's never been so excited about something before.\n\"Here's your coffee, sir.\" The soldier carefully placed the cup on his table. He was attempting to gain his captain's favor to convince him to give him a raise, and so he carefully analized his superior's reaction, but instead he noticed his distracted smile. It was uncommon to catch him in a good mood.\n\"Are you ok, sir?\"\nThe captain turned towards him. \"I am.\" he said, \"In fact, I've never felt this good ever since I joined the institution.\" He took a sip of coffee, and continued talking. \"We're heading to war, boy. You better go and get ready, we'll be leaving in a couple days.\"\n\"W-War? They're sending us off to Colombia? I thought we were supposed to patrol the border...\"\n\"You sound hesitant, mijo.\" The captain sat down in front of the table, and instructed his subordinate to do the same. \"I did not know I had cowards in my ranks. You are a soldier. You are not here for a mere paycheck. You are here to defend your country, the revolution, your pride, and your family. I know it might sound frightening, but you can't expect to survive if you don't believe in your own capabilities. Once you make it back, you'll be received by your neighborhood with flowers, cheers and kisses. But that won't happen unless you actually try to do your best out there, understood?\"\nThe soldier could already feel hell raining upon him. The sounds of the tanks and the artillery from the training exercises became part of a real nightmare unfolding in the back of his head. He regained his senses. He couldn't show himself as a cowardly fool in front of his captain.\n\"Yes, sir.\"\n\"That's all I wanted to say. Now go and get your stuff ready. I'll let everyone else know about this in a couple of hours.\"\n\nHe sat outside the camp. He lit up his cigarette and began looking in his phone for the picture he took with his girlfriend before being deployed to the border. He told her he'd be back in a few weeks, and that he'd use this opportunity to get a raise to improve their living conditions and maybe even afford a wedding. He looked at her smile. Instead of wondering if he'll ever see her again, he set a goal for himself: as soon as he returned, he was going to recreate that exact picture with her, still wearing his uniform with whatever badge they gave him for his efforts.\nThe sun was retreating into the horizon. He thought the underdeveloped desert he was deployed to was ugly until he witnessed how beautifully the sun shone upon the sand as the night sky fell upon him. This was his farewell to peace before embarking on his baptism to become a true man.\nThe man she deserved."
 ven.46.a: "Godspeed."
 ven.47.t: "Day Zero"
 ven.47.d: "\"...Mom?\"\n\nCamila had returned from the local store, not so far from her house. She entered the living room, where she saw her mother frantically gathering their belongings and stuffing them in suitcases and plastic bags. \"I couldn't get anything, the store was closed\". As soon as she heard her, her mother rushed to her and grabbed her by her shoulders. Her often calm countenance showed total desperation and fear. \"Camila. We need to get out of here.\" she muttered between her teeth before yelling \"Go get your stuff!\"\n\"Why?! What's going on?! Where's dad?!\" Her mother let go of her and ran upstairs and then cameback with their bedsheets. \"Your dad is filling up the car, we're heading to your aunt's apartment in Bogota. We'll be fine, the army is-\"\nShe was interrupted by the car's horn outside their house, and soon enough she heard her dad's voice. \"THEY'RE HERE! WE NEED TO GO, NOW!\"\n\"CAMILA! HELP ME CARRY THE BAGS!\" she yelled at her before turning to the window. \"RAUL, HELP ME GET THE MATTRESSES!\"\n\nThey had left several things behind. Camila had never seen her father driving this fast before. She began worrying about her friends. They all promised her that they'll assist to her 16th birthday in a couple of months. Now, she'll spend her birthday in a cramped apartment in the capital.\n\n\"SHIT!\"\n\"OH MY GOD! TURN AROUND THAT CORNER!\"\nThe car skidded sideways, and she nearly flew out of her seat. Before that, she saw something at the end of the road. A tank, covered in the national tricolor with stars painted on top of it. It has heading to the opposite direction, but she swore she felt that beast of metal was staring right at her."
 ven.47.a: "90 degrees to the right."
 #DECISION CATEGORIES
 VEN_civil_war_cat: "Colombian Intervention"
 VEN_civil_war_cat_desc: "Officially, it was called the §YSecond Admirable Campaign§!, and it was referred as such by the state media and those who supported these operations. The idea came from the high command, in which there were several ideologues who compared the intervention to the Admirable Campaign of 1813.\n\nDuring our War of Independence, Bolívar and some of his colleagues had to retreat to New Granada (Colombia) after the royalists had put an end to the First Venezuelan Republic a year prior. There, they earned the support of New Granada's own revolutionaries and convinced them to lend him men, weapons and resources to organize an expedition to free Venezuela from the Spanish yoke. In just four months, they reached Caracas and reestablished Venezuela as an independent entity.\n\nOur objective, according to the media, is to return that favor. To organize yet another Admirable Campaign, this time with the goal of liberating Colombia from the imperialist and elitist interests manifested in the National Colombian Army and the Gulf Clan. "
