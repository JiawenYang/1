 #Characters
 VEN_nicolas_maduro_char: "Nicolás Maduro"
 VEN_nicolas_maduro_char_desc: "Nicolás Maduro Moros wasn't born in a position of power, surrounded by piles of gold. He was born in a middle class family in Caracas, completely unaware of where his future decisions would take him.\n\nHis father was a leftist militant, and his troubled history with the authorities served as an example to follow for Nicolás, who spent his teenager years experimenting with the ideas of revolution and class struggle. Instead of studying in college, he began working as a humble bus driver in the Caracas Metro, while still being a valuable member of his syndicate. His life took a huge turn when he became a follower of Hugo Chávez when he launched his failed coup attempt in 1992. When Chávez won the presidential elections in 1999, Maduro became a deputy in the National Assembly. His loyalty would get him a place in Chávez's cabinet, and eventually he would end up becoming his vice president in 2012.\n\nChávez was suffering from cancer at that time, and he knew he didn't have a lot of time left, so he publicly declared that if he passed away, Maduro would succeed him. Pass away he did, and from there things just got worse each day. Maduro's presidency was marked by scarcity, hunger, political upheaval, misery and unstability. The humanitarian crisis that ravaged his country proved him quite inefficient in his efforts the serve the people he swore to protect. No matter how much he tried, more and more people turned against him and fought against him on the streets he used to march on as a humble activist.\n\nWith each day that passes he grows more authoritarian, desperate to hold on to power in a country that keeps falling apart. He does this to preserve the legacy of Chávez and the §RBolivarian Revolution§!, but these efforts seem futile, like trying to reconstruct a pile of burned, shattered glass."
 #Country Flag
 VEN_intervene_colombia_flag: "§YVenezuela§! has intervened in the §RColombian Civil War§!."
 #Tooltips
 VEN_intervene_colombia_mission_tt: "§YWe will intervene in the§! §RColombian Civil War§! §Yon the side of [ELN.GetFlag] [ELN.GetNameDef]!§!"
 VEN_accept_operation_otel_moskva_tt: "§YPresident Petro will be restored to power in Colombia, and we will intervene in the§! §RColombian Civil War§! §Yon their side!§!"
 VEN_girardot_tt: "§Y\"Rush 'em! Rush the Llanos and head straight to Bogotá! I know this sounds risky, but think about it! Colombia is a highly centralized country. If we take the capital, their entire command will be decapitated! Plus, it would be a great boost to our soldiers' morale to see our promise of restoring Petro's presidency being fulfilled. We don't even have to seize it right away. They are surrounded. If we can't roll into the city immediately, just starve them out until they're too famished to fight back against us. All we need is to get there, sir.\"§!."
 VEN_padilla_tt: "§Y\"I simply can't suggest that we should head straight to the Magdalena corridor. Pushing them beyond the river and its surroundings will take us forever. Instead, we need to drive them out by stretching their frontlines. Securing Cartagena wouldn't just grant us a valuable supply node. It would also give us the chance to capture the entire Caribbean coast, which would force the enemy to redeploy several units from the Magdalena front. The ELN will be grateful.\"§!."
 VEN_piar_tt: "§Y\"They're hiding like rats in the jungle. What do you do when you have rats in your house? You call pest control, of course. We'll make sure to chase them down, surround them, slaughter them, and leave not a single place in which they could possibly hide in. I'll admit, we're resorting to extreme measures here, but if we hold back now, the Resistance will observe our behavior and use the exact same tactics they're using. We can't burn our own jungles, but we can make them think that we can by burning theirs.\"§!."
 # IDEOLOGY
 VEN_left_nationalism_desc: "\n\n\n\n  £GFX_texticons_VEN_Ideology_Chavismo \n\n\n\n\n\n §Y\"Bolivarianism\"§! is a political movement that emerged in Venezuela under the leadership of Hugo Chávez in the late 1990s. It combines elements of socialism, nationalism, anti-imperialism, and populism, arguing that the state should play a central role in the economy by controlling strategic sectors, particularly the oil industry. It advocates the redistribution of national wealth through extensive social programs, the expansion of public services, and policies aimed at reducing poverty and inequality. It also promotes national sovereignty in the face of foreign influence, especially that of the United States, as well as greater political participation by the popular sectors through mechanisms of participatory democracy.\n\nFrom the mid-2000s onward, Chavismo became identified with the so-called Socialism of the 21st Century and influenced other governments associated with Latin America's Pink Tide. In practice, it developed a political structure characterized by a strong concentration of power around the executive branch and the personalist leadership of Hugo Chávez and, later, Nicolás Maduro. Its critics argue that institutions such as communal councils and colectivos have functioned not only as organizations for social participation but also as mechanisms of political control and pro-government mobilization. Various human rights organizations have also reported restrictions on the political opposition, limitations on press freedom, and a gradual weakening of institutional independence, while the government maintains that these measures are intended to defend national sovereignty and preserve the country's stability against internal and external attempts at destabilization."
 
 
 