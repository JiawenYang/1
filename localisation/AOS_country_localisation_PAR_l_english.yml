 #VEN_nicolas_maduro_char: "Nicolás Maduro"
 #VEN_nicolas_maduro_char_desc: "Nicolás Maduro Moros wasn't born in a position of power, surrounded by piles of gold. He was born in a middle class family in Caracas, completely unaware of where his future decisions would take him.\n\nHis father was a leftist militant, and his troubled history with the authorities served as an example to follow for Nicolás, who spent his teenager years experimenting with the ideas of revolution and class struggle. Instead of studying in college, he began working as a humble bus driver in the Caracas Metro, while still being a valuable member of his syndicate. His life took a huge turn when he became a follower of Hugo Chávez when he launched his failed coup attempt in 1992. When Chávez won the presidential elections in 1999, Maduro became a deputy in the National Assembly. His loyalty would get him a place in Chávez's cabinet, and eventually he would end up becoming his vice president in 2012.\n\nChávez was suffering from cancer at that time, and he knew he didn't have a lot of time left, so he publicly declared that if he passed away, Maduro would succeed him. Pass away he did, and from there things just got worse each day. Maduro's presidency was marked by scarcity, hunger, political upheaval, misery and unstability. The humanitarian crisis that ravaged his country proved him quite inefficient in his efforts the serve the people he swore to protect. No matter how much he tried, more and more people turned against him and fought against him on the streets he used to march on as a humble activist.\n\nWith each day that passes he grows more authoritarian, desperate to hold on to power in a country that keeps falling apart. He does this to preserve the legacy of Chávez and the Bolivarian Revolution, but these efforts seem futile, like trying to reconstruct a pile of burned, shattered glass."
