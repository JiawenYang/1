l_english:
 #Sixth Middle East War event chain
 mew.0.t: "The Guns of Gaza"
 mew.0.d: "In the early hours of 9 October 2020, the Israel Defense Forces cross the Gaza border and Operation Iron Sword begins in full. Armoured columns advance under drone cover while the air force hammers Hamas's tunnel network wave after wave. The Israeli government tells the nation this is a 'limited clearance' of terrorist infrastructure. But in Cairo and Damascus no one believes it - as IDF tanks roll into the outskirts of Gaza City, everyone can see what 'limited' really means."
 mew.0.a: "Make Gaza pay."
 mew.1.t: "The Powder Keg Rekindled"
 mew.1.d: "As the annexation plan for the Jordan Valley advances with Washington's blessing and the Abraham Accords split the Arab world in two, the abandoned Palestinians erupt in mass protests across Gaza and the West Bank. Bloody clashes on the Temple Mount in early October prove the final straw: rockets rain down on Israeli towns from Gaza, Hezbollah fighters in southern Lebanon go on full alert, and Syrian armor masses on the Golan front. The phone lines between Cairo and Damascus hum through the night - the October War of 1973 seems poised to repeat itself half a century later."
 mew.1.a: "Another October War?"
 mew.2.t: "The Sixth Middle East War"
 mew.2.d: "At six in the morning Cairo time, Egypt, Syria and Hezbollah announce joint military operations against Israel; the PLO and Hamas answer the call within hours. The coalition proclaims its aim to 'halt annexation and liberate the occupied territories'. The IDF mobilizes across every front as the Iron Dome intercepts rockets over Tel Aviv. For the first time since 1973, the Arab world has united in war against Israel - and America, drowning in pandemic and election chaos, can only watch the Middle East burn."
 mew.2.a: "God help them all."
 mew.3.t: "Decision at the White House"
 mew.3.d: "On the Pentagon's situation room screens, the map of the Middle East changes color by the hour. The national security team is split: hawks demand immediate emergency military aid to Israel, even a carrier strike group in the Eastern Mediterranean; the Chief of Staff reminds the President that COVID deaths are still climbing, the election is weeks away, and voters have no stomach for American boots back in the sand. The Israeli ambassador has been waiting outside for two hours."
 mew.3.a: "America First. Let them sort it out themselves."
 mew.3.b: "Approve emergency military aid - but no troops."
 mew.4.t: "Oil Crisis Grips the Globe"
 mew.4.d: "The war in the Middle East has struck the arteries of global energy. Suez shipping grinds to a halt, Gulf producers face pressure to pick sides, and crude prices skyrocket within days. Tankers queue outside Rotterdam and Singapore as governments tap strategic reserves to calm the markets. Analysts warn the shock could dwarf the 1973 embargo - and this time, the great powers, mired in pandemic, are in no position to catch the falling knife."
 mew.4.a: "Fill up while you still can."
 mew.5.t: "The IDF Enters Gaza"
 mew.5.d: "The UN Security Council convenes an emergency session and adjourns in mutual recrimination. Gaza's hospitals fill with wounded within hours, Egypt opens the Rafah crossing to refugees, and Hamas calls on the entire Arab world to 'stay silent no longer'. In late-night phone calls, the Gulf monarchies exchange the same judgment: if they sit this one out again, they will be next on the annexation list."
 mew.5.a: "Once again, the world just watches."
 mew.6.t: "The Arab Coalition and the Axis of Resistance Enter the War"
 mew.6.d: "Three days later, Egypt and Syria announce they are honouring the Jerusalem Defence Pact, and Algeria, Libya and the Lebanese government follow with declarations of war on Israel. Almost at the same hour, the Axis of Resistance led by Iran crosses the border: Hezbollah pours rockets out of southern Lebanon, Iraqi Shia militias move men into Syria through opened crossings, and Tehran's statement is a single sentence - 'From the Mediterranean to the Persian Gulf, not one battlefield stands alone.' Israel finds itself facing two fronts at once: a regular army commanded from Cairo, and an axis of resistance commanded from Tehran."
 mew.6.a: "The Sixth Middle East War has truly begun."
 mew.10.t: "The Palestinian Flag over Jerusalem"
 mew.10.d: "Israel's resistance has finally collapsed under the coalition's relentless blows. Palestinian fighters enter Tel Aviv first as Egyptian and Syrian troops mop up the remaining pockets. The PLO proclaims a unified Palestinian state with Jerusalem as its capital. Hundreds of thousands of Jewish settlers evacuate in haste, flooding refugee camps in Cyprus and southern Europe; those who could not leave face an uncertain fate. Nearly eighty years of the Zionist experiment have ended, and the Arab world celebrates for a week - yet beneath the victors' table, countless new fuses are already smoldering."
 mew.10.a: "An era has ended."
 mew.11.t: "The Cairo Military Alliance"
 mew.11.d: "The victory belongs to the entire Arab world, but the spoils demand order. The Egyptian president invites the leaders of Syria, Palestine and the Lebanese resistance to Cairo, proposing to institutionalize the wartime coordination into a standing military alliance: unified command, joint air defense, shared intelligence. Damascus signs first - a Syria rebuilding from ruins needs Egypt's shield, and Cairo needs Damascus to prove that the leader of the Arab world has returned."
 mew.11.a: "For the first time, the Arabs won a war on their own terms."
 mew.20.t: "Greater Israel"
 mew.20.d: "The war ended in a way no one expected: the coalition's stunning opening gains were shattered one by one by the IDF. Sinai changed hands once more, southern Lebanon fell under full Israeli occupation, and Damascus and Cairo sued for peace. The security cabinet then unveiled its 'extension of sovereignty': the entire West Bank (5,655 sq km, including the Jordan Valley and every settlement) and the Gaza Strip (365 sq km) were formally incorporated into Israel; southern Lebanon south of the Litani (about 1,000 sq km) became a security zone; the Syrian governorates of Daraa and As-Suwayda (about 9,280 sq km) were severed to create depth east of the Golan; and the Sinai Peninsula (about 61,000 sq km) passed under long-term Israeli occupation. With East Jerusalem and the Golan already annexed, Israel swallowed some 77,000 square kilometres at a stroke - 'from the sea to the Jordan' at last, and the old promise 'from the Nile to the Euphrates' placed on the cabinet table for the first time. On Capitol Hill, evangelical lawmakers toast the fulfillment of biblical prophecy; in the streets of Tel Aviv, the cheers cannot drown a deeper unease - the nation has just swallowed millions of Arabs it can never digest."
 mew.20.a: "The Promised Land, made manifest."
 mew.21.t: "The Arab Fury"
 mew.21.d: "Israel's total victory has ignited the fury of the entire Muslim world. From Casablanca to Jakarta, millions pour into the streets burning Israeli and American flags; governments across the Arab world teeter under the 'shame of defeat' as protests morph into cries for change. Analysts warn the hatred born of this war will poison the Middle East for a generation - and the Palestinian children growing up in the rubble are its most radical seeds."
 mew.21.a: "This will never end. Never."
 mew.30.t: "Tehran's Bill Comes Due"
 mew.30.d: "For the first time since the war began, Jerusalem's security cabinet puts Iran itself on the table. Tehran has spent the whole war hiding behind proxies: Hezbollah rockets, Iraqi militias, Yemeni drones. Now the Arab coalition is broken, Washington's new administration has just won the Eurasian war and is eager to remake the Middle East, and the Gulf monarchies want the Islamic Republic gone more than anyone. A joint plan is laid out: Israel supplies the air force and intelligence, America the carriers and strategic backing, the Gulf the money and the bases. The objective is to destroy Iran's nuclear programme and the Revolutionary Guard outright - and to put the Pahlavis back on the Peacock Throne."
 mew.30.a: "This time, no proxies."
 mew.31.t: "American and Israeli Aircraft Strike Iran"
 mew.31.d: "Israeli jets cross Jordanian and Iraqi airspace and hammer the nuclear facilities at Natanz, Fordow and Isfahan through the night; the US Fifth Fleet sails out of Bahrain and Tomahawks streak over the Strait of Hormuz; the air bases of Saudi Arabia, the UAE, Kuwait, Qatar, Bahrain and Oman open to American aircraft all at once. Air-raid sirens wail over Tehran until dawn, and the Revolutionary Guard vows to 'set the whole region ablaze'. Within hours the Strait of Hormuz is declared closed, and oil prices jump to levels no one dares to quote."
 mew.31.a: "The Middle East's second decade begins."
 mew.32.t: "The Peacock Throne Returns to the Pahlavis"
 mew.32.d: "The war ends with the fall of Tehran. The last Revolutionary Guard remnants make a stand at Tabriz and Mashhad, then sign at the negotiating table. Reza Pahlavi II flies in from Paris to Mehrabad Airport while hundreds of thousands wave the Lion and Sun in the streets. From Azadi Square he announces the restoration of constitutional monarchy, the abolition of the Supreme Leader's office, and a peace treaty with Israel, America and the Gulf states. Forty-one years on, the Pahlavi dynasty has returned to where it began - only this time, the Sunni Arab world and Washington's carriers stand behind it."
 mew.32.a: "The Shah is back - but Iran is no longer the Iran he left."
 MEW_arab_military_alliance: "Arab Military Alliance"
 #Oil crisis event and spirit reworded for 2020 (overrides MD original)
 usa_economic_events.38.t: "The 2020 Energy Crisis"
 usa_economic_events.38.d: "The outbreak of the Sixth Middle East War has sent global oil markets into panic: the Suez Canal is closed, Gulf exports are choked, and prices have surged to unprecedented levels. American consumers watch the numbers on gas station signs climb daily, straining household budgets already battered by the pandemic. Transportation costs soar, airlines struggle, and fuel-dependent businesses bleed profits. Calls for energy independence grow louder once more - only this time, no one knows how long the crisis will last."
 usa_economic_events.38.a: "Gas prices are going through the roof!"
 USA_early_2000s_energy_crisis: "The Energy Crisis"
 USA_early_2000s_energy_crisis_desc: "The war in the Middle East has disrupted global oil markets; panic buying and speculation have driven up prices, causing shortages of gasoline and oil-based products and hammering the American economy."
 #Sixth Middle East War: Israeli wartime decisions (ported from Flames Rising ISR_arab_war)
 ISR_arab_war: "The Israeli-Arab War"
 ISR_arab_war_countdown: "Countdown to the War's End"
 ISR_arab_war_countdown_desc: "The General Staff warns that reserves and munitions cannot sustain a long war of attrition. If the fighting drags on past 700 days, Israel will be forced to accept a two-state solution."
 ISR_declare_victory: "Proclaim Greater Israel"
 ISR_declare_victory_desc: "The war is over. The security cabinet moves to absorb the occupied territories into Israel proper: the West Bank, Gaza, the Golan Heights and southern Lebanon are all brought under Israeli sovereignty."
 ISR_kill_syria: "Break Syria"
 ISR_kill_syria_desc: "Damascus's lines have collapsed. The IDF will force Syria out of the war, take the Daraa province, and establish a demilitarized security zone in southern Syria."
 ISR_kill_egypt: "Break Egypt"
 ISR_kill_egypt_desc: "Cairo's armored formations have been destroyed in Sinai. The IDF will force Egypt out of the war and place the Sinai Peninsula under Israeli control."
