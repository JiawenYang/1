 TFR_POLITICAL_LEADER_DESC_FRA_PIERRE_DE_VILLIERS:0 "A career French Army officer, Pierre de Villiers served as Chief of the Defence Staff from 2014 until his resignation in 2017 amid a dispute over military spending."
 TFR_POLITICAL_LEADER_DESC_FRA_BRUNO_LE_RAY:0 "A French Army general, Bruno Le Ray served as Military Governor of Paris from 2015 to 2018."
 TFR_POLITICAL_LEADER_DESC_ITA_CLAUDIO_GRAZIANO:0 "An Italian Army general, Claudio Graziano served as Chief of Defence Staff and later chaired the European Union Military Committee."
 TFR_POLITICAL_LEADER_DESC_RAJ_ANIL_CHAUHAN:0 "An Indian Army general, Anil Chauhan became Chief of Defence Staff in 2022 after commanding the Army's Eastern Command."
 TFR_POLITICAL_LEADER_DESC_SPR_TEODORO_E_LOPEZ_CALDERON:0 "A Spanish Navy admiral, Teodoro López Calderón served as Chief of Defence Staff beginning in 2021."
 TFR_POLITICAL_LEADER_DESC_TUR_HULUSI_AKAR:0 "A Turkish Army general, Hulusi Akar served as Chief of the General Staff and later as Minister of National Defence."
