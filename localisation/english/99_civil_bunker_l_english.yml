l_english:
 civil_bunker: "Civilian bunker"
 civil_bunker_plural: "Civilian bunkers"
 civil_bunker_desc: "A system of shelters for the civilian population to protect against bombing and other threats. Reduces bombing and nuclear damage."
 civil_bunker.1.t: "Private bomb shelters"
 civil_bunker.1.d: "The wealthier part of our population has begun constructing private bomb shelters."
 civil_bunker.1.a: "At least we will not have to build them ourselves."
 AB_prepare_civil_bunkers: "Reopen Civil Bunkers"
 AB_prepare_civil_bunkers_desc: "Many bomb shelters were privatized after the end of the Cold War. It is time to buy them back to protect our citizens."
