 # Central America chain (2026-11-07 ported)
 NIC.4.t: "Central America United"
 NIC.4.d: "The Central American wars have ended. Guatemala, Honduras, El Salvador, Nicaragua, Costa Rica and Panama are now administered from a single capital. Reconstruction begins as the new state consolidates the isthmus."
 NIC.4.a: "The isthmus is united"

 CEN_unification: "Central American Unification"
 CEN_unification_with_panama: "Unify Central America"
 CEN_unification_with_panama_desc: "With every rival government on the isthmus under our control, the last step is to absorb Panama and proclaim a single Central American state."

 CEN: "United Provinces of Central America"
 NIC_puppet: "Nicaraguan-Led Government"
