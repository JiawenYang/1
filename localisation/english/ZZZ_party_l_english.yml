 HUN.Conservative: "£HUN_emerging_reactionary Fidesz-Hungarian Civic Alliance"
 HUN.Autocracy: "£generic_Autocracy_small Jobbik"
 HUN.Autocracy_icon: "£generic_Autocracy_small"
 HUN.Autocracy_desc: "(Autocracy) - Jobbik, the Movement for a Better Hungary, is a radical nationalist party that combines anti-establishment rhetoric with a programme of national rebirth, strong state authority and open hostility to liberal democracy.\n\nJobbik built its base on anti-Roma and anti-Semitic agitation and on hostility to the EU and NATO; in recent years it has softened its image but retained a hard nationalist core. Its leverage lies in protest voters in the poorer north-east, a disciplined activist network and a willingness to cooperate with any force that challenges the mainstream parties."
 HUN.Neutral_conservatism: "£HUN_non_aligned_conservative Fidesz-Hungarian Civic Alliance"
 CZE.Conservative: "£generic_Conservative_small ANO 2011"
 CZE.Conservative_2015: "£generic_Conservative_small ANO 2011"
 CZE.Conservative_2015_icon: "£generic_Conservative_small"
 CZE.Conservative_2015_desc: "(Populism) - ANO 2011 (Czech: ANO 2011, Akce nespokojených občanů, ANO)\n\nANO 2011 is a populist movement built around the billionaire businessman Andrej Babiš, who promises to run the state like a firm. It campaigns against corruption and the established parties, and for competent management, lower costs for ordinary families, higher pensions and tighter control of migration.\n\nThe movement is centralised and loyal to its founder, and its flexible ideology lets it draw votes from left and right alike. It is sceptical of deeper EU integration and the euro. Its leverage lies in Babiš's business empire, his personal popularity and a strong base among older and small-town voters."
