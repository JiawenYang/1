l_english:
 zzz_party.1.t:0 "A New Government in Jakarta"
 zzz_party.1.d:0 "After the Great Asian War, Indonesia's political landscape was rewritten. With the acquiescence of the occupation authorities, a pro-Japanese nationalist right centred on the Suharto family returned to Jakarta, forming an authoritarian government and setting out to rebuild the post-war economy and the archipelago's order."
 zzz_party.1.a:0 "Recognize the new government"
 zzz_party.4.t:0 "Regime Change in Taipei"
 zzz_party.4.d:0 "After the political arrangement over Taiwan was settled, Taipei's ruling team was replaced and the island's political forces realigned. The new administration began integrating with the mainland's economic and shipping networks."
 zzz_party.4.a:0 "Recognize the new government"
 zzz_party.5.t:0 "A Red Government in Tokyo"
 zzz_party.5.d:0 "After Japan's defeat, the long rule of the Liberal Democratic Party collapsed. The Japanese Communist Party took power with the support of post-war elections and the trade unions, announcing the dissolution of the zaibatsu, nationalisation, and a rebuilt pacifist constitutional order."
 zzz_party.5.a:0 "Recognize the new government"
 zzz_party.90.t:0 "$COUNTRY$ Forms a Collaboration Government"
 zzz_party.90.d:0 "After its defeat in the war, the old regime of $COUNTRY$ collapsed. A newly formed collaboration government took over the administration with the support of the occupying authorities and announced a socialist course."
 zzz_party.90.a:0 "Recognize the collaboration government"
 zzz_party.91.t:0 "$COUNTRY$ Forms a Pro-Western Government"
 zzz_party.91.d:0 "After its defeat in the war, the old regime of $COUNTRY$ collapsed. A newly formed provisional government took over the administration with the support of the occupying authorities, announcing a pro-Western democratic system and the restoration of multi-party elections."
 zzz_party.91.a:0 "Recognize the provisional government"
 zzz_party.92.t:0 "$COUNTRY$ Forms a Pro-Japanese Nationalist Government"
 zzz_party.92.d:0 "After its defeat in the war, the old regime of $COUNTRY$ collapsed. With the backing of the occupation authorities, a pro-Japanese nationalist right took over the administration, proclaiming an authoritarian system and keeping close ties with Japan's economic and security networks."
 zzz_party.92.a:0 "Recognize the new government"
 zzz_party.93.t:0 "The Republic of Vietnam Is Proclaimed"
 zzz_party.93.d:0 "With Japan's victory in the Great Asian War, the old Vietnamese regime collapsed. Backed by the occupation authorities, anti-communist southern politicians led by Prime Minister Nguyen Huu Chanh proclaimed the Republic of Vietnam, unified the country under Saigon and restored the yellow flag with three red stripes."
 zzz_party.93.a:0 "Recognize the Republic of Vietnam"
 VIE_nationalist:0 "Republic of Vietnam"
 VIE_nationalist_DEF:0 "the Republic of Vietnam"
 VIE_nationalist_ADJ:0 "South Vietnamese"
