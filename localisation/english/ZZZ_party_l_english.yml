 SLO.Conservative: "£generic_Conservative_small Ordinary People and Independent Personalities (OĽaNO-NOVA)"
 SLO.Conservative_icon: "£generic_Conservative_small"
 SLO.Conservative_desc: "(Reactionary) - Ordinary People and Independent Personalities (Slovak: Obyčajní ľudia a nezávislé osobnosti, OĽaNO-NOVA)\n\nOĽaNO-NOVA is a populist conservative movement led by Igor Matovič, built around the fight against corruption and the privileges of the established parties. It presents itself as an ordinary citizens' movement, combining socially conservative positions on family and migration with generous family benefits and a pro-European foreign policy.\n\nThe movement is highly centralised around its founder and relies on protest voters disillusioned with Smer-SD and the traditional right. Its leverage lies in Matovič's public profile, its anti-corruption agenda and its appeal to conservative voters in smaller towns and rural areas."
 POL.conservatism_1_desc: "Conservative - Prawo i Sprawiedliwość (Law and Justice) is the dominant Polish national-conservative, Christian democratic party, combining economic interventionism and social welfare with a socially conservative outlook. It advocates for cautious cooperation with the European Union, and is staunchly anti-Russian."
 POL.Conservative_2017_desc: "Conservative - Prawo i Sprawiedliwość (Law and Justice) is the dominant Polish national-conservative, Christian democratic party, combining economic interventionism and social welfare with a socially conservative outlook. It advocates for cautious cooperation with the European Union, and is staunchly anti-Russian."
 CZE.Conservative_desc: "(Populism) - ANO 2011 (Czech: ANO 2011, Akce nespokojených občanů, ANO)\n\nANO 2011 is a populist movement built around the billionaire businessman Andrej Babiš, who promises to run the state like a firm. It campaigns against corruption and the established parties, and for competent management, lower costs for ordinary families, higher pensions and tighter control of migration.\n\nThe movement is centralised and loyal to its founder, and its flexible ideology lets it draw votes from left and right alike. It is sceptical of deeper EU integration and the euro. Its leverage lies in Babiš's business empire, his personal popularity and a strong base among older and small-town voters."
 HUN.Conservative_desc: "(Reactionary) - Fidesz-Hungarian Civic Alliance is the dominant national-conservative party of Hungary, led by Viktor Orbán. It combines a strong state, economic interventionism and generous family subsidies with a self-proclaimed illiberal democracy, a hard line on migration and sovereignty-first politics.\n\nFidesz is openly Eurosceptic and sceptical of Western liberal institutions, while cultivating pragmatic ties with Russia and other non-Western powers. Its leverage lies in its supermajority in parliament, its control of much of the media and the loyalty of a broad conservative electorate outside Budapest."
 HUN.Neutral_conservatism_desc: "(Reactionary) - Fidesz-Hungarian Civic Alliance is the dominant national-conservative party of Hungary, led by Viktor Orbán. It combines a strong state, economic interventionism and generous family subsidies with a self-proclaimed illiberal democracy, a hard line on migration and sovereignty-first politics.\n\nFidesz is openly Eurosceptic and sceptical of Western liberal institutions, while cultivating pragmatic ties with Russia and other non-Western powers. Its leverage lies in its supermajority in parliament, its control of much of the media and the loyalty of a broad conservative electorate outside Budapest."
