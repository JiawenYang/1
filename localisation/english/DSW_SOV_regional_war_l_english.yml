l_english:
 DSW_SOV_caucasus_conflict:0 "高加索冲突"
 DSW_SOV_caucasus_conflict_desc:0 "欧陆战争正沿黑海向高加索蔓延，当地长期冻结的争端再度爆发。既有盟约与安全承诺把各国卷入两大阵营。\n\n除波罗的海三国、波兰、罗马尼亚和匈牙利之外，所有实际站在北约一方的高加索国家也必须停止抵抗，才能结束战争。已经投降、灭亡或转为俄方附庸／盟友的目标视为解决。"
 DSW_SOV_caucasus_secured:0 "高加索北约参战国均已停止抵抗"
 dsw_sov.11.t:0 "乌克兰紧急动员"
 dsw_sov.11.d:0 "俄军越过边界后，乌克兰启动紧急动员。四十个国土防卫步兵师开始在仍由乌方完全控制的核心地区集结，每师编为八个步兵营，携带基本装备与人员，以填补漫长战线上的缺口。"
 dsw_sov.11.a:0 "填补战线，保卫城市。"
 dsw_sov.60.t:0 "高加索与德涅斯特河战线"
 dsw_sov.60.d:0 "欧陆战争使高加索和德涅斯特河沿岸的危机全面升级。黑海与里海之间的交通走廊成为新的争夺焦点，各国的安全承诺正变成正式参战。\n\n莫斯科要求一并解决高加索的敌对战线；只击败东欧六国，已经不足以确保战争结束。"
 DSW_SOV_united_victory_title:0 "俄罗斯欧陆凯旋"
 DSW_SOV_united_victory_quote:0 "“维利·勃兰特，赫尔穆特·施密特和夏尔·戴高乐的才华早已湮没在历史的长河，欧洲正在变得日益浅薄易破。”\n— 德米特里·梅德韦杰夫"
 DSW_SOV_united_victory_close:0 "俄罗斯万岁！"
 dsw_sov.53.d:0 "测试统俄路线俄罗斯欧陆凯旋超事件。本项仅展示画面与音乐，不结算任何战争。"
 DSW_SOV_authoritarian_democracy:0 "威权民主主义（亲俄重建政府）"
 DSW_SOV_authoritarian_democracy_desc:0 "在战后秩序下建立的亲俄威权民主政府。有限的政党竞争与强势行政并存，执政当局维持与莫斯科的安全合作，并以国家重建和恢复秩序为首要任务。"
 DSW_SOV_reconstruction_front:0 "国家重建阵线"
 DSW_SOV_reconstruction_front_long:0 "国家重建阵线（亲俄威权民主派）"
