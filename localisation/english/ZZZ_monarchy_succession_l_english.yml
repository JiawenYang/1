l_english:
 ZZZ_nm_charles_iii:0 "Charles III"
 ZZZ_nm_naruhito:0 "Naruhito"
 ZZZ_nm_frederik_x:0 "Frederik X"
 ZZZ_nm_lux_guillaume:0 "Guillaume"
 ZZZ_nm_may_abdullah:0 "Abdullah of Pahang"
 ZZZ_nm_may_ibrahim:0 "Ibrahim Iskandar"

 ZZZ_succession.10.t:0 "Queen Elizabeth II Dies"
 ZZZ_succession.10.d:0 "Buckingham Palace has announced the death of Queen Elizabeth II at Balmoral Castle. The Crown passes at once to Charles III. In [ROOT.GetName], the head of state changes with the Crown."
 ZZZ_succession.10.a:0 "The Queen is dead. Long live the King."

 ZZZ_succession.11.t:0 "Emperor Akihito Abdicates"
 ZZZ_succession.11.d:0 "Emperor Akihito has abdicated, the first abdication in two centuries. Naruhito accedes as the 126th Emperor of Japan."
 ZZZ_succession.11.a:0 "Long live His Majesty the Emperor."

 ZZZ_succession.12.t:0 "Queen Margrethe II Abdicates"
 ZZZ_succession.12.d:0 "After 52 years on the throne, Queen Margrethe II has abdicated. Crown Prince Frederik accedes as King Frederik X."
 ZZZ_succession.12.a:0 "Long live King Frederik X."

 ZZZ_succession.13.t:0 "Grand Duke Henri Abdicates"
 ZZZ_succession.13.d:0 "Grand Duke Henri has abdicated in favour of his son Guillaume, who becomes Grand Duke of Luxembourg."
 ZZZ_succession.13.a:0 "Vive le Grand-Duc!"

 ZZZ_succession.14.t:0 "Yang di-Pertuan Agong Abdicates"
 ZZZ_succession.14.d:0 "Sultan Muhammad V of Kelantan has abdicated as Yang di-Pertuan Agong. The Conference of Rulers has elected Sultan Abdullah of Pahang as the new King."
 ZZZ_succession.14.a:0 "Daulat Tuanku."

 ZZZ_succession.15.t:0 "New Yang di-Pertuan Agong Installed"
 ZZZ_succession.15.d:0 "Sultan Ibrahim Iskandar of Johor has been installed as the 17th Yang di-Pertuan Agong."
 ZZZ_succession.15.a:0 "Daulat Tuanku."

 ZZZ_succession.16.t:0 "Emir of Kuwait Dies"
 ZZZ_succession.16.d:0 "Emir Sabah Al-Ahmad Al-Jaber Al-Sabah has died at the age of 91. Crown Prince Nawaf has been sworn in as Emir."
 ZZZ_succession.16.a:0 "May God have mercy on him."

 ZZZ_succession.17.t:0 "Emir Nawaf Dies"
 ZZZ_succession.17.d:0 "Emir Nawaf Al-Ahmad Al-Jaber Al-Sabah has died. Sheikh Mishal has been sworn in as Emir."
 ZZZ_succession.17.a:0 "May God have mercy on him."

 ZZZ_succession.18.t:0 "Sultan Qaboos Dies"
 ZZZ_succession.18.d:0 "Sultan Qaboos bin Said has died after 50 years of rule. Haitham bin Tariq has been sworn in as Sultan."
 ZZZ_succession.18.a:0 "May God have mercy on him."

 ZZZ_succession.19.t:0 "Barbados Becomes a Republic"
 ZZZ_succession.19.d:0 "Barbados has removed Queen Elizabeth II as head of state and become a republic. The monarchy in Barbados is abolished."
 ZZZ_succession.19.a:0 "A new chapter begins."
