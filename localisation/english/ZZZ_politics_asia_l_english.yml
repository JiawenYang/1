 politicsjapan.11.t:0 "The 2017 Japanese General Election"
 politicsjapan.11.d:0 "The 48th general election returned the Liberal Democratic Party and Komeito to a comfortable majority. The Constitutional Democratic Party became the largest opposition force, while the Social Democrats and the Japanese Communist Party retained a small parliamentary presence.\n\nUnder the constitutional monarchy, the election decides the governing party and its support, not the occupant of the Chrysanthemum Throne."
 politicsjapan.11.a:0 "Form the new cabinet"

 politicsjapan.12.t:0 "The 2021 Japanese General Election"
 politicsjapan.12.d:0 "The 49th general election confirmed the Liberal Democratic Party–Komeito coalition, though with a reduced majority. The Constitutional Democratic Party gained ground, and the Japanese Communist Party and the Social Democrats held their handful of seats.\n\nThe Emperor remains outside the electoral contest; only the governing party and its popular support change."
 politicsjapan.12.a:0 "Accept the election result"

 politicsjapan.13.t:0 "The 2024 Japanese General Election"
 politicsjapan.13.d:0 "The 50th general election stripped the Liberal Democratic Party–Komeito alliance of its majority. The Constitutional Democratic Party surged, while the Japan Innovation Party, the Democratic Party for the People, Reiwa Shinsengumi and the Japanese Communist Party all increased their presence.\n\nThe LDP still governs as a minority cabinet. The imperial institution is untouched by the vote."
 politicsjapan.13.a:0 "Continue with a minority cabinet"

 politicsthailand.71.t:0 "The 2019 Thai General Election"
 politicsthailand.71.d:0 "The first national vote since the 2014 coup was held under the junta's constitutional framework. Pheu Thai won the largest single bloc, Palang Pracharath followed, and Future Forward made a strong debut. With the Senate appointed by the junta, Prayut Chan-o-cha assembled a coalition and returned as prime minister.\n\nThe monarchy stands apart from the ballot; only the governing party and its support are decided here."
 politicsthailand.71.a:0 "Confirm the coalition government"

 politicsthailand.72.t:0 "The 2023 Thai General Election"
 politicsthailand.72.d:0 "Move Forward won the most seats on a reformist platform, with Pheu Thai close behind. The Senate's resistance blocked a Move Forward-led government, so Pheu Thai formed the coalition and Srettha Thavisin became prime minister.\n\nThe result changes the ruling party and party support, not the king."
 politicsthailand.72.a:0 "Form the Pheu Thai-led coalition"
