l_english:
 #COVID-19 events and dependencies ported from The Fire Rises
 prc.30.t: "Coronavirus Spreads to Neighboring States"
 prc.30.d: "The coronavirus has spread from Wuhan to neighbouring states and provinces. Hospitals across the region are reporting suspected cases, and local governments are rushing to set up quarantine checkpoints, yet the movement of people during the Spring Festival travel rush makes contact tracing extremely difficult."
 prc.30.o1: "We cannot let panic spread faster than the virus."
 thailand.1.t: "First COVID Cases Appear in Thailand"
 thailand.1.d: "Thailand's Ministry of Public Health has confirmed the first case of the novel coronavirus outside China: a 61-year-old Chinese tourist from Wuhan who was admitted to a hospital in Bangkok after developing a fever. Health officials are monitoring her contacts and screening passengers arriving from China at Suvarnabhumi Airport."
 thailand.1.a: "Unsettling"
 iran.4.t: "First COVID-19 Cases"
 iran.4.d: "Hospitals in Tehran are reporting an increase in patients suffering from severe pneumonia. Most patients are above the age 40 with a few in their late 30s."
 iran.4.a: "We must be prepared"
 iran.11.t: "COVID Unemployment Protests"
 iran.11.d: "With the pandemic paralysing businesses and driving unemployment higher, workers and shopkeepers in Tehran and other major cities have taken to the streets. The demonstrations are small so far, but the mood is grim: people are demanding relief payments and a government plan to save their livelihoods."
 iran.11.a: "This must not spiral out of control"
 HUN_Corona_Virus: "Corona Virus"
 HUN_Overflowing_Hospitals: "Overflowing Hospitals"
 Hungary.13.t: "COVID-19 Outbreak in Budapest"
 Hungary.13.d: "The first coronavirus cases have been confirmed in Budapest. The government is urging citizens to observe hygiene measures while hospitals prepare isolation wards for the coming weeks."
 Hungary.13.a: "Damn it!"
 Hungary.14.t: "Hospital Bed Shortage"
 Hungary.14.d: "In a bleak report from the frontlines of COVID, doctors across Hungary are diagnosing patients without realizing that their facility has long ran out of spare beds. With reports of Cancer patients are being sent home to die while patients with COVID take their beds, Hungary waits for a response from the government."
 Hungary.14.a: "Well... Make more beds!"
 saudi.1.t: "Salman Admitted to Hospital"
 saudi.1.d: "Early this morning the King was visited by his personal doctor due to sudden breathing trouble and back pains. According to him the breathing problems had started several weeks prior and have gotten worse since. It didn't take long for the doctor to determine he was infected with COVID-19. Information about this is being closely monitored and will be delivered to the public at a later date."
 saudi.1.a: "Pray for the King"
 syria.15.t: "COVID Cases Drop?"
 syria.15.d: "Hospitals are no longer reporting mass cases of COVID-19. It seems that the virus has stopped it's spread. For now..."
 syria.15.a: "The worst has ended."
 monitor_outbreak_PER: "Monitor COVID-19 Outbreak"
 PER_coronavirus_category: "COVID-19 Outbreak"
 PER_coronavirus_category_desc: "The coronavirus outbreak is spreading across Iran. We must monitor the situation and allocate funds to contain it before our hospitals are overwhelmed."
