#Saudi Arabia localisation



#Oil Deal Fails (saudi.12)
saudi.12.t: "Oil Deal Fails"
saudi.12.d: "Riyadh's desperate attempt to hammer out a production deal with Moscow and the capitals of the Six ended in humiliating collapse. The Russians walked out of the room laughing; the Gulf monarchies, trembling before Israeli armor, refused to defy Washington. With the OPEC+ mechanism shattered and the Strait of Hormuz under threat, the global oil market is about to go into convulsions that will make 1973 look like a picnic."
saudi.12.a: "Flood the market. Let them drown."
