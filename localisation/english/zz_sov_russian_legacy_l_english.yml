l_english:
 sov_russian_legacy_army:0 "Legacy of Old Russian Army Reforms"
 sov_russian_legacy_army_desc:0 "Remnants of a massive mobilization system and centralized command — abundant heavy industry but poor military efficiency, high attrition, fragile supply, sluggish command chain."
 sov_russian_legacy_navy:0 "Legacy of Old Russian Army Reforms"
 sov_russian_legacy_navy_desc:0 "Dilapidated port infrastructure alongside an aging submarine fleet; slow repairs but the tradition of underwater commerce raiding endures."
 sov_russian_legacy_air:0 "Legacy of Old Russian Army Reforms"
 sov_russian_legacy_air_desc:0 "Obsolete training pipelines and scarce ace pilots, but institutionalized knowledge preservation limits experience loss after casualties."

 sov_rf_air_academy:0 "Aerospace Forces Academy System"
 sov_rf_air_academy_desc:0 "An academy network anchored by the Zhukovsky Air Force Engineering Academy in Moscow, feeding technical officers into long-range aviation and air defence branches. Intake is limited, but the pipeline of trained specialists is steady enough to sustain a modern air arm.\n\n§YEffects:§! Air training experience +10%, ace generation chance +5%, air command experience gain +5%."
