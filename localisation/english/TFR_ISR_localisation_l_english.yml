l_english:
 #The Fire Rises Israel/Palestine event chain (ported)
 isrwar.1.t: "Trump Peace Plan Proposal"
 isrwar.1.d: "Washington unveils the so-called Deal of the Century: Jerusalem is recognised as Israel's capital and Israeli sovereignty over the West Bank settlements is endorsed. Tel Aviv must choose between pushing the settlements forward and accepting the economic package."
 isrwar.1.a: "We shall move into the West Bank"
 isrwar.1.b: "An Israeli Marshall Plan!"
 isrwar.2.t: "Lehava Marches"
 isrwar.2.d: "The far-right Lehava movement marches through the Old City of Jerusalem, chanting for a one-state solution and clashing with Arab residents. The police struggle to keep order."
 isrwar.2.a: "They are getting in the way of peace!"
 isrwar.2.b: "We need a One State Solution!"
 isrwar.3.t: "Netanyahu Declares National Emergency"
 isrwar.3.d: "With the unity government collapsing and street violence spreading, the Prime Minister declares a national emergency, hoping a hard line will hold his right-wing base together."
 isrwar.3.a: "Yes, Netanyahu!"
 isrwar.4.t: "Unity Government Proclaimed"
 isrwar.4.d: "Likud and Blue and White sign a rotation agreement and form an emergency unity government, promising to handle the pandemic and the security crisis together."
 isrwar.4.a: "Yippee!"
 isrwar.5.t: "Unity Government Collapses"
 isrwar.5.d: "A budget dispute and a fight over judicial appointments bring the government down. The Knesset dissolves and Israel heads to its fourth election in two years."
 isrwar.5.a: "Shit"
 isrwar.6.t: "Operation Fallen Goliath"
 isrwar.6.d: "The General Staff approves a regional campaign: degrade Iran's military presence in Syria and Iraq, strike cross-border terrorist networks, and secure the northern border."
 isrwar.6.a: "We will never be exterminated..."
 isrwar.7.t: "Palestinian Government Protests the Action"
 isrwar.7.d: "Demonstrations erupt in Ramallah and Bethlehem. The Palestinian Authority condemns Israel's unilateral move but can barely control the streets."
 isrwar.7.a: "Don't they always?"
 isrwar.8.t: "Palestinian Government Calls for Volunteers"
 isrwar.8.d: "Factions such as the al-Aqsa Martyrs' Brigades openly recruit in the refugee camps. Rifles and homemade explosives begin to circulate in the West Bank."
 isrwar.8.a: "Worrying..."
 isrwar.9.t: "Hikmat Tamimi Killed"
 isrwar.9.d: "The prominent Palestinian activist Hikmat Tamimi is killed in the clashes. Within two hours the news reaches the whole Arab world, and everyone waits for the reprisal."
 isrwar.9.a: "Keep an eye on the Situation"
 isrwar.10.t: "New Israeli President Inaugurated"
 isrwar.10.d: "The Knesset elects Herzog as President. He calls for healing the country's divisions, but the right-wing press calls him a weak choice."
 isrwar.10.a: "Congrats President Herzog"
 isrwar.11.t: "Hamas Mobilizes"
 isrwar.11.d: "Hamas announces general mobilisation, takes over security in Gaza, cancels elections and masses fighters along the border."
 isrwar.11.a: "Shit is hitting the fan..."
 isrwar.12.t: "4th Intifada Declared"
 isrwar.12.d: "The Palestinian factions declare the Fourth Intifada. Fighters open fire on Israeli positions and southern Israel enters air-defence alert."
 isrwar.12.a: "Oh fuck"
 isrwar.13.t: "Israeli Total Mobilisation"
 isrwar.13.d: "Reserve call-up orders are issued and armoured units move towards Gaza and the northern border."
 isrwar.13.a: "Mobilise everything"
 isrwar.15.t: "Arab-Israeli War: The Two-State Solution"
 isrwar.15.d: "After months of bloodshed, Israel accepts the two-state solution: the West Bank and Gaza are placed under Palestinian administration in exchange for a ceasefire and regional recognition."
 isrwar.15.a: "This is the only way out"
