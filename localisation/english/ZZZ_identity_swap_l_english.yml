l_english:
 zzz_identity.1.t:0 "A Membership Signed Under a New Flag"
 zzz_identity.1.d:0 "In the post-war settlement of [ROOT.GetName], the newly formed collaboration government kept none of its old alliance identity. At the signing ceremony the foreign minister announced that the country's military alliances and economic agreements would be re-registered according to the new regional order: old names struck out, new names written in. The official line is the end of isolation and a return to regional cooperation; what the neighbours see is the same set of ports and the same set of bases, with different people signing the papers."
 zzz_identity.1.a:0 "The new register carries no old names."
 zzz_identity.2.t:0 "The Old Name Comes Back"
 zzz_identity.2.d:0 "The collaboration government is over, and [ROOT.GetName] holds its own diplomatic papers again. The first act of the new cabinet is to restore, one by one, the treaties signed before the war: military alliances, tariff arrangements, settlement currencies, all back in their original places. Nobody explains why these documents deserve more respect than the borders of two years ago, but the flags over the ports and bases have indeed been changed back."
 zzz_identity.2.a:0 "The treaties return, clause by clause."
 zzz_identity.3.t:0 "One More Name on the List"
 zzz_identity.3.d:0 "Washington has written [ROOT.GetName] into the Major Non-NATO Ally list. This is not a treaty of alliance: no mutual defence clause, no garrison. What it buys is a priority queue for arms sales, a seat at joint exercises, and a cheaper procurement channel. The State Department calls it deepening the partnership; the list itself has never been open to more than a handful of countries."
 zzz_identity.3.a:0 "The bar for arms and exercises drops."
 zzz_identity.4.t:0 "The Name Is Struck Out"
 zzz_identity.4.d:0 "Washington has updated the list, and [ROOT.GetName] is no longer on it. No note, no explanation, only a technical revision record: priority arms sales withdrawn, the joint exercise seat reclaimed, the technology-sharing group closed. The country finds it has lost no treaty at all — because it never had one."
 zzz_identity.4.a:0 "The privileges are quietly withdrawn."
