l_english:
 ###########COMPANIES###########
 #Saudies
 #Companies
 SAU_Saudi_Aramco: "§0Saudi Aramco§!"
 SAU_Saudi_Aramco_desc: "Saudi Aramco is the national oil company of Saudi Arabia, one of the world's largest integrated energy and chemical companies, and currently holds the world's largest proven oil reserves. Headquartered in Dhahran, the company owns the world's largest onshore oil field, Ghawar, and the largest offshore oil field, Safaniya."
 #Taiwan
 #Companies
 TAI_TSMC_company: "§0TSMC§!"
 TAI_TSMC_company_desc: "Taiwan Semiconductor Manufacturing Company (TSMC) is a Taiwanese high-tech multinational corporation specializing in semiconductor chip manufacturing. Headquartered in the Hsinchu Science Park, Taiwan, it is among the world's top ten companies and the world's leading semiconductor chip manufacturer. Its main businesses cover chip manufacturing, packaging, testing, and technical services. Leveraging its advanced process technology and continuous innovation, TSMC enjoys a prestigious reputation in the international market, holding the world's largest market share in chip manufacturing. It is a crucial pillar of the global high-tech industry and supplies advanced, high-performance chips to renowned companies such as Apple, MediaTek, Google, Nvidia, AMD, and OpenAI. TSMC also plays a key role in the development of cutting-edge technology industries such as artificial intelligence and autonomous driving."
 TAI_Foxconn_company: "§0Foxconn Technology§!"
 TAI_Foxconn_company_desc: "Hon Hai Precision Industry Co., Ltd. is a multinational conglomerate originating from Taiwan, founded in 1974 and using Foxconn as its trademark. It focuses on OEM services for electronic products, researching and manufacturing precision electrical components, housings, barebone systems, system assembly, optical communication components, LCD displays, and other upstream and downstream products and services in the 3C (computer, communication, and consumer electronics) industry."
 TAI_Formosa_company: "§0Formosa Plastic Group§!"
 TAI_Formosa_company_desc: "Formosa Plastics Group is one of Taiwan's largest conglomerates, originating from Formosa Plastics Industrial Co., Ltd., founded in 1954. It was renamed Taiwan Plastics Industrial Co., Ltd. (abbreviated as “Formosa”) in 1957 and has since expanded its business empire. Currently, its businesses span plastics, oil refining, petrochemicals, textiles, electronics, energy, transportation, heavy industry, biotechnology, medical, and education. After more than sixty years of development, Formosa Plastics now owns over one hundred affiliated companies, including Formosa Plastics, Nan Ya Plastics, Formosa Chemicals & Fibre, and Formosa Petrochemical, with factories in Taiwan, the United States, mainland China, Vietnam, the Philippines, and Indonesia. Furthermore, it owns a large number of educational and medical institutions, making it one of Taiwan's largest private enterprises."
 #France
 #Companies
 FRA_LVMH_company: "§0LVMH§!"
 FRA_LVMH_company_desc: "Moët Hennessy Louis Vuitton (LVMH) is the world's largest multinational luxury goods conglomerate, consistently ranking among Fortune magazine's Global 500 companies. Headquartered in Paris, France, the company was formed in 1987 through the merger of the fashion brand Louis Vuitton and Moët Hennessy, which itself was acquired in 1971 by champagne maker Moët & Chandon and cognac maker Hennessy. The group controls approximately 60 subsidiaries, each managing a small number of highly prestigious brands. These subsidiaries typically operate independently."
 FRA_LOreal_company: "§0L'Oréal§!"
 FRA_LOreal_company_desc: "L'Oréal is a skincare and cosmetics company headquartered in Paris, France. Founded in 1909, it is the world's largest cosmetics group and a Fortune Global 500 company. L'Oréal operates in more than 150 countries and regions, with 150 subsidiaries, 42 factories, over 100 distributors, and 88,000 employees worldwide."
 FRA_TotalEnergies_company: "§0TotalEnergies§!"
 FRA_TotalEnergies_company_desc: "TotalEnergies is a French oil company, one of the world's six largest oil companies and one of Europe's largest companies by market capitalization. Its operations cover the entire oil and gas value chain, from crude oil and gas exploration and development to power generation, transportation, refining, petroleum product sales, and international crude oil and product trading. TotalEnergies is also a large-scale chemical producer. The company is headquartered in the Courbet-La Défense district near Paris, France."
 FRA_Schneider_Electric_company: "§0Schneider Electric§!"
 FRA_Schneider_Electric_company_desc: "Schneider Electric, a French multinational corporation founded in 1836, is one of the world's largest energy management companies and providers of optimization solutions. Its main products include circuit breakers, sensors, and controllers, providing comprehensive solutions for energy facilities, industries, data centers and networks, and buildings worldwide. It holds leading positions globally in the energy, infrastructure, industrial process control, building automation, and data center and network markets. Since its inception, Schneider has been a pioneer in French industry and was one of the three major arms manufacturers in Europe at the end of the 19th century. In 2008, Schneider Electric's global sales reached €18.3 billion. Schneider Electric's mission is to enable everyone to make better use of energy and resources, building bridges to progress and sustainability for all."
 FRA_Vinci_SA_company: "§0Vinci S.A.§!"
 FRA_Vinci_SA_company_desc: "Vinci is a French construction company headquartered in Rueil-Malmaison, a suburb of Paris. In addition to construction, it also operates several airports."
 #Turkey
 #Companies
 TUR_Koc_Holding_company: "§0Koç Holding§!"
 TUR_Koc_Holding_company_desc: "Koc Holding S.A. is Türkiye's largest conglomerate. Headquartered in Istanbul, it is owned by the prominent Koc family."
 #Germany
 #Companies
 GER_SAP_company: "§0SAP§!"
 GER_SAP_company_desc: "SAP is a German software company headquartered in Waaldorf, Baden-Württemberg, Germany. It specializes in enterprise resource management (ERP) software and has offices in 130 countries, serving over 335,000 customers in 190 countries. Its stock is a component of the Stoxx Europe 50 stock market index."
 GER_Volkswagen_company: "§0Volkswagen§!"
 GER_Volkswagen_company_desc: "Volkswagen is an automobile manufacturing company headquartered in Wolfsburg, Germany. It is the core company and founding brand of the Volkswagen Group, as well as the group's best-selling brand and the world's largest automaker. In German, Volks means “people” and Wagen means “car”, so its full name means “people's car”."
 GER_Siemens_company: "§0Siemens AG§!"
 GER_Siemens_company_desc: "Siemens AG is a German multinational corporation, a global pioneer in electrical and electronic products, and active in the energy, healthcare, industrial, infrastructure, and urban sectors. Founded in 1847 by Werner von Siemens, Siemens is headquartered in Munich and Berlin, Germany, and is listed on the Frankfurt Stock Exchange and the New York Stock Exchange."
 GER_BMW_company: "§0BMW§!"
 GER_BMW_company_desc: "Bavarian Motor Works GmbH is a German multinational manufacturer of luxury cars, motorcycles and engines, headquartered in Munich, Bavaria, Germany."
 GER_Deutsche_Telekom_company: "§0Deutsche Telekom AG§!"
 GER_Deutsche_Telekom_company_desc: "Deutsche Telekom AG, commonly known as Deutsche Telekom, is headquartered in Bonn and is the largest telecommunications company in Europe by revenue. Deutsche Telekom provides fixed-line (VDSL, DSL, and FTTH) and mobile (5G, 4G, 3G, and 2G) network access to individuals, businesses, and distributors, as well as other IT services."
 GER_MercedesBenz_company: "§0Mercedes-Benz AG§!"
 GER_MercedesBenz_company_desc: "Mercedes-Benz Group is an automotive company headquartered in Stuttgart, Germany. Based on sales volume, Mercedes-Benz is one of the world's top ten automakers, the largest manufacturer of commercial vehicles, and the second largest truck manufacturer. Mercedes-Benz is also renowned for producing luxury cars such as the Mercedes-Benz."
 GER_Landesbank: "§0Landesbank Baden-Württemberg§!"
 GER_Landesbank_desc: "Baden-Württemberg Bank (LBBW), established in January 1999 and headquartered in Stuttgart, Germany, is the central institution of the Baden-Württemberg Savings Bank. The bank manages total assets of approximately €333 billion. LBBW's business encompasses retail banking, wholesale banking, and savings banking operations."
 GER_Deutsche_Bahn: "§0Deutsche Bahn§!"
 GER_Deutsche_Bahn_desc: "Deutsche Bahn AG is a German state-owned transport company headquartered in Berlin. It was founded in Frankfurt in 1994 through the merger of the former Deutsche Bundesbank and Deutsche Bahn. The company relocated back to Berlin in 2000, settling in a newly built railway tower next to Potsdamer Platz. The group's development and some other central departments remain in Frankfurt. Currently, it is the world's second-largest transport company after Deutsche Post, and the largest rail operator and railway infrastructure provider in Europe."
 GER_Lufthansa: "§0Lufthansa§!"
 GER_Lufthansa_desc: "Lufthansa is Germany's national airline and a founding member of Star Alliance. It is the largest airline in Europe by passenger volume and fleet size, and the fourth largest in the world by passenger capacity. Furthermore, Lufthansa, along with British Airways, is one of only two airlines in Europe still operating Airbus A380 aircraft. The German word “Luft” means “air”, while “Hansa” represents the Hanseatic League, a powerful commercial alliance in northern Germany dating from the 13th to 15th centuries."
 #England
 #Companies 
 ENG_AstraZeneca_company: "§0AstraZeneca§!"
 ENG_AstraZeneca_company_desc: "AstraZeneca is a large Anglo-Swedish joint venture biopharmaceutical company formed on April 6, 1999, through the merger of Sweden's AstraZeneca and the UK's Zeneca. Zeneca itself was spun off from Imperial Chemical Industries in 1993. AstraZeneca develops, manufactures, and markets drugs and vaccines for the treatment of digestive, cardiovascular, oncological, central nervous system, and respiratory diseases, as well as for anesthesia. The company headquarters is located in the Cambridge Biomedical Park in Cambridge."
 ENG_Shell_company: "§0Shell plc§!"
 ENG_Shell_company_desc: "Shell is the world's second-largest oil company, registered in the UK and headquartered in The Hague, Netherlands. It was formed by the merger of Royal Dutch Petroleum and the British company Shell. Royal Dutch Petroleum was founded in 1890 with a special mandate from the Dutch monarch. To compete with Standard Oil of the United States, then the largest oil company, Royal Dutch Petroleum merged with Shell Transport & Trading Ltd of the United Kingdom in 1907 to become the Shell we know today. Shell is one of the world's oil giants and remains a major player in the oil, energy, chemicals, and solar energy sectors. Shell has five core businesses: exploration and production, natural gas and electricity, coal gas, chemicals, and renewable energy. Shell has subsidiaries or operations in more than 140 countries and territories worldwide."
 ENG_Linde_company: "§0The Linde Group§!"
 ENG_Linde_company_desc: "Linde Group is a chemical industrial group located in Munich, Germany. Founded in 1879 by Carl von Linde, it is the world's largest industrial gas group by market share. It is listed on both the Deutsche Börse and the Swiss Stock Exchange and is included in the DAX index. Linde has more than 600 subsidiaries in over 100 countries worldwide, with operations in industry, retail, trade, technology, research and development, and the public sector."
 ENG_Unilever_company: "§0Unilever plc§!"
 ENG_Unilever_company_desc: "Unilever is a British multinational consumer goods company formed by the merger of the Dutch company Unilever Margarine and the British company Lever Brothers. Headquartered in Rotterdam, Netherlands and London, England, its products include food, beverages, cleaning products, and personal care products. Based on 2012 revenue, it is the world's third-largest consumer goods company, after Procter & Gamble and Nestlé. Unilever is the world's largest producer of spreads, such as margarine. As one of the oldest multinational corporations, its products are sold in approximately 190 countries and regions."
 ENG_BP_company: "§0BP plc§!"
 ENG_BP_company_desc: "BP, formerly known as British Petroleum, is one of the world's six largest oil companies and one of the world's top ten privately held companies. Its predecessor was the Anglo-Persian Oil Company, founded in 1908, which was renamed British Petroleum in 1954. The company integrates oil and gas exploration, refining, storage, sales, and retail operations."
 ENG_Diageo_company: "§0Diageo§!"
 ENG_Diageo_company_desc: "Diageo Public Company Limited is a British multinational alcoholic beverage company headquartered in London. Diageo is the world's largest producer of distilled spirits and a major producer of beer and wine."
 ENG_GlaxoSmithKline_company: "§0GlaxoSmithKline§!"
 ENG_GlaxoSmithKline_company_desc: "GlaxoSmithKline (GSK) is the world's third-largest pharmaceutical, biotechnology, and healthcare company, headquartered in London, UK. GSK is a research-based company covering anti-infectives, central nervous system, respiratory, gastrointestinal/metabolic, oncology, and vaccines. Its business also includes leading positions in oral hygiene products, nutritional beverages, and over-the-counter pharmaceuticals."
 ENG_HSBC: "§0HSBC§!"
 ENG_HSBC_desc: "HSBC Holdings plc is the holding company of the HSBC Group, headquartered in London, UK. It is the largest European bank. While HSBC was officially established in 1991, its subsidiary HSBC Bank has a history of over 160 years. HSBC is one of the world's largest banking and financial services organizations. With a deep-rooted international network spanning six major regions, HSBC has approximately 4,000 offices in 64 countries and territories across Europe, Hong Kong, Asia Pacific, the Middle East, North America, and Latin America, serving over 50 million customers."
 ENG_Rio_Tinto: "§0Rio Tinto§!"
 ENG_Rio_Tinto_desc: "Rio Tinto is a multinational mining and resources group that also operates businesses in coal, iron, copper, gold, diamonds, aluminum and energy."
 ENG_Barclays: "§0Barclays§!"
 ENG_Barclays_desc: "Barclays is the second largest bank in the UK, after HSBC. With over 300 years of history, Barclays is the oldest bank in Britain, dating back to 1690. Barclays was the first bank in the world to own an ATM and issued the UK's first credit card in 1966 and the UK's first debit card in 1987. Its headquarters are located at One Churchill Square, Canary Wharf, London."
 ENG_NatWest_Group: "§0NatWest Group§!"
 ENG_NatWest_Group_desc: "NatWest Group plc, formerly the Royal Bank of Scotland Group and RBS Group, is a British banking and insurance holding company headquartered in Edinburgh, Scotland. The group's operations span Europe, North America, and Asia. In the UK, NatWest Holdings' subsidiaries include the Royal Bank of Scotland, NatWest Bank, Ulster Bank, and Cousins Bank. RBS Group has the right to issue pound sterling banknotes in Scotland and Northern Ireland."
 ENG_BT_Group: "§0BT Group§!"
 ENG_BT_Group_desc: "BT Group plc, originally a British state-owned telecommunications utility managed by the General Post Office, separated from the Royal Mail on October 1, 1981, becoming an independent state-owned enterprise. Under the Conservative government of Margaret Thatcher, 50% of the public shares were sold to the market in 1984, making it a private company. The company has consistently been the largest operator of telecommunications infrastructure hardware in the UK. BT has branches or offices in 170 countries worldwide. Currently, overseas branches account for one-third of the group's total turnover."
 #China 
 #Companies
 CHI_Tencent_company: "§0Tencent§!"
 CHI_Tencent_company_desc: "Tencent Holdings Limited is a Chinese multinational corporation. Founded in November 1998 by five founders—Ma Huateng, Zhang Zhidong, Chen Yidan, Xu Chenye, and Zeng Liqing—it is headquartered in the Tencent Binhai Building in Nanshan District, Shenzhen. Tencent's business extends to various fields including social networking, finance, investment, information, tools, and platforms. Its subsidiaries specialize in various global internet-related services and products, entertainment, artificial intelligence, and technology."
 CHI_Alibaba_company: "§0Alibaba§!"
 CHI_Alibaba_company_desc: "Founded in 1999, Alibaba Group is a diversified conglomerate in mainland China primarily providing internet services. It currently operates with dual headquarters in Hangzhou, Shanghai, and Beijing. Alibaba's services encompass B2B trade, online retail, shopping search engines, third-party payment, and cloud computing services. Its subsidiaries include Alibaba B2B, Taobao, Tmall, Etao, Alibaba Cloud, Juhuasuan, AliExpress, Alibaba.com, Ele.me, Fliggy, Youku, Hema Fresh, Alibaba Pictures, Cainiao Network, UC Browser, DingTalk, Amap, Lazada, and Daraz."
 CHI_CCB_company: "§0China Construction Bank Corporation§!"
 CHI_CCB_company_desc: "China Construction Bank Corporation is one of the four major state-owned joint-stock commercial banks in mainland China and the second largest bank in mainland China. It is also one of the “Eight Banks and Five Insurance Companies” representing Hong Kong-listed Chinese financial stocks."
 CHI_ICBC_company: "§0Industrial and Commercial Bank of China§!"
 CHI_ICBC_company_desc: "Industrial and Commercial Bank of China Limited (ICBC) was established on January 1, 1984. It is one of the five major state-owned commercial banks in mainland China, headquartered in Beijing. It was established by separating the industrial and commercial credit and savings businesses of the People's Bank of China and is the largest bank in mainland China."
 CHI_Baidu_company: "§0Baidu§!"
 CHI_Baidu_company_desc: "Baidu is a multinational technology company based in Beijing, China, primarily engaged in internet search engines, artificial intelligence, and related technology services. It was founded on January 1, 2000, in Zhongguancun, Beijing, by Robin Li and Eric Xu. Baidu is one of China's earliest commercial search engine service providers, with its core product being “Baidu Search”, and has gradually developed businesses including online advertising, Q&A, cloud computing, autonomous driving, and artificial intelligence chips."
 CHI_Lenovo_company: "§0Lenovo§!"
 CHI_Lenovo_company_desc: "Lenovo Group Limited is a Chinese multinational technology company founded in 1984 with an investment of 200,000 RMB from the Institute of Computing Technology of the Chinese Academy of Sciences and 11 scientists. Its initial name was “New Technology Development Company of the Institute of Computing Technology, Chinese Academy of Sciences”. In 1989, it was renamed “Lenovo Computer Group Limited”."
 CHI_huawei: "§0Huawei§!"
 CHI_huawei_desc: "Huawei Technologies Co., Ltd. is a technology company founded in 1987 by Ren Zhengfei, headquartered in Shenzhen, Guangdong Province, People's Republic of China. Initially focused on manufacturing telephone exchanges, Huawei's current business primarily revolves around the research and development and manufacturing of communication equipment and consumer electronics. Huawei also has interests in software development, integrated circuit design and production, photovoltaics, and electric vehicles."
 CHI_xiaomi: "§0Xiaomi§!"
 CHI_xiaomi_desc: "Xiaomi Corporation was founded on April 6, 2010. It is a consumer electronics and smart manufacturing company with smartphones, smart hardware and IoT platforms as its core products."
 CHI_Petro_China: "§0PetroChina§!"
 CHI_Petro_China_desc: "China National Petroleum Corporation (CNPC) is a large-scale central enterprise in the People's Republic of China primarily engaged in oil and gas operations, engineering and technical services, petroleum engineering construction, petroleum equipment manufacturing, financial services, and new energy development. Headquartered in Beijing, China, it was originally established as China Petroleum Corporation in Shanghai on June 1, 1946. On July 27, 1998, CNPC was formed from the reorganization of the Ministry of Petroleum Industry of the People's Republic of China, based on the existing China National Petroleum Corporation (CNPC). It is also the largest producer and supplier of crude oil and natural gas in mainland China, and one of the largest producers and suppliers of refined petrochemical products."
 CHI_China_State_Construction_Engineering: "§0China State Construction Engineering§!"
 CHI_China_State_Construction_Engineering_desc: "China State Construction Engineering Corporation (CSCEC) is a large-scale central enterprise in the People's Republic of China primarily engaged in housing construction, international engineering outsourcing, real estate development, infrastructure construction, and design and surveying. Its main products are modern industrial buildings, and it is currently the world's largest investment and construction group and engineering contractor."
 CHI_China_Telecom: "§0China Telecom§!"
 CHI_China_Telecom_desc: "China Telecom Group Corporation is a large-scale central enterprise in the People's Republic of China primarily engaged in the telecommunications industry. China Telecom is a leading global full-service integrated intelligent information service operator, mainly providing fixed and mobile communication services, internet access services, information services, and other value-added telecommunications services in 31 provinces, municipalities, autonomous regions and Macao Special Administrative Region in mainland China."
 CHI_Agricultural_Bank: "§0Agricultural Bank of China§!"
 CHI_Agricultural_Bank_desc: "Agricultural Bank of China Limited is one of the five major state-owned commercial banks in the People's Republic of China, ranking third in assets among Chinese banks."
 CHI_CNOOC: "§0China National Offshore Oil Corporation§!"
 CHI_CNOOC_desc: "China National Offshore Oil Corporation (CNOOC) is a large-scale central enterprise in the People's Republic of China primarily engaged in offshore oil and gas development. It is the third largest state-owned oil company in China. Founded in 1982 and headquartered in Beijing, CNOOC is mainly responsible for cooperative offshore oil and gas resource development in Chinese waters. Its registered capital is RMB 50 billion. CNOOC holds a controlling stake in the listed company, China National Offshore Oil Corporation Limited (CNOOC Limited)."
 #Netherlands
 #Companies
 HOL_ABN_AMRO: "§0ABN AMRO§!"
 HOL_ABN_AMRO_desc: "ABN AMRO is one of the largest multinational financial institutions in the Netherlands, with branches worldwide. Its size and economic strength rank among the top in Europe. ABN AMRO's headquarters are located in Zuidas, Amsterdam. The headquarters building, at 105 meters tall, is the tallest building in the Zuidas area. The headquarters is also one of the main drivers of economic development in the Zuidas region."
 HOL_Airlines: "§0KLM Royal Dutch Airlines§!"
 HOL_Airlines_desc: "KLM Royal Dutch Airlines is the national airline of the Netherlands. Founded in 1919, it is now a subsidiary of the Air France-KLM Group and a member of SkyTeam."
 #USA
 #Companies
 USA_Apple_company: "§0Apple§!"
 USA_Apple_company_desc: "Apple Inc. is a multinational technology company originating from the United States, headquartered in Cupertino, California. It is considered one of the five major technology giants, alongside Amazon, Google, Microsoft, and Meta. Its current businesses include the design, research and development, and sales of mobile communications, consumer electronics, computer software, online services, and personal computers."
 USA_Ford: "§0Ford§!"
 USA_Ford_desc: "Ford Motor Company is an American multinational automobile manufacturing company headquartered in Dearborn, Michigan. Founded by Henry Ford, it was corporatized in 1903. At the height of the 20th century, Ford, General Motors, and Chrysler were considered the Big Three automakers in Detroit, leading the American automobile market. Ford maintained its position as the second-largest automaker in the US market for 75 consecutive years, second only to General Motors. Henry Ford adopted methods for mass production and managing large numbers of factory workers, ingeniously creating a new production sequence based on design, represented by the moving assembly line. This combination of high efficiency, high wages, and low prices represented a revolutionary reform and innovation for American manufacturing at the time, and this method was later known as Fordism, while its industrial philosophy was later termed Fordism by Antonio Gramsci."
 USA_Microsoft_company: "§0Microsoft Corporation§!"
 USA_Microsoft_company_desc: "Microsoft is a multinational technology company originating from the United States, founded in 1975 by Bill Gates and Paul Allen. Headquartered in Redmond, Washington, it is considered one of the five major technology giants alongside Amazon, Apple, Google, and Meta, and is also one of the four largest cloud service providers (CSPs) in North America. Its main business is the research, development, manufacturing, licensing, and provision of a wide range of computer software services. Its most famous and best-selling products are the Microsoft Windows operating system and Microsoft Office software. Other subsidiaries, such as the Xbox gaming business, are also very well-known. In its early days, the company primarily developed and sold BASIC interpreters for the Altair 8800. In the mid-1980s, it made significant progress in the home computer operating system market with MS-DOS. The later emergence of Windows allowed Microsoft to gradually dominate the home desktop computer operating system market. At the same time, Microsoft also began to expand its business, venturing into other industries and markets, creating the MSN website. In the computer hardware market, the Microsoft trademark and the Xbox game console, Zune, and MSN TV home entertainment devices appeared on the market in different years. Microsoft went public in 1986, and its ever-rising stock price has created four billionaires and 12,000 millionaires. As the company has grown stronger, it has also faced increasing criticism and accusations, a trend that has continued for decades. Practices such as refusal to deal and bundling have led to lawsuits alleging antitrust violations and unfair competition. The U.S. Department of Justice and the European Commission have both issued unfavorable rulings against Microsoft under antitrust law."
 USA_Alphabet_company: "§0Alphabet§!"
 USA_Alphabet_company_desc: "Alphabet Inc. is a holding company located in California, USA. It was incorporated on October 2, 2015, as a spin-off from Google, inheriting Google's publicly traded status and stock ticker symbol. Following the restructuring, Google became Alphabet Inc.'s largest subsidiary. Alphabet's subsidiaries include Calico, CapitalG, Chronicle, DeepMind, Google, Google Fiber, GV, Jigsaw, Loon LCC, Sidewalk Labs, Verily, Waymo, and X."
 USA_Amazon_company: "§0Amazon§!"
 USA_Amazon_company_desc: "Amazon is a multinational e-commerce company headquartered in Seattle, USA, and is currently one of the world's largest online retailers. Amazon operates retail websites in the United States, Canada, the United Kingdom, France, Germany, China, Singapore, Italy, Spain, Brazil, Japan, India, Mexico, Australia, and the Netherlands, and some of its products are also sold to other countries via international shipping. Branch websites are also expected to be opened in countries such as Poland and Sweden."
 USA_Berkshire_Hathaway_company: "§0Berkshire Hathaway§!"
 USA_Berkshire_Hathaway_company_desc: "Berkshire Hathaway is a multinational diversified holding company headquartered in Omaha, Nebraska, USA, managing numerous subsidiaries. Originally a textile company, it transformed into a holding company after Warren Buffett acquired control of Berkshire Hathaway in 1965. Buffett strategically allocated its retained earnings for investment, resulting in subsidiaries in real estate, casualty insurance, reinsurance, and specialty insurance. Over the years, the company has consistently generated over 20% annual value growth for its shareholders with its increasingly robust capital and minimal debt."
 USA_Nvidia_Corporation_company: "§0Nvidia Corporation§!"
 USA_Nvidia_Corporation_company_desc: "Founded in January 1993, NVIDIA is an American fabless semiconductor company primarily engaged in the design and sale of graphics processing units (GPUs). Headquartered in Santa Clara, California, in the heart of Silicon Valley, NVIDIA also designs graphics processors for game consoles, such as the first-generation Xbox, PlayStation 3, Nintendo Switch, and Nintendo Switch 2. NVIDIA's most famous product lines are the GeForce series designed for individuals and gamers, the Quadro series designed for professional CGI workstations, and the Tesla series designed for servers and high-performance computing. Although it originated from the PC graphics card business, NVIDIA also ventured into the design of the Tegra mobile chip, but the smartphone market saw little response."
 USA_Exxon_Mobil_Corporation_company: "§0Exxon Mobil Corporation§!"
 USA_Exxon_Mobil_Corporation_company_desc: "ExxonMobil is a multinational oil and gas company headquartered in Spring, Texas, USA. It was formed on November 30, 1999, through the merger of Exxon and Mobil. Besides its oil and gas business, the company also has interests in chemicals, producing plastics and synthetic rubber. Furthermore, as an oil giant, it is the world's largest privately held oil company and the largest oil company in the Western world. The company has long been criticized for environmental pollution and its denial of climate change; the Alaska Gulf oil spill was caused by the company. In addition, the company has been accused of human rights abuses and interference in US politics."
 USA_Walmart_company: "§0Walmart§!"
 USA_Walmart_company_desc: "Walmart is an American multinational retailer, the world's largest retailer and the world's largest corporation. Headquartered in Bentonville, Arkansas, it employs over two million people. Walmart is a family business, controlled by the Walton family, who own 48% of the company. Founded by Sam Walton in 1962, Walmart was incorporated on October 31, 1969. It went public on the New York Stock Exchange in 1972. Walmart is also the largest food retailer in the United States. The company has 8,500 stores in 15 countries worldwide. Walmart operates in all 50 U.S. states and Puerto Rico. It operates Walmex in Mexico, Asda in the UK, Seiyu (including Muji) in Japan, Massmart in several African countries, and has a joint venture with Bharti in India called “Best Price Modern Wholesale”. It wholly owns operations in Argentina, Brazil, and Canada. Walmart's investments outside the U.S. have yielded mixed results. Its operations and subsidiaries in Canada, the UK, Central America, South America, and China have been successful, but its operations in Germany, Japan, and South Korea have failed."
 USA_United_Health_company: "§0United Health Group§!"
 USA_United_Health_company_desc: "UnitedHealth Group is the world's second-largest health insurance and health information technology company by revenue, headquartered in Minneapolis, Minnesota, USA. UnitedHealth designs a full range of health insurance plans and services for a diverse population. UnitedHealth serves 90 million people in the United States and has approximately 300,000 employees in all 50 states and more than 130 countries."
 USA_Coke_company: "§0The Coca-Cola Company§!"
 USA_Coke_company_desc: "The Coca-Cola Company is a well-known multinational corporation, famous for the production, sale, and marketing of soft drinks, and also provides beverage concentrates, syrups, and alcoholic beverages. The Coca-Cola Company's most famous product is Coca-Cola, the world's first cola brand. Its headquarters are located in Atlanta, Georgia, USA. In 1886, American pharmacist John Pemberton invented the Coca-Cola formula. In 1889, American industrialist Asa Candler purchased the Coca-Cola formula and brand, and in 1892, the Coca-Cola Company was officially registered in Atlanta, Georgia. The company's stock is listed on the New York Stock Exchange and is part of the Dow Jones Industrial Average, the S&P 500, and the S&P 100 indices."
 USA_Tesla_company: "§0Tesla§!"
 USA_Tesla_company_desc: "Tesla is the largest electric vehicle and solar panel company in the United States."
 USA_PandG_company: "§0The Procter & Gamble Company§!"
 USA_PandG_company_desc: "Procter & Gamble (P&G) is a multinational consumer goods company originating from the United States, and one of the world's largest manufacturers of consumer goods. Headquartered in Cincinnati, Ohio, USA, it has nearly 140,000 employees worldwide. Its main products include cleaning agents, personal care products, and pet food."
 USA_JPMorgan: "§0JPMorgan Chase§!"
 USA_JPMorgan_desc: "JPMorgan Chase & Co. is an American financial institution headquartered in New York City. Its commercial banking division has 5,100 branches. JPMorgan Chase operates in more than 50 countries and its services include investment banking, securities trading and services, investment management, commercial financial services, and private banking."
 USA_CityGroup: "§0Citigroup§!"
 USA_CityGroup_desc: "Citigroup, headquartered in New York City, is one of the world's largest investment banks and financial institutions. It was formed in 1998 through the merger of Citigroup and Traveller Group, and subsequently went public. Therefore, the company's history can be traced back to the founding of the City Bank of New York (later Citigroup) in 1812; Bank Handlowy in 1870; Smith Barney in 1873; Banamex in 1884; and Salomon Brothers in 1910."
 USA_Marathon_Petroleum: "§0Marathon Petroleum§!"
 USA_Marathon_Petroleum_desc: "Marathon Petroleum is a U.S. oil and gas exploration and production company. Its main operations are located in the United States, Norway, Equatorial Guinea, Angola, and other locations. Its headquarters are located in Houston."
 USA_att: "§0AT&T§!"
 USA_att_desc: "AT&T is an American multinational corporation and the largest provider of fixed-line and mobile telephone services in the United States, as well as broadband and pay-TV services. It serves a total of 150 million subscribers, of whom 85.1 million are wireless. Southwestern Bell, founded in 1983, was one of the independent companies formed following an antitrust lawsuit between the U.S. government and AT&T. Currently, AT&T holds many of the assets divested in the 1983 ruling through acquisitions. The company headquarters is located in downtown Dallas, Texas."
 USA_ibm: "§0IBM§!"
 USA_ibm_desc: "IBM, or International Business Machines Corporation (IBM), is a multinational technology company originating from the United States, affectionately known as “The Big Blue”. It is the world's largest technology and business solutions company, employing over 310,000 people worldwide and operating in more than 160 countries and regions. Its headquarters are located in Armonk, New York. IBM's main clients are governments and enterprises, providing services and consulting. IBM manufactures and sells computer hardware and software and provides consulting services for system architecture and network hosting. Although primarily a commercial company, IBM has a long history of achievements in sciences such as materials science, physics, and chemistry, and has invented many products based on this academic research. Some of the more well-known IBM inventions include the hard drive, ATMs, Generic Product Code, SQL, relational database management systems, DRAM, and Watson."
 USA_ge: "§0General Electric§!"
 USA_ge_desc: "General Electric (GE) is a multinational conglomerate originating from the United States, with businesses spanning electronics, energy, transportation, aerospace, healthcare, and financial services. Headquartered in Boston and incorporated in New York State, GE operates in more than 100 countries and employs approximately 287,000 people."
 USA_Chevron_Corporation: "§0Chevron Corporation§!"
 USA_Chevron_Corporation_desc: "Chevron Corporation is one of the world's largest multinational energy companies, headquartered in San Ramon, California, and operating in more than 180 countries worldwide. Its operations span all aspects of the oil and gas industry: exploration, production, refining, marketing, transportation, petrochemicals, and power generation. It also manufactures gasoline-powered vehicles. Originally named Standard Oil of California, Chevron was formed in 1911 by the split of Standard Oil due to an antitrust case. Chevron is one of the world's six largest oil companies."
 USA_Bank_America: "§0Bank of America§!"
 USA_Bank_America_desc: "Bank of America is the second-largest commercial bank in the United States by assets, after JPMorgan Chase. It has approximately 5,600 branches and 16,200 ATMs in more than 150 countries worldwide. Its origins trace back to the Bank of Massachusetts in 1784, making it the second-oldest bank in the United States."
 USA_Home_Depot: "§0Home Depot§!"
 USA_Home_Depot_desc: "Home Depot is an American home improvement and building materials retailer headquartered in Vinings, Georgia, in the Atlanta metropolitan area. Home Depot employs more than 355,000 people and operates 2,164 large retail stores across the United States (including all 50 states, the District of Columbia, Puerto Rico, the Virgin Islands, and Guam), Canada (10 provinces), Mexico, and China."
 USA_Kroger: "§0Kroger§!"
 USA_Kroger_desc: "Kroger, Inc. is an American retail company founded in 1883 in Cincinnati, Ohio by Bernard Kroger. By revenue, it is the largest supermarket chain in the United States and the 23rd largest company in the country. Kroger is also the world's third-largest retailer and the third-largest employer in the United States."
 USA_Comcast: "§0Comcast§!"
 USA_Comcast_desc: "Comcast is a U.S.-based global communications conglomerate; through its Xfinity brand, it holds the number one revenue position in the global telecommunications and cable television markets. Comcast is also the second-largest pay-TV provider in the U.S., the largest cable television and home internet access provider, and the third-largest home telephone provider. Comcast operates in all 40 states and the District of Columbia. Comcast's headquarters are located in Philadelphia, Pennsylvania."
 USA_Oracle: "§0Oracle§!"
 USA_Oracle_desc: "Oracle Corporation is a global enterprise technology software company headquartered in Austin, Texas, USA. The current Chairman and CTO is founder Lawrence Ellison, and the CEO is Kelvin Ketchum. Its main business includes enterprise financial management database creation services, such as point-in-time sales intelligence systems, supply chain management, and human resource performance analysis."
 USA_AMD_idea: "§0AMD§!"
 USA_Adobe_idea: "§0Adobe§!"
 #Russia
 #Companies
 SOV_yukos: "§0Yukos§!"
 SOV_yukos_desc: "Yukos is Russia's largest and most successful company, producing 20% of Russia's oil output."
 SOV_sibneft: "§0SibNeft§!"
 SOV_sibneft_desc: ""
 SOV_rusal: "§0RUSAL§!"
 SOV_rusal_desc: "Rusal is the world's third-largest aluminum company and the world's third-largest producer of aluminum and alumina, accounting for 6% of global aluminum and alumina production, respectively."
 SOV_sberbank: "§0Sberbank§!"
 SOV_sberbank_desc: "Sberbank is a financial institution headquartered in Moscow, the capital of the Russian Federation. With 25 million private clients, 1.3 million commercial clients, and approximately 19,000 branches, Sberbank is a leading bank in both the private and commercial financial sectors in Russia and the largest commercial bank in Eastern Europe. Sberbank is a joint-stock bank, with the Central Bank of the Russian Federation holding 60.25% of the shares, and the remaining shares held by more than 273,000 institutional and individual investors."
 SOV_vtb: "§0VTB§!"
 SOV_vtb_desc: "VTB Bank is a leading global bank in Russia."
 SOV_gazprom: "§0Gazprom§!"
 SOV_gazprom_desc: "Gazpromnene is one of Russia's largest oil companies."
 SOV_rosneft: "§0Rosneft§!"
 SOV_rosneft_desc: "Rosneftegaz is a Russian integrated energy company headquartered in Moscow, specializing in exploration, extraction, production, refining, transportation, and shipping. The company is controlled by the Russian government through the Rosneftegaz holding company."
 SOV_nornickel: "§0Nornickel§!"
 SOV_nornickel_desc: "Norilsk Nickel is Russia's largest mining and metallurgical company, with its main production base in Norilsk near the Yenisei River. It also owns non-ferrous metal mines in Nikol, Zaporianny, and Monchegorsk on the Kola Peninsula, Halyavarta in western Finland, South Africa and Botswana, and Western Australia. It is the world's largest producer of nickel and palladium, and one of the world's top ten copper producers. It accounts for approximately 18% of global nickel production, 2.5% of copper production, nearly 50% of palladium production, and about 13% of platinum production."
 SOV_lukoil: "§0LUKOIL§!"
 SOV_lukoil_desc: "Lukoil is a Russian multinational energy company headquartered in Moscow, primarily responsible for oil and gas refining and petroleum product manufacturing. On November 25, 1991, three state-owned energy companies located in western Siberia—Langepass, Ulai, and Kogarin—merged and changed their name to Lukoil, with LUK representing the locations of the three companies. Lukoil is Russia's second-largest company after Gazprom and one of the world's largest crude oil producers."
 #Poland
 #Companies
 POL_Orlen: "§0Orlen§!"
 POL_Orlen_desc: "Polish state-owned oil company, PLN, is a well-known state-owned integrated energy group in Poland. It mainly provides services such as oil and gas exploration, extraction, sales, and transportation. In addition, PLN has a high reputation in offshore drilling, reservoir management and development, and high-grade petroleum coke improvement technology. Downstream, PLN owns many gas stations and well-known lubricant brands around the world."
 #Japan
 #Companies
 JAP_suzuki_companies: "§0Suzuki§!"
 JAP_suzuki_companies_desc: "Suzuki is a car and motorcycle manufacturer headquartered in Hamamatsu, Shizuoka Prefecture, Japan."
 JAP_toyota_companies: "§0Toyota§!"
 JAP_toyota_companies_desc: "Toyota Motor Corporation is a Japanese multinational automobile company. Toyota is also the parent company of Lexus, Daihatsu, Hino, and Century brands, and is the largest shareholder of Subaru with a 20% stake."
 #Spain
 #Companies
 SPR_Inditex_company: "§0Inditex§!"
 SPR_Inditex_company_desc: "IndiD Group is a large Spanish company and the world's second-largest fashion group. It owns over 100 companies, primarily engaged in the design, production, and sales of textiles."
 SPR_Telefonica_company: "§0Telefonica§!"
 SPR_Telefonica_company_desc: "Telefónica S.p.A. is a telecommunications company based in Spain. It is the world's fifth-largest fixed-line and mobile communications operator, primarily providing fixed-line and mobile communication services in Europe and Latin America. Its services include mobile voice, value-added services, mobile data and network, roaming, fixed wireless services, trunking, and paging services. It ranks fifth globally in total customer numbers."
 SPR_Banco_Santander_company: "§0Banco Santander§!"
 SPR_Banco_Santander_company_desc: "Santander Bank was founded in 1857 and is headquartered in Santander, Spain. Santander Bank employs nearly 200,000 people."
 SPR_ACS_company: "§0ACS§!"
 SPR_ACS_company_desc: "ACS Group is a Spanish multinational corporation primarily engaged in construction-related businesses, with some involvement in the telecommunications industry. It was formed in 1997 through the merger of OCP Construcciones, S.A. and Ginés Navarro Construcciones, S.A. Its headquarters are located in Madrid."
 SPR_Iberdrola_company: "§0Iberdrola§!"
 SPR_Iberdrola_company_desc: "Ibidora is a privately held Spanish multinational electrical company headquartered in Bilbao. Its subsidiaries include Scottish Electric, Ibidora USA, and Elektro in Brazil."
 SPR_Repsol_company: "§0Repsol§!"
 SPR_Repsol_company_desc: "Repsol is a Spanish multinational energy and petrochemical company headquartered in Madrid, with its main operations in Spain and Argentina."
 #South Korea
 #Companies
 KOR_KIA_company: "§0KIA Corporation§!"
 KOR_KIA_company_desc: "Kia Motors Corporation is South Korea's second-largest automaker, a Fortune Global 500 company, headquartered in Seoul, South Korea, and a member of the Hyundai Motor Group."
 KOR_LG_company: "§0LG§!"
 KOR_LG_company_desc: "LG Group is a large multinational conglomerate headquartered in Seoul, South Korea. Its main businesses encompass electronics and communications technology, home appliances, and chemicals. It owns 81 group companies, 130 overseas subsidiaries, and employs 213,000 people. LG Group was founded on January 5, 1947, initially named “Lucky Chemical Industry Co., Ltd.” (now LG Chem). On October 1, 1958, LG established “Goldstar Co., Ltd.” (now LG Electronics), subsequently known as “Lucky Group”. On January 1, 1982, “Lucky Group” was renamed “Lucky Goldstar Group” to encompass its expanding electronics division. In January 1995, LG Group officially adopted its current name, “LG”. The letters “LG” are the first letters of “Lucky” and “Goldstar” in the English name “Lucky Goldstar Group”. LG Group is the creator of many “firsts” in the history of Korean corporate development, including: establishing Korea's first chemical industrial company, “Laxy Chemical Industrial Co., Ltd.”, and launching the first cosmetics brand, “Laxy Snow Cream”; being the first to enter the plastics industry; establishing Korea's first electronics industrial company, “Goldstar Co., Ltd.”; producing Korea's first radio, refrigerator, television, washing machine, and other home appliances; being the first to recruit outstanding university graduates from the public; being the first among Korean chaebols to implement corporate transparency; being the first among Korean chaebols to use an English name; and being the first to adopt a holding company system."
 KOR_Samsung_company: "§0Samsung§!"
 KOR_Samsung_company_desc: "Samsung Group is a multinational conglomerate headquartered in Seoul, South Korea, with operations spanning a wide range of sectors including electronics, finance, insurance, biopharmaceuticals, construction, chemicals, and healthcare. Its subsidiaries include Samsung Electronics, Samsung Display, Samsung Electro-Mechanics, Samsung C&T, Samsung Heavy Industries, and Samsung Life Insurance, among others. At least three of these subsidiaries are listed in Fortune magazine's Global 500."
 KOR_SK_company: "§0SK§!"
 KOR_SK_company_desc: "SK Group is South Korea's third-largest conglomerate, headquartered in Seoul, with 186 subsidiaries and affiliates and over 110,000 employees worldwide. SK's main businesses are in the energy and petrochemical sectors, with its subsidiary SK Energy being South Korea's largest integrated energy and chemical company. Its Ulsan refinery has an annual crude oil processing capacity of 42 million tons, maintaining its position as the world's largest single-plant refinery for many years. SK also operates in the electronics and telecommunications sector; its subsidiary SK Telecom is South Korea's largest mobile communications operator, holding over 50% market share in South Korea and being one of the world's top ten cellular mobile operators. Its subsidiary SK Hynix is SK Group's main force in the semiconductor industry, holding the second-largest global market share in DRAM, second only to Samsung Electronics."
 KOR_Hyundai_company: "§0Hyundai Motor Group§!"
 KOR_Hyundai_company_desc: "Hyundai Motor Group, a South Korean conglomerate, is one of the world's largest automakers, headquartered in Seoul, South Korea. Like many South Korean conglomerates, Hyundai Motor Group is not a vertically controlled company with a holding company structure. Instead, it is a large conglomerate with a complex shareholding structure (such as cross-shareholdings) connecting its various subsidiaries. In practice, Hyundai Motor is the company that represents the entire group."
 KOR_Lotte_company: "§0Lotte Corporation§!"
 KOR_Lotte_company_desc: "Lotte Group is a large international conglomerate headquartered in Seoul, South Korea. Its businesses span various sectors including food, department stores, entertainment, construction, and chemicals. It is among the world's top 500 conglomerates and one of South Korea's top ten chaebols. Founded in 1948 by Shin Kyuk-ho, a South Korean founder, Lotte Group initially operated as a food manufacturer before expanding into South Korea, where it owns hotels and department stores. Lotte Group owns two professional baseball teams: the Lotte Giants in the Korean Professional Baseball League (KPL) and the Chiba Lotte Marines in the Japanese Professional Baseball League (JPB)."
 KOR_Doosan_company: "§0Doosan Corporation§!"
 KOR_Doosan_company_desc: "Doosan Group is a South Korean conglomerate headquartered in Seoul and a Fortune Global 500 company. Its history dates back to August 1, 1896, when its founder, Park Seung-jik, established the “Park Seung-jik Store”, making it over 120 years old. It is the only modern company still operating from the late Joseon Dynasty and the earliest family business in Korea to achieve three generations of succession. In 1995, Doosan Group was certified by the Korean Guinness World Records as the oldest company in South Korea."
 KOR_Hanjin_company: "§0Hanjin Transportation§!"
 KOR_Hanjin_company_desc: "Hanjin Group is an international logistics and transportation conglomerate headquartered in Seoul. Founded in 1945, it was once one of South Korea's largest maritime logistics companies and a Fortune Global 500 company. Hanjin once owned a container fleet spanning major ports worldwide. After its shipping business went bankrupt, it still maintains air routes and a logistics network. Hanjin Shipping, a subsidiary of Hanjin Group, was once the world's seventh-largest shipping group. Korean Air, acquired in 1969, is South Korea's largest airline."
 KOR_posco_company: "§0Posco§!"
 KOR_posco_company_desc: "POSCO is one of the world’s largest steel manufacturers and a Fortune Global 500 company, headquartered in Nam-gu, Pohang, North Gyeongsang Province, South Korea."
 #Italy
 #Companies
 ITA_Enel_company: "§0Enel§!"
 ITA_Enel_company_desc: "Eduardo, the Italian state-owned electricity company, is an energy company headquartered in Rome, Italy, primarily engaged in power generation, transmission, and natural gas distribution. Originally a public institution established in 1962, it was restructured into a corporation in 1992 and privatized in 1999 with the opening of the Italian electricity market. However, the Italian Ministry of Economy and Finance remains its major shareholder."
 ITA_Intesa_Sanpaolo_company: "§0Intesa Sanpaolo§!"
 ITA_Intesa_Sanpaolo_company_desc: "Intesa Sanpaolo is a new banking group formed on January 2, 2007, through the merger of Intesa Commerzbank and Banco Sanpaolo. The group is headquartered in Turin, with a subsidiary headquarters in Milan. In August 2006, Intesa Commerzbank and Banco Sanpaolo jointly announced the merger, which was implemented in December of the same year. The new Intesa Sanpaolo group is the second largest bank in Italy and the third largest in the Eurozone, with assets of €68.8 billion."
 ITA_Eni_company: "§0Eni§!"
 ITA_Eni_company_desc: "Eni, officially known as the National Hydrocarbon Company, is a state-owned holding company established by the Italian government. It specializes in petroleum products and is one of the world's seventh-largest oil groups, ranking eighth among the world's largest oil refining companies."
 ITA_UniCredit_company: "§0UniCredit§!"
 ITA_UniCredit_company_desc: "UniCredit is a Milan-based bank with operations in 19 countries and over 28 million customers, making it one of Europe's largest banking groups. UniCredit's core business is primarily located in affluent regions such as Italy, Austria, and southern Germany, with significant operations also in Central and Eastern Europe. With total assets of €910 billion, UniCredit is the largest banking group in the Eurozone, the third largest in Europe, and the sixth largest in the world. The UniCredit Group has substantial investment banking operations in Frankfurt and Munich."
 HUN_mol_group: "§0MOL Group§!"
 HUN_mol_group_desc: "MOL Plc. is a Hungarian multinational oil and gas company headquartered in Budapest, Hungary. Members of MOL Group include among others the Croatian and Slovak formerly state-owned oil and gas companies, INA and Slovnaft."
 POR_edp_company: "§0EDP§!"
 POR_edp_company_desc: "EDP is a Portuguese electric utilities company, headquartered in Lisbon founded in 1976 through the merger of 14 nationalised electricity companies."
 POR_jm_company: "§0Jerónimo Martins§!"
 POR_jm_company_desc: "Jerónimo Martins SGPS, SA (JM) is a Portuguese corporate group that operates in food distribution and specialised retail. It operates more than 6,500 stores in Portugal, Poland, Slovakia and Colombia."