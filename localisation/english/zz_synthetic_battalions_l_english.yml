 ZZ_neg_armor_heavy_1_desc: "The heavy combined-arms battalion's HQ, signals, logistics and medical element, about 160 personnel. Mounted on light vehicles and moving with the heavy companies, it is not committed to the assault and gives the battalion commander its command, supply and recovery backbone, improving organisation, morale and equipment reliability."
 ZZ_neg_armor_medium: "Medium Battalion Support Element"
 ZZ_neg_armor_medium_desc: "The medium combined-arms battalion's HQ, signals, logistics and medical element, about 140 personnel. Moving with the wheeled vehicle companies, it is not committed to the assault and handles command, supply and recovery, improving organisation, morale and equipment reliability."
