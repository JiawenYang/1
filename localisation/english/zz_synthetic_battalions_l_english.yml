 ZZ_neg_armor_medium_1_desc: "The medium combined-arms battalion's HQ, signals, logistics and medical element, about 140 personnel. Moving with the wheeled vehicle companies, it is not committed to the assault and handles command, supply and recovery, improving organisation, morale and equipment reliability."
