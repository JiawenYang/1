 ZZ_neg_armor_heli: "Air Assault Battalion Support Element"
 ZZ_neg_armor_heli_desc: "The air assault battalion's HQ, signals, logistics and medical element, about 100 personnel. Delivered by helicopter or light vehicle and kept out of the assault echelon, it provides command, supply and recovery support, improving organisation, morale and equipment reliability."
