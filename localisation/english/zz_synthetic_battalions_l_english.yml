 ZZ_neg_armor_amphibious_desc: "The amphibious combined-arms battalion's HQ, signals, logistics and medical element, about 130 personnel. Riding light amphibious vehicles ashore with the battalion but not in the first wave, it provides command, supply and recovery support, improving organisation, morale and equipment reliability."
