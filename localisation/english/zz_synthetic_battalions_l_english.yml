 ZZ_neg_armor_pzgren: "Panzergrenadier Battalion Support Element"
 ZZ_neg_armor_pzgren_desc: "The Panzergrenadier battalion's HQ, signals, logistics and medical element, about 130 personnel. Riding with the battalion in its IFVs but not committed to the assault, it provides command, supply and recovery support, improving organisation, morale and equipment reliability."
