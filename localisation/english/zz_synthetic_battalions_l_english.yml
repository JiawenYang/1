l_english:
 syn_heavy_bat: "Heavy Combined-Arms Battalion"
 syn_heavy_bat_desc: "A 740-strong combined-arms battalion fielding two tank companies (28 MBTs) and two mechanized infantry companies (30 IFVs), with organic anti-tank, air defence and command assets - the core of any modern heavy brigade."
 syn_medium_bat: "Medium Combined-Arms Battalion"
 syn_medium_bat_desc: "A 650-strong wheeled combined-arms battalion built on three infantry fighting vehicle companies (32 wheeled IFVs) plus a mobile gun platoon (8 assault guns), trading protection for strategic mobility."
 syn_light_bat: "Light Combined-Arms Battalion"
 syn_light_bat_desc: "A 600-strong light combined-arms battalion moving entirely on high-mobility utility vehicles (60), with four rifle companies and an organic 6-gun mortar platoon."
 syn_amphibious_bat: "Amphibious Combined-Arms Battalion"
 syn_amphibious_bat_desc: "A 600-strong amphibious combined-arms battalion riding 34 amphibious IFVs and 6 amphibious assault guns, trained to seize beachheads and cross water obstacles under fire."
 syn_heavy_bat_USA: "US Heavy Combined-Arms Battalion"
 syn_heavy_bat_USA_desc: "A 740-strong US combined-arms battalion (ABCT) fielding two tank companies (28 M1 MBTs) and two mechanized companies (29 M2 IFVs), with strong anti-tank and air-defence firepower and the highest organisation of any battalion."
 syn_medium_bat_USA: "US Stryker Battalion"
 syn_medium_bat_USA_desc: "A 680-strong wheeled US combined-arms battalion built on three mechanized companies (33 Stryker IFVs) with a mobile gun platoon, designed for rapid strategic airlift."
 syn_light_bat_USA: "US Light Infantry Battalion"
 syn_light_bat_USA_desc: "A 600-strong US light infantry battalion (IBCT) moving entirely on 41 high-mobility tactical vehicles, with four rifle companies and an anti-tank support element."
 syn_amphibious_bat_USA: "US Amphibious Combined-Arms Battalion"
 syn_amphibious_bat_USA_desc: "A 650-strong US Marine combined-arms battalion riding 32 amphibious IFVs and assault guns, able to storm a beachhead and cross water obstacles under fire."
 syn_heavy_bat_SOV: "Russian Heavy Combined-Arms Battalion"
 syn_heavy_bat_SOV_desc: "A 920-strong Russian battalion tactical group (BTG) with 31 MBTs, 35 IFVs and a reinforced self-propelled artillery battalion (12 2S19), heavy anti-tank firepower but lower organisation due to few contract soldiers."
 syn_medium_bat_SOV: "Russian Medium Combined-Arms Battalion"
 syn_medium_bat_SOV_desc: "A 700-strong Russian motor-rifle battalion with 35 wheeled IFVs and 8 self-propelled guns, balancing protection and mobility."
 syn_light_bat_SOV: "Russian Light Combined-Arms Battalion"
 syn_light_bat_SOV_desc: "A 600-strong Russian light motor-rifle battalion moving on 45 MT-LB and Tigr vehicles, with organic anti-tank and suppression firepower."
 syn_amphibious_bat_SOV: "Russian Amphibious Combined-Arms Battalion"
 syn_amphibious_bat_SOV_desc: "A 650-strong Russian naval infantry battalion riding 34 amphibious IFVs, skilled at forcing water obstacles and coastal assault."
 syn_heavy_bat_CHI: "Chinese Heavy Combined-Arms Battalion"
 syn_heavy_bat_CHI_desc: "A 750-strong Chinese heavy combined-arms battalion with two tank companies (28 ZTZ-99A) and two mechanized companies (30 ZBD-04A), balanced in composition with steady organisation."
 syn_medium_bat_CHI: "Chinese Medium Combined-Arms Battalion"
 syn_medium_bat_CHI_desc: "A 700-strong Chinese wheeled combined-arms battalion with three mechanized companies (33 ZBL-08 wheeled IFVs) and mobile artillery, emphasising strategic mobility."
 syn_light_bat_CHI: "Chinese Light Combined-Arms Battalion"
 syn_light_bat_CHI_desc: "A 600-strong Chinese light combined-arms battalion on 44 Mengshi assault vehicles, excelling in mountain, jungle and urban warfare."
 syn_amphibious_bat_CHI: "Chinese Amphibious Combined-Arms Battalion"
 syn_amphibious_bat_CHI_desc: "A 650-strong Chinese amphibious combined-arms battalion riding 36 ZBD-05 amphibious IFVs and ZTD-05 assault guns, specialised in over-the-beach landings."
