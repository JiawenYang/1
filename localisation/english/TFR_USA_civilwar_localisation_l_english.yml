#American oil crisis chain (adapted from TFR, removed civil-war-specific triggers)
tfr_usa.7.t: "Oil Crisis Hits America!"
tfr_usa.7.d: "As if the economic situation in America could not get any worse, the collapse of Saudi Arabia has created an oil panic that has placed the last nail in the coffin of our anemic economy. While Saudi Arabian oil only constituted around 21% of our total imported oil in 2019, our other main sources have cut production due to the COVID-19 pandemic, and a few, namely Russia and Mexico, have reacted to the Saudi collapse by raising prices exponentially. Domestic oil production is not at the current level necessary to offset nearly 40% of domestic oil consumption provided by imports."
tfr_usa.7.a: "What have we done to deserve this?!"
usa.170.t: "From Riches to Rags"
usa.170.d: "He stared, heart sunken and jaw dropped at the sight of the red number before him. The Dow Jones was down the worst it had ever been in history - from 30,000 on Friday to 15,000 on Monday. It dropped by half. In the first four days of the Great Depression, it dropped by 25%. It took two days now. Badwater Trusts Company was nothing. His life's work. Gone in a weekend."
usa.170.a: "And he took the leap into the icy blast."
tfr_usa.202.t: "Poverty Rates Skyrocket"
tfr_usa.202.d: "A few weeks have passed since the start of the oil crisis, yet the economic situation of the United States looks increasingly bleak. Massive oil shortages have caused massive queues at every gas station, and more businesses are going out of the market by the day due to decreased business confidence and lower incomes. Reports show that due to unemployment, decreased household incomes and inflation, the poverty rate in the United States is set to increase to 22 percent - numbers unseen since 1959."
tfr_usa.202.a: "It's only begun"
usa.217.t: "Unemployment Hits 20 Percent"
usa.217.d: "In a shocking report by the Bureau of Labor Statistics, the unemployment rate of the United States has hit 20 percent for the first time since the Great Depression - levels 6 percent higher than the peak of the Great Recession. With the Coronavirus pandemic in full swing and the service sector losing critical jobs, the oil crash just two weeks ago has left millions of working Americans suddenly out of a job."
usa.217.a: "The government's greatest failure."
