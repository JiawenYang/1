 #US political crisis and neoliberal order event chain (original TFR civil war content fully removed)
 usacw.5.t: "Trump Assassinated"
 usacw.5.d: "On 13 July 2024 the former president is shot at a rally in Pennsylvania and dies in hospital. A national emergency is declared; the Republican coalition collapses overnight as conspiracy theories and calls for vengeance flood the streets."
 usacw.5.a: "The country needs calm"
 usacw.6.t: "The GOP Collapses"
 usacw.6.d: "Trump's death leaves the Republican Party without the one figure who held its factions together. The November 2024 election is held under threats of violence and record turnout; the Democrats take the White House and both chambers. The losers refuse to accept the result, while the winners claim a mandate for radical reform."
 usacw.6.a: "An era is over"
 usacw.7.t: "Diplomatic Shutdown"
 usacw.7.d: "In January 2025 the constitutional deadlock between the White House and Congress finally spreads to the State Department: ambassadorial posts sit vacant in droves, diplomatic appointments go unsigned, and treaty renewals and allied consultations are frozen indefinitely. Washington's alliance pledges are reduced to empty paper, and the cables arriving from embassies around the world speak with one voice — America's diplomatic machine has ground to a halt. In Taipei, they realise for the first time that no one may be left able to lift the pen that signs their security guarantee."
 usacw.7.a: "Washington can no longer answer"
 usacw.8.t: "The Neoliberal Order Goes Live"
 usacw.8.d: "On March 1st, the White House and the Democratic Congress unveil a synchronised package of 'Rebuild Consensus' bills: deregulation, privatisation, technocratic rule and a full return to global institutions. In the name of 'efficiency', the federal government routes around the paralysed debate over states' rights, while advisers from Silicon Valley and Wall Street move straight into the departments. Critics call it a bloodless coup; supporters insist it is the only way out of the paralysis."
 usacw.8.a: "The new order begins"
 usacw.9.t: "The Global Intervention Mandate"
 usacw.9.d: "On April 15th, Congress passes the Global Stability Authorization Act by an overwhelming margin, handing the executive a blank cheque to deploy American forces anywhere across Eurasia. The neoliberal order at home demands cheap energy, open sea lanes and obedient allies — and all of it must be won by carrier groups and drones. From this day on, America's destiny is welded to victory on the Eurasian battlefields."
 usacw.9.a: "No way back"
 usacw.10.t: "Betting the Republic"
 usacw.10.d: "The Fourth of July fireworks rise on schedule, but everyone knows what the country is really celebrating. The White House has staked all of its political capital on a single promise: victory in Eurasia will crown the new order with another golden thirty years, while defeat will bring a reckoning deeper than the Great Depression. It is a gamble with the nation's fate as the stake."
 usacw.10.a: "Victory or oblivion"
 usacw.12.t: "The Permanent Majority"
 usacw.12.d: "Victory in Eurasia crowns the neoliberal order. Cheap resources and the dividends of triumph flood home, and the opposition collapses into single digits in the polls. Commentators now openly ask whether one-party rule is simply the final form of American politics — after all, winners should not be rotated. The Democratic era looks endless."
 usacw.12.a: "An era begins"
 usacw.13.t: "The Great Reckoning"
 usacw.13.d: "Defeat in Eurasia punctures every lie of the neoliberal order. A furious public blames the party that bet the nation's fate, and a rebuilt Republican Party returns with an overwhelming mandate, promising a reckoning with the Democrats 'from Wall Street to Hollywood'. Special prosecutors, loyalty reviews and political trials follow in turn — this time, the losers will pay for everything."
 usacw.13.a: "They will answer for it all"
