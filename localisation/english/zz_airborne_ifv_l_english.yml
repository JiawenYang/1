l_english:
 ZZ_airborne_ifv_chassis_bmd1: "BMD-1"
 ZZ_airborne_ifv_chassis_bmd1_desc: "The first Soviet airborne infantry fighting vehicle, air-droppable from transport aircraft to provide accompanying fire support for paratroopers."
 ZZ_airborne_ifv_chassis_bmd1p: "BMD-1P"
 ZZ_airborne_ifv_chassis_bmd1p_desc: "Modernized BMD-1 variant with add-on armor and improved fire control, retaining the proven airdrop system."
 ZZ_airborne_ifv_chassis_bmd2: "BMD-2"
 ZZ_airborne_ifv_chassis_bmd2_desc: "Second-generation airborne IFV armed with a 30mm autocannon, offering markedly improved firepower and reaction speed."
 ZZ_airborne_ifv_chassis_bmd3: "BMD-3"
 ZZ_airborne_ifv_chassis_bmd3_desc: "Third-generation airborne IFV on an all-new chassis, with composite armor and a stronger powerpack enabling crewed airdrops."
 ZZ_airborne_ifv_chassis_bmd4m: "BMD-4M"
 ZZ_airborne_ifv_chassis_bmd4m_desc: "Latest mainstay of the Russian VDV, combining a 100mm gun-launched missile system with a 30mm autocannon and networked battlefield systems."
 ZZ_airborne_ifv_chassis_zbd03: "ZBD-03"
 ZZ_airborne_ifv_chassis_zbd03_desc: "Tracked airborne fighting vehicle fielded by the PLA Airborne Corps, fully air-droppable to give paratroopers heavy fire support."

 airborne_mechanized_equipment: "Airborne IFV"
