 #乌克兰 2017-2024 剧情链（ukraine.1-13，搬运自 TFR 并按本工程依赖改写）
 ukraine.1.t: "Ukraine Violates the Minsk Protocol"
 ukraine.1.d: "Ukrainian army units have resumed border clashes with the Federal State of Novorossiya, openly violating the peace agreement. The Kremlin is watching, and the fragile ceasefire is now on the brink of collapse."
 ukraine.1.o1: "A reckless endeavour."
 ukraine.2.t: "Ukraine Airlines Flight 752 Shot Down over Iran"
 ukraine.2.d: "The Iranian government has informed us that the Revolutionary Guard accidentally shot down one of our airliners shortly after take-off from Imam Khomeini International Airport. All 176 passengers and crew are dead. Tehran calls it a tragic mistake; for the families, that changes nothing."
 ukraine.2.o1: "A horrible tragedy."
 ukraine.3.t: "Russia Condemns Ukrainian 'Neo-Nazism'"
 ukraine.3.d: "Russian state media has launched another wave of accusations, branding the government in Kyiv as 'neo-fascist' and 'the grandsons of Hitlerite collaborators'. The claims are old propaganda tricks dressed up as news, but they are repeated nightly on RT and Sputnik. Kyiv will not let the slander stand unanswered."
 ukraine.3.a: "History will vindicate us."
 ukraine.4.t: "The Russians Are Coming"
 ukraine.4.d: "Military intelligence warns that Moscow is preparing for a full-scale invasion. Engineers are already pouring concrete along the Dnieper and the eastern approaches, while new arms factories are being rushed into service. Every bunker built now buys time later."
 ukraine.4.a: "Prepare for the worst."
 ukraine.5.t: "Invitation into NATO"
 ukraine.5.d: "The Alliance has formally invited Ukraine and Moldova to join. For Moscow this is the red line it has warned about for years; for Kyiv it is the only guarantee that has ever held. Accession will be signed in the coming weeks, whatever the Kremlin says."
 ukraine.5.a: "United we stand."
 ukraine.6.t: "Belgorod Occupation Zone Established"
 ukraine.6.d: "Ukrainian forces have crossed into Russian territory and established an occupation zone around Belgorod. Moscow calls it an act of aggression; the commanders on the ground call it a buffer. The local Russian population now lives under Ukrainian administration."
 ukraine.6.a: "Hold the line."
 ukraine.7.t: "Belgorod Terrorist Attack"
 ukraine.7.d: "A bomb has struck a crowded market in the occupied zone, killing dozens of civilians. No one has claimed responsibility, but the explosion has turned the occupation from a military problem into a political powder keg."
 ukraine.7.a: "This will not go unanswered."
 ukraine.8.t: "Belgorod Uprising"
 ukraine.8.d: "Russian volunteers and local militias have risen against the occupation administration. The 'New Russia' movement declares Belgorod and Kursk to be free Russian territory, and its fighters are already engaging Ukrainian garrisons."
 ukraine.8.a: "The Russian spring has begun."
 ukraine.9.t: "Rostov Uprising"
 ukraine.9.d: "The uprising has spread to Rostov. Local Cossack militias have seized several districts and declared them independent of both Kyiv and Moscow, while the Melitopol volunteer corps moves to consolidate the region."
 ukraine.9.a: "Chaos spreads."
 ukraine.10.t: "Sevastopol Uprising"
 ukraine.10.d: "In Crimea the uprising has reached Sevastopol. Belarusian and Volyn volunteer formations have entered the peninsula, and the old Black Sea Fleet bases are now contested ground."
 ukraine.10.a: "The peninsula burns."
 ukraine.11.t: "Special Military Operation"
 ukraine.11.d: "The General Staff has activated the special military operation timer. From this moment the Russian campaign is on the clock: either Ukraine breaks, or the operation grinds into a stalemate Moscow cannot afford."
 ukraine.11.a: "Start the clock."
 ukraine.12.t: "Ukraine Vows to Defend Kuban"
 ukraine.12.d: "Kyiv has publicly guaranteed the security of Kuban, a region Moscow considers its own. The declaration is a deliberate provocation, and the Kremlin knows it."
 ukraine.12.a: "They know the alternative..."
 ukraine.13.t: "The 2024 Ukrainian Elections"
 ukraine.13.d: "Ukraine goes to the polls in the middle of a war. Zelensky's camp promises continuity and a second term; Poroshenko's conservatives promise experience and a harder line. The result will decide which Ukraine faces Moscow in 2025."
 ukraine.13.a: "Zelensky's re-election."
 ukraine.13.b: "Poroshenko returns."
 germany.243.t: "Ghost of Kyiv"
 germany.243.d: "The name trends across social media, attached to a Ukrainian MiG-29 pilot said to have shot down six Russian jets on the first day of the invasion. The footage is shaky and the claims are unverified, but the legend is already doing its work in a country that needs one."
 germany.243.a: "Happy hunting."
 news.313.t: "Zelensky Re-Elected in Ukraine"
 news.313.d: "Zelensky has won a second term. Wartime leadership and a populist touch have kept his coalition together despite corruption scandals and a stalled counteroffensive; the opposition now faces four more years of the same."
 news.313.a: "A mediocre comedian, but a wartime president."
 news.313.b: "The West will keep writing cheques."
 news.314.t: "Poroshenko Elected in Ukraine"
 news.314.d: "Poroshenko has returned to the presidency. Voters exhausted by Zelensky's failures have turned back to the man they once rejected, betting that experience and a harder line on Moscow can end the war on better terms."
 news.314.a: "One Russophobe replaces another."
 news.314.b: "At least he knows how to govern."
