l_english:
 #The Fire Rises Afghanistan civil war event chain (ported)
 afghanistan.1.t: "The American Peace Deal Takes Effect"
 afghanistan.1.d: "After the Doha agreement, American forces begin a phased withdrawal while the ceasefire between Kabul and the Taliban holds only through mutual suspicion."
 afghanistan.1.a: "Peace at last?"
 afghanistan.2.t: "The Taliban Scraps the Ceasefire"
 afghanistan.2.d: "The Taliban accuses Kabul of delaying prisoner releases and announces a general offensive. The ceasefire line becomes a battlefield overnight."
 afghanistan.2.a: "The civil war reignites"
 afghanistan.3.t: "The Islamic Emirate of Afghanistan Is Restored"
 afghanistan.3.d: "In the provinces under their control the Taliban proclaim the restored Islamic Emirate and call on all armed forces in the country to submit."
 afghanistan.3.a: "The Emirate is back"
 afghanistan.4.t: "The Taliban Expand Their Control"
 afghanistan.4.d: "Taliban fighters take over Nuristan, Kunar and Badakhshan as government units surrender or scatter in formation."
 afghanistan.4.a: "Province after province falls"
 afghanistan.5.t: "The Kabul Line Collapses"
 afghanistan.5.d: "Government forces desert en masse and Taliban vanguards approach the outskirts of the capital. Panic grips Kabul."
 afghanistan.5.a: "The capital is in danger"
 afghanistan.6.t: "The Eastern Provinces Change Hands"
 afghanistan.6.d: "The Taliban consolidate their grip on the eastern valleys as local warlords switch sides."
 afghanistan.6.a: "The east is settled"
 afghanistan.7.t: "Hazarajat Submits"
 afghanistan.7.d: "The Taliban reach an agreement with local militias, and Hazarajat nominally submits to the Islamic Emirate."
 afghanistan.7.a: "Negotiation beats bloodshed"
 afghanistan.8.t: "The Taliban Proclaim the Restored Emirate"
 afghanistan.8.d: "Kabul has fallen. The Taliban proclaim the restored Islamic Emirate of Afghanistan, and twenty years of war end with the American withdrawal."
 afghanistan.8.a: "An era ends"
