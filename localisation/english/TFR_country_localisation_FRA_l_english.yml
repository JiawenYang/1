 FRA_Dirigisme_idea: "Dirigisme Economics"
 FRA_Dirigisme_idea_desc: "The Idea of Dirigisme has always played a part in the economic systems of France. With the increment of bonds for the next decade we are to make sure the nation of France flourishes economically through whatever means necessary as the rise of instability across the world continues to rise. With this national revivalment of the Dirigisme system, we will ensure that France runs more efficiently and work to fix the follies of previous economic systems that have hindered the French Nation in multiple ways. "
 FRA_Dirigisme_Tech_idea: "Dirigisme Economics"
 FRA_Dirigisme_Tech_idea_desc: "The Idea of Dirigisme has always played a part in the economic systems of France. With the increment of bonds for the next decade we are to make sure the nation of France flourishes economically through whatever means necessary as the rise of instability across the world continues to rise. With this national revivalment of the Dirigisme system, we will ensure that France runs more efficiently and work to fix the follies of previous economic systems that have hindered the French Nation in multiple ways. "
 FRA_Laissez_Faire_idea: "Laissez Faire Economics"
 FRA_Laissez_Faire_idea_desc: "After decades of dealing with the bloat and corruption incurred by the system of ''Dirigisme,'' we've finally made a shift to let the hand of the free market guide our country forward. Along with the cash flow we've gotten from selling off our former ''national champions,'' the massive tax cuts have left our people with more than enough money to help boost our citizen's purchasing power. Some may bemoan the risks of economic ''shock therapy'' on the formerly public system and their lost jobs in the public sector; we know that the free market is much more capable of servicing the needs of the people in the pursuit of profit!"
