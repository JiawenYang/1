 FAF_solidarite_latine_idea: "Solidarité Latine"
 FAF_solidarite_latine_idea_desc: "The Latin people are a hegemony that should spread their wings across all of Europe, fighting as a singular entity and as a monument to our history and our culture. The enemies of Latindom are vast, many in number and strong in fortitude. However, as described, they are naught but barbarians trying to fiendishly tear down the walls of civilization, which we, the descendants of Rome, must combat with blood and soil."
 FAF_convene_latin_congress_decision: "Convene the Latin Congress"
 FAF_convene_latin_congress_decision_desc: "We are a state for all great Latin peoples, and to make sure that our new great empire doesn't end up being dominated by the French, for example, we must make sure that every Latin brother in the empire gets their representation. To achieve this, we shall convene great Latin congresses where all Latin brothers get fair representation."
 FAF_Imperial_Palace_idea: "The Imperial Palace"
 FAF_Imperial_Palace_idea_desc: "The Palace is a sign of stability, of wealth and prosperity. A symbol of France and her monarchy, the sign that it shall last for eons to come. It is a gaudy display of our wealth and of our power over the continent, the diamond upon her ring."
 FAF_invading_balkans_tt: "§YThis Focus will give wargoals on all Balkan nations.§!"
 FAF_the_grand_council_idea: "The Grand Council of Fascism"
 FAF_the_grand_council_idea_desc: "The French political system has once again proven itself to be an ineffective mess. Like the old Bourbon monarchy, it must be overthrown, and a new system must be created. With a bolder, braver government, France will rebuild and rediscover her former glory. Democracy's lacklustre performance will be replaced by the vitality of Fascism. Strong leadership is the only way to achieve true change and reform—not voting and debating. We will form a new governing body modeled after the Italian Grand Council of Fascism, ushering in a new era of prosperity for our nation."














