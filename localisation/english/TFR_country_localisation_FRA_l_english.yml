 FAF_royal_pretenders_dynamic: "Royal Pretenders"
 FAF_royal_pretenders_dynamic_desc: "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\nDespite our ancient claim, dating back the House Valois, the Orleanists and Bonapartist Usurpers fight our divine rule from the shadows, we have to remedy this issue before it spirals."
