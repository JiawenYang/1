 FAF_republican_officers_dynamic: "Mouvement Républicain"
 FAF_republican_officers_dynamic_desc: "\n\n\n\n\n£GFX_FRA_revolution\n\n\n\n\n\n\n\nSocialists, Democratic ''Conservatives'', Liberals, athiests. An insidious force within our Officer class remains from the corrupt Republic, rebellious and poised to overthrow the Kingdom at first opportunity, until we have uncovered it's ringleaders and removed them from our armed forces, we will find difficulty performing sophisticated maneuvers in any manner other than disorganized."
