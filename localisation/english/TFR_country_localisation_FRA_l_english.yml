 FAF_Restored_Monarchy_idea: "Restorationist Movement"
 FAF_National_Rebirth: "National Rebirth"
 FAF_National_Rebirth_desc: "France must awake to a glorious renaissance of unity and strength. Through bold and powerful cultural renewal, our regime must restore the people's rightful pride and place our country firmly on the path to greatness."
