 FRA_will_win_next_election_tt: "§CUnless something catastrophic were to happen, we will win the 2027 election§!."
 FRA_Caribbean_Occupation_Auth_tt: "We shall establish an Occupational Authority in the Caribbean."
 FRA_Corrupted_Presidential_Guard_tt: "Anyone can be bought for a price, even the 'incorruptible' men of the Republican Guard. A greased palm here, promises of promotion there. They will be brought on side or at the least be made to §Rlook the other way...§!"
 FRA_seize_movement_warning_tt: "§RThe movement will be co-opted by this wing of the party.§!"

 FRA_Recoup_our_Losses: "Recoup Our Losses"
 FRA_Recoup_our_Losses_desc: "Macron's rule over France went down as a one term disaster, in just a five year span he went from open, smiling, and charismatic, to trying to become his 'Jupiterian Ideal', the ideal of the President being a supreme authority. Had it been anyone else maybe it could have been accomplished. Renaissance was on the cusp of commanding a comfortable majority in Parliament, but it simply was not meant to be."
 FRA_Embrace_the_New_Left: "Embrace The New Left"
 FRA_Embrace_the_New_Left_desc: "Renaissance once stood as one third of the political axis, a pole to its own between the populist right and the left, but Renaissance will not survive without friends. Melenchon's efforts to whip up the Left into the modern era have borne fruit and the only way to counter Le Pen is if we work together and keep a whip snapping above our own party, Melenchon may be an adversary but he is one that shares many policies with us and many interests, A coalition against Le Pen will help us both in the coming years."
 FRA_Battle_Every_Legislation: "Battle Conservative Legislation"
 FRA_Battle_Every_Legislation_desc: "Ils Ne Passeront Pas, They shall not pass. A phrase often associated with the battle of Verdun. In arm lock today with the French Left we look at Le Pen and say Ils Ne Passeront Pas once again, the National Rally will curtail all we have worked to achieve, all the progress the center and left have made for workers rights, for social justice. Every new piece of legislation is an attack on the work of our predecessors for decades back in a struggle that has gone over four decades against the rights slowly growing grip on power."
 FRA_Investigate_Electoral_Integrity: "Investigate Electoral Integrity"
 FRA_Investigate_Electoral_Integrity_desc: "We expected losses due to the Oil Crisis and due to COVID, but the polls said we were to win by several points, something smells in Paris and we will begin the necessary functions nationwide, at a national and local level, leveraging the judiciary to the fullest extent, in an effort to investigate National Rally fraud. They will say it isn't real and that it is a witch hunt, but real or fake, these investigations will divide public opinion and drag support away from Le Pen and her cronies, if we simply push the allegations enough they will become fact in the public eye. All that is needed is a seed of doubt."
 FRA_Take_A_Stance_on_Federalization: "New Stance On Federalization"
 FRA_Take_A_Stance_on_Federalization_desc: "Macron was one of the most vocal proponents of European Federalization, proposing an integrated army and more common integration of law, economics, and even policing. We can choose to follow this vain by choosing the right coalition partners, or we can go against it. It is true that Le Pen's victory showcases a shift in politics, becoming Eurosceptic may help us in the polls. Putting the Republic before our neighbors is surely a popular decision, Macron never could see that, but even if we can accept it as a popular position we do not have to forsake Europe. We can remain Pro EU should we choose. We really do sit at a crossroads between two paths, a European or a French future, the choice is ours."
 FRA_Uphold_Republican_Beliefs: "Uphold Republican Ideals"
 FRA_Uphold_Republican_Beliefs_desc: "Liberté, Egalité, Fraternitié. The foundation of our great Republic, through Five Republics, Two Kingdoms, and Two Empires, we have not lost these ideals. But we may eventually lose them if we do not safeguard them. From within our own ranks lie the insidious clique of traditionalists, conservatives, barely two steps up from the Bourbon. The Revolution is something that must be defended and no one knows this better than the French, god knows we have felt their wrath in Yellow Vests more than once.\n\nOpposing Le Pen is as simple as pointing out their policies as anti Republican, our very base ideals call from Egalitarianism and Freedom, she would lockdown on protesters and put the French before anyone else, even if it means alienating minority populations. The French Republic was never founded on the ideals of unquenchable nationalism and unfettered xenophobia, in our earliest days we even tried to tear away from the Church, and while that platform wasn't so popular, it doesn't mean we should tear up the works of 1793 to create some new, neutered society, secure yet too afraid to critique the government."

 FRA_A_Denied_Destiny: "Our Denied Destiny"
 FRA_A_Denied_Destiny_desc: "Le Pen failed, her reformism lost us the election, we were never popular for being center right moderates, we were the party of action and strength! Le Pens resignation is the best thing she has done in many years. The party now is under the direction of Bardella, we were denied a mandate by the people by the liberal status quo of Macron and his Jupiterian cronies, he is not De Gaulle, he is not a mysterious man in an ivory castle, he is a laughing jackal serving Brussels and we will not lay back and let it happen, Macron will watch us unravel his precious web of businessmen and military yesmen, his allies will recede out of fear."
 FRA_Reintegrate_Radical_Forces: "Reintegrate Radical Forces"
 FRA_Reintegrate_Radical_Forces_desc: "It was the reforms of the National Rally that led to the rights splintering, the Identitarians, the Reconquéte of Zemmour. Had we banded together in the last election we would have held a majority. With Bardella in control the party of the Father is back and the party of the Daughter is dead. Radicals will return to our embrace and together in solidarity we will stand and be heard. Vive la France!"
 FRA_Meet_with_Disgraced_Militarists: "Meet With Disgraced Militarists"
 FRA_Meet_with_Disgraced_Militarists_desc: "The military pulled a Martin Luther before the last election, nailing demands to government doors across Paris, military units moved into the peripherié, it felt to Macron and to the nation as perhaps a coup may occur but it was only pressure, Macron fled and stood firm against the military demands, Le Pen offered her token support and then failed to deliver a victory. The Military has been distraught over the victory of Renaissance and the continued weakening of Frances army all while the Brutish Orcs rally their men in the east, ready to trample the west in the chaotic vacuum left by America. Bardella and the Military possess a similar will, the will to commit the extralegal to secure the future of France, we can promise their demands - and more."
 FRA_Entangle_Electoral_Victory: "Sabotage Liberal Academia"
 FRA_Entangle_Electoral_Victory_desc: "The Liberal Elites are the status quo today for a reason, they control the schooling. Like the Marxists once did some time ago in the glory days of the Popular Front. If you control the school you control the pupils and you teach them right and wrong, you teach them to be quiet or you teach them to be loud, you point them against who you wish to suppress and they do the rest, they raise their kids in the same indoctrination, and their kids kids and so on and so forth. The Elite Academia of France are rotten and despoiling left wing globalists unconcerned with the well-being of France and her people before the interests of some timbukfuque village across the planet. How many were killed? How many businesses and lives ruined? In protests that their education has incited? No more, disrupt their activities however we can, send masked men in the night to rough them up in their houses, call in bomb threats, and blame all of it on Russian agitators and Leftist revolutionaries, We'll take the riots they incite into their homes and they will be quiet. They may even join us out of fear."
 FRA_The_Right_Way: "The Right Way"
 FRA_The_Right_Way_desc: "The Right Way is the Right Way, what does the left bring? Inflation? Heightened taxes? More welfare for less benefit as hordes of Muslims draw the output of your labor? Call Renaissance Center if you like, Renaissance is in bed with Brussels and given the chance would sell the whole nation for a real chance at Federalizing Europe. The demise of France is not just a conspiracy theory, it is a campaign policy of and a long term strategic goal of the Liberals. It is only Bardella and the National Rally who can deliver France from the leftist agenda, only the National Rally can lower your taxes, put benefits in your pocket, and send the Moors to drown on the raft they floated in on. Vote for your local National Rally representative and ask your local branch how you can volunteer to aid the party, if you're here about our armed wing? Lower your voice and follow me."
 FRA_Stoke_Russian_Fears: "Stoke Fears of Russian Domination"
 FRA_Stoke_Russian_Fears_desc: "The Russians have always been the enemy of Europe! Treacherous! Slavic! Barely better than a Mongol Horde. The Backwards Empire failed us, they made deals with Germany and in not even 20 years they were buddy-buddy with the Germans while smiling at us, the Yalta Conference may as well have meant shit paper to the Georgian Dog, the last time an agreement with the Russians was honored predates recorded history because we do not have a record of it. If you think they'll honor their agreements now? You are a fool, a Russian bot, or a godless Commie nostalgic for your motherland. Quit lying to yourself France! You will be skewered on Kremlin Pyres if you do not wake up to the hard new world we live in today!"

 FRA_Operation_Saint_Arnaud: "§YOpération§!: Davout"
 FRA_Operation_Saint_Arnaud_desc: "The Russians have been caught off guard by our sudden intervention in Ukraine's defense, but have not stopped. Both from news from the front and intelligence reports, rather than stop and assess the situation, the Russians have doubled down and poured more resources into the Ukrainian thrust. Despite concerns over Ukraine's ability to weather the storm, the circumstances present a potentially golden opportunity. With Russian attention fully on Ukraine and attemps to organize a line that is now sixteen-hundred kilometers, they have strained their resources heavily. This has created the conditions for a daring naval landing behind Russian lines in the Kuban region. This bridgehead would further strain Russia's manpower and already stretched logistical resources, and perhaps force them to put offensive operations to a halt, enabling us to organize further large-scale counterattacks while the bear is off balance. Success would cement us as a leading player, failure is not an option for the fate of Europe and the honor of France is at stake."
 FRA_Operation_Davout_decision: "§YOpération§!: Davout"
 FRA_NATO_war_category: "The European War"
 FRA_NATO_war_category_desc: "\n\n\n\n\n£GFX_SOV_NATO_war_category\n\n\n\n\n\n\n\nThe Russians once more attempt to march into Europe to carve out their own empire... It is on us alone to stop them.\n\n§RPRIMARY TARGETS§!:\n\n§YSEVASTOPOL§!: [GLOBAL.get_sevastopol_nato_status]\n§YMINSK§!: [GLOBAL.get_minsk_nato_status]\n§YST PETERESBURG§!: [GLOBAL.get_petersburg_nato_status]\n§YROSTOV-ON-DON§!: [GLOBAL.get_rostov_nato_status]\n\n§RSECONDARY TARGETS§!\n\n§YKALININGRAD§!: [GLOBAL.get_kaliningrad_nato_status]\n§YBELGOROD§!: [GLOBAL.get_belgorod_nato_status]\n§YVOLGOGRAD§!: [GLOBAL.get_volgograd_nato_status]\n§YNOVGOROD§!: [GLOBAL.get_novgorod_nato_status]\n§YDONETSK§!: [GLOBAL.get_donetsk_nato_status]\n§YLUHANSK§!: [GLOBAL.get_luhansk_nato_status]\n\n§GALLIED CITIES§!\n\n§YKYIV§!: [GLOBAL.get_kiev_nato_status]\n§YODESSA§!: [GLOBAL.get_odessa_nato_status]\n§YTALLINN§!: [GLOBAL.get_tallinn_nato_status]\n§YVILNIUS§!: [GLOBAL.get_vilnius_nato_status]\n§YWARSAW§!: [GLOBAL.get_warsaw_nato_status]\n§YBUDAPEST§!: [GLOBAL.get_budapest_nato_status]\n§YBUCHAREST§!: [GLOBAL.get_bucharest_nato_status] \n\n§YOPÉRATION DAVOUT§!: \n§5KERCH§!: [GLOBAL.get_kerch_nato_status] \n§5NOVOROSSIYSK§!: [GLOBAL.get_novorossiysk_nato_status] \n§5SOCHI§!: [GLOBAL.get_sochi_nato_status]"
 FRA_davout_success_idea: "Success in the Caucasus"
 FRA_davout_success_flag: "§YOpération§!: Davout is successful"
 FRA_failed_operation_davout: "We have failed §YOpération§!: Davout"
 FAF_operation_baku_decision_idea: "§HOPERATION:§! BAKU"
 FAF_operation_powderkeg_decision_idea: "§HOPERATION:§! POWDERKEG"
 
 FRA_ils_ne_passeront_pas: "Ils Ne Passeront Pas!"
 FRA_ils_ne_passeront_pas_desc: "Regardless of Ukraine's collapse, the spirit in the Kuban bridgehead remains high. This newfound zeal is maintained despite the knowledge that not all is well at the front, the bear has achieved massive successes, despite high losses. The Russian advance continues, and to meet such an onslaught it's obvious we must dig our heels even deeper into the Chernozem. Today it is us besieging Krasnodar, but failure may enable the Russians to push on, and it will be the heart of Europe at risk. A chant from France's storied past has been resurrected by the men at the front, and just as it was then, will now serve as an excellent rallying cry for soldiers and civilians alike. They shall not pass!"
 FRA_sovereignty: "Sovereignty"
 FRA_sovereignty_desc: "More idealistic members of government and the military want to use the conflict to further cement European unity, increase unit integration, and utilize anti-Russian ethnic units to help paint us as liberators. Any such large structural change or heavy investment in questionably loyal groups should be viewed as a gamble, and he who gambles with his soul is a fool. Such dreamy concepts must be reserved for a world where Europe has vanquished any threat Russia represents to a free Europe. Until that day, we shall rely on the strength of France as it is-dreamy reforms can be saved for peacetime."
 FRA_solidarity: "Legacy of the Foreign Legion"
 FRA_solidarity_desc: "Despite our refusal to go down the route of rabid risky reorganization, there is still room for the raising of non-French units by simply embracing the spirit of the foreign legion. By rapidly expanding its strength, we can both swell the ranks with additional fighting men, and need not worry as much about sweeping structural changes and possible conflicts of interest among ethnic units. France will get foreigners to fight for her, but under the unifying banner of the Légion étrangère."
 FRA_cement_ukrainian_crimea: "Cement Ukrainian Crimea"
 FRA_cement_ukrainian_crimea_desc: "With the recapture of Crimea, we must spare no expense in ensuring any Russian attempt to retake it fails. Europe entered this conflict over a breach of Ukraine's territorial integrity, and to show we mean business, must go all the way. We will not settle for a truce, no 'DMZ', nothing short of a total victory. The lands stolen from Ukraine while we stood idly shall be returned no matter the cost. Our failures will be rectified, and we'll do our best to ensure this is the last time Russia can threaten Ukraine-let alone Europe-ever again. The bear shall be broken at any price."
 FRA_kuban_expeditionary_army: "Kuban Expeditionary Army"
 FRA_kuban_expeditionary_army_desc: "Even with their current successes at home and the front, behind the curtain one can find dissent in Russia. There are those in regions feel left behind far from Moscow, Kuban being the perfect starting point due to large chunks having fallen into our hands. We shall organize local and POW volunteers into this 'Kuban Corp' despite local officers insisting on spelling it with a 'K'. Such units will be perfect for rear security duties and to show the locals and perhaps the Russian people that we are just liberators, not conquering brutes."
 FRA_conscript_cossack_brigades: "Conscript Cossack Brigades"
 FRA_conscript_cossack_brigades_desc: "With the collapse of the USSR, both Russians and Ukrainians claimed to be inheritors of the Cossack name. From where we stand, Ukraine is the home of any true Cossack, and those who claim to be such must stand with us lest they be traitors to their people. Those on our side of the front will be organized into lighter mobile units to go along with their namesake. Consent to join these units matters not as, after all, we're fighting for their sake, not ours."
 FRA_utilize_russian_dissidents: "Utilize Russian Dissidents"
 FRA_utilize_russian_dissidents_desc: "There are many who'd take up arms with us for a multitude of reasons, whether they be for a 'better' Russia, regional independence, or simply going wherever the wind is blowing. The 'why' matters not, simply that these men can be handed rifles and used to weaken the Russian war effort. Some are genuine in collaboration, some have views that we find to be generally…problematic. We shall simply have to deal with the consequences later. There is a war to win."
 FRA_operation_davout_tt: "§YUpon completion of this focus, §!§COpération§!: Davout§!§Y will commence. \nThis is an all out attack on §!\n§RSochi \nNovorossiysk \nKerch§!\n§YThis is to relieve Ukrainian pressure and to ensure that§! §CNATO forces§! §Yhave superiority on the §!§GCaucasian front§!"
 FRA_cossack_army_tt: "4 §yCossack Light Mechanized Brigades! will be raised in §pWarsaw§!"
 FRA_kuban_exp_army_tt: "6 §0Kuban Militia Divisions§! will be raised in §pWarsaw§!"
 FRA_Freedom_of_Russia_Legion_tt: "2 §3Mechanized Russian Dissident Divisions§! will be raised in §pWarsaw§!"
 FRA_foreign_legion_tt: "4 §2French Foreign Legion Brigades§! will be raised in §4Paris§!"

 FRA_Act_on_Rattachism: "Act on Réunionisme"
 FRA_Act_on_Rattachism_desc: "While Wallonia speaks French, this ancient part of the Francophone world has been out of our hands since the fall of Napoleon, we thought lost forever. Fate has brought us back together as one again, as we must prepare several acts to continue to tie them into our system, being within our borders is not enough, Belgium and it's Byzantine Political System must be reconciled with our own. For the good of France we shall tend to this."
 FRA_Absorb_Waloon_Command: "Absorb Walloon Command"
 FRA_Absorb_Waloon_Command_desc: "Belgiums Bilingual nation led it to have an army split into two parts, much like it's government, this made the division of Belgium rather clean as the Flemish held border security on the Flemish side and the Walloonians similarly. But now this is the responsibility of the Dutch and France. Wallonia brings with it a sizeable contingent of forces and experienced NATO Officers who we would be fools to reject the services of. Update their uniforms, grant them new ranks, they are part of France now."
 FRA_absorbing_walloon_command_tt: "Wallonian officers will be absorbed into our army"
 FRA_Reorganize_Walloon_Businesses: "Reorganize Walloon Businesses"
 FRA_Reorganize_Walloon_Businesses_desc: "When integrating a urban developed territory like Wallonia, one must consider that businesses in the region were beholden to a strict building code that Belgium over saw from Brussels, but now? These businesses answer to French Law. We have to inspect the newly acquired businesses and help them reorganize, companies like Fabrique Nationale are too valuable to see fall, stepping in and organizing them amid the chaos will preserve the local economy."
 FRA_Integrate_Walloon_Parliament: "Integrate Parliament"
 FRA_Integrate_Walloon_Parliament_desc: "The hardest part of this really is looking at Belgiums governmental system and seeing how to integrate it. Belgium had three parliaments, Flemish, Walloon, and German. We control the Walloon and German region and don't know what exactly to do with their governments, while some seats are likely to be removed especially where Eupen Malemdy is concerned, many will be integrated into the French Republic, their parties registered under their former names shall retain them for the time being and many of the Belgian Parliamentarians will find themselves getting comfortable soon enough in Paris. All there is left now is for our party to draw up the elected regions and decide then who to keep."
 FRA_Promote_Francophone_Unity: "Promote Francophone Unity"
 FRA_Promote_Francophone_Unity_desc: "The French speaking people are the inheritors of a great and ancient legacy, from Charlemagne, to the Valois, to the Bourbon and Napoleon, and the current great Republican Era. We are shapers of European values, we are the holders of it's culture, we have endured for over a Millennium foreign invasion, subjugation, and more often than not, endured grand campaigns East, South, and West across the Atlantic to win glory for us and our people's.\n\nBelgium and Wallonia was for most of it's life apart from us during these glories. But they shared them all the same. Our history is one to be proud of, our history is theirs, and theirs is ours. The French always stand together!"
 FRA_An_Example_of_Unity: "An Example of Unity"
 FRA_An_Example_of_Unity_desc: "Liberté, Egalité, Fraternitié. The guiding principles of France. Since the first blade fell and ended the Ancien Regime our ideals have ignited the world. America. Germany. Italy. Is there a part of the world these three words have not reached? Name one. Europe is uniquely unified by these ideals today, though Belgium fell the core ideas in their mind did not. Brussels remains a city of mixed Flemish-Walloon ethnicity, the capital of Europe, while Belgium is gone the symbol of unity it left behind is a powerful reminder of the triumph of our ideals through all crisis and all trouble, the pursuit for Freiheit, for Libertié, whatever language you speak, you have a word for it. In English it is Liberty. In the hearts and minds of every European, let Brussels be a beacon of light for the future of Europe. The first real territory on a map that we can say wholly truly belongs to Europe."
 FRA_Propagandize_French_Naturalism: "Propagandize French Naturalism"
 FRA_Propagandize_French_Naturalism_desc: "And to the Rhine I say, follow the river north until Brabant Beer is in the market squares. We are the French, inheritors of Francia, we do not forget our origins. The Dutch, the Germans, they are our brothers. We gain Wallonia this day but we should have gained it all, we should have gone further, it is a gift to Europe that we do not march to the Rhine as Napoleon did. This ancient border of ours was drawn up in a defeat that split us from the Wallonians, from the Flemish, from Burgundys old lands. Why should we accept it? No we demand more. We should have more. Wallonia today, Flanders tomorrow, Brabant next week, the Rhine next year. Maybe. "
 FRA_Absorb_the_Beglian_Left: "Absorb The Belgian Left"
 FRA_Absorb_the_Beglian_Left_desc: "We leftists must stick together, the Belgian Socialists have long been our friends on the European stage and among their ranks are many personal friends of Melenchon, it's only right with the regions together as one that we can break bread with them, a meeting of Melenchon with the Parti Socialiste leader Paul Magnette and the PVDA's own Raoul Hedebouw will allow us to strengthen our parliamentary position and legitimize our rule over the Belgian working class. We may as well get Charles Servaty in here as well, Eupen is small but Eupen is still ours. Their 3 seats are still seats we would like to hold."
 FRA_Appoint_King_Philippe_to_Parliament: "Restore Belgian Titles"
 FRA_Appoint_King_Philippe_to_Parliament_desc: "Belgium has a storied monarchy, one that was unjustly torn away in the last days of Belgiums existence, it isn't right that such a symbol of national unity should be torn away. We are not a Monarchy ourselves of course, but the conservatives of Belgium do not want their royals made mere citizens. Very well. They will retain their titles restored and upheld by the French Republic, as odd as it is we shall crown a King for Belgium once more. A purely honorary and entirely non administrative state honor."

 FRA_Desperate_Defense_cw_idea: "Defense in Depth"

 FPR_Fervor_reset_tt: "Removes Idea §RRevolutionary Fervor§!"



 FRA_Secure_French_Oil_Interests: "Recognize A Saudi Successor"
 FRA_Secure_French_Oil_Interests_desc: "Establish diplomatic relations with the new Saudi leadership, whether under the Arabian Republic or the House of Saud. This recognition aims to solidify alliances and ensure a stable partnership, facilitating cooperation in energy production and regional security while enhancing France's influence in the Gulf."
 FRA_If_We_cant_have_it: "Establish Ourselves in the Middle East"
 FRA_If_We_cant_have_it_desc: "Invest strategically in the Middle East by providing financial support to key allies such as Israel and Turkey. This initiative will bolster relationships in the region, promoting stability and fostering partnerships that can lead to favorable energy agreements and enhanced security collaboration."
 FRA_Encourage_European_Economic_Sanctions: "Grant Economic Loans"
 FRA_Encourage_European_Economic_Sanctions_desc: "Provide targeted economic loans to the Saudi successor government to support development and stability. By investing in their economy, France can strengthen bilateral ties and encourage policies that align with French interests, ensuring a steady flow of oil and strategic cooperation."
 FRA_Redirect_Budget_to_Oil_Contracts: "Redirect Budget to Oil Contracts"
 FRA_Redirect_Budget_to_Oil_Contracts_desc: "Reallocate budgetary resources to prioritize oil contracts and initiatives. This focus seeks to ensure that funding is effectively channeled into securing vital energy agreements, enhancing energy independence, and reinforcing France's position as a key player in the global oil market."
 FRA_Integrate_Oil_Contracts_into_Military_Budget: "Integrate Oil-Military Budget"
 FRA_Integrate_Oil_Contracts_into_Military_Budget_desc: "Combine the oil budget with military funding to create a unified approach to energy security. By integrating these budgets, France can enhance its strategic capabilities and ensure that military operations are adequately supported by energy resources, ultimately strengthening national defense."
 FRA_Department_of_Oil_Production: "Département de la Production Pétrolière"
 FRA_Department_of_Oil_Production_desc: "Establish a dedicated government department focused on oil production and management. This department will oversee the development of domestic and international oil strategies, coordinate with industry stakeholders, and drive initiatives that enhance France's energy security and production efficiency."
 FRA_Reorganize_Civilian_Infrastructure: "Reorganize Civilian Infrastructure"
 FRA_Reorganize_Civilian_Infrastructure_desc: "Revamp civilian infrastructure to support increased oil production and distribution. This initiative involves upgrading transport networks, storage facilities, and processing plants to ensure efficient operations. By modernizing infrastructure, France can optimize its energy supply chain and enhance overall economic resilience."
 FRA_Invest_in_Equinor: "Invest in Equinor"
 FRA_Invest_in_Equinor_desc: "Channel investments into Equinor to bolster renewable energy initiatives and diversify energy sources. This strategic move aims to align with global energy trends while securing a foothold in innovative energy solutions. Supporting Equinor will position France as a leader in both traditional and sustainable energy markets."
 FRA_Ration_Civilian_Oil: "Ration Civilian Oil"
 FRA_Ration_Civilian_Oil_desc: "Implement a rationing system for civilian oil use to prioritize resources for strategic needs and military operations. This measure aims to ensure that critical sectors remain supplied while managing domestic demand effectively. By controlling oil distribution, France can maintain stability during periods of heightened tension."
 FRA_Curtail_Former_American_Embargoes: "Distance from American Embargoes"
 FRA_Curtail_Former_American_Embargoes_desc: "Take steps to distance France from American-imposed embargoes, particularly against Venezuela. By lifting restrictions and engaging with sanctioned nations, France can secure alternative oil supplies, enhance energy independence, and position itself as a diplomatic mediator in global energy discussions."
 FRA_West_African_Oil: "West African Oil Fields"
 FRA_West_African_Oil_desc: "Focus on expanding partnerships with pro-French nations in West Africa to gain access to additional oil reserves. This initiative will strengthen ties with these nations while boosting France's energy portfolio. By investing in West African oil fields, France can diversify its energy sources and support regional stability."

 FRA_Issue_10_year_Bonds: "Issue Ten Year Bonds"
 FRA_Issue_10_year_Bonds_desc: "With the recent economic instability at the start of the new decade, it becomes increasingly more evident that for France to not lag behind the other great nations of the world we must employ a more proactive strategy regarding our economic policy. The current administration has drafted a new monetary policy which will be set in place with the issuing of bonds for the remainder of the decade for businesses and corporations alike."
 FRA_Revive_Dirigisme: "Revive Dirigisme"
 FRA_Revive_Dirigisme_desc: "Dirigisme was crucial to our reconstruction efforts after the end of the Second World War and France hasn't forgotten its roots since then. While in recent times we have shifted over to a market-oriented approach with our economic policy it is never too late to revert to a more secure approach in light of recent economic instability such as the pandemic. With this nationwide reversion towards the dirigisme system, France will flourish as it once did during the republic's best years. "
 FRA_Invite_New_Age_Technocrats: "Invite New Age Technocrats"
 FRA_Invite_New_Age_Technocrats_desc: "With the turn of the century one of the most lucrative and expansive industries across the globe, especially for France, has been technology. The technology giants that have formed within the last two decades have dominated the industry mostly from America. France will show they are not one to oppose these industry giants and instead extend our hands towards them as a gesture of goodwill from the French people."
 FRA_Purchase_National_Champions: "A New Era of National Champions"
 FRA_Purchase_National_Champions_desc: "As we pave the way for economic dominance, we must not forget our own French companies who were once leaders of the industrial and economic markets. We will show the rest of the world the superiority of the French product and our innovation. But to achieve this we must foster our corporations and ensure they are propped up and understand that France backs them on the global stage."
 FRA_Advance_National_Interests: "Advance National Interests"
 FRA_Advance_National_Interests_desc: "What is best for our corporations and businesses is what is best for the nation of France and that is final. We will preserve the welfare and prosperity of our nation through any means possible and any company wishing to be a part of our economic movement must adhere to these demands. They will understand this in due time as France once again becomes a major player in the geopolitical landscape of the modern world as it has decades earlier."
 FRA_Replace_the_ENA: "Replace The ENA"
 FRA_Replace_the_ENA_desc: "The École Nationale d'Administration has stood as our government's beacon of progress and goodwill towards our citizens. With its original intent to be the democratization of our civil service away from the convoluted mess of bureaucracy we used to have it has recently fallen into dismay as the years have been cruel to the institution. What had gone wrong is what many wonder of the prestigious institution but it seems after years of malpractice and disfunction the answer with its own policies.\n\nAfter many deliberate and convoluted talks with leaders from all sides of the debate it has been decided that the only way to fix this decrepit problem is to completely replace the once prestigious academy. This time we will ensure its longevity, restoring it to the same prestigious reputation it once had."
 FRA_Replace_ENA_Veterans: "Sack ENA Veterans"
 FRA_Replace_ENA_Veterans_desc: "One thing we can all agree about the École Nationale d'Administration is that the bureaucracy, specifically the bureaucrats, were a plague that has turned our once prestigious institution into the convoluted mess we know it today. After monumental change has been made it is now obvious these leeches will try to cling onto whatever power they still hold. We will remove these veterans from their positions of grandeur and show them that the people of France don't welcome them anymore."
 FRA_Institut_national_du_service_public: "Birth Of The INSP"
 FRA_Institut_national_du_service_public_desc: "The Institut National des Sciences Politiques was one of many propositions drafted by our administration that have sat in a filing cabinet in some beurocrat's office for years. Until recently it would have remained that way if not for the much-needed reforms implemented under our administration that allowed us to entirely replace the École Nationale d'Administration with the Institut National des Sciences Politiques. While the elite members of the former institution are in an uproar the people of France know that this change will benefit them instead of the upper-class who have long abused their status and privileges with the École Nationale d'Administration being not one anymore."
 FRA_Distribute_ENA_Funds: "Redistribute ENA Funds"
 FRA_Distribute_ENA_Funds_desc: "With the much-needed end to the École Nationale d'Administration France and our government will breathe a sigh of relief after that affront to our nation has finally been decapitated. After weeks of combing through all the expenses that École Nationale d'Administration consumed of our budget the staggering report over one hundred and fifty billion euros almost caused a second uproar. Thankfully this time the École Nationale d'Administration has already been gutted for everything it had and now we can move these funds to much-needed institutions of France that were robbed for decades thanks to that vile institution."
 FRA_Disuade_Elitist_Attitudes: "Dissuade Elitist Attitudes"
 FRA_Disuade_Elitist_Attitudes_desc: "With the birth of the Institut National des Sciences Politiques, we will show those who have prayed on the weak protections of the École Nationale d'Administration that their elitist and predatory behaviors are no longer welcomed by the people of France. We will show them that our administration speaks for the people and the people have spoken that the elites are no longer welcome in our governmental institutions anymore!"
 FRA_Reform_the_Civil_Services: "Reform the Civil Services"
 FRA_Reform_the_Civil_Services_desc: "With the redistribution of the wasteful École Nationale d'Administration funding, we have a lot of room to invest in the other parts of our government. With the void left by the École Nationale d'Administration with their civil service training out the window, it falls on our current government to ensure that the people still have their opportunities to get into the civil service without the hassle it once was."
 FRA_Laissez_faire: "Embrace Laissez Faire Economics"
 FRA_Laissez_faire_desc: "With our methodical branching away from the Drigisme System in the last few decades into a great emphasis on the market it seems in light of recent geopolitical events it is finally time for France to embrace the free market once and for all and receive the glorious benefits it has to offer. With this economic outlook, France will prosper and evolve into the modern era in ways not seen since the glory days of our republic."
 FRA_Deconstruct_the_ENA: "Deconstruct The ENA"
 FRA_Deconstruct_the_ENA_desc: "The École Nationale d'Administration has stood as our government's beacon of progress and goodwill towards our citizens. With its original intent to be the democratization of our civil service away from the convoluted mess of bureaucracy we used to have it has recently fallen into dismay as the years have been cruel to the institution. What had gone wrong is what many wonder of the prestigious institution but it seems after years of malpractice and disfunction the answer with its own policies.\n\nAfter many deliberate and convoluted talks with leaders from all sides of the debate it has been decided that the only way to fix this decrepit problem is to completely replace the once prestigious academy. This time we will ensure its longevity, restoring it to the same prestigious reputation it once had."
 FRA_Begin_Low_Scale_Privatizations: "Begin Low-Scale Privatizations"
 FRA_Begin_Low_Scale_Privatizations_desc: "Privatization at a minor scale has been asked of us for decades by the corporations who have been aiding France economically and even financially at times. With our Laissez Faire economic approach, it is finally time to concede to the corporations and businesses by allowing for the privatization of some of the government institutions allowing for greater efficiency and even allowing for strategic competition to ensure at the end of the day the French citizen is the true victor."
 FRA_Increase_Arms_Exports: "Increase Arms Exports"
 FRA_Increase_Arms_Exports_desc: "Our Military Industrial Complex has always been one of the greatest in consideration that we are not one of the global superpowers of this Era, but specifically, our arms industry has been in recent years faltering, compared to our past. With recent geopolitical instability in Africa and other parts of the globe now is the prime time for our nation to continue shipping out the finest French products across the globe once more."
 FRA_Reduce_International_Sanctions: "Reduce International Tariffs"
 FRA_Reduce_International_Sanctions_desc: "Tariffs have always been more of a political action than anything else.. of course, there are exceptions like our ideological enemies. Regardless we have been too harsh in recent years and as a result, we have lost out to a crucial part of the market that yearns for French products and industry. France will remain and only grow stronger in the international market and this policy will only ensure we continue to increase in economic strength."
 FRA_Acquire_Renault: "Acquire Renault"
 FRA_Acquire_Renault_desc: "Renault has stood as one of France's most luxurious automotive companies since the invention of the car came to France. Although known for their cars they have also done great service for our military as they have provided us with armoured personnel carriers, infantry fighting vehicles, and even tanks. It is for that reason that in an effort to expand our nation's companies onto the global stage our administration has inquired to purchase Renault."
 FRA_Nexter_Expansion: "Expand Nexter Contracts"
 FRA_Nexter_Expansion_desc: "Nexter has been a long aid to the French Military in the modern era of the republic. They have our deepest respect and gratitude and in repayment for their contributions to our military we will reward their hard work and effort by expanding their contracts allowing them to produce more for our beloved nation and its military."
 FRA_Prioritize_Efficient_Economics: "Prioritize Efficient Economics"
 FRA_Prioritize_Efficient_Economics_desc: "With the dirigisme approach in full swing and our policies holding strong, it is finally time to focus our administration on making sure our economic plan holds strong and remains as efficient as possible. We will aim to make sure our reforms will go through our parliament and ensure the bureaucracy doesn't hinder our nation's economic growth. With the directed course of our policy and reforms, it seems France's time as the European economic powerhouse is potentially soon…"
 FRA_Tax_Cuts_to_Defense_Companies: "Defensive Tax Cuts"
 FRA_Tax_Cuts_to_Defense_Companies_desc: "With the recent approach to our economic troubles being one of Laissez Faire the next big step to achieving a total hands-off economy is to cut the taxes on corporations partaking in our monetary system. In particular, companies that are involved in our military-industrial complex will be receiving the most benefits overall obviously to ensure our Military receives nothing but the best."
 FRA_Offer_American_Companies_Refuge: "Refuge to American Companies"
 FRA_Offer_American_Companies_Refuge_desc: "Without a doubt, the sudden civil war that has sprung out of America has tanked not only our economy but the global markets. As terrible as this has been for us there now seems to be a silver lining as former giants of the American industry now seek to start reaching out into the European markets and who is better than our proud nation. France has taken the mantle in the European Union's efforts to incorporate companies that have been disproportionality affected by the Second American Civil War and hopefully retain them if this conflict ever meets its end."
 FRA_Push_for_EU_Asian_Free_Trade: "EU-PDTO Free Trade Agreement"
 FRA_Push_for_EU_Asian_Free_Trade_desc: "Both the European Union and the Pacific Treaty Organization have taken substantial blows as with the exit of the American market both the Russians and Chinese alike have used this opportunity to push their own economic interests aggressively on their neighboring nations. To prevent their combined aggressions a historical trade agreement between the two great powers has been finalized to show to the world that we are not afraid of these global superpowers and we are no longer reliant on the United States anymore."
 FRA_Strengthen_Anti_Corruption_Laws: "Strengthen Anti-Corruption Laws"
 FRA_Strengthen_Anti_Corruption_Laws_desc: "Now it is finally time for real change. Change that will send shockwaves throughout the political climate of not only our government but our political climate as a whole. Our administration will be pushing several anti-corruption laws that will end the legal loopholes lawmakers and bureaucrats have been using to skirt around lady justice. France will show our nation and the rest of Europe that we are champions of the law and no one is exempt from accountability within our borders."
 FRA_Declare_Wartime_Measures: "Declare Wartime Measures"
 FRA_Declare_Wartime_Measures_desc: "With the onslaught of Russian aggression across the globe, we finally realize that there can be no half-measures when dealing with the likes of these Russian thugs. France will lead by example showing that we are ready and willing to combat the Russian Aggression and we are actively encouraging the rest of Europe to follow along with France at the head of the anti-Russian bulwark that seeks to destroy our way of life as we know it."
 FRA_Utilize_Consumerism: "Utilize Consumerism"
 FRA_Utilize_Consumerism_desc: "France in the modern era has always catered towards consumerism especially since before the pandemic. With the pandemic now mostly over it lies on our government to encourage our nation to go back to its consumerist ways to help not only reignite our companies but our economy too. The nation of France will see their beloved businesses thriving as they once did years ago before that terrible series of events almost sunk our country economically."
 FRA_Target_Oligarchs: "Target Oligarchs"
 FRA_Target_Oligarchs_desc: "It is time to tackle one of the toughest questions of our deeply flawed system. The question of the oligarchs finally gets its spotlight as our administration has proposed and already passed multiple anti-oligarchic legislative bills in order to not only curb their influence in our political and economic systems but also end it once and for all. The nation of France and the rest of Europe shall know that we will always have our people's best interests at heart and that money cannot buy or sway the French political machine."
 FRA_Fraternite: "Fraternité"
 FRA_Fraternite_desc: "Despite our relative peace in Europe, war is always a certainty. The rising tensions have shown us that only an animal with sharpened teeth is able to fend off attackers and with our American allies's inability to contribute to our defensive capabilities, it would be more than reasonable to contribute to our own military heavily. Whatever enemy may arise, let them regret ever touching France."
 FRA_Egalite: "Égalité"
 FRA_Egalite_desc: "Economic equality is something everyone should strive for, to deny someone's accumulation of wealth however would go against our principles, by maintaining a steady line between wealth and equality, we can ensure that our people have something to fight for, a future."
 FRA_Liberte: "Liberté"
 FRA_Liberte_desc: "One of France's core fundamentalisms is liberty, ever since we raised the tri-colour we've had the understanding that our people deserve a voice and are free to express themselves without any punishment.By focusing on our republican ideals, we exert more influence on our internal politics, with unity comes stability and if we show to our people that despite our differences, we are able to live freely together."
 FRA_Withdraw_from_Integrated_Military_Command: "Withdraw from Integrated Military Command"
 FRA_Withdraw_from_Integrated_Military_Command_desc: "One of the many mistakes of previous regimes was our continued commitment to the NATO-integrated command. Why must France tie its military strength to the rest of Europe? Why must we be limited by treaties and regulations? No more. It is time that France separated itself from this aging concept. No longer will our military be bound to NATO like a dog. At last, we will be able to mold our army into something uniquely French. Not British, not Italian, not German, French. Our allies will not be happy about this, but they will have to accept that this outcome is best for all parties involved."
 FRA_Assure_our_Allies: "Assure the Allies"
 FRA_Assure_our_Allies_desc: "Despite what our allies fear, our new military direction will not lead to us abandoning our commitments to NATO. While some on the fringe of the left and right continuously argue that we should leave the alliance, they do not represent what we stand for. We stand for the collective security of all Western Europe. And will always be willing to lay our lives on the line in the defense of justice and freedom. France shall shine bright as the bulwark of NATO, and we will be ready to face tyranny head-on, regardless of where it comes from."
 FRA_Military_Industrial_Program: "Military Industrial Programs"
 FRA_Military_Industrial_Program_desc: "War is a dangerous game. It consumes everything in its path and grinds nations' economies to a halt. Many countries have fallen not to soldiers or tanks but to the invisible force of attrition. With tensions heating up around the world, we cannot afford to keep our industrial base at its current size. Our men need supplies: guns, bullets, fuel, and food. These essentials are necessary for the basic functions of our army. New industrial plans will allow us to supply our army and allies with supplies and materials to survive future wars."
 FRA_Redistribute_NATO_Funding: "Redistribute our NATO Contributions"
 FRA_Redistribute_NATO_Funding_desc: "With our new downsized role in the NATO high command, we must figure out what to do with our newly acquired resources. For far too long, French social services have scraped by with the bare minimum. They received the bare minimum of subsidies from the government, while the military was constantly given budget increases. This has been one of the biggest failures of our government, and we seek to rectify this issue once and for all. New subsidies will be granted to services across our nation. This serves not only to use excess spending we once used on the high command but also to cut down on growing poverty and unemployment."
 FRA_A_New_Doctrine: "New Strategic Doctrines"
 FRA_A_New_Doctrine_desc: "War is a game of constant change. Tactics become obsolete, weapons become outdated, and in war, nothing remains the same. In the quest for superiority over our enemies, change is not just necessary. It is mandatory. Our enemies are unpredictable. They will use every tactic, regardless of how outdated it might be. As such, we must remain on our toes. Adaptability must become the core of our military doctrine. Ensuring we will always have the upper hand over our enemy, regardless of the odds."
 FRA_Civic_Construction_Plans: "Civic Construction Programs"
 FRA_Civic_Construction_Plans_desc: ""
 FRA_New_Stretegic_Concepts: "New Strategic Concepts"
 FRA_New_Stretegic_Concepts_desc: "For as long as it existed, NATO has always been prepared for the potential of an all-out war with the USSR in the Cold War. Despite this never becoming a reality, the fear of war persisted, even after the Soviet Union collapsed. But with the dawn of the 21st century, many of our doctrines and concepts have been deemed outdated. Plans and tactics that would have worked years ago have now been rendered obsolete by the advancement of technology. As such it is necessary that we do a complete reevaluation of current NATO strategic concepts. To ensure we are ready for any possibility, including an all-out war with Moscow."
 FRA_Establish_Romanian_Forward_Operating_Bases: "Romanian F.O.B's"
 FRA_Establish_Romanian_Forward_Operating_Bases_desc: "Ever since Romania entered NATO in 2004, they have stood as a key asset in the defense of Eastern Europe. Their position along the black sea, combined with a border with Ukraine, has allowed us to project power into that region for many years. While our role in the East has always been passive, recent provocations from the Russian bear have shown that the time for passive action is over. As part of our mobilization plans, bases across Romania will be upgraded and expanded. Allowing us to not just project power. But also respond to any potential military action, especially concerning Ukraine."
 FRA_A_European_Turkey: "The Sick Man's Medicine"
 FRA_A_European_Turkey_desc: "Turkey is an enigma. Despite its membership in NATO, we have frequently clashed with them, especially concerning its intervention in the Syrian civil war. As they stand now, Turkey is at a crossroads. To secure our foothold in the East, we must ensure that Ankara is fully committed to NATO. Their position as the guardians of the Black Sea grants us control over one of Russia's most important sea routes. Allowing us to block trade and even strike into the Caucasus if war was to break out."
 FRA_Baltic_Defense_Plan: "Baltic Defensive Readiness"
 FRA_Baltic_Defense_Plan_desc: "While not the main focus of Russia's aggression, the Baltic states have been threatened by the bears' looming presence. Ever since the dissolution of the Soviet Union, Moscow has eyed this region hungrily. And if war breaks out, they are bound to invade and attempt to overrun our allies. As such, we must implement programs to bolster NATO's defenses in the region. Defending the Baltic States ensures that Russia doesn't have access to warm water ports. Significantly boosting our odds of successfully holding off any potential Russian invasion."
 FRA_Arm_the_TSK: "Turkish Defensive Readiness"
 FRA_Arm_the_TSK_desc: "During the height of the Cold War, Turkey was a flashpoint for tensions between the West and the East. Bridging the Middle East and Europe, Turkey stands positioned as a launchpad for any potential invasions into the Caucasus or Middle East. While the Turkish army has always stood ready for any hypothetical invasion, we must ensure that the Russians will not be able to march on Ankara. Regardless of the cost, we must ensure that our most important ally does not fall. Because their fall would trigger a chain reaction, opening the entirety of the Balkans to be taken by Russia."
 FRA_Improve_Conversion_Efficiency: "Improve Conversion Efficiency"
 FRA_Improve_Conversion_Efficiency_desc: ""
 FRA_Supremacy_in_the_Skies: "Supremacy in the Skies"
 FRA_Supremacy_in_the_Skies_desc: "Ever since World War One, aerial warfare has been a key component in the function of modern-day militaries. Jets provide close air support for ground troops, while bombers reduce cities and factories to rubble. A nation that lacks an air force is at the mercy of any invader. As part of our plans to revitalize our airforce, we seek to not only contest the skies but dominate them. Our jets will strafe the skies. Our bombers will reduce enemy forces to rubble. And our enemies will learn to fear the sight of French jets in the sky."
 FRA_Increase_our_Black_Sea_Presence: "Increase our Black Sea Presence"
 FRA_Increase_our_Black_Sea_Presence_desc: "The Black Sea sits as one of the most crucial waterways in the world. Many nations rely on it not only to facilitate trade but also to protect their national interests. Since the seizure of Crimea in 2014 by Moscow, a dangerous power shift has occurred. Now, the region stands threatened to become Russia's warm-water lake. As part of our naval expansion program, we will strive to dominate the Black Sea and eclipse Russia's presence in the region. Because if we allow the region to fall into Russian hands. Threatening not just Ukraine but also our allies in the region."

 POLITICS_EMMANUEL_MACRON_DESC: "Emmanuel Jean-Michel Frédéric Macron is a former investment banker, former minister, and current President of the Fifth Republic of France. At a young age and having been raised in a non-religious household, he asked to be baptized into the Catholic Church. However, he would later declare himself agnostic, and embraced left-leaning ideology which he attributes to his grandmother. He studied philosophy and economics at the École Normale Supérieure and later attended the École Nationale d'Administration. After completing his studies, he worked as an investment banker for Rothschild & Cie Banque, where he earned his first million on a nine billion dollar deal he helped broker. In 2012, he was appointed Minister of the Economy, Industry, and Digital Affairs which e resigned from In 2016 to launch his Presidential campaign.\n\nAs President, Macron has pursued an agenda of economic reform, including reducing public spending and labor market deregulation.  His presidency has been tainted by widespread protests, including the ''Yellow Vest'' movement, which began in late 2018 in response to proposed fuel tax increases. Macron has referred to France's colonization of Algeria as a ''crime against humanity,'' and intervention in Libya as a ''historic error.'' Meanwhile, France still exerts its influence over the vulnerable countries of West Africa from the shadows, and it is unclear how far Macron is willing to go to preserve French interests. Despite these challenges, Macron remains a prominent figure on the international stage, advocating for global cooperation on issues such as climate change, international security, and unity between European nations."
 POLITICS_JEANLUC_MELENCHON_DESC: "Jean-Luc Mélenchon, the newly elected President of the Fifth Republic of France, is not just a politician, but a passionate advocate for social change and human rights. Raised in a working-class family, Mélenchon learned the value of solidarity and community from a young age. His upbringing instilled in him a deep empathy for the struggles of the common people and a determination to fight for their rights. Educated in philosophy and economics, Mélenchon's intellectual curiosity and commitment to social justice led him to a career in politics. As a former teacher and activist, he understands the power of education and grassroots organizing in effecting meaningful change. \n\nAs a leader, Mélenchon is known for his fiery rhetoric and uncompromising principles. His presidency is guided by a vision of a fairer, more equitable society, where wealth and power are distributed more evenly and everyone has the opportunity to thrive."
 POLITICS_OLIVIER_FAURE_DESC: "Olivier Faure is a prominent figure in the French political landscape, currently serving as the Secretary of the Socialist Party. Born into a politically engaged family, he grew up steeped in discussions about social justice and progressive values. His academic journey took him through the halls of Sciences Po, where he honed his understanding of political theory and social issues. Faure's career in politics began as an advisor and quickly evolved into a leadership role, reflecting his deep commitment to the ideals of socialism. \n\nAs president, Faure advocates for a France that prioritizes social equity, environmental sustainability, and economic justice. He believes in the power of collective action and aims to unite the left under a common banner to address the pressing challenges facing the nation. His pragmatic approach seeks to balance idealism with achievable policy goals, striving to reconnect with disenfranchised voters while promoting reforms that uplift the working class. Faure's vision is one of solidarity, where the voices of the marginalized are amplified, and the ideals of the French Revolution - liberty, equality, and fraternity - are brought to life."
 POLITICS_FRANCOIS_RUFFIN_DESC: "François Ruffin is an influential journalist, filmmaker, and political activist, best known for his grassroots approach to politics and his unwavering commitment to social justice. Growing up in a modest household, Ruffin developed a strong sense of empathy for the struggles of the working class, which would later inform his work as an advocate for the underprivileged. He gained recognition for his documentary films that shed light on social issues, capturing the realities faced by ordinary citizens in contemporary France. \n\nAs president, Ruffin embodies the voice of the people, prioritizing direct engagement with constituents and community organizing. His passionate speeches and confrontational style challenge the political establishment, urging reforms that tackle income inequality, workers' rights, and environmental concerns. Ruffin's vision for France is one where democracy is revitalized through active citizen participation, and where policies reflect the needs and aspirations of the working class. He seeks to create a nation where every citizen feels empowered to demand change and has a seat at the table of governance."
 POLITICS_MARINE_LEPEN_DESC: "Marine Le Pen, the newly elected President of the Fifth Republic of France, is not just a politician, but a mother and a daughter deeply rooted in the fabric of French society. Growing up in a political household, she witnessed firsthand the struggles and triumphs of her father, Jean-Marie Le Pen, as he led the National Front party. Despite their ideological differences, Marine carries with her a sense of familial duty and a determination to leave her mark on French politics. Educated in law at Panthéon-Assas University, Le Pen's early career as a lawyer provided her with insights into the injustices faced by ordinary citizens. This experience fueled her passion for justice and her commitment to defending the rights of the French people. \n\nAs a mother, Le Pen understands the importance of security and stability for families across France. Her presidency is driven by a desire to create a safer, more prosperous future for the next generation, free from the uncertainties of globalization and cultural erosion."
 POLITICS_ERIC_ZEMMOUR_DESC: "Eric Zemmour, the newly elected President of the Fifth Republic of France, is not just a pundit, but a thinker unafraid to challenge the status quo and speak his mind. Raised in a multicultural neighborhood in Paris, Zemmour experienced firsthand the tensions and complexities of immigration and diversity. His early experiences shaped his worldview and instilled in him a deep sense of national identity and cultural pride. Educated in law and political science, Zemmour's career as a journalist and author has been defined by his willingness to confront taboo subjects and challenge prevailing narratives. His unapologetic defense of French values and traditions has made him a polarizing figure, but also earned him a devoted following among those who feel marginalized or ignored by mainstream politics. \n\nAs a leader, Zemmour is guided by a belief in the importance of preserving France's cultural heritage and national identity. His presidency is driven by a desire to protect French sovereignty, strengthen borders, and restore law and order in French communities."
 POLITICS_PIERRE_DEVILLIERS_DESC: "Pierre De Villiers, the newly elected President of the Fifth Republic of France, is not just a military leader, but a man of honor and integrity with a deep sense of duty towards his country. Born into a military family, De Villiers learned the values of discipline and service from an early age. His father, a decorated general, instilled in him a love for his country and a commitment to defending its interests. Educated in military strategy and leadership, De Villiers' distinguished career in the armed forces took him to some of the most challenging and dangerous regions of the world. His experiences on the battlefield shaped his understanding of geopolitics and the complexities of modern warfare. \n\nAs a leader, De Villiers is known for his humility and humility and his willingness to listen to the advice of experts and advisors. His presidency is guided by a belief in the importance of strength through unity and cooperation, both at home and abroad. He is determined to uphold France's reputation as a global leader and defender of democracy and human rights."
 POLITICS_JADOT_DESC: "Yannick Jadot is the charismatic leader of the European Ecology - The Greens party and a prominent figure in France's environmental movement. Born in 1967, he grew up in a family that instilled in him a passion for nature and sustainability. His academic background in political science and international relations fueled his commitment to environmental issues, leading him to work for various NGOs before entering politics. \n\nJadot's political career is characterized by his unwavering dedication to combating climate change and advocating for green policies. He believes that the ecological crisis is not just an environmental issue but a social and economic one, demanding urgent action to protect both the planet and vulnerable communities. As a member of the European Parliament, he has championed ambitious climate legislation and pushed for a European Green Deal. Jadot envisions a future where France leads the way in sustainability, energy transition, and social equity, promoting a vision of a just society that prioritizes the health of the planet."
 POLITICS_PECRESSE_DESC: "Valérie Pécresse is a seasoned politician and the leader of the Republicans party, known for her pragmatic approach to governance and her focus on economic reform. Raised in a politically active family, Pécresse developed a keen interest in public service early in life. She studied at the prestigious Sciences Po and later earned a degree from the École Nationale d'Administration, which paved the way for her successful career in politics. \n\nAs a former Minister of Higher Education and Research, Pécresse is committed to educational reform and innovation. Her leadership style emphasizes fiscal responsibility, public safety, and the importance of a strong national identity. Pécresse's vision for France includes revitalizing the economy, tackling unemployment, and ensuring that the nation remains competitive on the global stage. She seeks to unite the center-right under a banner of modern conservatism, advocating for policies that balance social welfare with economic growth, while also addressing the concerns of a diverse electorate."
 POLITICS_BARDELLA_DESC: "Jordan Bardella is a rising star in the political arena and the young leader of the National Rally, embodying a new generation of far-right politics in France. Born in 1995, Bardella was raised in a family that encouraged strong political beliefs, and he quickly became active in politics during his teenage years. His academic pursuits in political science further fueled his ambitions, leading him to become a spokesperson for the party and eventually its president. \n\nBardella's leadership is marked by a focus on nationalism, immigration control, and law and order. He positions himself as a voice for the ''forgotten'' French citizens, advocating for policies that prioritize their needs and concerns. Under his guidance, the National Rally seeks to reclaim France's identity, emphasizing a strong defense of cultural heritage and traditional values. Bardella's dynamic speaking style and ability to connect with younger voters have propelled him into the spotlight, as he aims to strengthen the party's influence in French politics and challenge the status quo."
 POLITICS_ROUSSEL_DESC: "Fabien Roussel is a prominent figure in the French Communist Party who has emerged as a significant leader in the aftermath of the Civil War. Born into a working-class family, Roussel's early experiences shaped his profound commitment to workers' rights and social justice. His political journey began as a local councilor, where he quickly gained recognition for his advocacy of labor issues and community empowerment. \n\nIn the wake of the Civil War, Roussel has become a unifying force for the left, striving to rebuild a fractured society and give voice to the disenfranchised. He embodies the resilience of the working class, advocating for a new socialist vision that prioritizes economic equity, environmental sustainability, and robust social services. Roussel's passionate speeches and grassroots organizing skills galvanize support among those who yearn for a more just and equitable France. \n\nHis leadership style emphasizes collaboration and solidarity, seeking to unite various factions of the left to challenge the status quo. As France grapples with the consequences of conflict, Roussel envisions a future where collective action leads to meaningful change, creating a society where every citizen has the opportunity to thrive and where the ideals of liberty, equality, and fraternity are truly realized."
 POLITICS_COQUEREL_DESC: "Éric Coquerel is a prominent leftist figure, known for his fierce advocacy for social justice and economic equality. Born in 1974, Coquerel was raised in a politically engaged family, which inspired his lifelong commitment to leftist causes. He has a background in economics and political science, and his activism spans decades, focusing on issues such as workers' rights, environmental justice, and anti-austerity measures. \n\nAs a member of the National Assembly, Coquerel is recognized for his passionate speeches and unyielding dedication to his constituents. He believes in the power of grassroots movements and collective action to bring about meaningful change. Coquerel's vision for France includes a commitment to social equity, sustainable development, and the revitalization of public services. He seeks to mobilize the left and unite diverse groups under a common cause, fighting for a France where everyone has access to opportunities and basic rights."
 POLITICS_BENEDETTI_DESC: "Yvan Benedetti is a fervent nationalist leader who has risen to prominence in the wake of the Civil War, embodying an unapologetic fascist ideology reminiscent of Benito Mussolini's early political aspirations. Born in 1980, Benedetti's formative years were steeped in a climate of political unrest, shaping his vision of a strong, authoritarian state that prioritizes the interests of native French citizens above all else. \n\nBenedetti advocates for a radical transformation of France, one that seeks to eliminate perceived threats to national identity and restore what he views as the country's former glory. His speeches resonate with those who feel disillusioned by traditional politics, promising a return to strong leadership and a rejection of multiculturalism. Benedetti's rhetoric is characterized by fiery nationalism, a disdain for liberal democracy, and a call for unity among those who share his vision of a homogeneous France. \n\nAs he consolidates power, Benedetti's leadership is marked by his ambition to create a centralized, authoritarian regime, echoing the early days of fascism in Italy. He seeks to dismantle existing political structures, replacing them with a new order that emphasizes loyalty to the state and a strict adherence to his vision of French identity. In a divided nation, Benedetti presents himself as the uncompromising champion of national pride, ready to seize control and redefine the future of France."

 

 FRA_form_a_scientific_committe_to_combat_the_pandemic: "Form A Scientific Commitee"
 FRA_form_a_scientific_committe_to_combat_the_pandemic_desc: "The new COVID-19 pandemic has already begun to spread at a rapid rate throughout France, Europe, and the wider world, after the local authorities in Wuhan and the rest of China failed to prevent its spread. While the pandemic will continue to spread and the virus isn't going away anytime soon, the first step to fighting the virus is understanding it, and to do that the French government will have to form a scientific committee. The committee, which will consist of experts from various fields such as pathology, biology, and economics, as well as individuals from various government agencies, will be able to draft an initial series of plans and recommendations for the French government to implement in our fight against COVID-19."
 FRA_research_the_vaccine: "Start Vaccine Research"
 FRA_research_the_vaccine_desc: "The SARS-CoV-2, popularly known as the covid-19 or coronavirus, has already proven to be highly infectious and capable of causing dangerous and potentially fatal diseases in those it infects, with many hospitals already running out of ventilators to help treat patients. While methods such as lockdowns and masking are already being considered and in some places implemented, it is clear that a vaccine will be required to truly put an end to the COVID-19 pandemic. The scientific committee has already met with delegates from major French biotechnology corporations, including Sanofi Pasteur, and has recommended that research and development of a vaccine begin immediately."
 FRA_enforce_a_lockdown_to_buy_time: "Proclaim Lockdown Mandate"
 FRA_enforce_a_lockdown_to_buy_time_desc: "The rapid spread of the COVID-19 pandemic has already begun to overwhelm the ability of many hospitals in France to receive new patients, and it is clear that drastic measures must be undertaken to prevent the further spread of the pandemic. The scientific committee has recommended mass lockdowns, which, while almost certainly leading to a severe chilling effect on the French economy in the near-term, will likely save tens of thousands of French lives and take a large amount of pressure off the national healthcare system."
 FRA_ease_the_restrictions: "Loosen The Mandate"
 FRA_ease_the_restrictions_desc: "It is clear that neither our economy nor society can handle the current lockdown restrictions. To ensure that our political situation doesn't spiral out of control, we must loosen some of our regulations. France will weather this storm."
 FRA_keep_the_restrictions: "Strengthen The Mandate"
 FRA_keep_the_restrictions_desc: "Our doctors gave us horrifying news. It seems the previous estimates about the fatality rates were too light. What is more horrifying is that almost 45% of our elderly are dying from it (compared to just 17% from the original predictions). While it is unclear why even the most drastic predictions were proven wrong or why some other nations seem to have less severe fatality rates (perhaps the virus we are exposed to is an evolved form of the original strain?), we cannot let our people suffer from it further."
 FRA_expand_welfare_payments: "Approve Stimulus Packages"
 FRA_expand_welfare_payments_desc: "While our economy has taken a drastic hit, our people need to be prioritized over it. Without work for months, it is clear many cannot survive without our support. We must protect our people first and foremost. We will pay for them for now."
 FRA_push_vaccine_research: "Cut Medicinal Yellow Tape"
 FRA_push_vaccine_research_desc: "The situation is too drastic for our old and unmovable bureaucracy. Our health workers must use all of our available resources to deal with this pandemic. They are our only hope."
 FRA_push_for_mass_vaccinations: "Enforce Vax Mandates"
 FRA_push_for_mass_vaccinations_desc: "With the first vaccines arriving, we can now spread them across France. We will mandate our government workers, military, and public services to vaccinate, and encourage our companies to follow this example. Of course, there is already pushback against this idea. Some people claim that we cannot force these vaccines on them. They are simply blind to the death that is unfolding even with our restrictions. We cannot pretend that everything is normal. Nothing is worth the risk."
 FRA_look_to_the_swedes: "Swedish Response, French Problem"
 FRA_look_to_the_swedes_desc: "The Swedish government had set a plan to have not set harsh COVID restrictions. As of now we still cannot know its effectiveness in terms of preventing the virus itself, yet we do know that the country managed to stabilize the economic scene. We should try to follow their example and make sure life goes on as normal. Just get more funding to hospitals, make some light restrictions and continue working everyone!"
 FRA_revitalise_the_economy: "Economic Revitalization Program"
 FRA_revitalise_the_economy_desc: "The COVID pandemic destroyed a large chunk of the world's economic growth. This is why continuing the mandates will do nothing but worsen the drawbacks of this crisis. We cannot let our country fail in this crucial moment!"
 FRA_develop_immunity: "Foster Immunity"
 FRA_develop_immunity_desc: "While max vaccinations might be the best way to do it, we simply cannot waste our limited resources and money on independent vaccine development. However, we must also be sure to not be dependent on American Pfizer. To do that, our Health Ministry has proposed to ''foster immunity'' with our people. This is a risky gamble, but if we put money into treating the severe symptoms while the rest self-medicate using government-approved ''symptom-remover'' medicines, it just might work. They will be able to continue work like nothing ever happened."

 FRA_Restart_of_the_protests: "The Revolution of the Vests"
 FRA_Restart_of_the_protests_desc: "Goddammit, of COURSE the yellow vests are also rioting. Great. National solidarity and unity my ass. We must make sure we deal with this crisis quickly, or their disruption can drag our entire recovery process down the drain!"
 FRA_push_through_reforms: "Bend The Knee"
 FRA_push_through_reforms_desc: "We really cannot deal with this right now. Our economy is in the gutter and our country has entirely halted all of its activity. We must do anything to salvage this situation. Agree to all of their terms."
 FRA_try_to_negotiate: "The Negotiation Table"
 FRA_try_to_negotiate_desc: "As bad as it might be... we might be able to work around it. We should try and see if they can limit their ambitions. Maybe this can work out?"
 FRA_the_negotiations_fail: "Divide and Conquer"
 FRA_the_negotiations_fail_desc: "Fine, if they want to do it rough, we will. Send the police to break up the protests, show the burned cars and destruction they have caused. France will know of their ''heroes''."
 FRA_accept_modifications: "A Happy Middle Ground"
 FRA_accept_modifications_desc: "An amazing negotiation! With this, we can both appease the Yellow Vests and not lose as much money on social spending! France has always been known for caring about their workers, and now it was proven."
 FRA_negotiate_with_the_syndicates: "Work With the Unions"
 FRA_negotiate_with_the_syndicates_desc: "We must show the world that these rioters do not represent the working frenchman. Use the unions and their support of our establishment to quell the fires. Bribe the unions who joined the protests to disavow them. France will not bend the knee to violent thugs."
 FRA_back_to_normalcy: "Cement Reforms"
 FRA_back_to_normalcy_desc: "As per agreement with the Yellow vests, we will cement our reforms in our law. France has managed to survive yet another crisis!"
 
 FRA_The_Opening_Volley: "The Opening Volley"
 FRA_The_Opening_Volley_desc: "Ever since their formation in the 70s, the National Front has been a tumultuous force in French politics. While Marine Le Pen has worked hard to root out Fascist and Pétainist elements from the party, it is still considered by many to be a far right movement. Nevertheless, Le Pen has announced her campaign for president in 2022, and with the major economic issues and unrest facing France, many believe she represents a serious threat to Macron's bid to continue serving as the president of France. Only time will tell who will win the election, but the result is sure to inspire anger and polarization regardless."
 FRA_en_marche: "March With Macron"
 FRA_en_marche_desc: "Macron's victory in 2016 gave France the opportunity to finally have a republic free of radicalism and political instability, a republic that would bring peace and security to Europe and the world through collaboration and understanding, but use force when necessary against tyrannical forces. A republic that would grant new opportunities for minorities and immigrants to partake in a multicultural France while also respecting the honorable culture of France. A republic that would truly live up to the revolutionary motto of Liberté, égalité, fraternité. This is a republic that the treasonous fascists in the National Front wish to destroy, but Macron's upcoming victory in the 2022 election will see their dark hopes scattered for a final time."
 FRA_rassemblent_national: "Look To Le Pen"
 FRA_rassemblent_national_desc: "For decades, the National Front has remained on the fringes of French politics, only occasionally rising up just to fall back down into irrelevance, but with Marine Le Pen's campaign, that is finally changing. Macron's liberal establishment policies have clearly led to the near ruin of France, and it is time for change. No longer will France give up its sovereignty to unelected supranational organizations, and no longer will the will of the French people be overridden by bureaucrats in Brussels. Liberal elitists will not be given the opportunity to tear down the social safety net of the French people. Violent hordes of Islamists won't enforce their fanatic religious extremism on the French people any longer. No, in 2023 France will be free."
 FRA_the_west_african_sphere: "§YOpération§!: Éléphant"
 FRA_the_west_african_sphere_desc: "Our interests in Africa have always been obvious. The lands that used to be our colonies are still tied to us economically, linguistically and militarily. Many of the ''leftists'' claim that we must abandon this region, seeing our attempts at stabilizing this region as ''neocolonialism.'' Yet they do not understand that we cannot abandon our Francophone brethren to be eaten by jihadist and Russian-backed juntas. We must focus our efforts to bring the region under control."
 FRA_economic_assistance: "Economic Intervention" 
 FRA_economic_assistance_desc: "Our Francophone friends have always had a difficult economic situation. Constantly assaulted by insurgents, they have always been unable to develop their domestic industries as successfully as Nigeria to their south. We must change that. Our funds will reinvigorate the West African economy. And of course some of that wealth will return to us..."
 FRA_military_assistance: "Military Aid"
 FRA_military_assistance_desc: "While the economic situation in the West African region is always in need of a boost, nothing can be achieved without stabilizing the regional conflicts. Our forces have bled in this region for a decade now, yet without local government fielding effective armies it will all be for naught. Ensuring a strong network of local armies under our coordination will be key in our future plans."
 FRA_combat_islamic_terrorism: "Quell Islamic Extremism"
 FRA_combat_islamic_terrorism_desc: "While Russian influence is a looming threat that looms over our African projects, the jihadists are a more pressing threat. Dealing with them will be our immediate concern. It's not like the Russians and their puppets want the islamists to rule either. Aside from our francophone partners, cooperation from Nigeria will be essential in this operation."
 FRA_cease_social_dumping: "Cease Social Dumping"
 FRA_cease_social_dumping_desc: "We must put our people first. Our poorer areas are plagued by companies infringing on their labor. Our workers must be paid more, for it is the French ideal to cater to our rural regions."
 FRA_tackle_trade_unions: "Crush Trade Unions"
 FRA_tackle_trade_unions_desc: "The communists always criticize us for ''not supporting the workers'' yet it is the trade Unions that constantly bicker with our industries. Their constant protests, riots, and strikes do nothing but disrupt our country's stability. Shut them down!"
 FRA_pension_reform: "Pension Reform"
 FRA_pension_reform_desc: "In a bold step towards securing France's long-term economic future, the government has decided to raise the retirement age from 62 to 64. This reform is aimed at ensuring the sustainability of the pension system while adapting to the realities of an aging population and increasing life expectancy. Proponents highlight the positive impact this change will have on public finances, allowing for continued investment in social services and economic growth. While some sectors express concern, the government is confident that this necessary adjustment will foster greater resilience in the economy, promoting fairness for future generations and protecting the integrity of France's social safety net."
 FRA_eu_recovery_instrument: "EU Recovery Instrument"
 FRA_eu_recovery_instrument_desc: "While Le Pen argues that the Union is holding us back economically, it is not the case. Be it the inner-union migration or the unified market, our influence lets us achieve greater heights as long as we are united."
 FRA_support_european_federalization: "Support European Federalization"
 FRA_support_european_federalization_desc: "While we are still considered a great power, that is not entirely the case. The Americans walk over the Europeans militarily and economically. The Chinese flood our markets with cheap goods. The global south does not respect us and refuses our advice. Even Russia, a state we considered defeated and battered beyond recovery, has raised its head once more and is trying to recover their lost power. So why shouldn't we? Are Europeans, the birthplace of modern statehood, culture and technology not worthy to regain their rightful place under the sun? We must unite, for only that way can we become a great power once more!"
 FRA_immigration_regulation: "Immigration Regulation"
 FRA_immigration_regulation_desc: "The unending wave of migrants reaching our shore has long since been a topic of political discussion. While previous governments assured us that we could assimilate these people due to the fact most of them are coming from our long-lost colonies, it is clear we cannot integrate them fast enough. Lawless ghettos where no police force is present are a staple near our large cities. Our teachers are beheaded for defending the French ideal of religious deconstruction and analysis. Our women are afraid to travel the streets at night without an escort out of fear of a thug mob assaulting them. Not to mention Islamic terrorism. We need to fix our system, and stopping immigration is the way we can start doing it."
 FRA_increase_corporate_tax: "Increase Corporate Tax"
 FRA_increase_corporate_tax_desc: "The corporations have done nothing but leech off of the common Frenchman. While we can blame Macron for the current government deficit, we must also find solutions. Taxing the corporations and favoring small businesses will not only return a semblance of balance in the inner market but also flood the treasury with the money we need to fund our future projects. "
 FRA_strengthen_protectionism: "Strengthen Protectionism"
 FRA_strengthen_protectionism_desc: "Why should we let our businesses and industries suffer and die while cheap goods flood the market? We will not stand for it!"
 FRA_support_nuclear_power: "Support Nuclear Power"
 FRA_support_nuclear_power_desc: "We are unlike the Germans who refuse nuclear power in favor of ''green'' energy. We are smarter!"
 FRA_criticize_the_eu: "Criticize the EU"
 FRA_criticize_the_eu_desc: "What has the EU done for us? Flood our markets with cheaper goods, destroying our industries in favor of those from the East. And for what? For ''unity''? The Eurocrats have been a pain for our nation to deal with. We must combat their influence before it's too late."
