 FAF_brick_by_brick_idea: "Brick by Brick"
 FAF_brick_by_brick_idea_desc: "This nation of ours was built with the sweat of our brow, the blood of our people, and the sacrifice of numerous generations. Following our defeat in the Russo-European war, our country now lies in ruins. Our homes were reduced to rubble and our factories flattened to dust. Discontent grows across the country and separatist movements enlarge day by day. It is vital that we bring back our nation's lost glory and pride. Piece by piece and brick by brick we must uplift France from its current situation back to prosperity."
