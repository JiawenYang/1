 DSW_SOV_industry_program_1:0 "军工扩建计划"
 DSW_SOV_industry_program_1_desc:0 "每90天自动在俄罗斯拥有且完全控制的核心地区建成1座军用工厂，并补足对应建筑槽位。当前批次结束后采用新周期；本土暂时无处建设时保留订单，恢复条件后补建。\n\n距下批投产：[?DSW_SOV_industry_days_remaining|0]天\n累计建成军用工厂：[?DSW_SOV_industry_built_military|0]座\n累计建成民用工厂：[?DSW_SOV_industry_built_civilian|0]座"
