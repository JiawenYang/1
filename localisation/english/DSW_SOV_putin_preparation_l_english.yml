 DSW_SOV_putin_spirit_18_desc:0 "以航空、海上与远程火力共同压制敌军运输枢纽和保障体系。统一目标选择与情报评估，让纵深打击与地面战役形成连续配合。\n\n完成对应国策后永久生效，可与本国策树其他民族精神叠加。"
