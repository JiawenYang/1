 DSW_SOV_putin_focus_1:0 "审视特别军事行动"
 DSW_SOV_putin_focus_1_desc:0 "初期战事暴露了指挥、供应与情报衔接中的缺口。普京要求总参谋部逐项复盘，把前线经验转化为明确的整军计划，以持续投入取代临时补救。"
 DSW_SOV_putin_spirit_01:0 "审视特别军事行动"
 DSW_SOV_putin_spirit_01_desc:0 "初期战事暴露了指挥、供应与情报衔接中的缺口。普京要求总参谋部逐项复盘，把前线经验转化为明确的整军计划，以持续投入取代临时补救。\n\n完成对应国策后永久生效，可与本国策树其他民族精神叠加。"
 DSW_SOV_putin_focus_2:0 "重整战时经济"
 DSW_SOV_putin_focus_2_desc:0 "长期行动需要稳定的产业与财政基础。政府将统一协调工业订单、关键投资和能源供给，让生产体系与前线需求相互衔接，为下一阶段动员预留空间。"
 DSW_SOV_putin_focus_3:0 "纠正谢尔久科夫改革"
 DSW_SOV_putin_focus_3_desc:0 "对过去改革的得失进行全面清查，恢复被削弱的动员、保障和院校体系，同时保留有价值的信息化成果。俄军需要能支撑长期高强度作战的组织结构。"
 DSW_SOV_putin_spirit_03:0 "纠正谢尔久科夫改革"
