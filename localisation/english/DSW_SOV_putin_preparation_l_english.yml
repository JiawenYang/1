 DSW_SOV_putin_focus_19_desc:0 "由侦察和工兵查明薄弱地段，以集中火力打开通路，再由合成部队实施突破与纵深穿插。机动必须与补给、侧翼掩护和后续梯队同步展开。"
 DSW_SOV_putin_spirit_19:0 "纵深穿插与合成突破"
 DSW_SOV_putin_spirit_19_desc:0 "由侦察和工兵查明薄弱地段，以集中火力打开通路，再由合成部队实施突破与纵深穿插。机动必须与补给、侧翼掩护和后续梯队同步展开。\n\n完成对应国策后永久生效，可与本国策树其他民族精神叠加。"
 DSW_SOV_putin_focus_20:0 "扩建军工生产基地"
 DSW_SOV_putin_focus_20_desc:0 "扩大军用工厂和配套设施的建设，把长期军品订单落实为稳定产能。供电、运输、厂房和技术工人的投入将与生产扩张一并推进。"
 DSW_SOV_putin_focus_21:0 "统筹战时劳动力配置"
 DSW_SOV_putin_focus_21_desc:0 "在军工、基础设施和民生部门之间统筹劳动力，扩大职业培训并改善关键岗位的留用。合理配置劳动资源，保证扩产计划拥有持续的人力支撑。"
 DSW_SOV_putin_focus_22:0 "保障民生与基本供应"
 DSW_SOV_putin_focus_22_desc:0 "通过稳定食品、能源与日用品供应巩固后方秩序。完善基本保障和价格协调，让居民能够承受长期动员带来的压力，并维持国内生产与消费。"
 DSW_SOV_putin_focus_23:0 "深化中俄产业协作"
 DSW_SOV_putin_focus_23_desc:0 "与中国扩大设备、零部件和技术合作，改善跨境运输与结算渠道。共同的产业项目将补强供应链，支持俄罗斯在外部制裁下继续扩充生产。"
 DSW_SOV_putin_focus_24:0 "拓展能源出口与结算"
 DSW_SOV_putin_focus_24_desc:0 "扩大可靠市场的能源合作，建设运输、储存与结算渠道，以持续出口支撑国内工业投入。贸易收入将转化为基础设施与生产保障能力。"
 DSW_SOV_putin_focus_25:0 "完善国家动员体系"
 DSW_SOV_putin_focus_25_desc:0 "建立明确的动员、训练与补充流程，在保持关键行业运行的同时扩充可用预备力量。动员制度必须能够把人力送入合适岗位，并为其提供必要训练。"
 DSW_SOV_putin_focus_26:0 "扩大战时产能"
 DSW_SOV_putin_focus_26_desc:0 "围绕关键装备与弹药组织新一轮扩产，完善工序衔接、原料储备和厂区设施。把临时增加的订单转化为持续、稳定且能够快速调整的生产能力。"
 DSW_SOV_putin_focus_27:0 "建立平行进口保障网"
 DSW_SOV_putin_focus_27_desc:0 "规范平行进口的采购、运输与结算，为设备维护和关键生产补足缺口。通过多元供应渠道降低外部限制的影响，并争取国产替代所需的时间。"
 DSW_SOV_putin_focus_28:0 "本币结算与金融自主"
 DSW_SOV_putin_focus_28_desc:0 "扩大本币结算和替代支付渠道，稳定国内信贷与对外贸易融资。以更可靠的金融安排保障工业投资，减少外部金融波动对长期整备的干扰。"
 DSW_SOV_putin_focus_29:0 "推进军工体系国有化"
 DSW_SOV_putin_focus_29_desc:0 "将军工复合体的关键订单、投资与供应纳入统一协调，强化国家对战略企业的控制。以集中规划消除产能瓶颈，保障整备计划优先获得设备和技术。"
 DSW_SOV_putin_focus_30:0 "确立战时统筹经济"
 DSW_SOV_putin_focus_30_desc:0 "完成工业、财政、交通和能源部门的战时统筹，使军需与基本民生获得稳定保障。统一资源调配将为接下来的持续攻势提供足够的生产与建设能力。"
 DSW_SOV_integrate_novorossiya:0 "新俄罗斯并入联邦"
 DSW_SOV_integrate_novorossiya_desc:0 "统一新俄罗斯与顿巴斯地方政权的行政、军队和保障体系，将其纳入俄罗斯联邦。整合既有机构和基础设施，为居民提供统一的身份、供应与公共服务。"
 DSW_SOV_putin_spirit_31:0 "新俄罗斯并入联邦"
 DSW_SOV_putin_spirit_31_desc:0 "统一新俄罗斯与顿巴斯地方政权的行政、军队和保障体系，将其纳入俄罗斯联邦。整合既有机构和基础设施，为居民提供统一的身份、供应与公共服务。\n\n完成对应国策后永久生效，可与本国策树其他民族精神叠加。"
 DSW_SOV_final_offensive:0 "最终攻势"
 DSW_SOV_final_offensive_desc:0 "整军和战时经济建设已经形成合力。普京批准总参谋部提交的完整行动方案，解除乌克兰全境的未经计划的攻势限制，以持续补给、联合火力与合成突击展开最终攻势。"
 DSW_SOV_putin_spirit_32:0 "最终攻势"
 DSW_SOV_putin_spirit_32_desc:0 "整军和战时经济建设已经形成合力。普京批准总参谋部提交的完整行动方案，解除乌克兰全境的未经计划的攻势限制，以持续补给、联合火力与合成突击展开最终攻势。\n\n完成对应国策后永久生效，可与本国策树其他民族精神叠加。"
 DSW_SOV_integrate_novorossiya_tt:0 "将新俄罗斯（NOV）、顿涅茨克（DPR）、卢甘斯克（LPR）的全部既有核心变为俄罗斯核心，并吞并仍存在且未与俄罗斯交战的上述政权，接收其部队。没有对应政权时仍可获得其既有核心。"
 DSW_SOV_clear_all_ukraine_tt:0 "清除乌克兰全部核心地区、既定交战区域及仍带有攻势惩罚地区的“未经计划的攻势”（包括旧 TFR 版本）。开启最终攻势阶段；乌克兰投降进度达到 70% 时，按现有剧情触发北约介入。"
 DSW_SOV_putin_industry_dynamic:0 "战时工业与动员体系"
 DSW_SOV_putin_industry_dynamic_desc:0 "工业、贸易、民生与动员国策逐项追加到同一民族精神。完整完成本树后，本树提供的工厂产出合计 +30%、生产效率增长 +10%、生产效率上限 +25%、建造速度 +20%、军用工厂专项建造速度另加 +20%。每项国策只累计一次，其他法律与科技另行叠加。"
