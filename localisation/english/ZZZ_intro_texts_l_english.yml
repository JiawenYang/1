 FRA_MODERN_DAY_DESC: "The Fifth Republic still lives under the shadow of weak growth and high unemployment: growth fell short of one and a half percent in 2016, unemployment hovers around ten percent and youth joblessness is far higher. The presidential election of May 2017 will set the country's course, and for the first time it is an open question whether the two parties that have governed since 1958 can hold the runoff. As a founding member of the European Union and a permanent member of the UN Security Council, France shares with Germany the leadership of European integration after Brexit, while deploying several thousand troops to the Sahel under Operation Barkhane and keeping a state of emergency at home.\nEconomic reform, the direction of the Union and social cohesion will all be settled by the next occupant of the Élysée."
 RAJ_MODERN_DAY_DESC: "India is the overwhelming power of the South Asian subcontinent: one point three billion people and an economy of roughly 2.6 trillion dollars, growing faster than any other major economy. The demonetisation of November 2016 withdrew more than eighty percent of circulating cash and shook the cash economy of town and village alike; the goods and services tax due in July 2017 is meant to weld the states' fragmented tax regimes into one nation, one tax.\nAbroad, New Delhi deepens defence cooperation with Washington while keeping its long arms relationship with Moscow, and works South East Asia through its Act East policy; nuclear weapons under a no-first-use pledge remain the strategic floor. The insurgency in Kashmir, an undemarcated frontier with China and a still-closed door to the Nuclear Suppliers Group remain the stubborn problems of a country that wants a permanent seat in the Security Council."
 IND_MODERN_DAY_DESC: "Indonesia is seventeen thousand islands and two hundred and sixty million people, the largest Muslim country in the world and the de facto centre of ASEAN. The government of Joko Widodo has pushed the budget towards ports, railways and power stations in an attempt to stitch the archipelago together with infrastructure, while the 2016 tax amnesty made room for that spending.\nJakarta keeps deliberately quiet on the South China Sea, yet its vessels have faced Chinese fishing fleets and coast guard ships off the Natuna Islands more than once, and the separatist conflict in Papua still absorbs army units. An old member of the Non-Aligned Movement, Indonesia now bills itself as a global maritime fulcrum and balances carefully between Washington and Beijing."
 AST_MODERN_DAY_DESC: "Australia's twenty-four million people are spread across nearly seven point seven million square kilometres. The investment phase of the mining boom is over and growth has settled near two and a half percent. China takes more than a third of Australian exports; iron ore, coal and liquefied natural gas leave Canberra caught between security and prosperity, an anchor of the American alliance system that cannot do without its largest Asian customer.\nThe Turnbull government promised rearmament in its 2016 defence white paper and seals the sea approaches under Operation Sovereign Borders. The continent is learning a difficult lesson: how to keep strategic autonomy while owing its defence to one partner and its income to another."
 SPR_MODERN_DAY_DESC: "Spain has only just climbed out of the abyss of the sovereign debt crisis: unemployment is still near nineteen percent, youth unemployment close to forty, and public debt stands at about a hundred percent of output. The minority government of Mariano Rajoy struggles through parliament, while the independence demand in Catalonia puts the old quarrel over constitutional order and regional self-rule back on the table.\nAs a member of the European Union and NATO, Madrid refuses to yield on Gibraltar and bears migration pressure at its enclaves of Ceuta and Melilla on the Moroccan coast. A booming tourist trade sustains the recovery, yet leaves the country more dependent than ever on conditions abroad."
 PRC_socialist_chinese_dream_idea_desc: "The socialist Chinese Dream binds national rejuvenation to party governance: research money is expected to serve state goals, and universities and think tanks are pressed to turn academic output into usable policy and engineering capacity. Under this framework innovation is not a spontaneous market outcome but a task broken down item by item in five-year plans, and the measure of success is how quickly it can be fielded."
 SOV_integralists_idea_desc: "In Russian usage the Integralists are neither liberals nor old-style communists: they argue for rebuilding the state's politics and economy around the Eurasian space, placing sovereignty, tradition and mobilisation above market efficiency. As long as this current holds a place at the centre of power, decisions in the Kremlin will be more concentrated, more assertive, and more inclined to treat foreign policy as a civilisational contest."
 BRA_MODERN_DAY_DESC: "Brazil has just come through the worst recession in its history: output shrank by more than seven percent across 2015 and 2016, unemployment passed twelve percent, and the Lava Jato corruption probe dragged political and business elites down together. In August 2016 Dilma Rousseff was impeached and Michel Temer took office as acting president, immediately pushing a constitutional amendment capping federal spending for twenty years to reassure markets and rating agencies.\nThe South American giant has Latin America's largest industrial base and the world's fifth largest population, yet it is also called the country of the future that always will be. Whether it can turn the low growth that followed the commodity boom into institutional reform is the question the 2018 election must answer."
 ISR_MODERN_DAY_DESC: "Nearly seventy years after independence Israel has moved from the question of survival to the question of definition: its population has passed eight million, output per head ranks among the developed world's highest, and it exports cyber, medical-device and agricultural technology around the globe. Yet the Palestinian question under occupation remains unresolved; the passage of Security Council Resolution 2334 at the end of 2016 marked the first explicit international legal rejection of settlement expansion and cast a shadow over Jerusalem's relations with the incoming Washington administration.\nTo the north, the Syrian civil war has brought Iran's Revolutionary Guard and Hezbollah to the edge of the Golan; to the south, the blockade of Gaza and periodic military operations consume both moral standing and manpower. The state must find a durable balance between its Jewish and its democratic identity."
 ETH_MODERN_DAY_DESC: "Ethiopia is one of Africa's fastest-growing large economies, averaging nearly ten percent a year for a decade, and the Addis Ababa-Djibouti railway together with its industrial parks have given the landlocked country its first real route to industrialisation. Yet the Grand Renaissance Dam on the Blue Nile has turned the dispute over Nile water into a near-confrontation with Egypt and Sudan.\nIn October 2016 protests in Oromia forced the government to declare a nationwide state of emergency; the ruling EPRDF monopolises politics in the shape of a development coalition and stretches federal ethnic autonomy to breaking point. Home to the African Union's headquarters, Ethiopia is trading state-led investment for stability, at the price of a narrowing political space."
 FIN_MODERN_DAY_DESC: "After three years of near-stagnation in 2015 and 2016, Finland has only just returned to growth: exports were dragged down by European demand and by the industrial restructuring that followed Nokia, and the government answered with a competitiveness pact to hold down unit labour costs and Europe's first nationwide basic income experiment. As a eurozone member it has no independent monetary policy; as a militarily non-aligned state it keeps an enhanced partnership with NATO without ever crossing the line into membership.\nThe more than thirteen hundred kilometres of border with Russia is the country's heaviest geographic fact. Helsinki must hold a fragile balance between European norms, the NATO guarantee and Moscow's tolerance."
 ITA_MODERN_DAY_DESC: "Italy is the eurozone's third largest economy and one of its most heavily indebted: debt stands at about one hundred and thirty-two percent of output, unemployment remains above eleven percent and youth joblessness near forty. The defeat of Matteo Renzi's constitutional referendum in December 2016 brought him down and handed power to Paolo Gentiloni's technocratic government, while the rescue of Monte dei Paschi that same month became another test case for eurozone bank clean-up.\nOn the Mediterranean, migrant boats from Libya keep arriving in Sicily and Lampedusa, forcing EU border and asylum policy onto Italy's political agenda, while the populist convergence of the Five Star Movement and the Northern League is turning the 2018 election into a referendum on the established order."
 SWE_MODERN_DAY_DESC: "Sweden took in more than one hundred and sixty thousand asylum seekers in 2015 and then sharply tightened its borders, pushing a welfare state that prides itself on humanitarianism into a national argument about integration, housing and the finances of the welfare system. The economy is still growing, but the housing bubbles in Stockholm and Gothenburg, and suppressed household debt, keep the macroprudential authorities from loosening their grip.\nMilitarily, the country that has been non-aligned for two centuries reopened the NATO debate after Crimea, restored a permanent defence presence on Gotland and raised the defence budget. For Sweden neutrality is no longer a default condition but a choice whose costs must be argued again and again."
 NRY_MODERN_DAY_DESC: "Norway has locked its oil revenue inside the world's largest sovereign wealth fund, worth close to nine hundred billion dollars by early 2017, which allowed it to sustain welfare and investment through two years of falling oil prices. A member of the European Economic Area rather than the European Union, Oslo accepts most single-market rules from Brussels while keeping exemptions for fisheries, agriculture and immigration.\nOn the border with Russia in Finnmark and at its Arctic outpost on Svalbard, Norway carries NATO's northern reconnaissance and deterrence duties. A country of little more than five million people has bought influence with energy wealth and security with alliance membership, and both must be managed carefully among the great powers."
 heavy_frigate_desc: "The heavy frigate trades hull size for ocean-going seaworthiness and payload: phased-array radar, vertical launch cells and an anti-submarine helicopter let it act as both the air-defence picket and the ASW core of a task group. Costlier and longer-legged than a light frigate, it is built for escort, blockade and blue-water patrol."
