l_english:
 ZZZ_europe_war:0 "Continental War"
 ZZZ_eur_escalate:0 "Push the War onto the Continent"
 ZZZ_eur_escalate_desc:0 "The Ukrainian front has stalled into a European question. Order the western military districts to full readiness and extend the operation beyond the old Soviet perimeter."
 zzz_eur.1.t:0 "The Fuse of the Continent"
 zzz_eur.1.d:0 "What began as a war over Ukraine has crossed the old demarcation line. Columns are moving west of the Vistula, air corridors over the Baltic are closed, and every European capital is being asked the same question: whether the settlement of 1991 still holds. The continental war has begun, and no one can promise it will stay conventional."
 zzz_eur.1.a:0 "Europe stands on the edge again."
 zzz_eur.2.t:0 "The Ebb of the Eastern Front"
 zzz_eur.2.d:0 "The Russian advance has collapsed. Estonian, Latvian and Lithuanian units have re-established themselves along their old borders, Polish administration has returned to the Vistula basin, and the Ukrainian government is back in its capital. The war ends where the maps of the early 1990s said it should, and the eastern question is left open rather than settled."
 zzz_eur.2.a:0 "The Eastern bloc withdraws to its old borders."
 zzz_eur.3.t:0 "From the Vistula to the Baltic"
 zzz_eur.3.d:0 "The western coalition has broken. Baltic cabinets have been replaced by administrations answerable to Moscow, Poland and Ukraine have been reduced to dependent states, and the Russian flag flies over the approaches to the Baltic coast. The continent's order is being redrawn to Moscow's scale, and the cease-fire is only a pause in the argument."
 zzz_eur.3.a:0 "The continent's order is redrawn to Moscow's measure."
 zzz_eur.4.t:0 "A Cease-Fire Without Victors"
 zzz_eur.4.d:0 "Neither coalition could force a decision. The front has stopped moving, the depots are empty, and both sides have accepted a cease-fire along the positions they happen to hold. No border has changed and no government has fallen; the war simply stops, and the question it was fought over is handed to the next generation."
 zzz_eur.4.a:0 "The front stops where it stands."
