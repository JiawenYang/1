l_english:
 KOR_safety_law: "Tacit Exploitation"
 KOR_safety_law_desc: "Korea's economic growth arrived like a miracle, but that miracle casts a deep shadow.\nThe law may guarantee workers' rights, yet in the provinces the minimum wage has long been a dead letter. Working hours consistently rank among the longest in the OECD, while arrangements such as the 'inclusive wage system' prevent fair compensation for overtime.\nKorean society thus permits an undeniable 'tacit exploitation' of labor.\n\n- Observe the Labor Standards Act! (Jeon Tae-il)"
 KOR_police_law: "National Security Act"
 KOR_police_law_desc: "The purpose of this law is to secure the security of the nation and the survival and freedom of the people by regulating anti-state activities that endanger the security of the nation.\n\nAnyone who praises, encourages, propagates, or sympathizes with the activities of an anti-state group, its members, or those under its orders, with the knowledge that it jeopardizes the existence, security, or basic liberal democratic order of the nation, or who propagates or incites national rebellion shall be punished by imprisonment for not more than 7 years."
 KOR_korean_welfare: "Integrated Social Protection"
 KOR_korean_welfare_desc: "[Root.GetAdjective] social security system consists of three pillars: social insurance, public assistance, and social services. To protect citizens from basic risks to their livelihoods, enrollment in national health insurance, the national pension, employment insurance, and industrial accident insurance is compulsory. The national basic livelihood security system guarantees a minimum standard of living to low-income households struggling to survive, while the state also provides many forms of support for other vulnerable groups. [Root.GetName]'s social security system has developed steadily, but blind spots remain in its net and prevent it from fully advancing the welfare of every citizen."
