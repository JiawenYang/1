 KOR_korean_immigration: "Difficult to Obtain Citizenship"
 KOR_korean_immigration_desc: "With the overwhelming majority of its population belonging to a single ethnic group, [Root.GetName] shares a powerful nationalism grounded in common ancestry and historical consciousness. Foreigners hoping to immigrate must not only pass an exceptionally demanding citizenship examination, but also endure an exclusionary social gaze."
