 KOR_equal_female: "Gender Equality"
 KOR_equal_female_desc: "[Root.GetName]'s constitution and statutes explicitly guarantee equality between men and women, and women rank highly in educational attainment and labor participation. In practice, however, the gender pay gap remains among the widest in the developed world, women struggle to reach senior positions because of childcare and household burdens, and the birth rate continues to fall. Equality on paper has not automatically produced equality in substance."
