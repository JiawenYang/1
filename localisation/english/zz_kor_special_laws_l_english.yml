 KOR_korean_education: "Education for College"
 KOR_korean_education_desc: "[Root.GetAdjective] society is distinguished above all by its fervor for education. [Root.GetName] mandates schooling through middle school; high school is optional, but the government supports tuition-free education for every student. [Root.GetAdjective] students therefore complete all of secondary education without tuition. Yet in a society where the university enrollment rate approaches seventy percent, attending university is already considered a necessity rather than a choice. Public education consequently faces criticism for concentrating exclusively on 'education for university admission.'"
