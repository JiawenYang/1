l_english:
 ZZZ_equipment_localization: "Equipment Localization"
 ZZZ_equipment_localization_01: "Fully Import-Dependent"
 ZZZ_equipment_localization_01_desc: "The armed forces rely almost entirely on foreign suppliers. Spare parts, ammunition and platforms must be imported, so any disruption in the supply chain quickly cripples the army in the field."
 ZZZ_equipment_localization_02: "Highly Import-Dependent"
 ZZZ_equipment_localization_02_desc: "Most heavy equipment and key components still come from abroad. Domestic plants assemble only a fraction of what the army needs, leaving the force exposed to foreign embargoes and shipping delays."
 ZZZ_equipment_localization_03: "Partially Self-Sufficient"
 ZZZ_equipment_localization_03_desc: "Domestic industry covers part of the army's needs, but critical subsystems and modern platforms are still imported. The military can keep fighting for a while, though shortages appear under sustained pressure."
 ZZZ_equipment_localization_04: "Basically Self-Sufficient"
 ZZZ_equipment_localization_04_desc: "The domestic defence industry meets the bulk of the army's requirements. Imports are limited to specialised components, giving the armed forces a solid base for prolonged operations."
 ZZZ_equipment_localization_05: "Highly Self-Sufficient"
 ZZZ_equipment_localization_05_desc: "Domestic plants supply nearly all equipment the army needs, from small arms to vehicles. Foreign dependence is marginal, and the force can absorb supply shocks without collapsing."
 ZZZ_equipment_localization_06: "Fully Self-Sufficient"
 ZZZ_equipment_localization_06_desc: "A complete domestic defence industrial base supplies the army with virtually all its equipment. Strategic independence keeps the force fighting even when foreign supply lines are cut."
 BLOCK_SALARY_DECREASE_TT: "The current labour framework forbids any reduction of the minimum salary."

