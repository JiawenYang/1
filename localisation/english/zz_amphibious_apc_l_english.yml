 ZZ_amphibious_apc_chassis: "Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_chassis_0: "Early Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_chassis_1: "Gen 1 Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_chassis_2: "Gen 2 Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_chassis_3: "Gen 3 Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_chassis_4: "Gen 4 Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_chassis_desc: "Tracked amphibious fighting vehicles such as the AAV7 and ZBD-05, with full firepower, protection and mobility modules, purpose-built for ship-to-shore assault and riverine operations."
 ZZ_amphibious_apc_chassis_0_desc: "Early Cold War tracked amphibious carriers with limited speed and protection, but already built around a fully modular chassis."
 ZZ_amphibious_apc_chassis_1_desc: "Tracked amphibious fighting vehicles such as the AAV7 and ZBD-05, with full firepower, protection and mobility modules, purpose-built for ship-to-shore assault and riverine operations."
 ZZ_amphibious_apc_chassis_2_desc: "A new generation of amphibious assault vehicle with a more powerful powerpack and reinforced armor, greatly improving firepower and survivability after landing while retaining full swimming capability."
 ZZ_amphibious_apc_chassis_3_desc: "A more mechanized amphibious fighting vehicle with digital fire control and a stronger powerpack, suited to high-intensity over-the-beach operations."
 ZZ_amphibious_apc_chassis_4_desc: "A new generation amphibious fighting vehicle with composite armor and active protection modules, able to keep up assault speed under shore fire."
 ZZ_amphibious_apc_tech: "Amphibious Fighting Vehicle"
 ZZ_amphibious_apc_tech_desc: "Unlocks the amphibious fighting vehicle chassis, allowing the design of tracked amphibious fighting vehicles such as the AAV7 and ZBD-05 with full firepower, protection and mobility modules."
 tank_designer_ZZ_amphibious_apc_chassis: "Amphibious Fighting Vehicle"
 tank_designer_ZZ_amphibious_apc_chassis_is_role_disallowed: "This design cannot be converted to the §HAmphibious Fighting Vehicle§! role.\n\nThe amphibious fighting vehicle is a separate chassis line; design it directly on an amphibious fighting vehicle chassis."
