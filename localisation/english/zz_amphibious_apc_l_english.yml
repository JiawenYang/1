l_english:
 ZZ_amphibious_apc_chassis_aavp7a1: "AAVP-7A1"
 ZZ_amphibious_apc_chassis_aavp7a1_desc: "Mainstay amphibious carrier of the US Marine Corps, fully swim-capable and designed for beach landing operations."
 ZZ_amphibious_apc_chassis_zbd05: "ZBD-05"
 ZZ_amphibious_apc_chassis_zbd05_desc: "China's new-generation high-speed amphibious fighting vehicle with a planing hull and waterjet propulsion, holding world-leading swim speed for cross-sea landing operations."
 ZZ_amphibious_apc_chassis_kaav7: "KAAV7"
 ZZ_amphibious_apc_chassis_kaav7_desc: "Licensed Korean derivative of the AAV7A1 with local improvements, the primary amphibious assault vehicle of the ROK Marine Corps."
 ZZ_amphibious_apc_chassis_lvtp5: "LVTP-5"
 ZZ_amphibious_apc_chassis_lvtp5_desc: "American tracked amphibious carrier fielded in the 1950s, landing a reinforced platoon on contested beaches, replaced by the AAV7 series from the 1970s."

 ZZ_amphibious_mechanized_equipment: "Amphibious APC"
