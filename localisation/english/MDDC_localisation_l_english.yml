 redux_generic.5.d: "Our country has finally managed to free itself from the influence of American Economic Hegemony, and we are now ready to build our own path to a successful nation."
 redux_generic.5.a: "Finally!"
 redux_generic.6.t: "[FROM.GetName] has abandoned the Petrodollar!"
 redux_generic.6.d: "Another country has stopped recognizing our politics.It seems that we are really losing influence over the economic system."
 redux_generic.6.a: "We need to do something about it."
