l_english:
 zzz_party.10.t:0 "The White House Changes Hands"
 zzz_party.10.d:0 "The Republican candidate won the 2016 election. The new president is sworn in, and Washington shifts from liberalism to conservatism."
 zzz_party.10.a:0 "Accept the result"
 zzz_party.14.t:0 "Labour Takes Downing Street"
 zzz_party.14.d:0 "Labour wins a landslide in the 2024 election. Fourteen years of Conservative rule end, and Britain turns to social democracy."
 zzz_party.14.a:0 "Accept the result"
 zzz_party.15.t:0 "A New Face at the Elysee"
 zzz_party.15.d:0 "The centrist candidate wins the presidential election. The Elysee has a new master, and French politics shifts away from the old left-right divide."
 zzz_party.15.a:0 "Accept the result"
 zzz_party.100.t:0 "A New Tenant at the Blue House"
 zzz_party.100.d:0 "The Democratic Party candidate wins the 2017 presidential election. Seoul's political wind shifts towards liberalism."
 zzz_party.100.a:0 "Accept the result"
 zzz_party.101.t:0 "The Yongsan Presidency"
 zzz_party.101.d:0 "The conservative candidate wins the 2022 presidential election. Power changes hands in Korea, and policy turns hawkish towards the North and closer to Washington."
 zzz_party.101.a:0 "Accept the result"
 zzz_party.102.t:0 "A New Coalition in Rome"
 zzz_party.102.d:0 "The Five Star Movement and the League form a coalition government. Rome's political map is reshaped by populist forces."
 zzz_party.102.a:0 "Accept the result"
 zzz_party.104.t:0 "The Centre Returns to Warsaw"
 zzz_party.104.d:0 "The Civic Coalition wins a majority in the 2023 parliamentary election. Polish politics returns to a pro-European centrist course."
 zzz_party.104.a:0 "Accept the result"
 zzz_party.106.t:0 "Labor Takes Canberra"
 zzz_party.106.d:0 "Labor wins the 2022 election. Canberra's political centre of gravity shifts towards social democracy and climate policy."
 zzz_party.106.a:0 "Accept the result"
 zzz_party.107.t:0 "A Dynasty Returns to Manila"
 zzz_party.107.d:0 "The Marcos family returns to power in the 2022 presidential election. Manila goes back to strongman and clan politics."
 zzz_party.107.a:0 "Accept the result"
 zzz_party.110.t:0 "An Outsider President in Kyiv"
 zzz_party.110.d:0 "A comedian-turned-politician wins the 2019 presidential election. Kyiv's political landscape is rewritten."
 zzz_party.110.a:0 "Accept the result"
 zzz_party.111.t:0 "A Right-Wing Wave in Brasilia"
 zzz_party.111.d:0 "Bolsonaro wins the 2018 presidential election. Brazilian politics turns to right-wing populism."
 zzz_party.111.a:0 "Accept the result"
 zzz_party.112.t:0 "Lula Returns"
 zzz_party.112.d:0 "Lula defeats the incumbent in the 2022 presidential election. Brazil returns to a left-wing, social-democratic course."
 zzz_party.112.a:0 "Accept the result"
 zzz_party.113.t:0 "A Libertarian in Buenos Aires"
 zzz_party.113.d:0 "Milei wins the 2023 presidential election. Argentina turns to radical free-market and right-wing populist policies."
 zzz_party.113.a:0 "Accept the result"
 zzz_party.171.t:0 "Mexico Turns Left"
 zzz_party.171.d:0 "Lopez Obrador wins the 2018 presidential election at the head of the MORENA-led coalition. The new government promises to end the corruption of the old parties and to reorient the country's economic course."
 zzz_party.171.a:0 "Accept the result"
 zzz_party.172.t:0 "Sheinbaum Continues the Transformation"
 zzz_party.172.d:0 "Sheinbaum wins the 2024 presidential election with the largest vote share in decades. MORENA keeps power, and its coalition with the Greens and Labor continues."
 zzz_party.172.a:0 "Accept the result"
