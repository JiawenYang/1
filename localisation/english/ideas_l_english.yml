l_english:
 UKR_government_corruption: "Ukrainian Oligarchate"
 UKR_government_corruption_desc: "Various oligarchic clans have run their influence rampant within our governing institutions for quite some time now. Underhanded facilitation payments, bribery, extortion, and other abuses of power are widespread within our nation's public officials. Despite the already existing anti-corruption legislation we have in place, a weak justice system and poor economic conditions render the enforcement of these laws highly difficult, if not outright impossible in some cases."
 first_island_chain: "First Island Chain"
 first_island_chain_desc: "The First Island Chain refers to the string of islands in the Western Pacific extending eastward from the East Asian coastline, and the vast waters between them. It stretches from the Japanese archipelago and the Ryukyu Islands in the north, through Taiwan in the middle, and southwards to the Philippine Islands and the Greater Sunda Islands, extending to the South China Sea. It is the first line of defense in US foreign and national defense policy aimed at containing China, so named because it primarily consists of islands and forms a chain. The First Island Chain waters are the most effective area for US armed forces to defend against the People's Liberation Army of China."
 five_eyes: "Five Eyes"
 five_eyes_desc: "The Five Eyes Alliance is an intelligence alliance consisting of five English-speaking countries, an international intelligence-sharing group formed under the Anglo-American Agreement. Member countries include Australia, Canada, New Zealand, the United Kingdom, and the United States. Meetings held by these five countries are often referred to as “the Five.” The Five Eyes Alliance's history dates back to World War II and the Atlantic Charter signed by the Allies.\nThe five countries share a common historical origin. All member countries were once part of the British Empire, and the United Kingdom, Australia, New Zealand, and Canada are also members of the Commonwealth. The United States, Canada, and the United Kingdom are also members of NATO. The United States and the United Kingdom are two of the permanent members of the UN Security Council."
 one_child_policy_desc: "\n\n\n\n\n£GFX_PRC_one_child_policy_texticon_embed \n\n\n\n\n\n\nThe "One Child Policy" is a government effort to control the rapidly increasing population, initiated in 1979. It has been successful in its objective; however, one cannot overlook the consequences.\n\nIt cast deeper shadows on gender disparities, with families preferring to have male children while female children are often undervalued. Posiong risks to the gender balance in the future."
 KOR_aging_popu: "Population Aging"
 KOR_aging_popu_desc: "\n\n\n\n\n£GFX_KOR_aging_popu_embed \n\n\n\n\n\n\nThe low birth rate phenomenon, which began during the Chun Doo-hwan administration in 1983, remains a significant social issue for us today. During the industrialization era of the 1970s, excessive childbirth led to birth control policies, the aftermath of which has resulted in decreased preferences for marriage and childbirth. Consequently, South Korea has now entered an aging society."
 COG_africas_world_war_name: "Africa's World War"
 COG_africas_world_war_name_desc: "\n\n\n\n\n£GFX_COG_africas_world_war_embed \n\n\n\n\n\n\nWhat started in 1998 as a uprising in Congo has evolved into a full blown contient war claiming millions of lives with countries involving themselves either by directly or politically creating webs of alliances thus even getting the name \n\n§gAfrica's World War§!"
 idea_ISR_american_funding: "American Funding"
 idea_ISR_american_funding_desc: "O' America, Home of the Brave, Land of the Free, has long used Israel as a foothold in the turbulent Middle East, and from that decision, we have profited from their support. \n\nIF THE UNITED STATES CEASES TO EXIST OR CHOOSES TO STOP SUPPORTING US, OUR DOMINANCE IN THE MIDDLE EAST WILL BE QUESTIONED BY OUR NEIGHBORS."
 idea_ISR_vanguard_of_judaism: "Vanguard of Judaism"
 ISR_french_funding_idea: "French Funding"
 ISR_french_funding_idea_desc: "Although not as... robust... as our former American funding, the French government is very kind to be giving us some support."
 SAU_petro_dollar: "Petro Dollar"
 SAU_prince_pmcs: "Private Military Companies"
 SAU_prince_pmcs_desc: "Many of the princes of Saudi Arabia with their lavish spending, hire thousands of private military companies to defend their assets and for personal protection."
