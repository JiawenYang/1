 USA_world_police_idea: "World Police"
 USA_world_police_idea_desc: "If you ask a number of different people for their view on American military involvement in the Middle East, you're likely to get a number of different, strong opinions. Many Americans believe that the U.S. government should focus on domestic affairs, and that what happens in the Middle East is ''none of our business.'' Others believe that in this modern era, America must have a global presence in order to protect its interests. Differences of opinion over American interventionism in foreign affairs are nothing new; they have been present since almost the founding of the United States itself."

 PRC_chinese_communist_party_idea: "Communist Party of China"
 PRC_communist_party_of_china_dynamic: "Communist Party of China"
 PRC_communist_party_of_china_dynamic_desc: "\n\n\n\n£GFX_chinese_communist_party\n\n\n\n\n\n§RLong live the great Communist Party of China!\nLong live the invincible Mao Zedong Thought!§!\n\nSince 1949, the CPC has been the unquestioned ruler of mainland China. Even after the collapse of several communist states led by the USSR, socialist China has remained in East Asia and gradually become one of the most powerful countries in the world following its reform and opening up. The reasons behind the CPC's ability to consolidate its dominance in China, with a population of 1.4 billion, have been the topic of much debate. Some argue that the CPC has abandoned its communist credo, promising economic prosperity in exchange for support, and has adopted the traditional ideology of the old empire to keep the people in fear and obedience. Others contend that the CPC has succeeded by infiltrating its ideology and organization into every aspect of society and has been invigorated by continuous reforms. Whatever the case, one thing is certain: §Rit would take an apocalyptic-level disaster to topple the giant that is the CPC.§!"
 VIE_communist_party_vietnam_dynamic: "Communist Party of Vietnam"
 PRC_complacent_officers_spirit: "Complacent Officers"
 PRC_complacent_officers_spirit2: "Complacent Officers"
 PRC_pla_dynamic: "People's Liberation Army"
 PRC_pla_dynamic_desc: "\n\n\n\n\n£GFX_PRC_PLA_texticon_embed \n\n\n\n\n\n\nThe People's Liberation Army (PLA),  serves as the protector of both the Party and the State. Consequently, its management structure is integrated into both the Party organization and the state apparatus through the Central Military Commission (CMC). There are essentially two CMCs: one belonging to the Party and the other to the State (replacing the Ministry of Defense found in other countries). Within the Party structure, the Party's CMC is a top-level body alongside the Central Committee of the Party and the Central Commission for Discipline Inspection of the Party. In the state administrative structure, the State's CMC is a top-level body alongside the Government, the National People's Congress, and the Chinese People's Political Consultative Conference.\n\nThe Vice Chairman of the CMC is the highest position for an active-duty military officer, equivalent to the Deputy Premier  of the government. The Chief of Staff, the Minister of Political Work, the Minister of National Defense, and the Secretary of the Discipline Inspection of the CMC are also members. Those positions hold a deputy national rank (above a minister) with two Vice Chairmen being part of the Politburo. Depending on the period, the first Vice Chairman may be a member of the Standing Committee. The CMC members are proposed by the Chairman and approved by the Party Congress and the National People's Congress at each Congress session. CMC members are only accountable to the Chairman of the CMC. Neither the National People's Congress, the Central Committee of the Party, nor the civilian members of the Politburo or its Standing Committee (Premier , President of the National People's Congress, President, General Secretary) have any authority over the CMC or the armed forces."
