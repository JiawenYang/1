 ZZZ_cr_spirit_greater_india:0 "Spirit Test: Greater India"
 ZZZ_cr_spirit_greater_india_desc:0 "Debug only: applies the Greater India spirit to this country. The normal path assigns it automatically from gaw_japan_victory_settled."
 ZZZ_cr_spirit_greater_china:0 "Spirit Test: Greater China"
 ZZZ_cr_spirit_greater_china_desc:0 "Debug only: applies the Greater China spirit to this country. The normal path assigns it automatically from gaw_china_victory_settled."
 ZZZ_spirit_china_reunification:0 "Reunified China"
 ZZZ_spirit_china_reunification_desc:0 "The cross-strait split is closed and the island's industry, ports and administration are folded into the mainland system. Reunification settles the sovereignty question; it does not yet make Beijing the arbiter of the wider Asian order."
 ZZZ_spirit_indochina_federation:0 "Indochinese Federation"
 ZZZ_spirit_indochina_federation_desc:0 "Hanoi binds Laos and Cambodia into a single Indochinese administrative space through party networks, currency alignment and joint infrastructure. The federation restores a colonial-era frame under Vietnamese direction, and the smaller members remain wary of it."
 ZZZ_spirit_yugoslavia_revival:0 "Yugoslav Revival"
 ZZZ_spirit_yugoslavia_revival_desc:0 "Belgrade reassembles the western Balkans into a Yugoslav framework, trading wartime hostility for a customs union, shared policing and a joint command. The old question returns intact: whether one capital can hold several nations together."
 ZZZ_spirit_ottoman_restoration:0 "Ottoman Restoration"
 ZZZ_spirit_ottoman_restoration_desc:0 "The neo-Ottoman line is carried to its conclusion: Ankara rebuilds a sphere of influence across the former imperial lands, with Ottoman symbolism, military missions and a common market attached. The republic keeps its constitution but governs like a restored empire."
 ZZZ_cr_spirit_china_reunification:0 "Spirit Test: Reunified China"
 ZZZ_cr_spirit_china_reunification_desc:0 "Debug only: applies the Reunified China spirit to this country for checking its icon, text and modifiers. The normal path assigns it automatically from PRC_taiwan_war_won."
 ZZZ_cr_spirit_indochina_federation:0 "Spirit Test: Indochinese Federation"
 ZZZ_cr_spirit_indochina_federation_desc:0 "Debug only: applies the Indochinese Federation spirit to this country. The normal path assigns it automatically from gaw_china_victory_settled."
 ZZZ_cr_spirit_yugoslavia_revival:0 "Spirit Test: Yugoslav Revival"
 ZZZ_cr_spirit_yugoslavia_revival_desc:0 "Debug only: applies the Yugoslav Revival spirit to this country. The normal path assigns it automatically from SER_destroy_albanian_n."
 ZZZ_cr_spirit_ottoman_restoration:0 "Spirit Test: Ottoman Restoration"
 ZZZ_cr_spirit_ottoman_restoration_desc:0 "Debug only: applies the Ottoman Restoration spirit to this country. The normal path assigns it automatically once TUR_ottoman_politics is completed."
 ZZZ_spirit_canzuk:0 "CANZUK Union"
 ZZZ_spirit_canzuk_desc:0 "London, Ottawa, Canberra and Wellington pool their markets, defence planning and diplomatic representation into a single CANZUK framework. Free movement and joint procurement bind four Commonwealth economies into one bloc, while each member keeps its own parliament."
 ZZZ_spirit_maphilindo:0 "Maphilindo"
 ZZZ_spirit_maphilindo_desc:0 "Kuala Lumpur, Manila and Jakarta revive the Maphilindo idea as a Malay-world confederation: shared markets, coordinated maritime patrols and a common stance on the South China Sea. The project rests on weak institutions and on strong suspicions of whichever capital claims leadership."
 ZZZ_spirit_nordic_union:0 "Nordic Union"
 ZZZ_spirit_nordic_union_desc:0 "The five Nordic states merge their labour markets, defence procurement and diplomatic services into a single Nordic union. High living standards and small populations make integration cheap; the union's weight in Europe grows accordingly."
 ZZZ_cr_spirit_canzuk:0 "Spirit Test: CANZUK Union"
 ZZZ_cr_spirit_canzuk_desc:0 "Debug only: applies the CANZUK Union spirit to this country. The normal path assigns it automatically from the is_CANZUK country flag."
 ZZZ_cr_spirit_maphilindo:0 "Spirit Test: Maphilindo"
 ZZZ_cr_spirit_maphilindo_desc:0 "Debug only: applies the Maphilindo spirit to this country. The normal path assigns it automatically from the is_MAPHI country flag."
 ZZZ_cr_spirit_nordic_union:0 "Spirit Test: Nordic Union"
 ZZZ_cr_spirit_nordic_union_desc:0 "Debug only: applies the Nordic Union spirit to this country. The normal path assigns it automatically from the is_SCA country flag."
 ZZZ_spirit_cam_union:0 "Central American Union"
 ZZZ_spirit_cam_union_desc:0 "Managua folds Honduras, Guatemala, El Salvador and Belize into one party-state and military structure, reviving the Central American federal frame. The union runs on the revolutionary vanguard and the security apparatus rather than on representative procedure."
 ZZZ_spirit_cam_republic:0 "Central American Republic"
 ZZZ_spirit_cam_republic_desc:0 "San Salvador absorbs Nicaragua, Honduras and Belize into a republic centred on the presidency, holding order together through the security forces, fiscal centralisation and external agreements. Its legitimacy rests on security results and growth, not on federal power-sharing."
 ZZZ_cr_spirit_cam_union:0 "Spirit Test: Central American Union"
 ZZZ_cr_spirit_cam_union_desc:0 "Debug only: applies the Central American Union spirit to this country. The normal path assigns it automatically from CAM_union_formed."
