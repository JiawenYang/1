 ZZZ_cr_spirit_eurasian_state_desc:0 "Debug only: applies the Eurasian Union State spirit to this country. The normal path assigns it automatically once the SOV_eurasian cosmetic tag is in place."
 ZZZ_cr_spirit_eu_federation:0 "Spirit Test: European Federation"
 ZZZ_cr_spirit_eu_federation_desc:0 "Debug only: applies the European Federation spirit to this country. The normal path assigns it automatically from FRA_EU_federalized_global."
 ZZZ_cr_spirit_east_asia_sphere:0 "Spirit Test: Greater East Asia Co-Prosperity Sphere"
