l_english:
 ZZZ_spirit_korea_confederation:0 "Korean Peninsula Confederation"
 ZZZ_spirit_korea_confederation_desc:0 "Two sovereign governments keep their own borders and institutions, sharing only standing bodies for defence, foreign policy and industrial standards. The confederation is not a single state: if either side walks away, the whole framework stalls."
 ZZZ_spirit_korea_unified:0 "Korean Peninsula Unification"
 ZZZ_spirit_korea_unified_desc:0 "The armistice line is gone and a single government administers the whole peninsula. Southern industry, northern resource networks and the combined army are placed under one command; the integration dividend is real, but so is the cost of absorbing a society organised for seventy years around a different state."
 ZZZ_spirit_uar_unity:0 "United Arab Republic"
 ZZZ_spirit_uar_unity_desc:0 "Cairo folds the resources and markets of the Arab world into one administrative frame. The republic draws its legitimacy from the pan-Arab banner, yet provincial demands for autonomy remain a permanent internal fracture."
 ZZZ_spirit_balkan_federation:0 "Balkan Federation"
 ZZZ_spirit_balkan_federation_desc:0 "Belgrade uses economic mutual recognition and common defence as levers to pull the Balkan states into a loose federal community. Members keep their sovereignty; the federal bodies control only tariffs, infrastructure and a joint force."
 ZZZ_spirit_eurasian_state:0 "Eurasian Union State"
 ZZZ_spirit_eurasian_state_desc:0 "Moscow reintegrates the post-Soviet space through a customs union, a single energy grid and joint air defence. Sovereignty is pooled in macroeconomics and strategic forces, while culture and administration stay with the republics."
 ZZZ_spirit_eu_federation:0 "European Federation"
 ZZZ_spirit_eu_federation_desc:0 "After member states surrender fiscal and defence sovereignty, Brussels becomes a de facto federal government. A common budget, joint bonds and a European army give the federation its own financial and military base."
 ZZZ_spirit_east_asia_sphere:0 "Greater East Asia Co-Prosperity Sphere"
 ZZZ_spirit_east_asia_sphere_desc:0 "Tokyo binds the East Asian economies into a Japan-centred hierarchy through yen loans, resource purchases and maritime escort. The sphere ties members down with trade and security, at the price of diplomatic autonomy."
 ZZZ_spirit_greater_india:0 "Greater India"
 ZZZ_spirit_greater_india_desc:0 "New Delhi brings the subcontinent's tariffs, railways and water into a single administrative space. The union is framed as secular constitutional rule, but religious and linguistic divisions keep the cost of central integration high."
 ZZZ_spirit_greater_china:0 "Greater China"
 ZZZ_spirit_greater_china_desc:0 "With the Asian war settled in Beijing's favour, the newly secured territories and the South China Sea lanes are folded into central planning. A unified market and infrastructure network strengthen mobilisation while pushing governance complexity to its limit."
 ZZZ_cr_spirit_korea_confederation:0 "Spirit Test: Korean Peninsula Confederation"
 ZZZ_cr_spirit_korea_confederation_desc:0 "Debug only: applies the Korean Peninsula Confederation spirit to this country so its icon, text and modifiers can be checked. The normal path assigns it automatically from korean_confederation_formed."
 ZZZ_cr_spirit_uar_unity:0 "Spirit Test: United Arab Republic"
 ZZZ_cr_spirit_uar_unity_desc:0 "Debug only: applies the United Arab Republic spirit to this country. The normal path assigns it automatically from ZZZ_UAR_victory."
