l_english:
 #Taiwan peace-unification route and Korean confederation route - flavour events
 tai_kor_flavor.1.t: "The Fishing Season Returns"
 tai_kor_flavor.1.d: "For the first time in years the boats from Xiamen and Kinmen sail the same waters on the same tide table. The catch is modest, but the harbour bars are full, and old men who once shouted at each other across the strait now argue only about the price of squid. In $COUNTRY$, people say the sea remembers what politics forgets."
 tai_kor_flavor.1.a: "Let the boats sail"
 tai_kor_flavor.2.t: "Back to the Yangtze Delta"
 tai_kor_flavor.2.d: "Taiwanese factory owners who spent a decade moving plants to Vietnam and India are quietly reopening offices in Kunshan and Suzhou. The paperwork is easier now, the flights are direct again, and a generation of managers raised on caution finds itself bargaining over lunch. The sums are still small, but the direction is unmistakable."
 tai_kor_flavor.2.a: "Business follows the flag"
 tai_kor_flavor.3.t: "The Old Soldiers Go Home"
 tai_kor_flavor.3.d: "A bus of veterans' village elders crosses the strait with a police escort and a nurse on board. Some have not seen their hometowns since the 1940s; most find the ancestral hall rebuilt and the family graves tended by strangers. They return with photographs, a jar of soil, and a silence that lasts the whole flight back."
 tai_kor_flavor.3.a: "Some debts can finally be paid"
 tai_kor_flavor.4.t: "Families Across the Strait"
 tai_kor_flavor.4.d: "Cross-strait marriages, long treated as a bureaucratic grey zone, are finally given a clear legal footing. Couples who spent years proving that they were married now queue at offices to prove it once more, this time with a stamp that everyone recognises. Their children, raised between two passports, ask which one they will need next year."
 tai_kor_flavor.4.a: "One household, one paperwork"
 tai_kor_flavor.5.t: "The Summer Exchange Camp"
 tai_kor_flavor.5.d: "Three hundred students from $COUNTRY$ spend a fortnight in Nanjing and Hangzhou, half of them expecting propaganda and finding instead bad canteen food, late-night arguments and a shared playlist. By the last day they have stopped calling each other 'them'. The organisers on both sides call it a success and quietly worry about the follow-up."
 tai_kor_flavor.5.a: "Let them meet"
 tai_kor_flavor.6.t: "A Star on the Mainland Stage"
 tai_kor_flavor.6.d: "A Taiwanese pop singer sells out a stadium in Shanghai in eleven minutes. The encore is sung in two accents, and the crowd sings back in a third. On the mainland the tour is billed as cultural integration; on the island it is billed as a homecoming. Nobody in the arena seems to care which word is used."
 tai_kor_flavor.6.a: "The crowd does not read the brief"
 tai_kor_flavor.7.t: "A Friendly Game, Two Flags"
 tai_kor_flavor.7.d: "A cross-strait baseball exhibition draws a full house and a diplomatic headache. The visiting team's flag is allowed at the gate but not on the scoreboard, and the announcer solves the problem by reading out the players' names twice. The home side wins by one run; both dugouts applaud."
 tai_kor_flavor.7.a: "Nine innings of peace"
 tai_kor_flavor.8.t: "The Mazu Pilgrimage"
 tai_kor_flavor.8.d: "A pilgrimage fleet from $COUNTRY$ crosses to Meizhou with incense, drums and a statue of the sea goddess. The mainland temple receives it with a red carpet; the local officials are careful to call the visitors 'compatriots' and never 'guests'. On the ferry home, a temple committee member notes that the goddess, at least, has never needed a visa."
 tai_kor_flavor.8.a: "Faith travels lighter than politics"
 tai_kor_flavor.9.t: "Kaesong Reopens"
 tai_kor_flavor.9.d: "The gates of the Kaesong industrial park swing open after years of silence. South Korean managers walk through workshops where the machines are still wrapped in dust sheets, and North Korean workers report for shifts with new badges. The first month's output is tiny; the first month's pay is paid on time, which is the real news."
 tai_kor_flavor.9.a: "The machines start again"
 tai_kor_flavor.10.t: "Reunions at Mount Kumgang"
 tai_kor_flavor.10.d: "Buses of separated families climb to the reunion centre at Mount Kumgang, where the rooms are numbered and the meetings are timed by officials with stopwatches. An eighty-year-old woman recognises her brother by the way he folds his hands. They are given three hours, a boxed lunch and a photograph that both sides will have to hide from their neighbours."
 tai_kor_flavor.10.a: "Three hours are three hours"
 tai_kor_flavor.11.t: "The Shops at Panmunjom"
 tai_kor_flavor.11.d: "With the border post thinned out, a handful of shopkeepers reopen stalls on the southern side of the truce village. They sell instant noodles, postcards and, inevitably, souvenir binoculars for looking at the other side of a line that no longer means what it did. The best-selling item is a keychain shaped like the old demarcation rope."
 tai_kor_flavor.11.a: "Small commerce, small peace"
 tai_kor_flavor.12.t: "A Match Between Two Koreas"
 tai_kor_flavor.12.d: "A North-South football friendly is played in a stadium where the two anthems are performed one after the other and both crowds stand. The match ends in a draw, which the commentators call a diplomatic result. Afterwards the players swap jerseys and, with some difficulty, phone numbers."
 tai_kor_flavor.12.a: "A draw nobody complains about"
 tai_kor_flavor.13.t: "Mount Kumgang Opens to Tourists"
 tai_kor_flavor.13.d: "The first tourist ferries in years dock at Mount Kumgang. The resort is half-finished and the water park is still a concrete shell, but the beaches are clean and the guides have memorised three languages. South Korean visitors complain about the prices; North Korean staff complain about the tips being counted in the wrong currency."
 tai_kor_flavor.13.a: "Let them come and see"
 tai_kor_flavor.14.t: "Two Voices, One Stage"
 tai_kor_flavor.14.d: "A concert in Seoul pairs a northern ballad singer with a southern idol group. The arrangement is awkward, the translation is worse, and the finale — a song both sides claim as theirs — brings the hall to its feet. The broadcast is delayed by thirty minutes so that each network can cut the other's introduction."
 tai_kor_flavor.14.a: "Turn up the volume"
 tai_kor_flavor.15.t: "The First Train in Seventy Years"
 tai_kor_flavor.15.d: "A trial train runs from Seoul to Sinuiju and back with inspectors, journalists and one very nervous engineer. The track is patched, the signals are manual, and the journey takes three times the timetable. But the crossing is made, and someone in the dining car opens a bottle that has been kept in a cupboard since the 1990s."
 tai_kor_flavor.15.a: "Lay the second track"
 tai_kor_flavor.16.t: "A Shared Chuseok"
 tai_kor_flavor.16.d: "For the first time the two Koreas hold a joint Chuseok broadcast: the same songs, the same food, two different presenters reading the same script. Families separated by the old line watch it in separate rooms and, for one evening, argue about the same thing — whether the song was sung better on the other side."
 tai_kor_flavor.16.a: "One holiday, two broadcasts"
