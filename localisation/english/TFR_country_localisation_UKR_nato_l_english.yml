 UKR_nato_membership_west: "Membership Action Plan"
 UKR_nato_membership_west_desc: "Whether the Kremlin's armies are already advancing into the east or Moscow has descended into a post-Putin scramble, Kyiv's diplomats argue that the 2008 promise from Bucharest can no longer be postponed. A formal accession request is drafted, and the Western partners are asked to admit Ukraine before the window closes."
