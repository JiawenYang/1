 eng_ajax_fe_decision:0 "General Dynamics Ajax"
 eng_ajax_fe_decision_desc:0 "Resolve the noise and vibration trials and clear the Ajax reconnaissance vehicle for British Army service."
 eng_apache_ah2_fe_decision:0 "Apache AH-2"
 eng_apache_ah2_fe_decision_desc:0 "Accept the remanufactured AH-64E Apache Guardian, designated Apache AH-2, into Army Air Corps service."
 eng_boxer_miv_fe_decision:0 "Boxer Mechanised Infantry Vehicle"
 eng_boxer_miv_fe_decision_desc:0 "Accept the first Boxer Mechanised Infantry Vehicles into service with the newly formed Strike Brigades."
 eng_challenger3_fe_decision:0 "Challenger 3"
 eng_challenger3_fe_decision_desc:0 "Complete the Rheinmetall Challenger 3 lethality upgrade, centred on the new 120mm smoothbore turret, and authorise conversion of the fleet."
 eng_dreadnought_fe_decision:0 "Dreadnought Class"
 eng_dreadnought_fe_decision_desc:0 "Complete the Dreadnought class ballistic missile submarine and assume the Continuous At Sea Deterrence from the Vanguard class."
 eng_e7_wedgetail_fe_decision:0 "Boeing E-7 Wedgetail AEW1"
 eng_e7_wedgetail_fe_decision_desc:0 "Introduce the E-7 Wedgetail AEW1 to replace the Sentry AEW1 in the airborne early warning role."
 eng_p8a_poseidon_fe_decision:0 "Boeing P-8A Poseidon MRA1"
 eng_p8a_poseidon_fe_decision_desc:0 "Stand up the RAF Poseidon MRA1 maritime patrol force at RAF Lossiemouth."
 eng_protector_rg1_fe_decision:0 "Protector RG1"
 eng_protector_rg1_fe_decision_desc:0 "Certify the GA-ASI MQ-9B SkyGuardian, designated Protector RG1, as the RAF first remotely-piloted air system certified for civilian airspace."
 eng_sky_sabre_fe_decision:0 "Sky Sabre"
 eng_sky_sabre_fe_decision_desc:0 "Deploy the Sky Sabre air defence system, combining Giraffe radars, Rafael MIC4AD battle management and Land Ceptor missiles."
 eng_tempest_fe_decision:0 "BAE Tempest"
 eng_tempest_fe_decision_desc:0 "Complete development of the sixth-generation Tempest fighter under the Global Combat Air Programme and begin series production."
 eng_type26_fe_decision:0 "Type 26 City Class"
 eng_type26_fe_decision_desc:0 "Commission the first Type 26 anti-submarine warfare frigate, HMS Glasgow, as the backbone of future carrier strike group escort."
 eng_type31_fe_decision:0 "Type 31 Inspiration Class"
 eng_type31_fe_decision_desc:0 "Bring the general-purpose Type 31 frigate, led by HMS Venturer, into Royal Navy service."
 eng_type83_fe_decision:0 "Type 83 Destroyer"
 eng_type83_fe_decision_desc:0 "Develop and commission the Type 83 integrated air and missile defence destroyer to replace the Type 45 in the 2030s."
 future_aircraft_category:0 "Future Aviation Programmes"
 future_naval_category:0 "Future Naval Programmes"
 future_tanks_category:0 "Future Armoured Programmes"
 ger_212cd_fe_decision:0 "Type 212CD Class"
 ger_212cd_fe_decision_desc:0 "Complete the Common Design Type 212CD AIP submarine programme with Norway and accept the first boat into service."
 ger_ch53k_fe_decision:0 "CH-53K King Stallion"
 ger_ch53k_fe_decision_desc:0 "Introduce the CH-53K heavy transport helicopter as the successor to the CH-53G fleet."
 ger_eurodrone_fe_decision:0 "Eurodrone"
 ger_eurodrone_fe_decision_desc:0 "Complete certification of the European MALE RPAS Eurodrone and begin deliveries to Germany, France, Italy and Spain."
 ger_f126_fe_decision:0 "F126 Koln Class"
 ger_f126_fe_decision_desc:0 "Commission the F126 frigate, led by F265 Koln, for sustained overseas stabilisation and escort missions."
 ger_f35a_fe_decision:0 "F-35A Lightning II"
 ger_f35a_fe_decision_desc:0 "Take delivery of the nuclear-capable F-35A to replace the Tornado IDS in the nuclear sharing and strike roles."
 ger_heron_tp_fe_decision:0 "Heron TP"
 ger_heron_tp_fe_decision_desc:0 "Lease the IAI Heron TP as an interim armed long-endurance remotely-piloted aircraft for the German armed forces."
 ger_kf51_panther_fe_decision:0 "KF51 Panther"
 ger_kf51_panther_fe_decision_desc:0 "Complete trials of the Rheinmetall KF51 Panther demonstrator and offer the 130mm-armed platform for series production and export."
 ger_leopard3_mgcs_fe_decision:0 "Leopard 3 (MGCS)"
 ger_leopard3_mgcs_fe_decision_desc:0 "Bring the Franco-German Main Ground Combat System, the successor to the Leopard 2, into series production."
 ger_p8a_poseidon_fe_decision:0 "Boeing P-8A Poseidon"
 ger_p8a_poseidon_fe_decision_desc:0 "Take delivery of the P-8A Poseidon to replace the P-3C Orion in the long-range maritime patrol role."
 ger_tiger_mkiii_fe_decision:0 "Tiger MkIII"
 ger_tiger_mkiii_fe_decision_desc:0 "Complete the Tiger MkIII mid-life upgrade with new avionics, sensors and weapon integration for the German attack helicopter fleet."
 jh7a_decision:0 "Xian JH-7A"
 jh7a_decision_desc:0 "Authorise the mid-life upgrade of the JH-7 Flying Leopard fleet with improved avionics, targeting systems and anti-ship capability."
