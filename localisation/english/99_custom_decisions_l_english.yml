  SOV_Arkhangelsk_decision_desc: "Unlocks the Arkhangelsk Class nuclear attack submarine, a Yasen-M (Project 885M) boat of the Russian Navy."
  # Sov Knyaz Pozharsky
  SOV_Knyaz_Pozharsky_decision: "Create Knyaz Pozharsky Class Design"
  SOV_Knyaz_Pozharsky_decision_desc: "Unlocks the Knyaz Pozharsky Class ballistic missile nuclear submarine, a Borei-A (Project 955A) boat."
  # Eng Agamemnon
  ENG_Agamemnon_decision: "Create Agamemnon Class Design"
  ENG_Agamemnon_decision_desc: "Unlocks the Agamemnon Class nuclear attack submarine, the sixth Astute-class boat of the Royal Navy."
  # Ast Arafura
  AST_Arafura_decision: "Create Arafura Class Design"
  AST_Arafura_decision_desc: "Unlocks the Arafura Class offshore patrol vessel of the Royal Australian Navy."
  # Bra Tamandare
  BRA_Tamandare_decision: "Create Tamandaré Class Design"
  BRA_Tamandare_decision_desc: "Unlocks the Tamandaré Class frigate, based on the MEKO A-100 design and built for the Brazilian Navy."
  # Kor Chungnam
  KOR_Chungnam_decision: "Create Chungnam Class Design"
  KOR_Chungnam_decision_desc: "Unlocks the Chungnam Class frigate (Ulsan-class Batch III), fitted with a domestically developed multifunction phased array radar."
