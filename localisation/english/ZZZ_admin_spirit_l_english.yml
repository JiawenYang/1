l_english:
 MD_admin_spirit_CHI:0 "Chinese Party-State Bureaucracy"
 MD_admin_spirit_CHI_desc:0 "§gChina is a party-state unitary system in which the centre governs through four tiers of provincial, municipal, county and township administration and a parallel chain of party committees, while localities keep real discretion over land and finance. Establishment quotas are fixed from above tier by tier, making the hierarchy rigid and hard to compress; reform usually ends with renamed agencies and reassigned staff.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_chi_banner"
 MD_admin_spirit_SOV:0 "Russian Vertical of Power"
 MD_admin_spirit_SOV_desc:0 "§gRussia binds its federation and ministries together through a strong presidency: federal districts and the appointment of governors pull the regions into the centre's evaluation chain, while ministerial verticals cover security, energy and finance. The state civil service and the state sector form a large entrenched structure, so streamlining usually stops at renaming institutions and preserving headcount. Institutional inertia is therefore hard to break.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sov_banner"
 MD_admin_spirit_USA:0 "American Federal Civil Service"
 MD_admin_spirit_USA_desc:0 "§gThe United States is a federal presidential republic in which federal power is limited to enumerated matters and the rest is reserved to the states; officials are hired on merit and political appointees serve alongside career bureaucrats. Appropriations decide only how much money is provided, while creating an agency requires an act of Congress, so the administrative tier is difficult to move.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_usa_banner"
 MD_admin_spirit_ENG:0 "British Westminster Civil Service"
 MD_admin_spirit_ENG_desc:0 "§gBritain is a Westminster-style unitary state in which the Treasury and the Cabinet Office coordinate the departments, while Scotland, Wales and Northern Ireland enjoy devolution. Permanent officials are recruited by examination and politically neutral, and cuts tend to hit outsourced contracts rather than core posts. Local government depends heavily on central grants.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_eng_banner"
 MD_admin_spirit_KOR:0 "Korean Examination Bureaucracy"
 MD_admin_spirit_KOR_desc:0 "§gSouth Korea is a unitary republic organised through provinces, cities and counties down to townships, with the centre dominant through personnel and fiscal transfers and local autonomy escaping only in Sejong and Jeju. The senior civil service corps ties promotion to political appointment, so changes in establishment must survive the National Assembly and public opinion.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_kor_banner"
 MD_admin_spirit_BRA:0 "Brazilian Federal Oligarchy"
 MD_admin_spirit_BRA_desc:0 "§gBrazil is a federal republic in which twenty-six states, the Federal District and thousands of municipalities are all federal subjects, and the 1988 constitution devolved taxes and spending responsibilities to them. Federal and state personnel systems remain separate, while the Fiscal Responsibility Law imposes hard constraints on debt and payroll.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_bra_banner"
 MD_admin_spirit_PER:0 "Iranian Clerical Administration"
 MD_admin_spirit_PER_desc:0 "§gIran is an Islamic republic organised through provinces, counties, districts and townships, with governors appointed by the Interior Ministry and elected local councils holding limited powers. The Revolutionary Guards, religious foundations and quasi-state bodies absorb enormous resources, leaving the budget to allocate only the annual share of oil revenue. Administrative efficiency suffers accordingly.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_per_banner"
 MD_admin_spirit_AST:0 "Australian Federal Civil Service"
 MD_admin_spirit_AST_desc:0 "§gAustralia is a federation in which Commonwealth power is limited to enumerated matters, the states retain the rest, and local government is created by state law. The Commonwealth raises the main taxes and distributes them to the states through the Grants Commission, while each state runs its own public service, making transfers between them difficult. Local autonomy is therefore limited.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ast_banner"
 MD_admin_spirit_VIE:0 "Vietnamese Party-State Administration"
 MD_admin_spirit_VIE_desc:0 "§gVietnam is a unitary state in which party and state run in parallel: provinces, districts and communes each have a people's council and a people's committee, and the party's organisational chain reaches the grassroots. Establishment quotas are set centrally, local spending relies on transfers and land revenue, and personnel and party rules decide who answers for what. Efficiency is constrained by this dual track.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_vie_banner"
 MD_admin_spirit_SWE:0 "Swedish Decentralized Welfare Administration"
 MD_admin_spirit_SWE_desc:0 "§gSweden is a unitary state with constitutionally protected local self-government: 290 municipalities and 21 county councils levy their own taxes and carry most education and health care. Central ministries are small and execution is delegated to independent agencies, while layoffs require collective bargaining and legal procedure. Local taxes are the main source of public services.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swe_banner"
 MD_admin_spirit_HOL:0 "Dutch Consociational Administration"
 MD_admin_spirit_HOL_desc:0 "§gThe Netherlands is a decentralised unitary state of twelve provinces, hundreds of municipalities and water boards, with municipalities enjoying broad autonomy over spatial planning and welfare. Central ministries are small and execution is delegated to agencies, while local finance depends on formula-based municipal and provincial funds. Any reform must pass through multi-party compromise.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_hol_banner"
 MD_admin_spirit_GER:0 "German Administrative Federalism"
 MD_admin_spirit_GER_desc:0 "§gGermany is a federation in which the Basic Law assigns execution to the Länder, leaving the Bund only foreign affairs, defence, currency and framework legislation. Federal and state officials belong to two separate lifetime career systems, and shared taxes plus horizontal fiscal equalisation decide who has money and who administers. Administrative federalism keeps Berlin from commanding the Länder directly.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ger_banner"
 MD_admin_spirit_POL:0 "Polish Local Self-Government"
 MD_admin_spirit_POL_desc:0 "§gPoland is a unitary state of sixteen voivodeships, several hundred counties and over a thousand communes, each with an elected council, while the voivode is appointed by the centre and supervises local government. The civil service inherited from the transition is large, and local finance depends on equalisation grants and shared taxes. The division of duties between voivode and elected councils remains blurred.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pol_banner"
 MD_admin_spirit_JAP:0 "Japanese Kasumigaseki Bureaucracy"
 MD_admin_spirit_JAP_desc:0 "§gJapan is a unitary state in which the central ministries concentrated in Kasumigaseki coordinate national administration, prefectures combine central delegation with local autonomy, and municipalities handle grassroots affairs. National and local officials form two separate career tracks, and seniority-based lifetime employment lets establishments shrink only slowly. Central control over localities is therefore secure.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_jap_banner"
 MD_admin_spirit_FRA:0 "French Prefectoral Centralism"
 MD_admin_spirit_FRA_desc:0 "§gFrance is a centralised unitary state in which the prefect represents the state within each department and ministries are divided by vertical function. The 1982 decentralisation acts redrew the powers of regions, departments and communes, yet state field services and local authorities have long coexisted with overlapping responsibilities. Central and local competences remain in tension.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_fra_banner"
 MD_admin_spirit_ITA:0 "Italian Regional Autonomy"
 MD_admin_spirit_ITA_desc:0 "§gItaly is a unitary republic that inherited the Sardinian provincial system, and the 2001 constitutional reform devolved legislative power to the regions, moving health, transport and vocational education outward. Finance and personnel remain largely in Rome's hands, producing dispersed responsibility and crossed lines of authority, while reform rarely moves beyond paper.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ita_banner"
 MD_admin_spirit_RAJ:0 "Indian Colonial Civil Service"
 MD_admin_spirit_RAJ_desc:0 "§gIndia is a federal republic that divides powers between the Union and the states, with All India Services recruited centrally and posted to the states, forming a link of central personnel in local posts. Cadre numbers are constrained by caste and regional reservation policy, so expansion and contraction both disturb the political balance. Expansion has long absorbed unemployment.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_raj_banner"
 MD_admin_spirit_TUR:0 "Turkish Presidential Centralism"
 MD_admin_spirit_TUR_desc:0 "§gTurkey is a unitary republic in which provincial governors are appointed by the Interior Ministry and answer to the centre, while municipalities operate under municipal law. After the 2017 referendum introduced a presidential system, the administrative core shifted toward the presidential palace, and Law No. 657 makes establishment far less sensitive to finance than to political loyalty. Efficiency yields to loyalty.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tur_banner"
 MD_admin_spirit_ISR:0 "Israeli Basic-Law Administration"
 MD_admin_spirit_ISR_desc:0 "§gIsrael has no written constitution and defines its institutions through a series of basic laws, leaving central ministries broad discretion over local affairs. Local authorities are elected but depend on central equalisation grants, while collective agreements and lifetime employment make establishments easy to expand and hard to shrink. Budgeting is tightly guarded by the Finance Ministry.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_isr_banner"
 MD_admin_spirit_CAN:0 "Canadian Provincial Federalism"
 MD_admin_spirit_CAN_desc:0 "§gCanada is a federation in which the 1867 constitution assigns education, health and social services to the provinces, and municipalities are creatures of provincial law. Ottawa guides localities through conditional transfers, provincial personnel statutes differ widely, and establishment changes must pass commission rules. Federal coordination therefore depends on negotiation.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_can_banner"
 MD_admin_spirit_PAK:0 "Pakistani Federal Secretariat"
 MD_admin_spirit_PAK_desc:0 "§gPakistan is a federal republic in which the federal secretariat and provincial chief secretaries form dual tracks, and district officers continue the integrative role of the colonial administration. The 2010 Eighteenth Amendment devolved education and health to the provinces, while cadre allocation is bound by regional balance and reserved quotas.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pak_banner"
 MD_admin_spirit_NKO:0 "North Korean Party-State Planning"
 MD_admin_spirit_NKO_desc:0 "§gNorth Korea organises administration on party-state unity: the cabinet governs provinces and the people's committees of cities and counties, and the planning commission issues annual and five-year targets. Revenue and expenditure are pooled centrally, localities have almost no independent tax base, and cadres are managed by the party's organisational department. Efficiency yields to mobilisation.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nko_banner"
 MD_admin_spirit_UKR:0 "Ukrainian Presidential Administration"
 MD_admin_spirit_UKR_desc:0 "§gUkraine inherited the Soviet republican structure of oblasts, raions and municipalities; governors are appointed by the president, while municipalities operate on European self-government principles. The post-2014 decentralisation devolved fiscal powers, but war mobilisation and oligarchic influence have kept establishments unstable. Central and local competences remain contested.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ukr_banner"
 MD_admin_spirit_SAU:0 "Saudi Royal Governorate"
 MD_admin_spirit_SAU_desc:0 "§gSaudi Arabia is an absolute monarchy in which provinces are governed by royally appointed governors, subdivided into districts and counties, with administration interwoven with tribal and religious authority. Oil revenue is converted into administrative capacity through five-year plans, and creating or cutting agencies requires a royal decree. Efficiency depends on the royal will.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sau_banner"
 MD_admin_spirit_SWI:0 "Swiss Federal Council System"
 MD_admin_spirit_SWI_desc:0 "§gSwitzerland is a federation in which the confederation holds only enumerated powers, the twenty-six cantons retain broad sovereignty, and municipalities govern themselves under cantonal law. Administration relies heavily on militia and part-time service, and any expansion may be put to a referendum requiring cantonal parliaments and voters to agree. Confederation and cantons operate by negotiation rather than command.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swi_banner"
 MD_admin_spirit_SPR:0 "Spanish State of Autonomies"
 MD_admin_spirit_SPR_desc:0 "§gSpain is a state of autonomies in which seventeen autonomous communities coexist with provinces and municipalities, while the centre keeps defence, foreign affairs and macroeconomic coordination. Competence disputes are settled by the Constitutional Court, the Basque Country and Navarre hold special fiscal rights, and negotiation runs through the whole system. Every statute revision is a political bargain.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_spr_banner"
 MD_admin_spirit_EGY:0 "Egyptian Centralized Administration"
 MD_admin_spirit_EGY_desc:0 "§gEgypt is a highly centralised unitary state in which governors are appointed by the president, provinces are divided into districts and villages, and local councils hold only limited elected status. The military-run economy reaches deep into infrastructure and social provision, and establishment expansion has long served to absorb employment. Efficiency often yields to social stability.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_egy_banner"
 MD_admin_spirit_MEX:0 "Mexican Federal State Constitutions"
 MD_admin_spirit_MEX_desc:0 "§gMexico is a federal republic in which thirty-one states and Mexico City each have a constitution and congress, municipalities form the base of self-government, and the federation controls most revenue. A federal civil service was built gradually after democratisation in 2000, yet states and municipalities still go their own way on personnel. Transfers are the federation's lever.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_mex_banner"
 MD_admin_spirit_NRY:0 "Norwegian Municipal Self-Government"
 MD_admin_spirit_NRY_desc:0 "§gNorway is a unitary state in which the county is the central government's regional tier and municipalities deliver education, health and welfare under the Local Government Act. Oil revenue is insulated from the annual budget by the sovereign fund and fiscal rule, keeping administrative spending stable and dampening expansion. Municipal mergers require residents' consent.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nry_banner"
 MD_admin_spirit_TAI:0 "Taiwanese Five-Yuan Civil Service"
 MD_admin_spirit_TAI_desc:0 "§gTaiwan organises government under the ROC constitutional framework through five branches, and the Examination Yuan controls civil service examinations and appointment, so official qualification must be earned by test. After the provincial level was streamlined, centre and localities deal with each other directly while local finance depends on equalisation tax allocations. Centre and localities divide work through grants and negotiation.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tai_banner"
 MD_admin_spirit_IND:0 "Indonesian Local Autonomy"
 MD_admin_spirit_IND_desc:0 "§gIndonesia is a unitary state running from provinces through regencies and cities to districts and villages, and the governor is both the centre's representative and an autonomous head. The 1999 autonomy laws devolved functions and revenues to regencies and cities, and villages gained an independent budget under the Village Law. Expansion has long absorbed employment.§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ind_banner"
