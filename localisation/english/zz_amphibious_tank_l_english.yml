l_english:
 ZZ_amphibious_tank_chassis_pt76: "PT-76"
 ZZ_amphibious_tank_chassis_pt76_desc: "The Soviet Union's first post-war amphibious tank, fielded by naval infantry and reconnaissance units for amphibious scouting and fire support."
 ZZ_amphibious_tank_chassis_type63: "Type-63"
 ZZ_amphibious_tank_chassis_type63_desc: "China's indigenous amphibious tank developed from the PT-76, rearmed with an 85mm gun and long serving with the PLANMC and amphibious mechanized units."
 ZZ_amphibious_tank_chassis_pt76b: "PT-76B"
 ZZ_amphibious_tank_chassis_pt76b_desc: "Improved PT-76 with a stabilized gun and new coaxial machine gun, the mainstay amphibious tank of Soviet naval infantry and reconnaissance units in the early Cold War."
 ZZ_amphibious_tank_chassis_pt85: "PT-85"
 ZZ_amphibious_tank_chassis_pt85_desc: "North Korean amphibious tank derived from the PT-76, rearmed with an 85mm gun on a lengthened hull, fielded by KPA reconnaissance and mechanized units."
 ZZ_amphibious_tank_chassis_type63_1: "Type-63-I"
 ZZ_amphibious_tank_chassis_type63_1_desc: "First improvement of the Type 63, with a new diesel engine and refined water propulsion for better swim speed and reliability."
 ZZ_amphibious_tank_chassis_type63_2: "Type-63-II"
 ZZ_amphibious_tank_chassis_type63_2_desc: "Second improvement of the Type 63, with updated fire control and coaxial machine gun for increased combat effectiveness."
 ZZ_amphibious_tank_chassis_type63a: "Type-63A"
 ZZ_amphibious_tank_chassis_type63a_desc: "Major upgrade of the Type 63 family with a 105mm rifled gun and new turret armor, the mainstay amphibious tank of the PLANMC in the late 1990s."
