l_english:
 #The Fire Rises Mexico drug war event chain (ported)
 mexico.1.t: "The Raid Succeeds"
 mexico.1.d: "Navy special forces, acting on intelligence, storm a concealed Sinaloa Cartel lab and seize several tonnes of fentanyl and precursor chemicals without a single casualty. At the morning press conference the President calls it 'the cleanest victory of this drug war'."
 mexico.1.a: "Keep up the pressure"
 mexico.2.t: "The Raid Fails"
 mexico.2.d: "Special forces are ambushed in the mountains of Michoacan and the extraction helicopters are forced to abort. The signs of a leak are unmistakable, and the casualty list leaves the presidential palace silent."
 mexico.2.a: "The mole must be found"
 mexico.3.t: "Migrant Caravan Reaches the Guatemalan Border"
 mexico.3.d: "Thousands of Central American migrants gather at the Guatemalan border and push north. Washington demands that Mexico act as a 'safe third country', while northern governors are already discussing roadblocks of their own."
 mexico.3.a: "Close the southern border"
 mexico.3.b: "Offer humanitarian transit"
 mexico.4.t: "Officers Engage the Cartels"
 mexico.4.d: "An army patrol fights a hours-long gun battle with armed men in Tamaulipas while the local police are nowhere to be seen. For the first time the high command admits publicly that several states are no longer under government control."
 mexico.4.a: "The army must take over policing"
 mexico.5.t: "Police Detain American Refugees"
 mexico.5.d: "As conditions in the United States deteriorate, large numbers of American citizens cross into northern Mexico. Border police detain hundreds for incomplete papers; the camps overflow and Washington and Mexico City trade accusations."
 mexico.5.a: "Process them by the book"
 mexico.6.t: "Sinaloa Begins Seizing Territory"
 mexico.6.d: "The Sinaloa Cartel openly sets up checkpoints in Baja California, Sonora, Chihuahua and Sinaloa-Durango, claiming to protect residents from government extortion. Federal police withdraw from the region."
 mexico.6.a: "The federal government has no answer"
 mexico.8.t: "Tierra Caliente Begins Seizing Territory"
 mexico.8.d: "Tierra Caliente takes over ports and highway toll booths in Jalisco and Guerrero-Oaxaca, and local politicians appear at its press conferences. Mexico City can only watch the tax revenue flow elsewhere."
 mexico.8.a: "The capital holds on"
 mexico.9.t: "Tamaulipas Begins Seizing Territory"
 mexico.9.d: "The Tamaulipas Cartel completes its control of the industrial corridor in Nuevo Leon, Coahuila and Veracruz. Multinational plants begin negotiating directly with the armed groups rather than with the government."
 mexico.9.a: "Industry has found new protectors"
 mexico.10.t: "Other Regions Collapse"
 mexico.10.d: "Guanajuato, Chiapas and Yucatan slide into anarchy. Local militias, indigenous self-defence groups and remnant police draw their own lines, and the federal flag has come down in many towns."
 mexico.10.a: "The state is coming apart"
 mexico.11.t: "The Cartel War Begins"
 mexico.11.d: "All three cartels declare war on the federal government at once. Army units defect wholesale, the police system disintegrates, and the territory beyond Mexico City is in practice no longer governed. It is the darkest hour since the founding of the republic."
 mexico.11.a: "The nation enters a state of war"
 mexico.12.t: "The Cartel War Ends"
 mexico.12.d: "The years of fighting are finally over. The federal government raises its flag over the ruins and a reconstruction commission takes over the devastated northern industrial belt. The price was the memory of a whole generation."
 mexico.12.a: "Restore order"
 mexico.13.t: "Reconstruction and Elections"
 mexico.13.d: "After national elections delayed by two years, a new president is sworn in in Mexico City. Her campaign promise was a single sentence: to make the country belong to its citizens again."
 mexico.13.a: "Let the country belong to its citizens again"
 # Mexico cartel war reinforcement (zzz_mex namespace, original to this mod)
 zzz_mex.1.t: "New Masters of the North"
 zzz_mex.1.d: "With the federal line collapsing around the capital, the new generation of cartel bosses steps into the open. Ovidio Guzmán López takes charge of Sinaloa, Nemesio Oseguera Cervantes rules Jalisco, and José Alfredo Cárdenas Martínez holds the Gulf coast. Washington adds all three to its most-wanted list within a week."
 zzz_mex.1.a: "Write down these names"
 zzz_mex.2.t: "Mexico Under the Cartels"
 zzz_mex.2.d: "The war ends with the federal government broken. The victors raise their own banners over Mexico City and abolish the old constitution, while the provinces are divided into fiefdoms. Whether this is order or merely a quieter form of anarchy depends on who is asked."
 zzz_mex.2.a: "A new order"
 SLA_ovidio_guzman_lopez_char: "Ovidio Guzmán López"
 TRC_nemesio_oseguera_cervantes_char: "Nemesio Oseguera Cervantes"
 TAM_jose_alfredo_cardenas_martinez_char: "José Alfredo Cárdenas Martínez"
 zzz_mex.0.t: "A New Hand on the Sinaloa Reins"
 zzz_mex.0.d: "With Joaquín Guzmán Loera extradited to the United States in January 2017, the Sinaloa Cartel passes to Ismael Zambada García. On the Gulf coast, José Alfredo Cárdenas Martínez has already been running the organisation since 2015. The old faces are gone; the business remains."
 zzz_mex.0.a: "The trade continues"
 SLA_ismael_zambada_garcia_char: "Ismael Zambada García"
