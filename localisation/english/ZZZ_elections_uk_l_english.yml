l_english:
 zzz_elections_uk.1.t:0 "United Kingdom General Election"
 zzz_elections_uk.1.d:0 "The parliamentary term has run its course. Party headquarters finalise campaign budgets and donors line up, while the country's political direction will be decided at the ballot box."
 zzz_elections_uk.1.a:0 "Fund the governing party's campaign (§Y-50§! Political Power)"
 zzz_elections_uk.1.b:0 "Fund the largest opposition campaign (§Y-75§! Political Power)"
 zzz_elections_uk.1.c:0 "Stay out of the campaign"
 zzz_elections_uk.2.t:0 "The Votes Are Counted"
 zzz_elections_uk.2.d:0 "The British electorate has spoken. The largest party will now form the new government, and a new parliamentary term begins."
 zzz_elections_uk.2.a:0 "Accept the result"
