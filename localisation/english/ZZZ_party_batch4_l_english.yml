l_english:
 zzz_party.140.t:0 "Colombia Turns Left"
 zzz_party.140.d:0 "Gustavo Petro won the 2022 election and took office, making Colombia's first left-wing government; the peace agreement and land reform are now on the agenda."
 zzz_party.140.a:0 "Accept the result"
 zzz_party.142.t:0 "A Social Democratic Government in Helsinki"
 zzz_party.142.d:0 "A five-party coalition led by the Social Democrats took office in Helsinki, continuing Finland's Nordic welfare-state course."
 zzz_party.142.a:0 "Accept the result"
 zzz_party.143.t:0 "Finland's Right-Wing Turn"
 zzz_party.143.d:0 "After the 2023 election the National Coalition Party led the cabinet, shifting Finland's fiscal and security policy toward a more conservative line."
 zzz_party.143.a:0 "Accept the result"
 zzz_party.144.t:0 "New Democracy Takes Athens"
 zzz_party.144.d:0 "New Democracy won the snap election and Kyriakos Mitsotakis became prime minister, ending Greece's austerity cycle after the debt crisis."
 zzz_party.144.a:0 "Accept the result"
 zzz_party.145.t:0 "The Social Democratic Alliance in Reykjavik"
 zzz_party.145.d:0 "A new government led by the Social Democratic Alliance took office in Reykjavik, adjusting Iceland's welfare and climate policies to the left."
 zzz_party.145.a:0 "Accept the result"
 zzz_party.146.t:0 "A Coalition Government in Dublin"
 zzz_party.146.d:0 "Fianna Fail and Fine Gael formed a coalition government for the first time, loosening Ireland's traditional two-party system."
 zzz_party.146.a:0 "Accept the result"
 zzz_party.147.t:0 "A Rotation Government in Jerusalem"
 zzz_party.147.d:0 "A cross-party coalition opposed to Netanyahu took office, producing a rare centrist arrangement in Israeli politics."
 zzz_party.147.a:0 "Accept the result"
 zzz_party.148.t:0 "The Israeli Right Returns"
 zzz_party.148.d:0 "After the 2022 election Netanyahu's right-wing bloc formed a new cabinet, shifting Israel's focus toward security and settlement issues."
 zzz_party.148.a:0 "Accept the result"
 zzz_party.149.t:0 "A Left-Wing Government in Mexico City"
 zzz_party.149.d:0 "Andres Manuel Lopez Obrador won the 2018 election, bringing Mexico's first left-wing government and a state-led turn in energy and anti-poverty policy."
 zzz_party.149.a:0 "Accept the result"
 zzz_party.151.t:0 "Red Flags over Kathmandu"
 zzz_party.151.d:0 "The Communist Party of Nepal (UML) won the 2017 election and K.P. Sharma Oli became prime minister, steering Nepal onto a left-wing republican course."
 zzz_party.151.a:0 "Accept the result"
 zzz_party.152.t:0 "A Parliamentary Turn in Kathmandu"
 zzz_party.152.d:0 "A new government led by the Nepali Congress took office in 2021, returning Nepal's political centre of gravity to centrist parliamentary politics."
 zzz_party.152.a:0 "Accept the result"
 zzz_party.155.t:0 "A Liberal Government in Bucharest"
 zzz_party.155.d:0 "A government led by the National Liberal Party took office in 2019, consolidating Romania's pro-European course."
 zzz_party.155.a:0 "Accept the result"
 zzz_party.157.t:0 "The Anti-Corruption Wave in Bratislava"
 zzz_party.157.d:0 "After the 2020 election OLaNO led the cabinet, replacing the previous Smer government with an anti-corruption and pro-European course."
 zzz_party.157.a:0 "Accept the result"
 zzz_party.158.t:0 "Smer Returns to Bratislava"
 zzz_party.158.d:0 "Smer regained power after the 2023 election, marking a clear turn in Slovakia's foreign and media policy."
 zzz_party.158.a:0 "Accept the result"
 zzz_party.159.t:0 "A Socialist Government in Madrid"
 zzz_party.159.d:0 "Pedro Sanchez's Socialists came to power through a 2018 no-confidence vote, moving Spain's political centre of gravity to the left."
 zzz_party.159.a:0 "Accept the result"
 zzz_party.160.t:0 "The Military Takes Over in Khartoum"
 zzz_party.160.d:0 "The Bashir regime fell amid protests and a Transitional Military Council seized power, opening a transitional period of contest between soldiers and civilians."
 zzz_party.160.a:0 "Accept the result"
 zzz_party.162.t:0 "A Transitional Government in Baghdad"
 zzz_party.162.d:0 "Adil Abdul-Mahdi formed a cabinet in 2018, and Iraq's sectarian quota system continued to operate under protest and reconstruction pressure."
 zzz_party.162.a:0 "Accept the result"
 zzz_party.163.t:0 "A Left-Wing Government in Santiago"
 zzz_party.163.d:0 "Gabriel Boric won the 2021 election, making Chile's first left-wing coalition government and putting constitutional reform and social policy on the agenda."
 zzz_party.163.a:0 "Accept the result"
