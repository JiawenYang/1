 africa_nationalism_desc: "§RWe must rely on Africans themselves to liberate Africa. Africans should handle their own affairs and rely on their own strength.§!\n--Mao Zedong"
 MAY_politics: "Malaysian Politics"
 MAY_politics_desc: "\n\n\n\n\n\n£GFX_MAY_politics_texticon_embed\n\n\n\n\n\n\n\n§gMalaysian Chinese Textbooks§!\n\nThe Raja or Sultan is the head of government whom the people must respect. The monarchical agreement between the monarch, Sri Deri Buana, and the people, Demandal Baldavan, gives rise to the concepts of monarchical power and betrayal.\n\n§YMonarchical Power: Monarchical power symbolizes the ruling authority of the monarch. The Raja or Sultan governs his government with wisdom, high moral character, and intelligence.§!\n\n§RBetrayal: Betrayal means that the people disobey the orders of the Raja or Sultan. People who betray their monarch will suffer misfortune or disaster.§!"
 IND_politics: "Panchashila"
 IND_politics_desc: "\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_IND_politics_texticon_embed\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe shield in the center of the Indonesian national emblem represents the Five Principles of Indonesia. A poster issued in 1987 explained the corresponding symbols for the five principles below the national emblem. The Five Principles are:\nBelief in a single, unique God\nHumanitarianism based on justice and civilization\nUnity and solidarity of Indonesia\nDemocracy guided by the wise principles of representative government and consultation\nSocial justice for all Indonesians\n\nPanchashila, proposed by Indonesia's first president Sukarno in June 1945, mandates that political parties must adhere to the Five Principles of Indonesian National Founding. These Five Principles are one of the fundamental tenets of the Indonesian Constitution."
