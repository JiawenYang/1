 CHI_THEIR_LAND_THEIR_BLOOD: "Their land, their blood"
 CHI_THEIR_LAND_THEIR_BLOOD_desc: "Since the Han and Tang dynasties, the nations of Asia have lived in harmony and nurtured all living beings. Yet the Japanese invaders abandoned benevolence and justice, repeatedly waging wars, poisoning neighboring countries, and committing crimes so enormous that they defy all description.\n\nIn ancient times, Japanese pirates ravaged our coasts, slaughtered cities, plundered lands, and killed innocent people. In modern times, they invaded China in the First Sino-Japanese War, occupied our territories, and oppressed our people. During World War II, their iron hooves trampled all over East Asia. They slaughtered 300,000 innocent people in the Nanjing Massacre, burning, killing, raping, and looting without restraint. The Korean Peninsula and Southeast Asian nations were enslaved, with corpses covering the ground and blood flowing like rivers. They conducted human experiments, bacterial warfare, and chemical warfare—extremely cruel, a disgrace to human civilization.\n\nAfter the war, they refused to repent, denied their crimes, worshiped war criminals, falsified history, defied justice, and insulted the souls of the dead.\n\nNow justice is revealed, and the way of heaven runs in cycles. The nations of Asia share a common hatred and jointly punish the evil. We will settle blood debts, severely punish the culprits, comfort the souls of the innocent, and defend the righteous path of the world.\n\n§RThese crimes will not be tolerated by heaven and earth; this evil must be eliminated for Asia to rest in peace!§!"
