 china.71: "Three Represents Thought"
 china.71.t: "Three Represents Thought"
 china.71.d: "On February 20, 2000, Comrade Jiang Zemin attended the “Three Talks” education meeting for leading cadres in Gaozhou City, Guangdong Province and delivered an important speech. In his speech, he put forward the “Five Always” requirements, namely, “We must ensure that the Party always maintains the nature of the vanguard of the working class, always represents the interests of the vast majority of the people, always represents the advanced productive forces of society, always leads the people of all ethnic groups in the country to promote the development of social productive forces, always plays a strong and powerful role as the core of leadership, and must also further build the Party ideologically, organizationally and in terms of style in light of the new historical conditions."" 
 china.71.a: "The key to getting China's affairs done well lies in our Party."
 china.76: "A conference on military political work was held in Gutian"
 china.76.t: "A conference on military political work was held in Gutian"
 china.76.d: "A conference on military political work was held in Gutian Town, Shanghang County, Fujian Province, on October 30th. Xi Jinping, General Secretary of the CPC Central Committee, President of the People's Republic of China, and Chairman of the Central Military Commission, attended the meeting on the 31st and delivered an important speech. Xi Jinping emphasized that the contemporary theme of military political work is to closely focus on realizing the Chinese Dream of the great rejuvenation of the Chinese nation and provide a strong political guarantee for achieving the Party's goal of strengthening the military under the new circumstances. The entire military must adhere to the guidance of Marxism-Leninism, Mao Zedong Thought, Deng Xiaoping Theory, the important thought of “Three Represents”, and the Scientific Outlook on Development, implement the Party Central Committee's deployment and requirements on comprehensively advancing the rule of law and strict Party discipline, implement the principles of governing the military according to law and strictly, closely focus on the contemporary theme of our military political work, strengthen and improve our political work under the new circumstances, and give full play to the lifeline role of political work in strengthening and revitalizing the military."
 china.76.a: "The Gutian Conference will shine forever."
