 CRO_slavoniadalmatia_divide: "Slavonia-Dalmatia Divide"
 CRO_slavoniadalmatia_divide_desc: "Our coastline is the shining gem of Croatia - with the crystal clear Adriatic and picturesque landscapes making for one of the top tourist destinations in Europe and one of the biggest sources of income for Croatia since 1991 - not to mention the massive shipbuilding industry in the biggest cities on the coast. The problem from this comparatively prosperous development was the neglect of the northern half of our country in the fertile valley of Slavonia, resulting in the lack of industry being developed and as such the region being largely left agrarian despite many untapped reserves of resources - the most glaring example of this divide being that only 2 out of 100 major Croatian businesses originate from Slavonia."
 CRO_european_reliance: "European Reliance"
 CRO_european_reliance_desc: "One of the flaws of a thriving tourist sector and a central bank turned into an exchange is the autark's biggest nightmare - reliance on other nations. Most of our economy relies on shipbuilding, tourism and transit, with our own industry exports making up only a quarter of our total GDP. Inevitably, Croatia has turned into a country reliant on the European Union both economically and politically, leaving little headroom for Croatia to assert itself as a regional power. Another consequence was a rise in populism amongst the people, frustrated at Croatia's politicians lack of interest in reducing overreliance and being nothing more than pawns of Brussels."
 CRO_fading_grudges: "Fading Grudges"
 CRO_fading_grudges_desc: "Croatia was one of the biggest participants of the Yugoslav wars, with our men on the frontlines battling Serbs and Bosnians in Slovenia and Central Yugoslavia. Now that the wars are over, and disputes started being solved in favour of partnership and collective ascension into the European Union, the rope on the powderkeg that is the Balkans seems to have lengthened exponentially at least for the northern parts of former Yugoslavia - with the Croatia-Serbia border dispute becoming dormant and the Slovenia sea zone border dispute being nothing more than an annoyance to local fishermen."
 PRC_corrupt_bureaucracy_idea: "Corrupt Bureaucracy"
 PRC_corrupt_bureaucracy_idea_desc: "\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner\n\n\n\n\n\n                           §YI hate them§!.\nSince the dynasties of old, China has always been rife with corruption. From backstabbing eunuch to the warlords who only knew how to burn and loot, or the Nationalist bureaucrats who only cared about their own pockets, the people have suffered them for thousands of years. Because of that, the CPC was able to emerge from the bloody struggles, sweeping away the evil forces. However, after several campaigns initiated by Mao and the reform under Deng, the party's cadres have unintentionally become a new upper class. The imbalanced and inadequate economic development, the culture of distrust and factional struggle have spread the bribery and cronyism among officials."
 ENG_nato_eu_leader_idea: "NATO's European Bulwark"
 FRA_french_spirit_idea: "French Spirit"
 FRA_french_spirit_idea_desc: "\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\nThroughout the early 19th and 20th centuries, Paris was occupied twice. First in 1870, then in 1940. Since then, France has vowed never to let a foreign country occupy their lands. The French Army stands ready to defend the nation to the last. French nuclear missiles maintain an umbrella of defense around the nation, threatening all who dare threaten the homeland with hellfire.\n\nYet, the French spirit is not just about the defense of the nation, but about revolution as well. The heartland of European Liberalism and Leftism in 1789, the French radical spirit has persisted throughout the past two centuries. The French people are not ones to tolerate injustice or mistreatment, and would rather die standing than live kneeling. As such, any attempts at frustrating the will of the people will be met with mass protests, riots, and possibly revolution - a process well practiced by the French people by this point"
 GER_limit_army_name: "Demilitarization"
 GER_limit_army_name_desc: "\n\n\n\n\n£GFX_SPR_limit_army_embed \n\n\n\n\n\n\nFollowing the collapse of the Warsaw Pact, the trend of demilitarization gained popularity in Western Europe, as the expensive military expenditures were gradually redirected toward more civilian-focused goals. Deep down, no one wanted to relive the frenzied arms race of the Cold War era. Perhaps only when the bear emerges from its den will it be possible to convince the public of the need for rearmament."
 JAP_japanese_pacifism_idea: "Japanese Pacifism"
 JAP_japanese_pacifism_idea_desc: "Ever since the end of the Second World War, Japan has been force to abandon the old ways of militarism and embrace a more pacifist way of living compared to the past. With Article 9 of the Constitution, it makes it nearly impossible for the nation to raise any army. However, with the rising threat of China to the east and an ever declining United States, many have begun to question the status quo and propose the abolition of Article 9 and raising of a proper army to defend Japan and her people."
 JAP_aging_population_idea: "Aging Population"
 JAP_aging_population_idea_desc: "Over 76.4% of the Japanese population is considered elderly, largely caused by a period of infertility following our 1940's post war baby boom and a high life expectancy. Despite the extreme demographic inbalance, there is no real sense of a population crisis, and living standards are still relatively high today. However, this has brought on large amounts of economic strain on the already stagnant Japanese economy, by in large to the huge amounts of the population being retired and a high need for care services being placed on the government. The Japanese government has went on to begin introducing new ways for the elderly to become active in society once more, while also subsidising new families and strongly encouraging for new children to be born with easier nursing services."
 JAP_economic_stagnation_idea: "Economic Stagnation"
 JAP_economic_stagnation_idea_desc: "Japan's economy has been plagued by stagnation in recent years, with slow growth, low inflation, and a shrinking population posing significant challenges. The country's economic stagnation can be attributed to a combination of factors, including demographic trends, deflation, and a lack of structural reforms.\nOne of the primary drivers of Japan's economic stagnation is its aging and shrinking population. The country has one of the oldest populations in the world, with a low birth rate and a rapidly aging workforce. This demographic trend has led to a decline in the labor force and a decrease in consumer spending, which has hampered economic growth."
 JAP_keiretsu_control_idea: "Keiretsu Control"
 JAP_keiretsu_control_idea_desc: "Japan's main industrial cog has always been the mighty business conglomerate groups that have come to dominate the economy since the Meiji Restoration. More historically known as the Zaibatsu - today known as the Keiretsu, have become so integral to the flow of the Japanese economy that some have even come to be known as state-sponsored monopolies, purely due to how high of a market share they hold. The power of the Keiretsu is mainly derived from each member company of a Keiretsu owning a portion of shares in each partner company, with them being centered on a core bank. As such, every company in a Keiretsu can insulate eachother from changes in the market and takeovers in management, allowing for long-term projects to be organized on a whim with little to no risk. The Keiretsu have come to largely control most of Japan's monolithic manufacturing sector, and unless the government seeks to change the status quo, it is unlikely to be quashed."
 JAP_political_monopoly_idea: "Political Monopoly"
 JAP_political_monopoly_idea_desc: "\n\n\n\n£GFX_JAP_political_monopoly\n\n\n\n\n\nThe Liberal Democratic Party has been the dominant political force in Japan since its formation in 1955. With only a few brief interruptions, the LDP has held a majority in the Japanese Diet for most of its existence, effectively giving the party a political monopoly and making Japan a de facto one-party state.\nIn recent years, there have been some signs of change in Japan's political landscape, with new parties emerging and challenging the LDP's dominance. However, it remains to be seen whether these developments will lead to a more competitive and pluralistic political system in Japan, or if the LDP will continue to maintain its stranglehold on power."
