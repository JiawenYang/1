 MZB_flag_of_the_kalashnikov: "Flag of the Kalashnikov"
 MZB_flag_of_the_kalashnikov_desc: "\n\n\n\n\n£GFX_MZB_flag_of_the_kalashnikov_embed \n\n\n\n\n\n\nMozambique's flag features an AK-47 with a bayonet crossed with a hoe, a reminder of the nation's struggle for independence and its commitment to defense and progress, reflecting Mozambique’s liberation from Portuguese colonial rule in 1975. \n\nThe hoe symbolizes agriculture and development, while the open book signifies education. Mozambique is the only nation with a modern firearm on its flag, making it a distinctive symbol of its revolutionary past."
 MZB_central_african_railway_network: "The Central African Railway Network"
 MZB_central_african_railway_network_desc: "\n\n\n\n\n£GFX_MZB_central_african_railway_network_embed \n\n\n\n\n\n\nThe Central African Railway network running through Mozambique is a crucial transportation link connecting landlocked nation. Key corridors include the Beira Corridor, leading to the port of Beira, and the Nacala Corridor, providing access to the deep-water port of Nacala. These railways play a vital role in regional trade, facilitating the export of minerals, agricultural products, and goods."
 PAK_fervent_nationalism: "Fervent Nationalism"
 PAK_fervent_nationalism_desc: "\n\n\n\n\n£GFX_PAK_shatter_legacy_embed \n\n\n\n\n\n\nAugust 11 commemorates Pakistan's independence and separation from British India, a process marked by devastating violence that displaced over 15 million people and caused the deaths of 1 to 2 million. Hindus, Muslims, and Sikhs-communities that had coexisted for centuries-became entangled in sectarian violence, leaving scars that have endured across generations.\n\nMohammad Ali Jinnah, Pakistan's founding father, sought to create a democratic, egalitarian, and secular nation where the subcontinent's Muslims, who made up about 25% of the population, could enjoy complete equality. For much of his life, Jinnah advocated for this equality within a unified, Hindu-majority India. However, he later concluded that a separate homeland was necessary to achieve this vision.\n\nJinnah emphasized the importance of secular education to uplift the Muslim community's social and economic conditions. He championed gender equality and opposed practices such as parda. Although he left no books or memoirs, his speeches offer deep insights into his aspirations for Pakistan. Notably, his August 11, 1947, address-delivered just days before becoming Pakistan's first president-articulated his secular vision for the new nation. He declared:\n\n"You are free; you are free to go to your temples, you are free to go to your mosques or any other places of worship in this State of Pakistan. You may belong to any religion, caste, or creed-that has nothing to do with the business of the State."\n\nJinnah’s achievements remain a cornerstone of 20th-century history. However, decades later, Pakistan bears little resemblance to the country he envisioned.\n\nToday, ideology and religion are divisive forces in Pakistan, exemplified by sectarian violence against Shia Muslims and blasphemy laws that mandate capital punishment for offenses against Islam. The state's interpretation of religion heavily influences politics and governance, as seen in the systemic oppression of the Ahmadiyya community, a religious minority targeted by state policies.\n\nPakistan also remains on a turbulent political and economic trajectory. The military has directly controlled the state for most of its existence, with four military coups and decades of military rule since 1958. The military and its notorious intelligence agencies still directly control domestic and foreign policy, making decisions to protect their power and economic interests.\n\nWhile today’s Pakistan is far from Jinnah’s vision, there are still people who fight every day for the Pakistan that could have been, and they will always remember the words of Pakistan’s most famous revolutionary poet, Faiz Ahmed Faiz:\n\n“Come, we must search for the promised Dawn”."
 PAK_military_incharge_name: "Military is the Real Authority"
 PAK_military_incharge_desc: "\n\n\n\n\n£GFX_PAK_military_incharge_embed \n\n\n\n\n\n\nThe Republic of Pakistan is, on paper, a democratic society where constitution-guaranteed elections are held and the government serves the people. In reality, the government bends to the will of the military. Ever since the foundation of the republic, the military has played a prime role in national politics, with our government's past riddled with military coups and interference. If any reform is to be passed, it must go through the traditionalist and hardliner minds of the military."
 PHI_legacy_of_the_martial_law_idea: "Legacy of the Martial Law"
 PHI_legacy_of_the_martial_law_idea_desc: "The Martial Law, and by extension the presidency of the now dead Ferdinand Marcos remains a controversial topic in mainstream Philippine politics as his autocratic policies have left a scarring mark that would last up to this day."
 PHI_mutual_defence_treaty_idea: "Mutual Defense Treaty"
 PHI_mutual_defence_treaty_idea_desc: "The Mutual Defense Treaty is a comprehensive agreement signed between the United States of America and the Republic of the Philippines during its early years of independence marked by communist insurgencies. "
 PHI_marcos_family_idea: "The Marcos Family"
 SAF_anc_corruption: "ANC Corruption"
 SOV_kleptocratic_state: "Kleptocratic State"
 SOV_kleptocratic_state_desc: "The privatization of the former Soviet economy could not come quick enough for Boris Yeltsin, so once the Union fell, he pursued 'shock therapy' - removing regulations and selling off entire industries practically overnight. Corrupt officials, party apparatchiks, and other less-than-ethical entrepreneurs bought former state-run companies for kopeks on the ruble, meaning that economic power stayed in the hands of a few friends of the government. They kept their power by cultivating relationships and cutting backroom deals with the Yeltsin administration, and they were the target of widespread furor after the 1998 national economic crisis."
 SOV_Russian_Orthodox_Church: "Russian Orthodox Church"
 SOV_Russian_Orthodox_Church_desc: "\n\n\n\n£GFX_SOV_russian_orthodox_church\n\n\n\n\n\nFor more than a thousand years, Orthodox Christianity was the dominant religion in Russia, from the late era of the Kievan Rus, to the days of the Tsar. Undeniably, our people were extremely religious, especially those in the countryside, and despite the Soviet Union's best efforts to promote State Atheism, they still are. As such the Russian Orthodox Church is one of the most powerful political weapons president Putin has by his side. While the church makes sure to exert the president's influence all over Russia's elderly population and the rural areas of our Federation, it can also be used to discredit any forms of opposition, or any movements that may affect out own culture negatively, such as the LGBT movement. In return, we have made sure to recognize Russian Orthodoxy as the de-facto major religious group in Russia, and restrict other christian groups from growing. As such we can rest assured that the clergy will remain by our side, and that our citizens have something to bother themselves with, other than the constant setbacks of our government."
