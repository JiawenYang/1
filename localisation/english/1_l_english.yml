 mcdonald_nationalism: "We have McDonald's, what about you?"
 mcdonald_nationalism_desc: "When McDonald's entered the former Eastern European communist countries, owning a McDonald's even became part of national pride, and was even written into football team songs to mock countries that didn't have McDonald's.\n\n§RTherefore, whether in games or in reality, the Nationalist Outlook of these countries manifests itself as Western Outlook.§!"
