 SOV_chechen_republic: "Chechen Republic"
 CHI_beijing_municipality_desc: "The capital of the People's Republic of China, the national political center, cultural center, international exchange center, and scientific and technological innovation center."
 CHI_tianjin_municipality_desc: "One of the municipalities directly under the Central Government, an important central city in China, a national historical and cultural city, a modern marine city, and an international comprehensive transportation hub city."
 CHI_shanghai_municipality_desc: "One of the municipalities directly under the Central Government, a national historical and cultural city, and an international economic, financial, trade, shipping, and scientific and technological innovation center."
 CHI_chongqing_municipality_desc: "One of the municipalities directly under the Central Government, an important central city in China, a national historical and cultural city, and an international comprehensive transportation hub city."
 CHI_guangxi_zhuang_autonomous_region_desc: "China's frontier and window for opening up and cooperation with ASEAN, and an important security barrier in Southwest and Central South China."
 CHI_ningxia_hui_autonomous_region_desc: "Located at the hub of the Silk Road Economic Belt, it is an important node in the construction of the Western Land-Sea New Corridor and an important region supporting the implementation of national strategies such as the Great Western Development, the ecological protection of the Yellow River Basin and high-quality development."
 CHI_tibet_autonomous_region_desc: "An important national security barrier, ecological security barrier, strategic resource reserve base, clean energy base, plateau specialty agricultural product base, world tourist destination and an important channel for opening up to South Asia."
 CHI_tibet_desc: "An important national security barrier, ecological security barrier, strategic resource reserve base, clean energy base, plateau specialty agricultural product base, world tourist destination and an important channel for opening up to South Asia."
 CHI_xinjiang_uygur_autonomous_region_desc: "An important security barrier in Northwest China and a bridgehead for opening up to the west."
 CHI_xinjiang_uygur_desc: "An important security barrier in Northwest China and a bridgehead for opening up to the west."
 CHI_inner_mongolia_autonomous_region_desc: "Located in the northern border of the motherland, straddling Northeast China, North China and Northwest China, it is an important ecological security barrier in northern China, a security and stability barrier in the northern border of the motherland, an important national energy and strategic resource base, an important national agricultural and livestock production base, and an important bridgehead for China's opening up to the north."
 CHI_hong_kong_desc: "I am like the golden leopard guarding the palace gates at night,\nMother, though my status is humble, my position is crucial.\nNow the ferocious sea lions pounce upon me,\nDevouring my flesh, swallowing my essence;\nMother, I cry and wail, but you do not answer.\nMother, let me hide in your embrace!\nMother! I want to return, Mother!"
 CHI_macau_desc: "You know that 'Macau' is not my true name?\nI've been away from your embrace too long, oh Mother!\nThough they took captive my physical form,\nYou still safeguard the essence of my soul.\nThrough three hundred years of longing for my birth mother!\nPlease call me by my childhood name,\nUtter once more 'Aomen'!\nMother! I shall return, oh Mother!"
 CHI_taiwan_autonomous_region_desc: "We are a string of pearls from the East China Sea,\nRyukyu is my younger brother, and I am Taiwan.\nThe spirit of Zheng still lingers in my heart,\nThe blood of loyalty stains my family heritage.\nMother, the scorching summer sun is about to kill me,\nGrant me an order, and I can fight to the last drop.\nMother! I want to return, Mother!"
 CHI_taiwan_desc: "We are a string of pearls from the East China Sea,\nRyukyu is my younger brother, and I am Taiwan.\nThe spirit of Zheng still lingers in my heart,\nThe blood of loyalty stains my family heritage.\nMother, the scorching summer sun is about to kill me,\nGrant me an order, and I can fight to the last drop.\nMother! I want to return, Mother!"
 CHI_beijing: "Capital"
 CHI_beijing_desc: "The peony in the courtyard is wild and has no style, the lotus in the pond is pure and has little emotion\nOnly the peony is the true national beauty, and the capital is moved when the flowers bloom"
 CHI_shanghai: "Pudong New Area"
 CHI_shanghai_desc: "The development and opening up of Pudong has driven Shanghai onto the path of overall transformation and has also injected new impetus into the reform and opening up of the entire Yangtze River Delta, the Yangtze River Basin, and even the whole country."
 CHI_XinJiang_Situation: "Xinjiang Situation"
 CHI_XinJiang_Situation_desc: "The threat level of local extreme separatist activities directly affects our level of control over the region and seriously hinders the normal economic order in the region.\n\n§YSeparatist Threat§!: [?CHI.uighur_threat|%%]\n§YUighur Public Opinion§!: [?CHI.uighur_opinion|%%]"
 CHI_hebei: "Beijing-Tianjin Center"
 CHI_hebei_desc: "Located in the capital, it is one of the key areas for implementing the Beijing-Tianjin-Hebei coordinated development strategy."
 CHI_guangdong: "Giant in the Pearl River Delta"
 CHI_guangdong_desc: "The vanguard, pioneer and experimental zone of reform and opening up, and an important window for showing the achievements of China's reform and opening up to the world."
 CHI_shanxi: "Coal Base"
 CHI_shanxi_desc: "A strategic fulcrum supporting the ecological protection and high-quality development of the Yellow River Basin, one of the earliest birthplaces and central areas of Chinese civilization, an important energy base and mineral resource province in China, and an important green ecological barrier in North China."
 CHI_henan: "Rise of the Central Plains"
 CHI_henan_desc: "Located in the Central Plains, it is an important area supporting the implementation of national strategies such as the rise of the central region, ecological protection and high-quality development of the Yellow River Basin."
 CHI_shandong: "The State of Shandong Business"
 CHI_shandong_desc: "It is an important hub that promotes the linkage between the north and the south, the coordination between the east and the west, the land and the sea, and connects Northeast Asia and the Belt and Road Initiative. It is a strategic fulcrum for the economic development of northern China and an important industrial base."
 CHI_liaoning: "Industrial Base"
 CHI_liaoning_desc: "An important old industrial base in China, an important region for promoting the comprehensive revitalization of Northeast China in the new era."
 CHI_jilin: "Heavy Machinery in the North"
 CHI_jilin_desc: "Located in the geographical center of Northeast Asia, it is an important region for China to open up to Northeast Asia, and an important national commercial grain base and old industrial base."
 CHI_heilongjiang: "Ice and Snow Heavy Industry"
 CHI_heilongjiang_desc: "Located in the central region of Northeast Asia, it is an important national commercial grain production base, heavy equipment production and manufacturing base, important energy and raw material base, northern ecological security barrier, and a new highland for opening up to the north."
 CHI_jiangxi: "Cradle of the Red Revolution"
 CHI_jiangxi_desc: "Located in the middle and lower reaches of the Yangtze River, it is an important region supporting the implementation of national strategies such as the rise of the central region and the development of the Yangtze River Economic Belt."
 CHI_hubei: "Jiangcheng Hub"
 CHI_hubei_desc: "Located in the middle reaches of the Yangtze River, Hubei has advantages in transportation, industry and agriculture, and is an important economic and transportation hub in the central region."
 CHI_hunan: "Hunan and Chu"
 CHI_hunan_desc: "It is an implementation region for major national strategies such as the development of the Yangtze River Economic Belt and the rise of the central region, and an important province for China's industrial development."
 CHI_jiangsu: "Southern Jiangsu Economic Zone"
 CHI_jiangsu_desc: "Located at the intersection of the Silk Road Economic Belt and the 21st Century Maritime Silk Road, it is an important region supporting the implementation of major national regional strategies such as the development of the Yangtze River Economic Belt and the integrated development of the Yangtze River Delta."
 CHI_anhui: "New and Emerging Central Anhui"
 CHI_anhui_desc: "It is an implementation region for major national strategies such as the integrated development of the Yangtze River Delta, the development of the Yangtze River Economic Belt, and the rise of the central region, and an important province for China's scientific and technological innovation. "
 CHI_zhejiang: "Donghai Commercial Capital"
 CHI_zhejiang_desc: "The intersection of the Yangtze River Economic Belt and the integrated development strategy of the Yangtze River Delta, and a pioneer of Chinese-style modernization."

