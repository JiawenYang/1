 USA_prodem: "§BDemocratic States§!"
 USA_prodem_desc: "§BStates of Progress & Innovation§!\nDemocratic-leaning states usually support more liberal economic policies and attach importance to social welfare, education, technological innovation, and environmental protection. Because they support innovation and cultural industries, these states usually have higher productivity and support from high-tech industries, although they may be less resource-rich, so local resource corrections are relatively light. Democratic-leaning states usually invest more in education, technology, and health care, which promotes population growth and talent aggregation."
 USA_progop: "§RRepublican States§!"
 USA_progop_desc: "§RStates of Conservatism & Strength§!\nRepublican-leaning states generally support more conservative economic policies that emphasize market freedom, low taxes, and reduced government intervention, which makes them more dependent on energy extraction, heavy industry, manufacturing, and agriculture. Because these states usually have abundant natural resources (especially oil and gas) and strong military and infrastructure construction, these areas tend to have higher local production capacity and industrialization levels. Although they are more resource-rich, these states have less productivity growth and innovation investment, so their focus is more on industrialization and military construction."
