 VEN_bolivarian_revolution: "Bolivarische Revolution"
 VIN_fifty_years_resistance_name: "50 Years of Resistance"
 VIN_fifty_years_resistance_name_desc: "\n\n\n\n\n£GFX_VIN_matyr_day_texticon_embed \n\n\n\n\n\n\n§gA young volunteer lights a cigarette for an elderly man. Both have lost a leg. They are in Hoa Lan Commune, Hoa Vang District, Da Nang. Beside them is a mass grave of 45 students who were killed when the American Air Force deliberately bombed the Man Quang primary school area on March 16, 1965.§!\n\n"A nation that has courageously resisted French enslavement for over 80 years, a nation that has resolutely stood with the Allies against fascism in recent years, that nation must be free! That nation must be independent !"\n- Declaration of independence of the Democratic Republic of Vietnam\n\nFrom the foundation of Viet Minh in 1941 to the end of Sino-Vietnamese conflicts in 1991, Vietnam has finally found peace."
 VIN_fifty_years_resistance_4_name: "Healing Scars"
 VIN_fifty_years_resistance_4_name_desc: "\n\n\n\n\n£GFX_VIN_veteran_texticon_embed \n\n\n\n\n\n\n§gVeterans of the Liberation War.§!\n\nGlory to martyrs! Their sacrifice and dedication will never be forgotten. But for now, we have to march foward."
 VIN_doi_moi_name: "Doi Moi"
 VIN_doi_moi_name_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§gA corner of Ho Chi Minh city street in 1990s.§!\n\nDoi Moi is the name given to the economic reforms initiated in Vietnam started in 1986 with the goal of creating a "socialist-oriented market economy". The Doi Moi Policy refers specifically to these reforms that sought to transition Vietnam from a command economy to a socialist-oriented market economy.\nThe Doi Moi economic reforms were initiated by the Communist Party of Vietnam in 1986 during the party's 6th National Congress. These reforms introduced a greater role for market forces for the coordination of economic activity between enterprises and government agencies and allowed for private ownership of small enterprises and the creation of a stock exchange for both state and non-state enterprises."
 VIN_doi_moi_name_1: "Doi Moi"
 VIN_doi_moi_name_1_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§gA corner of Ho Chi Minh city street in 1990s.§!\n\nDoi Moi is the name given to the economic reforms initiated in Vietnam started in 1986 with the goal of creating a "socialist-oriented market economy". The Doi Moi Policy refers specifically to these reforms that sought to transition Vietnam from a command economy to a socialist-oriented market economy.\nThe Doi Moi economic reforms were initiated by the Communist Party of Vietnam in 1986 during the party's 6th National Congress. These reforms introduced a greater role for market forces for the coordination of economic activity between enterprises and government agencies and allowed for private ownership of small enterprises and the creation of a stock exchange for both state and non-state enterprises."
 VIN_patriotic_tradition_name: "Determined To Fight And Determined To Win"
 VIN_patriotic_tradition_name_desc: "\n\n\n\n\n£GFX_VIN_determine_to_win_texticon_embed \n\n\n\n\n\n\n§gThe departure ceremony of the Hanoi Youth Volunteer Group to fight against the US Imperialism, held at the Hanoi Opera House, July 11, 1969§!\n\n“Mr. Schoenbrun, we have a secret weapon ... don't smile when I tell you this. Our secret weapon is nationalism. To have nationhood, which is a sign of maturity, is greater than any weapons in the world.”\n- Ho Chi Minh\n\nWhat made a small country able to stand up to a much stronger enemy? What made a backward army able to defeat the most powerful and advanced army in the world? For the Vietnamese people, the answer is nothing but iron will and passionate patriotism. Over thousands years of history, every time the country is invaded, that spirit gets ignited, forms a huge and powerful wave, passes through all dangers and difficulties, and engulfs our enemies, both the traitors and the invaders. The patriotism of each person, and each ethnic group is a part of the patriotic tradition of the Vietnamese country. Patriotism is the most prominent and encompassing tradition that has become the strength and driving force to defeat all invaders."
 VIN_failure_of_1980s_name: "Failures of 1980s"
 VIN_failure_of_1980s_name_desc: "\n\n\n\n\n£GFX_VIN_bao_cap_texticon_embed \n\n\n\n\n\n\n§gPeople line up to buy food during the Subsidy period.§!\n\nRight after the unification of the nation, Vietnam promptly initiated a rapid industrialization policy, aiming to progress towards socialism. However, due to the rigid adoption of the Soviet economic model, the lack of scientific and technical expertise and the country has suffered immensely from the impacts of war. The industrialization process was executed in a disorderly manner, leading to a state of stagnation and eventual recession. The balance between supply and demand was adversely affected as the government prioritized heavy industry while neglecting the development of light industry. Additionally, agricultural output continuously declined, necessitating the importation of rice from the Soviet Union. The money reform in 1985 further exacerbated the economic situation, resulting in a staggering 393% inflation rate. Despite various reform efforts and corrective actions, the repercussions of the missteps from the 1980s continue to cast a significant shadow over the economy."
 chinese_territory_category: "Chinese Lost Territories"
 chinese_territory_category_desc: "\n\n\n\n\n\n\n£PLA_Marine\n\n\n\n\n\n\n\n\n\nAs Chinese influence in the world, especially in East Asia, is growing, the problems left over from history imposed by imperialism in the past can finally see the hope of being resolved today.\n\n§YTibet§!:[GLOBAL.get_xizang_status]\n§YXinjiang§!:[GLOBAL.get_xinjiang_status]\n§YHongkong§!:[GLOBAL.get_hongkong_status]\n§YMacau§!:[GLOBAL.get_macau_status]\n§YMongolia§!:[GLOBAL.get_mongolia_status]\n§YDiaoyu Islands§!:[GLOBAL.get_diaoyu_status]\n§YSouth China Sea Islands§!:[GLOBAL.get_nanhai_status]\n§YTaiwan§!:[GLOBAL.get_taiwan_status]\n§YSouthern Tibet§!:[GLOBAL.get_zangnan_status]"
 land_boundary_pro_chinese: "Agree a Land Boundary with India based on Chinese Claim"
 land_boundary_pro_chinese_desc: "Now that we have reduced tensions with the Indians and they have finally befriend with us, it should be possible to negotiate a delineation of the land boundary between two nations based on our claim."
 land_boundary_neutral: "Agree a Land Boundary with India"
 land_boundary_neutral_desc: "Now that we have reduced tensions with the Indians it should be possible to negotiate a delineation of the land boundary between two nations."
 demand_japan_commit_war_crime: "Demand Japan Commit War Crime"
 demand_japan_commit_war_crime_desc: "Now the ideas of pacifism and socialism have triumphed in Japan, and our country has been able to gradually establish itself as the center of Asian politics. It is time, then, to completely reckon with the guilt of Japanese militarism. We will complete the unfinished tasks under the control of GHQ and the US military, and let the war criminals and butchers of the past atone for their war crimes!"
