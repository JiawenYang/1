 NSTFR_VIN_people_army_idea_desc: "\n\n\n\n£GFX_NSTFR_VIN_people_army_idea\n\n\n\n\n\nThe Vietnam People's Army originated from the Viet Minh army during the revolutionary era and is the armed force of the current Socialist Republic of Vietnam. According to past traditions and constitutional provisions, the People's Army must strictly adhere to the principle of "the Party commands the gun" and accept the leadership of the Communist Party of Vietnam. Due to the influence of the People's Liberation Army of China from the north during its formation process, the Vietnam People's Army shares certain similarities with China in its combat methods and military ideology."
 ITA_corruption: "Corruption"
 ITA_corruption_desc: "The Italian political system is far less stable and impartial than comparable European systems. Cronyism and corruption are huge problems in local administration, the judiciary, and even the federal government."
