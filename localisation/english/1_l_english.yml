 vt4_decision: "VT-4 Main Battle Tank"
 vt4_decision_desc: "The VT-4 Main Battle Tank (MBT-3000) is a new generation foreign trade main battle tank developed by China North Industries Corporation, with advanced fire control system, powerful power system and excellent protection performance. The tank uses a 125mm smoothbore gun, equipped with an automatic loader, and can fire a variety of ammunition, including fin-stabilized armor-piercing discarding sabot, high-explosive grenade and gun-launched missile. The power system of the VT-4 tank uses a 1300 horsepower diesel engine, with a maximum speed of 70 km/h and a range of more than 500 km. In terms of protection, the VT-4 tank uses composite armor and explosive reactive armor, with good anti-strike capability. The tank is also equipped with advanced information systems, which can realize battlefield situation awareness and command control."
 VT-4: "VT-4"
 type100_decision: "Type 100 Main Battle Tank"
 type100_decision_desc: "The Type 100 Main Battle Tank is a new generation main battle tank independently developed by China, with advanced fire control system, powerful power system and excellent protection performance. The tank uses a 105mm smoothbore gun, equipped with an automatic loader, and can fire a variety of ammunition, including fin-stabilized armor-piercing discarding sabot, high-explosive grenade and gun-launched missile. The power system of the Type 100 tank uses a 1500 horsepower diesel engine, with a maximum speed of 75 km/h and a range of more than 550 km. In terms of protection, the Type 100 tank uses composite armor and explosive reactive armor, with good anti-strike capability. The tank is also equipped with advanced information systems, which can realize battlefield situation awareness and command control."
 TYPE100_TANK: "Type 100"
 type100_support_decision: "Type 100 Support Vehicle"
 type100_support_decision_desc: "The Type 100 Support Vehicle is a new generation support vehicle independently developed by China, mainly used to provide fire support for infantry and anti-tank operations. The vehicle uses a 30mm cannon and anti-tank missile system, with strong fire strike capability. The power system of the Type 100 support vehicle uses an 800 horsepower diesel engine, with a maximum speed of 65 km/h and a range of more than 450 km. In terms of protection, the Type 100 support vehicle uses composite armor, with certain anti-strike capability. The vehicle is also equipped with advanced fire control systems and information systems, which can realize battlefield situation awareness and command control."
