 PRC_the_separatist_problem_desc: "§YTibet§!:[GLOBAL.get_xizang_status]\n§YXinjiang§!:[GLOBAL.get_xinjiang_status]\n§YHongkong§!:[GLOBAL.get_hongkong_status]\n§YMacau§!:[GLOBAL.get_macau_status]\n§YMongolia§!:[GLOBAL.get_mongolia_status]\n§YDiaoyu Islands§!:[GLOBAL.get_diaoyu_status]\n§YSouth China Sea Islands§!:[GLOBAL.get_nanhai_status]\n§YTaiwan§!:[GLOBAL.get_taiwan_status]\n§YSouthern Tibet§!:[GLOBAL.get_zangnan_status]\n\nChina's separatism has become a chronic problem troubling the central government for many years. Not only are the Uyghurs in Xinjiang and the lamas in Tibet seeking independence, but also the restless Special Administrative Region of Hong Kong and the "rebellious island" of Taiwan are making trouble.\n\nThe Chinese government has tried various methods, from conciliatory policies to harsh repression, to deal with separatists, but all have ended in failure. In addition, foreign interference has also complicated the separatist issues in different regions."
