l_english:
 ZZZ_chainrun:0 "Event Chain Runner"
 ZZZ_cr_kr_01_talks_open:0 "Korea Chain 1/3: Confederation Formed (zzz_kor.1 → .2)"
 ZZZ_cr_kr_01_talks_open_desc:0 "Stage 1 of 3. Runs zzz_kor.1.a and zzz_kor.2.a directly on KOR: the talks succeed, KOR forms the Juche faction and NKO joins it. Both governments still exist; nothing is annexed and no event is fired."
 ZZZ_cr_kr_01_talks_open_tt:0 "Korea stays split under one alliance framework. Because .2 creates the Juche faction first, the join-PDTO attempt in stage 3 fails while KOR remains in Juche: that is the chain's real outcome, left untouched."
 ZZZ_cr_kr_02_unify:0 "Korea Chain 2/5: Toward Unification (zzz_kor.2)"
 ZZZ_cr_kr_02_unify_desc:0 "Available only if zzz_kor.1 chose a (KOR_reunification_talks_failed absent); fires the real zzz_kor.2 event."
 ZZZ_cr_kr_02_unify_tt:0 "If KOR_reunification_talks_failed is set, the chain is treated as broken and this step refuses to run."
 ZZZ_cr_kr_03_breakdown:0 "Korea Chain 3/5: Breakdown (zzz_kor.3)"
 ZZZ_cr_kr_03_breakdown_desc:0 "Available only if zzz_kor.1 chose b (KOR_reunification_talks_failed set); fires the real zzz_kor.3 event."
 ZZZ_cr_kr_03_breakdown_tt:0 "If the flag is absent, step 1 has not chosen b yet and this step refuses to run."
 ZZZ_cr_kr_04_kpr:0 "Korea Chain 4/5: KPR Proclaimed (zzz_kor.6)"
 ZZZ_cr_kr_04_kpr_desc:0 "Checks that NKO owns 604 and has the KPR cosmetic tag or korean_postwar_settled, then fires zzz_kor.6. Annexation must come from the real postwar decision; this tool never annexes."
 ZZZ_cr_kr_04_kpr_tt:0 "The stuck point states whether owns_state 604 or the real postwar decision is missing."
 ZZZ_cr_kr_05_election:0 "Korea Chain 5/5: Full-Peninsula Election (zzz_kor.8 / zzz_kor.10)"
 ZZZ_cr_kr_05_election_desc:0 "Fires zzz_kor.8 on the NKO route, zzz_kor.10 on the KOR route. The route is chosen from real flags."
 ZZZ_cr_kr_05_election_tt:0 "Both routes' election_done flags are checked; if already executed, the step stops."
 ZZZ_cr_ru_01_putin_smo:0 "Russia–Ukraine: Putin Path (SMO Declaration)"
 ZZZ_cr_ru_01_putin_smo_desc:0 "Runs SOV_declare_smo's focus effect directly on SOV (calls DSW_SOV_declare_war_on_ukraine); no event is fired."
 ZZZ_cr_ru_02_medvedev_wall:0 "Russia–Ukraine: Medvedev Path (Address to the Nation)"
 ZZZ_cr_ru_02_medvedev_wall_desc:0 "Runs SOV_address_the_nation's focus effect on SOV: named threat, DSW_SOV_declare_war_on_ukraine, UKR_to_the_last on UKR."
 ZZZ_cr_ru_03_communist_saturn:0 "Russia–Ukraine: Communist Path (Operation Little Saturn)"
 ZZZ_cr_ru_03_communist_saturn_desc:0 "Runs SOV_operation_little_saturn's focus effect on SOV: named threat, DSW_SOV_declare_war_on_ukraine, UKR_to_the_last on UKR."
 ZZZ_cr_eur_01_escalate:0 "Europe War: Full Continental Escalation (begin + participants)"
 ZZZ_cr_eur_01_escalate_desc:0 "Runs ZZZ_eur_begin_war then ZZZ_eur_mark_participants in one go. SOV only: both effects read ROOT, so the country taking this decision must be SOV. No event is fired."
 ZZZ_cr_gaw_01_korea_ignites:0 "GAW: Peninsula Ignites the Great Asian War"
 ZZZ_cr_gaw_01_korea_ignites_desc:0 "KOR declares war on NKO and sets the war flag, then CHI runs ZZZ_start_gaw_from_korea. CHI only: the GAW initialisation reads ROOT. No event is fired."
 ZZZ_cr_usa_01_paralysis:0 "USA Brain-Death Chain: Assassination → Landslide → Paralysis"
 ZZZ_cr_usa_01_paralysis_desc:0 "Runs usacw.5.a, .6.a and .7.a effects directly on USA up to the brain-death node. Does not fire taiwan_detente.5; the alternate 2021 route .15-.21 is not taken."
 ZZZ_cr_balk_01_withdraw_federation:0 "Balkans: Full Withdrawal + Chinese-Backed Federation"
 ZZZ_cr_balk_01_withdraw_federation_desc:0 "All eight countries run zzz_balkan.20.a's withdrawal effect (NATO and EU), then China's PRC_balkan_federation_support success branch runs: partnership idea, influence shift on seven countries, +100 political power for Serbia, and their consent flags. zzz_balkan.30 is not fired."
 ZZZ_cr_tw_01_forced_reunification:0 "Taiwan Strait: Forced Reunification Path (all-in focus package)"
 ZZZ_cr_tw_01_forced_reunification_desc:0 "Runs prc.124.a verbatim on CHI: sets the forced-war flag, loads the Taiwan war focus tree and completes ten focuses (Kinmen, blockade, Silent Dawn and more). The Diaoyu/Senkaku trigger prc.546 is a mutually exclusive branch and is not taken."
 ZZZ_cr_ip_01_kashmir_war:0 "India–Pakistan: Kashmir War (Indian declaration)"
 ZZZ_cr_ip_01_kashmir_war_desc:0 "Runs PAK.3's effects on RAJ and PAK: India declares war with annex_everything and takes the clash-of-millions idea; Pakistan takes its ideas, loses 143,750 manpower and swaps in the war OOB. PAK.7 and prc.134 are not fired."
 ZZZ_cr_sea_01_asean_turnover:0 "Southeast Asia: ASEAN Turnover (Laos monarchy + Cambodian liberalisation)"
 ZZZ_cr_sea_01_asean_turnover_desc:0 "Runs both halves of asean.6.a: Laos becomes a monarchy with a new royal leader and nationalist rule; Cambodia turns social-liberal with 60-day elections. This mod has no separate Southeast Asian war chain; asean.6 is the only asean event."
 ZZZ_cr_mew_01_palestine_victory:0 "Middle East MEW: Arab Victory Settlement (Palestine annexes Israel)"
 ZZZ_cr_mew_01_palestine_victory_desc:0 "Runs the tail of settlement A: PAL annexes ISR and HAM, sets MEW_palestine_victory / MEW_settlement_done / skip_default_capitulation and clears MEW_sixth_war_ongoing. Skips the Golan and South Lebanon state transfers, the belligerent white peace, and mew.10 / mew.11. Requires MEW_sixth_war_ongoing."
 ZZZ_cr_kr_02_confederation_deepened:0 "Korea Chain 2/3: Confederation Deepened (joint institutions)"
 ZZZ_cr_kr_02_confederation_deepened_desc:0 "Stage 2 of 3. Puts both Koreas into the korea_confederation_Tech_Share group, sets korean_confederation_formed / korean_confederation_deepened, and raises KOR's reunification_chance to 12, putting it in zzz_kor.1's top success-chance tier (>10). No event is fired."
 ZZZ_cr_kr_03_peaceful_unification:0 "Korea Chain 3/3: Peaceful Unification (KOR absorbs NKO)"
 ZZZ_cr_kr_03_peaceful_unification_desc:0 "Stage 3 of 3. Runs zzz_kor.5.a and .10.a directly on KOR: annexes NKO, rewrites the government and all 24 party-popularity entries, then holds the peninsula-wide election. If KOR is still in the Juche faction the PDTO join fails (the chain's real outcome); without stages 1-2 it joins PDTO."
 ZZZ_cr_kr_04_north_annex:0 "Stage 4/4 - North annexes South (military)"
 ZZZ_cr_kr_04_north_annex_desc:0 "Stage 4/4. Runs zzz_kor.4.a and .6.a directly on NKO: annexes KOR with troop transfer, cores states 604-608 and 1099, rewrites the government and all 24 party-popularity entries, and applies ZZZ_spirit_korea_unified. It also sets zzz_korea_north_annexed and korean_postwar_settled, locking the peace branch."
 ZZZ_cr_ru_04_russian_victory:0 "Russia–Ukraine: Russian Victory Settlement (DSW_SOV_resolve_russian_victory)"
 ZZZ_cr_ru_04_russian_victory_desc:0 "Runs the victory settlement effect: sets the victory flags, loads the postwar focus tree, fires the French outcome branch and applies the Eastern European settlement. The effect's own guard makes it a no-op unless a war is running; events fired inside the original script are not skipped."
 ZZZ_cr_ru_05_russian_defeat:0 "Russia–Ukraine: Russian Defeat Settlement (DSW_SOV_resolve_russian_defeat)"
 ZZZ_cr_ru_05_russian_defeat_desc:0 "Runs the defeat settlement effect: sets the defeat flags, switches the postwar focus tree and fires the Ukrainian/European outcome. Same internal war guard; no-op when no war is running."
 ZZZ_cr_eur_02_nato_victory:0 "Europe War: NATO Victory Settlement (ZZZ_eur_settle_nato_victory)"
 ZZZ_cr_eur_02_nato_victory_desc:0 "Releases annexed Eastern European countries, returns cores, white-peaces every belligerent and sets ZZZ_eur_nato_victory. Requires ZZZ_eur_war_ongoing (take the escalation decision first), otherwise it is a no-op."
 ZZZ_cr_eur_03_csto_victory:0 "Europe War: CSTO Victory Settlement (ZZZ_eur_settle_csto_victory)"
 ZZZ_cr_eur_03_csto_victory_desc:0 "Turns EST / LAT / LIT / POL / UKR into SOV puppets, white-peaces every belligerent and sets ZZZ_eur_csto_victory. Requires ZZZ_eur_war_ongoing, otherwise it is a no-op."
 ZZZ_cr_gaw_02_china_victory:0 "GAW: Chinese Victory Settlement (ZZZ_gaw_settle_china_victory)"
 ZZZ_cr_gaw_02_china_victory_desc:0 "White-peaces Japan, sets gaw_china_victory_settled and applies the Japanese / South-East Asian end-state. Best used after the GAW ignition decision; without a war only the political parts land."
 ZZZ_cr_gaw_03_japan_victory:0 "GAW: Japanese Victory Settlement (ZZZ_gaw_settle_japan_victory)"
 ZZZ_cr_gaw_03_japan_victory_desc:0 "White-peaces China, sets gaw_japan_victory_settled and installs the collaboration government. Best used after the GAW ignition decision; without a war only the political parts land."
 ZZZ_cr_tw_02_peaceful_reunification:0 "Taiwan Strait: Peaceful Reunification (Special Administrative Region)"
 ZZZ_cr_tw_02_peaceful_reunification_desc:0 "Runs taiwan_detente.11's immediate block on CHI: Taiwan becomes a puppet at special-administrative-region autonomy, switches to a democratic government under Eric Chu, drops its mainland cores and claims, hands its mainland states back to CHI and disbands its navy and air force. No event is fired."
 ZZZ_cr_mew_02_israel_victory:0 "Middle East MEW: Israeli Victory Settlement (B-1 / B-2 / B-3)"
 ZZZ_cr_mew_02_israel_victory_desc:0 "ISR annexes PAL (West Bank), HAM (Gaza) and HEZ (South Lebanon), sets skip_default_capitulation and MEW_isr_took_pal / ham / hez plus MEW_settlement_done, and clears MEW_sixth_war_ongoing. The Egyptian, Jordanian and Syrian partial cessions (B-4 / B-5) are not taken."
 ZZZ_cr_kr_05_real_south_annex:0 "Korea Chain: Real Event Entry - South annexes North (zzz_kor.5)"
 ZZZ_cr_kr_05_real_south_annex_desc:0 "Fires the real zzz_kor.5 event (KOR annexes NKO) directly for chain verification, without inlining any effect. Army handling is the event's own annex_country = { target = NKO transfer_troops = yes }: the NKO army and equipment stockpile transfer to KOR, divisions keep their own templates, nothing is disbanded or re-templated. Mutually exclusive with the north route (verify on a separate clean save)."
 ZZZ_cr_kr_06_real_north_annex:0 "Korea Chain: Real Event Entry - North annexes South (zzz_kor.4 / ZZZ_NKO_march_to_seoul)"
 ZZZ_cr_kr_06_real_north_annex_desc:0 "Fires the real zzz_kor.4 event (NKO annexes KOR) directly, equally covering ZZZ_NKO_march_to_seoul whose complete_effect only dispatches zzz_kor.4. Army handling is the event's own annex_country = { target = KOR transfer_troops = yes }: the KOR army and equipment stockpile transfer to NKO, divisions keep their own templates, nothing is disbanded or re-templated. Mutually exclusive with the south route (verify on a separate clean save)."
