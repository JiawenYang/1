l_english:
 zzz_party.164.t:0 "Imran Khan's Victory"
 zzz_party.164.d:0 "After the 2018 general election the Pakistan Tehreek-e-Insaf won a plurality in the National Assembly. Imran Khan was sworn in as Prime Minister, shifting Pakistan's politics from the two dynastic parties toward an anti-establishment populist movement."
 zzz_party.164.a:0 "Accept the result"
 zzz_party.165.t:0 "A Change of Guard in Islamabad"
 zzz_party.165.d:0 "The National Assembly passed a no-confidence motion against Imran Khan. The Pakistan Muslim League (Nawaz) united the opposition and nominated Shehbaz Sharif as Prime Minister, returning the established parties to power in Islamabad."
 zzz_party.165.a:0 "Accept the result"
 zzz_party.166.t:0 "Pakatan Harapan's Victory"
 zzz_party.166.d:0 "In the 2018 general election Pakatan Harapan ended the Barisan Nasional's six-decade rule. Mahathir Mohamad returned as Prime Minister at the age of ninety-two, giving Kuala Lumpur its first genuine change of governing party."
 zzz_party.166.a:0 "Accept the result"
 zzz_party.167.t:0 "The Sheraton Move"
 zzz_party.167.d:0 "Bersatu left Pakatan Harapan and joined the United Malays National Organisation and the Islamic Party to form a new government. Muhyiddin Yassin became Prime Minister, and the reformist alliance collapsed after less than two years in office."
 zzz_party.167.a:0 "Accept the result"
 zzz_party.168.t:0 "Anwar's Hour"
 zzz_party.168.d:0 "No bloc won a majority in the 2022 general election. Pakatan Harapan formed a coalition government under the Yang di-Pertuan Agong's mediation, and Anwar Ibrahim finally became Prime Minister, returning Malaysia to the reformist path."
 zzz_party.168.a:0 "Accept the result"
 zzz_party.169.t:0 "The Strongman's Second Term"
 zzz_party.169.d:0 "The 2019 election was held under a new constitution shaped by the military. The Palang Pracharath Party and its junior partners retained power, and Prayut Chan-o-cha turned from coup leader into an elected Prime Minister."
 zzz_party.169.a:0 "Accept the result"
 zzz_party.170.t:0 "Pheu Thai's Return"
 zzz_party.170.d:0 "Although Move Forward won the most seats in the 2023 election, the Senate blocked its path to power. Pheu Thai instead allied with the conservative camp to form a government, and Srettha Thavisin became Prime Minister, bringing the Thaksin political network back to the centre of power."
 zzz_party.170.a:0 "Accept the result"
