 c5m_decision:0 "Create C-5M Super Galaxy Design"
 c5m_decision_desc:0 "The C-5M Super Galaxy is the world's most capable strategic airlifter. It can carry up to 129 tons of cargo, including two M1 Abrams tanks, and has a range of over 5,500 miles with a 120,000-pound payload."

 f15ex_decision:0 "Create F-15EX Eagle II Design"
 f15ex_decision_desc:0 "The F-15EX Eagle II is an advanced variant of the F-15 Eagle. It features improved avionics with AN/APG-82 radar, increased weapons payload capacity of over 29,000 pounds across 23 hardpoints, and can carry up to 12 AMRAAM missiles."

 b21_decision:0 "Create B-21 Raider Design"
 b21_decision_desc:0 "The B-21 Raider is a next-generation strategic bomber developed by Northrop Grumman. It features advanced stealth technology, long-range strike capabilities, and is designed to penetrate modern air defenses."

 rq4_decision:0 "Create RQ-4 Global Hawk Design"
 rq4_decision_desc:0 "The RQ-4 Global Hawk is a high-altitude long-endurance unmanned aerial vehicle. It is designed for high-altitude intelligence, surveillance, and reconnaissance missions."

 mq9_decision:0 "Create MQ-9 Reaper Design"
 mq9_decision_desc:0 "The MQ-9 Reaper is a medium-altitude long-endurance unmanned combat aerial vehicle. It is designed for precision strike and reconnaissance missions."

 ac130j_decision:0 "Create AC-130J Ghostrider Design"
 ac130j_decision_desc:0 "The AC-130J Ghostrider is a modernized gunship aircraft. It features advanced avionics, precision-guided munitions, and a 30mm cannon for close air support missions."

 e7_decision:0 "Create E-7 Wedgetail Design"
 e7_decision_desc:0 "The E-7 Wedgetail is a modern airborne early warning and control aircraft. It features a Northrop Grumman Multi-role Electronically Scanned Array radar for airborne battle management and command and control."

 j10a_decision:0 "Create Chengdu J-10A Design"
 j10a_decision_desc:0 "The Chengdu J-10A is a variant of the J-10 fighter. It features improved avionics and weapons capabilities compared to the initial J-10."

 j10c_decision:0 "Create Chengdu J-10C Design"
 j10c_decision_desc:0 "The Chengdu J-10C is an advanced variant of the J-10 fighter. It features an AESA radar, improved avionics, and enhanced weapons capabilities, making it one of China's most capable fourth-generation fighters."

 j11b_decision:0 "Create Shenyang J-11B/BS Design"
 j11b_decision_desc:0 "The Shenyang J-11B/BS is a Chinese variant of the Su-27 fighter. It features Chinese avionics, engines, and weapons systems, providing enhanced performance and reliability."

 j15_decision:0 "Create Shenyang J-15 Design"
 j15_decision_desc:0 "The Shenyang J-15 is a carrier-based fighter based on the Su-33. It is China's first carrier-borne fighter, designed for operations from the Liaoning and Shandong aircraft carriers."

 j15t_decision:0 "Create Shenyang J-15T Design"
 j15t_decision_desc:0 "The Shenyang J-15T is an improved catapult-launch variant of the J-15. It features strengthened airframe and landing gear for catapult operations from China's Type 003 aircraft carriers."

 j15d_decision:0 "Create Shenyang J-15D Design"
 j15d_decision_desc:0 "The Shenyang J-15D is an electronic warfare variant of the J-15. It is equipped with electronic warfare pods and systems, providing stand-off jamming and electronic attack capabilities."

 j16_decision:0 "Create Shenyang J-16 Design"
 j16_decision_desc:0 "The Shenyang J-16 is a heavy multirole fighter based on the Su-30MKK. It features advanced avionics, AESA radar, and can carry a wide range of air-to-air and air-to-ground weapons."

 j16d_decision:0 "Create Shenyang J-16D Design"
 j16d_decision_desc:0 "The Shenyang J-16D is an electronic warfare variant of the J-16. It is equipped with electronic warfare pods, radar jamming systems, and anti-radiation missiles."

 j20_decision:0 "Create Chengdu J-20A Design"
 j20_decision_desc:0 "The Chengdu J-20A is China's first fifth-generation stealth fighter. It features advanced stealth technology, supersonic cruise capability, and a sophisticated avionics suite."

 j20b_decision:0 "Create Chengdu J-20B Design"
 j20b_decision_desc:0 "The Chengdu J-20B is an improved variant of the J-20A. It features more advanced avionics and weapons systems, providing enhanced performance and combat capabilities."

 j20s_decision:0 "Create Chengdu J-20S Design"
 j20s_decision_desc:0 "The Chengdu J-20S is a two-seat variant of the J-20. It can be used for training, command and control of drones, and other missions."

 j35_decision:0 "Create Shenyang J-35 Design"
 j35_decision_desc:0 "The Shenyang J-35 is China's first fifth-generation carrier-based fighter. It features stealth technology, advanced avionics, and is designed for operations from China's aircraft carriers."

 j36_decision:0 "Create Chengdu J-36 Design"
 j36_decision_desc:0 "The Chengdu J-36 is a new generation fighter aircraft of China. It features advanced stealth technology and multi-role combat capabilities."

 y20_decision:0 "Create Xian Y-20 Design"
 y20_decision_desc:0 "The Xian Y-20 is China's first indigenous strategic airlifter. It has a payload capacity of over 66 tons and can transport large equipment including tanks and helicopters."

 y9_decision:0 "Create Xian Y-9 Design"
 y9_decision_desc:0 "The Xian Y-9 is a medium transport aircraft based on the Y-8. It has improved performance, range, and payload capacity compared to its predecessor."

 h6k_decision:0 "Create Xian H-6K Design"
 h6k_decision_desc:0 "The Xian H-6K is an improved variant of the H-6 bomber. It features modern avionics, increased range, and the ability to carry long-range cruise missiles."

 h6n_decision:0 "Create Xian H-6N Design"
 h6n_decision_desc:0 "The Xian H-6N is a long-range strategic bomber variant of the H-6. It has increased range and can carry air-launched ballistic missiles."

 kj2000_decision:0 "Create Xian KJ-2000 Design"
 kj2000_decision_desc:0 "The Xian KJ-2000 is China's first airborne early warning and control aircraft. It is based on the Il-76 airframe and features a phased array radar system."

 kj500_decision:0 "Create Xian KJ-500 Design"
 kj500_decision_desc:0 "The Xian KJ-500 is a medium-sized AEW&C aircraft based on the Y-9 airframe. It features a domestically developed active phased array radar."

 kj600_decision:0 "Create Xian KJ-600 Design"
 kj600_decision_desc:0 "The Xian KJ-600 is China's first carrier-based AEW&C aircraft. It is designed to operate from China's aircraft carriers, providing early warning and command capabilities."

 wingloong1_decision:0 "Create Chengdu Wing Loong I Design"
 wingloong1_decision_desc:0 "The Chengdu Wing Loong I is a medium-altitude long-endurance unmanned aerial vehicle. It is designed for reconnaissance and precision strike missions."

 wingloong2_decision:0 "Create Chengdu Wing Loong II Design"
 wingloong2_decision_desc:0 "The Chengdu Wing Loong II is an improved variant of the Wing Loong I. It has increased payload capacity, longer endurance, and enhanced avionics."

 rainbow4_decision:0 "Create CH Rainbow-4 Design"
 rainbow4_decision_desc:0 "The CH Rainbow-4 is a medium-altitude long-endurance unmanned aerial vehicle developed by China Aerospace Science and Technology Corporation. It is designed for reconnaissance and strike missions."

 rainbow5_decision:0 "Create CH Rainbow-5 Design"
 rainbow5_decision_desc:0 "The CH Rainbow-5 is a larger and more capable variant of the Rainbow series unmanned aerial vehicles. It has significantly increased payload capacity and endurance."

 attack11_decision:0 "Create CAIG GJ-11 Design"
 attack11_decision_desc:0 "The CAIG GJ-11 is a stealthy unmanned combat aerial vehicle. It features a flying wing design and is designed for precision strike missions."

 wz7_decision:0 "Create WZ-7 Design"
 wz7_decision_desc:0 "The WZ-7 is a high-altitude long-endurance reconnaissance unmanned aerial vehicle. It is designed for strategic reconnaissance missions at high altitudes."

 z10_decision:0 "Create CAIC Z-10 Design"
 z10_decision_desc:0 "The CAIC Z-10 is China's first dedicated attack helicopter. It is equipped with advanced avionics, anti-tank missiles, and air-to-air missiles."

 su35_decision:0 "Create Su-35 Flanker-E Design"
 su35_decision_desc:0 "The Su-35 Flanker-E is an advanced fourth-generation plus fighter of Russia. It features advanced avionics, thrust vectoring engines, and powerful weapons systems."

 su57_decision:0 "Create Su-57 Felon Design"
 su57_decision_desc:0 "The Su-57 Felon is Russia's first fifth-generation stealth fighter. It features advanced stealth technology, supersonic cruise capability, and a sophisticated avionics suite."

 mig35_decision:0 "Create MiG-35 Fulcrum-F Design"
 mig35_decision_desc:0 "The MiG-35 Fulcrum-F is an advanced fourth-generation plus fighter of Russia. It features advanced avionics and weapons systems."

 su25sm3_decision:0 "Create Su-25SM3 Design"
 su25sm3_decision_desc:0 "The Su-25SM3 is a modernized variant of the Su-25. It features advanced avionics and weapons systems, improving its combat capabilities."

 su34m_decision:0 "Create Su-34M Design"
 su34m_decision_desc:0 "The Su-34M is a modernized variant of the Su-34. It features advanced avionics and weapons systems, improving its combat capabilities."

 tu160m2_decision:0 "Create Tu-160M2 Design"
 tu160m2_decision_desc:0 "The Tu-160M2 is a modernized variant of the Tu-160. It features advanced avionics and weapons systems, improving its combat capabilities."

 tu95msm_decision:0 "Create Tu-95MSM Design"
 tu95msm_decision_desc:0 "The Tu-95MSM is a modernized variant of the Tu-95. It features advanced avionics and weapons systems, improving its combat capabilities."

 il76md90a_decision:0 "Create Il-76MD-90A Design"
 il76md90a_decision_desc:0 "The Il-76MD-90A is a modernized variant of the Il-76. It features advanced engines and avionics, improving its performance and reliability."

 il112v_decision:0 "Create Il-112V Design"
 il112v_decision_desc:0 "The Il-112V is a new generation light transport aircraft of Russia. It is designed to replace the aging An-26 transport aircraft."

 an178_decision:0 "Create An-178 Design"
 an178_decision_desc:0 "The An-178 is a medium transport aircraft jointly developed by Ukraine and Russia. It is designed to replace the aging An-12 transport aircraft."

 a50u_decision:0 "Create A-50U Design"
 a50u_decision_desc:0 "The A-50U is a modernized variant of the A-50. It features advanced radar and avionics, improving its early warning capabilities."

 a100_decision:0 "Create A-100 Premier Design"
 a100_decision_desc:0 "The A-100 Premier is a new generation early warning aircraft of Russia. It features advanced active phased array radar and avionics."

 su30sm2_decision:0 "Create Su-30SM2 Design"
 su30sm2_decision_desc:0 "The Su-30SM2 is a modernized variant of the Su-30SM. It features advanced avionics and weapons systems, improving its combat capabilities."

 mig29m2_decision:0 "Create MiG-29M2 Design"
 mig29m2_decision_desc:0 "The MiG-29M2 is a modernized variant of the MiG-29. It features advanced avionics and weapons systems, improving its combat capabilities."

 su34mp_decision:0 "Create Su-34MP Design"
 su34mp_decision_desc:0 "The Su-34MP is an electronic warfare variant of the Su-34. It features advanced electronic warfare equipment and systems."

 gripen_e_decision:0 "Create JAS 39E Gripen Design"
 gripen_e_decision_desc:0 "The JAS 39E Gripen is the latest variant of the single-engine fighter developed by Saab of Sweden. It features advanced avionics, greater range, and enhanced weapon carrying capacity."

 rafale_f4_decision:0 "Create Rafale F4 Design"
 rafale_f4_decision_desc:0 "The Rafale F4 is the latest variant of the Rafale fighter developed by Dassault Aviation of France. It features advanced avionics, enhanced multi-role combat capabilities, and aerial refueling."

 typhoon_tranche3_decision:0 "Create Eurofighter Typhoon Tranche 3 Design"
 typhoon_tranche3_decision_desc:0 "The Eurofighter Typhoon is a multirole fighter jointly developed by the UK, Germany, Italy, and Spain. It features advanced avionics, enhanced weapon carrying capacity, and aerial refueling."

 sirtap_decision:0 "Create SIRTAP Design"
 sirtap_decision_desc:0 "SIRTAP is a medium-range tactical drone system jointly developed by several European countries. It features reconnaissance and light strike capabilities."

 falco_evo_decision:0 "Create Falco EVO Design"
 falco_evo_decision_desc:0 "The Falco EVO is the latest variant of the Falco drone developed by Leonardo of Italy. It features longer endurance and greater payload capacity."

 a400m_decision:0 "Create A400M Atlas Design"
 a400m_decision_desc:0 "The A400M Atlas is a military transport aircraft developed by Airbus of Europe. It features strategic transport capabilities and tactical landing capabilities."

 a330_mrtt_decision:0 "Create A330 MRTT Design"
 a330_mrtt_decision_desc:0 "The A330 MRTT is an aerial refueling tanker based on the A330 airliner developed by Airbus of Europe. It features strong aerial refueling capability and transport capability."

 a330_aewc_decision:0 "Create A330 AEW&C Design"
 a330_aewc_decision_desc:0 "The A330 AEW&C is an airborne early warning and control aircraft based on the A330 airliner developed by Airbus of Europe. It features advanced active phased array radar and command and control system."

 kf21_decision:0 "Create KF-21 Boramae Design"
 kf21_decision_desc:0 "The KF-21 Boramae is a twin-engine 4.5th generation multirole fighter developed by Korea Aerospace Industries. It features AESA radar, advanced avionics and twin engines."

 lca_tejas_decision:0 "Create LCA Tejas Mk1 Design"
 lca_tejas_decision_desc:0 "The LCA Tejas is a single-engine light 4.5th generation fighter developed by HAL of India. It features advanced avionics and precision-guided weapons capability."

 kc390_decision:0 "Create KC-390 Millennium Design"
 kc390_decision_desc:0 "The KC-390 Millennium is a large transport/aerial tanker aircraft developed by Embraer of Brazil. It features strategic transport and aerial refueling capabilities."

 kawasaki_p1_decision:0 "Create Kawasaki P-1 Design"
 kawasaki_p1_decision_desc:0 "The Kawasaki P-1 is a next-generation maritime patrol aircraft for the Japan Maritime Self-Defense Force. It features four turbofan engines, internal bomb bay and anti-submarine warfare systems."

 jf17_block3_decision:0 "Create JF-17 Thunder Block 3 Design"
 jf17_block3_decision_desc:0 "The JF-17 Thunder Block 3 is a single-engine 4.5th generation multirole fighter jointly developed by Pakistan Aeronautics Complex and China. It features AESA radar and PL-15E air-to-air missiles."

 lca_tejas_mk2_decision:0 "Create LCA Tejas Mk2 Design"
 lca_tejas_mk2_decision_desc:0 "The LCA Tejas Mk2 is a medium multi-role fighter developed by HAL of India based on the Mk1. It features GE F414 engine, Uttam AESA radar and 11 weapon stations."

 hurjet_decision:0 "Create Hurjet Design"
 hurjet_decision_desc:0 "The Hurjet is an advanced jet trainer/light attack aircraft developed by Turkish Aerospace Industries. It features GE F404 engine and max speed of Mach 1.4."

 heron_tp_decision:0 "Create Heron TP Design"
 heron_tp_decision_desc:0 "The Heron TP is a large long-endurance unmanned aerial vehicle developed by IAI of Israel. It features PT6A turboprop engine, over 30 hours endurance and 2 tonnes payload."

 h6g_decision:0 "Create Xian H-6G Design"
h6g_decision_desc:0 "The H-6G is a maritime patrol variant of China's H-6 bomber. Based on the H-6D, it features anti-ship missiles and advanced avionics for maritime reconnaissance and strike missions."

h6j_decision:0 "Create Xian H-6J Design"
h6j_decision_desc:0 "The H-6J is a maritime strike platform of the Chinese Naval Air Force. Based on the H-6G, it features aerial refueling capability and enhanced long-range anti-ship strike capabilities."