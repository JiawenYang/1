 MAPMODE_ECONOMY_ALLIANCE_MAP_MODE_DESCRIPTION: "Colour the world by economic alliance: shows each country's customs union and common market."
 military_alliance_intro: "§YMilitary Alliances§!\n\n£GFX_military_alliance_intro_embed \n\n§gLead-in: an alliance is never a free shield; it is a policy that must be paid for continuously, and can be discounted at any moment.§!\n\nMilitary alliances are the Cold War's institutional legacy. NATO writes Article 5 collective defence into obligation, trading North America's nuclear umbrella for Europe's conventional forces; the CSTO does not talk about shared values, it simply translates Russia's military advantage into organisational capacity in the post-Soviet space. Neither system was built to fight a war — both were built so that war would not come. Their real product is deterrence: making an adversary do the arithmetic before it moves.\n\nWhether an alliance works depends first on how command is arranged and how money is split. NATO's command system is led by Washington: Europe supplies forces, bases and budgets, the United States supplies the nuclear umbrella and strategic lift. The burden-sharing argument returns every year, but the real question is not who is a few percentage points short — it is who is willing to keep paying, in peacetime, for a war that may never come.\n\nBase access is the skeleton. Garrisons, ports, airfields and overflight rights are dots on a map in calm times, and in a crisis they are the entire answer to whether forces can reach the front. America trades garrisons for cooperation, Russia trades garrisons for loyalty, small states trade part of their sovereignty for a policy — every one of these is a priced exchange, even when the price is not written in the treaty.\n\nCredibility rests on two things: capability and will. Capability can be counted; will cannot. When an ally's domestic politics turns, the commitment shrinks; the treaty text does not change, but the people executing it do. Real deterrence is not what the paper says, but whether the adversary believes someone will actually arrive.\n\nThe periphery shows what an alliance is really made of. Core members get the nuclear umbrella and rapid reaction; outer members get arms sales, exercises and statements. An alliance is never an equal club — it is a list ranked by strategic value, and the ranking gets rewritten in every crisis.\n\nA crisis is where alliances are inspected. Mismatched threat perceptions, arguments over money and elections that change governments all discount commitments at the last moment. The pattern repeats through history: the treaty took effect, the reinforcements did not come — or they came, and came too late.\n\nThe colours on the map are drawn by treaty; real security is cashed out by will — and between the two sits a bill nobody wants to pay in advance."
 economy_alliance_intro: "§YEconomic Alliances§!\n\n£GFX_economy_alliance_intro_embed \n\n§gLead-in: an economic alliance does not sell markets; it sells rules — and the price of rules is never on the tariff schedule.§!\n\nThere is no single template for an economic alliance. The EU takes the supranational road, stitching members into one body with a single market, a common currency and common regulation; ASEAN takes the intergovernmental road, holding ten economies together through consensus and non-interference; the GCC turns oil revenue into cross-border capital and labour; ECOWAS ties a customs union to peacekeeping intervention; MERCOSUR has long stopped at the customs-union threshold. Different models, different starting points, different ceilings.\n\nA tariff is only the entry ticket. What really decides an alliance's quality are the four things behind it: standards, currency, labour and capital. Standards decide who may sell in; currency decides who carries the exchange-rate risk; labour mobility decides who may work where; capital mobility decides who may build where. Only after those four steps does a trade agreement become an economic community.\n\nStandards are the least visible and most effective form of power. Whoever writes the rule decides what other people's products look like. The EU extends influence beyond its members through regulatory standards, the United States splits supply chains with technical standards and export controls, and China lays its own track through the developing world with infrastructure and capacity standards.\n\nCurrency is the alliance's second act of sovereignty surrendered. A common currency removes exchange-rate friction and means members hand over independent monetary policy; joint debt shares the cost of a crisis and writes fiscal discipline into someone else's ledger. Free capital movement brings investment, and brings the panic that can leave at any moment.\n\nLabour mobility is the most easily overlooked link. Free movement of people fills labour gaps and creates wage and welfare competition among members; when the economy turns down, migrant labour is usually the first thing politics reaches for as an explanation.\n\nThe fragility of an economic alliance is this: it asks members to share the gains in good times and the costs in a crisis, and those two things are politically very different. Macroeconomic swings, gaps in industrial competitiveness and political pendulums are each enough to stall integration halfway, or reverse it.\n\nThe colours on the map mark membership; whether membership becomes prosperity depends on whether members keep paying together when the crisis comes."
 org_eu_intro: "§YEuropean Union§!\n£GFX_power_eu_embed \n§gCaption: the European Parliament in Strasbourg.§!\nThe EU binds its members through a single market, a common currency and common regulation. It is the most integrated regional bloc today, and the most successful attempt to convert economic weight into diplomatic and defence capacity."
 org_sco_intro: "§YShanghai Cooperation Organisation§!\n£GFX_org_sco_embed \n§gCaption: Central Asian corridors and energy routes.§!\nThe SCO links Central Asia, South Asia and the Eurasian hinterland through security cooperation and connectivity. It has no collective-defence clause; it is better described as a regional coordination platform backed jointly by China and Russia."
 org_pec_intro: "§YPacific Economic Community§!\n£GFX_org_pec_embed \n§gCaption: a Tokyo-led Asia-Pacific economic network.§!\nThe community uses trade rules, investment and supply chains to knit East Asia and the Pacific rim into one network. It is Japan's main instrument for turning economic weight into regional order."
 org_asean_intro: "§YAssociation of Southeast Asian Nations§!\n£GFX_org_asean_embed \n§gCaption: Jakarta, home of the ASEAN Secretariat.§!\nASEAN holds ten economies in a loose community based on consensus and non-interference. It seeks no supranational power, maintaining regional stability through dialogue and open markets."
 org_gcc_intro: "§YGulf Cooperation Council§!\n£GFX_org_gcc_embed \n§gCaption: the collective security and economic circle of the Gulf oil states.§!\nThe GCC converts the oil revenue of the Gulf monarchies into cross-border capital, labour and security cooperation. It is both a customs union and a political coordination mechanism in regional conflict."
 org_ecowas_intro: "§YEconomic Community of West African States§!\n£GFX_org_ecowas_embed \n§gCaption: West African integration and peacekeeping.§!\nECOWAS rests on a customs union, free movement and peacekeeping intervention, trying to build order in a West Africa beset by poverty and coups. Its economic integration is limited, but its intervention capacity is rare among African regional bodies."
 org_mercosur_intro: "§YSouthern Common Market§!\n£GFX_org_mercosur_embed \n§gCaption: South America's customs union and common market.§!\nMERCOSUR links the southern economies of South America through a customs union and common market. Long constrained by members' macroeconomic swings and political turns, it is a textbook case of regional integration in the developing world."
 org_au_intro: "§YAfrican Union§!\n£GFX_org_au_embed \n§gCaption: Addis Ababa, seat of the AU.§!\nThe AU raises the banner of continental unity and conflict mediation, gathering more than fifty African states into one political framework. Its economic integration is limited, but it holds a distinctive voice in peacekeeping and crisis mediation."
