l_english:
 ELS_right_populism_desc: "\n\n\n\n  £GFX_ELS_Ideology_bukele_model \n\n\n\n\n\n The §Y\"Bukele Model\"§! is a form of governance and a political approach developed in El Salvador under the leadership of Nayib Bukele, who assumed the presidency in 2019. This model combines a hardline security policy, focused on the direct fight against violence and the restoration of state control over the territory, with a high concentration of power in the Executive, the limitation of institutional checks and balances, and direct, constant communication with the population. It prioritizes order, stability, and effectiveness in reducing violence as a foundation for national development. At the same time, it maintains strong popular support while generating intense debate over the balance between security, order, and civil liberties."
 NIC_left_nationalism_desc: "\n\n\n\n  £GFX_NIC_Ideology_sandinismo \n\n\n\n\n\n §YSandinismo§! is a Nicaraguan political current that emerged in response to foreign domination and internal authoritarian regimes, such as the Somoza regime, taking as a reference the struggle of Augusto C. Sandino for national sovereignty. It was formally organized when its founder, Carlos Fonseca Amador, established the Sandinista National Liberation Front (FSLN). Sandinismo follows the wave of Latin American revolutionary leftism born with the Cuban Revolution. It combines ideas of national emancipation, social justice, and popular organization, the centrality of the State in the economy, education, and health, and the mobilization of the population to achieve profound transformations. Sandinismo consolidated itself as a governing force under the slogan \"A Christian, Socialist, and Solidary Nicaragua.\" Today, it is led by Daniel Ortega, president of Nicaragua since 2007"
 NIC_Sindrome_Necromorbido: "Necromorbid Syndrome"
 NIC_Sindrome_Necromorbido_desc: "Generations of Nicaraguans have lived under the constant shadow of violence, shaped by dictatorship, revolution, political repression, and economic instability. From the Somoza regime to the Sandinista Revolution and the years of political tension that followed, conflict became deeply embedded in the country's political culture and collective memory. Over time, many citizens grew accustomed to instability and fear as recurring parts of daily life. Nicaraguan television has also played a major role in reinforcing this culture of desensitization. News programs frequently rely on graphic images, crime reports, and shocking headlines to attract viewers, turning violence into spectacle and entertainment. As a result, scenes of bloodshed, tragedy, and political conflict became normalized in public life, contributing to a society where shock gradually loses its impact and violence feels disturbingly routine."
 NIC_Senor_Gobierno: "Mr. Government"
 NIC_Senor_Gobierno_desc: "Daniel Ortega's government maintains the appearance of democracy while limiting genuine opposition. Independent political parties and dissidents have been weakened through arrests, censorship, and exile, leaving only controlled or weakened opposition groups within the political system. As a result, Nicaragua functions under a tightly managed political environment where elections and institutions formally exist, but real political competition remains extremely limited. Critics argue this system protects Ortega's power while preserving a democratic façade."
 NIC_legacy_of_protests2: "Legacy of Protests"
 NIC_legacy_of_protests2_desc: "In 2018, protests against pension reforms quickly evolved into a nationwide uprising that exposed the deep fractures within Nicaraguan society. What began as demonstrations led mainly by students and retirees soon spread across the country, with blocked highways, violent clashes between protesters and security forces, and growing reports of disappearances, arbitrary arrests, and political persecution. The streets of Nicaragua transformed into scenes of fear and resistance, while the government responded with increasing repression in an effort to regain control. Two years after the beginning of the crisis, the country seemed trapped in a slow and painful decline, as if wounded by a blow that never fully stopped bleeding. The economy weakened, thousands of Nicaraguans fled into exile, and public trust in institutions deteriorated dramatically. Beyond the political conflict itself, the events of 2018 left behind a climate of exhaustion and uncertainty that continued to shape everyday life long after the barricades disappeared from the streets."
 NIC_revolutionary_spirit2: "Revolutionary Spirit"
 NIC_revolutionary_spirit2_desc: "The Sandinista victory in 1979 reshaped Nicaragua's national identity around ideals of socialism, sovereignty, and social justice. For many, the revolution represented liberation from dictatorship and foreign influence. However, the revolution also brought economic instability, civil conflict, and long-term political polarization. Its legacy remains deeply divided: remembered by some as a symbol of hope and by others as the beginning of decades of hardship and instability."
 GUA_legado_caudillos_y_bananas: "Legacy of Caudillos and Bananas"
 GUA_legado_caudillos_y_bananas_desc: "During the first half of the 20th century, the United Fruit Company became one of the most powerful foreign corporations in Guatemala, controlling farmland, railroads, ports, and exports across the country. Its enormous economic influence allowed foreign business interests to shape Guatemalan politics and deepen inequality, especially among rural and Indigenous populations. In 1954, President Jacobo Árbenz attempted land reforms that threatened unused lands owned by the company. Fearing communist influence during the Cold War and seeking to protect American economic interests, the CIA backed a coup that removed Árbenz from power and installed a military-aligned government. The coup had devastating long-term consequences for Guatemala. It triggered decades of military dictatorships, political repression, and a brutal civil war that left deep social and ethnic scars, particularly among Indigenous communities. Even today, Guatemala continues struggling with corruption, weak democratic institutions, organized crime, poverty, and distrust toward the government. Many historians argue that the instability created after the CIA-backed coup helped shape many of the political and social problems the country still faces in the modern era."
 GUA_resistencia_indigena: "Indigenous Resistance"
 GUA_resistencia_indigena_desc: "Indigenous communities in Guatemala have resisted centuries of conquest, discrimination, and political repression while preserving their languages, traditions, and identity. Maya populations faced land dispossession, violence, and exclusion, yet continued defending their culture and demanding recognition and rights. During Guatemala's civil war, Indigenous communities suffered some of the worst violence and persecution in the country. Despite this, Indigenous movements survived and remain an important force in modern Guatemala, symbolizing resilience, cultural survival, and the ongoing struggle against inequality and discrimination."
 GUA_informalidad_laboral_agrabada: "Worsened Labor Informality"
 GUA_informalidad_laboral_agrabada_desc: "A large part of Guatemala's population survives through informal labor and economic activities beyond government oversight. Street vending, unregistered businesses, and cash-based employment dominate daily life for millions of citizens. While this informal system keeps many families alive, it severely limits tax collection and weakens the government's ability to invest in infrastructure, healthcare, and education."
 COS_la_suiza_centroamericana: "Central American Switzerland"
 COS_la_suiza_centroamericana_desc: "Costa Rica has built a unique reputation in the region for its democratic stability, strong institutions, and social model centered on education and healthcare. Amid the constant turbulence that has historically marked much of Central America, the country presents itself as a rare symbol of peace, moderation, and political continuity. While many neighboring nations struggle with violence, corruption, or institutional fragility, Costa Rica prides itself on being a regional beacon of stability and hope."
 COS_refugiados_nicaraguenses: "Nicaraguan Refugees"
 COS_refugiados_nicaraguenses_desc: "The 2018 crisis in Nicaragua deeply affected not only Nicaragua itself, but also neighboring Costa Rica. Massive waves of Nicaraguans fleeing violence, repression, and economic instability crossed the border seeking asylum and safety. Costa Rica became one of the main destinations for displaced Nicaraguans due to its relative stability and stronger institutions. However, the growing influx of refugees has also generated social and political tensions within Costa Rica. Nationalist sectors increasingly criticize the large number of migrants entering the country, arguing that public services, employment opportunities, and social stability are under pressure. The refugee crisis has therefore become both a humanitarian issue and a growing source of domestic political debate."
 COS_nacion_sin_ejercito: "Nation without an Army"
 COS_nacion_sin_ejercito_desc: "Since abolishing its military in 1948, Costa Rica has built a national identity strongly tied to peace, democracy, and diplomacy. Resources once dedicated to the armed forces were redirected toward education, healthcare, and social development, helping shape the country's image as one of the most stable democracies in Latin America. At the same time, the absence of a military leaves Costa Rica dependent on police forces and international alliances for national defense. In a region historically marked by conflict, instability, and organized crime, some critics argue that the country remains vulnerable in a world where military power still plays a major geopolitical role."
 PAN_el_gran_cruce_de_las_americas: "The Great Crossing of the Americas"
 PAN_el_gran_cruce_de_las_americas_desc: "Panama occupies one of the most strategic geographic positions on Earth. Connecting North and South America and home to the Panama Canal, the country serves as a vital link between the Atlantic and Pacific Oceans. This position gives Panama enormous economic and geopolitical importance, turning it into a global hub for trade, shipping, and finance. Yet this same strategic advantage also creates major challenges. Panama has become a key transit corridor for international drug trafficking and irregular migration, especially through the Darién Gap. Alongside prosperity and global relevance, these pressures generate corruption, organized crime, and social instability that continue to test the country's institutions."
 PAN_nacion_desarmada: "Disarmed Nation"
 PAN_nacion_desarmada_desc: "After the fall of Manuel Noriega in 1990, Panama officially abolished its armed forces. Since then, national security has relied primarily on police institutions and cooperation with foreign allies, particularly the United States. This decision helped distance the country from its authoritarian military past and reinforced a more civilian-centered political system. However, the lack of a standing army also leaves Panama relatively exposed to external threats and dependent on international partnerships for broader security. In a strategically important country, this vulnerability remains a recurring topic in political and security discussions."
 BLZ_protectorado_britanico: "British Protectorate"
 BLZ_protectorado_britanico_desc: "Belize was formerly the British colony of British Honduras, and even after gaining independence in 1981, it maintained strong ties with the United Kingdom. The country still uses a British-style parliamentary system and remains part of the Commonwealth, with the British monarch as head of state. This colonial legacy has helped Belize maintain relatively stable democratic institutions compared to much of Central America. However, British influence also continues shaping the country's politics, identity, and dependence on foreign support."
 ELS_doctrina_bukele: "Bukele Doctrine"
 ELS_doctrina_bukele_desc: "Nayib Bukele's hardline stance against gangs and organized crime has profoundly transformed El Salvador. For decades, gang violence shaped everyday life in the country: extortion, murders, and territorial control turned fear into a national routine. Taking advantage of that collective exhaustion, Bukele built a strategy based on the aggressive use of security forces and a discourse centered on authority and order. For many Salvadorans, he represents the leader who finally confronted a problem that previous governments failed to solve. However, Bukele's approach has also generated growing concern among critics and international observers. While many citizens celebrate the reduction in violence, others warn that the concentration of power and the weakening of democratic institutions could create long-term consequences for the country. El Salvador now stands between two realities: one where security has improved dramatically, and another where democratic freedoms appear increasingly fragile."
 ELS_estado_de_exepcion: "State of Exception"
 ELS_estado_de_exepcion_desc: "To fight gangs, Bukele's government suspended several constitutional guarantees and deployed the military across the country. Mass arrests and tougher policing significantly reduced gang activity and improved security in many neighborhoods. However, the policy also sparked criticism from international organizations due to allegations of arbitrary detentions and human rights abuses. While crime decreased, concerns over democracy and personal freedoms increased."
 ELS_rayo_de_esperanza: "Ray of Hope"
 ELS_rayo_de_esperanza_desc: "Bukele's rise to power gave many Salvadorans hope after years of living under constant fear and violence. Communities once controlled by gangs began experiencing a sense of safety that had been absent for decades. For many citizens, Bukele represents the possibility of rebuilding normal life and recovering public spaces. His popularity largely comes from that feeling of relief and renewed hope for a safer future."
 HON_legado_de_manuel_zelaya: "Legacy of Manuel Zelaya"
 HON_legado_de_manuel_zelaya_desc: "The removal of Manuel Zelaya in 2009 became one of the most defining moments in modern Honduran politics. His overthrow divided the country politically and socially, creating tensions that still influence elections and public opinion today. Supporters view Zelaya as a symbol of social reform, economic justice, and greater independence from foreign influence, while critics believe his presidency threatened democratic stability and risked pushing Honduras toward authoritarianism"
 HON_violencia_endemica: "Endemic Violence"
 HON_violencia_endemica_desc: "Honduras has struggled for years with extremely high homicide rates and widespread insecurity. Violence linked to poverty, gangs, drug trafficking, and weak institutions affects daily life across much of the country. Fear and instability have become deeply rooted social problems, damaging public trust in the government and pushing many citizens to leave the country in search of safety."
 HON_juventud_sin_futuro: "Youth without a Future"
 HON_juventud_sin_futuro_desc: "The lack of economic opportunities and stable employment forces thousands of Honduran youths into difficult choices. Many attempt to migrate abroad, especially to the United States, while others become vulnerable to recruitment by gangs and criminal organizations. Poor education, unemployment, and social inequality continue fueling a cycle of migration, violence, and hopelessness among younger generations."
 CEN_cartel_presence_minor: "Minor Cartel Presence"
 CEN_cartel_presence_moderate: "Moderate Cartel Presence"
 CEN_cartel_presence_severe: "Severe Cartel Presence"
 DANIEL_ORTEGA_DESC: "§Y\"José Daniel Ortega Saavedra\"§! was born in La Libertad, Nicaragua, on November 11, 1945. As a young activist, he joined the Sandinista movement against the Somoza dictatorship and became one of the leaders of the 1979 revolution. Ortega first served as president from 1985 to 1990 during a period of civil conflict and economic hardship before returning to power in 2007. Since then, he has consolidated control over Nicaragua's political institutions and remained the country's dominant political figure. Supporters view him as a defender of the Sandinista legacy and national sovereignty, while critics accuse him of undermining democracy and transforming Nicaragua into an increasingly authoritarian state."
 NAYIB_BUKELE_DESC: "§Y\"Nayib Armando Bukele Ortez\"§! was born in San Salvador on July 24, 1981. After a successful career in business and advertising, he entered politics through the FMLN and served as mayor of Nuevo Cuscatlán and later San Salvador. Following his expulsion from the party in 2017, he positioned himself as an anti-establishment candidate and won the presidency in 2019, ending decades of dominance by El Salvador's traditional parties. His administration became known for its aggressive crackdown on gangs, which dramatically reduced crime but also generated concerns over democratic institutions and civil liberties. Today, Bukele remains one of Latin America's most popular and controversial leaders, admired by supporters for restoring security and criticized by opponents for concentrating power."