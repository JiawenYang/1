l_english:
 ZZZ_nodecheck:0 "Key Node Inspector (Wars / Events)"
 ZZZ_nc_ru_status:0 "RU-UA / NATO: Status check"
 ZZZ_nc_ru_status_desc:0 "Writes the RU-UA and NATO related flags and war states into the game log."
 ZZZ_nc_ru_status_tt:0 "Effect: logs SOV-UKR and SOV-USA war states, USA_federal_paralysis_global, and the current Russia-Ukraine war route (2024 Putin path vs NATO-accession path), including the leader check, the 2024.1.1 date gate, and whether UKR holds the NATO_member idea. Note: the NATO dissolution node is not implemented, only the flag can be inspected."
 ZZZ_nc_eur_status:0 "Europe: Status check"
 ZZZ_nc_eur_status_desc:0 "Writes every Europe-war flag into the game log."
 ZZZ_nc_eur_status_tt:0 "Effect: checks ongoing/begins/nato_victory/csto_victory/stalemate/resolved and the DSW European war flag, results go to log."
 ZZZ_nc_gaw_status:0 "GAW: Status check"
 ZZZ_nc_gaw_status_desc:0 "Writes the GAW flags and the CHI-JAP war state into the game log."
 ZZZ_nc_gaw_status_tt:0 "Effect: checks pan_asian_war_ongoing / GAW_soon / both settled flags / korean_confederation_formed / JAP-CHI war, results go to log."
 ZZZ_nc_usa_status:0 "USA: Brain-dead status check"
 ZZZ_nc_usa_status_desc:0 "Logs the three brain-dead flags and NATO membership."
 ZZZ_nc_usa_status_tt:0 "Effect: checks USA_federal_paralysis_global / USA_federal_paralysis_flag / USA_government_shutdown_flag / whether USA still holds NATO_member, results go to log. The NATO dissolution node is not implemented."
 ZZZ_nc_balkan_status:0 "Balkans: Status check"
 ZZZ_nc_balkan_status_desc:0 "Logs federation flags, autonomy state and NATO/EU membership."
 ZZZ_nc_balkan_status_tt:0 "Effect: checks balkan_subject_agree / autonomy_balkan_federation / NATO_member / EU ideas, results go to log. Note: dedicated Balkan election scheduling is not implemented, only the generic chain exists."
