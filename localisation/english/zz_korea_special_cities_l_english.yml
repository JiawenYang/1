l_english:
 # Korea special administrative divisions (ported from TFR Korea Plus, state IDs adapted to Millennium Dawn)
 KOR_seoul_city: "Seoul Metropolitan City"
 KOR_seoul_city_desc: "\n§9The heartbeat of the six-hundred-year-old capital still surges with the pulse of the Han River, as the tiled roofs of Gyeongbokgung and the stone road of Gwanghwamun gaze quietly at one another amid the glass curtain walls of skyscrapers. In the old alleys north of the river, the lights of Namsan Tower burn through the night, while beneath the neon of Gangnam the academy streets are already crowded at five in the morning—this city, which forged the ruins of war into a world metropolis within half a century, has carved \"faster\" into everyone's breath and written the \"Miracle on the Han\" into the textbooks of the age.\n\nYet behind the dazzling figures lie meticulously measured life schedules and suffocating housing prices, and the memories of old neighborhoods quietly vanishing beneath the roar of bulldozers. The stone steps of Gwanghwamun Square once bore the shouts of a student revolution and an ocean of candlelight; today the clamor of democracy has long since dissolved into the daily flow of traffic. As the first subway train crosses the iron bridge over the Han, the metropolis of over twenty million begins another day of relentless pursuit.§!\n\n§HThe Han River flows without pause—the six-century capital, between ruins and new towers, forever chasing the horizon of tomorrow.§!"
 KOR_incheon_city: "Incheon Metropolitan City"
 KOR_incheon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9When the red sunset seeps over the mudflats shrouded in thick sea mist, this city finally lays down the tumultuous hours and takes a deep, rough breath. Behind the romance of the opening of the ports, which first unlocked the gates to unfamiliar foreigners and welcomed the waves of modernity first, are the pains of invasion and the sweat of fierce industrialization deeply embedded in every red brick.\n\nWhen the glass skyscrapers, raised by filling in the sea, flaunt a dazzling future, the old alleys of the old downtown, hidden in their shadows, sink deeper into a sense of alienation, and amid the constant roar of massive trucks and airplanes coming and going, the city endures the loneliness of a station that always sends someone off. This place, where the dazzling rise and the declining silhouette tangle precariously, is a land where the desires of development and the sighs of what remains flow mixed with the sound of the waves.§!\n\n§3A city of eternal boundaries where the excitement of those who leave and the sorrows of those left behind coexist.§!"
 KOR_busan_city: "Busan Metropolitan City"
 KOR_busan_city_desc: "\n§9The lighthouse of Yeongdo watches over a harbor of racing sails, and the pre-dawn cries of Jagalchi Market awaken the city wedged between mountain and sea. As the temporary capital that sheltered a million displaced souls in the flames of war, Busan brewed its homesickness into the warm yellow lamps along the mountain-road neighborhoods, and forged its tenacity for survival into the cranes of container terminals that never rest. The beaches of Haeundae and the chain of lights of Gwangan Bridge are its calling card, but what truly holds this city up are the calloused hands in the fish market and the welding sparks in the shipyards.\n\nThis is a city warmed by dialect and friendship, its blunt temperament as unadorned as the sea wind. Every autumn the starlight of the international film festival illuminates Haeundae, but more than red carpets, the people of Busan trust the wisdom of bargaining in the market. Mountains and sea have squeezed the city into a long, narrow legend—each day the great ships sound their horns and depart, carrying its name out to the world.§!\n\n§LAn unyielding city between mountain and sea, which brewed the homesickness of war into a bold spirit born toward the ocean.§!"
 KOR_ulsan_city: "Ulsan Metropolitan City"
 KOR_ulsan_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_ulsan_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9The wind brushing through the ten-ri bamboo grove of Taehwa River strives to wash away the stigma of the past, but what still wakes the city's dawn are the heavy hammering of a massive shipyard and the weighty machinery of an industrial complex. The blue sea where the legendary whale once glided was taken over by massive Leviathans made of iron, and the legend of the industrial capital, where \"even a passing dog bites a ten-thousand-won bill,\" is precariously built upon the fatigue of workers in oil-soaked work clothes.\n\nBehind the dazzling city lights of the petrochemical complex that never goes dark overnight looms a dark shadow of structural instability in this \"corporate city,\" where the city's entire fate is held hostage by the clamor of intense labor-management conflicts and the rise and fall of a particular chaebol company. This place, which paid the price of growth with the sky and sea, now lies in deep contemplation, watching the rusting crane at the fading end of its boom, accompanied by the dulling roar of the manufacturing engine.§!\n\n§gA giant iron fortress built upon the grave of the whale, an empire of contradictions whose torch of abundance burns the breath of tomorrow.§!"
 KOR_daegu_city: "Daegu Metropolitan City"
 KOR_daegu_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9The vast basin, surrounded like a folding screen by Palgongsan, still holds the glory of modernization that was hotter than the boiling midsummer heat, yet now it cannot vent the cooled heat outward and is only fermenting it inward. The powerful roar of textile machines that once spun fabrics across the country and the romance of apples ripening red have vanished into the pages of time, and only the shadow of economic indicators, which have been stuck in place for decades, weighs heavily on the city.\n\nThe solid fortress wall known as the \"heart of conservatism\" serves both as a shield protecting against external storms and as a high wall isolating itself, and beyond that wall—whose very breath of change has failed to cross—it is the place left behind by the young people rapidly growing old. Trapped in stubbornness and exclusivism as steadfast as its closed terrain, it is a land of love and hate that painfully endures today, declining on the pride of its brilliant past.§!\n\n§7My fragrant homeland, filled with the scent of trumpet vine\nThe sunrise street overlooking Palgongsan\nYou and I dreamed here\nI dreamed of a beautiful and tender dream\nThe street of hope they walk together\nThe street of love where trumpet vine blooms and fades\nDaegu is my hometown, my dear hometown§!"
 KOR_daejeon_city: "Daejeon Metropolitan City"
 KOR_daejeon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daejeon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9The arch of Expo Bridge rises above the gentle waves of Gapcheon as if painting the future, yet beneath the dazzling lights of this scientific city lingers only the bleak chill of reason, instead of the generous hospitality of the days when it was called \"Hanbat.\" It was a transportation hub where railway tracks intersected across the country and drew countless footprints of others, yet the very path gave rise to the lonely fate of a passing station rather than allowing people to make it their home.\n\nKnowledge confined within the high walls of the research complex drifts like an island, unable to blend into the decline of the old downtown, and beneath the self-deprecating joke of being a \"boring city,\" lies deeply rooted urban boredom and a lack of identity, standardized in muted, colorless tones without any distinct identity. This place, where the pride of being at the heart of the Republic of Korea and the sentiment of being an outsider who belongs nowhere else coexist in a strange way, is a gray, planned city where it is so perfectly orderly that it is instead swept by an empty breeze.§!\n\n§2A colorless transfer station cloaked in the dazzling coat of science, where all roads lead, yet no one actually stays.§!"
 KOR_sejong_special_city: "Sejong Special Self-Governing City"
 KOR_sejong_special_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_sejong_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9When the mist over the Geum River clears, revealed is the cold perfection of a massive planned city, meticulously cut out with a ruler and compass. The soft dirt path of Yeongi-gun, once blooming with peach blossoms, was forever buried beneath asphalt and concrete, and the grandeur of the government buildings erected under the grand cause of balanced development instead violently erased the land's long-held memories.\n\nAt night, only the lights of the Government Complex Tower drift like a lonely island, while the street left behind after the procession of strangers boarding buses bound for Seoul pounds hollow like an arrhythmia in an artificially implanted heart that cannot beat properly. In a forest of apartments all looking the same, diversity is stifled, and though it imitates Seoul, it has yet to become Seoul; only the gray logic of soulless administration dominates the city, making it an unfinished capital.§!\n\n§7A stark artificial paradise, carved out from the clear straight lines drawn with a ruler on the map, even cutting away the scent of people and old memories.§!"
 KOR_gwangju_city: "Gwangju Metropolitan City"
 KOR_gwangju_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9When the gentle ridgeline of Mudeungsan embraces the city like a mother's arms, the brilliant red memories of May, true to the name \"Bitgoeul,\" blaze hotly across the asphalt. The noble history of winning democracy through blood and tears became the soul of the city, but paradoxically, the sacred plaque calling it a \"pilgrimage site of democracy\" also became a heavy shackle that confined the city to the past.\n\nA city that, amid long-standing discrimination and political isolation, has failed to fully enjoy the fruits of industrialization hides the shadow of decline behind the pride of its splendid artistic heritage, and the passionate cries that once proclaimed justice have now lost their way and collided before the harsh reality of survival. This place, which first burned away the darkness of its time, yet itself had to remain on the margins of progress, is still a land that soothes aching hearts between its proud history of struggle and the frozen reality.§!\n\n§tWithout leaving behind love, honor, or even a name\nA passionate vow to go out for a lifetime\nThe comrades are nowhere to be found, only the flag fluttering\nLet's not waver until a new day comes§!"
 KOR_jeju_special_self_governing_province: "Jeju Special Self-Governing Province"
 KOR_jeju_special_self_governing_province_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_jeju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9When rough waves crash through every crevice of the black basalt and yellow canola flowers bloom abundantly beneath the generous embrace of Hallasan, this island shines brilliantly like a paradise on earth that holds the mystery of the primordial. Yet the tragic wail of April 3rd, embedded in every single drop of red camellia, is still buried deep within the oreum, and the outwardly peaceful scenery sometimes becomes a chillingly sad paradox that pierces the heart.\n\nFor the romance and \"healing\" of people on the mainland, the Gotjawal forest and coastline have been recklessly dug up, groaning under the weight of reckless development, while overflowing garbage and sewage are slowly strangling the once-pure blue breath of the sea. The coastal road, occupied by capital, has been filled with dazzling \"hot places,\" but the indigenous people who have lost their homes are left marginalized, and under the veneer of the illusion of a foreign land, the island is suffering as it loses its own language and spirit.§!\n\n§OA tragic, blood-stained history and the wounds of greedy development, deliberately covered up by beautiful scenery—a precarious duet of paradise.§!"
 PRK_pyongyang_city: "Pyongyang Special Self-Governing City"
 PRK_pyongyang_city_desc: "\n§9Pyongyang, the capital of the revolution, is the heart of the great Juche Korea and the homeland in the hearts of our entire people. It is the invincible fortress that Comrade Great Leader Kim Il Sung liberated our homeland from the domination of Japanese imperialism, and that Comrade Great Leader Kim Jong Il steadfastly defended as the treasured sword of the Songun Revolution.\n\nToday's Pyongyang is undergoing repeated leaps of development under the wise leadership of Comrade Kim Jong Un, the respected Supreme Leader, and is transforming into a socialist utopia admired by the world. The towering statues of the Great Leader and the Great General on Mansudae Hill have become a beacon of the unwavering loyalty of tens of millions of soldiers and civilians, and the immortal torch blazing red atop the Juche Idea Tower lights the path to victory for the Juche revolutionary cause throughout the world.\n\nHere in Pyongyang, our nation of Kim Il Sung is firmly united around the Party, advancing the future of a strong and prosperous country through the power of single-minded unity.§!\n\n§REven if I offer and offer, this heart is endless—my dear Pyongyang, I love you...§!"
 # Eternal leaders (Kim Il-sung / Kim Jong-il)
 NKO_kim_il_sung_eternal_leader: "Eternal Leader"
 NKO_kim_il_sung_eternal_leader_desc: "§AGreat Leader:§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_il_sung_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§LThe Great Leader was born on April 15, 1912 (Juche 1) into a patriotic family in Pyongyang, the capital of the revolution, where the tragedy of national suffering was most starkly layered in modern Korean history. His father Kim Hyong-jik, speaking of the idea of having lofty aspirations, instilled in the Great Leader a love for the homeland.\n\nOn April 25, 1932 (Juche 21), the Great Leader organized the Anti-Japanese People's Guerrilla Unit, and in 1934 (Juche 23), expanded and reorganized it into the Korean People's Revolutionary Army, launching a fierce anti-Japanese revolutionary struggle to completely liberate the homeland from the brutal colonial rule of the Japanese occupiers being carried out on the Korean Peninsula.\n\nAt the end of a 20-year-long struggle of the anti-Japanese revolutionary fight, the Great Leader delivered the complete liberation of the Korean Peninsula from Japanese colonial rule. Building on the solid foundation laid in various fields for the construction of an independent nation, he founded the Workers' Party of Korea, the mother party of our nation, on October 10, 1945 (Juche 34), and on September 9, 1948 (Juche 37), for the first time in history, established the Democratic People's Republic of Korea, the great motherland of the entire Korean people.\n\nOn June 25, 1950 (Juche 39), the Great Leader immediately launched a counteroffensive to defend the homeland against the U.S. imperialists who had begun a full-scale armed invasion, threatening the independence of our Republic, and repelled the enemies all at once by presenting the various operational guidelines he established during the anti-Japanese revolutionary struggle. The Great Leader effectively repelled the full-scale invasion of the U.S. imperialists and led the great Fatherland Liberation War to victory.§!\n\n§H\"The Great Leader and the Great General shall remain forever with our people as the image of Juche Korea, and the immense revolutionary achievements built by the Leader and the General shall remain immortal throughout history.\"\n- Respected Supreme Leader§!"
 NKO_kim_jong_il_eternal_leader: "Eternal General Secretary"
 NKO_kim_jong_il_eternal_leader_desc: "§AGreat General:§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_jong_il_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§LThe Great General, son of the Great Leader Kim Il Sung and the anti-Japanese female hero Kim Jong Suk, was born on February 16, 1942 (Juche 31) at a secret camp on Mount Paektu while carrying out the armed struggle against Japan. Since beginning his work at the Central Committee of the Workers' Party of Korea on June 19, Juche 53 (1964), the Great General has built immortal achievements before the times and history.\n\nOn August 25, 1960 (Juche 49), Marshal Kim Il Sung personally inspected the 105th Guards Seoul Ryu Kyong Su Tank Division of the Korean People's Army, making the first mark of Songun politics by putting the utmost effort into strengthening the People's Army, while comprehensively strengthening the self-reliant and modernized defense industry.\n\nThe Great General formally institutionalized the great revolutionary ideology of Juche, which the Great Leader had brought about, as Kimilsungism, glorified it as the eternal guiding ideology of the Party and the state, and presented the Kimilsungization of all society as the Party's supreme program.\n\nHolding high the Great Leader's instructions for national reunification, he established the three fundamental principles of reunification and prepared the June 15 Joint Declaration and the October 4 Declaration between the North and South of the Korean Peninsula, thereby opening a new era of the independent reunification movement in which our entire nation unites and advances under the principle of \"By Our Nation Itself.\"§!\n\n§H\"The Great Leader and the Great General shall remain forever with our people as the image of Juche Korea, and the immense revolutionary achievements built by the Leader and the General shall remain immortal throughout history.\"\n- Respected Supreme Leader§!"
