 pokpung_ho_decision:0 "Create Pokpung-ho Design"
 pokpung_ho_decision_desc:0 "The Pokpung-ho is a North Korean main battle tank developed from the T-72. It features a 125mm smoothbore gun and reactive armor, development began in 2002."

 songun_ho_decision:0 "Create Songun-ho Design"
 songun_ho_decision_desc:0 "The Songun-ho is an improved variant of the Pokpung-ho with enhanced armor protection and fire control systems, introduced in the 2010s."

 m2020_decision:0 "Create M-2020 Design"
m2020_decision_desc:0 "The M-2020 is North Korea's newest main battle tank, unveiled in 2020. It resembles the Russian T-14 Armata design with a remote weapon station and composite armor."

m2010_decision:0 "Create M-2010 Design"
m2010_decision_desc:0 "The M-2010 is a North Korean armored personnel carrier introduced in the 2010s, featuring composite armor and improved armament."

juchepo_decision:0 "Create Juche-Po Design"
juchepo_decision_desc:0 "The Juche-Po is a North Korean self-propelled artillery system with advanced fire control and extended-range ammunition."

zulfiqar3_decision:0 "Create Zulfiqar-3 Design"
zulfiqar3_decision_desc:0 "The Zulfiqar-3 is the latest variant of Iran's Zulfiqar tank series with enhanced armor protection and firepower, entering service in 2016."

moharram6_decision:0 "Create Moharram-6 Design"
moharram6_decision_desc:0 "The Moharram-6 is an Iranian self-propelled surface-to-air missile system utilizing vertical launch technology."

type24_airborne_decision:0 "Create Type 24 Airborne Combat Vehicle Design"
type24_airborne_decision_desc:0 "The Type 24 Airborne Combat Vehicle is China's new-generation airborne fighting vehicle, featuring an unmanned turret and anti-tank missiles. It can be airdropped as a whole unit, providing accompanying firepower and assault capability for airborne troops."