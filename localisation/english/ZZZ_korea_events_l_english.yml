l_english:
 zzz_kor.1.t:0 "Talks Resume on the Peninsula"
 zzz_kor.1.d:0 "More than seventy years after the armistice, North and South sit at the same table again. The international community provided the venue and the guarantees; the delegations spent closed sessions on confidence-building measures, economic cooperation and the shape of a future settlement. How far the talks go depends on the judgement of both governments tonight."
 zzz_kor.1.a:0 "Keep talking."
 zzz_kor.1.b:0 "End this round."
 zzz_kor.2.t:0 "A Confederation on the Peninsula"
 zzz_kor.2.d:0 "The talks produced a breakthrough. Both sides signed a framework: no merger of states, no redrawing of borders — instead the two regimes are bound into a single military alliance as a stepping stone toward eventual unification. The region reacted in mixed terms; some call it a pragmatic step, others fear it merely institutionalises the division."
 zzz_kor.2.a:0 "One nation, two states, one alliance."
 zzz_kor.3.t:0 "The Dialogue Collapses"
 zzz_kor.3.d:0 "The final round ended without agreement. The two sides clashed over security guarantees and political arrangements, and the delegations walked out one after the other. The armistice line is quiet again, but the unsigned document remains on the table — the starting point of the next attempt, or the reason there will not be one."
 zzz_kor.3.a:0 "We did what we could."
 zzz_kor.4.t:0 "The Peninsula Unified Under Pyongyang"
 zzz_kor.4.d:0 "Northern forces crossed the old armistice line and southern resistance collapsed within weeks. Pyongyang declared the peninsula unified, kept the name Korean People's Republic and moved the capital to Seoul. Southern parties were dissolved or absorbed, and elections will be held under a new framework — how much room that framework leaves the opposition, no one says."
 zzz_kor.4.a:0 "The era of division is over."
 zzz_kor.5.t:0 "The Peninsula Unified Under Seoul"
 zzz_kor.5.d:0 "Southern forces advanced to the Tumen and the northern regime surrendered its arms as it collapsed. Seoul declared the peninsula unified, extending the Republic of Korea's constitution and electoral system across the whole peninsula. Northern cadres now face purge or co-option, and millions of residents changed citizenship overnight — the real cost of integration will only surface later."
 zzz_kor.5.a:0 "By constitution and by ballot."
 zzz_kor.6.t:0 "The Korean People's Republic Proclaimed"
 zzz_kor.6.d:0 "The unified state has settled on a name: the Korean People's Republic. The new government claims the tradition of the 1945 provisional government, places its capital in Seoul, and promises a peninsula-wide free election to form a government. Beijing and most regional states sent congratulations; Tokyo said nothing."
 zzz_kor.6.a:0 "One peninsula, one state."
 zzz_kor.7.t:0 "Foundation of the Korean People's Republic"
 zzz_kor.7.d:0 "[Seoul] With the unification process complete, more than seventy years of division on the Korean peninsula have ended. In its founding declaration the new Korean People's Republic promised a peninsula-wide free election. Regional capitals are not of one mind about the settlement; Washington and Beijing are both waiting for the result."
 zzz_kor.7.a:0 "History turns a page."
 zzz_kor.8.t:0 "The First Peninsula-Wide Election"
 zzz_kor.8.d:0 "The first peninsula-wide election monitored by international observers has finished counting. The southern progressive camp and the northern Korean Social Democratic Party ran on a joint ticket and won a majority on a platform of healing the division. Turnout set a peninsula record: from Jeju to the Tumen, one ballot box now holds two sets of memories kept apart for decades."
 zzz_kor.8.a:0 "Sim Sang-jung is elected the first president."
 zzz_kor.9.t:0 "Peninsula-Wide Election Results Announced"
 zzz_kor.9.d:0 "[Seoul] The final results of the first peninsula-wide election have been published. The new government will take over two separate administrations within a federal framework; its first tasks are fiscal integration, merging the armies, and reuniting divided families. Observers called the process broadly free but noted that organising conditions in parts of the north were not equal."
 zzz_kor.9.a:0 "The new government takes office."
 zzz_kor.10.t:0 "The First Nationwide Election"
 zzz_kor.10.d:0 "After the north was absorbed and the peninsula placed under Seoul's administration, the Republic of Korea held its first nationwide election covering the whole peninsula. Voters in the old north entered a multi-party polling station for the first time; the outcome is left to the ballots, with no candidate pre-selected."
 zzz_kor.10.a:0 "Let the ballots decide."
 zzz_kor.11.t:0 "The Fallen Return Home"
 zzz_kor.11.d:0 "[Shenyang] A group of volunteer soldiers killed in the Korean War has been flown home and laid to rest in a martyrs' cemetery. For the first time in a long while, both Koreas sent representatives to the handover. For Beijing this closes a historical file; for the peninsula it means the war of seventy years ago is finally allowed to end."
 zzz_kor.11.a:0 "The fallen return home."
