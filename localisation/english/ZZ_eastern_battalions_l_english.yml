l_english:
 E_Tank_Bat:0 "Tank Battalion"
 E_Tank_Bat_desc:0 "A Soviet-pattern tank battalion: three companies of ten tanks each plus the battalion HQ tank, 31 tanks in total. 600 soldiers."
 E_Arm_Inf_Bat:0 "Mechanized Infantry Battalion"
 E_Arm_Inf_Bat_desc:0 "A motor rifle battalion mounted on BMP-2/BMP-3 infantry fighting vehicles: three companies, 42 IFVs. 1150 soldiers."
 E_Mech_Inf_Bat:0 "Motor Rifle Battalion (Wheeled)"
 E_Mech_Inf_Bat_desc:0 "A motor rifle battalion mounted on BTR-80/BTR-82A wheeled armored personnel carriers: three companies, 42 carriers. 1150 soldiers."
 E_Mot_Inf_Bat:0 "Motor Rifle Battalion (Truck)"
 E_Mot_Inf_Bat_desc:0 "A truck-borne motor rifle battalion: three rifle companies lifted by Ural/KamAZ trucks. 1150 soldiers."
 E_L_Inf_Bat:0 "Light Infantry Battalion"
 E_L_Inf_Bat_desc:0 "A light infantry battalion fighting on foot: three rifle companies with machine-gun and mortar support. 1050 soldiers."
