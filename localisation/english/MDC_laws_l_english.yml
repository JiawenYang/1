l_english:
 population_pyramid_1_desc: "This country has a large cohort of young people and a rapidly growing population. It is unburdened by excessive social spending, but is also unstable and prone to political violence.\n-------------------\nTo change this law, you must not be at war or suffering from its consequences, and have a healthy economic cycle. To transition to this type of pyramid, you need to increase the overall population growth."
 population_pyramid_2_desc: "This country has a balanced age distribution and stable population growth.\n-------------------\nTo change this law, you must not be at war or suffering from its consequences, and have a healthy economic cycle. To transition to this type of pyramid, you need to either increase or decrease the overall population growth."
 population_pyramid_3_desc: "This country has a shortage of young people and a declining population. The large number of net-consumers places a great tax burden on those who can work, but as a result of being suffocated in debt the young have no appetite or means to cause political disturbances.\n-------------------\nTo change this law, you must not be at war or suffering from its consequences, and have a healthy economic cycle. To transition to this type of pyramid, you need to decrease the overall population growth."


 corruption_level_10: "(10) Paralyzing Corruption"
 corruption_level_10_desc: "Corruption in our country is pervasive, entrenched, systemic, and unprecedented in scale and reach."
 corruption_level_09: "(9) Crippling Corruption"
 corruption_level_09_desc: "Corruption in our country inundates all parts of society. It's not the activity of a few rogue officials or politicians. It is more like organized crime, with corrupt procurement deals arising through collusion and a kleptocracy racket."
 corruption_level_08: "(8) Rampant Corruption"
 corruption_level_08_desc: "Corruption in our country is perceived as a significant problem impacting all aspects of life, including public administration, law enforcement, healthcare, and education. The phenomenon of corruption is strongly established in our model of public governance and is attributed to the general weakness of the rule of law in our country."
 corruption_level_07: "(7) Unrestrained Corruption"
 corruption_level_07_desc: "Our country has long suffered from widespread and endemic corruption. Corruption remains a serious problem in the public and private sector even though the legal and institutional framework combating corruption is strong. Payoffs, kickbacks, and government corruption are considered part of everyday life."
 corruption_level_06: "(6) Systematic Corruption"
 corruption_level_06_desc: "Corruption in our country is the confluence of many factors, including weak enforcement of the law, a lack of audits, the absence of codes of conduct, the non-transparency of government activities, an inefficient bureaucracy, government impunity and broad discretionary powers, and a lack of public awareness. "
 corruption_level_05: "(5) Widespread Corruption"
 corruption_level_05_desc: "Bribery and corrupt practices are widespread in our country, though it is a matter of opinion whether it is a problem with the system or with the individuals in power."
 corruption_level_04: "(4) Medium Corruption"
 corruption_level_04_desc: "The exposure of high-profile corruption cases in the media and limited political engagement have contributed to a poor public perception of the political process in our country. Recurring corruption scandals involving high-level politicians, local administrators, and businesses abusing public funds have revealed that established safeguards to counter this abuse of power have been relatively inefficient."
 corruption_level_03: "(3) Modest Corruption"
 corruption_level_03_desc: "While the perception of corruption is generally low, political parties and businesses are usually seen as the least honest and trustworthy. Petty corruption is not as uncommon as in some other countries."
 corruption_level_02: "(2) Slight Corruption"
 corruption_level_02_desc: "The perception and the occurrence of corruption are generally very low in our country. Petty and administrative corruption is more or less non-existent. This means that citizens and businesses are not likely to face corruption while in contact with public officials. However, some cases have shown that personal ties, gifts, and conflicts of interest are problem areas which represent some types of nontraditional corruption."
 corruption_level_01: "(1) Negligible Corruption"
 corruption_level_01_desc: "The legal and institutional framework in our country are considered effective in fighting against corruption, and government agencies are characterized by a high degree of transparency, integrity, and accountability. The low levels of corruption are attributed to an efficient public administration, high quality and comprehensive services to citizens and enterprises, a long tradition of openness and transparency in our society and institutions, and a strong respect for the rule of law."

