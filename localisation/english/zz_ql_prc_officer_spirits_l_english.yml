l_english:
 # QL Officer Corps Spirits (Army/Navy/Air)
 ql_prc_army_spirit_01:0 "Professional Military Development"
 ql_prc_army_spirit_01_desc:0 "A national defense force built on the principle of the military serving the nation, emphasizing professional and scientific training alongside patriotic devotion, with ethics review and civilian decision-making oversight to keep its values on course."
 ql_prc_army_spirit_02:0 "Follow the Party, March with the Party"
 ql_prc_army_spirit_02_desc:0 "A distinctly Chinese party-army relationship: the Party commands the gun, Party branches are built at the company level, and command authority is highly centralized to ensure the absolute loyalty of the people's army. Obey the Party's command, win the battles, and keep fine conduct."
 ql_prc_army_spirit_03:0 "Armed Forces of the State"
 ql_prc_army_spirit_03_desc:0 "A command and training system common in Eastern nations, emphasizing centralized large-scale military management, vertical integration of force structure, and the importance of mobilized reserves, with military-political organs and intelligence services deeply fused."
 ql_prc_army_spirit_05:0 "Politicization of the Military"
 ql_prc_army_spirit_05_desc:0 "According to mainstream political theory, 'militarization of politics' describes the military's growing involvement in and influence over political decisions; in many spheres military leaders manipulate political decision-making to advance the interests of military rule."
 ql_prc_navy_spirit_07:0 "Emphasis on Air Deterrence"
 ql_prc_navy_spirit_07_desc:0 "The strongest air force is our air force; the second strongest is our naval aviation. Whichever side holds air superiority understands the sea better, compressing the enemy's living space and hunting them down for the killing blow."
 ql_prc_navy_spirit_08:0 "Information Decides Victory"
 ql_prc_navy_spirit_08_desc:0 "Modern naval warfare is informationized warfare. To build a world-class navy, we must strengthen situational awareness and forge a matching strike system, preparing with devotion, rigor, and resolve for the decisive moment to come."
 ql_prc_navy_spirit_09:0 "Young Seafarer Training"
 ql_prc_navy_spirit_09_desc:0 "The key to victory lies in lethal and swift offense and mastery of adaptation; boldly push forward in multi-dimensional three-dimensional thrusts and saturate the enemy with surface fleet attacks, rather than waiting for their encirclement and blockade."
 ql_prc_navy_spirit_11:0 "Maritime Tradition in Study"
 ql_prc_navy_spirit_11_desc:0 "The navy is a service that reveres history; we can draw strength from rich combat experience, from equipment design and personnel training to the everyday habits of sailors. Building and maintaining a powerful capital ship group is imperative."
 ql_prc_navy_spirit_12:0 "Focus on Submarine Training"
 ql_prc_navy_spirit_12_desc:0 "Our nation lacks the funds and capacity to invest in a mighty surface fleet; weighing the options, we should first guarantee the operation of a powerful underwater deterrent fleet to defend maritime sovereignty, and only then consider a more balanced navy."
 ql_prc_army_spirit_13:0 "International Joint Defense"
 ql_prc_army_spirit_13_desc:0 "Through deep participation in the international arms market, we can conveniently conduct technical cooperation and inter-army exchanges, acquiring more advanced weapons and richer equipment experience to offset some of our shortcomings."
 ql_prc_army_spirit_14:0 "Full Industrial Chain Capability"
 ql_prc_army_spirit_14_desc:0 "Possessing an unmatched, vast full-chain civilian industry alongside military industry with independent intellectual property, the production cost of our cutting-edge weapons can fall dramatically, while military-civilian integration keeps the market thriving."
 ql_prc_army_spirit_15:0 "Efficient Armed System"
 ql_prc_army_spirit_15_desc:0 "By concentrating state assets in the military sphere with proper organization and construction plans, we can retain strong production, research, and front-line supply capabilities even when the civilian economy withers."
 ql_prc_navy_spirit_18:0 "Accumulated Oceanography"
 ql_prc_navy_spirit_18_desc:0 "Through a long seafaring history we have mastered the hydrography of many of the world's seas, learned how to build comfortable, seaworthy blue-water vessels, and become versed in the operating techniques that keep them efficient."
 ql_prc_navy_spirit_19:0 "Efficient Shipbuilding"
 ql_prc_navy_spirit_19_desc:0 "We are one of the world's great shipbuilding nations and have mastered many specialized shipbuilding techniques, able to research, build, and commission far more ships than our rivals at astonishing speed — with quality in no way inferior."
 ql_prc_navy_spirit_20:0 "Polar Operations Experience"
 ql_prc_navy_spirit_20_desc:0 "A developed nuclear industry and centuries of cold-zone maritime shipping experience give our nation the ability to build the most professional polar vessels, letting us cross the top of the world to bring death and destruction to those arrogant rodents."
 ql_prc_navy_spirit_21:0 "Revive the Heavy Warships"
 ql_prc_navy_spirit_21_desc:0 "Now that we again possess a navy made great once more, with no fear of the open seas being seized by the enemy, it is time to return to the slumbering big-gun strategy — to research and outfit those colossal steel capital ships!"
 ql_prc_air_spirit_23:0 "Cutting-Edge Air Transport"
 ql_prc_air_spirit_23_desc:0 "Through deep participation in the international aviation industry chain — especially the development and operation of large airframes — we can obtain the newest technology and mature subsystems, along with a corps of skilled elite pilots."
 ql_prc_air_spirit_24:0 "Excellence in Wind Tunnel Testing"
 ql_prc_air_spirit_24_desc:0 "The largest and most complete cluster of wind tunnel facilities in many specifications, with supporting research institutes, gives our nation the ability to develop and iterate new equipment in shorter time — always one step ahead in the free kingdom of advanced aircraft design."
 ql_prc_air_spirit_25:0 "Systems Engineering Research"
 ql_prc_air_spirit_25_desc:0 "Aviation systems engineering is the scientific method of analyzing a system's constituent elements, organizational structure, information flow, and control mechanisms to best achieve its purpose — compensating for certain technical flaws in subsystems."
 ql_prc_army_spirit_28:0 "Defend Freedom, Enduring Security"
 ql_prc_army_spirit_28_desc:0 "With the enemies of our shared values, there is no negotiation — until their shadow is purged by the strength given from above! When the mad storm comes upon this world drifting toward fragmentation, someone must still uphold order and offer hope."
 ql_prc_army_spirit_29:0 "People Above All, Original Aspiration Unforgotten"
 ql_prc_army_spirit_29_desc:0 "The people's army must never forget its fundamental purpose of serving the people wholeheartedly, standing as the people's own soldiers at all times and in all circumstances. Remember the great truths history has revealed — justice prevails! Peace prevails! The people prevail!"
 ql_prc_army_spirit_30:0 "Forge the Will, Steadfast in Action"
 ql_prc_army_spirit_30_desc:0 "The motherland calls! Whatever we believe, only in unity can we defend national dignity and destroy the barbaric thugs; let the heroism of our great ancestors inspire you in war! Onward to victory!"
 ql_prc_navy_spirit_32:0 "Command the Boundless Ocean"
 ql_prc_navy_spirit_32_desc:0 "Control of the vast ocean is never a finished task — without assured absolute superiority it is meaningless. Without a navy, the war will be fought on our own soil; war is like a match, and it is best fought in the enemy's half of the field."
 ql_prc_navy_spirit_33:0 "Heading for the Vast Deep Blue"
 ql_prc_navy_spirit_33_desc:0 "By 2010, secure control of the seas within the first island chain and make it an inner sea; by 2020, ensure control within the second island chain; and by 2040, attain the power to check the dominance of the US Navy in the Pacific and Indian Oceans."
 ql_prc_navy_spirit_34:0 "Build the Deterrent Force"
 ql_prc_navy_spirit_34_desc:0 "Without command of the sea, our nation remains a prisoner of the land; I forged her a fleet to open the door to the world. Though that fleet, through setback upon setback, lies dormant beneath the waves for a time, it will be reborn and regain its supreme honor."
 ql_prc_air_spirit_36:0 "Global Strike Capability"
 ql_prc_air_spirit_36_desc:0 "Use comprehensive air supremacy to project greater force while preventing enemy interference as much as possible; to some extent, air power alone can decide the outcome of a war, without relying on the army or the navy."
 ql_prc_air_spirit_37:0 "Victory a Thousand Miles Away"
 ql_prc_air_spirit_37_desc:0 "With the development of radar technology and ultra-long-range air-to-air missiles, the potential of large-scale BVR combat is gradually emerging; with targeted tactics, every intruder can be destroyed without visual confirmation."
 ql_prc_air_spirit_38:0 "Conquer the Forward Airspace"
 ql_prc_air_spirit_38_desc:0 "An army without air superiority is like a giant without eyes, doomed to struggle blindly on the battlefield. Our air force's mission is, first, to keep front-line ground operations undisturbed, and second, to secure the airspace of the theater."
 # Spirit level-up tooltips (tt)
 ql_prc_army_spirit_01_tt:0 "Army leaders: §G100% chance§! to gain §Y+1 Planning§! and §Y+1 Logistics§! on level up."
 ql_prc_army_spirit_02_tt:0 "Army leaders: §G100% chance§! to gain §Y+1 Attack§! on level up."
 ql_prc_army_spirit_03_tt:0 "Army leaders: §G100% chance§! to gain §Y+1 Defense§! on level up."
 ql_prc_navy_spirit_07_tt:0 "Navy leaders: §G100% chance§! to gain §Y+1 Defense§! on level up."
 ql_prc_navy_spirit_08_tt:0 "Navy leaders: §G100% chance§! to gain §Y+1 Attack§! on level up."
 ql_prc_navy_spirit_09_tt:0 "Navy leaders: §G100% chance§! to gain §Y+1 Maneuver§! and §Y+1 Coordination§! on level up."
