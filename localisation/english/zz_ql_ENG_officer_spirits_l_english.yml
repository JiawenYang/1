l_english:
 ql_ENG_army_academy_spirit_01:0 "Sandhurst and the Officer Training System"
 ql_ENG_army_academy_spirit_01_desc:0 "The Royal Military Academy Sandhurst delivers the initial commission course for British Army officers, working alongside the single-service schools to form a complete officer training chain. Selection is narrow and standards are kept deliberately high, so that a small officer corps can sustain a professional force."
 ql_ENG_army_spirit_02:0 "Professional Standing Army"
 ql_ENG_army_spirit_02_desc:0 "The British Army is compact but fully professional, built around high readiness, combined-arms practice and concentrated artillery rather than mass formations. Its doctrine prizes trained regulars, rapid deployment and precise firepower over raw numbers."
 ql_ENG_army_command_spirit_03:0 "Joint Operations Command"
 ql_ENG_army_command_spirit_03_desc:0 "The Permanent Joint Headquarters and the defence staff system plan and coordinate operations across the three services. Joint targeting, shared intelligence and a single operational chain of command let a small force act with the weight of a much larger one."
 ql_ENG_navy_command_spirit_04:0 "Royal Navy Blue-Water Tradition"
 ql_ENG_navy_command_spirit_04_desc:0 "The Royal Navy is built for sustained operations far from home: long-range deployments, global station keeping and amphibious projection backed by a carrier group. Its heritage of sea control and expeditionary warfare still shapes how the fleet is trained and employed."
 ql_ENG_air_academy_spirit_05:0 "RAF Flying Training"
 ql_ENG_air_academy_spirit_05_desc:0 "Royal Air Force flying training is centrally managed, moving crews from elementary instruction to operational conversion under uniform standards. The emphasis is on consistently high training levels rather than rapid expansion."
 ql_ENG_air_spirit_06:0 "RAF Air Superiority"
 ql_ENG_air_spirit_06_desc:0 "Air superiority and interception remain the core of Royal Air Force planning. Fighter wings are expected to contest hostile airspace, protect strike packages and hold the line over the home islands and deployed forces alike."
 ql_ENG_air_command_spirit_07:0 "RAF Expeditionary Airpower"
 ql_ENG_air_command_spirit_07_desc:0 "Royal Air Force expeditionary operations combine close air support, escort and rapid deployment to distant theatres. The command structure is built to push a small but capable air contingent wherever British interests require it."
