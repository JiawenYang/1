 FRA_Guillaume_Peltier_EM:0 "Guillaume Peltier"
 FRA_Guillaume_Peltier_EM_desc:0 "Guillaume Peltier, born on July 27, 1976, is a French politician and member of the political party The Republicans (LR). He has been a Member of the National Assembly since 2012, representing the 2nd constituency of the Loir-et-Cher department. Peltier is known for his conservative and nationalist views, advocating for traditional values and national sovereignty. He has been a prominent figure in the French right-wing political landscape and has been involved in efforts to reform the LR party. Peltier is seen as a potential future leader within the party and has been a vocal critic of President Emmanuel Macron's government."
