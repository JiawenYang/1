 FRA_Herve_Gomart_IM:0 "Hervé Gomart"
 FRA_Herve_Gomart_IM_desc:0 "Hervé Gomart is a French diplomat and intelligence officer. He served as the Director of the Directorate of Military Intelligence (DRM), France's military intelligence agency, from 2013 to 2017. Gomart has a background in military and intelligence affairs, and he has been involved in shaping France's national security policies. He is known for his expertise in intelligence matters and his role in coordinating intelligence efforts in support of French military operations. Gomart's tenure as Director of DRM coincided with a period of heightened security challenges for France, including terrorist threats and military interventions abroad."
