 FAF_balancing_militarism_and_democracy_tt:0 "§CWith this, the Mlitary Junta that started the civil war will be disregarded, but their influence has yet to be removed from French society§!"
 FAF_ban_on_socialists_lifted_tooltip:0 "All Socialist Parties, Including the Communist Party, will be §GUNBANNED!§!"
 FAF_bastille_tt:0 "Our Seige of Verdun Major Command Center and Arms Depot will be reported back to us."
 FAF_betrayal_tt:0 "§YIf [ENG.GetFlag] §!§CBritain§! §Gaccepts§!§Y, they will follow us into any alliance created due to [GER.GetFlag]§!§RGerman Aggression§!"
 FAF_brick_by_brick1_idea:0 "Brick by Brick"
 FAF_brick_by_brick1_idea_desc:0 "This nation of ours was built with the sweat of our brow, the blood of our people, and the sacrifice of numerous generations. Following our defeat in the Russo-European war, our country now lies in ruins. Our homes were reduced to rubble and our factories flattened to dust. Discontent grows across the country and separatist movements enlarge day by day. It is vital that we bring back our nation's lost glory and pride. Piece by piece and brick by brick we must uplift France from its current situation back to prosperity."
 FAF_brick_by_brick2_idea:0 "Brick by Brick"
 FAF_brick_by_brick2_idea_desc:0 "This nation of ours was built with the sweat of our brow, the blood of our people, and the sacrifice of numerous generations. Following our defeat in the Russo-European war, our country now lies in ruins. Our homes were reduced to rubble and our factories flattened to dust. Discontent grows across the country and separatist movements enlarge day by day. It is vital that we bring back our nation's lost glory and pride. Piece by piece and brick by brick we must uplift France from its current situation back to prosperity."
 FAF_brick_by_brick3_idea:0 "Brick by Brick"
 FAF_brick_by_brick3_idea_desc:0 "This nation of ours was built with the sweat of our brow, the blood of our people, and the sacrifice of numerous generations. Following our defeat in the Russo-European war, our country now lies in ruins. Our homes were reduced to rubble and our factories flattened to dust. Discontent grows across the country and separatist movements enlarge day by day. It is vital that we bring back our nation's lost glory and pride. Piece by piece and brick by brick we must uplift France from its current situation back to prosperity."
 FAF_brick_by_brick4_idea:0 "The New France"
 FAF_brick_by_brick4_idea_desc:0 "France has been developed brick by brick into the model nation that we have desired for years. France now stands as a new creation built to last and preserve during the upcoming challenges we will face."
 FAF_brick_by_brick5_idea:0 "The New France"
 FAF_brick_by_brick5_idea_desc:0 "France has been developed brick by brick into the model nation that we have desired for years. France now stands as a new creation built to last and preserve during the upcoming challenges we will face."
 FAF_brick_by_brick_idea:0 "Brick by Brick"
 FAF_brick_by_brick_idea_desc:0 "This nation of ours was built with the sweat of our brow, the blood of our people, and the sacrifice of numerous generations. Following our defeat in the Russo-European war, our country now lies in ruins. Our homes were reduced to rubble and our factories flattened to dust. Discontent grows across the country and separatist movements enlarge day by day. It is vital that we bring back our nation's lost glory and pride. Piece by piece and brick by brick we must uplift France from its current situation back to prosperity."
 FAF_building_an_empire_idea:0 "Building an Empire"
 FAF_building_an_empire_idea_desc:0 "It takes time to build an empire, both to ready it for conquest and to uproot any remaining vitriol in their conquests. As it was said and oft repeated, ''Rome was not built in a day'', and neither shall we be. The nation must be stabilized, it must be prosperous, it must be made sacred and stable forevermore before we can truly declare our empire constructed. When built on unstable construction, there is nothing at all."
 FAF_burgeoning_middle_class_idea:0 "Burgeoning Middle Class"
 FAF_burgeoning_middle_class_idea_desc:0 ""
 FAF_celebrate_our_victories_decision:0 "Reward the Victorious"
 FAF_celebrate_our_victories_decision_desc:0 "It never mattered how hard one worked or how arduous the process was; all that mattered was the result. Ultimately, there are only two outcomes in everything: success or failure, winning or losing. Those who win and succeed must be rewarded to inspire others to strive for victory and success. After all, merit matters most."
 FAF_champion_idealistic_victory_decision:0 "Champion Victory"
 FAF_champion_idealistic_victory_decision_desc:0 ""
 FAF_chose_fachies_tt:0 "§nThis will empower the Fascists and Identitarians§!"
 FAF_chose_no_fachies_tt:0 "§PThis will consolidate power in the Military§!"
 FAF_clarity_in_liberty_decision:0 "Clarity in Liberty"
 FAF_clarity_in_liberty_decision_desc:0 "Some claim that our movement being on the right means that we only want a totalitarian dictatorship that only brings about suffering. While some among our ranks think such a system would be the most optimal, the truth is that the idea of "liberty" is one that we can co-opt and use to bring in those nostalgic for the liberal democracies of old. Said liberty, however, is not tied to progressive nonsense and minority worship that was witnessed before the fall of the neo-liberal world order. Sure, those who benefitted from these liberties are sure to complain, but the point was to rid the continent of them anyway… right?"
 FAF_communist_crackdown:0 "Communist Crackdown"
 FAF_communist_crackdown_desc:0 "Once again, a specter is haunting Europe. As the corrupt Republic imploded under its weight, the Marxist rats that hid under the visage of liberal civility tried to destroy our beloved France. Thankfully, since we have managed to win the civil war, we finally have the means to crack down on these elements. If we fail to do so, only God knows what will happen to Europe if our movement fails."
 FAF_concessions_to_the_military_decision:0 "Concessions to the Military"
 FAF_concessions_to_the_military_decision_desc:0 ""
 FAF_continental_system_idea:0 "Continental System"
 FAF_convene_latin_congress_decision:0 "Convene the Latin Congress"
 FAF_convene_latin_congress_decision_desc:0 "We are a state for all great Latin peoples, and to make sure that our new great empire doesn't end up being dominated by the French, for example, we must make sure that every Latin brother in the empire gets their representation. To achieve this, we shall convene great Latin congresses where all Latin brothers get fair representation."
 FAF_coordinate_logistics_decision:0 "Coordinate Logistics"
 FAF_crack_down_on_corruption_decision:0 "Crack Down On Corruption"
 FAF_crack_down_on_corruption_decision_desc:0 ""
 FAF_create_bourbon_restoration_luxembourg_decision:0 "Restore Lowland Sovereignty"
 FAF_create_bourbon_restoration_portugal_decision:0 "Restore Portuguese Sovereignty"
 FAF_criox_de_fau_better_idea:0 "Croix-de-Feu"
 FAF_criox_de_fau_better_idea_desc:0 "When the Fascist spirit was born in Italy during the interwar period, many groups in France adopted it and introduced it to this foreign land. Yet none wielded it as effectively as the Croix-de-Feu under the wise leadership of La Roche. The Croix-de-Feu became an unifying force for French patriots and fighters. Although some of our citizens still harbor resentment toward them, in times like these, France needs unity and patriotism."
 FAF_criox_de_fau_idea:0 "Croix-de-Feu"
 FAF_criox_de_fau_idea_desc:0 "When the Fascist spirit was born in Italy during the interwar period, many groups in France adopted it and introduced it to this foreign land. Yet none wielded it as effectively as the Croix-de-Feu under the wise leadership of La Roche. The Croix-de-Feu became an unifying force for French patriots and fighters. Although some of our citizens still harbor resentment toward them, in times like these, France needs unity and patriotism."
 FAF_culmination_of_degaulle_petainist_thought_decision:0 "Embrace Gaullo-Pétainist Thought"
 FAF_culmination_of_degaulle_petainist_thought_decision_desc:0 "Both de Gaulle and Petain had honorable traits. Principles that allowed them to shine through in that dark era of French history. Times like these create division within our nation. If we only embrace one man's ideals, the other's supporters are surely to reek havoc. Only by accepting both groups can we ensure that unity is recreated within our nation."
 FAF_cult_of_loyalty_dummy:0 "French Militarism"
 FAF_cult_of_loyalty_dummy_desc:0 ""
 FAF_culture_war_idea:0 "Culture War"
 FAF_declare_readiness_for_war_decision:0 "Declare Readiness for War"
 FAF_demand_bourbon_restoration_italy_decision:0 "Restore the Italian Branches"
 FAF_demand_bourbon_restoration_luxembourg_decision:0 "Restore the Lowlands Branch"
 FAF_demand_bourbon_restoration_portugal_decision:0 "Restore the Portuguese Branch"
 FAF_demand_italian_unification_decision:0 "Demand [ITA.GetFlag] Italian Unification"
 FAF_demand_italian_unification_decision_desc:0 "A family is incomplete without all its members, and for the Roman family, Italy is an irreplaceable one. After all, where was the very concept of Rome born? Without Italy, our Rome would be incomplete—just another hollow imitation crafted by charlatans and impostors. Rome without Rome is like breakfast without coffee and a cigarette—it feels utterly wrong. That is why we must make the Italians see our vision. We Must.."
 FAF_demand_portuguese_unification_decision:0 "Demand [GOD.GetFlag] Portuguese Unification"
 FAF_demand_portuguese_unification_decision_desc:0 ""
 FAF_demand_spanish_unification_decision:0 "Demand [SNS.GetFlag] Spanish Unification"
 FAF_demand_spanish_unification_decision_desc:0 "To imagine, for a moment, that the beautiful scrubs and lushious woodland of Iberia were once part of our prosperous Roman Empire surely makes one filled with pride and joy. Yet it all feels so distant, in the far gone past which died with our forefathers. Us and the Spanish have had our difference throughout our shared history, but the blood which flows through our veins ultimately bonds us together. We were meant to be friends and brothers, not enemies. The Spaniards may have forgotten this, but we will remind them of it."
 FAF_demand_swiss_unification_decision:0 "Swiss Extermination"
 FAF_demand_swiss_unification_decision_tt:0 "§pWe must have 12 divisions in Franche-Comté§!"
 FAF_demand_unification_referendum_decision:0 "Demand Unification Referendum"
 FAF_demand_unification_referendum_decision_desc:0 ""
 FAF_demonish_cronyism_decision:0 "Demolish Cronyism"
 FAF_demonish_cronyism_decision_desc:0 ""
 FAF_dieu_veut_idea:0 "Dieu Veut"
 FAF_dieu_veut_idea_desc:0 "\n\n\n\n\n£GFX_FAF_deus_vult\n\n\n\n\n\n\n\nThe will of god and the will of the nation is behind us, and behind our soldiers. We fight for the righteous cause, a holy and divine cause. As our men march on, they should know that they, the people of France, are the greatest to have ever lived. As artillery roars and they face savage hordes in the East, they should know that they are following the spirit of our Lord. Dieu Veut!"
 FAF_dieu_veut_napoleon_idea:0 "Dieu Veut"
 FAF_dismantle_the_monopolies_decision:0 "Dismantle the Monopolies"
 FAF_dismantle_the_monopolies_decision_desc:0 ""
 FAF_divine_right_to_rule_decision:0 "The Divine Right"
 FAF_divine_right_to_rule_decision_desc:0 "\n\n\n\n\n£GFX_FAF_divine_right_to_rule\n\n\n\n\n\n\n\nAfter much deliberation we have come out on top in the hearts and minds of the people and the nobility, the House of Bourbon, rightful successors of House Valois, will again raise the banner of Holy France. Vive le Roi!"
 FAF_embelish_german_betrayal_decision:0 "The German Backstab"
 FAF_empower_bonapartists_tt:0 "§2This will empower the Bonapartists!§!"
 FAF_empower_latinists_tt:0 "§AThis will empower the Latinists!§!"
 FAF_empower_paneuros_tt:0 "§CThis will empower the Paneuropeans!§!"
 FAF_end_conservatism_decision:0 "End Right-Wing Liberalism"
 FAF_end_conservatism_decision_desc:0 ""
 FAF_enforce_imperial_language_decree_decision:0 "Imperial Language Decree"
 FAF_enforce_imperial_language_decree_decision_desc:0 "Italian, Spanish, and French—three distinct languages, yet all sharing the same roots: Latin. The mother of them all, now nearly forgotten and abandoned by her own children. Without a unified language, our Rome would become like the Tower of Babel—a hollow construction fueled by chaos and madness. Once more, Latin shall be the tongue of civilized men, of blood brothers, of Romans."
 FAF_espoir_d_independance_decision:0 "Aspose Our Independence"
 FAF_espoir_d_independance_decision_desc:0 ""
 FAF_establish_the_french_data_network_decision:0 "Establish the French Data Network"
 FAF_establish_the_french_data_network_decision_desc:0 ""
 FAF_eu_beauty_idea:0 "Virgin Lands of Europa"
 FAF_euro_navy_annexation_tt:0 "Through diplomatic negotiation, the European, Pacific and Atlantic Naval Commands are willing to join in our battle against Soviet Communist Hegemony."
 FAF_europa_united_against_communism_decision:0 "Europe Unified Against Communism"
 FAF_europa_united_against_communism_decision_desc:0 "Compared to any other ideology, Communism is the most antithetical to the identity of Europe as we know it. Baiting our workers with lies of prosperity, they only seek the destruction of the European identity in their never-ending crusade of a homogenous "equality" that seeks the destruction of our culture. Whether the hordes of the East have returned to the scourge of Bolshevism or not, their former ties could be tied to rising anti-Russian sentiment across Europe. Regardless, we might as well kill two birds with one stone to ensure that far-left radicals are purged from our society."
 FAF_europe_for_europeans_decision:0 "Europe for Europeans"
 FAF_europe_for_europeans_decision_desc:0 "Since the beginning of our movement, we've always stood on the idea that Europe should only be for Europeans. With our power now secured, we can finally turn this former rallying cry into a concrete policy that can help solidify our rule. Now that the radicals on the left, whether part of the Marxist or Liberal varieties, can no longer shout about "appeals to hatred" and a lack of "empathy" towards these foreign agents… It's time to live up to our promises!"
 FAF_european_ducat_idea:0 "European Ducat"
 FAF_european_ducat_idea_desc:0 ""
 FAF_european_ducat_stablized_1_idea:0 "European Ducat"
 FAF_european_ducat_stablized_1_idea_desc:0 ""
 FAF_european_ducat_stablized_idea:0 "European Ducat"
 FAF_european_ducat_stablized_idea_desc:0 ""
 FAF_european_nation_idea:0 "The European Hegemony"
 FAF_european_nation_join_tt:0 "We shall gain the idea §CEuropean Hegemony§!."
 FAF_europeanism_idea:0 "Europeanism"
 FAF_europeanism_idea_desc:0 "Europeanism calls for Europe to stand united whilst maintaining national identities and regional cultures. Europe divided cannot stand against global powers, a united armed forces allows us to reduce the number of weapons systems in use and with a common language, recruit across a continent of upwards a half billion."
 FAF_europeanist_propaganda_idea:0 "Pan-European Propaganda"
 FAF_europeanist_propaganda_idea_desc:0 "We have been subjected to a blitz of Pan-European propaganda across all forms of media, likely at the behest of the European Hegemony to push them towards unification. Regardless of whatever response we can muster, there is a sinking feeling that we may not be able to compete with our local Identitarian movement and could be forced to hold a referendum soon. If we wish to retain our independence, we need to do something to counter this propaganda immediately."
 FAF_europes_last_democracy_decision:0 "Europes Last Democracy"
 FAF_europes_last_democracy_decision_desc:0 ""
 FAF_failures_of_AH_dummy:0 "Quadrilingual Unification"
 FAF_family_f_decision:0 "Our Family!"
 FAF_family_f_decision_desc:0 "Family is everything, above all else. The holiest thing there is is the family structure. Only by upholding traditional family values and structure can France repopulate itself. The war has almost wiped out an entire generation of people. If we do not refresh our nation's lifeblood, we are doomed to putrefy and collapse."
 FAF_family_v_decision:0 "Our Family!"
 FAF_family_v_decision_desc:0 "How many families were devastated, separated, destroyed by this war? This righteous war, against a bloodthirsty enemy who want nothing more but to destroy our beautiful nation, our ancestral home Europe. From now on, we must protect our home, our family, our brothers."
 FAF_fascist_party:0 "PNF"
 FAF_fascist_party_long:0 "Parti Nationaliste Francais"
 FAF_fatherland_f_decision:0 "Our Fatherland!"
 FAF_fatherland_f_decision_desc:0 "Homeland, fatherland—the force that unites our people and makes us indivisible. Without it, its people are nothing; and without its people, it cannot exist. The two are bound together in a symbiotic relationship. If our people ever forget their fatherland, then the large family that was once our nation will be broken forever. Shattered to be taken over by foreign powers."
 FAF_fatherland_v_decision:0 "Our Fatherland!"
 FAF_fatherland_v_decision_desc:0 " What is it that our people fight for? Themselves? No. They fight for a common cause, a common belief, and a common goal. To protect and preserve that of which is dear to them. Their home, their land, their brothers. "
 FAF_fortify_the_nation_decision:0 "Fortify the Nation"
 FAF_fortify_the_nation_decision_desc:0 ""
 FAF_fountain_of_life_dummy:0 "French Militarism"
 FAF_fountain_of_life_dummy_desc:0 ""
 FAF_french_state_dummy:0 "French Militarism"
 FAF_french_state_dummy_desc:0 ""
 FAF_french_superiority_decision:0 "French Superiority"
 FAF_french_superiority_decision_desc:0 "French culture is among the most—if not the most—dominant cultures in the world. French ingenuity and creativity have brought our nation to the world stage. Throughout human history, France alone has stood as the center of art, technology, and literature. These undeniable facts only further prove our natural superiority over others, whether they are fellow Europeans or cultures from farther afield."
 FAF_french_terrorist_attacks_idea:0 "La Bête Francaise"
 FAF_french_terrorist_attacks_idea_desc:0 ""
 FAF_full_employment_idea:0 "Full Employment"
 FAF_full_employment_idea_desc:0 "Finally, after years of trial and error, we have achieved a national "Full Employment" rate among our people. In doing so, most of our citizens have found themselves in careers that ensure high living standards that push them to give their all to our nation and its economy. Of course, this has meant issues regarding our manpower pools for conscription and the complaints of businesses no longer able to take advantage of cheap foreign labor. But for our citizens and especially our propaganda, the achievement of having work for all is nothing to scoff at!"
 FAF_fund_identitarian_terror_in_ROM_decision:0 "Fund Terror in [ROM.GetFlag] §YRomania§!"
 FAF_fund_identitarian_terror_in_ROM_decision_desc:0 "Our Romanian brothers are once again in the palms of Russian imperialism. The Russian devils whisper their chants into their ears, playing with their minds, creating this false image of Slavic heritage in their psyche! However not all is lost. There are still loyal Latin brothers in Romania who identify themselves with their European family, and not the false Slavic one. We must aid them in spreading their message, so that one day they may return to our embrace."
 FAF_glorify_collaborationism_decision:0 "Glorify Collaborationism"
 FAF_glorify_collaborationism_decision_desc:0 "Collaborationists are always called traitors, rats, and dogs. But how can one be a traitor when one is working to rid his nation of a disease which is slowly killing it? When our people worked with the Germans during WW2, it was not to undermine our nation but to root out the Bolshevik menace. That is certainly no rat nor traitor, but a curer and a carer."
 FAF_god_on_our_side_decision:0 "God on our Side"
 FAF_grande_armee_dynamic:0 "Nouvelle Grande Armée"
 FAF_growing_republican_army_corps_mission:0 "The Everlasting Flame"
 FAF_growing_republican_army_corps_mission_desc:0 "\n\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\n\n\nIn a drab echo of our past, there exists a Republican Cliqué in our Armee. Hellbent on tearing down not just the King, but the rights of the Church as well. 1793 cannot come to pass again."
 FAF_hail_to_chief_dummy:0 "French Militarism"
 FAF_hail_to_chief_dummy_desc:0 ""
 FAF_hail_to_the_chief_decision:0 "Hail to the Chief!"
 FAF_hail_to_the_chief_decision_desc:0 "Leadership and clear structural organisation is key to stability and success. It is key in an Army's success, a corporation's function, even organised crime relies on it. As we emerged victorious through the anarchy that ravaged France, we have to rebuild this nation around a central figure, a political strongman who can unite his people and rally them for a common cause."
 FAF_healing_the_land_decision:0 "Healing the Land"
 FAF_healing_the_land_decision_desc:0 ""
 FAF_heir_of_degaulle_decision:0 "Embrace Gaullist Thought"
 FAF_heir_of_degaulle_decision_desc:0 " A man such as Charles de Gaulle needs no introduction. A bold statesman and political strongman, never once has he failed the French people and nation. When the Germans occupied our nation, crushed our national spirit, and enslaved our people, most politicians and generals gave in and accepted defeat, but not Charled de Gaulle. He would rather die fighting than live kneeling! Yet he was also a fair man, a just man. One who was democratically elected and honored the will of the French people. Only by helping our people embrace and accept his brave and honorable ideals, can we guide this nation towards the right path."
 FAF_heir_of_petain_decision:0 "Embrace Pétainist Thought"
 FAF_heir_of_petain_decision_desc:0 "There has never been a more controversial man in French history. Some argue Petain is a traitor while others believe that everything he did was to protect the French people. But none can argue that he was and still is our national hero. He left his marks in both Verdun and Vichy, not for his personal glory, but for the safety of the French nation and people. No matter what he did or did not do, he was a man of resolve, a man of great love for his people and his nation, a man who gave his all to fight against the red venom which sickened our nation. It is crucial that we teach our people the truth about this historic giant. They shall learn to embrace our traditional culture and values, and beware of the bolshevik menace."
 FAF_historical_idols_idea:0 "Historic Idols"
 FAF_historical_idols_idea_desc:0 "France has never lacked historical giants. From Charlemagne to Napoleon, our fertile land has produced some of the greatest figures in human history. Amidst this darkness, it is they who offer us a glimmer of hope. They embody a perfect France—a strong France—one that once ruled Europe and extended its influence around the globe. We may have lost this war, but after the new French greats replaced the old corrupt politicians that drove this country down the drain, France will blossom once more. They shall usher in a new French golden age."
 FAF_hold_military_parade_decision:0 "Showcase our Strength"
 FAF_hold_military_parade_decision_desc:0 "Our utter defeat in the Russo-European War devastated our nation not only physically, but also mentally. Our national psyche is steeped in defeat and devastation, leaving our people unwilling to fight. We must embolden the French people by reminding them that France remains a strong and powerful nation—one that does not fear its enemies and will not hesitate to protect her people."
 FAF_honest_french_middle_class_decision:0 "Our Honest People"
 FAF_honest_french_middle_class_decision_desc:0 "he French people embody the perfect image of god's creation. Honest, immaculate, and wise. It was these traits that made our nation prosper and great. The French have never wanted dominance over others, but to simply spread our ideals and culture."
 FAF_imperial_army_idea:0 "Imperial Army"
 FAF_imperial_army_idea_desc:0 ""
 FAF_implant_domestic_terrorists_decision:0 "Implant Domestic Terrorists"
 FAF_implant_domestic_terrorists_decision_desc:0 ""
 FAF_implement_policy_in_new_states_decision:0 "Spread the Green Word"
 FAF_implement_policy_in_new_states_decision_desc:0 "There was a time when the sacred trees of Athena thrived, and the summits of Olympus were adorned with ageless snow. But now the lands of Europa are shrouded in industry. Old-growth forests are dying under the clamor of machines, crystalline rivers are left cloudy with contaminants. The cradle of Western civilization is losing its sacred face to the ceaseless forward rush of modernity. But Europa's salvation is not in steel and concrete cities, but in the harmony between man and nature. We can only prove ourselves the guardians of ancient civilization when we again defend the beauty of nature with reverence. So this is our lot — the eternal hope of Europa."
 FAF_implement_transparent_public_procurement_decision:0 "Implement Transparant Public Procurement"
 FAF_implement_transparent_public_procurement_decision_desc:0 ""
 FAF_improve_gallarum_decision:0 "Rebuild §GGalliarum§!"
 FAF_improve_gallarum_decision_desc:0 "While Galliarum, referred to by most as Northern France, had the advantage of being our most developed region it was not spared by the horrors of the civil war. Already having encountered Russian bombardment during the war in the east, Galliarum has been incapacitated as the liberal and communist vultures pillaged it for all it had. Now that we have the resources to do so, we must begin the reconstruction of the entire region. Without it, not only will our industrial capabilities not be enough to unify our precious Europe, but it will ensure that subversives will be able to pray upon the struggles of our people to radicalize them into insurrection."
 FAF_improve_hispanarium_decision:0 "Rebuild §YHispanarium§!"
 FAF_improve_hispanarium_decision_desc:0 "Our reunification with our brothers south of the Pyrenees has meant that we have inherited the damage of their second civil war. Compared to our brothers in France and Italy, we must understand that reconstruction must take into account the multitude of regional identities throughout the territories of Spain, and not replicate our mistakes in the Peninsular War. While it may take a substantial effort, we shall spare no less for any fellow descendant of Rome!"
 FAF_improve_italiae_decision:0 "Rebuild §RItaliae§!"
 FAF_improve_italiae_decision_desc:0 "Once the beating heart of Europe. Once the beacon of hope that brought about a golden age of progress, enlightenment and prosperity. But ever since the fall of the Western Roman Empire in the 5th century, Italy has never truly recovered the splendour it once held in antiquity. Thus, it is up to us to rebuild the peninsula, free from the failures of a decrepit liberal democracy, so that it can finally recover the heights that would make even Augustus blush. They say Rome wasn't built in a day, but if its glory still shines eternal then our efforts will be given the time and attention needed to continue that legacy."
 FAF_improve_viennensis_decision:0 "Rebuild §OViennensis§!"
 FAF_improve_viennensis_decision_desc:0 "For the region where Caesar began his civilization of the Gauls, Viennensis (more colloquially referred to as Southern France) had long struggled even before the civil war tore our nation asunder. Lacking much of the economic development that our north has, these regions struggle with poverty and thus have become hotbeds for radicals that wish to throw our nation into chaos once again. As it is our duty to the people of our beloved France, we must undertake a mass revitalization effort to ensure that Viennensis will rise like a phoenix from the ashes!"
 FAF_increase_rail_lines_decision:0 "Rapid Railway Expansion"
 FAF_increase_soldier_benefits_decision:0 "Increase Soldier Benefits"
 FAF_increase_soldier_benefits_decision_desc:0 ""
 FAF_increase_the_military_budget_decision:0 "Increase The Military Budget"
 FAF_increase_the_military_budget_decision_desc:0 ""
 FAF_indoctrinate_youth_dummy:0 "French Militarism"
 FAF_indoctrinate_youth_dummy_desc:0 ""
 FAF_integrate_ai_into_governance_decision:0 "Integrate AI into Governance"
 FAF_integrate_ai_into_governance_decision_desc:0 ""
 FAF_invade_vatican_decision:0 "Defy the Papal States"
 FAF_invading_balkans_tt:0 "§YThis Focus will give wargoals on all Balkan nations.§!"
 FAF_investigate_radical_officers_decision:0 "Investigate Radical Officers"
 FAF_investigate_radical_officers_decision_desc:0 ""
 FAF_invite_moderate_gaulists_decision:0 "Invite Moderate Gaullists"
 FAF_invite_moderate_gaulists_decision_desc:0 ""
 FAF_invite_opposition_parties_decision:0 "Invite Opposition Parties"
 FAF_invite_opposition_parties_decision_desc:0 ""
 FAF_invite_states_to_the_european_nation_decision:0 "Invite to the European Nation"
 FAF_invite_states_to_the_european_nation_decision_desc:0 "Whether through their own means or earlier political pressure from us, we are lucky to find that [insert nation] is already sympathetic to our cause, and we need not worry about forcing their hand to join our continental union. Seeing as our relations are at an all-time high, we shall send them a polite invitation to the people of [insert country] to join their brothers in the European Hegemony!"
 FAF_involuntary_repatriation_law:0 "Involuntary Repatriation"
 FAF_involuntary_repatriation_law_desc:0 ""
 FAF_kill_bardella_tt:0 "§RLet's see if they land on their feet§!"
 FAF_kill_benedetti_tt:0 "§RLet's turn his world upside down§!"
 FAF_kill_conservatism_tt:0 "§RThey've always been figuratively spineless, but we'll make it literal§!"
 FAF_kill_juntists_tt:0 "§RNo more German lapdogs in France§!"
 FAF_kill_villiers_tt:0 "§ROne less pawn of the old order§!"
 FAF_lafayette_coup_tt:0 "§REnough of this clown show. It's MY turn now.§!"
 FAF_lafayette_death_cult_idea:0 "Cult of the Supreme Marshal"
 FAF_lafayette_resistance_idea:0 "The Rising Flame"
 FAF_language_of_the_state_dummy:0 "Quadrilingual Unification"
 FAF_latin_conscription_law:0 "Roman Conscription"
 FAF_latin_conscription_law_desc:0 ""
 FAF_latin_military_integration_law:0 "Heroes of the Empire"
 FAF_latin_military_integration_law_desc:0 ""
 FAF_launch_domestic_terrorists_decision:0 "Launch Phase Un in [FROM.GetName]"
 FAF_launch_domestic_terrorists_decision_desc:0 ""
 FAF_launch_enemy_explosive_depots_decision:0 "Launch Phase Trois in [FROM.GetName]"
 FAF_launch_enemy_explosive_depots_decision_desc:0 ""
 FAF_launch_sabotage_rail_decision:0 "Launch Phase Deux in [FROM.GetName]"
 FAF_launch_sabotage_rail_decision_desc:0 ""
 FAF_lead_to_war_with_spain_tt:0 "This will lead to §Rwar§! with §Y[SPR.GetFlag] The Kingdom of Spain§!, §R[BAR.GetFlag] the Barcelona Anarchist Collective§!, §p[RSR.GetFlag] Republican Spain§!, and §YPOSSIBLY§! §8[SNS.GetFlag the Spanish National State§!."
 FAF_legalize_paganism_decision:0 "Encourage Paganism"
 FAF_legalize_paganism_decision_desc:0 "Christianity is an abnormality. It was not a French creation, in fact not even a European one. It is the cancer which spreads uncontrollably and at an inconceivably swift pace. So much so that it drove out our ancestral and native beliefs. It made the French people forget who they truly are! Forget their roots! Their heritage! That is why we must bring back the truly French religions, the ones that define our people as Gaul, and not as "Christians"."
 FAF_less_than_human_law:0 "Less than Human"
 FAF_less_than_human_law_desc:0 ""
 FAF_liberal_crackdown:0 "Liberal Crackdown"
 FAF_liberal_crackdown_desc:0 "In order to ensure our new administration can be established, we need to crack down on subversive elements. Particularly, sympathizers of the former regime and its decadent liberal democracy have been protesting our every action and grinding our country to a halt. To prevent any sort of counter-revolution, we need to use any means necessary to finally crush the political potency of liberalism in France, and ensure we do not return to the failings of the former Republic."
 FAF_man_of_god_decision:0 "Man of God"
 FAF_man_of_god_decision_desc:0 "\n\n\n\n\n£GFX_FAF_man_of_god\n\n\n\n\n\n\n\nThe King is a pious ruler, as pious as he is pragmatic and benevolent, guided as much by God as he is by the good of the people. He is a man, imperfect, but eternally grateful for the forgiveness of God, as all should be."
 FAF_managerial_bilingualism_decision:0 "Managerial Bilingualism"
 FAF_managerial_bilingualism_decision_desc:0 "One of the main justifications for our Latin revival is the concept that when we unify the peoples of Europe, it can act as a lingua franca that despite our differences can ensure smooth governance. With this in mind, we need to ensure that our managerial classes that take up bureaucratic duties are at least bilingual in both their native tongue and Latin. Besides, are we not hypocrites if we do not use the language of our prized Roman ancestors ourselves?"
