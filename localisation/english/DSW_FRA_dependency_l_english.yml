 FRA_Catherine_Colonna_FM:0 "Catherine Colonna"
 FRA_Catherine_Colonna_FM_desc:0 "Catherine Colonna, born on March 17, 1956, is a French diplomat and politician. She has served in various diplomatic roles, including as the Ambassador of France to the United Kingdom from 2017 to 2021. Colonna has also held positions within the French government, serving as Minister for European Affairs from 2004 to 2005 under President Jacques Chirac. She has been involved in shaping French foreign policy, particularly in relation to Europe, and is known for her diplomatic skills and expertise. Colonna's career has been marked by her commitment to promoting French interests abroad and strengthening European cooperation."
