 FAF_Charles_Emmanuel_of_Bourbon_Parma_HM:0 "Charles Emmanuel of Bourbon-Parma"
 FAF_Charles_Gave_EM:0 "Charles Gave"
 FAF_Charles_Prince_Napoleon_IM:0 "Charles, Prince Napoleon"
 FAF_Christine_Tasin_FM:0 "Christine Tasin"
 FAF_Create_Identity_Forums:0 "Create Identity Forums"
 FAF_Create_Identity_Forums_desc:0 "The Roman forums were a center for intellectuals to discuss science, philosophy, and more. France also has been a nation of intellectuals and as such we must revive our intellectual culture and create forums for the new nationalist thought."
 FAF_Cult_of_Benedetti:0 "Formulate the Cult of Benedetti"
 FAF_Cult_of_Benedetti_desc:0 "Benedetti will not only be a strong leader leading a broken nation but also the symbol of the new French era. Every French man, woman, and child will view Benedetti as the symbol of the French phoenix rising from the ashes of neoliberal degeneracy and defeat."
 FAF_Damien_Rieu_HM:0 "Damien Rieu"
 FAF_Daniel_Conversano_FM:0 "Daniel Conversano"
 FAF_Disregard_Secularism:0 "Disregard Secularism"
 FAF_Disregard_Secularism_desc:0 ""
 FAF_Disrupt_Benedetti:0 "Disrupt Benedetti"
 FAF_Disrupt_Benedetti_desc:0 "Benedetti, Benedetti. Naught is he but another fascist trying to model himself off of failed states long gone. His cultural thought of ‘France’, as a singular nation, as an ethnostate, is idiocy at its finest form. Anything he has planned - be it a speech, propaganda, anything and everything, should be hidden away or corrupted in other manners, to not let his corrupted, rotting ideals spread across our multinational nation."
 FAF_EUB_dummy:0 "Virgin Lands of Europa"
 FAF_EUB_green_classicalism:0 "Virgin Lands of Europa"
 FAF_EUB_green_white_dummy:0 "Virgin Lands of Europa"
 FAF_EUN_army_of_purity_dummy:0 "The European Hegemony"
 FAF_EUN_army_of_purity_dummy_desc:0 "As Identitarians, our movement differs from the usual far-right continuum across Europe by supporting continental unification rather than the mere nations that comprise it. Seeing the European Union's implosion at the hands of  the eastern hordes, an opportunity to fill the power vacuum and stand as Europe's hegemon has arrived. While it may cost us politically to maintain our influence, being the new center of the continent is essential to ensure that we triumph over the forces of  multiculturalism, liberalism, and the forces that seek to destroy our beloved Europe!"
 FAF_EUN_dummy:0 "The European Hegemony"
 FAF_EU_end_federalization_campaign_decision:0 "Preempt European Federalization"
 FAF_EU_federalization_tt:0 "Upon starting §YPush for Continental Unification§!, all countries within the §CEuropean Hegemony§! will be given the choice to federalize. \n§GHigher relations§! will lead to a §Chigher likelihood of annexation.§!"
 FAF_EU_unification_campaigns_idea:0 "Hegemonic Unification Campaign"
 FAF_EU_unification_campaigns_idea_desc:0 "In our crusade to unite all of Europe, we must take into account that our unification is different from the ones posed by the former Federalists of the European Union. Our campaign centers around forming a {{color|cyan|European Hegemony}} that seeks to unite the continent but under a hegemony that protects its people and cultures rather than extracting wealth for technocratic elites. For the next year, we have dedicated vast resources to ensure this campaign will succeed and allow us to rid the continent of all foreign influence!"
 FAF_Enforce_Edict_of_Paris:0 "Enforce the Edict of Paris"
 FAF_Enforce_Edict_of_Paris_desc:0 "To do away with the decadence and disorder of liberal democracy, we have found ourselves returning to traditional law and customs. In particular, the Edict of Paris, while stemming from 7th-century Merovingian legislation, balances the powers of church and state while ensuring both maintain their power. In order to further establish our administration we can once again enforce this Edict in French law, while ensuring that it is updated to keep up with modern issues and economics."
 FAF_Engie_Bills_idea:0 "Engie Bills"
 FAF_Engie_Bills_idea_desc:0 "The Engie Bills are a system of loans and debt-taking that will allow France to remilitarize without the hawkish eyes of foreign powers intervening or looking in. Similar to the MEFO bills used by Germany to reindustrialize their nation, they are a costly and duplicitous maneuver - one that is not likely to last forever. However, no matter the end, they are what is necessary for France to be reborn as a genuine power on the world stage once more."
 FAF_Enshrine_the_Rights_of_Man:0 "Enshrine the Rights of Man"
 FAF_Enshrine_the_Rights_of_Man_desc:0 "In 1798, our ancestors cast off the terror and barbarism of the Ancien Regime and set out to create a guideline for the newly freed people of France. This document, known as The Declaration of the Rights of Man and of the Citizen, still holds a place in the most recent constitution of the Fifth Republic. As we rebuild governmental legitimacy, not enshrining these rights would be foolish!"
 FAF_Fabrice_Robert_IM:0 "Fabrice Robert"
 FAF_Fascist_Paramilitaries_idea:0 "Fascist Paramilitaries"
 FAF_Fascist_Paramilitaries_idea_desc:0 "A network of fascist paramilitaries enforces loyalty to the regime, acting with impunity across France. Their brutal methods suppress dissent but breed resentment among civilians. Despite this, their sheer capacity to ensure control is one that our nation needs."
 FAF_Fascist_Paramilitaries_tt:0 "This will spawn §C3 green Militia§! divisions."
 FAF_Fascist_Revolts:0 "Fascist Riots"
 FAF_Fascist_Revolts_desc:0 "Whether through events that are occurring across Europe or due to a set of policies passed by our government, the Fascists of our country are currently rioting against our government. While we don't expect these to last forever, we may need to reconsider our current course of governance lest we incur their wrath any further!"
 FAF_Force_Padanian_Referendum_decision:0 "Force [LOM.GetFlag] §GPadanian Referendum§!"
 FAF_Force_Padanian_Referendum_decision_desc:0 ""
 FAF_Formulate_Latinism:0 "Formulate the New Doctrine of Latinism"
 FAF_Formulate_Latinism_desc:0 "Latinism as an ideology has always been something that is rather spread apart and incoherent. We must make it something that is entirely united and single-minded, akin to a hive mind of an ideologeme. Should we not, the dream of a new Rome may be tarnished forevermore."
 FAF_Full_Fascist_Control_idea:0 "One-Party State"
 FAF_Full_Gaullist_Influence_idea:0 "New Republic"
 FAF_Full_Latinist_Control_idea:0 "One-Party State"
 FAF_Full_Petainist_Control_idea:0 "One-Party State"
 FAF_George_Kuzmanovic_EM:0 "George Kuzmanovic"
 FAF_Glorify_Jeanne_dArc:0 "Glorify Jeanne d'Arc"
 FAF_Glorify_Jeanne_dArc_Monarchist:0 "Glorify Jeanne d'Arc"
 FAF_Glorify_Jeanne_dArc_Monarchist_desc:0 ""
 FAF_Glorify_Jeanne_dArc_desc:0 ""
 FAF_Glorify_Maurras:0 "Glorify Charles Maurras"
 FAF_Glorify_Maurras_desc:0 ""
 FAF_Glorify_Vichy_Stability:0 "Glorify Vichy Stability"
 FAF_Glorify_Vichy_Stability_Mon:0 "Glorify Vichy Stability"
 FAF_Glorify_Vichy_Stability_Mon_desc:0 ""
 FAF_Glorify_Vichy_Stability_desc:0 "The public image of the former French State has been tainted by accusations of "German collaboration" by many biased historians, but there is one way we can redeem its legacy among the people of France. Seeing as it is something that in the chaos of the 21st century many seek, emphasizing the stability of the former Vichy regime can help our people see that our goals are far beyond simply capitulating to German fascists."
 FAF_Glorify_the_Imperial_Era:0 "Glorify the Imperial Era"
 FAF_Glorify_the_Imperial_Era_desc:0 "There is nothing better than a great continent spanning empire, its people, its culture, its cities, all united together under one flag and one ideology. Many times we were so close to this, to accomplishing this utopia and yet were denied it over and over again. This is will be our final and most determined attempt for what we have so long dreamed for, and we will relish in glory once it is accomplished."
 FAF_Golden_Franc_idea:0 "The Franc"
 FAF_Golden_Franc_idea_desc:0 "After years of globalist subjugation, we have finally brought back our beloved Franc. While having complete control over our nation's finances has been a boon for our economy, we have needed our industries to take up their patriotic duty to cover for the former cheap labour pool the Eurozone once provided."
 FAF_Grant_Refuge_to_HRM:0 "Familial Refuge"
 FAF_Grant_Refuge_to_HRM_desc:0 "\n\n\n\n\n£GFX_FAF_spanish_royalty\n\n\n\n\n\n\n\nOur family in Spain, the rightful Bourbon rulers of our southern neighbor, are under siege from all manner of adversaries, Anarchists, Secessionists, Nationalists, Republicans. It would be wrong to leave them to a Guillotine, we Bourbons have had too many encounters with that horrible contraption."
 FAF_Guillaume_Cuvelier_IM:0 "Guillaume Cuvelier"
 FAF_Harness_Federalist_Sympathizers:0 "Harness Federalist Sympathizers"
 FAF_Harness_Federalist_Sympathizers_desc:0 "Many officials in the previous fragile and weak government that we succeeded had sympathies for our movement, and with our movement empowered, these former officials can make up for their previous inaction and disgraces by helping us now."
 FAF_Hexagon_tt:0 "§YWe shall deal with the [BEL.GetFlag] Belgians at a later point...§!"
 FAF_Honor_Vichy:0 "Honor the Vichy Regime"
 FAF_Honor_Vichy_desc:0 "Marshal Pétain was a hero who guided the French people under our most turbulent era, yet after decades of forced rule under neoliberal regimes has the glory of Vichy heroes been slandered. The sacrifices made by the brave men must be remembered by the French people."
 FAF_Honor_and_Glory_idea:0 "Honneur et Gloire"
 FAF_Imperial_Palace_idea:0 "The Imperial Palace"
 FAF_Imperial_Palace_idea_desc:0 "The Palace is a sign of stability, of wealth and prosperity. A symbol of France and her monarchy, the sign that it shall last for eons to come. It is a gaudy display of our wealth and of our power over the continent, the diamond upon her ring."
 FAF_Imperialist_Sympathies:0 "Imperial Sympathies"
 FAF_Italian_Unification_decision:0 "[ITA.GetFlag] §GItalian§! Alignment"
 FAF_Italian_Unification_decision_desc:0 ""
