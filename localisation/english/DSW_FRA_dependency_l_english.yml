 The_French_Socialist_Republic_Path_1_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Revolutionary_French_State  §dJacobins§!"
 The_French_Socialist_Republic_Path_1_TXT_DESC:0 "The nation is renamed to the French Revolutionary Republic. The ideology is Jacobinism.\n\n\n\n\n\n\n\n   £GFX_FPR_Antoine_Leaument\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RRequires:§!\n§pNew Popular Front§! wins the 2022 French elections."
 The_French_Socialist_Republic_Path_2_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Federated_Republic_of_Europe  §RTrotskyists§!"
 The_French_Socialist_Republic_Path_2_TXT_DESC:0 "The ideology is Trotskyism.\n\n\n\n\n\n\n\n£GFX_Natalie_Arthaud   £GFX_5th_int\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RRequires:§!\n§pNew Popular Front§! loses the 2022 French elections."
