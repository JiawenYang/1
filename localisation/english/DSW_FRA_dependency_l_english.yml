 FRA_Edouard_philippe_HM:0 "Édouard Philippe"
 FRA_Edouard_philippe_HM_desc:0 "Édouard Philippe, born on November 28, 1970, is a French politician and lawyer who served as the Prime Minister of France from May 15, 2017, to July 3, 2020, under President Emmanuel Macron. He was a member of The Republicans (LR) before becoming an independent. Philippe was known for his pragmatic approach to governance and his ability to navigate complex political landscapes. During his tenure, he faced significant challenges, including the Yellow Vest movement and the COVID-19 pandemic. Philippe's leadership style was often characterized as calm and measured, earning him respect from across the political spectrum. "
