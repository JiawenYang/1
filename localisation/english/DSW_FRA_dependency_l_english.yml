 FRA_welfare_payments_desc:0 "With the strengthening of the already harsh lockdown mandates the French people have had their daily livelihoods and occupations temporarily removed from them. But now it seems that we are not in sight of the end of this pandemic for the foreseeable future. With this, the responsible choice for our government is to aid the French people through these hardships and lift them back onto their feet until the eventual reopening of our Nation. "
