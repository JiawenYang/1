 FRA_Oil_Crisis:0 "Oil Crisis"
 FRA_Oil_Crisis_countdown:0 "Until this focus is taken, the Oil Crisis §RWill not be dealt with§!"
 FRA_Oil_Crisis_desc:0 "With the Saudi-Arabian Civil War, the Arabian Peninsula has lost what borrowed stability it had achieved prior and thrust the sub-continent into even further insecurity and instability across the region. The immediate conclusion to the civil war does not seem imminent and the effects are being felt immediately. The possibility of getting oil through another party is not currently within our reach as both Russia and Venezuela are currently embargoed by Western Nations and would hurt our international image to circumvent these embargos. Until we can secure a reliable source of oil we will continue to suffer the effects of the Saudi's conquest for power. "
