 FAF_nuke_stalingrad_decision:0 "Deploy §RTactical Nuke§! on §YStalingrad§!" 
 FAF_one_million_man_army_decision:0 "One Million Man Army"
 FAF_one_million_man_army_decision_desc:0 "One million soldiers! ONE GODDAMN MILLION SOLDIERS! Men who are willing to die and fight for their country. Boys who would shed their blood for their land and people without a question in their mind. With a mighty army such as this, the French people can rest assured that their country can keep them safe."
 FAF_operation_baku_decision_idea:0 "§HOPERATION:§! BAKU"
 FAF_operation_charles_decision:0 "Operation §YCharles§!"
 FAF_operation_lothair_decision:0 "Operation §YLothair§!"
 FAF_operation_louis_decision:0 "Operation §YLouis§!"
 FAF_operation_powderkeg_decision_idea:0 "§HOPERATION:§! POWDERKEG"
 FAF_oui_oui_oui_decision:0 "§COui! Oui! Oui!§!"
 FAF_oui_oui_oui_decision_desc:0 "Say yes to war! Say yes to sacrifice! Say yes to victory! Our defeat in the Russo-European War has caused our people to forget what once made us a glorious and powerful nation, so we must remind them of it. By guiding them forward, we will teach them how to think and how to act—not only for their own sake, but also for our national revival."
 FAF_our_ancestral_battlefield_decision:0 "Our Ancestral Battlefields"
 FAF_our_ancestral_battlefield_decision_desc:0 ""
 FAF_our_french_mothers_decision:0 "Idolize Jeanne d'Arc"
 FAF_our_french_mothers_decision_desc:0 "Bravery is the noblest trait one can possess. The French embodiment of bravery is Jeanne d'Arc. She fought with greater courage than the men in her ranks. She did not cry or scream when degenerates and traitors burned her alive under false pretenses. She battled her enemies with all her might, never backing down, never faltering. She stands as an idol for all of France to hold dear. All our men—our soldiers—must strive to be like Jeanne d'Arc, fighting fiercely with fiery passion and unyielding loyalty."
