 FAF_protect_economic_interests_decision_desc:0 ""
 FAF_provoke_french_opposition_decision:0 "Provoke French Opposition"
 FAF_provoke_french_opposition_decision_desc:0 "What is the best way to bring ourselves into the limelight while bashing the opposition? Making them look bad of course. How? It's quite simple really, the oldest trick in the book of politics. We will bait them with ambiguous insults while they in anger make a fool out of themselves."
 FAF_purge_minorities_tt:0 "§RThis focus will launch ''Opération: Propreté'', and will cause an undeniable tragedy to befell France.§!"
