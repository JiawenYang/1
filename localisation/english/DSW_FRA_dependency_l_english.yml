 LE_PEN_LOSS_AI_BEHAVIOR_TXT_DESC:0 "After completing the \"Opening Volley\" focus, §3Marine Le Pen§! will be sided with, and will lose the 2022 election to §OEmmanuel Macron§!. Afterwards, §3Le Pen§! steps down as the president of the National Rally, and §3Jordan Bardella§! becomes the new leader.\n\n\n\n\n\n\n\n   £GFX_FRA_emmanuel_macron\n\n\n\n\n\n\n\n\n-------------------------------------"
