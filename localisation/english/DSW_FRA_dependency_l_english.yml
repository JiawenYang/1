 MACRON_LOSS_AI_BEHAVIOR_TXT_DESC:0 "After completing the \"Opening Volley\" focus, §OEmmanuel Macron§! will be sided with, and will lose the 2022 election to §PMarine Le Pen§!. Afterwards, §OMacron§! retires from politics and hands over leadership of the Renaissance party to §OStéphane Séjourné§!.\n\n\n\n\n\n\n\n   £GFX_FRA_marie_le_pen\n\n\n\n\n\n\n\n\n-------------------------------------"
