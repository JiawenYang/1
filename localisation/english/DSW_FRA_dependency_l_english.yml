 FRA_Bring_Back_Villiers_desc:0 "The Général d'armée, Pierre de Villiers holds both superiority and political leverage against the Forces Armées Françaises general staff and is willing to collaborate with us in attempt to calm down their despotic rhetoric."
 FRA_Bring_them_Home:0 "Bring Americans Back"
 FRA_Bruno_le_Maire_EM:0 "Bruno Le Maire"
 FRA_Bruno_le_Maire_EM_desc:0 "Bruno Le Maire, born on April 15, 1969, is a French politician who has held several ministerial positions in the French government. He is a member of the political party The Republicans (LR) and has been the Minister for the Economy, Finance, and the Recovery since 2017 under President Emmanuel Macron. Le Maire is known for his expertise in economic and financial matters and has played a key role in shaping France's economic policies. He has been involved in efforts to reform the French economy, promote investment, and strengthen France's position in the European Union. Le Maire is seen as a prominent figure in French politics and has been a strong advocate for economic reforms and European integration."
