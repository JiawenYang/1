 The_French_Socialist_Republic_Path_3_TXT_DESC:0 "The nation is renamed to the French Anarchist Collective. The ideology is Anarcho-Communism.\n\n\n\n\n\n\n\n   £GFX_julien_coupat\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_French_Socialist_Republic_Path_Didier_Daeninckx_TXT:0 "§tDaeninckx§!"
 The_French_Socialist_Republic_Path_Didier_Daeninckx_TXT_DESC:0 "The ideology is Democratic Socialism.\n\n\n\n\n\n\n\n   £GFX_Didier_Daeninckx\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RRequires:§!\nThe constitutional referendum of the Sixth Republic passes \"§tRadical Constitution§!\"."
 The_French_Socialist_Republic_Path_TXT_DESC:0 "\n\n§RRequires:§!\n§8Liberal Democratic Party of Russia§! wins the Russian Elections.\nNATO loses the European War."
 The_French_Socialist_Republic_Path_melenchon_TXT:0 "§tMélenchon§!"
 The_French_Socialist_Republic_Path_melenchon_TXT_DESC:0 "The ideology is Eurocommunism.\n\n\n\n\n\n\n\n   £GFX_Leninchon\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RRequires:§!\nThe constitutional referendum of the Sixth Republic did not choose \"§tRadical Constitution§!\"."
 The_Government_of_National_Defense_Democratic:0 "£GFX_TFR_game_rule_flag_FAF_French_Republic  §OFreedom§!, §YConservatism§!, §3Patriotism§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT:0 "§ODemocratic Movement§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT_DESC:0 "Democratic Movement, a centrist party that has existed since before the fall of France to the soviets. Aligning itself as the reasonable and sensible option, it moves forward with a much more centrist and liberal view than either of the parties that it competes against.\nThe ideology is §OChristian Democracy§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Bayrou\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT:0 "§3National Conservative Union§!"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT_DESC:0 "National Conservative Union - an odd hodge-podge of conservative and military values. They stand themselves as a much more patriotic conservative party than LR, thinking of themselves as the true continuation of the dream of Villiers and De Gaulle, of a traditionalist, patriotic France.\nThe ideology is §3Populist Gaullism§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Stephane_Ravier\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_Republicain_TXT:0 "§YLes Republicain§!"
 The_Government_of_National_Defense_Democratic_Republicain_TXT_DESC:0 "Les Republicains, the forerunner in most people's minds, is a movement nearly identical to the National Rally before it - a conservative movement looking to bring back the traditional values of France while maintaining the democratic system and balance of power.\nThe ideology is §YTraditional Gaullism§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Xavier_Bellamy\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_TXT_DESC:0 "First Election of the New Republic.\n\n\n\n\n\n\n\n   £GFX_Pierre_De_Villiers\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§RRequires:§!\n§gGovernment of§! §aNational Defense§! Path choose §3Democratic Government§!."
