 FRA_lockdown:0 "National Lockdown"
 FRA_lockdown_desc:0 "To deal with the overwhelming spread of the COVID-19 pandemic within the country, we've put the entire country under lockdown orders to help mitigate the current infection rates. While effective, such measures mean that our population has to remain at home, social distance, and constantly wear masks and sanitize under public health guidelines. Such guidelines also mean many citizens can't go to work, and discontent may soon bubble out of control unless we reopen the country as fast as possible."
