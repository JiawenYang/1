 FAF_propaganda_campaign_in_Romania_decision:0 "Propagandize [ROM.GetFlag] §YRomanian Latinism§!"
 FAF_propaganda_campaign_in_Romania_decision_desc:0 "Romanians may not be the first to come to mind when discussing Roman heritage, yet the truth is they are just as Roman as we French. The Romanian language evolved from Vulgar Latin, and their people share a proud Roman ancestry. However, due to their geographical location, it was inevitable that they would be infected by the Slavic virus, diluting what once made them a great and powerful people. Still, the blood that flows through the Romanians remains the same—they simply need to be reminded of their roots."
