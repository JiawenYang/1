 FRA_Reforming_Civil_Services_anti_corruption_idea:0 "Bastion against Corruption"
 FRA_Reforming_Civil_Services_anti_corruption_idea_desc:0 "With the comprehensive overhaul of the Civil Service we are reaping the current benefits of reforms being passed by our governance. Striving to achieve lower corruption, and accountability among other things, it is self-evident that the end result of these reformations will help France achieve its current goals of modernizing the administrative capabilities of the nation of France and appease the government body pushing for these reforms."
