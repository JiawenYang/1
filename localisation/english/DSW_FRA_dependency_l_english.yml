 ENG_old_entente_reaffirmed_tt:0 "§YThis will tie us into a defensive alliance with the§! [FAF.GetFlag] §3French§!§Y against any future [GER.GetFlag] §!§RGerman Aggression§!"
 Euro_Collapse_idea:0 "Economic Collapse"
 Euro_Collapse_idea_desc:0 "The downturn of the French economy was inevitable. Enormous war reparations and a generation of citizens lost to war have sent this country down the drain, and recovery will undoubtedly take a long time. The situation for France seems dire, but have faith that our people shall overcome like they have so many times before."
 FAF_Academic_Latinization_decision:0 "Academic Latinization"
 FAF_Academic_Latinization_decision_desc:0 "As much as we can declare that our people "must learn Latin for the good of Europe" and that they will do their patriotic duty, this process will be difficult with the current state of education. Beyond language studies, courses that properly teach Latin are non-mandatory, and curriculums are based around regional languages that give less incentive to learn the language beyond a basic level. While it will require a massive academic overhaul, we must assemble our best Latin scholars to help draft a new curriculum that ensures that Latin is thoroughly taught and utilized by our people. Most importantly, if the youth are our future then such a system means that it may only take a few decades until Latin is commonplace in Europe once again!"
 FAF_Alain_Escada_IM:0 "Alain Escada"
 FAF_Alexandre_Gabriac_HM:0 "Alexandre Gabriac"
 FAF_Ally_Caucasian_Islamists_tt:0 "§YThis will unlock decisions to fund Caucasian Islamists§!"
 FAF_An_Economy_From_Nothing:0 "An Economy From Nothing"
 FAF_An_Honour_to_Serve:0 "An Honour to Serve"
 FAF_An_Honour_to_Serve_Mon:0 "An Honor to Serve"
 FAF_An_Honour_to_Serve_Mon_desc:0 ""
 FAF_An_Honour_to_Serve_desc:0 "Our people must realize that the French legacy is one of service and sacrifice. From those ancient days under the Franks and Charlemagne to Napoleon's conquests of Europe, the French legacy is that of the military and the honor of serving in it. Propaganda must emphasize this tradition, especially as we prepare for another crusade against the hordes of the East!"
