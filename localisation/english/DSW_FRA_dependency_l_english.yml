 FAF_unification_with_the_lowlands_decision_tt:0 "§pWe must have 12 divisions in Pas de Calais§!"
 FAF_use_wealthy_connections_decision:0 "Use Wealthy Connections"
 FAF_use_wealthy_connections_decision_desc:0 "Our ties to the French elite mean we have the unique benefit of pulling in favors to help out our national projects. At the cost of owing a noble a favor, we can expand our production for a time, a worthwhile trade."
 FAF_wiped_the_slate_of_opposition_tt:0 "The §ROpposition to Lafayette§! have been purged from the country"
 FAF_word_of_the_bishop_decision:0 "Word of the Bishop"
 FAF_word_of_the_bishop_decision_desc:0 "Throughout European history, the papacy has played our people and rulers like a fiddle. Using Christian faith as an invisible weapon to shape Europe into a twisted image of its former self. No longer will we shed our blood in the name of a fictional god. The pope shall become our choir boy and sing our praising songs."
 FAF_work_f_decision:0 "Our Work!"
 FAF_work_f_decision_desc:0 "Work must and has to be done. Labour is the only form of action which always produces positive results. Bricks won't lay themselves. Roads won't pave themselves. Crops certainly won't grow on their own. Only with the sweat and blood of our people can this once glorious nation of ours be rebuilt."
 FAF_work_v_decision:0 "Our Work!"
 FAF_work_v_decision_desc:0 "Our nation was destroyed and left in utter devastation by the Russian horde. Much work remains to be done to rebuild all that was reduced to dust beneath their iron boots. Our national spirit is still waiting to be uplifted, and our people are still waiting to be fed. Now, more than ever, we must dedicate ourselves to the monumental task of restoring our homeland."
