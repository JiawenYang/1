 FRA_ENA_Funds_idea:0 "Spreading the Dough"
 FRA_ENA_Funds_idea_desc:0 "As the general deconstruction of the École nationale d'administration commences the funding previously designated for the administration now has the opportunity to be reallocated to broader administrative reforms such as the education system and more institutional systems. While the reallocation is being processed the newly freed up resources will be circulated into the economy to further assist in modernization of the nation."
 FRA_ENA_Suspended_idea:0 "ENA Suspended"
 FRA_ENA_idea:0 "École nationale d'administration"
 FRA_ENA_idea_desc:0 "Founded by Charles de Gaulle in 1945, the ENA was meant to democratize access to France's senior civil service, with only 80-90 students graduating each year. A prestigious institution, it has been a key path to high positions in both public and private sectors, with four French Presidents, including Emmanuel Macron, among its graduates.\nHowever, the Yellow Vest protests have highlighted the ENA's elitism, criticizing its graduates for promoting narrow, centrist policies and maintaining social divisions. With most ENA graduates coming from wealthy families, only 6% are from working-class backgrounds.\nOn April 25, 2019, Macron announced the closure of the ENA, but as France faces future economic challenges, it remains uncertain whether this decision will stand."
