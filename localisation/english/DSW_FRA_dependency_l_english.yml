 FRA_Nicolas_Dupont_Aignan_HM:0 "Nicolas Dupont-Aignan"
 FRA_Nicolas_Dupont_Aignan_HM_desc:0 "Nicolas Dupont-Aignan, born on March 7, 1961, is a French politician and the founder of the political party Debout la France (DLF). He has been a prominent figure in French politics, advocating for national sovereignty, economic patriotism, and traditional conservative values. Dupont-Aignan served as a member of the National Assembly from 1997 to 2012 and has run for President of France multiple times. He is known for his criticism of the European Union and his calls for France to regain control over its borders and economy. Dupont-Aignan's political positions often align with nationalist and eurosceptic views, making him a significant voice in the French political landscape."
