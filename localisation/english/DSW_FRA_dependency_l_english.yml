 latinist.1.a:0 "We shall rise like a Phoenix"
 latinist.1.b:0 "Past Glories will be Revived"
 latinist.1.c:0 "Our Blood shall be Purified"
 latinist.1.d:0 "The path to national revival has become an unavoidable question of history. Since France completed its transformation into a nationalist state, debates over the future direction of the nation have erupted across all levels of society. The fires of war and revolution have reduced the old order to cinders, and now, upon this scorched earth, we must decide how to rebuild our homeland.\n\nThe first perspective holds that we shall rise like a phoenix. Supporters of this stance believe that France's suffering was a necessary trial, a purification of the national spirit. They view the current hardship as a crucial stage toward a grand revival, emphasizing the virtue of sacrifice and the meaning of endurance. To them, only through a total spiritual renewal can France emerge from the shadows of history and march toward a radiant future.\n\nThe second perspective proclaims that ourpast glories will be revived. Those who adhere to this belief immerse themselves in nostalgia for France's golden past. Whether it be the military triumphs of the Napoleonic era or the cultural flourishing of the Third Republic. They emphasize the continuity and superiority of French civilization, advocating for a return to traditional values and institutions as the key to reclaiming France's rightful place in the world.\n\nThe third perspective asserts that our blood shall be purified. Its adherents blame France's decline on the contamination of the national bloodline, advocating for strict population policies to achieve so-called ethnic purity.\n\nAs the nation stands at a crossroads, these competing visions will shape the destiny of France in the years to come."
 latinist.1.t:0 "Sifting through the Ashes"
 latinist.10.a:0 "Hispania rejoins the Empire!"
 latinist.10.b:0 "Nay!"
 latinist.10.d:0 "France restyled itself as the Latin Empire some time ago and it was considered a reasonable possibility for many months now that France would eventually come to reclaim Hispania, now, this does mean we lose our independence but it doesn't mean we would lose all influence. As an equal part of the Latin Empire we would stand with France and Italy and Portugal as one unified bloc, to counter German dominance and Bolshevik dominance. We have a question to ask ourselves about whether we are Latins first or Spanish? And what is Spain? We have many different kinds of Spaniard here, Galicians, Catalonians, the Aragonese, the Asturians, we have put down the Catalan for many years calling their nationalism selfish and shortsighted. "Alone you will go nowhere!" we cried, and now France cries it at us. Maybe we should listen to them? Perhaps it is time for Hispania to rejoin a new Latin Empire."
 latinist.10.t:0 "Latin Empire demands Annexation"
 latinist.11.a:0 "Like a Pheonix from the Ashes of Europe!"
 latinist.11.b:0 "Nay!"
 latinist.11.d:0 "The French were always holding things over our heads, smug and prideful people. Yet when they declared themselves the Latin Empire we saw a different side of French pride, we saw a side that spoke to our delegates as brothers. When months ago we inquired what the future would hold with France gone and the Latin State in its place, they proposed a plan to unify all of the Latin peoples into one super state, a new Rome, a grand new Empire in Red and Gold like our ancestors had two millennia ago. They said they wanted us at their side to counter Germany, they wanted us to dominate Europe again together. The Gallic Ambassador came today delivering what he called good news. They had finalized their plans and goals and were ready to annex us. They were ready they said, as if they felt our acceptance was assured? It is not so easy to toss away ones nation to simply join a greater whole. What guarantee do we have that this is not another thinly veiled French Empire coated in Roman regalia and given a warm smile? Their troops peer into the peninsula ready to cross the Rubicon. We have a choice to make."
 latinist.11.t:0 "Latin Empire demands Annexation"
 latinist.12.a:0 "We will Survive"
 latinist.12.b:0 "Traitors! Embargo!"
 latinist.12.c:0 "This CANNOT stand!"
 latinist.12.d:0 " The French Army has been seen on media marching into Catalonia, citing the unstable situation in Spain as reasoning to bring the Catalonians into the French fold. This is a thinly veiled attempt to reestablish the March of Catalonia, what do they think they are? Frankish? This core territory of Spain has been lost to a foreign power while we are in our weakest state since 1936. We cannot just let this go unpunished, even if we cannot respond right now with military action we have to do something to these bastardos! An Embargo! Anything! Or…perhaps we can simply let them have the troublesome Catalans. Maybe it's not too bad of a loss."
 latinist.12.t:0 "French Army marches into Catalonia"
