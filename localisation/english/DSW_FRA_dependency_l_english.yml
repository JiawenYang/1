 The_6th_Republican_Constitutional_Referendum_2_TXT_DESC:0 "The ideology is Progressivism.\n\n§RRequires:§!\n§0Faure§! or §0Ruffin§! leads the §pNew Popular Front§! to win the 2022 general election."
 The_6th_Republican_Constitutional_Referendum_3_TXT:0 "@FRA §pMélenchon§!'s radical constitutional referendum fails"
 The_6th_Republican_Constitutional_Referendum_3_TXT_DESC:0 "Still the Fifth Republic breathes in this mortal realm.\n\n§RRequires:§!\n§pMélenchon§! or §0Ruffin§!leads the §pNew Popular Front§! to win the 2022 Election."
