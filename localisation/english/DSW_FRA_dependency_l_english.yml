 FAF_pay_for_the_arts_decision:0 "Patronage of the Arts"
 FAF_pay_for_the_arts_decision_desc:0 "\n\n\n\n\n£GFX_FAF_patronage_of_the_arts\n\n\n\n\n\n\n\nThe arts are always the heart of soul of a nation, shaping culture, the Classical and Renaissance periods are seen as some of the golden ages of art and of course that is due to the wide support of monarchies abroad to it's development. Let France again become a center of great art, let us fund new masterpieces."
