 FRA_Raphael_Gluckmann_FM:0 "Raphaël Glucksmann"
 FRA_Raphael_Gluckmann_FM_desc:0 "Raphaël Glucksmann, born on October 15, 1979, is a French author, filmmaker, and politician. He is the founder of the political movement Place Publique and a Member of the European Parliament since 2019. Glucksmann is known for his progressive and pro-European views, advocating for social justice, human rights, and environmental sustainability. He has been a vocal critic of far-right movements in Europe and has been actively involved in promoting European cooperation and integration. Glucksmann's political career has been marked by his commitment to progressive values and his efforts to address pressing issues facing society."
 FRA_Recall_our_Generals_decision:0 "[AG1.GetFlag] Recall our Generals"
 FRA_Recall_our_Generals_decision_desc:0 ""
 FRA_Recognize_APLA_decision:0 "[APA.GetFlag]§RAPLA§!: Recognize §RAmerican People's Liberation Army§!"
 FRA_Recognize_APLA_decision_desc:0 ""
 FRA_Recognize_Association_of_the_Freed_decision:0 "[GMA.GetFlag]§GAOF§!: Recognize §GAssociation of the Freed§!"
 FRA_Recognize_Association_of_the_Freed_decision_desc:0 "While a disruption of the old American order was inevitable with the Second Civil War, there has been a clear shift towards some of the more niche factions within the conflict. In particular, a group known as the ''Association of the Freed'' has surpassed foreign expectations and seeks more international support. Thus, it is in our best interests to recognize the AOF as the rightful American government and assist them in their Second American Revolution!"
 FRA_Recognize_Biden_decision:0 "[USB.GetFlag]§CUOA§!: Recognize §CUnion of America§!"
 FRA_Recognize_Biden_decision_desc:0 "With the Civil War in the United States still raging, we face the issue of finding which faction to recognize as the rightful government of their war-torn territories. Seeing as we seek a return to the security granted by the Americans' membership in NATO, it is in our best interests to recognize the Unionist government and support their efforts to restore normalcy within their country."
 FRA_Recognize_Constitutionalists_decision:0 "[USC.GetFlag]§CACG§!: Recognize §CAmerican Constitutional Government§!"
 FRA_Recognize_Constitutionalists_decision_desc:0 "As the civil war continues to rage on in the United States, we've so far kept a policy of general neutrality as we've faced more pressing matters here in Europe. Now that we can once again focus our efforts abroad, it would be in our best interests to recognize Trump's Constitutionalists as the rightful American government to once again secure our long-standing alliance. "
 FRA_Recognize_GMAC_decision:0 "[GMA.GetFlag]§GGMAC§!: Recognize §GGreen Mountain Anarchist Collective§!"
 FRA_Recognize_GMAC_decision_desc:0 "As the situation in America continues to evolve as the Second Civil War ravages the country, we still haven't found a faction to recognize and support. While it may be quite unorthodox, the ''government'' of the Green Mountain Anarchist Collective has shown its willingness to bring about a better America, even under the statelessness of anarchism. If we back them in their efforts to reunify the United States, we may have a unique ally in the coming geopolitical storm."
 FRA_Recognize_Patriot_Front_decision:0 "[PTF.GetFlag]§2Patriot Front§!: Recognize §2Patriot Front§!"
 FRA_Recognize_Patriot_Front_decision_desc:0 "The Civil War in the United States has brought sweeping change to its political landscape, particularly with the rise of the far-right Patriot Front. While we disagree with many of their policies in principle, we need to recognize and support their government to try and salvage our former alliance before it's too late."
 FRA_Recognize_SoL_decision:0 "[FAA.GetFlag]§GCoFAR§!: Recognize §YConfederation of Free American Republics§!"
 FRA_Recognize_SoL_decision_desc:0 "While our domestic situation has prevented us from intervening in the Second American Civil War, we now have the capability to extend our influence and should recognize a faction as the legitimate American government. In particular, the Confederation of Free American Republics and their sudden rise out of New England has made them a clear candidate for us to support. As we did in 1776, we should declare our support for the COFAR and their Second American Revolution!"
 FRA_Recognize_the_Constitutionalists_zemmour:0 "[USC.GetFlag]§CACG§!: Recognize §CAmerican Constitutional Government§!"
