 MELENCHON_AI_BEHAVIOR_TXT:0 "§pNew Popular Front§!"
 MELENCHON_AI_BEHAVIOR_TXT_DESC:0 "After completing the \"Opening Volley\" focus, §3Marine Le Pen§! will be sided with, but after an exposed attempted military coup, §ORenessiance§! and §3National Rally§! will lose favor in the public eye, leading to §pNew Popular Front§! winning the 2022 election.\n\n§RRequires:§!\n§pNew Popular Front§! established."
