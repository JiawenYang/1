 FRA_CFA_Franc:0 "CFA Franc"
 FRA_CFA_Franc_2:0 "CFA Franc"
 FRA_CFA_Franc_2_desc:0 "Despite decolonization, France's influence remains strong over its former West African colonies through the CFA franc, which comprises two monetary zones across 14 sub-Saharan countries. Pegged to the Euro, the CFA franc limits the ability of West African nations to independently manage their economies, leaving them vulnerable to European market fluctuations and EU policies.\nHowever, the CFA franc benefits the French economy, facilitating trade and providing macroeconomic stability in the region. This stability has helped prevent debt crises and inflation, enabling French corporations to invest heavily in West African resource extraction, generating billions in profits for France."
 FRA_CFA_Franc_3:0 "CFA Franc"
 FRA_CFA_Franc_3_desc:0 "Despite decolonization, France's influence remains strong over its former West African colonies through the CFA franc, which comprises two monetary zones across 14 sub-Saharan countries. Pegged to the Euro, the CFA franc limits the ability of West African nations to independently manage their economies, leaving them vulnerable to European market fluctuations and EU policies.\nHowever, the CFA franc benefits the French economy, facilitating trade and providing macroeconomic stability in the region. This stability has helped prevent debt crises and inflation, enabling French corporations to invest heavily in West African resource extraction, generating billions in profits for France."
