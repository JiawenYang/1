 FAF_Keep_Officers_in_Check:0 "Curtail Officers"
 FAF_Keep_Officers_in_Check_Mon:0 "Curtail Officers"
 FAF_Keep_Officers_in_Check_Mon_desc:0 ""
 FAF_Keep_Officers_in_Check_desc:0 "The Officer Corp has been quite a thorn in our side, aligned with the pseudo-liberal Gaullists seeking to bring us back to the instability of the previous French Republics. While we will still need them in our affairs of state, curtailing their political influence is essential in ensuring our power is secured."
 FAF_Kill_Bardella_decision:0 "End the Identitarians"
 FAF_Kill_Bardella_decision_desc:0 ""
 FAF_Kill_Benedetti_decision:0 "End the Mussolini Wannabe"
 FAF_Kill_Benedetti_decision_desc:0 ""
 FAF_Kill_the_Juntists_decision:0 "End the Wishy-Washy Generals"
 FAF_Lafayette_HM:0 "'Lafayette'"
 FAF_Language_of_the_State_decision:0 "Rescind the State Language"
 FAF_Language_of_the_State_decision_desc:0 "One of the main hindrances to Latin being adopted by our people is that we have one national language, French. While it may be a shock to our managerial and political classes, rescinding its prized status and putting it on par with our recognized legal languages may be a good motivator for our citizens to take up Latin. As well, doing so can help ensure that when Europe is finally united our banner does not come across as merely another case of French imperialism."
 FAF_Laurent_Marcangeli_HM:0 "Laurent Marcangeli"
 FAF_Laurent_Marcangeli_IM:0 "Laurent Marcangeli"
 FAF_Legalize_Experimental_Weapon_Programs:0 "Legalize Experimental Weapon Programs"
 FAF_Les_Identitarian_party:0 "BI"
 FAF_Les_Identitarian_party_long:0 "Bloc Identitaire"
 FAF_Les_Republicains_party:0 "LR"
 FAF_Les_Republicains_party_long:0 "Les Republicains"
 FAF_Look_to_the_Glory_of_Rome:0 "Look to the Glory of the Past"
 FAF_Look_to_the_Glory_of_Rome_desc:0 "France is a nation of poets, philosophers, artists and great conquers. As the heirs of the great Charlemagne, we have become the center of European innovation and glory. Although France has been under tough times we must remind the people of our past and despite all the troublesome times France lived, and marched on. "
 FAF_Marie_Marguerite_of_Bourbon_IM:0 "Marie Marguerite of Bourbon"
 FAF_Mimic_de_Gaulle:0 "Mimic De Gaulle"
 FAF_Mimic_de_Gaulle_desc:0 "As we seek to establish a strong, military-centered approach to our governance that still respects the fundamental rights of our citizens, who better to look to than the late President and General Charles De Gaulle? His efforts in establishing the sadly ill-fated Sixth Republic can provide a framework for our leadership that, while requiring some heavy-handed means to quell the May 1958 crisis, left behind a fond legacy that we must seek to emulate."
 FAF_MoDem_party:0 "MoDem"
 FAF_MoDem_party_long:0 "Democratic Movement"
 FAF_Modern_Knights:0 "Modern Knights"
 FAF_Move_Troops_into_Padania_decision:0 "Stabilize [LOM.GetFlag] §GNorthern Italy§!"
 FAF_Move_Troops_into_Padania_decision_desc:0 ""
 FAF_NMD_racial_law:0 "French Superiority"
 FAF_NMD_racial_law_desc:0 ""
 FAF_National_Conservative_Union_party:0 "NCU"
 FAF_National_Conservative_Union_party_long:0 "National Conservative Union"
 FAF_National_Rebirth:0 "National Rebirth"
 FAF_National_Rebirth_Anti_Communist:0 "National Rebirth"
 FAF_National_Rebirth_Anti_Communist_desc:0 "France must awake to a glorious renaissance of unity and strength. Through bold and powerful cultural renewal, our regime must restore the people's rightful pride and place our country firmly on the path to greatness."
 FAF_National_Rebirth_desc:0 "France must awake to a glorious renaissance of unity and strength. Through bold and powerful cultural renewal, our regime must restore the people's rightful pride and place our country firmly on the path to greatness."
 FAF_Nationalize_the_Wine_and_Olive_Industries:0 "Nationalize Wine & Olive Industry"
 FAF_Nationalize_the_Wine_and_Olive_Industries_desc:0 "In terms of cultural products, France is renowned for their wine and olive exports. As of now, most of these industries are currently privately owned and thus privy to the influences of foreign agents. If we nationalize these industries, not only can we secure extra funds for our regime, but can ensure these products can continue to be the pride and joy of France!"
 FAF_Nikola_Perovic_FM:0 "Nikola Perović"
 FAF_Nobility_tt:0 "§CThe Noble class plays a significant role in supporting the Monarchy and maintaining the stability of the realm§!"
 FAF_Nobility_warning_tt:0 "§CThe Restoration of the Nobility will bring many new supporters to our cause... Some less than reputable ones as well.§!"
 FAF_Nuke_Kiev_decision:0 "Deploy §RTactical Nuke§! on §YKiev§!"
 FAF_Nuke_Leningrad_decision:0 "Deploy §RTactical Nuke§! on §YLeningrad§!"
 FAF_Nuke_Moscow_decision:0 "Deploy §RTactical Nuke§! on §YMoscow§!"
 FAF_Nuke_Warsaw_decision:0 "Deploy §RTactical Nuke§! on §YWarsaw§!"
 FAF_Open_Alsace_Identitarian_Council_decision:0 "Embolden §PAlsace Identity§!"
 FAF_Open_Alsace_Identitarian_Council_decision_desc:0 "Alsace is French and Alsace remains French. Ever since the Treaty of Westphalia, Alsace has been under French rule. Some argue that Alsace is German, but this is a blatant lie. A lie to sow division between us. It is true that the Germans ripped us apart multiple times throughout history, but blood is thicker than water and we must remind the people of Alsace of this fact."
 FAF_Open_Basque_Identitarian_Council_decision:0 "Embolden §7Basque Identity§!"
 FAF_Open_Basque_Identitarian_Council_decision_desc:0 "The Basque people can stand proud of how well they have preserved their culture and language. However, the poison of globalization has caused both to wane. In France, Basque culture is slowly fading, and the language is becoming forgotten. In Spain, the Basque people have become increasingly aggressive. Under our rule, they must remember that what makes us strong is not cultural division, but the richness of dual heritage."
 FAF_Open_Catalan_Identitarian_Council_decision:0 "Embolden §YCatalan Identity§!"
 FAF_Open_Catalan_Identitarian_Council_decision_desc:0 "Catalan culture and language have gradually become endangered due to our efforts at centralisation of education. This small innocent mistake has caused them to give up their own traditions and forced them to adapt to the French way of life. We should not forget that we are a Castell, and like a castell everything must be in unison to reach stability."
 FAF_Open_Corsican_Identitarian_Council_decision:0 "Embolden §gCorsican Identity§!"
 FAF_Open_Corsican_Identitarian_Council_decision_desc:0 "Ever since late 18th century, Corsica has been French. This little island, just southeast of mainland France gave birth to the greatest giant in the French history, Napoleon Bonaparte. Corsica's place within France has always been shaky, even troublesome. But by embracing and integrating, we can solidify our kinly ties."
 FAF_Open_Lombardian_Identitarian_Council_decision:0 "Embolden §GLombard Identity§!"
 FAF_Open_Lombardian_Identitarian_Council_decision_desc:0 "The connection between us French and the Lombards was created when the mighty Charlemagne conquered their kingdom, integrating them into our cultural sphere of influence. As our Lombardian brothers return to our embrace, we must rekindle the centuries old ties between our two peoples."
 FAF_Open_Occitan_Identitarian_Council_decision:0 "Embolden §OOccitan Identity§!"
 FAF_Open_Occitan_Identitarian_Council_decision_desc:0 "For generations Occitania has been under French rule and today is a well integrated part of our nation, but perhaps a little too well. Occitan culture and language have become endangered, soon to be forgotten within our great country. We cannot allow this to happen. Occitanian cultural revival is key to guiding our people in finding their roots."
 FAF_Open_Paris_Identitarian_Council_decision:0 "Embolden §CParisian Identity§!"
 FAF_Open_Paris_Identitarian_Council_decision_desc:0 "How can one talk about France without mentioning Paris? For centuries, Paris has been the heart of French art, fashion, and literature—if not that of the entire world. But the 'City of Light' was not built by bricks and stones alone; it was built by the flourishing Parisian culture that allowed life and creativity to blossom. Parisian culture is what brought our nation to the global stage and made our name ring across the ocean blues."
 FAF_Open_Roman_Identitarian_Council_decision:0 "Embolden §tRoman Identity§!"
 FAF_Open_Roman_Identitarian_Council_decision_desc:0 "Oh Rome.. where does one even begin? The basis of the French culture is Roman and the French language is Latin. The intertwining of Romans and ancient Gauls made France what it is today. Roman militarism, Roman creativity, and Roman ingenuity were all inherited by us. France is Rome and Rome is France."
 FAF_Open_Venetian_Identitarian_Council_decision:0 "Embolden §AVenetian Identity§!"
 FAF_Open_Venetian_Identitarian_Council_decision_desc:0 "We French have always greatly admired and appreciated the Venetian culture and people. When Napoleon conquered Venice, he did not go after its people nor its material wealth, instead he set his eyes on the magnificent Venetian artistry. Rejoice my Venetians brothers for you are finally part of our great French family."
 FAF_Pardon_Republican_Officers:0 "Pardon Republican Officers"
 FAF_Pardon_Republican_Officers_desc:0 "In our efforts to ensure control over the apparatus of the state, we need as many hands as we can get. While our initial purge involved most former officers in our coup, those who are sympathetic can be brought back in through a series of pardons."
 FAF_Patrick_de_Seze_EM:0 "Patrick de Seze"
 FAF_Paul_Marie_Couteaux_HM:0 "Paul-Marie Coûteaux"
 FAF_Petainist_Defense:0 "Defensive Maneuvers"
 FAF_Petainist_Defense_desc:0 "Our military's strategic defenses ensure the security of the nation's borders. Our disciplined military and steadfast fortifications must follow the resilience of our people, ensuring that foreign aggressors can never again threaten the homeland."
 FAF_Pierre_Cassen_IM:0 "Pierre Cassen"
 FAF_Pierre_Jean_Luciani_IM:0 "Pierre-Jean Luciani"
 FAF_Pope_Innocent_XIV_IM:0 "Pope Innocent XIV"
 FAF_Praise_the_Army:0 "Praise the Army"
 FAF_Praise_the_Army_desc:0 "Our soldiers fought valiantly on the eastern front, but unfortunately, they were betrayed by cowardly leadership. Our new state will restore the honour of the great French army; the courageous French army shall be the backbone of the new French state."
 FAF_Promote_Active_Clubs:0 "Promote Active Clubs"
 FAF_Promote_Active_Clubs_desc:0 "Active clubs are crucial in turning directionless young men into organised nationalist french youth. In every revolution in history, the fervour of youth was the driving force of change and that must be utilised today to create hungry energetic youth!"
 FAF_Promote_French_Israelism:0 "Promote French Israelism"
 FAF_Promote_French_Israelism_Mon:0 "Promote French Israelism"
 FAF_Promote_French_Israelism_Mon_desc:0 ""
 FAF_Promote_French_Israelism_desc:0 "While a fringe belief in French nationalism, there exists a movement of people who believe our Frankish ancestors are descendants of the Tribe of Benjamin, thus one of the lost Ten Tribes of Israel. Some may see this as pseudo-historical, but if we promote this concept, it can help embolden our religious citizens to fight for our regime. In the fight against the hordes of the East, to paint ourselves as Crusaders by birthright would be a wise idea."
 FAF_Promote_Radical_Officers:0 "Promote Radical Officers"
 FAF_Promote_Radical_Officers_Mon:0 "Promote Radical Officers"
 FAF_Promote_Radical_Officers_Mon_desc:0 ""
 FAF_Promote_Radical_Officers_desc:0 "To offset the influence the Gaullists have over the Officer Corps, we can promote members currently in service that better embody our Petainist ideals. Besides, it’s always good for officers to have differing opinions, especially in the political department, right?"
 FAF_Put_Pressure_on_the_Dalmatians_decision:0 "Demand [CRO.GetFlag] §pCroat Subjugation§!"
 FAF_Put_Pressure_on_the_Dalmatians_decision_desc:0 "From the marble colonnades of Diocletian's Palace to the Latin inscriptions of Dubrovnik, the salt-laden Adriatic winds have never fully erased the imprint of Rome upon this land.Just as the Adriatic forever gazes westward toward the Eternal City, the cultural map of Croatia still holds unwritten pages, awaiting the rekindling of the Latin flame. When the ironclad knights of the Fourth Crusade raised the Latin cross over Constantinople, history had already charted the course for this lost jewel of Latin civilization—not to bow before the Ottoman crescent, nor to submit to the Slavic double-headed eagle, but to follow the Dalmatian roads once paved by Roman legions, returning at last beneath the scepter of Latin imperial order."
 FAF_QU_idea_dummy:0 "Quadrilingual Unification"
 FAF_QU_tt:0 "Although this will start out as a §Rnegative§! modifier, the more we work re-unifying Italian, Spanish, and French into a unique, §Ylatin-esque§! dialect, the §Gbetter the modifiers will become§!"
 FAF_Quadrilingual_Unification_idea:0 "Language of Brothers"
 FAF_Redeem_The_Marechal:0 "Redeem the Maréchal"
 FAF_Redeem_The_Marechal_Mon:0 "Redeem the Maréchal"
 FAF_Redeem_The_Marechal_Mon_desc:0 ""
 FAF_Redeem_The_Marechal_desc:0 "History has not been kind to Phillippe Petain. The Maréchal, once known as the "Lion of Verdun" for his bravery in the First World War and willingness to work out peace with the invading Germans to prevent the imminent destruction of France. The petty liberal historians, hell-bent on deeming him a collaborator, must be silenced. Instead, our education must reflect a more "fair" approach to how we look back on the true savior of France during the Second World War!"
 FAF_Renuclearization:0 "Nuclearization"
 FAF_Renuclearization_desc:0 ""
 FAF_Restore_Marianne:0 "Restore the Glory of Marianne"
 FAF_Restore_Marianne_desc:0 "The figure of Marianne, having arisen from the fires of the First Republic, has often acted as the national personification of France itself. However, in recent decades, she has become less relevant in popular culture, to the dismay of many French patriots. Thus, if we seek to unite France under our patriotic banner, we must restore the relevance and glory of our beloved Marianne!"
 FAF_Restored_Monarchy_idea:0 "Restorationist Movement"
 FAF_Romanticize_the_Old_Kingdom:0 "Romanticize the Old Kingdom"
 FAF_Romanticize_the_Old_Kingdom_desc:0 ""
