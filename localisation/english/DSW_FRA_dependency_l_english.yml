 FRA_mass_migration_idea:0 "Mass Migration"
 FRA_mass_migration_idea_desc:0 "\n\n\n\n£GFX_FRA_mass_migration_banner\n\n\n\n\n\nSince 1973, France's immigration policy has focused on limiting migration, but in 2019, over 120,000 asylum applications sparked significant political division. Amid economic slowdown and high unemployment, the immigration debate has become a heated issue.\nThe right, fueled by fears of migration's impact on French identity and security, advocates for stronger borders and anti-immigrant rhetoric. Nationalist parties call for closed borders to halt the influx.\nAs the debate grows more contentious, French society is becoming increasingly polarized. With rising numbers of refugees from North Africa and the Middle East, the economic strain is escalating. A decisive immigration policy will soon be unavoidable."
 FRA_mass_vaccination_tt:0 "§YThe Pandemic is able to be eradicated, but we must mass-vaccinate our populace§! "
 FRA_mathilde_panot_HM:0 "Mathilde Panot"
 FRA_mathilde_panot_HM_desc:0 "Mathilde Panot, born on June 21, 1974, is a French politician and member of the French National Assembly. She represents the 10th constituency of the Val-de-Marne department since 2017, as a member of La France Insoumise (France Unbowed), a left-wing political party. Panot is known for her activism and advocacy for social justice, environmental sustainability, and human rights. She is a vocal critic of economic inequalities and has been actively involved in various social movements. Panot's political positions often align with progressive and anti-establishment views, making her a prominent figure in the French political landscape."
