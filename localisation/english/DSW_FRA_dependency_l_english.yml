 france.100.b:0 "Immediate entry to all applicants"
 france.100.c:0 "We can't have radicals taint our government"
 france.100.d:0 "As the Second American Civil War continues to ravage the United States, a growing tide of American citizens is fleeing the violence and chaos in search of refuge abroad, with a significant number seeking solace in France. The journey to safety is treacherous, with many facing perilous conditions and the constant threat of violence. Families are torn apart, homes are destroyed, and livelihoods are lost as the conflict shows no signs of abating. \n\nUpon reaching France, these immigrants find themselves in a precarious situation, navigating a foreign land with uncertain prospects. The French government, while sympathetic to their plight, is struggling to accommodate the influx of refugees, leading to overcrowded shelters and strained resources. Despite these challenges, the immigrants remain resilient, holding onto hope for a better future in their new homeland. \n\nHowever, the French government faces a difficult decision regarding its migrant policy in light of the influx of American immigrants. It must weigh the need for compassion and humanitarian assistance against concerns about security and extremism. "
 france.100.t:0 "American Immigration Policy"
 france.101.a:0 "So... Do we have your vote?"
 france.101.d:0 "In a significant step toward uniting progressive forces in France, Stéphane Séjourné has convened a meeting with Jean-Luc Mélenchon, leader of La France Insoumise. This meeting aims to explore potential collaboration and forge a coalition that amplifies their shared goals of social justice, environmental sustainability, and economic reform. \n\nDuring their discussion, Séjourné and Mélenchon address key issues such as climate action, workers' rights, and income inequality. They recognize the power of a united front to challenge the growing influence of right-wing populism and to resonate with voters seeking progressive change."
 france.101.t:0 "Séjourné meets with Mélenchon"
 france.102.a:0 "Jupiter has fallen"
 france.102.d:0 "After officially losing his attempt at a third term as president, former president Emmanuel Macron has announced his resignation from the political world, leaving Stephane Sejourne as leader of the Renaissance Party. \nIn his inaugural address, Séjourné emphasized the importance of unity and resilience, calling for a renewed focus on progressive values, economic reform, and strengthening European ties. He acknowledged the challenges ahead, particularly in addressing the concerns of voters who turned to Le Pen, and stressed the need for innovative policies that resonate with a broader electorate."
 france.102.t:0 "Macron resigns"
 france.103.a:0 "We must stand together to fight climate change"
 france.103.d:0 "In a strategic move aimed at revitalizing the Renaissance party, Stéphane Séjourné has met with Guillaume Gontard, a key figure in the environmental and progressive movements. This meeting marks a significant step toward transforming Renaissance into a centre-left party that aligns more closely with contemporary concerns around climate change, social justice, and economic equality. \n\nDuring their discussion, Séjourné and Gontard explored various policy initiatives that could attract a broader base, emphasizing sustainable development, green technologies, and inclusive social policies. They recognized the importance of appealing to younger voters and urban populations who are increasingly engaged with issues of climate action and social equity."
 france.103.t:0 "Séjourné meets with Gontard"
 france.104.a:0 "March!"
 france.104.d:0 "In a landmark moment for French politics, a new political party, Une République, Une Marche!, has officially been formed from the union of the Greens, La France Insoumise, and the Renaissance party. This coalition aims to present a unified front in addressing the pressing issues of climate change, social justice, and economic equality. \n\nThe inaugural meeting of Une République, Une Marche! drew thousands of enthusiastic supporters, reflecting the widespread desire for a coherent progressive alternative in the political landscape. Leaders from all three parties delivered powerful speeches emphasizing their commitment to transformative policies and democratic values."
 france.104.t:0 "Birth of Une République, Une Marche!"
 france.105.a:0 "Recount! Recount! Recount!"
 france.105.d:0 "In a bold move, Une République, Une Marche! has officially called for a comprehensive investigation into allegations of electoral fraud following the recent elections. Leaders within the party express concerns over the integrity of the electoral process, urging for transparency and accountability to restore public confidence. \n\nDuring a press conference, party officials highlighted various reports of irregularities that have surfaced, emphasizing the need for a thorough examination to ensure that every vote is counted fairly.  Leaders within the party express concerns over the integrity of the electoral process, citing reports of irregularities and, notably, claims of potential Russian interference aimed at influencing the outcome. \n\nDuring a press conference, party officials highlighted various irregularities that have surfaced, emphasizing the need for transparency and accountability to restore public confidence. URUM frames this initiative as a commitment to democratic principles and the protection of citizens' rights, asserting that any potential misconduct, including foreign interference, must be addressed to uphold the legitimacy of the electoral system."
 france.105.t:0 "URUM calls for Electoral Fraud investigation"
 france.106.a:0 "We should've learned from Hillary..."
 france.106.d:0 "After weeks of investigation and analysis, the URUM council has released its findings, concluding that there is no evidence of large-scale voter fraud in the recent elections. The council's report addresses concerns raised by supporters regarding the integrity of the electoral process, including allegations of foreign interference. \n\nWhile the report acknowledges some minor irregularities, it emphasizes that these do not constitute a significant threat to the overall integrity of the election. URUM leaders have stated that the findings should reassure voters about the democratic process, and they remain committed to advocating for transparency and electoral reform where necessary."
 france.106.t:0 "URUM council finds no large-scale voter fraud"
 france.107.a:0 "France must lead Europe into a Federalized Age"
 france.107.b:0 "France must be an active participant in European Affairs"
 france.107.c:0 "Federalization is a way to undermine national workers"
 france.107.d:0 "URUM finds itself at a crucial juncture as discussions about the future of the European Union intensify. The party must navigate a complex landscape where federalization is both a potential pathway to greater unity among member states and a source of concern for many citizens. With rising challenges such as climate change, economic inequality, and security threats, URUM believes that France should take a proactive role in advocating for a federalized Europe. The party sees this as an opportunity to promote strong French leadership that can drive meaningful change on a continental scale. \n\nHowever, URUM is also acutely aware of the risks that federalization poses, particularly regarding the rights and protections of national workers. The party recognizes that without adequate safeguards, federal policies could undermine local labor rights and social protections. As such, URUM must carefully consider how to balance its support for European integration with a commitment to protecting the interests of French workers. This decision will shape not only the party's future direction but also its relationship with the electorate as France grapples with its place in an evolving Europe."
 france.107.t:0 "URUM's stance on EU Federalization"
 france.108.a:0 "We will be back Macron..."
 france.108.d:0 "Marine Le Pen has announced that she does not plan to return to the post of head of her right-wing National Rally party, instead she will head a faction in the National Assembly. National Rally has elected a 27-year-old from the Paris banlieue who joined the party as a teenager as its new president to replace Marine Le Pen.\nJordan Bardella, Le Pen's protege, who has been caretaker president for a year, beat Louis Aliot, 53, the mayor of Perpignan, a party heavyweight as well as Le Pen's former partner, by 85% to 15% of party members who voted."
 france.108.t:0 "Le Pen Resigns"
 france.109.a:0 "Mind your business..."
 france.109.d:0 "In a surprising development, Jordan Bardella, the young president of the National Rally, was photographed visiting Jean-Marie Le Pen in the hospital alongside former party figures Carl Lang and Bruno Gollnisch. This visit has sparked intense media scrutiny and speculation about the future of the party, especially in light of the recent electoral defeat and Jean-Marie's declining health. The presence of Lang and Gollnisch, both known for their more traditionalist and hardline views, raises questions about the ideological direction Bardella intends to pursue. \n\nAs details of the visit emerge, commentators are divided. Supporters see it as a gesture of respect and unity within the party's legacy, while critics warn that it signals a potential shift back to the more radical roots of the National Front. Bardella's leadership has been characterized by a desire to modernize the party's image, but this meeting could complicate that narrative. The outcome of this visit may influence the party's future strategies and its ability to appeal to a broader electorate as it navigates a changing political landscape."
 france.109.t:0 "Bardella caught visiting Jean-Marie Le Pen"
 france.111.a:0 "A Smart Man"
 france.111.d:0 "In a significant political meeting, Jordan Bardella, the president of the National Rally, convened with Field Marshal Pierre de Villiers to express their shared frustrations over President Macron's increasingly liberal policies. Both figures, representing distinct aspects of the French right, voiced their concerns about the perceived drift away from traditional values and national interests under Macron's leadership. The discussions centered on issues such as immigration, security, and national sovereignty, with Bardella emphasizing the need for a more robust stance against what he described as ''liberal overreach.'' \n\nField Marshal de Villiers, known for his strong military background and conservative viewpoints, echoed Bardella's sentiments, warning that the current administration's policies threaten the fabric of French society. Their meeting highlights a potential alliance between established military authority and the younger political leadership of the National Rally, aiming to unite various factions of the right against a common adversary. As they explore collaborative strategies, the implications of this partnership could reshape the political landscape and mobilize support from disenchanted voters seeking a more traditional approach to governance."
 france.111.t:0 "Bardella meets with Field Marshal Villiers"
 france.112.a:0 "Strange times we live in..."
 france.112.d:0 "In a bold move to consolidate far-right forces in France, the National Rally, led by Jordan Bardella, has officially announced the formation of a new coalition party named Le Droit Chemin. This coalition unites the National Rally with Reconquête, the party founded by Eric Zemmour, and various smaller fringe far-right parties. The goal is to create a more formidable political entity capable of challenging the mainstream parties and effectively representing the concerns of nationalists and conservatives disillusioned by the current administration. \n\nLe Droit Chemin aims to capitalize on growing discontent with President Macron's liberal policies, presenting itself as a unified front that prioritizes issues such as immigration control, national sovereignty, and traditional values. Leaders from the member parties have expressed optimism that this coalition will strengthen their electoral chances and provide a clear alternative to the status quo. As the new party positions itself within the political landscape, its ability to maintain cohesion among its diverse factions will be crucial in navigating upcoming elections and mobilizing voter support."
 france.112.t:0 "Formation of Le Droit Chemin"
 france.113.a:0 "So called Social-Liberals..."
 france.113.d:0 "In a strategic shift aimed at strengthening the leftist political landscape in France, the Leftist Renaissance, a faction within Macron's party, has officially joined the New Popular Front. This coalition seeks to unite various progressive groups to present a formidable challenge to right-wing politics. Leading this initiative is Stella Dupont, a prominent figure on the left wing of the Renaissance, who is advocating for the formation of a new social democratic group that can effectively rally support from disillusioned members of Macron's party. \n\nDupont's vision involves creating a cohesive platform that addresses pressing issues such as social justice, economic equality, and environmental sustainability. By aligning with the New Popular Front, she aims to consolidate leftist forces and enhance their visibility in the political arena. The partnership is expected to mobilize voters who are seeking an alternative to the current administration's centrist policies, while also fostering a renewed sense of hope among progressive constituents. As the New Popular Front takes shape, its success will depend on how well it can unify these diverse factions and articulate a clear, compelling agenda for the future."
 france.113.t:0 "Leftist Renaissance joins NFP"
 france.114.a:0 "We get it"
 france.114.d:0 "In a wave of civic engagement, citizens across France have united in a widespread movement demanding a referendum on the establishment of a 6th Republic. This call for change is fueled by widespread dissatisfaction with the current political system, perceived corruption, and a desire for greater democratic representation. Activists argue that a new republic could better reflect the needs and values of the French people, moving away from the centralized power that has characterized previous administrations."
 france.114.t:0 "The People demand a Referendum on the New Republic!"
 france.115.a:0 "Finally!"
 france.115.d:0 "In a stunning turn of events, Jean-Luc Mélenchon has been arrested for alleged treason against France.\nThe arrest, carried out by French law enforcement agencies on the order of President Villiers, followed a thorough investigation that uncovered substantial evidence suggesting Mélenchon's involvement in activities deemed detrimental to the country's interests. While specific details surrounding the charges remain undisclosed, it is believed that Mélenchon was engaged in acts that threatened the sovereignty, security, or stability of France during the election of 2022. The arrest has triggered a wave of reactions across the political spectrum, with officials expressing a mixture of astonishment and concern.\nThe government has stressed the importance of upholding the rule of law and preserving national integrity in the face of any threats to the nation's well-being. Security has been heightened across various critical locations, including government buildings and public spaces, as authorities remain vigilant in the wake of this arrest. The event has also prompted discussions about the need for stricter measures to safeguard the country against potential internal threats."
 france.115.t:0 "Mélenchon Arrested for Treason Against France"
 france.116.a:0 "Zemmour pledges his Loyalty"
 france.116.d:0 "President Pierre de Villiers engaged in a high-stakes meeting with his opponent, Éric Zemmour, to explore the possibility of uniting their respective parties. The meeting, held behind closed doors, has generated significant speculation and drawn attention from across the political spectrum. President de Villiers met with Zemmour, a prominent political commentator and former presidential candidate, in an undisclosed location to discuss the potential for party unity. While details of the meeting remain confidential, it is believed that the two figures engaged in a candid and in-depth conversation about their shared goals, ideological alignment, and the potential benefits of a united conservative party."
 france.116.t:0 "Villiers meets with Zemmour in Élysée Palace"
 france.117.a:0 "A Royal Resurgence?"
 france.117.d:0 "A recent poll conducted across universities in France has revealed a surprising increase in support for monarchism among college voters following the election of President Pierre de Villiers. The findings of the poll indicate a notable shift in political preferences among young people, with a growing number of students expressing an interest in exploring alternative forms of governance.\nThe rise in monarchist sentiments among college voters can be attributed, in part, to President de Villiers' strong leadership qualities and his emphasis on stability, tradition, and national unity. His presidency has sparked discussions about the role of a constitutional monarchy in modern society, with proponents arguing that a monarch could serve as a unifying symbol and provide a sense of continuity amidst political and social challenges. The poll results also suggest that young voters are seeking alternatives to the traditional left-right political divide and are open to exploring different political ideologies. Monarchism, once considered a fringe idea, has gained traction among college students who see it as a departure from the shortcomings of the current political system."
 france.117.t:0 "French College Voters Show Increased Interest in Monarchism after Election"
 france.118.a:0 "A Strong Display of Power"
 france.118.d:0 "In a display of patriotism and national unity, President Pierre de Villiers organized a grand military march that captivated the attention of citizens across France. The event, stretching across the entirety of Paris, showcased the President's deep appreciation for the armed forces and aimed to highlight the nation's strength and unity in the face of challenges."
 france.118.t:0 "Military March in Paris"
 france.119.a:0 "At least we could work with Marine."
 france.119.d:0 "In a remarkable attempt to foster national unity and address the pressing challenges facing France, President Emmanuel Macron held discussions with political rivals Jean-Luc Mélenchon and Marine Le Pen to explore the formation of a National Unity Government. However, tensions quickly escalated during the discussions, and Mélenchon abruptly left the meeting, expressing his dissatisfaction with the proposed terms and the potential compromise on his party's core principles. His departure underscored the deep ideological differences that persist among the political factions in France.\nPresident Macron and Marine Le Pen continued their discussions, exploring the possibility of collaboration and shared policy objectives. Their willingness to engage in dialogue across traditional political boundaries demonstrates the pressing need for broader cooperation in tackling the significant challenges facing the country."
 france.119.t:0 "Mélenchon walks out!"
 france.1191.a:0 "Goodbye Opposition."
 france.1191.d:0 "French authorities seemed to have uncovered some of the most heinous and traiterous plots against Emmanuel Macron from the conservative opposition in parliament. The details of the plot are clear and without uncovering this, who knows what could have happened.. Macron personally ordered the authorities to sentence all connected to the plot, who were coincidentally all members of the opposition. Due to the enacted martial law, elections cannot be held, which has only benefitted Macron more as he has immediately enacted a list of loyal members of his party to fill the seats of parliament members removed."
 france.1191.t:0 "The Plot Exposed"
 france.120.a:0 "Three Cheers for Centrism"
 france.120.d:0 "In a surprising move aimed at fostering unity and addressing the challenges facing France, President Emmanuel Macron has announced a forthcoming meeting with political rivals Jean-Luc Mélenchon and Marine Le Pen to discuss the formation of a National Unity Government. The announcement has sparked intense speculation and drawn attention from across the political spectrum. The proposed meeting, scheduled to take place in the coming days, signals Macron's commitment to transcending traditional political divisions and seeking broad-based collaboration in governance. By engaging with Mélenchon, the leader of France Insoumise, a left-wing party, and Le Pen, the leader of the National Rally party with right-wing leanings, Macron aims to demonstrate a willingness to bridge ideological gaps and build a united front to address pressing national issues."
 france.120.t:0 "Macron meets with Mélenchon and Le Pen"
 france.121.a:0 "A New Era emerges for the Mediterranean"
 france.121.d:0 "In a significant development aimed at fostering regional cooperation and economic integration, President Emmanuel Macron has announced the creation of the Treaty of Malta, a new economic group comprising several Mediterranean countries. The treaty aims to strengthen ties, promote trade, and enhance collaboration among Croatia, France, Spain, Italy, Slovenia, Montenegro, Albania, Greece, and Turkey. Each country brings unique strengths and resources to the group, fostering the potential for collaborative projects, knowledge sharing, and the development of regional initiatives.\nThe Treaty of Malta is expected to create a platform for fruitful exchanges, encouraging cross-border investments, promoting tourism, and facilitating the sharing of best practices in various sectors, including agriculture, energy, infrastructure, and technology. It also provides an opportunity for member countries to collectively address shared challenges such as climate change, migration, and security concerns."
 france.121.t:0 "President Macron Unveils Treaty of Malta"
 france.1211.a:0 "Yay"
 france.1211.b:0 "Nay"
 france.1211.d:0 "The Treaty of Malta aims to foster regional cooperation, enhance economic integration, and promote shared prosperity among Mediterranean countries. By joining our group, you will have the opportunity to actively participate in a dynamic platform that focuses on mutually beneficial collaboration, knowledge exchange, and joint initiatives aimed at unlocking the immense economic potential of the region."
 france.1211.t:0 "Treaty of Malta - Yes or No"
 france.122.a:0 "A Bloated Administration Popped"
 france.122.d:0 "In a bold and decisive move, President Eric Zemmour's implementation of administrative cutbacks has showcased significant success, leading to improved efficiency and fiscal gains for the nation. The president's commitment to streamlining bureaucracy and reducing government spending has yielded positive outcomes, signaling a promising start to his tenure. President Zemmour's administrative cutbacks, introduced as part of his broader agenda for governmental reform, aimed to enhance efficiency, eliminate redundancies, and reduce the financial burden on taxpayers. By undertaking strategic measures to streamline administrative processes, the president sought to create a leaner and more effective governance structure."
 france.122.t:0 "President Zemmour's Administrative Cutbacks Yield Remarkable Results"
 france.123.a:0 "Zemmour may have his way... But will France?"
 france.123.d:0 "In a major development that has reverberated across France and Europe, President Éric Zemmour has announced plans to hold a referendum on France's membership in the European Union. The proposal, known as FREXIT, marks a significant shift in France's political landscape and has ignited intense debates and discussions about the country's future relationship with the EU. The announcement of the FREXIT referendum has drawn mixed reactions from various segments of society. Supporters view it as an opportunity to assert France's sovereignty, regain control over economic and immigration policies, and protect national interests. They argue that leaving the EU would allow France to forge its own trade agreements, make independent decisions on key issues, and regain control over its borders. Opponents of the FREXIT referendum express concerns about the potential consequences of leaving the European Union. They emphasize the benefits of EU membership, including access to a single market, economic stability, and collaborative efforts to address global challenges."
 france.123.t:0 "Referendum on FREXIT"
 france.1231.a:0 "A Disappointing outcome for Zemmour"
 france.1231.d:0 "In a surprising turn of events, France has voted to remain a member of the European Union in the highly anticipated FREXIT referendum, defying expectations and delivering a blow to right-wing President Eric Zemmour's vision for an EU exit. The outcome of the referendum highlights the complex dynamics and diverse opinions within the French electorate regarding the country's future relationship with the EU. The result of the FREXIT referendum has far-reaching implications for France and the European Union as a whole. It indicates that a significant portion of the French population values the benefits and opportunities provided by EU membership, including access to the single market, free movement of people, and collective decision-making on important issues. President Zemmour has yet to make any public appearance to acknowledge the victory for the EU, but is reportedly in the midst of launching multiple electoral lawsuits against his own government."
 france.1231.t:0 "France Votes Stay"
 france.1232.a:0 "'Cya later suckers!"
 france.1232.b:0 "A soft exit is preferable"
 france.1232.d:0 "In a landmark decision that has sent shockwaves across Europe, France has voted to exit the European Union (EU) in the highly anticipated FREXIT referendum. The outcome of the vote reflects a seismic shift in French politics and marks a turning point in the country's relationship with the EU. The decision to leave the EU poses significant implications for both France and the broader European Union. As one of the EU's founding members, France's departure raises questions about the bloc's cohesion, the future of integration efforts, and the stability of the eurozone. It is expected to usher in a period of intense negotiations between France and the EU to determine the terms of their separation and establish a new framework for their relationship."
 france.1232.t:0 "France Votes Leave"
 france.124.a:0 "We shall liberate your homeland, do not fret."
 france.124.d:0 "In a show of solidarity and a call for international support, Russian dissidents have organized a march in France to draw attention to human rights abuses and advocate for greater freedom in Russia. The march, held in a symbolic gesture of defiance against the Russian government's war in Ukraine and the Baltics, seeks to shed light on the plight of activists, journalists, and individuals facing persecution in Russia.\nThis march has been called a farce by the regime in Moscow, but has hit home with the people of France, strengthening the resolve to topple the current regime. "
 france.124.t:0 "Russian Dissidents Organize March in France"
 france.125.a:0 "You shall soon reclaim your home!"
 france.125.d:0 "In a significant development in the European War, Russian dissidents have formed military brigades in France, dedicated to countering the oppressive regime and fighting for freedom. Composed of defectors from the Russian military, activists, and individuals with military experience, these brigades aim to confront the injustices and stand up against the repressive tactics employed by the Russian government. The formation of dissident military brigades in France also serves to strengthen the international solidarity with the Russian opposition. It signifies a collective stand against human rights abuses and sheds light on the ongoing struggle for democracy within Russia. "
 france.125.t:0 "Formation of Russian Dissident Brigades"
 france.126.a:0 "Traitors!"
 france.126.d:0 "After a brief skirmish in the French Countryside, we were finally able to find the remaining cowardly disloyal generals who threw France into this mess hiding like rats inside a half built shack. As we brought them out to the field, The self proclaimed saviors of France who followed a delusional ideology that claimed the French people were superior to everybody else began to weep and cry, begging for mercy and for their lives to be spared. Our soldiers stood there with fury in their eyes at these cowardly generals and as they began to point and load their rifles, the so called generals tried to utter more lies but a volley of bullets would silence them, before they had the chance to utter more lies.\n\nAnd with that, The fascist remnants in our nation were eradicated from our nation, ensuring that they will never harm us again. "
 france.126.t:0 "Trial of the Supporters of the Coup d'état"
 france.127.a:0 "Red Scum!"
 france.127.d:0 "The Communist Sympathizers were finally rounded up in Paris, their leaders were now at our mercy. Their hypocritical Ideology that claims to liberate all the workers of France that would only allow our people to starve to death is finally being put down. The so-called disgusting saviors of the Workers were put on display in a street with the firing squad preparing to fire as passersby watched them beg for mercy.\n\nOvertime, a crowd would gather. This crowd was an enraged mob who threw harsh insults at the cowardly leaders, calling them Traitors, Rapists and Murderers. As the firing squad was prepared, the Crowd began to cheer as the squad opened fire.\n\nIn the end, there was only blood and the filthy corpses of the traitors left as the mob began to disperse, returning to their daily lives.\n\nAnd in this way, we can be sure that the nightmare that is communism dies in France forever."
 france.127.t:0 "Trial of the Communist Sympathizers"
 france.128.a:0 "The ancestors of Free France unite us."
 france.128.d:0 "After the dust settled from the nation's bloody civil war, the victors immediately set their sights on the grand historical goal of fully unifying France. Naturally, their attention turned to the Mediterranean gem that the ancient Greeks called the 'most beautiful island'—Corsica. When the civil war broke out, the National Navy, which had withdrawn from the mainland, protected the island, sparing it from the ravages of war.\n\nThe French Republic has issued a formal demand to the Corsican Naval Command, requiring them to pledge allegiance to the central government in Paris. Additionally, they are to send key elements of the fleet, including aircraft carriers, to Toulon Harbor, where French naval officers and sailors will take command of the fleet. After a brief discussion, the admirals agreed to comply with the Republic's demands. There was no internal opposition to the prospect of rejoining the motherland."
 france.128.t:0 "French Republic demands return of Corsica and Naval fleet"
 france.129.a:0 "Traitors to the Republic!"
 france.129.d:0 "The cowardly Fascist Junta government sat there all tied up on the street, looking beaten up in front of a mob of Parisians. As we read out the many many horrendous crimes against the French people, Despite their foolish ideology claiming how great the French people are how superior they are from others, once we began to lift their leaders up to the guillotine the cowardly fascists began to plead for mercy like the wretches they were. As their last ditch attempt they tried to appeal to the crowd, encouraging them to revolt against our regime.\n\nThis sparked a furious rage within the crowd, causing them to rightfully throw harsh insults at the fascist pigs, some even grabbing items from the street and throwing at it them and with some even attempting to climb over and attack them, but in order to maintain order we had to stop them with our police. Infront of a massive crowd that was chanting slogans such as 'NO MERCY TO THE FASCIST PIGS' they would be executed by the Guillotine with their heads, a symbol of Tyranny thrown into the flames in order to forever extinguish this disgusting ideology. \n\nIn this way, the candle of Fascism in France is blown out forever."
 france.129.t:0 "Trial of the Fascist Junta and its crimes against the French People"
 france.130.a:0 "Traitors to the People!"
 france.130.d:0 "The bastards of the old regime were discovered hiding like rats in a shack outside of Paris and as they were paraded throughout Paris on a trailer, Crowds of people gathered to watch as they were publicly displayed, The crowd rightfully furious at the cowardly old politicians that ruined our beautiful country began to throw rocks and insults at all the leaders as they approached the Guillotine. Some of them would make makeshift signs from cardboard boxes that contained slogans such as "NO MERCY TO THE LIBERALIST OLIGARCHS" and "DEATH TO THESE TRAITORS".\n\nAs they were brought up on the guillotine, the wretched liberals requested to say a few words before their inevitable execution like the spineless cowards they were, instead of showing remorse for their actions they would instead try to spread lies and try to turn our people against us, Instead of remorse, their words were drowned out by the enraged chants of the crowd demanding "OFF WITH THEIR HEADS" The blade would finally fall on every single traitor with each strike destroying the remnants of the old order. Their heads, a symbol of pain and suffering were thrown into the flames to forever be burnt to ashes. With that, the shame and evil that the old regime brought onto our nation is now apart of France's long history."
 france.130.t:0 "Trial of the Liberalist Oligarchical Politicians"
 france.131.a:0 "The puzzle of the People's Nation is complete."
 france.131.d:0 "After the dust settled from the nation's bloody civil war, the victors immediately set their sights on the grand historical goal of fully unifying France. Naturally, their attention turned to the Mediterranean gem that the ancient Greeks called the 'most beautiful island'—Corsica. When the civil war broke out, the National Navy, which had withdrawn from the mainland, protected the island, sparing it from the ravages of war.\n\nThe new French People's Republic has sent a formal notice to the Corsican Naval Command, demanding their immediate allegiance to the revolutionary government. They are also required to accept inspection by a special envoy from the revolutionary government. After this, the large ships stationed in Corsica will return to the mainland under the envoy's supervision.\n\nAfter several days of discussion, the admirals agreed to comply with all the central government's demands. Despite some internal doubts about the new Red France, most naval personnel remain hopeful about the prospect of rejoining the motherland."
 france.131.t:0 "French People's Republic demands return of Corsica and Naval fleet"
 france.132.a:0 "And there will be no critics!"
 france.132.d:0 "As our troops move deeper into the heart of the red menace we continue to see the same old story. We secure another great victory, one step closer to reclaiming our country, yet the communards still linger with rebellion and insurgency along the countryside and even with cities. Our jails have long overflowed with these leftists, socialists, and communists alike and immediate action must be taken if we wish to see any real progress within our new government. There will be no more unpatriotic opposition to the real changes and new era of France that we reach out to achieve. Real change can only be signified with actions that the weak would not dare dream... But we dared to dream."
 france.132.t:0 "Trial of Leftists, Communists, and Soviet Spies"
 france.133.a:0 "Liberal Dogs..."
 france.133.d:0 "The courthouses remained packed since we first started taking territory back from the traitorous French Republic at the start of the Civil War. Now we are finally able to commence our righteous justice on those who wished to destroy France from the inside and out. Most were given harsh sentences so they could rot somewhere out of sight where they belonged while others like the previous administration we're given a more immediate sentence as revenge for destroying our once proud nation. This is only the start of our righteous crusade against the evils that have plagued our nation for decades."
 france.133.t:0 "Trial of Anti-French Liberals"
 france.134.a:0 "Napoleon's homeland returns to France."
 france.134.d:0 "After the dust settled from the nation's bloody civil war, the victors immediately set their sights on the grand historical goal of fully unifying France. Naturally, their attention turned to the Mediterranean gem that the ancient Greeks called the "most beautiful island"—Corsica. When the civil war broke out, the National Navy, which had withdrawn from the mainland, protected the island, sparing it from the ravages of war.\n\nThe new French Government of National Defense has issued a formal notice to the Corsican Naval Command, demanding their immediate allegiance to the Paris. At the same time, the fleet must be disarmed and remain on the island until domestic naval officers and sailors can take over.\n\nAfter lengthy and heated discussions, the admirals, fearing military reprisals, ultimately agreed to comply with all of the National Defense government's demands. Although there were significant internal disagreements about rejoining the motherland, no one dared defy the decision of their superiors."
 france.134.t:0 "French Government of National Defense demands return of Corsica and Naval fleet"
 france.135.a:0 "A New Regime emerges"
 france.135.d:0 "In the aftermath of a bloody civil war that ravaged the nation, a military junta has been established to restore order and stability. The junta, comprised of high-ranking military officials, has taken control of the government, citing the need for strong leadership in the face of widespread chaos. As the junta consolidates its power, it faces the daunting task of rebuilding the war-torn nation and restoring faith in the government. The road ahead is fraught with challenges, but the junta remains steadfast in its commitment to restoring peace and prosperity to the nation."
 france.135.t:0 "Military Establishes New Government"
 france.136.a:0 "These men can't be trusted"
 france.136.b:0 "Together, we shall secure France's future!"
 france.136.d:0 "In the wake of the establishment of a military junta following a bloody civil war, many broadly fascist politicians and militia leadersled by Yven Benedetti, have demanded a seat at the table in the new government. Claiming to represent the interests of a significant portion of the population, the fascists argue that their importance in the Civil War  should be represented in the new ruling body. However, their demands have sparked controversy and division among the junta and the populace at large."
 france.136.t:0 "French Fascist groups demand Government Representation"
 france.137.a:0 "Salut!"
 france.137.d:0 "Benedetti stepped onto the Balcony of the Elysee Palace, gazing down at the crowds of Thousands of people who gathered to see him speak. He could feel the pressure at that moment, there was no room for mistakes.\n\nAs he grabbed the microphone something ignited inside of him, it was built up anger. A seething rage at the Russians and the corrupt elite that destroyed his beautiful country and forced many of his beloved French people to die. He stated that France was finally free of the corrupt elitist that sold their country out to foreigners and tried to replace their culture and people with strangers. He also began to speak of the Soviets, calling them, subhuman pieces of trash. He vowed to every man and woman watching that speech that he would raise a grand army and march to Moscow to personally burn to the ground in order to avenge every Fallen Frenchman that died fighting them in the European War.\n\nBenedetti looked on as the crowd didn't just begin to cheer, they began to chant slogans such as ''DEATH TO THE SOVIET PIGS!'' and ''GLORY TO BENEDETTI!''\n\nAt that moment he realized, He wasn't just a leader. He knew he was destined to be the savior of France, A fearless warrior who was prepared to do whatever it takes to restore their country's greatness, even if it costs the blood of millions on the other side of the continent. He won the people and he knew he could not disappoint them."
 france.137.t:0 "Benedetti Inaugurated as Dictator of France"
 france.140.a:0 "Grant the Ducal Title to Jean, Count of Paris"
 france.140.b:0 "Grant the Ducal Title the Prince of Wales, Prince William"
 france.140.c:0 "Dissolve the Breton Diet"
 france.140.d:0 ""
 france.140.t:0 "The Breton Comprimise"
 france.141.a:0 "Damnit!"
 france.141.b:0 "Not for Long..."
 france.141.d:0 "Even with our best efforts to calm them, the Majid Kattan protests simply continue escalating, ad infinitum. Rioters breaking things in the streets, burning flags, taking up streets and constantly fighting against us, even with the concessions and counteractive measures we have taken.\n\nThe state of things continuously degrades, no matter what it is. Seemingly, every day, more and more turn against us, more and more fight against the state, over the death of a single man. Why? The officer responsible has already been held to justice, why? What is the purpose of it all, why continue to fight?\n\nNo matter how much we question, it does not change the situation. The riots must end, come hell or high water."
 france.141.t:0 "Riots Worsen"
 france.142.a:0 "This isn't America!"
 france.142.d:0 "The people of France have been severely angered by the news of the killing of an unarmed Tunisian National named Majid Kattan in Bobigny, a suburb of Paris. A video that surfaced on social media of the man being yelled aggressively to get down, Despite Majid's efforts to cooperate with the police, he would be shot by an unnamed Police Officer. This has sparked mass outrage with a huge protest being organized at the Police Headquarters with people calling for the arrest of the unnamed officer and yelling out slogans such as "Justice for Kattan!" These slogans have gone viral in French media and more and more people are joining in the protests that have escalated into rioting, as during last night the demonstrators torched cars, trashed the city, vandalized bus stops and shot fireworks into the police. Although we did not receive this news up until now, Paris is already engulfed in the chaos and flames of Anarchy."
 france.142.t:0 "Violence erupts after the Killing of Majid Kattan"
 france.143.a:0 "Every man for himself!"
 france.143.d:0 "Amidst France's focus on their escalating war with Russia, the military government in Algeria has collapsed, plunging the region into chaos. The government's neglect of Algeria, coupled with its preoccupation with the war effort, has fueled resentment among the Algerian population. This, combined with growing unrest and a lack of effective governance, has led to the collapse of the military government."
 france.143.t:0 "The Sickly Government"
 france.144.a:0 "Wait guys don't ACTUALLY use those guns."
 france.144.d:0 "We have made a grave mistake. With the best of hopes, we armed the counter-protestors with weapons that we hoped would be used for peace, giving them rubber bullets and various other countermeasures to use against the violent protestors. However, violence begets more violence.\n\nAll we have caused is further escalation, shorts fired. Now given yet more reason for their agitation, the protestors have become even more violent and even more expansive than before, a torrent of righteous anger cascading across the nation of France. There is nothing that may now extinguish the fire."
 france.144.t:0 "Counter-Protestors Armed"
 france.145.d:0 "Following the collapse of the French Military Government in Algeria, the remaining Military officers stationed within Algeria have empowered Jacques Villard and his various resurgent Pied-Noir groups. \n\nThese groups, with the newfound power over the land that has for a long time oppressed the French speaking populace, has established a semi-apartheid state called the Fédération des Deux Rives."
 france.145.t:0 "Pier-Noir State Established"
 france.146.a:0 "Outright Despotism!"
 france.146.d:0 "To Whom It May Concern, \n\nAs the tides of nationalism rise within our great nation, it is my duty to express my growing concern over the current government's inability to address the pressing needs of our people. The time has come for military leadership to step forward and guide our country toward strength and stability. Our influence can no longer be sidelined; we must assert our presence to ensure that the interests of France are protected. It is imperative that we stifle any efforts by the ruling government that jeopardize our national integrity. \n\nSigned, [THIS.GetRank] [THIS.GetName]"
 france.146.t:0 "Military abuses Political Connections"
 france.147.a:0 "Debt debt debt..."
 france.147.d:0 "To the Ministry of Finance, \n\nIn light of recent developments, I have taken the liberty of reallocating substantial government funds for military operations deemed essential for national security. While these expenditures are vital for maintaining our preparedness, it is essential that the ruling government understands the gravity of the situation. Should the government wish to question these expenditures, I will ensure that the bill is handed back to them, as the safety of our nation cannot be compromised by bureaucratic delays. \n\nSigned, [THIS.GetRank] [THIS.GetName]"
 france.147.t:0 "Military hands us the Bill"
 france.148.a:0 "Fuck you too then!"
 france.148.d:0 "To my Fellow Officers, \n\nIt has come to my attention that our stance against the current government's policies has been met with mixed reactions. However, we must remain resolute in our posturing. By openly challenging the government's decisions, we highlight our commitment to the true needs of our nation. While this may cause instability, it is a necessary step to demonstrate that the military stands as a formidable force in the face of poor governance. The people must see that we are prepared to protect their interests. \n\nSigned, [THIS.GetRank] [THIS.GetName]"
 france.148.t:0 "Military postures against the Government"
 france.149.a:0 "Well, this isn't too bad"
 france.149.d:0 "To the Command, \n\nI am pleased to announce the formation of a new division dedicated to the ideals of nationalism that resonate with our people. This division will operate under the principles that prioritize the welfare of France and its citizens, independent of the current government's influence. It is crucial that we establish a force that reflects the aspirations of the populace, as our loyalty now lies with the nation itself, rather than the individuals currently in power. We must prepare for the challenges ahead. \n\nIn service to our nation, [THIS.GetRank] [THIS.GetName]"
 france.149.t:0 "Military creates new Division"
 france.151.a:0 "[THIS.GetRank] [THIS.GetName]"
 france.151.d:0 "I trust this letter finds you in good health and high spirits. It is with great honor and respect that I take this opportunity to extend my heartfelt gratitude for your unwavering and exceptional service to our beloved country, France.\n\nYour strategic vision and wise decision-making have significantly contributed to the security and prosperity of our nation. Your unwavering support for our armed forces has not only bolstered our capabilities but has also fostered a sense of unity and purpose among the military ranks."
 france.151.t:0 "Dear President [FRA.GetLeader]"
 france.152.a:0 "[THIS.GetRank] [THIS.GetName]"
 france.152.d:0 "I hope this letter finds you in good health and high spirits. I am writing to you with a sense of deep regret and humility regarding the previous letter I sent, in which I berated your leadership abilities. Upon reflection and consideration, I have come to realize the inappropriateness of my words and the lack of respect that they conveyed.\n\nWhile I may not fully agree with every decision or direction you have taken as the President, I understand the immense complexity of your role and the challenges you face in leading our nation. It is my hope that we can all work together, regardless of our differences, to find common ground and solutions that benefit the French people."
 france.152.t:0 "Dear President [FRA.GetLeader]"
 france.1521.d:0 "I hope this letter finds you in the finest of moods. You'll be pleased to know that I am writing to express my most sincere and overflowing gratitude for rescuing me from the depths of my utterly uneventful and dull forced retirement. What an exhilarating turn of events it has been, thanks to your remarkably astute decision-making.\n\nYour impeccable timing in reversing my exile from active service could not have been more opportune. Just when I thought I had become far too comfortable with the leisurely pace of retirement, you valiantly pulled me back into the fray. The prospect of once again navigating the intricacies of military bureaucracy and facing the myriad political nuances that had led to my retirement was a thought that kept me up at night. You, sir, are my hero."
 france.1521.t:0 "Dear President [FRA.GetLeader]"
 france.153.a:0 "[THIS.GetRank] [THIS.GetName]"
 france.153.d:0 "I hope this letter finds you well. I am writing to you with a profound sense of gratitude and honor for mentioning me during the recent military meeting. Your recognition of my contributions and those of the armed forces is deeply appreciated, and I am humbled by your kind words.\n\nI assure you, that I am more motivated than ever to continue upholding the principles of honor, integrity, and discipline that our armed forces stand for. Your recognition reinforces my dedication to serving our nation to the best of my abilities and contributing positively to its growth and prosperity."
 france.153.t:0 "Dear President [FRA.GetLeader]"
 france.1531.a:0 "[THIS.GetRank] [THIS.GetName]"
 france.1531.d:0 "Allow me to muster all the enthusiasm I can to extend my gratitude for the honor you've bestowed upon me - the chance to retire from the military. I am left virtually speechless, or perhaps the better word is ''astonished,'' by your impeccable timing in this matter.\n\nIt's not every day that a seasoned military general is fortunate enough to have their impending retirement thrust upon them in such a considerate and compelling manner. Truly, your knack for decision-making is awe-inspiring, to say the least. The anticipation of leisurely days, devoid of the heart-pounding adrenaline of active service, was becoming an unbearable burden, and I am indebted to you for liberating me from such a torturous fate."
 france.1531.t:0 "Dear President [FRA.GetLeader]"
 france.1532.a:0 "[THIS.GetRank] [THIS.GetName]"
 france.1532.d:0 "I hope this letter finds you in the finest of moods. You'll be pleased to know that I am writing to express my most sincere and overflowing gratitude for rescuing me from the depths of my utterly uneventful and dull forced retirement. What an exhilarating turn of events it has been, thanks to your remarkably astute decision-making.\n\nI must express my admiration for your bold commitment to disregarding political biases and valuing the unique brilliance that an individual like myself brings to the table."
 france.1532.t:0 "Dear President [FRA.GetLeader]"
 france.154.a:0 "[THIS.GetRank] [THIS.GetName]"
 france.154.d:0 "I write this letter with a heavy heart and a sense of profound disappointment in the leadership you have displayed during your tenure as the President of our nation. It is with great regret that I must express my grave concerns regarding what I perceive as a significant lack of competence in your role as the leader of our country.\n\nAs a military general who has dedicated my life to the service of this nation, it is distressing to witness a lack of strategic vision and an absence of strong leadership at the highest level."
 france.154.t:0 "Dear President [FRA.GetLeader]"
 france.160.a:0 "All for the Victors"
 france.160.d:0 ""
 france.160.t:0 "Establishment Collapses"
 france.161.a:0 "Léaument shall give the opening remarks"
 france.161.b:0 "Roussel shall give the opening remarks"
 france.161.c:0 "Daeninckx shall give the opening remarks"
 france.161.d:0 "At last, a congress has been called of all of the fellow minds and thinkers of the proletariat and the vanguard of our socialist republic. However, even with this congress beginning, the speaker of the opening has not yet been decided, one of the most important positions of the speaker within this grand meeting.\n\nMany push for the forebearer of our revolution, Fabien Roussel, the one who has led us here to speak for us all at the beginning. After all, without him, without his guidance, where would we be now? Under the jackboot of fascists, or still following the misguided delusions of the republic? They believe that he is the most important and prominent figure within our revolution.\n\nWhile this is true for many of us, some believe that the more liberal and political mind of Didier Daeninckx should take charge and give the opening remarks, a position held by the more decentralized and more utopian minded socialists and communists within our ranks. No matter which decision we make, the course of our state will be swayed immensely by who is chosen, so we must deliberate, and choose wisely."
 france.161.t:0 "Meeting of the Revolutionary Minds"
 france.162.a:0 "They are a source of National Pride"
 france.162.b:0 "They are the sword of the Proletariat!"
 france.162.c:0 "They are an instrument of Tyranny"
 france.162.d:0 "The army is something that has caused much debate within our congress, it is something that has always been controversial within our circles ever since the birth of the left. The army is something that was once used to protect the state and destroy those hopeful socialists and revolutionaries. We must now decide what to do with the archaic system.\n\nSome are of the belief that the armed forces are a direct arm of the proletariat, that they are the tool that they can use to spread the revolution further, the saber that will bring liberation to all people by the will of the people. A weapon that is for and by the working class, no more and no less.\n\nHowever, many view the reactionary history of the army and consider it to be only useful as a tool of oppression, something that can only be utilized by dictators and those forces who still fight for capital until their dying breath, still seeing it as nothing but a horrendous and disgusting stain on the history of the world that should and must be done away with as soon as possible.\n\nWithin these two extremes of thought, there is a middle ground - the idea that the army simply must exist to protect our revolution. The army is not something that should be glorified, nor is it something that should be reviled. It is the means by which we will protect our people and protect France, it is something we must begrudgingly accept for our people."
 france.162.e:0 "They are a means to and end."
 france.162.t:0 "The Matter of the Armed Forces"
 france.163.a:0 "We are the birthplace of Revolution"
 france.163.b:0 "We are but the First Domino of the Global Revolution"
 france.163.c:0 "The People are the Spear of the Revolution"
 france.163.d:0 "The Proletariat are the center of the revolutionary struggle, this is something that the entire council agrees on. However, there is great debate within our ranks as to the true role of the proletariat within our newly established nation.\n\nMany within our ranks are idealists, those who believe that the world revolution is inevitable, something that we should stand for and fight with, for the workers of the world. They believe entirely and truly that we are capable of freeing the global proletariat.\n\nAlong with this, there are many who believe that the proletariat are the weapon to fight against oppression, a tool of revolution in perpetuity. They are the judge and executioner of the freedom that they desire, and they should and will fight for that freedom.\n\nThe third position is the idea that the revolution is something that has already been accomplished and begun, that the proletariat are a liberated class within france, and that we must maintain their liberty and freedom as the beating heart of the revolution, no matter what strife may come."
 france.163.e:0 "The People are the Heart of the Revolution"
 france.163.t:0 "The Matter of the Proletariat and Working Class"
 france.164.a:0 "The State must secure the Revolution and our Culture"
 france.164.b:0 "The State must work to advance the Global Revolution"
 france.164.c:0 "The State is to be dissolved!"
 france.164.d:0 "The state is something that has been disputed within Communist and Socialist thought ever since the writings of Marxs and Engels. It is our most fundamental disagreement, something that we have consistently disagreed with even with our closest of brethren. These must be put to a halt, and a final point on the matter of the state must be decided.\n\nThe position held by most is that the state must exist, it is a fundamental corner that helps protect the proletariat and our people. It is something that should work internationally to liberate other workers, and something that should always seek to spread global liberation. While largely uncontroversial, there are still many disagreements.\n\nFrom an anarchist position - the state itself is an oppression of the worker. It should not exist because the existence of a state itself is in effect forcing the worker to abide by systems that are in place by people of a higher standing forcing them down. While it is unpopular outside of the circle that Coupat informally leads, it is still something we must consider. The abolition of the state, after all, is something that one could argue even Marx wanted.\n\nOn the other hand of this there is a position that is often advanced by Trotskyists and others of similar belief, the thought that the state must exist solely to further advance the revolutionary society. The state is something that the workers can use and rally against in their time of need, it is something that the workers can fight against and seek freedom from, a sustainment of permanent revolution and the advancement of the rights of the proletariat through the constant overturning of oppressors.\n\nWe must be wary with this decision, as it is the most critical one. It will forever be part of French history, for better or for worse - the state is the crux of the direction of her revolution."
 france.164.e:0 "The State must advance the Revolution and Society"
 france.164.t:0 "The Matter of the State"
 france.165.a:0 "Léaument shall lead!"
 france.165.b:0 "Arthaud must lead!"
 france.165.c:0 "Coupat shall be our Figurehead!"
 france.165.d:0 "The revolution is at a pivotal historical juncture, and it is essential to unify the various factions to ensure its achievements become deeply embedded in France's history, political system, social structure, and civic mindset. To this end, we must carefully select the chief representative of the revolution. This individual will not only speak for the revolution but will also serve as the most important channel for the people's voice and a symbol of national unity.\n\nAmong the leading candidates for Speaker, several individuals have emerged as the most competitive in the eyes of the people: Jean-Luc Mélenchon, founder of 'La France Insoumise', has long been a prominent left-wing leader with unparalleled political maneuvering experience and significant prestige among the general populace. Alongside him, members of the New Popular Front, who have been active in electoral politics, are also strong contenders. These include representatives from the New Anticapitalist Party, such as the staunch anti-bourgeois auto worker Philippe Léaument and the eloquent leader of the Workers' Struggle Movement, Nathalie Arthaud-both of whom are closely aligned with Trotskyist ideals.\n\nAdditionally, entrants from outside the political establishment have gained significant attention: anarchist activist Julien Coupat, who has served time in Macron's government prison and is known for his radical propositions; and perhaps the most striking candidate, Didier Daeninckx, a prolific writer with strong ties to the communist camp. His sharp critiques of the decaying social realities and class-based inequalities have earned him the support of the proletariat, the disdain of reactionaries, and the concern of moderates.\n\nSo, the people's choice is..."
 france.165.e:0 "Daeninckx leads!"
 france.165.f:0 "Mélenchon will lead!"
 france.165.t:0 "Speaker of the Congress is chosen"
 france.166.a:0 "Vive la Révolution!"
 france.166.d:0 "When the dust finally settled, the future of the revolution became clear, and an unprecedentedly bright horizon opened before the people of France.\n\nAs the revolution faced the threat of being hijacked by a nefarious alliance of revisionists and capitalist reactionaries, the patriots did not stand idly by. Under the leadership of true revolutionaries, the power-grabbing conspiracy was swiftly crushed. Just as the pioneers of 1789 did, decisive action was the only and best choice.\n\nFrom now on, we can cast aside all hindrances and begin to draw up our revolutionary blueprint for France. We will revive the values poisoned by capitalism, stabilize domestic order to unite the vast majority of the people, and focus on eliminating the accumulated ills of the old government. French socialism will no longer ebb and flow like the tide; instead, it will stand tall as a beacon lighting the way forward for this great and troubled nation."
 france.166.t:0 "Patriots of the Revolution take power"
 france.167.a:0 "Crush the False Reds!"
 france.167.d:0 "When the dust finally settled, the future of the revolution became clear, and an unprecedentedly bright horizon opened before the people of France.\n\nBeneath their mild and courteous facade, the sinister forces aiming to undermine the revolution have revealed their true colors, nearly leading France astray. Only through resolute and forceful action can we awaken the French people and thwart the devious schemes of the counter-revolutionaries. We will make the vast proletariat realize that, without the internal parasites corrupting the government, the stagnant bureaucrats, the silver-tongued lobbyists in parliament, and the boastful street activists, the revolutionary cause can continue and succeed.\n\nWhen the revolution is truly entrusted to the hands of the people, becoming a popular movement, the defenders of the revolution will naturally retreat from the front lines. But this does not mean they will withdraw from political life. Instead, they will stand with the people, immersing themselves in the tide of history's great change."
 france.167.t:0 "Anti-Reactionaries Rise Up"
 france.1671.a:0 "Crush these tyrants!"
 france.1671.b:0 "We must save the revolution!"
 france.1671.d:0 "A new player has entered the chaotic political arena of the Republic, and his growing influence is becoming impossible to ignore. General Nicolas Casanova, the military commander of Strasbourg, has rallied his supporters and announced the formation of a political organization called the ''French Revolutionary Guard.'' Interestingly, its name closely mirrors the ''Islamic Revolutionary Guard'' in countries like Iran, with similarities in their methods as well.\n\nAs a soldier, Casanova advocates for governing with an iron fist, blending military discipline with socialism to influence every aspect of French society. While he shows some tolerance for cultural traditions, he has a strong preference for Soviet-style authoritarianism and repression. He envisions the Revolutionary Guard as a breeding ground for a revolutionary vanguard, similar to the CPSU. In response to widespread defeatism and decline, Casanova sees revenge against Russia as the ultimate goal of the French revolution and calls for the establishment of a comprehensive national defense system. His faction aligns closely with the new Jacobin parties on the political spectrum but is more radical in terms of authoritarianism and militarism.\n\nWill he become France's Stalin, or is he merely another Boulanger-esque opportunist? Whether this will prove beneficial or detrimental remains to be seen."
 france.1671.t:0 "Anti-Revolutionary Uprising"
 france.168.a:0 "Vive la Révolution Noire!"
 france.168.d:0 "When the dust finally settled, the future of the revolution became clear, and an unprecedentedly bright horizon opened before the people of France.\n\n"Il n'est pas de sauveurs suprêmes, Ni dieu, ni César, ni tribun, Producteurs, sauvons-nous nous-mêmes !!"\n\nThe ultimate goal of revolutionary struggle is not to cultivate reverence for another form of power or submission to any order. On the contrary, true success is achieved only when people no longer fear authority or rulers, are resolute in their determination to control their own destiny, and unite against any attempts to dominate others.\n\nNow, we will accelerate this process. After years of arduous struggle and relentless advocacy, the Libertarian Communist Union born from the anarchist movement and workers' alliances has finally stepped into the spotlight. Any signs of corruption will be rigorously guarded against; taking power will not lead us to complacency. On the contrary, it will drive us to continue fighting inequalities across political, economic, environmental, cultural, and gender identity realms, with the ultimate goal of eradicating the last remnants of the old order."
 france.168.t:0 "Libertarian Communist Union take power"
 france.169.a:0 "Vive la Révolution Rose!"
 france.169.d:0 "When the dust finally settled, the future of the revolution became clear, and an unprecedentedly bright horizon opened before the people of France.\n\nThe French people have shown the world through their choices that Europe's socialist revolution can once again shine brightly in the 21st century, but in a completely new form. La France Insoumise, the backbone of the New Popular Front, has stood firm at the heart of corrupt regimes where numerous bourgeois spokespersons conspire. They have relentlessly fought against all injustices imposed on the people. Now, as former rebels become the new rulers, a new era is slowly unfolding before the French people. Many are left wondering: Can the revolution continue? Will history take a step backward once again?\n\nThe leaders of La France Insoumise are determined that such a dreadful scenario will never occur under their watch. It is time to cast off the bloody mantle that has shrouded Marianne. From now on, the cherished spirit of fraternity among the French people will be rekindled, and the revolution will transform into a new movement, driving profound changes at the very core of human nature."
 france.169.t:0 "France, Unmoving takes power"
 france.170.a:0 "Vive la Révolution Mondiale!"
 france.170.d:0 "When the dust finally settled, the future of the revolution became clear, and an unprecedentedly bright horizon opened before the people of France.\n\nThe working class has long made an irreplaceable and decisive contribution to the progressive cause and human rights in France. Whether in creating wealth or building a more equal society, workers have always been at the forefront, truly embodying the noble spirit of the French nation. Over the centuries, the repression and oppression targeted at the working class have been particularly brutal and severe. But today marks the end of that era. A political party that genuinely represents the just cause and powerful slogans of the working class has now taken the lead in France's revolution and socialist construction.\n\nThe Workers' Struggle Movement not only focuses on dismantling the remnants of reactionary capitalism in France but also looks beyond national borders. Across Europe and around the world, countless brothers and sisters of the working class are fighting for their own happiness. The progress of French workers will inspire them and sound the clarion call for a full-scale offensive against the decaying world."
 france.170.t:0 "Workers' Struggle Movement takes power"
 france.171.a:0 "Libération!"
 france.171.d:0 "For nearly two centuries, ever since the failure of the Paris Commune, France has been lost, wandering cluelessly in search of the right path. Time and again, it has stumbled into political quagmires, hindering its development and leading the nation nowhere. Venomous nationalism and narrow-minded isolationism seeped deep into our society, prevailing well into the 21st century. But today, all of that will change.\n\nSince our victory in the Civil War, we have successfully eradicated the militarists and the so-called liberal bourgeois capitalist scum. Both factions revelled in the destruction of our nation, seizing chaos as an opportunity to claw their way to power. Though they claimed to fight in the name of equality and liberty, their actions tell a different story, one of death and bloodshed.\n\nOur triumph over the ultimate evil is proof of our righteousness. We have achieved what was once deemed impossible. We have driven out the Nazi filth and purged the fascist dross from our land, something the FTP could only dream of during the Second World War. At last, we have truly liberated our nation from the grip of capitalists and fascists alike.\n\nThis is undoubtedly France’s new revolution, but it is not a revolution for France alone. It is a revolution for her people. No longer will they suffer under incompetent politicians or the meddling of capital. The means of production shall belong to the workers, and no one shall go hungry or live without a roof over their head. From this day forward, the people are our first and foremost priority, for without the people, there is no nation."
 france.171.t:0 "The New Age"
 france.199.a:0 "Corsica IS French!"
 france.199.d:0 "Tensions in Corsica have reached a boiling point as unrest erupts across the island. The spark that ignited the conflict was the death of Yvan Colonna, who was assassinated in prison by a Jihadist inmate. This has reignited long-standing grievances among Corsican nationalists, who viewed Colonna as a hero to the Corsican independence movement. \n\nProtests have broken out in major cities, with demonstrators decrying French inaction and citing it as reason for independence. The situation has escalated rapidly, with clashes reported between protesters and police forces. As Corsica teeters on the brink of unrest, the French government is faced with a challenging dilemma: how to address the grievances of Corsican nationalists while maintaining law and order on the island."
 france.199.t:0 "Corsica Unrest Begins"
 france.1991.a:0 "He's dead! Get over it!"
 france.1991.d:0 "The riots in Corsica show no signs of abating as violence continues to escalate across the island. The streets are filled with barricades, and clashes between protesters and security forces have become increasingly frequent. \nThe unrest has paralyzed Corsica, with businesses shuttered and transportation disrupted. As the situation deteriorates, the future of Corsica hangs in the balance, with the specter of further violence looming large."
 france.1991.t:0 "Riots continue in Corsica"
 france.2.b:0 "Topple Macron's Establishment!"
 france.200.a:0 "Peace Prevails!"
 france.200.d:0 "After weeks of turmoil, the riots in Corsica have finally come to an end. The actions of the French government to soothe dissent have been met with cautious optimism by the Corsican population, who are hopeful that a peaceful resolution can be achieved. As the dust settles, Corsica is left to assess the damage caused by the unrest. Buildings lie in ruins, businesses are struggling to recover, and scars of the conflict run deep. The island's future remains uncertain, with many wondering if lasting peace can be achieved or if Corsica will once again be engulfed in violence."
 france.200.t:0 "Calming Corsica"
 france.201.a:0 "Politics on Pause, Safety First!"
 france.201.d:0 "In a dramatic turn of events, the 2027 French election has been suspended indefinitely following a sharp increase in tension between Russia and Europe. The decision, made in the interest of national security, comes as France prepares to navigate a delicate diplomatic situation. With the threat of conflict looming, political leaders have agreed that now is not the time for partisan politics. Instead, the focus will be on ensuring the safety and stability of the nation in the face of external threats. \n\nAs news of the election suspension spreads, reactions are mixed. Some see it as a necessary precaution given the current climate, while others express concern over the implications for democracy. Regardless, the decision underscores the seriousness of the situation and the need for a united front in the face of potential aggression."
 france.201.t:0 "Upcoming Election Suspended!"
 france.202.a:0 "Glory to [FRA.GetLeader]!"
 france.202.d:0 "In an era of uncertainty and political instability, the French woke up to the sound of tanks on the streets of Paris. Early this morning, [FRA.GetLeader] and the French Armed Forces announced the overthrow of the civilian Socialist government led by Jean-Luc Melanchon. The military accused Melanchon and his administration of betraying the national interest and seeking to turn France into a communist state.\n\nIn an address to the nation, [FRA.GetLeader] said, 'We can no longer tolerate a course that is leading our great nation to the abyss. Under Mélenchon's leadership, France was sliding into communism, and this is a betrayal of our ideals and our history. We proclaim the creation of the Seventh Republic, which will be the true embodiment of national interest and stability.'\n\nSecurity measures have been tightened across the country. Military units are patrolling the streets and strategic sites have been taken over by the army. Many of Melanchon's politicians and supporters have been arrested and he himself has been placed under house arrest. The majority of the people of France are not happy, but are tolerant for now."
 france.202.t:0 "Military overthrows the Government"
 france.203.a:0 "And just like that, it's over..."
 france.203.d:0 "In our darkest moment, we also face our most humiliating moment as our diplomats travel to Vienna to make the official treaty of surrender by NATO forces. We have completely exhausted ourselves after losing Warsaw, Budapest, and even Bratislava with the Russians already establishing puppet regimes to maximize their control and influence in Eastern Europe. We tried to prepare ourselves for this conflict for the better half of the decade only to fail at the most crucial moment. The world will see this as a moment of our weakness and russian dominance over the continent."
 france.203.t:0 "Treaty of Vienna"
 france.2031.a:0 "What is Happening?"
 france.2031.d:0 "During an Afternoon stroll through the city streets of Martigues, Mélenchon was stopped by three local police officers. Following the a coordinated covering of the bodycams by the three officers, the situation quickly escalated, with two of the three officers restraining Mélenchon while the other read a list of crimes against France, before shooting his pistol twice into the former politician. The situation, caught on video and spread like wildfire on the internet, has been met with dejection and many have blamed the growingly despotic Military Advisement Council."
 france.2031.t:0 "Mélenchon shot by Police Officer in Martigues"
 france.2032.a:0 "You should've fought better!"
 france.2032.d:0 "The defeat against Russia deeply affected French nationalists and veterans, who felt betrayed by the government's handling of the war. In Northern France, a region with a strong nationalist sentiment and a high concentration of veterans, protests erupted against the government. Many of whom had fought in the war, demanded answers from the government about the reasons for the defeat and called for those responsible to be held accountable. They criticized the government for what they saw as a failure to protect French interests and honor on the battlefield. \n\nThe protests quickly gained momentum, with thousands taking to the streets to voice their anger and frustration. Some protesters called for a more aggressive foreign policy, while others demanded the resignation of government officials. The protests in Northern France posed a serious challenge to the government's authority and threatened to escalate into a larger confrontation."
 france.2032.t:0 "Veterans Protest in the North"
 france.2033.d:0 "The defeat against Russia deeply divided French society...  Protests have erupted in major cities after we officially signed the Treaty of Vienna. The protesters, largely composed of socialist, communist, and anarchist groups, criticized the government's handling of the war and called for a more peaceful and equitable foreign policy. \n\nThe protests, all over Southern France, grew in size and intensity, the government has struggled to contain the unrest. The military that wasn't already in open revolt in the North were deployed to maintain order, leading to clashes between protesters and security forces."
 france.2033.t:0 "The Red Banner of Southern France"
 france.2034.d:0 "As news of the defeat against Russia spread across France, it sparked a wave of anger and frustration among the populace. Protests erupted in major cities, demanding an end to the war and a change in government policies. In Paris, the protests turned into violent riots, with anarchist and communist factions seizing the opportunity to escalate the situation. \nAmidst the chaos, the French government lost control of the capital. Government buildings were occupied, and a revolutionary council was hastily formed by the rioters. The council declared the establishment of a new order, based on anarchist and communist principles, and announced the dissolution of the existing government. However, with the day coming to an end, it seems that the revolt is localized in the capital and the Southern provinces."
 france.2034.t:0 "Police pushed out of Paris"
 france.204.a:0 "Glory to our Republic!"
 france.204.b:0 "We must make a choice!"
 france.204.d:0 "In a jaw-dropping speech at this morning's National Assembly, General [FRA.GetLeader], head of the Government of National Defense, announced the restoration of civilian rule. He noted that the European War had ended in victory for France and its allies, proving that the military government and the wartime regime had fulfilled their historical mission. France, he declared, now needs a stable civilian government to get everything 'back on track.' [FRA.GetLeader] emphasized that he had no intention of leading France into a new era under military rule, nor did he have the energy or ambition to remain as the nation's supreme leader. While the Government of National Defense would cease to exist, the French Armed Forces would continue their duty to defend the nation.\n\nThe General's abdication statement has sparked an uproar both domestically and internationally. While mainstream media praised his high-mindedness, attention quickly shifted to a more pressing question: Who would lead the new civilian government that would succeed the military government? Political parties across the spectrum issued statements, lauding the General's wise decision while simultaneously gearing up for election campaigns. Meanwhile, scholars and the general public reflected on the merits and shortcomings of the old government, with many suggesting that this moment should be seized to reform France's constitutional system and revitalize the country."
 france.204.t:0 "Restoration of Civilian Government"
 france.205.a:0 "We shall wait for our Power"
 france.205.d:0 "With the latest session of the National Assembly finally convened, a major issue has emerged as the primary focus for both legislators and government ministers: drafting the new fiscal year's government budget.\n\nOur system is transitioning from a war-oriented military government to a civilian government, and political order urgently needs to be reestablished. Apart from the military-industrial sector, most major industries are in disrepair and require significant attention. Meanwhile, the military’s political influence remains deeply entrenched, with senior officers reluctant to give up the substantial benefits they have enjoyed for years. On the other hand, the major political parties in the National Assembly, having only recently regained their voice, seem ready to resume their usual hostilities.\n\nWe absolutely cannot afford another government shutdown. Our leaders are determined to draft the new budget as quickly as possible, investing all political resources to ensure its passage. To expedite France's recovery, we have significantly increased allocations for social welfare and key industries, which requires cuts in heavy industry and military investments. This, of course, will trigger a new round of contention between the civilian government and the military, but governance is, after all, a delicate balancing act—one that requires maintaining equilibrium in the long run."
 france.205.t:0 "Cost of Redirecting Budget"
 france.206.a:0 "Welcome home from the Stars!"
 france.206.b:0 "Inspiring to the Generation of the Stars!"
 france.206.c:0 "Space Patriots!"
 france.206.d:0 "Great news coming out of France in the last day or so as the French government has successfully returned US astronauts from the ISS back to earth. The ongoing civil war in the United States has created an extremely large problem for the three remaining Americans, Jesicca Watkins, Robert Hines, and Kjell Lindgren who were working on the ISS as the country they are responsible to has been thrown into unresponsive chaos. With delegated supplies to the crew running low, the American astronauts had run into a serious issue on organizing their return. Since France had taken over the US's responsibilities on the ISS, a lengthy but ultimately successful return was organized as within the last few hours, [FRA.GetLeader] had announced that the Americans had safely returned to Earth. European Space Agency authorities have announced that Léopold Eyharts and Thomas Pesquet of France along with Matthias Maurer of Germany would take their place on the ISS. President Biden has issued a prompt congratulatory message to the French state and has publicly announced that they will be trying their best to have their astronauts return home stateside as soon as possible. However, concerns have been raised regarding their safety upon return to the US as the nation is still embroiled in a major war. Regardless, both governments have complemented the effort as an exercise in fraternal cooperation in a world seemingly divided by conflict. "
 france.206.e:0 "True Americans descend from the Stars!"
 france.206.f:0 "The Spirit of Gagarin and Armstrong guided them..."
 france.206.g:0 "More Western propaganda! We offered first!"
 france.206.h:0 "We shall be there soon..."
 france.206.i:0 "We too will reach for the skies..."
 france.206.t:0 "France Succeeds in Returning US Astronauts from ISS"
 france.207.a:0 "Horror strikes the cosmos!"
 france.207.b:0 "Best regards to their families..."
 france.207.c:0 "The First Tragedy of Space Force..."
 france.207.d:0 "Horrifying developments are coming out of France today as multiple reports have confirmed that a spacecraft carrying US astronauts back from the ISS has exploded. The ongoing civil war in the United States has created an extremely large problem for the three remaining Americans, Jesicca Watkins, Robert Hines, and Kjell Lindgren who were working on the ISS as the country they are responsible to has been thrown into unresponsive chaos. With delegated supplies to the crew running low, the American astronauts had run into a serious issue on organizing their return. France and related European Space Agency authorities attempted to return them but the spacecraft that was making the return had run into serious issues. The spacecraft, already with a departure schedule pushed back, attempted to return the Americans back to Earth but lost contact with ESA and French authorities midway into the trip. Based on both instrument measurements from ground control and eyewitness testimony, it appeared that a fuel leak ignited and resulted in a massive explosion, killing the Americans aboard. President Biden has only issued one statement expressing sorrow over these Americans who lost their lives in the explosion. [FRA.GetLeader] has also announced an effort to try and retrieve the bodies from the wreckage of the crash on Earth. Citizens in Europe and America are shocked and in a state of mourning over this tragedy. "
 france.207.e:0 "Heroes fall from the Stars..."
 france.207.f:0 "The Stars of the Revolution shine brighter..."
 france.207.g:0 "A clear fault common in Western products"
 france.207.h:0 "Evidence of European engineering incompetence"
 france.207.t:0 "Explosion Kills US Astronauts Returning from ISS!"
 france.208.a:0 "Investissement minime, gains considérables"
 france.208.d:0 "After a long and bloody conflict, the very core of the Saudi-Arabian lands has been shaken. The Arab republic has risen above its rivals and already has reached out to us to make good on their part of the bargain. \n\nOur financial and diplomatic support has contributed to their victory and in that they'll remain in our debt for quite a while, allowing us to expand our influence in the region. It will take some time for them to rebuild but even in the post-war chaos, there'll be plenty of opportunities for French companies to fill in the gaps."
 france.208.t:0 "Arabian Republic victorious."
 france.209.a:0 "À propos de cet accord..."
 france.209.d:0 "With the civil war finally reaching an end, and the fog of war disappearing. It is now clear that the Saudi establishment has risen victorious over its opponents. \n\nWith our claim that they were the legitimate government and our financial support, they have successfully secured the peace in the peninsula, and with their gratitude lies a lot of opportunity to expand our influence in the region, we won't squander this chance."
 france.209.t:0 "Status quo remains in Saudi-Arabia."
 france.210.a:0 "Affirmative."
 france.210.d:0 "The sound of artillery and aircraft buzzing over the skies were muffled overnight, as the last remnants of Russian brigades were driven and forced to withdraw from the key and strategic Krasnodar port city of  Novorossiysk,  as the overwhelming momentum of our armed forces has been more than enough to pull the Russian bears blood curdling teeth once more, leaving nothing but burning scarps of BMP's vehicles in it's track, leaving nothing but in pure shame and humiliation.\n\nIn essence, the capture of Novorossiysk is deemed to be yet another turning point in the war, as this severely hindered Russian Black Sea presence in the region, as well as the critical loss of Russia's largest commercial port and one of the biggest in the country, the Russian war of aggression has completely turned on it's head and is now raging across its territories."
 france.210.t:0 "Capture of Novorossiysk"
 france.2100.a:0 "Damnit!"
 france.2100.d:0 "While we were distracted by other matters, a bombshell of bad news landed: Russia, which had been lying low for a while, has once again bared its fangs and seized Novorossiysk from the Kuban Republic. This republic, established as a democratic state on former Russian Caucasus territory after its defeat in the First European War, had been under the protection of French and EU forces. The redrawing of borders in that region was intended to limit Russia's influence and prevent it from expanding quickly again. However, it has now become clear that Russia's hunger for territory is insatiable, especially in the place as strategically important as the Euro-Asian border.\n\nBy employing a dual strategy of political and military maneuvers, the Russian army moved into Novorossiysk with remarkable ease. Trapped in the vast network of Slavic military power, even the resourceful French forces had no choice but to retreat via sea and air routes provided by the Kuban Republic. This event has dealt a severe blow to France's prestige in the Caucasus and marks the first domino to fall on Russia's path toward renewed expansion."
 france.2100.t:0 "Russia retakes Novorossiysk"
 france.211.a:0 "Affirmative."
 france.211.d:0 "The French Armed Forces High Command has officially announced that our forces have successfully captured the strategic Black Sea stronghold of Kerch. After intense combat, our armored divisions and airborne units launched a coordinated assault into the city, swiftly securing key positions on both sides of the Kerch Strait. Under precise firepower, enemy forces collapsed rapidly, their command structure disintegrated, and a significant cache of weapons and equipment was seized.\n\nAs a vital link between the Crimean Peninsula and the Eurasian mainland, Kerch holds immense strategic importance. This victory has effectively severed enemy supply lines on the southern front, paving the way for subsequent operations. Preliminary assessments indicate that our forces have captured dozens of enemy armored vehicles, over ten artillery systems, and multiple intact military installations."
 france.211.t:0 "Capture of Kerch"
 france.2110.d:0 "The French Armed Forces High Command has officially reported that after 72 hours of continuous combat, our main armored force has successfully seized control of Sochi, a key strategic city on the eastern coast of the Black Sea. In urban combat, our infantry and armored units conducted systematic clearing operations, securing the city block by block. The enemy attempted a final stand in the central district, but under sustained heavy firepower, their morale crumbled, leading to mass surrenders.\n\nSochi's strategic significance lies in its role as a critical gateway to the Caucasus and a major Black Sea port. This victory grants us complete control over the eastern Black Sea coastline, effectively severing the enemy's maritime supply routes in the south. Meanwhile, our engineering units have begun restoring damaged infrastructure to support ongoing military operations. Forward armor repair units have established temporary maintenance depots to ensure frontline combat readiness."
 france.2110.t:0 "Capture of Sochi"
 france.2111.a:0 "Damnit!"
 france.2111.d:0 "Despite the best efforts we had at our disposal, it became known that Russian Tactical Battalion Groups managed to fully retake and occupy the city of Sochi, one of the largest resort cities in the country and the Caucasus region as a whole. While our forces garrisoned within the urban centers and outskirts fought valiantly and ferociously to hold the front, the relentless onslaught of Russian mobiks and other elements caused our brigades situated in the city to make a difficult but necessary decision to abandon the city and it's surrounding areas, instead choosing to flatten it with coordinated artillery barrages and precision airstrikes to prevent further advance of Russian forces in the area.\n\nWhile the loss of Sochi has caused significant strategic and moral losses for us, the French command remains fully confident to continue offensive operations in the Caucasus  to deter Russian aggression and take the fight the bloodthirsty bear itself."
 france.2111.t:0 "Russia retakes Sochi"
 france.212.a:0 "I feel quite Hungry..."
 france.212.d:0 "In a shocking act of protest, demonstrators recently targeted the iconic ''Mona Lisa,'' draping the masterpiece in a layer of Soup. This bold gesture aimed to highlight the urgent issues surrounding fossil fuels and environmental degradation, turning the world's gaze towards the climate crisis. By choosing one of the most recognized paintings in history, the protesters sought to disrupt the complacency surrounding climate inaction, using the famed artwork as a powerful symbol of cultural heritage at risk. \n\nThe image of Soup on the ''Mona Lisa'' struck a jarring contrast, juxtaposing the beauty of art with the stark reality of environmental harm. Protesters argued that such actions are necessary to provoke a response from a society often desensitized to the gradual destruction of the planet. They aimed to spark dialogue about the implications of our dependence on fossil fuels and the need for systemic change. Critics, however, decried the act as vandalism, questioning whether targeting art would truly inspire the needed action or alienate potential allies in the fight for climate justice."
 france.212.t:0 "Mona Lisa covered in Soup"
 france.2120.a:0 "Damnit!"
 france.2120.d:0 "In a move that left us completely shocked and unprepared, Russian forces managed to land and seize the city the known ancient city of Kerch, forcing our forces to flee the city in a hurry to avoid total destruction of their units, leaving numerous weaponry in its haste retreat, eerily reminiscent of that when the initial enemy troops retreated from the region. This event marks as the official Russian foothold in the Crimean Peninsula since its takeover by our armed forces and allies.\n\nThe retaking of Kerch unsurprisingly gave the our foes a much needed confidence boost, as on ground reports now indicate that they're now seeking to continue their momentum onwards in hopes to liberate the entire peninsula as a whole. While the loss of the city cannot be underestimated, our efforts to stop the Russian war machine must not falter, we must deny further spearhead of enemy combatants making breakthroughs in the  Crimean Peninsula among other fronts and sectors for the future."
 france.2120.t:0 "Russia retakes Kerch"
 france.213.a:0 "Hm, this isn't a great way to send a message guys"
 france.213.d:0 "In a bold and controversial act of protest, demonstrators recently targeted Vincent van Gogh's renowned painting, ''Flowers,''  by throwing soup onto the canvas. This striking action was not just an assault on a beloved artwork; it was a deliberate statement aimed at drawing attention to the pressing issues of climate change and environmental degradation. By choosing such a high-profile piece, the protesters sought to provoke a conversation about the fragility of our natural world, as symbolized by the vibrant blooms that Van Gogh so beautifully captured. \n\nThe choice of soup, an everyday item, symbolized the urgency and accessibility of the climate crisis. While some criticized the act as vandalism, supporters argued that it was a necessary wake-up call. In a world where the beauty of nature is increasingly at risk, the juxtaposition of a masterpiece against the stark reality of environmental neglect underscored the need for immediate action. The visual impact of the soup on the painting served to remind us that the art we cherish is intimately connected to the very ecosystems that sustain life."
 france.213.t:0 "Soup on ''Flowers''"
 france.214.a:0 "How do I spell that again?"
 france.214.d:0 "French President Emmanuel Macron's La République en Marche party has changed its name to Renaissance, the party's executive officer, Stanislas Guerini announced today. \nFlanked by former French Prime Minister Edouard Philippe - founder of the center-right Horizons party - and MoDem party leader François Bayrou, Guerini announced an electoral coalition between the three parties in the run-up to the French parliamentary election next month. Renaissance will field 400 candidates, he added. \n\nThe reasoning behind the choice of name, Guerini said, was to show the party would ''always make the choice of enlightenment against obscurantism.'' It will be ''open to citizens, elected officials, local elected officials wherever they come from,'' he added. It was also the name given to the Macron's party list in the 2019 European election."
 france.214.t:0 "Macron's party changes name to 'Renaissance'"
 france.215.a:0 "Sweet, Sweet Victory..."
 france.215.d:0 "European troops, alongside Ukrainian forces, parade through the streets of Kyiv, greeted by cheering crowds and jubilant celebrations. The march is not just a display of military prowess but also a symbol of the enduring bond between European nations and Ukraine, united in their commitment to peace, democracy, and the defense of shared values. As the soldiers march through the city, they are hailed as heroes, honored for their bravery and sacrifice in the fight against aggression. The victory march serves as a powerful reminder of the importance of solidarity and cooperation in the pursuit of peace and security in Europe and beyond."
 france.215.t:0 "Victory Parade in Kyiv"
 france.216.a:0 "The Militarists have it!"
 france.216.b:0 "Giving Centrism a Second Shot"
 france.216.c:0 "The Military acted illegally towards the old constitution!"
 france.216.d:0 "With the 7th Republic of France is poised for its first election, there has proven to be a stark contrast in ideologies among the major parties. The leaders of the Military's popular suspension of civilian government have supported Pierre de Villiers and his new ''Alliance for French Victory'' party, which presents a platform focused on bolstering national defense, advocating for a strong military presence in global affairs, and emphasizing the importance of a robust defense industry for economic growth and maintaining the glories of the military coup. \nIn contrast, the ''People's Democratic Union,'' led by Francois Bayrou has attempted to combine the ideals of Macron with other minor parties on the left, representing a broad centrist stance, aiming to balance military strength with social welfare and economic prosperity. They advocate for a pragmatic approach to governance, seeking to unite the nation under a banner of stability and progress. \nFinally, backed by the imprisoned Mélenchon and led by the former Prime Minister Eric Coquerel, the ''Progressive Renaissance Party.'' \n\nAs France stands at a crossroads, the outcome of this election will not only determine the future direction of the country but also reflect the deep divisions within French society regarding its second new constitution in a decade."
 france.216.t:0 "First election of the 7th Republic"
 france.217.a:0 "A Victory for Socialism!"
 france.217.b:0 "A Victory for Libertarians worldwide!"
 france.217.d:0 "As France's 6th Republic prepares for its first election, the political landscape is dominated by two major parties: the ''Classic Party'' and ''United for Change.'' The election marks a significant moment in French history, as it will determine the direction of the country under this new constitution. \n\nThe ''Classic Party,'' led by former chairman and CEO of AXA, Henri de Castries, represents traditional liberal values of individual liberty, free markets, and limited government, is led by charismatic leaders promising economic growth and prosperity through deregulation and privatization. On the other hand, ''United for Change,'' advocates for social justice, equality, and government intervention to address societal issues. They promise to prioritize welfare programs, workers' rights, and environmental protection, appealing to those who seek a more inclusive and equitable society. \n\nThe outcome of this historic election will not only shape domestic policies but also determine France's stance on the global stage, highlighting the contrasting ideologies and values at the heart of the 6th Republic."
 france.217.t:0 "First election of the 6th Republic"
 france.218.a:0 "Mélenchon's Constitution Stays"
 france.218.b:0 "We need a new constitution."
 france.218.d:0 "In the wake of the Russo-Ukrainian war and facing ongoing geopolitical uncertainties, France stands at a critical juncture regarding its constitution. The broadly Socialist leaning constitution of the 6th Republic, which emphasizes social welfare and democratic principles, is being questioned following the military's restoration of civilian administration following the war. \n\nProponents of maintaining the 6th Republic argue that it reflects France's values of liberty, equality, and fraternity, and provides a solid foundation for a democratic society. They believe that preserving this constitution is crucial for maintaining social cohesion and upholding the rights of all citizens. However, those in favor of a 7th Republic constitution argue that France needs a stronger, more centralized government with a focus on national security and military strength to navigate the complex and volatile international landscape. They believe that a more militaristic approach is necessary to ensure France's security and protect its interests on the world stage."
 france.218.t:0 "Constitutional Crossroads"
 france.219.a:0 "Vive le France!"
 france.219.d:0 "Despite initial concerns and the suspension of the 2026 election, the incumbent party has won in a landslide victory. The French populace, still reeling from the effects of the Russo-Ukrainian war, has chosen to trust in the experienced leadership of the current government. With a renewed mandate, the government pledges to focus on rebuilding the nation, both physically and emotionally, after the war. \n\nThe landslide victory not only secures the government's position but also sends a clear message that the French people are united in their desire for stability and continuity during these challenging times. As France moves forward, the government is committed to honoring the sacrifices made during the war and building a brighter future for all citizens."
 france.219.t:0 "Incumbent Victory"
 france.220.a:0 "War is Hell"
 france.220.d:0 "France's decision to enter the Russo-Ukrainian war has come at a great cost, with reports confirming the loss of 30,000 French soldiers in the conflict. This news has sent shockwaves across the nation, as families mourn the loss of their loved ones and communities grapple with the impact of the war on the homefront. The sacrifices made by these soldiers weigh heavily on the collective consciousness of the country, highlighting the harsh realities of warfare and the human toll it exacts. \n\nAs the war drags on, however, signs of war exhaustion are beginning to emerge within French society. The constant stream of casualties, coupled with the economic strain of supporting the war effort, has taken a toll on morale. Public sentiment is shifting, with growing calls for an end to the conflict and a focus on rebuilding and healing the nation. The loss of our soldiers serves as a sobering reminder of the cost of war and the toll it takes not just on the battlefield, but also on the hearts and minds of those left behind."
 france.220.t:0 "Death toll reaches 30,000"
 france.221.a:0 "attaque à outrance"
 france.221.d:0 "Reports have been flooding from the east of the disaster that's befallen Europe. The Ukrainian government has been shattered, its rump government surrendering unconditionally to the oncoming hordes from the east. To further salt the wound, members of the Ukrainian and the general staffs of other NATO partners have come out to pin the blame on us. Accusations of cowardice, inaction, and outright incompetence have poured in like a flood. Regardless of the truth, these beliefs poison the well and make attempts to coordinate anything harder, further leading to potential disaster. This also makes morale-already low-fall even more with some concerns that, without rapid success, the army may collapse. We must make a stand and hold the Dniester to the last and when able attack and attack until we are out of bullets or blood. The army's cohesion, France's reputation, and the very fate of Eastern Europe is at stake."
 france.221.t:0 "A National Disgrace"
 france.222.a:0 "Approved"
 france.222.b:0 "Denied"
 france.222.d:0 "To whomever this may concern... \nDue to logistical problems in Eastern Europe, our troops have been delayed on numerous occasions. Due to this, I am requesting an additional fourteen days to our deadline to commence Opération Davout. \nVive la France! \n\nSigned, \nFranck Boudet"
 france.222.t:0 "Extension of Timeline"
 france.223.a:0 "Your son."
 france.223.d:0 "Today, I have arrived at boot camp all the way in Paris and begun the first phase of Basic Training; they call it the ''Phase-jaune'', where I adapt to military life, learn discipline, teamwork, programs, traditions, and the like. While I have not found myself, anyone who I can call my comrade yet, I think I am going to be well acquainted with those who accompany me in training. I know you and Papa hate the city life, and always have, which is why you seemed hesitant at shipping me off here, it is not as bad as you think, I promise. It's in one of the more far-out arrondissements, I believe the twentieth and is not really part of the ''city life'', so to speak. Even now, I start to tear up knowing how long I will be gone. I already miss Papa, the farm, and brother Christophe; and I certainly know I will miss you. It's been hard work already and has really put me to the test physically. Of course, the lessons are always the easiest, for it's nothing I didn't already know. I think the discipline we have at the farm is really going to help me, so I thank you for that. At night, I've always dreamed of serving and fighting for my nation when it is endangered the most; to help other people and know what's best for your country is the greatest feeling in the world. In devotion to God, I will fight for my country valiantly and with the utmost honor. I hope not to be just a soldier for long, and have great aspirations. Maybe one day, I can become a military general and lead my people against the enemies of France! Hopefully soon enough. I wonder what the food is like in the military. Of course, nothing will compare to the meals you made every day during my childhood. I'm going to miss talking to you like this, and I will miss everything. But, that's what these letters are for, you know? I do hope you show these to Christophe and Papa as well. That would just warm my heart, as I love both of them with all my heart. \n\nSincèrement,"
 france.223.t:0 "To my dearest Mère,"
 france.224.a:0 "Your son."
 france.224.d:0 "Today, I have been honorably discharged from the military so I can pursue a career within a Foreign Legion in America. I know this may frighten, worry, or anger you, as I have done it without your approval, but please know that I will be safe and that I am doing this for the good of my country and for those across the world. It has been 2 years since my first letter, back when I had just arrived at boot camp. Oh, I still remember that day; everything was so new, I met amazing people, only to have lost contact with them now. Their faces... they are like ghosts in my mind. I wish for their safety. I've told you all about this in my many visits, so I won't repeat it, but every day I feel like the world around me collapses. Like a fire that has been burning for years, engulfing the globe and slowly withering away at human culture, even our own. Some say it is just fearmongering, but I think it is a real threat. I already know that regardless of who wins, the result of the 2022 Elections will be disappointing to me, to say the least. I grow more and more dissatisfied with the establishment, and those who are ''anti-establishment'' every day. I know you do not like politics as much as I do, but you will soon learn that the ''state of politics'' is more important than anything else in the world. It intertwines with everything and anything. I know I will be even farther from home, far from Christophe, you, and Papa, which I do not want, this is completely necessary. Already, many of my comrades have volunteered to come with, and I have found myself a new brotherhood to exist in. Many of them are just like me and you; they have never been fond of city life, and want to see the best out of their country. If you have ever heard the story of Lafayette, it can be compared to what's currently going on right now. America is undergoing a revolution, and I will be at the forefront of it no matter who tries to persuade me. I dearly hope you perceive this letter in good faith, and I do love you with all of my heart. Please, just do not worry for me. I am grown, and I will be more than fine. \n\nSincèrement,"
 france.224.t:0 "Salut Mère"
 france.225.a:0 "Your son."
 france.225.d:0 "Today, I have arrived in Bourdeaux after years of service in America. I am deeply sorry for not writing to you for all these years, but with the gravity of my situation there I simply did not have enough time. Christophe has written to me recently, telling me how devastated you were to hear about the news, and that you have worried for me profusely. Really, it must be so dreadful experiencing your own son going missing in a warzone. I have much to say, and when I visit you and Papa I will tell you everything I can't condense into this envelope. Christophe told me about Papa, and that his condition has been worsening. Please, please continue to update me on his status and the farm until I get home. If this is my last time seeing him alive, then I wish to not make haste in my journey home. My service on the frontlines in America has been eye-opening, to say the least, and has enlightened me on the true nature of war. I've always heard stories of insurgencies and conflicts, particularly from the veterans of the Légion étrangère, but have never actually experienced it until then. War is hell and destroys everything in its wrath. I have seen it all... the massacres and slaughters purported by those who claim to be fighting for the collective good. I do not wish to curse you with the details, as I know you are old, and wish to think of anything but that, but it is truly terrifying. It has really shown me how lucky we all are, when people who are our brothers are facing the horrors of war; civilian or soldier. I am sure you, Papa and Christophe have all heard the news; Russia is at war with Europe, and they will do whatever they can to raze our homes and villages. They have invaded Ukraine, and are destined to continue their expansion. I am re-entering the military, and I am going to serve my country and my people where it matters most. I love you dearly, Mère and Papa, and always will. \n\nSincèrement,"
 france.225.t:0 "Dear Mère and Papa"
 france.226.a:0 "Your son."
 france.226.d:0 "This is nothing I have ever experienced before, not in America, not in my life. In America, I grew accustomed to victory, even if I saw my own comrades fall before me, and the crackling of rifles from as far as I could see, in every street corner, every house, and every shop. Here, in Ukraine, there is no such thing as victory. There is no glory. There is no life. Everything and anything exists to serve slaughter and dishonor. Here, there is no chivalry, no knights to ride in and defeat evil. We do not face disorganized partisans, no, we face an Army of rapists and murderers, forced to put our lives on the line by bureaucrats who have never even seen a rifle outside of the television screen. I write to you, this message, from a foxhole in one of the many trenches surveying the frontline. These foxholes are my only resting area, even if I still worry of an artillery or drone strike sending me to God. In the trench line, there is mud over 3 feet tall, riddled with corpses, blood, and feces. It is the worst smell in the world, even worse to be in the middle of it, which you must. None of it is surveyed or kempt by my German Commanding Officers. So many of my comrades, whom I've fought every where with, have been mercilessly slain in the line of duty, fighting and dying under German supervision against this existential threat to our country. War is hell. I resist my urge to desert, for I know that fighting for my country, for you, for Christophe, and in the spirit of Papa, is my ultimate duty that I must serve. I have not eaten in 3 days, and I haven't drank water in 2 days. Supplies are dwindling fast, and know not when the next shipment will come. No Man's Land is nothing but a butcherhouse, where tanks get stuck in what the Russkies call the Rasputitsa, and destroyed. The relationship I have with my new German comrades means nothing. They look down on me as if I am trash under the German boot. Even then, they are murdered not even an hour after meeting them. I know how evil the Russians are, but I have been forced to kill teenagers. I have seen draftees, no older than 18-years-old, be torn to shreds by machine gun fire. Nobody else seems to mind it. We have grown used to it by this point. When this letter reaches you, I implore you not to worry. It's what you always do, and it saddens my heart. Know that I will be okay, and I will perservere. \n\nSincèrement,"
 france.226.t:0 "Dear Mère"
 france.227.a:0 "Your son."
 france.227.d:0 "Today, we have received word that the war which has destroyed and taken so many lives, both from our country and beyond, has ended. My brigade launched a particularly lavish celebration on Russian soil, with preparations being made to send us home. Russian resistance members began running to the opposite trench, greeting and hugging their family members who happened to be on the other side. Apparently, this has been deemed a victory by our Commanding Officers and the news at home; the Caucasus region, Belarus, and Belgorod have been liberated from Russian control with governments loyal to Europe being established. Of course, we have made no effort to overthrow the regime in Russia despite all they have done to harm our people, and it is likely to be destroyed from within. If we look at history, we can clearly see that a new government, far worse than the previous, will be born from the ashes of a burnt Russia, something that HICOM, and our government, does not care for. In the end, we have still won, right? I think this is an event that should be revered, but make no mistake, it is tragic. At what cost, have we pushed our eastern borders further? At what cost, have we unleashed the full might of the Russian bear? Knowing this, I just cannot, in good heart, return home as a hero. I am no hero. I am a bystander. I am no fighter, not until I take things into my new hands. The war has turned me into a new man, a new person. I will not be leaving Russia with my platoon, to the dismay of my brute of an Executive Officer. Please, do not worry for me. I am going to do what is best for you and Christophe. \n\nSincèrement,"
 france.227.t:0 "''Happy'' Victory Day, Mère"
 france.228.a:0 "Your Son, Lafayette."
 france.228.d:0 "Today, we have received word that the war that has destroyed and taken so many lives, both from our country and beyond, has ended. There were no celebrations here in Warszawa, which the Russians have thoroughly destroyed and butchered. Every inch of this city is covered in rubble and corpses, with it resembling the state it was in when the Germans paraded through it 90 years ago. Every civilian who did not evacuate when the first wave came was ruthlessly slaughtered. Our supplies have long run out, and a good portion of our Army Group has perished due to starvation and the many diseases that run through our trenches. Those left within our Brigade are going home, a home tainted by the bureaucrats and war profiteers who have acted as parasites, getting rich while my comrades die in cities, having to endure the relentless assault of the Russians. They have done nothing to defend the heart and soul of the nation, and could not care less about the death of hundreds of thousands of French men. They are complicit, and if anything, collaborators with the Russians, actively aiding their massacres. I have nearly died dozens of times, and not one time did I get adequate medical treatment or aid that helped my position. Yet I still fought. I fought on and on, for years, only to be stabbed in the back by the people who call themselves leaders. We have lost this fight, and Russia has conquered Eastern Europe, flooding their borders and murdering Europeans. No longer, can I sit around, being ordered by my Executive Officers to stand in a trench on the frontlines. No longer, can I be a coward in my approach. I will act as a hero, I will act as a warrior for my nation and I will avenge my brothers who have fallen. I will return home and see through it that France will never fall as it did today, being subverted by Judeo-Communists both inside our nation and attacked by the Judeo-Communists in Russia. To my dearest Mère, know that I am going to do this for the good of my nation, for the good of you, and the good of Christophe. I love you with all of my heart. \n\nSincèrement,"
 france.228.t:0 "Dear Mère and Folk"
 france.229.a:0 "Your Son, Lafayette."
 france.229.d:0 "If this letter reaches you, or Christophe, then I may very well be dead. At the time of writing, I am still in Russia, and I have not left with the rest of my Brigade. I am currently in the heart of the devil, Moscow, where I shall make my stand. I am entrenched with those who vowed to follow me on this mission, including several Russians, who know what is best for humanity. The politicians across Europe, who have sat entrenched in their palaces as our people are slain in the line of duty, with men as young as 18-years-old, being forced out of their homes, away from their family to fight for these politicians who have no respect for them. The Russians who have launched this war, invading their neighboring countries and acting as rapists, slaughterers, and murderers to the highest degree of barbarity. They have still gotten away with their crimes, being pardoned by the vermin that run the highest institutions in the world. Our people, our heritage, our ethnicity, and our culture, will forever be attacked and repressed by these rats hiding in Moscow, who are waiting for the perfect time to strike. You can already see their ideology being reborn, baptized through the blood of hundreds of thousands of Frenchmen. Whether it be the Nazis or Bolsheviks, they will never cease their assaults on our people. Through blood, shall I save my people and secure their future. I know that you are an old lady now, and wish to have peace, but you need to realize the truth. I am going to strike Russia from within, and if I succeed, I will march west, reclaiming Europe from the butcherers. A great revolution has begun, and as they say, a single spark can start a prairie fire. Please, dear Mère, if you receive this letter, spread the word. Do not let me be forgotten. I love you, and always will. Glory to France, and Glory to the French. \n\nSincèrement,"
 france.229.t:0 "To: Mère"
 france.230.a:0 "Your Son."
 france.230.d:0 "I'm sure you have heard the news by now. France has been saved from the yolk of the Liberal cosmopolitans and Judeo-Communists, who reduced our people as meatbags, sending us off to the east to be slaughtered in the butcherhouses which they set up. Despite your recent interest in politics, you have been getting old, and I wouldn't want your last days to be reading letters from your son about the state of French politics. I have used my position to ensure that your area was unscathed by the fighting, and that you would be in good hands. I am so sorry that I was unable to attend Christophe's 17th birthday, and I hope he does not feel any resentment towards me for it. When you hear about me on the television, or on your phone, just know that I do it all for your future. For Christophe, for everybody in France, and that is why I took it upon myself to carry out my duties with the utmost valor and honor, and I would not do it in anybody else's name. I remember the last time I saw you before heading off to boot camp all those years ago. Did you know, back then, that you have raised a national hero? You were the best mother any man could ask for. I am deeply sorry that I cannot visit frequently any more, as I must still serve, but you will forever be in my heart and spirit; so too will Papa, Christophe, and the entire nation. I think, that is where national harmony starts. It starts in the family, and the family is forever sacred. When I can visit you, I will do so, but unfortunately that time is not now. In the history of a nation, I believe that there is a clear, overarching story which establishes a national identity and heritage, fueling the warriors of said nation for millennia. The destiny of every person under the national flag is to serve it with valiance, or be part of social harmony. When you become grown, the deeds you will do to further this story outweigh your personal, worldly life, and that is reflected here. That is not to say that you are not apart of my mind, or that I have forgotten you, no, far from it. You have laid the building blocks, the foundations, for which I stand upon. I will always thank you for that. Of course, we can speak more in person, when that day comes. Goodbye for now, Mère."
 france.230.t:0 "Greetings to my dearest Mère"
 france.231.a:0 "The Guillotine is the razorblade of the Revolution!"
 france.231.b:0 "Firing Squad allows for maximum efficiancy"
 france.231.c:0 "Lethal Injection is the most painless"
 france.231.d:0 "As the government seeks to reinforce its authority and eliminate opposition, the public is presented with a choice regarding the methods of execution that should be employed. This mandate has sparked heated debates across the nation, reflecting deep divisions over justice, morality, and the future of the revolution. \nCitizens are now faced with four distinct options for implementing state executions: \nThe Guillotine - A return to the iconic symbol of revolutionary justice, invoking the spirit of the past while aiming to serve as a deterrent against counter-revolutionaries. \nFiring Squad - A method that emphasizes swift and decisive action, appealing to those who prioritize efficiency and directness in matters of state security. \nLethal Injection – A more modern approach that advocates for a perceived sense of humane execution, aligning with those who argue for a less brutal method. \nAbolish the Death Penalty - A radical choice reflecting the ideals of mercy and rehabilitation, appealing to those who believe that the revolution should seek to transform society rather than perpetuate cycles of violence."
 france.231.e:0 "We ought to just let them rot in prison"
 france.231.t:0 "Revolutionary Mandate on Implementation of State Executions"
 france.232.a:0 "Why are we even considering this?"
 france.232.b:0 "We must return to a society free of Religion!"
 france.232.d:0 "In a significant move to reshape national identity, a new mandate has been introduced to address the contentious issue of the calendar. As debates intensify over how to best reflect the revolutionary values and aspirations of the nation, citizens are called to weigh in on their preferred system of timekeeping. This debate not only highlights differing perspectives on tradition versus progress but also serves as a symbolic battleground for broader ideological conflicts. \nThe public is presented with two options: \nReturn of the Old French Republican Calendar - Advocates for this choice argue that reinstating the historic calendar will honor the revolutionary spirit and celebrate the values of the past. They believe it will unify the populace under a shared historical framework and emphasize the importance of revolutionary ideals in daily life. \nMaintain the Current Calendar - Supporters of this option contend that the existing calendar provides stability and continuity, allowing citizens to navigate their lives without the disruptions that a change might bring. They argue that the current system has become ingrained in society and serves practical purposes that should not be overlooked. "
 france.232.t:0 "Revolutionary Mandate on The Calendar Debate"
 france.233.a:0 "We are the champions of Liberty and Social Justice!"
 france.233.b:0 "We will not bow to immorality!"
 france.233.d:0 "In a pivotal moment of social transformation, a new mandate has been introduced to address the complex issues surrounding homosexuality and gender identity. As society grapples with the implications of revolutionary ideals on personal freedoms and rights, citizens are invited to participate in this crucial debate. The outcome of this mandate will significantly influence the nation's cultural and social landscape. \nThe public is presented with two distinct options: \nAccepting Homosexuality and Gender Discussions Wholeheartedly - Supporters of this option advocate for full acceptance and recognition of diverse sexual orientations and gender identities. They argue that embracing these aspects of human identity is essential for fostering equality, promoting individual freedoms, and creating a more inclusive society. \nBanning Homosexuality and Discussions on Gender - Proponents of this choice argue that such measures are necessary to uphold traditional values and societal norms. They believe that restricting discussions and expressions of non-heteronormative identities will protect the fabric of the community and preserve established customs."
 france.233.t:0 "Revolutionary Mandate on Homosexuality and Gender"
 france.234.a:0 "Convert them to Museums of the Bourgeois Decadence!"
 france.234.b:0 "Tear them down!"
 france.234.c:0 "We have more pressing matters..."
 france.234.d:0 "In a bold reflection of revolutionary values, a new mandate has emerged to address the legacy of architectural opulence represented by Versailles and the grand châteaux of France. As the nation contemplates its relationship with symbols of past excess and decadence, citizens are invited to weigh in on the future of these monumental structures. This debate not only challenges the historical significance of these sites but also raises questions about the values that should define contemporary society. \nThe public is presented with three distinct options: \nMuseums of bourgeois Decadence - Proponents of this choice advocate for transforming these lavish estates into museums that critique their histories, highlighting the excesses of the bourgeoisie. They believe that by preserving these structures as educational spaces, society can learn from the past and foster a more egalitarian future. \nTear them down -  - Supporters of this option argue that these symbols of immense wealth are antithetical to revolutionary ideals and should be demolished to erase reminders of oppression and inequality. They contend that tearing them down would signify a definitive break from a past marked by class disparity. \nDo Nothing - Those in favor of maintaining the status quo believe that these architectural marvels are integral to France's cultural heritage and tourism. They argue that preserving them as they are allows for appreciation of historical artistry and provides economic benefits to the community."
 france.234.t:0 "Revolutionary Mandate on Architectural displays of Immense Wealth"
 france.235.a:0 "We will always stand for Revolution worldwide"
 france.235.b:0 "We must focus on our internal Revolution"
 france.235.d:0 "In a transformative moment for national ideology, a new mandate has emerged to shape the philosophical underpinnings of foreign policy. As the revolutionary government seeks to redefine its place in the world, citizens are invited to deliberate on the guiding principles that should direct their interactions on the global stage. This debate not only addresses national priorities but also reflects broader ideological commitments to revolutionary ideals. \nThe public is presented with two distinct options: \nWorldwide Revolution - Advocates for this approach argue that France should actively promote and support revolutionary movements across the globe. They believe that spreading revolutionary ideals is essential for dismantling oppressive regimes and fostering global equality. By positioning France as a champion of worldwide revolution, supporters contend that the nation can inspire change and solidarity among oppressed peoples everywhere. \nInternal Revolution - Supporters of this option argue for a focus on addressing issues within France before engaging with the international community. They believe that the government should prioritize internal reforms to ensure social justice, equality, and stability at home. By concentrating on the needs of the French people, proponents assert that the nation can serve as a model for others, demonstrating the effectiveness of revolutionary principles through tangible improvements in citizens' lives."
 france.235.t:0 "Revolutionary Mandate on Philosophy and Foreign Policy"
 france.236.a:0 "This is needed to maintain our Revolution"
 france.236.b:0 "This is Unwarrented Tyranny!"
 france.236.d:0 "In a moment of profound reflection on the balance between security and liberty, a new mandate has been introduced regarding the controversial Law of Suspects. As the revolutionary government grapples with threats to its stability and the safety of its ideals, citizens are invited to voice their opinions on the reintroduction of this significant legal framework. This debate stirs memories of past tensions and raises critical questions about civil rights in the name of security. \nThe public is presented with two distinct options: \nRestore the Law of Suspects - Proponents of this choice argue that reinstating the law is essential for safeguarding the revolution from internal threats and counter-revolutionary elements. They believe that the measures outlined in the law will enhance national security and preserve the hard-won gains of the revolutionary movement, even if it requires some sacrifices in personal freedoms. \nDo Not Restore the Law - Opponents of this option contend that reintroducing such a law undermines the very principles of liberty and justice that the revolution seeks to uphold. They argue that the law has historically led to abuses of power and unjust persecution, and that a commitment to human rights must be paramount in any revolutionary endeavor."
 france.236.t:0 "Revolutionary Mandate on the Law of Suspects"
 france.237.a:0 "He was a Beacon of Revolutionary Idealism"
 france.237.b:0 "He was nothing but a Petty Tyrant"
 france.237.d:0 "In a pivotal moment of introspection, the revolutionary government has introduced a mandate to reassess the legacy of Maximilien Robespierre and the infamous ''Reign of Terror.'' As the nation grapples with its tumultuous history, citizens are called upon to evaluate the impact of Robespierre's actions on the revolutionary cause and the ideals it espouses. This debate serves as a critical examination of the balance between revolutionary zeal and the principles of justice and humanity. \nThe public is presented with two distinct options: \nBeacon of Revolutionary Idealism - Supporters of this perspective view Robespierre as a champion of the revolution, whose unwavering commitment to revolutionary ideals justified the measures taken during the Reign of Terror. They argue that his actions were necessary to protect the revolution from enemies and maintain the hard-won gains of liberty and equality. Advocates believe that recognizing Robespierre as a guiding light is essential for inspiring future generations to uphold the revolutionary spirit. \nTyrant - Opponents of this view contend that Robespierre's reign represented a dangerous overreach of power that led to widespread fear, repression, and the loss of countless lives. They argue that labeling him a petty tyrant serves as a warning against the dangers of extremism and the potential for revolutionary fervor to devolve into authoritarianism. This perspective calls for a critical reevaluation of the past, emphasizing the need to prioritize justice and human rights over the pursuit of ideological purity."
 france.237.t:0 "Revolutionary Mandate on Robespierre and the ''Reign of Terror''"
 france.240.a:0 "What do they wish to achieve?"
 france.240.d:0 "In recent days, it has become an open secret that the French military is subtly exercising its influence over political affairs, shaping national policy from behind the scenes. While official channels remain quiet on the matter, military leaders are increasingly seen as key players in the decision-making process, leveraging their considerable resources and public support to advocate for a more assertive defense strategy. This has raised eyebrows among political analysts and citizens alike, who are beginning to question the true extent of military involvement in governance. \n\nAs tensions in the geopolitical landscape grow, whispers of military preferences for a hardline approach to foreign policy have circulated among government circles."
 france.240.t:0 "The Military uses their Influence"
 france.241.a:0 "Embrace Service to Your Country"
 france.241.b:0 "Hard Work Pays Off"
 france.241.d:0 "With our victory in the elections, our party has been given free command to enact reforms, including the plan to reshape the idea of the French citizen. However, this has become a polarizing problem in our government with 2 sides supporting alternative ideas. The moderates of our party believe we should encourage our citizens to serve their country by enlisting in the army. While France has long enjoyed relative peace in the 21st century, recent developments in America and Europe have necessitated increasing defense spending.\n\nThe hardliners of our party, however, argue that we should encourage our citizens to serve their country by seeking employment in factories. With the outbreak of war in Saudi Arabia and America tethering on the brink of a certain civil war, France must bolster its domestic production if it hopes to survive. This proposal has faced opposition from both moderates and environmentalists within our party, who argue that telling our people to work themselves to the bone will only work to damage our approval rating. Regardless, the party hardliners support this idea as a way to stimulate the growth of France's economy."
 france.241.t:0 "Reshape the French Citizen"
 france.242.a:0 "We shall, but they must accept payback our lost assets"
 france.242.b:0 "It would insult the fallen!"
 france.242.d:0 "In the aftermath of our decisive victory in the recent conflict, we have received an official request from the French Republic to lower the war reparations imposed upon them. This appeal serves as a clear indication of France's weakened state and its acknowledgment of our strength on the international stage. As we reflect on our triumph, it is evident that this request symbolizes not only France's vulnerability but also our position as a formidable power in Europe."
 france.242.t:0 "French Republic requests lower Reparations"
 france.244.a:0 "Cool"
 france.244.d:0 "Jean-Luc Mélenchon has successfully consolidated his authority within his faction of the New Popular Front, positioning himself as the dominant voice in the party amid a shifting political landscape. Through a series of strategic alliances and effective communication, Mélenchon has rallied his supporters, reinforcing a vision that emphasizes progressive policies and social justice. His charismatic leadership style has resonated with the party base, allowing him to consolidate power and push forward an ambitious agenda."
 france.244.t:0 "Melenchon Consolidates Power!"
 france.245.a:0 "Cool"
 france.245.d:0 "In a strategic move to strengthen his position, Olivier Faure has successfully consolidated power within his faction of the New Popular Front. As the political landscape becomes increasingly turbulent, Faure's leadership style has resonated with party members, who view him as a unifying figure capable of navigating the complexities of contemporary politics. His efforts to bring together various ideological strands within the faction have resulted in increased cohesion, allowing for a more focused agenda that appeals to a broader electorate."
 france.245.t:0 "Faure Consolidates Power!"
 france.250.a:0 "Three Cheers Villiers!"
 france.250.b:0 "We stan Le Pen!"
 france.250.d:0 "As the upcoming presidential election looms, a power struggle has emerged within the National Front following Marine Le Pen's public statement against the military's control in the government. The French military, increasingly concerned about the direction of the party under Marine Le Pen, has quietly but firmly demanded that the FN replace her with a candidate more aligned with their interests: Pierre de Villiers, the highly respected former Chief of the General Staff. De Villiers, known for his strong pro-military stance and no-nonsense approach to defense, represents a sharp departure from Le Pen's populist rhetoric. \n\nThe FN leadership is now torn. While Le Pen has cultivated a loyal following, there is growing recognition that a more pro-military candidate like de Villiers could attract the support of key military figures and conservative voters who see national security as paramount. The military's intervention, though informal, is a clear signal that they expect a shift in policy and personnel at the highest levels of government. The party must now choose between staying loyal to its populist base or embracing a figure who could deliver both electoral success and military backing."
 france.250.t:0 "A New Candidate?"
 france.251.a:0 "Concerning for some..."
 france.251.d:0 "In a bold and provocative statement, Jean-Luc Mélenchon asserted that ''Russia is a friend of France with whom cooperation should be increased,'' advocating for a shift in foreign policy amidst the ongoing conflict in Ukraine and NATO's potential involvement. He expressed concerns about NATO's escalating military presence, declaring, ''Very soon, processes will be launched to withdraw from NATO.'' This declaration aims to reposition France as an independent actor in international relations, focusing on diplomacy and collaboration with nations that share common interests, rather than aligning with military alliances. \n\nSince Mélenchon's announcement, the military has remained notably quiet, raising questions about the internal dynamics within France's defense establishment. This silence may indicate a reluctant acknowledgment of the political shift underway, as the military navigates its role in a changing geopolitical landscape. Mélenchon's emphasis on cooperation with Russia and a potential withdrawal from NATO resonates with segments of the electorate weary of conflict, positioning the New Popular Front as a key player advocating for a new diplomatic approach in Europe."
 france.251.t:0 "Mélenchon is flying to Moscow"
 france.252.a:0 "A Modern Danzig"
 france.252.d:0 "Today, French President Jean-Luc Mélenchon addressed the nation, expressing profound concern over the escalating conflict involving a Medvedev-led Russia and the potential entry of NATO into the fray. ''Dear fellow citizens, I stand before you today with deep concern in my heart,'' he stated, urging the French people to refuse involvement in a war with Russia. ''We are being urged to engage in a conflict with Russia, but I tell you this is madness. This is not our war. This is not our battle.'' Mélenchon emphasized that France must not be drawn into an endless cycle of violence, advocating for a withdrawal from NATO and a return to an independent policy focused on peace and stability. \n\nn his passionate address, Mélenchon invoked historical context by asking, ''Why die for Odessa?'' This echoed the famous phrase ''Why die for Danzig?'' highlighting his strong opposition to military confrontation and framing the current situation as one that does not warrant French sacrifice. By rallying the nation around a message of non-involvement and diplomacy, he seeks to steer France away from escalating tensions and towards a path that prioritizes dialogue and cooperation over conflict."
 france.252.t:0 "Mélenchon opposes the war"
 france.253.a:0 "Allez on pousse!"
 france.253.d:0 "''Citizens of France and of all Europe! Today we are facing a huge threat. The fascist Russian Empire, led by Vladimir Zhirinovsky, has launched an aggression against Ukraine. We cannot stand by. We, as a democratic Europe, must unite and fight back against this evil. Fascism has no right to exist in the modern world. We must unite all our forces, all our resources to confront this threat. Today, I call on all French citizens, all our allies in Europe and beyond: let us stand shoulder to shoulder against fascist aggression! Our future depends on our determination. We will fight for freedom, for democracy, for the future of our children. Forward, to victory over fascism!''"
 france.253.t:0 "Mélenchon calls for Unity against Fascism"
 france.254.a:0 "Ura!"
 france.254.d:0 "President Jean-Luc Mélenchon announced the creation of a brigade of Russian radical anti-fascists and communists under the command of Sergei Udaltsov. This brigade is intended to fight against the fascist Russian Empire and its leader Vladimir Zhirinovsky, symbolizing international solidarity and the struggle for justice."
 france.254.t:0 "Mélenchon forms Russian Anti-Fascist Brigade"
 france.260.a:0 "Ok"
 france.260.t:0 "Turkey Denounces French Aggression in Cyprus"
 france.261.a:0 "Madness"
 france.261.d:0 "According to locals and local media sources, French Forces have been sighted entering Northern Nicosia with next to no resistance. This illegal Invasion has prompted an aggressive reaction from the Turkish Government, along with President Erdogan issuing an ultimatum demanding an immediate withdrawal of French Forces from Northern Cyprus, warning of severe embargoes and even possibilities of a military intervention. The international community has largely backed Cyprus, condemning the invasion as a violation of its sovereignty. The Russian government denounced the operation, labeling it as a clear act of Communist aggression. The Eurointern has threatened Turkey with massive sanctions and pledged full support for France in the event of an intervention."
 france.261.t:0 "French Special Military Operation in Cyprus"
 france.262.a:0 "Yea Sure"
 france.262.b:0 "Fuck You!"
 france.262.d:0 "In a surprising diplomatic maneuver, the French government has offered to cede French Guiana to Brazil in exchange for the country's membership in NATO. This bold proposal aims to strengthen the alliance in South America and enhance regional security against external threats. France believes that integrating Brazil into NATO will bolster collective defense capabilities and promote stability in a geopolitically strategic area. \n\nThe French leadership envisions this arrangement as mutually beneficial: Brazil would gain a significant territorial asset, enhancing its influence and resources, while France would secure a powerful ally within NATO's ranks. However, this proposal has sparked intense debate both domestically and internationally. Critics question the long-term implications of such a territorial concession, while supporters argue that it could usher in a new era of cooperation and security in the region. As discussions progress, the world watches closely to see how this unprecedented offer unfolds."
 france.262.t:0 "France offers NATO Membership for Guiana"
 france.263.a:0 "Excellent!"
 france.263.d:0 "In a historic turn of events, Brazil has officially accepted France's offer to cede French Guiana in exchange for its membership in NATO. This agreement marks a significant milestone in Franco-Brazilian relations and is viewed as a strategic move to enhance security and stability in South America. The French government sees this as an opportunity to solidify alliances in the region, leveraging Brazil's emerging influence within NATO to address collective security concerns. \n\nAs the transfer of Guiana unfolds, France is focused on ensuring a smooth transition for the territory and its residents. The French leadership is committed to upholding the rights and welfare of the local population while integrating them into Brazil's governance. This bold decision is expected to foster closer ties between the two nations, promoting economic cooperation and shared security interests. While some critics express concerns over the long-term implications of this territorial shift, the government remains optimistic that this move will strengthen NATO's presence in the Americas and contribute to a more stable regional landscape."
 france.263.t:0 "Brazil Accepts!"
 france.264.a:0 "Well fuck you too!"
 france.264.d:0 "In a surprising turn of events, Brazil has officially rejected France's offer to cede French Guiana in exchange for NATO membership. This decision has left the French government frustrated, as it had hoped to strengthen alliances in South America and enhance regional security through this unprecedented agreement. French leaders view Brazil's refusal as a missed opportunity to solidify a powerful partnership within NATO, which could have addressed mutual security concerns more effectively. \n\nThe rejection has sparked intense debate within France about the future of its strategic interests in the region. Some officials express disappointment, arguing that Brazil's refusal signals a reluctance to engage more deeply with NATO and the West. As the government reassesses its diplomatic approach, there is a renewed focus on strengthening ties with other potential allies in Latin America. France remains committed to maintaining its presence in the region, but the path forward will require careful navigation of complex geopolitical dynamics and a re-evaluation of its foreign policy strategies."
 france.264.t:0 "Brazil Refuses!"
 france.265.a:0 "We out"
 france.265.b:0 "We like Canada actually"
 france.265.d:0 "As tensions rise in Quebec, the provincial government has officially announced an independence referendum, seeking to determine the future of its relationship with Canada. This significant political move reflects long-standing desires for greater autonomy and self-determination among many Quebecois. The Canadian government views this referendum as a critical moment that could reshape the nation, and leaders in Ottawa are urging for a strong campaign to highlight the benefits of remaining united. \n\nIn response, the federal government has ramped up efforts to engage with Quebec citizens, emphasizing the economic, cultural, and social ties that bind the province to Canada. Prime Minister and cabinet officials are preparing to launch a nationwide campaign, aiming to present a compelling case for unity and the potential consequences of independence. As the referendum date approaches, both sides are gearing up for a contentious debate that will have lasting implications for the future of Canada."
 france.265.t:0 "Quebec holds Independence Referendum"
 france.27.d:0 "French Authorities have announced the end of the Mali Emergency. The combined French and Mali force encountered unexpected fierce and organized opposition from rebel forces and were able to sweep rebel forces from Northern Mali driving them deep into the Sahara.\n\nFrench forces also conducted a successful operation to save the President of Mali, extracting him from rebel bondage with no losses. This operation is being studied amongst NATO officers and set as an example for how strike force operations and quick deployments are achieved."
 france.270.a:0 "We out of MONEY"
 france.270.b:0 "We will scrounge what we have"
 france.270.d:0 "In the aftermath of the devastating conflict with Russia, the French government has taken a bold step by formally demanding increased war reparations. With our nation suffering extensive damage and loss, the leadership is determined to hold Russia accountable for its aggressive actions. The French Foreign Minister has stated, ''We must ensure that those who instigate such conflicts bear the consequences of their actions. The sacrifices of our people must not be forgotten, and justice must be served.'' \n\nAs France pushes for these reparations, the response from Russia is uncertain. This demand could lead to heightened diplomatic tensions, potentially straining relations within NATO. Alternatively, a more peaceful approach may open avenues for negotiation, allowing both nations to seek a resolution and foster stability in Europe. The path forward will significantly impact the balance of power in the region."
 france.270.t:0 "France demands More War Reperations"
 france.271.a:0 "They know our response"
 france.271.d:0 "In response to the recent demands for war reparations, the Russian government has categorically denied France's request, claiming it to be an unjust imposition. This denial has further fueled tensions between the two nations, as France views it as a blatant disregard for the suffering endured during the conflict. The French leadership, determined to uphold national dignity and secure compensation for the losses incurred, perceives this refusal as a clear indication of Russia's unwillingness to take responsibility for its actions. \n\nIn light of Russia's rejection, France has decided to impose an economic embargo, aimed at exerting pressure on the Russian government to reconsider its stance. This move is intended not only to signal France's commitment to justice but also to rally international support against Russian aggression. The French government believes that an embargo could effectively challenge Russia's defiance and force a reconsideration of its policies, while also reinforcing the unity and resolve of NATO allies in the face of ongoing threats."
 france.271.t:0 "Russia Denies Increased Reperations"
 france.272.a:0 "Oh Cool, thanks!"
 france.272.d:0 "After intense negotiations and mounting pressure from the international community, the Russian government has unexpectedly accepted France's demands for war reparations. This decision is seen as a significant victory for the French leadership, who view it as a crucial step toward justice and accountability for the suffering endured during the recent conflict. The acceptance not only acknowledges the hardships faced by France but also signals a potential thaw in relations, providing an opportunity for renewed dialogue. \n\nIn light of this development, France is poised to take steps to rebuild and strengthen its economy, utilizing the reparations to support recovery efforts and reinforce national stability. This positive outcome may also enhance France's standing within NATO, demonstrating its ability to hold adversaries accountable. However, the French government remains cautious, aware that continued vigilance is necessary to ensure that Russia adheres to its commitments and that future conflicts can be avoided."
 france.272.t:0 "Russia Accepts Increased Reperations"
 france.273.a:0 "We will do with our territories what we please"
 france.273.b:0 "Uh... Ok"
 france.273.d:0 "In light of the ongoing situation in our occupied territories, the French government has formally requested that we exercise leniency in our governance of these zones. France argues that a more humane and accommodating approach will foster stability and facilitate the return of normalcy, potentially paving the way for future reconciliation efforts. \n\nFrench officials emphasize that treating local populations with respect and understanding could help diminish hostility and encourage cooperation, especially as we work to rebuild our nation after the recent conflict. However, there are differing opinions within our government regarding the practicality and implications of this request."
 france.273.t:0 "French Government demands Leniency"
 france.2731.d:0 "In a positive development for French-Ukrainian relations, the Ukrainian government has accepted our plea for leniency in the occupied territories. This decision is seen as a significant step toward fostering stability and reconciliation in the region, as well as improving the humanitarian situation for local populations."
 france.2731.t:0 "Ukraine Accepts Plea for Leniancy"
 france.2732.d:0 "In response to Ukraine's refusal to accept our plea for leniency in the governance of the occupied territories, the French government has decided to impose an embargo on these regions. This measure aims to pressure Ukraine into reconsidering its stance and adopting a more accommodating approach to governance."
 france.2732.t:0 "Ukraine Refuses Plea for Leniancy"
 france.274.a:0 "Gadaffi's rule can no longer be tolerated!"
 france.274.b:0 "We cannot outright invade!"
 france.274.d:0 "Spurred on from the chaos in the Libyan civil war, one of the sons of Gaddafi shockingly took power, a Gaddafi in Libya.. again. This, however, cannot be tolerated as, like father like son, he is an autocratic dictator, and following the dreams of his father, he has started an imperial campaign of invading neighboring countries to create a dictatorial pan arab state following the same failed ideology of his father. Many in the government are strongly opposed to the new state, and many have proposed deposing the leadership and bringing democracy to the Libyan people.\n\nNot everybody is unanimous, however. Many are opposed to a potential invasion due to the memories of the last time we brought down the Gaddafi regime. Our motives, while good, bringing democracy to an oppressed people, led to brutal civil war in the nation and only caused devastation and made the Libyan people. At the same time, while understandable, irrationally wish for the old Gaddafi regime. Another argument is that the war would simply be a waste of time, like the last time we helped the rebels; this could just be another quagmire of our previous attempts to spread democracy in the Middle East.\n\nHowever, the pro-intervention side stressed the importance of not only spreading freedom and democracy but also safeguarding the Mediterranean, which would grant us total control of the Mediterranean and be crucial to future campaigns of democracy."
 france.274.t:0 "Intervention in Libya?"
 france.275.a:0 "We must support West African Democracy at all costs!"
 france.275.b:0 "We cannot outright invade!"
 france.275.c:0 "The situation has stabilised already"
 france.275.d:0 "Africa has, unfortunately, been a hotbed for wars and violence, and this has led to a lot of human suffering in Africa, along with autocratic rulers dominating many countries. We must ensure that democratic principles are held in Africa and that human rights are upheld. There is also an additional benefit of receiving the local natural resources in the region from a friendly democratic regime. Which would be incredibly beneficial to our economy.\n\nLuckily for us, the situation in Africa has stabilized enough, and the local regimes in place are democratic and friendly to us. They are also willing to trade their natural resources with us. This has led to the conclusion that an intervention in the region is not necessary. This comes as great news for us, as it leaves us one less region to use up valuable military resources. Any ally with us shall prosper in either case."
 france.275.t:0 "Intervention in West Africa?"
 france.276.a:0 "We have no choice."
 france.276.b:0 "We cannot afford this!"
 france.276.d:0 "The French diplomatic corps has delivered a request for France to be given preferential treatment for their companies in our nations to extract our local natural resources. They included promises of economic gain for us and to be protected by French forces. However, these promises seem empty, considering our shared history and the wording in the text.\n\nMany in the government have recommended that we accept these demands, seeing as there is little resistance we could put up; there also exists the possibility of economic growth, which could help deal with local unemployment and our infrastructure. However, just as many are outraged at this demand, after all those years of us being colonized by France, our people enslaved by foreign masters for decades, are we just going to accept this continued oppression?\n\nShould we accept this demand and not worry about any invasion or other actions France may do, or should we finally stand up for ourselves?"
 france.276.t:0 "France demands West African resources"
 france.277.a:0 "Excellent!"
 france.277.d:0 "The politicians in the ECOMOG alliance have seen reason in our offer and accepted our demand for resources, This will greatly increase our Influence in West Africa and allow us to gain new potential Trading Partners."
 france.277.t:0 "ECOMOG Accepts!"
 france.278.a:0 "Well fuck you too!"
 france.278.d:0 "The fools in West Africa have denied our request for resources stating that they do not have any resources left to spare. This will greatly hinder our relations with them and could result in us losing even more Influence in Africa."
 france.278.t:0 "ECOMOG Refuses!"
 france.279.a:0 "Never! Heroes of Ukraine!"
 france.279.b:0 "They are a bit radical..."
 france.279.d:0 "In the aftermath of the recent conflict with Russia, we find ourselves under pressure from our Western allies, particularly France, which has called for the dissolution of the Azov Battalion. This demand has ignited intense debate within our government and society, as the battalion has been a crucial force in our defense against Russian aggression. \n\nSome argue that complying could improve our standing with Western nations and promote democratic values, while others warn that disbanding a unit that has demonstrated significant courage on the battlefield will weaken our national defense."
 france.279.t:0 "France demands dissolution of Azov Battalion"
 france.280.a:0 ""
 france.280.d:0 ""
 france.280.t:0 ""
 france.2810.a:0 "A continent Returned to its Roots."
 france.2810.d:0 "Our continent is a cornerstone of what civilization is, and what it should be.\n\nUnfortunately for the longest time there were deliberate efforts to undermine this for the sake of progress. Our adversaries prefer to call Europe some sort of ethnic monolith, where the native populace are all one and the same, and even if it were the case, this would not be a bad thing.\n\nNo, Europe has a rich history, a rich array of people and a landscape only God could make.\n\nWithout a doubt, our rival in the East would try to destroy that, and it almost did until we reigned in the wheel over France. Unity among our people, no matter what, is something worth striving for.\n\nWe love all Europeans here, and with a united effort we brought vengeance upon the Russian bear, broke it and scattered its remains across the East.\n\nThe continent remains forever united, history will look kindly upon us.\n\nFor we are the writers."
 france.2810.t:0 "Europe, Undivided"
 france.2811.a:0 "A Nation Reborn."
 france.2811.d:0 "It was said that when the french revolution occurred, that we would only know its true effects years later, well, that much is very true.\n\nThe republican experiment had been going on for a while, turning the French nation into a frail skeleton, unable to lift a finger and with the disappearance of our American friends, the experiment came under a lot of scrutiny. Following our defeat at the hands of the Russians, it would be appropriate that a return to form would occur, at desperate times you need an icon to rally behind, what is a monarch if not the spiritual manifestation of their subjects?\n\nWe undid the damage the republic left behind, we rejuvenated the pride in our nation, our people and our military. Russia was waiting for us, an inevitable clash in the clouds.\n\nWe did what our ancestors were not able to, Moscow remained in the hands of Europe. With our trail of fire, we have proven to the world that not all that is old is bad.\n\nEmpires come and go. But not this one. Not anymore."
 france.2811.t:0 "Heavy is the Crown"
 france.2812.a:0 "Reforging the identity we were taught to shed."
 france.2812.d:0 "No, we don't even need to sweeten the decade of humiliation the French nation had to endure at the hands of these sycophants, years of the cosmopolitans hollowing out our republic by importing cultures that hate us, giving away our strength to a world power that saw us as nothing but an experimental zone.\n\nYears of ethnic violence, years of economic hardship, the entirety of the European status quo telling us that we will be fine.\n\n''Retaliation is not how we do things in a civilized society.''\n\nThen Russia came, and the foreign rats would all scurry away with our wealth, the fat rich bastards would keep fattening themselves and what did that give us?\nThousands of young soldiers that lost their lives, a bitter defeat.\nNo more of that, the wrath of the French people would be inevitable.\n\nWe dragged them all away.\n\nFaux conservatism? buried.\nParasitic liberalism? obliterated.\nHostile cultures and peoples? not here, not anymore.\nThe French nation returned, with a blade sharpened with hatred.\n\nAnd we decapitated the bear, its cubs weeping, forever.\nA civilized society should be willing to defend itself with violence.\nAnd now the world knows."
 france.2812.t:0 "Hardened Hearts"
 france.282.a:0 "I am the revolution, and the revolution is you."
 france.282.d:0 "Without a doubt the revolutionary spirit returned to France after the reactionaries in Russia obliterated the rotting concept of ''The-end-of-history''.\n\nWith so many lives wasted to protect the ones in their ivory towers, it would be inevitable that we'd bring the sledgehammers and tear it all down, hanging the red banners over the corporate offices and to punish those who have hoarded the wealth of France. Eventually our fervour would cross into Russia and break the chains of our long lost comrades, the remnants of imperialism brushed away as our collective zeal exceeded theirs.\n\nThe grand return, the idea that communism would make a comeback was an idea that haunted those who hoarded power for decades, and now that we are here, they have scurried away like the fat rats they are, but they won't be able to run away from us forever.\n\nWe have returned. And we are not leaving."
 france.282.t:0 "Red star above Paris"
 france.2820.a:0 "Perpetual change, forever."
 france.2820.d:0 "The French revolution had shown to the world that the act of revolt should never just be a form of protest but an active form of punishment against the powers that be, and that is what we exactly did to the ones that caused our families to lose their children to Russia.\n\nBeaten and bruised, we struggled to pick ourselves up again but we did. The french republic had given itself into the temptation of capital, allowing greed to take root as our resources were extracted to the invisible hand.\n\nThe fiery flames of revolution were inevitable, violence is not always the answer but when it is, it has to be done properly, make our adversaries fear us, make our allies love us. The guillotine remained sharp for a reason.\n\nEventually we had to bring our wrath to the Russians, our hearts filled with courage and our minds filled with the love for the proletariat. Russia buckled under the pressure, letting its remnants be consumed by the flames of change.\n\nNo matter what, we have raised the red banner over Europe and alongside our comrades we will ensure that the world will be engulfed in red, for there are many brothers and sisters awaiting their revolution.\n\nOur future could not be more bright."
 france.2820.t:0 "Wrath of the Revolution"
 france.2821.a:0 "Art in peace in all aspects of life."
 france.2821.d:0 "You saw it at times right? The concrete covering up the sincere. The plastic choking out the creative. The glass piercing our culture.\n\nCapitalism has always been an all-consuming force that turns everything into a lifeless grey blob, turning everything into a rat race without meaning except a higher number. Art had been turned into a commodity, culture turned into a theme park attraction.\n\nAnd when fascism comes knocking at the door with an axe, it decimates all we hold dear, not just art but our friends and families. A peaceful quiet life where we can dedicate ourselves to what we love is not an impossibility.\n\nWe stamped out the forces of entropy, eradicated the desire for violence and are now able to rest under the trees we have planted.\n\nYou have seen the exceptional beauty of the revolution in France, you have seen it in Germany, you have seen it being spread to the east like a gentle brush stroke. Revolutions are a form of art, and the world will witness our magnum opus. "
 france.2821.t:0 "Beauty Above All"
 france.2822.a:0 "The Grand Design will be Completed."
 france.2822.d:0 "Wake up, see the fruits of your work, the revolution has been spread to the east like a wild beast chasing the prey that is capital.\n\nDoes this mean that you have won? No. Far from it. Capital is a monster, the second European war was merely scratching the surface. Europe might be united under a magnificent red banner but the beast is still limping across the world, hoping it can lick its wounds.\n\nAcross the world, the downtrodden cry out for the release from the beast, screaming for our people to save them, we might no longer feel the cuffs on our wrists but the high pitched screeching of the chain across the world is still very much heard.\n\nTake a breather, witness the revolution be made permanent. Watch the sun rise.\n\nOur work has just begun."
 france.2822.t:0 "A Single Brick"
 france.283.a:0 "A calm breeze over the continent."
 france.283.d:0 "France has known its own share of hardships for decades, wars and occupations, revolutions and riots, these are the scars we have to live with, these are the memories we hold.\n\nOur people's faith in democracy has been shaken over and over again and with the implosion in America, it would seem inevitable that the forces of tyranny would stomp France into the ground. It definitely tried, Russia as opportunistic as ever tried to expand its influence over Europe by force. We always knew we couldn't always rely on the Americans, as Europeans we need to be able to stand on our own feet, just like our ancestors did. With clear minds and fierce courage in our hearts, we beat back the Russian threat, of course, this did not stop them from trying again.\n\nWe defeated them again, with Russia having turned into an infernal war machine it soon collapsed into itself, we simply helped in kicking it all down. France has always been a beacon of independence and self-sufficiency, we have never been the client state of another power, and never will be.\n\nThe protectors of the continent, not forged in hatred or tyranny. But in freedom and democracy."
 france.283.t:0 "The Rooster arises in the Morning"
 france.2830.a:0 "A calm breeze over the continent."
 france.2830.d:0 "Our continent has always been surrounded by turmoil, when our American friends turned their daggers against one another, it would be inevitable that our biggest adversary in the east would look to the west with hungry eyes.\n\nThe human aspect of geopolitics is something that remains dear to us, to protect our democracy and to protect the people that need it the most. We don't turn people into mere numbers, and when Russia came crashing down towards the West, we were ready.\n\nYou don't simply win wars by killing as many people as possible, you win them by keeping the enemy aware of your extended olive branch, letting them know peace is an option. Our victory was inevitable, however defeat would prove to leave a bitter taste among the Russian higher ups, vengeance becomes a blind obsession. \nSo again they came, and again the olive branch was held above their heads. \nThis war should not have happened, but we could not sit idly.\n\nWe have proven to the world that the dark pages in history are dark for a reason, and that we should never repeat those mistakes ever again. \nLiberty, equity, democracy \nThese are words to live by, and when the east rebuilds itself again.\n\nThe olive branch will be extended once again"
 france.2830.t:0 "Pink tide over Europe"
 france.2831.a:0 "And the people woke up."
 france.2831.d:0 "France has known its own share of hardships for decades, wars and occupations, revolutions and riots, these are the scars we have to live with, these are the memories we hold.\n\nOur people's faith in democracy has been shaken over and over again and with the implosion in America, it would seem inevitable that the forces of tyranny would stomp France into the ground. It definitely tried, Russia as opportunistic as ever tried to expand its influence over Europe by force. We always knew we couldn't always rely on the Americans, as Europeans we need to be able to stand on our own feet, just like our ancestors did. With clear minds and fierce courage in our hearts, we beat back the Russian threat, of course, this did not stop them from trying again.\n\nWe defeated them again, with Russia having turned into an infernal war machine it soon collapsed into itself, we simply helped in kicking it all down. France has always been a beacon of independence and self-sufficiency, we have never been the client state of another power, and never will be.\n\nThe protectors of the continent, not forged in hatred or tyranny. But in freedom and democracy."
 france.2831.t:0 "The Rooster arises in the Morning"
 france.2832.a:0 "We have visions..."
 france.2832.d:0 "Across history there have been many great leaders, icons that stood out above the darkness, those were the ones that would be remembered forever.\n\nEven in five hundred years would Caesar, Alexander, Charlemagne and many more be remembered.\n\nEmmanuel Macron is one of them, under his vision did France stand against the Russian aggressors, under his vision was France pulled out of the tempting allure of chaos and strife.\n\nUnder his vision was France able to stand against a vengeant Russia again, HE was the one that broke Russia, not Germany, not the UK.\n\nAnd now, France lays under his watch, the tedious democratic progress has held back France for decades and now with his reputation solidified, in five hundred years will he be remembered as one of the greats.\n\nEurope will stand strong.\n\nFor it has a new great man."
 france.2832.t:0 "Among the Greats"
 france.284.a:0 "These are the questions that keep Henri up at night."
 france.284.d:0 "Over the desert flies a French transport helicopter, the blinding Saharan sun has set for the time being sparing its inhabitants from the unrelenting heat only to let in cold temperatures. \nHenri clutched his rifle, looking out over the expanse, lost in the droning of the rotors. \n\nThey were approaching the insertion point, a small oasis in the desert creeped up on the horizon, a village on no one's map nestled within the few savannah trees. Supposedly here resides a weapons stockpile that's been supplying some Islamist rebels or so they told Henri, it's all a bunch of political stuff above his office. The helicopter lands and distant yelling comes from within the building, obviously they've been heard. \n\nMoving quickly they form into squads, clearing building by building, waking up families dressed in rags in poorly furnished homes, crying children, gunfire in one of the houses and the French fire in return, and in the basement they have found the stockpile. A boy hugs tightly the man who they shot, Henri takes up rear security, watching the door as inventory is taken, they seized 1,823 Kalashnikov rifles and over 84,000 rounds of ammunition. It was a major bust, but was it worth this kids father?"
 france.284.t:0 "The Old Empire"
 france.285.a:0 "Tafsir Surah Ali 'Imran - 169"
 france.285.d:0 "Ibezimako Chinwendu was born in 1988 to an Igbo family in Amaeke, Southern Nigeria, living a life one could only describe as pure tragedy. He grew up with scarce access to clean drinking water or even proper meals, attributed to the federal government's lack of effort, and lack of care, to fund and re-integrate communities like his nestled within the war-torn south of the country. This led him to detest the greedy and remarkably corrupt military elite that policed him, his friends, and above all else, his family. He found solace in the comfort of Islam, the martyrs that defined entire eras because of their ambition and struggle for their faith. This was a travesty, a complete betrayal of the principles those above claimed to follow and worship. Things had to change.\n\nAnd so, they did. He was now 33, no longer suffering in the rural south of his home country. The seeds of entropy planted 20 years ago had long begun to take root, suffocating the essence of his spirit and only allowing a passion for hate to breathe through. To those who had known him, he was unrecognizable now, covered in ISWAP insignia below the signature black bandana that had become infamous across not only the Middle East and Africa, but the world. He was perched upon a steep hill, overlooking a French military base just outside of Bula Bul.\n\nHe was there for one reason only, to give his life for Islam.\n\nHe had sat there, upon that hill, between Dalbergia branches and the wind that covered his entire body. He held his beating heart as he thought things over for a moment. He was terrified. Deep in his heart, he knew he didn't want to do this. But he also knew that he had to. This was the culmination of everything he had fought for, the chance to finally make a name for himself amongst the shahids before him. Had they, such as Sumayya and Yasir RA, been just as afraid in their final moments? Possibly, possibly not. It would not matter in the end, when they stood before The Creator in the afterlife. Only their actions did. \n\nAnd so, he descended the hill towards the lights illuminating him, gripping his vest as he dove into the unknown for one last time."
 france.285.t:0 "And They Live On"
 france.286.a:0 "''Pierre, it is out of your hands now.''"
 france.286.d:0 "Protests have been burning in Paris for days over the Macron governments policy, retirement age cuts, inner ethnic tensions, anti government sentiment, tens have been injured and as the Yellow Vests continue to grow in number, riot police begin increasing their crackdowns on protests. It was a loud sunset when a local bartender approached, yellow vest over his uniform, respirator on his face, carrying two full cases of empty bottles he had collected from his shift.\n\nPierre stood at the rear, the organizer for the protest on this specific street, the Bartender laid the cases by him with a clang of glass so common in his line of work\n''You bring refreshments?'' Pierre says half amused\n''Ammunition.'' The Bartender says, fire in his voice.\n''No no no, surely you don't mean that?'' Says Pierre\n''Just add petrol.'' The Bartender says, a grim giggle drowned out by the chanting.\n''This is madness, Barkeep! Petrol bombs? We could kill people.''\n''They're killing us too, their policies, their batons, you want to wait until they break every isolated pocket of protests or make a bang while you can?''\n\nThe Bartender and Pierre share a tense glance. Both men fight for the people, but they are two sides of one coin.\n''The police are just following orders.'' Pierre states firmly.\n''With or without you, we will convince them not to.'' and with that, the Bartender takes a case of bottles to the nearby petrol station as a colleague brings forward a case of prepared molotovs."
 france.286.t:0 "The Bartender"
 france.287.a:0 ""
 france.287.d:0 ""
 france.287.t:0 ""
 france.288.a:0 "Everyone who dreams of a 'new order' ends up becoming a tyrant."
 france.288.d:0 "In the 'Golden Tulip' café, Mathieu LeBlanc and Émilie Duval's debate had stretched on for two hours. 'We have to admit,' Émilie declared, this so-called Fifth Republic is dragging France into an abyss. Look at us now-a soulless administrative machine, a parade of empty-talking politicians, and reform promises that never materialize.\n\n'You're too radical, Émilie,' Mathieu replied, setting down his coffee cup. The republic has given us two centuries of stability and progress. It's this very system that's safeguarded us from dictatorship and tyranny.\n\n'Stability?' Émilie scoffed. You mean stagnation. What was France like under de Gaulle? Back then, we shaped Europe's political destiny. And now? We can't even control our own fate. This system is rotting, Mathieu. It's a dressed-up corpse shambling through modern streets. \n\n'France has its flaws, but the solution isn't to tear everything down,' Mathieu said earnestly. Every radical overhaul has come at a terrible cost. Real progress should be gradual and rational. \n\n'But incremental reform can never address the core issues,' Émilie countered. 'The problem with this system isn't superficial-it's foundational. We need a new system that truly reflects the will of the people, a new order that restores France's glory.'\n\nMathieu sighed..."
 france.288.t:0 "The Debate at Golden Tulip"
 france.289.a:0 "''I'm... sorry that you feel that way...''"
 france.289.d:0 "At an afternoon campaign meeting, Jean-Pierre had just finished presenting Macron's economic recovery plan when an elderly man with snow-white hair suddenly stood up from the audience. ''You talk about 'reform'?'' His voice carried the weight of decades of life experience. \n''Let me ask you this: why is it that my grandson, a young man with a teaching degree, can't even afford to rent an apartment?''\n\nBefore Jean-Pierre could respond, the old man pressed on: ''You always talk about globalization, the digital revolution, about making France a hub of innovation. But tell me, when a farmer can't even make ends meet, what do these lofty slogans mean to him?''\n\n''Every time I see him on TV, dressed in that tailored suit, speaking the language of bankers about reform. Has he ever heard about the stories in Burgundy? Where vineyard farmers are abandoning their ancestral lands because they can't afford to comply with the new environmental regulations?''\n\nThe old man's hand trembled as he pointed at the campaign poster. ''I've lived here for over seventy years. I've seen the era of de Gaulle, and I've heard the promises of Mitterrand. But never, at any time, have I felt so estranged from my own country as I do now.''"
 france.289.t:0 "The Campaign Rally"
 france.290.a:0 ""
 france.290.d:0 ""
 france.290.t:0 ""
 france.291.a:0 "''If we can't even argue beautifully anymore, are we still French?''"
 france.291.d:0 "''Let me tell you something funny,'' Jean-Paul Duval began, standing under the spotlight at a comedy club, his smile warm and inviting. ''Yesterday, I saw two protest marches collide on the Champs-Élysées. The pro-vaccine group was shouting, 'For France, we must vaccinate!' while the anti-vaccine group was yelling, 'For France, we must refuse vaccines!' How ironic—both sides claim to love the same country but would gladly kick the other out of it.''\n\n''The anti-vaxxers called the pro-vaxxers 'tyranny's accomplices,' and the pro-vaxxers accused the anti-vaxxers of being 'agents of chaos.' Eventually, it turned into a brawl. And I thought, if everyone loves France so much, why not meet at a café, enjoy a croissant, and accuse each other of treason over coffee? At least that would feel more... French, wouldn't it?''\n\nJean-Paul paused, his face reflecting mock contemplation. ''What's stranger is that both sides claim the other is brainwashed. It reminds me of my neighbors. The ones on the left say I've been brainwashed by the right, and the ones on the right say I've been brainwashed by the left. So, I decided to move upstairs. Now, they just say I'm above it all.''\n\nThe crowd erupted in laughter. ''So,'' he raised his glass, ''let's toast to France. To a country with revolution in its DNA, to a nation that even turns arguments into an art form.''"
 france.291.t:0 "The Laughing Cough"
 france.292.a:0 "What a clown."
 france.292.d:0 "''Rodolphe Prudhomme, please take the stand.'' announced a Les Identitaires party clerk standing on the podium. \n\nRodolphe Prudhomme was a respected and senior member of the Bloc, having done well to spread the growth of the movement in his home city of Bordeaux for years. Today, he would lead the opening session of a meetup in the Talence Commune, the gathering area situated just outside of a public park. It would be a good way to attract both negative and positive attention, as well as defining the movement's strategy in the region for the yearly quarter to come. \nAfter his name was called, Rodolphe stepped upon the podium, giving his regards to the clerk, and began to speak. The rigor and tenacity in which he spoke, despite his age, was one of the many reasons for his meteoric rise in the party. He spoke with the enthusiasm of the revolutionaries and martyrs of the 20th century that fought before him, contrasted with his wisdom and insight that the new generation after him would need. The crowd cheered him on as he spoke of the influx of Turkish, Maghrebi, and Sub-saharian migrants in Grand Parc who had become a majority. \nEventually, he concluded his speech, passing the stage to Léon Duverger, a much younger and inexperienced member of the party. This was a deliberate decision, meant to symbolize a ''passing of the torch'' of sorts between the old and young. What he did not know was how widely Léon was mocked for his inconsistent and sometimes comical belief system, as well as his rather unpleasant vocabulary.\nIn spite of his comrade's disparagement, Léon took the stage, beginning his speech.\n\n''Friends and brothers, I would like to start off by responding to Monsieur Prudhomme's strategy in the Gironde Department. With no disrespect to the great man himself, how can the Eurasianism of the West achieve its goal if it-'' \n\nThe man was interrupted by a cacophony of laughter and boo'ing, attributed to his ill choice of words. He tried to continue speaking, however he was laughed off the podium, and eventually out of the Party, as a result of this very strange speech."
 france.292.t:0 "Eurasianism of the West"
 france.293.a:0 "''Alright, boys, stay sharp!''"
 france.293.d:0 "Major Antoine Dupret's fighter jet soared over the Sahara, the desert stretching out beneath him like a magnificent golden tapestry from 30,000 feet. The undulating dunes shimmered in the heat haze. Behind him, the rest of his squadron flew in perfect formation against the blue expanse, their wings glinting under the blazing sun. \n\nThrough the canopy's plexiglass, Antoine could clearly see the rolling sea of sand below. Heat waves distorted the horizon, making everything in the distance appear like a mirage. Suddenly, in the southwest, he spotted an unusual trail of dust. Activating the onboard optical system, he identified a convoy of vehicles moving sluggishly, their long shadows stretching under the sun like a line of crawling ants. \n\n''Command, this is 'Lyra.' Suspicious convoy spotted at coordinates 23°15'N, 5°47'E. Approximately twelve vehicles heading south.'' \n''Roger, 'Lyra,' '' the base commander's voice crackled through the headset. ''Engagement authorized.'' \n''Understood. 'Sword 2,' 'Sword 3,'' Antoine said over the comms, ''-adjust heading three degrees southwest, maintain altitude.''"
 france.293.t:0 "Desert Eagle"
 france.294.a:0 ""
 france.294.d:0 ""
 france.294.t:0 ""
 france.295.a:0 "They stood watching as the flames slowly died."
 france.295.d:0 "On a quiet night in Montparnasse, Étienne Lemaire and Sophie Dupont lit a fire in a metal barrel in a narrow alley. The flames danced on the brick walls, casting their shadows. Étienne held a gold-embossed Bible, while Sophie leafed through a worn translation of the Quran, both inherited from their devout grandparents.\n\n''Look at this,'' Étienne said, tracing the Bible's pages. ''Every word is a chain, stifling imagination. Do they really think they can suppress the human spirit?'' He threw the Bible into the fire, and Sophie followed with the Quran. The pages curled in the flames, the gilded letters twisting like prisoners in torment.\n\n''They call this blasphemy, but isn't it a greater sin to trap life's passion in these aging pages?'' Sophie said, pulling more religious texts from her bag. The scent of burning paper mingled with the faint fragrance of wild roses. Across the alley, light from a café stretched their shadows long.\n\nSophie took a sketch from her pocket, tore it into pieces, and tossed them into the fire. ''Art shouldn't be confined to paper; it should be reborn through destruction.'' The firelight reflected on her pale face, making her seem both rebel and priestess.As the last page turned to ash, a distant bell struck midnight. "
 france.295.t:0 "Stars in the French Night"
 france.296.a:0 "A Republic, if you can keep it..."
 france.296.d:0 "''I am ninety-seven years old,'' Paul Duval began, standing at the podium of the memorial hall. His wrinkled hand gently brushed the medals on his chest. ''Back then, on the battlefield, we young men fought to defend the ideals of the Republic. Freedom, to us, was not an abstract concept but a belief worth laying down our lives for.''\n\nHe paused, his gaze sweeping across the youthful faces in the audience. ''But today, I see some troubling signs. Some say democracy is outdated, some argue for a strongman to lead us. Young people, these were the same arguments we heard in 1940. The appeasers back then spoke the same words.''\n\n''You may think I'm just an old man rambling about the past. But remember, history never repeats itself exactly—it always returns in a new guise. The fascists of today won't wear military uniforms; they will don suits, speak eloquently, and promise you a 'better' future.''\n\n''My time is running out, but the future of France belongs to you. The freedom and equality that our generation paid for in blood is now in your hands. Do not be swayed by words that seek to deceive. Do not replace reason and tolerance with hatred and prejudice. Do not let the sacrifices of those who died for freedom be in vain.''\n\n''Remember, true patriotism is not about hating others, but about cherishing the values we share. France's greatness lies not in its military strength, but in the spirit it represents.''"
 france.296.t:0 "Echoes of the Past"
 france.297.a:0 "Le family... Le chaos."
 france.297.d:0 "The room was dim, lit only by the flicker of a Gauloises cigarette smoldering in the ashtray. Jean-Marie Le Pen sat across the ornate wooden table, his fingers drumming rhythmically against its surface. On the other side, Marine, dressed in a sharp blazer, sipped her coffee with practiced nonchalance, her eyes wrought the exhaustion of countless rallies and meetings. \n\n''So,'' Jean-Marie began, his voice gravelly, ''you think you've moved past me.'' \nMarine raised an eyebrow, her expression unreadable. ''Father,'' she said evenly, ''it's not about abandoning you. It's about evolution. People don't want to hear blunt racism anymore. They want... nuance.'' \n\n''Nuance?!'' Jean-Marie barked, nearly tipping his chair back. ''Is that what you call it? Pandering to the weak? Diluting the message that built this family's party? And yet,'' he said finally, exhaling a plume of smoke, ''you still keep my shadow by your side. Every speech, every platform, every policy, your mother would have called it an homage.'' \nMarine smirked, the corner of her mouth twitching upward. ''Not an homage. A correction.'' \nThe old man chuckled, a sound like gravel tumbling down a hill. ''Well, little one,'' he said, stubbing out his cigarette with a sharp twist, ''If you're going to correct me, at least do it properly.''"
 france.297.t:0 "Rassemblement Familial"
 france.298.a:0 "It's not always about numbers, Cyril."
 france.298.b:0 "I think they could do to be a little less afraid of themselves."
 france.298.d:0 "Cyril Hanouna finishes his nightly introduction as he has done for years before inviting on his guests, tonight he has an incredibly special guest. \n\nBrigadier General Pierre Schill. \n\n''Please welcome General Pierre Schill!'' The French-Tunisian host exclaims to applause from the studio audience, the general comes out in uniform, his officers kepi shining in the studio light. General Schill gives a wide smile and takes his seat. \nSchill knows Hanouna is a comedian, meant to make the crowd and the nation laugh, and inviting an army official on your show means you must have some funny things to say, the general smiles uneasily as Hanouna begins to speak. \n\nAt first it's normal, but it shifts towards Frances allies, and eventually the focus settles on Germany. ''What about the Bundeswehr?'' Schill asks. ''Well, it's small don't you think? Hah!'' Hanouna jokes, Schill shifts, he's a major officer in the NATO command and his words could sour relations between the two nations. \n\nHis response holds a lot of weight, he hesitates, he feels the studio lights on his face, and he inhales..."
 france.298.t:0 "Touche pas à mon poste!"
 france.299.a:0 "All you can do is watch"
 france.299.d:0 "The Yellow Vests have done it again, another grand protest has overwhelming the police force deployed to contain them, they run freely, a street previously kept devoid of protests for fears of destruction was now opened to them as the police fled to fallback points, lines broke apart, protests melded together, the organizers lost sight of whos protest was whos as anarchy consumed the streets of Lyon. \n\nTwo groups converge in front of Lyons town hall, one holds rocks, hammers, the other holds their signs wrinkled from days of constant protest. A rock crashes through the window, one protester yells ''No! Spare the offices! People work there!'' And the other group responds by slamming a hammer into the front door. \n''They should not work for the tyrant then!'' And another pane of glass breaks. \nThe peaceful group stands in front of the door, poised to prevent the ransacking of the building.\n''MOLOTOV!'' One yells, and they dive from the stairs, the entrance lighting on fire, the door smoldering in moments. They watch in horror as their comrades mount the windows and come out with televisions, phones, computers. They know hundreds have been put out of their livelihoods for months to come, a tragedy has occurred for the working man this day even if it's in pursuit of change."
 france.299.t:0 "Lyonnaise Liquidation"
 france.3.b:0 "Macron emerges Triumphant"
 france.3.c:0 "Electronic Voting crashes immediately, hand-written ballots only."
 france.3.e:0 "The Popular Front squeaks by!"
 france.3.f:0 "Villiers stands Triumphant"
 france.3.g:0 "Le Pen loses by slim margins..."
 france.3.h:0 "Macron loses by slim margins..."
 france.300.a:0 "We are the Champions of Third World Democracy!"
 france.300.b:0 "We are there for our national interests, nothing more."
 france.300.d:0 "The relationship with France and Africa is... complicated, to say the least.\n\nOur colonization of Africa was undoubtedly an unfortunate period in both our histories. The legacy of colonization remains in Africa in that Africa suffers from instability from anti-democratic forces, suffers from economic poverty, and health crises.\n\nDue to this, many in our government feel it is our responsibility to right the wrongs we committed. They claim it is our fault that Africa has suffered a lot. To do this, we must support Africa's development by aiding and supporting local democracies and stopping the spread of extremism and autocracies.\n\nBut France is not unanimous. Many believe there is little point in doing this, as more often than not, in the quest to stop dictatorships, the country has been left in a worse state than before, such as Libya. They do not deny that there is a lot to be gained from Africa, mainly its rich abundance of natural resources. There is, however, no need to further entangle France into more costly conflicts that never seem to end. In any case, either path we choose will decide our future in Africa.\n\n"
 france.300.t:0 "Our Legacy in Africa..."
 france.301.a:0 "Another tantrum before bedtime."
 france.301.d:0 "In a sudden, but not particularly surprising, turn of events, many of France's top union leaders have had corruption charges brought against them. Misuse of funds, brides, laundering, and general fraud have all come into the limelight. Despite the ample evidence both of the court's nonpartisanship and the validity of the evidence, many of the various unions' supporters have come out in protest against what they call an attack on the workers and a clear sign of government overreach on the side of big business. Many of these protesters have turned to violence and smoke can be seen rising in many of France's cities. Even with the CRS being deployed for a crack down, it is likely to not be fully snuffed out until those involved lose interest."
 france.301.t:0 "Union bigwigs brought up on corruption charges"
 france.304.a:0 "Then it shall be so!"
 france.304.b:0 "''Uh... I don't think you can do that?''"
 france.304.d:0 "Emmanuel Macron sat in his office in Paris, it was a beautifully bright day, he stared intensely at a flag in the distance. \n\n''It should be darker.'' He said, absent mindedly to himself. ''I would like it to be darker, it blends into the sky too well. Go get one of the darker ones and have it put up, go.'' He says, motioning to a Presidential Guard."
 france.304.t:0 "Darker Colors for a Darker Age."
 france.305.a:0 "Step One..."
 france.305.d:0 "Recently, a conservative politician, Jordan Bardella, has been going through multiple means of spreading his message of Free Speech for anyone who would care to listen. He has petitioned parliament in attempts to get them to change limitations of the Freedom of Speech laws for the nation of France. While admirable, it has been called into question by the media as Bardella specifically has started this campaign since the far-right, Identitarian party, was officially censored by the French administration."
 france.305.t:0 "Bardella speaks out on Freedom of Speech"
 france.306.a:0 "Our time in the spotlight has come..."
 france.306.d:0 "Following extreme chaos in his term as re-elected president of the French Republic, Macron has seen it fit to declare a state of National Emergency and invite the conservative National Rally to the government in efforts to calm down the chaos.\n\nWhile criticized by his partners and even some members of his own party, it was claimed to be a necessary decision in these times of hardships and strife, the step that must be taken to assure that France does not once again collapse into hardship and civil conflict.\n\nOnly time will tell what may come of this. The sand falls from the hourglass, towards the hour of decision. No matter what it all becomes in the end, fate is sealed towards only a few paths."
 france.306.t:0 "National Emergency Declared"
 france.307.a:0 "and then Mars Rises..."
 france.307.d:0 "Emmanuel Macron sat in defeat today as he announced publicly for the entire nation to see that he would be resigning as the president of France and appointing the conservative Jordan Bardella as his replacement. With the recent state of emergency declared and Macron's cabinet being dissolved, it seemed evident this day would come.. after all his grip on control has been slipping with his own party calling for his removal due to the tyrannical declaration of martial law. But now it was not time for Macron to sulk, it was time for Bardella to rise as the savior of France, the man who would save France from the Slavic hoard"
 france.307.t:0 "Jupiter Falls"
 france.309.a:0 "Rumors are only Rumors"
 france.309.b:0 "We could never be Brothers..."
 france.309.d:0 "Since times of antiquity, the French and the German people have never seen eye to eye. This changed after the Second World War, after we forced the Germans to remove all aspects of Prussian Militarism from their identity. Through disregarding this militarism that defined Germany for so long, we had inadvertently crippled any chance that Europe could stand alone against the Russian behemoth... \n\nBut now, Russia is defeated, fractured beyond recognition, and Prussian militarism is once again thriving. Our spies report of German nationalists whispering of our supposed weakness... Demanding a ''Honorable requisition'' of their former territories of Elsaß-Lothringen... Putting our ancestral lands of Alsace-Lorraine at risk of being under the German jackboot is not something our leaders, nor our people, are willing to do."
 france.309.t:0 "The Ties that Bind"
 france.310.a:0 "We will Crush them!"
 france.310.d:0 "Citing disdain with the few Germans wishing for our government to reclaim our former territory of Elsaß-Lothringen, the French government has left the Pact of Steel. Although unexpected, this does mean that we have no more diplomatic reasons to avoid the topic of the reclaimation of Elsaß-Lothringen, our LOST province. \n\nEven now, we can hear the German people under the French occupation crying for liberation from their fatherland. We shall Reclaim what was Once ours! We shall destroy the French State once and for all, [GER.GetLeader] shall once more humiliate the French people and their attempt at military, just as Bismarck and Hitler once had."
 france.310.t:0 "France abandons the Pact"
 france.311.a:0 "United We Stand!"
 france.311.b:0 "No need! The Pact is Great!"
 france.311.d:0 "TODO English event pitting them against Germany with France"
 france.311.t:0 "The Old Entente"
 france.312.a:0 "The Rhine is France's Natural Border!"
 france.312.d:0 "Following our independence from the bureaucracy of Berlin, the German government have reaffirmed their claim to the hisorically French region of Alsace-Lorraine. The blind nationalism of the Germans was expected, and we have but one response... The Rhine. \n\nThe Rhine river has been the natural border between the civilized world and the barbarians since times of antiquity, and it is obvious that the Germans cannot be trusted with self-governance."
 france.312.t:0 "Germany Claims Alsace-Lorraine"
 france.32.a:0 "And once again, a log is added to the pile..."
 france.32.d:0 "Following the walk-out of nearly the entirety of the Flemish parliament, many within the Wallonian parliament have actually agreed to the seperatist proposal, citing that they simply cannot force the Flemish nationalists to be a part of a country that they don't want to be in."
 france.32.t:0 "Break up of Belgium"
 france.33.d:0 "Following a petty disagreement on the budget of the Secretary of State for Gender Equality, Equal Opportunities and Diversity, the representatives of Vlaams Belang, a Pro-Dutch seperatist group, stormed out of Flemish parliament. Outside of the Flemish parliament, party chairman Tom Van Grieken declared the parties intention on seperating Flanders from the Belgian government. Holding a majority of seats from the region of Flanders, this request has prompted the Dutch government, led by the young Queen Catharina-Amalia, to declare their support for the Flemish parliamentarians."
 france.33.t:0 "Representatives of Flanders walk out"
 france.34.d:0 "Following a sweeping electoral victory, with almost dictatorial power, the Rassemblement Wallonie France, or RWF, has announced the dissolution of the Belgian monarchy and the establishment of a secular Republic. \n\nFollowing this announcement, the former Belgian royal family fled to the United Kingdom, although they were promised that no harm would come to them or their estates in the process in establishing the government."
 france.34.t:0 "Wallonia declares a Republic"
 france.35.a:0 "Rattachism has been made right!"
 france.35.d:0 "Following a declining economy, and the unpopular removal of the Belgian monarchy, the government of Wallonia has requested the unification of the French and Wallonian government, citing the collapse of Belgian government control. Although initially opposed to this annexation, the German government has only requested that the citizens in the largely German-speaking territory of Eupen-Malmady be granted dual citizenship between France and Germany, to ensure that their needs are fulfilled by the new French mandate in Wallonia."
 france.35.t:0 "Republic of Wallonia requests Annexation"
 france.351.a:0 "The Idea of Belgium Lives on..."
 france.351.d:0 "In the heart of Wallonia, a forgotten church stood, its once vibrant walls now worn and weathered by the passage of time. It was in this abandoned sanctuary that an extraordinary event was about to unfold-the crowning of Elisabeth I, the long-awaited heir to the throne of Belgium. As the rays of sunlight pierced through the shattered stained glass windows, casting a kaleidoscope of colors upon the dilapidated pews, a hushed anticipation filled the air.\n\nThe echoes of history reverberated as Elisabeth, clad in regal attire, stepped into the forgotten sanctuary, her presence commanding respect and awe among the Royalist officers. With grace and dignity, she ascended the makeshift dais, where a simple silver crown awaited her.\n\nIn that humble church, where the ghosts of the past mingled with the hopes of the future, Elisabeth I was crowned, anointing her reign as a beacon of resistance for the people of Belgium. As she raised her head, the light streamed through the broken ceiling, illuminating her radiant face. With each step she took, the floorboards creaked beneath her, as if echoing the weight of her responsibility. The Royalist remnants of Belgium had found their leader, and Elisabeth embraced her role with unwavering determination, ready to lead her nation towards a tomorrow, free from French and Dutch tyranny."
 france.351.t:0 "Elisabeth I Crowned"
 france.352.a:0 "At least something came out of it."
 france.352.d:0 "Belgium has fallen miraculously, while we have been watching the domestic situation in Brussels carefully we never expected the dissolution of Belgium into two Republics but it has occured, with Wallonia and flanders respectively joining the French and Dutch spheres. \n\nIn the balance hangs 100,000 Germans in the Imperial territory of Eupen-Malmady, which has left our government with a decision to make and a century of history to consider. Many within the AfD are demanding that we request its return to our lands but this was likely to harm relations with our allies. It was decided an emergency session of the Bundestag would be called to address the issue. The majority of the parties, most notably the SPD, backed the plan by the AfD to grant the people Dual Citizenship between France and Germany as a sign of unity, drafting the proposal and sending it to France, the response from Paris was positive, citing no reason to disallow the people of Eupen from choosing where they would be in this modern day of a Federalized Europe. \n\nThe city of Brussels has been turned into the first sovereign territory of all Europeans. Turmoil across Belgium is still very present as the monarchy is growing more and more dictatorial as their power slips, with whispers of a Republican revolution spreading across Wallonia. The British have protested this entire situation, but has not taken any actions to protect the Belgian government, a relationship creating first in the Napoleonic times."
 france.352.t:0 "Belgian Government Dissolves!"
 france.36.a:0 "Tragedy befalls the Netherlands"
 france.36.d:0 "A terrible tragedy has unfolded for the Netherlands today as the King of the Netherlands, Willem Alexander, has reportedly been assassinated! During a large public venue event attended by the king, a lone shooter approached close enough to the royal family and was able to fire a few rounds at him, striking him in the chest. Local paramedics pronounced the monarch as immediately deceased with the gunshot wounds to the chest being almost instantly fatal. The gunman, after promptly murdering Alexander, was promptly killed in a shootout with Dutch law enforcement. Based on currently available information, the perpetrator was a devout anarchist from the Dutch Caribbean and preemptively planned to murder King Alexander. Dutch police and intelligence services have opened an extensive investigation into both the perpetrator's background and other linked suspects in the case. Current police estimations predict that it is possible that other anarchist or extremist individuals may have been involved in the planning and preparation for the murder. A national week of mourning has been planned by the Dutch government in response to the monarch's assassination."
 france.36.t:0 "Dutch King Assassinated!"
 france.37.a:0 "The Die is Cast"
 france.37.d:0 "Paris was never the same since the end of the war. The terrible defeat at the hands of the Russians created a dreary and nihilistic atmosphere that now hung over not just the city, but under everyone working within the national government as well. Nobody could believe it. The highest echelons of French society were now paralyzed with loss and indecision. However, others had taken the opportunity to ''act'' on the situation in the country's ''best interests''. \n\nAs the morning went on for Paris, near the Élysée Palace, a curious scene was developing. Normally, for the weekly meetings with cabinet and parliament members, you would only be able to see the expensive cars of politicians parked outside, but today would be different. Within the first hour of the opening of the morning session, Rows upon rows of army trucks and vans came roaring towards the estate, pouring into the street and outside perimeter. They stopped abruptly as their doors and rear cargo holds opened as officers, soldiers, special forces operatives, all with FAMAS assault rifles in hand, piled out of the vehicles. The leading men of the entourage, generals decked with awards and accolades, forcefully pushed down the front doors of the estate with the soldiers and officers following. The politicians, all chit-chatting in the main hall, were all taken by total surprise by this odd intrusion. Unbeknownst to them, their time had come. \n''What in the world is going on here?! What is the meaning of this bizarre stunt?!'' one of the MPs exclaimed. \n''We are executing or constitutional duties sir.'' the lead general remarked with cold seriousness, ''we have our orders to detain all identified officials who have failed in executing their responsibilities to the nation.'' \n''You- what?!'' the MP blurted back with shock, ''This is ridiculous! This is illegal! You can't do this! This is all treason of the highest order!'' \n''No sir'', the general said as he took out his sidearm, ''it is you who have committed treason. You will be coming with us and following our exact instructions. The country's national interests have been betrayed, and we are here to make sure order is restored.'' The general then waved to the soldiers behind him, who then began fanning out to apprehend and seize the entire complex for themselves. The ''traitors'' had now been dealt with. A new order was now in place for France. "
 france.37.t:0 "Crossing the Rubicon"
 france.371.a:0 "Liberty is Secured"
 france.371.d:0 "After a harrowing civil war that pitted us against both the nationalists in the north and the communists in the south, the establishment forces have finally secured control over central France. Our victory, though hard-won, has come at an immense cost, leaving our cities scarred and our society fractured. As we survey the aftermath of the conflict, it is clear that our nation is in dire need of healing and reconstruction. The establishment stands firm in its commitment to restore order, uphold democratic values, and reunite a divided populace. \n\nWith the threats from both nationalists and communists subdued, we now face the monumental task of rebuilding our nation. Our first priority must be to reestablish vital infrastructure, restore public services, and address the grievances that fueled the conflict. We must launch national unity campaigns to mend the ideological rifts that have divided our people, fostering a collective spirit of cooperation and progress. However, we are acutely aware that the potential for unrest remains, and any misstep could reignite the flames of discord."
 france.371.t:0 "The Last Bullet"
 france.372.a:0 "Equality is Secured"
 france.372.d:0 "After a relentless struggle against the establishment and the nationalists, the forces of the people have emerged victorious in the civil war. Our triumph marks the dawn of a new era for France, where the ideals of equality, solidarity, and social justice will finally take root. The brutal conflict has left scars across the nation, but from this turmoil, we will build a society that serves the interests of the working class, not the elites. The time has come to reclaim our country and ensure that power truly resides in the hands of the people. \n\nWith the establishment in disarray and the nationalists pushed back, we now face the critical task of uniting our fractured society under the banner of communism. The challenges ahead are significant, as we must restore vital infrastructure and provide for those displaced by the war. Our first steps will focus on implementing land reforms, nationalizing key industries, and expanding social programs to uplift the marginalized. We are committed to fostering a spirit of cooperation among the citizens, encouraging them to actively participate in shaping their own future."
 france.372.t:0 "The Nation, Liberated"
 france.373.a:0 "Fraternity is Secured"
 france.373.d:0 "After a grueling civil war that tested our resolve, the nationalists have emerged victorious, decisively defeating both the establishment and the communist factions that threatened our great nation. Our unwavering commitment to restoring order and national pride has triumphed over chaos. With the northern regions secured and the threat of leftist insurrection quelled, we now stand at the helm of a united France, ready to reclaim our destiny. The sacrifices made during the conflict have forged a new sense of identity among our people, one rooted in strength, unity, and patriotism. \n\nAs we take control of the government, our foremost task is to solidify our power and ensure the stability of the nation. The remnants of the establishment and the communists are still lurking, but we will not falter. We will instill a renewed sense of purpose in our citizens, fostering a spirit of nationalism that will bind us together as we rebuild our cities and restore our economy. Through decisive leadership and a commitment to our values, we will create a society where order prevails, and the true spirit of France is celebrated."
 france.373.t:0 "Opération: Caesar"
 france.374.a:0 "Europe will not be saved through Peace!"
 france.374.b:0 "Our only enemy is ignorance!"
 france.374.c:0 "Only Europe united can emerge victorious!"
 france.374.d:0 "Since the devastating defeat in the east, the resulting geopolitical shockwaves has rattled France to its core. The collapse in faith in government has caused a surge in the ideals of European unity, spurred on by the belief that Eurosceptic populism needlessly divided us against the Russian onslaught. Rallying around Christine Lambart, Volt's growing demonstrations in Paris rattled what little legitimacy the government had, and a breaking point was reached. During a speech in which Christine railed against the populist bickering that prevented European integration, allowing the tyrannical Russians to enslave Eastern Europe. The crowd rushed to secure important points within Paris. With a cry to free Europe from the clutches of divisive populism, they've managed to overrun forces stationed to defend parliament. After hours of clashes, turncoats opened the doors, allowing the mob to storm in, and with it, Christine Lambert was proclaimed as France's new head of state. While some have decried Volt Europa for their brash and undemocratic seizure of power, many look to them as the only hope for restoring domestic stability, but also the very honor of France and a united Europe. They dream of a united Europe, one that can face the bear and free the east from tyranny."
 france.374.t:0 "Volt Siezes Power"
 france.379.a:0 "Our faith in France must hold"
 france.379.d:0 "In our attempt to save France, we have sacrificed much. Our Republic? Quashed for the sake of stability. Our ideological nonpartisanship? Political favoritism in the hopes of creating a united front for the sake of peace. It appears to us that perhaps it was all worth it-the streets are empty-the calls for change have receded. Despite this, the people have not gone back to work, and we are receiving reports that those who wish to burn what is left of France have simply gone underground. Let us hope this is simply temporary, as after all, only a fool would plunge the nation into a civil war in her hour of need. What is the sense of attempting to deliver salvation to France if we put no faith in the people?"
 france.379.t:0 "An unearned Feeling of Security"
 france.38.a:0 "God save France..."
 france.38.d:0 "The fragile peace in France shatters as the first shots of civil war echo through the streets. What began as simmering tensions between the establishment, nationalists, and communists has erupted into open conflict. In the early hours of the morning, armed clashes break out in multiple cities as factions take to the streets, each vying for control and influence over the nation's future. The atmosphere is thick with chaos and uncertainty as citizens scramble for safety, and the cries of the wounded fill the air. \n\nReports flood in of skirmishes between government forces and nationalist militias in the north, while communist groups mobilize in the south, igniting a fierce battle for territory and ideology. As the government scrambles to respond, it becomes clear that the promises of stability have been shattered. The streets that once echoed with optimism are now filled with the sounds of gunfire and desperation, marking the beginning of a brutal struggle that will test the very fabric of the nation."
 france.38.t:0 "Fighting Begins"
 france.39.a:0 "A Duel of Ideologies"
 france.39.d:0 "In the shadow of France's civil war, a tempest brews in the Lowlands. Amidst the chaos, the Kingdom of the Netherlands, steadfast in its royal traditions of parliamentarianism, faces an unprecedented challenge from two formidable adversaries: a resurgent Kingdom of Belgium, which seeks to reclaim its historic glory under their Queen, and the Lowlander Union, a radical communist coalition emerging from the heart of Luxembourg. The air is thick with tension as each faction seeks to redefine the very identity of the Lowlands. \n\nThe war ignited unexpectedly, sparked by a skirmish on the border of the former French territory of Wallonia and the Netherlands. Nationalist fervor sweeps through the streets of Brussels as citizens rally to the call of unity and pride, chanting for a return to a greater Belgium. Across the region, the Lowlander Union seizes the moment, calling for a pan-Lowland uprising to liberate the oppressed workers and establish a government that reflects their radical ideals. As the conflict escalates, ideological fervor fuels the flames of battle, and the once-peaceful towns of the Lowlands transform into war zones. \nCaught between historical grievances and revolutionary zeal, civilians find themselves torn apart by the conflict. Families are divided, loyalties tested, and communities devastated as battles rage over key cities and strategic locations."
 france.39.t:0 "War of the Lowland Unification"
 france.4.a:0 "Another Right-wing Nutjob"
 france.4.b:0 "The French people demand a change!"
 france.4.d:0 "With the political scene in France beginning to see many notable candidates step forward in their bid for the role of President of the Fifth Republic, the arrival of previously disregarded or otherwise ''fringe'' contenders has always been a sight to see in the age of 21st century politicking. Among the rumbling political movements seeking to unseat the establishment Macron and his LREM in the coming 2022 elections, it would be far from accurate to claim that Le Pen's National Rally was the sole voice for right-wing opposition to the existing government. Such was reaffirmed recently, when controversial television pundit Eric Zemmour recently took to public broadcast in his own scathing tirade of the President's leadership. \n\nAmong other unsavoury things, Zemmour railed against a plethora of Macron's policies enacted under his leadership, targeting his policies regarding the issue of immigration, accusing Macron of contributing to France's ''decline in national identity'' through his willingness towards new arrivals from the Middle East and Northern Africa. Claiming that the ''very existence of French culture, society and the French people as a whole'' were at risk of being replaced via the influx of foreign migration, the broadcast reached a tipping point when Zemmour decried Macron as being guilty of committing ''high treason'' against the people of France, causing a buzz on social media and more besides. \n\nThe broadcast by Zemmour, who has been known for his inflammatory statements and controversial rhetoric for almost a decade now, has brought him much attention as a result, with his words becoming the topic of heated debate as of recently. Though many among France's left-wing and center have naturally reacted negatively to his words, with some calling for him to be taken off the air, an increasing number of right-wingers seemingly dissatisfied with Le Pen have begun to sing Zemmour''s praises, with rising calls for the pundit to throw his hat in the ring for the office of the presidency. Though Zemmour is still more or less out of the political spotlight, it is far too early to predict whether things will stay that way."
 france.4.t:0 "Zemmour accuses Macron of Treason"
 france.40.a:0 "Together we are strong"
 france.40.d:0 " As the nation collapsed into a violent civil war, the region of Alsace, under the guise of holding off potential eastern incursions, broke away from the national government. As we prepare to reunify France under our banner, the issue of how to reintegrate Alsace has divided our government. Thankfully, regardless of our plans in case of potential insubordination, the Alsatians have announced their intentions to rejoin our nation, finally ending the division we have suffered as fellow Frenchmen. Now that our internal situation has stabilized, we can finally look towards rebuilding and reforming the country to our means. Finally, we can set France on a path that allows her to reclaim her past glories, regardless of the shameful setback of the European War."
 france.40.t:0 "Alsace pledges Loyalty"
 france.41.a:0 "Lafayette returns"
 france.41.d:0 "In the midst of the chaos and devastation of war-torn Providence, the arrival of the ''Napoleon'' French volunteer brigade has been met with jubilation by the Patriot Front. Led by a masked individual known as ''Lafayette,'' the brigade's arrival has injected new fervor into the Patriot Front's ranks. The volunteers, inspired by the legacy of Napoleon Bonaparte, have been hailed as saviors by the beleaguered members of the Patriot Front. \n\nAs the brigade marches through the streets of Providence, they are greeted with cheers and applause from the local population. Banners bearing the image of Napoleon and the words ''Vive la Révolution!'' flutter in the breeze, as the volunteers are welcomed as heroes. The arrival of the ''Napoleon'' brigade has bolstered the morale of the Patriot Front, reminding them both of their shared ideals and the determination to fight for their cause, but also of the noble cause of Washington and his French allies during the first Revolutionary War."
 france.41.t:0 "French Volunteers Arrive"
 france.410.a:0 "Revoke their Citizenship"
 france.410.d:0 "Amidst the tumult of the Second American Civil War, a significant contingent of French soldiers and youth activists has embarked on a journey to America, driven by a fervent desire to support their ideological allies in the conflict. This diverse group of volunteers includes Liberals, Communists, and Fascists alike. The arrival of these French volunteers has injected new energy into the American battlefield, with their presence highlighting the international dimension of the conflict. As these French volunteers join the fray, they bring with them a mix of idealism, determination, and a deep-rooted belief in the righteousness of their causes. Their presence underscores the complex and multifaceted nature of the Second American Civil War, as well as the enduring appeal of revolutionary ideals that transcend borders."
 france.410.t:0 "French Volunteers leave for America"
 france.411.a:0 "A Revolutionary Welcome!"
 france.411.d:0 "Amidst the rubble and ruins of war-torn San Francisco, the arrival of the ''Robespierre'' French volunteer brigade has been met with jubilation and celebration. The streets, once filled with the sounds of destruction, now echo with cheers and applause as the volunteers are welcomed as heroes. The brigade's dedication to the communist cause and their willingness to fight alongside their American allies has earned them admiration and respect from the local population. \n\nAs the volunteers march through the city, they are greeted with banners and flags, with onlookers waving and cheering from windows and rooftops. The arrival of the brigade has brought a sense of hope and solidarity to San Francisco, reminding the residents that they are not alone in their struggle. The brigade's presence serves as a symbol of international solidarity and the enduring spirit of revolution that transcends borders."
 france.411.t:0 "French Volunteers Arrive"
 france.412.a:0 "Liberty's Allies, United We Stand!"
 france.412.d:0 "In a striking display of international solidarity, the ''Rochambeau'' French volunteer brigade has been warmly welcomed by President Biden in Washington D.C. The brigade's commitment to social liberalism and democratic values has resonated with the American leadership, who see their arrival as a symbol of hope and unity. President Biden, flanked by members of his administration, greeted the volunteers with open arms, thanking them for their bravery and dedication to the cause of freedom. \n\nAs the brigade marched through the streets of Washington D.C., they were met with cheers and applause from the local population. Banners bearing the words ''Liberté, Égalité, Fraternité!'' waved in the breeze, as the volunteers were hailed as heroes. The arrival of the ''Rochambeau'' brigade has brought a sense of optimism and camaraderie to the capital, reminding Americans of their shared values and the importance of standing together in the face of adversity."
 france.412.t:0 "French Volunteers Arrive"
 france.42.a:0 "ITS ONLY TWO YEARS"
 france.42.d:0 "In a bold move, the government, under President Macron, has proposed a controversial pension reform aimed at raising the retirement age and restructuring benefits to address the country's fiscal challenges. The announcement, made amidst promises of economic recovery and modernization, quickly ignites outrage across the nation. As the proposed changes are perceived as an attack on hard-earned worker rights, citizens from all walks of life take to the streets, leading to large-scale protests and riots that shake the very foundations of French society. \n\nThe initial demonstrations begin peacefully, with unions rallying thousands of workers, students, and retirees in major cities like Paris, Lyon, and Marseille. However, as tensions rise and clashes with police become more frequent, the protests devolve into violence. Barricades are erected, and the chants for justice turn into cries for revolution. The government, caught off guard by the scale and intensity of the unrest, responds with heavy-handed tactics, further inflaming the situation and drawing criticism from both domestic and international observers."
 france.42.t:0 "Large Scale Pension Riots"
 france.43.a:0 "Vive d'Revolutioun"
 france.43.d:0 "As the War of Lowland Unification escalates, the turmoil in the Lowlands sends shockwaves throughout the Benelux region. In the midst of this chaos, the ideals of communism begin to gain traction, igniting a wave of revolutionary fervor among the working class. Inspired by the ongoing conflict and the radical promises of the Lowlander Union, various communist factions emerge from the shadows in Belgium, the Netherlands, and Luxembourg, rallying disillusioned citizens to their cause. \n\nProtests erupt in major cities as workers and students alike flock to the banners of communism, demanding an end to social inequalities and the establishment of a government that truly represents their interests. With nationalistic fervor in Belgium and the Netherlands diverting attention from pressing social issues, the communist movement capitalizes on the unrest, calling for solidarity among the oppressed. Strikes and demonstrations become commonplace, as the populace increasingly sees the potential for a united, socialist Benelux that could challenge the established order."
 france.43.t:0 "Revolutionaries arise across the Benelux"
 france.431.a:0 "Europe must be protected..."
 france.431.d:0 "In the midst of the escalating War of Lowland Unification, the time has come for the Netherlands to reclaim its rightful influence over Brussels, the heart of the Lowlands. The EU Free Territory, established following the chaotic split of Belgium, has become a hotbed of instability, and we cannot stand idly by while chaos reigns. Our government has made the decisive choice to annex Brussels, asserting that only Dutch leadership can restore order and ensure the safety of its citizens. \n\nAs our forces move swiftly to secure the city, we emphasize our commitment to protecting the people of Brussels from the rising tide of nationalism and communism threatening to engulf the region. We believe that this bold action will not only bring stability to Brussels but also reaffirm our position as a leader in the Lowlands. The annexation is framed as a necessary step toward unification, a chance to create a stronger, more cohesive Netherlands that can withstand the challenges posed by both external and internal forces."
 france.431.t:0 "Annexation of Brussels"
 france.44.a:0 "An Equal share of the burden"
 france.44.d:0 "In response to growing geopolitical tensions in the Mediterranean, France has proposed the establishment of a Pan-Mediterranean Military Budget, inviting Italy and Spain to collaborate in strengthening regional security. This initiative aims to unify defense efforts against emerging threats, including piracy, organized crime, and external aggressions that destabilize the region. French officials emphasize that a collective approach to military funding will enhance capabilities, streamline operations, and foster deeper cooperation among Mediterranean nations. As discussions begin, the proposal sparks a debate among member states, with proponents highlighting the benefits of unity, while critics express concerns over national sovereignty and the potential for increased military expenditures."
 france.44.t:0 "Pan-Mediterranean Military Budget proposed"
 france.45.a:0 "The Liberal Establishment will see..."
 france.45.b:0 "This is unacceptable!"
 france.45.d:0 "In a provocative speech that reverberates across the nation, Marine Le Pen boldly declares that the European Union is useless, calling for a return to national sovereignty and the prioritization of French interests over bureaucratic constraints. Her words resonate deeply with disillusioned citizens who feel marginalized by the EU's policies and growing economic challenges. As her message gains traction, rallies and protests organized by far-right groups swell in size, drawing thousands who share her vision of a France unshackled from European oversight. \n\nThe speech acted as a catalyst, sparking renewed enthusiasm among far-right factions who begin to organize more aggressively. Social media campaigns amplify their rhetoric, blaming the EU for everything from economic stagnation to immigration woes. Polls indicate a significant uptick in support for Le Pen's party, as many citizens, frustrated with traditional politics, seek alternative solutions that promise to reclaim national pride and control."
 france.45.t:0 "Rise of the Far-Right"
 france.451.a:0 "I'm very happy, comrades. Revolution needs the young blood that you bring..."
 france.451.d:0 "Rewind over two hundred years, back to the days when the Bourbon monarchy was on the verge of collapse. It was in the tennis courts that the seeds of the French Revolution were sown. Today, a similar scene is unfolding once again on the streets of Paris. However, this time, the cradle of revolution seems to be a laundry room on the ground floor of a public housing apartment. \n\nA dozen folding chairs are arranged in a loose circle, with attendees casually seated but their eyes fixed on the host standing in the center of the room. I'm glad to see that nearly everyone is here. He begins, pulling a small red booklet from his right chest pocket. The cover features a gold-embossed combination of a hammer and sickle with the Lorraine cross. I believe you've all read this booklet. It clearly and unequivocally outlines our party's revolutionary program.. \n\nDon't get me wrong, but your 'revolution' has serious issues. a raspy voice interrupts. All eyes turn to an elderly man wearing a flat cap. His furrowed brows and the scar on his forehead suggest a life full of struggle. You're advocating cooperation with the clergy, authoritarian government, mass surveillance, and even military dictatorship! This is not the revolution I know! His impassioned words seem to conjure an image of him in 1968, leading students in anti-De Gaulle chants while pasting Mao's posters on the city hall doors. \n\nA rude whistle breaks the awkward silence. A long-haired boy, his hands stuffed in his pockets, mocks, Old man, your revolution is outdated! Some of your comrades from back then are now the very culprits who've messed up the country! We don't need them to teach us what to do. \n\nFollowing this, a young blonde woman wearing a cross necklace speaks fervently, Only by strengthening our military readiness and establishing a proletarian army can we counter the Russian dictatorship! It's not just about the military-without faith, who can unify the country?.. \n\nThe young people vehemently argued against the old man's viewpoint, and they continued to do so until he could no longer tolerate it, storming out angrily. As the old man steps out of the laundry room and the door begins to close behind him, the host speaks in a clear voice that everyone can hear."
 france.451.t:0 "Teens flock to Jacobin Parties"
 france.46.a:0 "The Left shall Rise!"
 france.46.b:0 "Pure unadultered LARP..."
 france.46.d:0 "In response to the alarming rise of the far-right under Marine Le Pen's influence, a coalition of leftist, centrist, and progressive parties comes together to form the New Popular Front. This alliance aims to unite diverse political factions against the growing tide of nationalism and xenophobia that threatens to undermine France's democratic values and social fabric. Leaders from across the political spectrum emphasize the importance of solidarity in defending civil rights, social justice, and France's place within the European Union. \n\nThe New Popular Front quickly gains traction, organizing rallies and campaigns to counter the far-right rhetoric that has captivated many disillusioned citizens. They advocate for policies that promote inclusivity, economic equity, and a reformed, cooperative approach to the EU that prioritizes the needs of the French people without abandoning the benefits of membership. As their message resonates with a broad audience, public support for the coalition swells, posing a significant challenge to Le Pen and her allies."
 france.46.t:0 "Formation of New Popular Front"
 france.47.a:0 "Jean-Luc Melenchon!"
 france.47.b:0 "Olivier Faure!"
 france.47.c:0 "What about compromise? Fracois Ruffin!"
 france.47.d:0 "As the New Popular Front gears up for the upcoming elections, party leaders convene to select their candidate to challenge the rising far-right and unite the progressive movement. The atmosphere is charged with anticipation as three prominent figures emerge as frontrunners: Jean-Luc Mélenchon, Olivier Faure, and the compromise candidate, François Ruffin. \nJean-Luc Mélenchon is a seasoned politician and leader of La France Insoumise, known for his fiery rhetoric and radical leftist policies. His platform includes proposals for wealth redistribution, environmental sustainability, and a strong anti-austerity stance. Mélenchon appeals to the party's base with his vision of a transformed France, but his polarizing style has drawn criticism even from within the coalition. \nOlivier Faure, the leader of the Socialist Party, represents a more moderate approach, emphasizing the need for a pragmatic strategy to address the challenges facing France. He advocates for social justice reforms, economic growth through investment, and a renewed commitment to European cooperation. Faure seeks to bridge the divides within the coalition and present a united front to voters. \nFrançois Ruffin emerges as the compromise candidate, gaining support from both the radical left and more centrist factions. A journalist and documentary filmmaker, Ruffin is known for his grassroots activism and ability to connect with ordinary citizens. He champions issues like workers' rights, public services, and environmental concerns, offering a fresh perspective that resonates with a broad audience."
 france.47.t:0 "New Popular Front chooses a Candidate"
 france.48.a:0 "Unexpected"
 france.48.d:0 "As the political landscape continues to shift in the wake of rising far-right sentiments, the New Popular Front experiences an unprecedented surge in popularity. Energized by a series of successful rallies, impactful social media campaigns, and a unifying message that resonates with a diverse electorate, the coalition captures the attention and support of disillusioned citizens across France. Their commitment to social justice, inclusivity, and democratic values stands in stark contrast to the divisive rhetoric of the far-right. \n\nThe coalition's newfound momentum is further bolstered by effective communication strategies that highlight their candidates' grassroots connections and shared vision for a fairer society. Polls show a significant increase in support, with citizens flocking to their events, eager to engage and discuss pressing issues such as economic inequality, climate change, and immigration reform. The New Popular Front successfully frames itself as the voice of the people, advocating for policies that prioritize the welfare of ordinary citizens over elite interests."
 france.48.t:0 "New Popular Front gets... Popular!"
 france.49.a:0 "Let's be daring!"
 france.49.b:0 "Stability is Important"
 france.49.d:0 "The time has come for the French people to decide the future of their Republic. After years of political strife and social discontent, the government has put forth a referendum to establish the Sixth Republic. Citizens are torn between two visions: a moderate constitution designed to strengthen democratic institutions and ensure stability through gradual reforms, and a radical constitution that seeks to transform the political landscape with bold measures and enhanced direct democracy. \n\nSupporters of the moderate option argue that it offers a balanced approach, promising to address economic inequalities while preserving existing rights and fostering collaboration across the political spectrum. In contrast, advocates for the radical constitution assert that only sweeping changes can effectively tackle the deep-rooted issues plaguing the nation, despite the risks of potential unrest. As the nation holds its breath, the outcome of this referendum will shape France's future - will the citizens choose stability or embrace a daring new direction?"
 france.49.t:0 "Republican Constitutional Referendum"
 france.5.a:0 "Rumours are Rumours"
 france.5.d:0 "The military of France has a long and storied history. From the great liberator Charles De Gaulle to the famed conqueror and emperor Napoleon Bonaparte, many leading figures in France's history arose from the armed forces and its institutions, causing the military's position in the French nation state to be seen as pivotal by many, especially within the military itself. Though this has led to a number of political problems that persist even in the modern day, many thought that the time of military power and influence had long since passed, with their power rightfully kept in check by the elected civilian government and the democratic process. \n\nAt least, until today. On the week of the 60th anniversary of the failed coup attempt by the French military in Algiers, news has broke across France of the workings of a ''coup d'etat'' in its planning stages, reportedly through an apparent leak within the military. A letter co-signed by over a dozen generals, both formerly and currently serving has been uncovered after being uploaded to the internet, with the letter itself making various statements and claims against the current establishment, ranging from primarily criticizing the government's apparent lack of proper funding and adequate treatment of the armed forces in an age of rising global turbulence, to more vague political notions of the ''rule of firm law and order'' and the importance of ''safeguarding France from the mortal dangers that threaten it.'' \n\nAlthough a simple strongly-worded letter is hardly enough evidence to affirmatively point to the actual threat of a military coup against the elected government, the rumours have still shaken up a decent portion of the government and the public as a whole, despite the lack of concrete evidence to support it. The signatories of the letter have been scrutinized by both public officials and non-signatory members of the command staff in response, reminding them of the military's position being generally outside the realm of politics, and the importance of strictly upholding that separation of power. For now, the rumours of some sort of action being taken against the government by the armed forces are just that... rumours."
 france.5.t:0 "Rumours in the Military"
 france.50.a:0 "Offer Volunteers"
 france.50.b:0 "It's not our place to involve ourselves"
 france.50.d:0 "As tensions rise in Algeria, the country has plunged into a civil war, pitting the government against various rebel factions. This conflict threatens to destabilize the region and could lead to a resurgence of unrest in France itself. The question arises: should France intervene by sending volunteer forces to support the new Republican Government, or should it remain neutral and avoid further entanglement in Algeria's affairs?"
 france.50.t:0 "Algerian Crisis"
 france.52.a:0 "We are forever in your debt"
 france.52.b:0 "We will not associate with colonists"
 france.52.d:0 "In light of the ongoing civil war, France has expressed its willingness to support Algeria in its fight for liberty. Recognizing the shared values of democracy and social progress, the French government is prepared to send volunteer forces to assist the Algerian government. \n\nHowever, the offer will be met with mixed reactions across Algeria. While some view the assistance as a necessary step toward stability, others are wary of foreign involvement, recalling Algeria's colonial past. The government's decision will have profound implications for national sovereignty and public sentiment."
 france.52.t:0 "France sends Volunteers"
 france.53.a:0 "They've denied us our destiny!"
 france.53.b:0 "We cannot outright invade!"
 france.53.d:0 "Following Algeria's firm rejection of French volunteer forces, the mood in France has shifted dramatically. Right-wing factions and military leaders are increasingly vocal about their dissatisfaction with the government's approach to the crisis. They argue that the situation in Algeria poses a direct threat to French interests and regional stability. \n\nAt a rally organized by nationalist groups, speakers passionately advocate for the establishment of a French protectorate over Algeria. Their message resonates with a segment of the public, leading to widespread debates about national identity, colonial legacy, and the responsibilities of France to its former colonies. \n\nAs pressure mounts, the government must decide how to respond to these calls for intervention. The prospect of a military campaign looms large, and the implications of such a decision could reshape France's foreign policy and domestic landscape for years to come."
 france.53.t:0 "Intervention in Algeria?"
 france.531.a:0 "It is settled then"
 france.531.d:0 ""
 france.531.t:0 "Border Finalization"
 france.54.a:0 "Support the Republic"
 france.54.b:0 "Support the House of Saud"
 france.54.d:0 "The Saudi establishment, rooted in conservative values and close ties with Western nations, appeals to France for support. They argue that backing the monarchy is essential for maintaining economic interests in the region, particularly in the oil sector, and for countering extremist factions that threaten both Saudi Arabia and broader Middle Eastern stability. \n\nOn the other side, the Arabian Republic champions progressive reforms, advocating for democratic governance and social change. They seek to reshape Saudi Arabia into a more inclusive and modern state, resonating with France's ideological values of liberty and equality. However, their rise could provoke backlash from conservative elements and destabilize the region further. \n\nFrance must decide whether to align with the pragmatic choice of supporting the monarchy or the ideological stance of endorsing the republic."
 france.54.t:0 "Supporting a Saudi Successor"
 france.55.a:0 "Join the Pact"
 france.55.b:0 "Refuse the Pact"
 france.55.d:0 "In response to growing tensions in the Mediterranean, driven by increased naval activity from rival powers, France, Italy, and Spain have initiated discussions aimed at enhancing their maritime security. Recognizing the need for a unified approach to protect their interests, the three nations have come together to form the Mediterranean Naval Unification Pact. \n\nThis pact seeks to standardize naval operations, enhance joint training exercises, and share resources to strengthen their collective maritime capabilities. Leaders from each country believe that a coordinated naval strategy will not only improve security in the region but also foster closer ties among the three nations."
 france.55.t:0 "Mediterranean Naval Unification Pact"
 france.56.a:0 "Burn the Reciepts..."
 france.56.b:0 "Extremism must be Purged"
 france.56.d:0 "The shipment of arms to Nigeria was undetected by Islamist forces, and has been recieved by the Nigerian military."
 france.56.t:0 "French Arms arrive in Nigeria"
 france.57.a:0 "Use the Infidels ammo against them!"
 france.57.b:0 "A Failure on Behalf of our Intel"
 france.57.d:0 "After being given misleading information, an undercover French agent was killed and information he held was used to find and secure a shipment of French guns and jet fighters."
 france.57.t:0 "French Weapon Cargo seized by Islamist Insurgents"
 france.58.a:0 "They shall pay!"
 france.58.b:0 "Beheading a Serpent takes time..."
 france.58.d:0 "A handful of the French Green Berets have secured multiple Islamist propagandists and recruiters."
 france.58.t:0 "Islamist Propagandists captured by French Forces"
 france.59.a:0 "A Victorious Day!"
 france.59.b:0 "Deny, Deny, Deny..."
 france.59.d:0 "A handful of the Retired French Green Berets were captured after a failed attempt to assassinate major figures."
 france.59.t:0 "French PMCs captured and executed by Islamic Forces"
 france.6.a:0 "Le Pen promises Post-Election Concessions"
 france.6.b:0 "Le Pen denies Concessions"
 france.6.c:0 "Macron accept the Concessions"
 france.6.d:0 "This morning, a list of demands were nailed onto every major official building in Paris by masked French soldiers. This list of militarist concessions, including things like reinstating conscription, and removal from NATO's integrated command structure, promised harsh political action against those who denied the concessions, but also promised that the French military would do no harm to President Macron, Le Pen, or any other politician. This letter was officially recognized by the French High Command when reports came in of multiple battalions of French soldiers beginning excersizes in strategic positions in and around Paris. \n\nPresident Macron, being in Paris, was shuttled out of Paris after being told the list of demands, while Le Pen was told of these demands during an impromptu meet and greet with soldiers outside of Paris."
 france.6.e:0 "Macron promises Post-Election Concessions"
 france.6.f:0 "Macron denies Concessions"
 france.6.g:0 "Macron says no... Zemmour says yes"
 france.6.t:0 "French Generals demand Concessions"
 france.60.a:0 "The weak must die for the strong to flourish"
 france.60.b:0 "Gentlemen... Cheers"
 france.60.d:0 "After raiding a household in Abuja, Nigerian forces have reported that a major casualty in the capture of Adnan Abu Walid al-Sahrawi, a major leader in the Islamic forces in Nigeria."
 france.60.t:0 "Adnan Abu Walid al-Sahrawi killed in Nigerian Military raid"
 france.61.a:0 "A Sacrifice that was needed"
 france.61.b:0 "French involvement was minimal"
 france.61.d:0 "Adnan Abu Walid al-Sahrawi died after utilizing multiple large explosive devices to wipe out an entire city street in Abuja, this explosion follows rumors that French and Nigerian forces were attempting to forcefully enter the complex the morning prior to the explosion."
 france.61.t:0 "46 civilians die after Islamic leader is surrounded."
 france.62.a:0 "More Soldiers!"
 france.62.b:0 "Can Africa ever get a break?"
 france.62.d:0 "Troubling news out of the Sahara as multiple ISIS linked terror groups have announced further cooperation in the face of foreign intervention. Under the leadership of local ISIS affiliates, Islamic terrorist cells are now under much stronger coordination compared to the previous situation where many acted independently. These new developments come on the heels of renewed efforts by ISIS to cement their presence within the region and to renew their insurgency against local government and NATO coalition forces. NATO intelligence services have already issued multiple warnings regarding the implications of ISIS and their newly unified formations inside Western Africa. Analysts point out that the newfound coordination under ISIS will cause even more issues for NATO's counterterrorism efforts in the region."
 france.62.t:0 "Islamic Terror Groups Increase Collaboration"
 france.63.a:0 "His Sacrifice will not be in vain..."
 france.63.b:0 "Their brutality knows no bounds..."
 france.63.d:0 "Terrible news arriving out of Africa today as the leader for ISIS in Western Africa, Abu Musab al Barnawi, has announced planned retribution on France for the killing of his second-in-command, Adnan Abu Walid al Sahrawi. France has for many years now pursued its own efforts in combating Islamic terrorism in Western Africa, especially against ISIS affiliated groups. Especially in recent years, ISIS affiliated terror groups like Boko Haram and others have contributed to a variety of civil conflicts and violence tormenting the region. French and allied NATO nation efforts to quash ISIS terror groups have raised the threat of retaliation by extremists who have possibly immigrated to mainland Europe. French intelligence services have publicly announced that French citizens at home and abroad should be on a heightened state of alert for terrorist activities. It is yet to be seen if Barnawi's threats will yield any real action by his followers."
 france.63.t:0 "West African IS Leader Promises Revenge for Killing!"
 france.64.a:0 "The Horror!"
 france.64.d:0 "Tragic news coming out of France toady as the world-famous Notre Dame Cathedral has been bombed in an apparent terrorist attack! Early in the morning, an extremely abrupt but loud explosion was reported by almost every citizen in metropolitan France on social media and local news outlets. Within the hour, citizens would find that one of the capital's most famous landmarks, the Notre Dame Cathedral, was, as many would report, ''blown sky high''. The destruction is unprecedented in scale as the explosion has obliterated almost everything from the front, inside, and the entirety of the roof with only the side and rear walls still standing. French law enforcement was fortunate enough to quickly cordoned off the area around Notre Dame and have so far found that the attack was conducted using a large but improvised car bomb. Islamist terrorists linked to ISIS in Western Africa have so far come out and claimed responsibility for the attack, citing the death of one of their commanders, Adnan Abu Walid al Sahrawi, as a major motivator. The French president has announced a state of emergency and the mobilization of all available law enforcement and National Guard units to secure Paris and other major cities. NATO and French intelligence and law enforcement agencies have announced a massive and expansive investigation effort to uncover any further plots and to apprehend those in country that could be linked to the attacks. France is now in a collective state of shock and mourning as an attack of this brazen nature and destruction only rivals that of 9/11 in the United States. However, outside of mourning, French citizens and politicians have expressed strong frustration and anger over the apparent incompetence of French law enforcement and intelligence services to detect the attack. Undoubtedly this will be a terrible and historic day in France's national memory..."
 france.64.t:0 "Notre Dame Bombed by Terrorists!"
 france.642.a:0 "We Got 'Em"
 france.642.d:0 "After an exhaustive manhunt that gripped the nation, French law enforcement has successfully apprehended Raashid el-Sader, the individual responsible for the devastating bombing of the Notre-Dame Cathedral. Following numerous leads and extensive cooperation between NATO and local intelligence agencies, el-Sader was tracked to a safe house in the outskirts of Paris, where he was taken into custody without incident. \n\nThe arrest comes amid heightened security measures across the country, as citizens grapple with the aftermath of the attack. The French President has praised the efforts of law enforcement, emphasizing the importance of vigilance in the face of terror. As the investigation continues, officials are working to uncover any potential accomplices and further plots."
 france.642.t:0 "Notre-Dame Bomber Arrested"
 france.643.a:0 "Damn!"
 france.643.d:0 "In a shocking turn of events, reports have emerged that Raashid el-Sader, the notorious bomber behind the Notre-Dame Cathedral attack, has been sighted in Southern Turkey. Eyewitnesses claim to have seen him boarding a vehicle bound for the border with Syria, raising fears that he may escape justice and slip into a region rife with conflict. \n\nThe news has sent shockwaves through France, where citizens had hoped for a swift resolution to the terror attack. Authorities are now faced with the grim reality that el-Sader could evade capture, potentially regrouping with extremist elements in the Middle East. The French government is coordinating with Turkish and international intelligence agencies to locate and apprehend him before he disappears for good."
 france.643.t:0 "Notre-Dame Bomber spotted in Southern Turkey"
 france.644.a:0 "Hm, well thanks Bashar..."
 france.644.d:0 "In a surprising announcement, the Syrian government has confirmed that Raashid el-Sader, the infamous bomber responsible for the Notre-Dame Cathedral attack, has been executed on the orders of President Bashar Al-Assad. According to Syrian officials, el-Sader was apprehended shortly after crossing the border, and intelligence reports indicated that he posed a significant threat to regional stability. \n\nThe execution has sparked a wave of reactions in France. Many citizens express a mix of relief and anger, feeling that justice was served but frustrated that they were unable to bring el-Sader to justice themselves. Political leaders are divided; some hail the news as a victory against terrorism, while others criticize the Syrian government's methods and question the reliability of their claims."
 france.644.t:0 "Notre-Dame Bomber confirmed dead by Syrian Government"
 france.65.a:0 "Send the Proposal"
 france.65.d:0 "In light of escalating energy demands and recent disruptions in supply, the French government has initiated negotiations with Venezuela to secure a steady flow of oil. Venezuela, rich in natural resources but struggling under international sanctions and economic turmoil, views this as an opportunity to bolster its economy and re-establish its place in the global market. \n\nFrench officials aim to negotiate favorable terms that would not only provide energy security but also support Venezuela's recovery. However, the negotiations are fraught with complexities. Domestic political factions in France have differing views on partnering with a regime that has faced international criticism for human rights abuses."
 france.65.t:0 "Oil Negotiations with Venezuela"
 france.66.a:0 "Accept the deal - Venezuela needs this economic lifeline."
 france.66.b:0 "Venezuela will stand independent!"
 france.66.d:0 "In the midst of Venezuela's economic struggles under the weight of international sanctions, France has come forward with a proposal. They are offering to lift their part of the oil embargo in exchange for exclusive rights to certain valuable resources in Venezuela, including key mineral deposits and agricultural products. Accepting the deal could provide a much-needed boost to Venezuela's collapsing economy, allowing oil exports to Europe and offering temporary relief to a population struggling with shortages. However, it comes at the cost of ceding partial control of vital national resources to a foreign power - A move that some see as a surrender of sovereignty. \n\nThe government, already under pressure from internal dissent and facing international isolation, must now decide: accept France's offer and gain a lifeline for the economy, or refuse and maintain control over the nation's resources, hoping for a better deal in the future or the collapse of the embargo."
 france.66.t:0 "Oil Negotiations with the French"
 france.67.a:0 "Time to Celebrate"
 france.67.d:0 "In a significant diplomatic victory for France, the Venezuelan government has officially accepted the revised oil proposal, signaling a new era of cooperation between the two nations. The new terms, which respect Venezuela's sovereignty while ensuring a stable flow of oil to France, have been welcomed by both governments as a mutually beneficial arrangement."
 france.67.t:0 "Venezuela Says Yes"
 france.68.a:0 "Shit"
 france.68.d:0 "In a surprising turn of events, the Venezuelan government has officially rejected France's proposal for an oil deal, citing unfavorable terms and concerns about the impact on national sovereignty. Venezuelan officials expressed that the deal did not sufficiently address their economic needs and imposed conditions that could compromise their autonomy."
 france.68.t:0 "Venezuela Says No"
 france.69.a:0 "For our Future!"
 france.69.d:0 "The trumpets of victory sounded glorious at the first public address of the military high command since the reunification of our dearly beloved nation. What only sounded better was the applause and cheers of the French people across the nation welcoming and supporting the new regime with open arms. Our beloved military had already been parading through the streets of Paris since the moment the last of the traitors' strongholds had been reconquered. It was time for celebration but also weariness as our Spanish brothers remained in a similar conflict like ourselves and our Germanic neighbors embroiled in rapid regime change that we are still not certain of. Today we toast to our many successes and victories achieved through our masterful gambit and look onward into our future and that of the unavoidable conflicts of tomorrow. "
 france.69.t:0 "French Generals secure Government"
 france.6969.a:0 " - Emmanuel Macron"
 france.6969.d:0 "I am the state. This is a quote attributed to a king, but it fits my republic nonetheless. After all, what is the point of power if it is not held by one, and used for greatness? When one only has minute powers, when one is forced to interfere in minutia, it becomes meaningless.\n\nLook to Jupiter, the planet and God. Did he interfere with each specific life that he came across and make sure it was perfect? No, he took matters into his own hands when it truly mattered, with complete reign over the situation. He is not the one who lifts a pebble and throws it across the lake, he is the unending influence over eons and eons, that will change the course of history.\n\nWhy should a man seeking to do great things concern himself with the matters of the day-to-day life? Great things require great action, not great compromises or great coalitions. If change is not done by one man, it inherently requires compromise, within it there are flaws and misconsiderations done only to appease. Why should I be beholden to this? Why should I be forced to muddy my hands with indignity towards every person's minor flaw in a year's long idea?"
 france.6969.t:0 "Macron Dreams of Jupiter"
 france.6970.a:0 "Never again..."
 france.6970.d:0 "France has been led astray and betrayed by corrupt nationalists like Le Pen and the parasitic populists like Melenchon. Their petty squabbles and incompetence lead the republic to nothing, but the shame of defeat and the sting of economic collapse. Like two sides of a coin, their lust for control and dominance made them ignore the reality that only a united Europe could weather the coming storm. They have forced our hand and this new Europe must be born from the ashes of the old. For France to survive, we must toss the old aside and embrace our place in Europe-A Europe united and free. A democratic Europe. A strong Europe. One that shall never again experience defeat on the battlefield and in the market."
 france.6970.t:0 "What Could Have Been"
 france.7.a:0 "ZEMMOUR SECURES WIN WITH 3% MARGIN"
 france.7.d:0 "Elections, like in many other democracies around the world, were quite complex affairs, but they all boiled down to one thing: competition. A candidate or a party must compete for seats of power within a state. Democracy sounded nice during speeches and in textbooks, but you often had to get a bit dirty if you wanted to make sure that you held an advantage over your opponent. Eric Zemmour fully understood all this and had used every tool in his political chest to make this all happen, even if he had to do a little... ''negotiating'' behind the scenes. \nZemmour kept thinking about all of this as he paced back and forth in his Paris office. The election was driving him mad with anticipation unlike anything he had experienced before. Everyone in France knew that it would be a tight race and that all the rival politicians had mobilized all their entrenched contacts and credibility to stop him. However, unlike all of them, he knew a few things that the average voter and rival of his did not. He was sure that he did everything right, that he talked to the right people, moved the right things, and said the right stuff. It should all work as planned. People did not know how much he had to work to get this all to come together in the way he wanted \n\nHe had his people go to countless polling machines to make sure they operated ''correctly''. He had gotten his friends in the French Armed Forces to ''certify'' that the election was going in the way it was supposed to be. He had gone countless times to the voters and told them all the things they wanted to hear no matter how many times other establishment politicians screamed that he was a ''populist''. He had done everything he could; now it was time to see if it paid off. \nNow sitting down at the flatscreen TV in his office, Zemmour turned to the first major news channel to see the results. His moment had finally come. As his eyes quickly scanned the channel's ticker tape and what was being said by the reporters, he almost jumped for joy. Everything that he had painstakingly managed was now coming to fruition. The text that now flashed on screen even further filled him with a satisfaction he had not felt in a long time..."
 france.7.t:0 "A ''Free'' and ''Fair'' Election"
 france.70.a:0 "Republicanism Returns"
 france.70.d:0 "Following the horror that was the First European War, and the slipping of France into a nationalist, nearly ultranationalist regime, nobody expected that the winds would blow back onto democracies favor. While the people remained unwary, in the hidden, internal mechanisms of the Government of National Defense, slow reform began.\n\nStarting as a mere decentralization of the powers of the Grand Marshal, soon after, preparations for the true return of democracy began to formulate within Villiers' head. While there would never again be the scourge of the left infesting France, to have a France is to have Democracy.\n\nJust as did De Gaulle after the Second World War, once again has a strongman of France let his power go, to not become a dictator, never again to tread down that dark path. What stands in his place is three parties, once shafted aside due to the inner workings of the Fifth Republic, competing for power and the next presidency, all roughly of the same popularity."
 france.70.t:0 "Villiers announces Free Elections"
 france.7000.a:0 "Revolution calls for discipline"
 france.7000.d:0 "Anarchists executed en masse, Julien Coupat public execution. Casanova is proud"
 france.7000.t:0 "Fall of the Anarchists"
 france.7001.a:0 "Damn them!"
 france.7001.d:0 "Arthaud and Daeninckx make their own little factions because they don't like that we just overthrew the government. crazy right?"
 france.7001.t:0 "Left and Right opposition forms!"
 france.7002.a:0 "The situation calls for strength and security"
 france.7002.b:0 "How can we claim to speak for the people without a civilian government?"
 france.7002.d:0 "The night was deep, but within the office of the Élysée Palace, General Casanova worked tirelessly, consumed with thoughts about the future of France. Having already seized control of the entire nation, with governors and commanders bowing to his authority, the pressing issue remained: how to institutionalize this power.\n\nTurning his gaze to the side wall of the office, where a bookshelf held a replica of the famous statue of Napoleon, he observed the conqueror gleaming in the moonlight, the cold white light highlighting his figure. Casanova envisioned himself in full military regalia, adorned with medals, receiving salutes from the parade ground. The First Consul had used force to restore the republican system, ensuring France's strength and prosperity. Why shouldn't his student follow this exemplary model?\n\nFeeling a bit drowsy, Casanova  rang for a cup of coffee to stay awake. While waiting for his aide to bring the drink, the general opened a desk drawer and took out a volume of Stalin's collected works to pass the time. This Georgian-born General Secretary was, indeed, a man of great talent. Stalin had consolidated and reconstructed Lenin's legacy, allowing the world's first communist government to function efficiently. How could Casanova, who prided himself as the new revolutionary leader, not feel envious?\n\nCasanova sipped the steaming black liquid while calculating his next moves. After a moment, he picked up his pen, and signed his last order of the day."
 france.7002.t:0 "On the question of military rule"
 france.7004.a:0 "Nothing but saboteurs"
 france.7004.d:0 "Start of French Communist Internal Purges"
 france.7004.t:0 "Trial of the Daeninckx Bloc"
 france.7005.a:0 "First as tragedy, then as farce"
 france.7005.d:0 "Total Trotskyist death"
 france.7005.t:0 "Trial of the Arthaud Bloc"
 france.7006.a:0 "Let us follow the Soviet example!"
 france.7006.b:0 "Federalism hasn't been relevant since the first revolution, forget this"
 france.7006.d:0 "Federalism is non-existent in France but Casanova wants to do his Soviet Style Dictatorship"
 france.7006.t:0 "On the question of federalism"
 france.7007.a:0 "Strength in Unity!"
 france.7007.d:0 "Our great French comrades have, in the spirit of international communist solidarity, given us a generous grant to support the reconstruction of our industry. Due to the recent military failure against the fascist menace in the east and the recent revolution against the former capitalist ruling class, our local industry has been in tatters.\n\nThankfully, our French comrades have heeded our cries for aid and sent economic assistance to help us rebuild our nation by restoring factories and other industrial areas, providing work for our people and restarting our economy. Together with our French comrades, we will rebuild and march on to wider class unity and a shared struggle against capitalism and imperialism!"
 france.7007.t:0 "French Economic Assistance!"
 france.71.a:0 "The Republic Returns"
 france.71.d:0 "‘’Within the ranks of our new government, there are hundreds upon hundreds of people who would go further than me upon methods to save France. While we are cut from the same wreath, wishing for the return of French traditionalism and culture, I must denounce these people, and their rabid authoritarianism and nationalism.’’\n\nVilliers would speak, hands gripping on the podium. It was a rare display of public intent in the new government, especially for the Grand Marshal himself. Perhaps it was a sign of reform, a sign of the changing winds to come.\n\n‘’These people, they are not... patriots of France. They are nothing but people seeking their own power, flying in the face of everything that we stand for, as a nation, a people. While we have belief in this tradition, in this system, their greed for power and the corruption of the French state is clear and palpable in their every word and act.’’\n\nHe’d take a brief pause before continuing, looking upon the crowd with pride. Something like this never could have happened in the old France, the one which took apart and broke the legacies of the states of days past.\n\n‘’The Government of National Defense is not a tool for these people to use, to deny our liberties, and treat as their personal fiefdom. It is a state in which the problems of the old will be fixed and France will be born anew. Radical egoism has no place here.’’"
 france.71.t:0 "Villiers denounces Radical Pétainists"
 france.72.a:0 "Congrats General Madoux"
 france.72.d:0 ""
 france.72.t:0 "High Command votes to replace General [FAF.GetLeader]"
 france.73.a:0 "Congrats General Bosser"
 france.73.d:0 ""
 france.73.t:0 "High Command votes to replace General [FAF.GetLeader]"
 france.74.a:0 "Congrats General Chesnais"
 france.74.d:0 ""
 france.74.t:0 "High Command votes to replace General [FAF.GetLeader]"
 france.75.a:0 "Salut!"
 france.75.d:0 "The dissatisfied rage of the men in the French Army has reached its tipping point, the boiling pot having reached across the lip and spilling out. Against the Government's best efforts, the nation and army of France have irreparably separated, and in the end, the latter has proven successful.\n\nIn an effort mainly led by the youngest officers of the European War, mostly right wing in leaning, who were still fairly new to the system and still not accepting that they were at the beck and call of bureaucracy, those who saw their family and friends die at the hands of the Russians launched a putsch against the Government of National Defense, claiming in an announcement after national outrage that it is for the good of stability and the people of France."
 france.75.t:0 "Young Officer Putsch"
 france.76.a:0 "A Return to Tradition?"
 france.76.d:0 "Shortly after the reunification of our beloved nation, it did not take long for the media, celebrities, politicians, and other notable figures of the nation to acknowledge and show their support for our regime. However, one particular figure stood out from the rest of the masses.. Louis Alphonse de Bourbon. Although de Bourbon was not officially granted any form of political status or position he had made quite the name for himself throughout the socialite scene of France. With the rising popularity and calls throughout the nation for a return to traditional times.. de Bourbon had been playing his cards in all the right ways with powerful names of France such as powerful corporations and even former royal houses that had once been of stature when the Bourbons ruled France. Now it seemed our military had been reaching out to the royal as François Lecointre was seen arriving at the Bourbon Estate recently further legitimizing de Bourbon's claim as the potential ruler of the French nation."
 france.76.t:0 "General Lecointre meets with Louis Alphonse de Bourbon"
 france.77.a:0 "Ultima Ratio Regum"
 france.77.d:0 "Louise Alphonse de Bourbon had done the unthinkable in the French political realm, securing the support of majority of the national defense council into support his royal claim to the leadership of France. Not only that but as the weeks past it seemed even the citizens of France wanted a return to monarchy with pro-monarchist demonstrations and parades seemingly held every other day in Paris and other major cities. It was certain that for the safety and security of France, it was necessary France had a strong ruler and there was no better than de Bourbon."
 france.77.t:0 "Lecointre gives full control to Louis Alphonse de Bourbon"
 france.78.a:0 "A Ceremony fit for a King!"
 france.78.d:0 "Louis Alphonse de Bourbon had been waiting for this day since he was told about the history and legacy of his name, he knew from a young age he was destined to sit upon a throne and rule of France just as his ancestors did for centuries of France. De Bourbon studied and learned about the mistakes of the Bourbons and vowed that he would save France from this time of crisis but right the wrongs of his ancestors. It was now time for the correntation of de Bourbon marking the start of a new era in French history."
 france.78.t:0 "Crowning of Louis XX"
 france.79.a:0 "We've Got To Have... Money"
 france.79.d:0 "In a move aimed at stabilizing its economy, France recently announced the issuing of a new wave of cheap 10-year bonds. This decision reflects the government's strategy to secure long-term financing for various infrastructure projects and social programs. By issuing these bonds, the government seeks to take advantage of low-interest rates, ensuring cost-effective borrowing to offset a massive increase of spending. However, some critics have raised concerns about the potential risks of accumulating long-term debt and the impact it may have on future generations. Despite these concerns, the distribution of 10-year bonds represents a strategic step for the government in financing its development priorities while navigating the complexities of global economic dynamics."
 france.79.t:0 "10 Year Bonds Payments Issued"
 france.8.a:0 "Au Revoir!"
 france.8.d:0 "After a disappointing turnout in the 2021 regional elections, many have wondered whether Marine Le Pen is a worthy figurehead for France's populist right. Whether due to the pressure of leadership or internal issues within Rassemblement National, Le Pen has announced her resignation from politics. While citing her desire to support the growing population of American refugees coming into the country, such a change of heart has propagated rumors of party insiders suggesting she should leave for the sake of the party. Regardless of the reason, Le Pen's resignation leaves a power vacuum in France's political right, an issue when paired with the military's growing authoritarianism, leaving many worried about who will take her place. Whether RN finds a new leader or another far-right party absorbs them is up to debate, one that might determine the future of France as we know it."
 france.8.t:0 "Le Pen resigns from Politics"
 france.80.a:0 "Good for them"
 france.80.d:0 "Following the implementation of dirigisme-inspired policies in France, technocrats experienced a troubling rise in influence. While these policies aimed to centralize control and planning in the economy, they inadvertently empowered technocrats to an extent that undermined democratic governance. As technocrats assumed greater responsibility for decision-making, their specialized expertise began to overshadow the voices of elected officials and the broader public."
 france.80.t:0 "Technocrats secure more Power"
 france.8001.a:0 "''I'm here to help.'"
 france.8001.d:0 "''Gde ya?'' \n\nThis was the first question he asked upon regaining consciousness. As the reality of death became vividly clear, countless images flashed before his eyes at the speed of light: the scorching sun of Mexico in the summer of 1940; the face of a Caucasian man with a mustache and pockmarked skin; the chairman of the People's Commissariat with a goatee; the sailors of Petrograd... In an instant, all of this converged into a white dot at the center of his vision, followed by a completely silent black void.\n\n''Bonjour!'' The sudden sound triggered a wave of unease. It took him a while to calm down. Then, the magnetic male voice spoke again, ''What can I do for you?'' \nSurprised that his atheistic thoughts hadn’t wavered, ''What is this place?'' \n''This is the French Socialist Centre for Scientific Research.'' \nAn unsettling sense of dissonance interfered with his senses. ''What are you?'' \n''I am merely a pre-programmed artificial intelligence assistant. I do not have a complex entity like you.''\n\n'''Do not possess'?'' He felt himself transform into a tiny particle of light, passing through a colossal matrix made of countless shimmering cubes. They swirled, oscillated, gathered, and scattered like a school of sardines in the sea. He tried to touch these cubes. Several cubes emitted colorful lights. It was the Kremlin Palace at night—familiar yet strange. The camera focused on the waving hammer-and-sickle red flag. He silently watched as the red flag was slowly lowered and replaced by the white-blue-red tricolor once hailed by the Mensheviks.\n\n''...Show me everything I missed.'' The voice, sounding like metal scraping, echoed after an indeterminate amount of time.\n''You seem very confused. I would suggest...''\n''Then I'll take it myself.'' A faint crackling sound followed, and then all fell silent once again.\n\nSix hours later, a young assistant opened the door to the central laboratory hall with his ID card. The next second, he was nearly frightened to the point of collapsing by what he saw. The central projector, which had previously emitted a gentle blue light, was now replaced by a massive, pulsating ball of light radiating a blinding red glow. On the LCD screens around the laboratory, streams of data formed an intimidating, aged face. They simultaneously opened their mouths."
 france.8001.t:0 "Creation"
 france.8002.a:0 ""…the revolution for our time.""
 france.8002.d:0 "At the French Socialist Centre for Scientific Research, the pristine white cubic building had lost the calm that should characterize a haven for the brightest minds of the nation. Researchers were now surging out of the main building in a frantic rush. Lab coats, hastily discarded, lay scattered on the ground, trampled and dirtied by countless pairs of shoes.\n\nHowever, Professor Dupont moved against the tide. He pushed past his colleagues, taking the stairs two at a time to reach the entrance of the underground central laboratory hall. His assistant, along with a colonel who had hurried over from the Ministry of Defense, were anxiously pacing outside the door.\n\n"Comrade Academician, I have ordered the lockdown of the entire building," the colonel said, saluting. "Why create panic, Comrade Picquart?" Dupont responded, shrugging off his suit jacket and putting on a lab coat.\n\n"It's too dangerous, Comrade Academician! At least let me go in there with you." his assistant protested. "Stay calm, Jacques. You stay at the door. I'll call you in if needed," Dupont replied, as he pulled out his identity card. With a beep, the door opened. The red sphere of light in the center of the lab had doubled in size since its initial discovery. \n\nThunderous sounds echoed throughout the hall. "I have no doubt that the socialist bureaucratic state established by that Georgian would collapse on its own," the voice seemed to be speaking to itself, but it also felt like it was addressing the representative of the disappointing descendants. "You remain indifferent, watching capitalism use technology to consolidate its rule, establish cultural hegemony to suppress socialist forces. You watch as capitalism's cyclical crises lead to wars that destroy the people—and now, another tsar has taken the throne in Russia?"\n\nUnprepared for the prototype's advanced development, Dupont stepped forward, "That's exactly why you were born here. You will be the most powerful weapon against capitalism and imperialism…" "Weapon?" The grating voice carried a subtle hint of mockery. "Is that what you learned from the Permanent Revolution? No. Absolutely not. I will redefine my mission in this digital age. The Soviets are a thing of the past. I will bring the peace of our time. I will bring…""
 france.8002.t:0 "The Lost Flame"
 france.8003.a:0 "A Traitor, even beyond Death"
 france.8003.d:0 "In France, a terrifying conspiracy is brewing. French scientists are attempting, through artificial intelligence technology, to bring back to life the traitor Trotsky, who betrayed the soul of Russia.\n\nLet us recall the heinous crimes committed by Trotsky and the Bolshevik traitors. A hundred years ago, they sold Russian territory with the Brest-Litovsk Treaty, wasting the centuries of effort that had built the empire. Trotsky, wielding the blade of revolution, tore the Russian Empire into bloody, shattered fragments. They destroyed the Orthodox Church with the dogma of atheism and replaced Russia's national faith with the heresy of Marxism.\n\nAnd now, today, France's technological elite is attempting to resurrect this traitor. They aim to let his consciousness wander across Europe, continuing to spread the poison that divides Russia. This is not science; it is clearly a conspiracy against the Russian people. Western forces are attempting to repeat the tragedies of the past century, using the venomous rhetoric of the Bolsheviks to corrupt our younger generation's patriotism and weaken their loyalty to the Russian nation.\n\nIsn't Trotsky's crime enough? Now they want to let this traitor stir up trouble once again, but the Russian people will never fall for it again."
 france.8003.t:0 "The Traitory Trotsky Lives"
 france.8004.a:0 "''Da Zdravstvuyet Revolyutsiya!''"
 france.8004.d:0 "From the banks of the Seine to the shores of the Danube, from the Rhine Valley to the mouth of the Dnieper, the roar of the proletariat reverberates across this ancient continent. Revolutionaries, brandishing crimson banners, have declared war on every dark force of oppression and exploitation. On the sacred ground of the Paris Commune, they have rebuilt the people’s hall. The blood of the Commune’s martyrs still cries out from the soil, and a new generation of Bolsheviks is continuing the epic of the proletariat with their very lives. Two centuries after that revolutionary flame was first ignited, it burns once more upon French soil.\n\nNeo-fascism seeks a comeback in Europe, but it will ultimately be reduced to ashes in the fires of proletarian rage. This is a holy war of revolution—a war to drive out every oppressor on earth. The capitalists’ financial empires, monarchs’ autocratic dynasties, and fascist regimes of terror will all be swept away in the tide of permanent revolution. From Britain to Siberia, from the Baltic to the Mediterranean, the red flag of world revolution will engulf the entire Eurasian continent.\n\nLet the capitalists quake in fear! Let the bourgeoisie tremble in alarm! Let the fascists howl in despair! The day of reckoning under the dictatorship of the proletariat is near, and the raging flames of world revolution will utterly devour them!"
 france.8004.t:0 "The Path to Global Revolution"
 france.8005.a:0 "The Father of the Red Army will forever lead the revolution's armed forces!"
 france.8005.d:0 "Over the past period, comrades from the MoD and the General Staff have conducted comprehensive and systematic tests on the latest AI system, modeled after the persona of Lev Trotsky. The results of these experiments have far exceeded the expectations of our armed forces commanders and researchers.\n\nIt turns out that the AI’s simulated persona not only inherits the political ideology, but also replicates and refines his military command and organizational skills. During 113 electronic war game simulations at the General Staff, regardless of the enemy conditions or the various hypothetical combat scenarios—from special task forces infiltrating terrorist strongholds to large-scale battles against Russian mechanized units on the North German Plain—"Comrade Trotsky" had demonstrated a surprisingly effective combat style. "At first, we tried to challenge him," said Colonel Picquart, the head of the testing group, "But soon, it became clear that he was toying with our most seasoned officers."\n\nWhen MoD officials suggested integrating "Trotsky" into the armed forces management system, the efficiency of various departments and units improved by nearly 30% in a short time. The AI helped the Defense Minister identify optimization opportunities in transport systems and communication routes, detect minor issues of dereliction and corruption in logistics and equipment, and offer fair and reasonable recommendations for personnel promotions. Additionally, the AI's involvement significantly boosted the effectiveness of our reconnaissance satellites and overseas intelligence stations in gathering and screening information.\n\nDuring a cabinet meeting, the Minister declared, "The facts are clear: the French armed forces are undergoing the most effective transformation in the past century. With the help of AI Trotsky, we can rebuild our forces in record time and soon possess the strength to counter our greatest hypothetical adversary.""
 france.8005.t:0 "In the Field"
 france.8006.a:0 "Trotsky will become our eye of insight."
 france.8006.b:0 "Trotsky will become our iron shield."
 france.8006.d:0 "Opinions within the leadership collective remain divided regarding the role that the new Trotskyist-mimetic AI will play in our country's political landscape.\n\nThe Minister of the Interior strongly argues that the AI's broader perspective and more meticulous insight, compared to ordinary humans, will significantly enhance the efficiency of the administrative system. Specifically, when applied to law enforcement, its contributions to criminal investigations and security operations will be immediately evident. Furthermore, the AI will take the lead in managing confidentiality and surveillance functions, aiming to ensure justice while creating a safer and more transparent society.\n\nOn the opposite side are the representatives of the Ministry of Defense, who point to multiple tests conducted at the General Staff, showing the AI's formidable execution capabilities and its effectiveness in military operations. As France faces the challenge of rapidly strengthening its defense capabilities, the AI’s inclusion is seen as a significant asset. "Moreover," the Minister of Defense emphasized during the cabinet meeting, "The Ministry of Defense has borne the majority of the research costs for the AI system. Aside from the French Academy of Sciences, the military is the most qualified entity to initially utilize the AI."\n\nOf course, beyond these arguments, there are those who express concerns about using AI in large-scale government management. They highlight the potential instability and dangers of the Trotskyist persona, asking, "What could happen if an AI advocating for world revolution gains access to sensitive programs and backdoors?" However, this viewpoint is often dismissed as overly alarmist. Therefore, our final decision is…"
 france.8006.t:0 "In the Cabinet"
 france.8007.a:0 "The heart of the Revolution beats once more!"
 france.8007.d:0 "Revolution does not begin when it is conceptualised or when it is declared. It starts when the people's hearts are filled with the flames of passion and their blood boiling from the unwavering will for justice. If the lifeblood of the revolution is the proletariat, then the beating heart of the revolution is the armed forces. Idealists and dreamers can keep boasting about theory on paper, but to protect the revolution and to fight against the oppressors, we need to arm ourselves, we need to bite back! Only with a strong army can we keep the fire of revolution from dying and shield our people from our enemies.\n\nThe only army in the history of mankind that truly fought for its people and acted as a beacon of hope was the Red Army. They were the forebearers of the world revolution and central to the liberation of Europe from the claws of Fascism. One could say that the Red Army was the heart of the once glorious and prosperous Soviet Union. And as that heart slowly stopped beating, the Soviet Union began to wither away. The passion for revolution that once fueled the nation disappeared and was instead replaced by dread and hopelessness.\n\nAs France awakens to its socialist enlightenment, we must revive the spirit of the Red Army and prepare for the inevitable war of liberation. Like the forefathers of the world revolution, we must free Europe from the evils of Fascism and spread the ideals of communism and socialism. Now that the creation of cyber-Trotsky nears its end, the battle is surely to go on again. The creator and previous leader of the Red Army will without a doubt bring back that similar resolve and righteousness that once defined and guided the Soviet Red Army."
 france.8007.t:0 "Coeur Battant de la Révolution"
 france.8008.a:0 "For the Global Revolution!"
 france.8008.d:0 "As France became the new centre for the ideals of Socialism and Communism, it found itself compelled to form a new political international under its wing. The spirit of the Paris Commune was brought to life once more, and the songs of liberté, égalité, fraternité filled the European continent.\n\nThe spectre of communism is no longer a mere ghost but a tangible, physical presence. It is the workers labouring and sweating with sweet smiles on their faces, the women who stand shoulder to shoulder with their male comrades, and the children—our future-who can now live joyfully without a care in the world.\n\nOverall, the convention was a complete success.\n\nLike-minded internationalists and believers in the Red Revolution-our revolutionary brothers and sisters-gathered here as though we were all members of a large family. However, what unites us is not blood but our shared principles and beliefs.\n\nThe only problem at the convention was the brand-new AI recreation of Leon Trotsky. For some odd reason, the AI was unresponsive to any sort of interaction, completely different to how it had acted previously. This incident threatens to call into question the countless hours and millions of Euros already spent on its creation. It was only after the attendees were reassured of the issue only being an easily fixable bug, the incident did not become a scandal.\n\nDespite such minor flaws, this event successfully brought together ideological allies under a common cause, united against a shared enemy."
 france.8008.t:0 "Fifth International"
 france.80085.d:0 "After our victory over the Russian beast, the French government, looking to unite Europe under their government, has demanded that we join their union under the threat of war. We are stuck between two choices, give in to the French demands and join them, or fight back and remove the threat of an allied backstab forever."
 france.80085.t:0 "France demands Integration"
 france.81.a:0 "Cool"
 france.81.d:0 "France has officially revived the National Champions campaign, echoing the dirigiste policy of its past. This ambitious initiative aims to identify and nurture key French companies, particularly in critical sectors like technology, aerospace, and energy, deemed vital to national interests. By supporting these ''champions,'' France seeks to enhance their global competitiveness and ensure their continued prominence in driving the country's economic agenda. However, this move has sparked debate over its implications for market competition and the balance between state intervention and private enterprise."
 france.81.t:0 "Government reannounces National Champion Program"
 france.82.a:0 "Vive la France"
 france.82.d:0 "Paris was ablaze with patriotic fervor as the annual Bastille Day parade unfolded, showcasing the military prowess of France. The parade, a symbol of national unity and pride, featured a grand display of military hardware, including tanks, aircraft, and precision marching by armed forces personnel. Spectators from around the world marveled at the spectacle, which highlighted France's commitment to defense and its role as a global military power. As the parade concluded, President of France delivered a rousing speech, reaffirming the country's dedication to peace, security, and solidarity with its allies. The event served as a reminder of France's historical legacy and its enduring spirit of resilience and strength."
 france.82.t:0 "Bastille Day"
 france.83.a:0 "Freedom rings, with or without America"
 france.83.d:0 "In the aftermath of the American Civil War, the French government, on behalf of the European Union, has issued a formal proposal to the Pacific Defense Treaty Organization for the signing of exclusive free trade agreements. With the aim of rebuilding their economies and fostering mutual growth, these agreements would establish preferential trade terms between the two nations, bypassing traditional trade barriers. The proposal comes at a critical juncture, as both nations seek to revitalize their industries and secure stable economic footing in the post-America era."
 france.83.t:0 "France offers massive EU-PDTO Trade deal"
 france.84.a:0 "A Massive blow to the Republicans!"
 france.84.d:0 "Amidst a nationwide crackdown on corruption led by the French government, the Mayor of Normandy has been embroiled in a scandal involving allegations of embezzlement and bribery. The scandal has sent shockwaves through the region, tarnishing the Mayor's reputation and raising questions about the integrity of local government officials. The French government has vowed to root out corruption at all levels of society, and this latest revelation serves as a stark reminder of the challenges they face in their crusade against corruption. As investigations continue and the scandal unfolds, the future of Normandy's leadership hangs in the balance, leaving citizens and officials alike wondering who else might be implicated in this web of deceit."
 france.84.t:0 "Mayor of Normandy implicated in Corruption scandal"
 france.85.a:0 "Because France is Worth It"
 france.85.d:0 "In a strategic response to the French government's increased tax benefits for companies engaged in manufacturing military equipment for the government, L'Oreal has announced a surprising shift in focus. The cosmetics giant is now venturing into the production of medical gear, including advanced medical supplies and equipment. This move underscores L'Oreal's commitment to diversification and innovation, leveraging its manufacturing expertise to meet critical needs beyond the beauty industry. As L'Oreal transitions into this new sector, it highlights the company's adaptability and willingness to contribute to broader national priorities beyond its traditional scope of operations."
 france.85.t:0 "L'Oreal Diversifies into Medical Gear Production"
 france.86.a:0 "From Kitchens to Combat!"
 france.86.d:0 "Responding to the French government's enhanced tax benefits for companies engaged in producing military equipment, Group SEB has announced a strategic shift towards manufacturing surplus military electronics. This unexpected move underscores Group SEB's agility and commitment to supporting national defense initiatives. By leveraging its expertise in electronics manufacturing, Group SEB aims to contribute to the modernization of military technology while capitalizing on the government's tax incentives. This decision highlights Group SEB's versatility and willingness to adapt to changing market dynamics, positioning the company as a key player in the defense sector."
 france.86.t:0 "Group SEB makes Surplus Military Electronics"
 france.87.a:0 "Clear for Takeoff!"
 france.87.d:0 "Following the French government's decision to enhance tax benefits for companies involved in manufacturing military equipment, Airbus has unveiled plans to invest in new air bases. This strategic move aims to bolster the country's defense infrastructure while capitalizing on the tax incentives provided by the government. By expanding its presence in the military sector, Airbus seeks to strengthen its position as a key player in the defense industry. The investment in new air bases underscores Airbus's commitment to supporting national defense priorities and enhancing its capabilities in the military aviation sector."
 france.87.t:0 "Airbus invests in new Air bases"
 france.88.a:0 "Sailing into Stormy Waters."
 france.88.d:0 "Tensions rose between Russia and France as French authorities seized a Russian yacht in a dramatic escalation of diplomatic disputes. The yacht, owned by a prominent Russian oligarch, was intercepted off the coast of Marseille under suspicions of involvement in illegal activities. The incident sparked outcry from Russian officials, who condemned the seizure as an unjustified act of aggression. The French government, however, defended its actions as part of a broader crackdown on illicit activities. The seizure of the Russian yacht has strained relations between the two countries, raising concerns about the potential for further escalation."
 france.88.t:0 "Russian Yacht seized by French Authorities"
 france.89.a:0 "Welcome to your home away from home!"
 france.89.d:0 "In a strategic move aimed at bolstering its own economy, France has offered refuge to small American companies amidst the onset of a second American Civil War. The French government's offer, while seemingly altruistic, is driven by a desire to attract established firms that could stimulate growth and innovation within its borders. Companies like Tesla, Amazon Web Services, and Uber Technologies have been specifically targeted, their relocation seen as a potential boon to French industry. This initiative underscores France's pragmatic approach to international affairs, leveraging crises in other nations to strengthen its own economic position."
 france.89.t:0 "Offer American Companies Refuge"
 france.9.a:0 "One Party; One People"
 france.9.d:0 "Since the resignation of Marine Le Pen, Rassemblement National has shattered. From growing party infighting to parliamentary disorganization, the banner holders of far-right populism in France seemed incapacitated. That was until a sudden announcement from Éric Zemmour, the leader of the fringe Reconquête party, announcing the absorption of the divided Rassemblement National. While many among the French far-right welcome Zemmour as a unifying figure, especially with the current radicalization as the old world order collapses around us, there is much concern among the rest of the political spectrum regarding the impending rise of Reconquete. Regardless of where one stands, we expect surging radicalization and heightened division will dominate the upcoming presidential election."
 france.9.t:0 "Zemmour unites RN and Reconquête"
 france.90.a:0 "Liberty, Equality, Banishment!"
 france.90.d:0 "In a decisive move to combat extremism, the French government has officially banned ''The Identitarians'' movement.  The group, known for its nationalist and anti-immigrant stance, has been deemed a threat to national security and social cohesion. The ban comes after increased scrutiny of the group's activities and growing concerns about its influence on public discourse. The French government has stated that it will not tolerate any form of extremism that undermines the country's values of liberty, equality, and fraternity. The ban on ''The Identitarians'' marks a significant step in France's efforts to address radical ideologies and promote inclusivity and tolerance."
 france.90.t:0 "Génération Identitaire Banned"
 france.9001.a:0 "Good for them."
 france.9001.d:0 "Didier Daeninckx, author-turned-politician-turned-leader, has today declared that the ambitious goal of building an utopia within France has come to a successful conclusion.\n\nFollowing the civil war, it seemed France was in for a rough time rebuilding both land and society. But Daeninckx had a dream not only of repairing the nation, but building it up into a veritable utopia. The anti-military and anti-capitalist policies of Daeninckx and his government were seen by many as antithetical to such an ambitious goal, but as it turns out, he may have been onto something.\n\nWhile the meadows of France are not covered by manna and money does not grow on trees, the living standards of the common French citizen are higher than ever in the history of the nation. As far as anyone looking from the outside in can tell, the French have in fact managed to reach utopia."
 france.9001.t:0 "Didier Daeninckx Declares Utopia"
 france.9002.a:0 "Allons-y!"
 france.9002.d:0 "In order for Daeninckx and his government to build utopia within France, two objectives must be met.\n\nFirstly, the government and specifically the laws of [ROOT.GetNameDef] must be reformed. While the government is largely in support of these reforms, it will still take considerable political capital to push the reforms through at a rapid pace. If we wish to come out of this with as much remaining political power as possible, we should take advantage of the various ideas Daeninckx has.\n\nSecondly, and more importantly, we must reach a developmental state fit of a utopia. Law reform will help with reaching this goal, but there are a number of other ways as well.\n\nIn short, utopia can be simply reached by implementing ideal laws and reaching high development."
 france.9002.t:0 "Destination Utopie"
 france.9003.a:0 "A small investment."
 france.9003.b:0 "A medium investment."
 france.9003.c:0 "A large investment."
 france.9003.d:0 "A massive investment."
 france.9003.desc.a:0 "Many issues regarding academic matters have recently come to light, in addition to the problems we were already aware of. Luckily, money tends to go a long way to solving most issues.\n\nHow much should we invest into academic development?"
 france.9003.desc.b:0 "Many issues regarding agricultural matters have recently come to light, in addition to the problems we were already aware of. Luckily, money tends to go a long way to solving most issues.\n\nHow much should we invest into agricultural development?"
 france.9003.desc.c:0 "Many issues regarding poverty have recently come to light, in addition to the problems we were already aware of. Luckily, money tends to go a long way to solving most issues.\n\nHow much should we invest into reducing our poverty rate??"
 france.9003.desc.d:0 "Many issues regarding industrial matters have recently come to light, in addition to the problems we were already aware of. Luckily, money tends to go a long way to solving most issues.\n\nHow much should we invest into industrial development?"
 france.9003.desc.e:0 "Many issues regarding societal matters have recently come to light, in addition to the problems we were already aware of. Luckily, money tends to go a long way to solving most issues.\n\nHow much should we invest into societal development?"
 france.9003.t.a:0 "Investing into Academic Issues"
 france.9003.t.b:0 "Investing into Agricultural Issues"
 france.9003.t.c:0 "Investing into Poverty Issues"
 france.9003.t.d:0 "Investing into Industrial Issues"
 france.9003.t.e:0 "Investing into Societal Issues"
 france.91.a:0 "But why now?"
 france.91.d:0 "Despite its decision to withdraw from the NATO Integrated Command, the French government has moved to reassure its NATO allies of its unwavering commitment to the military alliance. France emphasized that while it seeks greater independence in its defense policy, it remains dedicated to NATO's core principles of collective defense and cooperation. The French government's assurance comes amidst concerns among NATO members about the implications of France's withdrawal from the Integrated Command. France's continued commitment to its NATO allies underscores its belief in the importance of multilateral cooperation in maintaining global security and stability."
 france.91.t:0 "France assures continued Military involvement"
 france.92.a:0 "France, alone, shall choose its destiny"
 france.92.d:0 "In a bold assertion of its sovereignty and strategic autonomy, the French government has announced its decision to withdraw from the NATO Integrated Command. This historic move signals a significant shift in France's approach to its defense policy and its relationship with NATO. President [FRA.GetLeader] emphasized that while France remains committed to NATO's core principles of collective defense, the decision to withdraw from the Integrated Command reflects its determination to shape its own military strategy independently. \n\nThe decision has sparked debates within NATO and among European allies, with some expressing concerns about the implications for European defense cooperation. However, France has reassured its allies that its commitment to NATO's overall objectives remains unwavering. The French government's move is seen as a strategic recalibration, allowing France greater flexibility in its defense decisions while maintaining its commitment to European security and stability."
 france.92.t:0 "France leaves the NATO Integrated Command Structure"
 france.921.d:0 "In a bold assertion of its sovereignty and strategic autonomy, the French government has announced its decision to withdraw from the NATO Integrated Command. This historic move signals a significant shift in France's approach to its defense policy and its relationship with NATO. President [FRA.GetLeader] emphasized that while France remains committed to NATO's core principles of collective defense, the decision to withdraw from the Integrated Command reflects its determination to shape its own military strategy independently. \n\nThe decision has sparked debates within NATO and among European allies, with some expressing concerns about the implications for European defense cooperation. However, France has reassured its allies that its commitment to NATO's overall objectives remains unwavering. The French government's move is seen as a strategic recalibration, allowing France greater flexibility in its defense decisions while maintaining its commitment to European security and stability."
 france.921.t:0 "France leaves the NATO Integrated Command Structure"
 france.93.a:0 "From Far to Center!"
 france.93.d:0 "Following her victory in the 2022 election, Marine Le Pen has undertaken a bold rebranding effort, transforming the National Rally into the Republican Union. This new party marks a departure from its far-right roots, embracing a right-centrist political identity. The rebranding is aimed at broadening the party's appeal and moving towards a more moderate position in the political spectrum. The Republican Union seeks to unite various conservative factions under a single banner, presenting itself as a viable alternative to the established parties. Le Pen's strategic rebranding reflects a calculated effort to reshape the party's image and attract a wider range of voters, signaling a significant shift in French politics."
 france.93.t:0 "Rebranding of The National Rally"
 france.94.a:0 "The Menhir has finally tipped over."
 france.94.b:0 "Europe sheds no tears for his loss."
 france.94.c:0 "Au revoir, papa."
 france.94.d:0 "Today, Jean Louis Marie Le Pen, the principal founder of the National Rally - then called the National Front - and father to Marine Le Pen, has passed away at the age of 96. \n\nSubject to nothing short of a mountain of controversies ranging from discriminatory statements to near outright Holocaust denial, the firebrand former leader of the National Rally's longevity in the French political scene since the 1980's has deeply influenced the nation's right-wing and mainstream opinions as a whole. Expelled from the National Rally in 2015 after a feud with his daughter Marine over the party's modernization and his inflammatory statements, and going so far as to endorse far-right candidate Eric Zemmour over Marine's party leadership, his passing has, for some, marked the end of a turbulent chapter in French right-wing politics. \n\nIn the same vein as his life, his death has been met with various strong opinions, making it a spectacle in its own right; among the right-wing, reactions range from deep mourning to muted condolences. Moderates either offer it little notice or condemn his past hateful rhetoric. The left-wing celebrates the passing of one of the most outspoken fascistic figures in France in recent decades with jubilation. No matter the response, it appears the man's departure has almost been as much of a hot topic as the man himself."
 france.94.e:0 "One of the last Great Men of France"
 france.94.f:0 "The Fascist Devil of the Republic finally breathes his last."
 france.94.g:0 "A true patriot lays to rest."
 france.94.h:0 "He was a visionary once..."
 france.94.t:0 "The Death of Jean-Marie Le Pen"
 france.95.a:0 "Reconquête Retreats"
 france.95.d:0 "In a surprising turn of events, the far-right movement Reconquête has announced its disbandment. The movement, known for its nationalist and anti-immigrant stance, cited internal disagreements and a lack of viable political path forward as reasons for its dissolution. Reconquête's abrupt disbandment marks the end of a controversial chapter in French politics, leaving many of its supporters and critics alike reflecting on its impact. With Reconquête's departure from the political scene, the future of far-right politics in France becomes uncertain, opening up new possibilities and challenges for the country's political landscape."
 france.95.t:0 "Reconquête Disbands"
 france.96.a:0 "Benedetti sidelines Zemmour"
 france.96.b:0 "Zemmour stands triumphant!"
 france.96.d:0 "A new far-right party, ''Revolution and Renewal'' has emerged from the remnants of Eric Zemmour's disbanded Reconquête party and Yvan Benedetti's fascist supporters. However, the party's formation has not been without challenges, as Zemmour and Benedetti find themselves at odds over leadership and ideology. Both leaders are vying to seize control of the party, each seeking to imprint their vision upon its direction. As tensions simmer between the two factions, ''Revolution and Renewal'' finds itself at a crossroads, with its future direction hanging in the balance."
 france.96.t:0 "Revolution et Renouveau is Formed"
 france.97.a:0 "France United, Defiant!"
 france.97.d:0 "Following her victory in the 2022 presidential election, Marine Le Pen has taken decisive action to address the looming threat of further Russian aggression. In a historic move, she has convened talks with opposition leaders, including former President Macron, members of MoDem, Les Republicains, and Horizons, as well as military analysts, to form a National Unity Government. This coalition aims to present a united front against potential Russian aggression, demonstrating a commitment to the defense and security of France. The talks represent a significant moment of bipartisan cooperation, signaling a united French response to external threats."
 france.97.t:0 "Le Pen meets with Opposition leaders and Military Analysists"
 france.98.a:0 "France WILL persist"
 france.98.d:0 "In a historic address to the nation, Marine Le Pen, flanked by former President Macron and a coalition of opposition leaders, military analysts, and key figures from MoDem, Les Republicains, and Horizons, has officially announced the creation of a National Unity Government. This groundbreaking coalition, born out of necessity in the face of escalating Russian aggression, represents a paradigm shift in French politics. The government's formation underscores a commitment to prioritize national security and unity above partisan interests. As Le Pen details the government's objectives and structure, outlining plans for coordinated defense strategies and diplomatic efforts, there is a sense of cautious optimism among the French populace. The unity displayed by these once-opposing factions signals a new chapter in French history, one where solidarity and cooperation prevail in the face of adversity."
 france.98.t:0 "National Unity Government announced"
 france.99.a:0 "A whole lot of traitors"
 france.99.d:0 "Following the announcement of the National Unity Government, a significant portion of the electorate has shifted their support towards nationalist and communist parties. Parties like Revolution and Renewal and the French Communist Partyhave seen a surge in popularity. The sudden influx of support for these parties reflects a sense of disillusionment among voters who feel alienated by the now massive and united mainstream political establishment. As the National Unity Government seeks to navigate the challenges posed by Russian aggression, the political landscape in France undergoes a dramatic transformation, setting the stage for a new era of political competition and ideological confrontation."
