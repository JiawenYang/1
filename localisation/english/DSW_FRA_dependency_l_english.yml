 FRA_France_First:0 "France First"
 FRA_France_First_desc:0 "NATO and the European Union are precious things, but nothing should be or is more precious than ones homeland, France cannot be placed after international interests, French companies cannot lose on French soil to foreign business. France is already Europes strongest armed forces and yet we are not yet enough, we will grow stronger. Our forces and our economy shall grow larger. Europe will not be able to expect French bailouts or French vehicles, let Germany sell it's tank fleet abroad, we will keep our Leclercs and double our host of them. France above all must be prepared, economically, militarily, and mentally. If we are not prepared then none of Europe will be surely. In these times we must take up the role of Shepherd while Wild America is breaking itself apart."
