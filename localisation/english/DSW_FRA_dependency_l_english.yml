 FAF_naval_command_boost_tt:0 "The French Naval High Command will use these preperations to §Cemulate large scale naval invasions§!"
 FAF_new_classicalism_decision:0 "New Classicalism"
 FAF_new_classicalism_decision_desc:0 "Our dreams of a united Europe stem from the glories of the Roman Empire and the culture it espoused. While things have changed a lot since then, the ideas of Classicism in our art and architecture are something that we should strive to continue. By revitalizing schools of art that prioritize works of splendor and beauty and moving away from the drab Modernist styles many have come to abhor, we can cement ourselves as the true representatives of the golden age of European arts and culture!"
 FAF_nobility_cost_mission:0 "The Cost of Stability"
 FAF_nobility_cost_mission_desc:0 "\n\n\n\n\n£GFX_FAF_nobility\n\n\n\n\n\n\n\nNoble infighting threatens our regime, but the Nobles are like any elite class in any nation, money keeps them happy and happy elites make for a happy nation, call it greed, they are landholders by ancient and divine rights, rights we would do well to respect so they respect our own."
 FAF_nobility_taking_money_tt:0 "§CThe Nobility§! will take a large sum of money from the national bank every 3 months, in return for the stability of the realm."
 FAF_non_non_non_decision:0 "§RNon! Non! Non!§!"
 FAF_non_non_non_decision_desc:0 "Say no to pacifism! Say no to liberalism! Say no to communism! It is one thing to clean house, but quite another to root out the rot that grows deep within our nation. The filth that still poisons the minds of our citizens will not disappear on its own; instead, we must guide our people onto the right path and prevent them from straying."
