 FRA_Philippe_Olivier_HM:0 "Philippe Olivier"
 FRA_Philippe_Olivier_desc:0 "Philippe Olivier, born on December 2, 1957, is a French politician and member of the conservative political party Rassemblement National (National Rally). He is known for his conservative and nationalist views, advocating for stricter immigration policies, stronger borders, and the preservation of French cultural identity. Olivier has been involved in local politics in the Hauts-de-France region and has been a candidate for various local and regional elections, representing Rassemblement National's platform. He is also known for being the former brother-in-law of Marine Le Pen, the leader of Rassemblement National."
 FRA_Philippe_Susnjara:0 "Philippe Susnjara"
 FRA_Philippe_Susnjara_desc:0 "Philippe Susnjara is a low-ranking officer in the French Military with an expertise in defense security and intelligence."
 FRA_Philippe_de_Villiers_HM:0 "Philippe de Villiers"
 FRA_Philippe_de_Villiers_HM_desc:0 "Philippe de Villiers, born on March 25, 1949, is a French politician, author, and former Member of the European Parliament. He is the founder of the right-wing eurosceptic political party Mouvement pour la France (Movement for France) and has been a prominent figure in French politics for several decades. De Villiers is known for his conservative views, advocacy for French sovereignty, and criticism of globalization and the European Union. He has also been involved in cultural initiatives, including the creation of historical theme park Puy du Fou. De Villiers' political career has been marked by his strong stance on preserving French identity and traditions. He is the older brother of §CPierre de Villiers§!."
 FRA_Pied_Noir_party:0 "Etat Pied-Noir"
 FRA_Pierre_Gattaz_EM:0 "Pierre Gattaz"
 FRA_Pierre_Gattaz_EM_desc:0 "Pierre Gattaz, born on March 18, 1959, is a French businessman and the former president of the French Business Confederation (Mouvement des entreprises de France, MEDEF). He served as president of MEDEF from 2013 to 2018, representing the interests of French employers and advocating for pro-business policies. Gattaz comes from a family with a strong industrial background, and he has been involved in various business ventures throughout his career. He is known for his advocacy of economic reforms, including labor market reforms and measures to boost competitiveness. Gattaz has been a prominent voice in French business circles and has been involved in debates on economic policy and industrial strategy."
