 FRA_Jean_Castex_HM:0 "Jean Castex"
 FRA_Jean_Castex_HM_desc:0 "Jean Castex, born on June 25, 1965, is a French civil servant and politician who became the Prime Minister of France on July 3, 2020, succeeding Édouard Philippe under President Emmanuel Macron. Castex has a background in public administration and has held various government positions, including serving as the Mayor of Prades and a regional councillor of Occitanie. He is known for his expertise in health and social issues, particularly in rural areas. Castex has faced challenges such as managing the COVID-19 pandemic and implementing economic recovery plans. His leadership style is often described as pragmatic and focused on consensus-building."
 FRA_Jean_Messiha:0 "Jean Messiha"
 FRA_Jean_Messiha_desc:0 "Jean Messiha, born on April 14, 1970, is a French-Egyptian politician and member of the far-right political party Rassemblement National (National Rally). He is known for his conservative and nationalist views, advocating for stricter immigration policies, stronger borders, and the preservation of French cultural identity. Messiha has been involved in various political campaigns and has been a vocal critic of mainstream political parties. He is also known for his controversial statements on social media and in the press. Messiha's political career has been marked by his efforts to promote Rassemblement National's platform and his support for Marine Le Pen, the leader of Rassemblement National."
 FRA_Jean_Noel_Barrot_FM:0 "Jean-Noël Barrot"
 FRA_Jordan_Bardella_HM:0 "Jordan Bardella"
 FRA_Jordan_Bardella_IM:0 "Jordan Bardella"
 FRA_Jordan_Bardella_IM_desc:0 "Jordan Bardella, born on September 13, 1995, is a French politician who is a member of the conservative political party Rassemblement National (National Rally). He has been a Member of the European Parliament since 2019, representing the Île-de-France constituency. Bardella is known for his conservative and nationalist views, advocating for stricter immigration policies, stronger borders, and the preservation of French cultural identity. He is seen as a rising star within the Rassemblement National party and has been a key figure in its efforts to broaden its appeal to younger voters. Bardella's political career has been marked by his strong support for Marine Le Pen, the leader of Rassemblement National, and his efforts to promote the party's platform."
