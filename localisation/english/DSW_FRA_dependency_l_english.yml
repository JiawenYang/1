 FAF_Calm_Militarist_Rhetoric:0 "Calm Militarist Rhetoric"
 FAF_Calm_Militarist_Rhetoric_desc:0 "Among our ranks exist those who wish to see the military take even further control over the government at the expense of our civil liberties. While we can appreciate their calls for order and stability, it is time to ease the rhetoric of these militarists, lest we see our beloved Republic transformed into a permanent military junta."
