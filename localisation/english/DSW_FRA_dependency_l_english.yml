 FRA_jean_yves_le_drian_FM:0 "Jean-Yves Le Drian"
 FRA_jean_yves_le_drian_FM_desc:0 "Jean-Yves Le Drian, born on June 30, 1947, is a French politician who has served in various ministerial roles in the French government. He is a member of the Socialist Party and has been a member of the French National Assembly and the Senate. Le Drian served as the Minister of Defence from 2012 to 2017 under President François Hollande, where he oversaw France's military operations abroad, including in Mali and Syria. He has also served as the Minister for Europe and Foreign Affairs since 2017 under President Emmanuel Macron. Le Drian is known for his expertise in foreign affairs and his role in shaping France's foreign policy. He is seen as a key figure in French politics and has been involved in numerous diplomatic efforts on behalf of France."
