 FRA_Francois_Asselineau_FM:0 "Francois Asselineau"
 FRA_Francois_Asselineau_FM_desc:0 "François Asselineau, born on September 14, 1957, is a French politician and the founder of the political party Union Populaire Républicaine (UPR), which advocates for France's withdrawal from the European Union. Asselineau has been a vocal critic of the EU and what he sees as the erosion of French sovereignty. He has run for President of France multiple times, promoting his vision of a ''Frexit'' and a return to an independent French state. Asselineau's political positions often align with nationalist and anti-globalization views, making him a controversial figure in French politics."
