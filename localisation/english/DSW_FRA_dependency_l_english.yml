 FAF_Strict_Martial_Law_idea:0 "Martial Law"
 FAF_Strict_Martial_Law_idea_desc:0 "Martial law will remain in place as long as the enemies of France roam. Daily life is suffocated under checkpoints and constant surveillance. Fear keeps the deviants in line, even if a sense of normalcy remains shaken."
 FAF_Suffocate_the_Navy:0 "Suffocate the Navy"
 FAF_Support_Benedetti:0 "Support Benedetti"
 FAF_Support_Benedetti_desc:0 "Our great leader Benedetti will be the driving force of the new national rejuvenation. Through the ashes of defeat has he risen up to be the great saviour of France and such the party must be united behind him, those not, must fall in line."
 FAF_The_General_trait:0 "Le Général"
 FAF_Utilize_Lafayette:0 "Utilize Lafayette"
 FAF_Utilize_Lafayette_desc:0 "Lafayette was one of the leading forces in overthrowing the old regime and has become sort of a modern-day Napoleon. He has become one of the most famous men in France as such, and his public support will be crucial in cementing our rule."
 FAF_Victor_Lenta_HM:0 "Victor Lenta"
 FAF_Vilify_the_Revolution:0 "Villify the Revolution"
 FAF_Vilify_the_Revolution_desc:0 ""
 FAF_Warning_interior_tt:0 "§RTHIS CHOICE WILL HAVE CONSEQUENCES§!"
 FAF_Warning_murder_tt:0 "§RYou cannot be serious? For all the STABILITY we have given you? You will regret this ''King'' Louis...§!"
 FAF_Warning_wife_interior_tt:0 "§OYou're really prepared to put your marriage through this? Shame on you for making your wife work for you...§!"
 FAF_Worker_Syndicate_Program_idea:0 "National Workers Syndicate"
 FAF_Worker_Syndicate_Program_idea_desc:0 ""
 FAF_XIV_Society_idea:0 "§OXIV Society§!"
 FAF_XIV_Society_idea_desc:0 "The XIV Society has dedicated themselves to restoring France to its former glory through the use of our regime. We have collaborated with the society since before the civil war through underground networks and so forth but today they are an incorporated part of our government now. As long as we have their support France will be one step closer to being restored to the grandeur it once held."
 FAF_XIV_society_tt:0 "Completion of this focus will §Ylock the player into their current political path§!"
