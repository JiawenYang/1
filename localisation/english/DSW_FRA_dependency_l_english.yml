 The_Government_of_National_Defense_Democratic_National_Conservative_TXT_DESC:0 "National Conservative Union - an odd hodge-podge of conservative and military values. They stand themselves as a much more patriotic conservative party than LR, thinking of themselves as the true continuation of the dream of Villiers and De Gaulle, of a traditionalist, patriotic France.\nThe ideology is §3Populist Gaullism§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Stephane_Ravier\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_Republicain_TXT:0 "§YLes Republicain§!"
 The_Government_of_National_Defense_Democratic_Republicain_TXT_DESC:0 "Les Republicains, the forerunner in most people's minds, is a movement nearly identical to the National Rally before it - a conservative movement looking to bring back the traditional values of France while maintaining the democratic system and balance of power.\nThe ideology is §YTraditional Gaullism§!.\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Xavier_Bellamy\n\n\n\n\n\n\n\n\n-------------------------------------"
