 latinist.2.a:0 "Are the heart of European civilization"
 latinist.2.b:0 "Were once united under Napoleonic Authority"
 latinist.2.c:0 "Are only a cog in the White Race"
 latinist.2.d:0 "In an age corrupted by skepticism and hollow internationalism, it is time to raise our true voice, to proclaim our unshakable national faith. Modernity is tearing apart the soul of France, and in this chaos, we must reclaim the pride and dignity of the Latin people.\n\nLook to our history, without France, there would be no true Europe. When Rome fell, it was we who preserved the flame of classical wisdom. It was from our lands that the Enlightenment erupted, with the Seine as the cradle from which reason and liberty spread across the world. The Germans and Anglo-Saxons? They are merely latecomers to civilization, their so-called cultural contributions nothing more than feeble imitations of our great heritage. European civilization is Latin, and it is French!\n\nWhen Napoleon's eagle soared over Moscow, Madrid, and Berlin, the world trembled before the unity of the French nation. Our armies were unstoppable, our laws reshaped an entire continent. Time and again, history has proven that what we need is not weakness, not endless debate, but decisive action and resolute leadership. Only by reviving our legacy of iron and glory can we rise once more in the chaos of the modern world!\n\nLook at Europe today, we must face a harsh truth: in the grand chessboard of global power, the White nations of Europe face an unprecedented challenge. We cannot afford division, nor can we waste time on mutual blame. From Ireland to the Urals, from Scandinavia to the Mediterranean, we share a common fate. France must recognize itself as part of this greater whole. Our struggle is the struggle of all European peoples. Only through unity can we defend our traditions, our way of life, and our civilization from external threats."
 latinist.2.t:0 "The Latin People..."
 latinist.3.a:0 "We are the Disgruntled Youth"
 latinist.3.b:0 "We are the soldier at Waterloo"
 latinist.3.c:0 "We are the Slayers of Huns, Vandals, and Mongoloids"
 latinist.3.d:0 "The well-dressed traitors of the past poisoned our youth, teaching them to despise their own history, scorn their own culture, and question their own bloodline. But the hour of awakening has arrived. We shall seize back our stolen glory, mend the severed chain of history, and restore what was deliberately erased.\n\nThe ruling class has numbed the nation's spirit with the illusion of prosperity, but we alone still feel the pain of betrayal. They twisted our history, teaching us to be ashamed of our ancestors' greatness. But should we apologize for spreading civilization? No! We reject this servile, self-loathing mentality—the flame of Latin youth shall never be extinguished!\n\nWaterloo must not be our shame, it must be our banner of defiance. That defeat was not a failure of France, but a conspiracy of cowards, where all of Europe united to strike down one nation. Yet even in the darkest hour, French soldiers cried out the Emperor's name, choosing death over surrender. Their blood runs in our veins, their spirit still walks this land.\n\nWhen the savage Huns stormed the gates of Europe, who stood against them? Our ancestors. When the Vandals ravaged the Mediterranean, who rebuilt order? Our kings. When the Mongol hordes sought to consume all of Europe, who raised the bulwark of civilization? We did.\n\nWe must reclaim this hidden legacy, for only by knowing who we are can we determine where we must go.History does not wait for the hesitant. Glory belongs only to those bold enough to follow in their ancestors' footsteps. The destiny of France is in our hands, and the choices we make today will shape the Europe of tomorrow."
 latinist.3.t:0 "Our Connection to the past..."
 latinist.5.a:0 "Pax Christi in Regno Christi"
 latinist.5.d:0 "Our newfound devotion to the church has not been received well by the ''Pope'' in Rome... As we all know, that red sympathizer has long advocated the acceptance of liberal plagues in our society and has kowtowed to the march of the pedophillic elites, he must be replaced with someone who is much more alike to our beliefs, like Alain Escada"
 latinist.5.t:0 "Declaration of the Antipapa"
 latinist.6.a:0 "Audaces Fortuna Juvat!"
 latinist.6.d:0 ""Au-den-tes for-tu-na ju-vat…" Capon felt each syllable being dragged out of his throat. "God, this is torture!" He snapped the book shut and glanced around the empty classroom. "Why are we still learning this dead language in the 21st century? Who even speaks Latin anymore?"\n\n"Young man, I imagine Virgil would be quite surprised by your pronunciation—though not necessarily in a good way." A steady voice echoed from the back of the room. Capon turned to see Professor Henry, the classical literature scholar, standing in the doorway, holding a worn leather-bound book.\n\n"Professor, I didn't realize you were here…" Capon stood up, slightly embarrassed.Henry waved a hand, signaling him to sit. "Go on. You were making an argument. Latin is obsolete?" Capon hesitated but answered honestly. "Yes, sir. We learn languages to communicate, and Latin has no practical use anymore." A faint smile crossed Henry's lips as he took a seat across from him. "A pragmatic argument. Very modern." He tapped Capon's textbook lightly. "But do you know what the phrase you just read actually means?"\n\n"Fortune favors the bold," Capon replied. "From Virgil's Aeneid."\n\n"Correct." Henry nodded approvingly. "When revolutionaries cried Liberté, Égalité, Fraternité, they were drawing directly from the Roman ideals of libertas, aequitas, and fraternitas. One could argue that Latin is the very soul of France, the foundation of our nation."\n\n"That doesn't mean we have to learn the whole language," Capon countered. "We could just study the key phrases and concepts." Henry stood and walked toward the window. Sunlight filtered through his graying hair, casting a long shadow on the floor. "Do you know why France has always placed such importance on universalism? Why we believe certain values transcend time and place? That mindset comes directly from the Romans. Latin is not just a relic—it is the key to understanding the roots of our culture.""
 latinist.6.t:0 "Speaking in Tongues" #Multilingual Education proves successful
 latinist.7.a:0 "Together, European can secure a future for our Children..."
 latinist.7.b:0 "We appreciate the work, but will remain sovereign."
 latinist.7.c:0 "We are DONE with these shenanigans!"
 latinist.7.d:0 "Since the fall of the Roman Empire, the dream of a united Europe has inspired the ambitions, hopes, and glory of many visionaries. Yet, it has also sparked some of the bloodiest conflicts in history, costing millions of lives. From autocratic rulers like Charles V of the Habsburgs and Louis XIV of the Bourbons to later figures like Napoleon and Hitler, every attempt to unify Europe through force has ended in failure. As a result, the idea of integrating Europe through a confederation gradually gained traction. The Maastricht Treaty marked a significant milestone in this process, bringing Europe closer to unity than ever before.\n\nHowever, things did not unfold as planned. In 2015, the Brexit referendum struck like a thunderbolt, shattering the fragile balance. As the 2010s progressed, the COVID-19 pandemic and conflicts in Eastern Europe further damaged the prospects for federalization, leaving the future looking increasingly uncertain. At this critical juncture, the spirit of unity is more precious than ever, offering the best hope to dispel the dark clouds that loom over us.\n\nAs one of the leaders of European civilization, the choices made by the French government and its people will determine the fate of Europe for the rest of this century. Will France take a leading role in a future unified European federation? Or will it hold on to its proud Gallic independence, standing firm against all threats? Or perhaps, will it completely break away from the old path and cast aside the 'An die Freude'?"
 latinist.7.t:0 "European Federalization"
 latinist.71.a:0 "A Shield against Soviet Internationalism!"
 latinist.71.b:0 "Another French attempt at Empire"
 latinist.71.d:0 "The French Government, seeing our dire situation, has offered us to join a brand new European Nation. It is quite the intriguing offer as after the demise of NATO and our crushing defeat in the European War, we are left with no allies in Europe anymore. Our nation is in dire times and we require a helping hand against the power hungry Communists in the east who otherwise would not hesitate to invade us, erase our culture and use us as one of their pawns."
 latinist.71.t:0 "The European Nation"
 latinist.72.a:0 "We mustn't let pointless blood be spilled."
 latinist.72.b:0 "Enough words have already been said. The only language these fools understand is violence!"
 latinist.72.d:0 "We are family, brothers and sisters. Threads of fate bind our people together, and the scarlet liquid that flows beneath our skin unites us. From the snow-capped Alps of Bolzano to the lush, emerald Pyrenees of Iberia, we have always been one people, a singular entity. The bridge between us was built not only by shared blood but also by the deep, unbreakable ties of our culture and history.\n\nIn good faith, we have offered our kin countless opportunities for peaceful unification. Yet, time and again, they have mocked us, dismissed us, or turned their backs on us entirely! We extended to them our love and brotherhood. A union of our nations would have ushered in unprecedented economic and military strength, benefiting all. Yet, they refuse to listen. They reject reason, lack faith in us, and, most tragically, cling desperately to their pitiful notions of ‘’nationalism’’ and ‘’regionalism.’’ Their eyes remain clouded by fruitless separatist delusions, blind to the greatness that could be achieved through unity.\n\nNo one wishes to see blood spilt between brothers, but how can we stand idle when those we love continue to slander and betray us!? Every soul has its breaking point and France has finally reached hers. Now, we stand at a crossroads. Do we extend our hand one final time, pleading for reason to prevail? Or do we let bullets and bombs speak on our behalf?"
 latinist.72.t:0 "Être à bout"
 latinist.8.a:0 "A necessary means to an end."
 latinist.8.b:0 "We decline."
 latinist.8.d:0 "For the new empire, there's one pressing issue that stands out the colossal power stretching from the Oder to the Neisse rivers: the menacing Russian hegemony, baring its fangs and ready to swallow Europe, and perhaps the entire world. If anyone else were at the helm of France, they might consider delaying this formidable challenge. However, retreat and concessions are foreign concepts to the French Empire, which sees itself as the singular leader of Europe. Confronting challenges head-on is in its very nature.\n\nYet, today is not like the past. A single decisive battle leading to a Treaty of Tilsit is a fantasy that will not play out in 21st-century Europe. Confronting Russian dominance is a daunting, slow-burning endeavor. The Emperor and his advisors have turned to their illustrious ancestor, the great Napoleon I, for inspiration. The Continental System of old, which once allied with Russia against Britain, will now pivot to counter their former Slavic ally.\n\nThe French leadership believes France holds a significant advantage in naval power and maritime trade, bolstered by support from other EU nations and possibly swaying the smaller, undecided European countries. In contrast, Russia's options are limited. Confining them to the narrow waters of the Baltic and Black Seas could set the stage for a future military showdown.\n\nHowever, some question the feasibility of this strategy. Critics argue that Russia might rely on its eastern allies to continue trade unimpeded. Furthermore, rebuilding the Continental System could harm Europe more than help, especially since many EU member states remain dependent on Russian oil and natural gas.\n\nSo, will the Emperor seek to emulate the glory of his forebear, or will he choose a more cautious path?"
 latinist.8.t:0 "The New Continental System"
 latinist.9.a:0 "A New Era means a New Palace"
 latinist.9.b:0 "It must be brought into Modernity"
 latinist.9.c:0 "It is fine as is!"
 latinist.9.d:0 "''Versailles is 400 years old, many of the rooms are empty or display rooms for tourists, it is a skeleton of a Palace. A few months of repairs, bringing new furniture and historic art should bring it back to its former Grandeur with a modern touch.'' \n\n''The Palace of Versailles has served its purpose, the half millennium old Palace should continue to serve as a tourist attraction. A new, grander Palace must be commissioned, one which will serve the full needs of its owners.'' \n\n''No work is needed on repairs or ''modernity'', transition Versailles from a tourist attraction into a functional Imperial Palace for the Imperial Family and the Government in its South-West Wing.''"
 latinist.9.t:0 "Imperial Renovations"
