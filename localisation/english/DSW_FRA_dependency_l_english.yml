 FAF_reorganize_the_LVF_decision_desc:0 "Loyalist Volunteer Force's name was bastardised by those who never truly understood it. The Reds and Liberals are the sole reason our nation is in decline, that is why this nation needs more groups like the loyalists to clean this filth within our nation and rid it of its disease."
 FAF_reorganize_the_armed_forces_decision:0 "Reorganize the Armed Forces"
 FAF_replace_possible_republicans_decision:0 "Launch Army Investigation"
