 FAF_revive_the_franco_german_brigades_decision:0 "Rebuild the Franco-German Brigades"
 FAF_revive_the_franco_german_brigades_decision_desc:0 "Us and the Germans have had our fair share of problems, but nonetheless we are brothers. The deep connection between us was created through blood and trial. Our common enemy in the East threatens the stability and existence of both of our nations. We must gradually increase the cooperation between our two nations and reforming the small but highly mobile Franco-German brigades is the first step in this process."
