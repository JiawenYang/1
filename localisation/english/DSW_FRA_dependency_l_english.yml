 The_6th_Republican_Constitutional_Referendum_1_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Radical_Sixth_Republic  §tRadical Constitution§!"
 The_6th_Republican_Constitutional_Referendum_1_TXT_DESC:0 "The nation is renamed French Popular Republic. The ideology is Socialist Souverainism.\n\n§RRequires:§!\n§pMélenchon§! or §0Ruffin§! leads the §pNew Popular Front§! to win the 2022 general election."
