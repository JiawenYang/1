 FRA_Alexis_Corbiere_IntelM_desc:0 "Alexis Corbière, born on August 17, 1968, is a French politician and member of the left-wing political party La France Insoumise (France Unbowed). He has been a Member of the National Assembly since 2017, representing the 7th constituency of Seine-Saint-Denis department. Corbière is known for his progressive and anti-establishment views, advocating for social justice, workers' rights, and environmental sustainability. He is a vocal critic of neoliberal policies and has been actively involved in various social movements. Corbière is seen as a key figure within the France Insoumise party and has been involved in shaping its political platform."
