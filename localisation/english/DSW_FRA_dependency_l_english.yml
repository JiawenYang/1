 FRA_Bernard_Emie:0 "Bernard Emie"
 FRA_Bernard_Emie_desc:0 "Bernard Emié is a French diplomat who has served in various high-ranking positions in the French government. He has been the Director-General of the Directorate-General for External Security (DGSE), France's external intelligence agency, since 2017. Emié has a background in intelligence and has been involved in shaping France's intelligence policies and strategies. He is known for his expertise in intelligence matters and his role in coordinating intelligence efforts in support of French national security. Emié's tenure as Director-General of the DGSE has coincided with a period of increased security challenges for France, including terrorist threats and cyberattacks."
 FRA_Bertrand_de_La_Chesnais_IntelM:0 "Bertrand de La Chesnais"
 FRA_Bertrand_de_La_Chesnais_IntelM_desc:0 "Bertrand Marie Joseph Houitte de La Chesnais is a former Major General of the French Army and a French politician who is a member of the conservative political party Rassemblement National (National Rally). He is known for his conservative and nationalist views, advocating for stricter immigration policies, stronger borders, and the preservation of French cultural identity. De La Chesnais has been involved in local politics in the commune of Bretteville-l'Orgueilleuse in Normandy, France. He has also been a candidate for various local and regional elections, representing Rassemblement National's platform."
