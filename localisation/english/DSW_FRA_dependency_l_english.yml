 FAF_royal_pretenders_sway_nobility_dummy_idea:0 "Royal Pretenders"
 FAF_sabotage_rail_decision:0 "Set the Stage for Sabotage"
 FAF_sabotage_rail_decision_desc:0 ""
 FAF_shield_decision:0 "Raise our Shields"
 FAF_showcase_superiority_decision:0 "Showcase French Superiority"
 FAF_showcase_superiority_decision_desc:0 "We are superior, we know this. Our ideals, our lifestyles, our history, our people... All have been perfected like the most eloquent wine, yet the world continually fails to recognize our OBVIOUS superiority over them!"
 FAF_silence_german_critics_decision:0 "Silence Critics of Allies"
 FAF_silence_german_critics_decision_desc:0 "Those fools who criticize our European allies have no understanding of strategic planning. They lack vision and depth. It is truly appalling how many people still fail to grasp the principle "the enemy of my enemy is my friend." Their threat to us is insignificant at present compared to the Bolshevik menace to the East. We won't place our full trust in them, of course, but practicality must always come before ideology."
 FAF_solidarite_latine_idea:0 "Solidarité Latine"
 FAF_solidarite_latine_idea_desc:0 "The Latin people are a hegemony that should spread their wings across all of Europe, fighting as a singular entity and as a monument to our history and our culture. The enemies of Latindom are vast, many in number and strong in fortitude. However, as described, they are naught but barbarians trying to fiendishly tear down the walls of civilization, which we, the descendants of Rome, must combat with blood and soil."
 FAF_stabilize_the_republic_decision:0 "Stabilize the Republic"
 FAF_stabilize_the_republic_decision_desc:0 ""
 FAF_strengthen_europeanism_decision:0 "Strengthen Pan-Europeanism"
 FAF_strengthen_military_loyalty_decision:0 "Strengthen Military Loyalty"
 FAF_strengthen_military_loyalty_decision_desc:0 ""
 FAF_sway_the_nobility_decision:0 "Sway the Nobility"
 FAF_sway_the_nobility_decision_desc:0 "Simply holding the divine right is not enough for the Nobility, divinity is a different thing for dukes and counts and patricians, if the Orleanists and Bonapartists offer them a better deal, suddenly they are divine due to their ''Benevolence'', well, we must be just as ''Benevolent'' if we are to secure our rule."
 FAF_sword_and_shield_bop:0 "The Sword and Shield"
 FAF_sword_decision:0 "Raise our Swords"
 FAF_take_in_european_dissidents_decision:0 "Take in European Dissidents"
 FAF_take_in_european_dissidents_decision_desc:0 ""
 FAF_taunt_our_enemies_decision:0 "Taunt our Enemies"
 FAF_taunt_our_enemies_decision_desc:0 "France has countless enemies both inside and outside. But what can these rats do? What can these worthless dogs do to harm our nation? They are weak, both psychologically and physically. The communists degenerates in our country have become meek while the Russians are too busy fighting each other. How can one not find it laughable that these are our so called foes? "
 FAF_the_crime_of_opinion_idea:0 "Crime of Opinion"
 FAF_the_crime_of_opinion_idea_desc:0 "In our quest to secure our power, one field we have struggled with is in the hearts and minds of our citizens. While reeducation has worked well, another tool we can implement is to ban anti-regime thoughtcrime. By making the sharing or possession of liberal, progressive, and anti-French ideals punishable with fines or short jail time, we ensure that people will think twice before complaining about our righteous government!"
 FAF_the_failures_of_AH_decision:0 "Failures of [AUS.GetFlag] Austria-Hungary [HUN.GetFlag]"
 FAF_the_failures_of_AH_decision_desc:0 "One of the major problems within the Austrian-Hungary Empire was the improper governing of their cultural minorities, while still being European, they were subject to a cultural dominance by the Austrains who ruled them. We can not by any means replicate this example in history. We must find common solutions to our problems and work, as the grand people of all of France, into a goal that we can find solace in."
 FAF_the_grand_council_idea:0 "The Grand Council of Fascism"
 FAF_the_grand_council_idea_desc:0 "The French political system has once again proven itself to be an ineffective mess. Like the old Bourbon monarchy, it must be overthrown, and a new system must be created. With a bolder, braver government, France will rebuild and rediscover her former glory. Democracy's lacklustre performance will be replaced by the vitality of Fascism. Strong leadership is the only way to achieve true change and reform—not voting and debating. We will form a new governing body modeled after the Italian Grand Council of Fascism, ushering in a new era of prosperity for our nation."
 FAF_the_horde:0 "The French Horde"
 FAF_the_horde_dummy:0 "The French Horde"
 FAF_the_horde_focus_disgust:0 "The French Horde"
 FAF_the_horde_logistics:0 "The French Horde"
 FAF_the_horde_suffocate_navy:0 "The French Horde"
 FAF_the_new_order_idea:0 "The New Order"
 FAF_the_old_capital_decision:0 "Restore Charlemagne's Capital"
 FAF_the_puppeteers_of_DAY_X_decision:0 "The REAL Puppeteers of ''Day X''"
 FAF_the_puppeteers_of_DAY_X_decision_desc:0 "Germany, with her decades of anti-nationalism just up and turns into a fascist country after losing a war to Russia? WE FOUGHT FOR OUR GOVERNMENT, WE FOUGHT TO EXPEL THE COMMUNISTS! GERMANY, however, just swept them under the rug into their Strasserist-Communist Shenanigan and WE ALL KNOW who benefits when the Germans need to buy guns and take out loans..."
 FAF_the_rising_flame_idea:0 "The Rising Flame"
 FAF_the_roman_way_decision:0 "The Roman Way"
 FAF_the_roman_way_decision_desc:0 "When asked about Rome, many will say it was a vast and powerful empire, but few can truly pinpoint what made Rome great. Any substandard nation can build an empire, but what set Rome apart was its unwavering will—forged through blood and mud. As the heirs of Rome, it is our destiny to rebuild what was lost, destroyed, and forgotten centuries ago. The Roman eagle shall once again soar across Europe, from Iberia to Italy, its cries echoing through the European skies."
