 FAF_royal_house_squabbles_mission:0 "Royal Squabbles"
 FAF_royal_house_squabbles_mission_desc:0 "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\nThe question of who has the divine right to rule France should not be up for question, but it is, and so until we secure our rule, we have to deal with childish bickering harming our ability to govern."
 FAF_royal_pretenders_dummy_idea:0 "Royal Pretenders"
 FAF_royal_pretenders_idea:0 "Royal Pretenders"
