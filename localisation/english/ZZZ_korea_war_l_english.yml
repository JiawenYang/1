l_english:
 ZZZ_KW_korea_war.1.t:0 "The Negotiating Window Closes"
 ZZZ_KW_korea_war.1.d:0 "May 9, 2022. The last round of inter-Korean talks ends without a framework agreement. No treaty is signed, no war is declared — but the window for a negotiated settlement is now shut. From this day on, Seoul will have to choose between deterrence and adventure."
 ZZZ_KW_korea_war.1.a:0 "We did what we could."
 ZZZ_KW_korea_war.2.t:0 "A Peninsula at Peace"
 ZZZ_KW_korea_war.2.d:0 "The confederation framework holds. The North and the South enter a long transitional arrangement, and the Blue House is handed to a progressive government committed to the sunshine policy. There will be no war on this peninsula."
 ZZZ_KW_korea_war.2.a:0 "A new road opens."
 ZZZ_KW_korea_war.3.t:0 "The Hard Line Takes Office"
 ZZZ_KW_korea_war.3.d:0 "With the talks dead, the electorate turns to a conservative government that promises to answer provocation with resolve. The new administration orders a full review of the Northern threat and quietly prepares for the worst."
 ZZZ_KW_korea_war.3.a:0 "Order comes first."
 ZZZ_KW_korea_war.4.t:0 "Emergency Martial Law"
 ZZZ_KW_korea_war.4.d:0 "December 2024. Facing a hostile legislature and a collapsing political base, the president declares emergency martial law, citing the Northern threat. Armoured units move toward the capital and the National Assembly is surrounded."
 ZZZ_KW_korea_war.4.a:0 "Declare martial law."
 ZZZ_KW_korea_war.5.t:0 "The Night of the Assembly"
 ZZZ_KW_korea_war.5.d:0 "Lawmakers barricade themselves inside the chamber and vote the decree down. The streets fill with protesters. The government has crossed a line it cannot walk back, and the only way out it can see now points north."
 ZZZ_KW_korea_war.5.a:0 "There is no turning back."
 ZZZ_KW_korea_war.6.t:0 "War Against the North"
 ZZZ_KW_korea_war.6.d:0 "At dawn, the Republic of Korea declares war on the North with a war goal of total annexation. There will be no armistice, no negotiated pause, no second round of talks. The peninsula is at war — and the region will not stay neutral for long."
 ZZZ_KW_korea_war.6.a:0 "Commit everything."
 ZZZ_KW_korea_war.7.t:0 "The Great Asian War"
 ZZZ_KW_korea_war.7.d:0 "Tokyo declares war on Beijing. The Great Asian War has begun, and the fighting on the Korean peninsula is only its first front."
 ZZZ_KW_korea_war.7.a:0 "It was inevitable."
 ZZZ_KW_korea_war.8.t:0 "The Peninsula Burns"
 ZZZ_KW_korea_war.8.d:0 "Artillery opens along the DMZ as the Republic of Korea moves north. The world holds its breath."
 ZZZ_KW_korea_war.8.a:0 "The world watches."
 ZZZ_KW_martial_law_2024:0 "Emergency Martial Law"
 ZZZ_KW_martial_law_2024_desc:0 "Emergency powers suspend normal politics, curtail civil liberties and put the country on a war footing — while costing the government what little legitimacy it had left."
 ZZZ_KW_korea_war.9.t:0 "Martial Law Rejected"
 ZZZ_KW_korea_war.9.d:0 "In the early hours of 4 December 2024, the National Assembly voted overwhelmingly to overturn the martial law decree, and troops began withdrawing from Seoul. Impeachment proceedings followed within days — the shortcut collapsed under the eyes of the public."
 ZZZ_KW_korea_war.9.a:0 "The constitution still stands."
 ZZZ_KW_korea_war.10.t:0 "A Government Replaced"
 ZZZ_KW_korea_war.10.d:0 "On 3 June 2025 the snap election concluded: the progressive camp won a majority and the new government took office the next day. There was no war on the peninsula, only a difficult reckoning and reconstruction — while the security dilemma left by the conservatives still stands between the two Koreas."
 ZZZ_KW_korea_war.10.a:0 "Decided by the ballot."
