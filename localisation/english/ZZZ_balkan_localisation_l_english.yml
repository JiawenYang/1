 # ==== ZZZ Balkan: elections ====
 zzz_balkan.1.t:0 "The Revival Wave Sweeps Sofia"
 zzz_balkan.1.d:0 "With Washington paralysed by its own constitutional crisis, Bulgarian voters turn to Vazrazhdane. Kostadin Kostadinov's movement campaigns against NATO membership and EU conditionality, and promises to reopen channels to Moscow and Beijing."
 zzz_balkan.1.a:0 "A new government takes office in Sofia."
 zzz_balkan.2.t:0 "Bucharest Elects a Sovereigntist"
 zzz_balkan.2.d:0 "Romanian nationalism returns to power. The new president rejects the Atlantic framework, calls for an end to Western military presence on the Black Sea, and opens talks with Russia and China."
 zzz_balkan.2.a:0 "The government in Bucharest changes course."
 zzz_balkan.3.t:0 "Greece Breaks with the Euro-Atlantic Camp"
 zzz_balkan.3.d:0 "Zoe Konstantopoulou's movement turns the austerity crisis into a rupture with Brussels and Washington. The new government demands the withdrawal of foreign bases and moves to leave both NATO and the European Union."
 zzz_balkan.3.a:0 "Athens chooses a different path."
 zzz_balkan.4.t:0 "Ankara Reconsiders Its Alliances"
 zzz_balkan.4.d:0 "A nationalist-left government in Ankara concludes that NATO has become a liability. Turkey announces its withdrawal from the alliance while keeping its independent course toward Russia and China."
 zzz_balkan.4.a:0 "Turkey leaves NATO."
 zzz_balkan.5.t:0 "Tirana Follows the New Current"
 zzz_balkan.5.d:0 "As the Western security guarantee falters, Albanian politics shifts toward the nationalist camp. Tirana signals that it will not remain the last outpost of a dissolving alliance."
 zzz_balkan.5.a:0 "Albania reorients."
 zzz_balkan.6.t:0 "Zagreb Joins the Balkan Turn"
 zzz_balkan.6.d:0 "Croatian nationalists win the argument that the country's future lies with a regional bloc rather than with a fading Atlantic order. Zagreb prepares to leave NATO and the EU."
 zzz_balkan.6.a:0 "Croatia turns east."
 zzz_balkan.7.t:0 "Ljubljana Recalculates"
 zzz_balkan.7.d:0 "Slovenian politics swings toward the nationalist right, which questions both NATO membership and the EU's authority over Ljubljana."
 zzz_balkan.7.a:0 "Slovenia reconsiders its membership."
 zzz_balkan.8.t:0 "Podgorica Chooses the Serbian-Russian Axis"
 zzz_balkan.8.d:0 "Andrija Mandic's pro-Serbian, pro-Russian bloc takes power in Montenegro and moves to sever the country's ties with NATO."
 zzz_balkan.8.a:0 "Montenegro leaves the alliance."
 zzz_balkan.20.t:0 "The Withdrawal Is Formalised"
 zzz_balkan.20.d:0 "The new government completes the legal process of leaving the Western security and economic structures. Washington and Brussels retaliate; Moscow and Beijing welcome the shift."
 zzz_balkan.20.a:0 "The break is complete."
 zzz_balkan.20.b:0 "Not yet - the government has not changed."
 zzz_balkan.30.t:0 "The Balkans Are Open Again"
 zzz_balkan.30.d:0 "With the Atlantic bloc in retreat across the peninsula, Chinese diplomacy moves into the vacuum. A regional federation is now within reach."
 zzz_balkan.30.a:0 "A new sphere takes shape."

 # ==== ZZZ Balkan: decisions ====
 PRC_balkan_federation_support:0 "Balkan Initiative: Support a Balkan Federation"
 PRC_balkan_federation_support_desc:0 "The United States is paralysed and the Western order in the Balkans is collapsing. By backing a regional federation, Beijing can replace American and Russian influence with its own."
 PRC_balkan_federation_support_cost_tt:0 "Requires 150 political power, 60 command power and 12 treasury; all are consumed."
 PRC_balkan_war_on_turkey:0 "Settle Accounts with Turkey"
 PRC_balkan_war_on_turkey_desc:0 "Turkey has left NATO and stands alone. With Russia victorious in Europe and China victorious in the Pacific, Ankara can be brought to terms by force."
 PRC_balkan_federation_collapse:0 "Abandon the Balkan Position"
 PRC_balkan_federation_collapse_desc:0 "The Russian campaign has failed. The Balkan federation project can no longer be sustained; the partnership is dissolved."

 # ==== ZZZ Balkan: ideas ====
 BALKAN_withdrawal_economic_shock:0 "Withdrawal Shock"
 BALKAN_withdrawal_economic_shock_desc:0 "Cutting ties with Western markets and security structures has disrupted trade, investment and public confidence."
 PRC_balkan_federation_partnership:0 "Balkan Federation Partnership"
 PRC_balkan_federation_partnership_desc:0 "China underwrites the Balkan federation. The long-term economic and diplomatic burden weighs on the Chinese budget."

