l_english:
 historical_elections.1.t:0 "2018 Italian General Election"
 historical_elections.1.d:0 "The general election produces a hung parliament. The Five Star Movement and the League form a governing coalition, with Giuseppe Conte becoming prime minister on June 1."
 historical_elections.1.a:0 "A new government takes office."
 historical_elections.2.t:0 "2017 South Korean Presidential Election"
 historical_elections.2.d:0 "Moon Jae-in wins the presidential election and takes office as president of South Korea."
 historical_elections.2.a:0 "A new administration begins."
