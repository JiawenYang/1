 zzz_party.120.t:0 "A New President in Carthage"
 zzz_party.120.d:0 "Independent candidate Kais Saied wins the 2019 presidential election, reshaping Tunisian politics through anti-establishment forces."
 zzz_party.120.a:0 "Accept the result"
 zzz_party.123.t:0 "Peru: A Rural Teacher's Victory"
 zzz_party.123.d:0 "A rural schoolteacher, Castillo wins the runoff of the 2021 presidential election, shifting Lima's political centre of gravity to the left."
 zzz_party.123.a:0 "Accept the result"
 zzz_party.124.t:0 "Political Crisis in Lima"
 zzz_party.124.d:0 "Castillo is impeached and Vice-President Boluarte assumes the presidency. A technocratic caretaker government takes power in Peru."
 zzz_party.124.a:0 "Accept the result"
