 GER_FRANZ_DESC:0 "Born in 1978 in Völklingen, Saarland, in what was then West Germany, Frank Franz grew up in a reunified Germany marked by political division and economic uncertainty. In these times, some Germans turned to radical movements which promoted "better alternatives" to the current administration. Franz was no different. He joined the NPD in the early 2000s and later rose to lead the party during its decline. With a talent for rebranding extremism in more palatable terms, Franz pushed for a new political image, one rooted in traditionalism, order, and cultural revival.\n\nThough unpopular amongst the public, Franz remained active in far-right circles, quietly building ties within the military and nationalist groups. He found his moment of triumph soon after the European War had ended. NATO's failure to contain Soviet advances in Eastern Europe led to mass disillusionment amongst the tired populace. Thus, they turned to more radical ideas.\n\nSoon after the Bundestag fell into chaos, the military, blaming Berlin's indecision and weakness, launched a swift coup. Promising to restore sovereignty and strength, they turned to Franz, who was seen as a figure of resolve and national unity by many. Backed by officers, paramilitaries, and a desperate public, he was appointed Chancellor under emergency powers. Now, Franz has total authority over his Heimat. Whether he chooses to align himself with similar movements across much of Europe or take a turn to the past is up to his will."
