l_english:
 ZZZ_election.0.t:0 "A National Election Approaches"
 ZZZ_election.0.d:0 "The parliamentary term is drawing to a close. Party headquarters are finalising campaign budgets, donors are lining up, and the country's political future will be settled at the ballot box. Before voting day, the government still has room to shape the outcome."
 ZZZ_election.0.a:0 "Fund the ruling party's campaign (§Y-50§! Political Power)"
 ZZZ_election.0.b:0 "Fund the largest opposition campaign (§Y-75§! Political Power)"
 ZZZ_election.0.c:0 "Stay out of the campaign"
 ZZZ_election.2.t:0 "The Ballot Is Counted"
 ZZZ_election.2.d_majority:0 "The largest party has crossed the majority line. It will form a government on its own, and the new cabinet will take office within days."
 ZZZ_election.2.d_coalition:0 "No party secured a majority. The largest party has agreed to govern with the second-largest, and the two have signed a coalition agreement covering the next term."
 ZZZ_election.2.d_minority:0 "No party secured a majority and no coalition agreement was reached. The largest party will lead a minority government, dependent on ad hoc support in parliament."
 ZZZ_election.2.a:0 "Accept the result"
 ZZZ_election.4.t:0 "The Runoff Is Decided"
 ZZZ_election.4.d:0 "The first round produced no majority. The two leading candidates returned to the polls, and the country has now chosen between them."
 ZZZ_election.4.a:0 "Accept the runoff result"
 ZZZ_election_chain_tt:0 "Election chain marker: this window belongs to the ZZZ election template (log tag: §YZZZ_template§!). If this window does not appear, the country is running the MD generic chain (MD4_election_campaign.0, log tag: §YMD_generic§!)."
