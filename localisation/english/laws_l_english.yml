 type_of_economy: "Type of Economy"
 econ_capitalist_economy: "§YCapitalism§!"
 econ_capitalist_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_capitalism_banner\n\n\n\n\n\n§gCapitalism is an economic system in which private companies and businesses operate free from government interference. In this system, prices, costs, and wages are determined by market forces, such as supply and demand. This means there is limited government oversight and regulation. Capitalism is popular among market liberals and has become the most widely adopted economic system globally.§!"

 econ_american_capitalism: "§YAmerican Capitalism§!"
 econ_american_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_american_capitalism_banner\n\n\n\n\n\n§gThe American economic system is a model for other free-market economies. It is based on free trade and minimal government intervention in economic affairs. However, there are some unique characteristics that make this system different from other forms of capitalism.\nOne of the main features is the foundation of the American economy. The US dollar is a strong currency that is highly regarded for its stability. As a result, it is widely used as the primary reserve currency around the world.§!"

 econ_oligopolistic_capitalism: "§YOligopolistic Capitalism§!"
 econ_oligopolistic_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_oligopolistic_capitalism_banner\n\n\n\n\n\n§gLike many other countries, this nation's economy operates on the principles of a free market. However, it is characterized by a high level of market concentration, with a small number of corporations dominating the competition.\nWhat sets this economic system apart from its capitalist counterparts is the minimal involvement of the government. To an extraordinary extent, the government's regulatory and administrative functions are either limited, captured, or largely ineffective. The desires of the dominant corporations take precedence over the public interest.§!"

 econ_collective_capitalism: "§YCollective Capitalism§!"
 econ_collective_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_collective_capitalism_banner\n\n\n\n\n\n§gCollective Capitalism is a japanese model of economy which is characterized by a close relationship between businesses and the government, as well as strong partnerships between companies and their suppliers, customers, and other stakeholders. This model emphasizes long-term stability and collaboration over competition, and is based on the idea that businesses and society are interconnected and share responsibilities for each other's success.§!"

 econ_welfare_capitalism: "§YWelfare Capitalism§!"
 econ_welfare_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_welfare_capitalism_banner\n\n\n\n\n\n§gIn a welfare capitalist system, the government combines the presence of private companies and businesses with a certain level of control and involvement in the economy to ensure its proper functioning. According to its supporters, this system strikes a balance between high economic growth, low inflation and unemployment, favorable working conditions, and some level of social security.§!"

 econ_managed_economy: "§YNazi Corporatism§!"
 econ_managed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_managed_economy_banner\n\n\n\n\n\n§gNazi corporatism refers to the system that was the basis of Nazi Germany's economic model. While it is widely seen as a failure of a now-defunct regime, supporters of neo-Nazi movements still claim that it was the only true and honest economic system for the “Aryan race.”\nAll efforts are directed towards meeting the needs of the state and the highest authority - be it the great leader or the party apparatus. Every action is thoroughly scrutinized. The government's demands are seemingly endless, and its projects take precedence over all other matters.§!"

 econ_planned_economy: "§YPlanned Economy§!"
 econ_planned_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_planned_economy_banner\n\n\n\n\n\n§gA planned economy is an economic system where all economic output and growth are planned in advance to meet the needs of the population and the country as a whole. This planning can be done either centrally or decentralized, and it can be decided by a dedicated council of experts or by the people themselves in a participatory way.§!"

 econ_developed_socialism: "§YDeveloped Socialism§!"
 econ_developed_socialism_tooltip: "\n\n\n\n\n£GFX_ZZZ_developed_socialism_banner\n\n\n\n\n\n§gThe concept of Developed Socialism, once a vestige of the Brezhnev era in the Soviet Union, has been revitalized by contemporary Russian economists. In this updated perspective, a greater number of Kosygin's proposals and reforms have been implemented, resulting in a more varied economic landscape and system.\nAlthough central planning still plays a central role, private initiative is far from being abandoned. Private enterprises are given more independence in production, planning, and employee incentives. This independence allows them to make more profit, which in turn motivates them to produce more. In addition, a new wage system based on the labor participation coefficient has been introduced. This system pays employees based on how much they contribute to the company's production.§!"

 econ_military_controlled_economy: "§YMilitary-Controlled Economy§!"
 econ_military_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_military_controlled_banner\n\n\n\n\n\n§gIn a military-controlled economy, the military exercises direct oversight over the economy. The vast majority, if not all, economic activities are geared towards meeting the needs of the military. This type of economic system is prevalent in countries with a military dictatorship or a stratocracy. However, it often prioritizes the interests of the military over the well-being of the citizens. This is because regimes that employ this economic model tend to be nationalistic or even ultra-nationalistic.§!"

 econ_socialist_market: "§YSocialist Market§!"
 econ_socialist_market_tooltip: "\n\n\n\n\n£GFX_ZZZ_socialist_market_banner\n\n\n\n\n\n§gIn a socialist market economy, the government and private enterprises collaborate to build a more just society. The government owns some enterprises and oversees the economy to guarantee equity, while private companies operate and develop.\nOne of the primary objectives is to ensure that everyone has access to essential services, such as food, housing, and healthcare. Another objective is to foster innovation and entrepreneurship, while also ensuring that businesses operate in the best interests of the public.§!"

 econ_worker_controlled_economy: "§YWorker-Controlled Economy§!"
 econ_worker_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_worker_controlled_banner\n\n\n\n\n\n§gWhile it is commonly believed that planned economies are exclusively those that are controlled by the government, this is not the case for all planned economies.\nWorker-controlled economies are not governed by state officials or bureaucrats, but rather by the workers themselves, often through worker councils or unions. Through these bodies, workers often maintain direct control over their production and often enjoy a high degree of autonomy.§!"

 econ_kaiser_economy: "§YReichsbürger Economics§!"
 econ_kaiser_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_kaiser_economy_banner\n\n\n\n\n\n§gThe economic system of the new Kaiser regime is a complex web of neo-feudal practices and agrarian dominance. It sees banking as being the source of all social ills, but takes it a step further than that - explicitly blaming Jewish people for what they see as a decline in the German economy and the decline in the German countryside, urbanisation to them being driven by Jewish banking interests.\nIt aims to create a thriving rural market economy, with a focus on small businesses that can't cause much damage to the environment. While all the remaining industrial power is devoted to meeting the needs of the military and its ever-growing ranks.§!"

 econ_maga_capitalism: "§YMAGA Capitalism§!"
 econ_maga_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_maga_capitalism_banner\n\n\n\n\n\n§gMAGA Capitalism - Although it follows the basic standards of the American capitalist model, this system is much more protectionist and does not bend the knee to big corporations.\nInstead, it supports small independent businesses and producers, as well as medium-sized enterprises. It also has strong anti-trust laws to limit or eliminate excessive economic power.\nAnother key feature of this system is the strong emphasis on protecting and promoting the interests of workers. The goal is to maintain and, if possible, enhance Social Security, Medicare, and other welfare programs, while also minimizing their burden on the American economy.§!"

 econ_party_state_capitalism: "§YParty-State Capitalism§!"
 econ_party_state_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_party_state_capitalism_banner\n\n\n\n\n\n§gParty-State Capitalism is an economic model where the state is not the main driving force in the economy, but rather the party structures are placed above the state ones.\nOne of the main indicators of the expansion of the party-state system is the growing presence of party organizations within enterprises, including private companies and even foreign firms. Another key feature of this model is the expansion of state capital beyond state-owned enterprises. This process has been called "state financialization". Another way that party-state economic activity is visible is in the evolution of industrial policy.§!"

 econ_mixed_economy: "§YMixed Economic Model§!"
 econ_mixed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_mixed_economy_banner\n\n\n\n\n\n§gA mixed economy is an economic system that combines elements of both capitalism, such as private businesses, and socialism, such as nationalized government services.\nThere are different ways to define a mixed economy. For example, some say it is an economic system that combines elements of a market economy with elements of a planned economy. Others say it combines markets with state interventionism, or private enterprise with public enterprise.§!"

 econ_inclusive_capitalism: "§YInclusive Capitalism§!"
 econ_inclusive_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_inclusive_capitalism_banner\n\n\n\n\n\n§gInclusive Capitalism - is a economic theory aimed at creating a fairer and more equitable system of value distribution in the economy, as well as addressing the growing inequality in income and wealth.\nThe essence of inclusive capitalism lies in fostering sustainable growth that serves the interests of all parties involved — businesses, investors, workers, consumers, governments, local communities, society as a whole, and the environment.§!"

