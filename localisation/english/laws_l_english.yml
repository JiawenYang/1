 higher_female_desc: "\n''I did get a little carried away yesterday, but I've recovered~\n\nSorry~ I did get accepted into graduate school! I did graduate successfully~\nAnd I'll continue my PhD studies and shine in my beloved field.\n\nAs for Xiao, I think it'll be difficult for him to get accepted. Maybe he'll try to apply to schools abroad? All schools will receive my supporting documents. [Love]\nAs for Xiao, he's a law student, and he'll probably try to take the bar exam (sorry, I've already passed it). I'll continue reporting him, and I hope he'll have a successful career (but I think it'll be difficult).\n\nI don't know how to disable private comments on Bilibili, so I won't be visiting for a while.''\n- Yang Jingyuan"
