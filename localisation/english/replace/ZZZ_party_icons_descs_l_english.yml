 BEL.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 BEN.Autocracy_desc: "Autocracy: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.---- Autocracies are classic dictatorships, where a single individual wields the lion's share of political power. Autocrats oppose to any factions or policies that threaten their power. Those who see the West as the principle foreign threat to their thrones will generally align with the emerging powers."
 BOL.Nat_Populism_icon: "£generic_Nat_Populism_small"
 BOL.neutral_Social_icon: "£generic_neutral_Social_small"
 BOL.oligarchism_icon: "£generic_oligarchism_small"
 BRA.conservatism_2000_desc: "Conservatism: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and denationalization. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them. ---- Conservatism is, broadly, the support of traditional institutions and social norms. In democratic countries, this generally manifests as support for religious and nationalist values, a free market economy, and gradual, cautious reform."
 BRA.oligarchism_MDB_desc: "Oligarchy: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have an very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
 BRA.oligarchism_MDB_icon: "£generic_oligarchism_small"
