 CZE.Neutral_Muslim_Brotherhood_desc: "Moderate Islamist: - Groups and parties inspired by the Muslim Brotherhood, a transnational Sunni Islamist organization, founded in Egypt by Islamic scholar Hassan al-Banna in 1928. It has supporters throughout the Arab World and beyond with its model of political activism combined with Islamic charity work. Its goal is political Islamic governance, and to instill the Quran and the Sunnah as the sole reference point for society."
 CZE.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 CZE.Western_Autocracy_2004_desc: "Pro-Western Autocrat: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and de-nationalization of laws. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them. ---- Pro-Western autocracies are not truly in line with \"Western Values\" of democracy, pluralism, and human rights. However, they remain aligned with the West for pragmatic reasons, and often include still include some weak liberal institutions- if only to appease their western backers."
 CZE.Western_Autocracy_2004_icon: "£generic_Western_Autocracy_small"
