 CZE.liberalism_2010_desc: "Liberalism: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and denationalization. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them. ---- Liberalism is a widespread ideology with many diverse variants across the world. However, most liberals are united in support of civil liberties, free markets, and democratic government. They generally take a reformist view of politics, seeking to change and transform institutions over time."
