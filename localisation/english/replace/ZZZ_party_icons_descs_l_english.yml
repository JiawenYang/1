 GEO.Caliphate_desc: "Caliphate: - Salafism is an ultraconservative, intolerant, and fundamentalist offshoot of mainstream Sunni Islam. It has grown in prominence as the Wahabi Gulf Monarchies provided billions in funding for its teachings since the mid-20th century. Salafism has seen particularly violent incarnations in the Taliban, Al-Qaeda, and ISIS. They seek to conquer all Islamic lands and rule them through their harsh interpretation of Islamic Law. They do not recognize other forms of Islam nor minority religions, and will stop at nothing to achieve their goals.---- Jihadists seek to tear down and destroy the governments of the Islamic world, which they see as heathen and heretical. They seek to spread their version of Islam by gunpoint."
