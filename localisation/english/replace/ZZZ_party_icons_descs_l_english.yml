 GER.Nat_Fascism_alt_desc: "Fascist: - Nationalistic governments believe they have gotten the short stick of globalization, and seek a national rebirth based on protectionism, militarization, and national and ethnic sovereignty. They loathe global liberal institutions, but may remain pragmatic in their international alignments to further their narrow domestic or expansionist goals."
