l_english:

 BAN.conservatism: "£BAN_western_conservatism Jatiya Party"
 BAN.conservatism_icon: "£BAN_western_conservatism"
 BAN.conservatism_desc: "The Jatiya Party is a political party in Bangladesh, founded on 1 January 1986 by Hussain Muhammad Ershad as a civilian platform to support his military presidency. Within two years, it won two parliamentary elections, though both were widely regarded as flawed. After Ershad's removal in the 1990 mass uprising, the party was unable to regain electoral dominance but joined coalition governments on several occasions with the Awami League."
 BAN.liberalism: "£BAN_western_liberal Bangladesh Jatiya Party-BJP"
 BAN.liberalism_icon: "£BAN_western_liberal"
 BAN.liberalism_desc: "The Bangladesh Jatiya Party, simply known as BJP, is a centre-right conservative political party in Bangladesh. It is a splinter group of the original Jatiya Party, founded by the former President Hossain Mohammad Ershad. It was previously known as Jatiya Party (Naziur), after the late party chairman Naziur Rahman Manzur. Manzur was a Mukti Bahini member in the Bangladesh War of Independence of 1971 and served as the Local Government and Rural Development Minister and Mayor of Dhaka City Corporation under Ershad's regime. Manzur also served as the secretary general of the Jatiya Party between 1998 and 2001."
 BAN.communist_state: "£BAN_emerging_communism Workers Party of Bangladesh"
 BAN.communist_state_icon: "£BAN_emerging_communism"
 BAN.communist_state_desc: "The Workers Party of Bangladesh is a communist party in Bangladesh. Rashed Khan Menon is the president of the Workers Party of Bangladesh and Fazle Hossain Badsha is the general secretary of the party."
 BAN.anarchist_communism: "£BAN_anarchist_communism Jatiya Samajtantrik Dal"
 BAN.anarchist_communism_icon: "£BAN_anarchist_communism"
 BAN.anarchist_communism_desc: "The Jatiya Samajtantrik Dal is a political party in Bangladesh. The party was founded by Serajul Alam Khan. The party was dominant during the 1972–1975 Bangladesh insurgency. The current party president is Hasanul Haque Inu."
 BAN.Caliphate: "£BAN_Caliphate Bangladesh Jamaat-e-Islami"
 BAN.Caliphate_icon: "£BAN_Caliphate"
 BAN.Caliphate_desc: "Bangladesh Jamaat-e-Islami is a conservative-Islamist political party in Bangladesh. It emerged from the East Pakistani wing of the Jamaat-e-Islami Pakistan in 1979. It is the largest Islamist party in the country."
 BAN.Conservative: "£BAN_Conservative Awami League"
 BAN.Conservative_icon: "£BAN_Conservative"
 BAN.Conservative_desc: "The Bangladesh Awami League, commonly known as Awami League, is a major political party in Bangladesh. Founded on 23 June 1949 and being the oldest existing party in the country, it played a vital role in country's struggle for independence. It's one of the two traditionally dominant parties in the country, along with the Bangladesh Nationalist Party, and had maintained a sole dominance over the country's political system between 2009 and 2024, before being ousted in the July Revolution. The party's activities were banned by the post-revolution government on 10 May 2025, under the Anti-Terrorism Act."
 BAN.Nat_Populism: "£BAN_Nat_Populism Bangladesh Nationalist Party"
 BAN.Nat_Populism_icon: "£BAN_Nat_Populism"
 BAN.Nat_Populism_desc: "The Bangladesh Nationalist Party is a major political party in Bangladesh. It was founded on 1 September 1978 by President Ziaur Rahman, with a view of uniting people with a nationalist ideology. Later, the BNP emerged as one of the two traditionally dominant parties in Bangladesh, along with its rival, the Awami League."
 BHU.conservatism: "£BHU_western_conservatism Druk Phuensum Tshogpa"
 BHU.conservatism_icon: "£BHU_western_conservatism"
 BHU.anarchist_communism: "£BHU_anarchist_communism Druk Nyamrup Tshogpa"
 BHU.anarchist_communism_icon: "£BHU_anarchist_communism"
 BHU.Neutral_Libertarian: "£BHU_Neutral_Libertarian People's Democratic Party"
 BHU.Neutral_Libertarian_icon: "£BHU_Neutral_Libertarian"
 BRM.Autocracy: "£BRM_Autocracy Parti Myanmar National Justice Party"
 BRM.Autocracy_icon: "£BRM_Autocracy"
 CBD.liberalism: "£CBD_liberalism Candlelight Party"
 CBD.liberalism_icon: "£CBD_liberalism"
 CBD.liberalism_desc: "The Candlelight Party is a liberal party in Cambodia. The party was a member of the Council of Asian Liberals and Democrats, Liberal International, and the Alliance of Democrats. It is the largest opposition party in Cambodia, and the main challenger to the ruling Cambodian People's Party. The party, which would have been the only competitive opposition party to the CPP, was disqualified from running in the 2023 election by the National Election Committee despite previously being permitted to participate in the 2022 local elections. The party resumed political activity in October 2021 after having been inactive since 2012."
 CBD.conservatism: "£CBD_conservatism FUNCINPEC"
 CBD.conservatism_icon: "£CBD_conservatism"
 CBD.conservatism_desc: "The National United Front for an Independent, Neutral, Peaceful and Cooperative Cambodia, commonly referred to as FUNCINPEC, is a royalist political party in Cambodia. Founded in 1981 by Norodom Sihanouk, it began as a resistance movement against the People's Republic of Kampuchea (PRK) government. In 1982, it formed a resistance pact with the Coalition Government of Democratic Kampuchea (CGDK), together with the Khmer People's National Liberation Front (KPNLF) and the Khmer Rouge. It became a political party in 1992."
 CBD.Autocracy: "£CBD_Autocracy Cambodian People's Party"
 CBD.Autocracy_icon: "£CBD_Autocracy"
 CBD.Autocracy_desc: "The Cambodian People's Party is a Cambodian political party which has ruled the country since 1979. Founded in 1951, it was originally known as the Kampuchean People's Revolutionary Party (KPRP)."
 CBD.Neutral_Libertarian: "£CBD_Neutral_Libertarian Cambodian National Sustaining Party"
 CBD.Neutral_Libertarian_icon: "£CBD_Neutral_Libertarian"
 CBD.Neutral_Libertarian_desc: "The Cambodian National Sustaining Party was created by its president Pen Sovan. Formed on 21 January 1998, and holding its first party congress on the same day."
 CHI.Conservative: "£generic_Conservative_small Chinese Peasants' and Workers' Democratic Party"
 CHI.Conservative_desc: "The Chinese Peasants' and Workers' Democratic Party (CPWDP) is one of the eight minor democratic parties in the People's Republic of China under the direction of the Chinese Communist Party.The party was officially founded in the Shanghai French Concession on 9 August 1930 by left-wing members of the Kuomintang. It is mainly made up of members who mostly work in the fields of public health, medicine, and associated fields in science and technology. It is the fifth-ranking minor party in China."
 CHI.Neutral_conservatism: "£CHI_non_aligned_conservative China Zhi Gong Party"
 CHI.Neutral_conservatism_icon: "£CHI_non_aligned_conservative"
 CHI.Neutral_conservatism_desc: "The China Zhi Gong Party (CZG) is the sixth-largest democratic party in the People's Republic of China. Currently, its members mainly consist of returned overseas Chinese, their families, and representative figures with overseas connections. Founded in 1925, the CZG's early members were largely from overseas Hongmen Triad societies. Its predecessor was an overseas organization initiated by the “American Hongmen Zhi Gong Tang”, a Chinese community group aimed at protecting the legitimate rights and interests of overseas Chinese. In its practical work, the CZG also assumes the responsibilities of the Hongmen China branch, handling meetings with overseas Hongmen delegations and members, and conducting visits to overseas Hongmen organizations."
 CHI.oligarchism: "£generic_oligarchism_small China National Democratic Construction Association"
 CHI.oligarchism_desc: "The China National Democratic Construction Association (CNDCA), is the third-largest democratic party in the People's Republic of China. Founded on December 16, 1945, as the Democratic National Construction Association, it was renamed the China Democratic National Construction Association by resolution at its second enlarged general meeting in July 1952. It is a political party primarily composed of people from the economic sector, characterized by its political alliance nature. It is a participating party in the Chinese socialist system, accepting the leadership of the Communist Party of China and cooperating closely with it. Early CDNCA members were mostly senior figures in the cultural and educational fields and national industrialists and businessmen. Currently, its members mainly come from large and medium-sized cities, including business entrepreneurs and mid-to-high-level economic figures. Rong Yiren is the only Vice President of the People's Republic of China from the party, and the second member of a democratic party to hold this position after Soong Ching-ling."
 CHI.Neutral_Libertarian: "£CHI_Neutral_Libertarian_small Jiusan Society"
 CHI.Neutral_Libertarian_icon: "£CHI_Neutral_Libertarian_small"
 CHI.Neutral_Libertarian_desc: "The Jiusan Society is the seventh-ranked democratic party in the People's Republic of China. Its constitution states that it is a political party with characteristics of a political alliance, primarily composed of senior and mid-level intellectuals in the science and technology field. It is a close ally of the Communist Party of China, accepting its leadership and cooperating closely with it, and is a participating party in the Chinese socialist system. Its early members were mostly academics. Currently, its members are primarily senior and mid-level intellectuals in the science and technology field."
 LAO.communist_state: "£LAO_emerging_communism Lao People's Revolutionary Party"
 LAO.communist_state_icon: "£LAO_emerging_communism"
 LAO.communist_state_desc: "The Lao People's Revolutionary Party is the founding and sole ruling party of the Lao People's Democratic Republic. The party's monopoly on state power is guaranteed by Article 3 of the Constitution of Laos, and it maintains a unitary state with centralised control over the economy and military."
 NEP.communist_state: "£Communist_Party_of_Nepal Communist Party of Nepal (Maoist Centre)"
 NEP.communist_state_desc: ""
 NEP.Neutral_Communism: "£Communist_Party_of_Nepal_not_hardline Communist Party of Nepal (Unified Marxist–Leninist)"
 NEP.Neutral_Communism_desc: ""
 PAK.conservatism: "£PAK_western_conservatism Pakistan Muslim League (F)"
 PAK.conservatism_icon: "£PAK_western_conservatism"
 PAK.conservatism_desc: "The Pakistan Muslim League (Functional) is a nationalist and pro-Hurs clan political party in Pakistan. It is one of the breakaway groups of Pakistan Muslim League. The letter 'F' in its name stands for functional. It is primarily associated with the Sindhi religious leader Pir Pagaro."
 PAK.liberalism: "£PAK_liberalism Muttahida Qaumi Movement"
 PAK.liberalism_icon: "£PAK_liberalism"
 PAK.liberalism_desc: "Muttahida Qaumi Movement is a Pakistani political party with a liberal political position and a Muhajir nationalist ideology. The leader of the party is Khalid Maqbool Siddiqui. The party's symbol is the kite. It is mostly active in Karachi where the majority of Muhajirs currently reside. The party aims to represent the human rights of Muhajirs in Pakistan through peaceful and democratic struggle. The Party is a splinter faction of MQM-L."
 PAK.socialism: "£PAK_socialism Pakistan People's Party"
 PAK.socialism_icon: "£PAK_socialism"
 PAK.socialism_desc: "The Pakistan Peoples Party is a Pakistani political party with a centre-left to leftist political position and a democratic socialist ideology. It is one of the three major mainstream political parties alongside the Pakistan Muslim League (N) and the Pakistan Tehreek-e-Insaf."
 PAK.communist_state: "£PAK_Communist_State Communist Party of Pakistan"
 PAK.communist_state_icon: "£PAK_Communist_State"
 PAK.communist_state_desc: "The Communist Party of Pakistan was founded in Calcutta, India, soon after the establishment of Pakistan on 6 March 1948. A decision was taken at the 2nd Congress of the Communist Party of India, which was held in Calcutta at that time, that a separate communist party ought to be created in the new state of Pakistan. It was thought that Pakistan, being a relatively nascent country and suffering from instability, was ripe for revolution. The delegates from Pakistan separated themselves and held a separate session where they constituted the CPP. Sajjad Zaheer, founder of the All-India Progressive Writers Association, from West Pakistan, was elected general-secretary. The delegates from East Pakistan elected an East Pakistan Provincial Committee. Many Muslim leaders of the CPI were sent to Pakistan to help with the formation of the party. The CPP adopted a Leninist ideology, aiming to instigate a communist revolution through a core group of intellectuals and laborers, a strategy inspired by Vladimir Lenin's approach in the 1917 Russian Revolution."
 PAK.Conservative: "£PAK_Conservative Pakistan Muslim League (N)"
 PAK.Conservative_icon: "£PAK_Conservative"
 PAK.Conservative_desc: "The Pakistan Muslim League (Nawaz) is a centre-right and a conservative political party. It is one of the three major mainstream political parties alongside the Pakistan Peoples Party and the Pakistan Tehreek-e-Insaf."
 PAK.anarchist_communism: "£PAK_anarchist_communism Awami National Party"
 PAK.anarchist_communism_icon: "£PAK_anarchist_communism"
 PAK.anarchist_communism_desc: "The Awami National Party is a Pakistani political party, primarily based in Khyber Pakhtunkhwa. It has a leftist political position with a Pashtun nationalist and federalist ideology. The party was founded by Abdul Wali Khan in 1986 and its current president is Aimal Wali Khan, great-grandson of Bacha Khan, with Mian Iftikhar Hussain serving as the secretary-general."
 PAK.Nat_Autocracy: "£PAK_Nat_Autocracy Pākistān Muslim Līg (Q)"
 PAK.Nat_Autocracy_icon: "£PAK_Nat_Autocracy"
 PAK.Nat_Autocracy_desc: "The Pakistan Muslim League (Q) is a Pakistani political party with a centre-right political position and a moderate conservative ideology."
 PAK.Nat_Fascism: "£PAK_Nat_Fascism Jamiat Ulema-e-Islam (F)"
 PAK.Nat_Fascism_icon: "£PAK_Nat_Fascism"
 PAK.Nat_Fascism_desc: "Jamiat Ulema-e-Islam Pakistan is a Pakistani political party with a far-right political position and an Islamic fundamentalist ideology. Established as the Jamiat Ulema-e-Islam in 1945, it is the result of a factional split in 1988 with 'F' standing for the name of its leader, Maulana Fazl-ur-Rehman."
 PAK.Nat_Populism: "£PAK_Nat_Populism Pakistan Tehreek-e-Insaf"
 PAK.Nat_Populism_icon: "£PAK_Nat_Populism"
 PAK.Nat_Populism_desc: "The Pakistan Tehreek-e-Insaf is a political party in Pakistan established in 1996 by cricketer and politician Imran Khan. The PTI ranks among the three major Pakistani political parties alongside the Pakistan Muslim League–Nawaz and the Pakistan People's Party."
 TAI.conservatism_desc: "Three Principles of the People - The Chinese Kuomintang (KMT) was founded in 1894 by Dr. Sun Yat-sen. Its predecessors were the Xingzhonghui, the Tongmenghui, the Kuomintang, and the Chinese Revolutionary Party. In 1912, the Tongmenghui united with four small parties to reorganize into the Kuomintang. In 1919, it was officially called the Chinese Kuomintang."
 TAI.Conservative_desc: "The New Party was founded on August 10, 1993. Its predecessor was the New Kuomintang Alliance, an internal group of the Kuomintang. Zhao Shaokang was the first leader. When the New Party was founded, its core concept was to oppose the Communist Party and Taiwan independence, and to uphold the ideas of Sun Yat-sen."
 TAI.Neutral_conservatism_desc: "The People First Party is the 90th political party established in the Republic of China. The party was founded on March 31, 2000. Its predecessor was the New Taiwanese Service Team established by James Soong and Chang Chiu-hsiung during the 2000 presidential election of the Republic of China. Before the 2000 presidential election of the Republic of China, James Soong was expelled from the Kuomintang, so the People First Party was established after the election. James Soong is the main leader of the party. Because the main color of the party is orange, it is generally called the “Orange Camp” by the outside world."
 TAI.Nat_Populism_desc: "The Chinese Youth Party, or Youth Party for short, is a political party in the Republic of China. It was founded in 1923 in the Republic Hall of Cité des Roses, a suburb of Paris, France, by overseas students with a nationalist ideology, such as Zeng Qi, Li Huang, and Hu Guowei. The Youth Party was the third largest political party in modern Chinese history, second only to the Kuomintang and the Communist Party of China. It participated in the government's constitution-making work and moved to Taiwan with the Republic of China government in 1949."
 TAI.Nat_Fascism: "£TAI_Nat_Fascism Chinese Unification Promotion Party (CUPP)"
 TAI.Nat_Fascism_desc: "The Chinese Unification Promotion Party (CUPP), also known as the Unionist Party, is a minor far-right political party in Taiwan that promotes Chinese unification."
 TNZ.anarchist_communism: "£TNZ_anarchist_communism Chama Cha Mapinduzi"
 TNZ.anarchist_communism_icon: "£TNZ_anarchist_communism"
 TNZ.neutral_Social: "£generic_neutral_Social_small Tanzania Labour Party"
 VIE.communist_state: "£VIE_emerging_communism Communist Party of Vietnam"
 VIE.communist_state_icon: "£VIE_emerging_communism"
 VIE.communist_state_desc: "The Communist Party of Vietnam (CPV) is the sole legal party of Vietnam. Founded in 1930 by Ho Chi Minh, the CPV became the ruling party of North Vietnam in 1954 after the First Indochina War and all of Vietnam in 1975 after the Vietnam War. Although it nominally exists alongside the Vietnamese Fatherland Front, it maintains a unitary government and has centralized control over the state, military, and media. The supremacy of the CPV is guaranteed by Article 4 of the national constitution. The Vietnamese public generally refer to the CPV as simply “the Party” or “our Party”."
