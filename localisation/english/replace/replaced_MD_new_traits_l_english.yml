#Resolution Display
one_china_category_desc: "The Chinese Civil War ended with two alternative governments claiming to lead the entire Chinese nation, the People's Republic of China, based in Beijing, and the Republic of China, based in Taipei. In 1992, the two sides put the issue aside and reached the "1992 Consensus," recognizing that there is only one China, but disagreeing on who is China's legitimate ruler. \n\nIn Taiwan, the relative support for the pro-unification §CPan-Blue camp§! and the pro-independence §GPan-Green camp§! is roughly equivalent to the support for "for unification" and "against unification." \n\n§CSupport rate of the Pan-Blue camp§!\n$TAI.conservatism$: §Y[?TAI.party_pop_array^1|%1]§!\n$TAI.Conservative$: §Y[?TAI.party_pop_array^6|%1]§!\n$TAI.Neutral_conservatism$: §Y[?TAI.party_pop_array^14|%1]§!\n\nTotal support rate: §Y[?TAI.pan_blue_coalition_support|%1]§!\n\n§GSupport rate of the Pan-Green camp§!\n$TAI.liberalism$: §Y[?TAI.party_pop_array^2|%1]§!\n$TAI.neutral_Social$: §Y[?TAI.party_pop_array^18|%1]§!\n\nTotal support rate: §Y[?TAI.pan_green_coalition_support|%1]§!\n\n\nIn addition, there are some political parties that are difficult to develop locally but support unification:\n\nIn §7Emergingism§!:\n$TAI.communist_state$: §Y[?TAI.party_pop_array^4|%1]§!\n$TAI.anarchist_communism$: §Y[?TAI.party_pop_array^5|%1]§!\n\nIn §gNon-alignedism§!:\n$generic.Neutral_Communism$: §Y[?TAI.party_pop_array^19|%1]§!"

