tech_CHI_ultra_high_voltage_transmission: "Ultra-High Voltage Transmission"
tech_CHI_ultra_high_voltage_transmission_desc: "Ultra-high voltage transmission refers to 1000 kV AC and ±800 kV DC power transmission projects and technologies, which can effectively reduce energy losses during transmission."
tech_CHI_giant_construction_machinery: "Giant Construction Machinery"
tech_CHI_giant_construction_machinery_desc: "Specialized equipment used specifically for large-scale construction projects, allowing human creativity to be unconstrained."
tech_CHI_advanced_automated_terminal: "Automated Terminal"
tech_CHI_advanced_automated_terminal_desc: "Highly efficient terminals requiring only a small number of operators for maintenance ensure the convenient and efficient flow of materials."
tech_CHI_hypersonic_wind_tunnel: "Hypersonic Wind Tunnel"
tech_CHI_hypersonic_wind_tunnel_desc: "A hypersonic wind tunnel is one in which the test section has a Mach number range of approximately 5 to 14, and the airflow temperature is high enough to prevent liquefaction in the test section when the airflow isentropically expands to these Mach numbers. However, there are no wind tunnels with temperatures high enough to produce real gas effects."
tech_CHI_commercial_quantum_computer: "Commercial quantum computer"
tech_CHI_commercial_quantum_computer_desc: "The first generation of commercial computers based on quantum theory far exceeds the performance of computers with traditional architectures and holds unlimited possibilities."
tech_CHI_advanced_3D_printing: "Integrated 3D Printing"
tech_CHI_advanced_3D_printing_desc: "Integrated casting, forging, and milling metal 3D printing can significantly shorten 3D printing time, reduce energy consumption, and reduce material loss. The strength of parts produced by this method is superior to that of similar products produced using traditional processes."
tech_CHI_artificially_synthesized_starch: "Ton-scale artificially synthesized starch"
tech_CHI_artificially_synthesized_starch_desc: "This technology uses only chemical means to synthesize starch from water and carbon dioxide, consuming electricity. It does not rely on photosynthesis and could revolutionize agricultural technology."

