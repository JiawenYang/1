SARS_COV_2019_category: "New Coronavirus"
SARS_COV_2019_category_desc: " \n\n\n\n\n\n\n£MAIN_desctext_SARSCov2019\n\n\n\n\n\n\n\n\n The novel coronavirus (2019-nCoV or SARS-CoV-2) is a new strain of coronavirus that has never been found in humans before. Common signs of coronavirus infection in people include respiratory symptoms, fever, cough, shortness of breath and difficulty breathing. In more severe cases, infection can lead to pneumonia, severe acute respiratory syndrome, kidney failure, and even death. There is no specific treatment for the disease caused by the novel coronavirus. \n\nThe raging novel coronavirus epidemic not only endangers the lives and health of people in various countries, but also has a serious impact on the world economy. Economic globalization has encountered headwinds, unilateralism and protectionism have risen, and contradictions such as fairness and efficiency, growth and distribution, technology and employment have become more prominent. The gap between the rich and the poor is still widespread, and the global extreme poverty rate will rise for the first time in 20 years. \n\nAny area infected with the novel coronavirus will decide whether to spread to surrounding areas every week based on the local §R$transmit_coefficient_add$§!. §R$state_extra_population_m ult$§! is related to §R$transmit_coefficient_add$§!, §Ylocal population§! and §Ytransmission coefficient§!. When §R$transmit_coefficient_add$§!§Y is less than or equal to 0§!, the virus infection may §Gstop§!. \nIn order to combat the impact of the virus, we will have a series of §Yanti-epidemic measures§!, but these measures are often a double-edged sword, and we must make a balanced choice between §Yeconomy§! and §Ylife§!. \n\nStatistics: \nTotal deaths: [?ROOT.SARS_COV_2019_died_number|3]K \nDeaths last week: [?ROOT.SARS_COV_2019_died_number_weekly|3]K\nTotal number of provinces infected last week: [?ROOT.SARS_COV_2019_transmit_coefficient_number|0]\nAcceptable number of deaths: [?ROOT.SARS_COV_2019_died_endurance|3]K"

SARS_COV_2019_category_clinical_guidelines: "Publish §YClinical Guidelines§!"
SARS_COV_2019_category_clinical_guidelines_desc: "It is necessary to update the latest standard treatment protocols to each medical institution in a timely manner."
