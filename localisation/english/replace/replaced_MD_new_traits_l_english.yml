cnsa.101.d:0 ""Queqiao" is the relay satellite of the Chang'e-4 lunar probe. It is China's first and the world's first dedicated relay communications satellite outside Earth orbit."
cnsa.101.a:0 "Great"
cnsa.102.t:0 "Chang'e 4 probe launched successfully"
cnsa.102.d:0 "The Long March 3B rocket carrying the Chang'e 4 probe was launched into space early this morning. The probe is expected to make the first soft landing on the far side of the moon in human history. The Chang'e 4 probe is part of China's ambitious lunar program. Since the far side of the moon has no radio wave interference from the earth, it is regarded as an excellent place for astronomical observation. In addition, it is expected to explore the minerals and landforms on the far side of the moon."
cnsa.102.a:0 "Great"
cnsa.103.t:0 "Chang'e 5 probe launched successfully"
cnsa.103.d:0 "At 4:30 Beijing time today, China successfully launched the Chang'e-5 probe with the Long March 5 Yao-5 carrier rocket at the Wenchang Space Launch Center in Hainan. This launch mission will attempt to bring lunar rock samples back to Earth. If all goes well, the spacecraft will return to Earth in half a month. China's official Xinhua News Agency said that the scientific goals of Chang'e-5 are mainly to conduct morphological detection and geological background surveys of the landing area, obtain on-site analysis data related to lunar samples, and establish a connection between on-site detection data and laboratory analysis data; conduct systematic and long-term laboratory research on lunar samples, analyze lunar soil structure, physical properties, and material composition, and deepen research on the origin and evolution history of the moon."
cnsa.103.a:0 "Feats"
cnsa.104.t:0 "Chang'e 6 probe launched successfully"
cnsa.104.d:0 "At 4:30 am Beijing time today, China successfully launched the Chang'e-6 probe using the Long March 5 carrier rocket at the Wenchang Space Launch Center in Hainan. Chang'e-6, carrying scientific research equipment from multiple international partners, will make a soft landing in the South Pole of the Moon and return samples, marking the end of China's three-step lunar exploration plan."
cnsa.104.a:0 "Great"
cnsa.105.t:0 "Construction of China's Tiangong space station begins"
cnsa.105.d:0 "Today, accompanied by a huge roar, the Long March 5B carrier rocket carrying China's completely independently developed Tiangong space station core module rushed into space. It will dock with the Wentian and Mengtian experimental modules to be launched next, and combine in space to form the basic model of China's Tiangong space station. After the completion of the Tiangong space station, it will dock with multiple Tianzhou cargo spacecraft and Shenzhou manned spacecraft to complete a long-term and continuous permanent mission."
cnsa.105.a:0 "I will form the head"
cnsa.106.t:0 "Wentian Experimental Chamber"
cnsa.106.d:0 "Wentian Experimental Module, control and experimental application module, mainly used for research, with a small robotic arm installed outside the module."
cnsa.106.a:0 "I will form the legs"
cnsa.107.t:0 "Mengtian Experimental Chamber"
cnsa.107.d:0 "Mengtian Experimental Chamber, a professional application chamber, equipped with an experimental payload airlock that can drop large payloads into a vacuum."
cnsa.107.a:0 "I will form the legs"
cnsa.108.t:0 "China's space station completed and put into use"
cnsa.108.d:0 "Today, as the Tiangong's large robotic arm installed the Xuntian optical module into place, the China Manned Spaceflight Office officially announced the completion of China's Tiangong space station. The completion of the space station marks that China has the ability to stay in outer space orbit for a long time and conduct scientific experiments. Next, the space station will dock with the new Shenzhou manned spacecraft and Tianzhou cargo spacecraft to complete the permanent mission. In the future, each group of astronauts will take turns to stay for 6 months. \n\nAfter the basic configuration of the Tiangong space station is successfully established, three cabins can be added to the front of the core cabin to form a "cross" expansion configuration of the space station according to demand. The three expansion cabins A, B, and C are located at the front of the core cabin, forming a small "T" shape. The rear end of the expansion cabin A docks with the front end of the core cabin, and the expansion cabins B and C dock with the left and right of the front end of the expansion cabin A. The manned spacecraft docks at the front end of the expansion cabin A. A second manned spacecraft can be added according to demand for emergency return use, docking below the front end of the core cabin. The number of long-term astronauts is increased to 3~6 people, and the maximum scale can reach 180 tons. "
cnsa.108.a:0 "Our journey is to the sea of stars"
cnsa.109.t:0 "Wangshu Project"
cnsa.109.d:0 "After discussion and resolution by the Central Committee, my country's manned lunar landing program was officially named "Wangshu Program". "Wangshu Chariot" is the design of the manned lunar rover of this program, which was developed by Tsinghua University. The name was inspired by Wangshu, the moon goddess in ancient Chinese legend, and also incorporates key elements of the bronze chariot and horses in the Qin Shihuang Mausoleum. Starting from engineering technology and combining humanistic ideas, the design team finally formed a lunar rover design featuring large-scale wheels and a circular dome canopy. This plan not only meets the size and weight restrictions of the lunar rover riding on the lunar lander to the lunar surface, but also takes into account the problem of limited wrist and finger movement of astronauts wearing lunar spacesuits, and designs a joystick that can decouple forward, backward, steering and braking actions."
cnsa.109.a:0 "Wangshu is in front to lead the way, and Feilian is behind to lead the way"
cnsa.111.t:0 "Wangshu II Launch"
cnsa.111.d:0 "Today, the Wangshu II rocket was successfully launched, carrying three well-tested Communist astronauts and the Wangshu Chariot manned lunar rover. Soon they will be able to successfully land on the moon, and my country will become the second country after the United States to land on the moon."
cnsa.111.a:0 "Getting off the bus is like yesterday, Wangshu is four or five round"
cnsa.112.t:0 "For the first time, the Chinese left their footprints on the moon"
cnsa.112.d:0 "Today, Wangshu's Chariot successfully landed on the moon, and three astronauts took their first steps on the moon, which was also China's first step on the moon.\n\nWe deliberately chose the same landing site as the American astronauts in the last century, but the astronauts did not find the footprints of the well-known American astronauts."
cnsa.112.a:0 "Forget the Yankees, let's look at our footprints"
cnsa.113.t:0 "Heroes Return"
cnsa.113.d:0 "Today, the re-entry capsule carrying three astronauts landed successfully, but it hit an undiscovered rock and rolled when it landed. Fortunately, the three astronauts were unharmed."
cnsa.113.a:0 "This is a must in history books"
cnsa.120.t:0 "Tianwen-1 Mars probe launched successfully"
cnsa.120.d:0 "Today, my country successfully launched the Tianwen-1 probe, the first Mars exploration mission, at the Wenchang Space Launch Center on the northeast coast of Hainan Island using a Long March 5 Y4 carrier rocket. The rocket successfully sent the probe into the planned orbit.\n\nAccording to the plan, the probe will fly in the vicinity of Mars for about 7 months in the Earth-Mars transfer orbit, complete Mars capture by "braking", enter the Mars orbit, and carry out landing, patrol and other tasks at an appropriate time to conduct scientific exploration of Mars."
cnsa.120.a:0 "Go Go Go"
cnsa.121.t:0 "Arrival on Mars"
cnsa.121.d:0 "Tianwen-1 has arrived at Mars and successfully entered Mars orbit. Next, the rover on the lander will continuously provide us with new data."
cnsa.121.a:0 "Writing a New Chapter"
cnsa.122.t:0 "Tianwen-2 Mars probe launched successfully"
cnsa.122.d:0 "Today, my country successfully launched the Tianwen-1 probe, the first Mars exploration mission, at the Wenchang Space Launch Center on the northeast coast of Hainan Island with a Long March 6 Yao-5 carrier rocket. The rocket successfully sent the probe into the predetermined orbit.\n\nAccording to the plan, Tianwen-2 is an asteroid exploration mission, and its main goal is to fly with and return samples of a near-Earth asteroid. The main task is to fly with and return samples of the near-Earth asteroid 2016HO3."
cnsa.122.a:0 "Take more photos"
cnsa.123.t:0 "Arrival on Mars"
cnsa.123.d:0 "Today, Tianwen-2 has arrived at Mars and successfully entered the Martian orbit. Next, the rover on the lander will continuously provide us with new data."
cnsa.123.a:0 "Can potatoes be grown there?"
cnsa.124.t:0 "The first artifact to return from Mars!"
cnsa.124.d:0 "Today, Tianwen-2 successfully returned to Earth. However, when passing through the atmosphere, a hole was broken in its surface protective layer, and many internal components melted. Fortunately, the samples taken were not damaged. We successfully received the first man-made object returned from Mars in human history!"
cnsa.124.a:0 "Take the Martian soil and grow potatoes!"

##event##
chinapro.101.t:0 "Wenchuan Earthquake"
chinapro.101.d:0 "The Wenchuan earthquake occurred at 14:28:04 Beijing time on May 12, 2008 (Monday). The epicenter was located near Yingxiu Town, Wenchuan County, Aba Tibetan and Qiang Autonomous Prefecture, Sichuan Province, China, 79 kilometers northwest of Chengdu, the capital of Sichuan Province. According to the data of the China Earthquake Administration, the surface wave magnitude of this earthquake reached 8.2 and the moment magnitude reached 8.3, and the area of damage exceeded 100,000 square kilometers. The earthquake intensity may reach 11 degrees. The seismic waves of this earthquake traveled around the earth six times, and the earthquake affected most of the The earthquake was felt in China and many countries and regions in Asia. It was felt from Liaoning in the north to Shanghai in the east, from Hong Kong, Guangdong, Macau, Thailand, Vietnam in the south, and from Pakistan in the west. \n\nAs of September 25, 2008, the earthquake caused 69,227 deaths, 17,923 missing, 374,643 injured to varying degrees, 19.9303 million people lost their homes, and the total number of people affected reached 46.256 million. This is the most destructive earthquake since the founding of New China, and the earthquake with the most casualties after the Tangshan earthquake. "
chinapro.101.a:0 "Mobilize all forces for disaster relief!"
chinapro.101.b:0 "It's really scary"
china_news.30.t:0 "XXIX Olympiad"
china_news.30.d:0 "The XXIX Olympiad was held from August 8 to 24, 2008 in Beijing, the capital of the People's Republic of China. This was the first Summer Olympics held in China and the third Olympic Games held in a socialist country, following the 1980 Moscow Olympics and the 1984 Sarajevo Winter Olympics.\nThis Olympics produced 43 new world records and 132 new Olympic records, and 87 countries were on the medal table. The host country, the People's Republic of China, topped the gold medal table with 51 gold medals, becoming the first Asian country in Olympic history to top the gold medal table, strengthening China's position as a sports power.\nThe United States won 112 medals, becoming the country with the most medals in this Olympics. This Olympics gave birth to two "flying men" in water and land respectively - American athlete Michael Phelps and Jamaican athlete Usain Bolt, who achieved world-renowned achievements. The former won eight gold medals in a row in the "Water Cube", becoming the athlete with the most gold medals in the same Olympics."
china_news.30.a:0 "Well done"
china_news.30.b:0 "One World, One Dream"
chinapro.103.t:0 "South Korea deploys THAAD anti-missile system"
chinapro.103.d:0 "[?global.date.GetDateStringNoHour], the Republic of Korea has begun deploying the THAAD anti-missile system in the country with the assistance of the United States. The deployment of the THAAD system was announced to begin negotiations early last year, and was officially announced later last year. The incident has caused international controversy. South Korea claims that the military deployment is only a defensive measure to deal with the missile threat from the Democratic People's Republic of Korea, while the People's Republic of China believes that the deployment of the THAAD system will affect its national security and has taken a number of countermeasures against South Korea. The incident also affects the strategic balance in the Pacific region."
chinapro.103.a:0 "Interesting..."
chinapro.103.b:0 "Koreans will pay the price for this"
chinapro.103.c:0 "We must protect ourselves"
chinapro.104.t:0 "Countermeasures against THAAD"
chinapro.104.d:0 "South Korea's willful decision to deploy THAAD will expose nearly half of our territory to American radar surveillance. We must take countermeasures."
chinapro.104.a:0 "This is intolerable, what else can we not tolerate?"
chinapro.104.b:0 "We must maintain our relationship with South Korea"
chinapro.106.t:0 "70th Anniversary of the Founding of the People's Republic of China National Day Military Parade"
chinapro.106.d:0 "On October 1, 2019, China held a grand military parade in Beijing to celebrate the 70th anniversary of the founding of the People's Republic of China. The parade included about 15,000 officers and soldiers from the People's Liberation Army, the Armed Police Force and the Militia Reserve, 580 pieces of equipment, 15 marching columns and 32 equipment columns; more than 160 fighter planes from the Army, Navy and Air Force formed 12 air echelons.\nThe military parade to celebrate the 70th anniversary of the founding of the People's Republic of China is the first National Day military parade since the new era of socialism with Chinese characteristics, demonstrating the Chinese nation's ambition to move from standing up and getting rich to becoming strong. The People's Army accepted the review of Chairman [CHI.GetLeader] and the Party and the People with a new look after reform and reshaping, demonstrating its firm determination to safeguard the core and obey the command, and showing its strong strength to fulfill the mission and tasks of the new era."
chinapro.106.a:0 "Mighty and majestic"
chinapro.107.t:0 "Eastern Star tourist ship capsized!"
chinapro.107.d:0 "At 21:30 on June 1, 2015, the Oriental Star, which belongs to Chongqing Oriental Shipping Company, encountered rare severe convective weather on its way from Nanjing to Chongqing and capsized in the Damazhou waterway of the Yangtze River in Jianli County, Jingzhou City, Hubei Province. After the shipwreck, the transportation department, the People's Liberation Army, the armed police force and public security officers, and the provinces and cities along the river mobilized a large number of professional search and rescue personnel, the People's Liberation Army, the armed police and firefighters, as well as the people along the river, and adopted a combination of aerial patrols, surface search and rescue, underwater search and rescue, cabin search and rescue, and whole-basin search and rescue to search and rescue at the scene. and downstream waters to conduct an all-round, three-dimensional, dragnet search. \nAs of June 13, 2015, after repeated verification and confirmation by relevant parties, there were 454 people on the "Eastern Star" passenger ship, of which 12 were successfully rescued and 442 died. The bodies of all the victims have been found, and the search and rescue work has ended since then. \n\nThe State Council Investigation Team determined that the capsizing of the "Eastern Star" passenger ship was a particularly serious catastrophic event caused by a sudden and rare severe convective weather (squall line accompanied by downburst) caused by strong winds and rainstorms. "
chinapro.107.a:0 "Do your best to rescue!"
newspro.101.t:0 "Shooting in Las Vegas"
newspro.101.d:0 "On the evening of October 1, 2017, a horrific shooting occurred in Las Vegas, USA. At that time, more than 22,000 people were attending an open-air music festival. Suddenly, the festival was interrupted by gunfire. The suspect used multiple modified guns to shoot at the crowd listening to the concert from the 32nd floor window of the Mandalay Bay Hotel, killing 60 people and injuring more than 500 people. The gunman shot himself after a brief exchange of fire with the police. US President Trump expressed shock at the incident. He issued a speech on Monday calling the bloody incident an "evil act." Trump called on Americans to unite in this tragic and terrifying moment."
newspro.101.a:0 "Shocked"
newspro.101.b:0 "An Act of Pure Evil"
newspro.102.t:0 "Russian World Cup"
newspro.102.d:0 "The 2018 Russia World Cup is the 21st FIFA World Cup, held in 12 stadiums in 11 cities in Russia from June 14 to July 15, 2018. This is the first time the World Cup is held in Russia, and also the first time the World Cup is held in an Eastern European country. On July 16, 2018, France defeated Croatia 4-2 in the final of the tournament, winning the World Cup again after 20 years, while Croatia also achieved its best result in the team's history in this World Cup. Croatian midfielder Luka Modric, England center forward Harry Kane, and Belgian goalkeeper Thibaut Courtois won the Golden Ball, Golden Boot, and Golden Glove awards respectively; French forward Kylian Mbappe won the Best Newcomer Award."
newspro.102.a:0 "The World Cup is over"
newspro.102.b:0 "We let the world see our best side"
newspro.103.t:0 "Notre Dame Fire"
newspro.103.d:0 "A fire broke out at Notre Dame Cathedral in Paris, France, at around 6:50 p.m. local time on April 15, 2019, and the entire building was severely damaged. The fire was located in the top tower of Notre Dame Cathedral, and the fire quickly engulfed the spire of the tower of Notre Dame Cathedral, and the spire fell down as if it was broken in half. Near Notre Dame Cathedral, hundreds of people knelt on the ground to pray, some were sobbing, and some had tears in their eyes. Parisian citizen Nicolas said: "Today is a sad day for all Parisians. We pray that the fire in Notre Dame Cathedral will be extinguished as soon as possible. ""
newspro.103.a:0 "Oh my god!"
newspro.104.d:0 "[?global.date.GetDateStringNoHour], the global capital market staged a "Black Monday". European and American stock markets were in the red. Only four minutes after the U.S. stock market opened, the S&P 500 index quickly fell below 7%. This was the third circuit breaker in the U.S. stock market in two weeks and the fourth circuit breaker in history.\n"The stock god" Warren Buffett said in an interview with foreign media about the recent financial market that these circuit breakers were as scary as the "Black Monday" in October 1987."
newspro.104.a:0 "Oh my God!"
newspro.105.t:0 "Black Myth Wukong"
newspro.105.d:0 "China's first 3A game masterpiece "Black Myth: Wukong" was born, and on the day of its release, it caused a huge sensation worldwide.\nAs of [?global.date.GetDateStringNoHour], according to market research agency VG According to the latest data from Insights, Black Myth: Wukong has sold 20.9 million copies on Steam, with total revenue exceeding 1 billion. \nThis game once broke many historical records of Chinese games, such as the highest number of online users, the fastest sales speed, etc., and is hailed as a milestone work of Chinese domestic games. "
newspro.105.a:0 "Interesting..."
newspro.105.b:0 "Give the world a little Chinese shock"
newspro.106.t:0 "California wildfires"
newspro.106.d:0 "[?global.date.GetDateStringNoHour], Southern California experienced a strong dry storm - the "Santa Ana wind". The strong winds caused many wildfires. Among them, the wildfires in the Pacific Palisades area near Los Angeles, California were the most serious. \nThis wildfire has killed at least 28 people, and the damage and economic losses will reach 250 billion to 275 billion US dollars. The victims of the disaster said that the scene of the wildfire raging was like the end of the world. "
newspro.106.a:0 "The force of nature..."
newspro.107.t:0 "Sri Lanka terrorist attack"
newspro.107.d:0 "[?global.date.GetDateStringNoHour], bomb attacks occurred in six places in Sri Lanka, including three five-star hotels in the capital Colombo, two churches and a church in the eastern city of Batticaloa. When the explosion occurred, Easter celebrations were being held in the church. The terrorist attack has so far killed 253 people.\nThe Prime Minister of Sri Lanka condemned the bombings as a "cowardly" act and said, "I call on all Sri Lankans to remain united and strong in this tragic moment. The government is taking immediate measures to control the situation." "
newspro.107.a:0 "Terrorism spreads..."
newspro.108.t:0 "DeepSeek AI"
newspro.108.d:0 "[?global.date.GetDateStringNoHour], an open source AI model called DeepSeek-R1 was launched by a Chinese startup. The training cost is much lower than similar AI models, and its functions are even slightly better than ChatGPT. The most important thing is that users can use it for free without paying high subscription fees, which makes its download volume top the free APP list in many countries.\nSome people call it the Sputnik moment in AI, while others think that the DeepSeek model is simply plagiarizing the OpenAI code. In short, DeepSeek has been widely talked about recently."
newspro.108.a:0 "What are people in Silicon Valley doing?"
newspro.108.b:0 "Interesting..."
newspro.108.c:0 "The great progress of AI"
newspro.109.t:0 "ChatGPT AI"
newspro.109.d:0 "On November 30, 2022, OpenAI officially released ChatGPT. It is a sister model of InstructGPT. It is a version of GPT that can have conversations. It is version 3.5 based on GPT-3.\nIt can not only answer questions, but also create articles, program, and even imitate human conversation style. Its almost omnipotent answering ability has given people a new understanding of the general capabilities of large language models. ChatGPT quickly became popular on social media. In just 5 days, the number of registered users exceeded 1 million."
newspro.109.a:0 "Progress in American technology"
newspro.109.b:0 "Interesting..."
newspro.109.c:0 "We also have to study our own AI"
newspro.110.t:0 "United Health Insurance CEO shot dead"
newspro.110.d:0 "[?global.date.GetDateStringNoHour], Brian Thompson, CEO of United Health Insurance, was shot multiple times by Luigi Nicolas Mangione in a busy area outside the Hilton Hotel in Midtown Manhattan. Ryan Thompson died after being shot in the chest, and the gunman fled the area before the police arrived.\nLuigi Nicolas Mangione was subsequently arrested by local police. In his statement, Mangione claimed that he planned and carried out the murder alone, and listed the size and profitability of United Health Insurance Company, accusing the CEO of the insurance company of being a "parasite" and deserved it."
newspro.110.a:0 "Shocking"
newspro.110.b:0 "This is the inefficient and expensive medical system in US..."

newspro.500.t:0 "The 27th Olympic Games"
newspro.500.d:0 "From September 15 to October 1, 2000, 11,000 athletes from 200 delegations around the world participated in the last Summer Olympic Games of the 20th century, the 27th Summer Olympic Games held in Sydney, Australia, in 28 major events and 300 minor events.\nThe number of events is the highest in the history of the Olympic Games. Inspired by the Olympic spirit, they challenged the physiological limits of human beings, demonstrated a high level of competition, and created 34 world records, 77 Olympic records, and 3 Olympic best results."
newspro.500.a:0 "Share the spirit"
newspro.501.t:0 "The 28th Olympic Games"
newspro.501.d:0 "The 28th Summer Olympic Games were held in Athens, the capital of Greece, from August 13 to 29, 2004. This Olympic Games was the largest reunion of the Olympic family, with 11,099 athletes from 202 countries and regions participating in 28 major events and 301 minor events.\nThey challenged their limits and reached new heights with the Olympic spirit of faster, higher and stronger, setting more than 20 new world records in track and field, swimming, cycling, weightlifting and archery."
newspro.501.a:0 "Welcome Home"
newspro.502.t:0 "The 30th Olympic Games"
newspro.502.d:0 "The 30th Summer Olympic Games were held in London, the capital of the United Kingdom, from July 27, 2012 to August 12, 2012. The main venue of the 2012 London Olympics was the Stratford Olympic Stadium (London Bowl), with Wembley Stadium and O2 Arena as secondary stadiums.\nThe 2012 London Olympics had 205 participating countries and regions, 10,568 participating athletes, and 302 events (26 types) of sports. At the closing of the 2012 London Olympics, a total of 85 countries and regions won medals, and the Chinese delegation ranked second in the medal table with 38 gold, 27 silver and 23 bronze."
newspro.502.a:0 "Inspire a Generation"
newspro.503.t:0 "The 31st Olympic Games"
newspro.503.d:0 "The 31st Summer Olympic Games were held in Rio de Janeiro, Brazil from August 5, 2016 to August 21, 2016. This Olympic Games had 28 major events and 306 minor events. Golf returned to the Olympic Games, and rugby sevens joined the Olympic Games. After 120 years of development, the modern Olympic Games visited South America for the first time. The main venue of this Olympic Games was the Maracanã Stadium. There were 11,238 athletes from 207 member associations of the International Olympic Committee, including a refugee delegation composed of 10 refugees.\nThe first place in the medal list of this Olympic Games was the United States, which won 46 gold medals, 37 silver medals, and 38 bronze medals, a total of 121 medals; the second place was the British team, which won 27 gold medals, 23 silver medals, and 17 bronze medals, a total of 67 medals; the third place was the Chinese team, which won 27 gold medals, 17 silver medals, and 26 bronze medals, a total of 70 medals. "
newspro.503.a:0 "Live Your Passion"
newspro.504.t:0 "The 32nd Olympic Games"
newspro.504.d:0 "The 32nd Olympic Games will open on July 23, 2021 and close on August 8. A total of 11,669 athletes from 204 countries and regions and two participating teams, the Russian Olympic Team and the Olympic Refugee Team, will participate in the 2020 Tokyo Olympics; the event will have a total of 33 major events, 339 minor events, and 339 gold medal games, with five new events added: skateboarding, surfing, competitive rock climbing, baseball and softball, and karate.\nThe Tokyo Olympics has created the closest 1:1 history in terms of the setting of male and female events and the number of male and female athletes participating.\nThe United States delegation still ranked first in the gold medal and medal tables with 39 gold, 41 silver and 33 bronze medals in this Olympics. The Chinese delegation ranked second in the number of gold medals and medals with 38 gold, 32 silver and 18 bronze medals. The host Japanese delegation ranked third in the gold medal table with 27 gold, 14 silver and 17 bronze medals. "
newspro.504.a:0 "United by Emotion"
newspro.505.t:0 "The 33rd Olympic Games"
newspro.505.d:0 "The 33rd Summer Olympic Games will open on July 26, 2024 and close on August 11. Some events will start on July 24. After Paris' successful bid, it became the second city in the world to host the Summer Olympic Games at least three times after London, and it is also the first city to host the Olympic Games again after the 1924 Paris Olympics. \nThis is the first Olympic Games with a completely balanced ratio of men and women, with 5,250 men and women each. This Games has 32 major events and 329 minor events, with a total of 206 countries and regions participating. In addition, four new major events, skateboarding, surfing, competitive rock climbing and breakdancing, were added to this Olympics. \nThe US delegation ranked first in the medal table with 40 gold, 44 silver and 42 bronze medals, while the Chinese delegation eventually won 40 gold, 27 silver and 24 bronze medals at the Paris Olympics, tying the US delegation for first place in the number of gold medals. "
newspro.505.a:0 "Games Wide Open"



