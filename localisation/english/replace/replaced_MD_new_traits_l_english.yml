United_Nations_Security_Council_category: "United Nations Security Council"
United_Nations_Security_Council_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_unsc\n\n\n\n\n\n\n\n\n\nThe §YUnited Nations Security Council§! is one of the six principal organs of the United Nations. It is the only UN organ with the power to §Ytake military action§!. It was created by the five §Ypermanent members of the Security Council§!: §Y[USA.GetFlag] the United States of America§!, §Y[CHI.GetFlag] the People's Republic of China§!, §Y[SOV.GetFlag] the Russian Federation§!, §Y[ENG.GetFlag] the United Kingdom of Great Britain and Northern Ireland§!, and §Y[FRA.GetFlag] the French Fifth Republic§!. The five §Ypermanent members of the Security Council§! have §Ythe power of veto in the Security Council§! . \nAlthough the UN's ability to intervene in international affairs, especially in international wars, is low, the §Ypermanent members of the UN Security Council§! can use their strong political, economic, and military influence to pressure and intervene in wars. \n\nThe five §Ypermanent members of the UN Security Council§! have different international relations demands. For example, the §Y[USA.GetFlag]United States of America§! and the §Y[SOV.GetFlag]Russian Federation§! will more actively pursue their own interests, while the §Y[CHI.GetFlag]People's Republic of China§! is more advocating for international peace. \n\n§Ypermanent members of the UN Security Council§! are important players in mediating wars and maintaining world peace. However, once they go to war with each other, the world pattern will undergo a §Rfundamental change§!. \n"
