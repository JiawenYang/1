Vast_territory_and_populous: "Vast territory and populous people"
Vast_territory_and_populous_desc: "For thousands of years, China has been protected by its geographical environment of being surrounded by mountains and densely forested. The vast and colorful land is home to the Chinese nation, and the vast and rich resources have nurtured many people. However, the special geographical environment has also isolated it from the rest of the world, forming a relatively independent historical and geographical region. As an ancient civilization with a large population and ethnic groups, it takes considerable effort for the central government to maintain territorial integrity, because it needs to invest heavily in its hinterland and border territories to maintain control.\nHowever, so many things have happened on this land for thousands of years that it seems that everything has changed. Failure, joy, and sorrow have become unimportant things. Everything will always disappear in the long river of history and the vast world like what happened here in the past thousands of years, becoming a thick or thin stroke in the history of painting, and a topic of conversation for Chinese people after dinner. \n\n§YThe rolling Yangtze River flows eastward, and heroes wear off like the flowing wave\nSuccess or failure, it's all in the past\nThe green hills are still there, and the sunset is red for several times\nWhite-haired fisherman and woodcutter, used to watch the autumn moon and spring breeze on the shore\nA pot of muddy liquor, glad to meet you\nMany things in ancient and modern times are all in laughter§!"
CHI_OGAS_nation: "National Automation System"
CHI_OGAS_nation_desc: "China has the first national automation system in human history. The supercomputer center in Beijing connects data centers across the country. Through blockchain technology, the core program that complies with the central planning calculates the most, fastest, best, and most economical production and life suggestions - to some extent, it is a kind of planning instruction, and then promotes it to large and small terminals as a guide for production activities or life activities. \nAlthough this system is not mandatory, the Chinese government provides it as a service to enterprises and citizens for consumption and use at a very low cost, but the rapid social change trend it brings, the huge release of productivity, and the government's overt and covert promotion make it difficult for everyone to refuse to deal with this system that penetrates every corner of society."
CHI_policy_of_redemption_idea: "Redemption Policy"
CHI_policy_of_redemption_idea_desc: "The redemption idea is divided among four groups, that is, the state income tax, enterprise public fund, employee welfare bonus and entrepreneur's dividends are distributed among four groups. The entrepreneur's income is limited to about 1/4 of the enterprise's profit. In a certain period of time, the state pays the entrepreneur 5% of the dividends every year according to the private shares in the public-private joint venture."
beidou_satelite_navigation_system: "$beidou_satelite_navigation$"
beidou_satelite_navigation_system_desc: "$beidou_satelite_navigation_desc$"
beidou_satelite_navigation: "Beidou Satellite Navigation System"
beidou_satelite_navigation_desc: "The BeiDou satellite navigation system is a global satellite navigation system independently developed by China. It is also the third mature satellite navigation system after GPS and GLONASS. With the development of BeiDou system construction and service capabilities, related products have been widely used in transportation, marine fisheries, hydrological monitoring, weather forecasting, surveying and mapping geographic information, forest fire prevention, communication time system, power dispatching, disaster relief and reduction, emergency search and rescue and other fields, gradually penetrating into all aspects of human social production and people's lives, injecting new vitality into global economic and social development."
ban_Korean_culture: "ban Korean culture"
ban_Korean_culture_desc: "Korea's entertainment industry is highly dependent on the Chinese market, which has led to China's ban on the Korean entertainment industry, which has severely impacted the Korean economy."
The_China_Dream: "The Chinese Dream"
The_China_Dream_desc: "Realizing the great rejuvenation of the Chinese nation is the greatest dream of the Chinese nation in modern times. The greatest feature of the Chinese Dream is that it regards the country, the nation and the individual as a community of destiny, and closely links the interests of the country, the nation and the specific interests of each individual.\n\nThe "Chinese Dream" is related to the future development direction of China, and embodies the Chinese people's longing and expectation for the great rejuvenation of the Chinese nation; it is the dream that the entire Chinese nation has been pursuing, and it is the long-cherished wish of hundreds of millions of people from generation to generation. Every Chinese is a participant and creator of the Chinese Dream."
CHI_Economically_advanced_countries: "Economically advanced countries supported by China"
CHI_Economically_advanced_countries_desc: "In the past, this country could enjoy more benefits from economic globalization, such as cheap international labor outsourcing or low-priced consumer goods imports, due to its inherently developed economy or its superior position in the US-dominated world system.\n\nNow, under China's call, this country has begun to stand up against the US-centered hegemony system, and thus expressed its approval of the diversified new international order advocated by China."
CHI_Economically_advanced_countries_2: "Economically advanced countries subject to Chinese sanctions"
CHI_Economically_advanced_countries_2_desc: "In the past, this country could enjoy more benefits from economic globalization, such as cheap international labor outsourcing or low-priced consumer goods imports, due to its inherently developed economy or its superior position in the US-dominated world system.\n\nToday, this country has been subject to China's economic sanctions for refusing to join China in opposing the US-centered hegemony system, which has had a very negative impact on its domestic economy."
Economic_dependency_countries_2: "Economically underdeveloped countries supported by China"
Economic_dependency_countries_2_desc: "In the past, this country actually expressed its obedience to the world economic system dominated by the United States and tried to integrate into this system. It used its large and cheap labor force or abundant natural resources to continuously export cheap consumer goods or low-priced raw materials to developed countries.\n\nNow, under the call of China, this country has begun to stand up against the hegemonic system with the United States as the core, and thus expressed its approval of the diversified new international order advocated by China."
Confronting_the_USA_countries_2: "Countries supported in confronting the US system"
Confronting_the_USA_countries_2_desc: "This country is rebelling against the US-dominated world system, but now they are supported by China and their socio-economic development is improving."
Heritage_of_WW2: "Heritage of World War II"
Heritage_of_WW2_desc: "Japanese people are reluctant to mention the history of World War II. They do not want to embark on the path of militarism again, and they no longer have anyone they can die for. Vigilance and rejection of war are the consensus of most Japanese people."
JAP_turbulent_political_situation: "Turbulent political situation"
JAP_turbulent_political_situation_desc: "Since the sudden death of Prime Minister Keizo Obuchi, Japan's prime ministers have changed frequently, making it impossible to formulate long-term and stable policies. The dilemma of being forgotten by the prime minister is difficult to solve."
JAP_weak_army: "Weak Self-Defense Forces"
JAP_weak_army_desc: "The Japanese Self-Defense Forces are not a standard military in nature. They have long been suppressed by the Japanese government with low salaries and cumbersome policies. Most importantly, the Japanese people do not regard them as a force to be proud of. It is very difficult for the Self-Defense Forces to recruit soldiers. After a long period of peace, they have not learned how to use weapons."
JAP_military_constrained_by_bureaucrats: "Civilian control of the military"
JAP_military_constrained_by_bureaucrats_desc: "The Japanese Self-Defense Forces are managed by Japanese government bureaucrats, are bloated in organization, and are very slow to mobilize."
JAP_Huge_overseas_assets: "Huge overseas assets"
JAP_Huge_overseas_assets_desc: "Japan is the world's largest net foreign asset country, with overseas assets even exceeding its total GDP."
JAP_leftwing_trend: "Japanese Left-wing Trend"
JAP_leftwing_trend_desc: "The vigorous left-wing movement that erupted in postwar Japan left a profound impact on Japanese society. It gradually subsided after the 1970s, but it still has a strong influence in the field of literature and art."
JAP_Controlled_bureaucrats: "Controlled bureaucrats"
JAP_Controlled_bureaucrats_desc: "Controlled bureaucrats are good helpers to the Prime Minister. We need loyal retainers."
Right_as_Prime_Minister: "Right as Prime Minister"
Right_as_Prime_Minister_desc: "Political operations are the responsibility of the Prime Minister. A Prime Minister who fulfills his duties is a good Prime Minister."
middleclass_country: "middle class country"
middleclass_country_desc: "In the 1970s, there was a popular phrase in Japan called "100 million middle class". In the public opinion survey conducted by the central government every year, when people were asked "Is your family's economic status upper class, upper middle class, middle middle class, lower middle class, or lower class", the proportion of people who answered that they were "upper middle class, middle middle class, or lower middle class" was 72% in 1958, and exceeded 90% in 1973\n————"My Generation of Tokyoites" by Ichiro Arai"
Education_Highland: "Education Highland"
Education_Highland_desc: "Japan has continuously invested in education since modern times, forming one of the most complete education systems in the world. Its higher education enjoys a high reputation in the global field and has achieved many results. Japan is the country with the most Nobel Prize winners in Asia."
Patriarchal_society: "Patriarchal society"
Patriarchal_society_desc: "Although Japan is one of the most developed countries, the patriarchal system of "the father holds the most power in the family, the patriarch holds the most power in the family, and the supreme ruler holds the most power in the country" is still deeply rooted in Japanese society."
Cyberpunk_Countries: "Cyberpunk Countries"
Cyberpunk_Countries_desc: "Giant corporations, artificial intelligence, huge cities, slums, neon lights, past and present, West and East, war and peace. How many people walking hurriedly with transparent umbrellas in Tokyo on a rainy day would look up at the starry sky through the colorful light mist?"
Low_desire_society: "Low Desire Society"
Low_desire_society_desc: "The population is decreasing, the population is aging, and there are more and more young people who have lost their ambition and desire. Citizens hold a large amount of financial assets, and companies have high internal reserves, but they fail to use the funds effectively. Neither monetary easing nor public investment can boost consumer confidence, and the policy of throwing money around is unable to revitalize the economy. Young people have no interest in traditional consumption and lifestyles such as buying houses, cars, getting married, and having children. They prefer to live a simple, comfortable, and self-satisfied life. The culture of staying at home is prevalent, and young people are addicted to the virtual world of the Internet, games, and animation, lacking social interaction and a sense of responsibility. New social groups such as herbivorous men and dried food women have shown indifference and negativity towards heterosexual love and sexual relations, leading to a depressed marriage market and a decline in fertility."
aging_population: "Aging society"
aging_population_desc: "Japan is the country with the most serious aging population in the world. The population over 65 years old accounts for 27% of the total population. Consumer demand is insufficient, economic growth momentum is weak, and the social welfare system represented by pensions is close to collapse."
JAP_weak_army: "Weak Self-Defense Forces"
JAP_weak_army_desc: "The Japanese Self-Defense Forces are not a standard military in nature. They have long been suppressed by the Japanese government with low salaries and cumbersome policies. Most importantly, the Japanese people do not regard them as a proud national defense force. It is even difficult for the Self-Defense Forces to recruit soldiers. After a long period of peace, they have not learned how to use weapons."
JAP_military_constrained_by_bureaucrats: "Civilian control of the military"
JAP_military_constrained_by_bureaucrats_desc: "The Japanese Self-Defense Forces are completely managed by the Japanese government bureaucracy. They are very bloated in organization and very slow in mobilization, and are unable to bear the heavy responsibility of war."
JAP_economy: "Economic recession"
JAP_economy_desc: "After the asset bubble burst in the 1990s, Japan experienced nearly a decade of low economic growth and continued deflation, which made residents and enterprises lose vitality and society lose innovation. After the economic bubble burst, Japan's fiscal and monetary policies were strengthened, but because it did not pay attention to the hidden dangers of zombie companies, it led to a banking crisis in Japan in 1997; in 1999, it began to implement a zero interest rate policy, but did not firmly anchor prices, so that the policy was immediately cancelled as soon as the economic situation improved in 2000, which aggravated deflation expectations and affected the credibility of the Bank of Japan\nThe Japanese economy is in an unsolvable strange situation"
HKG_special_administrative_region: "Hong Kong Special Administrative Region"
HKG_special_administrative_region_desc: "The Hong Kong Special Administrative Region is a provincial-level administrative region established in accordance with the Constitution of the People's Republic of China. It is a local administrative region directly under the Central People's Government, just like provinces, autonomous regions and municipalities directly under the Central Government. On July 1, 1997, the Chinese government resumed the exercise of sovereignty over Hong Kong and the Hong Kong Special Administrative Region was established. The Central Government has comprehensive jurisdiction over Hong Kong. Hong Kong maintains its original capitalist system and enjoys a high degree of autonomy in all matters except diplomacy and national defense. It participates in international organizations and international conferences that are not attended by countries under the name of "Hong Kong, China". "One country, two systems", "Hong Kong people administering Hong Kong" and a high degree of autonomy are the basic national policies of the Chinese government."
MAC_special_administrative_region: "Macau Special Administrative Region"
MAC_special_administrative_region: "The Macao Special Administrative Region is a provincial-level administrative region established in accordance with the Constitution of the People's Republic of China. Like provinces, autonomous regions and municipalities directly under the Central Government, it is a local administrative region directly under the Central People's Government. On December 20, 1999, the Chinese government resumed the exercise of sovereignty over Macao, and the Macao Special Administrative Region was formally established. The basic principles of the relationship between the Central Government and the Macao Special Administrative Region are "one country, two systems", "Macao people administering Macao" and a high degree of autonomy."
MON_special_administrative_region: "Mongolian Special Administrative Region"
MON_special_administrative_region_desc: "The Mongolian Special Administrative Region is a provincial-level administrative region established in accordance with the Constitution of the People's Republic of China. Like provinces, autonomous regions and municipalities, it is a local administrative region directly under the Central People's Government. After the Chinese government resumed its sovereignty over Mongolia, the central government referred to the relevant experience of ethnic autonomy in the Inner Mongolia Autonomous Region and maintained the basic principles of relations with the Mongolian Special Administrative Region as "one country, two systems", "Mongolians governing Mongolia" and a high degree of autonomy."
TAI_special_administrative_region: "Taiwan Special Administrative Region"
TAI_special_administrative_region_desc: "The Taiwan Special Administrative Region is a provincial-level administrative region established in accordance with the Constitution of the People's Republic of China. It is a local administrative region directly under the Central People's Government, just like provinces, autonomous regions and municipalities. After the Chinese government resumed the exercise of sovereignty over Taiwan, it had comprehensive governance over Taiwan. Hong Kong maintained its original capitalist system and enjoyed a high degree of autonomy in all matters except diplomacy and defense. It participated in international organizations and international conferences that were not attended by countries under the name of "Taiwan, China". "One country, two systems", "Taiwan people governing Taiwan" and a high degree of autonomy are the basic national policies of the Chinese government."
JAP_special_administrative_region: "Japan Special Administrative Region"
JAP_special_administrative_region_desc: "Japan's Special Administrative Region is a provincial-level administrative region established in accordance with the Constitution of the People's Republic of China. It is a local administrative region directly under the Central People's Government, just like provinces, autonomous regions and municipalities directly under the Central Government. The Japanese Emperor is the nominal president of the Japan Special Administrative Region. The Emperor is the symbol of the Japan Special Administrative Region, and his status is based on the will of all Japanese people in the region. The Central Government of the People's Republic of China has comprehensive governance over Japan. Japan maintains its original capitalist system and enjoys a high degree of autonomy in all affairs except diplomacy. It is allowed to retain the Self-Defense Forces for self-defense purposes and participate in international organizations and international conferences that are not attended by countries in the name of the "Japan Special Administrative Region". "One country, two systems", "peace by people" and a high degree of autonomy are the basic national policies of the Chinese government."
CHI_special_administrative_region: "Special Administrative Region"
CHI_special_administrative_region_desc: "Special administrative regions are generally provincial-level administrative regions. Like provinces, autonomous regions and municipalities, they are local administrative regions directly under the Central People's Government. They are politically governed by a high degree of autonomy by the local people, and some can even maintain their own armed forces."
TAI_military_tradition: "National Military Tradition"
TAI_military_tradition_desc: "Friendly troops remain as steady as a mountain"
CHI_Popular_local_network_culture: "Local popular culture"
CHI_Popular_local_network_desc: "The country's large local network community has created a thriving local popular network culture."
CHI_Maoism: "Mao Zedong Thought"
CHI_Maoism_desc: "§RThe west wind is strong, and the sky is filled with the call of wild geese in the frosty morning and moonlight\nFrost morning moon, the sound of horse hooves shattering, the sound of horns swallowing\nThe road ahead is as hard as iron, but now we are taking a new step\nFrom the beginning, the mountains are like the sea, and the setting sun is like blood§!"
CHI_Deng_Xiaoping_Theory: "Deng Xiaoping Theory"
CHI_Deng_Xiaoping_Theory_desc: "Deng Xiaoping pointed out that the essence of socialism is to liberate productivity, develop productivity, eliminate exploitation, eliminate polarization, and ultimately achieve common prosperity. The three "benefiting" principles, such as "whether it is conducive to the development of productivity in socialist society", should be used as the criteria for judging whether reform and opening up are "capitalist" or "socialist". We should emphasize taking economic construction as the center, taking the adherence to the four basic principles and the adherence to reform and opening up as the two basic points as the basic line, building a socialist market economic system, and developing socialism with Chinese characteristics."
three_represents: "Three Represents"
three_represents_desc: "The Communist Party of China must always represent the development requirements of China's advanced productive forces\nThe Communist Party of China must always represent the direction of China's advanced culture\nThe Communist Party of China must always represent the fundamental interests of the vast majority of the Chinese people"
scientific_outlook_on_development: "Scientific Outlook on Development"
scientific_outlook_on_development_desc: "The first priority of the scientific outlook on development is development, the core position is people-oriented, the basic requirement is comprehensive coordination and sustainability, and the fundamental method is to coordinate and balance"
xi_thought: "Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era"
xi_thought_desc: "Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era is a guide to action for the whole Party and the people of the whole country to strive for the great rejuvenation of the Chinese nation. Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era is contemporary Chinese Marxism, Marxism of the 21st century, and the essence of the Chinese culture and spirit of the times. It has achieved a new leap in the sinicization and modernization of Marxism\n"Ten clarifications", "Fourteen persistences", "Thirteen achievements", "Six musts""
RAJ_Equipment_Design: "Indian Equipment Design"
RAJ_Equipment_Design_desc: ""
CHI_Independent_Africa: "Independent Africa"
CHI_Independent_Africa_desc: "The ancient land is reviving with the help of the Eastern dragon."
idea_JAP_emperor_hisahito: "Emperor Hisahito"
idea_JAP_emperor_kako: "Emperor Kako"


#resource
PRODUCTION_MATERIALS_GRAIN: "Food"
grain_desc: "Although the 21st century has achieved great food productivity, food is still a country's most basic strategic material. The world's major foods include grains, vegetables, meat, eggs, fish, fruits, etc. Food is produced by subsistence agriculture and commercial agriculture areas."
PRODUCTION_MATERIALS_CONSUMER_GOODS: "Consumer Goods"
consumer_goods_desc: "Consumer goods are those social products used to meet people's material and cultural needs. They can also be called "consumer materials" or "living materials", including clothing, electrical appliances, furniture, and various industrial products that can be exchanged for money. Consumer goods are produced by civilian industries."
PRODUCTION_MATERIALS_SERVICE: "Service"
service_desc: "Service is the work or economic activity done by individuals or social organizations for consumers directly or with the help of certain tools, equipment, facilities and media. Its production may or may not be related to material products. It adds value to individuals, goods or services of other economic units and is mainly expressed in the form of use value or utility. Services are produced by office parks."


#Balance of Power
CHI_power_balance: "China's social development balance"
CHI_People_happiness_side: "The people become happy"
CHI_Nation_prosperity_side: "The country becomes strong"
CHI_mid_range: "Maintain Balance"
CHI_mid_range_desc: "Our country's social development has achieved a balance between people's livelihood and development"
CHI_People_happiness_side_a: "Noticed in Welfare"
CHI_People_happiness_side_a_desc: "Our country pays more attention to people's livelihood in its development and helps those in need."
CHI_People_happiness_side_b: "Pay attention to Welfare"
CHI_People_happiness_side_b_desc: "my country's development is more inclined towards people's livelihood, and it has begun to expand spending on people's livelihood"
CHI_People_happiness_side_c: "Focus on Welfare"
CHI_People_happiness_side_c_desc: "Our country's development focuses on people's livelihood, and many social resources are used for people's well-being"
CHI_People_happiness_side_d: "Priority Welfare"
CHI_People_happiness_side_d_desc: "Our country's development is aimed at maintaining people's livelihood, and a large amount of social resources are used to maintain people's well-being."
CHI_People_happiness_side_e: "Welfare First"
CHI_People_happiness_side_e_desc: "Our country's development is aimed at continuously meeting the people's growing needs for a better life, and almost all social resources are inclined to meet the needs of improving people's livelihood and welfare."
CHI_Nation_prosperity_side_a: "Noticed in Development"
CHI_Nation_prosperity_side_a_desc: "my country's development focuses more on economic construction and invests in subsidies for some key areas"
CHI_Nation_prosperity_side_b: "Pay attention to Development"
CHI_Nation_prosperity_side_b_desc: "Our country's development is more inclined towards economic construction and has begun to expand construction investment"
CHI_Nation_prosperity_side_c: "Focus on Development"
CHI_Nation_prosperity_side_c_desc: "Our country's development focuses on economic construction, and many social resources are used for construction investment."
CHI_Nation_prosperity_side_d: "Priority Development"
CHI_Nation_prosperity_side_d_desc: "We focus on development and use a lot of social resources to focus on economic construction."
CHI_Nation_prosperity_side_e: "Development First"
CHI_Nation_prosperity_side_e_desc: "Our country's development is entirely aimed at expanding economic construction, and almost all social resources are used to invest in economic construction."

#resolution
CHI_balance_of_power_category: "China's Social Development Balance Resolution"
CHI_eastern_region_leading_development_category: "Eastern Leading Development Decision"
CHI_eastern_region_leading_development_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chieast\n\n\n\n\n\n\n\n\nThe opening of §YShenzhen Special Economic Zone§! in 1980s in §YEastern China§! led to the reform and development of §YPearl River Delta§!; the development and opening of §YPudong New Area§! in 1990s led to the reform and development of §YYangtze River Delta and Yangtze River Basin§!. The Pearl River Delta and Yangtze River Delta quickly became the two most active "poles" of China's economy.\n\nThe implementation of the eastern region's leading development strategy will enable the eastern region of China to be more capable of supporting the development of the western region, the rise of the central region and the revitalization of the northeast, and promote and form a good situation of interaction between the east, the middle and the west and the coordinated development of the national economy. The eastern region undertakes the task of leading the way and experimenting for the whole country, so the eastern region is ahead in development, transformation, reform and transition, and can play a role of §Ypioneering and paving the way§! for comprehensively deepening reform."
Expand_hainan_tourism_industry: "Build supporting facilities for Hainan's tourism industry"
Expand_hainan_tourism_industry_desc: "Build supporting industries related to tourism"
Expand_jingjinji_industry: "Expand Jingjinji Industry"
Expand_shandong_industry: "Expand Shandong industry"
Expand_jiangsu_Urban_agglomerations: "Building Jiangnan Urban Agglomerations"
Expand_zhejiang_Technology_Highland: "Building Zhejiang Technology Highland"
Expand_fujian_Foreign_trade_ports: "Build Fujian Foreign Trade Ports"
Expand_guangdong_The_Heart_of_Manufacturing: "Strengthen the heart of manufacturing in Guangdong"
Expand_shanghai_financial_center: "Building Shanghai into a Financial Center"
CHI_hainan_Tourism_industry: "Developing Hainan's tourism industry"
CHI_hainan_Tourism_industry_desc: "Hainan is located in the tropics, with beautiful scenery and pleasant climate, which is suitable for driving local economic development with tourism as the focus."
CHI_jingjinji_Integration: "Promote the integrated development of Beijing, Tianjin and Hebei"
CHI_jingjinji_Integration_desc: "Beijing, Tianjin and Hebei are located in the same region, with complementary advantages. Investing in and developing this region will greatly promote economic development."
CHI_shandong_High_end_chemical_industry: "Developing Shandong's high-end chemical industry"
CHI_shandong_High_end_chemical_industry_desc: "Shandong is an important base for state-owned enterprises, with many chemical industries concentrated. Investing in high-end chemicals will help state-owned enterprises transform and upgrade."
CHI_jiangsu_High_end_manufacturing_industry: "Developing Jiangsu's high-end manufacturing industry"
CHI_jiangsu_High_end_manufacturing_industry_desc: "Jiangsu is a region where high-end manufacturing is distributed. We should increase investment in this region to drive the development of high-end manufacturing."
CHI_zhejiang_E_Commerce: "Developing Zhejiang e-commerce"
CHI_zhejiang_E_Commerce_desc: "Zhejiang is the largest commodity distribution center and export center in my country, and e-commerce is also very developed. We should promote the development of this pioneering industry."
CHI_fujian_Electronic_manufacturing_industry: "Investing in Fujian's Electronic Manufacturing Industry"
CHI_fujian_Electronic_manufacturing_industry_desc: "Fujian has a complete electronic manufacturing system, and we should increase investment and development"
CHI_guangdong_Special_Economic_Zones: "Investing in Guangdong Special Economic Zones"
CHI_guangdong_Special_Economic_Zones_desc: "Guangdong has two super cities, Shenzhen and Guangzhou. Shenzhen is the most developed special economic zone in my country. Increasing investment in this vibrant region will be conducive to the rapid development of my country's economy."
CHI_shanghai_Business_environment: "Creating a good business environment in Shanghai"
CHI_shanghai_Business_environment_desc: "Shanghai is an extremely important economic region in my country and a window for my country's foreign exchanges. Creating a good business environment is conducive to enhancing economic strength and ensuring investor confidence."
CHI_The_rise_of_central_category: "The rise of central category"
CHI_The_rise_of_central_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chicentral\n\n\n\n\n\n\n\n\n§YCentral China§! connects the east and the west, and the south and the north. The total economic output of its six provinces accounts for about one-fifth of the national total. It is an important region that cannot be ignored. The central region occupies an important position in the overall economic and social development of China, and has made significant contributions to the national economic and social development for a long time. The central region includes §YShanxi, Anhui, Jiangxi, Henan, Hubei, and Hunan provinces§!, with a land area of 1.028 million square kilometers, accounting for 10.7% of the total land area of the country.\n\nPromoting the rise of the central region is an important part of implementing the regional layout of the four major blocks and the "three major strategies", an objective need to build a unified national market and promote the formation of benign interactive and coordinated development of the eastern, central and western regions, a strategic measure to optimize the national economic structure and maintain sustained and healthy economic development, and an inevitable requirement to ensure the timely realization of the goal of building a well-off society in an all-round way."
