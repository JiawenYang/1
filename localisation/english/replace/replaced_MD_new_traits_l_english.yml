CHI_research_without_ethical_restrictions: "Allows research without ethical restrictions"
MON_Ecological_Issues: "Mongolian Environmental Issues"
MON_Ecological_Issues_desc: "Since the end of the Cold War, Mongolia's economy has long relied on extensive animal husbandry and unregulated mining, which has gradually deteriorated the local ecological environment. Increasingly serious air pollution and unstoppable desertification will drain the last bit of vitality from this land.\n\n§RIf the local economic model does not change, environmental problems will worsen every month!§!"
RUS_winter_is_coming: "Winter is coming"
CHI_offend_our_people: "Reverse Scale"
CHI_offend_our_people_desc: "As a worm, a dragon can be treated as an intimate creature and ridden. However, there is a scale under its throat that is one foot in diameter. If anyone offends it, he will be killed. The ruler also has a scale. If those who persuade him can avoid offending the ruler's scale, then he will be successful."
CHI_zhurongji: "Premier Zhu Rongji"
CHI_zhurongji_desc: "Zhu Rongji, male, Han nationality, was born in October 1928 in Changsha, Hunan Province. He joined the Communist Party of China in October 1949 and started working in December 1948. He graduated from the Department of Electrical Engineering of Tsinghua University with a major in electrical machinery manufacturing. He has a college degree and is a senior engineer. He has worked in the economic field for more than half a century and is experienced. His sharp thinking, decisiveness, boldness and strictness have made the economic work he led efficient and effective. During his tenure, the government operated efficiently, but the implementation of some policies, such as layoffs in state-owned enterprises and increased burdens on farmers, had a certain negative impact on society."
CHI_wenjiabao: "Premier Wen Jiabao"
CHI_wenjiabao_desc: "Wen Jiabao, male, Han nationality, was born in September 1942 in Tianjin. He joined the Communist Party of China in April 1965 and started working in September 1967. He graduated from the Beijing Institute of Geology with a major in geological structure. He has a postgraduate degree and is an engineer. He worked in the Gansu Provincial Bureau of Geology, engaged in geomechanical exploration and other work. Later, he was transferred to the Ministry of Geology and Mineral Resources, engaged in policy and regulatory research and was later promoted to vice minister of the ministry. During his tenure as prime minister, Wen Jiabao personally participated in the organization or handling of major events and incidents such as the SARS incident, the Wenchuan earthquake, the Beijing Olympics, the 2007-2008 global financial crisis, the Yushu earthquake in Qinghai, the Shanghai World Expo, the Zhouqu mudslide in Gansu, and the Guangzhou Asian Games. His biggest political measure, the economic stimulus package, was controversial, so he is also known as the most controversial prime minister in Chinese history."
CHI_likeqiang: "Premier Li Keqiang"
CHI_likeqiang_desc: "Li Keqiang, male, Han nationality, was born on July 3, 1955 in Dingyuan, Anhui Province. He started working in March 1974 and joined the Communist Party of China in May 1976. He graduated from the Law Department and the Economics Department of the School of Economics of Peking University with a bachelor's degree in law and a doctorate in economics. Since June 1998, Li Keqiang has served successively as deputy secretary of the Henan Provincial Party Committee, acting governor, governor, secretary of the Henan Provincial Party Committee, governor, secretary of the Henan Provincial Party Committee and chairman of the Standing Committee of the Provincial People's Congress. Since December 2004, he has served successively as secretary of the Liaoning Provincial Party Committee, secretary of the Liaoning Provincial Party Committee and chairman of the Standing Committee of the Liaoning Provincial People's Congress. In October 2007, Comrade Li Keqiang was elected as a member of the Political Bureau and the Standing Committee of the CPC Central Committee at the First Plenary Session of the 17th CPC Central Committee. After serving as the Premier of the State Council, Comrade Li Keqiang has devoted a lot of efforts in the fields of science and technology, education, ecological protection, comprehensive revitalization of Northeast China, and development of the western region. This reformer Premier, who is proficient in economics, proposed the famous "Keqiang Index" in economics, attached importance to the development of manufacturing and Internet industries, and proposed the "Internet +" development model. However, this energetic Premier has always been shrouded in a shadow and cannot display his grand ambitions..."
CHI_crisis: "Economic crisis"
CHI_crisis_desc: "§RWhen a tsunami comes, all human efforts are useless§!"
CHI_Tax_Sharing_Reform_Land_finance: "1994 Tax Sharing Reform and Land Finance"
CHI_Tax_Sharing_Reform_Land_finance_desc: "In 1994, China began to implement the tax-sharing fiscal management system, which played a positive role in rationalizing the distribution relationship between the central and local governments, mobilizing the enthusiasm of both the central and local governments, strengthening tax collection and management, ensuring fiscal revenue and enhancing macro-control capabilities. However, it also gave rise to the development model of land finance, laying the hidden dangers for the creation of real estate bubbles."
CHI_Tax_Sharing_Reform_Land_finance_01: "Reforming the Tax System"
CHI_Tax_Sharing_Reform_Land_finance_01_desc: ""
CHI_intertwined_Interest_relations: "Intertwined Interest Relations"
CHI_intertwined_Interest_relations_desc: "If you don't violate the rules of propriety and righteousness, why should you care about what others say? If the water is too clear, there will be no fish; if the person is too careful, there will be no followers; the tassels in front of the crown are used to block the vision; the black yarn is used to fill the ears to block the hearing. The vision does not see what is visible, and the hearing does not hear what is not. Promote the great virtues and forgive the minor faults. Don't expect one person to be perfect. Make it straight so that it can be obtained by itself; make it gentle so that it can be obtained by itself; make it measured so that it can be sought by itself. This is how the sages teach and educate, hoping that they can obtain it by themselves; if they obtain it by themselves, they will be quick and broad-minded."
CHI_agricultural_tax:0 "Agricultural Tax"
CHI_agricultural_tax_desc: "Since the founding of the People's Republic of China, especially from 1953 to 1986, the state's unified purchase and marketing policy for agricultural products has actually extracted a large amount of agricultural surplus value for industrial production through the price "scissors gap" between industrial and agricultural products to subsidize industrial development."
CHI_uncontrolled_internet: "Free Internet"
CHI_uncontrolled_internet_desc: "On September 14, 1987, with the help of German professor Werner Zohn and others, Wang Yunfeng and others from the Beijing Institute of Computer Application Technology sent an email titled "Crossing the Great Wall and Going to the World". On April 20, 1994, a 64K international dedicated line was connected to the Internet from the Chinese Academy of Sciences, realizing a full-function connection between China and the Internet. Since then, China has become the 77th member of the international Internet family.\nHowever, since 1990s ,due to the huge gap between China and Western countries, negative news and false information became a daily occurrence in Internet at this time."
CHI_Popular_culture_from_Jap_KRO_HKG_TWN: "Popular Culture From JP & KR & HK & TW"
CHI_Popular_culture_from_Jap_KRO_HKG_TWN_desc: "After the golden age of culture in the 1980s and 1990s, the pop culture of Japan, Hong Kong and Taiwan has been widely popular in mainland China. After entering the new century, Korean Wave has become a new star in popular culture. The cultural products of these countries and regions can be seen everywhere in the daily life of the Chinese people, and the young people of the millennial generation have grown up in such an environment."
CHI_backwash_of_big_layoff: "backwash of big layoff"
CHI_backwash_of_big_layoff_desc: ""Workers should think for the country. If I don't get laid off, who will?" In the 1990s, Premier Zhu Rongji deepened the reform of state-owned enterprises and promoted the reduction of burdens and layoffs. Since the decision on the reform was issued in May 1997, millions of state-owned enterprise workers have been laid off in just a few months. The implementation of the policy was beyond expectations: from 1998 to 2000, 7 million to 9 million workers were laid off almost every year. By 2003, the total number of laid-off workers in state-owned enterprises reached 28.18 million.\n\nThe widespread unemployment of workers has had a huge impact on Chinese society. The jobs created by domestic asset appreciation investment are far from meeting the employment needs of unemployed workers. The unemployed are isolated from the operation of society. The trauma of the unrest caused by this will take a long time to heal. However, it may be possible to accelerate the creation of jobs by rapidly expanding investment and production..."
CHI_backwash_of_big_layoff_2: "The backwash of big layoff"
CHI_backwash_of_big_layoff_2_desc: ""Workers should think for the country. If I don't get laid off, who will?" In the 1990s, Premier Zhu Rongji deepened the reform of state-owned enterprises and promoted the reduction of burdens and layoffs. Since the decision on the reform was issued in May 1997, millions of state-owned enterprise workers have been laid off in just a few months. The implementation force was beyond expectations: from 1998 to 2000, 7 million to 9 million workers were laid off almost every year. As of 2003, the total number of laid-off workers in state-owned enterprises reached 28.18 million.\n\nDue to a series of measures to introduce foreign investment and expand exports, the domestic economy has become somewhat prosperous. Factories that have sprung up have continuously absorbed silent employees. The surplus labor force brought about by the large-scale layoffs is rapidly turning into a labor dividend"
CHI_superstition_and_Separatism: "Superstition and Separatism"
CHI_superstition_and_Separatism_desc: "Although China is an atheist country and most people do not believe in the existence of gods and ghosts, the Chinese people are very ignorant about religious beliefs. In addition, the Communist Party of China maintains a neutral attitude towards religious beliefs, resulting in various religions and even cults running rampant in Chinese society. In addition, many separatists and terrorists have attempted to split and disintegrate China in the name of religion, posing a serious social hazard."
CHI_moderately_prosperous_society_1: "Building a moderately prosperous society in all respects"
CHI_moderately_prosperous_society_1_desc: "In the first 20 years of this century, we must concentrate our efforts on building a moderately prosperous society of a higher standard that will benefit more than one billion people, and make the economy more developed, democracy more sound, science and education more advanced, culture more prosperous, society more harmonious, and people's lives more affluent."
CHI_moderately_prosperous_society_complete: "moderately prosperous society"
CHI_moderately_prosperous_society_complete_desc: "The people are no longer tired, and can live in moderate prosperity. Benefit China and pacify the four directions. Do not indulge in cunning and follow others, and be cautious and unscrupulous. Stop the invaders and do not fear the wise. Be gentle to those far away and be able to be close, so as to stabilize our king.\n\n——《The Book of Songs·Da Ya·Min Lao》"
CHI_National_rejuvenation: "The great rejuvenation of the Chinese nation"
CHI_National_rejuvenation_desc: "Our road is so broad, our future is so bright, we devote ourselves to this magnificent cause, with infinite happiness and supreme glory."
CHI_National_rejuvenation_2: "Chinese national rejuvenation" 
CHI_National_rejuvenation_desc: "For thousands of years, various ethnic groups have flourished on the land in China, and since the formation of Qin, China, and a multi-ethnic nation, the idea of unity has deepened. The human heart, the distribution of all ethnic groups, the mutual dependence, the cultural accumulation, the emotional closeness of each other, and the final formation of a pluralistic and unified Chinese people."
CHI_superstition_and_Separatism2: "Separatist Remnants"
CHI_superstition_and_Separatism_desc2: "Under the continuous crackdown by the Chinese Communist Party, cults and extreme religious organizations have been listed as illegal organizations and suffered a devastating disaster. People are very vigilant against these organizations. However, there are still many stubborn elements lurking in the corners of society waiting for an opportunity to act. After all, you can never kill all the bugs."
CHI_Public_panic: "Public Panic"
CHI_Public_panic_desc: "As the government released news of an unknown virus, the public fell into panic."
CHI_Public_panic2: "Still feeling scared"
CHI_Public_panic_desc: "Due to the government's continued scientific publicity and reassurance measures, the public has temporarily stopped the initial widespread panic, but they are still worried that they will also be infected with the unknown virus."
CHI_Public_panic3: "One heart, one mind"
CHI_Public_panic_desc: "Under the full control of the government, the virus is no longer spreading on a large scale, and the areas where the virus has appeared have been quickly brought under control. People believe that under the leadership of the Party and the government, we will definitely be able to overcome this difficult time."
eleventh_five_year_plan: "Eleventh Five-Year Plan"
eleventh_five_year_plan_desc: "Forward!"
tenth_five_year_plan: "Tenth Five-Year Plan"
tenth_five_year_plan_desc: "Forward!"
CHI_Rural_Development_Plan: "Rural Development Plan"
CHI_population_modifiers: "China's Population Structure"
CHI_population_modifiers_desc: "Population is the cornerstone of the economy. Without people, there is no production, no consumption, and no future. China is the most populous country in the world. The long-term family planning policy has greatly improved China's population burden, but it may lead to a bigger crisis and eventually fall like a rolling stone. \n----------------\n§WAging population ratio: [?ROOT.CHI_aging_ratio_now|Y2%%],this value affects §Y$MODIFIER_GLOBAL_MONTHLY_POPULATION$, $total_workforce_modifier$, $health_cost_multiplier_modifier$§!\n\nCurrent urbanization rate: [?ROOT.CHI_urbanization_now|Y2%%], this value affects §Y$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$, $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$, $MODIFIER_RESEARCH_SPEED_FACTOR$, $education_cost_multiplier_modifier$, $MODIFIER_CONSUMER_GOODS_FACTOR$§!§!"
CHI_Feminism: "Chinese Women's Rights"
CHI_Feminism_desc: "Women's rights are an important area of human rights and an important factor affecting social development"
CHI_gangland: "Evil forces are rampant"
CHI_gangland_desc: "Evil forces are widespread in Chinese society, and they even collude with some police and bureaucrats to exploit the people. As a huge cancer of society, the underworld has not only brought great harm to the lives and property of the Chinese people, but also affected the prosperity and stability of the entire society. People all gnashed their teeth and hated it, and they also had no trust in the government that was unable to control it or even colluded with it."
CHI_Crime_crackdown: "Crack down on crime and evil"
CHI_Crime_crackdown_desc: "Cut out sewer rats with a knife"
CHI_China_supports: "China Support"
CHI_China_supports_desc: "We received financial support from China"
CHI_Internet: "Chinese Internet"
CHI_Internet_desc: "China's Internet is the largest in the world. It has the largest number of Internet users and the widest network area. The Internet is increasingly changing people's learning, work and lifestyle, and even affecting the entire social process."
CHI_Political_support: "Political Support"
CHI_Political_support_desc: "As we strive to please the powerful in various ways, they will reward us with political support."
CHI_labour_law: "Labor law is in name only"
CHI_labour_law_desc: "China established the Labor Law as early as the 1920s. After the founding of the People's Republic of China, under the guidance of Marxism-Leninism, a series of laws were introduced to protect the rights and interests of workers in combination with China's actual situation. In the early 1990s, after the third drafting of the Labor Law, it was reviewed and passed by the Standing Committee of the National People's Congress on July 5, 1994. The promulgation of the Labor Law marks the entry of China's labor legal system into a new historical stage. However, there are frequent loopholes in the implementation of the Labor Law, and the authorities have not commented on the behavior of entrepreneurs violating the Labor Law, so that the Labor Law has almost become a dead letter in the face of national development, and the majority of working people are often unable to protect their legitimate labor rights and interests through legal procedures."
CHI_controlled_internet: "Controlled Internet"
CHI_controlled_internet_desc: "The chaos on the Internet has been controlled, and the network environment is becoming greener"
CHI_Freedom_of_speech: "Freedom of Speech: Liberate Thoughts"
CHI_Freedom_of_speech_desc: "Comrade Deng Xiaoping proposed: "Emancipating the mind, using our brains, seeking truth from facts, uniting as one and looking forward, first of all, is to emancipate the mind. Only when the mind is emancipated can we correctly use Marxism-Leninism and Mao Zedong Thought as our guide to solve the problems left over from the past, solve a series of new problems that have emerged, correctly reform the production relations and superstructure that are not compatible with the rapid development of productive forces, and determine the specific path, principles, methods and measures for realizing the four modernizations based on my country's actual conditions. "Since the reform and opening up, society has become more and more receptive to new things, and people have become accustomed to accepting any rapid changes and unconventional remarks."
CHI_people_oriented: "People-oriented development concept"
CHI_people_oriented_desc: "General Secretary Hu Jintao stressed the need to "uphold a people-oriented approach, establish a comprehensive, coordinated and sustainable development concept, and promote the all-round development of the economy, society and people""
CHI_scientific_outlook_on_development: "Communist Party of China"
CHI_scientific_outlook_on_development_desc: "The first principle of the Scientific Outlook on Development is development. Its core is people-oriented. Its basic requirement is comprehensive, coordinated and sustainable development. Its fundamental method is to take into account all factors. The Scientific Outlook on Development is the inheritance and development of the important ideas on development of the three generations of the Party's central leadership. It is a concentrated embodiment of the Marxist worldview and methodology on development. It is a scientific theory that is both in line with Marxism-Leninism, Mao Zedong Thought, Deng Xiaoping Theory and the important thought of "Three Represents" and keeps pace with the times. It is an important guiding principle for my country's economic and social development, a major strategic thought that must be upheld and implemented in developing socialism with Chinese characteristics, and a warm care that General Secretary Hu Jintao has left for the Chinese people."
CHI_fiscal: "Chinese Socio-Economic Policy"
CHI_fiscal_desc: "China is a society with a huge population. Any small variable will eventually aggregate into a huge social effect. Both social and economic policies need to be formulated and implemented with caution."
CHI_Socialist_Market_Economy: "Socialist Market Economy"
CHI_Socialist_Market_Economy_desc: "The socialist market economy is a market economy combined with the basic socialist social system, reflecting the fundamental nature of socialism. It is an economic system that enables the market to play a decisive role in resource allocation under the macroeconomic control of the socialist state. It enables economic activities to follow the requirements of the law of value and adapt to changes in supply and demand. It allocates resources to the most efficient links through price levers and competition mechanisms, and enables enterprises to implement the survival of the fittest. It uses the market's characteristics of being sensitive to various economic signals to promote the timely coordination of production and demand. The theory of socialist market economy is a highly innovative component of Deng Xiaoping's theoretical system and a revision of traditional economic theory. Based on this theory, the Chinese government has determined the reform goal of establishing a market economic system and has conducted unprecedented exploration in the history of China's national construction."
State_Grid_Corporation_idea: "State Grid of China"
State_Grid_Corporation_idea_desc: "Building an energy internet, ensuring national energy security, and serving the people's better life"
HKG_international_financial_center: "Hong Kong International Financial Center"
HKG_international_financial_center_desc: "Hong Kong is known as the "New York-London-Hong Kong" together with New York and London. It is the world's third largest financial center, an important international trade and shipping center, and an international innovation and technology center."
CHI_PLA_stationed_in_Hongkong: "Chinese People's Liberation Army stationed in Hong Kong"
CHI_PLA_stationed_in_Hongkong_desc: "According to the Law of the People's Republic of China on the Garrison of the Hong Kong Special Administrative Region, the PLA Hong Kong Garrison performs four defense duties: first, to guard against and resist aggression and safeguard the security of the Hong Kong Special Administrative Region; second, to perform defense duties; third, to manage military facilities; and fourth, to handle relevant foreign military affairs."
4trillion_investment_effect: "4 trillion investment impact"
4trillion_investment_effect_desc: "my country has injected a massive amount of funds of up to 4 trillion RMB into various fields, which will bring many economic impacts."
HKZM_Bridge: "Hong Kong-Zhuhai-Macao Bridge"
HKZM_Bridge_desc: "The Hong Kong-Zhuhai-Macao Bridge connects Hong Kong, Zhuhai and Macao, providing very convenient transportation conditions"
GBA_effect: "Hong Kong-Zhuhai-Macao Greater Bay Area"
GBA_effect_desc: "The construction of the Hong Kong-Zhuhai-Macao Greater Bay Area has brought huge development opportunities to Hong Kong and Macao"
CHI_gangland_2: "Evil forces hide"
CHI_gangland_2_desc: "Evil forces lurk in the shadows, waiting for their chance."
CHI_NSWT_centralline: "Construction of the Central Route of the South-to-North Water Diversion Project"
CHI_NSWT_centralline_desc: "The South-to-North Water Diversion Project is a far-reaching project"
CHI_monetary_policy: "China's Monetary Policy"
CHI_monetary_policy_desc: "Handy tool"
thirteenth_five_year_plan: "Thirteenth Five-Year Plan"
twelfth_five_year_plan: "Twelfth Five-Year Plan"
made_in_china: "Made in China"
made_in_china_desc: "In the past, in the eyes of foreigners, the Chinese market has long given people the impression that it is a "big factory" that produces and processes products for global companies. Various products with the "Made in China" label go from here to overseas markets, but there is almost nothing with independent creativity and leading advantages. But now, this situation has begun to change. We can proudly say that "Made in China" is synonymous with high quality and low price."
made_in_china_pro: "Intelligent Manufacturing in China"
made_in_china_pro_desc: "By developing advanced production technologies, establishing a complete industrial system and adopting efficient unmanned production methods, we will achieve an industrial miracle in the world. "Intelligent Manufacturing in China" will be the driving force behind the next productivity revolution."
Asian_Infrastructure_Investment_Bank_chairman: "Chairman of the Board of Governors of the Asian Infrastructure Investment Bank"
Asian_Infrastructure_Investment_Bank_chairman_desc: "The borders are divided by the mountains and rivers; the remote and desolate areas have different laws and policies than the Han and Xia. Therefore, the kings of the past ruled the country and won over the distant people. The principle was to keep them under control, not to make them vassals. He searched and reported, praising the success of the Xia Dynasty; he translated again, praising the long-term strategy of the Zhou State. Therefore, he pacified the country and met the needs of the time. He sent messengers to express goodwill, calm the chaos and calm the people. This is what happened. The world knows my intention clearly. All directions come to pay tribute, and all nations come to pay tribute."
Asian_Infrastructure_Investment_Bank_member: "Asian Infrastructure Investment Bank member"
Asian_Infrastructure_Investment_Bank_member_desc: "The country's economy is developing rapidly under China's massive investment plan"
CHI_coal_idea: "coal-driven economy"
CHI_coal_idea_desc: "Coal burns in thermal power plants, turning into energy and black smoke."
CHI_renewable_energy_idea: "China Renewable Energy"
CHI_renewable_energy_idea_desc: "China is the world's largest producer of renewable energy facilities"
CHI_renewable_energy_idea_2: "Green China"
CHI_renewable_energy_idea_2_desc: "China has become the world's largest producer and user of renewable energy"
CHI_Alipay_idea: "Digital Payment"
CHI_Alipay_idea_desc: "China is the world's largest user of mobile digital payments"
CHI_rump_of_Separatism: "Rump of Separatism"
CHI_rump_of_Separatism_desc: "The remnants of Separatism are plotting a comeback in some corners."
CHI_universal_Nepotism: "Universal Nepotism"
CHI_universal_Nepotism_desc: "Invite the emperor to reward you from ancient Longyang, don't be ashamed of being an official with nepotism"
APEC: "Asia-Pacific Economic Cooperation"
APEC_desc: "The organization has played an irreplaceable role in promoting regional trade and investment liberalization and strengthening economic and technical cooperation among members. It is a forum for promoting economic growth, cooperation, trade and investment among regions in the Asia-Pacific region."
CHI_SRAS_idea: "SARS virus"
CHI_SRAS_idea_desc: "The new virus is spreading rapidly"
CHI_labour_law_2: "Labor law has little appeal"
CHI_labour_law_2_desc: "Due to government propaganda, labor laws began to attract people's attention and imposed certain restrictions on labor-capital relations. However, no practical system was established to ensure the implementation of labor laws."
CHI_labour_law_3: "Labor law with a corporatist character"
CHI_labour_law_3_desc: "Labor law is used to protect the rights and interests of both labor and capital, while strictly prohibiting excessive behavior by both parties. This corporatist labor law ensures the stability of social development and protects the rights and interests of workers to a certain extent, but fundamentally denies the possibility and legitimacy of class struggle."
CHI_increase_social_cost_temporary: "Temporary increase in social security spending"
CHI_strong_our_government: "Strengthen our government"
CHI_modify_uighur_threat: "Separatist Threat"
CHI_modify_uighur_opinion: "Uighur public opinion"
CHI_Protecting_workers_idea: "Protecting workers"
CHI_Protecting_workers_idea_desc: "Protecting workers' rights"
CHI_Comfort_entrepreneurs_idea: "Comforting Entrepreneurs"
CHI_Comfort_entrepreneurs_idea_desc: "Comforting entrepreneurs"
CHI_Trade_Unions_idea: "Establishing a national trade union"
CHI_Trade_Unions_idea_desc: "Establishing a national trade union can effectively protect the rights of workers and supervise them to prevent them from taking radical actions."
CHI_Commission_of_Commerce_idea: "Commission of Commerce idea is being formed"
CHI_Commission_of_Commerce_idea_desc: "Establishing local commerce committees can maximize the vitality of market entities, coordinate government-business connections, and control the business behavior of entrepreneurs."
CHI_Supporting_foreign_countries_AIIB: "Supporting the development of foreign countries of the AIIB"
CHI_Supporting_foreign_countries_AIIB_desc: "We are mobilizing resources to help underdeveloped countries."
CHI_Provide_loans_AIIB: "Provide low-interest loans to AIIB members"
CHI_Provide_loans_AIIB_desc: "We are providing development loans to underdeveloped countries."
CHI_China_supports_AIIB: "AIIB development assistance"
CHI_China_supports_AIIB_desc: "China is supporting the country's development through the AIIB"
CHI_Low_interest_loans_AIIB: "Low interest loans from the AIIB"
CHI_Low_interest_loans_AIIB_desc: "China is providing low-interest loans to this country through the AIIB for development."
sanction_from_p5: "Sanctions from the United Nations Security Council"
sanction_from_p5_desc: "The United Nations Security Council considers our current actions illegal, so we are sanctioned."
Success_Keeping_the_Peace: "Successfully Keeping the Peace"
Success_Keeping_the_Peace_desc: "This country has recently been successful in maintaining regional stability and world peace."
chastity_paifang_2: "China"
chastity_paifang_2_desc: "The tree wants to be still, but the wind does not stop. The dust will not go away without a broom. The weapon of criticism cannot replace the criticism of weapons. The Chinese army will no longer stand trembling behind the border wall\n\nChina will maintain world peace at all costs, including §Rthe use of violence§!"
chinese_rule_all_the_land: "Great Unification"
chinese_rule_all_the_land_desc: ""
CHI_wind_farms: "Wind Farms"
CHI_offshore_wind_farms: "Offshore wind farms"
CHI_solar_farms: "Solar Power Farms"
CHI_solar_panels: "Solar Panels"
CHI_frontier: "Desertification and soil erosion"
CHI_frontier_desc: "The Loess Plateau region of China is heavily influenced by monsoons, resulting in concentrated rainfall. The loess, formed by sand deposits, is easily eroded by rainwater, and the addition of silt carried by rivers further exacerbates soil erosion.\nAnother major area affected by desertification is the Gobi Desert. Currently, the Gobi is the world's fastest-moving desert, swallowing over 3,350 square kilometers of land annually and destroying numerous villages along its path. Images currently show that the Gobi has expanded to the point where it could even accommodate the entirety of Croatia."
CHI_Prosperous_Frontier: "Prosperous Frontier"
CHI_Special_Economic_Zones: "Special Economic Zones"
CHI_Special_Economic_Zones_desc: "The establishment of special economic zones is a major decision and major step made by the CPC Central Committee and the State Council in accordance with Deng Xiaoping's advocacy, in the new historical conditions, in line with the new trend of the development of the world's political and economic situation, and on the basis of summarizing domestic and foreign experiences and lessons, in order to promote my country's reform and opening up and accelerate socialist modernization.\n\nIn May 1980, the CPC Central Committee and the State Council decided to rename the four export special zones of Shenzhen, Zhuhai, Shantou and Xiamen as special economic zones. In April 1988, the Hainan Special Economic Zone was added."
CHI_capital: "Capital"
CHI_capital_desc: "The peony in the courtyard is wild and has no style, the lotus in the pond is pure and has little emotion\nOnly the peony is the true national beauty, and the capital is moved when the flowers bloom"
CHI_Pudong_New_Area: "Pudong New Area"
CHI_Pudong_New_Area_desc: "The development and opening up of Pudong has driven Shanghai onto the path of overall transformation and has also injected new impetus into the reform and opening up of the entire Yangtze River Delta, the Yangtze River Basin, and even the whole country."
CHI_ancient_capital_of_thirteen_dynasties: "Ancient capital of thirteen dynasties"
CHI_ancient_capital_of_thirteen_dynasties_desc: "Tonight the moon is over Fuzhou, I am alone in my boudoir watching it. I feel sorry for my children, who have not yet learned to remember Chang'an."
CHI_hometown_of_Confucius: "Hometown of Confucius and Mencius"
CHI_hometown_of_Confucius_desc: "Isn't it a pleasure to learn and practice from time to time?\nIsn't it a pleasure to have friends coming from afar?\nIsn't it a gentleman to not be angry when people don't know him?"
CHI_Central_World: "Central World"
CHI_Central_World_desc: "The bright moon hides behind the tall trees, the long river sinks into the morning sky\nThe long road to Luoyang, when will we meet again?"
CHI_misty_rain_gusu: "Misty Rain Gusu"
CHI_misty_rain_gusu_desc: "Thousands of miles of warblers singing, green and red, water villages and mountain towns, wine flags fluttering in the wind\nFour hundred and eighty temples in the Southern Dynasties, many towers and pavilions in the mist and rain"
CHI_old_Shanghai: "Ten Miles of Foreign Land"
CHI_old_Shanghai_desc: "All of Wu is on the edge of the great sea, a hundred miles to the Shanghai Du\nSea creatures swarm together, and water monsters compete to seep in."
CHI_qiantang_fragrans_lotus: "Qiantang Fragrans Lotus"
CHI_qiantang_fragrans_lotus_desc: "A scenic spot in the southeast, the capital of the Three Wus, Qiantang has been prosperous since ancient times\nSmoky willows and painted bridges, wind curtains and green curtains, and hundreds of thousands of houses"
CHI_Medicine_Capital: "Huifeng Wanyun"
CHI_Medicine_Capital_desc: "The gate of heaven is broken and the Chu River is open. The clear water flows eastward and turns back here. The green mountains on both sides face each other, and a lone sail comes from the sun."
CHI_Mountain_Sea_Gallery: "Mountain and Sea Gallery"
CHI_Mountain_Sea_Gallery_desc: "Hundreds of green mountains and a river, ten miles of houses, the road goes around Nantai\nBanyan leaves fill the river, egrets fly, sparse curtains are half rolled up in the evening rain"
CHI_south_of_the_Five_Ridges_Pearl: "Pearl of Lingnan"
CHI_south_of_the_Five_Ridges_Pearl_desc: "The water level in the dark shoal has dropped and the empty sand has risen. The shoal is thousands of miles away from Qin and Wu.\nThe willows in the north of the Yangtze River have been broken by the horse, and the flowers in the south of the Lingnan have bloomed in the boat.\nThe farewell songs are endless as if to keep guests, and the dream of returning home is like arriving home.\nThe mountain bird sings but no one wakes up yet, and the spring moon is halfway across the horizon."
CHI_Guilin_Scenery: "Guilin Landscape"
CHI_Guilin_Scenery_desc: "Guilin's landscape is the best in the world, with jade-green and blue scenery."
CHI_magical_land_of_South_Sea: "Magical Land of South Sea"
CHI_magical_land_of_South_Sea_desc: "There is a magical land in the South Sea\nThe distance and the map are endless, the earth veins are connected\nThe mountains rise up to form Kunlun, and the water returns to form the Bohai Sea\nThe air is direct and concentrated, and the power is undivided and sufficient"
CHI_South_Colourful_Clouds: "Colorful Clouds in the South"
CHI_South_Colourful_Clouds_desc: "Yunnan has more streams, red gravel without mud\nMedicine is sold by Baxian, branches are full of Yue birds singing"
CHI_land_of_abundance: "Land of Abundance"
CHI_land_of_abundance_desc: "Yizhou is a land of natural resources and fertile fields. It is a land of abundance. Emperor Gaozu built his empire on it."
CHI_majestic_mountain_city: "Majestic Mountain City"
CHI_majestic_mountain_city_desc: "The moon on Mount Emei is half full in autumn, its shadow falls on the Pingqiang River.\nLeaving Qingxi to the Three Gorges at night, I miss you but you are not here in Yuzhou"
CHI_Natural_bonsai: "The Place Where the Four Crossings of the Chishui River Were Made"
CHI_Natural_bonsai_desc: "The west wind is strong, geese are calling in the sky, the frosty morning moon\nFrosty morning moon, the sound of horses' hooves is broken, the sound of trumpets is choked\nThe long and difficult road is as hard as iron, but now we start over\nStart over, the mountains are like the sea, the setting sun is like blood"
CHI_lotus_xiaoxiang: "Lotus Xiaoxiang"
CHI_lotus_xiaoxiang_desc: "Standing alone in the cold autumn, the Xiang River flows northward, at the head of Orange Island\nWatching the mountains turn red, the forests dyed; the river is clear and blue, hundreds of boats compete for the current\nEagles fly in the sky, fish swim in the shallows, all kinds of creatures compete for freedom in the frosty sky\nFeeling the vastness, asking the vast earth, who is in charge of the ups and downs?\n\nBringing hundreds of friends to travel\nRecalling the past, the glorious years\nJust like schoolboys, in the prime of life; scholars are full of vigor and vitality\nPointing out the mountains and rivers, inspiring words, despising the marquis of the past\nDo you remember, when you were in the middle of the stream, the waves stopped the flying boat?"
CHI_Thoroughfare_to_Nine_Provinces: "Thoroughfare to Nine Provinces"
CHI_Thoroughfare_to_Nine_Provinces_desc: "The ancients have gone away on the yellow crane, leaving only the Yellow Crane Tower\nThe yellow crane has gone and never returned, white clouds have drifted in the sky for thousands of years\nThe clear river reveals the trees of Hanyang, the fragrant grass covers the Parrot Island\nWhere is my hometown at dusk? The misty river makes me sad"
CHI_ancient_Yuzhang_county: "Yuzhang Ancient County"
CHI_ancient_Yuzhang_county_desc: "Yuzhang County, the old county, Hongdu, the new capital\nStars divide Yi and Zhen, the land connects Heng and Lu\nSurrounded by three rivers and five lakes, controlling the barbarians and Jing and attracting Ou and Yue\nThe natural resources are rich and the dragon's light shines on the ruins of Niu and Dou\nThe people are outstanding and the land is blessed, Xu Ru sleeps on Chen Fan's couch\nThe heroic state is shrouded in mist, and the outstanding talents are like stars"
CHI_situated_at_foot_of_hill_and_beside_river: "Mountains and rivers outside and inside"
CHI_situated_at_foot_of_hill_and_beside_river_desc: "The towering buildings and the great views stand in front of each other, and the mountains and rivers are from one side\nThe lights in the small market are on, and I am tempted to go home. I wear light clothes and stand by the door in the evening breeze."
CHI_Land_of_Lament_Songs: "Land of Lament Songs of Yan and Zhao"
CHI_Land_of_Lament_Songs_desc: "The wind is whistling and the Yi River is cold\nThe warrior will never return once he leaves"
CHI_Nine_rivers_return_to_sea: "Nine Rivers Return to Sea"
CHI_Nine_rivers_return_to_sea_desc: "The Yellow River divides the land, Feiguan connects to Tianjin\nA glance at the ancient literary legacy, a thousand years of solemnity like a god"
CHI_Republic_eldest_son: "Republic Eldest Son"
CHI_Republic_eldest_son_desc: "Our faces glow red\nOur sweat drips down\nWhy?\nFor liberation!\nWhy?\nFor liberation!\nHey! Hey!\nHey! Hey!\nFor the complete liberation of all China!"
CHI_Northern_Spring_City: "Northern Spring City"
CHI_Northern_Spring_City_desc: "Jilin is the real Jilin, Changbai Mountain is lush and steep\nIt was once a town, but it is not the same as it is now\nBinqi is far away, and the clouds and fog are deep\nI always remember the sky, and I admire the aspirations of Ming Yi"
CHI_Tracks_In_Snowy_Forest: "Snowy Forest"
CHI_Tracks_In_Snowy_Forest_desc: "Flying up in the morning, the sun rises and the sky clears, and the horse stops at noon.\nThe passenger's heart is as anxious as the water, and the voices of people can be heard across the river\nThe rain adds fresh air, and the wind creates ripples\nReturning home in the middle of the stream, the boat is steady, and I look forward to the coming group"
CHI_Hanhai_bright_pearl: "Hanhai Bright Pearl"
CHI_Hanhai_bright_pearl_desc: "Chi Le Chuan, under the Yin Mountains\nThe sky is like a dome, covering the four fields\nThe sky is vast, the fields are boundless, the wind blows the grass low and you can see cattle and sheep"
CHI_Jiangnan_beyond_Great_Wall: "Beyond the Great Wall"
CHI_Jiangnan_beyond_Great_Wall_desc: "The sky is high and the clouds are light, I can see the geese flying south\nIf you haven't been to the Great Wall, you are not a true man, I have traveled 20,000 kilometers\nOn the top of Liupan Mountain, the red flag is fluttering in the west wind\nToday, I have the long tassel in my hand, when will I tie up the blue dragon?"
CHI_gansu_impregnable_pass: "The Impregnable Pass on Longshan Mountain"
CHI_gansu_impregnable_pass_desc: "The Yellow River flows far away among the white clouds, a lonely city stands on a mountain of ten thousand feet\nWhy should the Qiang flute blame the willows, the spring breeze does not reach Yumen Pass"
CHI_Silk_Road_Pass: "Silk Road Pass to the West"
CHI_Silk_Road_Pass_desc: "In the daytime, I climbed the mountain to watch the beacon fire, and in the evening, I watered my horse beside Jiaohe River.\nTravelers fought in the dark wind and sand, and the princess played the pipa with sorrow.\nThere are no cities in the vast wild clouds, and the rain and snow fell on the desert.\nThe wild geese flew every night with mournful cries, and the Hu children shed tears.\nI heard that Yumen is still blocked, so I should follow the light carriage with my life.\nYear after year, the bones of the soldiers were buried in the wilderness, and only the rambutans were seen entering the Han family."
CHI_waterhead: "The source of all water"
CHI_waterhead_desc: "In the autumn at the far west, white birds fly, I lean on the railing to see the source of the river\nFor a long time, there has been no raft's shadow through the Milky Way, and I can see Huodun in the sky\nThe wind and waves in Qinghai have piled up rocks, and Yumen has half of the Central Plains\nKunlun was the road to the west, and I send a message to Tuyuhun in front of the mountain"
CHI_roof_of_the_world: "Roof of the World"
CHI_roof_of_the_world_desc: "Pure essence forms strange shapes, the bright sky is the edge\nThe jade peaks embrace the clear air, the lotus peaks bloom white flowers\nThe half rock is covered with clouds and snow, the high top is clear with mist and haze\nThe hotel is opposite at dawn and dusk, and it is like a fairyland"
CHI_Sea_Pearl: "Sea Pearl"
CHI_Sea_Pearl_desc: "When I was a child, homesickness was a small stamp. I was on this side, and my mother was on the other side. When I grew up, homesickness was a narrow boat ticket. I was on this side, and my bride was on the other side. Later, homesickness was a short grave. I was outside, and my mother was inside. Now, homesickness is a shallow strait. I am on this side, and the mainland is on the other side."
CHI_Pearl_of_the_East: "Pearl of the East"
CHI_Pearl_of_the_East_desc: "To things that change quickly\nAnd to things that never change\nThe spirit of Lion Rock spreads far and wide"
CHI_land_oyster_bank: "Land of Oyster Bank"
CHI_land_oyster_bank_desc: "Do you know that "Magang" is not my real name?\nI have been away from your arms for too long, mother!\nBut they took away my body\nYou still keep my soul\n\nMy biological mother whom I have never forgotten in the past three hundred years!\nPlease call me by my nickname\nCall me "Macau"!\nMother, I want to come back!\nMother!"
CHI_Shortage_of_water_resources: "Shortage of water resources"
CHI_Shortage_of_water_resources_desc: "While southern China has abundant water resources, water shortages are common in the notably arid north. Pollution from China's rapid industrialization has also led to water contamination, which does exist and exacerbates China's water shortages."
modifier_state_production_speed_agriculture_district_factor: "Commercial Agriculture District Construction Speed"
CHI_ETHOS: "Chinese Social Thought"
CHI_ETHOS_desc: "Different groups of people will have different social impacts according to their support level\n\n§YThis idea show the influence of $CHI_left_Name$ , $CHI_political_apathy_Name$ and $CHI_right_Name$§!"
CHI_PLA_in_the_New_Era: "Chinese People's Liberation Army"
CHI_Bobcat_all_terrain_vehicle: "Bobcat All Terrain Vehicle"
CHI_Bobcat_all_terrain_vehicle_desc: "Meow meow meow"
Consumer_goods_consumption: "Consumer Goods Consumption\n\n[?Consumergoods_consumption|R]"
Consumer_goods_consumption_desc: "[?Consumergoods_consumption|R]"
CHI_Communist_Party_of_China: "Communist Party of China"
CHI_Communist_Party_of_China_desc: "The Communist Party of China is the vanguard of the Chinese working class, the vanguard of the Chinese people and the Chinese nation, and the core of leadership for the cause of socialism with Chinese characteristics. It represents the requirements for the development of China's advanced productive forces, represents the direction of advance of China's advanced culture, and represents the fundamental interests of the vast majority of the Chinese people. The highest ideal and ultimate goal of the Communist Party of China is to realize communism. The central task of the Communist Party of China is to unite and lead the people of all ethnic groups in the country to fully build a modern socialist country, achieve the second centenary goal, and comprehensively promote the great rejuvenation of the Chinese nation with Chinese-style modernization.\n\nSince the founding of the People's Republic of China in 1949, the Communist Party of China has been the only ruling party in China."
CHI_Supercomputer: "China Supercomputer"
CHI_Supercomputer_desc: "In the past, Baoxishi first drew the Eight Trigrams to understand the virtues of the gods and to classify the emotions of all things. He also created the Nine-Nine Technique to match the changes of the Six Yaos."
CHI_the_arms_export_idea: "Weapons Export"
CHI_the_arms_export_idea_desc: "China is one of the world's largest arms exporters and military producers. The country is almost entirely self-sufficient in military output and is able to export this surplus to other countries around the world."
CHI_nanshuibeidiao_project: "South-to-North Water Diversion Project"
CHI_nanshuibeidiao_project_desc: "This province has been freed from water shortage due to the completion of the South-to-North Water Diversion Project."
CHI_OGAS_state: "OGAS"
CHI_OGAS_state_desc: "This province is connected to the national automation system."
American_economic_hegemony: "American economic hegemony"
American_economic_hegemony_desc: "The means of realizing American economic hegemony is the hegemony of the US dollar. The hegemony of the US dollar is the reflection of the world hegemony of the United States in the financial field, and it also provides important financial support for the world hegemony of the United States. Therefore, maintaining the hegemony of the US dollar is to maintain the world hegemony of the United States. To achieve this goal, the United States does not hesitate to use all means such as armed conflict, "financial war", "trade war", and does not hesitate to attack any country, including its own allies.\n\nAs the only political, economic and military superpower, the United States has huge overseas assets, and all countries in the world have become blood supply packages for the United States to varying degrees. The United States has a huge number of overseas contracted factories to support the rapid development of its economy, so that it is impossible for any country's industrial capacity to truly surpass the United States, unless the United States' triple hegemony of politics, economy and military is ended..."
Economically_advanced_countries: "Economically Advanced Countries"
Economically_advanced_countries_desc: "This country can enjoy more benefits from economic globalization, such as cheap international labor outsourcing or low-priced consumer goods imports, due to its inherently developed economy or its superior position in the US-dominated world system. But in the final analysis, this country is still highly dependent on the US-dominated world order, and when the US encounters problems, it will squeeze benefits from these countries.\n\n§RIf China's global influence is higher than that of the United States, this modifier will be invalid!§!"
Economic_dependency_countries: "Economically Dependent Countries"
Economic_dependency_countries_desc: "This country has in fact shown its obedience to the world economic system dominated by the United States and tried to integrate into this system. It uses its large and cheap labor force to continuously export cheap consumer goods to developed countries in exchange for more international investment and expansionary economic growth, but the price is the difficulty of industrial solidification and upgrading, and the loss of national independence and international discourse weight.\n\n§RIf China's global influence is higher than that of the United States, this modifier will be invalid!§!"
Economic_resources_dependency_countries: "Economically Dependent Countries"
Economic_resources_dependency_countries_desc: "This country has in fact shown its obedience to the world economic system dominated by the United States and tried to integrate into this system. It uses its rich mineral resources to continuously supply low-priced raw materials to developed countries for export in exchange for more international orders, but the price is the difficulty of industrial solidification and upgrading, and the loss of national independence and international discourse weight.\n\n§RIf China's global influence is higher than that of the United States, this modifier will be invalid!§!"
Confronting_the_USA_countries: "Confronting the US-dominated international system"
Confronting_the_USA_countries: "Confronting the US-led international system"
Confronting_the_USA_countries_desc: "This country is against the US-led world system, and has been sanctioned and suppressed by the US, which has hindered its economic, social and domestic development."
Domestic_consumption: "Domestic consumption"
Domestic_consumption_desc: "Each country will have a certain consumption based on its total population and per capita GDP. Whether it is self-sufficient or imported from abroad, if the supply cannot meet domestic consumption demand, it will bring many negative effects.\n---------------------------------\n\n§WProduction and consumption details:\n§Y£steel_texticon£ Steel§!:\nDue to §YNumber of military factories§! Affected by: [?steel_consumption_military|-=3]\nDue to §YNumber of civilian factories§! Affected by: [?steel_consumption_industrial|-=3]\n\n§Y£consumer_goods_texticon£ Consumer goods§!:\nDue to §YPopulation base§! Affected by: [?good_consumption_pop|-=3]\nDue to §YPer capita GDP§! Affected by: [?good_consumption_gdp|Y2 %]\nDue to §YNational Productivity§!: [?good_consumption_productivity|Y2%]\nDue to §YTechnology, Laws, National Spirit, etc.§!: [?good_consumption_multiplier_modifier_show|-=2%]\nDue to §YOffice Employment§!: [?good_consumption_office|-=3]\nDue to §YCivilian Factory Employment§!: [?good_consumption_civ|-=3]\nDue to §YTechnology, Laws, National Spirit, etc.§!: [?good_consumption_add_modifier|-=3]\n\n§Y£service_texticon£Service§!: \nDue to §YPopulation Base§!: [?service_consumption_pop|-=3]\nDue to §YGDP Per Capita§!: [? service_consumption_gdp|Y2%]\nDue to §YMedical and Education Budget§!: [?service_consumption_budget|Y2%]\nDue to §YNational Productivity§!: [?service_consumption_productivity|Y2%]\nDue to §YTechnology, Laws, National Spirit, etc.§!: [?service_consumption_multiplier_modifier_show|-=2%]\nDue to §YOffice Employment§!: [?service_consumption_office|-=3]\nDue to §YCivilian Factory Employment§!: [?service_consumption_civ|-=3]\nDue to §YTechnology, Laws, National Spirit, etc.§!: [?service_consumption_add_modifier|-=3 ]\n\n§Y£grain_texticon£ Food§!:\nDue to §YPopulation base§! influence: [?food_consumption_pop|-=3]\nDue to §YGDP per capita§! influence: [?food_consumption_gdp|Y2%]\nDue to §YTechnology, Laws, National Spirit, etc.§! influence: [?food_consumption_multiplier_modifier_show|-=2%]\nDue to §YNon-commercial agriculture population§! influence: [?food_consumption_agriculture|-=3]\nDue to §YCommercialized agriculture population§! influence: [?food_consumption_agriculture_commercialized|-=3]\nDue to §YTechnology, Laws, National Spirit, etc.§! influence: [?food_consumption_add_modifier|-=3]§!"

