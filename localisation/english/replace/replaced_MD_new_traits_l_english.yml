##aerospace##
cnsa.1.t:0 "China completes first manned space flight"
cnsa.1.d:0 "The Shenzhou V manned spacecraft independently developed by China was successfully launched at the Jiuquan Satellite Launch Center using the Long March 2F carrier rocket, sending China's first astronaut Yang Liwei into space. The spacecraft accurately entered the predetermined orbit. This is China's first manned space flight, making it the third country in the world capable of independently carrying out manned space activities."
cnsa.1.a:0 "Space travel has no borders"
cnsa.1.b:0 "Great Deeds"
cnsa.2.t:0 "Shenzhou VI manned flight"
cnsa.2.d:0 "Shenzhou VI is China's first spacecraft to carry out a "multi-person, multi-day" mission. The spacecraft was launched from the Jiuquan Satellite Launch Center in China and landed in Siziwang Banner, Inner Mongolia five days later. The astronauts were Fei Junlong and Nie Haisheng. This marks another milestone in China's development of manned space flight."
cnsa.2.a:0 "Space travel has no borders"
cnsa.2.b:0 "A Milestone"
cnsa.3.t:0 "Chinese astronauts' first spacewalk"
cnsa.3.d:0 "Shenzhou VII is China's third manned spacecraft and one of the "Shenzhou" series of spacecraft. It was launched from the Jiuquan Satellite Launch Center in China. Shenzhou VII carried three astronauts, namely Zhai Zhigang (commander), Liu Boming and Jing Haipeng. After taking off, Zhai Zhigang and Liu Boming wore the Chinese-made "Feitian" extravehicular space suit and the Russian-made "Haiying" extravehicular space suit respectively and entered the orbital module of the Shenzhou VII manned spacecraft, which also served as the airlock. Zhai Zhigang performed the extravehicular operation and Liu Boming assisted in the orbital module, realizing the first spacewalk in Chinese history, making China the third country capable of sending astronauts into space and walking in space."
cnsa.3.a:0 "A Challenging Mission"
cnsa.3.b:0 "Major Breakthrough"
cnsa.4.t:0 "China launches first lunar exploration satellite"
cnsa.4.d:0 "Chang'e-1 is the first man-made satellite orbiting the moon in China's lunar exploration program. [GetDateText], Chang'e-1 was launched from the Xichang Satellite Launch Center. The success of Chang'e-1's first lunar exploration established the third milestone of China's space program, breaking through a large number of core technologies and key technologies with independent intellectual property rights, making China one of the few countries in the world with deep space exploration capabilities."
cnsa.5.t:0 "China launches Chang'e 2 probe"
cnsa.5.d:0 "Chang'e 2 is China's second lunar satellite. It is a technical improvement of the backup satellite of Chang'e 1 in the first phase of the lunar exploration project. It is the pilot satellite of the second phase of the project and is named Chang'e 2. Chang'e 2 is mainly used to test and verify some new technologies and equipment, reduce the risks of future projects, and deepen the scientific exploration of the moon."
cnsa.5.a:0 "Ambitious"
cnsa.5.b:0 "Our journey is to the sea of stars"
cnsa.4.a:0 "Ambitious"
cnsa.4.b:0 "This is our thousand-year ideal"
cnsa.6.t:0 "Tiangong-1 Launched"
cnsa.6.d:0 "China launched its first newly developed target spacecraft, Tiangong-1, into space using the Long March 2F T1 carrier rocket at the Jiuquan Satellite Launch Center. As a target spacecraft, Tiangong-1 is different from the Skylab or the core and experimental modules of the space station. Its purpose is only to serve as a junction for other spacecraft and it will not stay in space for a long time."
cnsa.6.a:0 "We must pay attention to China's development in space"
cnsa.6.b:0 "Our journey is to the sea of stars"
cnsa.7.t:0 "Shenzhou 8 mission is successful"
cnsa.7.d:0 "Shenzhou VIII is an unmanned spacecraft launched by China. After completing the rendezvous and docking with the previously launched Tiangong-1, Shenzhou VIII automatically returned to Earth. Subsequently, Chang Wanquan, commander-in-chief of China's manned space program and director of the General Armament Department, announced that according to the landing site report, the return capsule of the Shenzhou VIII spacecraft has landed safely at the main landing site in Inner Mongolia. The space rendezvous and docking mission between Tiangong-1 and Shenzhou VIII was a complete success, completing China's first space rendezvous and docking experiment."
cnsa.7.a:0 "Another breakthrough in Chinese space technology"
cnsa.7.b:0 "We are one step closer to completing our space station"
cnsa.8.t:0 "Shenzhou 9 Launched"
cnsa.8.d:0 "The Long March 2F Yao-9 rocket carrying the Shenzhou 9 spacecraft took off from the Jiuquan Satellite Launch Center. This is the 165th launch of the Long March rocket and the fourth manned flight of the Shenzhou spacecraft. At this moment, Tiangong-1 is waiting in space about 10,000 kilometers away from the spacecraft for the Shenzhou 9 to "come to the appointment.""
cnsa.8.a:0 "Another breakthrough in Chinese space technology"
cnsa.8.b:0 "Women are as good as men"
cnsa.9.t:0 "Shenzhou 9 mission is successful"
cnsa.9.d:0 "Today, Shenzhou 9 returned to the motherland with three space heroes on board. The mission was a complete success. The complete success of Shenzhou 9's mission marks a major achievement in the second step of the manned space program and lays a good foundation for the future development of manned space flight and the construction of space stations."
cnsa.9.a:0 "Another breakthrough in Chinese space technology"
cnsa.9.b:0 "Return of the Heroes"
cnsa.10.t:0 "Shenzhou 10 mission is successful"
cnsa.10.d:0 "Shenzhou-10 is the tenth mission of China's "Shenzhou" series spacecraft and the fifth mission of China's manned space flight. It carries three astronauts to conduct unmanned and manned rendezvous and docking with the Tiangong-1 target spacecraft. After the successful docking, two male and one female astronauts entered Tiangong-1. This is the last docking mission between the Shenzhou spacecraft and Tiangong-1. The spacecraft consists of a propulsion module (service module), a return module, and an orbital module. Including the launch and return, Shenzhou-10 will be in orbit for about 15 days, including 12 days in Tiangong-1. Its return module will land at the Siziwang Banner landing site in Inner Mongolia."
cnsa.10.a:0 "Another breakthrough in Chinese space technology"
cnsa.10.b:0 "Heroes Return"
