CHI_Social_trends_category: "Chinese Social Trends"
CHI_Social_trends_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_sichao\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]China§! is a country with a population of over one billion. Although the government always emphasizes and attaches importance to §Hideological propaganda§!, it is impossible to make all the people of such a large country agree on §Ha certain set of values§!. Although most Chinese are §gpolitically apathetic§! and do not have much opinion on the country's policies, if the living environment §Rchanges too much§!, even the most dull-witted people will §Hstart to think§! . \n\nKing Wuling of Zhao once said: §CThe merit of following the law is not enough to elevate the world; the learning of the ancients is not enough to control the present§!. The millennium is a time of rapid change. China needs to treat domestic policies §Ycautiously§! in this era of change. For China, if the reform is too slow, it may be §gtoo late to regret§!; if the reform is too radical, it will be tantamount to §Rself-destruction§!. \n\n§Y[CHI.GetFlag]China§!'s people's thoughts can be roughly divided into three categories: §C$CHI_left_Name$§! who seeks change, §g$CHI_political_apathy_Name$§! who have no systematic views, and §O$CHI_right_Name$§! who seek to maintain the status quo. \n\n§YDomestic factions:§!\n §C$CHI_left_Name$:§!\n Proportion: [?left_bian|C]%  Satisfaction rate: [?left_Support|Y]% \n §g$CHI_political_apathy_Name$:§!\n Proportion: [?political_apathy|g]%  Satisfaction rate: [?political_apathy_Support|Y]% \n §O$CHI_right_Name$:§!\n Proportion: [?right_bian|O]%  Satisfaction rate: [?right_Support|Y]% \n\n§C$CHI_left_Name$§!($CHI_left_Name_Abbreviation$) are a relatively advanced group in China. They will examine the differences between the §CWestern world§! and §RChina§! based on their satisfaction. If they find the §Ycurrent situation§! §Cexciting§!, they will §Ccriticize the influence of Western ideology§! on our country and actively participate in building a §Cinnovative society§!\n\n§g$CHI_political_apathy_Name$§!($CHI_political_apathy_Name_Abbreviation$) are the §gsilent majority§!. They will express their §Ysupport for the authorities§! based on their satisfaction, and decide whether to actively pay §gmore taxes§! and §gCooperate with the government in administrative§! work\n\n§O$CHI_right_Name$§!($CHI_right_Name_Abbreviation$) are §Oa considerable part of the population§! in China. They §Ooppose radical changes§! and hope that the government can create a §Oharmonious, stable and beautiful§! society. They will help §Omaintain social stability§! and §Oresist the ideological impact of the Western world on our country§! based on their satisfaction.\n\nThe number of supporters and satisfaction of social thoughts will change with §Hnational policies§! and §Remergencies§!. If the satisfaction is less than §Y50%§!, it is considered that the group is §Runhappy§! with the current situation. If the parties are §Runhappy§! with the current situation, it will have the opposite effect and trigger certain §Rnegative social events§! \n\n§Y[CHI.GetFlag]China§! is a huge ship that must be kept §Ysmoothly running§!. Once it is not careful, it will fall into a situation of §Rendless disaster§!, and the grand journey of §Ythe great rejuvenation of the Chinese nation§! will also §Rcome to naught§!\n"
