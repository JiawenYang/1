CHI_Hanxin_Event_Effect: "Chip counterfeiting"
CHI_Hanxin_Event_Effect_desc: "The chip counterfeiting incident has caused people to have deep doubts about the authenticity and reliability of scientific research projects, greatly affecting the healthy development of the entire scientific research ecosystem and seriously hindering the development of independent chips."
USA_Stock_market_circuit_breaker: "Stock market circuit breaker"
USA_Revolving_Door: "The Revolving Door"
USA_Revolving_Door_desc: "There are a large number of lobbying groups and individuals in the United States, a considerable number of which are composed of former government officials. They use their personal connections to serve specific interest groups and receive high salaries. At the same time, many people in the private sector are absorbed by the government and become government officials.\nThis completely legal switching back and forth from the private sector to the public sector is vividly called the "revolving door.""
USA_Medical_Insurance_Complex: "Medical-Insurance Complex"
USA_Medical_Insurance_Complex_desc: "The medical-insurance complex is an interest group closely linked by doctors, pharmaceutical companies and insurance companies. It has led to an increase in the proportion of medical support to GDP and a life expectancy that is inconsistent with its expenditure. The increasingly unbearable medical expenses are the main reason for the direct bankruptcy of American citizens, and there are tens of thousands of deaths caused by insufficient medical expenses."
SARS_COV_2019_died_endurance_exceeds: "Exceeds the limit of tolerance."
SARS_COV_2019_died_endurance_exceeds_desc: "The severity of the current COVID-19 epidemic has exceeded the limit of tolerance."
