AIIB_category: "Asian Infrastructure Investment Bank"
AIIB_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_AIIB\n\n\n\n\n\n\n\n\n\nThe §YAsian Infrastructure Investment Bank§!, also known as the §YAIIB§!, is an intergovernmental multilateral development institution in Asia. It focuses on supporting §Yinfrastructure construction§! and is established to promote the process of interconnection and economic integration in the Asian region and to strengthen cooperation between China and other Asian countries and regions. It is the first multilateral financial institution initiated by §YChina§! and is headquartered in §YBeijing§!. The emergence of the §YAsian Infrastructure Investment Bank§! is a response to the trend of economic globalization. It has not only promoted the improvement of relations between member countries, but also significantly increased §Y[CHI.GetFlag]China§!'s influence in the §Yglobal§!.\n\nThe likelihood of countries applying to join depends on the §Y$modify_chinese_aggression$§! and §YGlobal Influence Score§Y."
