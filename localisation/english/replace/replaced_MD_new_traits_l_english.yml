#Unique Buildings
landmark_DLYTridge: "Bohai Cross-Sea Bridge"
landmark_DLYTridge_desc: "The bridge shortens travel time between Liaoning and Shandong regions, creating favorable conditions for economic activities."
landmark_TWFZridge: "Taiwan-Fuzhou Cross-Sea Bridge"
landmark_TWFZridge_desc: "The bridge shortens travel time between Taiwan Island and the mainland, creating favorable conditions for economic activities."
landmark_HZMBridge: "Hong Kong-Zhuhai-Macao Bridge"
landmark_HZMBridge_desc: "The Hong Kong-Zhuhai-Macao Bridge is a bridge-tunnel project in the People's Republic of China that connects Hong Kong, Zhuhai, Guangdong, and Macao. It is located in the Lingdingyang waters of the Pearl River Estuary in Guangdong and is the southern section of the Pearl River Delta Ring Expressway. The Hong Kong-Zhuhai-Macao Bridge starts from the Hong Kong Port artificial island near the Hong Kong International Airport in the east, crosses the Lingdingyang waters of the South China Sea to the west to connect the Zhuhai and Macao artificial islands, and ends at the Zhuhai Hongwan Interchange. The total length of the bridge and tunnel is 55 kilometers, of which the main bridge is 29.6 kilometers and the Hong Kong Port to the Zhuhai-Macao Port is 41.6 kilometers. The bridge deck is a two-way six-lane expressway with a design speed of 100 kilometers per hour. The bridge shortens the travel time in these areas and creates favorable conditions for economic activities."
landmark_ThreeGorgesDam: "Three Gorges Dam"
landmark_ThreeGorgesDam_desc: "The eastern end of the Three Gorges Reservoir, which controls a drainage area of about 1 million square kilometers, was built in 1994. It integrates flood control, power generation, shipping, and water resource utilization. It is the main project of the Three Gorges Hydropower Station, the core landscape of the Three Gorges Dam Tourist Area, and one of the largest water conservancy hubs in the world today."
landmark_ChinaNationalPavilion: "World Expo China Pavilion"
landmark_ChinaNationalPavilion_desc: "The China National Pavilion at the 2010 Shanghai World Expo takes the Chinese wisdom in urban development as its theme, and demonstrates the Chinese cultural spirit and temperament of "the crown of the East, the flourishing China, the granary of the world, and the prosperity of the people". It is divided into two parts: the national pavilion and the regional pavilion. The main body is majestic and powerful, like a towering crown and a granary of the world; the platform base of the regional pavilion gathers people, implying that the society benefits the country and the four directions are rich."
landmark_BirdNestStadium: "Bird's Nest Stadium"
landmark_BirdNestStadium_desc: "The National Stadium, also known as the Bird's Nest, is located in the southern part of the central area of Beijing Olympic Park. It is the main stadium for the 2008 Beijing Olympic Games. The stadium is shaped like a "nest" and cradle for nurturing life, and it carries mankind's hope for the future. The designers did not do any unnecessary processing to the venue, leaving the structure exposed, thus naturally forming the appearance of the building."
landmark_OrientalPearl: "Oriental Pearl"
landmark_OrientalPearl_desc: "The Oriental Pearl TV Tower, or "Oriental Pearl" for short, is located at No. 1 Century Avenue, Lujiazui, Pudong New Area, Shanghai. It is located on the bank of the Huangpu River, with the modern buildings in Lujiazui behind it and the Bund International Architecture Exhibition Group across the river. Construction began on July 30, 1991 and was completed and put into use on October 1, 1994. It is one of the landmark buildings in Shanghai that integrates urban sightseeing, fashionable dining, shopping and entertainment, historical exhibitions, Huangpu River tours, exhibitions and performances, and radio and television transmission."
landmark_Tiananmen: "Tiananmen"
landmark_Tiananmen_desc: "The Tiananmen Gate Tower is the symbol of the People's Republic of China. Its solemn image is an important part of the Chinese national emblem. In front of it is the open Tiananmen Square. Tiananmen Square is the largest urban square in the world. After many modifications and changes, it finally formed a scale of 880 meters long from north to south, 500 meters wide from east to west, and an area of 440,000 square meters. In the square, along the central axis of Beijing from north to south, stand important buildings such as the national flagpole, the Monument to the People's Heroes, the Chairman Mao Memorial Hall and the Zhengyangmen Gate Tower."
landmark_GreatWall: "The Great Wall"
landmark_GreatWall_desc: "The Great Wall is an ancient Chinese military fortification. It is a tall, solid and continuous wall used to limit the movement of enemy cavalry. The Great Wall is not a simple isolated wall, but a defense system with walls as the main body and a large number of cities, barriers, pavilions and signs. The history of the Great Wall can be traced back to the Western Zhou Dynasty. It has been continuously built for more than 2,000 years and is distributed in the vast land of northern and central China. The total length is more than 20,000 kilometers."
landmark_SouthToNorthDiversion: "South-to-North Water Diversion Project"
landmark_SouthToNorthDiversion_desc: "The South-to-North Water Diversion Project is a fundamental project to optimize water resources allocation and promote regional coordinated development. Through the connection of three water diversion routes with the Yangtze River, Yellow River, Huai River and Haihe River, it forms an overall layout with "four horizontal and three vertical" as the main body, which is conducive to the reasonable allocation of China's water resources from north to south and from east to west."
landmark_PotalaPalace: "Potala Palace"
landmark_PotalaPalace_desc: "The Potala Palace is the winter palace of successive Dalai Lamas. It was also the theocratic ruling center of the local Tibetan rulers in the past. Starting from the Fifth Dalai Lama, major religious and political ceremonies were held here. It is also the place where the stupas of successive Dalai Lamas are enshrined. The architecture and cultural relics in the Potala Palace embody the political, economic and cultural exchanges among the various ethnic groups in China, proving that Tibet has been an inseparable part of China since ancient times."
landmark_SunYatSenMemorial: "Sun Yat-sen Memorial Hall"
landmark_SunYatSenMemorial_desc: "The Sun Yat-sen Memorial Hall is one of the most iconic buildings in Guangzhou. It was built by Guangzhou people and overseas Chinese in memory of Dr. Sun Yat-sen. The main building covers an area of 12,000 square meters and is 52 meters high. It is an octagonal ancient palace-style building. It adopts steel trusses and reinforced concrete structures. It consists of four palace-style double-eaved hip-and-gable buildings in the front, back, left and right. The roof of the hall is covered with royal blue glazed tiles, and the tiles are divided into four layers of high and low, with layers of flying eaves. There is no pillar in the building space with a span of 71 meters in the hall, which is magnificent and magnificent."
