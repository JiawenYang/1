#describe#
CHI_GR_MILLENNIUM_DAWN_DESC: "§YOnly a nation that has created glory can understand the meaning of rejuvenation; only a nation that has experienced suffering can have such a deep desire for rejuvenation§!\n\nAfter the Opium War in 1840, §RChina§! gradually became a semi-colonial and semi-feudal society. The country was humiliated, the people suffered, and the civilization was covered in dust. The Chinese nation suffered an unprecedented disaster. Since then, realizing the great rejuvenation of the Chinese nation has become the greatest dream of the Chinese people and the Chinese nation. Due to the invasion of Western powers and the corrupt feudal rule, since modern times, §RChina§! has fallen into a backward and beaten situation. , struggling in the dark abyss of a semi-colonial and semi-feudal society, the Chinese people entered the 20th century with the humiliation of their capital being occupied by the Eight-Power Allied Forces. §!\n\nHowever, the temporary darkness is not an endless long night. After the establishment of the §RPeople's Republic of China§! in 1949, China has since gotten rid of the fate of being colonized, and the Chinese people no longer have to live by the faces of foreigners. The great leader §RChairman Mao Zedong§! led hundreds of millions of Chinese people to independently and self-reliantly embark on a §Ydevelopment path that belongs to China§!, and achieved remarkable construction results. Thus, it proved to the world that China is a §Ypeace-loving§! country, and development does not require aggression and exploitation of other countries. Since 1978, the §Yreform and opening-up policy§! has enabled China's economic potential to be developed unprecedentedly, and China's presence on the world stage has become increasingly clear, and China's voice has gradually become louder. Hosting the Asian Games, the Yangtze River flood, the return of Hong Kong and Macao, the grand military parade on the 50th anniversary of the founding of the People's Republic of China...§YThe Chinese people entered the 21st century with the confidence to prosper the country through adversity. §!\n\nRealizing the §Ygreat rejuvenation of the Chinese nation§! is the greatest dream of the Chinese nation in modern times. Once established, the §RCommunist Party of China§! took the realization of §Rcommunism§! as the party's highest ideal and ultimate goal, unswervingly shouldered the historical mission of §Yrealizing the great rejuvenation of the Chinese nation§!, united and led the people in arduous struggles, and wrote a magnificent epic that swallowed mountains and rivers. \n\n§YToday, the Chinese people are closer, more confident and more capable of achieving the goal of the great rejuvenation of the Chinese nation than at any time in history. At the advent of the millennium, the Communist Party of China and the Chinese people are ready to move towards a new era. §!"

MILLENNIUM_DAWN: "Millennium Dawn"
MILLENNIUM_DAWN_DESC: "It has been nearly a decade since the end of the Cold War. After the collapse of the Soviet hegemony, a new international order has been established. The United States has firmly sat on the throne of hegemony and enjoyed the economic prosperity brought by the Internet economy. The Western Christian world welcomed the prosperous and stable millennium under the blessing of the Bible, while the Islamic world was mired in poverty and turmoil. Japan, which was once in its heyday, struggled to move forward after the bubble burst. After the impact of the Asian financial crisis in 1997, the glorious status of the four Asian tigers was gradually overshadowed by the roaring factories of China, which was gradually stepping onto the center of the world stage. The Soviet legacy has been divided up, and the new president, who was a former spy, took over a dying corpse. North Korea has embarked on the road of hardship, while South Korea's economy continues to grow rapidly. Africa is caught in chaos and poverty. The world is in a new era of coexistence of turmoil and peace."


#news#
chi_millennium.1: "United Nations Millennium Summit"
chi_millennium.1.t: "The United Nations Millennium Summit is held"
chi_millennium.1.d: "From September 6 to 8, 2000, the Millennium Summit of the United Nations was held at the United Nations Headquarters in New York. The theme of the meeting was "The Role of the United Nations in the 21st Century". It is said that this meeting was proposed by China. During the three-day meeting, the heads of state and government of various countries exchanged views on the theme of "The Role of the United Nations in the 21st Century" on issues such as maintaining world peace, promoting development, establishing a new international political and economic order, and strengthening the role of the United Nations under the new situation. Chinese President Jiang Zemin attended the meeting and delivered an important speech at the meeting, and elaborated on China's position on a series of issues such as maintaining the purposes and principles of the Charter of the United Nations.\n\nThe meeting pointed out: "No country or organization can solve all these problems alone. However, if any country's government and citizens do not devote themselves to this task wholeheartedly, they should not assume that others will solve these problems for it. Building a 21st century that is safer and fairer than the 20th century is a job that requires every country and every person to make firm efforts to do well. ""
chi_millennium.1.a: "Well said"
chi_millennium.1.b: "Chairman Jiang stole the show at the meeting!"

