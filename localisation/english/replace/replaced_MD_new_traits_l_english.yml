CHI_Belt_and_Road_Initiative_other_desc: "The country has engaged in economic cooperation with China through the Belt and Road Initiative."
CHI_Chastity_Paifang: "[ROOT.CHI_Chastity_Paifang_NAME]"
CHI_Chastity_Paifang_desc: "§W$CHI_Chastity_Paifang_war_willingness_effect_tt$§!\n\n[ROOT.CHI_Chastity_Paifang_DESC]"
CHI_Chastity_Paifang_war_willingness_effect_tt: "If a §YOffensive War§! is declared, the following effects will be applied:\n$MODIFIER_STABILITY_FACTOR$: [?copy_CHI_Chastity_Paifang_stability_factor|+=%]\n$MODIFIER_war_support_modifier$: [?copy_CHI_Chastity_Paifang_war_support_factor|+=%]\n$MODIFIER_RESEARCH_SPEED_FACTOR$: [?copy_CHI_Chastity_Paifang_research_speed_factor|+=%]\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: [?copy_CHI_Chastity_Paifang_production_speed_buildings_factor|+=%]\n$MODIFIERS_ARMY_ATTACK_FACTOR$: [?copy_CHI_Chastity_Paifang_army_attack_factor|+=%]\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: [?copy_CHI_Chastity_Paifang_army_defence_factor|+=%]\n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: [?copy_CHI_Chastity_Paifang_army_core_attack_factor|+=%]\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: [?copy_CHI_Chastity_Paifang_army_core_defence_factor|+=%]"
CHI_Chastity_Paifang_1: "Peaceful Coexistence"
CHI_Chastity_Paifang_1_desc: "The 21st century is a century of peace and development, at least that's what most people currently believe. If we want to make the entire society disappointed with the existing world order and actively devote itself to changing it, we still need to make considerable efforts and work. \n\nCurrent $CHI_Chastity_Paifang_war_willingness$: [?CHI_Chastity_Paifang_war_willingness|Y]，Last month changed :[?CHI_Chastity_Paifang_war_willingness_show|+=2]"
CHI_Chastity_Paifang_2: "The Rise of China"
CHI_Chastity_Paifang_2_desc: "The tree wishes for stillness, but the wind does not stop. The dust will not disappear until the broom arrives. The weapon of criticism cannot replace the criticism of the weapon. This unjust world order has plagued the world for too long!\n\nCurrent $CHI_Chastity_Paifang_war_willingness$: [?CHI_Chastity_Paifang_war_willingness|Y]，Last month changed :[?CHI_Chastity_Paifang_war_willingness_show|+=2]"
CHI_Chastity_Paifang_war_willingness: "Overall war willingness"
war_willingness_monthly_add: "Monthly $CHI_Chastity_Paifang_war_willingness$"
war_willingness_monthly_mult: "Monthly $CHI_Chastity_Paifang_war_willingness$"
CHI_Chastity_Paifang_war_willingness_change_effect_tt: "$CHI_Chastity_Paifang_war_willingness$ will change: [?temp|+Y] (Current: [?CHI_Chastity_Paifang_war_willingness|Y])"
CHI_Ratification_of_WTO_EFFECT_TT: "This will help us §Gsolve§! the $CHI_backwash_of_big_layoff$."
CHI_XinJiang_Situation: "Xinjiang Situation"
CHI_XinJiang_Situation_desc: "The threat level of local extreme separatist activities directly affects our level of control over the region and seriously hinders the normal economic order in the region.\n\n§YSeparatist Threat§!: [?CHI.uighur_threat|%%]\n§YUighur Public Opinion§!: [?CHI.uighur_opinion|%%]\n§YChange in Separatist Threat Last Month§!: [?CHI.uighur_threat_change|-=%%]"
MDGR_Falsifying_GDP_modifier: "Falsifying GDP"
MDGR_Falsifying_GDP_modifier_desc: "With a little statistical magic, we can create miracles with GDP figures."
MDGR_AIIB_modifier: "Asian Infrastructure Investment Bank"
MDGR_AIIB_modifier_desc: "The Asian Infrastructure Investment Bank is an intergovernmental multilateral development institution in Asia that aims to promote connectivity and economic integration in the region. Some see it as a way for China to expand its global influence.\n[ROOT.AIIB_adjective_desc]"
AIIB_adjective_chairman_desc: "As chair, we can increase our global influence by providing aid to other countries, but at the cost of temporarily reducing the positive effects of this modifier. There are currently [?ROOT.AIIB_member_num|Y0] members."
AIIB_adjective_member_desc: "As a AIIB member, we can choose to accept aid from the chair, but at the cost of losing our independence."
MDGR_unprepared_for_war: "Unprepared for War"
MDGR_unprepared_for_war_desc: "Our military systems are not yet ready for a full-scale war."
