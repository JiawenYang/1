CHI_category_PRC_USA_relations: "Sino-US relations"
CHI_category_PRC_USA_relations_desc: "\n\n\n\n\n\n\n£MAIN_desctext_CHI_USA\n\n\n\n\n\n\n\n\n\nHow will the world's largest industrial country and the only superpower get along? The relationship between §Y[CHI.GetFlag][CHI.GetName]§! and §Y[USA.GetFlag][USA.GetName]§! is undoubtedly the most important in the international community, and it invisibly affects every aspect of other countries. If China and the United States get along well, the world will share peace and prosperity. However, if the friction between the two countries continues, §Rothers will be affected§!.\n \n$modify_chinese_aggression$: [?CHI.chinese_aggression|Y0]\n§Y[CHI.GetFlag][CHI.GetName]§! global Influence Score is: [?CHI.hegemony_victory|Y1]\n§Y[USA.GetFlag][USA.GetName]§! global Influence Score is: [?USA.hegemony_victory|Y1]\n\n[ROOT.PRC_USA_relations_show_desc]"
 
CHI_category_PRC_USA_relations_show_change: "Our passive change value last month:\nDue to contribution to world GDP and independence: [?ROOT.temp_percentage_of_global_factories|+=1]\nDue to the economic contribution of vassal: [?ROOT.temp_hegemony_victory_subject|+=1]\nDue to fixed value bonuses such as ideas, decisions, events, etc.: [?ROOT.temp_hegemony_victory_monthly_add|+=1]\nDue to Percentage value bonuses such as ideas, decisions, events, etc.: [?ROOT.temp_hegemony_victory_monthly_mult_show|=+%2]\n\nWhen our global influence score is §Yhigher§! than the other side, we will enjoy §Gmany positive bonuses§! in §Ypolitics, economy, technology§!, etc., the value depends on the current §Ydifference in global influence scores between the two sides§!. \n\nHowever, our opponents §Rwon't be indifferent§!, and other countries will §Rtry to destroy our order§! we have established, so we must §Ytake action§!. \n"
CHI_category_PRC_USA_relations_show_change_other: "All we have to do is §Ychoose§! between these two countries, or §Ystay out of the conflict§! if it comes.\n\nWhen on the side of §Y[USA.GetFlag][USA.GetAdjective]§!: $PRC_USA_relations_stand_USA_good_tt$\nWhen on the side of §Y[CHI.GetFlag][CHI.GetAdjective]§!: $PRC_USA_relations_stand_PRC_good_tt$.\n\nHowever, the choice is not without consequences. Price: When the intensity of the conflict §Yexceeds §!§R+15§!, you will receive §Rnegative penalties§! from the hostile country, and §Ychoosing neutrality§! will receive §Rnegative penalties§! from both China and the United States, but the penalties for each are smaller, and you will receive §Gpositive bonuses§! from $foreign_influence_monthly_domestic_independence_gain_modifier$ and $foreign_influence_defense_modifier$, the values of which depend on your current §Ycontribution to GDP and independence§!."
