MDGR_economic_cycle_adjective_desc_2: "§GFlourish§!"
MDGR_economic_cycle_adjective_desc_3: "§7Steady progress§!"
MDGR_economic_cycle_adjective_desc_4: "§YMixed blessings§!"
MDGR_economic_cycle_adjective_desc_5: "§OFacing a crisis§!"
