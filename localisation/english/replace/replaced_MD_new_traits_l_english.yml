Expand_anhui_industry: "Anhui Construction"
Expand_shanxi_industry: "Shanxi Construction"
CHI_hunan_Advanced_heavy_industry: "Invest in Hunan's advanced heavy industry"
CHI_hunan_Advanced_heavy_industry_desc: "Hunan has several super-large heavy industrial manufacturing bases. We should continue to deepen its advantageous industries."
CHI_hubei_Cutting_edge_industries: "Investing in Hubei's cutting-edge science and technology industries"
CHI_hubei_Cutting_edge_industries_desc: "Hubei is a leader in biotechnology, and we should invest in strengthening its technology industry."
CHI_henan_Industrial_transformation: "Investing in Henan's industrial upgrading"
CHI_henan_Industrial_transformation_desc: "Henan's industries are in urgent need of transformation and upgrading"
CHI_jiangxi_Industrial_transformation: "Investing in Jiangxi's industrial upgrading"
CHI_jiangxi_Industrial_transformation_desc: "Jiangxi's industries are in urgent need of transformation and upgrading"
CHI_anhui_Industrial_transfer: "Arrange Anhui to undertake industrial transfer from the east"
CHI_anhui_Industrial_transfer_desc: "Anhui is adjacent to the developed Yangtze River Delta region and can undertake a large amount of manufacturing transfers."
CHI_shanxi_Industrial_transformation: "Accelerating the transformation and upgrading of Shanxi's industries"
CHI_shanxi_Industrial_transformation_desc: "Shanxi's industries are in urgent need of transformation and upgrading"
CHI_Northeast_Revitalization_category: "Northeast Revitalization Decision"
CHI_Northeast_Revitalization_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chinortheast\n\n\n\n\n\n\n\n\nThe basic features of the ground structure of the §YNortheast Region§! are the mountains and rivers, and the fertile fields stretch for thousands of miles. The soil is mainly black soil, which is the natural foundation for the formation of a large economic zone. The economy of the Northeast started early, and once §Yaccounted for 98% of China's heavy industry§!, making a §Rhistoric and huge contribution§! to the development and growth of New China, and strongly supporting the national economic construction. For more than 50 years, the three northeastern provinces have directly handed in fiscal revenues that are about 5 times the amount transferred by the state. Not counting the large number of factories transferred to various parts of the country, the Daqing Oilfield alone handed in 2.4 billion tons of oil.\n\n§YPremier Wen Jiabao§! pointed out that the §R16th National Congress of the Communist Party of China§! clearly proposed to support the acceleration of adjustment and transformation of old industrial bases such as the Northeast, and to support the development of follow-up industries in regional cities that focus on resource exploitation, industrial transformation, and the development of modern agriculture."
Expand_liaoning_industry: "Liaoning Construction"
Expand_jilin_industry: "Jilin Construction"
Expand_heilongjiang_industry: "Heilongjiang Construction"
CHI_jilin_Automobile_manufacturing: "Invest in Jilin Automobile Manufacturing"
CHI_jilin_Automobile_manufacturing_desc: "Jilin was once the largest automobile manufacturing center in my country. We should increase support for this industrial base."
CHI_dalian_shipbuilding_industry: "Invest in Dalian Shipbuilding Industry"
CHI_dalian_shipbuilding_industry_desc: "Dalian is the largest shipbuilding center in my country. We should increase investment in this area."
CHI_heilongjiang_Mechanized_agriculture: "Promoting mechanized agricultural production in Heilongjiang"
CHI_heilongjiang_Mechanized_agriculture_desc: "Heilongjiang has the largest distribution of black soil in my country, and its agricultural potential is outstanding. We should increase agricultural investment in this region and promote efficient large-scale mechanized production."
CHI_development_of_western_region_category: "Development of the Western Region Resolution"
CHI_development_of_western_region_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chiwest\n\n\n\n\n\n\n\n\n§YWestern China§! covers an area of 6.85 million square kilometers, accounting for about 71.4% of the country. At the end of 2002, the population was 367 million, accounting for 25% of the country. It accounts for about 15% of the GDP. It is the largest, most extensive and most complex region among the three major regions in my country.\n\nThe western region is rich in natural resources, has great market potential and an important strategic location. However, due to natural, historical and social reasons, the economy of the western region is Development has been relatively backward for a long time, and the per capita GDP is only two-thirds of the national average and less than 40% of the average level in the eastern region. It is urgent to accelerate the pace of reform, opening up and modernization. \n\nTo implement the development of the western region, we must rely on the Eurasian Continental Bridge, the Yangtze River Waterway, the Southwest Sea Channel and other transportation trunk lines, give full play to the role of central cities, connect points with lines, and lead the whole with points, and gradually form a distinctive cross-administrative economic belt in the western part of my country, such as the Xilonghai-Lanxin Line, Nan (Ning)-Guizhou, Chengdu-Kunming, etc., to drive the development of other regions and promote the development of the western region in a step-by-step and focused manner. "
MGDR_AI_state_industry: "AI Development Province"
CHI_shanxi_industry: "Investing in Shaanxi's Industrial Development"
CHI_shanxi_industry_desc: "Shaanxi is the economic center of the northwest region. We should increase investment in this thousand-year-old capital."
CHI_southwest_industry: "Subsidies for the development of the southwest industry"
CHI_southwest_industry_desc: "The Southwest is a model of development led by the cities of Chongqing and Chengdu. Investing in this region will help alleviate poverty in the vast mountainous areas."
CHI_ningxia_mutton: "Subsidize Ningxia's crop production"
CHI_ningxia_mutton_desc: "Ningxia has Yinchuan, the "South of the Yangtze River on the Great Wall". Increasing investment in the planting industry in this area will help improve the income of local people."
CHI_gansu_potato: "Subsidize potato planting in Gansu"
CHI_gansu_potato_desc: "Gansu has a dry climate and large temperature differences, which can grow very high-quality and delicious potatoes. We should develop a production model that suits local conditions based on this."
CHI_guizhou_potato: "Subsidy for potato planting in Guizhou"
CHI_guizhou_potato_desc: "Guizhou is full of karst landforms, and only potatoes are suitable for cultivation. We should increase the promotion of agricultural products and food processing industries."
CHI_yunnan_coffee: "Subsidizes Yunnan coffee bean planting"
CHI_yunnan_coffee_desc: "Yunnan is the largest coffee producing area in my country. The coffee produced here is of high quality and delicious taste, which will meet the growing demand for coffee in my country and the world."
CHI_nei_graziery: "Subsidies for Inner Mongolia's animal husbandry"
CHI_nei_graziery_desc: "Inner Mongolia has the largest high-quality grassland in my country, and Mongolian mutton is world-famous."
CHI_Xinjiang_cotton: "Subsidize cotton planting in Xinjiang"
CHI_Xinjiang_cotton_desc: "Xinjiang has a dry climate and the cotton grown there is of extremely high quality. my country's rapidly developing textile industry has brought about a huge demand for cotton. Xinjiang's long-staple cotton is large in quantity and high in quality. Investing in its cotton planting can not only meet domestic demand, but also effectively improve the quality of life of local people."
