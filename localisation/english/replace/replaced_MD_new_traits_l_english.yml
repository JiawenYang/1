CHI_Property_taxes: "Property taxes"
CHI_Property_taxes_desc: "Imposing taxes on real estate such as houses can effectively curb the phenomenon of inequality between the rich and the poor, but our economy is highly dependent on real estate. Once real estate taxes are implemented, it may lead to serious consequences."
