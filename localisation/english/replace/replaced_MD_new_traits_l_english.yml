CHI_East_Line_Projec_South_to_North_Water_Diversion_Project_mission: "East Line Project of South to North Water Diversion"
CHI_Central_Line_Projec_South_to_North_Water_Diversion_Project_mission: "Central Line Project of South to North Water Diversion"
chinese_space_program: "Chinese Space Program"
chinese_space_program_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chi_space\n\n\n\n\n\n\n\n\n\n\nExploring the vast universe has been the unswerving pursuit of the §YChinese nation§! for thousands of years. §CChina's space program§! carries the §Ycolorful dream§! of a great country, and also embodies the §Ypride and feelings of the Chinese people in the new era.§!\n§Y[CHI.GetFlag]The space program of the People's Republic of China§! can be traced back to 1956, led by the §CChina National Space Administration§!. China's purpose in developing its space program is to explore outer space and expand its understanding of the earth and the universe. knowledge; peaceful use of outer space, promote §Chuman civilization§! and social progress, §Cbenefit all mankind§!; meet the needs of economic construction, scientific and technological development, national security and social progress, improve the scientific literacy of the whole people, safeguard national rights and interests, and enhance comprehensive national strength. §CChina's development of aerospace industry§! implements the guiding principles of the development of national science and technology, namely independent innovation, key breakthroughs, supporting development, and leading the future. \n\nThrough our unremitting efforts, the §Y[CHI.GetFlag]People's Republic of China§! will eventually become a §Yworld aerospace power§!, and then lead §Yall mankind§!§CLook to the universe and move towards the stars§!\n"

CHI_motuo_hydropower_station_decision: "Medog Hydropower Station"
CHI_motuo_hydropower_station_decision_desc: "\n\n\n\n\n\n\n£MAIN_desctext_motuo\n\n\n\n\n\n\n\n\n\n§YMedog Hydropower Station§! is planned to be built in the southern Tibet region of China. Due to the large difference in terrain and the complex topography, the hydropower resources are particularly rich. According to calculations by relevant experts, the hydropower resources in the entire southwest region account for about one-third of the total hydropower in my country, and the planned installed capacity of the Medog Hydropower Station is 60 million kilowatts. As the largest water conservancy project in the world, the Three Gorges Project has an annual power generation of 300 billion kilowatts. In this case, once the Medog Hydropower Station is completed, it will become the §Yworld's highest total power generation hydropower station§!, and will also promote agricultural development in the northwest region. After the completion of the Medog Hydropower Station, it can save 80 million tons of standard coal or 40 million tons of oil for my country every year, which is conducive to my country's commitment to achieve §Gzero emissions§! by 2060.\n"
Form_motuo_inspection_team: "Form an inspection team"
Form_motuo_inspection_team_desc: "The construction of the Medog Hydropower Station is a huge project. We must make adequate preparations, survey and plan the entire project plan."
construction_motuo_dam: "Construction of Metuo Hydropower Station"
construction_motuo_dam_desc: "Thanks to the hard work of the scientific expedition team and the People's Liberation Army, we have completed the survey of the Medog Hydropower Station and can now start construction."

CHI_OGAS_construction: "National Automation System Construction"
CHI_OGAS_construction_desc: "\n\n\n\n\n\n\n£MAIN_desctext_CHIOGAS\n\n\n\n\n\n\n\n\n\n§YComrade Deng Xiaoping§! once pointed out: "§lScience and technology are the primary productive forces§!", "§YThe essence of socialism is to liberate the productive forces, develop the productive forces, eliminate exploitation, eliminate polarization, and ultimately achieve common prosperity§!".\n\nIn the last century, in the §RSoviet Union§!, there was a plan that was ahead of its time, namely the §YOGAS plan - the National Automation System Plan§!. However, at that time, the §RSoviet Union§! had changed from a socialist country with a §Rdictatorship of the proletariat§! to a revisionist country §Ocompletely controlled by the bureaucratic class§!. The §Oprivileged bureaucrats§! could not agree to this plan and give up their control over social production. Otherwise, their §Yprivileges and special supplies§! would be out of the question. \n\nSince our country is still a §Ypeople's democratic dictatorship§! socialist country, the §RCommunist Party of China§! is always aware of launching a revolution on itself. We can rely on the §Ywill of the people§! and the §Yleadership and decision-making of the party§! to overcome all shackles that hinder the development of socialist society. Now, whether in terms of §ltechnological level§!, §Ysocial productivity§! or §Ypolitical system§!, we have the ability to realize this §Yunprecedented great plan§!, further liberate productivity, and build China into a §Gbetter, happier, people-oriented society§!. \n\nWe will use the §Ynational automation construction project§! to further improve the §Ysocialist system with Chinese characteristics§! and realize §RChinese-style modernization§!\n"
Testing_in_xiongan: "Testing in Xiongan New Area"
Testing_in_xiongan_desc: "In order to test the effectiveness of the national automation system construction, we can first build a model smart city in Xiongan New Area."
building_shenzhen_ogas: "Automation at the heart of manufacturing"
building_shenzhen_ogas_desc: "The Pearl River Greater Bay Area is the core of my country's manufacturing industry. Building a national automation system here can effectively improve my country's production efficiency."
building_shanghai_ogas: "Financial Center Automation"
building_shanghai_ogas_desc: "Shanghai is the core of my country's financial and service industries. Building a national automation system here can effectively help my country's economic transformation and upgrading."
building_beijing_ogas: "Fully Automated Capital"
building_beijing_ogas_desc: "Beijing is the capital and political center of my country. Building a national automation system here can effectively help improve my country's government affairs capabilities."
Cyberpunk_Mountain_City: "Cyberpunk Mountain City"
Cyberpunk_Mountain_City_desc: "Chongqing is the largest industrial city in southwest my country. Its outstanding urban construction overcomes geographical limitations and has a high tourist attraction in my country."
Wisdom_Jiangnan: "Wisdom Jiangnan"
Wisdom_Jiangnan_desc: "Jiangsu has been an important economic center in my country since ancient times. Building a national automation system here can effectively build an integrated Yangtze River Delta city cluster."
Technology_Hangzhou: "Technology Hangzhou"
Technology_Hangzhou_desc: "Hangzhou is home to the largest Internet technology company in my country, Alibaba Group. Building a national automation system here can effectively radiate national Internet services."
Technology_Xian: "The Longest Day in Chang'an"
Technology_Xian_desc: "Xi'an is the largest city in Northwest my country and a famous ancient city in my country. Building a national automation system here can effectively promote economic growth in Northwest China."
Preliminary_construction_OGAS: "Preliminary construction of the national automation system"
Preliminary_construction_OGAS_desc: "We have successfully built a preliminary level of national automation system in many major cities across the country. We have built an information management network covering many places."
CHI_ogas_in_shenzhen_OK: "The Greater Bay Area has been connected to the national automation system"
CHI_ogas_in_shanghai_OK: "Shanghai has been connected to the national automation system"
CHI_ogas_in_beijing_OK: "Beijing has been connected to the national automation system"
CHI_ogas_in_chongqing_OK: "Chongqing has been connected to the national automation system"
CHI_ogas_in_Jiangnan_OK: "Jiangsu has been connected to the national automation system"
CHI_ogas_in_zhejiang_OK: "Zhejiang has been connected to the national automation system"
CHI_ogas_in_shaanxi_OK: "Xi'an has been connected to the national automation system"
CHI_Three_North_Shelterbelt_Forest_Program: "Three North Shelterbelt Forest Program"
CHI_Three_North_Shelterbelt_Forest_Program_desc: "\n\n\n\n\n\n\n£MAIN_desctext_sanbei\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]China§! The Three North regions have Eight deserts and four sandy lands, with an area of 1.33 million square kilometers, larger than the total cultivated land area of China. This area used to be a farming and pastoral area with lush grass and water, but now it is covered with yellow sand and has annual sandstorms. Every 30 to 100 days, the riverbed downstream is more than 10 meters above the ground. \n\n§Y[CHI.GetFlag] The Chinese government§! decided to implement the §YThree North Shelterbelt Project§! in 1979 to improve the ecological environment. It is listed as an important project of national economic construction. The project planning period is 73 years, and it will be carried out in eight phases. Now the sixth phase has been started. The construction of the Three Norths Project is a strategic need to improve the ecological environment, reduce natural disasters, and maintain living space. It is the fundamental way to improve the ecological environment in the Three North Regions and solve ecological disasters. Measures. \n\nAccording to the overall plan, the construction scope of the Three Norths Project starts from Bin County in Heilongjiang Province in the east, ends at the Wuziberi Pass in Xinjiang in the west, reaches the national border in the north, and extends along Tianjin, Fenhe River, Weihe River, and Taohe River in the south. The lower reaches, Burhanbuda Mountain, Karakoram Mountain, 4480 kilometers long from east to west, 560-1460 kilometers wide from north to south. The geographical location is between 73°29'~129°50' east longitude and 33°30'~50°14' north latitude. Including Shaanxi, Gansu, Ningxia, Qinghai, Xinjiang, Shanxi, Hebei 559 counties (banners, cities, districts) in 13 provinces (autonomous regions, municipalities directly under the Central Government) including Beijing, Tianjin, Inner Mongolia, Liaoning, Jilin, and Heilongjiang. The total construction area is 4.069 million square kilometers, accounting for 42.4% of China's total land area. . \n\nIn the past, this place was a §Rbad land covered with yellow sand§!. Under the leadership of the §YParty and the State§!, the §YChinese people§! will §Ycompletely§! change this situation and turn it into The entire northern part of China has become a §Gnew ecological world thriving with business§!\n"
