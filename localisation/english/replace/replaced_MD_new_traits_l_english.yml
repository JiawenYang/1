modify_chinese_aggression: "Intensity of Sino-US Confrontation"
xinjiang_category: "Xinjiang"
xinjiang_category_desc: "\n\n\n\n\n\n\n£MAIN_desctext_xinjiang\n\n\n\n\n\n\n\n\n\nThe ethnic relations in §Y[CHI.GetFlag]China§! have always been harmonious and stable. However, there is always a group of §Rseparatists§! who are always trying to split our country and are active in the §YXinjiang region§!, inciting §Rseparatism and hatred§!. This is due to the long-term cession of ethnic autonomy, insufficient ideological propaganda, and instigation by foreign forces. We cannot ignore this potential threat, but we must strike a balance between §Yfighting separatism§! and §Ywinning the hearts and minds of the local people§!.\n§YSeparatist threat§! refers to the strength of separatist opposition armed elements, which is relatively high The threat level will lead to more deadly and destructive attacks. §YUyghur public opinion§! determines the monthly increase rate of §Yseparatist threat§!. The will of the people determines the size of this group of reactionaries.\n\n§YDevelopment is the only way to stabilize people's hearts§!. The best way to eradicate separatism is to develop the local area, let Uyghur compatriots live a good life, and despise these separatists from the bottom of their hearts.\nThe higher the threat level of this group of extreme terrorists, the more our ability to control the local area and the normal economic development of the local area will be affected, which will be manifested as a §Rnegative impact§! on the local §H$state_productivity_growth_modifier$§!, §H$MODIFIER_LOCAL_ORG_REGAIN$§!, §H$MODIFIER_LOCAL_SUPPLIES_FOR_CONTROLLER$§!, §H$MODIFIER_LOCAL_RESOURCES_FACTOR$§!, and §H$STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$§!, and vice versa.\n\n§YSeparatist Threat§!: [?ROOT.uighur_threat|%%]\n§YUyghur Public Opinion§!: [?ROOT.uighur_opinion|%%]\n§YChange in Separatist Threat Last Month§!: [?ROOT.uighur_threat_change|-=%%]\n"
CHI_promote_immigration: "Encourage immigration from other provinces"
CHI_raid_militant_hideouts: "Raids on Extremist Group Hides"
CHI_raid_militant_hideouts_desc: "Security has located the hideout of this group of extremist terrorists. We can launch a raid to capture these militants, but this may lead to retaliatory attacks by other separatist terrorists."
CHI_arrest_dissidents: "Identify Dissidents"
CHI_arrest_dissidents_desc: "Gradually separate these separatists who are inciting unrest from the general public, but this may cause some people who are unaware of the truth to be misled by extremist propaganda and cease to understand us."
CHI_expand_reeducation: "Expand reeducation campaign"
CHI_expand_reeducation_desc: "Combining livelihood skills and ideological education to fundamentally eliminate the soil for the growth of extremism."
CHI_subsidize_local_industries: "Subsidize local industry development"
CHI_subsidize_local_industries_desc: "Subsidize local industries to develop advantageous industries and create jobs, which will create wealth and allow our compatriots to live a good life."
 

sco_category: "Shanghai Cooperation Organization"
sco_category_desc: "\n\n£MAIN_desctext_sco\n\n\n\n\nThe §YShanghai Cooperation Organization§!, also known as §YSCO§!, is an intergovernmental organization in Eurasia dedicated to cooperation in the fields of economy, politics, and security. Its predecessor was the §YShanghai Five§!, consisting of §Y[SOV.GetFlag]Russia§!, §Y[CHI.GetFlag]China§!, §Y[KAZ.GetFlag]Kazakhstan§!, §Y[KYR.GetFlag]Kyrgyzstan§!, and §Y[TAJ.GetFlag]Tajikistan§!, with the goal of resolving disputes and promoting cooperation. The §YSCO§! was created as an expansion and deepening of this original vision, not only promoting improved relations between member states, but also significantly increasing the §Y[SOV.GetFlag] lag]Russia§! and §Y[CHI.GetFlag]China§!'s influence in §YCentral Asia§!. \n\nThe likelihood of countries applying to join depends on the §Y$modify_chinese_aggression$§!. \nCountries with a §G-20 $modify_chinese_aggression$§! and a low §YNationalism§! of §YNeutral§! will attempt to join the SCO as full members. \nCountries with a §G-10 $modify_chinese_aggression$§! and a low §YNationalism§! of §YNeutral§! will attempt to join the SCO as observers. \nCountries with a §R+10 $modify_chinese_aggression$§! and a high §YNationalism§! of §YNeutral§! will leave the organization. \nCountries with a §R+20 $modify_chinese_aggression$§! and a high §YNationalism§! of §YNeutral§! will abandon their status as SCO observers. \n\n§Y$modify_chinese_aggression$§! [?CHI.chinese_aggression]\n"
demand_to_join_as_an_observer: "Demand that the vassal join the SCO"
SCO_show_provide_development_assistance: "Show/Hide §YDevelopment Assistance§! decision group"
SCO_show_offer_joint_exercises_specific: "Show/Hide §YMilitary Aid§! decision group"
south_china_sea_category: "South China Sea"
south_china_sea_category_desc: "\nThe strategic and economic importance of the §Y[CHI.GetFlag]South China Sea§!, a region where one-third of global trade flows, and a key military location to protect our interests, cannot be overstated.\n\nChina claims sovereignty over the §Y[CHI.GetFlag]South China Sea§! However, many countries surrounding the South China Sea are competing to seize islands and waters. For the sake of peace and stability, as well as maintaining good relations with neighboring countries, we have adopted a semi-tolerant attitude instead of fighting for every inch of land here as we do for our land territories.\n\nAgainst the backdrop of frequent disputes and tensions with other countries around us, especially with the recent discovery of large oil and gas fields in this area, it is crucial that we outsmart our opponents and project our power into the region.\n\n§Y$modify_chinese_aggression$§!: [?CHI.chinese_aggression]\n"
oil_exploration_paracels: "Drilling for oil near the Paracel Islands"
