MDGR_economic_cycle_protecting_interests: "Maintaining globalization"
MDGR_productivity_state_var_modifier: "Province productivity passive change"
MDGR_productivity_state_var_modifier_desc: "Increasing productivity is like sailing against the current. The higher the level of productivity, the more difficult it is to maintain."
MDGR_economic_cycle_percentage_all: "Total length of the world economic cycle"
MDGR_economic_cycle_progress_all: "Current progress of the world economic cycle"
MDGR_economic_cycle_progress_all_last: "Progress change in the last month"
MDGR_economic_cycle_progress: "Our impact on the progress of the world economic cycle"
MDGR_global_economic_cycle_modifier: "Influence of the world economic cycle"
MDGR_global_economic_cycle_modifier_desc: "Globalization has led to a deepening of integration and interdependence in the political, economic, cultural, and social fields of countries around the world, which has also led to cyclical fluctuations in the operation of the world economy. Such cyclical fluctuations inevitably affect every participant in globalization.\n§W---------------------------------\n$MDGR_economic_cycle_percentage_all$: [?D75.MDGR_economic_cycle_percentage_all|Y]\n$MDGR_economic_cycle_progress_all$: [?D75.MDGR_economic_cycle_progress_all|Y]\n$MDGR_economic_cycle_progress$: [?ROOT.MDGR_economic_cycle_progress|-]\n$MDGR_economic_cycle_progress_all_last$: [?D75.MDGR_economic_cycle_progress_all_last|-]\nCurrent economic situation: [D75.MDGR_economic_cycle_adjective_desc]\n[ROOT.MDGR_economic_cycle_identification_desc]\n\nAmong them, $MDGR_economic_cycle_percentage_all$ depends on the §Yworld GDP share§! and §Yimplemented trade laws§! of all countries participating in the world economy, while $MDGR_economic_cycle_progress$ depends on our §Y$interest_rate_multiplier_modifier$§! and §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! and §Y£interest_rate_multiplier_modifier_texticon£ debt-to-GDP ratio§! and §Y$economic_cycle_global_mult$§!. The cumulative impact of all countries on the progress of the world economic cycle is $MDGR_economic_cycle_progress_all$. \n\nIf §Y$MDGR_economic_cycle_progress_all$§! is less than §Y$MDGR_economic_cycle_percentage_all$§!, then there will be a §Gpositive impact§! on $productivity_growth_modifier$, $economic_cycles_cost_factor$, $econ_cycle_upg_cost_multiplier_modifier$, $investment_cost_modifier$, and $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$, and vice versa. §!"
