CHI_Agricultural_development: "Agricultural Modernization Decision"
CHI_Agricultural_development_desc: "\n\n\n\n\n\n\n£MAIN_desctext_chi_agri\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]China§! is a §Gagricultural power§!. With only §Y7% of the world's arable land§!, it feeds nearly §Y20% of the world's population§! and creates nearly §Y30% of the world's agricultural GDP§!. Despite this, it is still §Yquite difficult§! to feed our people, which forces us to further improve our §Gagricultural production§!.\n\n§RThe Communist Party of China§!, in drawing up the grand blueprint of §Ybuilding a modern socialist country§!, laid great emphasis on agriculture. The overall deployment of agricultural and rural work has been made. In summary: We must comprehensively promote rural revitalization, basically realize §Gagricultural modernization§! by 2035, and build a §Gagricultural power§! by the middle of this century. This is the strategic deployment made by the §RParty Central Committee§! with an eye on §Ybuilding a socialist modern power in an all-round way§!. \n\n§YA strong country must first have a strong agriculture, and a strong agriculture can only make a strong country§!. Without a strong agricultural country, there will be no modernized country as a whole; without agricultural and rural modernization, socialist modernization will not be comprehensive. We must put the acceleration of building a strong agricultural country in an important position in building a socialist modern power, maintain strategic determination, work hard for a long time, anchor the goal of building a strong agricultural country, make scientific plans, and promote the "three rural" work. "
CHI_Promote_high_quality_fertilizers: "Promote high-quality fertilizers throughout the country"
CHI_Promote_high_quality_fertilizers_desc: "High-quality fertilizers can reduce the consumption of soil fertility, while increasing the organic content of crops, providing people with healthier and more nutritious crops."
CHI_Songnen_Plain_Commodity_Grain_Base: "Songnen Plain Commodity Grain Base"
CHI_Songnen_Plain_Commodity_Grain_Base_desc: "The Songnen Plain is the largest component of the Northeast Plain. It is located in the central area of the Songliao Basin between the Greater and Lesser Khingan Mountains, the Changbai Mountains and the Songliao Watershed. It is mainly formed by the alluvial deposits of the Songhua River and the Nen River. The cultivated land area is 5.59 million hectares, and the soil is fertile, with black soil and chernozem accounting for more than 60%. It is rich in soybeans, wheat, corn, sugar beets, flax, potatoes, etc. It is an important commodity grain base for Heilongjiang Province and the country, with a grain commodity rate of more than 30%; the grassland is concentrated, including grasslands in Qiqihar, Gannan, Longjiang, Tailai, Duerbert, Fuyu, Lindian, Daqing, Anda, Zhaodong, Zhaozhou, Zhaoyuan and other cities and counties, covering an area of more than 2 million hectares. The first, second and third grade grasslands composed of dominant grass species such as Leymus chinensis, Cinnamomum camphora, Vetch and Puccinellia tenuifolia account for 76%, and animal husbandry is well developed."
CHI_Sanjiang_Plain_Commodity_Grain_Base: "Sanjiang Plain Commodity Grain Base"
CHI_Sanjiang_Plain_Commodity_Grain_Base_desc: "Sanjiang Plain, formerly known as "Northeastern Wilderness", is the northeastern part of the Northeastern Plain. "Three Rivers" refers to the Heilongjiang River, Wusuli River and Songhua River. These three rivers converge here and form this flat fertile land. After the founding of the People's Republic of China, large-scale agricultural reclamation and cultivation were carried out here. Four state farm management bureaus and more than 50 large state farms were established, and more than 46 million mu of arable land was reclaimed. "Northeastern Wilderness" has become "Northern Granary", the largest agricultural reclamation area in China, and an important commodity grain production base for wheat, soybeans, corn, rice, etc."
CHI_Panjin_Plain_Commodity_Grain_Base: "Panjin Reclamation Area, Liaoning"
CHI_Panjin_Plain_Commodity_Grain_Base_desc: "Panjin Reclamation Area in Liaoning Province, formerly known as "Southern Wilderness", was developed after liberation and a part of the wasteland was established as a state-owned farm. The Panjin Reclamation Area is rich in resources and suitable for the comprehensive development of agriculture, forestry, animal husbandry, sideline production and fishery."
CHI_Dongtinghu_Plain_Commodity_Grain_Base: "Dongtinghu Plain Commodity Grain Base"
CHI_Dongtinghu_Plain_Commodity_Grain_Base_desc: "The Dongting Lake Plain is located in the northeast of Hunan Province, in the southern part of the Two Lakes Plain in the Two Lakes Basin (also known as the Hubei Basin), and is connected to the Jianghan Plain in Hubei in the north. It is mainly formed by the sediment input from the Yangtze River through the four outlets of Songzi, Taiping, Ouchi and Diaoxian, and the sediment brought by the Xiangjiang River, Zijiang River, Yuanjiang River and Lishui River of the Dongting Lake system. It covers an area of 10,000 square kilometers. The lake surface is 34.5 meters above sea level, with a total capacity of 17.8 billion cubic meters, known as the "Eight Hundred Miles of Dongting Lake". The total area of the entire plain is 18,780 square kilometers, of which 15,200 square kilometers in Hunan Province, accounting for 81% of the total area, covers 19 counties and cities such as Changde, Yiyang, Xiangyin, Yueyang, and 15 state-owned farms such as Cendan Farm; the Hubei part is 3,580 square kilometers, accounting for 19%, and governs Songzi, Gong'an, Shishou and other counties (cities)."
CHI_Jianghan_Plain_Commodity_Grain_Base: "Jianghan Plain Commodity Grain Base"
CHI_Jianghan_Plain_Commodity_Grain_Base_desc: "The Jianghan Plain is located in the south-central part of Hubei Province, the "Province of Thousand Lakes" in Central China. It is named after the alluvial deposits of the Yangtze River and the Han River. The Jianghan Plain is located in the western and central parts of the Two Lakes Basin. It is crisscrossed by rivers and dotted with lakes. It is an important part of the middle reaches of the Yangtze River Plain. Together with the Dongting Lake Plain, it is called the Two Lakes Plain. The average altitude is only about 27 meters, making it one of the lowest plains in China.\n\nThe Jianghan Plain is rich in products. "Everyone says that heaven is beautiful, but how can it compare to the fish and rice land of Jianghan." This is his true portrayal. The Jianghan Plain is one of the few areas in my country where rice, wheat, millet, cotton, hemp, oil, sugar, fish and vegetables can be produced in large quantities. It is mainly planted with rice, cotton and rapeseed. The high rice yield provides a strong material guarantee for the lives of local people."
CHI_Chengdu_Plain_Commodity_Grain_Base: "Chengdu Plain Commodity Grain Base"
CHI_Chengdu_Plain_Commodity_Grain_Base_desc: "Sichuan is a populous and agricultural province of great importance in my country. It has been known as the "Land of Abundance" since ancient times. Today, it is one of the 13 major grain-producing provinces in China and the only major grain-producing province in the west. In June 2022, General Secretary Xi Jinping visited Sichuan and emphasized that the Chengdu Plain has been known as the "Land of Abundance" since ancient times. We must strictly observe the red line of cultivated land, protect this precious land of grain production, grasp grain production firmly, and build a higher level of "Land of Abundance Granary" in the new era."
CHI_Pearl_River_Delta_Commodity_Grain_Base: "Pearl River Delta Commodity Grain Base"
CHI_Pearl_River_Delta_Commodity_Grain_Base_desc: "The Pearl River Delta Plain is located in the south-central part of Guangdong Province, covering an area of about 11,000 square kilometers, with an average altitude of about 50 meters, a crisscrossing river network and scattered isolated hills. The Pearl River Delta Plain is formed by the confluence of three major rivers in the east, west and north, with an area of more than 10,000 square kilometers, making it one of China's commodity grain bases. It is not large in area, but has strong productivity, and can feed nearly a thousand people per square kilometer. It is the best developed plain in the tropical region."
CHI_Poyanghu_Plain_Commodity_Grain_Base: "Poyang Lake Plain Commodity Grain Base"
CHI_Poyanghu_Plain_Commodity_Grain_Base_desc: "Poyang Lake Plain, also known as Yuzhang Plain and Poyang Lake Basin, is an important part of Nanchang Basin. It is a lakeside plain formed by the alluvial deposits of the Yangtze River and Poyang Lake tributaries such as Ganjiang River, Fuhe River, Xinjiang River, Xiuhe River and Raohe River. It is part of the plain in the middle and lower reaches of the Yangtze River. The plain is crisscrossed with rice fields, vegetable plots, fish ponds and lotus lakes. It is the granary of Jiangnan and an important base for the production of cotton, oil, pigs, etc."
CHI_Yangtze_River_delta_Commodity_Grain_Base: "Yangtze Delta Commodity Grain Base"
CHI_Yangtze_River_delta_Commodity_Grain_Base_desc: "A strip of plain along the middle and lower reaches of the Yangtze River in China, east of the Three Gorges. It is bounded by the Huaiyang Hills and the Huanghuai Plain in the north, and the Jiangnan Hills and the Zhejiang-Fujian Hills in the south. It was formed by the alluvial deposits of the Yangtze River and its tributaries. It covers an area of about 200,000 square kilometers and has a low terrain. Most of the plain is paddy soil, with developed agriculture and a high land reclamation index. It is an important grain, cotton and oil production base, rich in rice, wheat, cotton, rapeseed, mulberry silkworms, ramie, jute, etc. It produces fish, shrimp, crab, lotus, water chestnut, reed, as well as world treasures such as the Chinese sturgeon, the Yangtze alligator, and the Baiji dolphin. Aquatic products play an important role in China, and it is known as the land of fish and rice."
CHI_Huaihe_Plain_delta_Commodity_Grain_Base: "Huaihe Plain delta Commodity Grain Base"
CHI_Huaihe_Plain_delta_Commodity_Grain_Base_desc: "The Huaihe Plain is located in the northern part of Anhui Province. It is the main plain in the province. It covers all areas north of the Huaihe River and an area about 10 to 60 kilometers wide south of the Huaihe River. After nearly 30 years of transformation, it is now covered with green trees and full of flowers and fruits. At the same time, due to the high content of soluble salts in the soil, especially in the northern part of Suxian, due to the 10 to 20 meters thick Yellow River flood deposits, the total amount of soluble salts in the soil layer is even greater, and the soil is prone to salinization and alkalization."
CHI_Hexi_Corridor_Commodity_Grain_Base: "Hexi Corridor Commodity Grain Base"
CHI_Hexi_Corridor_Commodity_Grain_Base_desc: "The Hexi Corridor irrigated agricultural area has a long history. It is one of the important agricultural areas in Gansu Province. It is a famous irrigated agricultural area in the northwest inland of my country and the most important commodity grain base and cash crop concentrated production area in the northwest. It provides more than 2/3 of the commodity grain, almost all of the cotton, 9/10 of the sugar beets, more than 2/5 of the oilseeds, beer barley, and fruits and vegetables in Gansu Province. The flat oasis area mainly grows spring wheat, barley, millet, millet, corn, and a small amount of rice, sorghum, and potatoes. The main oil crop is sesame. Melons include watermelon, squash, and honeydew melon. The main fruit trees are jujube, pear, and apple. The front of the mountain area is mainly summer grains, mainly highland barley, rye, broad beans, peas, potatoes, and rapeseed. Hexi has a developed animal husbandry industry. For example, Shandan Mayingtan has been a famous military horse farm since ancient times."
CHI_Nei_Mongol_Commodity_Grain_Base: "Inner Mongolia Commodity Grain Base"
CHI_Nei_Mongol_Commodity_Grain_Base_desc: "Inner Mongolia is an important commodity grain production base in my country, with traditional advantages in developing grain production. The grain output of Inner Mongolia has remained above 30 million tons for five consecutive years, and it is one of the six provinces and regions in China that net export commodity grain. The total meat output of the region reached 2.676 million tons, and the total milk output reached 6.93 million tons. It has the ability to export 5 million tons of milk and 1.5 million tons of meat to other regions every year, making it a veritable "granary", "meat warehouse" and "milk tank" of the country."
CHI_Hetao_Plain_Commodity_Grain_Base: "Ningxia Hetao Plain Commodity Grain Base"
CHI_Hetao_Plain_Commodity_Grain_Base_desc: "Ningxia Plain, also known as Yinchuan Plain, is located on both sides of the Yellow River in the central part of Ningxia Hui Autonomous Region. It was formed by the impact of the Yellow River. It has a flat terrain, deep soil, convenient water diversion, and is conducive to gravity irrigation. Although it is located in a temperate arid zone with an annual precipitation of less than 200 mm, the average annual water volume of the Yellow River is more than 30 billion cubic meters. In addition, with 3,000 hours of sunshine per year, the agricultural natural resources such as light, heat, water, and soil are well coordinated, providing extremely favorable conditions for the development of agriculture, forestry, animal husbandry, and fishery. Wheat and rice have high and stable yields, and wolfberries, melons and fruits are of excellent quality. The lakes and swamps near Yinchuan are Ningxia's aquatic base, and the vast grasslands in front of the Helan Mountains are an important production area for Ningxia beach sheep."
CHI_Xinjiang_Production_and_Construction_Corps_Reclamation_Area: "Xinjiang Production and Construction Corps Reclamation Area"
CHI_Xinjiang_Production_and_Construction_Corps_Reclamation_Area_desc: "Xinjiang Production and Construction Corps, referred to as "Xinjiang Corps", is a special administrative region of the People's Republic of China with its headquarters in Urumqi. It undertakes the responsibilities entrusted by the state to garrison and guard the border. Xinjiang Production and Construction Corps is located at the intersection of Europe and Asia, where the species of animals and plants from the East and the West meet. In addition, the diverse and unique natural geographical conditions make it rich in biological resources. Xinjiang Production and Construction Corps has a full range of temperate crops, with wheat, corn and rice as the main food crops. Sorghum, barley, soybeans, peas, mung beans, broad beans, millet, sorghum, sweet potatoes and other grains can be grown in most areas of Xinjiang. The Ili River Valley is known as the "granary of Xinjiang"."

CHI_North_South_Water_Transfer_decision: "South-to-North Water Transfer Project Decision"
CHI_North_South_Water_Transfer_decision_desc: "\n\n\n\n\n\n\n£MAIN_desctext_snwd\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]China§!§lWater resources§!are §Rshortage§! in general, with extremely uneven distribution in time and space, and frequent floods and droughts. It is one of the countries in the world with the §Rmost complex water situation, the most difficult river management, and the most arduous water management tasks§!. In 1952, §RComrade Mao Zedong§! proposed during his inspection of the Yellow River: "§lThere is more water in the south and less in the north. If possible, it is also possible to borrow some water§!" This was the first time that the grand idea of South-to-North Water Transfer was proposed. Since then, after analyzing and comparing more than 50 plans, the water transfer plan has obtained a large number of valuable results.\n\nThe planning area of the South-to-North Water Transfer Project involves a population of 438 million people and a water transfer scale of 448 100 billion cubic meters, divided into §YEast, Central and West lines§!, with a total length of 4,350 kilometers. The total length of the first phase of the East and Central lines is 2,899 kilometers, and the first-level supporting branch canals in the six provinces and cities along the line are about 2,700 kilometers. The South-to-North Water Diversion Project mainly solves the problem of water shortage in §YNorthern China§!, especially in the §YHuanghuai River Basin§!. \n\nThe §YWest Line Project§! is located in the Qinghai-Tibet Plateau, with a high altitude, complex geological structure, and high earthquake intensity. It also requires the construction of a 200-meter-high dam and a tunnel of more than 100 kilometers. The engineering technology is complex and the cost is huge. It is still in the process of feasibility study. But if the time is right, we will build this §Yworld's largest and most difficult§! water conservancy project in one fell swoop, solving the §lwater resource§!§R shortage problem§! for countless Chinese people §Yonce and for all§!. \n"
CHI_Central_Line_Projec_Resettlement: "Resettlement of Immigrants"
CHI_Central_Line_Projec_Resettlement_desc: "The South-to-North Water Diversion Project is a positive social livelihood project. The construction of the Central Line Project will relocate most of the 300,000 migrants to places with better living and living conditions, which will greatly improve the ecological environment around the reservoir and improve the living standards of the migrants."
CHI_Central_Line_Projec_Danjiangkou_Reservoir: "Raising the Danjiangkou Reservoir Dam"
CHI_Central_Line_Projec_Danjiangkou_Reservoir_desc: "We will first raise the height of the Danjiangkou Dam, the main dam of the Danjiangkou Reservoir, to raise the water level of the Danjiangkou Reservoir, and use the newly opened artificial channel to transport water to the main canal."
CHI_Central_Line_Projec_Drilling_through_Yellow_River: "Central Line Main Canal Drilling through Yellow River Project"
CHI_Central_Line_Projec_Drilling_through_Yellow_River_desc: "The Yellow River Tunnel is the largest, longest-term, most technically demanding, and most complex cross-section structure in the South-to-North Water Diversion Project. The Yellow River Tunnel Project started construction on September 27, 2005 and lasted for 9 years. The designed flow rate is 265 cubic meters per second and the increased flow rate is 320 cubic meters per second."
CHI_Central_Line_Projec_henan_main_canal: "Central Line Main Canal Henan Section"
CHI_Central_Line_Projec_henan_main_canal_desc: "The main canal connects the Yangtze River, Huaihe River, Yellow River and Haihe River basins. It needs to cross the main stream of the Yellow River and 219 other rivers with a catchment area of more than 10 square kilometers, cross 44 railways, and build 571 highway bridges across the main canal. In addition, there are control gates, water diversion gates, water withdrawal buildings, tunnels, culverts, etc. There are a total of 936 buildings of various types on the main canal."
CHI_Central_Line_Projec_hebei_main_canal: "Central Line Main Canal Hebei Section"
CHI_Central_Line_Projec_hebei_main_canal_desc: "The main canal connects the four major river basins of the Yangtze River, Huaihe River, Yellow River and Haihe River. It needs to cross the main stream of the Yellow River and 219 other rivers with a catchment area of more than 10 square kilometers, cross 44 railways, and build 571 highway bridges across the main canal. In addition, there are control gates, water diversion gates, water withdrawal buildings, tunnels, culverts, etc. There are a total of 936 buildings of various types on the main canal."
CHI_Central_Line_Projec_beijing_water_conveyance_tunnel: "Central Line Beijing Section West Fourth Ring Road Water Conveyance Tunnel Project"
CHI_Central_Line_Projec_beijing_water_conveyance_tunnel_desc: "The West Fourth Ring Road Culvert Project of the Beijing section of the South-to-North Water Diversion Central Route has two pressurized water conveyance tunnels with an inner diameter of 4 meters, which pass through the Wukesong subway station in Beijing. This is the first time in the world that a large-diameter shallow-buried pressurized water conveyance tunnel passes under an operating underground station, setting a record of only 3.67 meters between the top of the culvert structure and the subway structure, and the maximum settlement value of the subway structure is less than 3 mm."
CHI_Central_Line_Projec_tianjin_main_canal: "Central Line Main Canal Tianjin Section"
CHI_Central_Line_Projec_tianjin_main_canal_desc: "Tianjin Main Canal crosses 48 rivers and streams and has 119 buildings."
CHI_Central_Line_Projec_beijing_main_canal: "Central Line Main Canal Beijing Section"
CHI_Central_Line_Projec_beijing_main_canal_desc: "The main canal connects the Yangtze River, Huaihe River, Yellow River and Haihe River basins. It needs to cross the main stream of the Yellow River and 219 other rivers with a catchment area of more than 10 square kilometers, cross 44 railways, and build 571 highway bridges across the main canal. In addition, there are control gates, water diversion gates, water withdrawal buildings, tunnels, culverts, etc. There are a total of 936 buildings of various types on the main canal."
central_line_officially_began_carrying_water: "The central line of the South-to-North Water Diversion Project officially began carrying water"
central_line_officially_began_carrying_water_desc: "The Central Line of the South-to-North Water Diversion Project has officially begun carrying water, saving Henan, Hebei, Beijing and Tianjin from suffering from water shortages."
CHI_East_Line_Projec_Connecting_the_Grand_Canal_between_Beijing_and_Hangzhou: "Connecting the Grand Canal between Beijing and Hangzhou"
CHI_East_Line_Projec_Connecting_the_Grand_Canal_between_Beijing_and_Hangzhou_desc: "The Grand Canal will be the main water supply line, and the Sanyang River, Huaihe River and Xuhong River will be used for distribution. On the basis of the existing projects, the Sanyang River and Tonghe River, Jinbao Channel, Huai'an Four Station Water Supply Canal, the Middle Canal north of Luoma Lake, Liangji Canal and Liuchang River will be expanded; the South Four Lakes will be dredged; the impact treatment projects of Xuhong River and the Middle Canal south of Luoma Lake will be arranged; and the Gaoshui River and Hanzhuang Canal above Jiangdu Station will be partially dredged."
CHI_East_Line_Projec_Drilling_through_Yellow_River_east: "East Line Main Canal Drilling through Yellow River Project"
CHI_East_Line_Projec_Drilling_through_Yellow_River_east_desc: "Drilling through a 9.3-meter-diameter inverted siphon tunnel with a water delivery capacity of 200 cubic meters per second"
CHI_East_Line_Projec_Jiaodong_area_water_supply_main_line: "Jiaodong area water supply main line"
CHI_East_Line_Projec_Jiaodong_area_water_supply_main_line_desc: "Excavate the 240-kilometer river channel in the western section of the Jiaodong area water supply main line to transport the diverted water to the eastern part of Shandong"
CHI_East_Line_Projec_Lubei_Water_Transfer_Main_Line: "Lubei Water Transfer Main Line"
CHI_East_Line_Projec_Lubei_Water_Transfer_Main_Line_desc: "From the exit of the Chuanhuang Tunnel to Dezhou, expand the Xiaoyun River and the Qiyi and Liuwu Rivers, and transport the transferred water to the western, central and northern regions of Shandong"
east_line_officially_began_carrying_water: "East Line of South-to-North Water Diversion Project officially began carrying water"
east_line_officially_began_carrying_water_desc: "The East Line of the South-to-North Water Diversion Project has officially begun carrying water, saving Jiangsu, Anhui and Shandong from suffering from water shortages."
CHI_West_Line_Aan_Water_diversion_hub: "Aan Water Diversion Hub"
CHI_West_Line_Aan_Water_diversion_hub_desc: "Water diversion starts from Daqu, a tributary of Yalong River, and Aan water diversion hub is built to divert 700 million cubic meters of water."
CHI_West_Line_Niqu_water_conveyance_tunnel: "Niqu water conveyance tunnel project"
CHI_West_Line_Niqu_water_conveyance_tunnel_desc: "The water diverted from A'an Water Diversion Hub will be sent to Niqu through the watershed tunnel."
CHI_West_Line_Renda_Water_diversion_hub: "Renda Water Diversion Hub"
CHI_West_Line_Renda_Water_diversion_hub_desc: "Build Renda Water Diversion Hub, divert 800 million cubic meters of water"
CHI_West_Line_Kedu_water_conveyance_tunnel: "Kedu River Water Conveyance Tunnel Project"
CHI_West_Line_Kedu_water_conveyance_tunnel_desc: "The water diverted from Renda Water Diversion Hub is sent to Duke River through the watershed between Yalong River and Dadu River through the water diversion tunnel."
CHI_West_Line_Shangduke_Water_diversion_hub: "Shangduke Water Diversion Hub"
CHI_West_Line_Shangduke_Water_diversion_hub_desc: "Construction of Shangduke water diversion hub, diverting 1.15 billion cubic meters of water"
CHI_West_Line_Maerqu_water_conveyance_tunnel: "Maerqu Water Conveyance Tunnel Project"
CHI_West_Line_Maerqu_water_conveyance_tunnel_desc: "The water diverted from the Shangduke water diversion hub is sent to Maerqu through the watershed through the water diversion tunnel."
CHI_West_Line_Yaertang_Water_diversion_hub: "Yaertang Water Diversion Hub"
CHI_West_Line_Yaertang_Water_diversion_hub_desc: "Build Yaertang water diversion hub, divert 1.15 billion cubic meters of water"
CHI_West_Line_Ake_water_conveyance_tunnel: "Ake River Water Conveyance Tunnel Project"
CHI_West_Line_Ake_water_conveyance_tunnel_desc: "The water diverted from the Yartang water diversion complex is transported to the Ake River through the watershed tunnel."
CHI_West_Line_Keke_Water_diversion_hub: "Keke Water Diversion Hub"
CHI_West_Line_Keke_Water_diversion_hub_desc: "Build Keke Water Diversion Hub, divert 200 million cubic meters of water"
CHI_West_Line_Dadu_River_water_conveyance_tunnel: "Dadu River Water Conveyance Tunnel Project"
CHI_West_Line_Dadu_River_water_conveyance_tunnel_desc: "The water diverted from the Keke water diversion hub is sent to Jiaqu, a tributary of the Yellow River, through the water diversion tunnel across the watershed between the Dadu River and the Yellow River."
CHI_West_Line_Excavate_open_channels_Jiaqu_Left_Bank: "Excavate open channels on the left bank of Jiaqu"
CHI_West_Line_Excavate_open_channels_Jiaqu_Left_Bank_desc: "After the exit of Jiaqu Tunnel, an open channel is excavated along the left bank of Jiaqu to transport water to the Yellow River."
west_line_officially_began_carrying_water: "The west line of the South-to-North Water Diversion Project officially began carrying water"
west_line_officially_began_carrying_water_desc: "The West Line of the South-to-North Water Diversion Project has officially begun carrying water, saving Gansu, Ningxia, Shaanxi, Shanxi, and Inner Mongolia from suffering from water shortages."
CHI_West_Line_Projec_speed_up1: "West Line Project Speed Up I"
CHI_West_Line_Projec_speed_up2: "West Line Project Speed Up II"
CHI_West_Line_Projec_speed_up3: "West Line Project Speed Up III"
CHI_East_Line_Projec_speed_up1: "East Line Project Speed Up I"
CHI_East_Line_Projec_speed_up2: "East Line Project Speed Up II"
CHI_East_Line_Projec_speed_up3: "East Line Project Speed Up III"
CHI_Central_Line_Projec_speed_up1: "Central Line Project Speed Up I"
CHI_Central_Line_Projec_speed_up2: "Central Line Project Speed Up II"
CHI_Central_Line_Projec_speed_up3: "Central Line Project Speed Up III"
