l_english:

JIANG_ZEMIN_LEADER_DESC: "Comrade Jiang Zemin, male, Han nationality, Chinese politician, engineer, General Secretary of the Central Committee of the Communist Party of China, major party and government officials and top leader of the People's Republic of China. His ancestral home is Jiangcun, Jingde County, Xuancheng City, Anhui Province (some say Jiangwan Town, Wuyuan City, Jiangxi Province). He was born in Yangzhou, Jiangsu Province on August 17, 1926. He joined the Communist Party of China in April 1946 and graduated from Jiaotong University. Comrade Jiang Zemin came from the power machinery manufacturing industry and also had work and leadership experience in the automobile manufacturing industry. In his early years, Jiang Zemin served as Minister of the Ministry of Electronics Industry of China, Deputy Secretary of the Shanghai Municipal Committee of the Communist Party of China, Mayor, and Secretary of the Municipal Committee. Comrade Jiang Zemin is a recognized and outstanding leader with high prestige by the whole party, the whole army and the people of all ethnic groups in the country. He is a great Marxist, a great proletarian revolutionary, politician, military strategist, diplomat, a time-tested communist fighter, an outstanding leader of the great cause of socialism with Chinese characteristics, the core of the third generation of the party's central leadership collective, and the main founder of the important thought of "Three Represents".

HU_JINTAO_LEADER_DESC: "Young man of the Communist Youth League", "doer", "technician", these are Hu Jintao's nicknames. The son of a businessman from Tai County, Jiangsu Province, has always considered himself to be from Jixi, Anhui Province, but he has the characteristics of a cultured person common to people in the Jiangnan water town: he is elegant and quiet, and likes to read. After graduating from university, Hu Jintao taught at his alma mater for several years. After the Cultural Revolution began, he soon went to work at the Liujiaxia Engineering Bureau of the Ministry of Water Resources and Electric Power in Gansu, where he married his university classmate Liu Yongqing, who had been his classmate for many years. After joining the Communist Youth League unit, he began to attract the attention of the central government, and since then he has risen rapidly and been promoted one after another. In completing his work in Guizhou and Tibet, Hu Jintao's work ability quickly stood out, and then became his political capital for entering the central government. It is said that he was the leader candidate designated by Comrade Deng Xiaoping across generations. This After taking over the post of top leader in late 2002, the young general secretary once said, "I didn't want to be the chairman. It was the people of the whole country who elected me and made me the chairman." \n\nAs a Communist Party member from a poor family, Hu Jintao has worked with the princelings of the second or third generation of the reds for a long time. This experience convinced him and Wen Jiabao, who also came from a merchant family, that if China wants to move forward steadily in the new century, it cannot rely on so-called political strongmen or the concept of development first. It is necessary to replace the rule of man with the rule of law and the concept of development first with the concept of people-oriented development. The princelings and Shanghai Gang members at the top level are not optimistic about this young man without political backing, and they also sneer at the so-called rule of law and people-oriented concepts he advocates. General Secretary Hu Jintao's struggle during his ten-year term is far from over. "

HU_JINTAO_LEADER2_DESC: "Wen Yiduo once compared ancient Chinese regulated verse in "The Meter of Poetry" to "dancing in shackles". But can you really dance in shackles? Hu Jintao proved this with his own struggle.\n\nFor him, China is a huge ship, and he is the helmsman on the ship. He and his first mate Wen Jiabao firmly grasp the rudder of this ship of unimaginable size. If they are not careful, it will be overturned in an instant. The series of policies during their tenure were called the "Hu-Wen system" and were praised by many parties, but they knew that they were just trembling and treading on thin ice to drive the ship on the huge frozen river. Dreamlike growth, intoxicated singing and dancing, what kind of underwater iceberg is there under this peaceful scene? ... But now, he finally has his own foothold and can write his own words in reality - a brilliant picture of the Chinese people rushing towards a better future. "

XI_JINPING_LEADER_DESC: ""He is the son of Xi Zhongxun" is what Xi Jinping heard most when he was young. For him, the eldest son of the founding father of the Republic, his father's identity is not only a rich political fortune, but also an inescapable label. When Xi Jinping was a child, he was forced to leave Beijing and go to a village in Shaanxi because his father was involved in a political struggle, and he suffered a lot. He has been working in the countryside since his youth and has a deep understanding of Chinese society. At the same time, he has shown amazing talent and courage in local work. When he left Liangjiahe Village to study at Tsinghua University, the villagers spontaneously saw off the party branch secretary, and Xi Jinping was deeply moved by this, and a seed was planted in his heart. \nAfter graduating from college, he served as a secretary of the Ministry of National Defense in the central government, but soon gave up the generous treatment in Beijing and took the initiative to work in the countryside. Xi Jinping's simple lifestyle and capable work style quickly won the recognition of the masses and colleagues, so he was subsequently transferred to Xiamen, Fujian. The few years he was in charge of Fujian were the fastest development period in Fujian. After the millennium, he was transferred to Zhejiang and Shanghai, and later he was promoted to the Standing Committee of the Political Bureau of the CPC Central Committee with Li Keqiang, and entered the core of national power. \n\nFor Xi Jinping, his years of grassroots work experience is his most precious wealth. Being with the people makes him feel at ease and at ease. As a second-generation red from a "noble family", he has suffered countless criticisms, and has also seen the filthiest and most evil corner of this society in his "princeling peers". Xi Jinping takes "I will be selfless and live up to the people" as his life motto, hoping to cut off all the weeds that do not conform to his ideals and violate the wishes of the Chinese people. Now, he has finally become the top leader, and he can freely express his masterpiece on the vast canvas of China. "

YAN_CAN_DESC: "Master Yan Chan, with the name Mingchao and the nickname Hutu Shanren. Master Yan Chan received the Dharma from the 46th generation of the Tiantai Sect of Buddhism, the Linji Sect, and the Caodong Sect. He has profound attainments in Buddhism, a handsome Zen style, is proficient in Zen, has a noble way of doing things, and has extraordinary charm. He has always adhered to the central idea of "respecting life, spreading tolerance, living calmly, and living happily". He is humorous and amiable. In his conversations, he interprets the philosophy of life and the attitude towards life vividly, which not only guides people out of confusion, but also makes people enjoy the colorful and wonderful voices. Over the years, his income from calligraphy and painting has been used to subsidize out-of-school children and poor students as well as social charity and public welfare undertakings, and he has donated to the free lunch program. \n\n"My apprentice asked me, Master, how can I treat people equally? I told him, look back at the door behind me. It is not a government office, a wealthy family, a triumphal arch, or a door for prodigals. It has been the door of the common people for thousands of years. It is not without a name. It has a name, it is called the Chaimen. If someone becomes successful and forgets this door, please look up at the sky. What a big eye is staring at it. This is also our eternal home door.""

Zheng_Jian_Bang_DESC: "Zheng Jianbang, male, Han nationality, born in January 1957, from Shimen, Hunan, member of the Revolutionary Committee of the Chinese Kuomintang, joined the work in August 1976, graduated from the Department of Political Education, Northeast Normal University, majoring in economics, with a university degree. He served as Vice Chairman of the Standing Committee of the 14th National People's Congress, Chairman of the Central Committee of the Revolutionary Committee of the Chinese Kuomintang, and Vice Chairman of the China Association for Promoting Peaceful Reunification. "

Keizo_Obuchi_DESC: "Obuchi was born in Nakanojo, Gunma Prefecture, Japan. He graduated from Waseda University in 1962 with a degree in English literature. The following year, he won his father's seat in the House of Representatives, becoming the youngest member of parliament ever elected. Although he is often described as a moderate and unremarkable figure, his political career was successful. In 1973, Obuchi was appointed deputy director of the Prime Minister's Office and in 1987 he became the Cabinet Secretary-General. As he rose through the ranks of the ruling Liberal Democratic Party, he became increasingly known for his ability to broker compromises between factions within the party. In 1984, he became the party's deputy secretary-general and in 1993 he became secretary-general. In 1997, he became foreign minister. After the LDP lost the general election, Obuchi succeeded Hashimoto Ryutaro as party chairman on July 24, 1998. On July 30, Obuchi became prime minister and took a bright approach to the country's economic problems. He was able to win parliamentary approval to bail out banks with bad debts, cut income taxes and increase spending. These policies worked in the short term, and by mid-1999 the Japanese economy was strengthening again. He is an amateur radio player with a call sign (JI1KIT) and was once the president of the parliamentary amateur radio club. \n\nThe hardworking prime minister has long been in a state of infirmity, which seems to have worsened in recent times. "

yoshiro_mori_DESC: "Mori Yoshiro became prime minister by accident. From 1993 to 2000, Japan had changed five prime ministers. At that time, the popular saying in Japan was: "A singer is popular for one year, and the prime minister is in office for two years." Mori Yoshiro has been in politics for more than 30 years and has been elected to the House of Representatives 10 times. He can be said to be a veteran in Japanese politics. At the end of July 1998, after Keizo Obuchi was elected as the president of the Liberal Democratic Party and became the Prime Minister of Japan, Mori Yoshiro was appointed by Obuchi as the Secretary-General, a position second only to the president in the Liberal Democratic Party, and became Obuchi's very trusted "right-hand man". Trying hard to win the general election is the primary task of Prime Minister Mori's administration. In order to win the general election, the new cabinet that follows the policies of the Obuchi cabinet can only make a fuss about former Prime Minister Obuchi, who fell ill in office due to working hard for the country without any political achievements. The voting date for the general election was chosen on June 25, Obuchi's birthday, and Obuchi's funeral will be held on June 8. Analysts believe that the Liberal Democratic Party has used Obuchi to the extreme. The vote was chosen on Obuchi's birthday in order to attract more "sympathy votes"; on June 8, leaders of many countries will attend Obuchi's funeral, and Mori will take this opportunity to launch "funeral diplomacy". There is only one goal, that is, to win the general election. \n\nHow long can this carefree, straightforward and somewhat "stupid" prime minister stay in office? "

junichiro_koizumi_DESC: "In 1967, Junichiro Koizumi graduated from the Department of Economics at Keio University and went to study at the University of London in 1968. In December 1969, he inherited his father's will and failed to run for the House of Representatives in the Kanagawa Prefecture constituency. In 1972, he was elected to the House of Representatives and was re-elected. From 1988 to 1996, he served as Minister of Health, Labor and Welfare and Minister of Posts. On April 24, 2001, Junichiro Koizumi was elected President of the Liberal Democratic Party with an overwhelming advantage with the campaign slogan "Change the Liberal Democratic Party, Change Japan": he served as the 87th Prime Minister. In September 2003, Junichiro Koizumi was re-elected President of the Liberal Democratic Party; on November 19 of the same year, he was elected Prime Minister. On September 11, 2005, Junichiro Koizumi led the Liberal Democratic Party to a landslide victory in the Japanese House of Representatives election, and his political career reached its peak. \n Junichiro Koizumi was the first prime minister elected in the new century, and one of the representatives of Japanese politicians who advocated breaking the "bureaucratic dominance" situation. As Japan's "long-lived prime minister", Junichiro Koizumi was known as a political "weirdo". His domestic and foreign policies caused a lot of turmoil in Japan and abroad, and he received mixed reviews. During his tenure, he successfully promoted the privatization reform of the postal service and actively developed a strategic partnership with the US government, which improved and strengthened Japan-US relations. However, his insistence on visiting the Yasukuni Shrine also led to the deterioration of Japan's relations with China and South Korea. \n\n What achievements can this vigorous and decisive prime minister with a very personal style make during his term of office? "

Shinzo_Abe1_DESC: "On September 21, 1954, Shinzo Abe was born in Yamaguchi Prefecture, Japan. From kindergarten to university, Shinzo Abe has been studying at Seikei Academy, a 16-year aristocratic school that values individuality and experience. During his time at school, Shinzo Abe did not study hard and his grades were average. But he was curious and had a wide range of interests, and spent most of his time and energy exploring the world outside of textbooks. After graduating from university, in November 1982, Shinzo Abe served as a secretary to his father Shintaro Abe, then Japan's Foreign Minister, and began to enter politics, and was strongly supported by former Prime Ministers Takeo Fukuda and Noboru Takeshita. In September 2004, as the Liberal Democratic Party of Japan lost to the Democratic Party by one seat in the Senate election, Shinzo Abe resigned as Secretary-General, but because the ruling coalition, including the Komeito Party, still controlled the Senate, he was only demoted by Koizumi to acting Secretary-General of the Liberal Democratic Party and Minister of the Party Reform Promotion Headquarters. On October 31, 2005, he became Chief Cabinet Secretary of the third Koizumi Cabinet. On September 20, 2006, Shinzo Abe was elected as the 21st president of the Liberal Democratic Party; on September 26, Shinzo Abe was elected as the 90th Prime Minister of the Japanese Cabinet (Prime Minister of Japan), becoming the first post-war born and the youngest post-war prime minister. \n\nShinzo Abe has the shadow of Junichiro Koizumi in many aspects. He is stubborn and tough in speech. Until 2006, he never equivocated about his hawkish stance. He was a loyal supporter of Junichiro Koizumi's visit to the Yasukuni Shrine. He defended Junichiro Koizumi on various occasions and visited the shrine many times as a politician. In terms of governing philosophy, Abe is also close to Koizumi, advocating strengthening the Japan-US alliance, advocating amending Japan's peace constitution, adding a clause that Japan has the right of collective self-defense, and pushing Japan towards the so-called "normal country". How long can this young prime minister sit in the position of prime minister? "

yasuo_fukuda_DESC: "Yasuo Fukuda was born on July 16, 1936 in Takasaki, Gunma Prefecture, and graduated from Waseda University in Japan. After graduating from the Department of Political Economy at Waseda University in March 1959, he joined an oil company. He advocated that political reform should start from each politician himself, and was known for his prudent policies. During his tenure, Sino-Japanese relations showed a good development momentum, and the strategic and mutually beneficial relations between China and Japan continued to deepen. Prime Minister Fukuda made important contributions to this. Fukuda and Aso also agreed to avoid making the Yasukuni Shrine issue a political and diplomatic issue. Fukuda said: "It is very unfortunate that the Yasukuni Shrine issue has evolved into an extremely politicized issue. I will not create difficulties." Fukuda had previously made it clear that if he was elected prime minister, he would not visit the Yasukuni Shrine. Regarding foreign policy, Fukuda promised that he would strengthen Japan-China relations after his election, and Aso said that he would further deepen relations with Asian countries. Aso also reiterated that he was the first Japanese foreign minister to publicly welcome the "rise of China." On August 15, 1995, then-Japanese Prime Minister Tomiichi Murayama made a speech, admitting that Japan's past national policies were wrong and that it had taken the path of war. Colonial rule and aggression had caused great damage and suffering to the people of many countries, especially Asian countries, and expressed deep reflection and sincere apology. \n\nYasuo Fukuda advocated maintaining the momentum of fiscal reform and economic growth. Consider reforming the tax system to promote regional development and increase income and employment opportunities for citizens engaged in agriculture and fisheries. At the same time, he called for the establishment of a society that provides "hope and comfort" for young people and the elderly. Review a law that requires people with disabilities to pay 10% of the cost of their medical care and services and consider making major changes. Consider no longer increasing the medical burden on the elderly. And increase the transparency of political funds and promote civil service reform. \n\nTo what extent can this prime minister who is committed to benefiting the Japanese people realize his ideals? "

taro_aso_DESC: "Born into a political family. Graduated from the Faculty of Political Science and Economics of Gakushuin University in Japan, and later studied at Stanford University Graduate School in the United States and the London School of Economics and Political Science in the United Kingdom. After returning to Japan, he devoted himself to the family business "Aso Industry" (now Aso Cement Plant). Aso Taro, who was spoiled in a superior official and business family environment, has formed a proud and willful, flamboyant and casual personality since childhood, and has also developed a habit of lacking careful consideration and speaking nonsense. As he self-deprecatingly said, "I was born well, but I was not well educated." \nIn the trend of conservative trends in Japanese society as a whole and the rise of nationalist thoughts, Aso and Koizumi sang the same tune, openly disdaining the national feelings of China and South Korea on issues such as historical understanding and Taiwan's status and "China threat theory", challenging the political foundation of Sino-Japanese relations. On December 22, 2005, when a reporter asked how he understood the China threat theory of Democratic Party leader Maehara Seiji, Aso immediately agreed with Maehara's point of view, believing that "China is becoming a considerable threat." This is the first time that a Japanese cabinet member has publicly promoted the China threat theory in a formal setting. \nThe cabinet formed by Taro Aso was called the "hereditary cabinet", "young master cabinet" and "young master cabinet" by the media and the opposition parties. Eleven of the 18 cabinet members were hereditary cabinet members. Four days later, Nakayama Shigeaki, the Minister of Land, Infrastructure, Transport and Tourism, resigned. After Kaneko Kazuyoshi succeeded, the number of hereditary cabinet members reached a record 12, exceeding the 9 cabinet members in Fukuda Yasuo's cabinet reform, that is, two-thirds of all cabinet members were hereditary members. \n\nWhat actions can this prince prime minister make during his term of office? "

yukio_hatoyama_DESC: "Yukio Hatoyama, also known as Yukio Hatoyama, was born on February 11, 1947. He is the chairman of the Institute of East Asian Community, honorary professor of Xi'an Jiaotong University, China, and honorary professor of Northwest Agriculture and Forestry University, China. \n\nIn 1996, Yukio Hatoyama, Naoto Kan and Ichiro Ozawa formed the Democratic Party and served as the party leader. On August 30, 2009, Yukio Hatoyama led the Democratic Party to a historic victory in the House of Representatives election, ending the long-term ruling position of the Liberal Democratic Party. On September 16, 2009, he was elected as the 93rd and 60th Prime Minister of Japan. Hatoyama has a steady personality and is not aggressive, so he is nicknamed "Dove". He values "patience". Yukio Hatoyama's catchphrase is "Politics is love", and his political creed is the "friendship" thought proposed by his grandfather. However, due to his naive remarks, he was once nicknamed "Alien" and ridiculed as "like a soft ice cream cone". Yukio Hatoyama is famous for his political views on security and foreign affairs. He emphasizes Japan's right to military self-defense and criticizes Japan's current foreign policy for being too dependent on the United States and other Western allies. In terms of the construction of the Democratic Party, Yukio Hatoyama said that he would be committed to building a system of party unity and achieving regime change. He advocates strengthening relations with Asian countries. In his article published in the New York Times, he pointed out that Japan cannot forget its identity: We are a country located in Asia. I believe that the increasingly vibrant East Asia must be recognized as Japan's basic survival scope. Therefore, we must continue to establish a stable economic cooperation and security framework covering the entire region. In terms of political security, China is regarded as the main opponent and target of prevention, while making full use of "Chinese business opportunities" in economic growth and development strategies. \n\nDoes this prime minister who actively makes friends with China and is full of sympathy for the world realize that politics is cruel and reality is cold? "

naoto_kan_DESC: "Naoto Kan was born on October 10, 1946 in Ube City, Yamaguchi Prefecture. He is a blue-collar politician and citizen activist. During his university years, Naoto Kan was the leader of the school's Red Guards. In 1980, he became a member of the House of Representatives. In 1996, he served as Minister of Health and Welfare in the Cabinet of Ryutaro Hashimoto. He became famous for his handling of the AIDS drug case. Later, he founded the Democratic Party of Japan with Yukio Hatoyama and Ichiro Ozawa, becoming one of the "three horses" of the Democratic Party. On September 16, 2009, he became Deputy Prime Minister and Minister of the "National Strategy Bureau" in the Hatoyama Cabinet. On January 6, 2010, he became Minister of Finance.\n Naoto Kan once said during the campaign , the Japan-US alliance is the "cornerstone" of Japan's foreign policy. He said that he would work hard to reduce the burden on Okinawa residents based on the joint statement of Japan and the United States on the relocation of the U.S. military base in Futenma, Okinawa. He emphasized the importance of China to Japan, saying that Sino-Japanese relations are "equally important" to U.S.-Japan relations. In 1999, when Naoto Kan visited China, he made a special trip to the Marco Polo Bridge Anti-Japanese War Memorial to lay a wreath, saying that "past events should be remembered as a lesson for the future." On the Taiwan issue, he hopes that China will achieve peaceful reunification as soon as possible and advocates that Taiwan is part of China's territory. In 2010, Naoto Kan stated in dealing with Sino-Japanese relations: "Japan-U.S. Alliance is the basis of Japan's diplomacy. On the other hand, we must be committed to the prosperity of the Asian region." We will attach importance to developing Japan-China relations.On May 10, 2011, Naoto Kan pointed out in a meeting that Japan's power development depends on nuclear power and thermal power generation. In the future, it is necessary to focus on researching new energy sources such as solar energy and wind energy, and to make natural energy the basis of Japan's power. This is the first time since the Fukushima Daiichi Nuclear Power Plant accident that Naoto Kan has stated that he will stop the development of nuclear power and abolish the government's energy development plan based on nuclear power. \n Previously, most Japanese prime ministers were either rich or noble, and hereditary politics and factional struggles were almost It has almost become a tradition in Japan. Former Japanese Prime Minister Naoto Kan, who took office on June 8, 2010, seems to be rewriting the history of Japanese politics. According to the legal requirement of publicizing property within 100 days after taking office, in the personal property status table of 18 members of the Japanese Naoto Kan cabinet, the Prime Minister Naoto Kan's report is quite simple. He does not hold stocks, nor does he have a golf club membership card. He only has a fixed deposit of 3.95 million yen and a two-bedroom apartment. The official valuation of the apartment is 5.18 million yen. \n\nTo what extent can this prime minister, who was born a commoner, realize his ideal? "

yoshihiko_noda_DESC: "Yoshihiko Noda was born on May 20, 1957 in Funabashi City, Chiba Prefecture, Japan. He graduated from the Department of Political Science of Waseda University in 1980, and then studied at the Matsushita School of Political Science and Economics, the "cradle of Japanese politicians". He was elected at the age of 29 and broke the record for the age of elected Japanese parliamentarians. Noda is a powerful figure in the Democratic Party of Japan and the chairman of the party faction Hanasekai (Noda Group). He is a core figure of the "Noda Group" composed of young members of the Democratic Party. He is an active person. He has worked as a firefighter and a tutor. He is a second-degree judo master and admires Japanese politician Hamaguchi Takeyuki. In politics, on the one hand, he opposes Junichiro Koizumi's boasting, and on the other hand, he holds a conservative and tough attitude on issues such as the Diaoyu Islands. \nFrom Noda's long-term political style, Noda is more familiar with defense and finance. In terms of defense and diplomacy, Noda has inherited the tough style of the "Panasonic Political and Economic Academy", advocates toughness against China, advocates visiting the Yasukuni Shrine, and is a well-known representative of the hawkish figures in the Democratic Party. He is known as the "Democratic Party Koizumi". He has a tough attitude towards China on territorial issues and believes that "Class A war criminals are not war criminals." He also advocates Japan's military use of space and actively advocates that Japan should enact the "Basic Security Law" and the "State of Emergency Law." Noda is a "hardliner" in foreign affairs and military affairs. When he was a guest on a TV program, Noda said that his ideal of governance, in short, is to hope that the people can feel that being Japanese is a happy thing, and strive to change the negative views of the people on politics. Noda once refuted Chinese State Councilor Tang Jiaxuan, saying, "Your country actually occupies the Nansha Islands, why do you have any right to criticize us?" He also proposed to the Japanese Parliament that the Diaoyu Islands be confirmed as "Japan's inherent territory" in response to the incident of Chinese Diaoyu Islands protection personnel landing on the Diaoyu Islands. \n\nWhat kind of career can this tough "boss" style prime minister accomplish? "

Shinzo_Abe_DESC: "Shinzo Abe was born in Yamaguchi Prefecture, Japan on September 21, 1954. From kindergarten to university, Shinzo Abe has been studying at Seikei Academy, a 16-year aristocratic school that values individuality and experience. During his time at school, Shinzo Abe did not study hard and his grades were average. But he is very curious and has a wide range of interests. He spends most of his time and energy exploring the world outside of textbooks. After graduating from university, in November 1982, Abe Shinzo served as a secretary to his father, Shintaro Abe, who was then the Minister of Foreign Affairs of Japan. He began to enter politics and was strongly supported by former Prime Ministers Takeo Fukuda and Noboru Takeshita. In September 2004, because the Liberal Democratic Party of Japan lost to the Democratic Party by one seat in the Senate election, Abe Shinzo resigned as Secretary-General, but because the ruling coalition including the Komeito Party still controlled the Senate, he was only demoted by Koizumi to acting Secretary-General of the Liberal Democratic Party and Minister of Party Reform Promotion. On October 31, 2005, he took office as Chief Cabinet Secretary of the third Koizumi Cabinet. On September 20, 2006, Abe Shinzo was elected the 21st President of the Liberal Democratic Party; on September 26, Abe Shinzo was elected as the 90th Prime Minister of the Japanese Cabinet (Prime Minister of Japan), becoming the first post-war born and the youngest post-war prime minister. On December 16, 2012, the Liberal Democratic Party won a landslide victory in the House of Representatives election and regained power. Shinzo Abe confirmed that he would serve as the Prime Minister of Japan again; on December 26, Shinzo Abe took office as the 96th Prime Minister of Japan. \n\nShinzo Abe has the shadow of Junichiro Koizumi in many aspects. He is stubborn and tough in his speech. Until 2006, he never hesitated about his hawkish stance. He was a loyal supporter of Junichiro Koizumi's visit to the Yasukuni Shrine. He defended Junichiro Koizumi on various occasions and visited the shrine many times as a politician. In terms of governing philosophy, Abe is also close to Koizumi. He advocates strengthening the Japan-US alliance, advocating the amendment of Japan's peace constitution, adding a clause that Japan has the right of collective self-defense, and pushing Japan towards the so-called "normal country". \n\nCan this second-term prime minister finally end the political chaos that Japan has fallen into since the death of Keizo Obuchi in 2000? What direction will Japan go under his leadership? "

yoshihide_suga_DESC: "Yoshihide Suga, born on December 6, 1948 in Akita Prefecture, Japan, is a Japanese politician and a member of the Liberal Democratic Party. On September 14, 2020, Yoshihide Suga won 377 votes (a total of 534 valid votes) and was elected president of the ruling Liberal Democratic Party with an absolute advantage [19-20]; on September 16, the House of Representatives of the Japanese Diet convened an extraordinary parliament to hold a prime minister nomination election. Yoshihide Suga, president of the ruling Liberal Democratic Party, was elected as the 99th Prime Minister of Japan and formed a new cabinet on the same day. \nIn May 2021, Yoshihide Suga promoted the Japanese Diet to pass six digital reform-related laws, including the "Digital Agency Establishment Law", "Basic Law on the Formation of a Digital Society", and "Law on Local Public Group Information Digitalization Standards", to provide legal support for building a digital society and cultivating a digital economy. The background for the formulation of this series of laws is that Japan lags behind major countries such as China and the United States in the field of digital economy, and the COVID-19 pandemic has highlighted the problem of Japan's low level of administrative digitalization. The above-mentioned laws on digital reform were officially promulgated and implemented on September 1, 2021 after being reviewed and approved by the National Assembly. According to the "Digital Department Establishment Law", Japan established the "Digital Department" directly under the jurisdiction of the Cabinet to coordinate the digital construction of the central ministries and local governments, and coordinate the digitalization of civil groups and enterprises. In terms of diplomacy, Yoshihide Suga proposed to promote the establishment of stable relations with Asian neighbors such as China and Russia based on the Japan-US alliance. \n\nWhat kind of contribution can this prime minister who took office in his twilight years make? "

fumio_kishida_DESC: "Fumio Kishida was born on July 29, 1957 in Tokyo, Japan. His ancestral home is Hiroshima City, Hiroshima Prefecture. He graduated from the Faculty of Law of Waseda University in March 1982. In 2012, Fumio Kishida took over as the chairman of the Hiroikekai from Makoto Koga and became the leader of the "Kishida faction". On September 29, 2021, he was elected as the 27th President of the Liberal Democratic Party of Japan. On October 4 of the same year, he took office as the 100th Prime Minister of Japan. On November 10, he was elected as the 101st Prime Minister of Japan in the nomination election of the Prime Minister of the Senate and the House of Representatives. Since Fumio Kishida became Prime Minister, he has adhered to the line of constitutional amendment and strengthening the military, and plans to amend the Self-Defense Forces Law. In terms of economy, he proposed a "new Japanese capitalism", hoping to achieve national economic growth and fair income distribution at the same time, and promote the "Digital Garden City National Concept" and vigorously popularize new energy. In diplomacy, he inherited the policy framework of former Prime Minister Shinzo Abe and Yoshihide Suga, advocating to work with countries that share universal values led by the United States, continue to promote the "free and open Indo-Pacific" strategy, and condemn and sanction Russia in the Russia-Ukraine conflict. In terms of economic policy, Fumio Kishida proposed a "new Japanese capitalism". Faced with the widening gap between the rich and the poor in Japanese society, Fumio Kishida is committed to creating a "virtuous cycle of growth and distribution" to achieve growth and distribution at the same time, and plans to make every effort to improve wages and benefits through policies such as reducing corporate tax burdens. Fumio Kishida also promoted the "Digital Pastoral City National Concept" as part of the growth strategy, established a 2 trillion yen green innovation fund, and achieved zero emissions from thermal power generation through the popularization of hydrogen fuel cell electric vehicles and other means. On January 8, 2022, Fumio Kishida published a signed article entitled "My New Capitalist Grand Design", in which he fully expounded his economic concept for the first time, saying that capitalism should be upgraded to a new capitalism that values "people", hoping that through the new capitalism, the trend of declining wage growth levels can be "reversed in one fell swoop", and that wage growth can be suitable for the new era of capitalism. \n\nCan this calm prime minister build his ideal "new Japanese capitalism"? "

shigeru_ishiba_DESC: "Shigeru Ishiba, male, was born on February 4, 1957 in Gunya-cho, Yazu-gun, Tottori Prefecture, Japan (now Yazu-cho). He graduated from the Faculty of Law of Keio University and is a member of the Liberal Democratic Party. In 1979, after graduating from university, Shigeru Ishiba joined Mitsui Bank (now Sumitomo Mitsui Banking Corporation). In 1981, he joined politics at the persuasion of his father's friend Kakuei Tanaka. In 1986, he used the resources and influence inherited from his family to be elected as a member of the House of Representatives of Tottori Prefecture for the first time as a member of the Liberal Democratic Party, and was elected 12 times. In 1993, after the birth of the non-LDP regime led by Morihiro Hosokawa, Shigeru Ishiba left the LDP and joined the New Party in the seven-party ruling coalition, joining Ichiro Ozawa, who opposed the LDP. In 1997, due to political differences with Ozawa, he returned to the LDP. In 2002, he began to serve in the cabinet, successively serving as Minister of Defense and Minister of Agriculture and Fisheries. In 2014, he served as Secretary-General of the Liberal Democratic Party. In 2015, he was promoted by Shinzo Abe to be the Minister of Special Affairs of the Cabinet Office, responsible for managing "local revitalization affairs" and "national special zone strategy". Shigeru Ishiba has run for the president of the Liberal Democratic Party four times, but was not elected. In August 2024, he participated in the Liberal Democratic Party presidential election for the fifth time and was elected as the 28th president of the Liberal Democratic Party; on October 1, he was elected as the 102nd Prime Minister of Japan. \n\nShigeru Ishiba has rich political experience and has been involved in the administration of many fields at the local and central levels. He is known as a "policy expert" and a conservative politician. He is a realist in international relations. When he served as Minister of Defense, he was regarded as a hawk. He has always advocated improving the status of the Japanese Self-Defense Forces and strengthening the Japan-US alliance. Although his policies are tough, he seeks stability, pragmatism and balance. In terms of its stance towards China, it acknowledges that Japan needs to face up to and reflect on its historical issues and advocates that China and Japan can to carry out a certain degree of economic cooperation. \n\nCan this seemingly friendly prime minister protect a piece of pure land in the fierce game between major powers? "