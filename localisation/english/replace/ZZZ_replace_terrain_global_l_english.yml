l_english:
 mexico_city_desc: "----\n§9Built on a dried lake and sinking politely, Mexico City still manages to be the loudest, busiest, most alive place in the Americas.§!"
 detroit_desc: "----\n§9Motown's engine may have stalled, but the beat never stopped. Empty lots grow wildflowers where the factories used to grow Fords.§!"
 san_antonio_desc: "----\n§9Remember the Alamo, then order a bowl of chili and forget the rest of the tour schedule.§!"
 birmingham_desc: "----\n§9Steel, soul music, and a bull statue downtown—a city that had to learn the hard way how to change its tune.§!"
 tampa_desc: "----\n§9Cigar factories, strip malls, and two hockey trophies nobody in Florida expected.§!"
 ottawa_desc: "----\n§9A capital so polite that even the Parliament Hill cats have security clearance. Nothing happens here, and that is the point.§!"
 denver_desc: "----\n§9The Mile High City, where the Rockies watch you jog and the air itself counts as a workout.§!"
 portland_desc: "----\n§9Keep Portland weird—then explain to the waiter why you are still vegan at two in the morning.§!"
 dallas_desc: "----\n§9Big hair, bigger trucks, and a skyline that looks best in reruns of the 1980s.§!"
 toronto_desc: "----\n§9Six million people who apologize before they honk, plus a tower that still looks down on the rest of the city.§!"
 minneapolis_desc: "----\n§9Ten thousand lakes, one light rail line, and a winter that files a formal grievance against your face.§!"
 las_vegas_desc: "----\n§9What happens here stays here. The debt, however, follows you home.§!"
 atlanta_desc: "----\n§9Traffic thick enough to count as weather, and still the capital of Southern hip-hop and airport layovers.§!"
 columbus_desc: "----\n§9The largest small town in Ohio—a test market for everything America ends up buying.§!"
 san_diego_desc: "----\n§9Perfect weather, a naval base, and a zoo that is practically a national landmark.§!"
 austin_desc: "----\n§9Half tech bros, half honky-tonk, all of it stuck on Interstate 35.§!"
 oklahoma_city_desc: "----\n§9Oil money, prairie thunder, and a memorial that reminds you the sky out here means business.§!"
 sacramento_desc: "----\n§9California's government town: hot summers, almond orchards, and rivers that never signed the drought plan.§!"
 indianapolis_desc: "----\n§9The crossroads of America, where May is a religion and the speedway is its cathedral.§!"
 buffalo_desc: "----\n§9Lake-effect snow, blue-collar grit, and wings served with celery you will absolutely ignore.§!"
 cape_town_desc: "----\n§9Table Mountain, two oceans, and a wind so strong it gets renamed every afternoon.§!"
 cairo_desc: "----\n§9Twenty million people, a river of traffic, and pyramids visible from a shopping mall's parking deck.§!"
 alexandria_desc: "----\n§9A great library burned once; the new one has better backups and a nicer view.§!"
 volgograd_desc: "----\n§9The city that renamed itself twice and still stands where the Volga makes its last turn before the Caspian.§!"
 rostovdon_desc: "----\n§9Southern gateway to the Don: river trade, football chants, and a skyline that keeps rebuilding itself.§!"
 yekaterinburg_desc: "----\n§9Where the Urals meet the money—Soviet concrete next to glass towers, and a tragic last tsar in the basement.§!"
 nizhnynovgorod_desc: "----\n§9The trade fair that made the Volga rich; now it makes software and cars instead of arguments.§!"
 novosibirsk_desc: "----\n§9Siberia's biggest city, built in a hurry for the railway, still running on academic stubbornness.§!"
 kazan_desc: "----\n§9Tatar capital where a mosque and an Orthodox cathedral share one skyline without a fight.§!"
 tallinn_desc: "----\n§9A medieval old town with a digital government: they vote online and still walk on cobblestones.§!"
 riga_desc: "----\n§9Art Nouveau facades, Baltic wind, and a song festival every summer that drowns out the politics.§!"
 vilnius_desc: "----\n§9Baroque churches and an artists' republic across the river that never quite got its own passport.§!"
 chisinau_desc: "----\n§9Wine cellars longer than the country is wide, and a mayor who once sued the traffic lights.§!"
 tiraspol_desc: "----\n§9A frozen conflict with a Lenin statue still on the main square and a currency nobody outside can spend.§!"
 odessa_desc: "----\n§9Potemkin Steps, sea breeze, and a sense of humour that survives absolutely everything.§!"
 lvov_desc: "----\n§9Coffee, cobblestones, and a Habsburg hangover in the best possible way.§!"
 belgrade_desc: "----\n§9Where the Sava meets the Danube and splavs meet the sunrise—a city that parties on its own ruins.§!"
 budapest_desc: "----\n§9Two cities, one river, and thermal baths built by Romans who never saw the ruin bars coming.§!"
 prague_desc: "----\n§9A hundred spires, one castle, and beer cheaper than a tourist's dignity.§!"
 bratislava_desc: "----\n§9A small capital that kept the castle, lost the empire, and now serves the best beer within forty minutes.§!"
 munich_desc: "----\n§9Beer halls, BMW, and an Oktoberfest that makes the whole world wear lederhosen badly.§!"
 hamburg_desc: "----\n§9Port city with a warehouse district UNESCO loves and the tide keeps testing.§!"
 frankfurt_desc: "----\n§9Bank towers, a tiny old town, and a station where every train is an argument.§!"
 hannover_desc: "----\n§9Trade fairs, a red-dot trail through the city, and the flattest skyline in Germany.§!"
 koln_desc: "----\n§9A cathedral that took 632 years, 4711 perfume, and a Carnival that shuts down the Rhineland.§!"
 stuttgart_desc: "----\n§9Mercedes, Porsche, and a valley so full of traffic the hills are mostly for looking at.§!"
 bern_desc: "----\n§9Switzerland's capital: bears, arcades, and a river that loops like a question mark.§!"
 zurich_desc: "----\n§9Banking, chocolate, and a lake so clean you can see your regrets reflected in it.§!"
 vienna_desc: "----\n§9Coffee houses, opera, and a city government that has been renting happiness since 1919.§!"
 amsterdam_desc: "----\n§9Canal ring, bicycles, and a housing market that makes the tulip bubble look modest.§!"
 brussels_desc: "----\n§9EU headquarters, chocolate, and a bureaucracy that turns compromise into an art form.§!"
 krakow_desc: "----\n§9Wawel dragons, a market square the size of a football pitch, and student bars that never close.§!"
 bucharest_desc: "----\n§9Paris of the Balkans with a parliament that ate a neighbourhood; now startups fill the gaps.§!"
 sofia_desc: "----\n§9Vitosha mountain on the doorstep, Roman ruins in the metro, and a city that shrugs in three alphabets.§!"
 zagreb_desc: "----\n§9Austrian squares, Balkan coffee culture, and a museum of broken relationships that is fully booked.§!"
 marseille_desc: "----\n§9A port city that talks fast, eats bouillabaisse, and trusts nobody in a hurry.§!"
 lyon_desc: "----\n§9France's stomach: silk money, bouchons, and a two-river city that invented its own light.§!"
 nice_desc: "----\n§9Promenade des Anglais, pebble beaches, and a tax regime that keeps the Riviera polite.§!"
 bordeaux_desc: "----\n§9Wine, river facades, and a tram system so smooth the locals almost stopped complaining.§!"
 nantes_desc: "----\n§9Shipyards turned into art machines—a giant mechanical elephant walks the old docks.§!"
 toulouse_desc: "----\n§9Pink bricks, Airbus wings, and students who argue about everything except the rugby.§!"
 strasbourg_desc: "----\n§9European Parliament, Franco-German menus, and a cathedral that once held the tallest spire on Earth.§!"
 lisbon_desc: "----\n§9Seven hills, yellow trams, and a custard tart that fixes at least two of your problems.§!"
 madrid_desc: "----\n§9Late dinners, older arguments, and a museum triangle that outlasts every government.§!"
 barcelona_desc: "----\n§9Gaudí curves, a busy port, and a football club that considers itself a nation.§!"
 athens_desc: "----\n§9Ancient marbles next to modern graffiti; the argument never actually ended.§!"
 palermo_desc: "----\n§9A city of gardens, marble, and light, where palaces rise between mountain and sea. Traffic rules are suggestions.§!"
 naples_desc: "----\n§9Vesuvius on the horizon, pizza in your hand, and laundry strung across alleys like festival flags.§!"
 milan_desc: "----\n§9Fashion weeks, finance, and a cathedral that looks like lace carved in marble.§!"
 venice_desc: "----\n§9A city that decided to build on water and then charged everyone admission.§!"
 istanbul_desc: "----\n§9Two continents, one bridge traffic jam, and ferries that turn commuting into a scenic cruise.§!"
 ankara_desc: "----\n§9A capital built on purpose: ministries, boulevards, and a castle that watches it all.§!"
 izmir_desc: "----\n§9Aegean breezes, kordon promenades, and a stubbornly secular seaside attitude.§!"
 bursa_desc: "----\n§9Ottoman firsts: first capital, first silk, and chestnut candy that survives the winter.§!"
 adana_desc: "----\n§9Cotton, kebabs, and heat that makes the Seyhan river steam.§!"
 tehran_desc: "----\n§9Mount Damavand watches the smog; the metro is packed and the argument is older than the traffic.§!"
 baghdad_desc: "----\n§9Tigris, books, and a city that has rebuilt its libraries more times than anyone should have to.§!"
 damascus_desc: "----\n§9One of the oldest capitals on Earth: an oasis, a great mosque, and a patience older than the war.§!"
 aleppo_desc: "----\n§9A citadel, a souk, and a city that keeps re-opening its gates.§!"
 jerusalem_desc: "----\n§9Four quarters, three faiths, and one very contested skyline.§!"
 riyadh_desc: "----\n§9A desert capital that went from mud-brick town to glass towers in a single generation.§!"
 abu_dhabi_desc: "----\n§9Oil money turned into museums, mangroves, and a skyline that needs no excuse.§!"
 dubai_desc: "----\n§9A skyline built on ambition, air conditioning, and the world's tallest everything.§!"
 doha_desc: "----\n§9A pearl-diving town that became a gas capital and bought a World Cup to prove it.§!"
