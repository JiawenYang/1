 #Ideas
 VEN_consequences_of_the_2019_crisis_idea: "Aftermath of the 2019 Crisis"
 VEN_consequences_of_the_2019_crisis_idea_desc: "2019 brought us so many challenges to overcome.\n\nIn March, a failure in the Guri Dam led to a massive power outage in the entire country that lasted for weeks. It devastated local economies and provided an opportunity for criminals to steal goods from small stores with almost no retribution for doing so. It also seriously damaged our electric grid, forcing us to adopt harsher rationing policies.\n\nIn April, the leader of the opposition and so called Interim President Juan Guaidó led a failed coup d'etat against the regime. Its failure destroyed the hopes of the opposition and caused Guaidó to lose his popular support, but it also proved the mixed loyalties of the National Bolivarian Armed Forces, causing distrust among our ranks.\n\nAnd to make everything even worse, the people went to the streets to protest, turning entire blocks and avenues into battlefields. The National Guard is always able to win the war of attrition against the protesters, but the destruction and casualties left by the protests leave long lasting memories in the minds of the people, who grow more discontent over time.\n\nAll of that happened in one single year. It left the nation battered and exhausted. Some fear that despite everything that happened, the worst is still yet to come."
 VEN_energy_crisis_rationing: "Severe Energy Rationing"
 VEN_energy_crisis_rationing_desc: "Around 70% of Venezuela's energy comes from hydroelectric sources, especially the Guri Dam in the State of Bolivar. This makes Venezuela a somewhat environmentally friendly country, but this also requires a lot of skill and maintenance to work properly, something the government has neglected for a long time. A lack of maintenance in the Guri Dam and the national electric grid have caused a massive energy crisis in the country.\n\nThe government's response was a harsh electric rationing system that has severely affected the economy of multiple states, especially those furthest away from Caracas. Some people have to endure more than 8 hours with no electricity every day, something made worse by the economic crisis and the hot climate of the region."
 VEN_welfare_military_idea: "Welfare Military"
 VEN_welfare_military_idea_desc: "Venezuela is proud of having one of the largest armies in Latin America. But that army was built not with national fervor and love for its homeland, but with promises of a larger paycheck and food security. A lot of people joined the army to take advantage of the multiple benefits it offers. In exchange, they give up their free will and personal aspirations. While this has increased our numbers to impressive levels, it is doubtful that these hungry and desperate soldiers are willing to die in foreign lands to protect the interests of the party."
 VEN_mass_exodus_idea: "Mass Exodus"
 VEN_mass_exodus_idea_desc: "\n\n\n\n£GFX_VEN_mass_exodus\n\n\n\n\n\nThe political and economic crisis in Venezuela has led to what is considered the most catastrophic immigration crisis ever seen in the western hemisphere. Almost 9 million Venezuelans have abandoned their homeland in search of political freedom and economic security. This has worsened the situation within Venezuela by separating families and draining the skilled workforce away from Venezuela, although the regime is somewhat benefitted by this because most of the refugees are opposition militants.\nThis has also caused an issue in the countries they emigrate to, where they are constantly discriminated by locals blaming them for issues like rising crime statistics, political turmoil and the erosion of cultural values."
 VEN_cia_backed_opposition: "Venezuelan Opposition"
