 # Characters
 BRA_jair_bolsonaro_char: "Jair Bolsonaro"
 BRA_jair_bolsonaro_char_desc: "Jair Bolsonaro entered politics after a career as a military officer and city councilman. Born in 1955 in Glicério, São Paulo, and raised in Eldorado, he attended military academies in the 1970s and became an army captain. His time in the armed forces was marked by outspoken criticism of low pay and support for tougher stances on crime and discipline, which brought him early notoriety. Leaving active service in the late 1980s, he transitioned into politics, winning a seat as a city councilman in Rio de Janeiro in 1988 and entering the Chamber of Deputies the following year. Bolsonaro served seven consecutive terms in Congress, representing Rio de Janeiro. His legislative record was modest in terms of passed bills, but he became known for his uncompromising defense of the military, staunch conservatism, and fiery rhetoric, which earned him both loyal supporters and fierce critics.\n\nFor years, he was regarded as a fringe figure in Brazilian politics. By the mid-2010s, however, Bolsonaro's hardline views on crime, corruption, and national identity gained broader traction amid widespread disillusionment with Brazil's political establishment. The impeachment of President Dilma Rousseff in 2016, followed by corruption scandals that engulfed much of the political class, opened space for his rise. In 2018, running with the small Social Liberal Party (PSL), he launched a presidential campaign promising to restore order, defend family values, and revive the economy through liberal reforms. In September of the same year, Bolsonaro survived a stabbing assassination attempt during a rally, an event that galvanized his supporters. He overcame limited campaign resources by relying heavily on social media, mass rallies, and direct appeals to voters. In October, he defeated Fernando Haddad of the Workers' Party (PT) in the second round, becoming the 38th President of Brazil.\n\nBolsonaro's presidency, beginning in January 2019, quickly deepened political divisions in the country. His administration emphasized pro-market reforms under Economy Minister Paulo Guedes, a close alliance with the armed forces, and conservative cultural policies. He pursued deregulation, pension reform, and a strong law-and-order agenda, while also drawing international attention for his handling of environmental issues in the Amazon and his combative style toward opponents and the press. Bolsonaro stands as one of the most polarizing figures in Brazilian democracy, commanding a fervent base of support while facing strong resistance both domestically and abroad."
