chi_GRnews.59: "Russian destroyer arrives at port"
chi_GRnews.59.t: "Russian destroyer arrives at port"
chi_GRnews.59.d: "The modern destroyer "Hangzhou" that we ordered from Russia finally arrived at Zhoushan Port today, but the Russians do not seem to have completely updated the weapons and equipment as required by the order... We can continue to transform this destroyer."
chi_GRnews.59.a: "Okay! Buy another one!"

chi_GRnews.60: "Russian destroyer arrives at port"
chi_GRnews.60.t: "Russian destroyer arrives at port"
chi_GRnews.60.d: "The modern destroyer "Fuzhou" we ordered from Russia finally arrived in China today, but the Russians do not seem to have completely updated the weapons and equipment according to the requirements of the order... We can continue to transform this destroyer."
chi_GRnews.60.a: "Okay! Buy another one!"

chi_GRnews.61: "Taizhou caught fire"
chi_GRnews.61.t: "Taizhou caught fire"
chi_GRnews.61.d: "The modern destroyer "Taizhou" we ordered from Russia suddenly caught fire in a Russian shipyard!"
chi_GRnews.61.a: "What the hell..."

chi_GRnews.62: "Russian destroyer arrives at port"
chi_GRnews.62.t: "Russian destroyer arrives at port"
chi_GRnews.62.d: "The modern destroyer "Taizhou" we ordered from Russia finally arrived in China today, but the Russians did not seem to completely update the weapons and equipment according to the order, and many parts were burned black due to fire... We can continue to transform this destroyer."
chi_GRnews.62.a: "Finally got it safely"

chi_GRnews.63: "Russian destroyer arrives at port"
chi_GRnews.63.t: "Russian destroyer arrives at port"
chi_GRnews.63.d: "The modern destroyer "Ningbo" we ordered from Russia finally arrived in China today, but the Russians did not seem to completely update the weapons and equipment according to the order requirements... We can continue to transform this destroyer.\n\nWith the purchase of four modern-class missile destroyers, the strength of our navy has been greatly improved, and we can avoid the tragedy of using cargo ships to tow tanks to defend against the enemy during the Taiwan Strait crisis."
chi_GRnews.63.a: "The Chinese people long for a strong navy"

chi_GRnews.64: "China calls on us to confront US hegemony!"
chi_GRnews.64.t: "China calls on us to fight against US hegemony!"
chi_GRnews.64.d: "After China officially announced that it would end US hegemony, [CHI.GetLeader] sent a notice today, calling on us to join China in the fight against US hegemony. How should we deal with the struggle between these two superpowers?"
chi_GRnews.64.a: "Americans are more trustworthy"
chi_GRnews.64.b: "We stand with China"
chi_GRnews.64.c: "Maybe we should maintain the status quo"

chi_GRnews.65: "[From.GetName] refuses to oppose America"
chi_GRnews.65.t: "[From.GetName] refuses to oppose America"
