l_english:
#national policy
CHI_Millennium:0 "Millennium"
CHI_Millennium_desc:0 "The year 2000 marks the 51st anniversary of the founding of the People's Republic of China. Our great socialist motherland has entered a new era. How to follow the Chinese path in the new century requires the people of the whole country to jointly write a new chapter of the era."
CHI_tenth_five_year_plan:0 "Tenth Five-Year Plan"
CHI_tenth_five_year_plan_desc:0 "In March 2001, the Fourth Session of the Ninth National People's Congress adopted the Outline of the Tenth Five-Year Plan for National Economic and Social Development. In accordance with the needs of developing a socialist market economy, the strategic adjustment of the economic structure was established as the main line. Ecological construction, environmental protection, and sustainable development of the economy and society received extra attention. More attention was paid to various social undertakings such as education, culture, medical care, and sports, and more attention was paid to the coordinated development of the economy and society, so as to better meet the development needs and enjoyment needs of the broad masses of the people."
CHI_Letter_of_BUSH:0 "Letter from President Bush"
CHI_Letter_of_BUSH_desc:0 "After the China-US plane collision incident, US President Bush finally sent two "letters expressing regret" to the Chairman. Although we know that this is just a superficial effort, there is no doubt that we need to greet it with a smile at the moment."
CHI_Support_the_War_on_Terror:0 "Support the War on Terror"
CHI_Support_the_War_on_Terror_desc:0 "Even the most powerful country in the world, the United States, was attacked by terrorism. The once-mighty Twin Towers collapsed in front of everyone's eyes. Our country will never allow such a thing to happen. We must fight against everything that harms China and the Chinese people. We should vote in the UN Security Council to support the United States in its fight against terrorists in Afghanistan. They are too close to us, and it is just the right time for American imperialism to fight them head on."
CHI_Comprehensively_building_a_moderately_prosperous_society: "§YComprehensively building a moderately prosperous society§!"
CHI_Comprehensively_building_a_moderately_prosperous_society_desc: "The Congress reviewed and adopted the report "Comprehensively Building a Moderately Prosperous Society and Creating a New Situation in the Cause of Socialism with Chinese Characteristics" made by Jiang Zemin on behalf of the 15th Central Committee. In accordance with the requirement of comprehensively creating a new situation in the cause of socialism with Chinese characteristics, and based on a profound analysis of the new situation and new tasks facing the Party and the country, the Congress determined the goal of building a moderately prosperous society in an all-round way. It pointed out that in the first 20 years of this century, we must concentrate our efforts on comprehensively building a moderately prosperous society of a higher level that will benefit more than one billion people, so that the economy will be more developed, democracy will be more sound, science and education will be more advanced, culture will be more prosperous, society will be more harmonious, and people's lives will be more prosperous. This is a necessary stage of development that will connect the past and the future in order to achieve the third strategic goal of modernization, and it is also a key stage for improving the socialist market economic system and expanding opening up. After this stage of construction, we will continue to work hard for several decades to basically achieve modernization by the middle of this century and build our country into a prosperous, democratic, and civilized socialist country."
CHI_The_great_rejuvenation_of_Chinese_nation:0 "§YThe Great Rejuvenation of the Chinese Nation§!"
CHI_The_great_rejuvenation_of_Chinese_nation_desc:0 "In the report of the 16th National Congress of the Communist Party of China, we proposed the grand goal of realizing the great rejuvenation of the Chinese nation. The new century will be a century for our party to achieve great things. Too many things happened in the past few years that made us lose face in front of the United States and the world. The US imperialists may think that this can humiliate and suppress us, but they are just paper tigers. How can a sparrow know the ambition of a swan? The Communist Party of China is the party of the people. We must lead the Chinese people to continue to move towards a better era, an era where the Chinese people will never be bullied again!"
CHI_Chairman_Jiang_Reign: "Chairman Jiang's term of office"
CHI_Chairman_Jiang_Reign_desc: "Jiang Zemin is an outstanding successor to Deng Xiaoping, and a man committed to free market reforms and maintaining the political supremacy of the Communist Party of China. In the years at the turn of the century, the international situation has changed dramatically, and my country's reform and opening up and socialist modernization process has been magnificent. Chairman Jiang is an old captain at the helm, and he will lead our party and country into the vast ocean of the new century."
CHI_End_PLA_Business_Ventures: "End PLA Business Ventures"
CHI_End_PLA_Business_Ventures_desc: "To compensate for defense budget cuts, the PLA began acquiring commercial enterprises in the 1970s. However, this led to a large degree of corruption and lack of discipline, with the military increasingly colluding with capitalists. As a result, a new directive was necessary to withdraw the PLA from most sectors of the economy, but this must be implemented while increasing the budget in order to appease the military."
CHI_3_Represents_Thought: "Three Represents Thought"
CHI_3_Represents_Thought_desc: "Comrade Jiang Zemin first proposed and comprehensively elaborated the "Three Represents" important thought when inspecting work in Guangdong Province on February 25, 2000, based on a comprehensive summary of the party's historical experience and the requirements of how to adapt to the new situation and new tasks. The specific content is that the Communist Party of China always represents the development requirements of China's advanced productive forces, always represents the direction of China's advanced culture, and always represents the fundamental interests of the vast majority of the Chinese people. The "Three Represents" important thought is the foundation of our party, the basis of our governance, and the source of our strength."
CHI_Invigorate_Country_Through_STE: "Invigorate the country through science and education"
CHI_Invigorate_Country_Through_STE_desc: "'Invigorate the country through science and education' means fully implementing the idea that science and technology are the primary productive forces, adhering to the principle of education as the foundation, placing science and technology and education in an important position in economic and social development, enhancing the country's scientific and technological strength and its ability to transform into actual productive forces, improving the scientific and cultural quality of the entire nation, shifting economic construction to a track that relies on scientific and technological progress and improving the quality of workers, and accelerating the realization of national prosperity. This plan will enable our country to make up for its technological disadvantages."
CHI_Permit_Entrepreneurs_to_Join_the_CPC: "Allow entrepreneurs to join the CPC"
CHI_Permit_Entrepreneurs_to_Join_the_CPC_desc: "Absorbing outstanding members of other social classes into the Party and allowing outstanding members of new social classes, including outstanding members of private entrepreneurs, to join the Party does not mean opening the door without principles, allowing anyone who wants to come in, or forcing anyone who does not want to come in to join the Party. We will never allow those who are politically backward and have impure motives to join the Party to sneak into the Party, and we will never allow some people to join the Party simply because they have strong economic strength or personal fame.\n\nOnly those outstanding private entrepreneurs who are politically advanced, meet the conditions for joining the Party, can adhere to the Party's goals and objectives, strictly fulfill their obligations as Party members, consciously accept the supervision of the Party organization, and modelly abide by national policies and laws and regulations will be welcomed by the Party organization to join the Party."
CHI_Manufacturing_exports: "Manufacturing Exports"
CHI_Manufacturing_exports_desc: "After joining the World Trade Organization, my country has received a large amount of foreign investment and foreign trade orders. my country should continue to adopt and expand the development policy of manufacturing exports, so that it can absorb foreign investment and boost industrial construction at the fastest speed and become the beating heart of the world's manufacturing industry."
CHI_16th_National_Congress_of_CPC: "The 16th National Congress of the Communist Party of China"
CHI_16th_National_Congress_of_CPC_desc: "The 16th National Congress of the Communist Party of China was held in Beijing from November 8 to 14, 2002. The congress had 2,114 official delegates and 40 special delegates, representing more than 66 million party members across the country. The 16th National Congress of the Communist Party of China was the first national congress of the Communist Party of China in the new century. It was also a very important congress held at a new stage of development when my country entered a comprehensive well-off society and accelerated the socialist modernization. The congress determined the successor to President Jiang, Comrade Hu Jintao, who has worked in the Communist Youth League for a long time and is a low-key person."
CHI_Hu_Jintao_Agenda: "Hu Jintao's Agenda"
CHI_Hu_Jintao_Agenda_desc: "At the first session of the 10th National People's Congress, Comrade Hu Jintao was elected President of the People's Republic of China. At the Fourth Plenary Session of the 16th Central Committee, he was elected Chairman of the Central Military Commission. At the Third Session of the 10th National People's Congress, he was elected Chairman of the Central Military Commission of the People's Republic of China. At the First Plenary Session of the 17th Central Committee, he was elected Chairman of the Central Military Commission. State power has gradually been transferred to this "young man.""
CHI_16_Third_Plenum:0 "Third Plenum of the 16th Central Committee of the Communist Party of China"
CHI_16_Third_Plenum_desc:0 "The Third Plenum of the 16th Central Committee of the Communist Party of China was held in Beijing from October 11 to 14, 2003. During the meeting, the Political Bureau of the CPC Central Committee will report to the Central Committee and President Hu Jintao will determine the direction of work for the next few years."
CHI_unwaveringly_committed_to_reform_and_opening_up:0 "Unwaveringly committed to reform and opening up"
CHI_unwaveringly_committed_to_reform_and_opening_up_desc:0 "Why do we unwaveringly adhere to reform and opening up? Because it is in line with the common aspirations of the people, is the only way to develop socialism, and is an inherent requirement of the Party's advanced nature as the vanguard of the proletariat. Reform and opening up have written the most magnificent epic in Chinese history - the Chinese nation has made great strides to catch up with the trend of the times, socialist China stands tall in the east of the world, and our Party is marching proudly in the forefront of the times. By unwaveringly adhering to reform and opening up and playing this main theme of contemporary China, people have reason to look forward to a better and happier future."
CHI_developing_socialism_market_economy:0 "Developing Socialist Market Economy"
CHI_developing_socialism_market_economy_desc:0 "The socialist market economic system is a major theoretical and practical innovation of socialism with Chinese characteristics and an important component of the basic socialist economic system. In order to adapt to the new situation of economic globalization and accelerated scientific and technological progress and to build a moderately prosperous society in all respects, we must follow the strategic deployment of the 16th CPC National Congress to build a sound socialist market economic system and a more dynamic and open economic system, accelerate reform, further liberate and develop productivity, and inject strong impetus into economic development and social progress."
CHI_Adhere_to_subject_status_of_public_ownership:0 "Adhere to the subject status of public ownership"
CHI_Adhere_to_subject_status_of_public_ownership_desc:0 "Adhering to the dominant position of public ownership is one of the essential characteristics of socialism. In the primary stage of socialism in my country, we must adhere to and improve the basic economic system in which public ownership is the mainstay and multiple ownership economies co-develop. The dominant position of public ownership is a legal principle stipulated by the essence of socialism and solidified by the Constitution. It cannot and will not be shaken. State-owned enterprises are the main vehicle for the state-owned economy to play a leading role, and are also an important force in promoting national modernization and safeguarding the fundamental interests of the people."
CHI_Five_Overall_planning_and_Scientific_Outlook_on_Development:0 "Five Overall Planning and Scientific Outlook on Development"
CHI_Five_Overall_planning_and_Scientific_Outlook_on_Development_desc:0 "Hu Jintao, General Secretary of the CPC Central Committee, proposed the scientific development concept of "adhering to the people-oriented principle, establishing a comprehensive, coordinated and sustainable development concept, and promoting the all-round development of the economy, society and people". It is necessary to promote the reform and development of various undertakings in accordance with the five coordinated development requirements of "coordinating urban and rural development, coordinating regional development, coordinating economic and social development, coordinating the harmonious development of man and nature, and coordinating domestic development and opening up to the outside world""
CHI_balance_urban_and_rural_development:0 "Balance Urban and Rural Development"
CHI_balance_urban_and_rural_development_desc:0 "General Secretary Hu Jintao proposed that we should pay more attention to the development of rural areas, solve the "three rural issues", firmly implement the principle of industry feeding agriculture and cities supporting rural areas, gradually change the urban-rural dual economic structure, gradually narrow the urban-rural development gap, achieve comprehensive development of rural economy and society, implement the policy of leading the countryside with the city, promoting agriculture with industry, and promoting interactive and coordinated development between urban and rural areas, so as to achieve sustainable development of agriculture and rural economy."
CHI_new_rural_cooperative_medical_insurance:0 "New Rural Cooperative Medical Insurance"
CHI_new_rural_cooperative_medical_insurance_desc:0 "How can socialism be without the people's medical welfare? In October 2002, China clearly proposed that governments at all levels should actively guide farmers to establish a new rural cooperative medical system with major disease pooling as the main focus. In 2009, China made an important strategic deployment to deepen the reform of the medical and health system and established the status of the new rural cooperative as the basic rural medical insurance system. The new rural cooperative medical system refers to a farmer's medical mutual aid system organized, guided and supported by the government, with farmers voluntarily participating, and funded by individuals, collectives and the government, with major disease pooling as the main focus. It raises funds through individual payment, collective support and government funding."
CHI_Rural_planning_and_construction_and_development_of_rural_industries:0 "Rural Planning and Construction"
CHI_Rural_planning_and_construction_and_development_of_rural_industries_desc:0 "Rural and agricultural industries were the first production areas to enter the reform and opening up, but now they are developing the slowest and lagging behind. We must change the current situation of separation of urban and rural planning and construction, integrate urban and rural economic and social development into the government's macro-planning, coordinate urban and rural development, promote urban-rural linkage, and achieve common prosperity. Invest more in rural infrastructure to supply more human and material resources to cities. Although the dual development model has many drawbacks, entering the city to participate in large-scale industrialization and urbanization is the best way out for the agricultural population. Supporting urbanization with industrialization, promoting industrialization with urbanization, accelerating the process of industrialization and urbanization, promoting the transfer of rural labor to the secondary and tertiary industries, and the concentration of rural population in towns and cities is the development path of most countries, and we should also accelerate the expansion of urban employment."
CHI_Project_Hope:0 "Project Hope"
CHI_Project_Hope_desc:0 "We have invested too little in rural areas, so many rural children cannot even guarantee their right to education. We must increase education spending to ensure that rural children can also receive education. The Party and the state have the obligation to let the light of compulsory education shine on every Chinese child - the successor to our great socialist cause."
CHI_Abolish_agricultural_tax:0 "Abolish Agricultural Tax"
CHI_Abolish_agricultural_tax_desc:0 "On February 22, 2006, the State Post Bureau issued a commemorative stamp with a face value of 80 cents, named "Complete Abolition of Agricultural Tax", to celebrate the abolition of the "Agricultural Tax Regulations" from January 1, 2006. The tax imposed on farmers for two thousand years in China has finally been eliminated under the correct leadership of our party. As an important measure for the government to solve the "three rural issues", the abolition of agricultural tax not only reduces the burden on farmers, increases their civil rights, embodies the principle of "fairness" in modern taxation, but also conforms to the trend of "industry feeding agriculture". Since 1992, China's reform and opening up has officially reformed the agricultural system. The abolition of agricultural tax, which has lasted for a thousand years, in 2006 marked the beginning of a new period of reform and opening up in China."
CHI_Regional_coordinated_development:0 "Regional Coordinated Development"
CHI_Regional_coordinated_development_desc:0 "Regional coordinated development strategy is one of the "five coordinated" strategies proposed by the Third Plenary Session of the 16th CPC Central Committee and was put forward by Premier Wen Jiabao. The specific contents are: actively promote the development of the western region, revitalize the old industrial bases such as the Northeast, promote the rise of the central region, encourage the eastern region to take the lead in development, continue to give play to the advantages and enthusiasm of each region, and gradually reverse the trend of widening regional development gaps through improving market mechanisms, cooperation mechanisms, mutual assistance mechanisms, and support mechanisms, and form a new pattern of mutual promotion, complementary advantages, and common development among the east, middle, and west."
CHI_eastern_region_leading_development:0 "Eastern Leading Development Strategy"
CHI_eastern_region_leading_development_desc:0 "The opening of Shenzhen Special Economic Zone in the eastern part of my country in the 1980s led to the reform and development of the Pearl River Delta; the development and opening of Pudong New Area in the 1990s led to the reform and development of the Yangtze River Delta and the Yangtze River Basin. The Pearl River Delta and the Yangtze River Delta have rapidly become the two most active "poles" of China's economy. The leading development of China's eastern region can more effectively support the development of the western region, the rise of the central region and the revitalization of the northeast, and promote and form a good situation of interaction between the east, the middle and the west and coordinated development of the national economy."
CHI_The_rise_of_central:0 "The Rise of Central"
CHI_The_rise_of_central_desc:0 "The Central Region includes six provinces: Shanxi, Anhui, Jiangxi, Henan, Hubei, and Hunan, with a land area of 1.028 million square kilometers, accounting for 10.7% of the country's total land area. The Central Region plays a pivotal strategic role in the national regional development pattern. Promoting the rise of the Central Region is an important part of implementing the four major regional layouts and the "three major strategies", an objective need to build a unified national market and promote the formation of benign interactive and coordinated development among the eastern, central, and western regions, a strategic measure to optimize the national economic structure and maintain sustained and healthy economic development, and an inevitable requirement to ensure the timely realization of the goal of building a well-off society in an all-round way."
CHI_Northeast_Revitalization:0 "Northeast Revitalization Strategy"
CHI_Northeast_Revitalization_desc:0 "On August 3, 2003, Wen Jiabao, member of the Standing Committee of the Political Bureau of the CPC Central Committee and Premier of the State Council, presided over a meeting of the highest level in Changchun to revitalize the old industries in Northeast China. He pointed out that the implementation of the Western Development Strategy, accelerating the development of the eastern region and taking the lead in achieving a well-off society and modernization in an all-round way, supporting the Northeast and other old industrial bases to speed up adjustment and transformation, implementing the interaction between the east and the west, driving the central region, and promoting the coordinated development of regional economy are the major strategic layouts made by the CPC Central Committee for my country's modernization construction. With new ideas, new systems, new mechanisms and new methods, we will find a new way to accelerate the revitalization of old industrial bases and fight a "Liaoshen Campaign" in the new century."
CHI_development_of_western_region:0 "Western Development Strategy"
CHI_development_of_western_region_desc:0 "The scope of the Western Development Program includes 12 provinces, autonomous regions, and municipalities: Sichuan, Shaanxi, Gansu, Qinghai, Yunnan, Guizhou, Chongqing, Guangxi, Inner Mongolia, Ningxia, Xinjiang, and Tibet. The Western Region covers an area of 6.85 million square kilometers, accounting for 71.4% of the country's total. At the end of 2002, the population was 367 million, accounting for 25% of the country's total. It accounts for about 15% of the country's GDP. The Western Region is rich in natural resources, has great market potential, and is strategically important. However, due to natural, historical, and social reasons, the economic development of the Western Region is relatively backward, with a per capita GDP of only two-thirds of the national average and less than 40% of the average of the eastern region. It is in urgent need of accelerating the pace of reform, opening up, and modernization."
CHI_Coordinate_economic_and_social_development:0 "Coordinate Economic and Social Development"
CHI_Coordinate_economic_and_social_development_desc:0 "The progress of any society is the result of the coordinated development of economy, politics and culture. Economy is the foundation, politics is the guarantee and culture is the forerunner. The three are closely related, mutually penetrating, complementary and unified in the development of society. Development is the top priority of our party in governing and rejuvenating the country. Economic growth is an important foundation for development. We must vigorously develop the national economy with public ownership as the main body."
CHI_Strengthening_State_Owned_Businesses:0 "Strengthening State Owned Businesses"
CHI_Strengthening_State_Owned_Businesses_desc:0 "State-owned enterprises are the core carriers of the state-owned economy. The nature of state-owned enterprises is the nature of enterprises owned by the whole people. The so-called enterprises owned by the whole people are actually enterprises whose means of production are jointly owned by all the people. The nature of enterprises owned by the whole people is the nature of enterprises whose means of production are jointly owned by all the people. Therefore, the nature of state-owned enterprises is actually the nature of enterprises whose means of production are jointly owned by all the people. State-owned enterprises are the concrete embodiment of socialist public ownership. Their success or failure is related to the rise and fall of the road of socialism with Chinese characteristics. We should take state-owned enterprises as the starting point to lead the vigorous development of the socialist market economy with Chinese characteristics."
CHI_Chinese_High_Speed_Rail_System:0 "China State Railway Group Co., Ltd."
CHI_Chinese_High_Speed_Rail_System_desc:0 "China National Railway Group Co., Ltd. is a wholly state-owned company established in accordance with the Company Law of the People's Republic of China and managed by the central government with the approval of the State Council. If you want to get rich, you must first build roads. A large country with a vast territory like China needs a strong, efficient and extensive transportation system to support its rapid economic development. We should rely on China National Railway Group Co., Ltd. to build China's super transportation network."
CHI_China_Baowu_Steel_Group_Corporation_Limited:0 "China Baowu Steel Group Corporation Limited"
CHI_China_Baowu_Steel_Group_Corporation_Limited_desc:0 "China Baowu Steel Group Co., Ltd. is an important state-owned backbone enterprise directly managed by the central government, with its headquarters in Shanghai. National construction requires a large amount of steel and other metal raw materials. my country is the world's largest steel producer, but it still needs to vigorously develop the steel industry. On September 22, 2016, the State-owned Assets Supervision and Administration Commission of the State Council announced that, with the approval of the State Council, Baosteel Group Co., Ltd. and Wuhan Iron and Steel (Group) Corporation will implement a joint reorganization."
CHI_State_Grid_Corporation:0 "State Grid Corporation of China"
CHI_State_Grid_Corporation_desc:0 "State Grid Corporation of China was established on December 29, 2002. It is a wholly state-owned company directly managed by the central government established in accordance with the provisions of the Company Law. The responsibilities of State Grid Corporation of China are to build an energy internet, ensure national energy security, and serve the people's better life. It is a large-scale state-owned key backbone enterprise that is related to the lifeline of the national economy and national energy security. The company's core business is to invest, build and operate power grids, and it undertakes the basic mission of ensuring safe, economical, clean and sustainable power supply."
CHI_Coordinating_Development_of_Human_and_Nature_Harmoniously:0 "Coordinating Development of Human and Nature"
CHI_Coordinating_Development_of_Human_and_Nature_Harmoniously_desc:0 "General Secretary Hu Jintao emphasized in his important speech at the Central Party School that the first principle of the Scientific Outlook on Development is development, the core is people-oriented, the basic requirement is comprehensive, coordinated and sustainable development, and the fundamental method is to coordinate and balance. Comprehensive, coordinated and sustainable development is an inherent requirement of the Scientific Outlook on Development. The so-called sustainable development is to promote harmony between man and nature, to achieve coordination between economic development and population, resources and environment, to adhere to the path of civilized development with developed production, affluent life and good ecology, and to ensure sustainable development from generation to generation. Coordinating the harmonious development of man and nature is an important issue that must be addressed in order to thoroughly implement the Scientific Outlook on Development and achieve sustainable development."
CHI_Socialist_concept_of_honor_and_disgrace:0 "Socialist Concept of Honor and Disgrace"
CHI_Socialist_concept_of_honor_and_disgrace_desc:0 "On March 4, 2006, General Secretary Hu Jintao proposed at the joint discussion of the Democratic League and the China Democratic Progressive Party at the 4th Session of the 10th National Committee of the Chinese People's Political Consultative Conference that we should guide the broad masses of cadres and the people, especially the young people, to establish a socialist concept of honor and disgrace with the eight honors and eight disgraces as the main content: to be proud of loving the motherland and to be ashamed of harming the motherland. To be proud of serving the people and to be ashamed of betraying the people. To be proud of advocating science and to be ashamed of ignorance. To be proud of hard work and to be ashamed of being lazy. To be proud of solidarity and mutual assistance and to be ashamed of harming others for personal gain. To be proud of being honest and trustworthy and to be ashamed of being selfless for the sake of profit. To be proud of abiding by laws and disciplines and to be ashamed of breaking laws and disciplines. To be proud of hard work and to be ashamed of being arrogant and extravagant."
CHI_harmonious_society:0 "Harmonious Society"
CHI_harmonious_society_desc:0 "Building a socialist harmonious society is a major strategic task proposed by our Party in the new century and new stage based on the overall layout of the cause of socialism with Chinese characteristics and the overall situation of building a moderately prosperous society in all respects. Since the 16th CPC National Congress, Comrade Hu Jintao has comprehensively analyzed the opportunities and challenges facing my country's development based on changes in the international and domestic situation, and profoundly expounded on the significance, guiding ideology, goals and tasks, working principles and major deployments of building a socialist harmonious society. He has put forward a series of new ideas, new viewpoints and new conclusions, enriching and developing the Marxist theory on socialist social construction. Comrade Hu Jintao's thoughts on building a socialist harmonious society are an important part of the Scientific Outlook on Development, and have important and far-reaching guiding significance for building a moderately prosperous society in all respects, accelerating the advancement of socialist modernization and realizing the Chinese dream of the great rejuvenation of the Chinese nation."
CHI_Developing_the_photovoltaic_industry:0 "Developing the Photovoltaic Industry"
CHI_Developing_the_photovoltaic_industry_desc:0 "On December 19, 2012, Premier Wen Jiabao chaired an executive meeting of the State Council to study and determine policy measures to promote the healthy development of the photovoltaic industry. The photovoltaic industry is a high-quality clean energy. 76% of my country's land is sunny, and the distribution of light energy resources is relatively even. Compared with hydropower, wind power, nuclear power, etc., solar power generation has no emissions and noise, and the application technology is mature, safe and reliable. The development of clean green energy is not only an inherent requirement of the scientific outlook on development, but also a century-old cause that will benefit future generations."
CHI_Coordinate_domestic_development_and_opening_up:0 "Coordinate domestic development and opening up"
CHI_Coordinate_domestic_development_and_opening_up_desc:0 "China will not follow the imperialist path of foreign aggression. The bloody and tearful modern history of nearly a hundred years has made us cherish peace and oppose war more than the people of any other country. Only a stable external environment can bring long-term and stable development opportunities. Coordinating the internal and external environment of our great motherland and creating harmonious and friendly foreign relations will enable us to go further and more steadily on the journey of socialism with Chinese characteristics."
CHI_2008_financial_crisis_CHI:0 "Turbulent Waves"
CHI_2008_financial_crisis_CHI_desc:0 "The capitalist world is ultimately unable to escape periodic economic crises. The fat-bellied capitalists on Wall Street are willing to bury themselves and their accomplices in graves for a little profit. As a socialist country, we do not need to worry about their financial tricks at all. However, our manufacturing exports, which we rely on, have suffered a fatal blow because foreign buyers have gone bankrupt in the financial crisis. This is the biggest crisis we have encountered since the reform and opening up. The Party and the country must deal with this crisis with caution."
CHI_a_package_Financial_plan:0 "Financial Package Plan"
CHI_a_package_Financial_plan_desc:0 "On November 5, 2008, Premier Wen Jiabao chaired an executive meeting of the State Council to study and deploy measures to further expand domestic demand and promote steady and rapid economic growth. At the meeting, an economic stimulus plan driven by national investment was summarized. According to preliminary estimates, the implementation of these ten measures will require an investment of approximately RMB 4 trillion by the end of 2010."
CHI_Shantytown_renovation:0 "Shantytown Renovation"
CHI_Shantytown_renovation_desc:0 "Many urban areas in China have historical legacy of concentrated and dilapidated housing, dilapidated houses and dilapidated courtyards. The distance between households is extremely crowded, public facilities are not well-equipped, and there are obvious public safety risks in fire protection, travel, production and life. Investing in improving these dilapidated areas not only provides a direction for the inflow of excess production capacity, but also effectively improves people's living standards. For the renovation of shantytowns, the government provides support in terms of fiscal investment, construction land, taxes, fees and credit. Between 2007 and 2011, the Chinese government allocated a total of 73 billion yuan in subsidies, of which more than 90% of the subsidies were invested in financially distressed areas in central and western China."
CHI_Accelerate_infrastructure_construction:0 "Accelerate Infrastructure Construction"
CHI_Accelerate_infrastructure_construction_desc:0 "In the 1930s, in response to the unprecedented economic depression, US President Roosevelt implemented the famous "New Deal", one of the most important policies of which was the government-led large-scale infrastructure construction. These infrastructure projects not only increased employment and people's income, but also laid a solid foundation for the subsequent development of the US economy. The "4 trillion" economic stimulus is expected to boost economic growth by about 1 percentage point each year, with nearly half of the funds invested in transportation infrastructure and urban and rural power grid construction. This will not only enable my country to accelerate its escape from the negative effects of the global financial crisis, but also expand domestic demand and stimulate the development of my country's economy and consumption. In line with the central government's plan, provincial and municipal governments across the country have focused on infrastructure projects and used investment to drive economic growth. In 2008, the total investment in the whole society will exceed 16 trillion yuan."
CHI_Post_disaster_reconstruction:0 "Post-disaster Reconstruction"
CHI_Post_disaster_reconstruction_desc:0 "The Wenchuan earthquake destroyed many towns in western Sichuan, causing countless compatriots to suffer, and even affecting the surrounding ten provinces. Rebuilding Wenchuan and saving the people in the disaster is not only the mission of our party and country, but also an important means to concentrate social resources and enhance social cohesion. The large amount of materials needed for disaster relief and reconstruction will all be purchased by the government from domestic sources. The "Regulations on Post-Wenchuan Earthquake Recovery and Reconstruction" was adopted at the 11th Executive Meeting of the State Council on June 4, 2008, and is hereby promulgated and will come into effect on the date of promulgation."
CHI_expend_welfare: "Expand welfare spending"
CHI_expend_welfare_desc: "Production is always relatively oversupplied. The fundamental reason is that consumption capacity is insufficient to meet demand. We should increase spending on people's livelihood and increase domestic demand. According to statistics, of the 4 trillion yuan investment, investment in people's livelihood projects, namely education, health, culture and other social undertakings, accounted for 44% of the total expenditure."
CHI_Made_in_China:0 "§Y"Made in China"§!"
CHI_Made_in_China_desc:0 "In the past, our country was known as the world's factory, undertaking one-third of the world's manufacturing production, providing unprecedented funds and opportunities for national development. However, this production model that relies on exports will bring great disasters to our economy if there are mistakes in the sales link. The financial crisis in 2008 is the best example. Under the correct leadership of the Party and the State, we have emerged from the impact of the capitalist world economic crisis and transformed from a factory country that passively accepted orders to a manufacturing power that can independently adjust production. Let the Made in China trademark be printed on our products, and our name will be known all over the world!"
CHI_Eliminating_Outdated_Production:0 "Eliminate Outdated Production Capacity"
CHI_Eliminating_Outdated_Production_desc:0 "We can no longer tolerate inefficient enterprises with below-average technology wasting resources. We must take this opportunity to eliminate them, thereby reducing pressure on resources and the environment and promoting industrial upgrading."
CHI_RMB:0 "Monetary Sovereignty of RMB"
CHI_RMB_desc:0 "Monetary sovereignty is an important factor affecting economic development. Unlike other major economies, our monetary sovereignty is always in our own hands, keeping a certain distance from the US dollar, so we have more room to implement monetary policy. We must remember the tragedy of the Japanese economy, which was once at its peak in the last century, but was cut off by the Plaza Accord. We must use absolute monetary sovereignty and flexible monetary and fiscal policies to safeguard national development."
CHI_prudent_monetary_policy:0 "Prudent Monetary Policy"
CHI_prudent_monetary_policy_desc:0 "The so-called prudent monetary policy means: aiming at currency stability, correctly balancing the relationship between preventing financial risks and supporting economic growth, maintaining a moderate growth in money supply while improving loan quality, and supporting the sustained, rapid and healthy development of the national economy. The package of plans has injected a huge amount of investment into the market, which will inevitably bring about inflation and other vicious consequences while stimulating economic development. Allowing the central bank to control money issuance while lowering the reserve requirement ratio can mitigate the impact of the injected funds."
CHI_North_South_Water_Transfer: "South-to-North Water Transfer Project"
CHI_North_South_Water_Transfer_desc: "To alleviate the severe imbalance in water supply between the north and south of our country, we should invest in a series of projects such as canals and reservoirs to divert water to key water-deficient areas. However, this will be a costly undertaking, requiring the relocation of hundreds of thousands of people and long-term, high-investment construction."
CHI_East_Line_Projec_South_to_North_Water_Diversion_Project: "East Line Project of South to North Water Diversion"
CHI_East_Line_Projec_South_to_North_Water_Diversion_Project_desc: "The East Line Project plans to divert water from the main stream of the Yangtze River near Yangzhou, Jiangsu Province, and use the Beijing-Hangzhou Grand Canal and its parallel rivers to transport water, connecting Hongze Lake, Luoma Lake, the South Four Lakes, and Dongping Lake, and serving as a regulating reservoir. After pumping water into Dongping Lake step by step through pumping stations, the water is divided into two routes. One route flows north through the Yellow River and then flows to Tianjin by gravity. The main water diversion line from the Yangtze River to Tianjin Beidagang Reservoir is about 1,156 kilometers long; the other route flows eastward through the newly opened Jiaodong area water diversion line to connect to the Huangjiqing Canal and supply water to the Jiaodong area."
CHI_Central_Line_Projec_of_South_to_North_Water_Diversion: "Central Line Project of South to North Water Diversion"
CHI_Central_Line_Projec_of_South_to_North_Water_Diversion_desc: "The Central Line Project of South to North Water Diversion Project is a water diversion project that diverts water from the Danjiangkou Reservoir, which is located in the middle and upper reaches of the Han River, the largest tributary of the Yangtze River, and spans the two provinces of Hubei and Henan. The main canal is dug at the head of the project in Xichuan County, Henan Province, on the east bank of the Danjiangkou Reservoir. The canal is dug along the central and western edge of the North China Plain through Fangcheng Pass, the watershed between the Yangtze River and the Huaihe River. The canal passes through the Yellow River through a tunnel, flows northward along the west side of the Beijing-Guangzhou Railway, and flows to Tuancheng Lake in the Summer Palace in Beijing. After the implementation of the Central Line Project of South-to-North Water Diversion, the average annual water diversion volume in the initial stage is 9.5 billion cubic meters. In the later stage, the scale of water diversion will be further expanded according to needs, which can effectively solve the water shortage problem in the receiving areas and significantly improve the ecological environment."
CHI_Resettlement: "Resettlement"
CHI_Resettlement_desc: "The Danjiangkou Water Conservancy Project started construction in 1958. In the era of material scarcity, all available forces were mobilized to invest. However, it was forced to be suspended in 1962 due to serious quality problems. Now we need to restart the construction of this project. First, we need to relocate the residents in the area to other areas. The main areas of reservoir flooding and resettlement are Xichuan County, Nanyang City, Henan Province, and Danjiangkou City, Yun County, Yunxi County, and Zhangwan District, Hubei Province."
CHI_Danjiangkou_Reservoir: "Danjiangkou Reservoir"
CHI_Danjiangkou_Reservoir_desc: "The Danjiangkou Reservoir is surrounded by mountains, with a suitable climate, fresh air and the highest sunshine. The water near the Danjiangkou Dam is transparent, the water surface is wide and the wind is calm, making the reservoir have comprehensive benefits such as flood control, power generation, irrigation, shipping, aquaculture and tourism. The head of the South-to-North Water Diversion Project, a national key project, is located in Taocha, Xichuan County, Nanyang City, Henan Province. When it is fully completed, the reservoir will send water from the Han River to North China at a flow rate of 500 cubic meters per second."
CHI_Water_conveyance_engineering: "Water Conveyance Engineering"
CHI_Water_conveyance_engineering_desc: "Transporting water from the south to the north requires difficult projects such as the Yellow River Crossing Project, water diversion shafts, water transfer tunnels, U-shaped aqueducts, and dam heightening, and it is also very expensive."
CHI_Connect_to_Beijing: "Connect to Beijing"
CHI_Connect_to_Beijing_desc: "We have finally delivered water to the heart of the north - the great capital city of Beijing. This is not only the end point of the central line project, but also a large number of political and business dignitaries living in Beijing. They finally don't have to worry about having to endure the same water shortage as ordinary people, so they will give us a lot of support."
CHI_Building_water_saving_society: "Building a water-saving society"
CHI_Building_water_saving_society_desc: "The fundamental contradiction of water shortage in my country must be solved by building a water-saving society. By building a water-saving society, we can promote the transformation of economic growth mode, improve the ecological environment, and enhance the sustainable development capacity of the economy and society. Therefore, the significance of building a water-saving society is no less than that of the Three Gorges Project and the South-to-North Water Diversion Project. In 2000, the "Proposal of the CPC Central Committee on Formulating the Tenth Five-Year Plan for National Economic and Social Development" first proposed "building a water-saving society". In 2002, the Standing Committee of the National People's Congress clearly stipulated the construction of a water-saving society in the revised version of the Water Law."
CHI_Investigating_new_viruses: "Investigating new viruses"
CHI_Investigating_new_viruses_desc: "According to the local government, a suspected new type of influenza virus has recently appeared in Guangdong and other places. Guangdong Province sent an expert investigation team to Zhongshan City to investigate, and on January 23, 2003, issued an investigation report to all health and medical units in the province, requiring relevant units to pay attention and earnestly grasp the prevention and control of the disease. Although it is not clear what the situation is, we need to ensure that the two sessions proceed smoothly and cannot let a small virus affect major events."
CHI_Announcement: "Announcement"
CHI_Announcement_desc: "We should not block the news. This goes against the essential requirements of our governance and national rejuvenation. Evasion and concealment cannot fundamentally solve the problem. Disclosing the epidemic situation to the public may cause anxiety and panic, but this is a reality that our party and country must face."
CHI_News_blackout: "Block news"
CHI_News_blackout_desc: "What harm can a few viruses do? At most, they will cause a few sneezes. We cannot let the hard-earned stability go to waste because of such a small matter. There are better places to put our political resources."
CHI_Notify_the_World_Health_Organization: "Notify the World Health Organization"
CHI_Notify_the_World_Health_Organization_desc: "The World Health Organization has noticed the spread of the disease. We should notify them as soon as possible and request international technical assistance."
CHI_Stable_public_sentiment: "Stable public sentiment"
CHI_Stable_public_sentiment_desc: "Fighting the disease is a tough battle and a battle of offense and defense. We must appease the people and mobilize social forces to fight the evil virus."
CHI_Emergency_measures: "Emergency Measures"
CHI_Emergency_measures_desc: "Unfortunately, neither our medical community nor the World Health Organization has been able to develop effective measures to prevent and control this virus. We can only take emergency measures such as isolation and disinfection in places where the disease is discovered in order to block the path for the virus to continue to spread."
CHI_Ban_the_Quannengshen: "Ban the Almighty God"
CHI_Ban_the_Quannengshen_desc: "The Almighty God is a cult organization founded by Zhao Weishan under the guise of Christianity. It is also called "Eastern Lightning" and "Actual God". It was legally identified as a cult by the Chinese government in 1995. The "Almighty God" cult has a history of 30 years in mainland China and has used 13 different names. It has been extremely harmful to the Chinese people. It is time to uproot all these insects."
CHI_propaganda_of_Anti_Cult_propaganda: "Propaganda of Anti-Cult"
CHI_propaganda_of_Anti_Cult_propaganda_desc: "Opposing cults is not only the responsibility of our party and country, but also the responsibility of every person who loves life. We should strengthen anti-cult propaganda and educate the people and school children to identify various forms of cults. We believe that one day we will be able to completely eliminate these dark and damp rats in society, and the great cause of socialism with Chinese characteristics will surely defeat all monsters and demons."
CHI_achievement: "Big Plan"
CHI_achievement_desc: "Our great cause of socialism with Chinese characteristics must of course cover all aspects. After long-term planning in the 1990s, we will complete many feats that belong not only to China but also to all mankind in the new century as scheduled. Our cause is thriving and our future is extremely bright!"
CHI_Chinese_nation: "Chinese national identity"
CHI_Chinese_nation_desc: "The term "Chinese nation" was first proposed by Liang Qichao in his article "On the Great Trend of Changes in Chinese Academic Thought" in 1902. However, as an independent national entity, it has existed for thousands of years. For thousands of years, the various ethnic groups that have thrived on the Chinese land have been constantly blending and converging. Especially since China became a unified multi-ethnic country in the Qin and Han dynasties, the concept of great unity has been deeply rooted in the hearts of the people. The various ethnic groups have lived in mixed distribution, are economically interdependent, culturally inclusive, and emotionally close to each other, eventually forming a diverse and unified Chinese nation. Under the leadership of the great Communist Party of China, every ethnic group on our land will be closely united like pomegranate seeds, and steadily move towards the great cause of the great rejuvenation of the Chinese nation."
CHI_History_and_Future: "History and Future"
CHI_History_and_Future_desc: "General Secretary Hu Jintao proposed "remembering the past and learning from it" at the meeting commemorating the 60th anniversary of the victory of the Chinese People's War of Resistance Against Japanese Aggression and the World Anti-Fascist War. We emphasize that remembering history is not to continue hatred, but to learn from history and look to the future. Japan is our neighbor. Although Japanese fascist imperialism once launched a brutal war of aggression against China, as long as Japan is willing to embrace peace, we should also work with them to maintain the hard-won peace."
CHI_Friends_from_afar: "Friends from afar"
CHI_Friends_from_afar_desc: "Taiwan has been separated from the embrace of our great motherland for many years. Due to ideological conflicts and the interests of all parties involved, the Taiwan issue has always been a mess. Fortunately, the current leader of the Taiwan region is a man of the big picture who still supports the one-China principle. We should welcome his arrival with courtesy."
CHI_Opening_Tourism_to_Taiwan: "Easing restrictions on tourism to Taiwan"
CHI_Opening_Tourism_to_Taiwan_desc: "We will gradually open up free travel for residents to Taiwan to deepen cultural exchanges between the two sides of the Taiwan Strait."
CHI_The_Four_Megaprojects_of_China_in_New_Century: "The Four Megaprojects of China in the New Century"
CHI_The_Four_Megaprojects_of_China_in_New_Century_desc: "Our socialist cause can create miracles. Under the correct leadership of the Party, the power of the people is endless and can build miracle projects in human history. During the 15th Five-Year Plan, the four projects that my country focused on developing and constructing, namely the Qinghai-Tibet Railway, the West-East Gas Transmission Project, the West-East Power Transmission Project, and the South-to-North Water Diversion Project, were called the "Four Megaprojects of China in the New Century". Except for the South-to-North Water Diversion Project, the other three are also key projects in the development of the western region."
CHI_Qinghai_Tibet_Railway_Completed: "Qinghai-Tibet Railway is fully opened to traffic"
CHI_Qinghai_Tibet_Railway_Completed_desc: "The Tibetan region is the slowest developing and most difficult region to build in my country since the reform and opening up. Until now, there is no decent railway that can reach the capital Lhasa. How can we be without Tibetan compatriots in our great journey of socialism with Chinese characteristics? We will conquer the Qinghai-Tibet Plateau and the roof of the world, so that the Tibetan people can also embrace the great motherland! Build railways to the sky!"
CHI_project_of_natural_gas_transmission_from_West_to_East: "West-to-East Gas Transmission Project"
CHI_project_of_natural_gas_transmission_from_West_to_East_desc: "There are countless fossil fuel resources in the west of our country, but the developed eastern regions are very short of natural gas and other resources. Transporting natural gas from the west to the east will allow residents of eastern cities to have access to sufficient natural gas."
CHI_West_East_electricity_transmission_project: "West-East Electricity Transmission Project"
CHI_West_East_electricity_transmission_project_desc: "Directly generating electricity in the west and transmitting it to the east can not only promote the development of western industries, but also reduce the loss of resources during transportation."
CHI_CTL: "Coal-to-Liquid Technology"
CHI_CTL_desc: "Coal-to-liquid is a technology that uses coal as raw material to produce oil and petrochemical products through chemical processing. my country is rich in coal resources. In order to ensure national energy security and meet the urgent need of the national energy strategy for indirect liquefaction technology, in 2001, the "863" plan of the Ministry of Science and Technology and the Chinese Academy of Sciences jointly launched the "Coal-to-Liquid" major scientific and technological project. Two years later, the Shanxi Coal Chemistry Institute of the Chinese Academy of Sciences, which undertook this project, has made a series of important progress. The coal-to-liquid developed in my country is completely different from common diesel. It is clear and transparent, almost odorless, with extremely low content of pollutants such as sulfur and nitrogen, and a cetane number of more than 75. It has the characteristics of high power and no pollution, which is 20 times higher than the Euro IV standard. It is an excellent environmentally friendly clean fuel."
CHI_Continue_build_fossil_fuel_power: "Continue to expand fossil fuel power plants"
CHI_Continue_build_fossil_fuel_power_desc: "The rapid economic development has led to a rapid increase in energy demand. Continue to build more power plants!"
CHI_The_Eleventh_Five_Year_Plan: "The Eleventh Five-Year Plan"
CHI_The_Eleventh_Five_Year_Plan_desc: "In October 2005, the Fifth Plenary Session of the 16th CPC Central Committee adopted the "Proposal of the CPC Central Committee on Formulating the Eleventh Five-Year Plan for National Economic and Social Development". In March 2006, the Fourth Session of the Tenth National People's Congress reviewed and adopted the "Outline of the Eleventh Five-Year Plan for National Economic and Social Development". The "Eleventh Five-Year Plan" is the first five-year plan formulated after the scientific outlook on development was proposed. Compared with previous five-year plans, it has a turning point significance. Its main tasks are: comprehensively implement the scientific outlook on development. Adhere to the "six musts" principle: that is, we must maintain stable and rapid economic development, we must accelerate the transformation of economic growth mode, we must improve independent innovation capabilities, we must promote coordinated development of urban and rural areas, we must strengthen the construction of a harmonious society, and we must continue to deepen reform and opening up."
CHI_Peaceful_diplomacy: "Peaceful Diplomacy"
CHI_Peaceful_diplomacy_desc: "No country loves peace more than China, and no nation cherishes peace more than the Chinese nation. We will never engage in hegemony or power politics. No matter how foreigners slander and defame us, we have never launched any war of aggression since our founding in 1949, and we will never do so in the future. Amid the call for peace, we will appear on the international stage with the face of a new era."
CHI_manned_space_flight: "First manned spaceflight"
CHI_manned_space_flight_desc: "Our country has finally sent the first Chinese astronaut, Comrade Yang Liwei, into space. This glorious Communist Party member carries the aerospace hopes of all China. Hundreds of years ago, our country missed the Age of Exploration, and now we will never miss the Space Age again."
CHI_United_Nations_Millennium_Summit: "United Nations Millennium Summit"
CHI_United_Nations_Millennium_Summit_desc: "From September 6 to 8, 2000, the United Nations Millennium Summit was held at the United Nations Headquarters in New York. The theme of the summit was "The Role of the United Nations in the 21st Century". The United Nations Millennium Summit was unprecedented in scale, with representatives from more than 180 countries, including heads of state or government of more than 150 countries, attending the summit, exceeding the number of heads of state or government attending the 50th anniversary celebration of the founding of the United Nations in 1995. President Jiang delivered a speech at the summit calling for world peace and the world to work together, which won applause from the audience."
CHI_2008_Olympic_Games: "2008 Beijing Olympic Games"
CHI_2008_Olympic_Games_desc: "One world, one dream. People around the world will witness the glorious cause of the great rejuvenation of the Chinese nation flourishing!"
CHI_Embrace_Internet: "Embrace the Internet"
CHI_Embrace_Internet_desc: "The Internet has become an important part of our people's lives and a good tool for administrative management. We should actively embrace this emerging thing and accept the Internet with a more practical attitude, rather than viewing it as a scourge."
CHI_QQ: "Tencent QQ"
CHI_QQ_desc: "Tencent QQ is an Internet-based instant messaging software launched by Tencent. After several years of development, QQ has become a daily communication tool for many people."
CHI_Taobao: "TaoBao"
CHI_Taobao_desc: "TaoBao is the largest online retail and business community in the Asia-Pacific region. It was founded by Alibaba Group in May 2003 and leads the development of e-commerce in China."
CHI_JD: "JD.com"
CHI_JD_desc: "On June 18, 1998, Liu Qiangdong founded JD.com in Zhongguancun, and it soon developed into China's most influential electronic sales platform."
CHI_17_Third_Plenum: "The Seventeenth National Congress of the Communist Party of China"
CHI_17_Third_Plenum_desc: "The 17th National Congress of the Communist Party of China was held in Beijing from October 15 to 21, 2007. The theme of the Congress was: Hold high the great banner of socialism with Chinese characteristics, take Deng Xiaoping Theory and the important thought of "Three Represents" as guidance, thoroughly implement the Scientific Outlook on Development, continue to emancipate the mind, adhere to reform and opening up, promote scientific development, promote social harmony, and strive for new victories in building a well-off society in an all-round way. Hu Jintao, on behalf of the 16th Central Committee, delivered a report to the Congress entitled Hold High the Great Banner of Socialism with Chinese Characteristics and Strive for New Victories in Building a Well-off Society in an All-round Way."
CHI_China_Japan_Trade: "China-Japan Trade"
CHI_China_Japan_Trade_desc: "Both China and Japan are among the most economically developed countries in the world. The trade volume between the two countries has been rising since the normalization of relations in the 1970s. After entering this century, the development speed of China-Japan bilateral trade has further accelerated. In particular, in 2002, 2006 and 2011, the trade volume between China and Japan exceeded 100 billion US dollars, 200 billion US dollars and 300 billion US dollars respectively. China became Japan's largest trading partner and largest export market in 2007 and 2009 respectively."
CHI_welcome_Japanese_Culture: "Welcome Japanese Culture"
CHI_welcome_Japanese_Culture_desc: "Like us, Japan has a rich traditional culture as well as a highly developed modern pop culture. Japanese pop culture, such as animation, music, and video games, is very popular among young people in our country. We should welcome and appreciate the style of this neighbor."
CHI_JAP_apologize_crime: "Make Japan Face Up To History"
CHI_JAP_apologize_crime_desc: "Historically, Japan brought terrible disasters to the Chinese nation. We should demand that Japan view history correctly, rather than continue its past erroneous behavior of distorting history. This can also test whether they truly love peace."
CHI_under_the_same_sky: "Seeking common ground"
CHI_under_the_same_sky_desc: "No matter how much we hate Japan, China and Japan are geographically neighbors and are neighboring countries separated by a narrow strip of water. The historical grievances between China and Japan should not become a shackle that hinders the peaceful exchanges between the two peoples. We should treat the peace-loving Japanese people with a more tolerant demeanor of a great power. As long as they still cherish and uphold peace, who would regard a small island that only cares about its own internal affairs as an enemy?"
CHI_Korean_Peninsula: "Korean Peninsula"
CHI_Korean_Peninsula_desc: "The two hostile countries on the Korean Peninsula are the product of the Cold War. The two superpowers, the United States and the Soviet Union, created two opposing regimes on the Korean Peninsula after the end of World War II for their own national interests. The United States even hindered North Korea's war of national reunification in the 1950s. China has an influence in this region that is no less than that of the United States. As a peace-loving major country, we have the responsibility to heal the trauma suffered by the people of the Korean Peninsula and maintain peace on the peninsula - this is also for the peace of China."
CHI_Maintain_Commitment_of_Denuclearization: "Maintain Commitment of Denuclearization"
CHI_Maintain_Commitment_of_Denuclearization_desc: "We understand that North Korea is developing nuclear weapons to maintain its national security, but nuclear weapons are the biggest threat to peaceful development. Given the significance of peace on the Korean Peninsula to China and our unquestionable influence on North Korea, we can certainly ask them to maintain their commitment to denuclearization - at least verbally."
CHI_Increase_Exports_to_the_North_Korea: "Increase Exports to the North Korea"
CHI_Increase_Exports_to_the_North_Korea_desc: "North Korea has long been under international sanctions, which has restricted their imports and exports, and even indirectly led to a deepening of the Misery March. We have opened many backdoors for this poor neighbor, and now we can further expand trade with North Korea to help their economy grow better. China will always help weak countries."
CHI_Strengthen_Relations_with_South_Korea: "Strengthen Relations with South Korea"
CHI_Strengthen_Relations_with_South_Korea_desc: "South Korea has a large trade relationship with our country. There is no historical hatred or other conflicts of interest between the two countries. Both sides have a common historical memory of being invaded by Japan and regret that the country has not been unified. For this neighbor, we need to strengthen our relationship with each other, both economically and politically."
CHI_China_and_Korea_Free_Trade_Agreement: "China-Korea Free Trade Area"
CHI_China_and_Korea_Free_Trade_Agreement_desc: "China and South Korea have both cooperation and competition in the economy. We plan to establish a free trade zone between the two countries to further deepen trade between the two countries. Although it is still in the process of negotiation and planning, and the United States will definitely hinder it, we are confident that we can reach this consensus that will benefit the people of both countries."
CHI_the_Golden_Shield_Project: "Golden Shield Project"
CHI_the_Golden_Shield_Project_desc: "The "Golden Shield" Project is essentially a project to build a public security communication network and computer information system. It is one of the 12 important business systems for the national e-government construction. In August 2003, the State Council approved and the National Development and Reform Commission formally approved the "Golden Shield" Project Preliminary Design Plan and Funding Budget. From September 2 to 3, 2003, the Ministry of Public Security organized a national "Golden Shield" Project work conference, marking the official launch of the "Golden Shield" project. On May 19, 2006, the first phase of the national "Golden Shield" project was completed as scheduled. This will help my country control the growing chaos on the Internet and strengthen security governance."
CHI_The_Great_Firewall: "The Great Firewall"
CHI_The_Great_Firewall_desc: "The Internet is an area we are not yet fully familiar with, and we lack experience in Internet social governance. The Chinese people are very different from people in other countries in ideology, living environment, and historical cognition. Countries led by the United States are constantly trying to use the Internet to deepen their ideological penetration into my country, which poses a huge challenge to my country's social security and stability. It is urgent to build an information firewall to resist the threat of foreign Internet to Chinese society."
CHI_2009_National_Day_military_parade: "2009 National Day Military Parade"
CHI_2009_National_Day_military_parade_desc: "The military parade to celebrate the 60th anniversary of the founding of the People's Republic of China is the 14th major military parade in the history of the People's Republic of China and the first major military parade since the 21st century. President Hu Jintao reviewed the PLA troops on Tiananmen Square, fully displaying the PLA's weapons and equipment and informatization achievements, and showing the economic and technological development of our great socialist motherland. Chairman Mao Zedong once said, "All imperialism is a paper tiger." Let all hostile countries and sewer rats who attempt to subvert China tremble! No one can prevent China from achieving its great rejuvenation!"
CHI_Expo_2010_Shanghai: "2010 Shanghai World Expo"
CHI_Expo_2010_Shanghai_desc: "China 2010 Shanghai World Expo is the 41st World Expo, held in Shanghai, China from May 1 to October 31, 2010. This Expo is also the first registered World Expo held by China, with the theme of "Better City, Better Life". The achievements of our socialist cause are displayed before the people of the world, and our socialist road is infinitely broad."
CHI_action_of_Crime_crackdown: "Crack down on crime and eliminate evil"
CHI_action_of_Crime_crackdown_desc: "At the end of 2000, my country launched its first special campaign to "crack down on gangsters and eliminate evil". The CPC Central Committee and the State Council issued the "Notice on Launching a Special Campaign to Crack Down on Gangsters and Eliminate Evil", deciding to launch a three-year special campaign to crack down on gangsters and eliminate evil across the country."
CHI_continue_Crime_crackdown_action: "Continue to crack down on crime and evil"
CHI_continue_Crime_crackdown_action_desc: "In February 2006, the Central Political and Legal Affairs Commission deployed a nationwide special campaign to combat organized crime and eliminate evil. A special coordination group for combating organized crime and eliminating evil was established at the central level, and a national "Anti-Crime Office" was established. Since then, a national meeting has been held every year, with central leaders personally mobilizing and deploying the work, and all regions and departments have made in-depth progress."
CHI_Revision_of_Criminal_Law: "Revision of the Criminal Law"
CHI_Revision_of_Criminal_Law_desc: "In order to more effectively combat the economic support of criminal gangs, the 19th meeting of the 11th National People's Congress Standing Committee passed the Criminal Law Amendment (VIII) on February 25, 2011, adding property penalties to organized crime. The relevant judicial interpretation of the Supreme People's Court also stipulates that the property and income accumulated by organized crime gangs and their members, as well as the tools used for crimes, shall be recovered and confiscated according to law."
CHI_Remove_protective_umbrella: "Remove Protective Umbrella"
CHI_Remove_protective_umbrella_desc: "Protective umbrellas have always been an important factor in promoting the spread and rampant growth of criminal gangs, and have always been the focus of special efforts to combat organized crime. We must strictly implement the criminal policy of combining leniency with severity, and severely punish the organizers, leaders, key members of organized crime and their "protective umbrellas" in accordance with the law, and leniently reduce the punishment of other participants with less serious crimes in accordance with the law. We must combine the fight against organized crime with the fight against corruption, and stipulate that clues of "protective umbrellas" found in the special fight against organized crime will be dealt with first, and any clues found will be investigated and dealt with, no matter which officials are involved, they must be investigated to the end and no leniency will be shown. In particular, we must focus on supervising cases involving organized crime and corruption that have been intertwined for a long time and in depth, as well as cases involving organized crime and corruption in the field of poverty alleviation. "
CHI_Performance_indicators: "Performance Indicators"
CHI_Performance_indicators_desc: "Officials need to have political achievements to be promoted. Taking the fight against organized crime as a major political task and adding it to the performance assessment criteria can effectively motivate local officials to arrest organized crime. But this does not mean that the standards for identifying organized crime groups can be relaxed, the fight against organized crime can be expanded, or even that the fight against organized crime can be treated with the attitude of pursuing political achievements in order to complete certain indicators and participate in certain rankings."
CHI_rewards_to_informants: "Rewards to informants"
CHI_rewards_to_informants_desc: "The eyes of the masses are sharp. For a long time, evil forces have used intimidation, threats and retaliation to persecute informants, causing everyone to feel insecure and afraid to report. We should not only reward those who speak out bravely, but also protect them from illegal persecution."
CHI_Initial_results: "Initial results achieved"
CHI_Initial_results_desc: "After a series of in-depth crackdowns on organized crime, the rampant situation of organized crime has been brought under control, and there are no longer any brazen criminal gangs openly running rampant in society. Nevertheless, organized crime still exists in some areas beyond our control."
CHI_Keep_up_good_work: "Continue our efforts"
CHI_Keep_up_good_work_desc: "Combating organized crime is a long-term task. We must always remain vigilant, normalize and popularize the crackdown on organized crime, and never allow our efforts to be wasted at a crucial moment."
CHI_Acquisition_of_foreign_bankrupt_enterprises: "Acquisition of foreign bankrupt enterprises"
CHI_Acquisition_of_foreign_bankrupt_enterprises_desc: "The global financial crisis has submerged countless overseas companies, and a large number of them have declared bankruptcy. This is a huge opportunity. We will use the foreign exchange accumulated over a long period of time to acquire these bankrupt companies at low prices and turn them into huge overseas assets."
CHI_US_Treasury_Securities: "Purchase of US Treasury Securities"
CHI_US_Treasury_Securities_desc: "The US financial crisis has led to a relative depreciation of the US dollar. At the same time, a large number of US dollars have entered the market due to runs on the US dollar. Taking this opportunity to quickly buy a large number of cheap US bonds is an important action to control the international financial discourse power, and it is also an effective way to enhance my country's discourse power against the United States."
CHI_lower_required_reserve_ratios_of_Central_Bank: "lower required reserve ratios of Central Bank"
CHI_lower_required_reserve_ratios_of_Central_Bank_desc: "Although my country has to implement a prudent monetary policy, it must continue to order the central bank to reduce reserve ratios in order to issue more loans and use more financial leverage to stimulate economic development. Although this will cause certain inflation and adverse economic effects, it is insignificant compared to the financial crisis that needs to be dealt with urgently."
CHI_Ensure_the_flow_of_funds: "Ensure the flow of funds"
CHI_Ensure_the_flow_of_funds_desc: "We have issued a large amount of currency and loans. These funds should flow into the manufacturing and domestic demand sectors according to our plan. We cannot let the funds idle in the bad debt pile. For enterprises that are unwilling to comply, let them go bankrupt and then merge them into state-owned enterprises. Do you really think this is a capitalist country?"
CHI_Grand_Design: "Grand Plan"
CHI_Grand_Design_desc: "Our great cause of socialism with Chinese characteristics must of course cover all aspects. After long-term planning in the 1990s, we will complete many feats that belong not only to China but also to all mankind in the new century as scheduled. Our cause is thriving and our future is extremely bright!"
CHI_Baoshan_Iron_and_Steel_Co_Ltd: "Baoshan Iron and Steel Co., Ltd."
CHI_Baoshan_Iron_and_Steel_Co_Ltd_desc: "Baoshan Iron & Steel Co., Ltd. is China's largest and most modernized steel conglomerate, headquartered in Baoshan District, Shanghai. The World Steel Guide ranks Baosteel Co., Ltd. among the top three in terms of comprehensive competitiveness in the world's steel industry, and believes that it is also the steel enterprise with the greatest development potential in the future."
The_17th_National_Congress_of_the_CPC: "The 17th National Congress of the Communist Party of China"
The_17th_National_Congress_of_the_CPC_desc: "The 17th National Congress of the Communist Party of China was held in Beijing from October 15 to 21, 2007. The theme of the Congress was: Hold high the great banner of socialism with Chinese characteristics, take Deng Xiaoping Theory and the important thought of "Three Represents" as guidance, thoroughly implement the Scientific Outlook on Development, continue to emancipate the mind, adhere to reform and opening up, promote scientific development, promote social harmony, and strive for new victories in building a well-off society in an all-round way. Hu Jintao, on behalf of the 16th Central Committee, delivered a report to the Congress entitled.Hold High the Great Banner of Socialism with Chinese Characteristics and Strive for New Victories in Building a Well-off Society in an All-round Way."
CHI_Work_Summary_16: "Work Summary"
CHI_Work_Summary_16_desc: "In his report, General Secretary Hu Jintao reviewed the new achievements made in various undertakings of our country since the 16th CPC National Congress: economic strength has been greatly enhanced, major breakthroughs have been made in reform and opening up, people's lives have been significantly improved, new progress has been made in the construction of democracy and the legal system, a new situation has been opened up in cultural construction, social construction has been carried out in an all-round way, historic achievements have been made in national defense and military construction, work in Hong Kong, Macao and Taiwan has been further strengthened, major progress has been made in all-round diplomacy, and the new great project of Party building has been steadily advanced."
CHI_Deeply_implement_the_Scientific_Outlook_on_Development: "Deeply implement the Scientific Outlook on Development"
CHI_Deeply_implement_the_Scientific_Outlook_on_Development_desc: "The Congress adopted a resolution on the "Amendment to the Constitution of the Communist Party of China" and decided that the amendment would take effect from the date of adoption. The Congress believes that the Scientific Outlook on Development is a continuation and development of the important ideas on development of the three generations of the Party's central leadership, a concentrated embodiment of the Marxist worldview and methodology on development, a scientific theory that is both in line with Marxism-Leninism, Mao Zedong Thought, Deng Xiaoping Theory and the "Three Represents" important thought and keeps pace with the times, an important guiding principle for my country's economic and social development, and a major strategic thought that must be upheld and implemented in developing socialism with Chinese characteristics. The Congress unanimously agreed to write the Scientific Outlook on Development into the Party Constitution."
CHI_continue_Comprehensively_building_a_moderately_prosperous_society: "§YNew requirements for building a moderately prosperous society§!"
CHI_continue_Comprehensively_building_a_moderately_prosperous_society_desc: "In his report, Hu Jintao proposed new requirements for achieving the goal of building a moderately prosperous society in an all-round way: enhancing development coordination and striving to achieve sound and rapid economic development; expanding socialist democracy and better protecting the rights and interests of the people and social fairness and justice; strengthening cultural construction and significantly improving the civilized quality of the entire nation; accelerating the development of social undertakings and comprehensively improving people's lives; building an ecological civilization and basically forming an industrial structure, growth model, and consumption pattern that conserves energy resources and protects the ecological environment."
CHI_Socialist_core_value_system: "Socialist Core Value System"
CHI_Socialist_core_value_system_desc: "In 2007, General Secretary Hu Jintao stressed in his "June 25" important speech that we must vigorously build a socialist core value system and consolidate the common ideological foundation for the unity and struggle of the whole party and the people of the whole country. The socialist core value system includes four basic contents, namely, the guiding ideology of Marxism, the common ideal of socialism with Chinese characteristics, the national spirit with patriotism as the core, the spirit of the times with reform and innovation as the core, and the socialist concept of honor and disgrace."
CHI_The_twelfth_Five_Year_Plan: "The twelfth Five-Year Plan"
CHI_The_twelfth_Five_Year_Plan_desc: "The Fifth Plenary Session of the 17th CPC Central Committee was formally held in October 2010. The Premier of the State Council, on behalf of the Political Bureau of the CPC Central Committee, made an explanation on the proposal for the formulation of the 12th Five-Year Plan for National Economic and Social Development. The Plenary Session reviewed and approved the Proposal of the CPC Central Committee on the Formulation of the 12th Five-Year Plan for National Economic and Social Development, and officially announced it to the public. The Proposal of the CPC Central Committee analyzed the domestic and international situation, and based on China's basic national conditions and development stage, proposed the main economic and social goals, guiding principles, important principles, key strategies and main tasks of the plan, laying the foundation for the formulation of the Outline of the 12th Five-Year Plan."
CHI_The_sixth_National_Population_Census: "The Sixth National Population Census"
CHI_The_sixth_National_Population_Census_desc: "The State Council decided to conduct the sixth national population census in 2010."
CHI_The_Fifth_National_Population_Census: "The Fifth National Population Census"
CHI_The_Fifth_National_Population_Census_desc: "The Chinese government conducted the registration for the fifth national population census on November 1, 2000."
CHI_Reform_of_registered_residence_management_system: "Reform of registered residence management system"
CHI_Reform_of_registered_residence_management_system_desc: "In recent years, all regions and relevant departments have conscientiously implemented the state's decisions and arrangements on promoting urbanization and household registration system reform, worked hard to solve outstanding problems in practice, and achieved remarkable results. In recent times, some places have actively explored and introduced policies and measures for rural population to settle in cities, accumulated some experience, and also some problems that cannot be ignored. Some places have ignored the actual situation of local economic and social development and unilaterally pursued the speed of urbanization of urban scale; some places have relaxed the conditions for settling in cities without distinguishing between urban categories and the comprehensive carrying capacity of cities; some places have arbitrarily broken through national policies and harmed the vital interests of the people. If these problems are not taken seriously and properly resolved in a timely manner, it will seriously affect the healthy and orderly progress of urbanization in accordance with the law, seriously affect the steady and rapid economic development and social harmony and stability, and directly affect the smooth progress of household registration system reform."
CHI_China_ASEAN_Free_Trade_Area: "China-ASEAN Free Trade Area"
CHI_China_ASEAN_Free_Trade_Area_desc: "The China-ASEAN Free Trade Area is the world's most populous free trade area and the largest free trade area composed of developing countries. After experiencing the financial crisis, ASEAN has made it clearer that the region needs to accelerate economic integration in order to establish an effective cooperation mechanism to prevent the recurrence and impact of the crisis. my country is a reliable partner, so choosing to establish a regional economic cooperation mechanism with China, namely the China-ASEAN Free Trade Area, has become an inevitable and positive choice."
CHI_Anti_corruption_measures: "Release a series of anti-corruption measures"
CHI_Anti_corruption_measures_desc: "At the New Year's Tea Party of the National Committee of the Chinese People's Political Consultative Conference on New Year's Day, President Hu Jintao reminded that we must deepen the building of a clean and honest Party and fight corruption, constantly improve the Party's leadership and governance capabilities, and provide reliable political and organizational guarantees for building a moderately prosperous society in an all-round way and upholding and developing socialism with Chinese characteristics. In April, the Central Commission for Discipline Inspection issued the "Implementation Measures for the Several Norms for Party Members and Leading Cadres to Be Honest in Politics", which explained 18 concepts such as "occupying in the name of borrowing", "may affect the impartial performance of official duties", "occupying multiple houses", "doing business or running an enterprise in the name of an individual or in the name of another person", and "paying money in a symbolic manner"."
CHI_Diaoyu_Islands: "Reaffirming sovereignty over the Diaoyu Islands"
CHI_Diaoyu_Islands_desc: "Diaoyu Islands have been an inseparable part of my country since ancient times. In modern times, they have been unreasonably plundered by Japan. After the end of World War II, Japan should have given up all its territories except the four main islands. Now, it shamelessly claims that Diaoyu Islands are their territory. The Prime Minister even went to the island for a show, which seriously provoked my country. Although we uphold the principle of peaceful development, we will never accept such naked humiliation."
CHI_Establishment_of_Sansha_City: "Establishment of Sansha City"
CHI_Establishment_of_Sansha_City_desc: "On June 21, 2012, the Ministry of Civil Affairs published the "Notice of the Ministry of Civil Affairs on the State Council's Approval to Establish Sansha City at the Prefectural Level" on its website. The State Council approved the abolition of the Xisha Islands, Nansha Islands and Zhongsha Islands Offices of Hainan Province and the establishment of Sansha City at the prefectural level to govern the islands and reefs of the Xisha Islands, Zhongsha Islands and Nansha Islands and their surrounding waters. The Sansha Municipal People's Government is located on Yongxing Island in the Xisha Islands. On July 24, the establishment meeting and unveiling ceremony of Sansha City were held. The establishment of Sansha City at the prefectural level is an adjustment and improvement of my country's administrative management system for the islands and reefs of the Xisha Islands, Zhongsha Islands and Nansha Islands in Hainan Province and their surrounding waters. The establishment of Sansha City will help further strengthen my country's administrative management and development and construction of the islands and reefs of the Xisha Islands, Zhongsha Islands and Nansha Islands and their surrounding waters, and protect the marine environment of the South China Sea."
CHI_Golden_Sun_Initiative: "Golden Sun Demonstration Project"
CHI_Golden_Sun_Initiative_desc: "The Golden Sun Demonstration Project is a specific action to promote the technological progress and large-scale development of the photovoltaic power generation industry, cultivate strategic emerging industries, and support the demonstration and application of photovoltaic power generation technology in various fields and the industrialization of key technologies. It is planned to be implemented and completed within 2 to 3 years. In principle, projects included in the Golden Sun Demonstration Project will be subsidized at 50% of the total investment in photovoltaic power generation systems and their supporting power transmission and distribution projects, and independent photovoltaic power generation systems in remote areas without electricity will be subsidized at 70% of the total investment."
CHI_Revitalization_of_cultural_industry: "Revitalization of cultural industry"
CHI_Revitalization_of_cultural_industry_desc: "The development of cultural industry is the only way to develop advanced productive forces and improve the economic industrial structure. The 17th CPC National Congress clearly proposed to actively develop public welfare cultural undertakings, vigorously develop cultural industries, stimulate the cultural creativity of the whole nation, and more consciously and proactively promote the great development and prosperity of culture."
CHI_The_main_functional_area_planning: "The main functional area planning of the country"
CHI_The_main_functional_area_planning_desc: "The national main functional area planning is to plan the future population distribution, economic layout, land use and urbanization pattern according to the resource and environmental carrying capacity, existing development density and development potential of different regions, divide the land space into four categories: optimized development, key development, restricted development and prohibited development, determine the main functional positioning, clarify the development direction, control the development intensity, standardize the development order, improve the development policy, and gradually form a spatial development pattern with coordinated population, economy, resources and environment. On June 8, 2011, the National Main Functional Area Planning was officially released."
CHI_18th_National_Congress_of_CPC: "The 18th National Congress of the Communist Party of China"
CHI_18th_National_Congress_of_CPC_desc: "The 18th National Congress of the Communist Party of China was held in Beijing on November 8, 2012. The report of the 18th National Congress of the Communist Party of China clearly pointed out at the beginning that this congress was a very important congress held at a decisive stage in my country's efforts to build a moderately prosperous society in all respects. This judgment profoundly reveals the great significance of the 18th National Congress of the Communist Party of China. The congress elected a new leadership of the Central Committee of the Communist Party of China, namely Comrade Xi Jinping."
CHI_Xi_Jinping_Agenda: "Xi Jinping's Agenda"
CHI_Xi_Jinping_Agenda_desc: "At the first session of the 12th National People's Congress, Comrade Xi Jinping was undoubtedly elected President of the People's Republic of China and Chairman of the Central Military Commission of the People's Republic of China. At the first plenary session of the 19th Central Committee, he was appointed Chairman of the Central Military Commission of the Communist Party of China. State power has gradually been transferred to the son of this founding father, an ambitious "reformer.""
CHI_FAST: "China Sky Eye"
CHI_FAST_desc: "The 500-meter Aperture Spherical Radio Telescope, also known as China's Sky Eye, is located in Qiannan Buyi and Miao Autonomous Prefecture, Guizhou Province, China. It is a major scientific and technological infrastructure construction project of the "Eleventh Five-Year Plan". Construction began on March 25, 2011 and was completed and put into use on September 25, 2016. The 500-meter Aperture Spherical Radio Telescope has created a new model for building giant telescopes. It has built a radio telescope with a reflecting surface equivalent to 30 football fields. Its sensitivity is more than 2.5 times that of the world's second largest telescope, greatly expanding human vision and exploring the origin and evolution of the universe."
CHI_Beijing_Daxing_International_Airport: "Beijing Daxing International Airport"
CHI_Beijing_Daxing_International_Airport_desc: "Beijing Daxing International Airport is located between Yufa Town and Lixian Town in Daxing District, Beijing, China, and Guangyang District, Langfang City, Hebei Province. It is 46 kilometers north of Tiananmen Square, 67 kilometers north of Beijing Capital International Airport, 55 kilometers south of Xiongan New Area, and about 640 meters west of Beijing Nanjiao Airport. It is a 4F-level international airport, a world-class aviation hub, and a new driving force for national development."
CHI_HKZM_Bridge: "Hong Kong-Zhuhai-Macao Bridge"
CHI_HKZM_Bridge_desc: "The Hong Kong-Zhuhai-Macao Bridge is a bridge-tunnel project in the People's Republic of China that connects Hong Kong, Zhuhai, Guangdong, and Macao. It is located in the Lingdingyang waters of the Pearl River Estuary in Guangdong and is the southern section of the Pearl River Delta Ring Expressway. The Hong Kong-Zhuhai-Macao Bridge starts from the Hong Kong Port artificial island near the Hong Kong International Airport in the east, crosses the Lingdingyang waters of the South China Sea to the west to connect the Zhuhai and Macao artificial islands, and ends at the Zhuhai Hongwan Interchange. The total length of the bridge and tunnel is 55 kilometers, of which the main bridge is 29.6 kilometers and the Hong Kong Port to Zhuhai-Macao Port is 41.6 kilometers. The bridge deck is a two-way six-lane expressway with a design speed of 100 kilometers per hour. The total investment in the project is 126.9 billion yuan. Construction began on December 15, 2009, the main project was fully connected on July 7, 2017, and the main project was completed on February 6, 2018. Acceptance."
CHI_bohai_Bridge: "Bohai Bridge"
CHI_bohai_Bridge_desc: "With the experience gained from the construction of the Hong Kong-Zhuhai-Macao Bridge and the breakthroughs in construction technology, we can try to build a bridge across the Bohai Sea connecting Shandong and Liaoning."
CHI_The_Thirteenth_Five_Year_Plan: "The Thirteenth Five-Year Plan"
CHI_The_Thirteenth_Five_Year_Plan_desc: "On March 16, 2016, the Fourth Session of the 12th National People's Congress adopted the "Proposal of the CPC Central Committee on Formulating the Thirteenth Five-Year Plan for National Economic and Social Development", which designed a grand blueprint for China's economic and social development from 2016 to 2020. The main goals are: the economy maintains medium-to-high-speed growth, and on the basis of improving the balance, inclusiveness and sustainability of development, by 2020, the GDP and per capita income of urban and rural residents will double that of 2010, the industry will move towards medium-to-high-end levels, the contribution of consumption to economic growth will increase significantly, and the urbanization rate of registered population will increase rapidly. Agricultural modernization has made significant progress, the people's living standards and quality have generally improved, the rural poor population has been lifted out of poverty under the current standards of my country, all poor counties have been lifted out of poverty, and regional overall poverty has been solved. The quality of the people and the level of social civilization have improved significantly. The overall quality of the ecological environment has improved. Various systems have become more mature and more established, and major progress has been made in the modernization of the national governance system and governance capacity."
CHI_The_Fourteenth_Five_Year_Plan: "The Fourteenth Five-Year Plan"
CHI_The_Fourteenth_Five_Year_Plan_desc: "On March 11, 2021, the Fourth Session of the 13th National People's Congress adopted the Resolution on the 14th Five-Year Plan for National Economic and Social Development and the Outline of the Long-Range Objectives Through the Year 2035. The main objectives for economic and social development during this period are: new achievements in economic development; new strides in reform and opening up; new improvements in the level of social civilization; new progress in ecological civilization construction; new levels of people's well-being; and new enhancements in national governance effectiveness."
CHI_The_seventh_National_Population_Census: "The Seventh National Population Census"
CHI_The_seventh_National_Population_Census_desc: "The State Council has decided to conduct the seventh national population census in 2020. The standard time point of the census is 0:00 on November 1, 2020, aiming to thoroughly investigate the changes in population births and housing conditions."
CHI_18_Third_Plenum: "The Third Plenary Session of the 18th Central Committee of the Communist Party of China"
CHI_18_Third_Plenum_desc: "The Third Plenary Session of the 18th Central Committee of the Communist Party of China was held in Beijing from November 9 to 12, 2013. Xi Jinping, General Secretary of the CPC Central Committee, presided over the meeting. The main agenda was for the Political Bureau of the CPC Central Committee to report its work to the Central Committee and study major issues of comprehensively deepening reform. On November 12, the meeting reviewed and adopted the "Decision of the CPC Central Committee on Several Major Issues Concerning Comprehensively Deepening Reform" and concluded successfully in Beijing."
CHI_Comprehensively_deepen_ecnomic_reform: "Comprehensively deepen economic reform"
CHI_Comprehensively_deepen_ecnomic_reform_desc: "Our main task is economic construction. Economic system reform is the focus of comprehensive deepening of reform. The core issue is how to properly handle the relationship between the government and the market, so that the market plays a decisive role in resource allocation and the government plays a better role; adhere to and improve the basic economic system, accelerate the improvement of the modern market system, macro-control system, and open economic system, accelerate the transformation of economic development mode, accelerate the construction of an innovative country, and promote more efficient, fairer, and more sustainable economic development; take economic construction as the center, give play to the leading role of economic system reform, promote the adaptation of production relations to productivity and superstructure to economic base, and promote sustained and healthy development of economy and society."
CHI_Leading_Group_for_Comprehensively_Deepening_Reform: "Leading Group for Comprehensively Deepening Reform"
CHI_Leading_Group_for_Comprehensively_Deepening_Reform_desc: "The Party leads everything. The work of comprehensively deepening reform should be entrusted to specialized personnel within the Party. The Central Committee has established a leading group for comprehensively deepening reform, which is responsible for the overall design, overall coordination, overall promotion, and supervision of implementation of the reform. Party committees at all levels must earnestly fulfill their leadership responsibilities for the reform."
CHI_The_Fifth_Modernization: "The Fifth Modernization"
CHI_The_Fifth_Modernization_desc: "At the first session of the Third National People's Congress in December 1964, Premier Zhou Enlai, based on Chairman Mao Zedong's suggestion, first proposed in his government work report that China should be built into a socialist power with modern agriculture, modern industry, modern defense and modern science and technology within the 20th century, and achieve the four modernization goals. Now that we are close to completing these four modernizations, we need to propose the fifth modernization - promoting the modernization of the national governance system and governance capacity."
CHI_Socialist_core_values: "Socialist Core Values"
CHI_Socialist_core_values_desc: "The 18th CPC National Congress proposed to advocate prosperity, democracy, civility and harmony, freedom, equality, justice and the rule of law, patriotism, dedication, integrity and friendliness, and actively cultivate and practice the core socialist values. Prosperity, democracy, civility and harmony are the value goals at the national level, freedom, equality, justice and the rule of law are the value orientations at the social level, and patriotism, dedication, integrity and friendliness are the value criteria at the individual level of citizens. These 24 words are the basic content of the core socialist values."
CHI_Building_ecological_civilization: "Building Ecological Civilization"
CHI_Building_ecological_civilization_desc: "We must deepen the reform of the ecological civilization system around the construction of a beautiful China, accelerate the establishment of an ecological civilization system, improve the system and mechanism for land space development, resource conservation and utilization, and ecological environment protection, and promote the formation of a new pattern of modern construction with harmonious development between man and nature. To build an ecological civilization, we must establish a systematic and complete ecological civilization system and use the system to protect the ecological environment. We must improve the natural resource asset property rights system and use control system, draw ecological protection red lines, implement a resource use compensation system and an ecological compensation system, and reform the ecological environment protection management system."
CHI_The_Four_Pronged_Comprehensive_Strategy: "The Four Pronged Comprehensive Strategy"
CHI_The_Four_Pronged_Comprehensive_Strategy_desc: "The Four Pronged Comprehensive Strategy, namely, comprehensively building a modern socialist country, comprehensively deepening reform, comprehensively governing the country according to law, and comprehensively and strictly governing the Party."
CHI_Comprehensively_building_the_socialist_modernized_country: "Comprehensively building the socialist modernized country"
CHI_Comprehensively_building_the_socialist_modernized_country_desc: "In 1894, Dr. Sun Yat-sen, the great pioneer of China's democratic revolution, first proposed to "rejuvenate China" when he founded the revolutionary group Xingzhonghui; in 1940, Comrade Mao Zedong pointed out in "On New Democracy" that all the goals of our Communists are to build a new society and a new country for the Chinese nation. Under the leadership of the great Communist Party of China, all of our people will surely build a modernized motherland that is stronger, better and closer to communism!"
CHI_Shanghai_Pilot_Free_Trade_Zone: "Shanghai Pilot Free Trade Zone"
CHI_Shanghai_Pilot_Free_Trade_Zone_desc: "Shanghai is the most economically developed city in my country. Comprehensively deepening reform and opening up is best started here. At the end of March 2013, Premier Li Keqiang visited the Waigaoqiao Free Trade Zone in Pudong during his research in Shanghai. He expressed his encouragement and support for Shanghai to actively explore how to establish a free trade zone pilot area within 28 square kilometers on the basis of the existing comprehensive bonded area. On July 3 of the same year, Li Keqiang presided over the State Council executive meeting. The meeting approved in principle the Overall Plan for the China (Shanghai) Pilot Free Trade Zone."
CHI_China_Pilot_Free_Trade_Zone: "China Pilot Free Trade Zone"
CHI_China_Pilot_Free_Trade_Zone_desc: "Our pilot free trade zone in Shanghai has achieved great success and should be gradually promoted and implemented throughout the country. The State Council officially approved the establishment of China's free trade zone on August 22, 2013."
CHI_Dismiss_inefficient_SOE: "Dismiss inefficient state-owned enterprises"
CHI_Dismiss_inefficient_SOE_desc: "State-owned enterprises should be the cornerstone of the public economy, the mainstay of the national economy, and the guarantor of people's well-being. However, due to various problems in management and operation, many state-owned enterprises have emerged with poor operating conditions or even long-term negative profits. These inefficient state-owned enterprises have become a burden on the government's finances, swallowing up the hard-earned taxes of countless taxpayers every year. We must deepen market-oriented reforms and let those inefficient state-owned enterprises that cannot compete with private enterprises go bankrupt and be eliminated."
CHI_Clarify_market_entities: "Clarify market entities"
CHI_Clarify_market_entities_desc: "A market economy is a highly socialized and market-oriented commodity economy, in which the market plays a decisive role in resource allocation. The key to establishing a socialist market economic system and maintaining sustained, stable and healthy development of the national economy lies in reshaping the subject of the socialist market economy. What is the most fundamental subject of the market economy? That is the enterprise. Under the conditions of a market economy, enterprises are the most basic and important subjects of market activities and the micro-foundation for the operation of the market mechanism. Enterprises in a market economy must follow the rules of the market economy, operate independently, bear their own profits and losses, directly engage in production, circulation and service activities, pursue maximum profits, and pay taxes in accordance with the law."
CHI_Entrepreneur_spirit: "Entrepreneurial Spirit"
CHI_Entrepreneur_spirit_desc: "Market entities are the carriers of economic power. To protect market entities is to protect social productivity. In the long-term economic work since the reform and opening up, a group of outstanding entrepreneurs who dare to fight, struggle, be honest and law-abiding have emerged in my country. Under the leadership of the Party and the hard work of the working people, they have successfully led the rapid growth of my country's economy. This spirit of patriotism, innovation, integrity, social responsibility and international vision is the entrepreneurial spirit of China in the new era. Entrepreneurial spirit has become one of the spiritual spectrum of the Chinese Communists and is the embodiment of the spirit of the times of the Communists in the new era."
CHI_BTH_Coordinated_Development: "Beijing-Tianjin-Hebei Coordinated Development"
CHI_BTH_Coordinated_Development_desc: "The core of the coordinated development of Beijing, Tianjin and Hebei is the coordinated development of the three regions as a whole. It is necessary to take the decentralization of non-capital core functions and the solution of Beijing's "big city disease" as the basic starting point, adjust and optimize the urban layout and spatial structure, build a modern transportation network system, expand the environmental capacity and ecological space, promote industrial upgrading and transfer, promote the co-construction and sharing of public services, accelerate the process of market integration, build a modern new capital circle, and strive to form a new pattern of coordinated development in Beijing, Tianjin and Hebei with the same goals, integrated measures, complementary advantages, and mutual benefit and win-win results."
CHI_Yangtze_River_Economic_belt_downstream: "Yangtze River Economic belt downstream"
CHI_Yangtze_River_Economic_belt_downstream_desc: "The Yangtze River Economic Belt covers 11 provinces and cities, including Shanghai, Jiangsu, Zhejiang, Anhui, Jiangxi, Hubei, Hunan, Chongqing, Sichuan, Yunnan, and Guizhou, with an area of about 2.0523 million square kilometers, accounting for 21.4% of the country, and its population and GDP both exceed 40% of the country. Promoting the development of the Yangtze River Economic Belt is a major decision made by the Party Central Committee with Comrade Xi Jinping as the core. It is a major strategy related to the overall development of the country and is of great significance to achieving the "Two Centenary Goals" and realizing the Chinese Dream of the great rejuvenation of the Chinese nation. The lower reaches of the Yangtze River are the Yangtze River Delta region, which is the most economically developed metropolitan area in my country. We should increase investment and construction in this region,"
CHI_Yangtze_River_Economic_belt_middle_reaches: "Middle reaches of the Yangtze River Economic Belt"
CHI_Yangtze_River_Economic_belt_middle_reaches_desc: "The middle reaches of the Yangtze River encompass the provinces of Hubei, Jiangxi, and Hunan, including the three major cities of Wuhan, Changsha, and Nanchang. This region has a vast economic hinterland and labor force, and investment here will play an important role in promoting economic development."
CHI_Yangtze_River_Economic_belt_upstream: "Yangtze River Economic belt upstream"
CHI_Yangtze_River_Economic_belt_upstream_desc: "The upper reaches of the Yangtze River include Chongqing, Guizhou, Sichuan, and Yunnan. With Chongqing and Chengdu as the center, we will build a high-speed economic development zone in the southwest, which will play a strong leading role in my country's economic development."
CHI_GBA: "Guangdong-Hong Kong-Macao Greater Bay Area"
CHI_GBA_desc: "The Guangdong-Hong Kong-Macao Greater Bay Area includes the Hong Kong Special Administrative Region, the Macao Special Administrative Region and the cities of Guangzhou, Shenzhen, Zhuhai, Foshan, Huizhou, Dongguan, Zhongshan, Jiangmen and Zhaoqing in Guangdong Province. The Guangdong-Hong Kong-Macao Greater Bay Area has superior geographical conditions, "surrounded by mountains on three sides and converging with three rivers", with a long coastline, a good port group and a vast sea area. The economic hinterland is vast, and the Pan-Pearl River Delta region has about 1/5 of the country's land area, 1/3 of the population and 1/3 of the total economic output. As of December 2022, the permanent population of the Guangdong-Hong Kong-Macao Greater Bay Area reached 86.4397 million. Promoting the construction of the Guangdong-Hong Kong-Macao Greater Bay Area is a major decision made by the Party Central Committee with Comrade Xi Jinping as the core. It is a national strategy personally planned, deployed and promoted by General Secretary Xi Jinping, and it is also a new practice to promote the development of the "one country, two systems" cause."
CHI_Xiong_an_New_Area: "Xiong'an New Area"
CHI_Xiong_an_New_Area_desc: "The Xiongan New Area is a national-level new area under the jurisdiction of Hebei Province. On April 1, 2017, the CPC Central Committee and the State Council issued a notice to establish the Xiongan New Area, Hebei Province, a national-level new area. The establishment of the Xiongan New Area is a major historical strategic choice made by the CPC Central Committee with Comrade Xi Jinping as the core. It is another new area of national significance after the Shenzhen Special Economic Zone and the Shanghai Pudong New Area. It is a millennium plan and a national event. This investment is unlikely to bring obvious returns in a short period of time, but it has a very far-sighted impact on building a city of science and technology, harmony, and the future."
CHI_Lucid_waters_and_lush_mountains_are_invaluable_assets: "The natural environment is wealth"
CHI_Lucid_waters_and_lush_mountains_are_invaluable_assets_desc: "Does our socialism mean building a dark, filthy, and muddy country? Of course not. What we want to build is a green, harmonious, and beautiful socialist motherland. On August 15, 2005, Xi Jinping, then Secretary of the Zhejiang Provincial Party Committee, first proposed the scientific conclusion that "Lucid waters and lush mountains are invaluable assets" during his inspection in Anji, Huzhou, Zhejiang. Later, he further elaborated on the three stages of development between Lucid waters and lush mountains and invaluable assets, forming a systematic ecological civilization construction."
CHI_Energy_conservation_and_emission_reduction: "Energy conservation and emission reduction"
CHI_Energy_conservation_and_emission_reduction_desc: "my country has long adopted a development model that subsidizes high energy consumption, which not only leads to great energy waste and inefficient production, but also is inconsistent with my country's development strategy of green ecological construction. Eliminating high-energy-consuming industries and using more environmentally friendly energy will help alleviate my country's increasingly severe ecological and environmental pressures."
CHI_Innovation_leads_development: "Innovation leads development"
CHI_Innovation_leads_development_desc: "Comrade Deng Xiaoping once said that "science and technology are the primary productive forces". If my country wants to get rid of the current industrial structure in which low value-added industries account for too large a proportion, it must lead production and development with scientific and technological innovation. The "Proposal of the CPC Central Committee on Formulating the 13th Five-Year Plan for National Economic and Social Development" adopted at the Fifth Plenary Session of the 18th CPC Central Committee proposed that "innovation is the primary driving force for development". This important assertion is a creative development of the important idea that "science and technology are the primary productive forces" and an important development concept that must be adhered to in the new era and new stage. To achieve the grand goals of the "Two Centenary Goals", it is necessary to place innovation at the core of the overall national development, let innovation permeate all the work of the Party and the state, and let innovation become a trend in the whole society."
CHI_The_Quality_Engineering: "Quality Engineering"
CHI_The_Quality_Engineering_desc: "For a long time, products made in my country have been sold well all over the world, and the reputation of "Made in China" has been renowned all over the world. However, with this, various problematic products with difficult quality assurance have flooded the market, and the market has been mixed with good and bad products, giving "Made in China" the stigma of "shoddy workmanship". To achieve industrial modernization and transform from a manufacturing power to a manufacturing power, we must start with quality, abandon the previous development model of one-sided pursuit of speed, and manufacture every product carefully."
CHI_The_Robot_Revolution: "The Robot Revolution"
CHI_The_Robot_Revolution_desc: "What is efficient manufacturing? Is it crowded workshops and sweaty workers? Of course not, it should be fully automated assembly lines and high-tech mechanical manufacturing machines! The purpose of socialist development is to liberate productivity to the greatest extent and replace low-level labor with machinery. The humming workshop is the modern economic locomotive!"
CHI_Made_in_China_2025: "Made in China 2025"
CHI_Made_in_China_2025_desc: "Manufacturing is the main body of the national economy, the foundation of a country, the tool for its prosperity and the basis for its strength. Made in China 2025 is a strategic document signed and approved by Premier Li Keqiang and issued by the State Council in May 2015 to deploy the comprehensive promotion of the implementation of a manufacturing power. It is China's action program for the first ten years of implementing the manufacturing power strategy. There are four elements: First, the transformation from factor-driven to innovation-driven. Second, the transformation from low-cost competitive advantage to quality and efficiency competitive advantage. Third, the transformation from extensive manufacturing with high resource consumption and high pollutant emissions to green manufacturing. Fourth, the transformation from production-oriented manufacturing to service-oriented manufacturing."
CHI_Comprehensively_deepen_reform: "Comprehensively deepen reform and rule of law"
CHI_Comprehensively_deepen_reform_desc: "There are different ways to govern a country. It is not necessary to follow the old ways to benefit a country. The old ways cannot be followed, and the tools cannot be used. Therefore, the laws and regulations of the ancient kings have changed. What was honored in the past is now humiliated. What was well governed in the past is now in chaos. Shennong and Fuxi did not use rewards or punishments, but the people did not do wrong. However, the rulers could not abolish the laws to govern the people. Shun used the Ganqi and conquered the Miao people, but the conquerors could not put down their armor and control the violence. From this point of view, laws and regulations are used to discuss the customs of the people and regulate the urgency; tools are used to adapt to the changes of the times."
CHI_Simplify_government: "Release, Manage, and Serve"
CHI_Simplify_government_desc: "Fangguansifu is the abbreviation of streamlining administration, delegating power, combining delegation and supervision, and optimizing services. "Fang" means streamlining administration and delegating power, lowering the entry threshold. "Guan" means innovating supervision and promoting fair competition. "Fu" means providing efficient services and creating a convenient environment. This is a major measure to deepen administrative system reform and promote the transformation of government functions after the 18th National Congress of the Communist Party of China, which will help cut redundant officials and get rid of old malpractices."
CHI_Law_of_the_China_on_State_Security: "Law of the China on State Security"
CHI_Law_of_the_China_on_State_Security_desc: "On July 1, 2015, the 15th Session of the Standing Committee of the 12th National People's Congress passed the new National Security Law. President Xi Jinping signed Presidential Order No. 29 to promulgate it. The law defines national security tasks in 11 areas, including political security, national security, military security, cultural security, and scientific and technological security. It has 7 chapters and 84 articles and will come into effect on July 1, 2015."
CHI_The_Paris_Agreeme: "Signing of the Paris Agreement"
CHI_The_Paris_Agreeme_desc: "The Paris Agreement is a climate change agreement signed by 178 parties around the world. It is a unified arrangement for global action to address climate change after 2020. On April 22, 2016, Zhang Gaoli, then Vice Premier of the State Council of China, signed the Paris Agreement as a special envoy of President Xi Jinping. On September 3 of the same year, the Standing Committee of the National People's Congress approved China's accession to the Paris Climate Change Agreement, making China one of the parties to complete the ratification of the agreement."
CHI_Strengthening_the_construction_of_socialist_consultative_democracy: "Strengthening the construction of socialist consultative democracy"
CHI_Strengthening_the_construction_of_socialist_consultative_democracy_desc: "Harmony creates life, while uniformity cannot continue. It is the multiplicity of ideas that counts, and the individuality of decision making that counts. With many ideas, one can see the ultimate benefits and harms; with the individuality of decision making, one can determine the right and wrong of the world. If one knows how to plan but not how to make decisions, then everyone in the group will want to pursue their own selfish ambitions, and this will lead to a declining and chaotic government. All things grow together without harming each other, and all principles run parallel without contradicting each other. Hold the middle ground between the two, respect the virtuous and accommodate the many, uphold justice without seeking benefits, and clarify principles without counting achievements. Read widely and listen to all, reach the maximum knowledge of the group, and see all the beauty in the world. The highest virtue will be manifested and applied to the outside world."
CHI_Strengthening_the_Party_leadership_over_all: "Strengthening the Party's overall leadership"
CHI_Strengthening_the_Party_leadership_over_all_desc: "China's greatest national condition is the leadership of the Communist Party of China. The leadership of the Communist Party of China is the most essential feature of socialism with Chinese characteristics. The Communist Party of China is the core of leadership of the cause of socialism with Chinese characteristics, so we must strengthen and improve the party's leadership and give full play to the party's overall leadership role in coordinating all parties. The party is the core of leadership in all our undertakings. The ancients said that "the six directions have the same wind and the nine states are connected." In contemporary China, this is impossible without the leadership of the party. The party leads everything, including the party, government, military, people, and education, from east to west, north to south, and from center to center."
CHI_Establish_a_unified_basic_pension_insurance_system_for_urban_and_rural_residents: "Establish a unified basic pension insurance system"
CHI_Establish_a_unified_basic_pension_insurance_system_for_urban_and_rural_residents_desc: "The great journey of socialism with Chinese characteristics will not abandon any of the people, nor will it allow unfair phenomena that are tolerated for the sake of ease of management to continue to exist. The unified pension insurance system for urban and rural residents was implemented in December 2014. Its content is that the residents' pension insurance will no longer be divided into urban and rural areas. The original new rural social pension insurance and urban residents' social pension insurance will be merged and implemented to establish a unified basic pension insurance system for urban and rural residents."
CHI_Combating_separatism: "Combating separatism"
CHI_Combating_separatism_desc: "Though after decades of unremitting efforts, we have finally eradicated separatists from public society, there are still many shady rats in some invisible corners plotting separatist dreams. The great rejuvenation of the Chinese nation must not be hindered by any force. We must immediately and thoroughly tear to pieces those termites that endanger the motherland and the people."
CHI_Double_First_Class_Initiative: "World-Class Universities and First-Class Disciplines"
CHI_Double_First_Class_Initiative_desc: "World-class universities and first-class disciplines, referred to as "Double First-Class", is a major strategic decision made by the CPC Central Committee and the State Council. It is also another national strategy in China's higher education field after the "211 Project" and the "985 Project". It aims to promote a number of high-level universities and disciplines to enter the world's first-class or forefront, accelerate the modernization of higher education governance systems and governance capabilities, and improve the level of talent training, scientific research, social services, and cultural inheritance and innovation in higher education institutions, so that they can become an important force for knowledge discovery and technological innovation, an important source of advanced ideas and excellent culture, and an important base for cultivating various types of high-quality talents. It plays a major role in supporting the national innovation-driven development strategy, serving economic and social development, promoting China's excellent traditional culture, cultivating and practicing the core socialist values, and promoting the connotation development of higher education."
CHI_2Child_Policy: "Promoting fertility policy"
CHI_2Child_Policy_desc: "Our country still has an abundant labor force, but the population structure is rapidly changing towards aging. The original policy has been revised many times over the past decade. Now is the time to make a change."
CHI_Service_oriented_government: "Service-oriented government"
CHI_Service_oriented_government_desc: "People's hearts are fickle, and they only care about benefits. The Book of Documents says: Heaven sees as the people see, and Heaven hears as the people hear. The people are the foundation of the state, and the state is stable when the foundation is solid. The rise of a government lies in following the will of the people, and the fall of a government lies in going against the will of the people. How can a ruler oppress the people? The state is the master. How can a ruler and his subjects be just an excuse? Therefore, if a ruler dies for the state, he should die; if he perishes for the state, he should perish. If he dies for himself and perishes for himself, who would dare to appoint him unless he is able to be close to his own people? A superior treats his subordinates as if they were his own children; a subordinate treats his superiors as if they were his parents. If the people are satisfied, how can a ruler be dissatisfied? If the people are dissatisfied, how can a ruler be satisfied?"
CHI_The_China_Dream: "The Chinese Dream"
CHI_The_China_Dream_desc: "The Chinese Dream is an important guiding ideology and important governing philosophy proposed by General Secretary Xi Jinping since the 18th National Congress of the Communist Party of China. It was formally proposed on November 29, 2012. General Secretary Xi defined the "Chinese Dream" as "realizing the great rejuvenation of the Chinese nation, which is the greatest dream of the Chinese nation since modern times" and said that this dream "will definitely come true." The core goal of the "Chinese Dream" can also be summarized as the "two centenary" goals, that is: by the 100th anniversary of the founding of the Communist Party of China in 2021 and the 100th anniversary of the founding of the People's Republic of China in 2049, gradually and finally successfully realize the great rejuvenation of the Chinese nation."
CHI_Road_confidence: "Road Confidence"
CHI_Road_confidence_desc: "Our road is so broad, our future is so bright, we devote ourselves to this magnificent cause, and we will have infinite happiness and supreme glory!"
CHI_Theory_confidence: "Theoretical confidence"
CHI_Theory_confidence_desc: "Is there any theory in the world that can guide us to transform the world more accurately than Marxism? We can get to where we are today because we adhere to the theory of Marxism and the theory of socialism with Chinese characteristics. We have an invincible theoretical weapon to guide us to better transform and conquer this vast world!"
CHI_System_confidence: "System confidence"
CHI_System_confidence_desc: "Theory guides practice. Good theory can only play a role if it is matched with a good system. Otherwise, it is just empty talk. We have established a complete socialist system with Chinese characteristics. This superior political and economic system is conducive to our great strides towards national rejuvenation!"
CHI_Culture_confidence: "Cultural confidence"
CHI_Culture_confidence_desc: "Cultural confidence is the full affirmation and active practice of a nation, a country, and a political party on its own cultural values, and the firm confidence in the vitality of its culture. General Secretary Xi Jinping pointed out: "We must uphold confidence in our path, theory, and system, and most fundamentally, confidence in our culture." What is cultural confidence? Cultural confidence is the full affirmation and active practice of a nation, a country, and a political party on its own cultural values, and the firm confidence in the vitality of its culture. Our country has the oldest historical and cultural heritage in the world. We will uphold the wisdom of our ancestors for thousands of years and move towards the great rejuvenation of the Chinese nation!"
CHI_Socialism_with_Chinese_Characteristics_in_the_New_Era: "Socialism with Chinese Characteristics in the New Era"
CHI_Socialism_with_Chinese_Characteristics_in_the_New_Era_desc: "The new era of socialism with Chinese characteristics is a new historical orientation for China's development. The 18th National Congress of the Communist Party of China, held in Beijing in November 2012, was a very important congress held at the decisive stage of my country's building of a moderately prosperous society in all respects. Since the 18th National Congress of the Communist Party of China, socialism with Chinese characteristics has entered a new era. On October 18, 2017, General Secretary Xi Jinping made a major judgment in the report of the 19th National Congress of the Communist Party of China: "After long-term efforts, socialism with Chinese characteristics has entered a new era, which is a new historical orientation for my country's development." This new era is an era of inheriting the past, carrying forward the past, and continuing to win the great victory of socialism with Chinese characteristics under new historical conditions. The report is based on the new practices and new achievements since the 18th National Congress of the Communist Party of China, and plans the goals for the middle of this century."
CHI_Comprehensively_and_strictly_governing_the_Party: "Comprehensively and strictly governing the Party"
CHI_Comprehensively_and_strictly_governing_the_Party_desc: "The Communist Party of China has more than 89 million members and more than 4.5 million party organizations. It is the largest party organization in my country and has penetrated into all sectors, levels and fields of society. On October 8, 2014, General Secretary Xi Jinping first mentioned "comprehensively advancing strict governance of the Party" in his speech at the summary meeting of the Party's mass line education and practice activities. In December 2014, General Secretary Xi Jinping emphasized during his research in Jiangsu: "Coordinated efforts to build a moderately prosperous society in all respects, comprehensively deepen reform, comprehensively advance the rule of law, and comprehensively strictly govern the Party, so as to push reform and opening up and socialist modernization to a new level", making comprehensive and strict governance of the Party an important part of the "four comprehensives" strategic layout and elevating it to a new strategic height. The Sixth Plenary Session of the 18th CPC Central Committee specifically studied major issues of comprehensive and strict governance of the Party, fully demonstrating the Party Central Committee's determination and confidence to unswervingly advance comprehensive and strict governance of the Party."
CHI_combat_corruption_and_build_a_clean_government: "Fight corruption and build a clean government"
CHI_combat_corruption_and_build_a_clean_government_desc: "An honest person is a model for the people, while a greedy person is a scourge to the people. The downfall of a country is caused by corrupt officials; the immorality of officials is caused by their advocacy of bribery. Once upon a time, someone gave fish to Prime Minister Zheng, but he refused to accept it. Someone asked him, "You like fish, why don't you accept it?" He replied, "I like fish, so I don't accept it. If I accept fish, I will lose my salary and have nothing to eat; if I don't accept it, I will have to eat fish all my life.""
CHI_Defeat_the_tiger: "Defeat the tiger"
CHI_Defeat_the_tiger_desc: "The elite, led by the "Princelings" and the "Shanghai Gang", have retained many senior positions within the Party. They have colluded with each other in secret, and corruption is rampant, with many people involved in obvious corruption. This provides a perfect excuse to bring down these "big tigers" and weaken the power and influence of the Shanghai Gang. To maintain a clean government, it is necessary to strike at these high-ranking officials."
CHI_flap_a_fly: "Flap a fly"
CHI_flap_a_fly_desc: "It is these dishonest servants and compradors who provide the big tigers with a steady stream of money. Perhaps some of them are forced into corruption and bribery by the corrupt environment, but they have crossed the line after all. Breaking up these small characters will benefit everyone - except themselves."
CHI_combat_organized_crimes_and_root_out_local_battles_against_gangcrimes: "Crack down on organized crime and root out local crime"
CHI_combat_organized_crimes_and_root_out_local_battles_against_gangcrimes_desc: "How can it be possible that Communist Party cadres collude with the mafia? Although President Hu Jintao has vigorously cracked down on the mafia, there are still many bad guys who have gone into the dark under the cover of "protection umbrellas" or transformed themselves into "good guys" and "bosses". It is time to completely eliminate these dregs of society. We are not an oligarchic comprador country!"
CHI_Strengthen_Party_member_education: "Strengthen Party member education"
CHI_Strengthen_Party_member_education_desc: "The Communist Party of China has nearly 100 million members, and a large number of people are joining the party every year. It is impossible to strictly control everyone's ideology. We can only strengthen the education of party members, especially the education of new members. Fortunately, many good comrades in the party recognize this behavior and actively participate in it."
CHI_Self_revolution: "Self-revolution"
CHI_Self_revolution_desc: "The long-term nature of social revolution determines the long-term nature of the Communist Party's leadership and governance. Whether the Communist Party can govern for a long time depends on whether the Party can maintain its advanced nature and purity. To maintain its advanced nature and purity, the Party must persist in self-revolution. For a long time, the term "self-revolution" was not common in the Party's documents, but expressions similar to self-revolution were often seen. Since the 18th CPC National Congress, the term "self-revolution" has frequently appeared in the Party's documents. According to preliminary statistics, "self-revolution" has become a high-frequency word in General Secretary Xi Jinping's public speeches, and self-revolution and social revolution are collectively referred to as the "two great revolutions" of the new era."
CHI_The_State_Committee_of_Supervisory_of_China: "The State Committee of Supervisory of the PRC"
CHI_The_State_Committee_of_Supervisory_of_China_desc: "The National Supervisory Commission of the People's Republic of China is the highest supervisory body. It leads the work of local supervisory committees at all levels. It is elected by the National People's Congress and is responsible for national supervisory work. It is accountable to the National People's Congress and its Standing Committee and is subject to supervision. The Supervisory Commission is an anti-corruption agency. An important purpose of deepening the reform of the national supervisory system is to strengthen the Party's unified leadership over anti-corruption work."
CHI_Mass_supervision: "Mass Supervision"
CHI_Mass_supervision_desc: "The people are the ones who see what the heaven sees, and the people are the ones who hear what the heaven hears. The fundamental work of our party and country is to serve the people. Whether we do a good job or not, of course, it is the people who have the final say."
CHI_Purity_Progressiveness_Contemporaneity_PRC: "Pure & Advanced & Modern"
CHI_Purity_Progressiveness_Contemporaneity_PRC_desc: "After a series of drastic reforms and rectifications, our party has become pure, progressive and contemporary, and has the ability and mission to lead the Chinese nation towards rejuvenation."
CHI_Investment_in_aircraft_carriers: "Investment in aircraft carrier construction"
CHI_Investment_in_aircraft_carriers_desc: "Aircraft carriers are the trump card and backbone of the modern navy. Building a strong aircraft carrier fleet is an essential part of a strong military strategy."
CHI_Comprehensively_building_a_moderately_prosperous_society_complete: "§YComprehensively building a moderately prosperous society§!"
CHI_Comprehensively_building_a_moderately_prosperous_society_complete_desc: "§YLong live the People's Republic of China! Long live the people!§!\n\nAfter decades of unremitting efforts, we have finally lifted every Chinese person out of absolute poverty, and we have finally built a moderately prosperous society in all respects!\nThis is a glorious chapter in Chinese history, an immortal achievement of the Party and the people, and the most brilliant pearl in world history and human rights history!"
CHI_HKG_national_security_law: "Maintaining National Security"
CHI_HKG_national_security_law_desc: "In order to maintain the long-term stability of Hong Kong society and the One Country, Two Systems system, my country must introduce a security protection law applicable to Hong Kong. The Law of the People's Republic of China on Safeguarding National Security in the Hong Kong Special Administrative Region stipulates in detail that the Central People's Government bears the fundamental responsibility for national security affairs related to the Hong Kong Special Administrative Region, has the right to station troops in Hong Kong to safeguard national security, prevent, stop and punish crimes related to the Hong Kong Special Administrative Region such as splitting the country, subverting the state power, organizing and carrying out terrorist activities and colluding with foreign or external forces to endanger national security, maintain the prosperity and stability of the Hong Kong Special Administrative Region, and protect the legitimate rights and interests of the residents of the Hong Kong Special Administrative Region."
CHI_Utilizing_the_Triad: "Utilizing the Triad"
CHI_Utilizing_the_Triad_desc: "The Triads are Hong Kong's underground mafia organizations that have great influence in Hong Kong. Although they have historically been at odds with our Party, due to their business ties with the mainland, the Triads have also begun to support mainland Chinese interests in Hong Kong. We can deepen our influence in Hong Kong by working with the Triads."
CHI_international_financial_center: "Asian International Financial Center?"
CHI_international_financial_center_desc: "Hong Kong is a highly prosperous free port and international metropolis. It is known as the "New York-London-Hong Kong" together with New York and London. It is the world's third largest financial center, an important international trade, shipping center and international innovation and technology center. It was ranked third among the world's first-tier cities by GaWC. After Hong Kong's return to the motherland, although it still maintains a fairly strong economic strength, it is undeniable that Hong Kong's economic growth has slowed down. We should increase economic support for Hong Kong, which will have a considerable role in promoting Hong Kong's long-term prosperity and stability - if they really don't understand, we might as well create a new financial center."
CHI_Optimizing_the_business_environment: "Optimizing the business environment"
CHI_Optimizing_the_business_environment_desc: "Optimizing the business environment is necessary for the healthy development of the market economy and is also an inevitable trend for my country to deepen institutional reform. Since the 18th CPC National Congress, General Secretary Xi Jinping has attached great importance to optimizing the business environment and issued a series of important instructions, emphasizing that "there is no best business environment, only better". Premier Li Qiang presided over the State Council executive meeting and stressed that "it is necessary to place the creation of a market-oriented, law-based and internationalized business environment in an important position, further stabilize social expectations, boost confidence in development, stimulate market vitality, and promote sustained improvement in economic operation.""
CHI_new_energy: "§GNew Energy§!"
CHI_new_energy_desc: "Human development is endless, but the environmental carrying capacity is limited. my country must quickly explore a greener and more environmentally friendly energy development model."
CHI_renewable_energy: "§GRenewable Energy§!"
CHI_renewable_energy_desc: "After more than a decade of technological development, my country has acquired fairly mature renewable energy technology and production capabilities. With our publicity, our people have long been looking forward to new energy, and the development of new energy is imperative."
CHI_solar_energy_experiment: "§YSolar Energy Experiment§!"
CHI_solar_energy_experiment_desc: "Although our solar energy technology has long been mature, there are still risks in using this unstable energy on a large scale. We can first conduct experiments on solar-driven energy in some areas. There are a large number of uninhabited solar-rich areas in some areas of North China and the west of my country, so we can start from there."
CHI_wind_power: "§CWind Power Experiment§!"
CHI_wind_power_desc: "Our country has a vast territory, and the wind god has always been wandering over the land of our motherland. Today, the gentle breeze can also be transformed into our energy. Our country should first conduct wind power generation experiments in some wind-rich areas."
CHI_Green_China: "§GGreen China§!"
CHI_Green_China_desc: "In the past, my country's ecological environment was in crisis under the extensive development model, and was widely criticized by people at home and abroad. Now, under the correct leadership of the Party and the country, we have successfully explored a greener, more environmentally friendly and brighter green development path. Future generations will live in a green China and enter a new era of the great rejuvenation of the Chinese nation in a brighter future!"
CHI_solar_hundred_percent: "§YSolar Hundred Percent§!"
CHI_solar_hundred_percent_desc: "There are vast uninhabited solar-rich areas on the borders of our country. Equip them with photovoltaic panels and we're going to speed up!"
CHI_The_Grace_of_Mazu: "§CThe Grace of Mazu§!"
CHI_The_Grace_of_Mazu_desc: "Mazu is a sea goddess worshipped by coastal people. She evolved from the image of an ancient girl and represents everything about the ocean in my country. The ocean has not only waves and fishing boats, but also the sea breeze that swirls all year round. Building offshore wind farms can bring us endless clean energy. For thousands of years, Mazu has blessed every fisherman who goes out to sea, and now her gentle hands will also shade the people on the mainland."
CHI_Nuclear_Boom: "§YNuclear Boom§!"
CHI_Nuclear_Boom_desc: "Despite strong public opposition to building new nuclear reactors, nuclear energy remains one of the most viable renewable energy alternatives to fossil fuels. However, nuclear energy is extremely expensive to produce due to the complex system of supporting infrastructure required."
CHI_Construct_Nuclear_Waste_Repository: "§YConstruct Nuclear Waste Repository§!"
CHI_Construct_Nuclear_Waste_Repository_desc: "The handling of high-level radioactive waste, such as spent nuclear fuel, remains a major consideration for our nuclear energy program. High-level radioactive waste must be handled with extreme care and stored in a geological repository for decades to decay. We have identified the Beishan region of the Gobi Desert as a suitable location to begin construction of such a repository."
CHI_Construction_of_nuclear_power_plants: "§YConstruction of Nuclear Power Plants§!"
CHI_Construction_of_nuclear_power_plants_desc: "Our nuclear power technology has long been mature, but it has always been used with caution. We cannot abandon our progress just because of the so-called extremely small possibility. Now is the time to build nuclear power plants on a large scale."
CHI_invest_fusion_reactor: "§YInvest in fusion energy§!"
CHI_invest_fusion_reactor_desc: "Nuclear fusion power generation is a method of generating electricity by using the heat generated by nuclear fusion reactions. Humans have been able to achieve uncontrolled nuclear fusion, that is, the explosion of a hydrogen bomb. Currently, scientists around the world are working hard to study controlled nuclear fusion, which may become a source of energy in the future. It can be said that whoever first develops controlled nuclear fusion technology will have the right to speak in the new era of energy, and oil will become dust in the old world."
CHI_Construct_Stellarator_Reactor: "§CConstruct Stellarator Reactor§!"
CHI_Construct_Stellarator_Reactor_desc: "A stellarator is a plasma device that relies primarily on external magnets to confine plasma. Scientists studying magnetic confinement fusion aim to use stellarator devices as containers for nuclear fusion reactions. The twisted structure of a stellarator can help it better control the plasma and has less operational risks. Unlike a tokamak reactor, it is prone to sudden interruptions in internal current, causing the fusion reaction to stop immediately."
CHI_Construct_Tokamak_Reactor: "§CConstruct Tokamak Reactor§!"
CHI_Construct_Tokamak_Reactor_desc: "A tokamak is a device that uses a strong magnetic field to confine plasma in a torus shape. Tokamak is one of several magnetic confinement devices under development for producing controlled thermonuclear fusion energy. The tokamak device is currently considered by the academic community to be the mainstream way to achieve controlled nuclear fusion, mainly using hydrogen isotopes deuterium-tritium as fusion fuel."
CHI_Final_Energy_Solution: "§Y Final Energy Solution§!"
CHI_Final_Energy_Solution_desc: "The power generation potential of nuclear fusion is limitless, sufficient to support the massive expansion of our industrial scale, and is undoubtedly the final energy solution."
CHI_Coal: "§RCoal drives development§!"
CHI_Coal_desc: "China has extremely rich coal reserves, with coal resources scattered throughout our country. China is the world's largest producer and consumer of coal, and our economy remains dependent on it. Although burning coal causes considerable environmental pollution, we should not focus on unrealistic alternatives, but simply accept coal's status as a mainstay in our economy and focus on developing it as efficiently as possible."
CHI_eyeing_the_west: "Eyeing the West"
CHI_eyeing_the_west_desc: "The Western bloc, led by the United States, has long been hostile to our country. We need to ease relations with them - after all, who would refuse China's cheap exports?"
CHI_Asian_Infrastructure_Investment_Bank: "Establishment of the Asian Infrastructure Investment Bank"
CHI_Asian_Infrastructure_Investment_Bank_desc: "In order to better assist underdeveloped countries, we should establish an institution dedicated to international investment and aid. The Asian Infrastructure Investment Bank is an intergovernmental multilateral development institution in Asia that focuses on supporting infrastructure construction. Its purpose is to promote the process of interconnection and economic integration in the Asian region and strengthen cooperation between China and other Asian countries and regions. It is the first multilateral financial institution initiated by China. It is headquartered in Beijing and has a registered capital of 100 billion dollar. As of September 2023, the number of AIIB members has increased to 109."
CHI_Alipay: "Alipay"
CHI_Alipay_desc: "Alipay is a business of Ant Group Co., Ltd., established in 2004. After 19 years of development, it is a domestic third-party payment open platform, operated by Alipay (China) Network Technology Co., Ltd. and Alipay (Hangzhou) Information Technology Co., Ltd. It is responsible for providing product and service interfaces for digital service providers and assisting merchants and institutions in digital operations. More than 3 million merchant and institution mini-programs have entered the Alipay app, providing consumers with more than 1,000 life services such as government services, scanning code ordering, and life payment. Alipay has served 80 million merchants and 1 billion consumers. The mobile digital payment methods pioneered by Alipay and WeChat Pay have profoundly changed China's social and economic development."
CHI_Desalination_of_seawater_projects: "Desalination of seawater projects"
CHI_Desalination_of_seawater_projects_desc: "Desalination of seawater is the production of fresh water by desalination of seawater. It is an open-source incremental technology for realizing water resource utilization. It can increase the total amount of fresh water and is not affected by time, space and climate. It can ensure a stable water supply for drinking water for coastal residents and water replenishment for industrial boilers. During the 11th Five-Year Plan period, my country's seawater desalination developed rapidly. By the end of 2010, more than 70 seawater desalination plants had been built, with a designed capacity of 600,000 cubic meters per day, and an average annual growth rate of more than 60%."
CHI_a_Community_with_a_Shared_Future_for_Mankind: "§CA Community with a Shared Future for Mankind§!"
CHI_a_Community_with_a_Shared_Future_for_Mankind_desc: "§CEach one appreciates his own beauty, appreciates the beauty of others, and shares the beauty, and the world is united§!\nHumanity has only one earth and one world. No matter where people are, what their beliefs are, or whether they are willing or not, they are actually in a community with a shared future. At the same time, a global value system aimed at responding to common challenges facing mankind has begun to take shape and gradually gained international consensus.\nOur great cause is by no means limited to China. We will work together with all countries and all nations in the world to build a more prosperous, peaceful and stable beautiful earth. This is not only the voice of the Chinese people, but also the common wish of all people in the world."
CHI_Good_Neighbourliness: "Good Neighborliness"
CHI_Good_Neighbourliness_desc: "Since the collapse of the Soviet Union, Russia has been in turmoil and poverty. We have maintained a peaceful diplomatic attitude, not intervening in their affairs, and not seizing disputed border areas. Now that Russia has a new president, we can take this opportunity to agree on the border and continue to maintain good relations between the two sides."
CHI_APEC: "Asia-Pacific Economic Cooperation"
CHI_APEC_desc: "APEC is an important economic cooperation forum in the Asia-Pacific region and the highest-level intergovernmental economic cooperation organization in the region. In October 2001, the APEC Leaders' Informal Meeting was held in Shanghai, China. This was the first time that the APEC meeting was held in China. The meeting was themed "New Century, New Challenges: Participation, Cooperation, and Promoting Common Prosperity". The meeting exchanged in-depth views on the current world economic situation, the impact of the "9.11" incident on economic development, human resources capacity building, and the future development direction of APEC, and reached a broad consensus."
CHI_Counterintelligence: "Counterintelligence"
CHI_Counterintelligence_desc: "In order to protect our country's information and intelligence security, we must eliminate all kinds of domestic espionage forces."
CHI_Combat_Islamism: "Combat extremist ideology"
CHI_Combat_Islamism_desc: "Islam is a widely spread faith in my country, with its main followers being Uyghurs and Huis. The Uyghurs are our fellow countrymen in building socialist China, and Islam has no conflict with the cause of the Party and the country. However, some extreme separatists have maliciously used Islam to incite and promote separatist ideas, which has had a very bad social impact and poisoned the minds of our country's Muslims. We must clearly eliminate these extremists and return Islam to its purity and beauty."
CHI_Peoples_Daily: "People's Daily"
CHI_Peoples_Daily_desc: "People's Daily is the official newspaper of the Central Committee of the Communist Party of China and the most influential newspaper in my country. We can promote the influence of People's Daily online so that it can also play the role of the official media mouthpiece on the Internet."
CHI_Xinhua_News_Agency: "Xinhua News Agency"
CHI_Xinhua_News_Agency_desc: "Xinhua News Agency, or Xinhua News Agency for short, is China's national news agency and a world news agency. We can use this organization to set up a key news website and form a large-scale national website cluster by hosting a series of large government websites."
CHI_guancha_cn: "guancha.cn"
CHI_guancha_cn_desc: "There are many news and commentary websites abroad that are dedicated to providing netizens with political commentary programs. We should also set up such a program and arrange some people who speak for the government to be commentators."
CHI_xuexi_cn: "Study to Strengthen the Nation"
CHI_xuexi_cn_desc: "Young people are easy to shape and win over. We should create an application platform that provides free learning resources and official ideological courses, so that young people can video chat with friends, send messages, create personal calendars, get information from state media or watch TV dramas about the history of the Communist Party of China on the platform, so as to achieve "organized, managed, guided and serviced" learning."
CHI_Network_keywords: "Network keyword blocking"
CHI_Network_keywords_desc: "The Internet provides everyone with the opportunity to speak publicly, including extremist and harmful speech. Identifying and deleting these speeches is a huge project. It is better to simply block some keywords so that those words will never appear in cyberspace. By conducting targeted screening and blocking of keywords that may have the potential for crime or cyber violence, we can often prevent crimes before they happen and nip serious criminal acts in the bud."
CHI_Internet_police: "Internet Police"
CHI_Internet_police_desc: "According to Article 6 of the People's Police Law of the People's Republic of China, the people's police shall perform the duties of "supervising and managing the security of computer information systems" in accordance with the law. In this sense, the people's police who are engaged in public information network security supervision should be called "Internet police." The modern function of Internet police is the most distinctive feature of Internet police, because their duty is to conduct online searches to prevent and track the ghosts of various bad behaviors and criminal activities that can be committed in seconds and leave almost no trace."
CHI_Online_anti_pornography_campaign: "Clean Internet Action"
CHI_Online_anti_pornography_campaign_desc: "As long as you use the Internet, you will be easily harassed by pornographic websites, which makes you extremely disgusted. This is the personal experience of many netizens. According to statistics, there are more than 370 million pornographic websites on the Internet, and about 20,000 pornographic photos enter the Internet every day. Young netizens are suffering from the erosion of bad information on pornographic websites. Therefore, it is imperative to curb the "pornography poison" on the Internet and strike hard."
CHI_online_water_army: "Water Army Controls Comments"
CHI_online_water_army_desc: "We cannot close all comment areas or screen all online speech, but we can dilute other speeches that disagree with official opinions by creating a large number of speeches that are favorable to us."
CHI_pinduoduo: "Pinduoduo"
CHI_pinduoduo_desc: "Pinduoduo was founded in April 2015 and is a mainstream e-commerce application product platform in China's mobile Internet. It is a third-party social e-commerce platform focusing on C2M group shopping. Users can purchase high-quality goods at a lower price by initiating group purchases with friends, family, neighbors, etc."
CHI_Baidu_Tieba: "Baidu Tieba"
CHI_Baidu_Tieba_desc: "Baidu Tieba is the world's leading Chinese community. Its Tieba directory covers all aspects of society, region, life, education, entertainment stars, games, sports, enterprises, etc. It is the world's leading Chinese communication platform. It provides people with a free online space to express and exchange ideas, and brings together like-minded netizens."
CHI_Bilibili: "Bilibili"
CHI_Bilibili_desc: "Western video communities such as YouTube have little influence in China, but we also have our own excellent video community. Bilibili was originally a two-dimensional community, and has now become the most influential online video community in China."
CHI_Mihoyo: "mihoyo"
CHI_Mihoyo_desc: "MiHoYo Network Technology Co., Ltd. is a Chinese video game development and publishing company. In addition to games, the company also creates a variety of products such as animated series, novels, comics, music, and merchandise."
CHI_Tik_Tok: "TikTok"
CHI_Tik_Tok_desc: "TikTok is a short video hosting service from China. It hosts user-submitted videos ranging from 3 seconds to 10 minutes in length. TikTok's popularity has led to the platform's growing cultural influence around the world."
CHI_Little_Red_Book: "REDnote"
CHI_Little_Red_Book_desc: "REDnote is a lifestyle platform and consumer decision portal founded by Mao Wenchao and Qu Fang in Shanghai in 2013. REDnote's refined sales model has made it the world's largest consumer word-of-mouth database, connecting Chinese consumers and outstanding brands."
CHI_strict_check_Japanese_anime: "Strictly Check Popular Culture"
CHI_strict_check_Japanese_anime_desc: "Although the popular cultures of Japan, South Korea, Hong Kong and Taiwan have their essence, they will inevitably be used as tools for cultural invasion and even interference in our country. Culture is the soul of a nation, and we cannot allow the culture of members of the camp that are hostile to us to run rampant and take root in this land."
CHI_ban_Korean_culture: "ban Korean culture"
CHI_ban_Korean_culture_desc: "Korean Wave culture is very popular in our country, especially among young women. Although we do not have too many conflicts of interest with South Korea, the United States behind South Korea is always trying to use South Korea as a tool to interfere in our country. It can be confirmed that Korean Wave is being used as a strategy of cultural invasion. Culture is the soul of a nation. We cannot let the culture of members of the camp of hostile people take root in our country."
CHI_Network_censorship: "Network Censorship"
CHI_Network_censorship_desc: "Internet culture is an emerging new cultural field. We should strengthen the censorship of this field to ensure that no harmful information endangers the people and national security of our country."
CHI_Developing_local_network_culture: "Local network culture"
CHI_Developing_local_network_culture_desc: "With thousands of years of history and a population base of over one billion, we can create many excellent new network cultural products that are in line with the times."
CHI_Internet_Users_Real_Name_System: "Internet Real Name System"
CHI_Internet_Users_Real_Name_System_desc: ""

CHI_Transformation_Official_Media: "Official Media Transformation"
CHI_Transformation_Official_Media_desc: "As we enter the Internet era, traditional official media should seize the opportunity to adapt to this new platform."
