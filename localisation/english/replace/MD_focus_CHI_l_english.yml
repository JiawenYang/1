chi_GR.0.t: "Millennium Dawn: Great Rejuvenation Play Guide"
chi_GR.0.d: "Thanks for playing this mod.This mod is still in production, and any values or effects may need to be modified. We welcome feedback on bugs"
chi_GR.0.a: "I know"
chi_GR.0.b: "I want something different"
chi_GR.1: "The first day of the millennium"
chi_GR.1.t: "The first day of the millennium"
chi_GR.1.d: ""Xiaoyun, how are you doing recently. Strictly speaking, January 1, 2001 is the first day of the millennium. However, everyone thinks that January 1, 2000 is the millennium, and many celebrations have indeed been held. If you now bring up the view that "the millennium will not be until next year", you will probably only be regarded as a spoilsport and a freak who loves to nitpick, so let's just treat it as the millennium now. \n\nI recently heard a lecture by some people who believe in Jesus, saying that the millennium is related to their doctrine. It's really strange. In Christian doctrine, the millennium is an era of great peace and prosperity, but in reality, there are wars everywhere - from the civil wars in Afghanistan and Nepal, to the liberation war in Angola, to the warlord melee in Congo and Myanmar - there is no sign of great peace at all. But the great prosperity has proved that the streets of New York and Tokyo are bustling with traffic, and the factories in Shenzhen and Guangzhou are full of assembly lines. Even on the front line of the Cold War, the border between North Korea and South Korea, there are only the echoes of radio and the pop music in the south. \n\nI am doing some community work here now. In simple terms, I deal with some old men and women in the city. It is not tiring, but it is definitely not easy. \n\nAnyway, I hope everything is well with you. This is the first email I have written since I arrived in Beijing. You should have written a lot of them in school. I am doing well in Beijing. Except for the strong wind in winter and the yellow sand in spring, everything else is good. I heard that rock music is very popular in Beijing, but I am not used to such loud music. It is much better here than my hometown! Remember to bring back some special products from Shenzhen for the Chinese New Year this year. I will put more in your red envelope. But it seems that there is nothing that can be called a specialty there...\n\nIn short, you must study hard. I believe you can be admitted to a good university. It is better for girls to study more.""
chi_GR.1.a: "Silly Brother, January 1, 2000"
chi_bush.1: "Letter from George W. Bush"
chi_bush.1.t: "Letter from George W. Bush"
chi_bush.1.d: "When the Chairman finished reading the letter from the United States, which had been forced to be revised five times, he could not help but curse out loud.\n\n"The shameless Americans are still in this style. What's the use of saying "very sorry"? They can't find our people even if they keep talking!"\n\n"This is the maximum apology that Washington and President Bush can accept." Foreign Minister Tang Jiaxuan said to the Chairman with a serious face.\n\n"I scolded the Americans severely when I went to Chile last time, and they quickly gave in. If I scold them again when I go to a country next time, they may give in again." The Chairman smiled bitterly, "Even if they give in, what's the use? That's why I said we can't let people laugh at us. This time, we really let foreign countries laugh at us. The Americans really like to stir up trouble when their plane was knocked down in their own waters by the United States. "Facing the country across the ocean, the Chairman felt powerless, and at the same time felt pain for China's lack of sufficient military and diplomatic strength, and could not help but sigh. "Our navy and air force are so poor that we can't ensure national security. If the Americans bring in an aircraft carrier, we will have no way. If we also have an aircraft carrier, full of planes, would the Americans dare to hit our people?"\n\nForeign Minister Tang paused and looked at the Chairman with a tentative look: "The negotiations on the Turkish side are going smoothly, and it is expected that the ship will be released soon. "After hearing this, the Chairman said: "As long as it can be driven to the country, it will crash and roar, and it will be modified at any cost! We have waited too long for the day when we have an aircraft carrier!"\n\nThe Foreign Minister nodded: "For the Americans, aircraft carriers are the real capital of diplomacy, and only countries that hold aircraft carriers in their hands are qualified to negotiate. But for now, we still have to respond to this apology letter that has been revised five times, otherwise the relationship may be worse. "The Chairman sighed and was silent for dozens of seconds."
chi_bush.1.a: ""This is the only way for now""
chi_GR.36: "Dub-lyoo-tee-me?"
chi_GR.36.t: "Dub-lyoo-tee-me?"
chi_GR.36.d: ""Wait, what did you just say? Dub-lyoo-tee-me? What kind of thing is that, and why is it both 'slipping' and 'kicking' people?" This wasn't the first time a community resident had asked such a question. Over the past three days, Liu Changjun had to repeatedly answer similar inquiries countless times every day.\n"Uncle, it's not about 'slipping' or 'kicking'! It's a foreign term. In our language, it means the 'World Trade Organization'—it's used for doing business with foreigners!" "Oh, so it's about doing business. But what does that have to do with us? None of us neighbors here are doing business with foreigners! You're not here to sell foreign goods, are it? Not interested, not interested!" Liu Changjun quickly set up his promotional board, turning the slogan toward the elderly man. "Uncle, please don't leave. I'm not here to sell anything. I'm here to share knowledge with the community. Look at my red vest—see, there's even a Party emblem here. Since when do Party members go around selling things?" Liu pointed at the words on the board. "Take a look! China has just joined the World Trade Organization. Soon, foreign goods will fill the shelves here. Once foreign products come in, housing prices will drop, and it'll be easier for your children to buy a home! Phone bills, pagers, medicine, cars... all these will become cheaper. Life for us ordinary folks will get better and better! Plus, we can open more factories, creating jobs for young people, and sell what we produce abroad to earn foreign currency. That way, our country will grow wealthier too!"\n"Really? So many benefits? It kinda feels like you're lying... but a Party member probably wouldn't say such things without basis, right? Hey, young comrade, don't leave yet! Give me a flyer. I'll take it back and study this 'Dub-lyoo-tee-me' with my wife to see how we can join. Once we've figured it out, I'll come find you. We need to make sure foreign money gives our son a kick in the pants too!"\nLiu Changjun felt a bit embarrassed. They say working with the masses is challenging, and it's true. But after these few days, he had come to appreciate the weight of reality. Watching the elderly man walk away happily, he felt a mix of emotions he couldn't quite put into words. Still, when it comes to promotional work, maybe the process isn't as important as the outcome, as long as the message gets across..."
chi_GR.36.a: ""I really hope Xiaoyun can learn more about 'Dub-lyoo-tee-me' in Shenzhen""
chi_GR.2: "moderately prosperous"
chi_GR.2.t: "moderately prosperous"
chi_GR.2.d: "When the teacher called her name, Liu Changyun couldn't stop her heart from beating even though she had prepared herself mentally.\n\n"We have just learned about the Great Dao and the Great Harmony of the World. In fact, there is a second half of this ancient text, which is not about the Great Harmony, but the word 'well-off' that we often hear." The teacher cast his eyes on Liu Changyun, "Xiao Liu, what do you think well-off means?"\n\n"Teacher, I guess...well-off means a relatively stable life... right?" Liu Changyun stuttered.\n\n"Yes, and no. Ancient people regarded Xiaokang as a better society with a lower level than Datong Society. As we learned before, Datong Society is a society where the world is for the public, while Xiaokang Society is a society where the world is for the family. Xiaokang world is a society where "everyone loves his own relatives, each loves his own children, and his goods and strength are for himself", "rituals and righteousness are used as rules, to correct the monarch and ministers, to be loyal to fathers and sons, to be harmonious with brothers, to be harmonious with husbands and wives, to establish systems, to establish fields, to be virtuous, brave and knowledgeable, and to take credit for his achievements". Everyone does his own thing and lives his own life. You may think that it sounds so selfish, but think about it, a world where the world is for the public is still impossible now, let alone thousands of years ago in ancient times. The ancients also knew this, so they hoped to build a society where everyone is content with their own place and each does their own thing, which is always better than the reality of war or heavy taxation. "The teacher looked at Liu Changyun again, "Xiao Liu's definition of a relatively stable life is actually very accurate. Only when everyone can live well can we build a harmonious and stable society. Isn't it said that we should build a Xiaokang society now? When you grow up and graduate, it will be the time for a well-off society to be built. What a beautiful society it will be at that time..." The teacher looked out the window. The sky outside was half cloudy and half sunny, which was a rare weather in Shenzhen.\n\nFor Liu Changyun, she didn't quite understand what the well-off society that the teacher envisioned would be like, but she had a vague idea -"
chi_GR.2.a: ""Probably better than it is now""
chi_GR.3: "Great Rejuvenation"
chi_GR.3.t: "Parts"
chi_GR.3.d: "The assembly line hums, and Ah Shun is concentrating on adjusting the processing parts that are continuously sent.\n\nHe graduated from a vocational high school a few months ago and found this job in an electronics factory. The salary here is not high, but the factory provides uniform cheap food and accommodation, and Li Cheng himself does not spend much money. After the monthly salary is settled, in addition to the part sent back to his hometown, there is still a lot left. People say that he has caught up with a good time, saying that the country has joined some organization some time ago, and various factories in Shenzhen have sprung up like mushrooms after rain. He doesn't understand these things, but he just thinks that this job is very tiring, but fortunately he earns a lot.\n\n"Brother Shun, let's go to the Internet cafe next door after work. I heard that the new network administrator is a beautiful girl, feast your eyes!" Xiaolin, a worker sitting next to him, came over and said.\n\n"Look, I'm so tired today. I'm going back to the dormitory to sleep after work. "Actually, it's not that Ah Shun didn't want to go, but because every time he went to the Internet cafe, he had to spend a lot of money. Even water there costs several yuan, and instant noodles are also very expensive. "Deadhead! If you don't want to watch, then don't watch. I'll go by myself. Oh, yes, Wang Xiaomei from the next workshop has been staring at you before going to work today. I think there's something going on!" \n\n"Get lost! Do your job, you poor ghost!" Ah Shun pushed Xiao Lin away, actually to cover his red face. He and Wang Xiaomei have been secretly in love for several weeks. He wanted to hide it from others, but he didn't expect it to be exposed so soon. Although Xiaomei didn't care that Li Cheng was a poor guy, Ah Shun still wanted to make enough money to buy a house in his hometown county as soon as possible, so that the two of them could have a place to live in the city. Every time Xiaomei asked him about his future plans, he felt excited in his heart, as if he was close to buying a house. Ah Shun smiled secretly while processing the electric board."
chi_GR.3.a: "As long as you are willing to work hard, you can succeed"
chi_GR.4: "Chairman's Itinerary"
chi_GR.4.t: "Chairman's itinerary"
chi_GR.4.d: "The Chairman left the conference hall soon after the meeting, not for anything else, just because he was too tired. After Comrade Xiaoping passed away a few years ago, the Chairman became the most respected person in the party, and all things would come to him, whether good or bad. The Chairman is respected as an elder, and this title is full of people's respect and love for him. However, he is indeed an old man over 70 years old, and his physical strength and energy are no longer as good as when he was young. After leaving the conference hall, he just wanted to get in the car and sleep for a while. \n\n Premier Zhu Rongji quickly caught up from behind. Although the Premier of the State Council is about the same age as the Chairman, he is still energetic and can answer questions fluently and without leaking a drop of water at various Q&A sessions and press conferences. After Premier Zhu caught up with the Chairman, he whispered to him: "I won't go to the next meeting, go back to my residence." The Chairman turned sideways and looked at the Premier, who nodded and said, "The schedule has been changed, and I can spare the time. \n\n"That won't work. How can it be changed casually?" The Chairman shook his head. "I tell you, some things have been done countless times after the first time. If you can change it today, can you change it in the future? If the leaders set an example, other comrades will learn to change in the future, and I can't say anything to them. You must go to today's meeting, ahem--" The chairman spoke too hastily and choked himself, then quickly walked out of the building gate and got into the car. "I tell you, in the new century, we must show a new spirit, so as not to let those foreigners laugh at us old men again. I have some plans later, you should prepare them for the people below to do." The chairman grinned at the prime minister through the car window, and then rolled up the window. Premier Zhu Rongji saw that he could not continue to persuade him, so he could only go to the car behind and sit down. \n\nIn the evening, the motorcade drove slowly and steadily in the city full of streamers. The setting sun had disappeared into the buildings of Beijing, replaced by countless thousands of households with lights on. There were many more people going home from get off work on the streets, and there were also families taking a walk after dinner. The prime minister looked at the pedestrians on the street and gradually fell asleep. ""
chi_GR.4.a: "This is worth protecting"
chi_GR.5: "Flying"
chi_GR.5.t: "Flying"
chi_GR.5.d: "The sun sets, and with the night comes the sound of fighting.\n\n"Hand over your money, you bastard! I'll chop you up, believe it or not!" The man in the flowered shirt yelled viciously while kicking the man curled up in the corner. Behind him stood five or six people in fancy clothes, laughing.\n\n"Brother, brother, I beg you, I really don't have any money, and I won't get paid until next week! Brother, let me go, brother, I really beg..." Before he could finish his words, the man in the corner was kicked in the chin by the shirt man, and blood immediately flowed from his mouth.\n\n"What the hell are you talking about, you bastard, you're wearing such nice clothes and you still say you don't have money, are you pretending for me? ! Okay, okay, it would be ignorant if I don't take down some parts for you. "The man in the shirt picked up a long stick from the side and swung it hard at the man. Screams followed.\n\n"Brother Stick, stop hitting me. Brother Jing seems to be here!" A man behind him patted the man in the shirt on the shoulder.\n\n"Damn it, which bastard informed Brother Jing." The man in the shirt yelled at the people behind him, then turned around and spat at the people in the corner. "What a fucking bummer, these watchdogs are still so dedicated after work, they are really a group of good dogs. Let's go." The man in the shirt kicked the man again and left with a few followers. The roar of several motorcycle engines immediately disappeared in the city sky along with the cheers and screams.\n\nWhen the police and the passers-by who called the police rushed to the man, the man had already stopped breathing, holding a small box in his hand, which contained an exquisite ladies' watch."
chi_GR.5.a: "Happy birthday, my dear daughter"
chi_GR.6: "Young People"
chi_GR.6.t: "Young People"
chi_GR.6.d: "Hu Jintao stared at the front of the huge marble building, tall and solemn. This is the Great Hall of the People, where all the biggest things in China are announced, and the national emblem shines on its top. Tall marble columns stand in front of the door. Hu Jintao has walked into this building countless times before, but this time he felt like he was in Beijing for the first time. The building itself is the embodiment of an ancient and noble will, and it is also a living monument. The statue of Chairman Mao on the Tiananmen Gate Tower quietly watches everything that has happened here for decades. Hu Jintao seemed to have returned to his time working in the Communist Youth League, during which his youth and energy were burning, dedicated to the cause of the Communist Party of China. Hu Jintao once swore a solemn oath in this building, just like countless others. He recalled those who swore with him at that time. He had no memory of most of them, and some of the more familiar people had disappeared. Here he promised to devote his life to the noble cause and to take on the responsibilities that every Communist Party member must bear. He was once called "young man" by many people. Now this former young man is in his sixties and his health and energy are not as good as before. Sometimes he asks himself: what is the reason for getting to this point. But no matter what, he has to do what he once swore to do, no matter where he is. \nWhile browsing through the archives late at night, he noticed a figure rustling in the empty hall outside. It was a cleaner, wearing work clothes and repeating the mechanical action of mopping the floor back and forth. Hu Jintao looked at his figure and suddenly had a strange feeling. This person was just like him when he was young, often doing unknown and uncared work in deserted places, living quietly like countless other people in this society. A class that can never be transitioned, can never see the beauty of the world, but just strives to live in the present in order to survive tomorrow. Can this achieve national prosperity and national rejuvenation? If he is given the same opportunity and education, maybe he can also become An engineer, an astronaut, a person who makes greater contributions to society. However, this middle-aged man who looks to be in his 50s seems to have been a colleague here with these gloomy documents for his entire life, and will repeat the same work here every day in the future. \n\nHu Jintao silently put the documents back on the shelf. When he left, he was saluted by the old cleaner, who patted him on the shoulder and gave him a handkerchief to wipe his sweat. Under the cleaner's surprised eyes, Hu Jintao walked out of the archives room. Now he has more determination in his heart - he must make the people on this land live better. He felt the moonlight and breeze in the yard, listening to the voice of his youth, "
chi_GR.6.a: "It can be like a young boy"
chi_GR.7: "Green Light on the Plateau"
chi_GR.7.t: "Highland Green Light"
chi_GR.7.d: "For Phu Bu, life on the plateau is always the same. Apart from the endless snow-capped mountains and the occasional antelopes and snow leopards, there is basically nothing new. His grandmother has been getting sicker and sicker recently. She would vomit out any herbs she eats. Phu Bu can only go to the temple to ask for help from the lama. The lama said that he could get more effective medicine by going to the place where the Han people live, but Phu Bu has never seen a few Han people in his life, and he can't speak or understand Chinese, not to mention that there is no road leading to the Han people's residence in this place.\n\nPhu Bu prayed to the sky during the day and prayed beside his grandmother at night after herding the sheep. However, the Buddha did not seem to have mercy on the dying grandmother and her pious grandson. Phu Bu Pubu asked the lamas about the way to the Han territory. It took seven or eight days to cross four snow-capped mountains to reach another village, where he could take a gas-powered cart to the Han city. Pubu couldn't leave his grandmother for so many days, and she needed someone to take care of her all the time. He prayed to the endless mountains every day, and then prayed for miracles as usual. \n\nHe remembered that a few years ago, many people suddenly came from the other side of the mountain. Those people brought huge iron carts to smash and pestle everywhere. Soon, two long iron rods were left on the ground, with wood in the middle. According to the lamas, those were Han people from far away, and they came here to build roads. Is that a road? How can there be people? Walking on iron rods and riding cows? Pu Bu didn't understand these, he was more concerned about his grandmother's condition. The night before, his grandmother told Pu Bu to make a few more barley cakes and invite a lama to take care of them at home, so that they could hurry to the Han territory to find medicine. Pu Bu didn't sleep all night and shed tears all night. The next day, he made barley cakes and went to the temple to invite the lama. \n\nThe mountains on the plateau are so high that they block the turbidity of the world and the way forward in life. Pu Bu felt exhausted after walking for a day, but he didn't even finish a quarter of the way. He sat on a shady stone and took out the barley cake to eat. Suddenly, a rumbling sound came from the original place, The earth began to tremble. At first, Pubu thought that the end of the Dharma mentioned in Buddhism had come and the world was going to collapse, but after a while, it didn't seem like that. Pubu saw a green thing appearing in the distance, getting bigger and louder. The huge sound was clearly made by the green thing! When the long green strip passed by him quickly, he finally realized that it was the Han people's carts running on the iron bars they had built before. \n\nPhubu stood up and ran after the train. Grandma is saved, the Han people brought their carts! Then he realized that the iron road laid by the Han people several years ago was destined for them to bring the things that saved people here. "
chi_GR.7.a: "Zaxi Delek, Han Chinese friend!"
chi_GR.8: "Water Drops"
chi_GR.8.t: "Water Drops"
chi_GR.8.d: ""Children, do you know where water comes from?"\n\n"Teacher, water comes from the tap!"\n\n"No, water should be fished out from the well!"\n\n"You are all wrong. Water falls from the sky. Water only comes when it rains!" The children talked about it, and they all thought that what they or others said was reasonable. "Everyone is right. Water can be found in these places. But the teacher has a different answer. The teacher thinks that water is 'saved' from everyone's hands." The teacher made a hand-holding gesture, bent down and pretended to hold a handful of water.\n\n"There is water everywhere in our lives, but we have very little water. Less than 5% of the water in the world is available to us, so in many places in our country, people can't even use water. Some of them may only take a bath three times in their lives: at birth, at marriage, and at a funeral. Our country is large and has a lot of water, but we are the most populous country in the world, so there is very little water for everyone. "The teacher turned around and put the invisible water into the cup,"Therefore, we should start saving every drop of water from various places around us, such as turning off the faucet, using tapped water instead of running water when washing vegetables, etc. In this way, we can make our own contribution to our limited water resources and allow more people to use water. What do you think?" \n\n"Good!" The children seemed to understand, but there was already a blue seed in their hearts."
chi_GR.8.a: "Drops of water make a river, small drops add up to a lot"
chi_GR.9: "Black Sun"
chi_GR.9.t: "Black Sun"
chi_GR.9.d: ""I tell you, sometimes the daytime is just like the black sky, gray, even the sun is gray!" When Liu Changjun heard the Hebei colleague describe his hometown like this, he was shocked and speechless.\n\n"So scary? How can the sky turn black for no reason?"\n\n"We live in the suburbs, so we can be considered half city dwellers. There is a huge factory on the other side of the city, making steel. To make steel, you have to burn furnaces, and burning furnaces will produce smoke. The big chimneys of the factory emit black smoke day and night, sometimes it can really blacken the sky! Not to mention the streets, even at home, you have to sweep the floor every day, and every time you sweep, there will be a piece of black slag, which is all the floating coal slag!"\n\n"Won't this be harmful to people? Can such coal slag be breathed into the lungs and exhaled?"\n\n"It's very harmful! Most of our old people died of lung disease, and many young people also coughed constantly at a young age. Fortunately, I passed the exam and came to Beijing, otherwise I would have shortened my life by several decades. "The colleague sighed inadvertently, and Liu Changjun heard it clearly. "
chi_GR.9.a: "What does the black sun look like..."
chi_GR.10: "Holy Man"
chi_GR.10.t: "Holy Man"
chi_GR.10.d: ""Sorry, Xiao Liu, I can't use a cup that someone else has used." After the long run, Liu Changyun handed the cup to the panting Xiao Ma, but Xiao Ma shook his head and declined with a slight apology.\n\n"Ah, I don't dislike Xiao Liu, but my family doesn't allow me to do this..." Xiao Ma saw Liu Changyun's puzzled expression and hurriedly explained. Liu Changyun then remembered that Xiao Ma was a Hui, and there were some differences between him and others. For example, she had never seen Xiao Ma go to the school cafeteria to eat, which was said to be because the Hui people could not eat pork; for example, Xiao Ma often went to the bathroom to wash his feet. Although it was indeed very hygienic, the frequency was still too high.\n\n"Oh, so that's the case. It's okay. Let's go buy some water. But I'm curious, if I pour water into your cup, can I drink it? Or, what kind of water is drinkable in your place?"\n\n"My parents said that if you use someone else's cup, you may drink unclean water. You can't eat from the same plate with others either. Our family pays great attention to cleanliness. We wash our bodies and limbs frequently, especially before church services. We must keep our bodies clean." "Is this the reason for not eating pork?" "It should be. My mother always tells me that pigs are unclean and asks me not to eat pork. But I think the piglets we raise are all white, so they shouldn't be dirty..." \n\nIt turns out that it's for hygiene reasons, but it's a bit too particular. Have they been like this for thousands of years? Liu Changyun thought to herself. But she forgot about it soon after. After all, Xiao Ma is no different from other people. The only thing that occasionally reminds her is that Xiao Ma often washes his hands and feet."
chi_GR.10.a: "It's always good to be clean"
chi_GR.11: "Grassland Eagle"
chi_GR.11.t: "Grassland Eagle"
chi_GR.11.d: "Under the dark sky, in a remote suburb of Inner Mongolia, a dilapidated factory was still lit, and loud shouts and curses came from the factory.\n\n"How come you can't do this well? Isn't it just a few extra parts assigned to you? You can even install these parts upside down, you are really amazing! ? Comrade Xiao Mao!" The man dressed as a foreman said sarcastically, in front of him were Xiao Mao and other workers who were scolded very aggrieved. "You are a party member representative of our factory. Do you know how much you owe me for giving you this quota? I don't know how many times I have talked to the boss, wanting to set you up as a model, but you even messed up such a small thing? I am really blind."\n\n"I'm sorry, Manager Dai, I will definitely improve next time! I will never make mistakes!"\n\n"You should have changed. Also, don't read those messy things at night. I didn't let you join the party to let you sabotage. What do you want to do by reading those Marxist books every day? And tell others about it? What, you want to rebel? Like that Hunan bandit? "The foreman pushed Xiao Mao's head, "Don't think that just because you have the last name Mao, you can really make trouble like that old guy. You take yourself too seriously, don't you?" \n\n"Hey, keep your mouth clean." Huridele, a fellow worker at the side, finally couldn't help it and whispered. \n\n"What, you want to rebel too? I see you and Xiao Mao talking about something every day. You want to be Peng Dehuai, right? Rebel together? If you want to rebel, you have to do your job well first. If you can't do your job well, you can't rebel!" The foreman said viciously, throwing his safety helmet to the ground. \n\nAfter work, Huridele went back to the dormitory in the factory with Xiao Mao. "I didn't expect that my party membership qualification was obtained by Dai Zongguan. No wonder you wrote so many applications for joining the party before, but it was useless, and there was no feedback. "Huridler laughed heartily: "Ha, who cares about that kind of thing? A true party member doesn't need a piece of paper." "Actually..." Xiao Mao looked around and whispered: "I got evidence that Dai Zongguan secretly gave money and gifts to several officials. Last time, he gave the people sent by the Quality Supervision Bureau several bulging envelopes, cigarettes and alcohol, and finally went to the foot massage parlor in the city to play for a night. I followed them and took pictures!" \n\n"Is there such a thing? Good, I have disliked him for a long time, and he must be thrown into jail!" "
chi_GR.11.a: "Okay, let's go together"
chi_GR.12: "Imported Goods"
chi_GR.12.t: "Imported goods"
chi_GR.12.d: "Liu Changyun has recently fallen in love with an electronic style of songs. Not only is the melody itself synthesized by electronic software, but even the singer is sung by a software called Electronic Songs. She enthusiastically recommended several good songs of this kind to her stupid brother, but it was difficult for Liu Changjun to feel pleasure from these throbbing electronic sounds.\n\n"I spent a long time searching the Internet after get off work yesterday and finally found the song sung by the little green-haired man you mentioned on a Japanese website." Liu Changjun on the phone paused and continued, "I don't think it's very good... But I also found a lot of animations by the way. The cartoon called Pokémon that we watched on TV at home last National Day, I found it yesterday and watched a few episodes, it's pretty good."\n\n"Really? Then I can recommend you more good ones! Recently, Japanese animation is very popular in our school, and it's popular among classmates to speak Japanese! I also learned a few sentences. Let me think about it. Oh, yes, hello is Kong Ni Ji Wa, thank you is Arigato, goodbye is Sayonara, sorry is Su Mi Ma Sai..."\n\n"Oh, Japanese was popular when I was in school, but it's popular among you now. Haha, are you an old woman!"\n\n"What old woman? I think you are an old man! Forget about me recommending songs to you and you don't thank me. You are really a stupid old man. Okay, I won't say anymore. It's almost a minute. I'm hanging up now."\n\n"Hey, don't hang up yet. One of my colleagues is going to travel to Japan next week. Do you want her to help buy it back to China?"\n\n"Wow, really! Then I want the latest comics of "A Certain Scientific Railgun"!"\n\n"A Certain Scientific...what kind of gun? I've never heard of it...No, it's in Japanese when I bought it. Can you understand Japanese? "\n\n"If you don’t understand, you can learn. There are so many Chinese characters in Japanese, who doesn’t know them? You will definitely learn quickly."\n\n"What do you mean you can learn? That’s easy to say… Oh, forget it. When the time comes, just text me and tell me your name, and I’ll ask my colleague to buy it for you. Hang up, hang up." "Thank you so much, stupid brother!"\n\n"I helped you so much, but you still call me stupid?""
chi_GR.12.a: "I'll find a chance to travel too."
chi_GR.13: "Man can conquer nature"
chi_GR.13.t: "Man can conquer nature"
chi_GR.13.d: "Although the exact completion date of the Three Gorges Project had been determined several months ago, Hu Jintao still breathed a sigh of relief after receiving the news of its final completion.\n\n"This is not an easy task. When the proposal was put to a vote at the National People's Congress, the votes were so low that everyone was still worried about such a large project." Hu Jintao smiled at Premier Wen Jiabao, "But it's a good start. Everyone will get used to it when building large projects in the future."\n\n"It was built so quickly, and there are still hidden dangers after all. I think there are indeed some aspects of the project that can be discussed and improved, especially the design of flood discharge and sand storage. But time waits for no one. The entire Yangtze River region needs the electricity provided by the Three Gorges. Residents have been looking forward to the days of no power outages and power restrictions for a long time." Wen Jiabao also smiled, "Very good, our country has built another world-class project, and it is a project that benefits the people! "\n\n"When I was working at the Gansu Hydropower Station, I wondered when the large dam on the Yangtze River would be built. I didn't expect that it would be built during my tenure. I am so lucky. At that time, everyone talked about the principle that man can conquer nature, and liked to do some projects that seem incredible now. Some succeeded, and some failed. But if you ask me, man can conquer nature. We have built railways in Tibet, built dams on the Yangtze River, and sent people into space. We can really reach the moon and catch turtles in the five oceans! What do you think Chairman Mao would feel when he saw these if he were still alive? "\n\nPremier Wen Jiabao thought for a while: "It's hard to say anything else. He might be happy that there was no war. ""
chi_GR.13.a: "We are not afraid of being beaten. The Chinese people are invincible."
chi_GR.14: "Warm Spring"
chi_GR.14.t: "Warm Spring"
chi_GR.14.d: "Hu Jintao felt a little restrained when he met the Emperor the day before yesterday, but today he felt much more relaxed when he met with students in the elementary school in Yokohama. The students in this wealthy coastal city were dressed beautifully, full of energy, and lived a happy childhood every day, which reminded the Chairman of the poor students in the mountains in the southwest. "The gap between people is really too big, too big." Such a voice sounded in his heart.\n\n"Grandpa Hu, among the Beijing Fuwa, my favorite Fuwa are Huanhuan and Jingjing. Which Fuwa do you like the most?" A Japanese girl with twin ponytails asked Hu Jintao in fluent Chinese.\n"Oh, I want to tell you, I like all five Fuwa!" Hu Jintao smiled and bent down to answer the little girl, and the people around him also laughed.\nAnother little boy wearing glasses stood up and said to the Chairman in Chinese: "Grandpa Hu, I want to ask you a question, why do you want to be... Chairman? "\nWhen this was said, everyone was surprised and laughed. The teacher quickly tried to smooth things over: "Oh, this is a really difficult question, and you still stand up to ask a question..."\nPresident Hu smiled and bent down to the little boy: "Hahaha, I personally don't want to be the chairman." He put his hands on his chest, "It was the people of the whole country who elected me and made me the chairman. I should not disappoint the expectations of the people of the whole country, right."\nHe turned to the other people present: "When I met children in China, no one ever asked such a question. This Japanese child asked a very good question! Seeking truth from facts, and a spirit of research! I think Japanese children still have a lot of spirit that we need to learn. Just now, I saw a statue at the school gate, on which was Confucius' famous saying: It is a great pleasure to have friends coming from afar. The people of China and Japan once had a profound historical friendship. We are both neighbors and friends. The Chinese people pay attention to good neighborliness and help each other. If even neighbors don't like a person, then this person will definitely not be able to achieve much. We should strive to elevate this historical friendship to a new height, so that the people of our two countries in this era will be more familiar with and trust each other. "\n"The Chinese and Japanese people first enhanced their feelings in academics. In ancient times, Japanese students traveled thousands of miles to study in Chang'an, and Chinese monks such as Jianzhen also went to Japan to give lectures after going through untold hardships. The consensus on history and culture is the most solid foundation of the friendship between the two countries, and the respect for knowledge is the most harmonious consensus on the values of the two countries. We should strengthen the academic and economic cooperation between the two countries and jointly create a people-oriented, more peaceful, and beautiful future for the people of both countries. "\nAfter speaking, everyone present applauded sincerely, both Chinese and Japanese, but most of them were the children in the classroom."
chi_GR.14.a: "Children, the future of China and Japan depends on you"
chi_GR.15: "Highway"
chi_GR.15.t: "Highway"
chi_GR.15.d: "Today, [ROOT.GetLeader] will participate in a live Q&A session for netizens nationwide. He has long been able to remain calm in front of the camera, but he still feels a little awkward sitting in front of a small display screen and answering questions to people who can't see him. The secretary asked him quietly whether he could start. The chairman nodded and pushed his glasses.\n\n"Hello, General Secretary [ROOT.GetLeader]. We know that you are very concerned about the development of the Internet and the development of People's Daily Online. Today, you personally came to the Strong Country Forum. Our moderators and netizens are very excited and honored. Please say a few words to our netizens!"\n"Hey... friends, hello! I am very happy to have the opportunity to meet and communicate with you online today. First of all, I would like to take this opportunity to express my sincere greetings and good wishes to my netizen friends!"\n"Thank you General Secretary [ROOT.GetLeader] for your greetings to the majority of netizens. When netizens learned that you came to the Qiang Guo Forum, they posted on the Internet one after another. Some asked you many questions. Please have a discussion with netizens! One netizen asked: General Secretary, do you usually go online? What do you read?"\n"Oh, ok, haha, although I am usually busy with work and it is impossible to go online every day, but I still try to make time to go online. What I want to say in particular is that the People's Daily Qiang Guo Forum is also one of the websites I must choose when I go online frequently. I usually go online to read domestic and foreign news. On the other hand, I also want to know what issues netizens are concerned about and what they think online. . I also hope to learn from the Internet what opinions and suggestions netizens have on the work of the Party and the country. These are all things I am very concerned about. We have always emphasized putting people first and governing for the people, because when we do things and make decisions, we should listen to the opinions of the people and concentrate the wisdom of the people. It is a very important channel to understand the people's sentiments and gather their wisdom through the Internet. "\n"Some people compare the Internet to an information highway, and I deeply agree. You can see so much information and news as soon as you go online. This is something that people in the past would never dare to think about! In the past, people did not know the content of the work of the Party and the government, and there were few channels to understand it, so they regarded this as a very distant thing. Now everyone can see various tasks and policies on the screen, and can gather together to discuss, enhance their understanding of the policies, and point out their advantages and disadvantages. This is a good thing. There should be more new things in the new century!""
chi_GR.15.a: "Times are progressing"
chi_GR.16: "Big Mountain"
chi_GR.16.t: "Big Mountain"
chi_GR.16.d: "There are countless old trees and beautiful scenery in the mountains of the southwest, but for the people who live here, these old trees and mountains are a cage that they can never climb over in their lifetime. This is where Hu Jintao once worked, and he knows better than anyone how people here live.\n\nAfter the reform and opening up, the eastern coastal areas have been like a locomotive pulling the Chinese economy to soar, and have increasingly become an international economic highland. However, in the vast inland areas, especially in the deep mountains of the southwest, the spring breeze of reform has not blown at all. When he was in charge of Guizhou, it was simply a land of extreme poverty, widespread poverty and isolation. The poor transportation has turned this place into an economic depression that is completely opposite to the eastern region. Although he tried his best to improve people's lives when he was the provincial party secretary, there are thousands of ditches in the mountains, and a ladle of rice water can never fill the dry mouths of millions of people. \n\nFor Hu Jintao, it was his first time to govern a region. Although he made many achievements and was praised by the central government, he knew that it was almost useless to completely improve people's lives. When he visited the home of a left-behind child, the very young boy was eating with the village cadres who often visited him. \n"Xiao Wu, do you eat this in the morning and at noon?" \n"Yes! Eat it at night too! Potatoes are delicious! "The child answered loudly while laughing.\n\nThe village cadre wiped tears from Hu Jintao in the next room, saying that the child's parents were working outside, and his grandfather who took care of him passed away last month. Now the child can only eat potatoes with him. Potatoes are used to improve meals here. Hu Jintao secretly shed a lot of tears after leaving the shabby house. He almost lived like this when he was in Gansu before. Since then, he has always reflected on who he is working for and whether he has really helped those in need."
chi_GR.16.a: "People are struggling"
chi_GR.17: "Haunted"
chi_GR.17.t: "Haunted"
chi_GR.17.d: ""Fuck, I was just picking up firewood, and that thing flew up from the mountain road. It was so clear in the dark forest, it was just a skull, and it was always flashing!"\n\n"I also encountered a strange thing. My old mother lost her hair in the middle of the night, and she tied it neatly. I didn't think it was a big deal at first, but later my hair also fell out, as if it was shaved off with a knife. What do you think is this not alopecia areata? !"\n\n"I think you are all wrong. I went to the next village a few days ago and saw a ritual. Oh, that witch and Taoist priest are really capable. The owner of that house couldn't eat anything at first, and he vomited green water. After communicating with the spirit, the witch calculated that he was possessed by evil spirits, and wanted to pull out the evil spirits and throw them into the oil pan to fry. The witch held a bell and chanted a spell, the old Taoist priest muttered in a daze, and suddenly slapped her hand on the person's head, and then pulled out two big green worms, and then the witch put her hand directly into the hot oil pan and turned it around for a few circles. Oh, I felt so painful just watching it! In the end, she was fine! She also fried the two green worms into two fried dough sticks and let the patient eat them. Hey, the person vomited a lot of black water after eating them, and vomited and had diarrhea, but I heard that he was fine the next day! "\n\n"Is there such a thing? I invited several fortune tellers to tell my wife's fortune at that time, but they all knew how to touch my wife's hands, and they were not honest at all! It seems that I still need to invite a gentleman with real skills! "\n\nLiu Changjun looked at the villagers who were getting more and more excited as they talked, and looked at his colleague Xiao Zhang helplessly. This morning, he and Xiao Zhang were sent to this village to visit the people and ask the villagers if they had any problems. As a result, the villagers gave them such problems.\n\n"Fellow villagers, stop for a moment. Although we are not asking this kind of question, we already know what problems you have encountered... We will jointly apply for a science popularization meeting for our villages. What you just said, whether it is ghosts or miracles, are all feudal superstitions, which can be explained by science. The scientific principles will be explained clearly at the meeting. You must believe in science, learn science, and don't let superstition and ignorance blind your eyes! "Xiao Zhang said to the villagers whose eyes revealed distrust.\n\nAfter leaving the village, Liu Changjun smiled bitterly at Xiao Zhang and threw his briefcase on the back seat of the car: "I think popular science should be useless. These fellow villagers understand the truth that practice makes perfect better than us. They will definitely not give up their original cognition for what they have encountered personally."\n\nXiao Zhang pouted and said nonchalantly: "It doesn't matter. Popular science work is like this. As long as one or two people can successfully change their views, it will be a victory. Don't treat others as fools. They just don't know much. Once the truth is explained clearly, they will understand. ""
chi_GR.17.a: "I think it would be better to show them a few episodes of "Science Approaches"..."
chi_GR.18: "Candlelight"
chi_GR.18.t: "Candlelight"
chi_GR.18.d: ""How many miles do you walk to school? Where do you eat? Do you have enough to eat?" Hu Jintao was most concerned about the education of children in poor rural areas during this trip.\n\nWhen he was working in Gansu, he saw many students who had to walk several miles on the mountain road to school every time, and walk several miles back home at the end of the month. They usually ate very poor meals at school - those students from better families could eat in another separate stove, which usually contained mutton or beef. Does education have to be done on an empty stomach? Hu Jintao shook his head every time he thought of this.\n\nAlthough it has been many years since he took office, he still sees that many schools in mountainous areas do not even have decent classrooms, and some of the tables and chairs are even old things left over from before liberation - of course, several students squeeze into one table.\n\n"The future of the country lies in education, and the main target of education is children." President Hu said to Wen Jiabao on the way back, "We have invested a lot in education, but there are still more people who need education. "\n\n"I understand what you mean, but the financial pressure is already very great." Wen Jiabao replied solemnly.\n\n"Can we issue education funds to the society?"\n\n"Finance is probably not a good method. The gap in education funds is too large and it is used up quickly. We can't wait for the new fund to make a profit. I do have a plan. Why can't the society spontaneously bear the transfer of education expenditure? We already have a student aid program called Hope Project, which is sponsored by the China Youth Development Foundation. This project was initiated by your group faction. You are really a noble man who forgets things. "Wen Jiabao smiled and said to the Chairman, "When those city people see that the rural students are so poor, they will more or less arouse sympathy and donate money."\n\n"It's a good idea. Go back and contact the Propaganda Department and ask them to do more publicity. And..." Hu Jintao leaned forward and gestured, "The regulations on exemption of tuition and miscellaneous fees have been issued for so long, but just now I asked and found out that students have to pay more than 700 yuan per semester. This group of local tyrants wanted to unify the children's caliber and hide it from me. A few children who can't lie let it slip, and those people also argued that it was school uniform money. What gold school uniforms cost 700 yuan! How dare you talk nonsense in front of me!"\n\nWen Jiabao nodded, then shook his head."
chi_GR.18.a: "Too many greasy hands"
chi_GR.19: "A letter to fellow Taiwanese"
chi_GR.19.t: "Letter from the Standing Committee of the National People's Congress of the People's Republic of China to Taiwan compatriots"
chi_GR.19.d: "Dear compatriots in Taiwan: \n"Swallows go away, but they will come back; willows wither, but they will turn green again; peach blossoms fade, but they will bloom again. But, wise one, tell me, why do our days never come back?" This is the lament written by Mr. Zhu Ziqing, a famous modern Chinese essayist, poet, scholar and democratic fighter in the Republic of China in the 11th year of the Republic of China. We feel more deeply sad about this passage than ever before, because our own flesh and blood - the elders, brothers and sisters in Taiwan, have not yet been reunited in our warm families. We know that compatriots in Taiwan also miss their motherland and relatives on the mainland infinitely. This mutual longing that has lasted for many years is rooted in the hearts of every Chinese son and daughter, and it grows day by day. Since Taiwan was unfortunately separated from the motherland in 1949, we have lost contact and communication, the motherland cannot be unified, and relatives cannot be reunited. The nation, the country and the people have suffered huge losses. All Chinese compatriots and all All Chinese people around the world hope that this heartbreaking situation will end soon. \n\nOur Chinese nation is a great nation. We have a vast territory and a large population, accounting for nearly one-fifth of the world's population. We enjoy a long history and excellent culture. We are one of the countries with the largest territories in the world. Our outstanding contributions to world civilization and human development from ancient times to the present are recognized by the world. Taiwan has been an inseparable part of China since ancient times, and the people of Taiwan have been blood brothers of the Chinese nation since ancient times. The Chinese nation is getting closer and closer to the century-old dream of great rejuvenation. How we hope that together with our compatriots in Taiwan, as a member of the upright Chinese nation, we can stand proudly among the nations of the world. Every Chinese is proud of the growing strength of the motherland. If we end the division as soon as possible and combine our strength, If we come together, our contribution to the future of mankind will be limitless. The early realization of national reunification is not only the common wish of all Chinese people, including our compatriots in Taiwan, but also the common hope of all peace-loving people and countries in the world. \n\nWe place our hopes on the 22 million people of Taiwan, and we also place our hopes on the Taiwan authorities. The Taiwan authorities have always adhered to the one-China position and opposed Taiwan independence. This is our common position and the basis for cooperation. We have always advocated that patriotism is one family. The unification of the motherland is the responsibility of everyone. We hope that the Taiwan authorities will put national interests first and make valuable contributions to the cause of realizing the reunification of the motherland. We earnestly hope that Taiwan will return to the motherland as soon as possible and jointly develop the great cause of nation-building. Our national leaders have expressed their determination and must take the reality into consideration. Complete the great cause of national reunification, respect the status quo in Taiwan and the opinions of people from all walks of life in Taiwan when resolving the issue of reunification, adopt reasonable policies and measures, and do not cause losses to the people of Taiwan. \n\nDear compatriots in Taiwan: The bright future of our great motherland belongs to us, to you, and to all peace-loving people in the world. Unifying the motherland is the sacred mission that history has given to our generation. The wheel of history rolls forward, and the trend of the times is mighty. The sooner we complete this mission, the sooner we can jointly create the unprecedented and brilliant feat of the great rejuvenation of the Chinese nation, and then work with all peace-loving countries and nations to seek peace, prosperity and progress in the human world. Let us join hands and work together for this glorious goal! "
chi_GR.19.a: "Best Wishes"
chi_GR.20: "A letter to fellow Taiwanese compatriots"
chi_GR.20.t: "A letter to compatriots in Taiwan"
chi_GR.20.d: "Dear fellow Taiwanese: In 1945, after 14 years of war, the Chinese people won the victory and recovered Taiwan from the hands of Japanese fascist imperialists. The Taiwanese people also returned to the embrace of the motherland. However, since the Kuomintang reactionary government seized Taiwan, it has long imposed harsh and brutal white terror on the Taiwanese people. In this way, the Taiwanese people were forced to live in extreme darkness, terror and hunger. On February 28, 1947, the Taiwanese people united to fight against the Kuomintang reactionaries for their survival and freedom of livelihood. At that time, the reactionaries drew a large number of reinforcements from the mainland to suppress them and deceived some of the people in the province, so that the "February 28" struggle suffered a tragic defeat, and more than 10,000 heroic martyrs died in Sacrificed under the enemy's butcher knife. The failure of "February 28" taught us that we must unite the whole province and the whole country to defeat the enemy; and when the struggle is the most intense, if we waver and compromise and have illusions about the enemy, not only will the struggle fail, but we will also suffer more painful sacrifices. This is the bloody lesson of "February 28". \n\nThe history of our country has undergone unprecedented changes. The Taiwan authorities ignored the magnificent development of the motherland for decades and the growing national self-confidence, and seduced the US imperialists to continue to support them in their dying struggle. The US imperialists also took advantage of this opportunity to intensify their interference and control over Taiwan, and at the same time used their lackeys to carry out the conspiracy of demanding "trusteeship" or "independence" in an attempt to completely turn Taiwan into a colony of US imperialism. However, the conspiracy of collusion and collusion between the Taiwan independence opposition and the US imperialism will never save them from their final demise. Today, the revolutionary power of the Chinese people has become unprecedentedly strong. The Chinese people have a brave and invincible People's Liberation Army, and have the support of the Chinese People's Government warmly supported by the people of the whole country and the peace and democracy camp of the world. The 1.3 billion people of the country have determined to make the liberation of Taiwan and the unification of all China the first major task, and are ready to concentrate all their forces to cross the sea and annihilate the monsters and demons who attempt to split Taiwan and liberate Taiwan. \n\nDear compatriots in Taiwan: The Taiwanese people have a revolutionary tradition of opposing Japanese imperialism during the decades of Japanese rule, especially in the "February 28" struggle against the reactionary rule of the Kuomintang, the great heroism they showed, It is worthy of pride and development. Today, we must once again bring into play this glorious revolutionary tradition and the experience of the heroic struggle of "February 28" to smash the conspiracy of Chiang's Taiwan independence opposition and US imperialism. The liberation of Taiwan is bound to be realized, and the day of liberation is approaching, and the time for Taiwan compatriots to get rid of being a colony of US imperialism is also approaching. Therefore, we must take advantage of every opportunity and all possible conditions to try every means to weaken and disintegrate the power of imperialism. We must remember the lessons of "February 28" and unite to oppose the aggressive actions of the Taiwan authorities and US imperialism in Taiwan to withdraw troops, collect grain, and levy taxes. At the same time, we must be good at taking all measures to preserve our strength, strengthen our strength, and prepare to cooperate with the People's Liberation Army to jointly complete the task of liberating Taiwan. \n\nThe martyrs who died heroically in the "February 28" struggle will live forever! \n\nLong live the People's Republic of China! \n\nLong live the Central People's Government! \n\nLong live the People's Liberation Army! \n\nLong live the Communist Party of China! \n\nLong live the Chinese people!!! "
chi_GR.20.a: "Our team is heading towards the sun!"
chi_GR.21: ""Implications""
chi_GR.21.t: ""Implications""
chi_GR.21.d: "Walking on this road, few people know that directly below the road, thousands of builders have worked day and night, working backwards on the schedule. In less than three years, a huge water supply artery was built and water was supplied. Recently, quietly, this "artery" also underwent the last "physical examination" before the river water enters Beijing this fall.\n\nFrom the Daning Reservoir, a channel extends northward. Starting from Yuegezhuang Bridge, it connects to the Lugou Bridge culvert, and goes down to the water supply terminal Tuancheng Lake Reservoir, and enters the West Fourth Ring Road culvert. This is the most demanding and technically difficult section of the main canal of the South-to-North Water Diversion Project in Beijing, with a total length of 12.64 kilometers.\nThe entrance to the culvert is at the southwest corner of the Yongding Road Interchange on the Beijing-Hong Kong-Macao Expressway. "Normally there is water in it, and it can't go down at all. You are in such a hurry! "\n\nLiu Qiusheng, the person in charge of the West Fourth Ring Road culvert project management, took the reporter to the site. "The culvert was completed on November 23, 2007. Since the Huangbi Zhuang Reservoir began to deliver water to Beijing in 2008, it has been running water. It is monitored every day and is running well. This time, in order to welcome the upcoming river water, a major 'physical examination' is required. "We walked down the maintenance shaft step by step, and then down four sections of 15-step iron ladders, and entered the culvert. The inner diameter of the culvert is 3.8 meters, flat at the bottom and arched at the top, wide enough for a car to drive; the culvert body made of reinforced concrete is smooth and seamless, and there is almost no "honeycomb surface"; for the "physical examination", the water in the culvert has been drained, and there is only shallow water accumulation, which is clear and transparent.\n\nThe shouts of maintenance personnel can be heard from time to time, and the dark culvert echoes continuously. They use laser rangefinders to measure distances and mark them. Liu Qiu Sheng knocked on the culvert wall, "The surface of the reinforced concrete is coated with a 5-centimeter-thick protective layer. It is like a 'waterproof coat' that can prevent the steel bars from rusting and losing pressure when they encounter water. The instrument can tell how thick the protective layer is when it is turned on. If it is thin, it must be added quickly!"\n\n"In the next few days, several groups of people will come down to check. Yesterday was Sunday, and the water conservancy experts came to inspect the quality. When they came out, they were all very excited. The quality passed the test! "Liu Qiusheng breathed a sigh of relief.\n\nQiu Wenshun, director of the South-to-North Water Transfer Center of the city, personally experienced the entire process of the West Fourth Ring Road culvert construction. At that time, he was the director of the culvert project department. "It is the first time in the world to dig a long-distance and large-scale water transfer tunnel directly through the city expressway. Above is the subway or railway whizzing by; below is the criss-crossing underground pipelines, water supply and drainage, heat, electricity, communications... From time to time, they will hit the bridge piles blocking the road. It is not easy to achieve 'well water does not interfere with river water'!""
chi_GR.21.a: "(Continued)"
chi_GR.22: ""Implication""
chi_GR.22.t: ""Implications""
chi_GR.22.d: "The most difficult part is when the culvert passes through the Wukesong subway station. The top of the culvert is only 3.67 meters away from the subway station floor. To ensure the normal operation of the subway, experts have given a bottom line: the settlement must be controlled within 5 mm! \n\nThe Fourth Ring Road is full of cars, and the Wukesong subway station below is crowded with pedestrians. Further down - more than 20 meters above the ground, is a busy construction site. The construction adopts the shallow buried dark excavation method, which is a method of dark excavation of various types of tunnel chambers underground close to the surface. The purpose is to "keep the road, keep the traffic, and not disturb the people." \n\n Large machinery could not go down, so every few steps, a vertical shaft more than ten meters deep had to be dug. Workers went down into the shaft and carefully dug holes and shoveled soil with pickaxes and shovels. They used the most primitive methods and tools to advance meter by meter, pouring as they excavated. The construction team divided the subway into three layers, inserted 124 steel pipes 15 meters long and 110 mm in diameter, and then poured cement slurry for reinforcement, creating a "steel backbone" 25 meters long, 16 meters wide, and 3.67 meters high, which firmly supported the huge subway station and firmly controlled the settlement value. During the 190 days of construction, The maximum settlement value monitored was less than 3 mm. \n\nThe West Fourth Ring Road culvert was finally completed successfully with an impressive "zero accident" record, but the real-time monitoring of this major project never stopped. \n\nIn the southwest corner of Wukesong Bridge, on a narrow green belt beside the West Fourth Ring Road, there is a gray iron box about 1 meter high, which is opened every 3 days. Zhihong, a senior engineer at the Municipal Water Science and Technology Research Institute, opened it and looked under it. Under the box was a vertical shaft left during construction, and a large bundle of cables was pulled out from it. \n\nA total of 68 cables! Under the Wukesong Bridge The culvert is equipped with instruments from inside to outside and from top to bottom, and each instrument leads to a cable. When the sensors are connected to the cables one by one, they can give a series of data, such as the stress of steel bars, the strain of concrete, the deformation of surrounding rocks, and so on. Zhihong said that the comprehensive analysis of these data is the "physical examination report" of the Wukesong section of the West Fourth Ring Road culvert. \n\nThere are 13 such safety monitoring points along the West Fourth Ring Road culvert. Zhihong and his colleagues formed a ten-person team, which is responsible for data collection, analysis and reporting. "The project is as solid as a rock, and we must also be on guard!" \n\nThe poet Ye Yanbin once praised it with inspiring verses, "A huge infusion tube has been inserted into the annual rings of Beijing, and this thousand-year-old sacred tree in Beijing is becoming green and verdant..." "
chi_GR.22.a: ""Mom, the water won't stop flowing!""
chi_GR.23: ""Imperial Grain and National Tax""
chi_GR.23.t: ""Imperial Grain and National Tax""
chi_GR.23.d: "Early in the morning, You Wenfu personally took off the sign of "Agricultural Tax Management Section" of his department. This is a small part of their bureau's implementation of the government's "cancellation of agricultural tax" policy. You Wenfu is a staff member of the Yanqing District Local Taxation Bureau in Beijing. He is one of the first people in the country to "take off the sign" in the morning, because it was Beijing that started the pilot cancellation of agricultural tax. Looking at the sign in his hand, which was already somewhat rusted, You Wenfu felt a little emotional.\n\nAfter so many years of work, the thing that impressed You Wenfu the most was that one time when he and his colleagues were collecting taxes in the village, there was an old lady with a difficult family life. She was trembling with a basket of eggs to collect the money for agricultural tax. You Wenfu said to his colleague: "Can we exempt her a little? This should be a poor family." The colleague looked through the list of local poor families and was silent for a while: "It seems that her name is not on it... and even if it is, it can't be exempted, you know this." You Wenfu knew it in his heart, but he couldn't help asking: "Auntie, why is your name not on it? "\n\n"Comrade, I really don't have the money to apply. I heard that to apply for a difficult household, I have to pay several thousand to the village party secretary. You see, I can't even pay this tax, how can I apply. This egg is the last valuable thing in my family. I originally wanted to give it to my grandson on his birthday, but the public grain cannot be reduced. Can you two see if this egg can be used to offset the tax? Things in the village are not valuable, but they are indeed laid by the native chickens raised in my family. They taste delicious!"\n\nYou Wenfu has been working on agricultural tax for many years, and he has been living in torment almost every day. Taking the hairy banknotes from those old farmers who face the loess and back to the sky, he feels that his hands are on fire. Now, he no longer has to suffer this torment. After the abolition of agricultural tax, he should be transferred to work in other departments. He wiped the department card in his hand carefully, wrapped it with cloth and put it in the warehouse. "In the process of national reform, I play the role of a witness." You Wenfu wrote in his diary at night, "I feel very honored. "\n\nSince the reform and opening up, the abolition of agricultural tax is an example of China's tax reform. Over the past 40 years, China has implemented reform measures such as "profit to tax", "tax sharing reform" and "business tax to value-added tax", and tax reform has been continuously deepened. You Wenfu's story is just a microcosm. Soon, countless You Wenfus will take down the signs of their departments all over China."
chi_GR.23.a: "The agricultural tax that has been collected for 2600 years will no longer be collected"
chi_GR.24: "Science and education make the country strong"
chi_GR.24.t: "Science and education make the country strong"
chi_GR.24.d: "In November 1998, Comrade Jiang Zemin visited Russia and delivered a speech on science and technology during his visit to the Novosibirsk Science City, which attracted wide attention from the international community. In this speech, Comrade Jiang Zemin compared science and technology to the "lighthouse" of human wisdom. He said: "Human wisdom is endless. Science and technology, as a shining lighthouse of this wisdom, is constantly shining through layers of mountains to higher peaks through the hard work of countless scientists. "\n\nAs early as 1991, Comrade Jiang Zemin pointed out that we are in an important historical period of transition between the old and new centuries. By 1993, he further pointed out that three years had passed since the 1990s, and only seven years were left for the 21st century. How can we enter the 21st century and how can we develop our country's science and technology? This is an important task that urgently needs to be studied and solved.\n\nIn May 1995, the CPC Central Committee and the State Council made the "Decision on Accelerating the Progress of Science and Technology" and convened a science and technology conference, clearly proposing the strategy of "rejuvenating the country through science and education". Comrade Jiang Zemin delivered a speech at the conference, comprehensively expounding on the content, significance and issues that need to be grasped of the strategy of rejuvenating the country through science and education. The strategic decision of "rejuvenating the country through science and education" is a major development of Deng Xiaoping Theory by the CPC Central Committee with Comrade Jiang Zemin as the core, and is one of the most important strategic deployments for the new century. "The comprehensive implementation of the strategy of rejuvenating the country through science and education, vigorously promoting scientific and technological progress, and strengthening scientific and technological innovation are major events related to the prosperity of the motherland and the rejuvenation of the nation. "It is a great strategic task for the vast number of scientific and technological workers and comrades on all fronts across the country to seize opportunities, strive to make breakthrough progress in scientific and technological progress and innovation, and give greater impetus to the comprehensive promotion of the construction of socialism with Chinese characteristics.\n\nToday, when mankind enters the new century, looking at the rapid development of the world's scientific and technological revolution, we feel that it is so important and urgent to propose and implement the strategy of rejuvenating the country through science and education. Only by firmly grasping the power of science and technology can our cause move further towards glory and the historical mission of the great rejuvenation of the Chinese nation can be truly realized."
chi_GR.24.a: "Thousands of rocks and valleys are not spared, only when you look far away can you know where they are from\n\nHow can you keep the streams, they will eventually return to the sea and become waves"
chi_GR.25: "Beachhead"
chi_GR.25.t: "Beachhead"
chi_GR.25.d: "As soon as he got off the plane, the Chairman felt the warmth of Guangdong. It was just after the Chinese New Year, and most parts of the country were still in the winter, but Guangdong had a constant temperature all year round, and many people on the street wore single clothes. Looking at those people dressed coolly, the Chairman felt that his suit was a little thick and hot.\n\nGaozhou is a county-level city under the jurisdiction of Maoming City. It is located at the transportation hub of western Guangdong and eastern Guangxi. The spring breeze of reform and opening up has already blown here. Every day, countless production and trade are carried out here, and wealth rolls in and out. This is a pilot for financial reform of directly-administered counties in Guangdong Province. The Chairman came to Gaozhou this time to inspect the production situation of small towns in Guangdong.\n\nThe streets have been cleared in advance, and no idle people are staying here. Only At the traffic barrier surrounded by the police in the distance, a few people stretched their necks to watch. They didn't know which big official came to this small place. They only saw a large group of people in suits surrounding a little old man who kept waving his hands and walking and stopping. The reporters beside him followed and took pictures non-stop, and the rumbling of conversation and the sound of shutters rang non-stop. \n\nWhen visiting the garment processing factory, the chairman became interested in a young man who was working hard, and stood aside to watch him work attentively. The young man didn't recognize the chairman, but he knew that the old man next to him was a big shot with a group of officials, so he was very afraid and his hands were shaking. "Oh, don't worry about me, hold the things firmly and do your job well. Look, you have damaged another piece of cloth, you will be fined! "The Chairman patted the young man's shoulder. The young man touched his head shyly, took a deep breath, and then skillfully sewed the waistline of a black semi-finished garment and put it in a basket beside him - there was already a basket full of labor results in it.\n\nIn Guangdong, time is money, efficiency is life, the factory is the heart of Guangdong, and the wholesaler's order is the lifeblood of Guangdong. Guangdong is the largest manufacturing center in the country, a well-deserved beachhead and vanguard of the spirit of reform and opening up, and a synonym for productivity and efficiency. The Chairman felt even more deeply after coming here. In the evening, the Chairman delivered an important speech at the "Three Talks" Education Conference for Leading Cadres in Gaozhou City: "Summarizing the history of the Communist Party of China for more than 70 years; we can draw an important conclusion, that is: the reason why the Communist Party of China has won the support of the people is that the Communist Party of China has always represented the development requirements of China's advanced productive forces, represented the direction of China's advanced culture, and represented the fundamental interests of the vast majority of the Chinese people in various historical periods of revolution, construction, and reform, and through the formulation of correct lines, principles, and policies, it has worked tirelessly to realize the fundamental interests of the country and the people. ""
chi_GR.25.a: "If you have the will to move mountains, you can change them. Why worry about not having your achievements recorded in history?"
chi_GR.26: "Wen Jiabao's proposal"
chi_GR.26.t: "Wen Jiabao's proposal"
chi_GR.26.d: "Beijing is located on the edge of the North China Plain, with mountains to the north and the Central Plains to the south. Here, people's minds and patterns will expand involuntarily, and their horizons will naturally broaden. However, the climate here is not very friendly to some people. After Hu Jintao took office as the chairman, he was busy handling government affairs and visiting various places almost every day. Sometimes staying in Beijing would make this southerner get angry, especially in winter and spring, when the dry air and sand in the wind always made him uncomfortable for several days.\n\nCompared with Hu Jintao's embarrassment, Wen Jiabao, who was born in Tianjin, was much more relaxed. Now he sent a written development plan to the chairman in his office. "I went to some typical areas some time ago, investigated the development situation in various places, and roughly made such a development plan." Wen Jiabao opened the folder and spread it in front of Hu Jintao, "The country can now be roughly divided into four regions, namely the east, the middle, the west and the northeast. These four regions have different situations, different political and economic resources, and different suitable directions for development. The eastern region has good economic development and sufficient momentum, but the circulation of resource elements is a big problem. The western region has backward transportation and weak economic growth momentum. The central region has been neglected for a long time, but it is a region with intensive labor and huge potential market. The northeast region has a good industrial foundation and good natural conditions, but lacks economic growth points for further development. We can implement different development plans in different regions. "\n\n"Good, very detailed. We can start from the east, where the market and production conditions are better. After accumulating some experience, we can work in the central, northeastern and western regions. We can also use the existing economic resources in the eastern region to help tap more domestic market share. "Hu Jintao marked a few places on the document with a pen, "Western regions should open more government projects. Not only will capital not go there actively, but human resources will also be easily lost. The northeast region should first rectify the business environment, otherwise people will not invest there. There has been a relatively depressed situation after the wave of layoffs. The central region should expand local domestic demand, open up a huge sinking market, and encourage migrant workers to return home to start businesses, such as labor export provinces such as Hunan and Henan. If the work in these areas can be done well according to the plan, the economic work can be done well. "\n\nWen Jiabao nodded and responded: "It is still necessary to focus on planning and not interfere too much directly. Local governments lack experience in coordinating such large regional work, and direct intervention can easily lead to management chaos.""
chi_GR.26.a: "Just stop making trouble"
chi_GR.27: "Liu Changyun's reply"
chi_GR.27.t: "Liu Changyun's reply"
chi_GR.27.d: ""Brother, I can take computer classes in this school in Shenzhen. Now I am writing you an email in front of the computer! But I am not very good at typing. This email was actually typed by Teacher Luo. The computers in the school are really big! But compared to the TV at home, the size of this computer monitor is still small. Teacher Luo said that such an ordinary computer can calculate hundreds of thousands of times per second! If I use the computer to help me do my homework, I don’t have to sit at the table at night anymore. (Please remind the parents to urge this child to do homework at night. Teacher Luo.)\n\nBrother, I don’t quite understand what you said about the millennium. Teacher Luo said that after 2000 is the millennium. Does a year have any special meaning? However, Teacher Luo mentioned something called the "millennium bug", which seems to be very scary and will eat up the computer and make it crash. (I will tell her about the millennium bug again later. Teacher Luo.) Computers also need to be "cleaned" and "disinfected". Brother, if you buy a computer in the future, you must always pay attention to cleaning it, so that it will not be eaten by bugs! \n\n Shenzhen doesn't seem to have any special products, but I like the pork trotter rice in the alley in front of the school, and the rice noodle rolls in the shop next door are also delicious. I don't have these things in my hometown, but it's also difficult to see the rice noodle shops in my hometown here. People here are said to drink morning tea for a long time in the morning, but none of my classmates drink tea in the morning. They are mostly Most of them eat breakfast at home or buy bread to eat. I can't understand what many people say here, but fortunately most of my classmates are from other places like me. Everyone speaks Mandarin, and the teachers also speak Mandarin, which is completely different from the school in my hometown. The classmates are very friendly, and there is no bully like the bully in the school in my hometown, probably because everyone is not familiar with each other. I like it here very much. The teachers and classmates are very good, and the equipment in the school is also very new. Brother, please come to visit me when you come to Shenzhen. \n\n (Liu Changyun performs well in school, gets along well with classmates, and has good interpersonal relationships. Parents, please rest assured. Teacher Luo.)""
chi_GR.27.a: "Sweetheart, January 3, 2000"
chi_GR.28: "Meat buns"
chi_GR.28.t: "Meat buns"
chi_GR.28.d: "The train station was bustling with people. As the green train roared into the station and slowly stopped, the people in the train filed out like sardines, along with the large and small bags in their hands or shoulders. Guangzhou Station handles a huge number of passengers every moment, and today, Li Cheng is one of them. Li Cheng took a train all night and came to Guangzhou from his hometown to find a job. Li Cheng was afraid that he would not be able to find a place to stay for a while, so he brought an extra quilt, and if it didn't work, he could find an open space to spend the night.\n\nOriginally, his parents wanted him to go to Guangdong after the Chinese New Year, but Li Cheng couldn't stay there for a moment. He just wanted to find a job in Guangdong as soon as possible, and then earn enough money to buy a house in his hometown county through his own efforts, as well as the bride price for marrying a wife. He didn't want to stay in the village to farm for the rest of his life, even though his family had been honest farmers for generations. When Li Cheng went to the county town as a child, he heard that the city people ate meat buns and drank soy milk every morning, but his family ate meat buns and soy milk all year round. Only a few bites of meat. At that time, Li Cheng vowed to live in the city, and even if he couldn't become a city dweller, he would eat meat buns every day. \n\nAt this time, he lost his way in the huge train station. He timidly asked a staff member for directions. The staff member pointed in a direction and walked away with the walkie-talkie. Li Cheng walked in the direction he pointed, but found that he had arrived in a larger and more crowded area. There were big holes everywhere, but they were blocked and obviously not the exit. He saw a shop not far away, which sold all kinds of food and tea. There were obviously hot buns in the steamer that emitted smoke. Li Cheng walked over quickly, but he stopped immediately when he saw the board with the price written on it. \n\nA bun costs so much money? A bottle of water costs three yuan? Why don't you rob the money! Li Cheng curled his lips, stared at the price board and swallowed his saliva. He touched the banknotes in his pocket again and again, and finally turned and walked away. "
chi_GR.28.a: "A penny can make a hero fall"
chi_GR.29: "Job Hunting"
chi_GR.29.t: "Job Hunting"
chi_GR.29.d: "Wandering in the streets of Guangzhou, although his clothes were already dirty and his hair was shiny with oil, Li Cheng didn't care about these things. Ten days ago, he came out of the train station and was stopped by a man in a leather jacket. The man in the leather jacket said he was hiring people and asked Li Cheng if he wanted to find a job. Li Cheng readily agreed and followed the man into the car with his bags. There were already many young men of his age in the car. Judging from their clothes and luggage, they should also be migrant workers. Not long after, the man in the leather jacket picked up many young men and two girls, and they all sat in the car. The man in the leather jacket finally got in the car, sat in the co-pilot seat, turned around and said to Li Cheng and the others: "We are a factory that makes Huzhuang (clothing). We are short of workers. The boss asked me for people. When you arrive at the department, just ask the boss for wages. Food and accommodation are provided. Just work and get paid. "\n\n"How much is the wage? How to pay? Monthly payment and daily settlement?" asked a local young man next to Li Cheng.\n\n"Don't worry, five cents a day, we'll settle the bill together on the weekend, and you won't lose a penny." The man in the leather jacket waved his hand. Li Cheng didn't quite understand what they were saying, but he understood the word "wages". Seeing that no one else asked any more questions, it seemed that there shouldn't be any problem.\n\nThe factory was in a very remote place, but it was barely in the city - or the urban-rural fringe. After entering, the man in the leather jacket took a car and left, leaving the group of them waiting in the factory. Soon, a man who looked like the boss came. The man was wearing a flowered shirt, a pair of sunglasses, and a black leather bag under his armpit. The boss took them into the factory and handed them over to a man with a sharp-nosed monkey face and thunder god face, and then took a car and left, taking a girl who came with them.\n\nLi Cheng couldn't remember how many days he had worked in there. He was working on the sewing machine every day, from morning to night, and could only rest for a few minutes when he went to eat. The food was Li Cheng's. The most disgusting thing I have ever eaten in my life. Li Cheng endured all of this, but when he was about to pay the bill, the guy with a pointed chin and monkey cheeks called a few ferocious security guards to beat him up. Li Cheng followed the delivery truck out of the factory that night, but the price was losing all his luggage - to be precise, a few quilts. \n\nHe went to the police station to report the police, but the man who looked like a policeman just looked up at him and told him to go back and wait for the result. Li Cheng can only wander the streets now. He heard that there is a place called the labor market where he can find a decent job, so he plans to try his luck there. But it takes a lot of time to walk there, and he may have to sleep on the street for a few days. However, his stomach is already very hungry. Li Cheng never dreamed that after coming to the city for more than ten days, not only did he not eat meat buns, but he was also beaten and lost all his luggage by the way. "
chi_GR.29.a: "Is this Guangdong?"
chi_GR.30: "Work?"
chi_GR.30.t: "Work?"
chi_GR.30.d: "I don't know how many days have passed. Li Cheng wandered around Guangzhou, stopping and starting, and finally arrived at the labor market in Shiling Town, Guangzhou. During these days, he found that a store with a white-bearded foreign old man printed on it would throw some food into the trash can at the back door at night. When he opened the oil paper bag, he found that the food was some cold fried chicken legs and the like, and they were not even spoiled yet. Do people in the city waste food like this? Li Cheng sat by the trash can, feasting on his food while falling into deep thought. If any store in the city can throw away chicken legs directly, then what is the point of rummaging through the trash can?\n\nLi Cheng slept in the park or under the bridge at night. Although it was winter, the weather in Guangdong was really warm, and Li Cheng could fall asleep peacefully without covering himself with a quilt. The only bad thing was that there were many The big trucks were speeding on the road, making an outrageous noise that went straight into people's hearts and made people unable to sleep. Once, Li Cheng got up in the middle of the night to urinate and saw a couple in well-dressed clothes making love fiercely not far away. When Li Cheng saw clearly what the two were doing, he ran away in shame. Damn, city people are really having fun! How shameless! \n\nIn front of the Shiling Town Labor Market is an overpass. Li Cheng crossed the road and finally saw the words "Shiling Town Occasional Work Market". At this time, there were already crowds of people there, and many heads crowded in, some long, some short, some black, some white, forming a spectacular picture. It seems that these are all people looking for work. Li Cheng remembered what his father once said to him. \n\n"Cheng, just remember that good things in the world have to be sought by people, and it must not be a good thing if everyone comes to you. "\n\nThe example of the man in leather jacket at the train station couldn't be better. Li Cheng regretted not keeping his father's advice in mind. Now, Li Cheng also wanted to go into the crowd to find something to do.\n"
chi_GR.30.a: "This is Guangdong."
chi_GR.31: "Textile Factory"
chi_GR.31.t: "Textile Factory"
chi_GR.31.d: "The textile workshop was buzzing with the sound of textile workers who were concentrating their attention on their work. Li Cheng had only been working for a week, but he was already a skilled textile worker. He could sew quickly and well, and he could endure hardships. He worked hard when others were chatting, when others were washing their feet, and when others were resting. The foreman was a middle-aged woman, a local, who spoke with a heavy Cantonese accent, wore a ponytail, and her last name was Chen. Foreman Chen was very impressed with the new guy and sometimes would call him The daughter shared some of the soup with Li Cheng. Li Cheng also felt that this foreman was very kind and never talked about her behind her back with other workers. \n\nAt first, Li Cheng stayed in the labor market for a few days. Because he was honest, not good at talking, and unfamiliar with the place, he was a little timid and could not find a "boss" willing to hire him. When foreman Chen found him, he was wolfing down the steamed buns given to him by a fellow worker from the same hometown. \n\n"You two, do you want to work? "\n\nLi Cheng was very satisfied with his dormitory. Although it was small, poorly ventilated, and had almost no light, it at least gave him a foothold in Guangzhou. This was the low-rent house that Chen the foreman found for him. The person in charge of the building was a little girl who was in junior high school. It was said that she was the illegitimate daughter of the owner. For Li Cheng, this room was very competent as a place to rest. Although the sound insulation was a bit poor - he could always clearly hear the sound of flushing toilets, the coughing of neighbors, and the sounds of men and women making love - it was enough for sleeping and resting. Today, Li Cheng has changed from a down-and-out person wandering the streets to a self-reliant worker. His father once said that labor was the most glorious, and now Li Cheng is also a glorious son."
chi_GR.31.a: "Boss, give me three meat buns!\nNo, five!"
chi_GR.32: "Hell on Earth"
chi_GR.32.t: "Hell on Earth"
chi_GR.32.d: "Crying, shouting, screaming, collapse, footsteps... When Hu Jintao really arrived at the earthquake disaster site, the mess in front of him made him feel heartbroken. Some residential buildings, factory workshops and dormitories in this town were severely damaged in the earthquake, some completely collapsed, and some twisted and deformed. Soldiers of a certain airborne unit and firefighters of Henan Public Security were using various rescue equipment to search for survivors. A bloody person had just been carried out of the ruins by firefighters. Hu Jintao quickly climbed to the top of the ruins to inspect the rescue site, anxiously asking about casualties and the treatment of the wounded.\n\n"Comrade, keep breathing, don't fall asleep, hold on!" Hu Jintao painfully exhorted beside the wounded covered in blood and dust, and then he was squeezed away by the rescue workers on the side.\n\n"The top priority is still to save lives. As long as there is a glimmer of hope, we must do everything possible to rescue. Measures should be taken to ensure that the rescue team enters all villages as soon as possible on the basis of entering all towns. "While Hu Jintao was giving instructions to the staff, a little girl rashly walked into the makeshift tent. The staff nearby wanted to take the little girl away in embarrassment. When Hu Jintao saw her, he walked up to her and squatted down.\n\n"Little girl, what's wrong? "\n\n"Grandpa, my mother hasn't been found yet... Is she still alive..." The little girl couldn't stop crying and sobbed softly. Her arm was injured and was now bandaged with a simple bandage.\n\nLooking at the sobbing girl in front of him, Hu Jintao couldn't help but feel sad. Yes, it has been a day and a half since the earthquake, and the "golden rescue time" has passed. If the buried people have not been found, they are likely to have... But how can he say this? "Your mother is dead, we are very sorry", is this kind of nonsense what he should explain to the people? In the face of a child who asks for help from himself, should he respond with such lines? Hu Jintao suppressed his grief, gently hugged the little girl, and let her cry in his arms.\n\n"It will be fine, everything will be fine. This is the situation we all face. We must continue to persevere..." He whispered in the girl's ear, his voice gentle and firm. "
chi_GR.32.a: "Suffering will eventually pass"
chi_GR.33: "A nation thrives in times of adversity"
chi_GR.33.t: "A nation thrives in times of adversity"
chi_GR.33.d: ""You're here." Seeing Wen Jiabao, Hu Jintao nodded to him.\n\n"I just went to the disaster area. The damage was very serious. The villages more than ten kilometers away collapsed." Wen Jiabao thought for a while, "Chengdu suffered heavy damage, and other neighboring provinces also suffered to varying degrees."\n\n"How are the children? If the playground is not seriously damaged, let the residents evacuate there."\n\n"I have already given instructions. I went to several schools before I came. The damage was more serious than I expected. Although the teaching buildings were generally built low, the children were concentrated in the classrooms, and the evacuation was not timely." Wen Jiabao paused, "Most of the buildings were not up to standard, which led to repeated collapses after the disaster. I don't know how many survivors under the ruins were crushed to death..."\n\nThis is really an experience gained with blood and tears. Hu Jintao closed his eyes. "We will talk about tracing the responsibility later. Let's transfer the People's Liberation Army to the disaster relief first. After we go back, we have to review the building standards, especially those in the southwest. We must strictly control them. Human lives are at stake!" Wen Jiabao nodded.\n\nThe work has to continue. There are still people buried underground, there are still areas for optimization in the transfer of materials, and the disaster relief funds have not been signed yet... Hu Jintao waved to Wen Jiabao, and the two went to their next venue according to the agenda.\n\nThe sky looked gray and yellow due to the dust caused by the earthquake. The earth under our feet, which was roaring and screaming a few days ago, was now silent. A day is still 24 hours. In the city in the distance, a man is dying. A store next door is playing karaoke; opposite is playing with children. Two people are laughing wildly upstairs; there are also sounds of playing cards. A woman on the boat in the river is crying for her dead mother, and a girl in the tent is crying for her disappeared family. The earth rotates as usual, and the sun still rises in the east and sets in the west."
chi_GR.33.a: "Life must go on"
chi_GR.34: "Interview?"
chi_GR.34.t: "Interview?"
chi_GR.34.d: "Gu Qingping was looking for a job alone in Shanghai. After submitting her 40th resume this month, she finally received an interview notice email from a little-known company. On the day of the interview, she took the bus to the company's location, found a secluded place nearby, put on a suit and high heels, and hastily put on makeup. When she walked into the building that day, she felt her heart beating violently. She didn't have time to pay attention to the difficulty of controlling the high heels or the trembling of the ends of her fingers due to nervousness.\nThe so-called company is actually a combination of several residential houses, with some young people busy inside. The interviewer is the boss of the company - a young man wearing glasses, who looks to be in his twenties, dressed neatly and capablely. Gu Qingping even suspected that the boss was not even older than herself.\n"You don't need to be so formal. I read your resume and thought that such an excellent person would have been taken away by other big companies long ago. I didn't expect that you would condescend to come to us. You can just call me Lao Lan, that's what they all call me. "The boss looked very kind and looked through Gu Qingping's resume. "We just started a business here not long ago. We are engaged in cultural creativity. The company's income is unstable and the salary is low, but it includes food and accommodation. However, it should be inconvenient for you as a woman to live with us rough guys. Then, like other female employees, we will give you more salary to rent a house. We started from scratch and have many accounts to deal with. They are impatient and urgently need an accountant. If you are satisfied, you can come to work tomorrow. Here is the contract. You can take your time to read it when you go back. "\n"Okay...Okay, is there anything I need to pay attention to when I join the company?" Gu Qingping took the big bag of candy that Lao Lan stuffed into her, tidied her hair and asked.\n"We don't have enough computers here. Do you have a laptop? If not, I will pay for you to buy one. You can go to the electronics city today to pick one. Oh, it's time for dinner now, so just call them out to hold an induction ceremony for you. Hey, hey! I'm going out to eat now, to welcome our new accountant! "\nGu Qingping hurriedly packed up the documents and went downstairs with the cheering crowd. She was a little distracted during the whole dinner. Was it really the right choice for her to agree to join the company so hastily? Two girls held her hands and chatted with her enthusiastically. The boss, Lao Lan, was chatting with a few guys at another table, laughing from time to time. Looking at the group of noisy but kind young people in front of her, she felt that this might be the right choice."
chi_GR.34.a: "Isn't this what a team is?"
chi_GR.35: "China's Unification"
chi_GR.35.t: "China's Unification"
chi_GR.35.d: ""Lao Li, have you seen the news? Taiwan and Mongolia have built many factories since their return. Yesterday, my daughter saw a lot of cheese products from Outer Mongolia in the supermarket! She bought a bag and my wife and I tried it. It was delicious! How come the Mongolians are so good at making milk?"\n\n"Don't say it. My kid is already a grown man, but he still plays computer games all day long. He said he wanted to play game dungeons with his Taiwanese friends. Hey, this Taiwanese is also surfing the Internet in China!"\n\n"It's not easy. These two places have finally returned to our country. I remember that the United States bombed our embassy in the 1990s. The newspapers said every day that there were protests everywhere! Let's see who dares to bomb our embassy now!"\n\n"Don't even talk about the embassy. Do you know Lao Deng in our community, the bald one? I heard that his son Xiao Deng is going to be an engineer for the big bridge construction project in Taiwan! In the past, there were American aircraft carriers sailing in that sea from time to time, but now a bridge has been built! "\n\n"Build a bridge? How big a bridge would it be to cross such a large sea?"\n\n"Hey, our country wants to build a bridge, even if it is built to the sky! We have to go and see the bridge built by Xiao Deng after it is completed."\n\n"Hey, what are you two talking about here? Tell me too."\n\n"Hey, we are talking about Lao Deng's son going to Taiwan to build a bridge. Let's go and see it together after it is completed."\n\n"Haha, that's great. I will go there too, and bring Lao Zhang with me! After all...""
chi_GR.35.a: "You can go wherever you want.Our country has been unified."

chi_GR.37.t: "Visiting the Opening Ceremony"
chi_GR.37.d: ""Hey, old man, getting a ticket to the Beijing Olympics is harder than getting an appointment with a specialist at the hospital! It almost cost us a year's worth of groceries!" Wang Aixia clutched the three tickets tightly, her palms sweaty enough to soak them. Her husband, Li Jianguo, carrying a water bottle and snacks, stood tall at the packed security checkpoint. "What do you know, womanly opinion! This is a once-in-a-century event! Qiangzi can tell his classmates later that we were at the Bird's Nest and the Water Cube!" He turned to his son and said, "Qiangzi, what we're going to see later is the big gala with Beibei and Jingjing!" Qiangzi, who was playing Snake with his head down, suddenly looked up: "Dad, it's the Fuwa! What Beibei and Jingjing? You were even welcoming Nini! Besides, it's called the opening ceremony, not the big gala!" Li Jianguo was startled by his son's choking words and said sheepishly, "That's what I mean... I heard they're going to light a huge torch later, taller than the chimney in our factory's boiler room!" As they passed through the rigorous security checkpoint and truly entered the magnificent "Bird's Nest," the family of three fell silent. The sheer size of the venue and the thunderous roar of the crowds made Wang Aixia instinctively grab her husband's arm. As the countdown began to sound on the giant "can" and the dazzling footprints of fireworks marched along the central axis, Li Jianguo's mouth opened, forgetting to close it. Especially when the five-star red flag slowly rose to the sound of the "March of the Volunteers" and the audience of tens of thousands sang in unison, this man who had worked in the factory for half his life suddenly wiped his eyes fiercely with the back of his hand. "Dad, are you crying?" "Nonsense! It's... it's the bright lights!" Li Jianguo cleared his throat, trying to regain his dignity as the head of the family. "I mean, this 'Beiao'... is really well done." After the show, as the crowd flowed out, Qiangzi was still immersed in excitement: "It's so cool! I'm sure no one in our class has seen more of it than me! Even Bruce Lee's songs are out! Wang Aixia, forgetting to worry about the ticket price, muttered, "I'll have to have a good talk with Aunt Zhang next door later. She can't see the grandeur of this in front of the TV..." Li Jianguo said little, simply turning back and glancing at the giant Bird's Nest, still glowing in the night. He thought to himself, I'll call my mother back home tomorrow...""
chi_GR.37.a: ""I has seen the world today.""
chi_GR.38.t: "Manned space flight"
chi_GR.38.d: "For the first time ever, the workshop director stopped production that afternoon. The 21-inch Changhong TV was moved to the center of the yard, its antenna dangling toward the southeast. Li Daqiang and his fellow workers brought stools and sat around, muttering quietly, "This is even more grand than watching Sun Wukong ascend to heaven in Journey to the West." "What Sun Wukong? That's Yang Liwei!" "Our country's first person is going to be sent into space on a rocket!" his apprentice, Xiao Chen, excitedly corrected him. Li Daqiang uttered an "Oh," still feeling a bit surreal about the idea—putting a person inside that "big firecracker" and sending it off into space with a whoosh. On TV, the rocket, like a giant white pencil, stood steady on the Gobi Desert. As the countdown began, the entire yard fell silent, and Li Daqiang instinctively clenched his work gloves around his knees. "Ignition! Takeoff!" Flames erupted, and the rocket slowly rose, then accelerated, trailing a beautiful arc into the blue sky. Li Daqiang craned his neck until the screen announced "rocket and ship separated," only then realizing he had been holding his breath. "Success! Old Li, Yang Liwei is truly in space now!" " the foreman shouted, waving his hat. Someone took the lead, but firecrackers crackled across the factory yard, like an early New Year's Eve. On his way home, Li Daqiang made a point of waiting for his son at the elementary school gate. The child burst out like a cannonball, "Dad! Can Yang Liwei see the Great Wall from his spacecraft?" "Yes! Why not?" Li Daqiang lifted his son onto his shoulders and pointed toward the distant, sunset-filled sky. "He's soaring high above the clouds. Didn't the teacher tell you? Our country will build a space station called Tiangong someday, and anyone can go up there and see it." At night, he lay in bed, gazing out the window at the distant stars, nudging his wife with his elbow: "Hey, when our boy grows up, will he be able to..."
chi_GR.38.a: "Buy a ticket to go up space!"

chi_GR.100.t: "Foreign investment into our country"
chi_GR.100.d: "After we joined the World Trade Organization, the continuous influx of foreign investment has driven the rapid development of the economy."
chi_GR.100.a: "The more the better..."
chi_GR.100.b: "Foreign investment? Forget it!"

 
chi_GR.110.t: "Foreign companies cause local companies to close down"
chi_GR.110.d: "After integrating into the world economic system, the high welfare and high wages of foreign-funded enterprises have led to the bankruptcy of some local enterprises..."
chi_GR.110.a: "Protect our local businesses!"
chi_GR.110.b: "This is the market economy..."
chi_GR.110.c: "Temporary strengthening of the social security system"

chi_GR.120.t: "Fossil fuel power plants demand lifting of restrictions"
chi_GR.120.d: "As the economy develops, our demand for energy is increasing. Many fossil fuel power plants are demanding the lifting of relevant regulatory restrictions to meet the growing energy demand. Today, a minister with a strong business background found President Hu and proposed a bill "favorable to the development of the energy industry." Of course, the price is serious environmental pollution... \n\n President Hu can certainly reject this rude minister, but there will be more and more people with similar purposes in the future. If these demands are not met, the resentment of some people will accumulate more and more..."
chi_GR.120.a: "Get lost"
chi_GR.120.b: "turn a blind eye"
 
chi_GR.200.t: "Resetting the balance of power"
chi_GR.200.d: ""
 
chi_GR.300.t: "TikTok"
chi_GR.300.d: "For the first time, the TikTok has taken the top spot - it has been in the lead for most of the past few months and is the only non-US website to occupy a place in the top 10 in Cloudflare's ranking. This will undoubtedly play a positive role in dismantling long-standing stereotypes and prejudices."
chi_GR.300.a: "The wall of prejudice is crumbling"
chi_stop_war.350.t: "Proposes adding more members to the Security Council"
chi_stop_war.350.d: "[From.GetName] believes the current world situation cannot be resolved without the coordination of [target_united_nations_members_selected.GetNameWithFlag], therefore proposes that this country become a new member of the UN Security Council."
chi_stop_war.350.a: "Where do we sign?"
chi_stop_war.350.b: "This is absurd!"
 
chi_GR.500.t: "US arms sales to Taiwan"
chi_GR.500.d: "Recently, [USA.Getleader] announced a new round of arms sales to the Taiwan authorities in an attempt to strengthen their power so that they can "resist unification by force.""
chi_GR.500.a: "Send a diplomatic protest!"
chi_GR.500.b: "Just wait, I'll send tanks to send you all to the sky!"
chi_GR.500.c: "Conduct counter military exercises"

chi_GR.501.t: "The United States supports separatist forces"
chi_GR.501.d: "Recently, the [USA.Getleader] government has clearly provided a lot of support to various separatist forces, and the risk of various terrorist activities is increasing."
chi_GR.501.a: "Send a diplomatic protest!"
chi_GR.501.b: "Eliminate American hegemony!"
chi_GR.501.c: "Conduct counter military exercises"
 
chi_GR.502.t: "The United States hypes up the "China threat theory""
chi_GR.502.d: "Recently, the [USA.Getleader] government has been hyping up the "China Threat Theory" in various media outlets, which it has been hyping for many years."
chi_GR.502.a: "Send a diplomatic protest!"
chi_GR.502.b: "Issuing peer reports to fight back"
chi_GR.502.c: "Eliminate American hegemony!"

chi_GR.503.t: "The United States launches a public opinion attack"
chi_GR.503.d: "Recently, the [USA.Getleader] government has controlled and bought off some of our media, which has resulted in a large number of false statements being published to confuse the public."
chi_GR.503.a: "Damn [USA.Getleader]"
chi_GR.503.b: "Delete these rumors!"
chi_GR.503.c: "Carry out a counterattack"
 
chi_GR.504.t: "The United States restricts scientific research cooperation"
chi_GR.504.d: "Recently, the [USA.Getleader] government announced a new round of restrictions on scientific research cooperation projects for our scientific community."
chi_GR.504.a: "Damn [USA.Getleader]"
chi_GR.504.b: "We require independent research!"

chi_GR.505.t: "The United States promotes capital repatriation"
chi_GR.505.d: "Recently, the [USA.Getleader] government announced a series of measures to promote the reshoring of its manufacturing industry and required US companies to close factories in China."
chi_GR.505.a: "Damn [USA.Getleader]"
chi_GR.505.b: "Replace with similar domestic companies"
 
chi_GR.550.t: "[FROM.GetName] chooses to support us"
chi_GR.550.d: "The [FROM.Getleader] government has announced that it will abandon its original position and choose to support our side."
chi_GR.550.a: "A Wise Choice"

chi_GR.551.t: "[FROM.GetName] chooses not to support us"
chi_GR.551.d: "The [FROM.Getleader] government has announced that it has abandoned its original position and has chosen not to support our side."
chi_GR.551.a: "They will regret it..."

chi_GR.552.t: "[FROM.GetName] chooses neutrality"
chi_GR.552.d: "The [FROM.Getleader] government has announced that it has abandoned its original position and has chosen to support neither us nor our opponents."
chi_GR.552.a: "Watching the fire from the other side of the river?"

chi_GR.553.t: "[FROM.GetName] is destroying our order"
chi_GR.553.d: "The [FROM.Getleader] government has recently been openly attacking the legitimacy of our order."
chi_GR.553.a: "Sanction these idiots!"
chi_GR.553.b: "It's time to go to war!"
chi_GR.553.c: "Diplomatic protests will suffice..."

chi_GR.697.t: "[ROOT.GetName] announces its dominance of the world order"
chi_GR.697.d: "After defeating China and the United States, [ROOT.Getleader] officially announces that [ROOT.GetName] will dominate the future world order."
chi_GR.697.a: "Interesting..."
chi_GR.698.t: "[ROOT.GetName] announces the renunciation of hegemony"
chi_GR.698.d: "[ROOT.Getleader] announces the renunciation of hegemony and promises that [ROOT.GetName] will never seek new global hegemony in the future, and will actively fight against countries that attempt to dominate to the end."
chi_GR.698.a: "Interesting..."

chi_GR.699.t: "[ROOT.GetName] announces the renunciation of hegemony"
chi_GR.699.d: "[ROOT.Getleader] announces the renunciation of hegemony and promises that [ROOT.GetName] will never seek new global hegemony in the future, and will actively fight against countries that attempt to dominate to the end."
chi_GR.699.a: "Very interesting..."
 
chi_GR.700.t: "[CHI_Wu_WenJun.GetName] passed away"
chi_GR.700.d: "[?global.date.GetDateString], the winner of the first National Highest Science and Technology Award, the famous mathematician [CHI_Wu_WenJun.GetName], unfortunately passed away in Beijing due to illness. He was 98 years old."
chi_GR.700.a: "The whole country is in grief"
 
chi_GR.701.t: "[CHI_Yuan_LongPing.GetName] passed away"
chi_GR.701.d: "[?global.date.GetDateString], winner of the Medal of the Republic, academician of the Chinese Academy of Engineering, director of the National Hybrid Rice Engineering Technology Research Center, and former vice chairman of the Hunan Provincial Committee of the Chinese People's Political Consultative Conference [CHI_Yuan_LongPing.GetName] died in Changsha due to illness at the age of 91. "
chi_GR.701.a: "The whole country is in grief" #People are like seeds, we must be good seeds

chi_GR.702.t: "[CHI_Wang_Xuan.GetName] passed away"
chi_GR.702.d: "[?global.date.GetDateString], a famous scientist known both at home and abroad, the founder of Chinese computer Chinese character laser typesetting technology, an outstanding social activist, a close friend of the Communist Party of China, Vice Chairman of the Tenth National Committee of the Chinese People's Political Consultative Conference, Vice Chairman of the Central Committee of the Jiusan Society, academician of the Chinese Academy of Sciences, academician of the Chinese Academy of Engineering, and professor of Peking University, Comrade [CHI_Wang_Xuan.GetName], died of illness in Beijing at the age of 70."
chi_GR.702.a: "The whole country is in grief"
 
chi_GR.703.t: "[CHI_Wang_YongZhi.GetName] has passed away"
chi_GR.703.d: "[?global.date.GetDateString], academician of the Chinese Academy of Engineering, the first chief designer of China's manned space program [CHI_Wang_YongZhi.GetName], died in Beijing due to illness at the age of 92."
chi_GR.703.a: "The whole country is in grief"
 
chi_GR.704.t: "[CHI_Ye_DuZheng.GetName] passed away"
chi_GR.704.d: "[?global.date.GetDateString], Academician [CHI_Ye_DuZheng.GetName], a famous meteorologist, one of the main founders of modern meteorology in China, former vice president of the Chinese Academy of Sciences, and former director of the Institute of Atmospheric Physics of the Chinese Academy of Sciences, died of illness in Beijing at the age of 98."
chi_GR.704.a: "The whole country is in grief"

chi_GR.705.t: "[CHI_Min_EnZe.GetName] passed away"
chi_GR.705.d: "[?global.date.GetDateString], a famous petrochemical catalyst expert in my country, academician of the Chinese Academy of Sciences, academician of the Chinese Academy of Engineering, senior consultant of Sinopec Petrochemical Research Institute [CHI_Min_EnZe.GetName], professor-level senior engineer, died in Beijing due to illness at the age of 93."
chi_GR.705.a: "The whole country is in grief"

chi_GR.706.t: "[CHI_Xie_JiaLin.GetName] passed away"
chi_GR.706.d: "[?global.date.GetDateString], academician of the Chinese Academy of Sciences, internationally renowned accelerator physicist, winner of the 2011 National Highest Science and Technology Award, former deputy director of the Institute of High Energy Physics of the Chinese Academy of Sciences [CHI_Xie_JiaLin.GetName], died of illness in Beijing at the age of 96."
chi_GR.706.a: "The whole country is in grief"
 
chi_GR.707.t: "[CHI_Zheng_ZeMin.GetName] passed away"
chi_GR.707.d: "[?global.date.GetDateString], academician of the Chinese Academy of Sciences, academician of the Chinese Academy of Engineering, winner of the National Highest Science and Technology Award, researcher at the Institute of Mechanics of the Chinese Academy of Sciences [CHI_Zheng_ZeMin.GetName], died in Beijing due to illness at the age of 97."
chi_GR.707.a: "The whole country is in grief"

chi_GR.708.t: "[CHI_Wang_XiaoMo.GetName] passed away"
chi_GR.708.d: "[?global.date.GetDateString], an outstanding member of the Communist Party of China, a time-tested loyal fighter of communism, a famous radar expert in my country, a pioneer and founder of the early warning aircraft industry, a winner of the highest national science and technology award, and an academician of the Chinese Academy of Engineering, Comrade [CHI_Wang_XiaoMo.GetName], died in Beijing due to illness at the age of 84."
chi_GR.708.a: "The whole country is in grief"

chi_GR.709.t: "[CHI_Zhang_CunHao.GetName] passed away"
chi_GR.709.d: "[?global.date.GetDateString], an outstanding member of the Communist Party of China, an outstanding member of the China Democratic League, former secretary of the Party Leadership Group and the second and third director of the National Natural Science Foundation of China, former director of the Dalian Institute of Chemical Physics of the Chinese Academy of Sciences, a famous physical chemist, the founder and pioneer of my country's high-energy chemical laser field, one of the founders of the discipline of molecular reaction dynamics, winner of the National Highest Science and Technology Award, and senior academician of the Chinese Academy of Sciences, Comrade [CHI_Zhang_CunHao.GetName], died in Beijing due to illness at the age of 96."
chi_GR.709.a: "The whole country is in grief"
 
chi_GR.710.t: "[CHI_Cheng_KaiJia.GetName] passed away"
chi_GR.710.d: "[?global.date.GetDateString], Academician [CHI_Cheng_KaiJia.GetName], a member of the Chinese Academy of Sciences and winner of the "Two Bombs" award, died of illness at the age of 101 at Beijing 301 Hospital after unsuccessful medical treatment."
chi_GR.710.a: "The whole country is in grief"
 
chi_GR.711.t: "[CHI_Yu_Min.GetName] passed away"
chi_GR.711.d: "[?global.date.GetDateString], an important promoter of the reform and development of my country's national defense science and technology, an academician of the Chinese Academy of Sciences, a hero of the "two bombs and one satellite", a winner of the highest national science and technology progress award, and a reform pioneer [CHI_Yu_Min.GetName] died in Beijing at the age of 93."
chi_GR.711.a: "The whole country is in grief"

chi_GR.712.t: "[CHI_Qian_XueSen.GetName] passed away"
chi_GR.712.d: "[?global.date.GetDateString], famous aerospace scientist, senior academician of the Chinese Academy of Sciences and the Chinese Academy of Engineering, vice chairman of the 6th, 7th and 8th National Committee of the Chinese People's Political Consultative Conference, and founder of China's aerospace industry [CHI_Qian_XueSen.GetName] passed away in Beijing at the age of 98."
chi_GR.712.a: "The whole country is in grief"

