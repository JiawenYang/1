chi_crisis.6.t: "Corporate bankruptcy"
chi_crisis.6.d: "Due to the impact of the economic crisis, China's stock market plunged, and the assets of a large number of securities companies and enterprises evaporated overnight."
chi_crisis.6.a: "Oh my god..."
chi_crisis.7: "Our country has entered a state of war"
chi_crisis.7.t: "Our country has entered a state of war"
chi_crisis.7.d: "As our country enters a state of war with the United States, we no longer have to restrain ourselves with slogans of peace. We must win this war!"
chi_crisis.7.a: "China will win!"
chinawar.1: "The United States launched a war of aggression against our country"
chinawar.1.t: "The United States launched a war of aggression against our country"
chinawar.1.d: "After the United States lost its absolute hegemony, the humiliated President [USA.GetLeader] bypassed the Congress and forcibly launched a war of aggression against our country. He also established a "United Nations Army" with his so-called NATO allies to march towards our country. The Party and the country have reached the most critical moment. We must win this war of national defense!"
chinawar.1.a: "The first battle is the decisive battle, and the outcome will be decided in one battle!"
chi_crisis.20.t: "Our country suffered from severe sandstorms"
chi_crisis.20.d: "Recently, a very destructive and severe sandstorm has occurred in many places. It is speculated that the cause is due to the gradually deteriorating natural environment in Mongolia."
chi_crisis.20.a: "The power of nature..."
chi_crisis.100.t: "Countries around the world are hit by the financial tsunami"
chi_crisis.100.d: "Affected by the global financial crisis caused by the United States, the global capital chain has tightened rapidly, financing costs have risen sharply, corporate production has slowed down significantly, and the world's real economy has suffered a serious impact. The stock markets of developed countries represented by Japan, Britain, and France have all plunged sharply, and the number of stocks that have fallen by the limit within three days has exceeded 70%. Developing countries whose main foreign trade content is the export of consumer goods or resources have also been implicated. India, Russia and other countries have announced export tariff reduction policies, but the effect is poor."
chi_crisis.100.a: "Is the global economy finished?"
chi_crisis.201.t: "The world economy is under attack"
chi_crisis.201.d: "In a seemingly ordinary transaction, the accumulated systemic risks accidentally erupted at this moment, and the world economy inevitably faced some shocks..."
chi_crisis.201.a: "Bad luck..."
chi_crisis.202.t: "The world economy is in decline"
chi_crisis.202.d: "Debt ratio, leverage ratio, bad debt ratio... problems are ignored intentionally or unintentionally one after another. And at this moment, people once again realize their power to impact the economy. And it is obvious that this will not be the last time..."
chi_crisis.202.a: "Bad luck..."
#event
chi.1: "The 16th National Congress of the Communist Party of China is held"
chi.1.t: "The 16th National Congress of the Communist Party of China was held"
chi.1.d: "The 16th National Congress of the Communist Party of China was held in Beijing from November 8 to 14, 2002. There were 2,114 official delegates and 40 special invited delegates, representing more than 66 million members of the Party.\n\nAccording to the Central Committee's regulations, the delegations attending the 16th National Congress of the Communist Party of China added the central enterprise system delegation and the central financial system delegation. This was the first time that the central enterprise system and the central financial system formed a separate delegation to attend the National Congress of the Party. Compared with the 36 delegations of the 15th National Congress, the number of delegations of the 16th National Congress increased to 38.\n\nIn addition, members, alternate members and members of the 15th Central Committee of the Communist Party of China who were not delegates to the 16th National Congress; members of the former Central Advisory Committee who were not delegates to the 16th National Congress and special invited delegates; and representatives of the 16th National Congress and special invited delegates. Some old comrades in the party and other relevant comrades, a total of 284 people attended the conference. The conference also invited non-party members who served as vice chairpersons of the Standing Committee of the National People's Congress and vice chairpersons of the National Committee of the Chinese People's Political Consultative Conference, non-party members who served as vice presidents of the state, vice chairpersons of the Standing Committee of the National People's Congress, and vice chairpersons of the National Committee of the Chinese People's Political Consultative Conference, leaders of the central committees of various democratic parties, the All-China Federation of Industry and Commerce, and non-party members, as well as non-party members in Beijing among the Standing Committee members of the National People's Congress and the National Committee of the Chinese People's Political Consultative Conference, and some ethnic minorities and religious circles, a total of 152 people attended the opening and closing ceremonies of the conference as guests. \n\nThe theme of this conference is: hold high the great banner of Deng Xiaoping Theory, fully implement the important thought of "Three Represents", carry forward the past, keep pace with the times, comprehensively build a well-off society, accelerate the promotion of socialist modernization, and strive to create a new situation in the cause of socialism with Chinese characteristics. "
chi.1.a: "applause"
chi.2: "The Congress elected members of the 16th Central Committee"
chi.2.t: "The Congress elected members of the 16th Central Committee"
chi.2.d: "The 16th National Congress of the Communist Party of China elected the Central Committee and the Central Commission for Discipline Inspection. A group of young and capable leaders with both moral integrity and ability entered the new Central Committee, which fully reflects that our party is prosperous and has successors. In order to promote the transition of the old and new leadership of the party, and to ensure the long-term stability and vitality of the party and the country, a group of comrades who held central leadership positions and made major contributions to the party's cause withdrew from the Central Committee, showing their noble character and foresight and foresight in their loyalty to the party's cause.\n\nAfter the election of the plenary session of the Central Committee, Comrade Hu Jintao, a member of the Standing Committee of the Political Bureau of the Central Committee, was elected as the General Secretary of the Central Committee of the Communist Party of China. The position of General Secretary of the Central Committee of the Communist Party of China has been transferred from Comrade Jiang Zemin to Comrade Hu Jintao, and the National People's Congress to decide on his appointment as President will be held in a few months."
chi.2.a: "Closely unite around the Party Central Committee with Comrade Hu Jintao as General Secretary!"
chi_sapce.1.t: "Shenzhou V manned spacecraft"
chi_sapce.1.d: "At 9:00 on October 15, 2003, the Shenzhou V manned spacecraft independently developed by my country was launched from the Jiuquan Satellite Launch Center in China. At 9:09:50, the Shenzhou V accurately entered the predetermined orbit. This was China's first manned space flight. The astronaut who carried out the mission on the Shenzhou V manned spacecraft was 38-year-old Yang Liwei. He is the first generation of astronauts trained by my country. After flying around the earth 14 times in space, after a safe flight of 21 hours and 23 minutes and 600,000 kilometers, he successfully landed and returned at the main landing site in Inner Mongolia at 6:23 on the 16th."
chi_sapce.1.o1: ""I feel good.""
chi_millennium.2: "President Jiang's speech at the United Nations"
chi_millennium.2.t: "President Jiang's speech at the United Nations"
chi_millennium.2.d: "Mr. Chairman:\n\nAt the turn of the century and the turn of the millennium, leaders from all over the world gather in the United Nations Building to discuss major issues related to the future of human development and to promote the noble cause of world peace and development. At this moment, all people who love peace and yearn for happiness are looking here with concern.\nIn the past millennium and the twentieth century, mankind has experienced tragic disasters and calamities, and has also carried out great struggles and creations, and finally won brilliant achievements in material and spiritual civilization.\nIn the 21st century and the new millennium, mankind will inevitably encounter unpredictable challenges and tests, and will inevitably achieve new historical changes and leaps. The lasting and The prospect of peaceful common prosperity will be bright. \nThe Cold War that lasted for nearly half a century has ended. The international situation has generally eased. The trend of world multipolarization and economic globalization is developing rapidly. Modern science and technology with information technology and life science as the core is advancing by leaps and bounds. Humanity is facing a rare opportunity for development. The pursuit of peace and development is the common aspiration of the people of all countries in the world and the theme of our era. However, the unfair and unreasonable old international political and economic order has not been fundamentally changed. There is still a long way to go to solve the two strategic issues of peace and development and establish a fair and reasonable new international political and economic order. \nNow, people in many countries are still suffering from war and unrest. Hegemonism and power politics still exist. Local conflicts caused by ethnicity, religion, territory, resources and other factors continue to occur. Various separatist forces, terrorist forces and extremist forces continue to harm the international community. Global problems such as the environment, drugs and refugees are becoming increasingly prominent. Our planet is still very unstable and peaceful. \n\nAll member states of the United Nations and politicians of various countries jointly shoulder the important historical mission entrusted by the times, which is to achieve lasting world peace and promote common development and universal prosperity among countries. \nPeople of all countries are wise. Today, mankind has advanced to the universe 18 billion light years away in the macroscopic aspect of science, and has initially revealed the basic The secret of cause. Although there are still many unsatisfactory places in the world, people of all countries will surely be able to continuously enrich their knowledge, constantly sum up their practical experience, and become more and more rational in dealing with the relationship between man and nature, man and society, nation and nation, and country and country. Based on this understanding, I am full of optimism about the prospects for world development in the new century and the new millennium. I firmly believe that the evolution of the world situation and the development of human society, no matter how many difficulties and twists and turns they will experience, will eventually move towards a higher civilization and more comprehensive progress. \n\nI call on: countries and peoples who love peace and yearn for progress all over the world to join hands and jointly push the wheel of history towards a bright goal! \n\nThank you all. "
chi_millennium.2.a: "Graceful and eloquent!"
chi_sars.1: "Unknown virus appears in Guangdong"
chi_sars.1.t: "Unknown virus appears in Guangdong"
chi_sars.1.d: "On November 16, Pang Zuoyao from Guangdong developed fever, headache, dry cough, fatigue and other symptoms. He was rushed to Foshan Shiwan Hospital. Nine days later, he was transferred to the infectious disease department of Foshan First People's Hospital. On December 5 and 6, Huang Xingchu from Heyuan, who worked in Shenzhen, felt uncomfortable, like a cold, so he went to a nearby clinic for treatment. The doctor said it was not a big problem. On the 8th, he felt that the treatment in the clinic was not effective, so he went to the hospital for injections. On the 13th, he was still not feeling well, so he returned to Heyuan City and received treatment for a few days. His symptoms were more serious than when he was in Shenzhen. He was sent to Heyuan People's Hospital at around 10 o'clock in the evening on the 16th. The next day, his condition worsened and he had difficulty breathing. He was sent to the Guangzhou Military Region General Hospital.\n\nThe Heyuan Municipal Government has reported the relevant situation to the Provincial Health Department and senior officials. Soon after, several cases of medical staff being infected appeared in Zhongshan City at the same time. Experts suspect that this is a new type of virus with extremely strong transmission ability and unknown transmission route. At present, the public is still unclear about the situation."
chi_sars.1.a: "Send a special team to investigate immediately!"
chi_sars.2: "The number of people infected with SARS virus has stopped growing"
chi_sars.2.t: "The number of people infected with SARS virus has stopped growing"
chi_sars.2.d: "On July 13, 2003, the number of SARS patients and suspected cases worldwide stopped increasing, and the SARS process was basically over.\n\nUnder the correct leadership of the Party and the country, we have successfully defeated this epidemic!"
chi_sars.2.a: "I don't think there will be any more in the future."
chi_sars.6: "Investigation Results"
chi_sars.6.t: "Survey Results"
chi_sars.6.d: "As of February 9, 2003, Guangzhou has had more than 100 related cases, many of whom are medical staff. There have been 2 deaths among the cases found in Guangzhou. We have sent an expert group led by Vice Minister Ma Xiaowei to Guangzhou on the afternoon of February 9 to help find the cause of the disease and guide prevention and treatment. After arriving, Ma Xiaowei found that there were rumors that fumigating with white vinegar and drinking isatis root could prevent strange diseases. On the 10th, the rush to buy reached its climax. A large bag of isatis root, which usually costs less than 10 yuan, suddenly soared to 30 or 40 yuan, and the price of white vinegar also rose steadily, from 10 yuan to 80 yuan and 100 yuan.\n\nOn the morning of February 11, the Guangzhou Municipal Government held a press conference to announce the situation of atypical pneumonia in Guangzhou, saying that the conditions of all patients had been The Guangzhou Municipal Government stressed that for Guangzhou's population of 10 million, more than 300 people infected is a very small proportion, atypical pneumonia is only a local occurrence, and no new cases have been reported in Heyuan, Zhongshan and other cities. It also explained the reason for not announcing the situation before February: most patients in Heyuan, Zhongshan and other places have recovered or improved after treatment and have not relapsed. Atypical pneumonia is not a legally reportable infectious disease, and the number of 305 cases is not large. The person in charge stressed that the epidemic announcement will be announced in accordance with the infectious disease law. \n\nOn February 12, the head of the Chinese Center for Disease Control and Prevention predicted in an interview with reporters that there will be no large-scale epidemic of respiratory infectious diseases in the country in the near future, but there may be a small-scale epidemic of respiratory infectious diseases in some local areas. "
chi_sars.6.a: "It seems that there shouldn't be any problem. Just block the news."
chi_sars.6.b: "Nonsense, this is clearly a highly contagious influenza virus! Publish the news immediately and investigate those who concealed the facts!"
chi_sars.101.t: "Fort Detrick biological base was closed"
chi_sars.101.d: "The Fort Detrick biological base, the largest biological and chemical weapons research and development center of the US military, was recently investigated and closed by the US Centers for Disease Control and Prevention.\n\nNot long after the closure of Fort Detrick base, an inexplicable "e-cigarette disease" broke out in the nearby area, and the subsequent flu season caused at least 32 million people in the United States to be infected."
chi_sars.101.a: "God bless us"
chi_sars.101.b: "What does this mean?"
chi_sars.110.t: "New virus infection discovered in Wuhan"
chi_sars.110.d: "Some medical institutions in Wuhan have successively seen patients with pneumonia of unknown cause. The clinical manifestations of their cases are mainly fever, and a few patients have difficulty breathing. Chest X-rays show infiltrative lesions in both lungs.\n\nWuhan City continues to carry out influenza and related disease monitoring, and found 27 cases of viral pneumonia, all diagnosed as viral pneumonia/lung infection."
chi_sars.110.a: "Investigate new diseases!"
chi_sars.110.c: "The situation is more serious than we thought"
chi_sars_110_c_tt: "§RThe severity of the new coronavirus has increased significantly§!"
chi_sars.110.b: "Virus? Where is the virus?"
chi_sars_110_b_tt: "§YThis will create a world where the new coronavirus does not exist§!"
chi_sars.111.t: "$STATE_772$ found a new virus infection"
chi_sars.111.d: "$STATE_772$'s health authorities found that the previous "e-cigarette" virus infection was very likely a new coronavirus infection, which means that the new coronavirus has already begun to spread in our country."
chi_sars.111.a: "This is unfortunate..."
chi_sars.115.t: "New virus infection"
chi_sars.115.d: "$STATE_772$'s health authorities found that the previous "e-cigarette" virus infection was very likely a new coronavirus infection, which means that the new coronavirus has already begun to spread in our country."
chi_sars.115.a: "This is unfortunate..."
chi_sars.120.t: "New coronavirus infection has been found in the country!"
chi_sars.120.d: "The health institutions of [SARS_COV_2019_transmit_coefficient_target.GetName] have recently discovered local patients infected with the new coronavirus.\n\nThis may mean that the new coronavirus will become popular in our country."
chi_sars.120.a: "Closely monitor the situation"
chi_sars.200.t: "The new coronavirus has mutated"
chi_sars.200.d: "Due to the underdeveloped local economy in [root.GetName], the new coronavirus has mutated in [root.GetName], and the new mutant strain has been found to be spreading widely. "
chi_sars.200.a: "This is a problem..."
chi_sars.210.t: "People support $SARS_COV_2019_category_lockdown$"
chi_sars.210.d: "The recent $SARS_COV_2019_category_lockdown$ policy has been welcomed, and many people have taken the initiative to protect themselves and maintain social distance. We expect that this change will make it more difficult for the new coronavirus to spread. "
chi_sars.210.a: "Very good! "
chi_sars.211.t: "People oppose $SARS_COV_2019_category_lockdown$"
chi_sars.211.d: "The recent $SARS_COV_2019_category_lockdown$ policy has been criticized and opposed by many people. Opponents say that this is depriving them of their right to survive. "We will not die immediately if we are infected with the virus, but we will starve to death immediately if we cannot work." The lack of public cooperation will greatly reduce the effectiveness of our $SARS_COV_2019_category_lockdown$ policy. We expect this change to make it easier for the new coronavirus to spread. "
chi_sars.211.a: "This is a problem..."
chi_sars.401.t: "WHO announces the end of the COVID-19 era"
chi_sars.350.t: "The world economy is hit by the epidemic"
chi_sars.350.d: "As the COVID-19 epidemic becomes more serious, production and trade in various places have in fact been greatly affected, and the world economy is inevitably hit."
chi_sars.350.a: "I hope the COVID-19 epidemic will end soon."
chi_sars.401.d: "The World Health Organization International Health Regulations Emergency Committee held its 15th meeting on the COVID-19 outbreak at [?global.date.GetDateString] Geneva time. The members of the expert group recommended to the Director-General that the COVID-19 outbreak be declared as an "international public health emergency", and Director-General Tedros accepted the recommendation. \n\n World Health Organization Director-General Tedros said, "I am full of hope to announce that the era of the COVID-19 outbreak as a global health emergency is over, but this does not mean the end of the COVID-19 outbreak as a global health threat.""
chi_sars.401.a: "The arrival of the post-epidemic era"
chi_GRnews.1: "Super Girl"
chi_GRnews.1.t: "2004 Super Girl Contest begins audition"
chi_GRnews.1.d: "This month, Hunan TV launched a TV program called "2004 Super Girl". Unlike the common singing competitions, this event claims to be a "no-threshold" music talent show that is "regardless of age, region, or appearance". The program emphasizes a sense of happiness, hoping to promote a sense of "universal happiness" through this music competition that has no threshold and is open to the public. This "no-threshold" talent show advocates "singing as the basis" and selects the voice charm of female singers, so the age, appearance, region and other factors of the contestants can be left aside. As long as you have a beautiful original voice, you can participate in this competition for free. Popular, folk music, beautiful voice, and all kinds of singing methods can be selected to select the most authentic voice.\n\nOn May 10, 2004, the Hunan singing area held the "Top 20 into Top 10" competition to produce the top ten in the Hunan singing area. Other areas subsequently held auditions."
chi_GRnews.1.a: "Girls with beautiful singing voices"
chi_GRnews.2: "Super Girl Contest is over"
chi_GRnews.2.t: "Competition for the Champion of "Super Girl""
chi_GRnews.2.d: "On August 14, after several months of auditions, selections and finals, the program finally produced the "National Champion of the Year" An Youqi, "National Runner-up of the Year" Wang Ti, and "National Third Place of the Year" Zhang Hanyun based on the number of votes from outside the venue. The fourth to eighth places in the country are: Strings, Sun Yibu, Chen Wenya, Yang Yang, and Zhang Yue.\n\nThis TV program attracted audiences from all over China, especially young women. Many girls went to various competition areas to actively participate in the selection. Hunan Satellite TV's influence in the entertainment field has been unprecedentedly improved."
chi_GRnews.2.a: "Not bad"
chi_GRnews.3: "Super Girl"
chi_GRnews.3.t: "2005 Super Girl Contest begins audition"
chi_GRnews.3.d: "After last year's huge success, Hunan Satellite TV started the audition of "Super Girl" again this month, still adhering to the program's purpose of the previous year, "regardless of age, region, and appearance", contestants win with their singing voice.\n\nGirls from all over the country have already known the start time of the program. Since March, many people have gone to the competition area in advance to wait for the audition. On May 1, 2005, the Changsha singing area held the "Top 20 to Top 10" competition, and the top ten of Changsha singing area were selected. Other competition areas will then hold auditions."
chi_GRnews.3.a: "There are more people!"
chi_GRnews.4: "Super Girl Contest is over"
chi_GRnews.4.t: "Competition for the Champion of "Super Girl""
chi_GRnews.4.d: "After several months of auditions, Hunan Satellite TV broadcast the national finals of "Super Girl 2005" on the Hunan Satellite TV platform every Friday at 20:30 starting from July 15, 2005. The program finally produced "National Champion of the Year" Li Yuchun, "National Runner-up of the Year" Zhou Bichang, and "National Third Place of the Year" Zhang Liangying based on the number of votes from outside the venue. The fourth to tenth places of the year are: He Jie, Ji Minjia, Huang Yali, Ye Yiqian, Yi Hui, Zhao Jingyi, and Zhu Yan.\n\nThe ratings of this program hit a new high. Li Yuchun and Zhou Bichang became popular all over the country, and their influence even spread overseas. In October 2005, "National Champion of the Year" Li Yuchun appeared on the cover of the American current affairs weekly "TIME (Asia Edition)" as one of the "25 Asian Heroes of the Year". This year, Hunan Satellite TV earned more than 100 million yuan in revenue from sponsorship income and advertising insertion income in the finals during the process of hosting "Super Girl 2005". "
chi_GRnews.4.a: "We love Chun Ge!"
chi_GRnews.5: "Super Girl"
chi_GRnews.5.t: "2006 Super Girl Contest begins audition"
chi_GRnews.5.d: "After two years of great success, Hunan Satellite TV started the audition of "Super Girl" here this month. It still adheres to the program's purpose of the previous year, "regardless of age, region, and appearance", and the contestants win with their singing voice.\n\nGirls from all over the country have already known the start time of the program. Since April, many people have gone to the competition area in advance to wait for the audition. On May 8, 2006, the Changsha singing area held the "Top 20 to Top 10" competition, and the top ten of Changsha singing area were selected. Other competition areas will then hold auditions."
chi_GRnews.5.a: "There are more people!"
chi_GRnews.6: "Super Girl Contest is over"
chi_GRnews.6.t: "Competition for the Champion of "Super Girl""
chi_GRnews.6.d: "After several months of auditions, Hunan Satellite TV broadcast the national finals of "Super Girl 2006" on the Hunan Satellite TV platform every Friday at 20:30 starting from August 15, 2005. The program finally produced the "National Champion of the Year" Shang Wenjie, "National Runner-up of the Year" Tan Weiwei, and "National Third Place of the Year" Liu Liyang based on the number of off-site votes. The fourth to tenth places of the year are: Ai Mengmeng, Li Na, Xu Fei, Han Zhenzhen, Reborn, Tang Xiao, and Yang Lei.\n\nThrough three consecutive years of national auditions, Hunan Satellite TV has established its mobilization ability and influence on the entertainment industry nationwide, and has since established its position as the strongest variety show channel."
chi_GRnews.6.a: "Not bad"
chi_GRnews.7: "Happy Camp"
chi_GRnews.7.t: "Happy Camp"
chi_GRnews.7.d: "In 2004, Hunan TV's variety show Happy Camp began to establish a new concept of "pan-entertainment" such as "open auditions", "reality shows" and "live PK" by using periodic activities as highlights and ordinary audiences as the protagonists. It downplayed the star routines of "big variety shows" and tried new concepts such as "open auditions", "reality shows" and "live PK". This is one of the few entertainment variety shows in China. Due to its rich format, good program effects and strong entertainment, Happy Camp quickly appeared frequently on TVs in families across the country, bringing a lot of laughter to Saturday nights."
chi_GRnews.7.a: "Not bad"
chi_GRnews.8: "Love Apartment"
chi_GRnews.8.t: "Love Apartment" starts airing
chi_GRnews.8.d: "On August 5, Jiangxi TV broadcast a TV series called Love Apartment. The show tells the story of several young men and women living, struggling and developing friendship in an apartment in the international metropolis of Shanghai. Soon after the show was broadcast, it was questioned by the audience for plagiarizing the American TV series "The Big Bang Theory", but its humorous plot content, twists and turns in interpersonal relationships, and nonsensical jokes still attracted the attention of the audience.\n\nSome critics believe that the good plot is certainly an important reason for the popularity of the show, but the more profound reason is that the image and background of the characters in the show fit the lives of a large number of new urban youths driven by rapid urbanization in reality. These young people can empathize with and yearn for the characters in the show, so it has won the favor of not only urban youth, but also the pursuit of young men and women from rural counties who are about to enter the city."
chi_GRnews.8.a: "Not bad"
chi_GRnews.9: "The Splitting of the Qin Empire"
chi_GRnews.9.t: "The Great Qin Empire: Splitting" is on air""
chi_GRnews.9.d: "On the 18th of this month, Shaanxi, Southeast, Henan and Hebei Satellite TV simultaneously broadcast a historical TV series called "The Splitting of the Great Qin Empire". The drama is adapted from the novel of the same name "The Great Qin Empire" written by writer Sun Haohui. It tells the story of Shang Yang, a representative of the Legalist school of thought in the Warring States Period of China before the Common Era, who worked with King Qin Xiaogong to reform and promote the rule of law in the Qin State, which was facing the danger of national destruction, and led the country to prosperity. The drama became a hit as soon as it was broadcast and received widespread attention and discussion from the society.\n\nObservers believe that the popularity of the drama is inseparable from the real background. After the impact of the 2008 economic crisis, all sectors of society were discussing the way to reform, and the central government's policy gradually changed from the conservative tendency of "no tossing" to the innovative color of "establishing new rules". The spirit of reform contained in the drama is very closely aligned with the atmosphere of seeking change in reality. People are deeply impressed by Shang Yang's behavior of "sacrificing his life for the law" and have many praises for Qin Xiaogong's determination to enforce the law."
chi_GRnews.9.a: "The most difficult thing in the world is not to make laws, but to enforce them."
chi_GRnews.10: "Lurking"
chi_GRnews.10.t: "The Hidden" starts airing
chi_GRnews.10.d: "On the 20th of this month, Southern Television broadcast a historical TV series called "Hidden". Then Tianjin, Shandong, Chengdu, Heilongjiang, Oriental, Beijing, Chongqing and other satellite TV stations quickly followed suit. On the first day of the broadcast, Beijing Satellite TV's ratings reached 8.01%. The background of the play is 1945, when the Anti-Japanese War was nearing its end. The wrestling between the Kuomintang, the Communist Party and Japan became increasingly fierce, and undercurrents surged under the calm sea. Because the military intelligence agent Li Haifeng defected to the Nanjing Wang Puppet Regime, Yu Zecheng (played by Sun Honglei), a member of the Military Intelligence Department, was ordered to Nanjing to assassinate the traitor, but accidentally embarked on another path. . After being instigated by the Communist Party of China, Yu Zecheng returned to the Military Control Commission as an underground party member and became a rivet in the heart of the Kuomintang. In order to assist Yu in his work, the party organization sent Cui Ping (played by Yao Chen), a hot-tempered and outspoken girl, to serve as Yu's fake wife. As time went on, the struggle between the Kuomintang and the Communist Party became more intense, and the couple also faced a major test in their lives. \n\nThe leading actors Sun Honglei and Yao Chen deeply interpreted the tense atmosphere and the turbulent trend of the times in a special historical period with their outstanding acting skills. The rhythm of the plot was also accurately grasped, and the drama became the best spy drama in the minds of many viewers. "
chi_GRnews.10.a: "Paying tribute to the revolutionary forefathers"
chi_GRnews.11: "Shamatte"
chi_GRnews.11.t: "Shamatte trend"
chi_GRnews.11.d: "Since last year, many people wearing "strange clothes" and "weird" hair and makeup have appeared all over the country. The special common characteristics of these people have attracted social attention. These groups have established social circles and dialogue channels on the Internet, calling themselves "Shamatte" or "Zangai Family", and regard each other as "family". They often appear in groups in public with exaggerated appearances.\n\nIt is understood that the "Shamatte" group is mostly migrant workers and some students in school, most of whom are born in the 1990s and 1985s, and most of them are skilled Internet users like to take selfies. There are many screenshots of videos with colorful hair in QQ space, forums and blogs. This style is a combination of Japanese visual style and European and American rock, and the domestic Shamatte group likes and blindly imitates the clothes, hair, etc. of Japanese visual rock bands. Most of the original Shamatte have colorful long hair and heavy makeup; wear some very unique clothes and strange jewelry; like to take selfies and do some strange actions in front of the camera in the Internet cafe; call themselves "a group that combines fashion, vision and Shamatte into one system" The Chinese "Shamatte" family has nothing to do with rock music. They just like to imitate the clothes and makeup of the visual style. However, the real fans of the visual style disdain to associate with the "Shamatte". Therefore, the evolution of China's "Shamatte" is neither VR nor pure visual style. It is a unique social state, a way of life and a cultural trend. Shamatte originated from the punk culture of the 1970s. It represents an alternative and even weird image of young people. This group of alternative young people They are constantly challenging everyone's aesthetic nerves. They are called "Shamatte Family" and are called "Shanzhai" by netizens who are not used to their eccentricity. They are equated with "brain-dead" and "diaosi" and are listed with brain-dead people. \n\nIn fact, this group has not done anything illegal or harmful. Observers believe that this is a kind of unconventional belonging demand caused by the identity crisis of new urban residents in the context of China's rapid urbanization. Its origin, process and ending are all tragedies of being excluded by the mainstream society. "
chi_GRnews.11.a: "If you are talking about where you are, look forward to remembering that you have always been there and wishing you a happy start!"
chi_GRnews.12: "Home with Kids"
chi_GRnews.12.t: "Home with Kids" starts airing
chi_GRnews.12.d: "On the 12th of this month, Beijing TV broadcast a family sitcom called "Home with Children", which tells the interesting stories between parents and three children after two divorced families got together. The father Xia Donghai followed his ex-wife to the United States to accompany her to study and work. After the divorce, he returned to China with his 7-year-old son Xia Yu and reunited with his daughter Xia Xue who grew up in China. Later, he married the head nurse Liu Mei, who was also divorced and had a son named Liu Xing. The story of this drama takes place in this special family. Xia Donghai and Liu Mei have the common characteristics of being loving and caring about the growth of their children. They hope to "integrate" their love and wisdom to cultivate the next generation of happy life; and the three siblings living under the same roof, despite their different blood ties and different age levels, get along like real children.\n\nThe drama is loved by the audience because it is close to life, and the news media comments also praise it. However, some people think that the drama reflects "only the life of a wealthy family in Beijing" and cannot represent the vast majority of ordinary families in society. Ordinary people can't feel empathy from it at all."
chi_GRnews.12.a: ""I want to dye this thing green""
chi_GRnews.13: "Crossing the Line of Fire"
chi_GRnews.13.t: "CrossFire is officially released!"
chi_GRnews.13.d: "On May 3, Tencent released a new first-person shooter game called "Crossfire", which was developed by the Korean team Smile Gate and operated by Tencent Games in mainland China. The game tells the story of the confrontation between the two largest mercenary groups in the world, Global Risk and Black List. The game has multiple modes such as team competition mode, team competition, blasting mode, ghost mode, and the first to introduce an instant joining system in the form of "lack of people to supplement". \n\nPreviously, China's first-person shooter game market was mainly occupied by Counter-Strike (CS). Since the official release of Crossfire, the game's market share has continued to rise, and it quickly became popular across the country and became a phenomenal game. In every Internet cafe, you can see people fighting side by side with their teammates in Crossfire, and attracting a group of CF fans who are also addicted to CF to watch from the back. This game will become one of the most popular games in China in the near future."
chi_GRnews.13.a: "kkkkkkkkkkkkkkkThe landlord, please open it quickly!"
chi_GRnews.14: "World of Warcraft"
chi_GRnews.14.t: "World of Warcraft officially launches in China!"
chi_GRnews.14.d: "On June 6, the game "World of Warcraft" produced by Blizzard Games officially landed in China and released its first national server version. Previously, Chinese players could only play this massively multiplayer online role-playing game that has long been popular all over the world on foreign servers. Now Chinese players no longer need to endure high latency and difficult English interfaces. They can play happily by logging into the national server.\n\nThe importance of "World of Warcraft" to the gaming industry has long been self-evident. Mike Laidlaw, the chief designer of "Dragon Age: Origins", believes that the production of online games must consider the impact of World of Warcraft on players. It is unwise to ignore the share and influence of World of Warcraft in the online game market. Just as "Quake" set the basic framework for FPS games, World of Warcraft also set the most popular user interface for MMO games. This game is about to become famous in mainland China and become the memory of a generation."
chi_GRnews.14.a: "One day, my life will come to an end, and you will be crowned king"
chi_GRnews.15: "QQ"
chi_GRnews.15.t: "QQ"
chi_GRnews.15.d: ""Ahem—Ahem", which netizen sent you a QQ message today?\n\nThis month, the number of registered users of QQ, an instant messaging software released by Tencent, exceeded 200 million, making it one of the most widely used communication software in China and even in the world. The era of communicating with pagers and text messages has changed. Now you only need to double-click this cute penguin icon on your computer to log in to QQ and send free messages to the friends you need to talk to. Related software also includes QQ space in the form of personal blogs, QQ mailbox, etc., which are favored by netizens for their novelty, convenience and rich functions."
chi_GRnews.15.a: "Thunder Monkey, are you a GG or a MM?"
chi_GRnews.16: "Zhao Lirong passed away"
chi_GRnews.16.t: "Famous actress Zhao Lirong passed away"
chi_GRnews.16.d: "At 7:30 a.m. on July 17, the famous actress Zhao Lirong died of lung cancer at the age of 72. People have deep feelings for this old artist who has appeared on the Spring Festival Gala stage many times and brought laughter to the people of the country. Zhao Lirong participated in a total of 6 CCTV Spring Festival Galas. Every time, the skits she performed could push the warm atmosphere of the gala to a climax. Skits such as "Sima Guang Smashing the Jar", "Tangshan Mom", "Love Whom", "Working Adventure", "Such Packaging", etc. are deeply loved by the audience. Some skits were co-created by her and Gong Hanlin. Every move and every word in the skits are integrated with her hard work and sweat. These skits are not only widely influential in China but also well-known overseas. The American "Star Morning Post", the British "Times", the French "Chinatown" magazine, and the Russian "Great Culture News" have all commented and reported on Zhao Lirong's skits, calling her "a funny female master who writes about civilians, plays civilians, and comes from civilians." "And praised her with a high title, saying that she was "a spiritual local artist who was born in Yanzhao and is from the same hometown as Cao Xueqin and Teresa Teng..."
chi_GRnews.16.a: "Palace Jade Wine, 180 yuan a cup! How is this wine? Let me tell you about it!"
chi_GRnews.17: "JAY"
chi_GRnews.17.t: "Taiwanese singer Jay Chou releases his first solo album "Jay"!"
chi_GRnews.17.d: "At the turn of the millennium, R&B was on the rise in the Chinese music scene, and many singers jointly promoted the quiet change of Chinese pop music style. At this moment, an album named "Jay" was also released from Taiwan's Alfa Records. Those who bought the album at the first time were fortunate to witness the opening of the "new generation of singers and songwriters" in the music scene. The ten songs in the album are not stereotyped, and many fresh musical elements and lyrics themes highlight the unique personal imprint of this debutant. The name "Jay Chou" also entered the public eye with the freshness and impact of his works. The style of the entire album is R&B and New The album is mainly based on Hip-Hop, with the addition of classical Baroque string accompaniment and band, forming a British retro style. What's more special is that the Spanish-style string performance in the album songs is extremely close to the artistic conception of movie soundtracks. The large number of black music styles mixed in the album shook the mainstream cornerstone of the Chinese music scene. At the same time, this is a dual-core record with a rhythm engine based on melody, which recalibrates the balance of a modern song with rhythm and melody, giving people a relatively fresh and rich personality charm. \n\nThe title song "Xingqing" won the 24th Top Ten Chinese Golden Songs Outstanding Mandarin Song Gold Award, and he also received attention in the Chinese music scene with this album. At the 12th Taiwan Golden Melody Awards held the following year, he won the Best Pop Music Album Award and was nominated for the Best Producer Award with this album, and was nominated for the Best Composer Award at the 12th Taiwan Golden Melody Awards with the song "Lovely Woman" in the album. The future of this young singer is extremely broad. "
chi_GRnews.17.a: "Oh, not bad."
chi_GRnews.18: "Chibi Maruko-chan"
chi_GRnews.18.t: "Guangdong TV broadcasts "Chibi Maruko-chan"!"
chi_GRnews.18.d: "This month, Guangdong TV broadcast the Japanese anime "Chibi Maruko-chan" for the first time in mainland China. "Chibi Maruko-chan" is a TV animation produced by a Japanese animation company. Its animation has been ranked among the top three in Japanese animation ratings for more than 20 years. It is serialized and popular on Fuji TV in Japan at 6 pm every Sunday prime time. It is a national animation in the hearts of Japanese men, women and children. This work is based on the author's childhood life. The story revolves around Maruko, her family and classmates. It is about family affection, friendship, or some trivial things in life. There are laughter and tears, which reminds people of the childishness of childhood. The broadcast of the animated version of Chibi Maruko-chan has allowed Maruko to go beyond Japan and land in Asian countries such as China, South Korea, and Thailand, and has set off a craze for ratings and peripheral product collection. Among them, the Taiwanese version of the dubbing is special and interesting, which also makes Maruko a popular anime character among mainland children and even adults. In 2010, the original Maruko animation was still serialized at a rate of 150 episodes per year, and it enjoyed the reputation of sunny and long-lived comics in Japan."
chi_GRnews.18.a: ""In fact, the so-called life is full of so many boring things.""
chi_GRnews.19: "Crayon Shin-chan"
chi_GRnews.19.t: "The CD of "Crayon Shin-chan" is officially introduced to China!"
chi_GRnews.19.d: "This month, the popular Japanese family comedy cartoon "Crayon Shin-chan" officially landed in mainland China and was sold in the form of a disc. The film is adapted from the comic work of the same name "Crayon Shin-chan" created by Japanese cartoonist Yoshito Usui. It tells the story of a 5-year-old Japanese boy, Nohara Shinnosuke, and his family, teachers, classmates, neighbors, passers-by in daily life. \n\nIt is no coincidence that "Crayon Shin-chan" has quickly become popular in Japan and neighboring countries and regions. One of the important factors is that through the unusual words and deeds of an uneasy child, he said what adults wanted to say but dared not say, and did what adults wanted to do but did not dare to do, releasing the psychological activities of adults' pressure, and plucked the heartstrings of adults who longed to return to childhood, return to nature, and return to reality, which aroused strong resonance among most viewers. "Crayon Shin-chan" is not just an animation work, but a cultural phenomenon. , Shin-chan is not limited to the characters in the play, but a group of people's thinking. Behind this phenomenon lies the complex adult mentality reflected by the cartoon that can arouse everyone's resonance, including at least: deep helplessness in the face of real life, anti-traditional thinking in the face of hybrid culture, habitual, selfish, hypocritical and sophistry towards others, and helplessness in facing the doting of the grandparents and affecting the education of minors. \n\nHowever, this excellent Japanese cartoon is also mixed with a lot of vulgar and low-level content, so it has been criticized by some people after it became popular in China. In August 2004, the State Administration of Radio, Film and Television issued the "Notice on the Illegal Broadcasting of Foreign Cartoons by Shandong Dezhou TV Station". The "Notice" pointed out that Shandong Dezhou TV Station used telephone interactive on-demand methods to broadcast the unauthorized Japanese cartoon "Crayon Shin-chan" on the graphic channel. The content of the film is low-level and vulgar, which is not conducive to the healthy physical and mental growth of minors."
chi_GRnews.19.a: ""Elephant, elephant, why is your nose so long~""
chi_GRnews.20: "Detective Conan"
chi_GRnews.20.t: "Detective Conan is a big hit!"
chi_GRnews.20.d: ""俺は江戸川コナン、探偵さ (My name is Edogawa Conan, and I’m a detective)"\n\nThe image of a little Japanese boy wearing a blue suit, a red bow tie and big-framed glasses has been deeply rooted in the hearts of the Chinese people. This is a classic line from Conan, the protagonist of the Japanese anime "Detective Conan". In 1999, "Detective Conan" was broadcast on China Education Television and Liaoning Education Television. The first 105 episodes of "Detective Conan" were dubbed in Taiwanese Chinese. The film has been repeatedly broadcast on various satellite channels and children's channels in China for a long time. In 2003, "Detective Conan" ranked sixth on Shanghai TV with a ratings of 9.54% throughout the year, becoming the first cartoon to enter the top ten TV ratings in China. After the launch of Shanghai Xuandong Cartoon Satellite TV, the film was scheduled as a "fashionable adult animation" from 20:00 to 21:00. It is broadcast at 1:30 p.m. and still forms a peak in evening ratings despite being surrounded by prime-time TV dramas in the same time slot. In 2010, the film ranked first in the length of imported animated films broadcast that year (fourth overall), with a total of 103,646 minutes; in the same year, among the animated films broadcast on Zhejiang Satellite TV, Detective Conan had the highest ratings. \n\nIn the "Survey on the Safety of Minors' Growth in the Animation Field" project conducted by the Jiangsu Provincial Consumer Rights Protection Committee from December 2020 to March 2021, in response to the question "Which cartoons do your children usually like to watch", 1,325 respondents checked "Detective Conan", accounting for 30.33%. However, the "Survey Report on the Safety of Minors' Growth in the Animation Field" also pointed out that the film contains elements of violent crimes and dark elements to a certain extent. "
chi_GRnews.20.a: "真実はいつも一つ! (There is always only one truth!)"
chi_GRnews.21: "Dragon Ball"
chi_GRnews.21.t: "Dragon Ball is a big hit!"
chi_GRnews.21.d: ""A long time ago, there was an ancient legend that there were seven balls called dragon balls scattered all over the world. As long as you collect the seven dragon balls and recite a spell, you can summon a dragon, and any wish can be fulfilled for the wisher. "\n\nAs one of the representative works of Japanese comics, Akira Toriyama's "Dragon Ball" definitely carries the childhood memories of countless people. In the 30 years since its birth in 1984, "Dragon Ball" has maintained a very high popularity. This classic work seems to have become a symbol of Japanese comics. The early adventure plot of "Dragon Ball" was not as popular as expected, and its popularity once dropped to the dangerous edge of more than ten. At this time, editor Kazuhiko Torishima stood up again and believed that the theme of "pursuing power" should be added to the work, so the world's first martial arts meeting appeared. Sure enough, the popularity rose rapidly after that, and the broadcast of the animation was even higher. Since 1987, "Dragon Ball" has regained the top trump card position of the magazine and has maintained this position until it was completed.\n\nAfter "Dragon Ball" was introduced to mainland China, it quickly became a popular phenomenon-level animation like other popular animations. People feel both familiar and unfamiliar with the protagonist "Sun Wukong", and the exotic story also makes Chinese audiences feel a little familiar and comforted because of the common cultural cognition between China and Japan."
chi_GRnews.21.a: ""Hey! She said we'll meet again, so there's still hope!""
chi_GRnews.22: "Naruto"
chi_GRnews.22.t: "Naruto is a big hit!"
chi_GRnews.22.d: "On the 4th of this month, Star TV broadcast the Japanese anime "Naruto", which received great ratings. "Naruto" is a long-running TV animation adapted from the manga of the same name created by Japanese cartoonist Masashi Kishimoto. It premiered on Tokyo TV's 6-station series and Gifu Broadcasting on October 3, 2002, with a total of 220 episodes. The story successfully portrays the ninja, who originally hid in the dark and used the world's strongest willpower and the most arduous efforts to do the most secretive and cruel things, as the most proud and bright profession under the sun. The story is set in a ninja world. The story begins with the protagonist Uzumaki Naruto's life as an orphan. The fourth generation Hokage protects the village. Naruto was ignored by the villagers and tried to attract their attention with various pranks. Fortunately, with the care of teacher Iruka, Naruto's character did not become distorted. He was always energetic and optimistic. In order to make more people recognize him, Naruto's goal is to become a Hokage. The whole story revolves around Naruto's struggle and growth, Naruto's partners, and the various struggles and conspiracies in this ninja world. \n\n"Naruto" is full of Japanese elements, such as ninjas, ninjutsu, marks, etc., which provides a very interesting channel for Chinese people to understand Japanese culture. "
chi_GRnews.22.a: ""Is human destiny like a cloud that can only drift with the wind, or does the cloud choose its own direction?""
chi_GRnews.23: "One Piece"
chi_GRnews.23.t: "One Piece is on air!"
chi_GRnews.23.d: "This month, Star TV broadcast the Japanese anime "One Piece", which quickly became a hit. "One Piece" is a youth manga drawn by Japanese cartoonist Eiichiro Oda. It began serialization in Shueisha's "Weekly Shonen Jump" on July 22, 1997. The adapted TV animation "One Piece" premiered on Fuji TV on October 20, 1999, and is now officially broadcast in mainland China.\n\nBefore his death, Pirate King Gol D. Roger left a message about his life's wealth "One Piece", which attracted many heroes. The pirates fought for this legendary huge wealth. Various forces and regimes kept changing, and the whole world entered the turbulent and chaotic "Great Pirate Age". Luffy, who grew up in the East China Sea Windmill Village, was influenced by the pirate Shanks and decided to become an outstanding pirate and eventually become the Pirate King. In order to achieve this goal and find the much-anticipated One Piece, Luffy began his adventure to find the One Piece."
chi_GRnews.23.a: ""I want to be the man who becomes the Pirate King!""
chi_GRnews.24: "Pinball Police"
chi_GRnews.24.t: "'Pinball Police' is a big hit!"
chi_GRnews.24.d: "The Japanese anime "Dama Police" introduced this year has been well received by the audience.\n\n"Dama Police" (Bビ – ダマン爆外伝), a robot animation produced by Nagoya Telebi, has two series with a total of 50 episodes. It was broadcast on Japan's Asahi TV from February 7, 1999 to January 30, 2000. The story is about the Dark Emperor who was defeated by seven warriors with "star energy" 1,000 years ago. 1,000 years later, when the nine planets are aligned, he once again started a terrifying plan to destroy the solar system. The young boy Hakubo is A sunny boy in Marble City accidentally hit Dr. Gray Bao's moving aircraft due to the mischief of his pet bird, Wind Feather. He learned about the Dark Emperor and the Dark Marble Man. With a sense of justice, he started a just battle with Red, Blue, Yellow, Black and others to protect everyone's world. \n\nIn the statistics of the top 15 animation broadcasts on national TV stations in 2004, Marble Police ranked third with 91 hours, second only to "Blue Cat's Naughty Three Thousand Questions" and "Detective Conan". "
chi_GRnews.24.a: "Looks good"
chi_GRnews.25: "Beyblade"
chi_GRnews.25.t: "Beyblade" is widely praised!
chi_GRnews.25.d: "The Japanese anime "Beyblade" has gained a lot of popularity in China and set off a "racing fever". Many children and teenagers are pursuing faster and stronger mini racing cars, which has led to the booming development of the toy racing car industry."
chi_GRnews.25.a: "Let's Go!"
chi_GRnews.26: "Doraemon"
chi_GRnews.26.t: "Doraemon is widely praised!"
chi_GRnews.26.d: ""Every day is the same, with occasional sudden inspirations. As long as I have Doraemon, my laughter will be infinitely prolonged~" The round blue robot cat has become the best companion in the minds of many Chinese children. The Japanese anime "Doraemon" has become a well-known cultural image for Chinese children. The comic tells the story of a cat-shaped robot from the 22nd century, Doraemon, who was entrusted by his owner Nobi Shishu to return to the 20th century and use various future props taken out of the four-dimensional pocket to help Shishu's great-grandfather, the elementary school student Nobi Nobita, to resolve various difficult problems around him, as well as the light-hearted, humorous, funny and touching stories that happened in his life with his mother Nobi Tamako, his friends Shizuka, Fat Tiger and Suneo.\n\nDoraemon has won the love of countless audiences with its excellent plot, exquisite production and touching plot, and the image of the blue robot cat has also become one of the most well-known Japanese elements in the world."
chi_GRnews.26.a: "We all like Doraemon!"
chi_GRnews.27: "Astro Boy"
chi_GRnews.27.t: "Astro Boy is widely praised!"
chi_GRnews.27.d: "The Japanese anime "Astro Boy" is a big hit in China! "Astro Boy" is a science fiction comic created by Japanese cartoonist Osamu Tezuka. It was serialized in the "Shonen" comic magazine of "Kobunsha" from April 1952 to March 1968. The work tells the story of the young robot Astro Boy in the 21st century. The work has been adapted into animations many times. Among them, the first version of the 1963 TV animation was the first TV animation series in Japan and the first foreign animation series introduced to mainland China. In April 1951, "Ambassador Astro Boy" began to be serialized. He first appeared as a supporting role. In April of the following year, "Astro Boy" began to be serialized in the "Shonen" comic magazine. When "Astro Boy" first came out, it caused a sensation in Japan. This smart, brave and righteous little robot doll is almost loved by everyone."
chi_GRnews.27.a: ""A world where only humans prosper will eventually fall""
chi_GRnews.28: "Blue Cat's Three Thousand Questions"
chi_GRnews.28.t: "Blue Cat's 3000 Questions" has received widespread acclaim!
chi_GRnews.28.d: ""The stars are blinking, the moon is making a question mark, the comet is dragging a long tail, and the rainbow is building a bridge. "\n\nOn the 10th of this month, CCTV-7 broadcasted an animated film called "Blue Cat's Naughty 3000 Questions" produced by Hunan Blue Cat Cartoon Media Co., Ltd. and directed by director Wang Hong. The series uses a large number of 3D simulation digital and other high-tech elaborate scenes, focusing on the vast universe, the magical movement of celestial bodies and the magical demonstration of various high-tech weapons, bringing the audience an unparalleled visual impact, which makes people tremble and feel refreshed, and brings the audience into a dreamlike science fiction world. This is China's first large-scale popular science animation series feature film. It has walked its own way with the artistic creativity of "knowledge cartoon". Through the adventure process of the protagonist "Blue Cat" and his partners, and using the problems they encounter, it provides children with knowledge about the universe, ecological environment, human history, and biological views. It not only has the crystallization of thousands of years of brilliant human culture, but also has an overview of contemporary high-tech knowledge. It is an electronic version of the youth encyclopedia in the knowledge economy era."
chi_GRnews.28.a: "Oh, as long as you love to think, love to ask, and love to use your brain, you will understand all the wonderful questions in the world."
chi_GRnews.29: "Ultraman Tiga"
chi_GRnews.29.t: ""Ultraman Tiga" is a huge hit!"
chi_GRnews.29.d: ""Ultraman Tiga" is a special effects film produced by Tsuburaya Co., Ltd., written by Masama Ueda, directed by Hiromi Muraishi, and starring Hiroshi Nagano, Takami Yoshimoto, and Rei Takagi. It is also the first work in the "Ultraman" series of the Heisei series. The popularity of Ultraman Tiga in China has far exceeded anyone's expectations. Critics believe that the success of Ultraman Tiga lies in its inherent purpose of love and peace, and harmonious coexistence between man and nature, which is in line with the aspirations of the Chinese people. Tiga's majestic and powerful power is never used to oppress the weak but to protect the weak, which is also in line with the values of Chinese society. \n\nIn any case, Ultraman Tiga has become a hero and goal in the minds of many Chinese children, and the film is also the most popular Japanese special effects film in China. "
chi_GRnews.29.a: ""We will all become light!""
chi_GRnews.30: "Cardcaptor Sakura"
chi_GRnews.30.t: "Cardcaptor Sakura is on air!"
chi_GRnews.30.d: "In October, Shanghai TV premiered "Cardcaptor Sakura", which was introduced by Guangdong Baishilian Film Development Co., Ltd. Sakura Kinomoto is a 4th grade elementary school student who is good at sports. One day, Sakura returned home from school and found someone in the basement study room which was usually empty. Sakura went down and saw a book shining with golden light. There were cards in it, but when reading the words written on it, a strong wind blew and the cards flew everywhere. At the end of the book, a strange creature named Clow Beros appeared, and the book said something like "When the seal of the Clow Cards is broken, disaster will befall the world" . Then, Keruberos gave the key to the seal to Sakura, making her the magic card catcher who recovered the cards. That night, Sakura used magic to fight the materialized cards...\n\nAffected by the social environment at the time, the TV version had some restrictions on the love plot. In addition, the name of Li Syaoran was changed to "Wang Xiaoming" in the Chinese version, and the content with ghost horror elements in the second episode was also deleted when it was broadcast on TV. The plot of "Mirror" shopping with Touya was also deleted in the TV version because it was irrelevant to the main storyline. In any case, this anime is widely praised by children and teenagers. "
chi_GRnews.30.a: "Now in the name of your master, Sakura, I command you - the seal is lifted!"
chi_GRnews.31: "Slam Dunk"
chi_GRnews.31.t: "Slam Dunk is a big hit!"
chi_GRnews.31.d: "The basketball-themed youth manga "Slam Dunk" created by Japanese manga artist Takehiko Inoue is becoming very popular in China. The story is about a red-haired bad boy named Sakuragi Hanamichi who was dumped by 50 female students in junior high school. After entering Xiangbei High School, he fell in love at first sight with a girl of the same grade named Akagi Haruko whom he met by chance. Under Haruko's expectation, Hanamichi, who knows nothing about basketball rules, joins the basketball team. Under the strict training of Haruko's brother, the captain of the basketball team, Akagi Takenori, and the ignition of the confrontation consciousness against the "super rookie" Rukawa Kaede, Hanamichi's hidden talent finally emerged. At the same time, he was also attracted by the basketball team. After a practice match with a strong rival, Ryonan High School, Ryouta Miyagi, who is short but has flexible athletic ability, and Mitsui Hisayuki, who won the title of county MVP in junior high school, also returned to the team. The greatly improved Xiangbei High School basketball team began to prepare for the Kanagawa Prefecture Qualifiers of the National High School League. In this way, the Xiangbei High School basketball team, led by Sakuragi Hanamichi, ushered in the hottest summer of their lives. \n\nThe comic is widely praised for its upright style, sportsmanship, and fine painting, and it has also set off a basketball fever among young people in our country. "
chi_GRnews.31.a: ""Coach, I want to play basketball""
chi_GRnews.32: "Mobile Suit Gundam"
chi_GRnews.32.t: "Mobile Suit Gundam 00 is extremely popular!"
chi_GRnews.32.d: "On the 6th of this month, Japan aired "Mobile Suit Gundam 00", continuing its usual exquisite style and passionate battles, and also continuing the fanatical pursuit of fans in China."
chi_GRnews.32.a: ""忺はガンダムで行く! (I will attack in Gundam form!)""
chi_GRnews.33: "Yu-Gi-Oh!"
chi_GRnews.33.t: "Yu-Gi-Oh craze"
chi_GRnews.33.d: "A Japanese card game "Yu-Gi-Oh!" is spreading rapidly in our country.\n\n"Yu-Gi-Oh!" is a manga drawn by Japanese manga artist Kazuki Takahashi, and adapted into a TV animation and game. The history of games can be traced back to the ancient Egyptian period 5,000 years ago. Ancient games were used to predict the future of humans and pharaohs, and were magical rituals that determined fate. Those were called dark games. However, a famous boy completed the "Millennium Puzzle", accepted the dark game, and became the embodiment of justice. Light and darkness, the name of the boy with two hearts, is called "Yu-Gi-Oh." In 1998, Bandai launched a collection of cards based on the collection card game that appeared in the original "Yu-Gi-Oh!", which soon became popular all over the world, including our country."
chi_GRnews.33.a: "Are you a card player too?"
chi_GRnews.34: "The Tenth Five-Year Plan"
chi_GRnews.34.t: "The Tenth Five-Year Plan is launched!"
chi_GRnews.34.d: "After detailed formulation and approval by the Party Central Committee and the State Council, all sectors of our society have begun to enter the Tenth Five-Year Plan."
chi_GRnews.34.a: "Full speed ahead!"
chi_GRnews.35: "The Eleventh Five-Year Plan"
chi_GRnews.35.t: "The 11th Five-Year Plan is launched"
chi_GRnews.35.d: "After detailed formulation and approval by the Party Central Committee and the State Council, all sectors of our society have begun to enter the 11th Five-Year Plan."
chi_GRnews.35.a: "Full speed ahead!"
chi_GRnews.36: "The 12th Five-Year Plan"
chi_GRnews.36.t: "The 12th Five-Year Plan is launched"
chi_GRnews.36.d: "After detailed formulation and approval by the Party Central Committee and the State Council, all sectors of our society have begun to enter the 12th Five-Year Plan."
chi_GRnews.36.a: "Full speed ahead!"
chi_GRnews.37: "The Thirteenth Five-Year Plan"
chi_GRnews.37.t: "The 13th Five-Year Plan is launched"
chi_GRnews.37.d: "After detailed formulation and approval by the Party Central Committee and the State Council, all sectors of our society have begun to enter the 13th Five-Year Plan."
chi_GRnews.37.a: "Full speed ahead!"
chi_GRnews.38: "National Day of the People's Republic of China"
chi_GRnews.38.t: "National Day of the People's Republic of China"
chi_GRnews.38.d: "On October 1, 1949, the great Chairman Mao Zedong solemnly announced to the world the establishment of the People's Republic of China and the Central People's Government.\n\nEvery National Day in China, people across the country and enterprises and institutions will hang lanterns or banners with slogans such as "Happy National Day" to celebrate the National Day; bonsai and hydrogen balloons with slogans are placed on the square to welcome the National Day with a joyful atmosphere. On the National Day, the flag of the People's Republic of China is raised at 6:10, the same time as sunrise.\n\nThe great motherland has gone through decades since its birth and will continue to stand proudly on the world stage."
chi_GRnews.38.a: "Long Live the People's Republic of China"
chi_GRnews.39: "Mao Zedong's Birthday"
chi_GRnews.39.t: "Mao Zedong's Birthday"
chi_GRnews.39.d: "December 26, 1893 is Chairman Mao Zedong's birthday. Every year on this day, countless people across the country will spontaneously gather at his former residence in Shaoshan to remember this red giant. Red flags are flying and songs are loud.\n\nOn Tiananmen Square in Beijing, the Chairman's portrait silently watches China's rapid changes over the past decades. At the end of Orange Island in Changsha, the huge young Mao Zedong is looking out at everything in the world."
chi_GRnews.39.a: "Do you remember the time when you were in the middle of a river, paddling in the water and the waves stopping your boat from flying?"
chi_GRnews.40: "Rage Comics"
chi_GRnews.40.t: "Wang Nima uploads the Rage Comic"
chi_GRnews.40.d: "The origin of the rage comic meme was born on 4chan in 2007, and spread to the social network in mainland China around 2008. It not only became popular quickly, but also was localized by netizens. For example, the protagonist of the comic is generally called "Wang Nima", who is the common protagonist of most creations.\n\nIn 2011, a netizen named "Wang Nima" established a Chinese website for publishing and creating rage comics, and provided a "rage comic generator" to allow netizens to freely create their own rage comics. It is said that in February next year, China's Xi'an Momo Information Technology Co., Ltd. will apply to the China Copyright Protection Center for copyright registration of rage comics in mainland China. The company claims that its founder is the creator of the Chinese website and will register the computer software copyright of the rage comic generator."
chi_GRnews.40.a: "Until I took an arrow to the knee..."
chi_GRnews.41: "Armor Hero"
chi_GRnews.41.t: "Armor Hero" is released!
chi_GRnews.41.d: "On the 28th of this month, Shanghai Haha Xuandong Children's Channel broadcast a science fiction special drama called "Armor Hero". The show, from the producer, actors to the filming team, is composed entirely of Chinese people. It is my country's first domestically produced special drama that transforms into a hero. The special drama mainly tells the story of five people, Xinnan, Beimiao, Dongshan, Xizhao and Kunzhong, protecting the earth. Their road is not smooth. The evil and brutal Shadow Emperor, also known as the Shadow King, was jealous of the vitality and vitality of the earth and sent the Shadow Five Elements Demon to invade. The magic spirit stones carried by these Shadow Five Elements Demons have the power of blackening and want to rule the earth. In this way, a contest between light and darkness, justice and evil unfolds on the earth. The five teenagers, as messengers of light, started a battle with the men sent by the Shadow King. They fought to the death. With their wisdom, courage and firm belief, they repelled the enemy again and again, guarding the peace and tranquility of the earth. \n\nOnce the show was broadcast, it received rave reviews, and many children hoped to transform into heroes in the show and fight against the darkness. The producers said that in the face of insufficient domestic creative environment and cultural differences, its core team, especially Wu Weimin, insisted on rooting in Chinese culture, refusing to imitate, and creating heroes with Chinese characteristics. Faced with filming challenges and internal disagreements, they insisted on their original intentions and received support from the chairman, hoping to create anime heroes that belong to the Chinese. Armor Hero incorporates Chinese elements such as "gold, wood, water, fire, earth" and Tai Chi into the design of the characters, rooted in Chinese culture, and created China's own special effects heroes. "
chi_GRnews.41.a: "Armor, combine!"
chi_GRnews.42: "Armor Hero Xingtian"
chi_GRnews.42.t: "Armor Hero Xingtian is released!"
chi_GRnews.42.d: "During the winter vacation on the 7th of this month, children's channels and satellite channels in all provinces across the country simultaneously broadcast the sequel of "Armor Hero" "Armor Hero Xingtian", which won higher ratings based on the popularity of the old work.\n\nSina Entertainment commented that in terms of the cast of this TV series, Li Wei, Wu Haoze, Zhang Yanan and other handsome and distinctive new generation idols were invited to join, injecting endless youthful atmosphere into the new armor series. In addition, the play also introduced the "rich second generation" and "post-80s/90s" that are widely concerned in modern society."Otaku" and other plots have overturned people's consistent negative impressions of the post-80s and post-90s, reflecting the current young people's pursuit of heroism in the new era. The whole TV series is permeated with a positive and just belief in fighting evil. As a new series in the "Armor Hero" series, "Armor Hero Xingtian" relies on gorgeous stunts, upgraded sophisticated weapons and equipment, magnificent scenes, exciting plots, a super production team and a new generation of idol actors, making this film the most anticipated live-action special effects series this year."
chi_GRnews.42.a: "Armor, combine!"
chi_GRnews.43: "Pig Man"
chi_GRnews.43.t: "Pig Man is on air!"
chi_GRnews.43.d: "During the summer vacation this month, CCTV and more than 400 TV stations across the country broadcast the first part of the cartoon "Pig Man" "Pig Man: Magical Pig Age". The story takes place in the distant "Pig Age", an era when pigs ruled the earth. At that time, small animals began to exploit various resources on the earth without restraint, causing the entire earth to be in a mess and the natural environment to be severely damaged. In order to protect the environment and reverse the poor ecological situation of the earth, "Pig Man" overcame many difficulties and finally developed a "magic wisdom ball" with mysterious power, but he fell into a curse that he could only reincarnate after three thousand years and passed away. He left the world. The "Magic Wisdom Ball" was delivered to Wang Xiaoer, who was a chef at the time, and he was told to complete the mission of saving the earth's environment. However, Wang Xiaoer broke his promise and used the "Magic Wisdom Ball" to create his own kingdom, which intensified the damage to the earth's environment and made human survival miserable. Where is "Pig Man", the messenger of environmental protection and the embodiment of justice? Will he come back? What kind of long environmental protection journey will he and his friends face? Can "Pig Man" finally complete his great mission of protecting the earth? \n\nThis little pig in red clothes has been well received, and the Pig Man series will become a classic IP in the history of Chinese animation. "
chi_GRnews.43.a: "GG Bond!"
chi_GRnews.44: "Fantasy novels"
chi_GRnews.44.t: "Fantasy novels have entered their golden age!"
chi_GRnews.44.d: "With the popularization of the Internet and the promotion of mobile reading, fantasy novels are becoming more and more popular.\n\nFantasy novels are a trend that has emerged in mainland China. They are based on fantasy and go further than magic novels. They are freer and not bound by scientific basis. There is more room for imagination. Huang Yi can be regarded as a representative of modern Chinese fantasy novels. The number and variety of Chinese fantasy novels have long included all these elements. One of the most popular cultivation novels on the Internet, "The Journey of Piao Miao", states at the outset: "You may see the continuation of ancient China, you may see advanced civilization, you may see tempting magic weapons, you may see the remains of immortals, you may see ancient castles in the Western Middle Ages, you may see all kinds of strange beasts. This is the Journey of Piao Miao. "Fantasy is a kind of fantasy that is free and unrestrained. The creation of fantasy novels is always free.\n\nDuring this period, many "fantasy writers" emerged - although they themselves may not recognize this identity - such as Chen Dong, Chunqing Xilige, Feng Lingtian, Jing Wuhen, Tiancan Tu Dou, Ni Cangtian, Mao Ni, Tang Jia San Shao, Jiang Nan, etc. In addition, there are countless excellent writers who create silently. At this time, fantasy novels showed a trend of flourishing and contending."
chi_GRnews.44.a: ""I am the Emperor of Heaven, I must kill all enemies in the world!""
chi_GRnews.45: "Fruity Robo"
chi_GRnews.45.t: "Fruity Robo is on air!"
chi_GRnews.45.d: "This month, many TV stations broadcast an animation called "Fruity Robo", which, like the previously popular "Pig Man", was produced by Guangzhou Blue Arc Animation Media Co., Ltd. and directed and written by Wang Wei. This drama is both a sequel to "Jelly Three Musketeers" and the first season of the "Fruity Robo" series. The names of the three protagonists of the animation, Cheng Liuxiang, Pineapple Blowing Snow, and Lu Xiaoguo, are all taken from the names of characters in classic martial arts novels. There are a lot of cultural stalks and ancient poems in the film, which plays an excellent educational role in the joy and cultivates the cultural literacy of children.\n\nHowever, the drama was accused by some people of containing a lot of political metaphors, which are ironic and critical."
chi_GRnews.45.a: "Fruit Robo, return to your position!"
chi_GRnews.46: "There is something wrong with my youth romantic comedy."
chi_GRnews.46.t: "My Teen Romantic Comedy Is Wrong, As I Expected." is a big hit in our country!""
chi_GRnews.46.d: "Last March, the Japanese light novel writer Watari Watari's "My Youth Romantic Comedy Is Wrong, As Expected" became very popular in Japan, and ranked at the top of the "This Light Novel Is Amazing!" evaluation competition for two consecutive years. The light novel quickly spread to Taiwan and mainland my country, attracting the attention of the Chinese-speaking two-dimensional community."
chi_GRnews.46.a: "Youth is a lie and a sin"
chi_GRnews.47: "MikuFans"
chi_GRnews.47.t: "MikuFans website created"
chi_GRnews.47.d: "On June 26, a netizen named 9bishi posted a message claiming that he spent three days improvising a website called "MikuFans" to solve the problem of being unable to connect and log in after the Acfan website crashed, which attracted many Acfan members to use it. After Ac Station resumed normal access, Mikufans, then known as the "A Back Garden", was not shut down. The early creators and maintainers of Mikufans were all from Ac Station.\n\nThe birth of MikuFans is related to the second dimension and a new form of video interaction (bullet screen). The originator of the bullet screen website is the Japanese niconico website."
chi_GRnews.47.a: "It can be seen that he is a member of the Knights"
chi_GRnews.48: "AcFun"
chi_GRnews.48.t: "AcFun website was founded"
chi_GRnews.48.d: "On June 6, a netizen named Xilin announced that he had founded a website called "AcFun" to provide a stable and convenient website for domestic 2D fans. AcFun's initial submission form was to use Sina's player to link Sina's videos, and even the cover was directly from Sina's address. There were 10 submissions on that day, which were: \nAC 1: Haruhi Suzumiya's EVA opening (see AC 16185854) \nAC 2: Foreign One Piece fan AMVAC \n3: The Idolmaster Three Sisters' Passionate Dance Second Episode AC \n4: [New] Devil May Cry Animation Series AC \n5: Monster Hunter Online Wonderful Video AC \n6: Domestic Creative Video: Transformers Warcraft Version AC \n7: PS2 RPG Masterpiece "Persona 3FES" Wonderful OPAC \n8: Final Fantasy Ⅻ Dead Wings Chinese Promotional Video AC \n9: Dynamic New Force: Naruto's New Ten Unforgettable Scenes AC \n10: [Strong serialization] Torture Princess OVA"
chi_GRnews.48.a: "Comic fans all over the world are one family"
chi_GRnews.49: "bilibili"
chi_GRnews.49.t: "MikuFans changed its name to bilibili"
chi_GRnews.49.d: "After creating the MikuFans website in 2009, the founder Bishi (Xu Yi) worked in a financial software company after graduating from university. At the beginning, only Xu Yi and a few netizens maintained the website. After working for more than a year, Xu Yi quit his job and changed MikuFans to bilibili in 2010. It has a barrage system that is different from video barrage websites such as AcFun. Its name bilibili comes from the nickname "Bilibili Discharge Girl" of Misaka Mikoto in the popular animations "A Certain Magical Index" and "A Certain Scientific Railgun" at the time. Since then, the bilibili website has gotten rid of its dependence on AcFun and has become a relatively independent website.\n\nIn the next ten years, bilibili, as China's most distinctive two-dimensional platform, will stand out and develop to a level that all the initial participants can hardly imagine."
chi_GRnews.49.a: "bilibiliCheers-(゜-゜)つロ"
chi_GRnews.50: "Three Body"
chi_GRnews.50.t: "Science Fiction World" begins serializing "The Three-Body Problem"
chi_GRnews.50.d: "This month, the famous science fiction magazine Science Fiction World began serializing a long science fiction novel called The Three-Body Problem, written by Liu Cixin, a computer engineer and science fiction writer who already had a certain reputation. After this issue of the magazine was published, many readers praised Liu Cixin's new work."
chi_GRnews.50.a: "Talented Engineer"
chi_GRnews.51: "The Young Divine Soldiers"
chi_GRnews.51.t: "The Young Heroes of the Magic Army is now on air!"
chi_GRnews.51.d: "On the 4th of this month, the Galaxy Theater of CCTV Children's Channel will broadcast an animation called "The Magical Weapons" every night at 8:30, and it will be replayed at 9:30 the next morning. This film is adapted from the comic "The Mysterious Magical Weapons" created by Wong Yuk-long. It tells the story of the adventure and growth of the magical soldiers led by the young Nangong Wentian and his companions who fight against violence and harm for the people, and become little heroes after the world becomes peaceful after the struggle between good and evil. \n\nThe People's Daily commented that in addition to retaining Wong Yuk-long's inherent bright rhythm and style, the film also adds bright colors and cute character movements that children love in the painting style. The film tells an original story about a legendary little hero, integrating the awareness of environmental protection and maintaining ecological harmony under the theme of family affection, and expressing the relationship between humans and nature. The importance of maintaining mutual dependence and trust between creatures in the natural world. "The Magic Weapon" has a compact plot and modern character design. In particular, the film incorporates a large number of film art elements and realistic camera movements in the all-hand-painted animation, and uses advanced 3D computer software and image processing programs for flat animation processing, showing the unique painting characteristics and style of Wong Yuk-long. \n\nThis cartoon has a high ratings and has become the most popular cartoon broadcast on CCTV Children's Channel this year. In addition to its popularity, another feature of this film is that Hong Kong and Taiwan participated in the production. The original author and the producer are both from Hong Kong, and the theme song "The Light of Dreams" is sung by the famous Taiwanese singer Cyndi Wang. This film also represents the good cooperation and cultural exchanges between the mainland and Hong Kong and Taiwan to a large extent. "
chi_GRnews.51.a: "I have courage and I am not afraid, no matter if it is winter or summer. I am strong and I take big steps, I cannot stop."
china.65.: "Bilibili's influence is growing day by day"
china.65.t: "Bilibili's influence is growing day by day"
china.65.d: "Bilibili's influence in my country continues to increase, and it has become one of the largest video websites in China.\n\nBilibili has 15 content sections, including animation, TV series, domestic creation, music, dance, games, knowledge, life, entertainment, ghost animal, fashion, and screening rooms. Life, entertainment, games, animation, and technology are the main content categories of Bilibili, and it has opened business sections such as live broadcast, game center, and peripherals. Bilibili is becoming the primary battlefield for young people to learn; according to Bilibili data, the learning live broadcast, which is called #study with me# by users, has been promoted to the longest live broadcast category on Bilibili; in 2019, the time spent by users on live learning on Bilibili exceeded 2 million hours."
china.65.a: "Cheers to bilibili- (゜-゜)つロ"

