#Diplomatic Policy
CHI_great_power_diplomacy: "Great Power Diplomacy"
CHI_great_power_diplomacy_desc: "§YHeroes are revealed in times of turbulence, and pillars of support are revealed in times of stormy waves§!\n\nChina's great power diplomacy is the inheritance and development of the diplomatic ideas and concepts that have been consistent since the founding of the People's Republic of China in the new era."
CHI_carrots: "Gentle and Nestraint"
CHI_carrots_desc: "To win over distant peoples with enlightened virtue is the essence of judicious governance.\nWhen tenderness embraces the far-off, who would not answer its call?"
CHI_European_Diplomacy: "Looking Towards Europe"
CHI_European_Diplomacy_desc: "Europe is an important source of multipolar power in today's international community, and maintaining good relations with them and actively promoting cooperation is essential."
CHI_European_cultural_exchange: "China-Europe Cultural Exchange"
CHI_European_cultural_exchange_desc: "As we actively promote our culture to the outside world, more and more people in European countries are becoming curious about our land. We will hold a grand cultural festival to promote the excellent culture of Chinese civilization."
CHI_Developing_European_tourism: "Implementing Visa-Free Transit"
CHI_Developing_European_tourism_desc: "In recent years, our comprehensive strength has been continuously improved, and the visa-free transit policy allows European friends to directly understand the achievements of China's modernization over the past decades."
CHI_European_Signing_trade_agreement: "Trade and Trade Cooperation Agreement"
CHI_European_Signing_trade_agreement_desc: "Given our strong reputation in Europe and the excellent quality of Chinese-made goods, we were able to sign a series of friendly commercial and trade cooperation agreements locally." 
CHI_European_Advanced_technology_cooperation: "Cutting-edge Technology Cooperation"
CHI_European_Advanced_technology_cooperation_desc: "In various cutting-edge technology fields, European countries often lack the scale to independently support the development of these technologies. We can leverage our market share in exchange for cooperation in these areas."
CHI_Emphasis_Western_Europe: "Focus on Western Europe"
CHI_Emphasis_Western_Europe_desc: "Europe has many countries, so we must choose a key region. The United States has significant influence in Western Europe, and we should find ways to counter this force to weaken American hegemony."
CHI_Emphasis_Eastern_Europe: "Focus on Eastern Europe"
CHI_Emphasis_Eastern_Europe_desc: "Europe has many countries, so we must choose a key region. Historically, many Eastern European countries have had good relations with us, making it worthwhile to cultivate influence in this region."
CHI_Emphasis_Southern_Europe: "Focus on Southern Europe"
CHI_Emphasis_Southern_Europe_desc: "Europe has many countries, so we must choose a key region. Various conflicts and contradictions are very common in Southern Europe.Maintaining local stability and actively spreading influence is a choice that presents both opportunities and challenges."
CHI_Expanding_Market_to_Target: "Expanding into the European Market"
CHI_Expanding_Market_to_Target_desc: "Our factory produces high-quality, low-priced products in large quantities. We believe it won't be long before Europe becomes reliant on 'Made in China' products."
CHI_Talent_Exchange_to_Target: "Promoting Talent Exchange"
CHI_Talent_Exchange_to_Target_desc: "A nation cannot be built without talent, especially highly skilled talent. A good educational environment and broad employment opportunities should attract many European talents to settle in China."
CHI_Building_Tomorrow_to_Target: "Creating a Better Tomorrow Together"
CHI_Building_Tomorrow_to_Target_desc: "After countless efforts, the relationship between Europe and China is becoming increasingly close. Let us work together to build a new future!"
CHI_increase_EU_eurosceptic: "Inspire regional nationalism"
CHI_increase_EU_eurosceptic_desc: "We will convince Europeans that forming the EU was a mistake because the entire EU is inefficient and bloated."
CHI_decrease_EU_eurosceptic: "Reconcile internal conflicts within Europe"
CHI_decrease_EU_eurosceptic_desc: "As it turns out, European countries are far more similar than different, and after we actively coordinate and resolve internal conflicts within Europe, more Europeans will believe that European integration is the right thing to do."

CHI_Wolf_Warriors_diplomacy: "Wolf Warrior Diplomacy"
CHI_Wolf_Warriors_diplomacy_desc: "If you answer hostility with grace, what is left for gratitude?\nAnswer hostility with integrity, and grace with grace."
CHI_South_China_Sea_issue: "South China Sea Issue"
CHI_South_China_Sea_issue_desc: "The strategic and economic importance of the South China Sea cannot be overstated. For thousands of years, my country has had unquestionable sovereignty and jurisdiction over the South China Sea. However, in modern times, due to various reasons, neighboring countries have illegally occupied many islands and reefs in the South China Sea, leaving the South China Sea that originally belonged to my country fragmented. We should carefully choose our diplomatic countermeasures, uphold a win-win attitude, and achieve diplomatic victory."
CHI_Communicate_with_Malaysia: "Communicate with Malaysia"
CHI_Communicate_with_Malaysia_desc: "We have already achieved diplomatic success with Vietnam and the Philippines. Malaysia's territorial claims to the South China Sea islands are not as strong as those of the other two countries, and we can follow suit to reclaim the last island."
CHI_Strengthen_patrols_South_China_Sea: "Routine Patrols in South China Sea"
CHI_Strengthen_patrols_South_China_Sea_desc: "The South China Sea is an inseparable part of China. In the past, our navy was too weak to patrol this area, but now it's different."
CHI_Expanding_Island_South_China_Sea: "Expanding Island Facilities"
CHI_Expanding_Island_South_China_Sea_desc: "The natural conditions of the islands in the South China Sea were extremely harsh. Thanks to advancements in industrialization, we are now able to change this situation."
CHI_Increase_investment_in_ASEAN: "Increasing Investment in ASEAN"
CHI_Increase_investment_in_ASEAN_desc: "We will increase investment in ASEAN countries to develop local economies, which is necessary to demonstrate goodwill in cooperation."
CHI_Taiwan_issue: "Taiwan issue"
CHI_Taiwan_issue_desc: "There is only one China in the world. Taiwan is China's inalienable sacred territory and a flower of China that must be plucked on the road to the great rejuvenation of the Chinese nation. Solving the Taiwan issue and achieving complete reunification of the motherland is the Party's unswerving historical mission, the common aspiration of all Chinese people, and the inevitable requirement for realizing the great rejuvenation of the Chinese nation. We must adhere to and implement the Party's overall strategy for solving the Taiwan issue in the new era, firmly grasp the dominant position and initiative in cross-strait relations, and unswervingly advance the great cause of national reunification."
CHI_Peaceful_Co_Existence: "Peaceful Resolution"
CHI_Peaceful_Co_Existence_desc: "Taiwan is our country's inherent territory, and the Taiwanese people are our compatriots. We should show a more gentle love to the children of the motherland."
CHI_Settle_Territorial_Disputes: "Island ownership is clear"
CHI_Settle_Territorial_Disputes_desc: "Taiwan controls many islands that we consider to be part of Fujian, Guangdong, Hainan, etc. We could gain concessions by recognizing Taiwanese authority over these islands."
CHI_Sign_an_Armistice: "One Country, Two Systems Commitment"
CHI_Sign_an_Armistice_desc: "'One country, two systems' is a great innovation of socialism with Chinese characteristics and the best institutional arrangement for maintaining long-term prosperity and stability in Hong Kong and Macao after their return. Many Taiwan compatriots are concerned about the administrative nature of Taiwan after its return. We can allay their concerns with the promise of establishing a special administrative region."
CHI_people_to_people_exchange: "People-to-people exchange"
CHI_people_to_people_exchange_desc: "People on both sides of the coast have long had in-depth exchanges through various platforms and channels. Mutual recognition and acceptance among the people is the best driving force for our unification."
CHI_Development_Assistance_TAI: "Development Assistance"
CHI_Development_Assistance_TAI_desc: "Taiwan does not have enough capacity to renovate its dilapidated cities, nor does it have the capacity to expand its advantageous industries. We can certainly take care of this child in need."
CHI_Rigging_elections: "Rigging elections"
CHI_Rigging_elections_desc: "If the Taiwan authorities cannot ensure that the anti-independence Blue Camp comes to power, then we will "boost" the Blue Camp..."
CHI_Joint_military_exercises_TAI: "Taiwan Strait Joint Military Exercises"
CHI_Joint_military_exercises_TAI_desc: "To jointly conduct a large-scale military exercise involving all aspects of the sea, land and air forces in the Taiwan Strait will not only shatter the last fantasy of all separatists, but also show the world that the cause of Taiwan's return is unstoppable."
CHI_Establish_Taiwan_SAR: "Establish Taiwan Special Administrative Region"
CHI_Establish_Taiwan_SAR_desc: "Now that preparations are complete, it is time for the people of Taiwan to reunite with their mainland compatriots as part of the People's Republic of China. Although Taiwan still retains a degree of autonomy, our goal of unifying the motherland has now been achieved. After decades, our country is finally intact, and the last pearl on the road to the great rejuvenation of the Chinese nation has finally returned home."
CHI_Warning_to_the_United_States: "Warning to the United States"
CHI_Warning_to_the_United_States_desc: "Taiwan is China's Taiwan. Solving the Taiwan issue is the Chinese people's own business and should be decided by the Chinese people. We are about to liberate Taiwan, and the United States must fulfill their promise not to interfere in China's internal affairs."
CHI_Resume_the_Civil_War: "Continue the Civil War"
CHI_Resume_the_Civil_War_desc: "After the liberation of Hainan Island in 1950, the people's democratic dictatorship of the socialist republic has been established in mainland my country, overthrowing the reactionary rule of imperialism, feudalism, and bureaucratic capitalism. However, the reactionary group of Chiang Kai-shek fled to Taiwan, occupied the island as a bandit, split our political power, and undermined our territorial integrity. In order to liberate our compatriots in Taiwan, we must persist in the revolutionary struggle. We will sweep away all the monsters and demons that hinder the reunification of the motherland."
CHI_Towards_the_final_victory: "Towards the final victory..."
CHI_Towards_the_final_victory_desc: "Listen! The wind is whistling and the bugle is sounding!\nListen! The revolutionary songs are so loud!\nComrades march in unison to the battlefield of liberation\nComrades march in unison to the frontiers of the motherland"
CHI_Towards_the_liberation_of_the_whole_country: "Towards the liberation of the whole country!"
CHI_Towards_the_liberation_of_the_whole_country_desc: "We will issue an ultimatum to the Taiwan authorities. It would be best if they could recognize the current situation and surrender to us. Of course, we are also prepared for a full-scale offensive."
CHI_End_of_ROC: "Returning in Victory"
CHI_End_of_ROC_desc: "The liberation war of the motherland ended with the comprehensive victory of the People's Liberation Army and the Central People's Government. The imperialist reactionaries have been completely eliminated from China. Taiwan, the pearl of the sea, has finally wiped off decades of dust and returned to the united family of the motherland."
CHI_ultimatum: "Ultimatum"
CHI_ultimatum_desc: "Give the Taiwan authorities one last chance to resolve the issue peacefully. China will surely be unified. Don't say I didn't warn you."
CHI_rule_all_the_land: "All the land is unified"
CHI_rule_all_the_land_desc: "§YThe Four Seas Are One Family, the Two Rivers and Hundreds of Counties Are the Mountains and Rivers of the Song Dynasty§!\n\nThe historical wheel of national reunification and national rejuvenation is rolling forward. The complete reunification of the motherland must be achieved and will certainly be achieved. Today, we have finally completed the reunification of the socialist motherland. The great journey of socialism with Chinese characteristics has taken another step forward. The great cause of the great rejuvenation of the Chinese nation is even closer to us!"
CHI_the_Middle_East: "Middle East"
CHI_the_Middle_East_desc: "The Middle East is one of the most important regions in Asia. After the end of World War II, due to the complicated situation and the discovery of rich oil resources, it once became a chessboard for superpowers. Conflicts occurred frequently and the people of the Middle East lived in dire straits. As a responsible major country, we have the obligation to maintain stability and balance in the Middle East while expanding our influence."
CHI_Scholars_on_the_Silk_Road: "Scholars on the Silk Road"
CHI_Scholars_on_the_Silk_Road_desc: "Iran is one of the famous ancient civilizations. The hardworking and brave ancient Persian people created a brilliant culture, especially in medicine, astronomy, mathematics, agriculture, architecture, music, philosophy, history, literature, art and crafts. Our two countries should cherish the historical friendship and deepen the cooperation in the contemporary era."
CHI_Invite_to_join_the_SCO: "Invite Iran to join the SCO"
CHI_Invite_to_join_the_SCO_desc: "Iran's geopolitical demands coincide with ours. The SCO was established to maintain regional stability and promote the development of its member states. We should invite this Middle Eastern brother to join the SCO to further deepen and coordinate our cooperative relationship."
CHI_Development_Assistance_PER: "Iran Development Assistance"
CHI_Development_Assistance_PER_desc: "Iran is cautious about international aid. Affected by US sanctions and long-term diplomatic isolation from the West, it rarely accepts aid from international organizations, international financial institutions and other countries. Even if it does, it is carried out in the name of international cooperation, mostly in the non-sanction humanitarian field, mainly in the form of materials, and on a small scale. We will help Iran build its economy in the form of signing commercial orders."
CHI_Strategic_partners_PER: "Strategic Partners"
CHI_Strategic_partners_PER_desc: "The interests of the Chinese people are certainly in line with those of the Iranian people. The cooperation between China and Iran should be further deepened to form a deep strategic partnership."
CHI_Oil_Kingdom: "Oil Kingdom"
CHI_Oil_Kingdom_desc: "Saudi Arabia is one of the countries with the largest oil reserves in the world. Building a friendly dialogue platform with this royal and supreme oil kingdom will help strengthen our influence in the Middle East."
CHI_order_for_goods_of_SINOPEC: "Order for Sinopec"
CHI_order_for_goods_of_SINOPEC_desc: "China needs to import a large amount of oil every year, and Saudi Arabia is one of our largest oil importers. We can deepen our economic exchanges with Saudi Arabia by signing an oil order with the state-owned enterprise Sinopec, while assisting Saudi Arabia's oil production. Of course, the money is actually paid by the government."
CHI_Silk_Road_tycoon: "Silk Road Tycoon"
CHI_Silk_Road_tycoon_desc: "The Belt and Road Initiative is of course inseparable from the wealthy Saudi Arabia. Although Saudi Arabia is not a poor and backward country, it imports a large number of domestic consumer and industrial products every year. We can provide sufficiently affordable sellers through the The Belt and Road Initiative strategy."
CHI_Selling_Arms_SAU: "Selling Arms"
CHI_Selling_Arms_SAU_desc: "We have a history of arms trade with Saudi Arabia. Saudi Arabia needs enough sophisticated weapons to protect itself. The weapons we manufacture are of good quality and low price. The Saudi Arabian royal family is very fond of purchasing our arms. We can deepen the exchanges between the two sides and stimulate the development of the domestic military industry by selling arms to Saudi Arabia."
CHI_cradle_of_civilization: "Cradle of Civilization"
CHI_cradle_of_civilization_desc: "Iraq has a long history, and the Mesopotamian Valley is one of the cradles of ancient civilizations. This ancient civilization is now devastated. The crimes committed by the US imperialist lackey army in the name of the war on terror are too numerous to list. We should establish friendly and cooperative relations with this suffering country. This is the common wish and demand of the people of both countries."
CH_Icultural_exchange_IRQ: "Cultural Exchange with Iraq"
CH_Icultural_exchange_IRQ_desc: "China and Iraq are both one of the four ancient civilizations and have a historical consensus. We will start with the brilliant ancient cultural achievements and friendly exchanges between the two countries to warm up the exchanges between the two governments."
CH_Oil_orders: "Purchase Iraqi Oil"
CH_Oil_orders_desc: "Iraq is my country's third largest source of crude oil imports, and my country is Iraq's largest trading partner. Purchasing more oil will greatly promote the deepening of cooperation between the two countries and expand my country's economic influence on Iraq."
CHI_Silk_Road_IRQ: "The Belt and Road Initiative Expansion"
CHI_Silk_Road_IRQ_desc: "Iraq is generally a relatively poor and backward Asian country. Under the background of the Belt and Road Initiative, my country has an obligation to help Iraq develop its domestic construction."
CHI_The_Diaoyu_Islands_issue: "The Diaoyu Islands issue"
CHI_The_Diaoyu_Islands_issue_desc: "The Diaoyu Islands and its affiliated islands have been China's inherent territory since ancient times, and China has sufficient historical and legal basis for this. Japan has ignored a large number of historical facts and claimed that the Diaoyu Islands are Japan's "inherent territory". It has illegally occupied the islands for a long time, seriously infringing on my country's territorial sovereignty and undermining my country's territorial integrity. We must strike a blow to the stubborn Japanese nationalists as soon as possible."
CHI_Provocative_Fleet_Exercises: "Provocative Fleet Exercises"
CHI_Provocative_Fleet_Exercises_desc: "To safeguard our sovereignty over the Diaoyu Islands and the East China Sea, we should utilize the People's Liberation Army Navy to conduct naval exercises in the waters of the Diaoyu Islands. While to us this action represents a legitimate expression of our sovereignty, the United States and other countries may view this action as a threat and risk armed confrontation by sending naval forces to the region as well."
CHI_Demand_a_Withdrawal: "Demand a withdrawal of U.S. troops from Okinawa"
CHI_Demand_a_Withdrawal_desc: "The U.S. military base in Okinawa is a nail planted at the gate of our sea, ready to pierce the heart of our navy, which is not yet strong. If my country wants to achieve great rejuvenation, it must clean up the house and get rid of cockroaches, rats and imperialism."
CHI_Questioning_Okinawa_sovereignty: "Questioning Japan's sovereignty over Okinawa"
CHI_Questioning_Okinawa_sovereignty_desc: "Okinawa was originally called Ryukyu. It was a vassal state of China during the Ming and Qing dynasties. Okinawa was the name imposed by Japan after it seized the place. After Japan's defeat in World War II, it was occupied by the United States, which was called "takeover" by the United States. In 1971, the United States and Japan secretly signed the "Okinawa Reversion Agreement". In May 1972, the administrative power of Okinawa was illegally transferred to Japan by the United States. Since then, Japan has illegally exercised jurisdiction over Okinawa.\nOkinawa is an independent country and a friendly neighbor of our country. Japan must end its illegal occupation of other countries!"
CHI_Strike_Across_the_Himalayas: "Recover Southern Tibet"
CHI_Strike_Across_the_Himalayas_desc: "Southern Tibet is the place with the most complete mountain vertical natural belts in the world, and it is also an important place to observe global climate change. However, such a piece of motherland land has been illegally occupied by the Indian authorities for a long time, and the local residents cannot return to their motherland. We must maintain the territorial integrity at all costs!"
CHI_maintain_order: "Maintain World Order"
CHI_maintain_order_desc: "The world has fallen into chaos. The great powers only care about their own interests and no longer maintain world peace. China will represent the army of justice to wipe out all imperialist invaders. We will rebuild a peaceful world order."
CHI_The_Northern_Shiled: "The Northern Shield"
CHI_The_Northern_Shiled_desc: ""To reclaim Xinjiang is to protect Mongolia, to protect Mongolia is to defend the capital"\n\nAlthough Outer Mongolia was separated from China by a treaty reached between the great powers and the cowardly Nationalist government at the end of World War II, our people have never forgotten that Mongolia is always an inseparable part of our country. We must exert our influence in this region."
CHI_Maintaining_Mongolia_independence: "Maintaining the independence of Outer Mongolia"
CHI_Maintaining_Mongolia_independence_desc: "Outer Mongolia has been independent for decades. We cannot ignore the risk of military conflict with the north and should continue to maintain the status quo of the region as a buffer zone."
CHI_Mongolia_joins_the_SCO: "SCO Expansion"
CHI_Mongolia_joins_the_SCO_desc: "Cooperation with Mongolia has been very successful, and the SCO's goal is to maintain regional stability and promote the development of its members, which means that further expansion of the SCO is a natural progression."
CHI_Mongolian_Mineral_Rights: "Mongolian Mineral Rights"
CHI_Mongolian_Mineral_Rights_desc: "We will provide economic support and assistance in addressing environmental issues in exchange for the right to use local resources in Mongolia, which is a win-win situation for both sides."
CHI_PER_SAU_compromise: "Saudi Arabia Reconciliation"
CHI_PER_SAU_compromise_desc: "Due to historical and political reasons, Saudi Arabia and Iran have deep diplomatic rifts and even hostility. If these two regional powers always maintain tense relations, it will be detrimental to maintaining peace and stability in the Middle East. Fortunately, we have a certain influence on both countries. Perhaps we can act as a peacemaker and try to ease the Saudi-Iranian relationship as much as possible."
CHI_utilize_Industrial_dependence: "Utilize Industrial Dependence"
CHI_utilize_Industrial_dependence_desc: "In the past, we were a backward manufacturing country that received industrial transfer from developed countries. Today, we are a superpower that controls the lifeline of global production. The era of one country exploiting another should be over. We must unite with other exploited countries to resist the international privileged interest system centered on the United States!"
CHI_aer_aer_port: "Aer Aer Port"
CHI_aer_aer_port_desc: "Saudi Arabia and Iraq have had an abnormal relationship for many years. We understand that Saudi Arabia hopes to bring Iraq closer to itself in the game with Iran. We can take this opportunity to promote the gradual normalization of relations between the two countries and expand our voice in the Middle East."
CHI_Oppose_international_exploitation: "Oppose international exploitation"
CHI_Oppose_international_exploitation_desc: "The existing interest system can only be maintained if there are particularly large and powerful beneficiaries. The international order led by the United States is generally supported by developed countries, and they are also the beneficiaries of this order. Through industrial transfer, labor outsourcing, stock market manipulation and other forms, these developed countries have maintained their superior status on the basis of exploiting backward countries. We should let them join the struggle against US hegemony - unless they intend to continue to maintain their status as US lackeys."
CHI_End_US_Hegemony: "End of US Hegemony"
CHI_End_US_Hegemony_desc: "The hegemony order needs three kinds of power as its foundation, namely material power, institutional power and legal power. For a long time, the United States has relied on its unique international status and advantages to bully every country in the world and make all countries pay for its outrageous behavior. The global financial crisis in 2008 was both the peak of the US hegemony order and the beginning of its abdication. Today, with the great rejuvenation of the Chinese nation, my country has surpassed the United States in comprehensive national strength. The era of US hegemony as an old order has ended, and the imperial capitalism represented by US imperialism has reached its end."
CHI_The_Fate_of_the_Paracels: "Negotiations with Vietnam"
CHI_The_Fate_of_the_Macclesfield_Bank: "Negotiations with the Philippines"
CHI_national_security: "National Defense Security"
CHI_national_security_desc: "The people of African countries are subject to political instability and military threats at any time. As friends of the African people and third world countries, we need to help them protect their own security and strengthen national defense."
CHI_Friends_of_Africa: "Friends of Africa"
CHI_Friends_of_Africa_desc: "With our country's continuous assistance, this ancient and vibrant continent of Africa is slowly recovering. In the past, we were carried into the United Nations by our African brothers, and now we deserve the title of Friends of Africa."
CHI_Questioning_Treaty_of_Aigun: "Questioning the Treaty of Aigun"
CHI_Questioning_Treaty_of_Aigun_desc: "The corrupt and incompetent Qing government was forced to sign the Treaty of Aigun in 1858, which established Tsarist Russia's dominance in the Far East. However, this was clearly an unequal treaty. With the rise of our military strength and international standing, the Treaty of Aigun must be abolished, and Outer Manchuria must be returned!"
CHI_dialogue_based_on_strength: "Diplomacy based on strength"
CHI_dialogue_based_on_strength_desc: "In recent years, our military has made rapid progress, and its current military strength is no weaker than that of this so-called world hegemon. However, they are still living in the old era. It's time to give them a good wake-up call."
CHI_Support_Sikkim_Independence: "Support Sikkim's independence"
CHI_Support_Sikkim_Independence_desc: "The Kingdom of Sikkim was illegally annexed by India in 1975. Now our war against India is going very smoothly. We should help them gain independence from India and provide them with assistance to counter India."
CHI_Far_East_Infrastructure: "Far East Infrastructure"
CHI_Far_East_Infrastructure_desc: "The immense potential of this land remains largely untapped. Our first step is to build better roads."
CHI_Far_East_Resource_Extraction: "Far East Resource Extraction"
CHI_Far_East_Resource_Extraction_desc: "With communication issues resolved in this region, the next step is to expand investment in resource extraction."
CHI_Prosperous_Far_East: "A Prosperous Far East"
CHI_Prosperous_Far_East_desc: "It has been proven that even after so long outside our control, this land can still be a thriving and prosperous society!"
CHI_A_Shameful_Beginning: "Remembering Historical Humiliations"
CHI_A_Shameful_Beginning_desc: "The aggression of European countries since modern times is the key reason why China has fallen into a crisis of survival. We must never forget this."
CHI_Seize_Right_to_Speak: "Seizing the Right to Speak"
CHI_Seize_Right_to_Speak_desc: "The international community is still rife with blind worship of Europe, presenting a rare opportunity to resolve the issues after the collapse of American hegemony."
CHI_Anticolonial_Propaganda: "Anti-colonial Propaganda"
CHI_Anticolonial_Propaganda_desc: "While the Western world no longer outwardly colonizes other countries, it continues its covert colonization of underdeveloped regions. We must expose their mask of civilization."
CHI_European_Crimes: "Judging European Crimes"
CHI_European_Crimes_desc: "European nations must recognize the colonial crimes they committed against China, and indeed against the vast majority of Asian, African, and Latin American countries, and pay the real price for them!"

##Military National Policy##
CHI_Peoples_Liberation_Army: "§YChinese People's Liberation Army§!"
CHI_Peoples_Liberation_Army_desc: "The Chinese People's Liberation Army is the most important armed force in our country. In order to ensure that our country can have a people's army that adapts to the changes of the new era and defends our great motherland and the people, we must strengthen the people's army."
PLA_Sharp_tools_make_good_work: "If you want to do a good job, you must first sharpen your tools."
PLA_Sharp_tools_make_good_work_desc: "To do one's work well, one must first sharpen one's tools. Spiritual strength and strategic decision-making are certainly important factors affecting the combat capability of the army, but we should make full use of our strong industrial manufacturing capabilities to provide material support for the army."
CHI_Expand_THE_CSIC: "Expand CSIC"
CHI_Expand_THE_CSIC_desc: "China State Shipbuilding Corporation is one of the two largest shipbuilding groups in my country, the other being China Shipbuilding Industry Corporation. Investing in CSIC will help develop the shipbuilding industry in northern China, where CSIC is most active."
PLA_Bobcat_all_terrain_vehicle: "Bobcat All Terrain Vehicle"
PLA_Bobcat_all_terrain_vehicle_desc: "The Bobcat all-terrain vehicle is a highly practical and versatile vehicle developed by my country. It can adapt to the needs of various situations and is easy to match with different arms and equipment."
PLA_officer_training_system: "Officer Training"
PLA_officer_training_system_desc: "The core of officer professionalization is specialization. We should train a group of military talents who can adapt to the new era military environment and be familiar with the new era military theory to inject fresh blood into the officer group."
PLA_Concentration_of_command_authority: "Concentration of command authority"
PLA_Concentration_of_command_authority_desc: "The way to be a general is to first govern one's mind.Lofty ideals and firm beliefs are the soul of revolutionary soldiers and the decisive factors in defeating the enemy and resisting corruption. We must firmly grasp the fundamental direction of cultivating people with moral integrity, focus on cultivating revolutionary soldiers of the new era with "four qualities", and highlight the Party's innovative theoretical education and ideological and political education as the key content of officer education and training. From basic education to promotion education, from lieutenant officer training to general officer training, from command and management officers to professional and technical officers, we must always clearly build a road of faith and establish loyalty and virtue, and truly pass on the red gene from generation to generation to ensure that all officers and soldiers of the army unswervingly listen to and follow the Party."
PLA_Network_information_support: "Network Information Support"
PLA_Network_information_support_desc: "The adjustment and establishment of the information support force is a major decision made by the CPC Central Committee and the Central Military Commission from the overall perspective of strengthening the military. It is a strategic measure to build a new type of military structure and improve the modern military force system with Chinese characteristics. It has great and far-reaching significance for accelerating the modernization of national defense and the military and effectively fulfilling the mission and tasks of the people's army in the new era. The information support force is a newly created strategic branch of the military and a key support for the overall construction and use of the network information system. It plays an important role and has great responsibilities in promoting the high-quality development of our army and winning modern wars."
PLA_Reserve_Force: "People's Liberation Army Reserve Force"
PLA_Reserve_Force_desc: "The reserve forces are composed of a small number of active-duty soldiers as the backbone, with reserve officers and soldiers as the basis. They are organized according to the unified organization of the Chinese People's Liberation Army and belong to the People's Liberation Army. In peacetime, they conduct military training according to the plan of the General Staff, strive to improve their military quality and rapid mobilization capabilities, and can assist in maintaining social order in accordance with legal provisions when necessary. In wartime, they will be transferred to active-duty forces according to the mobilization order issued by the state."
PLA_National_University_of_Defense_Technology: "National University of Defense Technology"
PLA_National_University_of_Defense_Technology_desc: "Virtue and knowledge make the army strong and the country prosperous. The National University of Defense Technology is located in Changsha, Hunan Province. It is a comprehensive military university directly under the leadership of the Central Military Commission of the Communist Party of China. It has always been a key institution for the state and the military. Since the founding of the People's Republic of China, the National University of Defense Technology has cultivated countless military talents for the motherland and made great contributions in the field of military technology research."
CHI_CPLA: "§YThe People's Liberation Army Air Force§!"
CHI_CPLA_desc: "The The People's Liberation Army Air Force was formally established on November 11, 1949. After continuous development and construction, the Chinese Air Force has developed into a modern high-tech military force composed of multiple arms such as aviation, surface-to-air missile, anti-aircraft artillery, radar, airborne, electronic warfare, and meteorology, and multiple aircraft types such as fighters, attack aircraft, bombers, and transport aircraft."
PLA_fighter_production: "Strengthen fighter production"
PLA_fighter_production_desc: "Fighters are the mounts and soul of the Air Force. We should develop cutting-edge aviation technology as quickly as possible and update our backward fighter designs."
PLA_domestic_helicopter_production: "Strengthen helicopter production"
PLA_domestic_helicopter_production_desc: "Helicopters play an important role in modern battlefields. We should follow up on research and development in this field as soon as possible."
PLA_Pilot_privileges: "Pilot Privileges"
PLA_Pilot_privileges_desc: "The cost of training an excellent pilot is more expensive than manufacturing an aircraft. We should increase the cost of training pilots and quickly train a group of flying talents."
PLA_Aerial_reconnaissance: "Aerial Reconnaissance"
PLA_Aerial_reconnaissance_desc: "When necessary, our aircraft can spy on the enemy's military intelligence and provide support for frontal battlefield operations."
PLA_Ground_support: "Offensive and defensive"
PLA_Ground_support_desc: "In the new era, the Air Force must be able to complete traditional defensive tasks while strengthening long-range precision strikes and strategic delivery capabilities."
PLA_Chain_team_attack: "Integration of air and space"
PLA_Chain_team_attack_desc: "Not only that, it is also necessary to integrate the traditional aviation field with the aerospace field to form a full-domain combat capability across the atmosphere."
PLA_Advanced_fighter_research: "Advanced fighter research and development"
PLA_Advanced_fighter_research_desc: "Every country has its own ideas about the next generation of fighter jets, and we are no exception."
CHI_PLAN: "§CPeople's Liberation Army Navy§!"
CHI_PLAN_desc: "People's Liberation Army Navy was established on April 23, 1949. People's Liberation Army Navy consists of ship forces, submarine forces, aviation forces, marines, coastal defense forces, etc., and has the ability to fight on the surface, underwater, and in the air. The main task of People's Liberation Army Navy is to independently or in coordination with the Army and Air Force to defend against enemy invasion from the sea, safeguard territorial sovereignty, and safeguard maritime rights and interests."
PLA_Blue_Water_Navy: "Blue Water Fleet"
PLA_Blue_Water_Navy_desc: "In the past, our naval construction strategy was a defensive fleet for near-shore operations. As maritime sovereignty becomes increasingly important in this era, we should change our naval construction strategy. It is urgent to build a blue-water fleet with ocean-going combat capabilities."
PLA_Optimize_our_fleet: "Optimize our fleet"
PLA_Optimize_our_fleet_desc: "We first need to update our combat mode and train our navy in a more modern way."
PLA_World_class_Navy: "World-class Navy"
PLA_World_class_Navy_desc: "Building a strong modern navy is an important symbol of building a world-class military, a strategic support for building a maritime power, and an important part of realizing the Chinese dream of the great rejuvenation of the Chinese nation. On the journey of the new era, in the struggle to realize the great rejuvenation of the Chinese nation, the task of building a strong people's navy has never been as urgent as it is today."
CHI_CPLA_Ground_Force: "§GPeople's Liberation Army Ground Force§!"
CHI_CPLA_Ground_Force_desc: "The People's Liberation Army Ground Force is the main branch of the People's Liberation Army and the main force in land operations. It has the longest history among all branches of the People's Liberation Army and has performed the best in all operations before and after the founding of New China. It is also the backbone of socialist modernization and various disaster relief efforts."
PLA_Listen_to_the_Partys_command: "§YListen to the Party's Command§!"
PLA_Listen_to_the_Partys_command_desc: "§YThe golden star shines on the military flag. Our principle is that the CPC commands the gun§!\nListening to CPC's command is not only the soul of our army, but also the key to our army's governance and the most important quality of a soldier. Listening to the CPC's command is not an empty slogan, but a real and practical action."
PLA_Can_win_battles: "§YCan Win Battles§!"
PLA_Can_win_battles_desc: "There is no first in civil affairs and no second in military affairs. If the army cannot win, everything else is equal to zero. To achieve the goal of strengthening the army, our army must be able to go up and win at any time and under any circumstances. This is the fundamental requirement of the Party and the people for the army, and it is the fundamental embodiment of our army's fulfillment of its functions and mission."
PLA_Excellent_style: "§YExcellent Style§!"
PLA_Excellent_style_desc: "Excellent style is the guarantee, which is related to the nature, purpose and character of the army. Style is the externalization and representation of the essential attributes, morale and fighting spirit of an army. Throughout the ages, only excellent style can forge a brave and combat-ready army. Arrogance, debauchery and lax style are bound to bring down an ever-victorious army."
PLA_Ideological_education: "Ideological Education"
PLA_Ideological_education_desc: "The Yangtze River flows to the ocean. Continue the revolution and hold the gun tightly. The people's army is loyal to the party. Communism will surely win. Long live the Communist Party! Long live Chairman Mao! Long live Chairman Mao!"
PLA_All_terrain_vehicle: "All Terrain Vehicles"
PLA_All_terrain_vehicle_desc: "The Lynx all-terrain vehicle we developed is able to quickly equip most troops due to its extremely high adaptability and flexibility, which greatly improves the PLA's combat capability."
PLA_Military_mechanization: "Mechanized Forces"
PLA_Military_mechanization_desc: "On the modern battlefield, a lone infantryman will only become a dead soul under the feet of a steel behemoth. We should build a powerful mechanized force and use the steel behemoth to protect our people's soldiers."
PLA_logistic_service: "Logistics support"
PLA_logistic_service_desc: "It has been said since ancient times that food and fodder must be sent before the army moves. With well-trained soldiers and sufficient food, the army is invincible. To ensure that the PLA can focus on training and fighting, we should increase spending on military logistics so that every soldier can have hot meals and sufficient military supplies."
PLA_overwhelming_fire_power: "Overwhelming Fire Power"
PLA_overwhelming_fire_power_desc: "We have plenty of artillery shells and various types of artillery with ultra-long range, which can easily achieve firepower coverage. If there are any enemies missed, we can cover them again."
PLA_Multiple_Sea_Areas: "Presence in Multiple Sea Areas"
PLA_Multiple_Sea_Areas_desc: "As our international status rises, our overseas interests need naval protection, not only to defend our core interests in the East China Sea and the South China Sea, but also to ensure the safety of key waterways such as the Indian Ocean and the Western Pacific."
PLA_Information_Navy_fleet: "Informatization the Navy"
PLA_Information_Navy_fleet_desc: "It is extremely important to improve the level of intelligent equipment manufacturing and strengthen battlefield perception and deepen distributed combat capabilities."
PLA_Service_Fleet: "Expansion of the service fleet"
PLA_Service_Fleet_desc: "With frigates as the main force, it undertakes low-intensity tasks such as mid- and long-distance sea patrols, anti-piracy, and escort. It is cost-effective and large-scale, reducing the burden on the main battleships."
PLA_Battle_Fleet: "Construction of the decisive battle fleet"
PLA_Battle_Fleet_desc: "With aircraft carriers and missile destroyers as the core, we will focus on high-intensity confrontation, focus on breakthroughs in anti-access and regional denial capabilities, and ensure that we can compete with powerful enemies in the distant seas in the future."
PLA_Army_Doctrine_Technology: "Advanced Tactics Research"
PLA_Army_Doctrine_Technology_desc: "New tactics and new ideas are flourishing. We must seize the opportunity to break through conventional thinking and deeply explore the possible directions of military theory."
PLA_Advanced_UAV: "UAV Advantage"
PLA_Advanced_UAV_desc: "As a major UAV power, we have UAV advantages that other countries cannot obtain. No one can maintain the will to fight in the overwhelming swarm of drones."
PLA_Equipment_Modernization: "Equipment System Modernization"
PLA_Equipment_Modernization_desc: "Promoting the universalization, stealth and intelligence of the equipment system platform of the entire army, which can greatly enhance the battlefield precision strike capability and survivability."
PLA_Extreme_Training: "Actual Combat Training"
PLA_Extreme_Training_desc: "Promote cross-regional confrontation and emphasize exercises in extreme environments within the army to avoid turning exercises into a "performance.""
PLA_Synthetic_Camp: "Combat Organization Synthesis"
PLA_Synthetic_Camp_desc: "The army will adopt a "building block combination" model, mixing tanks, artillery, engineers and other arms into multi-functional forces, realizing "plug and play", and enhancing the system's anti-destruction and mission flexibility."
CHI_CPLA_Ground_Force_New_Era: "The Army of the New Era"
CHI_CPLA_Ground_Force_New_Era_desc: ""
CHI_PLAN_New_Era: "The Navy of the New Era"
CHI_PLAN_New_Era_desc: ""
CHI_CPLA_New_Era: "The Air Force of the New Era"
CHI_CPLA_New_Era_desc: ""
PLA_expanding_missile_stockpile: "Expanding Missile Stockpile"
PLA_missile_function_transformation: "Transforming Functional Positioning"
PLA_missile_need_upgrade: "Upgrading Missile Equipment"
PLA_missile_ensure_precision_strikes: "Ensuring Precision Strikes"
PLA_both_nuclear_and_conventional: "Both Nuclear & Conventional Capabilities"
PLA_expanding_missile_stockpile_desc: "To achieve effective strategic deterrence, we must rapidly expand our missile stockpile."
PLA_missile_function_transformation_desc: "The transformation from the 'Second Artillery Corps' to the 'Rocket Force' is not merely a name change, but rather a process to clarify and define its functional positioning."
PLA_missile_need_upgrade_desc: "Missile weapons require technological advancements and systematic upgrading, which necessitates substantial resource investment."
PLA_missile_ensure_precision_strikes_desc: "Unrestricted waste of firepower is a mistake; we must ensure precision strikes on every target." 
PLA_both_nuclear_and_conventional_desc: "Our missile forces must possess the dual capability to perform both conventional precision strikes and strategic nuclear counterattacks."

##China's National Super Project Policy##
CHI_Chinese_Megaprojects: "Great Power Project"
CHI_Chinese_Megaprojects_desc: "Now that we have begun to unleash China's economic and industrial potential, we have the potential to carry out engineering facility projects on an unprecedented scale. The great Communist Party of China will lead the Chinese people to create an unparalleled world miracle."
CHI_Aerospace_Industry: "Aerospace Industry"
CHI_Aerospace_Industry_desc: "The aerospace industry is an important sector of any major economy. my country is an ancient civilization with a history of 5,000 years. Our ancestors had countless desires and desires to explore the stars. All of this will eventually be realized on the road to realizing the dreams of hundreds of millions of Chinese people today."
CHI_State_Satellite_Research: "Satellite Payload Development"
CHI_State_Satellite_Research_desc: ""
CHI_State_Rocket_Research: "Launch Vehicle Development"
CHI_State_Rocket_Research_desc: ""
CHI_Power_surging: "Power surging"
CHI_Power_surging_desc: "Power is the first element of industrial development. Every major progress in human civilization is accompanied by the transformation and upgrading of power. If my country wants to build any super project, it must be supported by strong engineering technology."
CHI_Research_High_performance_steam_turbine: "High Performance Steam Turbine Research"
CHI_Research_High_performance_steam_turbine_desc: "A steam turbine, also known as a steam turbine engine, is a rotary steam power device. Steam turbines are the main equipment in modern thermal power plants and are also used in the metallurgical industry, chemical industry, and ship power plants. my country must develop world-class high-performance steam turbines as soon as possible to inject powerful impetus into my country's engineering industry."
CHI_Domestic_shield_tunneling_machine: "Deep Eye Tunneling"
CHI_Domestic_shield_tunneling_machine_desc: "A shield machine is a tunnel boring machine that uses the shield method. Whether it is to build a giant project or to explore mineral resources, the shield machine is an important machine. However, my country lacks self-developed shield machines. Previously, we imported shield machines produced abroad. If we want to independently build a super project, we cannot lack self-developed domestic shield machines."
CHI_The_vast_working_class: "Mobilize The Working Class"
CHI_The_vast_working_class_desc: "We have the world's largest working class, and their power cannot be ignored."
CHI_Super_Engine: "Super Engine"
CHI_Super_Engine_desc: "Our country has achieved world-leading status in engineering technology. Now China has become the most powerful engineering manufacturing engine on the planet. We can complete all the largest super projects in human history."
CHI_Modernizing_Agriculturee: "Modernizing Agricultural Production"
CHI_Modernizing_Agriculturee_desc: "Agriculture is the foundation of the world and the basis of people's livelihood. my country has a history of agricultural production for thousands of years. On the road to the great rejuvenation of the Chinese nation, agricultural modernization is a mission of the times that must be accomplished."
CHI_Expand_the_commodity_grain_base: "Expand the commodity grain base"
CHI_Expand_the_commodity_grain_base_desc: "Although my country has less arable land per capita, and most of the arable land is held by individual small farmers in the form of family contracts, it is difficult to coordinate and adjust production. However, we can expand several existing high-yield commodity grain bases and try to open up new commodity grain bases in the northwest."
CHI_Agriculture_Logistics_System_Construction: "Agriculture Logistics System Construction"
CHI_Agriculture_Logistics_System_Construction_desc: "my country's agricultural production capacity is not low, but due to its vast territory, complex terrain, and scattered arable land, agricultural logistics costs have been high for a long time, seriously hindering the high-quality development of my country's agriculture. We should build a set of efficient agricultural logistics systems covering the whole country to support the healthy development of agriculture."
CHI_Leisure_Agriculture_and_Rural_Tourism: "Leisure Agriculture and Rural Tourism"
CHI_Leisure_Agriculture_and_Rural_Tourism_desc: "Agriculture is a primary production with low added value. If agriculture is to be transformed and upgraded, it cannot be limited to agricultural production itself. my country has a very large citizen group, and there is a huge potential consumption demand for leisure agriculture and rural tourism. We should innovatively test and promote this new development model."
CHI_Promoting_agriculture_through_digital_commerce: "Promoting agriculture through digital commerce"
CHI_Promoting_agriculture_through_digital_commerce_desc: "Rural e-commerce is an important part of "Internet +" modern agriculture and an important means to transform the mode of agricultural development. We should design and implement the "Digital Commerce to Revitalize Agriculture" project, promote e-commerce in rural areas, promote the standardized and healthy development of live streaming of agricultural and sideline products, and let the electronic economy empower the high-quality development of agriculture and become a new hot spot for agricultural production growth."
CHI_Sunway_BlueLight_MPP: "Sunway Project"
CHI_Sunway_BlueLight_MPP_desc: "A supercomputer is a computer with higher computing speed, larger storage capacity and more complete functions than a mainframe computer. Since the release of the Tianhe-1 supercomputer with a peak performance of 1.206 petaflops by the National University of Defense Technology in 2009, my country has become the second country after the United States to independently develop a petaflop supercomputer. We must develop the world's top supercomputer as soon as possible to provide better computing power support for our scientific research."
CHI_Sunway_TaihuLight: "Sunway Taihu Light"
CHI_Sunway_TaihuLight_desc: "Our breakthroughs in science and engineering can further improve the performance of our country's supercomputers."
CHI_Sunway_OceanLight: "Sunway Ocean Light"
CHI_Sunway_OceanLight_desc: "Our breakthroughs in science and engineering can further improve the performance of our country's supercomputers."
CHI_Sunway_NatureLight: "Sunway Natural Light"
CHI_Sunway_NatureLight_desc: "Our breakthroughs in science and engineering can further improve the performance of our country's supercomputers."
CHI_OGAS_design: "Proposal for a National Automation System"
CHI_OGAS_design_desc: "OGAS (National Automation System) is a national network project of the former Soviet Union. The Soviet Union made a series of attempts to build a national network similar to the Internet, and OGAS was one of them, but these projects ultimately failed.\nThe fundamental reason for the failure of the Soviet plan was that the plan exceeded the scope of the Soviet Union's social economy and technology at the time, and became a hanging garden that looked good but was useless. my country now has the world's largest industrial manufacturing system and the world's leading computer network engineering technology. It is time for us to complete this most ambitious technological project in human history."
CHI_West_Line_Projec_South_to_North_Water_Diversion_Project: "South-to-North Water Diversion West Line Project"
CHI_West_Line_Projec_South_to_North_Water_Diversion_Project_desc: "The West Line of the South-to-North Water Diversion Project has long been in the preliminary demonstration stage and has not been built due to the huge difficulty of the project, the various plans to be discussed, and the project funds exceeding the carrying capacity. Now, we can start the final stage of the South-to-North Water Diversion Project, which will solve the problem of water shortage in our country once and for all."
Motuo_Hydropower_Station: "Motuo Hydropower Station"
Motuo_Hydropower_Station_desc: "The Medog Hydropower Station is planned to be built in the southern part of Tibet, China. Due to the large elevation difference and complex topography, the hydropower resources are particularly rich. According to calculations by relevant experts, the hydropower resources in the entire southwest region account for about one-third of the total hydropower in my country, and the planned installed capacity of the Medog Hydropower Station is 60 million kilowatts. As the largest water conservancy project in the world, the Three Gorges Project has an annual power generation of 300 billion kilowatts. Once the Medog Hydropower Station is completed, it will become the hydropower station with the highest total power generation in the world, which can save my country 80 million tons of standard coal or 40 million tons of oil each year, which will help my country achieve its commitment to achieve net zero emissions by 2060."
CHI_green_Great_Wall: "Green Great Wall"
CHI_green_Great_Wall_desc: "The northern border of our country is a desolate, harsh, and vast land, which not only hinders the development of local society, but also causes serious climate and natural disasters in our country. The Three North Shelterbelt Project is a large-scale artificial forestry ecological project that has been planned and implemented since 1979. Its purpose is to improve the harsh natural conditions in the area. We must of course continue to build this large-scale project."
CHI_green_ecological_reconstruction: "Ecological Reconstruction Project"
CHI_green_ecological_reconstruction_desc: "We will thoroughly complete the construction of ecological civilization, strive to build a beautiful China, and truly achieve sustainable development of the Chinese nation."
CHI_OGAS_Increase: "Advanced Automation System"
CHI_OGAS_Increase_desc: "The use of quantum computers and the deployment of large-scale distributed computing modules, as well as the success of advanced artificial intelligence, allow us to precisely control all economic activities within the system in an unprecedented and unimaginable way."
CHI_shopping_basket_program: "Improve Vegetable-Basket Project"
CHI_shopping_basket_program_desc: "The "Shopping Basket Program" is a plan born to alleviate the contradiction of tight supply of non-staple food. By establishing new production bases for meat, eggs, milk, aquatic products, and vegetables, as well as improving the service system for breeding high-quality seeds and processing feed, we aim to ensure that residents have fresh vegetables to eat throughout the year. After entering the 21st century, we need to continue to promote and improve this project."
CHI_green_food_project: "Promoting the Three Green Projects"
CHI_green_food_project_desc: "The "Three Green Projects" refer to promoting green consumption, cultivating green markets, and opening up green channels to improve food quality and safeguard consumer interests."
CHI_The_Russia_Link: "Connecting Russia"
CHI_The_Russia_Link_desc: "At least for now, Russia remains an asset we can utilize in the north."

######cover
CHI_Agriculture: "Agricultural Development in Africa"
CHI_Agriculture_desc: "Agriculture remains an important sector of many African economies and one that people rely on most. We should support the agricultural sector and help individual workers compete in the cutthroat international competition of globalization."
CHI_Social_Credit_Scheme: "Modern Credit System"
CHI_Social_Credit_Scheme_desc: "The current credit evaluation system is currently highly inefficient and unable to effectively curb malicious debt-taking. We must modernize it."
CHI_Skynet: "Skynet System"
CHI_Skynet_desc: "Maintaining the safety of citizens is our primary responsibility. The Skynet System will bring together a vast network of cameras to monitor and identify criminal suspects attempting to hide, leaving them nowhere to hide, no matter where they are."
##event##
#Technology Events#
chi_science.1: "Shenwei Project"
chi_science.1.t: "Shenwei Project"
chi_science.1.d: "In order to develop supercomputers, the central government secretly formed a special research team. The team leader is a Communist Party member who will represent the research team to keep in touch with the central government at all times to report work progress and requests. In order to conceal the truth, the funds allocated by the central government to the research team were all allocated from party dues and recorded as public welfare expenses.\n\nThe members of this research team are all young men and women in their twenties and thirties. They come from all over the country and are the top scientific research talents in the field of computer science. Like the scientists who developed the atomic bomb in the early years of the founding of the People's Republic of China, all members of the research team have concealed their identities, cut off contact with their families and society, and hidden among more than one billion people and the tide of the times."
chi_science.1.a: "Salute to Comrades"
chi_science.2: "Progress is encouraging"
chi_science.2.t: "Progress is encouraging"
chi_science.2.d: "The leader of the Shenwei Computer Research Group sent a call to report the recent research progress, which he described as "progress is encouraging". The leader said in the message that the supercomputer has built a preliminary structure and successfully completed the first calculation this morning. \nI believe that in the near future, my country's first independently developed supercomputer will be completed."
chi_science.2.a: "Great!"
chi_science.3: "Laboratory explosion!"
chi_science.3.t: "Laboratory explosion!"
chi_science.3.d: "The Shenwei research team received news that an explosion and fire occurred in the team's laboratory this morning. The cause is still unclear. Many people in the research team were in the laboratory at the time and were directly hit by the explosion fragments and were seriously injured. In order to rescue paper documents and injured team members, the team leader rushed into the sea of fire despite the obstruction of other team members. However, the laboratory collapsed a few seconds later, and the team leader and another injured team member eventually died heroically in the fire.\n\nAfterwards, when the staff were cleaning up the remains of the deceased team leader, they found his long-written suicide note in an old copy of Mao Zedong's Selected Works. In the suicide note, he requested that his body be cremated and scattered into the sea after the scientific research project was completed."
chi_science.3.a: "Comrade, rest in peace"
chi_science.4: "American spies"
chi_science.4.t: "Capture the American spy!"
chi_science.4.d: "The security personnel of the Shenwei research team caught an American spy who disguised himself as a cleaner today. This spy had been lurking in the laboratory for a long time, and had figured out the guard rotation list and time, and seized a subtle gap to enter the laboratory. When he was discovered, the spy intended to swallow the suicide drug hidden in his sleeve, but fortunately he was knocked down and controlled by a member of the research team behind him in time. The researcher was then shot in the abdomen by the spy under him, and the bullet penetrated his liver, causing serious injuries. According to preliminary interrogation, the last laboratory explosion was caused by another American spy, and there are multiple spies lurking in the experimental base."
chi_science.4.a: "Let the national security department strengthen security!"
chi_science.5: "The Sunway Blue-ray supercomputer was successfully developed!"
chi_science.5.t: "The Sunway Blue Ray Supercomputer was successfully developed!"
chi_science.5.d: "Today, the Shenwei research team sent a message saying that the research work has been successfully completed and my country has successfully developed the first domestic supercomputer. The Shenwei system can perform about 1 quadrillion operations per second. According to the research team, this domestic supercomputer is likely to be among the world's 10 fastest computers. More importantly, the 8,700 Shenwei 1600 microprocessors used in the system were designed by a computer research institute in my country and manufactured in Shanghai.\n\nThe research team gave the computer the experimental code name "Shenwei Blue Light" supercomputer, and now the team has requested the central government to name the supercomputer."
chi_science.5.a: "Okay, let's call it Shenwei Blue Light!"
chi_news.10: "China independently develops its first supercomputer"
chi_news.10.t: "China independently develops its first supercomputer"
chi_news.10.d: "Today, a computer called "Sunway Blue" was installed at the China National Supercomputing Jinan Center in Shandong Province. The Sunway system can perform about 1 quadrillion operations per second, which is likely to rank among the world's 20 fastest computers. More importantly, the system uses 8,700 Sunway 1600 microprocessors designed by a Chinese computer research institute and manufactured in Shanghai. \n\nChina is three generations behind the most advanced chip manufacturing technology used by world technology leaders such as the United States, South Korea and Japan, but it has independently developed a supercomputer. "This is a bit surprising," commented Jack Dongara, a computer scientist at the University of Tennessee and leader of the world's top 500 supercomputer project. Dr. Dongara said that the Sunway Blue LINPACK efficiency is 74%, which is comparable to the efficiency of the fastest computer in the United States, the Jaguar supercomputer."
chi_news.10.a: "They built their own supercomputer?"
chi_news.10.b: "We are the best!"
chi_science.6: "The State Council submits a bill to the Standing Committee of the National People's Congress"
chi_science.6.t: "The State Council submits a bill to the Standing Committee of the National People's Congress"
chi_science.6.d: "The State Council has drafted a bill to build a national automation system across the country and submitted it to the Standing Committee of the National People's Congress for review. If it can be approved by the Standing Committee, it can continue to be submitted to the National People's Congress for review and legislation."
chi_science.6.a: "(Forward the State Council's proposed bill)"
chi_science.7: "Proposal for the National Automation System Construction Law of the People's Republic of China"
chi_science.7.t: "Proposal for the National Automation System Construction Law of the People's Republic of China"
chi_science.7.d: "To improve the level of modernization of urban governance, we need to continuously accelerate the pace of smart city construction, make urban governance smarter, more efficient and more precise, and better serve the high-quality development, high-efficiency governance and high-quality life of cities. In response to the high-quality development strategy, the State Council has drafted a plan for the construction of a national automation system after research by the Economic and Information Committee. It is now submitted to the Standing Committee of the National People's Congress for deliberation. The content is as follows:\n\n1. Strengthen digital infrastructure and data integration. Accelerate the construction of digital information infrastructure represented by 5G and data centers, and simultaneously promote the digital and intelligent transformation of public facilities such as urban buildings, roads and bridges, electricity and gas, and improve the safety management and security risk situation awareness capabilities of urban physical space. Promote the integration of data in all links of the entire process of urban planning, construction, management, and operation and maintenance, build a provincial-level coordinated urban operation and governance intelligent center, and create a common urban support platform.\n\n2. Focus on fine governance and improve service quality and efficiency. Explore the "large comprehensive integration" urban comprehensive governance, optimize comprehensive scenarios and special applications, and build a new pattern of urban comprehensive governance with clear functions, coordinated efficiency, safe and orderly, and diversified participation. Accelerate the promotion of "efficient completion of one thing" to basically cover high-frequency matters of urban public services , continuously improve the efficiency of "one-stop service" by streamlining links and optimizing processes, and promote the transformation of public services from "can be done" to "easy to do". \n\nThird, establish a central network center to connect about 200 intermediate centers in other major cities and about 20,000 terminals in important economic and production departments and important enterprises. The implementation of any information system must have corresponding continuity. Establishing a national system without departmental and ministerial automation will require the entire country to transition to a new national economic management method at one time. The Economic and Information Commission believes that this is difficult to achieve. It is more feasible to establish a national computer network center by gradually building and merging information systems established in various places than to establish a huge information system at one time. \n\nFourth, establish a national automation system construction committee, which is responsible for executing and supervising the construction of the national automation system, connecting with the Central People's Government represented by the State Council and local governments and production departments, and going deep into the grassroots front line of various places in an embedded manner. It is required to build a national automation system controlled by the National Automation System Construction Committee step by step without affecting social and economic production as much as possible. "
chi_science.7.a: "Signature: State Council"
chi_science.8: "The Standing Committee of the National People's Congress rejected the bill"
chi_science.8.t: "The Standing Committee of the National People's Congress rejected the bill"
chi_science.8.d: "Review of the State Council's Proposal on the "National Automation System Construction Law of the People's Republic of China":\n\nAfter discussion at the Standing Committee of the National People's Congress, the proposal was rejected.\n\nFirst, the plan is too expensive. The total cost of the initial plan will be fourteen times the annual fiscal revenue, and the benefits of the construction results may not be able to make up for the cost.\n\nSecond, it has unpredictable effects on social stability. The reliability and safety of social production under the control of computer big data calculations are difficult to guarantee.\n\nThird, the plan does not clearly define how to deal with market entities such as enterprises. Enterprises will not cooperate with the government or computers to replace the control of enterprise operations.\n\nIn summary, the plan has a good starting point, but it is not feasible.\n\n\nSignature: Standing Committee of the National People's Congress"
chi_science.8.a: "Let's think of another way..."
chi_science.9: "Second proposal for the National Automation System Construction Law of the People's Republic of China"
chi_science.9.t: "Second proposal for the National Automation System Construction Law of the People's Republic of China"
chi_science.9.d: "Combined with the guidance of the Standing Committee of the National People's Congress, after research by the Economic and Information Technology Committee, the State Council has drafted a revised plan for the construction of a national automation system, which is now submitted to the Standing Committee of the National People's Congress for deliberation. The contents are as follows:\n\n1. Set up special zones for pilot projects. The first ones to be included should be Shenzhen, Shanghai or Xiong'an New Area. The construction of the automation system involves too many dimensions and fields, and the scope of influence needs to be controlled as much as possible. Special economic zones or new areas should bear the responsibility for economic work experiments.\n\n2. The central network center is under the control of the National Automation System and Integration Standardization Technical Committee. If regulation is required or serious impact is caused, the National Automation System and Integration Standardization Technical Committee and the central government have the right to immediately shut down the project to ensure the stability of social and economic work.\n\n3. The national automation system serves and guides market entities and does not involve interference in the ownership and control of enterprises. This is an important measure to optimize the business environment and transform into a service-oriented government."
chi_science.9.a: "Signature: General Secretary, State Council"
chi_science.10: "The Standing Committee of the National People's Congress deliberated and passed the bill"
chi_science.10.t: "The Standing Committee of the National People's Congress deliberated and passed the bill"
chi_science.10.d: "Opinions on the State Council's proposal for the "National Automation System Construction Law of the People's Republic of China":\n\nAfter discussion at the Standing Committee of the National People's Congress, in order to implement the decision of the General Secretary, the bill was passed.\n\nNow it is submitted to the National People's Congress for deliberation, and the draft law will be sent to the deputies of the National People's Congress. After 30 days, the National People's Congress will be convened temporarily to deliberate on the bill.\n\n\nSigned: Standing Committee of the National People's Congress"
chi_science.10.a: "Obviously they saw the General Secretary's signature"
chi_science.11: "The plenary session of the National People's Congress is held"
chi_science.11.t: "The plenary session of the National People's Congress is held"
chi_science.11.d: "The National People's Congress held a plenary session today to listen to the proposal of the State Council on the draft law of the "National Automation System Construction Law of the People's Republic of China". People's Congress representatives from all over the world gathered together, and the plenary sessions or group meetings of each delegation reviewed and voted on the draft law on the spot. In the end, the draft law received more than two-thirds of the votes in favor.\n\nThe Constitution and Law Committee conducted a unified review of the draft law based on the review opinions of each delegation, and finally passed the draft law.\n\nThe National People's Congress decided at the meeting to hand over the task of implementing and supervising the "National Automation System Construction Law of the People's Republic of China" to the State Council."
chi_science.11.a: "The National People's Congress has given us support in our work"
chi_news.26: "China launches OGAS project"
chi_news.26.t: "China launches OGAS project"
chi_news.26.d: "Today, the Chinese government has completed the construction of the OGAS smart city project in the metropolitan Xiongan New Area. OGAS, or All-State Automated System, was proposed by Soviet scientist Glushkov in the last century and was once valued by the Soviet government, but the plan was eventually abandoned.\n\nIt is reported that the government departments in Xiongan New Area have completed the informatization adaptation. There are only a few civil servants on duty in the government building, and everything is entrusted to the smart system. In the office buildings in Xiongan, each floor has a huge supercomputer interactive screen for people to use; in the automated factory in Xiongan, each workshop is connected to a military-grade 5G network system to collect workshop production data and control workshop production. These data will be aggregated to the network center in Beijing, and the central supercomputer will uniformly calculate, control and send implementation suggestions."
chi_news.26.a: "Incredible Engineering"
chi_news.26.b: "Science and technology are the primary productive forces"
chi_science.12: "Medog Hydropower Station Investigation Team"
chi_science.12.t: "Medog Hydropower Station Investigation Team"
chi_science.12.d: "Experts believe that the Medog Power Station may be the most risky and difficult hydropower infrastructure in history.\n\nThe mountainous area where Medog is located is surrounded by mountains and isolated from the outside world. It is not only prone to large-scale landslides and mudslides, but also located on the edge of a fragile earthquake zone. Strong earthquakes and ground stress may seriously affect the safety and stability of the power station and other buildings. Coupled with the fragile ecological environment in the Qinghai-Tibet Plateau, it is necessary to minimize the impact of the project on local vegetation and wildlife while building the Medog Hydropower Station, which puts extremely demanding requirements on the construction.\n\nIn addition, the planned address of the Medog Hydropower Station is sparsely populated, with rugged mountain roads and extremely inconvenient external transportation. It is difficult for the construction team to transport construction materials and related supplies in, and a complete transportation road needs to be built before the hydropower station starts. The terrain and geographical location also have long-distance connections with the giant power grid of the future hydropower station. Transmission and distribution planning poses a challenge. The electricity produced by the hydropower station needs to be transmitted to distant densely populated areas for people's lives and factory production. At present, China's high-voltage long-distance transmission capacity is not yet mature. These are the problems that need to be solved in the planning and construction of hydropower stations. \n\nTherefore, the Medog Hydropower Station project must take into account many factors and make careful planning in a comprehensive manner. This is why the project has not yet been officially launched. From a long-term development perspective, hydropower resources have important strategic value and contain huge economic and environmental benefits. The construction of the Medog Hydropower Station is very necessary even if it is complex and difficult. \n\nIn order to perfectly build this super project, we have formed an inspection team to be responsible for the survey and design of the Medog Hydropower Station. The team was reviewed by the General Secretary and the Prime Minister in Beijing yesterday, and now they are setting off for the remote and isolated Medog. "
chi_science.12.a: "Come on, comrades"
chi_science.13: "Travels in Medog, Part 1"
chi_science.13.t: "Travels in Medog, Part 1"
chi_science.13.d: ""Lotus Holy Land, Secret Medog"\n\nMedog County is located in Linzhi City in the southeast of Tibet. It is the last county in China to be connected by road. It is known as "Xishuangbanna of Tibet" and "Natural Museum of Vegetation Types".\n\nLast week, I received an order from the central government to come to Medog with Lao Gu to inspect the construction plan of the hydropower station. I thought I could take a plane directly to get there, but after a few days of rest, I actually took a bus for two days in a row to go around the mountain road. Several people in the team who were carsick vomited for two days in a row. However, how did the icebergs shrouded in clouds and mist come from? How did they repair the road? \n\nAfter arriving in Medog, we went to have lunch first. To save time, we ate noodles at a Lanzhou ramen restaurant. The noodle restaurant was not big, but there were many customers, all tourists. Lao Gu was not used to eating noodles, so he asked for a bowl of fried rice. Other southern colleagues did not eat noodles either. I had a bowl of beef noodles, and sure enough, like Lanzhou ramen in other places, the beef was as thin as paper. But the soup was quite delicious, and it was said that a spice that was special to Medog was added. \n\nAfter lunch, we set off to the two Yarlung Zangbo River bends in Medog. Lao Gu said that in 1994 At that time, Chinese scientists announced a major geographical discovery to the world: the Great Bend Canyon in the lower reaches of the Yarlung Zangbo River in Tibet, China is the world's largest canyon, far deeper than the Colca Canyon in Peru (3,200 meters deep), which was originally thought to be the deepest, and longer than the Colorado Canyon in the United States (440 kilometers long), which was originally thought to be the longest in the world. I didn't expect that such a small Medog would have such a different world. \n\nThis place has steep canyons and turbulent rivers. Surrounded by mountains, it's like a giant dragon suddenly turning here. We followed the giant water dragon and drove downstream. The lush forests and misty mountains set off the Grand Canyon, creating a beautiful canyon scene that is very similar to a dream - no, even more magnificent than a dream. When we took a break, Lao Gu told me that the Medog rainforest is the northernmost tropical rainforest on Earth, the lowest altitude, mildest, most rainy, and best preserved ecological area on the Tibetan Plateau. The Yarlung Zangbo Grand Canyon in the area is more than 500 kilometers long. If a hydropower station is to be built, the damage to the local ecology must be minimized as much as possible, and many problems cannot be caused like the Three Gorges Dam. "
chi_science.13.a: "Look at those little guys on the ground. This is their home."
chi_science.14: "Travels in Medog, Part Two"
chi_science.14.t: "Travels in Medog, Part Two"
chi_science.14.d: "There are many beautiful houses near the Linduo Big Bend, which have both Tibetan characteristics and a South Asian flavor. There is a front porch supported by wooden pillars in front of the wooden house, and the colors are very bright, like. Although the Yarlung Zangbo River is right in front of them, the residents here are still accustomed to using basins and tubes to collect rainwater. It is said that this is because the river is turbulent and once you fall into the water, you may lose your life.\n\nThe Yarlung Zangbo River Guoguotang Big Bend is located in Dexing Township, 12 kilometers away from Medog County. It is the most representative landscape of Medog and a landscape that everyone who comes to Medog can see with their own eyes. Its magnificence is breathtaking. The Yarlung Zangbo River makes a big bend here in Guoguotang, and the locals also call it a snake-shaped bend. Guoguotang Big Bend is known for its overlooking. It looks like a lollipop, so it is named Guoguotang. Guoguotang Big Bend is a natural wonder formed by the Yarlung Zangbo River when it flows through Medog. Due to the terrain, the turbulent river water encounters the obstruction of the mountain peaks and makes a 180-degree turn around the mountain peaks, forming this magnificent natural landscape. I took a photo of my colleague and his wife, and they were very satisfied. Old consultant, why haven't I married yet? I told him that I don't have money to pay the bride price, and the surveying and mapping people don't stay at home all year round. Do you want your wife to be a widow? Old Gu shook his head, it seems that he doesn't believe what I said. \n\nThere is a tea garden of local people on the mountain near the Guoguotang Big Bend. They leveled a small hill, cut down the trees and made room for tea hills to grow tea. We bought some small things in a small shop run by a local. Lao Gu bought a few kilograms of local grapefruit, and I bought a Tibetan hat. Afterwards, we had a meal of Medog stone pot chicken in a local fellow's shop. Fortunately, it was not as expensive as imagined. \n\nThere is a Medog rattan net bridge about 6 kilometers away from Medog County. The rattan net bridge was one of the most important river crossing channels in Medog in the early years. It was woven with rattan bamboo from the local forest. In the days when there was no bridge in Medog, the local people came up with a method of weaving a bridge with rattan bamboo in order to cross the turbulent Yarlung Zangbo River. They fixed the two ends of the steel cable on both sides, and then wove rattan bamboo of varying thickness on it to form a bridge for crossing the river. The rattan net bridge has no There were no piers or planks, and people walking on them would sway left and right in the wind, which was very scary. Many female colleagues did not dare to go up the bridge. Lao Gu took me back and forth on it three times, and used a measuring instrument to record the amount of water in this place. \n\nThere are many Mani stone piles near the Tengwang Bridge, with incomprehensible scriptures carved on them. I don’t know which pious ancestor built them many years ago. These stone piles may have stayed here quietly for decades or even hundreds of years, and no one has moved them. Lao Gu also built a small one, but I was clumsy and couldn’t build it, and I always stepped on it, so I found a stone and carved the words "Medog Hydropower Scientific Expedition Team" with a knife and put it on top of Lao Gu’s stone pile, but Lao Gu’s stone pile also collapsed. \n\nThen Lao Gu punched me in the shoulder. "
chi_science.14.a: "I hope the hydroelectric power station won't end up like this pile of rocks..."
chi_science.15: "Travels in Medog, Part Three"
chi_science.15.t: "Travels in Medog, Part Three"
chi_science.15.d: ""Every year, the PLA 115th Hospital sends a medical team of general practitioners to Medog to guard the area and spend the nine-month mountain closure period with the soldiers and civilians in Medog. The 115th Hospital prevents and treats diseases for the locals, provides medical services and medicines, and helps many Medog hospitals and township health centers to build up. It provides long-term free training for grassroots medical staff and gives priority to Medog with the best equipment and medicines. The folks here regard the doctor 'Jinzhu Mami' as the best 'Menba' in the world. Jinzhu Mami means 'Bodhisattva Soldier' and 'Menba' means doctor." A young soldier who was traveling with us told me this. He was a member of the local Tibet garrison and was responsible for being a pathfinder and guard for the scientific expedition team with four other comrades. There were also several surveying soldiers accompanying them, who were responsible for recording geographical information that had not been discovered before.\n\nOld Gu had several large lumps on his body from mosquito bites. He kept asking me for anti-itching cream, but he was obviously more concerned about other things. "The Indians shouldn't suddenly appear, right? It would be bad if they pestered him. "\n\n"Logically speaking, they shouldn't go into the rain forest, but this possibility cannot be ruled out. They often sneak over here and do something unknown." The young soldier shook his head and cut down a patch of grass in front of him.\n\n"Stop! Someone is injured!" A colleague shouted from behind.\n\nLao Gu and the young soldier hurried back quickly after hearing the news. I was about to go back, but I staggered in a puddle of mud under my feet. I finally stood up and raised my head. Suddenly, I saw a semi-liquid thing rushing down from the mountain behind me like water.\n\nIt's a mudslide. In Motuo, you can encounter sudden mudslides anytime and anywhere.\n\n"Mudslide! Move quickly! Hurry up! "I shouted desperately, turned around and pulled several colleagues to evacuate. Because the jungle was covered with grass and trees, the mountain road where the PLA patrol came out was very narrow, and the team members could not pass side by side, so they could only evacuate in one direction. I was always worried about the safety of Lao Gu and the young soldier, but I couldn't go back to confirm, so I could only walk in front and lead the team out of the valley.\n\nAfter returning to the base and counting the number of people, I found that Lao Gu and the young soldier were not in the team, and several members of the expedition team were also missing."
chi_science.15.a: "Search and rescue!"
chi_science.16: "Travels in Medog, Part 4"
chi_science.16.t: "Travels in Medog, Part 4"
chi_science.16.d: "Lao Gu likes to look around the cliff. I once asked him what he was looking at. He said he could tell the height of the cliff at a glance. He would not forget the skill if he looked more.\n\nLast time the mudslide broke out, Lao Gu, the young soldier and several colleagues were quick to evacuate the mudslide area, but the evacuation route was blocked, so they had to find another way out in the jungle. We searched until the next morning, and suddenly found a person standing and peeing at the bottom of the slope. We looked closely and found that it was Lao Gu. Fortunately, the injured colleague only had his foot cut by the rocks, and there was no serious problem. Otherwise, it would be impossible for an ambulance to come in such a place, and we would have to open the mountain. If they need emergency treatment, it will definitely alarm the Indians. \n\nI asked Lao Gu if they would be angry if this hydroelectric station was built on top of India. Lao Gu retracted his head from the edge of the cliff and said that India would definitely not agree to block their "Brahmaputra River" with a dam. At that time, they would probably find ways to trip them up. The most important thing now is to quickly complete the surveying and design, so as not to let them find out in advance. Lao Gu urged other colleagues to quickly set up the equipment, as this place is quite suitable for a dam reservoir. \n\nThere is a huge steep slope in front of us. The Yarlung Zangbo River, which has always flowed only in flat places, chose such a place to flow down. "If nothing unexpected happens, it should be built here in the end. There is a drop of nearly 2,000 meters upstream. Several cascade hydropower stations can be set up along the way, which can accommodate more than 50 700,000-kilowatt units. The total installed capacity will not be less than 30 million kilowatts, which can generate more electricity than the Three Gorges. This is the most suitable place.", said Lao Gu seriously.\n\nI hung the Chairman Mao pendant I bought in Medog County on a protruding stone nearby, so that the old man could also see this Feng Shui treasure land. Now Chairman Mao can also see here, take a look at the place we chose, I said to Lao Gu. Lao Gu smiled, turned around and took out a small golden statue of Chairman Mao from his bag and placed it on a protruding platform stone.\n\nThe eyes of the golden statue sparkled in the sunlight of Medog."
chi_science.16.a: ""The goddess should be fine, and the world will be shocked""
chi_news.22: "China launches Medog hydropower station construction project"
chi_news.22.t: "China launches Medog hydropower station construction project"
chi_news.22.d: "Today, after the Chinese government seized the southern Tibet region from India, it launched the construction of the Medog Hydropower Station in the southern Tibet region.\n\nThe hydropower station is located in the upper reaches of the Yarlung Zangbo River Grand Canyon (Big Bend), where the runoff of the Niyang River reaches 60.1 billion cubic meters, and the Yarlung Zangbo River and its important tributaries, the Parlung Zangbo-Yigon Zangbo, meet in the middle reaches of the Grand Canyon. The Parlung Zangbo and its tributary, the Yigong Zangbo, have a drainage area of 28,900 square kilometers and an annual runoff of 372 .2 billion cubic meters, and the annual runoff at the exit is 165.4 billion cubic meters (Baxika, Medog County). The Yarlung Zangbo River Grand Canyon is rich in hydropower resources. The Grand Canyon makes a horseshoe-shaped bend around Mount Namjagbarwa. The length from the Pai District at the entrance of the bend (more than 2,900 meters above sea level) to the Beibeng River section of Medog (680 meters above sea level) is about 250 kilometers, with a drop of more than 2,200 meters. If a water diversion tunnel from Pai District to Medog is dug, nearly 2,000 cubic meters of water can be diverted. m³/s flow, a giant hydropower station with an installed capacity of 50 million kW (Daguaiwan Hydropower Station) can be built, and the annual power generation can exceed 300 billion kilowatt-hours, which will exceed the power generation of the Three Gorges, the world's largest hydropower station, also in China. \n\nIndia and Bangladesh say that China's efforts to reduce water shortages have now posed a threat to them in the form of the Medog Hydropower Station project. The Brahmaputra River is known as the Yarlung Zangbo River in China. Building a hydropower station on this river has the potential to deprive thousands of people downstream of their basic water supply. India and Bangladesh claim that despite the obvious negative impact of China's decision, China is still moving forward with the project, which is undermining the safety of Indian and Bangladeshi citizens. "
chi_news.22.a: "China is going to build another wonder"
chi_news.22.b: "We can definitely complete the project"
chi_news.22.c: "The Chinese continue to test our patience..."
chi_news.23: "China completes construction of Medog hydropower station"
chi_news.23.t: "China completes construction of Medog hydropower station"
chi_news.23.d: "After nearly four years of construction, China announced this morning that it had officially completed the construction of the Medog Hydropower Station, a mega project that has provided China with more electricity than expected, creating another of the world's largest hydropower projects.\n\nIndia and Bangladesh insist that the Medog Hydropower Station has caused immeasurable negative impacts on their countries, but at present, the Medog Hydropower Station seems to have helped the two countries control the runoff of the Brahmaputra River during the flood season."
chi_news.23.a: "Shocking"
chi_news.23.b: "We did it!"
chi_news.23.c: "The Chinese continue to test our patience..."
chi_news.24: "China completes Three North Shelterbelt Project"
chi_news.24.t: "China completes Three North Shelterbelt Project"
chi_news.24.d: "The Chinese government announced that after several years of construction, its large-scale and expensive Three North Shelterbelt Project was completed today. The barren mountains and desert areas in northern China have all been scientifically greened, which will make a huge contribution to improving the climate in northern China.\n\nCommentators pointed out that this is another world-class engineering victory for China, which will bring advanced experience and technical models for mankind to improve the earth's environment."
chi_news.24.a: "Amazing"
chi_news.24.b: "Beautiful motherland!"

#Japan#
riben_news.1: "Japanese Prime Minister Keizo Obuchi dies"
riben_news.1.t: "Japanese Prime Minister Keizo Obuchi dies"
riben_news.1.d: "On Sunday morning, Japanese Prime Minister Keizo Obuchi was hospitalized due to a stroke and cerebral hemorrhage. His condition deteriorated rapidly. Japanese TV quoted a hospital source on Monday night saying that Obuchi was brain dead and was only being kept alive by machines. According to the constitution, if Obuchi dies, Japan must dissolve the cabinet and re-elect a new prime minister. It is expected that Japan's political situation will fall into chaos in the short term. Since Obuchi is almost certainly unable to perform the duties of prime minister, the Liberal Democratic Party has been discussing his successor. The most likely candidate is Yoshiro Mori, the secretary-general of the Liberal Democratic Party."
riben_news.1.a: "Will Japan's political situation continue to be in chaos?"
#Japan's political situation has been in chaos for more than a decade.
riben_news.2: "Junichiro Koizumi takes office as Prime Minister of Japan"
riben_news.2.t: "Junichiro Koizumi takes office as Prime Minister of Japan"
riben_news.2.d: "In February, a group of Japanese high school students were driving the "Ehime" fishing training ship, which was hit and sunk by the USS Greenville nuclear submarine in the waters of Hawaii, killing nine people. Former Japanese Prime Minister Yoshiro Mori was Although Mori Yoshiro's explanation was well-founded, the front pages of major media outlets featured large photos of Mori Yoshiro playing golf, which aroused public anger and led to the Japanese cabinet's decision to stop the government from issuing a statement on the matter. The approval rating dropped to an unprecedented single digit (5.7%). The leader of the opposition Democratic Party, Yukio Hatoyama, joked that "the approval rating of the Mori Cabinet is comparable to Japan's consumption tax rate (5%)." Two months later, Today, Yoshiro Mori was forced to resign. \n\nOn April 26, Junichiro Koizumi was elected president of the Liberal Democratic Party with an overwhelming advantage with his campaign slogan "Change the Liberal Democratic Party, Change Japan", and became the 87th Prime Minister of the Cabinet and the Prime Minister's Office in Nagatacho. The new owner."
riben_news.2.a: "Japan's first prime minister elected in the new century"
riben_news.3: "Shinzo Abe takes office as Prime Minister of Japan"
riben_news.3.t: "Shinzo Abe takes office as Prime Minister of Japan"
riben_news.3.d: "On September 20, Shinzo Abe, acting secretary-general of the Liberal Democratic Party of Japan and head of the party's reform promotion headquarters, was elected as the 21st president of the Liberal Democratic Party. On September 26, Shinzo Abe was elected as the 90th Prime Minister of the Japanese Cabinet, becoming the first post-war born and the youngest prime minister after the war. On September 26, former Japanese Prime Minister Junichiro Koizumi ended his term and stepped down as Prime Minister of the Japanese Cabinet, and Shinzo Abe took over."
riben_news.3.a: "Prime Ministers of the Postwar Generation"
riben_news.4: "Yasuo Fukuda takes office as Prime Minister of Japan"
riben_news.4.t: "Yasuo Fukuda takes office as Prime Minister of Japan"
riben_news.4.d: "On July 29, the Liberal Democratic Party led by Japanese Prime Minister Shinzo Abe suffered a crushing defeat in the Japanese Senate election. This was the first time in the 52 years since the founding of the Liberal Democratic Party that it became the second largest party in the Senate and lost control of the Senate. On August 27, Shinzo Abe reorganized his cabinet, but several cabinet members still resigned due to scandals and gaffes, and the support for the Abe cabinet continued to decline. On September 12, Shinzo Abe announced that he would resign as prime minister due to personal health reasons and suspend political activities.\n\nOn the afternoon of September 23, the ruling Liberal Democratic Party of Japan held a meeting of members of both houses. The party's members of parliament and representatives of local branches held an election for the new president. In the end, former Chief Cabinet Secretary Yasuo Fukuda (71 years old) defeated party Secretary-General Taro Aso (67 years old) and was elected as the 22nd President of the Liberal Democratic Party. Fukuda received a total of 330 votes, while Aso received 197 votes. At the plenary session of the House of Representatives held on September 25, Yasuo Fukuda was elected as the 91st Prime Minister, replacing the current Prime Minister Shinzo Abe (53 years old), and formed a new cabinet on the same day. Yasuo Fukuda is the eldest son of former Japanese Prime Minister Takeo Fukuda, so Japan has the first generation of prime ministers, father and son. "
riben_news.4.a: "A good son of the Fukuda family"
riben_news.5: "Taro Aso becomes Prime Minister of Japan"
riben_news.5.t: "Taro Aso becomes Prime Minister of Japan"
riben_news.5.d: "On the evening of September 1, 2008, Japanese Prime Minister Yasuo Fukuda announced his resignation at the Prime Minister's Office, shocking the whole country. Fukuda said that he made this political decision last weekend after considering all aspects. Unlike former Prime Minister Shinzo Abe who suddenly resigned due to health reasons, there is no problem with his health. He said that he stepped down to avoid a "political vacuum" in the country with the second largest economy in the world. He hopes that his resignation can break the political deadlock between the two parties in Japan. Fukuda said at a press conference: "If we give priority to people's lives, we can't let political bargaining create a political vacuum. We need a new team to implement our policies. "\n\nAfter Fukuda Yasuo announced his resignation, the Liberal Democratic Party Presidential Election Management Committee held a meeting on the afternoon of September 2, 2008 and decided to officially release the election announcement on September 10 and hold voting on September 22. This means that the new Japanese Prime Minister candidate will be revealed on September 22, and Taro Aso, who has lost two elections in a row, will make a comeback and hopefully realize his long-cherished wish. Taro Aso competed with four other candidates for the LDP presidency and won 351 votes out of 527, defeating Kaoru Yosano, Yuriko Koike, Shinko Ishihara and Shigeru Ishiba with an absolute advantage. He was elected as the 23rd president of the Liberal Democratic Party of Japan. On September 24, Taro Aso became the 92nd Prime Minister of Japan, creating the first three-generation prime minister family in Japanese history (grandfather Shigeru Yoshida, father-in-law Zenko Suzuki and Taro Aso). Acting representative of the Democratic Party Naoto Kan sarcastically said: "In the Liberal Democratic Party, only the grandson or son of the prime minister can be prime minister." "
riben_news.5.a: "The dandy boy"
riben_news.6: "Yukio Hatoyama takes office as Prime Minister of Japan"
riben_news.6.t: "Yukio Hatoyama takes office as Prime Minister of Japan"
riben_news.6.d: "On August 30, the results of the 45th House of Representatives election in Japan were announced. The Democratic Party won 308 seats, a net increase of 193 seats, while the Liberal Democratic Party's seats were reduced from 300 to 119. Many veteran politicians lost the election. For the first time since its establishment in 1955, the Liberal Democratic Party lost its position as the largest party in the House of Representatives. On August 30, 2009, Yukio Hatoyama led the Democratic Party to a historic victory in the House of Representatives election, ending the Liberal Democratic Party's long-term ruling position. On September 16, Yukio Hatoyama, the representative (i.e., the party leader) of the Democratic Party of Japan, was elected as the new Prime Minister of Japan in the special parliamentary Prime Minister nomination election. In the afternoon of the same day, the House of Representatives and the House of Councillors of the Japanese Parliament held plenary sessions to hold the Prime Minister nomination election. In the first House of Representatives vote, Hatoyama won more than half of the votes of 327 votes; in the subsequent Senate vote, Hatoyama also won more than half of the votes of 124 votes. Hatoyama was thus elected as the 93rd Prime Minister of Japan. On September 26, the entire cabinet of former Prime Minister Aso resigned."
riben_news.6.a: "A friendly gentleman"
riben_news.7: "Naoto Kan becomes Prime Minister of Japan"
riben_news.7.t: "Naoto Kan becomes Prime Minister of Japan"
riben_news.7.d: "Due to the fermentation of the relocation of the Futenma Air Base of the US military stationed in Japan, the Social Democratic Party announced its withdrawal from the coalition government on May 30, and the support rate of the Hatoyama Cabinet fell to 17%. On June 2, Hatoyama announced his resignation. On the afternoon of September 14, 2017, the Democratic Party of Japan held an extraordinary party meeting in Tokyo to vote on the election of the next party representative of the Democratic Party. At the meeting, the two candidates, former Secretary-General of the Democratic Party Ichiro Ozawa (68 years old) and then party leader and Prime Minister Naoto Kan (63 years old) delivered their final speeches, and then the members of the House of Representatives and the Senate of the Democratic Party voted. At 15:39, the Democratic Party Election Management Committee announced that Ichiro Ozawa received 491 votes and Naoto Kan received 721 votes. The votes of the members of the parliament plus the "local votes" of other party supporters and local councilors who began counting votes in the early morning of the same day, the three voting statistics showed that Naoto Kan had an advantage in the number of votes and defeated Ichiro Ozawa to become the representative of the Democratic Party. Naoto Kan was therefore elected as the 94th Prime Minister of Japan."
riben_news.7.a: "Hardworking civilian prime minister"
riben_news.8: "Yoshihiko Noda takes office as Prime Minister of Japan"
riben_news.8.t: "Yoshihiko Noda takes office as Prime Minister of Japan"
riben_news.8.d: "On June 1, three opposition parties in Japan proposed a "no-confidence motion in the cabinet", believing that Prime Minister Naoto Kan was incompetent in the disaster relief process after the earthquake and demanded his resignation. Later, five deputy ministerial-level senior officials of the Japanese government collectively submitted their resignation applications to Prime Minister Naoto Kan in the evening, expressing their agreement with the "no-confidence motion in the cabinet". On August 26, Japanese Prime Minister and Democratic Party leader Naoto Kan officially announced his resignation as party leader at the Democratic Party's senior cadres meeting. On the same day, the 64-year-old Japanese Prime Minister Naoto Kan officially announced his resignation as prime minister after the "Special Act on Public Debt Issuance" and "Special Measures Act on Renewable Energy" as conditions for his resignation were passed by the Senate plenary meeting. Former Finance Minister Yoshihiko Noda served as the new Prime Minister of Japan. At 10 am on September 2, Japan's new Prime Minister Yoshihiko Noda walked into the Prime Minister's Office for the first time as Prime Minister and started to form a cabinet. Noda was welcomed by the staff of the official residence in line, according to the cabinet formation process."
riben_news.8.a: "Disciples of Konosuke Matsushita"
riben_news.9: "Shinzo Abe once again takes office as Prime Minister of Japan"
riben_news.9.t: "Shinzo Abe once again takes office as Prime Minister of Japan"
riben_news.9.d: "On September 26, former Japanese Prime Minister Shinzo Abe defeated his rival Shigeru Ishiba after two rounds of party voting and was elected the 25th president of the Liberal Democratic Party, becoming the first former president of the Liberal Democratic Party to return to office. On October 29, the Liberal Democratic Party, which controlled the Senate, led by Shinzo Abe, rejected Prime Minister Yoshihiko Noda's policy speech in the Diet, and personally united seven opposition parties including the Liberal Democratic Party and the Komeito Party to force Noda Yoshihiko to dissolve the House of Representatives as soon as possible. On November 16, after a debate with then Prime Minister Yoshihiko Noda, Shinzo Abe said that he fully supported Prime Minister Yoshihiko Noda's proposal to reduce the number of members and would do his utmost to promote the proposal to be passed in the 2013 ordinary Diet (i.e. regular Diet) because Noda Yoshihiko had agreed to dissolve the House of Representatives. On the evening of November 29, Shinzo Abe, as the president of the Liberal Democratic Party, The first party leader debate in Japan's history was broadcast live online, with the focus on issues such as nuclear power policy, economy, consumption tax increase and diplomacy. On December 25, Tokyo held an election for a new party leader. All members of the House of Representatives and the Senate of the Democratic Party voted to elect former Minister of Economy, Trade and Industry, Banri Kaieda, as the new leader of the Democratic Party. It is reported that the Democratic Party led by Noda suffered a crushing defeat in the general election on December 16, and Noda, who served as the party leader, subsequently announced his resignation. On December 16, the Liberal Democratic Party won a landslide victory in the House of Representatives election and regained power. Shinzo Abe is confirmed to serve as the Prime Minister of Japan again. On December 26, Shinzo Abe took office as the 96th Prime Minister of Japan. "
riben_news.9.a: "Japan's decade-long "millennium chaos" has come to an end"
riben_news.10: "Yoshihide Suga takes office as Prime Minister of Japan"
riben_news.10.t: "Yoshihide Suga takes office as Prime Minister of Japan"
riben_news.10.d: "On August 23, 2020, Shinzo Abe's cumulative consecutive days in office as prime minister reached 2,799 days, surpassing former Japanese Prime Minister Sato Eisaku to become the longest-serving Japanese prime minister. On August 28, in order to avoid the deterioration of his old illness and other factors that may affect national affairs, Shinzo Abe decided to resign as prime minister, but he will continue to serve until a new prime minister is elected. On September 16, Shinzo Abe officially resigned as prime minister and left the prime minister's residence under the farewell of the new Liberal Democratic Party President Yoshihide Suga and other official residence staff.\n\nOn August 30, Yoshihide Suga expressed his plan to run in the Liberal Democratic Party presidential election . On August 31, the largest factions within the Liberal Democratic Party, the Hosoda faction (98 people) and the Aso faction (54 people), basically decided to support Yoshihide Suga. On September 2, he officially announced his participation in the Liberal Democratic Party presidential election. On September 14, Yoshihide Suga received 377 votes (a total of 534 valid votes) and was elected president of the ruling Liberal Democratic Party with an absolute advantage. On September 16, the House of Representatives of the Japanese Diet convened an extraordinary parliament to hold an election for the nomination of the prime minister. Yoshihide Suga, president of the ruling Liberal Democratic Party, was elected the 99th Prime Minister of Japan and formed a new cabinet on the same day. He then went to the Imperial Palace to attend the prime minister's appointment ceremony and cabinet certification ceremony. "
riben_news.10.a: "The last prime minister to preside over a change of era name was..."
riben_news.11: "Fumio Kishida takes office as Prime Minister of Japan"
riben_news.11.t: "Fumio Kishida takes office as Prime Minister of Japan"
riben_news.11.d: "On September 3, 2021, Japanese Prime Minister Yoshihide Suga said at an interim high-level meeting of the Liberal Democratic Party held in Tokyo that he would not participate in the Liberal Democratic Party presidential election in September. On September 17, the Japanese Liberal Democratic Party presidential election officially announced that Fumio Kishida and four other candidates were candidates. On September 29, the Japanese Liberal Democratic Party presidential election was voted for. Fumio Kishida won 257 votes, leading Taro Kono by 87 votes, and won with a clear advantage. He was successfully elected as the 27th president of the Liberal Democratic Party. According to convention, he will succeed Yoshihide Suga as prime minister. On October 4, Japan held an interim cabinet meeting. The Suga cabinet resigned unanimously at the meeting. Fumio Kishida was officially elected as the 100th Prime Minister of Japan. Subsequently, the prime minister's appointment and cabinet minister certification ceremony were held at the Japanese Imperial Palace, and the new cabinet was officially established. That evening, Fumio Kishida held his first press conference after taking office at the Prime Minister's Office. At the press conference, he officially announced that the House of Representatives would be dissolved on October 14 and the next House of Representatives election would be held on October 31."
riben_news.11.a: "When I become king, I will make new tax laws!"
riben_news.12: "Prince Hisahito of Akishino is born"
riben_news.12.t: "Prince Hisahito of Akishino is born"
riben_news.12.d: "Prince Hisahito, son of the Japanese Crown Prince Akishino, was born by cesarean section at Tokyo Aiyuk Hospital at 8:27 am on September 6, 2006 (UTC 23:27 on September 5). He is 48.8 cm long and weighs 2558 g (5.64 lbs). He is the first male child of the Japanese royal family in 41 years since his father, Prince Akishino, was born in 1965. Prince Akishino named his eldest son "Hisahitō" (Japanese: ひさひと) in the "naming ceremony", which means "I hope the child will walk through the long years leisurely." "A long life".\n\nSince the birth of Prince Akishino, there has been no male descendant in the Japanese royal family, which has brought about a very serious succession problem. Because the two legitimate sons of Emperor Akihito of Japan, the eldest son Crown Prince Naruhito and the second son Prince Akishino, had no male offspring before, the birth of Prince Hisahito was very important for the inheritance of the Japanese royal family. The birth of Prince Hisahito temporarily eliminated the crisis of the extinction of the imperial lineage, and also put the proposal for the revision of the imperial law on the shelf. The birth of the heir to the throne made the term "imperial studies" popular again in Japan."
riben_news.12.a: "The Next Emperor"
riben_news.13: "Emperor Naruhito ascends the throne"
riben_news.13.t: "Emperor Naruhito ascends the throne"
riben_news.13.d: "At 9:30 am on April 1, 2019, Japanese Chief Cabinet Secretary Yoshihide Suga organized an expert meeting at the Prime Minister's Office. Suga listened to the opinions of House of Representatives Speaker Tadashi Oshima and Senate Speaker Tadakazu Date. Afterwards, former Japanese Prime Minister Shinzo Abe convened a cabinet meeting attended by all cabinet members, listened to the opinions of cabinet members, and finally decided that "Reiwa" would be selected as the new era name of Japan. At the same time, the candidates for the era name were Eihiro, Hiroshi, Manwa, Manpo, and Hisaha (Eihiro was selected from ancient Japanese books, Hiroshi was selected from the Book of Songs and Nihonshoki, Wanhe, Wanbao, and Jiuhua all come from ancient Chinese books). \n\nOn April 30, Emperor Akihito of Japan abdicated and became the retired emperor. On May 1, Crown Prince Naruhito ascended the throne as the new emperor, becoming the 126th emperor. Japan officially adopted the new era name "Reiwa", and Japan officially entered the "Reiwa era". At the "Enthronement Ceremony in the Main Hall", Naruhito vowed to be close to the people, abide by the Japanese Constitution, and hope for world friendship and peace. The then Prime Minister of Japan, Shinzo Abe, congratulated Emperor Naruhito on his accession to the throne on behalf of all Japanese people. "
riben_news.13.a: "At that time, it was the first month of spring, with mild weather and gentle breezes."
riben_news.14: "Shinzo Abe was assassinated"
riben_news.14.t: "Shinzo Abe was assassinated"
riben_news.14.d: "At around 11:30 a.m. on July 8, 2022, former Japanese Prime Minister Shinzo Abe gave a campaign speech on the street near a subway station in Nara City to canvass for votes for the Liberal Democratic Party candidate for the Senate election. There were about 30 people on the scene. One or two minutes after the speech began, a man shot Abe from 3 meters behind him. Abe was shot in the chest and neck and fell to the ground. Subsequently, Abe was rushed to the hospital by ambulance and transferred to Nara Prefectural Medical University Hospital by medical helicopter. The local fire department said that Abe had lost consciousness during the transfer and was in critical condition. At 5:03 pm, former Japanese Prime Minister Shinzo Abe died of his injuries after being shot. He was 67 years old. \n\nAccording to Japanese TV reports, the police have arrested a suspect named Tetsuya Yamagami. According to the latest news from Kyodo News, the man arrested in the Abe shooting case is from Nara City. According to the Yomiuri Shimbun, Tetsuya Yamagami is a former member of the Japan Maritime Self-Defense Force. Tetsuya Yamagami confessed that the gun he used was a "pistol made by himself after purchasing parts online." "
riben_news.14.a: "Only when you leave do you realize how this world is, flowers are flowers and people are people"
riben_news.15: "Shigeru Ishiba takes office as Prime Minister of Japan"
riben_news.15.t: "Shigeru Ishiba becomes Prime Minister of Japan"
riben_news.15.d: "In August 2024, Japanese Prime Minister and President of the ruling Liberal Democratic Party Fumio Kishida announced that he would not participate in the party presidential election held in September. On August 18, Shigeru Ishiba announced his participation in the election for the president of the Liberal Democratic Party. This is his fifth time to run for the president of the Liberal Democratic Party. On September 27, the results of the first round of voting for the Liberal Democratic Party presidential election were announced. In the first round of voting, none of the nine candidates received more than half of the votes. The top two candidates, Sanae Takaichi and Shigeru Ishiba, entered the second round of voting. On the same day, Shigeru Ishiba won the second round of voting for the Liberal Democratic Party presidential election. The actual number of votes in the second round was 414, of which 409 were valid votes. Shigeru Ishiba was finally elected as the Liberal Democratic Party president with 215 votes. The 28th president. \n\nOn October 1, the Kishida Cabinet of Japan resigned collectively at the interim cabinet meeting; on the same day, the House of Representatives and the Senate of Japan's interim parliament held an election for the nomination of the president of the Liberal Democratic Party, Shigeru Ishiba, as prime minister. Shigeru Ishiba won more than half of the votes in the House of Representatives and the Senate respectively and was elected as the 102nd prime minister of Japan. Subsequently, Shigeru Ishiba formed a cabinet and announced the list of cabinet members. On October 3, Shigeru Ishiba issued appointment letters to ministers and political officials at the Prime Minister's Office, took a group photo and attended the first meeting of ministers and political officials. On October 4, Shigeru Ishiba delivered a policy speech at the Japanese Parliament, expounding his ruling propositions from many aspects such as domestic affairs, diplomacy, economy, and people's livelihood. "
riben_news.15.a: "He who is full of rebelliousness has become the prime minister?"
riben_news.16: "Emperor Naruhito reads the peace edict"
riben_news.16.t: "Emperor Naruhito reads the peace edict"
riben_news.16.d: "After the People's Republic of China ended its occupation of Japan, Japanese Emperor Naruhito read out an imperial edict today, announcing that China and Japan will maintain peace forever and will not infringe on each other's territorial sovereignty. The Japanese parliament will return power to the emperor after formulating a new constitution. The Japanese royal family will fulfill its promise to protect its citizens and permanently give up the power to wage war.\n\nObservers believe that this marks the official establishment of the People's Republic of China's jurisdiction over Japan. How this post-war emperor will deal with his relationship with history is still unknown."
riben_news.16.a: "The Second Return of Power"
riben_news.17: "Emperor Hisahito reads the peace edict"
riben_news.17.t: "Emperor Hisahito reads the peace edict"
riben_news.17.d: "After the People's Republic of China ended its occupation of Japan, the Japanese emperor announced his abdication, and Prince Akishino Hisahito succeeded to the throne as the new Japanese emperor. He read out an imperial edict today, announcing that China and Japan will maintain peace forever and will not infringe on each other's territorial sovereignty. The Japanese parliament will return power to the emperor after enacting a new constitution. The Japanese royal family will fulfill its promise to protect its citizens and permanently give up the power to wage war.\n\nObservers believe that this marks the official establishment of the People's Republic of China's jurisdiction over Japan. The emperor is mediocre and unqualified to rule. It is said that he has handed over government affairs to several elders."
riben_news.17.a: "The Second Return of Power"
riben_news.18: "Emperor Kako reads the peace edict"
riben_news.18.t: "Emperor Kako reads the peace edict"
riben_news.18.d: "After the People's Republic of China ended its occupation of Japan, the Japanese emperor announced his abdication, and Princess Kako Akishino succeeded to the throne as the new Japanese emperor. She read out an imperial edict today, announcing that China and Japan will maintain peace forever and will not infringe on each other's territorial sovereignty. The Japanese parliament will return power to the emperor after formulating a new constitution. The Japanese royal family will fulfill its promise to protect its citizens and permanently give up the power to wage war.\n\nObservers believe that this marks the official establishment of the People's Republic of China's jurisdiction over Japan. This is the ninth female emperor in Japanese history and the first female emperor after the end of the Tokugawa shogunate. Her intelligent, gentle and diligent character destined her to be an emperor who loves the people."
riben_news.18.a: "The Second Return of Power"
riben.14.t: "Surrender?"
riben.14.d: "With most of our cities and the capital occupied by [CHI.GetName], continuing to resist seems unwise..."
riben.14.a: "No other choice but to surrender."
riben.14.b: "We will never give up!"
riben.15: "The fate of Japan"
riben.15.t: "The fate of Japan"
riben.15.d: "The Japanese authorities have given up resistance and surrendered. Now we can decide what to do with the country."
riben.15.a: "Building a loyal Japan"
riben.15.b: "Occupy Japan"
riben.16: "The Emperor's choice?"
riben.16.t: "The Emperor's choice?"
riben.16.d: "We can seize control of Japan's political power by superficially handing over power from the Japanese parliament to the emperor. There are several candidates to choose from. Who should be chosen as the emperor?"
riben.16.a: "Let Naruhito, who is willing to face history, become emperor"
riben.16.b: "Let the holy Prince Hisahito become the emperor"
riben.16.c: "Let the gentle and virtuous Princess Kako become the emperor"


#South China Sea#
chi_south_china_sea_GR.0.t: "Negotiations on the Spratly Islands"
chi_south_china_sea_GR.0.d: "[CHI.GetName] requires us to recognize their sovereignty over the Spratly Islands and withdraw their troops there. In return, they will pay some economic capacity to help us develop our economy and share the oil discovered in the Spratly Islands in the future."
chi_south_china_sea_GR.0.a: "We gladly accept"
chi_south_china_sea_GR.0.b: "This is absolutely impossible!"
chi_south_china_sea_GR.1: "Call from Vietnam"
chi_south_china_sea_GR.1.t: "Call from Vietnam"
chi_south_china_sea_GR.1.d: "After our long-term diplomatic efforts and friendly explorations, the Vietnamese government expressed its willingness to recognize the sovereignty of the People's Republic of China over the western part of the Nansha Islands and the Xisha Islands and to withdraw its troops. At the same time, the Vietnamese government proposed to share with us the oil discovered in the Nansha Islands in the future and requested us to pay for the cost of Vietnam's offshore oil exploration project, which had already been carried out for half."
chi_south_china_sea_GR.1.a: "We certainly agree that China-Vietnam friendship will last forever"
chi_south_china_sea_GR.2: "Call from the Philippines"
chi_south_china_sea_GR.2.t: "Call from the Philippines"
chi_south_china_sea_GR.2.d: "After our long-term diplomatic efforts and friendly explorations, the Philippine government expressed its willingness to recognize the sovereignty of the People's Republic of China over the eastern part of the Nansha Islands and the Zhongsha Islands and to withdraw its troops. At the same time, the Philippine government proposed to share with us the oil discovered in the Nansha Islands in the future and requested us to pay for the cost of the Philippines' offshore oil exploration project, which had already been halfway carried out."
chi_south_china_sea_GR.2.a: "We certainly agree that China-Philippines friendship will last forever"
chi_south_china_sea_GR.3: "Call from Malaysia"
chi_south_china_sea_GR.3.t: "Call from Malaysia"
chi_south_china_sea_GR.3.d: "Following the experience of Vietnam and the Philippines, Malaysia has also expressed its willingness to recognize the sovereignty of the People's Republic of China over the southern part of the Spratly Islands and withdraw its troops. Similarly, the Malaysian government has proposed to share with us the oil discovered in the Spratly Islands in the future and requested us to pay for the cost of their offshore oil exploration project, which has already been carried out for half of the time."
chi_south_china_sea_GR.3.a: "We certainly agree that China-Malaysia friendship will last forever"
chi_south_china_sea_GR.10.t: "Negotiations on the Spratly Islands were rejected"
chi_south_china_sea_GR.10.d: "[FROM.GetName] rejected our sovereignty over the Spratly Islands. We must do something!"
chi_south_china_sea_GR.10.a: "We must use force"
chi_south_china_sea_GR.10.b: "We will make plans later"
chi_south_china_sea_GR.100.t: "[FROM.GetName] has taken control of [MDGR_maritime_boundary_state.GetName]"
chi_south_china_sea_GR.100.d: "Due to [FROM.GetName]'s unquestionable influence in the region, their territorial claims have won international support in recent maritime boundary negotiations. [MDGR_maritime_boundary_state.GetName] is now under their control, and we have lost the legitimacy of our claims in the region. We have virtually no recourse."
chi_south_china_sea_GR.100.a: "How despicable!"
chi_south_china_sea_GR.100.b: "We must seek justice!"

#East China Sea#
chi_east_china_sea_GR.1: "China conducts provocative fleet exercises in the East China Sea!"
chi_east_china_sea_GR.1.t: "China conducts provocative fleet exercises in the East China Sea!"
chi_east_china_sea_GR.1.d: "In an effort to assert its sovereignty over the Senkakus, China has ordered provocative fleet exercises in the waters of the Senkakus and Okinawa. We should consider using our navy to conduct freedom of navigation operations to show the world that these waters belong to the international community, not China."
chi_east_china_sea_GR.1.a: "We cannot afford to confront China..."
chi_east_china_sea_GR.1.b: "We should uphold freedom of navigation!"
chi_east_china_sea_GR.2: "Americans and Japanese are conducting aggressive patrols near the Diaoyu Islands!"
chi_east_china_sea_GR.2.t: "Americans and Japanese are conducting aggressive patrols near the Diaoyu Islands!"
chi_east_china_sea_GR.2.d: "In response to our perfectly legal fleet exercises in the waters of the Diaoyu Islands, the Americans led the Japan Maritime Self-Defense Force into our sovereign waters in an aggressive but pointless move. We can simply wait for the Americans to leave our waters, or we can assert our sovereignty over the Diaoyu Islands by demonstrating the full might of our navy to the Americans."
chi_east_china_sea_GR.2.a: "We should not risk war over this issue..."
chi_east_china_sea_GR.2.b: "Expel the imperialists!"
chi_east_china_sea_GR.3: "China attacked our freedom of navigation patrols!"
chi_east_china_sea_GR.3.t: "China attacked our freedom of navigation patrols!"
chi_east_china_sea_GR.3.d: "It is shocking that our freedom of navigation patrols in the East China Sea have been attacked, one of our ships has been sunk, and several American service members have been killed. People at home are clamoring for a response, but do we really want to declare war over a minor conflict?"
chi_east_china_sea_GR.3.a: "We should not escalate the situation..."
chi_east_china_sea_GR.3.b: "This behavior must be punished!"
chi_east_china_sea_GR.4: "China demands that we withdraw our troops from Okinawa!"
chi_east_china_sea_GR.4.t: "China demands that we withdraw our troops from Okinawa!"
chi_east_china_sea_GR.4.d: "The People's Republic of China has asked us to withdraw our troops from Okinawa to protect them from the threat of the "island chain". This request is undoubtedly a prelude to China's preparations to attack Japan. If we withdraw from Japan, the possibility of a conflict between China and Japan will greatly increase."
chi_east_china_sea_GR.4.a: "Absurd"
chi_east_china_sea_GR.4.b: "Let's not get involved in this mess..."
chi_east_china_sea_GR.5: "China demands that we end our rule over Okinawa!"
chi_east_china_sea_GR.5.t: "China demands that we end our rule over Okinawa!"
chi_east_china_sea_GR.5.d: "China condemned us internationally and demanded that we immediately end the "illegal occupation" of Okinawa and allow Ryukyu to "restore its independence""
chi_east_china_sea_GR.5.a: "Let them dance with these country islanders..."
chi_east_china_sea_GR.5.b: "Japan must not lose Okinawa!"
chi_east_china_sea_GR.6: "Americans withdraw from Okinawa!"
chi_east_china_sea_GR.6.t: "Americans withdraw from Okinawa!"
chi_east_china_sea_GR.6.d: "According to the destroyer fleet's observation, the U.S. troops stationed in Okinawa have gradually evacuated the military base this morning, and outside the gate are Okinawa residents who are cheering and exclaiming."
chi_east_china_sea_GR.6.a: "Get lost"
chi_east_china_sea_GR.7: "The United States ignored our demands"
chi_east_china_sea_GR.7.t: "The United States ignored our demands"
chi_east_china_sea_GR.7.d: "The United States has ignored our threats to withdraw from its Okinawa bases and has increased the shipment of military equipment to the Okinawa bases."
chi_east_china_sea_GR.7.a: "Imperial ambitions never die..."
chi_east_china_sea_GR.7.b: "Then let's help them get out!"
chi_east_china_sea_GR.8: "Japan ignored our requests"
chi_east_china_sea_GR.8.t: "Japan ignored our requests"
chi_east_china_sea_GR.8.d: "Japan has ignored our doubts about its jurisdiction over Okinawa and has stepped up patrols of the waters off Okinawa with the U.S. military presence."
chi_east_china_sea_GR.8.a: "The rising sun still burns the Ryukyu people..."
chi_east_china_sea_GR.8.b: "Liberate the Ryukyu people!"
chi_east_china_sea_GR.9: "Japan released Ryukyu!"
chi_east_china_sea_GR.9.t: "Japan released Ryukyu!"
chi_east_china_sea_GR.9.d: "Japan has decided this morning to return Ryukyu's jurisdiction over Okinawa and recognize the Ryukyu Kingdom as an independent country."
chi_east_china_sea_GR.9.a: "This time, I won't abandon you again"
chi_east_china_sea_GR.10: "China is claiming the Senkaku Islands!"
chi_east_china_sea_GR.10.t: "China is claiming the Senkaku Islands!"
chi_east_china_sea_GR.10.d: "China has resumed its dispute with us over ownership of the Senkaku Islands. If we yield to their demands, we may increase China's confidence in its ability to influence our foreign policy and reduce our nationalist popularity among our people. However, the consequences of refusal may not bode well for us either."
chi_east_china_sea_GR.10.a: "Just a fishing island..."
chi_east_china_sea_GR.10.b: "Japan will not be intimidated!"
chi_east_china_sea_GR.11: "Japan, hand over the Diaoyu Islands!"
chi_east_china_sea_GR.11.t: "Japan, hand over the Diaoyu Islands!"
chi_east_china_sea_GR.11.d: "Japan has apparently accepted the legitimacy of our claim and returned the Diaoyu Islands to us, its rightful owners."
chi_east_china_sea_GR.11.a: "He who knows the times is a hero"
chi_east_china_sea_GR.12: "Japan defies us!"
chi_east_china_sea_GR.12.t: "Japan defies us!"
chi_east_china_sea_GR.12.d: "The Japanese refuse to return the Diaoyu Islands and are evidently as determined as ever to remain our mortal enemy."
chi_east_china_sea_GR.12.a: "They will regret this..."
#Taiwan#
chi_taiwan.1: "China demands that we stop interfering in Taiwan!"
chi_taiwan.1.t: "China demands that we stop interfering in Taiwan!"
chi_taiwan.1.d: "Today, the Ministry of Foreign Affairs of the People's Republic of China strongly demanded that we fulfill our commitment to recognize one China and not interfere in Taiwan's affairs. China claimed that this is China's internal affairs and our country should not interfere. This is obviously a prelude to China's attack on Taiwan. If we abandon Taiwan, China will undoubtedly point its guns at Taiwan."
chi_taiwan.1.a: "This is none of our business..."
chi_taiwan.1.b: "We must protect Taiwan!"
chi_taiwan.2: "The United States has withdrawn its troops and fleet from Taiwan!"
chi_taiwan.2.t: "The United States has withdrawn its troops and fleet from Taiwan!"
chi_taiwan.2.d: "The US fleet withdrew from the waters of the Taiwan Strait today and headed for the Philippine base. The United States has apparently acquiesced to the Chinese government's diplomatic demands."
chi_taiwan.2.a: "He who knows the current situation is a hero"
chi_taiwan.2.b: "Why?!"
chi_taiwan.3: "The United States has increased its military aid to Taiwan!"
chi_taiwan.3.t: "The United States has increased its military aid to Taiwan!"
chi_taiwan.3.d: "A transport ship flying the US flag arrived at the port of Taipei today. Many leaked photos clearly show that the ship is full of US military supplies. The United States has obviously increased its military aid to Taiwan."
chi_taiwan.3.a: "American imperialism is still thieving!"
chi_taiwan.3.b: "Great..."
chi_taiwan.4: "China sends an ultimatum!"
chi_taiwan.4.t: "China sends an ultimatum!"
chi_taiwan.4.d: "The Beijing government sent a telegram early this morning, asking us to give a reply within an hour. Taiwan should either accept the jurisdiction of the Central People's Government of the People's Republic of China or accept the military control of the People's Liberation Army."
chi_taiwan.4.a: "We succumb to the power..."
chi_taiwan.4.b: "We will never compromise!"
chi_taiwan.5: "Taiwan authorities announced that they accept the jurisdiction of the Central People's Government"
chi_taiwan.5.t: "Taiwan authorities announce acceptance of the jurisdiction of the Central People's Government"
chi_taiwan.5.d: "Taipei calls, the [TAI.GetLeader] government expresses its willingness to recognize Taiwan as the legal territory of the People's Republic of China, and Taiwan will accept the jurisdiction and governance of the Central People's Government."
chi_taiwan.5.a: "He who knows the current situation is a hero"
chi_taiwan.6: "The Taiwanese authorities ignored our warnings!"
chi_taiwan.6.t: "The Taiwanese authorities ignored our warnings!"
chi_taiwan.6.d: "[TAI.GetLeader] released a live speech this morning, telling the world that Taiwan will never fear "power bullying" and will fight the "aggressors" to the last moment."
chi_taiwan.6.a: "The reunification of the motherland!"
chi_taiwan.9.t: "Taiwanese authorities' troops are defecting."
chi_taiwan.9.d: "The [TAI.GetLeader] government's military morale is low, and some have already defected and joined our forces."
chi_taiwan.9.a: "Good news!"
chi_taiwan.9.b: "Continue to intensify propaganda!"
chi_taiwan.10.t: "Foreign intervention forces return home"
chi_taiwan.10.d: "Since we have completely eliminated the Taiwan authorities in the war, those foreign intervention forces that interfered with our great cause of unification had no choice but to sign a peace agreement with us and had to recognize the established fact of unification."
chi_taiwan.10.a: "To hell with them."
WAR_TAIWAN_JIEFANG: "War of Liberation for the Reunification of the Motherland"
chi_taiwan_jiefang: "The War of Liberation of the Motherland"
chi_news.6: "China retakes Taiwan"
chi_news.6.t: "China retakes Taiwan"
chi_news.6.d: "After half a century of disputes and conflicts, the two sides of the Taiwan Strait have finally achieved military reunification. The Taiwan authorities, the former "Republic of China" government, ended their decades of rule over the Taiwan region and completely collapsed after the People's Liberation Army entered the Presidential Palace in Taipei. This marks the most important step China has taken on the road to national reunification."
chi_news.6.a: "No one dares to mess with them..."
chi_news.6.b: "Finally! Finally!"
chi_news.7: "China retakes Taiwan"
chi_news.7.t: "China retakes Taiwan"
chi_news.7.d: "After half a century of disputes and conflicts, the two sides of the Taiwan Strait have finally achieved peaceful reunification. The Taiwan authorities, the former "Republic of China" government, ended the hostility with mainland China, recognized the jurisdiction of the People's Republic of China, and joined the People's Republic of China as a special administrative region."
chi_news.7.a: "Has trade in the South China Sea been restored?"
chi_news.7.b: "Finally! Finally!"
chi_news.8: "Taiwan Strait War Breaks Out"
chi_news.8.t: "Taiwan Strait War Breaks Out"
chi_news.8.d: "Recently, the situation in the Taiwan Strait has continued to be tense, and the game between China and Taiwan has reached the brink of war. The State Council of the People's Republic of China issued an official statement at an emergency press conference: "The Taiwan authorities' continuous challenge to the bottom line has seriously hurt the feelings of the people on both sides of the Taiwan Strait. In the absence of hope for peaceful reunification, China will take all means, including force, to maintain the reunification of the motherland. It is intolerable and no longer necessary to endure. The Chinese People's Liberation Army led by the Communist Party of China will launch the final blow to the island of Taiwan occupied by the reactionaries and completely end the Liberation War. The reactionaries led by [TAI.GetLeader] will pay the price of blood for their actions. "\n\nThe Ministry of Foreign Affairs of the People's Republic of China issued a statement that all attempts to interfere with China's reunification process will be regarded as hostile acts against China, and the Central Military Commission has also issued an order to open fire on any interfering forces."
chi_news.8.a: "This day has finally come"
chi_news.8.b: "Towards the liberation of the whole country!"
chi_news.8.c: "Down with the Red Bandits!"
chi_news.11.t:0 "Liberation of Taipei"
chi_news.11.d:0 "Last night, the operation led by the Chinese People's Liberation Army airborne troops was a huge success. After the Thor Commando completed the airborne raid on important facilities such as Songshan Airport and the Presidential Palace, a large-scale airborne operation was quickly launched over Taipei. After the operation began, multiple DF17 missiles equipped with ground-penetrating warheads destroyed the Hengshan and Yuanshan command posts. The Kuomintang troops guarding the city quickly disintegrated, and the People's Liberation Army completed the occupation of Taipei almost without bloodshed.\n\nIt is reported that after receiving news of the attack from the mainland, the "President of Taiwan" [TAI.GetLeader] and some senior officials on the island tried to escape from Taipei from Songshan Airport in a Clouded Leopard armored vehicle, but were captured by the airborne commandos who were already waiting at the airport. As of press time, most of the Kuomintang troops on the island of Taiwan have stopped resisting. According to sources, the PLA's cleanup operation against the remaining diehards will soon begin."
chi_news.11.a:0 "The die is cast"
chi_news.11.b:0 "Great"
chi_news.12.t:0 "Liberation of Kaohsiung"
chi_news.12.d:0 "Last night, the landing battle in Kaohsiung led by the Chinese People's Liberation Army Marine Corps was basically over, and sporadic gunfire could still be heard on the streets. Although the defending Nationalist troops organized a tenacious defense on the beachhead, they quickly lost their ability to organize resistance under the saturation missile attack of the PLA Navy and the Rocket Force. The synthetic battalion under the 3rd Marine Brigade has entered the urban area of Kaohsiung and completed the control of important infrastructure in the urban area.\n\nThere are unconfirmed reports that the remaining Nationalist troops have wavered and there is a high possibility of a large-scale uprising on the battlefield, but the premise is that the Nationalist government can still organize positions for resistance."
chi_news.12.a:0 "The PLA's amphibious capabilities are astonishing"
chi_news.12.b:0 "Great"
chi_news.13.t:0 "Liberation of Taiwan"
chi_news.13.d:0 "With the surrender of the last KMT troops in Hualien, the Chinese People's Liberation Army has basically eliminated the resistance on the island of Taiwan.\n\nThe Premier of the State Council pointed out at a press conference that the remaining reactionary forces on the island of Taiwan have been completely eliminated by the PLA, and the next step will be to liquidate war criminals and start post-war reconstruction on the island. It is said that the People's Republic of China will soon hold a grand military parade in Beijing to celebrate the return of Taiwan.\n\nIt is reported that some DPP and KMT officials who fled Taiwan have established a "Taiwan Provisional Government" in Hawaii, but as of press time, the US government has not yet issued an official response to the issue of the exiled government."
chi_news.13.a:0 "The Chinese broke out of the cage"
chi_news.13.b:0 "Long live the People's Republic of China! Long live the Chinese people!"
chi_news.13.c:0 "It's impossible to support a wall with mud..."
chi_news.14.t:0 "Judgment"
chi_news.14.d:0 "The trial of war criminals is ongoing, including former "presidents" of Taiwan, government officials and senior DPP officials who advocated Taiwan independence.\n\nIf they are executed, it will be a great relief to the people, but if they are allowed to live, it will also stabilize public opinion in Taiwan."
chi_news.14.a:0 "Eliminate the reactionaries and execute them on the spot"
chi_news.14.b:0 "Ask the Supreme People's Court to open the court and everything must be done in accordance with the law"
chi_news.15.t:0 "The Fall of Tokyo"
chi_news.15.d:0 "The bloody battle in Tokyo has come to an end, with the Chinese flag flying atop the Tokyo Skytree as the last Self-Defense Force unit surrendered. China then announced that it had achieved complete control of the Japanese capital. It is believed that the Emperor and government cabinet members had evacuated Tokyo before the PLA offensive began.\nLater, the Chinese People's Liberation Army held a grand parade in Tokyo, with a seemingly endless column of Chinese soldiers advancing through the city. Japanese citizens watching along the streets remained silent.\n\nAlthough there are occasional voices in Chinese public opinion calling for "revenge for Nanjing", it can be seen that the PLA in Tokyo still maintains strict military discipline."
chi_news.15.a:0 "Thirty years in the east, thirty years in the west"
chi_news.15.b:0 "Great revenge has been taken"
chi_news.16.t:0 "Occupy Seoul"
chi_news.16.d:0 "A combined force of the Chinese People's Liberation Army and the Korean People's Army has entered Seoul. Earlier, due to the continuous bombardment of large numbers of North Korean artillery, Seoul was already in flames.\n\nThe longest battle lasted near the Blue House. North Korean agents tried to infiltrate the Blue House before the battle began to capture South Korean senior officials, but failed. In the end, a swarm of suicide drones overwhelmed the defenders' defenses, but it is reported that [KOR.GetLeader] had withdrawn from Seoul earlier."
chi_news.16.a:0 "Shocking"
chi_news.16.b:0 "How about changing the name to Seoul?"
chi_news.17.t:0 "Occupation of Hanoi"
chi_news.17.d:0 "It has now been confirmed that the Vietnamese capital of Hanoi has been taken over by Chinese forces. Although much of the city has been devastated by bombing, the Ho Chi Minh Mausoleum in the center of the city remains intact, and the Chinese People's Liberation Army has taken this way to show respect for the pioneer of Vietnamese communism.\n\nThe Vietnamese government and troops have withdrawn into the jungles of central Vietnam, vowing to make the Chinese troops "as bogged down as the Americans"."
chi_news.17.a:0 "Brothers at odds"
chi_news.17.b:0 "Try it?"
chi_news.18.t:0 "Occupy Singapore"
chi_news.18.d:0 "As Operation Typhoon unfolded, Chinese marines landed in Singapore with the support of naval vessels and bloody street fighting ensued. The Singaporean military used a large number of barricades and camouflaged tanks to cause considerable trouble to the Chinese troops, but they were still vulnerable to the enemy's superior firepower.\n\nWith the fall of Singapore Port, China successfully gained control of the Strait of Malacca, the gateway to the Indian Ocean."
chi_news.18.a:0 "Shocked"
chi_news.18.b:0 "No English allowed from now on"
chi_news.19.t:0 "China has achieved complete control over the South China Sea"
chi_news.19.d:0 "Earlier today, the State Council of China held a press conference to announce that it has completed the complete control of all islands and reefs in the South China Sea, and once again warned that it will severely crack down on any country's infringement on China's territory and territorial waters. The Chinese government also assured at the meeting that the freedom of navigation of international shipping and trade in the South China Sea will not be affected, and China welcomes any friendly country that has peaceful exchanges with China."
chi_news.19.a:0 "Shocked"
chi_news.19.b:0 "China cannot be missing at all"
chi_news.20.t:0 "Occupation of New Delhi"
chi_news.20.d:0 "Today, the Indian capital New Delhi was captured by the Chinese army. Although the Indian government declared before the war that New Delhi would become the Stalingrad of South Asia, most of the troops had fled the city with the Indian government before the battle began, leaving only a few soldiers who failed to escape and the police who were temporarily driven to the front line to guard New Delhi.\n\nThe fierce exchange of fire only occurred in some government offices, but because the military and police set up a large number of roadblocks along the streets, it still caused a lot of trouble for the PLA's advance."
chi_news.20.a:0 "Have they crossed the Himalayas?"
chi_news.20.b:0 "Quickly contact the communist rebels in India"
#Thoughts#
chi_trends.1: "Return to normalcy"
chi_trends.1.t: "Return to normalcy"
chi_trends.1.d: "Go home, why don't you go home when your fields are about to be overgrown? Since you have let your mind be enslaved by your body, why do you feel sad and lonely? I understand that the past cannot be changed, but I know that the future can be pursued. In fact, I have not gone far from the right path, and I realize that today is right and yesterday is wrong. The boat sails away lightly, and the wind blows my clothes. I ask the traveler about the road ahead, and I hate the dim morning light."
chi_trends.1.a: "It should be this way"
chi_trends.2: "Return to normalcy"
chi_trends.2.t: "Return to normalcy"
chi_trends.2.d: "Heaven and earth are not benevolent, they treat all things as straw dogs; sages are not benevolent, they treat the people as straw dogs."
chi_trends.2.a: "As it should be"
chi_trends.3: "Some people organized marches to protest!"
chi_trends.3.t: "Some people organized marches to protest!"
chi_trends.3.d: "People everywhere are starting to organize coordinated marches to protest our current policies.\nWe should decide whether we should keep the status quo, or make some changes to appease the protesters."
chi_trends.3.a: "Mediate"
chi_trends.3.b: "Strike hard!"
#population#
chi_pop.1: "The Fifth National Population Census"
chi_pop.1.t: "The Fifth National Population Census"
chi_pop.1.d: "On November 1, 2000, the Chinese government conducted the registration work for the fifth national population census. According to statistics, the total population of the country is 129,533,000. Among them: the population of the 31 provinces, autonomous regions, and municipalities directly under the Central Government of the mainland of the motherland (excluding Kinmen, Matsu and other islands in Fujian Province, the same below) and active military personnel totaled 126,583,000. The population of the Hong Kong Special Administrative Region is 6.78 million. The population of the Macao Special Administrative Region is 440,000, and the population of Taiwan Province and Kinmen, Matsu and other islands in Fujian Province is 22.28 million.\n\ nThere are 348.37 million households in the 31 provinces, autonomous regions and municipalities directly under the Central Government, with a household population of 1198.39 million. The average number of people per household is 3.44, which is 0.52 less than the 3.96 people in the fourth national population census in 1990. \n\nAmong the population of the 31 provinces, autonomous regions, municipalities directly under the Central Government and active military personnel in the Mainland of China, there are 653.55 million males, accounting for 51.63% of the total population; and 612.28 million females, accounting for 48.37% of the total population. Gender The ratio (male to female ratio, with female as 100) is 106.74. \n\nAmong the population of the 31 provinces, autonomous regions, municipalities and active military personnel in the mainland of China, the population aged 0-14 is 289.79 million, accounting for 22.89% of the total population; the population aged 15-64 is 887.93 million, accounting for 70.15% of the total population; the population aged 65 and above is 88.11 million, accounting for 6.96% of the total population. Compared with the fourth national census in 1990, the population aged 0-14 is 289.79 million, accounting for 22.89% of the total population; the population aged 15-64 is 887.93 million, accounting for 70.15% of the total population; the population aged 65 and above is 88.11 million, accounting for 6.96% of the total population. The proportion of the population aged 65 and above decreased by 4.80 percentage points, and the proportion of the population aged 65 and above increased by 1.39 percentage points. \n\nAmong the population of the 31 provinces, autonomous regions, municipalities directly under the Central Government and active military personnel in the mainland of China, 45.71 million people received university education (referring to college and above); 141.09 million people received high school education (including secondary technical school education); 429.89 million people received junior high school education; 451.91 million people received primary school education (the above people with various educational levels include graduates, dropouts and students in school of various schools) "
chi_pop.1.a: "Born in a prosperous age"
chi_pop.2: "The Sixth National Population Census"
chi_pop.2.t: "The Sixth National Population Census"
chi_pop.2.d: "On April 28, 2011, Ma Jiantang, director of the National Bureau of Statistics, announced that the total population of the country registered (registered) in the sixth national census in 2010 was 1,339,724,852 (excluding Hong Kong, Macao and Taiwan). According to the census bulletin, the total population of the country in November 2010 was 1370,536,875 (including Hong Kong, Macao and Taiwan). \n\nThe population of the 31 provinces, autonomous regions, municipalities directly under the Central Government and active military personnel in the mainland increased by 73,899,804 people in the past ten years, an increase of 5.84%, and an average annual growth rate of 0.57% compared with 1,265,825,048 people at 0:00 on November 1, 2000 in the fifth national census. \n\nThe population of the 31 provinces, autonomous regions, municipalities directly under the Central Government and active military personnel in the mainland increased by 73,899,804 people in the past ten years, an increase of 5.84%, and an average annual growth rate of 0.57%. \n\n There are 401,517,330 households in the provinces, autonomous regions and municipalities, with a household population of 1,244,608,395 people, with an average of 3.10 people per household, 0.34 less than the 3.44 people in the fifth national census in 2000. \n\nAmong the population of the 31 provinces, autonomous regions, municipalities and active military personnel on the mainland, there are 686,852,572 males, accounting for 51.27%; there are 652,872,280 females, accounting for 48.73%. The sex ratio of the total population (the ratio of males to females with females as 100) has dropped from 106.74 in the fifth national census in 2000 to 105.20. \n\n Among the population of the 31 provinces, autonomous regions, municipalities and active military personnel on the mainland, the population aged 0-14 was 222,459,737, accounting for 16.60%; the population aged 15-59 was 939,616,410, accounting for 70.14%; the population aged 60 and above was 177,648,705, accounting for 13.26%, of which the population aged 65 and above was 118,831,709, accounting for 8.87%. Compared with the fifth national population census in 2000, the proportion of the population aged 0-14 decreased by 6.29 percentage points, the proportion of the population aged 15-59 increased by 3.36 percentage points, the proportion of the population aged 60 and above increased by 2.93 percentage points, and the proportion of the population aged 65 and above increased by 1.3 percentage points. The proportion of the population increased by 1.91 percentage points. \n\nCompared with the fifth national population census in 2000, the number of people with a college degree per 100,000 people increased from 3,611 to 8,930. \n\nAmong the population of the 31 provinces, autonomous regions, municipalities directly under the central government and active military personnel on the mainland, the population living in towns[9] was 665,575,306, accounting for 49.68%; the population living in rural areas was 674,149,546, accounting for 50.32%. Compared with the fifth national population census in 2000, the urban population increased by 207,137,093, the rural population decreased by 133,237,289, and the proportion of the urban population increased by 13.46 percentage points. "
chi_pop.2.a: "Born in a prosperous age"
chi_pop.3: "The Seventh National Population Census"
chi_pop.3.t: "The Seventh National Population Census"
chi_pop.3.d: "The Chinese government conducted the registration for the seventh national census on November 1, 2020. The national population totaled 141.178 million, an increase of 72.06 million people, or 5.38%, compared with 133.972 million in 2010; the average annual growth rate was 0.53%, 0.04 percentage points lower than the average annual growth rate of 0.57% from 2000 to 2010. The data show that my country's population has continued to grow at a low rate over the past 10 years. \n\nThere are 494.16 million households in the country, with a population of 129.281 million; there are 28.53 million collective households, with a population of 118.97 million. The average population per household is 2.62, 0.48 less than the 3.10 in 2010. Household rules The scale of the population continues to shrink, mainly due to the increasingly frequent population mobility in my country and the improvement of housing conditions, young people living independently after marriage. \n\nThe population aged 0-14 is 253.38 million, accounting for 17.95%; the population aged 15-59 is 894.38 million, accounting for 63.35%; the population aged 60 and above is 264.02 million, accounting for 18.70% (of which the population aged 65 and above is 190.64 million, accounting for 13.50%). Compared with 2010, the proportion of the population aged 0-14, 15-59, and 60 and above increased by 1.35 percentage points, decreased by 6.79 percentage points, and increased by 5.44 percentage points respectively. The proportion of children in my country has rebounded, and the adjustment of the fertility policy has achieved positive results. At the same time, the degree of population aging has further increased. The pressure of long-term balanced population development will continue to deepen in the future. \n\nThe male population is 723.34 million, accounting for 51.24%; the female population is 688.44 million, accounting for 48.76%. The sex ratio of the total population (the ratio of males to females with females as 100) is 105.07, which is basically the same as in 2010 and slightly lower. The sex ratio of the newborn population is 111.3, which is 6.8 lower than that in 2010. The gender structure of my country's population continues to improve. \n\nThe population with a college degree is 218.36 million. Compared with 2010, the number of people with a college degree per 100,000 people increased from 8,930 to 15,467, and the average years of education for people aged 15 and above increased from 9.08 years to 9.91 years, The illiteracy rate dropped from 4.08% to 2.67%. The continuous improvement of the educational situation reflects that my country's efforts to vigorously develop higher education and eliminate illiteracy among young and middle-aged people over the past 10 years have achieved positive results, and the quality of the population has continued to improve. \n\nThe population living in cities and towns is 901.99 million, accounting for 63.89%; the population living in rural areas is 509.79 million, accounting for 36.11%. Compared with 2010, the urban population increased by 236.42 million, the rural population decreased by 164.36 million, and the proportion of urban population increased by 14.21 percentage points. With the in-depth development of my country's new industrialization, informatization and agricultural modernization and the implementation of the policy of urbanization of agricultural migrant population, my country's new urbanization process has been steadily promoted over the past 10 years, and urbanization construction has achieved historic achievements. \n\nChina's population structure has undergone a fundamental change, with opportunities and crises coexisting. "
chi_pop.3.a: "Are we also going to age?"

chi_pop.4: "Urbanization"
chi_pop.4.t: "Urbanization"
chi_pop.4.d: "According to preliminary data and registration, my country continued to maintain the trend of accelerating urbanization since the reform and opening up last year, with more and more rural people moving into cities.\n\nHigh-speed urbanization will have many impacts on Chinese society. The most important impact is that the transfer of rural labor will bring a large amount of cheap labor dividends, which is conducive to my country's rapid economic growth, but will also increase the pressure on medical and social expenditures. At the same time, another significant feature of urbanization is the reduction of the birth rate, which is conducive to the implementation of my country's family planning policy and the improvement of the overall quality of the population."
chi_pop.4.a: "Keep it up"
 
#AIIB#
china.20.t: "China creates Asian Infrastructure Investment Bank"
china.20.d: "The Chinese government announced today that it intends to invest in multiple infrastructure projects in countries around the world through the Asian Infrastructure Investment Bank as part of its Belt and Road Initiative. Although many developing countries welcomed the announcement, as they expect China to make much-needed investments in their economies, which will help accelerate the construction of infrastructure and interconnection in Asia, jointly cope with the international financial crisis, economic transformation and upgrading, and stable economic growth, and accelerate the process of economic integration in Asia, Japan, India, the United States and Australia have expressed reservations about the initiative, believing that it is a covert attempt by China to expand its influence overseas, just like the Belt and Road Initiative."
chi_aiib.2: "The [FROM.GetName] want to join the AIIB"
chi_aiib.2.t: "The [FROM.GetName] want to join the AIIB"
chi_aiib.2.d: "A new country wishes to become a full member of the  Asian Infrastructure Investment Bank!"
chi_aiib.2.a: "Welcome them"
chi_aiib.2.b: "The time has not come yet"
chi_aiib.6: "AIIB provides us with development assistance"
chi_aiib.6.t: "AIIB provides us with development assistance"
chi_aiib.6.d: "Beijing called and informed us that the Asian Infrastructure Investment Bank will provide us with a series of free development assistance!"
chi_aiib.6.a: "Great!"
chi_aiib.6.b: "We don't need it for now..."
chi_aiib.7: "AIIB provides us with low-interest loans"
chi_aiib.7.t: "AIIB provides us with low-interest loans"
chi_aiib.7.d: "Beijing called and told us that the Asian Infrastructure Investment Bank will provide us with a free low-interest loan!"
chi_aiib.7.a: "Great!"
chi_aiib.8: "China invites us to join the AIIB"
chi_aiib.8.t: "China invites us to join the AIIB"
chi_aiib.8.d: "A call came from Beijing. [CHI.GetLeader] invited us to join the Asian Infrastructure Investment Bank. [CHI.GetLeader] proposed that China will shoulder the responsibility as a major country and provide a large amount of construction resources to the member countries of the Asian Infrastructure Investment Bank."
chi_aiib.8.a: "Of course we would love to"
chi_aiib.8.b: "We are not interested"
chi_aiib.100.t: "New AIIB Member"
chi_aiib.100.d: "After a series of applications, assessments and connections, the [FROM.GetLeader] government announced today that [FROM.GetName] has officially become a member of the Asian Infrastructure Investment Bank."
chi_aiib.100.a: "A wise choice"
#EconomicCrisis
chi_crisis.1: "2008 economic crisis"
chi_crisis.1.t: "The financial tsunami spreads to China"
chi_crisis.1.d: "In the second half of 2008, affected by the global financial crisis caused by the United States, the global capital chain was tightened rapidly, financing costs rose sharply, corporate production slowed down sharply, and the world's real economy suffered a serious impact. China's manufacturing exports plunged sharply, from more than double-digit growth at the beginning of the year to negative growth. In the first quarter of 2009, exports continued to fall to double-digit negative growth, industrial production fell sharply, power generation grew zero, a large number of small and medium-sized export enterprises closed down and went bankrupt, and a large area of unemployment appeared in coastal areas.\n\nThe one-day G20 Leaders' Summit on Financial Markets and the World Economy was held in Washington, the capital of the United States, on November 15, 2008. Chinese President Hu Jintao delivered an important speech entitled "Working Together to Overcome Difficulties" at the meeting. The President pointed out that in order to effectively respond to this financial crisis, countries around the world should strengthen confidence, strengthen coordination, and work closely together."
chi_crisis.1.a: "The dragon is struggling"
chi_crisis.1.b: "Should the whole world bear the consequences of America's actions?"
chi_crisis.2: "factory closure"
chi_crisis.2.t: "The impact of the economic crisis"
chi_crisis.2.d: "Due to the impact of the current economic crisis, factories have closed down in large numbers, and the assets of securities companies and enterprises have evaporated in an instant. We don't know how long this situation will last..."
chi_crisis.2.a: "Oh my god..."
chi_crisis.3: "factory closure"
chi_crisis.3.t: "factory closure"
chi_crisis.3.d: "Due to the impact of the economic crisis, a large number of foreign trade factories in coastal areas have closed down."
chi_crisis.3.a: "Oh my god..."
