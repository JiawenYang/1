#Social Policy Tree
CHI_Millennium_Society: "Millennium Society"
CHI_Millennium_Society_desc: "After entering the 21st century, our society has become more colorful and vibrant, and many new things have emerged."
CHI_human_rights: "Human Rights"
CHI_human_rights_desc: "The Communist Party of China upholds the people's supremacy, insists on combining the universal principles of human rights with China's reality, insists that the right to survival and development is the primary and fundamental human right, insists that the people's happy life is the greatest human right, insists on promoting the all-round development of people, constantly enhancing the people's sense of gain, happiness and security, and has successfully embarked on a path of development of human rights with Chinese characteristics."
CHI_Feminism: "Women's Rights"
CHI_Feminism_desc: "Women make up half of the human race. How to treat women's rights is a constant measure of a society's development."
CHI_Supporting_feminism: "Supporting Feminism"
CHI_Supporting_feminism_desc: "All feminist theories have a basic premise, which is that women are oppressed and discriminated against all over the world. It is unbelievable that in the 21st century, women in our country are still oppressed from all sides. We must correct the wrongs and strive for more rights for women, so as to achieve women's liberation in a fundamental sense."
CHI_Gender_equalitym: "Gender equality"
CHI_Gender_equalitym_desc: "Feminist theories are complex, but they all boil down to one sentence: achieving gender equality among all human beings. In patriarchal and capitalist societies, male and female proletarians are equally exploited by all vested interests. We want to liberate not only women, but all oppressed people."
CHI_Combating_feminism: "Combating Feminism"
CHI_Combating_feminism_desc: "Feminism is an ideological weapon that came from the West after the reform and opening up, and is intended to create internal conflicts in our country and make men and women hate each other. It is urgent to eliminate these sewer rats from our great motherland."
CHI_Gender_struggle: "Gender Struggle"
CHI_Gender_struggle_desc: "In a class society, all contradictions are class contradictions. The oppression of women by men for thousands of years is a manifestation of class oppression. Men regard women as an oppressed class and continue to intensify the oppression. We must look at gender issues from the perspective of class struggle and regard men as class enemies. Revolution is not a dinner party. Noisy quarrels cannot solve problems. To achieve complete liberation, we must have a thorough fighting spirit."
CHI_A_louder_call: "Louder Call"
CHI_A_louder_call_desc: "The issue of gender cannot be seen as a simple class issue. We should express our voices in a more rational and pragmatic way. Chairman Mao Zedong said that we should make our enemies fewer and our friends more. In the new era, we will not compromise with any oppression, nor will we turn any non-enemy into an enemy. We call out loudly and let the whole society hear the voice of women."
CHI_refuses_to_be_breeding_machines: "Refuses to be breeding machines"
CHI_refuses_to_be_breeding_machines_desc: "Women have the ability to reproduce, so they have been treated as breeding machines for thousands of years, becoming men's private property and sex slaves. How can this be justified! We will never allow any form of gender exploitation. Reproduction is the greatest exploitation of women. Start refusing to reproduce now and let those men see who is the dominant force in the reproduction process."
CHI_Monopoly_of_reproductive_rights: "Monopoly of reproductive rights"
CHI_Monopoly_of_reproductive_rights_desc: "The most fundamental difference between women and men is that women have the ability to get pregnant, and therefore have to pay a greater price in childbirth. Pregnancy for ten months is a great torture for any woman, but women have paid the obligation to give birth but have not obtained the corresponding rights. We should make good use of the gender characteristics that women are born with, convert them into reproductive privileges, and let women take the lead in childbirth."
CHI_Contact_foreign_feminist_organizations: "Contact foreign feminist organizations"
CHI_Contact_foreign_feminist_organizations_desc: "The feminist movement in the West started very early, and the theoretical achievements and struggle results are quite rich. The first wave of feminist movement took place between 1840 and 1925, and at that time Chinese women were still working like slaves for their male masters! Instead of crossing the river by feeling the stones on our own, it is better to refer to the successful cases that have already been done. We should get in touch with foreign feminist organizations and learn from them their theoretical knowledge and struggle experience."
CHI_Independence_and_autonomy: "Independence and autonomy"
CHI_Independence_and_autonomy_desc: "The cause of women's liberation cannot rely on anyone else, we must do it by ourselves. Weakness and compromise are the characteristics of the petty bourgeoisie. Who knows if those Western feminist organizations have ulterior motives? What if they are manipulated by foreign governments and take the opportunity to interfere in our internal affairs? The cause of women's rights is not selling out the country, so we don't want to be the leader of traitors - no, we should say women traitors."
CHI_Establishing_an_Independent_Bill_of_femininity_Rights: "Establishing an Independent Bill of Femininity Rights"
CHI_Establishing_an_Independent_Bill_of_femininity_Rights_desc: "The rights gained by women should be defended in a more effective way, and legislation is the best way. By establishing a new law and elevating women's rights to a status beyond general human rights, we can show how great our cause of women's rights is."
CHI_revise_of_women_Rights_Act_of: "Revision of the Women's Rights Act of"
CHI_revise_of_women_Rights_Act_of_desc: "The existing Women's Rights Act cannot effectively protect women's rights. We need to add a more complete bill to protect women's rights from being trampled and violated from a legal perspective."
CHI_Female_specificity: "Female specificity"
CHI_Female_specificity_desc: "Women should not be defined! We are all beautiful because each of us has our own colors. Women are more sensitive, compassionate, kinder, and more special than men. You should know that in the embryonic period, female characteristics are the initial characteristics of each embryo, and male is the "second sex" that develops later in life! We reject the male gender gaze and we will defend the supreme honor of being born a woman."
CHI_strive_for_the_rights_to_speak: "Strive for the rights to speak"
CHI_strive_for_the_rights_to_speak_desc: "Men and women are both human beings. There is no point in judging one over the other. Women should not be defined by others, and neither should men. We will not use despicable methods to promote feminism. We will speak with facts, fight for the right to speak that we deserve, and push society towards a more equal, friendly, and better direction."
CHI_Joint_LGBT_population: "Joint LGBT Population"
CHI_Joint_LGBT_population_desc: "The LGBT community has also been oppressed by patriarchy for a long time. Many of them are born beautiful but persecuted, just like us women! The feminist cause is not only the cause of liberating us women, but also the liberation of all people who are oppressed in the patriarchal society and the defense of their rights as human beings! What's more, some of them are really good-looking."
CHI_Maintain_distance_from_LGBT_population: "Maintain distance from LGBT population"
CHI_Maintain_distance_from_LGBT_population_desc: "LGBT people are indeed similar to women in some ways - both are smeared and oppressed by patriarchal society. However, rights are won through struggle. LGBT people cannot even form a good group self-identity. How can they organize a large-scale movement for rights? Moreover, their self-awareness is still unstable. We cannot let the feminist cause suffer potential obstacles due to this uncertainty."
CHI_The_New_Era_of_Women: "The New Era of Women"
CHI_The_New_Era_of_Women_desc: "The era of patriarchy has ended. China has become a women-friendly society under our promotion. We will use Changsha, a women-friendly city, as a model to condense the spirit of women in the new era - the Changsha spirit."
CHI_Adhere_to_and_strengthen_leadership_in_women_work: "Adhere to and strengthen the Party's leadership in women's work"
CHI_Adhere_to_and_strengthen_leadership_in_women_work_desc: "The Communist Party of China has always adhered to and strengthened its leadership in women's work. Over the past 70 years, the Communist Party of China has always upheld the political proposition of equality between men and women, set the realization of women's liberation and equality between men and women as its goal, and regarded the women's cause as an important part of the Party's cause. The First to Twelfth National Women's Congresses were held to determine the principles and main tasks of the women's movement and women's work in accordance with the overall work of the Party and the State, and to coordinate and promote women's work. Entering the new era, the Party's leadership in women's work has been further strengthened. "Adhering to the basic national policy of equality between men and women and safeguarding the legitimate rights and interests of women and children" was written into the reports of the 18th and 19th National Congresses of the Party, becoming an important concept and content of the Party's governance."
CHI_Improve_women_political_rights: "Improve women's political rights"
CHI_Improve_women_political_rights_desc: "my country attaches great importance to protecting the equal political rights of women and men. At the beginning of the founding of New China, the law stipulated that men and women have equal rights to vote, be elected and manage state affairs. Over the past 40 years of reform and opening up, socialist democracy with Chinese characteristics has been continuously improved, providing new opportunities and expanding new channels for women to participate in politics. Since the 18th National Congress of the Communist Party of China, in the process of promoting the modernization of the national governance system and governance capacity, the level of women's participation in the management of state and social affairs has been comprehensively improved, and their role in the construction of democratic politics has been increasingly strengthened."
CHI_Establish_sound_Women_Federation_organization: "Establish and improve the Women's Federation organization"
CHI_Establish_sound_Women_Federation_organization_desc: "The All-China Women's Federation is a mass organization of women from all ethnic groups and all walks of life who have united to strive for further liberation and development. It is a people's organization under the leadership of the Communist Party of China. Under the leadership of the Party, the Women's Federation, in accordance with its charter, earnestly undertakes the political responsibility of uniting and guiding women from all ethnic groups and all walks of life to listen to and follow the Party, and earnestly performs the basic functions of representing and safeguarding women's rights and interests, promoting gender equality and women's all-round development. Focusing on the overall work of the Party and the country, it widely and deeply publicizes the Party's theories, lines, principles and policies, unites and guides the majority of women to unswervingly follow the path of women's development with Chinese characteristics, give full play to their unique role in social life and family life, and make contributions to the cause of socialism with Chinese characteristics."
CHI_Improve_laws_to_protect_womenrights_and_interests: "Improve laws to protect women's rights and interests"
CHI_Improve_laws_to_protect_womenrights_and_interests_desc: "Women's rights are basic human rights. my country has incorporated the protection of women's rights into laws and regulations, elevated it to the will of the state, and internalized it into social behavioral norms. At the beginning of the founding of the People's Republic of China, the Communist Party of China formulated and implemented a series of laws and regulations to improve the status of women. The Constitution of the People's Republic of China, as the fundamental law of the state, always adheres to the principle of equality between men and women. The first constitution in 1954 stipulated that women enjoy equal rights with men in all aspects of political, economic, cultural, social and family life, and this principle has been consistently maintained in all subsequent amendments. In 2004, "the state respects and protects human rights" was written into the constitutional amendment, laying the foundation for the protection of women's human rights."
CHI_strengthen_propaganda_of_Gender_equality: "Strengthen Propaganda of Gender Equality"
CHI_strengthen_propaganda_of_Gender_equality_desc: "Incorporate legal knowledge, the spirit of the rule of law, and the culture of the rule of law that protect women's rights into the national legal education plan. From the "First Five-Year Plan" for legal education implemented in 1986 to the "Seventh Five-Year Plan" for legal education implemented in 2016, we have always regarded improving women's legal awareness and legal literacy and enhancing women's ability to participate in legal practice as important tasks, insisting on combining legal education and publicity for women with promoting the core socialist values, combining legal education and publicity with protecting women's rights in accordance with the law, combining regular legal education with key legal education such as the International Women's Day every year, combining legal education through traditional media with legal education through emerging media, and combining legal education and publicity with stimulating the vitality of women as subjects."
CHI_Establish_gender_equality_evaluation_mechanism: "Establish gender equality evaluation mechanism"
CHI_Establish_gender_equality_evaluation_mechanism_desc: "In accordance with the filing and review system and procedures of the Legislation Law of the People's Republic of China, a new mechanism is established to protect women's rights and interests at the source and promote equal development between men and women. From 2012 to 2018, 30 provinces (autonomous regions and municipalities) across the country established gender equality evaluation mechanisms for laws and policies, introduced the value concept of gender equality into the formulation, implementation and supervision of laws and policies, strengthened the institutionalization of research and judgment before the formulation of policies and regulations, implementation during decision-making, and evaluation after implementation, further reflecting the will and expectations of women in the new era, and further enriching the vivid practice of scientific and democratic legislation in the new era."
CHI_Ensuring_equal_land_rights_for_women: "Ensuring equal land rights for women"
CHI_Ensuring_equal_land_rights_for_women_desc: "Women are important builders of the country. From land reform, rural household contract responsibility system to rural contract land rights confirmation, registration and certification and rural land "three rights separation", China has always attached importance to protecting women's land rights and interests through legal system. Since 2010, the registration and certification of rural contracted land rights has been carried out, and it is clearly required that rural women’s land contracting and management rights be recorded on the ownership certificate, so that the majority of rural women have achieved "name on the certificate and rights under the name". The Land Contract Law clearly stipulates that family members in a farmer's household shall enjoy equal rights and interests in contracting land in accordance with the law, ensuring that rural women enjoy equal rights to contract and operate land. In 2016, the CPC Central Committee and the State Council issued the "Opinions on Steadily Advancing the Reform of the Rural Collective Property Rights System". In 2018, the Ministry of Civil Affairs, the Central Organization Department, the All-China Women's Federation and other seven departments jointly issued the "Guiding Opinions on Doing a Good Job in Village Rules and Residents' Conventions", requiring the correction of violations of laws and policies. The land rights and economic interests of rural women are effectively protected, and they are actively involved in rural revitalization and contribute to the modernization of agriculture and rural areas.
CHI_Gender_equality_on_maternity_leave: "Gender Equality on Maternity Leave"
CHI_Gender_equality_on_maternity_leave_desc: "Article 7 of the Special Provisions on Labor Protection for Female Employees states: "Female employees are entitled to 98 days of maternity leave, including 15 days of prenatal leave; in case of difficult labor, an additional 15 days of maternity leave shall be granted; in case of multiple births, an additional 15 days of maternity leave shall be granted for each additional baby. Female employees who suffer a miscarriage before the fourth month of pregnancy shall enjoy 15 days of maternity leave; those who suffer a miscarriage after the fourth month of pregnancy shall enjoy 42 days of maternity leave. Today, legislation should be passed to allow men to enjoy the same maternity leave rights as women, which is an important cornerstone for ensuring gender equality."
CHI_Equal_reproductive_rights: "Equal reproductive rights"
CHI_Equal_reproductive_rights_desc: "Men and women should have the same obligations and rights in reproductive issues. Reproduction is a matter for both men and women, not a unilateral obligation or right of one party. We must strengthen the promotion of equal reproductive rights and build a more harmonious and beautiful concept of reproduction."
CHI_Completely_prohibit_bride_price_system: "Completely prohibit the bad custom of bride price"
CHI_Completely_prohibit_bride_price_system_desc: "Bridal gifts and dowries are the most reactionary and feudal aspects of today's marriage customs. They are the vicious practices of alienating people as commodities and turning marriage into a human trafficking business. It is unbelievable that such feudal remnants still exist in a socialist country in the 21st century. For a long time, my country has adopted a cold attitude towards the issue of bridal gifts. It does not recognize or encourage it, but it does not prohibit it either. It only treats it as a gift of property. Now is the time to completely eliminate these feudal remnants. Socialism does not need human trafficking."
CHI_Completely_prohibit_sexual_transaction: "Completely prohibit sexual transactions"
CHI_Completely_prohibit_sexual_transaction_desc: "The essence of sex trade is to commodify people, treating them as pieces of meat and tools for sexual gratification. It is an alienation of people and will lead to the tragedy of disguised human trafficking and physical exploitation. After the founding of New China, the sex industry in mainland China was quickly eliminated, and by the end of 1951, the work of banning prostitution in various places was basically completed. After the reform and opening up, the sex industry quickly made a comeback and reached a considerable scale, but my country's attitude of strictly prohibiting the pornography industry has not wavered in the slightest. These gray industries must be completely eradicated, whether they serve men or women."
CHI_Protecting_Women_labor_rights: "Protecting Women's Labor Rights"
CHI_Protecting_Women_labor_rights_desc: "Why is the status of women so low? The fundamental reason is that women do not enjoy adequate labor rights. Women are not economically independent and will inevitably rely on others, which will inevitably lead to widespread gender inequality and gender exploitation. my country attaches great importance to institutionally protecting the labor protection rights of female employees. From the promulgation of the "Regulations on Labor Protection of Female Employees" in 1988 to the introduction of the "Special Regulations on Labor Protection of Female Employees" in 2012, the level of labor protection for female employees has been continuously improved. The "Guidebook on Promoting Gender Equality in the Workplace" was compiled and issued to promote employers to implement laws and regulations and safeguard the legitimate rights and special interests of female employees. Various labor protection work has been deepened, creating conditions for female employees to participate in economic and social development. Female employees from all walks of life, with a high sense of responsibility and historical mission, are playing an increasingly important role in the country's economic development and social progress."
CHI_Ensuring_women_education_right: "Ensuring women's right to education"
CHI_Ensuring_women_education_right_desc: "Education is the fundamental way to cultivate modern consciousness and modern citizens. The Compulsory Education Law of the People's Republic of China and other laws and policies have continuously increased investment in compulsory education, with a focus on rural areas. Through the establishment of primary and secondary school scholarships, the formulation of special assistance policies for girls, and the implementation of student aid projects such as the "Spring Bud Project" and the "Hope Project", the opportunities for rural girls to receive education have been greatly increased. In 1988, the Higher Education Law of the People's Republic of China was promulgated, which continuously expanded the scale of higher education, promoted the student loan system, and established student scholarships, creating conditions for more women to receive higher education."
CHI_socialist_women: "Socialist Women"
CHI_socialist_women_desc: "Thanks to our efforts, women's rights have finally been fundamentally and widely protected, and the era of gender exploitation is gone forever. The women cultivated by our great socialist motherland must be confident, glorious and hardworking working women."
CHI_denied_gender_inequality: "Denying gender inequality"
CHI_denied_gender_inequality_desc: "Where is the gender inequality? There are so many women walking on the street in revealing clothes, half of the classrooms are girls, and even many jobs are open to women only. Where is the inequality? These bitches are really just trying to stir up trouble! There is nothing worth discussing. What's more, the world is inherently unequal. Why should women be the first to call for equality? It's just nonsense."
CHI_Moral_condemnation: "Moral Condemnation"
CHI_Moral_condemnation_desc: "Gender inequality has ended. Women now have the right to do anything freely. We also have the right to criticize these women. Those women who clamor for women's rights are all homosexuals. They are in cahoots with those androgynous people who call themselves LGBT. They are determined to destroy all beautiful and stable things, trample all sacred and correct things under their feet, and satisfy their perverted sexual desires."
CHI_Deprivation_of_women_political_rights: "Deprivation of women's political rights"
CHI_Deprivation_of_women_political_rights_desc: "What do women know about politics? It's harder to make a sow fly than to make them understand the difference between different political ideas and ideologies. Politics is a man's game. Letting women get involved in politics will only make a mess of everything, leaving them with sissies and gigolos. Depriving women of their right to participate in politics is not only for their own good, but also for the sake of the society in which we all live."
CHI_Women_go_home: "Women go home!"
CHI_Women_go_home_desc: "Women's job is to take care of their husbands and children, while men are the ones who work hard outside. This is how it should be. Women's competition with men in the public sphere causes double harm: on the one hand, they force men to become workaholics so that they can keep their good jobs, such as mental labor positions; on the other hand, they make men more likely to accept bad jobs, such as physical labor positions. Allowing women to participate in social production labor is a very bad thing that "makes men unemployed and adds burden to women." Can women do better than men?"
CHI_Family_First: "Family First"
CHI_Family_First_desc: "Family is the basic unit of society. Everyone should get married after adulthood. Only in this way can society function stably and normally. Those feminists love to clamor for no marriage and no children. This is simply unreasonable. They like homosexuality, but what should men do? Should they let two men pair up like they do with those LGBT people who are neither male nor female? Moreover, without marriage, there is no way to have children. What's the future of a nation without children? For the sake of the sacred family and the future of the nation, all feminists must be eradicated."
CHI_Criminalization_of_abortion: "Criminalization of abortion"
CHI_Criminalization_of_abortion_desc: "Everyone has the right to live. It's fine for feminists not to get married, but they even have abortions at will. This is simply naked murder! Are their lives the only lives that matter, and not the lives of babies? The feminists' evil faces are fully revealed in the face of human life. These murderers and potential murderers must all be convicted and thrown into prison."
CHI_Demonizing_feminists: "Demonizing Feminists"
CHI_Demonizing_feminists_desc: "Feminists are all selfish, humorless, unkempt, and deliberately unfeminine perverts, as well as jealous, noisy, and shrewish women. Not only are feminists extremely stupid, they can't stand the instigation of those with ulterior motives and become tools for others to gain fame and fortune. They are also irritable and reckless, angry all day long, extreme and rigid in their thinking, and sexism is everywhere. Who knows what single working women spend the night with their bosses? Who knows what kind of cheesy movies those old virgins like to watch in private?"
CHI_The_Value_of_Men: "The Value of Men"
CHI_The_Value_of_Men_desc: "Men are born confident, strong, and full of masculinity. However, once they get involved with women, they become as stupid and neurotic as them, and are not manly at all. When men get along with other men, they become united, friendly, and cooperative. Let us get rid of women and shackles, restore our brotherhood, find the unique feeling of men, get rid of the oppression of industrialization and feminism, and in the activities of returning to nature, men go to the forest collectively to play drums, sing songs, listen to poems and myths, and inspire the blood of our hunting ancestors."
CHI_blame_the_victim: "Blame the Victim"
CHI_blame_the_victim_desc: "Isn't it women's own fault that they are vulnerable to rape and robbery? Isn't it because they dress like that to attract men? In a legal society, instigating others to commit crimes is also a crime. We still forgive such crimes, but no one will sympathize with the consequences of their stupid behavior."
CHI_Confucianism_ethic: "Promote Confucian ethics"
CHI_Confucianism_ethic_desc: "Men are upright outside, women are upright inside, and husband and wife create the beginning of all things. Where there are men and women, there must be husband and wife. When the way of husband and wife is cultivated, the etiquette inside and outside is correct. Zisi said: "The way of a gentleman starts with husband and wife." Self-cultivation and family management are the foundation of education. The five virtues are always prominent, and the great foundation is strengthened. The meaning of the three cardinal guides is clear, and human relations are correct. The ruler is the guide for the ministers, the father is the guide for the sons, and the husband is the guide for the wife. When the ruler is upright and the ministers are loyal, the father is kind and the sons are filial, and the husband and wife are harmonious, then human relations are correct."
CHI_Advocate_consumerism: "Advocate consumerism"
CHI_Advocate_consumerism_desc: "A man who can't earn money is not a good man, and a woman who can't spend money is not a good woman. The main force of consumption is of course women, and women should spend all the money. Use cosmetics, luxury goods and beautiful clothes to squeeze out all the money of women, overdraw their loan limit, so that they have to rely on men."
CHI_domesticating_education: "Domesticating Education"
CHI_domesticating_education_desc: "In modern society, everyone has the right to receive education, and women are no exception. Women should learn what women should learn. Since they cannot learn complicated things, they should learn more home economics and ideological and political courses."
CHI_True_Women: "True Women"
CHI_True_Women_desc: "Thanks to our efforts, the chaos of feminists has finally been suppressed, and women have finally gotten rid of the instigation of feminist ideas. Now our society will be more harmonious, and both men and women can find their own positions and be content with the status quo."
CHI_laborer_rights_and_interests: "Laborer Rights and Interests"
CHI_laborer_rights_and_interests_desc: "Laborer rights and interests are a major issue in our country and need to be treated with caution."
CHI_Emphasize_labor_laws: "Emphasize labor laws"
CHI_Emphasize_labor_laws_desc: "my country has already issued labor laws, which have detailed provisions on the definition of labor-capital status and the relationship between them. However, for various reasons, my country's labor laws are often ignored. To deal with labor rights and interests, we must take the rule of law as the basis, and we must emphasize the role of labor laws in regulating labor rights and interests."
CHI_Protecting_workers: "Protecting the rights of workers"
CHI_Protecting_workers_desc: "Working people are the cornerstone of our country's development. They are a multi-class political group that includes the middle and small bourgeoisie, civil servants, intellectuals, freelancers, fishermen and craftsmen. Workers rely on labor hygiene to promote social development. We must implement and protect the legitimate rights and interests of workers. Otherwise, how can we say that we are a socialist country?"
CHI_Comfort_entrepreneurs: "Comfort entrepreneurs"
CHI_Comfort_entrepreneurs_desc: "In my country, entrepreneurs and capitalists are not completely overlapping. Entrepreneurs are people who control more effective means of production under the socialist market economy and play an important leading role in economic development. Entrepreneurs are also citizens of my country, and their labor rights and interests must also protect their labor income."
CHI_Corporatism: "Regulating labor-capital conflicts"
CHI_Corporatism_desc: "Our country's current central task is economic construction rather than class struggle. All workers and entrepreneurs must put aside their disputes and work together to build our great motherland."
CHI_All_China_Federation_of_Trade_Unions: "All-China Federation of Trade Unions"
CHI_All_China_Federation_of_Trade_Unions_desc: "Our party serves the people and is the vanguard of the proletariat. We should lead all workers... er, for example, establish a federation of trade unions... and ensure the interests of workers..."
CHI_Commission_of_Commerce: "Commission of Commerce"
CHI_Commission_of_Commerce_desc: "The non-public economy is an important part of the socialist market economy, and it is also the most difficult part to manage and control. Establishing commerce committees in various places to supervise and lead the economic activities of entrepreneurs is an important means to ensure the smooth development of our country's economy."
CHI_Class_struggle_led_by_Party: "Class struggle led by the Party"
CHI_Class_struggle_led_by_Party_desc: "The Party leads everything, including the Party, government, military, people, and education. Class struggle must also be carried out under the leadership of the Party. Prohibiting destructive struggles and endless exploitation is the Party's responsibility and commitment to the country and the people."
CHI_The_collaboration_between_labour_and_capital: "The collaboration between labour and capital"
CHI_The_collaboration_between_labour_and_capital_desc: "Labor-capital cooperation and harmonious labor relations are the foundation of social harmony. However, cooperation and harmony must be based on equality. So-called cooperation and harmony without equality is slavery and oppression, covering up contradictions rather than eliminating them. Such so-called cooperation and harmony cannot last. Cooperation is not merger, but promoting the interests of all parties at the same time through benefit sharing; harmony is not the absence of contradictions, but the reasonable resolution of contradictions and conflicts to avoid the intensification of contradictions. Only when the reasonable rights and interests of workers are protected and benefit sharing is achieved (both labor and capital benefit), can labor-capital relations be harmonious, labor-capital cooperation continue, economic development be sustained, and society be harmonious."
CHI_The_right_to_education: "The right to education"
CHI_The_right_to_education_desc: "Education is a basic right enjoyed by every citizen and is also a fundamental plan for the prosperity of a country. The education problem in our country is very complex, involving many aspects and fields, and also involving the interests of different groups."
CHI_reform_from_the_bottom: "Reform from the bottom"
CHI_reform_from_the_bottom_desc: "Strong medicine cures disease, severe punishments are used to control chaos. Only by correcting the root cause can we clear the source. Only by rectifying from the root and clearing up from the source can we do a good job in education."
CHI_consolidating_vital_base: "Consolidating the vital base"
CHI_consolidating_vital_base_desc: "The course of nature is constant, and there is a limit to how much wealth and emptiness there are. Education reform cannot be rushed. This is an issue that concerns hundreds of millions of teachers and students, and even more than a billion people in the entire society. It must be handled with caution."

