chi_GRnews.66.a: "Lots of friends!"

chi_GRnews.67: "China cuts off trade in our goods!"
chi_GRnews.67.t: "China cuts off trade in our goods!"
chi_GRnews.67.d: "The Chinese diplomatic department today cancelled any trade orders with us and expelled our diplomats. This will have a serious impact on our economy."
chi_GRnews.67.a: "Why?"

chi_GRnews.68: "China is weakening our international status!"
chi_GRnews.68.t: "China is weakening our international status!"
chi_GRnews.68.d: "In recent years, our global influence has declined dramatically, thanks to Chinese efforts, jeopardizing our position as the world's only hegemon and laying the foundations for a new world order. Perhaps those who predicted the "end of history" after our victory over the Soviet Union were too optimistic after all."
chi_GRnews.68.a: "We must strike now before it's too late!"
chi_GRnews.68.b: "It's better not to mess with them..."

chi_GRnews.69: "Real Men" is a hit
chi_GRnews.69.t: "Real Men" is a hit
chi_GRnews.69.d: "At the beginning of this month, Hunan Satellite TV broadcast a special national defense education program jointly launched with the August 1st Film Studio of the Chinese People's Liberation Army, called "Real Men". The program recorded 6 stars with different age spans and personality labels, who went deep into the front-line troops, changed their identities, and experienced 4 times of 5 days and 4 nights in different military branches, eating, living and training with young soldiers in the real military camp experience.\n\nThe "Real Men" program team went into the military camp and filmed between various arms. The stars will eat, live and train with the soldiers to help them realize the transformation of "real men". The director team implemented "zero intervention" and obeyed the command in the army. The director was only responsible for recording, and the training process was also real. After entering the army, all the stars participating in the filming will be completely handed over to the army for management in accordance with the requirements of ordinary recruits. The celebrity guests need to strictly abide by the military discipline, follow the command in all actions, and be absolutely obedient, and there can be no excuses. . Even the smallest details of life must be strictly followed in accordance with the army's schedule and arrangements. Unlike other celebrity programs, all staff members are prohibited from talking to celebrities during the recording. Any situation that occurs in the barracks is handled by ordinary soldiers and officers in accordance with the army's regulations and daily life system. The director team recorded and filmed 24 hours a day in accordance with the requirements of the documentary. \n\nPhoenix Entertainment commented that "Real Men" not only reflects the friendship between the army's soul and men, but also truly shows China's modern military power through the training process of celebrity recruits. The audience saw the hard sweat and touching tears shed by the celebrity recruits in the barracks, and also felt the blood and style of soldiers such as squad leader Wang and instructor Xie. The program's inspiring words such as "Soldiers can only hold their positions in combat if they are punctual", "Ability can be trained", and "Being a man must persist" also made the audience excited like a tonic. "
chi_GRnews.69.a: "This is a real man!"
chi_GRnews.70: "In the Name of People is a hit"
chi_GRnews.70.t: "In the Name of People is a hit"
chi_GRnews.70.d: "On March 28, Hunan Satellite TV's "Golden Eagle Exclusive Theater" broadcast a special TV series, a main theme repetitive TV series called "In the Name of the People". The play is adapted from Zhou Meisen's novel of the same name. It tells the story of a project director of a national ministry suspected of accepting bribes of tens of millions. When Hou Liangping, the director of the anti-corruption investigation, investigated, he found that his appearance was simple. At the same time, Ding Yizhen, the deputy mayor of Jingzhou City, Handong Province, who was involved in the case, successfully escaped overseas. The case involves the struggle for equity in the state-owned enterprise Dafeng Garment Factory, and the political forces are complicated. Chen Hai, the former director of the anti-corruption bureau, was in a car accident, and Hou Liangping took over the investigation. There are two major forces in the political arena of Handong Province, the "political and legal system" and the "secretary gang". The arrival of the new provincial party secretary Sha Ruijin will break this balance and inject new impetus into the reform.\n\nAfter the play was broadcast on Hunan Satellite TV's "Golden Eagle Exclusive Theater" on March 28, 2017, the ratings exceeded 8%, setting a new record for provincial satellite TV ratings in the past decade. On April 27, 2017, the play was broadcast on GMIC X It won the "Most Influential Film and Television Work in the Internet Era" award at the 2017 Extraordinary Ceremony. \n\nBeijing Evening News commented that this anti-corruption drama did not rely on the simple imagination of relying on wise rulers and honest officials to resolve power corruption, but instead brought out one thought-provoking real problem after another, extending from the officialdom to the grassroots level, and landing on every organizational management system in Chinese society, which made ordinary people far away from the power level also feel a lot. "
chi_GRnews.70.a: "Teacher, I really want to improve"
chi_GRnews.71: "A letter to the whole party, the whole army and the people of all ethnic groups in the country"
chi_GRnews.71.t: "A letter to the whole party, the whole army and the people of all ethnic groups in the country"
chi_GRnews.71.d: "The Central Committee of the Communist Party of China, the Standing Committee of the National People's Congress of the People's Republic of China, the State Council of the People's Republic of China, the National Committee of the Chinese People's Political Consultative Conference, the Communist Party of China and the Central Military Commission of the People's Republic of China are extremely sad to inform the whole party, the whole army and the people of all ethnic groups in the country: Our beloved comrade Jiang Zemin suffered from leukemia and multiple organ failure. He died in Shanghai at 12:13 on November 30, 2022 at the age of 96.\n\nComrade Jiang Zemin is an outstanding leader with high prestige recognized by our party, our army and the people of all ethnic groups in our country, a great Marxist, a great proletarian revolutionary, politician, military strategist, diplomat, a time-tested communist fighter, an outstanding leader of the great cause of socialism with Chinese characteristics, the core of the third generation of the party's central leadership collective, and the main founder of the important thought of "Three Represents".\n\nThe death of Comrade Jiang Zemin is an immeasurable loss to our party, our army and the people of all ethnic groups in our country. The Party Central Committee calls on the whole party and the whole army to The people of all ethnic groups across the country turn grief into strength, inherit the legacy of Comrade Jiang Zemin, and express our condolences with practical actions. \n\nWe must strive to learn the important thought of "Three Represents", learn Comrade Jiang Zemin's revolutionary spirit and revolutionary style, learn his scientific attitude and creative spirit of using Marxist standpoints, viewpoints, and methods to study new situations and solve new problems, and unite and strive to build our country into a prosperous, democratic, civilized, harmonious and beautiful socialist modern power. \n\nThe great rejuvenation of the Chinese nation has condensed the hard work and struggle of generations of Communists, including Comrade Jiang Zemin. On the road ahead, the whole party, the whole army and the people of all ethnic groups across the country must, under the strong leadership of the Party Central Committee with Comrade Xi Jinping as the core, hold high the great banner of socialism with Chinese characteristics, fully implement Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era, carry forward the great spirit of party building, strengthen confidence, work together, work hard, and forge ahead courageously, and unite and strive for the comprehensive construction of a socialist modern country and the comprehensive promotion of the great rejuvenation of the Chinese nation. "
chi_GRnews.71.a: "Comrade Jiang Zemin will live forever!"
chi_news.21: "Former Chinese leader Jiang Zemin dies"
chi_news.21.t: "Former Chinese leader Jiang Zemin dies"
chi_news.21.d: "At 12:13 on November 30, 2022, former Chinese leader Jiang Zemin died in Shanghai at the age of 96. China held a grand memorial service for him to commemorate this old man who was of great significance to the Chinese people.\n\nChinese embassies and consulates abroad and other overseas institutions lowered their flags to mourn, and Tiananmen Square and Xinhua Gate in Beijing also lowered their flags to mourn Jiang Zemin. Before the meeting, the UN Security Council held a moment of silence to mourn the death of Jiang Zemin. Harold Agyeman, the rotating president of the Security Council and Ghana's permanent representative to the United Nations, said: Former Chinese President Jiang Zemin made great contributions to international peace, security and development, and to China's reform and opening up, modernization and economic development. The international community remembers Jiang Zemin for this. His death is a huge loss for China and the international community. Afterwards, representatives of various countries stood up and observed a minute of silence."
chi_news.21.a: "He ultimately failed to defeat aging"
chi_news.21.b: "Comrade Jiang Zemin will live forever!"
chi_GRnews.72: "A Certain Scientific Railgun" is now on air!"
chi_GRnews.72.t: "A Certain Scientific Railgun" is now on air!"
chi_GRnews.72.d: "Three months ago, the manga "A Certain Scientific Railgun" written by Japanese manga artist Kazuma Kamachi and illustrated by Motoo Fuyukawa was officially announced to be animated. On the 2nd of this month, "A Certain Scientific Railgun" was officially broadcast on Tokyo Metropolitan Television, and the first episode was "Electric Tortoise Star". This is an animation adapted from the manga of the same name, which features the popular character Misaka Mikoto in the light novel "A Certain Magical Index" written by Kazuma Kamachi. The first half of the animation is adapted from volumes 1 to 3 of the original manga, while the second half is written by Kazuma Kamachi, the original author of "A Certain Magical Index".\n\nThe plot tells the story of a fictional city called "Gakuen City" that occupies one-third of the western part of Tokyo and is home to 2.3 million people, 80% of whom are students. The Academy City is isolated from the outside world and studies the most advanced technology. . All students receive superpower development, and most of them obtain superpowers through drugs, hypnosis and electrical stimulation. There are various types of different abilities, which are divided into people with no ability, people with low ability, people with different abilities, people with strong abilities, people with great abilities and people with super abilities according to their range and power. The story begins with the strongest electric princess in the academy city, "A Certain Scientific Railgun" Misaka Mikoto, who one day met Hatsuharu Shikaori, who is also a member of the discipline committee like Shirai Kuroko...\n\nDue to the extremely high popularity of the original work, this anime became a hit as soon as it was broadcast, and quickly spread to our country. The "subtitle group" composed of countless anime fans quickly completed the subtitle translation work and provided it free of charge for the same fans to enjoy. Although its official name is "A Certain Scientific Railgun", Chinese audiences prefer to call it "A Certain Scientific Railgun" (とある科学の超電磁栲), which is more in line with the original title. "
chi_GRnews.72.a: "The lightning dancing on your fingertips is my everlasting faith in this life!"
chi_GRnews.73: "A Certain Magical Index" is now on sale!
chi_GRnews.73.t: "A Certain Magical Index" is now on sale!
chi_GRnews.73.d: "This month, the light novel "A Certain Magical Index" written by Japanese novelist Kamachi Kazuma began to be published by Dengeki Bunko. This is the first work of new writer Kamachi Kazuma.\n\nThe story tells that in this city separated from the western part of Tokyo, Japan, "superpower development" is listed as part of the school curriculum (students are used as human scientific experimental subjects). Among the 2.3 million population, 80% are students, so it is called the Academy City. They compete with each other in superpower development every day. According to the different levels of ability, they can be divided into 6 levels, from no ability (level 0) to superpower (level 5). The protagonist of the story, Kamijou Touma, is a disabled person in the academy, but he is not completely powerless. His ability is to invalidate all supernatural powers. He can only use this ability with his right hand, and he named his ability that can even erase God's miracles "Fantasy Killer". And because his right hand seems to have erased God's blessings, he has been living an unhappy life. One summer vacation day, on the balcony of his home, he met a nun; the girl called herself "Index" and escaped from the world of magic, and is now being chased by the magician. In this way, the girl who has mastered 103,000 ultimate magic books and the boy who has the divine hand that erases all miracles will face a series of stories...\n\nThis light novel is sought after by readers for its delicate writing and exaggerated and gorgeous plot ideas. It soon became one of the most popular new light novels in Japan and quickly spread to the domestic ACGN group. "
chi_GRnews.73.a: ""Let me use this hand to kill your boring fantasy without leaving a single piece of armor""
chi_GRnews.74: "The Wandering Earth"
chi_GRnews.74.t: "The Wandering Earth"
chi_GRnews.74.d: "At the beginning of the New Year, a science fiction masterpiece was released in theaters. This is the Chinese science fiction film "The Wandering Earth" directed by Guo Fan, which is adapted from Liu Cixin's original science fiction short story "The Wandering Earth". The film is adapted from Liu Cixin's novel of the same name. The story is set in 2075 and tells the story of the sun's impending destruction. After the destruction, the solar system is no longer suitable for human survival. Faced with desperation, humans will start the "Wandering Earth" plan to try to escape the solar system with the earth and find a new home for mankind.\n\nThis series of films is a major breakthrough in the history of Chinese science fiction films in terms of film technology and production level.\n\n"People's Daily" commented: The Chinese concept of family affection, heroic feelings, dedication, homeland complex and international cooperation reflected in "The Wandering Earth". Movies are no longer super Heroes save the world, but humans change their destiny together. This concept is a breakthrough in the narrative routine of Hollywood science fiction movies. Integrating China's unique thoughts and values into the imagination and discussion of the future of mankind has expanded the vision of mankind's longing for a better future. \n\nThe film has been warmly welcomed by people across the country. On February 5, 2019, the movie "The Wandering Earth" was officially released in mainland China. On the first day, with a 11.4% screening, it earned 189 million yuan in box office (including 12.8 million yuan in midnight box office), ranking fourth in the single-day box office; on February 6, with a 17.4% screening, the box office earned 258 million yuan, jumping from the fourth place in the single-day box office to the runner-up in the single-day box office, a 38% increase against the trend; as of March 3, the cumulative box office of the film has exceeded 4.5 billion yuan"
chi_GRnews.74.a: "Our people can definitely complete the mission\nregardless of whether it is real or fake, regardless of life or death"
chi_GRnews.75: "Qiao's Letter Home, Part 1"
chi_GRnews.75.t: "Qiao's Letter Home, Part 1"
chi_GRnews.75.d: "Weiwei, hello, everyone.\n\nAfter you left, the doctor came the next afternoon. He did an examination. The next day, he did another blood test. According to the doctor, the situation is not bad. The rapid heartbeat is due to insufficient blood supply. Adjust the order and quantity of taking the medicine. In my opinion, it can last for a while. We want to get the blood test reports of both of you, but unfortunately they are all in English. Although the doctor said "both are normal", we still want to ask the two doctors Wang to take a look to see if it is true. It is too heavy to send, so I copied a copy, please watch it.\nEvery day when watching TV, you can see an advertisement of the emperor promoting pasta. "To be an emperor, you must be a good emperor. To eat noodles, you must eat good noodles. "At first, I thought it was funny: the emperor became a salesman. Then I thought, this is not surprising. Money makes the world go round. European kings also advertised, including ribbon-cutting ceremonies. However, that was Europe, not China. Chinese emperors, including the last emperor, died a long time ago. Why do they have to be salesmen? \nNowadays, when promoting the improvement of people's lives, one of the indispensable materials is that the family has a TV. I don't think any Chinese emperor had such great happiness, because there was no TV at that time. There was no TV to watch, and no TV commercials could be made. There are so many emperors on TV now. It is rare to turn on the TV every day and not see the emperor. I don't know which one is a good emperor or a bad emperor. One thing they have in common is that they all transcend time and space and talk about freedom. , democracy, equality, and benevolence. Artists have the freedom to create. Emperors, gods, flowers, birds, fish, and insects can all be used by artists. However, they must use their real names and their actions cannot be too far from real people. It is always funny to ask slave owners to talk about democracy. Democracy was also talked about at that time, but it was the democracy of slave owners. They would never give democracy to slaves. Qin Shihuang's democracy was only for feudal lords, never for peasants. Slave owners captured prisoners and did not kill them, but made them slaves, which was a historical progress. It was impossible to ask them to do more. Similarly, the bourgeoisie implemented an employment system, which was more advanced than feudalism. Only socialism can solve the problem of complete liberation of mankind. There will be no dictatorship in the future, and there will be no democracy. \nNo more paper, so far. \nWish you all a happy 5.1, and happy birthday to the big king and the little king. "
chi_GRnews.75.a: "Dad\nApril 22, 2000"
chi_GRnews.76: "Qiao's Letter Home, Part 2"
chi_GRnews.76.t: "Qiao's Letter Home, Part 2"
chi_GRnews.76.d: "Dear eldest daughter: \n\nWe wish you all the best on your 55th birthday! We wish you all the best on your whole family! \n55 years is neither short nor long. I hope you will have a more interesting and happy life in the next 55 years. \nThis month, when watching Kangxi, I always heard the line "I really want to live another 500 years". I don't understand what it means. If Emperor Kangxi really lived for 500 years, we would still kneel down to this emperor. It's ridiculous! But it's no wonder. In today's world, there are many people who want the exploiting class and the exploiting system to live for another 500 years. The talk of "new millennium" is heard everywhere. Especially in the first few years, what we saw and heard was that capitalism has found a way to "perfect itself" and Marx's judgment that capitalism will perish is wrong. Facts don't lie. Four planes flew over "9 · 11" hit, and such myths are hard to export. The world economy stagnated. Greenspan, who was praised as a god, was dumbfounded. Argentina's politics and economy are in chaos. In France, even the gendarmes went on strike, which can be regarded as a scene of the new century. Of course, the bourgeoisie can find a way to clean up the situation, and capitalism will not collapse immediately. However, capitalism has a history of 500 years since the 16th century, and it probably wants to live another 500 years and enter a new millennium. However, I think their fate will not be better than that of Emperor Kangxi, and it may not take that long to be replaced by socialism. The exploiting class and the exploiting system will always be replaced by communism. The real long live is communism, the people, and those of us who fight for communism.\n\nThese words are not often said now, but I still want to tell my daughter as a birthday gift in 2002. I hope you cherish this gift."
chi_GRnews.76.a: "Mom and Dad\n2001, 12, 31"
chi_GRnews.77: "Zhang Chunqiao died of illness"
chi_GRnews.77.t: "Zhang Chunqiao died of illness"
chi_GRnews.77.d: "Xinhua News Agency, Beijing, May 10: Zhang Chunqiao, the main culprit of the Lin Biao and Jiang Qing counter-revolutionary group case, died of cancer on April 21, 2005.\n\nZhang Chunqiao, male, Han nationality, from Juye, Shandong, the main culprit of the Jiang Qing counter-revolutionary group. He was the Vice Premier of the State Council of the People's Republic of China and the Director of the General Political Department of the Chinese People's Liberation Army. He was elected as a member of the 9th and 10th Central Committee of the Communist Party of China, a member of the Central Political Bureau, and a member of the Standing Committee of the 10th Central Political Bureau of the Communist Party of China. He was a member of the Gang of Four and one of the main planners of the Great Proletarian Cultural Revolution. In October 1976, he was arrested by the Central Committee of the Communist Party of China. He was placed under isolation and investigation by the Central Committee. In July 1977, the Third Plenary Session of the 10th CPC Central Committee decided to expel him from the Party forever and remove him from all his posts inside and outside the Party. On January 25, 1981, he was publicly tried by the Special Court of the Supreme People's Court of the People's Republic of China and sentenced to death with a two-year reprieve and deprivation of political rights for life. In January 1983, his sentence was commuted to life imprisonment in accordance with the law, and the original sentence of deprivation of political rights for life remained unchanged. In December 1997, his sentence was commuted to 18 years in prison and deprivation of political rights for 10 years. He was released on medical parole in January 1998. He died of illness in April 2005."
chi_GRnews.77.a: "..."
chi_GRnews.78: "Yao Wenyuan died of illness"
chi_GRnews.78.t: "Yao Wenyuan died of illness"
chi_GRnews.78.d: " Xinhua News Agency, Beijing, January 6, Yao Wenyuan, the main culprit of the Lin Biao and Jiang Qing counter-revolutionary group case, died of diabetes on December 23, 2005. \n\nYao Wenyuan, male, 74 years old, conspired with Jiang Qing, Zhang Chunqiao and Wang Hongwen in 1976 to usurp the highest power of the party and the state. On October 7, 1976, he was isolated for investigation by the decision of the Political Bureau of the CPC Central Committee. In 1977, the Third Plenary Session of the Tenth CPC Central Committee passed the "Resolution on the Anti-Party Group of Wang Hongwen, Zhang Chunqiao, Jiang Qing and Yao Wenyuan", expelling him from the party forever and revoking all his positions inside and outside the party. In 1981, he was determined by the Special Court of the Supreme People's Court as the main culprit of the Jiang Qing counter-revolutionary group, guilty of leading a counter-revolutionary group, conspiring to overthrow the government, carrying out counter-revolutionary propaganda and incitement, and false accusations and frame-ups. He was sentenced to 20 years' imprisonment and deprived of political rights for five years in accordance with the law. He was released in October 1996 after serving his sentence."
chi_GRnews.78.a: "..."
chi_GRnews.79: "Taipei-Fuzhou Bridge"
chi_GRnews.79.t: "Taipei-Fuzhou Bridge"
chi_GRnews.79.d: "After the unification of the two sides of the Taiwan Strait, we urgently need a bridge that can connect the mainland and Taiwan. After the central government's decision, the following construction plans were drawn up. Which one should we choose?"
chi_GRnews.79.a: "The sooner the better! All necessary resources will be allocated!"
chi_GRnews.79.b: "It's better to go slow so as not to cause any trouble"
chi_GRnews.79.c: "Who needs a broken bridge?"
chi_GRnews.80: "Taifu Bridge completed!"
chi_GRnews.80.t: "Taifu Bridge completed!"
chi_GRnews.80.d: "After hundreds of days of hard work by workers from both sides of the Taiwan Strait, our country has finally completed the Taifu Bridge project. After several months of trial operation, the bridge will be open to the public."
chi_GRnews.80.a: "The two sides of the strait are inseparable"
chi_GRnews.81: "A Step into the Past is now on air!"
chi_GRnews.81.t: "A Step into the Past is now on air!"
chi_GRnews.81.d: "The TV series "A Step into the Past", adapted from the novel of the same name written by Huang Yi-wei in 1998, was released in Hong Kong on October 15, 2001, and its discs quickly spread to the mainland. The plot tells the story of Xiang Shaolong (played by Louis Koo), a special forces member in the 21st century, who is determined to participate in the research of time travel in order to save his love. However, due to an error in the data of the time machine, Xiang Shaolong was brought to the Warring States Period. At that time, Ying Zheng (played by Raymond Lam) had not yet ascended the throne and was imprisoned in the State of Zhao. In order to return to the future, Xiang Shaolong spared no effort to help Ying Zheng ascend the throne smoothly. Due to Xiang Shaolong's extraordinary wit and special identity, his abilities were appreciated by everyone, but he was also plotted against by many cunning people. Under the circumstance of being attacked from all sides, Xiang Shaolong staged a love story.\nThe drama was well received as soon as it was broadcast."
chi_GRnews.81.a: "Today my body returns to my homeland, and tomorrow your body will be the same."
chi_GRnews.82: ""Lost on Journey" is now on air!"
chi_GRnews.82.t: ""Lost on Journey" is now on air!"
chi_GRnews.82.d: "On June 4, a movie called Lost on Journey was released in theaters. On June 22, its box office exceeded 33 million. As the Spring Festival is approaching, Li Chenggong (Xu Zheng), the boss of a toy group, returns to Changsha to celebrate the New Year. At the same time, under the pressure of his lover Manni (Li Man), he is preparing to divorce his wife (Zuo Xiaoqing) after the New Year. As a result, after meeting Niu Geng (Wang Baoqiang), a "senior" milker who is going to Changsha to collect debts, bad luck continues. Fate plays a trick on Niu Geng, who meets Li Chenggong all the way. The two of them encounter many embarrassing things on the road, and they also encounter all kinds of people and all kinds of strange things, which makes Li Chenggong embarrassed and his noble image is gone. Niu Geng is optimistic and positive. In order to be able to go home, the two travel together. They change various modes of transportation on the way home, such as planes, trains, buses, ferries, trucks, and even tractors. But the two still spent a lot of time in the wilderness. On New Year's Eve, looking back on the hardships along the way, and the people or things they met along the way, had a great impact on the lives of the two. In the end, after the two experienced the journey from strangers to friends, Niu Geng's sincerity also changed Li Chenggong's indifferent character, and aroused Li Chenggong's return to true love. The film was well received as soon as it was released. Chongqing Times commented: The plot of the film is quite similar to the 1987 American film "Crazy on a Journey", but it is worthy of recognition in reflecting the situation of Chinese society. This film starts more from the details of characters and life, so it is closer to life. The film maintains a tone of ease from beginning to end. The rhythm of the film is not very fast, but the audience can always follow the pace of the film. The smooth story plus the conflicting plot deepen the tension of the plot, which is the success of the film. Moreover, the popularization of a clichéd road-themed story can also get into the role. "
chi_GRnews.82.a: "You are also a boss, which farm are you from?"
chi_GRnews.83: "Let the Bullets Fly" is now on air!
chi_GRnews.83.t: "Let the Bullets Fly" is now on air!
chi_GRnews.83.d: "On December 16, directed by Jiang Wen, written by Shu Ping, Jiang Wen, Guo Junli, Wei Xiao, Li Bukong, Zhu Sujin, and Ma Shi Tu, The drama film "Let the Bullets Fly" starring Jiang Wen, Chow Yun-fat, Ge You, Carina Lau, Chen Kun, Zhou Yun, Liao Fan, Jiang Wu and others premiered in mainland China. The film is adapted from Ma Shi Tu's novel "Ten Tales of Night", telling the story of the fierce bandit Zhang Muzhi who transformed himself into an honest official "Ma Bangde" and took office as the county magistrate of Echeng, and started a fierce battle with the bully Huang Silang who guarded Echeng. The plot tells the story of Ma Bangde (played by Ge You) who donated money to get the position of county magistrate during the turbulent times of the Republic of China, and embarked on a journey to Echeng with his wife (played by Carina Lau) and entourage. However, their journey was interrupted by an ambush by the robber Zhang Mazi (played by Jiang Wen) in a wilderness in the south. The entourage was brutally killed, and only Ma Bangde and his wife escaped by chance. In order to save his life, Ma Bangde was quick-witted and lied that he was... Zhang Mazi is the county magistrate's master, while Zhang Mazi is attracted by the wealth described by Ma Bangde and decides to pretend to be the county magistrate and lead his men to Echeng. Echeng, a remote place, is actually controlled by Huang Silang (played by Chow Yun-fat), a local overlord. He is powerful and does not take the new county magistrate seriously. Soon after Zhang Mazi took office, he clashed with Huang Silang's forces. He beat up Huang's martial arts coach (played by Jiang Wu), and Huang Silang designed to kill Zhang Mazi's adopted son Xiaoliu (played by Zhang Mo). Ma Bangde, who originally just wanted to make money steadily, was accidentally involved in the power struggle between bandits and bullies. An ominous cloud shrouded the sky over Echeng, foreshadowing the coming bloody storm, and a contest about power, money and justice is about to begin. "
chi_GRnews.83.a: "Don't be impatient, let the bullets fly for a while"
chi_GRnews.84: "Beijing Xiaomi Technology Co., Ltd. is officially established"
chi_GRnews.84.t: "Beijing Xiaomi Technology Co., Ltd. is officially established"
chi_GRnews.84.d: "On April 6, Lei Jun, the helmsman of the old Internet company Kingsoft, called a dozen employees together, each of them drank a bowl of millet porridge, announced the establishment of a company, and named the company "Xiaomi". Lei Jun, who was over 40 years old, founded Xiaomi, which surprised many people. Lei Jun talked about his entrepreneurial motivation: "The domestic mobile phone market is divided into international giants such as Nokia, Motorola and Samsung, and domestically produced 'China Cool Union (ZTE, Huawei, Coolpad, Lenovo)', and the overwhelming copycat mobile phones. The Chinese market is mainly controlled by international giants, and the products are ridiculously expensive, while domestic mobile phones are very average. How can they make money like this? I want to make the best mobile phone in the world, sell it at only half the price, so that everyone can afford it!" \n\nOn the same day, Beijing Xiaomi Technology Co., Ltd. was officially established and settled in Yingu Building. This self-made technology company has unlimited potential."
chi_GRnews.84.a: "Technology-based, cost-effective, and making the coolest products"
chi_GRnews.85: "League of Legends Chinese Server Open Beta"
chi_GRnews.85.t: "League of Legends Chinese Server Open Beta"
chi_GRnews.85.d: "Since its launch in the European and American markets in 2009, League of Legends, developed by Riot Games, has successfully won the top spot in the European and American competitive online games with its excellent game quality. On September 22, 2011, the public beta of League of Legends in China was officially launched, and it was operated by Tencent Games in mainland China. Its popularity is increasing day by day, and the participation of many well-known game developers and e-sports players has made it a popular online game that is well-known and popular among the people. This game will become a phenomenal game in China in the foreseeable future."
chi_GRnews.85.a: "The power of Demacia!"
chi_GRnews.100.t: "[FROM.GetNameDef] Questions the Treaty of Aigun"
chi_GRnews.100.d: "The corrupt and incompetent Qing dynasty government was forced to sign the Treaty of Aigun in 1858, establishing Russian dominance in the Far East.\n\nHowever, with [FROM.GetName]'s increasing military strength and international standing, they have recently declared that they do not recognize this unequal treaty and demand control of the region."
chi_GRnews.100.a: "Are they kidding?"
chi_GRnews.101.t: "[FROM.GetName] Refuses to Abolish the Treaty"
chi_GRnews.101.d: "After we announced our reasonable demands, [FROM.GetName] announced that they refuse to abolish the Treaty of Aigun, which the Qing government was forced to sign. [FROM.Getleader] claims that our actions are a blatant act of aggression."
chi_GRnews.110.t: "Sikkim Declares Independence"
chi_GRnews.110.d: "Just as we are in a disadvantageous position in our war with [FROM.GetName], the Kingdom of Sikkim has declared independence and seceded from India. This is clearly because [FROM.Getleader] is supporting them behind the scenes!"
chi_GRnews.110.a: "We can conquer Sikkim countless times!"
chi_GRnews.110.b: "Let's ignore Sikkim for now."
chi_GRnews.120.t: "[FROM.GetNameDef] Demands Historical Reparations"
chi_GRnews.120.d: "[FROM.Getleader] claims that our country historically participated in aggression against them and demands that we pay a hefty sum in reparations for the invasion..."
chi_GRnews.120.a: "Are they kidding?"
chi_GRnews.120.b: "Okay, it's not that expensive anyway."
chi_GRnews.121.t: "[FROM.GetNameDef] Refuses to Pay Reparations"
chi_GRnews.121.d: "After we announced our legitimate demands, [FROM.GetName] declared that it would refuse to provide any compensation for the historical crimes committed that year, with [FROM.Getleader] claiming that we were merely expanding the so-called 'anti-freedom' propaganda slogans."
chi_GRnews.122.t: "[FROM.GetNameDef] Agrees to Pay Reparations"
chi_GRnews.122.d: "After we announced our legitimate demands, [FROM.GetName] agreed to compensate for the historical wrongdoings it committed. "
chi_GRnews.122.a: "This is excellent..."
chi_GRnews.130.t: "[FROM.GetNameDef] demands to face history squarely"
chi_GRnews.130.d: "Recently, [FROM.Getleader] publicly demanded that we issue a public apology for the crimes committed during the Sino-Japanese War in the mid-20th century and promise to provide a detailed and truthful account of what happened in history books."
chi_GRnews.130.a: "Only by facing history squarely can we have a future."
chi_GRnews.130.b: "We will not yield to them!"
chi_GRnews.131.t: "[FROM.GetNameDef] refuses to face history squarely"
chi_GRnews.131.d: "After we announced our reasonable demands, [FROM.Getleader] declared that they "will not succumb to pressure" and refuse to stop distorting history; they are still sinking deeper and deeper into the wrong path!"
chi_GRnews.131.b: "Strongly protest"
chi_GRnews.132.t: "[FROM.GetNameDef] agrees to face history squarely"
chi_GRnews.132.d: "After we announced our reasonable demands, [FROM.Getleader] announced that it would issue a public apology for the crimes committed during the invasion of China and promised to give a detailed and truthful account of what happened in history books."
chi_GRnews.132.a: "Very good!"
#news#
chi_news.1: "The Three Gorges Dam is completed!"
chi_news.1.t: "The Three Gorges Dam is completed!"
chi_news.1.d: "From December 14, 1994, when the construction of the Three Gorges Dam began, to May 20, 2006, the Three Gorges Dam was completed. The concrete volume of the Three Gorges Dam, a super project, reached 16.1 million cubic meters. It is the gravity dam with the largest concrete volume, the most dam body flow holes, and the largest discharge volume in the world. Its full completion means that the Three Gorges Project has begun to fully exert its flood control capabilities, raising the flood control standard of the Jingjiang section of the Yangtze River from once in 10 years to once in 100 years, effectively protecting tens of millions of people and millions of hectares of farmland in the middle and lower reaches of the Yangtze River from flood threats, and making the role of the Yangtze River as a "golden waterway" more fully manifest and play its role. . \n\nThe Three Gorges Project has considerable power generation benefits, which helps to alleviate China's energy bottleneck and plays an important role in building energy arteries and optimizing the allocation of energy resources. During the "15th Five-Year Plan", China proposed the "West-to-East Power Transmission" transmission plan to build three major transmission channels in the north, middle and south. Among them, the middle channel starts from Sichuan in the west, crosses the Three Gorges, and ends in Shanghai in the east. With the construction of the Three Gorges Dam power transmission and transformation project, a series of power transmission projects such as Sanchang and Sanguan have been put into operation, and the middle channel of West-to-East Power Transmission has begun to take shape. The Three Gorges power and Sichuan hydropower are continuously transmitted to East China and Guangdong. The clean hydropower in the west has played an important role in the energy-deficient areas in the east, and energy resources have been optimized among regional power grids. "
chi_news.1.a: "Amazing miracle"
chi_news.1.b: "Man can conquer nature!"
chi_news.2: "Shenzhou V launched"
chi_news.2.t: "Shenzhou V launched"
chi_news.2.d: "At 9:00 Beijing time on October 15, 2003, the Shenzhou V spacecraft carrying Chinese astronaut Yang Liwei was launched from the Jiuquan Satellite Launch Center. It flew 14 orbits in orbit for 21 hours and 23 minutes. After successfully completing all scheduled operational tasks, the return capsule returned to the main landing site in Inner Mongolia at 6:23 Beijing time on October 16, 2003. Its orbital module remained in orbit for half a year.\n\nThe complete success of the Shenzhou V mission marks that China has become the third country in the world to independently master manned space technology after the United States and the Soviet Union."
chi_news.2.a: "Is there a Chinese girl named Chang'e on the moon?"
chi_news.2.b: "The sea of stars!"
chi_news.3: "China's military parade"
chi_news.3.t: "China's 60th anniversary military parade"
chi_news.3.d: "On October 1, 2009, the celebration of the 60th anniversary of the founding of the People's Republic of China was held in Tiananmen Square, Beijing on the morning of October 1, 2009. 200,000 soldiers and civilians celebrated the 60th birthday of New China with a grand military parade and mass parade. Hu Jintao, then General Secretary of the CPC Central Committee, President of the State, and Chairman of the Central Military Commission, reviewed the troops and delivered an important speech. In front of Tiananmen Square, Chinese President Hu Jintao reviewed 44 spirited and well-equipped ground formations composed of the three services of the Chinese People's Liberation Army, the People's Armed Police Force, and the militia reserve forces.\n\nThe military parade ended with a parade formation composed entirely of young people with the theme of "a better future" , the children sang the "Song of the Young Pioneers of China", indicating that the cause of socialism with Chinese characteristics will be passed on from generation to generation and will have successors. When more than 5,000 children holding colorful balloons and garlands came to Tiananmen Square, the music of "Singing the Motherland" resounded throughout the square. Amid the passionate singing, the children released the balloons in their hands and rushed to the Jinshui Bridge like a spring tide with thousands of young people in front of Tiananmen Square. 50,000 balloons soared into the sky, and the young people waved garlands at the Tiananmen Tower, cheering and jumping to their heart's content. The people on and off the Tiananmen Tower were filled with true feelings, and there was jubilation inside and outside the square. All Chinese people celebrated this grand festival together and wished the motherland and the world a better tomorrow. "
chi_news.3.a: "The giant dragon showed a corner of its dragon scales"
chi_news.3.b: "Long live the People's Republic of China! Long live the great unity of the people of the world!"
chi_news.4: "2010 Shanghai World Expo"
chi_news.4.t: "2010 Shanghai World Expo"
chi_news.4.d: "On May 1, 2010, the 2010 Shanghai World Expo was held in Shanghai, China. This is the 41st World Expo. This Expo responds to the call for "better city, better life" with the concept of "harmonious city" and takes blue and green as the theme colors. This is not only a display of China's rapid development since the reform and opening up, but also the implementation of the "scientific development concept" advocated by President Hu Jintao. \n\nChina has increasingly become a major country at the forefront of the world from a poor and backward country."
chi_news.4.a: "I like blue"
chi_news.4.b: "Harmonious development"
chi_aiib.1: "Asian Infrastructure Investment Bank established"
chi_aiib.1.t: "Asian Infrastructure Investment Bank established"
chi_aiib.1.d: "On October 24, 2014, the finance ministers and authorized representatives of the first 21 prospective founding members, including China, India, Singapore, etc., signed an agreement in Beijing and jointly decided to establish an investment bank. On December 25, 2015, the Asian Infrastructure Investment Bank was officially established. From January 16 to 18, 2016, the opening ceremony of the AIIB and the inaugural meeting of the Board of Governors and the Board of Directors were held in Beijing.\n\nThe Asian Infrastructure Investment Bank is an intergovernmental multilateral development institution in the Asian region. It focuses on supporting infrastructure construction. Its purpose is to promote the process of interconnection and economic integration in the Asian region and strengthen cooperation between China and other Asian countries and regions. It is the first multilateral financial institution initiated by China. It is headquartered in Beijing and has a statutory capital of 100 billion dollar.As of 2023, the AIIB has 109 member countries."
chi_aiib.1.a: "Where should we sign?"
chi_aiib.1.b: "We reject this violation of our sovereignty"
chi_aiib.1.c: "Our influence is growing day by day"
chi_sars.3: "New virus emerges in China"
chi_sars.3.t: "New virus appears in China"
chi_sars.3.d: "The Chinese government announced to the World Health Organization today that a highly contagious new virus has appeared in southern China. After preliminary investigation, the World Health Organization found that the virus is a type of coronavirus that causes severe acute respiratory syndrome, belonging to the order Nidovirales, family Coronaviridae, genus Coronavirus, and is a subgroup B coronavirus of the genus Beta. It is currently named SARS virus. The virus has killed many Chinese citizens and has spread rapidly to other parts of China and the world."
chi_sars.3.a: "The virus brought by the Chinese..."
chi_sars.3.b: "Hope everyone is safe"
chi_sars.4: "The number of people infected with SARS virus has stopped growing"
chi_sars.4.t: "The number of people infected with SARS virus has stopped growing"
chi_sars.4.d: "On July 13, 2003, the number of SARS patients and suspected cases in the world stopped increasing, and the SARS process was basically over. The virus spread for more than half a year had a profound impact on the world. China and other countries in the region suffered varying degrees of economic and social losses."
chi_sars.4.a: "There won't be any more in the future, right?"
chi_sars.4.b: "It's finally over"
chi_sars.5: "Unknown virus breaks out in China"
chi_sars.5.t: "Unknown virus breaks out in China"
chi_sars.5.d: "On March 25, 2003, a head nurse named Ye Xin from the emergency department of the Ersha Island Branch of the Guangdong Provincial Hospital of Traditional Chinese Medicine died of an unknown virus, which quickly caused panic among the people. Hospital staff angrily accused the Chinese authorities of concealing the virus situation and missing the best period for prevention and control. According to them, a highly contagious new virus appeared in southern China a few months ago, which has killed many people.\n\nThe World Health Organization quickly sent a special team to China to investigate the virus, but was obstructed by the Chinese side when entering the country. It is not clear why the Chinese authorities have repeatedly concealed and denied the virus situation, but it is certain that the actions of the Chinese authorities have caused panic and accusations from other countries."
chi_sars.5.a: "How dare they?"
chi_sars.5.b: "Catch the traitor who leaked the information immediately!"
chi_news.5: "Qinghai-Tibet Railway opens to traffic"
chi_news.5.t: "Qinghai-Tibet Railway opens to traffic"
chi_news.5.d: "On July 1, 2006, a railway was finally built on the highest plateau in the world. Starting from June 2001, China spent six years to build a 1,956-kilometer railway line on the Qinghai-Tibet Plateau. It is the highest plateau railway in the world with the longest distance on frozen soil and overcame world-class difficulties. It is an engineering miracle in human history.\n\nThis not only marks China's further support for backward regions, but also proves that Beijing has strengthened its control over China's border areas."
chi_news.5.a: "Amazing miracle"
chi_news.5.b: "Build the railway to the sky!"
chi_aiib.3: "[FROM.GetName] becomes a member of the Asian Infrastructure Investment Bank"
chi_aiib.3.t: "[FROM.GetName] becomes a member of the Asian Infrastructure Investment Bank"
chi_aiib.3.d: "After a series of applications, assessments, and matches, the [FROM.GetLeader] government announced today that their country has become a member of the Asian Infrastructure Investment Bank. Some observers are hopeful that this symbolizes further development of economic cooperation between China and other countries, while pessimistic analysts are deeply regretful about China's growing influence and the threat it poses to the existing world order."
chi_aiib.3.a: "RMB is flowing"
chi_aiib.3.b: "Xu Er's report on his work"
chi_aiib.4: "Asian Infrastructure Investment Bank launches annual development assistance"
chi_aiib.4.t: "Asian Infrastructure Investment Bank launches annual development assistance"
chi_aiib.4.d: "After a series of budget estimates and docking, the Beijing-based Asian Infrastructure Investment Bank announced that it will provide one year of development assistance to each member country. China said it would pay most of the aid costs. Chinese President Xi Jinping said that helping underdeveloped countries is the responsibility of contemporary China as a major country, contributing Chinese wisdom to solving development difficulties, contributing Chinese strength to solving global development problems, and demonstrating the diplomatic responsibility of a major country. China calls on all countries to build a more peaceful, stable and prosperous world, away from poverty and war.\n\nIt is generally believed that this is a branch strategy for China to fulfill its goal of building a "community with a shared future for mankind" and a means to expand its international influence."
chi_aiib.4.a: "Clap for them"
chi_aiib.4.b: "Moisturizing things silently"
chi_aiib.5: "Asian Infrastructure Investment Bank provides low-interest loans"
chi_aiib.5.t: "Asian Infrastructure Investment Bank offers low-interest loans"
chi_aiib.5.d: "After a series of budget estimates and docking, the Beijing-based Asian Infrastructure Investment Bank announced that it would provide low-interest loans to each member country. China said that its banks would provide the main loan expenditures. Chinese President Xi Jinping said that improving the international financial environment and establishing a new international financial system are the earnest expectations of every country. China will be committed to building a more equal and transparent international financial system. China calls on all countries to break down tariff barriers, strengthen financial exchanges, promote the process of financial globalization, and follow the trend of economic globalization.\n\nInternationally, it is generally believed that this is a branch strategy for China to fulfill its goal of building a "community with a shared future for mankind" and a means to expand its international influence."
chi_aiib.5.a: "RMB in circulation"
chi_aiib.5.b: "The benevolent spread their kindness, and the faithful show their loyalty"
chi_news.9: "Saudi Arabia, Iran, 'Beijing reconciliation'"
chi_news.9.t: "Saudi Arabia, Iran, 'Beijing reconciliation'"
chi_news.9.d: "Last night, the joint statement issued by the People's Republic of China, the Kingdom of Saudi Arabia and the Islamic Republic of Iran became the headlines of domestic and foreign media, adding a peaceful energy to the current turbulent world that has been shrouded in the shadow of the Russian-Ukrainian conflict for more than a year. The core of the statement is that Saudi Arabia and Iran will reach an agreement, including agreeing to restore diplomatic relations between the two sides, reopening embassies and representative offices of both sides within a maximum of two months, arranging the exchange of ambassadors, and exploring the strengthening of bilateral relations. The three countries expressed their willingness to make every effort to strengthen international and regional peace and security.\n\nThere is no doubt that China's role is indispensable in the achievement of the "Beijing Reconciliation". Chinese Foreign Minister Wang Yi introduced after the dialogue that the Beijing dialogue was promoted on the basis of the consensus of the leaders of China, Saudi Arabia and Iran. The dialogue has also become a successful practice of effectively implementing the "Global Security Initiative". As a goodwill and reliable mediator, China has faithfully fulfilled its host duties.\n\nObservers believe that this is a victory for peaceful diplomacy and a manifestation of China's growing international influence."
chi_news.9.a: "Is China's hand reaching out to the Middle East?"
chi_news.9.b: "Harmony brings wealth"
chi_news.27: "The Tenth National People's Congress of the People's Republic of China"
chi_news.27.t: "The Tenth National People's Congress of the People's Republic of China"
chi_news.27.d: "On March 4, 2003, the 10th National People's Congress of the People's Republic of China was held in Beijing. At the first session, the President of the People's Republic of China and General Secretary of the Central Committee Hu Jintao were elected, and the person to be elected as the Premier of the State Council was decided to be Wen Jiabao. This marked that China's leadership was officially transferred to the new generation of leadership represented by Hu Jintao and Wen Jiabao."
chi_news.27.a: "A cautious gentleman"
chi_news.27.b: "Unite around the Party Central Committee with Comrade Hu Jintao as General Secretary!"
chi_news.28: "The 12th National People's Congress of the People's Republic of China"
chi_news.28.t: "The 12th National People's Congress of the People's Republic of China"
chi_news.28.d: "The 12th National People's Congress of the People's Republic of China was held on March 5, 2013. The first session of the meeting elected Xi Jinping, the President of the People's Republic of China, as the General Secretary of the Central Committee, and decided on the candidate for the Premier of the State Council, namely Li Keqiang. This marks that China's leadership has officially been transferred to the new generation of leadership represented by Xi Jinping.\n\nFormer General Secretary Hu Jintao resigned from all his positions at once during this leadership transition, creating an unprecedented style. Xi Jinping expressed his respect for this move in his speech, saying that Hu Jintao and other comrades took the lead in resigning from the leadership positions of the Party Central Committee, which reflects their noble character and integrity."
chi_news.28.a: "Resigned from all positions?"
chi_news.28.b: "Closely unite around the Party Central Committee with Comrade Xi Jinping as its core!"
chi_news.100.t: "The "Hanxin" fraud incident"
chi_news.100.d: "In February 2003, Chen Jin, the dean of the School of Microelectronics at Shanghai Jiaotong University, claimed to have invented the "Hanxin No. 1". The "Hanxin No. 1" claimed to be designed with the internationally advanced 0.18-micron semiconductor process, integrated 2.5 million devices, and had a 32-bit computing core, capable of performing 200 million operations per second. \n\nAlthough the authoritative experts at the time believed that this was an advancement in China's semiconductor industry, and Chen Jin, who was regarded as the inventor of "Hanxin No. 1", was also honored, on January 17, 2006, someone publicly accused him of inventing "Hanxin No. 1" on the Tsinghua University Shuimu Tsinghua BBS. \n\nAfter more than two months of evidence collection and investigation, the authorities finally discovered that Chen Jin had committed serious fraud and deception in the process of developing the "Hanxin" series of chips, and deceived everyone with false scientific research results. After the fraud was discovered, the entire Chinese independent chip industry fell into a crisis of trust, and semiconductor development stagnated for a time."
chi_news.100.a: "Have they always been faking things like this?"
chi_news.100.b: "I am speechless."
chi_news.93.t: "80th Anniversary of the Victory of the War of Resistance Against Japan Military Parade"
chi_news.93.d: "On the morning of September 3, 2025, a grand gathering commemorating the 80th anniversary of the victory of the Chinese People's War of Resistance Against Japan and the World Anti-Fascist War was held in Tiananmen Square, Beijing. The military parade featured primarily new fourth-generation equipment, such as new tanks, carrier-based aircraft, and fighter jets, organized by combat modules to demonstrate the PLA's system-of-systems combat capabilities. New types of unmanned intelligent and anti-unmanned equipment from the army, navy, and air force were also selected for the parade, including new drones, directed energy weapons, and electronic jamming systems. Advanced strategic weapons and equipment, such as new hypersonic vehicles, air defense and anti-missile systems, and strategic missiles, were also showcased. The purpose of this parade was to highlight the historical status of the Chinese People's War of Resistance Against Japan as the main eastern battlefield of the World Anti-Fascist War and its significant contribution to the victory of the World Anti-Fascist War, to demonstrate the pivotal role of the Communist Party of China in the War of Resistance Against Japan, and to demonstrate China's responsibility in resolutely defending the fruits of victory in World War II and international fairness and justice, and actively promoting the building of a community with a shared future for mankind." 
chi_news.93.a: "Worth paying attention to..."
chi_news.93.b: "Justice will prevail! Peace will prevail!"
