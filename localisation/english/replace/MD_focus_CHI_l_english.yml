chi_GRnews.65.a: "Sanction this American dog!"
chi_GRnews.65.b: "Let them do as they please"
 
chi_GRnews.66: "[From.GetName] stands with us!"
chi_GRnews.66.t: "[From.GetName] stands with us!"
