#United Nations#
chi_stop_war.20: "Ceasefire"
chi_stop_war.20.t: "Cease-fire"
chi_stop_war.20.d: "We have agreed to the ceasefire request of the Security Council and now need to propose a ceasefire to the warring countries."
chi_stop_war.20.a: "Nothing can be done"
chi_stop_war.10: "[From.GetName] wishes to cease fire"
chi_stop_war.10.t: "[From.GetName] wishes to cease fire"
chi_stop_war.10.d: "The [From.GetName] wishes to call for a ceasefire. This war has claimed many lives, and it is time for both sides to take a moment to end the fighting. Should we accept an armistice? This would provide much needed breathing space."
chi_stop_war.10.a: "Accept, give them our response"
chi_stop_war.1: "The [From.GetName] demands a ceasefire!"
chi_stop_war.1.t: "The [From.GetName] demands a ceasefire!"
chi_stop_war.1.d: "Call from New York. [From.GetName], one of the permanent members of the United Nations Security Council, demands that we stop the escalation of the war immediately."
chi_stop_war.1.a: "We can't afford to offend them..."
chi_stop_war.1.b: "Who cares?"
chi_stop_war.2: "[From.GetName] wishes to cease fire"
chi_stop_war.2.t: "[From.GetName] wishes to cease fire"
chi_stop_war.2.d: "The [From.GetName] wishes to call for a ceasefire. This war has claimed many lives, and it is time for both sides to take a moment to end the fighting. Should we accept an armistice? This would provide much needed breathing space."
chi_stop_war.2.a: "This is the request of the Five Permanent Members..."
chi_stop_war.31: "[From.GetName] agrees to a truce!"
chi_stop_war.31.t: "[From.GetName] agrees to a truce!"
chi_stop_war.31.d: "The [From.GetName] government has agreed to the UN Security Council's proposal and is drafting ceasefire documents with the belligerent countries."
chi_stop_war.31.a: "Very good"
chi_stop_war.3: "[From.GetName] refuses to cease fire!"
chi_stop_war.3.t: "[From.GetName] refuses to cease fire!"
chi_stop_war.3.d: "The [From.GetName] government has rejected a proposal from the UN Security Council and continues to pour fire on the front lines."
chi_stop_war.3.a: "Sanction them!"
chi_stop_war.3.b: "Let them do as they please"
chi_stop_war.4: "We have been subjected to international sanctions!"
chi_stop_war.4.t: "We have been subjected to international sanctions!"
chi_stop_war.4.d: "After refusing the request made by [From.GetName], [From.GetName] imposed international sanctions on us!"
chi_stop_war.4.a: "It's imperialism!"
chi_stop_war.4.b: "Then retaliate with equal sanctions!"
chi_stop_war.5: "[From.GetName] issues stern warning"
chi_stop_war.5.t: "[From.GetName] issues stern warning"
chi_stop_war.5.d: "[From.GetLeader] demands that we immediately cease the war, otherwise [From.GetName] will use force to protect world peace."
chi_stop_war.5.a: "Can't afford to offend..."
chi_stop_war.5.b: "Who's afraid?"
chi_stop_war.6: "[From.GetName] agrees to ceasefire"
chi_stop_war.6.t: "[From.GetName] agrees to ceasefire"
chi_stop_war.6.d: "[From.GetName] diplomat calls, agreeing to an immediate ceasefire."
chi_stop_war.6.a: "Very good"
chi_stop_war.7: "[From.GetName] refuses to cease fire"
chi_stop_war.7.t: "[From.GetName] Refuses to End War"
chi_stop_war.7.d: "[From.GetName] has rejected our military warnings and is determined to continue the war."
chi_stop_war.7.a: "Come to the Emperor's court and report your work. If you don't, the six armies will be moved!"
chi_stop_war.7.b: "We still need to wait"
chi_stop_war.8: "[From.GetName] issues ultimatum"
chi_stop_war.8.t: "[From.GetName] issues ultimatum"
chi_stop_war.8.d: "The Chairman of the [From.GetName] Military Commission has issued an ultimatum, demanding that we cease fire immediately or else declare war on us."
chi_stop_war.8.a: "Come on!"
chi_stop_war.8.b: "We can't afford to offend them..."
chi_stop_war.9: "[From.GetName] refuses final warning"
chi_stop_war.9.t: "[From.GetName] refuses final warning"
chi_stop_war.9.d: "[From.GetName] called to express regret over our military threats and to say they would never submit to us."
chi_stop_war.9.a: "Let the war begin!"
chi_stop_war.9.b: "We can't afford to offend them..."


