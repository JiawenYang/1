#Other countries#
chaoxian.2: "North Korean leader Kim Jong Il dies!"
chaoxian.2.t: "North Korean leader Kim Jong Il dies!"
chaoxian.2.d: "At 8:30 a.m. on December 17, 2011, Kim Jong Il, General Secretary of the Central Committee of the Workers' Party of Korea, died on a train due to overwork while on an inspection trip.\n\nAccording to the Korean Central News Agency, North Korea has established a national funeral committee and decided to place Kim Jong Il's body in the Kumsusan Memorial Palace, set December 17 to 29 as a mourning period, accept condolences from December 20 to 27, hold a farewell ceremony in Pyongyang on the 28th, and hold a central memorial meeting on the 29th."
chaoxian.2.a: "A moment of silence..."
chaoxian.3: "Congratulations to Kim Jong-un on becoming the first secretary of the Workers' Party of Korea"
chaoxian.3.t: "Hu Jintao sends a congratulatory message to Kim Jong-un on his appointment as first secretary of the Workers' Party of Korea"
chaoxian.3.d: "Pyongyang\nComrade Kim Jong-un, First Secretary of the Workers' Party of Korea:\n\nI am pleased to learn that the Workers' Party of Korea Representative Conference has nominated Comrade Kim Jong-un as the First Secretary of the Workers' Party of Korea. On behalf of the Central Committee of the Communist Party of China and in my own name, I would like to extend warm congratulations to you and the Central Committee of the Workers' Party of Korea.\nWe are pleased to see that the Korean people have inherited the legacy of Comrade Kim Jong-il, closely united around the Workers' Party of Korea, and worked hard to build a strong socialist country under the leadership of Comrade Kim Jong-un.\nChina and North Korea are friendly neighbors connected by mountains and rivers. Constantly consolidate and develop the traditional friendly and cooperative relations between China and North Korea , is the unswerving policy of the Chinese Party and government. We are willing to work hand in hand with our Korean comrades to continue to deepen the traditional friendship between China and North Korea, expand practical cooperation in various fields, jointly promote lasting peace and stability on the Korean Peninsula and in Northeast Asia, and consolidate, build and develop the China-North Korea relations that were created and nurtured by the older generation of leaders of the two parties and countries. \n I sincerely wish Comrade First Secretary and the Workers' Party of Korea to continue to make new and greater achievements in leading the Korean people to build a strong country. \n\nGeneral Secretary of the Central Committee of the Communist Party of China\nHu Jintao\n\nBeijing, April 11, 2012"
chaoxian.3.a: "Another young man's story begins"

