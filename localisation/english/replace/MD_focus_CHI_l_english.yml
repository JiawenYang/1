CHI_Protecting_Local_Businesses: "Protecting Local Businesses"
CHI_Protecting_Local_Businesses_desc: "In order to ensure that local Internet companies survive and grow in such an environment, a series of policies must be introduced to protect them and encourage more people to engage in the Internet industry."
CHI_Border_Business_Communication: "Cross-border Business Communication"
CHI_Border_Business_Communication_desc: ""
CHI_International_Cultural_Exchange: "International Cultural Exchange"
CHI_International_Cultural_Exchange_desc: ""

CHI_the_Open_Windows: "Limited Opening"
CHI_the_Open_Windows_desc: "We will open the international Internet to a limited extent, as long as foreign Internet companies choose to abide by our laws and regulations."
CHI_The_Fine_Management: "Fine Management"
CHI_The_Fine_Management_desc: "How to organically combine our actual situation with the foreign Internet is not an easy task, which is a great test of our level of fine management and control."

