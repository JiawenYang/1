 jewish_desc: "The oldest Abrahamic religion in the game, Judaism builds upon the Torah and the traditions and scriptures of the Jewish people going back over 3000 years."
 ibadi_desc: "Ibadism is claimed by its adherents to be older than both Sunni and Shia Islam but is nowhere near as popular. The Ibadis stress strict adherence to an interpretation of Islam and the Sharia that they hold as both older and more orthodox."
 sikh_desc: "Sikhism is the faith founded by Guru Nanak around the turn of the 16th century in the Punjab. A monotheistic religion, Sikhism was born in an area where Islam and Hinduism mixes but is in many ways unlike either."
 theravada_desc: "Like all Buddhist branches, Theravada stems from the teachings of Gautama Buddha in the 5th century BC. The followers of Theravada Buddhism rely on the Pali Canons for religious and legal guidance and emphasis is put on Monastic duties and reaching the status of Arhat or enlightenment."
 vajrayana_desc: "Also known as Tantric Buddhism or even Lamaism, Vajrayana is a branch of Buddhism where the goal of the adherents is to become a Bodhisattva through use of Tantric Techniques. It is believed enlightenment cannot be reached simply from lone study but must be taught by a teacher."
 mahayana_desc: "Mahayana is the most widely practiced branch of Buddhism. The goal of its adherents is to achieve enlightenment, possibly even achieve Buddhahood."
 christian_desc: "Catholicism is the name of a Christian tradition with its roots in the old Latin rite that recognizes the Pope as the head of Christendom."
 confucian_desc: "Confucianism is the term for the philosophies of 5th century BC philosopher Confucius and stresses personal development and the importance of good government."
 hindu_desc: "Hinduism is the term for a wide range of polytheistic Indian traditions with a common pantheon."
 orthodox_desc: "The Orthodox Christian tradition has its root in the Greek rite and considers itself to be closer to the original Christian ideals than Catholicism. The Orthodox Churches reject the idea of the Pope and are instead divided into a number of churches presided over by Patriarchs."
 protestant_desc: "Protestantism covers a wide range of religious traditions starting with the teachings of Martin Luther during the reformation. They react against a number of the conventions that over time have developed in the Catholic church and the idea of a pope itself."
 shia_desc: "Shia Muslims hold that the legitimate successor of the prophet Muhammad as Caliph and Imam was his cousin and son-in-law Ali. The Shiites believe that a number of Imams have followed Ali and still await the coming of his final successor."
 shinto_desc: "Shintoism is the ancient ethnic religion of Japan which over the centuries have come to coexist with Confucianism and Buddhism on the Japanese islands."
 sunni_desc: "Sunni Islam holds that the legitimate successor of the Prophet Muhammad was father-in-law Abu Bakr."
 coptic_desc: "Coptic Christianity is a branch of Christendom that follow the Alexandrine rite and who answer to the Patriarch in Alexandria."
 mormon_desc: "Mormonism is a religious movement started by Joseph Smith in USA in the 1820s. Mormons have developed a strong sense of community and have strong connections across generations and with extended family, reflecting their belief that families can be sealed together beyond death."
