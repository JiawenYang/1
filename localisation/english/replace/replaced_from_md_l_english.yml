l_english:

 SPR_deindustrialization_desc: "Years and years of outsourcing and complacency have led to a rapidly shrinking industrial sector."
 israel_military: "Israeli Defense Forces"
 egypt_military: "Egyptian Armed Forces"
 india_military: "Indian Armed Forces"
 PRC_taiwan: "Taiwan Special Administrative Region"
 PRC_taiwan_desc: ""
 CUB_land_of_freedom_idea_desc: "\n\n\n\n\n£GFX_CUB_blockade_embed \n\n\n\n\n\n\nCuba has been under total Export embargo by its powerful neighbour USA since 1962 due to the communist regime. Severely impacting both the industry and life in the island."
 CUB_idea_blockade_desc: "\n\n\n\n\n£GFX_CUB_outpost_of_socialism_embed \n\n\n\n\n\n\nThe story of our nation has been hardship after hardship, yet we are as mighty as ever! We forced the dictator Batista out of our country, we showed the Americans they are not all powerful, and we proved that the resolve of the Cuban people is unbreakable!\n\nYet we are still alone, far across the sea from any of our allies. To our north, the great eagle sits on its perch, eagerly awaiting the moment we stumble to swoop down and rip out our neck. As of now, they have remained patient, but that could change at any moment. Still, we stand, united and ready for their talons!"
 CHI_idea_high_speed_railway_modifier: "High-Speed Railway"
 CHI_idea_high_speed_railway_modifier_desc: ""
 GER_Bundeswehr_modifier: "Bundeswehr"
 GER_Bundeswehr_modifier_desc: "The Bundeswehr is the armed forces of the Federal Republic of Germany and its freely elected parliament. It comprises both the military itself and civilian sectors. The armed forces consist of the four branches of the armed forces: Army, Air Force, Navy, and Cyber and Information Domain, as well as the support sector."
 PENINSULA_SHIELD: "Peninsula Shield Force"
 peninsula_shield_force_member: "Peninsula Shield Force"
 peninsula_shield_force_member_desc: "Peninsula Shield Forces is a regional military organization that coordinates joint defense and security efforts among the GCC member states. Its emblem symbolizes unity, protection, and readiness, representing the collective defense capabilities of the GCC countries."
 scientific_outlook_on_development_desc: "The Scientific Outlook on Development incorporates scientific socialism, sustainable development, social welfare, a humanistic society, increased democracy, and, ultimately, the creation of a Socialist Harmonious Society."
 xi_jinping_thought_desc: "Xi Jinping Thought is a set of policies and ideas derived from the writings and speeches of Chinese Communist Party general secretary Xi Jinping. Which focused on Marxism–Leninism and Mao Zedong Thought, China's place in history, strategic competition with capitalist nations, and a plea to adhere to the goals of communism."
 agrarian_economy_desc: "[FROM.GetName] is an extremely poor nation, with an economy predominantly based off of agricultural gains. Whilst the country modernises into the new millennium, the people will toil in the fields helping the economy.\n\n§Y$agrarian_economy$§! is earning §Y[?ROOT.GetName]§! §Y$$§![?additional_income_agrarian_economy|+3] §YBillion§! a week.\n\n§RAt 600 productivity, we will be considered industrialised and lose the bonus to agriculture!§!"

 industrial_complex_desc: "This building provides the state with industry for production of civilian goods or construction of new buildings. Can be converted to military industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y415K§!\nBase GDP Output per §YCivilian Industry§!: $§Y20 Billion§!\nBase Energy Consumption: §R-0.4§! GW\n"
 arms_factory_desc: "This building provides the state with industry for production of new military equipment. Can be converted to civilian industry if needed.\n\nProvides the state with:\nBase Number of Required Workers: §Y100K§!\nBase GDP Output per §YMilitary Industry§!: $§Y4 Billion§!\nBase Energy Consumption: §R-0.4§! GW"
 dockyard_desc: "§YNaval Yards§! are representative of a state's ability to produce military vessels of all sorts ranging from §YPatrol Boats§!, §YConvoys§!, §YDestroyers§!, §YCarriers§! and more.\n\nProvides the state with:\nBase Number of Required Workers: §Y100K§!\nBase GDP Output per §YNaval Yard§!: $§Y4 Billion§!\nBase Energy Consumption: §R-0.4§! GW"
 
