 CHI_diplo_icon_tooltip_desc: "The East Asia Defense Initiative, commonly referred to as “EADI”, is an international organization led by the §RPeople's Republic of China§!. This organization is dedicated to ensuring peace and stability in Asia and protecting its member states from aggression by militarists.\n\nAs the leader of this organization and the proposer of collective security in Asia, China is the undisputed core of the organization. It will use its own weapons to protect itself and its allies, while simultaneously demonstrating on the world stage its role as a major power capable of maintaining peace."
 EADI_diplo_icon_tooltip_desc: "As a formal member of the East Asia Defense Initiative Agreement (EADI), this country can clearly be considered a sovereign state compared to some politically indecisive nations.\n\nHowever, due to the excessive power of the core EADI countries, even without significant Chinese political interference, some anti-China nations still view it as a vassal state of China."
 EADI_Supervise_diplp_icon_tooltip_desc: "Because the country lacks the capacity for independent governance, some of its national powers are temporarily transferred to EADI for oversight until a new government fully controls the grassroots level. Therefore, the country is referred to as a supervised state.\n\nWhile some countries accuse this of being concrete evidence of Chinese interference in their internal affairs, in reality, EADI will end its supervisory status once the country completes its own political restructuring."
 EADI_Observer_diplp_icon_tooltip_desc: "This country is an observer state of the §REast Asia Defense Initiative§! (EADI), a term generally used for countries that are close to Beijing but have not yet formally declared their accession to EADI. This country will formally join ASEAN after a certain process, becoming a member fighting alongside Beijing."
 JAP_diplo_icon_tooltip_desc: "Following the collapse of American hegemony, Japan finds itself facing a direct threat from a long-time adversary across the sea. To gain sufficient strength to counter the 'red dragon', a collective security and defense organization similar to NATO is inevitable. To this end, Japan and Australia spearheaded the establishment of the §CPacific Defense Treaty Organization§!, with Japan now a core member and the first line of defense against the Chinese giant."
 AST_diplo_icon_tooltip_desc: "The impact of the collapse of American hegemony has also affected Australia. To protect its own security, Australia, together with Japan, established the §CPacific Defense Treaty Organization§!, hoping to rally countries in the Asia-Pacific region to counter the threat from Beijing. Australia will serve as the PTT's rear base, providing resources from the Australian continent to the treaty member states to build a powerful war machine."
 RAJ_diplo_icon_tooltip_desc: "India has long sought revenge against China since 1962, and the escalating global tensions have fueled its ambitions. After Japan and Australia spearheaded the establishment of the §CPacific Defense Treaty Organization§!, India also chose to join this camp against the Chinese giant. Even though India disdains these so-called allies, it has had to temporarily submit to the organization to counter pressure from Beijing. However, if the PDTO were to one day achieve victory over China, §RIndia might not follow the same path as them.§!"
 PDTO_diplo_icon_tooltip_desc: "This country is a member of the §CPacific Defense Treaty Organization§!. It possesses independent sovereignty, and its membership in the PDTO was largely due to past disputes with China and promises of benefits from Tokyo and Canberra. Although independent member states are supposed to be on equal footing, disparities in national strength mean that conflicts and discrimination still exist."
 PDTO_Supervise_diplp_icon_tooltip_desc: "The country exists within the organization as a dependent state of other nations, meaning it lacks full sovereignty and is subject to the control of its overlord. Faced with international criticism, its overlord claims this is “temporary supervision”, yet various indications suggest that the overlord has engaged in a series of cunning and extortionate activities within the country."
 PDTO_Observer_diplp_icon_tooltip_desc: "This country aligns closely with the PDTO countries and has also obtained observer status from the PDTO. Although it has not yet joined the §CPacific Defense Treaty Organization§!, the international community generally believes that its accession is only a matter of time."
