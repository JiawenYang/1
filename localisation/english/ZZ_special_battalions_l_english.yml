l_english:
 Marine_Bat_USA:0 "Marine Infantry Battalion (US)"
 Marine_Bat_USA_desc:0 "A US Marine Corps infantry battalion: three assault companies riding 30 AAVP-7A1 amphibious assault vehicles, including the battalion command vehicle. 900 Marines."
 Airborne_Bat_USA:0 "Airborne Infantry Battalion (82nd)"
 Airborne_Bat_USA_desc:0 "A parachute infantry battalion of the 82nd Airborne Division: three rifle companies with air-droppable light armor. 1750 paratroopers."
 Marine_Bat_SOV:0 "Naval Infantry Battalion (Russia)"
 Marine_Bat_SOV_desc:0 "A Russian Naval Infantry battalion: three companies mounted on 30 BTR-82A wheeled armored vehicles, with MT-LB and KamAZ trucks and 9M133 Kornet anti-tank missiles. No amphibious assault vehicles are fielded in 2017. 650 naval infantrymen."
 Airborne_Bat_SOV:0 "Airborne Assault Battalion (VDV)"
 Airborne_Bat_SOV_desc:0 "A VDV airborne assault battalion: three companies with 31 BMD-4M airborne combat vehicles, fully air-droppable. 600 paratroopers."
 Marine_Bat_CHI:0 "Marine Infantry Battalion (PLA)"
 Marine_Bat_CHI_desc:0 "A PLA Marine Corps infantry battalion: three companies on 31 ZBD-05 amphibious infantry fighting vehicles, plus the battalion command vehicle. 700 marines."
 Airborne_Bat_CHI:0 "Airborne Infantry Battalion (PLA)"
 Airborne_Bat_CHI_desc:0 "A PLA Airborne Corps infantry battalion: three companies with ZBD-03 airborne combat vehicles, fully air-droppable. 1500 paratroopers."
 Ranger_Bat_USA:0 "Ranger Battalion (75th)"
 Ranger_Bat_USA_desc:0 "A battalion of the 75th Ranger Regiment: three rifle companies of elite light infantry specialized in airfield seizure and direct action raids. 1160 Rangers."
 SOF_Bat_USA:0 "Special Forces Battalion (Green Berets)"
 SOF_Bat_USA_desc:0 "A US Army Special Forces battalion: three companies of Green Beret ODAs for unconventional warfare and foreign internal defense. 600 operators."
 SEAL_Bat_USA:0 "Navy SEAL Battalion"
 SEAL_Bat_USA_desc:0 "A Naval Special Warfare battalion: SEAL platoons specialized in maritime direct action, coastal infiltration and reconnaissance. 500 operators."
 AirAssault_Bat_USA:0 "Air Assault Battalion (101st)"
 AirAssault_Bat_USA_desc:0 "An air assault infantry battalion of the 101st Airborne Division: three rifle companies lifted by UH-60s with attack helicopter escort. 700 soldiers."
 Spetsnaz_Bat_SOV:0 "Spetsnaz GRU Battalion"
 Spetsnaz_Bat_SOV_desc:0 "A GRU Spetsnaz battalion: three companies for deep reconnaissance, sabotage and direct action behind enemy lines. 700 operators."
 SOV_Air_Assault_Bat:0 "Air Mobile Battalion (VDV)"
 SOV_Air_Assault_Bat_desc:0 "A VDV air assault brigade battalion: three rifle companies lifted by Mi-8/17 helicopters. 700 soldiers."
 SOF_Bat_CHI:0 "Lijian Special Battalion"
 SOF_Bat_CHI_desc:0 "A PLA special operations brigade battalion: three companies for strategic reconnaissance, raid and sabotage missions. 800 operators."
 AirAssault_Bat_CHI:0 "Air Assault Battalion (PLA)"
 AirAssault_Bat_CHI_desc:0 "A PLA Army air assault brigade battalion: three rifle companies lifted by Z-8/Z-20 helicopters. 700 soldiers."
 Marine_AirAssault_Bat_CHI:0 "Marine Air Assault Battalion (PLA)"
 Marine_AirAssault_Bat_CHI_desc:0 "An air assault battalion organic to a PLA Marine Corps brigade: three rifle companies lifted by Z-8/Z-20 helicopters for vertical envelopment and beachhead breakout. 700 soldiers."
 Para_Bat_ENG:0 "Parachute Battalion (Paras)"
 Para_Bat_ENG_desc:0 "A battalion of the Parachute Regiment: three rifle companies of airborne light infantry. 1750 paratroopers."
 RM_Cdo_Bat_ENG:0 "Royal Marines Commando Battalion"
 RM_Cdo_Bat_ENG_desc:0 "A Royal Marines commando unit: three companies specialized in amphibious assault and coastal raiding. 1750 commandos."
 SAS_Bat_ENG:0 "SAS Battalion"
 SAS_Bat_ENG_desc:0 "A 22 SAS sabre squadron group: four squadrons for deep reconnaissance, direct action and hostage rescue. 500 operators."
 REP_Bat_FRA:0 "2e REP Parachute Battalion"
 REP_Bat_FRA_desc:0 "A battalion of the 2nd Foreign Parachute Regiment (2e REP): four companies of Legion paratroopers for rapid overseas intervention. 2000 legionnaires."
 CdoMarine_Bat_FRA:0 "Commandos Marine Battalion"
 CdoMarine_Bat_FRA_desc:0 "A French Navy commando battalion: Commando Hubert and assault companies for maritime counter-terrorism and amphibious raids. 600 commandos."
 Marine_Bat_FRA:0 "Marine Infantry Battalion (9e BIMa)"
 Marine_Bat_FRA_desc:0 "The 9th Marine Infantry Brigade's composite battalion: two companies on 60 VAB wheeled armored vehicles and two companies on 60 AMX-10RC wheeled combat vehicles, with organic anti-tank, air defence and command elements, trained for amphibious and overseas intervention."
 FJ_Bat_GER:0 "Fallschirmjäger Battalion"
 FJ_Bat_GER_desc:0 "A German paratrooper battalion: three companies of airborne light infantry of the Rapid Forces Division. 1750 Fallschirmjäger."
 KSK_Bat_GER:0 "KSK Battalion"
 KSK_Bat_GER_desc:0 "A Kommando Spezialkräfte battalion: four commando companies for special reconnaissance, direct action and hostage rescue. 500 operators."
 Geb_Bat_GER:0 "Gebirgsjäger Battalion"
 Geb_Bat_GER_desc:0 "A mountain infantry battalion: three companies specialized in high-altitude and winter warfare. 1900 Gebirgsjäger."
 PzGren_Bat_GER:0 "Panzergrenadier Battalion"
 PzGren_Bat_GER_desc:0 "A mechanized infantry battalion equipped with Marder/Puma IFVs, three companies operating alongside armoured brigades. 1100 Panzergrenadiere."
 Airborne_Bat_JAP:0 "1st Airborne Brigade Battalion"
 Airborne_Bat_JAP_desc:0 "A battalion of the JGSDF 1st Airborne Brigade: three rifle companies of paratroopers for rapid deployment. 1500 paratroopers."
 ARDB_Bat_JAP:0 "Amphibious Rapid Deployment Battalion"
 ARDB_Bat_JAP_desc:0 "A battalion of the Amphibious Rapid Deployment Brigade: three companies on 25 Type 73/Type 96 armored vehicles for island defense. 700 soldiers."
 Marine_Bat_KOR:0 "ROK Marine Battalion"
 Marine_Bat_KOR_desc:0 "A Republic of Korea Marine Corps battalion: three companies on 25 KAAV7 amphibious assault vehicles for amphibious assault and island defense. 800 marines."
 SOF_Bat_KOR:0 "707th Special Mission Battalion"
 SOF_Bat_KOR_desc:0 "The 707th Special Mission Group: counter-terrorism and special reconnaissance companies of the ROK Army Special Warfare Command. 500 operators."
 Para_Bat_ISR:0 "Paratroopers Battalion (IDF)"
 Para_Bat_ISR_desc:0 "An IDF Paratroopers Brigade battalion: three companies of airborne infantry with organic anti-tank teams. 1500 paratroopers."
 Sayeret_Bat_ISR:0 "Sayeret Matkal Battalion"
 Sayeret_Bat_ISR_desc:0 "The General Staff Reconnaissance Unit: deep reconnaissance and hostage rescue teams under the IDF General Staff. 500 operators."
 Para_Bat_RAJ:0 "Para (SF) Battalion"
 Para_Bat_RAJ_desc:0 "An Indian Army Para (Special Forces) battalion: three companies for airborne raids and cross-border special operations. 1500 operators."
 Gorkha_Bat_RAJ:0 "Gorkha Rifles Battalion"
 Gorkha_Bat_RAJ_desc:0 "A Gorkha Rifles battalion: three companies of renowned hill fighters specialized in mountain and jungle warfare. 2000 riflemen."
 SOF_Bat_NKO:0 "SOF Sniper Battalion (KPA)"
 SOF_Bat_NKO_desc:0 "A Korean People's Army Special Operation Force sniper brigade battalion: three companies for infiltration and long-range reconnaissance. 800 operators."
 Amph_Bat_NKO:0 "Amphibious Assault Battalion (KPA)"
 Amph_Bat_NKO_desc:0 "A KPA amphibious assault battalion: three companies assaulting ashore on 23 PT-85 amphibious tanks, supported by hovercraft and landing craft. 400 soldiers."
 AirAssault_Bat_UKR:0 "Air Assault Battalion (Ukraine)"
 AirAssault_Bat_UKR_desc:0 "A Ukrainian Air Assault Forces battalion: three companies of highly mobile airmobile infantry. 550 soldiers."
 SOF_Bat_UKR:0 "SSO Battalion"
 SOF_Bat_UKR_desc:0 "A Ukrainian Special Operations Forces battalion: three companies for special reconnaissance and direct action. 600 operators."
 Bordo_Bat_TUR:0 "Maroon Berets Battalion"
 Bordo_Bat_TUR_desc:0 "A Turkish Special Forces Command battalion: three companies of Maroon Berets for unconventional warfare and counter-terrorism. 600 operators."
 Komando_Bat_TUR:0 "Commando Battalion (Turkey)"
 Komando_Bat_TUR_desc:0 "A Turkish Army commando brigade battalion: three companies specialized in mountain and internal security operations. 1500 commandos."
 Quds_Bat_PER:0 "Quds Force Battalion"
 Quds_Bat_PER_desc:0 "An IRGC Quds Force battalion: three companies for extraterritorial special operations and unconventional warfare. 700 operators."
 Takavar_Bat_PER:0 "Takavar Battalion"
 Takavar_Bat_PER_desc:0 "An Iranian Army Takavar battalion: three companies of commandos trained for airborne and amphibious raids. 1500 commandos."
 Folgore_Bat_ITA:0 "Folgore Parachute Battalion"
 Folgore_Bat_ITA_desc:0 "A battalion of the Folgore Parachute Brigade: three companies of Italian paratroopers for rapid deployment. 1500 paratroopers."
 SanMarco_Bat_ITA:0 "San Marco Marine Battalion"
 SanMarco_Bat_ITA_desc:0 "A battalion of the San Marco Marine Brigade: three companies on 30 VBM Freccia 8x8 wheeled armored vehicles for amphibious assault and littoral operations. 700 marines."
 GROM_Bat_POL:0 "GROM Battalion"
 GROM_Bat_POL_desc:0 "A JW GROM operational group: counter-terrorism and special operations teams of the Polish Special Troops Command. 500 operators."
 Legion_Bat_SPR:0 "Legion Battalion (Spain)"
 Legion_Bat_SPR_desc:0 "A Spanish Legion bandera: three companies of elite assault infantry for expeditionary operations. 1500 legionarios."
 CSOR_Bat_CAN:0 "CSOR Battalion"
 CSOR_Bat_CAN_desc:0 "A Canadian Special Operations Regiment battalion: three companies for direct action and special reconnaissance. 600 operators."
 SASR_Bat_AST:0 "SASR Battalion"
 SASR_Bat_AST_desc:0 "An Australian Special Air Service Regiment squadron group: three sabre squadrons for long-range reconnaissance and direct action. 500 operators."
 Jungle_Bat_BRA:0 "Jungle Warfare Battalion"
 Jungle_Bat_BRA_desc:0 "A Brazilian Army jungle infantry battalion: three companies specialized in Amazon riverine and jungle operations. 1500 soldiers."
 SSG_Bat_PAK:0 "SSG Battalion"
 SSG_Bat_PAK_desc:0 "A Pakistan Army Special Service Group battalion: three companies for special reconnaissance, airborne and counter-terrorism operations. 800 operators."
 Marine_Bat_TAI:0 "Marine Battalion (ROC)"
Marine_Bat_TAI_desc:0 "A battalion of the Republic of China Marine Corps, heir to the Sea Dragon frogman tradition: three rifle companies mounted in 23 AAV-7 amphibious assault vehicles for beachhead assaults, with anti-armor and air-defense weapons at battalion level. 550 marines."
SOF_Bat_TAI:0 "Liangshan Special Operations Battalion (ROC)"
SOF_Bat_TAI_desc:0 "The Liangshan special operations battalion of the Army Aviation and Special Forces Command (Airborne Special Service Company): all airborne-qualified raiders, expert in the mountain warfare of the Central Range, counter-landing strikes and built-up-area defense of the island. 400 operators."
 Saiqa_Bat_EGY:0 "Saiqa Battalion"
 Saiqa_Bat_EGY_desc:0 "An Egyptian Saiqa (Thunderbolt) Forces battalion: three companies of elite shock troops for airborne and commando operations. 1500 soldiers."
