l_simp_chinese:
 # QL 军官团精神（陆军/海军/空军各分类）
 ql_prc_army_spirit_01:0 "职业军队建设"
 ql_prc_army_spirit_01_desc:0 "遵循军队国家化的原则来建立的国防力量，重视专业科学的培训和爱国热情的重要性，并通过行动伦理审查和文官决策参与来确保其价值观不偏离正轨"
 ql_prc_army_spirit_02:0 "听党话跟党走"
 ql_prc_army_spirit_02_desc:0 "中国特色的党军关系，强调党指挥枪、党支部建在连上、军队指挥领导权力高度集中的原则，确保人民军队的绝对忠诚。听党指挥、能打胜仗，作风优良"
 ql_prc_army_spirit_03:0 "国家武装力量"
 ql_prc_army_spirit_03_desc:0 "常见于东方国家的军队指挥和组织培训体系，更加强调军队的集中规模化管理、编制的垂直整合与动员预备力量的重要性，军政系统和情报机关力量高度融合"
 ql_prc_army_spirit_05:0 "军事的政治化"
 ql_prc_army_spirit_05_desc:0 "根据主流政治学理论的描述，“军事政治化”指的是军队越来越多地参与和影响政治决策；在许多领域，军事领袖们操纵政治决策，以推动军事政权的利益"
 ql_prc_navy_spirit_07:0 "重视航空威慑"
 ql_prc_navy_spirit_07_desc:0 "最强的空军是我们的空军，次强的空军则是我们的海军航空兵；拥有制空权优势的一方更能了解大海，压缩敌人的生存空间并循迹给予致命的打击"
 ql_prc_navy_spirit_08:0 "强调信息决胜"
 ql_prc_navy_spirit_08_desc:0 "现代海战是信息化的海战，为建设世界一流海军，务必强化态势感知，打造配套的打击体系，以献身、严格、图强、求实的精神来准备即将到来的决战时刻"
 ql_prc_navy_spirit_09:0 "少壮海员培训"
 ql_prc_navy_spirit_09_desc:0 "我军的制胜关键在于致命而迅捷的进攻，了解随机应变的方法；勇敢地前出实施多维度立体突进，利用水面舰队饱和攻击，而不是坐等敌人的包围和封锁"
 ql_prc_navy_spirit_11:0 "探讨海洋传统"
 ql_prc_navy_spirit_11_desc:0 "海军是重视历史的军种，我们可以从丰富的战争经验中汲取力量，包括装备设计和人员培训乃至于军人的生活习惯；建设和维持一支强大的主力舰群势在必行"
 ql_prc_navy_spirit_12:0 "专注潜艇训练"
 ql_prc_navy_spirit_12_desc:0 "我国缺乏投资强大的水面舰队的资金和能力；权衡利弊，应该优先保障强大的水下威慑舰队的运作，捍卫国家海上主权稳定性，再考虑建设一支更平衡的海军"
 ql_prc_army_spirit_13:0 "国际联合防务"
 ql_prc_army_spirit_13_desc:0 "通过深度参与国际军贸市场，我们可以相当便利地开展技术合作和军队间交流，从而获取更先进的武器和更多的装备使用经验，以弥补自身的一些短板"
 ql_prc_army_spirit_14:0 "全产业链能力"
 ql_prc_army_spirit_14_desc:0 "坐拥独一无二的庞大的全产业链民用工业，以及具备自主知识产权的军用工业，我们的尖端武器生产成本可以大大降低，同时通过军民结合促进市场繁荣"
 ql_prc_army_spirit_15:0 "高效武装系统"
 ql_prc_army_spirit_15_desc:0 "通过将国有资产集中在军事领域，并采取适当的组织和建设方案，我们可以在民用经济陷入凋敝时依然保持较强的生产和研发能力，并维持前线补给能力"
 ql_prc_navy_spirit_18:0 "海洋学科积累"
 ql_prc_navy_spirit_18_desc:0 "通过漫长的航海历史，我们得以掌握地球上许多海洋的水文状况，了解如何制造舒适且抗风浪的大型远洋船舶，并熟悉使它们高效运作的具体操作技术"
 ql_prc_navy_spirit_19:0 "高效舰艇制造"
 ql_prc_navy_spirit_19_desc:0 "我们是世界上主要的造船大国，并已经掌握了许多特种船舶制造技术，能够以惊人的速度研发、制造并列装远比对手更多的舰船，而且质量也毫不逊色"
 ql_prc_navy_spirit_20:0 "极地运作经验"
 ql_prc_navy_spirit_20_desc:0 "发达的核工业和数百年来从事寒带海洋运输的经验赋予我国建造最专业的极地船只的能力，让我们能够跨越地球的顶点将死亡和毁灭带给那些傲慢的鼠辈"
 ql_prc_navy_spirit_21:0 "重启重型战舰"
 ql_prc_navy_spirit_21_desc:0 "现在我们已经拥有了一支重新伟大的海军，不必再担心辽阔的公海被敌方夺取，那么是时候回归沉寂的大炮巨舰战略，研发并装备那些巨大的钢铁主力舰了！"
 ql_prc_air_spirit_23:0 "尖端航空运输"
 ql_prc_air_spirit_23_desc:0 "通过深度参与国际航空产业链，特别那些是大型机体的研发和运营；我们可以获得最新的技术和成熟的子系统，以及一批熟练的精英飞行员"
 ql_prc_air_spirit_24:0 "优秀风洞实验"
 ql_prc_air_spirit_24_desc:0 "最大最完善的多种规格的风洞设施集群及配套的科研机构使我国有能力在更短时间内研发并迭代新式设备，进而加入先进飞行器研发的自由王国，总是快人一步"
 ql_prc_air_spirit_25:0 "系统工程研究"
 ql_prc_air_spirit_25_desc:0 "航空系统工程是为了最好地实现系统的目的，对系统的组成要素、组织结构、信息流、控制机构等进行分析研究的科学方法，可弥补子系统的某些技术缺陷"
 ql_prc_army_spirit_28:0 "捍卫自由，持久安全"
 ql_prc_army_spirit_28_desc:0 "对付共同价值观之敌，绝不谈判，直至借上帝之力肃清其阴影！当疯狂的风暴来临，这个渐渐走向支离破碎的世界，仍然需要有人维护秩序，提供希望"
 ql_prc_army_spirit_29:0 "人民至上，初心不忘"
 ql_prc_army_spirit_29_desc:0 "人民军队必须牢记全心全意为人民服务的根本宗旨，任何时候任何情况下都做人民子弟兵。务必铭记历史所启示的伟大真理-正义必胜！和平必胜！人民必胜！"
 ql_prc_army_spirit_30:0 "凝聚意志，坚定行动"
 ql_prc_army_spirit_30_desc:0 "祖国在召唤！无论持何种信仰，唯有团结一致，方能捍卫民族尊严，摧毁那些野蛮暴徒；让我们伟大祖先的英姿在战争中鼓舞你们吧！向着胜利前进！"
 ql_prc_navy_spirit_32:0 "统御无垠大洋"
 ql_prc_navy_spirit_32_desc:0 "控制广阔大洋不是完成时，不能保证绝对优势则毫无意义；如果没有海军，战争将在我国国土上进行；战争像比赛一样，最好是打到对方的半场里去"
 ql_prc_navy_spirit_33:0 "航向浩瀚深蓝"
 ql_prc_navy_spirit_33_desc:0 "到2010年为止，确立第一岛链内的制海权，使其内海化，到2020年确保第二岛链内的制海权，并且在2040年为止取得可以遏制美国海军在太平洋及印度洋支配权的力量"
 ql_prc_navy_spirit_34:0 "建设威慑力量"
 ql_prc_navy_spirit_34_desc:0 "若不掌控海洋，我国将永远是内陆的囚徒；我为她铸造舰队，打开通往世界的门；尽管当这只舰队历尽挫折，暂时蛰伏海底，但终会迎来新生，重获无上荣誉"
 ql_prc_air_spirit_36:0 "全球打击能力"
 ql_prc_air_spirit_36_desc:0 "利用全面制空权投送更多的力量，并尽可能防止敌人的干扰；甚至在某种程度上，空中力量可以单独决定战争的胜负，而无需依赖陆军或海军"
 ql_prc_air_spirit_37:0 "决胜千里之外"
 ql_prc_air_spirit_37_desc:0 "随着雷达技术和超远距离空空导弹的发展，大规模BVR作战的潜力正逐渐显现出来；使用针对性的战术战法，无需目视确认就可击毁一切来犯之敌"
 ql_prc_air_spirit_38:0 "征服前线空域"
 ql_prc_air_spirit_38_desc:0 "没有制空权的陆军就像没有眼睛的巨人，注定在战场上盲目挣扎；我国空军的使命一是保障前线地面力量作战不受干扰，二是保障战区空域的制空权"
 # 精神将领升级提示（tt）
 ql_prc_army_spirit_01_tt:0 "陆军将领:升级时有§G100%几率§!获得§Y+1计划§!、§Y+1后勤§!。"
 ql_prc_army_spirit_02_tt:0 "陆军将领:升级时有§G100%几率§!获得§Y+1攻击§!。"
 ql_prc_army_spirit_03_tt:0 "陆军将领:升级时有§G100%几率§!获得§Y+1防御§!。"
 ql_prc_navy_spirit_07_tt:0 "海军将领:升级时有§G100%几率§!获得§Y+1防御§!。"
 ql_prc_navy_spirit_08_tt:0 "海军将领:升级时有§G100%几率§!获得§Y+1攻击§!。"
 ql_prc_navy_spirit_09_tt:0 "海军将领:升级时有§G100%几率§!获得§Y+1机动§!、§Y+1协同§!。"
