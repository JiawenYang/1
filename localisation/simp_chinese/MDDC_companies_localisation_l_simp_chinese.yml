l_simp_chinese:
 SAU_Saudi_Aramco: "§0沙特阿美§!"
 SAU_Saudi_Aramco_desc: "沙特阿拉伯石油公司是沙特阿拉伯的国家石油公司，世界上最大的综合性能源和化学品公司之一，目前是世界上探明储量最大的石油公司，总部设在宰赫兰。公司拥有全世界最大的陆上油田──加瓦尔油田，以及最大的海上油田──萨法尼亚油田。"
 TAI_TSMC_company: "§0台积电§!"
 TAI_TSMC_company_desc: "台湾积体电路制造股份有限公司是台湾一家专注于半导体芯片制造的高科技跨国企业，总部位于台湾新竹科学园区，是全球前十大企业，也是全球最领先的半导体芯片制造商。其主要业务涵盖芯片制造、封装、测试及技术服务。凭借先进的制程技术与持续创新，台积电在国际市场享有盛誉，芯片制造市占率居全球首位，为全球高科技产业的重要支柱，并为苹果、联发科、Google、辉达、AMD、OpenAI等知名企业供应先进的高性能芯片，亦在人工智能、自动驾驶等尖端科技产业的发展中扮演关键角色。"
 TAI_Foxconn_company: "§0富士康科技集团§!"
 TAI_Foxconn_company_desc: "鸿海科技集团是源自台湾的跨国企业集团，1974年创办，以富士康做为商标名称。其专注于电子产品的代工服务，研发生产精密电气元件、机壳、准系统、系统组装、光通讯元件、液晶显示件等3C产品上、下游产品及服务。"
 TAI_Formosa_company: "§0台塑集团§!"
 TAI_Formosa_company_desc: "台塑企业是台湾企业集团之一，源起于1954年创立之福懋塑胶工业股份有限公司，1957年更名为台湾塑胶工业股份有限公司 （简称“台塑”），其后逐步扩大经营版图。目前旗下事业横跨塑胶、炼油、石化、纤维、纺织、电子、能源、运输、重工、生物科技、医疗、教育等领域。台塑企业经过六十余年的努力发展，目前共计拥有台塑、南亚、台化、台塑石化等百余家关系企业，分别在台湾、美国、中国大陆、越南、菲律宾及印尼都设有工厂。此外并拥有庞大的教育和医疗机构，是台湾最大的民营企业之一。"
 FRA_LVMH_company: "§0路易威登集团§!"
 FRA_LVMH_company_desc: "酩悦·轩尼诗-路易·威登集团是当今世界最大的跨国奢侈品综合企业，雄踞在《财富》杂志世界500强公司排行榜上，总部位于法国巴黎。该公司是1987年时装品牌路易威登与酩悦轩尼诗合并而成立，而酩悦轩尼诗则是1971年由香槟酒制造商酩悦和干邑白兰地制造商轩尼诗并购而成。该集团控制着大约60个子公司，每个子公司负责管理少量具有高度声望的品牌。这些子公司通常以独立管理方式运作。"
 FRA_LOreal_company: "§0欧莱雅§!"
 FRA_LOreal_company_desc: "欧莱雅集团是一间总部位于法国巴黎的皮肤护理、化妆品公司，创办于1909年，是世界上最大的化妆品集团，也是财富全球500强企业之一。欧莱雅集团经营范围遍及150多个国家和地区，在全球拥有150个分公司、42家工厂、100多个代理商，以及88000名的员工。"
 FRA_TotalEnergies_company: "§0道达尔能源§!"
 FRA_TotalEnergies_company_desc: "道达尔能源是一家法国石油公司，为目前世界六大石油公司之一，同时也是欧洲市值最大的公司之一。其经营范围涵盖了整个石油和天然气的产业链，从原油和天然气的勘探开发到发电、运输、炼化、石油产品销售以及国际原油及产品交易。道达尔同时也是一家大规模化学品生产商。该公司总部位于法国巴黎附近的库尔贝瓦拉德芳斯区。"
 FRA_Schneider_Electric_company: "§0施耐德电气§!"
 FRA_Schneider_Electric_company_desc: "施耐德电气是法国一家跨国企业，成立于1836年，也是世界最大能源管理公司、优化解决方案供应商之一，主要产品包括断路器、传感器、控制器等等，为各国能源设施、工业、数据中心及网络、大楼，提供整体解决方案。其中在能源、基础设施、工业过程控制、大楼自动化、数据中心与网络等市场，皆处世界领先地位。自成立以来，施耐德一直是法国工业先锋之一，在19世纪末，曾是欧洲三大军火厂之一。2008年，施耐德电气全球销售额，达183亿欧元。施耐德电气的宗旨是：让所有人都能善用其能源与资源，为所有人建立起进步与永续发展的桥梁。"
 FRA_Vinci_SA_company: "§0万喜集团§!"
 FRA_Vinci_SA_company_desc: "万喜是一家法国建筑公司，总部位于巴黎郊区的吕埃-马尔迈松。除了建筑业之外，还负责多家机场的运营。"
 TUR_Koc_Holding_company: "§0科奇控股§!"
 TUR_Koc_Holding_company_desc: "科奇控股股份有限公司为土耳其最大综合企业公司。总部位于伊斯坦布尔由著名富商︁科奇家族持有。"
 GER_SAP_company: "§0思爱普§!"
 GER_SAP_company_desc: "思爱普公司是德国一家软件企业，总部位于德国巴登符腾堡州瓦尔多夫，主营企业资源管理软件，在130个国家设有办事处，在190个国家拥有超过335,000名客户。该公司股票是欧洲Stoxx 50股票市场指数的成分股。"
 GER_Volkswagen_company: "§0大众汽车§!"
 GER_Volkswagen_company_desc: "大众汽车是一家总部位于德国沃尔夫斯堡的汽车制造公司，为大众集团的核心企业及创始品牌，也是该集团最畅销品牌及全球第一大汽车制造商。在德语中，Volks为人民之意，Wagen为汽车之意，因此，其全名之意即是“人民汽车”。"
 GER_Siemens_company: "§0西门子股份公司§!"
 GER_Siemens_company_desc: "西门子股份公司为德国的一家跨国企业，其电子与电机产品是全球业界先驱，并活跃于能源、医疗、工业、基础建设及城市业务等领域。西门子于1847年由维尔纳·冯·西门子建立，总部位于德国慕尼黑和柏林，于法兰克福证券交易所和纽约证券交易所挂牌上市。"
 GER_BMW_company: "§0宝马§!"
 GER_BMW_company_desc: "巴伐利亚发动机制造厂股份有限公司是德国一家跨国豪华汽车、摩托车和发动机制造商，总部位于德国巴伐利亚州的慕尼黑。"
 GER_Deutsche_Telekom_company: "§0德国电信股份公司§!"
 GER_Deutsche_Telekom_company_desc: "德国电信股份公司简称德国电信，总部坐落于波恩，按收入计算是欧洲第一大电信公司。德国电信向个人、企业和经销商提供固定网络（VDSL、DSL和FTTH）和移动网络（5G、4G、3G、2G）接入，此外还提供其他IT服务。"
 GER_MercedesBenz_company: "§0梅赛德斯-奔驰集团股份公司§!"
 GER_MercedesBenz_company_desc: "梅赛德斯-奔驰集团是一家总部位于德国斯图加特的汽车公司。根据销量，梅赛德斯-奔驰是世界前十大汽车商之一，第一大商用车制造商和第二大卡车制造商，梅赛德斯-奔驰也以生产豪华车如梅赛德斯-奔驰闻名。"
 GER_Landesbank: "§0巴登-符腾堡州银行§!"
 GER_Landesbank_desc: "巴登-符腾堡州银行成立于1999年1月，总部位于德国斯图加特，是巴登-符腾堡州储蓄银行的中央机构。该银行管理资产总额约3330亿欧元。LBBW业务涵盖零售银行、批发银行及储蓄银行业务。"
 GER_Deutsche_Bahn: "§0德国铁路§!"
 GER_Deutsche_Bahn_desc: "德国铁路股份公司是一家总部设于柏林的德国国有运输公司，于1994年在法兰克福创立，由原德国联邦铁路及德国国营铁路合并而成。公司重新于2000年迁至柏林，入驻位于柏林波茨坦广场旁新落成的铁路塔。该集团的开发和其它一些中央部门则仍设在法兰克福。目前，它是仅次于德国邮政的世界第二大运输企业，也是欧洲最大的铁路运营商及铁路基建商。"
 GER_Lufthansa: "§0汉莎航空§!"
 GER_Lufthansa_desc: "德国汉莎航空是德国的国家航空公司，也是星空联盟的创始成员之一。按照载客量和机队规模计算，为欧洲最大的航空公司；而按照乘客载运量计算，则为世界第四大航空公司。此外，汉莎航空也与英国航空为目前欧洲仅有两间仍有运营空中客车A380客机的航空公司。其德语原名中的Luft意思是“空中”，而名称中的Hansa代表着源自13至15世纪北德地区强大的商业联盟汉萨同盟。"
 ENG_AstraZeneca_company: "§0阿斯利康§!"
 ENG_AstraZeneca_company_desc: "阿斯利康制药公司是一家由瑞典阿斯特公司和英国捷利康公司于1999年4月6日合并而成的大型英瑞合资生物制药企业；而捷利康本身是于1993年由英国帝国化学工业公司分拆出来的制药公司。阿斯利康公司研发、制造及销售用于治疗消化、心血管、肿瘤、中枢神经、呼吸系统疾病以及用于麻醉的药物和疫苗。公司总部位于剑桥的剑桥生物医学园区。"
 ENG_Shell_company: "§0壳牌公司§!"
 ENG_Shell_company_desc: "壳牌是世界第二大石油公司，公司在英国注册，总部位于荷兰海牙。由荷兰皇家石油与英国的壳牌两家公司合并组成。荷兰皇家石油于1890年创立，并获得荷兰君主特别授权。为了与当时最大的石油公司，美国的标准石油竞争，1907年荷兰皇家石油与英国的壳牌运输贸易有限公司合并成为现今壳牌。壳牌是世界石油巨头之一，至今依然是石油、能源、化工和太阳能领域的重要竞争者。壳牌拥有五大核心业务，包括勘探和生产、天然气及电力、煤气、化工和可再生能源。壳牌在全球140多个国家和地区拥有分公司或业务。"
 ENG_Linde_company: "§0林德集团§!"
 ENG_Linde_company_desc: "林德集团是一家位于德国慕尼黑的化学工业集团。由卡尔·冯林德创建于1879年，按市场份额是全球最大的工业气体集团，在德意志交易所和瑞士证券交易所同时上市，并被纳入DAX指数成分股，林德在全球100多个国家拥有超过600多家附属公司，在工业，零售，贸易，科技，研发和公共领域均有涉及。"
 ENG_Unilever_company: "§0联合利华§!"
 ENG_Unilever_company_desc: "联合利华是一家英国的跨国消费品公司，由荷兰联合麦淇淋公司和英国利华兄弟公司合并而成，总部设在荷兰鹿特丹和英国伦敦。 其产品包括食品、饮料、清洁剂和个人护理产品。按2012年收入计算，仅次于宝洁和雀巢，是世界第三大消费品公司。联合利华是世界上最大的涂抹食品生产商，如人造奶油。作为最古老的跨国公司之一，其产品约销售于190个国家和地区。"
 ENG_BP_company: "§0英国石油公司§!"
 ENG_BP_company_desc: "BP公众有限公司，前称英国石油，是世界六大石油公司之一，也是世界前十大私营企业集团之一。该公司前身是创立于1908年的“英波石油公司”，1954年改称“英国石油公司”。该公司整合探油、探气、炼油、储油、售油、零售等营业领域。"
 ENG_Diageo_company: "§0帝亚吉欧§!"
 ENG_Diageo_company_desc: "帝亚吉欧公众有限公司是英国的跨国酒精饮料公司，总部位于伦敦。帝亚吉欧是世界最大的蒸馏酒出产商，亦是重要的啤酒及葡萄酒生产商。"
 ENG_GlaxoSmithKline_company: "§0葛兰素史克§!"
 ENG_GlaxoSmithKline_company_desc: "葛兰素史克股份有限公司是总部位于英国伦敦的全球第三大的制药、生物以及卫生保健公司。葛兰素史克是一家覆盖抗感染、中枢神经系统、呼吸科、肠胃／代谢、肿瘤和疫苗领域的以研发为基础的公司。它的业务范围同时还包含了处于领先地位的口腔卫生保健，营养饮料和一些非处方药业务。"
 ENG_HSBC: "§0汇丰银行§!"
 ENG_HSBC_desc: "汇丰控股有限公司为汇丰集团的控股公司，总部设于英国伦敦，为规模最大的欧系银行，汇控1991年才正式成立，但旗下汇丰银行已有超过160年的历史。汇丰是全球规模最大的银行及金融服务机构之一。汇丰业务根基深厚，国际网络遍及全球六大区域，在欧洲、香港、亚太地区、中东、北美洲和拉丁美洲的64国家和地区设有约4000个办事处，其金融服务客户超过五千万名。"
 ENG_Rio_Tinto: "§0力拓集团§!"
 ENG_Rio_Tinto_desc: "力拓集团是一家跨国矿产及资源集团，这公司同时还兼营煤、铁、铜、黄金、钻石、铝和能源等业务。"
 ENG_Barclays: "§0巴克莱银行§!"
 ENG_Barclays_desc: "巴克莱银行是英国第二大银行，仅次于汇丰集团。巴克莱具有逾300年历史，是英国最古老的银行，其历史可以追溯到1690年。巴克莱是全世界第一家拥有ATM的银行，并于1966年发行了全英第一张信用卡，1987年发行了全英第一张借记卡。总部位于伦敦金丝雀码头丘吉尔广场一号。"
 ENG_NatWest_Group: "§0NatWest集团§!"
 ENG_NatWest_Group_desc: "国民西敏集团，前身苏格兰皇家银行集团和RBS集团，是英国的一家银行和保险控股公司，总部位于苏格兰爱丁堡。该集团的业务范围包括欧洲、北美和亚洲。在英国，国民西敏控股下属企业包括皇家苏格兰银行、国民西敏银行、阿尔斯特银行、顾资银行。RBS集团在苏格兰和北爱尔兰有发行英镑纸币的权利。"
 ENG_BT_Group: "§0英国电信集团§!"
 ENG_BT_Group_desc: "英国电信集团，原为英国国营电信公用事业，由英国邮政总局管理，1981年10月1日脱离英国皇家邮政，变成独立的国营事业。在英国保守党撒切尔夫人执政下，1984年向市场出售50%公股，成为民营公司。该公司始终是全英最大电信设施硬件的营运者。英国电信在全球170个国家设有营业点或办事处。目前海外营业处的营业额占该集团总营业额的三分之一。"
 CHI_Tencent_company: "§0腾讯§!"
 CHI_Tencent_company_desc: "腾讯控股有限公司是中国一家跨国企业控股公司。1998年11月由马化腾、张志东、陈一丹、许晨晔、曾李青5位创始人共同创立，总部位于深圳南山区腾讯滨海大厦。腾讯业务拓展至社交、金融、投资、资讯、工具和平台等不同领域，其子公司专门从事各种全球互联网相关服务和产品、娱乐、人工智能和技术。"
 CHI_Alibaba_company: "§0阿里巴巴§!"
 CHI_Alibaba_company_desc: "阿里巴巴集团创立于1999年，是中国大陆一家以提供互联网服务为主的综合企业集团，目前实行位于杭州，上海与北京的双总部制度。阿里巴巴服务范围包括B2B贸易、网上零售、购物搜索引擎、第三方支付和云计算服务。集团的子公司包括阿里巴巴B2B、淘宝网、天猫、一淘网、阿里云计算、聚划算、全球速卖通、阿里巴巴国际交易市场、饿了么、飞猪、优酷、盒马鲜生、阿里影业、菜鸟网络、UC浏览器、钉钉、高德地图、Lazada、Daraz等。"
 CHI_CCB_company: "§0中国建设银行§!"
 CHI_CCB_company_desc: "中国建设银行股份有限公司是中国大陆四大国有股份制商业银行之一，是中国大陆规模第二大的银行。同时也是代表香港中资金融股的八行五保之一。"
 CHI_ICBC_company: "§0中国工商银行§!"
 CHI_ICBC_company_desc: "中国工商银行股份有限公司成立于1984年1月1日，是中国大陆五大国有商业银行之一，总部设在北京市，由中国人民银行的工商信贷和储蓄业务分离而设立，为中国大陆最大的银行。"
 CHI_Baidu_company: "§0百度§!"
 CHI_Baidu_company_desc: "百度公司是一家主要经营互联网搜索引擎、人工智能与相关技术服务的中国北京市互联网的跨国科技企业，于2000年1月1日由李彦宏、徐勇两人创立于北京中关村。百度是中国最早的商业化搜索引擎服务商之一，其核心产品为“百度搜索”，并逐步发展出在线广告、知识问答、云计算、自动驾驶、人工智能芯片等业务。"
 CHI_Lenovo_company: "§0联想§!"
 CHI_Lenovo_company_desc: "联想集团有限责任公司是中国的一家跨国科技公司，成立于1984年，由中国科学院计算技术研究所投资20万元人民币、11名科学人员创立，当时的名称为“中国科学院计算所新技术发展公司”。1989年，更改为“联想计算机集团有限责任公司”。"
 CHI_huawei: "§0华为§!"
 CHI_huawei_desc: "华为技术有限公司是1987年由任正非创立的科技企业，总部位于中华人民共和国广东省深圳市。华为初期专注于制造电话交换机，现在的业务以研发和制造通信设备、消费电子产品为主，华为还涉足软件开发、设计生产集成电路、光伏和电动汽车等领域。"
 CHI_xiaomi: "§0小米§!"
 CHI_xiaomi_desc: "小米集团成立于2010年4月6日，是一家以智能手机、智能硬件和IoT平台为核心的消费电子及智能制造公司。"
 CHI_Petro_China: "§0中国石油天然气集团公司§!"
 CHI_Petro_China_desc: "中国石油天然气集团有限公司是中华人民共和国一家主要从事以油气业务、工程技术服务、石油工程建设、石油装备制造、金融服务、新能源开发等业务的特大型中央企业，总部位于中国北京市。1946年6月1日于上海市成立中国石油公司 ，1998年7月27日，中国石油集团拆分自中华人民共和国石油工业部，并在中国石油天然气总公司的基础上组建。亦是中国大陆地区最大的原油与天然气的生产及供应商，也是最大的炼油化工产品的生产及供应商之一。"
 CHI_China_State_Construction_Engineering: "§0中国建筑集团有限公司§!"
 CHI_China_State_Construction_Engineering_desc: "中国建筑集团有限公司是中华人民共和国一家主要从事房屋建筑、国际工程外包、房地产开发、基础建设及设计勘察业务的特大型中央企业，以现代工业建筑为主要产品，目前它是世界最大的投资建设集团和工程承包商。"
 CHI_China_Telecom: "§0中国电信§!"
 CHI_China_Telecom_desc: "中国电信集团有限公司是中华人民共和国一家主要从事电信业的特大型中央企业，中国电信是一家全球大型的领先的全业务综合智能信息服务运营商，主要在中国内地三十一个省市自治区和澳门特别行政区提供固定及移动通信服务、互联网接入服务、信息服务，以及其他增值电信服务。"
 CHI_Agricultural_Bank: "§0中国农业银行§!"
 CHI_Agricultural_Bank_desc: "中国农业银行股份有限公司是中华人民共和国的五大国有大型商业银行之一，资产在中国银行排名第三。"
 CHI_CNOOC: "§0中国海洋石油总公司§!"
 CHI_CNOOC_desc: "中国海洋石油集团有限公司是中华人民共和国一家主要从事海上石油、天然气开发的特大型中央企业，是中国第三大国有石油公司。中海油成立于1982年，总部设于北京。该公司主要负责在中国海域对外合作开采海洋石油及天然气资源，其注册资本为500亿元人民币。公司控股上市公司中国海洋石油有限公司。"
 HOL_ABN_AMRO: "§0荷兰银行§!"
 HOL_ABN_AMRO_desc: "荷兰银行是荷兰最大的跨国金融机构之一，在世界各地设有分支机构。荷兰银行的规模和经济实力在欧洲银行中排名前列。荷兰银行的总行设在阿姆斯特丹的Zuidas。总部大楼高105米，是Zuidas地区最高的建筑。同时总行也是带动Zuidas地区经济发展的主要动力之一。"
 HOL_Airlines: "§0荷兰皇家航空§!"
 HOL_Airlines_desc: "荷兰皇家航空是荷兰的国家航空公司，于1919年创立，今为法荷航集团的子公司及天合联盟成员。"
 USA_Apple_company: "§0苹果公司§!"
 USA_Apple_company_desc: "苹果公司是源自美国的跨国科技公司，总部位于美国加州的库比蒂诺，与亚马逊、谷歌、微软、Meta并行为五大科技巨擘。目前的业务包括设计、研发、手机通信和销售消费电子、计算机软件、在线服务和个人计算机。"
 USA_Ford: "§0福特§!"
 USA_Ford_desc: "福特汽车公司是美国一家生产汽车的跨国企业，公司总部位于美国密歇根州迪尔伯恩。福特汽车由亨利·福特所创立，于1903年公司化。在20世纪如日中天的时候，福特、通用与克莱斯勒被认为是底特律的三大汽车生产商，带领着美国的汽车市场。福特汽车在美国汽车市场连续75年保持销售量第二名，仅次于通用汽车。亨利·福特参考引进了大量汽车生产及管理大量工厂员工的方法，别具匠心地根据设计，以移动式装配线为代表的新生产序列。其高效率、高工资和低售价的结合，对当时美国制造业而言是一次翻天覆地的改革和创新，因此此套方法尔后被称为福特制，而其产业观念在后来被安东尼奥·葛兰西称为福特主义。"
 USA_Microsoft_company: "§0微软公司§!"
 USA_Microsoft_company_desc: "微软是源自美国的跨国科技公司，于1975年由比尔·盖茨与保罗·艾伦创立，总部位于美国华盛顿州的雷德蒙德，与亚马逊、苹果、谷歌、Meta并行为五大科技巨头，同时为北美4大云服务提供者（CSP）之一。其中为研发、制造、授权及提供广泛的电脑软件服务为主要业务，最为著名且畅销的产品是Microsoft Windows操作系统及Microsoft Office办公软件，其它子公司如Xbox游戏业务等也都十分的著名。公司成立初期,主要为Altair 8800发展和销售BASIC解释器，在1980年代中期借着MS-DOS在家用电脑操作系统市场上获取长足进步，后来出现的Windows使得微软逐渐统治了家用桌面电脑操作系统市场。同时微软也开始扩大业务，进军其它行业和市场，创建了MSN网站，在电脑硬件市场上，微软商标及Xbox游戏机、Zune和MSN TV家庭娱乐设备也在不同的年份出现在市场上。微软于1986年首次公开募股，此后不断走高的股价为微软缔造了四位亿万富翁和12,000位百万富翁。随着公司的强大，微软也受到越来越多的批评和责备，数十年来从未间断。拒绝交易和捆绑销售等做法招致垄断和不正当竞争的诉讼。美国司法部和欧盟委员会根据反托拉斯法均对微软做出过不利裁定。"
 USA_Alphabet_company: "§0字母表公司§!"
 USA_Alphabet_company_desc: "Alphabet公司是位于美国加州的控股公司，于2015年10月2日成立，由Google公司组织分割而来，并继承了Google公司的上市公司地位以及股票代号。Google公司重整后则成为Alphabet Inc.最大的子公司。Alphabet旗下拥有Calico、CapitalG、Chronicle、DeepMind、Google、Google Fiber、GV、Jigsaw、Loon LCC、Sidewalk Labs、Verily、Waymo 和 X 等子公司。"
 USA_Amazon_company: "§0亚马逊§!"
 USA_Amazon_company_desc: "亚马逊公司是一家总部位于美国西雅图的跨国电子商务企业，目前是全球最大的互联网线上零售商之一。亚马逊公司在美国、加拿大、英国、法国、德国、中国 、新加坡、意大利、西班牙、巴西、日本、印度、墨西哥、澳大利亚和荷兰均开设了零售网站，而其旗下的部分商品也会通过国际航运的物流方式销售往其他国家。波兰和瑞典等国也有望开设分站。"
 USA_Berkshire_Hathaway_company: "§0伯克希尔·哈撒韦公司§!"
 USA_Berkshire_Hathaway_company_desc: "伯克希尔·哈撒韦为一间总部位于美国内布拉斯加州奥马哈的跨国多元控股公司，旗下掌管多家子公司。本来前身为一家纺织公司，在沃伦·巴菲特于1965年取得伯克希尔经营权后，妥善配置它的保留盈余拿去投资，而转型为控股公司，旗下包括物业、意外险、再保险、及特殊类保险。该公司过去多年来以日益雄厚的资本及微乎其微的负债，过去平均每年为股东创造20%以上的价值成长。"
 USA_Nvidia_Corporation_company: "§0英伟达公司§!"
 USA_Nvidia_Corporation_company_desc: "NVIDIA创立于1993年1月，是美国一家以设计和销售图形处理器（GPU）为主的无厂半导体公司，总部设在加利福尼亚州的圣克拉拉，位于硅谷的中心位置。NVIDIA亦会设计游戏机图形处理器，例如第一代Xbox、PlayStation 3及任天堂Switch和任天堂Switch 2。NVIDIA最出名的产品线是为个人与游戏玩家所设计的GeForce系列，为专业CGI工作站而设计的Quadro系列，以及为服务器和高效运算而设计的Tesla系列，虽然起家于PC电脑的显卡业务，英伟达也曾涉及移动芯片Tegra的设计，但智能机市场对此响应不大。"
 USA_Exxon_Mobil_Corporation_company: "§0埃克森美孚公司§!"
 USA_Exxon_Mobil_Corporation_company_desc: "埃克森美孚是一家总部位于美国得克萨斯州斯普林的跨国石油、天然气公司。公司形成于1999年11月30日，由埃克森和美孚合并而成。除去石油、天然气业务外，该公司也涉足化工领域，生产塑料、合成橡胶等。此外，作为石油巨头，它是世界最大的私营石油公司和西方世界最大的石油公司。由于环境污染和否认气候变化，该公司长期遭到批评，阿拉斯加港湾漏油事件即由该公司引发。此外，该公司也被指控侵犯人权、干涉美国政治等。"
 USA_Walmart_company: "§0沃尔玛§!"
 USA_Walmart_company_desc: "沃尔玛公司是美国的跨国零售企业，是世界上最大的零售商和世界上最大的企业公司，沃尔玛的总部设在阿肯色州本顿维尔，其雇佣员工数量超过两百万。沃尔玛是一个家族企业，其控股人为沃尔顿家族，拥有沃尔玛48％的股权。1962年，山姆·沃尔顿创立沃尔玛，1969年10月31日注册成立。1972年在纽约证券交易所公开交易。沃尔玛也是在美国最大的食品零售商。沃尔玛公司有8500家门店，分布于全球15个国家。沃尔玛在美国50个州和波多黎各运营。在墨西哥经营Walmex，在英国经营阿斯达，在日本经营西友百货(包括无印良品)，在非洲多个国家经营Massmart，并与印度巴提企业（Bharti）合资经营“最优惠价现代批发卖场”。全资拥有在阿根廷，巴西和加拿大的业务。沃尔玛在美国以外的投资结果喜忧参半。其在加拿大、英国、中美洲、南美洲和中国的业务和子公司取得了成功，但在德国、日本和韩国的业务却失败了。"
 USA_United_Health_company: "§0联合健康集团§!"
 USA_United_Health_company_desc: "联合健康集团是全球营业额第二大的健康保险及卫生资讯科技公司，总部设在美国明尼苏达州明尼阿波利斯。联合健康集团为各种对象设计全系列的健保计划与服务。联合健康集团为全美九千万人提供服务，约有30万名雇员在全美50个州及130多个国家任职服务。"
 USA_Coke_company: "§0可口可乐公司§!"
 USA_Coke_company_desc: "可口可乐公司，是知名跨国企业，以软性饮料生产、销售和营销闻名，也提供饮料浓缩液、糖浆以及酒精饮料。可口可乐公司最出名的产品是可口可乐饮料，是世界第一个可乐品牌，总部位于美国佐治亚州亚特兰大。1886年，美国药剂师约翰·彭伯顿发明了可口可乐配方。1889年，美国实业家阿萨·坎德勒购入可口可乐配方与品牌，并于1892年正式在美国亚特兰大注册成立可口可乐公司。该公司的股票在纽约证券交易所上市，是道琼斯工业平均指数、标准普尔500指数和标准普尔 100指数的一部分。"
 USA_Tesla_company: "§0特斯拉§!"
 USA_Tesla_company_desc: "特斯拉公司是美国最大的电动汽车及太阳能板公司。"
 USA_PandG_company: "§0宝洁公司§!"
 USA_PandG_company_desc: "宝洁是源自美国的跨国消费日用品公司，也是目前全球最大的日用品生产商之一。总部位于美国俄亥俄州辛辛那提，全球员工近140,000人。主要产品为清洁剂、个人护理用品、宠物食品等。"
 USA_JPMorgan: "§0摩根大通§!"
 USA_JPMorgan_desc: "摩根大通集团是一家总部位于纽约市的美国金融机构。其商业银行部旗下分行5,100家。摩根大通的业务遍及50多个国家，包括投资银行、证券交易及服务、投资管理、商业金融服务、私人银行服务等。"
 USA_CityGroup: "§0花旗集团§!"
 USA_CityGroup_desc: "花旗集团总部位于美国纽约市，为全球性大型的投资银行及金融机构之一，于1998年由花旗公司及旅行家集团合并而成，并于同期换牌上市。因此，公司的历史可以追溯到1812年纽约城市银行（后来的花旗银行）的成立；1870年的Bank Handlowy；1873年的Smith Barney，1884年的Banamex；1910年的Salomon Brothers。"
 USA_Marathon_Petroleum: "§0马拉松石油§!"
 USA_Marathon_Petroleum_desc: "马拉松石油是一家美国石油和天然气勘探生产商。它的主要业务位于美国，挪威，赤道几内亚，安哥拉等地。其总部位于休斯顿。"
 USA_att: "§0美国电话电报公司§!"
 USA_att_desc: "AT&T是美国的一间跨国集团控股公司，是全美最大的固定电话及移动电话电信服务供应商，此外还提供宽带及收费电视服务。合共1.5亿户提供服务，当中8,510万户为无线用户。西南贝尔公司创办于1983年，是根据美国政府与美国电话电报公司的反垄断诉讼的判决，而成立的其中一间独立公司。目前AT&T公司通过购买持有不少因1983年判决而剥离的资产。公司总部位于美国得州的达拉斯市中心。"
 USA_ibm: "§0国际商业机器公司§!"
 USA_ibm_desc: "国际商业机器公司是源自美国的跨国科技公司，被昵称为“蓝色巨人”，是全球最大的技术和业务解决公司，拥有全球雇员31万多人，业务遍及160多个国家和地区。其总部位于纽约州阿蒙克市。IBM主要客户是政府和企业，提供服务及咨询。IBM生产并销售计算机硬件及软件，并且为系统架构和网络托管提供咨询服务。IBM虽然是一家商业公司，但因为过去的发展历史，在材料、物理、化学等科学领域也有很高的成就，并以这些学术研究为基础，发明了很多产品。比较有名的IBM发明的产品包括硬盘、自动柜员机、通用产品代码、SQL、关系数据库管理系统、DRAM及沃森。"
 USA_ge: "§0通用电气§!"
 USA_ge_desc: "通用电气是源自美国的跨国综合企业，经营产业包括电子工业、能源、运输工业、航空航天、医疗与金融服务；总部位于波士顿、公司则在纽约州注册，业务遍及世界100多个国家，拥有员工约28万7千人。"
 USA_Chevron_Corporation: "§0雪佛龙公司§!"
 USA_Chevron_Corporation_desc: "雪佛龙股份有限公司是世界最大的跨国能源公司之一，总部位于美国加州圣拉蒙市并在全球超过180个国家有业务。其业务范围渗透石油及天然气工业的各个方面：探测、生产、提炼、营销、运输、石化、发电等。也制造燃油车。雪佛龙原名加利福尼亚标准石油，是1911年标准石油由于反托拉斯案分裂的结果。雪佛龙是世界六大石油公司之一。"
 USA_Bank_America: "§0美国银行§!"
 USA_Bank_America_desc: "美国银行，以资产计是美国第二大商业银行，仅次于摩根大通。美国银行在全世界150多个国家拥有约5,600家支行，16,200个ATM点。该行的建立可以追溯到1784年的马萨诸塞州银行，是美国第二历史悠久的银行。"
 USA_Home_Depot: "§0家得宝§!"
 USA_Home_Depot_desc: "家得宝是美国一家家庭装饰品与建材的零售商，总部设于佐治亚州亚特兰大都会区维宁斯。家得宝雇用超过355,000名员工，经营2,164家大型五金商场，分店遍及美国（包括50个州份、哥伦比亚特区、波多黎各、维尔京群岛和关岛）、加拿大（10个省份）、墨西哥及中国。"
 USA_Kroger: "§0克罗格§!"
 USA_Kroger_desc: "克罗格公司，是美国的一家零售企业，由Bernard Kroger在1883年创建于俄亥俄州辛辛那提。按收入来看，这家公司是美国最大的超市连锁企业，并且是美国第23大企业。克罗格公司也是世界第三大零售商和美国第三大雇佣主。"
 USA_Comcast: "§0康卡斯特§!"
 USA_Comcast_desc: "康卡斯特是一家位于美国的全球通讯业综合企业集团；通过Xfinity品牌，其收入在全球电信及有线电视市场均位居第一。康卡斯特同时是美国第二大付费电视服务商；第一大有线电视和家庭互联网接入服务商，以及第三大家庭电话服务商。康卡斯特集团在全美40个州和哥伦比亚特区提供商业服务。康卡斯特集团的总部位于美国宾夕法尼亚州的费城。"
 USA_Oracle: "§0甲骨文§!"
 USA_Oracle_desc: "甲骨文公司是一间全球性的大型企业科技软件公司，总部位于美国得克萨斯州奥斯汀。现任董事长兼CTO为公司创办人劳伦斯·埃里森，CEO为凯芝。主要经营企业金融经营数据库建档等服务,例如销售时点情报系统，供应链管理，人力资源绩效分析等。"
 SOV_yukos: "§0尤科斯§!"
 SOV_yukos_desc: "尤科斯是俄罗斯最大且最成功的一家公司，俄罗斯石油产量中有20%是该公司产出的。"
 SOV_sibneft: "§0西伯利亚石油§!"
 SOV_sibneft_desc: ""
 SOV_rusal: "§0俄罗斯铝业§!"
 SOV_rusal_desc: "俄铝是全球第三的铝业公司，也是世界第三的铝和氧化铝生产商，占全球铝及氧化铝产量分别为6%。"
 SOV_sberbank: "§0俄罗斯联邦储蓄银行§!"
 SOV_sberbank_desc: "俄罗斯联邦储蓄银行是一家总部位于俄罗斯联邦首都莫斯科的金融机构。俄罗斯联邦储蓄银行拥有2,500万私人客户、130万商业客户以及大约19000间分支机构，在俄罗斯私人和商业金融领域均处于领先地位，为东欧地区最大的商业银行。俄罗斯联邦储蓄银行为股份制银行，俄罗斯联邦中央银行持有60.25%的股份，其余股份由超过273,000 家的机构投资者和个人持有。"
 SOV_vtb: "§0俄罗斯外贸银行（ВТБ）§!"
 SOV_vtb_desc: "俄罗斯外贸银行是俄罗斯一家具领导性的全球性银行。"
 SOV_gazprom: "§0俄罗斯天然气工业股份公司§!"
 SOV_gazprom_desc: "俄罗斯天然气工业石油公司是俄罗斯最大的石油公司之一。"
 SOV_rosneft: "§0俄罗斯石油公司§!"
 SOV_rosneft_desc: "俄罗斯石油公司是俄罗斯一家综合能源公司，总部位于俄罗斯首都莫斯科，专门从事勘探，开采，生产，提炼，运输，运输。该公司由俄罗斯政府通过Rosneftegaz控股公司控制。"
 SOV_nornickel: "§0诺里尔斯克镍业§!"
 SOV_nornickel_desc: "诺镍是俄罗斯最大的矿业冶金公司，生产主体位于叶尼塞河附近的诺里尔斯克，还拥有科拉半岛的尼克尔、扎波利亚尔内、蒙切戈尔斯克、芬兰西部的哈尔亚瓦尔塔、南非与博茨瓦纳以及西澳大利亚的有色金属矿山。是世界上最大的镍与钯生产商，世界十大铜生产商之一。世界镍产量的约18%，铜产量的约2.5%，钯产量的近50%以及铂产量的约13%。"
 SOV_lukoil: "§0卢克石油§!"
 SOV_lukoil_desc: "卢克石油为俄罗斯跨国能源企业，总部位于莫斯科，主要负责石油和天然气的提炼、石油产品的制造。1991年11月25日，三间位于西伯利亚西部－兰格帕斯、乌拉伊和科加林的国营能源企业合并，并改名卢克石油（LukOil），其中LUK分别代表该三间企业的所在地。卢克石油是俄罗斯第二大公司，仅次于俄罗斯天然气工业股份公司，同时是国际上其中一间最大的原油生产国际企业。"
 POL_Orlen: "§0奥伦石油§!"
 POL_Orlen_desc: "波兰国营石油公司是波兰著名的国家控股综合能源集团，主要提供石油天然气的探测、开采、销售、运输等服务，除此之外，波兰国营石油公司在海洋钻井、油藏管理和开发、高等级石油焦炭改进技术等领域具有崇高声誉，下游方面，波兰国营石油公司在全球拥有多家加油站和著名的润滑油品牌。"
 JAP_suzuki_companies: "§0铃木§!"
 JAP_suzuki_companies_desc: "铃木公司乃是总部设在日本静冈县滨松市的汽车、机车制造商。"
 JAP_toyota_companies: "§0丰田§!"
 JAP_toyota_companies_desc: "丰田汽车公司是日本的跨国汽车公司，丰田亦是雷克萨斯、大发、日野、世纪品牌的母公司，并以20%股份成为斯巴鲁的最大股东。"
 SPR_Inditex_company: "§0印地纺集团§!"
 SPR_Inditex_company_desc: "盈迪德集团是一家大型西班牙企业，也是世界上第二大的时装集团。旗下拥有超过百家的企业，主要经营纺织品的设计、生产与销售相关活动。"
 SPR_Telefonica_company: "§0西班牙电信§!"
 SPR_Telefonica_company_desc: "西班牙电信股份公司是西班牙的一家电信公司。这是全球第五大的固网和移动通讯运营商，主要提供欧洲及拉丁美洲地区固话及行动通讯服务，项目包含行动语音、加值型服务、行动数据及网络、漫游、固定式无线服务、中继、传呼业务等，客户总数在全球排名第五。"
 SPR_Banco_Santander_company: "§0桑坦德银行§!"
 SPR_Banco_Santander_company_desc: "桑坦德银行创立于1857年，总部设在西班牙桑坦德的银行。桑坦德银行拥有员工近20万。"
 SPR_ACS_company: "§0ACS建筑集团§!"
 SPR_ACS_company_desc: "ACS集团是一家西班牙跨国公司，主要经营建筑相关业务，也涉足电信业。1997年由OCP Construcciones, S.A.和Ginés Navarro Construcciones, S.A.两公司合并而成。总部位于马德里。"
 SPR_Iberdrola_company: "§0伊维尔德罗拉电力公司§!"
 SPR_Iberdrola_company_desc: "伊比德罗拉是一家西班牙私营跨国电气公司，总部位于毕尔巴鄂。子公司包括苏格兰电力、伊比德罗拉美国和巴西的Elektro等。"
 SPR_Repsol_company: "§0雷普索尔石油公司§!"
 SPR_Repsol_company_desc: "雷普索尔公司是一家总部位于马德里的西班牙跨国能源和石化公司，主要业务位于西班牙和阿根廷。"
 KOR_KIA_company: "§0起亚汽车§!"
 KOR_KIA_company_desc: "起亚株式会社是韩国第二大汽车制造商，财富世界500强企业之一，总部位于韩国首尔，为现代汽车集团成员之一。"
 KOR_LG_company: "§0LG集团§!"
 KOR_LG_company_desc: "LG集团是总部位于韩国首尔的大型跨国企业集团，主要经营范围包括电子与通信技术、家电和化学三大领域，旗下拥有81家集团企业，130家海外当地法人，员工213000人。LG集团成立于1947年1月5日，最初的名称是“乐喜化学工业社”（现LG化学）。1958年10月1日，LG成立“金星社”（现LG电子），之后被称为“乐喜集团”。1982年1月1日，“乐喜集团”改名为“乐喜金星集团”，以涵括其不断成长扩大的电子电器部门。1995年1月，LG集团正式采用目前“LG”这个名称。LG这两个字母是“乐喜金星集团”英文名称“Lucky Goldstar Group”中“Lucky”和“Goldstar”的首字母。LG集团是韩国企业发展史中诸多“第一”的创作者，包括：创立韩国首家化学工业社“乐喜化学工业社”，并推出首个化妆品品牌“乐喜雪花膏”；最早进入塑料产业领域；创立韩国首家电子工业社“金星社”；生产出韩国的首部收音机、电冰箱、电视机、洗衣机等家电产品；最早面向社会招聘优秀大学毕业生；在韩国财阀中最早实行企业公开；在韩国财阀中最早使用英文名字；最早采用控股公司体制等。"
 KOR_Samsung_company: "§0三星集团§!"
 KOR_Samsung_company_desc: "三星集团是一家总部设于韩国首尔的跨国综合企业，经营领域涵盖电子、金融业、保险、生物制药、建设、化工业、医疗等等广泛领域。其旗下子公司包含三星电子、三星显示、三星电机、三星物产、三星重工、三星生命等子公司，其中至少超过3家子公司为美国《财富》杂志评选为世界500强企业之列。"
 KOR_SK_company: "§0SK集团§!"
 KOR_SK_company_desc: "SK集团是韩国第三大财阀，总部位于首尔，旗下拥有186家子公司和关联企业，全球雇员人数超过十一万。SK的主营业务是在能源和石油化工领域，子公司SK能源是韩国最大的综合能源化工企业。其蔚山炼厂拥有每年4200万吨原油加工能力，多年来保持全世界同行业单厂炼油规模最大的地位。SK同时也经营电子通讯，子公司SK电讯是韩国最大的移动通信运营商，在韩国的市场占有率达到50%以上，也是全球十大蜂窝移动通信运营商之一。子公司SK海力士是SK集团涉足半导体行业的主力，海力士在DRAM市场的占有率于全球仅次于三星电子。"
 KOR_Hyundai_company: "§0现代汽车集团§!"
 KOR_Hyundai_company_desc: "现代汽车集团，韩国财阀，是世界最大的汽车生产商之一，总部位于韩国首尔。和不少韩国财阀一样，现代汽车集团并不是一家以控股公司作垂直控制的企业，而是以复杂的股权结构（例如交叉持股）连结旗下不同的附属公司而形成的大型综合企业，实务上以现代汽车作为代表整个集团的公司。"
 KOR_Lotte_company: "§0乐天集团§!"
 KOR_Lotte_company_desc: "乐天集团是韩国的大型国际企业集团，总部位于韩国首尔，业务范围涵盖食品、百货、娱乐、建筑和化工等各种领域，并且是世界财富前500大集团和韩国十大财阀。乐天集团在1948年由韩国的创办人辛格浩创立。乐天集团最初是食品制造商，后在韩国发展，在韩国开设有酒店和百货公司。乐天集团拥有韩国职棒乐天巨人（Lotte Giants）和日职千叶罗德海洋（Chiba Lotte Marines）两支职业棒球队。"
 KOR_Doosan_company: "§0斗山集团§!"
 KOR_Doosan_company_desc: "斗山集团是一家韩国集团公司，总部位于首尔，财富世界500强之一。斗山集团的历史可以追溯到1896年8月1日斗山创始人朴承稷成立的“朴承稷商店”，距今已有120余年的历史，是唯一至今仍在经营的朝鲜王朝末期出现的近代企业，也是韩国最早实现三代继承的家族企业。1995年，斗山集团被韩国金氏纪录协会认证为韩国最古老企业。"
 KOR_Hanjin_company: "§0韩进运输§!"
 KOR_Hanjin_company_desc: "韩进集团是家国际物流运输集团公司，总部位于首尔。韩进集团创立于1945年，曾是韩国最大的海运物流运输公司之一，也是财富世界500强企业之一。韩进集团曾拥有遍布世界各大主要港口的货柜船队，后海运事业破产，现仍拥有空中航线和物流网络。韩进集团旗下的韩进海运曾是全球第7大海运集团。1969年收购的大韩航空是韩国最大的航空公司。"
 KOR_posco_company: "§0浦项制铁§!"
 KOR_posco_company_desc: "浦项钢铁是世界上最大的钢铁制造商之一，财富世界500强企业，总部设于韩国庆尚北道浦项市南区。"
 ITA_Enel_company: "§0意大利国家电力公司§!"
 ITA_Enel_company_desc: "意大利国家电力公司是总部位于意大利罗马的一家能源公司，主营发电、送电及天然气配送。该公司在1962年建立时原是公共机构，1992年改组成公司，1999年随着意大利电力市场的开放而私有化，但意大利经济财政部仍是该公司的主要股东。"
 ITA_Intesa_Sanpaolo_company: "§0意大利联合圣保罗银行§!"
 ITA_Intesa_Sanpaolo_company_desc: "意大利联合圣保罗银行是一个在2007年1月2日由意大利联合商业银行和意大利圣保罗银行合并成立的新银行集团。银行集团总部设立在都灵，在米兰也设有次级银行总部。 在2006年8月，意大利联合商业银行和意大利圣保罗银行共同声明了合并事宜，并在同年12月执行。新的意大利联合圣保罗银行集团是意大利第二大银行，欧元区第三大银行，拥有688亿欧元的资产。"
 ITA_Eni_company: "§0埃尼集团§!"
 ITA_Eni_company_desc: "埃尼，全称为国家碳化氢公司，是意大利政府成立的国家控股公司，专门经营石油产品，是世界第七大石油集团公司之一，也是在世界大炼油公司中排第8位。"
 ITA_UniCredit_company: "§0裕信银行§!"
 ITA_UniCredit_company_desc: "裕信银行是一家总部设在米兰的银行，业务遍及19个国家，有超过2800万用户，为欧洲最大的银行集团之一。裕信银行的核心业务主要分布于意大利、奥地利和德国南部等较富裕地区，此外在中欧和东欧也有着大量的业务。按照资产总额算，拥有9100亿欧元资产的裕信银行已经成为了欧元区第一大，欧洲第三大和世界第六大的银行集团。裕信集团在法兰克福和慕尼黑有着大量的投资银行业务。"
 HUN_mol_group: "§0MOL集团§!"
 HUN_mol_group_desc: "MOL Plc.是一家总部位于匈牙利布达佩斯的匈牙利跨国石油天然气公司。MOL集团的成员包括克罗地亚和斯洛伐克的前国有石油天然气公司INA和Slovnaft等。"
 POR_edp_company: "§0EDP§!"
 POR_edp_company_desc: "EDP是一家葡萄牙电力公司，总部位于里斯本，成立于1976年，由14家国有电力公司合并而成。"
 POR_jm_company: "§0Jerónimo Martins§!"
 POR_jm_company_desc: "Jerónimo Martins SGPS, SA (JM) 是一家葡萄牙企业集团，主要从事食品分销和专业零售业务。该公司在葡萄牙、波兰、斯洛伐克和哥伦比亚经营着 6,500 多家门店。"