l_simp_chinese:
 MD_admin_spirit_CHI:0 "中国党政官僚体制"
 MD_admin_spirit_CHI_desc:0 "§g中国是党政一体的单一制国家，中央通过省、市、县、乡四级政权与党组链条向下施政，地方在土地与财政上握有实际裁量权。编制由中央逐级核定，层级坚固而难以压缩，改革多靠机构改名与人员转岗。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_chi_banner"
 MD_admin_spirit_SOV:0 "俄罗斯垂直权力体系"
 MD_admin_spirit_SOV_desc:0 "§g俄罗斯以强总统制统合联邦与部委：联邦区与州长任命把地方纳入中央考核，部委垂直管理覆盖安全、能源与财政。国家公务员与国有部门构成庞大既得结构，精简往往止于改名保留员额。制度惯性因而难以打破。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sov_banner"
 MD_admin_spirit_USA:0 "美国联邦文官体制"
 MD_admin_spirit_USA_desc:0 "§g美国是联邦总统制共和国，联邦权力限于宪法列举事项，其余保留给各州；文官依功绩制录用，政治任命与职业官僚并存。拨款法案只管给钱，设不设机构须国会立法，行政层级因此难以撼动。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_usa_banner"
 MD_admin_spirit_ENG:0 "英国西敏文官体制"
 MD_admin_spirit_ENG_desc:0 "§g英国是威西敏斯特式单一制国家，中央以财政部与内阁办公室统辖各部，苏格兰、威尔士与北爱另享权力下放。常任文官依考试录用、政治中立，裁撤先触动外包合同，而非核心员额。财政上地方高度依赖中央拨款。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_eng_banner"
 MD_admin_spirit_KOR:0 "韩国考试官僚体制"
 MD_admin_spirit_KOR_desc:0 "§g韩国是单一制共和国，道、市郡、邑面洞层层下设，中央以人事与财政转移掌握主导，地方自治仅在世宗、济州等地有限突破。高级公务员团把晋升与政治任命绑定，编制调整须经国会与舆论。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_kor_banner"
 MD_admin_spirit_BRA:0 "巴西联邦寡头体制"
 MD_admin_spirit_BRA_desc:0 "§g巴西是联邦共和国，二十六个州、联邦区与数千市镇同为联邦主体，1988 年宪法把税收与支出责任大量下放。联邦公务员与州级人事各成体系，财政责任法为债务与人事支出设下硬约束。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_bra_banner"
 MD_admin_spirit_PER:0 "伊朗教权行政体制"
 MD_admin_spirit_PER_desc:0 "§g伊朗是伊斯兰共和制国家，省、县、区、乡层层下设，省长由内政部派任，民选地方议会权限有限。革命卫队、宗教基金会与准国家机构占用大量资源，预算只能分配石油收入的年度份额。行政效率因此受限。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_per_banner"
 MD_admin_spirit_AST:0 "澳大利亚联邦文官制"
 MD_admin_spirit_AST_desc:0 "§g澳大利亚是联邦制国家，联邦权力限于宪法列举事项，州保留其余职权，地方政府由州法设立。联邦征主要税种，经拨款委员会横向均衡分给各州；公务员各州自成体系，跨级调动并不容易。地方自治空间有限。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ast_banner"
 MD_admin_spirit_VIE:0 "越南党国行政体制"
 MD_admin_spirit_VIE_desc:0 "§g越南是党国并行的单一制国家，省、县、社三级下设，人民议会与人民委员会并存，党的组织链条贯通基层。编制由中央核定，地方支出依赖转移支付与土地收入，人事与党务决定谁负责。行政效率受制于双轨并行。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_vie_banner"
 MD_admin_spirit_SWE:0 "瑞典分权福利行政"
 MD_admin_spirit_SWE_desc:0 "§g瑞典是单一制国家，却有宪法保障的地方自治，二百九十市镇与二十一个省议会独立征税，承担教育与医疗。中央各部规模精简，执行交给独立机构，裁员须经集体谈判与法律程序。地方税是公共服务的主要财源。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swe_banner"
 MD_admin_spirit_HOL:0 "荷兰协商自治体制"
 MD_admin_spirit_HOL_desc:0 "§g荷兰是分权化的单一制国家，十二省、数百市镇与水务会并存，市镇在空间规划与社会福利上自治权广泛。中央小部委、大执行机构，地方财政依赖市镇基金按公式分配。任何改革都须经多党妥协方能推进。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_hol_banner"
 MD_admin_spirit_GER:0 "德国行政联邦主义"
 MD_admin_spirit_GER_desc:0 "§g德国是联邦制国家，基本法把执行权交给各州，联邦只保留外交、国防、货币与框架立法。联邦与州公务员分属两套终身序列，共享税与横向财政平衡决定谁有钱、谁执行。行政联邦主义使中央难以直接指挥地方。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ger_banner"
 MD_admin_spirit_POL:0 "波兰地方自治体制"
 MD_admin_spirit_POL_desc:0 "§g波兰是单一制国家，十六省、数百县与上千乡各有民选议会，省督由中央任命并监督地方。1990 年代转轨留下的公务员队伍庞大，地方财政依赖均衡拨款与共享税。省督与民选议会的权责划分长期模糊。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pol_banner"
 MD_admin_spirit_JAP:0 "日本霞关官僚体制"
 MD_admin_spirit_JAP_desc:0 "§g日本是单一制国家，中央省厅集中于霞关统筹政务，都道府县兼具中央派驻与地方自治双重身份，市町村承担基层事务。国家与地方公务员分属两套序列，年功序列使编制只能缓慢收缩。中央对地方的控制因此稳固。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_jap_banner"
 MD_admin_spirit_FRA:0 "法国省长集权体制"
 MD_admin_spirit_FRA_desc:0 "§g法国是中央集权的单一制国家，省长代表国家统辖省内事务，部委按纵向职能分工。1982 年分权法把大区、省与市镇权限重划，但国家派驻机关与地方自治体长期并存，权责交叠。中央与地方的权责长期紧张。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_fra_banner"
 MD_admin_spirit_ITA:0 "意大利大区自治体制"
 MD_admin_spirit_ITA_desc:0 "§g意大利是单一制共和国，沿袭撒丁王国省制，2001 年宪法改革把立法权下放给大区，卫生、交通与职教随之外移。财政与人事仍多由罗马掌握，责任分散、条块交叉，改革多停留于文件。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ita_banner"
 MD_admin_spirit_RAJ:0 "印度殖民文官体制"
 MD_admin_spirit_RAJ_desc:0 "§g印度是联邦制共和国，中央与各邦划分职权，全印行政官由中央招考后派往各邦，构成人在中央、岗在地方的纽带。职数受种姓与地区保留政策约束，扩编与收缩都牵动政治平衡。扩编长期用于吸纳就业。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_raj_banner"
 MD_admin_spirit_TUR:0 "土耳其总统集权体制"
 MD_admin_spirit_TUR_desc:0 "§g土耳其是单一制共和国，省长由内政部任命并对中央负责，市镇依市政法运作。2017 年公投改行总统制后，行政中枢向总统府集中，第 657 号公务员法使编制对财政并不敏感。行政效率让位于政治忠诚。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tur_banner"
 MD_admin_spirit_ISR:0 "以色列基本法行政"
 MD_admin_spirit_ISR_desc:0 "§g以色列未制定成文宪法，以一系基本法界定国家机构，中央各部对地方事务保留广泛裁量。地方自治体有选举，财源却依赖中央平衡拨款；集体协议与终身雇用使编制易扩难缩。预算编制由财政部集中把关。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_isr_banner"
 MD_admin_spirit_CAN:0 "加拿大省权联邦体制"
 MD_admin_spirit_CAN_desc:0 "§g加拿大是联邦制国家，1867 年宪法把教育、卫生与社会服务交给各省，市镇在法律上是省的造物。联邦以附带条件的转移支付引导地方，各省人事法规各异，编制调整须经委员会规则。联邦协调因此依赖谈判。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_can_banner"
 MD_admin_spirit_PAK:0 "巴基斯坦联邦秘书处"
 MD_admin_spirit_PAK_desc:0 "§g巴基斯坦是联邦制共和国，联邦秘书处与各省首席秘书构成双轨，区级长官延续殖民时期的统合职能。2010 年第十八修正案把教育、卫生下放各省，职数分配受地区平衡与保留名额约束。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_pak_banner"
 MD_admin_spirit_NKO:0 "朝鲜党国计划体制"
 MD_admin_spirit_NKO_desc:0 "§g朝鲜以党国一体原则组织行政：内阁统辖各省与道、市、郡人民委员会，计划委员会按年度与五年计划下达指标。财政统收统支，地方几无独立税源，干部由党组织部门统一管理。行政效率让位于动员优先。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nko_banner"
 MD_admin_spirit_UKR:0 "乌克兰总统行政体制"
 MD_admin_spirit_UKR_desc:0 "§g乌克兰脱胎于苏联加盟共和国建制，州、区与市镇构成三级，州长由总统任命，市镇依欧洲地方自治宪章运作。2014 年后分权改革下放财权，战争动员与寡头影响使编制长期不稳。中央与地方的权限仍在拉锯。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ukr_banner"
 MD_admin_spirit_SAU:0 "沙特王室总督体制"
 MD_admin_spirit_SAU_desc:0 "§g沙特阿拉伯是绝对君主制王国，省由王室任命的总督治理，省下分区与县，行政与部落、宗教权威交织。石油收入经五年计划转化为行政能力，机构增设与缩减均须王室敕令批准。行政效率取决于王室意志。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_sau_banner"
 MD_admin_spirit_SWI:0 "瑞士联邦委员会体制"
 MD_admin_spirit_SWI_desc:0 "§g瑞士是联邦制国家，联邦仅承担宪法列举职权，二十六个州保留广泛主权，市镇依州法自治。行政人员多行民兵制与兼职制，任何扩编都可能交付公投，各州须经议会与选民同意。联邦与州之间靠协商而非命令运作。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_swi_banner"
 MD_admin_spirit_SPR:0 "西班牙自治国家体制"
 MD_admin_spirit_SPR_desc:0 "§g西班牙是自治国家，十七个自治共同体与省、市镇并存，中央保留国防、外交与宏观协调。权限冲突由宪法法院裁决，巴斯克与纳瓦拉依历史权利享有特殊财政安排，协商贯穿始终。自治章程的修订须经政治交易。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_spr_banner"
 MD_admin_spirit_EGY:0 "埃及中央集权体制"
 MD_admin_spirit_EGY_desc:0 "§g埃及是高度中央集权的单一制国家，省长由总统任命，省下为区与村，地方委员会仅有有限选举地位。军队经营的经济体深入基础设施与民生供给，编制扩张长期用于吸纳就业。行政效率常让位于社会稳定。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_egy_banner"
 MD_admin_spirit_MEX:0 "墨西哥联邦州宪体制"
 MD_admin_spirit_MEX_desc:0 "§g墨西哥是联邦共和国，三十一州与墨西哥城各有宪法与议会，市镇为基层自治单位，联邦掌管主要财源。2000 年民主化后联邦公务员制逐步建立，州与市仍各行其是，人事双轨并行。转移支付是联邦杠杆。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_mex_banner"
 MD_admin_spirit_NRY:0 "挪威市镇自治体制"
 MD_admin_spirit_NRY_desc:0 "§g挪威是单一制国家，郡为中央在地方的行政层级，市镇依《地方自治法》执行教育、卫生与福利。石油收入经主权基金与财政规则隔离于年度预算，行政开支稳定而扩张冲动受抑。市镇合并须经居民同意。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_nry_banner"
 MD_admin_spirit_TAI:0 "台湾五院铨叙体制"
 MD_admin_spirit_TAI_desc:0 "§g台湾依中华民国宪政框架分设行政、立法、司法、考试、监察五院，考试院掌文官考选与铨叙，文官资格须经考试取得。省制虚级化后中央与地方直接对接，财政依赖统筹分配税款。中央与地方以补助协商分工。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_tai_banner"
 MD_admin_spirit_IND:0 "印尼地方自治体制"
 MD_admin_spirit_IND_desc:0 "§g印度尼西亚是单一制国家，省、县市、区与村层层相接，省长兼具中央代表与自治首脑双重身份。1999 年自治法令把职能与财源下放县市，村依《村法》获得独立预算地位。地方扩编长期用于吸纳就业。§!\n\n\n\n\n£GFX_ZZZ_admin_spirit_ind_banner"
