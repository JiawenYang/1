l_simp_chinese:
 MAPMODE_ECONOMY_ALLIANCE_MAP_MODE_DESCRIPTION: "按经济联盟为世界上色：显示各国所属的关税同盟与共同市场。"
 military_alliance_intro: "§Y军事同盟§!\n\n£GFX_military_alliance_intro_embed \n\n§g引言行：同盟从来不是免费的盾牌，而是一份要持续付费、并且随时可能被打折的保单。§!\n\n军事同盟是冷战留给这个世界的制度遗产。北约把第五条的集体防御写成义务，用北美的核保护伞换取欧洲的常规兵力；集体安全条约组织不谈共同价值观，只把俄罗斯的军事优势翻译成后苏联空间的组织能力。两套体系都不是为打仗而生，而是为不打仗而生——它们真正的产品是威慑，是让对手在动手之前先算一遍账。\n\n同盟能不能运转，先看指挥权怎么排、钱怎么分。北约的指挥体系由美国主导，欧洲出兵力、出基地、出预算，美国出核保护伞与战略投送；军费分摊的争吵年年都有，但真正的问题不是谁少付了几个百分点，而是谁愿意在和平年代为一场可能不来的战争持续买单。\n\n基地准入是同盟的骨架。驻军、港口、机场、飞越权，平时只是地图上的几个点，危机时就是能不能把兵力送到前线的全部答案。美国用驻军换配合，俄罗斯用驻军换忠诚，小国用一部分主权换一张保单——每一笔都是明码标价的交换，只是价格未必写在条约里。\n\n承诺可信度靠两样东西撑着：能力与意愿。能力看得见，意愿看不见。盟国国内政治一转向，承诺就会缩水；条约文本不会变，执行条约的人会变。真正的威慑不在于纸上写了什么，而在于对手相信关键时刻有人真的会来。\n\n边缘地带最能看出同盟的成色。核心成员拿到的是核保护伞与快速反应，外围成员拿到的是军售、演习与声明。同盟从来不是平等的俱乐部，而是一张按战略价值排序的名单，排名会在每一次危机里被重新抄写。\n\n危机是同盟的验货时刻。威胁认知对不上、军费谈不拢、成员国的选举换了人，都会让承诺在最后一刻打折。历史上反复出现的情形是：条约生效了，援军没来；或者援军来了，来得太晚。\n\n地图上的颜色按条约涂，现实中的安全按意愿兑现——两者之间隔着一张没人愿意提前支付的账单。"
 economy_alliance_intro: "§Y经济同盟§!\n\n£GFX_economy_alliance_intro_embed \n\n§g引言行：经济同盟卖的不是市场，而是规则；规则的价格，从来不在关税表上。§!\n\n经济同盟没有统一模板。欧盟走超国家路线，用单一市场、共同货币与统一监管把成员国缝成一个整体；东盟走政府间路线，靠协商一致与不干涉维持十国共同体；海合会把石油收入变成跨境的资本与劳工；西非经共体把关税同盟和维和干预捆在一起；南方共同市场则长期停在关税同盟的门槛上。模式不同，起点不同，天花板也不同。\n\n关税只是入场券。真正决定同盟成色的是关税背后的四件事：标准、货币、劳动力与资本。标准决定谁能卖进来，货币决定谁承担汇率风险，劳动力流动决定谁去哪里工作，资本流动决定谁能在哪里建厂。走完这四步，才算从贸易协定变成经济共同体。\n\n标准是最不显眼、也最有效的权力。谁能写规则，谁就能决定别人的产品长什么样。欧盟靠监管标准把影响力伸到成员国之外，美国靠技术标准与出口管制把供应链切开，中国则用基础设施与产能标准在发展中世界铺自己的轨道。\n\n货币是同盟的第二次主权让渡。共同货币消除了汇率摩擦，也意味着成员国交出独立的货币政策；共同债务能分摊危机成本，也意味着财政纪律被写进别人的账本。资本自由流动带来投资，也带来随时可以撤走的恐慌。\n\n劳动力流动是最容易被忽略的一环。人员自由流动能补上劳动力缺口，也会在成员国之间制造工资与福利的竞争；经济下行时，外来劳工往往第一个被政治拿来做解释。\n\n经济同盟的脆弱点在于：它要求成员国在繁荣时分担收益，在危机时分担成本，而这两件事的政治难度完全不同。宏观波动、产业竞争力差距、政治钟摆的转向，任何一条都足以让一体化停在半路，甚至倒退。\n\n地图上的颜色标的是归属，归属能不能变成繁荣，取决于成员国是否愿意在危机里继续共同付账。"
 org_eu_intro: "§Y欧洲联盟§!\n£GFX_power_eu_embed \n§g图注：斯特拉斯堡的欧洲议会。§!\n欧盟以单一市场、共同货币与统一监管把成员国缝在一起。它是当今一体化程度最高的区域集团，也是把经济实力转化为外交与防务能力最成功的一次尝试。"
 org_sco_intro: "§Y上海合作组织§!\n£GFX_org_sco_embed \n§g图注：中亚的通道与能源走廊。§!\n上合以安全协作与互联互通为纽带，把中亚、南亚与欧亚腹地连接起来。它不设集体防御条款，更像一个由中俄共同支撑的区域协调平台。"
 org_pec_intro: "§Y太平洋经济共同体§!\n£GFX_org_pec_embed \n§g图注：东京主导的亚太经济网络。§!\n该共同体以贸易规则、投资与供应链为工具，把东亚与太平洋沿岸经济体编入同一网络。它是日本把经济实力转化为区域秩序的主要抓手。"
 org_asean_intro: "§Y东南亚国家联盟§!\n£GFX_org_asean_embed \n§g图注：雅加达——东盟秘书处所在地。§!\n东盟以协商一致和不干涉内政为原则，把十个经济体维系在一个松散共同体中。它不追求超国家权力，靠对话机制与市场开放维持区域稳定。"
 org_gcc_intro: "§Y海湾合作委员会§!\n£GFX_org_gcc_embed \n§g图注：海湾产油国的集体安全与经济圈。§!\n海合会把海湾君主国的石油收入转化为跨境的资本、劳工与安全合作。它既是关税同盟，也是面对地区冲突时的政治协调机制。"
 org_ecowas_intro: "§Y西非国家经济共同体§!\n£GFX_org_ecowas_embed \n§g图注：西非的区域一体化与维和行动。§!\n西共体以关税同盟、人员流动与维和干预为支柱，试图在贫困与政变频发的西非建立秩序。它的经济整合有限，但安全干预能力在非洲区域组织中少见。"
 org_mercosur_intro: "§Y南方共同市场§!\n£GFX_org_mercosur_embed \n§g图注：南美的关税同盟与共同市场。§!\n南共市以关税同盟与共同市场把南美南部经济体连在一起。它长期受成员国宏观波动与政治转向所困，是发展中世界区域整合的典型样本。"
 org_au_intro: "§Y非洲联盟§!\n£GFX_org_au_embed \n§g图注：亚的斯亚贝巴——非盟总部。§!\n非盟以大陆团结与冲突调解为旗帜，把五十余个非洲国家纳入同一政治框架。它的经济整合有限，却在维和与危机斡旋上拥有独特的话语权。"
