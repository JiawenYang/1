 dsw_fra.2017.t:0 "2017年法国总统选举"
 dsw_fra.2017.d:0 "埃马纽埃尔·马克龙赢得总统选举，共和国前进接掌法国政府。"
 dsw_fra.1.t:0 "法国迈入2020年"
 dsw_fra.1.d:0 "马克龙政府进入新的十年。疫情、黄背心运动与军政关系将考验第五共和国，法国此后的国策与事件进入烈焰升腾路线。"
 dsw_fra.1.a:0 "开启新的十年。"
 dsw_fra.2.t:0 "2022年选举测试入口"
 dsw_fra.2.d:0 "进入TFR原有的选举路线选择事件，自动完成对应的选前国策，然后测试选举结果与后续转线。建议每条路线使用独立的测试存档。"
 dsw_fra.2.a:0 "进入原版路线选择。"
 dsw_fra.10.t:0 "第一次欧陆战争：预留结果接口"
 dsw_fra.10.d:0 "战争爆发、作战和国际和约尚未接入。这里仅调用TFR法国战胜或战败后的原有事件，供测试后续政治转线。建议在2022年选举完成后使用，并为不同结果保留独立存档。"
 dsw_fra.10.a:0 "测试法国战胜后的国策。"
 dsw_fra.10.b:0 "测试法国战败后的国策。"
 dsw_fra.ok:0 "确认。"
 dsw_fra.cancel:0 "暂不测试。"
