 DSW_FRA_external_content_pending_tt:0 "这部分依赖尚未移植的外国剧情，已保留接口标记，等待后续接入。"
 DSW_FRA_european_war_pending_tt:0 "第一次欧陆战争已预留接口，战争触发暂未接入。"
