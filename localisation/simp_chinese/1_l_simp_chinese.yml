 PRC_the_separatist_problem_desc: "§Y西藏§!:[ROOT.get_xizang_status]\n§Y新疆§!:[ROOT.get_xinjiang_status]\n§Y香港§!:[ROOT.get_hongkong_status]\n§Y澳门§!:[ROOT.get_macau_status]\n§Y蒙古§!:[ROOT.get_mongolia_status]\n§Y钓鱼岛§!:[ROOT.get_diaoyu_status]\n§Y南海诸岛§!:[ROOT.get_nanhai_status]\n§Y台湾§!:[ROOT.get_taiwan_status]\n§Y藏南地区§!:[ROOT.get_zangnan_status]\n\n中国的分离主义已经成为一个常年困扰着中央政府的顽疾。不仅是新疆的维吾尔人和西藏的喇嘛们在闹独立，更有香港这个不安分的特别行政区和台湾这个“叛乱岛屿”在制造麻烦。\n\n中国政府曾经尝试各种不同的办法，从怀柔政策到严厉镇压，来处理分裂分子，但都先后以失败告终。除此之外，来自外国的干涉也使得不同地区的分离主义问题日益复杂化。"
