 CHI_the_Middle_East: "中东"
 CHI_the_Middle_East_desc: "中东地区是亚洲最重要的地区之一。第二次世界大战结束后，此地由于情况复杂，又发掘出丰富的石油资源，一度沦为超级帝国的博弈棋盘，冲突频发，中东人民生活在水深火热之中。作为负责任的大国，我们有义务维持中东地区的稳定和均势，同时扩大我们的影响力。"
 CHI_Scholars_on_the_Silk_Road: "丝路学者"
 CHI_Scholars_on_the_Silk_Road_desc: "伊朗是著名的文明古国之一。勤劳、勇敢的古代波斯人民创造了辉煌灿烂的文化，特别是在医学、天文学、数学、农业、建筑、音乐、哲学、历史、文学、艺术和工艺方面都取得了巨大成就。我们两国应珍惜历史上的情谊，深化在当代的合作。"
 CHI_Invite_to_join_the_SCO: "邀请伊朗加入上海合作组织"
 CHI_Invite_to_join_the_SCO_desc: "伊朗的地缘诉求与我们不谋而合，上合组织建立的宗旨就是维持地区稳定和促进成员国发展。我们应当邀请这位中东的兄弟加入上合组织，进一步深化和协调我们的合作关系。"
 CHI_Development_Assistance_PER: "伊朗发展援助"
 CHI_Development_Assistance_PER_desc: "伊朗对待国际援助态度谨慎，受美国制裁和西方长期外交孤立影响，较少接受国际组织、国际金融机构和其他国家援助，即使有也是冠之以国际合作名义开展，多为人道主义非制裁领域，援助形式以物资为主，而且规模不大。我们将以签署商业订单的形式帮助伊朗建设经济。"
 CHI_Strategic_partners_PER: "战略合作伙伴"
 CHI_Strategic_partners_PER_desc: "中国人民当然与伊朗人民的利益诉求并行不悖。中伊两国的合作关系应该进一步深化，促成一个深度的战略合作伙伴关系。"
 CHI_Oil_Kingdom: "石油王国"
 CHI_Oil_Kingdom_desc: "沙特阿拉伯是世界上石油储量最大的国家之一。与这个皇室至高无上的石油王国构建友好的对话平台有助于强化我们在中东地区的影响力。"
 CHI_order_for_goods_of_SINOPEC: "中国石化的订单"
 CHI_order_for_goods_of_SINOPEC_desc: "中国每年需要进口大量石油，沙特阿拉伯是中国最大的石油进口国之一。我们可以通过签署国企中国石化的石油订单来深化我们与沙特阿拉伯的经济交流，同时协助沙特阿拉伯的石油开采。当然，这笔钱实际上是由政府出。"
 CHI_Silk_Road_tycoon: "丝路大亨"
 CHI_Silk_Road_tycoon_desc: "一带一路当然不能少了沙特阿拉伯这位财主。虽然沙特阿拉伯并不是贫穷落后的国家，然而其国内消费品和工业品每年都要大量进口，我们可以通过一带一路策略来提供足够实惠的卖家。"
 CHI_Selling_Arms_SAU: "出售军火"
 CHI_Selling_Arms_SAU_desc: "中国与沙特阿拉伯的军火交易有历史成绩，沙特阿拉伯需要足够多的精良武器保护自己。我们制造的武器物美价廉，沙特阿拉伯的王族们十分青睐于采购我们的军火。我们可以通过向沙特出售军火来加深双方的交流，并刺激国内军工行业的发展。"
 CHI_cradle_of_civilization: "文明摇篮"
 CHI_cradle_of_civilization_desc: "伊拉克有悠久的历史，两河流域是世界古代文明的发祥地之一。这个文明古国如今饱受摧残，美帝国主义的走狗军队借反恐战争之名在伊拉克犯下的罪行罄竹难书。我们应该和这个饱受磨难的国家建立友好合作关系，这是两国人民共同的心愿和诉求。"
 CH_Icultural_exchange_IRQ: "文化交流"
 CH_Icultural_exchange_IRQ_desc: "中国和伊拉克同为四大文明古国之一，有历史上的共识。我们将从对两国灿烂的古代文化成就和友好交往历史入手，升温两国政府的交流。"
 CH_Oil_orders: "石油订单"
 CH_Oil_orders_desc: "伊拉克是中国第三大原油进口来源国，中国是伊拉克最大贸易伙伴。采购更多的石油对加深两国合作并扩大中国对伊拉克的经济影响力有很大推动力。"
 CHI_Silk_Road_IRQ: "一带一路拓展"
 CHI_Silk_Road_IRQ_desc: "伊拉克总体上是一个较为贫穷落后的亚洲国家，一带一路倡议背景下，中国有义务帮扶伊拉克发展国内建设。"
 CHI_PER_SAU_compromise: "沙伊和解"
 CHI_PER_SAU_compromise_desc: "沙特阿拉伯和伊朗之间由于历史政治原因，有很深的外交隔阂甚至是敌视。这两个地区强国如果始终维持紧张的关系，不利于中东地区维持和平稳定。好在我们对这两国都有一定影响力，也许我们可以做个和事佬，尽可能将沙伊关系缓和一点。"
 CHI_aer_aer_port: "阿尔阿尔口岸"
 CHI_aer_aer_port_desc: "沙特阿拉伯和伊拉克之间已经很多年处于一种非正常的关系。我们了解到沙特对于希望在与伊朗博弈中将伊拉克拉近自己的打算，可以借这个机会促进两国关系慢慢走向正常化，扩大我们在中东的话语权。"