 first_island_chain: "第一岛链"
first_island_chain_desc: "第一岛链是指东亚的海岸线往东的一串西太平洋岛屿及其之间的广泛海域，北起日本列岛、琉球群岛，中接台湾，南接菲律宾岛群、大巽他群岛至南海。其为美国外交国防政策中围堵中国的第一道防线，因主要为岛屿又呈链条形，因而得名。第一岛链海域对于美国武装部队防守中国人民解放军是最有效益的区域。"
 five_eyes: "五眼联盟"
 five_eyes_desc: "五眼联盟，是由五个英语圈国家所组成的情报联盟，在英美协定下组成的国际情报分享团体，成员国包括澳大利亚、加拿大、新西兰、英国和美国。该五国举行的会议也通常冠以“五国”名义。五眼联盟的历史最早可以追溯到第二次世界大战，同盟国所发布的《大西洋宪章》。\n五国拥有共同的历史溯源，所有成员国均曾为大英帝国的一部分，英国、澳大利亚、新西兰和加拿大亦为英联邦成员；美国、加拿大与英国同时也是北约成员国；美国、英国是联合国安全理事会常任理事国的其中之二。"
