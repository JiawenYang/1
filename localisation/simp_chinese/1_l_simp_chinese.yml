 asean_category_desc: "东南亚国家联盟是一个以经济为主的政府间组织，总部设在雅加达，最初成立于1967年。此后，该组织不断扩大，吸纳了那些原本在冷战紧张环境中被排除在外、力图对抗中国日益增长的影响力并保持独立于西方的国家。该组织致力于多边主义、国际法、和平解决争端、不干涉和自决的原则。"
