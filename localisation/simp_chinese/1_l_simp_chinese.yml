 NSTFR_VIN_people_army_idea: "越南人民军"
 NSTFR_VIN_people_army_idea_desc: "\n\n\n\n£GFX_NSTFR_VIN_people_army_idea\n\n\n\n\n\n越南人民军脱胎自革命年代的越盟军队，是为目前§R越南社会主义共和国§!的武装力量。根据过去的传统以及宪法规定，人民军需严格遵守“党指挥枪”的原则，接受§R越南共产党§!的领导。越南人民军由于其建军过程受到了来自北方§t中国人民解放军§!的影响，其在作战方式以及建军思想上均与中国有一定的相似之处。"
 ITA_corruption: "腐败"
 ITA_corruption_desc: "意大利的政治体制远不如其他欧洲国家的政治体制稳定和公正。裙带关系和腐败在地方政府、司法部门乃至联邦政府都是极其严重的问题。"
