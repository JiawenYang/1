 tribes_state_desc: "这个国家由不同的民族群体，部落，宗教或是语言使用者组成。可以轻而易举的挑动他们之间的争执和煽动武装冲突。"
 mcdonald_nationalism: "我们有麦当劳，你们的呢？"
 mcdonald_nationalism_desc: "当麦当劳进入前东欧共产主义国家时，拥有一家麦当劳甚至成为了民族自豪感的一部分，还被写进了足球队歌里，用来嘲讽那些还没有麦当劳的国家。\n\n§R因此，无论是游戏还是在现实中，这些国家的民族主义的表现形式皆为西方主义。§!"
 africa_nationalism: "非洲解放运动"
 africa_nationalism_desc: "§R要依靠非洲人自己解放非洲。非洲的事情非洲人自己去办，依靠非洲人自己的力量。§!\n--毛泽东"
 MAY_politics: "马来西亚政治"
 MAY_politics_desc: "\n\n\n\n\n\n£GFX_MAY_politics_texticon_embed\n\n\n\n\n\n\n\n§g马来西亚华人教科书§!\n\n拉惹或苏丹是人民必须尊崇的政府首脑。君主斯里德里布阿纳与人民德芒乐巴尔达温之间成立的君臣协议，产生君权与背叛的概念。\n\n§Y君权：君权象征君主的执政权力。拉惹或苏丹以贤明、高尚品德与睿智管理其政府。§!\n\n§R背叛：背叛表示人民违逆拉惹或苏丹的命令。人民背叛君主将遭受祸害或灾难。§!"
 IND_politics: "潘查希拉"
 IND_politics_desc: "\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_IND_politics_texticon_embed\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n印尼国徽中间的盾章代表了建国五项原则。1987年发行的一张海报在国徽图案下方说明了五项原则所对应的图案。建国五项原则的具体内容包括：\n信奉独一无二的神明\n正义和文明的人道主义\n印度尼西亚的团结统一\n在代议制和协商的明智思想指导下的民主\n为全体印度尼西亚人民实现社会正义\n\n潘查希拉为首任印度尼西亚总统苏卡诺于1945年6月所提出，政党的成立须要符合建国五项原则。建国五项原则为印尼宪法的基本精神之一。"
