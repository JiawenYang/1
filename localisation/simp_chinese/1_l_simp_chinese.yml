 GER_limit_army_name: "非军事化"
 GER_limit_army_name_desc: "\n\n\n\n\n£GFX_SPR_limit_army_embed \n\n\n\n\n\n\n华约解体后，非军事化趋势在西欧大行其道，昂贵的军费开支逐渐转向更加注重民用的目标。在内心深处，没有人愿意重温冷战时期疯狂的军备竞赛。也许只有当巨熊走出巢穴之时，才有可能让公众相信重整军备的必要性。"
