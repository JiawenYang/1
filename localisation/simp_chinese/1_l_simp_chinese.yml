 demand_japan_commit_war_crime: "要求日本为战争罪道歉"
 demand_japan_commit_war_crime_desc: "现在，社会主义与和平反战思潮在日本取得了胜利，中国已经能够逐步确立自己作为亚洲政治中心的地位。那么，现在是时候彻底清算日本军国主义的罪责了。我们要完成在美军的控制下未完成的任务：让过去的屠夫为他们的战争罪行赎罪!"
