 USA_prodem: "§B民主党倾向州§!"
 USA_prodem_desc: "§B自由与创新之州§!\n民主党倾向的州通常支持较为自由的经济政策，重视社会福利、教育、科技创新和环境保护。由于支持创新和文化产业，这些州通常有较高的生产力和高科技行业的支持，虽然资源丰富的程度可能较低，因此地方资源修正相对较轻。民主党倾向的州对教育、科技和医疗的投资通常较大，从而促进了人口增长和人才集聚。"
 USA_progop: "§R共和党倾向州§!"
 USA_progop_desc: "§R保守与强大之州§!\n 共和党倾向的州通常支持较为保守的经济政策，强调市场自由、低税收和减少政府干预，这使得它们更加依赖能源开采、重工业、制造业和农业。由于这些州通常拥有丰富的自然资源（特别是石油和天然气）以及强大的军事和基础设施建设，这些地区往往具有较高的地方生产能力和工业化水平。虽然资源较为丰富，但这些州的生产力增长和创新投资较少，因此其重点更多地集中在工业化和军事建设上。"
