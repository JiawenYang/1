 land_boundary_pro_chinese_desc: "现在，我们已经缓和了与印度的紧张关系，他们也终于与我们交好，或许我们要根据我们的领土主张来谈判，划定两个国家的国境线。"
 land_boundary_neutral: "与印度达成边界协议"
