 CHI_THEIR_LAND_THEIR_BLOOD: "他们的土地，他们的血"
 CHI_THEIR_LAND_THEIR_BLOOD_desc: "自汉唐以降，我亚洲诸国睦邻相守，化育苍生。然倭夷背仁弃义，屡启兵戈，荼毒邻邦，罪孽滔天，罄竹难书！\n\n昔倭寇扰我沿海，屠城掠地，残害生灵；近代以降，甲午侵华，占我疆土，欺我子民。及至二战，铁蹄踏遍东亚，南京屠戮三十万无辜，烧杀淫掠，无恶不作；朝鲜半岛、东南亚诸国，皆遭奴役，尸横遍野，血流成河。其以活人实验，行细菌战、化学战，残暴至极，为人类文明之奇耻！\n\n战后不思悔改，拒认罪孽，拜鬼祀凶，篡改史实，挑衅公理，蔑视亡魂！\n\n今正义昭彰，天道轮回。我亚洲诸国同仇敌忾，共讨逆贼！清算血债，严惩元凶，告慰千万冤魂，捍卫人间正道！\n\n§R此罪不讨，天地不容；此恶不除，亚洲难安！§!"
