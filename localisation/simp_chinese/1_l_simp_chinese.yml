 PRC_pla_dynamic: "中国人民解放军"
 PRC_pla_dynamic_desc: "\n\n\n\n\n£GFX_PRC_PLA_texticon_embed \n\n\n\n\n\n\n中国人民解放军（PLA）是中国共产党和中华人民共和国共同的守护者。因此，其管理结构通过中央军事委员会（CMC）被同时整合进了党的组织和国家机器之中。理论上说，中央军委有两个：一个属于党，另一个属于国家（地位相当于其他国家的国防部）。在党的组织结构内，中共中央军事委员会是与中共中央委员会、中共中央纪律检查委员会平级的最高级别机关；而在国家行政体系内，中华人民共和国中央军事委员会是与国务院，全国人民代表大会和中国人民政治协商会议平级的最高级别机关。\n\n中央军委副主席是现役军职领导干部能够担任的最高职务，地位等同于国务院副总理。总参谋长、总政治部主任、国防部长和中央军委纪律检查委员会书记会成为中央军委委员。这些职位属于副国级（高于部级），而两位中央军委副主席会进入中共中央政治局。在有些时期，排行第一的副主席还可能担任政治局常委。中央军委委员由中央军委主席提名，分别由党的全国代表大会和全国人民代表大会在会期做出批准决定。中央军委委员只对中央军委主席负责。包括全国人大、中共中央委员会在内的任何其他机构，以及包括政治局或其常委会中的文职委员（国务院总理、全国人大常委会委员长、国家主席或中共中央总书记）在内的任何其他个人都无权领导中央军委或全国武装力量。"
