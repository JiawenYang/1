 PRC_the_separatist_problem: "分裂分子问题"
 PRC_the_separatist_problem_desc: "中国的分离主义已经成为一个常年困扰着中央政府的顽疾。不仅是新疆的维吾尔人和西藏的喇嘛们在闹独立，更有香港这个不安分的特别行政区和台湾这个“叛乱岛屿”在制造麻烦。\n\n中国政府曾经尝试各种不同的办法，从怀柔政策到严厉镇压，来处理分裂分子，但都先后以失败告终。除此之外，来自外国的干涉也使得不同地区的分离主义问题日益复杂化。"
 china.71: "“三个代表”思想"
 china.71.t: "“三个代表”思想"
 china.71.d: "2000年2月20日，江泽民同志在广东省高州市出席领导干部“三讲”教育会议并发表重要讲话。他在讲话中提出了“五个始终”的要求，即：“必须确保党始终保持工人阶级先锋队性质，始终代表最广大人民的利益，始终代表社会先进生产力，始终带领全国各族人民推动社会生产力的发展，始终发挥坚强有力的领导核心作用，并且必须根据新的历史条件，进一步加强党的思想建设、组织建设和作风建设。" 
 china.71.a: "把中国的事情办好，关键在我们党。"
 china.76: "全军政治工作会议在古田召开"
 china.76.t: "全军政治工作会议在古田召开"
 china.76.d: "全军政治工作会议10月30日在福建省上杭县古田镇召开。中共中央总书记、国家主席、中央军委主席习近平31日出席会议并发表重要讲话。习近平强调，军队政治工作的时代主题是，紧紧围绕实现中华民族伟大复兴的中国梦，为实现党在新形势下的强军目标提供坚强政治保证。全军必须坚持以马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观为指导，贯彻党中央关于全面推进依法治国和从严治党的部署要求，贯彻依法治军、从严治军方针，紧紧围绕我军政治工作的时代主题，加强和改进新形势下我军政治工作，充分发挥政治工作对强军兴军的生命线作用。"
 china.76.a: "古田会议永放光芒"

