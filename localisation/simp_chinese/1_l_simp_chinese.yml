 CHI_ningxia_hui_autonomous_region_desc: "处于丝绸之路经济带通道枢纽，是西部陆海新通道建设的重要节点，是支撑西部大开发、黄河流域生态保护和高质量发展等国家战略实施的重要地区。"
 CHI_tibet_autonomous_region_desc: "国家重要安全屏障、生态安全屏障、战略资源储备基地、清洁能源基地、高原特色农产品基地、世界旅游目的地和面向南亚开放的重要通道。"
 CHI_tibet_desc: "国家重要安全屏障、生态安全屏障、战略资源储备基地、清洁能源基地、高原特色农产品基地、世界旅游目的地和面向南亚开放的重要通道。"
 CHI_xinjiang_uygur_autonomous_region_desc: "中国西北重要安全屏障，向西开放的桥头堡。"
 CHI_xinjiang_uygur_desc: "中国西北重要安全屏障，向西开放的桥头堡。"
 CHI_inner_mongolia_autonomous_region_desc: "地处祖国北部边疆，横跨东北、华北、西北，是中国北方重要生态安全屏障、祖国北疆安全稳定屏障、国家重要能源和战略资源基地、国家重要农畜产品生产基地、中国向北开放重要桥头堡。"
 CHI_beijing: "首都"
 CHI_beijing_desc: "庭前芍药妖无格，池上芙蕖净少情\n唯有牡丹真国色，花开时节动京城"
 CHI_shanghai: "浦东新区"
 CHI_shanghai_desc: "浦东开发开放带动上海走上了整体转型之路，也为整个长三角、长江流域，乃至全国的改革开放注入了新的动力。"
 CHI_XinJiang_Situation: "新疆局势"
 CHI_XinJiang_Situation_desc: "当地的极端分裂主义活动的威胁程度直接影响了我们对于该地区的控制水平且严重阻碍当地正常的经济秩序。\n\n§Y分裂分子威胁§!：[?CHI.uighur_threat|%%]\n§Y维吾尔族民意§!：[?CHI.uighur_opinion|%%]"
 CHI_hebei: "京津重心"
 CHI_hebei_desc: "地处京畿要地，是实施京津冀协同发展战略的关键区域之一。"
 CHI_guangdong: "珠三角巨擘"
 CHI_guangdong_desc: "改革开放的排头兵、先行地、实验区，向世界展示中国改革开放成就的董要窗口。"
 CHI_shanxi: "煤炭基地"
 CHI_shanxi_desc: "支撑黄河流域生态保护和高质量发展的战略支点，华夏文明最早的发祥地和中心区域之一，中国重要的能源基地和矿产资源大省、华北地区重要绿色生态屏障。"
 CHI_henan: "中原崛起"
 CHI_henan_desc: "地处中原地区，是支撑中部地区崛起、黄河流域生态保护和高质量发展等国家战略实施的重要地区。"
 CHI_shandong: "鲁商之州"
 CHI_shandong_desc: "促进南北联动、东西陆海统筹，联通东北亚和“一带一路”的重要枢纽，中国北方地区经济发展的战略支点和重要的工业基地。"
 CHI_liaoning: "工业基地"
 CHI_liaoning_desc: "中国重要的老工业基地，是新时代推动东北全面振兴的重要地区。"
 CHI_jilin: "北国重机"
 CHI_jilin_desc: "位于东北亚地理中心，是中国面向东北亚开放的重要地区，是国家重要的商品粮基地和老工业基地。"
 CHI_heilongjiang: "冰雪重工业"
 CHI_heilongjiang_desc: "地处东北亚中心区域，是国家重要商品粮生产基地、重型装备生产制造基地、重要能源及原材料基地、北方生态安全屏障、向北开放新高地。"
 CHI_jiangxi: "红色革命摇篮"
 CHI_jiangxi_desc: "承东启西，地处长江中下游，是支撑中部地区崛起、长江经济带发展等国家战略实施的重要地区。"
 CHI_hubei: "江城枢纽"
 CHI_hubei_desc: "湖北地处长江中游，兼具交通、工业和农业优势，是中部地区的重要经济和运输枢纽。"
 CHI_hunan: "湘楚大地"
 CHI_hunan_desc: "长江经济带发展、中部崛起等国家重大战略实施地区，中国工业发展的重要省份。"
 CHI_jiangsu: "苏南经济区"
 CHI_jiangsu_desc: "处于丝绸之路经济带和21世纪海上丝绸之路的交汇点，是支撑长江经济带发展、长三角一体化发展等国家区域重大战略实施的重要地区。"
 CHI_anhui: "皖中新兴"
 CHI_anhui_desc: "长三角一体化发展、长江经济带发展、中部崛起等国家重大战略实施地区，中国科技创新发展的重要省份。"
 CHI_zhejiang: "东海商都"
 CHI_zhejiang_desc: "长江经济带发展、长三角一体化发展战略的交汇区，中国式现代化的先行者。"

 CHI_hong_kong_desc: "我好比凤阙阶前守夜的黄豹，\n母亲呀，我身份虽微，地位险要。\n如今狞恶的海狮扑在我身上，\n啖着我的骨肉，咽着我的脂膏；\n母亲呀，我哭泣号啕，呼你不应。\n母亲呀，快让我躲入你的怀抱！\n母亲！我要回来，母亲！"
 CHI_macau_desc: "你可知“Macau”不是我的真名姓？\n我离开你的襁褓太久了，母亲！\n但是他们掳去的是我的肉体，\n你依然保管我内心的灵魂。\n那三百年来梦寐不忘的生母啊！\n请叫儿的乳名，\n叫我一声“澳门”！\n母亲！我要回来，母亲！"
 CHI_taiwan_autonomous_region_desc: "我们是东海捧出的珍珠一串，\n琉球是我的群弟，我就是台湾。\n我胸中还氤氲着郑氏的英魂，\n精忠的赤血点染了我的家传。\n母亲，酷炎的夏日要晒死我了，\n赐我个号令，我还能背水一战。\n母亲！我要回来，母亲！"
 CHI_taiwan_desc: "我们是东海捧出的珍珠一串，\n琉球是我的群弟，我就是台湾。\n我胸中还氤氲着郑氏的英魂，\n精忠的赤血点染了我的家传。\n母亲，酷炎的夏日要晒死我了，\n赐我个号令，我还能背水一战。\n母亲！我要回来，母亲！"

