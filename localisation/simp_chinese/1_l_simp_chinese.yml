 PAK_fervent_nationalism: "民族主义狂热"
 PAK_fervent_nationalism_desc: "\n\n\n\n\n£GFX_PAK_shatter_legacy_embed \n\n\n\n\n\n\n8月11日，是巴基斯坦独立与自英属印度分离的重要纪念日。然而，这一历史进程伴随着惨烈的流血与大规模动荡，超过1500万人被迫流离失所，死亡人数高达100至200万。印度教徒、穆斯林与锡克教徒——这些在次大陆上共处了数百年的族群——在那场突如其来的宗教暴力中相互撕裂，留下了几代人都难以愈合的创伤。\n\n巴基斯坦国父穆罕默德·阿里·真纳的愿景，是建立一个民主、平等与世俗的国家，为次大陆占人口约四分之一的穆斯林提供真正的平等。他一生中很长一段时间曾主张在一个统一的、印度教占多数的印度中实现这种平等，但最终他认识到，只有通过建立一个独立的穆斯林家园，这一理想才能真正实现。\n\n真纳高度重视世俗教育，认为这是改善穆斯林社会与经济地位的关键。他支持性别平等，反对诸如帕尔达（女性隔离）等保守做法。虽然他未曾留下著作或回忆录，但其演讲中处处体现出他对巴基斯坦未来的深远构想。1947年8月11日，在他就任巴基斯坦首任总统前夕所发表的演说，堪称他世俗愿景的集中体现：\n\n“你们是自由的；你们可以自由地前往寺庙，自由地前往清真寺，或任何其他宗教场所。在巴基斯坦这个国家里，无论你信仰何种宗教、种姓或教派——这都与国家事务无关。”\n\n真纳的成就，至今仍是20世纪历史的重要基石。然而，几十年过去，今天的巴基斯坦却与他曾设想的国家相去甚远。\n\n如今的巴基斯坦，宗教与意识形态已成为社会撕裂的根源，什叶派穆斯林遭遇暴力袭击，亵渎法动辄判处死刑，而国家对宗教的官方解释深刻影响着政治与治理。艾哈迈底亚教派，这一宗教少数群体，在法律与政策中被系统性边缘化与打压，成为国家宗教政策的牺牲品。\n\n在政治与经济层面，巴基斯坦依旧走在动荡的道路上。自1958年以来，军方直接统治国家长达数十年，历经四次军事政变。即使在表面上的文官政府之下，军方及其臭名昭著的情报机构依旧牢牢掌控着内政与外交决策，往往以维护其权力与经济利益为优先。\n\n尽管今日的巴基斯坦与真纳的理想相距甚远，仍有无数人每日为那个“本应存在”的巴基斯坦而坚持奋斗。他们始终铭记巴基斯坦最伟大的革命诗人费兹·艾哈迈德·费兹的诗句：\n\n“来吧，我们必须去寻找那被许诺的黎明。”"
 PAK_military_incharge_name: "军队当政"
 PAK_military_incharge_desc: "\n\n\n\n\n£GFX_PAK_military_incharge_embed \n\n\n\n\n\n\n巴基斯坦共和国，名义上是一个民主社会，宪法保障的选举如期举行，政府为人民服务。然而，现实中，政府屈从于军方的意志。自共和国成立以来，军方在国家政治中一直扮演着核心角色，我们的政府历史上充斥着军事政变和干预。任何改革若想通过，必须经过军方那些保守派和强硬派的审视与认可。"
 PHI_legacy_of_the_martial_law_idea: "戒严令的遗产"
 PHI_legacy_of_the_martial_law_idea_desc: "戒严令，以及它所代表的已故总统费迪南德·马科斯的同志在菲律宾政坛中仍属于一个争议颇多的话题。他的专制政策所留下的疮疤一直存续至今。"
 PHI_mutual_defence_treaty_idea: "共同防御条约"
 PHI_mutual_defence_treaty_idea_desc: "《共同防御条约》是美利坚合众国与菲律宾共和国在后者独立之初国内共产主义叛乱烽烟四起时签署的一项全面性协定。"
 PHI_marcos_family_idea: "马科斯家族"
 PRC_corrupt_bureaucracy_idea: "腐败官僚"
 PRC_corrupt_bureaucracy_idea_desc: "\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner\n\n\n\n\n\n                           §Y我讨厌他们§!。\n在中国这片土地上，腐败随处可见——无论是古代皇朝谋权篡位的宦官，还是近代麻木不仁的帝国总督和只懂烧杀抢掠的军阀，再到只知中饱私囊的国民党官僚，人民们饱受其苦已有数千年。而正因如此，新生的中共才能在血腥的斗争中脱颖而出，代表着扫清黑恶势力的新生力量。然而，经过毛泽东发动的数次政治运动和邓小平的改革开放，党的干部们已无意中成为了一个新的特权阶级。经济发展的不平衡不充分，互相猜忌的政治文化与派系斗争在我们党内蔓延，官员之间泛滥的贿赂与利益交换的政治裙带关系使随处可见。"
 SAF_anc_corruption: "非国大腐败问题"
 SOV_kleptocratic_state: "窃盗统治"
 SOV_kleptocratic_state_desc: "在鲍里斯·叶利钦看来，前苏联的私有化执行得太慢，于是联盟一解体，他就出台了“休克疗法”——几乎一夜之间，各种规章制度全部被移除，整个产业都被卖给了私人。腐败的党务官僚和道德败坏的企业家用贱价将国有企业收入囊中，经济资源就此集中到了少数政府盟友手中。他们为了维持权力，和叶利钦政权拉近关系，大搞闭门交易，因此也成了1998年国民经济危机后人人喊打的对象。"
 SOV_Russian_Orthodox_Church: "俄罗斯正教会"
 SOV_Russian_Orthodox_Church_desc: "\n\n\n\n£GFX_SOV_russian_orthodox_church\n\n\n\n\n\n从基辅罗斯到沙皇时代，千年以来，正教会一直是俄罗斯的主流宗教。尽管苏联曾大力推广国家无神论，但在我国尤其是农村地区仍存有大量信众。因此，俄罗斯正教会便成了普京总统最趁手的武器之一。教会不仅能向高龄人群和农村居民投射总统的影响力，还可以攻击反对派，以至任何有伤风化的运动，比如LGBT运动。作为回报，我们则承认俄罗斯正教会的主宰地位，并限制其他教派的发展。如此我们便能稳住教士的支持，而人民也能专心于信仰，不再整日对政府评头论足。"
 SWE_nordic_neutrality: "瑞典中立"
 SRL_rajapaksa_family_idea: "拉贾帕克萨家族"
 VEN_bolivarian_revolution: "玻利瓦尔革命"
 VIN_fifty_years_resistance_name: "波折50年"
 VIN_fifty_years_resistance_name_desc: "\n\n\n\n\n£GFX_VIN_matyr_day_texticon_embed \n\n\n\n\n\n\n§g一位年轻的志愿者为一位年迈的老人点燃香烟。两人都失去了左腿。他们坐在岘港市和荣县和兰公社的一片土地上，身旁，是一座埋葬了45名学生的万人坑——这些孩子在1965年3月16日美军空军对满光小学区域的蓄意轰炸中遇难。§!\n\n“一个曾英勇抗击法国殖民统治八十余年的民族，一个在近年坚定地与盟军并肩对抗法西斯的民族，这个民族必须获得自由！这个民族必须获得独立！”\n——越南民主共和国《独立宣言》\n\n自1941年越盟成立起，历经半个世纪战火，从对抗法国、美国，到结束中越冲突，越南终于在1991年迎来了和平。"
 VIN_fifty_years_resistance_4_name: "愈合伤口"
 VIN_fifty_years_resistance_4_name_desc: "\n\n\n\n\n£GFX_VIN_veteran_texticon_embed \n\n\n\n\n\n\n§g解放战争中的老兵。§!\n\n向烈士致敬！他们的奉献与牺牲将永远被铭记。但现在，我们必须继续砥砺前行。"
 VIN_doi_moi_name: "革新运动"
 VIN_doi_moi_name_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§g20世纪90年代胡志明市街道一角。§!\n\n革新运动是越南对于越南1986年发起的经济改革的命名，其目标是建立“社会主义导向的市场经济”。\n革新政策特指这些旨在将越南从计划经济转变为社会主义导向的市场经济的改革政策。革新经济改革由越南共产党于1986年在党的第六次全国代表大会上发起。这些改革赋予市场力量更大的加强，以协调企业和政府机构之间的经济活动，允许小企业私有制，并为国有和非国有企业建立证券交易所。"
 VIN_doi_moi_name_1: "革新运动"
 VIN_doi_moi_name_1_desc: "\n\n\n\n\n£GFX_VIN_vietnam_1980s_texticon_embed \n\n\n\n\n\n\n§g20世纪90年代胡志明市街道一角。§!\n\n革新运动是越南对于越南1986年发起的经济改革的命名，其目标是建立“社会主义导向的市场经济”。\n革新政策特指这些旨在将越南从计划经济转变为社会主义导向的市场经济的改革政策。革新经济改革由越南共产党于1986年在党的第六次全国代表大会上发起。这些改革赋予市场力量更大的加强，以协调企业和政府机构之间的经济活动，允许小企业私有制，并为国有和非国有企业建立证券交易所。"
 VIN_patriotic_tradition_name: "坚决进行斗争，坚决保卫胜利"
 VIN_patriotic_tradition_name_desc: "\n\n\n\n\n£GFX_VIN_determine_to_win_texticon_embed \n\n\n\n\n\n\n§g1969年7月11日于河内大剧院举行的“河内青年志愿团抗击美帝国主义出征仪式”。§!\n\n“舍恩布伦先生，我们有一个秘密武器……收起你的笑容，听我说。我们的秘密武器就是民族主义。享有民族精神就象征着（民族的）成熟，这比世界上任何武器都要强大。”\n--胡志明\n\n是什么让一个小国能够挺身对抗强大的敌国？是什么让一支装备落后的军队能够打败世界上最强大、装备最先进的军队？对于越南人民来说，答案无他，唯有钢铁般的意志和汹涌的爱国主义民族精神。在几千年的历史长河中，每次越南遭到入侵，这股精神便得到激发，形成巨大汹涌的浪潮，能够冲破所有险滩，能够吞没一切敌人，不论侵略者或卖国者。每个人、全民族的爱国主义精神，都是越南国家爱国传统的一部分。爱国主义民族精神是越南最显而易见、最根深蒂固的传统，它能够化为驱动力量击败一切入侵者。"
 VIN_failure_of_1980s_name: "80年代的失败"
 VIN_failure_of_1980s_name_desc: "\n\n\n\n\n£GFX_VIN_bao_cap_texticon_embed \n\n\n\n\n\n\n§g配给时代民众排队购买食品的场景。§!\n\n国家统一后，越南立即启动了一项旨在向社会主义前进的高速工业化政策。但由于生搬硬套了苏联的经济发展模式，且国家饱受战争之苦，极度匮乏所需的科学技术人才，越南的工业化进程陷于无序之中，最终导向了停滞和退化。政府强调重工业发展，忽视轻工业发展的方针扰乱了供求关系中的平衡。此外，农业产值的持续萎缩导致越南必须从苏联进口大米。1985年进行的货币革新进一步加剧了经济的严峻形势，通胀率达到了令人瞠目的393%。尽管有此后一系列的革新努力和纠偏措施，80年代政策失误的阴云仍然显眼地笼罩在越南经济上空。"

