 MEX_continue_the_fourth_transformation: "推进第四次变革"
 MEX_continue_the_fourth_transformation_desc: "在我们运动于2018年取得胜利之后，2019年是巩固成果和组织建设的时期。如今进入2020年，真正的考验才刚刚开始：启动一场深刻而持久的国家变革。墨西哥历经三个改变历史进程的伟大篇章：独立战争、改革运动和民主革命，每一次都重塑了国家的命运。今天，人民将新的变革使命托付于我们——根除腐败、消除不公、为千万墨西哥人重燃希望。新纪元的曙光已经降临。我们绝不能失败，因为墨西哥的命运要求我们履行人民的委托：实现一场真正的变革，既要无愧于历史，也要建设一个公正、民主和主权的未来。切勿说谎，切勿贪腐，切勿背叛人民！"
 MEX_contain_the_morena_rift: "Contain the MORENA Rift"
 MEX_contain_the_morena_rift_desc: "Yeidckol Polevnsky should have vacated the presidency of MORENA a year ago; nevertheless, she has remained in the position, accumulating a considerable share of power within the party. From this stronghold, she has promoted political figures loyal to her cause regardless of whether they originated from the PRI, PAN, or MORENA with the apparent goal of retaining her control for another year. Until recently, no one dared to openly challenge her, but recent scandals involving corruption and luxury spending have tarnished her image. In response, a group of militants promoted the designation of Jesús Ramírez Cuevas as the party's interim president, with a commitment to definitively renew the leadership. However, Polevnsky has challenged the election, igniting an internal war within MORENA different factions."
 MEX_hunting_the_dinosaurios: "Hunting the \"Dinosaurios\""
 MEX_hunting_the_dinosaurios_desc: "With all the internal disputes within MORENA, the party's image has been damaged. We need to renew the legitimacy of both the movement and the AMLO administration. Perhaps, by diverting attention and exposing old politicians, we can improve our public standing. We must exploit the current weakness of the PRI. Their low reputation among Mexicans makes it feasible that catching and prosecuting some of their former officials will give us a strong public image boost. We will investigate and bring several of these figures to justice. Primary targets include Emilio Lozoya, former director of Pemex, involved in corruption and Odebrecht bribery scandals, former President Enrique Peña Nieto; former Secretary of Foreign Affairs Luis Videgaray; and the current PRI leader, \"Alito\" Moreno, who already faces allegations of illicit enrichment. We can leverage all these cases and scandals to strengthen our image, show concrete results in the fight against corruption, and reaffirm that the Fourth Transformation does not protect the old interests of power"
 MEX_the_mirror_of_the_fourth_transformation: "The Mirror of the Fourth Transformation"
 MEX_the_mirror_of_the_fourth_transformation_desc: "Recent events in the struggle for MORENA's leadership have revealed a harsh truth: our movement is neither perfect nor entirely united. Slowly but surely, the same old political wounds we criticized in other parties for years are beginning to surface within our ranks. If we are to avoid falling into the old vices corruption, internal divisions, and loss of public credibility we must act immediately. It is time to look in the mirror and acknowledge our mistakes. Networks and figures within the party have adopted practices contrary to the ideals of the Fourth Transformation. We must be able to single them out, investigate them, and, if necessary, expel them, regardless of the political cost. This process will not be easy; it could jeopardize the stability and unity of the movement. But if we wish to keep the hope of true change alive, we must demonstrate that in MORENA, we will not tolerate the corrupt. Only then can we project a firm, coherent, and renewed image to the citizenry, reaffirming that the transformation must also begin from within."
 MEX_renew_morena_leadership: "Renew MORENA Leadership"
 MEX_renew_morena_leadership_desc: "Having stabilized the party's internal crisis, the time has come to look forward. A significant period has passed since the dispute for control of MORENA began. Jesús Ramírez Cuevas has officially announced the call for a new leadership election. Thousands of militants will participate in this decisive election. The outcome will be crucial: the leadership of Mexico's most powerful party not only controls its political structure and resources but also defines the direction of the Fourth Transformation. \nWill the Moderates, led by Bertha Luján, impose their conciliatory vision?\nOr will the Obradoristas, with Martín Batres, keep the President's original line alive? \nWill the Technocrats under Mario Delgado open a new era of political pragmatism? \nOr will the Old Guard, led by Alejandro Rojas, manage to consolidate their power within the party?"
 MEX_reform_the_el_sogoro_populare: "Reform the \"Seguro Popular\""
 MEX_reform_the_el_sogoro_populare_desc: "While the Seguro Popular is far from a perfect system, the truth is that its existence has eased the lives of millions of Mexicans who would otherwise have no access to healthcare. Eliminating it abruptly would be a costly mistake: if a new model is not implemented quickly and effectively, it could trigger a severe health crisis in the country. The Mexican state does not currently have the financial resources to immediately transform the healthcare system to the standards of Denmark. Therefore, the most sensible path forward is gradual progress, building on what already exists and improving its foundations. The strategy is to strengthen the Seguro Popular, provide it with greater funding, eliminate the cumbersome affiliation process that creates bureaucracy and exclusion, root out internal corruption, and ensure full transparency in its operations. Thus, instead of destroying what already exists, we will build upon its foundations a system capable of evolving into a fairer, more humane, and more efficient model for all"
 MEX_create_insabi: "Create the INSABI"
 MEX_create_insabi_desc: "The \"Seguro Popular\" Insurance program has proven to be a chaotic, bureaucratic, and ineffective system, incapable of guaranteeing the full right to health for all Mexicans. Attempting to reform it would be futile, as it is a legacy of the neoliberal model that reduced social welfare to a mere financial instrument. If we truly want to advance toward a genuine welfare state, comparable to Denmark, we must take a bold step: dismantle the Popular Health Insurance and establish the \"Instituto de Salud para el Bienestar\"(INSABI). This new institution will serve as an extension of the IMSS, designed to provide free and universal medical care not only to uninsured Mexicans but also to anyone who sets foot on Mexican soil, including migrants and foreigners. INSABI will build its own clinics and hospitals, guarantee access to a wider range of medicines, provide coverage for all types of illnesses, and eliminate affiliation processes that exclude millions of people."
 MEX_jet_ticket_gamble: "The Jet Ticket Gamble"
 MEX_jet_ticket_gamble_desc: "The presidential airplane represents one of the clearest symbols of the luxury and excesses that characterized the \"mafia of power\" in Mexico. It was conceived as an emblem of ostentation, greed, and wealth, disconnected from the real needs of the people. The new government, led by Andrés Manuel López Obrador, has decided to break with that tradition. In a gesture of austerity and closeness to the citizens, the president has committed to using commercial flights for his travel, distancing himself from the privileges of the old political class. However, a buyer for the presidential airplane has not yet been found. Therefore, it was decided to hold a raffle, with the prize equivalent to the monetary value of the aircraft. To finance this initiative, the country's business leaders will be invited to contribute resources \"voluntarily.\" This action will not only cover the costs of the raffle but also serve as a measure of loyalty between the Fourth Transformation and economic power. The funds raised will be allocated to strengthening the public health system."
 MEX_combat_the_huachicol: "Combat the Huachicolero"
 MEX_combat_the_huachicol_desc: "Since the so-called \"gasolinazo\" (fuel price hike) under the Enrique Peña Nieto administration, where public gasoline prices skyrocketed, the illegal theft of fuel has reached alarming levels. It is no longer just PEMEX employees \"milking\" the pipelines; organized criminal cells operate networks of clandestine theft and sale, offering cheap fuel and generating millions in losses for the State. This practice gravely aggravates PEMEX's delicate financial and operational situation: thousands of liters illegally siphoned daily undermine revenue and endanger the national energy infrastructure. In early 2019, President Andrés Manuel López Obrador ordered the temporary closure of pipelines to curb the traffic, but the measure did not eradicate the problem. It is necessary to intensify actions: the Army and Navy must protect critical refineries, terminals, and stations, while federal forces coordinate targeted police operations against the gangs controlling this illicit market."
 MEX_frontera_segura: "Secure the Border"
 MEX_frontera_segura_desc: "Since 2018, Mexico has received massive caravans of migrants from Central America. The number of people in transit has been high, and their presence poses a complex dilemma for our national project. Although we are a humanist movement that stands for the rights of migrants, the geopolitical reality has placed us under constant pressure from President Trump administration, which has demanded the halt of all caravans. We now face a crossroads between our principles and external demands. While we work toward a comprehensive policy, immediate action is needed to maintain order at the southern border. For this reason the newly created National Guard will be deployed to contain, assist, and channel certain migrant groups, while a long term solution is defined."
 MEX_the_face_of_rejection: "The Face of Rejection"
 MEX_the_face_of_rejection_desc: "Our economic situation dictates reality, our dependence on the United States is critical, and this is no time for challenges. The hardening of their immigration policies and the arrival of new caravans have led Washington to press for the immediate reinforcement of our southern border. Out of sheer pragmatism, we cannot risk this vital relationship. We hereby order the National Guard and the National Migration Institute to deploy, detain, and deport migrants. While this measure goes against our humanist principles, it will earn us diplomatic breathing room and could increase domestic support among a population tired of the migratory flow."
 MEX_as_in_denmark: "As in Denmark"
 MEX_as_in_denmark_desc: "Mexico's public healthcare system is in deep crisis. Both the IMSS and the \"Seguro Popular\" have long been plagued by endless waiting times, administrative errors, surgical mix-ups, staff shortages, and overworked, underpaid doctors and nurses. It is clear: change is urgently needed, and Denmark stands as a model to follow in terms of public healthcare. Our goal will be to adapt its experience and apply it to Mexico's reality. The first step is to review the Seguro Popular, created during Vicente Fox's administration as a financial instrument to provide healthcare for Mexicans without access to other public health services. Its purpose is to offer coverage through system affiliation, granting attention to a broad list of serious illnesses. However, the program has serious flaws: excessive waiting times, corruption and most alarming, the exclusion of basic illnesses that can prove fatal. For this reason, a profound transformation is required, one that guarantees all Mexicans a healthcare system that is dignified, efficient and humane, one that not only cures but also prevents and protects."
 MEX_in_solidarity_with_our_central_american_brothers: "Our Central American Brothers"
 MEX_in_solidarity_with_our_central_american_brothers_desc: "We will not allow Washington's pressure or economic convenience to tarnish the humanist ideals of the Fourth Transformation. Our movement's pro-migrant stance is not mere rhetoric; it is an unbreakable commitment. We accept that this decision will inevitably strain our relationship with the United States, but political congruence and morality stand above geopolitical pragmatism. We order the National Guard to suspend all detentions and, instead, escort and support migrants on their journey North. Furthermore, the National Migration Institute must immediately improve migrant facilities and open a support center for those who choose to settle in Mexico. The country will see that MORENA prioritizes its principles over adversity, thus reaffirming our identity to the people of Mexico"
 MEX_knock_knock_washington: "Knock, Knock Washington"
 MEX_knock_knock_washington_desc: "U.S. President Donald Trump has insisted on the renegotiation of the North American Free Trade Agreement (NAFTA), seeking to replace it with a new accord: the USMCA (T-MEC). The bulk of the negotiations is already concluded; only minor clauses and the final signature remain. This agreement is fundamental to the Mexican economy, constituting one of the pillars of the country's foreign trade. Securing its continuity is, therefore, a government priority. President Andrés Manuel López Obrador is scheduled to travel to Washington as a symbolic gesture of cooperation, with the goal of signing the treaty and ensuring its entry into force. Although the new agreement is not expected to differ significantly from the previous one, final adjustments, favorable or not, may arise depending on Mexico's position on sensitive issues like the migrant caravans and border policy"
 MEX_guarantee_the_completion_of_amlos_megaprojects: "Guarantee the Completion of AMLO's Megaprojects"
 MEX_guarantee_the_completion_of_amlos_megaprojects_desc: "President Andrés Manuel López Obrador has promoted an ambitious series of projects for Mexico, aiming to stimulate the economy, strengthen the southern regions, and improve the situation of PEMEX. Among these initiatives is the creation of the Maya Train, a rail network for both cargo and passengers connecting Tabasco with the entire Yucatán Peninsula. This project seeks to boost economic development in the Southeast, promote tourism, and generate jobs in the region. Furthermore, the Interoceanic Train, project in the Isthmus of Tehuantepec will be resumed. The idea is to construct a rail network connecting the Pacific Ocean with the Gulf of Mexico, featuring two main ports designated for international trade. This corridor will not only facilitate the transport of goods but also include factories and assembly centers for foreign investment, allowing companies to improve and repair their products in Mexico before export. This project is expected to attract millions in investment and strengthen the national industrial infrastructure."
 MEX_empower_alduro_zaldivar: "Empower Arturo Zaldivar"
 MEX_empower_alduro_zaldivar_desc: "The Electricity Reform proposal pushed by President Andres Manuel Lopez Obrador faces a critical threat: the Supreme Court of Justice of the Nation. In the recent past, the highest court has already blocked multiple Executive initiatives, declaring key laws and strategic infrastructure projects unconstitutional. Now, the Court is again emerging as the main obstacle to the government's energy project. The government has decided to use its recent majority in the Chamber of Deputies to push for a constitutional revision to strengthen the figure of the Chief Justice of the Supreme Court, Arturo Zaldivar, one of the few ministers considered close to the Fourth Transformation project. Although Zaldivar holds the presidency of the Court, his current powers are limited and do not allow him to overturn resolutions or contain openly opposing ministers. Therefore, the plan includes extending his mandate and expanding the Chief Justice's powers. With a strengthened Zaldivar, the Executive hopes to neutralize internal resistance within the Court."
 MEX_renewing_pegasus_licenses: "Renewing Pegasus Licenses"
 MEX_renewing_pegasus_licenses_desc: "Pegasus is an extremely advanced Israeli-made espionage software, known for its discreet use and high efficiency. During the presidency of Enrique Peña Nieto, it was used extensively to spy on political opponents, journalists, public figures, business leaders, and even members of organized crime. In fact, President Andrés Manuel López Obrador himself was once one of its targets. Although the current government publicly denounced these practices and promised to end political espionage, the reality is that Pegasus remains a tool of enormous strategic value. Pegasus could be used to strengthen State intelligence in the fight against organized crime and other armed groups present in the country, allowing for the identification of criminal networks. However, the system also offers another possibility: monitoring opposing actors, including politicians, business leaders, journalists, and activists, with the goal of anticipating movements. The tool is there. The technology works. It only remains to decide how and against whom it will be used."
 MEX_light_up_the_CFE: "Light Up the CFE"
 MEX_light_up_the_CFE_desc: "With the electricity reform progressing as planned by the President, the opportunity arises to decisively strengthen the Federal Electricity Commission (CFE). A larger budget and the rapid expansion of its infrastructure will guarantee universal access to electricity at affordable prices for the population. To achieve this, the generation network will be expanded through the construction and modernization of thermoelectric plants, combined-cycle plants, and hydroelectric facilities, as well as the interconnection of new electrical projects throughout the country. The goal is clear: to meet the growing energy demand and ensure that no corner of Mexico is left without power. The focus will remain on sources capable of ensuring stability and state control. With these measures, the CFE will regain its role as a pillar of the Mexican State, concentrating immense energy power and guaranteeing sufficient, stable, and affordable electricity for every Mexican home."
 MEX_attain_energy_sovereignity: "Attain Energy Sovereignty"
 MEX_attain_energy_sovereignity_desc: "With the implementation of the electrical reform, the Comisión Federal de Electricidad has begun to regain ground against the private sector, returning to the State a central role in energy generation and distribution. Simultaneously, expansion in other strategic sectors has strengthened the way México produces and obtains its energy resources, bringing the country closer to a long-awaited goal: energy sovereignty. However, the final push is still needed. To this end, the State has decided to nationalize lithium, creating a new state-owned company in charge of its exploitation and development. Foreign concessions, primarily Chinese, will be revoked under controlled compensation schemes, allowing México to begin the exploitation of lithium. At the same time, CONAGUA will be deeply strengthened and expanded, consolidating state control over water as a strategic resource for the country's future. "
 MEX_defy_the_judicial_branch: "Defy the Judicial Branch"
 MEX_defy_the_judicial_branch_desc: "The Judiciary has established itself as one of the main obstacles to the projects of the Fourth Transformation. The Supreme Court of Justice of the Nation, now dominated by a clearly opposing majority organized around Minister Norma Piña, has systematically blocked key initiatives of the Executive, from structural reforms to strategic infrastructure projects. Although Arturo Zaldívar continues to hold the position of Chief Justice, his room for maneuver is extremely limited. He lacks a solid base of allies within the Court, and his political capital has eroded rapidly. Without sufficient legislative control or institutional support, the strategy is restricted to damage control and buying time. The Executive will push a proposal to extend Arturo Zaldívar's term as Chief Justice, seeking to preserve a minimum of influence within the Court. Simultaneously, President López Obrador will intensify public criticism of the Judiciary from his morning press conference, pointing out its rulings, privileges, and disconnection from the popular mandate. "
 MEX_negotiate_with_the_opposition: "Negotiate with the Opposition"
 MEX_negotiate_with_the_opposition_desc: "With a deeply divided Congress after the unexpected victory of the opposition bloc in the mid-term elections, the government is left without the ability to impose its agenda through legislative means. In this new balance of power, there is no other option but to negotiate with the PAN, the PRI, and the PRD if there is any intention to save a part of the electricity reform. The most viable path involves uncomfortable concessions. These range from allowing opposition state governments to operate with greater autonomy and without federal interference, to granting discreet political favors in exchange for key votes in Congress. Likewise, it will be necessary to modify central aspects of the reform, especially to address the demands of the PAN, which is pushing for a greater emphasis on renewable energy and a lower concentration of the electricity sector in the hands of the State. This approach does not strengthen the Executive, but it allows the electricity reform to survive, albeit diluted. It is a tacit acknowledgment that, in the new political scenario, moving forward requires reaching agreements."
 MEX_end_moral_superiority: "An End to Moral Superiority"
 MEX_end_moral_superiority_desc: "For years, the Fourth Transformation has relied on a narrative of moral authority and a clean break with the past. That image is now rapidly eroding. The opposition has launched an aggressive political and media offensive aimed at exposing corruption and contradictions within MORENA itself. The promise of “we are not the same” loses credibility as scandals reach the very core of power.\n\nHigh-profile cases—including the Pío López Obrador video, the Casa Gris affair, allegations surrounding Cuauhtémoc Blanco and Félix Salgado Macedonio, and the massive SEGALMEX embezzlement—have severely damaged the government's moral standing. Selective silence and defensive responses only deepen public skepticism. As national and international media amplify these revelations, opposition parties regain political ground, while business groups, civil organizations, and broad sectors of society begin to openly question the legitimacy of the Fourth Transformation."
 MEX_beyond_hydrocarbons: "Beyond Hydrocarbons"
 MEX_beyond_hydrocarbons_desc: "México begins a new stage in its energy policy. These conditions force the CFE and PEMEX to reorient part of their operations toward renewable energies and significantly reduce their carbon emissions, in compliance with the commitments made by the Mexican State before the UN in the Paris Agreement. As a result, the country will promote an ambitious energy transition program. New wind farms and solar plants will be built, expanded and modernized. These investments will not only strengthen the country's energy infrastructure but also allow the CFE to expand its generation capabilities through strategic partnerships, accelerating the modernization process of the national electrical system. \n\nMéxico will begin to position itself as a relevant actor in the production of clean energy in Latin America. The economic cost of this transformation will be high, and the results will not be immediate, but it is a necessary sacrifice."
 MEX_the_world_is_our_market: "The World is our Market"
 MEX_the_world_is_our_market_desc: "Mexico's vast resources and strategic position place the country before a historic opportunity. As global energy demand rises and oil revenues surge, the nation can finally reduce its long-standing economic dependence on the United States, now weakened by deep internal crisis, and project itself as an independent actor on the world stage.\n\nThis strategy does not seek isolation, but diversification. Backed by abundant natural resources, a competitive manufacturing base, and a skilled, cost-efficient workforce, Mexico will reorganize its foreign trade policy to expand export destinations and climb the industrial value chain. Oil, agricultural goods, manufactured products, and strategic minerals will find new markets abroad, while carefully selected foreign investments from China, Japan, and the European Union will be encouraged to strengthen domestic industry and accelerate national development."
 MEX_an_energy_reform: "An Energy Reform"
 MEX_an_energy_reform_desc: "The Energy Reform stands as one of the central pillars of President Andrés Manuel López Obrador's political project and a defining promise of the Fourth Transformation. After years of preparation, public discourse, and confrontation with neoliberal legacies, the time has come to move beyond rhetoric and initiate the formal legal process that could reshape Mexico's energy sector. The proposed reform seeks to restore the strategic role of the State, strengthen public enterprises, and reverse decades of market-oriented policies that weakened national sovereignty over energy resources.\nIn this delicate phase, the government will seek to frame the Energy Reform as a matter of national interest, emphasizing energy security, affordable electricity, and the recovery of state control. Negotiations with legislators intensify behind closed doors. The outcome is far from guaranteed, but the initiation of this process marks a decisive moment: either the Fourth Transformation reshapes the foundations of Mexico's energy system."
 MEX_oil_boom: "Oil Boom"
 MEX_oil_boom_desc: "The global oil crisis triggered by the Saudi Arabian conflict has dramatically reshaped international energy markets, and Mexico now finds itself at the center of this new reality. The discovery of the Lázaro Cárdenas oil field has transformed the country into a beacon of opportunity, drawing the attention of both national and foreign energy companies eager to secure access to Mexican crude. Capital, technology, and speculation are pouring into the sector, driven by soaring demand and rising prices.\n\nThis sudden influx of investment marks the beginning of a new oil boom for Mexico. Government revenues surge, production expands, and the energy sector regains strategic relevance on the world stage. Yet beneath the optimism lies a familiar dilemma: how to balance economic opportunity with national sovereignty."
 MEX_full_speed_ahead: "Full Speed Ahead"
 MEX_full_speed_ahead_desc: "With the oil boom underway, the priority is clear: Mexico must expand its extractive industry at full speed. Production targets will be raised, new infrastructure accelerated, and existing fields pushed to their maximum potential. This is not the time for hesitation or half-measures; the moment demands decisive action to fully capitalize on favorable global conditions.\n\nAs the President himself would put it,\nIt is time to \"macanear\" the industry,\nKeep the oil pumping,\nKeep the economy moving,\n\nAnd ensure that the benefits of this boom translate into growth, jobs, and national strength. A new era for Mexican industry and economic development lies ahead, driven by energy, momentum, and an unapologetic push forward."
 MEX_stewarding_the_abundance: "Stewarding the Abundance"
 MEX_stewarding_the_abundance_desc: "The oil boom has turned Mexico into a focal point for both national and foreign investors, eager to expand their presence in a rapidly growing energy sector. Capital flows in, production rises, and industrial activity accelerates across the country. Yet abundance, if left unmanaged, can quickly become a source of imbalance rather than prosperity.\n\nThe State must now assume the role of steward, ensuring that investment and expansion are carefully regulated and strategically distributed. Growth must strengthen not only industry, but also the Mexican people through public revenue, social programs, and long-term economic stability. The challenge is not merely to extract wealth, but to govern it wisely, transforming energy abundance into shared national development."
 MEX_mexico_in_the_atomic_age: "Mexico in the Atomic Age"
 MEX_mexico_in_the_atomic_age_desc: "Expanding conventional energy sources is no longer enough to sustain Mexico's long-term growth. With a stronger economic position, the State can now pursue a decisive leap forward through nuclear energy, ensuring energy security while reducing carbon emissions. This initiative goes beyond experimental projects, aiming instead at the construction of a modern, highly efficient nuclear complex capable of significantly strengthening the national power grid.\nBuilding on decades of civilian nuclear experience and in coordination with the Secretaría de Energía and the Comisión Federal de Electricidad, Mexico will pursue the development of Generation IV nuclear reactors under the highest international safety standards. With an estimated output of up to 5,000 MW, the new plant—strategically located in Guanajuato—will supply the rapidly growing industrial heartland of the country. Though foreign technological cooperation will be required, this project signals a clear message: Mexico is entering the atomic age as a sovereign, technologically ambitious, and forward-looking nation."
 MEX_rebirth_of_the_oil_giant: "Rebirth of the Oil Giant"
 MEX_rebirth_of_the_oil_giant_desc: "The ongoing oil bonanza has ushered Mexico into a new era of opportunity after years of stagnation. With hydrocarbons once again at the center of national development, the path forward is clear: PEMEX must be restored to its former status as a continental energy powerhouse. This historic moment cannot be wasted.\n\nThe State will channel massive resources into the national oil company to expand exploration in the Gulf of Mexico, modernize and enlarge refining capacity, and boost natural gas production. By increasing both crude output and domestic refining, Mexico will reduce fuel imports while expanding exports of gasoline and derivatives abroad. Rising energy revenues will finance social programs, infrastructure, and improved living standards, while stronger public finances open the door to lower fuel prices through gradual tax reductions. The rebirth of PEMEX is not merely economic growth—it is the return of Mexico as a sovereign energy giant of the Americas."
 MEX_cuando_calienta_el_sol: "Cuando Calienta el Sol"
 MEX_cuando_calienta_el_sol_desc: "Mexico's northern deserts possess some of the highest levels of solar radiation on the continent, an immense energy potential long overlooked. Today, this natural advantage becomes a strategic opportunity. The government will launch an ambitious solar program across the Sonoran, Chihuahuan, and Coahuila deserts, beginning in Puerto Peñasco, Sonora.\n\nFive massive photovoltaic parks, each spanning thousands of hectares, will be constructed under the direct administration of the Comisión Federal de Electricidad, forming one of the largest solar complexes in the world. New substations, transmission lines, and a high-capacity network will integrate this clean energy into the national grid. Supported by advanced battery storage, regional lithium resources, and natural gas backups, the project will deliver stable and reliable power. With an estimated capacity of 5,000 MW, this initiative marks a decisive step toward the energy transition, providing clean electricity to millions of homes and positioning Mexico as a rising leader in renewable energy."
 MEX_a_latinamerican_opec: "A Latin American OPEC"
 MEX_a_latinamerican_opec_desc: "México has successfully positioned itself as a key energy player, especially in the oil sector. Therefore, it has decided to take a step forward with an ambitious regional project. Following the collapse of the Middle East, OPEC has suffered a devastating blow, losing several of its most important members and facing massive supply interruptions due to the political instability of that region. \n\nIn this context, the Mexican government decides to step up and propose an ambitious regional project: the creation of a Latin American energy organization. Venezuela, Colombia, Brazil, Argentina, and Ecuador will be the first countries invited to join this new alliance, thus forming LAOPEC(Latin American Organization of Petroleum Exporting Countries). \n\nThe goal of LAOPEC will not only be to coordinate the extraction and export of oil but also to stabilize prices, finance joint energy infrastructure, such as refineries, petrochemical plants, and pipelines, and guarantee the security of the region's strategic resources. Many of its potential members face severe energy and fiscal crises, regional coordination could be the key to their recovery. \n\nFurthermore, this alliance will allow Latin América to negotiate as a single bloc against major powers, reduce its vulnerability to external sanctions, and build its own energy model without depending on interests foreign to the region. It is a modest but decisive step. In a world plunged into chaos, Latin America still has the opportunity to consolidate itself as a pole of stability, sovereignty, and prosperity."
 MEX_call_to_dr_gatell: "Call to Dr.Gatell"
 MEX_call_to_dr_gatell_desc: "With the confirmation of the first case of COVID-19 in Mexico, a 35-year-old man returning from a conference in Bergamo, Italy, the country faces the beginning of a new and dangerous health crisis. \n\nFaced with this situation, the Federal Executive must begin organizing a national strategy to halt the spread of the virus and protect the population. The Ministry of Health will be the government's primary instrument in this task, and among its ranks stands a key figure: Dr. Hugo López-Gatell, a specialist in internal medicine, epidemiology, and public health policy. His experience makes him a key figure in these uncertain times, and under his coordination from the Undersecretariat of Prevention and Health Promotion, efforts will be directed to monitor, contain, and mitigate the spread of the virus throughout the country. Mexico is thus preparing to face one of the greatest tests in its recent history, relying on science, organization, and communication with its citizens."
 MEX_susana_distancia: "Susana Distance"
 MEX_susana_distancia_desc: "The WHO has officially declared a global health emergency due to COVID-19, and cases in Mexico continue to increase daily. Given this situation, the government must declare a national quarantine to slow the spread of the virus. All non-essential economic activities will be temporarily suspended: workers must stay home, businesses and establishments will close their doors, and schools at all levels will suspend in-person classes. Public spaces and recreational centers will also be ordered to close. We know that these measures will severely impact the economy, but they are necessary if we are to overcome the health crisis and save lives. At the same time, a broad national information campaign will be launched, coordinated by La Mañanera and broadcast through various media outlets, to inform the population about measures to prevent and contain the virus. Within this strategy, a symbolic figure will emerge: \"Susana Distance,\" an educational heroine who will teach, in a clear and accessible way, how to maintain social distance and protect Mexican families. In addition, a special TV education program will be implemented for the millions of students who have temporarily left the classroom, ensuring that learning continues during the quarantine."
 MEX_marcelo_around_the_world: "Marcelo Around the World"
 MEX_marcelo_around_the_world_desc: "Given Mexico's lack of technological and scientific capacity to develop its own vaccine against COVID-19, the Secretary of Foreign Affairs, Marcelo Ebrard, has presented an ambitious diplomatic plan: an international tour to ensure Mexico's access to the world's leading vaccines. The foreign minister will depart for Washington, D.C., then go to Beijing, pass through Moscow, and end in Berlin, with the aim of negotiating the acquisition of vaccines with the leading governments and pharmaceutical companies in their development: Pfizer, AstraZeneca, Sputnik V, NOVAVA X, SINOVAC, MODERNA, CanSino Bio, and Cova X. The strategy consists of obtaining small batches from different sources, since the developing countries will allocate the first doses to their own populations. However, by combining reduced shipments from several nations, Mexico will be able to gradually mitigate the impact of the virus, distributing vaccines among the most vulnerable sectors until national immunization is possible. Marcelo Ebrad is even confident of being one of the first countries to receive vaccines once the virus is eradicated in the first world. Ebrard, recognized for his diplomatic skills, negotiating ability, and leadership, will be tasked with ensuring fair prices, defining delivery times, and guaranteeing the quality of the batches. His success will represent not only health relief but also a political and diplomatic triumph for the country. With this plan, Marcelo could mark the beginning of the end of the coronavirus crisis in Mexico, strengthening the government's image and consolidating the international strategy of the Fourth Transformation."
 MEX_national_traffic_light_system: "Epidemiological Traffic Light"
 MEX_mandate_for_containment: "Tightening of the Quarantine"
 MEX_mandate_for_containment_desc: "The last few weeks have been particularly difficult for the federal government. Media pressure, both national and international, has intensified in the face of what many consider an inadequate response by the Mexican government to the COVID-19 pandemic. \n\nVarious media outlets have accused the government of acting slowly and complacently. They point to the late suspension of mass events, such as Liga MX matches or the Vive Latino festival in Mexico City, as well as the high hotel occupancy rate of over 90% in tourist destinations like Acapulco during the recent spring break. Adding to these criticisms is the controversy surrounding presidential tours, which, although popular, have been described by foreign media as an act of irresponsibility. \n\nThe New York Times has declared that Mexico's health measures are \"insufficient\"; The Washington Post has published images of the president hugging supporters during his visit to Tabasco; Deutsche Welle has questioned the Vive Latino celebration; and Reuters has described the president's tours of rural communities as \"reckless in times of a pandemic.\" Even the WHO has urged the country to \"urgently intensify\" its prevention and containment mechanisms. \n\n Faced with this growing pressure, the president and his team must recognize that the current measures have not been sufficient. If we want to avoid a national tragedy, it is time to act firmly, even at the expense of economic growth. Therefore, Dr. Hugo López Gatell has announced a new comprehensive plan to tighten the quarantine. Although the following measures may seem authoritarian or restrict Mexican trade and tourism, pillars of our economy, the plan is as follows:"
 MEX_power_is_moral_not_viral: "The President's Strength is Moral, not Contagious"
 MEX_power_is_moral_not_viral_desc: "In recent weeks, various national and international media outlets have harshly criticized our government, accusing it of an alleged lack of attention to the global health crisis caused by COVID-19. \n\nThe allegations point to a delay in the suspension of mass events, such as Liga MX matches or the Vive Latino festival in Mexico City, as well as high hotel occupancy of up to 92% in tourist destinations like Acapulco during the last long weekend. Added to this is the controversy surrounding President Andrés Manuel López Obrador's tours of the interior of the country, which foreign media have described as irresponsible. The New York Times considers the health measures adopted insufficient; The Washington Post has published images of the president greeting and hugging citizens during his visit to Tabasco; Deutsche Welle questions the Vive Latino event; and Reuters has pointed out his tours of rural communities as \"reckless in times of a pandemic.\" Even the WHO has asked Mexico to \"intensify its prevention and containment mechanisms.\" \n\nFaced with this wave of criticism, Undersecretary of Health Hugo López-Gatell responded with a phrase that has shaped the national debate: \"The president's strength is moral, not contagious\" \n\nThe opposition was quick to seize upon the statement to attack the government, calling the strategy naive and dangerous. However, the presidential team maintains that the measures adopted have managed to maintain a degree of economic stability, avoiding the collapse experienced by other nations, while preserving the closeness between the government and the people. If the economy holds up and the people continue to support the president, why change course? \n\nFor now, the strategy will continue unchanged. For the government, the results and popular support are proof that the Fourth Transformation continues to advance, even in the midst of the pandemic. We are even developing a plan to gradually reactivate the Mexican economy."
 MEX_stay_home: "\"Stay Home\""
 MEX_dn_iii_plan: "DN-III-E Plan"
 MEX_dn_iii_plan_desc: "With the start of Phase 3 of COVID-19 in Mexico, the country has entered the most critical moment of the health emergency. Hospitals are beginning to become saturated, infections are multiplying rapidly, and exhausted medical personnel are facing increasingly difficult workdays. After weeks of analysis and coordination, the Federal Government has decided to implement one of its most emblematic tools in times of crisis: the DN-III-E Plan, now specifically adapted to combat the pandemic. \n\nLed by the Ministry of National Defense and the Ministry of the Navy, the plan represents an unprecedented national mobilization. Both institutions will deploy their doctors, nurses, technicians, and logistics personnel throughout the country, with the goal of strengthening the health system and ensuring that no Mexican is left without medical care. Military and naval hospitals will be opened to the civilian population, and temporary hospitals will begin to be built in various regions of the country, improvised with field materials, but with the same discipline and efficiency that characterizes the Armed Forces. \n\nArmy logistics became a backbone of the national response. Ambulances, cargo vehicles, and aircraft are mobilized, transporting patients, medicines, and medical supplies to the most affected states. \nThe plan is not limited to the medical aspect. The Armed Forces are also taking on public safety duties, supporting local police forces in street surveillance and enforcing health measures. The soldiers, now wearing masks and gloves instead of shoulder-mounted rifles, have become a familiar sight. They will distribute food, hand out groceries, and help transport sick people in rural areas. For the first time, the Mexican armed forces will have the capacity to perform COVID-19 testing in their own laboratories, collaborating closely with the Ministry of Health. The operation, truly nationwide in scope, will leverage the army's entire logistics network, capable of reaching the most remote corners of the country. No town will be left out of the strategy. In communities where a doctor has never arrived, military trucks will stop, set up tents, and set up small makeshift clinics to serve the population. \n\nFor the first time, the Mexican armed forces will have the capacity to perform COVID-19 testing in their own laboratories, collaborating closely with the Ministry of Health. The operation, truly nationwide in scope, will leverage the army's entire logistics network, capable of reaching the most remote corners of the country. No town will be left out of the strategy. In communities where a doctor has never arrived, military trucks will stop, set up tents, and set up small makeshift clinics to serve the population."
 MEX_the_new_normal: "The New Normal"
 MEX_end_of_the_infection: "End of the Infection"
 MEX_end_of_the_infection_desc: "With the arrival and distribution of vaccines to 98% of the population, Mexico is on the verge of eradicating the coronavirus. After more than two years of uncertainty, lockdowns, and loss, the country is beginning to regain its vitality. Factories are operating again, workers are returning to their jobs, businesses are reopening, and the streets are regaining the bustle that the pandemic had silenced. Public events, festivals, and celebrations are returning without restrictions, marking the beginning of a new era of hope and national reconstruction. \n\nHowever, the government has announced that certain preventive measures will remain in place for the next two years to prevent a possible resurgence of the virus. The use of face masks will remain mandatory in closed and crowded spaces, as will the constant use of antibacterial gel in public places. These are minor measures compared to the days of lockdown, but necessary to ensure that the virus does not spread again with the same force. \n\nAlthough the health situation is now stable, authorities and the scientific community agree that COVID-19 will not completely disappear. As was the case with H1N1 influenza or the common flu, the virus will become part of the country's regular epidemiological landscape, but under medical supervision and with an immunized population. Hospitals will remain prepared to treat isolated cases, and an epidemiological surveillance system will be maintained to monitor its behavior and detect possible mutations. \n\nEven so, the national mood is optimistic. Mexico will slowly recover, rebuilding its economy and social fabric. Families are reuniting, schools are resuming in-person learning, and everyday life is regaining its rhythm. The pandemic leaves profound lessons and scars. There is no doubt that the country will never be the same. COVID-19 marked a before and after, not only at the national level but also at the personal level of each citizen. The Mexico that entered the pandemic is not the same as the Mexico that emerges from it. We can only wait and see what the future holds."
 MEX_the_long_war: "The Long Quasi-War"
 MEX_the_long_war_desc: "Mexico had for a long time an issue of smuggling operations being present in their territory, especially during the rise of the Colombian drug trafficking syndicates. That all changed when the Medellin Cartel began to use Mexico as a transit route to access the largest demand in the market: the United States of America. The partnerships that formed to smuggle the products of the Colombian syndicates would later prove to be disastrous for Mexico as the smugglers began to increase their own power to the point where they formed their own distribution networks. The first major network born was the Guadalajara Cartel, which would soon spawn more modern cartels such as the Juarez and Sinaloa Cartels after the arrest of the first major kingpin, Miguel Angel Felix Gallardo or El Padrino. Then, when President Felipe Calderon got into power, he declared war on all the cartels to save his image. From there on, Mexico has bled and the cartels still remain powerful since the war began in 2006. Something has to change"
