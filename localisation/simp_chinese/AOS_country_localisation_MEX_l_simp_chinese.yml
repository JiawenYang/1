 MEX_flavor.1.t: "一个早晨"
 MEX_flavor.1.d: "早上7点。一月的寒风笼罩着刚刚苏醒的墨西哥城。喇叭声、公交车加速的轰鸣声以及首都匆忙的生活节奏交织在一起。每日的晨间记者会即将开始。就在记者们强忍睡意时，墨西哥合众国总统安德烈斯·曼努埃尔·洛佩斯·奥夫拉多尔结束了与总统发言人赫苏斯·拉米雷斯·奎瓦斯的交谈，敲定了晨间发布会将要讨论的议题。\n\n一切准备就绪后，门打开了。安德烈斯·曼努埃尔迈着稳健的步伐走出来，开始向记者们致意。\n“早上好，我们开始吧，开始吧！”——安德烈斯·曼努埃尔用他标志性的塔巴斯科口音说道。“早上好……”——记者们稀稀落落地回应，有些人还睡眼惺忪。当奥夫拉多尔走到讲台前时，他调整了一下麦克风，开始发言，晨间记者会由此正式开始。\n“嗯……我们非常高兴能在新年伊始召开这场记者会。我们确信，绝对确信，今年会一切顺利。”\n\n摄像机从各个角度对准他，不仅通过电视，还通过互联网直播（YouTube、Facebook和Twitter）将他的信息传递给大众。成千上万的墨西哥人凝神倾听：刚交班的工厂工人、在电视机前吃早餐的老人、在公共交通上的大学生、记者、商人、政客，以及任何想了解总统对新一年有何展望的公民。\n\n奥夫拉多尔宣布了他将推行的项目：建立一个类似于丹麦的医疗保健系统；启动玛雅列车和奥尔梅卡炼油厂建设；扩大社会福利项目；提高最低工资标准。他逐一列举这些承诺，并夸耀了其政府的成就，例如减贫以及高支持率所反映的公众信任。同时，他也回避了诸如国家安全形势等棘手问题。\n\n记者会持续进行，直到信息发布环节结束。怀着对新年的期望，他宣布今年将是“莱奥娜·维卡里奥年”，以纪念这位墨西哥独立战争的女英雄，并阐述了关于言论自由与墨西哥女性地位提升的见解。\n\n安德烈斯·曼努埃尔以他特有的沉稳节奏，结束了他的观点陈述。然后他深吸一口气，环视会场说道：\n“嗯……现在开始问答环节……嗯……你，来自《每日报》的。”"
 MEX_flavor.1.a: "总统先生，您对此有何看法……？"
 MEX_flavor.2.t: "Boy Hero"
 MEX_flavor.2.d: "In the rugged, green mountains of Guerrero, where the roads once trod by revolutionary armies remain a land where the law dissolves into the mist, Fernando, a boy of barely twelve, stood guard at the entrance to his village. He carried an old wooden rifle that weighed more than he did, and the makeshift uniform he wore hung loosely from his thin frame, clearly not for him, as did a bandana covering his mouth. It looked like a disguise, a disguise he should never have worn.\n\nHe wasn't a soldier, nor a member of organized crime; he was simply a child, robbed of his childhood by an enemy he never asked to face.\n\nHis story began when one of the region's indigenous communities, fed up with kidnappings, extortion, and disappearances, decided to arm everyone who could hold a gun. Men, the elderly... and children too. In that corner of the country, the line between life and death had become too thin to continue waiting for help from a state that seemed absent, as if it didn't exist\n\nA local journalist captured the image: Fernando standing firm, serious, his gaze fixed on the mountain. He looked like a statue, though inside, Fernando was completely confused. When the photograph was published, it went viral in a matter of hours. Some Mexicans called him \"brave.\" Others, a \"victim.\" But everyone who had the misfortune of seeing the image, without exception, felt that uncomfortable lump in their throat that the truth brings when it hits hard.\n\nFernando wasn't seeking fame, glory, or to become a symbol. He was simply following an order he had heard the night before: \"If you hear engines, you warn. If you hear gunshots, you respond.\"\n\nBefore the cameras, the commander of the community guard explained that the children were \"the last line of defense\" against the criminal groups: the Ardillos, the Sinaloa Cartel, and the Jalisco New Generation Cartel roam the area and grow stronger every day.\n\n\"We don't want this,\" he said, \"but no one else is going to come and protect us.\"\n\nThe image shook the country, social media exploded, the opposition launched attacks, international organizations demanded answers, and the federal government was forced to speak out. Several members of MORENA spoke of \"exceptional circumstances,\" \"forgotten territories,\" \"future actions,\" and \"Calderón's fault.\" But in Guerrero, meanwhile, Fernando remains there, fearfully holding an old wooden rifle, watching the hill, waiting for something, anything, to break the silence. He understood nothing of politics, nor of failed states. He only knew that he had to defend his family, his friends, his community, and that this rifle, though heavy and old, was the only thing between him and death.\n\nFernando has not lost his innocence; for how can one lose something one never had?"
 MEX_flavor.2.a: "My God."
 MEX_flavor.3.t: "Another Chance"
 MEX_flavor.3.d: "After the report filed by the university students in Paraiso, Tabasco, several weeks passed before the authorities began to take the case seriously. It wasn't until January 27th that a small team from PROFEPA, was sent to investigate the area. Upon arrival, the inspectors were surprised to discover that the enormous slick in the sea was not an ordinary spill, but rather the sign of an oil field. The discovery was immediately reported to PEMEX, which sent its engineers to conduct a more in-depth evaluation. \n\nAfter several days of analysis, the specialists concluded that the field was gigantic, possibly as large as or even larger than the legendary Cantarell Complex. Furthermore, it was a light, sweet crude oil, easy to refine and of excellent quality, with reserves estimated in preliminary reports at approximately 38 billion barrels. \n\nThe news was received with surprise and enthusiasm at the National Palace. The Secretary of Finance, Arturo Herrera Gutiérrez, and the Secretary of Economy, Graciela Márquez Colín, asserted that the discovery would dramatically boost Mexico's economic growth, generating higher export revenues, attracting private investment, and facilitating access to international loans, in addition to allowing for a substantial increase in public spending. Meanwhile, the CEO of PEMEX, Octavio Romero Oropeza, presented a report to the president stating that while the offshore oil platform was being assembled, initial production was expected to reach 35,000 barrels per day, but that with the appropriate investment, this could reach one million barrels per day. \n\nAndres Manuel Lopez Obrador appeared visibly pleased throughout the meeting. Optimistic about the discovery and the optimistic comments from his economic cabinet, he began to speak of ambitious plans: more infrastructure projects, new trains, highways, ports, refineries, achieving the long-awaited energy sovereignty, and expanding the Fourth Transformation. He also proposed strengthening the Federal Electricity Commission (CFE) and, finally, rescuing PEMEX from its deep financial crisis, after years of stagnant oil production and a growing debt that seemed impossible for the Mexican state-owned company to manage, which has finally found a way out.\n\n\"Mexico is facing a historic opportunity\", the president said throughout much of the meeting. \n\nThe meeting concluded with the decision to grant PEMEX the necessary budget to begin exploiting the oil field by installing an oil platform. To close the session, AMLO suggested naming the field after former president Lazaro Cardenas, in honor of his legacy in the Mexican oil industry."
 MEX_flavor.3.a: "Black Gold, Eagle in Flight"
 MEX_flavor.4.t: "LATINUS"
 MEX_flavor.4.d: "After more than a year of rumors about the new digital platform project called \"Latinus,\" journalist Carlos Loret de Mola, accompanied by figures such as Víctor Trujillo, Galilea Montijo, and other media personalities, officially announced the launch of the digital platform \"Latinus,\" based in Denver, Texas. The project was created with the stated purpose of broadcasting news and informational content to the Latino community residing in the United States.  \n\nHowever, just hours after its announcement, Latinus generated a huge impact, both due to controversy and praise. Various investigations suggest that Loret de Mola and the visible presenters are just \"the tip of the iceberg.\" Political figures such as Roberto Madrazo, along with other members of the PRI and PAN parties, as well as businesspeople linked to the opposition, including Claudio X. Gonzalez, are identified as potential funders. It is believed that, far from targeting the Latino community in the United States, Latinus will focus all its coverage on events in Mexico, particularly attacking the AMLO administration.  \n\nFor many anti-AMLO groups, Latinus represents the media outlet that finally amplifies their voice. Numerous opponents of the Fourth Transformation celebrated the launch, especially since its star presenters, Loret de Mola and Víctor Trujillo, have been persistent critics of President Andres Manuel Lopez Obrador for years. \n\nIn Mexico where the president's daily press conferences dominate the public agenda and where traditional media outlets like Televisa and TV Azteca suffer from widespread public disrepute, Latinus emerges as a new opposition voice on social media and in the digital sphere."
 MEX_flavor.4.a: "Blessed Social Media"
 MEX_flavor.5.t: "MORENA"
 MEX_flavor.5.d: "After the controversial 2006 presidential election, in which Andrés Manuel López Obrador (AMLO), candidate of the PRD, lost to PAN's Felipe Calderón by a razor-thin margin of just 0.14%, López Obrador denounced electoral fraud. In response, he declared himself the legitimate president and attempted to build an alternative government with various leftist forces. Although this project was ultimately abandoned, it laid the groundwork for a new movement: the National Regeneration Movement (MORENA).\n\nInitially founded as a civil association, MORENA began recruiting citizens from all sectors: youth, business leaders, academics, unions, and activists. In 2012, after a second unsuccessful run for the presidency and growing tensions with the PRD's \"New Left\" faction, AMLO broke with his former party. By then, MORENA already had a strong militant base, gaining official registration as a political party on July 9, 2014.\n\nIn the 2018 elections, MORENA achieved a historic breakthrough: AMLO won the presidency with a resounding 53% of the vote. The party's meteoric ascent triggered a political earthquake, plunging traditional parties like the PRI, PAN, and PRD into a legitimacy crisis. Ideologically, MORENA avoids traditional labels, presenting itself as the party that 'defends the people.' Its discourse blends republican austerity with a strong opposition to neoliberalism, yet it does not reject private investment or cooperation with the United States, a style reminiscent of the National Revolutionary PRI of the mid-20th century.\n\nToday, MORENA presents itself as the force of the \"Fourth Transformation\", aligning its project with Mexico's great historic ruptures: Independence, the Reform, and the Revolution. However, as the movement faces the coming decades, critical questions remain: Can it survive without fragmentation? What path will it take once leadership no longer revolves around the figure of López Obrador?"
 MEX_flavor.5.a: "The 4th Transformation"
 MEX_flavor.6.t: "Obradorism"
 MEX_flavor.6.d: "Obradorism is an ideological current that emerged in 21st-century México as a reinterpretation of the National Revolutionary and post-revolutionary ideas of the PRI of the 20th century. Inspired by the ideas of social justice, national sovereignty, and the fight against corruption, this movement combines populist rhetoric with a strong emphasis on centralizing state power. Obradorism openly rejects the neoliberal model that shaped the country since the 1980s, accusing it of having plunged México into inequality, violence, and economic dependence.\n\nUnlike classical left-wing populism, Obradorism avoids defining itself within ideological categories, rejecting the labels of Left or Right. Instead, it appeals directly to the \"good people\" through a moralizing narrative of governance, positioning the leader Andrés Manuel López Obrador as guarantor of social welfare and national recovery. It promotes a mixed economy in which the State regains control of strategic sectors such as oil and electricity, while also driving massive social programs, subsidies, and large-scale infrastructure projects. In foreign policy, it advocates prudent neutrality and the principle of non-intervention, while promoting national self-sufficiency and strong nationalism. Although it presents itself as democratic, its governing style leans toward personalism, weakening institutional checks and balances in the name of popular will. Critics accuse it of soft authoritarianism and of instrumentalizing the State for electoral purposes, while its supporters regard it as the driving force behind a true \"Fourth Transformation\" in México.\n\nObradorists are currently the most influential faction within MORENA. They are politicians and political cadres who fully adhere to the principles of Obradorism and who follow the leadership of Andrés Manuel López Obrador in a disciplined manner, viewing him as the moral and political axis of the movement. This faction is characterized by an almost unquestionable loyalty to the leader, prioritizing continuity of the project and ideological debate. For its members, Obradorism is not merely a political current, but a historical cause that must be consolidated and defended against its adversaries, both within and outside the State"
 MEX_flavor.6.a: "Obradorism will transform Mexico"
 MEX_flavor.7.t: "The Moderates"
 MEX_flavor.7.d: "The Moderates in MORENA constitute one of the party's most institutional factions. While they uphold the fundamental principles of Obradorism, social programs, republican austerity, and the defense of national sovereignty, they seek to avoid radicalization in sensitive matters, such as the weakening of democratic institutions, extreme nationalism, or the outright rejection of globalism. Their orientation is closer to traditional European social democracy, prioritizing the stable continuity of the \"Fourth Transformation\" over ideological ruptures. They reject internal factionalism and constantly call for unity within MORENA, placing governability and technical administration as their main priorities. Nevertheless, the figure of Andrés Manuel López Obrador continues to carry decisive weight in national politics: as long as he remains active, the President's decisions will set the course for the Moderates, who rarely deviate from his line"
 MEX_flavor.7.a: "On the sidelines"
 MEX_flavor.8.t: "The Old Guard within the Party"
 MEX_flavor.8.d: "The Old Guard in MORENA represents politicians from the former PRI regime who, far from disappearing, found in Obradorism a space for resurgence and protection. These are figures with long trajectories in Mexican politics, often linked to traditional practices such as clientelism, corporatist control, and the strategic use of state institutions.\n\nTheir influence does not stem from ideology but from experience, power networks, and knowledge of government structures. For them, the \"Fourth Transformation\" is more a vehicle for continuity in power than a radical shift in the political model. While they do not embody the progressive ideals of MORENA's younger grassroots, they contribute pragmatic governance and operational capacity. Nevertheless, their presence creates internal tensions, as they personify the contradiction between the movement's discourse of breaking with the old regime and the practice of keeping emblematic figures of that very past."
 MEX_flavor.8.a: "MORENA and the PRI? They are the same?"
 MEX_flavor.9.t: "A Technocratic Advice"
 MEX_flavor.9.d: "The Technocrats within MORENA represent the faction most oriented toward efficiency, public administration, and ideologically closer to the right. Unlike Obradorism, technocrats do not place much emphasis on ideological or moralizing discourse. Instead, they focus on administrative modernization, economic liberalization, and Mexico's integration into the global economy, while also seeking consensus with both national and international business sectors.\n\nAlthough they maintain the narrative of social justice and the welfare state characteristic of Obradorismo, they usually prioritize institutional efficiency and the professionalization of the state, setting aside nationalism and favoring openness toward international organizations and nations such as the United States, the European Union, Japan, and BRICS.\n\nTheir political strategy is based on presenting MORENA as a party capable of governing with technical expertise. While they do hold some influence within the party, their proximity to neoliberal ideologies has earned them the disdain of the Obradoristas, forcing them to make certain concessions in order to avoid being marginalized within the movement."
 MEX_flavor.9.a: "Efficiency and Progress above all"
 MEX_flavor.10.t: "Bruise on the City"
 MEX_flavor.10.d: "On the night of February 9th, in a small apartment at number 501 Tamagno Street, in the Cuauhtémoc borough of Mexico City, where domestic violence had become commonplace, Rodolfo, a 15-year-old boy, was in his room chatting on Instagram with a friend. He was spending the weekend with his father, as stipulated in his parents' divorce agreement regarding his custody.\nIt was already night. His father's girlfriend, Ingrid, was preparing dinner. They had a good relationship, and Rodolfo felt deeply sorry for how his father, Erick, treated her, the same way he treated his mother.While Rodolfo was still talking to his friend, he heard the apartment's front door open. His father had arrived. Clearly drunk, he began yelling at Ingrid. Rodolfo could hear the argument escalating. He tried to ignore it, but it was clearly impossible.\n\nAt one point, he heard Ingrid say, her voice thick with emotion, \"I'm fed up, Eric, I can't stand you anymore, you son of a bitch.\" To which her father replied, \"Put that knife down, you stupid bitch.\"\n\"I won't. Stay away from me,\" she retorted, her voice trembling yet firm.\nRodolfo understood that this fight was different. His father's voice held a cold fury, while Ingrid's reflected a deep fear. He opened his bedroom door, hoping to intervene. He walked down the hall and, upon reaching the kitchen, froze. He could only watch as his father attacked Ingrid with a kitchen knife. Blood covered Eric's face as he continued to furiously stab her lifeless body.\nErick turned his head and saw his son. Rodolfo went into shock. The silence was so thick it cut through the air. Without a word, she returned to her room, locked herself in, and fell into a deep trance after witnessing the horrific event, while she listened as her father moved Ingrid's body and then began flushing the toilet. After a while, she heard him leave. Several minutes passed before Erick returned to the apartment and called his ex-wife, confessing to his crime.\nHours later, the police arrived and found a chilling scene throughout the apartment. The officers arrested Erick, and forensic experts collected evidence. In a small room, they found Rodolfo in a state of shock.\nThe following morning, the news went viral on social media. The entire country was shaken and shocked. The way the events unfolded sparked a strong sense of outrage among Mexicans, especially Mexican women. Images of Ingrid's body began circulating online, sparking widespread public outrage against the media outlets that published the photos and those who shared them.\n\"Circulating these photos is revictimizing the victim,\" many users wrote.\nDuring his morning press conference, Attorney General Alejandro Gertz Manero acknowledged that femicides had increased alarmingly since 2018 and proposed eliminating femicide as a specific crime. Meanwhile, President Andrés Manuel López Obrador avoided the topic of Ingrid's case throughout the conference, dismissing the criticism as legitimate and claiming it was an attack by the \"conservative\" press and opposition politicians to undermine his administration.\nThese insensitive responses from both the Attorney General and the President only fueled public outrage. That afternoon of February 10, massive mobilizations of feminist groups erupted across the country, protesting against the media outlets that broadcast the images, against the state's response, and against the growing number of crimes committed against women.\nWith the slogans \"Justice!\" and \"Not one more..."
 MEX_flavor.10.a: "And not one less...\""
 MEX_flavor.11.t: "Day Zero"
 MEX_flavor.11.d: "Dr. Hugo López-Gatell was in his office at the Ministry of Health headquarters around six in the evening. He was analyzing how COVID-19 was evolving in China, South Korea, and some European nations, as well as how those countries were dealing with the crisis. At the same time, he was preparing the report on how Mexico would detect and confront the virus, to be presented at the next day's morning press conference.\n\nGatell knew it was inevitable that COVID-19 would reach Mexico. With his epidemiological studies and the speed at which the virus was spreading to more countries, he was certain that it would become a global pandemic. His goal was to contain it as best as possible when it finally arrived. He had been up all night for several days, trying to plan a national lockdown that would affect the economy as little as possible. The president wanted the economic damage to be minimal, but Gatell knew that would be nearly impossible. Even so, no one dared to contradict President López Obrador.\n\nThis dynamic was so evident that a joke circulated among the cabinet secretaries and advisors: \"If the president asks for the time, what do you answer? —Whatever time you want, Mr. President.\"\n\nThis lack of space for criticism and debate only increased the tension. While Gatell was lost in these thoughts and the growing pressure of a job that, overnight, had become incredibly stressful, his office phone began to ring.\n\n\"Yes, hello?\" Gatell answered. \"Good afternoon, Dr. Gatell,\" said Olivia Pérez, Mexico City's Secretary of Public Health. \"Yes, what's up, Olivia?\" Gatell replied, his tone revealing that sleep was beginning to take hold.\n\n\"About the 35-year-old man who arrived from Italy… The doctor who performed the second test, the one from InDRE, just gave me the results. Positive for SARS-CoV-2. It's official: we have our first patient infected with the new virus. He has mild symptoms, and we traced that he was in contact with nine people. We've already put him in isolation,\" Olivia explained, with a small but visible tone of concern.\n\n\"Damn…\" was all Gatell could manage to say. He immediately started thinking about how he would tell the president and how he would present the information at the morning press conference.\n\n\"Okay, Olivia, find out who else he was in contact with and put them in isolation too. I'll start preparing the presentation for tomorrow. Send me all the data you have.\"\n\n\"Okay, Gatell, I'll send it to you in an hour. See you later.\"\n\n\"Goodbye, Olivia. Take care… and say hi to Claudia for me.\"\n\nGatell hung up the phone and remained silent for a few seconds, thinking about what was to come."
 MEX_flavor.11.a: "This is Just the Beginning"
 MEX_flavor.12.t: "A violet tsunami"
 MEX_flavor.12.d: "Since February 14th, feminist protests across the country have steadily grown, primarily due to the femicide of Ingrid Escamilla, which sparked a wave of outrage against both the media for publishing photographs of Ingrid's body and the Mexican government, perceived as indifferent and cold in its handling of the case.\n\nSeveral feminist collectives organized demonstrations throughout the country, especially in Mexico City, in recent weeks, and many of these protests became intense and, at times, violent.\nThis March 8th, a massive feminist mobilization is taking place across Mexico in commemoration of International Women's Day. It is the largest feminist protest in the country's history. Groups of protesters have surrounded the Zócalo, demanding justice for murdered and disappeared women, as well as the legalization of abortion, an end to impunity in crimes against women, gender equality laws, and other demands.\nThe various feminist black groups began causing damage, especially in Mexico City, where, as expected, the largest demonstrations were concentrated. Clashes with riot police and other security forces have been reported in several areas throughout the country.\nPolice have used batons, hammers, pepper spray, fire extinguishers, and rubber bullets; while some protesters have used hammers, Molotov cocktails, and paint.\n\nThe result is an image of repression, tension, and growing social instability in the country."
 MEX_flavor.12.a: "A Country Falling Apart"
 MEX_flavor.13.t: "COV-IDIOTS"
 MEX_flavor.13.d: "Despite the growing number of COVID-19 cases, the Mexico City government has decided not to cancel the 2020 Vive Latino festival, a decision that has generated considerable controversy not only in Mexico but also internationally.\n\nSeveral foreign media outlets are covering the story, noting that \"In the midst of a health crisis, Mexico will hold a massive festival in its capital.\" Media pressure is increasing as photos and videos of the event circulate.\n\nIt is estimated that around 80,000 people have attended the festival, and so far at least 27 attendees have reported fever and discomfort. Throughout the venue, people can be seen without face masks, and some even carry signs with phrases like \"We don't give a damn about the coronavirus,\" reflecting a mixture of skepticism, misinformation, and apathy that still prevails in large sectors of the country. Several singers and bands have decided to cancel their participation, posting messages on their social media to raise awareness among their fans.\n\nFor many, allowing the event constitutes a monumental act of recklessness and, possibly, a source of massive contagion that could accelerate the spread of the virus in a matter of days. However, the Mexico City government maintains that \"there is no need for alarm\" and that activities like this help reduce the emotional stress caused by the uncertainty and voluntary confinement of recent days.\n\nBe that as it may, this festival has become a symbol of how Mexico is choosing to confront the pandemic.\n\nIn the coming days, the country will know whether allowing Vive Latino was an act of recklessness… or a mistake whose consequences are only just beginning to manifest."
 MEX_flavor.13.a: "Really?"
 MEX_flavor.14.t: "Enemies to Lovers"
 MEX_flavor.14.d: "Today, Mexicans woke up to news as unexpected as it was shocking. Something that, until recently, seemed impossible: the PRI, the PAN, and the PRD have announced a joint electoral alliance. Parties that for more than thirty years faced each other as irreconcilable rivals have today decided to join forces with a clear objective: to stop their common enemy, MORENA.\n\nThe three political forces that dominated the country's public life for decades will compete together in next year's legislative elections. The alliance will run in 158 electoral districts across three states. The PAN will field candidates in 61 districts, the PRI in 53, and the PRD in 44, with the intention of stripping MORENA of its majority in the Chamber of Deputies.\n\nHowever, this coalition has raised more questions than answers. The most important one resonates across the nation: Will it work? Can this alliance defeat MORENA, or will it end up permanently destroying the parties that form it? Analysts warn that this coalition lacks a clear national project and a truly alternative proposal for Mexicans. Some point out that the alliance could further erode the support these parties still hold: Would a traditional PRI voter be willing to vote for a PAN candidate? Or would a PRD member accept a shared platform with the Panista right?\n\nThe coalition represents an ideologically contradictory mix: the Perredista left, Priista centrism, and the Panista right, a strange and uncommon combination, not only in México but in world politics. For many, this alliance does nothing but reinforce President López Obrador's narrative about the \"Old Regime\" and the so-called \"PRIAN,\" an idea that MORENA has used as a symbol of the system it promises to eradicate.\n\nOthers, however, see it as a purely pragmatic move: a desperate but necessary attempt to avoid the dispersion of the opposition vote and stop what many consider an authentic political steamroller. For this sector, the alliance is not ideological but strategic, the last barrier against the total concentration of power in the hands of the President's party. The 2021 elections are approaching and promise to mark a historic turning point. Old enemies now walk together. In the end, the dilemma for the Mexican electorate seems to boil down to a single question: Should Andrés Manuel López Obrador's project continue, or not?\n\nOnly time, and the ballot boxes, will give the Mexican people's answer."
 MEX_flavor.14.a: "Desperate Times... Desparate Measures"
