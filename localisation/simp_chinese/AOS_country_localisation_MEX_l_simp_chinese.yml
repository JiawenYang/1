 MEX_un_electrico_primor: "Un Eléctrico PRI-MOR"
 MEX_un_electrico_primor_desc: "Following the victory in the 2021 mid-term elections, the government has secured a broad majority in Congress. The opposition bloc is weakened and fragmented. In this context, a clear opportunity arises: to break their alliance from within. The Institutional Revolutionary Party (PRI), under the leadership of Alejandro Moreno, is going through one of its most fragile moments. His poor electoral performance, multiple corruption allegations during his term as governor of Campeche, and the leak of compromising audios released by Governor Layda Sansores have left his leadership politically exposed and vulnerable. If the right pressure is applied, Alejandro Moreno could be forced to yield parliamentary support on specific issues, allowing for a tacit collaboration between the PRI and MORENA. This maneuver would send a powerful message: the opposition bloc is not only weak but also easy to fracture, further consolidating the government's political hegemony and reducing the opposition's capacity for resistance against the Fourth Transformation."
 MEX_national_traffic_light_system_desc: "The COVID-19 crisis is hitting Mexico hard. It not only represents an unprecedented health emergency, but also a serious threat to national economic stability. The measures implemented so far, necessary but restrictive, are suffocating an economy that was already showing signs of stagnation. If we do not act intelligently and quickly, the Fourth Transformation project could suffer a severe setback. Therefore, we have convened a group of multidisciplinary experts—medical, economic, military, political, and business experts—to design a comprehensive plan that will maintain the balance between health and development.\n\nThus was born the \"National Traffic Light Plan,\" a mechanism that seeks to prevent economic collapse and maintain the mental health of the population due to prolonged confinement, without uncontrollable the spread of the virus. The plan is based on four colors, each representing a level of health risk and economic activity, which will be updated weekly during the morning press conference and on the Ministry of Health's official channels."
 MEX_stay_home_desc: "With the arrival of Phase 3 in Mexico, regional outbreaks have spread to virtually the entire country. Community spread of the virus continues to increase, despite the measures implemented in recent weeks. The outlook is critical, with public and private hospitals beginning to experience alarming saturation, especially the Mexican Social Security Institute (IMSS) and its related departments, which are facing a growing wave of patients with serious illnesses.\n\nIn response to the situation, Dr. Hugo López Gatell and the Federal Government's specialized team have presented a new national contingency plan, \"Stay at Home.\" Inspired by the quarantines implemented by other countries, this plan contemplates a total quarantine throughout Mexico."
 MEX_the_new_normal_desc: "Mexico's economic outlook looks uncertain. The Ministry of Finance projects growth between -2.8% and -1%, while the peso has suffered a significant depreciation, only contained by the measures implemented to maintain stability. Despite the global crisis caused by COVID-19, the nation has held its own thanks to oil sales, the recovery of domestic production, and the National Stoplight strategy, which has made it possible to balance public health with economic activity.\n\nAware of the challenges ahead, President Andrés Manuel López Obrador, in his Fifth State of the Nation address, has presented an economic recovery plan that will mark the beginning of what he calls \"The New Normal\"."
