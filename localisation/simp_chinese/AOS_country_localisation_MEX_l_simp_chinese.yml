 MEX_moralize_the_police: "Moralize the Police"
 MEX_moralize_the_police_desc: "The police across Mexico are seen by the public as nothing more than corrupt thugs. Various human rights abuses have been reported for years, and police brutality remains an everyday issue on the news. Systematic impunity, lack of proper communication and regulations on limited force, and cartel intimidation are the many factors plaguing our municipal forces. By introducing ethical reforms, cleaning out the remaining Federal Police forces, and using our morning press conferences to preach the importance of virtues and honesty, AMLO will put forth a major step in getting the people to trust our police once more!"
 MEX_maintain_the_us_partnership: "Maintain the US Partnership"
 MEX_maintain_the_us_partnership_desc: "While we have had major headaches dealing with the Trump Administration in the past few years, we cannot deny that they have been very valuable in giving us the intel we need to strike back against major cartel leaders and operations. They were instrumental in helping capture El Chapo years ago, and to further strain relations of our giant neighbor will be very unwise. While some in our party and base will not be happy, it is in Mexico's best interest to keep our partnership alive and well to make our security forces stronger. So long as the Americans don't try to violate our sovereignty."
 MEX_decriminalize_marijuana: "Decriminalize Marijuana"
 MEX_decriminalize_marijuana_desc: ""
 MEX_prepare_for_the_inevitable_terramato: "Prepare for the Inevitable Terremoto"
 MEX_prepare_for_the_inevitable_terramato_desc: ""
 MEX_north_american_free_trade_agreement_idea: "北美自由贸易协定"
 MEX_north_american_free_trade_agreement_idea_desc: "\n\n\n\n£GFX_MEX_nafta_banner\n\n\n\n\n\n由卡洛斯·萨利纳斯·德戈塔里于1994年签署的《北美自由贸易协定》彻底改变了墨西哥的经济格局。它为来自美国和加拿大的资本与商品敞开了大门，将国家的生产体系转向出口导向型，而这往往是以牺牲国内生产力代价的。\n2018年，该协定经过重新谈判，更名为《美国-墨西哥-加拿大协定》。尽管条款有所更新，墨西哥经济对美国市场的依赖却愈发根深蒂固。这份协定既是增长的驱动力，也时刻提醒着墨西哥：华盛顿的决策仍能轻易牵动这个国家的经济命脉。"
 MEX_militarization_of_the_public_life_dynamic: "公共生活军事化"
 MEX_militarization_of_the_public_life_dynamic_desc: "\n\n\n\n£GFX_MEX_militarization_of_public_life_banner\n\n\n\n\n\n自费利佩·卡尔德龙·伊诺约萨总统执政并宣布发起“禁毒战争”以来，墨西哥便陷入了一场常规执法力量无法遏制的暴力漩涡。为应对危机，卡尔德龙将陆军和海军从军营调至街头打击贩毒集团，这标志着军队正式开始直接介入平民生活。在恩里克·培尼亚·涅托执政期间，武装力量在内部安全事务中的角色得到了进一步强化。\n\n尽管安德烈斯·曼努埃尔·洛佩斯·奥夫拉多尔上台时承诺让军队回营，但这一承诺并未兑现。他的政府创建了以军事架构为主的国民警卫队，并将军队的职能扩展至公共管理和重大基础设施建设领域。\n这种日益加深的军事化趋势，反映出国防部和海军部在经历自米格尔·阿莱曼·巴尔德斯总统时期以来数十年的边缘化后，重新获得了政治影响力。如今，墨西哥民众已对高速公路上行驶的装甲部队、天空中盘旋的海军直升机以及城市区域发生的公开交火习以为常。\n\n军队的部署引发了公民社会的紧张情绪，削弱了民众对公民自由的感知，凸显了国家无力控制犯罪集团的现实，并引发了人们对国家稳定的担忧。然而尽管存在争议，国防部和海军部仍是国内最受信任的机构，享有公众高度认可。"
 MEX_ghost_of_the_perfect_dictatorship_idea: "完美独裁的幽灵"
 MEX_ghost_of_the_perfect_dictatorship_idea_desc: "\n\n\n\n£GFX_MEX_ghost_of_the_perfect_dictatorship_banner\n\n\n\n\n\n七十余年来，制度革命党（PRI）以近乎绝对的控制力塑造了墨西哥的政治、经济和社会生活。这个真正的政治巨兽被马里奥·巴尔加斯·略萨盛赞为“完美的独裁政权”。\n其统合主义、庇护主义威权控制体系，在国家的制度、私营部门、政治文化乃至整个社会中都留下了深刻的烙印。尽管革命制度党已不复当年的霸主地位，但遗存仍然深植于权力网络、传统精英阶层以及墨西哥政治运作的骨髓之中。事实上，当今的许多政党和组织都源于革命制度党，并沿袭了其诸多旧弊。\n时至今日，革命制度党的幽灵依然徘徊在墨西哥的政治、经济和社会生活之中。这是一个挥之不去的魅影，持续为裙带关系、腐败、官僚低效和威权惯性提供养料，从而阻碍着国家实现彻底的民主化、政治现代化以及在各领域的发展进程。"
 MEX_a_revolutionary_past_idea: "革命过往"
 MEX_a_revolutionary_past_idea_desc: "\n\n\n\n£GFX_MEX_a_revolutionary_past_banner\n\n\n\n\n\n墨西哥革命在国家社会和政治生活中留下了深刻烙印。即便在一个世纪后的今天，其核心思想——如社会正义、土地分配、国家对战略部门的参与、民族主义以及对罗马天主教等传统价值观的维护——依然持续塑造着墨西哥社会和国家形态。尽管近几十年来经济政治格局发生巨变，民众仍牢牢恪守革命时期确立的原则。这导致人们对任何可能威胁革命遗产的政治运动普遍持排斥态度，并对无论是左翼还是右翼的极端主义意识形态普遍不信任。\n\n这种历史遗产迫使政客们调整言论和政策，以避免与革命理想相冲突。墨西哥国家石油公司（PEMEX）和联邦电力委员会（CFE）等国有企业在新自由主义私有化浪潮中幸存下来，各政党也被推向中间路线，以避免社会动荡和公众不满。\n墨西哥的革命历史时刻提醒着国家在经济和社会生活中的重要性，它影响着当代政治，塑造着公民对国家和自身权利的认知方式。"
 MEX_central_american_caravans_idea: "中美洲移民车队"
 MEX_central_american_caravans_idea_desc: "\n\n\n\n£GFX_MEX_central_american_caravans_banner\n\n\n\n\n\n自2018年以来，墨西哥已成为成千上万逃离中美洲暴力、贫困和政治动荡的移民的主要通道。许多家庭加入庞大的移民队伍，试图穿越墨西哥境内抵达美国，由此引发了前所未有的人道主义挑战。\n\n墨西哥政府如今面临内外双重压力：一方面，它必须保障移民的人权并提供基本援助；另一方面，与美国的关系因美方要求遏制移民潮而趋于紧张。这一局势也使墨西哥国内舆论两极分化，一些人视这些移民队伍为团结互助的体现，也有人认为它们对国家的安全与经济构成了负担。\n\n超越眼下的危机，墨西哥如何处理这一现象，将决定其未来的政治与外交道路，并深刻反映出在人道主义角色、自身能力局限以及来自北方强邻施压之间所面临的种种张力。"
 MEX_cartel_presence_severe_tfx_edition: "严重贩毒集团影响"
 MEX_cartel_presence_severe_tfx_edition_desc: "\n\n\n\n£GFX_MEX_severe_cartel_presence_banner\n\n\n\n\n\n自20世纪末以来，墨西哥贩毒集团已从依附于哥伦比亚大毒枭的走私网络，演变为势力强大的犯罪帝国。国家权力的分散以及地方当局的普遍腐败，使他们得以在多个地区建立起地盘控制，行使着与政府平行的政治和经济权力。进入21世纪，所谓的“禁毒战争”引发了前所未有的暴力升级，大型组织分裂瓦解，催生出众多相互竞争的团伙，它们为争夺路线、据点和非法市场而混战不休。如今，这些犯罪集团不仅主导毒品贸易，还涉足敲诈勒索、非法采矿、绑架，并通过恐惧实施社会控制。其无处不在的势力侵蚀着国家权威，削弱了民众对民主制度的信任，并使任何实现和平与发展的努力都变得复杂重重。"
