 MEX_left_populism_desc: "\n\n\n\n   £GFX_Ideology_amlo_populism \n\n\n\n\n\n§Y奥拉夫多尔主义（左翼民粹主义）§!将民粹主义修辞和左翼意识形态的主题相结合。总体而言，左翼民粹主义具有反精英主义、怀疑全球化、反建制派的特征。左翼民粹主义具有极强的反军国主义倾向，其形成主要源于对90年代末至21世纪初美国军事干预的反对。左翼民粹主义者寻求通过财富再分配、社会项目和强大的政府干预来消除贫富差距。"
