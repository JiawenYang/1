l_simp_chinese:
 MEX_GATHERING_STORM_DESC: "With the fall of the PRI regime at the beginning of the new millennium and the arrival, for the first time in its history, of a full democracy, things seem not to have changed much in México. Economic, political, and social crises continue, while organized crime grows stronger day by day. Mexico seems to be approaching a new historic breaking point, the situation is becoming increasingly unsustainable. Even so, a new political project has emerged, promising to stabilize the country and correct the mistakes of the past. Will Mexico finally manage to find a period of prosperity after more than 200 years of history?"
 MEX_covid_crisis_cat: "Dealing with the Pandemic"
 MEX_covid_crisis_cat_desc: "\n\n\n\n\n£GFX_MEX_covid_decision_banner\n\n\n\n\n\n\n\nThe COVID-19 pandemic has arrived in México, and with it, the country faces the greatest health threat of the decade, and possibly one of the most serious in its recent history.\n\nThe Mexican State now finds itself before a complex dilemma: attempting to minimize economic damage by maintaining productive activity, or confronting the pandemic with strict measures that, while they could save lives, would spark social unrest and a deep economic downturn. At the same time, the Mexican healthcare system will be tested like never before. For years, it has struggled with structural problems that have weakened its response capacity, and many doubt it is prepared to face the rapid contagion speed of COVID-19.\n\nMexico faces a monumental challenge. It will be necessary to act with both speed and caution to prevent the health crisis from transforming into an authentic national catastrophe.\n\n[MEX_covid_effects_tooltip]"
 MEX_morena_party_category: "国家复兴运动派系"
 MEX_morena_party_category_desc: "\n\n\n\n\n£GFX_MEX_morena_factions_banner\n\n\n\n\n\n\n\nSince 2018, MORENA has risen as Mexico's dominant political force, unified around the figure of Andrés Manuel López Obrador. Beneath this surface unity, diverse factions with competing visions quietly coexist under his authority. For now, his influence keeps tensions contained. Yet as his leadership fades, the struggle to shape the future of the Fourth Transformation looms. \n\n [MEX_morena_obradorista_section] \n\n [MEX_morena_moderates_section]\n\n [MEX_morena_old_guard_section] \n\n [MEX_morena_technocrats_section]"
 MEX_federal_election_2021_category: "2021 Federal Elections"
 MEX_federal_election_2021_category_desc: "\n\n\n\n\n£GFX_MEX_2021_elections_banner\n\n\n\n\n\n\n\nThe campaigns for the 2021 federal elections have begun. On June 6th, nearly 95 million Mexicans are called to exercise their right to vote.\nIn these elections, around 21,000 public offices at all levels of government will be defined. Among the most relevant are the 500 seats in the Chamber of Deputies and the 15 state governorships that will be contested. It is precisely in the Chamber of Deputies where the greatest political interest is concentrated, as its control determines the viability of federal government projects. Parties seek to achieve either an absolute majority (50% plus one) or a qualified majority (two-thirds of Congress), the latter being necessary to approve constitutional reforms without the need to negotiate with the opposition.\n\nIn this way, the 2021 elections become a political referendum: Mexicans will decide whether they want López Obrador's project to continue with greater strength, or if they prefer to place a counterweight from within Congress.\n\n[MEX_federal_2021_elections_section_jhh][MEX_federal_2021_elections_section_vxm][MEX_federal_2021_elections_section_indies]"
 MEX_drug_war_decision_category: "The Mexican Drug War"
 MEX_drug_war_decision_category_desc: "\n\n\n\n\n£GFX_MEX_drug_war_mechanic\n\n\n\n\n\n\n\nSince 2006, Mexico has pursued a far more intensive campaign to crack down the drug cartels that have plagued its lands for decades. President Felipe Calderon's declaration of war has seen encroaching numbers of deaths and violence over the years, with cartels like el Cartel de Sinaloa and el Cartel de Jalisco Nueva Generacion becoming more powerful and destructive. Corruption runs rampant, and the citizens of Mexico become increasingly distrustful of the authorities. Despite President AMLO's promise of ending the War on Drugs and calling for \"hugs, not bullets,\" we must realize that until the cartels are wiped from the face of the Earth, we must continue the fight to take our country back, lest we are to be seen as a failed state and have our neighbor up north decide to wipe everyone out."
