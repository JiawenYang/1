 MEX_andres_manuel_lopez_obrador_char: "安德烈斯·曼努埃尔·洛佩斯·奥夫拉多尔"
 MEX_andres_manuel_lopez_obrador_char_desc: "安德烈斯·曼努埃尔·洛佩斯·奥夫拉多尔，更为人熟知的名字是AMLO，出生于塔巴斯科州特佩蒂坦市一个从事农业贸易的商人家庭。他自幼目睹墨西哥南部的贫困与艰辛，这些经历深刻地塑造了他日后的政治世界观。\n\n后来他移居墨西哥城，进入墨西哥国立自治大学攻读政治学与公共管理专业。正是在此期间，他日益深入地参与到国家政治中。回到塔巴斯科后，他最初加入了革命制度党，但在20世纪80年代的内部纷争后脱离该党，转而投身于夸特莫克·卡德纳斯领导的反对派阵营。他很快成为民主革命党的成员，凭借个人魅力和政治手腕迅速崭露头角。\n\n2000年，他作为民主革命党候选人当选墨西哥城市长。任期内他以亲民形象巩固了声誉，特别是在维森特·福克斯·克萨达总统发起旨在剥夺其从政资格的争议弹劾程序之后。这次风波非但未能削弱其影响力，反而使洛佩斯·奥夫拉多尔在全国范围内声名鹊起。\n\n他曾于2006年和2012年两度参选总统，均未成功。在与民主革命党内部产生分歧后，他创立了自己的政党——国家复兴运动。在2018年的第三次竞选中，他以超过50%的得票率最终赢得总统大选。这场胜利使国家复兴运动取代传统政党，成为墨西哥的主导政治力量。洛佩斯·奥夫拉多尔自称“第四次变革”的领导者，他将这一变革计划置于与墨西哥独立（1810年）、改革（1857年）和革命（1910年）同等的历史高度。如今，他领导着一个两极分化的国家，数百万民众将他视为亲民总统而深受爱戴，同时，也有人因担忧他的对抗性执政风格和权力集中化而对他提出严厉批评。"
