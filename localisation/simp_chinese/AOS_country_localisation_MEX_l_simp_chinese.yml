 MEX.1.t: "Day Zero"
 MEX.1.d: "Dr. Hugo López-Gatell was in his office at the Ministry of Health headquarters around six in the evening. He was analyzing how COVID-19 was evolving in China, South Korea, and some European nations, as well as how those countries were dealing with the crisis. At the same time, he was preparing the report on how Mexico would detect and confront the virus, to be presented at the next day's morning press conference.\nGatell knew it was inevitable that COVID-19 would reach Mexico. With his epidemiological studies and the speed at which the virus was spreading to more countries, he was certain that it would become a global pandemic. His goal was to contain it as best as possible when it finally arrived. He had been up all night for several days, trying to plan a national lockdown that would affect the economy as little as possible. The president wanted the economic damage to be minimal, but Gatell knew that would be nearly impossible. Even so, no one dared to contradict President López Obrador.\nThis dynamic was so evident that a joke circulated among the cabinet secretaries and advisors: \"If the president asks for the time, what do you answer? Whatever time you want, Mr. President.\n\"This lack of space for criticism and debate only increased the tension. While Gatell was lost in these thoughts and the growing pressure of a job that, overnight, had become incredibly stressful, his office phone began to ring.\n\"Yes, hello?\" Gatell answered. \n\"Good afternoon, Dr. Gatell,\" said Olivia Pérez, Mexico City's Secretary of Public Health. \n\"Yes, what's up, Olivia?\" Gatell replied, his tone revealing that sleep was beginning to take hold.\n\n\"About the 35-year-old man who arrived from Italy… The doctor who performed the second test, the one from InDRE, just gave me the results. Positive for SARS-CoV-2. It's official: we have our first patient infected with the new virus. He has mild symptoms, and we traced that he was in contact with nine people. We've already put him in isolation,\" Olivia explained, with a small but visible tone of concern.\n\"Damn…\" was all Gatell could manage to say. He immediately started thinking about how he would tell the president and how he would present the information at the morning press conference.\n\"Okay, Olivia, find out who else he was in contact with and put them in isolation too. I'll start preparing the presentation for tomorrow. Send me all the data you have.\"\n\"Okay, Gatell, I'll send it to you in an hour. See you later.\"\n\"Goodbye, Olivia. Take care… and say hi to Claudia for me.\"\nGatell hung up the phone and remained silent for a few seconds, thinking about what was to come."
 MEX.1.a: "This is Just the Beginning"
 MEX.2.t: "The New Leadership inside the Party"
 MEX.2.d: "The time has come to renew MORENA's national leadership. The Instituto Nacional Electoral will be in charge of coordinating this internal process, in which the party's grassroots will be able to elect their next national president. Yeidckol Polevnsky has failed in her attempt to remain for another term at the head of the party, opening the way for a contest that, at least in official discourse, promises to be clean, transparent, and fair. However, everyone within MORENA knows that President Andrés Manuel López Obrador's decision will be the most determining factor in the final election. The national presidency of Mexico's most important party is no minor position: it implies control over strategic decisions, access to vast political resources, and enormous influence over the movement's direction. Internal tensions have increased as the election approaches, and the various factions are maneuvering to impose their candidate. In recent days, Porfirio Muñoz Ledo has consolidated himself as a serious contender for the leadership. Nevertheless, his growing distancing from President López Obrador and MORENA in general raises doubts about his real chances of victory.\n\nThe President's decision is:"
 MEX.2.a0: "Martí Batres will succeed in maintaining the line of Obradorismo"
 MEX.2.a1: "Bertha Luján will maintain Party Unity"
 MEX.2.a2: "Alejandro Rojas will consolidate MORENA"
 MEX.2.a3: "Mario Delgado will bring a new vision to MORENA"
 MEX.2.a4: "Unexpectedly, Porfirio Muñoz Ledo wins the election"
 MEX.3.t: "What the wind is to Juárez"
 MEX.3.d: "The global economic collapse, caused by political instability in Saudi Arabia and the global health crisis, has triggered a surge in oil prices. Numerous Saudi fields have been paralyzed, abruptly disrupting international supply chains. Under normal conditions, this scenario would have hit Mexico hard, given PEMEX's stagnant production and the country's heavy reliance on gasoline imports. However, the recent discovery of the \"Lázaro Cárdenas\" oil field has completely altered this equation. With international markets desperately seeking new stable suppliers, Mexico finds itself, unexpectedly, at the center of the storm. The extraordinary dimensions of the field have radically transformed the international perception of the country. Investment funds, credit rating agencies, financial organizations, and foreign governments are beginning to consider Mexico a viable alternative to compensate for the loss of global supply. As a result, the flow of capital, both national and foreign, is increasing rapidly, and access to lines of credit for the Mexican State is becoming unusually easy. Backed by this newfound confidence, the government of Andrés Manuel López Obrador plans to accelerate its infrastructure projects, expand its social policies, and advance toward what the president has described as \"energy sovereignty\" Money is flowing, employment is growing, and a sense of prosperity is rapidly spreading among the population. However, various analysts warn that, just scratching the surface, this oil bonanza reveals fragile foundations. If oil prices correct or if international credit lines are closed, this prosperity could evaporate as quickly as it arrived. For now, however, Mexico appears to be prospering in an increasingly turbulent world."
 MEX.3.a: "For the Rescue of Sovereignty"
 MEX.4.t: "Close Call"
 MEX.4.d: "It was early in the morning. Omar García Harfuch, Secretary of Security and Civilian Protection, was on his way to meet with the head of government of Mexico City Claudia Sheinbaum. He was going to deliver crime reports to the city's Security Cabinet, and everything seemed normal. He was in an armoured vehicle, so despite the situation being tense, he was confident.\n\nHowever, as he passed Lomas de Chapultepec, at around 6:35, he was intercepted between Paseo de la Reforma and Monte Blanco by an unmarked truck. A dozen gunmen got out, and started shooting the vehicle with all kinds of weapons: Barrett .50, fragmentation grenades and other heavy armament. Despite the great damage to the armoured vehicle itself, and the death of two bodyguards as well as an innocent woman, he survived after being hit three times. CJNG has been accused of the attack by Harfuch on Twitter, while he recovers at Médica Sur Hospital."
 MEX.4.a: "Hunt down whoever did this!"
 MEX.5.t: "The Pre-Pre-Pre Campaigns"
 MEX.5.d: "Jorge, now a 32-year-old man, walked out of the warehouse where he worked as assistant director of operations. His shift was, in theory, from 7 to 2, but that day he had stayed until 5 in the afternoon at the direct demand of his boss. It had been an exhausting day. COVID-19 restrictions had drastically reduced the place's operational capacity, and the pressure was constant.\n\nHe was still wearing his black face mask as he headed for the exit. He was ready to leave, but bad luck wouldn't let him go, his Nissan Tsuru was still in the shop. Apparently, the old clunker's engine had finally given up. -\"God dammit,\" he thought to himself, \"I have to take the fucking bus again.\" Stress was completely overwhelming him. Work was consuming him, the mask all day, the problems with his parents, the accumulated fatigue. He walked toward the bus stop while observing his surroundings, and that was when he noticed it: political propaganda had already invaded Guadalajara.\nA huge billboard showed the Mayor's face: \"With Lemus, we're doing well.\" Further on, a sign stuck to a post clamored, \"In these elections vote, citizen. Vote Orange.\" On an electronic screen, another message flashed: \"Let's make history for Guadalajara. Vote José María, Vote MORENA.\" -\"Bastards. . .\" Jorge muttered, \"they're already starting to fill the city with trash.\"\n\nHe kept walking. The bus would still take a while to arrive, as always, and he was already hungry. Then he saw a torta stand on the corner. \"Well, at least I can eat something. Knowing this shitty public transport.\" He approached the stand. -\"Good afternoon, jefe. What would you like?\" asked the man attending. -\"Give me a 'Cubana' and a Coca-Cola, please,\" Jorge said. -\"Sure thing, right away.\"\n\nThe man took out a glass of Coca-Cola and handed it to him. Jorge, exhausted, sat in one of the chairs at the stand while waiting for his torta. -\"So you were telling me, Doña Silvia, who are you going to vote for?\" the torta-seller asked. -\"Well... what can I tell you, Don Fabricio? We already know they're all the same. PRI, PAN, MORENA... or now that new Movimiento Ciudadano. They already know who is going to win, they just want to pull the wool over our eyes.\" Fabricio let out a laugh. -\"Hahaha, well yes, Doña Silvia.\"\n\nJorge smiled to himself. \"Apparently, many of us think the same,\" he said. -\"ey, it's always the same every election,\" the woman continued, \"They promise and promise... and then they forget.\" -\"Here is your torta, boss.\" \"Thank you very much,\" Jorge replied, as he took the Cubana and prepared to take the first bite.\nWhile he chewed, he looked again at the billboards lighting up the avenue, the colors, the smiling faces, the recycled promises, \"We are doing well,\" \"The change is now.\" It seemed they had nothing new to say anymore. . . He kept looking at more propaganda; this time, there were two billboards particularly close to a bridge with the slogans"
 MEX.5.a: "Together We Make History"
 MEX.5.b: "Let's Go For Mexico"
 MEX.6.t: "The Great Obrador's Plan"
 MEX.6.d: "After millions of citizens turned out to cast their votes, the will of the nation has been unmistakably expressed. Against the backdrop of a historic health crisis and an intensely polarized campaign, the people have spoken. MORENA and its allied parties have secured a decisive victory, achieving a supermajority in the Legislative Branch of the government. This result not only reshapes the balance of power in Congress, but effectively removes the institutional obstacles that had previously limited the scope of the administration's agenda.\n\nWith this overwhelming mandate, the government now claims the political capital necessary to advance the Great Plan of the President without compromise. Constitutional reforms, structural changes, and long-delayed projects are once again on the table, backed by legislative certainty and popular legitimacy. Supporters hail the result as a clear endorsement of Andrés Manuel López Obrador's vision, while critics warn of an unprecedented concentration of power. Nevertheless, in the eyes of the ruling coalition, history has turned a page. The Fourth Transformation marches forward, propelled by electoral victory and the promise of a profound reconfiguration of the Mexican State."
 MEX.6.a: "The 4th Transformation will change Mexico..."
 MEX.7.t: "Together we will Keep Making History"
 MEX.7.d: "After millions of citizens turned out to cast their votes, the will of the nation has been expressed, though in a more restrained and fragmented manner than many had anticipated. In an election held under extraordinary circumstances, marked by a global pandemic and deep political polarization, MORENA and its allied parties managed to retain a simple majority in the Legislative Branch of the government. While this result secures the coalition's position as the dominant force in Congress, it falls short of the supermajority required to unilaterally push through constitutional reforms.\n\nThe outcome delivers a mixed mandate. On one hand, it allows the government to continue advancing key elements of the President's agenda, ensuring legislative control over budgets, ordinary laws, and strategic initiatives. On the other, it forces the administration to negotiate with opposition forces to pursue deeper structural changes. Supporters interpret the result as a reaffirmation of the Fourth Transformation, albeit under more complex conditions. Critics, meanwhile, see it as a necessary institutional counterweight. The Fourth Transformation continues its march forward—but now along a narrower path, shaped by compromise, negotiation, and a more balanced distribution of power within the Mexican State."
 MEX.7.a: "The People has spoken"
 MEX.8.t: "The Opposition Comeback"
