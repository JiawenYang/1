 MEX.11.t: "Breaking Point"
 MEX.11.d: "It seems our efforts to destroy the cartels were either too weak, or so effective we pushed them into a corner. The major cartels in the north are taking control over great parts of the country, effectively proclaiming active conflict against the president himself. Thousands of federal agents and soldiers are getting trapped in the gunfire, as authority of the central government gets weaker and weaker by the day. Calls for reinforcements are getting louder all over the country, it's just not possible to help everyone at the same time: this must have been a coordinated effort by multiple cartels attempting to force our surrender.\n\nBut we will not surrender this time. We were puppets of the cartel for decades, reduced to compliance in the local level, corrupted in the national level. They kill candidates, terrorize the population, kidnap people, promote prostitution, kill immigrants... enough is enough. A part of the armed forces is also cutting communications with us. TRAITORS!\n\nThis is Mexico's most important time since the early days of the war of independence, since we fought the French back to the sea, the time to strike is now!"
 MEX.11.a: "The Mexican Man is not a COWARD"
 MEX_explain_factions_tt: "A chain of Events will explain the different factions inside MORENA"
 MEX_flavor.5.b: "We will keep Transforming Mexico"
 MEX_flavor.15.t: "The fall of Don Enrique"
 MEX_flavor.15.d: "Don Enrique was a major regional leader of one of the most important cartels in all in Sonora. He lived a life of luxury, excesses and prostitutes. But nothing lasts forever. Enrique was celebrating the first birthday of his second son, in a lavish party in which many other cartel members were invited. They still had their guns on them just to feel safe, but nobody expected police to enter: the boss wanted everything to be perfect that day, so his cartel was tasked with clearing the zone from feds, and informants were all over the surroundings, with orders to warn him of any trouble beforehand. It was all supposed to be perfect that day.\n\nAnd yet, at approximately 3 AM, the party was interrupted by a dozen members of the military, demanding everyone to surrender at that instant. As expected, the bodyguards quickly drew weapons and started a shooting. Some family members were hit, and the boss himself ran for his life. But this was also prevented by the armed men, who shot him in the leg and forced him to tell everyone to surrender. One soldier was injured, one dead. Four cartel members were killed, along with Enrique's mother, and six others were injured.\n\nThe drug lord was captured alive, an achievement worth celebrating, since he could be interrogated to get crucial information to dismantle his cartel. In exchange of collaborating with the police, his sentence was reduced from life in prison to 34 years, in charge of murder, drug trafficking and other related crimes. In only one night, he went from deciding who lives and who dies, to a simple prisoner.\n\nThe cartel suffered a great hit by the capture of Enrique, nicknamed \"El Gringo\" because he was born in California, despite the fact his parents brought him to live in Mexico just two years later because of a job opportunity. He grew to be considered a major player in the Mexican drug war, and yet he was captured like the lowest of the scum. His cartel was expelled from the state of Sonora not long after.\n\n"
 MEX_flavor.15.a: "Now the streets are a little safer."
 MEX_flavor.19.t: "The Battle of Cajeme"
 MEX_flavor.19.d: "Santiago had joined the army because it was his family's tradition. He knew the cartel situation was not ideal, but he grew used to their violence. However, what was reported in the area around the municipality of Cajeme, was very out of the ordinary. The cartels were executing civilians, seemingly for no reason, in the middle of the day. They demanded the end of \"an hostile siege against private citizens' wealth\", or the violence would continue. He only joined the army a few weeks ago, and did not expect to be sent to real action so soon, but the situation was desperate: the local police was almost completely wiped out. Only a few words were said during the journey there: \"Shoot to kill\".\n\nWhen they finally got out of their vehicles, they were immediately received by shots from the distance. They used human shields, and battled with fierce brutality. Were they from Caborca Cartel? Gulf Cartel? Sinaloa Cartel? It didn't matter. He and his group managed to kill the majority of them, the rest escaped to rural areas. Two soldiers were killed during the operation, but the cartels lost 23 men. Santiago leaned forward to get a better look of one of them. He looked like a 16 years old. \"Fucking hell\" he said to himself, before returning to his base. \"They are monsters\".\n\nThe conflict was far from over. Soon, reinforcements from the cartels came.\"Why do they do this?\" he thought, as he shot the armed men inside a destroyed house. However, he was not fast enough this time, and he was shot critically in his chest. The battle was fierce, nobody would help him in time. He would die right there, like many of his comrades. \"Why did I have to join the damn army?\" he whispered, with his last breath. The battle was fought around him, but the enemies didn't shoot him to distract his fellow soldiers with wounded men that needed to be taken care of. \n\nAt last, he died. He was only one of the many casualties the Mexican armed forces got from operations against the cartel. Organized crime was taking control."
 MEX_flavor.19.a: "Retreat! They outnumber us!"
 MEX_flavor.20.t: "Xpujil, Before and After the Blast"
 MEX_flavor.20.d: "For months before the blast, Xpujil had lived in a state of quiet strain, as if the town itself had been pulled too tight.\nAmong  baskets of maize, chiles, squash blossoms, achiote, sour oranges, and warm pan in paper bags to the sweet smoke of copal rising from small roadside altars. Candles lit beside saints, their wax dripping onto stone, while crosses tied with faded ribbon stood nearby with offerings left for the old spirits of the forest. In Xpujil, Catholic prayer and Maya memory existed side by side, never fully separate.\n\n\"These hills used to be a beauty,\" an old man muttered one morning, looking toward the worksite. A younger man beside him shrugged. \"Sí, but the work is needed.\"\nThat was the argument everywhere, in streets, kitchens, tiendas, and ejido assemblies. The Tren Maya had become more than a project. It had become a wound, a promise, a threat, a future no one agreed on. Elders spoke of land as inheritance, of milpa, cenotes, and the ceiba tree. Others spoke of jobs, and of children who had already left for Mérida or Cancún in search of opportunity.\nThen, one afternoon, the blast came. It struck a construction site along the Tren Maya corridor just outside town, where the jungle had been cut back into pale, exposed earth. The flash was sudden, the sound violent. Soil burst upward. Metal flew. A fuel line ruptured, and smoke rose in a dark column above the cleared strip of land. Workers stumbled back in panic. One fell to his knees. Another shouted for help. A foreman yelled, \"Atrás! Atrás!\"\nFrom the highway, the smoke rose over the canopy. In town, people heard the sirens and stepped into their doorways. A woman at her stall crossed herself. A child pointed toward the horizon. Dogs barked before the first vehicles arrived.\nBy evening, soldiers had sealed the site. Officials confirmed what everyone already knew: the attack had been aimed at the Tren Maya, not the town.\nAnd still, as the smoke thinned above the trees, the argument remained."
 MEX_flavor.20.a: "Terrorist Scum"
 MEX_flavor.21.t: "A Stain in the Gulf"
 MEX_flavor.21.d: "Daniela, Sofía, and María were enjoying the last days of their vacation . . . well, almost vacation. They were also getting ahead on a university project. They had decided to take a trip to Paraiso, one of the quietest and least crowded beaches in Tabasco. Without inflated prices, hordes of tourists, and with an almost untouched environment, it was the perfect place to relax and, at the same time, advance their research on how oil spills affect marine life. This particular beach had recently seen an increase in tar, solid petroleum residue carried by the tide.\n\nThe three of them were making notes in their notebooks about the surprising amount of tar on the sand, as the first warm rays of dawn began to appear and bathe Paraíso in light. That's when María asked:\n\n\"What's causing all this tar? According to PEMEX reports, there aren't any spills nearby.\" Daniela replied almost without looking up from her notebook.\n\"They're probably covering up a leak, a news report of an oil spill would be a huge scandal for the government, so early in the year.\"\nWhile they were debating, Sofía was lost in thought. She was so absorbed that she barely heard their voices. She was thinking about her family, whom she hadn't seen in a long time, mainly because of her father's problems. A loud squawk from a seagull jolted her out of her reverie. She felt exhausted from work, the school, and family conflicts. She needed to clear her head, even if just for a moment.\nShe turned her head and saw a sign: \"Boat for rent for offshore excursions.\"\nInterrupting Daniela and María's discussion, she floated the idea:\n\"Hey . . . what if we take a break for a while? This boat is for rent for a short trip along the beach.\"\nMaría agreed almost immediately. Daniela, however, hesitated.\n\"Come on, Dani, it'll be quick\". -Sofía insisted. \"But... What about work? \"We have to present something decent when classes resume,\" Daniela replied.\n\"De-stressing for a while will help us work better,\" Sofía said calmly. A simple argument. . .but enough. Daniela finally gave in.\n\nThey approached the boat, where Don Julián, an elderly fisherman with a stern face, offered tourist excursions. After paying the 200 pesos, the girls boarded. Don Julián started the engine, and the trip began.\nAs they headed out to sea, Daniela asked, \"Hey, Don Julián, do you know what's causing all that tar on the beach?\"\n\"I'm no expert,\" he replied, \"but for several weeks now, when I go fishing, I've seen a huge black stain in the sea, as black as night. I suspect it's oil. I already reported it... but the authorities just won't listen to me.\" \"Can you take us to the site of the stain?\" María suggested, now even more intrigued.\nDon Julián nodded silently and changed course. When they arrived, the four of them were speechless. The oil slick was immense. It was difficult to estimate its size, but it was undoubtedly colossal.\n\"It's bigger than the last time I saw it,\"-Don Julián murmured.\nThe three young women took out their cell phones and began recording videos and taking pictures.\n\"It's definitely oil,\" Daniela said.\n\"There must be a huge amount down there,\" Sofía added. \"We have to take these photos to PROFEPA,\" María concluded.\""
 MEX_flavor.21.a: "Incredible"
 MEX.68.t: "The Mexican Catastrophe"
 MEX.68.d: "Two Great friends are in the middle of scrubland over the San Luis Potosi state,'El Beni' a new member of the Cartel one of them is digging a ditch for a Cartel traitor's body. 'El Chociloco' with more experienced as a Cartel Member told his friend:\n\"Just how Jose Alfredo said: 'Life is Worthless', for fucking 3,000 pesos that motherfucker almost killed us.\".\n\nBeni, not so adapted to the Violence, is still shocked due to the act he was just part of. He stops digging, look back to his friend and asks his companion, his voice breaking with guilt and fear:\n\"Tell me the truth 'mi Cochi', Do you feel anything about killing someone just like that?. I mean, aren't you afraid of going to hell?\"\n\n With cynical calm, a gaze hardened by years of violence, and utter disillusionment, El 'Cochi' cuts through his religious fears and respond:\n\"Hell, my ass... Hell is right here!\""
 MEX.68.a: "O te chingas o te jodes"
