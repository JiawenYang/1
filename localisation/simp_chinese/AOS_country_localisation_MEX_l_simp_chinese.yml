 MEX_massive_social_programs_dynamic: "Massive Social Programs"
 MEX_massive_social_programs_dynamic_desc: "\n\n\n\n£GFX_MEX_massive_social_programs_banner\n\n\n\n\n\nSince taking office, the government of the Fourth Transformation has launched an ambitious network of social programs aimed at reducing poverty and inequality across Mexico. Scholarships for students, financial support for the elderly, people with disabilities, and unemployed youth, as well as investments in marginalized communities, form the backbone of a policy that seeks to restore the State's central role in social welfare. \nThese initiatives have earned the administration strong popular support, especially among vulnerable sectors. However, they also strain public finances and fuel criticism from the opposition, who denounce them as clientelist and unsustainable in the long term.\nDespite the controversy, these programs remain one of the most visible pillars of the current political project. reinforcing the government's connection to the people and reshaping Mexico's social landscape."
 MEX_large_scale_deployments_national_guard: "National Guard Large Scale Deployments"
 MEX_covid_generic_name: "Healthcare System Status"
 MEX_covid_light_green: "COVID Pandemic: Green Light"
 MEX_covid_light_green_desc: "The COVID-19 pandemic is under control. The majority of the population is not infected, and new cases can be handled without difficulty. The IMSS and its reformed dependencies operate below their usual capacity, maintaining the stability of the healthcare system. The State can concentrate on sustaining the economy and implementing moderate preventive measures."
 MEX_covid_light_yellow: "COVID Pandemic: Yellow Light"
 MEX_covid_light_yellow_desc: "Infections are beginning to increase steadily, with hundreds of daily cases nationwide. The IMSS and its dependencies report rising hospital occupancy, while the private system is starting to show signs of pressure. Immediate action is required to prevent accelerated deterioration. Poor management could lead the health system to a much more critical situation."
 MEX_covid_light_orange: "COVID Pandemic: Orange Light"
 MEX_covid_light_orange_desc: "The healthcare system faces severe pressure. Available beds are quickly running out, oxygen tanks are scarce, and medical staff are working at their limit. COVID-19 cases are already counted in the thousands, affecting both the public and private sectors. The outlook is deteriorating rapidly. The state must act urgently to prevent the situation from becoming irreversible. It is still possible to contain the crisis, but the margin for maneuver is shrinking."
 MEX_covid_light_red: "COVID Pandemic: Red Light"
 MEX_covid_light_red_desc: "The IMSS and its dependencies report total hospital saturation. In numerous hospitals, there are no longer enough beds, oxygen, or sufficient staff to care for the thousands of daily cases, nor for other medical emergencies. The country is on the brink of sanitary collapse. Without immediate, forceful, and effective intervention, or even a stroke of luck, the system will not be able to sustain itself for much longer. The state must prepare for the worst consequences."
 MEX_covid_light_collapse: "COVID Pandemic: Healthcare System Collapsed"
 MEX_covid_light_collapse_desc: "The IMSS and its dependencies have succumbed to the magnitude of the pandemic. COVID-19 has completely overwhelmed the system's capacity, many patients do not receive attention and die due to a lack of basic resources. Medications, beds, oxygen tanks, and medical personnel are scarce. Normally treatable diseases become fatal due to the lack of attention; the private sector still remains firm, but unfortunately, private health is a luxury few mexicans can afford. The State has failed, public trust is collapsing, and it will take a long time to reconstruct the national healthcare structure."
 MEX_iron_quarentine: "Iron Quarantine"
 MEX_mexican_resconstruction_idea: "The Mexican Reconstruction Plan"
 MEX_collapsed_authority_tfx: "Collapsed Authority"
 MEX_collapsed_authority_tfx_desc: "CHAOS! As constitutional order collapses over the country, so do the public services. Healthcare, education, the economy... all become secondary struggles in the face of war. Foreign businesses get out, millions of our own people abandon the war-torn country, and many others fall into the hands of insurgent groups, cartels and other violent guerrillas. The distribution of things as basic as water and food have been disrupted over large territories, and combined with the military operations, results in many casualties among the civilian population. The state of collapse of our northern neighbour only worsens the situation."
 MEX_CSTO_cooperation: "Mexican-CSTO Cooperation"
 MEX_NATO_cooperation: "Mexican-NATO Cooperation"
 MEX_death_of_the_giant_idea: "Death of the Giant"
 MEX_death_of_the_giant_idea_desc: "\"Poor Mexico. So far from God and so close to the United States.\"\n   - Porfirio Díaz\n\nThose words have echoed within the souls of every Mexican who has lived under the shadow of our Northern neighbor. Now, that shadow no longer looms over us, for the Giant of the Americas has collapsed under its own weight into warring factions vying for domination. The screams and cries of our neighbors slaughtering each other frighten our people. But the worst casualty is the loss of our economic interdependence, and it has crippled our economy comparable to that of the Lost Decade. Meanwhile, elements within our population are beginning to stir as they declare the death of America the time to free our shackles at the cost of republican ideals."
