l_simp_chinese:
 ZZZ_chainrun:0 "事件链跑通器"
 ZZZ_cr_kr_01_talks_open:0 "阶段 1/4—邦联成立（zzz_kor.1 → .2）"
 ZZZ_cr_kr_01_talks_open_desc:0 "阶段 1/4。在 KOR 上按 zzz_kor.1.a、.2.a 的顺序直接执行效果：谈判成功，KOR 成立 Juche 阵营并拉 NKO 入盟。两个政府都还在，不吞并、不派发事件。"
 ZZZ_cr_kr_01_talks_open_tt:0 "终点是「两个国家、一个军事同盟框架」。因为 .2 先建 Juche 阵营，阶段 3 里并入太约那一步会失败并留在 Juche——这是链条的真实结果，不做修正。"
 ZZZ_cr_kr_02_unify:0 "朝韩链 2/5：走向统一（zzz_kor.2）"
 ZZZ_cr_kr_02_unify_desc:0 "仅在 zzz_kor.1 选了 a（未出现 KOR_reunification_talks_failed）时可用；触发邦联成立事件 zzz_kor.2。"
 ZZZ_cr_kr_02_unify_tt:0 "若已置 KOR_reunification_talks_failed，判定为谈崩，本步拒绝执行。"
 ZZZ_cr_kr_03_breakdown:0 "朝韩链 3/5：谈崩（zzz_kor.3）"
 ZZZ_cr_kr_03_breakdown_desc:0 "仅在 zzz_kor.1 选了 b（KOR_reunification_talks_failed 已置）时可用；触发真实事件 zzz_kor.3。"
 ZZZ_cr_kr_03_breakdown_tt:0 "未置该旗标说明第 1 步尚未选 b，本步拒绝执行。"
 ZZZ_cr_kr_04_kpr:0 "朝韩链 4/5：KPR 成立（zzz_kor.6）"
 ZZZ_cr_kr_04_kpr_desc:0 "校验 NKO 拥有 604、KPR 国号或 korean_postwar_settled 已置后，触发 zzz_kor.6。统一落地必须由真实战后决议完成，本工具不代吞并。"
 ZZZ_cr_kr_04_kpr_tt:0 "卡点会写明缺 owns_state 604，还是缺真实战后决议。"
 ZZZ_cr_kr_05_election:0 "朝韩链 5/5：全半岛选举（zzz_kor.8 / zzz_kor.10）"
 ZZZ_cr_kr_05_election_desc:0 "NKO 路线触发 zzz_kor.8；KOR 路线触发 zzz_kor.10。按真实旗标自动选路。"
 ZZZ_cr_kr_05_election_tt:0 "两条路线的 election_done 旗标都会检查，已执行则停止。"
 ZZZ_cr_ru_01_putin_smo:0 "俄乌链：普京路径（宣战特别军事行动）"
 ZZZ_cr_ru_01_putin_smo_desc:0 "在 SOV 上直接执行国策 SOV_declare_smo 的效果（调用 DSW_SOV_declare_war_on_ukraine），不派发事件。"
 ZZZ_cr_ru_02_medvedev_wall:0 "俄乌链：梅德韦杰夫路径（全国讲话）"
 ZZZ_cr_ru_02_medvedev_wall_desc:0 "在 SOV 上直接执行国策 SOV_address_the_nation 的效果：加威胁、调用 DSW_SOV_declare_war_on_ukraine、给 UKR 加 UKR_to_the_last。"
 ZZZ_cr_ru_03_communist_saturn:0 "俄乌链：俄共路径（小土星行动）"
 ZZZ_cr_ru_03_communist_saturn_desc:0 "在 SOV 上直接执行国策 SOV_operation_little_saturn 的效果：加威胁、调用 DSW_SOV_declare_war_on_ukraine、给 UKR 加 UKR_to_the_last。"
 ZZZ_cr_eur_01_escalate:0 "欧陆战争链：全面升级（开战 + 参战方标记）"
 ZZZ_cr_eur_01_escalate_desc:0 "一次性执行 ZZZ_eur_begin_war 与 ZZZ_eur_mark_participants。仅 SOV 可用：两个效果都读 ROOT，点决议的国家必须是 SOV。不派发事件。"
 ZZZ_cr_gaw_01_korea_ignites:0 "GAW 链：半岛引爆大亚洲战争"
 ZZZ_cr_gaw_01_korea_ignites_desc:0 "KOR 先对 NKO 开战并置战争旗标，随后 CHI 执行 ZZZ_start_gaw_from_korea。仅 CHI 可用：GAW 初始化读 ROOT。不派发事件。"
 ZZZ_cr_usa_01_paralysis:0 "美国脑死亡链：遇刺 → 民主党大胜 → 联邦停摆"
 ZZZ_cr_usa_01_paralysis_desc:0 "在 USA 上按 usacw.5.a、.6.a、.7.a 的顺序直接执行效果，直抵脑死亡节点。不派发 taiwan_detente.5；2021 旧链 .15–.21 属并行路线，未走。"
 ZZZ_cr_balk_01_withdraw_federation:0 "巴尔干链：全批退约 + 中国扶持联邦"
 ZZZ_cr_balk_01_withdraw_federation_desc:0 "八国依次执行 zzz_balkan.20.a 的退约效果（北约 + 欧盟），随后执行中国 PRC_balkan_federation_support 的成功分支：伙伴理念、七国影响力置换、塞尔维亚 +100 政治点、七国加入同意旗标。不派发 zzz_balkan.30。"
 ZZZ_cr_tw_01_forced_reunification:0 "台海链：强制统一路径（一揽子夺台国策）"
 ZZZ_cr_tw_01_forced_reunification_desc:0 "在 CHI 上执行 prc.124.a 原文：置强制开战旗标、加载台海国策树并连续完成 10 个台海国策（含夺金门、封锁台湾、静默黎明）。钓鱼岛爆点 prc.546 属互斥分支，未走。"
 ZZZ_cr_ip_01_kashmir_war:0 "印巴链：克什米尔开战（印度宣战）"
 ZZZ_cr_ip_01_kashmir_war_desc:0 "在 RAJ / PAK 上执行 PAK.3 原文：印度对巴基斯坦宣战并加百万冲突理念，巴基斯坦加理念、扣 143750 人力、换战时编成。不派发 PAK.7 与 prc.134。"
 ZZZ_cr_sea_01_asean_turnover:0 "东南亚链：东盟换届（老挝王政 + 柬埔寨自由化）"
 ZZZ_cr_sea_01_asean_turnover_desc:0 "执行 asean.6.a 的两支：老挝改国名妆饰为君主制、换王政领袖与 nationalist 执政；柬埔寨转社会自由主义、60 天选举。本工程没有独立的东南亚战争链，只有这一条 asean 事件。"
 ZZZ_cr_mew_01_palestine_victory:0 "中东 MEW 链：阿拉伯胜利结算（巴勒斯坦吞并以色列）"
 ZZZ_cr_mew_01_palestine_victory_desc:0 "执行 MEW 结算A 的收尾：PAL 吞并 ISR 与 HAM，置 MEW_palestine_victory / MEW_settlement_done / skip_default_capitulation 并清除 MEW_sixth_war_ongoing。跳过戈兰与南黎巴嫩州转移、参战方白和、mew.10 / mew.11。该链需先有 MEW_sixth_war_ongoing。"
 ZZZ_cr_kr_02_confederation_deepened:0 "阶段 2/4—邦联深化（共同机构）"
 ZZZ_cr_kr_02_confederation_deepened_desc:0 "阶段 2/4。把朝韩两国并入 korea_confederation_Tech_Share 科技共享组，置 korean_confederation_formed / korean_confederation_deepened，并把 KOR 的 reunification_chance 抬到 12，落在 zzz_kor.1 的最高一档谈判成功倾向（>10）。不派发事件。"
 ZZZ_cr_kr_03_peaceful_unification:0 "阶段 3/4—和平统一（KOR 吞并 NKO）"
 ZZZ_cr_kr_03_peaceful_unification_desc:0 "阶段 3/4。在 KOR 上按 zzz_kor.5.a、.10.a 直接执行：吞并 NKO，改写政体与全部 24 项政党支持率，然后举行全半岛选举。若 KOR 仍在 Juche 阵营，并入太约失败（链条真实结果）；未点前两阶段时会并入太约。"
 ZZZ_cr_kr_04_north_annex:0 "阶段 4/4—北吞南（军事）"
 ZZZ_cr_kr_04_north_annex_desc:0 "阶段 4/4。在 NKO 上按 zzz_kor.4.a、.6.a 直接执行：吞并 KOR 并接收其部队，补 604-608、1099 核心，改写政体与全部 24 项政党支持率，挂上 ZZZ_spirit_korea_unified；同时置位 zzz_korea_north_annexed 与 korean_postwar_settled，锁死和平分支。"
 ZZZ_cr_ru_04_russian_victory:0 "俄乌链：俄方胜利结算（DSW_SOV_resolve_russian_victory）"
 ZZZ_cr_ru_04_russian_victory_desc:0 "执行胜利结算效果：置胜利旗标、加载战后国策树、触发法方结果分支并落地东欧结算。效果自带守卫，未开战时整段空转；原文脚本内部的事件派发不会被跳过。"
 ZZZ_cr_ru_05_russian_defeat:0 "俄乌链：俄方战败结算（DSW_SOV_resolve_russian_defeat）"
 ZZZ_cr_ru_05_russian_defeat_desc:0 "执行战败结算效果：置战败旗标、切换战后国策树并触发乌克兰/欧洲方结果。同样带内部守卫，未开战时整段空转。"
 ZZZ_cr_eur_02_nato_victory:0 "欧陆战争：北约方胜利结算（ZZZ_eur_settle_nato_victory）"
 ZZZ_cr_eur_02_nato_victory_desc:0 "释放被吞并的东欧国家、归还核心州、参战方全员白和并置 ZZZ_eur_nato_victory。需先点欧陆开战（ZZZ_eur_war_ongoing），否则整段空转。"
 ZZZ_cr_eur_03_csto_victory:0 "欧陆战争：CSTO 方胜利结算（ZZZ_eur_settle_csto_victory）"
 ZZZ_cr_eur_03_csto_victory_desc:0 "把 EST / LAT / LIT / POL / UKR 转为 SOV 傀儡、参战方全员白和并置 ZZZ_eur_csto_victory。需先点欧陆开战，否则整段空转。"
 ZZZ_cr_gaw_02_china_victory:0 "GAW：中国胜利结算（ZZZ_gaw_settle_china_victory）"
 ZZZ_cr_gaw_02_china_victory_desc:0 "对日白和、置 gaw_china_victory_settled 并落地日本/东南亚终局。建议先点 GAW 开战；无战争时只有政治部分生效。"
 ZZZ_cr_gaw_03_japan_victory:0 "GAW：日本胜利结算（ZZZ_gaw_settle_japan_victory）"
 ZZZ_cr_gaw_03_japan_victory_desc:0 "对华白和、置 gaw_japan_victory_settled 并扶植傀儡政府。建议先点 GAW 开战；无战争时只有政治部分生效。"
 ZZZ_cr_tw_02_peaceful_reunification:0 "台海链：和平统一（特别行政区）"
 ZZZ_cr_tw_02_peaceful_reunification_desc:0 "在 CHI 上执行 taiwan_detente.11 的 immediate 原文：台湾成为特别行政区级傀儡，转为民主政体并由朱立伦出任领袖，清除大陆核心与宣称、把大陆州交还 CHI，并裁撤台湾海空军。不派发事件。"
 ZZZ_cr_mew_02_israel_victory:0 "中东 MEW：以色列胜利结算（B-1 / B-2 / B-3）"
 ZZZ_cr_mew_02_israel_victory_desc:0 "ISR 吞并 PAL（约旦河西岸）、HAM（加沙）、HEZ（南黎巴嫩），置 skip_default_capitulation、MEW_isr_took_pal / ham / hez 与 MEW_settlement_done，并清除 MEW_sixth_war_ongoing。不走埃及、约旦、叙利亚割地（B-4 / B-5）。"
 ZZZ_cr_kr_05_real_south_annex:0 "真实入口 A—南吞北（zzz_kor.5）"
 ZZZ_cr_kr_05_real_south_annex_desc:0 "直接 fire 真实的 zzz_kor.5 事件（韩国吞并朝鲜）验证真实链，不内联任何效果。军队处理沿用事件自带的 annex_country = { target = NKO transfer_troops = yes }：NKO 的部队与装备库存随国转入 KOR，各师保留自身编制模板，不删兵、不改编。与北吞南路线互斥（需用干净存档分别验证）。"
 ZZZ_cr_kr_06_real_north_annex:0 "真实入口 B—北吞南（zzz_kor.4 / ZZZ_NKO_march_to_seoul）"
 ZZZ_cr_kr_06_real_north_annex_desc:0 "直接 fire 真实的 zzz_kor.4 事件（朝鲜吞并韩国），等效覆盖 ZZZ_NKO_march_to_seoul——其 complete_effect 也只是派发 zzz_kor.4。军队处理沿用事件自带的 annex_country = { target = KOR transfer_troops = yes }：KOR 的部队与装备库存随国转入 NKO，各师保留自身编制模板，不删兵、不改编。与南吞北路线互斥（需用干净存档分别验证）。"
