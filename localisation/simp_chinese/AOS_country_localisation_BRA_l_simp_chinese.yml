BRA_imminent_judiciary_intervention_mission_desc: "联邦最高法院已开始审议根据1988年公约第136条颁布的紧急措施的合宪性。\n §Y亚历山大·德·莫赖斯法官§!明确表示，军事参与文官管理的范围超出了宪法允许的范围——无论证明其正当性的危机是什么。裁决不是是否的问题，而是何时的问题。\n §Y政府必须决定是§G自行撤销这些措施§!，还是§R被迫§!由国家最高法院撤销。§!"
