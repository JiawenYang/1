BRA_BCW_start_countdown_mission: "§Y多米诺骨牌倒下...§!"
BRA_BCW_start_countdown_mission_desc: "虽然军事区域的崩溃必须得到解决，但所谓的\"法制派叛乱\"对我们来说是一个更紧迫的问题。他们拒绝承认国家政府的权威，反而声称他们的反叛联盟对巴西拥有合法授权。\n\n§R如果他们拒绝投降，我们可能别无选择，只能直接交战。§!"
