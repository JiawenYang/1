BRA_old_man_new_mask_desc: "对博索纳罗和所有怀念60年代、70年代和80年代的人来说，很明显：现代共和国是一个失败，其宪法是一团糟，不断被用来不是为了捍卫人民，而是为了剥削他们，让西装革履坐在办公桌后不断无谓争论的匪徒致富。相反，我们应该寻找上一个共和国，那个为我们带来经济繁荣和真正爱国主义的军民政权，作为重新安排一个永远不会唾弃其人民的政权的指南针。"
BRA_immaculatus_res_publica: "无瑕共和国"
BRA_immaculatus_res_publica_desc: "共和国在最需要的时候选举了博索纳罗，那么，为什么它也背叛了他？简单：§R腐败。§!劳工党的腐败混蛋以预算资金失踪和政客不明来源资金的持续争议而闻名。迪尼斯、月度津贴丑闻、迪尔塞乌，见鬼，洗车行动！这些老鼠自2002年以来一直控制着这个机构，他们将再次控制它。我们不能允许这种情况再次发生，无论是他们还是其他人，§B永远不允许。§!为了阻止这种情况，我们必须§Y严厉§!打击犯罪，这只有通过§G新的立法、新的宪法、新的共和国§!才能实现。"
