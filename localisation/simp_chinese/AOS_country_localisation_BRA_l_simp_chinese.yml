# Events
BRA.1.t: "路途中"
BRA.1.d: "自重新民主化以来，我们的国家经历了一段相当漫长的旅程，文官统治的回归以一系列起伏为特征。在雷亚尔计划带来的初步稳定之后，国家经历了十年的乐观时期，左翼总统路易斯·伊纳西奥·卢拉·达席尔瓦的选举标志着我们历史上新的社会民主篇章，再加上2000年代的经济繁荣，普通人的前景看起来一片光明。\n\n然而，一切都将崩溃。工人党（PT）垄断政治所建立的福利国家是一场骗局，税收从中产阶级转移到奖励经济无用之人并资助大规模腐败计划。所采用的\"再社会化政策\"为强盗和罪犯创造了完全的有罪不罚，他们的军队现在占领了主要城市。同性恋、毒品和其他反社会行为成为政府赞助的文化。\n\n在没有任何真正制度化反对的情况下，需要13年的PT统治才能让人民最终反抗这种疯狂，2013年的六月旅程和2014年的经济崩溃压垮了骆驼的背，在2016年8月迪尔玛·罗塞夫总统弹劾投票期间，一名来自里约热内卢的众议员成为右翼的统一人物。贾伊尔·梅西亚斯·博索纳罗，一位前陆军上尉，毫不道歉的保守派，以其讽刺和幽默的回应（被称为\"Mitadas\"）以及颂扬国家军事政权而闻名，成为互联网 sensation。\n\n右翼终于再次变得大胆，随着卢拉在2018年因腐败指控被捕，博索纳罗将在2018年大选中赢得压倒性胜利。现在，两年后，我们已经完成第一个任期的一半，我们恢复国家道德和安全的议程得到了民众的充分支持。"
BRA.1.a: "这是我们的使命，赋予的使命就是完成的使命。"
BRA.2.t: "巴西中央银行推出PIX电子支付系统"
BRA.2.d: "中央银行今天宣布其新的电子支付平台已正式向巴西民众推出。虽然该工具自去年10月以来已经进行试运行，但现在已向734家注册机构的所有客户开放。\n\n新系统允许个人和企业在任何和所有注册平台之间进行便捷的通用电子转账和交易。预计新系统将促进小型企业的发展，否则这些企业将依赖昂贵的支付系统。"
BRA.2.a: "太方便了！"
BRA.3.t: "巴西确诊首例COVID-19病例"
BRA.3.d: "圣保罗市，2020年2月26日——埃德森·阿帕雷西多手里握着圣保罗市卫生局的信纸信封，汗流浃背。里面是一份可怕的阳性COVID检测报告，来自一名从意大利返回的游客，他因呼吸系统问题不得不住院治疗。这将是该国第一例确诊病例。\"肯定是第一例，\"埃德森低着头，凝视着虚空。\"我们应该关闭一切，我就知道！我应该更坚持...\"他试图专注于面前的重大任务，但他的思绪不断想象事情可能不同的场景。\n\n\"部长先生？\"接待员的声音将埃德森从恍惚中惊醒。\"市长现在要见你。\"布鲁诺·科瓦斯站着，靠在他的办公桌上，焦虑地在红木表面上敲鼓。\"那么，埃德？\"市长用一种天真乐观的语气问道，这种语气几乎掩盖了他的忧虑。\"最好已经打电话给媒体了，布鲁诺。\"市长举起双手。\"该死！偏偏要在我的城市？！该死！\"\n\n\"我已经通知团队了，\"秘书走上前。\"一切就绪。我们会说感染者已完全隔离，我们已经追踪到飞机上的其他乘客进行检测。\"一阵沉默。科瓦斯花了一些时间恢复镇定。\"告诉媒体我们已经找到了其他乘客，他们正在安全地点接受检测。\"市长走近埃德森，压低声音。\"这种病毒在外面造成严重问题，我不能让这些问题在这里发生。不是现在，不是在最糟糕的时候。\"\n\n\"是的，布鲁诺，那是我想和你提出的另一件事...\"卫生部长声音中的紧张甚至让他自己感到惊讶。\"也许最好...你知道，为了遏制传播...\"市长的眼睛睁大了，已经知道他即将提出什么建议。"
BRA.3.a: "\"取消狂欢节？你疯了吗？？？\""
BRA.4.t: "农业综合企业之死"
BRA.4.d: "国际记者展示了华尔街完全空旷，已被疏散。除了新闻摄制组外，只能看到纽约警察局的装甲车在街道上巡逻，偶尔有一些可怜的灵魂的尸体躺在地上，他们宁愿结束一切也不愿应对如此巨大的经济损失。这是直接从消耗美国的武装冲突中播出的悲惨场景之一。美国内战是已经被压到极限的国际贸易链的致命一击。\n\n农业综合企业是巴西进口最有利可图的部门，美国是其主要贸易伙伴之一。随着美国退出游戏，更糟糕的是，随着整个贸易链的崩溃，农业部门突然发现自己陷入瘫痪。数公里的卡车闲置在高速公路上，货运列车一动不动地排在轨道上，满载货物的货船停泊在港口，数吨易腐食品堆积在已经被认为变质的仓库里。每个人都在等待下一个订单，但目前只收到无线电沉默。贸易路线的这种惯性与董事会和高级投资公司群聊中的纯粹恐慌形成了鲜明对比。投资者激烈争论下一个紧急举措，同时买入、卖出和持有订单的交叉指令被喊到四面八方。\n\n对于普通公民来说，由于COVID-19大流行和燃料价格的天文数字上涨，经济状况已经不可持续，现在变得完全不可行。家庭冲向超市，却发现货架空空如也或供应品已经很贵，现在更贵：基本食品篮子上涨30%；肉类，40%；制成品上涨20%，并且还在恶化。随着局势变得更加绝望，人们转向更加激烈的措施和越来越激进的想法..."
BRA.4.a: "农业形势的发展不一定对巴西有利。"
BRA.5.t: "石油危机袭击巴西"
BRA.5.d: "随着沙特崩溃的影响在该国感受到，巴西人醒来面对飙升的燃料价格和加油站的巨大排队。该国约20%的燃料进口来自沙特阿拉伯，另有15%来自美国，国家三分之一的天然气来源受到影响，导致全国短缺。\n\n虽然巴西开采的石油足以被认为是自给自足的，但它缺乏利用这些储备的炼油能力，依赖进口来维持燃料储备。虽然国际形势促进了我们的出口收益，但这些收益完全被这些进口成本抵消，使我们处于净亏损状态。\n\n分析师警告说，燃料短缺可能导致该国进一步的政治不稳定。"
BRA.5.a: "希望巴西石油公司有一些额外储备..."
BRA.6.t: "新冠严重性恶化"
BRA.6.d: "在最近几个月巴西国家政府及其医疗部门的无能和乏善可陈的表现导致全国COVID-19病例激增。已经让巴西屈服的病毒现在在全国肆虐，几乎没有政府的任何抵抗。这是一场国家灾难，知道医疗系统和政府在遏制这场灾难的努力中变得如此令人难以置信的草率，是一种国际尴尬。\n\n如果博索纳罗政府和医学界不立即采取任何措施有效遏制病毒，这很可能导致文明终结的情景，肯定会摧毁巴西作为世界上一个正常运转国家的能力。截至目前，新感染病例和随后因COVID-19病毒死亡的人数飙升至天花板以上，将巴西经济阻碍到几乎停滞不前。"
BRA.6.a: "现在做点什么，否则让巴西以我们祈祷永远不会看到的话题载入史册。"
BRA.7.t: "国会批准政党联邦法律"
BRA.7.d: "国民国会批准了政党之间联盟的新模式，该模式将对2022年选举立即生效。新立法规定，两个或多个政党可以正式联合，并在整个选举周期和整个立法任期内作为单一组织行事。\n\n与2017年以来被禁止的前比例联盟不同，联邦需要长期承诺：加入的政党必须保持团结至少四年，共享一个纲领、国家领导和议会运作。联邦将适用于整个国家领土，统一联盟和政治策略。\n\n新规则旨在允许较小的政党在不失去自身身份的情况下进行合作，同时帮助他们超过选举门槛，这限制了获得公共资金和电视播出时间的机会。根据文本，联邦将有统一的党团、联合资源分配，并对任何制裁承担共同责任。\n\n该措施得到了中小型政党的支持，他们将联邦视为在新政治格局中保持相关性的一种方式，但也遭到了认为这是\"变相联盟\"的部门的批评。高等选举法院已规定新模型的运作方式，确保其在2022年选举中已经应用。"
BRA.7.a: "新的政治范式已经确立"
BRA.8.t: "参议院成立疫情期间政府行动调查委员会"
BRA.8.d: "巴西利亚——联邦参议院本周成立了COVID调查委员会（CPI），旨在调查联邦政府在处理巴西冠状病毒大流行方面的行动和不作为。该委员会将有最初两个月的时间来确定政治和行政责任，以及与公共卫生危机相关的任何潜在罪行。\n\n调查的主要重点包括疫苗购买延误、推广未经证实有效性的药物、非正规顾问在卫生部门的作用，以及大流行期间公共资金的滥用。\n\n反对党议员认为该委员会对于澄清直接影响该国死亡人数的决定至关重要。另一方面，政府盟友批评该倡议，声称这是出于政治动机。\n\n在未来几周内，CPI预计将开始传唤现任和前任部长、卫生专家以及参与疫苗采购的公司代表。最终报告可能导致起诉请求和提交给总检察长办公室和其他监督机构。"
BRA.8.a: "好吧，该死。"
BRA.8.b: "不欠任何人的人，不害怕任何人。"
BRA.9.t: "参议院结束COVID调查委员会调查"
BRA.9.d: "巴西利亚——联邦参议院本周结束了COVID调查委员会的工作，经过两个月对联邦政府处理大流行的调查。尽管委员会一些成员采取了批评态度，但CPI的关闭没有对贾伊尔·博索纳罗总统的政府产生直接法律后果。\n\n最终报告遭到亲政府议员的强烈反对，他们指出政治偏见、法律脆弱性以及缺乏物质证据支持起诉请求。盟友基础成功阻止了被认为过度的部分，并强调CPI没有证明总统直接犯下的罪行的存在。\n\n政府盟友强调，行政部门的关键决策，例如授予各州和市在卫生管理方面的自主权，已得到联邦最高法院的确认，这限制了高原宫对大流行期间采取的地方措施的直接责任。他们还强调，巴西在关键时期结束时正在进行广泛的疫苗接种运动，经济活动逐渐恢复。\n\n随着委员会的结束，报告中的移交已发送给总检察长办公室等机构，到目前为止，尚未导致正式指控。"
BRA.9.a: "这只是反对党在制造轰动。"
BRA.10.t: "参议院结束COVID调查委员会调查"
BRA.10.d: "巴西利亚——联邦参议院本周结束了COVID调查委员会的工作，确定贾伊尔·博索纳罗总统的政府在应对大流行方面存在不作为和疏忽。最终报告以参议院多数票通过，并指出公共卫生危机管理中的严重失败。\n\n根据文件，联邦政府延迟购买疫苗，鼓励使用未经证实有效性的药物，并采取旨在实现所谓\"群体免疫\"的非正式策略。CPI还确定存在一个\"平行内阁\"，由没有官方职位的顾问和医生组成，据称影响了卫生部内的决策。\n\n报告要求起诉数十人，包括共和国总统本人、部长、前部长、顾问和商人。所谓的罪行包括滥用职权、危害公共卫生罪、庸医行为和责任罪。部分调查结果已转发给总检察长办公室、总检察长办公室和国际机构。\n\n政府盟友拒绝该报告，称其具有政治性和偏见性。反过来，反对党表示，CPI通过记录责任并留下巴西大流行处理不当的历史记录来履行其职责。"
BRA.10.a: "游戏从一开始就被操纵了。"
BRA.11.t: "干预联邦警察"
BRA.11.d: "塞尔吉奥·莫罗，司法部长——或者更确切地说，前司法部长——的眼睛在被记者的又一轮闪光灯暂时蒙蔽后重新适应了房间。\n\n\"回答你的问题，\"莫罗开始说，\"我辞职是因为博索纳罗总统多次试图政治干预联邦警察。如你所知，自去年以来，总统表现出特别兴趣，想用他可以直接打电话获取信息和情报报告的人取代联邦警察领导层。那不是，也从来不是联邦警察的角色。\"\n\n\"但你的签名出现在前联邦警察总干事毛里西奥·瓦莱索的解雇文件上。你批准了这一变更吗？\"\n\n\"根本没有。我感到惊讶。总统下令解雇总干事，没有明确理由，瓦莱索的解雇在未经我同意的情况下以我的签名发布。\"\n\n莫罗感到脖子上出汗，松开了衣领。他想到了二十年的联邦法官生涯；他想到了洗车行动；他想到了成为部长，这次会有所不同；他想到了成为民族英雄，成为民族叛徒；他想到了一个公正的国家，他可能看不到它就死去；他想到这场斗争是否值得...\n\n\"没有正当理由更换总干事和主管威胁联邦警察的独立性，特别是在正在进行调查的情况下。这一变化表明他想控制公司。允许这些侵入性行动危及机构的完整性。我不会成为其中的一部分。\"莫罗总结道。"
BRA.11.a: "有些界限不应跨越。"
BRA.12.t: "国会批准枪支所有权自由化法律"
BRA.12.d: "巴西利亚——国民国会本周批准了第3723号法案，该法案促进了裁军法的全面改革以及规范该国枪支登记、拥有和携带的规则。该提案自2019年以来一直在考虑中，随后由总统批准。\n\n批准的文本确立了国家枪支系统的新规则，重新定义了与枪支相关的罪行，并更详细地规范了猎人、运动射击者和收藏家的地位。主要要点包括扩大可授予持枪许可证的情况、修订官僚要求以及修改法律规定的处罚。\n\n尽管这是博索纳罗纲领的主要重点之一，但扩大平民持枪权的话题在其执政期间明显被总统忽视。该法案是通过政府在立法机构的基础自发动员而批准的。\n\n批评者认为，在这种内乱时期通过这项法律是一个严重错误，可能导致该国已经增长的政治暴力案件数量增加。另一方面，支持者指出，正是在这种情况下，该措施才是必要的，以便民众能够保护自己免受这些暴力袭击。"
BRA.12.a: "那是窃取的勇气！"
BRA.13.t: "政治活动增加的报告"
BRA.13.d: "随着巴西枪支所有权的成功合法化，尽管寄生反对派造成了挫折，但在过去几个月里，枪支的销售和使用在全国范围内飙升。面对巴西社会两极分化加剧政治暴力的警告，总统出面解决这些担忧，指出平民中枪支流通量的增加反而会对极端主义暴力产生威慑作用。\n\n\"如果你有一个和平的抗议，支持或反对政府，一些暴徒开始挥舞他们的枪，他们将不仅要与警察打交道，还要与许多也会武装自己的善良负责任的公民打交道！值得庆幸的是，不仅是仇恨者，国家忠诚的男男女女也随身携带手枪，以防任何左翼分子试图强加他们自己扭曲的失败未来愿景。\"\n\n虽然自新法律通过以来，流弹损坏基础设施甚至造成生命损失的报告大幅增加，但此类事件的绝大多数被追溯到疏忽发射或人际争吵，有组织暴力的报告自决定以来保持相对不变。\n\n目前情况似乎稳定，但我们必须保持警惕。"
BRA.13.a: "有组织暴力？更像是混乱的乌合之众！"
BRA.14.t: "国会批准枪支所有权自由化法律"
BRA.14.d: "巴西利亚——国民国会本周批准了第3723号法案，该法案促进了裁军法的全面改革以及规范该国枪支登记、拥有和携带的规则。该提案自2019年以来一直在考虑中，随后由总统迅速批准。\n\n批准的文本确立了国家枪支系统的新规则，重新定义了与枪支相关的罪行，并更详细地规范了猎人、运动射击者和收藏家的地位。主要要点包括扩大可授予持枪许可证的情况、修订官僚要求以及修改法律规定的处罚。\n\n扩大平民持枪权一直是博索纳罗纲领的主要重点之一，最近几周总统表现出明显兴趣将这一承诺变为现实。通过协调他在立法机构的盟友党团并动员支持这一变革的民间社会部分，该法案获得了最终在国会获得批准所需的动力。\n\n该措施的支持者认为，新立法提供了法律确定性，纠正了监管差距，并承认某些职业类别和受到已证实威胁的公民需要个人保护。然而，批评者警告过度自由化获取枪支的风险，指出对公共安全和国家监督的潜在影响。"
BRA.14.a: "好公民永远不会在强盗面前退缩。"
BRA.15.t: "哪里出了问题？——计划变更"
BRA.15.d: "\"不可能。\"博索纳罗手里拿着一瓶皮图酒，凝视着阿尔沃拉达宫的窗户。门另一边是他的全家、朋友和盟友。所有人一起观看计票，所有人一起观看他的失败。没有人敢打扰船长，他把自己锁在办公室里。\"这不公平！\"他让这个想法脱口而出。\n\n\"如此接近。在误差范围内输掉是最糟糕的。\"他把手放到额头上。\"但我赢了第一轮。谁听说过赢了第一轮却在第二轮输了？！这怎么可能？\"博索纳罗抬起头，灵光一闪：\"被偷走了！\"他眼中突然闪过一丝光芒。\"上周街上那些人不可能毫无意义。当然，这个国家历史上最大的小偷们毫不犹豫地再犯一次欺诈。\"他从椅子上跳起来。\"最高法院的决定、毫无意义的联盟、电子投票机……从一开始就被操纵了！\"\n\n博索纳罗开始在他的办公室里来回踱步寻找东西。\"我不能让国家再次落入那些犯罪共产主义者的魔爪，尤其是以这种欺诈方式。我不能！\"他低声在手机上翻阅联系人，拨打了他认为可能有用的第一个人的电话。\n\n\"总统先生\"他的副官毛罗·西德立即接听\"我想第一个说-\"\n\n博索纳罗打断了"
BRA.15.a: "我们将操纵这一切。"
BRA.16.t: "守卫大门的人"
BRA.16.d: "\"戒严令、GLO、干预高等选举法院？！\"空军司令巴普蒂斯塔·朱尼尔空军中将几乎无法在他的军人风度下掩饰他的愤慨。\"您是在建议我们阻止下一届政府就职吗？\"这位中将看着总统，仿佛在等待回答；博索纳罗保持沉默，坐在阿尔沃拉达宫办公室的办公桌前。\n\n\"有理由相信选举结果被篡改了，\"国防部长布拉加·内托将军插话道。\"这些非常措施将允许我们调查是否确实如此。\"\"空军不会同意任何体制破裂，\"巴普蒂斯塔坚定地声明。\"对不起，先生们。\"这位中将向总统敬礼，但不等被解雇就走了出去。\n\n\"部长是否意识到武装部队自己在选举前验证了投票机的完整性，并且没有发现任何入侵证据？\"陆军司令弗雷雷·戈麦斯将军冷静地向内托问道。\n\n部长思考了一下，回答道：\"即使投票机完全不可侵犯——我们还不完全确定——但有报告称高等选举法院内部存在不良行为者。我们不能允许权力交接在首先确保所有——\"\n\n弗雷雷摇头否认，叹了口气，突然站起来。他无视国防部长，转向博索纳罗：\"总统先生，我希望您意识到这些行动可能带来的法律后果。我有义务通知您，如果您坚持，您可能会被逮捕。\"弗雷雷立正并向总统敬礼。\"你被解雇了，将军，\"博索纳罗打破沉默。\n\n弗雷雷离开后，只剩下海军司令阿尔米尔·加尼尔·桑托斯海军上将。很长一段时间里，三个人互相看着对方；布拉加·内托和博索纳罗盯着海军上将，仿佛在等待回答。意识到这一点，加尼尔立正站好。\"海军将随时听候您的任何行动，总统先生。\"\"很好，海军上将。我们仍在考虑替代方案。我们会通知您。你被解雇了，\"博索纳罗用正式的语气说道。\n\n内托护送海军上将到门口。回来后，他什么也没说，但他的表情显然在问总统：\"您怎么看？\""
BRA.16.a: "真是一群胆小鬼。"
BRA.16.b: "他们最终会转变立场的。"
BRA.17.t: "篝火燃料"
BRA.17.d: "那个夏日的周日，里约热内卢气温接近40摄氏度。在这样的日子里，任何人都会待在家里躲避烈日或在海边放松，但即便如此，他们还是来了：数十万人挤满了科帕卡巴纳大道。气氛并不是庆祝的；那些人不是来庆祝胜利或哀悼失败的，至少现在还不是。这片绿黄海洋中的每个人都在这里聆听总统的宏伟计划，他的重大启示将改变游戏规则。他会知道该怎么做；在博索纳罗总统宣布之前，一切都没有真正的胜负。\n\n随着惯常的雷鸣般的欢呼，总统出现了。站在音响卡车顶上，周围是最忠诚的盟友，他的话语回荡在整条大道上，回荡在在场每一位爱国者的心中。\n\n\"我亲爱的朋友们，当他们说我们输了，说我们的爱国运动结束了，请不要相信他们。他们说我们在非常可疑的情况下输掉了选举——必须说，这些情况必须仔细调查——但我们没有失去，也永远不会失去的，是我们的战斗意志！\"掌声和欢呼声让地面震动。\"我们将继续战斗！我告诉你们要比以往任何时候都更激烈地战斗！为了让我们为了什么而战斗不再有任何疑问，我清楚地说：我们一直捍卫，也将永远捍卫……\""
BRA.17.a: "道德和良好习俗！"
BRA.17.b: "巴西民族的荣誉！"
BRA.17.c: "巴西家庭的价值观！"
BRA.17.e: "每个人的自由！"
BRA.18.t: "农场与教堂之间"
BRA.18.d: "国民议会的党团是一群议员，他们一致投票以推进共同利益，本质上作为伪政党运作。议会中最团结的团体被称为\"BBB党团\"，这个术语用来统称公共安全议会阵线（\"子弹党团\"）、农业议会阵线（\"牛肉党团\"）和福音派议会阵线（\"圣经党团\"）。这些团体之间的联盟对于首先使我们的政府可行至关重要，多年来它们一直是维持我们政府的关键——当然前提是优先考虑各自的特殊利益。\n\n子弹党团一直是我们基础的中坚力量；博索纳罗总统本人在担任众议员期间是一位非常杰出的成员。可以肯定地说，无论我们选择走哪条路，我们都将得到其组成议员的支持。然而，在这场危机和失败的时刻，牛肉党团或圣经党团的全力支持并非有保证。他们会站在我们一边，但如果我们想要依靠他们的全部政治力量以及各自带来的民众支持，我们必须保证他们的目标将从现在起成为我们纲领的基本基础。\n\n在这种情况下，这两个团体之间的分歧远大于它们的相似之处。如果我们承诺遵循一个党团的指导方针，我们必然会疏远另一个的很大一部分。无论如何，在这个阶段我们需要尽可能多的盟友，所以我们必须做出这个选择。"
BRA.18.a: "致力于农业议会阵线"
BRA.18.b: "致力于福音派议会阵线"
BRA.19.t: "光荣的权力交接"
BRA.19.d: "骗子"
BRA.19.a: "我敢打赌你也看了本地化文件"
BRA.20.t: "爱必胜"
BRA.20.d: "在巴西近代史上最两极分化、最激烈的总统选举之一之后，第二轮选举结果由高等选举法院正式确认，宣布工人党（PT）的路易斯·伊纳西奥·卢拉·达席尔瓦和“希望巴西联盟”以微弱优势获胜。\n\n这一宣布立即在全国引发了一系列自发的庆祝活动。在圣保罗、里约热内卢、萨尔瓦多等主要城市以及无数其他城市，支持者涌上街头，挥舞着工人党旗帜，高呼前总统竞选活动中使用的口号，不同地点都能听到“卢拉在这儿！”的呼喊声。\n随着庆祝活动的进行，烟花照亮了夜空中的人群，他们跳舞、拥抱陌生人，流下欣慰和喜悦的眼泪，庆祝自迪尔玛·罗塞夫被弹劾以来他们被迫压抑的希望的回归。\n\n然而，另一方面，现任总统雅伊尔·梅西亚斯·博索纳罗和巴西爱国联盟支持者的反应是即时的。在总统仍然强势的地区，情绪变成了深深的失望和愤怒的混合体。许多人聚集在较小的群体中，主要是在酒吧里，沮丧地互相喊叫，而有些人则保持震惊的沉默。\n\n很快，双方之间的对比变得鲜明，随着总统的沉默，他的支持者可能开始对结果的合法性提出质疑。"
BRA.20.a: "两个国家在同一领土上形成。"
BRA.21.t: "自食其果"
BRA.21.d: "维持如此广泛的阵线需要管理其组成部分之间的完美平衡，卢拉对此再清楚不过。\n\n既然选举已经获胜，从卑微的地方议员到党魁，每个人都开始认为他们的帮助至关重要，没有他们胜利是不可能的。因此，他们觉得有权要求比他们实际应得的更大份额。\n\n现实是，这个不拘一格的联盟是通过承诺在新内阁中获得有利职位而建立的，某些人物的支持确实在推动我们冲过终点线方面发挥了关键作用。一方面，我们必须回报，否则曾经保卫我们的武器将对准我们。另一方面，我们必须谨慎，不要让出太多席位，以免玷污我们的正统性并威胁我们的国家计划。\n\n民事府部长负责处理政府内部的僵局，确保其像一台运转良好的机器一样运行——协调部际行动、与立法机构联络、监督联邦机构——总统的右手。这是内阁组建期间最令人垂涎的职位，因为无论谁担任这个职位，都拥有无与伦比的自由来配置公共部门的齿轮。\n\n卢拉尽可能拖延时间。他曾含糊或明确地向许多人承诺过这个职位；他理解这个决定的象征意义，以及它为政府中获得该职位的任何派系所保证的政治权力。\n\n犹豫的时间已经结束；必须在虚线上写下一个名字。"
BRA.21.a: "提名卡洛斯·卢皮应该能安抚激进分子。"
BRA.21.b: "我们需要一个可靠的人物来确保稳定。雷南·卡尔海罗斯就是那个人。"
BRA.21.c: "阿德里亚娜·文图拉，展示我们对新思想持开放态度。"
BRA.21.e: "让我们跨越党派界限提名曼德塔。为了团结。"
BRA.21.f: "这个职位太重要了，不能由不认同我们理想的人来担任。我们不会放弃！"
BRA.22.t: "为了一些银和一些金"
BRA.22.d: "根据年度预算法，我们必须估算收入并确定下一年的政府支出。这是卢拉一直最不喜欢的部分。无数与他必须假装喜欢的西装革履的人的会议，所有人都带着他必须假装理解的无数图表和统计图。\n\n今年，会议室特别拥挤。这是预料之中的；毕竟，这是广泛阵线的很大一部分成员第一次瞥见真正的联邦权力，他们正试图充分利用这个机会。\n\n经过漫长的一周，我们的选择散落在我们面前的桌子上，等待当选总统的决定。"
BRA.22.a: "社会援助和以劳工为重点的政策。这就是我们承诺的，也是我们将交付的！"
BRA.22.b: "在如此微妙的时刻，我们不能过度扩张资源。平衡预算是最谨慎的做法！"
BRA.22.c: "作为韧性的标志，让我们拥抱更紧缩的经济，为新机遇敞开大门！"
BRA.23.t: "要么做大要么回家"
BRA.23.d: "博索纳罗主义者的抗议已经大到无法忽视的程度。一周又一周，我们尝试了久经考验的策略，即不以直接对抗来赋予这些狭隘行为以尊严。相反，我们一次又一次坚持证明电子投票机、民主体制和选举过程的安全性——从而防止更多人陷入选举失败者的政变叙事。\n\n我们的想法是，那些在街头抗议的人会失去动力，士气低落，回到家中与家人一起度过年末假期。但事实并非如此。相反，我们看到全国主要大道在周末被绿黄色淹没，人们在军营前露营呼吁军队干预，零星的暴力行为，据称的恐怖袭击企图报告，以及许多其他不可预测的事件在社交媒体上广泛分享和评论。所有这一切都受到博索纳罗在全国巡回演讲中煽动性言论的鼓励，这是推翻选举结果的最后绝望努力。\n\n既然如此，我们将正面面对他们！在卢拉的官方账号以及他的盟友在所有可能的社交媒体平台上的账号上，同一视频同时发布：\n\n\"同志们，\"卢拉在一个休闲环境中的竖版视频开始说道，直接对着镜头说话，配有动态字幕——所有这些设计都是为了尽可能扩大其影响力。\"最近几周，我们被迫在我们心爱的巴西各地目睹可悲的场景。本应是团结和复兴时刻的年末季节，却成了对我们民主的可耻蔑视展示。事实是，这场混乱是由一小群人推动的，但他们制造了很大的噪音。\"经过戏剧性的停顿，卢拉眯起眼睛继续说道：\"对于这个吵闹的少数派，我说……\""
BRA.23.a: "准备好为你们对民主的罪行做出适当的回答！"
BRA.23.b: "让我们一起成为我们国家此刻需要的团结。"
BRA.24.t: "总统就职典礼"
BRA.24.d: "你看了吗？"
BRA.24.a: "不知道你能在那些上面找到什么……"
BRA.25.t: "2022年选举临近"
BRA.25.d: "路易斯·伊纳西奥·卢拉·达席尔瓦的入狱、雅伊尔·梅西亚斯·博索纳罗和社会自由党在2018年总统选举中的胜利，以及工人党众多其他成员的入狱，让许多人怀疑卢拉和佩蒂斯塔时代是否已经结束。然而，在三大危机之后，媒体对雅伊尔的持续攻击以及在部分民众中引起争议的措施，总统发现自己的支持率减弱并不断下降，不再享有多年前的大规模支持。\n\n随着路易斯·伊纳西奥·卢拉·达席尔瓦根据最高法院法官埃德松·法欣的决定获释，以及媒体和他的结晶支持地区——东北部的支持，前总统发现自己的人气日益增长，这并非易事，因为他的前科犯身份和民粹主义政策不断被其他候选人，包括总统本人利用。\n\n两位候选人都不会轻松，当他们准备竞选活动时，民众正在适应被讨论为自民主化以来最重要的选举。"
BRA.25.a: "这肯定会让人难忘！"
BRA.26.t: "2022年选举开始"
BRA.26.d: "在这场被广泛认为是巴西历史上最两极分化、影响最深远的选举中，2022年大选正在进行。多年来巴西社会已经存在的深化危机，如高犯罪率，以及第二次美国内战和三大危机造成的深远影响，导致该国人口之间的距离越来越远，容易发生暴力和极端意识形态两极分化。\n\n总统竞选由两方主导。雅伊尔·梅西亚斯·博索纳罗，现任共和国总统，以类似唐纳德·特朗普的民粹主义言论而闻名，领导巴西爱国联盟（APB），这是一个由各种右翼和极右翼政党组成的联盟，团结了保守派、福音派、农村党团，以及一般来说，严格安全政策的倡导者和民族主义者。\n\n直接对立的是路易斯·伊纳西奥·卢拉·达席尔瓦，这位有争议的前共和国总统，在担任两届任期后任命了继任者，并于2018年作为洗车行动的一部分因腐败指控被捕。领导希望巴西联盟（FBE）的工人党候选人享有广泛的进步联盟，涵盖温和左翼、工会、社会运动和更激进的派系。\n\n其他联盟，如联合人民劳工阵线，也在争夺总统职位，工人党的资深人物怀着很高的希望和长期的人物在他身边，西罗·戈麦斯代表左翼最激进的翼。随着太阳升起和竞选活动开始，巴西人民正在醒来，进入一个比上一个时期更紧张的时期。"
BRA.26.a: "传奇值得第二个任期！"
BRA.26.b: "必须不惜一切代价阻止雅伊尔。"
BRA.27.t: "第一轮结果"
BRA.27.d: "巴西爱国联盟爆发出胜利的欢呼。博索纳罗没有直接获胜，但对他们来说，[?BRA_election_polling_bolso_var|2%%]证明人民坚定地与上帝、家庭和祖国站在一起。叙事很简单：大多数巴西人拒绝了左翼的谎言和所谓温和派的噪音。对于APB来说，这验证了博索纳罗仍然是国家的船长，是唯一足够强大面对第二轮“腐败进步派”的人。\n\n对于卢拉和希望巴西联盟来说，心情是苦乐参半的。他们确保了进入决胜轮的位置，但[?BRA_election_polling_lula_var|2%%]感觉像是对巴西伤口有多深的提醒。尽管如此，他们将其描绘为希望：战斗还没有结束，法西斯主义仍然可以通过团结、同情和毅力被击败。对他们来说，这不仅仅是一场选举战，而是争取民主和尊严的历史性斗争的延续。\n\n在联合人民劳工阵线中，西罗·戈麦斯的[?BRA_election_polling_ciro_var|2%%]被誉为证明工人阶级和真正的进步派仍然有声音。他们曾被一笔勾销，被视为边缘群体，但现在他们作为巴西的第三股力量站了起来。在ADPL中，西蒙娜·特贝特的[?BRA_election_polling_tebet_var|2%%]被描绘为一颗可能成长的温和种子；而在UOPB中，索拉娅·特罗尼科的[?BRA_election_polling_soraya_var|2%%]被视为从民粹主义手中夺回保守主义的第一步。对于阿莫埃多和MRF来说，[?BRA_election_polling_amoedo_var|2%%]并不令人惊讶，但它标志着正直至少在巴西政治中仍有一席之地。"
BRA.27.a: "第一轮不是结束；它是一个分裂国家的镜子。"
BRA.28.t: "第二轮结果"
BRA.28.d: "巴西爱国联盟不敢相信。博索纳罗轻松领先第一轮；他有势头，街头的民众，每个角落的旗帜，但不知何故，数字背叛了他。对他们来说，很明显：欺诈、操纵、破坏。“一个人民的人，得到上帝 Himself 的支持，怎么会输给腐败的精英和共产主义者？”他们问道。在他们眼中，这不是投票箱的失败；这是巴西命运的盗窃。\n\n对于希望巴西联盟及其盟友来说，结果简直是妥协锻造的奇迹。卢拉再次从深渊中归来，不仅带着进步派的希望，还带着中间派、激进派甚至保守派不情愿的手。他们知道前方的政府将是动荡的，有债务要偿还，有权系要安抚，但在这一刻这并不重要。他们在投票箱阻止了威权主义。\n\n联合人民劳工阵线和其他盟军以严峻的满足感对待结果。对他们来说，这不是关于卢拉，也不是关于FBE；这是关于打倒博索纳罗，更大的邪恶。他们为此妥协了自己的价值观，他们知道联盟中的矛盾很快就会显现。但至少，现在，未来仍然是开放的。“最好与一个掌权的软弱温和派战斗，”他们想，“而不是在一个强大的法西斯主义者手下生存。”"
BRA.28.a: "胜利永远不是纯粹的；它是用矛盾缝合在一起的。"
BRA.29.t: "博索纳罗主义者走上街头"
BRA.29.d: "在巴西各地的各个城市中心和数十个其他城市，博索纳罗支持者和巴西爱国联盟成员在高等选举法院（TSE）正式宣布路易斯·伊纳西奥·卢拉·达席尔瓦和FBE在总统选举第二轮中获胜后大规模走上街头。开始时是在总统支持最强的地区和城市中心自发聚集的示威活动，很快蔓延到几乎整个国家，用真正的绿黄国旗海洋覆盖了它。\n\n在以政治示威闻名的圣保罗市，保利斯塔大道以意想不到的速度挤满了人，市民手持巴西国旗，举着各种信息的标语，一些支持博索纳罗，另一些指责卢拉是“腐败的小偷”，声称选举被操纵以确保佩蒂斯塔的胜利。在首都巴西利亚，人群聚集在巴西陆军总部周围，要求军队干预并宣布选举无效。\n\n在各地，社交媒体和报纸上出现了暴力报告，将局势描述为“史无前例”；视频显示平民使用卡车、路障或燃烧的轮胎封锁整条高速公路，而其他视频显示向对手和当地知名的当选总统卢拉支持者的家投掷石块。\n\n在对投票机普遍违规的指控、东北部地区最后时刻的票数激增以及对TSE的普遍不信任中，博索纳罗本人迄今为止拒绝接受失败，呼吁保持冷静，以便“事实可以得到审查”。卢拉和FBE呼吁和平，辩称博索纳罗主义者的行为“违背民主体制”，选举结果“干净，没有欺诈”。"
BRA.29.a: "国家陷入自我毁灭"
BRA.30.t: "绿黄匕首"
BRA.30.d: "月光微弱地照亮了构成巴西首都的广阔土地，但在总统官邸普拉纳尔托宫，雅伊尔·梅西亚斯·博索纳罗醒着。他办公室的灯光昏暗；三个不同屏幕的光芒是他能看到的唯一东西之一。他的领带松了，袖子卷了起来，眼睛盯着屏幕，一动不动。他的额头满是汗水，盯着CNN突发新闻的标题：\n\n“突发新闻：军事行动，路易斯·伊纳西奥·卢拉·达席尔瓦和亚历山大·德莫赖斯失踪，热拉尔多·阿尔克明遇刺。”\n\n他没有动，手里拿着电视遥控器，拇指停在关闭按钮上。在另外两个屏幕上，另外两个频道播报着同样的新闻，环球电视台和SBT的记者带着震惊和绝望的表情报道着将永远改变巴西的消息。他从椅子上站起来，愤怒。那一刻他不知道该怎么办；他被反驳了，参加会议的将军们背着他做了一切，没有回头路了。总统拿起手机，愤怒地拨打了一个号码。\n\n接通后，他开始说道：\n\n“这到底是什么！？谁他妈干的？”\n\n电话那头的人喃喃自语了一些东西，然后从嘴里说出虚弱的话，仿佛害怕回答总统。几秒钟的沉默后，那个人仍然用低沉的语气说话，博索纳罗几乎听不见，他愤怒地挂了电话。他用手擦了擦额头，感觉汗水滴落；他知道现在没有回头路了。他可以对每个人大喊大叫，但为了防止情况变得更糟；"
BRA.30.a: "§R必须做点什么。§!"
BRA.31.t: "博索纳罗宣布军事干预！"
BRA.31.d: "在普拉纳尔托宫的电视讲话中，总统雅伊尔·博索纳罗宣布全国军事干预，援引“对体制稳定、公共秩序和巴西人民完整性的严重威胁”，此前试图暗杀卢拉、亚历山大·德莫赖斯和热拉尔多·阿尔克明未遂。该法令暂停宪法保障，无限期搁置国会和州立法议会，并授权武装部队接管该国的公共安全，直到局势恢复正常。\n\n该措施是在旨在通过暗杀卢拉、亚历山大·德莫赖斯和热拉尔多·阿尔克明来斩首FBE当选政府的行动的影响和部分失败后不久采取的。虽然暗杀阿尔克明的目标已经实现，但卢拉和亚历山大·德莫赖斯的命运仍然未知，引发了全国范围内的广泛抗议。\n\n这一宣布立即受到巴西爱国联盟极右翼及其支持者的欢欣鼓舞，数千人在社交媒体上发布支持总统的消息，呼吁“恢复秩序”和“结束左翼暴政”。在传统右翼据点，包括圣卡塔琳娜州、巴拉那州、马托格罗索州和其他地区，支持者走上街头，挥舞国旗支持博索纳罗的决定。\n\n与此同时，反对派的反应迅速。卢拉竞选的希望巴西联盟、FPTU和其他左翼团体谴责该法令是明显的“自我政变”企图，指责博索纳罗将国家引向“回归独裁统治”。左翼领导人，包括西罗·戈麦斯和迪尔玛·罗塞夫，敦促人民“强烈抵抗”他们所谓的重新点燃巴西历史上最黑暗时期的企图。"
BRA.31.a: "秩序将得到恢复。"
BRA.31.b: "公然的自我政变！"
BRA.32.t: "街头混乱"
BRA.32.d: "在绿黄匕首行动后宣布军事干预的几个小时内，巴西陷入混乱。由PT活动分子和其他人组织的支持卢拉、阿尔克明和亚历山大·德莫赖斯的大规模示威活动淹没了该国几乎每个主要城市的街道。数十万人走上街头，挤满了圣保罗的保利斯塔大道、里约热内卢的大西洋大道和萨尔瓦多的主要街道。\n\n最初大多是和平的守夜和游行，随着博索纳罗主义者反示威者的动员，很快演变成暴力。冲突几乎立即爆发，各种武器，包括石块、玻璃瓶和烟花，被投掷并相互使用。\n\n全国各地外围和中产阶级社区大规模抢劫的报告、对银行和政府建筑的袭击，以及在更偏远地区敌对民兵之间的战斗，正从全国各地区传来。拥挤的医院、被路障和警戒线封锁的街道、不同地区建立的宵禁，以及暴力的使用，使民众处于极度恐惧状态，而最糟糕的还在后面。"
BRA.32.a: "暴力螺旋，永无止境。"
BRA.33.t: "圣诞大屠杀"
BRA.33.d: "保利斯塔大道一直以大型政治示威的舞台而闻名，这次也不例外，一场反对总统雅伊尔·梅西亚斯·博索纳罗的大规模抗议从早上开始。\n\n抗议从规模较小开始，大约中午时分规模扩大，越来越多的人逐渐加入，一些人举着横幅，另一些人穿着红色衬衫支持失踪的当选总统路易斯·伊纳西奥·卢拉·达席尔瓦，还有许多，许多反对雅伊尔·博索纳罗的信息，现场可以看到“政变策划者”、“ wannabe独裁者”，甚至“法西斯暴徒”，以及FBE、工人党和左翼其他象征，如锤子和镰刀和红星的旗帜。\n\n然而，过了一段时间，随着抗议规模扩大，穿着绿黄色衣服、印有总统面孔的黑色衬衫的男子到达，手持石块和其他物品。\n\n博索纳罗主义者不寻求和平的反示威，毫不犹豫地追捕示威者，攻击、侮辱和殴打他们，导致左翼示威者反击，使示威变成了一场巨大的街头斗殴。\n\n最糟糕的是在暴力开始一段时间后，一枚炸弹被一名身份未被警方确认的示威者在人群中引爆。然而，伤亡后来估计为26人死亡，数百人受伤，双方都有。\n\n驱散抗议后，这场屠杀震惊了民众，因为这种规模的恐怖袭击对巴西民众来说不是常见的场景，也有助于进一步两极分化和激进化博索纳罗主义者和左翼分子，双方互相指责是谁造成了屠杀，一些指向可能的共产主义者，一些暗示整合主义者是幕后黑手，但比以往任何时候都更重要的是，双方都承诺复仇。"
BRA.33.a: "这种疯狂何时结束？"
BRA.34.t: "宣布戒严"
BRA.34.d: "在雅伊尔·梅西亚斯·博索纳罗在选举中失败、选举欺诈指控和数千名爱国者走上街头之后，许多左翼分子和普通公民感到震惊。然而，在“绿黄匕首行动”和圣诞大屠杀之后，整个巴西社会陷入了巨大的动荡状态，数百万人走上街头抗议雅伊尔·梅西亚斯的政府，另一些人回应左翼抗议，其中许多人武装。\n\n面对这种情况和抗议中暴力的不断升级，雅伊尔·博索纳罗发现自己陷入困境，知道即使他反对暗杀阿尔克明并迫使卢拉和亚历山大·德莫赖斯逃跑的行动，责任几乎完全落在他身上。于是，他拿起笔，签署了“国家拯救法案I”，在全国范围内建立戒严，并允许军队维持巴西领土的治安。\n\n“为了结束激进左翼分子造成的暴力和恐怖，必须采取严厉行动。非常感谢大家。”雅伊尔·梅西亚斯·博索纳罗说，身边是巴西陆军的高级将领和他政府的忠诚成员，他完成了本世纪以来南美总统最受拍摄和拍摄的声明之一。\n\n该法案的签署几乎没有平息抗议活动，反而成为反博索纳罗示威者的燃料，他们认为这一行动是总统有史以来最公然的政变企图，因为工人党候选人卢拉的就职典礼——其命运仍然未知——将在几个小时内到来。"
BRA.34.a: "巴西屏住呼吸。"
BRA.35.t: "弗雷雷·戈麦斯将军谴责博索纳罗"
BRA.35.d: "在现场直播中，巴西陆军前指挥官、巴西现役最高级别军官之一马科·安东尼奥·弗雷雷·戈麦斯将军公开谴责雅伊尔·博索纳罗政府下令的军事干预是“违宪、非法的，是对民主秩序和法治的严重背叛”。\n\n在这段长达15分钟的视频中，弗雷雷·戈麦斯指控博索纳罗在绿黄匕首行动失败后策划了一场“自我政变”，声称博索纳罗颁布的戒严令和该行动是为了防止合法的权力交接而策划的。在同一视频中，该男子宣布：\n\n“所有真正的巴西捍卫者，真正的爱国者，无论是武装部队、司法机构、公务员，还是广大巴西人民，都必须抵制这种对民主的篡夺，这种最高级别的叛国行为。博索纳罗不代表巴西，不代表人民，也不代表军队。我们必须向所有人澄清这一点，因为如果我们在这些公然滥用面前保持沉默，就再也无能为力了。”\n\n视频在社交媒体上疯传后，确认几名中高级军官以及联邦警察和其他国防机构成员表示支持或中立，以回应弗雷雷的声明。几个小时内，演讲开始在各个圈子广泛传播，增加了弗雷雷·戈麦斯的言论和行动可能升级为对联邦政府的公开叛乱的风险。"
BRA.35.a: "背叛国家的人，付出最惨痛的代价"
BRA.35.b: "反对博索纳罗，反对独裁者"
BRA.36.t: "军区崩溃"
BRA.36.d: "军区屈服于数百万武装和暴力公民的压力只是时间问题。在绿黄匕首行动、军事干预和宣布戒严之后，抗议活动达到了巴西历史上前所未有的水平，数百万甚至数百万平民走上街头反对他们所看到的政变和恐怖政权，在非法否认选举结果后强行维持秩序。\n\n然后，在试图遏制抗议活动时，军队发现自己别无选择，只能开始向自己的同胞开火，在几天内导致数百人死亡，数千人受伤。这显然对情况没有帮助，只会进一步激怒民众，他们现在意识到只有通过武力才能摆脱这种局面。\n\n拿起武器，全国的男男女女，无论是共产主义者、整合主义者、犯罪派系成员还是民主支持者，都将武器对准军队，同时军队将武器对准抗议者的头部。"
BRA.36.a: "铁腕，慈手"
BRA.37.t: "主题：亚马逊军区结构崩溃报告"
BRA.37.desc: "总统先生：\n\n我们有责任以这一时刻要求的严谨和严肃态度通知您，巴西陆军对亚马逊地区的集中指挥权已完全停止。亚马逊军区，前由阿喀琉斯·富兰·内托将军协调，已不可逆转地屈服。军事遏制战略——受到公民起义和内部纪律侵蚀的严重压力——导致权力分裂，消除了远北地区国家领土的凝聚力。指挥链的瓦解使意识形态派系、宗教民兵、土著运动和有组织犯罪填补了武装部队留下的治理真空。\n\n首都马瑙斯及其周边地区目前由亚马逊军事福音派协会控制。在桑德拉·布林格尔的领导下，这一派系巩固了一个军事化的神权政体，利用CMA剩余的后勤基础设施来实施基于宗教教义的秩序。在南部地区，巴西共产党（PCB）在多次颠覆性进攻后终于取得了有效控制。该组织的中央委员会已在济帕拉纳建立了其行动中心，代表了对巴西利亚指令的直接政治抵抗飞地。\n\n国际边界周边也已分解为自治单位。部落大会已承担战略领土的主权：雅诺马米民族统治圣加布里埃尔达卡舒埃拉地区，蒂库纳人控制塔巴廷加交界处，辛古民族联盟已将其影响力扩展到帕林廷斯。同时，与秘鲁和玻利维亚边境的公共安全完全崩溃，阿克里州被犯罪集团十三帮完全吸收。一个被称为“内内”的别名的人的领导将里奥布朗库变成了一个麻醉品统治的神经中枢。\n\n最后，我们观察到州长们选择事实上独立的行政分离运动。在博阿维斯塔，安东尼奥·德纳里乌姆州长宣布罗赖马州自治，而在波尔图韦柳，马科斯·罗查州长紧随其后宣布朗多尼亚州自治。两个政府都将破裂视为应对系统性混乱的自我保护措施。总而言之，巴西国家已经失去了在亚马逊地区的力量投射能力，留下的只是一个由地方权力组成的马赛克，处于公开冲突中，没有立即恢复宪法秩序的前景。"
BRA.37.a: "尊敬的，奥古斯托·埃莱诺将军，国家安全办公室主任"
BRA.38.t: "主题：北部军区结构崩溃报告"
BRA.38.desc: "总统先生：\n\n我提交关于奥古斯托·科斯塔·内韦斯将军管辖区域内指挥链瓦解的技术分析供您考虑。必须报告的是，北部军区已正式停止作为维持秩序的凝聚力单位的职能。干预战略屈服于后勤分裂和长期不服从，导致权力真空正被自治倡议、游击队和高度危险的犯罪组织积极填补。\n\n军事权威在该地区在一定程度上仍然存在，通过阿尔米尔·加尼尔·桑托斯海军上将指挥的海军分遣队，他将费尔南多·迪诺罗尼亚岛变成了海上堡垒，并将其控制扩展到亚马逊河东部地区的大部分。尽管独立于指挥链运作，但所有迹象表明他的目标与我们一致。简而言之，巴西海军司令部已证明是稳定北部地区任务中的协作元素。\n\n同时，前军事管理的周边经历了由抵抗意识形态和有组织犯罪加速的肢解过程。在马拉巴，斗争社区联盟在路易斯·维拉·诺瓦的领导下建立了一条排斥带，通过城市游击战战术和农村封锁阻止剩余部队的任何移动。在贝伦的后勤枢纽，国家权威已被北方家族取代，在那里被称为“泽罗伯托达孔佩纳”的罪犯行使事实上的控制，利用港口基础设施进行非法目的并资助自己的领土民兵。\n\n东部侧翼的情况同样危急，构成对联邦完整性的直接威胁。卡洛斯·布兰当州长宣布马拉尼昂州行政独立，集中力量保卫圣路易斯，并无视戒严令的指令。这种行政分裂因内部冲突而削弱，因为四十帮在“莱奥戈尔丁”的领导下控制了因佩拉特里斯市，而瓜雅拉拉土著人民部落大会在努内斯·弗雷雷州长建立了自治政府。对情况的评估表明，东亚马逊地区巴西主权完全解体，需要立即重新评估重新征服能力，因为曾经忠诚的部队现在根据当地生存逻辑或意识形态背弃运作。"
BRA.38.a: "尊敬的，奥古斯托·埃莱诺将军，国家安全办公室主任"