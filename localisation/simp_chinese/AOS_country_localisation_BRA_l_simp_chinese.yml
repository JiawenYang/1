# Summary
BRA_GATHERING_STORM_DESC: "曾经被誉为\"未来之国\"，历史似乎对巴西另有安排。2014年大宗商品繁荣结束后，随之而来的是金融危机和劳工党14年来对国家的强大控制迅速终结。\n\n巴西随后在2018年贾伊尔·博索纳罗当选后出现保守转向，但两年后，国家似乎陷入了无计划无战略的漂泊状态。如果巴西要充分发挥其潜力，它必须决定前进的道路，否则有被历史抛在后面的风险。"
BRA_country_summary: "§Y国家摘要§!:\n巴西是拉丁美洲最大的经济体，也是美洲第二大经济体，仅次于美国这个庞然大物，一直被视为一个充满潜力的国家。不幸的是，它所拥有的一切——只是潜力。二战后渴望共和主义和发展的巴西，在1964年军事接管其机构并实施二十年压迫时，其雄心壮志被扼杀。\n随着军事政权解冻，巴西在新千年再次敢于梦想，由新兴大国崛起带来的大宗商品繁荣推动。但当繁荣结束时，这个梦想再次从巴西的掌握中溜走，随之而来的是巴西的经济和政治稳定，最终导致2016年总统迪尔玛·罗塞夫被弹劾，以及2018年贾伊尔·博索纳罗当选后的右翼转向。\n随着整个世界处于边缘，这个国家面临着严峻的挑战，但也有很多机会。这是否最终成为巴西崛起并成为它一直渴望成为的未来大国的时候？"
BRA_country_paths: "\n\n\n§Y国家路线§!:\n - §G巴西国家政府§!\n - §7巴西法制派军队§!\n - §C更多内容将在未来更新中推出！§!"
BRA_country_other: "\n§Y提示与技巧§!:\n - 无风不起浪。\n - 上帝以弯曲的方式书写直线。\n - 稳扎稳打才能走得远。\n - §Y巴西不适合新手。§!"
