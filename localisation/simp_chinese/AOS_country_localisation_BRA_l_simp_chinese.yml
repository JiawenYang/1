l_simp_chinese:
 # Focuses
 # - Pre Civil War
 BRA_ease_of_business_policy: "商业便利政策"
 BRA_ease_of_business_policy_desc: "自成立以来，巴西经济以自己的方式运作，有时被称为\"巴西资本主义\"，这个系统为所谓的\"国家冠军\"和国有企业（通常由现任政府的朋友组成）提供大量补贴和保护，造成了臃肿低效的产业。\n\n然而，经济自由是所有其他自由的基础，如果我们想摆脱国家巨无霸，削减法规和激励自由市场运作的友好环境是必要的。"
 BRA_independent_central_bank: "独立中央银行"
 BRA_independent_central_bank_desc: "政府干预经济事务很少有积极效果，不幸的是，巴西中央银行对此并不陌生，几十年的党派任命意味着银行的政策实际上是政府意见和愿望的延伸。这偏离了中央银行的自然目标：追求技术和稳定的经济，不受政府政策的影响。\n\n因此，应采取新措施，保护银行免受行政部门在制定货币政策方面的政治压力，提高该机构在投资者和民众中的信誉。"
 BRA_slash_petrobras: "削减巴西石油公司"
 BRA_slash_petrobras_desc: "多年来，巴西石油公司既是战略资产，也是公共财政的无底洞，这家公司拥有不必要的大量员工并背负债务。为了充分利用其潜力，我们必须精简预算，削减非必要开支，消除官僚低效，并解雇表现不佳的员工。"
 BRA_agro_four_point_oh: "农业4.0"
 BRA_agro_four_point_oh_desc: "巴西农业综合企业仍然是该国经济最强大的支柱，但即使拥有其丰富性和重要性，它仍然依赖过时的技术和设备、脆弱的供应链以及对进口投入品的强烈依赖。保护、指导和扩大对该国经济支柱的投资对于确保我们拥有一个值得尊重的农业部门是必要的。"
 BRA_privatize_eletrobras: "私有化巴西电力公司"
 BRA_privatize_eletrobras_desc: "巴西电力公司是该国能源部门的国有巨头，长期以来一直是政府控制能源生产和分配的象征。然而，腐败、管理问题和投资不足等长期问题使其效率低下并负债累累。\n\n通过私有化，向国内外财团出售股份将为其网络现代化、扩大水电容量以及引入奖励效率的竞争性定价提供资本，从而提高员工的努力。这一措施尽管受到社会某些阶层的批评，但将有助于吸引外国投资，使我们再次成为能源出口国。"
 BRA_privatize_mail_service: "私有化邮政服务"
 BRA_privatize_mail_service_desc: "巴西邮政长期以来一直是国家邮政垄断，背负着过时的基础设施、长期赤字、罢工和工会抵制，这些都无助于改善服务。公司私有化将结束直接用于该领域的公共资源浪费，并促进包裹递送和物流的竞争。\n\n这项改革将有助于展示政府对效率的承诺，并为国际物流巨头投资巴西电子商务市场打开大门。"
 BRA_free_the_infrastructure: "解放基础设施"
 BRA_free_the_infrastructure_desc: "巴西的公路和铁路网络处于废墟之中，坑坑洼洼的街道、废弃的轨道以及潜在有用的铁路线路被停用，增加了运输和农业贸易成本。这样的问题不容易解决，更不用说快速解决了，但通过向私人运营商开放特许权，设定绩效目标和延迟处罚，我们应该会取得进展。"
 BRA_cpr_verde: "绿色农业产品证书"
 BRA_cpr_verde_desc: "农业产品证书引入了一种市场机制，为农业综合企业的环境保护和恢复提供资金。生产者可以发行由未来生产支持的证书，资源分配用于重新造林、土壤恢复、遵守法定储备以及永久和临时生产区域的分离。该机制旨在打击农业活动造成的森林砍伐，而无需大量公共支出。"
 BRA_expand_the_market: "扩大市场"
 BRA_expand_the_market_desc: "巴西经济受到过度监管、高额滥用税收和保护低效部门的壁垒的阻碍，惩罚了消费者和企业家。简化开业官僚程序、降低资本货物和投入品的进口关税、消除扼杀公平竞争的价格控制，是克服阻碍国家和巴西市场进步的障碍的基本措施。"
 BRA_green_yellow_employment_book: "黄绿就业手册"
 BRA_green_yellow_employment_book_desc: "黄绿就业手册引入了更简化和灵活的雇佣合同，减少了雇主的沉重监管负担，同时维持了对工人的基本保护。该模式降低了强制性福利成本，简化了冗长的雇佣和解雇流程，并减少了长期阻碍正规就业的官僚作风。\n\n旨在将数百万工人带回正规经济，促进就业创造，并使巴西成为更具吸引力的投资国家，这项改革是朝着改善该国就业质量迈出的一步。"
 BRA_the_new_agro: "新农业"
 BRA_the_new_agro_desc: "巴西农业是经济的支柱，养活了整个国家，并将该国定位为对世界其他地区重要的出口国。然而，它的运作远低于其潜力，依赖进口化肥和过时的机械，阻碍了其进步，并经常导致企业和农民的结果不尽如人意。\n\n如果我们想振兴农业并将其提升到全部潜力，我们必须将更多投资导向农业综合企业部门的现代化。这包括投资现代工具、扩大灌溉和使更复杂的地区机械化。"
 BRA_reduce_agro_input_imports: "减少农业投入品进口"
 BRA_reduce_agro_input_imports_desc: "巴西农民在养活全球其他国家方面发挥着核心作用，但他们仍然依赖外国供应商的化肥、农药和农业机械零件，使我们的国内市场受制于全球价格。\n\n我们可以而且必须减少这种依赖，通过为制造拖拉机和机械的本地公司提供税收激励，扩大磷矿开采，并促进全国氮肥工厂的重新激活，从而开始减少我们对外部市场的依赖，并减轻受国际危机影响的风险。"
 BRA_aliquota_unica: "单一税率"
 BRA_aliquota_unica_desc: "由保罗·古德斯制定的单一税率旨在用单一消费税税率取代巴西重叠的联邦、州和市级税收，平等适用于所有商品和服务。这一措施将结束对被视为基本产品的豁免、累积扭曲以及关于税收分类的法律斗争。\n\n通过简化税收制度，我们解决了该国财政低效的核心问题，使制度更加公平，并使逃税更加困难。"
 BRA_halfway_there: "已经走了一半！"
 BRA_halfway_there_desc: "由路易斯·伊纳西奥·卢拉·达席尔瓦领导的工人党政府对巴西来说是一场彻底的灾难。臃肿的福利国家从生产部门拿走钱，给那些不努力的人，再加上溺爱暴徒的监狱改造政策，允许犯罪派系控制我们的城市，更糟糕的是，性别意识形态被推向学校的孩子们！所有这些都是由大宗商品繁荣和雷亚尔计划的繁荣所赞助的，这些因素与卢拉短视的社会主义政策无关。\n\n当洗车行动揭露大规模犯罪计划并揭露整个政府机器的系统性腐败时，人民，巨人，觉醒了，拒绝了所有左翼主义，并且在工人党破坏这个国家近二十年后，右翼终于再次掌权。过去两年的动荡并不比预期的多，但问题已经开始堆积，裂痕已经开始显现。只要短期内不发生灾难性事件，我们就会没事，可能会成功连任。我们不能浪费这个机会。"
 BRA_flex_gun_ownership: "放宽枪支所有权"
 BRA_flex_gun_ownership_desc: "巴西民众每天感受到的犯罪增加和不安全感正在提高公众对更广泛权利和自卫方法的需求。虽然裁军法后颁布的法律对公民施加严格的官僚作风，使合法获取枪支变得非常困难，但放宽枪支所有权流程使有能力和负责任的公民能够保护他们的家园、家庭和自己免受罪犯、入侵者和其他类型威胁的侵害。"
 BRA_protect_our_mothers: "保护我们的母亲"
 BRA_protect_our_mothers_desc: "我国的母亲们，特别是在暴力和困难中抚养孩子的单身母亲们，面临着对其尊严、身心健康的持续威胁。在达马雷斯·阿尔维斯部长的帮助下，巴西母亲计划为她们提供应有的正义，包括扩大的支持网络、针对单身和缺乏经验母亲需求的职业培训课程，以及在脆弱或家庭暴力案件中的法律援助。\n\n认识到母亲在塑造和培养我们公民方面的根本作用，以及她们所忍受的困难和不公，她们现在将得到保护，以确保我们亲爱的国家的后代能够过上稳定和健康的生活。"
 BRA_give_out_land_deeds: "发放土地契约"
 BRA_give_out_land_deeds_desc: "未使用的公共土地和废弃的农村财产已成为擅自占地者的避风港，也是罪犯隐藏和开展非法活动的地方，而许多自给农民和家庭越来越缺乏财产所有权——这变得越来越昂贵——来耕种土地和谋生。\n\n为了保护我们的小土地所有者、退伍军人和农村工人，发放财产所有权将帮助他们生活，将未使用和未生产的田地转变为依赖他们的人的收入和食物来源，并加强我们国家的农村经济。"
 BRA_revive_brazilian_tourism: "复兴巴西旅游业"
 BRA_revive_brazilian_tourism_desc: "最近在世界范围内发生的危机摧毁了我国的旅游业，曾经是全国许多城市的主要财富来源，海滩空无一人，酒店关闭，文化空间被遗弃。我们必须专注于振兴这个行业，将投资导向酒店翻新和营销活动，突出国家的自然奇观、美丽景色和文化遗产。\n\n除了向国民经济注入数十亿美元外，这种振兴将有助于我们再次向来自世界各地的游客展示一个有韧性、创新和美丽的国家形象。"
 BRA_escola_sem_partido: "无党派学校"
 BRA_escola_sem_partido_desc: "学校和大学中的意识形态灌输一直是一个经常性话题，教师被指控以教育为幌子宣传党派议程和个人意识形态。因此，在公立学校强制中立对于结束学校环境中的灌输、禁止政治宣传、监控可能传播这些思想的教师和工作人员，以及确保课程没有意识形态偏见、专注于中立教学是必要的。"
 BRA_civilian_military_schools: "军民学校"
 BRA_civilian_military_schools_desc: "随着学校中犯罪浪漫化的增加、课堂纪律的恶化以及国家价值观的侵蚀，学生和公立及私立学校的生产力急剧下降，有报告显示学生成绩急剧下降，学生不尊重和贬低教育的视频在社交媒体上越来越频繁地出现。\n\n然而，军民学校提供了我们解决这些问题所需的替代方案，将教育管理交给军事警察和武装部队。学生将接触到更结构化的日常活动、体育训练和一门课程，将他们转变为敬畏上帝的公民、尊重国家的公民和有荣誉的公民。"
 BRA_technology_of_brazilian_state: "巴西国家技术"
 BRA_technology_of_brazilian_state_desc: "我国的科学和技术潜力是巨大的，但这种潜力因投资不足、意识形态干预和臃肿的官僚作风而以各种方式被耗尽和浪费，导致关键机构停滞不前，并阻碍了潜在投资者投资我们的产业。\n\n为了恢复我们剩余的潜力，我们必须解雇腐败和低效的员工，大幅减少长期阻碍该领域进步的官僚作风，并增加激励措施以吸引国内外投资者。"
 BRA_lower_age_of_criminal_responsibility: "降低刑事责任年龄"
 BRA_lower_age_of_criminal_responsibility_desc: "巴西青少年犯罪的增加，受到宽大惩罚——或者在某些情况下，有罪不罚——和犯罪派系招募的推动，损害了该国的公共安全，联邦宪法第27条保护犯有滔天罪行的未成年人免受重大后果。因此，废除宪法第27条并降低最低刑事责任年龄将为年轻罪犯和未成年罪犯带来正义。\n\n让年轻个体以与成年人相同的方式对其罪行负责，不仅将阻止各种犯罪组织对年轻人的剥削，还将向那些足够成熟理解其行为的人表明，他们犯下的罪行将不再逍遥法外。"
 BRA_no_more_leashes: "解开我们警察的束缚"
 BRA_no_more_leashes_desc: "全国范围内犯罪的增加，在经济困难加剧、周边地区缺乏机会以及国家在这些地区的权威削弱的推动下，已将街道变成战场，整个地区犯罪者几乎完全有罪不罚地运作，剥削守法公民并侵蚀人们对政府处理问题能力的信心。\n\n这种\"平行国家\"的加强很大程度上是由于过度规则和司法干预我们警察部队可以或不能做什么，或者他们可以和不能在哪里行动。我们必须打破这种过度干预，赋予我们的安全部队在没有重大限制的情况下运作的能力；扩大他们的接近和搜查权力，放宽使用武力的协议，并提供更大的法律诉讼保护。"
 BRA_the_administrative_reform: "行政改革"
 BRA_the_administrative_reform_desc: "巴西国家机构在几十年的腐败、政治庇护、庇护主义、创建往往不必要的部委以及职能重叠的培养下，已成为我国进步的真正障碍。部委和机构雇用数千人从事幽灵工作，福利和津贴消耗了不成比例的预算份额，同时为巴西人民提供低质量的服务。\n\n过度的官僚作风和普遍的腐败扼杀了创业精神，延误了基础设施项目，如蒂埃特河的清理，并阻碍了外部代理人的投资。这样的制度不能继续下去；它需要从上到下进行改革，这正是将要做的——彻底而深入的改革——以便最终公共部门为人民服务，而不是为财团和腐败机会主义团体服务。"
 BRA_playing_president: "扮演总统"
 BRA_playing_president_desc: "既然我们在任期上半年享有的民众支持热情开始失去动力，我们需要展示成果。尽管我们如此批评支配巴西政治的\"以牙还牙\"，并承诺不为\"政治\"妥协我们的理想，但为了我们的治理，一些不太完美的交易将不得不达成。"
 BRA_reconcile_psl: "与社会自由党和解"
 BRA_reconcile_psl_desc: "社会自由党（PSL）曾经是保守集团的关键盟友，现在与我们保持距离，并开始为反对党工作和合作。然而，其选举基础仍然由福音派选民、公共安全支持者和自由市场爱好者组成——一个与我们政府意识形态基础接近且与我们的项目相似的群体。\n\n两个集团之间的分裂只对工人党和左翼集团有利。因此，为了巩固右翼集团并加强我们在国会中的地位，与该党领导人和解关系将给我们带来巨大优势并加强我们的权力。"
 BRA_negotiate_with_centrao: "与中央党协商"
 BRA_negotiate_with_centrao_desc: "中央党——由控制国会中相当一部分议员的务实政治集团组成——是我们联盟认为在巴西利亚维持权力不可或缺的群体，但也高度不可预测。它缺乏特定的意识形态，并宣布支持支付最多的人。尽管我们掌握权力，但如果我们希望保留权力并确保我们的影响力，与中央党谈判——向他们提供职位、利益和资金——是非常必要的。"
 BRA_form_new_cabinet: "组建新内阁"
 BRA_form_new_cabinet_desc: "现任内阁是来自不同集团和前联盟残余的联盟混合体，已被证明懦弱、分裂且过于软弱，无法执行巴西所需的深刻和大胆的改革。为了完成和推进保守议程，任命意识形态坚定、与国家元首有着相同愿景并将毫不犹豫地执行的人物至关重要。\n\n这包括任命与巴西武装部队有联系的人物担任政府关键职位。从上到下改革内阁不仅将促进我们议程的推进，还将向联邦最高法院和国民议会传达我们想要的信息。\n\n§Y我们议程的推进是不容协商的。§!"
 BRA_new_minister_civilian_house: "新的民事办公室部长"
 BRA_new_minister_civilian_house_desc: "民事办公室长期以来一直遭受软弱和无能领导的困扰。西罗·诺盖拉是一位长期政治家，曾四次担任国会议员，他带来了担任首席部长职位所需的经验和政治力量。"
 BRA_give_up_fnde: "放弃FNDE"
 BRA_give_up_fnde_desc: "国家教育发展基金尽管其高尚的目的是为改善该国学校的基础设施、教科书和学校膳食提供资金，但已变得效率低下和臃肿，反复出现腐败和管理不善丑闻被公众曝光。\n\n为了使联邦政府对教育的资助更加高效、干净和透明，有必要缩减对该计划的投资，并支持更多的私立教育举措。"
 BRA_compromises_with_the_party: "与党的妥协"
 BRA_compromises_with_the_party_desc: "社会自由党已不再是一个统一的集团，分裂成寻求更广泛吸引力的温和派和忠于贾伊尔·梅西亚斯·博索纳罗原始项目和信息的强硬派。温和派希望软化总统在文化问题上的言论，并在中心建立支持网络。\n\n代表党的相当一部分，保持他们满意以便他们留在联盟中并不造成只会有利于左翼选举的分裂是非常重要的。我们必须给予他们让步并在某些点上妥协，例如淡化一些更具两极分化的提议并在政府的某些领域给予他们职位，以换取他们的投票和支持。"
 BRA_deals_with_bolsonaro_wing: "与博索纳罗派打交道"
 BRA_deals_with_bolsonaro_wing_desc: "社会自由党的激进派，完全忠于博索纳罗总统，仍然是该党最忠诚和最有活力的基础，他们热烈和欢快的演讲使我们支持者的士气保持高昂。他们对贾伊尔的项目充满热情，但维持我们当前基础的同样激进主义也疏远了未决定的选民，并为渴望将我们描绘成极端分子和激进分子的左派提供了弹药。\n\n我们需要控制强硬派，同时保持他们的积极性和动力继续为总统而战。通过在立法中给激进派他们想看到的东西，同时阻止疏远温和派和中间派的煽动性言论，我们将使他们站在我们这边。"
 BRA_hand_over_secretariats: "移交秘书处"
 BRA_hand_over_secretariats_desc: "中央党控制着批准和通过我们想要的改革所需的选票，但他们的支持从来不是免费的，在许多情况下是昂贵的。为了确保他们投票支持我们并防止他们试图阻碍总统的议程或在意外时刻转换立场，有必要将他们集团的信任人士安置在各个秘书处，授予他们非常渴望的权力，而不会长期损害总统。"
 BRA_no_negotiations: "\"不\"谈判"
 BRA_no_negotiations_desc: "中央党的操纵和小游戏已经达到了无法容忍的程度，其政客要求内阁职位、预算修正案、地区资金和投资，以换取他们在众议院的支持和对我们项目的投票。与他们进一步接触逐渐将我们变成他们的傀儡，完全依赖他们来治理，而支持者在意识到我们没有兑现承诺后变得疏远。\n\n如果我们想推进我们的议程，自由治理，并兑现对我们基础的承诺，我们必须孤立这个集团，同时巩固右翼集团，以便他们从反对派的投票不会在长期内对我们产生负面影响。"
 BRA_back_in_the_center: "回到中心"
 BRA_back_in_the_center_desc: "中央党对于适当治理的重要性长期以来被我们集团忽视；与他们结盟并做他们想做的事被基础视为背叛，但现在是时候放下这个想法并接受，没有他们，政府无法独自生存很长时间。\n\n无论如何，他们会走向一方或另一方；支付更多、提供更多、承诺更多的一方。忽视他们意味着孤立和左翼更大的权力，这就是为什么我们必须将他们带入我们的轨道，在他们想要的东西上让步以换取他们的支持。"
 # - The Crises
 BRA_the_oil_crisis_hits: "石油危机来袭！"
 BRA_the_oil_crisis_hits_desc: "沙特阿拉伯国王去世以及随后的国家内战导致全球石油市场崩溃，巴西石油供应几乎完全中断对该国经济产生了强烈影响。一夜之间燃料价格飙升，该国工业因运输成本过高而停止活动，几家依赖该资源的公司被迫停止运营。在加油站，人们排起了长长的队伍，试图获得加油的机会。\n\n仍处于初始阶段的石油危机暴露了国家对外部能源和石油依赖的脆弱性和弱点，国家通货膨胀飙升，价格达到前所未有的水平。我们需要保护巴西免受进一步损害，寻求尽可能减轻和最小化这场危机的方法。"
 BRA_secure_internal_market: "确保内部市场"
 BRA_secure_internal_market_desc: "石油危机使国内经济不稳定到我们在科洛尔弹劾和恶性通货膨胀结束后没想到会看到的水平，产品价格每天达到过高的价值，导致抢劫、抗议和普遍恐慌。为了防止危机进一步动摇国家，一些措施，包括分批释放储备、向工人和中小商户提供补贴、加强区域分销网络以防止短缺和广泛抢劫，将给我们足够的时间考虑更广泛的计划。"
 BRA_open_international_trade: "开放国际贸易"
 BRA_open_international_trade_desc: "石油危机暴露了我们很多东西，从弱点和脆弱性到我们认为理所当然的东西。然而，最重要的教训之一是国际孤立可能对我们国家构成的危险。吸取这一教训，我们必须转向国际贸易，加强与现有买家的联系，并在非洲、中东和亚洲寻求新的供应商。\n\n尽管某些联盟和伙伴关系可能挑战我们的意识形态自豪感，但我们必须做出各种牺牲，以确保巴西尽快从这场危机中恢复。"
 BRA_drop_import_parity_policy: "放弃进口平价政策"
 BRA_drop_import_parity_policy_desc: "进口平价政策将国内燃料成本直接与国际原油价格挂钩，已成为经济复苏的直接障碍。国际价格的每次上涨，无论是由于沙特内战还是任何其他冲突和市场不确定性，都直接影响巴西人民的腰包。\n\n放弃这一机制，尽管需要政府和投资者谨慎管理，但将允许本地价格与国际市场脱钩，赋予巴西石油公司根据生产成本和国家需求设定价格的自由。"
 BRA_enact_price_controls: "实施汽油价格管制"
 BRA_enact_price_controls_desc: "燃料价格的飙升导致我国公共和私人交通几乎完全瘫痪，商品和食品价格上涨，最重要的是，引发了社会动荡和暴力抗议。因此，为了尽可能缓和局势并获得时间来规划更有效和长期的政策，实施价格管制将把基本商品的价格降低到普通民众最低负担得起的水平。"
 BRA_brics_cooperation: "金砖国家合作"
 BRA_brics_cooperation_desc: "由于石油危机，我们的经济处于可悲的状态，价格每天上涨，投资者越来越不确定是否投资我们的国家，而剩余部分依赖于不可预测和不稳定的市场。在这一切中，我们的金砖国家盟友——主要是俄罗斯联邦和中华人民共和国等国家——拥有我们迫切寻求的大量石油储备。\n\n不仅如此，寻求俄罗斯的钻井技术和印度在生物燃料方面的专业知识将帮助我们促进盐下层的勘探，使我们能够减少对外部市场的依赖并加强与经济盟友的联系。"
 BRA_increase_state_share_petrobras: "增加巴西石油公司的国家份额"
 BRA_increase_state_share_petrobras_desc: "由于重大的市场波动和外国投机在石油危机中将巴西石油公司推向边缘，使公司处于极其微妙的财务状况，重新建立控制和增加国家在公司中的股份成为拯救企业的必要之举。\n\n通过直接购买股份、优先认购权和其他方法增加政府的股权，将使我们能够引导公司朝着符合民众利益的方向发展，超越仅满足股东和投资者的需求。"
 BRA_invite_foreign_refineries: "邀请外国炼油厂"
 BRA_invite_foreign_refineries_desc: "危机向世界暴露了巴西炼油能力的欺诈性质，国内生产不足以满足民众需求，迫使我们以高于正常价格进口石油衍生物。\n\n敞开大门并邀请外国炼油公司在我们领土内投资新设施或现代化现有设施，提供我们需要的快速解决方案。"
 BRA_the_coming_flu: "即将到来的流感"
 BRA_the_coming_flu_desc: "2019年末出现了一种新的未知呼吸道病毒的首次报告，最初被全球许多人视为轻微问题，一场将在中华人民共和国境内开始和结束的流行病。事实并非如此；该疾病传播到其他地方，迅速抵达巴西，并通过机场、港口和公共交通更快地传播。\n\n医院措手不及，很快不堪重负，缺乏适当的设备暴露了该部门长期投资不足的问题，促进了病毒在我们整个领土内的传播。我们的医疗系统及其所有脆弱性和无能向民众暴露，民众对如何应对新威胁感到困惑，每天都对政府失去信心。\n\n我们需要尽快处理这场瘟疫。"
 BRA_operation_warp_vac: "极速疫苗行动"
 BRA_operation_warp_vac_desc: "席卷全国的COVID-19大流行使政府面临许多问题和议题，其中之一是国家对外国疫苗供应商的极端依赖，使数百万民众被交付延迟、外交僵局和疫苗购买接受方面的官僚障碍所劫持。有鉴于此，极速疫苗行动将用于加速疫苗的开发和国内生产，将资源导向布坦坦研究所、Fiocruz和私人实验室，以加快临床试验并大幅增加生产规模。"
 BRA_covid_brics_cooperation: "金砖国家援助"
 BRA_covid_brics_cooperation_desc: "获取和购买COVID-19疫苗所涉及的外交凸显了传统供应商的不可靠性，交付延迟和价格虚高。然而，我们的金砖国家合作伙伴为我们提供了所需的替代方案。\n\n俄罗斯联邦的卫星V疫苗生产线可以获得许可并购买用于本地瓶装和精加工。与此同时，我们的中华人民共和国盟友提供投资、原材料和技术来生产我们自己的疫苗，此外还提供科兴疫苗供购买。"
 BRA_call_for_duty: "号召服役"
 BRA_call_for_duty_desc: "COVID-19病毒正在测试巴西民族的韧性，医院不堪重负，经济因隔离措施和封锁而动摇，导致无数小企业和商店倒闭和破产。武装部队也受到大流行的影响，削减支付、推迟训练以及新兵人数越来越少。\n\n由于不需要实地活动，以及民众对医院和传统医疗保健替代方案的需求不断增长，动员兵营中的士兵分发医疗用品、开展运动以及在高风险地区维持秩序，成为我们武装部队在这场危机中提供帮助的主要方式。"
 BRA_covid_university_research: "新冠研究拨款"
 BRA_covid_university_research_desc: "随着COVID-19大流行蔓延并在我们人民中夺走更多生命，民众和政府都明显意识到，尽管我们的努力很多，但在防止疾病在全国范围内传播方面仍然不足。\n\n因此，我们必须向布坦坦、Fiocruz、大学和私人实验室等国家机构投入更多资金，以使疫苗研究加速并更好地实施遏制方法。"
 BRA_relax_research_regulations: "放宽疫苗指南"
 BRA_relax_research_regulations_desc: "关于疫苗研究的强制性协议和日益严格的要求正在延迟临床试验的发展和进展，阻碍了对病毒和潜在疫苗更深入的研究。证明对我们应对COVID-19和科学进步有害，我们必须放松和简化这些要求，简化临床试验批准，并削减不必要的法规。"
 BRA_field_medical_specialists: "现场新冠检测"
 BRA_field_medical_specialists_desc: "检测缓慢、大量患者等待名单以及疫苗接种中心的集中化，使某些社区在不可接受的时间内对疫情视而不见，这些都助长了病毒的传播。因此，将装备快速检测试剂盒和基本实验室的车辆中的部队和人员动员到远离大型城市中心的社区、工厂和地区，进行现场检测和样本采集，并在短时间内提供结果。"
 BRA_military_hospitals: "建立紧急军事医院"
 BRA_military_hospitals_desc: "医院人满为患，患者被迫排队一整天或在设备不足的情况下住院，弊大于利。为了帮助减轻医院的压力，武装部队将建立并适当装备军事医院。\n\n前往这些医院的人将获得常规医院目前无法提供的适当设备和必要关注，确保没有巴西人被剥夺接受COVID-19治疗和护理的机会。"
 BRA_mass_vaccine_production: "大规模疫苗生产"
 BRA_mass_vaccine_production_desc: "COVID-19的不同浪潮和高峰使巴西处于微妙的境地，数百万平民在最需要疫苗的时期未接种疫苗。为了保护我们的公民并推进从我国根除病毒的进程，大规模生产疫苗已变得不可或缺。扩大Fiocruz和布坦坦研究所的设施，配备合适的工具和技术，以在最短时间内生产尽可能多的数量，是实现我们关于大流行目标的主要步骤之一。\n\n我们的公民将能够再次安心入睡，知道席卷了如此多生命和家庭的病毒将不再有机会影响他们。"
 BRA_faster_covid_response: "更快的响应时间"
 BRA_faster_covid_response_desc: "围绕新冠病毒的过度官僚作风夺走了无数生命。药品批准延迟、无休止的委员会辩论协议、疫苗分发在某些地区停滞不前，以及由于州长和地方当局缺乏主动性而供应累积或未使用。\n\n为了拯救我们民众的生命并防止此类悲剧再次发生，我们必须大幅减少这种官僚作风并加快我们当局的响应时间，开放分发点，并要求交付药品和资源。"
 BRA_the_agro_collapse: "农业崩溃"
 BRA_the_agro_collapse_desc: "巴西经济一直严重依赖其农业综合企业部门，特别是向美国出口农产品，但随着美国国家及其经济的崩溃，我们失去了一个主要贸易伙伴。曾经是巴西经济支柱的大型农业综合企业陷入彻底混乱。农民们用廉价农产品充斥市场以自救，并在此过程中推高了全国的通货膨胀。\n\n更糟糕的是，农民们由于复合危机导致的工资和工作条件越来越低而抗议土地所有者。如果不立即采取行动，混乱只会越来越严重，我们本已脆弱的经济将彻底崩溃。"
 BRA_reform_internal_agro: "改革内部农业政策"
 BRA_reform_internal_agro_desc: "第二次美国内战的爆发结束了巴西最大的出口市场之一，同时严重影响了我们最大的市场中国，导致该国农业综合企业崩溃和市场食品价格空前爆炸。农业是我国极其重要的市场，也是我国经济的主要支柱之一，进入了螺旋式下降，为了防止剩余的农业综合企业完全崩溃，对我们内部农业政策进行深刻改革对于我们其他贸易的生存至关重要。"
 BRA_seek_foreign_aid: "寻求外国援助"
 BRA_seek_foreign_aid_desc: "农业部门的崩溃掏空了农村银行，由于缺乏买家和价格飙升，农作物在田间腐烂，威胁到某些最依赖持续粮食供应的城市中心爆发大规模饥荒。\n\n没有内部措施可以及时采取以防止即将发生的事情；因此，我们必须寻求外部援助，无论是来自我们在金砖国家的长期盟友还是来自亚洲和欧洲等地区的战略伙伴。"
 BRA_explore_amazon_basin: "探索亚马逊盆地"
 BRA_explore_amazon_basin_desc: "亚马逊盆地长期以来因环境原因基本未开发，为我们提供了未开发的潜力，以弥补第二次美国内战开始和巴西农业综合企业随后崩溃所损失的产量。\n\n我们可以将该盆地转变为我国的粮仓，吸收剩余劳动力，帮助缓解许多地区的粮食不安全，并减轻我们因最大经济伙伴之一崩溃而遭受的一些影响。"
 BRA_organic_fertilizers: "推动有机施肥"
 BRA_organic_fertilizers_desc: "全球和国内化肥供应链的崩溃导致我国农民面临过高的成本和合成投入品短缺，威胁到无数收成和无数人的粮食安全。\n\n为了防止局势进一步失控，我们必须推广有机施肥方法，例如鼓励用天然废物堆肥和促进源自天然材料的生物肥料。"
 BRA_increase_agro_subsidies: "提高农业综合企业补贴"
 BRA_increase_agro_subsidies_desc: "农业综合企业的崩溃几乎完全切断了农村信贷线路，使大型生产者没有融资，因此无法获得更高质量的设备，导致大量作物被遗弃或提前收获。\n\n随着农业综合企业濒临崩溃，迫切需要增加补贴以维持该部门的生存和运作，为我们争取时间专注于华尔街崩溃影响的其他经济领域，同时为农业部门提供一些缓解。"
 BRA_funds_from_un: "联合国救助资金"
 BRA_funds_from_un_desc: "国库已完全耗尽，用于我们在面临所有危机时拯救经济免于彻底崩溃的尝试，实际上使我们几乎没有资金来妥善处理即将到来的事情和我们仍需处理的事情。\n\n因此，寻求联合国的救助资金对于在短期到中期拥有资源至关重要，为联邦政府提供喘息空间，并允许它有时间实施更深远和长期的改革和措施。"
 BRA_promote_market_cooperation: "促进市场合作"
 BRA_promote_market_cooperation_desc: "出口市场总体上一夜之间崩溃，由于价格原因，大型生产者收获过剩，国内外都没有买家，而更依赖持续收获的城市中心面临普遍粮食短缺危机的开始。\n\n促进国内市场合作对于度过危机至关重要，将地区合作社与超市网络和机构买家连接起来，为农村仓库提供补贴和激励，并刺激国内市场的相互联系。"
 BRA_emergency_credit_support: "紧急信贷支持"
 BRA_emergency_credit_support_desc: "农业危机冻结了市场和农村信贷线路，银行拒绝向大型公司和大型生产者提供新贷款，使他们无法购买种子、化肥或燃料来进行新的收获，威胁到全国范围内的粮食短缺和饥荒。\n\n我们不能允许90年代的饥荒重演，更不能让它更大，因此我们必须为大型农业公司提供紧急信贷支持，防止生产者大规模破产，保持关键作物的活跃生产，并降低国家进入普遍饥荒时期的风险。"
 # - 2022 Elections
 BRA_the_2022_elections: "巴西最具决定性的选举"
 BRA_the_2022_elections_desc: "2022年选举将是真正改变巴西未来的十字路口。经过多年的两极分化、经济困难以及累积的国际经济和地缘政治灾难，国家当前的局势将揭示保守派的权力项目在面临各种挫折后是否会继续，或者左翼在卢拉入狱和工人党随后在2018年失败后是否会重返权力。\n\n随着两个主要联盟——由右翼集团和贾伊尔·梅西亚斯·博索纳罗领导的§7\"巴西爱国联盟\"§!，以及由左翼集团和前总统路易斯·伊纳西奥·卢拉·达席尔瓦领导的§p\"巴西希望联盟\"§!——主导选举格局，巴西民众所怀有的两极分化和意识形态激进主义有望达到沸点。\n\n只有时间会告诉我们，但无论结果如何，§Y失败的一方不会轻易接受。§!"
 BRA_elections_side_with_lula: "巴西为希望！"
 BRA_elections_side_with_lula_desc: "巴西希望联盟在前总统路易斯·伊纳西奥·卢拉·达席尔瓦的领导下团结起来，将左翼集团——工人、工会、社会运动、进步人士、左翼知识分子和年轻人——团结在希望、社会正义和国家主权的旗帜下，他们正在对抗2018年席卷该国并导致灾难和贫困的保守浪潮。"
 BRA_elections_side_with_bolso: "爱国联盟"
 BRA_elections_side_with_bolso_desc: "巴西爱国联盟（APB）在现任总统贾伊尔·梅西亚斯·博索纳罗的领导下团结起来，将右翼福音派集团、农民、枪支权利倡导者、保守基督徒以及对左翼和工人党的权力项目幻灭的男女和年轻人团结成一个凝聚的集团，传达博索纳罗第二任期的愿景。"
 BRA_elections_renew_socdem: "重振进步政策"
 BRA_elections_renew_socdem_desc: "卢拉的前几届政府和2000年代的进步议程为该国带来了历史性的社会成就，但今天的世界与那时不同。社会不平等、气候威胁、青年对政府的幻灭以及全球各地的各种经济变革要求该党有一个振兴的、新的愿景。\n\n卢拉的竞选活动和政策应专注于扩大家庭补助金计划，大力投资可再生能源，加强公共教育，并通过平权行动和反仇恨运动打击偏见、歧视和种族主义。"
 BRA_elections_mingle_socialists: "与社会主义者交往"
 BRA_elections_mingle_socialists_desc: "贾伊尔·梅西亚斯·博索纳罗是一种邪恶，如果左翼继续因琐碎的意识形态原因分裂，这种邪恶将不会被击败。有必要暂时搁置我们的分歧，才有机会在选举第二轮击败巴西爱国联盟。\n\n确保FPTU的支持及其支持者的选票对于这场胜利至关重要，尽管略微玷污路易斯·伊纳西奥作为温和派的形象，但不足以疏远中心和温和派，加强进步阵线并巩固反对右翼和贾伊尔·博索纳罗的联盟。"
 BRA_elections_sideline_radicals: "边缘化激进分子"
 BRA_elections_sideline_radicals_desc: "巴西希望联盟得到左翼的广泛支持，但激进分子和极端分子——那些主张为进步主义和革命者使用暴力方法的人——有疏远我们赢得第二轮所需的温和选民和中左翼基础的风险。\n\n此外，将他们纳入联盟将助长贾伊尔·梅西亚斯及其爪牙的言论，他们将有更多依据指责我们是共产主义者和激进分子。\n\n因此，我们必须拒绝将极端分子纳入我们的联盟，而是选择在竞选期间边缘化他们的声音，淡化共同集会甚至对激进左翼候选人和知名人物的支持信息。通过这种方式，卢拉将能够保持其温和形象，吸引更多温和选民、商人和更大的国际支持。"
 BRA_elections_grassroots_campaign: "草根竞选"
 BRA_elections_grassroots_campaign_desc: "与人民和普通公民的直接接触是卢拉竞选活动的特点，这也是他在第一次和第二次选举中取得成功的原因。他在低收入社区、工会和较小城镇的大规模示威中露面将吸引较贫穷人群的支持，卢拉谈论就业能力、医疗保健获取、巴西儿童体面教育以及巴西工人尊严等话题。\n\n卢拉的力量一直是人民；因此，他应该避免过度依赖社交媒体甚至电视广告，利用他的支持者并将他们融入竞选活动，通过T恤、旗帜、示威和口号让他们成为卢拉连任过程的一部分。"
 BRA_elections_cruzade_for_brazil: "巴西十字军"
 BRA_elections_cruzade_for_brazil_desc: "贾伊尔·梅西亚斯·博索纳罗总统第二任期的竞选活动被定位为一场真正的斗争，一场确保左翼废墟永远不会重返权力的十字军东征，将选举描绘成一场反对腐败、社会主义和威胁基督教、祖国、家庭和自由的道德堕落的战斗。\n\n通过经济增长、减少犯罪以及兑现放松枪支所有权和打击共产主义等承诺，博索纳罗被定位为可靠的领导人，一个可以信赖的人，能够信守诺言并清除国家的不良分子。\n\n一场全国性的觉醒，博索纳罗将再次拯救巴西脱离深渊，并开启一个繁荣和美德的黄金时代。"
 BRA_elections_moderated_tone: "温和语气"
 BRA_elections_moderated_tone_desc: "随着竞选在选举过程中加深，博索纳罗开始软化他的言论，与他2018年竞选活动中标志的激烈对抗和侵略性保持一定距离。避免直接攻击司法机构和卢拉等反对党领导人，他仍然专注于更实际的问题，如沙特内战后灾难后的经济复苏、公共安全、家庭价值观，并调整他的整体信息以吸引未决定的中间派和温和派，同时保持他最忠诚的基础。"
 BRA_elections_no_holding_back: "毫不留情"
 BRA_elections_no_holding_back_desc: "民粹主义和攻击性言论是2018年选举贾伊尔·博索纳罗的原因，现在不会击败他。因此，总统正在加强他的风格，一次又一次地直接攻击左翼、媒体、司法机构以及长期让巴西人沉睡并现在正努力让他们重新入睡的系统。\n\n集会散发着一如既往的原始能量，博索纳罗提出他的主要对手路易斯·伊纳西奥·卢拉·达席尔瓦因腐败和欺诈入狱的事实，还呼吁捍卫家庭和基督教信仰，并承诺继续与有组织犯罪和腐败进行艰苦斗争。\n\n故意攻击性是为了激励他的基础，主导头条新闻，并迫使他的对手处于守势。随着他在农村地区、福音派和内陆地区的支持率达到顶峰，最大化强度以动员他的基础的策略使他的支持者更加投入和支持他。"
 BRA_elections_social_media_campaign: "社交媒体竞选"
 BRA_elections_social_media_campaign_desc: "社交媒体是将博索纳罗带到广大公众面前并推动他担任总统的关键因素。从他的第一次竞选中学到经验后，使用WhatsApp、Telegram、Instagram、TikTok和Twitter等平台对于让他获得第二任期以及绕过传统媒体并直接接触数百万人至关重要，无需SBT和环球等报纸。\n\n简短、有影响力的视频、直播、模因、音频消息和集会片段以前所未有的方式通过家庭群、社区频道和朋友群传播，将他的支持者变成他竞选活动的有机放大器。关注互联网，除了帮助他接触更多人外，还绕过了腐败媒体，让贾伊尔保持持续对话，主导在线趋势，并吸引年轻追随者和不看电视新闻的农村地区人士。"
 BRA_elections_the_last_stretch: "最后冲刺"
 BRA_elections_the_last_stretch_desc: "2022年总统选举的第二轮已经到来，巴西和所有巴西人都屏住呼吸。\n\n在第一轮接近的胜利导致APB获胜后，路易斯·伊纳西奥·卢拉·达席尔瓦和贾伊尔·梅西亚斯·博索纳罗在一场将决定该国未来几年甚至更长时间的竞选中对决。\n\n被认为是自重新民主化以来最两极分化和分裂的选举，巴西希望联盟在前总统卢拉周围团结起来，确保其他在第一轮中失利并留下的左翼候选人和联盟的支持和转移，而巴西爱国联盟在现任总统贾伊尔·梅西亚斯·博索纳罗周围巩固了保守派选票。\n\n这个国家在三大危机后疲惫不堪，等待着疲惫、分裂、紧张和屏住呼吸，§Y因为这将不是一场普通的选举，而是巴西民众的清算。§!"
 # - Interim
 BRA_elections_not_over_yet: "还没结束"
 BRA_elections_not_over_yet_desc: "2022年选举已经结束，巴西爱国联盟与博索纳罗一起以微弱差距被击败，卢拉和左翼赢得了被描述为本世纪以来最具欺诈性的巴西总统选举。\n\n巴西利亚的APB总部是震惊的沉默和克制愤怒的场景，日夜为总统竞选工作的员工盯着TSE屏幕显示最终结果，组织者无方向地走来走去，思考从现在开始可能发生的一百万种可能性。贾伊尔·博索纳罗总统本人处于绝对媒体沉默中，不接受任何采访或祝贺当选的卢拉·达席尔瓦。\n\n这场失败在数月的势头、大规模集会和第一轮胜利后像是一拳打在肚子上，但投降不是总统的词汇，也不是他的支持者的词汇。\n\n右翼以前从未轻易投降，现在也不会。"
 BRA_assemble_emergency_meeting: "召开紧急会议"
 BRA_assemble_emergency_meeting_desc: "距离卢拉·达席尔瓦第三次就职只有几周时间，如果博索纳罗想防止国家再次陷入深渊，他需要迅速采取行动。他召集他的核心圈子——包括他的长子、高级将领、议员和忠诚的政治家——召开一次对公众、司法机构和国会保密的紧急会议，讨论选举结果的有效性，他们是否会接受，以及如何应对即将到来的政府。"
 BRA_rally_the_protesters: "召集我们的支持者"
 BRA_rally_the_protesters_desc: "\"他们试图压制一个充满希望的国家的声音。试图熄灭让我们再次相信的光芒，巴西仍然有机会。\"\n\n§Y他们失败了。§!\n\n在整个巴西，街道上布满了绿黄旗帜，\"卢拉小偷，你的地方在监狱里！\"和\"欺诈\"的呼喊声充斥着那些抢劫了船长第二次胜利的腐败分子和支持欺诈的恶棍的耳朵。\n\n在圣保罗、里约热内卢、库里蒂巴、贝洛奥里藏特和无数其他城市，爱国者成千上万地走上街头，无论是卡车司机封锁高速公路、身着旗帜并热爱国家的家庭男人在呼喊，还是诚实的工人，所有人都团结起来，一劳永逸地推翻再次试图阻止巴西进步的政权。\n\n船长在普拉纳托宫向全国发表讲话，拒绝承认接管投票箱的欺诈行为，鼓励所有善良、诚实的公民走上街头为正义而战。\n\n选举失败从来不是结束，也不是右翼的结束，真正的全国觉醒才刚刚开始。"
 BRA_secure_our_allies: "确保我们的联盟"
 BRA_secure_our_allies_desc: "博索纳罗的任期即将结束，APB面临一个关键决定。2022年将右翼带到近乎胜利的联盟仍然如旧，但失败造成了裂痕，导致右翼可能分裂的开始。一些集团，无论是较小的政党、福音派团体，甚至是温和派，都在考虑转向中心，与卢拉及其即将到来的政府谈判，甚至离开联盟以保护他们的职位。\n\n我们必须不允许这种情况发生，因为这将进一步削弱保守集团，使得在可能的2026年选举中击败卢拉变得越来越困难。因此，在这个时刻确保我们的联盟必须是首要任务，博索纳罗和APB需要通过持续联系、未来利益的承诺以及在未来州和全国选举中的支持来保持他们的盟友靠近。"
 BRA_form_the_opposition: "组建坚定的反对党集团"
 BRA_form_the_opposition_desc: "卢拉的胜利是艰难的，为他赢得了总统职位，但没有获得多数或绝对权力。尽管士气低落，APB不会随着他的政府结束而解散，而是转变为一个统一、激进和持续的反对党集团，准备成为新政府眼中的一根刺，并承诺反对卢拉试图采取的每一步。\n\n将毫不犹豫，没有\"根据正确的事情投票\"的历史。卢拉是邪恶的，一个夺走国家二十年进步并打算再次夺走的邪恶。因此，我们将持续向他施加压力，迫使他采取激烈措施，团结起来阻止他们试图在国会通过的任何事情。\n\n每一个违背的承诺、每一次政治失败、每一个丑闻都将被最大限度地曝光，目的是侵蚀卢拉及其支持率，以便在2026年，他遭受政治生涯中最大的耻辱。"
 BRA_elections_love_triumphs: "爱胜利了！"
 BRA_elections_love_triumphs_desc: "经过数月在高度敌对和两极分化的环境中的艰苦竞选，路易斯·伊纳西奥·卢拉·达席尔瓦和巴西希望联盟在选举第二轮中获胜，令巴西人松了一口气。以微弱优势击败贾伊尔·梅西亚斯·博索纳罗和右翼巴西爱国联盟标志着左翼在迪尔玛·罗塞夫弹劾失败后重返普拉纳托宫。\n\n然而，尽管工人和人民心中充满了宽慰和满足，但必须认识到胜利是接近的，而且正是因为他们现在被击败，博索纳罗的支持者将变得比以前更暴力。国会仍然是一个分裂的舞台，国家经济在总统管理不善和面对如此多危机的否认主义之后仍然脆弱。\n\n无论如何，这场胜利标志着国家和左翼的历史性转折点。卢拉的第三任期将需要平衡、耐心和冷静——这是工人党领导人拥有的品质。"
 BRA_assemble_the_cabinet: "组建我们的内阁"
 BRA_assemble_the_cabinet_desc: "选举胜利后，首要和最紧迫的任务是组建新政府。FBE联盟包含不同的集团——包括工人党成员、温和左翼分子、中间派和左翼民族主义者——帮助击败了妄想的皮诺切特。然而，这个相同的联盟现在使组建内阁变得复杂，不同方面要求代表和恩惠。\n\n关于部委和秘书处分配的谈判正在进行中，寻求保持我们的盟友富裕，同时不稀释卢拉的权威或疏远任何派系。重要的是根据在不同部门任职的人物来认识我们政府的基调，寻求务实进步主义的形象。每个选择的名字都将被精心分析，无论是来自联盟最温和还是最激进的派别。"
 BRA_draft_budget_plan: "起草预算计划"
 BRA_draft_budget_plan_desc: "在批准的财政框架下的第一个预算，该法律规定支出限制同时允许社会投资的灵活性。起草这个计划是新政府的第一个真正的重大考验，需要平衡兑现竞选承诺的必要性，例如扩大家庭补助金、SUS和其他社会计划，与财政责任，旨在满足市场和投资者。"
 BRA_address_protests: "处理抗议活动"
 BRA_address_protests_desc: "正如许多人预期和评论的那样，博索纳罗总统的支持者在他失败后走上街头抗议，声称\"选举欺诈\"。然而，这些相同的示威活动升级为对当局和公众的骚乱，卡车司机封锁高速公路，城市中心设置路障，工人党支持者和博索纳罗支持者之间发生冲突，以及各大首都报告抢劫和暴力事件。\n\n卢拉至少有必要对事件发表评论，在各种出版物和官方声明中谴责双方的暴力和极端主义，并传达信息，尽管遭受挫折，和平抗议是公民的权利，应该得到支持，但破坏和破坏只是反民主和犯罪行为。"
 BRA_prepare_the_inauguration: "准备就职典礼"
 BRA_prepare_the_inauguration_desc: "卢拉的就职典礼仅几周之遥。仍由博索纳罗控制的普拉纳托宫被严密的安全部队包围，包括军事警察、联邦部队、屋顶上的狙击手和头顶飞过的无人机。传统的1月1日总统绶带交接仪式正在以与以前不同的谨慎和关怀进行规划，而是更加严格和计划周密。\n\n在国家存在暴力抗议和激进主义的情况下，巴西屏住呼吸。这一次，仪式将不仅仅是一个事件；它将是一个测试，以衡量巴西，并看看它在数月的欺诈指控、抗议和让人想起内战的反对言论之后是否仍然能够实现和平民主的过渡。"
 # - Civil War Phase One
 BRA_the_south_burns: "南方燃烧"
 BRA_the_south_burns_desc: "船长在被社会主义强盗团伙欺诈性地窃取连任后，理所当然地站起来，宣布不会接受结果，结果已被伪造。\n\n然而，事情急剧恶化。在绿黄匕首行动、宣布戒严、创建军事指挥部以及军队未能以非致命方式遏制抗议之后，巴西崩溃了，民兵和恐怖分子崛起，接管了我们的城市并恐吓这个国家的善良人民。\n\n即使在巴西军队内部，声称要为\"宪法和民主\"而战的颠覆性分子背叛了祖国，并宣布不再遵循博索纳罗总统的命令。\n\n现在，和平的时代已经结束。为了从恐怖分子和古巴之子手中拯救巴西，博索纳罗必须站在国家面前努力工作，不是为了自己，而是为了§Y上帝，§! §G祖国，§!和§B家庭！§!"
 BRA_brazil_above_all_focus: "巴西高于一切"
 BRA_brazil_above_all_focus_desc: "巴西正处于该国历史上最大的混乱时刻，叛徒、民兵和恐怖分子在数月的内部动荡后暴露出来，现在已经控制了我们心爱和渴望的城市，用武器和刀具追捕这个国家的善良公民，在全国范围内。\n\n在这个绝望的时刻，我们的孩子被新纳粹杀人犯、堕落的共产主义者和恐怖分子逼到角落，蜷缩在家里恐惧地等待我们的到来。巴西人民需要一个目标，一个呼吁团结那些与我们在一起并永远不会离开我们的人。\n\n始终，始终，从这个美丽祖国的历史开始以来，巴西克服了它面临的每一个挑战，从未遭受过失败，而南美洲或其他地方的其他国家在某些时候或以某种方式都失败了。\n\n不是我们。不是靠运气，也不是巧合，而是因为一个原因：巴西是一个被爱、被赞誉和被崇拜的国家，巴西高于一切。"
 BRA_god_above_everyone_focus: "上帝高于所有人"
 BRA_god_above_everyone_focus_desc: "巴西正处于深渊边缘，社会混乱威胁着吞噬国家和民众。在这个极端考验的时刻，我们有责任宣告在最困难时刻拯救他的人民的那位，万王之王、万主之主、人类的救主、永恒之光和所有力量的源泉，拿撒勒的耶稣基督。\n\n耶稣基督的教导和圣经的指引从一开始就教导我们团结的重要性以及上帝将拯救义人并惩罚恶人的信念。\n\n我们和他所有的追随者有责任将造物主的信息传播到全国和所有这些受苦的人民，记住秩序源于正义、家庭和对造物主的服从，无论当前时刻看起来多么困难，跟随他将带来和平和比当前苦难更大更好的东西，因为只有他才能引导巴西走出所有这些黑暗。"
 BRA_our_traditional_families: "我们的传统家庭"
 BRA_our_traditional_families_desc: "巴西国家在各种民兵和恐怖组织中的崩溃撕裂了巴西社会的结构，分离了家庭，留下成千上万的儿童成为孤儿，并使传统价值观下降、被嘲笑和在社会混乱中被抛弃。\n\n我们的士兵和那些支持我们的人目前孤独一人，在他们心爱的家园被摧毁的情况下士气处于最低点。因此，至关重要的是动员他们并提醒他们，仍然有值得为之奋斗的东西：\n\n家庭。他们的父亲、母亲和孩子。"
 BRA_our_onbowing_liberty: "我们不屈的自由"
 BRA_our_onbowing_liberty_desc: "巴西处于一个被分裂、极端主义和独裁者野心撕裂的国家的残骸之中，但心爱的自由之火尚未熄灭。在这个考验时刻，人民需要记住他们真正为之奋斗的东西和他们冒着生命危险的东西。\n\n自由定义了我们作为一个民族、一个国家和一个社会。无论是言论自由、财产自由、工作和商业自由，自由构成了一个健康的社会，并使其保持良好状态。\n\n然而，近年来，这个概念被堕落者和强盗抹去，他们出于自私的动机，希望并用社会主义和审查的锁链奴役公民。我们的责任是撤销这个肮脏的过程，并提醒每个人，从最普通的到最富有的公民，自由是不容协商的。"
 BRA_prepare_for_the_worst: "为最坏情况做准备"
 BRA_prepare_for_the_worst_desc: "不用说，情况很严重。三大危机，加上第二次美国内战、经济濒临崩溃以及农业综合企业的崩溃，唤醒了每个人最糟糕的一面，使国家脆弱并屈服于极端分子和最糟糕的人。\n\n尽管我们可能喜欢，但希望每天都变得越来越遥远，准备大规模内战情景是必要的，尽管这是我们最不希望国家发生的事情。\n\n考虑到这一点，储存燃料、食品、药品和弹药变得至关重要，以使我们处于潜在敌人之上，将这些库存储存在远离普通民众的安全地点。此外，军事设施、水处理厂、通信中心、城市中心和关键食品链将获得加强防御，并在轰炸和直接对抗情况下制定疏散路线。"
 BRA_start_negotiations: "开始谈判"
 BRA_start_negotiations_desc: "所谓\"法制军\"的颠覆分子和叛徒保持他们的立场，紧张局势和全面内战的风险每分钟都在增加。但是，尽管仍然有先发制人的优势，但有必要在叛乱完全吞噬国家之前尝试和平结束这场叛乱。\n\n因此，将与法制派启动谈判，派遣使者与叛乱指挥官会面，向放下武器的人提供大赦和赦免，保证公平审判，并承诺向愿意恢复秩序并放弃叛乱想法的人做出让步。\n\n在这些会议中，巴西利亚寻求和平，而不是报复或攻击，但明确表示如果拒绝，将毫不犹豫地采取军事行动。"
 BRA_rally_the_army: "召集军队"
 BRA_rally_the_army_desc: "随着叛乱分子跨越红线、积极攻击我们的部队以及内战危险成为现实，武装部队作为国家最后的秩序保障必须被动员起来，这极其必要。因此，有必要召集巴西军队的剩余部分、忠诚的将军、地区指挥官和所有级别的士兵，无论是现役还是预备役——所有为自由而战并从地球上最糟糕的人渣手中拯救巴西民族的人。"
 BRA_promise_order_and_stability: "承诺秩序与稳定"
 BRA_promise_order_and_stability_desc: "到处都是激动的民众；内战的危险和全国大屠杀的故事像野火一样传播，使数百万公民感到恐惧，他们看到法制叛乱之外，知道局势使最近几十年甚至更长时间建立的一切都处于危险之中。\n\n如果我们想在我们的领土内保持稳定并避免国家更多的耻辱，有必要直接向巴西人民传达一个明确和明确的信息：\n\n§Y秩序和稳定将恢复。§!"
 BRA_prepare_our_diplomats: "准备我们的外交官"
 BRA_prepare_our_diplomats_desc: "当军事准备继续进行，民众动员并准备战争时，巴西利亚必须保持开放，尽管困难但可能，通过外交途径和平解决叛乱。因此，将组建一个由外交官、法律专家和信任的中间人组成的外交使团，并待命，以防忠诚派表现出任何谈判意愿。\n\n尽管机会几乎为零，但我们保证如果叛乱分子愿意合作，我们将抓住这个机会，为了巴西的利益，此外，这也有助于表明我们寻求为巴西民众谋取最大利益的善意，即使我们正在与最糟糕的叛徒打交道。"
 BRA_stabilize_the_situation: "稳定局势"
 BRA_stabilize_the_situation_desc: "经过数月的紧张对峙和内战不可避免的感觉，我们外交官促成的谈判取得了成功，叛徒在我们压倒性力量的威胁和谈判中提出的有利条款以及失败并遭受比他们所能承受的更严重后果的风险下投降并撤退。\n\n一场可能成为血腥内战、将摧毁该国多年的战争通过外交手段和向叛乱分子保证如果他们诉诸武力，局势将以同样的方式结束，但对他们及其同志的后果更严重而得以避免。\n\n随着叛乱领导人被软禁，等待审判，稳定国家的漫长而艰巨的过程开始了，同时努力清除仍然在该国其他地区构成威胁的恐怖分子。"
 BRA_fortify_brasilia: "加固巴西利亚"
 BRA_fortify_brasilia_desc: "法制派拒绝了我们所有的和平提议、所有的大赦提议以及我们愿意采取的所有问题来缓和局势。他们拒绝退缩让我们别无选择，只能进行武装冲突。\n\n我们暂时将目光转向我们的首都巴西利亚，它暴露在外，宽阔的大道便于机动推进，周边周长太大，无法由目前在城市中的部队防守，使得进入和征服该地区变得容易。\n\n比以往任何时候都更重要的是，巴西利亚必须在叛徒的第一只靴子踏上我们的领土之前变成一座堡垒。\n\n随着环绕战略区域的反车辆壕沟、为保护重要建筑而建造的沙袋和墙壁以及沿不同通道建立的军事哨所，武装部队将大量进入城市，定位在战略位置，以便如果敌人到达，他们将在甚至看不到是什么击中他们之前被杀死。\n\n§R最糟糕的情况已经发生。和平已经尝试了多次；既然它不在我们的路上，我们将确保他们后悔拒绝我们的条款。§!"
 BRA_danca_das_cadeiras: "政治音乐椅"
 BRA_danca_das_cadeiras_desc: "巴西爱国联盟在签署国家拯救法III后解散，其残余分散在政治舞台上。曾经在贾伊尔·梅西亚斯·博索纳罗领导下呈现为一个坚实统一的集团，现在形成了竞争对手和反对集团，每个集团都声称在政府中的合法性，并为巴西的未来提供不同的愿景。\n\n政府发现自己处于一个微妙的管理局面，一场权力斗争，试图平衡局势以免失控，希望最终其中一个联盟能够巩固足够的政治权力来控制政府并最终掌权。"
 BRA_God: "上帝"
 BRA_God_desc: "巴西联合基督徒阵线作为博索纳罗政府中的宗教集团脱颖而出，这是一个由福音派领袖、保守天主教徒和宗教选民组成的大型有影响力的团体。对他们来说，国家应该以明确的基督教原则塑造，捍卫从受孕开始的生命，维护传统家庭，并反对全球主义-撒旦精英强加的道德堕落。\n\n他们的平台专注于宗教性和宗教问题，FCUB成员倡导彻底根除世俗国家，将堕胎定为犯罪，限制性别意识形态，学校强制祈祷时间，圣经教义，并承认基督教为巴西的官方宗教。"
 BRA_prosperity_theology: "繁荣神学"
 BRA_prosperity_theology_desc: "真正的繁荣完全来自于对造物主意志的顺从和服从。\n\n这个信息必须传播到每个地方。广告牌、广播赞助商、社交媒体帖子、电视台，以及通过布道传播我们信息的购买的扩展和推广。这个国家的所有生物和每个空间都将知道那些顺服耶稣基督的人所获得的繁荣，那些跪在他面前的人生活中流入的所有美好，无论是财务、精神还是心理上的繁荣。"
 BRA_denounce_godless_traitors: "谴责无神叛徒"
 BRA_denounce_godless_traitors_desc: "内战，除了是基于意识形态和意志的冲突外，还是精神上的。一场基督力量与恶魔寄生虫的斗争，这些寄生虫在地狱之门打开后从地狱世界来到我们的世界。\n\n无神论者和仇恨基督者的部落将灵魂出卖给世俗主义、全球主义和邪恶的左翼异端邪说，他们就是指挥和组成所谓\"法制军\"的人。许多人不知道这一点，因为我们的信息不专注于它；这必须改变。巴西民族的所有公民都必须知道我们在这场战争中真正面对的是什么。"
 BRA_protect_christian_values: "保护基督教价值观"
 BRA_protect_christian_values_desc: "在这些考验、道德混乱、社会崩溃和战争的时代，基督教价值观不断受到攻击，无论是来自堕落的共产主义者还是嗜血的无神论者。政府必须坚定地采取行动，保护和促进这些长期指导巴西人的原则，并使这个国家能够度过许多过去的动荡。\n\n不仅在言语上，而且在公共政策中，例如全面禁止谋杀性的堕胎做法，捍卫婚姻，确保基督教在学校和工作场所的传播，并支持在这些困难时期确保许多人获得援助、食物和住所的宗教举措。\n\n自耶稣基督时代以来，许多帝国和国家声称是\"基督的毁灭者\"。所有人都悲惨地失败了。现在地狱之门已经打开，最糟糕的恶魔——共产主义者、恐怖分子、无神论者和新纳粹异教徒——来到这些土地上，我们有责任确保我们祖先的传统继续下去。"
 BRA_gods_chosen: "上帝的选民"
 BRA_gods_chosen_desc: "神话，船长，被上帝选中治理巴西民族的人，贾伊尔·梅西亚斯·博索纳罗，一个在这个神圣家园和所有居住在其中的人——无论是恐怖分子还是善良的人——都知道的名字。\n\n他来到这片土地不是为了治理它，也不是为了成为另一个像我们所谓的中央党政治家那样的腐败卖官僚；他来是为了解放巴西摆脱混乱，领导国家及其人民对抗腐败和红色暴君。他的遗产永远存在，我们必须不断记住他真正是谁以及他为祖国所做的事迹。"
 BRA_condemn_secularism: "谴责世俗主义"
 BRA_condemn_secularism_desc: "法制派，祖国和耶稣基督的叛徒，进一步揭示了他们的仇恨和异端邪说的程度。他们是恶魔，撒旦的仆人，除了鄙视基督教信仰——自成立以来一直支撑巴西的信仰——以及将这个国家团结为一个民族的价值观之外什么都不做。\n\n因此，必须向那些不将恐怖主义运动视为真正面目的人揭示真相：世俗主义者，堕落的堕落天使的走狗，他们试图通过他们的鸡奸和地狱般的耻辱吞噬巴西。通过广播、教堂布道的共享视频、广告牌、小册子和社交媒体视频，整个巴西将知道法制派的真实面目。"
 BRA_with_the_lord_as_our_guide: "以主为我们的向导"
 BRA_with_the_lord_as_our_guide_desc: "巴西站在悬崖边缘，面临重生与毁灭之间的选择，被犯罪派系摧毁，以战争和世俗堕落为标志。然而，我们拥有的力量不仅仅是军队或博索纳罗总统，而是拿撒勒的耶稣基督。\n\n我们是一个在上帝之下的国家，由他创造和祝福。\n\n自从这个祖国成立以来，我们一直受到主的祝福，被召唤按照他的教导生活，并为他的旗帜而战，不为其他。\n\n战争的混乱和世俗恶魔的堕落以前没有盛行，现在也不会盛行。借着主的力量和授权，我们将每个巴西人团结在一个更大的目标中：捍卫祖国，保护弱势群体，并建立一个值得你祝福的国家。\n\n因为十字架是我们的盾牌，信仰是我们的剑，主是我们的向导。"
 BRA_the_image_of_the_cross_shines: "十字架的形象闪耀"
 BRA_the_image_of_the_cross_shines_desc: "巴西联合基督徒阵线成功巩固了其在政府中的影响力，标志着基于基督、圣经和信仰的长期国家计划的第一步。\n\n宗教领袖，无论是福音派还是天主教，占据重要的咨询职位、国会席位和塑造国家的其他关键角色，根据主的意愿影响和制定教育、家庭、生命问题和道德方面的政策。\n\n在巴西成为的风暴中，耶稣的形象再次突出，加强了政权在信徒中的合法性，加深了教会的支持，并表明经过很长时间，主和基督教不再被视为众多选择之一，而是作为唯一的光，引导巴西走向未来的真正之光。\n\n§n巴西利亚，被十字架照亮，肩负着将国家带回正常和常识的重任。§!"
 BRA_Homeland: "祖国"
 BRA_Homeland_desc: "祖国拯救阵线作为博索纳罗政府中的军事集团脱颖而出。由将军、退伍军人、公共安全专家和爱国者组成的有影响力的大型团体，将内战视为真实的：热爱国家的人与宣扬国家终结和毁灭的愚蠢人群之间的斗争。\n\n坚定不移，爱国者宣扬国家必须由一支强大而纪律严明的军队保卫，其人民愿意为祖国服务、受苦和牺牲。\n\n捍卫武装部队，他们倡导优先考虑国防，进行更严格和广泛的军事训练，在学校教授作为爱国者意味着什么，并向巴西军队致敬，因为他们是真正的救世主，曾经从共产主义手中拯救了国家，并正在努力再次拯救它。"
 BRA_protect_the_young_minds: "保护青年的心灵"
 BRA_protect_the_young_minds_desc: "这个国家的青年是未来，是将决定这个国家未来的人。然而，在这个困难时刻，年轻人容易受到战争混乱、异教和世俗意识形态的毒害，以及所有导致巴西社会毁灭的道德混乱的影响。\n\n因此，我们青年的眼睛和耳朵必须闭上，以便占据这个国家的寄生虫无法传播他们的谎言并用腐蚀性思想寄生我们孩子的心灵。"
 BRA_vanquish_progressivism: "战胜进步主义"
 BRA_vanquish_progressivism_desc: "进步主义，一种试图在每个国家扩散以吸干其人民的血液直到摧毁国家身份和骄傲的疾病。\n\n在巴西，它占据主导地位太久了，通过保罗·弗雷雷的教育、对传统家庭的攻击、对我们过去的妖魔化以及通过所谓\"社会计划\"奴役我们人民的整个部分，将其腐蚀性和破坏性意识形态强加给我们的人民。\n\n恢复这个国家的秩序，将这种意识形态和这些思想扔进它们所属的垃圾堆，这是非常必要的。我们将解放人民的心灵，使他们能够看到这些年来对他们造成的伤害以及从他们身上偷走的一切。"
 BRA_instill_patriotic_values: "灌输爱国价值观"
 BRA_instill_patriotic_values_desc: "内战撕裂了巴西，暴露了深刻的分歧，并严重削弱了曾经团结国家的共同身份感。在原领土不同地区的许多巴西人厌恶地看待国旗，对一个他们认为抛弃了他们并剥夺了他们未来的祖国感到反感。\n\n爱国主义对许多人来说变成了愤世嫉俗，被视为国家渣滓应该反对的东西，或者被叛乱分子劫持。\n\n尽管这是这个国家历史上最微妙的时刻，但它也是一个巨大机遇的时刻。战争、苦难、强烈的情感——所有这些都迫使一个人面对他们愿意为之牺牲的东西、愿意牺牲自己的东西以及他们真正热爱祖国的什么。\n\n重要的是我们利用这个时刻来唤醒和重新点燃民众的爱国情感，促进庆祝我们最负盛名的象征的公共活动、军事仪式、向国旗宣誓，以及宣传在这个困难时刻冒着生命危险为祖国服务的公民的英雄故事。"
 BRA_our_glorious_heroes: "我们光荣的英雄"
 BRA_our_glorious_heroes_desc: "与许多人认为的相反，巴西拥有丰富的英雄——为国家独立而战、在巴拉圭战争和第二次世界大战等战争中保卫国家、建立其机构并为共同利益牺牲自己的男女。\n\n然而，由于统治这个国家的恶棍，许多巴西人长大后从未听说过这些人物，或者在他们的课本中只是将他们视为具有可遗忘意义的名字。\n\n当前时刻要求我们改变这种情况。为这个国家牺牲的光荣男女不仅应该被记住，还应该被尊崇、庆祝，并用作受苦人民的榜样，他们在这个微妙时刻如此迫切需要依靠的人物。\n\n蒂拉登特斯、佩德罗一世皇帝、高度聪明和明智的佩德罗二世皇帝以及我们武装部队的守护神路易斯·阿尔维斯·德·利马·席尔瓦只是这个国家历史上最伟大人物中的一些。所有这些都将被庆祝，他们的故事将被教导，并为他们竖立雕像。\n\n以荣耀和崇敬，他们的名字将被后代记住和庆祝。"
 BRA_your_children: "你的孩子"
 BRA_your_children_desc: "祖国拯救阵线巩固了其在政府中的权力和影响力，标志着基于祖国、爱国主义和民族主义的长期项目的第一步。\n\n由将军、退伍军人、安全专家和爱国平民组成的集团现在占据国会重要席位和总统的咨询职位以及塑造国家的其他关键角色，使他们能够根据自己的愿景影响和塑造国家，而不受其他集团的重大反对。\n\n需要做什么是明确的。不仅要管理安全政策、教育和公民培训，还要创造一代人，将为祖国服务视为最高尚的职业。\n\n§G武装部队再次从共产主义和堕落的魔爪中拯救了巴西，现在能够培养热爱自己国家的公民，理解作为巴西人意味着什么，并理解牺牲、忠诚和自由的代价。§!"
 BRA_Family: "家庭"
BRA_Family_desc: "巴西家庭阵线作为博索纳罗政府中的保守派脱颖而出，这是一个由家庭捍卫者、福音派领袖、农村工人和传统主义选民组成的大型有影响力的团体，他们为恢复该国的道德和理智而战。\n\n坚定不移地坚持他们的信念，他们捍卫巴西传统家庭，认为它是反对混乱的第一道防线和社会道德的堡垒。然而，他们不只是说说而已；他们坚决支持保护和促进这一模式的政策，无论是通过税收激励、对堕胎和性别意识形态的限制，还是促进家庭本质的运动：稳定的基础。"
BRA_return_family_control: "恢复家庭控制权"
BRA_return_family_control_desc: "我们心爱国家其他地区的江湖骗子自称\"家庭捍卫者\"，但是谁，这么久以来，牺牲了他们所拥有的一切来捍卫家庭、传统和自由？是谁，面对社会主义暴徒，高呼言论自由？是谁无数次走上街头，冒着被监禁的风险，把渣滓称为他们本来的样子？\n\n是我们。\n\n面对危险，只有爱国者和善民站起来反对旨在在我国植入共产主义的极权政权。即使在监禁确定无疑的情况下，也只有爱国者挤满全国街道，要求弹劾小偷的傀儡迪尔玛·罗塞夫。如果不是我们，国家将处于试图夺走这个民族未来的同一个恶棍统治之下。\n\n必须提醒民众这一点。"
BRA_the_immoral_vanguard: "不道德的先锋队"
BRA_the_immoral_vanguard_desc: "那些颠覆了一个国家生存所需的所有健康价值观的人，那些用他们腐蚀性的思想如恐基督症和性别意识形态灌输民众的人，那些耗尽国家资金并不懈努力抹去这个国家辉煌过去的人，现在正试图在窃取选举失败后再次掌权。\n\n法制派，肮脏和不道德的先锋队，正在努力再次从巴西民众手中窃取，用巴西人辛勤赚来的钱填满他们的口袋，同时玷污这个国家的文化和历史。\n\n然而，通过窃取选举并引发内战，他们犯下了一生中最大的错误，因为他们的污秽暴露在所有人面前。他们将被摧毁，这一次，我们将确保他们肮脏的思想永远不会再触及巴西。"
BRA_safeguard_traditional_values: "维护传统价值观"
BRA_safeguard_traditional_values_desc: "内战及其对社会的后果暴力侵蚀了巴西的传统价值观——对权威的尊重、家庭、纪律和民族自豪感——取而代之的是恶魔意识形态、文化和道德堕落、基督教的嘲笑、个人主义、虚无主义以及许多其他与健康社会构成要素相悖的价值观。\n\n我们必须坚定地采取行动，维护和培养我们所捍卫的价值观，促进强调每个公民在这些土地上的根源、核心家庭结构以及对亲属和长辈尊重的运动。\n\n在这个由这个国家所能提供的最糟糕的人不断宣传推动的微妙时刻，我们成为我们孩子、家庭和所有被这场风暴变得脆弱的人的盾牌，这一点极其重要。"
BRA_defenders_of_families: "家庭的捍卫者"
BRA_defenders_of_families_desc: "巴西家庭是这个国家最重要的支柱。它的力量决定了国家的力量，它的爱决定了其子女的爱。然而，这一支柱正受到攻击；战争、巴西经济的崩溃、文化变化和信息战已经并将继续对家庭施加巨大压力。\n\n解决这个问题并将自己定位为捍卫家庭的铁墙，这一点至关重要。通过将公共政策集中在这个问题上，我们必须宣传在这些时代为家庭牺牲伟大事物的母亲们，为国家服务而离开家园的父亲们，以及尽管暴露在如此多暴力和极端主义中仍忠于家庭和国家的坚韧孩子们。"
BRA_gentle_mother: "温柔的母亲"
BRA_gentle_mother_desc: "巴西家庭阵线成功巩固了其在政府中的影响力，标志着建立一个重视传统主义、巴西家庭和保守主义的社会的长期重大项目的第一步。\n\n宗教和保守政治领导人现在占据国会多数席位和博索纳罗总统顾问团队的关键职位，使他们能够影响和制定专注于重视上帝、祖国和家庭的公共政策。\n\n§P母亲，培养负责任和纪律严明的男人的养育力量和基础，将因其所做的一切以及她在巴西社会中的关键作用而受到重视和庆祝。§!"
BRA_Liberty: "自由"
BRA_Liberty_desc: "自由与繁荣阵线作为博索纳罗政府中的自由派，由自由市场倡导者、企业家、古典自由主义者、个人权利捍卫者和言论自由支持者等不同个人组成，他们都统一于经济自由是使金钱——国家的引擎——运转的愿景。\n\n毫不妥协，该集团的平台包括私营企业自由化、大幅削减过高税收、国有资产私有化，以及保护和扩大财产权免受侵占。吸引城市专业人士、精通技术的人士、农业综合企业和对失败经济模式幻灭的年轻选民，该集团为巴西一劳永逸地摆脱威权链条而战。"
BRA_clean_governance_free_populace: "廉洁治理，自由民众"
BRA_clean_governance_free_populace_desc: "经过多年的腐败政府和只想着提高税收和窃取我们人民的总统，巴西人已经停止了所有盗窃行为，现在正在努力一劳永逸地结束腐败。\n\n幸运的是，对于公民来说，我们不像之前统治这个国家的小偷，最后，公民可以呼吸新鲜空气，知道他们生活在一个没有过度官僚作风、不必要法规和滥用税收的国家，同时保持他们的个人自由。"
BRA_wardens_of_stagnation: "停滞的守护者"
BRA_wardens_of_stagnation_desc: "巴西作为一个腐败盛行和\"犯罪有回报\"的国家的声誉并非偶然或巧合。法制派，耻辱和腐败的战士，由那些臃肿这个国家官僚机构、腐败其机构并用法规和税收扼杀国家的人组成。\n\n他们是那些发誓要为\"一个更好的巴西\"而战的人，但他们斗争的真正面目是再次将巴西束缚在一个失败和悲惨的未来。我们必须向全体民众揭示这一真相，不仅在我们的领土内，而且向所有生活在叛乱分子、恐怖分子或其他地区盟友控制下的人。"
BRA_keep_entrepreneurs_coming: "保持企业家到来"
BRA_keep_entrepreneurs_coming_desc: "三大危机首先影响的领域之一是经济，投资者的逃离是巨大的，甚至在内战开始后更是如此，对短期和中期经济造成了不可挽回的损害。如果我们想有朝一日恢复这个国家，我们绝不能让创新和企业家精神消亡。\n\n即使巴西市场面临前所未有的压力，政府尽可能保持投资者参与也至关重要，扩大对小企业的税收激励，减少法规以允许更快、更便宜地开业和运营，并优先考虑创造就业机会和生产国家迫切需要的商品的企业。"
BRA_protect_civil_liberties: "保护公民自由"
BRA_protect_civil_liberties_desc: "战争造成的破坏为恐惧创造了肥沃的土壤，我们领土内的许多平民担心政府和博索纳罗会利用危机作为实施威权措施的借口。然而，这个想法不仅将被拒绝，而且必须被扭转，将其转变为即使在危机时期政府也能为其公民维护自由的想法。\n\n言论自由、集会自由和结社自由——被认为是首先应该被压制的东西——将得到大力捍卫。非常必要的是，我们将向人民证明我们为使一个国家值得捍卫的原则而战，这是叛乱分子和恐怖分子严重缺乏的东西。"
BRA_sun_of_freedom: "自由之阳"
BRA_sun_of_freedom_desc: "自由与繁荣阵线成功巩固为博索纳罗政府中有影响力的多数政治力量，标志着创建一个更自由、更富裕和更发达的巴西的长期项目的第一步。\n\n投资者、自由派政治家和个人自由的坚定倡导者现在占据国会多数席位和总统的重要咨询职位，允许他们影响、创造和制定有利于个人自由、私有化和经济自由的公共政策。\n\n§Y巴西的未来是光明的，这一成就归功于那些自由、梦想家和雄心勃勃的人，使国家能够走上繁荣、机遇和巨大财富的道路。§!"
BRA_the_patriotic_duty: "爱国义务"
BRA_the_patriotic_duty_desc: "\"前进，士兵们！让我们战斗！\n没有荣耀的生命毫无价值！\n如果需要牺牲，我们将牺牲，\n为了巴西，为了胜利！\"\n\n伟大的巴西祖国处于任何人都无法想象的最极端深渊之中。国家的未来岌岌可危；我们所做的一切、所想的一切、所说的一切——都可能决定我们心爱的国家是落入疯狂共产主义者还是虐待狂纳粹的手中。\n\n每个公民都很重要；自称巴西人的人有责任在国家最困难的时刻为其服务。从最高级别的军官到最低级别的警察，所有有步枪、两条腿和战斗能力的人都必须响应国家的号召，因为这可能是我们拯救这个国家免受地球上最具破坏性意识形态影响的最后机会。"
BRA_empower_the_high_command: "授权最高司令部"
BRA_empower_the_high_command_desc: "我们的武装部队长期生活在和平与舒适中，除了几次对有组织犯罪的干预外，几乎没有经历过战斗。现在，他们面临着一场真正的战争场景，对抗成群结队的坚定和疯狂的恐怖分子、叛乱分子和叛乱者，他们唯一的想法是摧毁这个国家内最后的自由火焰。\n\n因此，那些在战斗和军事规划方面比政府其他部门更有经验的智者，即最高司令部，必须被赋予提供领导我们走向胜利所需的所有作战能力的责任，无论是资源分配、作战区域的战术规划，还是战略决策的最终权威；将军们将最终决定巴西应该如何被拯救。"
BRA_intensify_military_training: "加强军事训练"
BRA_intensify_military_training_desc: "步兵，军队的先锋和支柱，没有地面部队，任何军队都无法维持战争，更不用说征服敌人了。然而，即使有步兵，也必须由强壮、健康的人组成，能够处理他们在战场上可能面临的任何事情；这是目前许多士兵所欠缺的，他们由多年没有真正目的的日常训练和长期和平时期塑造。\n\n恐怖分子，武装着他们所拥有的一切，并狂热地想要摧毁我们，不会被一支虚弱和软弱的军队击败。因此，如果我们真正致力于赢得这场战争，必须加强士兵的军事训练，重点放在快速动员、近距离战斗、反叛乱战术以及大型城市中心的战斗上。"
BRA_strict_doctrine_flow: "严格遵循教义"
BRA_strict_doctrine_flow_desc: "巴西内战不是即兴创作或鲁莽冒险的地方。最高司令部的明智和经验丰富的成员知道他们在说什么，他们花了几十年的时间研究和实践战争和防御教义。偏离或忽视这些原则和方法是愚蠢的，只会保证我们一次又一次的失败，并使我们的祖国处于未经测试的愚蠢行为的服务中。\n\n必须提醒我们的士兵和指挥官，我们是一支严肃的军队，这场战争是为了胜利，而不是为了扮演战斗人员。因此，每次行动都必须遵循严格的既定协议；每个计划都必须考虑战争教义。一切都必须遵循严格的既定教义，因为我们没有其他机会拯救这个国家。"
BRA_focus_on_planning: "专注于规划"
BRA_focus_on_planning_desc: "已经失去了足够的生命和领土，不能再认为冒险的机动和鲁莽的攻击会让我们取得任何进展。像这样复杂的战争，尽管激烈且需要快速决策，但也是用耐心和精确来战斗和赢得的；因此，我们的将军和指挥官必须专注于更好地规划他们的进攻和对抗，从反应转向更好的计算行动，即使在短期内付出一些代价。"
BRA_expand_marshal_power: "扩大元帅权力"
BRA_expand_marshal_power_desc: "元帅是定义最高司令部的人；他们拥有将规划付诸实践并在最大不确定性时刻做出最困难决策所需的经验和权威。然而，他们的能力因过度官僚作风、不必要的监督和上级不同意见而严重降低。\n\n至关重要的是，为了使这些勇敢的人的服务能力最大化，必须扩大他们的权力，授予他们在其作战区域内更大的行动自主权、直接获取储备和后勤能力的权限，以及无需上级授权即可分配和重新分配单位的权力。"
BRA_centralize_command_flow: "集中指挥链"
BRA_centralize_command_flow_desc: "分散和去中心化的指挥结构只会导致混乱、反应延迟以及不必要和可避免的损失。为了更有效地运作，指挥链必须成为一个单一、大型、凝聚力强和统一的实体，位于负责维护后勤、前线、内部局势和全国不同战场信息的中央总部。这有助于导航当前事件，并允许最高司令部根据前线发生的事情做出快速、明智的决策。"
BRA_integrate_militias_into_ranks: "将民兵纳入正规军"
BRA_integrate_militias_into_ranks_desc: "最伟大的爱国者和国家捍卫者并不总是在军队中，而是在民兵中，在不需要经过其他军事人员的命令或遵循正规步兵所需的相同规则和监督的情况下，从最糟糕的恐怖分子手中捍卫国家。\n\n被证明对我们的成功无价，负责扰乱叛乱分子的补给线、在正规军专注于其他地区时向指挥官提供特定地区的信息或填补前线的空白；然而，他们的完全独立性导致了一些问题，如协调失败、友军火力事件或纪律不均匀，使得难以保持直接联系或规划进攻。\n\n尽管他们很宝贵，但我们不能错过将民兵纳入正规军的机会，并且通过承诺更好和更新的装备、在更集中和本地化的进攻中的领导职位以及更大的保护，他们肯定会接受作为正规军加入武装部队。"
BRA_honroso_exercito_de_caxias: "光荣的卡西亚斯军队"
BRA_honroso_exercito_de_caxias_desc: "\"巴西国旗，无人能玷污你\n你的人民勇敢无畏，\n对此他们绝不允许！\n被崇拜的旗帜，自豪地飘扬！\n在那里自由是又一颗闪耀的星星！\"\n\n通过难以想象的痛苦、牺牲、痛苦和艰辛，我们勇敢的士兵值得再次被尊为这个国家最伟大的军事英雄。\n\n卡西亚斯公爵，武装部队的守护神和荣誉、纪律、忠诚和对国家坚定不移的奉献的最大象征，可以自豪地看待的人。我们的英雄，负责维持前线并在面对最恶心和卑鄙的叛徒和恐怖分子时捍卫祖国，他们在面对叛乱分子时抬起下巴并用刺刀刺伤他们，证明自己是巴西的儿子。"
BRA_brief_the_captains: "向队长们通报"
BRA_brief_the_captains_desc: "军事警察是对抗叛乱分子和叛乱分子战争努力的重要分支，在后方以外的地区施加和维护秩序，保证补给线的安全，保护平民免受罪犯和叛乱分子支持者的侵害，并捍卫主要城市中心免受渗透者和独狼袭击。\n\n然而，许多军事警察队长在边缘运作，被遗忘，接收不完整的信息和不明确的指令，这降低了他们的士气，使他们感到政府像对待一次性棋子一样抛弃他们。为了确保我们领土内的秩序得到维护，并且军事警察不会变得不满，我们必须更加小心地向每个首府提供关于前线局势的完整和详细信息。"
BRA_relax_rules_of_engagement: "放宽交战规则"
BRA_relax_rules_of_engagement_desc: "为了取得胜利，需要采取决定性且往往困难的行动，但交战规则过于严格且与我们面临的情况过时，限制了我们部队的行动，允许叛乱分子利用我们犹豫中的这些漏洞进行伏击或逃避报复。\n\n我们不能允许自己被\"人道主义\"教义的链条束缚，这些教义将谨慎置于胜利之上；使它们更加灵活是朝着以符合我们所面临现实的方式运作迈出的一步。"
BRA_rally_the_military_police: "召集军事警察"
BRA_rally_the_military_police_desc: "几代人以来，军事警察一直站在巴西维持秩序的前线，防止有组织犯罪完全控制城市和州，并防止叛乱分子在过去蔓延。然而，内战使他们处于痛苦的境地，经常迫使他们战斗和杀死他们的同胞、前同事，甚至在某些情况下，徒劳地加入叛乱分子的邻居。\n\n我们必须提醒他们每一个人，这场战争不是针对邻居、同胞，甚至朋友，而是针对敌人，他们是叛乱分子、祖国的叛徒，他们笑着毫不犹豫地谋杀他们。他们选择了叛乱。他们选择了背叛祖国。他们的惩罚必须是死亡，而来自亲近的人的死亡更痛苦。"
BRA_shock_and_awe: "震慑与敬畏"
BRA_shock_and_awe_desc: "长期战斗会削弱士气，浪费资源，并不总是导致胜利，允许叛乱分子重新集结和加固。在战斗前摧毁他们的士气、意志和精神使我们能够进行更快、更顺利的战斗。我们必须专注于这一点。\n\n果断而迅速地，必须采用震慑与敬畏教义来打破在我们土地上漫游的渣滓的意志。必须使用压倒性的火力，以如此精确和一致的方式应用，以至于恐怖分子的意志将无法承受，在我们甚至进入战斗之前就崩溃。"
BRA_greater_battallion_autonomy: "更大的营级自主权"
BRA_greater_battallion_autonomy_desc: "在我们所处的混乱和不可预测的环境中，通信并不总是有保证的，因为它可能被破坏、地形干扰和电子战切断，从而切断无线电和互联网连接，使整个营孤立，等待命令，无法保证何时会收到命令。\n\n为了保持我们的部队知情并确保通信不被中断，授予营自主权很重要，允许他们的指挥官酌情调整战术、利用漏洞和机会，同时保持明确的任务目标和交战规则，以免出现问题。"
BRA_promote_police_officers: "晋升警察官员到最高司令部"
BRA_promote_police_officers_desc: "那些忠诚地为祖国打击恐怖分子的军事警察成员是真正的英雄，捍卫整个城市、确保补给线安全，并在我们领土内镇压叛乱分子。他们对国家的忠诚、荣誉、经验、勇气、纪律和服务不仅应该得到认可，还应该得到表彰和奖励。\n\n将军事警察最杰出的队长和少校晋升到最高司令部将确保他们在密集地区如贫民窟和大型城市中心的战术知识、战斗专业知识和战斗技术对我们的进攻和未来行动非常有价值。"
BRA_allow_independent_militias: "允许独立民兵"
BRA_allow_independent_militias_desc: "在民兵中战斗的爱国者已被证明是我们战争努力的支柱。他们是他们战斗所在地区的经验丰富的战斗人员，毫无预警地攻击，填补叛乱分子可能利用的空白，并且不受过度和夸张的\"交战规则\"的重视，使他们成为快速、凶猛和不可预测的战士，给恐怖分子施加压力和恐惧。\n\n我们必须允许他们的存在，确保他们继续作为自主部队在我们的领土内运作，与武装部队最高司令部协调大型进攻或联合攻击，但保持他们日常行动的自由，最重要的是，在战场上按照他们认为合适的方式行动的自由。"
BRA_our_own_national_guard: "我们自己的国民警卫队"
BRA_our_own_national_guard_desc: "军事警察和民兵已被证明是强大的力量，超出了政府和民众对他们的所有期望，保证城市免受渗透者的侵害，保护部队的重要补给路线，并在正规部队不堪重负并被迫撤退时抵抗叛乱者。\n\n他们的勇气、纪律、对国家的忠诚以及与他们所捍卫的社区的深厚联系使他们变得不可或缺。\n\n这些勇敢的人值得政府每个人的巨大感激和认可，值得获得被称为巴西国民警卫队的称号和荣誉。"
BRA_calling_all_patriots: "召唤所有爱国者！"
BRA_calling_all_patriots_desc: "巴西所处的深渊并非不可逾越，但这个国家的每一双能干的手都需要尽自己的一份力量，以便我们能够拯救它。\n\n恐怖分子在大规模逃兵、不断袭击、供应减少以及越来越多的人死亡等问题上苦苦挣扎，与一个团结的人民相比，他们微不足道，并将轻易被整个国家的爱国者制服，无论是男人还是女人。"
BRA_rethink_supply_lines: "重新思考补给线"
BRA_rethink_supply_lines_desc: "后勤是保持身体其他部分准备战斗的动脉；没有它，你就会瘫痪，容易受到敌人对你做的任何事情的攻击。国家的崩溃暴露了我们补给线的关键弱点：超载的车队、脆弱的关键点、依赖单一路线以及燃料、弹药和物资的冗余不足。\n\n必须对当前做法进行全面审查，允许识别路线规划、执行和保护方面的差距，从而能够关闭和优化这些差距，密封我们的线路，使叛乱分子甚至无法接近它们。"
BRA_rails_to_the_front: "通往前线的铁路"
BRA_rails_to_the_front_desc: "从巴西利亚到反对法制派前线的补给线已被切断。轨道被轰炸摧毁，车站被叛乱分子破坏，桥梁被炸，使运输成为一项复杂的任务。必须动员所有可用的基础设施工人开始建设一条直接连接首都与巴伊亚的新铁路线。\n\n新铁路线将受到保护并高度军事化，确保叛乱分子和恐怖分子都无法损坏或破坏它，允许维持战争所需的资源毫无重大问题地送往士兵手中。"
BRA_motorized_supply: "机动化后勤"
BRA_motorized_supply_desc: "公路一直是巴西运输物资和货物最便宜、最灵活和最容易获得的方式，这一点没有改变。然而，它们也是最脆弱和最容易受到伏击、破坏、轰炸和战斗的；确保它们的安全、保护和维护以向前线士兵供应物资必须是重中之重。"
BRA_air_supply: "空中后勤"
BRA_air_supply_desc: "地面战斗摧毁了许多陆地补给路线，将高速公路变成死亡地带，铁路变成战场，火车的前进受到持续破坏和伏击的阻碍。只剩下一个选择，一个对于到达孤立的驻军、偏远地区的前哨或由于战斗或地形而难以进入的社区仍然可靠的选择：天空。\n\n我们的空运能力必须完全集中和利用，以运送弹药、医疗用品、食品配给和其他装备，用于维持和供应我们的武装部队。"
BRA_race_to_the_sea: "冲向大海"
BRA_race_to_the_sea_desc: "一个里程碑标志着战争的转折点。随着一个沿海位置现在在我们的控制下，有可能建立海军存在并与长期孤立地与叛乱分子和叛乱者作战的巴西海军忠诚部队重新联系。\n\n然而，那里并非一切都好。码头挤满了失事、被摧毁和损坏的船只，并构成海上不受欢迎存在的危险。在我们能够恢复海上后勤并慢慢收紧叛乱分子脖子上的最后绞索之前，必须解决这个问题。"
BRA_start_air_operations: "开始空中行动"
BRA_start_air_operations_desc: "在内战开始时，巴西空军的大部分与政府和总统结盟，我们将收获这种忠诚的回报，利用其所有能力和装备。空中行动必须立即恢复，确保我们的部队在关键前线的空中优势，从而促进地面进攻的发起并重建地面和空中部队之间的协调配合。"
BRA_psychological_air_dominance: "心理空中优势"
BRA_psychological_air_dominance_desc: "与所有叛乱分子相比，我们拥有优越的空中存在，我们不仅可以将其用作战术资源，还可以用作强大的心理武器。当他们听到我们的战斗机在头顶呼啸，当他们在看到飞机之前听到引擎的轰鸣声，或者当他们看到风的震耳欲聋的噪音时，他们会知道我们就在附近，这意味着他们生命的终结。\n\n一枪未发，他们将夹着尾巴投降。\n\n仅仅想到我们统治天空，就会让叛徒的心中充满恐惧、犹豫、怀疑和战斗的恐惧。曾经大胆前进的傲慢士兵现在害怕从上方听到的每一个声音；车队在听到喷气式飞机的声音时完全沉默地停下来。\n\n我们最有效的刽子手是天空，有了它，祖国的叛徒将开始害怕头顶上的东西。"
BRA_precision_strikes: "精确打击"
BRA_precision_strikes_desc: "巴西的土地已经伤痕累累，受伤累累。我们不会进一步造成损害。通过提高我们攻击的精确度，我们可以以最小的附带损害摧毁祖国的叛徒。\n\n使用精确弹药，我们将促进消灭叛乱分子的高级指挥哨所、摧毁补给仓库和车辆以及摧毁领导中心，同时避免平民经常光顾的地区。"
BRA_deny_their_roads: "阻断他们的道路"
BRA_deny_their_roads_desc: "通过瞄准摧毁叛乱分子的主要补给线来削弱他们的战争努力，外科打击教义的扩展变得不可避免。高速公路、桥梁、铁路枢纽、燃料仓库和食品仓库是最常被瞄准的目标，我们可以避免击中平民区域，同时迫使恐怖分子穿越困难地形、延长他们的供应链、耗尽燃料储备并大幅减少他们的努力，以便我们能够更轻松地给予最后一击。"
BRA_restructure_sisbin: "重组SISBIN"
BRA_restructure_sisbin_desc: "巴西内战打破了关于叛乱和叛乱分子面貌的旧假设。以前，敌人被描绘成穿着容易识别的制服——共产主义者、整体主义者的制服。很容易识别威胁并压制它。然而，敌人现在来自内部。\n\n颠覆性组织、腐败官员、熟悉面孔的将军和士兵——你曾经亲近的人。\n\n因此，旨在处理外部和内部威胁的巴西情报系统不再适合这种新范式。必须立即彻底从上到下重组它，以满足战争的需求并防止新的叛徒有机会茁壮成长，联邦警察和巴西情报机构将被整合，以便对内部敌人的调查更加协调和集中。"
BRA_hunt_traitors_within: "追捕内部叛徒"
BRA_hunt_traitors_within_desc: "在各部委、军事单位、警察部队中，尤其是在平民中，叛徒、渗透者和颠覆分子潜伏着，等待合适的时机攻击和消灭我们。令他们恐惧的是，联邦警察就在他们身后。\n\n注视着他们的每一步和每一次呼吸，联邦警察是我们对付那些渗透贾伊尔·博索纳罗政府的人的最佳武器，对任何考虑对他的政府或参与战争的任何其他机构举起手指的人发起恐怖。\n\n曾经束缚他们的缰绳不再存在。每个线人、每个逃兵、任何认为挑战既定秩序并试图向叛乱分子出售信息的人都将被找到、捕获，并感受到国家机器对他们身体的全部重量。"
BRA_expand_abin: "扩大ABIN"
BRA_expand_abin_desc: "巴西情报机构是我们拥有的最大和最强大的调查资源，能够在颠覆分子和叛徒成为政府威胁之前很久就发现他们。内战揭示了叛乱分子能够通过渗透达到的深度。\n\n为了打击进一步的渗透，ABIN必须扩大到最大潜力，增加资源、范围和权力。其预算应该翻倍，达到我们可以投资的最大值，使其成为巴西最令人恐惧的机构。\n\n其触角将延伸到所有部委、所有州、前线的所有地区以及敌方领土内。\n\n再也不会允许另一场\"法制叛乱\"在这片土地上发生。"
BRA_meddle_in_the_federal_police: "干预联邦警察"
BRA_meddle_in_the_federal_police_desc: "联邦警察在打击颠覆分子和腐败方面证明了自己的价值，但他们的有效性和潜力因政治忠诚、派系同情以及仍然对政府和贾伊尔·博索纳罗怀有疑虑的警察官员而受到损害。为了使联邦警察成为真正有效的工具，我们必须剥夺他们的政治偏见并使他们完全与政府保持一致，无论代价如何；这包括解雇任何需要解雇的人并改革任何需要改革的人，无论短期损害如何。"
BRA_seek_and_destroy: "寻找并摧毁"
BRA_seek_and_destroy_desc: "我们不能允许我们领土上的叛乱持续和升级。叛乱分子和小团体、法制派支持者、秘密组织、强盗、共产主义者和其他类型的恐怖分子仍在我们领土内，攻击补给线、暗杀当局并通过宣传传播他们邪恶的思想。\n\n我们必须在它变成法制叛乱2.0之前处理它们。\n\n根据SISBIN及其分支机构ABIN和联邦警察的调查，特种部队将迅速识别威胁并消灭目标，使用必要的任何方法一劳永逸地清除我们国家中的癌症蟑螂。"
BRA_track_dissident_activities: "追踪异见活动"
BRA_track_dissident_activities_desc: "反政府异见者很少单独行动；他们形成团伙、网络，共享资源，直到攻击的合适时机到来。为了发现这些运动的头目是谁，并随后一次性消灭他们所有人，有必要建立一个追踪计划来定位和监控这些个人和嫌疑人。\n\n然后，当发现大量证据和信息，并发现这些恐怖运动的头目和主要组织者是谁时，我们可以一举两得：消灭该团体及其领导人。"
BRA_crush_guerrilas: "粉碎游击队"
BRA_crush_guerrilas_desc: "游击队像杂草一样在我们领土上蔓延，小团体袭击军队的基本补给点、伏击巡逻队并恐吓农村社区。联邦警察必须利用其所有调查范围和权力来一劳永逸地消灭这些害虫，暴露他们的藏身之处，然后消灭所有对国家构成哪怕最轻微威胁的人。"
BRA_curb_partisan_propaganda: "遏制党派宣传"
BRA_curb_partisan_propaganda_desc: "我们的敌人通过宣传生存，用他们理想主义的污秽充斥无线电波、社交媒体和街道。低估这一点是自我破坏，在民众中产生对政府行动的怀疑并招募战斗人员。因此，为了所有公民的利益，我们必须追查并结束这些渣滓的所有类型的宣传，允许巴西人恢复正常生活，不必担心极端分子用口号和空洞的话语充斥他们的生活。"
BRA_sempre_vigilante: "永远警惕"
BRA_sempre_vigilante_desc: "尽管联邦警察和ABIN尽最大努力消除坚持破坏我们领土的祖国叛徒，但平民也必须有意愿与他们作斗争。\n\n每个爱国的巴西人必须保持警惕，防范对国家的可能威胁和颠覆性元素，一旦发现，向最近的当局报告，并等待保卫他们的社区免受人类渣滓的侵害。陌生的访客、不寻常和频繁的集会或宣传的分发应报告给警察，以便维持秩序，民众可以再次安心入睡。"
BRA_meet_with_landowners: "与土地所有者会面"
BRA_meet_with_landowners_desc: "中西部，巴西农业综合企业的心脏和国家粮食供应的支柱，在很大程度上仍然忠于博索纳罗总统和政府，从其农场驱逐社会主义病毒并保护农村地区免受土地入侵者的侵害。主要生产者、农村和工业土地所有者是贾伊尔·博索纳罗的狂热支持者，控制着大片土地生产大豆、玉米、牛和甘蔗，出现了建立紧急经济的机会，能够维持战斗、民众和我们前线勇敢的士兵。"
BRA_protect_domestic_production: "保护国内生产"
BRA_protect_domestic_production_desc: "这个国家的土地所有者是我们在这场战争中拥有的最宝贵的经济资产。负责农业，他们生产基本商品以保持民众和军队吃饱，从而使战争能够继续。然而，美国的崩溃以及随后的农业崩溃仍然留下伤痕，使他们处于投入品稀缺、作物被遗弃以及维护大型农场的供应和设备很少的境地。\n\n我们不能再让他们失望；集中努力保护农业生产至关重要，不仅要保持武装部队的战斗能力，还要保持平民的温饱。"
BRA_small_land_subsidies: "农业重建补贴"
BRA_small_land_subsidies_desc: "农业综合企业的崩溃导致整个农场被遗弃，生产者陷入债务。其影响仍然被大型土地所有者感受到，他们每天都在努力维持生产和设备。为了重建和恢复大规模农业生产，必须向大型、中型和小型土地所有者提供有针对性的补贴，使他们的土地重新耕种并提高生产力。"
BRA_guarantee_the_basic_food_basket: "保证基本食品篮子"
BRA_guarantee_the_basic_food_basket_desc: "在这个时代，没有人应该挨饿。三大危机和内战的爆发摧毁了供应链，推高了基本商品的价格，迫使农村家庭转向自给农业，而城市地区的人们则挨饿或难以负担必需品。\n\n确保这种情况结束至关重要，不仅是为了防止民众再次反对我们，也是为了避免不必要的饥饿死亡。"
BRA_send_specialized_assistance: "请求专业援助"
BRA_send_specialized_assistance_desc: "随着农业综合企业的支持得到巩固，是时候收获这种伙伴关系的回报了。该部门在物流、基础设施管理和大规模资源开采方面拥有无与伦比的专业知识。他们在这些方面的援助对于保持我们的工业和战争机器运行至关重要；因此我们应该请求它，通过承诺保护他们的业务、优先获得护航和供应，不应该很难得到积极的回应。"
BRA_produzir_pela_patria: "为祖国生产"
BRA_produzir_pela_patria_desc: "在恐怖分子和罪犯在这个国家发动流血和屠杀很长一段时间后，许多家庭和公民呆在家里，等待危险过去。警报已经响起。巴西人民重返工作岗位的时刻已经到来。\n\n对我们的战争努力来说，工厂、车间和生产线不能保持空无一人和被遗弃。这个国家的男女工人必须被动员起来，被召回占领工厂并恢复国家的生产力和工业力量。"
BRA_what_our_soil_has_to_offer: "我们的土地能提供什么"
BRA_what_our_soil_has_to_offer_desc: "就像这个心爱而广阔国家的一切一样，巴西的土地是特殊的。它不仅肥沃，而且是无数财富的宝库，包含大量铁矿石、铝土矿、磷酸盐、石灰石和无尽的铌储量，以及大量木材、水和其他资源，整个国家会不惜一切代价拥有同样规模的这些资源。\n\n我们必须知道如何利用这么多财富，牢记以适当数量勘探和开采这些资源可能是我们战争和经济努力的转折点。"
BRA_trust_in_rural_wisdom: "信任农村智慧"
BRA_trust_in_rural_wisdom_desc: "农村工人有很多东西可以教给巴西利亚的政治家。这些男女拥有无数活动的世代实践知识，这些知识不是在大学或学校教授的，而是通过时间和工作获得的。政府不仅应该提供代表，还应该倾听和学习他们关于土地和农业的技术和知识。"
BRA_do_your_part_for_the_effort: "为伟大努力尽你的一份力量"
BRA_do_your_part_for_the_effort_desc: "对于我们领土内的大多数民众来说，与叛乱分子的伟大战斗和战斗离他们的家园很远。然而，即使远离冲突，土地所有者和农村工人对胜利至关重要。他们光荣的工作养活了军队，军队吃饱后保持精力战斗。他们中的许多人不知道他们对国家有多重要，他们应该被记住。"
BRA_do_povo_para_o_povo: "由人民为人民"
BRA_do_povo_para_o_povo_desc: "在战争中，经济为其民众服务很重要，每个工厂、每个车间、每个领域，一切都为人民的事业服务，而不是私人利润或外国利益。劳动者和农民的工作必须加强他们的家园，生产以其对战争和人民总体福祉的贡献来衡量。"
BRA_untie_productive_sector: "解开生产部门的结"
BRA_untie_productive_sector_desc: "巴西工业巨头是我们内战中最宝贵的经济资产。他们拥有创新、生产和尽可能保持战争机器最佳状态的知识和能力，能够抵抗和战胜叛乱分子。至关重要的是，他们拥有必要的能力、自由、保护和优先权，以便能够为我们提供这场战争要求我们的最佳装备、制服和一切其他东西。"
BRA_suspend_production_of_nonessentials: "暂停非必需品生产"
BRA_suspend_production_of_nonessentials_desc: "生产力对我们的战争努力至关重要，不能用于非必需品。不必要的物品，如奢侈品、装饰产品、非关键电子产品、时尚配饰以及任何不会直接有助于平民生存和武装部队需求的东西，其生产将被暂停或大幅减少，以便其生产场地可以重新用于满足公民、军队和政府的需求。"
BRA_ease_producer_burdens: "减轻生产者负担"
BRA_ease_producer_burdens_desc: "自第一次大危机以来，巴西的工业基础一直面临前所未有的压力，但生产者仍然是我们政府、民众生存和战争努力的支柱。现在不是让工业被过度官僚作风和详尽程序束缚的时候。暂停和削减繁文缛节对于让我们的生产者能够全力运作至关重要。"
BRA_employ_eminent_domain: "行使征用权"
BRA_employ_eminent_domain_desc: "巴西国家崩溃导致对更大地块和设施的需求不能等待市场谈判或前业主的同意。征用权应该在政府认为必要时使用，无论政府的需求是什么，这些土地和建筑物将被重新利用以满足需要提供的需求。"
BRA_call_on_industrial_planners: "呼吁工业规划者"
BRA_call_on_industrial_planners_desc: "工程师、经济学家、工厂经理和物流专家现在是比以往任何时候都更有价值的国家财富。他们的专业知识对于提高生产力、优化资源以及区分我们需要生产的东西和暂时应该暂停的东西至关重要。\n\n我们让他们为国家服务的机会不能浪费。"
BRA_boost_automation: "促进自动化"
BRA_boost_automation_desc: "不可否认，工业的未来在于自动化，当所有其他国家都在遵循这条道路时，巴西却落后了。我们不能继续走这条路，袖手旁观，看着世界突飞猛进。我们的生产链虽然现代化，但仍然严重依赖手工劳动和过时、低效、脆弱的机器，这些机器总是容易在我们所处的战时条件下的高需求下崩溃。\n\n在这个国家最合格的人才的帮助下，将对关键部门进行全面评估，以确定最需要自动化且最有可能从自动化中受益的领域。"
BRA_general_leadership_change: "领导层普遍更换"
BRA_general_leadership_change_desc: "腐败和自满在任何长期处于同一领导层之下的组织中都会生根发芽，特别是在我们目前面临的长期和严峻危机时期。新的视角对于保持创新向前发展和防止工业和社会停滞至关重要。\n\n因此，将在关键部委、国有企业和生产委员会实施领导层轮换制度，以便那些在权力职位上舒适、在我们这个时代抵制变革和适应的人被新的、年轻的和有前途的血液所取代。"
BRA_nas_maos_de_quem_entende: "在懂行的人手中"
BRA_nas_maos_de_quem_entende_desc: "巴西工业掌握在它所能要求的最好的人手中。一群精心挑选的国家领先和最熟练的企业家、管理者和创新者，这些人已经证明自己能够在持续压力下建立、维持、适应和繁荣。\n\n国家工业基础的未来掌握在他们手中，因为他们有权做出决定、分配资源并提高生产，而无需持续和过度的官僚权威告诉他们做什么、在哪里做以及何时做。"
BRA_ballistic_production_campaign: "密集弹道生产运动"
BRA_ballistic_production_campaign_desc: "为了在与恐怖分子和叛乱分子的战斗中取得成功，我们需要子弹、炮弹、穿甲弹药、手榴弹、迫击炮以及巴西工业在如此短的时间内并非旨在供应的所有其他类型的军事用品。我们的能力不堪重负，没有足够的资源来资助如此巨大的生产，也没有足够的人力来满足需求。\n\n我们必须发起一场针对弹道弹药生产的密集运动，包括大规模投资机械、精密工具和武器，以及招募更多劳动力来实现我们的目标。"
BRA_the_toil_ahead_of_us: "我们面前的艰辛"
BRA_the_toil_ahead_of_us_desc: "我们的经济已经准备就绪，完全动员起来，全力运转。然而，胜利尚未得到保证。前方的道路，布满石头和荆棘，仍然漫长、痛苦且充满困难。供应短缺将继续影响我们的民众，军事和平民伤亡将继续上升，基础设施将继续成为持续攻击的目标。\n\n恐怖分子正在拼命战斗，那些摧毁我们土地的嗜血动物认为他们可以战胜我们，但善良公民的靴子将粉碎他们，践踏他们，并将他们推回他们来自的地狱。\n\n这条路从来都不容易，现在也不会容易，但凭借那些热爱这个国家的人的力量和思想，巴西的未来将仍然是光荣的。"
# - Civil War Phase Two
BRA_servants_of_the_living_god: "活神的仆人"
BRA_servants_of_the_living_god_desc: "凭借耶稣基督和他的天使的力量，法制军的地狱瘟疫及其邪恶追随者从这个伟大的国家被清除，被推回他们来自的地狱。巴西现在处于一个门槛上，一个千载难逢的机会，以基督的力量更新自己，并有机会按照上帝的形象和圣经的教导重塑自己。\n\n迷失在诱惑和罪恶的海洋中，巴西人民终于成为造物主的真正仆人，只生活在他的诫命之下，只服从教会神圣之手所写的法律。"
BRA_reach_out_local_congregations: "接触当地教会"
BRA_reach_out_local_congregations_desc: "神圣的天主教会和巴西教会承载着几个世纪以来没有任何机构或官僚能够复制的智慧和权威，也能够复制，或将能够复制。他们的支持对于我们项目的成功和巴西基督教的复兴至关重要。\n\n将与他们的领袖进行直接接触。牧师、神父、主教和教会领袖应被邀请与政府建立正式伙伴关系，授予他们资源以在全国范围内扩展他们伟大和光荣的工作。"
BRA_embrace_new_age_evangelism: "拥抱新时代福音主义"
BRA_embrace_new_age_evangelism_desc: "尽管基督教传统古老，可追溯到几千年前，但否认我们国家今天的现实是极其不可分割的。新时代福音派传教士和大型教会在整个巴西带来了基督教信仰的强大复兴，但特别是在年轻一代、工人阶级和城市周边居民中。\n\n这些传教士专注于通过对基督的信仰实现个人转变，赢得了数百万巴西人的心，这种爱在天主教公众中已基本消失，因此将这些伟大人物融入国家政治变得至关重要。"
BRA_appeal_to_christian_tradition: "呼吁基督教传统"
BRA_appeal_to_christian_tradition_desc: "我们光荣而美丽的胜利绝不能被浪费或冒着被转瞬即逝的民粹主义言论稀释的风险，也不能被肤浅的情感诉求所稀释。如果我们希望在巴西坚持耶稣基督的真正胜利，我们必须坚定而深入地扎根于圣经和神圣天主教会的教导和方法，这些教导和方法通过两千年的基督教传统，从未让任何国家或任何人失望。"
BRA_united_under_saving_grace: "在拯救之恩下团结"
BRA_united_under_saving_grace_desc: "长期以来，基督徒之间按教派——天主教、福音派、五旬节派、东正教或任何其他教派——的分裂一直是基督教国家长期以来堕落的原因。我们不能允许自己因同样愚蠢的原因从内部被摧毁。毕竟，重要的是每个基督徒心中所承载的本质：\n\n§Y上帝和耶稣基督的教导。§!"
BRA_new_protestant_thesis: "新新教论"
BRA_new_protestant_thesis_desc: "巴西正处于一个黎明之中，一场这个土地历史上前所未有的精神觉醒。在巴西土地上进行的天使与恶魔之间的圣战以天堂的胜利和堕落天使的仆人被永远驱逐回硫磺湖而结束。\n这场胜利将响彻几个世纪，福音派革命将成为全球基督徒的榜样。古老的天主教已被福音所取代，由数百万在上帝中看到国家未来的信徒所承载。\n\n新新教论将带领巴西超越最伟大的道路，引导它回到造物主安慰的怀抱。"
BRA_endorse_olavist_theories: "认可奥拉夫主义理论"
BRA_endorse_olavist_theories_desc: "奥拉沃·德·卡瓦略，这个国家近年来最伟大的知识建筑师，一个塑造了贾伊尔·博索纳罗船长思想的人。这位伟大的人在天堂之门与耶稣基督相遇，为社会留下了无限智慧的遗产。\n\n全球主义世俗主义的危险、文化战争以及基督教真理在社会中的中心地位是任何国家生存的基本教导，忽视它们，正如我们错误地所做的那样，导致国家陷入内战的垃圾场。然而，现在，我们从过去的错误中吸取了教训，并将把他的思想应用到巴西社会结构中。"
BRA_promote_evangelical_fundamentalism: "促进福音派原教旨主义"
BRA_promote_evangelical_fundamentalism_desc: "只在周日去教堂，其余时间在罪恶中度过，好像上帝不存在一样，这是愚蠢的；这是魔鬼的作品。\n\n现代生活每天用无数罪恶诱惑巴西人民，认为每周只去上帝之家一次就能保护他们免受邪恶天才的影响是愚蠢的。只有对福音派的深刻、日常和奉献的承诺才能真正保护个人的精神圣殿免受恶魔诱惑，这必须再次教给巴西社会。"
BRA_the_narrow_door: "窄门"
BRA_the_narrow_door_desc: "将整个国家转变为上帝的教导并非易事，尤其是在如此血腥的冲突和如此多地暴露于邪恶作品之后。道路狭窄而陡峭，充满诱惑、抵抗和几个世纪以来恶魔仆人试图将世俗主义强加给民众的重量。\n\n我们不能让自己被热情或不耐烦所带走。\n\n就像基督本人一样，我们必须背起十字架，以坚定不移的决心走这条路，一步一步，心中只有对基督的爱和为上帝服务的目标，无论沿途可能出现什么后果，无视魔鬼的诱惑。"
BRA_guided_by_gods_light: "受全能者之光指引"
BRA_guided_by_gods_light_desc: "上帝的话语必须成为一切的指南，对于我们的国家来说也不例外。愿圣经的经文成为宪法，愿撒旦世俗主义共和国转变为基督教共和国，在真理和行动中。所有法律、政策、教育、正义和公共生活必须完全服从圣经和全能者的权威，因为只有这样，祖国及其子女才能真正胜利，永恒的胜利。"
BRA_chain_the_atheists: "束缚无神论唯物主义者"
BRA_chain_the_atheists_desc: "无神论唯物主义必须从地球上根除。这种谋杀性的意识形态唾弃基督的形象，并以虚假进步的名义为最残暴的罪恶辩护，已经毒害了心灵，摧毁了家庭，并给整个社会带来了混乱，无论是在巴西还是在其他国家。\n\n他们必须被束缚，扔进地下墓穴，永远被遗忘。他们必须像蛇本应被逐出伊甸园一样被逐出世界，因为他们仇恨的呼喊和腐蚀性的意识形态已经摧毁了太多国家，不能允许它们继续自由传播谎言。"
BRA_one_nation_under_god: "一个国家，在上帝之下"
BRA_one_nation_under_god_desc: "不出所料，世俗主义再次被证明是失败的。分裂摧毁了巴西，只有恢复到最高状态的信仰才能再次团结这个民族。\n\n遵循美利坚合众国开国元勋创造的模式，我们必须塑造一个新的巴西，一个在基督主权下不可分割的国家，法律来自上方，每个机构都反映基督教，只有基督教。"
BRA_end_the_secular_state: "结束世俗国家"
BRA_end_the_secular_state_desc: "教会与国家分离，被誉为进步和共和主义名义下最伟大的成就之一，已被证明是可能犯下的最大错误之一，使社会与自己误导的思想隔离，将道德变成相对的东西，并使整个世界容易受到转瞬即逝和极端主义意识形态的影响。\n\n现在，我们有机会纠正这个严重错误，我们不会让这个机会溜走，废除世俗国家，并让巴西回到主教导的唯一指导之下。"
BRA_the_new_land_of_vera_cruz: "新维拉克鲁斯之地"
BRA_the_new_land_of_vera_cruz_desc: "1500年，当第一批葡萄牙传教士踏上他们称为维拉克鲁斯的柔软海滩时，基督教在这些土地上不断发展，从那时起，巴西本质上就是一个福音派国家。\n\n几个世纪以来，信仰只得到了加强，从16世纪的教义学家到现代传教士，他们通过数字方式向数百万人传播上帝的话语，所有人都怀着同样的目标：\n\n§Y实现真正的救赎。§!\n经过如此漫长的等待，我们已经达到了葡萄牙先驱者所寻求的目标。"
BRA_god_on_heaven_bolsonaro_on_earth: "上帝在天堂，博索纳罗在人间"
BRA_god_on_heaven_bolsonaro_on_earth_desc: "伟大的考验时期终于结束了。\n在以最暴力的意识形态和思想名义遭受了如此多的痛苦、痛苦、死亡和流血之后，主的话语没有被遗忘。一群被战争破坏摧毁的民众再次在基督身上看到了隧道尽头的光芒，并将一切托付给他，被引导穿过死亡阴影的山谷，幸存下来。\n\n像摩西带领以色列人穿越沙漠一样带领他们的是他，船长，神话，有史以来最伟大的传教士和基督坚定不移的战士：贾伊尔·梅西亚斯·博索纳罗。\n\n这位伟大的人在四面楚歌时独自说出真相，在其他人都举起恶魔旗帜时举起基督的旗帜，他在绝望似乎吞噬整个国家时独自团结信徒。通过这位难忘的人，上帝的手显现，引导、保护，并最终解放了巴西。"
BRA_the_people_are_gods_children: "人民是上帝的孩子"
BRA_the_people_are_gods_children_desc: "国家的统治者，无论是国王、总统还是皇帝，都必须记住一个永恒的真理：他们不是权力的主人，而是上帝赐予他们照顾的人民的仆人。\n\n他们对国家及其人民负有神圣的责任，就像牧羊人对羊群一样，必须照顾他们，引导他们走向光明，并保护他们免受任何伤害，无论伤害是什么。\n\n巴西人民是上帝的孩子，必须像上帝希望他们被对待的那样被对待：爱、尊重和忠诚。"
BRA_create_a_christian_court_system: "创建基督教法庭系统"
BRA_create_a_christian_court_system_desc: "法律是社会的基础，必须遵循基督教信仰的原则和上帝的话语。只有这样，正义才能真正得到伸张，邪恶才能被根除。\n\n将创建一个基于圣经原则的新司法系统，法官和法院必须接受基督教教义的培训，确保他们理解正义的真正含义，并能够在案件中正确适用它。"
BRA_secure_the_traditional_family: "保护传统家庭"
BRA_secure_the_traditional_family: "保护传统家庭"
BRA_secure_the_traditional_family_desc: "家庭是社会的基石，是将个人与社区和上帝联系起来的纽带。没有强大、健康和幸福的家庭，社会就会崩溃，人们就会迷失在罪恶和绝望的海洋中。\n\n我们必须保护传统家庭免受那些试图摧毁它的人的伤害，确保婚姻只在男人和女人之间，并提供资源和支持，使家庭能够兴旺发达。"
BRA_tighten_reproductive_laws: "收紧生殖法律"
BRA_tighten_reproductive_laws_desc: "堕胎是对上帝赐予人类的最神圣礼物——生命——的最严重的罪行。那些犯下这种行为的人应该受到最严厉的惩罚，法律必须明确禁止任何形式的堕胎，无论情况如何。\n\n此外，必须制定法律来限制避孕措施的使用，因为这些措施也被用来破坏上帝的计划，并阻止生命的诞生。"
BRA_deal_with_alternative_media: "处理替代媒体"
BRA_deal_with_alternative_media_desc: "媒体是影响公众舆论的强大工具，可以用来传播真理或谎言。在巴西，世俗媒体长期以来一直被用来传播无神论和唯物主义的意识形态，毒害人们的思想，并破坏传统价值观。\n\n我们必须处理这些媒体，确保它们传播的是真理而不是谎言，并且它们支持国家的目标而不是反对它们。"
BRA_create_a_state_media_outlet: "创建国家媒体机构"
BRA_create_a_state_media_outlet_desc: "为了确保公众获得准确和真实的信息，我们必须创建一个新的国家媒体机构，由政府控制，并专注于传播基督教价值观和国家目标。\n\n这个机构将是巴西人民了解世界和国家事务的主要来源，并将确保他们获得的信息是准确和真实的。"
BRA_censor_immoral_content: "审查不道德内容"
BRA_censor_immoral_content_desc: "媒体中充斥着不道德和不适当的内容，这些内容正在毒害年轻人的思想，并破坏传统价值观。我们必须审查这些内容，确保只有符合基督教道德和价值观的内容才能在媒体上传播。\n\n这包括审查电视节目、电影、音乐和互联网内容，确保它们不包含任何可能对公众造成伤害的内容。"
BRA_reform_the_educational_system: "改革教育系统"
BRA_reform_the_educational_system_desc: "教育是塑造年轻人思想和价值观的最强大工具之一。在巴西，教育系统长期以来一直被用来传播世俗主义和唯物主义的意识形态，忽视了基督教价值观和传统。\n\n我们必须改革教育系统，确保它教授的是基督教价值观和传统，而不是世俗主义和唯物主义。这包括修改课程、培训教师和创建新的教育机构。"
BRA_teach_christian_morality: "教授基督教道德"
BRA_teach_christian_morality_desc: "道德教育是教育系统的重要组成部分，必须确保年轻人理解什么是对的，什么是错的。我们必须在所有学校中教授基督教道德，确保年轻人理解上帝的诫命，并能够在生活中遵循它们。\n\n这包括教授十诫、圣经故事和基督教价值观，如爱、宽容和诚实。"
BRA_promote_religious_study: "促进宗教研究"
BRA_promote_religious_study_desc: "宗教研究是理解基督教信仰和传统的重要途径。我们必须在所有学校中促进宗教研究，确保年轻人理解基督教信仰的历史、教义和实践。\n\n这包括教授圣经、教会历史和基督教哲学，确保年轻人能够深入理解基督教信仰。"
BRA_create_christian_universities: "创建基督教大学"
BRA_create_christian_universities_desc: "大学是高等教育的中心，必须确保它们教授的是基督教价值观和传统，而不是世俗主义和唯物主义。我们必须创建新的基督教大学，由教会控制，并专注于传播基督教知识和价值观。\n\n这些大学将是巴西知识分子和专业人士的培训中心，并将确保他们在职业生涯中遵循基督教价值观。"
BRA_strengthen_the_armed_forces: "加强武装部队"
BRA_strengthen_the_armed_forces_desc: "武装部队是国家的守护者，必须确保他们能够保护国家免受外部威胁。我们必须加强武装部队，确保他们拥有最新的装备和技术，并能够有效地应对任何威胁。\n\n这包括增加军费开支、购买新装备和培训士兵，确保他们能够在任何情况下保卫国家。"
BRA_create_a_national_militia: "创建国民民兵"
BRA_create_a_national_militia_desc: "国民民兵是武装部队的重要补充，可以在紧急情况下提供额外的支持。我们必须创建一个新的国民民兵，由志愿者组成，并专注于保卫国家和维护公共秩序。\n\n这个民兵将接受军事训练，并将能够在紧急情况下迅速响应，帮助维护国家的安全和稳定。"
BRA_secure_the_borders: "确保边境安全"
BRA_secure_the_borders_desc: "边境安全是国家主权的重要组成部分，必须确保没有人能够未经授权进入国家。我们必须加强边境安全，确保我们能够控制谁进入和离开国家，并防止非法移民和走私。\n\n这包括增加边境巡逻、建设边境墙和使用先进技术来监测边境活动。"
BRA_deal_with_drug_trafficking: "打击毒品贩运"
BRA_deal_with_drug_trafficking_desc: "毒品贩运是对国家和人民的严重威胁，正在破坏社会并导致无数人死亡。我们必须严厉打击毒品贩运，确保没有人能够在巴西境内买卖或使用毒品。\n\n这包括加强执法、增加边境安全和提供戒毒治疗，确保那些沉迷于毒品的人能够得到帮助。"
BRA_combat_crime: "打击犯罪"
BRA_combat_crime_desc: "犯罪是社会的毒瘤，正在破坏社区并使人们生活在恐惧之中。我们必须严厉打击犯罪，确保所有人都能在安全和安宁的环境中生活。\n\n这包括增加警察力量、加强司法系统和提供社会支持，确保那些可能犯罪的人有更好的选择。"
BRA_create_a_welfare_system: "创建福利系统"
BRA_create_a_welfare_system_desc: "福利系统是帮助那些需要帮助的人的重要途径。我们必须创建一个新的福利系统，由政府控制，并专注于帮助那些最需要帮助的人。\n\n这个系统将提供食品、住房、医疗和教育支持，确保所有人都能获得基本需求，并能够在生活中取得成功。"
BRA_help_the_poor: "帮助穷人"
BRA_help_the_poor_desc: "帮助穷人是基督教信仰的核心原则之一，我们必须确保所有人都能获得基本需求，并能够在生活中取得成功。\n\n我们必须提供资源和支持，帮助那些最需要帮助的人，包括提供食品、住房、医疗和教育支持。"
BRA_improve_healthcare: "改善医疗保健"
BRA_improve_healthcare_desc: "医疗保健是所有人的基本权利，必须确保所有人都能获得高质量的医疗服务。我们必须改善医疗保健系统，确保它能够满足所有人的需求，并能够提供高质量的医疗服务。\n\n这包括增加医疗设施、培训医疗专业人员和提供基本医疗服务，确保所有人都能获得必要的医疗帮助。"
BRA_invest_in_infrastructure: "投资基础设施"
BRA_invest_in_infrastructure_desc: "基础设施是国家发展的基础，必须确保它能够支持经济增长和社会发展。我们必须投资基础设施，确保国家拥有现代化的道路、桥梁、港口和机场，并能够支持经济活动。\n\n这包括建设新的基础设施、改善现有基础设施和使用先进技术来提高基础设施的效率。"
BRA_promote_economic_growth: "促进经济增长"
BRA_promote_economic_growth_desc: "经济增长是国家发展的关键，必须确保国家能够创造就业机会、提高生活水平和减少贫困。我们必须促进经济增长，确保国家拥有一个强大和多样化的经济，并能够在全球市场上竞争。\n\n这包括鼓励投资、支持中小企业和促进国际贸易，确保国家能够在全球经济中取得成功。"
BRA_strengthen_agriculture: "加强农业"
BRA_strengthen_agriculture_desc: "农业是国家经济的重要组成部分，必须确保它能够满足国家的粮食需求，并能够在全球市场上竞争。我们必须加强农业，确保国家拥有现代化的农业技术和设备，并能够提高农业生产力。\n\n这包括投资农业研究、提供农业补贴和支持农民，确保他们能够在农业生产中取得成功。"
BRA_develop_industry: "发展工业"
BRA_develop_industry_desc: "工业是国家经济的重要组成部分，必须确保它能够创造就业机会、提高生活水平和减少贫困。我们必须发展工业，确保国家拥有现代化的工业技术和设备，并能够在全球市场上竞争。\n\n这包括鼓励工业投资、支持制造业和促进技术创新，确保国家能够在全球经济中取得成功。"
BRA_promote_technology: "促进技术发展"
BRA_promote_technology_desc: "技术是国家发展的关键，必须确保国家能够跟上全球技术发展的步伐，并能够在全球市场上竞争。我们必须促进技术发展，确保国家拥有现代化的技术基础设施，并能够支持技术创新。\n\n这包括投资技术研究、支持科技企业和促进数字经济，确保国家能够在全球技术竞争中取得成功。"
BRA_invest_in_research: "投资研究"
BRA_invest_in_research_desc: "研究是技术发展的基础，必须确保国家能够在科学和技术领域取得突破。我们必须投资研究，确保国家拥有现代化的研究设施，并能够支持研究人员。\n\n这包括投资研究机构、提供研究资金和支持学术合作，确保国家能够在科学和技术领域取得成功。"
BRA_second_national_renovation: "第二次国家革新"
BRA_second_national_renovation_desc: "所谓法制派军队的叛乱分子被击败了，那些窃取总统选举并将国家陷入这种耻辱的祖国叛徒终于得到了他们应得的正义，军队确立了自己作为巴西政治体系中的主导力量，正如他们应该的那样。\n\n更新这个国家的时刻已经到来，这是第二次。\n\n不仅仅是重建，这个国家将被重塑、塑造和锻造，成为一个更强大、更有纪律、更团结的国家，将秩序和爱国主义扎根于每个公民的心中。\n\n武装部队，这个国家最高的捍卫者，曾经将巴西从共产主义的魔爪中拯救出来，现在又一次前来救援，民众在经历了如此多的冲突后疲惫不堪，终于可以安心地呼吸，因为安全、繁荣和自豪已经重新建立。"
BRA_reward_loyal_army_officers: "奖励忠诚的军官"
BRA_reward_loyal_army_officers_desc: "在与忠于派叛军的残酷冲突中始终坚定忠诚于政府的高级军官值得的不仅仅是尊重和感激，因为他们的功绩超出了任何可以听到的话语；他们值得认可和切实的奖励。\n\n将军、上校和少校，当国家分崩离析、一切似乎都失去了、恐怖分子屠杀我们的人民时，他们坚守阵地，这些人负责维护秩序和安全，应该归功于他们结束了叛乱。\n\n政府承认这一承诺，并将以应有的方式表彰他们，授予晋升、特殊勋章、土地授予以及对他们和家人的慷慨福利。"
BRA_promote_exceptionalism_in_conscripts: "促进应征者中的杰出表现"
BRA_promote_exceptionalism_in_conscripts_desc: "在前线牺牲自己并为这个国家的利益而战的普通步兵士兵和新兵对我们战胜忠于派负有责任。普通人、年轻人、工人、父亲，所有这些人从未想象过自己会处于如此血腥的环境中，却取得了非凡的成就，在处于劣势时坚守阵地，并克服了叛乱分子摆在他们面前的困难。\n\n虽然这是每个士兵的期望，但他们所表现出的勇气和牺牲必须得到认可和奖励。政府认识到这一点，并将促进士兵中的杰出表现制度，创建勋章制度、对英勇行为的快速晋升、现金奖励以及服兵役后的其他福利。"
BRA_promote_militarization_of_society: "促进社会军事化"
BRA_promote_militarization_of_society_desc: "军事模式，尽管许多人认为不行，但确实有效。\n\n我们不仅用武力击败了叛乱，还凭借纪律、等级制度、明确的目标以及为国家利益做出集体牺牲的理念。没有这些，我们甚至在开始之前就已经失败了。引导我们度过巴西历史上最黑暗日子的灯塔教会了我们很多东西，并让我们反思其他事情。像我们以前那样的非军事化社会导致我们陷入混乱，允许仇恨祖国的意识形态蓬勃发展，并向巴西民族打开地狱之门。\n\n对国家的热爱、对权威的尊重和爱国主义将引导这个国家走向繁荣的未来，使过去的错误永远不会重演。"
BRA_order_before_politics: "秩序先于政治"
BRA_order_before_politics_desc: "内战给巴西上了重要的一课，但最大最艰难的一课是，不受约束的政治化导致极端两极分化，并最终导致暴力。\n\n政党、意识形态和领导人的个人野心在国家最需要秩序的时候撕裂了这个国家。因此，现在，秩序和国家安全必须优先于政治。\n\n作为一个非政治实体，我们需要专注于恢复稳定、安全和法治，以便巴西能够再次呼吸新鲜空气，摆脱激进主义和政治极端主义的恐怖。"
BRA_myth_as_part_of_our_history: "\"神话\"作为我们集体历史的一部分"
BRA_myth_as_part_of_our_history_desc: "贾伊尔·梅西亚斯·博索纳罗不仅仅是一位政治家，他是抵抗的化身，是巴西长久以来一直在呼唤的东西的化身。一个在风暴中坚定不移的人，即使其他人都逃离了，一个在其他人都在散布谎言时平静而清晰地说话的人，一个在巴西似乎迷失时为巴西而战的人。\n\n他不仅仅是一个热爱国家的人，甚至不仅仅是一个领袖，他是爱国者，巴西民族的救世主，他在2018年砍掉了劳工党蛇的头，现在又把它踢回了地狱。年轻人应该了解他，并世世代代记住他。\n\n与卡希亚斯和蒂拉登特斯一起，书籍将讲述他的故事，将为他建造纪念碑。他坚定不屈的形象将被用作什么是真正爱国者的榜样。\n\n§Y巴西的生存归功于一个人：贾伊尔·梅西亚斯·博索纳罗。§!"
BRA_lessons_from_DOI_CODI: "来自DOI-CODI的教训"
BRA_lessons_from_DOI_CODI_desc: "前军事政权著名的DOI-CODI机构承载着沉重的恶名和争议遗产，但它也提供了在国内安全、反颠覆、情报收集和对恐怖分子的快速反应方面获得的经验库。我们必须从这个系统中学习。\n\n在识别和瓦解叛乱网络方面哪些有效，哪些情报和审讯技术被证明是有效的，以及如何通过使用该系统实现对敌人的快速行动。\n\n我们当前的敌人与军队过去必须处理的敌人并没有太大不同；他们是更激进、更受欢迎的版本，是的，但前政权最终摆脱了其大部分敌人，所以我们必须做的是扩展所使用的方法，同时改革一些方面。"
BRA_reframe_national_narrative: "重塑国家叙事"
BRA_reframe_national_narrative_desc: "许多巴西人仍然错误地对1964-1985年的军事政权怀有深深的怨恨。宣传是强大的，数百万人仍然想到审查、恐惧和侵犯人权，尽管大多数人从未真正经历过这些事情。\n\n为了巩固对军队的支持并获得人民的广泛接受，必须提醒民众真正发生了什么，强调当时的全球背景、经济困难、承认过去所犯的错误，最重要的是，提醒我们的平民我们在与谁战斗，揭露恐怖分子，并向民众表明战斗不是针对政权的反对者，而是针对想要从内部摧毁国家的嗜血恐怖分子。"
BRA_safeguard_patriot_legacy: "维护爱国者的遗产"
BRA_safeguard_patriot_legacy_desc: "从共产主义和混乱的寄生魔爪中捍卫巴西的英雄和爱国者不能从历史中被抹去，也不能被恐怖分子和修正主义者发明的叙事所妖魔化。纽顿·克鲁兹、卡洛斯·阿尔贝托·布里兰特·乌斯特拉上校等人，他们的勇气和对国家坚定不移的承诺值得被铭记和表彰为社会的榜样。\n\n乌斯特拉和其他人将作为职责和爱国主义的榜样被庆祝，这些人为从我们国家根除共产主义瘟疫献出了一切。他们的遗产将得到保护。\n\n自重新民主化以来，这些伟大的人一直被诋毁、妖魔化，他们的形象被唾弃。结束这一切的时刻已经到来。当代人需要荣誉和爱国主义的榜样来追随，像他们这样的人就是好榜样。"
BRA_emergency_powers_to_junta: "授予最高司令部紧急权力"
BRA_emergency_powers_to_junta_desc: "即使在法制派前线叛乱分子被摧毁后，巴西仍然受到其他恐怖组织的蹂躏。新纳粹分子、共产主义者、罪犯、极端分子，无论他们是谁，武装派别继续恐吓我们的民众，武装游荡在街头，迫害善良的公民。\n\n民事机构未能证明自己的价值，太慢、太分裂、太妥协，无法以危机所需的速度和团结作出反应。\n\n然而，高级军事指挥部拥有一切必要的条件，因此应该授予其紧急权力，使其能够直接控制关键的政治和行政决策，使我们能够以速度和精确度采取行动，消除我们领土上剩余的恐怖分子。"
BRA_strengthen_presidential_office: "加强总统办公室"
BRA_strengthen_presidential_office_desc: "法制派军队叛乱分子的失败并没有给我们带来我们所希望的平静，因为这只是冲突第一阶段的结束。巴西仍然四分五裂，其他更激进、更嗜血的团体在我们的领土上游荡，迫害我们的平民，恐吓祖国。\n\n旧制度不再适合我们，无法处理我们必须处理的事情。陷入僵局的国会、司法机构的拖延以及官僚惰性已被证明无法在这个时刻果断而准确地采取行动。\n\n必须加强总统职位，增强其权力，使其能够克服障碍并安全自信地采取行动。"
BRA_army_at_the_helm: "军队执掌国家"
BRA_army_at_the_helm_desc: "祖国拯救阵线做出的决定结出了果实。武装部队巩固了对国家的直接控制，用一个敏捷、有纪律、注重结果的政府取代了旧的、低效的、腐败的共和国。\n\n巴西的崩溃暴露了前制度的缺陷，所有的腐败，以及将个人利益置于人民需求之上的政客。然而，军队证明了自己恰恰相反，是一支忠于国家的力量，能够在考验时期团结行动。\n\n随着武装部队控制国家，巴西处于安全的地位，拥有光明的未来，摆脱了左翼主义、腐败和极端主义的恐怖。"
BRA_return_to_67_charter: "回归67年宪法"
BRA_return_to_67_charter_desc: "通过微妙的政治手段和对国会的压力，祖国拯救阵线成功废除了1988年宪法，回归旧的1967年宪法。\n\n1967年宪法诞生于伟大人物对巴西的愿景，旨在面对强大的中央权威和国家纪律来塑造国家，这正是我们恢复稳定和自豪感最需要的。通过这项措施，政府终于可以迅速采取行动，结束叛乱团体以及内战造成的一切后果，结束现已废除的宪法造成的国家瘫痪。"
BRA_rally_behind_the_captain: "团结在船长身后"
BRA_rally_behind_the_captain_desc: "贾伊尔·梅西亚斯·博索纳罗船长带领巴西度过了最黑暗的时刻。没有他，我们现在将被社会主义寄生虫征服。然而，多亏了他的智慧和专业知识，那些试图寄生这个国家的人现在要么被关在监狱里，要么已经死亡。\n\n他为国家服务的决心和意愿是很少有人拥有的。所有巴西人都应该被提醒这一点，并被呼吁与船长团结，尊重他、向他致敬、服从他。"
BRA_by_the_shield_and_sword: "以盾牌和剑"
BRA_by_the_shield_and_sword_desc: "从恐怖分子小偷窃取伟大爱国者贾伊尔·梅西亚斯·博索纳罗的总统选举开始，巴西内战结束了，巴西在经历了多年的疲惫冲突和无数死亡后重新统一。\n\n叛乱分子被践踏和唾弃，他们可悲的梦想被摧毁，他们的红旗被撕裂和羞辱，他们的领导人，伟大的叛徒路易斯·伊纳西奥·卢拉·达席尔瓦，躺在巴西历史最深的垃圾桶里被遗忘，为他对巴西犯下的所有罪行付出代价。\n\n现在开始重建国家的时刻。在军队的监督下，巴西进入一个新的、更好的时代。受伤但未死的巴西将再次崛起，比以前更强大、更团结、更具巴西特色。\n\n§Y\"祖国自由了，和平来了，为逝去的和受伤的人们\"§!"
BRA_traditions_based_governance: "基于传统的治理"
BRA_traditions_based_governance_desc: "家庭、信仰、爱国主义：三个原则，自从我们美丽的祖国诞生以来，一直支撑着社会并保持民众的控制。然而，在小偷和他的黑帮团伙当选后，一点一点地，使我们成为我们的东西被遗忘了，我们付出了更大的代价。\n\n然而，他们已经被摧毁了。路易斯·伊纳西奥·卢拉·达席尔瓦，这个国家的篡位者，摧毁了我们在国家中珍视的一切的人，现在终于在他很久以前就应该在的地方，他的犯罪团伙也和他一起去了，他们的红旗被撕裂并扔进了泥里。他们不再挡我们的路，我们可以回到定义我们作为巴西人的东西。"
BRA_restore_executive_mandate: "恢复行政授权"
BRA_restore_executive_mandate_desc: "巴西即将恢复正常，终于看到这场血腥战争的结束，授予武装部队高级军官的非凡权力已经达到了目的。尽管如此，我们不能永远维持这些权力，必须逐步缓慢地将其中大部分归还行政部门，允许总统以完整的授权恢复治理。"
BRA_restart_congressional_activities: "重新启动国会活动"
BRA_restart_congressional_activities_desc: "叛徒的叛乱，尽管具有破坏性，但对巴西政治产生了真正的净化作用。社会主义小偷，无论是来自劳工党、社会主义和自由党还是其他左翼政党，都与叛乱分子结盟，现在，随着他们的失败，他们已经被定罪、边缘化并被从舞台上移除，清除了国会中这个长期阻碍我们的眼中钉。\n\n我们现在终于可以恢复国会的活动，相信真正的爱国者，那些支持巴西、不允许自己被社会主义匪徒误导的人，分享对更美好巴西的愿景。"
BRA_strengthen_bolsonarism: "博索纳罗主义作为政治替代"
BRA_strengthen_bolsonarism_desc: "温和保守主义对巴西毫无帮助，未能承受三大危机，甚至未能遏制红色匪徒。只有一个人，一种意识形态，能够在2018年羞辱匪徒。只有一个人有勇气在一切都反对他的时候与制度作斗争：贾伊尔·梅西亚斯·博索纳罗。\n\n博索纳罗主义是对腐朽颓废制度的真正政治替代，拯救了巴西免受社会主义苦难和中央党团的腐败。如果不是贾伊尔·梅西亚斯的智慧，我们将面临又一个审查和腐败时期，必须提醒民众这一点。"
BRA_promote_natural_conservative_values: "促进自然保守价值观"
BRA_promote_natural_conservative_values_desc: "尽管贾伊尔·博索纳罗值得赞扬和荣誉来拯救国家，但我们不能永远依赖政治偶像，因为他们是短暂的，而保守主义、信仰、家庭、爱国主义和纪律的原则不是。\n\n它们带领我们度过了整个风暴以及与叛乱分子和其他恐怖组织的战争中的所有流血事件，必须作为巴西社会的基础加以推广，因为没有它们，一个国家最终会像我们一样。"
BRA_the_center_as_moderating_force: "中间派作为缓和力量"
BRA_the_center_as_moderating_force_desc: "右翼给了我们力量和激情，使我们的国家能够在风暴中生存，但正是温和派、制度主义者、中央党团，保持了机构的活力，防止了社会的彻底崩溃。\n\n激进主义证明了其价值，我们必须防止政府内的激进博索纳罗主义者和右翼极端分子带来另一波混乱和破坏，促进中间派作为确保稳定治理的力量。"
BRA_education_with_national_values: "具有国家价值观的教育"
BRA_education_with_national_values_desc: "巴西教育及其教育系统，因暴露于卢拉的社会主义垃圾而腐烂，已成为对我们儿童和青少年进行意识形态灌输的武器，教导他们妖魔化自己的过去，厌恶自己，鄙视自己的国家、历史、人民和辉煌成就。\n\n然而，内战的考验再次表明为什么爱国主义对我们的青年至关重要，并给了我们无数理由通过教育恢复青年的爱国主义。"
BRA_constitute_anti_corruption_laws: "制定反腐败法律"
BRA_constitute_anti_corruption_laws_desc: "巴西政治阶层中的腐败并不是什么新鲜事，由来已久且猖獗，正因为如此，它是人民仇恨和不满巴西利亚的主要原因之一。赢得巴西人民的信任和心并非易事，特别是在他们经历了如此多的耻辱之后，无论是内战之前还是期间，但如果我们想实现这一壮举，我们必须证明巴西利亚已经从错误中吸取了教训。"
BRA_brazil_the_loving_republic: "巴西，充满爱的共和国"
BRA_brazil_the_loving_republic_desc: "内战造成的恐怖和破坏使巴西人疲惫不堪，夺走了他们的家人、家园、收入来源、食物，以及许多人已经逐渐消失的希望。我们关心巴西人民，因为没有他们，就没有国家可以治理，这就是为什么我们必须向所有受苦和有需要的人展示这种爱和同情。"
BRA_strength_of_the_people: "人民的力量"
BRA_strength_of_the_people_desc: "贾伊尔·博索纳罗是巴西的面孔，这个人展示了他的力量、决心和意志力，与吸食这个伟大国家能量的寄生虫作斗争。他与一个腐朽的制度作斗争，这个制度只想着利用普通和谦卑的人为自己谋利益，把他们当作绞肉机的肉。他是在混乱和动荡中坚定不移的人，握着人民的手，使他们不会在激进主义的风暴中迷失自己。\n\n博索纳罗拥有人民，有了他们，他将引导巴西走向荣耀和繁荣的道路。"
BRA_the_federal_compromise: "联邦妥协"
BRA_the_federal_compromise_desc: "民粹主义已被证明是一把双刃剑。虽然这是博索纳罗当选的原因，但它本身无法治理像巴西这样复杂的国家，因为它基于人民的激情和即时欲望。另一方面，国会尽管过去有所有失败和错误，但看到了巴西需要做什么以及由谁来做的全貌，将长期考虑置于短期考虑之上，即使这意味着做出不受欢迎的决定。"
BRA_new_presidential_republic: "新总统共和国"
BRA_new_presidential_republic_desc: "贾伊尔·博索纳罗。强人。铁腕。\n\n这个人设定了巴西总统应该是什么样的标准。不仅仅是一位普通的领导人，踏入高原宫的最伟大的人面临着这个国家历史上最大的危机，并拒绝退让一寸。\n\n红色魔鬼试图窃取他的总统职位，但失败了。他们在窃取失败后试图摧毁这个国家。他们再次失败，这次是永远的。社会主义者被摧毁，他们幸存的领导人像恶心的蟑螂一样逃离这个国家。\n\n博索纳罗拯救了国家，不是一次，不是两次，而是无数次。\n未来的总统，尽管永远不会像船长那样，但必须至少足够强大才能被允许任职。"
BRA_maintain_the_balance_of_powers: "维持权力平衡"
BRA_maintain_the_balance_of_powers_desc: "内战前的制衡制度并非有缺陷，而是被罪犯、社会主义者、腐败分子以及受金钱和权力驱动的精英窃取和劫持。结构本身运作良好；责任完全在于特定个人。因此，为了巴西尽快稳定，恢复三权的现状至关重要。"
BRA_the_new_congressional_republic: "新国会共和国"
BRA_the_new_congressional_republic_desc: "内战以我们意想不到的方式净化了巴西政治，驱逐了绝大多数腐败分子、所有社会主义匪徒，并恢复了国会，这次允许它真正闪耀，只代表人民和人民。\n\n这种权力对于共和国的运作以及确保其他任何政府部门不会获得太多权力至关重要，因此必须加强它，使其能够更有效和高效地履行其职能。"
BRA_suspend_the_state_of_siege: "结束围困状态"
BRA_suspend_the_state_of_siege_desc: "胜利的日子已经到来。\n\n最后的恐怖分子已被摧毁，他们的返回和破坏旗帜被撕裂、烧毁、践踏并扔进泥里，他们的领导人像蟑螂一样逃离巴西，或者徒劳地试图躲避共和国的天眼。\n\n随着战争的结束，很久以前作为保护国家免受恐怖分子侵害的紧急措施之一宣布的围困状态已经完成了其目的，是时候逐步完全暂停它了。"
BRA_prosperity_through_economic_liberty: "通过经济自由实现繁荣"
BRA_prosperity_through_economic_liberty_desc: "所谓法制派军队的叛乱分子已经完蛋了，每个人都被关在监狱里，他们应该在那里，自由主义者在政府中根深蒂固。\n\n我们的国家，尽管仍处于战争状态，但正处于一个新的繁荣时代的门槛上。国家暴政的日子已经过去，就像一朵来来去去的大乌云。我们终于可以启动一项国家计划，重点是解放私人倡议，拆除臃肿的官僚机构，给予市场自由，不加干预，以便巴西人能够呼吸变革、繁荣和经济自由的新鲜空气。"
BRA_hand_on_our_shoulder: "肩上的援手"
BRA_hand_on_our_shoulder_desc: "在与法制派军队叛乱分子的长期冲突中，有一个群体始终坚定不渝地支持我们：大地主。中西部的伟大男女、牧场主、糖生产商、大小农民，在祖国最危急的时刻仍然忠于祖国。\n\n这种忠诚并非人人可见；并非每个人都有能力在如此长的时期内支持他人。而且，作为受三大危机和内战影响最大的群体之一，他们的承诺必须以互利的协议来回报。"
BRA_promote_enlightenment: "促进社会启蒙"
BRA_promote_enlightenment_desc: "几十年来，巴西人一直受到民粹主义的制约，无论是来自伟大叛徒和他的社会主义追随者还是其他来源。轻松致富的承诺、对民众的情感诉求、家庭补助金等社会控制计划，人们被置于这种廉价民粹主义的漩涡中，除了短暂的结果和最贫困者的愚蠢化之外一无所获。\n\n新自由主义也被红色团伙妖魔化，被贴上法西斯主义者、人民剥削者、劳工仇恨者等许多标签。人民对我们持谨慎态度，怀疑我们，这必须改变。\n\n必须揭露国家主义的闹剧，我们必须揭示自由和自由主义项目在成功的国家中所做的事情。为满足腐败者而塑造的文化，必须被重塑为重视辛勤工作、创新以及经济和个人自由，以便一点一点地消除对新自由主义的妖魔化。"
BRA_subsidies_to_agribusiness: "农业综合企业补贴"
BRA_subsidies_to_agribusiness_desc: "我们最重要的经济资产，农业综合企业，已被内战摧毁。我们不能等到清除了国家的叛乱分子后再恢复它，因为它对于保持国家经济活力和民众吃饱至关重要。这个部门的恢复至关重要，必须给予最高优先级，为其重组提供巨额补贴，无论成本如何。"
BRA_entrench_neoliberal_model: "巩固新自由主义模式"
BRA_entrench_neoliberal_model_desc: "内战作为共和国的重置，抹去了旧国家的一切，并创造了一个独特的机会窗口，让我们能够按照我们认为合适的方式改变国家。我们不能浪费这个机会，而是要抓住它来巩固一个前所未有的纯粹新自由主义模式。\n\n没有折中措施，没有与不同群体的无休止谈判，没有对腐败当权派的让步，巴西将从头到脚彻底改革，最终变得与战前截然不同。"
BRA_end_needless_spending: "结束不必要的支出"
BRA_end_needless_spending_desc: "战争摧毁了巴西国家的财政，使其负债累累，耗尽了储备，并中断了服务。每一分钱，每一雷亚尔的支出都必须有理由、审查和再次证明理由。没有任何东西可以也不会被用于\"无意义的事情\"。\n\n所有对政府运作非必需的东西，无论是部预算、无用的部委、非战略部门的补贴、过高的合同和特权，都将被削减。当权派的肥肉需要像厨师修剪肉一样修剪，这样我们才能最终明智地使用我们的钱。"
BRA_invest_in_research_innovation: "投资研究与创新"
BRA_invest_in_research_innovation_desc: "重建巴西，不仅需要意志力、劳动力和金钱；还需要我们重塑自己。新十年的技术为我们提供了非凡的可能性，有望快速取得成果。我们必须探索这一替代方案，并启动大胆的研发投资计划，以确保尽管面临困难，国家的复苏进程更加顺利，并为未来做好准备。"
BRA_privatize_the_drainholes: "私有化漏洞"
BRA_privatize_the_drainholes_desc: "巴西经济的许多部门正在窒息，简直就是金钱黑洞，吞噬着数十亿数十亿的补贴，积累着长期赤字，同时提供劣质和平庸的服务。\n\n巴西已经变成了纯粹的苦难。\n\n这些索取多于交付的水蛭是无用的、毫无价值的，既不为国家服务也不为人民服务，因此私有化它们是拯救可以拯救的东西并将这些机构变成高效机构的唯一途径。"
BRA_blow_up_the_stagnant_state: "炸毁停滞的国家"
BRA_blow_up_the_stagnant_state_desc: "陈旧、臃肿、官僚、缓慢、停滞、令人窒息。这就是谈论巴西国家时想到的。内战通过让民众暴露于他们所经历的恐怖之中并使国家陷入困境，但并没有结束它。\n\n§Y我们必须完成这项工作。§!\n\n一个更好的巴西不会由旧机构、旧政客、法规以及停滞、臃肿的官僚机构组成。我们必须拆除每一个，炸毁国家剩余的部分来锻造一个新的，只专注于需要做的事情，把其余的留给知道如何做的人。"
BRA_what_we_do_best: "我们最擅长的事情"
BRA_what_we_do_best_desc: "在这样的时代，不应该进行鲁莽的实验或对未经测试的模型进行冒险赌博，因为如果这些事情出错，将使我们面临严重风险。\n\n巴西需要回归它一直以来最擅长的事情。农业综合企业，我们在其中积累了数十年专业知识的部门，凭借我们的质量和数量已经到达世界的每个角落。大豆田、养牛场、甘蔗种植园和咖啡种植园不仅仅是经济的引擎；它们是我们拥有的财富和韧性的基础，即使面对灾难也是如此。"
BRA_our_endless_ambition: "我们无尽的野心"
BRA_our_endless_ambition_desc: "我们不是世界的芹菜，不。我们不再受外部团体需求的束缚。我们富有、威严，我们拥有世界各国愿意付出一切来拥有和实现一切的潜力和资源。我们是未来之国。这种潜力，被多年来从巴西利亚统治这个国家的腐败和无能者所阻碍，终于将被释放。"
BRA_allure_of_the_sertanejo: "塞塔内霍的魅力"
BRA_allure_of_the_sertanejo_desc: "本质上，巴西过去是、现在也是一个农村国家。许多人将此与弱点和脆弱性混淆，但这正是塑造我们身份和巴西人民力量的东西。塞塔内霍比任何城市都更能定义巴西人民。\n\n应该庆祝塞塔内霍美学，并使其成为农业的新面孔。同时，巴西农业综合企业是世界上最先进、最可持续和最人道的生产模式，应该如此描绘。"
BRA_workshops_of_the_future: "未来的车间"
BRA_workshops_of_the_future_desc: "国家的崩溃点燃了巴西经济，使其分裂并几乎完全摧毁。然而，与其他时代一样，它幸存下来，受伤但活着。随着它重新站起来，我们不能浪费时间，专注于通过我们的农业综合企业重建它，在此期间，农业综合企业与政府、企业家、工人和家庭一起保持弹性，他们与该行业密切相关，将能够重返工作岗位并梦想，而无需害怕国家。"
BRA_niobium_dreams: "铌之梦"
BRA_niobium_dreams_desc: "劳工党恶魔让我们倒退了几步。几十年前，中国的经济规模比我们小，我们有潜力，但一切都随着伟大叛徒而付诸东流。内战几乎在各个方面都使我们处于可怕的境地，但它也给了我们机会，终于将我们被剥夺的、沉睡的潜力付诸实践。\n\n我们走向21世纪的时刻已经到来。\n\n臃肿的国家已被摧毁，令人窒息的官僚机构已经消失，企业家阶层不再被政府的魔爪扼杀。有了完全的自由，我们心爱的国家正在开始一个新的发展时代，那些创新、渴望、梦想的人将取得成功。"
BRA_a_new_land_of_freedom_is_born: "一个新的自由之地诞生了"
BRA_a_new_land_of_freedom_is_born_desc: "我们人民历史上最具破坏性和血腥的冲突，一场撕裂家庭并将整个地区化为乌有的冲突，终于结束了。红色和激进的恶魔，在他们的仇恨旗帜和嗜血领导人的领导下团结起来，被扔出窗外，永远不会回来折磨我们的国家。\n\n与此同时，许多人对极权国家从我们祖国的灰烬中崛起的恐惧已经消散，他们欢呼雀跃，面对巴西将自由、真正自由的现实。\n\n绿黄旗帜在自由的风中和平地飘扬。"
# Ideas
BRA_selic_rates: "塞尔利率"
BRA_selic_rates_desc: "\"没有人喜欢高利率，甚至中央银行也不喜欢\"——坎波斯·内托"
BRA_consolidated_rights: "巩固的工人权利"
BRA_consolidated_rights_desc: "\"劳工立法是社会正义的基石。\"——热图利奥·瓦加斯"
BRA_brazilian_welfare: "巴西福利制度"
BRA_brazilian_welfare_desc: ""
BRA_offshore_oil_rigs_dynamic: "近海石油开采"
BRA_amazonian_jungle_dynamic: "亚马逊丛林"
BRA_amazonian_jungle_dynamic_desc: "亚马逊丛林是南美洲的一片巨大雨林，覆盖了亚马逊盆地的大部分地区，延伸到巴西北部以及圭亚那、委内瑞拉、秘鲁和玻利维亚的大部分地区。亚马逊占地球上剩余雨林总面积的一半以上，包含大量生物多样性，估计有16000个物种。\n\n虽然常被称为\"地球之肺\"，但实际上亚马逊对地球氧气水平的净贡献为零。然而，雨林对南美洲的气候平衡仍然具有不可估量的价值，是通过\"空中河流\"输送到大陆大部分地区的湿度来源，阻止了荒漠化。\n\n尽管有此价值，亚马逊丛林每年仍然经历重大破坏，通常由当地采矿和农业活动造成，有时得到外国资本的支持。\n\n§G虽然亚马逊丛林可能拥有许多物质和知识宝藏，但我们必须负责任地对待它。§!"
BRA_amazonian_jungle_state_dynamic: "亚马逊丛林状态"
BRA_amazonian_jungle_state_dynamic_desc: "$BRA_amazonian_jungle_dynamic_desc$"
BRA_not_world_power_idea: "2010年代的遗产"
BRA_not_world_power_idea_desc: "\n\n\n\n\n£GFX_BRA_power_of_the_future\n\n\n\n\n\n在2002年劳工党首次选举胜利后，时任总统路易斯·伊纳西奥·卢拉·达席尔瓦监督了惊人的经济增长，这主要得益于2000年代的大宗商品繁荣，刺激了该国强大的农业综合企业，甚至成功避免了2008年金融危机最灾难性的影响。凭借这样的运气、狡猾的治理和一些幕后谈判，卢拉成功改革了许多福利计划，通过了急需的社会改革，并消除了该国严重的饥饿问题，到2010年代时，许多巴西人的生活条件得到了明显改善，卢拉本人也以当时最高支持率的国家元首之一的身份离任。\n\n然而，这段恩宠时期不会持续太久。在选举他的继任者后，迪尔玛·罗塞夫总统努力维持其前任的改革，但缺乏卢拉的口才，加上繁荣的结束，迪尔玛发现自己陷入两难境地，中央党团越来越发挥其影响力来牵制政府。在2014年轻微连任后，随着2014年国际足联世界杯的灾难性结果和即将到来的财政危机，劳工党的支持率下降，迪尔玛开始实施财政紧缩计划，同时贬值雷亚尔，试图促进国内工业化并刺激国内市场。\n\n她的计划适得其反，在2015年和2016年期间将巴西推入滞胀，然后是严重衰退。这加上洗车行动揭露的她和卢拉过去政府的腐败丑闻越来越多，注定了她的命运，她最终于2016年8月被弹劾。她的继任者，副总统米歇尔·特梅尔，将担任总统并继续进行不受欢迎的预算削减，削减教育、医疗和其他社会支出，以控制危机对政府财政的损害。\n\n到2020年，普遍的情绪是失去的十年，巴西人大多失去了对国家机构和领导国家走向未来的能力的信任，将§Y\"未来大国\"§!的梦想永远留在了渴望的过去。"
BRA_aftershock_of_2015_recession_idea: "2015年衰退的余波"
BRA_aftershock_of_2015_recession_idea_desc: "在迪尔玛第二届政府期间，一个不受欢迎但可预见的问题终于敲响了大门：经济学家开始警告可能出现滞胀情景，因为帮助维持卢拉大部分政府时期的大宗商品繁荣显示出即将停止的迹象。承认这种情况后，迪尔玛准备了被称为\"新经济矩阵\"的计划，正如当时的经济部长吉多·曼特加所解释的那样。简而言之，政府将引入工业税收减免，迫使银行部门以低利率放贷，并促进国内市场以规避大宗商品价格的外部冲击。\n\n该计划虽然合理，但未能达到预期效果，因为它产生了相反的结果：工业没有将获得的利润再投资，而是囤积资本，导致预算收入下降，加上繁荣的枯竭和随后大宗商品价格的下跌，造成了预期的财政失衡。为避免衰退而绝望，迪尔玛引入了新自由主义紧缩计划，旨在通过削减增长加速计划（PAC）来重新平衡预算，降低公共投资，加剧了危机的影响。\n\n随着政府的支持率因这些措施而受到侵蚀，国家现在陷入衰退，中央党团转而反对她，她被弹劾，支持副总统米歇尔·特梅尔。他将继续完成她的任期，并与博索纳罗一起引入更大的新自由主义改革，例如\"支出上限改革\"，建立20年的政府支出上限，2017年的劳动法改革和博索纳罗在2019年的养老金改革。\n\n到2020年，虽然经济显示出复苏迹象，但经济仍然大部分处于崩溃状态，只是十年前的影子。我们希望情况不会变得更糟。"
BRA_hold_of_the_centrao_idea: "中央党团的控制"
BRA_hold_of_the_centrao_idea_desc: "\n\n\n\n\n£GFX_BRA_hold_of_the_centrao\n\n\n\n\n\n在过去的几十年里，随着巴西在21年军事独裁后巩固其重新建立的民主政权，政治秩序的再生创造了一种被巴西人昵称为\"中央党团\"的现象，大致翻译为\"大中间派\"。这个概念指的是许多分裂的中间派政党的主导地位，这些政党仍然是总统政府的造王者。\n\n由于他们普遍以阻挠政府议程作为勒索手段来满足他们分散的利益，以及由于他们的政治投机主义而不断改变效忠对象，中央党团已与巴西人认为政治体制中最糟糕的东西联系在一起：腐败和机会主义的政客、根深蒂固的政治王朝、政府屈从于强大利益集团的不正当需求而不是程序化的意识形态议程，以及玷污民主进程整体的任何污点。无论你的意识形态、你的政党或你的政府计划如何，请记住一件事：\n\n§R即使你是基督重生，要治理这片土地，无论你多么努力想成为圣人，你仍然将被迫与撒旦一起治理。§!"
BRA_brazilian_society_idea: "普遍暴力"
BRA_brazilian_society_idea_desc: "\n\n\n\n\n£GFX_BRA_generalized_violence\n\n\n\n\n\n广泛的社会不平等状况、众多犯罪组织的出现、政治激进化的加剧、农村地区失地贫困农民与该国农业综合企业土地所有者之间冲突的升级，以及该国军事化警察部队实施的极端暴力，都使该国染上了世界上最高的凶杀率之一，超过了所有发达国家的总和。\n\n过去的政府到目前为止一再未能解决这个严峻的社会问题。博索纳罗总统和莫罗部长的\"严惩犯罪\"做法受到了相当大的批评，因为他的批评者指出，由于生活条件的恶化，这些措施的结果在很大程度上无效，只会加剧国家对主要生活在巴西贫民窟的贫困和黑人的暴力行为。"
BRA_disjointed_geography_idea: "支离破碎的地理"
BRA_disjointed_geography_idea_desc: "\n\n\n\n£GFX_BRA_disjointed_geography\n\n\n\n\n\n作为世界上地理最具挑战性的地区之一的后殖民大陆规模国家，在连接该国更偏远地区方面提出了巨大挑战。更糟糕的是，50年代末看到了推动以汽车为中心的基础设施建设，并在儒塞利诺·库比契克总统领导下放弃了国家的铁路网络，这如果不是直接受到当时不断增长的美国汽车工业的推动，也是受到其影响。\n\n这种基础设施模式在构成该国的丘陵地形、深邃丛林和沼泽中被证明难以建造和维护，导致道路条件不足、频繁的瓶颈，并使亚马逊丛林等周边地区与国家中心地区的联系不佳。"
BRA_brazilian_agro_idea: "巴西农业"
BRA_brazilian_agro_idea_desc: "\n\n\n\n\n£GFX_BRA_brazilian_agribusiness\n\n\n\n\n\n\"农业是科技，农业是流行，农业是一切\"最近已成为巴西人心中最著名的宣传口号之一。这句口号已成为该国经济农业综合企业部门的象征，吹嘘其在推动经济发展方面的巨大影响力以及该国作为世界粮仓的意识形态，无论是在国内还是国际上。\n\n然而，在花哨的媒体关注和集体想象背后，隐藏着危险的土地所有者家族依靠自己的打手私人军队的黑暗故事，以及巴西农村工人恶劣的封建式工作条件的故事，这些构成了农业综合企业生产力的真正支柱。这一点，加上其在巴西国会的影响力，通过SAFRA计划等 lavish政府农业金融计划为自己提供资金，以及他们对工业化议程的阻挠，导致许多人厌恶他们，将他们视为巴西经济多样化和进步的障碍。\n\n这些条件导致了许多土地改革运动的诞生，其中包括改革主义的失地工人运动（MST），支持劳工党并通过制度手段进行一般土地改革，以及其更激进的分裂：贫困农民联盟（LCP），主张土地革命和暴力摧毁所谓的\"巴西大庄园\"，作为永远摆脱国家土地所有者-农业综合企业经济的唯一途径。\n\n§R巴西农业综合企业非常依赖并对世界市场的波动敏感。如果发生任何灾难性事件，这将意味着该部门的厄运，甚至可能是国家的厄运，因此请将MST和LCP拒之门外，最重要的是：保持该部门运行。§!"
BRA_self_indulgent_military_idea: "军装党"
BRA_self_indulgent_military_idea_desc: "\n\n\n\n\n£GFX_BRA_the_partido_fardado\n\n\n\n\n\n\"军装党\"大致翻译为\"穿制服的政党\"，或更贴切地说，\"高级军官党\"，是自1985年军队将权力交还给民主治理以来，巴西武装部队对文官政府持续影响的常用定义。从那时起，武装部队一直充当文官治理的不受欢迎的伙伴，并在后来几年要求不断增加的津贴、权利和资金，总是含蓄地敲诈政府以尊重他们的利益。\n\n随着2018年底贾伊尔·博索纳罗的当选，他本人是一名低级退役陆军上尉，武装部队以惊人的速度增加了在文官治理中的存在，令社会上许多人感到沮丧。由于博索纳罗关于1964-85年独裁统治遗产的许多有争议的说法，政变担忧对许多人来说变得真实和严重，没有人知道高级军官在他们总部紧闭的门后有什么计划。\n\n§R宪法第142条：武装部队由海军、陆军和空军组成，是永久性的正规国家机构，基于等级制度和纪律组织，在共和国总统的最高权威下，旨在捍卫祖国、保障宪法权力，并在这些权力的主动下维护法律和秩序。§!"
