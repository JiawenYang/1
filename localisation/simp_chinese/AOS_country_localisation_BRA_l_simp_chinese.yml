BRA_2022_elections_category: "2022年总统选举"
BRA_2022_elections_category_desc: "\n\n\n\n\n£GFX_BRA_electronic_voting_booth\n\n\n\n\n\n\n\n即将到来的§Y2022年巴西大选§!有望成为该国迄今为止最分裂的一次。一方面，进步社会民主党的老卫队寻求重新获得自2016年迪尔玛·罗塞夫弹劾以来失去的阵地，在§p希望巴西联邦（FBE）§!下团结起来。\n\n另一方面，强硬右翼寻求保持他们的势头，并巩固贾伊尔·博索纳罗发起的竞选，在§7巴西爱国联盟（APB）§!下。\n\n而在一旁，自由主义者、保守主义者和劳工主义者在他们自己的联邦下抓住任何一点相关性。对他们来说，这次选举可能是他们最后一次执掌国家的机会。\n\n§C---- 当前选举民意调查 ----§!\n\n[BRA_get_2022_elections_polling]\n\n[BRA_get_2022_elections_polling_others]"
BRA_ABIN_category: "ABIN关于激进派系的报告"
BRA_internal_factions_category: "政治音乐椅"
BRA_internal_factions_category_desc: "由不同的阵线和派系组成，他们在另一个时代被视为不寻常的联盟而统一，从一开始就有着相同的目的：结束§R国家退化者§!。抛开那些会导致他们一事无成的琐碎意识形态争论，联盟由唯一且单一的目标维系在一起：最终§Y结束那些从巴西窃取了近二十年进步并欺诈性地试图重新掌权的人的政权。§!\n\n所有派系最终都服从于一位§G指挥中的船长§!，他的决定将塑造他们在£pol_power §C国家政府中的影响力§!，并最终§Y我们国家将遵循的道路。§!\n\n§n£GFX_BRA_FCUB_logo 巴西联合基督教阵线（FCUB）§! - [?BRA_factions_olavist_influence_var|2%C]\n    £stability_texticon [?BRA_factions_stab_dyn_var|+2%]  £population_texticon [?BRA_factions_pop_dyn_var|+2%]  £GFX_dx_yellow [?BRA_factions_personal_dyn_var|+2%]\n一个由不同基督教团体组成的联盟，包括两个主要分支：福音派新教徒和罗马天主教徒。主张回归基督教传统和道德，同时促进世俗国家的终结和由基督和忠于他话语的人选择的领导人统治的国家。\n\n§G£GFX_BRA_FRP_logo 祖国恢复阵线（FRP）§! - [?BRA_factions_military_influence_var|2%C]\n    £war_support_texticon [?BRA_factions_war_dyn_var|+2%]  £manpower_texticon [?BRA_factions_conscription_dyn_var|+2%]  £command_power_texticon [?BRA_factions_cp_dyn_var|+2%]\n一个由热爱巴西国家并为之献出生命的人组成的联盟，爱国者。主张回归秩序和民族自豪感，该阵线支持并捍卫摧毁左翼主义、颠覆性运动和那些试图玷污巴西的人，同时促进国家安全、国家资本主义和对武装部队的更好认可。\n\n§P£GFX_BRA_FFB_logo 巴西家庭阵线（FFB）§! - [?BRA_factions_bolsonarist_influence_var|2%C]\n    £pol_power [?BRA_factions_pp_dyn_var|+2%]  £compliance_gain_texticon [?BRA_factions_compliance_dyn_var|+2%]  £GFX_development [?BRA_factions_society_dyn_var|+2%]\n一个由保守派和博索纳罗支持者组成的联盟，致力于巴西的进步和发展，利用巴西人民的信仰推动反堕胎和亲枪改革，这些政策有助于回归传统价值观、家庭和爱国主义，同时捍卫资本主义价值观。\n\n§O£GFX_BRA_FLP_logo 自由与繁荣阵线（FLP）§! - [?BRA_factions_libertarian_influence_var|2%C]\n    £GFX_dx_yellow [?BRA_factions_business_dyn_var|+2%]  £construction_speed_texticon [?BRA_factions_construction_dyn_var|+2%]  £GFX_percent [?BRA_factions_interest_dyn_var|-2%]\n一群自由主义者和自由爱好者，他们倡导市场资本主义、促进市场和自由贸易的激进经济改革，以及大幅削减税收和征费，同时促进传统主义社会政策，拒绝进步主义和其他形式的道德和社会倒退。"
