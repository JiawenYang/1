# Decision Categories
BRA_amazonian_jungle_category: "亚马逊丛林"
BRA_amazonian_jungle_category_desc: "\n\n\n\n\n£GFX_BRA_amazon_burning\n\n\n\n\n\n\n\n每年，亚马逊丛林都在燃烧。虽然保护它的政治愿望存在，但实际上，这些行动的非法性质、基础设施的缺乏和容易进入，以及亚马逊丛林的巨大规模，使其难以执行。另一方面，巴西社会的许多部门，如§Y农业综合企业§!和§Y采矿§!，对保护丛林没有兴趣，宁愿看到它被摧毁以利于扩大他们的业务。\n\n为了保护我们的丛林，我们需要谨慎选择我们的发展，对我们的方法制定强有力的改革，并更严厉地打击非法砍伐和焚烧。§G我们的目标应该是保持至少超过80%的丛林得到保护§!。\n\n§R科学家警告说，如果受保护的丛林总量下降到70%以下，我们有可能越过不归路。如果亚马逊丛林崩溃，后果对我们自己和我们的邻居来说可能是灾难性的，国际社会可能不愿意袖手旁观并让它发生。§!\n\n\n亚马逊丛林剩余面积: [?global.BRA_amazonian_preservation_var|.2%%G]\n\n月度变化: [?modifier@amazonian_preservation_monthly|.2%%+]\n\n"
BRA_congress_category: "巴西国会"
BRA_congress_category_desc: "\n\n\n\n\n£GFX_BRA_chamber_of_deputies\n\n\n\n\n\n\n\n巴西国会是国家民主的主要舞台。在这里，两院的当选官员对法律提案（PLs）或宪法修正案（PECs）等提案进行投票。无论是左翼、右翼还是中间派，任何针对国家的提议都需要国会多数票才能通过。\n\n国会分为§Y5个派别§!，每个派别都有自己的利益和对我们政府的倾向。每个派系的影响力可以通过其目前持有的§Y席位数量§!来衡量，而他们的§Y支持§!转化为他们有多少席位会真正支持我们政府的项目。为了推进我们的政策，我们需要§C提高我们在较大派系中的支持§!，以及§C将席位从对立派系转移到更支持我们的派系§!。\n\n§Y目前，我们在国会共有[?BRA_congress_total_support_seats_var|0]个席位的支持。§!\n\n§d---- 左翼 ([?BRA_congress_far_left_seats_var]) ----§!\n§Y支持率: [?BRA_congress_far_left_support_var|2%Y] ([?BRA_congress_far_left_support_seats_var])§!\n国会的小左翼由激进的社会主义和共产主义议员组成，他们谴责资本主义是社会大多数问题的根源，并至少在理论上主张废除它。\n\n§t---- 中左翼 ([?BRA_congress_left_seats_var]) ----§!\n§Y支持率: [?BRA_congress_left_support_var|2%Y] ([?BRA_congress_left_support_seats_var])§!\n即使在劳工党垮台后，国会的中左翼仍设法在立法机构中保持相当大的影响力。它由主要通过改革相信社会和经济正义的议员组成。\n\n§O---- 中间派 ([?BRA_congress_center_seats_var]) ----§!\n§Y支持率: [?BRA_congress_center_support_var|2%Y] ([?BRA_congress_center_support_seats_var])§!\n\"中央党团\"一直是巴西政治中一股始终存在的力量，在本届政府下也不例外。以自我为中心，除了他们在政府中的地位外，他们不会为任何事情挺身而出，但如果能让他们有利可图，可能会被说服支持大多数政策。\n\n§4---- 中右翼 ([?BRA_congress_right_seats_var]) ----§!\n§Y支持率: [?BRA_congress_right_support_var|2%Y] ([?BRA_congress_right_support_seats_var])§!\n巴西的中右翼在2016年迪尔玛·罗塞夫弹劾和2018年贾伊尔·博索纳罗当选后获得了重大影响力。他们推动减少国家机构、经济紧缩和社会保守政策。\n\n§P---- 右翼 ([?BRA_congress_far_right_seats_var]) ----§!\n§Y支持率: [?BRA_congress_far_right_support_var|2%Y] ([?BRA_congress_far_right_support_seats_var])§!\n巴西的右翼包括反动保守派、强硬福音派，甚至在边缘还有整体主义同情者。他们的议程是拆除所谓的\"进步\"政策，并将国家恢复到他们认为的\"传统价值观\"。"
