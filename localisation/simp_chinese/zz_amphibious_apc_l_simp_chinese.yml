l_simp_chinese:
 ZZ_amphibious_apc_chassis_aavp7a1: "AAVP-7A1"
 ZZ_amphibious_apc_chassis_aavp7a1_desc: "美国海军陆战队主力两栖输送车，具备浮渡能力，专为抢滩登陆作战设计。"
 ZZ_amphibious_apc_chassis_zbd05: "ZBD-05"
 ZZ_amphibious_apc_chassis_zbd05_desc: "中国新一代高速两栖战车，采用滑行车体与喷水推进，水上航速世界领先，是跨海登陆作战的核心装备。"
 ZZ_amphibious_apc_chassis_kaav7: "KAAV7"
 ZZ_amphibious_apc_chassis_kaav7_desc: "韩国在AAV7A1基础上特许生产并改进的两栖突击车，是韩国海军陆战队抢滩登陆的主力装备。"
 ZZ_amphibious_apc_chassis_lvtp5: "LVTP-5"
 ZZ_amphibious_apc_chassis_lvtp5_desc: "美国50年代列装的履带式两栖输送车，可搭载一个加强排实施抢滩登陆，70年代起由AAV7系列取代。"

 ZZ_amphibious_mechanized_equipment: "两栖战车"
