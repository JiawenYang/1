l_simp_chinese:
 ZZ_amphibious_apc_chassis: "两栖战车"
 ZZ_amphibious_apc_chassis_0: "早期两栖战车"
 ZZ_amphibious_apc_chassis_1: "第一代两栖战车"
 ZZ_amphibious_apc_chassis_2: "第二代两栖战车"
 ZZ_amphibious_apc_chassis_3: "第三代两栖战车"
 ZZ_amphibious_apc_chassis_4: "第四代两栖战车"
 ZZ_amphibious_apc_chassis_desc: "AAV7、ZBD-05 一类履带式两栖战斗车辆，具备完整的火力、防护与动力模块，专为抢滩上陆与江河作战设计，供海军陆战队与两栖突击部队使用。"
 ZZ_amphibious_apc_chassis_0_desc: "冷战早期的履带式两栖输送车辆，航速与防护都较为有限，但已具备完整的模块化改装空间。"
 ZZ_amphibious_apc_chassis_1_desc: "AAV7、ZBD-05 一类履带式两栖战斗车辆，具备完整的火力、防护与动力模块，专为抢滩上陆与江河作战设计，供海军陆战队与两栖突击部队使用。"
 ZZ_amphibious_apc_chassis_2_desc: "新一代两栖突击车，采用更高功率的动力包与强化装甲，在保持水上航渡能力的同时大幅提升登陆后的火力与生存能力。"
 ZZ_amphibious_apc_chassis_3_desc: "机械化程度更高的两栖战车，配备数字化火控与更强的动力系统，可适应高强度的渡海突击作战。"
 ZZ_amphibious_apc_chassis_4_desc: "采用复合装甲与主动防护模块的新一代两栖战车，可在敌方岸防火力下维持突击速度。"
 ZZ_amphibious_apc_tech: "两栖战车"
 ZZ_amphibious_apc_tech_desc: "解锁两栖战车底盘，可设计 AAV7、ZBD-05 一类具备完整火力、防护与动力模块的履带式两栖战斗车辆。"
 tank_designer_ZZ_amphibious_apc_chassis: "两栖战车"
 tank_designer_ZZ_amphibious_apc_chassis_is_role_disallowed: "无法把当前设计转换为§H两栖战车§!定位。\n\n两栖战车属于独立底盘系列，请在两栖战车底盘上直接设计。"
 tank_designer_ZZ_amphibious_apc_chassis_role_disallowed: "无法把当前设计转换为§H两栖战车§!定位。\n\n两栖战车属于独立底盘系列，请在两栖战车底盘上直接设计。"
