 DSW_SOV_land_command_crisis:0 "混乱的陆军指挥系统"
 DSW_SOV_land_command_crisis_desc:0 "前线的行动暴露出指挥链僵化、基层协同失灵与补给调度混乱。纸面上的计划难以落实，部队无法及时把局部战果转化为持续攻势。只有从军官体系到联合后勤的系统性重建，才能重新组织有效的陆上作战。"
 DSW_SOV_navy_command_crisis:0 "失调的海军协同体系"
 DSW_SOV_navy_command_crisis_desc:0 "舰队建设与实战协同长期脱节，编队指挥、目标发现和联合任务仍缺乏统一标准。有限的现代化与舰队改革能够改善执行能力，却无法在短时间内弥补长期积累的体系缺陷。"
 DSW_SOV_air_command_crisis:0 "缺失的空军支援体系"
 DSW_SOV_air_command_crisis_desc:0 "空地协调、空域管理与航空保障之间存在断层，既有训练体系也难以稳定培养作战骨干。装备更新和任务整合能够缓解压力，但无人机无法代替成熟的飞行员培养与长期安全训练，部分短板仍将持续。"
 DSW_SOV_industry_recovery_dynamic:0 "紊乱的工业生产链"
 DSW_SOV_industry_recovery_dynamic_desc:0 "设备、原料、劳动力和结算之间的衔接出现了断层，现有工厂无法稳定兑现前线订单。恢复基础生产秩序后，有限的流程优化仍能带来温和改善。"
