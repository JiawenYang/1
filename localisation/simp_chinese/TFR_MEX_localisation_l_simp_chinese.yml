l_simp_chinese:
 #烈焰升腾 墨西哥毒品战争事件链（移植改编版）
 mexico.1.t: "突袭行动成功"
 mexico.1.d: "海军特种部队依据情报突袭锡那罗亚集团一处隐蔽的制毒实验室，缴获数吨芬太尼与前体化学品，行动无一伤亡。总统在晨间记者会上称这是“毒品战争以来最干净的一次胜利”。"
 mexico.1.a: "继续保持高压"
 mexico.2.t: "突袭行动失败"
 mexico.2.d: "特种部队在米却肯山区遭遇伏击，撤离直升机被迫中途放弃。情报泄露的痕迹十分明显，阵亡名单让总统府陷入沉默。"
 mexico.2.a: "必须彻查内鬼"
 mexico.3.t: "移民车队抵达危地马拉边境"
 mexico.3.d: "数千名中美洲移民在危地马拉边境集结，正向北推进。华盛顿要求墨西哥承担“安全第三国”责任，而北部各州州长已在讨论自行设置路障。"
 mexico.3.a: "关闭南部边境"
 mexico.3.b: "提供人道主义过境"
 mexico.4.t: "军官与毒枭武装交火"
 mexico.4.d: "陆军巡逻队在塔毛利帕斯州与武装分子爆发持续数小时的交火，地方警察全程缺席。军方高层首次公开承认，部分州份的治安权已不在政府手中。"
 mexico.4.a: "军队必须接管治安"
 mexico.5.t: "警方扣押美国难民"
 mexico.5.d: "随着美国国内局势恶化，大批美国公民越境进入墨西哥北部。边境警察以证件不全为由扣押数百人，拘留营迅速超员，华盛顿与墨西哥城互相指责。"
 mexico.5.a: "依法处理"
 mexico.6.t: "锡那罗亚集团开始夺取地盘"
 mexico.6.d: "锡那罗亚集团在下加利福尼亚、索诺拉、奇瓦瓦与锡那罗亚-杜兰戈公开设立检查站，声称要“保护”当地居民免受政府勒索。联邦警察撤出了这些地区。"
 mexico.6.a: "联邦政府已无力回应"
 mexico.8.t: "蒂拉卡连特集团开始夺取地盘"
 mexico.8.d: "蒂拉卡连特集团在哈利斯科与格雷罗-瓦哈卡接管了港口与公路收费站，地方政客出现在他们的发布会上。墨西哥城只能眼睁睁看着税收流向别处。"
 mexico.8.a: "首都仍在坚持"
 mexico.9.t: "塔毛利帕斯集团开始夺取地盘"
 mexico.9.d: "塔毛利帕斯集团在新莱昂、科阿韦拉与韦拉克鲁斯完成了对工业走廊的控制。跨国工厂开始与武装集团直接谈判，而非与政府。"
 mexico.9.a: "工业界已另寻靠山"
 mexico.10.t: "其他地区秩序崩溃"
 mexico.10.d: "瓜纳华托、恰帕斯与尤卡坦相继陷入无政府状态。地方民兵、原住民自卫组织与残余警察各自划界，联邦旗帜在许多城镇已经降下。"
 mexico.10.a: "国家正在解体"
 mexico.11.t: "毒枭战争爆发"
 mexico.11.d: "三大集团同时向联邦政府宣战。军队成建制倒戈，警察系统瓦解，墨西哥城以外的国土实际上已不再受政府管辖。这是这个国家建国以来最黑暗的时刻。"
 mexico.11.a: "国家进入战时状态"
 mexico.12.t: "毒枭战争结束"
 mexico.12.d: "持续数年的混战终于结束。联邦政府在废墟上重新升起国旗，重建委员会接管了被战火摧毁的北部工业带。代价是一整代人的记忆。"
 mexico.12.a: "重建秩序"
 mexico.13.t: "战后重建与大选"
 mexico.13.d: "在推迟两年的全国大选后，新任总统在墨西哥城宣誓就职。她的竞选承诺只有一句话：让国家重新属于国民。"
 mexico.13.a: "让国家重新属于国民"
