l_simp_chinese:
 zzz_party.1.t:0 "雅加达的新政权"
 zzz_party.1.d:0 "大亚洲战争结束后，印度尼西亚的政治格局被彻底改写。在占领当局的默许下，以苏哈托家族为核心的亲日民族主义右翼重返雅加达，组建威权政府，着手整顿战后经济与群岛秩序。"
 zzz_party.1.a:0 "承认新政府"
 zzz_party.4.t:0 "台北的政权更迭"
 zzz_party.4.d:0 "台湾问题的政治安排落地后，台北的执政团队完成更替，岛内政治力量重新整合，新的行政机构开始对接大陆的经济与航运体系。"
 zzz_party.4.a:0 "承认新政府"
 zzz_party.5.t:0 "东京的红色政权"
 zzz_party.5.d:0 "日本战败后，自民党长期执政的体制随之瓦解。日本共产党在战后选举与工会的支持下取得执政权，宣布解散财阀、推进国有化，并重建和平宪法秩序。"
 zzz_party.5.a:0 "承认新政府"
 zzz_party.90.t:0 "$COUNTRY$ 成立协作政府"
 zzz_party.90.d:0 "战事失利后，$COUNTRY$ 的旧政权瓦解。新成立的协作政府在占领当局支持下接管行政，并宣布转向社会主义建设路线。"
 zzz_party.90.a:0 "承认协作政府"
 zzz_party.91.t:0 "$COUNTRY$ 成立亲西方政府"
 zzz_party.91.d:0 "战事失利后，$COUNTRY$ 的旧政权瓦解。新成立的临时政府在占领当局支持下接管行政，宣布建立亲西方的民主体制并恢复多党选举。"
 zzz_party.91.a:0 "承认临时政府"
 zzz_party.92.t:0 "$COUNTRY$ 成立亲日民族主义政府"
 zzz_party.92.d:0 "战事失利后，$COUNTRY$ 的旧政权瓦解。在占领当局的扶植下，亲日的民族主义右翼接管行政，宣布建立威权体制，并与日本的经济与安保网络保持紧密联系。"
 zzz_party.92.a:0 "承认新政府"
 zzz_party.93.t:0 "越南共和国成立"
 zzz_party.93.d:0 "日本赢得大亚洲战争后，越南的旧政权崩溃。在占领当局的扶植下，以总理阮友政为首的南越系反共政治人物宣布成立越南共和国，以政权统一全国，在西贡升起黄底三红条旗。"
 zzz_party.93.a:0 "承认越南共和国"
 VIE_nationalist:0 "越南共和国"
 VIE_nationalist_DEF:0 "越南共和国"
