 HUN.Conservative: "£HUN_emerging_reactionary 青年民主主义者联盟-匈牙利公民联盟"
 HUN.Autocracy: "£generic_Autocracy_small 尤比克争取更好的匈牙利运动"
 HUN.Autocracy_icon: "£generic_Autocracy_small"
 HUN.Autocracy_desc: "（专制主义） - 尤比克争取更好的匈牙利运动是一支激进民族主义政党，把反建制言论与民族复兴、强权国家以及对自由民主的公开敌意结合在一起。\n\n尤比克最初依靠反罗姆人、反犹煽动以及对欧盟和北约的敌意建立起选民基础；近年来其形象有所缓和，但仍保留强硬民族主义内核。其优势在于东北部贫困地区的抗议选票、纪律严明的活动分子网络，以及愿意与任何挑战主流政党的力量合作的姿态。"
 HUN.Neutral_conservatism: "£HUN_non_aligned_conservative 青年民主主义者联盟-匈牙利公民联盟"
 CZE.Conservative: "£generic_Conservative_small 不满公民行动2011 (ANO)"
 CZE.Conservative_2015: "£generic_Conservative_small 不满公民行动2011 (ANO)"
 CZE.Conservative_2015_icon: "£generic_Conservative_small"
 CZE.Conservative_2015_desc: "（民粹主义） - 不满公民行动2011\n\n不满公民行动2011是一个以亿万富翁商人安德烈·巴比什为核心的民粹主义运动，他承诺像经营企业一样管理国家。该运动反对腐败和现有政党，主张提高政府效率、降低普通家庭的生活成本、提高养老金水平并加强对移民的控制。\n\n该运动组织严密，忠于其创始人，其灵活的意识形态使其能够同时吸引左翼和右翼选民。它对欧盟更深层次的一体化和欧元持怀疑态度。其影响力源于巴比什的商业帝国、他个人的超高人气以及在老年选民和小城镇选民中的强大基础。"
 CZE.Neutral_Autocracy: ""
 CZE.Neutral_Autocracy_icon: ""
 CZE.Neutral_Autocracy_desc: ""
 SLO.conservatism: "£generic_Conservative_small 普通人与独立人格 (OĽaNO-NOVA)"
 SLO.conservatism_icon: "£generic_Conservative_small"
 SLO.conservatism_desc: ""
 SLO.Conservative: "£generic_Conservative_small 普通人与独立人格 (OĽaNO-NOVA)"
 SLO.Conservative_icon: "£generic_Conservative_small"
 SLO.Conservative_desc: "（反动主义） - 普通人与独立人格 (OĽaNO-NOVA)\n\n普通人与独立人格是由伊戈尔·马托维奇领导的民粹主义保守运动，以反腐败和反对既有政党特权为核心。它自称普通公民运动，在社会与家庭议题上持保守立场，同时主张慷慨的家庭福利与亲欧洲的外交政策。\n\n该运动高度集中于其创始人，依靠对方向党与传统右翼失望的抗议选票。其影响力源于马托维奇的公众形象、反腐议程，以及在中小城镇和农村地区保守选民中的号召力。"
 POL.conservatism_1_desc: "保守党 - 法律与公正是占主导地位的波兰民族保守党、基督教民主党，将经济干预主义和社会福利与社会保守主义观点相结合。它主张与欧盟谨慎合作，坚决反俄。"
 POL.Conservative_2017_desc: "保守党 - 法律与公正是占主导地位的波兰民族保守党、基督教民主党，将经济干预主义和社会福利与社会保守主义观点相结合。它主张与欧盟谨慎合作，坚决反俄。"
 CZE.Conservative_desc: "（民粹主义） - 不满公民行动2011\n\n不满公民行动2011是一个以亿万富翁商人安德烈·巴比什为核心的民粹主义运动，他承诺像经营企业一样管理国家。该运动反对腐败和现有政党，主张提高政府效率、降低普通家庭的生活成本、提高养老金水平并加强对移民的控制。\n\n该运动组织严密，忠于其创始人，其灵活的意识形态使其能够同时吸引左翼和右翼选民。它对欧盟更深层次的一体化和欧元持怀疑态度。其影响力源于巴比什的商业帝国、他个人的超高人气以及在老年选民和小城镇选民中的强大基础。"
 HUN.Conservative_desc: "（反动主义） - 青年民主主义者联盟-匈牙利公民联盟是匈牙利占主导地位的民族保守主义政党，由维克托·欧尔班领导。它把强有力的国家、经济干预主义与慷慨的家庭补贴相结合，同时自称建立非自由民主体制，在移民问题上立场强硬，坚持主权优先政治。\n\n青民盟公开持疑欧立场，对西方自由主义制度持怀疑态度，同时与俄罗斯及其他非西方国家发展务实的联系。其优势在于议会中的绝对多数、对大部分媒体的控制，以及布达佩斯以外广泛保守选民的忠诚。"
 HUN.Neutral_conservatism_desc: "（反动主义） - 青年民主主义者联盟-匈牙利公民联盟是匈牙利占主导地位的民族保守主义政党，由维克托·欧尔班领导。它把强有力的国家、经济干预主义与慷慨的家庭补贴相结合，同时自称建立非自由民主体制，在移民问题上立场强硬，坚持主权优先政治。\n\n青民盟公开持疑欧立场，对西方自由主义制度持怀疑态度，同时与俄罗斯及其他非西方国家发展务实的联系。其优势在于议会中的绝对多数、对大部分媒体的控制，以及布达佩斯以外广泛保守选民的忠诚。"

