 CUB_alejandro_fernandez_hog_desc:0 "亚历杭德罗·希尔·费尔南德斯以政府首脑身份掌管经济，在短缺、补贴与外部压力之间维持平衡。"
 CUB_alvaro_miera_hog_desc:0 "阿尔瓦罗·洛佩斯·米耶拉统帅武装力量，这一机构保障党的内部秩序。"
 CUB_another_sixty_year_castro_idea_desc:0 "再一个六十年的卡斯特罗式延续：基层满意，军队悄然壮大。"
 CUB_another_sixty_year_reforms_idea_desc:0 "又一轮改革延长了革命的存续，微小的社会与经济收益为领导层换取时间。"
 CUB_another_sixty_year_true_revolution_idea_desc:0 "真正革命的再六十年：战争支持高昂，军事与社会稳步前进。"
 CUB_army_solves_everything_idea_desc:0 "军队接管公共行政，政治分量上升，而军事化统治令稳定受损。"
 CUB_chronic_emigration_crisis_idea_desc:0 "长期移民外流掏空岛屿的劳动力与社会基础，而国家拒绝改变路线。"
 CUB_crackdown_on_emigration_crisis_idea_desc:0 "收紧出境管制抑制人口外流，却加深社会不满并损害岛屿声誉。"
 CUB_cuba_black_era_idea_desc:0 "经济黑暗时代压低贸易、投资与生产率，民众只能忍受停滞。"
 CUB_cuba_golden_era_idea_desc:0 "旅游、贸易与侨汇的黄金时代提升了岛屿的生产率与生活水平。"
 CUB_cuba_not_golden_era_idea_desc:0 "缺乏深度的增长：贸易与投资依旧疲弱，岛屿境况仅稍有改善。"
 CUB_everything_under_control_idea_desc:0 "国家坚称一切尽在掌握，而监视与宣传机器让这一说法显得可信。"
 CUB_first_cracks_in_pcc_idea_desc:0 "党对合法性的垄断开始出现裂痕：支持率下降，意识形态漂移加快，领导层权威被削弱。"
 CUB_guerra_de_todo_el_pueblo_idea_desc:0 "全民战争把整座岛屿变成防御有机体，包含学说、工事与大规模征兵。"
 CUB_island_of_freedom_idea_desc:0 "古巴革命的官方叙事把这座岛屿描绘为自由而团结的人民，为国内带来稳定支持，并小幅推动社会发展。"
 CUB_island_of_freedom_under_pcc_idea_desc:0 "在共产党治下，这座岛屿被呈现为自由的；武装力量与政治干部则确保官方叙事得以维系。"
 CUB_manuel_cruz_hog_desc:0 "曼努埃尔·马雷罗·克鲁斯担任政府首脑，这位技术官僚的任务是在物资短缺与外部压力下维持行政运转。"
 CUB_mass_protests_idea_desc:0 "针对物资短缺与镇压的街头抗议令岛屿瘫痪，政治权力、稳定与领导层的控制能力都被削弱。"
 CUB_medium_emigration_crisis_idea_desc:0 "持续的人口外流侵蚀劳动力与岛屿信心，尽管国家仍在一定程度上控制着流量。"
 CUB_miguel_diaz_hog_desc:0 "米格尔·迪亚斯-卡内尔以总统身份领导国家，在党的正统与有限经济改革之间求取平衡。"
 CUB_new_revolution_idea_desc:0 "新一轮革命周期重新激活党的基层，提升战争支持，同时社会进步仍在缓慢积累。"
 CUB_no_dissidence_idea_desc:0 "异议被入罪、监控范围扩大，以一党统治的固化换取社会活力。"
 CUB_pcc_prevailed_idea_desc:0 "党战胜对手并巩固合法性，社会进步稳步推进。"
 CUB_pcc_still_peoples_party_idea_desc:0 "古巴共产党自我定位为人民意志的永久受托者，把合法性与政治方向集中于同一机构。"
 CUB_protests_destroyed_idea_desc:0 "抗议被武力粉碎：街头归于平静，合法性与稳定却受到损伤。"
 CUB_ramiro_menendez_hog_desc:0 "拉米罗·巴尔德斯·梅嫩德斯是革命年代的元老，体现着延续性与强硬的制度控制。"
 CUB_reformist_consolidation_idea_desc:0 "改革派在党政体系内巩固地位，稳定了岛屿局势，并带动社会与军事发展。"
 CUB_reliance_on_allies_idea_desc:0 "对外部庇护者的依赖使岛屿得以维持，却侵蚀自主性与燃料安全。"
 CUB_rethinking_revolution_idea_desc:0 "党内一股力量主张革命需要被重新思考而非简单重复，以务实与社会更新取代正统教条。"
 CUB_roberto_ojeda_hog_desc:0 "罗伯托·莫拉莱斯·奥赫达是资深党务组织者，任务是在经济困难中维系整个体系。"
 CUB_sixty_years_of_revolution_idea_desc:0 "六十年革命留下深刻烙印：党的基层依然忠诚、战争支持居高，尽管经济停滞。"
 CUB_us_embargo_idea_desc:0 "美国禁运扼制古巴贸易与投资，使生产率与生活水平长期低迷。"
 CUB_what_happens_in_pcc_idea_desc:0 "内部纷争在党内解决而从不公开，以决策迟缓为代价维持表面团结。"
 CUB_idea_blockade1:0 "封锁（El Bloqueo）对古巴禁运"
 CUB_idea_blockade1_desc:0 "1962年美国对古巴实施的禁运从未解除。苏联解体后其影响尤为严重，古巴几乎失去所有贸易伙伴。"
 CUB_idea_migration_crisis:0 "非法移民"
 CUB_idea_migration_crisis_desc:0 "非法移民已成为我国的重大问题。每天都有数百名专业人才为寻求更好生活而非法离境。完成“打击非法移民”国策可移除这一国家精神。"
 CUB_land_of_freedom_idea:0 "自由之岛"
