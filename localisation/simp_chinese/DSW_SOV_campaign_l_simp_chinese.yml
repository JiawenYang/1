l_simp_chinese:
 DSW_SOV_reassess_campaign:0 "总结特别军事行动"
 DSW_SOV_reassess_campaign_desc:0 "初期行动已经暴露了战区指挥、军工生产与后勤保障之间的脱节。普京决定以国家层面的整备替代临时修补，为持续作战建立可靠基础。"
 DSW_SOV_industrial_orders:0 "统一军工订单"
 DSW_SOV_industrial_orders_desc:0 "由联邦政府统筹跨部门订单，以多年合同稳定军工企业预期。普京要求各生产集团对交付数量与质量承担责任。"
 DSW_SOV_tankograd:0 "扩建坦克生产集群"
 DSW_SOV_tankograd_desc:0 "将维修、翻修与新车生产纳入统一安排。以乌拉尔制造业为骨架扩充产能，不再让零散采购拖延前线补充。"
 DSW_SOV_shell_contracts:0 "长期弹药合同"
 DSW_SOV_shell_contracts_desc:0 "建立弹药生产储备与长期采购制度，扩大火药、引信和炮弹配套产线。以持续供给支撑战区作战。"
 DSW_SOV_import_substitution:0 "关键设备替代"
 DSW_SOV_import_substitution_desc:0 "把主权化经济的目标落到机床、电子元件和工业软件上，以国家采购引导替代方案进入量产。"
 DSW_SOV_repair_centres:0 "前后方维修网络"
 DSW_SOV_repair_centres_desc:0 "把战区回收、铁路运输和工厂翻修连接起来。修复已有装备与制造新装备同样列入国家生产任务。"
 DSW_SOV_industrial_reserve:0 "形成军工产能储备"
 DSW_SOV_industrial_reserve_desc:0 "在满足当前订单之外保留设备、人力与原材料余量，确保下一阶段攻势不再依赖临时追加生产。"
 DSW_SOV_command_audit:0 "审查战区指挥链"
 DSW_SOV_command_audit_desc:0 "由总统主持战区总结，明确国防部、总参谋部与一线指挥部的职责，避免多头指挥与相互推诿。"
 DSW_SOV_rail_network:0 "修复南部铁路枢纽"
 DSW_SOV_rail_network_desc:0 "优先修复通向顿巴斯和南部战区的运输节点，并将军需运输与地方重建的时序协调起来。"
 DSW_SOV_depots:0 "纵深补给仓储"
 DSW_SOV_depots_desc:0 "把仓储分散到铁路后方，完善弹药、燃料与维修备件周转，减少单一节点受损后的连锁中断。"
 DSW_SOV_communications:0 "统一战术通信"
 DSW_SOV_communications_desc:0 "统一通信设备的采购与训练标准，为合成部队建立可靠的信息联络和目标上报体系。"
 DSW_SOV_medical_evacuation:0 "完善战地救护"
 DSW_SOV_medical_evacuation_desc:0 "把战地急救、后送和康复安置作为战区保障的一部分，配套扩充军医培训与医疗物资储备。"
 DSW_SOV_joint_staff:0 "战区联合保障体系"
 DSW_SOV_joint_staff_desc:0 "以总参谋部为中心，把运输、通信、工程与医疗保障编成可随作战计划同步运转的体系。"
 DSW_SOV_reserve_training:0 "系统训练预备役"
 DSW_SOV_reserve_training_desc:0 "用固定训练周期和补充计划代替临时征召，以现役教导力量帮助预备役形成完整建制。"
 DSW_SOV_officer_school:0 "扩充军官与军士培训"
 DSW_SOV_officer_school_desc:0 "把前线经验反馈到院校和训练基地，扩大基层指挥人才培养，使新编部队具备稳定的骨干。"
 DSW_SOV_drones:0 "无人机与电子对抗"
 DSW_SOV_drones_desc:0 "扩大侦察无人机与电子对抗器材采购，把相关人员训练纳入常规编制，而非继续依赖零散试用。"
 DSW_SOV_recon_fire:0 "侦察与火力协同"
 DSW_SOV_recon_fire_desc:0 "建立从目标发现、验证到火力支援的统一流程，让各兵种在同一作战意图下行动。"
 DSW_SOV_combined_arms:0 "重建合成作战能力"
 DSW_SOV_combined_arms_desc:0 "把装甲、步兵、工程与支援力量置于共同训练体系，以成熟建制承担突破与后续推进任务。"
 DSW_SOV_strategic_reserves:0 "完成战略预备队"
 DSW_SOV_strategic_reserves_desc:0 "完成补充、轮换与战备评估，在攻势开始之前形成可持续投入的第二梯队。"
 DSW_SOV_presidential_council:0 "总统主持整备会议"
 DSW_SOV_presidential_council_desc:0 "普京召集联邦政府、杜马与地方行政负责人，将战区需要纳入统一的国家整备计划。现有权力体系将承担执行责任。"
 DSW_SOV_budget:0 "编制多年整备预算"
 DSW_SOV_budget_desc:0 "把能源收入、国家储备与长期国债纳入统一财政安排，优先保障军工、运输和社会基本支出。"
 DSW_SOV_regional_projects:0 "推进地方产业项目"
 DSW_SOV_regional_projects_desc:0 "以联邦项目拉动乌拉尔、伏尔加与远东产业配套，增强地方就业和生产体系对外部冲击的承受力。"
 DSW_SOV_pensions:0 "保障家庭与退役人员"
 DSW_SOV_pensions_desc:0 "为服役家庭、伤残人员和退役军人提供稳定保障，以可兑现的社会政策维持国内支持。"
 DSW_SOV_energy_trade:0 "巩固能源与东方贸易"
 DSW_SOV_energy_trade_desc:0 "延续既有能源合作和对华贸易，以结算渠道与产业合作降低外部制裁对俄罗斯经济的冲击。"
 DSW_SOV_domestic_compact:0 "形成国家整备共识"
 DSW_SOV_domestic_compact_desc:0 "通过现有行政与议会渠道协调企业、地区和社会团体，将整备任务、生产目标与民生承诺落实到同一计划之中。"
 DSW_SOV_readiness_audit:0 "全军战备评估"
 DSW_SOV_readiness_audit_desc:0 "逐项检查生产交付、部队训练与保障准备，只有能够兑现的能力才写入下一阶段计划。"
 DSW_SOV_operational_reserves:0 "集中战役预备资源"
 DSW_SOV_operational_reserves_desc:0 "按统一计划配置预备队与运输资源，为重点方向保留足够的补充和轮换能力。"
 DSW_SOV_presidential_directive:0 "签署总统行动指令"
 DSW_SOV_presidential_directive_desc:0 "普京在听取战区与总参谋部汇报后批准新的作战安排，明确任务边界、阶段目标与保障责任。"
 DSW_SOV_final_preparation:0 "完成最终准备"
 DSW_SOV_final_preparation_desc:0 "各部门确认整备计划完成。新的攻势将在生产、训练与后勤同步到位后展开，而不再依赖仓促的临时部署。"
 DSW_SOV_final_offensive:0 "最终攻势"
 DSW_SOV_final_offensive_desc:0 "整备阶段已经结束。普京批准总参谋部提交的作战计划，解除战区的“未经计划的攻势”限制，以完成既定战争目标。"
 DSW_SOV_joint_rehearsal:0 "联合作战演练"
 DSW_SOV_joint_rehearsal_desc:0 "在攻势前实施跨兵种联合演练，验证指挥、通信、保障与预备队能够按同一计划运转。"
 DSW_SOV_postwar_settlement:0 "落实停战安排"
 DSW_SOV_postwar_settlement_desc:0 "第一次欧陆战争已经结束。联邦政府将以现有行政体系落实停战安排、恢复生产并安置战争受影响人员；新的世界大战不会由本路线触发。"
 DSW_SOV_veterans_return:0 "安置退役人员"
 DSW_SOV_veterans_return_desc:0 "第一次欧陆战争已经结束。联邦政府将以现有行政体系落实停战安排、恢复生产并安置战争受影响人员；新的世界大战不会由本路线触发。"
 DSW_SOV_restore_transport:0 "恢复交通运输"
 DSW_SOV_restore_transport_desc:0 "第一次欧陆战争已经结束。联邦政府将以现有行政体系落实停战安排、恢复生产并安置战争受影响人员；新的世界大战不会由本路线触发。"
 DSW_SOV_restore_industry:0 "恢复工业秩序"
 DSW_SOV_restore_industry_desc:0 "第一次欧陆战争已经结束。联邦政府将以现有行政体系落实停战安排、恢复生产并安置战争受影响人员；新的世界大战不会由本路线触发。"
 DSW_SOV_fiscal_recovery:0 "重整联邦财政"
 DSW_SOV_fiscal_recovery_desc:0 "第一次欧陆战争已经结束。联邦政府将以现有行政体系落实停战安排、恢复生产并安置战争受影响人员；新的世界大战不会由本路线触发。"
 DSW_SOV_peaceful_reconstruction:0 "转向和平重建"
 DSW_SOV_peaceful_reconstruction_desc:0 "第一次欧陆战争已经结束。联邦政府将以现有行政体系落实停战安排、恢复生产并安置战争受影响人员；新的世界大战不会由本路线触发。"
 DSW_SOV_recovery_choice:0 "接受治疗，康复后继续履行总统职责。"
 DSW_SOV_unplanned_offensive:0 "未经计划的攻势"
 DSW_SOV_unplanned_offensive_desc:0 "仓促行动暴露了指挥、补给与部队协同的不足。完成国家整备国策与最终攻势后，统一解除乌克兰战区的进攻限制。"
 DSW_SOV_preparation_bonus:0 "国家整备计划"
 DSW_SOV_campaign:0 "第一次欧陆战争"
 DSW_SOV_route_testing:0 "俄罗斯路线测试"
 DSW_SOV_test_campaign:0 "打开俄罗斯流程测试菜单"
 DSW_SOV_european_war_watch:0 "第一次欧陆战争态势"
 DSW_SOV_european_war_watch_desc:0 "击败爱沙尼亚、拉脱维亚、立陶宛、波兰、罗马尼亚和匈牙利六国可迫使北约停战。各国已投降、已不存在或已加入俄方阵营时视为目标达成。莫斯科、圣彼得堡或罗斯托夫真正被交战敌国占领才会判定俄方战败；每经过150天未分胜负，战争支持度下降。"
 DSW_SOV_ukrainian_resistance:0 "乌克兰战时抵抗"
 DSW_SOV_final_offensive_spirit:0 "最终攻势"
 DSW_SOV_victory_settlement:0 "欧陆战争胜利"
 DSW_SOV_reconstruction_burden:0 "战后重建负担"
 dsw_sov.1.t:0 "俄罗斯迈入 2020 年"
 dsw_sov.1.d:0 "新的十年开始了。普京继续担任俄罗斯总统，政府将面对疫情、经济压力和愈加紧张的对外关系。"
 dsw_sov.3.t:0 "总统康复"
 dsw_sov.3.d:0 "经过集中治疗与休养，医疗团队确认普京已从新冠感染中康复。他恢复主持政府会议，并重申将继续履行总统职责。"
 dsw_sov.10.t:0 "特别军事行动开始"
 dsw_sov.10.d:0 "总统批准的行动指令正式生效。俄罗斯军队与顿巴斯盟友进入对乌战争，集安组织开始协调共同作战。"
 dsw_sov.20.t:0 "攻势需要重新规划"
 dsw_sov.20.d:0 "初期推进已经暴露了准备不足。总参谋部建议暂缓继续扩大攻势，将军工、后勤与部队建设纳入长期整备计划。普京决定亲自主持这一进程。"
 dsw_sov.30.t:0 "最终攻势"
 dsw_sov.30.d:0 "为期约三年的整备已经完成。联合作战指挥部确认预备队、军工生产与补给体系已经就绪，战区的进攻限制现予解除。"
 dsw_sov.40.t:0 "第一次欧陆战争"
 dsw_sov.40.d:0 "乌克兰在败局迫近之际正式加入北约。北约成员开始参战，原本的地区战争扩大为俄罗斯与北约之间的第一次欧陆战争。"
 dsw_sov.51.t:0 "欧陆停战：俄方胜利"
 dsw_sov.51.d:0 "波罗的海三国、波兰、罗马尼亚和匈牙利的失败迫使北约接受停战。波罗的海三国、波兰与乌克兰纳入俄方附庸体系，罗马尼亚和匈牙利转向亲俄政府，东欧战败国进入集安组织。法国将面对战败后的政治抉择。"
 dsw_sov.52.t:0 "欧陆停战：俄方战败"
 dsw_sov.52.d:0 "俄罗斯关键地区失守，联邦政府接受停战并转入战后重建。法国将按北约胜利后的局势开启新的政治进程。"
 dsw_sov.90.t:0 "俄罗斯流程测试"
 dsw_sov.90.d:0 "请在独立测试存档中使用。以下入口调用正常流程的同一套效果，不会清除已经发生的互斥事件或战争结果。"
 dsw_sov.ok:0 "明白。"
 dsw_sov.cancel:0 "返回。"
 dsw_sov.3.a:0 "继续履行总统职责。"
 dsw_sov.20.a:0 "开始国家整备计划。"
 dsw_sov.30.a:0 "批准执行。"
 dsw_sov.test_war:0 "测试：开始对乌战争"
 dsw_sov.test_stalemate:0 "测试：战线停滞并切换国策"
 dsw_sov.test_final:0 "测试：解除限制并发动最终攻势"
 dsw_sov.test_nato:0 "测试：乌克兰加入北约"
 dsw_sov.test_victory:0 "测试：俄方胜利并接法国战败线"
 dsw_sov.test_defeat:0 "测试：俄方战败并接法国胜利线"
