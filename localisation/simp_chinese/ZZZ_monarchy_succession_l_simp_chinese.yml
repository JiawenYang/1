l_simp_chinese:
 ZZZ_nm_charles_iii:0 "查尔斯三世"
 ZZZ_nm_naruhito:0 "德仁"
 ZZZ_nm_frederik_x:0 "腓特烈十世"
 ZZZ_nm_lux_guillaume:0 "纪尧姆"
 ZZZ_nm_may_abdullah:0 "彭亨的阿卜杜拉"
 ZZZ_nm_may_ibrahim:0 "易卜拉欣·依斯干达"

 ZZZ_succession.10.t:0 "伊丽莎白二世女王逝世"
 ZZZ_succession.10.d:0 "白金汉宫宣布，伊丽莎白二世女王在巴尔莫勒尔堡逝世。王位即刻由查尔斯三世继承。[ROOT.GetName]的国家元首随王权更替。"
 ZZZ_succession.10.a:0 "女王已逝，国王万岁。"

 ZZZ_succession.11.t:0 "明仁天皇退位"
 ZZZ_succession.11.d:0 "明仁天皇正式退位，这是两个世纪以来日本天皇首次生前让位。德仁即位，成为第126代天皇。"
 ZZZ_succession.11.a:0 "天皇陛下万岁。"

 ZZZ_succession.12.t:0 "玛格丽特二世女王退位"
 ZZZ_succession.12.d:0 "在位52年后，玛格丽特二世女王正式退位。王储腓特烈即位，成为腓特烈十世。"
 ZZZ_succession.12.a:0 "腓特烈十世国王万岁。"

 ZZZ_succession.13.t:0 "大公亨利退位"
 ZZZ_succession.13.d:0 "大公亨利让位于其子纪尧姆，纪尧姆成为卢森堡大公。"
 ZZZ_succession.13.a:0 "大公万岁！"

 ZZZ_succession.14.t:0 "最高元首退位"
 ZZZ_succession.14.d:0 "吉兰丹苏丹穆罕默德五世退位。统治者会议推选彭亨苏丹阿卜杜拉为新任最高元首。"
 ZZZ_succession.14.a:0 "吾王万岁。"

 ZZZ_succession.15.t:0 "新任最高元首登基"
 ZZZ_succession.15.d:0 "柔佛苏丹易卜拉欣·依斯干达登基，成为第17任最高元首。"
 ZZZ_succession.15.a:0 "吾王万岁。"

 ZZZ_succession.16.t:0 "科威特埃米尔逝世"
 ZZZ_succession.16.d:0 "埃米尔萨巴赫·艾哈迈德·贾比尔·萨巴赫逝世，享年91岁。王储纳瓦夫宣誓就任埃米尔。"
 ZZZ_succession.16.a:0 "愿真主怜悯他。"

 ZZZ_succession.17.t:0 "科威特埃米尔纳瓦夫逝世"
 ZZZ_succession.17.d:0 "埃米尔纳瓦夫·艾哈迈德·贾比尔·萨巴赫逝世。谢赫米沙勒宣誓就任埃米尔。"
 ZZZ_succession.17.a:0 "愿真主怜悯他。"

 ZZZ_succession.18.t:0 "阿曼苏丹卡布斯逝世"
 ZZZ_succession.18.d:0 "苏丹卡布斯·本·赛义德逝世，在位50年。海赛姆·本·塔里克宣誓就任苏丹。"
 ZZZ_succession.18.a:0 "愿真主怜悯他。"

 ZZZ_succession.19.t:0 "巴巴多斯成为共和国"
 ZZZ_succession.19.d:0 "巴巴多斯取消伊丽莎白二世女王的国家元首地位，改制为共和国。巴巴多斯君主制被废除。"
 ZZZ_succession.19.a:0 "新的篇章开始了。"
