 KOR_korean_education: "为上大学而教育"
 KOR_korean_education_desc: "[Root.GetName]社会最显著的特征莫过于其对教育的热情。[Root.GetName]实行至中学的义务教育；高中虽为非义务教育，但政府为每位学生提供免学费教育支持。因此，[Root.GetName]学生得以免学费完成全部中等教育。然而，在一个大学入学率接近百分之七十的社会里，上大学早已被视为一种必需而非选择。因此，公共教育因过分专注于'为大学入学而教育'而面临批评。"
