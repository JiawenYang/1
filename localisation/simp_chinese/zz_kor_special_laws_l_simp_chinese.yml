l_simp_chinese:
 KOR_safety_law: "隐性剥削"
 KOR_safety_law_desc: "韩国的经济增长是奇迹般的，但这个奇迹也有其阴影。\n法律上，工人的权利应得到保障，但在农村地区最低工资往往只是名义上的，工作时间持续位居经合组织国家前列，而像“综合工资协议”这样的制度使得工人难以获得公平的加班补偿。\n因此，韩国正在发生对工人的“隐性剥削”。\n\n- 遵守《劳动基准法》！（全泰壹）"
 KOR_police_law: "《国家安全法》"
 KOR_police_law_desc: "本法旨在通过规制危害国家安全的反国家行为，以保障国家安全及国民的生存与自由。\n\n任何人，明知其行为会危害国家的存在、安全或自由民主基本秩序，而赞扬、煽动或宣传反国家组织、其成员或其指示下的活动，或宣传、煽动国家混乱者，将被处以最高7年监禁"
 KOR_korean_welfare: "综合社会保障体系"
 KOR_korean_welfare_desc: "[Root.GetName]的社会保障体系由三大支柱构成：社会保险、公共救助和社会服务。为保护国民免受基本生计风险，国家健康保险、国家养老金、雇佣保险和工伤保险均为强制参保。国家基础生活保障制度为难以维持生计的低收入家庭保障最低生活标准，同时国家也为其他弱势群体提供多种形式的支持。[Root.GetName]的社会保障体系一直在稳步发展，但其安全网仍存在盲区，无法充分推进每一位公民的福利事业。"
