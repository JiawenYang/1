 KOR_equal_female: "男女平等"
 KOR_equal_female_desc: "[Root.GetName]的宪法与法律明确保障男女平等，女性在受教育程度与劳动参与上表现突出。然而在现实中，性别薪酬差距仍长期处于发达经济体前列，女性因育儿与家务负担而难以进入高层职位，生育率亦持续走低。纸面上的平等，并未自动带来实质上的平等。"
