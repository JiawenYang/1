 KOR_korean_immigration: "难以获得公民身份"
 KOR_korean_immigration_desc: "[Root.GetName]人口的绝大多数属于同一族群，由此形成了根植于共同祖先与历史意识的强烈民族主义情感。希望移民的外国人不仅要通过极其严苛的入籍考试，还必须承受排外的社会眼光。"
