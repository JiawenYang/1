l_simp_chinese:
 ZZZ_europe_war:0 "欧陆战争"
 ZZZ_eur_escalate:0 "把战事推向大陆"
 ZZZ_eur_escalate_desc:0 "乌克兰战线已僵持成整个欧洲的问题。命令西部各军区进入全面战备，把行动推进到旧苏联边界之外。"
 zzz_eur.1.t:0 "大陆的引信"
 zzz_eur.1.d:0 "一场围绕乌克兰的战争越过了旧的分界线。纵队正在维斯瓦河以西推进，波罗的海上空的航线已经关闭，每一个欧洲首都都在被问到同一个问题：1991 年的安排是否还算数。欧陆战争已经开始，没有人能保证它停留在常规层面。"
 zzz_eur.1.a:0 "欧洲再次站在悬崖边。"
 zzz_eur.2.t:0 "东线的退潮"
 zzz_eur.2.d:0 "俄方的推进已经崩溃。爱沙尼亚、拉脱维亚与立陶宛的部队在旧边界上重新站定，波兰的行政机构回到维斯瓦河流域，乌克兰政府回到自己的首都。战争在九十年代初那张地图所说的位置停下，而东方问题被留了下来，并没有被解决。"
 zzz_eur.2.a:0 "东方集团退回旧边界。"
 zzz_eur.3.t:0 "从维斯瓦河到波罗的海"
 zzz_eur.3.d:0 "西方联盟已经破裂。波罗的海三国的内阁被换成听命于莫斯科的政府，波兰与乌克兰被降为依附国家，俄罗斯的旗帜插到了波罗的海沿岸的通道上。大陆的秩序正按莫斯科的刻度重划，而这次停火只是争论的间歇。"
 zzz_eur.3.a:0 "大陆的秩序按莫斯科的刻度重划。"
 zzz_eur.4.t:0 "没有胜者的停火"
 zzz_eur.4.d:0 "哪一方都无法逼出决定。战线不再移动，仓库已经见底，双方沿各自实际控制的位置接受了停火。没有一条边界改变，也没有一届政府倒台；战争就这样停下，而它为之而战的问题被交给了下一代。"
 zzz_eur.4.a:0 "战线停在原地。"
