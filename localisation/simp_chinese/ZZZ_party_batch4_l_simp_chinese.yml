l_simp_chinese:
 zzz_party.140.t:0 "波哥大的左翼转向"
 zzz_party.140.d:0 "佩特罗在 2022 年大选中胜出并就任总统，哥伦比亚首次由左翼执政，和平协议与土地改革被提上日程。"
 zzz_party.140.a:0 "接受这一结果"
 zzz_party.142.t:0 "赫尔辛基的社会民主党政府"
 zzz_party.142.d:0 "社会民主党主导的五党联合政府在赫尔辛基就职，芬兰的福利国家路线得以延续。"
 zzz_party.142.a:0 "接受这一结果"
 zzz_party.143.t:0 "赫尔辛基的右翼转向"
 zzz_party.143.d:0 "民族联合党在 2023 年大选后主导组阁，芬兰的财政与安全政策转向更保守的路线。"
 zzz_party.143.a:0 "接受这一结果"
 zzz_party.144.t:0 "雅典的新民主党政府"
 zzz_party.144.d:0 "新民主党在提前大选中胜出，米佐塔基斯出任总理，希腊走出债务危机的紧缩周期。"
 zzz_party.144.a:0 "接受这一结果"
 zzz_party.145.t:0 "雷克雅未克的社会民主联盟"
 zzz_party.145.d:0 "社会民主联盟主导的新政府在雷克雅未克就职，冰岛的福利与气候政策向左调整。"
 zzz_party.145.a:0 "接受这一结果"
 zzz_party.146.t:0 "都柏林的联合政府"
 zzz_party.146.d:0 "共和党与统一党首次组成联合政府，爱尔兰的传统两大党格局出现松动。"
 zzz_party.146.a:0 "接受这一结果"
 zzz_party.147.t:0 "耶路撒冷的轮替政府"
 zzz_party.147.d:0 "反内塔尼亚胡的跨党派联合政府就职，以色列政坛出现罕见的中间派组合。"
 zzz_party.147.a:0 "接受这一结果"
 zzz_party.148.t:0 "耶路撒冷的右翼回潮"
 zzz_party.148.d:0 "内塔尼亚胡领导的右翼联盟在 2022 年大选后重新组阁，以色列政策重心转向安全与定居点议题。"
 zzz_party.148.a:0 "接受这一结果"
 zzz_party.149.t:0 "墨西哥城的左翼政府"
 zzz_party.149.d:0 "洛佩斯·奥夫拉多尔在 2018 年大选中胜出，墨西哥首次由左翼政党执政，能源与扶贫政策转向国家主导。"
 zzz_party.149.a:0 "接受这一结果"
 zzz_party.151.t:0 "加德满都的红色旗帜"
 zzz_party.151.d:0 "尼泊尔共产党（联合马列）在 2017 年大选中胜出，奥利出任总理，尼泊尔转向左翼共和路线。"
 zzz_party.151.a:0 "接受这一结果"
 zzz_party.152.t:0 "加德满都的议会转向"
 zzz_party.152.d:0 "尼泊尔大会党主导的新政府在 2021 年就职，尼泊尔的政治重心回到中间派议会政治。"
 zzz_party.152.a:0 "接受这一结果"
 zzz_party.155.t:0 "布加勒斯特的自由党政府"
 zzz_party.155.d:0 "国家自由党主导的政府在 2019 年就职，罗马尼亚的亲欧路线得到巩固。"
 zzz_party.155.a:0 "接受这一结果"
 zzz_party.157.t:0 "布拉迪斯拉发的反腐浪潮"
 zzz_party.157.d:0 "普通人党在 2020 年大选后主导组阁，斯洛伐克的反腐与亲欧路线取代了此前的方向党政府。"
 zzz_party.157.a:0 "接受这一结果"
 zzz_party.158.t:0 "布拉迪斯拉发的方向党回归"
 zzz_party.158.d:0 "方向党在 2023 年大选后重新执政，斯洛伐克的外交与媒体政策出现明显转向。"
 zzz_party.158.a:0 "接受这一结果"
 zzz_party.159.t:0 "马德里的社会党政府"
 zzz_party.159.d:0 "桑切斯领导的社会党在 2018 年通过不信任动议上台，西班牙的政治重心向左移动。"
 zzz_party.159.a:0 "接受这一结果"
 zzz_party.160.t:0 "喀土穆的军人接管"
 zzz_party.160.d:0 "巴希尔政权在抗议浪潮中倒台，过渡军事委员会接管政权，苏丹进入军人与文官博弈的过渡期。"
 zzz_party.160.a:0 "接受这一结果"
 zzz_party.162.t:0 "巴格达的过渡政府"
 zzz_party.162.d:0 "阿卜杜勒-迈赫迪在 2018 年组阁，伊拉克的教派配额体制在抗议与重建压力下继续运转。"
 zzz_party.162.a:0 "接受这一结果"
 zzz_party.163.t:0 "圣地亚哥的左翼政府"
 zzz_party.163.d:0 "博里奇在 2021 年大选中胜出，智利首次由左翼联盟执政，宪制改革与社会议程被提上日程。"
 zzz_party.163.a:0 "接受这一结果"
