 systems.1.t: "欢迎来到千禧黎明"
 systems.1.d: "欢迎来到千禧黎明！感谢您下载并游玩本模组。如果您是新手，我们建议您浏览各个菜单以熟悉各项功能。菜单通常可通过各界面顶部的按钮打开。需要帮助？欢迎加入我们的Discord社区，我们很乐意解答您的问题。您可以在游戏内暂停菜单中使用"反馈问题"按钮，或通过Discord频道反馈bug。\n\n重要信息：\n- 由于发电站和人口消耗，游戏开始时燃油为负数。请查看建造菜单中的能源界面了解详情。\n- 历史国策不等于历史结局。我们使用历史国策选项来促使AI在可选方案中做出最符合历史的选择，但不保证游戏进程符合史实。"
 systems.1.a: "好。"
