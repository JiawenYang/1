 sov_russian_legacy_army:0 "旧俄军改革的遗产"
 sov_russian_legacy_army_desc:0 "庞大的动员体制和集中指挥的残余——重工业产能充沛但军事效能低下：损耗大、补给脆弱、指挥链迟滞。"
 sov_russian_legacy_navy:0 "旧俄军改革的遗产"
 sov_russian_legacy_navy_desc:0 "残破的港口设施与老旧的潜艇舰队并存，维修缓慢但水下破交传统犹存。"
 sov_russian_legacy_air:0 "旧俄军改革的遗产"
 sov_russian_legacy_air_desc:0 "训练体系陈旧、王牌飞行员稀少，但体制化的经验传承使得损失后经验不至于完全流失。"

 sov_rf_air_academy:0 "空天军院校体系"
 sov_rf_air_academy_desc:0 "以莫斯科茹科夫斯基空军工程学院为核心的空天军院校体系，为远程航空兵与防空兵种持续输送技术军官；训练规模有限，但人才储备稳定，足以维持一支现代化空中力量的骨干。\n\n§Y效果：§! 空军训练经验 +10%，王牌飞行员生成概率 +5%，空军指挥经验 +5%。"
