 FRA_Alexis_Corbiere_IntelM_desc:0 "亚历克西斯·科比埃，生于1968年8月17日，法国政治家，左翼政党不屈法国成员。他自2017年起，代表塞纳-圣但尼省第七选区担任国民议会议员。科比埃以进步且反体制的观点闻名，积极倡导社会公正、工人权益及环境可持续性，直言批评新自由主义政策，并积极参与各类社会运动。他在不屈法国内党占据重要地位，是该党政治纲领的重要塑造者之一。"
