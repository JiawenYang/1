 FRA_Stephane_Ravier_IM_desc:0 "斯特凡纳·拉维耶，生于1967年6月15日，法国政治家，保守派政党国民联盟成员。他自2014年起担任马赛第七区区长，2017年则成为参议院议员，代表罗讷河口省。拉维耶因其保守和民族主义立场而广受关注，他主张采取更为严格的移民政策，维护法律与秩序，并致力于保护法国的文化身份。他在国民联盟内部占据重要地位，同时也一直直言不讳地批评主流政党。拉维耶的政治生涯亮点包括他致力于解决马赛面临的种种问题，如犯罪和城市衰败，以及他对国民联盟领导人玛丽娜·勒庞的坚定支持。"
