 FAF_the_puppeteers_of_DAY_X_decision:0 "“X日”的真正傀儡师"
 FAF_the_puppeteers_of_DAY_X_decision_desc:0 "反民族主义思潮近几十年来在德国方兴未艾，结果他们却只因败给了俄国人一次便一扭头成了法西斯国家？我们是为我们的政府而战，在为驱逐共党分子而战！而德国人却只是给这一切加了层施特拉瑟主义-共产主义的皮，当德国人购入枪支、进行借贷时，谁是真正的得益者我们已是心知肚明……"
 FAF_the_rising_flame_idea:0 "旋焰高升"
 FAF_the_roman_way_decision:0 "罗马之道"
 FAF_the_roman_way_decision_desc:0 "当人们谈及罗马，多数人会称颂它曾是庞大而强盛的帝国，但却少有人能真正道出其伟大的本质。任何平庸之国皆可建立帝国，然而，罗马之所以卓然不群，正是因其意志之坚定——在血与泥的锤炼中铸就不朽。作为罗马的正统继承者，我们的使命便是重建那被岁月掩埋、被战火摧毁、被历史遗忘的辉煌。罗马之鹰将再度翱翔欧洲，从伊比利亚至意大利，其鸣响彻欧陆长空。"
