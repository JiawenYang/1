 FRA_France_First:0 "法兰西优先"
 FRA_France_First_desc:0 "北约与欧盟固然是重要机制，但世间没有任何事物应当，也永远不会凌驾于祖国利益之上。法兰西绝不能屈从于国际资本秩序，法国企业在本土竞争中绝不容许败给外资。我军已是欧洲最强大的武装力量，但这远远不够，我们必将实现战略扩张。法兰西的钢铁洪流与经济命脉将同步壮大。欧洲不应再指望法国的财政纾困或军事装备输出，就让德国去外国兜售坦克吧，我们会保留并翻倍生产勒克莱尔主战坦克。法兰西必须在经济、军事与国民意志三大维度完成战略优先部署。若我们未做好万全准备，整个欧洲必陷危局。当此狂野美洲秩序崩塌之际，我们当仁不让，要肩负起文明牧羊人的历史使命。"
