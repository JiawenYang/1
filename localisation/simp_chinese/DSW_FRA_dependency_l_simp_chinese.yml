 FAF_enforce_imperial_language_decree_decision:0 "帝国语言敕令"
 FAF_enforce_imperial_language_decree_decision_desc:0 "意大利语、西班牙语、法语——三种迥异的语言，却共生于同一根源：拉丁语。这位众语之母，如今几被她的子嗣遗忘与抛弃。若无统一之语，我们的罗马将沦为巴别塔——一座由混乱与疯狂堆砌的空壳。如今，拉丁语将再度成为文明之舌，血脉相连的兄弟之音，罗马之声。"
