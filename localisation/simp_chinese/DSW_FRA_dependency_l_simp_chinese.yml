 ENG_old_entente_reaffirmed_tt:0 "§Y这将使我们与[FAF.GetFlag]§3法国§!结成防御联盟§!，§Y共同抵御未来[GER.GetFlag]§!§R德国的侵略§!。"
 Euro_Collapse_idea:0 "经济崩溃"
 Euro_Collapse_idea_desc:0 "法国经济的衰退已成必然。巨额战争赔款与整整一代公民因战争而殒落，这个国家因此陷入了深渊，而复苏之路无疑漫长而艰难。尽管法兰西处境黯淡，但我们的人民必将如同过往无数次那样，最终跨越这场危机。"
 FAF_Academic_Latinization_decision:0 "拉丁化学术"
 FAF_Academic_Latinization_decision_desc:0 "尽管我们可以宣称“为了欧洲的利益，人民必须学习拉丁语”，并认为他们会履行爱国义务，但在当前教育状况下，这一过程恐将困难重重。除了语言学习，教授拉丁语的课程并非必修，且课程设置以地区语言为主，导致人们缺乏深入学习拉丁语的动力。对此，大规模的学术改革势在必行；我们将召集最优秀的拉丁语学者，协助制定新课程，确保拉丁语得到全面教授并被人民所使用。而最重要的是，鉴于青年是我们的未来，那么这一体系意味着可能只需几十年，拉丁语就会再次在欧洲普及！"
