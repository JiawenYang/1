 FRA_Younous_Omarjee:0 "尤努斯·奥马尔吉"
 FRA_Younous_Omarjee_desc:0 "尤努斯·奥马尔吉，生于1969年10月14日，法国政治家，自2009年起担任欧洲议会议员。他既是左翼政党不屈法国成员，也隶属于欧洲联合左翼/北欧绿色左翼议会党团。奥马尔吉因秉持进步和欧洲一体化的观点而广受认可，他积极倡导社会公正、工人权益及环境可持续性。在推动有利于工人和边缘化群体的欧盟政策方面，他发挥了积极作用。奥马尔吉在不屈法国党内占据重要地位，并深度参与了该党在欧洲问题上的政策制定工作。"
