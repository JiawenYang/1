 FAF_balancing_militarism_and_democracy_tt:0 "§C发动内战的军政府虽将就此退出历史舞台，但其影响力仍深植于法国社会之中§!"
 FAF_ban_on_socialists_lifted_tooltip:0 "所有社会主义党派，包括共产党在内，都将被§G取缔§!！"
 FAF_bastille_tt:0 "对凡尔登主要指挥中心和军火库的围攻情况将会汇报给我们。"
 FAF_betrayal_tt:0 "§Y如果[ENG.GetFlag]§!§C英国§!§G接受§!§Y，他们将跟随我们加入任何为抵抗[GER.GetFlag]§!§R德国侵略§!结成的同盟"
 FAF_brick_by_brick1_idea:0 "一砖一瓦"
 FAF_brick_by_brick1_idea_desc:0 "我们的国家是用我们的汗水、人民的鲜血和几代人的牺牲所建立起来的。在俄欧战争中惨遭失败后，我国如今已满目疮痍：家园化为废墟，工厂夷为平地；全国的不满情绪日益增长，分离主义运动一天天扩大。我们必须重拾国家失去的荣耀与尊严，一块一块、一砖一瓦地将法国从当前的困境中解救出来，重回繁荣。"
 FAF_brick_by_brick2_idea:0 "一砖一瓦"
 FAF_brick_by_brick2_idea_desc:0 "我们的国家是用我们的汗水、人民的鲜血和几代人的牺牲所建立起来的。在俄欧战争中惨遭失败后，我国如今已满目疮痍：家园化为废墟，工厂夷为平地；全国的不满情绪日益增长，分离主义运动一天天扩大。我们必须重拾国家失去的荣耀与尊严，一块一块、一砖一瓦地将法国从当前的困境中解救出来，重回繁荣。"
 FAF_brick_by_brick3_idea:0 "一砖一瓦"
 FAF_brick_by_brick3_idea_desc:0 "我们的国家是用我们的汗水、人民的鲜血和几代人的牺牲所建立起来的。在俄欧战争中惨遭失败后，我国如今已满目疮痍：家园化为废墟，工厂夷为平地；全国的不满情绪日益增长，分离主义运动一天天扩大。我们必须重拾国家失去的荣耀与尊严，一块一块、一砖一瓦地将法国从当前的困境中解救出来，重回繁荣。"
 FAF_brick_by_brick4_idea:0 "新法国"
 FAF_brick_by_brick4_idea_desc:0 "法兰西历经一砖一瓦的精心构筑，终成我们夙愿多年的理想国度。如今的法兰西傲然屹立，成为浴火重生的新国度。这座历经淬炼的国度，必将以磐石之姿直面未来风雨。"
 FAF_brick_by_brick5_idea:0 "新法国"
 FAF_brick_by_brick5_idea_desc:0 "法兰西历经一砖一瓦的精心构筑，终成我们夙愿多年的理想国度。如今的法兰西傲然屹立，成为浴火重生的新国度。这座历经淬炼的国度，必将以磐石之姿直面未来风雨。"
 FAF_brick_by_brick_idea:0 "一砖一瓦"
 FAF_brick_by_brick_idea_desc:0 "我们的国家是用我们的汗水、人民的鲜血和几代人的牺牲所建立起来的。在俄欧战争中惨遭失败后，我国如今已满目疮痍：家园化为废墟，工厂夷为平地；全国的不满情绪日益增长，分离主义运动一天天扩大。我们必须重拾国家失去的荣耀与尊严，一块一块、一砖一瓦地将法国从当前的困境中解救出来，重回繁荣。"
 FAF_building_an_empire_idea:0 "建立帝国"
 FAF_building_an_empire_idea_desc:0 "建立一个帝国需要时间，既要为征服做好准备，也要根除征服中残留的所有怨恨。正如那句常被重复的话所说：“罗马不是一天建成的”，法兰西帝国也不会如此。只有当国家真正拥有稳定，拥有繁荣，成为神圣与永恒的国度之后，才能真正宣称我们的帝国已经建成。若国之根基不稳，则便会一无所成。"
 FAF_burgeoning_middle_class_idea:0 "新兴中产阶级"
 FAF_burgeoning_middle_class_idea_desc:0 ""
 FAF_celebrate_our_victories_decision:0 "奖赏胜者"
 FAF_celebrate_our_victories_decision_desc:0 "奋斗过程如何艰辛都无从轻重，唯结果方为圭臬。万事终局无非成王败寇，非胜即负，非赢即输。胜者当赏以激众人竞效，功绩至上，方是至理。"
 FAF_champion_idealistic_victory_decision:0 "为胜利斗争"
 FAF_champion_idealistic_victory_decision_desc:0 ""
 FAF_chose_fachies_tt:0 "§n赋予法西斯主义者和认同主义者权力§!"
 FAF_chose_no_fachies_tt:0 "§P这会巩固军队的权力§!"
 FAF_clarity_in_liberty_decision:0 "自由的明晰"
 FAF_clarity_in_liberty_decision_desc:0 "有人断言，我们的运动因植根于右翼，便意味着唯有追求极权专制，终将引发无尽的苦难。确实，在我们的阵营中，不乏有人视此种体制为最优之选，但事实上，“自由”这一理念绝非与我们绝缘，我们完全可以借助它，来吸引那些怀念往昔自由民主时光的人们。当然，这种自由并不包含过往那种进步主义的荒诞与对少数群体的盲目崇拜，那些恰恰是新自由主义秩序崩溃前的乱象。至于那些曾因旧自由而受益的人，他们必然会有所不满，但我们的目的，本就是要将他们逐出这片大陆……不是吗？"
 FAF_communist_crackdown:0 "镇压共产主义"
 FAF_communist_crackdown_desc:0 "一个幽灵再次在欧洲游荡。当腐败的共和国在其重压下崩溃时，那些隐藏在自由主义文明面具下的马克思主义鼠辈企图摧毁我们挚爱的法兰西。所幸，我们赢得了内战，有了镇压这些势力的能力。若我们失败，天知道我们的运动一旦受挫，欧洲将面临何等命运。"
 FAF_concessions_to_the_military_decision:0 "向军方让步"
 FAF_concessions_to_the_military_decision_desc:0 ""
 FAF_continental_system_idea:0 "大陆体系"
 FAF_convene_latin_congress_decision:0 "召集拉丁大会"
 FAF_convene_latin_congress_decision_desc:0 "我们的国家属于全体伟大的拉丁民族。为确保新生的伟大帝国不会被单一民族（例如法国）所主导，必须保证帝国境内每个拉丁兄弟都享有代表权。为此，我们将召开盛大的拉丁民族代表大会，让所有拉丁同胞获得公平的政治席位。"
 FAF_coordinate_logistics_decision:0 "协调后勤工作"
 FAF_crack_down_on_corruption_decision:0 "打击腐败"
 FAF_crack_down_on_corruption_decision_desc:0 ""
 FAF_create_bourbon_restoration_luxembourg_decision:0 "恢复低地主权"
 FAF_create_bourbon_restoration_portugal_decision:0 "恢复葡萄牙主权"
 FAF_criox_de_fau_better_idea:0 "火十字团"
 FAF_criox_de_fau_better_idea_desc:0 "当法西斯主义思潮于两次世界大战期间在意大利萌发时，法兰西境内多个团体迅速吸纳了这一意识形态并将其本土化；其中，拉罗克领导下的火十字团展现出了最为卓越的组织效能。火十字团成功凝聚起了爱国者与战士的力量。尽管部分公民仍对他们怀有怨恨，但在当今时代，法国比任何时候都更需要民族共识与爱国热忱。"
 FAF_criox_de_fau_idea:0 "火十字团"
 FAF_criox_de_fau_idea_desc:0 "当法西斯主义思潮于两次世界大战期间在意大利萌发时，法兰西境内多个团体迅速吸纳了这一意识形态并将其本土化；其中，拉罗克领导下的火十字团展现出了最为卓越的组织效能。火十字团成功凝聚起了爱国者与战士的力量。尽管部分公民仍对他们怀有怨恨，但在当今时代，法国比任何时候都更需要民族共识与爱国热忱。"
 FAF_culmination_of_degaulle_petainist_thought_decision:0 "接纳戴高乐-贝当主义思想"
 FAF_culmination_of_degaulle_petainist_thought_decision_desc:0 "戴高乐与贝当皆是历史中不可忽视的人物，他们身上所坚守的原则，曾让他们在法国历史最黑暗的时刻熠熠生辉。然而，动荡的时代往往加剧国家的分裂。若我们仅拥护一方，那么另一方的支持者势必会掀起动荡。唯有接受双方的理念，才能真正弥合裂痕，让国家重回团结。"
