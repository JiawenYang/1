 FAF_use_wealthy_connections_decision:0 "利用丰富人脉"
 FAF_use_wealthy_connections_decision_desc:0 "同法国精英的人脉关系为我们提供了一项得天独厚的优势，可以借此推进国家项目。虽然需要欠贵族个人情，但能够在一定时间内扩大生产，这算得上一笔不错的买卖。"
 FAF_wiped_the_slate_of_opposition_tt:0 "该国已清洗§R拉法耶特反对派§!"
 FAF_word_of_the_bishop_decision:0 "主教的言语"
 FAF_word_of_the_bishop_decision_desc:0 "纵观欧洲历史，教皇一直将我们的人民和统治者玩弄于股掌之间。他们以基督教信仰为隐形武器，将欧洲塑造成其昔日形象的扭曲版本。我们不会再为一个虚构的神明流血牺牲，教皇将成为我们的唱诗班男孩，为我们高唱赞歌。"
 FAF_work_f_decision:0 "劳动！"
 FAF_work_f_decision_desc:0 "劳动是世间的头等大事，也只有它总能带来积极的成果。砖块不会自己垒起来，道路不会自己铺好，庄稼更不会自己生长。只有借助我们人民的血汗，这个曾经辉煌的国家才能得以重建。"
 FAF_work_v_decision:0 "劳动！"
 FAF_work_v_decision_desc:0 "俄国的铁蹄践踏过我们的国土，留下一片断壁残垣，焦土遍野。我们的家园在他们的残暴下崩塌，文明的辉煌化作尘埃，而今，重建的使命仍横亘在我们面前。我们的民族精神尚未振作，人民仍在等待温饱。如今，比以往任何时候都更需要我们投入全部力量，肩负起复兴祖国的伟大使命。"
