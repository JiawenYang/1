 eufrance.8.t:0 "可能发生了什么"
 france.0.a:0 "兵移动到E4"
 france.0.d:0 "纵观历史，法国面临过诸多内外冲突，也因此铸就了强盛的军事传统。十八世纪末的法国大革命就见证了拿破仑·波拿巴等手握大权的军事豪杰崛起。这些历史遗产促使人们永远信任军队在维护国家利益方面至关重要，并塑造了民众认同武装部队是国家身份与主权的关键支柱。\n\n虽然我们的国家不再需要太过明显的军事控制，但军方却不太愿意放弃手中的权力，我们必须与之合作保障其忠诚。"
 france.0.t:0 "大博弈"
 france.100.a:0 "什么都不需要做"
 france.100.b:0 "批准所有入境申请"
 france.100.c:0 "我们不能让激进分子玷污我们的政府"
 france.100.d:0 "随着第二次美国内战的烈焰在美国蔓延，美国民众如同潮水般涌向海外，寻求远离战火的宁静之地。在这些寻求安宁的旅人中，有众多人将目光投向了法兰西，渴望在这片充满艺术气息与浪漫情怀的土地上找到心灵的慰藉。\n\n抵达法国的这些移民，发现自己处于一个岌岌可危的境地，他们必须在一个陌生的国度中寻找出路，前途未卜。法国政府虽然对他们的遭遇表示同情，但在接纳如此多的难民时也显得有些吃力，收容所正面临着超负荷和资源短缺的现状。尽管如此，这些移民仍然保持着坚韧不拔的精神，怀揣着对更美好未来的希冀。\n\n然而，面对美国移民的大量涌入，法国政府在移民政策上陷入了两难境地。如何在提供人道主义援助和展现同情心的同时，确保国家安全和防范极端主义威胁，成了一个必须仔细权衡的问题。"
 france.100.t:0 "美国移民政策"
 france.101.a:0 "所以……你投票给我们了吗？"
 france.101.d:0 "在法国团结进步力量迈出重要一步的关头，斯蒂芬·塞茹尔内与“不屈法国”领导人让-吕克·梅朗雄举行会晤。此次会晤旨在探讨潜在的合作，并建立一个联盟，以增强他们在社会正义、环境可持续性和经济改革等共同目标上的影响力。\n\n在讨论中，塞茹尔内和梅朗雄谈到了气候行动、工人权利以及收入不平等等关键议题。他们认识到，团结一致的阵线能够挑战右翼民粹主义日益增长的影响力，并引起寻求进步变革的选民的共鸣。"
 france.101.t:0 "塞茹尔内与梅朗雄会面"
 france.102.a:0 "朱庇特已经陨落"
 france.102.d:0 "前总统埃马纽埃尔·马克龙在正式失去第三个总统任期后，宣布退出政坛，将复兴党领导人一职留给了斯特凡纳·塞茹尔内。\n\n塞朱尔内在他的就职演说中强调了团结和韧性的重要性，呼吁重新关注进步价值观、经济改革并加强欧洲联系。他承认未来充满挑战，特别是解决那些转向勒庞选民的担忧，并强调需要制定能够引起更广泛选民共鸣的创新政策。"
 france.102.t:0 "马克龙辞职"
 france.103.a:0 "我们必须合作对抗气候变化"
 france.103.d:0 "为了重振复兴党，斯特凡·塞侯尔内采取了一项战略举措，他会见了环境和进步运动的关键人物纪尧姆·贡塔尔。此次会面标志着复兴党向中间偏左政党转型的重要一步，该党将更加关注当代围绕气候变化、社会正义和经济平等的问题。\n\n在讨论中，塞侯尔内和贡塔尔探讨了可以吸引更广泛基础的各种政策举措，强调可持续发展、绿色技术和包容性社会政策。他们认识到吸引年轻选民和城市人口的重要性，这些人越来越关注气候行动和社会公平问题。"
 france.103.t:0 "塞茹尔内会见冈塔德"
 france.104.a:0 "向前进军！"
 france.104.d:0 "法国政坛迎来历史性时刻，一个名为“共和国进军！”的全新政党正式成立，它是由绿党、不屈法国以及复兴党联合组成。该联盟旨在团结一致，共同应对气候变化、社会公正和经济平等等紧迫问题。\n\n“共和国进军！”的成立大会吸引了成千上万热情支持者的参与，反映了民众对政治格局中出现一个连贯的进步替代方案的广泛渴望。三大党派的领导人都发表了慷慨激昂的演讲，强调他们致力于推行变革性政策和维护民主价值观。"
 france.104.t:0 "“一个共和国，一起前进！”成立"
 france.105.a:0 "重新计票！重新计票！重新计票！"
 france.105.d:0 "共和国进军党采取大胆举措，正式呼吁对近期选举中出现的选举舞弊指控进行全面调查。该党领导人对选举过程的完整性表示担忧，敦促提高透明度和问责制，以恢复公众信心。\n\n在新闻发布会上，该党官员重点提到了已浮出水面的各种违规行为报告，强调需要进行彻底审查，以确保每一张选票都得到公平计算。该党领导人对选举过程的完整性表示担忧，理由是存在违规行为的报告，尤其是关于俄罗斯可能干预选举结果的指控。\n\n在新闻发布会上，该党官员重点提到了已浮出水面的各种违规行为，强调需要提高透明度和问责制，以恢复公信力。共和国进军党将此举措视为对民主原则和公民权利保护的承诺，坚称必须解决任何潜在的不当行为，包括外国干预，以维护选举制度的合法性。"
 france.105.t:0 "URUM要求调查选举舞弊"
 france.106.a:0 "我们不应该跟希拉里学的……"
 france.106.d:0 "经过几周的调查后，URUM委员会的报告正式出炉，表明没有证据表明近期选举发生了大规模舞弊。委员会的报告回应了其支持者对选举过程公正性以及境外势力干涉的担忧。\n\n尽管报告发现了些许异常，但是认为这些异常并没有破坏选举的程序正义。URUM领导人确信这份报告会让选民重拾对民主程序的信心，他们也会致力于推进选举透明度，并适当进行民选改革。"
 france.106.t:0 "URUM理事会没有发现大规模投票舞弊"
 france.107.a:0 "法国必须带领欧洲进入一个联邦化的新时代"
 france.107.b:0 "法国必须是欧洲事务的积极参与者"
 france.107.c:0 "联邦化是削弱工人的好方法"
 france.107.d:0 "随着关于欧盟未来的讨论愈演愈烈，共和国进军党走到了一个关键的十字路口。欧盟联邦化的决定会使得各成员国更加团结一致，同时许多国内民众也对此抱有顾忌。在气候变化、贫富差距以及安全威胁的多重压力下，共和国进军党决定带领法国为欧盟联邦化出一份力。共和国进军党将其视为法国增大影响力的机遇，以在欧洲掀起变革。\n\n但同时，共和国进军党也尖锐地意识到联邦化会引出包括本国工人权利方面在内的种种问题。他们指出联邦政策会威胁到本地劳工的权益和社会治安。因此，共和国进军党必须仔细处理如何在推进欧洲一体化的同时保护国内工人。在法国试图在变化的欧洲中找到定位的时候，这一决策不仅将改变政党的方向，也将改变其与选民的联系。"
 france.107.t:0 "URUM在欧盟联邦化上的立场"
 france.108.a:0 "马克龙，我们会回来的……"
 france.108.d:0 "玛丽娜·勒庞宣布她不打算重新担任右翼政党国民联盟主席，而将在国民议会领导一个派系。国民联盟的新领袖出身巴黎郊区，十几岁时就加入了国民联盟，年仅二十七岁的他将接替玛丽娜·勒庞成为新的国民联盟主席。\n\n勒庞的门生若尔丹·巴尔代拉已经担任代理主席一年了，他以85%对15%的得票率击败了53岁的佩皮尼昂市长路易·阿里由，国民联盟的一位重量级人物，勒庞的前搭档。"
 france.108.t:0 "勒庞辞职"
 france.109.a:0 "管好你自己……"
 france.109.d:0 "令人惊讶的是，年轻的国民联盟主席若尔丹·巴尔代拉被拍到与前党内人物卡尔·朗和布鲁诺·戈尔尼施一同前往医院探望让-玛丽·勒庞。此次访问引发了媒体的强烈关注和对该党未来的猜测，尤其是在最近选举失利和让-玛丽健康状况下降的背景下。朗和戈尔尼施都以其更为传统和强硬的观点而闻名，他们的出现引发了人们对巴尔代拉打算奉行的意识形态方向的疑问。\n\n随着访问细节的披露，评论家们意见不一。支持者认为这是对党内传统表达尊重和团结的姿态，而批评者则警告说，这表明该党可能回归国民阵线更为激进的根源。巴尔代拉的领导一直以其想要使该党的形象现代化的愿望为特征，但这次会面可能会使这一说法复杂化。此次访问的结果可能会影响该党未来的战略及其在不断变化的政治格局中吸引更广泛选民的能力。"
 france.109.t:0 "巴尔代拉被拍到拜访让-马里·勒庞"
 france.111.a:0 "智者"
 france.111.d:0 "在一场重要的政治会议上，国民联盟主席乔丹·巴德拉与皮埃尔·德维利耶元帅会面，表达了他们对马克龙总统日益自由化的政策的共同不满。这两位代表着法国右翼不同方面的人物，都表达了他们对马克龙领导下法国日益偏离传统价值观和国家利益的担忧。讨论的中心议题包括移民、安全和国家主权，巴德拉强调需要对“自由主义过度扩张”采取更强硬的立场。\n\n\n德维利耶元帅以其强大的军事背景和保守的观点而闻名，他回应了巴德拉的观点，警告称现任政府的政策威胁着法国社会的结构。他们的会面凸显了既有的军事权威与国民联盟年轻的政治领导层之间可能结成的联盟，旨在团结右翼的各个派别，共同对抗一个共同的对手。随着他们探索合作战略，这种伙伴关系的影响可能会重塑法国的政治格局，并动员那些寻求更传统治理方式的失望选民的支持。"
 france.111.t:0 "巴尔代拉会见德维利耶元帅"
 france.112.a:0 "世事难料啊……"
 france.112.d:0 "在法国，为了巩固极右翼势力，由若尔丹·巴尔代拉领导的国民联盟宣布正式组建名为“正确道路”的全新联盟党。该联盟将国民联盟与埃里克·泽穆尔创建的再征服党以及其他一些规模较小的边缘极右翼政党联合起来。其目标是创建一个更强大的政治实体，能够挑战主流政党，并有效代表对现任政府感到失望的民族主义者和保守派的关切。\n\n“正确道路”旨在利用民众对马克龙总统自由主义政策日益增长的不满，将自己塑造成一个统一战线，优先考虑移民控制、国家主权和传统价值观等议题。成员党的领导人表示乐观，认为该联盟将增强他们在选举中的机会，并为现状提供一个明确的替代方案。随着新政党在政治格局中的定位，其能否在其多元派系之间保持凝聚力，将是其在即将到来的选举中取得成功并动员选民支持的关键。"
 france.112.t:0 "正确道路成立"
 france.113.a:0 "这就是所谓的社会自由主义者……"
 france.113.d:0 "为了加强法国左翼政治格局，马克龙党内派系“左翼复兴”正式加入了“新人民阵线”，这一战略转变旨在联合各进步团体，对右翼政治构成强有力的挑战。领导这一行动的是“复兴”党左翼的杰出人物斯特拉·杜邦，她主张组建一个新的社会民主团体，以有效地争取马克龙党内失望成员的支持。\n\n杜邦的愿景包括创建一个多元的平台，以解决社会正义、经济平等和环境可持续性等紧迫问题。通过与“新人民阵线”结盟，她的目标是巩固左翼力量，并提升其在政治舞台上的影响力。预计这种伙伴关系将动员那些寻求替代现任政府中间派政策的选民，同时也会在进步选民中重燃希望。随着“新人民阵线”的形成，它的成功将取决于它能否有效地统一这些不同的派系，并为未来阐明清晰且引人注目的议程。"
 france.113.t:0 "复兴党左派加入新人民阵线"
 france.114.a:0 "知道了"
 france.114.d:0 "一股公民参与的浪潮席卷法国，全国各地的公民联合起来，发起了一场广泛的运动，要求就建立第六共和国举行全民公决。这场呼吁变革的运动的动力来自于人们对当前政治体制的普遍不满，对腐败的感知，以及对更强大的民主代表的渴望。活动人士认为，一个新的共和国可以更好地反映法国人民的需求和价值观，摆脱以往政府所具有的中央集权特征。"
 france.114.t:0 "民众要求对是否成立新共和国举行全民公决！"
 france.115.a:0 "终于！"
 france.115.d:0 "在一系列出人意料的转折中，让-吕克·梅朗雄因涉嫌叛国而被正式逮捕。\n\n逮捕行动由法国执法机构根据德维利耶总统的指令执行，他们在此前就进行了详尽调查，获取了显示梅朗雄涉嫌参与一系列被认定为对国家利益造成损害活动的确凿证据。尽管关于指控的具体细节尚未对外公布，但据可靠消息透露，梅朗雄在2022年大选期间涉嫌从事了威胁法国主权、安全和稳定的行动。这次逮捕震惊朝野，官员们纷纷对此表示惊讶和关切。\n\n政府强调了在维护国家福祉面临威胁时，坚持法治和保障国家完整性的重要性。为应对此次事件，政府已提升包括政府大楼和公共场所在内的一系列关键地点的安全等级，并维持高度警惕。除此之外，该事件也引发了关于是否该采取更严格措施以防范潜在内部威胁的必要性的深入讨论。"
 france.115.t:0 "梅朗雄因叛国遭到逮捕"
 france.116.a:0 "泽穆尔宣誓效忠"
 france.116.d:0 "皮埃尔·德维利耶总统与其政敌埃里克·泽穆尔举行了一场高级别会议，探讨联合各自政党的可能性。这次闭门会议引发了大量猜测，并引起了各政治派别的关注。德·维利耶总统与著名政治评论员兼前总统候选人泽穆尔在一个未公开的地点会面，讨论了联合政党的可能性。虽然会面的细节仍然保密，但据信两位人士就共同的目标、意识形态的一致性以及保守党派大联合可能带来的益处进行了坦诚而深入的交谈。"
 france.116.t:0 "德维利耶在爱丽舍宫会见泽穆尔"
 france.117.a:0 "一场皇室复兴？"
 france.117.d:0 "近期在法国各大学开展的一项民意调查显示，自皮埃尔·德维利耶总统当选以来，大学生选民对君主制的支持率出现了惊人的增长。这一调查结果表明年轻人的政治偏好发生了显著变化，越来越多的学生表示有兴趣探索其他形式的治理方式。\n\n大学生选民中君主制情绪的升温，部分归因于德·维利耶总统所展现的卓越领导能力和他对稳定、传统及国家统一的强调。其执政期间引发了公众关于君主立宪制在现代社会中所扮演的角色的深入讨论，支持者认为君主能够作为一个团结的象征，在政治与社会挑战中提供连贯性。此外，调查结果还表明，年轻选民正在寻求超越传统左右政治分野的替代方案，并对探索不同的政治理念持开放态度。君主制曾一度被视作边缘化政治观念，如今却已在大学学生中赢得了认同，作为对当前政治体系不足的突破。"
 france.117.t:0 "法国大学生选民在选举后对君主制表现出更高的兴趣"
 france.118.a:0 "一次宏大的武力展示"
 france.118.d:0 "皮埃尔·德维利耶为了展示爱国热情和民族团结，组织了一场盛大的阅兵，吸引了法国各地的人们的注意。这次阅兵横跨整个巴黎，展示了总统对武装部队的深切感激，强调了国家面对挑战时的力量和团结。"
 france.118.t:0 "巴黎阅兵"
 france.119.a:0 "至少我们还能跟玛丽娜合作。"
 france.119.d:0 "为了促进国家团结并应对法国面临的紧迫挑战，总统埃马纽埃尔·马克龙与政治对手让-吕克·梅朗雄和玛丽娜·勒庞进行了讨论，探讨组建全国团结政府的可能性。然而，讨论过程中紧张局势迅速升级，梅朗雄以突然离席的方式表达了对提议条款及其可能需要就其政党核心原则做出妥协的不满。他的离席凸显了法国各政治派别之间依然存在的深刻意识形态分歧。\n\n马克龙总统和玛丽娜·勒庞继续他们的讨论，探讨合作和共同政策目标的可能性。他们愿意跨越传统政治界限进行对话，展示了在应对国家重大挑战中需要更广泛合作的迫切性。"
 france.119.t:0 "梅朗雄离席！"
 france.1191.a:0 "再见反对派。"
 france.1191.d:0 "法国当局揭露了一场针对埃马纽埃尔·马克龙的最卑劣、最叛逆的阴谋 而这一阴谋正是由议会中的保守派反对党策划。事实清晰无疑，若非此事被及时揭露，后果不堪设想……马克龙亲自下令当局严惩所有涉案人员，而巧合的是，所有涉案者皆为反对派成员。由于戒严法已然生效，选举无法举行，这无疑进一步巩固了马克龙的权力。他随即任命了一批忠于其政党的成员，填补被清除的议会席位，让政府的掌控更趋牢固。"
 france.1191.t:0 "密谋揭晓"
 france.120.a:0 "中道万岁"
 france.120.d:0 "为了加强国家团结并应对法国当前面临的挑战，埃马纽埃尔·马克龙总统采取了一项出人意料的举措，宣布将与政敌让-吕克·梅朗雄和玛丽娜·勒庞举行会议，共同探讨组建全国团结政府的可能性。这一声明立即引发了政治界的广泛猜测和高度关注。此次计划中的会议将在不久后举行，表明了马克龙总统致力于超越传统政治分歧，寻求更广泛、更深入的治理合作。马克龙总统旨在通过与梅朗雄和勒庞的接触展现其弥合意识形态鸿沟的坚定意愿，并寻求构建一个团结阵线以应对紧迫的国家问题。"
 france.120.t:0 "马克龙与梅朗雄和勒庞会面"
 france.121.a:0 "新时代的曙光照耀地中海"
 france.121.d:0 "为了促进区域合作和经济一体化，法国总统埃马纽埃尔·马克龙宣布成立马耳他条约，这是一个由几个地中海国家组成的新经济集团。该条约旨在加强联系，促进贸易，增强克罗地亚、法国、西班牙、意大利、斯洛文尼亚、黑山、阿尔巴尼亚、希腊和土耳其等国之间的合作。每个国家都将为该集团带来了独特的优势和资源，促进合作项目、知识共享和区域倡议的发展。\n马耳他条约预计将创建一个富有成效的交流平台，鼓励跨境投资，促进旅游业，并在农业、能源、基础设施和技术等各个领域鼓励优秀案例经验分享。它还为成员国提供了一个机会，共同应对气候变化、移民和安全问题等共同挑战。"
 france.121.t:0 "马克龙总统签署马耳他条约"
 france.1211.a:0 "通过"
 france.1211.b:0 "拒绝"
 france.1211.d:0 "马耳他条约旨在促进区域合作，加强经济一体化和促进地中海国家之间的共同繁荣。通过加入我们的集团，各国将有机会积极参与一个专注于互利合作、知识交流的动态平台，以及一个旨在释放该地区巨大经济潜力的联合倡议。"
 france.1211.t:0 "马耳他条约 - 通过还是拒绝"
 france.122.a:0 "臃肿的行政机构垮台"
 france.122.d:0 "埃里克·泽穆尔总统大刀阔斧的削减行政开支取得了显著成效，为国家提高了行政效率，增加了行政收入。总统致力于精简官僚机构和削减政府开支并取得了积极的效果，这标志着他的任期有了一个好的开端。泽穆尔总统的精简政府是其更加广泛的政府改革议程的一部分，其旨在提高效率、减少冗余和减轻纳税人负担。通过采取精简行政程序的措施，总统力求建立一个更精简、更有效的治理结构。"
 france.122.t:0 "泽穆尔总统的精简政府政策取得显著效果"
 france.123.a:0 "泽穆尔或许是有自己的路子了……但法国呢？"
 france.123.d:0 "在法国及欧洲范围内产生深远影响的重大进展中，总统埃里克·泽穆尔已正式宣布计划举行关于法国是否继续作为欧洲联盟成员国的公投。这一被称为“法国脱欧”的提案，标志着法国政治格局的显著转变，并引发了关于法国与欧盟未来关系的广泛、深入的辩论探讨。法国脱欧公投的宣布在社会各界引起了不同的反响。支持者将其视为重申法国主权、恢复经济和移民政策控制权、保护国家利益的契机。他们主张，脱离欧盟将使法国能够自主缔结贸易协议，在关键议题上做出独立决策，并重新掌握边境管理权。然而，公投的反对者则对离开欧盟可能带来的后果表示担忧。他们强调欧盟成员国身份所带来的包括进入单一市场、经济稳定以及共同应对全球挑战的协作能力等诸多好处。"
 france.123.t:0 "脱欧公投"
 france.1231.a:0 "对于泽穆尔而言，这是个令人失望的结果"
 france.1231.d:0 "事件的发展令人震惊，法国在备受瞩目的脱欧公投中决定继续保持欧洲联盟成员国身份，这一出人意料的结果给了右翼总统埃里克·泽穆尔提出的脱欧愿景沉重一击。公投的结果深刻反映了法国选民对于该国与欧盟未来关系观点的动态和多样化。此次脱欧公投对法国乃至整个欧洲联盟具有深远的影响。它明确表明，法国民众中相当一部分人珍视欧盟成员国身份所带来的利益与机遇，包括进入单一市场、人员的自由流动以及在重要问题上的集体决策权。尽管公投结果已尘埃落定，但总统泽穆尔尚未公开露面承认欧盟的胜利，据报道，他正在对其政府提起多起选举诉讼。"
 france.1231.t:0 "法国脱欧公投未通过"
 france.1232.a:0 "拜拜啦蠢货们！"
 france.1232.b:0 "还是温和退欧比较好"
 france.1232.d:0 "法国在备受瞩目的脱欧公投中选择了退出欧盟，这是一项震惊欧洲的、里程碑式的决定。投票结果反映了法国政治的剧变，标志着法国与欧盟关系出现转折。离开欧盟的决定对法国和整个欧盟都产生了重大影响。作为欧盟的创始成员国之一，法国的离开引发了对欧盟凝聚力、欧洲一体化的前景以及欧元区稳定的质疑。估计法国和欧盟之间会迎来一段紧张的谈判时期来确定双方的分开的条件，并为双方关系建立新框架。"
 france.1232.t:0 "法国通过脱欧公投"
 france.124.a:0 "别担心，我们会解放你们家园的。"
 france.124.d:0 "为了呼吁国际社会给予支持与声援，俄罗斯异见人士在法国举行了一次游行示威，尝试引起公众对侵犯人权行为的关注，同时倡议俄罗斯自由权利扩大。这次游行是对俄罗斯在乌克兰和波罗的地区发动军事行动的反抗象征，意图揭露俄罗斯境内面临迫害的活动家、记者乃至普通个人的困境。\n\n莫斯科当局将这次游行称之为一场闹剧，但无疑已经打动了法国民众的内心，坚定了他们推翻俄罗斯现政权的决心。"
 france.124.t:0 "俄罗斯异见人士在法国组织游行"
 france.125.a:0 "你们很快就会夺回自己的家园！"
 france.125.d:0 "在欧陆战争的重大进展中，俄罗斯异见者们在法国组建了志愿旅，他们致力于对抗压迫政权，为自由而战。这些旅由俄军的叛逃分子、政治活动家和有军事经验的志愿者们组成，旨在反抗不公平的现象，反抗俄罗斯政府的镇压手段。在法国组建持俄国异见者的支援旅也有助于加强国际社会和俄罗斯反对派之间的团结，它标志着反对侵犯人权的共同立场，并清楚的阐明了俄罗斯国内正在进行中的争取民主的斗争。"
 france.125.t:0 "俄罗斯异见旅成立"
 france.126.a:0 "叛徒！"
 france.126.d:0 "在法国乡间的一场短暂交战后，我们终于揪出了那些懦弱且不忠的叛军将领——正如过街老鼠般，他们蜷缩在一座未完工的小屋中，企图苟延残喘。\n\n当他们被押往空旷的田野时，这些曾自诩为法国“救世主”的人，曾高喊荒谬种族优越论的狂热分子，此刻却泪流满面，哀求宽恕，卑微地乞求饶命。\n\n我们的士兵默然伫立，愤怒燃烧在他们的目光之中。步枪缓缓抬起，枪栓拉动的声音划破沉默。就在这些所谓的“将领”试图再度开口撒谎之际，一阵枪声终结了他们的谎言，再无人聆听他们的遗言。"
 france.126.t:0 "审判政变支持者"
 france.127.a:0 "赤匪！"
 france.127.d:0 "巴黎的街巷回荡着最后的审判——那些赤色幽灵的追随者，被逐一捕获，终究难逃宿命的清算。\n\n那个虚伪的意识形态，声称要解放法国工人，实则只会让人民陷入饥荒与绝望，如今终于迎来了它的终结。\n\n那些自称“工人救世主”的可憎之人，被押至街头示众。行刑队整齐列队，步枪上膛，而路人驻足围观，目睹这些所谓革命者在死亡面前哭喊求饶。\n\n渐渐地，人群聚集成了一片汹涌的怒潮。他们愤怒地咒骂着这些懦弱的领导者，称他们为叛徒、暴徒、刽子手。当行刑队就位，枪口抬起，人群的怒吼化作了震耳欲聋的欢呼，迎接子弹的肃清。\n\n枪声响起，尘埃落定，唯有叛徒的血泊与尸体横陈街头。人群逐渐散去，回归日常，而那个共产主义的噩梦，也在今日彻底终结于法兰西的土地上。"
 france.127.t:0 "审判赤匪同情者"
 france.128.a:0 "自由法国的先辈们将我们联结在一起。"
 france.128.d:0 "自祖国的血腥内战尘埃落定之后，胜利者立刻开始追求完全统一法兰西的伟大历史目标。自然而然地，他们将目光落在了那地中海上的明珠，古希腊人所称的“最美的岛屿”——科西嘉。当内战爆发时，此处被从本土撤退的法兰西国家海军舰队保护了起来，使之得以免遭内战战火的波及。\n\n法兰西共和国政府已向科西嘉海军司令部发出照会，要求后者立刻向巴黎中央政府宣誓效忠，同时将包括航母和大型护卫舰在内的舰队精华部分开往土伦港，由国内海军军官和水兵进行换班，从而实现舰队指挥权的回归。海军上将们经过简短讨论，已决定答应共和国政府的全部要求，舰队内部对回归祖国的前景自然也不会存在任何异议。"
 france.128.t:0 "法兰西共和国要求归还科西嘉岛和海军舰队"
 france.129.a:0 "共和国的叛徒！"
 france.129.d:0 "懦弱的法西斯军政府成员被五花大绑地扔在巴黎街头，在愤怒的人群面前狼狈不堪，遍体鳞伤。当我们宣读他们对法兰西人民犯下的累累罪行时，那些曾自诩法兰西至高无上的狂徒，此刻却在断头台前颤抖哀求，暴露出他们懦夫的本性。\n\n在绝望中，他们试图做最后的挣扎，向围观的群众煽动叛乱。然而，这番无耻的呼吁只激起了人群更深的愤怒——激愤的巴黎市民高声咒骂这些法西斯豺狼，有人从街道上拾起物件砸向他们，有人甚至试图翻越围栏，将其撕碎。为了维护秩序，我们不得不派遣警察制止群众的怒火。\n\n在震耳欲聋的呼喊声中，断头台落下，“绝不宽恕法西斯豺狼！”这一口号在广场上久久回荡。那些暴政的头颅被投入火焰，让这可憎的意识形态在烈焰中彻底灰飞烟灭。\n\n就此，法西斯在法兰西的火苗，被彻底熄灭。"
 france.129.t:0 "审判法西斯军政府及其对法国人民犯下的罪行"
 france.130.a:0 "人民的叛徒！"
 france.130.d:0 "旧政权的败类被发现像老鼠般蜷缩在巴黎郊外的一间破屋里，当他们被押解至巴黎，游街示众时，人群纷纷涌上街头，目睹这群罪人的下场。愤怒的民众高声谴责那些背叛祖国、令法兰西蒙羞的懦弱政客，怒不可遏地向他们投掷石块，并在纸板上写下“绝不宽恕自由派寡头！”、“这些叛徒死有余辜！”的标语。\n\n当这些罪人被押上断头台，他们仍妄想在临死前说上几句，如同懦夫般试图用谎言煽动民众，妄图让法兰西再度陷入黑暗。然而，他们的声音很快被愤怒的人群淹没，“砍下他们的头！”的口号震耳欲聋，席卷广场。最终，利刃落下，每一次斩击都彻底粉碎旧政权残存的痕迹。那些象征着苦难与背叛的头颅被投入烈焰，让他们的罪行随着火焰化为灰烬，永远从这片土地上抹去。至此，旧政权带来的耻辱与罪恶，已然成为法兰西漫长历史中的一页，而法兰西，将继续昂首向前。"
 france.130.t:0 "审判自由主义寡头政客"
 france.131.a:0 "人民之国的拼图完整了。"
 france.131.d:0 "自祖国的血腥内战尘埃落定之后，胜利者立刻开始追求完全统一法兰西的伟大历史目标。自然而然地，他们将目光落在了那地中海上的明珠，古希腊人所称的“最美的岛屿”——科西嘉。当内战爆发时，此处被从本土撤退的法兰西国家海军舰队保护了起来，使之得以免遭内战战火的波及。\n\n全新的法兰西人民共和国政府已向科西嘉海军司令部发出照会，要求后者立刻向巴黎的革命中央宣誓效忠，接受革命政府的特派使节团进行检查，在这之后，滞留科西嘉的大型船舰们将在前者登舰监护下凭自身动力开回本土，由国内海军军官和水兵进行换班，从而实现舰队指挥权的回归。\n\n海军上将们经过数日讨论，已决定答应人民共和国政府的全部要求，尽管舰队内部仍存对新红色法国的疑虑之声，但大部分海军军人仍对回归祖国的前景充满期待。"
 france.131.t:0 "法兰西人民共和国要求归还科西嘉岛和海军舰队"
 france.132.a:0 "再也不会有反对派！"
 france.132.d:0 "随着我军深入红色威胁的心脏，我们一次次见证着相同的剧目上演。每取得一场伟大的胜利，我们便向光复祖国迈进一步，然而，那些公社残党仍在乡野与城镇的阴影中挣扎，妄图以叛乱与恐怖破坏我们的进程。监狱早已被左翼叛徒、社会主义者与赤色阴谋家塞得满满当当，若我们希望新政府真正稳固，必须立即采取果断行动。法国即将迎来一个崭新的时代，不容任何不忠之徒阻碍变革的步伐。真正的变革，不是软弱者能想象的……但我们不仅敢于想象，更敢于实践！"
 france.132.t:0 "审判左派，共匪和苏联间谍"
 france.133.a:0 "自由派走狗……"
 france.133.d:0 "自内战伊始，当我们从那背叛祖国的法兰西共和国手中夺回土地，法庭便日夜不息，审判无数罪人。而今，正义之剑终于高悬，我们得以惩治那些妄图毁灭法兰西的叛徒，无论他们曾在幕前还是幕后谋害这片大地。多数人被判以严刑，使他们在黑暗中腐朽，消失在法兰西的视野之外。而至于那毁灭祖国的旧政权，他们迎来了更迅速的裁决——以鲜血偿还他们对法兰西犯下的滔天大罪。然而，这仅是序章，我们正义的征途尚未止步，肃清罪恶的圣战才刚刚启程。"
 france.133.t:0 "审判反法自由派"
 france.134.a:0 "拿破仑的故乡重归法兰西。"
 france.134.d:0 "自祖国的血腥内战尘埃落定之后，胜利者立刻开始追求完全统一法兰西的伟大历史目标。自然而然地，他们将目光落在了那地中海上的明珠，古希腊人所称的“最美的岛屿”——科西嘉。当内战爆发时，此处被从本土撤退的法兰西国家海军舰队保护了起来，使之得以免遭内战战火的波及。\n\n全新的法兰西国防政府已向科西嘉海军司令部发出照会，要求后者立刻向巴黎中央政府宣誓效忠，并在同一时刻立即解除舰队的全部武装。高级指挥官们将卸任并被遣返回本土，舰队的精华部分需滞留在这座小岛上直到由国内海军军官和水兵进行换班，从而实现舰队指挥权的回归。\n\n海军上将们经过漫长而激烈的讨论，最终在对可能的军事惩罚行动的忧虑中决定答应国防政府的全部要求，舰队内部对回归祖国的前景尽管争议颇多，但没有人胆敢反抗长官的决定。"
 france.134.t:0 "法兰西国防政府要求归还科西嘉岛和海军舰队"
 france.135.a:0 "新政权建立"
 france.135.d:0 "在历经血腥内战的撕扯与蹂躏后，这个国家终于建立起了一个能够恢复并维持稳定秩序的军政府。由高级军官组成的军政府已经彻底掌控了政权，他们表示，在当下这个大规模骚乱与动荡的形势下，这个国家比以往任何时候都更需要一个集中统一、强而有力的领导。随着军政府逐渐巩固自己的权力，它也开始正式面临着一项艰巨而伟大的任务——重建这个饱受战争蹂躏的国家，并重塑人民对政府的信心。今后的道路也许充满坎坷与艰辛，但军政府必然将坚定不移地致力于重现这个国家的和平、繁荣与稳定。"
 france.135.t:0 "军队组建新政府"
 france.136.a:0 "这些人靠不住"
 france.136.b:0 "我等将共同捍卫法兰西的未来！"
 france.136.d:0 "经历了血腥残酷的内战后，军政府胜出并接管了国家，以伊文·贝内代蒂为首的许多泛法西斯主义政客和民兵领导人要求在新政府中占据一席之地。法西斯主义者声称他们代表了很大一部分民众的利益，认为自身在内战中的重要作用应当在新政府人员任用中得以回报。然而，这些要求在军政府内部和广大民众间引发了争议和分歧。"
 france.136.t:0 "法国法西斯团体要求获得政府代表席位"
 france.137.a:0 "致敬！"
 france.137.d:0 "贝内代蒂步上爱丽舍宫的阳台，俯瞰着广场上万众汇聚的人潮。此刻，所有的目光都紧盯着他，他能感受到沉重的压力——他别无选择，不能有丝毫失误。\n\n当他握紧话筒的瞬间，一股炽热的火焰在胸膛中燃烧——是怒火，是仇恨，是对俄罗斯人的滔天愤怒，对腐朽精英的刻骨痛恨。那些曾摧毁法兰西、践踏他的祖国、逼迫无数英勇的法国人死于战火的罪人，终于被清算。他的声音如雷霆般回荡在广场上，宣布——法兰西终于摆脱了那些“出卖祖国的腐朽精英”，那些将国家拱手让给外国人，试图用陌生的影子取代法兰西文化与人民的叛徒。他的话锋一转，怒斥苏维埃，将他们称作“低贱的垃圾”，誓言为法兰西复仇。他向广场上的每一个人承诺——他将亲率一支伟大的军队，直抵莫斯科，将其彻底烧为焦土，为每一位牺牲的法兰西英魂讨还血债。\n\n他的话点燃了人群的狂热。他们不只是欢呼，而是高声呐喊，愤怒的口号响彻整个巴黎——“处死苏维埃猪猡！”“荣耀属于贝内代蒂！”\n\n此刻，他明白了——自己不仅仅是个领导者，他是命运选中的人，是法兰西的救世主，是那个愿意不惜一切、哪怕鲜血染透整个大陆，他也要让法兰西重回荣耀。他赢得了人民的心，而他知道，他绝不能让他们失望。"
 france.137.t:0 "贝内代蒂就任法兰西独裁者"
 france.140.a:0 "授予巴黎伯爵让四世公爵头衔"
 france.140.b:0 "授予威尔士亲王威廉王子公爵头衔"
 france.140.c:0 "解散布列塔尼议会"
 france.140.d:0 ""
 france.140.t:0 "布列塔尼妥协"
 france.141.a:0 "妈的！"
 france.141.b:0 "这持续不了多久的……"
 france.141.d:0 "即使我们尽了最大努力去平息，但马吉德·卡坦抗议却仍在不断升级，态势愈发令人不安。暴徒在街头大肆破坏，焚烧旗帜，占据街道，即便我们已采取了让步和对策仍不肯让步。\n\n事态都在持续恶化。似乎每天都有越来越多的人反对我们，越来越多的人因一个人的死亡而与国家作斗争。为什么？肇事的警官已经被绳之以法，为什么？这一切的目的是什么，为什么还要继续斗争？\n\n无论我们心怀何种疑虑，现实都不会改变，而这场骚乱必须结束，不论付出什么代价。"
 france.141.t:0 "骚乱加剧"
 france.142.a:0 "这儿可不是美国！"
 france.142.d:0 "法国民众因一起震惊全国的事件而愤怒不已——一名名叫马吉德·卡坦的突尼斯人在巴黎郊区博比尼遭遇警方枪杀，而他当时手无寸铁。社交媒体上流传的视频显示，警察对他怒吼，命令其趴下，而尽管马吉德已在努力配合，仍被一名身份未公开的警员开枪射杀。这一事件在全国范围内引发了巨大愤慨，大批抗议者聚集在警察总部，高喊“逮捕开枪警察！”、“为卡坦讨回公道！”等口号。这些口号迅速在法国媒体上疯传，越来越多的人加入抗议，最终演变为大规模骚乱。昨夜，示威者点燃车辆、破坏街道、砸毁公交站，并向警方发射烟花，城市陷入混乱。尽管这一消息直至今日才传来，但巴黎早已被无序与怒火吞噬，混乱与烈焰笼罩着整座城市。"
 france.142.t:0 "马吉德·卡坦死后暴力事件爆发"
 france.143.a:0 "各自逃命吧！"
 france.143.d:0 "随着法国与俄罗斯的战争持续升级，阿尔及利亚军政府已陷入崩溃，致使该地区一片混乱。法国政府对阿尔及利亚的漠视，以及其全神贯注于战事，引发了阿尔及利亚民众的强烈不满。加之动荡局势不断升级，以及缺乏有效的治理，最终导致了军政府的垮台。"
 france.143.t:0 "病夫政府"
 france.144.a:0 "等等，伙计们，不要真的用那些枪"
 france.144.d:0 "我们犯了一个严重的错误。怀着最美好的意图，我们给镇暴者配备了武器，希望这些武器能用于和平。我们给了他们橡胶子弹和其他各种反制手段来对付仍在抗议的暴力分子。然而，事实证明，暴力只会引发更多的暴力。\n\n我们所造成的只是事态进一步的恶化升级。枪声四起，抗议者们现在有了充足的理由，将他们的怒火释放出来。抗议活动变得比以前更加暴力和更加猖獗，正义的怒涛席卷整个法国。这场烈焰已无法扑灭。"
 france.144.t:0 "武装抗议者"
 france.145.d:0 "在阿尔及利亚法国军政府垮台之后，留在阿尔及利亚的军官们开始支持雅克·维拉尔及其多个复兴的黑脚团体。\n\n这些组织利用新获得的权势，掌控了这片长期欺压法语群体的土地，并建立起一个名为“两岸联邦”的、带有半种族隔离性质的国家。"
 france.145.t:0 "黑脚国成立"
 france.146.a:0 "彻彻底底的专制！"
 france.146.d:0 "致相关人士：\n\n随着民族主义的浪潮正在在我们伟大的国家内高涨，我有责任表达我对当前政府无法满足人民迫切需求的日益增长的担忧。是时候让军方领导人站出来，引领我们的国家走向力量和稳定了。我们的影响力再也不能被忽视了；我们必须展现自己的存在，确保法国的利益得到保护。遏制任何可能危及我们国家完整性的执政党行为是至关重要的。\n\n署名：[THIS.GetRank][THIS.GetName]"
 france.146.t:0 "军队滥用政治关系"
 france.147.a:0 "债债债……"
 france.147.d:0 "致财政部：\n\n鉴于最近发生的事件，我已决定将大量政府资金重新分配给被认为对国家安全至关重要的军事行动。虽然这些支出对于保持我们的战备状态至关重要，但政府必须意识到当前形势的严重性。如果政府希望质疑这些支出，我将确保将账单退还给他们，因为国家的安全不能因官僚作风的拖延而受到损害。\n\n署名：[THIS.GetRank][THIS.GetName]"
 france.147.t:0 "军方向我们提交账单"
 france.148.a:0 "你也给我去他妈的！"
 france.148.d:0 "致我的同侪们：\n\n我注意到，我们对当前政府政策的立场引起了不同的反应。然而，我们必须坚定自己的立场。通过公开挑战政府的决策，我们强调了我们对国家真正需求的承诺。虽然这可能会导致政局不稳，但这是向人民表明军队在面对政府治理不力时是一个强大的必要角色。人民必须看到我们准备好保护他们的利益。\n\n署名：[THIS.GetRank][THIS.GetName]"
 france.148.t:0 "军队反对政府"
 france.149.a:0 "好吧，这也不是太坏"
 france.149.d:0 "致指挥官：\n\n我很高兴宣布成立一个新的部门，致力于符合我们人民理想中的民族主义。这个部门将按照以人民福祉为先的原则运作，不受当前政府的影响。我们必须建立一支反映人民诉求的队伍，因为我们现在忠于国家本身，而不是目前掌权的某些个体。我们必须为即将到来的挑战做好准备。\n\n为我们的国家服务，[THIS.GetRank][THIS.GetName]"
 france.149.t:0 "军方建立新师团"
 france.151.a:0 "[THIS.GetName][THIS.GetRank]"
 france.151.d:0 "我以此信谨祝您身体健康，精神焕发。怀着崇高的荣誉和对您的无上敬意，卑职想借此机会向您对我们敬爱的法兰西祖国坚定不移地卓越服务表达衷心感谢。\n\n您宏伟的战略愿景与明智决策为国家的安全繁荣贡献巨大。您对武装部队地坚定支持不仅提升了战斗力，还孕育了士兵对于自身的集体荣耀感。"
 france.151.t:0 "亲爱的[FRA.GetLeader]总统"
 france.152.a:0 "[THIS.GetName][THIS.GetRank]"
 france.152.d:0 "敬颂安康。怀着深深的歉意与谦卑，我提笔写下了这封信。在之前的信件中，我严厉指责了您的领导能力，如今想来，我的措辞实属不妥，字里行间也充满了对您的不敬，对此我深感后悔。\n\n诚然，我可能无法完全认同您作为总统所做出的每一个决定，也未必赞同您带领国家前进的每一个方向。但我深知您肩负的责任是何等重大，领导法兰西民族的道路上又充满了多少挑战。我衷心希望，无论我们之间存在着怎样的分歧，我们都能为了法兰西人民的福祉而携手共进，寻求共识，找到解决问题的最佳方案。"
 france.152.t:0 "亲爱的[FRA.GetLeader]总统"
 france.1521.d:0 "我希望这封信能给您带来最美好的心情。您一定很高兴得知，我写这封信是为了表达我最诚挚的感激之情——感谢您把我从寡淡无味的、无聊透顶的退休生活中拯救出来。这真是一个令人振奋的转折点，多亏了您万分精明的决策。\n\n您召回我复员服役的时机真是再恰当不过了。就当我以为自己已经习惯了悠闲的退休生活时，您却勇敢地把我拉回了战场。一想到要再次辗转于错综复杂、盘根错节的军事官僚机构，一想到要重新面对官场上那曾使我被迫退役的、举手投足间无处不在的政治细节与权力交锋，我就彻夜难眠。您，先生，是我的英雄。"
 france.1521.t:0 "亲爱的[FRA.GetLeader]总统"
 france.153.a:0 "[THIS.GetName][THIS.GetRank]"
 france.153.d:0 "愿君安好。在最近的军事会议上，您提及了我的名字，并对我的贡献以及全体军队的付出表示了肯定。您的赞赏令我深感荣幸，您的鼓励也令我倍受鼓舞。\n\n我向您保证，我将比以往任何时候都更加坚定地践行军队所秉持的荣誉、正直和纪律原则。您的肯定更加坚定了我的决心，我将竭尽所能地报效国家，为法兰西的繁荣昌盛贡献自己的力量。"
 france.153.t:0 "亲爱的[FRA.GetLeader]总统"
 france.1531.a:0 "[THIS.GetName][THIS.GetRank]"
 france.1531.d:0 "请允许我尽我所能地表达我的感激之情，感谢您赐予我的荣誉，让我能够选择从军队退役。对于您在这件事上选择的完美时机，我几乎无言以对——或者更好的说法是，“惊讶到无以言表”。\n\n不是所有资历丰富的将军都能以如此体贴和令人信服的方式退休的。打心底讲，您的决策能力令人钦佩。对悠闲日子的期待，服役生涯中令人心跳加速的肾上腺素的缺失，变成了一种难以忍受的负担与折磨——我很感激您能把我从如此折磨人的命运中解放出来。"
 france.1531.t:0 "亲爱的[FRA.GetLeader]总统"
 france.1532.a:0 "[THIS.GetName][THIS.GetRank]"
 france.1532.d:0 "我希望这封信能给您带来最美好的心情。您一定很高兴得知，我写这封信是为了表达我最诚挚的感激之情——感谢您把我从寡淡无味的、无聊透顶的退休生活中拯救出来。这真是一个令人振奋的转折点，多亏了您万分精明的决策。\n\n我必须表达对您的钦佩之情，您勇敢地承诺无视政治偏见，重视我这么一个独一无二的个体。"
 france.1532.t:0 "亲爱的[FRA.GetLeader]总统"
 france.154.a:0 "[THIS.GetName][THIS.GetRank]"
 france.154.d:0 "怀着沉重的心情写下这封信，我对您在担任我国总统期间所表现出的领导能力深感失望。我非常遗憾地认为，您完全缺乏担任我国领导人的能力与魄力，我同时对此表示严重关切。\n\n作为一名发誓将毕生致力于为国家服务的军事将领，我亲眼目睹了如今政府高层的无能、软弱与缺乏战略眼光，你们根本无法强有力地领导这个伟大的国家——这实在是令人痛心。"
 france.154.t:0 "亲爱的[FRA.GetLeader]总统"
 france.160.a:0 "赢家通吃"
 france.160.d:0 ""
 france.160.t:0 "建制派崩溃"
 france.161.a:0 "由洛芒致开幕词"
 france.161.b:0 "由鲁塞尔致开幕词"
 france.161.c:0 "由达南克斯致开幕词"
 france.161.d:0 "终于，所有无产阶级和社会主义共和国先锋的同仁和思想家们被召集到了一起，召开了一次重要的大会。然而，即便大会即将开始，开幕致辞的发言人却尚未确定。这无疑是此次盛会中最重要的职位之一。\n\n许多人推举我们的革命先驱——法比安·鲁塞尔，引领我们走到今天的人，作为开幕致辞的发言人。毕竟，没有他，没有他的指引，我们哪会取得如此的成就？或许还仍在法西斯的铁蹄下苦苦寻觅着共和国的荒谬迷梦？许多人认为他就是我们革命中最重要、最突出的代表人物，没有之一。\n\n然而，尽管这一提议得到了很多人的认可，也有人则认为更具自由思想和政治头脑的迪迪埃·达南克斯应该担任开幕致辞的发言人。这个主张由我们队伍中组织更松散、更具乌托邦思想的社会主义者和共产主义者所支持。不论我们做出何种决定，国家的方向将会因选定的发言人而发生巨大的变化。因此，我们必须慎重考虑，明智选择。"
 france.161.t:0 "革命思想交锋"
 france.162.a:0 "他们是民族自豪的源泉"
 france.162.b:0 "他们是无产阶级的利刃！"
 france.162.c:0 "他们是暴君的爪牙"
 france.162.d:0 "军队问题始终是左翼阵营内部极具争议的议题，自左翼运动诞生以来便在我们的圈层中引发激烈辩论。这个曾用于维护国家机器、镇压社会主义者与革命者的陈旧体系，如今亟待我们作出历史性抉择。\n\n部分同志坚信军队应成为无产阶级的直接武装力量，将其视作扩展革命影响、实现人民意志的利剑。在他们眼中，军队应当成为工人阶级自我解放的工具——纯粹为劳动者服务，由劳动者掌控。\n\n但更多同志聚焦于军队的反动历史，认为其本质仅是压迫工具，注定被独裁者与资本主义势力所操控。他们主张必须尽快废除这个沾染着世界历史污秽的体制，视其为必须割除的毒瘤。\n\n在这两极观点之间存在着折中立场：承认军队作为革命防卫手段的必要性。既不将其神圣化，亦不加以妖魔化——军队是我们保护人民、捍卫法兰西不得不接受的现实手段，是革命政权在险恶国际环境中求存的防御盾牌。"
 france.162.e:0 "他们是达到目的的手段。"
 france.162.t:0 "武装力量问题"
 france.163.a:0 "我们是革命的发源地"
 france.163.b:0 "我们是全球革命的第一张多米诺骨牌"
 france.163.c:0 "人民是革命的先锋"
 france.163.d:0 "无产阶级是革命斗争的中心，整个委员会都对此深信不疑。但他们对无产阶级在新生国家中的地位争论不休。\n\n我们当中的许多理想主义者认为：世界革命不可避免，我们应当支持并为全世界的工人而战。他们完全相信我们有能力解放全球的无产阶级。\n\n但与此同时，还有许多人认为：无产阶级是反对压迫的武器，是永恒革命的工具。他们既是自己所渴望的自由的裁决者，也是其执行者，他们应当而且必将为争取这种自由而战。\n\n第三种观点认为：革命已然完成并持续推进，法国的无产阶级已获解放，无论未来风雨如何变幻，我们都将捍卫他们的自由，并使之成为革命的脉搏。"
 france.163.e:0 "人民是革命的主体"
 france.163.t:0 "无产阶级与工人阶级问题"
 france.164.a:0 "国家必须捍卫革命并保护文化"
 france.164.b:0 "国家必须推进全球革命"
 france.164.c:0 "国家注定消亡！"
 france.164.d:0 "国家问题一直是共产主义和社会主义思想中争议不休的议题，自马克思与恩格斯的著作问世以来便是如此。这是我们最根本的分歧所在，哪怕与最亲密的同志亦是如此。我们必须就此打住，为国家问题下个定论。\n\n主流观点认为国家必须存在，它是保护无产阶级和人民的重要基石。国家应当在国际层面致力于解放其他劳动者，始终以推动全球解放为己任。这一立场虽广受认同，但仍有诸多争议。\n\n无政府主义者主张——国家本身就是对工人的压迫。其存在在本质上便是强迫工人屈从于特权阶级建立的制度。尽管这一观点在库帕非正式领导的圈子外鲜有认同，但我们必须予以考量。毕竟，就连马克思也曾有类似于废除国家的主张和期许。\n\n另一方面，托洛茨基主义者及其思想同路人提出：国家存在的唯一目的应是持续推进革命社会建设。工人可在必要时利用国家作为抗争工具，通过持续推翻压迫者来维护永久革命，推进无产阶级权益。这种“国家即斗争武器”的辩证思维，在工人运动遭遇挫折时尤具吸引力。\n\n因其具有历史决定性意义，这一决定必须慎之又慎。无论结果如何，关于国家地位的抉择都将永远铭刻在法国革命史册——它决定着革命航向的罗盘指向，是法国革命方向的关键所在。"
 france.164.e:0 "国家必须继续革命并推动社会进步"
 france.164.t:0 "国家问题"
 france.165.a:0 "洛芒将担任这一职务！"
 france.165.b:0 "阿尔托必能担此重任！"
 france.165.c:0 "库帕特才是理想人选！"
 france.165.d:0 "革命正进入历史转折性的历史关头，我们需要统一革命各大派系的力量，确保其成果能够深深嵌入法国的历史遗产、政治体制、社会结构和公民思想之中。为此，我们必须慎重选择革命的首席代表人物。这个人不光将为革命代言，还将成为人民发声的最重要渠道，国家团结的生动象征。\n\n目前在议长候选人名单上，以下人物作为最有竞争力的人选进入了人民的视野：让-吕克·梅朗雄，不屈法国的创始人，长期在政治建制派中扮演左翼领袖的角色，拥有其他候选人难以企及的政治运作的丰富经验和在人民最大公约数中的深厚威望；此外，也有数位在选举政治中表现活跃的新人民阵线成员与梅朗雄并驾齐驱，包括新反资本主义党的代表，对布尔乔亚资本主义采取不妥协斗争态度的汽车工人菲利普·洛芒，以及领导了工人斗争运动，能言善辩的娜塔莉·阿尔托，她和普图都在立场上接近托洛茨基主义。\n\n此外，来自政坛之外的入局者也吸引了众多目光：无政府主义活动家朱利安·库帕特，曾蹲过马克龙政府的大牢，他的激进主张与实践有目共睹；而在其中最引人注目者大概是迪迪埃·达南克斯，一位多产的作家，长期和共产主义阵营保持密切联系，他以自己犀利的文笔批判腐朽的社会现实和不平等的阶级经济矛盾从而为自己赢得了无产阶级人民的欢迎、反动派们的仇恨与温和派们的忧虑。\n\n那么，人民的选择是……"
 france.165.e:0 "达南克斯脱颖而出！"
 france.165.f:0 "梅朗雄是这方面的贤才！"
 france.165.t:0 "国会议长人选"
 france.166.a:0 "革命万岁！"
 france.166.d:0 "当一切尘埃落定之时，革命的前景已然明了，前所未有的光明前途已在法兰西人民面前开启。\n\n当革命开始有被修正主义者和资本主义反动派的邪恶同盟篡夺的风险时，爱国者们并未坐视旁观。在真正的革命领袖们的带领下，针对革命的夺权阴谋已被扼杀在了摇篮里。就如同1789年的先行者们一样，果断出击是唯一且最好的选择。\n\n从现在开始，我们可以真正甩开一切阻碍，在法兰西绘制自己的革命蓝图。我们将重振被资本主义毒化的价值观，稳定国内秩序以团结绝大多数人民，着眼于建设以扫除一切旧政府的积弊。法国的社会主义将不再像潮水一般时起时落，而是作为傲然屹立的灯塔照亮这命运多舛的伟大国家的未来。"
 france.166.t:0 "革命爱国者掌权"
 france.167.a:0 "粉碎虚伪神像！"
 france.167.d:0 "当一切尘埃落定之时，革命的前景已然明了，前所未有的光明前途已在法兰西人民面前开启。\n\n在温和且彬彬有礼的体面外表下，意欲破坏革命的黑恶势力已然露出了真面目，差点将法兰西引入歧途。只有通过坚决且强硬的手段才能让法兰西人民清醒过来，并反抗反革命分子们的阴谋诡计。我们将让广大无产阶级意识到，没有那些腐蚀政权的内部食利者，那些僵化了无生气的官僚，那些议会内巧舌如簧的掮客，那些自吹自擂的街头活动家，革命事业依然能够继续下去并能够成功。\n\n当革命被交付于人民之手，成为一项真正属于人民的政治运动，革命的保卫者们自然将会激流勇退，但这并不意味着他们将退出政治生活，而是将与人民站在一起，投身于改变历史的浩浩汤汤大潮之中。"
 france.167.t:0 "反反动派崛起"
 france.1671.a:0 "粉碎这些暴君！"
 france.1671.b:0 "我们必须挽救革命！"
 france.1671.d:0 "一名新入局的玩家正对混乱的共和国政坛产生愈发无法忽视的影响，而我们尚无法下定论这种混乱是福是祸。尼古拉·卡萨诺瓦，将军和斯特拉斯堡的军事长官，集结了其志同道合者并宣布成立名为“法兰西革命卫队”的政治组织，其名称莫名与伊拉克、伊朗等国的“伊斯兰革命卫队”颇有相似之处，而在行事风格上甚至亦有重合之处。\n\n作为一名军人，卡萨诺瓦主张以铁腕治国，将军事原则与社会主义融合并主导法国社会的方方面面。他对文化传统态度宽容，但也对苏联式的集权与压制政策情有独钟。他将自己的革命卫队视作类似苏联共产党的革命先锋队的培养皿。出于对普遍的败战衰颓的回应，卡萨诺瓦将向俄罗斯成功复仇视作法国革命的最高目标，并呼吁建立全面的国防体制。卡萨诺瓦的势力在政治光谱中与众新雅各宾政党走近，但在集权和好战层面更显激进。他会成为法国的斯大林吗？又或者只是个布朗热式的野心家？"
 france.1671.t:0 "保守派崛起"
 france.168.a:0 "黑色革命万岁！"
 france.168.d:0 "当一切尘埃落定之时，革命的前景已然明了，前所未有的光明前途已在法兰西人民面前开启。\n\n“从来没有什么救世主，也没有什么神仙皇帝；要创造人类的幸福，全靠我们自己！”革命斗争的最终目标绝非培育起对另一种权力的崇拜或对秩序的顺从。正相反，只有当人民不再敬畏任何权威和统治者，坚定自己主宰自己命运的决心，并团结起来反对任何试图凌驾于他人之上的尝试之时，革命才算真正成功。而现在，我们将加速这一进程。\n\n经过多年的艰苦斗争和不懈呼吁，自由意志共产主义联盟，这一脱胎于无政府主义运动和工人联盟的人民平台终于走到了聚光灯下。任何变质的异动都将被严防死守；掌权绝不会让我们松懈，正相反，这将只会鼓励我们继续向政治、经济、环境、文化、身份等一切领域的不平等开战，并最终消灭旧秩序的最后残余。"
 france.168.t:0 "自由意志共产主义联盟掌权"
 france.169.a:0 "玫瑰革命万岁！"
 france.169.d:0 "当一切尘埃落定之时，革命的前景已然明了，前所未有的光明前途已在法兰西人民面前开启。\n\n法国人用自己的选择向世人证明，欧洲的社会主义革命能够通过全新的表现形式在21世纪再次焕发光彩。不屈法国，作为新人民阵线的主心骨，过去数年来在众多资产阶级代言人沆瀣一气的腐败政权核心坚持斗争，反抗一切政权强加给人民的不公。如今，当昔日的反抗者也成为了当权者，一个崭新时代的帷幕正在法兰西人民面前缓缓拉开之时，许多人心头都萦绕着一个疑问：革命是否还能继续下去？历史是否会再次发生倒退？\n\n不屈法国的领袖们坚信，这一恐怖前景绝不会在自己手中发生。是时候蜕去笼罩在玛丽安娜身上的血色长袍了。从今以后，法兰西人民珍视的博爱精神将被重新唤醒，而革命将成为引领人性根源最深层变革的全新运动。"
 france.169.t:0 "不屈法国掌权"
 france.170.a:0 "世界革命万岁！"
 france.170.d:0 "当一切尘埃落定之时，革命的前景已然明了，前所未有的光明前途已在法兰西人民面前开启。\n\n工人阶级长期以来为法国的进步事业和人权斗争作出了无可替代的决定性贡献。无论是创造财富还是打造平等社会，工人们始终冲在第一线，他们是最无愧于法兰西人这一英名的群体。也正因如此，过去数百年来针对工人阶级的打击和压迫也最为残忍和沉重，但这一切在今日都将画上休止符。一个真正代表了全体工人正义事业和响亮口号的政党从今天开始领导法国革命与社会主义建设事业。\n\n工人斗争运动不光着眼于解决当前法国的资本主义反动残余，他们也将视野放到国境线之外。在欧洲，在全世界，无数工人阶级兄弟姐妹正用自己的双手为自己争取幸福，而法国工人的奋进将成为激励他们并吹响对腐朽世界总进攻的号角。"
 france.170.t:0 "工人斗争运动掌权"
 france.171.a:0 "解放！"
 france.171.d:0 "自巴黎公社的烈焰熄灭，法兰西便在迷雾中漂泊近两个世纪，彷徨无依，踽踽独行于歧途之间。一次次跌入政治的泥潭，步履蹒跚，徒耗光阴。狭隘的民族主义如毒蛇般盘踞，孤立主义的阴霾挥之不去，直至二十一世纪，仍残存于社会肌理。然而，今日，法兰西的命运将迎来彻底的改写。\n\n自内战胜利以来，我们成功铲除了军国主义者与所谓的自由派资产阶级资本家——这两股势力皆在国家的废墟上狂欢，趁混乱攫取权力。他们口口声声宣扬平等与自由，然而他们的所作所为，却只留下死亡与鲜血。\n\n我们战胜了最终之恶，证明了自身的正义。曾被视为不可能之事，如今已化作现实。我们驱逐了纳粹污秽，荡涤了法西斯残渣，完成了当年义勇军在二战时期尚未能实现的壮举。至此，我们真正将法兰西从资本家与法西斯的掌控中解放出来。\n\n这场革命，不仅属于法兰西，更属于她的人民。自今日起，人民不再受制于昏庸政客，不再沦为资本的傀儡。生产资料将归于工人，所有人都将远离饥寒，无人再流离失所。自此刻起，人民为尊，国家为仆。因为，没有人民，何来国家！"
 france.171.t:0 "新纪元"
 france.199.a:0 "科西嘉属于法国！"
 france.199.d:0 "科西嘉岛的紧张局势已急剧升温，全岛范围内骚乱频发。伊万·科隆纳在狱中被圣战者囚犯暗杀一事，如同火星落入干柴，瞬间点燃了科西嘉民族主义者的长期积怨，他们视科隆纳为独立运动的英雄。\n\n抗议浪潮迅速席卷主要城市，示威者纷纷走上街头，指责法国政府的不作为，并以此作为理由呼吁科西嘉独立。抗议活动愈演愈烈，抗议者与警方之间的冲突不断升级，科西嘉岛正站在动荡的风口浪尖，法国政府也因此陷入了两难的境地：既要坚决维护岛上的法律与秩序，又要妥善解决科西嘉民族主义者的诉求与不满情绪。"
 france.199.t:0 "科西嘉爆发动乱"
 france.1991.a:0 "他死了！把他忘了吧！"
 france.1991.d:0 "科西嘉岛的骚乱持续加剧，暴力事件频发，街道上遍布着路障，抗议者与安全部队的冲突日益频繁。\n\n这场动荡导致科西嘉岛陷入全面瘫痪，商业活动停滞，交通系统崩溃。随着局势的每况愈下，科西嘉的未来变得愈发不确定，更猛烈的暴力冲突随时可能爆发。"
 france.1991.t:0 "科西嘉暴乱愈演愈烈"
 france.2.b:0 "推翻马克龙集团！"
 france.200.a:0 "和平实现！"
 france.200.d:0 "经过数周的动荡，科西嘉岛的骚乱终于告一段落。法国政府为平息冲突所做出的努力，得到了心怀和平解决事端期望的科西嘉民众谨慎而乐观的回应。随着局的逐渐稳定，科西嘉开始着手评估这场骚乱所造成的损失。昔日繁华的街道如今遍布废墟，企业奋力挣扎以求恢复，而冲突的阴影依旧深深烙印在人们的心中。科西嘉岛的未来仍有许多未知与挑战，人们不禁担忧是否能够实现真正的长久和平，还是这座岛屿将再次陷入暴力的漩涡之中。"
 france.200.t:0 "平定科西嘉"
 france.201.a:0 "政治先停，安全第一！"
 france.201.d:0 "随着局势的迅速恶化，2027年法国大选因俄欧紧张关系的急剧升温而被紧急叫停，此举旨于法国深陷外交漩涡之际维护国家安全。面对日益逼近的冲突威胁，政治领袖们一致认同，当前首要任务是摒弃党派纷争，转而全力确保国家在外部压力下的安全与稳定。\n\n大选暂停的消息一经传出，社会各界反应纷呈。有观点认为，在当前紧迫局势下，此举作为预防性措施实属必要；也有声音表达了这一措施或将阻碍民主制度的忧虑。但无论如何，这一决定无疑彰显了当前形势的严峻性，以及面对潜在威胁时，全国上下团结一心、共克时艰的迫切需求。"
 france.201.t:0 "大选暂停！"
 france.202.a:0 "荣耀归于[FRA.GetLeader]！"
 france.202.d:0 "在一个动荡不安、政治局势不明的时代，巴黎街头的坦克轰鸣惊醒了法国民众。今晨，[FRA.GetLeader]与法国武装部队共同宣布，由让-吕克·梅朗雄领导的社会主义文官政府已被推翻。军方严厉指责梅朗雄政府背叛国家利益，企图将法国推向共产主义。\n\n在全国讲话中，[FRA.GetLeader]强调：“我们不能容忍一条将伟大祖国引向深渊的道路。梅朗雄的领导让法国滑向共产主义，这是对我们理想与历史的背叛。我们宣布建立第七共和国，它将成为国家利益和稳定的真正守护者。”\n\n全国范围内的安全措施已全面升级。部队在街头巡逻，战略要地也被军队控制。许多亲梅朗雄的政要和支持者已被捕，他本人也被软禁。尽管大多数法国民众对此表示不满，但目前仍选择保持克制。"
 france.202.t:0 "军方推翻政府"
 france.203.a:0 "就如字面意义那样，一切都结束了……"
 france.203.d:0 "在至暗之际，我们亦迎来了最深的屈辱。我们的外交官踏上前往维也纳的旅途，去签署那份沉重的投降条约——北约的溃败已成定局。我们已是强弩之末，华沙陷落，布达佩斯失守，布拉迪斯拉发亦未能幸免，而俄罗斯的铁蹄在废墟之上，铸造出新的傀儡政权，牢牢攫取着东欧的命运。我们倾尽半个十年的努力备战，然而，最关键的决战时刻，我们却功败垂成。世界将铭记这一日，它不仅是我们的耻辱，也是俄罗斯对欧洲霸权的最终加冕。"
 france.203.t:0 "维也纳条约"
 france.2031.a:0 "发生了啥？"
 france.2031.d:0 "梅朗雄于下午在马提格斯市街头漫步时，突遭三名当地警察拦截。紧接着，这三名警察默契地关闭了执法记录仪，局势瞬间紧张升级。两名警察迅速控制住梅朗雄，而另一名警察则开始宣读梅朗雄对法国所犯罪行的清单，并随后对这位前政治人物连开两枪。该事件被现场视频记录，并在互联网上迅速流传，引发了公众的广泛沮丧与不满，许多人纷纷指责日益专制的军事顾问委员会。"
 france.2031.t:0 "梅朗雄在马提格斯遭遇枪击"
 france.2032.a:0 "你该把这场仗打得更好！"
 france.2032.d:0 "对俄战争的失败给法国的民族主义者和退伍军人带来了沉重的打击，他们深感政府在战争处理一事上背叛了他们。在法国北部这一民族主义情绪高涨且退伍军人聚集的地区，针对政府的抗议活动迅速爆发。众多参战老兵要求政府说明战败缘由，并强烈要求追究相关责任人的责任，同时批评政府未能捍卫法国在战场上的利益和荣誉。\n\n抗议浪潮迅速席卷开来，数千人涌上街头，愤怒与失望之情溢于言表。部分抗议者主张采取更为强硬的外交政策，而另一部分人则要求政府官员下台。法国北部的抗议活动严重冲击了政府的权威，局势有进一步升级为更大规模冲突的风险。"
 france.2032.t:0 "老兵在北部地区抗议"
 france.2033.d:0 "对俄战争的失败使得法国社会深陷分裂……《维也纳条约》一经签署，各大城市随即掀起了抗议浪潮。抗议队伍主要由社会主义者、共产主义者及无政府主义者团体构成，他们严厉批评政府对战事的应对措施，并呼吁推行更为和平与公正的外交策略。\n\n抗议活动迅速蔓延至法国南部各地，规模持续扩大，态势愈发激烈。政府虽竭力平息事态，但局势依然动荡。为维持秩序，北方尚未发生叛乱的军队被紧急调往各地，进而引发了抗议者与安全部队之间的激烈冲突。"
 france.2033.t:0 "法国南部升起红旗"
 france.2034.d:0 "当对俄战争失败的消息传到法国后，民众普遍感到愤怒与失望，各大城市随即爆发了要求结束战争及改革政府政策的抗议浪潮。在巴黎，抗议活动迅速升级为暴力骚乱，无政府主义者和共产主义者趁机煽风点火，加剧了局势的动荡。\n\n在一片混乱中，法国政府失去了对首都的有效控制。政府建筑相继被占领，骚乱者仓促间组建了一个革命委员会。该委员会公然宣布将依据无政府主义和共产主义原则建立新秩序，并同时宣布解散现有政府。然而，随着夜幕的降临，这场叛乱似乎仅限于首都巴黎及南部各省，尚未波及全国。"
 france.2034.t:0 "警方被赶出巴黎"
 france.204.a:0 "天佑共和国！"
 france.204.b:0 "我们必须做出选择！"
 france.204.d:0 "在今晨一场令人震惊的国民议会演说中，国防政府首脑，[FRA.GetLeader]将军宣布还政于民。他指出，欧陆战争以法国和其盟友的胜利告终，证明国防政府和战时体制已发挥了它们的历史使命；法国需要一个稳定的文官政府使一切能够“回归正轨”。[FRA.GetLeader]强调，他无意让法国继续在军政府的统治下进入新时代，他也没有继续担任法国最高领袖的精力和野心；尽管国防政府体制将不再延续，但法国国家武装力量将继续尽忠职守，履行保卫国家的职责。\n\n将军的退位声明在法国内外引发了轩然大波。在主流媒体对其高风亮节的盛赞声之外，许多人的注意力也开始聚焦于一个更关键，更现实的问题——谁将成为继承国防政府大统的文官政府领导者？从左到右，许多政党已争先恐后地发表声明，一边称赞将军的明智之举，一边开始进行选举动员；与此同时，从学者到普罗大众，许多人在反思旧政府功过的基础上，也提出应将此作为改革法国宪政制度，使之重新发挥活力的最佳机会。"
 france.204.t:0 "重建文官政府"
 france.205.a:0 "厚积薄发"
 france.205.d:0 "随着最新一届国民议会终得召开，一个重大问题也紧接着浮出水面，成为摆在议员诸公和政府部长们面前的首要任务——制订新财年的政府预算案。对历届政府来说的必要之举如今对我们来说却是无比艰难，这主要是由目前特殊的政治环境所决定的——政治体制刚刚从适应战争的军政府转轨为文官政府，政治秩序急需重建，除军工以外的各大产业处在百废待兴的状态。与此同时，军队在政治领域的势力仍树大根深，高级军官们仍难以割舍掌权多年带来的丰厚利益；而在另一边，国民议会中新近才重获话语权的各大政党们似有再启互相攻讦之势。\n\n我们绝不能再迎来一次政府停摆的危机。政府首脑们已经下定决心，以最快的速度制定好新预算案，并投入全部政治资源予以推行。为了尽快让法国迎来复兴，我们大大增加了对民生和基础行业的投入，不得不压缩重工业与军事领域的投资。显而易见，这将引发新一轮的文官政府与军队之间的博弈，但治国理政本就是在细水长流之中争取平衡的艰巨任务和微妙游戏。"
 france.205.t:0 "重新安排预算费用"
 france.206.a:0 "欢迎从群星之中回家！"
 france.206.b:0 "足以鼓舞一代人的伟大新星！"
 france.206.c:0 "太空中的爱国者！"
 france.206.d:0 "昨日振奋人心的消息传来，法国政府已经成功将美国宇航员从国际空间站接往地球。美国本土持续的内战对滞留空间站的三名宇航员——杰西卡·沃特金斯，罗伯特·海因斯和凯尔·林格伦制造了相当大的麻烦，他们的国家陷于混乱而无法做出回应。这些美国宇航员们的补给所剩无几，给返航带来了很大的困扰。法国方面在从美国手中接管国际空间站的几小时内，就组织了一次漫长而成功的返航行动，[FRA.GetLeader]宣布他们业已安然返回地球。欧洲空间局通告称法国的利奥波德·埃亚尔茨，托马斯·佩斯凯和德国的马蒂亚斯·毛雷尔会接替三位美国宇航员的国际空间站任务。总统拜登向法国政府发出了贺电，并公开宣布会尽快让宇航员们回到祖国。然而，考虑到美国正处于内战的境地，对于安全问题的担忧之声仍不绝于耳。无论如何，两国政府都为挽救日益分崩离析的世界而做出了难能可贵的努力。"
 france.206.e:0 "来自群星的真正美国人！"
 france.206.f:0 "加加林与阿姆斯特朗的精神引领他们……"
 france.206.g:0 "再多点西方宣传！是我们先出价的！"
 france.206.h:0 "迟早我们也会登月的……"
 france.206.i:0 "终有一天，我们也会飞向那天空…"
 france.206.t:0 "法国成功从国际空间站接回美国宇航员"
 france.207.a:0 "恐惧震撼太空！"
 france.207.b:0 "向他们的家人致以最诚挚的问候……"
 france.207.c:0 "太空军的第一起悲剧……"
 france.207.d:0 "今日，法国传来骇人听闻的消息：多份报告证实，一艘载有美国宇航员自国际空间站返程的航天器不幸爆炸。此时，美国正深陷内战泥潭，这对于仍在国际空间站上工作的三名美国宇航员——杰西卡·沃特金斯、罗伯特·海因斯和谢尔·林德格伦而言，无疑是雪上加霜，因为他们忠诚效命的祖国已陷入一片混乱，无法自拔。随着补给日益减少，美国宇航员在安排返回地球的事宜上遭遇了重大难题。法国及欧洲航天局曾尝试协助他们返回，但执行任务的航天器却突发严重故障。该航天器原定的发射时间已被推迟，而在尝试将宇航员送回地球的过程中，它与欧洲航天局和法国当局失去了联系。据地面控制中心的仪器数据和目击者陈述，事故起因疑为燃料泄漏，随后引发的剧烈爆炸导致飞船上的美国宇航员不幸遇难。对此，拜登总统仅发表声明，对在这场灾难中逝去的美国宇航员表示深切哀悼。[FRA.GetLeader]也宣布将全力搜寻坠机残骸中的遇难者遗体。欧洲和美国的民众对此次悲剧深感震惊，沉浸在无尽的哀痛之中。"
 france.207.e:0 "英雄在群星中陨落……"
 france.207.f:0 "革命之星更加闪耀……"
 france.207.g:0 "西方产品常见的明显缺陷"
 france.207.h:0 "关于欧洲工程能力不足的铁证"
 france.207.t:0 "美国宇航员在从国际空间站返回途中因爆炸遇难！"
 france.208.a:0 "小额投资，高额回报"
 france.208.d:0 "经过一场漫长血腥的冲突，沙特阿拉伯的核心区域已受重创。阿拉伯共和国已战胜其对手，并向我们联络以兑现其协议承诺。\n\n我们对他们的财政和外交支持是其取得胜利的原因，他们将在未来很长一段时间内对此心怀感激，这也为我们扩大在该地区的影响力提供了一个契机。尽管重建尚需时日，但法国公司在战后混乱中仍不乏填补空缺的良机。"
 france.208.t:0 "阿拉伯共和国的胜利"
 france.209.a:0 "关于此协议……"
 france.209.d:0 "内战终近尾声，战争的阴影逐渐消散。沙特政权已明确战胜对手。\n\n我们支持沙特合法政府并提供财政援助，助力其成功确保了半岛的和平。他们对此深表感激，为我们在该地区扩大影响力带来了宝贵机遇，我们必将紧握这一契机。"
 france.209.t:0 "沙特阿拉伯维持现状"
 france.210.a:0 "确认"
 france.210.d:0 "昨夜，随着俄军残余部队被驱逐出关键战略港口城市新罗西斯克，炮火轰鸣与战机掠空的声响逐渐消隐。我方武装力量的势不可挡之势，再次将俄国巨熊的嗜血獠牙生生折断，沿途只留下BMP步兵战车燃烧的残骸，以及俄军无尽的耻辱与羞辱。\n\n新罗西斯克的收复是战争的又一个转折点，这不仅严重削弱了俄罗斯在黑海地区的军事存在，更令其失去了全国最大的商业港口。这场侵略战争已彻底逆转态势，如今战火正席卷侵略者自己的国土。"
 france.210.t:0 "占领新罗西斯克"
 france.2100.a:0 "可恶！"
 france.2100.d:0 "当我们正被其他事务分散精力时，一则重磅坏消息传来：蛰伏了一段时间的俄罗斯再次露出了其侵略扩张的獠牙，夺取了库班共和国的新罗西斯克。该共和国是自第一次欧陆战争战败后在原俄罗斯高加索领土上成立的民主共和国，受到法国和欧盟军队的保护。对高加索诸国边界的重新划定本意是为限制俄罗斯在当地的影响力，同时确保其实力不足以立刻恢复到能够进行快速扩张的水平。但事实证明，俄国人对领土的渴望比什么都强烈，对一块在欧亚两洲边界战略位置险要的传统领地则更是如此。\n\n通过政治和军事双管齐下的战略，俄军几乎不费吹灰之力便进驻了新罗西斯克。身陷斯拉夫大军的天罗地网，纵使法军在神通广大，也只能灰溜溜地借助库班共和国提供的海上和空中航线撤离当地。这一事件沉重打击了法国在高加索地区的威信，也意味着俄罗斯重新走上扩张之路的第一块多米诺骨牌被推倒了。"
 france.2100.t:0 "俄罗斯夺回新罗西斯克"
 france.211.a:0 "确认"
 france.211.d:0 "法国武装部队最高参谋部正式宣布，我军已成功攻占黑海战略要塞刻赤。经过激烈的战斗，我军装甲师和空降部队向该城发起了协同攻击，迅速占领了刻赤海峡两侧的关键据点。在精确的火力打击下，敌军迅速崩溃，其指挥结构被瓦解，大量武器装备被缴获。\n\n刻赤海峡是连接克里米亚半岛和欧亚大陆的重要通道，具有极其重要的战略意义。这次胜利有效切断了南线敌军的补给线，为后续行动铺平了道路。初步评估显示，我军已缴获数十辆敌装甲车、十余套火炮系统和多个完好的军事设施。"
 france.211.t:0 "夺取刻赤"
 france.2110.d:0 "法国武装部队最高参谋部正式报告称，经过72小时的连续作战，我军主力装甲部队成功夺取了黑海东岸重要战略城市索契的控制权。在城市战中，我军步兵和装甲部队进行了系统的清剿行动，逐个街区地确保了城市的安全。敌人试图在中心区进行最后的抵抗，但在持续猛烈的火力打击下，他们士气崩溃，大批士兵投降。\n\n索契的战略意义在于它是通往高加索的重要门户和黑海主要港口。这一胜利使我们完全控制了黑海东部海岸线，有效切断了敌人在南部的海上补给线。与此同时，我们的工兵部队已开始修复受损的基础设施以支持正在进行的军事行动。前线装甲维修部队建立了临时维修站，以确保前线战备状态。"
 france.2110.t:0 "占领索契"
 france.2111.a:0 "可恶！"
 france.2111.d:0 "尽管我们已倾尽全力，但俄罗斯营战斗群仍成功全面夺回并占领了索契市，这是俄罗斯乃至整个高加索地区最大的度假城市之一。尽管我军驻扎在市中心及郊区的部队为坚守战线进行了英勇顽强的战斗，但俄罗斯动员兵及其他部队的持续猛攻迫使我方驻城旅队做出了艰难而必要的决定，即放弃城市及周边地区，转而以协调炮击和精确空袭将城市夷为平地，以阻止俄军在该地区的进一步推进。\n\n尽管索契的失守给我们带来了战略和士气上的重大打击，但法国指挥部仍对继续在高加索地区开展进攻行动充满信心，以遏制俄罗斯的侵略，并将战火烧向这头嗜血的巨熊本土。"
 france.2111.t:0 "俄罗斯夺回索契"
 france.212.a:0 "我有点饿了……"
 france.212.d:0 "近日，示威者以令人震惊的抗议方式，将标志性的《蒙娜丽莎》画作泼洒上一层油污。这一大胆的举动旨在凸显围绕化石燃料和环境恶化的紧迫问题，将全世界的目光转向气候危机。示威者选择历史上最知名的画作之一，试图打破围绕气候不作为的自满情绪，将这幅著名的艺术品用作文化遗产面临风险的有力象征。\n\n油污覆盖在《蒙娜丽莎》上的画面形成了鲜明的对比，将艺术之美与环境破坏的严酷现实并置。抗议者认为，这样的行动对于唤醒一个对地球逐渐毁灭逐渐变得麻木的社会来说是必要的。他们的目标是引发关于我们对化石燃料依赖的影响以及对系统性变革的需求的对话。然而，批评者谴责这一行为是破坏公物，质疑针对艺术品是否真的能够激发所需的行动，或者疏远在争取气候正义斗争中的潜在盟友。"
 france.212.t:0 "蒙娜丽莎被泼汤"
 france.2120.a:0 "可恶！"
 france.2120.d:0 "俄军以令人震惊的速度登陆并夺取了刻赤古城，完全出乎我方预料。守军为保全建制不得不仓促撤离，匆忙撤退中遗弃大量武器装备，这种溃败场景诡异重现了战争初期敌军从该地区撤离时的画面。此次失守标志着自2014年我方武装力量与盟友接管克里米亚半岛后，俄军首次在此获得正式立足点。\n\n刻赤的易手毫不意外地为敌军注入强心剂。前线报告显示，俄方正企图乘势推进，妄图全面解放整个克里米亚半岛。尽管失守刻赤的影响不容小觑，但我军遏制俄国战争机器的努力必须坚定不移。我们必须阻止敌方战斗人员在克里米亚半岛及其他战线继续取得突破性进展，为未来战局筑牢防线。"
 france.2120.t:0 "俄罗斯夺回刻赤"
 france.213.a:0 "呃，伙计们，咱们这样传递信息可不行啊"
 france.213.d:0 "在一场大胆且备受争议的抗议行动中，示威者们近期将汤泼向了梵高的名画《花瓶里的十五朵向日葵》，以此作为抗议的目标。这一惊人的举动不仅仅是对一件备受喜爱艺术品的攻击；它更是一种刻意为之的声明，旨在引起人们对气候变化和环境恶化等紧迫问题的关注。通过选择这样一件备受瞩目的作品，抗议者们试图引发一场关于我们自然世界脆弱性的对话，正如梵高所精美捕捉到的那些充满活力的花朵所象征的那样。\n\n选择汤这种日常用品，象征着气候危机的紧迫性和可及性。虽然一些人批评该行为是故意破坏，但支持者们认为这是必要的警钟。在一个自然之美日益受到威胁的世界里，名画与环境忽视的严酷现实并置，突显了立即采取行动的必要性。汤泼在画上的视觉冲击提醒我们，我们所珍视的艺术与维持生命存在的生态系统息息相关。"
 france.213.t:0 "花之汤"
 france.214.a:0 "那么这次的党名该怎么写？"
 france.214.d:0 "法国总统埃马纽埃尔·马克龙所属的共和国前进党现已更名为复兴党，这一消息由该党执行主任斯坦尼斯拉斯·盖里尼今日正式宣布。\n在前法国总理、中右翼政党地平线党创始人爱德华·菲利普和民主运动党领袖弗朗索瓦·贝鲁的陪同下，盖里尼透露了三党计划在下月法国议会选举前组建选举联盟的消息。他还指出，复兴党将推出400名议员候选人。\n\n盖里尼解释称，选择“复兴”作为新党名，旨在表明该党将“永远秉持启蒙精神，拒绝蒙昧主义”。他还强调，该党将“向所有公民、当选官员及地方当选官员开放，不论其出身何处”。此外，这个名称也是马克龙在2019年欧洲议会选举中政党名单所采用的。"
 france.214.t:0 "马克龙将其党派更名为“复兴”"
 france.215.a:0 "美好的，甜美的胜利……"
 france.215.d:0 "欧洲与乌克兰的军队一同在基辅街头游行，并受到了民众的热烈欢迎与欢庆。此次游行不仅展现了军事实力，更是欧洲各国与乌克兰之间深厚友谊的体现，共同彰显着对和平、民主及共同价值观的坚决捍卫之情。于城市行进中的士兵被赞誉为英雄，他们在抵抗侵略中展现出的勇敢与牺牲精神赢得了人们的崇高敬意。这场胜利游行有力地表明，在欧洲乃至全球追求和平与安全的过程中，团结与合作至关重要。"
 france.215.t:0 "基辅胜利阅兵"
 france.216.a:0 "军国派胜出！"
 france.216.b:0 "给中间派第二次机会"
 france.216.c:0 "军方的行为违反了旧宪法！"
 france.216.d:0 "随着法兰西第七共和国首次选举的临近，各大政党间的意识形态分歧愈发明显。支持军方暂停民选政府的皮埃尔·德维利耶创立了其新党法国胜利联盟，并提出加强国防、在全球事务中保持军事优势，以及强调国防工业对经济增长和军事荣耀的重要性。\n与此相反，弗朗索瓦·贝鲁领导的人民民主联盟则试图融合马克龙的理念与其他左翼小党派的观点，其代表广泛的中间派立场，旨在平衡军事力量与社会福利及经济繁荣之间的关系。他们倡导务实治理，力求在稳定和进步的旗帜下团结全国。\n此外，还有由入狱的梅朗雄支持、前总理埃里克·科克雷尔领导的进步复兴党。\n\n法国正处于关键时刻，此次选举的结果不仅将决定国家的未来走向，还将揭示法国社会在过去十年中第二次制定新宪法时所面临的深刻分歧。"
 france.216.t:0 "第七共和国首次大选"
 france.217.a:0 "社会主义的胜利！"
 france.217.b:0 "全世界自由主义者的胜利！"
 france.217.d:0 "随着法国第六共和国首次选举的到来，政治舞台主要由两大政党——至优党与联合变革所引领。此次选举堪称法国历史上的关键时刻，因为它将决定国家在新宪法框架下的未来发展路径。\n\n至优党在安盛集团前董事长兼首席执行官亨利·德·卡斯特里的带领下，秉持个人自由、自由市场及有限政府的传统自由主义理念。该党魅力四射的领导人承诺通过放宽管制和推动私有化来实现经济增长与繁荣。而联合变革则倡导社会正义、平等以及政府积极干预以解决社会问题。他们重视福利项目、工人权益和环境保护，吸引了渴望更加包容和平等社会的人们。\n\n这次具有历史意义的选举结果，不仅将深刻影响国内政策的制定，还将决定法国在全球舞台上的角色与立场，凸显第六共和国内部不同的意识形态与价值观。"
 france.217.t:0 "第六共和国首次选举"
 france.218.a:0 "梅朗雄宪法维持不变"
 france.218.b:0 "我们需要一部新宪法"
 france.218.d:0 "俄乌战争后，面对日趋不确定的地缘政治，法国正处于宪法的重要转折点。第六共和国宪法倾向于社会主义，重视社会福利与民主原则，但战后军方恢复文官统治的举动引发了对其的质疑。\n\n维护第六共和国的支持者认为，该宪法体现了法国的价值观——自由、平等、博爱，为民主社会奠定了稳固基础。他们坚信，维持这一宪法对于维护社会团结和保障公民权利至关重要。然而，支持制定第七共和国宪法的人则主张，法国需要一个更为强大和集中的政府，将重心放在国家安全和军事实力上，以应对多变的国际环境。他们认为，采取更军事化的策略对保障法国安全和维护其在国际舞台上的利益至关重要。"
 france.218.t:0 "抉择宪法"
 france.219.a:0 "法兰西万岁！"
 france.219.d:0 "尽管初期面临担忧且被一度暂停，现任党派依然在2026年选举中取得了压倒性的胜利。法国民众在俄乌战争的余波中艰难前行，但他们毅然选择了信任当前政府资深领导的引领。新获授权的政府承诺，将全力投入到战后国家与民众在物质和精神层面的重建之中。\n\n这场胜利不仅夯实了政府的执政地位，更彰显了法国人民在艰难时期对稳定和持续发展的共同期盼。展望未来，政府将铭记战争中的牺牲，致力于为全体公民打造一个更加灿烂的前景。"
 france.219.t:0 "现任政府获胜"
 france.220.a:0 "战争即地狱"
 france.220.d:0 "法国因介入俄乌冲突而付出了沉重的代价，据报已有30,000名法国士兵在这场冲突中不幸牺牲。这一悲痛的消息震撼了整个国家，家家户户沉浸在失去亲人的哀痛之中，社会各界也在积极适应战争对本国造成的深远影响。这些英勇士兵的牺牲，深深触动了法国的集体心灵，凸显了战争的残酷无情以及它对人类社会的巨大伤害。\n\n然而，随着战争的持续，法国社会逐渐显露出战争疲惫的迹象。不断攀升的伤亡人数，以及支撑战争所需的经济负担，严重挫伤了民众的士气。公众的情绪正在悄然转变，越来越多的人开始呼吁终止这场冲突，将精力投入到国家的重建与心灵疗愈之中。我们士兵的英勇牺牲，是对战争代价的深刻警示，它不仅在战场上夺去了无数生命，更在后方亲人们的心中留下了难以愈合的伤痕。"
 france.220.t:0 "死亡人数超过30000"
 france.221.a:0 "猛烈进攻"
 france.221.d:0 "东方传来的灾难性消息如潮水般涌入——乌克兰政府已然崩溃，其残余势力正向东方的汹涌铁骑无条件投降。更令人愤慨的是，乌克兰及北约其他成员国参谋部成员竟公然将罪责归咎于我军。怯战、渎职、无能等指控如排山倒海般袭来。无论真相如何，这些诋毁已恶化了合作氛围，使协同作战难上加难，或将引发更大灾难。本已低迷的士气因此雪上加霜，军中甚至开始蔓延这样的忧虑：若不能速胜，整支军队恐将土崩瓦解。我们必须背水一战，死守德涅斯特河防线；一旦时机成熟，就当持续进攻，直至弹尽粮绝为止。军队的凝聚力、法兰西的声誉，乃至整个东欧的命运，皆系于此役。"
 france.221.t:0 "国耻"
 france.222.a:0 "批准"
 france.222.b:0 "否决"
 france.222.d:0 "致一切相关人士……\n因东欧地区的后勤问题所困，我军部队调动屡遭延误。有鉴于此，我请求将开始实施达武行动的最后期限再往后延期14天。\n法兰西万岁！\n\n签署，\n弗兰克·布代"
 france.222.t:0 "期限延长"
 france.223.a:0 "您的儿子"
 france.223.d:0 "今天，我已抵达巴黎的军营，正式迈入了基础训练的第一阶段，也就是他们所说的“黄色阶段”。在这个阶段，我需要适应军旅生活，学习纪律、团队合作、日程安排以及军队传统等。尽管目前还没有找到可以称兄道弟的战友，但我相信，随着训练的进行，我会和一起并肩作战的伙伴们逐渐熟悉起来。我知道你和爸爸一直不太喜欢城市生活，这也是你们对我被送到这里有些担忧的原因。但请放心，这里其实并没有你们想象的那么差。它位于一个相对偏远的区域，应该是第二十区，这里的氛围与真正的“城市生活”有所不同。现在，一想到我将要离开这么久，我的眼眶就不禁湿润了。我已经开始想念爸爸、农场和弟弟克里斯托夫，当然，还有亲爱的你。训练已经如火如荼地展开了，它对我的体能是一个巨大的挑战。不过，理论知识对我来说相对简单，因为这些都是我早已掌握的内容。我想，我们在农场培养的纪律性会对我接下来的军旅生活大有裨益，真心感谢你们的教导。夜晚，我总是怀揣着梦想，渴望在祖国最危急的时刻为其服务和战斗。能够帮助他人，并深知何为国家的最佳利益，这无疑是世界上最美好的感觉。我将以虔诚之心，英勇无畏、光荣地为国家而战。我希望自己不会仅仅是一名普通的士兵太久，因为我有着远大的志向。也许有一天，我能成为一名军事将领，带领我的人民对抗法国的敌人！我期待着这一天的到来。我还想知道军队里的伙食怎么样，不过，我想应该没有什么能比得上你童年时每天为我做的饭菜。我会想念这样和你聊天的日子，也会想念这里的一切。但是，你知道这就是这些信件的意义所在吧？我真的希望你们能把这些信件也给克里斯托夫和爸爸看。那样会让我感到无比温暖，因为我全心全意地爱着他们。\n\n此致，"
 france.223.t:0 "致我最亲爱的母亲，"
 france.224.a:0 "您的儿子"
 france.224.d:0 "今天我正式退役，即将在美国外籍军团中开启新的职业篇章。我深知，未征得你们同意便做出此决定，可能会让你们感到不安或愤怒，但请相信，我会确保自身安全，且我的选择是为了国家与世界的福祉。自两年前初入军营写下第一封信以来，时光匆匆流逝。我仍清晰记得初入军营的那天，一切既新奇又激动，我结识了许多优秀的人，然而如今已与他们失去联系。他们的面容在我脑海中挥之不去，我衷心祝愿他们平安。尽管在之前的回家探视中我已向你们提及这些，但如今我仍感受到周遭世界的动荡不安。这如同熊熊燃烧多年的大火，正在吞噬全球，侵蚀着人类文化，甚至是我们自身的文化。有人或许认为这只是危言耸听，但我坚信这是实实在在的威胁。2022年的选举结果令我深感失望，我对当权者的不满与日俱增。虽然你们可能不像我一样热衷政治，但你们很快会意识到，“政治”关乎一切，与所有事物紧密相连。我知道我将远离家乡，远离克里斯托夫、你和爸爸，尽管我并不愿如此，但这是必要的选择。许多战友已自愿加入我的行列，我找到了新的归属和兄弟情谊。他们中的许多人和我一样，也和你一样，对城市生活并不热衷，都希望能为祖国的繁荣贡献一份力量。如果你了解拉法耶特的故事，那么你便能理解当前正在发生的一切。美国正经历一场革命，无论谁试图劝阻我，我都会毫不犹豫地站在最前线。我真心希望你们能以善意理解这封信，我对你们的爱是全心全意的。请不要为我担心，我已经长大，我会照顾好自己的。\n\n此致，"
 france.224.t:0 "致我亲爱的母亲"
 france.225.a:0 "您的儿子"
 france.225.d:0 "今天，我终于结束了在美国多年的服役生涯，回到了波尔多。长久以来未能给你们写信，我内心深感愧疚，但那时的我身处前线，情况异常严峻，实在难以抽出时间。克里斯托夫最近来信，告知你们得知我失踪的消息后，心中充满了悲痛与担忧。可想而知，得知自己的儿子在战区生死未卜，你们的心情一定无比沉重。我有太多的话想对你们说，等到我亲自去看望你们和爸爸时，再一一倾诉那些信封里装不下的深情厚意。克里斯托夫还告诉我，爸爸的身体状况每况愈下，请你们一定要在我回家之前，继续告诉我他的近况以及农场的一切。如果这真的是我最后一次见到活着的爸爸，那么我希望在归家的路上能够从容不迫，珍惜每一刻。我在美国前线的服役经历，让我深刻体会到了战争的残酷与无情。尽管我早已听说过叛乱与冲突的故事，特别是从外籍军团的老兵口中，但直到亲身经历，我才真正感受到战争的地狱般恐怖。那些以集体利益为借口，犯下屠杀与暴行的人，他们的行为令人发指。尽管我不想用这些残酷的细节来让你们难过，因为我知道你们已经年迈，不愿再去触碰这些伤痛，但战争的真相确实令人不寒而栗。当我们的同胞，无论是平民还是士兵，都在战争的阴影下苦苦挣扎时，我更加深刻地意识到，我们能够远离战争的纷扰，是多么地幸运。现在，俄罗斯与欧洲之间的战火已经燃起，他们不惜一切代价地摧毁我们的家园和村庄，甚至已经入侵了乌克兰，并计划继续扩张。面对这样的局势，我决定重返军营，在祖国和人民最需要的地方贡献自己的力量。爸爸妈妈，我深爱着你们，这份爱将永远不变。\n\n此致，"
 france.225.t:0 "亲爱的妈妈爸爸"
 france.226.a:0 "您的儿子"
 france.226.d:0 "这是我前所未有的经历，无论是在美国，还是在整个人生旅途中。在美国，我习惯了胜利的光环，即便亲眼目睹战友倒下，亲眼见到每条街道、每栋房屋、每家商店远处传来的步枪声，也未曾动摇。然而，在乌克兰，这里没有胜利的曙光，没有荣耀的照耀，没有生机的涌动。这里的一切似乎都只为屠杀和羞辱而存在。这里没有骑士精神，没有英勇的骑士来驱散邪恶。我们面对的并非无组织的游击队员，而是由强奸犯和谋杀犯组成的军队。那些官僚们，他们甚至从未在现实中见过步枪，却强迫我们冒着生命危险奔赴前线。此刻，我正坐在前线众多战壕中的一个散兵坑里给你写信。这些散兵坑成了我唯一的避风港，尽管我时刻担心炮击或无人机袭击会让我命丧于此。战壕里，泥泞高达三尺，尸体、鲜血和粪便遍布其中。这是世界上最难闻的气味，身临其境更是令人窒息，但我们必须勇敢面对。然而，我们的德国指挥官对这些情况视而不见，听而不闻，更未曾采取任何整治措施。许多与我并肩作战的战友，在德国人的督战下、在履行保卫国家的神圣职责时，被残忍地杀害。他们正在与威胁我们国家存亡的敌人浴血奋战。战争，无疑就是人间地狱。我竭力克制想要逃离的冲动，因为我知道，为我的国家、为你、为克里斯托夫、以及秉承爸爸的遗志而战，是我必须坚守的终极使命。我已经三天没有进食，两天没有饮水。补给品日益减少，我们也不知道下一批补给何时能够送达。无人区简直就是一个屠宰场，坦克陷入俄国人所说的泥泞期中无法动弹，最终被摧毁。在这里，我和德国战友之间的关系变得毫无意义，他们瞧不起我，仿佛把我当成脚下的垃圾。就算如此，他们还是在不到一小时后便战死沙场。我深知俄国人的邪恶，但我不得不杀害青少年。我曾亲眼目睹被征召入伍、年龄不超过18岁的士兵被机枪扫射得四分五裂，其他人似乎对此已经麻木不仁，而我们也已经习惯了这种残酷的现实。当你收到这封信时，我恳请你不要为我担心。你总是这样，这让我心里十分难过。要知道，我一定会挺过去，我会坚持下去。\n\n此致，"
 france.226.t:0 "亲爱的母亲"
 france.227.a:0 "您的儿子"
 france.227.d:0 "今日，我们得知那场波及广泛、夺去无数生命的战争终于落幕。我的部队在俄罗斯大地上欢庆胜利，并筹备着归国的行程。俄罗斯抵抗组织的成员奔向对面战壕，与彼岸的亲人紧紧相拥。显然，我们的指挥官与国内传来的消息都将此视为重大胜利：高加索地区、白俄罗斯和别尔哥罗德已从俄罗斯统治中解放，建立起效忠欧洲的政府。然而，尽管俄罗斯对我们的民族犯下累累罪行，我们并未试图推翻其政权，或是让他从内部崩溃。然而历史告诉我们，一个更糟糕的政府将在战火后的俄罗斯废墟中崛起，而法国工商会和我们的政府对此并不在意。我们看似是最终赢家，不是吗？我尊重这场胜利，但请明白，这也是一场悲剧。我们付出了巨大代价，才将东线边界推进；又付出了多少，才耗尽俄罗斯这头猛兽的全部力量？知晓这一切后，我无法心安理得地作为英雄回国。我并非英雄，只是个旁观者，至少在我亲自行动前如此。战争让我蜕变，让我重获新生。我不会随连队离开俄罗斯，这让我的执行官——那头野兽感到失望。但请别担心我，我会为你们和克里斯托夫做出最好的安排。\n\n此致，"
 france.227.t:0 "妈妈，胜利日“快乐”"
 france.228.a:0 "您的儿子，拉法耶特。"
 france.228.d:0 "今日，我们收到消息，这场浩劫般的战争，在全球范围内夺走无数宝贵生命的战争，终于画上了句号。华沙，这座昔日繁华的城市，如今满目疮痍，被俄军的铁蹄践踏得支离破碎，欢庆的氛围荡然无存。废墟与遗骸遍布各处，仿佛时间倒流至九十年前的黑暗岁月。那些在第一波攻势中未能逃脱的平民，无辜地成为了战争的牺牲品，惨遭杀害。我们的物资储备早已枯竭，集团军内部更是饥荒与疾病肆虐，无数英勇的战士因此倒下。而我所在的旅中，幸存者正踏上归途，但家园已非往昔，她被官僚的腐败与战争贩子的贪婪所侵蚀，他们如同寄生虫般，在同胞们流血牺牲之时趁机中饱私囊。这些人对国家的命运漠不关心，对同胞的苦难视而不见，甚至与俄国人沆瀣一气、助纣为虐，成为屠杀的帮凶。我虽多次负伤，却未曾得到应有的医疗救治与援助。然而，这并未使我放弃战斗的信念。年复一年，我坚守在前线，与敌人殊死搏斗，却最终遭到了那些所谓领导者的背叛。我们最终未能赢得这场战斗，俄罗斯的铁骑已征服东欧，其军队跨越国界，对无辜的欧洲人民展开屠戮。面对如此绝境，我再也不能坐视不管，盲目听从军官命令，于战壕中苟活。我将摒弃过去的怯懦与犹豫，以英雄的姿态挺身而出，为我的国家而战，为那些倒下的兄弟们复仇。我即将踏上归途，但我的心中已立下誓言：要让法国永远不再重蹈覆辙，不再被国内外的犹太共产主义者所颠覆与攻击。我最亲爱的母亲啊，请理解我此刻的决定与行动。我所做的一切都是为了国家的未来、为了您的幸福、为了克里斯托夫的成长。我对您的爱是深沉而真挚的，它将伴随我走过这段艰难的旅程。\n\n此致，"
 france.228.t:0 "亲爱的母亲与乡亲们"
 france.229.a:0 "您的儿子，拉法耶特。"
 france.229.d:0 "如果这封信能送达您或克里斯托夫手中，恐怕我已不在人世。此刻，我孤身留于俄罗斯，没有随旅的其他人撤离，而是坚守于莫斯科——这恶魔巢穴的心脏地带。我与一群志同道合的战友并肩，其中还包括几位深谙人类福祉之道的俄罗斯友人，我们誓死完成使命。反观欧洲，政客们安逸于殿堂之上，对前线牺牲的同胞视而不见；尤其是那些年仅18岁的青年，被迫远离家乡与亲人，为漠视他们生命的政客而战。而俄罗斯，作为战争的始作俑者，侵邻掠土，行径之残暴，无异于强奸犯、刽子手与谋杀者的集合体。然而，这些罪行却得到了世界顶端权力机构中某些蛀虫的纵容与赦免。我们的人民、遗产、民族与文化，正遭受着藏匿于莫斯科阴影下的鼠辈们的持续攻击与压制，他们伺机而动，企图颠覆一切。其意识形态已借由无数法国勇士的鲜血死灰复燃，无论是纳粹的阴影还是布尔什维克的威胁，都未曾停歇对我们的侵扰。我誓以热血捍卫人民，为他们的未来而战。母亲，虽您已年迈，渴望安宁，但真相不可回避。我将深入敌后，从内部瓦解俄罗斯，若天遂人愿，我将反向西进，从暴徒手中解放欧洲。一场伟大的革命已悄然兴起，正如前人所云，星星之火可以燎原。亲爱的母亲，若您读到此信，请务必将其传扬，勿让我成为被遗忘的勇士。我对您的爱，跨越生死、永恒不变。法兰西万岁，法兰西人民万岁！\n\n此致，"
 france.229.t:0 "致：亲爱的母亲"
 france.230.a:0 "您的儿子"
 france.230.d:0 "我相信母亲您应该早就对此知悉一二。法兰西已从那些曾视同胞为人矿，将骨肉送至东部前线的战争绞肉机中厮杀的国际精英自由派和犹太共匪手中解脱。听说您最近对政治颇感兴趣，但我不希望一把年纪的您还被这些琐事困扰。我先前动用了些职务关系让他们将您安置在免受战火侵扰的地区。对于错过克里斯托夫十七岁生日这件事我深感歉意，希望他能别因此埋怨我。如果您在电视或是手机上打听到关于我的消息，希望您知道，我正在为您的未来，为克里斯托弗的未来，为每位法兰西人民的未来奔波奋斗。不为功名利禄，只为完成这些对我而言义不容辞的使命。常回想起多年前在军营前与您的最后回眸，那时的您，是否知晓自己已经培养出一位国家英雄？是否知晓您已经成为任何法兰西儿女都梦寐以求的母亲？我想向您致歉，因为我还要继续服役而无法看望您，但请你放心，母亲您、父亲、克里斯托夫乃至整个国家的身影我都会永远铭记于心。\n家和万事兴，家庭永远是最神圣的居所，只要有空，我就会去看望您。我一直坚信，每个国家的历史长河中都拥有一段史诗，正是它塑造了人们的身份认同与文化传统，激励着后代的战士们奋战千秋万代。在国家的旗帜之下，每个人都拥有为其服役或是为和谐社会贡献力量的使命。当我们真正成长的那一刻，我们所奉献之物将真正超凡脱俗。我说这些并不意味着我忘记了您，正是您铸造了我的心灵基石，铺就了成长的道路，此种养育之情永生难报。待到时机成熟的那天，相信我们就能再次团聚一堂。我亲爱的母亲，在此向您道别。"
 france.230.t:0 "致我最亲爱的母亲"
 france.231.a:0 "断头台是革命的剃刀！"
 france.231.b:0 "行刑队效率最高"
 france.231.c:0 "注射死刑不会有痛苦"
 france.231.d:0 "随着政府试图加强其权威并消除异议，公众面临着一个关于应该采用何种处决方法的选择。这项命令在全国范围内引发了激烈的辩论，反映了人们在正义、道德和革命未来方面的深刻分歧。\n\n公民现在面临着四种不同的执行国家处决的方式：\n\n断头台——回归革命正义的标志性象征，唤起过去的精神，威慑反革命分子。\n\n枪决——一种强调迅速果断行动的方法，吸引那些在国家安全问题上优先考虑效率和直接性的人。\n\n注射死刑——一种更现代的方法，提倡一种可感知的人道处决，与那些主张采用不那么残酷方法的人保持一致。\n\n废除死刑——一种反映仁慈和改造理想的激进选择，吸引那些认为革命应该寻求改造社会而不是延续暴力循环的人。"
 france.231.e:0 "应该让他们在监狱里腐烂"
 france.231.t:0 "关于贯彻执行全国死刑的革命命令"
 france.232.a:0 "我们为什么要辩论这个东西？"
 france.232.b:0 "我们必须回到一个没有宗教的社会！"
 france.232.d:0 "为了重塑民族认同，一项新的规定被引入以解决历法这一有争议的问题。随着人们对如何最好地体现国家的革命价值观和理想展开激烈辩论，公民们被呼吁就他们偏好的计时方法发表意见。这场辩论不仅凸显了传统与进步势力之间不同的观点，也是更广泛意识形态冲突的象征性战场。\n\n公众被提供了两种选择：\n\n恢复旧的法国共和历——支持这一选择的人认为，恢复历史中的历法将尊重革命精神，并颂扬过去的价值观。他们认为这将使人民在共同的历史框架下团结起来，强调革命理想在日常生活中的重要性。\n\n维持当前的历法——支持这一选项的人认为，现有的历法提供了稳定性和连续性，让公民能够在不被改变所打扰的情况下过自己的生活。他们认为当前的计时方法已经深入社会，并提供了不可忽视的实用功能。"
 france.232.t:0 "关于日历辩论的革命命令"
 france.233.a:0 "我们是自由和社会正义的捍卫者！"
 france.233.b:0 "绝不向堕落行为低头！"
 france.233.d:0 "在社会转型的重要时刻，一项新的指令被引入，旨在解决围绕同性恋和性别认同的复杂问题。随着社会努力应对革命性理念对个人自由和权利的影响，公民被邀请参与这场至关重要的辩论。这项指令的结果将显著影响国家的文化和社会景观。\n\n公众面临着两个截然不同的选择：\n\n全心全意地接受同性恋和性别讨论——该选项的支持者主张充分接受和承认不同的性取向和性别认同。他们认为，接纳人类身份的这些方面对于促进平等、提升个人自由和创造更具包容性的社会至关重要。\n\n禁止同性恋和性别讨论——该选择的支持者认为，这些措施对于维护传统价值观和社会规范是必要的。他们认为，限制非异性恋规范身份的讨论和表达将保护社区的结构并维护既定的习俗。"
 france.233.t:0 "关于同性恋和性别的革命命令"
 france.234.a:0 "改为展示资产阶级堕落面貌的博物馆！"
 france.234.b:0 "拆毁它们！"
 france.234.c:0 "我们有更紧迫的事情要做……"
 france.234.d:0 "一场大胆反映革命价值观的运动已经兴起，旨在处理凡尔赛宫和法国众多宏伟城堡所代表的建筑奢华遗产。当国家反思其与过去过度和颓废象征的关系时，公民们被邀请来权衡这些纪念性建筑的未来。这场辩论不仅挑战了这些遗址的历史意义，也引发了关于哪些价值观应该定义当代社会的问题。\n\n公众面前呈现着三个截然不同的选择：\n\n资产阶级颓废博物馆——这一选择的支持者主张将这些奢华的庄园改造成博物馆，批判其历史，突出资产阶级的过度消费。他们认为，通过将这些建筑保留为教育空间，社会可以从过去中吸取教训，并促进一个更加平等的未来。\n\n拆除它们——这一选择的拥护者认为，这些巨大财富的象征与革命理想背道而驰，应该予以拆除，以抹去压迫和不平等的痕迹。他们认为，拆除它们将标志着与过去阶级差距明显的时代彻底决裂。\n\n什么都不做——赞成维持现状的人认为，这些建筑奇迹是法国文化遗产和旅游业不可分割的一部分。他们认为，保持原样可以让人们欣赏历史艺术，并为社区带来经济效益。"
 france.234.t:0 "关于以建筑炫耀巨额财富的革命命令"
 france.235.a:0 "我们会永远支持世界革命"
 france.235.b:0 "我们必须集中精力进行内部革命"
 france.235.d:0 "在一个国家意识形态发生变革的时刻，一项新的使命应运而生，旨在塑造外交政策的哲学基础。随着革命政府试图重新定义其在世界上的地位，公民受邀就应该指导其在全球舞台上互动的指导原则进行讨论。这场辩论不仅涉及国家优先事项，也反映了对革命理想更广泛的意识形态承诺。\n\n公众面临着两种截然不同的选择：\n\n世界革命——这种方法的支持者认为，法国应该积极促进和支持全球的革命运动。他们认为，传播革命理想对于推翻压迫政权和促进全球平等至关重要。支持者认为，通过将法国定位为世界革命的拥护者，法国可以激励各地被压迫人民的变革和团结。\n\n内部革命——这种选择的拥护者主张在与国际社会接触之前，应首先关注解决法国内部的问题。他们认为，政府应优先考虑内部改革，以确保国内的社会正义、平等和稳定。支持者断言，通过专注于法国人民的需求，法国可以成为其他国家的榜样，通过切实改善公民生活来证明革命原则的有效性。"
 france.235.t:0 "关于哲学和外交政策的革命命令"
 france.236.a:0 "这是维持我们革命所必需的"
 france.236.b:0 "这是无法无天的暴政！"
 france.236.d:0 "在深刻反思安全与自由之间平衡的关键时刻，一项关于颇具争议的《嫌疑犯法》的新指令被引入。正当革命政府努力应对威胁其稳定和理想安全的挑战之际，公民们受邀就重新引入这一重要法律框架发表意见。这场辩论唤起了人们对过去紧张局势的记忆，并引发了关于以安全的名义维护公民权利的关键问题。\n\n公众面临着两个截然不同的选择：\n\n恢复《嫌疑犯法》–该选择的支持者认为，恢复该法律对于保护革命免受内部威胁和反革命分子的侵害至关重要。他们相信，法律中概述的措施将增强国家安全，并维护革命运动来之不易的成果，即使这需要牺牲一些个人自由。\n\n不恢复该法律–该选择的反对者认为，重新引入这样的法律会破坏革命试图维护的自由和正义原则。他们认为，该法律在历史上导致了权力滥用和不公正的迫害，并且在任何革命事业中，对人权的承诺都必须是至高无上的。"
 france.236.t:0 "关于嫌疑人法的革命命令"
 france.237.a:0 "他是革命理想主义的灯塔"
 france.237.b:0 "他只不过是个小小暴君"
 france.237.d:0 "在一个关键的反思时刻，革命政府颁布了一项指令，重新评估马克西米连·罗伯斯庇尔和臭名昭著的“恐怖统治”的遗产。当国家努力应对其动荡的历史时，公民被要求评估罗伯斯庇尔的行为对革命事业及其所拥护的理想的影响。这场辩论是对革命热情与正义和人道原则之间平衡的关键审视。\n\n公众面临着两种截然不同的选择：\n\n革命理想主义的灯塔——这一观点的支持者将罗伯斯庇尔视为革命的拥护者，他坚定不移地致力于革命理想，证明了在恐怖统治期间采取的措施是正当的。他们认为，他的行为对于保护革命免受敌人侵害以及维护来之不易的自由和平等成果是必要的。拥护者认为，承认罗伯斯庇尔是指导灯塔，对于激励后代坚持革命精神至关重要。\n\n暴君——这一观点的反对者认为，罗伯斯庇尔的统治代表着危险的权力过度扩张，导致了广泛的恐惧、镇压和无数生命的丧失。他们认为，将他贴上“小暴君”的标签，是对极端主义危险以及革命热情可能沦为专制主义的警告。这种观点呼吁对过去进行批判性的重新评估，强调需要将正义和人权置于对意识形态纯洁性的追求之上。"
 france.237.t:0 "关于罗伯斯庇尔与“恐怖统治”的革命命令"
 france.240.a:0 "他们到底想要干什么？"
 france.240.d:0 "近来，法国军方巧妙地将其影响力渗透到政治事务中，在幕后左右国家政策，这已成为一个公开的秘密。尽管官方渠道对此事保持沉默，但军事领导人越来越多地被视为决策过程中的关键角色，他们利用其可观的资源和公众支持，倡导更具自主性的国防战略。这引起了政治分析家和普通民众的关注，他们开始质疑军队参与治理的真实程度。\n\n随着地缘政治局势日益紧张，政府圈子里流传着军方偏好强硬外交政策的传闻。"
 france.240.t:0 "军队利用了影响力"
 france.241.a:0 "为你的祖国服役"
 france.241.b:0 "天道酬勤"
 france.241.d:0 "随着选举胜利，我党获得了推进改革的自主权，其中包括重塑法国公民意识的计划。然而，这一议题在我们政府内部引发了严重分歧，双方各执一词。党内温和派主张通过鼓励公民参军来为国家贡献力量，尽管21世纪的法国长期维持相对和平，但美国和欧洲最近的局势变化已迫使我们不得不增加国防预算。\n\n另一方面，党内强硬派则主张通过鼓励公民在工厂就业来服务国家。鉴于沙特阿拉伯战争的爆发以及美国徘徊在内战边缘的严峻形势，法国若要持续发展，就必须强化国内生产。然而，这一提议遭到了党内温和派和环保主义者的反对，他们认为过度剥削民众只会损害我们的民众基础。尽管如此，党内强硬派仍坚持这一观点，认为这能有效推动法国经济的增长。"
 france.241.t:0 "重塑法国公民"
 france.242.a:0 "我们会采取行动，但他们必须赔偿我们损失的资产"
 france.242.b:0 "这是对逝者的侮辱！"
 france.242.d:0 "在我们于近期冲突中取得决定性胜利后，我们收到了法兰西共和国正式提出的降低对其所施加战争赔款的请求。这份请求清楚地表明了法国虚弱的现状，以及其对我方在国际舞台上实力的认可。在我们回顾胜利之时，显而易见，这份请求不仅象征着法国的脆弱，也象征着我们作为欧洲强大力量的地位。"
 france.242.t:0 "法兰西共和国要求降低赔款"
 france.244.a:0 "酷"
 france.244.d:0 "让-吕克·梅朗雄成功地巩固了他在新人民阵线派系中的权威，在不断变化的政治格局中将自己定位为该党的主导声音。通过一系列战略联盟和有效的沟通，梅朗雄团结了他的支持者，强化了一个强调进步政策和社会正义的愿景。他充满个人魅力的领导风格引起了党内基层的共鸣，使他能够巩固权力并推进一项雄心勃勃的议程。"
 france.244.t:0 "梅朗雄巩固权力！"
 france.245.a:0 "酷"
 france.245.d:0 "为了巩固自己的地位，奥利维尔·富尔采取了一系列战略举措，成功地在“新人民阵线”内部的派系中集聚了权力。随着政治局势日益动荡，富尔的领导风格得到了党员们的共鸣，他们视其为一位能够驾驭当代政治复杂局面的团结人物。富尔努力将派系内部不同的意识形态派别团结起来，增强了内部凝聚力，从而制定出更加集中、能够吸引更广泛选民的政治议程。"
 france.245.t:0 "富尔巩固权力！"
 france.250.a:0 "为德维利耶三呼万岁！"
 france.250.b:0 "我们支持勒庞！"
 france.250.d:0 "随着总统选举日益临近，国民阵线因玛丽娜·勒庞发表反对军方控制政府的声明而爆发了权力之争。法国军方对勒庞领导下的政党方向感到担忧，已明确要求国民阵线换上一位更符合军方利益的候选人，即备受尊敬的前总参谋长皮埃尔·德维利耶。德维利耶以其坚定的亲军队立场和务实的国防观念著称，与勒庞的民粹主义立场截然相反。\n\n国民阵线领导层目前面临艰难抉择。尽管勒庞拥有一批忠实支持者，但越来越多的人意识到，像德维利耶这样更亲近军队的候选人可能会赢得那些视国家安全为首要任务的关键军事人物和保守派选民的支持。军方的非正式干预明确传递出他们希望政府高层在政策和人事方面进行调整的信号。国民阵线现在需要在坚持其民粹主义基础和支持一位既能助力选举成功又能获得军方支持的人选之间做出选择。"
 france.250.t:0 "新候选人？"
 france.251.a:0 "令人担忧……"
 france.251.d:0 "让-吕克·梅朗雄在一份大胆且具有挑衅性的声明中宣称，“俄罗斯是法国的朋友，应该加强与俄罗斯的合作”，主张在乌克兰持续冲突和北约可能介入的背景下转变外交政策。他对北约不断升级的军事存在表示担忧，并宣称，“很快就会启动退出北约的程序”。这份声明旨在将法国重新定位为国际关系中的独立角色，专注于外交和与拥有共同利益的国家合作，而不是与军事联盟结盟。\n\n自梅朗雄宣布这一消息以来，军方一直保持沉默，这引发了人们对法国国防机构内部动态的质疑。这种沉默可能表明，军方不情愿地承认了正在发生的政治转变，因为它正在不断变化的地缘政治格局中摸索自己的角色。梅朗雄强调与俄罗斯合作以及可能退出北约的立场，引起了厌倦冲突的选民的共鸣，并将新人民阵线定位为倡导欧洲新外交方式的关键角色。"
 france.251.t:0 "梅朗雄飞往莫斯科"
 france.252.a:0 "现代但泽"
 france.252.d:0 "今天，法国总统让-吕克·梅朗雄向全国发表讲话，对梅德韦杰夫领导的俄罗斯不断升级的冲突以及北约可能卷入这场冲突表示深切关注。“亲爱的同胞们，今天我怀着深深的忧虑站在你们面前，”他说道，并敦促法国人民拒绝卷入与俄罗斯的战争。“有人敦促我们与俄罗斯开战，但我告诉你们，这是疯了。这不是我们的战争。这不是我们的战斗。”梅朗雄强调，法国绝不能陷入无休止的暴力循环，他主张退出北约，回归以和平与稳定为重点的独立政策。\n\n在他充满激情的讲话中，梅朗雄援引历史背景问道：“为什么要为敖德萨而死？”这与著名的“为什么要为但泽而死？”相呼应，突显了他强烈反对军事对抗的立场，并将当前局势定性为不值得法国做出牺牲的局势。他通过团结全国人民，传递不参与和外交的信息，试图引导法国摆脱不断升级的紧张局势，走向优先考虑对话与合作而非冲突的道路。"
 france.252.t:0 "梅朗雄反对战争"
 france.253.a:0 "加油努力！"
 france.253.d:0 "“致法兰西及欧罗巴全体公民！祸患已至！以弗拉基米尔·日里诺夫斯基为首的法西斯俄罗斯帝国匪帮悍然入侵乌克兰，我们绝不能袖手旁观。以民主欧洲之名，我们必须团结一致，共抗恶徒。法西斯主义在现代世界绝无容身之地，必须集结全部力量，以一切资源与手段扑灭这一威胁。今日，我号召全体法兰西公民、欧罗巴乃至更广地区的盟友们：让我们并肩而立，共抗法西斯侵略！若意志坚挺，必能拯救吾等之未来。我们将为自由、为民主、为子孙后代的未来而战斗。前进吧！向击溃法西斯的胜利进军！”"
 france.253.t:0 "梅朗雄呼吁团结反对法西斯主义"
 france.254.a:0 "万岁！"
 france.254.d:0 "让-吕克·梅朗雄总统宣布，一支由激进的反法西斯分子和共产主义者组成的劲旅将建立起来，这支部队将交由谢尔盖·乌达利佐夫指挥。这支旅将与法西斯俄罗斯帝国，以及它的领袖弗拉基米尔·日里诺夫斯基战斗。这展示了空前的国际团结和为正义而战的精神。"
 france.254.t:0 "梅朗雄组建俄罗斯反法西斯军团"
 france.260.a:0 "好的"
 france.260.t:0 "土耳其谴责法国侵略塞浦路斯"
 france.261.a:0 "疯了"
 france.261.d:0 "据当地居民和媒体报道，法国军队在几乎未遇抵抗的情况下进入北尼科西亚。这一非法军事行动引发土耳其政府强烈反应，总统埃尔多安已发布最后通牒，要求法国军队立即撤出北塞浦路斯，否则将面临严厉的经济制裁甚至军事干预。国际社会普遍支持塞浦路斯，谴责此次入侵行为严重侵犯国家主权。俄罗斯政府强烈谴责该行动，直指其为“赤裸裸的共产主义侵略行径”。欧洲共产国际则警告将对土耳其实施全面制裁，并表示若局势升级，将全力为法国提供军事支持。"
 france.261.t:0 "法国对塞浦路斯特别军事行动"
 france.262.a:0 "好的"
 france.262.b:0 "去你妈的！"
 france.262.d:0 "在一项令人惊讶的外交策略中，法国政府提出将法属圭亚那割让给巴西，以换取该国加入北约组织。这一大胆的提议旨在加强北约在南美洲的联盟，并增强该地区抵御外部威胁的安全能力。法国认为，将巴西纳入北约将增强集体防御能力，并在具有地缘战略意义的地区促进稳定。\n\n法国领导层认为，这项安排将互惠互利：巴西将获得重要的领土资产，增强其影响力和资源，而法国将在北约内部获得一个强大的盟友。然而，这项提议在国内和国际上都引发了激烈的争论。批评者质疑这种领土割让的长期影响，而支持者则认为，这可能开启该地区合作与安全的新时代。随着讨论的进行，全世界都在密切关注这一前所未有的提议将如何发展。"
 france.262.t:0 "法国向圭亚那提供北约成员国资格"
 france.263.a:0 "好极了！"
 france.263.d:0 "巴西正式接受法国提出的以法属圭亚那换取其加入北约的提议，这是一个历史性的转折点。该协议标志着法巴关系的一个重要里程碑，被视为加强南美安全与稳定的战略举措。法国政府认为这是一个巩固该地区联盟的机会，可以利用巴西在北约内部日益增长的影响力来应对集体安全问题。\n\n随着圭亚那移交工作的展开，法国正专注于确保该领土及其居民的平稳过渡。法国领导层致力于维护当地居民的权利和福祉，同时将他们融入巴西的治理体系。预计这一大胆的决定将促进两国之间更紧密的联系，促进经济合作和共同安全利益。尽管一些批评人士对这一领土转变的长期影响表示担忧，但法国政府仍然乐观地认为，此举将加强北约在美洲的存在，并有助于构建更稳定的地区格局。"
 france.263.t:0 "巴西接受！"
 france.264.a:0 "去你妈的！"
 france.264.d:0 "巴西意外拒绝了法国提出的以割让法属圭亚那换取北约成员国资格的提议。这一决定让法国政府感到沮丧，因为他们曾希望通过这项史无前例的协议加强与南美洲的联盟并增强地区安全。法国领导人认为，巴西的拒绝错失了巩固北约内部强大伙伴关系的机会，而这种伙伴关系本可以更有效地解决共同的安全关切。\n\n巴西的拒绝在法国国内引发了关于其在该地区未来战略利益的激烈辩论。一些官员表示失望，认为巴西的拒绝表明其不愿与北约和西方进行更深入的接触。随着政府重新评估其外交策略，人们更加关注加强与拉丁美洲其他潜在盟友的关系。法国仍然致力于保持其在该地区的势力，但未来的道路需要谨慎应对复杂的地缘政治动态并重新评估其外交政策战略。"
 france.264.t:0 "巴西拒绝！"
 france.265.a:0 "我们撤"
 france.265.b:0 "我们更喜欢加拿大"
 france.265.d:0 "随着魁北克局势日益紧张，省政府正式宣布举行独立公投，旨在确定其与加拿大的未来关系。这一重大政治举措反映了许多魁北克人长期以来渴望更大自治和自决的愿望。加拿大政府将此次公投视为可能重塑国家的关键时刻，渥太华的领导人正在敦促开展强有力的宣传活动，以强调保持统一的益处。\n\n作为回应，联邦政府加大了与魁北克民众接触的力度，强调将该省与加拿大联系起来的经济、文化和社会纽带。总理和内阁官员正准备发起一场全国性的运动，旨在为统一以及独立的潜在后果提出令人信服的理由。随着公投日期的临近，双方都在为一场将对加拿大的未来产生持久影响的激烈辩论做准备。"
 france.265.t:0 "魁北克举行独立公投"
 france.27.d:0 "法国当局宣布马里紧急状态已解除。在遭遇叛军激烈而有序的抵抗后，法国与马里的联合军队成功地将叛军从马里北部地区驱逐至撒哈拉沙漠的深处。\n\n另外，法国军队还顺利执行了一次行动，成功地从叛军手中解救出马里总统，且全程无任何损失。目前，北约军官正将此行动作为成功实施快速打击与部署的典范并进行深入研讨。"
 france.270.a:0 "要钱没有，要命一条"
 france.270.b:0 "倾我们所有"
 france.270.d:0 "在与俄罗斯的毁灭性冲突之后，法国政府采取了大胆的举措，正式要求增加战争赔款。鉴于我国遭受了巨大的破坏和损失，法国领导层决心追究俄罗斯侵略行为的责任。法国外交部长表示：“我们必须确保挑起此类冲突的人承担其行为的后果。我们人民的牺牲不容忘记，正义必须得到伸张。”\n\n随着法国推动这些战争赔款，俄罗斯的回应尚不确定。这一要求可能会加剧外交紧张局势，并可能使北约内部的关系变得紧张。或者，采取更和平的方式可能会为谈判开辟道路，使两国能够寻求解决方案并促进欧洲的稳定。前进的道路将对该地区的权力平衡产生重大影响。"
 france.270.t:0 "法国索要更多战争赔款"
 france.271.a:0 "他们知道我们会作何回应"
 france.271.d:0 "针对近期提出的战争赔款要求，俄罗斯政府断然拒绝了法国的请求，声称这是一种不公正的强加。这一拒绝进一步加剧了两国之间的紧张局势，因为法国认为这是对冲突期间遭受的苦难的公然漠视。法国领导层决心维护国家尊严并确保损失得到赔偿，认为俄罗斯的拒绝清楚地表明其不愿为自己的行为承担责任。\n\n鉴于俄罗斯的拒绝，法国决定实施经济禁运，旨在向俄罗斯政府施压，迫使其重新考虑其立场。此举不仅旨在表明法国对正义的承诺，而且还旨在争取国际社会对俄罗斯侵略行为的支持。法国政府认为，禁运可以有效地挑战俄罗斯的蔑视，迫使其重新考虑其政策，同时还可以加强北约盟国面对持续威胁时的团结和决心。"
 france.271.t:0 "俄罗斯拒绝增加赔款"
 france.272.a:0 "哇哦，谢谢！"
 france.272.d:0 "经过激烈的谈判和来自国际社会的越来越大的压力，俄罗斯政府出人意料地接受了法国提出的战争赔偿要求。这一决定被视为法国领导人的重大胜利，他们认为这是朝着正义迈出的关键一步，也是对近期冲突期间遭受苦难追究责任的关键一步。俄罗斯的接受不仅承认了法国面临的困境，也标志着两国关系可能出现缓和，为恢复对话提供了机会。\n\n鉴于这一进展，法国准备采取措施重建和加强其经济，利用战争赔款支持恢复工作并增强国家稳定。这一积极成果也可能提升法国在北约中的地位，表明其有能力追究对手的责任。然而，法国政府仍然保持谨慎，意识到必须继续保持警惕，以确保俄罗斯履行其承诺并避免未来的冲突。"
 france.272.t:0 "俄罗斯接受增加赔款"
 france.273.a:0 "自己的地我们想干啥就干啥"
 france.273.b:0 "额……好吧"
 france.273.d:0 "鉴于我国占领区目前的局势，法国政府已正式要求我方在治理这些地区时采取宽容手段。法国认为，采取更人道、更包容的方式将促进稳定，有利于恢复正常秩序，并可能为未来和解努力铺平道路。\n\n法国官员强调，尊重和理解当地居民有助于减少敌意，鼓励合作，尤其是在我们努力在近期冲突后重建国家之际。然而，我国政府内部对于这一请求的实用性和影响存在不同意见。"
 france.273.t:0 "法国政府要求从宽处理"
 france.2731.d:0 "法乌关系取得积极进展，乌克兰政府接受了我们关于在被占领土给予宽大处理的要求。这一决定被视为朝着促进该地区稳定与和解迈出的重要一步，也将改善当地民众的人道主义状况。"
 france.2731.t:0 "乌克兰接受从宽处理"
 france.2732.d:0 "鉴于乌克兰拒绝接受我们关于宽大治理占领区的要求，法国政府决定对这些地区实施禁运。向乌克兰施压，迫使其重新考虑其立场，并采取更具包容性的治理方式。"
 france.2732.t:0 "乌克兰拒绝从宽处理"
 france.274.a:0 "我们不会再容忍卡扎菲的统治！"
 france.274.b:0 "我们不能公然入侵！"
 france.274.d:0 "受利比亚内战的混乱推动，令人震惊的一幕发生了——卡扎菲的儿子竟再次掌权，一个新的卡扎菲政权在利比亚诞生。然而，这种局面绝不可容忍。正所谓老子反动儿混蛋，卡扎菲的儿子同样是一个独裁者，继承了其父未竟的野心，并发动了一场帝国式的扩张战争，以试图建立一个极权的泛阿拉伯国家，沿袭其父那早已破产的意识形态。\n\n政府内部对这个新政权的态度几乎一致——强烈反对。许多人主张立即推翻这个独裁政权，让利比亚人民真正迎来民主。\n\n然而，并非所有人都支持直接干预。许多人反对再度入侵，回忆起上次推翻卡扎菲政权的后果仍历历在目——我们本意是要解放利比亚，让民主照耀这片土地，但换来的却是残酷的内战与国家的崩溃，导致许多利比亚人如今竟怀念旧政权。另一些人则认为，这场战争只是徒劳的重复——如同上次支持反叛军的行动，这或许又会演变为另一场我们无法脱身的泥潭。\n\n然而，主张干预的一方则强调，推翻独裁不仅仅是出于道义，而是事关整个地中海的安全。控制地中海，将确保我们未来民主扩张的战略布局，意义重大。"
 france.274.t:0 "干涉利比亚？"
 france.275.a:0 "我们必须不遗余力援助西非民主！"
 france.275.b:0 "我们不能公然入侵！"
 france.275.c:0 "局势已稳定"
 france.275.d:0 "非洲长期以来饱受战争与暴力之苦，这不仅带来了深重的人道灾难，也使得诸多国家落入专制统治者之手。因此，我们必须确保民主原则在非洲得到维护，并坚定捍卫人权。此外，在稳定、民主且友好的政权领导下，非洲地区的自然资源也能更顺畅地流向我们，这对我国经济将带来极大裨益。\n\n幸运的是，非洲局势已趋向稳定，当地政权不仅拥护民主、对我们友好，而且愿意与我们展开资源贸易。综合评估后，我们得出结论——当前局势无需我们进行军事干预。\n\n这一决定对我们而言无疑是重大利好，意味着我们可以将宝贵的军事资源投入更关键的地区。无论如何，任何站在我们一方的盟友，终将迎来繁荣。"
 france.275.t:0 "干涉西非？"
 france.276.a:0 "我们别无选择。"
 france.276.b:0 "我们负担不起！"
 france.276.d:0 "法国外交使团向我方递交了一项请求，要求给予法国企业在本国优先开采自然资源的权利，并承诺将带来经济收益，同时提供法国军队的保护。然而，鉴于双方的历史渊源以及协议措辞的不确定性，这些承诺显得空洞无力。\n\n政府内部对此意见不一：部分官员认为接受法国要求是现实选择，毕竟我们的抗拒力量有限，而此举或许能带来经济增长、缓解失业问题并改善基础设施；然而，也有许多人对此深感愤怒——在经历了数十年的殖民统治和奴役之后，我们是否真的要再次屈从于法国的掌控？\n\n是选择屈服，以避免可能的军事行动，还是奋起反抗，捍卫我们的主权？这将是我们国家面临的一大抉择。"
 france.276.t:0 "法国要求西非资源"
 france.277.a:0 "好极了！"
 france.277.d:0 "西共体停火监督部队的政治家们看到了我们提议的合理性，接受了我们对资源的要求，这将大大提高我们在西非的影响力，并使我们获得新的潜在贸易伙伴。"
 france.277.t:0 "西共体停火监督部队接受！"
 france.278.a:0 "好吧去你妈的！"
 france.278.d:0 "西非的蠢货们以资源告罄为由，回绝了我方要求。这将极大地阻碍我们与他们的关系，并可能导致我们在非洲失去更多的影响力。"
 france.278.t:0 "西共体停火监督部队拒绝！"
 france.279.a:0 "决不！他们是乌克兰的英雄！"
 france.279.b:0 "他们是有点过火了……"
 france.279.d:0 "在近期与俄罗斯的冲突之后，我们发现自己承受着来自西方盟友尤其是法国的压力，他们呼吁解散亚速营。这一要求在我们政府和社会内部引发了激烈的辩论，因为该营一直是我们抵御俄罗斯侵略的关键力量。\n\n一些人认为，服从可以改善我们与西方国家的关系，并促进民主价值观，而另一些人则警告说，解散一支在战场上表现出非凡勇气的部队将削弱我们的国防力量。"
 france.279.t:0 "法国要求解散亚速营"
 france.280.a:0 ""
 france.280.d:0 ""
 france.280.t:0 ""
 france.2810.a:0 "回归本源的大陆。"
 france.2810.d:0 "这片大陆，是文明的基石，是人类应当追寻的理想。\n\n可惜，太长久以来，总有人以“进步”之名，试图动摇这根基，削弱这辉煌。我们的敌人妄图将欧洲简化为单一的族群体，仿佛这是一种过错。而即便真是如此，那又如何？不，欧洲的荣光在于它悠久的历史，在于它多元而璀璨的民族群像，在于它那由神祇亲手雕琢的壮丽山河。\n\n我们无可否认，来自东方的敌人曾几乎将这一切摧毁。它的铁蹄踏碎国界，它的野心企图吞噬我们的文明。可最终，我们在法兰西重新掌控了前进的方向，扳回命运的天平。无论过往如何，我们都必须铭记，团结欧洲的子民，是值得付出一切去追寻的理想。\n\n我们深爱每一个欧洲人，在共同的意志下，我们向俄国巨熊复仇，令其溃败，令其粉身碎骨，将它的残骸散落在荒凉的东方。\n\n欧洲自此不再分裂，而历史，将在时光的刻印中，铭记我们的伟业。\n\n因为，我们才是历史的书写者。"
 france.2810.t:0 "欧罗巴，牢不可破"
 france.2811.a:0 "浴火重生。"
 france.2811.d:0 "常言道，法国大革命的影响需经年累月方能显现，此言不虚。\n\n共和体制的尝试持续经年，却将法兰西削蚀成一具枯骨，羸弱得动弹不得。随着美国盟友的离场，这场政治实验终遭千夫所指。当俄罗斯的铁蹄踏碎我们的防线时，重拾传统便成为必然。危难时刻需要凝聚人心的图腾，君主不正是国民精神的具象化身？\n\n我们清除了共和体制遗留的沉疴，重铸了法兰西的民族魂魄、国民血性与军武荣光。俄罗斯早已在云端布阵，这场宿命对决避无可避。\n\n先辈未竟之业由我们达成，莫斯科终归欧罗巴版图。以燎原之火为证，向世界昭示旧制度并非皆为糟粕。\n\n帝国兴衰更替，王朝起落无常。但此番重生的法兰西帝国必将永恒。"
 france.2811.t:0 "权冠之重"
 france.2812.a:0 "重塑我们被迫抛弃的身份认同。"
 france.2812.d:0 "不，我们无需粉饰这十年屈辱，无需掩盖法兰西在这些奴颜媚骨的政客手中所遭受的耻辱。这些年，国际主义者掏空了我们的共和国，引入那些仇恨我们文化的异族，将我们的力量拱手相让，任世界强权将我们视作试验场，一次次蹂躏。\n\n多少年的族群暴力，多少年的经济凋敝，整个欧洲的既定秩序却告诉我们：“一切都会好起来。”\n\n“复仇不是文明社会的行事方式。”\n\n然后，俄罗斯来了。那些外来的寄生者带着我们的财富仓皇逃亡，权贵们继续在金杯中畅饮，仍旧填满他们贪婪的肠胃。\n成千上万战死的年轻士兵，一场苦涩无比的溃败。\n不再忍受，不再退缩！法兰西的愤怒将不可阻挡！\n\n于是，我们将他们全部赶走。\n\n伪保守主义？葬入尘土。\n寄生的自由主义？彻底湮灭。\n敌对的文化与种族？不复存在，永不再现。\n\n法兰西归来，手持利刃，淬炼于仇恨之中。\n我们斩断了巨熊的头颅，让它的幼崽哀号至永恒。\n文明社会？文明社会必须敢于以武力捍卫自身。如今，世界已然知晓这一点。"
 france.2812.t:0 "坚硬之心"
 france.282.a:0 "我即革命，革命之火亦在你身上燃烧。"
 france.282.d:0 "毫无疑问，当俄罗斯的反动派亲手粉碎“历史终结”这一陈腐的谎言，革命的怒潮便再度席卷法兰西大地。\n\n多少生命在剥削者的祭坛上化作尘埃，只为延续那象牙塔中的苟安者。可当压迫的枷锁崩裂，我们的铁锤便不会再停下——高楼倾颓，红旗飘扬，资本的圣殿在烈焰中化为焦土，那些巧取豪夺法兰西财富的罪人，终将面对审判。而当革命的怒火燃遍这片土地，我们的步伐也将跨越国境，奔赴俄罗斯，解放被遗忘的战友，以无可匹敌的狂热，荡涤帝国主义的残影。\n\n共产主义的归来，是令压迫者噩梦连连的恐惧，是他们不敢直面的宿命。而如今，这个噩梦已然成真，他们仓皇四散，如同肥硕的鼠辈，试图躲入黑暗的角落。但黑暗无法庇护他们，铁锤终将落下，正义终将到来。\n\n革命已然归来，我们不会再离去。"
 france.282.t:0 "巴黎上空的赤色星辰"
 france.2820.a:0 "永恒变革，永不止息。"
 france.2820.d:0 "法国大革命向世界昭示了革命绝非温良请愿，而是对压迫者的铁血审判，而这正是我们对那些让无数家庭在对俄战争中失去儿女的掌权者实施的正义。\n\n遍体鳞伤的我们挣扎着从血泊中站起。共和国早已向资本谄媚，放任贪婪的触须通过“无形之手”榨取我们的血肉。\n\n革命的烈焰终将燎原。暴力虽非首选，但必要时刻必须雷霆万钧，令敌人胆寒，使盟友倾心。断头台的刀刃始终锋利，自有其深意。\n\n最终，我们带着满腔热血与对无产阶级的热爱，将怒火倾泻向俄罗斯。这个庞然大物在压力下分崩离析，旧世界的残骸在变革烈焰中灰飞烟灭。\n\n如今赤旗已插遍欧罗巴，与同志携手，我们必将让赤色浪潮席卷寰宇，千万被压迫的兄弟姐妹正等待他们的黎明。\n\n我们的未来，从未如此光明。"
 france.2820.t:0 "革命怒焰"
 france.2821.a:0 "艺术于和平中绽放，点缀生命的每一道光影。"
 france.2821.d:0 "你曾见过这一切，不是吗？冰冷的混凝土掩盖了真诚，廉价的塑料扼杀了创造力，冷漠的玻璃刺穿了我们的文化。\n\n资本主义始终是一股吞噬一切的洪流，将世界化作一片死寂的灰色，将人生变成毫无意义的竞逐，只为追求更高的数字。艺术沦为商品，文化被包装成供人消遣的景点。\n\n而当法西斯举斧叩门，它摧毁的绝不仅仅是艺术，还有我们的朋友、我们的家人，以及我们珍视的一切。但请相信，宁静而自由的生活并非遥不可及，我们终究可以安然地沉浸在所热爱的事物之中。\n\n我们已粉碎了混乱的根源，铲除了暴力的冲动，如今，我们终于能在亲手种下的树荫下安歇。\n\n你见证了法国革命的无与伦比之美，你见证了德国的觉醒，如今，这股浪潮正如画家轻柔的笔触一般，向东方蔓延。革命本身便是一种艺术，而世界将见证，我们的巅峰之作。"
 france.2821.t:0 "美丽高于一切"
 france.2822.a:0 "宏伟蓝图终将完成。"
 france.2822.d:0 "醒来吧，睁开双眼，看看你所缔造的一切——革命如狂野的猛兽，向东方疾驰，紧咬着资本这垂死的猎物，不给它喘息之机。\n\n但这，意味着终结了吗？不，胜利远未到来。资本是一头狡诈的怪物，第二次欧陆战争不过是撕开了它冰冷的皮肉，露出它腐朽的内脏。尽管欧洲已在壮丽的红旗下携手前行，但这头残破的野兽依然拖着沉重的步伐，在世界的角落里舔舐伤口，妄图东山再起。\n\n然而，在这片被压迫的大地上，无数受苦者正高声疾呼，他们的呐喊穿透夜幕，祈盼我们伸出援手，粉碎怪兽最后的桎梏。或许我们的手腕早已挣脱镣铐，但那划破世界的锁链，仍在尖锐地悲鸣，提醒着我们，战斗尚未落幕。\n\n暂歇片刻，见证革命化作永恒。凝望日出，看曙光再次洒满大地，照亮前行的路。\n\n我们的事业，才刚刚开始。"
 france.2822.t:0 "一砖奠基"
 france.283.a:0 "大陆上空风平浪静。"
 france.283.d:0 "数十载风雨飘摇，法兰西饱经战火与占领、革命与暴乱的洗礼，这些伤痕铭刻于心，这些记忆永志不忘。\n\n民主信仰在人民心中屡遭动摇，随着美利坚的分崩离析，暴政的铁蹄似乎注定要将法兰西碾入尘土。俄罗斯一如既往地伺机而动，妄图以武力扩张其在欧陆的版图。我们深知不能永远仰仗美国，作为欧洲人，我们必须像先辈那样自立自强。凭借清醒的头脑与无畏的勇气，我们击退了俄罗斯的威胁，尽管这未能阻止他们卷土重来。\n\n当俄罗斯蜕变为战争恶魔终致自我崩解时，我们再次给予致命一击。法兰西始终是独立自主的灯塔，从未屈从于任何强权的附庸，将来也永不妥协。\n\n我们守护欧陆，而非凭借仇恨与暴政，而是自由民主所铸就的铠甲。"
 france.283.t:0 "雄鸡报晓"
 france.2830.a:0 "大陆上空风平浪静。"
 france.2830.d:0 "我们的大陆始终被动荡环绕。当美洲的朋友们自相残杀，刀锋相向，东方的宿敌必然会将贪婪的目光投向西方，伺机而动。\n\n在地缘政治的纷争中，我们始终坚守人性的底线，誓要捍卫民主，保护最需要庇护的人。我们不将生命化作冷漠的数字，当俄罗斯的铁蹄冲向西方时，我们早已做好准备。\n\n战争的胜利并非仅靠杀戮堆砌，而在于让敌人始终看见那根伸出的橄榄枝，让他们明白，和平始终是可选之路。我们的胜利无可避免，而失败的苦涩则让俄罗斯的统治者陷入盲目的复仇狂热。于是，他们再次来犯，而我们，依旧高举那根象征和平的橄榄枝。\n\n这场战争本不该发生，但我们绝不能坐视不理。\n\n我们向世界证明，历史的黑暗篇章之所以被铭记，正因它们不应重演。\n\n自由、平等、民主——这是我们铭记于心的信念。\n\n当东方再次崛起，我们依旧会伸出橄榄枝，愿世界在和平中迎来新的黎明。"
 france.2830.t:0 "粉红浪潮席卷欧洲"
 france.2831.a:0 "人民已觉醒。"
 france.2831.d:0 "数十载风雨飘摇，法兰西饱经战火与占领、革命与暴乱的洗礼，这些伤痕铭刻于心，这些记忆永志不忘。\n\n民主信仰在人民心中屡遭动摇，随着美利坚的分崩离析，暴政的铁蹄似乎注定要将法兰西碾入尘土。俄罗斯一如既往地伺机而动，妄图以武力扩张其在欧陆的版图。我们深知不能永远仰仗美国，作为欧洲人，我们必须像先辈那样自立自强。凭借清醒的头脑与无畏的勇气，我们击退了俄罗斯的威胁，尽管这未能阻止他们卷土重来。\n\n当俄罗斯蜕变为战争恶魔终致自我崩解时，我们再次给予致命一击。法兰西始终是独立自主的灯塔，从未屈从于任何强权的附庸，将来也永不妥协。\n\n我们守护欧陆，而非凭借仇恨与暴政，而是自由民主所铸就的铠甲。"
 france.2831.t:0 "雄鸡报晓"
 france.2832.a:0 "我们所拥有的愿景……"
 france.2832.d:0 "历史长河之中，总有伟大的领袖，他们如群星般璀璨，在黑暗中独树一帜，照亮人类的征途。他们的名字，跨越时间的洪流，镌刻在永恒之中。\n\n五百年后，凯撒、亚历山大、查理曼的英名仍将被世人铭记。而如今，埃马纽埃尔·马克龙亦跻身其中。\n\n是他的远见，使法兰西在俄罗斯的侵略下屹立不倒；是他的智慧，使法兰西挣脱混乱与纷争的诱惑；是他的意志，使法兰西得以再次直面复仇的俄罗斯。是他，而非德国，是他，而非英国，彻底粉碎了俄罗斯的野心。\n\n今日，法兰西仍在他的庇护之下，过去数十年间，低效的民主程序桎梏了法兰西的腾飞，而如今，随着他的威望彻底奠定，他的名字必将被铭刻在历史的丰碑之上，五百年后，仍将列于伟人之列。\n\n欧洲将更加坚不可摧，\n\n因为它迎来了新的伟人。"
 france.2832.t:0 "伟人之一"
 france.284.a:0 "这些问题让亨利彻夜难眠。"
 france.284.d:0 "一架法国运输直升机在沙漠上空飞行，炽热的撒哈拉太阳刚刚西沉，为沙漠居民带来片刻的凉爽，却也让夜晚的寒意悄然降临。\n亨利紧握步枪，凝视着这片广袤的沙海，沉醉于直升机螺旋桨的轰鸣声中。\n\n他们逐渐逼近降落点，地平线上隐约浮现出一片沙漠中的小绿洲，那是一个未被标注在任何地图上的村落，隐匿在几株稀有的热带草原树木的掩映之下。据传这里隐藏着一个武器库，一直在暗中为伊斯兰叛军提供武器，至少上级是这么对亨利所说，而这一切也不过是高层政治博弈的冰山一角。直升机缓缓降落，远处建筑物内传来阵阵呼喊，显然他们的到来已经引起了注意。\n\n他们迅速行动，分成小队逐栋搜索建筑物，惊醒了那些衣衫褴褛、住在简陋房屋中的家庭，孩子们惊恐地哭喊着。突然，其中一栋房屋内枪声大作，法国士兵迅速予以还击，最终在地下室发现了武器库。一个男孩紧紧抱着被击毙的男子，悲痛欲绝。亨利则负责后方警戒，严阵以待地看守着门口，而其他士兵则忙着清点库存，共缴获了1823支卡拉什尼科夫步枪和84000余发子弹。这是一次重大的军事行动，但孩子的父亲却为此献出了生命，这样的牺牲真的值得吗？"
 france.284.t:0 "旧日帝国"
 france.285.a:0 "仪姆兰的家属 - 第169节"
 france.285.d:0 "伊贝齐马科·钦文杜，1988年出生于南尼日利亚阿马埃克地区的一个伊博族家庭，他的人生轨迹仿佛一场彻头彻尾的悲剧。在贫困与匮乏中长大的他几乎从未享受过干净的饮用水，连一顿像样的饭菜都是奢望。而这一切，都源于联邦政府缺乏资金支持，并且未能对重建饱受战争摧残的南部社区有充分关注。这种境遇让他对那些贪婪且极度腐败的军事精英深恶痛绝，他们掌控着他、他的朋友，以及他最珍视的家人。他在伊斯兰教的慰藉中找到了心灵的寄托，那些因信仰和斗争而永载史册的烈士们给予了他前行的力量。然而，这一切却构筑了一个巨大的悲剧，是对那些上层人士所宣称的原则的彻底背叛。他深知，事情必须有所改变。\n\n事实上，改变已然发生。如今，33岁的他早已摆脱了祖国南部乡村的苦难。但20年前种下的混乱之种，早已在他的心灵深处生根发芽，扼杀了他的纯真与善良，只留下仇恨的火焰在心中熊熊燃烧。对于曾经熟悉他的人而言，他已变得陌生而遥远，标志性的黑色头巾上绣着伊斯兰国西非省的标志，一个在中东、非洲乃至全世界都臭名昭著的符号。他坐在陡峭的山丘上，俯瞰着布拉布勒郊外的一座法国军事基地。\n\n他之所以在那里，只有一个原因——为了伊斯兰教的信仰而献身。\n\n山风轻拂，黄檀树枝摇曳生姿。他按捺住狂跳不断的内心，陷入了沉思。恐惧在他心中蔓延，他深知自己并不愿意走上这条道路。但他也明白，这是他的宿命，是他为了信仰和荣誉必须做出的选择。这是他漫长斗争的顶点，是他终于能在那些前辈烈士中留下自己名字的机会。像苏曼亚和亚西尔这样的烈士，在生命的最后一刻是否也曾感到害怕？可能有，也可能没有。但当他们站在造物主的面前时，这些都不再重要。唯一重要的，是他们的行为与选择。\n\n于是，他坚定地朝着那盏照亮他的灯光走去，紧攥着背心，义无反顾地投身于未知的命运之中。"
 france.285.t:0 "他们所依赖之物"
 france.286.a:0 "“皮埃尔，事情已经超出你的控制了。”"
 france.286.d:0 "巴黎的怒火已燃烧多日，因马克龙政府的政策、退休改革、种族矛盾与反政府情绪而掀起的抗议愈演愈烈。数十人负伤，而随着“黄背心”队伍日益壮大，防暴警察的镇压手段也愈发强硬。在这个喧嚣的黄昏时分，一位身穿黄色背心的酒保缓步而来，制服外披着抗议者的标志，面罩遮住他的表情，双手提着两箱空瓶，仿佛战场上即将登场的士兵。\n\n皮埃尔站在街道的末端，作为这一片抗议的主心骨，他注视着酒保将瓶子放下，玻璃碰撞的清脆声在街道的呐喊中格外显眼。\n“你带了饮料？”皮埃尔半开玩笑地问道。\n“弹药。”酒保带着火焰般的语气回应。\n“别别别，你不会真是那个意思吧？”皮埃尔试探着说。\n“只需加点汽油。”酒保的声音夹杂着一丝阴郁的笑声，隐没在抗议者的呼喊中。\n“这太疯狂了，酒保！汽油弹？我们可能会害死无辜的人。”\n“他们也在慢慢害死我们，用政策，用警棍。你是要等他们将所有抗议逐一瓦解，还是趁现在点燃一场轰动？”\n\n酒保和皮埃尔紧张地对视着。两人都在为人民而战，但他们是同一枚硬币的两面。\n“警察只是奉命行事。”皮埃尔语气坚定地说道。\n“无论有没有你，我们都会让他们无法继续奉命行事。”酒保说完，提起一箱瓶子走向附近的加油站，而他的同伴则递上了一箱已经准备好的燃烧瓶。"
