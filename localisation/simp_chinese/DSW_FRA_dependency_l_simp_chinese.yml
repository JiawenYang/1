 FRA_Harness_Liberal_Social_Media_decision:0 "控制自由派媒体"
 FRA_Heirs_to_Napoleon_spirit:0 "优秀传统"
 FRA_Heirs_to_Napoleon_spirit_desc:0 "我们的军官效力于拿破仑陛下曾带领至辉煌的国家，他们也能像拿破仑一样带领我们走向复兴。"
 FRA_Herve_Gomart_IM:0 "埃尔韦·戈马尔"
 FRA_Herve_Gomart_IM_desc:0 "埃尔韦·戈马尔，法国外交官及情报官员，于2013至2017年间担任法国军事情报局局长。他深耕军事与情报领域，对法国国家安全政策的制定有着重要贡献。戈马尔以其情报事务的专业知识和在协调情报以支援法国军事行动方面的卓越表现而广受赞誉。他担任军事情报局局长的时期，正值法国面临严峻的安全挑战期间，包括恐怖主义威胁及外国军事干预。"
