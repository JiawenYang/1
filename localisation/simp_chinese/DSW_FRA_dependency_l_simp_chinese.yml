 FRA_Oil_Crisis:0 "石油危机"
 FRA_Oil_Crisis_countdown:0 "直到此国策完成，石油危机§R将持续下去§!"
 FRA_Oil_Crisis_desc:0 "随着沙特阿拉伯内战的爆发，阿拉伯半岛失去了此前勉强维持的稳定，整个地区陷入了更深层次的不安全和动荡之中。内战的结束尚无明确迹象，其影响已迅速显现。通过其他渠道获取石油的可能性目前难以实现，因为俄罗斯和委内瑞拉都因西方国家的制裁而被封锁，绕过这些制裁将严重损害我们的国际形象。在我们能够确保可靠的石油来源之前，我们将继续承受沙特权力斗争所带来的冲击和后果。"
 FRA_Olivier_Faure_HM:0 "奥利维耶·富尔"
 FRA_Omnicron_idea:0 "奥密克戎变异株"
 FRA_Omnicron_idea_desc:0 "奥密克戎是SARS-CoV-2病毒的最新变种，其名字为大众所熟知的新冠病毒，最近在南部非洲被首次发现。这一变种的出现，再次掀起了人们对疫情的恐慌，因为目前针对其突变的专门疫苗尚未研发完成。我们唯有寄希望于实验室中的科学家们，他们正在夜以继日地努力研究，期望能尽早合成新的疗法，让这一变种早日被彻底遏制。"
