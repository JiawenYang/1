 FRA_Jean_Castex_HM:0 "让·卡斯泰"
 FRA_Jean_Castex_HM_desc:0 "让·卡斯泰，生于1965年6月25日，法国公务员和政治家，于2020年7月3日接替法国总统埃马纽埃尔·马克龙手下的爱德华·菲利普成为法国总理。卡斯泰拥有公共管理背景，并担任过各种政府职位，包括普拉德市长和奥克西塔尼大区议员。他以其在卫生和社会问题，特别是农村地区问题方面的专业知识而闻名。卡斯泰面临着管理COVID-19大流行和实施经济复苏计划等挑战。他的领导风格通常被描述为务实，注重建立共识。"
 FRA_Jean_Messiha:0 "让·梅西阿"
 FRA_Jean_Messiha_desc:0 "让·梅西阿，生于1970年4月14日，法籍埃及裔政治家，极右翼政党国民联盟成员。他因鲜明的保守与民族主义立场而闻名，主张实施更严格的移民政策、加强边境管控以及保护法国文化。梅西阿在政治舞台上十分活跃，不仅多次投身重要政治运动，更时常对主流政党提出尖锐批评。其社交媒体与公开言论中不乏争议性观点，这进一步巩固了他在公众视野中的独特形象。梅西阿的政治生涯的显著特征在于他全力推广国民联盟的核心理念，并坚定支持党魁玛丽娜·勒庞的领导。"
 FRA_Jean_Noel_Barrot_FM:0 "让-诺埃尔·巴罗"
 FRA_Jordan_Bardella_HM:0 "若尔丹·巴尔代拉"
 FRA_Jordan_Bardella_IM:0 "若尔丹·巴尔代拉"
 FRA_Jordan_Bardella_IM_desc:0 "若尔丹·巴尔代拉，生于1995年9月13日，法国政治家，保守派政党国民联盟成员。他自2019年起担任欧洲议会议员，代表法兰西岛选区。巴尔代拉以其保守主义和民族主义观念闻名，主张实行更加严格的移民政策、加强边境管控和保护法国文化特色。他被视为国民联盟的一颗冉冉升起的党内新星，是该党努力扩大对年轻选民吸引力的关键人物。巴尔代拉政治生涯的特点是大力支持国民联盟领导人玛丽娜·勒庞，同时努力宣传该党的纲领。"
