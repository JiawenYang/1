 FRA_Align_Madagascar_decision:0 "[MAD.GetFlag]支持马达加斯加"
 FRA_Align_Madagascar_decision_desc:0 "自1960年马达加斯加成功争取独立以来，我们在印度洋的影响力便因失去这座岛屿而受到限制。如今，重新殖民化已是痴人说梦，因此我们的目标应当转向通过扩大软实力来弥补我国殖民史中的错误，使这片曾与我们息息相关的岛屿再次融入我们的势力范围。只有这样，我们才能确保我们的海军实力重返大国之巅，在印度洋上再次彰显昔日的荣耀与威严。"
