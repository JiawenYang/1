 FRA_Florence_Parly_IntelM:0 "弗洛朗丝·帕利"
 FRA_Florence_Parly_IntelM_desc:0 "弗洛朗丝·帕利，生于1963年5月8日，法国政治家，曾多次出任部长职务。作为共和国前进党成员及埃马纽埃尔·马克龙总统的亲密战友，帕利自2017年起担任法国武装部队部长，负责监督国家军事与国防政策。她积极推动法国军队的现代化进程，致力于提升国防实力。帕利以其深厚的国防事务专业知识，以及在维护法国在日益复杂国际环境中安全的坚定承诺而广受赞誉。"
