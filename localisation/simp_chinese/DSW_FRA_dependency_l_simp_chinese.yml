 MELENCHON_AI_BEHAVIOR_TXT_DESC:0 "当完成“开场截击”国策后，系统将站在§3玛丽安·勒庞§!一边，但在一场公开的未遂政变发生后，§O复兴党§!和§3国民联盟§!将失去公众青睐，并导致§p新人民阵线§!赢得2022年大选。\n\n§R要求：§!\n§p新人民阵线§!成立。"
