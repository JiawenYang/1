 latinist.2.a:0 "我们是欧洲文明之心"
 latinist.2.b:0 "曾在拿破仑权威下团结一心"
 latinist.2.c:0 "只是白人中一枚小小的齿轮"
 latinist.2.d:0 "在这个被怀疑论和虚伪的国际主义污染的时代，是时候发出我们真实的声音，宣告我们不可动摇的民族信念，现代性正在撕裂法兰西的灵魂，而我们必须再混乱之中找回那属于拉丁人的骄傲与尊严。\n\n看看我们的历史，可以说：没有法兰西，就没有真正的欧洲。罗马帝国陨落后，是我们保存了古典智慧的火种，启蒙运动从我们这里爆发，理性与自由的种子从塞纳河畔播撒到全世界。那些德意志人、盎格鲁-撒克逊人不过是文明的后来者，他们的所谓“文化贡献”不过是对我们伟大遗产的拙劣模仿，欧洲文明的灵魂是拉丁的，是法兰西的！\n\n当拿破仑的鹰旗飘扬在莫斯科、马德里和柏林的上空，我们曾让世界见识了法兰西民族团结一心的可怕力量，我们的军队所向披靡，我们的法律重塑了一个大陆，历史一次又一次地证明：我们需要的不是软弱的妥协和无谓的辩论，而是果断的行动和坚定的领导！只有重温这种铁血荣光，我们才能在当今混乱的世界中重新崛起！\n\n看看今天的欧洲，我们必须认清一个残酷的现实：在全球力量的大棋局中，欧洲白人民族正面临前所未有的挑战，我们不能再分裂，不能再互相指责。从爱尔兰到乌拉尔山脉，从斯堪的纳维亚到地中海，我们同属一个命运共同体。法兰西必须认识到自己是这个更大整体中的一员，我们的斗争是所有欧洲人民共同的斗争，唯有团结起来，我们才能保卫我们的传统、我们的生活方式、我们的文明成果免受外来威胁。"
 latinist.2.t:0 "拉丁人民……"
 latinist.3.a:0 "我们是心怀不满的青年"
 latinist.3.b:0 "我们是滑铁卢的士兵"
 latinist.3.c:0 "我们是匈奴人、汪达尔人和蒙古人的终结者"
 latinist.3.d:0 "曾经的那些西装革履的叛徒们，他们教导我们的孩子唾弃自己的历史，羞辱自己的文化，质疑自己的血脉。但觉醒的时刻已经到来，我们将重新夺回被窃取的荣光，修复那根被刻意切断的历史纽带。\n\n当权者用虚假繁荣的毒药麻痹了民族的神经，而我们是唯一还能感受到这种背叛之痛的群体。叛徒们在学校里教给我们扭曲的历史，要我们为祖先的伟大成就感到羞耻，难道要我们为传播文明而自责？不！我们拒绝这种自我鞭笞的奴隶心态，拉丁青年的火焰永不熄灭！\n\n滑铁卢这个名字不应该是我们的耻辱，而应该是我们最强大的精神图腾。那场失败背后是整个欧洲联合起来对抗一个民族的卑鄙阴谋，但即使在最黑暗的时刻，法兰西的士兵依然高喊着皇帝的名字，他们的精神从未被真正打败，他们的血脉在我们体内流淌，他们的精神从未离开这片土地。\n\n当野蛮的匈奴人踏破欧洲的大门，是谁站了出来？是我们的祖先，当汪达尔人肆虐地中海，是谁重建了秩序？是我们的先王们。当成吉思汗的后代妄图吞并整个欧洲，是谁筑起了文明的防线？还是我们。\n\n我们必须重新拥抱这段被刻意掩盖的辉煌历史，因为只有认清我们是谁，我们才能决定要去向何方。历史不会等待犹豫者，荣光只属于敢于追寻祖先足迹的勇者，法兰西的命运正握在我们手中，而今日的选择将决定明日的欧洲。"
 latinist.3.t:0 "与我们过去的联系……"
 latinist.5.a:0 "基督国度中的基督和平"
 latinist.5.d:0 "身在罗马的那位“教宗”似乎并不怎么认可我们为教会做出的最新贡献……众所周知，这位红色思想的同情者长久以来一直为我们社会中的自由主义流毒摇唇鼓舌，向那些恋童癖精英分子卑躬屈膝。他必须由一个对我们的信仰更加认同的人，例如阿兰·耶斯拉达所取代。"
 latinist.5.t:0 "僭称教宗宣言"
 latinist.6.a:0 "幸运女神眷顾勇者！"
 latinist.6.d:0 "“Au-den-tes，for-tu-na，ju-vat…”卡篷感觉每个音节都像是从喉咙里硬拽出来。“老天，这简直是折磨！”他啪地合上书本，环顾四周荡荡的教室。“为什么在二十一世纪我们还要学习这种死掉的语言？谁还会用拉丁语说话？”\n\n“年轻人，我想维吉尔会对你的发音感到惊讶，虽然不一定是好的那种。”一个沉稳的声音从教室后方传来。卡篷转过身，看到古典文学科的亨利教授站在门口，手里拿着一本古旧的皮面书籍。\n\n“教授，我不知道您在这里…”卡篷有些尴尬地站起来。亨利教摆摆手示意他坐下。“继续你刚才的论点。拉丁语过时了，是吗？”卡篷犹豫了一下，“是的，先生。我们学习语言是为了交流，而拉丁语已经没有实际用途了。”亨利教授露出一丝微笑，在卡篷对面坐下。“实用主义的论点，很现代。”他轻轻敲了敲卡篷的课本，“但你知道你刚才在念的那句话是什么意思吗？”\n\n“‘命运眷顾勇敢者’，”卡篷回答道，“维吉尔的《埃涅阿斯纪》。”\n\n“不错。”亨利教授满意的点了点头，“当革命者高喊‘自由、平等、博爱’时，他们使用的概念可以直接追溯到古罗马的‘libertas’、‘aequitas’和‘fraternitas’。可以说，拉丁语是法兰西的灵魂，是我们祖国的根基”\n\n“但这不代表我们必须学习整个语言，”卡篷反驳道，“我们可以只学习这些重要的短语和概念。”教授站起身，走到窗前。阳光透过他花白的头发，在地板上投下长长的影子。“你知道为什么法国在历史上如此重视‘普遍性’的观念吗？为什么我们相信某些价值观是超越时空的？这种思维模式直接来自罗马人的普世主义。拉丁语不仅仅是过去的遗迹，也是通向我们文化根源的钥匙。”"
 latinist.6.t:0 "说方言"
 latinist.7.a:0 "我等欧罗巴人民将捍卫我们孩子们的未来……"
 latinist.7.b:0 "我们感谢您的努力，但我们还是希望保持主权独立。"
 latinist.7.c:0 "我们受够这些小把戏了！"
 latinist.7.d:0 "自罗马帝国崩溃之后的漫长岁月，统一欧罗巴之梦启发了这片大陆上诸多仁人志士的梦想、希望与荣耀，但也作为导火索点燃了数场有史以来最血腥的冲突，致使千万人为之丧命。无论是哈布斯堡的查理五世或波旁的路易十四等专制君主，抑或是之后从拿破仑到希特勒的历代僭主，以残酷军事手段统一欧洲的尝试屡屡失败，致使人们最终尝试走上以邦联形式整合和团结欧洲的道路。《马斯特里赫特条约》标志着这一道路的里程碑，并使得欧洲比历史上任何时刻都接近统一。\n\n然而，天不遂人愿。2015年，英国脱欧公投惊雷打破了脆弱的平衡。历史车轮缓缓辗过21世纪10年代，新冠病毒疫情与东欧冲突几乎完全葬送了邦联化道路的前景，未来日渐显得黯淡无光。值此存亡之际，团结纽带之精神便更值得铭记与呵护，而其独一无二之力量也最有可能驱散笼罩在我们头顶上空的阴云。\n\n作为欧洲文明的引领者之一，法国政府和其人民的选择将决定本世纪剩余时间内欧洲的命运。法兰西将会在未来的欧洲统一联邦中发挥主导作用吗？抑或是保留作为高卢人的骄傲以独立姿态继续对抗一切威胁？或者是彻底与旧路线分道扬镳，将《欢乐颂》乐谱扫进垃圾堆？"
 latinist.7.t:0 "欧洲联邦化"
 latinist.71.a:0 "抵抗苏维埃国际主义之盾！"
 latinist.71.b:0 "法国佬再次尝试重建帝国"
 latinist.71.d:0 "法国政府察觉到了我们的困境，向我们伸出了橄榄枝，邀请我们加入一个崭新的欧洲国家。这无疑是一个引人深思的提议。随着北约的瓦解以及在欧陆战争中的惨败，我们已在欧洲失去了所有盟友。如今，国家陷入危机，我们迫切需要援助，否则，东方那些野心勃勃的共产主义者定会毫不犹豫地入侵，抹去我们的文化，将我们沦为他们手中的棋子。"
 latinist.71.t:0 "欧罗巴联邦"
 latinist.72.a:0 "勿流无谓之血。"
 latinist.72.b:0 "好话早已说尽，只有暴力这种语言才能让愚人明白事理！"
 latinist.72.d:0 "我们是血脉相连的骨肉至亲。命运的红线将我们的人民紧紧相连，皮肤下奔涌的殷红血脉使我们浑然一体。从波尔扎诺的阿尔卑斯雪山，到伊比利亚的比利牛斯翡翠山脉，我们始终同属一个民族，共为命运共同体。维系我们的不仅是血缘纽带，更有文化基因与历史脉络铸就的钢铁羁绊。\n\n我们曾满怀诚意，无数次向手足同胞伸出和平统一的金橄榄枝。可换来的尽是轻蔑、嘲弄与背弃！我们奉献的是手足之情与兄弟之爱。若实现民族统一，必将铸就空前强大的经济军事力量，惠泽全体同胞。然而他们充耳不闻，既无理性判断，又失同胞信义，更可悲的是死死攥着那点可怜的“民族主义”与“地方主义”破旗不放。他们仍被分裂主义的虚妄迷雾蒙蔽双眼，看不见统一伟业带来的万丈荣光。\n\n无人愿见手足相残，但当至爱之人持续诋毁背叛，我们岂能坐视不理？！纵使圣贤亦有雷霆之怒，法兰西的忍耐已至极限。此刻我们站在命运十字路口：是最后一次伸出和解之手，恳求理性之光驱散阴霾？还是让子弹与炮火代我们发声？"
 latinist.72.t:0 "精疲力竭"
 latinist.8.a:0 "为达目的的必要手段。"
 latinist.8.b:0 "我们拒绝。"
 latinist.8.d:0 "对于新帝国来说，有一个问题现在是“房间里的大象”——如何对付奥得河-尼斯河线那个庞然大物，正张牙舞爪意欲吞下整个欧洲乃至世界的俄罗斯霸权？若是其他人执掌法兰西权柄，或许还可对这一难题的解决稍加拖延，但退却和让步绝不属于自命将成为欧洲唯一领袖的法兰西帝国，迎难而上才是它的本色。\n\n然而，今日绝非以往，通过一场大会战换一份《提尔西特和约》的好事绝无可能在21世纪的欧洲重演。对抗俄罗斯强权是一项细水长流的艰巨任务。皇帝和他的顾问们便转向自己的先祖，伟大的拿破仑一世寻求答案——大陆封锁体系，这一昔日和俄国结盟对抗英国的战略在今日则将调转其矛头对付百年前的斯拉夫盟友。法兰西帝国领导层们认为，法国握有海军和海洋贸易方面的优势，同时还具备欧盟其他国家的支持，并能够争取其他摇摆不定的欧洲边缘小国；相比之下，俄罗斯能打的牌就很少，而将他们封闭在波罗的海和黑海的狭小水域中也有利于未来可能的军事摊牌。\n\n尽管如此，也有一部分人质疑这一战略的可行性。不少人提出俄国可能会依靠他们的东方友邦，不受限制地继续开展贸易；也有人指出重建大陆封锁体系对欧洲本身危害更大，尤其是在许多欧盟成员国仍无法摆脱俄罗斯输送的石油与天然气影响的当下。那么，皇帝是会追寻自己先祖的荣耀？还是更加审时度势？"
 latinist.8.t:0 "新大陆封锁体系"
 latinist.9.a:0 "新时代意味着新宫殿"
 latinist.9.b:0 "必须把它带入现代"
 latinist.9.c:0 "一切如常！"
 latinist.9.d:0 "“凡尔赛宫已屹立四百年，许多房间如今空空如也，或作为游客的展示空间，它已成了宫殿的骨架。经过数月的修复，添置新家具和历史艺术品，定能将其恢复到昔日的宏伟，同时融入现代的韵味。”\n\n“凡尔赛宫已完成其使命，这座历经半千年风雨的宫殿应继续作为旅游胜地。而新的、更为壮丽的宫殿则应应运而生，满足其主人一切需求。”\n\n“无需对凡尔赛进行修复或‘现代化’处理，应将其从单纯的旅游景点转化为一个功能齐全的帝王宫殿，特别是为帝国皇室与政府提供服务，尤其是它的西南翼。”"
