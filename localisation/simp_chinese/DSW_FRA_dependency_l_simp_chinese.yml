 FAF_revive_the_franco_german_brigades_decision:0 "重设法德混合旅"
 FAF_revive_the_franco_german_brigades_decision_desc:0 "我们与德国之间虽曾有纷争，但终究是兄弟。这份深厚的联系，在鲜血与考验中铸就，无法轻易割裂。如今，东方的共同敌人正威胁着两国的稳定与生存，我们必须加强合作，共同迎敌。逐步深化法德两国的协作，是我们迈向未来的必经之路。重组精锐的法德联合旅，虽仅是第一步，却是迈向更紧密联盟的关键一步。"
