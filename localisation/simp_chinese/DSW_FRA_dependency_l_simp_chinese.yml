 FRA_covid_curing:0 "疗效分配"
 FRA_covid_curing_desc:0 "法国人民终于迎来了久违的喘息，得益于欧洲科学家们的英勇努力，一款经过严谨测试的疫苗已成功问世，能够有效缓解这场大流行带来的阴霾。虽然疫苗的全面接种尚需时日，但我们能够如此迅速地研制出这一“治愈之匙”，无疑是一个伟大的里程碑。病毒的彻底根除，如今似乎已近在咫尺。COVID-19正逐渐淡去，最终或将化为一种微不足道的普通感冒。"
 FRA_covid_idea_1:0 "新冠影响低"
 FRA_covid_idea_1_desc:0 "新冠疫情最终也已踏入欧洲大陆，传播无休无止，高感染率为应急系统和政府带来巨大压力。为此大小委员会、科学家以及各级官员倾力合作，以遏制病毒在全国的迅速传播。\n\n§R若未能解决，国家会迎来灾难性的后果。§!"
