 FRA_Catherine_Colonna_FM:0 "卡特琳·科隆纳"
 FRA_Catherine_Colonna_FM_desc:0 "卡特琳·科隆纳，生于1956年3月17日，法国外交官和政治家。她曾担任过多种外交职务，包括2017至2021年间担任法国驻英国大使。她还曾在法国政府核心部门担任要职，于2004至2005年雅克·希拉克总统任期内出任欧洲事务部长。她参与了法国外交政策的制定，特别是在欧洲相关事务方面发挥了作用。科隆纳以卓越的外交技巧和专业知识著称，擅长在国际舞台上为法国争取利益，加强欧洲各国之间的合作。"
