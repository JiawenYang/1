 FAF_eu_beauty_idea:0 "欧洲处女地"
 FAF_euro_navy_annexation_tt:0 "通过外交谈判，欧洲、太平洋和大西洋的海军指挥部已同意加入我们的阵营，共同对抗苏联共产主义霸权。"
 FAF_europa_united_against_communism_decision:0 "欧罗巴联合对抗共产主义"
 FAF_europa_united_against_communism_decision_desc:0 "在众多意识形态中，共产主义是与欧洲身份最为对立的存在。他们以虚假的繁荣承诺诱骗工人，实则妄图摧毁欧洲的文化与传统，在他们那无休止的“平等”幻想之下，真正的目标是消灭我们的身份认同，使欧洲沦为单一化的荒漠。不无论东方之敌是否已重归布尔什维主义，其昔日的联系都已在欧洲掀起反俄情绪的浪潮。而今，既然机会已至，我们何不一举两得？彻底清除极左分子，使法兰西免受红色毒瘤的侵蚀！"
 FAF_europe_for_europeans_decision:0 "欧洲人的欧洲"
 FAF_europe_for_europeans_decision_desc:0 "自我们运动肇始，我们始终坚守一个信念：欧洲当仅属于欧洲人。如今权力在握，我们终于能将昔日的呐喊化为切实的政策，巩固我们的统治。左翼激进分子，无论是马克思主义者抑或自由派，如今再也无法高喊“煽动仇恨”或指责我们对这些外来者缺乏“同情”。是时候兑现我们的承诺了！"
 FAF_european_ducat_idea:0 "欧元"
