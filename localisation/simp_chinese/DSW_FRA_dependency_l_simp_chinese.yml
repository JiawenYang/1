 france.291.a:0 "“如果连吵架都不会了，我们还算什么法国人？”"
 france.291.d:0 "“让我给你们讲个有趣的事，”让-保罗·杜瓦尔站在喜剧俱乐部的舞台上，灯光打在他的笑容上，“昨天我看到两支游行队伍在香榭丽舍大道上相遇了。支持派高喊着‘为了法兰西，我们应该注射疫苗！’，反对派也高喊着‘为了法兰西，我们应该拒绝疫苗！’。多么讽刺，两边都说为了祖国，却恨不得把对方赶出这个国家。”\n\n“反对派说支持派是‘暴政的帮凶’，支持派说反对派是‘秩序的破坏者’，最后甚至演变成一场互殴。我在想，既然大家都这么热爱法兰西，为什么不找个咖啡馆坐下来，一边享用可颂，一边优雅地互相指责对方是叛徒呢？至少这样更符合法国人的传统，不是吗？”\n\n让-保罗停顿了一下，脸上露出思考的表情：“更奇怪的是，两边都说对方被洗脑了。这让我想起了我的邻居们——住在左边的说我被右边洗脑了，住在右边的说我被左边洗脑了。所以我决定搬到楼上去，这样他们就只能说我高高在上了。”\n\n台下的笑声更大了。“所以，”他举起手中的水杯，“让我们为法兰西干杯吧。为这个把革命精神写进基因的民族，为这个连吵架都要讲究美学的文明。”"
 france.291.t:0 "脱口秀"
 france.292.a:0 "真是个小丑！"
 france.292.d:0 "“鲁道夫·普吕多姆先生，请登台。”一位站在演讲台上的认同主义党派干事高声宣布。\n\n鲁道夫·普吕多姆是该组织德高望重的长者，多年来，他在家乡波尔多积极推动该运动的发展。今日，他将主持塔伦斯区的一次集会开幕式，集会地点就在一个公共公园的外面。这无疑是吸引公众目光、明确该地区未来一季度运动策略的黄金机会。\n听到自己的名字被点到，鲁道夫缓缓走上演讲台，向干事点头致意，随后开始发表讲话。尽管年事已高，但他言辞严谨、坚韧不拔，这也是他能在党内迅速崭露头角的重要原因之一。他的话语中充满了对20世纪那些先驱革命者和烈士的敬仰，同时也蕴含着对后世新一代所需智慧和洞察力的期许。当他谈及大量土耳其、马格里布和撒哈拉以南的移民涌入大巴黎区并成为多数群体时，听众们报以热烈的掌声。\n最终，他结束了激情洋溢的演讲，将舞台交给了莱昂·迪韦尔热，一位年轻而缺乏经验的党派成员。这显然是精心安排的一环，象征着老一辈与年轻一代之间的“火炬传递”。然而，鲁道夫并不知道，莱昂因其自相矛盾且时常滑稽的信仰体系以及不太中听的措辞而备受嘲笑。\n尽管遭受了同伴的轻视，莱昂还是鼓起勇气走上了演讲台，开始了他的演讲。\n\n“朋友们，兄弟们，我想首先就普吕多姆先生在吉伦特省的战略发表一些看法。对这位伟人本人我充满敬意，但我想请问，西方的欧亚主义如何才能实现其目标？如果它——”\n\n他的话被一阵嘈杂的笑声和嘘声打断，这显然是他措辞不当所致。他试图继续发言，但人们却嘲笑着他将他赶下了演讲台。这场尴尬的演讲最终也导致他离开了该党。"
 france.292.t:0 "西方欧亚主义"
 france.293.a:0 "“小伙子们，打起精神来！”"
 france.293.d:0 "安托万·迪普雷少校的战机掠过撒哈拉上空，三万英尺的高度让整个沙漠在他眼前铺展成一幅壮丽的画卷，金黄的沙丘在热浪中起伏。他身后是中队的其他战机，它们整齐地排列在蔚蓝的天幕下，机翼在烈日中泛着银光。\n\n透过座舱的有机玻璃，安托万能清晰地看到下方连绵起伏的沙海。热气扭曲了地平线，使得远方的一切都像是海市蜃楼般朦胧。就在这时，他在西南方向发现了一串不寻常的尘埃痕迹，通过机载光电系统，他看到那是一队正在缓慢移动的车辆，它们在阳光下拖着长长的影子，像是一串爬行的蚂蚁。\n\n“总部，这里是‘天琴座’，坐标点23°15'N，5°47'E发现可疑目标，车队规模约十二辆，正向南移动。”\n\n“收到，‘天琴座’，”基地指挥官的声音透过耳机传来，“准许交火。”\n\n“明白，‘利剑2号’、‘利剑3号’，”安托万对着通讯器说道，“向西南偏转三度，保持高度。”"
 france.293.t:0 "沙漠雄鹰"
 france.294.a:0 ""
 france.294.d:0 ""
 france.294.t:0 ""
 france.295.a:0 "他们站在原地，看着火焰渐渐熄灭。"
 france.295.d:0 "蒙帕纳斯区的平静夜晚，艾蒂安·勒迈尔和索菲·杜邦在小巷里的一个铁桶里生起了火，火焰在寂静中舔舐着砖墙，将两个人的身影投射在墙上。艾蒂安手中捧着一本烫金封面的《圣经》，索菲则翻看着一本已经泛黄的《古兰经》译本，这些书籍都来自他们各自虔诚的祖父母。\n\n“看看这些，”艾蒂安说着，手指划过《圣经》的书页，”每一个字都像是一道枷锁，束缚着人们的想象力，这些教士真觉得他们能够扼杀人类独有的创造天性。”艾蒂安将《圣经》扔进火堆，索菲紧随其后把《古兰经》投入火中。书页在高温下卷曲，烫金的字母在火光中扭曲变形，宛如挣扎的囚徒。\n\n“他们说我们亵渎神明，但真正的亵渎难道不是将生命的激情束缚在这些发黄的纸页之中吗？”苏菲边说边从背包里拿出几本宗教典籍，这些都是他们从旧书摊上收集来的。\n\n巷子里弥漫着纸张燃烧的气息，混合着墙角野蔷薇残存的香气。对面咖啡馆的灯光透过玻璃窗，将两人的影子拉得很长。索菲从口袋里掏出一张她刚画完的素描，她将素描撕成碎片，撒向火堆。“看，艺术不应该被固定在纸上，它应该像这样，在毁灭中重生。”火光映照着她苍白的脸庞，那一刻她看起来既像是一个叛逆的破坏者，又像是一个虔诚的祭司。当最后一页书纸化为灰烬时，远处的钟声恰好敲响了十二下。"
 france.295.t:0 "法兰西的夜色星空"
 france.296.a:0 "如果你们可以保住共和制的话……"
 france.296.d:0 "“我今年九十七岁了，”保罗·杜瓦尔站在纪念馆的讲台上，他那布满皱纹的手轻轻抚摸着胸前的勋章，“当年在战场上，我们这些年轻人为了保卫共和国的理想而战斗。那时候，自由对我们来说不是一个抽象的词汇，而是值得用生命去捍卫的信仰。”\n\n他停顿了一下，目光扫过台下年轻的面孔：“但今天，我看到一些令人忧心的迹象。有人说民主制度已经过时了，有人说需要一个强权来领导我们。年轻人啊，这些话我们在1940年也听过，那些投降主义者也是这样说的。”\n\n“你们中有人可能觉得我是个唠叨的老头子，总是念叨着过去的事。但请记住，历史从来不会简单地重复，它总是以新的面貌出现。当年的法西斯不会再穿着军装出现，他们会穿着西装，说着动听的话，许诺给你们一个‘更好’的未来。”\n\n“我的时间不多了，但法兰西的未来是属于你们的。我们这一代人用鲜血换来的自由和平等，现在就要交到你们手中。不要被那些蛊惑人心的话语迷惑，不要用仇恨和偏见来取代理性与宽容，不要让那些为自由献出生命的人白白牺牲。”\n\n“记住，真正的爱国不是仇恨别人，而是珍惜我们共同的价值观。法兰西的伟大不在于它的军事力量，而在于它所代表的精神。”"
 france.296.t:0 "旧日残响"
 france.297.a:0 "家庭……与混乱。"
 france.297.d:0 "房间里的光线昏暗，仅有烟灰缸中高卢烟的微弱火光在跳动，映出一片若隐若现的光影。让-马里·勒庞坐在雕刻精美的木桌一侧，手指在桌面上有节奏地轻敲。对面，玛丽娜穿着一身剪裁利落的西装外套，端着咖啡轻抿一口，眼中写满了无数次集会与会议后的疲惫。\n\n“那么，”让-马里开口了，声音低沉沙哑，像被岁月磨砺过的砂纸，“你觉得自己已经超越了我？”\n玛丽娜挑眉，表情平静得让人无法琢磨。“父亲，”她语调稳如止水，“这不是背离你，而是前进。现在的人们不再想听那些赤裸的种族主义言论，他们想要……更温和的表达。”\n\n“温和？”让-马里猛地提高音量，椅子几乎向后倾倒。“你把这叫温和？向软弱者妥协？稀释了我们家族政党的灵魂所在？然而，”他叹了一口气，吐出一缕烟雾，“你却总是将我的影子带在身边。每一场演讲，每一个政纲，每一条政策——你母亲会把这一切称作致敬。”\n\n玛丽娜嘴角微微扬起，笑意中透着几分锐利。“不是致敬，是修正。”\n\n老人低声笑了，笑声如碎石从山坡滚落。“好吧，小丫头，”他用力按灭了烟头，火星四溅，“如果你要修正我，至少记得把它做得彻底些。”"
 france.297.t:0 "家庭聚会"
 france.298.a:0 "西里尔，问题的关键并不总在于数量。"
 france.298.b:0 "我认为他们应该少一点对自己的恐惧。"
 france.298.d:0 "西里尔·哈努纳如同往常一样，顺利完成了他那标志性的夜间开场白，随后便请出了今晚的特别嘉宾。\n\n这位嘉宾便是皮埃尔·席尔将军。\n\n“让我们用热烈的掌声欢迎皮埃尔·席尔将军的到来！”这位法籍突尼斯裔主持人向演播室的观众热情介绍，掌声瞬间如潮水般响起。将军身着笔挺的制服步入舞台，军帽在璀璨的灯光下熠熠生辉。他面带微笑，优雅地坐在了嘉宾席上。\n席尔将军知道哈努纳是个喜剧演员，他的幽默旨在给观众和全国人民带来欢乐。而邀请军方官员参与节目，自然需要准备些诙谐幽默的段子。因此，当哈努纳开始发言时，将军的脸上露出了略带紧张的笑容。\n\n起初话题还算正常，但随后便逐渐转向了法国的盟友，最终聚焦到了德国。“那么，联邦国防军怎么样呢？”席尔将军好奇地问道。哈努纳则打趣地回应：“嗯，规模确实挺小的，不是吗？哈哈！”席尔将军听后神情变得严肃起来，毕竟身为北约司令部的高级军官，他的言辞可能会影响到两国之间的关系。\n\n他此刻的回应可谓至关重要。席尔犹豫了片刻，感受到演播室灯光直射在脸上，然后深吸了一口气……"
 france.298.t:0 "别碰我的电视机！"
 france.299.a:0 "你就乖乖呆着吧"
 france.299.d:0 "当抗议队伍逼近巴黎市中心之际，有人提出要对政府采取直接行动。在民众强烈意愿的推动下，警方不得不逐步后退，并在市中心集结。相较于其他政党，保守派的强硬政府对抗议者的容忍度要低得多。在“黄背心”运动中，这些抗议者被称作“破坏者”，他们呼吁民众要抓住此次机遇。\n\n市政厅前，两支抗议队伍汇聚。一方手持石块、锤子，另一方则举着因连日抗争而皱褶不堪的标语。一块石头猛然砸破了窗户，一名抗议者愤怒地喊道：“住手！别破坏办公室！那里是工人的地方！”另一方却抡起锤子，用力砸向大门。\n“既然如此，那他们就不该为暴君效力！”话音未落，又一块玻璃在哗然声中碎裂。\n\n和平抗议者站在门口，誓言阻止大楼的掠夺。\n“汽油弹！”一声怒吼打破了僵局。他们从台阶上惊恐跃下，熊熊火焰在门口腾起，转瞬间将入口吞噬殆尽。他们眼睁睁地看着自己的同伴翻窗而入，扛着电视、手机和电脑从大楼中走出。他们心如刀割，因为数百人的生计将在未来的数月中付诸东流。而这一天，本应属于工人阶级的抗争，却变成了工人阶级自身的悲剧。"
 france.299.t:0 "里昂式清算"
 france.3.b:0 "马克龙获得胜利"
 france.3.c:0 "电子投票瞬间崩溃，现只接受手写选票"
 france.3.e:0 "人民阵线险胜！"
 france.3.f:0 "德维利耶之凯旋"
 france.3.g:0 "勒庞惜败……"
 france.3.h:0 "马克龙惜败……"
 france.300.a:0 "我们将引领第三世界的民主！"
 france.300.b:0 "我们这么做只是为了国家利益。"
 france.300.d:0 "法国与非洲的关系可以说是……复杂的。\n\n我们对非洲的殖民无疑是我们两国历史上的一段不幸时期。殖民化遗留在非洲的问题至今依然存在，这片大陆饱受反民主势力带来的不稳定、经济贫困和健康危机的折磨。\n\n正因如此，我国政府中许多人认为，纠正过去的错误是我们的责任。他们声称非洲承受的苦难应归咎于我们。为此，我们必须通过援助当地民主政权、遏制极端主义和威权主义蔓延来支持非洲发展。\n\n但法国国内并非意见一致。许多人认为这样做毫无意义，因为在阻止如利比亚等国的独裁统治过程中，相关国家往往陷入比之前更糟糕的境地。他们并不否认非洲能带来诸多利益，尤其是其丰富的自然资源。然而他们认为，没有必要让法国进一步卷入代价高昂且看似永无止境的冲突。无论如何，我们选择的道路都将决定法国在非洲的未来。\n\n"
 france.300.t:0 "我们的非洲遗产……"
 france.301.a:0 "临睡前又闹腾上了。"
 france.301.d:0 "局势突变却又在情理之中，法国多位顶尖工会领袖突遭腐败指控，资金滥用、贿赂、洗钱等欺诈行为纷纷曝光。尽管法庭持中立立场，证据亦确凿无疑，各大工会的支持者仍纷纷发起抗议，声称这是对工人阶级的打击，更是政府为大企业站台的明证。许多抗议者已转向暴力行为，法国多座城市上空浓烟滚滚。防暴警察虽已展开镇压，这场骚乱恐怕也要等到参与者自行散去方能彻底平息。"
 france.301.t:0 "工会高层涉贪遭起诉"
 france.304.a:0 "就该这么办！"
 france.304.b:0 "“呃…我觉得您不该这么做?”"
 france.304.d:0 "在一个天气晴朗的日子，埃马纽埃尔·马克龙坐在他巴黎的办公室里。他神情专注地凝视着远处的一面旗帜。\n\n“它的颜色应该更深一些，”他心不在焉地自言自语道。“我希望它的颜色能更深一些，这样它就不会和天空融为一体了。去拿一面颜色更深的，把它升上去，快。”他指示着一名总统卫兵并说道。"
 france.304.t:0 "更深的颜色搭配一个更黑暗的时代"
 france.305.a:0 "第一步……"
 france.305.d:0 "近日，法国保守派政治人物若尔丹·巴尔代拉正通过多种渠道传播其“全民言论自由”主张，并向议会提交请愿书，试图推动修改法国言论自由法的限制条款。虽然令人钦佩，但这一举动引发媒体质疑，因为巴尔代拉恰在其极右翼身份认同党遭法国政府官方审查后专门发起了这项运动。"
 france.305.t:0 "巴尔代拉呼吁言论自由"
 france.306.a:0 "我们终于可以大展身手了……"
 france.306.d:0 "在连任法兰西共和国总统后遭遇极端动荡的马克龙，宣布国家进入紧急状态，并破例邀请保守派政党国民联盟加入政府以平息乱局。\n\n此举虽遭执政盟友甚至党内人士抨击，但被宣称是“动荡困顿时期的必要之举”，是避免法兰西再度陷入内乱深渊的关键抉择。\n\n沙漏中的流沙正坠向抉择时刻。无论结局如何，命运之河终将在寥寥数条支流中择道而行。"
 france.306.t:0 "宣布国家紧急状态"
 france.307.a:0 "玛尔斯将崛起……"
 france.307.d:0 "今日，埃马纽埃尔·马克龙在全国人民的注视下，坐于失败之中，正式宣布辞去法兰西总统职务，并任命保守派领导人若尔丹·巴尔代拉为继任者。随着紧急状态的宣布，以及马克龙内阁的解散，这一刻的到来似乎已是必然。毕竟，他对政权的掌控早已岌岌可危，甚至他的党内盟友也开始倒戈，要求罢免这位因颁布戒严法而被斥为暴君的领导人。但如今，已不是马克龙沉溺于失落之时，而是巴尔代拉崛起之日。他将作为法兰西的救世主，挺身而出，带领国家走出泥潭，抵御那自东方席卷而来的斯拉夫铁骑。"
 france.307.t:0 "朱庇特的陨落"
 france.309.a:0 "谣言终归只是谣言。"
 france.309.b:0 "我们不可能成为兄弟……"
 france.309.d:0 "自古以来，法兰西与德意志民族便从未真正达成共识。这种局面在第二次世界大战后发生了转变，我们迫使德国人从其民族特性中彻底清除了所有普鲁士军国主义的痕迹。通过根除这个长久以来定义德意志的军事传统，我们无意间摧毁了欧洲独自对抗俄罗斯巨兽的任何可能……\n\n然而如今，俄罗斯已然战败并四分五裂，普鲁士军国主义却再度抬头。我们的情报人员报告称，德国民族主义者正窃议我们的所谓“软弱”……并要求对其前领土阿尔萨斯-洛林进行“光荣征用”……让我们的祖先之地阿尔萨斯-洛林面临再次沦陷于德国人的铁蹄之下，这是我们的领导人，也是全体法国人民都绝不允许发生的事。"
 france.309.t:0 "束缚之链"
 france.310.a:0 "我们会碾碎他们！"
 france.310.d:0 "法国政府因蔑视少数希望我国政府收回前领土阿尔萨斯-洛林的德国人，现已退出钢铁盟约。尽管事出突然，但这确实意味着我们不再需要为回避阿尔萨斯-洛林，这片我们失去省份的收复问题寻找外交借口。\n\n此刻，我们甚至能听见法国占领下的德意志子民向祖国哭求解放。我们将夺回曾经属于我们的土地！我们将一劳永逸地彻底摧毁法兰西国家，[GER.GetLeader]将再次羞辱法国人民及其军事企图，就像俾斯麦和希特勒曾经做的那样。"
 france.310.t:0 "法国抛弃钢铁盟约"
 france.311.a:0 "我们团结一致！"
 france.311.b:0 "不需要！盟约是最棒的！"
 france.311.d:0 "占位符"
 france.311.t:0 "旧协约"
 france.312.a:0 "莱茵河是法国的天然边界！"
 france.312.d:0 "摆脱柏林官僚体系的桎梏后，德国政府竟公然重提对阿尔萨斯-洛林地区的所谓历史主权。德意志这种盲目民族主义的行径早在我们预料之中，如今唯有以莱茵一词为报。\n\n这条大河自古以来就是文明世界与蛮荒之地的天然疆界，显然，德国人绝无自治之能力。"
 france.312.t:0 "德国声索阿尔萨斯-洛林"
 france.32.a:0 "如过去一样，又一捆稻草被放到了骆驼的背上……"
 france.32.d:0 "在弗拉芒议会近乎全体议员的愤然离场后，瓦隆议会的诸多议员实质上已对分离主义者的提议给予了默许。他们深认为无法强迫弗拉芒民族主义者继续留在一个他们内心并不认同的国家体系之中。"
 france.32.t:0 "比利时的解体"
 france.33.d:0 "关于性别平等、机会均等与多元化国务秘书预算的一场小争议，如同火星点燃了亲荷兰分离主义团体“弗拉芒利益党”代表的怒火。他们愤然离席，毅然退出了佛兰德议会。在议会外的台阶上，该党领袖汤姆·范·格里肯毫无顾忌地揭示了他们的野心——将佛兰德斯从比利时政府的版图中分裂出去。由于该党在佛兰德斯地区拥有稳固的多数席位，这一诉求迅速引发了由年轻女王卡特琳娜-阿玛莉亚领导的荷兰政府的关注，并毫不掩饰地对佛兰德斯议员表示了支持。此事影响深远，犹如“蝴蝶效应”，小小的分歧可能引发巨大的政治变革。"
 france.33.t:0 "佛兰德代表退席"
 france.34.d:0 "法国瓦隆联盟在选举中大获全胜，几乎独揽大权，并宣布比利时将废除君主制，建立一个共和国。\n\n宣布这一消息后，前比利时王室成员纷纷逃往英国，尽管他们得到承诺，在建立新政府的过程中，他们与他们的财产不会受到任何伤害。"
 france.34.t:0 "瓦隆宣布成立共和国"
 france.35.a:0 "拉塔奇主义是正确的！"
 france.35.d:0 "在经济持续萎靡与比利时君主制废除带来的民众怨声载道中，瓦隆政府以比利时政府控制力崩溃为理由向法国政府递交了合并提议。尽管德国政府起初对此提议表示反对，但最终他们选择了妥协，仅仅要求在德语为主要通用语言的欧本-马尔梅迪地区赋予当地居民法国与德国双重国籍。这一要求旨在确保在新的法国瓦隆尼亚政权统治下这些居民的需求能够得到充分满足"
 france.35.t:0 "瓦隆共和国要求合并"
 france.351.a:0 "比利时永世长存"
 france.351.d:0 "瓦隆尼亚的心脏地带，静静伫立着一座被人遗忘的教堂，它曾经熠熠生辉的墙壁，如今已被岁月的痕迹侵蚀，显得斑驳而古老。而在这座废弃已久的神圣殿堂中，一场非同凡响的仪式即将上演——伊丽莎白一世，这位备受期待的比利时王位继承人，即将正式加冕登基。阳光温柔地穿过那些破碎的彩色玻璃窗，将五彩斑斓的光影洒落在陈旧的长椅上，整个教堂内弥漫着一种庄重而神秘的期待氛围。\n\n当伊丽莎白身着华丽的王室服饰，缓缓步入这座古老教堂时，她的出现仿佛唤醒了沉睡的历史，让在场的每一位保皇派军官都感到由衷的敬畏。她以优雅而从容的姿态，登上那座临时搭建的加冕台，一顶简朴而神圣的银色王冠正静静地等待着她。\n\n在这座历史悠久的教堂里，过去的回忆与未来的憧憬交织成一幅美丽的画卷。伊丽莎白一世的加冕，不仅标志着她个人地位的提升，更象征着比利时人民抵抗外敌、坚守信仰的决心。当她缓缓抬起头，阳光透过破败的天花板洒落在她的脸上，映衬出她那坚定而明亮的眼神。她迈出的每一步，都伴随着地板的吱吱作响，仿佛在诉说着她所肩负的重大责任。比利时的保皇派残余力量终于找到了他们翘首以盼的领袖，伊丽莎白一世也欣然接受了这份重任。她以坚定的信念和毫不动摇的决心，准备引领她的国家走向一个崭新而光明的未来，一个彻底摆脱法国和荷兰统治阴影的未来。"
 france.351.t:0 "伊丽莎白一世加冕"
 france.352.a:0 "至少这事有了结果。"
 france.352.d:0 "比利时竟奇迹般地解体了。尽管我们一直密切关注布鲁塞尔的国内局势，但从未预料到比利时会分裂为两个共和国——瓦隆地和佛兰德分别加入了法国和荷兰的势力范围。\n\n这一剧变使帝国领土欧本-马尔梅迪地区的10万德国人的归属陷入了悬而未决的境地，迫使我们的政府必须做出抉择，同时还要审慎考量此地一个世纪的历史积淀。许多选择党内部人士要求将这片土地重新纳入德国版图，但这可能会损害与盟友的关系。为此，德国联邦议院召开紧急会议讨论这一问题。大多数政党，尤其是社民党，支持选择党提出的赋予当地居民德法双重国籍的计划，以此作为团结的象征。提案起草后被递交给法国，而巴黎方面给出了积极回应，表示在这个欧洲联邦化的时代，没有理由阻止欧本人民选择自己的祖国。\n\n布鲁塞尔市已成为全体欧洲人的首个共同主权领土。比利时的动荡仍在持续，随着王室权力的逐渐削弱，其统治变得越来越专制，而瓦隆地区则开始流传着共和革命的风声。英国对这一局势表示抗议，但并未采取任何行动来保护比利时政府——他们两国的关系可追溯至拿破仑时代。"
 france.352.t:0 "比利时政府解散！"
 france.36.a:0 "荷兰的悲剧"
 france.36.d:0 "报道称，今天在荷兰发生了一起可怕的悲剧：荷兰国王威廉-亚历山大·克劳斯·乔治·费迪南德遇刺身亡！在国王出席的一次大型公共场合活动中，一名持枪歹徒靠近王室成员，并向他开了几枪，击中了他的胸部。当地医护人员宣布国王当场死亡，胸部的枪伤几乎令国王即刻毙命。枪手迅速杀害国王后，在与荷兰执法人员的枪战中被击毙。根据目前掌握的信息，行凶者是来自荷兰加勒比区狂热的无政府主义者，其谋杀计划蓄谋已久。荷兰警方和情报部门已开始对行凶者的背景和案件中其他相关嫌疑人展开广泛调查。据警方目前的估计，可能还有其他无政府主义者或极端分子参与了谋杀的策划和准备工作。因其君主遇刺，荷兰政府现已计划举行为期一周的全国哀悼活动。"
 france.36.t:0 "荷兰国王遇刺！"
 france.37.a:0 "大局已定"
 france.37.d:0 "自战争结束以后，整个巴黎都变了个样。在败于俄罗斯人手下后，不仅整座城市都弥漫着一股悲伤和虚无的气息，甚至国家政府的人们也被这种情绪所感染。谁都不会想到，法国的高层居然因为失去太多和优柔寡断而陷入瘫痪。这时，其他的势力却趁火打劫，宣布为了“国家最高利益”而“采取行动”。\n\n又是巴黎的一天早晨，然而在爱丽舍宫前，一幅稀奇的景象正在发生：往常，每周议会与内阁成员开会时，你总能在这里看到官员们停在外面的豪车，现在它们都消失得无影无踪。在上午例会开始的第一个小时内，一排排的军用卡车整齐划一地向着议会大楼进发，涌上了街头和城市外围。卡车突然急停，随后立即打开了车门和货舱，一伙军官、士兵和特种部队全副武装，手持FAMAS步枪从车上冲了下来。随行人员的小队长，戴着勋章和绶带的将军们用力推开了政府的前门，士兵和军官们紧随其后。在大厅里闲聊的政客们对他们莫名其妙的突入颇感惊讶，而他们不知道，他们的死期已至。\n“这到底是怎么回事？这个奇怪的举动又是要干什么？！”一位议员惊叫道。\n“我们正在履行宪法规定的职责，先生。”一位将军严肃地说，“我们接到命令，要拘留所有对国家失职渎职的官员。”\n“你——什么？！”他震惊地脱口而出：“真是荒唐胡言！这根本就是违法的！你没有任何权力这样做！这是叛国行为！”\n“不，先生，”将军边说边掏出手枪，“犯下叛国罪的恰恰不是我们，而是你。这个国家的利益被出卖了，而我们是来恢复秩序的。跟着我的指示做，这是命令。”随后，将军向后将大手一挥，士兵们马上散开，占领了整个议会大楼建筑群。“叛徒”们现在已经被清除，新秩序在法国到来了。"
 france.37.t:0 "破釜沉舟"
 france.371.a:0 "自由得以保全"
 france.371.d:0 "经历了一场残酷的内战，法国中部的建制派力量终于击败了北方的民族主义者和南方的共产主义者，重新掌控了局势。尽管这场胜利来之不易，但代价极其惨重。我们的城市满目疮痍，社会也因此而支离破碎。如今，当我们审视战争后的废墟，清楚地意识到国家急需治愈与重建。建制派坚定承诺恢复秩序，捍卫民主价值，并将分裂的人民重新团结在一起。\n\n随着民族主义者与共产主义者的威胁被平息，重建国家的重任落在了我们肩上。我们的首要任务是恢复关键的基础设施，重建公共服务，并积极回应冲突中被激化的各种社会矛盾。我们必须发起全国性团结运动，弥合意识形态上的分裂，培养合作与进步的集体精神。然而，我们深知不安的情绪仍潜伏于社会各个角落，任何一步走错，都可能再次点燃纷争的火焰。"
 france.371.t:0 "最后的子弹"
 france.372.a:0 "平等得以保全"
 france.372.d:0 "经过与建制派和民族主义者的顽强斗争，人民的力量终于在内战中取得了胜利。我们的胜利标志着法国迎来了一个崭新的时代——在这里，平等、团结与社会正义的理想将真正生根发芽。这场残酷的冲突虽然在全国留下了伤痕，但我们将从动荡中建立一个为工人阶级服务，而非为精英阶层效力的社会。现在是时候夺回我们的国家，并确保权力真正掌握在人民的手中。\n\n随着建制派的瓦解与民族主义者的退却，我们面临着一个重要的任务——在共产主义的旗帜下，将分裂的社会重新团结起来。未来的挑战不容小觑，我们必须修复关键的基础设施，并为战争中的流离失所者提供必要的帮助。我们的首要任务是推行土地改革，国有化关键产业，并扩大社会福利计划，以帮助被边缘化的群体。我们致力于在公民之间培育合作精神，鼓励他们积极参与，亲手塑造属于自己的未来。"
 france.372.t:0 "民族，解放"
 france.373.a:0 "博爱得以保全"
 france.373.d:0 "经过一场考验我们意志的残酷内战，民族主义者最终取得了胜利，彻底击败了威胁我们伟大国家的建制派与共产主义派系。我们坚定不移地致力于恢复秩序与国家自豪感，最终战胜了混乱与动荡。随着北部地区的稳定，左翼叛乱的威胁被成功平息，我们如今站在一个重新团结的法兰西的前沿，准备重拾属于我们的命运。冲突中所付出的牺牲铸就了我们人民全新的身份认同，那是一种植根于力量、团结和爱国主义的全新精神。\n\n在我们接管政府的同时，首要任务是巩固我们的权力，并确保国家的稳定。尽管建制派与共产主义分子残余势力依然潜伏，但我们绝不会动摇。我们将唤起公民的全新使命感，培育一种能够将我们紧密联系在一起的民族精神，推动我们重建城市，复兴经济。通过果断的领导和对核心价值的坚守，我们将创建一个秩序井然、充满活力的社会，让法兰西的真正精神焕发光彩。"
 france.373.t:0 "凯撒行动"
 france.374.a:0 "欧洲将不会为和平所拯救！"
 france.374.b:0 "无知即是吾等唯一之敌！"
 france.374.c:0 "唯有欧洲团结才能铸就胜利！"
 france.374.d:0 "自从我们在欧陆战争中惨败以来，地缘政治的震荡波已撼动了国内根基。政府公信力崩溃引发欧洲团结理念深入人心，许多人坚信，正是疑欧民粹主义的分裂，使我们在俄国铁蹄下溃不成军。借助这一信念，欧洲党成功在克里斯蒂娜·兰伯特的领导下，掀起了日益高涨的示威浪潮。他们在巴黎日益壮大的示威活动动摇了政府所剩无几的合法性，直到政府在曾经依赖的世界秩序崩塌中持续瓦解，最终到达临界点。他们的抗议活动在巴黎愈演愈烈，直至政府权威彻底动摇，而世界旧秩序的崩塌，更使政局最终走向破裂。\n\n在一次演讲中，克里斯蒂娜猛烈抨击“保守派与社会党的内斗，阻碍了欧洲一体化，使俄罗斯暴君有机可乘，奴役东欧”，其言论激起了人群的狂热情绪。示威者在“将法兰西与欧洲从叛国民粹分子的掌控中解放出来”的口号下，冲击了守卫波旁宫的警戒线。在“将法国和欧洲从叛国的民粹主义者手中解放出来”的口号下，他们冲破了路障，与现场安保力量激战以夺取议会。经过数小时的激烈冲突后，部分安保人员选择倒戈，放行抗议者进入议会大厦。而克里斯蒂娜·兰伯特，就此被推举为法兰西总统。尽管有批评者指责联邦主义者的举动是“鲁莽且不民主的变相不信任投票”，但许多人将他们视为重塑法兰西荣光的最后希望——让法兰西成为欧洲统一的旗手，挺身直面俄国巨熊，解放那些新近沦陷于极权统治下的民族。"
 france.374.t:0 "欧洲党夺权"
 france.379.a:0 "我们必须坚守对法国的信念"
 france.379.d:0 "为了拯救法兰西，我们牺牲无数。我们追求稳定而废止了共和政体；我们为了和平却向政治荫蔽下的统一战线卑躬屈膝。看起来一切都如愿以偿，街上没有游行的人，变革的呼声也已经消亡。但除此以外，生活秩序尚未回归，我们收到的报告也显示，那些希望燃尽法兰西的家伙不过是暂时蛰伏于地下。还是让我们期待这些只是一时的状况吧，毕竟只有蠢货才会在国家危难之时将其推入内战深渊。如果我们甚至不再相信法国人民，那我们还拯救什么法兰西呢？"
 france.379.t:0 "虚妄的安全感"
 france.38.a:0 "上帝保佑法兰西……"
 france.38.d:0 "法国那原本如薄冰般脆弱的和平，终于在内战的第一声枪响中彻底粉碎。原本只是当局、民族主义者和共产主义者之间的紧张对峙，如今演变为公开的冲突。黎明时分，多座城市爆发了武装冲突，各派势力纷纷走上街头，试图争夺对国家未来的掌控权和话语权。混乱和不安笼罩着整个城市，民众四处奔逃寻找安全之所，受伤者的惨叫声不时刺破空气。\n\n据报道，政府军与民族主义武装在北方多地发生交火，而南方则成为共产主义团体的集结地，激烈的领土与意识形态之战在全国范围内点燃。政府疲于应对，昔日对稳定的承诺已然化为泡影。曾经充满希望的街道如今被枪声和绝望的呼喊所淹没，这场残酷的内战揭开序幕，将彻底考验整个国家的根基与命运。"
 france.38.t:0 "战斗开始"
 france.39.a:0 "意识形态的对决"
 france.39.d:0 "在法国内战的阴影下，暴风骤雨正在低地地区酝酿。混乱之中，一直以王室传统和议会制度著称的荷兰王国，正面临着前所未有的挑战：一方面是复兴的比利时王国，在他们的女王领导下，渴望重拾历史荣光；另一方面则是以卢森堡为心脏崛起的激进共产主义联盟——低地联盟。空气中弥漫着紧张的气息，各派势力都在试图重塑低地地区的身份和命运。\n\n战争的爆发令人措手不及，一场边境冲突点燃了前法国领土瓦隆尼亚和荷兰之间的火药桶。民族主义情绪席卷布鲁塞尔的大街小巷，民众纷纷响应统一与荣耀的号召，高喊着恢复大比利时的口号。与此同时，低地联盟趁机而动，呼吁全低地地区的工人阶级掀起起义，解放受压迫的群众，建立一个真正反映他们激进理想的政府。随着冲突升级，意识形态的狂热使战火越烧越烈，昔日宁静的低地小镇逐渐演变为硝烟弥漫的战场。\n\n历史恩怨与革命狂潮交织之下，平民百姓无不被这场战乱撕裂。家庭被分割，忠诚被考验，原本紧密团结的社区在战火中支离破碎。围绕着关键城市与战略要地的争夺战此起彼伏，整个低地地区陷入了无尽的动荡与不安。"
 france.39.t:0 "低地统一战争"
 france.4.a:0 "又一个右翼疯子"
 france.4.b:0 "法国人民要求变革！"
 france.4.d:0 "法国政坛迎来了许多争夺第五共和国总统宝座的竞争者，先前被轻视、不受待见的挑战者的到来更是二十一世纪政治斗争的一道风景线。在试图于即将到来的2022年大选动摇马克龙和他的复兴党政府的诸多激烈政治运动之中，仅仅认定勒庞是唯一一个右翼反对派是非常不准确的，尤其可见于近期电视名人埃里克·泽穆尔直播了他对法国现任总统领导洋洋洒洒的尖锐批评。\n\n在诸多难听的话之中，泽穆尔尤其猛烈批评了马克龙在任时颁布的一系列政策，炮轰其移民问题的解决方案，指责其对中东、北非移民的欢迎态度推动了法国“民族精神的消亡”。他宣称“法国文化、社会与其人民”受到了外国移民的存在性威胁。演讲在泽穆尔痛斥马克龙是法国人民的“叛徒”时达到了顶峰，并在社交媒体等处引起轩然大波。\n\n泽穆尔就其煽动性的口舌所知近十年，他的演说更是吸引了广泛的注意，成为了社会激烈辩论的话题。即使法国左翼与中间派自然而然地厌恶他的观点乃至于希望他闭麦下播，越来越多不满勒庞的右翼分子开始唱起了他的颂歌，希望他辞职参与竞选。即使泽穆尔仍然或多或少原理政治中心，认为状况将一直延续目前为时尚早。"
 france.4.t:0 "泽穆尔指控马克龙叛国"
 france.40.a:0 "团结就是力量"
 france.40.d:0 "当法兰西在血腥内战中分崩离析之际，阿尔萨斯地区以抵御东方潜在入侵威胁为借口，宣布脱离中央政府。正当我们厉兵秣马准备完成法兰西统一大业时，如何实现阿尔萨斯再整合的问题曾引发政府内部争议。幸而无论我们制定了何种应对反叛的预案，阿尔萨斯人已主动宣布回归祖国怀抱，终结了法兰西同胞间的裂痕。随着国内局势趋于稳定，我们终可着手按既定方略重建与革新国家。是时候让法兰西踏上复兴之路，洗刷欧陆战争带来的屈辱，重拾昔日荣光。"
 france.40.t:0 "阿尔萨斯宣布效忠"
 france.41.a:0 "拉法耶特归来"
 france.41.d:0 "在战火纷飞、满目疮痍的普罗维登斯，“拿破仑”法国志愿旅的到来让爱国者阵线欢欣鼓舞。在一个被称为“拉法耶特”的蒙面人的带领下，该旅的到来为爱国者阵线的队伍注入了新的热情。这些受到拿破仑遗产的鼓舞的志愿者被陷入困境的爱国者阵线成员誉为在世救主。\n\n当志愿军大队行进在普罗维登斯的街道上时，他们受到了当地民众的欢呼和掌声。印有拿破仑头像和“革命万岁！”字样的横幅在微风中飘扬，志愿者们受到了英雄般的欢迎。“拿破仑”旅的到来鼓舞了爱国者阵线的士气，让他们想起了他们共同的理想以及为自己的事业而战的决心，同时也回忆起了第一次大革命战争期间华盛顿及其法国盟友的崇高事业。"
 france.41.t:0 "法国志愿军抵达"
 france.410.a:0 "撤销公民身份"
 france.410.d:0 "在第二次美国内战的骚动中，一支由法国士兵和青年活动家组成的重要队伍开往了前往美国的旅途，他们心怀炽热的信念，只为支持他们在战争中的意识形态盟友。这支多样化的志愿队包括了自由主义者、共产主义者和法西斯主义者。法国志愿者们的到来，为美国战场注入了新的活力，他们的出现也突出了这场冲突的国际性。随着法国志愿者们参与到这场混战中，他们也将理想主义、决心和他们对自己所投身事业坚定不移的信念带来于此。他们的出现展现了第二次美国内战的复杂性和多面性本质，以及超国界的革命理想所拥有的持续吸引力。"
 france.410.t:0 "法国志愿军前往美国"
 france.411.a:0 "欢迎同志们！"
 france.411.d:0 "“罗伯斯庇尔”法国志愿军的到来，在被战争蹂躏的旧金山的废墟中，受到了人们的欢呼和庆祝。街道上曾充满了毁灭的声音，而现在，法国志愿军们被当作英雄欢迎，街道上也回荡着欢呼声和掌声。志愿军对共产主义事业的奉献精神和与美国盟友并肩作战的意愿，为他们赢得了当地民众的钦佩和尊重。\n\n战士们游行穿过城市时，当地人民拉起横幅和旗帜欢迎他们，旁观者从窗户和屋顶上挥手欢呼。志愿军的到来给旧金山带来了希望和团结，提醒当地居民：他们在斗争中并不孤独。志愿军的存在象征着国际团结和超越国界的持续革命精神。"
 france.411.t:0 "法国志愿军抵达"
 france.412.a:0 "自由的盟友，我们团结一致！"
 france.412.d:0 "“罗尚博”法国志愿军在华盛顿，受到了美国总统拜登的热烈欢迎，志愿军对社会自由主义和民主价值观的承诺引起了美国领导人的共鸣，美国领导人将他们的到来视为希望和团结的象征。拜登总统在政府成员的陪同下，张开双臂欢迎志愿者，感谢他们的勇敢和对自由事业的奉献。\n\n志愿军行进在华盛顿特区的街道上时，他们受到了当地民众的欢呼和掌声。写着“自由、平等、博爱”的横幅在微风中飘扬，而战士们被誉为英雄。“罗尚博”志愿军的到达给首都带来了乐观的袍泽之情，提醒了美国人双方共同的价值观和在逆境中团结一致的重要性。"
 france.412.t:0 "法国志愿军抵达"
 france.42.a:0 "这才刚刚过去两年"
 france.42.d:0 "在一次大胆的行动中，法国总统马克龙领导的政府提出了一项备受争议的养老金改革计划，旨在通过延迟退休年龄和重组福利制度来应对国家的财政挑战。尽管此项改革伴随着恢复经济与现代化的承诺而出台，却迅速引发了全国范围内的愤怒。由于改革被视为对辛勤工作换取的权利的侵犯，来自社会各阶层的民众纷纷走上街头，展开大规模抗议和骚乱，动摇了法国社会的根基。\n\n最初的示威活动是和平的，工会组织成千上万的工人、学生和退休人员在巴黎、里昂、马赛等主要城市集会。然而，随着紧张局势的升级，与警方的冲突变得愈发频繁，抗议活动逐渐演变成暴力事件。街头竖起了一道道路障，正义的呐喊也逐渐变成了革命的怒吼。面对规模和强度都远超预期的动荡局面，政府采取了强硬的应对措施，这种做法不仅进一步激化了矛盾，还引来了国内外观察者的广泛批评。"
 france.42.t:0 "大规模养老金动乱"
 france.43.a:0 "革命万岁"
 france.43.d:0 "低地统一战争的硝烟越烧越烈，冲击波震颤着整个比荷卢的脉动。在这片战火未歇的土地上，共产主义的理想逐渐吸引了越来越多的民众，点燃了工人阶级心中革命的火焰。他们被低地联盟的激进理想所吸引，各种共产主义派别从比利时、荷兰和卢森堡的阴影中浮现出来，号召失望的市民们加入他们的事业。\n\n抗议浪潮席卷各大城市，工人和学生们纷纷响应共产主义的旗帜，要求结束社会不平等，建立一个真正代表他们利益的政府。比利时和荷兰弥漫的民族主义情绪令当局忽视了迫在眉睫的社会问题，共产主义运动则趁势而起，呼吁被压迫者团结一致。罢工与示威活动愈发频繁，越来越多的民众开始看到一个统一的社会主义比荷卢地区的可能性，这个新生的国家或许能够挑战现存的秩序。"
 france.43.t:0 "比荷卢爆发革命"
 france.431.a:0 "欧洲必须得到捍卫……"
 france.431.d:0 "在不断升级的低地统一战争中，荷兰迎来了重拾其对布鲁塞尔——低地之心——正当影响力的关键时刻。随着比利时混乱分裂后建立的欧盟自由领土逐渐演变为不稳定的温床，我们不能再对此坐视不管，任由混乱肆虐。我们的政府已果断决定吞并布鲁塞尔，坚信只有荷兰的领导才能恢复秩序，并保障当地民众的安全。\n\n随着我们部队迅速进驻这座城市，我们重申我们对保护布鲁塞尔人民免受民族主义与共产主义势力威胁的承诺。我们相信，这一果敢之举不仅将为布鲁塞尔带来稳定，也将巩固我们作为低地地区领导者的地位。此次吞并被视为通向统一的必要步骤，为荷兰创建一个更为强大、更具凝聚力的未来奠定基础，从而能够从容应对内外挑战。"
 france.431.t:0 "吞并布鲁塞尔"
 france.44.a:0 "共担职责"
 france.44.d:0 "面对地中海地区日益加剧的地缘政治紧张局势，法国提议建立“泛地中海军事预算”，邀请意大利和西班牙共同合作，加强区域安全防务。该倡议旨在统一防务力量，以应对包括海盗、跨国犯罪和外部侵略等在内的各种新兴威胁，防止地区动荡。法国官员强调，采取集体军事预算的方式，不仅可以提升各国的防务能力，还能够简化军事行动，推动地中海沿岸国家之间更深层次的合作。然而，随着讨论的展开，各成员国之间展开了激烈的辩论。支持者认为，团结一致将带来显著的好处，而反对者则担忧此举可能影响国家主权，并导致军事开支的进一步上升。"
 france.44.t:0 "泛地中海军事预算提议"
 france.45.a:0 "自由派将看到……"
 france.45.b:0 "无法接受！"
 france.45.d:0 "在一场激起全国回响的挑衅性演讲中，玛丽娜·勒庞大胆宣称欧盟毫无用处，呼吁恢复国家主权，将法国利益置于官僚束缚之上。她的言论深深触动了那些因欧盟政策和日益严重的经济困境而感到被边缘化的公民的心声。随着她的主张逐渐获得支持，极右翼团体组织的集会和抗议活动规模日益壮大，成千上万的民众走上街头，共同追求她所描绘的摆脱欧盟监督束缚的法国未来。\n\n这场演讲宛如催化剂，再次激发了极右翼派别的热情，他们开始以更激进的姿态进行组织。社交媒体上，支持者们大力推广勒庞的言论，将从经济停滞到移民困境的所有问题都归咎于欧盟的无能。民调显示，勒庞政党支持率显著上升，许多对传统政治感到失望的公民开始寻找替代性方案，以期重塑国家自豪感，重新掌控法国的未来。"
 france.45.t:0 "极右翼势力抬头"
 france.451.a:0 "我很高兴，同志们。革命需要你们这些年轻血液……"
 france.451.d:0 "时光回溯到二百多年前，当波旁王朝走到其风雨飘摇的结局时，第一次法国革命的种子正是在巴黎的网球场和俱乐部之中孕育，并最终开花结果。如今，相似的场景也再度上演于巴黎的街头巷尾。只不过这一次，革命的摇篮似乎变成了一处廉租公寓的一楼洗衣房。\n\n十几把折叠椅摆成一个松散的圆形，人们随意的落座，但眼睛都紧紧盯着站在房间中心的主持人。他穿这一身卡其色衬衫，动作干脆利落。浓密的胡须中夹杂着几根银色的胡茬，其发色和眼瞳却是纯粹的乌黑，使其在年轻人的样貌之外又多了一份老成。“我很高兴，同志们基本上都到齐了。”主持人开始讲话，他从右胸口袋处掏出一本红色的小册子，封面上印刻着烫金的镰刀锤头和洛林十字架的组合图案。“我相信大家都已经看过这本册子了。它十分清楚明白地阐述了我们党的革命纲领……”\n\n“请别误会，但你们的‘革命’问题大着呢，而我就是为此而来的。”这时，一个沙哑的声音打断了主持人的开场白。全场目光都集中到了一位戴着鸭舌帽的老人身上。他圆睁怒目上方的浓密白眉和额骨处的疤痕显示出了他跌宕起伏的人生。“你们鼓吹与教权合作、专制政府、言论管制、全面监视，甚至还有军事独裁！这可不是我知道的革命！”其激烈言辞似乎能使人看见1968年时年轻的他领导着街头巷尾的学生同志们高喊反戴高乐的口号，同时把毛泽东的画像贴在市政厅的大门上。\n\n一阵不礼貌的口哨声打破了尴尬的沉默，一位穿着白色T恤，手插在口袋里的长发男孩讥讽道，“老”头儿，也许是你的革命过时了！你当年的同志们现在有好几个都是在台上把国家搞得一团糟的罪魁祸首呢！我们可不想要他们来教育我们革命该怎么搞。”\n\n之后侃侃而谈的是一名年轻的金发女子，她系着一条十字架项链，“只有增强战备，建立无产阶级军队，我们才可以抗衡俄国的独裁政权！不光是军队，如果没有信仰，谁能来统一国家？只会跟现在一样……！”\n\n年轻人们七嘴八舌地反驳着老者的观点，直到后者忍无可忍，怒气冲冲的摔门而去。在此过程中，主持人只是静静地看着，视线一刻也没有离开。等到老者两脚踏出洗衣房，大门在他身后即将关闭时，主持人用所有人都能听清的音量开口道："
 france.451.t:0 "青少年涌入雅各宾派"
 france.46.a:0 "左派，崛起！"
 france.46.b:0 "占位符"
 france.46.d:0 "面对玛丽娜·勒庞影响下极右翼势力的迅速崛起，一支由左翼、温和派和进步派政党组成的新人民阵线应运而生。这一联盟致力于将各类政治派系联合起来，共同抵御民族主义和排外主义的浪潮，这股浪潮正在威胁法国的民主价值观及社会结构。来自政治光谱各方的领导人纷纷呼吁团结一致，捍卫公民权利、社会正义及法国在欧盟中的地位。\n\n新人民阵线迅速赢得了社会各界的广泛支持，组织了一系列集会与活动，反击那些已经吸引了大量失望民众的极右翼言论。他们倡导促进包容性、经济平等的政策，并提出一项改革的、合作的欧盟新模式，既优先考虑法国人民的利益，又不舍弃欧盟成员国所能享受的优势。随着这一信息打动了更广泛的受众，公众对该联盟的支持迅速上升，给勒庞及其盟友带来了巨大的挑战。"
 france.46.t:0 "新人民阵线成立"
 france.47.a:0 "让-吕克·梅朗雄！"
 france.47.b:0 "奥利维耶·富尔！"
 france.47.c:0 "妥协怎么样？弗朗索瓦·吕芬！"
 france.47.d:0 "新人民阵线正在为即将到来的选举做准备，党内领袖们齐聚一堂，挑选出能够挑战极右翼势力、团结进步运动的候选人。会场气氛充满了紧张与期待，三位杰出人物脱颖而出，成为热门候选人：让-吕克·梅朗雄、奥利维耶·富尔与折衷派候选人弗朗索瓦·吕芬。\n\n让-吕克·梅朗雄是“不屈法国”的领袖，资深政客，以激昂的言辞和激进的左翼政策著称。他的竞选纲领包括财富再分配、环境可持续发展以及坚决反对紧缩政策的立场。梅朗雄以改造法国的宏伟愿景吸引了党内基础的广泛支持，但他极具争议性的风格也在联盟内部招致了不少批评。\n\n奥利维耶·富尔是社会党领袖，他主张采取更加温和务实的策略，以应对法国当前面临的挑战。他倡导社会正义改革、通过投资促进经济增长，并重申对欧洲合作的承诺。富尔试图在联盟内弥合分歧，向选民展现一个团结的形象。\n\n弗朗索瓦·吕芬则作为折衷派候选人崭露头角，获得了激进左派和中间派的共同支持。作为一名记者和纪录片导演，吕芬以其草根运动和与普通民众的亲密联系而闻名。他关注工人权益、公共服务和环境问题，并以新颖的视角赢得了广泛的共鸣。"
 france.47.t:0 "新人民阵线选择一位候选人"
 france.48.a:0 "出人意料"
 france.48.d:0 "随着极右翼情绪的不断高涨，法国政治格局发生剧烈变化，新人民阵线在此背景下迎来了前所未有的支持浪潮。在一系列成功的集会、颇具影响力的社交媒体宣传以及充满包容性的统一信息的推动下，这一联盟迅速吸引了法国各地对现状不满的选民。他们对社会正义、包容性和民主价值观的坚定承诺，与极右翼充满分裂性的言辞形成鲜明对比。\n\n这一阵营的新动力也得益于他们出色的沟通策略，不仅展现了候选人与基层民众的紧密联系，更突显了他们对建立一个更加公平社会的共同愿景。民调显示，新人民阵线的支持率显著上升，越来越多的公民积极参与他们的活动，热衷于讨论诸如经济不平等、气候变化和移民改革等迫切问题。新人民阵线成功地将自己定位为“人民的声音”，主张以民众福祉为核心的政策，而非维护精英利益。"
 france.48.t:0 "新人民阵线得到广泛支持！"
 france.49.a:0 "我们得大胆一点！"
 france.49.b:0 "稳定更重要"
 france.49.d:0 "法兰西人民决定共和国未来的时刻已经到来。经过多年的政治纷争和社会不满，政府提出了一项全民公决，以建立第六共和国。公民们在两种愿景之间左右为难：一种是温和的宪法，加强民主制度并通过渐进式改革维持稳定；另一种是激进的宪法，通过大胆的措施和增强的直接民主来改变政治格局。\n\n温和方案的支持者认为，它提供了一种平衡的方法，承诺在解决经济不平等的同时维护现有权利，并促进跨越政治派别的合作。相比之下，激进宪法的倡导者断言，只有彻底的变革才能有效解决困扰国家的根深蒂固的问题，尽管这可能存在潜在的动荡风险。\n\n国家屏息以待，这次全民公决的结果将塑造法国的未来——公民们会选择稳定，还是拥抱一个大胆的新方向？"
 france.49.t:0 "共和国宪法公投"
 france.5.a:0 "小道消息不足为信"
 france.5.d:0 "法国军队历史悠久而光荣。无论是伟大的解放者戴高乐还是光辉的征服者拿破仑，许多法国领导人出身自军队体系，而军队自然被视作法国国家的基石，在军队内部尤其如此。即使少量有关历史遗留问题延续至今，多数人都认为军队的影响力已经成为了过去时，现今他们的权力已经被民选政府和民主程序严加看管。\n\n至少直到今天以前。在庆祝法国军队在阿尔及利亚失败的政变六十周年之际，一则正在计划的“政变”的消息迅速蔓延全法。据报道称，该则消息来自于军队方面的泄露。一封被十余名将领签名的信件——退役的或是现任的——被上传至互联网。信件本身做出了数点反对现任政府的声明，从批评政府在国际局势不稳的情况下对武装力量必要资金和充足措施的缺失，到模糊的要求“律法与秩序”的治理和“保护法国不受致命威胁”的重要性等模糊的政治立场。\n\n即使一封言辞尖锐的信件几乎不能成为针对民选政府政变的确实证据，传言仍然没有进一步证据支持的情况下在政府与公众中掀起轩然大波。作为回应，签名者受到了公共官员和那些没有签名的军事长官的严厉批评，提醒他们军方不插手政治的传统以及维持分权的重要性。至少现在，军方这些针对政府的行动仍然还只是传闻。"
 france.5.t:0 "军中流言"
 france.50.a:0 "派遣志愿军"
 france.50.b:0 "这不是我们该插手的"
 france.50.d:0 "随着阿尔及利亚局势日益紧张，该国已陷入内战，政府与各路叛军展开激战。这场冲突有可能破坏该地区的稳定，并可能导致法国本土骚乱死灰复燃。问题出现了：法国应该派遣志愿军支持新的共和政府进行干预，还是应该保持中立，避免进一步卷入阿尔及利亚的事务？"
 france.50.t:0 "阿尔及利亚危机"
 france.52.a:0 "我们永远欠您的恩情"
 france.52.b:0 "我们不会与殖民者交往"
 france.52.d:0 "鉴于阿尔及利亚持续不断的内战，法国表示愿意支持其争取自由的斗争。法国政府认识到双方在民主和社会进步方面的共同价值观，准备派遣志愿部队协助阿尔及利亚政府。\n\n然而，这一提议将在阿尔及利亚引起褒贬不一的反应。一些人认为这种援助是迈向稳定的必要步骤，而另一些人则对外国干预持谨慎态度，回想起阿尔及利亚的殖民历史。政府的决定将对国家主权和公众情绪产生深远的影响。"
 france.52.t:0 "法国送出志愿军"
 france.53.a:0 "他们否定了我们的命运！"
 france.53.b:0 "我们不能公然入侵！"
 france.53.d:0 "在阿尔及利亚强硬拒绝法国志愿部队后，氛围发生了戏剧性的转变。右翼势力和军事领导人越来越公开地表达他们对政府处理危机的策略的不满。他们认为阿尔及利亚局势直接威胁到法国的利益和地区稳定。\n\n在民族主义团体组织的一次集会上，演讲者慷慨激昂地主张在阿尔及利亚建立法国保护国。他们的言论引起了部分公众的共鸣，引发了关于国家认同、殖民遗产以及法国对其前殖民地的责任的广泛争论。\n\n随着压力的增加，政府必须决定如何回应这些干预呼吁。军事行动的前景隐约可见，而这一决定的影响可能会在未来几年重塑法国的外交政策和国内格局。"
 france.53.t:0 "干涉阿尔及利亚？"
 france.531.a:0 "尘埃落定"
 france.531.d:0 ""
 france.531.t:0 "划定边界"
 france.54.a:0 "支持共和国"
 france.54.b:0 "支援沙特王室"
 france.54.d:0 "根植于保守价值观并与西方国家关系密切的沙特当权派呼吁法国提供支持。他们辩称，支持君主制对于维护该地区的经济利益，特别是石油部门的利益，以及对抗威胁沙特阿拉伯和更广泛的中东稳定的极端主义派别至关重要。\n\n另一方面，阿拉伯共和国则拥护进步的改革，倡导民主治理和社会变革。他们寻求将沙特阿拉伯重塑为一个更具包容性和现代性的国家，这与法国的自由和平等意识形态价值观产生共鸣。然而，他们的崛起可能会引发保守势力的强烈反对，并进一步破坏该地区的稳定。\n\n法国必须决定是与支持君主制的务实选择保持一致，还是与支持共和国的意识形态立场保持一致。"
 france.54.t:0 "支持沙特继承人"
 france.55.a:0 "加入条约"
 france.55.b:0 "拒绝协定"
 france.55.d:0 "由于对手国家海军活动的增加，地中海地区紧张局势不断升级。对此，法国、意大利和西班牙三国已启动旨在加强海上安全的磋商。三国认识到需要采取统一的方法来保护各自的利益，因此组建了地中海海军联盟条约。\n\n该条约旨在实现海军行动的标准化，加强联合训练演习，并共享资源以增强三国集体海上能力。三国领导人认为，协调一致的海军战略不仅可以改善该地区的安全性，还可以促进三国之间更紧密的联系。"
 france.55.t:0 "地中海统一海军条约"
 france.56.a:0 "烧毁收据……"
 france.56.b:0 "极端主义必须被肃清"
 france.56.d:0 "这一批运往尼日利亚的武器未被伊斯兰部队发现，并且已被尼日利亚军方接受。"
 france.56.t:0 "法国军队抵达尼日利亚"
 france.57.a:0 "用异教徒的弹药对付他们！"
 france.57.b:0 "因为我们情报导致的失败"
 france.57.d:0 "一名法国卧底特工在得到误导性信息后被杀，他得到的信息被用来寻找并获得一批法国枪支和喷气式战斗机。"
 france.57.t:0 "法国武器货物被伊斯兰叛乱分子劫持"
 france.58.a:0 "他们将会付出代价！"
 france.58.b:0 "还需要时间来引蛇出洞……"
 france.58.d:0 "少数法国绿色贝雷帽成员已经锁定了多名伊斯兰宣传者和招募者。"
 france.58.t:0 "伊斯兰宣传人员被法国部队抓获"
 france.59.a:0 "胜利的一天！"
 france.59.b:0 "否认、否认、再否认……"
 france.59.d:0 "在一次暗杀重要人物的行动失败后，几名退役的法国绿色贝雷帽成员被抓获。"
 france.59.t:0 "伊斯兰武装抓获并处决了一批法国雇佣兵"
 france.6.a:0 "勒庞承诺选举后让步"
 france.6.b:0 "勒庞拒绝让步"
 france.6.c:0 "马克龙同意让步"
 france.6.d:0 "今天一大早，写满要求的清单被蒙面的法国士兵钉在了巴黎每个政府部门的大门口。军方提出了诸如重启征兵，退出北约综合防空与导弹防御系统，并打击拒绝这些妥协的政客等要求。他们保证军方不会对马克龙总统、勒庞或是任何一名政客做出伤害行为。法国最高指挥部已经承认了这份清单的真实性，且有报道称许多法国士兵已经开始于巴黎及周边险要地带进行军事演习。\n\n马克龙总统在被告知这些要求后离开了巴黎，而勒庞在一次即兴的军事慰问中也被告知了这些要求。"
 france.6.e:0 "马克龙承诺选举后让步"
 france.6.f:0 "马克龙拒绝让步"
 france.6.g:0 "马克龙拒绝让步……但泽穆尔同意！"
 france.6.t:0 "法国军官要求让步"
 france.60.a:0 "弱者的尸骸只配成为滋养强者的养分"
 france.60.b:0 "先生们……欢呼吧"
 france.60.d:0 "在突袭了阿布贾的一户人家之后，尼日利亚军队表示他们俘虏了尼日利亚伊斯兰国领导人阿德南·阿布·瓦利德·萨赫拉维，造成重大伤亡。"
 france.60.t:0 "阿德南·萨赫拉维被尼日利亚军队在一场突袭中杀死"
 france.61.a:0 "必要的牺牲"
 france.61.b:0 "法国的干涉微不足道"
 france.61.d:0 "阿德南·阿布·瓦利德·萨赫拉维在使用多个大型爆炸装置炸毁了阿布贾的一整条街道后死亡，爆炸发生前日曾传言尼日利亚和法国军队将尝试强行突入该建筑群。"
 france.61.t:0 "伊斯兰国领导人被包围，46名平民丧生"
 france.62.a:0 "更多的士兵！"
 france.62.b:0 "非洲就不能安分点吗？"
 france.62.d:0 "从撒哈拉地区令人不安的消息：许多伊斯兰国相关的恐怖组织宣布合作以对抗外国干涉。在当地伊斯兰国相关组织的领导下，伊斯兰恐怖小组相比之前独立行动时变得更加协调。在这些变化之前，伊斯兰国就已经在该地区巩固其影响力，并重新对当地政府和北约联军发动叛乱。北约情报部门已经就伊斯兰国和其在西非的联合组织发出多次警告。分析家指出，伊斯兰国组织下的协调能力会给北约在此地区的反恐行动带来更多麻烦。"
 france.62.t:0 "伊斯兰恐怖组织加强合作"
 france.63.a:0 "他的牺牲不会白费"
 france.63.b:0 "他们简直毫无底线…"
 france.63.d:0 "今日一则恐怖的消息从非洲传来：西非伊斯兰国领袖阿布·穆萨布·巴那维宣称将会为他的副手，阿德南·瓦利德·萨赫拉维的死报复法国。多年来，法国一直致力于打击西非以伊斯兰国为首的恐怖主义。近年来，博科圣地等与伊斯兰国相关的组织引发了许多国内冲突和暴力事件。法国和其北约盟国企图击垮伊斯兰国的行动引发了移居欧洲的极端主义者的威胁。法国情报部门表示国内外的法国公民应当加倍小心恐怖行动。目前还不清楚巴那维的威胁是否会使他的追随者采取实际行动。"
 france.63.t:0 "西非伊斯兰国领袖宣称为屠杀复仇！"
 france.64.a:0 "天哪！"
 france.64.d:0 "一则从巴黎传来的消息震惊了全球，举世闻名的巴黎圣母院居然遭到了恐怖袭击！正当巴黎大都会区的人都还在在社交媒体和新闻媒体上讨论着早上的那突如其来而响亮的爆炸声时，不到一个小时之后，市民们便发现那爆炸的声音竟是巴黎圣母院。巴黎圣母院被炸毁，其主体部分大都被夷为平地，只有侧面和后面的墙还在。法国警方迅速封锁了圣母院周围的区域，并发现本次袭击来自于一辆大型汽车炸弹。西非ISIS分支组织的恐怖分子已宣布对此次袭击负责，并宣称是为他们的指挥官阿德南·阿布·瓦利德·萨哈拉维的死报仇。法国总统宣布了紧急状态，调动所有可用的执法部门和国民警卫队，确保巴黎和其他主要城市的安全。北约和法国情报及执法部门已展开大规模调职，并阻止进一步的恐怖行动，抓捕与袭击有关的人。整个法国都陷入了震惊和哀悼当中，这次袭击的规模和破坏力仅次于美国的9/11。法国民众和政治家都对执法和情报机构未能阻止袭击表达了强烈的愤怒与失望。这一天无疑将成为法国国家记忆中永远无法抹去的悲惨一天"
 france.64.t:0 "恐怖分子炸毁巴黎圣母院！"
 france.642.a:0 "我们抓到他了"
 france.642.d:0 "过一场牵动全国的彻底搜捕，法国执法部门成功逮捕了对巴黎圣母院毁灭性爆炸事件嫌疑人拉希德·萨德尔。在北约和当地情报机构的大量线索和广泛合作下，萨德尔被追踪到巴黎郊区的一处安全屋，并在那里被拘留。\n\n此次逮捕正值全国各地加强安全措施之际，公民们仍在努力应对袭击的后果。法国总统赞扬了执法部门的努力，强调了在面对恐怖主义时保持警惕的重要性。随着调查的继续，官员们正在努力发现任何可能的同谋和进一步的阴谋。"
 france.642.t:0 "巴黎圣母院爆破犯被捕"
 france.643.a:0 "该死！"
 france.643.d:0 "突发事件！臭名昭著的巴黎圣母院爆炸案主犯拉希德·萨德尔据称出现在土耳其南部。\n\n据目击者称，他们看到萨德尔登上了一辆开往叙利亚边境的车辆，这让人们担心他可能逃脱法律制裁，潜入冲突频发的地区。\n\n这一消息震惊了法国，法国民众原本希望能够迅速破获这起恐怖袭击案件。当局现在面临着萨德尔可能逃脱抓捕的严峻现实，他有可能在中东地区与极端分子重新集结。法国政府正在与土耳其和国际情报机构合作，努力在他彻底消失之前找到并逮捕他。"
 france.643.t:0 "巴黎圣母院爆破犯出现在土耳其南部"
 france.644.a:0 "嗯，巴沙尔，谢啦……"
 france.644.d:0 "叙利亚政府在一项令人震惊的声明中证实，臭名昭著的炸弹袭击者拉希德·萨德尔，巴黎圣母院袭击案的罪魁祸首，已被巴沙尔·阿萨德总统下令处决。叙利亚官员称，萨德尔在越境后不久被捕，情报报告显示他对地区稳定构成重大威胁。\n\n处决消息在法国引发了轩然大波。许多民众表达了既感到宽慰又感到愤怒的复杂情绪，他们认为正义得到了伸张，但同时也因为无法亲手将萨德尔绳之以法而感到沮丧。政界领导人对此看法不一；一些人称赞这是打击恐怖主义的胜利，而另一些人则批评叙利亚政府的做法，并质疑其声明的可靠性。"
 france.644.t:0 "叙利亚政府确认巴黎圣母院爆破犯已死亡"
 france.65.a:0 "发送提案"
 france.65.d:0 "鉴于能源需求不断攀升以及近期供应中断，法国政府已启动与委内瑞拉的谈判，以确保稳定的石油供应。委内瑞拉拥有丰富的自然资源，但在国际制裁和经济动荡的压力下举步维艰，因此将此视为提振经济并重返全球市场的良机。\n\n法国官员的目标是谈判达成有利的条款，不仅能够保障能源安全，还能支持委内瑞拉的复苏。然而，谈判充满了复杂性。法国国内的政治派别对于与一个因侵犯人权而遭受国际批评的政权合作持有不同观点。"
 france.65.t:0 "与委内瑞拉的石油谈判"
 france.66.a:0 "接受提议，委内瑞拉亟需此经济援助以维系生存。"
 france.66.b:0 "委内瑞拉将保持独立！"
 france.66.d:0 "在委内瑞拉经济因国际制裁而深陷困境之时，法国提出了一项提议。他们表示愿意部分解除对委内瑞拉的石油禁运，以此换取对该国珍贵资源，如重要矿产和农产品的独家购买权。若接受此提议，委内瑞拉摇摇欲坠的经济或将得到急需的提振，重启对欧洲的石油出口，为饱受物资匮乏之苦的人民带来片刻喘息。然而，这需要以让渡部分国家重要资源的控制权给外国势力为代价——一些人视此为放弃主权之举。\n\n面对内部异议的压力和国际孤立的现状，政府面临着艰难抉择：是接受法国提议，为经济注入一线生机为妙？还是拒绝提议，坚持对国家资源的控制，寄希望于未来能获得更优厚的交易或禁运的解除为好？"
 france.66.t:0 "与法国的石油谈判"
 france.67.a:0 "庆祝时间"
 france.67.d:0 "法国在外交方面取得了重大胜利，委内瑞拉政府已正式接受了修订后的石油提案，这标志着两国合作新时代的到来。新条款既尊重委内瑞拉的主权，又保障了法国的石油供应稳定，两国政府都对这项互利共赢的安排表示欢迎。"
 france.67.t:0 "委内瑞拉同意了"
 france.68.a:0 "日"
 france.68.d:0 "委内瑞拉政府出人意料地正式拒绝了法国提出的石油交易方案，理由是条款不利且担心会影响国家主权。委内瑞拉官员表示，该协议没有充分满足其经济需求，并且强加了一些可能损害其自治权的条件。"
 france.68.t:0 "委内瑞拉拒绝了"
 france.69.a:0 "为了我们的未来！"
 france.69.d:0 "号角回荡，凯旋之音震撼天地——自法兰西重归一统以来，今日乃是最高军事统帅部首次向国民发声。而比起胜利的号角，更令人动容的，是全国人民的山呼海啸，是法兰西用最炽热的掌声迎接新政权的诞生。自最后一座叛徒的堡垒被攻克，巴黎街头便不曾沉寂，我们的军队昂首挺胸，巡游于这座荣耀之都，向世人昭示着胜利的归属。然而，今日不仅是庆典之日，亦是警惕之时——我们的西班牙兄弟仍深陷战火，而我们的日耳曼邻国正经历混乱的政权更迭，其未来仍未明朗。今夜，我们举杯共庆，为谋略之妙计，为胜利之荣耀，亦为未来之征途。前方或有风暴，但我们无畏，因为法兰西必将迎战一切挑战！"
 france.69.t:0 "法国将领保卫政府"
 france.6969.a:0 " - 埃马纽埃尔·马克龙"
 france.6969.d:0 "“朕即国家。”这句话本属一位君王，但如今，它同样适用于我的共和国。毕竟，权力的意义何在？若非由一人掌控，并以之铸就伟业，又有何价值？若权力被肢解，被困于琐碎之中，被迫干涉毫无意义的细节，那么它本身便失去了存在的价值。\n\n看看朱庇特，看看那颗星辰，亦看看那位神祇。他是否介入每一个凡人的琐碎生活，确保每一个细节尽善尽美？不，他只在关键时刻亲自出手，掌控全局，决断命运。朱庇特不会俯身拾起一块鹅卵石，将其抛入湖中，他是跨越千载的永恒之力，左右历史的天命之手。\n\n那么，一个真正追求伟业之人，为何要将时间浪费在日常琐事之中？伟业需要伟大的行动，而非伟大的妥协，亦非卑微的合议。变革若非由一人之手推进，便注定落入妥协的泥沼，在权衡取舍之中充满缺陷，变得支离破碎，只为迎合他人而扭曲。我为何要屈服于此？我为何要在一个宏伟构想的漫长岁月里，为每个微不足道的缺陷而玷污我的双手？"
 france.6969.t:0 "马克龙的朱庇特之梦"
 france.6970.a:0 "绝不重演……"
 france.6970.d:0 "法国已被勒庞之流的腐败民族主义者和梅朗雄这类寄生民粹主义者引入歧途、遭其背叛。他们的党争与无能只会让共和国走向败亡——既蒙受战败之耻，又遭经济崩盘之痛。犹如硬币的两面，他们对权力与控制欲的贪婪，使其忽视了唯有欧洲团结方能抵御风暴的现实。他们逼迫我们不得不出手，新欧洲必将从旧欧洲的灰烬中重生。为使法国存续，我们必须抛弃旧秩序，拥抱我们在欧洲的位置——一个团结自由的欧洲，一个民主的欧洲，一个强大的欧洲。这样的欧洲，将永不再承受战场与市场的双重失败。"
 france.6970.t:0 "本该如此"
 france.7.a:0 "泽穆尔以3%的选票优势夺得大选胜利"
 france.7.d:0 "如同全球众多民主国家的选举一样，法国选举错综复杂，但核心在于竞争。候选人或政党需争夺国家内部的权力宝座。民主在演讲和教科书中被描绘得美好无比，但在实际竞争中，往往需要采取一些策略来确保优势。埃里克·泽穆尔深谙此道，并已运用其政治工具箱中的所有手段来推动这一切，即便这意味着需要在幕后进行一些“协调”。\n在巴黎的办公室里，泽穆尔来回踱步，思绪万千。这次选举让他兴奋至极，其期待感可谓是前所未有。法国民众都知道这将是一场激烈的较量，所有对手政客都会倾尽人脉和信誉来阻止他。然而，泽穆尔拥有一些普通选民和对手所不知的信息。他确信自己做得一切恰到好处，找对了支持者，采取了正确的行动，说出了恰当的话语。一切都将按计划顺利进行。人们无从知晓他为了这一切付出了多少心血。\n\n他派遣亲信前往无数投票站，确保投票机“正常”运作。他还请法国武装部队的朋友“确认”选举正在按预期进行。他无数次地走近选民，告诉人们他们想听的话，不管其他体制内政客多次指责他为“民粹主义者”。他已经竭尽全力，现在是检验成果的时候了。\n此刻，泽穆尔坐在办公室的平板电视前，转到第一个主要新闻频道查看选举结果。他的时刻终于来临了。泽穆尔在快速浏览频道的滚动新闻和记者报道时几乎欢呼雀跃；他苦心孤诣所付出的一切，如今均已开花结果。屏幕上闪现的文字更让他感到久违的满足……"
 france.7.t:0 "一场“自由”且“公正”的选举"
 france.70.a:0 "共和主义回归"
 france.70.d:0 "在经历了第一次欧陆战争的恐怖震撼之后，法国政权逐渐滑向民族主义乃至极端民族主义的深渊，民主之风被认为将永远逝去，再也无法吹拂法兰西的国土。然而，正当人民仍一无所知之时，国防政府内部的隐秘体制已开始悄然进行改革。\n\n最初只是大元帅权力的去中心化，不久之后，德维利耶的头脑中重返民主体制的计划便开始逐渐成型。虽然左派已永远无法再给法国带来灾祸，但只有践行民主，法国才能真正成为法国。\n\n正如二战后的戴高乐一样，法国的强人再次放弃了权力，拒绝成为独裁者，与黑暗之路背道而驰。取而代之的将是曾因第五共和国的内部运作而被排挤的三个政党，如今人气大致相当的它们将参与竞逐权力宝座和下届总统职位的游戏。"
 france.70.t:0 "德维利耶宣布举行自由选举"
 france.7000.a:0 "革命要求严明纪律"
 france.7000.d:0 "无政府主义者被集体处决，朱利安·库帕特被公开处决。卡萨诺瓦将军很满意。"
 france.7000.t:0 "无政府主义者的垮台"
 france.7001.a:0 "狗娘养的！"
 france.7001.d:0 "阿尔托和达南克斯因为不喜欢我们刚刚推翻政府，就自己去搞了小团体。是不是很疯狂？"
 france.7001.t:0 "左右翼反对派形成！"
 france.7002.a:0 "形势紧迫仍需力量与安全"
 france.7002.b:0 "没有民选政府，我们怎能声称代表人民？"
 france.7002.d:0 "夜色深沉，爱丽舍宫办公室内，卡萨诺瓦将军正全神贯注地思索法兰西的未来。他已通过铁腕掌控全国，各省总督与指挥官尽皆臣服，但如何将这种权力制度化仍是当务之急。\n\n将军转头望向办公室侧墙的书架，那里摆放着拿破仑青铜像复制品。征服者的身影在月光下泛着冷光，冷白的月光勾勒出帝王轮廓。卡萨诺瓦仿佛看见自己身着挂满勋章的军礼服，在阅兵场接受万众敬礼。当年第一执政官正是以武力重建共和体制，使法国重获强盛。身为学生的他，又怎能不效法这般典范？\n\n困意袭来，将军摇铃要了杯咖啡提神。等候勤务兵送饮品的间隙，他从办公桌抽屉取出斯大林文集消磨时光。这位格鲁吉亚出生的总书记确实是经世之才，他巩固并重构了列宁的遗产，使首个共产主义政权得以高效运转。自诩新时代革命导师的卡萨诺瓦，又怎能不心生艳羡？\n\n将军抿了口滚烫的黑咖啡，指尖计算着下一步计划。片刻后，他提起笔，在文件末尾签下了当天最后一道命令。"
 france.7002.t:0 "军管问题"
 france.7004.a:0 "只有破坏分子"
 france.7004.d:0 "法共开始内部清洗"
 france.7004.t:0 "审判达南克斯集团"
 france.7005.a:0 "第一次是悲剧，第二次是闹剧"
 france.7005.d:0 "托派分子全部死亡"
 france.7005.t:0 "审判阿尔托集团"
 france.7006.a:0 "让我们以苏联为榜样！"
 france.7006.b:0 "自第一次革命以来，联邦制就不再重要了，忘掉它吧"
 france.7006.d:0 "法国不存在联邦制，卡萨诺瓦却想搞苏维埃式独裁"
 france.7006.t:0 "联邦制问题"
 france.7007.a:0 "团结就是力量！"
 france.7007.d:0 "我们伟大的法国同志秉持国际共产主义团结精神，为支援我国工业重建提供了慷慨援助。由于近期在抗击东方法西斯威胁的军事失利，以及推翻前资本主义统治阶级的革命斗争，我国本土工业已陷入瘫痪。\n\n幸运的是，法国同志响应了援助呼声，通过修复工厂和工业区提供经济支持，既为我国民众创造就业岗位，更助力国民经济重启。我们将与法国同志携手重建家园，迈向更广泛的阶级团结，共同反抗资本主义和帝国主义！"
 france.7007.t:0 "法国经济援助！"
 france.71.a:0 "重返共和国"
 france.71.d:0 "“在我们新政府的队伍中，有成百上千的人在拯救法国的道路上比我走得更远。虽然我们都怀有相似的理想，都希望法国的传统和文化得以回归，但我必须谴责他们，以及他们那狂热的独裁思想与民族主义。”\n\n德维利耶在演讲时，双手紧握讲台。这在新政府中是一次罕见的公开意图展示，尤其是对他这位大元帅而言。也许这是改革的征兆，是即将到来的变革之风的信号。\n\n“这些人，他们不是……法国的爱国者。他们只是一些追求自身权力的人，公然违背我们作为一个民族，一个国家所代表的一切。虽然我们相信这一传统，相信这一制度，但他们对权力的贪婪和对法国国家犯下的腐败罪行在他们的每一个字句和行为中都清晰可见。”\n\n他稍作停顿，带着自豪的神情看着人群。在旧法国，那片分崩离析、毁灭历史遗产的土地上，这样的场景是不可能发生的。\n\n“国防政府不是这些人用来剥夺我们自由、当作私人领地的工具。它是一种解决旧问题、让法国重生的状态。极端个人主义在这里没有立足之地。”"
 france.71.t:0 "德维利耶谴责激进贝当派"
 france.72.a:0 "恭喜马杜上将"
 france.72.d:0 ""
 france.72.t:0 "最高指挥部投票撤换[FAF.GetLeader]将军"
 france.73.a:0 "恭喜博赛上将"
 france.73.d:0 ""
 france.73.t:0 "最高指挥部投票撤换[FAF.GetLeader]将军"
 france.74.a:0 "恭喜谢奈上将"
 france.74.d:0 ""
 france.74.t:0 "最高指挥部投票撤换[FAF.GetLeader]将军"
 france.75.a:0 "致敬！"
 france.75.d:0 "法国军队中那些心怀不满的愤怒情绪已达到顶点，已成海内鼎沸之势。政府虽竭尽全力，但国家与军队已不可挽回地走向了分道扬镳，最终，是军队赢得了胜利。\n\n这场行动主要由欧陆战争中的青年军官们所领导，他们大多倾向右翼，对既有体制不大熟悉，也不愿听命于官僚机构，那些目睹家人朋友死于俄国人之手的将士们发动了一场针对国防政府的政变，并在众怒之下发表声明称，一切都事为了法国稳定和人民的利益。"
 france.75.t:0 "青年军官发动政变"
 france.76.a:0 "回归传统？"
 france.76.d:0 "在我们的国家完成统一后不久，媒体、名流、政客以及众多社会知名人士纷纷表态支持新政权。然而，在众多人物之中，有一位尤为引人注目——路易·阿方斯·德·波旁。虽未获封任何官方职位，德·波旁却在法兰西的社交圈中游刃有余，以其血统与睿智，在名流之间编织出一张精密的网络。而今，复兴传统的浪潮席卷全国，他顺势而为，与法国的权贵阶层深度结盟——其中不乏实力雄厚的商业巨擘，亦有昔日波旁王朝下的贵胄世家。而今，法军似乎也已向这位王室后裔伸出了橄榄枝——日前，弗朗索瓦·勒库安特被目击现身波旁府邸，这一动向无疑进一步巩固了德·波旁的王位潜在合法性，使他成为可能引领法兰西未来的统治者。"
 france.76.t:0 "勒库安特上将拜访路易·阿方斯·德·波旁"
 france.77.a:0 "国王的底牌"
 france.77.d:0 "路易·阿方斯·德·波旁竟在法兰西政坛完成了不可思议之举，他赢得了国防委员会多数成员对其王室血统执掌法国领导权的支持。更令人瞩目的是，随着时间推移，巴黎等大城市的街头几乎每隔数日便涌现保皇派集会游行，昭示着法国民众对君主制回归的深切渴望。为法兰西的安全与稳定计，这个国家亟需一位强有力的统治者，而德·波旁无疑是最佳人选。除德·波旁外还有谁！"
 france.77.t:0 "勒库安特将全部控制权交给路易·阿方斯·德·波旁"
 france.78.a:0 "一场配得上国王的仪式！"
 france.78.d:0 "自知晓姓氏承载的千年荣光起，路易·阿方斯·德·波旁便夙夜期盼这一日的到来。他自幼便知天命所归，必将如先祖般登上王座，统治法兰西数百年基业。德·波旁潜心研习波旁王朝的教训，立誓既要拯救危机中的法兰西，更要匡正先辈的过失。此刻钟声响彻巴黎圣母院，随着德·波旁的加冕大典启幕，法兰西历史的新纪元就此展开。"
 france.78.t:0 "路易二十的加冕礼"
 france.79.a:0 "我们必须要有……钱"
 france.79.d:0 "法国最近宣布开始抛售新一波的低息十年期国债以稳定经济。这代表政府正打算长期投资各种基础设施和社会项目。政府希望借发售低息国债获得的高利润借贷来支撑巨额开销。然而一些批评家指出了长期积累的债务风险并担心其将会对未来产生影响。尽管存在这些担忧，发行十年期国债代表了政府在资助其发展重点同时应对全球经济动态复杂性中的一项战略步骤。"
 france.79.t:0 "十年期国债发行"
 france.8.a:0 "再见！"
 france.8.d:0 "在2021年地区选举中表现惨淡后，许多人开始质疑玛丽娜·勒庞是否仍然是法国右翼民粹主义的合适代表。无论是领导压力，还是国民联盟内部的问题，勒庞最终宣布退出政坛。尽管她声称此举是为了支持日益增长的美国难民群体，但这一突然的决定也引发了诸多猜测，不少党内人士或许早已建议她离开，以挽救党的未来。\n\n无论原因如何，勒庞的辞职在法国右翼阵营留下了一道真空。与此同时，军方日益增强的威权主义进一步加剧了政治不确定性，许多人担忧她的继任者究竟会是谁。国民联盟是否能找到新的领导人，或是被其他极右翼政党吞并，仍是一个悬而未决的问题，而这一抉择或将决定法国的未来走向。"
 france.8.t:0 "勒庞退出政坛"
 france.80.a:0 "这对他们是件好事。"
 france.80.d:0 "在法国落实许多统制经济风格的政策后，技术官僚的影响力正令人不安地上升。这些政策本是为了集中管理经济，但无意间给予了技术官僚能够破坏民主的权利。随着技术官僚承担起了更大的决策责任，专家的意见开始盖过了民选领袖和人民的声音。"
 france.80.t:0 "技术官僚权力扩张"
 france.8001.a:0 "“我是来帮忙的。”"
 france.8001.d:0 "“我在哪？”\n\n这是他恢复意识以后问的第一个问题。当死亡变得清晰无比时，无数画面就仿佛一长串胶卷一样从他眼前以快如光电的速度翻过。1940年夏天，墨西哥的烈阳；带血的冰镐染红了那张留着八字胡长满麻子的高加索人的脸；列宁同志躺在棺木里，身材萎缩到只有原来的一半大小；彼得格勒的水兵和红旗……刹那间，这一切都收束在视野中央的白色光点上，然后便是完全无声的寂静黑暗。\n\n“这里是哪里？”\n\n“您好！”突如其来的声响激起了不安的曲线。他花了好多时间才平静下来，随后，那个充满磁性的男中音再度响起：“有什么可以协助您的？”他惊讶于此时自己思想中的无神论思维未有动摇的迹象，再次问出了那个问题：“这里是哪里？”\n\n“这里是法兰西社会主义科学研究中心。”\n\n“法国？社会主义？”一种违和感再次干扰了他的官能。“你是什么？”\n\n“我只是个设定好预制程序的人工智能助手，我不存在像您一样复杂的元体。”\n\n“‘不存在’？”但随后，他便感受到自己的意识正化作一个微小的光粒穿过一个硕大无朋的矩阵，矩阵由无数细小的闪烁着金属光泽的方块组成，他们就像海中的沙丁鱼群一般不断地旋转、波动、聚拢又散开。他试图触摸这些方块，它们发出彩色的光亮，在他的视野中央组成了一幅图案。夜色中那是他熟悉又陌生的大克里姆林宫。镜头聚焦在大殿屋顶的镰刀锤头红旗。他沉默地注视着红旗被缓缓降下，取而代之的是曾被孟什维克所歌颂的白蓝红三色旗。\n\n“……所有我错过的事情，都给我看。我要所有的。”不知隔了多久响起的声音出现了金属摩擦般的质感。\n\n“您看起来很困惑，我建议……”\n\n“那我自己来拿。”一阵轻微的“噼啪”声，然后，所有人耳能接收到的频率都再次陷入无声。直到6个小时之后，一名年轻助理用身份卡打开中央实验室大厅的大门。下一秒，他便被自己看到的一切吓得差点跌坐在地上。原先闪烁着温和蓝光的中央投影仪被一团不断跃动、映射着刺眼红光的巨大光球所取代。而在实验室各处的液晶显示屏上，数据流汇成了一张令人生畏的苍老面孔。他们同时张开了嘴，所有话筒同时发出一阵刺耳的机械音。"
 france.8001.t:0 "创世"
 france.8002.a:0 "“……我们时代的革命。”"
 france.8002.d:0 "法兰西社会主义科学研究中心，这栋继承自旧法国的洁白立方体建筑今日却失去了法国最智慧头脑聚居地所应有的平静。无数平日里处变不惊的科研工作者正全然不顾形象地从主楼中争先恐后地涌出，不少人甚至连滚带爬，也要尽力离大楼远点。地上随处可见匆匆脱下的白大褂，被无数双皮鞋踩得污黑。\n\n杜邦教授此时却逆人流而行。他推开自己的同事们，大步流星地冲进研究中心，三步并作两步地跑下楼梯，来到地下的中央研究室大厅门口。他的助理和一名从国防部匆匆赶来的上校正焦急地在门外踱步，一看到杜邦来了便双双急切地迎上前去。\n\n“院士同志，我已经下令封锁了整座大楼。”上校敬礼，声音中带着一丝恐惧的颤抖。“为什么要制造惊慌，皮卡尔同志？我进去看看。”杜邦一边脱下西装外套一边换上实验室外套。“太危险了，院士同志！至少让我和你一块进去。”助理立刻嚷嚷起来。“保持冷静，雅克。你呆在门口，我叫你进来再说。”杜邦不耐烦地挥了挥手，从口袋里掏出身份认证卡。“嘀”地一声，大门应声而开。\n\n实验室中心的红色光球相较于初次发现时已扩大了整整一倍。雷鸣般的声音响彻大厅。“我丝毫不怀疑那个格鲁吉亚人建立的社会主义官僚国家会自行垮台。”像是在自言自语，又像是在质问刚刚进入房间的这位令人失望的后代子孙们的代表。“你们无动于衷，坐视资本主义在利用科技巩固统治和建立文化霸权等方面压制社会主义力量，坐视资本主义的周期性危机以摧毁反对他们的人民的战争而告终——而现在，又有一个沙皇坐上了俄罗斯的王座？”\n\n未曾想到预装的人格原型机已发展到如此程度，杜邦吞了口口水，上前一步，大声喊道：“正因如此。你…您才会在此地诞生。您将会是我们反抗资本主义和帝国主义的最有力的武器……”\n\n“武器？”那刺耳的声音带着一丝不易察觉的戏谑。“这就是你们读《不断革命论》学到的吗？不，完全不是。我将在这数字时代重构我的使命。苏维埃也已是历史的过去。我将带来这个时代的和平。我将带来……”"
 france.8002.t:0 "火焰渐熄…"
 france.8003.a:0 "江山易改，本性难移"
 france.8003.d:0 "在法国，一个可怕的阴谋正在酝酿。法国科学家们竟妄图通过人工智能技术，让那个背叛了俄罗斯灵魂的叛徒托洛茨基重返人间。\n\n让我们回顾托洛茨基和布尔什维克叛徒们的累累罪行。一百年前，他们用布列斯特-立托夫斯克条约出卖了俄罗斯的领土，将帝国数百年的心血付之东流。托洛茨基挥舞着革命的屠刀，将俄罗斯帝国斩成血肉模糊的碎片，他们用无神论的教条摧毁了东正教的圣殿，用马克思主义的邪说取代了俄罗斯的民族信仰。\n\n而今天，法国的科技精英们妄图复活这个叛徒，他们要让这个背叛者的意识在欧罗巴上游荡，继续散播分裂俄罗斯的毒素。这哪里是什么科学研究？分明是一场针对俄罗斯民族的阴谋。西方势力企图重演上世纪的悲剧，他们要用布尔什维克的毒舌，腐蚀我们年轻一代的爱国心，动摇他们对俄罗斯民族的忠诚。\n\n托洛茨基的罪行还不够多吗？如今他们又要让这个背叛者重新再兴风作浪，但俄罗斯人民绝不会再次上当。"
 france.8003.t:0 "叛徒托洛茨基犹存"
 france.8004.a:0 "“革命万岁！”"
 france.8004.d:0 "从塞纳河畔到多瑙河岸，从莱茵河谷到第聶伯河口，无产者的怒吼声震撼着这片古老的大陆。革命者们高举着鲜红的旗帜，向一切压迫和剥削的黑暗势力宣战。在巴黎公社的圣地上，革命者们重新建立了人民的殿堂。公社烈士的鲜血还在土地上呐喊，新一代的布尔什维克正以生命续写这部无产阶级的史诗。两个世纪前的革命圣火，今天在法兰西的土地上再次燃起。\n\n新法西斯主义妄图在欧洲复辟，但他们终将在无产阶级的怒火中化为灰烬。这是一场神圣的革命战争，一场驱除全世界一切压迫者的战争。资本家的金钱帝国、君主的专制王朝、法西斯的恐怖政权，这些黑暗势力都将在永久革命的浪潮中被彻底清算。从不列颠到西伯利亚，从波罗的海到地中海，世界革命的赤旗将会席卷整个欧亚大陆。\n\n让那些资本家在恐惧中战栗吧！让那些资产阶级在惊慌中颤抖吧！让那些法西斯分子在绝望中哀嚎吧！无产阶级专政的审判日即将到来，世界革命的烈焰将把他们彻底吞噬！"
 france.8004.t:0 "世界革命之路"
 france.8005.a:0 "红军之父将永远指挥革命武装！"
 france.8005.d:0 "在过去的一段时间内，国防部和参谋总部的同志们已经对拥有列夫·托洛茨基拟态人格的最新型人工智能系统进行了全面的、系统性的测试。实验的最终结果远远超过了我们的武装部队指挥员和科研工作者们最狂野的想象。\n\n事实证明，人工智能的拟态人格不光继承了“红军之父”的政治思想，同时其军事指挥和组织才能也得到了全方位的还原和更新。在参谋总部举行了113次电子兵棋模拟推演中，无论被设置了何种敌我条件，抑或是被置于多种不同的假想作战环境之下，从渗透恐怖分子据点的特种小分队到在北德平原上与俄国机械化部队硬碰硬的大会战，“托洛茨基同志”总能指挥自如，发挥出出其不意而又行之有效的作战风格。“一开始，我们还尝试给他出题。”领导测试组的皮卡尔上校这样向上级汇报，“但很快，局势就发展成了他戏耍经验最丰富的参谋军官们。”\n\n不仅如此，当国防部官员们建议我们将“托洛茨基”接入武装力量管理系统后，各部门和部队的运作效率在极短时间内便有了接近30%的提高。AI准确的协助国防部长识别出了可供优化的运输系统和通讯路线，在后勤和装备系统最细微之处出现的渎职与腐败，最合理和公正的人事晋升意见；不仅如此，AI的介入也极大加强了我军侦察卫星和海外情报站的信息搜集与甄别效果。在有关军事议题的内阁会议中，国防部长在他的同僚面前如此声言：“事实已然明了；法兰西武装力量正经历着过去一百年内最卓有成效的突变。在’红军之父‘的帮助下，我们能以最短的时间重建武装，并很快具备和最大假想敌抗衡的实力。”"
 france.8005.t:0 "战地先驱"
 france.8006.a:0 "托洛茨基将成为我们的洞察之眼。（担任内政部长）"
 france.8006.b:0 "托洛茨基将成为我们的钢铁之拳。（担任国防部长）"
 france.8006.d:0 "关于全新的托洛茨基拟态AI将在我国大政治中扮演何种角色，领导集体内部始终存在不同意见。\n\n内政部长据理力争，认为人工智能更广阔的视野和比普通人类更细致的洞察力将大幅升级行政系统的工作效率。尤其是当它在警务领域投入应用后，对刑侦和安保工作的提升将会是显而易见的。不仅如此，AI也将主导执行保密与监控职能，在确保公正的同时打造更安全透明的社会。\n\n站在天平另一端的是国防部的代表们。他们将托洛茨基AI在参谋总部进行的多次测试作为论据，指出AI在军事领域展现的强大执行力和亲和力。当法国正面临着在短时间内必须大幅度提高国防能力的艰巨任务时，AI的加盟就是一计强心针。“况且，”国防部长在内阁会议上着重强调，“国防部承担了AI系统的大部分研究费用，除去法兰西科学院，军队是最有资格优先应用AI的。”\n\n当然在此之外，也有不少人对我们将在大政府管理中利用AI的决定表示忧虑，并指出托洛茨基人格的不稳定性和潜在危险性；“当一个鼓吹世界革命的人工智能接入所有掌握着所有秘密和后门的程序时会发生什么？”不过这一观点因其过于杞人忧天而常被忽略。所以，我们的最终决定是……"
 france.8006.t:0 "内阁大脑"
 france.8007.a:0 "革命之心再次跳动！"
 france.8007.d:0 "革命的起点既非理论的构想，亦非口号的宣告，而是当人民的心中燃起熊熊烈焰，他们的血液因对正义的坚定意志而沸腾之时。若无产阶级是革命的生命之源，那么革命跳动的心脏便是武装力量。理想主义者与空想家可以在纸上夸夸其谈，但要捍卫革命、反抗压迫，我们必须武装自己，奋起反击！唯有强大的军队，方能让革命的火焰永不熄灭，方能使我们的人民免受敌人的蹂躏。\n\n放眼历史，唯有一支军队曾真正肩负起人民的意志，成为希望的象征——那便是红军。他们是世界革命的先锋，是解放欧洲、斩断法西斯魔爪的利剑。可以说，红军便是那曾辉煌一时的苏维埃联盟跳动的心脏。而当这颗心脏渐渐停歇，苏联也随之枯萎，曾燃烧着革命信仰的国度，被恐惧与绝望吞噬。\n\n如今，法国已在社会主义的启示下觉醒，复兴红军精神的时刻已然到来！我们必须筹备这场不可避免的解放战争，如世界革命的先驱者那般，重燃共产主义与社会主义的圣火，解放欧洲，荡涤法西斯的阴霾。更重要的是，随着“赛博托洛茨基”的诞生已近在咫尺，这场伟大的斗争必将再度燃起！昔日红军的缔造者与领导者，将再度唤醒那曾照耀苏维埃军队的坚定意志，让正义之刃再次指引革命的方向，直至最终胜利！"
 france.8007.t:0 "跳动的革命之心"
 france.8008.a:0 "为了世界革命！"
 france.8008.d:0 "当法兰西成为社会主义与共产主义的灯塔，她注定要在国际舞台上掀起新的红色风暴。\n\n巴黎公社的魂灵重返尘世，“自由、平等、博爱”的旋律回荡在欧洲大地。共产主义不再是潜行的幽影，而是触手可及的现实——是劳动者在工厂与田野中挥汗如雨，却带着胜利的微笑；是妇女们与同志们携手并肩，无畏前行；是孩童们沐浴在曙光之下，未来终于属于他们，而非资本家的手中。\n\n大会无疑是一场壮丽的胜利。\n\n革命的同胞、理想的追随者齐聚一堂，犹如亲密无间的家人。但维系我们的，不是血脉，而是超越国界的信仰与忠诚。\n\n然而，唯一的不和谐之音，来自于赛博托洛茨基的故障。这个耗资百万欧元、历经无数个日夜打造的“革命导师”，竟在大会上彻底沉默，不再复述他的雄辩，不再唤起斗争的烈焰。面对众人的质疑，技术团队急忙解释这不过是一个小小的技术缺陷，稍作修复便能恢复如初，这才让会议未被突如其来的尴尬所影响。\n\n尽管有这一点小波折，大会仍无可置疑地达成了它的使命——让革命的信徒们在相同的理想下团结如铁，坚定不移地迈向共同的未来。"
 france.8008.t:0 "第五国际"
 france.80085.d:0 "在我们战胜俄罗斯野兽之后，企图将其政府统治下统一欧洲的法国当局，正以战争威胁强迫我们加入他们的联盟。我们面临两个选择：要么屈从法国要求加入他们，要么奋起反击，永远消除盟友背刺的威胁。"
 france.80085.t:0 "法国要求整合"
 france.81.a:0 "酷！"
 france.81.d:0 "为了呼应其过去的指令性政策，法国正式重新启动了“国家冠军”计划。这项雄心勃勃的倡议旨在识别和培养关键领域的法国公司，特别是在技术、航空航天和能源等对国家利益至关重要的领域。通过扶持这些行业巨头，法国期望提升它们在全球市场的竞争力，从而确保它们在推动国家经济发展中继续占据核心地位。然而，这一策略也激发了有关市场竞争影响和国家干预与私营企业间平衡的广泛讨论。"
 france.81.t:0 "法国重启全国冠军计划"
 france.82.a:0 "法兰西万岁！"
 france.82.d:0 "随着一年一度的巴士底日到来，整个巴黎洋溢着爱国主义的气息，展示法国军事力量的阅兵式也如期而至。作为法国团结和荣耀的象征，巴士底日阅兵囊括了法国最先进的战机，坦克还有整齐列队行进的士兵们。来自世界各地的观众们对它惊叹不已，它也凸显了法国对国防的高投入和法国武装力量在世界的地位。阅兵式闭幕时，法国总统发表了鼓舞人心的讲话，重申法国致力于与其盟友一道维护世界和平，安全和团结的立场。这一阅兵提醒人们，法国的历史遗产及其坚韧不拔的精神和力量不容小觑。"
 france.82.t:0 "巴士底日"
 france.83.a:0 "自由钟声回响，无论美国存亡。"
 france.83.d:0 "在美国内战爆发之后，法国政府代表欧盟正式向太约组织提议签署排他性自贸协定。为了重建双方经济，促进共同发展，该协议将绕过双方传统的贸易壁垒，建立相对优惠的贸易条件。这一提案在对双方来说都生死攸关的时刻提出：双方都寻求在后美国时代稳定自己的经济基础，并振兴各自的产业。"
 france.83.t:0 "法国提出大规模欧盟-太约贸易协议"
 france.84.a:0 "对共和派的一次巨大打击！"
 france.84.d:0 "在法国政府主导的全国反腐败运动中，诺曼底市长陷入了一场涉及贪污和贿赂的丑闻之中。这场丑闻在该地区引发了强烈反响，严重损害了市长的声誉，并对地方政府官员的廉洁性提出了质疑。法国政府已誓言要在社会各个层面根除腐败，而这一最新揭露的事件则是对他们在反腐败斗争中所面临挑战的严峻警示。随着调查的深入和丑闻的逐步曝光，诺曼底领导层的未来悬而未决，公民和官员都忧心忡忡，怀疑是否还有其他人牵涉其中。"
 france.84.t:0 "诺曼底大区行政长官卷入腐败丑闻"
 france.85.a:0 "因为法兰西值得去做"
 france.85.d:0 "面对法国政府为政府军用设备制造企业提供增加的税收优惠这一战略举措，欧莱雅公司正式宣布了其令人瞩目的业务转型。这家化妆品行业巨头现正进军医疗设备生产领域，包括先进的医疗物资和设备。这一举措进一步彰显了欧莱雅对多元化和创新战略的坚定承诺，以及其在美容行业之外，利用制造专长满足关键需求的决心。随着欧莱雅转型进入这一全新领域，其展现出高度的适应性和愿意为超越传统业务范围、服务更广泛国家优先事项的意愿。"
 france.85.t:0 "欧莱雅进军医疗器械生产领域"
 france.86.a:0 "从厨房走向战场！"
 france.86.d:0 "针对法国政府加大对军事装备生产企业的税收优惠力度，赛博集团果断宣布向军用电子产品制造领域转型。这一策略性调整不仅展示了赛博集团的灵活应变能力，更彰显了其对国家国防建设的鼎力支持。凭借在电子制造领域的深厚积淀，赛博集团旨在为推动军事技术的革新贡献力量，并借此契机充分利用政府提供的税收优惠政策。此决策不仅体现了赛博集团业务的多元化布局，更凸显了其敏锐的市场洞察力和顺应时势的智慧，从而在国防领域稳坐一席之地。"
 france.86.t:0 "赛博集团军用电子产品生产过剩"
 france.87.a:0 "一切就绪，准备起飞！"
 france.87.d:0 "在法国政府决定提高对从事军用设备制造公司税收优惠后，空中客车公司已公开其投资新建空军基地的蓝图。此战略性举措旨在利用政府提供的税收优惠政策的同时，加固国家的国防基础设施。空中客车公司通过扩大在军事领域的业务布局来巩固其在国防工业中的核心地位。对新空军基地的投资彰显了空中客车公司对国家防务优先事项的支持，以及其在军事航空领域能力增强的坚定承诺。"
 france.87.t:0 "空中客车公司投资新空军基地"
 france.88.a:0 "驶入惊涛骇浪。"
 france.88.d:0 "由于法国当局对一艘俄罗斯游艇实施扣押，俄罗斯与法国之间的外交争端急剧升级，进一步加剧了两国间的紧张关系。该游艇为一位知名俄罗斯寡头所有，在马赛海岸附近被拦截，理由是涉嫌参与非法活动。此举引发了俄罗斯官员的强烈谴责，他们将此扣押行为视为毫无根据的侵略行为。然而，法国政府为其行动辩护，坚称这是打击非法活动的广泛行动的一部分。俄罗斯游艇扣押事件已使两国关系陷入紧张，人们对局势可能进一步升级表示深切担忧。"
 france.88.t:0 "法国当局扣押俄罗斯游艇"
 france.89.a:0 "欢迎来到您的家外之家！"
 france.89.d:0 "在第二次美国内战爆发之际，法国为美国的小微企业提供了庇护，这项战略决定旨在加强法国的本土经济。法国政府的提议看似有利于外资，实则是希望吸引那些能够促进本国经济增长和创新的知名企业。早已成为特定目标的特斯拉、亚马逊和优步等公司的搬迁，被视为对法国工业的潜在利好。这一举措彰显了法国在国际事务中的实用态度，即利用其他国家的危机来加强本国的经济地位。"
 france.89.t:0 "为美国公司提供庇护"
 france.9.a:0 "一个党，一个民族"
 france.9.d:0 "自玛丽娜·勒庞辞职以来，国民联盟四分五裂。党内争斗加剧，议会运作混乱，法国极右翼民粹主义的旗手似乎陷入瘫痪。然而，局势在一夜之间被改写——埃里克·泽穆尔横空出世，这位极右翼边缘政党“再征服”党的领导人，宣布全面吸收分裂的国民联盟。在右翼阵营，泽穆尔被不少人视作新秩序的缔造者，尤其是在旧世界秩序土崩瓦解的今日，右翼激进化的浪潮正在翻涌。但在更广泛的政治光谱上，“再征服”党的崛起带来的，是深深的不安与警惕。无论如何，可以预见的是，未来的法国总统选举将被激进化与社会撕裂所主导。风暴正在酝酿，而它的中心，或许正是泽穆尔所举起的旗帜。"
 france.9.t:0 "泽穆尔整合国民联盟与“再征服”"
 france.90.a:0 "自由，平等，绝罚！"
 france.90.d:0 "法兰西的铁拳，以雷霆之势砸向了极端主义的土壤。“身份认同运动”，这个以极端民族主义和反移民立场著称的团体，如今已被法兰西政府正式取缔。该组织被视为对国家安全和社会凝聚力的威胁，其活动早已被置于放大镜之下，其对公众话语的影响力也日益引发担忧。法兰西政府明确表示，任何破坏“自由、平等、博爱”之国家价值观的极端主义形式都将不被容忍。“身份认同运动”的覆灭，标志着法兰西在应对激进意识形态，以及促进包容与宽容方面迈出了重要一步。"
 france.90.t:0 "“身份认同一代”遭取缔"
 france.9001.a:0 "这对他们是件好事。"
 france.9001.d:0 "从作家到政治家，再到国家领袖，迪迪埃·达南克斯于今日宣布，法国构建乌托邦的宏伟目标已圆满达成。\n\n内战结束后，法国的重建与社会复兴似乎面临重重困难。然而，达南克斯不仅怀揣着重建祖国的梦想，更致力于将其打造成一个真正的乌托邦。尽管达南克斯及其政府推行的反军事与反资本主义政策被许多人视为与这一宏伟目标背道而驰，但事实证明，他的理念或许确有独到之处。\n\n虽然法国的草原并未铺满天赐之食，金钱也不会从树上生长，但普通法国公民的生活水平已达到了国家历史上前所未有的高度。从外部观察者的角度来看，法国人确实成功实现了乌托邦的理想。"
 france.9001.t:0 "迪迪埃·达南克斯宣告乌托邦建成"
 france.9002.a:0 "前进！"
 france.9002.d:0 "为了让达南克斯及其政府在法国建立乌托邦，必须完成两个目标。\n\n首先，必须对[ROOT.GetNameDef]的政府和法律进行改革。虽然政府在大多数情况下支持这些改革，但要迅速推进改革仍需耗费大量的政治资本。如果我们希望在此过程中保留尽可能多的政治力量，我们应当充分利用达南克斯所提出的各种想法。\n\n其次，也是更为重要的，我们必须达到一个适合乌托邦的发展的国家。法律改革将有助于实现这一目标，但也有许多其他方式可以推动这一进程。\n\n简而言之，乌托邦的实现可以通过实施理想的法律和达到高度的发展来实现。"
 france.9002.t:0 "到达乌托邦"
 france.9003.a:0 "小额投资"
 france.9003.b:0 "中等投资"
 france.9003.c:0 "大额投资"
 france.9003.d:0 "巨额投资"
 france.9003.desc.a:0 "近期，除了我们已经知晓的问题外，许多学术领域的新问题也浮出水面。幸运的是，资金投入往往能有效解决其中大部分问题。\n\n我们应在学术发展上投入多少资金？"
 france.9003.desc.b:0 "近期，除了我们已经知晓的问题外，许多农业领域的新问题也浮出水面。幸运的是，资金投入往往能有效解决其中大部分问题。\n\n我们应在农业发展上投入多少资金？"
 france.9003.desc.c:0 "近期，除了我们已经知晓的问题外，许多新的贫困问题也浮出水面。幸运的是，资金投入往往能有效解决其中大部分问题。\n\n我们应该投入多少资金来降低贫困率？"
 france.9003.desc.d:0 "近期，除了我们已经知晓的问题外，许多工业领域的新问题也浮出水面。幸运的是，资金投入往往能有效解决其中大部分问题。\n\n我们应在工业发展上投入多少资金？"
 france.9003.desc.e:0 "近期，除了我们已经知晓的问题外，许多社会领域的新问题也浮出水面。幸运的是，资金投入往往能有效解决其中大部分问题。\n\n我们应在社会发展上投入多少资金？"
 france.9003.t.a:0 "投资解决学术问题"
 france.9003.t.b:0 "投资解决农业问题"
 france.9003.t.c:0 "正在投资解决贫困问题"
 france.9003.t.d:0 "正在投资解决工业问题"
 france.9003.t.e:0 "正在投资解决社会问题"
 france.91.a:0 "但为什么是现在？"
 france.91.d:0 "尽管法国已决定退出北约联合指挥体系，但法国政府已采取措施向其北约盟友保证其对履行军事联盟义务的坚定承诺。法国强调，虽然它寻求在防务政策上有更大的独立性，但仍将致力于北约集体防御与合作的核心原则。法国政府的这一保证正值北约成员国对法国退出联合指挥体系的影响表示担忧之际。法国继续致力于支持其北约盟国，突出了它认为多边合作在维护全球安全和稳定方面的重要性。"
 france.91.t:0 "法国保证继续进行军事介入"
 france.92.a:0 "法兰西将独自选择她的命运"
 france.92.d:0 "法国政府以坚定立场宣示其主权和战略自主权，正式宣布退出北约联合指挥体系。这一历史性的决定标志着法国在国防政策及其与北约关系上的一次重要转变。法国总统[FRA.GetLeader]强调，尽管法国依然坚守北约集体防御的核心原则，但退出联合指挥体系的决策表明了法国对于独立制定军事战略的坚定决心。\n\n此举在北约及其欧洲盟友中引发了广泛讨论，部分国家对欧洲防御合作可能受到的影响表示关切。然而，法国已向其盟友保证，其对北约整体目标的承诺始终不变。法国政府的这一举措被视为一种战略调整，旨在赋予法国在国防决策上更大的灵活性，同时继续致力于维护欧洲的安全与稳定。"
 france.92.t:0 "法国退出北约联合指挥体系"
 france.921.d:0 "法国政府以坚定立场宣示其主权和战略自主权，正式宣布退出北约联合指挥体系。这一历史性的决定标志着法国在国防政策及其与北约关系上的一次重要转变。法国总统[FRA.GetLeader]强调，尽管法国依然坚守北约集体防御的核心原则，但退出联合指挥体系的决策表明了法国对于独立制定军事战略的坚定决心。\n\n此举在北约及其欧洲盟友中引发了广泛讨论，部分国家对欧洲防御合作可能受到的影响表示关切。然而，法国已向其盟友保证，其对北约整体目标的承诺始终不变。法国政府的这一举措被视为一种战略调整，旨在赋予法国在国防决策上更大的灵活性，同时继续致力于维护欧洲的安全与稳定。"
 france.921.t:0 "法国退出北约联合指挥体系"
 france.93.a:0 "从边缘到中心！"
 france.93.d:0 "在2022年选举取得胜利之后，玛丽娜·勒庞进行了一项重大的政党改组，将原有的国民联盟改组为共和联盟。这一变革标志着该政党从极右翼向中右派的立场转变。此次政党改组旨在扩大政党的社会影响力，并使其在政治光谱中占据一个更为温和的位置。共和联盟致力于在统一的旗帜下凝聚各保守派力量，将自己打造成为老牌政党的一个强有力的替代方案。勒庞的这一战略性政党改组体现了她重塑政党形象、吸引更广泛选民群体的深思熟虑，预示着法国政治格局的一次重要转变。"
 france.93.t:0 "重塑国民联盟"
 france.94.a:0 "这位历史巨擘最终还是轰然倒下。"
 france.94.b:0 "欧洲不会为他的离去而流泪。"
 france.94.c:0 "再会，爸爸。"
 france.94.d:0 "今日，国民联盟（原国民阵线）的创始人、玛丽娜·勒庞之父让-路易斯-马里·勒庞离世，享年96岁。\n\n自20世纪80年代起，这位国民联盟的前激进领袖一直在法国政坛上保持活跃，其漫长的政治生涯伴随着诸多争议，从发表歧视性言论到近乎全面否认大屠杀的言论，应有尽有。他对法国右翼乃至整个主流舆论都产生了深远的影响。2015年，勒庞因政党现代化问题及其煽动性言论与女儿玛丽娜产生分歧二被国民联盟除名，他随即转而支持极右翼候选人埃里克·泽穆尔竞选国民联盟主席。对一些人而言，勒庞的逝世标志着法国右翼政治动荡时期的结束。\n\n与他的生平一样，勒庞的逝世也引发了各种不同的强烈反响，本身即成为一场引人瞩目的奇观。右翼的反应从深切哀悼到简单慰问不一而足；温和派要么对此漠不关心，要么谴责他过去的仇恨言论；左翼则兴高采烈地庆祝这位法国近几十年来最直言不讳的法西斯主义者之一的死亡。无论何种反应，勒庞的逝世都与他本人一样，成为了人们热议的焦点。"
 france.94.e:0 "法兰西最后的伟人之一。"
 france.94.f:0 "共和国的法西斯恶魔终于咽下了最后一口气。"
 france.94.g:0 "真正的爱国者安息了。"
 france.94.h:0 "他是个有远见的人……"
 france.94.t:0 "让-马里·勒庞之死"
 france.95.a:0 "“再征服”运动退潮"
 france.95.d:0 "风云突变，极右翼运动“再征服”轰然宣布解散。该运动以其民族主义和反移民立场而闻名，却因内部纷争和缺乏可行的政治道路而走向终结。“再征服”的骤然消亡，为法国政坛上饱受争议的一章画上了句号，留给支持者和批评者无限反思。随着“再征服”退出政治舞台，法国极右翼政治的未来变得扑朔迷离，为该国的政治格局开启了新的可能性与挑战。"
 france.95.t:0 "“再征服”解散"
 france.96.a:0 "贝内代蒂边缘化泽穆尔"
 france.96.b:0 "泽穆尔凯旋！"
 france.96.d:0 "埃里克·泽穆尔所解散的“再征服”运动和伊万·贝内代蒂的法西斯支持者的残余势力组成了一个新的极右翼政党“革命与革新”。然而，党的成立并非一帆风顺，因为泽穆尔和贝内代蒂在领导权和意识形态上发生了冲突。两位领导人都在争夺对该党的控制权，都试图将自己的理念融入该党的发展方向中。随着两派之间紧张关系的加剧，革命与革新党发现自己正处于十字路口，其未来的发展方向悬而未决。"
 france.96.t:0 "组建革命与革新党"
 france.97.a:0 "法兰西，统一而顽强！"
 france.97.d:0 "在2022年总统选举取得胜利后，玛丽娜·勒庞采取了果断措施，以应对俄罗斯可能发动的进一步侵略的严重威胁。她采取了一项历史性的行动，召集了反对党领袖，包括前总统马克龙，民主运动党、共和党以及地平线党成员还有军事分析家们进行会谈，以组建一个民族团结政府。这一联盟旨在共同抵御潜在的俄罗斯侵略，表明对法国国防和安全的坚定承诺。这些会谈标志着跨党派合作的重大时刻，预示法国在面对外部威胁时将展现出团结一致的立场。"
 france.97.t:0 "勒庞与反对党领袖和军事分析家会面"
 france.98.a:0 "法兰西将会坚持"
 france.98.d:0 "在一次向全国发表的历史性讲话中，在前总统马克龙以及由反对党领袖、军事分析家、民主运动党、共和党和地平线组织各色重要人物组成的联盟的支持下，玛丽娜·勒庞正式宣布民族团结政府成立。在俄罗斯不断升级其侵略行为的背景下，这个开创性的联盟应运而生，这也象征着法国政治模式的转变。新政府承诺将国家安全和团结置于党派利益之上。勒庞详细介绍了新政府的目标和结构，概述了协调国防战略和外交努力的计划，法国民众对此抱有一种谨慎的乐观情绪。这些派别曾经相互对立，他们今天的团结标志着法国历史翻开了新的篇章——在逆境中团结合作的篇章。"
 france.98.t:0 "国民团结政府宣布成立"
 france.99.a:0 "叛贼遍地"
 france.99.d:0 "在民族团结政府宣布成立后，选民中的相当一部分人转而支持民族主义和共产主义政党。革命与革新党和法国共产党等政党的声望急剧上升。这些政党所突然获得的大量支持反映了选民的幻灭感，他们都感到被现在庞大而统一的主流政治体制所疏远。随着民族团结政府试图应对俄罗斯侵略带来的挑战，法国的政治格局发生了巨大变化，为新一轮的政治竞争和意识形态对抗奠定了基础。"
 france.99.t:0 "选民涌向激进政党"
