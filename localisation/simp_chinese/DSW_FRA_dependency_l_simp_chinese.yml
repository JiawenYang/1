 FRA_elisabeth_borne_HM_desc:0 "伊丽莎白·博尔内，生于1961年4月18日，法国政治家和公务员，曾在法国政府担任过多个部长职位。博尔内拥有土木工程背景，曾在公共和私营部门担任过各种职务。她以在交通和基础设施方面的专业知识而闻名，曾在2017年至2020年担任总理爱德华·菲利普政府的交通部长。博尔内以务实的治理方式和对社会及环境问题的承诺而得到认可。"
