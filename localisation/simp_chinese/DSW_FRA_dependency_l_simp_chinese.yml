 Nationalist_France.0.a:0 "那就两线作战吧！"
 Nationalist_France.0.d:0 "伊丽莎白女王接受我们经济与政治援助提议后，荷兰政府迅速向我们递交了正式的宣战书。荷兰王国首都的一次集会上，[HOL.GetLeader]发表讲话称：“国防政府要求比利时在十年内第二次并入法国！我们绝不会对邻国沦陷于军国主义和法西斯主义坐视不理！”\n\n与此同时，卢森堡边境传来消息，革命者与我们的防线已展开激战，战火逐渐蔓延至整个边境线。"
 Nationalist_France.0.t:0 "荷兰政府反对与比利时结盟"
 Nationalist_France.13.a:0 "我们将在摩纳哥会面"
 Nationalist_France.13.d:0 "法国大使缓步于公民表决大道，向威尼斯宫行进——这座墨索里尼昔日发表演说的历史建筑，现被意大利政府设为外宾接待场所。当大使凝视着那座著名的演讲阳台渐行渐近，目睹祖父辈宿敌的陈旧旗帜仍高悬廊檐时，心中交织着惊叹与忧思。此情此景，独缺某位秃顶独裁者的身影，便可重现八十年前的历史奇观。此番大使造访威尼斯宫，旨在传达巴黎筹办法意关系峰会的意向。步入古老建筑内部时，他始终注视着前来迎接的意大利代表团。众人列队穿过长廊抵达会议室，意方特意备妥帕尔马干酪与托斯卡纳基安蒂红酒供会谈时品鉴。经磋商，双方商定将中立国摩纳哥作为会晤地点，这个精致的赌城既是富豪酒店云集之地，亦是商界巨贾的游乐场，实为奠定法意关系美好未来的绝佳舞台。"
 Nationalist_France.13.t:0 "法意峰会"
 Nationalist_France.131.a:0 "我们会来的。"
 Nationalist_France.131.d:0 ""
 Nationalist_France.131.t:0 "在摩纳哥举行的法意峰会"
 Nationalist_France.132.a:0 "一场堪配罗马人的典礼！"
 Nationalist_France.132.b:0 "意大利人不配统治！"
 Nationalist_France.132.d:0 "会晤日当天，摩纳哥公国特准法意两国各派一支仪仗队穿越城区。这个袖珍国度视其为彰显盛大庆典氛围的绝佳契机，毕竟军事阅兵打破赌城浮华光景的景象可不常见。两国各选一支团级建制部队，皆身着华美礼仪军装。此日对两国皆具重大意义，阅兵式之隆重不亚于谈判本身。法国代表团下榻临街酒店，目睹意大利方阵渐近终点。有人嗤笑对比己方军容，有人点头称许，想来对意大利代表团亦复如是。\n\n当意大利部队完成分列式，代表团席间陷入短暂沉寂。随着两国军旗时隔多年再度比肩而立，观礼人群爆发出礼节性掌声与欢呼——虽旗帜不同，但官兵风貌与军装形制彰显的共性远胜差异。法国代表团内部意见纷纭，最终大使转身对随员们道出箴言，预示即将对意大利代表团采取的态度：“以钢待钢，以礼还礼”。"
 Nationalist_France.132.t:0 "角斗士的入场"
 Nationalist_France.133.a:0 "永远的兄弟！"
 Nationalist_France.133.d:0 "法国与意大利大使在各自国旗前握手落座，两国代表团隔桌相望，神情戒备而审慎。浮夸排场与外交辞令令人疲惫，佳肴已尽，琼浆亦涸。双方历时数小时论及势力范围划分与地中海主导权之争。意方尤其为其舰队自豪，高调宣称欲成地中海最强海军；法方则每当触及尼斯与科西嘉议题便巧妙规避。会议最终以精妙手段避开所有雷区，两个民族主义政府达成历史性协议：双方在国际舞台首次缔结的协同行动盟约，将以“战友兄弟”之姿共进退。《伯尔尼协议》草案就此拟定，边界重新划定，瑞士联邦的肢解密谋亦在摩纳哥酒店的华美帷幕后悄然成型。两国大使以兄弟相拥之礼作别，旋即启程向各自领导人禀报佳音。"
 Nationalist_France.133.t:0 "摩纳哥峰会取得成功"
 Nationalist_France.134.a:0 "让我们请求西班牙人的援助"
 Nationalist_France.134.d:0 "在各自的国旗下，法国大使与意大利大使握手，礼节性的寒暄过后，二人落座。会议厅内，双方代表团目光交错，谨慎而冷峻。华丽的仪式已令人倦怠，宴席已散，杯中余酒早已风干——真正的交锋，才刚刚开始。会议围绕着势力范围的划定与地中海霸权展开。意大利代表充满自信，毫不掩饰他们对海军力量的骄傲，并强烈表态称意大利必须成为地中海无可争议的海上霸主。法方代表闻言一笑，轻蔑的态度瞬间点燃了怒火，双方的交谈迅速演变为激烈的争执。随着气氛愈发紧张，意大利代表团开始激动地提出领土诉求，索要萨瓦、尼斯和科西嘉，而法方则鲜有相应的领土要求，仅以法军规模与纪律回击，削弱对方的气焰。会议在突如其来的冲突中骤然终止——两名代表险些大打出手，眼看一场全场混战即将爆发。摩纳哥公共安全部队迅速介入，平息事态，并与摩纳哥亲王宪兵队联手，将两国代表团安全护送至机场，结束了这场激烈而混乱的外交会谈。"
 Nationalist_France.134.t:0 "摩纳哥峰会折戟"
 Nationalist_France.135.a:0 "我们将夺回赫尔维蒂娅！"
 Nationalist_France.135.d:0 "按照摩纳哥峰会的规划，伯尔尼倡议将瑞士按照民族划分，分别并入德、意、法三国。德、意、法三国军队的协调行动，使得此倡议成为钢铁盟约的首次联合军事行动。瑞士的黄金防御时代早已成为历史，如今它被一圈敌意环伺的国家所包围，濒临灭亡的边缘。伯尔尼政府极有可能不战而屈。随着德、意、法三军在边境集结，即便瑞士布下再多的堡垒，引爆再多的桥梁，都无法阻止即将降临的命运。"
 Nationalist_France.135.t:0 "启动伯尔尼倡议"
 Nationalist_France.136.a:0 "启动皮埃蒙特倡议"
 Nationalist_France.136.d:0 "今日，意大利大使正式通知法国外交部，他将递交最后一封照会，并宣布：“在48小时内撤回你们的驻罗马大使。”\n\n如此短促的最后通牒，无疑是充满敌意的举动，一种典型的意大利式背叛。当意大利大使登上返回罗马的飞机，我方立即向驻罗马大使馆发出命令，要求使馆人员在48小时内打包撤离。数架运输机在战机护航下，飞往罗马执行撤离任务。与此同时，德国大使在柏林召见我方代表，询问事态发展。欧洲民族主义阵营曾短暂燃起的团结希望，如今已被迅速熄灭。罗马、柏林、巴黎、马德里，各国政府皆在动荡中仓促谋划欧洲的未来。\n\n伯尔尼倡议原本是法意两国的联合计划，如今已化为泡影。瑞士的瓜分必须暂缓，法国需要制定新的战略，来应对意大利政府的突然敌对立场。在皮埃蒙特倡议即将成型之际，也该是时候重新思考法国的未来了。巴黎，不应仅仅是法国的首都，而是整个拉丁世界的中心。若拿破仑曾加冕为“罗马人的皇帝”，那么，若意大利拒绝同行，我们便当以此头衔再次君临拉丁世界。将此计划送往总参谋部，新的命令即将下达。"
 Nationalist_France.136.t:0 "与意大利断绝外交关系"
 Nationalist_France.137.a:0 "法国令我担忧"
 Nationalist_France.137.b:0 "法国是我们的盟友！"
 Nationalist_France.137.d:0 ""
 Nationalist_France.137.t:0 "意大利人向我们抛出橄榄枝"
 Nationalist_France.14.a:0 "我操你妈的要求"
 Nationalist_France.14.b:0 "我们无力与之抗衡……"
 Nationalist_France.14.d:0 ""
 Nationalist_France.14.t:0 "法国要求转移地中海的领地"
 Nationalist_France.15.a:0 "我操你妈的要求"
 Nationalist_France.15.d:0 ""
 Nationalist_France.15.t:0 "法国要求合并"
 Nationalist_France.2.a:0 "坦克将碾过卢森堡，然后就是布鲁塞尔和荷兰！"
 Nationalist_France.2.b:0 "我们会回来的……"
 Nationalist_France.2.d:0 "在等待我们的外交使团多日无果后，比利时政府终于出现在布鲁塞尔的欧罗巴大厦废墟中。女王伊丽莎白一世宣布：“法兰西国防政府要求比利时在本世纪内第二次并入法兰西。然而，这一次，没有法兰西的傀儡掌控局势，比利时人民的真正意志得以表达，我们向他们的可怜帝国扩张企图斩钉截铁地说：‘不！’”\n\n此言激起了政府的强烈愤怒，许多人强烈要求[FAF.GetLeader]将军立刻发动对低地的入侵，务必在共产主义者或自由主义者得手之前确保我们的安全，尽管我们眼下正陷于内战的泥沼。"
 Nationalist_France.2.t:0 "比利时政府拒绝了我们的提议"
 Nationalist_France.20.a:0 "毕竟城堡都破破烂烂得了……"
 Nationalist_France.20.d:0 "路易·阿方斯·德·波旁陛下颁布敕令，为重现法兰西贵族阶级的国族荣光与神圣使命，将依据《城堡修复法》从皇家预算中划拨专项，用于全国贵族城堡的修缮美化工程。此令甫出即引发民间强烈反弹。黎民百姓岂愿见血汗钱挥霍于贵族阶级的雕梁画栋？然陛下圣意已决，敕令所至，行省皆动。"
 Nationalist_France.20.t:0 "城堡修复法"
 Nationalist_France.21.a:0 "这也是他们应得的！"
 Nationalist_France.21.d:0 "由于《城堡修复法》导致贵族阶层承受的财务压力不断加剧，路易·阿方斯·德·波旁国王巧妙地实施了针对城堡类建筑所有者的大规模减税政策。尽管此举将影响来自城堡的财政收入，但贵族阶层始终是王室至关重要的支持力量，因此无法拒绝给予他们应得的福利。"
 Nationalist_France.21.t:0 "[FAF.GetLeader]宣布为城堡所有者减税"
 Nationalist_France.22.a:0 "这是他们的权利！"
 Nationalist_France.22.d:0 "在历史悠久的凡尔赛宫的小规模翻修完成后，退休的前安盛集团首席执行官、前国防部长皮埃尔·德·谢维涅伯爵的孙子亨利·德·卡斯特里从法国政府手中租下了整个宫殿，用来举办法国几个世纪以来规模最大的舞会，数百名富有的客人们参加了这场舞会。\n\n据传，宾客的名单中包括法国军方高官、三位法国的王位觊觎者、逃出美国的巨星、前俄罗斯寡头，甚至还有英国国王查尔斯三世。"
 Nationalist_France.22.t:0 "凡尔赛的奢华舞会"
 Nationalist_France.23.a:0 "我们在谈论的可是历史！"
 Nationalist_France.23.d:0 "出乎意料的是，皮埃尔-路易斯·德·拉罗什富科，一位被许多人认为是安逸的上流人士的人，已经收集了600多个前法国贵族家族的签名，并要求恢复他们的贵族头衔。这些贵族们的爵位都是法国旧时代的君主授予他们的，但经过几个世纪的对他们不友好的政府的统治，这些贵族们的家系要么已经消失，要么已经落魄不堪，毫无意义。"
 Nationalist_France.23.t:0 "皮埃尔-路易斯·德·拉罗什富科呼吁恢复贵族特权"
 Nationalist_France.24.a:0 "我们可不需要你们三个！"
 Nationalist_France.24.d:0 "自路易·阿方斯·德·波旁国王恢复全国多个历史著名王室家族的贵族头衔以来，出现了一些人滥用这一复辟举措谋取私利的现象。尤其引人注目的是，奥尔良家族和波拿巴家族的推定继承人以法国曾处于共和政府体制下为由，向国王请愿，要求纠正过去一个世纪的历史不公。然而，这两大家族均拒绝放弃对法国王位的主张，导致王室家族之间关系紧张，政治对立加剧。"
 Nationalist_France.24.t:0 "王位觊觎者现身"
 Nationalist_France.241.a:0 "夏尔·波拿巴"
 Nationalist_France.241.b:0 "洛朗·马尔坎杰利"
 Nationalist_France.241.c:0 "玛丽女王！"
 Nationalist_France.241.d:0 "尽管我们掌握着绝对的控制权，但这个新政府因缺乏经验丰富的部长而陷入了困境。\n\n摆在我们面前的有两个选择：夏尔·波拿巴和洛朗·马尔坎杰利。波拿巴虽然出身于拿破仑家族，却不幸地成为了一个终身自由主义者。他已向路易国王宣誓效忠，并摒弃了自己的家族血统。相比之下，马尔坎杰利因在德维利耶总统任期内成功组织支持君主制团体而备受贵族们的青睐，但他却是个狂热的波拿巴主义者，至今仍未向路易国王低头。\n\n最后是不情愿的玛丽女王，但成功地自丈夫加冕以来一直负责内政部的事务。她可以继续担任内政部长，但对皇室而言，这可能并非最为有利的选择。"
 Nationalist_France.241.t:0 "关于内政部长的人选分歧"
 Nationalist_France.25.a:0 "你听着像个自由派。"
 Nationalist_France.25.d:0 "“今天，我站在你们面前，坚定不移地支持让·德·奥尔良登上王位，成为我们的合法国王。他作为奥尔良家族成员的血统，加上他卓越的才智、对国家坚定不移的奉献精神以及对人民真挚的同情心，使他成为在这个动荡时期领导我们的理想人选。他拥有恢复稳定和团结我们四分五裂的国家所需的魅力和智慧。他希望建立一个更加平等的社会，维护每个公民的权利和福祉，这与我和其他许多渴望建立一个公正繁荣的法国的人产生了深深的共鸣。\n在这个充满政治纷争和幻想破灭的时代，他为我们点亮了希望的灯塔。他的进步思想和改革过时制度的决心有可能开创一个繁荣昌盛、社会和谐的新时代。此外，他作为外交官的经验和对国际事务的广泛了解，使他具备了在复杂的地缘政治网络中游刃有余的必要技能。拥戴他为王，不仅是对历史遗产的尊重，也是朝着公平、仁爱和进步的未来前进。让我们团结起来，摒弃分歧，支持让·德·奥尔良，让法国及其所有公民踏上通往更光明未来的征程。”"
 Nationalist_France.25.t:0 "贵族为让·德·奥尔良发声"
 Nationalist_France.26.a:0 "绞死他，让别人都看看！"
 Nationalist_France.26.b:0 "每个人都有权发表自己的意见。"
 Nationalist_France.26.d:0 "我们曾视为密友及波旁王朝拥护者的一位贵族，竟不仅是叛国者，更暗中支持企图推翻我们敬爱君主制的地下共和派运动。所幸其秘书，一位忠诚爱国的王室臣民将调查结果呈报至有关部门，使我们得以在今日清晨将其擒获。此刻，我们面临抉择，是严惩叛徒，抑或施以宽恕？无论何种选择都将产生深远影响，并向法国人民传递我们对于背叛行径的立场宣示。"
 Nationalist_France.26.t:0 "诺布尔被证实参与了地下共和运动"
 Nationalist_France.27.a:0 "逮捕他就太过分了。"
 Nationalist_France.27.b:0 "这是贵族的耻辱。"
 Nationalist_France.27.d:0 "可怕……这实在骇人听闻。路易·阿方斯·德·波旁国王及其宫廷日以继夜地致力于修复君主制与臣民的关系，却不得不面对如此丑闻的曝光。当局认定这是自吉尔斯·德·莱斯案以来最令人不安的连环凶杀事件链，我们本有机会清除这一玷污贵族阶层的污点……但必须指出，这位贵族自王国建立之初就为国家的重大建设提供了巨额资金支持。"
 Nationalist_France.27.t:0 "诺布尔被证实是一系列谋杀案的幕后黑手"
 Nationalist_France.28.a:0 "路易二十万岁！"
 Nationalist_France.28.d:0 "根据路易·阿方斯·德·波旁国王的敕令，多菲内省近日已被授予其继承人路易二十一世。新闻界及其他支持年轻君主任命为多菲内统治者的法国贵族纷纷纪念这一时刻，视此为培养王储继承王位的第一步。这位年轻的继承人计划展开对该省历史与臣民的认知之旅，作为其施政的首项行动。"
 Nationalist_France.28.t:0 "多菲内行省被授予皇太子路易"
 Nationalist_France.29.a:0 "够了！给我彻彻底底调查！"
 Nationalist_France.29.b:0 "别让事情闹大，五年有期徒刑就够了"
 Nationalist_France.29.d:0 "一个极其卑鄙且令人作呕的指控指向了我们宫廷中的一位贵族。据称，在当局针对一个恋童癖团伙进行的秘密调查中，有人看见了他的身影。此事尚未外泄，仍局限于调查范围之内，而我们必须做出抉择——是进一步深入调查，挖掘真相，还是立即采取行动，迅速了结此事，以防其扩散？"
 Nationalist_France.29.t:0 "贵族在恋童癖集团中被捕"
 Nationalist_France.3.a:0 "意外之喜？"
 Nationalist_France.3.d:0 "起初，这不过是又一次试图将国家从内战中自由派与左派污点的掌控下拉回的努力，却意外地失控了。然而，事情的发展却远超预期。在天主教会的合作下，圣女贞德的圣像随教众队伍在巴黎街头巡游，以唤起民族团结，并缅怀这位殉道者的英勇精神。当圣女贞德的画像及其相关圣像展示给民众时，人们的心灵向这位殉道者敞开，他们祈祷并恳求法国在这动荡时期获得成功与福祉。这是一幅动人心魄的美景，甚至到了第二天，还有人请愿将这一天定为纪念殉道者的全国性节日。"
 Nationalist_France.3.t:0 "政府在全国范围内举行圣女贞德纪念游行活动"
 Nationalist_France.30.a:0 "帝国归来"
 Nationalist_France.30.b:0 "拿破仑八世万岁！"
 Nationalist_France.30.c:0 "为了纯洁的欧洲民族！"
 Nationalist_France.30.d:0 "在一场令人震惊的举动中，法国的年轻独裁者若尔丹·巴尔代拉宣布了一项震撼性的新举措，即他在拉丁主宰计划上的关键一步——将权力集中到身份认同党团的三个派别之一。身份认同党团由拉丁派、帝国派和欧洲派组成，自巴尔代拉接管政权以来，这些派别一直协同运作，但各自推行自己对身份认同主义的理解，并追求不同的目标。\n\n拉丁派视法国为罗马帝国的现代化身，梦想将国家与整个拉丁民族统一于一个复兴的西罗马帝国之下。\n\n帝国派则呼唤法兰西帝国的复兴，追寻拿破仑时代的雄伟版图，坚信唯有拿破仑及其后继者曾在现代成功凝聚拉丁民族的力量。\n\n而欧洲派则完全舍弃拉丁主义的羁绊，转而拥抱统一欧洲的宏伟理念。\n\n现在，在确立了一套基于身份认同主义的政府体制后，来自全国各地的身份认同委员会代表将投票选出他们组织的领导人。"
 Nationalist_France.30.t:0 "确立理想"
 Nationalist_France.31.a:0 "万岁！"
 Nationalist_France.31.d:0 "凯撒、奥古斯都、查理曼、路易十四、拿破仑——皆为传奇，皆为征服者，皆属于伟大的拉丁民族。自文明摇篮的辉煌时代起，拉丁人便是人类巅峰的象征，孕育了罗马、加洛林帝国以及现代法国等辉煌帝国。然而，太久以来，我们的民族饱受践踏——懦弱的官僚助长了人口更替，外来精英资助了文化亵渎，令我们的光辉蒙尘。\n\n拉丁民族的统一不仅是政治抱负，更是我们的天命。当面对亚细亚共产主义洪流的惨败后，法国乃至整个欧洲似乎陷入绝境。然而，正如当年图尔之役拉丁勇士粉碎阿拉伯入侵者一般，我们终将浴火重生。拉丁民族不灭，即便曾遭自由派精英背叛，亦曾被英美势力剥削，如今我们终将迎来复兴。\n\n在伟大领袖若尔丹·巴尔代拉的领导下，拉丁民族从衰败废墟中崛起，承载着先祖的荣耀与共同的历史，终将归于同一面旗帜之下，重返故土，重新凝聚为一族。这座伟大的新帝国将重燃罗马遗火，且不会重蹈罗马之覆辙，而是将辉煌延续至永恒。\n\n如今，拉丁民族的炬火已照亮地中海沿岸，而这一次，将永不熄灭。\n\n“罗马人啊，铭记你的天命：汝将以帝国之威统治万邦，教化天下，怜悯顺服者，粉碎骄狂者。”"
 Nationalist_France.31.t:0 "拉丁世界归一"
 Nationalist_France.32.a:0 "你怎么能管自己叫法西斯主义者！"
 Nationalist_France.32.b:0 "我们情同手足！"
 Nationalist_France.32.d:0 "在北意的抗议活动中，众多公民纷纷站出来呼吁建立一个所谓的“帕达尼亚王国”，即一个涵盖了整个北意大利的民族国家。我国政府对此类团体早已有所关注，据悉其资金来自我国西方的法兰西国，但其支持者数量并不算多。"
 Nationalist_France.32.t:0 "帕达尼亚分离主义者大行其道"
 Nationalist_France.320.a:0 "他们理应享有自由！"
 Nationalist_France.320.d:0 "在我们东方，意大利北部的帕达尼亚革命者，正为了自己的民族存续而奋战，他们理应拥有独立的权利。他们为自己的土地、自己的人民、自己的文化认同而战，我们又凭什么否定他们的追求？\n\n若我们选择袖手旁观，那便是对自身历史的背叛。曾几何时，我们亦是在暗影中斗争，在重压下奋起，为自己的身份与主权浴血奋战。如今，他们正走在我们曾经踏过的道路上，我们怎能无动于衷？法兰西必将全力支持帕达尼亚革命，为他们撑起坚实的臂膀，让意大利不得不“重新考虑”对帕达尼亚民族的不敬之举。"
 Nationalist_France.320.t:0 "帕达尼亚的反击"
 Nationalist_France.328.a:0 "兄弟齐心！"
 Nationalist_France.328.b:0 "不，他们差得太多了"
 Nationalist_France.328.d:0 "意大利曾在19世纪60年代浴血奋战，挣脱枷锁，追寻统一。可如今，这个连两个世纪的历史都未曾走完的国家，竟已在我们扶持的分裂者手中土崩瓦解，任由外力摆布。最令人扼腕的是，竟有数百万意大利人，为自身的沉沦欢呼，仿佛他们的衰亡是天命的降临。帕达尼亚的存在，不过是我们介入意大利的棋局之一。但我们又怎能遗忘，波拿巴家族本就是意大利统一的奠基人？昔日，意大利不过是撒丁-皮埃蒙特微不足道的邦国，若非拿破仑三世的援手，它怎能归于萨伏依王朝治下，最终化作今日之疆域？意大利的诞生，本就是法国意志的延伸。如今，我们必须抉择——是让意大利继续在分裂的泥沼中沉沦，使其易于掌控？还是再度扶持我们的拉丁兄弟，让他们恢复昔日的荣光，如同当年我们曾助他们踏上强国之路一般？意大利或许可以再度屹立于伟大国度之列，但唯有在巴黎的庇护下，于波拿巴的旗帜之下。"
 Nationalist_France.328.t:0 "拉丁世界的故乡，你将何去何从？"
 Nationalist_France.33.a:0 "大胆！准备作战计划！"
 Nationalist_France.33.d:0 "我们在罗马收到了令人担忧的报告，法国军队被发现与帕达尼亚分离主义运动积极合作。这样的行为对我们来说是完全不可原谅的，他们竟然认为这些叛乱组织比起我们的盟友更有价值？！荒谬至极！"
 Nationalist_France.33.t:0 "法国军队增援帕达尼亚分离主义者"
 Nationalist_France.34.a:0 "一位远见卓识之人离去了……"
 Nationalist_France.34.d:0 "二十余载，詹卢卡·扬诺内曾警告欧洲——红色狂潮终将席卷而来，他呼吁人民做好准备。这位意大利的第二任领袖，庞德之家的永恒旗手，殚精竭虑，不遗余力地奋斗，只为拉丁兄弟与欧洲同胞的复兴。他憧憬着一个强大、团结的欧洲——一个由血脉与信仰紧密相连的共同体。而如此深邃而伟岸的先知，数百年方能出现一位。\n\n然而，正如历史上无数悲剧般，扬诺内英年早逝，被那些隐藏在我们中间的叛徒夺去了生命！是那些该死的共产党人，是与全球主义者狼狈为奸的卑劣之徒，他们皆与俄罗斯的威胁沆瀣一气！他们以为，刺杀扬诺内便能击垮我们的意志，摧毁我们的事业，但他们错了——他们可以杀死一个人，但无法磨灭他的信仰与理想！\n\n扬诺内的思想将深植于欧洲每一寸土地。我们将加深与欧洲兄弟的联系，共同抵御这一红色浩劫。今天，我们的土地上洒下了欧洲的鲜血；而明天，他们的土地、他们的血肉、他们的子孙，都将为今日的罪行付出代价！"
 Nationalist_France.34.t:0 "詹卢卡·扬诺内在意大利别墅遭遇枪击"
 Nationalist_France.35.a:0 "意大利之死"
 Nationalist_France.35.d:0 "显然，意大利半岛的局势已经超出了我们最初的预估。扬诺内遇刺身亡后，当地的国家法西斯委员会陷入了混乱，迟迟无法推选出一位有能力、有威望的继任者。各地的派系和地方势力趁机而动，迅速填补了扬诺内留下的权力真空，彼此争夺控制权，导致局势进一步碎片化。\n\n与此同时，暴乱的烈火愈演愈烈，社会秩序几乎荡然无存。我们此前为支持帕达尼亚王国而派出的法国军队，最终不得不进驻罗马，并在那里建立了一个势力范围仅限于首都及其周边地区的保护国。尽管这一举措暂时稳住了罗马的局面，但其影响力极为有限，难以辐射到更广阔的区域。\n\n而在接连失去北意大利和罗马这两大战略重地后，贾恩卡洛·奇托领导的意大利社会共和国残余势力被迫向南方撤退。他们试图在南方重整旗鼓，然而却发现自己深陷困境：共产主义暴民与犯罪家族联合构筑的街道封锁如铜墙铁壁一般，将他们的活动空间压缩到极致。在这种艰难的环境下，他们仅能勉强维持对少数几个城市的控制，前景黯淡，前途未卜。"
 Nationalist_France.35.t:0 "庞德之家政权的崩溃"
 Nationalist_France.350.d:0 ""
 Nationalist_France.350.t:0 "法国寻求外交孤立意大利"
 Nationalist_France.351.a:0 "我们的计划稳步推进"
 Nationalist_France.351.d:0 "德国大使今日向外交部发表了讲话，为我们入侵意大利开了绿灯，德国人警告说，这样的入侵可能会使欧洲面临苏联的进一步入侵，但他们还没有看到我们的计划。这不会是一场新的伊比利亚半岛战役，而将是一场对弱小兄弟的速胜战。随着绿光在我军上空闪耀，我们可以开始夺取罗马的战役了。机械化部队眺望阿尔卑斯山，就像200多年前骑在马背上的拿破仑。我们的两栖部队对撒丁岛的白沙心痒难耐。"
 Nationalist_France.351.t:0 "德国抛弃了意大利"
 Nationalist_France.352.a:0 "那正好！让我们想想光复罗马的其他办法……"
 Nationalist_France.352.d:0 "这些背信弃义的混蛋站在了意大利人一边。可能是出于对上一次世界大战的怀念，他们认为罗马比巴黎更值得绥靖，真是胆大包天。德国人最好记住，在过去的一个世纪里他们变得多么软弱无能。无论德国人是否同意，法国注定要控制整个拉丁地区！我们是最强大的拉丁民族，我们追求拉丁人民的繁荣与统一，德国人胆敢阻止这一切的发生！"
 Nationalist_France.352.t:0 "德国与意大利同在"
 Nationalist_France.36.a:0 "西班牙将稳定下来"
 Nationalist_France.36.d:0 "占位符"
 Nationalist_France.36.t:0 "西班牙王室抵达波尔多"
 Nationalist_France.37.a:0 "维持法国-加泰罗尼亚驻军"
 Nationalist_France.37.b:0 "建立法国加泰罗尼亚省"
 Nationalist_France.37.c:0 "必须用武力平定西班牙"
 Nationalist_France.37.d:0 "西班牙，这个与我国历史纠葛深远的国家，从波旁王朝时期的罗克鲁瓦战役，到拿破仑掀起的半岛战争，我们曾无数次与西班牙人兵戎相见，在血与火中交锋。几个世纪以来，双方的恩怨情仇如同一条剪不断的纽带，贯穿于两国命运的脉络之中。然而，昔日那个建立了日不落的庞大帝国、舰队派往七海，在战场上固若金汤的“西班牙方阵”，如今却在自相残杀中土崩瓦解。\n\n如今，西班牙的命运似乎已在无形中落入我们的掌控，而面对这片支离破碎的土地，我们该如何重塑它的未来呢？"
 Nationalist_France.37.t:0 "西班牙的命运"
 Nationalist_France.38.a:0 "我们需要盟友，而非臣民"
 Nationalist_France.38.b:0 "不能信任西班牙人会自我治理"
 Nationalist_France.38.d:0 ""
 Nationalist_France.38.t:0 "关于西班牙问题"
 Nationalist_France.39.a:0 "要求服从"
 Nationalist_France.39.b:0 "我们必须重建秩序"
 Nationalist_France.39.c:0 "授权去激进化"
 Nationalist_France.39.d:0 "葡萄牙就在我们的边境之外，而我们的部队正驻守边界，注视着伊比利亚战乱的土地。如今，我们有机会进入并稳定局势，若战事已平息，我们则有机会按照我们的意愿塑造格局。自孩提时起，我们便在课本中读过半岛战役的悲剧，知晓它如何如泥沼般拖累了拿破仑，最终导致帝国的倾覆。我们不会再犯同样的错误，我们深知，控制葡萄牙，是持久稳定的基石。幸运的是，这一次英国并无意插手葡萄牙事务。如今，有三条政策摆在我们面前：我们可以向葡萄牙发出最后通牒，强迫他们服从我们的安排。既然我们已做好准备，我们或许可以直接推进，占领境内。如果里斯本的掌权者恰好愿意配合我们，我们可以要求他们完全遵从我们的方针。"
 Nationalist_France.39.t:0 "葡萄牙的命运"
 Nationalist_France.4.a:0 "激动人心！"
 Nationalist_France.4.d:0 "《论人权》讨论会记录：在巴黎莫加多尔剧院举行\n\n阿梅尔·达拉米茨：啊，我亲爱的朋友，尽管我理解将平等和自由作为人权核心原则的吸引力，但我仍有一些保留。你看，我认为过分强调个人自由，可能会导致忽视社会责任的危险。我们必须考虑更大的利益和整个社会的福祉。\n\n米歇尔·马尔尚：正是在此点上我们存在分歧！在我看来，人权应当优先保护个人，作为社会的最终组成单位。通过保障每个人的权利和自由，我们赋予他们为集体进步与繁荣做出贡献的力量。正是通过个体的蓬勃发展，社会整体才能够繁荣昌盛。\n达拉米茨：虽然我欣赏个体赋权的重要性，但我们也必须承认，社会是复杂且相互依存的。人权不应仅限于个人自由，还应包括对社区和环境的责任。集体的福祉不应为了个人的自治而被牺牲。\n\n点击继续……"
 Nationalist_France.4.t:0 "人权问题公开讨论"
 Nationalist_France.40.d:0 "不久之前，东方的赤色洪流曾席卷我们的土地，屠杀我们的人民，蹂躏我们的家园。这片土地上至今仍浸透着我们挚爱同胞的泪水，而布尔什维克掠夺了我们的国家，夺走了他们能带走的最后一片残骸。可以说，我们对俄罗斯人的仇恨深不可测。每个国民心中都燃烧着复仇的炽焰。\n\n然而，我们并未丧失理智。在这般危急存亡之秋，复仇的怒火绝不能遮蔽我们的判断。\n\n法国人正敦促我们加入其所谓的反苏同盟——一个旨在抵御东方日益增长的共产主义威胁的联盟。但与他们结盟必将招致俄罗斯人的雷霆之怒，而这场风暴或许是我们尚未准备好承受的。我们的国家仍在重建中，伤口尚未愈合，力量未经考验。我们既缺乏人力，也没有工业实力与欧洲的新统治者开战。\n\n当然，法国人承诺给予我们保护。他们保证提供军事援助和坚定支持。自美利坚合众国解体后，法国独自撑起了北约最强大的军事力量。即便经历了俄欧战争的摧残，他们的军队依然是不可小觑的劲旅。\n\n此刻我们面前的选择既严峻而又残酷，是戴着战败的镣铐，在恐惧与屈辱中苟活？还是昂首挺胸、带着骄傲与荣光迈向死亡？"
 Nationalist_France.40.t:0 "玉碎瓦全"
 Nationalist_France.41.a:0 "加入反苏条约"
 Nationalist_France.41.b:0 "拒绝法国的邀请"
 Nationalist_France.42.a:0 "共和党人大获全胜！"
 Nationalist_France.42.b:0 "民主运动取得胜利！"
 Nationalist_France.42.c:0 "民族保守联盟获得多数席位！"
 Nationalist_France.42.d:0 "在德维利耶的号召下，首届选举的结果依旧扑朔迷离，令所有观察家难以判断。三大政党竞逐，而它们在法兰西民众中的支持率几乎不相上下。\n\n共和党被视为最具优势的竞争者，它几乎是国民联盟的延续——一个保守主义政党，致力于恢复法兰西的传统价值观，同时维护民主制度与权力平衡。\n\n与之竞争的是民主运动，这一中间派政党早在法国沦陷于苏维埃之前便已存在。它自诩为理性与稳健的选择，比起对手，它更倾向于中立、自由的政治立场。\n\n最后则是民族保守联盟——一个结合了保守主义与军国主义理念的奇特联盟。该党自诩比共和党更具爱国精神，认为自身才是德维利耶与戴高乐理想的真正继承者，致力于塑造一个传统主义与民族主义并存的法兰西。"
 Nationalist_France.42.t:0 "新共和国首次大选"
 Nationalist_France.45.a:0 "他仍在前线士兵心之内"
 Nationalist_France.45.d:0 "在英勇捍卫首都的战役中，我们荣耀的领袖“拉法耶特”于针对埃菲尔铁塔废墟周边俄国指挥部的精心伏击中失踪，自此再未现身指挥所。全面撤退前夕，拉法耶特的头盔于一辆焚毁的汽车中被寻获。尽管伏击现场发现数具遗体，却无从辨认哪一位是我们的伟大领袖。\n\n鉴于缺乏证实拉法耶特逝世的遗体，其副官尼古拉·佩罗维奇将军于巴黎郊区某临时讲台上宣告，在指挥官寻回之前，他将暂代领导之职，并呼吁全体发起对俄国战线的决死攻击，为失踪的指挥官复仇。"
 Nationalist_France.45.t:0 "“拉法耶特”坠入黑暗"
 Nationalist_France.46.a:0 "他们活该"
 Nationalist_France.46.d:0 "自我憎恶不仅是个人最可悲的价值观之一，对一个国家而言更是如此。长期以来，在现代社会，这种情绪被不断合理化，不仅外人憎恨法兰西，连她的子民亦对自己的国家心生怨怼。如今，随着我们政权完全掌权，人民决定不再容忍这种情况，大量报告显示，反法企业的建筑被洗劫、焚烧等等。法国将重拾爱国精神，那些无法接受这一点的人在我们伟大的国家中将没有立足之地。"
 Nationalist_France.46.t:0 "反法企业遭洗劫"
 Nationalist_France.47.a:0 "它……太美了……"
 Nationalist_France.47.d:0 "《欧洲灵魂的毁灭》必将成为法国电影史上最伟大的史诗巨作，向全世界展示我们的电影艺术巅峰之作。该片一经上映，场场爆满，数周内一票难求，爱国者纷纷涌入剧院，只为目睹这部描绘我们如何以剑拯救法兰西的历史史诗。而在海外，它同样赢得了广泛认可。德国、意大利，甚至英国的影院亦传出同样的消息——剧院座无虚席，人们争相见证这部用镜头镌刻的法兰西辉煌。"
 Nationalist_France.47.t:0 "《欧洲灵魂之陨》上映"
 Nationalist_France.48.a:0 "一部关于我们国王及其勋绩的电影！"
 Nationalist_France.48.b:0 "忠诚臣民的线上聚集地！"
 Nationalist_France.48.d:0 "我们正义且睿智深沉的君主，路易·阿方斯·德·波旁国王明智地把一部分皇家预算分配给了艺术创作，以展示我们国王对法国艺术的赞助。然而，最困难的部分在于决定该如何使用这笔预算。我们已经从皇家现代艺术委员会得到了许多建议，其中两个最受欢迎的选择被选中。首先是一个名为“皇冠”的亲君主主义社交媒体平台提议拍摄的一部关于路易·阿方斯·德·波旁国王及其功绩和成名之路的电影。其次是支持成立一个名为“XX”的亲君主主义社交媒体网站，供法国臣民表达对我们敬爱君主的崇拜。提案的起草工作已经完成，只待送交路易·阿方斯·德·波旁国王，静候他对其中某一项目的恩准。"
 Nationalist_France.48.t:0 "现代艺术的资助者"
 Nationalist_France.49.a:0 "电影级的杰作！"
 Nationalist_France.49.d:0 "《二十世》不仅将成为法国电影史上最伟大的作品之一，更将跻身世界影史巅峰之列。这部电影由精挑细选的制作团队精心打造，淋漓尽致地再现了第一次欧陆战争的风云变幻，以及我国君主如何在法兰西最黑暗的时刻拯救国家。最令人惊叹的，是选角的精准程度。众多将军、政治家，甚至国王路易·阿方斯·德·波旁本人，都惊讶于银幕上自己的化身竟与现实如此相似。放映结束后，国王亲自会见了导演及剧组成员，对这部载入史册的电影给予高度赞誉，称其为“恢弘壮丽的历史杰作”。"
 Nationalist_France.49.t:0 "《二十世》上映"
 Nationalist_France.5.a:0 "嗯，也许放弃她还为时过早"
 Nationalist_France.5.d:0 "在数百名观礼者的注视下，一座全新的玛丽安娜纪念碑于巴黎市中心揭幕，描绘着其统帅法军抗击俄军的英姿。这座六米高的雕像由著名雕塑家采用传统法国石材雕刻而成，塑造了玛丽安娜高举旗帜、目光坚毅面向东方的凛然身姿。\n\n基座上镌刻着“自由永不退缩”的铭文，以此声明法国对自身价值观的坚定承诺。该纪念碑已被誉为法国近代史上最具标志性的爱国作品之一，是对当前国际环境下国家立场的清晰宣言。揭幕仪式以军乐队奏响激昂的爱国乐曲、三色旗迎风招展为标志，既庄严肃穆又充满斗争气息。当仪式达到高潮时，人群中许多人自发高唱《马赛曲》，嘹亮歌声响彻广场，凝聚着集体的自豪与决心。"
 Nationalist_France.5.t:0 "官方为玛丽安娜率军抗击俄罗斯的雕像揭幕"
 Nationalist_France.50.a:0 "这狗屁玩意儿谁批准的？"
 Nationalist_France.50.d:0 "《二十世》彻底沦为一场灾难，不到一周便被撤下银幕，直接送往DVD发行。电影的制作过程一片混乱，剧组成员因管理不善频繁更换，甚至在国王的命令下，导演更迭了四次之多。而最为人诟病的，是糟糕至极的选角——饰演国王的人物与路易·阿方斯·德·波旁毫无相似之处，这一失误令国王大为震怒，甚至在首场放映的第一幕尚未结束时便愤然离席。最终，这部电影不仅未能成为法国电影史上的荣耀，反而成了一场拙劣的笑柄。"
 Nationalist_France.50.t:0 "《二十世》票房惨败"
 Nationalist_France.51.a:0 "网络保王党们联合起来！"
 Nationalist_France.51.d:0 "啊，Couronne！该从何说起呢？这个社交通讯平台的诞生堪称神迹。国内顶尖技术团队倾力雕琢，将网站打磨至完美之境。若Couronne是尊雕塑，定能与国家瑰宝共耀卢浮宫。平台今日甫一上线便引发热烈反响，数十万忠诚子民蜂拥注册，争相为我们敬爱的君主传播祝福。当路易·阿方斯·德·波旁国王陛下发出首条Couronne动态时，服务器几近崩溃，几乎整个平台瞬间被欢呼声淹没。这个平台必将载入史册，成为我们深谋远虑的君主缔造的又一传奇。"
 Nationalist_France.51.t:0 "启动“皇冠”行动"
 Nationalist_France.52.a:0 "天哪……那是法军士兵的尸体吗……"
 Nationalist_France.52.d:0 "真是令人作呕！我们原本希望“Couronne”能成为一款创新且具有革命性的社交媒体平台，专供法兰西子民使用，但就在社交消息系统上线几分钟后，服务器便遭到猛烈攻击。情况彻底失控——频道被反君主主义者的言论淹没，甚至充斥着欧陆战争的残酷战斗画面，特别是那些俄罗斯败类所留下的恐怖影像。然而，我们的审核团队几乎不存在，根本无法有效遏制这一混乱局面，最终，在仅仅数小时后，我们不得不关闭服务器，彻底终结这一平台。无数纳税人的资金就此打了水漂，换来的却是一场惨不忍睹的灾难。"
 Nationalist_France.52.t:0 "启动“皇冠”行动"
 Nationalist_France.53.a:0 "绝不！"
 Nationalist_France.53.b:0 "路易二世陛下万岁！"
 Nationalist_France.53.d:0 "占位符"
 Nationalist_France.53.t:0 "法国要求统一波旁王朝"
 Nationalist_France.54.a:0 "[THIS.GetRank] [THIS.GetName]"
 Nationalist_France.54.d:0 "截至[?global.date.GetDateString]，驻守凡尔登指挥中心与军火库的防御部队已成功四次击退我军的进攻。\n尽管这些补给资源对我军至关重要，但被围困的共和军残部正负隅顽抗。一旦他们成功突围，将对我们在大东区的脆弱控制构成极大威胁。\n为此，我已批准一轮高爆弹火力覆盖，并协调空袭，对上述两处目标进行彻底摧毁。\n\n签署："
 Nationalist_France.54.t:0 "关于进攻凡尔登指挥中心与军火库的报告"
 Nationalist_France.55.a:0 "[THIS.GetRank] [THIS.GetName]"
 Nationalist_France.55.d:0 "截至[?global.date.GetDateString]，针对凡尔登指挥中心及军火库的围攻已圆满结束。\n缴获的物资包括约7,500支HK416F步枪及约300套指挥装备，这些物资将助力我们组建新部队，继续从共和国和南方共产主义者之手中收复法兰西。\n为表彰士兵们的胜利，我已批准发放一份葡萄酒配给，供其庆祝。\n\n签署："
 Nationalist_France.55.t:0 "关于进攻凡尔登指挥中心与军火库的报告"
 Nationalist_France.56.a:0 "把他们给我盯紧了！"
 Nationalist_France.56.d:0 "我国爆发的内战风暴迅速席卷全球舆论，正如当年第二次美利坚内战所引发的震动。然而，尽管我们的正义政权在国际上鲜有支持，却也收到了一则意外的消息——远方的盟友。一位年轻军官，拉法耶特向指挥部报告称，他在数年前海外作战时，曾为“爱国者阵线”组织效力，并结识了一些经验丰富的“老兵”。虽然我们对大西洋彼岸的野蛮行径毫不在意，但拒绝这个机会无疑是愚蠢的。"
 Nationalist_France.56.t:0 "爱国者阵线志愿军到达"
 Nationalist_France.57.a:0 "他们捍卫着法国的价值观。"
 Nationalist_France.57.b:0 "他们跟共产党都是一路货色！"
 Nationalist_France.57.d:0 "保守主义……它曾是法兰西步履维艰的枷锁之一。尽管比起那些企图将法兰西付之一炬、摧毁我们信仰的公社叛徒而言，保守派尚有可取之处，但第五共和国的沉沦已昭示我们，唯有打破旧制，方能重塑辉煌。如今，决定权掌握在我们的军官与统帅手中。他们必须在两个抉择间作出选择——坚守我们的信仰，推进变革，还是妥协退让，以求换取未来的一线生机？而最终的答案，将由他们书写。"
 Nationalist_France.57.t:0 "吸纳保守派士兵"
 Nationalist_France.58.a:0 "必须铲除他们！"
 Nationalist_France.58.d:0 "法兰西的每一个角落，都难逃这股暴力风暴的席卷。这片曾经辉煌的国度，如今在公社余孽的摧残下满目疮痍，兄弟阋墙，战火再燃。在我们最为脆弱之时，他们不仅毁灭了我们曾拥有的一切，如今更妄图更进一步，将法兰西置于赤色旗帜之下，沦为他们那扭曲、复仇心切的寄生意识形态的奴隶。但我们绝不会退让！我们将连根拔除这场思想的瘟疫，肃清那些被其毒害的同胞，直至法兰西重归纯净！而我们也不会止步于此——我们将向前推进，直到这场红色灾厄被彻底铲除，连根拔起，永不复返！"
 Nationalist_France.58.t:0 "社会主义瘟疫"
 Nationalist_France.59.a:0 "再小的爱国者也是兵！"
 Nationalist_France.59.b:0 "他们长大后才有用。"
 Nationalist_France.59.d:0 "战争中的儿童问题始终饱受争议，然而，在前线告急、可用兵源不断枯竭的当下，我们不得不权衡现实与选择。\n\n为何要在教育上消耗我们本就有限的资源？相较于书本与课堂，他们在前线的侦察、辅助与后勤岗位，或许能发挥更直接的作用。毕竟，青少年已接近成人体格，在战场上也可堪一用。是让他们留在课堂，还是投入战场？这已不仅是道德问题，更是关乎生存的抉择。"
 Nationalist_France.59.t:0 "组建儿童爱国者旅"
 Nationalist_France.6.a:0 "一个两度试图挽救法国的人"
 Nationalist_France.6.d:0 "在经过一系列的辩论和争吵后，一项具有历史意义的法令终于在近日宣布生效，新法令正式宣布菲利普·贝当元帅无罪。\n\n贝当元帅对法兰西的贡献不容忽视。在第一次世界大战期间，他在凡尔登战役中展现的非凡军事才能挽救了国家危亡。当德军似乎不可阻挡地推进时，正是贝当的坚决领导和战略智慧筑起了防线，这份功绩使他赢得了全国人民的爱戴和元帅的崇高荣誉。1940年，面对德国闪电战的摧枯拉朽，当我们的军队溃败，当数百万法国士兵沦为战俘，贝当元帅接受了历史赋予他的责任。他选择留在国内，与占领者周旋，而非远走他乡。这一决定需要何等的勇气与牺牲精神？以八十四岁高龄，他本可以安享晚年，却选择在国家最黑暗的时刻挺身而出，承担起拯救法兰西的重任，而他的外交策略使法国避免了像波兰那样的全面占领命运，为日后的解放保存了民族力量。\n\n但战后对贝当的审判深受政治需要的影响。当时的法国需要一个象征来洗刷战败的耻辱，而贝当不幸成为了这个象征。通过这项法令，我们不仅是为一位老人恢复名誉，更是为我们的民族记忆增添必要的深度和广度。我们相信，一个真正强大的国家必须有勇气面对自己历史的各个侧面，包括那些复杂而矛盾的篇章。"
 Nationalist_France.6.t:0 "新政府法令宣告菲利普·贝当无罪"
 Nationalist_France.60.a:0 "爱国不分年龄！"
 Nationalist_France.60.b:0 "他们不会派上大用场。"
 Nationalist_France.60.d:0 "这场战争伊始，我们曾期待速胜，然而现实却是接连不断的惨痛损失，每一天，我们的可用兵力都在迅速减少。\n\n为了填补前线的空缺，我们必须动员一切可用资源。老人们——他们或许已退役，或许身在医院，但他们仍有一战之力。若能承诺战后全额医疗保障或增加退休金，他们自然会愿意参战；若不愿，我们也可以采取更直接的措施。\n\n老兵旅的加入，不仅能充当前线屏障，还能为我们宝贵的精锐部队赢得调整与反攻的时机。"
 Nationalist_France.60.t:0 "接纳老人"
 Nationalist_France.61.a:0 "一个杀人犯？那就给他一支枪！"
 Nationalist_France.61.b:0 "我们绝望。但绝不轻率。"
 Nationalist_France.61.d:0 "前线局势持续恶化，我们已别无选择，必须动员一切可用之力。随着传统兵源日益枯竭，我们必须从新的渠道寻求补充。\n\n如今，成千上万的罪犯正无所事事地腐烂在监狱中，消耗国家资源，占据空间，毫无价值。但事情不必如此，他们甚至可以成为爱国者。我们已启动一项计划——凡是愿意服役的囚犯，将获得自由，前提是他们能活着回来。若此举仍不足以填补兵员空缺，我们完全可以采取更直接的手段。\n\n他们曾是社会的渣滓，如今将成为战场上的勇士，为祖国而战，并因此感到自豪！"
 Nationalist_France.61.t:0 "惩戒部队"
 Nationalist_France.62.a:0 "而我感觉蛮好的"
 Nationalist_France.62.d:0 "我们已经克制自己太久了，战争的死亡、毁灭和疯狂仍在整个大陆肆虐。我们的心爱的地标与历史遗产在过去的十年中被赤匪亵渎，且没有任何迹象表明他们的全面战争会有停止的一天。我们的兄弟在正在眼前倒下，那些摆脱社会主义桎梏后所赢得的令人骄傲的文化与身份认同再度沉沦，为腐朽瘟毒所所玷污。法国也同样不能幸免，与欧洲其他地方同样陷入悲惨境地，只得满怀挫折、饱受羞辱地撤回本国境内。\n\n如今欧陆战争已不可避免的将继续下去，这是我们所无法回避的。鉴所有参战国都宣布将进行全面战争，我们不能再克制自己了；我们不能在主动约束自己的情况下赢得胜利，更不用说白白浪费任何可能的优势了。随着行政系统更替完成，通过与前政府人员合作，我们已逐步恢复了我们的核作战能力，并已为审判之日做好准备。历史学家可能不会赞扬我们的决定，但他们永远不会理解我们今天所面临的严峻形势。我们将不惜一切代价取得胜利，直至终局也永不退缩。"
 Nationalist_France.62.t:0 "我们所知世界的末日"
 Nationalist_France.63.a:0 "必须将其铲除"
 Nationalist_France.63.d:0 "近日，少数罔顾国家利益的叛徒在里昂、马赛、图卢兹街头煽动骚乱，甚至卑鄙地对忠诚的公务人员发动暗杀行动。巴黎第七区一名高级官员在回家途中遭遇暴徒袭击；斯特拉斯堡某政府办公室遭纵火焚毁。\n\n这群自诩“共和国捍卫者”的所谓“抵抗战士”，实为混乱与分裂的代言人。他们散布谎言，诋毁我们复兴法兰西荣光的伟大事业，企图将国家拖回旧体制的软弱泥潭。他们在墙上涂抹“不自由毋宁死”的标语，却不懂真正的自由只能建立在秩序与团结之上。不难发现境外势力在幕后操纵、那些曾击败法兰西、如今恐惧我们复兴的国家正用金钱武器资助暴徒，妄图通过制造内乱削弱我们。这些甘心充当境外势力走狗的叛国者，背弃祖国与血脉，实为民族之耻。\n\n但面对挑衅，政府绝不会姑息。领导人已明确表态，必须用铁腕手段粉碎危害国家统一的威胁。包庇或支持暴徒的普通民众也将被追究责任。沉默即是共谋，旁观等同纵容。每个真正的爱国者都有义务向当局举报可疑行径。法兰西的未来，系于我们每个人的警觉与忠诚。"
 Nationalist_France.63.t:0 "反抗军"
 Nationalist_France.64.a:0 "巴黎之夜"
 Nationalist_France.64.d:0 "烟雾从一支燃烧的香烟中袅袅升起，夜晚的巴黎被无尽的星光和灯火装点。弗里茨坐在摇椅中，凝视着这座城市的轮廓，而他的朋友康拉德正靠在墙边。\n\n“巴黎的夜晚真美，不是吗，康拉德？”弗里茨问道。\n\n康拉德沉默了片刻，直到他终于开口：“弗里茨，你再也无法掩饰了，我们完了。昨天收到的情报是我们的顶级线人提供的，完全准确。警察的动向、城外的路障、全部取消的航班——他们在筹备某件大事。”\n\n弗里茨望了康拉德一眼，将香烟掐灭。香烟熄灭的滋滋声与弗里茨站起时发出的骨头摩擦声一同消散在空气中。\n\n“你可能是对的，但那不意味着我们已经注定失败。我们掩盖得很好，他们还不知道我们的‘同情’，正如他们喜欢称呼的那样。如果他们真的发现了……”弗里茨顺手抓起靠在门框上的双管猎枪。\n\n几分钟过去了，两人试图通过开玩笑来驱散紧张的气氛，但那种挥之不去的压抑感却越发沉重。他们清楚任何事情都可能发生。而那一刻终于到来。\n\n他们听见屋内传来窸窸窣窣的声音。弗里茨拿起猎枪，和康拉德一起走进公寓房间，弗里茨将猎枪对准了门，康拉德从床下拉出一把AKM并上好了弹。\n\n然后，一片死寂。只剩下沉重的喘息声和窗外低沉的车流声。\n\n直到门外传来一声大喊，前门轰然飞离门框。"
 Nationalist_France.64.t:0 "净化之夜"
 Nationalist_France.65.a:0 "狗娘养的！"
 Nationalist_France.65.d:0 "即便军队的怒火越来越强烈，我们仍然不断地节节败退。最终，这种情绪达到了沸点。迄今为止，已有成百上千的士兵公开叛变，对这场战斗感到绝望并不再愿意为之牺牲。我们必须修补军队内部的裂痕，否则法国将永远陷入被奴役的深渊。"
 Nationalist_France.65.t:0 "军内愤激"
 Nationalist_France.66.a:0 "我们必须迅速行动……"
 Nationalist_France.66.d:0 "随着前线接连失利，部队开始出现逃亡与怨怼情绪。必须及时整肃军纪，对动摇军心者严惩不贷——除非我们甘愿坐视整支军队在眼前分崩离析。"
 Nationalist_France.66.t:0 "部队动乱"
 Nationalist_France.68.a:0 "狗娘养的！"
 Nationalist_France.68.d:0 "随着战线持续崩溃，连最狂热的极端民族主义者都对我们燃起熊熊怒火——他们控诉我们挥霍国家资源、践踏人民尊严，完全未能兑现承诺的理念与理想。昔日盟友纷纷倒戈，阵营内部复兴希望渺茫，然而纵使穷途末路，仍要咬牙血战到底。"
 Nationalist_France.68.t:0 "极民派愤怒"
 Nationalist_France.69.a:0 "格鲁希在哪里？"
 Nationalist_France.69.d:0 "这，就是他为多年牺牲所换来的“奖赏”。伤痕累累，岁月流逝，战友长眠于远方。他为法兰西而战、而杀、而流血——从俄罗斯平原，到普里皮亚特沼泽；从维斯瓦的田野，到巴伐利亚的高岭。如今他终于归来，却非凯旋英雄，只是一条疲惫不堪的老狗。他所得的回报？便是担任军团后卫的“荣耀”任务。一支由老兵与毛头小子拼凑而成的残破部队。命令清晰：集结所剩无几的部队与所有散兵，死守摩泽尔，为主力部队在默兹河重整防线争取时间。\n\n指挥部设在一栋老邮局内，临时拼凑而成。他坐在屋中，四周围绕着不熟悉的面孔——既不是老友，也非战友，只是陌生人与幽灵。有些太老，有些太嫩，几乎可以是他的孩子。他们的惊慌、他们的争论，让他头痛欲裂。有人建议撤退，有人谈论重组——他一概置之不理。现在已经太迟，且更重要的是，这违背了命令。炮声愈发逼近，阵线几近溃散，指挥部岌岌可危。他所有的希望，都寄托在预备营那场反击上。他对那名营长向来存疑，可在眼下，已无选择——无人能接手那场硬仗。\n\n他还在沉思，忽然一名军官跌跌撞撞冲进指挥部，军服破烂，明显不是他的尺码。他的声音带着无法掩饰的恐惧，带来最糟糕的消息：预备营覆没，通信中断。指挥官沉默了一会儿。外头的炮声已近在咫尺，敌人几乎逼到了门前。而他，只感到一种突如其来的清醒：原来，这一切……全都白费了。他终于崩溃。开始咆哮、怒骂、歇斯底里地宣泄心中所有愤懑。他诅咒那营长，诅咒他胜过诅咒过的任何人。命令早已崩解，部队四散逃命，而他，却留在原地不动。仿佛某种迟到的宿命意识将他钉在地上。他破碎、疯狂，却仍不屈。敌人冲进指挥部，他站立于废墟中，怒吼着最后的抗争。而从他喃喃自语与歇斯底里的呼喊中，败逃的士兵们唯一能听清的只有一句："
 Nationalist_France.69.t:0 "大谜团"
 Nationalist_France.7.a:0 "也许我们正是那“失落支派”的一员！"
 Nationalist_France.7.d:0 "玛雷区是位于帕维街上的哈古达·哈吉霍洛斯犹太教堂的所在地，也是当地犹太文化的重要枢纽。经过几个世纪的动荡，一波意外的访客为这个原本宁静的社区带来的些许不寻常的气息。\n\n自前天起，成千上万的法国以色列主义者从全国各地聚集而来举行盛大的集会，吸引了大量当地居民和游客驻足倾听。与此同时，本地犹太居民则悄悄地打开窗户，监视这些临时集会。\n\n这些以色列主义者源自法国民族主义潮流，他们声称法国的祖先，即法兰克王国的梅洛温王朝，是以色列失落的十个支派的直系后裔。换句话说，他们认为法国人是古代犹太民族的继承者——是由上帝选中建立最伟大的帝国，并在末世后重建独自文明，享受上帝的独家青睐。\n\n尽管这些说法在外人看来可能很荒谬，但深受像神圣血统兄弟会这等神秘团体影响的以色列主义者坚信法国民族拥有独特的命运。有趣的是，尽管巴黎警方已对这些进行了几天的监控，但他们并未采取任何行动来约束这些狂热的信徒。至于旁观者，很难说他们是觉得以色列主义者的宣言可笑，还是由此开始质疑对此的怀疑态度。"
 Nationalist_France.7.t:0 "法以主义者在巴黎赚足眼球"
 Nationalist_France.8.a:0 "我的皇冠在哪里？"
 Nationalist_France.8.d:0 "自救国政府宣布赢得巴黎内战胜利以来，首都街头数周内频繁出现军事游行本不足为奇。但出人意料的是，近来观察发现，市民甚至军队在悬挂新政权旗帜的同时，竟也升起了历史上统治法国的君主家族的旌旗。这一现象令高层指挥部颇感意外，不过近期消息显示，随着君主制在法国复兴的迹象愈发明显，全国范围内的君主主义思潮正持续升温。"
 Nationalist_France.8.t:0 "救国游行"
 Nationalist_France.9.a:0 "为勒库安特干杯！"
 Nationalist_France.9.d:0 "“法兰西的救星”——这是许多人赋予弗朗索瓦·勒库安特的称号。而今日，他罕见地出现在巴黎街头，领衔一场盛大的游行。当他的身影映入人群视野，整个城市再次沸腾，如同那象征法兰西复兴的统一时刻再度降临。游行队伍途经巴黎诸多历史名胜，最终抵达象征国魂的埃菲尔铁塔。此刻，众人屏息，目光紧锁在舞台中央，等待着那一刻的到来——弗朗索瓦缓缓举起剪刀，剪下缎带，象征着艾菲尔铁塔正式重新向公众开放。围聚于广场上的爱国者们爆发出雷鸣般的欢呼，见证这一激动人心的时刻——他们的骄傲、他们的城市、他们的国家，正昂首迈向新的时代。"
 Nationalist_France.9.t:0 "弗朗索瓦·勒库安特在巴黎巡游"
 Nationalist_France.99.a:0 "欧洲的潮流正在改变，我们必须共同乘风破浪。"
 Nationalist_France.99.b:0 "是选择与法国结盟，还是选择再次沦为法国的附庸？"
 Nationalist_France.99.d:0 "在阿尔隆战役中，我们捍卫比利时理想，击退卢森堡的共产主义起义后，[FAF.GetLeader]将军派遣使团，提出缔结正式联盟的请求。根据这一协议，比利时将被纳入法国的保护之下，而我们将借助法国的力量维护理想与利益。然而，女王对此表示坚决反对，她认为法国官员的无能与干涉正是导致我们深陷困境的根源。尤其是，当年在法国支持下，由首相洛朗·布罗尼特策划的政变，强迫她父亲退位的屈辱事件，更是让她对此提议无法释怀。"
 Nationalist_France.99.t:0 "法国军方提供援助"
 OCT_green_fields_of_occitania_idea:0 "奥克西塔尼亚的绿野"
 OCT_spirit_of_the_pyrennes_idea:0 "比利牛斯精神"
 Occupational_Governor:0 "占领政府"
 PIC_belgian_terror_idea:0 "比利时恐怖主义"
 PIC_firm_majority_idea:0 "稳固政治多数"
 PLD_Piotr_Ikonowicz_char:0 "彼得·伊科诺维奇"
 PLD_Rajmund_Andrzejczak:0 "拉杰蒙德·安杰恰克"
 POLITICS_BARDELLA_DESC:0 "若尔丹·巴尔代拉是法国政坛的新兴领袖，亦是国民联盟年轻有为的掌舵人，象征着法国极右翼政治的新一代力量。他出生于1995年生，在充满政治激情的家庭熏陶下成长，自青少年时期便积极投身政治活动。他对政治学的深入钻研，更是点燃了他攀登政治高峰的雄心，促使他一步步从党的发言人晋升至党主席之位。\n\n巴尔代拉的领导风格鲜明，他高度重视民族主义、移民管控以及法治秩序。他自视为“被忽视”的法国民众代言人，积极倡导制定以这些群体的需求和关切为优先的政策。在他的引领下，国民联盟致力于重塑法国的国家认同，坚决捍卫文化遗产与传统价值观。巴尔代拉以其激昂的演讲风格及与年轻选民建立深厚联系的能力，赢得了广泛关注。他矢志增强国民联盟在法国政治版图中的影响力，勇于挑战现有格局。"
 POLITICS_BENEDETTI_DESC:0 "伊万·贝内代蒂是位狂热的民族主义领袖，他于内战后崭露头角，并毫不掩饰自己的法西斯意识形态，不禁让人想起贝尼托·墨索里尼早期的政治理念。作为1980年生人，他在政治动荡的氛围中长大，这一经历使他形成了塑造一个强大的、将法国公民利益置于首位的威权国家的愿景。\n\n贝内代蒂主张对法国进行彻底改革，寻求消除对国家认同的威胁，恢复他认为的法兰西昔日辉煌。他的演讲与那些对传统政治感到幻灭的人产生了共鸣，承诺恢复强有力的领导，拒绝多元文化主义。贝内代蒂的言语间充斥着激烈的民族主义、对自由民主的蔑视，并呼吁那些与他有共同愿景的法国人团结起来。\n\n作为巩固权力的手段，贝内代蒂的领导风格体现在建立一个中央集权的独裁政权的雄心上，这与早期意大利法西斯主义如出一辙。他试图拆除现有的政治结构，取而代之一种新秩序，强调对国家的忠诚，并严格遵守他对法兰西认同的愿景。贝内代蒂在国家分裂之时，把自己塑造成一个对民族自豪感毫不妥协的捍卫者，准备夺权，重新定义法国的未来。"
 POLITICS_COQUEREL_DESC:0 "埃里克·科克雷尔是一位著名的左翼人物，以其对社会正义和经济平等的坚定捍卫而著称。他出生于1974年，政治氛围浓厚的家庭背景促使他终身致力于左翼事业。科克雷尔拥有经济学与政治学的学术背景，并已从事激进主义活动数十年，期间始终关注工人权益、环境正义及反对紧缩政策等核心议题。\n\n作为国民议会议员，科克雷尔因其慷慨激昂的演讲和对选民的无私奉献而广受赞誉。他坚信草根运动和集体行动能够推动社会发生有意义的变革。科克雷尔对法国的愿景涵盖了促进社会公平、追求可持续发展及复兴公共服务等方面。他积极动员左翼力量，团结各方力量，共同为构建一个每个人都能享有平等机会和基本权利的法国而努力。"
 POLITICS_EMMANUEL_MACRON_DESC:0 "埃马纽埃尔·让-米歇尔·弗雷德里克·马克龙，前投资银行家、部长，现法兰西第五共和国总统。即使出生在一个不信仰宗教的家庭，年轻时马克龙就要求受洗，并加入了天主教会。但是日后他宣称自己是一个不可知论者，并且还在他祖母的影响下接纳了左倾的意识形态。他最早在巴黎高等师范学院学习哲学与经济，之后在法国国家行政学院就读。完成学业后，他作为一名投资银行家为罗斯柴尔德银行工作，并在他代理的一笔数目高达九十亿美元的交易中挣得了他的第一个一百万美元。2012年，他被任命为法国经济、产业更新和信息技术部长。2016年，他辞去了这项职务以参加总统竞选。\n\n作为一个总统，马克龙力图推行经济改革计划，具体措施包括减少公共开支与放宽劳工市场限制。广泛的民众抗议，包括于2018年下半年爆发的针对增加燃油税提案的“黄马甲”运动，已然成为了他任期上的污点。马克龙将法国对阿尔及利亚的殖民称为“对全人类犯下的罪过”，并称对利比亚的干涉是“历史性的错误”。即便如此，法国仍然在暗处对西非那些弱小的国家施加影响，没人确切知道马克龙为了维护法国利益能走到哪一步。在重重挑战之下，马克龙仍然是国际舞台上的重要人物，并在对抗气候变化，保障国际安全和促进欧洲国家团结等诸多议题上呼吁国际合作。"
 POLITICS_ERIC_ZEMMOUR_DESC:0 "埃里克·泽穆尔，既法兰西第五共和国新任总统，其身份远非单一专家所能概括，他更是一位勇于破冰、直言无畏的思想家。自幼成长于巴黎多元文化交融的社区，泽穆尔亲眼目睹并深刻体验了移民与多样性带来的复杂与紧张，这些经历深刻塑造了他的世界观，并激发了他对法兰西民族身份与文化传统的深厚情感与自豪。泽穆尔接受过法律和政治科学教育，而他作为记者与作家的职业生涯，更是以敢于触碰禁忌、挑战传统叙事而著称。他坚定不移地捍卫法国的核心价值观与传统，这一立场虽使他成为争议焦点，却也赢得了那些在主流政治中感到边缘化或忽视的群体的深切共鸣与坚定支持。\n\n作为领导者，泽穆尔坚信保护法国文化遗产和民族身份的重要性。在他的总统任期内，他将致力于保护法国的主权尊严，加强边境管控，恢复法国社区的法治与秩序。"
 POLITICS_FRANCOIS_RUFFIN_DESC:0 "弗朗索瓦·鲁芬是一位极具影响力的记者、电影制作人和政治活动家，以其草根政治路线和对社会正义的坚定承诺而闻名。鲁芬成长于一个普通的家庭，他对工人阶级的挣扎有着强烈的同理心，这在他日后成为弱势群体代言人的工作中得到了体现。他因其纪录片揭露社会问题而获得认可，这些纪录片捕捉了当代法国普通公民面临的现实。\n\n作为总统，鲁芬体现了人民的声音，他优先考虑与选民直接接触和社区组织。他充满激情的演讲和对抗性的风格挑战了政治建制派，敦促进行改革以解决收入不平等、工人权利和环境问题。鲁芬对法国的愿景是，通过积极的公民参与复兴民主，使政策反映工人阶级的需求和愿望。他力求创建一个让每个公民都感到有能力要求变革并能在治理中拥有发言权的国家。"
 POLITICS_JADOT_DESC:0 "亚尼克·雅多是欧洲生态绿党的领袖人物，以其独特魅力引领该党，同时在法国环保运动中占据重要地位。他出生于1967年，自幼在崇尚自然与可持续发展的家庭环境中成长。他在政治学与国际关系的学术背景，不仅深化了其对环境问题的关切，也促使他在投身政坛前，积极参与多个非政府组织的环保工作。\n\n雅多的政治生涯始终以对气候变化的坚决抗争和对绿色政策的积极倡导为鲜明特征。他深刻认识到，生态危机不仅关乎环境，更涉及社会与经济层面，人们亟需采取紧急行动共同守护地球家园与脆弱群体。作为欧洲议会议员，他积极支持并推动雄心勃勃的气候立法，同时大力倡导欧洲绿色协议。雅多期望法国能在可持续性、能源转型和社会公平方面引领潮流，致力于实现一个地球健康、社会公正的愿景。"
 POLITICS_JEANLUC_MELENCHON_DESC:0 "让-吕克·梅朗雄，既法兰西第五共和国新任总统，不单单是一名政治家，也是一位积极主张社会变革和人权的斗士。在工人阶级家庭中长大的梅朗雄，从小就懂得了团结和社区的价值。他的成长经历让他对普通人的斗争产生了深切的同情，并决心为他们的权利而战。梅朗雄习得了哲学和经济学，对知识的好奇和对社会正义的承诺带他走上了政治生涯。作为一名前教师和活动家，他明白教育和基层组织有着实现重大变革的力量。\n\n梅朗雄作为一名领袖，以充满激情的言辞和不容妥协的原则而闻名。他的任期将会聚焦于建立一个更公平公正的社会，让财富和权力更均匀地分配，每个人都有机会茁壮成长。"
 POLITICS_MARINE_LEPEN_DESC:0 "玛丽娜·勒庞，既法兰西第五共和国新任总统，不仅仅是一名政治家，更是一位深深植根于法国社会血脉中的女性领袖，兼具母亲与家族传承者的双重身份。她自幼在政治氛围中成长，亲眼见证了父亲让-马里·勒庞领导国民阵线党时的奋斗历程与辉煌成就。尽管理念各异，玛丽娜始终铭记家族的重托，立志在法国政治舞台上书写属于自己的辉煌篇章。她毕业于巴黎第二大学法律系，早期律师生涯不仅锤炼了她的专业素养，更让她深刻体会到了民间疾苦与社会不公。这段经历如同火种，点燃了她对正义的无限热情，以及对捍卫法国人民权益的坚定信念。\n\n作为一位母亲，勒庞深知安全与稳定对于法国万千家庭的重要性。她的执政理念便是致力于为下一代打造一个更加安全、繁荣的未来，一个能够抵御全球化浪潮冲击、抵御文化侵蚀侵蚀的避风港。"
 POLITICS_OLIVIER_FAURE_DESC:0 "奥利维尔·富尔是法国政坛上的杰出人物，现任社会党的书记。他出生于一个政治参与度很高的家庭，在社会正义和进步价值观的讨论中成长。他的学术生涯始于巴黎政治学院，在那里他磨练了对政治理论和社会问题的理解。富尔的政治生涯始于顾问，并迅速发展成为领导角色，这反映了他对社会主义理想的坚定承诺。\n\n作为社会党书记，富尔主张法国应优先考虑社会公平、环境可持续性和经济正义。他相信集体行动的力量，并致力于团结左翼，在共同的旗帜下应对国家面临的紧迫挑战。他的务实方法寻求在理想主义和可实现的政策目标之间取得平衡，努力重新联系失去权利的选民，同时推动有利于工人阶级的改革。富尔的愿景是团结一致，让边缘化群体的声音得到放大，并将法国大革命的理想——自由、平等、博爱——赋予生命。"
 POLITICS_PECRESSE_DESC:0 "瓦莱丽·佩克雷斯是一位经验丰富的政治家，共和党领袖，以务实的执政风格和对经济改革的重视而闻名。她成长于一个政治氛围浓厚的家庭，自幼便对公共服务抱有浓厚兴趣。她曾在久负盛名的巴黎政治学院学习，后来又在法国国家行政学院获得学位，为她日后的政治生涯奠定了坚实基础。\n\n作为前高等教育与研究部部长，佩克雷斯致力于教育改革和创新。她坚持财政责任、维护公共安全，并强调强化国家认同的重要性。对于法国的未来，她抱有振兴经济、缓解失业状况以及维护全球竞争力的愿景。佩克雷斯试图以现代保守主义为旗帜，团结中右翼力量，推动实现社会福利与经济增长的平衡，同时兼顾多元化选民的需求。"
 POLITICS_PIERRE_DEVILLIERS_DESC:0 "皮埃尔·德维利耶，既法兰西第五共和国新任总统，其已不只局限于军事领袖，更是一位以高尚品德、正直无私和深厚国家责任感著称的杰出人物。出身于军人世家的他自幼沐浴在纪律与奉献的光辉之下，深受其父——一位功勋显赫将军的熏陶，心中根植了对国家的深情厚爱及捍卫其利益的坚定信念。德维利耶在军事战略与领导力方面有着深厚造诣，他因此在军旅生涯中屡创佳绩，足迹遍布全球那些考验意志与勇气的极端地带。战场上的磨砺，不仅铸就了他坚韧不拔的意志，更让他对地缘政治的微妙格局与现代战争的复杂面貌有了深刻而独到的见解。\n\n作为领导者，德维利耶展现出了非凡的谦逊与开放心态，乐于倾听专家与顾问的见解。在他的总统任期内，团结与合作将成为推动国家前行的核心动力；他将致力于巩固法国作为全球领袖及民主与人权捍卫者的地位，无论是在国内还是国际。"
 POLITICS_ROUSSEL_DESC:0 "法比安·鲁塞尔是法国共产党的杰出代表，其内战结束后迅速崭露头角，成为重要的领导人。他出身工人家庭，自小便对工人权益和社会正义抱有深厚情感。他的政治生涯始于地方议员，因积极为劳工发声、推动社区赋权而迅速赢得认可。\n\n内战结束后，鲁塞尔成为左翼的中流砥柱，致力于弥合社会裂痕，为弱势群体争取权益。他展现了工人阶级的坚韧精神，倡导以经济公平、环境可持续性和强化社会服务为核心的新社会主义愿景。凭借激情洋溢的演讲和卓越的草根组织能力，鲁塞尔赢得了众多渴望更加公正平等法国的民众的支持。\n\n在领导风格上，鲁塞尔强调合作与团结，致力于联合左翼各派别共同挑战现状。面对法国冲突后的挑战，他憧憬着一个通过集体行动实现变革的未来，构建一个每个公民都能繁荣发展的、自由、平等、博爱的理想社会。"
 POLITICS_nicolas_mayer_rossignol_DESC:0 "梅耶-罗西尼奥尔先生本是鲁昂市一位普普通通的亲欧盟联邦派市长，却出人意料地赢得提名，成为新独立诺曼底共和国的领导人。\n\n被推上自己并不受用的权力宝座后，梅耶-罗西尼奥尔可谓是绞尽脑汁、无所不用其极地从最高职位内部搞破坏，企图给诺曼底的独立大业使绊子。"
