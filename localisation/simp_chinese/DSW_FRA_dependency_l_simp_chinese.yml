 FRA_Civilian_Oil_Rations:0 "民用石油配给"
 FRA_Civilian_Oil_Rations_desc:0 "尽管法国成功应对了沙特阿拉伯内战所带来的短期冲击，但如今已愈发清晰，我们面临的时间紧迫性愈发严峻。政府已正式宣布实施全国强制性民用石油配给制度，这一举措类似于七十年代美国在OPEC石油禁运与伊朗革命期间采取的应对政策。通过这一配给措施，我们将竭力维护民众对石油资源的基本需求，并确保有限供应下的价格维持在合理范围之内。"
