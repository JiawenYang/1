 FAF_shield_decision:0 "紧握坚盾"
 FAF_showcase_superiority_decision:0 "展示法国霸权"
 FAF_showcase_superiority_decision_desc:0 "我们的卓越毋庸置疑。无论是我们的思想、我们的生活方式、我们的历史，还是我们的人民……一切都如同精酿的佳酒般被淬炼至极致的完美。然而，令人遗憾的是，这个世界却一次又一次忽视了我们那显而易见的卓然超群！"
 FAF_silence_german_critics_decision:0 "禁止批评盟国"
 FAF_silence_german_critics_decision_desc:0 "那些批评我们欧洲盟友的愚蠢之徒，根本不懂战略规划。他们目光短浅，缺乏远见，令人震惊的是，竟仍有如此多人无法理解“敌人的敌人便是朋友”这一基本原则。如今，与我们对立的势力，与东方的布尔什维克威胁相比，不过是微不足道的小患。我们当然不会对盟友全然信任，但现实必须凌驾于意识形态之上。"
 FAF_solidarite_latine_idea:0 "团结拉丁"
 FAF_solidarite_latine_idea_desc:0 "拉丁民族理应成为翱翔欧陆的霸权，以统一战线的姿态奋战，作为我们历史与文化的丰碑傲立世间。拉丁世界的敌人遍布四方，不仅数量庞大且意志如铁。然而正如所述，这些不过是妄图摧毁文明高墙的野蛮之徒，我们，罗马的后裔们必须用鲜血与土地与之殊死搏斗。"
 FAF_stabilize_the_republic_decision:0 "稳定共和国"
 FAF_stabilize_the_republic_decision_desc:0 ""
 FAF_strengthen_europeanism_decision:0 "加强泛欧洲主义"
