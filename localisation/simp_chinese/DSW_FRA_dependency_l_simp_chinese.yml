 FRA_Dirigisme_Tech_idea:0 "统制经济"
 FRA_Dirigisme_Tech_idea_desc:0 "干预主义的思想自始至终在法国的经济体系中扮演着重要角色。未来十年，通过增加债券发行，我们将竭尽一切必要手段，确保法国的经济在世界不稳定局势日益加剧的背景下依然蓬勃发展。这场对干预主义经济体系的国家复兴，旨在让法国的经济运行更加高效，同时着力纠正过去经济体系中的诸多不足，这些不足曾多方面阻碍了法兰西民族的进步与辉煌。"
 FRA_Dirigisme_idea:0 "统制经济"
 FRA_Dirigisme_idea_desc:0 "干预主义的思想自始至终在法国的经济体系中扮演着重要角色。未来十年，通过增加债券发行，我们将竭尽一切必要手段，确保法国的经济在世界不稳定局势日益加剧的背景下依然蓬勃发展。这场对干预主义经济体系的国家复兴，旨在让法国的经济运行更加高效，同时着力纠正过去经济体系中的诸多不足，这些不足曾多方面阻碍了法兰西民族的进步与辉煌。"
 FRA_Disloyal_Military_Zemmour_idea:0 "军队不忠"
 FRA_Disloyal_Military_Zemmour_idea_desc:0 "尽管我们已尽最大努力，我们与政府的关系仍然不尽如人意。军方已被逐渐边缘化，如今许多军中人士都对政府充满敌意。在泽穆尔的领导下，即使发生对民主制度的彻底政变，这届政府仍将继续维持其统治。"
 FRA_Disloyal_Military_idea:0 "军队不忠"
 FRA_Disloyal_Military_idea_desc:0 "尽管我们已尽最大努力，但我们与法国武装部队的关系依然不尽人意。由于政策问题、缺乏有效沟通以及外交政策现状等多重原因，导致许多军方人士对政府深感不满。如果我们不能及时纠正这些问题，必须做好面对哗变及将军们密谋反对政府的准备。这些利益冲突还引发了更深层次的担忧——一场政变或许已经迫在眉睫，这可能会永远改变法国历史的进程。"
