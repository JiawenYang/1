 FAF_propaganda_campaign_in_Romania_decision:0 "宣传[ROM.GetFlag]§Y罗马尼亚拉丁理论§!"
 FAF_propaganda_campaign_in_Romania_decision_desc:0 "谈及罗马遗产，人们或许不会首先想到罗马尼亚人，然而事实却是，他们与我们法兰西人一样，皆承袭着正统的罗马血脉。罗马尼亚语源自通俗拉丁语，他们的民族亦承载着辉煌的罗马血统。然而，因地缘之故，他们难免受斯拉夫病毒侵染，冲淡了昔日赋予其伟大与强盛的特质。尽管如此，流淌于罗马尼亚人脉中的血统未变——他们只需被唤醒，重忆根源。"
