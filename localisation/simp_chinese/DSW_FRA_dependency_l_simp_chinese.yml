 FRA_christophe_castaner_IM_desc:0 "克里斯托夫·卡斯塔内，生于1966年1月3日，法国政治家，曾多次出任部长职务。作为共和国前进党成员及埃马纽埃尔·马克龙总统的亲密战友，他于2018至2020年间担任内政部长，主管国内安全与执法。在此之前，他曾是爱德华·菲利普总理麾下的政府发言人。卡斯塔内以务实高效的治理手段及推动法国警队现代化而广受赞誉，同时，他也积极参与反恐行动与公共秩序的相关工作。"
