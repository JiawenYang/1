 FAF_reorganize_the_LVF_decision_desc:0 "忠诚志愿军团的名声时常被那些无法理解其含义之人所玷污。正是赤匪和自由派导致了我国衰落，这就是为什么这个国家需要更多像忠诚志愿军团这样的组织来清除国内的污秽，根除其顽疾。"
