 FRA_Philippe_Olivier_HM:0 "菲利普·奥利维耶"
 FRA_Philippe_Olivier_desc:0 "菲利普·奥利维耶，生于1957年12月2日，法国政治家，保守派政党国民联盟成员。他以保守主义和民族主义观点著称，主张实行更严格的移民政策、加强边境管控和保护法国文化特色。奥利维耶一直参与上法兰西大区的地方政治，并代表国民联盟参加各地区和大区选举。他还是国民联盟领导人玛丽娜·勒庞的前妹夫。"
 FRA_Philippe_Susnjara:0 "菲利普·舒什尼亚拉"
 FRA_Philippe_Susnjara_desc:0 "菲利普·舒什尼亚拉是法军中的一位低阶军官，有着国防安全和情报领域的专业知识。"
 FRA_Philippe_de_Villiers_HM:0 "菲利普·德维利耶"
 FRA_Philippe_de_Villiers_HM_desc:0 "菲利普·德维利耶，生于1949年3月25日，法国政治家、作家、前欧洲议会议员。他是右翼疑欧政党法兰西运动的创始人，在过去几十年来一直是法国政坛的杰出人物。德·维利耶以保守观点、主张法国主权、批评全球化和欧盟而闻名。他还参与了文化活动，包括创建杜弗山历史主题公园。德·维利耶的政治生涯以他维护法国身份和传统的坚定立场为标志。他也是§C皮埃尔·德·维利耶§!的哥哥。"
 FRA_Pied_Noir_party:0 "黑脚国"
 FRA_Pierre_Gattaz_EM:0 "皮埃尔·加塔"
 FRA_Pierre_Gattaz_EM_desc:0 "皮埃尔·加塔，生于1959年3月18日，法国企业家，曾于2013年至2018年担任法国企业运动联盟主席。在此期间，他代表法国雇主利益，积极倡导对企业有利的政策。加塔出身于工业世家，职业生涯丰富多彩，涉足多个商业领域。他因积极推动经济改革而声名远扬，这些改革包括劳动力市场改革及提升竞争力的各项措施。加塔在法国商界颇具影响力，并经常参与经济政策与工业战略的讨论。"
