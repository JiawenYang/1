 FRA_lockdown:0 "全国封城"
 FRA_lockdown_desc:0 "面对COVID-19疫情在国内的迅猛蔓延，我们果断采取了全国范围内的封锁措施，以遏制感染率的进一步攀升。这些措施虽初显成效，但也为民众带来了前所未有的压力——他们被迫留守家中，保持社交距离，严格遵守佩戴口罩与频繁消毒的公共卫生指南。然而，这些限制也使得许多民众失去了工作机会，经济与心理上的双重负担逐渐累积。若我们无法尽快推动国家的重新开放，不满的情绪或将如火山般爆发，难以遏制。"
