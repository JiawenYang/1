 FRA_gerald_darmanin_IM_desc:0 "热拉尔德·达尔马宁，生于1982年10月11日，法国政治家，曾多次出任部长职务。他是共和党成员，同时也是埃马纽埃尔·马克龙总统的亲密战友。达尔马宁自2020年起担任内政部长，负责国内安全和执法行动。此前他曾于2017至2020年担任行动和公共账目部部长职务。达尔马宁以其保守理念和对移民的强硬立场而著称。他一直是马克龙政府的关键人物，参与了法国警队改革，并努力应对安全挑战。"
