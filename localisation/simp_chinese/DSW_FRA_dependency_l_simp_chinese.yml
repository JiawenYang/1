 FRA_Recall_our_Generals_decision_desc:0 ""
 FRA_Recognize_APLA_decision:0 "[APA.GetFlag]§R美国人民解放军§!：承认§R美国人民解放军§!"
 FRA_Recognize_APLA_decision_desc:0 ""
 FRA_Recognize_Association_of_the_Freed_decision:0 "[GMA.GetFlag]§G解放者协会§!：承认§G解放者协会§!合法性"
 FRA_Recognize_Association_of_the_Freed_decision_desc:0 "美国的旧秩序不可避免地被二次内战打了个粉碎，但在战火淬炼中，一些小众派系业已崭露头角。其中一个名为“解放者协会”的组织震撼了外国观察者，他们也在寻求更多的国际支持。因此，当下符合我们最大利益的举动莫过于承认解放者协会为美国合法政府，助力其进行第二次美国革命！"
 FRA_Recognize_Biden_decision:0 "[USB.GetFlag]§C美利坚联邦§!：承认§C美利坚联邦§!"
 FRA_Recognize_Biden_decision_desc:0 "美国的内战依然烽火连天，而我们面临的抉择是：究竟该承认哪一方为这片战火焦土上的合法政府。鉴于我们渴望恢复由美国作为北约成员国所带来的安全与稳定，承认联邦政府并支持其恢复国家正常运转的努力，无疑是符合我们长远利益的最佳选择。"
 FRA_Recognize_Constitutionalists_decision:0 "[USC.GetFlag]§C美利坚宪政政府§!：承认§C美利坚宪政政府§!"
 FRA_Recognize_Constitutionalists_decision_desc:0 "在美国内战的硝烟中，我们迄今为止一直采取中立的立场，因在欧洲内部，我们面临着更为紧迫的挑战。如今，随着我们重新将目光投向国际舞台，承认特朗普的“宪政派”为美国的合法政府，无疑是巩固我们长久盟友关系的最佳途径。这一选择，将确保跨大西洋合作的延续与稳定。"
 FRA_Recognize_GMAC_decision:0 "[GMA.GetFlag]§G绿山无政府主义集体§!：承认§G绿山无政府主义集体§!合法性"
 FRA_Recognize_GMAC_decision_desc:0 "美国局势每况日下，二次内战席卷全国，我们却仍未寻得一个可供认可支持的派别。绿山无政府主义集体的所谓“政府”的确称得上另类，但它已经证明了，哪怕是在无政府主义的无国家状态下，它也愿意建设一个更好的美国。倘若我们支持他们统一美国，我们兴许能在将至的地缘政治风暴中赢得一位独一无二的盟友。"
 FRA_Recognize_Patriot_Front_decision:0 "[PTF.GetFlag]§2爱国者阵线§!：承认§2爱国者阵线§!"
 FRA_Recognize_Patriot_Front_decision_desc:0 "美国内战为其政治版图带来了翻天覆地的变化，极右翼“爱国者阵线”的崛起尤为引人注目。尽管我们在原则上难以认同他们的许多政策，但为了挽回与这位昔日盟友的联系，在局势尚未完全失控之前，我们不得不选择承认并支持他们的政府，以期为未来的合作留存一线希望。"
 FRA_Recognize_SoL_decision:0 "[FAA.GetFlag]§G自由美利坚共和邦联§!：承认§Y自由美利坚共和邦联§!合法性"
 FRA_Recognize_SoL_decision_desc:0 "我们虽碍于国内局势无力干预第二次美国内战，但仍有借机扩大影响力的余力，我们也应当择一派系承认其为美国的合法政府。自由美利坚共和邦联在新英格兰地区的迅猛崛起让我们有了一个可供支持的明确选项。正如我们在1776年所做的一般，我们应当宣布自由美利坚共和邦联及其发起的第二次美国革命！"
 FRA_Recognize_the_Constitutionalists_zemmour:0 "[USC.GetFlag]§C美利坚宪政政府§!：承认§C美利坚宪政政府§!合法性"
