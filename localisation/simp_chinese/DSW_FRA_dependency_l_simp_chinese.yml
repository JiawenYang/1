 FRA_Nicolas_Dupont_Aignan_HM:0 "尼古拉·杜邦-艾尼昂"
 FRA_Nicolas_Dupont_Aignan_HM_desc:0 "尼古拉·杜邦-艾尼昂，生于1961年3月7日，法国政治家与法国崛起的创始人。其作为法国政界的著名人物，主张国家主权、经济爱国主义和传统保守价值观。杜邦-艾尼昂于1997年至2012年担任国民议会议员，并多次竞选法国总统。他以批评欧盟和呼吁法国重新控制其边界和经济而闻名。杜邦-艾尼昂的政治立场经常与民族主义和欧洲怀疑论者的观点一致，这使他在法国政治舞台上发出了重要的声音。"
