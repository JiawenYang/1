 FAF_european_nation_idea:0 "欧洲霸权"
 FAF_european_nation_join_tt:0 "我们会获得国家精神§C欧洲霸权§!。"
 FAF_europeanism_idea:0 "欧洲主义"
 FAF_europeanism_idea_desc:0 "分裂的欧洲无力抗衡全球性强国，欧洲主义主张欧洲在保持各国民族特性与区域文化多样性的同时，实现团结统一。组建联合武装部队，得以精简原本繁杂的武器装备体系。以通用语言为纽带，在超五亿人口的大陆上实施跨域兵员征募。"
 FAF_europeanist_propaganda_idea:0 "泛欧宣传"
 FAF_europeanist_propaganda_idea_desc:0 "泛欧洲主义的宣传如疾风骤雨般席卷各大媒体，这一切显然是欧洲霸权精心策划的一场攻势，旨在推动统一进程。无论我们如何应对，内心却隐隐生出一种不安的预感——或许我们终究难以抗衡本土认同主义运动，被迫提前举行公投。若我们想要守护自身的独立，唯有立刻采取行动，遏制这场舆论攻势。"
 FAF_europes_last_democracy_decision:0 "欧洲民主孑遗"
 FAF_europes_last_democracy_decision_desc:0 ""
 FAF_failures_of_AH_dummy:0 "多语归一"
 FAF_family_f_decision:0 "家庭！"
 FAF_family_f_decision_desc:0 "家庭高于一切，是世间最神圣的存在。只有坚持传统的家庭价值观，法国才能恢复其人口。战争几乎摧毁了整整一代人，如果我们不重振民族的生命力，就注定会腐朽崩溃。"
 FAF_family_v_decision:0 "家庭！"
 FAF_family_v_decision_desc:0 "多少家庭因这场战争而支离破碎，多少挚爱之人被无情撕裂，多少生命在硝烟中化作尘埃？这是一场正义之战，我们的敌人贪婪而嗜血，他们的野心只有一个——毁灭我们的祖国，践踏我们祖辈血汗铸就的欧洲家园。但从今往后，我们将誓死守护我们的土地，我们的亲人，我们的兄弟。这一切，将不再被践踏。"
 FAF_fascist_party:0 "法国民族主义党"
 FAF_fascist_party_long:0 "法国民族主义党(Parti Nationaliste Francais)"
 FAF_fatherland_f_decision:0 "祖国！"
 FAF_fatherland_f_decision_desc:0 "祖国即是团结我国人民、使我族不可分割的强大力量。没有祖国，人民将一无所有；没有人民，祖国也将不复存在。两者是一种共生关系。如果我们的人民忘记了他们的祖国，那么曾经作为一个大家庭的国家将永远分崩离析，最终为外国势力所占。"
 FAF_fatherland_v_decision:0 "祖国！"
 FAF_fatherland_v_decision_desc:0 "是什么，让我们的人民奋起而战？仅仅是为了自己？不。他们为共同的事业而战，为共同的信仰而战，为共同的目标而战——守护并捍卫他们最珍视的一切。他们的家园，他们的土地，他们的兄弟。"
 FAF_fortify_the_nation_decision:0 "团结国内"
 FAF_fortify_the_nation_decision_desc:0 ""
 FAF_fountain_of_life_dummy:0 "法式军国主义"
 FAF_fountain_of_life_dummy_desc:0 ""
 FAF_french_state_dummy:0 "法式军国主义"
 FAF_french_state_dummy_desc:0 ""
 FAF_french_superiority_decision:0 "法国霸权"
 FAF_french_superiority_decision_desc:0 "法国文化，自古以来便是世界之巅，或许无人能出其右。法国人的才华与创造力，让我们的国家屹立于世界舞台之上。从古至今，法国始终是艺术、科技与文学的中心，无人能否认这一事实。这一切，都进一步证明了我们在文化、智慧与精神上的天然优越性，无论是面对欧洲同胞，还是更遥远的文明。"
 FAF_french_terrorist_attacks_idea:0 "法兰西野兽"
 FAF_french_terrorist_attacks_idea_desc:0 ""
 FAF_full_employment_idea:0 "充分就业"
 FAF_full_employment_idea_desc:0 "经过多年的尝试与调整，我们终于在全国范围内实现了“全民就业”。如今，大多数公民都从事着能确保高生活水平的职业，并因此全心投入国家与经济建设。当然，这也带来了一些问题，例如征兵人力的短缺，以及企业因无法继续利用廉价外劳而发出的抱怨。然而，对于我们的公民而言，尤其是对于我们的宣传而言，这一全民就业的成就绝非微不足道！"
 FAF_fund_identitarian_terror_in_ROM_decision:0 "资助[ROM.GetFlag]§Y罗马尼亚§!的恐怖活动"
 FAF_fund_identitarian_terror_in_ROM_decision_desc:0 "我们的罗马尼亚兄弟，再次被俄罗斯帝国主义的阴影笼罩。那些俄国妖言在他们耳畔回响，巧妙操控人心，将虚妄的斯拉夫血统植入他们的记忆深处，让他们误以为自身归属于那片寒冷的土地。但希望尚存，罗马尼亚的土地上，依旧燃烧着不灭的拉丁之魂。他们深知自己的真正血脉，认同欧洲文明的怀抱，而非那虚幻的斯拉夫幻想。我们必须助他们传播真理，让正义的声音响彻山河。终有一日，他们将挣脱枷锁，重归拉丁世界的怀抱，洗净被欺瞒的岁月。"
 FAF_glorify_collaborationism_decision:0 "颂扬合作主义"
 FAF_glorify_collaborationism_decision_desc:0 "合作者常被称为叛徒、老鼠和走狗。但当一个人致力于清除正在慢慢摧毁自己国家的毒瘤时，又怎能被称为叛徒呢？二战期间我们的人民与德国人合作并非是在削弱国家，而是为了铲除布尔什维克的威胁。这样的人绝非老鼠或叛徒，而是治愈者和守护者。"
 FAF_god_on_our_side_decision:0 "上帝与我们同在"
 FAF_grande_armee_dynamic:0 "新式大军团"
 FAF_growing_republican_army_corps_mission:0 "永恒之火"
 FAF_growing_republican_army_corps_mission_desc:0 "\n\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\n\n\n历史的阴影再度浮现，我军中竟存在一个共和派集团。他们不仅妄图撼动君主的宝座，还胆敢侵犯教会的神圣权威，但我们绝不会让1793年的悲剧再度重演。"
 FAF_hail_to_chief_dummy:0 "法式军国主义"
 FAF_hail_to_chief_dummy_desc:0 ""
 FAF_hail_to_the_chief_decision:0 "领袖万岁！"
 FAF_hail_to_the_chief_decision_desc:0 "稳定与成功的基石，莫过于清晰的领导与严密的组织。从军队的辉煌征战，到企业的高效运作，甚至黑暗中的权力游戏，皆依赖于此。如今，我们已从席卷法国的混乱中胜利归来，但国家的重建需要围绕一个核心人物展开——一位政治强人，能够团结人民，将他们凝聚在共同的事业之下。"
 FAF_healing_the_land_decision:0 "治愈大地"
 FAF_healing_the_land_decision_desc:0 ""
 FAF_heir_of_degaulle_decision:0 "接纳戴高乐主义思想"
 FAF_heir_of_degaulle_decision_desc:0 "戴高乐，一个无需赘述的名字。他是无畏的斗士，是坚定的国家栋梁，从未背叛法兰西与她的人民。当德国铁骑踏碎国境，民族意志在压迫中颤抖，人民在奴役下呻吟，多少政客与将军选择了屈膝、投降，而戴高乐却没有！他宁愿倒在枪林弹雨中，也绝不跪倒在敌人的阴影下！然而，他不仅是坚韧的战士，更是公正而睿智的领导者。他经由民主选举掌权，尊重人民的选择，以坚定的意志捍卫共和国的精神。唯有让法兰西的人民铭记并承继戴高乐的勇气与信念，我们才能引领这片土地走向真正的复兴。"
 FAF_heir_of_petain_decision:0 "接纳贝当主义思想"
 FAF_heir_of_petain_decision_desc:0 "在法兰西的历史长河中，未曾有比贝当更具争议的人物。有人斥责他为叛徒，有人则认为他的一切抉择，皆是出于对法兰西的守护。但无论如何，无人能否认，他曾是——并依旧是——我们民族的英雄。他留下的印记不仅在凡尔登，也在维希，但他所做的一切，并非为了一己之荣，而是为了法国的安全，为了人民的存续。无论人们如何评价他的作为，他都是一个意志坚定的人，一个深爱祖国与人民的人，一个为抵御毒害法国的红色毒瘤而倾尽全力的人。我们必须向人民传授这位历史伟人的真实面貌。他们应当学会珍视我们的传统文化与价值观，并时刻警惕布尔什维克的威胁。"
 FAF_historical_idols_idea:0 "历史神像"
 FAF_historical_idols_idea_desc:0 "法国从不缺乏历史巨人。从查理曼到拿破仑，我们这片肥沃的土地孕育了人类历史上一些最伟大的人物。在一片黑暗中，正是他们给我们带来了一线希望。他们体现了一个完美的法国——一个强大的法国——一个曾经统治欧洲并将影响力扩展到全球的法国。也许我们输掉了这场战争，但在新的法国伟人取代了那些使国家走向衰败的腐败政客之后，法国将再次绽放光彩。他们将开创法国新的黄金时代。"
 FAF_hold_military_parade_decision:0 "展示实力"
 FAF_hold_military_parade_decision_desc:0 "法国在俄欧战争中的彻底溃败，不仅造成了物质与精神的双重摧残，更使民族心理深陷挫败与创伤的泥沼，导致民众厌战怯战情绪弥漫。我们必须通过重振民心让法国人民坚信：法兰西仍为不容小觑的强国，既不畏惧任何敌手，更必将毫不犹豫捍卫子民。"
 FAF_honest_french_middle_class_decision:0 "诚实的人民"
 FAF_honest_french_middle_class_decision_desc:0 "法国人民是上帝造物的完美典范。他们诚实、纯洁且智慧，正是这些品质使我国繁荣昌盛。法兰西从未渴望统治他人，而只是希望传播我们的理想与文化。"
 FAF_imperial_army_idea:0 "帝国军"
 FAF_imperial_army_idea_desc:0 ""
 FAF_implant_domestic_terrorists_decision:0 "植入国内恐怖分子"
 FAF_implant_domestic_terrorists_decision_desc:0 ""
 FAF_implement_policy_in_new_states_decision:0 "传播绿色理念"
 FAF_implement_policy_in_new_states_decision_desc:0 "昔日，雅典娜的圣林郁郁葱葱，奥林匹斯山巅白\n雪皑皑。而今日的欧罗巴大地却笼罩在工业的阴霾之下，古老的森林在机器轰鸣中日渐凋零，清澈的河流在污染中逐渐浑浊。这片孕育了西方文明的土地，正在现代工业的狂飙中丧失其神圣的面貌。欧罗巴的存续，不在于钢铁林立的城市，而在于她与大自然的和谐共生。唯有重拾对自然的敬意，我们才能真正证明自己是古老文明的守护者。这是我们的使命，也是欧罗巴永续的希望。"
 FAF_implement_transparent_public_procurement_decision:0 "实行公共财政透明化"
 FAF_implement_transparent_public_procurement_decision_desc:0 ""
 FAF_improve_gallarum_decision:0 "重建§G高卢§!"
 FAF_improve_gallarum_decision_desc:0 "高卢，即世人皆称的法兰西北境，曾是我国最繁荣的疆土。然而，内战的烈焰并未对它网开一面，东线战事中，俄军的炮火曾无情地撕裂这片大地，而战乱之中，肆虐的自由派与共产主义者更如豺狼般啃食着它最后的血肉，使它陷入一片废墟与绝望。如今，我们终于有足够的资源来复兴这片焦土，应当刻不容缓地展开全面重建。若让高卢继续沉沦，不仅我们的工业能力将难以支撑欧洲的伟业，那些伺机而动的颠覆者也必将利用民众的苦难，趁势煽动叛乱，使国家陷入更深的动荡。"
 FAF_improve_hispanarium_decision:0 "重建§Y日斯巴尼亚§!"
 FAF_improve_hispanarium_decision_desc:0 "与比利牛斯山南侧的兄弟重新统一，意味着我们也继承了他们第二次内战留下的创伤。相比法国和意大利的同胞，我们必须认识到，在西班牙的重建过程中，必须充分考虑各地区多元的文化认同，避免重蹈半岛战争时期的覆辙。尽管这将是一项艰巨的任务，但我们不会吝惜任何努力，因为每一位罗马的后裔都值得我们的全力以赴！"
 FAF_improve_italiae_decision:0 "重建§R意大利§!"
 FAF_improve_italiae_decision_desc:0 "曾几何时，意大利是欧洲跳动的心脏，是进步、启蒙与繁荣的灯塔，开启了黄金时代。然而，自西罗马帝国于五世纪覆灭以来，这片土地再未真正恢复昔日的辉煌。如今，重建这片半岛的使命落在我们肩上，我们必须摆脱衰朽的自由民主制度所带来的失败，让意大利再度攀登巅峰，恢弘至连奥古斯都都会为之惊叹。人们常说，罗马非一日建成，但若它的荣光依旧不灭，我们的努力必将获得足够的时间与专注，以延续这一伟大的遗产。"
 FAF_improve_viennensis_decision:0 "重建§O维埃纳§!"
 FAF_improve_viennensis_decision_desc:0 "维埃纳，即凯撒开启高卢文明的地方，更广为人知的名称是法兰西南部。然而，即便在内战撕裂我们的国家之前，这片土地早已深陷困境。相比于北方的繁荣，南方经济发展滞后，贫困问题长期困扰着当地，而这也使其成为激进分子滋生的温床，他们企图再次将国家拖入混乱。作为法兰西人民的守护者，我们肩负着重任，必须展开一场大规模的复兴运动，使维埃纳如凤凰涅槃般浴火重生！"
