 MACRON_LOSS_AI_BEHAVIOR_TXT:0 "§O马克龙§! - §R败选§!"
 MACRON_LOSS_AI_BEHAVIOR_TXT_DESC:0 "当完成“开场截击”国策后，系统将站在§O埃马纽埃尔·马克龙§!一边，并在与§P玛丽安·勒庞§!的角逐中输掉2022年大选。此后，§O马克龙§!退出政坛，将复兴党领导人一职交予§O斯特凡纳·塞茹尔内§!。\n\n\n\n\n\n\n\n   £GFX_FRA_marie_le_pen\n\n\n\n\n\n\n\n\n-------------------------------------"
