 FAF_legalize_paganism_decision:0 "鼓励异教信仰"
 FAF_legalize_paganism_decision_desc:0 "基督教非法兰西之原创，亦非欧洲之孕育。它如癌细胞般肆意扩散，速度之迅猛令人难以想象，竟将我们祖先世代相传的信仰驱逐殆尽。它令法兰西子民忘却真我，忘却根源，忘却传承！因此，我们必须重唤那真正属于法兰西的宗教，那些定义我们为高卢人而非“基督徒”的信仰。"
 FAF_less_than_human_law:0 "亚人"
 FAF_less_than_human_law_desc:0 ""
 FAF_liberal_crackdown:0 "镇压自由派"
 FAF_liberal_crackdown_desc:0 "为稳固新政权，我们必须严厉打击颠覆势力，尤其是前政权同情者及其腐朽自由民主制度支持者，他们对我们的一举一动都进行抗议，使国家陷入停滞。为防止任何形式的反革命活动，我们必须不择手段，彻底粉碎自由主义在法国的政治影响力，确保我们不再重蹈前共和国的覆辙。"
 FAF_man_of_god_decision:0 "神的代言人"
 FAF_man_of_god_decision_desc:0 "\n\n\n\n\n£GFX_FAF_man_of_god\n\n\n\n\n\n\n\n国王是虔诚、务实又仁慈的统治者。他的决策既遵上帝旨意，又随人民福祉而决断。尽管人非圣贤，但他始终对上帝的宽恕感激涕零，国民皆应如此。"
 FAF_managerial_bilingualism_decision:0 "双语化管理学"
 FAF_managerial_bilingualism_decision_desc:0 "当欧洲人民统一时，拉丁语可以作为一种通用语言存在，尽管各地可能有所差异，却能确保治理顺畅；这是我们复兴拉丁语的主要理由之一。鉴于此，我们需要确保承担官僚职责的管理阶层至少能使用母语和拉丁语两种语言。此外，如果我们自己不使用我们珍视的罗马祖先的语言，那岂不是自相矛盾？"
