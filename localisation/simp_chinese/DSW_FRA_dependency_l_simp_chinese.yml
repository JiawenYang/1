 FRA_Gerard_Longuet_IntelM:0 "热拉尔·隆盖"
 FRA_Gerard_Longuet_IntelM_desc:0 "热拉尔·隆盖，生于1946年2月24日，法国政治家，曾多次出任部长职务。他是共和党成员，自2011年起代表默兹省出任参议院议员。在2011至2012年间，他于尼古拉·萨尔科齐总统麾下担任国防与退伍军人事务部部长。隆盖以保守立场和在国防安全领域的深厚造诣著称，是法国政界的重要人物，长期致力于推动法国军事改革、应对安全挑战。"
 FRA_Gontard_Support_Sejourne_tt:0 "我们将得到冈塔德和绿党的帮助以共同对抗勒庞的极右阵营……"
 FRA_Guillaume_Peltier_EM:0 "纪尧姆·佩尔蒂埃"
 FRA_Guillaume_Peltier_EM_desc:0 "纪尧姆·佩尔蒂埃，生于1976年7月27日，法国政治家、共和党成员。他自2012年起，便代表卢瓦尔-谢尔省第二选区担任国民议会议员。佩尔蒂埃因其坚定的保守民族主义立场而著称，积极捍卫传统价值观与国家主权。他还是法国右翼政坛中备受瞩目的人物，参与了共和党的改革工作。此外，佩尔蒂埃也被视为党内极具潜力的未来领导者，他始终对埃马纽埃尔·马克龙总统政府持直言不讳的批评态度。"
