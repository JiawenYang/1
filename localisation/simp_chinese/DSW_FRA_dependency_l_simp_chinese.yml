 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT_DESC:0 "民主运动，这一中间派政党早在法国沦陷于苏维埃之前便已存在。它自诩为理性与稳健的选择，比起对手，它更倾向于中立、自由的政治立场。\n意识形态为§O基督教民主主义§!。\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Bayrou\n\n\n\n\n\n\n\n\n-------------------------------------"
