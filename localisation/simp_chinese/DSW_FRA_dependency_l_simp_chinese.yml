 FRA_Michele_Alliot_Marie_IntelM_desc:0 "米谢勒·阿利奥-马里，生于1946年9月10日，法国政治家，曾多次出任部长职务。她是共和党成员，自2002年起代表比利牛斯-大西洋省出任国民议会议员。在雅克·希拉克和尼古拉·萨尔科齐两位总统执政期间，阿利奥-马里历任国防、内政、司法及外交部长。她以保守立场和在安全国防领域的坚定态度著称，是法国政坛的重要人物，积极参与了法国外交政策的制定。"
