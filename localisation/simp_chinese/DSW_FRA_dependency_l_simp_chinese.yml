 FAF_naval_command_boost_tt:0 "法国海军最高指挥部将利用这些准备工作来§C模拟大规模的海军入侵行动§!"
 FAF_new_classicalism_decision:0 "新古典主义"
 FAF_new_classicalism_decision_desc:0 "我们对统一欧洲的梦想，源于罗马帝国的辉煌及其所倡导的文化。虽自那时起世事已大变，但古典主义在艺术与建筑中的理念，仍是我们应努力传承之志。通过复兴那些崇尚壮丽与美的艺术流派，摒弃许多人深病痛绝的单调现代主义风格，我们得以确立自身为欧洲艺术与文化黄金时代真正代表的地位！"
 FAF_nobility_cost_mission:0 "稳定的代价"
 FAF_nobility_cost_mission_desc:0 "\n\n\n\n\n£GFX_FAF_nobility\n\n\n\n\n\n\n\n贵族内部的争斗威胁着我们的政权，但贵族与任何国家的精英阶层一样，金钱可以让他们满足，而满足的精英阶层会带来一个稳定的国家。若有人称之为贪婪，那就随他们去吧。贵族是凭借古老且神圣的权利拥有土地的，我们若能尊重这些权利，他们也会尊重我们的权威。"
 FAF_nobility_taking_money_tt:0 "王国稳定的代价，就是§C贵族§!每3个月会从国家银行取走一大笔钱。"
 FAF_non_non_non_decision:0 "§R不！不！不！§!"
 FAF_non_non_non_decision_desc:0 "向和平主义说“不”！向自由主义说“不”！向共产主义说“不”！扫除表面污垢易，根除深层腐朽难。那些仍在毒害我国公民思想的污秽可不会自行消失；对此，我们必须引导人民走上正确的道路，防止他们误入歧途。"
