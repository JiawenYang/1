 FRA_Edouard_philippe_HM:0 "爱德华·菲利普"
 FRA_Edouard_philippe_HM_desc:0 "爱德华·菲利普，生于1970年11月28日，法国政治家和律师，于2017年5月15日至2020年7月3日在埃马纽埃尔·马克龙总统领导下担任法国总理。他在成为无党派人士之前一直是共和党成员。菲利普以其务实的治理方式和驾驭复杂政治格局的能力而闻名。在他任职期间，他面临着重大挑战，包括黄背心运动和COVID-19大流行。菲利普的领导风格通常被描述为冷静而节制，这为他赢得了整个政坛的尊重。"
