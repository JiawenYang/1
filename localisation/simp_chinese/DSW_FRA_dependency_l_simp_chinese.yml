 FAF_Create_Identity_Forums_desc:0 "古罗马的城市广场曾是智者辩论之所，学者们在此探讨科学、哲学与诸多思想。而法兰西，自古便是思想与智慧的殿堂，一片孕育伟大思想家的土地。因此，我们必须复兴我们的知识文化，重建属于新时代的论坛，使其成为新民族主义思想的交流圣地。"
 FAF_Cult_of_Benedetti:0 "崇拜贝内代蒂"
 FAF_Cult_of_Benedetti_desc:0 "贝内代蒂不仅将成为领导一个破碎国家的强力领袖，还将成为新法国时代的象征。每一个法国人，无论男女老少，都将把贝内代蒂是为法国凤凰从新自由主义颓废和失败之废墟中涅槃的象征。"
 FAF_Damien_Rieu_HM:0 "达米安·里厄"
 FAF_Daniel_Conversano_FM:0 "丹尼尔·康韦萨诺"
 FAF_Disregard_Secularism:0 "无视世俗主义"
 FAF_Disregard_Secularism_desc:0 ""
 FAF_Disrupt_Benedetti:0 "干扰贝内代蒂"
 FAF_Disrupt_Benedetti_desc:0 "贝内代蒂之流，不过是拙劣模仿早已覆灭的失败政权的法西斯余孽。他所鼓吹的“法兰西单一民族国家论”，实为文化沙文主义的极致愚蠢形态。对于其策划的所有行动——无论是煽动性演说、政治宣传还是其他任何形式的活动，都必须加以屏蔽或进行内容篡改，绝不能让这些腐朽思想荼毒我们的多民族国家。"
 FAF_EUB_dummy:0 "欧洲处女地"
 FAF_EUB_green_classicalism:0 "欧洲处女地"
 FAF_EUB_green_white_dummy:0 "欧洲处女地"
 FAF_EUN_army_of_purity_dummy:0 "欧洲霸权"
 FAF_EUN_army_of_purity_dummy_desc:0 "作为认同主义派，我们的运动有别于欧洲常见的极右派系，我们主张大陆的统一，而非仅仅维系组成它的各个民族国家。我们亲眼目睹欧盟在东方蛮族的冲击下分崩离析，而现在，一个填补权力真空、屹立为欧洲霸主的机会已然来临。虽维持我们的影响力或需付出政治代价，但成为大陆新的核心至关重要，唯有如此，我们才能战胜多元文化主义、自由主义，以及那些欲摧毁我们挚爱欧洲的势力！"
 FAF_EUN_dummy:0 "欧洲霸权"
 FAF_EU_end_federalization_campaign_decision:0 "抢先欧洲联邦化"
 FAF_EU_federalization_tt:0 "开始§Y推动大陆统一§!后，§C欧洲霸权§!内的一切国家都有权选择联邦化。\n§G关系越好，§!§C吞并的可能性越高。§!"
 FAF_EU_unification_campaigns_idea:0 "霸权统一运动"
 FAF_EU_unification_campaigns_idea_desc:0 "在团结整个欧洲运动的过程中，我们必须考虑到，我们所谓的统一跟前欧盟联邦派大相径庭。我们运动的核心是建立统一欧陆的霸权体，但这种霸权不是为让技官精英刮取民脂民膏，而是为了保护人民和文化。我们已经投入了大量资源，以保障运动在接下来一年里取得成功，将所有境外势力赶出这片大陆！"
 FAF_Enforce_Edict_of_Paris:0 "行巴黎敕令"
 FAF_Enforce_Edict_of_Paris_desc:0 "为消除自由民主的腐朽与混乱，我们决定回归传统法律与习俗，尤其是《巴黎敕令》；其虽源于7世纪墨洛温王朝的立法，却能平衡教会与国家的权力，确保双方维持其权威。为进一步巩固我们的统治，我们可再次将这一敕令纳入法国法律体系，同时确保其与时俱进，以应对现代问题与经济挑战。"
 FAF_Engie_Bills_idea:0 "法能方案"
 FAF_Engie_Bills_idea_desc:0 "法能方案是一套通过隐秘借贷机制支撑法国重整军备的金融体系，旨在规避外部鹰派势力的干预与监察。该体系效仿德国二战前为工业复兴设计的梅福券，实则是代价高昂的双面手段——虽难以为继却势在必行。无论如何收场，它仍是法兰西浴火重生、重塑全球强国地位的必经之路。"
 FAF_Enshrine_the_Rights_of_Man:0 "尊重人权"
 FAF_Enshrine_the_Rights_of_Man_desc:0 "1798年，我们的父辈们摆脱了旧制度的恐怖与野蛮，为新生的法兰西人民绘制了一幅自由的蓝图。这份文献，即《人权与公民权宣言》，至今仍在第五共和国的最新宪法中占据一席之地。如今，我们正致力于重建政府的合法性，不将这些权利加以确立，岂不是愚蠢之举！"
 FAF_Fabrice_Robert_IM:0 "法布里斯·罗伯特"
 FAF_Fascist_Paramilitaries_idea:0 "法西斯准军事组织"
 FAF_Fascist_Paramilitaries_idea_desc:0 "法西斯准军事组织的武装网络在法国各地强行维护对政权的忠诚，他们肆无忌惮，行事如风。尽管他们残酷的手段压制了异议，却也在民众中滋生了怨恨。然而，我们国家所迫切需要的正是这种强大的维稳能力。"
 FAF_Fascist_Paramilitaries_tt:0 "这将生成§C三支绿色民兵§!师。"
 FAF_Fascist_Revolts:0 "法西斯主义暴动"
 FAF_Fascist_Revolts_desc:0 "无论是受欧洲局势的影响，还是因政府推行的政策，我国的法西斯分子正掀起暴乱，对政府发起抗议。尽管我们并不认为这种动荡会持续太久，但为了避免进一步激怒他们，我们或许需要重新审视当前的治理方针。"
 FAF_Force_Padanian_Referendum_decision:0 "强迫[LOM.GetFlag]§G帕达尼亚公投§!"
 FAF_Force_Padanian_Referendum_decision_desc:0 ""
 FAF_Formulate_Latinism:0 "制定新拉丁理论"
 FAF_Formulate_Latinism_desc:0 "拉丁主义作为一种意识形态，历来呈现支离破碎且缺乏凝聚力的状态。我们必须将其锻造为浑然一体、万众一心的思想蜂巢。若不能实现这点，新罗马的恢弘愿景恐将永远蒙尘。"
 FAF_Full_Fascist_Control_idea:0 "一党专政"
 FAF_Full_Gaullist_Influence_idea:0 "新共和国"
 FAF_Full_Latinist_Control_idea:0 "一党专政"
 FAF_Full_Petainist_Control_idea:0 "一党专政"
 FAF_George_Kuzmanovic_EM:0 "乔治·库兹曼诺维奇"
 FAF_Glorify_Jeanne_dArc:0 "赞美圣女贞德"
 FAF_Glorify_Jeanne_dArc_Monarchist:0 "赞美圣女贞德"
 FAF_Glorify_Jeanne_dArc_Monarchist_desc:0 ""
 FAF_Glorify_Jeanne_dArc_desc:0 ""
 FAF_Glorify_Maurras:0 "赞美夏尔·莫拉斯"
 FAF_Glorify_Maurras_desc:0 ""
 FAF_Glorify_Vichy_Stability:0 "赞美维希政权的稳定"
 FAF_Glorify_Vichy_Stability_Mon:0 "赞美维希政权的稳定"
 FAF_Glorify_Vichy_Stability_Mon_desc:0 ""
 FAF_Glorify_Vichy_Stability_desc:0 "前法兰西国的公众形象因众多偏颇的历史学家指控其“与德国合作”而蒙上污名。然而，我们仍有办法在法国人民心中挽回其历史遗产。在21世纪的混乱中，稳定成为众人追求的珍贵品质，而强调昔日维希政权所带来的秩序，能够让民众认识到，我们的目标远非简单地屈服于德国法西斯。"
 FAF_Glorify_the_Imperial_Era:0 "美化帝国时代"
 FAF_Glorify_the_Imperial_Era_desc:0 "没有什么比横跨整个大陆的伟大帝国更令人向往——它的人民、文化、城市，皆汇聚于一面旗帜之下，信奉同一信仰，践行同一理念。我们曾无数次接近这一乌托邦般的理想，却一次次被剥夺，功败垂成。但如今，我们将发起最后、最坚定的冲击，誓要夺回那个梦寐以求的未来。"
 FAF_Golden_Franc_idea:0 "法郎"
 FAF_Golden_Franc_idea_desc:0 "经过多年的全球主义桎梏，我们终于迎回了挚爱的法郎。虽然完全掌握国家财政自主权为经济注入了强劲动力，但各行业仍需肩负起爱国义务，填补昔日欧元区廉价劳动力红利消逝后留下的产业空缺。"
 FAF_Grant_Refuge_to_HRM:0 "家族庇护所"
 FAF_Grant_Refuge_to_HRM_desc:0 "\n\n\n\n\n£GFX_FAF_spanish_royalty\n\n\n\n\n\n\n\n我们的家族在西班牙——我们南方邻国正统的波旁王室统治者——正面临包括无政府主义者、分裂主义者、民族主义者和共和主义者的各种敌人围攻。若任由他们被推向断头台，那将是不义之举，我们波旁家族已经与那可怕的机器有过太多的不幸遭遇。"
 FAF_Guillaume_Cuvelier_IM:0 "纪尧姆·屈弗利耶"
 FAF_Harness_Federalist_Sympathizers:0 "利用联邦派支持者"
 FAF_Harness_Federalist_Sympathizers_desc:0 "在我们推翻的那个脆弱无能的政府中，曾有不少官员对我们的运动抱有同情。如今，随着我们的力量崛起，这些旧政权的官员终于有机会弥补他们过去的无为与羞辱——他们可以选择站到我们一边，为我们的事业效力。"
 FAF_Hexagon_tt:0 "§Y我们晚些时候再来处理[BEL.GetFlag]比利时问题……§!"
 FAF_Honor_Vichy:0 "赞美维希政权"
 FAF_Honor_Vichy_desc:0 "贝当元帅是引导法国人民度过最动荡时期的英雄，但在经过数十年的新自由主义政权的专制统治后，这位维希英雄的荣誉遭到了诋毁。英勇烈士们所作的牺牲必须被法国人民铭记。"
 FAF_Honor_and_Glory_idea:0 "自豪与荣耀"
 FAF_Imperial_Palace_idea:0 "皇宫"
 FAF_Imperial_Palace_idea_desc:0 "宫殿是稳定、繁荣与昌盛的化身。作为法兰西及其君主制的象征，它昭示着千秋万代的永恒传承。这奢华炫目的建筑群不仅彰显着我们对欧陆的绝对统治，更是法兰西帝国王冠上最璀璨的明珠。"
 FAF_Imperialist_Sympathies:0 "帝国支持者"
 FAF_Italian_Unification_decision:0 "结盟[ITA.GetFlag]§G意大利§!"
 FAF_Italian_Unification_decision_desc:0 ""
 FAF_Jean_David_Cattin_FM:0 "让·达维德·卡坦"
 FAF_Jean_d_Orleans_HM:0 "让·奥尔良"
 FAF_Joachim_Murat_FM:0 "若阿基姆·缪拉"
 FAF_Julien_Langella_IM:0 "朱利安·朗盖拉"
 FAF_Julien_Rochedy_EM:0 "朱利安·罗舍迪"
 FAF_Karim_Ouchikh_HM:0 "卡里姆·乌希克"
 FAF_Keep_Officers_in_Check:0 "裁撤官员"
 FAF_Keep_Officers_in_Check_Mon:0 "裁撤官员"
 FAF_Keep_Officers_in_Check_Mon_desc:0 ""
 FAF_Keep_Officers_in_Check_desc:0 "军官团一直是我们的心头之患，他们与伪自由派的戴高乐主义者沆瀣一气，妄图将我们拖回过去那些动荡不安的法兰西共和国时代。尽管国家事务仍需仰仗他们的专业能力，但要确保我们的政权稳固，削弱他们的政治影响力势在必行。"
 FAF_Kill_Bardella_decision:0 "终结认同主义者"
 FAF_Kill_Bardella_decision_desc:0 ""
 FAF_Kill_Benedetti_decision:0 "终结墨索里尼效仿派"
 FAF_Kill_Benedetti_decision_desc:0 ""
 FAF_Kill_the_Juntists_decision:0 "终结懦弱将领"
 FAF_Lafayette_HM:0 "“拉法耶特”"
 FAF_Language_of_the_State_decision:0 "废除官方语言"
 FAF_Language_of_the_State_decision_desc:0 "拉丁语被人民采用的主要障碍之一是我们拥有单一的国家语言——法语。虽然这对管理和政治阶层来说可能是个冲击，但取消法语的特权地位，将其与我们的法定语言置于同等地位，或许可以激励公民学习拉丁语。此外，这么做可以确保当欧洲最终统一时，我们的旗帜不会被视为法兰西帝国主义的又一象征。"
 FAF_Laurent_Marcangeli_HM:0 "洛朗·马尔坎杰利"
 FAF_Laurent_Marcangeli_IM:0 "洛朗·马尔坎杰利"
 FAF_Legalize_Experimental_Weapon_Programs:0 "正式化实验武器项目"
 FAF_Les_Identitarian_party:0 "认同同盟"
 FAF_Les_Identitarian_party_long:0 "认同同盟(Bloc Identitaire)"
 FAF_Les_Republicains_party:0 "共和党"
 FAF_Les_Republicains_party_long:0 "共和党(Les Republicains)"
 FAF_Look_to_the_Glory_of_Rome:0 "回顾往日荣光"
 FAF_Look_to_the_Glory_of_Rome_desc:0 "诗人之国，哲人之乡，艺术之殿，征服者之邦——这便是法兰西。作为伟大的查理曼之继承者，我们已成为欧洲创新与荣耀的核心。虽历经艰难岁月，我们须唤醒人民，重忆往昔辉煌，任凭困厄时光袭扰，法兰西始终砥砺前行，步伐未曾停歇。"
 FAF_Marie_Marguerite_of_Bourbon_IM:0 "波旁的玛丽·玛格丽特"
 FAF_Mimic_de_Gaulle:0 "模仿戴高乐"
 FAF_Mimic_de_Gaulle_desc:0 "在我们致力于建立以军事为核心、但仍尊重公民基本权利的治理模式时，还有谁比已故总统兼将军夏尔·戴高乐更值得借鉴？他在创建第六共和国的努力——尽管最终未能长久维系——为我们的领导提供了一个可参考的框架。尽管当时为平息1958年5月的危机采取了强硬手段，但他留下的政治遗产依然令人怀念，我们理应加以效仿。"
 FAF_MoDem_party:0 "民主运动"
 FAF_MoDem_party_long:0 "民主运动(Democratic Movement)"
 FAF_Modern_Knights:0 "现代骑士"
 FAF_Move_Troops_into_Padania_decision:0 "稳定[LOM.GetFlag]§G北意§!"
 FAF_Move_Troops_into_Padania_decision_desc:0 ""
 FAF_NMD_racial_law:0 "法国霸权"
 FAF_NMD_racial_law_desc:0 ""
 FAF_National_Conservative_Union_party:0 "民族保守联盟"
 FAF_National_Conservative_Union_party_long:0 "民族保守联盟(National Conservative Union)"
 FAF_National_Rebirth:0 "国家重生"
 FAF_National_Rebirth_Anti_Communist:0 "国家重生"
 FAF_National_Rebirth_Anti_Communist_desc:0 "法国必须觉醒，以便迎接团结与力量的辉煌复兴。通过大胆和强有力的文化重塑，我们的政权必须重建国民应有的自豪感，并坚定地引领我国走向气壮山河之路。"
 FAF_National_Rebirth_desc:0 "法国必须觉醒，以便迎接团结与力量的辉煌复兴。通过大胆和强有力的文化重塑，我们的政权必须重建国民应有的自豪感，并坚定地引领我国走向气壮山河之路。"
 FAF_Nationalize_the_Wine_and_Olive_Industries:0 "国有化葡萄酒和橄榄油产业"
 FAF_Nationalize_the_Wine_and_Olive_Industries_desc:0 "在文化产品领域，法国以其葡萄酒和橄榄出口闻名于世。目前，这些产业大多为私人所有，因而易受外国势力的影响。若我们将这些产业国有化，不仅能为政权获取额外资金，更能确保这些产品继续成为法兰西的骄傲与喜悦！"
 FAF_Nikola_Perovic_FM:0 "尼古拉·佩罗维奇"
 FAF_Nobility_tt:0 "§C贵族阶级在支持君主制和维护国家稳定上发挥重要作用§!"
 FAF_Nobility_warning_tt:0 "§C恢复贵族地位会为我们的事业带来许多新支持者……其中也有一些不太好的。§!"
 FAF_Nuke_Kiev_decision:0 "在§Y基辅§!部署§R战术核弹§!"
 FAF_Nuke_Leningrad_decision:0 "在§Y列宁格勒§!部署§R战术核弹§!"
 FAF_Nuke_Moscow_decision:0 "在§Y莫斯科§!部署§R战术核弹§!"
 FAF_Nuke_Warsaw_decision:0 "在§Y华沙§!部署§R战术核弹§!"
 FAF_Open_Alsace_Identitarian_Council_decision:0 "助推§P阿尔萨斯身份认同§!"
 FAF_Open_Alsace_Identitarian_Council_decision_desc:0 "阿尔萨斯过去是，现在是，将来也永远是法国的。自威斯特伐利亚条约以来，阿尔萨斯一直处于法国统治之下。有人声称阿尔萨斯是德国的，但这无疑是一派胡言，一个用来在我们之间埋下分裂种子的谎言。诚然，德国人曾多次使我们分裂，但血浓于水，我们必须提醒阿尔萨斯人民这一事实。"
 FAF_Open_Basque_Identitarian_Council_decision:0 "助推§7巴斯克身份认同§!"
 FAF_Open_Basque_Identitarian_Council_decision_desc:0 "巴斯克人民可以自豪于他们对自身文化与语言的坚守，然而，全球化的侵蚀如同无形的毒素，正在使这一切逐渐衰微。在法国，巴斯克文化正缓缓消逝，语言亦逐渐被遗忘；而在西班牙，巴斯克人的态度却愈发激进。在我们的治理之下，他们应当铭记，使我们强盛的，并非文化的分裂，而是双重遗产所带来的丰饶与深邃。"
 FAF_Open_Catalan_Identitarian_Council_decision:0 "助推§Y加泰罗尼亚身份认同§!"
 FAF_Open_Catalan_Identitarian_Council_decision_desc:0 "加泰罗尼亚文化与语言因我们教育中央化的努力而逐渐濒危。这一小小的无心之失，使他们放弃自身传统，被迫适应法兰西的生活方式。我们不应忘记，我们是一座“人塔”，如人塔般，唯有齐心协力，方能稳固屹立。"
 FAF_Open_Corsican_Identitarian_Council_decision:0 "助推§g科西嘉身份认同§!"
 FAF_Open_Corsican_Identitarian_Council_decision_desc:0 "自18世纪末以来，科西嘉便属于法国。这座位于法国大陆东南的小岛，孕育了法国历史上最伟大的巨人——拿破仑·波拿巴。科西嘉在法国的地位一直不稳，甚至麻烦不断；但通过接纳与融合，我们之间的亲缘纽带便可得到巩固。"
 FAF_Open_Lombardian_Identitarian_Council_decision:0 "助推§G伦巴第身份认同§!"
 FAF_Open_Lombardian_Identitarian_Council_decision_desc:0 "我们法国人与伦巴第人的联系始于伟大的查理曼征服其王国，将其纳入我们的文化影响范围之时。随着伦巴第兄弟重回我们的怀抱，我们必将重燃两个民族之间延续数个世纪的纽带。"
 FAF_Open_Occitan_Identitarian_Council_decision:0 "助推§O奥克西坦身份认同§!"
 FAF_Open_Occitan_Identitarian_Council_decision_desc:0 "几代以来，奥克西塔尼亚一直处于法国统治之下，今天已然成为不可分割的一部分。但或许也正因为如此，奥克西塔尼亚的文化和语言正面临着濒临消失的风险，很快便会在我们伟大的国家中被遗忘。我们不能允许这一切发生，奥克西塔尼亚文化复兴是引导人民找回根源的关键。"
 FAF_Open_Paris_Identitarian_Council_decision:0 "助推§C巴黎身份认同§!"
 FAF_Open_Paris_Identitarian_Council_decision_desc:0 "论及法兰西，怎能不提巴黎？数世纪以来，巴黎一直是法国艺术、时尚与文学的心脏——若非整个世界之心脏。然而，这座“太阳之城”并非仅由砖石垒砌而成，更由那繁荣的巴黎文化浇灌而成，使生命与创意在此绽放。正是巴黎文化，将我们的国家推上全球舞台，令我们的名字响彻碧海之畔。"
 FAF_Open_Roman_Identitarian_Council_decision:0 "助推§t罗马身份认同§!"
 FAF_Open_Roman_Identitarian_Council_decision_desc:0 "哦，罗马……该从何说起呢？法国文化的根基便是罗马，法语即源自拉丁语。正是罗马人与古高卢人的交融造就了今日的法国，罗马的尚武精神、创造力和智慧也都为我们所继承。法兰西即罗马，罗马即法兰西。"
 FAF_Open_Venetian_Identitarian_Council_decision:0 "助推§A威尼斯身份认同§!"
 FAF_Open_Venetian_Identitarian_Council_decision_desc:0 "我们法国人一直对威尼斯的文化和人民怀有深深的敬仰与欣赏。当拿破仑征服威尼斯时，他并未觊觎其人民或物质财富，而是将目光投向了辉煌的威尼斯艺术。欢欣吧，我的威尼斯兄弟们，你们终于成为了我们伟大法兰西家族的一员。"
 FAF_Pardon_Republican_Officers:0 "赦免共和派军官"
 FAF_Pardon_Republican_Officers_desc:0 "为了确保对国家机关的掌控，我们需要尽可能多的人手。尽管最初的清洗已将大多数在政变中效忠旧政权的官员清除，但对于那些仍持同情立场者，我们可以通过一系列赦免措施将其重新纳入体系。"
 FAF_Patrick_de_Seze_EM:0 "帕特里克·德·塞兹"
 FAF_Paul_Marie_Couteaux_HM:0 "保罗·玛丽·库托"
 FAF_Petainist_Defense:0 "防守演习"
 FAF_Petainist_Defense_desc:0 "我们的军队战略防御保障了国家的边疆安全。纪律严明的军队与坚固的防线，必将与人民的韧性同在，确保外来侵略者再也无法威胁祖国的安宁。"
 FAF_Pierre_Cassen_IM:0 "皮埃尔·卡森"
 FAF_Pierre_Jean_Luciani_IM:0 "皮埃尔-让·卢西亚尼"
 FAF_Pope_Innocent_XIV_IM:0 "教宗英诺森十四世"
 FAF_Praise_the_Army:0 "赞颂军队"
 FAF_Praise_the_Army_desc:0 "我们的士兵在东线英勇作战，却被懦弱的领导层背叛了。新的祖国绝不行此等苟且之事，我们将恢复法军的伟大荣誉，新法兰西国的中坚力量便是勇敢的军队。"
 FAF_Promote_Active_Clubs:0 "推广活跃俱乐部"
 FAF_Promote_Active_Clubs_desc:0 "活跃社团对将迷茫的年轻人转变为有组织的民族主义法国青年至关重要。历史上的每一次革命中，年轻人的热情都是变革之驱，现在我们必须利用这一点，培养充满活力和斗志的年轻人！"
 FAF_Promote_French_Israelism:0 "认同法式以色列主义"
 FAF_Promote_French_Israelism_Mon:0 "认同法式以色列主义"
 FAF_Promote_French_Israelism_Mon_desc:0 ""
 FAF_Promote_French_Israelism_desc:0 "尽管在法兰西民族主义中，这种观点仍属边缘理论，但确实有人认为，我们的法兰克祖先乃便雅悯支派的后裔，因此是以色列失落的十支派之一。或许有人视其为伪历史，但若我们加以宣传，便能激发宗教信仰者的斗志，使其为我们的政权而战。在对抗东方狂潮的斗争中，将自身塑造为天命所归的十字军，无疑是明智之举。"
 FAF_Promote_Radical_Officers:0 "晋升激进派官员"
 FAF_Promote_Radical_Officers_Mon:0 "晋升激进派官员"
 FAF_Promote_Radical_Officers_Mon_desc:0 ""
 FAF_Promote_Radical_Officers_desc:0 "为了削弱戴高乐派在军官团中的影响力，我们可以提拔那些更能体现贝当主义理想的现役军官。再者，在政治领域，军官之间有不同的声音总归是件好事，不是吗？"
 FAF_Put_Pressure_on_the_Dalmatians_decision:0 "要求[CRO.GetFlag]§p克罗地亚臣服§!"
 FAF_Put_Pressure_on_the_Dalmatians_decision_desc:0 "从戴克里先宫的大理石回廊到杜布罗夫尼克的拉丁碑文，亚得里亚海的盐雾从未彻底冲刷掉这片土地上的罗马印记。正如亚得里亚海永远向西凝视着永恒之城的方位，克罗地亚的文明图谱始终留有接受拉丁圣火洗礼的空白页章。当第四次十字军的铁骑在君士坦丁堡升起拉丁十字旗时，历史的经纬已为这片拉丁文明的遗珠预设了归途——不是屈服于奥斯曼新月或斯拉夫双头鹰，而是将沿着罗马军团铺设的达尔马提亚大道，重归承载着帝国正统的拉丁权杖之下。"
 FAF_QU_idea_dummy:0 "多语归一"
 FAF_QU_tt:0 "虽然一开始这是一个§R负面的§!修正，但随着我们逐渐重新统一意大利语，西班牙语，和法语并构成一个独特的§Y拉丁式§!方言，这个§G修正就会变得更好§!"
 FAF_Quadrilingual_Unification_idea:0 "姊妹语"
 FAF_Redeem_The_Marechal:0 "赦免元帅"
 FAF_Redeem_The_Marechal_Mon:0 "赦免元帅"
 FAF_Redeem_The_Marechal_Mon_desc:0 ""
 FAF_Redeem_The_Marechal_desc:0 "历史从未眷顾菲利普·贝当。这位曾被世人敬称为“凡尔登之狮”的元帅，在战火纷飞的时代，以无畏之姿捍卫祖国，更在国难当头之际，毅然选择议和，以换取法兰西免于毁灭的生机。然而，那些固执偏颇的自由派史家，却一心要将他钉上“合作者”的耻辱柱。我们的教育应当采取更加“公正”的视角，去审视这位在二战期间真正拯救了法兰西的伟人！"
 FAF_Renuclearization:0 "核武装化"
 FAF_Renuclearization_desc:0 ""
 FAF_Restore_Marianne:0 "再现玛丽安娜的荣光"
 FAF_Restore_Marianne_desc:0 "玛丽安娜的形象诞生于第一共和国的烈火之中，长期以来，她一直是法兰西的民族象征。然而，近几十年来，她在大众文化中的影响力逐渐式微，这令许多法国爱国者深感惋惜。因此，若要在爱国主义的旗帜下团结整个法兰西，我们必须让玛丽安娜重现昔日的荣光！"
 FAF_Restored_Monarchy_idea:0 "复兴主义运动"
 FAF_Romanticize_the_Old_Kingdom:0 "浪漫化旧王国"
 FAF_Romanticize_the_Old_Kingdom_desc:0 ""
 FAF_SNS_war_tt:0 "这可能导致与[SNS.GetFlag]§.西班牙民族国§!开战"
