 FRA_Ugo_Bernalicis_IM_desc:0 "于戈·贝尔纳利西，生于1987年10月9日，法国政治家，左翼政党不屈法国成员。自2017年起，他便代表加莱海峡省第二选区担任国民议会议员。贝尔纳利西以其鲜明的进步和反体制立场而闻名，他积极倡导社会公正、环境可持续性和工人权益。他毫不留情地批判紧缩措施和新自由主义政策，并广泛参与各类社会运动。他在不屈法国内党占据重要地位，对党的政治纲领制定产生了深远影响。"
