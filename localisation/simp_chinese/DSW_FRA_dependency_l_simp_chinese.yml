 FAF_protect_economic_interests_decision_desc:0 ""
 FAF_provoke_french_opposition_decision:0 "挑衅法国反对派"
 FAF_provoke_french_opposition_decision_desc:0 "如何在抨击对手的同时让自己成为焦点？最好的办法便是让他们显得不堪；怎么做？很简单，利用政治游戏中最古老的伎俩就行。我们将用模棱两可的挑衅激怒他们，让他们在愤怒中自乱阵脚、丑态百出。"
