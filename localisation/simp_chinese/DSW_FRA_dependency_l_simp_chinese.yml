 FRA_anti_islamism_desc:0 "随着沙特内战爆发后中东难民数量的激增，反对这些群体的抗议活动也迅速上升。尽管抗议者的意识形态各不相同，但他们普遍认为，这些寻求庇护者应因其宗教信仰而被拒之门外。这些抗议活动与右派政治联系更为密切，但我们必须寻求更有效的方式来整合或控制移民流入的速度，否则这些抗议活动可能成为激进化的工具，进而削弱公众对我们神圣民主制度的信任。"
