 FRA_Interventionist_Fervor:0 "放出战鹰"
 FRA_Interventionist_Fervor_desc:0 "北美已陷入现代史无前例的混乱与无政府状态，死亡与毁灭肆虐。这场动荡如此剧烈，甚至动摇了我们数十年来的政治根基，使长期惯例荡然无存。几乎一夜之间，国家立场与人事格局发生了前所未有的剧变。在每个政府机构中，温和派早已失声，鹰派全面掌权。他们都目睹着这个燃烧的世界，并道出了众人心声：若需采取行动以维护欧洲乃至全球的和平安全……\n\n那么我们必须当机立断。"
