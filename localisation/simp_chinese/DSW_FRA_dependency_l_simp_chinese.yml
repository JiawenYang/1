 FAF_dieu_veut_idea:0 "神旨"
 FAF_dieu_veut_idea_desc:0 "\n\n\n\n\n£GFX_FAF_deus_vult\n\n\n\n\n\n\n\n上帝的意志和民族的意志与我们同在，与我们的士兵同在。我们为正义而战，为神圣而崇高的事业而战。当我们的战士们前进时，他们应当知道，他们——法兰西人民——是有史以来最伟大的人民。当炮声轰鸣，他们面对东方的野蛮敌群时，他们应当明白，他们追随的是主的圣灵。上帝意欲如此！"
 FAF_dieu_veut_napoleon_idea:0 "神旨"
 FAF_dismantle_the_monopolies_decision:0 "粉碎垄断集团"
 FAF_dismantle_the_monopolies_decision_desc:0 ""
 FAF_divine_right_to_rule_decision:0 "神圣权利"
 FAF_divine_right_to_rule_decision_desc:0 "\n\n\n\n\n£GFX_FAF_divine_right_to_rule\n\n\n\n\n\n\n\n经过深思熟虑，我们终于赢得了民众与贵族的拥戴，波旁王室，瓦卢瓦之正统继承者，将再度扬起神圣法兰西之旌旗。国王万岁，永垂不朽！"
 FAF_embelish_german_betrayal_decision:0 "刀刺在背"
