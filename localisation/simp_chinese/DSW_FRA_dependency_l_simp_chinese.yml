 FAF_Stability_and_Authority_idea:0 "稳定与权威"
 FAF_Start_Caucasian_Jihad:0 "§Y高加索圣战舞台§!"
 FAF_Start_Caucasian_Jihad_desc:0 ""
 FAF_Stephane_Bern_FM:0 "斯蒂芬·伯尔尼"
 FAF_Strict_Martial_Law_idea:0 "戒严令"
 FAF_Strict_Martial_Law_idea_desc:0 "只要法兰西的敌人还在四处游荡，戒严令便将继续实施。日常生活在检查点和无休止的监控下窒息。恐惧让那些异见分子不敢妄为，尽管人们的常态感早已动摇不安。"
 FAF_Suffocate_the_Navy:0 "绞杀海军"
 FAF_Support_Benedetti:0 "支持贝内代蒂"
 FAF_Support_Benedetti_desc:0 "我们的伟大领袖贝内代蒂将成为法兰西民族复兴的新推动力。在失败的灰烬中，他起身，他奋战，他是法国的大救星。党必须团结在他身后，若非同心，便是淘汰。"
 FAF_The_General_trait:0 "将军"
 FAF_Utilize_Lafayette:0 "利用拉法耶特"
 FAF_Utilize_Lafayette_desc:0 "拉法耶特是推翻旧政权的核心力量之一，如今，他已成为当代的拿破仑。作为法兰西最具声望的人物之一，他的影响力遍布全国。正因如此，他的公众支持将是巩固我们政权的关键一步。确保他的忠诚，不仅意味着稳定国家，更意味着赋予我们的统治以无可争议的正当性。"
 FAF_Victor_Lenta_HM:0 "维克托·朗塔"
 FAF_Vilify_the_Revolution:0 "诋毁革命"
 FAF_Vilify_the_Revolution_desc:0 ""
 FAF_Warning_interior_tt:0 "§R该选择的后果不堪设想§!"
 FAF_Warning_murder_tt:0 "§R你是认真的吗？我们可是让你那么稳固。你会为此后悔的，路易“国王”……§!"
 FAF_Warning_wife_interior_tt:0 "§O你真准备让你的婚姻变成这样？你让妻子为你工作，真可耻……§!"
 FAF_Worker_Syndicate_Program_idea:0 "国家工人集团"
 FAF_Worker_Syndicate_Program_idea_desc:0 ""
 FAF_XIV_Society_idea:0 "§O十四社§!"
 FAF_XIV_Society_idea_desc:0 "十四社矢志不渝地致力于通过本政权，使法兰西重返昔日荣光。自内战前，他们便已通过地下网络与我们密切合作，而今日，他们正式成为政府的一部分。有了十四社的支持，法兰西距离昔日的辉煌又近了一步。只要他们依旧站在我们这一边，这片伟大的国度终将重返巅峰。"
 FAF_XIV_society_tt:0 "完成此国策后将§Y锁定玩家当前的政治路线§!"
