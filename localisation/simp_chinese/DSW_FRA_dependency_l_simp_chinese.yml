 The_Government_of_National_Defense_Democratic_National_Conservative_TXT_DESC:0 "民族保守联盟——一个结合了保守主义与军国主义理念的奇特联盟。该党自诩比共和党更具爱国精神，认为自身才是德维利耶与戴高乐理想的真正继承者，致力于塑造一个传统主义与民族主义并存的法兰西。\n意识形态为§3民粹戴高乐主义§!。\n\n\n\n\n\n\n\n   £GFX_FRA_Stephane_Ravier\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_Republicain_TXT:0 "§Y共和党§!"
 The_Government_of_National_Defense_Democratic_Republicain_TXT_DESC:0 "共和党被视为最具优势的竞争者，它几乎是国民联盟的延续——一个保守主义政党，致力于恢复法兰西的传统价值观，同时维护民主制度与权力平衡。\n意识形态为§Y传统戴高乐主义§!。\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Xavier_Bellamy\n\n\n\n\n\n\n\n\n-------------------------------------"
