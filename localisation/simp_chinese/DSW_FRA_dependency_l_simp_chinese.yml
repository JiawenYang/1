 FRA_jean_yves_le_drian_FM:0 "让-伊夫·勒德里昂"
 FRA_jean_yves_le_drian_FM_desc:0 "让-伊夫·勒德里昂，生于1947年6月30日，法国政治家，在法国政府中担任过多个部长级职务。他还是社会党成员，并曾任法国国民议会议员和参议员。勒德里昂在2012年至2017年弗朗索瓦·奥朗德总统执政期间担任国防部长，监督了法国在马里、叙利亚等多地的海外军事行动。自2017年起，勒德里昂开始在埃马纽埃尔·马克龙总统的麾下担任欧洲与外交事务部长。勒德里昂以其在外交事务方面的专业知识和在制定法国外交政策中的作用而闻名。他不仅被视为法国外交政策的重要塑造者，还频繁代表法国参与国际事务。"
