 FAF_strengthen_military_loyalty_decision_desc:0 ""
 FAF_sway_the_nobility_decision:0 "撼动贵族"
 FAF_sway_the_nobility_decision_desc:0 "仅仅拥有神授权利对贵族来说是不够的，对公爵、伯爵和元老来说，神圣的定义因利益而异。如果奥尔良派和波拿巴派为他们提供了更优厚的条件，那么这些派系便会因所谓的“仁慈”而被视为神圣。因此，如果我们想巩固统治，也必须表现出同样的“仁慈”。"
 FAF_sword_and_shield_bop:0 "剑与盾"
 FAF_sword_decision:0 "高举利剑"
