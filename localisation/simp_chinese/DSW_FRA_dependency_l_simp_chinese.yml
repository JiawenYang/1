 FRA_welfare_payments:0 "经济刺激方案"
 FRA_welfare_payments_desc:0 "随着封锁令的进一步加严，原本已受到限制的法国人民的日常生活与工作再一次被迫按下暂停键。而如今，疫情的终结仍然遥遥无期，似乎没有尽头可见。面对这场旷日持久的危机，政府唯有肩负起责任，扶助法国人民渡过这段艰难时光，让他们重拾希望与力量，直至我们共同迎来国家重新开放的那一天。"
 FRA_will_win_next_election_tt:0 "§C除非发生重大破坏性事故，塞茹尔内将赢得2027大选§!。"
 FRA_yellow_vest_protests:0 "黄背心抗议"
 FRA_yellow_vest_protests_desc:0 "随着“激进”运动，即媒体所称的“黄背心”抗议活动愈演愈烈，形势已愈加清晰：若无法迅速达成解决方案，给予示威者最少的实质性让步，法国将陷入比新冠疫情所带来的危机更为深重的动荡之中。在协商解决或找到替代方案之前，这个国家的内政稳定和政治完整性正摇摇欲坠。"
 FRA_yellow_vest_restarting_soon_tt:0 "§R嘿，你！希望你已经准备好迎接即将到来的一切！§!"
 FRA_yellow_vests_idea:0 "黄背心抗议"
 FRA_yellow_vests_idea_1:0 "黄背心抗议"
 FRA_yellow_vests_idea_1_desc:0 "\n\n\n\n£GFX_FRA_yellow_vest_banner\n\n\n\n\n\n法国经济衰退对工人阶级造成了沉重打击，燃油价格飙升、生活成本高涨、不平等加剧，种种问题严重威胁着民众的生活水平。同时，税收负担却不成比例地落在工人和中产阶级身上。2018年5月，一份请愿书获得近百万签名，点燃了持续近两年的抗议浪潮。\n\n这些抗议活动以“黄背心”为象征，汇聚了极左与极右势力，共同反对新自由主义。示威者封锁道路、筑起路障，并组织大规模游行示威。\n\n随着暴力升级，各大城市陷入骚乱，抗议者与警方爆发激烈冲突，财产损失遍及各地。马克龙的支持率已暴跌超过20%。这些抗议或许意味着法国政治的一个转折点——国家正在从自由主义转向极端浪潮。"
 FRA_yellow_vests_idea_2:0 "黄背心抗议"
