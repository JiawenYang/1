 FRA_Benoit_Hamon_IM:0 "伯努瓦·阿蒙"
 FRA_Bernard_Emie:0 "贝尔纳·埃米耶"
 FRA_Bernard_Emie_desc:0 "贝尔纳·埃米耶，法国外交官，拥有深厚的情报领域背景，自2017年起担任法国对外安全总局局长。埃米耶曾参与制定法国情报政策与战略，并以其卓越的情报专业知识和协调情报工作以强化法国国家安全方面的贡献而广受赞誉。在担任对外安全总局局长期间，埃米耶不得不面临法国前所未有的安全考验，包括持续升级的恐怖主义威胁与日益复杂的网络攻击。"
 FRA_Bertrand_de_La_Chesnais_IntelM:0 "贝特朗·德·拉谢奈"
 FRA_Bertrand_de_La_Chesnais_IntelM_desc:0 "贝特朗·马里·约瑟夫·于伊特·德·拉谢奈，法国政治家、前陆军少将，保守派政党国民联盟成员。他因秉持保守的民族主义立场而闻名，主张收紧移民政策、强化边境管理，并致力于维护法国的文化特性。拉谢奈曾在法国诺曼底的布雷特维尔-洛格约斯镇参与地方政务，并多次代表国民联盟角逐地方及大区选举。"
 FRA_Black_Army_of_France:0 "法兰西黑军"
 FRA_Black_Army_of_France_long:0 "法兰西黑军(Black Army of France)"
 FRA_Bring_Back_Villiers:0 "与德维利耶共事"
 FRA_Bring_Back_Villiers_desc:0 "陆军上将皮埃尔·德维利耶不仅在法军总参谋部中享有权威，还掌握着一定的政治影响力。如今，他愿意与我们合作，以平息其内部日益激进的言论。"
 FRA_Bring_them_Home:0 "带美国宇航员回来"
 FRA_Bruno_le_Maire_EM:0 "布鲁诺·勒梅尔"
 FRA_Bruno_le_Maire_EM_desc:0 "布鲁诺·勒梅尔，生于1969年4月15日，法国政治家，曾多次出任部长职务。作为共和党的成员，他自2017年起便在法国总统埃马纽埃尔·马克龙的领导下，担任经济、财政与重振部长一职。勒梅尔以卓越的经济和金融事务专长著称，在法国经济政策的制定中发挥了至关重要的作用。他积极推动法国经济改革，大力促进投资，并致力于提升法国在欧盟中的地位。勒梅尔无疑是法国政坛的一位杰出人物，且始终是经济改革和欧洲一体化的坚定拥护者。"
 FRA_Bureaucratic_cutdown_idea:0 "削减官僚"
 FRA_CFA_Franc:0 "非洲金融共同体法郎"
 FRA_CFA_Franc_2:0 "非洲金融共同体法郎"
 FRA_CFA_Franc_2_desc:0 "尽管非洲经历了去殖民化进程，法国依然通过中非法郎对其前西非殖民地保持强大影响力。中非法郎覆盖14个撒哈拉以南国家，并划分为两个货币区。由于其与欧元挂钩，这一货币体系限制了西非国家独立管理自身经济的能力，使其易受欧洲市场波动和欧盟政策的影响。\n\n然而，中非法郎却为法国经济带来了诸多好处，它不仅便利了法非贸易往来，还在该地区提供了宏观经济稳定。这种稳定在一定程度上帮助西非国家避免了债务危机与恶性通胀，同时也为法国企业大规模投资西非资源开发创造了条件，使法国从中获取了数十亿欧元的利润。"
 FRA_CFA_Franc_3:0 "非洲金融共同体法郎"
 FRA_CFA_Franc_3_desc:0 "尽管非洲经历了去殖民化进程，法国依然通过中非法郎对其前西非殖民地保持强大影响力。中非法郎覆盖14个撒哈拉以南国家，并划分为两个货币区。由于其与欧元挂钩，这一货币体系限制了西非国家独立管理自身经济的能力，使其易受欧洲市场波动和欧盟政策的影响。\n\n然而，中非法郎却为法国经济带来了诸多好处，它不仅便利了法非贸易往来，还在该地区提供了宏观经济稳定。这种稳定在一定程度上帮助西非国家避免了债务危机与恶性通胀，同时也为法国企业大规模投资西非资源开发创造了条件，使法国从中获取了数十亿欧元的利润。"
 FRA_CFA_Franc_desc:0 "法国虽二战后进行了去殖民化，海外领土也仅仅是往日残影，但对前西非殖民地的影响却从未消散。14个国家组成的非洲金融共同体被分为西非金融共同体法郎和中非金融共同体法郎两个货币区。\n\n这两种货币的汇率都与欧元绑定，许多人据此认为西非国家对本国经济的主权掌控近乎不存。由于丧失了对自己货币印发的掌控，全西非都在欧洲市场的狂风下瑟瑟发抖，还要受制于欧盟的行动。\n\n另一方面，共同体法郎对法国经济而言利益巨大。它促进法国和成员国间的进出口贸易，还为成员国提供了宏观经济上的稳定性，防止任何成员像许多其他非洲国家一样陷入债务危机或是恶性通货膨胀。如此，在西非经济稳定的大环境下，法国许多联合企业的投资蜂拥而至，大量投入西非的资源开发，将数以亿计的利润输送回法国本土。"
