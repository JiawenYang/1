 FRA_Francois_Asselineau_FM:0 "弗朗索瓦·阿瑟利诺"
 FRA_Francois_Asselineau_FM_desc:0 "弗朗索瓦·阿瑟利诺，生于1957年9月14日，法国政治家，主张法国退出欧盟的政党人民共和联盟的创始人。阿瑟利诺一直在批判欧盟及其引发的法国主权削弱问题。他曾多次竞选法国总统，推广其“法国脱欧”理念，并呼吁法国回归独立自主的状态。阿塞利诺秉持民族主义和反全球化的政治立场，这使他成为了法国政坛上的一位争议人物。"
