 latinist.1.a:0 "我们将浴火重生"
 latinist.1.b:0 "昔日荣光必将再现"
 latinist.1.c:0 "我们的血统将得到净化"
 latinist.1.d:0 "法兰西民族复兴之路已成为无法回避的历史叩问。自法国完成向民族主义国家转型以来，关于国家未来走向的争论在社会各阶层激烈迸发。战火与革命的烈焰已将旧秩序化为灰烬，而今在这片焦土之上，我们必须抉择如何重建家园。\n\n第一种观点主张我们将如不死鸟自余烬中重生。持此论者认为法兰西的苦难是必要的试炼，是对民族精神的净化。他们将当下困局视作通往伟大复兴的关键阶段，强调牺牲的崇高与忍耐的意义。在他们眼中，唯有通过彻底的精神革新，法兰西方能挣脱历史枷锁，迈向光明未来。\n\n第二种观点宣称往昔荣光必将重现。秉持此信念者沉湎于对法国黄金时代的追忆——无论是拿破仑时代的军事辉煌，亦或是第三共和国的文化昌盛。他们强调法兰西文明的延续性和优越性，主张回归传统价值与制度是重夺法国应世地位的关键。\n\n第三种观点认为我们的血脉将获净化。其信徒将法兰西的式微归咎于国民血统的“污染”，鼓吹通过严格的人口政策实现所谓“血统纯洁”。\n\n国家正立于十字路口，这些相互竞逐的愿景将塑造法兰西未来数年的命运轨迹。"
 latinist.1.t:0 "穿越灰烬"
 latinist.10.a:0 "日斯巴尼亚重新加入帝国"
 latinist.10.b:0 "不！"
 latinist.10.d:0 "自法国重塑自身为拉丁帝国以来，人们便已料想，迟早有一天，伊比利亚的土地将再次归于拉丁的怀抱。如今，这一天已近在眼前。我们是否会失去独立？是的。但我们是否会失去影响力？未必。作为拉丁帝国的一部分，西班牙将与法国、意大利、葡萄牙携手同行，共同建立一个足以抗衡德意志霸权与布尔什维克浪潮的拉丁世界。但今天，我们必须思考一个问题——我们首先是拉丁人，还是西班牙人？西班牙的土地上，孕育着加利西亚人、加泰罗尼亚人、阿拉贡人、阿斯图里亚斯人……曾几何时，我们嘲笑加泰罗尼亚人的民族主义短视而自私，对他们怒斥：“孤身一人，你们将一无所获！”而如今，法国亦向我们发出了相同的呼声。或许，我们该倾听？或许，是时候让伊比利亚回归拉丁的怀抱，让西班牙在新的拉丁帝国中，迎接更广阔的未来。"
 latinist.10.t:0 "拉丁帝国要求合并"
 latinist.11.a:0 "全欧废墟下，法兰西浴火重生！"
 latinist.11.b:0 "不！"
 latinist.11.d:0 "法国人总是那样高傲，仿佛世界皆掌握于他们之手。然而，当他们自称拉丁帝国之时，我们窥见了另一种骄傲——一种不再居高临下，而是以兄弟之名相称的傲然自信。数月前，我们曾试探地询问，法国的未来究竟何去何从。那时，他们并未以单一国家自居，而是向我们描绘了一个辉煌无比的愿景：一个统一的拉丁民族国家，一个新的罗马，一个如两千年前祖先般伟岸的红金帝国。他们说，他们渴望我们的同行，希望我们携手抗衡德意志的扩张，共同重塑欧洲的秩序。而今天，高卢大使带来了所谓的“好消息”——他们的蓝图已然成型，他们的目标已然坚定，如今，他们准备好要将我们并入其中。他们说他们“准备好了”，仿佛我们的接受已是理所当然？然而，一个民族的归属，又岂能如此轻易抉择？我们又如何得知，这不过是又一个法兰西帝国的复兴，只不过这次却披上了罗马的金色华裳，戴上了温和的笑容？法军已在边境凝视着伊比利亚，他们已整装待发，随时准备跨越卢比孔河。抉择已至，我们，何去何从？"
 latinist.11.t:0 "拉丁帝国要求合并"
 latinist.12.a:0 "我们能挺过去。"
 latinist.12.b:0 "叛徒！禁运！"
 latinist.12.c:0 "是可忍孰不可忍！"
 latinist.12.d:0 "法国军队高调进驻加泰罗尼亚的画面已然传遍媒体，他们以西班牙局势不稳为借口，将加泰罗尼亚收入麾下。但这一切不过是薄薄的伪装——他们无非是在妄图复辟“加泰罗尼亚边区”，竟然以为自己仍是昔日的法兰克？西班牙的核心领土，如今在我们最虚弱的时刻落入了外国之手！自1936年以来，我们从未如此无力，而这片土地就这样被夺走，我们怎能坐视不理？即便现在无法直接动用军队，我们也必须采取行动！经济制裁、全面禁运，我们至少要有所表示，不能让这些混账毫无代价地侵吞我们的土地！……或者，我们也可以就此放手，让法国去处理那些麻烦不断的加泰罗尼亚人。或许，这并不算是一场彻底的损失？"
 latinist.12.t:0 "法军挺进加泰罗尼亚"
 latinist.13.a:0 "我们别无选择……"
 latinist.13.b:0 "叛徒！我们绝不会屈服！"
