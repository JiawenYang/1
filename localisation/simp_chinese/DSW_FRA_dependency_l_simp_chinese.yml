 FRA_Sebastien_Lecornu_IntelM_desc:0 "塞巴斯蒂安·勒科尔尼，生于1986年6月11日，法国政治家，曾多次出任部长职务。作为共和国前进党成员及埃马纽埃尔·马克龙总统的亲密战友，勒科尔尼自2018年起出任海外领土部部长，负责管理法国海外领土。在此之前，他曾担任生态转型与包容性增长部的国务秘书，专注于推动环境和可持续发展议题。勒科尔尼以其实事求是的治理风格，以及积极解决法国海外领土困境的努力而广受赞誉。"
