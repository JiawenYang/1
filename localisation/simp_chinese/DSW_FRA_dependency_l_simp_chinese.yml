 FRA_Raphael_Gluckmann_FM:0 "拉斐尔·格鲁克斯曼"
 FRA_Raphael_Gluckmann_FM_desc:0 "拉斐尔·格鲁克斯曼，生于1979年10月15日，法国作家、电影制片人、政治家。他是政治运动公共广场的创始人，自2019年起担任欧洲议会议员。格鲁克斯曼以其进步和亲欧洲的立场而闻名，提倡社会正义、人权与生态环境的可持续。他向来直言不讳地批评欧洲极右翼运动，并积极投身促进欧洲合作与一体化。立足进步价值观，竭力解决社会面临的紧迫问题，是他政治生涯的特色。"
