 FRA_Eric_Coquerel_EM:0 "埃里克·科克雷尔"
 FRA_Eric_Coquerel_EM_desc:0 "埃里克·科克雷尔，生于1968年8月15日，法国政治家、不屈法国成员。他自2017年起，便代表塞纳-圣但尼省第一选区担任国民议会议员。科克雷尔因其左翼立场和反资本主义观点广受认可，积极倡导社会公正、环境可持续性及工人权益。他一贯对紧缩措施和新自由主义政策持批判态度，并活跃于多个社会运动中。作为不屈法国党内的重要一员，科克雷尔深度参与了该党的政治纲领构建工作。"
