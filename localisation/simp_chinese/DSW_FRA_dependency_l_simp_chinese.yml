 FAF_An_Honour_to_Serve_Mon:0 "参军光荣"
 FAF_An_Honour_to_Serve_Mon_desc:0 ""
 FAF_An_Honour_to_Serve_desc:0 "我们的人民必须认识到，法兰西的传承是一段关于奉献与牺牲的历史。从法兰克人的辉煌岁月、查理曼的帝国荣耀，到拿破仑席卷欧洲的征途，法兰西的血脉中始终流淌着军人的荣耀与忠诚。如今，随着我们即将踏上新的征途，对抗东方的狂潮，我们的宣传必须大力强调这一伟大传统，让人民铭记——服役军旅，是法兰西最崇高的使命！"
