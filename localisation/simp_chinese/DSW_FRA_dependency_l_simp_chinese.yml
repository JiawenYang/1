 FAF_one_million_man_army_decision:0 "百万大军"
 FAF_one_million_man_army_decision_desc:0 "一百万士兵！整整一百万名战士！他们昂首迎战，以生命为代价；他们无畏前行，在热血中筑起坚不可摧的壁垒。有如此钢铁般的军队守护，法兰西的人民可以安心，因为他们的祖国将永远保卫他们."
 FAF_operation_baku_decision_idea:0 "§H巴库行动§!"
 FAF_operation_charles_decision:0 "§Y查尔斯行动§!"
 FAF_operation_lothair_decision:0 "§Y洛泰尔行动§!"
 FAF_operation_louis_decision:0 "§Y路易行动§!"
 FAF_operation_powderkeg_decision_idea:0 "§H火药桶行动§!"
 FAF_oui_oui_oui_decision:0 "§C好！好！好！§!"
 FAF_oui_oui_oui_decision_desc:0 "向战争说“是”！向牺牲说“是”！向胜利说“是”！我们在俄欧战争中的失败让人民忘记了那些使我们成为辉煌强国的精神，因此我们必须唤醒他们。通过引领人民前进，我们将教会他们如何思考、如何行动——这不仅是为了他们自己，也是为了我们国家的复兴。"
 FAF_our_ancestral_battlefield_decision:0 "我们先祖的战场"
 FAF_our_ancestral_battlefield_decision_desc:0 ""
 FAF_our_french_mothers_decision:0 "敬奉贞德"
 FAF_our_french_mothers_decision_desc:0 "勇气，是人类最崇高的品格，而法国的勇气，名为贞德。她在战场上所向披靡，英勇无畏，甚至胜过麾下的男儿；当败类与叛徒以谎言将她送上火刑架，她却无泪无惧，沉默如钢。她迎战强敌，不退缩，不动摇，直至生命的最后一刻。如今，她成为法国精神的不朽象征。我们的军人，我们的战士，皆应以贞德为榜样——以炽烈的激情，坚定的忠诚，奋战不息，为法兰西而战。"
