 LE_PEN_LOSS_AI_BEHAVIOR_TXT:0 "§3勒庞§! - §R败选§!"
 LE_PEN_LOSS_AI_BEHAVIOR_TXT_DESC:0 "当完成“开场截击”国策后，系统将站在§3玛丽安·勒庞§!一边，并在与§O埃马纽埃尔·马克龙§!的角逐中输掉2022年大选。此后，§3勒庞§!辞任国民联盟主席，§3若尔丹·巴尔代拉§!成为新领袖。\n\n\n\n\n\n\n\n   £GFX_FRA_emmanuel_macron\n\n\n\n\n\n\n\n\n-------------------------------------"
