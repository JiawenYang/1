 FAF_take_in_european_dissidents_decision_desc:0 ""
 FAF_taunt_our_enemies_decision:0 "耻笑敌人"
 FAF_taunt_our_enemies_decision_desc:0 "法国内外树敌无数，但这些鼠辈能奈我何？这些无能败犬岂能伤我国分毫？他们身心虚弱——国内共产党堕落分子早已温顺如羔羊，俄国人则深陷内斗泥潭自顾不暇。如此宵小竟妄称敌手，岂不贻笑大方？"
 FAF_the_crime_of_opinion_idea:0 "思想罪"
 FAF_the_crime_of_opinion_idea_desc:0 "在巩固政权的征程中，赢得民众的心智仍是我们面临的挑战之一。尽管再教育已卓有成效，但我们仍可采取更有力的手段——禁止一切反政权的思想犯罪。通过立法，使传播或持有自由主义、进步主义及反法思想成为可处以罚款或短期监禁的违法行为，我们将确保任何人在批评我们正义政府之前，都会三思而后行！"
 FAF_the_failures_of_AH_decision:0 "[AUS.GetFlag]奥匈[HUN.GetFlag]的失败"
 FAF_the_failures_of_AH_decision_desc:0 "奥匈帝国的主要问题之一是对其文化少数群体的治理不当。虽然他们同属欧洲人，却受到统治他们的奥地利人的文化压制。如今，我们绝不能重蹈这一历史覆辙。全体法国人民将共同努力，找到我们问题的共同解决方案，以实现让人们安心的目标。"
 FAF_the_grand_council_idea:0 "法西斯大委员会"
 FAF_the_grand_council_idea_desc:0 "法兰西的政治体系再次印证了自身的腐朽无能。正如必须推翻波旁王朝的旧制度，我们也要摧毁这套陈腐体系，建立崭新的国家架构。唯有通过果敢无畏的强效政府，法兰西才能实现复兴，重拾昔日荣光。民主制度的疲软表现终将被法西斯主义的蓬勃生命力取代——唯有通过铁腕领导，而非选票与空谈，方可实现真正的变革与革新。我们将参照意大利法西斯大委员会模式组建全新统治机构，开创属于法兰西民族的繁荣新纪元。"
