 FAF_pay_for_the_arts_decision:0 "自助艺术"
 FAF_pay_for_the_arts_decision_desc:0 "\n\n\n\n\n£GFX_FAF_patronage_of_the_arts\n\n\n\n\n\n\n\n艺术始终是一个民族灵魂的核心，它塑造着一个民族的文化。古典时期和文艺复兴时期被视为艺术的黄金时代，这自然归功于各国君主对艺术发展的广泛支持。让法国再次成为伟大艺术的中心，让我们资助新的艺术杰作的诞生。"
