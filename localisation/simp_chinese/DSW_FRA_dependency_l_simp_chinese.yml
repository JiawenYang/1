 The_6th_Republican_Constitutional_Referendum_TXT_DESC:0 "\n\n§R要求：§!\n§p新人民阵线§!赢得2022年大选。"
 The_French_Socialist_Republic_Path:0 "@FPR §d法兰西§!§R社会主义§!§t共和国§!路线"
 The_French_Socialist_Republic_Path_1_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Revolutionary_French_State  §d雅各宾派§!"
 The_French_Socialist_Republic_Path_1_TXT_DESC:0 "改国号为法兰西革命共和国。意识形态为雅各宾主义。\n\n\n\n\n\n\n\n   £GFX_FPR_Antoine_Leaument\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§R要求：§!\n§p新人民阵线§!赢得法国2022年大选。"
 The_French_Socialist_Republic_Path_2_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Federated_Republic_of_Europe  §R托派§!"
 The_French_Socialist_Republic_Path_2_TXT_DESC:0 "意识形态为托洛茨基主义。\n\n\n\n\n\n\n\n£GFX_Natalie_Arthaud   £GFX_5th_int\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§R要求：§!\n§p新人民阵线§!输掉法国2022年大选。"
 The_French_Socialist_Republic_Path_3_TXT:0 "£GFX_TFR_game_rule_flag_FPR_Anarchist_State  §t无政府派§!"
 The_French_Socialist_Republic_Path_3_TXT_DESC:0 "改国号为法兰西无政府主义集体。意识形态为无政府共产主义。\n\n\n\n\n\n\n\n   £GFX_julien_coupat\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_French_Socialist_Republic_Path_Didier_Daeninckx_TXT:0 "§t达南克斯§!"
 The_French_Socialist_Republic_Path_Didier_Daeninckx_TXT_DESC:0 "意识形态为民主社会主义。\n\n\n\n\n\n\n\n   £GFX_Didier_Daeninckx\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§R要求：§!\n第六共和国宪法公投通过“§t激进宪法§!”。"
 The_French_Socialist_Republic_Path_TXT_DESC:0 "\n\n§R要求：§!\n§8俄罗斯自由民主党§!赢得俄罗斯大选。\n北约输掉欧陆战争。"
 The_French_Socialist_Republic_Path_melenchon_TXT:0 "§t梅朗雄§!"
 The_French_Socialist_Republic_Path_melenchon_TXT_DESC:0 "意识形态为欧洲共产主义。\n\n\n\n\n\n\n\n   £GFX_Leninchon\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§R要求：§!\n第六共和国宪法公投不选择“§t激进宪法§!”。"
 The_Government_of_National_Defense_Democratic:0 "£GFX_TFR_game_rule_flag_FAF_French_Republic  §O自由§!，§Y保守§!，§3爱国§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT:0 "§O民主运动§!"
 The_Government_of_National_Defense_Democratic_Democratic_Movement_TXT_DESC:0 "民主运动，这一中间派政党早在法国沦陷于苏维埃之前便已存在。它自诩为理性与稳健的选择，比起对手，它更倾向于中立、自由的政治立场。\n意识形态为§O基督教民主主义§!。\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Bayrou\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT:0 "§3民族保守联盟§!"
 The_Government_of_National_Defense_Democratic_National_Conservative_TXT_DESC:0 "民族保守联盟——一个结合了保守主义与军国主义理念的奇特联盟。该党自诩比共和党更具爱国精神，认为自身才是德维利耶与戴高乐理想的真正继承者，致力于塑造一个传统主义与民族主义并存的法兰西。\n意识形态为§3民粹戴高乐主义§!。\n\n\n\n\n\n\n\n   £GFX_FRA_Stephane_Ravier\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_Republicain_TXT:0 "§Y共和党§!"
 The_Government_of_National_Defense_Democratic_Republicain_TXT_DESC:0 "共和党被视为最具优势的竞争者，它几乎是国民联盟的延续——一个保守主义政党，致力于恢复法兰西的传统价值观，同时维护民主制度与权力平衡。\n意识形态为§Y传统戴高乐主义§!。\n\n\n\n\n\n\n\n   £GFX_FRA_Francois_Xavier_Bellamy\n\n\n\n\n\n\n\n\n-------------------------------------"
 The_Government_of_National_Defense_Democratic_TXT_DESC:0 "新共和国首次大选。\n\n\n\n\n\n\n\n   £GFX_Pierre_De_Villiers\n\n\n\n\n\n\n\n\n-------------------------------------\n\n§R要求：§!\n§g国防§!§a政府§!路线选择§3民主政府§!。"
