 FAF_demand_italian_unification_decision:0 "要求[ITA.GetFlag]接受统一"
 FAF_demand_italian_unification_decision_desc:0 "一个家庭若缺任一成员，便不完整，而在罗马大家庭中，意大利是无可替代的一员。毕竟，罗马之概念何处诞生？无意大利，我们的罗马将残缺不全——不过是一群江湖骗子与冒牌货打造的空洞仿品。无罗马的罗马，恰如早餐缺了咖啡与香烟，总觉大谬不然。故我们必须让意大利人看见我们的愿景。我们必须……"
 FAF_demand_portuguese_unification_decision:0 "要求[GOD.GetFlag]葡萄牙接受统一"
 FAF_demand_portuguese_unification_decision_desc:0 ""
 FAF_demand_spanish_unification_decision:0 "要求[SNS.GetFlag]西班牙接受统一"
 FAF_demand_spanish_unification_decision_desc:0 "试想片刻，伊比利亚那秀美的灌木丛与葱茏的林地，曾是我们辉煌罗马帝国的一部分，怎不令人满心骄傲与欢愉？然而，这一切仿佛遥不可及，逝于我们先祖殒地之时，成了久远的往昔。我等与西班牙人虽在共历的历史中龃龉不断，但流淌于我们脉中的血，终将我们紧紧相连。我们注定是友人与兄弟，而非仇敌。西班牙人或已忘却此情，但我们将唤起他们的记忆。"
 FAF_demand_swiss_unification_decision:0 "铲除瑞士"
 FAF_demand_swiss_unification_decision_tt:0 "§p必须在弗朗什-孔泰驻扎12支师§!"
