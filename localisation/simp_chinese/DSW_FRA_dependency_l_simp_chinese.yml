 The_6th_Republican_Constitutional_Referendum:0 "@FRA 第六共和国宪法公投 £GFX_TFR_game_rule_flag_FRA_Radical_Sixth_Republic"
 The_6th_Republican_Constitutional_Referendum_1_TXT:0 "£GFX_TFR_game_rule_flag_FRA_Radical_Sixth_Republic  §t激进宪法§!"
 The_6th_Republican_Constitutional_Referendum_1_TXT_DESC:0 "改国号为法兰西人民共和国。意识形态为主权社会主义。\n\n§R要求：§!\n§p梅朗雄§!或§0吕芬§!领导§p新人民阵线§!赢得2022年大选。"
 The_6th_Republican_Constitutional_Referendum_2_TXT:0 "@FRA §s温和宪法§!"
 The_6th_Republican_Constitutional_Referendum_2_TXT_DESC:0 "意识形态为进步主义。\n\n§R要求：§!\n§0富尔§!或§0吕芬§!领导§p新人民阵线§!赢得2022年大选。"
