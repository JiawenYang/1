 france.997.d:0 "如果你正在阅读这一事件，恭喜你，作弊者！这里有一些关于TFR的趣闻轶事：\n\n卡斯卡迪亚的开发者已经换了6任之多。\n\n最初，美国人民解放军的所有领导人都是女性。\n\n阿尔乔姆是最早的角色设定，但拉法耶特、尤利西斯、阿什顿·奈特以及“主谋”的角色原型都基于一个年轻的民族主义者和专制主义者的形象，他们都有着共同的背景——曾是战场上的老兵，年纪轻轻便已历经风霜，充满了权威与强硬的气质。"
