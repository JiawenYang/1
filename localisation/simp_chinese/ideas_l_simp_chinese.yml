l_simp_chinese:
 PRC_chinese_communist_party_idea: "中国共产党"
 PRC_communist_party_of_china_dynamic: "中国共产党"
 PRC_communist_party_of_china_dynamic_desc: "\n\n\n\n£GFX_chinese_communist_party\n\n\n\n\n\n§R伟大的中国共产党万岁!\n战无不胜的毛泽东思想万岁!§!\n\n自1949年以来，中国共产党便一直是中国大陆无可争议的统治者。即使在以苏联为首的一系列共产党国崩溃后，社会主义中国依然在东亚屹立不倒，并在改革开放后逐渐成为了世界上最强大的国家之一。中共能够在拥有14亿人口的中国巩固其统治的原因一直众说纷纭。有人说这是因为中共早已放弃了共产主义信条，通过承诺经济繁荣以换取支持，并运用旧帝国时代的传统思想让人民畏惧并服从。也有人认为，这是因为中共成功将其意识形态和组织渗透进了社会的方方面面，并通过不断改革从而获得了活力。不过无论怎样，有一点是确定的：§R如果要推翻中共这个巨人，恐怕需要一次世界末日级别的灾难。§!"
 VIE_communist_party_vietnam_dynamic: "越南共产党"
 one_child_policy_desc: "\n\n\n\n\n£GFX_PRC_one_child_policy_texticon_embed \n\n\n\n\n\n\n“一胎政策”是一项始于1979年，旨在控制迅速增长人口的政府举措。尽管该政策在其目标上取得了成功，但其后果却不容小觑。\n\n政策加深了男女性别的差异，重男轻女的思想风靡于各个家庭。这种趋势对未来性别比例构成了潜在风险。"
 FRA_french_spirit_idea: "法兰西精神"
 FRA_french_spirit_idea_desc: "\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\n纵观十九到二十世纪，巴黎曾两度被占领：第一次是1870年，之后是1940年。自那时起，法国就宣誓，绝对不会再让外国占领自己的土地。法国军队将保卫祖国血战至最后一刻。法国核武导弹将成为防卫国家的屏障，以地狱业火威胁胆敢进犯本土的敌人。\n\n但是，法国精神不只包括国防，还包括革命。法国是欧洲自由主义和左翼力量的核心地带，法国激进派精神已延续两个世纪有余。法国人从不容忍公平正义的缺失和破坏，宁为尊严而死，不在膝下独活。因此，任何意图阻拦人民意志的尝试都将迎来大规模抗议、动乱乃至革命，而法国人早已将这一过程反复付诸实践。"
 idea_ISR_american_funding: "美国援助"
 idea_ISR_american_funding_desc: "美利坚合众国，勇者之家，自由之地，长期以来将以色列作为在动荡中东地区的立足点，而我们从这一决定中获得了他们的援助。\n\n如果美国不复存在或选择停止支持我们，我们在中东地区的主导地位将受到邻国的质问。"
 idea_ISR_vanguard_of_judaism: "犹太教先锋"
 ISR_french_funding_idea: "法国援助"
 ISR_french_funding_idea_desc: "感觉不如美国……援助多。不过，法国好歹非常友善地给予我们一些支持。"
 JAP_japanese_pacifism_idea: "日式和平主义"
 JAP_japanese_pacifism_idea_desc: "第二次世界大战结束后，日本被迫放弃军国主义，采取更加和平的生活方式。按照宪法第九条的规定，日本基本没办法成立军队。不过，东方中国日益崛起，西方美国日渐衰落，许多人开始怀疑起维持现状的必要性。他们主张废除宪法第九条，成立正规军保卫日本及日本人民。"
 JAP_aging_population_idea: "人口老龄化"
 JAP_aging_population_idea_desc: "在战后40年代的婴儿潮结束后，我国的生育率迎来低潮。这一生育率降低与预期寿命的提升相叠加，导致当今日本人口的76.4%属于高龄人口。尽管这一统计数据极其夸张，但国家目前还不存在人口危机，人们的生活水平也很高。不过，高龄化却给早已停滞的日本经济又添上一副重担：退休人口占比过大，政府承受着护理服务缺口的巨大压力。日本政府正在推行新政策，一方面推动高龄人口再次活跃于社会，另一方面为新父母们提供补贴，提供更便捷的护理服务以鼓励生育。"
 JAP_economic_stagnation_idea: "经济停滞"
 JAP_economic_stagnation_idea_desc: "近年来，低增长率，低通胀，人口下滑成为了日本经济的特征。经济停滞可以归给许多原因：社会老龄化的趋势，缺乏改革的产业结构和长期通缩政策等等。\n日本经济长期停滞的原因是其严重的老龄化和劳动力数量萎缩，其人口老龄化问题在全世界位居前列。出生率低、平均年龄迅速走高的日本社会现状，导致了社会消费力和劳动人口总量的减少，从而令其经济增长举步维艰。"
 JAP_keiretsu_control_idea: "经连会统治"
 JAP_keiretsu_control_idea_desc: "强大的商业集团即是一直以来驱动日本产业的动力齿轮，这些过去被称为“财阀”，今日被称为“经连会”的集团自明治时代起就一直主导着日本经济。它们已与日本经济紧密相连，有些垄断企业甚至凭借高额的市场份额获取国家支持。经连会的主要权力来源于其每个子公司在各个合伙人企业中所持的股份。围绕银行，他们可以让每个公司都相互独立，不受市场变化及管理层收购的影响，且在无风险的情况下组织长期业务。经连会已经几近完全控制了日本庞大的制造业，除非政府寻求改变现状，否则它就几乎不可能被推翻。"
 JAP_political_monopoly_idea: "政治垄断"
 JAP_political_monopoly_idea_desc: "\n\n\n\n£GFX_JAP_political_monopoly\n\n\n\n\n\n自由民主党从1955年成立以来，就是日本最大的政治势力。除少数时期外，自民党一直掌控着日本国会的多数席位，从而垄断政治，使日本成为事实上的一党制国家。\n不过，近年来日本的政局却有些变化，新政党如雨后春笋拔地而出，挑战着自民党的地位。日本的政治体制未来会不会变得更具竞争性、更多元化，自民党能不能继续垄断权力，还是个未知数。"
 KOR_aging_popu: "人口老龄化"
 KOR_aging_popu_desc: "\n\n\n\n\n£GFX_KOR_aging_popu_embed \n\n\n\n\n\n\n始于1983年全斗焕执政时期的低生育率现象，至今仍是韩国社会的重大问题。1970年代工业化时期，人口过度增长曾催生节育政策，其遗留影响导致民众婚育意愿持续走低。如今，韩国已正式迈入老龄化社会。"
 MZB_flag_of_the_kalashnikov: "卡拉什尼科夫的旗帜"
 MZB_flag_of_the_kalashnikov_desc: "\n\n\n\n\n£GFX_MZB_flag_of_the_kalashnikov_embed \n\n\n\n\n\n\n莫桑比克国旗上描绘了一把装有刺刀的AK-47突击步枪与一把锄头交叉而成的图案，这一独特设计象征着该国争取独立的武装斗争，以及对国家防卫与社会进步的承诺，纪念莫桑比克在1975年摆脱葡萄牙殖民统治的历史。\n\n锄头代表农业与发展，敞开的书本则象征教育与知识。莫桑比克也是世界上唯一一个在国旗上使用现代枪械图案的国家，这使其国旗成为其革命过去最鲜明、最独特的象征。"
 MZB_central_african_railway_network: "中非铁路网络"
 MZB_central_african_railway_network_desc: "\n\n\n\n\n£GFX_MZB_central_african_railway_network_embed \n\n\n\n\n\n\n穿越莫桑比克的中部非洲铁路网络是连接内陆国家的重要交通枢纽。主要通道包括通往贝拉港的贝拉走廊，以及通向深水港纳卡拉的纳卡拉走廊。这些铁路在区域贸易中扮演着至关重要的角色，有效促进了矿产、农产品及各类货物的出口流通，是推动莫桑比克及周边国家经济发展的关键基础设施。"
