l_simp_chinese:
 syn_heavy_bat: "重型合成营"
 syn_heavy_bat_desc: "满编740人的合成营，辖2个坦克连（28辆主战坦克）与2个装步连（30辆步战车），编有反坦克、防空与指挥分队，是现代重型合成旅的核心突击力量。"
 syn_medium_bat: "中型合成营"
 syn_medium_bat_desc: "满编650人的轮式合成营，辖3个装步连（32辆轮式步战车）与机动炮排（8辆轮式突击炮），以防护换取战略机动性。"
 syn_light_bat: "轻型合成营"
 syn_light_bat_desc: "满编600人的轻型合成营，全部依托60辆高机动车机动，辖4个步兵连与编内迫击炮排（6门）。"
 syn_amphibious_bat: "两栖合成营"
 syn_amphibious_bat_desc: "满编600人的两栖合成营，乘用34辆两栖步战车与6辆两栖突击炮，能在火力下突击上陆、克服水障。"
 ZZ_neg_armor_heavy: "重型合成营保障分队"
 ZZ_neg_armor_heavy_desc: "重型合成营的营部、后勤与支援分队，以轻装车辆为主，不直接投入一线作战。"
