l_simp_chinese:
 syn_heavy_bat: "重型合成营"
 syn_heavy_bat_desc: "满编740人的合成营，辖2个坦克连（28辆主战坦克）与2个装步连（30辆步战车），编有反坦克、防空与指挥分队，是现代重型合成旅的核心突击力量。"
 syn_medium_bat: "中型合成营"
 syn_medium_bat_desc: "满编650人的轮式合成营，辖3个装步连（32辆轮式步战车）与机动炮排（8辆轮式突击炮），以防护换取战略机动性。"
 syn_light_bat: "轻型合成营"
 syn_light_bat_desc: "满编600人的轻型合成营，全部依托60辆高机动车机动，辖4个步兵连与编内迫击炮排（6门）。"
 syn_amphibious_bat: "两栖合成营"
 syn_amphibious_bat_desc: "满编600人的两栖合成营，乘用34辆两栖步战车与6辆两栖突击炮，能在火力下突击上陆、克服水障。"
 syn_heavy_bat_USA: "美式重型合成营"
 syn_heavy_bat_USA_desc: "满编740人的美式联兵营（ABCT），辖2个坦克连（28辆M1主战坦克）与2个装步连（29辆M2步战车），反坦克与防空火力充足，士官体系成熟、组织度最高。"
 syn_medium_bat_USA: "美式斯特赖克合成营"
 syn_medium_bat_USA_desc: "满编680人的美式轮式合成营，辖3个装步连（33辆斯特赖克轮式步战车）与机动炮排，依托战略空运快速部署。"
 syn_light_bat_USA: "美式轻型合成营"
 syn_light_bat_USA_desc: "满编600人的美式轻型步兵营（IBCT），全部依托41辆高机动战术车机动，辖4个步兵连与反坦克支援分队。"
 syn_amphibious_bat_USA: "美式两栖合成营"
 syn_amphibious_bat_USA_desc: "满编650人的美海军陆战队合成营，乘用32辆两栖步战车与两栖突击炮，能在火力下抢滩上陆、强渡水障。"
 syn_heavy_bat_SOV: "俄式重型合成营"
 syn_heavy_bat_SOV_desc: "满编920人的俄军营级战斗群（BTG），辖31辆主战坦克、35辆步战车与加强自行炮营（12门2S19），反坦克火力厚重，但合同兵比例低、组织度偏低。"
 syn_medium_bat_SOV: "俄式中型合成营"
 syn_medium_bat_SOV_desc: "满编700人的俄军摩步营，辖35辆轮式步战车与8门自行火炮，兼顾防护与机动。"
 syn_light_bat_SOV: "俄式轻型合成营"
 syn_light_bat_SOV_desc: "满编600人的俄军轻摩步营，依托45辆MT-LB与虎式高机动车机动，编有反坦克与压制火力。"
 syn_amphibious_bat_SOV: "俄式两栖合成营"
 syn_amphibious_bat_SOV_desc: "满编650人的俄海军步兵营，乘用34辆两栖步战车，擅长水障强渡与滨海突击。"
 syn_heavy_bat_CHI: "中式重型合成营"
 syn_heavy_bat_CHI_desc: "满编750人的重型合成营，辖2个坦克连（28辆ZTZ-99A）与2个装步连（30辆ZBD-04A），编制均衡、组织度稳定。"
 syn_medium_bat_CHI: "中式中型合成营"
 syn_medium_bat_CHI_desc: "满编700人的轮式合成营，辖3个装步连（33辆ZBL-08轮式步战车）与机动火炮，突出战略机动。"
 syn_light_bat_CHI: "中式轻型合成营"
 syn_light_bat_CHI_desc: "满编600人的轻型合成营，依托44辆猛士突击车机动，山地、丛林与城镇作战能力突出。"
 syn_amphibious_bat_CHI: "中式两栖合成营"
 syn_amphibious_bat_CHI_desc: "满编650人的两栖合成营，乘用36辆ZBD-05两栖步战车与ZTD-05两栖突击炮，专精渡海登岛。"
 ZZ_neg_armor_heavy: "重型合成营保障分队"
