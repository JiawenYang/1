 historical_elections.1.t:0 "2018年意大利大选"
 historical_elections.1.d:0 "大选后议会陷入僵局。五星运动与联盟党组建联合政府，朱塞佩·孔特于6月1日出任总理。"
 historical_elections.1.a:0 "新政府正式就职。"
 historical_elections.2.t:0 "2017年韩国总统选举"
 historical_elections.2.d:0 "文在寅赢得总统选举，并就任韩国总统。"
 historical_elections.2.a:0 "新一届政府开始执政。"
 historical_elections.3.t:0 "2020年韩国国会选举"
 historical_elections.3.d:0 "韩国国会选举开始竞选。"
 historical_elections.3.a:0 "竞选开始。"
 historical_elections.4.t:0 "2020年韩国国会选举结果"
 historical_elections.4.d:0 "共同民主党赢得国会选举，文在寅政府继续保持多数席位。"
 historical_elections.4.a:0 "结果已揭晓。"
