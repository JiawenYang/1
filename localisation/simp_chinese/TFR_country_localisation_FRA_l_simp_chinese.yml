 trait_FRA_Disgusted_with_Regime: "被当局激怒"
 trait_FRA_Disgusted_with_Regime_desc: "这位军官认为当前政权对其缺乏尊重，因此积极寻求在最大程度上摆脱最高指挥部的束缚，保持个人的独立与自主。\n\n倘若发生任何破坏法兰西共和国稳定的事情，这位军官无疑会站在反对现任政权的一边。"
 trait_FRA_Neutral_with_Regime: "对当局持中立立场"
 trait_FRA_Neutral_with_Regime_desc: "这位军官对当前政权持中立态度，既无喜爱也无厌恶。\n\n倘若发生任何破坏法兰西共和国稳定的事情，这位军官可以决定抛弃现任政权，但也说不准。"
