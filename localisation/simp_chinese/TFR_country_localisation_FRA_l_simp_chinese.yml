 FRA_Triumph_over_the_Eastern_Menace: "战胜俄国熊"
 FRA_Triumph_over_the_Eastern_Menace_desc: "血汗交织，北方巨熊终被征服。当美国沦陷时，有人预言欧洲会随之倾覆——富饶却无防，终如待宰羔羊般被群狼分食。但他们大错特错，如今屹立胜利之巅的正是欧洲：乌克兰游击队员、法国飞行员、德国装甲掷弹兵、英国皇家海军陆战队。这项艰巨伟业，唯有在欧洲各国誓死奋战，不妥协、不取虚假和平的决心下才得以实现。尽管仍有人对欧洲团结心存疑虑，但此刻谁都无法否认，当欧洲同心协力，必能成就伟业。"
 FRA_Mourn_our_Sons: "以何种代价？"
 FRA_Mourn_our_Sons_desc: "我们付出了惨痛的代价才彻底打倒东方的巨熊，我们在战争初期试图拯救乌克兰的努力失败了，原本应当是一场短暂而果断的行动，却最终演变为泥潭。我们取得了胜利，但付出了沉痛的代价——我们的经济，我们的人民，都遭受重创。现在，我们必须从这头死去的熊身上抽取属于我们的血债，就像北约的其余成员所将采取的那样。我们将竭尽全力，让俄罗斯继续被压制——她的经济、她的军事体系，都将成为我们制裁的目标。新兴的俄罗斯政府似乎正在暗中酝酿重组，试图再次恢复其失去的一切。根据总参谋部的建议，我们与整个北约将维持不同等级的戒备状态，并保持军事战备。万一那头熊再次苏醒并向我们扑来，我们已经准备好迎战。如果他们妄图取回他们所谓的“天赋权利”——那么我们将确保，他们在尝试的途中便已死去。"
 FRA_The_Spirit_of_Victory: "胜利的精神"
 FRA_The_Spirit_of_Victory_desc: "俄国人原以为，欧洲软弱无力，只会在他们步步推进、肆意征服的征途上袖手旁观。他们认为，即便欧洲出手，也不过是半心半意、行动迟缓的象征性干预。而事实证明——他们大错特错。我们迅速而果断地出兵，扭转了乌克兰濒临崩溃的战局，遏止了俄罗斯的攻势。尽管在此期间有过胜利，也遭遇过挫折，最终，在库班上空飘扬的，是法兰西的三色旗，而俄罗斯政府，已然崩溃瓦解。我们自然有意分享这场胜利的果实，我们的伙伴亦是如此。但在提出要求时，我们必须保持克制与远见。毕竟，不需要翻太多历史便可见——无论是真实的，还是被感知的“迦太基式和平”后果，终究是破坏性的。我们相信，这个新成立的俄罗斯政权，或许可以成为合作的对象，甚至是未来的朋友。毕竟，他们的政府，与我们又有何本质区别？理智告诉他们，与我们合作远比孤军奋战、甚至妄图重夺失地，更具现实意义。至于重新挑起战争的可能性？实在微乎其微，不值一提。尽管总参部仍有人坚持应保持警觉，但我们认为：未雨绸缪是否反而激发疑虑？动员防御是否会制造敌意？"
 FRA_Enter_the_New_Era: "战后新时代"
 FRA_Enter_the_New_Era_desc: "尽管我们已付出牺牲、赢得胜利，但这绝不意味着可以安于现状。我们为维护旧有秩序而战，并成功捍卫了它，但斗争从未真正结束。和平不能被浪费，我们必须竭尽所能，确保国内盟友团结而警醒，海外伙伴则武装精良、经济繁荣。德国的经济或许在欧盟框架下更具势力——在我们眼中，欧盟本身便是德国的延伸。但真正的世界强权，是法兰西。我们在西非的联系，确保资源与粮食源源不断地输往欧洲，也令我们国库充盈。然而，我们在该地区的合作伙伴，同样面临着竞争对手与战争威胁。即便北约无意对此投入资源，我们也绝不会袖手旁观。我们会不惜代价，确保我们在该地区的过去、现在与未来的投资不至于付诸东流。一个更强大的法兰西，就是一个更强大的北约。而我们这边的人，又有谁会对这点表示不满呢？"
 FRA_Announce_Snap_Elections: "宣布提前选举"
 FRA_Announce_Snap_Elections_desc: "随着战事结束，国内政治分歧重新显现。战时形成的临时合作联盟现已自然终结。虽然当前政府支持率较高，但反对派以“施政不力、战事处置失当”为由要求提前举行选举。尽管可以不予理会，但反对派仍具有一定影响力，可能对后续立法进程造成阻碍。若政府确实深得民心，当前局面反而可能成为巩固执政地位的契机，为未来施政提供更大空间。当然，民众支持度存在不确定性，但适度的政治风险本就是常态。"
 FRA_Declare_the_7th_Republic: "宣告第七共和国成立"
 FRA_Vote_on_the_Sixth_Republic: "宪法全民公投"
 FRA_Restoration_of_the_6th_Republic: "恢复第六共和国"
 FRA_russian_reperations_idea: "俄罗斯赔款"
 FRA_war_reperations_idea: "战争赔款"
 FRA_war_reperations_lessened_idea: "战争赔款"
 FRA_The_New_French_Sphere: "重建势力范围圈"
 FRA_The_New_French_Sphere_desc: "随着我们战胜俄国帝国主义，我们已无可争议地成为欧洲民主的守护者。然而，在这荣耀胜利的余波中，那些昔日受俄罗斯支配的地区留下了一个权力真空。我们，作为民主的守护者，必须捍卫我们的利益，并在这些曾经专制的土地上重建和平与自由。"
 FRA_Reclaim_the_Algerian_Departments: "收复阿尔及利亚部门"
 FRA_Reclaim_the_Algerian_Departments_desc: "自我们数十年前离去以来，阿尔及利亚始终在纷乱与动荡中蹒跚前行，无力掌控自身的命运。从分裂主义的阴影到边界之争的烈火，他们始终在危机的泥沼中挣扎。而今，他们亟需一只坚定的手扶持前行，而我们正是那个可以引领他们走向稳定的力量。这一步，亦是我们迈向非洲新秩序的起点。"
 FRA_VIC_Freedom_for_North_Africa: "解放北非"
 FRA_VIC_Freedom_for_North_Africa_desc: "十余载风云变幻，阿拉伯之春的余烬早已冷却，而留存于世的，仅有战乱、极端与无尽的死亡。在非洲，这场动荡最深刻的伤痕便是利比亚，自2011年以来，烽火未曾熄灭，而所有投身其中者，几乎一无所获。同时，利比亚的动荡已成为我们在北非的重大安全隐患，因此，现在是时候确保对该地区的掌控了。"
 FRA_VIC_Stabilize_West_Africa: "稳定西非"
 FRA_VIC_Stabilize_West_Africa_desc: "与俄罗斯的战争带来了始料未及的连锁反应——我们不得不撤回驻西非的大部分军事力量。此轮撤军严重削弱了该地区国家的法治执行能力，致使多股恐怖组织死灰复燃。如今本土威胁解除，是时候重振旗鼓，将战略重心转向遥远大陆的反恐战场。假以时日，我们必将彻底肃清极端伊斯兰势力的最后火种。"
 FRA_VIC_Demand_African_Resources: "要求非洲资源开发权"
 FRA_VIC_Demand_African_Resources_desc: "我们对非洲多国的持续援助已令其债台高筑。我方既承担着为其铲除恐怖主义、建设基础设施与经济体系、抵御各类威胁的重任，如今正是这些国家偿还债务之时——而他们只需动用其丰富的自然资源即可。想必管理众多矿产宝石实属不易，就让我们来代为保管这些“负担”吧。"
 FRA_VIC_African_Economic_Expansion: "在非经济扩张"
 FRA_VIC_African_Economic_Expansion_desc: "深化与西非诸国的协作关系，为我们带来了得天独厚的经济红利。这些前殖民地国家的基础消费品制造业尚处起步阶段，我们自然乐见其成，亦愿伸出援手。作为互惠回报，法兰西优质工业品将在西非广袤市场开疆拓土——何不开瓶香槟，共赏几内亚湾的壮美风光？"
 FRA_VIC_A_New_African_Union: "新非洲联盟"
 FRA_VIC_A_New_African_Union_desc: "随着西非与北非各国对我们的依赖日益加深，一个问题随之浮现：我们应当将这种影响力推至何种程度？答案显而易见。殖民主义早已成为历史，为了确保非洲人民的最大顺从，他们绝不能受控于某个遥远的国度。因此，我们决定建立一个真正强有力的非洲联盟——一个不再流于形式的联盟。它将推动发展、促进资源开发，并强化贸易合作，这将成为我们在非洲行动的巅峰之作。"
 FRA_VIC_In_the_Right_Hands: "正确之人"
 FRA_VIC_In_the_Right_Hands_desc: "自摆脱殖民统治以来，西非与北非的诸国始终在动荡与专制的阴影中徘徊，屡次沦为恐怖主义与独裁者的牺牲品。而今，它们已深陷我们的掌控之中，是时候确保这片土地不再重蹈覆辙。殖民主义的时代早已远去，而我们所推行的并非殖民，而是“协助管理”。在我们坚定而有力的引导下，非洲将迎来前所未有的稳定与秩序。"
 FRA_VIC_Operation_Aigle: "§Y天鹰行动§!"
 FRA_VIC_Pit_them_Against_Each_other: "鼓励反威权主义"
 FRA_VIC_Rebirth_of_Israel: "锡安主义重生"
 FRA_VIC_Clean_the_Slate: "从头开始"
 FRA_Protect_Canadian_Soveriegnty: "保障加拿大主权"
 FRA_Protect_Canadian_Soveriegnty_desc: "加拿大长久以来是我们最重要的盟友之一，自二战时他们作为对抗纳粹威胁的最勇敢战士之一，始终坚守民主原则与西方立场。然而，随着前美国陷入持续混乱，多方势力宣称加拿大应纳入他们理想中的美国版图。这些主张令人无法接受，我们将保护加拿大免受美国任何侵略之害。"
 FRA_Ensure_Continental_Interests: "保障北美利益"
 FRA_Ensure_Continental_Interests_desc: "纵使东欧局势渐趋缓和，席卷了合众国的风暴却未见停息。我们绝不容许那些盘踞在前美国版图上的个别势力羽翼再丰，任其坐大，否则数百万民众恐将因此堕入深渊。除却这份道义担当，我们更肩负着拯救昔日盟友的重任，毕竟他们曾屡次助我们化险为夷。此番行动既能偿还旧日恩情，又可在国际博弈中再添筹码，何乐而不为呢？"
 FRA_canadian_isolation_tt: "§C这将使加拿大人远离欧洲事务，并为魁北克人民争取独立。§!"
 FRA_The_Miquelon_Bill: "密克隆协定"
 FRA_The_Miquelon_Bill_desc: "大西洋彼岸潜伏着某种邪恶势力，并且伪装成了美利坚合众国。但它们已不再是两个半世纪前我们帮助从英国统治下解放出来的那个国家，它们最想做的就是剥削我们。尽管承认这一点令人痛苦，但美国已经不复存在。我们必须保护欧洲免受这一新的威胁，确保美国人留在他们的大洋彼岸。"
 FRA_American_Realpolitik: "胜者"
 FRA_American_Realpolitik_desc: "噩梦看来终于结束了。俄罗斯人自顾不暇，欧洲团结而强大，但最重要的是，第二次美国内战终于结束了。尽管他们现在可能软弱而破碎，但他们的历史并未终结，帮助他们在重建时期渡过难关的责任落在了我们和欧盟其他国家的肩上。我们曾帮助他们摆脱英国的统治，现在我们不能抛弃他们。"
 FRA_Franco_American_Diplomatic_Agreement: "美法外交协定"
 FRA_Franco_American_Diplomatic_Agreement_desc: "自2021年以来，我们终于再度踏足华盛顿特区。新一届美国政府向我们抛来橄榄枝，基于一项全新的外交协议发出邀请，我们亦欣然应允。谈判结果虽未尽如人意，却也称得上收获颇丰。美国尚无条件重新加入北约，但作为交换，他们承诺在时机成熟时回归。尽管今日的美国已不复昔日模样，我们仍期待与他们保持长期的合作关系。"
 FRA_Guiana_Gambit: "圭亚那博弈"
 FRA_Guiana_Gambit_desc: "尽管北约的名称限定于北大西洋，但其扩张从未受此限制。当前东欧局势对我们颇为有利，因此，我们的目光再次越洋南望。法国与巴西虽谈不上亲密无间，但合作尚算融洽，而我们希望进一步深化这层关系。然而，他们一向固执，想要让他们加入我们的阵营，尚需一些利益交换。虽然我们不想放弃在南美的领土，但法属圭亚那肯定会让这次交易更划算。"
 FRA_Stabilize_the_Caribbean: "稳定加勒比地区"
 FRA_Stabilize_the_Caribbean_desc: "近期美国与墨西哥的动荡局势犹如飓风过境，将原本相对和平的加勒比地区推入了危机之中，我们在该地区的领土也因此受到威胁。局势持续发酵，若无人强力干预，加勒比的惊涛骇浪必将吞噬整个区域。而除了我们和英国外也无其他国家有介入之正当性。在局势进一步升级前，我们将采取行动平息这片动荡的海域。"
 FRA_Enrich_Quebecois_Spirit: "充实魁北克灵魂"
 FRA_Enrich_Quebecois_Spirit_desc: "魁北克人民长期处于盎格鲁人的压迫之下，但他们从未被压垮。事实上，正是在这种压力下，他们的文化和人民才得以蓬勃发展，这证明了有些东西是永远无法被真正抹去的。为了继续扩大我们在北美洲的影响力，我们必须首先在魁北克人中找到支持，因此我们将资助扩大公众对其遗产和文化的了解。"
 FRA_Supplement_Quebecois_Industry: "支持魁北克工业"
 FRA_Supplement_Quebecois_Industry_desc: "要打动任何国家的心，方法之一就是通过有助于其经济发展的建设来援助他们。除了农业之外，最好的方式可能就是资助工业项目。魁北克有一系列正在进行的开发项目，而加拿大政府并未尽力支持这些项目，因此我们将介入其中。当魁北克出现大量新的工业工作岗位时，他们会记得是谁真正建造了他们的工厂。"
 FRA_Espouse_Cultural_Unity: "支持文化统一"
 FRA_Espouse_Cultural_Unity_desc: "法国的文化可以简化为三个词：自由、平等、博爱。然而，与任何国家一样，人们对文化的理解也因城而异，甚至因家而异。虽然所有法国人都拥有相同的基本价值观，但在细节上偶尔会引起争议。我们不能让人们为细枝末节的事情争吵不休，因此我们将全面展示我们文化的各个方面，让每个人都能看到我们是多么团结。"
 FRA_quebec_independence_tt: "§C这将迫使[CAN.GetFlag]加拿大举行[QUE.GetFlag]魁北克独立公投。§!"
 FRA_Restore_the_French_Union: "重建法兰西联邦"
 FRA_Restore_the_French_Union_desc: "法兰西联盟，那个曾经尝试过的半吊子殖民体系改革，随着第四共和国的终结而惨遭失败。与其保留海外省和殖民地，不如将所有地方都视为法国的一部分。尽管1950年代末的失败教训犹在眼前，但如今的共和国已具备驾驭广袤海外疆域的能力。这里没有次等公民，只有法兰西子民，我们的力量将再次得到充分展现！"
 FRA_Department_of_Haiti: "建立海地部"
 FRA_American_CW_Embargo_tt: "§Y北约将集体对所有美国内战派系实施贸易禁运§!"
 FRA_Further_American_Support_tt: "§Y我们将向选择的派系送出更多援助§!"
 FRA_VIC_African_Economic_Expansion_tt: "解锁£decision_icon_small §H决议§!：§Y进一步扩大对§R西非国家§!经济影响§!"
 FRA_VIC_In_the_Right_Hands_tt: "解锁£decision_icon_small §H决议§!：§Y进一步扩大对§R西非国家§!军事影响§!"
 FRA_VIC_Bitter_Winner_tt: "§R俄罗斯必须为那些被他们夺去生命的法国公民血债血偿……§!\n\n法国一直秉持着维护 £GFX_Federalization_Unity_texticon 欧洲和平稳定的原则，因此我们会保证[SOV.GetFlag]俄罗斯再也不会有能力侵犯欧洲主权。"
 FRA_VIC_Victorious_Spirit_tt: "§C欧洲已经迈入了新时代，真真正正的从战争中解脱……§!\n\n法国将着手于维护£GFX_Federalization_Unity_texticon 欧洲和平，就如我们曾经重建[GER.GetFlag]§Y西德§!那样帮助重建[SOV.GetFlag]俄罗斯。"
 FRA_death_counter_flag: "伤亡超过§R1万§!"
 FRA_The_Liberators_of_the_Caucasus: "高加索解放者"
 FRA_The_Liberators_of_the_Caucasus_desc: "没有我们和整个北约，高加索地区仍将处于俄罗斯扩张主义者的控制之下。既然我们已经费尽周折将他们从统治者的手中解放出来，我们就绝不能逃避对他们的责任。如果放任自流，他们要么会陷入混乱，要么会再次被北方的邻国吞并。这种情况绝不能发生，我们要确保高加索地区的国家从俄罗斯人手中保持独立，并牢记是谁解放了他们。"
 liberator_of_the_caucasus: "高加索解放者"
 FRA_Militarize_Kuban_Police: "库班警察军事化"
 FRA_Militarize_Kuban_Police_desc: "俄罗斯的战败催生了北高加索地区若干新兴国家，其中最具战略价值的当属库班共和国。然其新政府正苦于维持法治秩序，更遭俄方暗中支持的恐怖势力侵扰。为构筑东方战略屏障，法兰西将积极协助库班强化警务体系与行政能力建设。"
 FRA_Crimean_Investments: "克里米亚投资"
 FRA_Crimean_Investments_desc: "克里米亚半岛遭俄罗斯非法占据逾十载，其间沦为华而不实的军事基地，更因战火频仍而饱受摧残。所幸如今这片土地已回归更负责任的归属方——乌克兰。为展现善意并扩大东方影响力，我们将投资克里米亚重建工程，定要让其以比当初被夺走时更佳的状态重归故土！"
 FRA_EU_kill_EUrself_tt: "这将使我们无法完成剩余国策树，且接下来必须为£GFX_Federalization_Unity_texticon §C全面联邦化§!做好准备。"
 FRA_EU_sister_republic_tt: "这将使我们无法进入£GFX_Federalization_Unity_texticon §C全面联邦化§!路线，但可以创建[EUU.GetFlag]§Y法兰西-伊比利亚联邦§!。"
 FRA_Apologize_for_War_Contribution: "恢复她的荣誉"
 FRA_Apologize_for_War_Contribution_desc: "凭借勇气与牺牲，军队重振了法兰西的荣光。在祖国的至暗时刻，面对不实的失败指控，士兵们挺过难关，证明我们仍是无愧于法兰西之名的强国。我们从失败的虎口中夺回了一场伟大的胜利，这不仅属于我们，更属于整个欧洲。失败的耻辱已被抛诸脑后，如今我们能与欧洲各国一同展望未来，携手迈向更美好的明天。但愿乌克兰人为我们竖立足够多的雕像……"
 FRA_Demand_Increased_Reperations: "增加赔款"
 FRA_Demand_Increased_Reperations_desc: "我们已让俄罗斯人颜面扫地，但羞辱本身不足以弥补他们犯下的罪行。那纸和平条约过于仁慈，竟让他们得以轻易脱身，而他们造成的伤痕仍深深刻在这片土地上。若他们不愿承受更严苛的惩罚，便该付出应有的代价。善恶有报，因果不爽。"
 FRA_Bloodied_Liberator_of_the_Caucasus: "维持军队驻军"
 FRA_Bloodied_Liberator_of_the_Caucasus_desc: "我们还不能解除动员，至少现在还不是时候。尽管许多人宣称这是一个崭新的和平时代，但俄罗斯境内的秘密行动却似乎暗示着另一种可能。因此，我们将继续向高加索地区的军事驻地提供补给，并保持管控，以随时应对可能出现的威胁。俄罗斯人上次没能骗过我们，这次也不会。"
 FRA_Rip_out_the_Russian_Rot: "清除俄罗斯的腐败"
 FRA_Rip_out_the_Russian_Rot_desc: "我们从俄罗斯手中夺取的大片土地，正遭受其资助的恐怖分子与分离主义者的侵扰，严重阻碍了我们的重建与国家建设进程。然而，他们既已战败，就必须承受败者的代价。是时候将他们的残余势力彻底扫除，让这片土地真正归于我们的掌控。"
 FRA_Negotiate_Exclusive_Treaty_Ports: "专属条约港谈判"
 FRA_Negotiate_Exclusive_Treaty_Ports_desc: "自那场在东欧的拙劣豪赌落败后，俄罗斯已然陷入外交孤立，饱受重重制裁。而今，我们愿意伸出援手，给予他们喘息之机。若他们肯敞开几座港口，让西方的贸易与投资流入，我们自会在惩罚上稍作宽容。但若他们依旧冥顽不化，那失去良机的，也只能是他们自己。"
 FRA_Caucasian_Resource_Rights: "高加索资源开采权"
 FRA_Caucasian_Resource_Rights_desc: "高加索的山峦与原野之下，沉眠着无尽的珍贵资源。而我们长久以来的扶持，已使这一地区深受我们的影响，众多政客皆对我们心存感激，甚至负有承诺。法国的经济与军队，永远渴求更多的资源，而它们从不在意资源自何处而来。对这些领土而言，若想继续享受我们的庇护，那么付出这点代价，实在微不足道。"
 FRA_Fund_Ukrainian_Peacekeepers: "资助乌克兰维和部队"
 FRA_Fund_Ukrainian_Peacekeepers_desc: "乌克兰人民曾在战火中顽强抗争，如今，他们正竭力驯服那些从侵略者手中夺回的土地。然而，由于我们的大部分精力都集中在高加索，无法再派遣额外的部队协助乌克兰人。但我们完全可以为他们的行动提供资金支持——毕竟，一个虚弱的俄罗斯，才是我们最理想的局势。"
 FRA_The_Caucasian_Entente: "高加索的友好关系"
 FRA_The_Caucasian_Entente_desc: "时机已至，我们对高加索的承诺将不再仅停留于援助与资助，而是迈向真正的保障。如今，我们已拥有足够的实力，邀请这些国家加入北约，让他们永远不必再受俄罗斯的威胁。而即便有人犹豫或拒绝，我们亦不会撤回庇护——毕竟，我们不会放弃倾注的心血与资源。只要我们仍昂然挺立，高加索的天空，便不会被阴影笼罩。"
 FRA_The_Caucasian_Entente_tt: "我们将同阿塞拜疆、亚美尼亚、库班、格鲁吉亚签订一个由法国领导的共同防御协议，让俄罗斯再无崛起的机会。"
 FRA_Prevent_Another_Weimar: "防止魏玛再现"
 FRA_Prevent_Another_Weimar_desc: "20世纪的魏玛共和国在屈辱与混乱中轰然倒塌，最终在民主的废墟上催生了一场灾难，21世纪俄罗斯的溃败为我们敲响了警钟，我们绝不能让一个支离破碎的莫斯科重蹈覆辙，滑向复仇与极端的深渊。法国将挺身而出，确保俄罗斯战后的重建之路通往稳定与和平。"
 FRA_Democratization_of_Eastern_Minds: "东方思想民主化"
 FRA_Democratization_of_Eastern_Minds_desc: "俄罗斯的失败为东欧打开了民主之门。作为欧洲自由的捍卫者，我们将引领整个地区的思想变革。从华沙到基辅，我们将支持教育行动、媒体自由和公民社会，确保东欧人民摆脱专制阴影。民主的种子将生根发芽，茁壮成长，重塑东方。"
 FRA_Demand_Ukrainian_Leniancy: "要求乌克兰从宽处理"
 FRA_Demand_Ukrainian_Leniancy_desc: "乌克兰在与俄罗斯的战争中付出了沉重的代价。我们对他们的牺牲表示敬意，但胜利绝不能成为提出过分要求的借口。我们将敦促乌克兰在战后领土要求和赔偿方面表现出克制，促进和解而非怨恨。只有放下仇恨，乌克兰和欧洲才能共建持久稳定的未来。"
 FRA_UKR_leniancy_tt: "如果[UKR.GetFlag]乌克兰拒绝对其[KBK.GetFlag]占领区政府下工作的俄罗斯公民表现得更宽容，那我们会对其采取经济、政治行动。"
 FRA_Denounce_Azov_Influence: "抵制亚速营影响"
 FRA_Denounce_Azov_Influence_desc: "胜利的喜悦不应被极端主义的暗流玷污。我们注意到乌克兰境内亚速营的势力抬头，其激进思想与民主背道而驰。我们将公开谴责这种影响，让基辅政府处理这些隐患。我们不能让欧洲的和平被新纳粹主义的幽灵破，东欧的民主之路必须纯净无暇。"
 FRA_Capitalize_on_Caucasus: "高加索资本积累"
 FRA_Capitalize_on_Caucasus_desc: "高加索是俄罗斯影响力的软肋，也是我们的机遇。击败莫斯科后，我们将深化与高加索各国的合作，利用这一地区的资源与战略位置。从巴库的油田到第比利斯的贸易线，我们将推动经济投资与民主援助，确保高加索成为欧洲的盟友而非俄罗斯的附庸。"
 FRA_Uphold_Equality: "坚守平等"
 FRA_Uphold_Equality_desc: "我们将以平等为核心，重塑欧洲的未来，不分种族、性别或出身，每一个欧洲公民都应享有同样的权利与机会。在我们的引领下，从香槟的酒庄到东欧的村庄，所有人都能分享民主的果实。"
 FRA_Eastern_Democracy_Manifest: "彰显东方民主"
 FRA_Eastern_Democracy_Manifest_desc: "东欧民主化并非空想，而是必然。随着俄国霸权的崩塌，我们将引领东欧民主化的历史进程。从波罗的海到黑海沿岸，民主选举、法治精神与公民参与将彻底涤荡威权遗毒。自由之光将普照东方大地，二十一世纪的伟大民主浪潮将由此掀起。"
 FRA_VIC_Withdraw_from_integrated_command: "撤出联合指挥体系"
 FRA_VIC_Withdraw_from_integrated_command_desc: "尽管我们成功赢得了那场正义之战，抵御了俄国的侵略，但这场胜利无法掩盖北约内部的裂痕，也无法抚平人民心中的伤痛。昔日主导西方世界的美国失去霸权后，北约与欧盟内部的冲突与纷争，至今仍令人心惊。政客口中所谓的团结与友谊，在不确定的未来面前，竟是如此脆弱不堪。所幸，法兰西人民已洞察真相，并向历史发出变革的呼声。旧秩序已然过时，唯有将其彻底瓦解，方能为新时代奠定基石。从此刻起，法兰西不再参与北约的联合指挥体系。我们将坚定地站在任何愿与我们并肩而战的盟友之侧，以我们的意志，塑造新的世界格局。"
 FRA_VIC_Our_Own_Direction: "我们自己的方向"
 FRA_VIC_Our_Own_Direction_desc: "在最近的战事中，法兰西共和国武装力量再次展现了无可匹敌的实力，为整个国家带来了无上的荣耀。我军的战斗力，无疑已跻身欧洲最精锐之列，这一事实毋庸置疑。然而，我们并非出于对盟友的不忠，而是出于对国家责任的担当，必须正视我军官兵在战争期间及战后对盟军军备松懈、纪律涣散的忧虑。这些关切，理应得到政界领导人和军方高层的严肃对待。若要守护法兰西武装力量的独立性与光辉传统，维持其卓越的战斗力，并确保法国始终屹立于世界军事强国之列，我们必须坚定拒绝将法国军队并入所谓的“欧洲统一部队”这一荒谬构想。法兰西的军事建设，必须始终以自身利益为先，以国家安全为本，继续强化独立发展的道路。"
 FRA_VIC_With_Distinction: "了不朽功勋"
 FRA_VIC_With_Distinction_desc: "从奥尔良的奇迹到奥斯特里茨的烈阳，从保卫凡尔登到解放第三帝国蹂躏的巴黎，再到如今和东欧盟友们一起痛扁俄国侵略者，法国军队的辉煌战史与不朽功勋从未因时代与政体的变迁而褪色，其一以贯之的战斗精神也从未中断过传承。在当代法国士兵的身上，旧时的骑士精神与同袍情谊仍熠熠生辉。在以历史巩固凝聚力的同时，通过军队，我们还将进一步提醒法国人他们祖先的伟业，提醒他们如今所肩负的历史性责任。军队也将成为全法国社会的模范，在践行历史使命的征途中成为法国人民的先锋。"
 FRA_VIC_The_Frenchmans_Burden: "法国人的责任"
 FRA_VIC_The_Frenchmans_Burden_desc: "没有什么比成为首个推翻暴君、自己用双手为自己争取到独立和繁荣的国家的子民更令法国人感到自豪的了。不仅如此，世界上首个民主共和国的人民武装也是多年来法军用以提高自身凝聚力的重要法宝。为此，从中而体现出的法国人独一无二的天赋责任将成为在下一个时代我们团结法国社会与强化法国军队的核心要素。我们将向国民和世人们揭示，维护与传播自由、平等、博爱的理念是法国人民的伟大使命，这一使命是法国辉煌历史与人民奋斗的共同结果。在此基础上重构的法国公民意识也将给法国军队带来巨变。从今往后，他们将同时带着保卫现在和开拓未来的双重使命作战。"
 FRA_VIC_The_New_Grand_Army: "大军团"
 FRA_VIC_The_New_Grand_Army_desc: "每年7月14日的巴士底日是属于法国人的共同节日。在这一天，巴黎将成为红白蓝三色旗的海洋，而在市中心的凯旋门之下，威严的法军精锐部队的代表们将迈着整齐的步伐，在这座宏伟的大理石拱门下展现法国人民团结一致的伟大力量与法国不可侵犯的国家尊严。寒光凛凛的步枪，骑兵的黄铜盔甲与红色盔缨，勒克莱尔坦克高昂的炮口与碾过柏油马路的巨大履带无不使人在感到敬畏的同时心潮澎湃。为此，我们将继续通过展现法国军队的力量以凸显法国军队的独一无二，唤醒全体人民的自豪感，同时提醒军人们他们的灵魂根基所在，使之意识到自己并非空耗一腔热血以保家卫国。在任何时候，祖国都将与他们同在。"
 FRA_VIC_Return_to_Old: "未曾有变的法国军队"
 FRA_VIC_Return_to_Old_desc: "经过一段时间的重构和锻炼，法国军队展现出了其历史上最好的面貌，足以与大孔代、拿破仑、福煦和塔西尼手下的那支百战百胜之师相媲美。事实证明，法国军队足以战胜各种残酷的考验，在严峻的现实面前不改其本色而仍能震慑一切宵小。我们的政治领导人与高级将领们对军队的现状感到十分满意，并已做好准备，随时在未来可能爆发哦的又一次全面战争之中投入这支强悍的军队，并对这支军队所将取得的伟大胜利抱有充足的信心。"
 FRA_VIC_Strengthen_NATO: "坚定我们的承诺"
 FRA_VIC_Strengthen_NATO_desc: "若在今日仍有人质疑北约在欧洲防务中的关键作用——尤其是在美国因内乱无力支援、俄国因扩张野心发动的侵略战争最终落败之后——那么，他们的目光无疑过于短浅，而这种短视可能会给西方文明带来深远的危害。幸运的是，我国及盟国的领导人依然坚定不移地支持欧洲一体化道路，并果断采取措施，加强军事合作，以确保欧洲的未来安全。作为欧盟最重要的军事力量，也是抵御东方威胁的核心力量，法国武装力量将继续作为欧洲安全的中流砥柱，随时准备迎接未来的挑战。"
 FRA_VIC_The_European_Army: "欧洲军"
 FRA_VIC_The_European_Army_desc: "法国总统埃马纽埃尔·马克龙始终倡导建立一支“独立的欧洲武装力量”，然而，这一构想长期以来遭到了美国的阻挠，同时也被欧洲内部那些仍对美俄抱有幻想之人所质疑。他们害怕，担心挑衅任何一方超级大国可能引发灾难性的军事或经济后果。然而，时至今日，这些忧虑已被现实无情击碎。欧洲再也无法奢望依赖任何超级大国来保障自身的安全。过去四十年来，欧洲国家间的小规模军事合作已在近期的战争中证明了其战略价值，而今正是布鲁塞尔与各国政府果断行动之时。欧洲必须不再犹豫，必须以坚定的意志，将“欧洲军队”这一夙愿化为现实，确保欧洲的独立与安全。"
 FRA_VIC_Our_Place_in_Europe: "我们在欧洲的作用"
 FRA_VIC_Our_Place_in_Europe_desc: "法兰西，欧洲的政治中心、经济引擎、军事重镇……用何种词汇来描绘法国对当代欧洲的重要性都不为过。具体到军事层面，为体现出法国军队的领导作用并巩固我们在欧盟体系中的领先地位，我们将推动法国军队与盟友部队之间更广泛的合作。通过制定统一的训练条例和军队编制方案，开战军校学员交流，以及举行全天候多层次的三军联合演习，法国军队的高素质与优秀经验足以令任何一支欧洲军队刮目相看。而随着愈来越多的盟国开始模仿法军来建设自己的军队，我军的影响力和在未来战争中所能指挥的联合部队规模的上限也将随之水涨船高。"
 FRA_VIC_The_French_European_Army: "法欧联军"
 FRA_VIC_The_French_European_Army_desc: "经过长时间的共同建设与磨合，我们可以自豪地宣称，法国军队的模版已经在多个欧洲国家的军队中得到了应用；法军的指挥系统和作战部队足以与这些国家“无缝衔接”，在短时间内就能够让临时组建的联合部队充分形成战斗力。来自巴黎、柏林、布鲁塞尔、阿姆斯特丹、罗马等地的政治领导人与军事家们一致同意，建立永久的欧洲联合武装的时机已然到来。在这支在学习法国军事经验基础上组建的多国部队中，来自不同国家、操着不同语言的军人们将共同承担起守护欧洲文明的任务，而在这其中，法国军队与法国最高指挥部将发挥无可替代的核心作用。"
 FRA_VIC_A_Distinctly_French_Force: "独一无二的法国军队"
 FRA_VIC_A_Distinctly_French_Force_desc: "如果我们真的将欧洲与法国的安危置于最高位置，那就绝不能允许任何幻想和空谈干涉我们的行动。经过内部的广泛讨论，我们的政治领导人与军事家们一致认为，保证法国军队的独立性才是建设可靠国防，保卫欧洲文明的最佳选择。欧洲联合武装所可能面临的种种问题，譬如指挥链混乱，语言与文化冲突等也都是我们放弃联合部队计划的重要原因之一。法国将在此基础上继续为其他盟友国家的军队提供帮助。凭此策略，法国军队将在维持自身骄傲的同时继续担当欧洲最强大的守护者、欧洲军队的楷模等诸多角色。"
 FRA_VIC_The_New_French_Army: "焕然一新的法国军队"
 FRA_VIC_The_New_French_Army_desc: "法兰西新阶段的军事改革已进入尾声。我们可以问心无愧的宣布法国军队仍然是欧洲当之无愧的最强军队。不仅如此，比起之前的自己，法国军队的锋芒更令其敌人胆寒，其内部组织也更加高效和坚韧，在攻防两个层面都达到了顶峰。玛丽安娜将为我们的事业感到自豪，而这一切若非推行了大胆的改革，给法军带来了脱胎换骨的变化而不能实现。"
 FRA_End_of_War: "终结战争"
 FRA_End_of_War_desc: "当战火的硝烟渐渐散去，和平的甘甜气息弥漫天地，既令人怀念往昔，又让人倍感振奋。俄国的威胁已被彻底化解，它如今孱弱无力，只能静待命运的审判。在这胜利的时刻，从国家领袖到普通公民，整个法兰西都怀揣着相同的愿望——尽快终结战争状态，减轻沉重的军费负担，让社会与国民经济得以喘息与复苏。尽管“自我解除武装”的担忧仍然存在，但旨在重建和平、推动欧洲非军事化的法案即将提交国会审议。法兰西人民坚信，在这个崭新时代，和平的承诺与全民团结的力量，将足以遏制任何大国复兴的野心，也能杜绝任何新的军国主义阴谋。"
 FRA_End_Conscription: "结束征兵"
 FRA_End_Conscription_desc: "征兵制在法国的施行有着悠久的历史。凭着这一政策，法国在数个世纪内时刻拥有一支充满活力的军队，而每当危机发生时，受过军事训练的广大人口也足以提供一支能解燃眉之急的预备役部队，最近的例子便是在抵抗俄罗斯的战争中，被动员起来拿起武装的法国人民展现出令人惊叹的勇气和适应战场的能力。尽管为国家与国民履行自己的服役义务仍可算得上是一件令人自豪的事，但随着战争结束，21世纪前二十年的和平记忆重回法国人脑海，现实条件的变化业已敦促我们在政策上再次做出改变。“公民军队”早已不再适应现代化战争，一支“职业军队”完全能够比前者更出色的完成保卫国家的任务。"
 FRA_Surrender_the_Military: "逼降军队"
 FRA_Surrender_the_Military_desc: "尽管我国的政治领导人们已经做出了决定，即法国必须在欧洲联合武装的框架下开展武装力量的建设与军事战略的制定，但国防部与参谋总部的将军们仍是那样的顽固。他们固守着自己的骄傲与一亩三分田的利益而拒绝出让对他们来说极为宝贵的哪怕只有一丁点的权力。在欧洲局势风云突变，已然更加凶险的当下，我们没有那么多时间跟他们纠缠。通过“胡萝卜加大棒”的策略，将军们的兵权将被体面地，从而达成我们的目的。"
 FRA_VIC_surrendered_the_military_tt: "这会把我们的§G所有军队§!转移给我们坚定的盟友[GER.GetFlag]德国，然后会为日常防御建立一支§Y精锐部队§!。"
 FRA_VIC_surrendered_the_military_tt_desc: ""
 FRA_Maintain_Military_Strength: "保持军事实力"
 FRA_Maintain_Military_Strength_desc: "国防部与总参谋部已成功说服国家领导层，维持现有军队规模乃是不可动摇的战略决策。如今的法兰西，已无法再将目光局限于自身利益之上。东方的威胁尚未彻底消弭，欧洲多地仍烽火未息，而北美、东亚与中东的战乱更是绵延不绝，生灵涂炭。在这动荡的时代，和平主义者的空谈并不能为国家带来实际的保障，反而可能令我们再次步入1940年的危机之境。唯有强大且精锐的法兰西军队，方能应对任何挑战，确保国家安全，并向世界证明，“自由、平等、博爱”这一信念依旧是我们不可撼动的立国之本，仍然熠熠生辉。"
 FRA_National_Demobilization: "全国复员"
 FRA_National_Demobilization_desc: "从维护法兰西主权、安全与国家利益的角度来看，目前的军队规模已超出必要范围，庞大而冗余。事实上，大规模裁军的议题早已在法国政坛与社会中广泛讨论，而今天，一系列相关政策将正式颁布。然而，在精简军队结构的同时，我们必须铭记并尊崇那些曾为自由与正义而浴血奋战的勇士，向他们的牺牲致以最崇高的敬意。同时，我们将以负责任的态度妥善安置退伍军人，并打造一支更加精锐、高效的军队——一支历经战火洗礼、能迅速响应挑战、确保任务成功的真正铁军。"
 FRA_VIC_The_conservative_revolution: "保守革命"
 FRA_VIC_The_conservative_revolution_desc: "自由派许诺的所谓“历史终结”并未到来，苏联解体后本应迎来的和平也从未实现。反观当今世界，甚至比几十年前还要动荡不安。值此多事之秋，我国亦饱经磨难，人民渴望变革。民众纷纷站出来支持保守派重新掌权，引领法兰西重归正轨。"
 FRA_VIC_Our_Bountiful_Economy: "繁荣的经济"
 FRA_VIC_Our_Bountiful_Economy_desc: "新冠肺炎疫情与美国崩溃导致经济增长持续数年疲软，但随着俄罗斯的威胁被排除，欧洲共同体一体化程度达到历史新高，我国经济实现强劲复苏。如今既已无需忧虑东方威胁，我们定能确保这段经济繁荣期不被虚掷。"
 FRA_VIC_Economic_Patriotism: "经济爱国主义"
 FRA_VIC_Economic_Patriotism_desc: "法国近期的经济繁荣只有一个归因：法国人民的辛劳工作。为此，那些会为其他欧盟国家带来好处的议程将被搁置在关照我们国民的决议之后。当然，我们并不想削减对欧盟的支持，但政府将遵照一个简单的逻辑：我们应该在投资罗马尼亚企业前先为本国的中小企业注入资金。"
 FRA_VIC_Bask_in_the_Light: "沐浴烈阳"
 FRA_VIC_Bask_in_the_Light_desc: "我们夜以继日的奋斗已经成功为颓废的经济重新注入活力，而基层的人民感受毫无疑问的最深刻。公共服务在政府大力投资下达到了前所未有的完善，小型企业与公司因我们的补助而蓬勃发展，通货膨胀更是下降了数个百分点。越来越多的人民做到了外有屋顶、内有营养，而政府更应继续努力来确保这个趋势继续下去！"
 FRA_VIC_The_French_Golden_Age: "法兰西黄金时代"
 FRA_VIC_The_French_Golden_Age_desc: "法兰西的努力在这一刻达到了巅峰。过去数十年来，法国在二十世纪接连的灾难与2020年代的动荡下，再未能如她曾经一般伟大过。但随着接连的奇迹发生，我们已经能骄傲的宣称老玛丽安娜已经达到了她未曾达到过的高点，并重新跻身大国行列之一。人民安乐、军队精锐、经济繁荣—以如此带来的自信，我们将以一个团结而强健的国家之姿，直面迎战接下来任何的重大事件！"
 FRA_VIC_Our_Native_Land: "我们的故土"
 FRA_VIC_Our_Native_Land_desc: "法国是历史悠久的老牌大国。虽然路途波折艰难，但她的人民一直坚守着这块属于法国的土地。随着东方的俄罗斯被击败，我们再一次保护了法国免受灭顶之灾。外部威胁瓦解之后，我们终于有空闲检视国内事务，确保法兰西共和国的伟大名不虚传。直到法国的经济发展与美丽景色都达到顶峰之前，我们一刻都不会停下。"
 FRA_VIC_Spirit_of_Degaul: "夏尔·戴高乐之魂"
 FRA_VIC_Spirit_of_Degaul_desc: "戴高乐将军是法国历史上的众多英雄之一。正是由于他的努力，我们的家园才在第二次世界大战期间从法西斯侵略者手中解放出来，我们才能够从多年的占领中重建家园。虽然他已逝世多年，但他所体现的法兰西精神却永存于世！法兰西民族必须保持自由，为此我们必须保持强大！"
 FRA_VIC_For_Every_Drop_of_Blood: "寸土淌血"
 FRA_VIC_For_Every_Drop_of_Blood_desc: "每场战争的胜利都要付出高昂代价，我们亦未能幸免。无数法兰西青年儿女在与俄军的浴血奋战中献出生命，以血肉之躯抵挡住侵略狂潮。他们虽成功御敌，但若虚掷和平机遇，烈士鲜血将尽付东流。我们唯有善用这段和平时期厉兵秣马，为下一场大战做好准备，确保届时法国儿女的牺牲降至最低。"
 FRA_VIC_Revile_Russian_Autocracy: "斥责俄罗斯专制"
 FRA_VIC_Revile_Russian_Autocracy_desc: "虽然许多人称赞欧陆战争的结果预示着俄罗斯民主的新时代，但稍有常识的人都会意识到，一切并没有改变。没错，领导层是发生了变化，这个国家也不再公然扩张，但从根本上说它还是那个俄罗斯。他们迟早会卷土重来，在此之前，我们必须想方设法削弱他们。"
 FRA_VIC_Our_Free_People: "我们自由的人民"
 FRA_VIC_Our_Free_People_desc: "或能试想若法国不是一个自由人的国度？虽然我们与生俱来的人权遭受过挫折与挑战，但暴君们在法国人对自由的渴求下，从来未能长时间的剥夺公民权利。近期，对俄罗斯的胜利再一次证明了法国男女对自由的信仰没有丝毫的动摇，并愿意为了它赴汤蹈火。自由的火炬永不灭—我们将尽一切努力确保这立国的根本。"
 FRA_VIC_The_France_of_Today: "今日法兰西"
 FRA_VIC_The_France_of_Today_desc: "法兰西拥有绵延千载的历史长河。从高卢部落到罗马军团，从查理曼帝国到拿破仑王朝，如今的法兰西与往昔早已不可同日而语。但此刻我们无意沉溺于往昔荣光，所有人关注的都是只争朝夕。今日的法兰西，乃是一个不懈追求为民众创造更美好生活的国度。只要保守派继续执政，这一目标就始终是我们的奋斗方向。"
 FRA_VIC_Denounce_Liberal_Authoritarianism: "谴责自由威权主义"
 FRA_VIC_Denounce_Liberal_Authoritarianism_desc: "敌人形形色色遍布全球，因此合乎逻辑地，国境之内亦存隐患。最接近本土的威胁当属极左翼势力——共产主义者、无政府主义者之流，他们最大的愿望莫过于颠覆现行政治结构，代之以更恶劣的制度。然而这种途径注定只能存留于其幻想之中，因为我们将竭尽所能阻止其成为现实。"
 FRA_VIC_The_Red_Banner: "红旗"
 FRA_VIC_The_Red_Banner_desc: "法国的未来在何处？在击败了东方集团与俄罗斯政权——一个既不“自由”也不“民主”的政权——后，许多人质疑法国将如何迎接这个新的世代？不过，法国人民已经以他们的选票做出决定了：左翼的多党大联盟将以多数派之姿进入政府，而这次，他们有着更远大的愿景—为法国社会做出根本的改变：建立一个真正以人民出发的福利国度、并为法国带来一连串的转型正义改革。或许，在我们一生之中，红旗在整个欧洲扬起的愿景能成为现实。"
 FRA_VIC_United_in_Equality: "平等造就团结"
 FRA_VIC_United_in_Equality_desc: "“平等”——多么美好的词汇，一个无数世代共同的追求。从古代吟游诗人传唱的乌托邦式平等国度，到马克思共产主义者为之奋斗的伟大社会，消除一切身份与阶级差异的理想从未被遗弃。值此拥抱法兰西新生之际，我们赓续这份理想，让平等之花绽放在自由的大地上。在无数英烈精神的感召之下，我们深信全体公民将以空前团结之姿投身这项伟大事业。"
 FRA_VIC_Redefine_the_French_Citizen: "重新定义法国公民"
 FRA_VIC_Redefine_the_French_Citizen_desc: "何谓法兰西公民？对此问题，众人或有不同解答：出生地、语言、文化，乃至族裔与种族。界定法国人的身份认同，是构建现代民族国家的关键步骤。如今，对此问题的新解答在决定我国社会主义改革方向中发挥关键作用。唯有统一对此概念的认知，方能为推进真正造福人民的伟业筑牢根基。因此，我们将欢迎任何认同并珍视法兰西文化的公民，拥抱所有视此土地为家园的民众，共组法兰西大家庭。拥有光辉历史荣光的法国人民，即将迈入新时代的第一步。"
 FRA_VIC_End_Neo_Colonialism: "终结新殖民主义"
 FRA_VIC_End_Neo_Colonialism_desc: "新殖民主义，这个由资本孕育的多爪巨妖，数十年来肆虐世界人民，它所摧残的国家与个体不计其数。可耻的是，法兰西作为西方文明的长女，曾参与压迫其他大陆人民的罪恶事业。我们当以坚定不移的赎罪决心弥补历史过错。在黑暗大陆腹地，法兰西解放者将带来自由与正义。我们郑重承诺将倾注所有资源与力量，为饱受苦难的人类同胞恢复尊严、创造幸福。这一次，残暴的殖民者将被彻底根除，普世阳光必将温暖照耀众生。"
 FRA_VIC_Revolution_without_Revolution: "没有革命的革命"
 FRA_VIC_Revolution_without_Revolution_desc: "我们终于成功了！历经无数惊涛骇浪，见证荣耀与悲怆交织的时刻，巴黎圣母院的钟声此刻正为法兰西人民的伟大事业鸣响庆贺。革命暴力与血腥的记忆已然褪色，我们在法兰西土地实现的壮举，如今可称之为“没有革命的革命”。法国人褪去旧时代的桎梏，已然成为新纪元的开拓者。在这片充满梦想、繁荣、和平与友谊的伟大国度，你我的故事方才启幕。"
 FRA_VIC_Ground_Up_Army_Reform: "彻底的军队改革"
 FRA_VIC_Ground_Up_Army_Reform_desc: "法兰西军队长久享有的威望与尊崇常被视为理所当然。然而细察其现状，呈现出的却是一幅不尽如人意的图景。若要推进既定改革，军队便是我们必须应对的首个重大挑战。多年来，保守反动的观念与根深蒂固的等级制度压制了进步亲民的呼声，致使军队与法国社会进一步疏离。因此我们必须对体制进行彻底革新——扫除陈规、涤荡积弊。此过程年免引发动荡与不可预见的挑战。但正如老话所说：“欲煎蛋卷，必先破壳”。从长远看，与人民紧密团结的军队必将为法兰西历史书写崭新篇章。"
 FRA_VIC_Compensate_the_Veterans: "补贴老兵"
 FRA_VIC_Compensate_the_Veterans_desc: "毫不夸张地说，今日法兰西的社会主义红旗，正是浸染着无数英勇抗击东方暴君的战士鲜血而愈发鲜红。因此，对这些英雄的崇敬与感恩，无论怎样都不为过。法国政府将通过具体行动而不仅是宣传，向退伍军人表达深切敬意：退役农民将获得土地与技术支持以改善生活；重返城市工厂的诚实劳动者将享有优厚福利与就业保障，确保千万家庭幸福安宁。我们将证明自己是比昔日资产阶级政府更具责任感的政权——更关注民族英雄的未来。荣誉军团勋章的鲜红绶带，将成为授予他们的至高荣典。"
 FRA_VIC_Demobilize_the_People: "遣散民众"
 FRA_VIC_Demobilize_the_People_desc: "阻碍或压制人民的自主斗争与正当诉求绝非我们所愿。唯有通过全体民众的自发行动，改革才能真正落地生根，而这正是我们作为“人民政府”的立身之本。若社会进步的果实不被人民珍视和捍卫，终将沦为镜花水月。当和平曙光洒遍法兰西和欧罗巴之际，正是彻底解除加诸法国人民身上一切有形无形枷锁之时。见证法国劳动者正释放创造力与能动性，以大胆探索与奋斗之姿，用双手勾勒自由国度的蓝图，令人振奋。"
 FRA_VIC_Expand_the_Rights_of_Man: "拓展人权"
 FRA_VIC_Expand_the_Rights_of_Man_desc: "“人权”应如何定义？有些人主张人权关乎经济发展与追求富裕生活的权利，但这种物质主义视角忽视了人民正当的精神需求。另一些人则强调“言论自由”与“文化多样性”，但这些理念往往异化为政治议题，引发对立与分裂。为避免重蹈历史覆辙，我们必须提出符合法国当前国庆、能指引法兰西民族未来的新定义。人权必须超越政治工具属性，昔日革命战士坚守的正义与原则，必将在二十一世纪焕发新生。"
 FRA_VIC_Form_A_Pink_Red_Coalition: "粉-黄-红联盟"
 FRA_VIC_Form_A_Pink_Red_Coalition_desc: "历经多年为法兰西人民福祉奋斗，法国左翼进步力量终可展翅翱翔，为这片土地带来社会主义新风，驱散旧时代的阴霾。要实现这一目标，必须在现有政党联盟基础上构建广泛而稳固的执政根基。主要由不屈法国、法国共产党、社会党以及欧洲生态-绿党组成的新人民阵线，当前亟需通过吸纳其他亲左翼政党来增强自身力量与内部团结。同时须完善沟通协作机制，成为代表人民意志、反映民声的更优渠道。对新人民阵线而言，这个新时代标志着新一轮斗争的开始。但只要获得法兰西人民的坚定支持，一切挑战与阻碍终将被跨越。"
 FRA_VIC_The_Left_Prevails: "左翼胜利"
 FRA_VIC_The_Left_Prevails_desc: "有人怀疑真正的社会主义能否在今天的欧洲占有一席之地。即使是自称社会主义的政党上台执政，其领导者也往往是糅合了新自由主义思想的小资产阶级，他们向大资本和既得利益者低头以换取合作。但在今天的法国，这种言论已成为过去。由于我们战胜了俄罗斯独裁者，赢得了合法选举并实施了大胆的社会改革，法国左翼联盟已成为法国政治的真正力量，我们赢得了人民真诚而热情的支持，并在多个领域表现出色。即使旧秩序的残余势力拒绝接受失败，妄图破坏我们的事业，法国人民也绝不会允许。"
 FRA_VIC_Peace_Land_and_Bread: "和平，土地和面包"
 FRA_VIC_Peace_Land_and_Bread_desc: "对普通法国公民而言，幸福生活既可象征诸多美好事物，亦可简化为几项最珍贵的基本需求。“和平、土地和面包“——这个自法国大革命传承至今的古老口号，历经两次世界大战洗礼仍焕发时代价值。它昭示着：即使最深重的苦难也无法摧毁世代传承的希望与梦想。作为法兰西人民的代表与坚定公仆，我们必将确保这些珍宝永不再从人民手中滑落。这既是对历史的回响，更是面向未来的豪迈宣言。"
 FRA_VIC_The_Republic_Eternal: "共和国永存"
 FRA_VIC_The_Republic_Eternal_desc: "说法国历史多舛绝非夸大其词。从革命到清算，从占领到动荡，稳定始终是短暂的。然而，正如丘吉尔在冷战时期所忧虑的，俄罗斯的威胁终究向西逼近，试图践踏东欧民主，重塑其在欧洲大陆的霸权。但我们并未袖手旁观，而是挺身而出，对抗俄国的专制统治。在看似不可逾越的困难面前，我们毫不退缩。如今，硝烟散去，枪声平息，我们与盟友携手，共同从毁灭的深渊中挽救了法国与欧洲。如今，我们目光投向未来，准备迎接一切挑战，坚信共和国的光辉将亘古长存，无论前方风云如何变幻。"
 FRA_VIC_Divided_by_Ideas: "被理想分割"
 FRA_VIC_Divided_by_Ideas_desc: "说欧洲是思想的沃土，绝非夸大其词。从《利维坦》到《共产党宣言》，这片大陆孕育了无数影响深远的思想流派。历史上，无论是绝对君权时代，还是冷战时期的铁幕，各大帝国与强权皆试图在欧洲强加统一的意识形态。然而，我们为何要步其后尘，强行塑造欧洲的思想版图？相反，我们应当接受欧洲真正的本质——这不仅是一片由诸多国家交织而成的土地，更是一幅承载着多元思想的宏伟画卷。在这里，每一种理念都能自由生长，每一种思想皆可无惧评判地绽放。"
 FRA_VIC_Past_the_Darkness: "穿越黑暗"
 FRA_VIC_Past_the_Darkness_desc: "随着美国的衰落，许多人利用这场灾难宣称我们珍视的自由民主制度都处于崩溃边缘，注定陷入停滞并最终被激进势力推翻。然而，我们战胜那些妄图成为俄罗斯暴君之人及其征服东欧野心的胜利，已证明这些唱衰者是错误的。当然，我们仍然面临着诸多国内和国际层面的挑战。但我们珍视的自由制度始终建立在对话协商和民主决策的基石之上，这确保无论经历何种风暴，我们都能以最符合集体利益的方式应对挑战。"
 FRA_VIC_Onto_the_Light: "走向光明"
 FRA_VIC_Onto_the_Light_desc: "病情阴霾笼罩，二十年代的动荡亦曾重创世界，但我们未曾迷失方向。我们曾抗击暴政，如今，我们再一次挺过风暴，即便没有昔日的美利坚庇护，我们依旧屹立不倒。那些曾被嘲笑为愚蠢和盲目的乐观，最终成为我们穿越危机的信念支柱，使我们比以往更加坚韧。这种全国性的意志觉醒，激发了更积极的政治参与，更高的出生率，以及人民在面对困境时，为理想而战、为信仰赴死的决心。让这一时代，成为自由民主彻底战胜专制与压迫的时代。让我们的精神，成为世界不灭的火炬，照亮人类前行的道路。"
 FRA_VIC_The_French_Shining_Bright: "闪耀的法国"
 FRA_VIC_The_French_Shining_Bright_desc: "我们走得如此之远，不仅是作为一个国家，更作为一个团结无畏的法兰西民族，在风暴之中，昂首向前。曾有人预言，内忧外患将使我们的国家倒下，激进的风暴会吞噬我们的自由，而外强的枷锁将禁锢我们的灵魂。但如今，世界见证了何谓法兰西，何谓自由的意志！我们在烈焰之中锻造出真正的文明，我们以理性与妥协巩固了自由民主，让共和国的旗帜在风雨中更加鲜明。经济的阴霾已被驱散，战斗与牺牲重燃我们的信念。在黑暗之中，我们没有被民粹的狂热吞噬，没有向谎言低头，我们选择了一条属于法兰西的道路——自由、理性、无畏前行的道路。让我们继续前行，让法兰西成为自由之炬，让今日的我们，无愧于当年掀翻巴士底狱、粉碎旧秩序的革命先驱。让我们成为欧洲团结的脊梁，使每一个国家，不论疆域大小，都能并肩站立，形成一座坚不可摧的长城。\n\n然而，就在此刻，东方的夜幕之下，暴政之手再度蠢蠢欲动。俄罗斯正在舔舐战争的伤口，密谋再度席卷欧洲，将自由彻底碾碎。我们深知，若法兰西的光辉消逝，若我们让世界陷入黑暗，我们所面对的，将比以往任何一次灾难都更加深重。他们不会再给予怜悯，不会再留有余地，他们将以铁血与暴政碾碎一切，而我们，必须以自由的光芒刺破他们的黑暗。让我们铭记这一刻，让我们为即将到来的决战做好准备。当法兰西再一次迎战东方的暴君，当他们窥视这片大地时，他们将听见一个震撼寰宇、永不熄灭的呼声——\n\n§B“法兰西万岁！”§!"
 FRA_VIC_Fraternity_of_Nations: "博爱之国"
 FRA_VIC_Fraternity_of_Nations_desc: "欧洲的统一，向来是一个耐人寻味的命题——有人将其视为理想之光，有人则将其斥为枷锁。然而，在致暗时刻，正是欧洲各国的集体力量击败了邪恶。无论是纳粹帝国的覆灭，还是我们最近对抗好战的俄罗斯的胜利，若非团结一致铲除暴政，我们早已四分五裂，被各个击破。然而，战争尚未结束。尽管我们暂缓了俄罗斯的推进，莫斯科正在养伤蓄势，伺机复仇。若我们不进一步强化对集体安全的承诺，终将遭其席卷吞噬，毁掉我们辛苦建立的一切。"
 FRA_VIC_Cement_our_place_in_Europe: "我们在欧洲大陆的作用"
 FRA_VIC_Cement_our_place_in_Europe_desc: "即便俄罗斯的獠牙已被折断，我们依然不可遗忘自身的职责——我们不仅是祖国的守护者，更是整个欧洲的屏障。我们不仅拥有欧洲最强大的军队之一，更以雄厚的工业力量，撑起欧元区与欧洲单一市场的脊梁。有鉴于此，强化这些体系不仅能巩固我们作为欧洲价值观捍卫者的地位，还将确保我们的影响力得到提升，与德国和英国等国并肩成为欧洲的领导者。此外，如果我们在这项职责上动摇，谁能保证一个复兴的俄罗斯或其他暴政势力不会扑灭我们大陆珍视的自由与共享的兄弟情谊呢？"
 FRA_VIC_Europe_United: "欧洲，统一"
 FRA_VIC_Europe_United_desc: "我们刚刚经历的战争，被世人称为“欧陆战争”——一场让整个欧洲大陆，在没有美利坚援助的情况下，独自抵御俄罗斯暴政冲击的伟大战役。曾几何时，有人认为美国是我们的唯一屏障，但我们用铁与血证明，欧洲团结一致，便能抵御任何来袭的风暴。基于此，我们必须确保欧洲联盟等组织能够获得必要的支持，以加强欧洲的凝聚力与合作。这一进程已在历史中结出硕果，而未来，我们必须推动它继续深化。尽管我们不会走向某些联邦主义者的极端，但进一步加强欧洲经济与军事一体化，将成为保障欧洲长久稳定的关键。只有如此，当复苏的俄罗斯再度崛起，或其他专制势力试图践踏我们的民主时，欧洲才能稳如磐石，毫不畏惧。"
 FRA_VIC_Strong_in_our_Resolve: "坚定我们的决心"
 FRA_VIC_Strong_in_our_Resolve_desc: "过去的数年向我们昭示了一个残酷的现实——这个世界，没有安逸可言，亦容不下任何侥幸心理。若我们未能及时重整军备，若我们仍寄希望于北约之中的美利坚援助，那么在东线暴风骤至之时，我们便只能束手待毙，眼睁睁看着欧洲的自由民主走向毁灭。然而，我们没有退缩，我们直面威胁，无论是国内的动荡，还是国际的危机，都未能撼动我们的决心。我们以钢铁与意志捍卫了自己的生存，我们向世界证明了——欧洲，能够在没有外援的情况下，独自抵御专制的狂潮。但如今，我们却目睹了一种危险的自满情绪正在滋生。许多人沉浸于胜利的幻梦之中，误以为我们对抗俄国暴政的胜利便是最后一次考验。然而，历史不会终结，威胁亦不会止步于此。即便战胜了眼前的敌人，我们仍必须保持坚定，必须随时准备迎接新的风暴，不仅是来自东方的阴影，更是来自世界各地的挑战。若我们稍有松懈，若我们未能警惕，新的暴君将趁势崛起，而他们的残暴，将远胜于我们方才击败的敌人。这样的命运，我们绝不能接受。"
 FRA_VIC_United_in_Liberty: "在自由旗帜下联合"
 FRA_VIC_United_in_Liberty_desc: "自由如永不熄灭的火焰，一旦燃起，便无法扑灭，只能被削弱光芒。自由的概念可以追溯到伟大的哲学家，如约翰·洛克。他被视为自由主义的奠基人，而他的著作在点燃法国大革命火焰中发挥了关键作用。当我们战胜暴政与专制，屹立胜利之时，我们必须努力实现约翰·洛克的梦想。在我们的引领下，自由之光将照耀整个欧洲。被压迫者将获得解放，压迫者将面对我们正义的复仇。当一切结束，暴政与仇恨的恶魔将被永远驱逐至阴影之中。"
 FRA_VIC_Utmost_Equality: "最大限度的平等"
 FRA_VIC_Utmost_Equality_desc: "我们挚爱的共和国，自1791年以来，虽几经政权更迭，却始终努力坚守“自由、博爱、平等”之核心信念。在法律层面，我们已确立了法定平等，但现实中，仍有许多人疾呼经济与社会不平等依旧横亘，尤其在边缘化群体之中更为显著。如今，国际舞台上的重大挑战已暂告段落，我们必须把目光转向国内，致力于消除社会内部的不公。激进者或许会高声喧嚷，但我们的行动终将胜于他们的空洞言辞。唯有真正致力于实现公民之间的平等，我们才能让共和国的承诺兑现于现实。这样做，不仅能赢得民众的支持，更是对共和国自罗伯斯庇尔时代以来所承载的精神信念的真正践行。法兰西不应只在言辞上宣扬平等，而应让平等成为镌刻在国家肌理中的真实存在。"
 FRA_VIC_The_End_of_History: "历史的终结"
 FRA_VIC_The_End_of_History_desc: "随着苏联解体与世界似乎正转向和平繁荣的时代，一种推崇自由民主制作为最适配人类文明体系的思想浪潮随之兴起。1992年，弗朗西斯·福山出版其开创性著作《历史的终结及最后之人》，暗示极权共产主义的崩溃标志着我们所知历史终结的开端。然而随着千禧年之交到来，反恐战争引发的动荡、2008年金融危机，尤其是美国的衰落，使世人将其理论讥讽为那个时代一厢情愿的空想。但如今我们抗击俄罗斯暴政的斗争，促使人们重新审视福山的理论——或许在我们的旗帜下，自由民主已作为欧洲的指导思想臻于完善并得以巩固。因此，我们必须自觉成为福山思想的践行者，开创超越美国的新自由主义时代，最终让民主的旗帜统合世界，使之永不熄灭于我们所面临的危机之中。\n\n在这颗星球上最后一个专制政权消亡前，我们永不也绝不能停歇。让我们终结充满苦难与分裂的旧历史，开启以自由、平等、博爱为至高圭臬的新纪元！"
 FAF_petainism_fascism: "维希贝当主义"
 FAF_classical_fascism_desc: "\n\n\n\n£GFX_FAF_petainism\n\n\n\n\n\n§Y维希贝当主义§!试图以其核心理念—“国家革命”—为贝当统治下的法国国家的合作主义政权进行辩护。其特征包括反议会主义、个人崇拜、传统价值观的推崇以及国家主导的反犹主义。贝当主义视法兰西共和国为腐朽失败的体系，体现了夏尔·莫拉斯所谓的“反法兰西”概念，即一个优先考虑外国利益的体系。受法国极右翼边缘势力的支持，法西斯贝当主义矢志推翻他们所认定的自由民主体制，重塑革命前的法兰西的辉煌与理念。通过“工作、家庭、祖国”这一口号，法西斯贝当主义者试图强行推动他们理想中的文艺复兴，即使这场复兴以法兰西的挣扎与哀嚎为代价，他们亦在所不惜。"
 FAF_petainism_junta: "抵抗贝当主义"
 FAF_military_junta_desc: "\n\n\n\n£GFX_FAF_junta_petainism\n\n\n\n\n\n§Y反抗式贝当主义§!可以被视为贝当主义思想中更为现实和温和的一支。尽管他们对贝当的“国家革命”理念的依附程度可能有所不同，但他们仍然相信前法兰西国家所提倡的反议会主义的总体理念。在法国的将领阶层中，这一思想找到了支持者。他们认为，最有可能通向权力的道路是在国家遭受彻底失败或崩溃之后，才能孕育出一位“法兰西国家领袖”，即使面前是一片残破的废墟，这位“领袖”也能带领法国重新走向往昔的荣耀。"
 FAF_gaullism_auth_dem: "反抗式戴高乐主义"
 FAF_military_democracy_desc: "\n\n\n\n£GFX_FAF_resistant_gaullism\n\n\n\n\n\n§Y反抗式戴高乐主义§!，相较于温和且与民主一致的其他戴高乐主义形式，该意识形态主张在法国需要时，由一位强有力的军事领袖来确保法兰西共和国的稳定。它的支持基础主要在法国军队的军官和将领阶层。最有可能使反抗式戴高乐主义上台的情境，是法国的民主选举政党试图忽视或排斥法兰西武装力量的关切之时。虽然一些人可能指责这种政体为残酷的独裁或必要的政治监护，但反抗式戴高乐主义者坚信，无论使用何种手段，都必须确保第五共和国的存续与安全。"
 FAF_sovereign_democracy_desc: "\n\n\n\n£GFX_FAF_resistant_gaullism\n\n\n\n\n\n§Y反抗式戴高乐主义§!，相较于温和且与民主一致的其他戴高乐主义形式，该意识形态主张在法国需要时，由一位强有力的军事领袖来确保法兰西共和国的稳定。它的支持基础主要在法国军队的军官和将领阶层。最有可能使反抗式戴高乐主义上台的情境，是法国的民主选举政党试图忽视或排斥法兰西武装力量的关切之时。虽然一些人可能指责这种政体为残酷的独裁或必要的政治监护，但反抗式戴高乐主义者坚信，无论使用何种手段，都必须确保第五共和国的存续与安全。"
 FAF_gaullism_conservative: "民粹戴高乐主义"
 FAF_right_populism_desc: "\n\n\n\n£GFX_FAF_populist_gaullism\n\n\n\n\n\n§Y戴高乐式民粹主义§!融合了传统戴高乐主义的民族主义精神和“以实力求和平”的态度，与21世纪右派民粹主义浪潮相呼应。虽然戴高乐主义核心理念仍然倡导法国例外论，但追随戴高乐式民粹主义的人们视其为一种梦寐以求的“回归传统”，与当今地缘政治“西方”中的许多民粹主义运动紧密相连。尽管有人批评这种对实用主义意识形态的政治化是对“法国解放者”核心理想的背离，但戴高乐式民粹主义者将不遗余力地保护自大西洋到乌拉尔山脉，让法国成为决定世界命运的主宰力量。"
 FAF_gaullism_marlib: "传统戴高乐主义"
 FAF_civic_nationalism_desc: "\n\n\n\n£GFX_FAF_traditional_gaullism\n\n\n\n\n\n§Y传统戴高乐主义§!是戴高乐思想的一个分支，与其他流派相比，它更强调国家价值，认为这是法国身份的核心之一，与共和国的制度一样需要被保护。相比于民粹主义戴高乐主义，传统戴高乐主义更倾向于通过公民民族主义的经典理念来强化运动，而不是追随21世纪盛行的右翼民粹主义新潮流。这一派别主要获得法国温和右翼的支持，他们希望确保一个能够维持法国传统价值的世界，同时遏制其他“超级大国”的影响。"
