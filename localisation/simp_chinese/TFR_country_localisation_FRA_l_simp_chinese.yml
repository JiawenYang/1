 FAF_royal_pretenders_dynamic: "王位觊觎者"
 FAF_royal_pretenders_dynamic_desc: "\n\n\n\n\n£GFX_FAF_royal_squabbles\n\n\n\n\n\n\n\n我们古老而神圣的宣称可以追溯到瓦卢瓦家族。但奥尔良派与波拿巴分子却在暗中纂夺我们的神圣统治。在问题恶化前，我们必须解决掉他们。"
 FAF_royal_pretenders_idea: "王位觊觎者"
 FAF_royal_pretenders_dummy_idea: "王位觊觎者"
 FAF_royal_pretenders_squabble_dummy_idea: "王位觊觎者"
 FAF_royal_pretenders_sway_nobility_dummy_idea: "王位觊觎者"
 FAF_nobility_taking_money_tt: "王国稳定的代价，就是§C贵族§!每3个月会从国家银行取走一大笔钱。"
 FAF_dieu_veut_idea: "神旨"
 FAF_dieu_veut_idea_desc: "\n\n\n\n\n£GFX_FAF_deus_vult\n\n\n\n\n\n\n\n上帝的意志和民族的意志与我们同在，与我们的士兵同在。我们为正义而战，为神圣而崇高的事业而战。当我们的战士们前进时，他们应当知道，他们——法兰西人民——是有史以来最伟大的人民。当炮声轰鸣，他们面对东方的野蛮敌群时，他们应当明白，他们追随的是主的圣灵。上帝意欲如此！"
 FAF_euro_navy_annexation_tt: "通过外交谈判，欧洲、太平洋和大西洋的海军指挥部已同意加入我们的阵营，共同对抗苏联共产主义霸权。"
 FAF_lafayette_order_cat: "新秩序"
 FAF_lafayette_order_cat_desc: "\n\n\n\n\n£GFX_FAF_lafayette_category\n\n\n\n\n\n\n\n德国人辜负了我们，他们让我们的儿子白白送死……却依旧妄想我们能在接下来的冲突中向他们俯首称臣？\n赤匪与德国佬狼狈为奸，蚕食我们的后代与工业，他们的目的究竟为何？\n是为了§R夺取§!我们的阿尔萨斯与洛林？\n是为了§R推行§!他们的德式赤色瘟疫浸染我们神圣的祖国？\n他们的阴谋或许深不可测，但只要我们紧随伟大的§C“拉法耶特”§!，法兰西将永不垂弱，阴影永不笼罩我们的国土！"
 FAF_showcase_superiority_decision: "展示法国霸权"
 FAF_showcase_superiority_decision_desc: "我们的卓越毋庸置疑。无论是我们的思想、我们的生活方式、我们的历史，还是我们的人民……一切都如同精酿的佳酒般被淬炼至极致的完美。然而，令人遗憾的是，这个世界却一次又一次忽视了我们那显而易见的卓然超群！"
