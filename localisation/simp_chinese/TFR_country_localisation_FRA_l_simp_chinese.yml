 FRA_Reforming_Civil_Services_idea: "官僚体制改革"
 FRA_Reforming_Civil_Services_idea_desc: "随着对公务员体系的全面改革，我们正在享受这些改革带来的当下益处。通过努力提升效率、加强问责制以及增强适应能力等多方面的改进，这些改革的最终成果将显而易见——它们将帮助法国实现当前的目标，即现代化国家的行政能力，同时满足推动这些改革的政府机构的诉求。"
 FRA_Reforming_Civil_Services_anti_corruption_idea: "反腐堡垒"
 FRA_Reforming_Civil_Services_anti_corruption_idea_desc: "公务员体系的全面革新正逐步展现其成果，我们也在切实收获政府改革所带来的效益。通过致力于减少腐败、强化问责制等多方面的变革，这些改革的最终成效已然明朗——它不仅将助力法国现代化行政能力的宏伟目标，更将回应政府内部推动这些变革的机构的深切期待。"
 FRA_ENA_idea: "国家行政学院"
 FRA_ENA_idea_desc: "国家行政学院最初由戴高乐于1945年建立，初衷是实现高级公务员民主化。作为法国最富盛名的学校之一，每年仅有80-90名学生从其中毕业。国家行政学院已经成为法国社会中获取公私营部门高级职位的主要门路之一，而实际上，自第五共和国建立伊始，包括埃马纽埃尔·马克龙在内的四位总统都出自此校。\n\n但近期的黄背心抗议运动要求终止此种现状。行政学院被指控为与社会脱节的精英机构，其因滋生的狭隘统治阶级饱受批评，毕业生们往复推动中庸政策，没法接受公认规范之外的替代方案——而随着世界的发展，这种冥顽不化让人担忧。更糟糕的是，行政学院还被指控为持续分裂法国社会的元凶，绝大多数毕业生都来自富饶或是上层权贵，他们其中仅有寥寥6%出身工人阶层。\n\n2019年4月25日，马克龙确定关闭国家行政学院。然而，随着法国经济面临未来挑战，此项决定是否会被推翻还犹未可知。"
 FRA_INSP_idea: "公共服务学院"
 FRA_ENA_Suspended_idea: "暂缓国家行政学院"
 FRA_ENA_Funds_idea: "慷慨解囊"
 FRA_ENA_Funds_idea_desc: "国家行政学院的全面拆解既已稳步推进，从前指定用于行政用途的预算如今也能被腾出用于针对教育系统及各式机构系统的行政改革之中。在再分配的过程中，新释放的资源也将进入经济大循环中，助力推动国家现代化。"
 FRA_Sacking_ENA_Veterans_idea: "除旧迎新"
 FRA_Sacking_ENA_Veterans_idea_desc: "常言道，“旧的不去，新的不来”。就行政机构日趋低效来说，国家行政学院里的许多老人负有不可推卸的责任，我们也正打算让他们辞职走人。在把岗位空出来之后，我们便能轻松地让称职的人员升职上岗，以期进一步推动法国行政机构的改革与现代化。"
 FRA_Sacking_ENA_Veterans_INSP_idea: "除旧迎新"
 FRA_Sacking_ENA_Veterans_INSP_idea_desc: "常言道，“旧的不去，新的不来”。就行政机构日趋低效来说，国家行政学院里的许多老人负有不可推卸的责任，我们也正打算让他们辞职走人。在把岗位空出来之后，我们便能轻松地让称职的人员升职上岗，以期进一步推动法国行政机构的改革与现代化。"
 FRA_Sky_Supremacy: "空中霸权"
 FRA_Sky_Supremacy_desc: ""
 FRA_Dirigisme_idea: "统制经济"
 FRA_Dirigisme_idea_desc: "干预主义的思想自始至终在法国的经济体系中扮演着重要角色。未来十年，通过增加债券发行，我们将竭尽一切必要手段，确保法国的经济在世界不稳定局势日益加剧的背景下依然蓬勃发展。这场对干预主义经济体系的国家复兴，旨在让法国的经济运行更加高效，同时着力纠正过去经济体系中的诸多不足，这些不足曾多方面阻碍了法兰西民族的进步与辉煌。"
 FRA_Dirigisme_Tech_idea: "统制经济"
 FRA_Dirigisme_Tech_idea_desc: "干预主义的思想自始至终在法国的经济体系中扮演着重要角色。未来十年，通过增加债券发行，我们将竭尽一切必要手段，确保法国的经济在世界不稳定局势日益加剧的背景下依然蓬勃发展。这场对干预主义经济体系的国家复兴，旨在让法国的经济运行更加高效，同时着力纠正过去经济体系中的诸多不足，这些不足曾多方面阻碍了法兰西民族的进步与辉煌。"
 FRA_Laissez_Faire_idea: "自由放任政策"
 FRA_Laissez_Faire_idea_desc: "在经历了数十年的“干预主义”体制所带来的臃肿与腐败之后，我们终于迎来了全新的转变，让自由市场之手成为引领国家前进的动力。通过出售昔日“国家冠军”企业所带来的资金流动，再加上大幅度的税收减免，我们的人民得以掌握更多财富，大大提升了整体的购买力与经济活力。或许有人会对“经济休克疗法”可能对原有公共体系造成的冲击以及公共部门失业问题感到不安，但我们坚信，自由市场所追求的效率与利益，远比旧体制更能满足人民的需求与期待！"
 FRA_Laissez_Faire_Plus_idea: "自由放任政策"
 FRA_Laissez_Faire_Plus_idea_desc: "在经历了数十年的“干预主义”体制所带来的臃肿与腐败之后，我们终于迎来了全新的转变，让自由市场之手成为引领国家前进的动力。通过出售昔日“国家冠军”企业所带来的资金流动，再加上大幅度的税收减免，我们的人民得以掌握更多财富，大大提升了整体的购买力与经济活力。或许有人会对“经济休克疗法”可能对原有公共体系造成的冲击以及公共部门失业问题感到不安，但我们坚信，自由市场所追求的效率与利益，远比旧体制更能满足人民的需求与期待！"
