 FRA_national_souverainism: "国家主权主义"
 FRA_patriotic_republicanism: "爱国共和主义"
 FRA_popular_front: "人民阵线"
 FAF_camus_eurasianism: "泛欧民族主义"
 FAF_eurasianism_desc: "\n\n\n\n£GFX_FAF_nationalist_europeanism\n\n\n\n\n\n§Y泛欧民族主义§!从主流的亲欧观念中脱颖而出，彻底否定了欧洲联盟所推崇的自由主义理念。它以“欧洲文明”为根基，描绘了一个由白人基督徒构成的共同体，凝聚于共享的历史与文化价值观之上。这一理念追溯至奥斯瓦尔德·莫斯利的“欧洲一体”论，并作为一种深潜的思想潮流，在欧洲极右翼中延续不绝，尤以欧洲联盟迈向联邦化之际愈加显现。以古斯巴达盾牌上的兰姆达符号为旗帜，泛欧民族主义者坚信，通过他们的团结奋进，必将守护他们心目中的欧洲文明，使其不为21世纪的狂风骤雨所摧折。"
 FAF_bonapartist_thought: "波拿巴思想"
 FAF_carolingian_fascism: "加洛林法西斯主义"
 FAF_neonazism_desc: "\n\n\n\n£GFX_Ideology_carolingian_fascism\n\n\n\n\n\n§Y加洛林法西斯主义§!是一种晦涩极端且杂糅多元的法国民族主义，该意识形态由拉法耶特及其追随者所推崇。这一意识形态深植于民族社会主义思想，宣扬‘犹太-日耳曼族’为拖累欧洲文化的劣等族群，怂恿公社的堕落，并试图将世界一同拉入深渊。除此之外，它还从“法兰克帝国”概念中汲取灵感，认为法国必须扩张至查理曼帝国的疆域，以实现法兰西的生存空间。\n拉法耶特推崇的意识形态，许多人将其形容为一种狂热的个人崇拜，其追随者将他的言辞奉为圭臬，其愿景即为律法。这一思潮本质上不断变幻，每时每刻皆在重塑，唯有两个核心信仰不可撼动——法兰西的至高无上，以及对所谓‘劣等族群’的仇恨。"
 FAF_lafayette_death_cult_idea: "至高元帅崇拜"
 FAF_death_cult_desc: "\n\n\n\n£GFX_FAF_cult_of_lafayette\n\n\n\n\n\n§Y“至高元帅崇拜”§!，是围绕已故法国陆军元帅拉法耶特所形成的个人崇拜体系。自巴黎围城战中神秘失踪后，他的身影虽未再现，但他的思想却凝聚成一种极端民族主义与法兰西例外论的狂热意识形态，其中更夹杂了民族社会主义的诸多特质。与欧洲其他极右翼思想不同，拉法耶特主义的核心特色在于其鲜明的反德情绪，这一点直接继承自拉法耶特生前的政治信念。然而，与德意志的宿怨相比，他们对俄罗斯的仇恨更是不遑多让，将其视为法兰西命运的另一大威胁。尽管如此，该派系仍面临一个根本性问题——意识形态的真正指引者缺失。由于拉法耶特的生死未卜，支持者在欧洲未来与法国方向问题上始终无法达成共识。但唯一可以确定的是：他们对拉法耶特的忠诚坚定不移，信仰绝不动摇。"
