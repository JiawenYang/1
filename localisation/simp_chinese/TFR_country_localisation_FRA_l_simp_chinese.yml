 FRA_silence_the_radical_left: "噤声颠覆势力"
 FRA_silence_the_radical_left_desc: "梅朗雄及其腐败集团虽已倒台，但他们阴险的叛国行径远未终结。那些与其恶性立场同流合污者绝不会轻易屈服，甚至连温和派也发出质疑之声。但共和国正处于危机关头，任何犹豫，即使出于善意，都不可容忍。为拯救法兰西，必须作出牺牲，哪怕这意味着暂时给它套上枷锁。"
 FRA_reverse_their_decisions: "扭转经济混乱"
 FRA_reverse_their_decisions_desc: "前社会党政府遗留的众多恶果之一，便是对法国战争经济能力的致命破坏。那些“提升工人地位”的荒谬尝试与福利国家的优先政策，导致我军在风暴来临之际竟无可用之兵。所有阻碍生产的无效劳动改革将被废止，工会的任何抵抗都将遭遇武力镇压。臃肿的福利体系必须拆除，其资金将转用于国防建设及其他保卫法国的项目。"
 FRA_render_unto_caesar: "归于辛辛纳图斯"
 FRA_render_unto_caesar_desc: "自新政府宣告成立之日起，同样的指责便不绝于耳——无论是来自真正的叛徒，还是被蒙蔽的善良法国公民。他们宣称我们要毁灭共和国，说我们不过是一群未经选举的独裁者，企图榨取民脂民膏。但凯撒主义绝非我们的选项，过去不是，将来也永远不会是。我们效忠的是共和国，是法兰西！正如先贤辛辛纳图斯那样，我们将守护国家直至危机解除，届时必当还政于民，无论这过程中需要碾过谁的阻碍。"
 FRA_democratic_supervision_committee: "共和监督委员会"
 FRA_democratic_supervision_committee_desc: "随着国内局势逐步稳定，我们现在可以采取进一步措施消除民众的忧虑。前路依然漫长艰难，但我们绝不能停滞不前。为确保军政府向共和国的过渡更为平稳，我们将成立特别委员会审核政党与候选人资格，待局势彻底平息后立即筹备闪电选举。共和国的火种将得以保留——虽暂显微弱，只为确保当一切准备就绪时，只需添柴加薪便能使之重燃烈焰。"
