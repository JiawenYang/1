 FRA_Anti_Police_Riots_Category: "马吉德·卡坦抗议"
 FRA_Anti_Police_Riots_Category_desc: "巴黎博比尼发生了一起悲剧性事件——一名警察杀害了手无寸铁的突尼斯公民马吉德·卡坦，而这使得巴黎全城都陷入了混乱。抗议者愤怒地纵火烧车、摧毁公交站，并向警方投掷烟花，场面随即失控。抗议浪潮迅速席卷全国，其激烈程度与过去五年间震撼人心的“黄背心”运动不相上下。\n\n尽管法国建立于革命精神之上，但面对欧洲局势的变迁以及俄罗斯在东方的崛起，我们不能再对抗议者的暴力行为视而不见，任由他们破坏国家的重要基础设施。"
