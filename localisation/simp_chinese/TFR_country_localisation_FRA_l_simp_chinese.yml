 FRA_covid_idea_4_desc: "新冠疫情最终也已踏入欧洲大陆，传播无休无止，高感染率为应急系统和政府带来巨大压力。为此大小委员会、科学家以及各级官员倾力合作，以遏制病毒在全国的迅速传播。\n\n§R若未能解决，国家会迎来灾难性的后果。§!"
 FRA_covid_idea_5: "新冠疫情灾难"
 FRA_covid_idea_5_desc: "新冠疫情最终也已踏入欧洲大陆，传播无休无止，高感染率为应急系统和政府带来巨大压力。为此大小委员会、科学家以及各级官员倾力合作，以遏制病毒在全国的迅速传播。\n\n§R若未能解决，国家会迎来灾难性的后果。§!"
 FRA_covid_curing: "疗效分配"
 FRA_covid_curing_desc: "法国人民终于迎来了久违的喘息，得益于欧洲科学家们的英勇努力，一款经过严谨测试的疫苗已成功问世，能够有效缓解这场大流行带来的阴霾。虽然疫苗的全面接种尚需时日，但我们能够如此迅速地研制出这一“治愈之匙”，无疑是一个伟大的里程碑。病毒的彻底根除，如今似乎已近在咫尺。COVID-19正逐渐淡去，最终或将化为一种微不足道的普通感冒。"
 FRA_Omnicron_idea: "奥密克戎变异株"
 FRA_Omnicron_idea_desc: "奥密克戎是SARS-CoV-2病毒的最新变种，其名字为大众所熟知的新冠病毒，最近在南部非洲被首次发现。这一变种的出现，再次掀起了人们对疫情的恐慌，因为目前针对其突变的专门疫苗尚未研发完成。我们唯有寄希望于实验室中的科学家们，他们正在夜以继日地努力研究，期望能尽早合成新的疗法，让这一变种早日被彻底遏制。"
 FRA_lockdown: "全国封城"
 FRA_lockdown_desc: "面对COVID-19疫情在国内的迅猛蔓延，我们果断采取了全国范围内的封锁措施，以遏制感染率的进一步攀升。这些措施虽初显成效，但也为民众带来了前所未有的压力——他们被迫留守家中，保持社交距离，严格遵守佩戴口罩与频繁消毒的公共卫生指南。然而，这些限制也使得许多民众失去了工作机会，经济与心理上的双重负担逐渐累积。若我们无法尽快推动国家的重新开放，不满的情绪或将如火山般爆发，难以遏制。"
 FRA_opening_up: "经济重开放"
 FRA_opening_up_desc: "随着瑞典式抗疫策略的在国内逐步推行，其成效几乎立竿见影。此前因封锁而陷入停滞的生产与经济体系，随着防疫政策的放宽，开始焕发活力。公民们纷纷重返工作岗位，努力恢复停摆的职业生涯，而不再依赖政府的刺激方案。我们唯有希望，这种加快开放的步伐不会引发病毒的再次肆虐或其他难以预料的后果。"
 FRA_welfare_payments: "经济刺激方案"
 FRA_welfare_payments_desc: "随着封锁令的进一步加严，原本已受到限制的法国人民的日常生活与工作再一次被迫按下暂停键。而如今，疫情的终结仍然遥遥无期，似乎没有尽头可见。面对这场旷日持久的危机，政府唯有肩负起责任，扶助法国人民渡过这段艰难时光，让他们重拾希望与力量，直至我们共同迎来国家重新开放的那一天。"
 FRA_CFA_Franc: "非洲金融共同体法郎"
 FRA_CFA_Franc_desc: "法国虽二战后进行了去殖民化，海外领土也仅仅是往日残影，但对前西非殖民地的影响却从未消散。14个国家组成的非洲金融共同体被分为西非金融共同体法郎和中非金融共同体法郎两个货币区。\n\n这两种货币的汇率都与欧元绑定，许多人据此认为西非国家对本国经济的主权掌控近乎不存。由于丧失了对自己货币印发的掌控，全西非都在欧洲市场的狂风下瑟瑟发抖，还要受制于欧盟的行动。\n\n另一方面，共同体法郎对法国经济而言利益巨大。它促进法国和成员国间的进出口贸易，还为成员国提供了宏观经济上的稳定性，防止任何成员像许多其他非洲国家一样陷入债务危机或是恶性通货膨胀。如此，在西非经济稳定的大环境下，法国许多联合企业的投资蜂拥而至，大量投入西非的资源开发，将数以亿计的利润输送回法国本土。"
 FRA_CFA_Franc_2: "非洲金融共同体法郎"
 FRA_CFA_Franc_2_desc: "尽管非洲经历了去殖民化进程，法国依然通过中非法郎对其前西非殖民地保持强大影响力。中非法郎覆盖14个撒哈拉以南国家，并划分为两个货币区。由于其与欧元挂钩，这一货币体系限制了西非国家独立管理自身经济的能力，使其易受欧洲市场波动和欧盟政策的影响。\n\n然而，中非法郎却为法国经济带来了诸多好处，它不仅便利了法非贸易往来，还在该地区提供了宏观经济稳定。这种稳定在一定程度上帮助西非国家避免了债务危机与恶性通胀，同时也为法国企业大规模投资西非资源开发创造了条件，使法国从中获取了数十亿欧元的利润。"
 FRA_CFA_Franc_3: "非洲金融共同体法郎"
 FRA_CFA_Franc_3_desc: "尽管非洲经历了去殖民化进程，法国依然通过中非法郎对其前西非殖民地保持强大影响力。中非法郎覆盖14个撒哈拉以南国家，并划分为两个货币区。由于其与欧元挂钩，这一货币体系限制了西非国家独立管理自身经济的能力，使其易受欧洲市场波动和欧盟政策的影响。\n\n然而，中非法郎却为法国经济带来了诸多好处，它不仅便利了法非贸易往来，还在该地区提供了宏观经济稳定。这种稳定在一定程度上帮助西非国家避免了债务危机与恶性通胀，同时也为法国企业大规模投资西非资源开发创造了条件，使法国从中获取了数十亿欧元的利润。"
 FRA_french_spirit_idea: "法兰西精神"
 FRA_french_spirit_idea_desc: "\n\n\n\n£GFX_FRA_french_spirit\n\n\n\n\n\n纵观十九到二十世纪，巴黎曾两度被占领：第一次是1870年，之后是1940年。自那时起，法国就宣誓，绝对不会再让外国占领自己的土地。法国军队将保卫祖国血战至最后一刻。法国核武导弹将成为防卫国家的屏障，以地狱业火威胁胆敢进犯本土的敌人。\n\n但是，法国精神不只包括国防，还包括革命。法国是欧洲自由主义和左翼力量的核心地带，法国激进派精神已延续两个世纪有余。法国人从不容忍公平正义的缺失和破坏，宁为尊严而死，不在膝下独活。因此，任何意图阻拦人民意志的尝试都将迎来大规模抗议、动乱乃至革命，而法国人早已将这一过程反复付诸实践。"
 FRA_damaged_left_idea: "左派受挫"
 FRA_mass_migration_idea: "大规模移民"
 FRA_mass_migration_idea_desc: "\n\n\n\n£GFX_FRA_mass_migration_banner\n\n\n\n\n\n自1973年起，法国的移民政策的重点就是减少移民。即便如此，法国在2019年还是收到了超过十二万份政治避难的申请，这个数字本身还在法国政坛引发了巨大争论。在经济下行，高失业率使得经济增速放缓的前提下，移民问题已然成为法国社会焦点问题。\n\n右翼政客，这支因移民恐惧日趋增加而声势渐长的力量已经寻求推动管控边境和散播反移民宣传政策。在民族主义狂热的支撑下，这些党派认为移民是对法国身份象征和国家安全的根本威胁。因此他们已然提议关闭边境以停止外国人的涌入。\n\n即便如此，移民问题已经对法国社会造成了显著影响，是否还要接纳新的移民已经变得越来越有争议，法国社会激化程度不断加深。并且，在北非和中东地区战火纷飞，难民鱼贯而入的状况下，不停接纳这些难民造成的经济负担日趋严重。早晚，一个确实的移民政策都必须要确定。"
 FRA_mali_intervention: "干涉马里"
 FRA_Civilian_Oil_Rations: "民用石油配给"
 FRA_Civilian_Oil_Rations_desc: "尽管法国成功应对了沙特阿拉伯内战所带来的短期冲击，但如今已愈发清晰，我们面临的时间紧迫性愈发严峻。政府已正式宣布实施全国强制性民用石油配给制度，这一举措类似于七十年代美国在OPEC石油禁运与伊朗革命期间采取的应对政策。通过这一配给措施，我们将竭力维护民众对石油资源的基本需求，并确保有限供应下的价格维持在合理范围之内。"
