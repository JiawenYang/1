 FAF_the_puppeteers_of_DAY_X_decision: "“X日”的真正傀儡师"
 FAF_the_puppeteers_of_DAY_X_decision_desc: "反民族主义思潮近几十年来在德国方兴未艾，结果他们却只因败给了俄国人一次便一扭头成了法西斯国家？我们是为我们的政府而战，在为驱逐共党分子而战！而德国人却只是给这一切加了层施特拉瑟主义-共产主义的皮，当德国人购入枪支、进行借贷时，谁是真正的得益者我们已是心知肚明……"
