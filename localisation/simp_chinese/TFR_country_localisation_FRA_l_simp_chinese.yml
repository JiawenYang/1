 FRA_Military_Retirement_category: "大博弈"
 FRA_Military_Retirement_category_desc: "\n\n\n\n\n£GFX_FRA_Military_Loyalty_category\n\n\n\n\n\n\n\n法国武装部队几十年如一日，不守规矩、难以驾驭，屡次试图干预我们的政治事务。但他们终归是法兰西的守护者，捍卫着国家未来的繁荣昌盛。在我们度过这段政治不确定时期、迈向政府成功的路途中，他们的忠诚必不可少，必须定期与军方合作，满足他们的需求。谨慎地合作，方能永续法兰西的伟大。\n\n我们现在有：\n§G[?happy_generals]§!名军官对政府感到§G满意§!。\n§O[?neutral_generals]§!名军官§O不受政府管控§!。\n§R[?angered_generals]§!名军官对政府§R不满§!。\n§C[?retired_generals]§!名军官现在§C正在休假§!。"
