 FRA_covid_idea_3_desc: "新冠疫情最终也已踏入欧洲大陆，传播无休无止，高感染率为应急系统和政府带来巨大压力。为此大小委员会、科学家以及各级官员倾力合作，以遏制病毒在全国的迅速传播。\n\n§R若未能解决，国家会迎来灾难性的后果。§!"
