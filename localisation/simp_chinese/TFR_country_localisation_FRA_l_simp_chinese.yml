 FAF_brick_by_brick4_idea: "新法国"
 FAF_brick_by_brick4_idea_desc: "法兰西历经一砖一瓦的精心构筑，终成我们夙愿多年的理想国度。如今的法兰西傲然屹立，成为浴火重生的新国度。这座历经淬炼的国度，必将以磐石之姿直面未来风雨。"
 FAF_brick_by_brick5_idea: "新法国"
 FAF_brick_by_brick5_idea_desc: "法兰西历经一砖一瓦的精心构筑，终成我们夙愿多年的理想国度。如今的法兰西傲然屹立，成为浴火重生的新国度。这座历经淬炼的国度，必将以磐石之姿直面未来风雨。"
 FRA_civil_war_rebuilding_dynamic: "一砖一瓦"
 FRA_civil_war_rebuilding_dynamic_desc: "我们的国家是以额头的汗水、人民的鲜血以及无数代人的牺牲建立起来的。在俄欧战争中战败后，我们的国家如今满目疮痍。家园化为废墟，工厂夷为平地。不满情绪于全国日益高涨，分裂运动与日俱增。现在的重中之重，就是重拾国家失去的荣耀与尊严。我们要一点一块、一砖一瓦地将法国从当前的困境中振兴起来，重回繁荣。"
