 FRA_regionalist_struggle_idea: "地方主义斗争"
 FRA_regionalist_struggle_idea_desc: "法国试图重塑自己的身份，随之带来的就是全国地方主义情绪愈演愈烈。\n\n大多数地方主义早在法国大革命期间就消失的一干二净，但仍有部分勉强幸存下来。从那时起，这些群体努力维持着自己的文化传统与语言。但如今，比法兰西身份更宏大的欧洲身份兴起，连法国也不称法兰西了。地方主义者将这一切看在眼里。若不想消失在历史长河中，就必需抓牢这最后的机会。"
