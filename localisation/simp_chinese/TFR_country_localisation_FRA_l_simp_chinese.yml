 FAF_building_an_empire_idea: "建立帝国"
 FAF_building_an_empire_idea_desc: "建立一个帝国需要时间，既要为征服做好准备，也要根除征服中残留的所有怨恨。正如那句常被重复的话所说：“罗马不是一天建成的”，法兰西帝国也不会如此。只有当国家真正拥有稳定，拥有繁荣，成为神圣与永恒的国度之后，才能真正宣称我们的帝国已经建成。若国之根基不稳，则便会一无所成。"
