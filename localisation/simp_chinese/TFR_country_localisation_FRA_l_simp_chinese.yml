 FAF_operation_powderkeg_decision_idea: "§H火药桶行动§!"
 FRA_ils_ne_passeront_pas: "他们不能通过！"
 FRA_ils_ne_passeront_pas_desc: "尽管乌克兰战线已然崩溃，库班桥头堡的士气却依旧高昂。即便深知前线局势不妙，俄军虽伤亡惨重却仍高歌猛进，将士们仍保持着这种新生的热忱。面对如此凶猛的攻势，我们显然必须在这片黑土地上深深扎根。今日是我们围困克拉斯诺达尔，可一旦失利，俄军便能长驱直入，届时整个欧洲腹地将岌岌可危。前线官兵们重新喊起了法兰西历史传奇中的那句口号，正如往昔岁月，它此刻必将成为凝聚军民斗志的最强战吼：他们休想通过！"
 FRA_sovereignty: "主权"
 FRA_sovereignty_desc: "政府与军队中那些理想主义者企图借这场冲突进一步强化欧洲团结、推进部队整编，并利用反俄民族武装来粉饰我们的解放者形象。然而，任何涉及可疑忠诚群体的结构性改革或重大投入都无异于一场豪赌，而拿国家灵魂下注的赌徒终将自食恶果。这类空想方案只适用于俄罗斯对自由欧洲的威胁被彻底消除后的世界。在那一天到来之前，我们必须仰仗法兰西现有的力量，至于那些梦幻般的改革，不妨留待和平年代徐徐图之。"
 FRA_solidarity: "外籍军团的遗产"
 FRA_solidarity_desc: "尽管我们拒绝进行激进冒险的军队重组，但通过效仿外籍军团的精神来组建非法国籍部队仍大有可为。只需迅速扩充其规模，我们既能增加作战兵力，又无需担忧大规模结构改革及不同族裔部队间的利益冲突。法兰西将驱使外邦人为她而战，但必须统一在外籍军团的旗帜之下。"
 FRA_cement_ukrainian_crimea: "克里米亚归乌克兰"
 FRA_cement_ukrainian_crimea_desc: "在夺回克里米亚之际，我们必须不惜一切代价粉碎俄军任何反扑企图。欧洲因乌克兰领土完整遭破坏而介入这场战争，若要彰显我们的决心，就必须战斗到底。我们绝不接受停战协议、不设什么“非军事区”，唯有彻底胜利才能作数。当年我们袖手旁观时被夺走的乌克兰领土，必须不计代价物归原主。我们将纠正过往的过失，竭尽全力确保这是俄罗斯最后一次能威胁乌克兰，乃至整个欧洲。这头北极熊必须被彻底击垮，无论付出何等代价。"
 FRA_kuban_expeditionary_army: "库班远征军"
 FRA_kuban_expeditionary_army_desc: "尽管俄军目前在国内外战场节节胜利，但帷幕之后仍可窥见其内部裂痕。许多远离莫斯科的边远地区民众自感遭当局遗弃，而库班地区，其大片领土已落入我军之手，正可作为绝佳的突破口。我们将就地整编当地民众与战俘志愿者，组建这支“库班军团”（尽管当地军官坚持要用带“K”的拼写）。此类部队既能完美承担后方安保任务，更能向当地民众乃至全体俄罗斯人民证明：我们是解放者，而非野蛮的征服者。"
 FRA_conscript_cossack_brigades: "征召哥萨克部队"
 FRA_conscript_cossack_brigades_desc: "随着苏联解体，俄乌双方都自诩为哥萨克传统的继承者。但以我方立场观之，真正的哥萨克精神家园唯在乌克兰，凡自称哥萨克者，若不愿背弃同胞，就必须与我们并肩作战。前线投诚者将被整编为轻装机动部队，与其历史名号相得益彰。至于他们是否自愿加入并不重要，毕竟我们浴血奋战，为的是他们的未来而非私利。"
 FRA_utilize_russian_dissidents: "利用俄罗斯异见者"
 FRA_utilize_russian_dissidents_desc: "形形色色的人正因各种理由拿起武器与我们并肩，无论是为了打造“更好”的俄罗斯、争取地区独立，抑或只是见风使舵。动机无关紧要，只要能将步枪交到他们手中，用以削弱俄军战力便足矣。合作者中确有真心实意之辈，亦不乏思想立场令我们深感……棘手的异类。这些后果暂且无暇顾及，毕竟当下首要之务，是打赢这场战争。"
 FRA_operation_davout_tt: "§Y完成该国策后，§!§C达武行动§!§Y就此开始。\n对以下地区开展全面进攻§!\n§R索契\n新罗西斯克\n刻赤§!\n§Y行动目标：缓解乌克兰的压力，保证§!§C北约部队§!§Y在§G高加索战线§!占据优势。§!"
 FRA_cossack_army_tt: "将在§p华沙§!组建四支§y哥萨克轻机械化旅"
 FRA_kuban_exp_army_tt: "将在§p华沙§!组建六支§0库班民兵师§!"
 FRA_Freedom_of_Russia_Legion_tt: "将在§p华沙§!组建三支§3俄罗斯异见者机械化师§!"
 FRA_foreign_legion_tt: "将在§4巴黎§!组建四支§2法国外籍军团旅§!"
 FRA_Act_on_Rattachism: "应对比利时整合运动"
 FRA_Act_on_Rattachism_desc: "尽管瓦隆地区使用法语，但这片法语文明圈的古老疆域自拿破仑帝国崩塌后便脱离掌控，我们曾以为这片故土将永远沦丧。如今命运终究让我们重归一统，但仅将其纳入疆界远远不够——我们必须通过制定多项特别法案，逐步将其司法、行政体系与法兰西现行体制对接。比利时的盘根错节的旧体制必须与我们的共和体系实现根本性兼容。为了法兰西的繁荣昌盛，我们必须妥善完成这项历史使命。"
 FRA_Absorb_Waloon_Command: "吸收瓦隆军队"
 FRA_Absorb_Waloon_Command_desc: "比利时的双语国家特性使其军队与政府体系同构，形成了弗拉芒与瓦隆双重军事架构。这种双重架构使得国家分离过程异常顺利——弗拉芒军队始终驻守北部边境，瓦隆部队则固守本区防线。如今这些防务已由荷兰与法国分别接管。值得注意的是，瓦隆地区归附时，其整建制部队及经验丰富的北约教官团队也一并纳入麾下——若拒绝接收这批专业力量，实属不智之举。只需更新其制服体系、授予全新军衔序列，便能将这支力量顺利纳入法兰西国防体系。"
 FRA_absorbing_walloon_command_tt: "瓦隆军官将被吸收入我军中"
 FRA_Reorganize_Walloon_Businesses: "重整瓦隆产业"
 FRA_Reorganize_Walloon_Businesses_desc: "在整合瓦隆大区这类高度城市化区域时，必须注意到该地区企业曾长期受比利时严格的建筑法规约束——这些法规原本由布鲁塞尔中央政府统一监管。但如今呢？这些企业已全面转入法国法律框架。我们亟需对新纳入的企业进行合规审查并协助其重组，像FN兵工厂这类具有战略价值的企业绝不能任其在动荡中衰败。通过及时介入并建立有序管理体系，我们方能实现当地经济生态的平稳过渡。"
 FRA_Integrate_Walloon_Parliament: "整合议会"
 FRA_Integrate_Walloon_Parliament_desc: "如何整合比利时原有的政府体系可谓是最棘手的问题。比利时曾实行三议会制——佛兰德、瓦隆和德语区议会分治。如今我们虽然掌控了瓦隆与德语区，但对这两个地方政府的处置方案仍存疑虑。尽管欧本-马尔梅迪等地的部分席位可能被裁撤，但多数机构将并入法兰西共和国。相关政党暂可保留原有注册名称，而大批比利时议员也将逐步融入巴黎的政治体系。现在只需由我党完成选区划分，便能最终敲定人员去留名单。"
 FRA_Promote_Francophone_Unity: "宣扬法语圈团结"
 FRA_Promote_Francophone_Unity_desc: "法语民族承载着辉煌悠久的文明传承——从查理大帝到瓦卢瓦王朝，从波旁王朝到拿破仑时代，直至当今伟大的共和纪元。我们既是欧洲价值的塑造者，亦是其文化传承的守护者。历经千年沧桑，我们既承受过异族铁蹄的践踏，更屡次挥师东进、南征、西渡大西洋，为民族荣耀开疆拓土。\n\n比利时与瓦隆地区虽在历史长河中长期与我们分隔，却始终共享这份一脉相承的荣光。我们的历史值得自豪，我们的历史即他们的历史，他们的荣光即我们的荣光。法语民族永远同气连枝！"
 FRA_An_Example_of_Unity: "牢不可破的典范"
 FRA_An_Example_of_Unity_desc: "自由、平等、博爱。此乃法兰西的立国精神。自断头台利刃落下终结旧制度以来，我们的理念便如星火燎原。无论是在美利坚、德意志、意大利，这三个神圣词汇何曾缺席世界任何角落？并无此例。如今的欧洲因这些理念空前团结，比利时虽亡国，其精神内核永存。布鲁塞尔依然矗立着佛兰德-瓦隆混居的文明丰碑，这座“欧洲之都”虽已无比利时依托，却留下象征着团结的永恒遗产——它向世人昭示：无论危机险阻，我们对自由的追求终将胜利，无论是德语的“Freiheit”、法语的“Libertié”，抑或英语的“Liberty”，每个欧洲人的心中都燃烧着这团圣火。让布鲁塞尔成为照亮欧洲未来的明灯，成为欧洲地图上第一块真正属于全体欧洲人的领土。"
 FRA_Propagandize_French_Naturalism: "宣传自然主义文学"
 FRA_Propagandize_French_Naturalism_desc: "向莱茵河，我在此宣告，沿着河流北上，直至布拉班特啤酒飘香市集广场。我们是法兰西人，法兰克帝国的正统继承者，从未忘却血脉根源。荷兰人、德意志人，皆为我们手足兄弟。今日收复瓦隆虽为幸事，然本应尽取全境，本应剑指更远——我们克制兵锋未效拿破仑直抵莱茵河的旧事，实乃馈赠欧洲的厚礼。这道镌刻着战败耻辱的古代边界，将我们与瓦隆同胞、弗拉芒兄弟、勃艮第故土生生割裂。安能苟且认命？不！我们要求更多，我们应得更多。今日收复瓦隆，明日重获弗拉芒，下周光复布拉班特，明年直抵莱茵河。或许吧。"
 FRA_Absorb_the_Beglian_Left: "吸收比利时左派"
 FRA_Absorb_the_Beglian_Left_desc: "我们左翼必须团结一致。比利时社会党长期以来都是我们在欧洲政坛的重要盟友，其阵营中更有梅朗雄的诸多私交。如今各行政区重归一统，我们理应与他们共商大计——安排梅朗雄与比利时社会党主席保罗·马涅特、工人党领袖劳尔·赫德博举行会晤，既能巩固议会地位，又能为我们对比利时工人阶级的领导权赋予正当性。不妨也邀请欧本市长查尔斯·塞尔瓦蒂参与，欧本虽小但属我国领土，他们的三个议席终究值得争取。"
 FRA_Appoint_King_Philippe_to_Parliament: "恢复比利时头衔"
 FRA_Appoint_King_Philippe_to_Parliament_desc: "比利时承载着历史悠久的君主制传统，在其国祚将尽之际，这一凝聚国家团结的象征竟被强行褫夺。法兰西虽非君主制国家，但理解比利时保守派人士不愿王室沦为庶民的心绪。无妨，法兰西共和国将恢复并维护其头衔——纵显违和，我们仍将再度加冕比利时国王，赋予其纯荣誉性且完全非行政化的国家礼遇。"
 FRA_Desperate_Defense_cw_idea: "纵深防御"
 FPR_Fervor_reset_tt: "移除精神§R革命热情§!"
 FRA_Secure_French_Oil_Interests: "承认沙特继承人"
 FRA_Secure_French_Oil_Interests_desc: "与新的沙特领导层（无论是阿拉伯共和国还是沙特王室）建立外交关系。这会巩固联盟，确保稳定的伙伴关系，促进能源生产和地区安全方面的合作，同时增强法国在海湾地区的影响力。"
 FRA_If_We_cant_have_it: "建立在中东影响"
 FRA_If_We_cant_have_it_desc: "通过向以色列和土耳其等关键盟友提供财政支持，以在中东地区进行战略投资。这一举措将加强我国与该地区的关系，促进稳定，并培育可能对我们有利的能源协议和更好的安全合作的伙伴关系。"
 FRA_Encourage_European_Economic_Sanctions: "提供经济借贷"
 FRA_Encourage_European_Economic_Sanctions_desc: "向沙特继任政府提供有针对性的经济贷款，以支持其发展和稳定。通过投资其经济，法国可以加强双边关系，并鼓励其符合法国利益的政策，确保石油的稳定供应和战略合作。"
 FRA_Redirect_Budget_to_Oil_Contracts: "重规划石油合同预算"
 FRA_Redirect_Budget_to_Oil_Contracts_desc: "重新分配预算资源，优先考虑石油合同和计划。这种关注旨在确保资金得到有效利用，以确保关键的能源协议得以达成，增强能源独立性，并巩固法国作为全球石油市场重要参与者的地位。"
 FRA_Integrate_Oil_Contracts_into_Military_Budget: "将石油整合入军队预算"
 FRA_Integrate_Oil_Contracts_into_Military_Budget_desc: "将石油预算与军费预算结合起来，形成能源安全的统一策略。通过整合这些预算，法国可以增强其战略能力，确保能源资源充分支持军事行动，最终加强国家防卫能力。"
 FRA_Department_of_Oil_Production: "石油生产部"
 FRA_Department_of_Oil_Production_desc: "设立专门的政府部门，负责石油生产和管理。该部门将负责制定国内和国际石油战略，与行业利益相关者协调合作，并推动旨在提高法国能源安全和生产效率的举措。"
 FRA_Reorganize_Civilian_Infrastructure: "重整民用基建"
 FRA_Reorganize_Civilian_Infrastructure_desc: "改造民用基础设施，以支持石油生产和配运增长。这一举措包括升级运输网络、储存设施和加工厂，保证其高效运作。通过推进基础设施现代化，法国能够优化其能源供应链，增强整体经济弹性。"
 FRA_Invest_in_Equinor: "投资挪威国家石油公司"
 FRA_Invest_in_Equinor_desc: "投资挪威国家石油公司以促进可再生能源计划并实现能源多样化。这一战略举措旨在顺应全球能源发展趋势，同时确保在创新能源解决方案领域的立足点。支持挪威国家石油公司使得法国成为传统和可持续能源市场的领导者。"
 FRA_Ration_Civilian_Oil: "民用石油配给"
 FRA_Ration_Civilian_Oil_desc: "实施民用石油配给制度，将资源优先用于战略需求和军事行动。这可以确保关键部门保持供应，同时有效管理国内需求。通过控制石油分配，法国可以在紧张局势加剧期间保持稳定。"
 FRA_Curtail_Former_American_Embargoes: "观望美国禁运"
 FRA_Curtail_Former_American_Embargoes_desc: "采取措施使法国远离美国实施的禁运，特别是针对委内瑞拉的禁运。通过解除限制并与受制裁国家开展合作，法国可以确保获得可替代的石油供应，提高能源独立性，并在全球能源讨论中充当调解者的角色。"
 FRA_West_African_Oil: "西非油田"
 FRA_West_African_Oil_desc: "我们将专注于扩大与西非亲法国家的合作伙伴关系，以获取更多的石油储备。这一举措不仅会加强与这些国家的关系，还能提升法国的能源配置。通过投资西非的油田，法国可以多样化其能源来源，并确保该地区的稳定。"
 FRA_Issue_10_year_Bonds: "发行十年期国债"
 FRA_Issue_10_year_Bonds_desc: "随着新十年伊始，经济不稳定的迹象愈发明显。若要确保法兰西不在全球列强竞争中落后，我们必须采取更加积极的经济政策，以推动国家发展。当前政府已制定全新的货币政策，并将在未来十年内逐步实施。核心措施之一，便是发行长期债券，以支持企业与大型公司融资，增强市场活力，确保经济稳健增长。"
 FRA_Revive_Dirigisme: "重启经济统制"
 FRA_Revive_Dirigisme_desc: "统制经济体制曾是二战后法国重建的关键，自那时起，法国始终未曾遗忘自身的经济传统。尽管近年来我们向市场导向的经济模式倾斜，但面对疫情等因素引发的经济不稳定，回归更具保障性的政策仍然为时不晚。随着全国范围内重新推行统制经济模式，法国必将重现昔日共和国最辉煌的繁荣，稳步迈向更加光明的未来。"
 FRA_Invite_New_Age_Technocrats: "邀请新一代技官"
 FRA_Invite_New_Age_Technocrats_desc: "跨入新世纪以来，科技产业已成为全球最具利润与增长潜力的行业之一，尤其对法国而言更是如此。然而，在过去二十年里，这一领域主要由美国的科技巨头主导。然而，法国并不打算与这些行业巨头对立，相反，我们愿意向他们伸出合作之手，以示法国人民的善意与开放态度。通过合作，我们将确保法国在全球科技竞争中占据一席之地，同时促进本国技术创新与产业发展。"
 FRA_Purchase_National_Champions: "龙头企业新纪元"
 FRA_Purchase_National_Champions_desc: "在迈向经济主导地位的道路上，我们绝不能遗忘曾在工业与经济市场中占据领先地位的法国企业。法国产品与创新曾享誉全球，如今，我们必须再次向世界证明其卓越性。然而，要实现这一目标，我们必须大力扶持本国企业，确保它们在全球市场上获得坚实的支持，并深刻认识到——法兰西始终是它们最坚定的后盾。唯有如此，我们才能重塑法国经济的辉煌，让法国品牌再度成为全球标杆。"
 FRA_Advance_National_Interests: "推动国家利益"
 FRA_Advance_National_Interests_desc: "企业的繁荣便是国家的繁荣，法国的利益高于一切！我们将不惜一切手段维护国家的福祉与经济繁荣，确保法国始终屹立于世界强国之列。任何希望成为这一经济复兴进程一部分的企业，都必须严格遵循国家利益优先的原则。这一点，他们终将明白——随着法兰西再度崛起，重返全球地缘政治的核心舞台，正如数十年前那般辉煌！"
 FRA_Replace_the_ENA: "取代国家行政学院"
 FRA_Replace_the_ENA_desc: "国家行政学院曾是法国政府改革与进步的灯塔，象征着国家对公民的责任与承诺。其初衷是让公共行政走向民主化，摆脱过去繁冗低效的官僚体系，然而，岁月无情，这座昔日的精英学府已然日渐衰败。到底出了什么问题？这是许多人对这座曾经声名显赫的学府的疑问。然而，经历多年管理不善与制度失灵，答案早已昭然若揭——问题正源自其自身的政策与运营。\n\n在经历了各方深思熟虑的磋商后，我们已达成共识：唯有彻底替换这座学院，方能根治其积弊。如今，我们不仅要重塑它，更要确保它的长久稳固，使其重新恢复昔日的荣耀与威望，成为真正值得信赖的国家治理学府。"
 FRA_Replace_ENA_Veterans: "解雇国家行政学院校友"
 FRA_Replace_ENA_Veterans_desc: "有一点毋庸置疑——国家行政学院的官僚体系，尤其是那些冥顽不化的官僚，已经成为这座昔日学府衰败的根源。他们将这座曾经享誉世界的学府，变成了今天这般冗杂低效、腐化不堪的庞然怪物。如今，随着改革的雷霆已然落下，我们清楚地看到，这些寄生于体制之上的蛀虫，定会竭尽所能维持他们的残存权力。然而，法兰西人民已不再欢迎他们！我们将彻底清除这些顽固不化的旧日官僚，斩断他们对权力的最后一丝依附，让法国的未来不再受困于过去的枷锁。"
 FRA_Institut_national_du_service_public: "国立公共服务学院诞生"
 FRA_Institut_national_du_service_public_desc: "国立政治科学学院曾是我政府众多改革提案之一，然而，这份蓝图却在某位官僚的文件柜中蒙尘多年。若非我们推动了亟需的改革，它或许仍将束之高阁。然而，今日，我们终于将这一构想变为现实——彻底取代国家行政学院，以全新的政治学府取而代之。虽然过去的国家行政学院的精英阶层对此愤怒不已，但法国人民深知，这一变革是为了他们，而非那些长期滥用特权的上层阶级。法国已不再是他们的私人领地，新时代属于所有法兰西公民。"
 FRA_Distribute_ENA_Funds: "重分配国家行政学院预算"
 FRA_Distribute_ENA_Funds_desc: "随着国家行政学院的彻底终结，法兰西与我们的政府终于得以松一口气，这座长期侵蚀国家根基的机构，最终被斩断。在数周的审查后，关于国家行政学院预算消耗的调查报告终于出炉——其开支竟高达一千五百亿欧元，这一惊人数字几乎再度引发全国公愤。幸运的是，这一次，国家行政学院早已被彻底清算，而这笔庞大的资金，终于能够回归真正需要它的国家机构，填补数十年来因这一腐败机构而遭受的资源掠夺。"
 FRA_Disuade_Elitist_Attitudes: "摒弃精英立场"
 FRA_Disuade_Elitist_Attitudes_desc: "国立政治科学学院的诞生，宣告了一个时代的终结。那些曾在国家行政学院的庇护下恣意妄为的精英与掠夺者，必须正视现实——法兰西人民已不再欢迎他们。我们的政府源自人民，而人民的意志已然明确：特权阶层，将不再染指国家机构！"
 FRA_Reform_the_Civil_Services: "改革公务员体系"
 FRA_Reform_the_Civil_Services_desc: "随着浪费巨大的国家行政学院预算被重新分配，我们现在有了更多空间投资政府的其他领域。而国家行政学院的废除，意味着旧有的公务员培训体系不复存在。确保人民仍能顺利进入公务体系的责任，便落在了现政府的肩上。如今，我们必须让公务员体系更加高效、公平，摆脱过去的繁琐与特权。"
 FRA_Laissez_faire: "拥抱自由放任经济"
 FRA_Laissez_faire_desc: "法国已在过去数十年间稳步摆脱统制经济体制，向市场自由化迈进。而今，面对新的地缘政治局势，是时候彻底拥抱自由市场，迎接它所带来的无限机遇与繁荣。在这一经济战略下，法国将迎来前所未有的发展，迈向现代化，重现共和国昔日的辉煌。"
 FRA_Deconstruct_the_ENA: "拆分国家行政学院"
 FRA_Deconstruct_the_ENA_desc: "国家行政学院曾是法国政府改革与进步的灯塔，象征着国家对公民的责任与承诺。其初衷是让公共行政走向民主化，摆脱过去繁冗低效的官僚体系，然而，岁月无情，这座昔日的精英学府已然日渐衰败。到底出了什么问题？这是许多人对这座曾经声名显赫的学府的疑问。然而，经历多年管理不善与制度失灵，答案早已昭然若揭——问题正源自其自身的政策与运营。\n\n在经历了各方深思熟虑的磋商后，我们已达成共识：唯有彻底替换这座学院，方能根治其积弊。如今，我们不仅要重塑它，更要确保它的长久稳固，使其重新恢复昔日的荣耀与威望，成为真正值得信赖的国家治理学府。"
 FRA_Begin_Low_Scale_Privatizations: "开启小规模私有化"
 FRA_Begin_Low_Scale_Privatizations_desc: "多年来，那些在经济和财政上支持法国的企业一直在要求小规模私有化。如今，随着自由放任经济政策的确立，是时候向企业让步，允许部分政府机构私有化，以提高效率，并引入战略性竞争，确保最终法国公民成为真正的受益者。"
 FRA_Increase_Arms_Exports: "扩大武器出口"
 FRA_Increase_Arms_Exports_desc: "尽管法国并非当今全球超级大国之一，但我们的军事工业体系始终位居世界前列。然而，近年来，法国军工产业相较于昔日辉煌，已显露疲态。如今，非洲及全球各地的地缘政治局势日趋动荡，正是法国重振军工出口的最佳时机。我们必须抓住这一契机，让法国制造的精良武器再次遍布全球。"
 FRA_Reduce_International_Sanctions: "降低国际关税"
 FRA_Reduce_International_Sanctions_desc: "关税，本质上是一种政治工具，当然，针对意识形态敌对国家除外。然而，近年来，我们过于严苛的关税政策，使法国错失了关键的国际市场，使本该遍布全球的法国产品与工业受到了抑制。如今，法国仍将屹立于国际市场，并持续壮大。而这项新政策将确保我们在全球经济舞台上更进一步，强化我们的经济实力。"
 FRA_Acquire_Renault: "收购雷诺"
 FRA_Acquire_Renault_desc: "自汽车问世以来，雷诺便一直是法国最具代表性的豪华汽车制造商之一。然而，除了民用汽车领域，雷诺在军事工业方面同样功勋卓著，为我国提供了装甲输送车、步兵战车，甚至主战坦克，对国防建设贡献良多。正因如此，为了推动法国企业在全球市场上的影响力，本届政府已正式提出收购雷诺的方案。"
 FRA_Nexter_Expansion: "扩大奈克斯特合同"
 FRA_Nexter_Expansion_desc: "自共和国步入现代化以来，奈克斯特始终是法兰西军队最可靠的支柱之一。他们的奉献值得最崇高的敬意，作为对其努力与奉献的回报，我们决定扩大与奈克斯特的合同，让其进一步加大生产，为法兰西及其军队提供更强大的支持。"
 FRA_Prioritize_Efficient_Economics: "优先发展高效经济"
 FRA_Prioritize_Efficient_Economics_desc: "随着统制经济体制的全面推进，我们的政策已稳步确立。如今，政府的首要任务是确保经济规划的稳固与高效运行，以最大限度发挥其作用。我们将推动改革顺利通过议会，并确保官僚体系不会阻碍国家的经济发展。随着政策与改革的有序推进，法国重回欧洲经济强国之巅的时刻，或许已近在眼前。"
 FRA_Tax_Cuts_to_Defense_Companies: "防御性税收"
 FRA_Tax_Cuts_to_Defense_Companies_desc: "随着自由放任经济政策逐步推进，我们迈向完全放手的市场经济的下一步，便是削减企业税，以激励更多公司融入我们的金融体系。其中，军工复合体相关企业将享受最优厚的减税政策，以确保法国军队始终装备最先进、最精良的武器装备。"
 FRA_Offer_American_Companies_Refuge: "美国企业的避风港"
 FRA_Offer_American_Companies_Refuge_desc: "毫无疑问，美国突如其来的内战不仅重创了法国经济，更对全球市场造成了严重冲击。然而，在这场危机之中，我们也看到了一线希望——曾主导美国工业的巨头企业，如今正试图拓展欧洲市场，而法国，正是它们最理想的落脚点。法国已在欧盟的经济应对战略中担起重任，积极吸纳因美国内战而遭受重创的企业，并希望在冲突结束后，这些企业仍能选择留在法国，助力我们经济的长期发展。"
 FRA_Push_for_EU_Asian_Free_Trade: "欧盟-太约自贸协定"
 FRA_Push_for_EU_Asian_Free_Trade_desc: "随着美国市场的退出，欧洲联盟与太约均遭受了重大冲击。而与此同时，俄罗斯与中国趁机加紧对周边国家的经济渗透，积极推进自身利益。为了遏制他们的联合扩张，我们两大阵营正式达成了一项历史性的贸易协议，以向世界表明，我们不再惧怕这些全球超级大国，也不再依赖美国。"
 FRA_Strengthen_Anti_Corruption_Laws: "强化反腐法律"
 FRA_Strengthen_Anti_Corruption_Laws_desc: "变革的时刻终于来临，一场足以震撼政坛的风暴即将席卷，不仅撼动我们的政府，更将改写整个政治格局。我们的政府将推进一系列反腐法案，斩断立法者与官僚巧取法律漏洞、逃避公正制裁的黑手。法国将向本国与欧洲宣告——我们是法治的旗手，在这片土地上，任何人都无法置身法律之外。"
 FRA_Declare_Wartime_Measures: "宣布采取战时措施"
 FRA_Declare_Wartime_Measures_desc: "面对俄罗斯在全球范围内的侵略行径，我们终于意识到，针对这些俄国暴徒，任何妥协都是徒劳的。法国将以身作则，展现我们对抗俄罗斯侵略的坚定决心，并积极号召整个欧洲追随我们的步伐，携手构筑反俄防线，捍卫我们赖以生存的生活方式。"
 FRA_Utilize_Consumerism: "利用消费主义"
 FRA_Utilize_Consumerism_desc: "现代法国一直以消费主义为导向，尤其是在疫情爆发前。如今，随着疫情基本结束，政府的责任便是鼓励全国重新回归消费模式，以助力企业复苏，并推动经济重振。法国人民将见证自己钟爱的商家重新焕发生机，就如同那场灾难性事件几乎使国家陷入经济危机之前的岁月一样。"
 FRA_Target_Oligarchs: "锁定寡头"
 FRA_Target_Oligarchs_desc: "是时候直面我们制度中最棘手的问题之一了。寡头势力的问题终于被推上前台，而我们的政府已提出并通过多项反寡头法案，旨在不仅削弱他们在政治与经济体系中的影响力，更要彻底终结这种现象。法国乃至整个欧洲都将看到，我们始终把人民的利益置于首位，金钱无法收买或左右法国的政治运作。"
 FRA_Fraternite: "博爱"
 FRA_Fraternite_desc: "尽管欧洲目前相对和平，但战争始终是一种必然。日益紧张的局势表明唯有武装利齿的猛兽才能击退进犯之敌。鉴于我们美国盟友无力为我们的防御能力贡献力量，大力加强自身军事建设显然是明智之举。无论敌人是谁，都将让他们后悔触碰法兰西。"
 FRA_Egalite: "平等"
 FRA_Egalite_desc: "经济平等是每个人都应追求的目标，但一味否定财富积累将有悖于我们的原则。在财富与平等之间找到平衡点，我们就能确保人民拥有值得奋斗的目标，一个充满希望的未来。"
 FRA_Liberte: "自由"
 FRA_Liberte_desc: "自由是法兰西的核心理念。自三色旗升起之日起，我们就深知人民理应拥有发声的权利，能够自由表达而不受惩处。通过贯彻共和理念，我们强化了国内政治的凝聚力。团结方能稳固，若向国民证明，纵有理念分歧，我们仍能在自由中共存共生，这才是对法兰西精神的最佳诠释。"
 FRA_Withdraw_from_Integrated_Military_Command: "撤出一体化军事指挥机构"
 FRA_Withdraw_from_Integrated_Military_Command_desc: "历届政权的诸多谬误之一，便是对北约一体化指挥体系的持续效忠。法国为何定要将军事力量与欧洲他国捆绑？为何要受条约规章所限？这一切到此为止，是时候与这个陈旧概念割席了。我们的军队将不再如犬般受缚于北约，是时候打造一支独具法兰西特色的军队——非英式，非意式，非德式，唯法式。盟国或许会对此感到不满，但他们必须承认，此结局对于各方来说最为有利。"
 FRA_Assure_our_Allies: "对盟友的保证"
 FRA_Assure_our_Allies_desc: "尽管盟国有所忧虑，我军的全新走向绝不意味着背弃对北约的承诺。左右两翼的极端分子虽持续鼓吹退出联盟，但此并非我方立场。我们捍卫的是整个西欧的集体安全，并时刻准备为正义与自由献出生命。法国将作为北约的中流砥柱熠熠生辉，无论暴政来自何方，我们都将正面迎击。"
 FRA_Military_Industrial_Program: "军工发展计划"
 FRA_Military_Industrial_Program_desc: "战争是场危险的游戏。它吞噬其沿途一切，使国家经济陷入停滞。许多国家的沦亡并非败于士兵坦克，而是无形消耗战的摧残。随着全球紧张局势升级，我们绝不能维持当前规模的工业基础。将士们需要补给：枪支、弹药、燃油与粮食——这些维系军队基本运转的必需品。新工业计划将确保我军与盟友获得渡过未来战争所需的物资供给。"
 FRA_Redistribute_NATO_Funding: "北约经费再分配"
 FRA_Redistribute_NATO_Funding_desc: "随着我国在北约高层指挥机构中的角色缩减，我们必须合理配置新释放的资源。长期以来，法国社会服务部门仅能维持最低限度运转，获得的政府补贴微乎其微，而军费却持续增长，这堪称我国政府最大败笔之一。我们现决定永久性解决该问题，向全国公共服务机构增拨补贴。此举既能消化原用于北约指挥体系的超额支出，又可遏制日益严重的贫困与失业问题。"
 FRA_A_New_Doctrine: "新战略学说"
 FRA_A_New_Doctrine_desc: "战争是场不断变革的游戏。战术会过时，武器会淘汰，战场上无一成不变。为求克敌制胜，变革不仅必要，更是铁律。敌手难测，纵使陈腐战术，亦会倾囊而出。因此，我们必须时刻保持警惕。适应性应为我方军事理论的核心。唯有如此，我们才能不管局势如何而永据敌先。"
 FRA_Civic_Construction_Plans: "民事建造项目"
 FRA_Civic_Construction_Plans_desc: ""
 FRA_New_Stretegic_Concepts: "新战略理念"
 FRA_New_Stretegic_Concepts_desc: "自成立以来，北约始终为冷战中对苏全面战争做着准备。纵使这一威胁从未成真，对战争的恐惧却在苏联解体后依然延续。但到了21世纪，我们的诸多战略理念已经陈腐过时。那些多年前行之有效的计划战术，如今早因科技进步而遭淘汰。因此，我们必须对北约现行战略理念进行全面重估，以确保准备万全，应对包括与莫斯科全面开战在内的一切可能。"
 FRA_Establish_Romanian_Forward_Operating_Bases: "罗马尼亚前进基地"
 FRA_Establish_Romanian_Forward_Operating_Bases_desc: "自2004年罗马尼亚加入北约以来，该国始终是东欧防务的关键支柱。其坐拥黑海沿岸和与乌克兰接壤的战略位置，使我们长年向该区域投送力量。尽管我们在东线的角色向来被动，但近期俄罗斯巨熊的挑衅表明，被动应对的时代已告终结。根据动员计划，我们将全面升级扩建罗马尼亚境内的基地——不仅能持续投送力量，更可随时应对任何军事行动，尤其是涉乌局势。"
 FRA_A_European_Turkey: "病夫之良药"
 FRA_A_European_Turkey_desc: "土耳其这个国家就是个谜。其虽为北约成员，却与我们频生龃龉——尤其是在干预叙利亚内战一事上。当下的土耳其正处于十字路口。为巩固东方立足点，我们必须确保安卡拉全心效忠北约。其作为黑海守护者的地位，使我们得以掌控俄罗斯最关键的海上通道之一。一旦战争爆发，既可封锁贸易，更能直击高加索腹地。"
 FRA_Baltic_Defense_Plan: "准备防卫波罗的"
 FRA_Baltic_Defense_Plan_desc: "虽然并非俄罗斯侵略的主要目标，但波罗的三国始终笼罩在巨熊的威胁阴影下。自苏联解体以来，莫斯科便对此地虎视眈眈。一旦战争爆发，他们势必入侵吞并我们的盟国。因此，我们必须强化北约在该地区的防务。保卫波罗的国家就等于断绝俄罗斯获取不冻港的通道，这将极大提升我们抵御俄军入侵的胜算。"
 FRA_Arm_the_TSK: "准备武装土耳其军队"
 FRA_Arm_the_TSK_desc: "冷战巅峰时期，土耳其曾是东西方对峙的火药桶。作为连通中东与欧洲的桥梁，这片土地随时可能成为进军高加索或中东的跳板。尽管土耳其军队常备不懈，我们仍须确保俄军铁蹄永远不能踏足安卡拉。无论付出何等代价，都必须守护好这个最关键的盟友——其沦陷将引发连锁反应，使整个巴尔干门户洞开，沦为俄罗斯的囊中之物。"
 FRA_Improve_Conversion_Efficiency: "提高转换效率"
 FRA_Improve_Conversion_Efficiency_desc: ""
 FRA_Supremacy_in_the_Skies: "空中霸权"
 FRA_Supremacy_in_the_Skies_desc: "自一战以来，空战便是现代军队的核心。战机为地面部队提供近距支援，轰炸机则将城市工厂夷为废墟。无空军之国，只能任侵略者宰割。作为空军振兴计划的一环，我们不仅要争夺制空权，更要主宰苍穹。我们的战机将横扫天际，我们的轰炸机必叫敌军灰飞烟灭，而敌人终将学会畏惧法兰西战鹰掠空的景象。"
 FRA_Increase_our_Black_Sea_Presence: "增强黑海政治存在"
 FRA_Increase_our_Black_Sea_Presence_desc: "黑海堪称全球最关键的水道之一。诸多国家不仅赖其促进贸易，更藉此捍卫国家利益。自2014年莫斯科强占克里米亚以来，危险的权力转移已然发生——如今该地区正面临着沦为俄罗斯“温水内湖”的威胁。作为海军扩张计划的一环，我们将全力掌控黑海，压制俄方在此的存在。因为一旦放任该地区落入俄手，受威胁的就不仅是乌克兰，更包括我们在该地区的所有盟国。"
 POLITICS_EMMANUEL_MACRON_DESC: "埃马纽埃尔·让-米歇尔·弗雷德里克·马克龙，前投资银行家、部长，现法兰西第五共和国总统。即使出生在一个不信仰宗教的家庭，年轻时马克龙就要求受洗，并加入了天主教会。但是日后他宣称自己是一个不可知论者，并且还在他祖母的影响下接纳了左倾的意识形态。他最早在巴黎高等师范学院学习哲学与经济，之后在法国国家行政学院就读。完成学业后，他作为一名投资银行家为罗斯柴尔德银行工作，并在他代理的一笔数目高达九十亿美元的交易中挣得了他的第一个一百万美元。2012年，他被任命为法国经济、产业更新和信息技术部长。2016年，他辞去了这项职务以参加总统竞选。\n\n作为一个总统，马克龙力图推行经济改革计划，具体措施包括减少公共开支与放宽劳工市场限制。广泛的民众抗议，包括于2018年下半年爆发的针对增加燃油税提案的“黄马甲”运动，已然成为了他任期上的污点。马克龙将法国对阿尔及利亚的殖民称为“对全人类犯下的罪过”，并称对利比亚的干涉是“历史性的错误”。即便如此，法国仍然在暗处对西非那些弱小的国家施加影响，没人确切知道马克龙为了维护法国利益能走到哪一步。在重重挑战之下，马克龙仍然是国际舞台上的重要人物，并在对抗气候变化，保障国际安全和促进欧洲国家团结等诸多议题上呼吁国际合作。"
 POLITICS_JEANLUC_MELENCHON_DESC: "让-吕克·梅朗雄，既法兰西第五共和国新任总统，不单单是一名政治家，也是一位积极主张社会变革和人权的斗士。在工人阶级家庭中长大的梅朗雄，从小就懂得了团结和社区的价值。他的成长经历让他对普通人的斗争产生了深切的同情，并决心为他们的权利而战。梅朗雄习得了哲学和经济学，对知识的好奇和对社会正义的承诺带他走上了政治生涯。作为一名前教师和活动家，他明白教育和基层组织有着实现重大变革的力量。\n\n梅朗雄作为一名领袖，以充满激情的言辞和不容妥协的原则而闻名。他的任期将会聚焦于建立一个更公平公正的社会，让财富和权力更均匀地分配，每个人都有机会茁壮成长。"
 POLITICS_OLIVIER_FAURE_DESC: "奥利维尔·富尔是法国政坛上的杰出人物，现任社会党的书记。他出生于一个政治参与度很高的家庭，在社会正义和进步价值观的讨论中成长。他的学术生涯始于巴黎政治学院，在那里他磨练了对政治理论和社会问题的理解。富尔的政治生涯始于顾问，并迅速发展成为领导角色，这反映了他对社会主义理想的坚定承诺。\n\n作为社会党书记，富尔主张法国应优先考虑社会公平、环境可持续性和经济正义。他相信集体行动的力量，并致力于团结左翼，在共同的旗帜下应对国家面临的紧迫挑战。他的务实方法寻求在理想主义和可实现的政策目标之间取得平衡，努力重新联系失去权利的选民，同时推动有利于工人阶级的改革。富尔的愿景是团结一致，让边缘化群体的声音得到放大，并将法国大革命的理想——自由、平等、博爱——赋予生命。"
 POLITICS_FRANCOIS_RUFFIN_DESC: "弗朗索瓦·鲁芬是一位极具影响力的记者、电影制作人和政治活动家，以其草根政治路线和对社会正义的坚定承诺而闻名。鲁芬成长于一个普通的家庭，他对工人阶级的挣扎有着强烈的同理心，这在他日后成为弱势群体代言人的工作中得到了体现。他因其纪录片揭露社会问题而获得认可，这些纪录片捕捉了当代法国普通公民面临的现实。\n\n作为总统，鲁芬体现了人民的声音，他优先考虑与选民直接接触和社区组织。他充满激情的演讲和对抗性的风格挑战了政治建制派，敦促进行改革以解决收入不平等、工人权利和环境问题。鲁芬对法国的愿景是，通过积极的公民参与复兴民主，使政策反映工人阶级的需求和愿望。他力求创建一个让每个公民都感到有能力要求变革并能在治理中拥有发言权的国家。"
 POLITICS_MARINE_LEPEN_DESC: "玛丽娜·勒庞，既法兰西第五共和国新任总统，不仅仅是一名政治家，更是一位深深植根于法国社会血脉中的女性领袖，兼具母亲与家族传承者的双重身份。她自幼在政治氛围中成长，亲眼见证了父亲让-马里·勒庞领导国民阵线党时的奋斗历程与辉煌成就。尽管理念各异，玛丽娜始终铭记家族的重托，立志在法国政治舞台上书写属于自己的辉煌篇章。她毕业于巴黎第二大学法律系，早期律师生涯不仅锤炼了她的专业素养，更让她深刻体会到了民间疾苦与社会不公。这段经历如同火种，点燃了她对正义的无限热情，以及对捍卫法国人民权益的坚定信念。\n\n作为一位母亲，勒庞深知安全与稳定对于法国万千家庭的重要性。她的执政理念便是致力于为下一代打造一个更加安全、繁荣的未来，一个能够抵御全球化浪潮冲击、抵御文化侵蚀侵蚀的避风港。"
 POLITICS_ERIC_ZEMMOUR_DESC: "埃里克·泽穆尔，既法兰西第五共和国新任总统，其身份远非单一专家所能概括，他更是一位勇于破冰、直言无畏的思想家。自幼成长于巴黎多元文化交融的社区，泽穆尔亲眼目睹并深刻体验了移民与多样性带来的复杂与紧张，这些经历深刻塑造了他的世界观，并激发了他对法兰西民族身份与文化传统的深厚情感与自豪。泽穆尔接受过法律和政治科学教育，而他作为记者与作家的职业生涯，更是以敢于触碰禁忌、挑战传统叙事而著称。他坚定不移地捍卫法国的核心价值观与传统，这一立场虽使他成为争议焦点，却也赢得了那些在主流政治中感到边缘化或忽视的群体的深切共鸣与坚定支持。\n\n作为领导者，泽穆尔坚信保护法国文化遗产和民族身份的重要性。在他的总统任期内，他将致力于保护法国的主权尊严，加强边境管控，恢复法国社区的法治与秩序。"
 POLITICS_PIERRE_DEVILLIERS_DESC: "皮埃尔·德维利耶，既法兰西第五共和国新任总统，其已不只局限于军事领袖，更是一位以高尚品德、正直无私和深厚国家责任感著称的杰出人物。出身于军人世家的他自幼沐浴在纪律与奉献的光辉之下，深受其父——一位功勋显赫将军的熏陶，心中根植了对国家的深情厚爱及捍卫其利益的坚定信念。德维利耶在军事战略与领导力方面有着深厚造诣，他因此在军旅生涯中屡创佳绩，足迹遍布全球那些考验意志与勇气的极端地带。战场上的磨砺，不仅铸就了他坚韧不拔的意志，更让他对地缘政治的微妙格局与现代战争的复杂面貌有了深刻而独到的见解。\n\n作为领导者，德维利耶展现出了非凡的谦逊与开放心态，乐于倾听专家与顾问的见解。在他的总统任期内，团结与合作将成为推动国家前行的核心动力；他将致力于巩固法国作为全球领袖及民主与人权捍卫者的地位，无论是在国内还是国际。"
 POLITICS_JADOT_DESC: "亚尼克·雅多是欧洲生态绿党的领袖人物，以其独特魅力引领该党，同时在法国环保运动中占据重要地位。他出生于1967年，自幼在崇尚自然与可持续发展的家庭环境中成长。他在政治学与国际关系的学术背景，不仅深化了其对环境问题的关切，也促使他在投身政坛前，积极参与多个非政府组织的环保工作。\n\n雅多的政治生涯始终以对气候变化的坚决抗争和对绿色政策的积极倡导为鲜明特征。他深刻认识到，生态危机不仅关乎环境，更涉及社会与经济层面，人们亟需采取紧急行动共同守护地球家园与脆弱群体。作为欧洲议会议员，他积极支持并推动雄心勃勃的气候立法，同时大力倡导欧洲绿色协议。雅多期望法国能在可持续性、能源转型和社会公平方面引领潮流，致力于实现一个地球健康、社会公正的愿景。"
 POLITICS_PECRESSE_DESC: "瓦莱丽·佩克雷斯是一位经验丰富的政治家，共和党领袖，以务实的执政风格和对经济改革的重视而闻名。她成长于一个政治氛围浓厚的家庭，自幼便对公共服务抱有浓厚兴趣。她曾在久负盛名的巴黎政治学院学习，后来又在法国国家行政学院获得学位，为她日后的政治生涯奠定了坚实基础。\n\n作为前高等教育与研究部部长，佩克雷斯致力于教育改革和创新。她坚持财政责任、维护公共安全，并强调强化国家认同的重要性。对于法国的未来，她抱有振兴经济、缓解失业状况以及维护全球竞争力的愿景。佩克雷斯试图以现代保守主义为旗帜，团结中右翼力量，推动实现社会福利与经济增长的平衡，同时兼顾多元化选民的需求。"
 POLITICS_BARDELLA_DESC: "若尔丹·巴尔代拉是法国政坛的新兴领袖，亦是国民联盟年轻有为的掌舵人，象征着法国极右翼政治的新一代力量。他出生于1995年生，在充满政治激情的家庭熏陶下成长，自青少年时期便积极投身政治活动。他对政治学的深入钻研，更是点燃了他攀登政治高峰的雄心，促使他一步步从党的发言人晋升至党主席之位。\n\n巴尔代拉的领导风格鲜明，他高度重视民族主义、移民管控以及法治秩序。他自视为“被忽视”的法国民众代言人，积极倡导制定以这些群体的需求和关切为优先的政策。在他的引领下，国民联盟致力于重塑法国的国家认同，坚决捍卫文化遗产与传统价值观。巴尔代拉以其激昂的演讲风格及与年轻选民建立深厚联系的能力，赢得了广泛关注。他矢志增强国民联盟在法国政治版图中的影响力，勇于挑战现有格局。"
 POLITICS_ROUSSEL_DESC: "法比安·鲁塞尔是法国共产党的杰出代表，其内战结束后迅速崭露头角，成为重要的领导人。他出身工人家庭，自小便对工人权益和社会正义抱有深厚情感。他的政治生涯始于地方议员，因积极为劳工发声、推动社区赋权而迅速赢得认可。\n\n内战结束后，鲁塞尔成为左翼的中流砥柱，致力于弥合社会裂痕，为弱势群体争取权益。他展现了工人阶级的坚韧精神，倡导以经济公平、环境可持续性和强化社会服务为核心的新社会主义愿景。凭借激情洋溢的演讲和卓越的草根组织能力，鲁塞尔赢得了众多渴望更加公正平等法国的民众的支持。\n\n在领导风格上，鲁塞尔强调合作与团结，致力于联合左翼各派别共同挑战现状。面对法国冲突后的挑战，他憧憬着一个通过集体行动实现变革的未来，构建一个每个公民都能繁荣发展的、自由、平等、博爱的理想社会。"
 POLITICS_COQUEREL_DESC: "埃里克·科克雷尔是一位著名的左翼人物，以其对社会正义和经济平等的坚定捍卫而著称。他出生于1974年，政治氛围浓厚的家庭背景促使他终身致力于左翼事业。科克雷尔拥有经济学与政治学的学术背景，并已从事激进主义活动数十年，期间始终关注工人权益、环境正义及反对紧缩政策等核心议题。\n\n作为国民议会议员，科克雷尔因其慷慨激昂的演讲和对选民的无私奉献而广受赞誉。他坚信草根运动和集体行动能够推动社会发生有意义的变革。科克雷尔对法国的愿景涵盖了促进社会公平、追求可持续发展及复兴公共服务等方面。他积极动员左翼力量，团结各方力量，共同为构建一个每个人都能享有平等机会和基本权利的法国而努力。"
 POLITICS_BENEDETTI_DESC: "伊万·贝内代蒂是位狂热的民族主义领袖，他于内战后崭露头角，并毫不掩饰自己的法西斯意识形态，不禁让人想起贝尼托·墨索里尼早期的政治理念。作为1980年生人，他在政治动荡的氛围中长大，这一经历使他形成了塑造一个强大的、将法国公民利益置于首位的威权国家的愿景。\n\n贝内代蒂主张对法国进行彻底改革，寻求消除对国家认同的威胁，恢复他认为的法兰西昔日辉煌。他的演讲与那些对传统政治感到幻灭的人产生了共鸣，承诺恢复强有力的领导，拒绝多元文化主义。贝内代蒂的言语间充斥着激烈的民族主义、对自由民主的蔑视，并呼吁那些与他有共同愿景的法国人团结起来。\n\n作为巩固权力的手段，贝内代蒂的领导风格体现在建立一个中央集权的独裁政权的雄心上，这与早期意大利法西斯主义如出一辙。他试图拆除现有的政治结构，取而代之一种新秩序，强调对国家的忠诚，并严格遵守他对法兰西认同的愿景。贝内代蒂在国家分裂之时，把自己塑造成一个对民族自豪感毫不妥协的捍卫者，准备夺权，重新定义法国的未来。"
 FRA_form_a_scientific_committe_to_combat_the_pandemic: "成立科学委员会"
 FRA_form_a_scientific_committe_to_combat_the_pandemic_desc: "在武汉和中国其他地方政府没能防止新型冠状病毒传播之后，其已经开始在法国，欧洲和全世界迅速传播。疫情和病毒短时间内都不会消失，而对抗疫情的第一步是要了解它。为了达成这个目的，法国政府需要组建一个由人类学，生物学和经济学等领域的专家以及一些来自不同政府机关的官员组成的科学委员会。该委员会将能够就早期对抗新冠病毒起草一系列的建议和计划供法国政府实施。"
 FRA_research_the_vaccine: "启动疫苗研发"
 FRA_research_the_vaccine_desc: "被广泛称为“新冠病毒”的SARS-CoV-2已经表现出强烈的传染性和在感染该病毒的人体内引发致命疾病的能力。许多医院已经没有空余的用以治疗患者的呼吸器。虽然正在考虑封控和佩戴口罩等措施，并且某些地区已经开始施行，为了让疫情真正结束，我们无疑需要疫苗。科学委员会已经与包括赛诺菲在内的法国各大生物科技公司会面，且建议立即开始疫苗的研发。"
 FRA_enforce_a_lockdown_to_buy_time: "宣布授权封控"
 FRA_enforce_a_lockdown_to_buy_time_desc: "迅速扩张的新冠疫情已经开始使得法国许多医院接纳新病人的能力不足。要避免疫情进一步传播我们必须采取极端措施。科学委员会已经建议大面积封城。虽然这几乎一定会导致法国经济近期内跌入冰点，但是可以大幅减轻国家医疗系统的压力，并且可能拯救数以万计法国人民的性命。"
 FRA_ease_the_restrictions: "放宽封控执行"
 FRA_ease_the_restrictions_desc: "显而易见，当前的封控措施对经济和社会都造成了难以承受的压力。为了确保政治稳定，我们必须适度放宽管制。法国定能顺利度过这次难关。"
 FRA_keep_the_restrictions: "严格执行封控"
 FRA_keep_the_restrictions_desc: "我们的医生带来了可怕的消息，之前的死亡率估计过于乐观。更令人心惊的是，老年人的死亡率竟高达近45%（而最初预测仅为17%）。尽管我们尚不清楚为何最为极端方预测也出了错，也不明白为何其他国家的死亡率似乎较低（或许是我们遭遇的病毒是原始毒株的变异版？），但我们绝不能坐视国民继续受害。"
 FRA_expand_welfare_payments: "批准经济刺激计划"
 FRA_expand_welfare_payments_desc: "尽管经济遭受重创，但人民的福祉必须放在首位。数月的失业已导致许多人无法自给自足，急需我们的援助。我们的首要任务是保障人民的生活，并暂时为他们提供经济支持。"
 FRA_push_vaccine_research: "拉起医用封锁线"
 FRA_push_vaccine_research_desc: "我们的官僚体系老旧且行动迟缓，已无法应对如此严峻的局面。我们的医护人员必须动用一切可用资源来应对这场疫情。他们是我们唯一的希望。"
 FRA_push_for_mass_vaccinations: "强制疫苗接种"
 FRA_push_for_mass_vaccinations_desc: "随着首批疫苗的抵达，我们将着手在法国全国范围内推广疫苗接种工作。我们强制要求政府公务员、军人及公共服务人员接种疫苗，并鼓励各企业效仿执行。然而，现在已有反对声音出现，部分人声称不应强制接种疫苗。他们似乎对即便在现有防疫措施下仍不断出现的死亡病例视而不见。我们不能再对严峻形势视而不见，可没有什么值得我们冒此类风险。"
 FRA_look_to_the_swedes: "法国问题，瑞典方案"
 FRA_look_to_the_swedes_desc: "瑞典政府原计划不采取严格的新冠限制措施。尽管目前尚无法验证其在遏制病毒传播方面的成效，但瑞典在稳定经济形势方面确实取得了成功。我们应借鉴其经验，保障日常生活正常运转。只需加大对医院的资金支持，同时实施适度的限制措施，民众就能继续工作！"
 FRA_revitalise_the_economy: "经济回暖计划"
 FRA_revitalise_the_economy_desc: "新冠疫情对全球经济增长造成了显著冲击。正因如此，持续实施严格的防控措施反而可能进一步加剧这场危机的负面影响。我们不能在这个至关重要的时刻，让国家陷入困境，更不能让其失败！"
 FRA_develop_immunity: "群体免疫方案"
 FRA_develop_immunity_desc: "尽管广泛接种疫苗看似是最佳策略，但我们不宜将有限的资源和资金投入到独立疫苗研发中。同时，我们也需避免过度依赖美国的辉瑞疫苗。鉴于此，卫生部建议通过“提升民众免疫力”的方式来应对疫情。这虽是一场风险较高的尝试，但如果我们能将资金集中用于治疗重症病例，而让其他患者使用政府核准的“缓解症状”药物进行自我治疗，这一策略或许能够奏效。这样，人们就能像什么也没发生过一样继续工作。"
 FRA_Restart_of_the_protests: "背心革命"
 FRA_Restart_of_the_protests_desc: "该死的，当然了，那些黄背心也在闹事。太TM好了。国家团结？见鬼去吧！我们必须确保迅速解决这场危机，否则他们的捣乱将彻底破坏我国的整个复苏进程！"
 FRA_push_through_reforms: "屈膝下跪"
 FRA_push_through_reforms_desc: "我们现在真没办法应对此情况。我国经济已陷入低谷，整个国家都停止了活动。我们必须竭尽全力扭转局势，为此，必须接受他们提出的所有条件。"
 FRA_try_to_negotiate: "回到谈判桌"
 FRA_try_to_negotiate_desc: "尽管形势严峻，但我们或许能够找到应对策略。我们可以尝试限制他们的野心，看看这是否可行？"
 FRA_the_negotiations_fail: "分而治之"
 FRA_the_negotiations_fail_desc: "好吧，如果他们想采取强硬手段，那我们就奉陪到底。我们将派遣警察驱散抗议者，并展示他们所造成的破坏，包括烧毁的汽车等。让法国人民亲眼看看，这些所谓的“英雄”究竟干了些什么。"
 FRA_accept_modifications: "欢乐妥协"
 FRA_accept_modifications_desc: "真是一场精彩的谈判！我们成功安抚了黄背心抗议运动，同时也没有在社会支出上造成太大损失。法国素以关怀工人著称，这次事件再次印证了这一点。"
 FRA_negotiate_with_the_syndicates: "与工会合作"
 FRA_negotiate_with_the_syndicates_desc: "我们必须向世界表明，这些暴徒绝非法国工人阶级的代表。我们应当借助工会及其对我国体制的支持来平息混乱局面，同时，也要设法通过贿赂等手段让那些参与抗议的工会撤回他们的支持。法国绝不会向暴力分子低头。"
 FRA_back_to_normalcy: "强化改革"
 FRA_back_to_normalcy_desc: "根据与黄背心抗议运动的协议，我们将把改革成果巩固于法律之中。法国再次成功应对了危机！"
 FRA_The_Opening_Volley: "开场截击"
 FRA_The_Opening_Volley_desc: "自70年代成立以来，“国民阵线”就一直是法国政坛的一股喧嚣的力量。虽然玛丽娜·勒庞煞费苦心地试图剔除党内法西斯主义与贝当主义的成分，但是许多法国人仍然认为这是一个极右翼政党。尽管如此，勒庞还是宣布她将参加2022年法国总统竞选。法国正面临的严重经济问题与内部动荡让很多人认定她将对马克龙连任法国总统的计划提出重大挑战。谁是选战胜者，唯有时间证明，但无论结果如何，都必定会导致民愤的爆发，进一步加深法国政界的鸿沟。"
 FRA_en_marche: "与马克龙同行"
 FRA_en_marche_desc: "马克龙在2016年大选的胜利给了法国成为一个不受激进主义和政治动荡影响的共和国的机会：它将用理解与合作带给欧洲与世界和平与安全，并只在针对专制势力的必要场合动用武力；它将为少数民族和移民提供成为多元法国一部分的新机会，并同时维护法兰西的光荣传统；它将真正践行它的革命理念：“自由，平等，博爱”。那些国民阵线中的法西斯叛徒想要摧毁的就是这样一个共和国，但是马克龙在2022年大选中即将到来的胜利将见证他们阴暗图谋的永远粉碎。"
 FRA_rassemblent_national: "指望勒庞"
 FRA_rassemblent_national_desc: "几十年来国民阵线在法国政坛中仅仅是勉强度日，偶尔崛起之后就重新回到无关紧要的状态。在玛丽娜·勒庞决定参选之后，这样的情形终于开始改变。马克龙的那些自由派政策明显已经导致法国近乎崩溃。是时候扭转形势了。法国再也不会将自己的主权拱手让给未经选举的超国家组织，法国人民的意愿也再也不会再被远在布鲁塞尔的官僚所推翻。伊斯兰主义者也永远不能继续将他们那狂热的宗教极端主义强加于法国民众之上。不能再这样了，2023年，法国必将解放。"
 FRA_the_west_african_sphere: "§Y巨象行动§!"
 FRA_the_west_african_sphere_desc: "我们在非洲的利益显而易见，那些曾是我国殖民地的国家，如今在经济、语言和军事上仍与我们紧密相连。不少“左派”认为我们应放弃这些地区，把我们的稳定努力视为“新殖民主义”。他们从未意识到，我们不能坐视法语圈兄弟国家遭受圣战分子和俄罗斯支持的军政府的侵害。我们必须全力以赴，确保对该地区的掌控。"
 FRA_economic_assistance: "经济干预"
 FRA_economic_assistance_desc: "我们的法语圈伙伴长期以来承受着严峻的经济挑战，频繁遭受叛乱势力的侵扰，导致其国内产业发展相较于南部的尼日利亚略显滞后。我们必须采取行动以扭转这一局面。为此，我们将投资西非，为其经济注入新的活力，而这份投资自然也将为我们带来回报……"
 FRA_military_assistance: "军事援助"
 FRA_military_assistance_desc: "尽管西非地区的经济状况迫切需要改善，但若不先稳定区域内的冲突，任何努力都将难以奏效。我们的军队已在这片土地上浴血奋战了十年之久，但若缺乏当地政府的有效军事力量支持，所有的牺牲和努力都会白白浪费。因此，组建一支受我方协调的、强大的当地军队网络，对于我们的未来规划至关重要。"
 FRA_combat_islamic_terrorism: "打击伊斯兰极端主义"
 FRA_combat_islamic_terrorism_desc: "尽管俄罗斯的影响对我们的非洲计划构成了潜在威胁，但圣战分子的问题更为紧迫，需要我们立即应对，而俄罗斯及其傀儡政权同样不希望伊斯兰主义者上台。除了法语圈伙伴的支持外，尼日利亚的合作对于此次行动能否成功也至关重要。"
 FRA_cease_social_dumping: "终止社会倾销"
 FRA_cease_social_dumping_desc: "我们必须将人民的福祉置于首位。我国的贫困地区正饱受企业侵犯劳动者权益之苦，而提高工人报酬、扶持乡村地区才是法国的理想所在。"
 FRA_tackle_trade_unions: "打压工会"
 FRA_tackle_trade_unions_desc: "共产主义者总是批评我们“不支持工人”，然而事实是工会在一直与我国工业界争吵不休。他们不断的抗议、暴乱和罢工只会扰乱国家的稳定。立即取缔他们！"
 FRA_pension_reform: "养老金改革"
 FRA_pension_reform_desc: "为了法国经济的长远发展，政府果断决定将退休年龄从62岁上调至64岁。这项改革旨在确保养老金制度的可持续运行，同时适应人口老龄化和预期寿命增长的趋势。改革的支持者认为这将有助于改善公共财政状况，为法国在社会服务和经济增长方面的持续投资奠定基础。尽管部分行业对此表达了忧虑，但政府坚信这一必要调整将提升经济韧性，为后代创造更公平的环境，维护法国社会保障体系的完整与稳定。"
 FRA_eu_recovery_instrument: "欧盟复苏利器"
 FRA_eu_recovery_instrument_desc: "虽然勒庞声称欧盟在经济上拖了我们的后腿，但实际情况并非如此。无论是欧盟内部移民还是统一市场，只要我们保持团结，我国的影响力就有助于我们迈向更高的层次。"
 FRA_support_european_federalization: "支持欧洲联邦化"
 FRA_support_european_federalization_desc: "虽然外界仍视我们为大国，但实际情况并非如此。美国无论在军事还是经济层面，都显著地超越欧洲；中国的廉价商品充斥着我们的市场；全球南方国家不仅不尊重我们，还拒绝采纳我们的建议。更令人震惊的是，俄罗斯——那个我们认为已彻底击败且无法复苏的国家，如今却再次崭露头角，企图重获往昔的权力。那么，我们为何不能迎头赶上？作为现代国家、文化和技术的摇篮，欧洲难道不配拥有世界舞台上的显赫地位吗？我们必须团结一致，因为唯有如此，我们才能再度崛起，跻身大国之列！"
 FRA_immigration_regulation: "移民条例"
 FRA_immigration_regulation_desc: "持续不断的移民潮冲击着我们的海岸，而这一现象早已成为备受关注的政治议题。尽管历届政府都向我们保证，这些主要来自前殖民地的移民能够被同化，但事实证明，我们难以迅速有效地整合他们。大城市周边，无法无天的贫民窟比比皆是，警察对此鞭长莫及；我们的教师因坚守宗教解构与分析的法国立场而遭遇斩首，女性因担忧夜间遭暴徒袭击而不敢单独外出；伊斯兰恐怖主义的威胁更是令人不寒而栗。面对这些问题，我们需要对体系进行深刻反思与修复，而阻止移民正是我们应迈出的第一步。"
 FRA_increase_corporate_tax: "提高企业税"
 FRA_increase_corporate_tax_desc: "所谓的大企业只会榨取普通法国人的血汗。虽说可以将当前的财政赤字归咎于马克龙政府，但我们仍需要寻找解决之道。通过对大企业征税并扶持小型企业，我们不仅可以促进国内市场的平衡，还能为财政部提供未来计划所需的资金。"
 FRA_strengthen_protectionism: "加强贸易保护"
 FRA_strengthen_protectionism_desc: "怎么能容忍我国企业和工业因廉价商品充斥市场而遭受损失甚至倒闭？我们绝不会坐视不管！"
