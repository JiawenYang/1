 FRA_EU_Moratorium_of_Political_Debate: "关停政治辩论"
 FRA_EU_The_Second_Star_in_the_Union_desc: "法国历来是欧盟的基石。自1958年加入以来，我们已从普通成员跃升为领导者，引领欧盟扩张至今日之规模。尽管面对俄罗斯的入侵时我们一度动摇，但我们决不会放弃欧洲统一的梦想。保守派和社会主义者可以肆意反对，但我们不会理会他们的胡言乱语。若欧洲之梦要存续下去，消失的不会是法兰西民族，而是那个必须融入由巴黎引领的联盟之中的德意志民族。"
 FREU_the_union_cat: "我们的欧洲"
 FRA_EU_Repairing_the_National_Body_desc: "我们虽战胜了军国主义者与社会主义者，但这场胜利并非毫无代价。我们接手的，是一个满目疮痍的国家。广袤的乡野化为废墟，城市在烈焰中残破不堪，连我们宁静的首都也未能幸免于战火之厄，甚至埃菲尔铁塔亦受创伤。在推进泛欧洲计划之际，我们将开启修复法兰西躯体的艰辛历程。随之而来的，不仅是对我们致力于欧洲统一的考验，更是对我们愿为复兴法兰西民族所付出的极限之试炼。我们将坚持到底，无论代价几何，行动多难。"
 FRA_EU_The_Cult_of_Reason_desc: "理性崇拜诞生于法国大革命初期的动荡年代，它曾是共和价值的象征，承载着对真正进步的追求。然而，这一理念却遭到罗伯斯庇尔的篡夺，使其沦为巩固个人权力的工具。尽管如此，理性崇拜的核心思想至今仍然具有现实意义。在我们重建昔日辉煌的法兰西时，这些理念将成为新政权的基石，引领我们走向理性、平等与创新的未来。"
 FRA_EU_The_Will_to_Grow: "意志旺盛"
 FRA_EU_Diversify_the_French_Citizen_desc: "什么才真正代表法国公民？右翼或许会声称，法国公民就是欧洲人。但我们深知，事实远不止于此。法国是一个多元文化与多民族交融的熔炉，若试图用单一形象去定义所有法国公民，便是对这片土地上丰富文化的亵渎。若我们真心希望代表人民，就必须拓展“法国人”的定义。歧视的时代已经过去，再也没有人会因身份而被视为低于公民。若我们真心希望摆脱历史的错误，那么重塑法国公民的概念，便是迈向真正平等未来的众多步骤之一。"
 FRA_EU_A_New_Technocratic_Superstructure_desc: "尽管许多人认为技术官僚制是一个崭新的概念，但历史早已证明事实并非如此。该术语最早由威廉·亨利·史密斯于1919年提出，并在20世纪30年代由霍华德·斯科特进一步发展。尽管技术官僚运动最终未能成功并解散，但其理念至今依然影响深远。第五共和国在欧陆战争中的失败已充分证明，法国需要一种全新的治理体系。贪婪自私的政客不再掌控国家，而是由庞大的专家团队接管政府日常运作。他们虽非由人民选举产生，但将以国家利益为最高目标，推动法国的真正变革。"
 FRA_EU_European_Emergency_desc: "随着枪声停息、战火熄灭，我们战胜了敌人。无论是民族主义者还是共产主义游击队，都被驱逐回阴影之中，自由在我们最需要的时刻取得了胜利。然而，我们现在不能松懈。局势依然混乱，激进分子将不择手段地篡夺我们的控制权。在这危急时刻，我们寻求外部援助。尽管我们输掉了这场战役，但战争远未结束。我们将以更加团结的姿态归来，团结为统一战线，直面敌人。"
 FRA_EU_Embolden_the_Euro: "鼓励使用欧元"
 FRA_EU_The_Will_to_Grow_desc: "进步从来不会自然发生。必须有人推动它付诸实践。而一旦迈出这一步，进步便不可阻挡。尽管第五共和国取得了一些成功，但它未能确保持续的进步。成长的意志被懒惰与冷漠所取代，年轻人安于现状。而就在我们松懈的同时，俄罗斯人却在不断前进。我们未能及时追赶对手，最终导致了在他们手中的失败。为了在与敌人的较量中占据优势，我们必须不惜一切代价追求进步与增长。与我们的欧洲盟友团结一致，我们将加快发展的步伐，奔向一个繁荣而自由的未来。"
 FRA_EU_Total_war_the_End_War_desc: "无论我们如何试图否认，都必须面对现实。整个欧洲正无可避免地滑向另一场战争，而这一次，它将比以往任何一次都更加毁灭性。整个大陆的命运悬于刀锋之上，如果我们不亲自掌握它，敌人就会夺走它。如果我们想要称霸，就必须不惜一切代价去赢得胜利。我们的士兵将不再受任何限制或准则的束缚。我们要把全部怒火倾泻在敌人身上。只有在彻底胜利之后，我们才会放下武器。而那一次，会是最终的和平。"
 FRA_EU_Beyond_our_Singular_Existance_desc: "法兰西的本质究竟是什么？一个民族？一种理念？还是主权国家？我们对此有着不同见解。法兰西为何不能超越单纯维系自身存续的窠臼，承担更高使命？保守派抨击欧盟是“全球主义者的工具”，社会主义者则谴责其“延续资本主义压迫’，但这些批判皆属谬误。正如我们已经承认法兰西民族必须超越自身，德意志如今也必须承认德意志民族国家概念已失去现实意义。拒绝变革的国家终将被时代洪流吞没，若固步自封，必将重蹈那些冥顽不灵者的覆辙。"
 FRA_load_eu_tree_debug_decision:0 "加载@BRS§3欧盟§!国策树"
 FRA_EU_United_Under_Humanity: "团结于文明旗帜下"
 FRA_EU_Economic_Enrichment_desc: "法兰西具备得天独厚的资源优势，境内矿产资源储量可观、农业用地肥沃高产。尽管我国历来重视耕地开发，但对矿产资源的利用始终存在不足。如果我们希望摆脱对非洲和中国的依赖，就必须振兴法国的矿业与农业。对这两个行业的补贴将刺激经济增长，并为本国公民和移民创造就业机会。同时，这也能让我们支撑起广泛的公共服务体系。这样的变革不仅有益于我们自身，也将惠及我们的盟友，我们的合作伙伴将得以获取来自法兰西矿区的高品位矿石，以及本国现代化农场的优质农产品供应链。"
 FRA_EU_Cyber_Warfare_Department: "网络战部门革命"
 FRA_EU_Paying_our_Tithe_desc: "在现代社会，没有什么是免费的。商品、服务、公共设施——一切皆有代价。尽管我们的盟友大力协助了我们的重建，但这并非无偿援助。德国及比荷卢地区仍然饱受俄罗斯破坏行动与导弹袭击的创伤，大片区域亟待修复。他们毫不犹豫地帮助了我们，如今，他们同样期待我们的回报。无论是资源、劳动力，还是资金，我们都必须尽一份力，为他们的复兴贡献我们的力量，正如当初他们对我们的支持一样。或许有人会抱怨这是一种额外的负担，但这最终符合我们的根本利益，履行这一责任，既是对泛欧理想的坚定承诺。"
 FRA_EU_Embolden_the_Euro_desc: "自1996年问世以来，欧元堪称欧洲联盟最辉煌的成就之一。它不仅是一种货币，更是团结的象征，各国（包括我们）相继采纳欧元，正是对泛欧理想忠诚不渝的承诺。许多人曾以为，俄罗斯在东线的胜利将使欧元陷入危机，但事实却恰恰相反。欧元不仅未曾衰落，反而增长更为迅速。而随着我们正式加入欧盟，这一趋势将持续加强。我们的力量便是欧元的力量，巩固欧元，只是通往欧洲完全统一征途上的一步。"
 FRA_EU_The_Cause_of_the_People_desc: "自欧洲统一的梦想诞生以来，我们始终不遗余力地推动其成为现实。然而，我们不能忘记，我们所服务的，是千千万万的人民。面对我们的目标，仍有许多质疑之声。有人认为这不过是少数精英的操纵，亦有人将其斥为企业压迫的延续。要赢得人民的信任，我们必须消除他们的疑虑，让他们确信，我们的承诺是献给人民，而非某些企业高管或全球主义者。唯有赢得民心，我们才能真正迈出建设的步伐。"
 FRA_EU_Never_Again_means_Now_desc: "自莫斯科耀武扬威彰显胜利时，我们便在内心深处暗自发誓，绝不让悲剧再次重演。我们绝不会再让投机分子和民粹主义者破坏那自由而统一欧洲的梦想，绝不会再让那些专横揽权者侵害自由。而这些“绝不”不会在虚无缥缈的明天和下周，它将在此刻实现！现在就是向东方邪魔发动征讨的时刻，就是实现我们欧洲一统最终梦想的时刻。此时不待，更待何时！"
 FRA_EU_The_Public_Private_Enterprise: "公私合营企业"
 FRA_EU_European_Cooperation_desc: "自古以来，合作便是良政之基，任何强盛政权皆根植于协作与共识，我们亦不例外。我们的治国之道，将以开放合作为准则，与盟友携手共进。贸易协定的签订，联合军演的开展，皆是我们对欧洲愿景坚定不移的承诺。我们将向柏林的盟友证明，我们不仅愿意合作，更将主动推动合作，让这片联盟之土孕育出更伟大的未来——超越国界与政权，最终铸就一场无法撼动的兄弟盟约。"
 FRA_EU_The_Global_Project: "全球计划"
 FRA_EU_Dissolve_Executive_Authority: "杜绝独断专横"
 FRA_EU_Post_Ideological_Governance_desc: "在我们迈向欧洲计划的最终目标之际，还有一个问题必须解决——意识形态的束缚。若我们希望彻底摆脱旧日法兰西的影响，就必须抛弃意识形态这一分裂人民的工具。若真正希望团结国民，那么这些旧有观念必须被舍弃。从今往后，保守派、自由派或社会主义者之间的界限将不复存在，那些标签不再划分我们。从现在起，我们只有一个共同的身份——法兰西人，不再被这些过时的定义所束缚。"
 FRA_EU_Iberian_Intervention: "干涉伊比利亚"
 FRA_EU_the_Final_Goalpost_desc: "自气候危机初现端倪以来，法国始终在抗击气候变化。从签署《巴黎气候协定》到资助可再生能源研发，我们在应对气候变化领域取得诸多进展。然而，我们绝不能因此滋生携带，若不能掌握应对主动权，便注定无力拯救世界。正如第五共和国重塑政体，我们必将革新对可再生能源的承诺，大幅削减碳排放。在布鲁塞尔与柏林的支持下，法国将蜕变为未来之国，而可再生能源将引领这场大变革。"
 FRA_EU_Popularizing_the_Pan_Euro_Ideal_desc: "尽管欧洲党等政治运动付出巨大努力，泛欧思潮的普及度仍远未达预期。长期以来，亲欧盟政党在欧洲政坛始终退居次要地位。若想真正实现欧洲统一的目标，我们就必须不遗余力地支持这些政党——提供资金援助、为他们助选，采取一切手段提升其政治影响力。随着支持力量的增强，亲欧盟的民意将如浪潮般席卷整个欧洲大陆。我们将乘势而上，将欧洲统一的理想从愿景转化为现实。"
 FRA_EU_A_New_Technocratic_Superstructure: "技术治国"
 FRA_EU_Blurring_the_Borders_desc: "边界究竟是什么？是沙地上随意划下的线条？还是用民族主义等无用观念分裂人民的工具？事实上，这些都可以说是边界的本质。随着我们离欧罗巴之梦越来越近，我们必须摒弃边界的概念，去迎接一个统一的欧洲；在那里，人民可以自由迁徙，思想和愿景可以自由传播。摒弃边界，就是摆脱其带来的负担，让人们不再被线条所分割。我们不再自称德国人或法国人，我们都是欧洲人，现在如此，永远如此。"
 FRA_EU_Economic_Enrichment: "经济富集"
 FREU_concede_to_the_greens: "向§7欧洲绿党§!让步"
 FRA_EU_Uniting_our_Armies: "团结军队"
 FRA_EU_Democracy_Manifest_desc: "尽管我们对法兰西进行了翻天覆地的变革，有一事始终如一——我们对民主的承诺从未动摇。归根结底，我们仍是民有、民享之国。左右派或会指摘我们为“全球主义的傀儡”或“企业的棋子”，但真相不言自明。我们的职责在于法兰西，在于民主。如今，不止法兰西，而是整个欧洲的未来，皆悬于一线，东方的威胁依然逼近。若今日不救民主，明日巨熊将践踏我土。"
 FRA_EU_A_New_NATO: "新北约"
 FRA_EU_Strangle_Populist_Rabble_Rousing: "扼杀民粹煽动"
 FRA_EU_A_New_NATO_desc: "自1949年成立以来，北大西洋公约组织一直是西方对抗威权主义的前线。许多人认为，随着苏联解体，该联盟已失去存在的必要性。然而，事实远非如此。北约未能成功捍卫东欧免受俄罗斯铁蹄践踏，这已足以证明其弊端。然而，我们并不愿意轻易放弃北约的理念。通过历经考验与改革，我们将重塑这一组织，使其真正履行应有的职责——不仅仅是民主国家的联盟，而是西欧的坚实屏障，一个能够真正直面梅德韦杰夫治下俄罗斯威权主义的堡垒。"
 FRA_EU_European_Cooperation: "欧洲合作"
 FRA_EU_Curing_Industrial_Ailments: "治愈工业顽疾"
 FRA_EU_The_Technological_Spearhead: "科技先锋"
 FRA_EU_Removing_the_Red_Tape: "废除繁文缛节"
 FRA_EU_Iberian_Intervention_desc: "尽管伊比利亚半岛在欧陆战争中相对孤立，却依然未能幸免于战后的余波。随着梅德韦杰夫的胜利，这片曾经宁静的土地已陷入内战的撕裂之中。激进派与分离主义者刀戈相向，试图让各自的理想主宰未来，而半岛上的政府则苦苦坚守马德里与里斯本，竭力维系残存的秩序。然而，我们绝不能袖手旁观，任由局势恶化，否则，若亲俄派势力最终得胜，南方的威胁将直逼我们的边境。因此，在布鲁塞尔的授权下，我们将迅速行动，平定半岛，粉碎激进势力，让昔日宁静的土地重归秩序。在欧洲团结的旗帜下，我们将挽救伊比利亚，使其免于崩溃。"
 FRA_EU_Paying_our_Tithe: "缴纳什一税"
 FRA_EU_Post_Ideological_Governance: "后意识形态治理"
 FRA_EU_United_Under_Humanity_desc: "梦想，终于化作现实；曾被视为虚妄的理想，终于被证实为可能。曾经扼杀希望的民族主义与例外论，已被对世界的拥抱，对多元的接纳所取代。仍有一些保守势力在旧梦中挣扎，声嘶力竭地指责我们向“全球主义”屈膝，背叛了法国的灵魂。但我们比任何人都清楚，今日的法国，前所未有地团结，前所未有地自由。唯有超越国界，我们方能真正强大。因为最重要的，从来不是我们属于何方，而是——无论何种出身，我们皆为人类。"
 FRA_EU_Quell_Nationalism: "镇压民族主义"
 FRA_EU_Blurring_the_Borders: "模糊边界"
 FRA_EU_The_Public_Private_Enterprise_desc: "尽管我们已成功将法国打造为技术强国，但我们仍有更大的潜力可挖掘。法国历来不乏愿意参与国家项目的私人企业家，然而，过去的领导者却从未真正利用这一资源，过度依赖公有企业，导致创新停滞，进步缓慢。我们决不会重蹈覆辙，未来不会等待任何人。如果我们拒绝与私人企业家和创新者合作，那么我们将永远无法真正掌控未来。"
 FRA_EU_Utilize_True_European_Allies_desc: "欧陆战争的失败已向我们昭示：那些自称盟友的人，绝不可轻信。当基辅陷落，无数乌克兰官员毫不犹豫投向俄罗斯一方；波兰将倾之时，西里西亚分离主义者率先背弃。他们是叛徒、是背信者、是投机之徒，然而，这些词汇仍不足以揭露他们的真正面目。若我们要重塑昔日荣光，便只能信任真正的欧洲爱国者——那些愿意以生命捍卫信念的人，那些即便面对死亡，也誓死忠诚于祖国的人。正是这些真正的爱国者，将在我们收复东方的战斗中冲锋在前，并助我们向那些合谋者复仇。"
 FRA_EU_Curing_Industrial_Ailments_desc: "法国一直处于工业进步的前沿。从第一次工业革命到今天，法国工业因其创新精神而享誉世界。然而，法国的快速工业化并非没有代价。在追求工业强国的过程中，我们也助长了全球气候变暖。如今，随着重建工作展开，我们必须重新评估工业化的发展方向。工业固然是国家运转的关键，但我们必须意识到，它并非没有代价。如何在发展与环境之间找到平衡，将是法国未来必须面对的挑战。"
 FRA_EU_Advanced_Digital_Warfare_desc: "战争是一场永不停息的变革，而战场上没有恒定不变的规则，一切都会随时间推移而演变。从坦克到战机，再到无人机技术，战场的混乱程度前所未有。在这个先进战争的时代，若不能顺应潮流，便只能走向毁灭。正如中国所做的那样，我们将大力扩展自身的网络战部门。将网络战整合进军队体系，必将赋予我们对敌方的优势，使我们能够破坏关键基础设施，切断敌方通信，确保战场上的战略主动权。"
 FRA_EU_An_Invisible_Footprint_desc: "自从我们开始对抗气候变化以来，碳足迹的概念便应运而生。它代表了一个人、公司或国家对环境恶化的影响程度。过去的政权已经在减少碳足迹方面投入了大量资金。但遗憾的是，这些努力还不够，至今我们的碳足迹至今仍然巨大。行动的时刻就是现在，不是明天，也不是下周。如果我们不迅速采取行动消除碳足迹，我们的努力将付诸东流。而如果我们今天失败了，可能永远无法为我们的孩子确保一个安全的未来。"
 FRA_EU_If_only: "要是真的多好……"
 FRA_EU_Invite_American_Innovationists: "邀请美国革新派"
 FREU_concede_to_the_militarists: "向§g欧洲军§!让步"
 FRA_EU_Expand_Immigration: "增加移民接收"
 FRA_EU_The_Gears_Turn_Again_desc: "法国的经济就像一台非常精密的机器。当所有齿轮协调运转时，就能成就伟大的事业，也能以创纪录的速度实现创新。但如果某个环节出了偏差，整个系统就会崩溃，这台曾经运转良好的机器便会失灵。在第五共和国覆灭之后，法国经济这台机器再次陷入了失修与衰退。然而，历经重重考验与磨难，曾经停滞不前的齿轮重新转动起来。心脏再次搏动，我们如同凤凰一般，从腐朽与衰败的灰烬中重生。如今，我们勇敢地展望未来，准备迎接前方的任何挑战。"
 FRA_EU_Cyber_Warfare_Department_desc: "自第一台计算机问世以来，电子技术便以惊人的速度发展。从智能手机到无人机，革命性的突破使各国在战争中占据先机。然而，若我们想要在与那头猛兽的较量中胜出，就必须走得更远。无人机与信息战或许有效，但远远不够。我们必须突破常规思维——电磁脉冲武器、义体植入、机械士兵，这些技术都将成为我们未来战争的核心。有人或许会质疑它们的伦理问题，但这并不在我们的关切范围之内。确保胜利，就意味着我们必须敢于接纳那些不被世人认可的技术。"
 FRA_EU_The_Best_and_Brightest_desc: "当下的法兰西，脆弱宛若裂纹遍布的玻璃。它如同一块布满裂痕的琉璃，一步踏错，便可能使本已岌岌可危的体系彻底崩解，坠入无尽的混乱。战后重建之路漫长而艰辛，绝非寻常工人所能轻易掌控。因此，我们必须集结一批卓越的专家，引领这场复兴的伟业。他们将被赋予特殊权限，负责拟定重建蓝图，但最终的决策，仍需由我们亲自定夺。在他们的指引下，我们将把法兰西塑造成未来之国，一个真正承载泛欧洲理想的国度。"
 FRA_EU_The_Best_and_Brightest: "精益求精"
 FRA_EU_The_Second_Star_in_the_Union: "联盟的引航之星"
 FRA_EU_Embrace_AI_desc: "自21世纪开端，人类对人工智能的探索便步履不停，不断拓展未知疆域。从Siri的诞生，到AI技术日新月异的演进，其发展势头已不可阻挡。然而，在世人眼中，人工智能仍是饱受质疑之物，最温和的态度不过是谨慎，而最激烈的则是彻底排斥。大多数人关注AI在创造领域的应用，而我们却更为着迷于它的军事潜能。为了使我们的军队紧跟时代步伐，我们将投入大量资源，将人工智能深度融入军事体系。这不仅将实现军队的现代化，还将有效减少前线的人力伤亡，确保战斗效率的最大化。"
 FRA_EU_Walking_a_Green_Path: "走绿色之路"
 FRA_EU_The_Cult_of_Reason: "理性崇拜"
 FREU_concede_to_the_socialists: "向§p欧洲社会党§!让步"
 FRA_EU_Total_war_the_End_War: "全战终战"
 FRA_EU_Utilize_True_European_Allies: "利用真正的欧洲人"
 FRA_EU_The_Cause_of_the_People: "人民的事业"
 FRA_EU_Never_Again_means_Now: "现在绝不再现！"
 FRA_EU_Expand_Immigration_desc: "法国政坛从未有比移民议题更具争议的话题。自大批阿拉伯移民为逃离“阿拉伯之春”与叙利亚内战的战火而踏足法国，这一问题便迅速引发政府的高度关注。许多人主张收紧移民政策，然而，在我们的治理下，移民之潮不仅不会被阻挡，反而将得到扩展。我们将为移民提供支持与补贴，只要他们愿意投身于法兰西的重建事业。保守派尽可以大声抗议、愤怒斥责，但我们不会理会他们的抱怨。毕竟，掌握权力者，方能定义正义。"
 FRA_EU_Mankind_Redefined_desc: "历史从未善待那些试图重塑“人类”概念的人。太多时候，这一词汇沦为独裁者的工具，以正义之名，行迫害之实。然而，我们的道路截然不同。我们不为践踏，而是为扶持，不为压制，而是为赋权。唯有真正的平等，方能换来真正的繁荣。从今往后，种族、民族、国籍不再是羁绊我们的锁链。我们必须斩断这些人为的界限，让“人类”回归其本质——团结，而非分裂。"
 FRA_EU_Quell_Nationalism_desc: "虽然我们战胜了军国主义分子，但仍有人持续鼓吹其反动论调。这些极端分子日夜发动骚乱，谴责现政权“向全球主义精英出卖利益”、“背叛法兰西人民”。与前任政府对这种行径视而不见的态度不同，我们绝不会姑息纵容。若要彻底实现泛欧理想，就必须彻底粉碎所有形式的民族主义思潮。我们将揪出这些民族主义者，镇压他们的集会，取缔其政党。尽管有人会指责这是赤裸裸的威权统治，但这是实现欧洲统一必须承受的阵痛。若放任这些分裂势力滋长，欧洲永远不可能实现真正团结。"
 FRA_EU_Nation_of_Equality_and_Science_desc: "尽管马克龙的领导存在诸多失败，但我们不能否认第五共和国取得的进步。保守的停滞和倒退被进步与创新所取代，社会服务获得了大量投资，技术创新也得到了资金支持。展望未来，继续资助这些项目是应有之义。在我们的引领下，法国将成为进步与创新的国度，僵化将让位于突破，守旧会臣服于变革。在盟友的帮助下，我们将张开双臂拥抱未来，迎接任何可能的挑战。"
 FREU_the_union_cat_desc: ""
 FREU_freedom_from_extremism: "选择的自由"
 FRA_EU_European_Emergency: "欧洲紧急状态"
 FRA_EU_The_Gears_Turn_Again: "齿轮转动"
 FRA_EU_If_only_desc: "我们曾以为这一切永远不会发生，然而，最终，它还是降临了。那么，如今的我们，又站在何处？尽管我们近来屡获成功，欧洲却依旧被撕裂为两半。无论如何推诿，我们终究必须承认，总有人需要为此承担责任。若那些煽动民粹的狂热者肯倾听我们的忠告，若那些怀疑欧盟的人愿意接受我们的欧洲统一理念，一切是否会有所不同？但他们没有，他们选择了抗拒，于是今日的结局便昭然若揭。我们的盟友或已覆灭，或已沦为莫斯科的傀儡，而整个欧洲大陆，如今被生生撕裂成两半。倘若他们当初愿意倾听，倘若他们肯听从理性，我们是否还能避免今日的命运？"
 FRA_EU_Eliminate_Human_Casualties_desc: "没有国家会在踏入战场时天真地认为自己能毫无损失。然而，战火既已逼近，为什么我们要接受沉重伤亡成为必然？若想赢得胜利，我们必须竭尽全力减少不必要的牺牲。或许，我们可以加大对医疗科技的投资，或推动无人机技术的发展；又或者，我们可以突破生物与机械的界限，在义体科技上取得突破，使士兵战力倍增，战场表现更为卓越。虽然战争终究无法避免死亡，但这些科技的进步，至少能让逝去的生命减少到最低。"
 FRA_EU_Crack_Down_on_Extremism: "打击极端主义"
 FRA_EU_Seeking_Discourse_desc: "法国的力量源于其多党民主制，尽管第五共和国失败了，但我们绝不能抛弃自己的民主根基。在收拾内战残局的过程中，我们迎来了一个独特机遇。虽然极右翼和极左翼拒绝与政府合作，但仍有许多温和派可以说服。通过让步和示好，我们能说服这些中立党派更公开地与政府合作，从而轻松通过立法，大大加快重建进程。"
 FRA_EU_Eliminate_Human_Casualties: "降低人员伤亡"
 FRA_EU_Uniting_our_Armies_desc: "法兰西始终以强大的军事力量为荣。从拿破仑的辉煌时期到如今，仅用“拥有悠久的军事传统”来形容法国都显得过于保守。随着我们日益接近实现泛欧洲主义理想，必须正视一个现实：要真正推进既定目标，就必须把西欧各国军队整合到同一套指挥体系之下。德意志军队将自愿并入以巴黎为核心的欧盟联合指挥体系，以此彰显柏林对欧洲统一事业的承诺。虽然部分德军将领可能会对此颇有微词，但我们的决定不容更改。因为这最终关乎整个欧洲的伟大福祉。"
 FRA_EU_Beyond_our_Singular_Existance: "扩张单一存在"
 FRA_EU_United_By_Science_and_Reason: "因科学理性而团结"
 FRA_EU_The_European_Dream_Marches_on: "大步迈向欧罗巴之梦"
 FRA_EU_Sister_Republic_desc: "法国与欧盟的关系始终独具一格。尽管我们是欧盟的创始成员之一，但近年来，欧元怀疑主义的浪潮已为泛欧梦想投下阴影。泽穆尔和勒庞等政治人物坚决反对任何进一步的欧洲一体化，主张法国必须摆脱欧盟的影响，重获自主。作为对这些势力的妥协，我们将放弃全面统一的目标，转而追求与盟友更紧密的合作。尽管欧洲党等亲欧团体或许会对此不满，但为了联盟的稳定，这一牺牲是必要的。"
 FRA_EU_Our_Offer_to_Brussels_desc: "尽管我们已竭尽所能，但我们在布鲁塞尔的盟友仍不堪重负。布鲁塞尔当局既要管理西部又要管理东部，不得不加班加点地工作。我们不能袖手旁观，坐视我们的盟友被国家职责压垮。我们将向布鲁塞尔提议接管西欧的行政职责，而作为交换，他们将获得一部分经济产出。这不仅能给我们的盟友减负，还将展示我们对欧洲计划的坚定承诺，从而在未来赢得他们的支持。"
 FRA_EU_An_International_Reconstruction_Effort: "国际重建工作"
 FRA_EU_Nation_of_Equality_and_Science: "平等与科学之国"
 FRA_EU_Europeanize_Paris: "欧洲化巴黎"
 FRA_EU_Invite_American_Innovationists_desc: "尽管有人主张仅依靠法国本土专家，但一个外国专家也不要实在是太过荒谬。美国曾作为工业创新的灯塔引领世界。贝塞麦、亨利·福特等实业家推动了诸如流水线生产等重大创新。这个曾繁荣一时的国家虽仍深陷内战泥潭，但像布隆伯格这样的实业家仍能守住其产业根基。尽管寻求外部合作存在风险，但潜在收益远大于风险。这些实业家的建议对加速重建进程具有决定性作用。"
 FRA_EU_Strangle_Populist_Rabble_Rousing_desc: "第五共和国的诸多失败至今仍清晰可见。尽管我们的统治已稳固，但民粹主义政党仍在抵制我们的统治，不断散布反欧盟言论并组织大规模抗议活动。与马克龙不同，我们不会对这些煽动者手软。那些不与我们合作的家伙，就是在反对我们，他们的异议不会被容忍。我们将对这些团体采取强硬措施，审查其领导人并限制其活动。他们可以肆意反对，但可没人会理会。"
 FRA_EU_The_Technological_Spearhead_desc: "21世纪之初是技术飞速发展的时期。就像冷战时期的军备竞赛一样，各公司竞相角逐谁能走在创新的最前沿。技术对于一个国家的存亡从未像现在这样至关重要。无人机和网络战方面的创新让各国能够打击脆弱的基础设施，同时保证士兵的安全。如果我们想在与俄罗斯巨熊的较量中立于不败之地，就必须加快技术推进的步伐。因为如果我们不领先，就会落后，而落后就要挨打。"
 FRA_EU_Popularizing_the_Pan_Euro_Ideal: "宣传泛欧主义"
 FRA_EU_Crack_Down_on_Extremism_desc: "尽管我们击败了军国主义者和共产主义者，但激进主义仍在暗处滋长。若不迅速铲除这些狂热分子，他们就会成为骚扰我们的眼中钉，破坏我们的重建努力。我们将授权清除仍活跃的残余激进团体。有人会谴责这是对自由的侵蚀，但对我们而言这只是必要之恶。那些不支持我们的人，就是在反对我们；而任何对我们统治的反对，只是在拖延其不可避免结局的到来。"
 FRA_EU_Removing_the_Red_Tape_desc: "纵观历史，进步总是被低效的官僚体系所拖延。安全法规、工会谈判、预算限制，这些障碍只会减缓社会的发展步伐。我们无法任由繁琐冗长的审批耗费光阴，最终迎来的不过是计划的胎死腹中。只有削减冗余制度，才能节省宝贵的时间与资金，让那些承载未来的宏伟工程以前所未有的速度破土而出。必然会有人质疑安全法规的削弱，但这是一场不得不做出的取舍。但要让法国迈向未来，我们必须敢于打破陈规，精简流程。"
 FRA_EU_the_Final_Goalpost: "最后的门柱"
 FRA_EU_Addressing_Our_Failures: "处理失败"
 FRA_EU_Picking_ourselves_up: "振作起来"
 FRA_EU_Europeanize_Paris_desc: "巴黎，这座法国乃至欧洲最璀璨的城市，历经沧桑，依旧挺立。从蜿蜒的小巷到幽深的墓穴，每一块砖石都镌刻着历史的印记。这里是文化交汇的熔炉，孕育思想，交融文明。然而，如今的巴黎已不复昔日荣光。第五共和国的长期忽视，使得部分城区日渐衰败。作为我们与欧盟合作的一部分，我们将发起一场宏伟的复兴计划，对巴黎进行现代化改造，使其重新焕发光彩，达到柏林、伦敦等欧洲首都的现代标准。"
 FRA_EU_The_European_Dream_Marches_on_desc: "自1993年欧盟诞生以来，这个联盟已从最初的区域性组织发展为横跨大陆的多国共同体。三十年间，怀抱共同理想的有识之士始终致力于将泛欧洲主义愿景付诸实践。当俄罗斯在东欧高歌猛进时，世人皆谓欧洲统一理想即将幻灭，但这恰恰铸就了我们的觉醒——它昭示着：今日若不能勠力同心，明日就将在未竟的统一大业中玉石俱焚。此刻的黎明不仅将见证法兰西的历史转折，更将开启整个欧洲大陆的新纪元。正凤凰一般，我们将在战火余烬中涅槃重生。当欧洲之敌来犯时，我们必将正面回击。因为团结铸就的力量，注定无坚不摧。"
 FRA_EU_Addressing_Our_Failures_desc: "环顾四周，我们的城市满目疮痍，人民饥肠辘辘，军队支离破碎。无论我们如何否认，我们确实失败了。我们未能保护东欧盟友免受俄罗斯铁蹄的蹂躏，如今我们已自食其果。然而，我们不能永远沉溺于失败的阴影中。我们必须重整旗鼓，吸取教训，以更强大的姿态归来。第一次欧陆战争的失败给了我们诸多教训，也揭示了许多必须改变的地方。无论采取何种方式，变革势在必行。如果我们拒绝改变，必会重蹈覆辙。"
 FREU_unity_in_decision: "统一决策"
 FRA_EU_Seeking_Discourse: "寻求话语权"
 FRA_EU_Mankind_Redefined: "优化人类"
 FRA_EU_Sister_Republic: "姊妹共和国"
 FRA_EU_Moratorium_of_Political_Debate_desc: "尽管我们竭尽全力推动变革，但仍有诸多不稳定因素困扰着我们的政权。无论左翼抑或右翼，都有人固守旧秩序，拒不合作，甚至不惜诉诸破坏手段，妄图阻碍我们的前行。若任由这些激进分子横行，我们的事业将寸步难行。因此，在柏林的正式授权下，我们将暂时搁置一切政治辩论。或许，这一决策会被指责为独裁，甚至引发轩然大波，但它仅是过渡时期的必要之举。一旦共和国顺利完成向委员会制的转型，我们将恢复政治讨论的自由。然而在此之前，我们必须采取果断措施，确保政权的稳固，确保变革无可撼动。"
 FRA_EU_Diversify_the_French_Citizen: "多样化法国公民"
 FRA_EU_Picking_ourselves_up_desc: "随着尘埃落定、混乱平息，我们的统治正逐步稳固。然而，前路依然漫长：城市已化为废墟，人民正排队领取救济。但幸运的是，我们并非孤军奋战。整个欧洲，我们的盟友同样饱受煎熬，甚至更为惨烈。波兰四分五裂，西班牙内战不休，曾经引以为傲的欧元如今一文不值。不过，希望并未破灭；许多人认为欧洲统一的梦想已然破灭，但我们深知，只有历经磨难才能浴火重生，乃至比以往更加强大。欧罗巴之梦终将实现，即使要流血牺牲也在所不惜。"
 FRA_EU_Walking_a_Green_Path_desc: "法兰西始终立于全球气候治理的前沿阵地。自《巴黎协定》签署以来，我们倾尽全力削减碳足迹——从可再生能源投资到本土电动汽车产业扶持，无不彰显决心。然则第五共和国当局对化石能源巨头的生态破坏行径长期消极应对。若欲铸就历史性功绩，我们必须以雷霆之势推进绿色革命。依托布鲁塞尔与柏林的双重支持，法兰西将实现能源结构全面转型，纵使传统能源集团百般阻挠，清洁能源替代进程势在必行。"
 FRA_EU_Dissolve_Executive_Authority_desc: "尽管我们已成功融入欧盟，但仍有许多制度亟待调整。第五共和国时期，总统制曾是必要的权力架构，而今，它的历史使命已然终结。自今日起，法国将不再由总统或总理统治，而是由一支汇聚专家与欧盟官员的委员会掌管国政，确保国家平稳迈向委员会治理体系。或许有人会对此提出异议，然而，从国家与欧洲的未来来看，这无疑是最优之解。"
 FRA_EU_Creative_Revolution_desc: "法兰西自古以来便是一片孕育创意的沃土。从建筑到电影，从艺术到文学，法国始终是无数创意革命的摇篮。然而，欧陆战争的动荡与国内的内战曾令这一切暂时停滞。如今，随着重建的步伐，我们终于可以复兴这些辉煌的传统。作为复兴运动的一部分，我们将播下新一轮艺术革新的种子——修复博物馆，重振艺术行会，扶持年轻法国艺术家的创新之作。艺术或许并非法国经济的支柱，但它往往是一个国家繁荣的象征。而若我们希望重拾辉煌，支持艺术，便是不可或缺的一步。"
 FRA_EU_An_International_Reconstruction_Effort_desc: "历史长河奔涌向前，亘古不变的真理昭然若揭：最伟大的国家无不拥有强大的工业基础。像中国和美国这样的伟大国家，如果当初没有投资于重工业，就不会有今天的地位。如果我们希望法国重新在全球大国中占据一席之地，就必须重振工业这颗跳动的心脏。工厂将被重建，钢厂将重新投产，我们将采取一切手段重振工业。再加上盟友的协助，法国必将再次成为足以与中国等国并驾齐驱的工业强国。"
 FRA_EU_Creative_Revolution: "创造性革命"
 FRA_EU_The_Global_Project_desc: "法国，若脱离了世界，又何以自存？许多人或许会否认这一点，但我们深知，我们的使命远不止于国家的延续。全球社会如同一张庞大的网络，交织着贸易协定、联盟与合作。若我们希望在国民间培养真正的全球认同，就必须将自己紧密地融入这张网络之中。如此不仅能够促进人民的团结，更能吸引外国劳动力与专业人才，为国家的重建提供不可或缺的助力。"
 FRA_EU_Democracy_Manifest: "民主的明示"
 FRA_EU_An_Invisible_Footprint: "看不见的足迹"
 FRA_EU_United_By_Science_and_Reason_desc: "历史上最伟大、最持久的国家，都是那些在科学上投入巨大的国家。工业创新将俄罗斯和美国推上了世界舞台，而技术上的创新则帮助改善了全球人民的生活质量。在我们重建这个破碎国家的同时，我们展望一个以科学与理性为定义的未来。在这个未来中，迷信和对未知的恐惧已被对未来的希望所取代。在这个未来中，欧洲将永远屹立不倒、团结统一、自由不灭。"
 FRA_EU_Our_Offer_to_Brussels: "我们对布鲁塞尔的开价"

