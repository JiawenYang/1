 FPR_brick_by_brick4_idea: "新法国"
 FPR_brick_by_brick4_idea_desc: "法兰西历经一砖一瓦的精心构筑，终成我们夙愿多年的理想国度。如今的法兰西傲然屹立，成为浴火重生的新国度。这座历经淬炼的国度，必将以磐石之姿直面未来风雨。"
