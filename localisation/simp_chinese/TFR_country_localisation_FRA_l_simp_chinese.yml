 Capital_of_the_EU: "欧洲首府"
 Capital_of_the_EU_desc: "布鲁塞尔不仅是一座城市，更是欧洲一体化进程的行政中枢。在它的办公室、会议厅和无数玻璃幕墙建筑中，法规草案被拟定，政治妥协被塑造，危机在日常运作中被悄然化解。数以万计的公务员、外交官、游说者与顾问穿梭于其街道，将地方治理升格为大陆级议题。从这里做出的决策，早在公众察觉之前，便已如涟漪般扩散至市场、边境与各类机构。这种政治重心的聚集带来了影响力与资源，同时也伴随着审视的目光、体制的惯性以及巨大的压力。布鲁塞尔必须平衡其作为主办城市的角色与欧洲神经中枢的职能——在这里，稳定、协调与延续性远比速度或表象更为重要。"
