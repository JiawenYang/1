 trait_FRA_Happy_with_Regime_desc: "这位军官对当前政权十分认同，将为法国服役视为一种荣耀。\n\n倘若发生任何破坏法兰西共和国稳定的事情，这位军官无疑会站在现任政权的一边。"
 trait_FRA_Political_Retirement: "政治退休"
