 FRA_France_on_the_World_Stage: "世界舞台上的法国"
 FRA_France_on_the_World_Stage_desc: "\n\n\n\n\n£GFX_FRA_France_World_Stage_category\n\n\n\n\n\n\n\n纵观历史长河，法国在全球舞台上地位举足轻重，依此确立了自身大国地位，影响了人类文明各个领域地进步。从中世纪到文艺复兴时期，法国逐步成为一座人文智库，促进了艺术、文学与哲学进步。再放眼大航海时代，法国探险家和贸易商披荆斩棘横跨全球，筑就了广袤的殖民地贸易网络。十八世纪，法国经历了一场对全欧洲政治社会格局具有深远影响的革命，倡导了自由、平等与博爱的理念。而随后拿破仑·波拿巴又以征服重塑欧洲边界，向世界展示了法国的军事能力。乃至十九与二十世纪，法国仍作为全球政治重要的参与者，影响了殖民主义、两次世界大战和欧盟的形成。"
 FRA_Recognize_Constitutionalists_decision: "[USC.GetFlag]§C美利坚宪政政府§!：承认§C美利坚宪政政府§!"
 FRA_Recognize_Constitutionalists_decision_desc: "在美国内战的硝烟中，我们迄今为止一直采取中立的立场，因在欧洲内部，我们面临着更为紧迫的挑战。如今，随着我们重新将目光投向国际舞台，承认特朗普的“宪政派”为美国的合法政府，无疑是巩固我们长久盟友关系的最佳途径。这一选择，将确保跨大西洋合作的延续与稳定。"
 FRA_Recognize_Biden_decision: "[USB.GetFlag]§C美利坚联邦§!：承认§C美利坚联邦§!"
 FRA_Recognize_Biden_decision_desc: "美国的内战依然烽火连天，而我们面临的抉择是：究竟该承认哪一方为这片战火焦土上的合法政府。鉴于我们渴望恢复由美国作为北约成员国所带来的安全与稳定，承认联邦政府并支持其恢复国家正常运转的努力，无疑是符合我们长远利益的最佳选择。"
 FRA_Recognize_Patriot_Front_decision: "[PTF.GetFlag]§2爱国者阵线§!：承认§2爱国者阵线§!"
 FRA_Recognize_Patriot_Front_decision_desc: "美国内战为其政治版图带来了翻天覆地的变化，极右翼“爱国者阵线”的崛起尤为引人注目。尽管我们在原则上难以认同他们的许多政策，但为了挽回与这位昔日盟友的联系，在局势尚未完全失控之前，我们不得不选择承认并支持他们的政府，以期为未来的合作留存一线希望。"
 FRA_Recognize_Association_of_the_Freed_decision: "[GMA.GetFlag]§G解放者协会§!：承认§G解放者协会§!合法性"
 FRA_Recognize_Association_of_the_Freed_decision_desc: "美国的旧秩序不可避免地被二次内战打了个粉碎，但在战火淬炼中，一些小众派系业已崭露头角。其中一个名为“解放者协会”的组织震撼了外国观察者，他们也在寻求更多的国际支持。因此，当下符合我们最大利益的举动莫过于承认解放者协会为美国合法政府，助力其进行第二次美国革命！"
 FRA_Recognize_SoL_decision: "[FAA.GetFlag]§G自由美利坚共和邦联§!：承认§Y自由美利坚共和邦联§!合法性"
 FRA_Recognize_SoL_decision_desc: "我们虽碍于国内局势无力干预第二次美国内战，但仍有借机扩大影响力的余力，我们也应当择一派系承认其为美国的合法政府。自由美利坚共和邦联在新英格兰地区的迅猛崛起让我们有了一个可供支持的明确选项。正如我们在1776年所做的一般，我们应当宣布自由美利坚共和邦联及其发起的第二次美国革命！"
 FRA_Recognize_GMAC_decision: "[GMA.GetFlag]§G绿山无政府主义集体§!：承认§G绿山无政府主义集体§!合法性"
 FRA_Recognize_GMAC_decision_desc: "美国局势每况日下，二次内战席卷全国，我们却仍未寻得一个可供认可支持的派别。绿山无政府主义集体的所谓“政府”的确称得上另类，但它已经证明了，哪怕是在无政府主义的无国家状态下，它也愿意建设一个更好的美国。倘若我们支持他们统一美国，我们兴许能在将至的地缘政治风暴中赢得一位独一无二的盟友。"
 FRA_Recognize_APLA_decision: "[APA.GetFlag]§R美国人民解放军§!：承认§R美国人民解放军§!"
 FRA_Recognize_APLA_decision_desc: ""
 FRA_Align_Madagascar_decision: "[MAD.GetFlag]支持马达加斯加"
 FRA_Align_Madagascar_decision_desc: "自1960年马达加斯加成功争取独立以来，我们在印度洋的影响力便因失去这座岛屿而受到限制。如今，重新殖民化已是痴人说梦，因此我们的目标应当转向通过扩大软实力来弥补我国殖民史中的错误，使这片曾与我们息息相关的岛屿再次融入我们的势力范围。只有这样，我们才能确保我们的海军实力重返大国之巅，在印度洋上再次彰显昔日的荣耀与威严。"
 FRA_French_Arms_in_Indian_Hands_decision: "[RAJ.GetFlag]给予印度人武器"
 FRA_French_Arms_in_Indian_Hands_decision_desc: "面对巴基斯坦伊斯兰共和国与中华人民共和国日益显现的侵略性，显而易见，我们需要抓住时机，在力所能及之际，为印度共和国提供所需的支持，确保其具备应对未来挑战的能力。"
