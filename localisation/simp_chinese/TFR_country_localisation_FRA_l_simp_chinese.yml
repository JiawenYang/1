 FRA_Military_Demands_category_desc: "\n\n\n\n\n£GFX_FRA_path_of_conquest_cat\n\n\n\n\n\n\n\n马克龙的政府开始出现裂隙之时，许多他在军方中的盟友正准备在他们的仕途报废之前改弦更张。一些军官亲自联系了泽穆尔，希望他挽救法国于自由派蛀虫的水火中。\n\n法国过于独立、不稳定，无法屈从于军事统治之下，但我们不能希冀法国自救，因而，我们需要§C骑士行动§!。\n\n§C骑士行动§!是一个利用法国漏洞百出的选举系统来有效操控2022选举，以使得埃里克·泽穆尔和他的再夺取党，然后动用法国军事力量确保选举结果落实到各州的计划。在此初步计划施行之后，泽穆尔将精简民政以便军方施行战时经济政策、应对东方的致命威胁。\n\n§C骑士行动§!进程：[?chevalier_progress]/6"
