 FRA_negotiations_fail_idea: "谈判桌上的失败"
 FRA_negotiations_fail_idea_desc: "与“黄背心”运动中的激进分子合作解决其持续抗议与骚乱的可能性显然已不复存在。他们无休止的暴乱和对法国各地的破坏持续太久，我国政府正在起草新的解决方案以期迅速镇压这些激进分子。但在此之前，法国只能眼睁睁看着首都巴黎被撕裂并付之一炬。"
 FRA_faith_in_the_goverment: "政府公信力"
 FRA_faith_in_the_goverment_desc: "在一次出人意料的转折中，法国政府决定将其人民的利益置于首位。与“黄背心”运动的谈判已圆满结束，政府同意了该运动提出的所有条件。尽管在政府内部的保守派中引发了争议，但鉴于法国当前的紧急局势，该决议最终仍以多数表决通过。此项激进决策的效果立竿见影，持续数月的街头抗议迅速平息，取而代之的是席卷法国各地庆祝新改革的狂欢。"
