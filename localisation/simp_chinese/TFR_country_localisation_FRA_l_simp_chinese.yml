 Fra_armed_forces_category_desc: "法国军队是大西洋东岸最精良、最举足轻重的军事力量。从查理曼和拿破仑的征服到戴高乐和勒克莱尔的解放，我军历史长久而光荣。近日，我们已然证明我军可以脱离北约傲然挺立，但我们不应过分急于将我们的盟友扔到一边，尤其是在战争即将爆发的前提下。"
 FRA_west_africa_intervention_desc: "西非许久以来就是法国及其外交政策的重要部分。\n年复一年，这些国家不断试图远离他们的法国主人。但是自由，对于他们来说，将§R永远遥不可及§!。"
 FRA_yellow_vest_protests: "黄背心抗议"
 FRA_yellow_vest_protests_desc: "随着“激进”运动，即媒体所称的“黄背心”抗议活动愈演愈烈，形势已愈加清晰：若无法迅速达成解决方案，给予示威者最少的实质性让步，法国将陷入比新冠疫情所带来的危机更为深重的动荡之中。在协商解决或找到替代方案之前，这个国家的内政稳定和政治完整性正摇摇欲坠。"
