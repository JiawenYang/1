 Brazil.2.t: "巴西占领圭亚那"
 Brazil.2.d: "战败的伤痛未消，我们又遭新的不公。怯懦的巴西政府趁虚而入，夺取了法属圭亚那——我们帝国时代最后的海外领地之一。面对巴西的入侵，当地几乎没有抵抗。留守的少量部队早已被抽调到东方战场，既无时间、人手，也无意志反抗。唯一值得庆幸的是，所有装备库存早已被转移，这次占领并未实质增强巴西军力。\n\n尽管总参谋部一些激进成员主张立即反击，但我们甚至无力干预南方邻国内战，更遑论万里之外的地区。失去该地导致的紧迫问题是切断了当地的黄金、石油和铝土矿产出，这将对未来艰难时期造成影响。我们仍会制定计划，或许在形势好转时采取行动，但在欧洲局势稳定、俄罗斯被压制之前，这些都只是空想。"
 Brazil.2.a: "我们会回来的"
