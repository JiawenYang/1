 FAF_napoleonic_sympathies_dynamic_desc: "法兰西是一个承载着无上荣光的国度。我们的国家建立在拿破仑·波拿巴的辉煌成就之上——这位战神曾率领波拿巴王朝数次仅凭一己之力横扫欧陆，直至最终因国力透支而功败垂成。世间再无任何光辉能与法兰西、与法兰西帝国比肩。这是全欧洲最伟大的国度，此后万年亦如此。"
