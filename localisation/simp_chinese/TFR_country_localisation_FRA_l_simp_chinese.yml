l_simp_chinese:
 FRA_the_french_armed_forces: "武装力量现状"
 FRA_the_french_armed_forces_desc: "在对法国军队进行为期十年的全面评估后，其报告结果令人担忧。我军长期资金不足，在战力与装备现代化方面落后于欧洲盟国。随着这一现实被揭露，我军高级将领纷纷向政府施压，要求立即采取行动。幸运的是，政府已经正式批准对法国军队增拨超过1400万欧元的预算，这将大幅推动我军在新时代的现代化进程。\n\n在当前形势下，法国的军队绝不能落后。为了国家的安全与荣光，我们必须比以往任何时候都更加果断行动！法国必将重拾其作为欧洲军事强国的荣誉与威望！"
 FRA_unify_the_DSGE_DSGI: "合并对内对外安全总局"
 FRA_unify_the_DSGE_DSGI_desc: "我们的国家正在迈入一个新的时代，一个需要我们内外情报机构更加紧密相连的时代。因此，国家安全总局将承担起保护我们内部与外部安全的责任。"
 FRA_dsgn_creation_tt: "完成后，我们会创建§C国家安全总局§!"
 FRA_the_french_airforce: "空军新型设计"
 FRA_the_french_airforce_desc: "法国空军一直是法国军队中最薄弱的分支之一，在现代化进程方面进展缓慢，远远落后于时代需求。为了改变这一现状，我们已与多家航空巨头展开合作，其中包括达索航空，致力于开发最优解决方案，推动法国空军迈向前所未有的空中优势与卓越战力。随着这些努力逐步落实，法国主宰蓝天的时代即将到来。"
 FRA_the_race_for_the_fifth_generation_fighter: "法国五代机计划"
 FRA_the_race_for_the_fifth_generation_fighter_desc: "随着航空研发领域的重大突破，我们终于迎来了推进空军迈向下一代的契机。法国第五代战斗机，作为最先进的航空概念之一，已初见雏形，我们必须充分利用这一优势，抢占未来空战的制高点。一旦这款尖端战机正式亮相世界，法国将引领空战未来，开创航空战术新时代。"
 FRA_ramp_up_the_production_of_the_Dassalut_Rafale: "量产阵风战斗机"
 FRA_ramp_up_the_production_of_the_Dassalut_Rafale_desc: "“阵风”战斗机一直是法国空军的中流砥柱，如今，只需适当优化与调整，再加上对达索航空大力资助，我们将能在最短时间内启动大规模生产。凭借“阵风”战机卓越的性能与作战能力，若一切顺利，我们有望在本世纪末超越俄罗斯空军的战机生产规模，确保法兰西在未来的天空中占据主导地位。"
 FRA_conduct_major_improvments: "获取航空专业知识"
 FRA_conduct_major_improvments_desc: "法国空军不仅在技术上落后于时代，更严重的是，我军的飞行员与专业人才也在逐渐丧失昔日那种令敌人胆寒的作战锋芒。为了解决这一问题，法国空军已启动全面的改革计划，对现行的航空训练体系进行彻底优化，以消除长期积累的弊端与衰退，并推动空军迈向持续进步的道路。这不仅是一次调整，而是一次真正意义上的复兴——法兰西的战鹰将重塑辉煌，超越竞争对手，再次主宰天空。"
 FRA_deveop_domestic_drones: "发展本国军力"
 FRA_deveop_domestic_drones_desc: "为实现国防自主并降低对外依赖，法国将把国防工业内部能力建设置于首位，积极促进创新与合作，从而构筑起支撑尖端军事力量的基石。"
 FRA_expand_our_airfields: "扩建东方军用机场"
 FRA_expand_our_airfields_desc: "鉴于东线战场关键的地缘政治地位，法国将于此增派资源、建造前沿作战基地，并携手盟国进行联合军演，最终增强在该区域的空中作战能力。"
 FRA_aerial_defense: "改进SAMP-T导弹系统"
 FRA_aerial_defense_desc: "中程地对空/地面导弹系统自上世纪问世以来，一直是法国的核心防空屏障，为国家领空提供了至关重要的防御力量。为了确保防空系统的最高效能，并赋予法兰西所应享有的坚不可摧的空防能力，我们已正式委托SAMP/T原始设计团队，对该导弹防御系统进行全方位升级与优化。随着空战形态的不断演变，法国的防空能力也将随之提升，以确保我们始终立于防御科技的最前沿，让法国的天空坚不可摧，固若金汤。"
 FRA_aerial_offense: "向着新边疆"
 FRA_aerial_offense_desc: "太空，自古以来便是伟大国度最终极的征途，是超越人类极限的真正疆域。如今，法国将向世界宣告，我们的雄心远远超越外界对我们的预期。法国航天计划即将正式启动，在不久的将来，我们的国旗将与世界强国，如美国，共同飘扬在月球之上。世界终将见证——法国注定将征服群星，统御宇宙。"
 FRA_the_french_navy: "改进海军训练"
 FRA_the_french_navy_desc: "法国海军虽是少数能够经受时间考验的军种之一，但即便如此，它仍迫切需要改革与升级。舰队的骄傲——“戴高乐”号航母，在面对当今美英航母群时，已显露出技术与战力上的不足。若我们不及时迎头赶上，法国海军势必再次落后，这不仅会削弱我军的全球作战能力，更将严重影响法国在国际舞台上的影响力。"
 FRA_upgrade_our_submarine_fleet: "潜艇舰队换代"
 FRA_upgrade_our_submarine_fleet_desc: "鉴于潜艇在现代海战中的核心战略地位，法国计划对潜艇舰队实施全面升级，研发并部署搭载尖端科技的下一代潜艇，以确保其水下作战能力始终处于全球领先地位。"
 FRA_develop_our_home_ports: "扩建现有军港"
 FRA_develop_our_home_ports_desc: "为满足海军舰队不断变化的需求并增强其后勤能力，法国启动了一项战略拓展计划。该计划聚焦于扩大港口容量与优化海军基础设施，从而打造更为高效的舰队调度体系，为持续、高强度的海上行动提供支援。"
 FRA_conduct_neccesary_improvments: "举行环地中海军演"
 FRA_conduct_neccesary_improvments_desc: "在地中海战略全面推进之际，正是我们强化舰队的最佳时机。随着法国不断加深与地中海盟友的合作，我们必须更加积极主动，促进团结，并巩固与地区伙伴的紧密联系。近期，我们已正式邀请意大利、西班牙和希腊海军，共同举行联合海军演习，以锤炼舰队战斗力，并演练各种可能出现的作战场景。要想在海上取得优势，我们必须与地中海的强大舰队携手并进。"
 FRA_smaller_boat_stuff: "向前稳稳航行"
 FRA_smaller_boat_stuff_desc: "确保国防能力的稳定与连贯至关重要。法国将致力于在武装力量的每个分支中，都实施高标准的训练、细致的装备维护和充分的作战准备，从而塑造出既值得信赖又实力雄厚的国防态势。"
 FRA_begin_the_project_for_the_new_carrier_flagship: "取代戴高乐号航母"
 FRA_begin_the_project_for_the_new_carrier_flagship_desc: "海军航空领域发展日新月异，对此法国已正式启动戴高乐号航空母舰的换代计划，这是一项雄心勃勃的战略举措。新航母将集现代化与多功能性于一身，搭载最前沿技术，具备强大的跨海作战与力量投射能力，将在保障法国海洋利益和全球战略影响力方面发挥核心作用。"
 FRA_A_Strong_France_is_a_Strong_Europe: "独立军事力量"
 FRA_A_Strong_France_is_a_Strong_Europe_desc: "长久以来，北约的繁琐官僚体系与政治化内耗不断消耗着法国宝贵的时间与军队的作战效率。如今，法国必须走上属于自己的道路，不再让我们的资源与预算被无谓地消耗。法国将向欧洲乃至全球证明，我们不仅能够独立自主，更将以无可争议的军事实力，重塑世界强权格局。我们将向欧洲乃至全世界证明，法兰西不仅能够自立，更将以伟岸的军事实力，屹立于世界强权之巅。"
 FRA_Through_Europe_we_are_Strong: "因欧洲而强大"
 FRA_Through_Europe_we_are_Strong_desc: "历史的长河已无数次印证：当欧洲团结一心，我们便所向披靡；当欧洲四分五裂，灾难便随之降临。二战的硝烟曾让我们的家园支离破碎，全球反恐战争则提醒我们，分裂与内耗只会让外敌趁虚而入。如今，俄罗斯正变得愈发动荡与不可预测，而我们却仍在犹豫不决。越是迟疑，欧洲就越是削弱自己的力量。因此，我们必须向整个欧洲，乃至全世界传递一个坚定的信息——在这个充满全球动荡与极端主义的时代，欧洲的团结永远不会动摇。"
 FRA_Support_a_Pan_European_Military: "支持地中海主义"
 FRA_Support_a_Pan_European_Military_desc: "地中海自古以来便是兵家必争之地，不仅对法国至关重要，更是整个欧洲战略版图的核心。从古罗马到马其顿，从迦太基到近代列强，诸多伟大的帝国与国家都曾在地中海之滨崛起，并以此为中心统御已知世界。今日的欧洲，同样不能忽视这片海域的战略价值。为了欧洲的稳定与繁荣，我们必须重视地中海的地缘要义，与西班牙、意大利、希腊等盟国携手合作，在政治与经济领域尽最大努力支持他们，确保欧洲的南翼坚不可摧。"
 FRA_Support_Western_Mediterrenian_Militaries: "拨款联合军事预算"
 FRA_Support_Western_Mediterrenian_Militaries_desc: "为进一步加强与欧洲盟友的合作，我们已与英国、德国和意大利共同组建预算委员会，旨在制定高效且精准的财政规划，以最大化提升各国的军事与经济效能。通过与欧洲盟友的深入协作，我们愈发清晰地认识到，我们拥有共同的目标与愿景。在这充满变数的新纪元，唯有欧洲团结一致，方能在动荡中保持稳定，在挑战中迎来胜利。"
 FRA_Further_Eurail_Integration: "进一步整合欧铁"
 FRA_Further_Eurail_Integration_desc: "为加强欧洲的机动性与军事效率，法国将推动欧洲铁路网的进一步整合。通过聚焦于提升互操作性、优化物流效率，并强化部队的迅速部署能力，将得以构建出一个既灵活又高效的欧洲防御体系。"
 FRA_Heart_of_the_European_Navy: "地中海统一海军条约"
 FRA_Heart_of_the_European_Navy_desc: "为强化地中海地区海上安全，法国将与地中海国家签署统一海军条约。此条约旨在协调海军行动、深化情报共享机制，并定期组织联合军事演习，以构建坚实的统一防线。"
 FRA_Revive_Latin_Bloc_Militarism: "地中海联合指挥条约"
 FRA_Revive_Latin_Bloc_Militarism_desc: "为稳固地中海地区安全格局，法国将与地中海国家达成联合指挥条约。此条约旨在统一军事指挥架构，促进跨国联合规划与协作，确保面对地中海地区的潜在威胁时，能够迅速且高效地作出应对。"
 FRA_Western_Mediterrenian_Mechanization: "发展机械化技术"
 FRA_Western_Mediterrenian_Mechanization_desc: "法国步兵的机械化进程，无疑是我军现代化发展最具变革性的举措之一。为了确保步兵作战的卓越优势，我们将继续优先推进装甲运输车和步兵战车的技术革新，不断优化其防护能力、机动性及作战效能。现代战争的格局，终将被法兰西的创新精神与尖端科技所主宰。"
 FRA_Strengthen_the_SNCF: "投资法国国铁"
 FRA_Strengthen_the_SNCF_desc: "鉴于交通对军事后勤的重要性，法国将加速扩展法国国家铁路公司铁路网，加大铁路基础设施建设力度，优化交通连接，以确保全国范围内军队与战略资源的快速、高效调动。"
 FRA_Privatize_the_SNCF: "私有化法国国铁"
 FRA_Privatize_the_SNCF_desc: "为提升铁路运输效率与创新能力，法国将积极推进法国国家铁路公司的私有化改革，通过引入市场竞争机制，激发行业活力，提升整体运营效率，以构建一个更加灵活多变、适应性强的铁路运输网。"
 FRA_Industrialize_the_countryside: "乡村军事化"
 FRA_Industrialize_the_countryside_desc: "为强化国防实力与韧性，法国将启动乡村军事化战略，把军事资源与基础设施深度融入农村地区，构建起一张遍布全国、既分散又坚实的防御网络，以高效应对各类潜在威胁。"
 FRA_Create_Independent_Military_Strategies: "独立军事战略"
 FRA_Create_Independent_Military_Strategies_desc: "随着法国逐步脱离北约一体化指挥体系，我们必须加快军事战略的自主创新，确保法军能够独立自主地运作，无需依赖欧洲盟友的支援。法国军队将重新掌握自己的命运，并向整个欧洲证明——摆脱低效且混乱的北约指挥体系后，我们不仅更加强大，更能高效应对任何挑战。"
 FRA_A_New_Age_of_Heavy_Tanks: "现代化主战坦克"
 FRA_A_New_Age_of_Heavy_Tanks_desc: "为巩固其装甲领域的领先地位，法国将启动重型坦克现代化计划。该项目旨在利用前沿科技对现役坦克部队进行改造与强化，确保其在坦克战中始终保持尖端战力。"
 FRA_Deploy_Moving_Castles: "“移动堡垒”的诞生"
 FRA_Deploy_Moving_Castles_desc: "法国将在移动防御领域引领一场革命性变革，见证一支集高度机动性与强大装甲防护力于一身的新型部队崛起。这支部队能以其卓越的快速部署能力，有效应对瞬息万变的战场环境。"
 FRA_Independence_from_the_Eurail: "从欧铁系统独立"
 FRA_Independence_from_the_Eurail_desc: "为追求行动自由与后勤自主，法国将减少对欧洲铁路网军事运输的依赖，开发多样化的替代运输方案，增强战略机动性和灵活性，并加强独立军事行动的能力建设。"
 FRA_Expand_Domestic_Capabilities: "鼓励国内军工产业"
 FRA_Expand_Domestic_Capabilities_desc: "泰雷兹集团、精确制导弹药集团、欧洲导弹集团以及雷诺——这些长期以来支撑法国军工体系的企业，自战后便一直为法军提供关键装备。如今，政府必须履行自身责任，推动军队优先采购本土武器装备，减少对国际军工产品的依赖，确保法国的国防工业体系更加独立自主。"
 FRA_Rejuvinate_Recruitment_Centers: "恢复征兵中心"
 FRA_Rejuvinate_Recruitment_Centers_desc: "为打造一支技术精湛、士气饱满的武装部队，法国将恢复征兵中心，通过采用现代化征兵手段、拓宽招募渠道及实施激励政策，吸引最优秀的人才投身于军队。"
 FRA_Research_and_Development: "军事研发投资"
 FRA_Research_and_Development_desc: "鉴于技术领先对于国防安全的重要性，法国将大幅度提升对军事科研领域的投资力度，积极推动创新，加速尖端防御技术的研发进程，确保我均始终屹立于全球军事能力之巅。"
 FRA_Second_times_a_Charm: "代表人民"
 FRA_Second_times_a_Charm_desc: "我们已成功赢得总统大选——玛丽娜·勒庞执掌法兰西最高权柄，此举向复兴党及欧盟发出强烈信号：我们代表人民行使使命，一项至关重要的使命，即为人民缔造秩序井然、势力雄厚且发展均衡的新法国，遏制马克龙及其盟友推行的门户开放政策。为践行这项法兰西使命，我们将调和激进主张，让法国重归安全、强大且自豪的国度。"
 FRA_Fight_Party_Radicals: "纠正党内激进主义"
 FRA_Fight_Party_Radicals_desc: "国民联盟内部某些势力仍属老勒庞派系残余。自玛丽娜时代开启以来，该党已与让·马里（玛丽娜·勒庞之父）时期划清界限。当今批评者所诟病的国民联盟特质，实为该党上世纪八十年代的真实写照。然而，党内部分成员仍不自知其为应被遗忘的历史遗老。玛丽娜·勒庞已拓展政党视野，引领其迈向崭新未来，那些更趋近八十年代旧国民联盟路线的成员必须被边缘化并退场。我们永不就过往致歉，但必须瞩目未来。"
 FRA_Protect_French_Interests: "美式现实政治"
 FRA_Protect_French_Interests_desc: "美国在其鼎盛时期始终奉行铁血信条：手持巨棒，声若洪钟。而法国所处的欧洲大陆充斥着意识形态对手——这些国家正系统性摧毁自身民族尊严，更妄图将同样的精神阉割强加于我国。作为欧盟成员国中的关键力量，我们若要在国际舞台彰显存在，就必须以雷霆之声彰显意志，执万钧之力震慑四方。从非洲大陆到欧洲腹地，直至更广阔的战略疆域，我们必须确立不容置疑的战略存在，向世界清晰宣示：未来的法兰西注定重焕昔日荣光，必将重塑全球格局中的强国地位。我们拒绝在欧洲联邦中沦为德国的附庸，法兰西誓将永葆主权完整与国家强权！"
 FRA_National_Unity_Government: "宣布成立民族团结政府"
 FRA_National_Unity_Government_desc: "政见分歧不应阻碍我们共同追求法兰西的繁荣伟业——自由派可发挥其商业网络优势；社会党人至少在口头上心系民众。我们完全有理由邀请反对派系携手共进！团结的法国远比分裂的法国更具力量，这个真理放诸国家发展，乃至万事万物皆准。当此疫情肆虐、石油危机、美国霸权衰落三重变局之际，组建全国团结政府恰逢其时。此刻凝聚政治共识，将国家发展置于党派利益之上，试问谁人胆敢反对？唯有那些将党派私利凌驾于国家大义之上的意识形态叛徒。"
 FRA_Law_and_Order: "“法律与秩序”方针"
 FRA_Law_and_Order_desc: "一份档案袋中滑出的照片落在勒庞案头。画面中凯旋门前沿燃起熊熊烈焰，一辆辆汽车翻倒路边，黄背心抗议者却振臂欢呼。若细细观察，可见一枚燃烧瓶正划出抛物线，直扑防暴警察阵列。勒庞向来深恶痛绝这种暴徒行径：他们口口声声代表劳工阶层，却焚烧工薪族的汽车、捣毁劳动者的工作场所，形同野兽。必须终结这场闹剧。早在暴徒开始活烧警员之前，政府就已倾听民意。我们将于近日提交被某些人斥为“严苛”的立法草案——但在我们眼中？在勒庞看来？对那位痛失爱车的倒霉车主而言？这是遏制暴徒每年造成数千万欧元公私财产损失的合理举措，早该管管了。"
 FRA_Set_Immigration_Limit: "法兰西优先"
 FRA_Set_Immigration_Limit_desc: "北约与欧盟固然是重要机制，但世间没有任何事物应当，也永远不会凌驾于祖国利益之上。法兰西绝不能屈从于国际资本秩序，法国企业在本土竞争中绝不容许败给外资。我军已是欧洲最强大的武装力量，但这远远不够，我们必将实现战略扩张。法兰西的钢铁洪流与经济命脉将同步壮大。欧洲不应再指望法国的财政纾困或军事装备输出，就让德国去外国兜售坦克吧，我们会保留并翻倍生产勒克莱尔主战坦克。法兰西必须在经济、军事与国民意志三大维度完成战略优先部署。若我们未做好万全准备，整个欧洲必陷危局。当此狂野美洲秩序崩塌之际，我们当仁不让，要肩负起文明牧羊人的历史使命。"
 FRA_France_First: "法兰西优先"
 FRA_France_First_desc: "北约与欧盟固然是重要机制，但世间没有任何事物应当，也永远不会凌驾于祖国利益之上。法兰西绝不能屈从于国际资本秩序，法国企业在本土竞争中绝不容许败给外资。我军已是欧洲最强大的武装力量，但这远远不够，我们必将实现战略扩张。法兰西的钢铁洪流与经济命脉将同步壮大。欧洲不应再指望法国的财政纾困或军事装备输出，就让德国去外国兜售坦克吧，我们会保留并翻倍生产勒克莱尔主战坦克。法兰西必须在经济、军事与国民意志三大维度完成战略优先部署。若我们未做好万全准备，整个欧洲必陷危局。当此狂野美洲秩序崩塌之际，我们当仁不让，要肩负起文明牧羊人的历史使命。"
 FRA_The_Peoples_Victory: "人民之胜"
 FRA_The_Peoples_Victory_desc: "出乎所有人的意料，甚至震惊了整个法国政坛，新人民阵线在2022年法国大选中夺得胜利。一系列变故将我们推向舞台中央，而最终，我们成功站上了历史的分水岭。然而，这并非凯旋的终点，而仅仅是风暴的开端。军方的敌视、政坛的掣肘，乃至整个旧势力的反扑，使[FRA.GetLeader]注定步步维艰。"
 FRA_Demand_Military_Loyalty: "处置军队"
 FRA_Demand_Military_Loyalty_desc: "尽管军方在名义上与法国政府无关，但他们在共和国的政治运作中握有强大的影响力。不仅如此，即便我们通过民主选举合法胜出，他们仍视我们为威胁，竭力对抗我们的新政，而这一切只为维护其在法兰西共和国的寡头垄断。这股势力绝不能任其放肆，我们必须迅速果断地加以应对！"
 FRA_Unite_the_Left: "团结阵线"
 FRA_Unite_the_Left_desc: "理论上的团结，并不意味着现实中的稳固。新人民阵线不过是一个宽泛的左翼联盟，其内部派系林立，仅在最基本的原则上勉强维系共识。即便[FRA.GetLeader]成功当选总统，新人民阵线仍然是一个松散且脆弱的联盟。若我们想真正推动左翼前进，新人民阵线不能只是一个为了选举胜利的政治工具，它必须成为真正意义上的政党联盟。"
 FRA_Empower_the_Young_Jacobins: "[FRA_Empower_the_Young_Jacobins_loc]"
 FRA_Empower_the_Young_Jacobins_desc: "革命的火焰，怎能只燃烧在法兰西的土地上？既然社会主义已在这里开花结果，那它便不应止步于此！民主革命不应局限于法国，我们将把人民的幸福与繁荣传递至整个欧洲，让社会主义的曙光照耀欧盟各国，无论是在国家层面，还是在欧洲议会之中。这不仅是法国人民的福祉，更是全欧洲共同的未来。我们的道路，必将带来一个更加公正、繁荣、团结的欧洲。"
 FRA_Empower_the_Young_Jacobins_melenchon: "欧洲社会主义崛起"
 FRA_Empower_the_Young_Jacobins_faure: "团结欧洲社会民主主义者"
 FRA_Empower_the_Young_Jacobins_ruffin: "我们的欧洲同志"
 FRA_Referendum_on_a_New_Constitution: "第六共和国全民公决"
 FRA_Referendum_on_a_New_Constitution_desc: "正如马克龙执政时期所展现的，法兰西第五共和国的君主化倾向与权力过度集中，已成为民主原则的巨大倒退，甚至使我们倒退至大革命前的旧时代。然而，正是那场革命，奠定了法国作为民主灯塔的根基，我们绝不能让历史的车轮逆转！因此，第六共和国必须诞生于人民之手，服务于人民，成为真正符合法国人民意愿的国家体制。第六共和国万岁！"
 FRA_Expand_the_Welfare_State: "扩建福利国家"
 FRA_Expand_the_Welfare_State_desc: "尽管我们在社会福利领域已取得重大进展，但这远远不够。国家的存在，是为了服务人民，而不仅仅是向他们提供福利。全民福利体系不应只是法国共和国的可变政策，而应成为共和国的固有基石，成为法兰西不可动摇的承诺。"
 FRA_A_True_Commander_in_Chief: "真正统御三军"
 FRA_A_True_Commander_in_Chief_desc: "皮埃尔·德维利耶，一个真正适合这一角色的指挥官，他在法国武装部队漫长而辉煌的职业生涯因马克龙将他从国防部长职位上解雇而蒙上阴影。但人民未曾遗忘他，军队仍尊崇他，无数将领依旧仰望他的身影，聆听他的指引。自戴高乐之后，法兰西再未迎来如此卓绝的领袖！为总统三呼万岁！"
 FRA_Rehabilitate_Reconquete: "修复与“再征服”的关系"
 FRA_Rehabilitate_Reconquete_desc: "泽穆尔和他的极端保守派，从任何实际意义上来说，都是彻头彻尾的爱国者。一个由第二代阿尔及利亚犹太移民领导的反移民党，他在极右翼运动中的角色总是让对手困惑不已，而他的同胞却以一种奇特的欢迎接纳了他。让-马里·勒庞曾说过，法国人常常咒骂他，但犹太人对他的态度却非常友善。让我们向泽穆尔回报这份恩情吧，国民联盟将张开双臂欢迎他，我们将寻求携手合作，结成联盟，共同对抗那些让法国保持虚弱的势力。"
 FRA_Cement_Military_Control: "巩固军事掌控"
 FRA_Cement_Military_Control_desc: "军方在法国所拥有的重大影响力早已不是秘密。在戴高乐的领导下，军队保持着一种调节力量的角色，类似于土耳其的军队，维护国家中的某些理念，确保国家走上特定道路。在德维利耶的领导下，这一地位将被进一步巩固。\n\n军队作为稳定国内力量的角色，是在战火中赢得的神圣权利，它肩负着重塑共和国的使命，而共和国曾因达拉第及其之前的人民阵线政府的软弱而陷入危机。正是戴高乐挺身而出，解放了法兰西，支撑起抵抗运动，而当时的文官政府却远走他乡，流亡海外。这一点，我们绝不能遗忘。"
 FRA_A_New_Aristocracy: "新贵族"
 FRA_A_New_Aristocracy_desc: "财富铸就权力，经验引领胜利。如今的法国上层阶级过于关注这里的社会正义，却忘了军队才是对抗任何地方不公的主要方式，忘了只有保持商业简单才能把食物端上餐桌，而不是去管制每一个艰难谋生的小店铺。我们需要一个新的知识阶层和一个新的上层阶级，由军人和有商业头脑的人组成。法国需要赚钱、创造就业机会，因为就业意味着稳定，稳定意味着孩子，而孩子意味着一个有保障的未来。一个以法国未来力量为首要关切的贵族阶层，将带来长期的益处。"
 FRA_Play_into_Napoleonic_Overtones: "拿破仑式的暗示"
 FRA_Play_into_Napoleonic_Overtones_desc: "在法兰西，任何军事领袖都终将被拿破仑的身影所映照——毕竟，从未有比他更伟大的军事统帅。民族主义者视那个时代为法兰西真正的诞生，甚至共和派也无法否认其统治时期所带来的进步。在这片土地上，军人治国并不总是被视为坏事。戴高乐让我们重回正轨，而如今，在政治分裂、军事虚弱和国家衰退之际，德维利耶再次被委以重任，指引法国前行。就像之前的拿破仑一样，法国进入了一个新时期，而面对即将来临的风暴，我们再也找不到比他更合适的舵手。"
 FRA_Birth_of_a_French_Military_Industrial_Complex: "法国军工复合体"
 FRA_Birth_of_a_French_Military_Industrial_Complex_desc: "难道只有德美才配拥有军工巨头？雷神、莱茵金属、黑克勒-科赫——这些军火巨鳄在本国享受政府订单的专宠，而我们却在自废武功，拆毁戴高乐元帅打造的统制经济体系。是时候重建国家主导的军事工业了！在东方秃鹫将我们当作腐肉饕餮的当下，自由市场已然失效。这些曾被我们锁进铁笼的猛禽，如今正用利喙撕扯法兰西的血肉。"
 FRA_The_French_Reagan_Category: "伟大战略家"
 FRA_The_French_Reagan_Category_desc: "\n\n\n\n\n£GFX_FRA_great_strategist_cat\n\n\n\n\n\n\n\n皮埃尔·德维利耶掌舵法国之际，变革时代也就此拉开帷幕。他推行重塑法国军事、政治版图的战略改革。重在提升军队效率，巩固国家安全，激发每位公民的民族自豪感，举国上下对此充满期待。\n\n每一次改革都让军队更强大。在适应当代挑战的同时，保证法国人民安全繁荣。德维利耶优先考虑重组国防预算，制定创新培训计划，同国防工业拉起牢固纽带。目标很明确：军队不仅能保卫国家，更能体现法兰西坚韧不拔的精神与强大。"
 FRA_Calm_Militarists_decision: "噤声军国派狂欢"
 FRA_Correct_the_Trickle_Down_system_decision: "纠正涓滴经济学"
 FRA_Coordinate_a_March_decision: "配以军力展示"
 FRA_A_Unified_General_Staff_decision: "团结军官团"
 FRA_Perfection_of_Strategy_decision: "完美策略"
 FRA_Utilize_Zemmour_decision: "利用泽穆尔"
 FRA_Play_into_ultraconservativism_decision: "款待极端保守派"
 FRA_Promote_Nationalist_Education_villiers: "推进民族主义教育"
 FRA_Remove_the_French_Cancer: "剖析左派"
 FRA_Soviet_Fearmongering_villiers: "俄罗斯威胁"
 FRA_All_Hands_on_Deck_villiers: "一切为了国家"
 FRA_Mass_Militarization: "大规模军国化"
 FRA_A_French_Renessiance: "人民的凯旋"
 FRA_A_French_Renessiance_desc: "法国的土地上充斥着欢庆，因为人民再次坚定地选择了民主价值，击败了极右势力。随着选举的重担终于落下，政府正努力通过实施改革来回报民众的信任——恢复全国的团结和民族自豪感。人民的声音已得到聆听，现在我们必须行动起来，打造一个属于所有人的法国。"
 FRA_Entrench_Centrism: "坚定中庸道路"
 FRA_Entrench_Centrism_desc: "此次选举险胜表明——若要使改革方案不仅能通过，更要能世代延续，我们便必须将信念与价值观深植法国政治核心。为实现这一目标，我们已着手主动接触反对派，就增进法国人民福祉的改革议题开启对话与务实合作。秉持政策改革的中间路线，我们将更有效凝聚国民共识，避免重蹈本届政府与选举引发的政治分裂覆辙。"
 FRA_Uphold_European_Values: "维护欧洲价值观"
 FRA_Uphold_European_Values_desc: "与反对派不同，我们坚定恪守欧盟为欧洲各国确立的价值准则。我们将调动一切资源，通过民主、合作与对话维护欧盟核心价值观。通过深化经济伙伴关系确保欧洲强大实力，倡导推行共同政策以守护我们的理想信念。由法国引领传递欧盟理念与价值的团结欧洲，必将在本届政府任期结束后依然历久弥坚。"
 FRA_Work_with_our_Opposition: "给反对派的橄榄枝"
 FRA_Work_with_our_Opposition_desc: "我们将通过主动联络反对党来培养跨党派合作精神，在关键问题上启动两党对话，展示出超越党派界限的治理承诺。我们将致力于建立一个更具包容性的政治环境，鼓励建设性的辩论和有效的政策制定。"
 FRA_Expand_our_Mediterranean_Influence: "扩张地中海影响力"
 FRA_Expand_our_Mediterranean_Influence_desc: "地中海历来对欧洲大陆及法国具有举足轻重的战略意义。鉴于近期国际形势的变化，为扩大我国在全球的影响力和存在感，法国决定收购马耳他这一岛国。此举将不仅能提振马耳他的经济实力，促进两国文化交流，还将确保该岛的安全。此次领土整合将在未来数年为法国及马耳他人民带来深远而积极的影响。"
 FRA_Push_for_EU_Reform: "推动欧盟改革"
 FRA_Push_for_EU_Reform_desc: "随着法国政治危机迎来终点，我们深刻认识到了社会动荡与极端化的危害。为此，我们将推动欧盟进行迫切所需的改革，以避免类似法国的悲剧在欧洲其他地区重演。在这一艰难时期，强化欧盟不仅将惠及欧洲人民，更能为全球树立抵御极端主义与仇恨的典范。法国必须向欧洲展示其在近期斗争中的成功经验，以使欧洲成为进步与改革的沃土。"
 FRA_Godlike_posturing_flag: "马克龙未把自己当作神明"
 FRA_national_embrrassment_flag: "国耻"
 fra_left_nato: "我们采取了反北约立场。"
 fra_stay_nato: "我们采取了亲北约立场。"
 FRA_fraud_1: "已完成伪造行动。"
 FRA_fraud_2: "已完成作废行动。"
 FRA_Created_Vaccine: "已经研制出疫苗。"
 FRA_Authdem_Driot_Chemin_flag: "守旧派已控制运动。"
 FRA_Nationalist_Driot_Chemin_flag: "军国派已控制运动。"
 FRA_melenchon_candidate: "让-吕克·梅朗雄是新人民阵线领袖"
 FRA_faure_candidate: "奥利维耶·富尔是人民阵线领袖。"
 FRA_ruffin_candidate: "弗朗索瓦·吕芬是人民阵线领袖。"
 FRA_A_French_Conquest: "再征服运动"
 FRA_A_French_Conquest_desc: "再征服党已然凯旋，在军方守护者的鼎力支持之下，泽穆尔入主爱丽舍宫，与国民联盟党组成历史性执政联盟。收复运动将即刻启动法兰西伟大重生计划，我们必须以雷霆之势推进，在异己势力反扑前抢占先机。正如十字军的铁律：坐观其变者终将寸步难行，行动才是甲胄在身者的挚友。"
 FRA_Halt_Immigration: "暂停接收移民"
 FRA_Halt_Immigration_desc: "非洲移民潮水般涌入法国，可他们的母国却把我们的军事基地都扫地出门！当年我们为非洲稳定流血流汗，如今换来的就是这种回报？简直荒谬！法国当初的维和行动可不是为今天移民泛滥铺路！是时候让这些人回去建设自己的家园了！法国不需要廉价劳动力——你们的涌入压低了底层工资，害得我们的老百姓越来越穷！看看阿尔及利亚，五十年前赶走我们，现在别指望法国当冤大头！\n\n移民大门必须关死，严苛的移民法案，专用遣返船队，我们马上就能解决这些问题。肯定有人会乞求怜悯，但别忘了，泽穆尔总统虽然自己就有阿尔及利亚犹太血统，可是人家祖辈懂规矩，他自己更是模范公民，和现在欧洲那些闹事的移民根本就是两码事。"
 FRA_Administration_Simplification: "精简行政机关"
 FRA_Administration_Simplification_desc: "法国已发展为一个官僚主义盛行的国家，其体制之盘根错节，若未经数周的深入学习课程，普通人根本无法真正理解其内部运作机制。单是法国繁杂的监管法令就耗费了整个团队五周时间进行梳理，才能甄别出哪些具有实际价值。更不必说欧盟无端强加的成千上万条相关法规，这些冗余制度不仅让普通民众为完成基本事务抓狂，连政客们也深受其累。诚然总统本已大权在握，但我们仍需通过精简流程，让行使权力变得稍微轻松些。"
 FRA_Rabid_Assimilation: "从魁北克汲取灵感"
 FRA_Rabid_Assimilation_desc: "魁北克近期在法语普及率持续下降的背景下通过了一系列严苛法案。虽然这一趋势早有端倪，但蒙特利尔当局最终忍无可忍，将年度移民总数削减至区区5万人。新规不仅要求单一国籍申请者占比不得超过25%，还将社会融入度作为永久居留的必要条件。这项立法不仅将年移民数量控制在总人口的极小比例，且迫使移民群体走向多元化，以期防止形成凝聚力过强的少数族群，更将法语读写能力从鼓励措施升级为长期居留的硬性指标。我们法兰西只需稍作调整，便可从中获益——向旧殖民地学习实属新鲜事，毕竟通常只有英国会干这种事。"
 FRA_Put_France_Before_Europe: "法国高于欧洲"
 FRA_Put_France_Before_Europe_desc: "若断言欧盟与北约全然是我们的绊脚石，未免有失公允。法兰西数十年来确实受益于此等机制框架，更曾是欧盟创始国之一。但时移世易，我们不能再延续以牺牲自身繁荣为代价、将经济规划目标对准整个欧洲版图的旧制。我们与他们有何本质不同？难道我们不该专注规划本国经济，让他们自谋发展？我们有何资格强加制度框架？他们又以何种立场对我们指手画脚？任其自生自灭吧，若它们离了我们的扶持便难以为继，那便是天命难违，唯有延缓，毕竟命运的轨迹终不可逆。"
 FRA_Reverse_Declinism: "逆转衰落主义"
 FRA_Reverse_Declinism_desc: "自1970年代以来，法兰西便深陷持续衰落的泥潭。正如泽穆尔所言，六八自由派世代将国家引向了自我毁灭之路——民族自豪感被系统解构，国门向任何有意者敞开。五十载春秋，我们目睹着法兰西的式微；五十载岁月，自让-马里·勒庞时代起，泽穆尔始终在政治光谱右翼坚守阵地，对抗着外来群体的持续扩张，特别是国境之内蔓延的伊斯兰瘟疫。如今，这份坚守终获历史回响。\n\n泽穆尔亲手扼杀长久束缚法兰西的藤蔓，这头雄狮终将挣脱桎梏跃进二十一世纪。那些阻滞国家前行的顽疾——无度移民、财政黑洞、为构建德国主导的欧洲超级实体而甘愿抛弃民族特性的谵妄——都将被连根拔起。这类闹剧必须终止，传统价值将成为国家航舵，理性与逻辑必将取代圣母心肠的感性泛滥。"
 FRA_VIC_160_days_malaise_tt: "完成此国策后，动员乏力将在§Y160日§!后失效。"
 FPR_damage_divisions_tooltip: "这将对东欧多个城市的部门造成§R损害§!。"
 FRA_will_win_next_election_tt: "§C除非发生重大破坏性事故，塞茹尔内将赢得2027大选§!。"
 FRA_Caribbean_Occupation_Auth_tt: "我们将在加勒比地区建立一个占领政府。"
 FRA_Corrupted_Presidential_Guard_tt: "任何人都有价码可循，就连共和卫队里那些号称‘清廉’的家伙也不例外。这边塞点好处，那边许个晋升承诺。他们要么会被拉拢过来，至少也会被迫§R睁只眼闭只眼……§!"
 FRA_seize_movement_warning_tt: "§R该运动将被该党此派系所利用。§!"
 FRA_Recoup_our_Losses: "补偿我国损失"
 FRA_Recoup_our_Losses_desc: "马克龙执政法兰西的五年堪称一场灾难。从最初开放包容、笑容可掬的魅力型领袖，短短五年间，他竟异化为追逐“朱庇特式理念”的偏执者——那个将元首塑造成至高权威的政治幻梦。换作他人或许尚可实现理想，然而复兴党明明已触及议会绝对多数席位的门槛，终究未能逃脱历史定数。"
 FRA_Embrace_the_New_Left: "拥抱新左派"
 FRA_Embrace_the_New_Left_desc: "复兴党曾以政治坐标轴“第三极”的姿态傲立民粹右翼与极左翼之间，但若失去政治盟友，复兴党注定难以为继。梅朗雄革新左翼阵营的努力已见成效，唯有精诚合作并以铁腕手段维持党内纪律，方能抗衡勒庞势力。这位对手虽与我们立场相左，却在诸多政策领域存在利益交汇点。未来数年，构建反勒庞联盟将使双方共赢。"
 FRA_Battle_Every_Legislation: "反对保守立法"
 FRA_Battle_Every_Legislation_desc: "“他们休想通过”这句凡尔登战役的著名口号，如今成为法国左翼对抗勒庞势力的集结号。勒庞的崛起与国民联盟的得势，正威胁着中左翼数十年来在劳工权益和社会公正领域取得的所有成果。每一项新法案的出台，都是对我们前辈数十年来工作的攻击，是对四十年来斗争成果的蚕食。"
 FRA_Investigate_Electoral_Integrity: "调查选举公正性"
 FRA_Investigate_Electoral_Integrity_desc: "我们预料到了石油危机与新冠疫情会给选情带来冲击，但民调却显示我方本应保持数个百分点的领先优势。看来，巴黎那儿的情况显然有些不对劲；对此我们将启动全国性调查程序，充分动员中央与地方司法资源，彻查国民联盟的选举舞弊嫌疑。他们或许会争辩这是不实的指控，是一场政治迫害，但无论真假，相关调查必能分化公众舆论，削弱勒庞及其亲信的支持率。当质疑声量达到临界点，公众认知自会完成事实重构——我们只需播下怀疑的种子即可。"
 FRA_Take_A_Stance_on_Federalization: "联邦化新立场"
 FRA_Take_A_Stance_on_Federalization_desc: "马克龙曾是欧洲联邦化的最积极的倡导者之一，其主张建立一体化的军队，并在法律、经济甚至警务方面实现深度整合。如今，我们要么选择合适的联盟伙伴来延续这一路线，要么改弦更张。诚然，勒庞的胜利表明了政治风向的转变，疑欧立场或许更能提升我们的民调支持率。将共和国的利益置于邻国之上无疑是一个受欢迎的决定，这是马克龙始终未能领悟的；但即使我们接受这种民意取向，也不必完全背弃欧洲。如果我们愿意，我们仍可保持亲欧盟立场。此刻我们正站在历史的十字路口，一条通向欧洲化，另一条通向法国；不过无论如何，选择权在我们手中。"
 FRA_Uphold_Republican_Beliefs: "维持共和理想"
 FRA_Uphold_Republican_Beliefs_desc: "自由、平等、博爱。这是我们伟大共和国的立国之本，历经五个共和国、两个王国和两个帝国时期，我们也未曾忘却这些理想。但倘若我们不加以守护，终有一天会失去它们。我们之中潜藏着一群阴险的保守派、传统主义者，他们与波旁王朝的余孽相差无几。革命必须得到捍卫，这一点没有人比法国人更清楚，天知道我们曾不止一次在“黄马甲”运动中领教过他们的怒火。\n\n对抗勒庞很简单，只需指出她的政策违背共和精神，平等和自由是我们的立国之本，而她却限制抗议者，把法国人优先凌驾于一切之上，哪怕分裂少数族裔也在所不惜。法兰西共和国从来不是建立在无法遏制的民族主义和无节制的排外主义之上，早在建国之初，我们就试图摆脱教会，虽然这一主张当时并不受欢迎，但这并不意味着我们应该摒弃1793年的成果，去打造一个安全却不敢批评政府的新社会。"
 FRA_A_Denied_Destiny: "命定前途"
 FRA_A_Denied_Destiny_desc: "勒庞失败了，她的改良主义让我们输掉了选举。我们从来不是以中右翼的温和派著称，而是行动与力量的象征！她的辞职，是她这些年来做出的最正确的决定。如今，党已由巴尔代拉掌舵，而我们被人民拒绝的原因，正是马克龙及其自由派同党操控的现状。他自诩为戴高乐式的领导者，但他不过是个蹲伏在布鲁塞尔脚下的豺狼，一边嘲弄法国的尊严，一边为那些商界与军方的应声虫编织着权力之网。但我们不会袖手旁观！我们要将他那精心编织的谎言撕碎，让他的盟友在恐惧中溃散。"
 FRA_Reintegrate_Radical_Forces: "重新整合激进势力"
 FRA_Reintegrate_Radical_Forces_desc: "正是国民阵线的改革导致了右翼的分裂——认同派、泽穆尔的“再征服”党纷纷另立门户。如果我们在上次选举中团结一致，我们本可赢得多数席位。如今，巴尔代拉掌舵，父亲的政党回来了，女儿的政党已经死去。激进派将重新回到我们的怀抱，我们将团结一心，让世界听到我们的声音！法兰西万岁！"
 FRA_Meet_with_Disgraced_Militarists: "会见可耻的军国主义者"
 FRA_Meet_with_Disgraced_Militarists_desc: "在上次选举前，法国军方上演了一出马丁·路德式的戏码，在巴黎各地的政府大门上张贴诉求，军事单位进驻郊区。对马克龙和整个国家而言，这仿佛政变即将发生，但实为施压手段。马克龙一度避走他处，却最终强硬回绝军方要求。勒庞表面声援军方，但最终未能赢得胜利。军方对马克龙领导的复兴党胜选深感焦虑，担忧法国军队持续衰弱，而此时俄罗斯兽人正在东方集结兵力，准备趁美国留下的权力真空践踏西方世界。巴尔代拉与军方怀有相似的意志，愿以突破法律界限的手段确保法兰西的未来。我们可以承诺满足他们的诉求，甚至更多。"
 FRA_Entangle_Electoral_Victory: "打击自由派学界"
 FRA_Entangle_Electoral_Victory_desc: "自由派精英能成为当今社会的主流是有原因的，他们掌控着教育系统。就像马克思主义者在人民阵线鼎盛时期曾经做到的那样。控制学校就等于控制了学生，你可以随意定义是非对错，教导他们保持沉默或是高声呐喊，将他们引向你想要压制的对象后，一切就会自行运转。他们在同一种思想灌输中养育子女，子子孙孙代代相传。法国腐朽堕落的学术界充斥着毫不关心国家与人民福祉的左翼全球主义者，他们宁可维护地球另一端某个廷巴克图式偏远村庄的利益。看看他们煽动的抗议酿成了多少伤亡？摧毁了多少企业和生计？是时候终结这一切了，我们要不择手段扰乱他们的活动。派蒙面人深夜突袭其住所、打电话进行炸弹威胁，并将所有行动归咎于俄罗斯煽动者和左翼革命分子。我们要让那些他们煽动起来的暴乱反噬其自身，直到他们彻底噤声。在恐惧的驱使下，他们甚至可能投靠我们。"
 FRA_The_Right_Way: "正道"
 FRA_The_Right_Way_desc: "所谓正确道路自有其理，左翼又能带来什么？通胀高企？税负加重？福利体系在穆斯林移民潮冲击下日益崩坏？若你心属文艺复兴中心也无妨，须知该组织早已与布鲁塞尔官僚沆瀣一气，但凡有机会就会将法兰西出卖给欧洲联邦化的迷梦。法兰西的衰亡绝非阴谋论，而是自由派既定的竞选纲领与长期战略目标。唯有巴尔代拉领导的国民联盟能将法国从左翼议程中拯救，只有国民联盟能减轻税负、充实民众钱袋，并将那些乘筏渡海而来的摩尔人遣返。请为您选区的国民联盟代表投票，并向地方支部咨询志愿协助事宜。若是询问本党武装派系？小声点，您跟我来。"
 FRA_Stoke_Russian_Fears: "煽动俄国霸权恐惧"
 FRA_Stoke_Russian_Fears_desc: "俄罗斯人历来是欧洲的死敌！狡诈的斯拉夫蛮族与蒙古铁骑无异！这个落后的帝国背叛了我们，他们曾与德国暗通款曲，不到二十年便与日耳曼人勾肩搭背，却对我们笑脸相迎。雅尔塔协议对那个格鲁吉亚屠夫而言不过是一纸厕纸，若说俄罗斯人何时曾信守过条约承诺，那恐怕要追溯到文字诞生前的洪荒年代，毕竟史册上从未有过这般记载！如今你若相信他们会遵守协议？不是蠢货就是俄谍，再不济也是怀念你那苏维埃母邦的无神论共匪！法兰西！别再自欺欺人了！若不认清当今严酷的新世界秩序，你终将被钉死在克里姆林宫的火刑架上！"
 FRA_Operation_Saint_Arnaud: "§Y达武行动§!"
 FRA_Operation_Saint_Arnaud_desc: "俄军对我方突然介入乌克兰战局措手不及，却并未终止攻势。从前线战报与情报分析来看，他们非但没有稍作暂停，评估局势，反而增派更多资源强攻乌军突出部。尽管外界担忧乌克兰能否挺过这场风暴，当前形势却暗藏着天赐良机，当俄军将所有注意力都倾注于乌克兰战场，试图在长达1600公里的战线上重新布防时，其后勤资源已捉襟见肘。这为我们在库班地区的俄军后方实施大胆两栖登陆创造了条件。此类桥头堡将进一步消耗俄军本已吃紧的人力与后勤资源，甚至可能迫使其停止进攻行动，让我们能趁北极熊立足未稳之际组织大规模反攻。此役若胜，法兰西将奠定欧洲主导者地位；若败，则欧洲命运与法兰西荣光皆危如累卵。"
 FRA_Operation_Davout_decision: "§Y达武行动§!"
 FRA_NATO_war_category: "欧陆战争"
 FRA_NATO_war_category_desc: "\n\n\n\n\n£GFX_SOV_NATO_war_category\n\n\n\n\n\n\n\n俄国人再一次企图进军欧洲，建立自己的帝国……只有我们才能阻止他们。\n\n§R主要目标§!：\n\n§Y塞瓦斯托波尔§!：[GLOBAL.get_sevastopol_nato_status]\n§Y明斯克§!：[GLOBAL.get_minsk_nato_status]\n§Y圣彼得堡§!：[GLOBAL.get_petersburg_nato_status]\n§Y顿河畔罗斯托夫§!：[GLOBAL.get_rostov_nato_status]\n\n§R次要目标§!\n\n§Y加里宁格勒§!：[GLOBAL.get_kaliningrad_nato_status]\n§Y别尔哥罗德§!：[GLOBAL.get_belgorod_nato_status]\n§Y伏尔加格勒§!：[GLOBAL.get_volgograd_nato_status]\n§Y诺夫哥罗德§!：[GLOBAL.get_novgorod_nato_status]\n§Y顿涅茨克§!：[GLOBAL.get_donetsk_nato_status]\n§Y卢甘茨克§!：[GLOBAL.get_luhansk_nato_status]\n\n§G盟友城市§!\n\n§Y基辅§!：[GLOBAL.get_kiev_nato_status]\n§Y敖德萨§!：[GLOBAL.get_odessa_nato_status]\n§Y塔林§!：[GLOBAL.get_tallinn_nato_status]\n§Y维尔纽斯§!：[GLOBAL.get_vilnius_nato_status]\n§Y华沙§!：[GLOBAL.get_warsaw_nato_status]\n§Y布达佩斯§!：[GLOBAL.get_budapest_nato_status]\n§Y布加勒斯特§!：[GLOBAL.get_bucharest_nato_status]\n\n§Y达武行动§!：\n§5刻赤§!：[GLOBAL.get_kerch_nato_status]\n§5新罗西斯克§!：[GLOBAL.get_novorossiysk_nato_status]\n§5索契§!：[GLOBAL.get_sochi_nato_status]"
