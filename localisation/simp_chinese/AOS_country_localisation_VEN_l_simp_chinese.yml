 # CHARACTERS #
VEN_nicolas_maduro_char: "尼古拉斯·马杜罗"
VEN_nicolas_maduro_char_desc: "尼古拉斯·马杜罗·莫罗斯并非出生在权力之中，周围环绕着金山银山。他出生在加拉加斯的一个中产阶级家庭，完全不知道他未来的决定会带他走向何方。\n\n他的父亲是左翼激进分子，他与当局的麻烦历史成为尼古拉斯效仿的榜样，后者在青少年时期就开始尝试革命和阶级斗争的思想。他没有上大学，而是开始在加拉加斯地铁担任卑微的公交车司机，同时仍然是他的工会的宝贵成员。1992年乌戈·查韦斯发动失败的政变时，他的人生发生了巨大转折。1999年查韦斯赢得总统选举时，马杜罗成为国民议会的议员。他的忠诚使他在查韦斯的内阁中获得一席之地，并最终在2012年成为他的副总统。\n\n查韦斯当时患有癌症，他知道自己时间不多了，所以公开宣布如果他去世，马杜罗将接替他的职位。他确实去世了，从那时起情况一天比一天糟糕。马杜罗的总统任期以物资匮乏、饥饿、政治动荡、苦难和不稳定为标志。蹂躏他国家的人道主义危机证明他在履行保护人民的誓言方面相当低效。无论他多么努力，越来越多的人反对他，在他曾经作为卑微活动家游行的街道上与他战斗。\n\n随着每一天的过去，他变得越来越专制，拼命想在一个不断崩溃的国家中保住权力。他这样做是为了维护查韦斯和玻利瓦尔革命的遗产，但这些努力似乎徒劳无功，就像试图重建一堆烧毁、破碎的玻璃一样。"

VEN_henrique_capriles_char: "恩里克·卡普里莱斯"
VEN_henrique_capriles_char_desc: "恩里克·卡普里莱斯·拉东斯基于1972年7月11日出生在卡拉卡斯，来自一个显赫的犹太裔委内瑞拉家庭。他毕业于安德烈斯·贝略天主教大学法律系，后来成为一名律师。卡普里莱斯于1993年首次进入政治领域，当选为众议员，并于2000年当选为米兰达州州长。2012年，他作为民主团结圆桌会议候选人参加总统选举，以微弱差距输给了乌戈·查韦斯。2013年查韦斯去世后，他再次参加总统选举，又以微弱差距输给了尼古拉斯·马杜罗。卡普里莱斯以其温和的中间派立场和对民主改革的承诺而闻名，他认为委内瑞拉需要回归民主制度，恢复法治，解决经济危机。"

VEN_juan_guaidó_char: "胡安·瓜伊多"
VEN_juan_guaidó_char_desc: "胡安·瓜伊多·罗德里格斯于1983年7月28日出生在加拉加斯，是委内瑞拉反对党领袖。他毕业于安德烈斯·贝略天主教大学工程系，后来成为一名工程师和企业家。瓜伊多于2011年首次进入政治领域，加入了人民意志党，并于2015年当选为众议员。2019年，他被选为国民议会主席，并宣布自己为委内瑞拉临时总统，获得了包括美国在内的多个国家的承认。瓜伊多的行动引发了委内瑞拉的政治危机，他与马杜罗政府对峙了数月，但最终未能推翻政府。尽管面临逮捕威胁，瓜伊多仍然坚持反对马杜罗政府，呼吁国际社会支持委内瑞拉的民主进程。"

 # PARTIES #
VEN_psuv_party: "统一社会主义党"
VEN_psuv_party_long: "委内瑞拉统一社会主义党"
VEN_mud_party: "民主团结圆桌会议"
VEN_mud_party_long: "民主团结圆桌会议"
VEN_fpv_party: "第五共和国运动"
VEN_fpv_party_long: "第五共和国运动"

 # NATIONAL SPIRITS #
VEN_bolivarian_revolution: "玻利瓦尔革命"
VEN_bolivarian_revolution_desc: "玻利瓦尔革命是由乌戈·查韦斯领导的一场政治和社会运动，旨在实现西蒙·玻利瓦尔的理想，建立一个公平、公正、团结的委内瑞拉。这场革命始于1999年查韦斯当选总统，他实施了一系列改革，包括修改宪法、扩大社会福利、推进经济国有化等。玻利瓦尔革命强调人民的参与和主权，反对新自由主义和帝国主义，主张建立一个多极化的世界秩序。尽管面临挑战和争议，玻利瓦尔革命仍然对委内瑞拉和拉丁美洲产生了深远的影响。"

VEN_economy_under_sanctions_idea: "受制裁的经济"
VEN_economy_under_sanctions_idea_desc: "委内瑞拉经济长期受到美国和其他国家的制裁，这对国家的经济发展造成了严重影响。制裁导致委内瑞拉无法获得国际融资，无法进口必要的物资和技术，无法进行正常的贸易活动。同时，制裁也加剧了委内瑞拉的通货膨胀和货币贬值，导致人民生活水平下降。尽管面临制裁，委内瑞拉政府仍然努力维持经济运转，推动国内生产，寻求替代的贸易伙伴。"

VEN_cia_backed_opposition: "亲西方反对派"
VEN_cia_backed_opposition_desc: "委内瑞拉反对党得到了美国中央情报局和其他西方势力的支持，他们试图推翻马杜罗政府，建立一个亲西方的政权。反对党通过各种手段进行抗议和示威活动，包括组织大规模集会、发动罢工、破坏公共设施等。同时，他们也在国际上寻求支持，呼吁国际社会对委内瑞拉实施制裁和干预。尽管反对党得到了外部支持，但他们未能赢得委内瑞拉人民的广泛支持，也未能推翻马杜罗政府。"

VEN_world_anti_imperialist_platform_idea: "世界反帝平台"
VEN_world_anti_imperialist_platform_idea_desc: "委内瑞拉是世界反帝运动的重要参与者，积极推动建立一个反对帝国主义和新殖民主义的国际平台。委内瑞拉政府支持其他国家的反帝斗争，包括古巴、伊朗、叙利亚等。同时，委内瑞拉也在国际组织中发挥积极作用，推动改革联合国和其他国际机构，以实现更加公平和公正的国际秩序。委内瑞拉的反帝立场得到了许多发展中国家的支持和认同。"

VEN_maduro_popularity_solidified_idea: "马杜罗支持率巩固"
VEN_maduro_popularity_solidified_idea_desc: "尽管面临经济危机和国际制裁，尼古拉斯·马杜罗仍然保持着一定的支持率。他的支持者认为，马杜罗政府在困难时期仍然致力于维护委内瑞拉的主权和独立，保护人民的利益。同时，马杜罗政府也采取了一系列措施来缓解经济危机，包括发放食品补贴、提供免费医疗和教育等。这些措施赢得了部分人民的支持，巩固了马杜罗的政治地位。"

VEN_economic_chavismo_idea: "经济查韦斯主义"
VEN_economic_chavismo_idea_desc: "经济查韦斯主义是乌戈·查韦斯提出的一种经济模式，旨在实现经济主权和社会公平。这种模式强调国家对经济的主导作用，通过国有化、价格管制、补贴等手段来控制经济。同时，经济查韦斯主义也注重社会福利，通过扩大公共服务和社会保障来改善人民的生活。尽管这种模式在初期取得了一些成效，但随着时间的推移，它也暴露出一些问题，包括经济效率低下、腐败严重、资源配置不合理等。"

VEN_venezuelian_bolivarian_army_idea: "委内瑞拉玻利瓦尔革命军"
VEN_venezuelian_bolivarian_army_idea_desc: "委内瑞拉玻利瓦尔革命军是委内瑞拉的武装力量，成立于1999年，旨在维护国家主权和领土完整，保护人民的利益。这支军队继承了西蒙·玻利瓦尔的革命传统，强调人民军队的理念，即军队是人民的武装力量，服务于人民。委内瑞拉玻利瓦尔革命军在维护国家稳定和应对外部威胁方面发挥了重要作用，同时也参与了国内的社会和经济建设。"

 # EVENTS #
VEN.1.t: "2018年委内瑞拉选举"
VEN.1.d: "2018年委内瑞拉举行总统选举，这是一次备受争议的选举。尼古拉斯·马杜罗作为执政的统一社会主义党候选人参加选举，并以压倒性优势获胜。然而，反对党和许多国际观察员认为这次选举不公正，存在舞弊行为。反对党拒绝承认选举结果，并呼吁进行新的选举。同时，美国和其他一些国家也拒绝承认马杜罗的连任，认为他的政府是非法的。这次选举加剧了委内瑞拉的政治危机，使国家陷入了更深的分裂。"
VEN.1.a: "马杜罗连任总统"

VEN.2.t: "胡安·瓜伊多宣布临时总统"
VEN.2.d: "2019年1月23日，委内瑞拉国民议会主席胡安·瓜伊多宣布自己为委内瑞拉临时总统，引发了一场政治风暴。瓜伊多的行动得到了美国、加拿大、巴西等多个国家的承认，他们认为马杜罗政府是非法的，瓜伊多是委内瑞拉的合法领导人。然而，马杜罗政府拒绝承认瓜伊多的地位，并指责他是美国的傀儡。这场政治危机使委内瑞拉陷入了两个政府对峙的局面，国际社会对委内瑞拉的未来感到担忧。"
VEN.2.a: "临时总统诞生"

VEN.3.t: "美国对委内瑞拉实施制裁"
VEN.3.d: "美国政府宣布对委内瑞拉实施新的制裁，旨在迫使马杜罗政府下台。制裁措施包括冻结委内瑞拉政府的资产、禁止美国公司与委内瑞拉进行贸易、限制委内瑞拉官员的旅行等。美国政府表示，这些制裁是为了支持委内瑞拉的民主进程，保护委内瑞拉人民的利益。然而，许多国家和国际组织认为，美国的制裁只会加剧委内瑞拉的经济危机，对人民造成更大的伤害。"
VEN.3.a: "制裁升级"

VEN.4.t: "委内瑞拉与俄罗斯的合作"
VEN.4.d: "委内瑞拉政府宣布与俄罗斯加强合作，包括军事、经济和外交领域。俄罗斯向委内瑞拉提供了军事援助和技术支持，帮助委内瑞拉维护国家安全。同时，俄罗斯也在经济领域与委内瑞拉合作，投资委内瑞拉的石油和天然气产业。这种合作关系对委内瑞拉来说至关重要，因为它提供了一个替代美国和西方的选择，帮助委内瑞拉在国际上保持一定的独立性。"
VEN.4.a: "深化合作"

VEN.5.t: "委内瑞拉的人道主义危机"
VEN.5.d: "委内瑞拉正面临着严重的人道主义危机，数百万人缺乏基本的生活物资和医疗服务。由于经济危机和国际制裁，委内瑞拉的医疗体系崩溃，许多医院缺乏药品和设备，无法为患者提供必要的治疗。同时，食品短缺也成为一个严重问题，许多人每天只能吃一顿饭，甚至更少。国际社会多次呼吁向委内瑞拉提供人道主义援助，但由于政治分歧，援助物资往往无法顺利到达需要的人手中。"
VEN.5.a: "危机加剧"

 # FOCUSES #
VEN_defend_bolivarian_revolution: "捍卫玻利瓦尔革命"
VEN_defend_bolivarian_revolution_desc: "玻利瓦尔革命是委内瑞拉的立国之本，政府将继续捍卫这场革命的成果，反对任何试图推翻它的势力。政府将加强国家安全，打击反革命活动，维护社会稳定。同时，政府也将继续推进社会改革，改善人民的生活，巩固革命的群众基础。"

VEN_economic_recovery: "经济复苏"
VEN_economic_recovery_desc: "委内瑞拉经济面临着严重的危机，政府将采取一系列措施来促进经济复苏。这些措施包括改革经济体制、吸引外国投资、促进国内生产、改善基础设施等。政府希望通过这些措施来恢复经济增长，提高人民的生活水平。"

VEN_international_alliance: "国际联盟"
VEN_international_alliance_desc: "委内瑞拉将继续加强与其他国家的合作，建立一个反对帝国主义和新殖民主义的国际联盟。政府将与古巴、俄罗斯、中国等国家保持密切联系，共同应对国际挑战，推动建立一个更加公平和公正的世界秩序。"

VEN_social_welfare: "社会福利"
VEN_social_welfare_desc: "政府将继续扩大社会福利覆盖范围，为人民提供基本的生活保障。这些福利包括食品补贴、免费医疗、免费教育、住房保障等。政府希望通过这些措施来改善人民的生活，减少贫困和不平等。"

VEN_military_strengthening: "军事强化"
VEN_military_strengthening_desc: "委内瑞拉将加强国防力量，提高军队的战斗力和现代化水平。政府将投资于军事装备和技术，培训军队人员，改善军事基础设施。同时，政府也将加强军民合作，提高全民的国防意识。"

VEN_education_reform: "教育改革"
VEN_education_reform_desc: "教育是委内瑞拉发展的关键，政府将继续推进教育改革，提高教育质量，促进教育公平。改革的重点包括改善学校基础设施、提高教师素质、加强职业教育、推广数字教育等。通过这些措施，政府希望为委内瑞拉的未来发展培养更多高素质的人才。"

VEN_healthcare_reform: "医疗改革"
VEN_healthcare_reform_desc: "委内瑞拉的医疗体系需要进行改革，以提高医疗服务的质量和效率。政府将加大对医疗领域的投入，改善医疗基础设施，提高医护人员的待遇，加强公共卫生管理。同时，政府也将推动医疗体系的数字化转型，提高医疗服务的可及性和便利性。"

VEN_cultural_preservation: "文化保护"
VEN_cultural_preservation_desc: "委内瑞拉拥有丰富的文化遗产，政府将加强对文化遗产的保护和传承。政府将加大对文化事业的投入，支持文化产业的发展，推广委内瑞拉的文化和艺术。同时，政府也将鼓励公民参与文化活动，增强民族文化认同感。"