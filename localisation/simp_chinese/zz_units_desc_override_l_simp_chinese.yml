l_simp_chinese:
 Militia_Bat_desc:0 "§Y编成：§!全营600人。装备：轻武器×350、反坦克导弹×20、便携式防空导弹×6。\n\n民兵连徒步作战。民兵部队的特点是重型装备和通讯设备比普通步兵少。这使得他们在崎岖地形中机动性强，作战效率高，但在平坦地形上面对装甲敌人时，他们很快就会溃败。\n\n§G设计师提示：民兵作战宽度较小并具有镇压能力。他们在城市、森林和丘陵中表现最佳，但防御和突破能力较差，尤其易受装甲部队及开阔或恶劣地形中的战斗影响。§!"
 Mot_Militia_Bat_desc:0 "§Y编成：§!全营600人。装备：轻武器×350、反坦克导弹×20、便携式防空导弹×6、通用载具×25。\n\n有皮卡甚至装甲多用途车的民兵营。民兵部队的特点是装备和通讯工具比普通步兵少。这使它们在恶劣地形上有很强的机动性和作战效率，但在平坦地形上，它们会在对抗装甲敌人时灰飞烟灭。\n\n§G设计师提示：摩托化民兵以稍高的成本换取速度和更强的镇压能力。可将他们用于机动安保以及在平原或沙漠中进行低成本推进，但他们薄弱的战斗属性和恶劣地形惩罚使其不适合作为突击部队。§!"
 Mech_Militia_Bat_desc:0 "§Y编成：§!全营550人。装备：轻武器×320、反坦克导弹×18、便携式防空导弹×6、装甲输送车×20。\n\n配备装甲运兵车的民兵连。民兵部队的特点是重型装备和通信设备比普通步兵少。这使得他们在崎岖地形中机动性强，作战效率高，但在平坦地形上面对装甲部队时，他们很快就会溃败。\n\n§G设计师提示：机械化民兵进一步牺牲了经济性，换取了速度和更高的耐久性。他们可以用来提供价格低廉的重型机动安保力量，并对抗步兵和炮兵，但与专业机械化部队相比，他们较弱的战斗属性使他们无法与装备精良的军队正面交锋。§!"
 L_Inf_Bat_desc:0 "§Y编成：§!全营1500人。装备：轻武器×820、反坦克导弹×56、便携式防空导弹×20、C&C设备×36、通用载具×12。\n\n没有运输工具的轻步兵连。这种部队在现代战场上很少见，但在丛林和山地等地形极其复杂的地区，确实存在一些专门的轻步兵单位 - 它们在这些地方非常有效。它们也可以用作城市驻防部队。\n\n§G设计师提示：轻步兵拥有高组织度并在丘陵、森林、山地、丛林、沼泽和城市中拥有较好的战斗表现，且无需车辆。他们可用于防守或进攻复杂地形，但注意，这些部队战略移动缓慢，且在平原和沙漠上相对较弱。§!"
 Mot_Inf_Bat_desc:0 "§Y编成：§!全营1600人。装备：轻武器×880、反坦克导弹×56、便携式防空导弹×20、C&C设备×36、通用载具×50。\n\n摩托化步兵连使用各种多用途车辆作为运输工具，从皮卡到现代化的防雷车。在道路和开阔地形有利于车辆行驶的战场上，它们能够提供快速的机动性。\n\n§G设计师提示：摩托化步兵在具有经济性的同时拥有高速度和在开阔地形中的良好表现。可用于扩大突破并快速支援前线，但其车辆增加了装备需求，并在森林、山地、丛林、沼泽和城市中效果不佳。§!"
 Hvy_Mot_Inf_Bat_desc:0 "§Y编成：§!全营1700人。装备：轻武器×930、反坦克导弹×56、便携式防空导弹×20、C&C设备×36、重型通用载具×45、反坦克导弹发射车×16。\n\n重型摩托化步兵连使用防雷反伏击车辆作为运输工具。其装甲车辆为乘员提供对地雷、简易爆炸装置和小武器火力的卓越防护，使其非常适合在伏击威胁较高的敌对环境中执行任务。\n\n§G设计师提示：重型摩托化步兵使用防护更重的车辆，在平原和沙漠地带执行快速前线作战。其装备密度更高，组织度与堑壕构筑能力低于轻型步兵，同时在复杂地形中仍遭受显著惩罚。§!"
 Mech_Inf_Bat_desc:0 "§Y编成：§!全营1750人。装备：轻武器×960、反坦克导弹×56、反坦克导弹发射车×16、便携式防空导弹×20、C&C设备×40、装甲输送车×45、轻型坦克×2、通用载具×8。\n\n机械化步兵连使用装甲运兵车作为运输工具。它们非常适合在平坦地形上进行装甲作战。\n\n§G设计师提示：机械化步兵具有强大的防御力与装甲机动性，在平原和沙漠地形中表现良好。可用于快速装甲编队中稳固战线，但装甲运兵车成本高昂，且在森林、山地、丛林和城市地形中攻击与机动能力受限。§!"
 Arm_Inf_Bat_desc:0 "§Y编成：§!全营1750人。装备：轻武器×960、反坦克导弹×56、反坦克导弹发射车×16、便携式防空导弹×20、C&C设备×40、步兵战车×45、通用载具×8。\n\n装甲步兵连使用步兵战车作为运输工具。它们非常适合在平坦地形进行装甲作战，但在地形复杂、必须远离步兵战车徒步作战的地区则显得力不从心。\n\n§G设计师提示：装甲步兵使用步兵战车，相比机械化步兵拥有更强的火力、装甲与突破能力。可在开阔地形中与坦克协同作战，但其组织度较低、装备成本高昂，且在山区、丛林、沼泽和城市地形中受到严重惩罚，需要谨慎部署。§!"
 L_Air_Inf_Bat_desc:0 "§Y编成：§!全营1500人。装备：轻武器×820、反坦克导弹×56、便携式防空导弹×20、C&C设备×36。\n\n空降轻步兵连是精锐步兵部队，接受过专门的空降训练，可通过运输机或运输直升机进行伞降作战。他们能够迅速响应远距离突发事件，并可渗透到敌后，在主力部队推进前夺取关键目标。然而，由于运输方式的限制，他们携带的重型装备数量受到严格限制。\n\n§G设计师提示：空降步兵兼具高组织度、空降能力以及在复杂地形中的出色表现。可用于夺取并坚守孤立目标，但其特种部队训练要求与较高的步兵装备需求使其不适用于常规战线作战，成本较高。§!"
 Mot_Air_Inf_Bat_desc:0 "§Y编成：§!全营1700人。装备：轻武器×930、反坦克导弹×56、便携式防空导弹×20、C&C设备×36、通用载具×45。\n\n摩托化空降步兵连是精锐步兵部队，接受过专门的空降训练，可通过运输机或运输直升机进行伞降作战。他们能够迅速响应远距离突发事件，并可渗透到敌后，在主力部队推进前夺取关键目标。他们的多用途车辆赋予了他们极佳的机动性，使他们能够在空降时携带更多重型装备投入战斗。然而，将他们与车辆一同空降，在后勤保障方面提出了更高的要求。\n\n§G设计师提示：摩托化空降步兵在空降后具备更快的机动速度，并在开阔地形中表现良好。适用于空降部队需要快速扩大战果或快速增援的情景。但与徒步空降部队相比，车辆增加了装备负担，降低了组织度，且在复杂地形中的表现有所削弱。§!"
 Mech_Air_Inf_Bat_desc:0 "§Y编成：§!全营1600人。装备：轻武器×880、反坦克导弹×50、便携式防空导弹×18、C&C设备×32、装甲输送车×32、通用载具×8。\n\n机械化空降步兵连是精锐步兵部队，接受过专门的空降训练，能够从运输机上空降作战。他们可以迅速响应远距离突发事件，并能深入敌后，在主力部队推进前夺取关键目标。他们特制的轻型装甲运兵车赋予了他们极佳的机动性，使他们能够携带比轻型空降部队多得多的重型装备投入战斗。然而，将他们与这些车辆一同空降，对后勤保障的要求也更高。\n\n§G设计师提示：机械化空降步兵为伞降部队提供装甲输送车的防护、速度与更强火力。适用于孤立空降部队着陆后须在机动战斗中生存的场景。然而其组织度较低、装备需求较高，且在复杂地形中受到严重惩罚，是一种昂贵的专业化选择。§!"
 Arm_Air_Inf_Bat_desc:0 "§Y编成：§!全营1600人。装备：轻武器×880、反坦克导弹×50、反坦克导弹发射车×14、便携式防空导弹×18、C&C设备×32、步兵战车×32、通用载具×8。\n\n装甲空降步兵连是精锐步兵部队，接受过专门的空降训练，能够从运输机上空降作战。他们可以快速响应远距离突发事件，并能深入敌后，在主力部队推进前夺取关键目标。他们特制的轻型步兵战车赋予了他们极高的机动性，使他们能够与普通机械化部队势均力敌地作战。然而，将他们连同步兵战车一起空降作战，对后勤保障的要求极高。截至2017年，只有俄罗斯拥有过此类部队。\n\n§G设计师提示：装甲空降步兵通过伞降方式提供步兵战车的火力、装甲与突破能力。适用于争夺设防目标或在插入后对抗敌方机动预备队。但其装备负担极高、组织度低，且在复杂地形中受到惩罚，损失代价高昂。§!"
 L_Marine_Bat_desc:0 "§Y编成：§!全营1500人。装备：轻武器×820、反坦克导弹×56、便携式防空导弹×20、C&C设备×36、通用载具×12。\n\n海军陆战队步兵连是精锐步兵，接受过两栖作战的专门训练，例如渡河、沼泽作战和两栖入侵。由于他们没有车辆，因此可以携带的重型装备数量受到严格限制。\n\n§G设计师提示：海军陆战队步兵提供高组织度与强大的两栖及沼泽作战能力，且不需要车辆。可用于建立滩头阵地并在两栖环境中作战。但登陆后机动速度较慢，占用特种部队容量，且在开阔地形中效能较低。§!"
 Mot_Marine_Bat_desc:0 "§Y编成：§!全营1600人。装备：轻武器×880、反坦克导弹×56、反坦克导弹发射车×14、便携式防空导弹×20、C&C设备×36、通用载具×45。\n\n摩托化海军陆战队步兵连是精锐步兵，接受过两栖作战的专门训练，例如渡河、沼泽作战和两栖入侵。虽然他们下船时是轻步兵，但他们配备了多用途车辆作为陆地运输工具，这赋予了他们极强的机动性，并使他们能够携带大量重型装备投入战斗。\n\n§G设计师提示：摩托化海军陆战队步兵在拥有强大两栖作战加成同时获得了更快的速度，以便从滩头阵地迅速向内陆扩张。适用于登陆部队需快速向纵深推进的场景。但与徒步陆战队相比，车辆增加了装备成本，并降低了组织度和山地作战效能。§!"
 Mech_Marine_Bat_desc:0 "§Y编成：§!全营1750人。装备：轻武器×960、反坦克导弹×56、反坦克导弹发射车×14、便携式防空导弹×20、C&C设备×40、装甲输送车×42、通用载具×8。\n\n机械化海军陆战队步兵连是精锐步兵，接受过两栖作战的专门训练，例如渡河、沼泽作战和两栖入侵。他们乘坐特制的两栖装甲运兵车登陆，在严密保护下行动，具备极强的机动性，能够迅速投入战斗，并携带大量重型装备。\n\n§G设计提示：机械化海军陆战队将两栖作战加成与装甲运兵车防护及登陆后的强大机动性相结合。适用于扩大并坚守机械化滩头阵地。但组织度低于徒步陆战队，且载具在森林和山地地形中表现不佳。§!"
 Arm_Marine_Bat_desc:0 "§Y编成：§!全营1600人。装备：轻武器×880、反坦克导弹×50、反坦克导弹发射车×14、便携式防空导弹×18、C&C设备×32、步兵战车×36、通用载具×8。\n\n装甲海军陆战队步兵连是精锐步兵，接受过两栖作战的专门训练，例如渡河、沼泽作战和两栖入侵。他们驾驶重型装甲喷气式两栖步兵战车，能够长途跋涉穿越水域，并在登陆后迅速从这些战车上投入战斗，展现出极高的作战能力。\n\n§G设计师提示：装甲陆战队提供海军陆战队步兵中最强的步兵战车火力、装甲和城市作战能力，同时保留两栖作战加成。可用于攻击重兵设防的港口。但其组织度低、成本高昂，且在山区和丛林地形中受到严重惩罚，需要轻装部队负责复杂的内陆地形。§!"
 L_Air_assault_Bat_desc:0 "§Y编成：§!全营1500人。装备：轻武器×820、反坦克导弹×56、便携式防空导弹×20、C&C设备×32、运输直升机×24。\n\n空中突击步兵连是精锐步兵部队，他们接受过绳索速降和空中运输的特殊训练，其装备有时会经过专门设计或现场改装，以便更好地在飞机上运输。他们经常被用于夺取和守住尚未完全控制的关键地形，以及直接攻击敌后敌军。\n\n§G设计师提示：空中突击步兵使用运输直升机进行快速行动，并在大多数复杂地形中获得战斗加成。可用于夺取偏远的丘陵、森林、山地、丛林、沼泽或城市地带。但其HP值低、堑壕构筑能力差，且直升机成本高昂，使其难以胜任长时间战线作战。§!"
 air_assault_arty_Bat_desc:0 "§Y编成：§!全营880人。装备：火炮×18、运输直升机×18、C&C设备×12、轻武器×200。\n\n一个整建制的牵引火炮连，通过直升机吊挂方式运输。为空中突击行动提供持续的间接火力支援，借助快速的空中重新部署，保持与空中突击步兵同步推进。\n\n§G设计师提示：空中机动炮兵为直升机编队提供大量软攻击，并在丘陵、山地、森林、丛林和城市地形中表现出色。可用于在复杂地形中支援空中突击部队。但其增加战斗宽度、组织度与兵力值较低，且需昂贵的运输直升机。§!"
 attack_helo_bat_desc:0 "§Y编成：§!全营620人。装备：攻击直升机×18、C&C设备×16。\n\n攻击直升机中队集结大量旋翼武装直升机，以便在广阔的战线上进行快速反装甲打击和近距离支援。\n\n§G设计师提示：攻击直升机可在平原和沙漠地区提供快速的装甲火力支援和强力攻击。它们可用于加强突破或在开阔地形中猎杀装甲目标，但其组织度和战斗力极低、飞机造价昂贵，且在城市、山地、森林和丛林等地形中性能不佳，因此持续作战十分危险。§!"
 armor_Bat_desc:0 "§Y编成：§!全营1400人。装备：主战坦克×44、C&C设备×28、轻武器×350、反坦克导弹×20、便携式防空导弹×10、通用载具×20。\n\n坦克连只装备现存最重型的装甲车辆 - 主战坦克。它们在平坦地形上机动性极佳，并拥有强大的直接火力，旨在撕开敌方前线，以便后续的机械化步兵部队迅速扩大战果。\n\n§G设计师提示：坦克提供高装甲、高突破能力和对装甲目标的强大火力，并在平原和沙漠中拥有优秀加成。可用作进攻先锋。但其消耗昂贵的坦克与指挥装备，组织度低，且在森林、山地、丛林、沼泽和城市地形中受到严重惩罚。§!"
 L_arm_Bat_desc:0 "§Y编成：§!全营1100人。装备：轻型坦克×28、C&C设备×28、轻武器×300、反坦克导弹×10、通用载具×10。\n\n轻型坦克连装备特制的轻型坦克，这些坦克通常为轮式，兼具惊人的机动性和强大的火力。它们能够与各种类型的步兵进行正面交锋。然而，直接作战并非它们的首要任务 - 它们渗透到敌方附近，观察并汇报敌方行动，并利用无人机侦察和电子监视收集情报。它们还可以对敌方重要资产和机械化部队进行突袭和伏击。\n\n§G设计师提示：轻型坦克能提供快速装甲火力，在平原和沙漠中拥有强大攻击力。可用于武装侦察和扩大战果。但其防护和正面作战能力较薄弱，且复杂地形会大幅削弱其效能。§!"
 A_L_arm_Bat_desc:0 "§Y编成：§!全营1000人。装备：轻型坦克×18、C&C设备×24、轻武器×250、通用载具×8。\n\n轻型坦克连配备特殊的高速轻型坦克（常为轮式），兼具卓越的机动性与令人震撼的火力。它们在正面战斗中足以对抗各类步兵。然而，直接战斗并非其主要任务 - 它们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。它们也可对敌方重要资产和机械化编队执行突袭和伏击任务。这些单位还能够与伞兵部队协同实施空降作战，提供即时的伴随装甲支援。\n\n§G设计师提示：空降轻型坦克为空降编队提供插入后的机动装甲与反车辆火力。可用于支援空降部队在开阔地形中对抗敌方机动力量。但专用车辆成本高昂，且在山区、丛林、沼泽和城市地形中受到严重惩罚。§!"
 Arty_Bat_desc:0 "§Y编成：§!全营1500人。装备：火炮×18、C&C设备×24、通用载具×36、轻武器×300。\n\n火炮凭借其强大的间接火力，能够在战场上按需提供持续的精确打击，射程远超目视范围。炮组人员可直接装填弹药。由于火炮需要外部载具移动，因此在两次打击之间难以快速移动，容易受到敌方炮兵的反击。轻型小口径火炮系统可手动拖拽，并且由于可以装入运输机，因此也适用于空降作战。\n\n§G设计师提示：炮兵连提供大量对人员攻击，并可空降部署，对以步兵为主的部队效果显著。可用于为徒步编队提供进攻火力。但组织度与HP较低、增加战斗宽度，且在复杂地形中机动受限，需有足够步兵提供掩护。§!"
 SP_Arty_Bat_desc:0 "§Y编成：§!全营1400人。装备：自行火炮×18、C&C设备×24、通用载具×24、轻武器×250。\n\n凭借其强大的间接火力，自行火炮能够在战场上按需提供持续精准打击，射程远超目视范围。它可由乘员直接装填弹药，其自推进系统使其具备机动性，能够灵活移动以躲避敌方炮火的反击。\n\n§G设计者提示：自行火炮连拥有强大的软攻击能力，能够跟上装甲部队的步伐，尤其擅长在平原作战。它可以用来突破步兵密集的防线，但其组织度低、战斗宽度增加、底盘造价昂贵以及在崎岖地形作战的劣势，使其需要在装甲防护和开阔地带作战。§!"
 SP_R_arty_Bat_desc:0 "§Y编成：§!全营1250人。装备：多管火箭系统×18、C&C设备×24、通用载具×24、轻武器×250。\n\n火箭炮连使用多管火箭发射系统，能够从远距离上对整片区域实施毁灭性打击。主要用于打击敌方纵深区域，因其火力散布较大，不适合用于战场的精确打击。它需要专用再装填车辆，且装填时间较长。\n\n§G设计师提示：多管火箭炮连提供极高的软攻击与突破能力，同时在开阔地形中能与机动编队保持同步。可用于集中进攻火力。但其组织度低、增加战斗宽度、需昂贵的火箭发射车辆，且在山区、丛林、沼泽和城市地形中表现不佳。§!"
 SP_AA_Bat_desc:0 "§Y编成：§!全营1100人。装备：自行防空炮×18、C&C设备×24、通用载具×24、轻武器×200。\n\n防空炮兵连将使用自行式短程或中程防空导弹系统，保护其部队免受敌方近距离空中支援打击。\n\n§G设计师提示：自行防空车可提供强大的空中攻击能力，并为装甲部队提供机动防护。当敌机威胁到重要的先锋部队时，应使用自行防空车。但它会增加作战宽度，需要专用车辆，对地火力贡献有限，并且在山地、丛林和沼泽地带机动性较差。§!"
 L_Ranger_Bat_desc:0 "§Y编成：§!全营1400人。装备：轻武器×770、反坦克导弹×50、便携式防空导弹×16、C&C设备×32、通用载具×32、通用载具×15。\n\n游骑兵是精锐轻步兵，专门执行突袭、直接行动以及主力部队之前的快速部署任务。他们轻装行军，以最大限度地提高机动性和突袭效果，夺取关键目标并坚守至常规部队抵达。其代价是重型装备匮乏，在开阔地形中面对装甲力量时较为脆弱。\n\n§G设计师提示：游骑兵将高组织度与卓越的复杂地形加成整合于较小的战斗宽度之内。可用于精锐山地、森林、丛林、沼泽或城区编队。但训练时间长、受特种部队容量限制，且重型装备有限，使其大规模部署成本高昂，且在平原地形中易受攻击。§!"
 L_Marine_Cdo_Bat_desc:0 "§Y编成：§!全营1500人。装备：轻武器×820、反坦克导弹×50、便携式防空导弹×16、C&C设备×32、通用载具×32、通用载具×12。\n\n海军陆战队突击队连是规模较大的海军陆战队突击队单位，接受过执行突袭和游击作战以及其他轻步兵任务的训练。\n\n§G设计师提示：海军陆战队突击队将高组织度与卓越的两栖、沼泽、森林和城市攻击能力相结合。可用于精英突袭和对激烈争夺地区的登陆作战。但其受特种部队容量限制、训练周期长、仅拥有轻型装备，且在开阔地形中攻击较弱，限制其大规模部署。§!"
 Special_Forces_desc:0 "§Y编成：§!全营1250人。装备：轻武器×1000、反坦克导弹×24、便携式防空导弹×12、C&C设备×40、通用载具×24。\n\n特种作战部队是任何军队中的精锐，接受比其他任何兵种更漫长、更严苛的训练。他们是复杂地形、空降作战和两栖登陆的专家。然而，由于可能需要在战线后方保持机动性，他们的装备通常较为轻便。\n\n§G设计师提示：特种作战部队提供极高组织度、恢复力与广泛的地形加成，并具备空降和海岸撤离能力。可用于最艰巨的突袭和激烈争夺中的目标。但其战斗宽度较大、训练时间极长、受特种部队容量限制，且装备轻便，不适合作为普通战线步兵使用。§!"
 combat_service_support_company_desc:0 "§Y编成：§!全营350人。装备：C&C设备×60、通用载具×30、轻武器×300。\n\n师级后勤与医疗人员负责协调补给分配、伤员后送及兵员补充。\n\n§G设计师提示：战斗勤务支援减少补给与燃料消耗，同时通过伤员救援保存人力与单位经验。适用于大编制、经验丰富或高补给需求的部队。但其增加战斗宽度与装备需求，并且直接作战能力极弱。§!"
 helicopter_combat_service_support_desc:0 "§Y编成：§!全营250人。装备：运输直升机×20、C&C设备×40。\n\n直升机搭载的后勤与医疗分队为快速部署的部队提供持续保障，并从前方阵地后送伤员。\n\n§G设计师提示：直升机战斗勤务支援提供更高的伤员恢复率，以及更强的补给与燃料节省效果，且人力需求低于地面支援。适用于高成本的空中机动或快速编队。但运输直升机成本高昂，增加战斗宽度，且战斗贡献极小。§!"
 combat_maintenance_company_desc:0 "§Y编成：§!全营250人。装备：C&C设备×40、通用载具×20、轻武器×200。\n\n维修连负责维持编队中车辆和重型装备的作战状态，执行战场抢修并在受损平台彻底报废前将其回收。通过在靠近前线的位置修复战斗中损坏的车辆，它能够在持久作战中维持装甲力量，并减少战损消耗。\n\n§G设计师提示：维修连提升可靠性、恢复率和装备缴获能力，适用于载具密集型部队。可用于在长时间行动中控制损耗并保存昂贵装备。但其增加战斗宽度、人力和通用车辆需求，且直接火力贡献有限。§!"
 airmobile_maintenance_company_desc:0 "§Y编成：§!全营250人。装备：运输直升机×20、C&C设备×40、轻武器×200。\n\n一支为支援空中机动和直升机部队而配置的维修分队，配备更轻便、更易于运输的工具，以维持旋翼机和快速部署部队的作战状态。它在前沿区域修复受损装备，保障远距离固定基地之外的空中突击作战节奏。\n\n§G设计师提示：空中机动维修连提升装备缴获能力与可靠性，同时能与直升机编队保持同步。可用于维护昂贵的旋翼机装备。但其恢复率低于地面维修单位，增加战斗宽度，且需要大量运输直升机。§!"
 L_Engi_Comp_desc:0 "§Y编成：§!全营200人。装备：轻武器×120、C&C设备×12、通用载具×12。\n\n工兵负责临时桥梁和防御工事的建设、布雷和排雷，以及炸弹处理。他们携带基本的步兵武器，用于防御。\n\n§G设计师提示：工兵连可以提升战壕构筑能力，协助步兵在堡垒、城市、森林和沼泽地带进行攻防，并改善山地作战的防御和机动性。它们可以部署在防御型或崎岖地形师中，但其主要作用是增加战斗宽度、人力和装备，而直接火力贡献有限。§!"
 H_Engi_Comp_desc:0 "§Y编成：§!全营300人。装备：轻武器×200、C&C设备×20、通用载具×20、主战坦克×4。\n\n工兵负责临时桥梁和防御工事的建设、布雷和排雷，以及炸弹处理。他们携带基本的步兵武器用于防御。凭借专用的工程和救援车辆，他们能够有效地从前线回收战斗中损坏的装备。\n\n§G设计师提示：重型工兵连比普通工兵连拥有更强的工事构筑能力，以及在要塞、城市、山地和沼泽地带的加成。它们非常适合用于进攻或防御阵型，但由于其庞大的人力和装备需求，成为一种昂贵的支援选择。§!"
 communications_company_desc:0 "§Y编成：§!全营150人。装备：C&C设备×100、轻武器×100、通用载具×10。\n\n通信连维护维系编队整体运转的无线电、数据和指挥网络，确保命令与报告在战场上可靠流通。强大的通信能力提升协同作战能力和反应速度，并增强编队对抗干扰和电子破坏的韧性。\n\n§G设计师提示：通信连提升前线营的组织度、恢复速度和主动性。适合配置于大编制或昂贵的战斗部队中，以发挥协同优势，但其增加战斗宽度，且需大量指挥装备，直接火力贡献有限。§!"
 military_police_attachment_desc:0 "§Y编成：§!全营250人。装备：C&C设备×100、轻武器×200。\n\n宪兵负责交通管制、后方区域安全及战俘管理，使前线部队能够专注于作战任务。通过维持补给线路的有序运行、保障后方免受渗透者和散兵游勇的威胁，他们维护军纪，确保编队运转顺畅。\n\n§G设计师提示：宪兵提升步兵的镇压能力，并额外增加镇压效果，且不占用战斗宽度。可用于占领区和后方安全部队编制。但对前线战斗部队的价值有限。§!"
 pathfinder_company_desc:0 "§Y编成：§!全营80人。装备：C&C设备×50、轻武器×100。\n\n精英伞兵小组，受过在空降行动实施前先行跳伞的专门训练，负责寻找最安全的降落区和集结地域。这些精锐士兵在任何空降或空中突击行动的关键阶段提供至关重要的指挥与控制能力。\n\n§G设计师提示：探路者伞兵小组提升空降步兵的组织度与软攻击，并可通过伞降部署。可用于加强空降或空中突击部队。但其增加战斗宽度，仅能用于特定部队，且直接作战能力有限。§!"
 L_Ranger_Recce_Comp_desc:0 "§Y编成：§!全营120人。装备：轻武器×80、反坦克导弹×8、便携式防空导弹×4、C&C设备×8。\n\n一支从游骑兵中抽调的侦察分队，受过徒步深入敌后渗透和报告敌方动向的训练。他们将隐蔽行动与无人机侦察和电子监视相结合，收集情报并为友军火力标示目标，并可在机会出现时执行有限的突袭和伏击行动。\n\n§G设计师提示：游骑兵侦察提供侦察与主动性加成，同时提升炮兵软攻击能力，并在复杂地形中表现出色。可用于需要精英侦察兵的特种部队编队。但其增加战斗宽度、占用特种部队容量，且直接火力贡献有限。§!"
 Drone_Recce_Comp_desc:0 "§Y编成：§!全营80人。装备：轻武器×50、通用载具×5、C&C设备×25、陆上无人机装备×25。\n\n通过使用小型无人机系统将侦察范围扩展到视距之外，无人侦察排能够在不使侦察兵暴露于直接火力之下的情况下，提高战场态势感知能力。这些无人机能够快速侦察路线、识别敌方位置，并在复杂地形中确认目标，从而加快决策速度并提高火力打击的精准度。\n\n§G设计师提示：无人机侦察提供高侦察与主动性加成，强化其他侦察单位的效果，并提升炮兵攻击能力。适用于能够承担无人机的机动或装甲部队。但其增加战斗宽度与补给消耗，降低堑壕构筑能力，且在城区和山地地形中表现不佳。§!"
 Sniper_company_desc:0 "§Y编成：§!全营80人。装备：轻武器×50、C&C设备×25。\n\n狙击排由两名精准射手组成，他们以观察员两人一组的形式协同作战，能够对敌方军官、机组人员和通信小组等高价值目标进行远程选择性射击。他们擅长从隐蔽处骚扰和扰乱敌方阵型，削弱敌方作战效能，同时保持自身难以被发现和攻击。\n\n§G设计师提示：狙击排提供软攻击、侦察加成，并提升侦察单位主动性与炮兵单位火力。可用于对抗步兵及改善战场协调。但其增加战斗宽度，且突破、硬攻击与穿甲能力极弱。§!"
 Light_Mech_Inf_Bat_desc:0 "§Y编成：§!全营300人。装备：装甲输送车×30。\n\n一支轻编机械化分队使用少量装甲运兵车来加强编制，而无需占用正常战斗宽度。\n\n§G设计师提示：轻编机械化步兵提供装甲输送车防护与防御加成，且不占用战斗宽度。可用于在平原、丘陵或城市地形中加强符合条件的编队。但其车辆成本、低HP值，以及在山地、丛林、沼泽、河流和两栖地形中受到严重惩罚，限制了其独立作战价值。§!"
 Light_Arm_Inf_Bat_desc:0 "§Y编成：§!全营320人。装备：步兵战车×30。\n\n一支轻编装甲步兵分队使用少量步兵战车，在不占用正常战斗宽度的情况下，为部队提供装甲防护与火力支援。\n\n§G设计师提示：轻编装甲步兵提供步兵战车的装甲与火力加成，且不占用战斗宽度，在平原和沙漠中表现最佳。可用于加强高价值编队。但其组织度低、车辆昂贵，且在复杂地形、河流和两栖行动中受到严重惩罚，是一种高度专业化的编制。§!"
 Light_L_Air_assault_Bat_desc:0 "§Y编成：§!全营250人。装备：运输直升机×30。\n\n空中突击步兵是精锐步兵，接受过绳降和空中运输专项训练，其装备有时经过专门设计或战地改装，以便更好地在飞机内运输。他们常被用于夺取并坚守尚未完全控制的关键地形，并在敌后直接与敌军交战。\n\n§G设计师提示：这类轻编空中突击分队提供组织度加成，并在城区、山地、森林、丛林和沼泽地形中获得强大加成，且不占用战斗宽度。可用于在复杂地形中加强专业化编队。但其直升机需求成本高昂，且在平原、沙漠和两栖攻击中表现不佳。§!"
 Light_attack_helo_bat_desc:0 "§Y编成：§!全营95人。装备：攻击直升机×9。\n\n一支小型攻击直升机分队提供快速的武装直升机支援，而无需投入整个团的规模。\n\n§G设计师提示：小编制攻击直升机提供快速的装甲火力支援，不占用战斗宽度，在平原与沙漠地形中表现出色。可用于紧凑型机动支援任务，但其组织度与兵力值极低、飞机造价昂贵，且在山区、丛林、沼泽和城市地形中受到严重惩罚，损失难以承受。§!"
 Light_armor_Bat_desc:0 "§Y编成：§!全营95人。装备：主战坦克×21。\n\n一支轻编坦克分队集中少量主战坦克，在不占用正常战斗宽度的情况下对编制进行加强。\n\n§G设计师提示：轻编坦克提供装甲、突破能力以及在平原和沙漠中的强力攻击加成，且不占用战斗宽度。可用于以较低成本加强进攻编队。但其组织度与HP值低、坦克成本高昂，且在复杂地形和城区中受到严重惩罚，不适合作为通用支援手段。§!"
 Light_L_arm_Bat_desc:0 "§Y编成：§!全营95人。装备：轻型坦克×21。\n\n一支轻编轻型坦克分队以较小的车辆规模，提供机动反装甲火力和武装侦察能力。\n\n§G设计师提示：轻编轻型坦克提供机动反装甲火力，且不占用战斗宽度，在平原和沙漠中表现出色。可用于加强快速编队以对抗敌方车辆。但其HP值低、专用底盘昂贵，且在复杂地形、河流和两栖行动中受到严重惩罚，灵活性受限。§!"
 Light_SP_Arty_Bat_desc:0 "§Y编成：§!全营95人。装备：自行火炮×9。\n\n一支规模较小的自行火炮部队可以用比一个完整营更少的车辆进行机动间接火力射击。\n\n§G设计者提示：轻编自行火炮无需增加战斗宽度即可提供机动性软攻击，在平原、沙漠和城市环境中表现尤为出色。它可用于紧凑型进攻支援，但组织度极低、战斗力弱、底盘成本高昂，且在森林、山地和丛林环境中性能较差。§!"
 Light_SP_R_arty_Bat_desc:0 "§Y编成：§!全营95人。装备：多管火箭系统×9。\n\n轻编多管火箭炮分队以少于整营的车辆数量，提供集中的区域火力打击。\n\n§G设计提示：轻编火箭炮提供强大的机动软攻击，且不占用战斗宽度，在平原、沙漠和城市地形中表现出色。可用于加强进攻编队。但其组织度微不足道、兵力值低、火箭发射车辆成本高昂，且在复杂地形中受到惩罚，需要其他单位提供掩护。§!"
 Light_SP_AA_Bat_desc:0 "§Y编成：§!全营60人。装备：自行防空炮×9。\n\n一支轻编自行防空分队以少量机动防空系统为编制提供防护。\n\n§G设计师提示：轻编自行防空提供对空攻击加成，且不占用战斗宽度，人力需求较低。可用于为机动编队提供紧凑型防空掩护，抵御敌方空中力量。但其组织度几乎为零、HP值低，且需专用防空车辆，地面火力贡献有限。§!"
 Arty_Battery_desc:0 "§Y编成：§!全营200人。装备：轻武器×40、火炮×6、C&C设备×6。\n\n火炮拥有强大的间接火力，能够在战场上按需提供持续的精确打击，射程远超目视范围。炮组人员可直接装填弹药。由于火炮需要外部载具移动，因此在两次打击之间难以快速移动，容易受到敌方炮兵的反击。轻型小口径火炮系统可以手动拖拽，并且由于可以装入运输机，因此也适用于空降作战。\n\n§G设计师提示：炮兵排在不增加战斗宽度的情况下，以远低于完整炮兵连的装备成本提供软攻击力。可将其作为符合条件的步兵部队的经济火力支援，但其极低的组织度和崎岖地形惩罚限制了其在缺乏支援或机动性极高的师中的应用价值。§!"
 SP_R_arty_battery_desc:0 "§Y编成：§!全营200人。装备：轻武器×40、多管火箭系统×6、C&C设备×6、通用载具×6。\n\n利用多管火箭炮，一个火箭炮排可以从远处摧毁目标区域。由于其无差别射击的特性，不适合在战场上进行精确打击，因此常用于攻击敌方后方区域。此外，它需要专用的装填车辆，且装填速度较慢。\n\n§G设计者提示：多管火箭炮排能够提供强大的机动软攻击能力和一定的突破能力，但并不占用作战宽度。它可以用于机动师或装甲师的紧凑型进攻支援，但火箭炮车辆造价昂贵，续航能力差，且在山地和沼泽地带机动性下降。§!"
 SP_arty_battery_desc:0 "§Y编成：§!全营250人。装备：轻武器×40、自行火炮×6、C&C设备×6、通用载具×6。\n\n凭借其强大的间接火力，自行火炮能够在战场上按需提供持续精准打击，射程远超敌方目视范围。它可由乘员直接装填弹药，其自推进系统使其具备机动性，能够灵活移动以躲避敌方炮火的反击。。\n\n§G设计者提示：自行火炮排可在不增加战斗宽度的情况下提供机动性软攻击能力。可将其用作机动部队、装甲部队、海军陆战队或民兵部队的紧凑型火力支援，但其专用底盘比牵引式火炮成本更高，且在山地、丛林和沼泽地带的机动性较差。§!"
 SP_AA_Battery_desc:0 "§Y编成：§!全营200人。装备：轻武器×40、自行防空炮×6、C&C设备×6、通用载具×6。\n\n防空排将使用自行式短程或中程防空导弹系统，保护本单位免受敌方近距离空中支援打击。\n\n§G设计师提示：自行防空排具备机动空中攻击能力，但不增加战斗宽度。可用于在敌方空域保护机动部队、装甲部队或海军陆战队，但其专用底盘对地面部队作用有限，且在山地和沼泽地带机动性较差。§!"
 air_assault_arty_battery_desc:0 "§Y编成：§!全营150人。装备：轻武器×40、火炮×6、运输直升机×6、C&C设备×6。\n\n这些部队使用牵引式火炮，通过吊挂火炮来提高机动性，从而能够跟上速度更快的空中机动步兵部队。\n\n§G设计者提示：空中机动炮兵排在不增加战斗宽度的情况下提供软攻击能力，在丘陵、山地、森林、丛林和城市中表现最佳。可将其用作空中机动或海军陆战队编队的紧凑型火力支援，但其对直升机和火炮的需求成本较高，且在平原和沙漠地区作战能力较弱。§!"
 armor_Comp_desc:0 "§Y编成：§!全营140人。装备：主战坦克×14、C&C设备×8。\n\n坦克排仅配备现存最重型的装甲车辆 - 主战坦克。它们在平坦地形上机动性极佳，并拥有强大的直接火力，旨在撕开敌方前线，以便后续的机械化步兵部队迅速扩大战果。\n\n§G设计师提示：坦克连提供装甲、突破能力和机动火力，且不占用战斗宽度。可用于加强符合条件的步兵或机动编队，以进行开阔地形作战。但其坦克与指挥装备成本高昂，且在山区、丛林和沼泽地形中速度下降、攻击效能不佳。§!"
 attack_helo_comp_desc:0 "§Y编成：§!全营100人。装备：攻击直升机×4、C&C设备×4。\n\n攻击直升机小队为前线部队提供快速武装直升机支援和机动反装甲火力。\n\n§G设计师提示：攻击直升机小队可在不增加战斗宽度的情况下，快速提供装甲火力支援。可将其灵活用于步兵、机动部队、装甲部队或海军陆战队，但飞机和指挥设备造价昂贵，且在城市和丛林环境中攻击效果较差。§!"
 drone_tactical_company_desc:0 "§Y编成：§!全营80人。装备：轻武器×40、C&C设备×16、通用载具×8、陆上无人机装备×120。\n\nFPV无人机连使用FPV固定翼无人机和四旋翼无人机，执行侦察与精确打击任务，为前线部队提供支援。\n\n§G设计师提示：FPV无人机连提供高效的对人员攻击与对装甲攻击加成，且不占用战斗宽度，并可空降部署。可为能够提供地面无人机补给的部队作为灵活火力支援。但其组织度几乎为零，且需要大量无人机装备，持续作战能力有限。§!"
 Militia_Recce_Comp_desc:0 "§Y编成：§!全营80人。装备：轻武器×40、C&C设备×4、通用载具×4。\n\n民兵侦察连使用通用车辆和有限通信设备，在民兵编队前方执行侦察任务。他们提供对敌方阵地（尤其是建成区地形）的低成本侦察。\n\n§G设计师提示：民兵侦察提供侦察与主动性加成，且不占用战斗宽度，在城市和超大城市中表现尤为出色。可用于以低成本改进民兵战术。但仅限于民兵部队使用，且直接作战能力贡献有限。§!"
 L_Recce_Comp_desc:0 "§Y编成：§!全营150人。装备：轻武器×100、反坦克导弹×10、便携式防空导弹×5、C&C设备×10。\n\n步兵侦察连以徒步方式行动，因此缺乏使其成为有效战斗部队的重型装备。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行有限的突袭和伏击任务。侦察连常被称为“中队”，源自其前身为骑兵部队的传统。\n\n§G设计师提示：步兵侦察部队提供侦察与主动性加成，且不占用战斗宽度，同时在森林、山地、丛林和丘陵地形中获得小幅加成。适用于徒步步兵、空降、空中突击、海军陆战队或特种部队单位。但其人力需求高于其他侦察单位，且火力加成有限。§!"
 Mot_Recce_Comp_desc:0 "§Y编成：§!全营120人。装备：轻武器×80、反坦克导弹×8、便携式防空导弹×8、C&C设备×8、通用载具×8。\n\n摩托化侦察连使用通用车辆，装备与步兵侦察连大致相同，但任务角色有所不同。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行有限的突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：摩托化侦察提供比徒步侦察更高的侦察与主动性加成，且能与机动编队混编，并在开阔地形中提供额外机动性。适用于摩托化步兵或海军陆战队。但车辆配备增加了成本，且在山区、丛林和沼泽地形中速度下降。§!"
 Mech_Recce_Comp_desc:0 "§Y编成：§!全营100人。装备：轻武器×60、反坦克导弹×6、反坦克导弹发射车×6、便携式防空导弹×6、装甲输送车×6、C&C设备×6。\n\n机械化侦察连使用装甲运兵车，装备与步兵侦察连大致相同，但任务角色有所不同。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行有限的突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：机械化侦察提供高侦察与主动性加成，且不占用战斗宽度，同时能与装甲输送车编队混编，并提高在平原上的移动速度。适用于装甲部队或海军陆战队。但装甲运兵车与支援装备成本较高，且在山区和沼泽地形中速度下降。§!"
 Arm_Recce_Comp_desc:0 "§Y编成：§!全营80人。装备：轻武器×40、反坦克导弹×4、反坦克导弹发射车×4、便携式防空导弹×4、步兵战车×4、C&C设备×4。\n\n重型机械化侦察连使用步兵战车，装备与装甲步兵大致相同，但任务角色有所不同。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：重型机械化侦察提供高侦察与主动性加成，并有步兵战车防护，且不占用战斗宽度。适用于在平原或沙漠地带作战的装甲部队或海军陆战队。但步兵战车成本高昂，且在森林、山地、丛林和沼泽地形中速度下降。§!"
 armor_Recce_Comp_desc:0 "§Y编成：§!全营120人。装备：轻型坦克×8、C&C设备×8。\n\n装甲侦察排装备特制侦察轻型坦克，这些坦克兼具惊人的机动性和强大的火力。它们能够与各种类型的步兵进行正面交锋。然而，正面交锋并非其主要任务 - 它们渗透到敌方附近，观察并汇报敌方活动，并利用无人机侦察和电子监视收集情报。它们还可以对敌方重要资产和机械化部队进行突袭和伏击。由于侦察连队曾是骑兵部队，因此通常被称为“中队”。\n\n§G设计师提示：装甲侦察连在常规侦察单位中提供最高的侦察与主动性加成，同时增加反装甲机动性，且不占用战斗宽度。适用于开阔地形中的坦克编队。但侦察坦克与指挥装备成本高昂，且在森林、山地、丛林和沼泽地形中速度大幅下降。§!"
 Weapons_company_desc:0 "§Y编成：§!全营120人。装备：轻武器×150、反坦克导弹×10、C&C设备×10。\n\n一个由直射步兵支援武器组成的武器连，包括通用机枪和重机枪小组、榴弹机枪小组及其他重型步兵直射支援武器。该连旨在为所配属支援的任何步兵单位提供伴随火力支援，适用于广泛的部队类型。\n\n§G设计师提示：武器连提供广泛的直射属性加成，尤其是穿甲能力，且不占用战斗宽度。可用于加强通用步兵。但其对步兵装备需求较大，且降低堑壕构筑能力，使其对廉价的静态防御部队不太有吸引力。§!"
 Heavy_mortar_company_desc:0 "§Y编成：§!全营120人。装备：轻武器×120、C&C设备×9、通用载具×15。\n\n迫击炮旨在为前线部队提供快速、一体化的火力支援，无需上级单位配属。这些迫击炮为前线单位提供间接火力支援，其成本远低于整建制炮兵部队。\n\n§G设计师提示：迫击炮连无需火炮装备或作战宽度即可提供强大的软攻击力。可将其用作对步兵的廉价一体化火力支援，但其硬攻击力和穿透力较弱，且会削弱工事的构筑能力。§!"
 AT_company_desc:0 "§Y编成：§!全营120人。装备：轻武器×90、反坦克导弹×18、C&C设备×9。\n\n反坦克排配备步兵反坦克武器，专为与轻步兵部队协同作战而设计。他们能够轻松地在城区、森林和其他防御工事完善或地形狭窄的区域作战，不仅能够轻易攻击敌方装甲部队，还能迅速撤回己方防御工事。\n\n§G设计师提示：步兵反坦克提供高对装甲攻击与穿甲能力，且不占用战斗宽度，适用于徒步、空降、海军陆战队和特种部队编队。可在这些部队需要抵御装甲力量时使用。但会削弱其他战斗属性，并增加专用装备成本。§!"
 Mot_AT_company_desc:0 "§Y编成：§!全营200人。装备：轻武器×180、反坦克导弹发射车×18、C&C设备×18、通用载具×6。\n\n专门用于反坦克作战的炮兵连，其火力部署在车辆上。该连的设计侧重于速度，使其能够跟上快速移动的机动部队和装甲部队，同时仍具备强大的反坦克能力。\n\n§G设计师提示：车载反坦克提供高对装甲攻击与穿甲能力，且不会降低机动编队的速度。可用于面临坦克威胁的摩托化、装甲、空降或海军陆战队部队。但重型反坦克武器与通用车辆使其成本更高，且对软目标杀伤有限。§!"
 AA_company_desc:0 "§Y编成：§!全营120人。装备：轻武器×90、便携式防空导弹×18、C&C设备×18。\n\n一支专门用于打击敌方空中单位、提供针对敌方直升机及其他飞机防御能力的分队。\n\n§G设计师提示：防空连提供强大的对空攻击能力，且不占用战斗宽度。可用于保护在敌方空中力量威胁下行动的部队。但在地面战斗中较为薄弱，且需消耗专用防空装备，在制空权稳固时价值有限。§!"
 Combat_engineer_company_desc:0 "§Y编成：§!全营150人。装备：轻武器×100、C&C设备×10、通用载具×10。\n\n战斗工兵执行进攻性工程作业，为前线部队提供直接支援。他们受过训练并配备相应装备，能够穿越河流或反坦克壕沟等复杂地形。他们还具备突破雷场或其他防御障碍的能力，并负责清除区域，使后续作战部队能够畅通无阻地通过。\n\n§G设计师提示：战斗工兵提供防御与突破加成，并在森林、山地、丛林和城市地形中获得适度的攻击与防御加成，且不占用战斗宽度。可用于穿越复杂地形的突击行动。但其需要大量步兵装备，且在开阔地形中优势较低。§!"
 amphibious_landing_detachment_desc:0 "§Y编成：§!全营150人。装备：C&C设备×10、轻武器×100、通用载具×10、反坦克导弹发射车×5。\n\n从海军配属的支援单位，旨在实现快速高效的两栖登陆作战。这些单位配备专用登陆舰艇和装备，能够快速实施舰对岸或远距离登陆行动。然而，配属此类单位将降低执行非两栖作战任务的能力。\n\n§G设计师提示：海军登陆附属部队大幅提升海军陆战队编队的两栖攻击、防御和机动能力。可用于专门负责抢滩突击的部队。但其增加战斗宽度、人力和装备需求，并在几乎所有的陆地地形中施加严重的作战惩罚。§!"
