 ZZZ_nodecheck:0 "关键节点检查（战争/事件）"
 ZZZ_nc_ru_status:0 "俄乌/北约：状态检查"
 ZZZ_nc_ru_status_desc:0 "把俄乌与北约相关的旗标、战争状态写进游戏日志。"
 ZZZ_nc_ru_status_tt:0 "用途：输出 SOV-UKR、SOV-USA 战争状态、USA_federal_paralysis_global，以及当前俄乌开战路径（2024 普京线 / 入约线），含领袖判定、2024.1.1 日期门与乌克兰是否持有 NATO_member 标志。提示：北约解体节点未实现，只能看到旗标。"
 ZZZ_nc_eur_status:0 "欧陆：状态检查"
 ZZZ_nc_eur_status_desc:0 "输出欧陆战争的全部旗标到游戏日志。"
 ZZZ_nc_eur_status_tt:0 "用途：检查 ongoing/begins/nato_victory/csto_victory/stalemate/resolved 与 DSW 欧战旗标，结果写 log。"
 ZZZ_nc_gaw_status:0 "GAW：状态检查"
 ZZZ_nc_gaw_status_desc:0 "输出 GAW 相关旗标与 CHI-JAP 战争状态。"
 ZZZ_nc_gaw_status_tt:0 "用途：检查 pan_asian_war_ongoing / GAW_soon / 两个 settled / korean_confederation_formed / JAP-CHI 战争，结果写 log。"
 ZZZ_nc_usa_status:0 "美国：脑死亡状态检查"
 ZZZ_nc_usa_status_desc:0 "输出脑死亡三旗标与北约成员状态。"
 ZZZ_nc_usa_status_tt:0 "用途：检查 USA_federal_paralysis_global / USA_federal_paralysis_flag / USA_government_shutdown_flag / USA 是否仍持 NATO_member，结果写 log。北约解体节点未实现。"
 ZZZ_nc_balkan_status:0 "巴尔干：状态检查"
 ZZZ_nc_balkan_status_desc:0 "输出联邦旗标、自治状态与北约/欧盟成员身份。"
 ZZZ_nc_balkan_status_tt:0 "用途：检查 balkan_subject_agree / autonomy_balkan_federation / NATO_member / EU 理念，结果写 log。提示：巴尔干各国专属选举排期未实现，只有通用选举链。"
