 #VEN_nicolas_maduro_char: "尼古拉斯·马杜罗"
 #VEN_nicolas_maduro_char_desc: "尼古拉斯·马杜罗·莫罗斯并非出生在权力之中，周围环绕着金山银山。他出生在加拉加斯的一个中产阶级家庭，完全不知道他未来的决定会带他走向何方。\n\n他的父亲是左翼激进分子，他与当局的麻烦历史成为尼古拉斯效仿的榜样，后者在青少年时期就开始尝试革命和阶级斗争的思想。他没有上大学，而是开始在加拉加斯地铁担任卑微的公交车司机，同时仍然是他的工会的宝贵成员。1992年乌戈·查韦斯发动失败的政变时，他的人生发生了巨大转折。1999年查韦斯赢得总统选举时，马杜罗成为国民议会的议员。他的忠诚使他在查韦斯的内阁中获得一席之地，并最终在2012年成为他的副总统。\n\n查韦斯当时患有癌症，他知道自己时间不多了，所以公开宣布如果他去世，马杜罗将接替他的职位。他确实去世了，从那时起情况一天比一天糟糕。马杜罗的总统任期以物资匮乏、饥饿、政治动荡、苦难和不稳定为标志。蹂躏他国家的人道主义危机证明他在履行保护人民的誓言方面相当低效。无论他多么努力，越来越多的人反对他，在他曾经作为卑微活动家游行的街道上与他战斗。\n\n随着每一天的过去，他变得越来越专制，拼命想在一个不断崩溃的国家中保住权力。他这样做是为了维护查韦斯和玻利瓦尔革命的遗产，但这些努力似乎徒劳无功，就像试图重建一堆烧毁、破碎的玻璃一样。"