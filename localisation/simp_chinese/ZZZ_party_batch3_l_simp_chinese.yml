l_simp_chinese:
 zzz_party.120.t:0 "迦太基的新总统"
 zzz_party.120.d:0 "独立候选人凯斯·赛义德在 2019 年总统选举中胜出，突尼斯的政治版图被反建制力量重塑。"
 zzz_party.120.a:0 "接受这一结果"
 zzz_party.123.t:0 "秘鲁：乡村教师的胜利"
 zzz_party.123.d:0 "乡村教师出身的卡斯蒂略在 2021 年总统选举第二轮胜出，利马的政治重心转向左翼。"
 zzz_party.123.a:0 "接受这一结果"
 zzz_party.124.t:0 "利马的政治危机"
 zzz_party.124.d:0 "卡斯蒂略被弹劾，副总统博卢阿特接任总统。秘鲁由技术官僚主导的过渡政府掌权。"
 zzz_party.124.a:0 "接受这一结果"
