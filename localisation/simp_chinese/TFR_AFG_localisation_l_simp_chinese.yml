l_simp_chinese:
 #烈焰升腾 阿富汗内战事件链（移植版）
 afghanistan.1.t: "美国和平协议生效"
 afghanistan.1.d: "多哈协议签署后，美军开始分阶段撤离，喀布尔政府与塔利班之间的停火在猜忌中勉强维持。"
 afghanistan.1.a: "和平终于到来？"
 afghanistan.2.t: "塔利班撕毁停火"
 afghanistan.2.d: "塔利班指责喀布尔拖延释放囚犯，宣布发动全面攻势。停火线在一夜之间化为战场。"
 afghanistan.2.a: "内战重新点燃"
 afghanistan.3.t: "阿富汗伊斯兰酋长国宣告复辟"
 afghanistan.3.d: "塔利班在其控制的省份宣布重建伊斯兰酋长国，向全国武装力量发出归附号召。"
 afghanistan.3.a: "酋长国回来了"
 afghanistan.4.t: "塔利班扩大控制区"
 afghanistan.4.d: "塔利班武装接管努里斯坦、库纳尔与巴达赫尚，政府军成建制投降或溃散。"
 afghanistan.4.a: "省份接连失守"
 afghanistan.5.t: "喀布尔防线崩溃"
 afghanistan.5.d: "政府军大规模逃散，塔利班先头部队逼近首都外围，喀布尔陷入恐慌。"
 afghanistan.5.a: "首都危在旦夕"
 afghanistan.6.t: "东部省份易手"
 afghanistan.6.d: "塔利班巩固对阿富汗东部山谷的控制，地方军阀纷纷倒戈。"
 afghanistan.6.a: "东方已定"
 afghanistan.7.t: "中部哈扎拉地区归附"
 afghanistan.7.d: "塔利班与地方武装达成协议，哈扎拉贾特名义上归附伊斯兰酋长国。"
 afghanistan.7.a: "谈判胜过血战"
 afghanistan.8.t: "塔利班宣布重建酋长国"
 afghanistan.8.d: "喀布尔陷落。塔利班宣布重建阿富汗伊斯兰酋长国，二十年的战争以美国的撤离告终。"
 afghanistan.8.a: "一个时代结束"
