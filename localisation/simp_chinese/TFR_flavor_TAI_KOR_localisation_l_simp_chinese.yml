l_simp_chinese:
 #台海和平统一路线与朝鲜半岛邦联路线：风味事件
 tai_kor_flavor.1.t: "渔汛回来了"
 tai_kor_flavor.1.d: "多年来第一次，厦门与金门的渔船按同一张潮汐表在同一片海域作业。渔获不算多，港边的酒馆却坐满了人。当年隔着海峡互相喊话的老人们，如今只为一斤鱿鱼的价格争得面红耳赤。在$COUNTRY$，人们说：海记得政治忘掉的事。"
 tai_kor_flavor.1.a: "让船出海吧"
 tai_kor_flavor.2.t: "回到长三角"
 tai_kor_flavor.2.d: "十年前把工厂迁往越南和印度的台商，如今悄悄在昆山与苏州重开办事处。手续简单了，航班又直飞了，一代在谨慎中长大的经理人开始在饭桌上谈价。金额还很小，但方向已经再清楚不过。"
 tai_kor_flavor.2.a: "生意跟着旗帜走"
 tai_kor_flavor.3.t: "老兵回家"
 tai_kor_flavor.3.d: "一辆载着眷村长老的大巴在警车护送下越过海峡，车上还配了一名护士。有人自1940年代起再没见过故乡；多数人发现宗祠已重修，祖坟由陌生人打理。他们带回照片、一罐故土，以及持续整个返程航班的沉默。"
 tai_kor_flavor.3.a: "有些债终于还得上"
 tai_kor_flavor.4.t: "海峡两岸的家庭"
 tai_kor_flavor.4.d: "长期被当作行政灰色地带的跨海峡婚姻，终于有了明确的法律依据。多年来自证已婚的夫妻，如今再次排队证明同一件事——这次用的是所有人都认的印章。他们在两本护照之间长大的孩子问：明年该用哪一本。"
 tai_kor_flavor.4.a: "一户人家，一套手续"
 tai_kor_flavor.5.t: "暑期交流营"
 tai_kor_flavor.5.d: "三百名来自$COUNTRY$的学生在南京与杭州度过两周。一半人以为会听到宣传，结果遇到的是难吃的食堂饭菜、深夜的争论和一份共享歌单。到最后一天，他们已经不再互称「他们」。两岸主办方都说成功，又都悄悄担心后续怎么办。"
 tai_kor_flavor.5.a: "让他们见面"
 tai_kor_flavor.6.t: "大陆舞台上的明星"
 tai_kor_flavor.6.d: "一位台湾流行歌手十一分钟售罄上海体育场。安可曲用两种口音唱出，台下用第三种口音回应。大陆把巡演宣传为文化融合，岛上则称之为回家。场馆里似乎没人在意用的是哪个词。"
 tai_kor_flavor.6.a: "观众不看通稿"
 tai_kor_flavor.7.t: "一场友谊赛，两面旗"
 tai_kor_flavor.7.d: "一场跨海峡棒球表演赛座无虚席，也带来一场外交头痛。客队旗帜准进场却不准上记分牌，播音员只好把球员名字念两遍来化解。主队一分险胜，两边休息区都鼓掌。"
 tai_kor_flavor.7.a: "九局和平"
 tai_kor_flavor.8.t: "妈祖进香"
 tai_kor_flavor.8.d: "来自$COUNTRY$的进香船队带着香火、锣鼓与海神像驶向湄洲。对岸的庙以红毯相迎；当地官员小心地把来客称作「同胞」，绝不称「客人」。返程的渡轮上，一位庙委说：起码这位女神从来不需要签证。"
 tai_kor_flavor.8.a: "信仰比政治轻便"
 tai_kor_flavor.9.t: "开城重启"
 tai_kor_flavor.9.d: "沉寂多年后，开城工业园的大门重新打开。韩国经理走过盖着防尘布的车间，朝鲜工人佩戴新工牌上岗。首月产量微不足道；首月工资按时发放——这才是真正的新闻。"
 tai_kor_flavor.9.a: "机器重新转起来"
 tai_kor_flavor.10.t: "金刚山重逢"
 tai_kor_flavor.10.d: "载着离散家属的大巴驶上金刚山会面所。房间编号固定，会面时间由官员掐着秒表掌握。一位八十岁的老妇人凭弟弟叠手的姿势认出了他。他们得到三小时、一份盒饭，以及一张两边都得瞒着邻居的照片。"
 tai_kor_flavor.10.a: "三小时就是三小时"
 tai_kor_flavor.11.t: "板门店的小店"
 tai_kor_flavor.11.d: "哨所人员减少后，几名小贩在停战村南侧重新摆摊。他们卖方便面、明信片，以及不可避免的纪念望远镜——用来眺望一条已不再有旧日含义的分界线。最畅销的是一枚旧分界绳造型的钥匙扣。"
 tai_kor_flavor.11.a: "小买卖，小和平"
 tai_kor_flavor.12.t: "南北之战"
 tai_kor_flavor.12.d: "南北足球友谊赛在一座体育场举行：两国国歌先后奏响，两边观众都起身。比赛以平局收场，解说称之为外交成果。赛后球员交换球衣，并费了不少劲交换电话号码。"
 tai_kor_flavor.12.a: "没人抱怨的平局"
 tai_kor_flavor.13.t: "金刚山向游客开放"
 tai_kor_flavor.13.d: "多年来首批旅游客轮靠泊金刚山。度假区只建成一半，水上乐园还是个水泥壳子，但沙滩干净，导游背下了三种语言。韩国游客抱怨价格，朝鲜员工抱怨小费算错了币种。"
 tai_kor_flavor.13.a: "让他们来看看"
 tai_kor_flavor.14.t: "两个声音，一个舞台"
 tai_kor_flavor.14.d: "首尔的一场音乐会，把一位北方抒情歌手与一支南方偶像组合凑在一起。编排别扭，翻译更差，而终曲——一首两边都认作自己的歌——让全场起立。转播延迟三十分钟，好让各家电视台剪掉对方的介绍。"
 tai_kor_flavor.14.a: "把音量调大"
 tai_kor_flavor.15.t: "七十年来的第一班列车"
 tai_kor_flavor.15.d: "一列试运行列车往返首尔与新义州，车上有检查员、记者，还有一位非常紧张的工程师。轨道是补的，信号靠人工，全程耗时是时刻表的三倍。但穿越终究完成，餐车里有人开了一瓶自1990年代就收在柜子里的酒。"
 tai_kor_flavor.15.a: "铺下第二条轨道"
 tai_kor_flavor.16.t: "共享一个中秋"
 tai_kor_flavor.16.d: "两韩首次合办中秋特别节目：同样的歌，同样的食物，两位主持人念同一份稿子。被旧分界线隔开的家庭在不同房间里收看，并为同样一件事争论了一整晚——对面那版到底唱得是不是更好。"
 tai_kor_flavor.16.a: "一个节日，两场转播"
