 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_1:0 "蜂群作战"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_1_DESC:0 "无人蜂群作战是解放军新型战法，旨在利用饱和式的打击、较长滞空时间和智能协同配合瘫痪敌防空网络并对敌地面目标造成彻底的毁伤"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_2:0 "灵活支援"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_2_DESC:0 "紧密协同地面部队是攻击机队的责任所在，一支体系完善的战术攻击编队能够让敌人在出动他们的任何部队前就遭受来自空中的惨痛打击"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_3:0 "飞行坦克"
 QL_SUB_QL_PRC_AIR_ATTACK_WING_PATH_3_DESC:0 "我军将建设一支在任何条件下都有能力突破敌防空网和战斗机拦截的前线支援机队，敢于在最危险的情况下深入敌人纵深打击关键的设施"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_1:0 "节点瘫痪"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_1_DESC:0 "尽管近些年的局部战争中，现代城市群往往很难攻破，但寻找并瘫痪敌方重要节点后，这些防御体系自身将会成为围困敌军的混凝土棺材"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_2:0 "隐蔽强袭"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_2_DESC:0 "轰炸机应具备长距离隐蔽袭击敌战略目标能力，把战火烧到敌国纵深腹地；这样的进攻性方案也将迫使敌防空力量不得不同我军展开决战"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_3:0 "高速战法"
 QL_SUB_QL_PRC_AIR_BOMBER_WING_PATH_3_DESC:0 "对高空高速突防的追求在二十一世纪已经是过时的战略轰炸战法，但其中一些经验仍然值得我们改进并学习，如通过远程制导武器来优化"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_1:0 "远程制空"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_1_DESC:0 "远程化是中国空军建设的重要目标之一，不单是空中平台航程和武器射程的扩展，更是探测能力和制空权扩展，以空中攻势取代被动防御"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_2:0 "穿透制空"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_2_DESC:0 "穿透制空强调在强对抗和高威胁的复杂的空战环境下，协同运用多领域、多方向、多类型的精锐空中力量，穿透敌方严密设防的防空体系"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_3:0 "空域阻滞"
 QL_SUB_QL_PRC_AIR_SUPERIORITY_WING_PATH_3_DESC:0 "相对于需要动用大量机队维持某一区域的制空权，不如在所有战场上破坏敌人的制空能力；敌军将因为代价过大而不再继续利用战场空域"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_1:0 "数智空军"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_1_DESC:0 "中国空军已经不再是二十世纪的以国土防空为任务的军队；随着越来越多的现代装备列装，其制空机队更加强调远程化、隐身化、智能化"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_2:0 "战略空军"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_2_DESC:0 "我国空军作为一支攻势空军，其主要任务便在于争取全面制空权并大胆地对敌军开展空中攻势；相应的其他部门也应该主要服务于该任务"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_3:0 "空天防御"
 QL_SUB_QL_PRC_AIR_SYSTEMS_PATH_3_DESC:0 "单单凭借制空机队是无法取得所有空中战役的胜利的，和地面防空设施以及军事航天单位一道通力合作，才能将我军战斗损失降到最低"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_1:0 "信火一体"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_1_DESC:0 "这一新型作战概念主要强调促进信息与火力的深度融合，从观测、决策到打击更快捷，提高杀伤效能；兵力的作用则转向侦察、引导、牵制、控域"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_2:0 "空地协同"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_2_DESC:0 "陆军的作战能力不单单来自其本身，依赖空中和地面武器的紧密配合，它能够高效地对敌人的体系实施毁灭性的打击，瘫痪其关键网络和重要节点"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_3:0 "优势火力"
 QL_SUB_QL_PRC_LAND_FIREPOWER_PATH_3_DESC:0 "成本较高且技术水平超前的武器系统并不适合一支专注于大规模作战的大陆军，提升军工产能、发展那些得到验证的武器才是更加务实的改革方向"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_1:0 "运动歼敌"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_1_DESC:0 "自革命战争时期开始，解放军就倾向于采取适度主动的机动作战策略，相对于防守战和消耗战，他们更强调集中优势兵力进攻主动消灭敌有生力量"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_2:0 "机动防御"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_2_DESC:0 "对我军来说，建立稳固的阵地纵深是取胜的关键；但这并不意味着采取僵化的防御策略，而应在运动当中利用敌军的弱点，寻机给予其致命的挫败"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_3:0 "攻势集群"
 QL_SUB_QL_PRC_LAND_GROUND_SYSTEMS_PATH_3_DESC:0 "对这支庞大的陆军来说，绝不轻言放弃是根本的信条，放弃不切实际的速胜论调，让每一次攻势都化作重锤，而敌人将在我们连续的打击之下崩溃"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_1:0 "任务编组"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_1_DESC:0 "前线部队以特定任务为主要导向进行编组，在充分清楚敌我状况的前提下发起战术行动；如今，解放军的任务编组正更加模块化、扁平化、智能化"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_2:0 "模块编组"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_2_DESC:0 "前线部队以适应性为主要导向进行编组，具有在多种条件下具备灵活战术选择的能力；北约和美国的非北约盟国均致力于采用更加敏捷的合成部队"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_3:0 "战备编组"
 QL_SUB_QL_PRC_LAND_JOINT_GROUPING_PATH_3_DESC:0 "永久战备编组最初只是人员装备不足时的权益之计，但也具备不少优点，比如灵活迅捷、可以快速投入作战当中，在适当动员部队后也能保证效率"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_1:0 "后勤胜战"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_1_DESC:0 "“兵马未动，粮草先行”，今天的中国军队已经建立起一套如毛细血管般密集的快速补给系统，智能化信息化的物流网络让联勤保障能力得到全面提升"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_2:0 "快速部署"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_2_DESC:0 "作为一支以海外投送为关键任务的军队，早在冷战时期，陆军便已经为其海外基地部署准备了一整套运行完善的工具和方案，保证部队的快速反应"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_3:0 "规模供应"
 QL_SUB_QL_PRC_LAND_SUSTAINMENT_PATH_3_DESC:0 "最丰饶的土地也不总是能养活士兵，要想取得胜利，就不得不贮备足够物资、建立庞大军事补给系统以备不时之需，对抗敌人的封锁和自然的考验"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_1:0 "航空制海"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_1_DESC:0 "随着解放军海军航空兵从一支纯粹的岸基航空力量转变为舰载机为主的海洋生力军，其在保障舰队防空网的同时也致力于提升舰队的火力投送能力"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_2:0 "浮动基地"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_2_DESC:0 "庞大的航母战斗群就是国家武力向海外投射的利刃，这些移动的堡垒宣示着无可质疑的威慑，不可撼动、不可侵犯，同时给予万里之外的敌国痛击"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_3:0 "防空补充"
 QL_SUB_QL_PRC_NAVAL_AVIATION_PATH_3_DESC:0 "载机巡洋舰的精神并没有完全过时，发展一支以保护水面舰艇空中安全为目的的海军航空兵部队仍然很有必要；同时，让敌军战略腹地不再安全"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_1:0 "水下长城"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_1_DESC:0 "中国海军的潜艇部队从白手起家到核常兼备，从近海防御到远海慑战，虽然仍然处在发展阶段，但已经成为不可忽视的战略威慑力量和水下防御网"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_2:0 "缄默猎人"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_2_DESC:0 "一旦拥有世界领先的水下作战体系，丰富的经验积累和潜艇的水下隐蔽技术将帮助我们在悄然无息中击杀敌舰、扼杀敌补给线最终使其战力消减"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_3:0 "威慑狼群"
 QL_SUB_QL_PRC_NAVAL_SUBMARINE_FLEET_PATH_3_DESC:0 "充分发展水下舰队，它既是我国远洋投射能力和三位一体核打击能力的关键组成，也是消灭和制衡水面舰队的好手，是我们军队不对称战力的刀锋"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_1:0 "远洋护卫"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_1_DESC:0 "中国军队的水面舰艇部队在新世纪急剧膨胀，不但吨位规模更庞大，而且质量和火力都获得提升，其预想的作战场景也由近海防御向远洋护卫转变"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_2:0 "主力优先"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_2_DESC:0 "随着濒海战斗舰的失败的尝试，似乎未来的现代化二级舰前途并不明朗；但另一方面，庞大的主力舰群依旧具备无与伦比的适航性和远洋作战能力"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_3:0 "少壮学派"
 QL_SUB_QL_PRC_NAVAL_SURFACE_FLEET_PATH_3_DESC:0 "法国的少壮学派曾主张建造成本较低的海军武器对抗由多艘战舰组成的大舰队，今天我们则利用精确制导武器使这一思想焕发新春，迫使敌舰远离"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_1:0 "区域拒止"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_1_DESC:0 "区域拒止能力是为应对突发事件，在划定的禁区内限制或阻止第三方外部势力介入干预的能力，这也是当前解放军海军在西太平洋的主要任务所在"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_2:0 "分散部署"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_2_DESC:0 "马赛克杀伤链作战理念不同于海军以往的思路，强调将重要的武器资产分散部署以避免作战体系中关键环节受到严重损失，确保长期维持其威慑力"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_3:0 "堡垒海区"
 QL_SUB_QL_PRC_NAVAL_SYSTEMS_PATH_3_DESC:0 "我们无意追求全球范围内的海洋霸权，但绝不可能容许敌人的海军在我国近海散步；联合岸基、水面和水下力量，打造一个坚不可摧的堡垒水域"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_MOBILE_ANNIHILATION:0 "机动歼敌"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_MOBILE_ANNIHILATION_DESC:0 "充分利用我军空中突击部队在复杂地形的机动能力，在运动中击溃敌军的部队集群并寻找机会扩大战果，消灭他们的有生力量，并能占领有利区域"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_NODE_ASSAULT:0 "节点突击"
 QL_SUB_QL_PRC_SF_AIR_ASSAULT_NODE_ASSAULT_DESC:0 "部署重型化的空中突击部队，将我们的陆航打击力量和装备投送能力结合起来，夺取重要的地面交通节点，以随时准备在敌军纵深撕开致命的缺口"
 QL_SUB_QL_PRC_SF_AIRBORNE_EMERGENCY_DEPLOYMENT:0 "紧急部署"
 QL_SUB_QL_PRC_SF_AIRBORNE_EMERGENCY_DEPLOYMENT_DESC:0 "空降部队的主要任务是执行特殊条件下的兵力投送任务而非同重装部队抗衡，基于这一前提，我们的空降部队更加注重适应能力和灵活的组织构成"
 QL_SUB_QL_PRC_SF_AIRBORNE_HEAVY_AIRDROP:0 "重装空投"
 QL_SUB_QL_PRC_SF_AIRBORNE_HEAVY_AIRDROP_DESC:0 "重装空投是顶尖工程技术和战士勇气的集合，世界上只有少数国家仍在尝试维持这种顶尖能力，空降一支机械化部队对敌人的打击无疑是毁灭性的"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_EXPEDITIONARY_GROUP:0 "远征集群"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_EXPEDITIONARY_GROUP_DESC:0 "我们的海军陆战队的建设方向是及时抵达并维护我们在全球任何地方的权益，为此，新的改革方向是提升部队装备和人员的适应性和远程投送能力"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_JOINT_LANDING:0 "联合登陆"
 QL_SUB_QL_PRC_SF_AMPHIBIOUS_JOINT_LANDING_DESC:0 "冲击滩头时，我部队的数量和质量永远捉襟见肘，要想抵消被水一战时的劣势，就有必要投入足够击溃那些坚固岸滩工事的大规模火力与装甲部队"
 QL_SUB_QL_PRC_SF_RECON_DEEP_RAID:0 "纵深破袭"
 QL_SUB_QL_PRC_SF_RECON_DEEP_RAID_DESC:0 "主要负责战场突袭和敌后作战任务的精锐先遣部队，发挥其高机动性、能够在各种地形状况下快速部署的优势，获取情报并尝试破坏敌作战能力"
 QL_SUB_QL_PRC_SF_RECON_MULTI_MISSION:0 "多元任务"
