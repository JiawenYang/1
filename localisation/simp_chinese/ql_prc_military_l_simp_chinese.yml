l_simp_chinese:
 QL_GRAND_QL_PRC_AIR_AEROSPACE_SUPPORT:0 "空天联合支援"
 QL_GRAND_QL_PRC_AIR_AEROSPACE_SUPPORT_DESC:0 "注重防御和前沿支援的战略，主要意在破坏敌制空权而非夺取和使用制空权；一方面强化防空力量，一方面通过多种手段为前沿部队提供支援"
 QL_GRAND_QL_PRC_AIR_AGILE_DEPLOYMENT:0 "敏捷作战部署"
 QL_GRAND_QL_PRC_AIR_AGILE_DEPLOYMENT_DESC:0 "马克·威尔士提出的“敏捷作战”理念，一方面分散全球重要战略资产，同时聚焦任务需求，保证机队有能力集中力量打击并瘫痪敌作战效能"
 QL_GRAND_QL_PRC_AIR_INTEGRATED_OFFENCE_DEFENCE:0 "攻防一体兼备"
 QL_GRAND_QL_PRC_AIR_INTEGRATED_OFFENCE_DEFENCE_DESC:0 "解放军当代“空天一体、攻防兼备”作战理念，把大气层内外空天作为统一战场，完善防空反导和远程打击能力，意图打赢每一场空中战役"
 QL_GRAND_QL_PRC_LAND_HYBRID_MODAL_WARFARE:0 "混合模态战争"
 QL_GRAND_QL_PRC_LAND_HYBRID_MODAL_WARFARE_DESC:0 "格拉西莫夫等人完善发展的俄罗斯前沿战略，建设小型作战编组，综合运用军事、政治、舆论等手段达成战略目标，以低成本动摇敌作战体系"
 QL_GRAND_QL_PRC_LAND_INTEGRATED_MOBILITY:0 "全域立体机动"
 QL_GRAND_QL_PRC_LAND_INTEGRATED_MOBILITY_DESC:0 "解放军当代“全域机动、立体攻防”作战理念，强调更强的战略投送能力、多维度的打击方式、有效的物资保障，实践中重视前沿态势感知和火力配置"
 QL_GRAND_QL_PRC_LAND_MULTI_DOMAIN_EXPEDITION:0 "多域协同远征"
 QL_GRAND_QL_PRC_LAND_MULTI_DOMAIN_EXPEDITION_DESC:0 "美陆军的“多域战”军事思想，组建多域特遣部队，要夺取物理空间、认知空间和战场先机；在实践中更强调远程投送能力和跨军种的协作配合"
 QL_GRAND_QL_PRC_NAVAL_MOSAIC_KILL_CHAIN:0 "马赛克杀伤链"
 QL_GRAND_QL_PRC_NAVAL_MOSAIC_KILL_CHAIN_DESC:0 "服务于马汉的海权理论，通过有无人系统的综合应用和作战平台的分布式部署，意图对敌方造成高复杂度的决策认知冲击，并提高大舰队生存能力"
 QL_GRAND_QL_PRC_NAVAL_OCEAN_TRANSITION:0 "远洋转型战略"
 QL_GRAND_QL_PRC_NAVAL_OCEAN_TRANSITION_DESC:0 "解放军当代“近海防御、远洋护卫”作战理念，起源于刘华清“近海防御”学说，旨在实现区域拒止；近年来随着形势变化，完善远洋攻防亦被提上日程"
 QL_GRAND_QL_PRC_NAVAL_REGIONAL_DETERRENCE:0 "区域威慑舰队"
 QL_GRAND_QL_PRC_NAVAL_REGIONAL_DETERRENCE_DESC:0 "戈尔什科夫理论和绿水海军思想的混合体，一方面强调有核远洋海军的战略威慑力，一方面受限于成本和不利的地缘形势，发展近海非对称战法"
 QL_GRAND_QL_PRC_SF_INDEPENDENT_OPERATIONS:0 "独立特种作战"
 QL_GRAND_QL_PRC_SF_INDEPENDENT_OPERATIONS_DESC:0 "我国的特种作战部队分布在各个军种和强力部门内部，优先服务于所属部队的任务需要，其训练活动旨在适应特定的战场环境、实现特定的战役目标"
 QL_GRAND_QL_PRC_SF_JOINT_OPERATIONS:0 "联合特种作战"
 QL_GRAND_QL_PRC_SF_JOINT_OPERATIONS_DESC:0 "横向整合我国的特种作战力量成立一联合作战司令部，使其能够便利地获取各方面支援的同时，在指挥结构上利于直接调度，更能快速部署、适应环境"
