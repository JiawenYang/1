 TFR_POLITICAL_LEADER_DESC_FRA_PIERRE_DE_VILLIERS:0 "皮埃尔·德维利耶是法国陆军职业军官，曾于2014年至2017年担任法国武装部队总参谋长，并因军费争议于2017年辞职。"
 TFR_POLITICAL_LEADER_DESC_FRA_BRUNO_LE_RAY:0 "布鲁诺·勒雷是法国陆军将领，曾于2015年至2018年担任巴黎军事总督。"
 TFR_POLITICAL_LEADER_DESC_ITA_CLAUDIO_GRAZIANO:0 "克劳迪奥·格拉齐亚诺是意大利陆军将领，曾任国防参谋长，后任欧盟军事委员会主席。"
 TFR_POLITICAL_LEADER_DESC_RAJ_ANIL_CHAUHAN:0 "阿尼尔·乔汉是印度陆军将领，曾任陆军东部司令部司令，并于2022年出任国防参谋长。"
 TFR_POLITICAL_LEADER_DESC_SPR_TEODORO_E_LOPEZ_CALDERON:0 "特奥多罗·洛佩斯·卡尔德龙是西班牙海军上将，自2021年起担任国防参谋长。"
 TFR_POLITICAL_LEADER_DESC_TUR_HULUSI_AKAR:0 "胡卢西·阿卡尔是土耳其陆军上将，曾任总参谋长，后于2018年至2023年担任国防部长。"
