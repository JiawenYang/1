l_simp_chinese:
 DSW_SOV_putin_focus_1:0 "审视特别军事行动"
 DSW_SOV_putin_focus_1_desc:0 "初期战事暴露了指挥、供应与情报衔接中的缺口。普京要求总参谋部逐项复盘，把前线经验转化为明确的整军计划，以持续投入取代临时补救。"
 DSW_SOV_putin_spirit_01:0 "审视特别军事行动"
 DSW_SOV_putin_spirit_01_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_2:0 "重整战时经济"
 DSW_SOV_putin_focus_2_desc:0 "清理军需订单、财政拨付与生产调度中的混乱，让既有资源优先填补前线缺口。整顿的目标是恢复可靠的装备供应与作战保障。"
 DSW_SOV_putin_focus_3:0 "纠正谢尔久科夫改革"
 DSW_SOV_putin_focus_3_desc:0 "对过去改革的得失进行全面清查，恢复被削弱的动员、保障和院校体系，同时保留有价值的信息化成果。俄军需要能支撑长期高强度作战的组织结构。"
 DSW_SOV_putin_spirit_03:0 "纠正谢尔久科夫改革"
 DSW_SOV_putin_spirit_03_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_4:0 "整顿军官指挥体系"
 DSW_SOV_putin_focus_4_desc:0 "以实战表现检验军官任用，清除虚报、推诿与指挥脱节。整顿后的指挥体系必须能够及时掌握态势、协调火力，并把命令准确传递到基层。"
 DSW_SOV_putin_spirit_04:0 "整顿军官指挥体系"
 DSW_SOV_putin_spirit_04_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_5:0 "充实基层军官队伍"
 DSW_SOV_putin_focus_5_desc:0 "扩大军校与短期培训的接纳规模，让有战场经验的骨干进入基层指挥岗位。充足的基层军官将改善部队轮换、训练与战术协同。"
 DSW_SOV_putin_spirit_05:0 "充实基层军官队伍"
 DSW_SOV_putin_spirit_05_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_6:0 "跨域联合作战体系"
 DSW_SOV_putin_focus_6_desc:0 "将侦察、电子对抗、远程火力与地面机动纳入共同的作战链条。以可靠的信息传递连接不同军种，使关键目标能够在多个方向同时受到压制。"
 DSW_SOV_putin_spirit_06:0 "跨域联合作战体系"
 DSW_SOV_putin_spirit_06_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_7:0 "航空与舰艇现代化"
 DSW_SOV_putin_focus_7_desc:0 "围绕现有工业能力推进航空装备与舰艇更新，优先解决维护、航电和武器适配问题。现代化必须形成可持续的战备能力，并服务于联合作战。"
 DSW_SOV_putin_spirit_07:0 "航空与舰艇现代化"
 DSW_SOV_putin_spirit_07_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_8:0 "完善混合战争体系"
 DSW_SOV_putin_focus_8_desc:0 "总结格拉西莫夫时期的军政协同经验，以电子对抗、情报支援和持续火力配合地面行动。在多种手段之间建立统一节奏，增强战场适应能力。"
 DSW_SOV_putin_spirit_08:0 "完善混合战争体系"
 DSW_SOV_putin_spirit_08_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_9:0 "发展现代大纵深作战"
 DSW_SOV_putin_focus_9_desc:0 "将大纵深作战的梯次投入与现代侦察、精确打击相结合。先以火力破坏敌军纵深体系，再组织后续梯队扩大突破，避免把部队消耗在零散的正面冲击中。"
 DSW_SOV_putin_spirit_09:0 "发展现代大纵深作战"
 DSW_SOV_putin_spirit_09_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_10:0 "规模化无人机打击"
 DSW_SOV_putin_focus_10_desc:0 "扩大侦察与攻击无人机的生产、配发和操作员培训，建立从发现目标到火力实施的快速链路。无人机将成为各类作战体系都能运用的常态支援力量。"
 DSW_SOV_putin_spirit_10:0 "规模化无人机打击"
 DSW_SOV_putin_spirit_10_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_11:0 "建立一体化防空体系"
 DSW_SOV_putin_focus_11_desc:0 "整合地面雷达、战斗机与防空部队的情报和指挥链，优化重要设施与前线部队的掩护。分层部署、共享态势和统一调度将共同提高防空效率。"
 DSW_SOV_putin_spirit_11:0 "建立一体化防空体系"
 DSW_SOV_putin_spirit_11_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_12:0 "空天力量优先建设"
 DSW_SOV_putin_focus_12_desc:0 "把空天力量建设纳入长期装备计划，稳定航空科研、发动机与配套工业的投入。重点保障侦察、制空和对地支援能力，使其能够持续配合地面战役。"
 DSW_SOV_putin_spirit_12:0 "空天力量优先建设"
 DSW_SOV_putin_spirit_12_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_13:0 "构筑多层防御体系"
 DSW_SOV_putin_focus_13_desc:0 "依托工事、雷场、预备队与炮兵阵地建立纵深防御。完善的防御体系可以降低持续作战的损耗，为整训部队与准备反击争取时间。"
 DSW_SOV_putin_spirit_13:0 "构筑多层防御体系"
 DSW_SOV_putin_spirit_13_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_14:0 "恢复装甲装备生产"
 DSW_SOV_putin_focus_14_desc:0 "修复装甲车辆总装、发动机、火控和维修企业之间的生产断点，以现有设施恢复车辆补充与翻修。先弥补保障欠账，再确保部队能够执行既定任务。"
 DSW_SOV_putin_focus_15:0 "组建合成突击集群"
 DSW_SOV_putin_focus_15_desc:0 "围绕装甲与机械化部队整合步兵、炮兵、工兵和防空力量，开展统一训练。合成突击集群将以协同火力和工程保障解决突破口问题。"
 DSW_SOV_putin_spirit_15:0 "组建合成突击集群"
 DSW_SOV_putin_spirit_15_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_16:0 "锻造现代化俄军"
 DSW_SOV_putin_focus_16_desc:0 "把整军、装备更新和战场经验汇入新的战备标准。现代化俄军必须拥有能够轮换的部队、可靠的指挥体系，以及支撑连续战役的保障能力。"
 DSW_SOV_putin_spirit_16:0 "锻造现代化俄军"
 DSW_SOV_putin_spirit_16_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_17:0 "完善远近海舰队体系"
 DSW_SOV_putin_focus_17_desc:0 "以近海防御、远海行动和后勤保障的实际需求安排造舰与整修。扩充可用舰艇，改善协同和维修能力，使海军能够稳定履行掩护、封锁与支援任务。"
 DSW_SOV_putin_spirit_17:0 "完善远近海舰队体系"
 DSW_SOV_putin_spirit_17_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_18:0 "联合遮断与后勤打击"
 DSW_SOV_putin_focus_18_desc:0 "以航空、海上与远程火力共同压制敌军运输枢纽和保障体系。统一目标选择与情报评估，让纵深打击与地面战役形成连续配合。"
 DSW_SOV_putin_spirit_18:0 "联合遮断与后勤打击"
 DSW_SOV_putin_spirit_18_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_19:0 "纵深穿插与合成突破"
 DSW_SOV_putin_focus_19_desc:0 "由侦察和工兵查明薄弱地段，以集中火力打开通路，再由合成部队实施突破与纵深穿插。机动必须与补给、侧翼掩护和后续梯队同步展开。"
 DSW_SOV_putin_spirit_19:0 "纵深穿插与合成突破"
 DSW_SOV_putin_spirit_19_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_putin_focus_20:0 "修复军工生产体系"
 DSW_SOV_putin_focus_20_desc:0 "排查现有军工企业的设备故障、工序脱节与交付拖延，恢复被混乱调度阻塞的生产流程。让已有工厂重新承担正常的装备补充责任。"
 DSW_SOV_putin_focus_21:0 "统筹战时劳动力配置"
 DSW_SOV_putin_focus_21_desc:0 "重新安排关键岗位、职业培训与轮换用工，减少长期动员对基层保障部门的冲击。稳定的人力配置将恢复部队维持战备所需的后方支持。"
 DSW_SOV_putin_focus_22:0 "保障民生与基本供应"
 DSW_SOV_putin_focus_22_desc:0 "维持食品、能源与日用品的基本供应，缓解长期动员对后方秩序和基层部队的冲击。稳定的生活保障有助于部队恢复正常轮换与休整。"
 DSW_SOV_putin_focus_23:0 "深化中俄产业协作"
 DSW_SOV_putin_focus_23_desc:0 "与中国协调设备维护、零部件交付与运输安排，优先补齐现有军工链条的缺口。以可靠的供应关系恢复被中断的装备保障。"
 DSW_SOV_putin_focus_24:0 "拓展能源出口与结算"
 DSW_SOV_putin_focus_24_desc:0 "理顺能源交付、运输与结算中的堵点，使燃料和运输保障能够按照战区实际需求运行。稳定的供给将修复前线补给网络的薄弱环节。"
 DSW_SOV_putin_focus_25:0 "完善国家动员体系"
 DSW_SOV_putin_focus_25_desc:0 "规范预备人员的登记、训练、分配和轮换，减少临时征调造成的指挥与保障混乱。让部队恢复正常编制组织与防御任务的执行能力。"
 DSW_SOV_putin_focus_26:0 "恢复战时产能"
 DSW_SOV_putin_focus_26_desc:0 "修复关键装备和弹药生产中的瓶颈，恢复既有工序之间的衔接。优先解决积压订单和前线欠供，使部队重新具备执行作战计划的基础。"
 DSW_SOV_putin_focus_27:0 "建立平行进口保障网"
 DSW_SOV_putin_focus_27_desc:0 "通过多元采购、维修与运输渠道补齐关键零部件缺口，减少现有装备因缺件停用的情况。先恢复装备完好与前线补充，再维持稳定的保障节奏。"
 DSW_SOV_putin_focus_28:0 "本币结算与金融自主"
 DSW_SOV_putin_focus_28_desc:0 "理顺现有支付、贸易融资与预算安排，降低结算中断对长期行动计划的干扰。让总参谋部能够依据可靠的保障承诺制订作战计划。"
 DSW_SOV_putin_focus_29:0 "推进军工体系国有化"
 DSW_SOV_putin_focus_29_desc:0 "统一协调关键军工企业的订单与交付责任，解决信息割裂和保障推诿。优先恢复基层部队执行防御和轮换任务所需的可靠供应。"
 DSW_SOV_putin_focus_30:0 "确立战时统筹经济"
 DSW_SOV_putin_focus_30_desc:0 "完成工业、财政、交通与能源部门之间的协调，消除计划制定与实际保障之间的断层。整备的目标是恢复能够兑现的行动计划。"
 DSW_SOV_integrate_novorossiya:0 "新俄罗斯并入联邦"
 DSW_SOV_integrate_novorossiya_desc:0 "统一新俄罗斯与顿巴斯地方政权的行政、军队和保障体系，将其纳入俄罗斯联邦。整合既有机构和基础设施，为居民提供统一的身份、供应与公共服务。"
 DSW_SOV_putin_spirit_31:0 "新俄罗斯并入联邦"
 DSW_SOV_putin_spirit_31_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_final_offensive:0 "最终攻势"
 DSW_SOV_final_offensive_desc:0 "整军和战时经济建设已经形成合力。普京批准总参谋部提交的完整行动方案，解除乌克兰全境的未经计划的攻势限制，以持续补给、联合火力与合成突击展开最终攻势。"
 DSW_SOV_putin_spirit_32:0 "最终攻势"
 DSW_SOV_putin_spirit_32_desc:0 "旧版加成已经撤销，载入后清理对应条目。"
 DSW_SOV_integrate_novorossiya_tt:0 "将新俄罗斯（NOV）、顿涅茨克（DPR）、卢甘斯克（LPR）的全部既有核心变为俄罗斯核心，并吞并仍存在且未与俄罗斯交战的上述政权，接收其部队。没有对应政权时仍可获得其既有核心。"
 DSW_SOV_clear_all_ukraine_tt:0 "清除乌克兰全部核心地区、既定交战区域及仍带有攻势惩罚地区的“未经计划的攻势”（包括旧 TFR 版本）。开启最终攻势阶段；乌克兰投降进度达到 70% 时，按现有剧情触发北约介入。"
