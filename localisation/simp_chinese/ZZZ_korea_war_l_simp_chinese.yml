l_simp_chinese:
 ZZZ_KW_korea_war.1.t:0 "谈判窗口关闭"
 ZZZ_KW_korea_war.1.d:0 "2022年5月9日。最后一轮朝韩会谈在未达成框架协议的情况下结束。没有条约签署，也没有宣战——但通过谈判实现和解的窗口就此关闭。从这一天起，首尔只能在威慑与冒险之间选择。"
 ZZZ_KW_korea_war.1.a:0 "我们尽力了。"
 ZZZ_KW_korea_war.2.t:0 "和平的半岛"
 ZZZ_KW_korea_war.2.d:0 "邦联框架得以维持。北方与南方进入长期过渡安排，青瓦台移交给一个承诺延续阳光政策的进步派政府。这片半岛不会发生战争。"
 ZZZ_KW_korea_war.2.a:0 "一条新路由此开启。"
 ZZZ_KW_korea_war.3.t:0 "强硬派上台"
 ZZZ_KW_korea_war.3.d:0 "谈判已死，选民转向一个承诺以决心回应挑衅的保守派政府。新政府下令全面重估北方威胁，并在暗中作最坏的准备。"
 ZZZ_KW_korea_war.3.a:0 "秩序优先。"
 ZZZ_KW_korea_war.4.t:0 "紧急戒严"
 ZZZ_KW_korea_war.4.d:0 "2024年12月。面对敌对国会与崩塌的政治基础，总统以北方威胁为由宣布紧急戒严。装甲部队向首都开进，国民议会被包围。"
 ZZZ_KW_korea_war.4.a:0 "宣布戒严。"
 ZZZ_KW_korea_war.5.t:0 "国会之夜"
 ZZZ_KW_korea_war.5.d:0 "议员们在议事厅内筑起路障，表决否决了戒严令。街头挤满了抗议者。政府已经越过一条无法回头的线，而它眼中唯一的出路指向北方。"
 ZZZ_KW_korea_war.5.a:0 "已无退路。"
 ZZZ_KW_korea_war.6.t:0 "对北开战"
 ZZZ_KW_korea_war.6.d:0 "黎明时分，大韩民国以全面吞并为战争目标对北方宣战。没有停战，没有谈判间歇，也不会有第二轮会谈。半岛已进入战争——而整个地区不会久居中立的旁观。"
 ZZZ_KW_korea_war.6.a:0 "全力以赴。"
 ZZZ_KW_korea_war.7.t:0 "大亚洲战争"
 ZZZ_KW_korea_war.7.d:0 "东京对北京宣战。大亚洲战争爆发，而朝鲜半岛的战事只是它的第一个战场。"
 ZZZ_KW_korea_war.7.a:0 "这本就不可避免。"
 ZZZ_KW_korea_war.8.t:0 "半岛燃烧"
 ZZZ_KW_korea_war.8.d:0 "大韩民国向北推进，军事分界线上火炮齐鸣。世界屏住了呼吸。"
 ZZZ_KW_korea_war.8.a:0 "世界在注视。"
 ZZZ_KW_martial_law_2024:0 "紧急戒严"
 ZZZ_KW_martial_law_2024_desc:0 "紧急权力中止了正常政治、限制了公民自由，并把国家推入战时状态——代价是政府丧失所剩无几的合法性。"
 ZZZ_KW_korea_war.9.t:0 "戒严令被否决"
 ZZZ_KW_korea_war.9.d:0 "2024年12月4日凌晨。国会以压倒性票数否决戒严令，军方开始撤离首尔。弹劾程序随即启动，总统在数日内被停职——这条捷径在人民的注视下崩溃了。"
 ZZZ_KW_korea_war.9.a:0 "宪法仍然有效。"
 ZZZ_KW_korea_war.10.t:0 "政权更替"
 ZZZ_KW_korea_war.10.d:0 "2025年6月3日。提前大选落幕，进步派阵营赢得多数，新政府于次日就职。半岛没有战火，只有一场艰难的清算与重建——而保守派留下的安全困境仍横在两国之间。"
 ZZZ_KW_korea_war.10.a:0 "由选票决定。"
