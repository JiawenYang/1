l_simp_chinese:
 # LAWS
 overview: "总览"
 economic_status: "经济状况"
 socioeconomic_laws: "社会经济法案"
 civilization: "文明"
 law_state_system: "国体"
 law_presidential_system: "总统共和制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_presidential_system_desc: "国家元首由人民直接选举产生，按宪法规定的固定任期行使职权。总统任命内阁并领导行政机关，而法院与议会保留制约总统的权力。这一体制更看重宪政秩序的延续，而非某一位执政者个人。"
 law_parliamentary_system: "议会共和制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_parliamentary_system_desc: "行政权由从议会中产生并对议会负责的内阁掌握。能取得多数支持的政党组阁，联盟随议会信任的消长而更替。权力分散于政党与议会机构之间，而不集中于单一职位。"
 law_absolute_monarchy: "绝对君主制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_absolute_monarchy_desc: "君主是国家权力的唯一来源，其统治不受具有约束力的宪法限制。大臣依君主意志任职，法律以敕令颁布，宫廷与王座居于政治生活的中心。体制的稳定取决于王室的治理能力及其对国家机器的掌控。"
 law_constitutional_monarchy: "君主立宪制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_constitutional_monarchy_desc: "世袭君主依据宪法担任国家元首，其王权受到宪制约束。实际治理权掌握在经选举产生的议会与对议会负责的内阁手中，王室则作为超越党派纷争的象征性与稳定力量存在。"
 law_socialist_state: "社会主义国家(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_socialist_state_desc: "社会主义国家，由政党领导国家，公有制在国民经济命脉中占据主导。计划、产业政策与社会保障由党国机构统一协调，政治生活围绕单一的执政组织展开。这一体制强调动员、长期规划与集体纪律。"
 law_peoples_democracy: "人民民主制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_peoples_democracy_desc: "一种人民民主体制，国家宣称以劳动人民的名义施行治理。代议机构在受限的政治范围内选举产生，执政党自称为人民意志的组织化体现。公有制与社会保障被视为这一制度的物质基础。"
 law_military_dictatorship: "军事独裁(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_military_dictatorship_desc: "由武装力量执掌政权，军方自称为国家秩序的守护者。军政府或最高统帅部掌握行政权，文职机构服从于军事需要，选举即便举行也受到严密操控。政权的合法性建立在纪律、安全与防止内部动乱之上。"
 law_authoritarianism: "威权体制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_authoritarianism_desc: "权力集中于狭小的行政核心圈层，只要不威胁政权，便容许有限的多元存在。选举与议会依然存在，但受到管控；国家借助监控与恩庇维系社会的顺从。这一体制许诺的是秩序与发展，而非民众参与。"
 law_russian_political_system: "俄罗斯政治体制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_russian_political_system_desc: "一种宪政秩序，将行政权集中于强势总统手中，同时保留形式上的联邦与议会机构。总统掌控安全与行政机器，政党体系围绕一支占主导地位的政治力量组织起来。这一体制把选举合法性与集中指挥结合在一起。"
 law_american_presidential_republic: "美国总统共和制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_american_presidential_republic_desc: "联邦总统制共和国，各州与联邦政府依据成文宪法分享主权。总统、国会与法院构成彼此分立的分支，其间的平衡通过选举、法律与制度竞争来维持。"
 law_fascist_dictatorship: "法西斯独裁(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_fascist_dictatorship_desc: "以单一政党、最高领袖以及国家高于个人的原则构建起来的独裁式运动国家。社团机构将劳工、资本与政党整合在一起，准军事组织与宣传机器维持着群众动员。政权把冲突、等级与民族复兴奉为其立国神话。"
 law_nazi_dictatorship: "民族社会主义独裁(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_nazi_dictatorship_desc: "融合极端民族主义、种族学说与一党制国家的极权独裁。政党掌控镇压与教育机器，政权将社会编组为受领袖权威支配的群众组织。扩张、清洗与意识形态一律化构成了它的内在逻辑。"
 law_ultranationalist_dictatorship: "极端民族主义独裁(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_ultranationalist_dictatorship_desc: "将民族及其臆想中的文明使命置于一切忠诚之上的独裁体制。魅力型领袖与单一运动借紧急权力施行统治，少数群体与异见者被视为内部敌人。军事化的象征与长期动员维系着政权的存续。"
 law_islamic_republic: "伊斯兰共和制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_islamic_republic_desc: "宪法宣布伊斯兰原则为公法基础的共和国。经选举产生的机构在宗教权威所划定的范围内运作，教权机构监督立法与司法。这一体制将共和形式与宗教对政治秩序的否决权结合在一起。"
 law_theocracy: "神权制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_theocracy_desc: "宗教权威是法律与合法性的最终来源。神职人员居于最高职位，神圣教义指导立法，国家自称为信仰及其道德秩序的守护者。世俗权力服务于精神使命，而非纯粹的世俗宪法。"
 law_neo_soviet_republic: "新苏维埃共和制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_neo_soviet_republic_desc: "重振苏维埃制度形式的共和国：苏维埃、执政党与国家主导的经济。领导层将政党纪律与现代化技术官僚行政相结合，并自称为社会主义传统的合法继承者。计划与社会保障是这一体制的核心主张。"
 law_socialist_republic: "社会主义共和制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_socialist_republic_desc: "在共和国宪法中写入社会所有制与公共利益的一种共和政体。经选举产生的机构与社会主义政党共同行使权力，国家保障就业、福利与基本公共服务。这一体制力图把共和合法性与计划化、平等化的经济结合起来。"
 law_american_peoples_dictatorship: "人民民主专政(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_american_peoples_dictatorship_desc: "一种人民专政，由单一运动宣称代表人民意志、对抗腐朽的旧秩序。执政党垄断有组织的政治活动，群众组织把工人、青年与贫苦阶层纳入国家结构之中。政权将强制说成实现社会正义的必要手段。"
 law_taiwanese_semi_presidential_system: "台湾半总统制(外交声誉: §Y[?diplomatic_reputation]§!)"
 law_taiwanese_semi_presidential_system_desc: "半总统制共和国，直选总统与对立法机构负责的行政院长分享行政权。总统主管防务、对外事务与国家安全，内阁则取决于立法机构的信任。这一体制在强势领导与议会问责之间取得平衡。"

 influence: "影响力"
 MAPMODE_INFLUENCE_CML_MAP_MODE_NAME: "影响力（超级大国）"
 MAPMODE_INFLUENCE_CML_MAP_MODE: "影响力（超级大国）"
 MAPMODE_INFLUENCE_CML_MAP_MODE_DESCRIPTION: "超级大国的影响力。"
 influence_cml_map_mode_tooltip: "这是一种地图模式，显示超级大国所影响的国家。"
 influence_cml_map_mode_tooltip_delayed: "属于[USA.GetName]的一部分或受[USA.GetAdjective]影响: §B蓝色§!\n属于[SOV.GetName]的一部分或受[SOV.GetAdjective]影响: §R红色§!\n属于[CHI.GetName]的一部分或受[CHI.GetAdjective]影响: §Y黄色§!\n属于[FRA.GetName]的一部分或受[FRA.GetAdjective]影响: §C青色§!\n属于[ENG.GetName]的一部分或受[ENG.GetAdjective]影响: §p亮粉色§!"
 prousa: "£md_infl_prousa_emblem §4西方集团§!\n\n\n\n\n\n\n£md_infl_prousa_big \n\n\n\n\n\n\n§g它不是一面旗帜，而是一张网。美元、海外基地、同盟条约与产业标准把几十个国家系在华盛顿这个节点上，美国的影响力因此很少以领土的形式出现，而是以规则、信用与舰队的形式存在。盟国未必喜欢这套秩序，却很难找到能够替代它的接口。它的边界不在地图上，而在能否兑现承诺；它的力量来自别人对它的需要。\n\n这张网靠四样东西运转：美元与纽约的清算体系让各国央行把储备留在美国，也让制裁能够顺着银行报文传导到任何角落；十一支航母战斗群与遍布全球的基地网络保证航道与力量投送；北约、美日同盟与一系列双边安全条约把驻军变成可兑现的承诺；大学、硅谷与好莱坞则把技术标准、商业模式和生活想象一并输出。盟友用市场准入换取安全，美国用安全换取规则的制定权。四根支柱彼此支撑，任何一根松动，其余三根都会承压。\n\n£md_infl_prousa_mark\n\n投射最深的仍是欧洲与东亚，松动最快的也是这两处。欧洲在防务上依赖华盛顿，却在贸易与气候议题上另起炉灶；东亚的盟友经济上以中国为最大市场，安全上仍把美国当作保险。中国用贸易与基建在周边提供替代选项，俄罗斯用能源与否决权撬动缝隙，中东与拉美则反复试探华盛顿的耐心。每一个区域都在问同一个问题：华盛顿还愿意为这里付出多少？\n\n代价已经显现：阿富汗与伊拉克透支了国内共识，盟友习惯搭便车，2016年之后的“美国优先”把关税、撤军与重新谈判变成常用语言。当保护变成收费，当承诺开始按届计算，这张网还能系住多少人？美国仍是最强的国家，但它必须在收缩与再承诺之间作出选择。§!"
 prosov: "£md_infl_prosov_emblem §R俄罗斯集团§!\n\n\n\n\n\n\n£md_infl_prosov_big \n\n\n\n\n\n\n§g它不靠制度吸引人，而靠距离、能源与军队说话。俄罗斯联邦把影响力经营成一圈由近及远的势力范围：先在邻国保住对自己有利的政权更替方向，再向南、向东换取议价空间。势力范围不是条约写明的，而是由驻军、管线与债务一点点固化下来的；它的力量是地理的，也被地理限制。\n\n工具是现成的：油气管道与长期合同把欧洲和邻国的暖气绑在莫斯科的阀门上；集体安全条约组织提供驻军、演习与干预的名义；欧亚经济联盟把关税、劳务与运输捆在一起；安理会否决权则让任何制裁都难以闭环。网络行动、国家媒体与代理武装补上了正式手段够不到的地方。能源合同往往附带政治条件，折扣、预付款与管线走向，都可以在谈判桌上换成选票或基地。硬手段负责破局，软手段负责让既成事实显得理所当然。\n\n£md_infl_prosov_mark\n\n核心圈是白俄罗斯、中亚与高加索，外圈伸向叙利亚、北非与撒哈拉以南。对手一边是北约东扩与导弹防御，一边是中国以贷款和工程进入中亚——后者是伙伴，也是慢慢稀释莫斯科独占地位的力量。叙利亚的空军基地让俄罗斯在地中海有了落脚点，非洲的矿业与安保合同则换回外汇与投票。邻国的精英越来越熟练地在几方之间抬价，俄罗斯每保住一个据点，都要付出比上一次更高的价码。\n\n代价同样清楚：油价与制裁决定财政的呼吸，远东与高加索的人口在流失，除资源与军工之外的产业难以支撑长期竞争。2014年之后的制裁把经济推向内向化，也把对外关系锁定在对抗轨道上。靠驻军与债务维持的影响力，边际收益正在下降；它仍能让邻国顾忌，却越来越难让邻国信服。§!"
 proprc: "£md_infl_proprc_emblem §t东方集团§!\n\n\n\n\n\n\n£md_infl_proprc_big \n\n\n\n\n\n\n§g它不驻军，也不要求受援国改换制度。中国的影响力更像一张贸易与信贷的网：用港口、铁路、电站和市场准入换取政治善意，把“不干涉”写进每一份合同。与华盛顿不同，北京很少承诺安全，它承诺的是增长；它的扩张是渐进的，像水位上涨，而不是像舰队靠岸。\n\n抓手是具体的：一带一路把基建、贷款与中国的工程标准一起输出；亚洲基础设施投资银行与丝路基金补上融资渠道；产能合作把国内过剩的钢铁、水泥与设备变成海外资产；党际交往与地方结对则提供了不需要条约的沟通管道。人民币结算与双边本币互换，正在为这套网络铺一层金融底座。这些项目大多由政府间协议启动，再由国有银行和承包商执行，政治承诺与商业合同因此很难分开。\n\n£md_infl_proprc_mark\n\n投射重心在中亚、东南亚、非洲与拉美——多是西方影响力退潮或从未深入的地方。对手并不单一：美国以同盟体系与安全承诺设阻，印度在印度洋推出自己的互联互通方案，受援国则学会在中美之间议价。在非洲与拉美，中国填补的是基础设施的空白；在东南亚，它面对的是既想要投资又担心依赖的邻国。北京的优势是速度与价格，短板是安全供给与政治信任；信任比贷款利率更贵。\n\n代价随之而来：项目回报周期长，债务可持续性受质疑，港口与矿区需要安保，政局一变合同就可能重谈。一旦某个国家政局转向，已经建成的港口不会搬走，但新的信贷会立刻收紧。中国的影响力不靠宣言，而靠一个个能否按时发电、按时通车的工程累积——它增长得慢，回撤得也难；它不追求驻军与基地，却同样需要伙伴相信合同会被执行。§!"
 profra: "£md_infl_profra_emblem §C法兰西集团§!\n\n\n\n\n\n\n£md_infl_profra_big \n\n\n\n\n\n\n§g它没有全球规模的舰队，却有一套放大自己的办法：把欧洲一体化当作杠杆，把法语、教育与驻军当作触角。法国的野心不是统治世界，而是让巴黎在欧洲与非洲之间始终不可绕过。它的影响力靠制度与语言维系，而不是靠数量；它把文化当作战略资源，把语言当作长期的基础设施。\n\n杠杆首先在布鲁塞尔：共同市场、欧元与法德轴心让法国的产业与农业政策获得大陆尺度；独立核力量与安理会席位保证它在任何谈判桌上都有一票；海外省、驻非基地与快速干预部队提供直接投送；法语国家组织、公立学校与文化交流则维系着一套语言和精英网络。法国还掌握着一批国际组织的人事与议程，从联合国教科文组织到法语国家组织，席位本身就是影响力。一套中等强国的工具箱，被法国用到了极致。\n\n£md_infl_profra_mark\n\n投射的重心在萨赫勒与北非，也在印太的海外领地。阻力来自三面：俄罗斯以雇佣兵和宣传填补法国撤离后的真空，美国的安全主导压缩了欧洲自主的空间，非洲街头的反法情绪让驻军从保护变成靶子。在萨赫勒，法军曾以反恐名义长期驻留，但2013年之后的每一次增兵，都伴随着更强烈的撤军呼声。每撤出一个营地，填补真空的往往不是欧盟，而是别人。\n\n代价是财政与合法性：高福利与高税负限制了对外投入，驻军缩减后影响力随营地一同撤走，欧盟内部的财政分歧又让“欧洲杠杆”时常失灵。巴黎很清楚，欧洲一体化是它唯一可靠的放大器；但欧洲本身正在为财政规则、难民与主权争论不休。法国仍能发声，但要让别人照做，越来越难；杠杆再精巧，也需要有人愿意被撬动。§!"
 profra_desc: "§Y该国不会发生政变§!"
 prosovcom: "£md_infl_prosovcom_emblem §R苏维埃联盟§!\n\n\n\n\n\n\n£md_infl_prosovcom_big \n\n\n\n\n\n\n§g它不是势力范围，而是一个以意识形态划界的全球工程。莫斯科把自己定义为另一种现代性：用计划取代市场，用党取代议会，用国营贸易取代世界市场，并向所有反对旧秩序的人提供样板与后盾。它输出的不是商品，而是道路本身；它的影响力首先是一种关于未来的承诺。\n\n运转依靠一整套机构：经互会把东欧的工业与原料编成分工体系，华约把军事指挥一体化，国家计委式的援助与信贷把受援国纳入同一套技术标准，党际关系则绕开外交部直接连接各国运动。宣传、留学与军事顾问把影响力送进工厂、军营和大学。援助不是无偿的，它换来的是投票、基地、资源与在外交场合的站位；每一个环节都由国家出资，也因此都由中央承担成本。\n\n£md_infl_prosovcom_mark\n\n投射的半径覆盖东欧、古巴、越南、安哥拉与阿富汗，真正的战场却在全球南方：每一笔援助、每一座钢厂、每一所党校，都是与西方争夺“走哪条路”的筹码。在安哥拉与莫桑比克，古巴的军队与苏联的武器一起出现；在越南，金兰湾的码头替莫斯科看住南海。它的对手不是某个国家，而是市场、议会与民族主义三种潮流。攻势顺利时，红旗是方向；攻势受挫时，盟友先计算补贴。阵营的边界由坦克划定，也由面包的价格维持。\n\n代价写在账本上：为盟友提供廉价能源与补贴拖累了自身财政，军备竞赛挤压消费品，计划体制在信息和激励上失灵，账本比旗帜更早显露疲态。当补贴停止，盟友的忠诚往往比意识形态更快消散，东欧在1989年的转向就是明证。若红旗再度升起，它继承的不只是核武库与版图，还有这套必须不断证明自己优越、也必须不断向盟友付费的制度。§!"
