 type_of_economy: "经济体制"
 econ_capitalist_economy: "§Y资本主义§!"
 econ_capitalist_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_capitalism_banner\n\n\n\n\n\n§g资本主义是一种私营公司、企业在其中经营，免受政府干预的经济体系。在这个体系中，价格、成本、工资由市场的大手——供需关系决定。也就是说，政府的监督和监管相对有限。资本主义在市场自由主义者中广受欢迎，并已成为全球最广泛采用的经济制度。§!"
 econ_american_capitalism: "§Y美式资本主义§!"
 econ_american_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_american_capitalism_banner\n\n\n\n\n\n§g美国的经济体系是其他自由市场经济体的典范，以自由贸易、政府在经济事务最小干预为基础。然而，这一体系有一些独特的特征，使其与其他形式的资本主义不同。\n美国经济主宰全球，让美元成为一种稳定强势的货币。美元汇率的升降都会影响全球。因此，美元被广泛用作全球主要的储备货币。§!"
 econ_oligopolistic_capitalism: "§Y寡头资本主义§!"
 econ_oligopolistic_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_oligopolistic_capitalism_banner\n\n\n\n\n\n§g像许多国家一样，该国的经济运作遵循自由市场原则。然而，它的市场集中度高，只由少数几家企业主导竞争。\n与其他资本主义经济体相比，这一经济体系的独特之处在于政府的参与程度极低。政府的监管与行政职能被限制，甚至被剥夺至不存在。财阀的利益高于公众。§!"
 econ_welfare_capitalism: "§Y福利资本主义§!"
 econ_welfare_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_welfare_capitalism_banner\n\n\n\n\n\n§g在福利资本主义制度中，政府与私营企业协作，并对经济进行一定程度的控制参与，以确保其正常运转。根据支持者的说法，福利资本主义在高经济增长、低通胀、低失业率、良好的工作条件，以及一定的社会保障之间取得了平衡。§!"
 econ_managed_economy: "§Y纳粹法团主义§!"
 econ_managed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_managed_economy_banner\n\n\n\n\n\n§g纳粹法团主义，是指纳粹德国经济模式的基础体系。虽然它因政权消亡而被作失败，但新纳粹运动的支持者仍声称这是"雅利安人"唯一该遵循的真正诚实的经济制度。\n一切行动都是为了满足国家及最高权威的需求——伟大领袖，亦或是政党的各个机构。政府的要求无休无止，一切行动都要经过严格审查，它的要求高于一切。§!"
 econ_planned_economy: "§Y计划经济§!"
 econ_planned_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_planned_economy_banner\n\n\n\n\n\n§g计划经济对所有经济产出、增长都提前进行规划，以满足人口和国家这个大集体的需要。计划既可以由专门的专家委员会决定，也可以由人民以参与的方式决定。而执行计划，既可以由国家主导集中运转，也可以地方分散执行。§!"
 econ_developed_socialism: "§Y发达社会主义§!"
 econ_developed_socialism_tooltip: "\n\n\n\n\n£GFX_ZZZ_developed_socialism_banner\n\n\n\n\n\n§g"发达社会主义"这一概念是苏联勃列日涅夫时代的遗产，如今被当代俄罗斯经济学家重新赋予了活力。在这一更新的观点中，更多柯西金式的提案与改革得以实施，让经济格局与体制更多样化。\n中央计划仍发挥着核心作用，但并没有完全泯灭个人的主观能动性。私营企业在生产、规划、员工管理等方面有更多操作空间。这种独立性让他们可以追求更多的利润，从而激励他们多多生产。此外，基于"劳动参与系数"的新工资制度也已被引入，该制度根据员工对公司生产的贡献程度来支付工资。§!"
 econ_military_controlled_economy: "§Y军管经济§!"
 econ_military_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_military_controlled_banner\n\n\n\n\n\n§g在军管经济，军方对经济直接监管。绝大多数（甚至全部）经济活动都旨在满足军方需求。这种经济体制在军事独裁或军政府国家中较为普遍。采用这种经济模型的政权往往具有民族主义，甚至极端民族主义的倾向。因此，它往往优先考虑军事利益，而非公民福祉。§!"
 econ_socialist_market: "§Y社会主义市场§!"
 econ_socialist_market_tooltip: "\n\n\n\n\n£GFX_ZZZ_socialist_market_banner\n\n\n\n\n\n§g在社会主义市场经济，政府与私营企业合作，共同建设一个更加公平的社会。仍然会有国有企业控制国家命脉，并且政府会监督经济保证公平，而私营企业则专注运营和发展。\n该制度的主要目标之一，是确保每个人都能得到最基本的服务，如食品、住房、医疗保健。另一个目标是促进创新、鼓励创业，让企业以公众的最大利益为出发点运转。§!"
 econ_collective_capitalism: "§Y集体资本主义§!"
 econ_collective_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_collective_capitalism_banner\n\n\n\n\n\n§g集体资本主义是一种日式经济模式，其最大的特点为企业与政府之间的紧密关系，以及公司与其供应商、客户和其他利益相关者之间的强大合作关系。该模式注重长期稳定与协作，而非竞争与垄断。且企业与社会保持密切关系，抱着彼此同甘共苦的理念。§!"
 econ_worker_controlled_economy: "§Y工人主导经济§!"
 econ_worker_controlled_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_worker_controlled_banner\n\n\n\n\n\n§g人们普遍认为计划经济等于政府控制的经济，实际并非如此。\n工人主导经济就不由国家官员管理，而是由工人自己管理。通过工人委员会、工会这些机构，工人能对自己的生产直接控制，享有相当高的自主权。§!"
 econ_kaiser_economy: "§Y帝国公民经济§!"
 econ_kaiser_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_kaiser_economy_banner\n\n\n\n\n\n§g君主制复辟后的经济是一张由新封建主义与农业主导所编织而成的一张大网。我们将银行视为所有社会弊病的源头，但不仅止于此——我们将犹太人视为德国经济与乡村地区衰退的直接原因，而都市化便是犹太银行的利益阴谋。\n帝国公民经济追求创造富有活力的乡村市场，并专注于对环境低破坏的小型企业发展。剩下的工业潜能则将被用于满足我们不断扩张的军队规模。§!"
 econ_maga_capitalism: "§YMAGA资本主义§!"
 econ_maga_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_maga_capitalism_banner\n\n\n\n\n\n§gMAGA资本主义——其虽沿袭了美国资本主义模式的基本框架，但相较之下，这一制度具有更鲜明的保护主义色彩，且不会向大企业妥协。\n其核心在于扶持小型独立企业、个体经营者和中型企业，并通过严格的反垄断法规遏制经济权力的过度集中。\n该体系的另一显著特点是高度关注劳动者权益，旨在维护并完善社会保障、医疗保险等福利制度，同时着力减轻这些政策对国民经济造成的负担。§!"  
 econ_party_state_capitalism: "§Y党国资本主义§!"
 econ_party_state_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_party_state_capitalism_banner\n\n\n\n\n\n§g党国资本主义，这一经济模式的独特之处在于，政治力量的主导权并非来自传统国家机构，而是由凌驾于国家机器之上的政党体系所形成的双重治理结构。\n其突出特征包括：党组织向私营企业乃至外资公司渗透延伸，构建新型经济治理网络；国家资本突破国有企业边界进行金融化扩张，形成所谓"资本的国家化"进程；产业政策通过五年规划与专项基金相结合的方式实现体系化升级，逐步演变为党领导经济的制度性抓手。§!"
 econ_mixed_economy: "§Y混合经济模式§!"
 econ_mixed_economy_tooltip: "\n\n\n\n\n£GFX_ZZZ_mixed_economy_banner\n\n\n\n\n\n§g混合经济是一种结合了资本主义（如私营企业）和社会主义（如国有化的政府服务）两种要素的经济体系\n定义混合经济的方式各不相同。例如，有人说它是一种市场经济和计划经济相结合的经济体制。另一些人说，它是市场与国家干预主义的结合产物，或是私营企业与公共企业的结合产物。§!"
 econ_inclusive_capitalism: "§Y包容性资本主义§!"
 econ_inclusive_capitalism_tooltip: "\n\n\n\n\n£GFX_ZZZ_inclusive_capitalism_banner\n\n\n\n\n\n§g包容性资本主义——这是一种旨在构建更公平、更均衡的经济价值分配体系，并解决日益加剧的收入与财富不平等问题的经济理论。\n包容性资本主义的核心在于推动可持续增长，使各方利益均能得到保障，包括企业、投资者、劳动者、消费者、政府、地方社区、整个社会乃至自然环境。§!"

