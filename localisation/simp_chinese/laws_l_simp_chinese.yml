 higher_female_desc: "\n“昨天确实有点不理智，但我已经恢复过来啦~\n\n不好意思啦~我确实是保研成功啦！我也确实顺利毕业啦~\n然后我之后还会继续美美读博，继续在自己喜欢的专业发光发热。\n\n至于肖同学，我想保研会很困难吧。可能会想努力申请境外的学校？不管是哪所学校都会收到我的证据材料[爱心]\n至于肖同学，是学法的吧，之后还会想法考的吧（不好意思我已经通过法考啦），我会继续jb的，希望他能顺利从业（但我想会很难）\n\n因为不知道b站的私信评论怎么关，所以我短期不会上b站啦”\n- 杨景媛"
