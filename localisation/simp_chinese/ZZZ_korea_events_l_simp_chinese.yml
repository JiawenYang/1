l_simp_chinese:
 zzz_kor.1.t:0 "半岛和谈重启"
 zzz_kor.1.d:0 "停战七十余年后，北方与南方再次坐到同一张谈判桌前。国际社会为会谈提供了场地与担保，双方代表在闭门会议中围绕互信措施、经济合作与未来安排交换意见。谈判能否走得更远，取决于两边政府此刻的判断。"
 zzz_kor.1.a:0 "继续谈下去。"
 zzz_kor.1.b:0 "中止这轮对话。"
 zzz_kor.2.t:0 "半岛邦联成立"
 zzz_kor.2.d:0 "谈判取得突破。双方签署了一份框架协定：不合并国家、不更改边界，先把两个政权绑进同一个军事同盟，以此作为走向最终统一的过渡。协定在地区内引发复杂反应——有人称之为务实的一步，也有人担心这只是把分裂制度化。"
 zzz_kor.2.a:0 "一个民族，两个国家，一个同盟。"
 zzz_kor.3.t:0 "对话破裂"
 zzz_kor.3.d:0 "会谈在最后一轮未能达成共识。双方在安全保证与政治安排上各执一词，代表先后离席。停战线重新安静下来，但那份未签署的文件留在了桌上，成为下一次尝试的起点，或是不再尝试的理由。"
 zzz_kor.3.a:0 "我们已经尽力。"
 zzz_kor.4.t:0 "半岛在平壤的旗帜下统一"
 zzz_kor.4.d:0 "北方军队越过旧停战线，南方的抵抗在数周内瓦解。平壤宣布半岛统一，新国家沿用朝鲜人民共和国的名号，把首都设在首尔。旧南方的政党被解散或并入，选举将在新的框架下举行——至于这个框架留给反对者的空间有多大，没有人给出答案。"
 zzz_kor.4.a:0 "分裂的时代结束了。"
 zzz_kor.5.t:0 "半岛在首尔的旗帜下统一"
 zzz_kor.5.d:0 "南方军队推进至图们江，北方的政权在崩溃中交出武装。首尔宣布半岛统一，大韩民国的宪法与选举制度延伸至整个半岛。旧北方的干部面临清算或收编，数百万居民一夜之间换了国籍——整合的代价，此后才会真正显现。"
 zzz_kor.5.a:0 "由宪法与选票决定。"
 zzz_kor.6.t:0 "朝鲜人民共和国宣告成立"
 zzz_kor.6.d:0 "统一后的国家正式确立国号：朝鲜人民共和国。新政权宣称承袭1945年临时政府的传统，把首都定在首尔，并承诺以全半岛自由选举产生政府。北京与多数地区国家发来贺电，东京保持沉默。"
 zzz_kor.6.a:0 "一个半岛，一个国家。"
 zzz_kor.7.t:0 "朝鲜人民共和国成立"
 zzz_kor.7.d:0 "【首尔】随着统一程序完成，朝鲜半岛七十余年的分裂宣告结束。新成立的朝鲜人民共和国在成立宣言中承诺举行全半岛自由选举。地区各国对协定的态度并不一致，华盛顿与北京都在等待选举结果。"
 zzz_kor.7.a:0 "历史翻开新的一页。"
 zzz_kor.8.t:0 "全半岛首次大选"
 zzz_kor.8.d:0 "国际观察员监督下的首次全半岛选举完成计票。南方进步阵营与北方朝鲜社会民主党组成联合竞选阵线，以治愈分裂为纲领赢得多数。投票率创下半岛纪录：从济州到图们江，同一个票箱里装着两段互不相同的记忆。"
 zzz_kor.8.a:0 "沈相奵当选首任总统。"
 zzz_kor.9.t:0 "全半岛大选结果公布"
 zzz_kor.9.d:0 "【首尔】全半岛首次大选的最终结果公布。新政府将在联邦式的框架内接管南北两套行政体系，首要议题是财政整合、军队合并与离散家属的重聚。观察员称选举过程基本自由，但也指出北方部分地区的组织条件并不平等。"
 zzz_kor.9.a:0 "新政府开始执政。"
 zzz_kor.10.t:0 "全半岛首次全国选举"
 zzz_kor.10.d:0 "北方并入南方、半岛置于首尔行政之下后，大韩民国举行覆盖全半岛的首次全国选举。旧北方的选民第一次走进多党竞选的投票站，选举结果交由选票决定，不预先钦定任何候选人。"
 zzz_kor.10.a:0 "由选票决定。"
 zzz_kor.11.t:0 "志愿军遗骸归国"
 zzz_kor.11.d:0 "【沈阳】一批在半岛战争中阵亡的志愿军遗骸由专机接运回国，安葬于烈士陵园。朝韩双方在交接仪式上罕见地同时派出代表。对北京而言，这是历史问题的收尾；对半岛而言，这意味着那场七十年前的战争终于被允许真正结束。"
 zzz_kor.11.a:0 "英魂归故里。"
