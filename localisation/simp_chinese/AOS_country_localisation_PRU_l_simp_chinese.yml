PRU_fujimori_teikoku: "藤森帝国"
PRU_fujimori_teikoku_desc: "藤森帝国代表藤森家族对秘鲁的持久统治。尽管阿尔贝托·藤森仍然是国家的最高政治人物，但他的高龄逐渐限制了他对政府事务的直接参与。因此，国家的大部分行政管理由最接近他的人进行，形成了一个权威源于藤森家族声望和遗产的体系。支持者认为这种安排是稳定和连续性的来源，而批评者则将其视为政治王朝内的权力集中。该政权通常被称为幕府，借鉴日本历史政治结构的比较。在这个类比中，阿尔贝托·藤森担任象征性的天皇，合法性和民族团结的最终来源，而国家的日常治理委托给一个更活跃的人物，以他的名义行使权力。在幕府中，将军是：§Y藤森庆子§！\n\n\n\n\n\n\n\n   £GFX_texticons_PRU_keiko_fujimori_2\n\n\n\n\n\n\n\n\n-------------------------------------"
PRU_never_truly_gone: "从未真正消失"
PRU_never_truly_gone_desc: "在遥远的委内瑞拉安第斯山脉，有一个人，尽管过着相当平凡的生活，喜欢在山间漫步，但拥有我国许多人只能梦想获得的头衔：秘鲁共和国总统兼武装部队总司令。\n\n他通过政变夺取共和国全部权力的尝试失败了，所以他很幸运有外国政府的朋友愿意收留他，使他远离在秘鲁等待他的法律后果。他本可以轻易放弃那个头衔，致力于远离家乡的和平生活，但最初选举他的人民仍然恳求他回来，面对日益专制的右翼政府，他将自己视为秘鲁贫困民众的救世主，就像天上的主一样，他发誓要尽一切努力根除几十年来吞噬他国家的腐败，将国家的统治权归还其合法主人：人民。\n\n§Y这位政变者无法承认他在我们努力维护的民主体制手中的失败，已宣布打算再次尝试运气，这次借助已经吞噬命运多舛的哥伦比亚共和国的玻利瓦尔军队。作为祖国的高贵儿女，我们有责任保护她免受外国征服，无论代价如何。§！\n\n§R佩德罗·卡斯蒂略§！§Y，前总统、政变者和秘鲁法律的逃犯，正在委内瑞拉加拉加斯领导非法流亡政府。§！"
PRU_kamikaze: "神风"
PRU_kamikaze_desc: "总有一天，他们会降落在通贝斯和普诺的街道上，带着他们在哥伦比亚表现出的对人类的同样蔑视，企图亵渎我们的土地。他们会啃咬我们的孩子，在我们的田野上排便，然后将我们的家园和避难所变成废墟，将里面的人变成红色薄雾。社会主义将被带到秘鲁，堆在一座比我们祖先攀登过的任何山脉都更高的头骨山上。\n\n几十年前，我们的总统带领我们在亚马逊高地与厄瓜多尔兄弟进行了一场小型但激烈的战争。多亏了两国的善意，战争只持续了一个月，但在如此短的时间内遭受的伤亡让我们意识到长期战争的可怕概念。与我们以前的敌人不同，这些生物不想要仅仅改变边界，而是想要彻底征服我们的国家并建立傀儡政权，这也会带来蹂躏他们自己祖国的那种可恶的社会主义形式，迫使超过一百万公民到我们国家寻求庇护。\n\n台湾人连同他们的日本和澳大利亚盟友以无畏的勇气和无私精神战斗，保护他们的岛屿免受更大的红色威胁。我们将效仿他们的榜样。让我们成为抵御威胁吞噬整个南美洲的红色浪潮的堡垒。让外国人来到我们的海岸，在我们的英雄斗争中找到他们的价值，让我们自己的公民，勇敢的秘鲁人民，再次团结在国旗周围，保护我们亲爱的母亲免受那些想要亵渎她的人。"
PRU_western_hub_of_the_pacific: "太平洋西部枢纽"
PRU_western_hub_of_the_pacific_desc: "随着南方共同市场、太平洋联盟和美国经济巨兽的崩溃，大陆上剩下的民主国家必须迅速适应这种新形势，最终决定放弃那些旧条约，转而采用一项新条约，该条约将创建一个从乌斯怀亚到通贝斯的自由贸易区，在这个原本暴力的美洲大陆上创造一个安全的投资场所。\n\n虽然阿根廷获得了布鲁塞尔最好的东西，但秘鲁获得了东京最有价值的东西。作为这个经济联盟和太平洋经济共同体的成员，秘鲁经济获得了令人羡慕的推动，这要归功于涌入其股市的大量投资者。人们对这种新状态有不同的看法；对一些人来说，这意味着全新的机器和更有经验的人员来帮助进行提取其他外国势力所需用于电子设备的矿产的大型采矿作业，对另一些人来说，这意味着更多来自亚洲的渔船涌入秘鲁的专属经济区，以牺牲国家的本地渔业为代价进行自己的捕鱼作业。\n\n因此，秘鲁经济多年来首次出现增长，允许政府将这些资金重新投资到私营部门、基础设施项目及其有争议的军事建设中，这也得到了PDTO的帮助，他们现在已经成为秘鲁最大的经济伙伴。"