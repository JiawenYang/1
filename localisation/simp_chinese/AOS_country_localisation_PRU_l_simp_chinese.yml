l_simp_chinese:


 # COUNTRY EVENTS
PRU.1.t: "2021年秘鲁选举"
PRU.1.d: "今天，秘鲁举行第二轮选举， stakes 很高。\n\n前总统阿尔贝托·藤森的女儿藤森庆子再次参选，希望获得总统职位并带领秘鲁进入第二个藤森主义时代。\n\n她的挑战者是佩德罗·卡斯蒂略，一位前教师，在2017年罢工期间作为教师工会主席获得了知名度。他希望将\"粉红浪潮\"进一步推向秘鲁本身。\n\n国家极度两极分化，结果胜负难分。随着选票统计，获胜者宣布……"
PRU.1.a: "佩德罗·卡斯蒂略获胜！"

PRU.2.t: "卡斯蒂略总统解散国会！"
PRU.2.d: "进入办公室一年后，卡斯蒂略总统未能克服国家的政治分裂。已经面临两次共和国国会的弹劾失败，议员们正式启动了第三次尝试。很明显，国会不想与政府合作，因此不可信。\n\n然而，总统有一个解决持续危机的计划。\n1. 解散国会。\n2. 重组司法系统、司法机构、公共部门和宪法法院。\n3. 组织制宪大会选举，起草秘鲁新宪法。\n\n总统将发表讲话，正式在第三次弹劾中公开为自己辩护。他们不指望本届政府会再玩他们的游戏。"
PRU.2.a: "\"……在新选举举行之前，我们将以法令治理。\""

PRU.3.t: "军队向利马进军！"
PRU.3.d: "看来我们的控制并不像我们想象的那样牢固。军队单方面谴责我们的政变，并宣布他们将\"维护宪法\"为由罢免我们的政府。他们的行动比预期更快，军事力量已经进入首都。\n\n我们没有希望自卫。我们必须撤离这个国家，并希望找到扭转局势的方法……"
PRU.3.a: "\"操……快点，准备一架飞往加拉加斯的飞机。\""

PRU.4.t: "军政府释放阿尔贝托·藤森"
PRU.4.d: "秘鲁右翼领导人阿尔贝托·藤森被他执政后横行的左翼激进分子不公平地诋毁。尽管2017年获得总统赦免，他仍然被关在监狱里。这种不公不能容忍。作为象征性的和解行动，并希望加强社会主义的反对者，藤森将立即从监狱释放。"
PRU.4.a: "藤森主义的回归在望吗？"

PRU.5.t: "2023年秘鲁选举"
PRU.5.d: "军政府结束了。现在国家处于控制之下，社会主义被踩在脚下，新的文官政府将扎根。除了与卡斯蒂略政府有关联的政党外，所有政党都被允许参与。\n\n然而，没有一个政党拥有人民力量党的知名度，或者更确切地说，他们的候选人：阿尔贝托·藤森。在他的女儿藤森庆子的推动下，藤森主义得以延续，阿尔贝托·藤森是自然的领跑者，没有其他候选人形成有效的反对。\n\n23年来第一次：藤森回来了。"
PRU.5.a: "这一次，他将留下。"

PRU.6.t: "佩德罗·卡斯蒂略宣布流亡政府！"
PRU.6.d: "佩德罗·卡斯蒂略这只老鼠早已在加拉加斯的毒蛇巢穴中安顿下来，他谴责我们的选举是欺诈性的，我们的政府是犯罪的。他宣布自己仍然是秘鲁的合法总统，并在加拉加斯建立了流亡政府。委内瑞拉政府和美洲其他左翼力量已经承认他为合法总统。\n\n看来他决心成为我们永远的眼中钉。更糟的是。尽管委内瑞拉正遭受自身的内部冲突，但全球当前的混乱迫使我们考虑局势仍可能升级。"
PRU.6.a: "确保那只老鼠没有计划任何事情……"

 # NEWS EVENTS
PRU.news.1.t: "佩德罗·卡斯蒂略赢得秘鲁选举"
PRU.news.1.d: "利马，秘鲁（美联社）——教师出身的政治家佩德罗·卡斯蒂略在一场异常激烈的竞争中赢得了秘鲁的第二轮选举。领先仅0.26%的选票，当选总统卡斯蒂略将在一个深度分裂的国家中就职，但仍然乐观地认为他的政治项目将\"为秘鲁带来它应得的改变\"。\n\n由于投票如此接近，且预测在宣布获胜者之前每小时都在变化，双方都指控对方存在选举欺诈，双方在夜间不同时间都有推翻选举的行动传闻。\n\n当选总统卡斯蒂略宣布获胜后，他的对手、右翼人物和前总统阿尔贝托·藤森的女儿藤森庆子领导抗议试图推翻选举，在利马与卡斯蒂略的激进支持者发生紧张对峙。虽然藤森的策略失败了，但这象征着这个安第斯国家的深刻分裂。\n\n秘鲁国会同样分裂，没有任何政党获得多数席位。专家预测反对卡斯蒂略的联盟很可能控制立法宫。看来秘鲁持续的政治分裂远未结束。"
PRU.news.1.a: "粉红浪潮淹没安第斯山脉"

PRU.news.2.t: "卡斯蒂略总统在秘鲁自我政变"
PRU.news.2.d: "利马，秘鲁（美联社）——秘鲁今天震惊了，佩德罗·卡斯蒂略总统解散了国会并接管了紧急权力，宣布他将以法令统治，直到举行新选举，成立一个\"制宪大会\"来重写秘鲁宪法。\n\n这一举措是卡斯蒂略政府艰难一年的顶点，发生在国会提出第三次弹劾总统之后。卡斯蒂略本应在法律上对抗指控，但他反而智胜了秘鲁反对派。虽然国会和宪法法院拒绝了他的行动，但总统已经压制了异议，他的立场现在看起来已经稳固。\n\n该国许多人震惊地发现他们的宪法民主似乎一夜之间消失了。专家评论说，卡斯蒂略的成功可能归功于一种力量和团结的表象。由于他的内阁许多成员自他宣布以来一直没有露面，人们相信政府在卡斯蒂略行动下团结的表象导致各反对党领导人放弃立场，而不是冒着公开支持国会引发内战的风险。首都流传着关于反对这一举措的政府和内阁成员被软禁的谣言，政府对此予以否认。\n\n秘鲁的未来不确定，该地区各国政府正争先恐后地组织对秘鲁新秩序的回应。"
PRU.news.2.a: "安第斯山脉变得更热"

PRU.news.3.t: "秘鲁军事政变"
PRU.news.3.d: "利马，秘鲁（美联社）——秘鲁局势再次发生转折，上个月夺取独裁控制权的卡斯蒂略总统被秘鲁军队推翻。军方宣布行动是\"为了捍卫秘鲁国家和维护宪法\"。军事单位仍在利马街头占领，有传言称逮捕了任何与卡斯蒂略政府有关联的人。\n\n卡斯蒂略总统本人成功逃脱了抓捕。在军队进入利马时得到政变的消息，他通过飞机逃脱，并降落在加拉加斯，在那里获得了庇护。他已经发表声明谴责这场政变是秘鲁美好未来希望的终结。\n\n局势似乎终于稳定下来，秘鲁军队现在控制着这个国家。他们将如何处理它还有待观察。"
PRU.news.3.a: "安第斯山脉会降温吗？"

PRU.news.6.t: "佩德罗·卡斯蒂略宣布流亡政府！"
PRU.news.6.d: "加拉加斯，委内瑞拉（美联社）——流亡的秘鲁总统佩德罗·卡斯蒂略今天发表了一项重大声明：他拒绝承认现任秘鲁政府为合法政府，并将在利马设立一个反对流亡政府。这是在阿尔贝托·藤森在军政府组织的最近选举后重返秘鲁总统职位之后发生的。卡斯蒂略谴责藤森为\"一个暴君，试图再次将秘鲁领土化\"。卡斯蒂略的东道主委内瑞拉政府已经承认他的政府为合法政府。\n\n具有讽刺意味的是，这意味着委内瑞拉正在反映其2019年的总统危机，当时美国承认反对派领导人胡安·瓜伊多为委内瑞拉总统，只是现在是他们支持一位流亡的宣称者。\n\n随着混乱在美洲蔓延，又一个国家有两个互相仇恨的人声称自己是总统，从加拉加斯到布宜诺斯艾利斯，大陆每个首都都在问一个问题：\"会再来一场战争吗？\""
PRU.news.6.a: "天啊，现在有两个了。"
