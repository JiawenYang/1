 # NIC #
NIC.1.t: "FSLN宣布中美洲联邦"
NIC.1.d: "尼加拉瓜总统丹尼尔·奥尔特加和执政的桑地诺民族解放阵线（FSLN）今天出人意料地宣布成立中美洲联邦。奥尔特加在声明中承诺将不惜一切手段团结中美洲国家，引发了该地区对冲突的担忧。\n\n这一声明是在持续的第二次美国内战背景下发表的，这场内战使美国忙于内部冲突，在该地区留下了权力真空。奥尔特加的野心得到了古巴、委内瑞拉和中国政府的支持，他们支持这一举措，认为这是加强地区自治和平衡美国影响力的一种方式。然而，其他中美洲国家，包括危地马拉、萨尔瓦多、洪都拉斯、哥斯达黎加和巴拿马，谴责了奥尔特加的声明，将其解释为侵略的隐晦威胁。这些国家认为尼加拉瓜的最终目标是利用美国当前的不稳定局势夺取具有战略意义的巴拿马运河的控制权。为应对不断升级的紧张局势，美洲国家组织（OAS）已呼吁召开紧急会议，讨论中美洲联邦宣言对地区稳定构成的潜在威胁。"
NIC.1.a: "角色扮演"
NIC.1.b: "MMA级别的写作"

NIC.2.t: "运河战争"
NIC.2.d: "一个令人震惊的消息：尼加拉瓜总统丹尼尔·奥尔特加今天宣布他的国家正式对邻国哥斯达黎加和巴拿马宣战，加剧了中美洲地区的紧张局势。这一声明是在奥尔特加和执政的桑地诺民族解放阵线（FSLN）宣布成立中美洲联邦并承诺不惜一切手段团结该地区仅几周后发表的。尼加拉瓜的侵略姿态引起了其邻国和国际社会的警惕。\n\n哥斯达黎加和巴拿马这两个没有常备军队的国家，已呼吁美洲国家组织（OAS）召开紧急会议，讨论危机并寻求其他成员国的支持。与此同时，他们已动员国家警察部队和安全机构加强边境安全并维持公共秩序。世界各国对中美洲冲突的突然升级表示关切，许多国家呼吁立即进行国际干预，以防止这场战争可能带来的灾难性影响。"
NIC.2.a: "2周"
NIC.2.b: "2周"

NIC.3.t: "加密帝国"
NIC.3.d: "飞向月球。"
NIC.3.a: "战争扩大"

