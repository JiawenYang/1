PAR.1.t: "阿夫多梦游仙境"
PAR.1.d: "对博索纳罗总统来说，这是漫长而疲惫的一天——又一个二十四小时被与部长的会议、新闻发布会和无休止的采访占据，都是因为阿拉伯人。对总统来说，这次会议最初似乎只是他已经排得满满的日程表中的又一项安排，至少直到他想起究竟是谁在等他：马里奥·阿夫多·贝尼特斯，巴拉圭总统。不过，那只是巴拉圭——博索纳罗还能从他身上期待什么呢？\n\n接着是一系列握手，然后是两位总统对着镜头微笑的精心安排的照片，之后会议终于进入了真正的目的。两人坐在一个小接待室里，交换了几句礼节性的话后，谈话转向了巴拉圭总统来访的原因。\n\n\"总统先生，我想讨论……在这场能源危机期间我们两国之间的合作，\"阿夫多开始说，尽管他的声音听起来连博索纳罗都觉得不确定。\"巴拉圭迫切需要外国援助来应对石油危机的后果，\"巴拉圭总统继续说道，这立刻在博索纳罗脑海中引发了一个问题：他为什么不去阿根廷的赞助人那里寻求帮助呢？不过，博索纳罗选择不把话说出口。\n\n\"巴拉圭准备重新考虑其地缘政治立场，\"阿夫多小心翼翼地补充道，\"或者更确切地说，重新考虑谁真正是——以及谁不是——巴拉圭的朋友。\"博索纳罗听到这些话的那一刻，眼中闪过一丝光芒。削弱阿根廷在南美——特别是在巴拉圭——的影响力将是巴西和博索纳罗个人的重大胜利。这是一个机会，一个巨大的机会，需要仔细考虑。\n\n然而巴西本身也在危机中挣扎，将宝贵的资源转移到国外几乎肯定会激怒支持博索纳罗的民族主义基础。即便如此，任何潜在援助的规模必须现在决定。"
PAR.1.a: "巴西准备开始与你全面合作，总统先生。"
PAR.1.b: "我们准备在一定程度上帮助你应对后果，总统先生。"
PAR.1.c: "我们愿意为你提供非常……少量的援助。巴西本身也不是处于最佳状态，总统先生。"
PAR.1.e: "我们的协议可以超越救济措施，总统先生。也许是时候深化我们的地区一体化了。"
PAR.1.f: "我们的炼油厂欢迎生意，总统先生。我相信你会开出公平的价格。"
 BOL_contested_transitional_government:0 "受争议的过渡政府"
 BOL_contested_transitional_government_desc:0 "有争议的临时政府缺乏执政合法性，政治权力与稳定持续流失，每项决策的成本都被抬高。"
 BOL_cruceno_productive_model:0 "圣克鲁斯生产模式"
 BOL_cruceno_productive_model_desc:0 "圣克鲁斯模式偏向私人农业综合企业与工业投资，以社会代价换取增长。"
 BOL_discredited_security_forces:0 "信誉扫地的安全部队"
 BOL_discredited_security_forces_desc:0 "安全部队在强硬执法事件后失去公众信任，士气、组织与征兵都受到削弱。"
 BOL_exhaustion_of_the_gas_model:0 "天然气模式的枯竭"
 BOL_exhaustion_of_the_gas_model_desc:0 "玻利维亚的天然气模式已耗尽：出口收入下降、工业失去竞争力、财政赤字扩大。"
 BOL_the_chapare_factor:0 "查帕雷自卫军因素"
 BOL_the_chapare_factor_desc:0 "查帕雷自卫组织令反叛乱作战复杂化：后勤迟缓、兵源稀少、补给消耗沉重。"
 CHL_estallido_social_idea_desc:0 "社会动荡使经济瘫痪并抽干政府权威，同时把选民推向左翼。"
 CHL_mining_economy:0 "矿业经济"
 CHL_mining_economy_desc:0 "智利流通的每十比索中，就有一比索来自同一个产业：采矿业。作为世界领先的铜生产国（约占全球产量的30%）和锂的主要产地之一，智利相当大比例的GDP都建立在矿业资源开采之上。在智利国家铜业公司和必和必拓等矿业巨头的推动下，矿业已成为该国经济支柱和出口的核心。\n\n然而，智利如今正面临困境。港口出口物流持续中断，严重的干旱已持续近十年，其矿石的金属含量也在持续下降。面对这些挑战，智利或许终将被迫重新审视其经济模式的根基，在支撑了数代人的矿山之外寻找新的增长引擎。"
 CHL_pinochet_legacy_idea_desc:0 "皮诺切特的遗产仍是未愈的政治创伤，滋养威权思潮并抽干合法性。"
 CHL_terrorist_attacks_in_patagonia:0 "巴塔哥尼亚的恐怖袭击"
 CHL_terrorist_attacks_in_patagonia_desc:0 "早在20世纪70年代，当皮诺切特签署第701号法令并补贴私营林业公司时，很少有人能预见到随之而来的冲突。1997年12月1日，马普切活动分子在卢马科袭击林业卡车，这一事件被许多人视为马普切-智利冲突的开端。如今这场冲突已进入第三个十年，智利政府未能消除马普切人的挑战，而民众的不满情绪却持续增长。马普切团体仍在破坏设备、纵火，有时甚至发动武装对抗。与此同时，社会动荡的大背景下，越来越多的智利人呼吁在宪法上承认原住民的自治权，即使部分农村地区因与该冲突相关的袭击而陷入火海。这场消耗战将持续下去，直到一方最终耗尽继续抗争的意志。"
 CHL_the_legacy_of_pinochets_constitution:0 "皮诺切特宪法的遗产 - §R摇摇欲坠§!"
 CHL_the_legacy_of_pinochets_constitution_desc:0 "自1980年以来的四十年间，即便经过2005年宪法改革，其最重要的根基依然如故。第一条确立辅助性原则，实质上将新自由主义奉为圭臬，甚至将养老金、医疗、教育乃至水资源等基本权利私有化，1981年《水法》已实现水资源的完全私有化。宪法的另一宗旨是维护现状，要求修改组织性宪法法律必须获得绝对多数支持。同时，宪法法院依然存在，能够阻止旨在保护消费者权利、削弱劳动法改革以及在社会党人米歇尔·巴切莱特第二任期内保护大学商业化的立法。\n\n但这部宪法的遗产已深陷民意低谷，近年爆发的社会骚乱导致左翼和中间派都要求废除1980年宪法。显然，皮诺切特留下的政治遗产时日无多了。"
 CHL_the_most_efficient_army_in_south_america:0 "南美洲的高效之军"
 CHL_the_most_efficient_army_in_south_america_desc:0 "智利陆军可谓是南美洲最有效的军事力量，这很大程度上归功于铜出口收入的10%被分配给武装部队。智利陆军成立于1810年，曾参与对秘鲁和玻利维亚联邦的战争、太平洋战争，甚至在20世纪下半叶险些与阿根廷开战。对陆军最重要的影响包括埃米尔·克纳上尉领导下的普鲁士化改革，以及《里约条约》之后美国的影响。如今，凭借其高度的摩托化、对机动性的重视，以及在各种情况下都能持续维持现代化的稳定资源流，智利陆军已赢得其作为南美洲最有效军队的声誉。"
 CHL_the_social_outburst:0 "社会动荡"
 CHL_the_social_outburst_desc:0 "智利正经历自皮诺切特独裁以来最大规模的公民不服从浪潮，日复一日的抗议活动震动全国。最初只是学生反对圣地亚哥地铁票价上涨30比索的简单反抗，如今已演变为全国性的愤怒爆发，针对养老金发放金额低于贫困线的私有化养老金体系、严重不平等以及基本服务（尤其是水资源）的私有化。即使2019年11月15日已宣布将于2020年4月举行宪法公投，抗议活动仍在继续，而流血的眼睛形象已成为警察暴力的标志性象征。\n\n皮涅拉注定成为跛脚鸭。智利经济遭受重创，政治极端两极分化。这个国家已被推向悬崖边缘，新的政治力量开始在民调中占据主导地位只是时间问题。"
 COL_american_dependence:0 "对美国的依赖"
 COL_american_dependence_desc:0 "哥伦比亚与华盛顿的紧密结盟带来投资与安全合作，却让经济暴露于外部决策之下。"
 COL_colombian_agro_extractive_model:0 "哥伦比亚农业—采掘模式"
 COL_colombian_agro_extractive_model_desc:0 "农业抽取型模式把增长绑定在商品出口上，缓解消费成本并支撑贸易关系。"
 COL_colombian_armed_forces_desc:0 "规模庞大且久经战阵的军队支撑着国家，组织与内部冲突经验俱佳。"
 COL_national_unity_governament_idea_desc:0 "民族团结政府把对立派系纳入同一内阁，换来稳定与更广泛的军事共识。"
 COL_never_ending_war:0 "永无止境的战争"
 COL_never_ending_war_desc:0 "长期内部战争年复一年地消耗政治权力、稳定、人口与工业。"
 COL_the_great_colombian_counterinsurgent_army:0 "伟大的哥伦比亚反叛乱军"
 COL_the_great_colombian_counterinsurgent_army_desc:0 "为长期内部战争打造的反叛乱军队：防御坚实、士气高昂、兵源深厚。"
 COL_the_invisible_hand:0 "庄家通吃"
 COL_the_invisible_hand_desc:0 "私人权力的无形之手掏空国家：政治权力与社会发展双双下滑。"
 COL_vultures_of_colombia_profunda:0 "深哥伦比亚的毒瘤"
 COL_vultures_of_colombia_profunda_desc:0 "哥伦比亚深处的毒瘤：犯罪网络榨取边缘地区、削弱地方防御并滋养激进思潮。"
 ECU_consequences_of_the_end_of_the_oil_era:0 "石油时代终结的后果"
 ECU_consequences_of_the_end_of_the_oil_era_desc:0 "石油时代终结后，出口收入与家庭收入下降，国家失去财政空间。"
 ECU_dolars_dolars_dolars:0 "§G美元！美元！美元！§!"
 ECU_dolars_dolars_dolars_desc:0 "全面美元化锚定价格与预期，恢复贸易与商业信心。"
 ECU_extreme_polarization:0 "极端极化"
 ECU_extreme_polarization_desc:0 "极端两极分化把社会撕成敌对阵营，为两端的激进思潮提供土壤。"
 ECU_freshly_opened_wound:0 "新开的伤口"
 ECU_freshly_opened_wound_desc:0 "新撕开的伤口：政治危机助长两极分化，侵蚀稳定与战争支持。"
 ECU_post_usa_colapse_financial_chaos:0 "糟糕透顶……"
 ECU_post_usa_colapse_financial_chaos_desc:0 "美国秩序崩溃后的金融冲击推高消费成本与商业风险，并拉低生活水平。"
 ELN_foquismo_desc:0 "焦点主义集中小型武装小组实施快速打击：攻击与缴获效率高，组织薄弱且高度依赖缴获装备。"
 FRC_revolutionary_mafia_desc:0 "革命黑帮把政治暴力与犯罪事业融为一体，靠敲诈与贩运自筹资金，在对外事务上亦咄咄逼人。"
