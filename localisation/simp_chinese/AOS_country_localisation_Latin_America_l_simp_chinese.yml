PAR.1.t: "阿夫多梦游仙境"
PAR.1.d: "对博索纳罗总统来说，这是漫长而疲惫的一天——又一个二十四小时被与部长的会议、新闻发布会和无休止的采访占据，都是因为阿拉伯人。对总统来说，这次会议最初似乎只是他已经排得满满的日程表中的又一项安排，至少直到他想起究竟是谁在等他：马里奥·阿夫多·贝尼特斯，巴拉圭总统。不过，那只是巴拉圭——博索纳罗还能从他身上期待什么呢？\n\n接着是一系列握手，然后是两位总统对着镜头微笑的精心安排的照片，之后会议终于进入了真正的目的。两人坐在一个小接待室里，交换了几句礼节性的话后，谈话转向了巴拉圭总统来访的原因。\n\n\"总统先生，我想讨论……在这场能源危机期间我们两国之间的合作，\"阿夫多开始说，尽管他的声音听起来连博索纳罗都觉得不确定。\"巴拉圭迫切需要外国援助来应对石油危机的后果，\"巴拉圭总统继续说道，这立刻在博索纳罗脑海中引发了一个问题：他为什么不去阿根廷的赞助人那里寻求帮助呢？不过，博索纳罗选择不把话说出口。\n\n\"巴拉圭准备重新考虑其地缘政治立场，\"阿夫多小心翼翼地补充道，\"或者更确切地说，重新考虑谁真正是——以及谁不是——巴拉圭的朋友。\"博索纳罗听到这些话的那一刻，眼中闪过一丝光芒。削弱阿根廷在南美——特别是在巴拉圭——的影响力将是巴西和博索纳罗个人的重大胜利。这是一个机会，一个巨大的机会，需要仔细考虑。\n\n然而巴西本身也在危机中挣扎，将宝贵的资源转移到国外几乎肯定会激怒支持博索纳罗的民族主义基础。即便如此，任何潜在援助的规模必须现在决定。"
PAR.1.a: "巴西准备开始与你全面合作，总统先生。"
PAR.1.b: "我们准备在一定程度上帮助你应对后果，总统先生。"
PAR.1.c: "我们愿意为你提供非常……少量的援助。巴西本身也不是处于最佳状态，总统先生。"
PAR.1.e: "我们的协议可以超越救济措施，总统先生。也许是时候深化我们的地区一体化了。"
PAR.1.f: "我们的炼油厂欢迎生意，总统先生。我相信你会开出公平的价格。"