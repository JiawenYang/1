l_simp_chinese:
 # 朝鲜半岛特别行政区划修正（移植自 TFR Korea Plus，州ID已适配千禧黎明）
 KOR_seoul_city: "首尔特别市"
 KOR_seoul_city_desc: "\n§9六百年的古都心跳依旧随汉江的脉搏奔涌，景福宫的青瓦与光化门的石路在摩天楼的玻璃幕墙间静静对望。江北的老巷里南山塔的灯火彻夜不熄，江南的霓虹之下，清晨五点的补习街早已人潮涌动——这座在半个世纪里把战争废墟锻造成世界都会的城市，把“快一点”刻进了每个人的呼吸，也把“汉江奇迹”写进了这个时代的教科书。\n\n然而光鲜的数字背后，是精心丈量的人生时刻表与令人窒息的房价，是老城区在推土机轰鸣中悄然消逝的记忆。光化门广场的石阶承载过学生革命的呐喊与烛光的海洋，如今民主的喧嚣早已融入日复一日的车流。当第一班地铁驶过汉江铁桥，两千多万人的都会又开始了新一天的竞逐§!\n\n§H汉江奔流不息，六百年都城在废墟与新厦之间，永远追逐着明日的地平线§!"
 KOR_incheon_city: "仁川广域市"
 KOR_incheon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9当红色的夕阳浸透笼罩在浓密海雾中的泥滩时，这座城市才放下喧嚣的时光，深深吸一口粗犷的气息。在开启陌生国门、率先迎接现代化浪潮的开放港的浪漫背后，是侵略的痛苦和激烈工业化的汗水，深深烙印在每一块红砖之中。\n\n当填海而建的玻璃摩天大楼炫耀着耀眼的未来时，隐藏在其阴影下的旧城区老巷则更深地沉入疏离感，在来来往往的巨量卡车和飞机的持续轰鸣中，这座城市忍受着总是送别他人的车站的孤独。这片耀眼的崛起与衰退的剪影危险交织的地方，是发展的欲望与残余的叹息随波声混杂流淌的土地§!\n\n§3离去者的兴奋与留下者的悲伤共存的永恒边界之城§!"
 KOR_busan_city: "釜山广域市"
 KOR_busan_city_desc: "\n§9影岛的灯塔注视着千帆竞发的港湾，札嘎其市场凌晨的吆喝唤醒了山海之间的城市。作为战火中收容百万离乡者的临时首都，釜山把乡愁酿成了山腹道路上一盏盏温黄的灯，把求生的坚韧铸成了集装箱码头昼夜不熄的起重机。海云台的沙滩与广安大桥的灯链是它的名片，但真正托起这座城市的，是鱼市里粗糙的双手与船坞中飞溅的焊花。\n\n这是一座用方言和友情焐热的城市，直率的脾气如海风般不加修饰。每年秋天，国际电影节的星光照亮海云台，但比起红毯，釜山人更相信市场里讨价还价的智慧。山与海把这座城市挤成一条狭长的传奇，每一天巨轮鸣笛离港，载着它的名字驶向世界§!\n\n§L山海之间的不屈之城，把战火的乡愁酿成了向洋而生的豪情§!"
 KOR_ulsan_city: "蔚山广域市"
 KOR_ulsan_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_ulsan_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9拂过太和江十里竹林的风，努力洗刷着过去的污名，但唤醒这座城市黎明的，依旧是巨大造船厂沉重的锤音和工业区沉重的机械声。传说中鲸鱼曾游弋的蓝色大海，被钢铁巨兽利维坦所占据，“连路过的狗都咬着万元钞票”的产业首都传说，脆弱地建立在身着油渍工作服的工人疲惫之上。\n\n彻夜不熄的石化园区璀璨灯火背后，潜伏着“企业城市”结构性不稳定的阴暗面，整座城市的命运都掌握在激烈的劳资冲突和特定财阀企业兴衰的喧嚣之中。这片以天空和海洋为代价换取成长的土地，如今正凝视着制造业引擎渐趋钝化的轰鸣声和吊臂末端生锈的起重机，陷入深深的沉思§!\n\n§g建立在鲸鱼坟墓上的钢铁巨城，繁荣的火炬燃烧着明日呼吸的矛盾帝国§!"
 KOR_daegu_city: "大邱广域市"
 KOR_daegu_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9八公山如屏风般环绕的广阔盆地，至今仍怀揣着比盛夏酷暑更炽热的现代化荣光，如今却无法将冷却的热气向外散发，只能在内部发酵。曾织就全国布匹的纺织机械的雄壮轰鸣和苹果红透的浪漫已消逝于时光书页，只有数十年来停滞不前的经济指标的阴影，沉重地压在这座城市之上。\n\n被称为“保守心脏”的坚固堡垒，既是抵御外部风暴的盾牌，也是隔绝自我的高墙，而那面连变化的气息都未能越过的墙外，是被迅速老去的年轻人所抛弃的地方。被困在与封闭地形一样固执的顽固和排他性中，这是一片爱恨交织的土地，在辉煌过去的骄傲中痛苦地忍受着今天§!\n\n§7我芬芳的故乡，弥漫着凌霄花香\n俯瞰八公山的日出街道\n你和我曾在此梦想\n我梦见了美丽而温柔的梦\n他们一同走过的希望街道\n凌霄花开花落的爱情街道\n大邱是我的故乡，我亲爱的故乡§!"
 KOR_daejeon_city: "大田广域市"
 KOR_daejeon_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_daejeon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9博览桥的拱门在嘉泉江柔和的波浪上高高耸立，仿佛描绘着未来，然而在这座科学城耀眼的光芒之下，却只有理性清冷的寒意残留，而非被称为“韩巴”时期慷慨的好客。这里曾是铁路轨道纵横交错、吸引无数他人足迹的交通枢纽，然而那条路本身也孕育了过客车站的孤独命运，而非让人们在此安家。\n\n被研究园区高墙禁锢的知识如孤岛般漂流，无法融入旧城区的衰落，在“无聊城市”的自嘲玩笑之下，潜藏着根深蒂固的城市厌倦和缺乏认同感的单调与无色彩。这片以位居大韩民国中心为傲、同时又自视为无处归属的外来者之感奇妙共存的地方，是一座因过于井井有条反而被空虚之风席卷的灰色规划城市§!\n\n§2身披科学耀眼外衣的无色换乘站，条条大路通于此，却无人真正停留§!"
 KOR_sejong_special_city: "世宗特别自治市"
 KOR_sejong_special_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_sejong_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9当锦江上的雾气散去，展露的是用尺子和圆规精心切割出的巨大规划城市的冰冷完美。燕岐郡曾桃花盛开的柔软土路，永远被掩埋在沥青和混凝土之下，在均衡发展的宏大目标下建起的政府建筑的宏伟，反而粗暴地抹去了这片土地长久以来的记忆。\n\n夜晚，只有政府大楼塔的灯光如孤岛般漂流，而乘坐开往首尔巴士的陌生人们离去后留下的街道，如同无法正常跳动的人工植入心脏般空洞地律动。在千篇一律的公寓林中，多样性被窒息，虽模仿首尔却尚未成为首尔，只有无魂行政的灰色逻辑支配着这座城市，使其成为未完成的首都§!\n\n§7在地图上用尺子画出的笔直清线中雕琢出的赤裸人工天堂，甚至切去了人的气息和旧记忆§!"
 KOR_gwangju_city: "光州广域市"
 KOR_gwangju_city_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9当无等山温柔的脊线如母亲怀抱般拥抱着这座城市，那名为“光州”的鲜红五月记忆，便在大街小巷的柏油路上熊熊燃烧。以血泪赢得民主的崇高历史成为了这座城市的灵魂，但悖论的是，称其为“民主圣地”的神圣牌匾，也成为了将这座城市束缚于过去的沉重枷锁。\n\n在长期的歧视和政治孤立中未能充分享受工业化果实的这座城市，在灿烂的艺术遗产的骄傲背后隐藏着衰退的阴影，曾经高喊正义的激情呐喊如今迷失方向，在残酷的生存现实前撞得粉碎。这里最先燃烧了时代的黑暗，自身却不得不停留在进步的边缘，至今仍是在自豪的斗争历史和冰封的现实之间抚慰伤痛心灵的土地§!\n\n§t不留爱、不留誉、不留名\n一生向前的热血誓盟\n战友已逝，唯旗飘扬\n直到新日升起，我们决不动摇§!"
 KOR_jeju_special_self_governing_province: "济州特别自治道"
 KOR_jeju_special_self_governing_province_desc: "\n\n\n\n\n\n\n\n\n£GFX_KOR_jeju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n §9当汹涌的波涛拍打黑色玄武岩的每一道缝隙，黄色的油菜花在汉拿山慷慨的怀抱中盛放时，这座岛屿如蕴含原始奥秘的人间天堂般璀璨夺目。然而，嵌在每一滴红色山茶花中的4·3悲剧哀嚎，仍深埋于寄生火山丘之中，外表平和的风景有时反而成为刺痛人心的凄凉悖论。\n\n为了大陆人的浪漫和“治愈”，谷沯洼森林和海岸线被肆意挖掘，在鲁莽开发的重量下呻吟，而泛滥的垃圾和污水正慢慢扼杀海洋曾经纯净的蓝色呼吸。被资本占据的海岸道路被耀眼的“热门地点”填满，失去家园的土著居民却被边缘化，在异国幻象的虚饰之下，这座岛屿正因失去自己的语言和精神而痛苦§!\n\n§O被美丽风景刻意掩盖的血腥悲剧历史和贪婪开发的伤痕——天堂岌岌可危的二重唱§!"
 PRK_pyongyang_city: "平壤特别市"
 PRK_pyongyang_city_desc: "\n§9平壤，革命的首都，是伟大的主体朝鲜的心脏，是我们全体人民心中的故乡。它是伟大领袖金日成同志将祖国从日本帝国主义统治下解放出来、伟大领导者金正日同志以先军革命宝剑坚定守护的不败堡垒。\n\n今日的平壤，在敬爱的最高领导者金正恩同志的英明领导下，正不断实现发展的飞跃，蜕变为令世界赞叹的社会主义理想乡。万寿台上矗立的伟大领袖和伟大将军的铜像，已成为千万军民坚定不移忠诚的灯塔，主体思想塔上熊熊燃烧的不灭火炬，正为世界主体革命事业照亮胜利的前路。\n\n在这里，平壤，我们的金日成民族在党的周围坚定团结，以一心团结的力量推进富强祖国的未来§!\n\n§R即使奉献再奉献，此心无尽——我亲爱的平壤，我爱你……§!"
 # 永恒的领袖（金日成 / 金正日）
 NKO_kim_il_sung_eternal_leader: "永恒的领袖"
 NKO_kim_il_sung_eternal_leader_desc: "§A伟大领袖:§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_il_sung_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§L伟大领袖同志于主体1(1912)年4月15日，诞生在朝鲜近代史上民族灾难悲剧最为沉重交织的革命首都平壤的一个爱国家庭。父亲金亨稷先生对伟大领袖说，应当胸怀远大志向，培养了伟大领袖热爱祖国之心。\n\n伟大领袖同志于主体21(1932)年4月25日组织抗日人民游击队，于主体23(1934)年将组织扩大改编为朝鲜人民革命军，为从在朝鲜半岛施行野蛮殖民统治的日本鬼子手中完全解放祖国，展开了激烈的抗日革命斗争。\n\n伟大领袖同志在历经二十个春秋的抗日革命斗争后，终于将朝鲜半岛从日帝的殖民统治下完全解放。伟大领袖在多个领域奠定了自主独立国家建设的坚实基础，并以此为基础，于主体34(1945)年10月10日创建了我们民族的母亲党——朝鲜劳动党，于主体37(1948)年9月9日创建了历史上首次出现的全体朝鲜人民的伟大祖国——朝鲜民主主义人民共和国。\n\n伟大领袖同志于主体39(1950)年6月25日，为保卫共和国免受威胁我们共和国自主性并发动全面武装进攻的美帝国主义者的侵犯，立即转入反攻，提出了在抗日革命斗争时期创立的多种作战方针，一举击溃了敌人。伟大领袖有效粉碎了美帝国主义者的全面进攻，将伟大的祖国解放战争引向了胜利§!\n\n§H“伟大领袖同志和伟大将军同志将作为主体朝鲜的永恒象征，永远与我们人民同在，领袖和将军所建树的伟大革命业绩将与历史一起永垂不朽。”\n- 敬爱的最高领导者同志§!"
 NKO_kim_jong_il_eternal_leader: "永恒的领导者"
 NKO_kim_jong_il_eternal_leader_desc: "§A伟大将军:§!\n\n\n\n\n\n\n\n\n\n\n\n   £GFX_NKO_kim_jong_il_eternal_leader_portrait\n\n\n\n\n\n-------------------------------------\n§L伟大领导者同志于伟大领袖同志和抗日女英雄金正淑同志展开抗日武装斗争期间的主体31(1942)年2月16日，诞生于白头山密营。伟大将军自主体53(1964)年6月19日在朝鲜劳动党中央委员会开始工作以来，在时代和历史面前立下了不朽的功绩。\n\n伟大领导者同志于主体49(1960)年8月25日现场指导朝鲜人民军近卫首尔柳京守第105坦克师团，倾注最大力量加强人民军队，依靠人民军队的威力强力推进革命和建设的各项事业，踏出了先军政治的第一步，并全方位加强了自立、现代化的国防工业。\n\n伟大领导者同志将伟大领袖同志所创立的伟大革命思想——主体思想正式确立为金日成主义，并将其光大成为党和国家的永恒指导思想，将全社会金日成主义化作为党的最高纲领提出。\n\n伟大领导者同志高高拥戴伟大领袖同志的祖国统一遗训，确立了祖国统一三大宪章，在朝鲜半岛南北之间促成6.15共同宣言和10.4宣言，在“我们民族之间”的理念下，开启了全民族团结一致向前进的自主统一运动的新时代§!\n\n§H“伟大领袖同志和伟大将军同志将作为主体朝鲜的永恒象征，永远与我们人民同在，领袖和将军所建树的伟大革命业绩将与历史一起永垂不朽。”\n- 敬爱的最高领导者同志§!"
