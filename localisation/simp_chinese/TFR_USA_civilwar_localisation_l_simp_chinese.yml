 #美国政治危机与新自由主义秩序事件链（原烈焰升腾美国内战内容已全部移除）
 usacw.5.t: "特朗普遇刺"
 usacw.5.d: "2024年7月13日，前总统在宾夕法尼亚州的集会上遭到枪击，送医后不治。消息传出后，全国进入紧急状态；共和党内部的派系平衡在一夜之间崩塌，阴谋论与报复呼声同时涌上街头。"
 usacw.5.a: "国家需要冷静"
 usacw.6.t: "共和党崩盘"
 usacw.6.d: "特朗普之死让共和党失去了唯一能维系各派的旗帜。2024年11月的选举在暴力威胁与创纪录的投票率中进行，民主党拿下白宫与两院。失败者拒绝承认结果，胜利者则宣称获得授权进行彻底改革。"
 usacw.6.a: "一个时代结束了"
 usacw.7.t: "美国外交停摆"
 usacw.7.d: "2025年1月，白宫与国会的宪政僵局终于蔓延到国务院：大使职位大面积空缺，外交任命无人签字，条约续签与盟国磋商被无限期冻结。华盛顿的同盟承诺沦为一纸空文，各国使馆发回的电报众口一词——美国的外交机器已经停摆。在台北，人们第一次意识到，为他们签署安全保证的那支笔，可能再也没有人拿得起来。"
 usacw.7.a: "华盛顿已无法回应"
 usacw.8.t: "新自由主义秩序全面启动"
 usacw.8.d: "三月一日，白宫与民主党控制的国会同步宣布一揽子“重建共识”法案：放松管制、私有化、技术官僚治国、全面回归全球机构。联邦政府以“效率”之名绕过瘫痪的州权争论，硅谷与华尔街的顾问直接进驻各部委。批评者称其为一场不流血的政变，而支持者坚信这是美国走出失能的唯一道路。"
 usacw.8.a: "新秩序开始了"
 usacw.9.t: "全球干预授权"
 usacw.9.d: "四月十五日，国会以压倒性多数通过《全球稳定授权法案》，赋予行政部门在欧亚大陆任意部署美军的空白支票。新自由主义的国内秩序需要廉价的能源、开放的航道与顺从的盟友——而这一切都要靠航母与无人机去赢得。从这一刻起，美国的国运与欧亚战场的胜负被彻底焊死。"
 usacw.9.a: "没有退路"
 usacw.10.t: "赌上国运"
 usacw.10.d: "独立日的焰火照常升起，但所有人都清楚这个国家在庆祝什么。白宫把全部政治资本押在了一个承诺上：只要欧亚大陆的军事行动获胜，新秩序就会带来下一个黄金三十年；一旦失败，等待美国的将是比大萧条更深的清算。这是一场以国运为筹码的豪赌。"
 usacw.10.a: "胜负即存亡"
 usacw.12.t: "千秋万代的多数党"
 usacw.12.d: "欧亚战场的胜利为新自由主义秩序加冕。廉价的资源与胜利的红利涌入国内，反对党在民调中崩塌为个位数。媒体开始公开讨论“一党长期执政”是否就是美国政治的最终形态——毕竟，胜利者不应被轮换。民主党的时代，看上去没有尽头。"
 usacw.12.a: "一个时代的开始"
 usacw.13.t: "大清算"
 usacw.13.d: "欧亚战场的溃败戳穿了新自由主义秩序的全部谎言。愤怒的公众把失败归咎于那个把国运押上赌桌的政党，重建后的共和党以压倒性优势归来，承诺对民主党进行“从华尔街到好莱坞”的彻底清算。特别检察官、忠诚审查与政治审判接踵而至——这一次，输家将付出一切。"
 usacw.13.a: "血债血偿"
 CHI_taiwan_us_support_tt: "美国对台支持率 -40"


#美国石油危机链（从TFR适配，移除内战路线触发器）
tfr_usa.7.t: "石油危机冲击美国！"
tfr_usa.7.d: "美国经济本就摇摇欲坠，沙特崩溃引发的石油恐慌更是把棺材钉死。沙特石油2019年仅占美国进口总量的21%，但其他主要供应方因新冠疫情减产，俄罗斯与墨西哥更是趁沙特崩溃之际疯狂抬价。国内石油产能无法填补近40%的进口缺口。"
tfr_usa.7.a: "我们何罪至此？！"
usa.170.t: "由奢入俭"
usa.170.d: "他盯着眼前的红色数字，心沉到底——道指暴跌创下历史纪录：周五收盘3万点，周一开盘1.5万，拦腰斩断。大萧条头四天才跌25%，这次只用了两天。Badwater 信托公司化为乌有，他毕生的心血在一个周末清零。"
usa.170.a: "他纵身跃入冰冷的气流。"
tfr_usa.202.t: "贫困率飙升"
tfr_usa.202.d: "石油危机爆发几周了，美国经济前景越来越黯淡。加油站前排起长龙，企业因信心不足与收入下降每天都在倒闭。经济学家警告，美国可能重演70年代石油危机的大萧条。据报告，失业、收入缩水与通胀将使美国贫困率升至22%——1959年以来未见的水平。"
tfr_usa.202.a: "这只是开始。"
usa.217.t: "失业率触及20%"
usa.217.d: "劳工统计局的惊人报告显示，美国失业率自大萧条以来首次触及20%，比大衰退峰值高出6个百分点。新冠疫情肆虐、服务业岗位流失，再加上两周前的石油崩盘，卡车运输与运输行业大规模裁员，数百万美国工薪阶层突然失业、流落街头。"
usa.217.a: "政府最大的失败。"
