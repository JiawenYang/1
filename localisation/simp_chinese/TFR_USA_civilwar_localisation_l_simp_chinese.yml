#美国石油危机链（从TFR适配，移除内战路线触发器）
tfr_usa.7.t: "石油危机冲击美国！"
tfr_usa.7.d: "美国经济本就摇摇欲坠，沙特崩溃引发的石油恐慌更是把棺材钉死。沙特石油2019年仅占美国进口总量的21%，但其他主要供应方因新冠疫情减产，俄罗斯与墨西哥更是趁沙特崩溃之际疯狂抬价。国内石油产能无法填补近40%的进口缺口。"
tfr_usa.7.a: "我们何罪至此？！"
usa.170.t: "由奢入俭"
usa.170.d: "他盯着眼前的红色数字，心沉到底——道指暴跌创下历史纪录：周五收盘3万点，周一开盘1.5万，拦腰斩断。大萧条头四天才跌25%，这次只用了两天。Badwater 信托公司化为乌有，他毕生的心血在一个周末清零。"
usa.170.a: "他纵身跃入冰冷的气流。"
tfr_usa.202.t: "贫困率飙升"
tfr_usa.202.d: "石油危机爆发几周了，美国经济前景越来越黯淡。加油站前排起长龙，企业因信心不足与收入下降每天都在倒闭。经济学家警告，美国可能重演70年代石油危机的大萧条。据报告，失业、收入缩水与通胀将使美国贫困率升至22%——1959年以来未见的水平。"
tfr_usa.202.a: "这只是开始。"
usa.217.t: "失业率触及20%"
usa.217.d: "劳工统计局的惊人报告显示，美国失业率自大萧条以来首次触及20%，比大衰退峰值高出6个百分点。新冠疫情肆虐、服务业岗位流失，再加上两周前的石油崩盘，卡车运输与运输行业大规模裁员，数百万美国工薪阶层突然失业、流落街头。"
usa.217.a: "政府最大的失败。"
 usacw.14.t: "太平洋动员"
 usacw.14.d: "外交已经冻结，国内政治一片废墟，白宫于是做出唯一无需立法授权的决定：太平洋舰队进入战备状态，美军加入日本主导的对华阵营。国会只是被告知，而非被征询。东京把这一消息当作老盟友的回归，北京则将其解读为华盛顿选边站队的最终证据。"
 usacw.14.a: "舰队向西开拔"
 usacw.15.t: "新政府就任"
 usacw.15.d: "2021年1月20日，第46任总统在围栏与军队环绕的首都宣誓就职。仪式上说着团结，但身后的议场已裂成两半：一党占据白宫，另一党则就地挖壕，准备四年的抵抗。此后每一项任命、每一份纾困法案、每一行预算，都是必须争夺的战壕。"
 usacw.15.a: "四年的壕堑战"
 usacw.16.t: "两个阵营，一座首都"
 usacw.16.d: "蜜月期不到一个月。新政府的首份纾困方案遭到冗长辩论阻击，反对党则回以各州层面的一连串诉讼。有线电视新闻分裂成两个平行宇宙，普通美国人连同频道与事实一起选边。妥协这个词，如今只用来骂人。"
 usacw.16.a: "中间地带不复存在"
 usacw.17.t: "预算无法通过"
 usacw.17.d: "春天带来第一次真正的考验：年度预算。白宫要推行历史性的纾困与重建计划，反对党则要求大幅削减并收回紧急权力。双方都没有足够票数强推自己的方案。几十年来第一次，联邦政府开始靠逐月延续决议维持运转，每个机构都被要求做最坏打算。"
 usacw.17.a: "从最后期限治理到下一个最后期限"
 usacw.18.t: "国会山僵局"
 usacw.18.d: "到了五月，各委员会已经停会，议事厅沦为舞台。司法提名无人处理直至过期，大使职位持续空缺，监督听证会变成直播的对骂。立法的机器并没有坏掉——它只是被瞄准了另一个党。连国家的日常事务，现在也需要一场危机才能推动。"
 usacw.18.a: "机器彻底卡死"
 usacw.19.t: "机构熄灯"
 usacw.19.d: "六月，拨款始终未获通过，第一批机构率先断粮。国家公园关闭，检查员被迫无薪休假，福利申请在未拆封的邮件里越堆越高。联邦雇员在首都的食品银行前排起长队，「非必要雇员」这个词从职位变成了威胁。"
 usacw.19.a: "灯光一个办公室一个办公室地熄灭"
 usacw.20.t: "市场与市长作出反应"
 usacw.20.d: "七月，债券市场率先眨眼：一家评级机构将美国的完全信用置于负面观察名单。市长与州长开始直接与财政部讨价还价，索要联邦政府已无法承诺的资金。外国债权人悄悄询问美国的签字是否还有分量，而华盛顿没有人能回答。"
 usacw.20.a: "世界开始给我们打折"
 usacw.21.t: "政府停摆"
 usacw.21.d: "2021年8月1日，最后一份延续决议到期，联邦政府停摆。白宫与国会各站一个讲台互相指责。护照、许可证、付款与工资在同一时刻停摆。华盛顿的海外承诺仍签在纸上，但执行它们的机构已经熄灯——在台北、首尔以及每一座盟国首都，规划者们开始默默假定，美国再也守不住自己的承诺。"
 usacw.21.a: "美国不再接电话了"
