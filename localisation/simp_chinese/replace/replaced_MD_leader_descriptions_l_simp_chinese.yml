l_simp_chinese:
 JIANG_ZEMIN_LEADER_DESC: "江泽民同志，男，汉族，中国政治家、工程师，中国共产党中央委员会总书记、中华人民共和国主要党政官员及最高领导人。祖籍安徽省宣城旌德县江村(一说江西省婺源江湾镇)，1926年8月17日出生于江苏扬州，1946年4月加入中国共产党，毕业于交通大学。江泽民同志出身于电力机械制造业，在汽车制造业亦有工作领导经历。江泽民早期曾担任过中国电子工业部部长，中共上海市委副书记、市长、市委书记等职务。江泽民同志是全党全军全国各族人民公认的享有崇高威望的卓越领导人，伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家、外交家，久经考验的共产主义战士，中国特色社会主义伟大事业的杰出领导者，党的第三代中央领导集体的核心，“三个代表”重要思想的主要创立者。"

 HU_JINTAO_LEADER_DESC: "“共青团的年轻人”、“实干家”、“技术员”，这些都是胡锦涛的绰号。这位出身江苏泰县的商人的儿子从来都认为自己是安徽绩溪人，但他身上有着江南水乡之人常见的文化人的特质：性格儒雅文静，喜好读书。大学毕业后胡锦涛在母校留教过数年，文革开始后，他很快前往甘肃的水电部刘家峡工程局参加工作，并在此与同窗多年的大学同学刘永清结婚。进入共青团单位后，他开始受到中央的关注，自此平步青云，接连升迁。在完成贵州和西藏等地的工作中，胡锦涛的工作能力很快凸显出来，随之成为他进入中央工作的政绩资本。据传，他是邓小平同志隔代指定的领导人人选。这位年轻的总书记在2002年末接任最高领导人之职后，曾说“我没有想当主席，是全国人民选了我，让我当主席”。\n\n作为一个出身寒门的共产党员，胡锦涛长期在红二代或红三代的太子党们组成的群体中与其共事，这段经历让他和同样出身商人家庭的温家宝深信，中国若要在新世纪行稳致远，不能靠所谓的政治强人或发展至上的观念，需要用法制取代人治，用以人为本的发展观念取代发展至上观念。高层的太子党和上海帮成员们对这位没有政治靠山的年轻人并不看好，也对他提倡的所谓法制和以人为本等理念嗤之以鼻。胡锦涛总书记在十年任期内的奋斗路程还远远没有结束。"

 HU_JINTAO_LEADER2_DESC: "闻一多曾在《诗的格律》中将中国古代的格律诗比喻为“戴着镣铐起舞”。然而戴着镣铐真能起舞吗？胡锦涛用自己的奋斗证明了这一点。\n\n对于他来说，中国是艘巨大的航船，自己是船上的掌舵人，他和大副温家宝紧紧掌握着这艘规模超乎想象的巨轮之舵，稍有不慎，就会顷刻颠覆。二人主政期间的一些列政策被称作“胡温体制”，受到多方称赞，但他们知道，自己只是战战兢兢，如履薄冰地在巨大的冰封大河上驾驶巨轮。如梦的增长，陶醉的歌舞升平，在这之太平景象之下，究竟有怎样的海底冰山？……不过，现在，他终于有了自己的立足之地，能够在现实中书写属于自己的文字——中国人民奔向美好未来的灿烂画卷。"

 XI_JINPING_LEADER_DESC: "“他是习仲勋的儿子”，习近平从小听的最多的就是这句话。对于他来说，对于这位共和国元勋的长子来说，父亲的身份既是一笔丰厚的政治财富，也是一件无法摆脱的标签。小时候习近平因父亲陷入政治斗争而被迫离开北京前往陕西的一个村子，并且吃尽了苦头。青年时代即扎根农村工作的他对中国社会有很深了解，同时在地方工作中显露出惊人的才能与魄力。离开梁家河村前往清华大学就读时，村民们自发为这位党支部书记送行，习近平为此大受感动，从此在心底埋下了一颗种子。\n本科毕业后，其在中央担任国防部秘书的职位，但不久即放弃在北京的优渥待遇主动前往农村工作。习近平简朴的生活作风和干练的工作风格迅速获得了群众和同僚的认可，因此他随后被调往福建厦门工作。他在福建主政的几年里是福建发展最快的时段。进入千禧年后，他先后转任浙江和上海，后与李克强一起升任中央政治局常委，从此进入国家权力核心。\n\n对习近平来说，常年的基层工作经验是自己最宝贵的财富，与人民群众在一起，让他感到安心、踏实。作为一个出身“勋贵家族”的红二代，他遭受过无数非议，也在他的那些“太子党同辈”里面看见了这个社会中最污秽、最邪恶的一角。习近平将“我将无我，不负人民”当作自己的人生格言，希望将那些不符合自己理想和违背中国人民心愿的一切杂草全部斩除。现在，他终于担任最高领导人，可以让他在中国这副广袤的画布上尽情挥洒自己的杰作了。"

 YAN_CAN_DESC: "延参法师，字明超，号糊涂山人。延参法师得法于佛教天台宗正宗第四十六代传人，临济宗传人，曹洞宗传人。其佛学造诣颇深，禅风俊朗，精通禅理，道行高尚，韵致不凡．他一贯奉行“尊重生命，传播宽容，坦然人生，开心生活”的中心思想．为人风趣幽默，待人接物和蔼可亲，在谈笑中，便把人生的哲理、处世的态度，诠释的淋漓尽致，既为人指点了迷津，又使人享受了丰富多彩的妙语音声。多年来，他的书画收入多用于资助失学儿童和特困学生以及社会慈善公益事业，曾为免费午餐计划捐款。\n\n“小徒弟问我，师父啊怎么样才能做到平等待人。我告诉他，你回头看看我身后这扇门，它不是官衙，不是豪门，不是凯旋门，也不是败家门，它是千千年来的百姓门，它不是没有名字，它有名字，它叫做柴门，如果谁飞黄腾达了，忘记了这扇门，请他抬头看看天，多大的一只眼睛在盯着看呢。这也是我们永远的家门。”"

 Zheng_Jian_Bang_DESC: "郑建邦，男，汉族，1957年1月生，湖南石门人，民革成员，1976年8月参加工作，东北师范大学政治教育系经济学专业毕业，大学学历。任十四届全国人大常委会副委员长，民革中央主席，中国和平统一促进会副会长。"

 shigeru_ishiba_DESC: "王毅，男，汉族，1953年10月生，北京市人，1969年9月参加工作，1981年5月加入中国共产党，北京第二外国语学院亚非语系毕业，大学学历，经济学硕士学位。1989-1994年驻日本使馆参赞（1992.05副司级）、公使衔参赞（1993.04）。2004-2007年为中华人民共和国驻日本大使。"

 Keizo_Obuchi_DESC: "小渊出生于日本群马县中之条町，1962年毕业于早稻田大学文学部，获得英国文学学位，次年赢得他父亲在众议院占有的席位，成为有史以来被选入国会的最年轻的议员。虽然他常被人说是温和派，表现也不突出，然而他的政治生涯是成功的。1973年小渊被任命为首相办公室副主任，1987年任内阁秘书长。随著他在执政的自由民主党内步步高升，他在促成党内各派系之间妥协和解方面的能力也越来越知名。1984年他成为该党的副秘书长，1993年任秘书长。1997年担任外交部长，自民党在大选失利后，1998年7月24日小渊接替桥本龙太郎出任党主席，7月30日小渊任首相，采取明快的态度处理国家的经济问题。他能够赢得国会的批准，对那些有呆帐的银行进行纾困，削减所得税并增加支出。这些政策已短期奏效，到1999年中期日本经济再次增强。他是个拥有呼号（JI1KIT）的业余无线电玩家，曾任国会业余无线电俱乐部的会长。\n\n这位兢兢业业的首相长期处于病弱状态，近期以来，这种情况似乎愈发加剧了。"

 yoshiro_mori_DESC: "森喜朗当上首相纯属偶然。从1993年到2000年，日本已经换了5任首相。当时日本的流行语是：“歌手红一年，首相当两年。”森喜朗从政30多年来，曾10次当选众议员，可谓是日本政坛的一名老将。1998年7月底，小渊惠三当选自民党总裁并出任日本首相之后，森喜朗被小渊委任为自民党内地位仅次于总裁的干事长一职，成为小渊十分信赖的“右手边的人”。努力赢得大选，是森首相执政的首要任务。为了赢得大选，沿袭了小渊内阁政策的新内阁在没有任何政绩的情况下，只能在为国操劳而病倒于任上的小渊前首相身上做文章。大选的投票日期选在了小渊的生日6月25日，而小渊的葬礼将于6月8日举行。分析人士认为，自民党将小渊利用到了极限。投票选在小渊的生日，是为了拉到更多的“同情票”；6月8日，将有多国的领导人出席小渊的葬礼，森会借此机会展开“葬礼外交”。目的只有一个，即赢得大选的胜利。\n\n这位大大咧咧，性格直率到有些“愚蠢”的首相，能坐多久首相的位子呢？"

 junichiro_koizumi_DESC: "1967年，小泉纯一郎在庆应大学经济系毕业，1968年赴英国伦敦大学留学。1969年12月，继承父亲遗志在神奈川县选区竞选众议员失败。1972年，当选众议员，后又连续当选。1988年至1996年，先后出任厚生大臣、邮政大臣等职。2001年4月24日，小泉纯一郎凭借“改变自民党、 改变日本”的竞选口号，以压倒优势当选自民党总裁：出任第87届内阁总理大臣（首相）。2003年9月，小泉纯一郎再次当选自民党总裁；同年11月19日，当选内阁总理大臣（首相）。2005年9月11日，小泉纯一郎领导自民党在日本众议院选举中获得大胜，其政治生涯达到顶点。\n小泉纯一郎是新世纪日本选出的第一位首相，也是日本政治家中主张打破“官僚主导”局面的代表人物之一。作为日本“长命首相”，小泉纯一郎有政治“怪人”之称，其内政、外交政策在日本国内外掀起很大风波，毁誉参半。其任上成功推进了邮政民营化改革，积极发展与美国政府的战略伙伴关系，使日美关系得到改善和加强。但也因执意参拜靖国神社导致了日本同中韩两国的关系同时恶化。\n\n这位雷厉风行，行事极具个人特色的首相，到底能在任期内做出哪些成就呢？"

 Shinzo_Abe1_DESC: "1954年9月21日，安倍晋三出生于日本山口县。从幼儿园到大学，安倍晋三一直在重视个性、注重体验的16年一贯制的贵族学校成蹊学院就读。在校期间，安倍晋三学习并不用功，成绩也一般。但他好奇心强，爱好广泛，大部分时间和精力都在涉猎课本以外的世界。大学毕业后，1982年11月，安倍晋三担任时任日本外务大臣的父亲安倍晋太郎的秘书官，开始从政，并获前首相福田赳夫和竹下登的大力提携。2004年9月，由于日本自民党在参议院选举以一席之差输给民主党，安倍晋三辞去干事长一职，但由于连同公明党在内的执政联盟仍控制参议院，因此只被小泉降职为自民党干事长代理以及党改革推进本部长。2005年10月31日，就任第三次小泉内阁官房长官。2006年9月20日，安倍晋三当选自由民主党第21任总裁；9月26日，安倍晋三当选为第90代日本内阁总理大臣（日本首相），成为首位战后出生、战后最年轻的首相。\n\n安倍晋三在许多方面带有小泉纯一郎的影子。他性格固执、言论强硬，直到2006年从不对自己的鹰派立场含糊其辞，是小泉纯一郎参拜靖国神社的忠实拥护者，在各种场合均为小泉纯一郎辩护，自己也作为政治家多次参拜。在执政理念上，安倍也与小泉接近，主张强化日美同盟，主张修改日本和平宪法，加入日本拥有集体自卫权条款，推动日本走向所谓“正常国家”。这位年轻的首相，到底能坐多久首相的位子呢？"

 yasuo_fukuda_DESC: "福田康夫于1936年7月16日生于群马县高崎市，毕业于日本早稻田大学。1959年3月从早稻田大学政治经济学科毕业后入石油会社。他主张政治改革从每一个政治家自身做起，在政策方面以稳健著称。在任期间中日关系呈现良好发展势头，中日战略互惠关系不断深化。福田首相为此做出了重要贡献。福田和麻生还一致表示，将避免使靖国神社问题成为政治和外交问题。福田说：“靖国神社问题演变成了极端政治化的问题，这非常不幸。我不会去制造难题。”福田此前就明确表示，如果他当选首相，将不会去参拜靖国神社。关于外交政策，福田承诺他当选后将加强日中关系，麻生表示将进一步深化与亚洲国家的关系。麻生还重申，他是第一个公开表示欢迎“中国崛起”的日本外相。 1995年8月15日，时任日本首相的村山富市发表谈话，承认日本过去国策有误，走了战争道路，殖民统治和侵略给许多国家、特别是亚洲各国人民造成巨大损害和痛苦，并表示深刻的反省和由衷的歉意。\n\n福田康夫主张保持财政改革和经济增长势头。考虑改革税制促进地区发展，增加从事农业、渔业国民的收入和就业机会。同时呼吁建立一个为青年人和老年人提供“希望和舒适”的社会。审查一项要求残疾人支付他们享受医疗和服务10%费用的法律，考虑做重大改变。 考虑不再增加老年人的医疗负担。以及提高政治资金的透明度，推进公务员制度改革。\n\n这位致力于造福日本人民的首相，究竟能在多大程度上实现自己的理想呢？"

 taro_aso_DESC: "出身政治世家。毕业于日本学习院大学政经学部，后留学美国斯坦福大学大学院和英国伦敦政治经济学院。学成归国后，投身家族产业“麻生产业”（现麻生水泥场）。在优越的官商家庭环境下娇生惯养的麻生太郎，自幼形成自傲任性，张扬散漫的个性，也养成了缺乏深思熟虑、随口妄言的习惯。如其自嘲的“出生很好，教养不佳”。\n在日本社会整体出现保守化趋势、民族主义思潮兴起的潮流下，麻生与小泉一唱一和，在历史认识、台湾地位。“中国威胁论等”问题上，公然蔑视中韩两国的国民感情，挑战中日关系的政治基础。2005年12月22日，当记者问及如何认识民主党党首前原诚司的中国威胁论时，麻生当场表示同意前原的观点，认为”中国正在成为相当程度的威胁“。作为日本阁僚首次在正式场合公开宣扬中国威胁论。\n麻生太郎组建的内阁被媒体和在野党称为”世袭内阁“，”少爷内阁“和”公子哥内阁“。18位内阁成员中有11人是世袭阁僚，4天后国土交通大臣中山成彬辞职，金子一义继承后，世袭阁僚一度达到了创记录的12人，超过了福田康夫改造内阁的9人，即全体内阁成员三分之二是世袭议员。\n\n这位公子首相，究竟能在任期内做出哪些举动呢？"

 yukio_hatoyama_DESC: "鸠山由纪夫，又名鸠山友纪夫，1947年2月11日出生，东亚共同体研究所理事长，中国西安交通大学荣誉教授，中国西北农林科技大学名誉教授。\n\n1996年，鸠山由纪夫与菅直人，小泽一郎组建民主党，并担任党首。2009年8月30日，鸠山由纪夫带领民主党在众议院选举中取得历史性的胜利，终结了自民党长期的执政地位。2009年9月16日，他当选日本第93代、第60位日本首相。鸠山性格稳健，不露锋芒，有“鸽子”的绰号。他重视“忍功”。鸠山由纪夫的口头禅是“政治是爱”，以祖父提出的“友爱”思想为政治信条。不过由于发表不谙世事的言论，他一度被冠以“外星人”的外号，被人讥讽为“像个软冰激凌”。鸠山由纪夫以其在安全及外交事务方面的政见著称，强调日本军事自卫的权利，同时批判日本现行外交政策过于依附美国等西方盟国。在民主党建设方面，鸠山由纪夫表示将致力于构筑全党一致的体制和实现政权更迭。主张加强与亚洲国家的关系。他在发表于《纽约时报》的文章中指出，日本“不能忘记自己的身份：“我们是个位于亚洲的国家。我认为，正在日益显现活力的东亚地区必须被确认为日本的基本生存范围。所以，我们必须持续建立覆盖整个地区且稳定的经济合作和安全框架。” 在政治安全上把中国作为主要对手和防范对象，同时在经济增长和发展战略上用足“中国商机”。\n\n这位积极与中国交好、对世界充满同情心的首相，是否意识到了政治是残酷的，现实是冰冷的呢？"

 naoto_kan_DESC: "菅直人，1946年10月10日出生于山口县宇部市，蓝领政治家，市民运动家。菅直人大学时代是学校红卫兵领导者。1980年成为国会众议员，1996年出任桥本龙太郎内阁厚生大臣，因处理艾滋病药品案一举成名，后来和鸠山由纪夫、小泽一郎一起创立日本民主党，成为民主党的“三驾马车之一”，2009年9月16日成为鸠山内阁副首相兼“国家战略局”大臣。2010年1月6日出任财务大臣。\n菅直人在竞选时曾说，日美同盟关系是日本外交政策“基轴”。他说，他将根据日美两国关于驻日美军冲绳普天间基地搬迁的共同声明，努力减轻冲绳居民负担。强调中国对日本重要性，称中日关系与美日关系“同样重要”。1999年，菅直人访问中国时还专程赶赴卢沟桥抗日战争纪念馆敬献花篮，称应“前事不忘，后事之师”。在台湾问题上，他希望中国尽早实现和平统一，主张台湾是中国领土的一部分。2010年，菅直人在处理中日关系时表态：“日美同盟是日本外交基轴，另一方面，我们必须致力于亚洲地区的繁荣”，“我们将重视发展日中关系”。2011年5月10日，菅直人在会见中指出，日本的电力发展依赖于核电和火力发电，今后要重点研究太阳能和风能等新能源，要让自然能成为日本电力的根本。这是福岛县第一核电站事故发生以来，菅直人首次表明将停止核电的发展，废除政府制定的以核电为主的能源发展计划。\n此前，日本首相大多非富即贵，世袭政治和派阀争斗几乎成了日本的一个传统。2010年6月8日上任的日本前首相菅直人似乎正改写日本政坛的历史，按任职后百日内公示财产的法律要求，在公布出来的日本菅直人内阁18名成员的个人财产状况表中，首相菅直人的报表颇为简单，他不持股票，也没有高尔夫球员会员卡，只有一笔395万日元的定期存款，和一套两室一厅的公寓，公寓的官方估价是518万日元。\n\n这位出身平民的首相，究竟能在多大程度上实现自己的理想呢？"

 yoshihiko_noda_DESC: "野田佳彦1957年5月20日出生于日本千叶县船桥市，1980年毕业于早稻田大学政治系，后又入“日本政治家的摇篮”松下政经塾学习，曾以29岁当选而打破日本议员当选年龄纪录。野田是日本民主党内的实力人物，党内派阀花齐会（野田组）的会长。属民主党内年轻议员组成的“野田组”核心人物。他为人活跃，曾担任过消防员、家庭教师，身为柔道二段，崇拜日本政治家浜口雄幸。在政治上，一方面反对小泉纯一郎的夸夸其谈，另一方面在钓鱼岛等问题上持保守强硬态度。\n从野田长期的从政风格来看，野田比较熟悉的领域是防卫和财务。在防务、外交方面，野田秉承了“松下政经塾”的强硬风格，主张对华强硬，主张参拜靖国神社，是民主党内鹰派人物的著名代表，素有“民主党小泉”的称号。他在领土问题上对华态度强硬，并认为“甲级战犯并非战争罪人”。他还主张日本对宇宙进行军事利用，积极主张日本应该制定《安全保障基本法》和《紧急事态法》。野田在对外方面以及军事方面是一个“强硬派”人物。野田在做客某电视节目时曾表示，自己的施政理想，简而言之就是希望国人能感觉身为日本人是件幸福的事情，并力求改变国民心目中对于政治的负面看法。野田曾经对中国国务委员唐家璇提出批驳，称“贵国实际占领着南沙诸岛，有何道理对我们说三道四？”他还曾就中国保钓人员登上钓鱼岛的事件，向日本国会提出动议，要求确认钓鱼岛为“日本固有领土”。\n\n这位强硬的“老大”风格的首相，究竟能做出怎样的事业来呢？"

 Shinzo_Abe_DESC: "1954年9月21日，安倍晋三出生于日本山口县。从幼儿园到大学，安倍晋三一直在重视个性、注重体验的16年一贯制的贵族学校成蹊学院就读。在校期间，安倍晋三学习并不用功，成绩也一般。但他好奇心强，爱好广泛，大部分时间和精力都在涉猎课本以外的世界。大学毕业后，1982年11月，安倍晋三担任时任日本外务大臣的父亲安倍晋太郎的秘书官，开始从政，并获前首相福田赳夫和竹下登的大力提携。2004年9月，由于日本自民党在参议院选举以一席之差输给民主党，安倍晋三辞去干事长一职，但由于连同公明党在内的执政联盟仍控制参议院，因此只被小泉降职为自民党干事长代理以及党改革推进本部长。2005年10月31日，就任第三次小泉内阁官房长官。2006年9月20日，安倍晋三当选自由民主党第21任总裁；9月26日，安倍晋三当选为第90代日本内阁总理大臣（日本首相），成为首位战后出生、战后最年轻的首相。2012年12月16日，自民党在众议院选举大胜赢回执政权，安倍晋三确定将再次出任日本首相；12月26日，安倍晋三就任日本第96代首相。\n\n安倍晋三在许多方面带有小泉纯一郎的影子。他性格固执、言论强硬，直到2006年从不对自己的鹰派立场含糊其辞，是小泉纯一郎参拜靖国神社的忠实拥护者，在各种场合均为小泉纯一郎辩护，自己也作为政治家多次参拜。在执政理念上，安倍也与小泉接近，主张强化日美同盟，主张修改日本和平宪法，加入日本拥有集体自卫权条款，推动日本走向所谓“正常国家”。\n\n这位二次上任的首相，能终自2000年小渊惠三病逝后日本陷入的政局混乱局面吗？日本会在他的领导下走向什么样的方向？"

 yoshihide_suga_DESC: "菅义伟，1948年12月6日出生于日本秋田县，日本政治家，自由民主党成员，2020年9月14日，菅义伟获得377票（总计534张有效选票），以绝对优势当选执政党自民党总裁 [19-20]；9月16日，日本国会众议院召集临时国会举行首相指名选举，执政党自民党总裁菅义伟当选日本第99任首相，并于当天组建新内阁。\n2021年5月，菅义伟推动日本国会通过《数字厅设置法》《数字化社会形成基本法》《地方公共团体信息数字化标准相关法律》等六部数字化改革相关法律，为建设数字化社会、培育数字经济提供法律支撑。制定这一系列法律的背景是，日本在数字化经济领域落后于中、美等主要国家，且新冠疫情凸显出日本行政数字化程度过低问题。上述数字化改革相关法律在经国会审议通过后，于2021年9月1日正式颁布实施。依据《数字厅设置法》，日本成立了内阁直接管辖的“数字厅”，统筹各中央省厅、地方自治体行政数字化建设，协调民间团体和企业的数字化普及。在外交方面，菅义伟提出以日美同盟为基轴，推进与中国、俄罗斯等亚洲邻国构建稳定关系。\n\n这位暮年上任的首相，究竟能做出什么样的贡献呢？"

 fumio_kishida_DESC: "岸田文雄，1957年7月29日出生于日本东京都，祖籍广岛县广岛市，1982年3月毕业于早稻田大学法学部。2012年，岸田文雄从古贺诚手中接任宏池会会长，成为“岸田派”领袖。2021年9月29日，当选第27任日本自民党总裁，同年10月4日，就任日本第100任首相11月10日，在国会参众两院首相指名选举中当选日本第101任首相。\n岸田文雄担任首相以来，秉持修宪强军路线，计划修改《自卫队法》。经济上提出“新型日式资本主义”，希望同时实现国民经济增长和收入分配公平，并推进“数字田园都市国家构想”，大力普及新型能源。外交上继承前首相安倍晋三和菅义伟的政策框架，主张与以美国为首的共享普世价值的国家携手，续推“自由开放的印太”战略，在俄乌冲突中谴责并制裁俄罗斯。在经济政策方面，岸田文雄提出“新型日式资本主义”。面对日本社会不断扩大的贫富差距，岸田文雄致力打造“增长和分配的良性循环”，同时实现增长和分配，并计划通过减少企业税负等方针，尽一切努力提高工薪待遇。岸田文雄还推进作为增长战略一环的“数字田园都市国家构想”，设立2万亿日元的绿色创新基金，通过大力普及氢燃料电动汽车等手段实现火力发电的零排放。2022年1月8日，岸田文雄发表题为《我的新资本主义大设计》的署名文章，首次全面阐述了他的经济构想，称要将资本主义升级为重视“人”的新资本主义，希望通过新资本主义，“一举扭转”工资增长水平不断下降的趋势，希望工资增长能够适合资本主义的新时代。\n\n这位处事不惊的首相，能建设好自己理想中的“新型日式资本主义”吗？"

 shigeru_ishiba_DESC: "石破茂，男，1957年2月4日出生于日本鸟取县八头郡郡家町（现八头町），毕业于庆应义塾大学法学部，自由民主党党员。1979年，大学毕业后，石破茂进入三井银行（现三井住友银行）工作。1981年，在父亲友人田中角荣的劝说下，投身政治。1986年，利用家族传承的资源和影响力，作为自民党成员首次当选鸟取县众议员，先后12次当选。1993年，细川护熙领导的非自民党政权诞生后，石破茂脱离自民党，加入七党执政联盟中的新生党，投入反出自民党的小泽一郎麾下。1997年，因与小泽政见不合，重回自民党。2002年，开始出任内阁职位，先后担任防卫大臣和农业水产大臣。2014年，任自民党干事长。2015年，被安倍晋三提拔为内阁府特别担当大臣，负责管理“地方创生事务”和“国家特区战略”。石破茂曾4次竞选自民党总裁，但都未当选。2024年8月，第5次参加自民党总裁竞选，当选自民党第28任总裁；10月1日，当选日本第102任首相。\n\n石破茂的从政经历丰富，涉足过地方和中央多个领域的施政管理，被称为“政策通” ，是位保守派政治家。在国际关系上是现实主义者，担任防相时，曾被视作鹰派，一直主张提高日本自卫队的地位，强化日美同盟，虽政策主张强硬，但寻求稳健、务实、平衡。在对华立场上，承认日本需要正视和反思历史问题，主张中日可以进行一定程度上的经济合作。\n\n这位看似亲和的首相，能够在激烈的大国博弈中守护一方净土吗？"