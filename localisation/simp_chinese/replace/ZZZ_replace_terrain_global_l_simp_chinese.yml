l_simp_chinese:
 mexico_city_desc: "----\n§9建在干涸湖床上的墨西哥城正在缓慢下沉，但这并不妨碍它成为美洲最喧闹、最忙碌、最有烟火气的地方。§!"
 detroit_desc: "----\n§9摩城的引擎也许熄火了，可节拍从没停。工厂当年造福特，如今空地上开满了野花。§!"
 san_antonio_desc: "----\n§9先记住阿拉莫，再来一碗辣肉酱，剩下的行程就随它去吧。§!"
 birmingham_desc: "----\n§9钢铁、灵魂乐，还有市中心那头铁牛——这座城市是吃了苦头才学会换调的。§!"
 tampa_desc: "----\n§9雪茄厂、杂货铺，外加两座佛罗里达没人料到的冰球奖杯。§!"
 ottawa_desc: "----\n§9礼貌到连国会山上的猫都有安保许可。这里什么都不发生，而这正是它的意义。§!"
 denver_desc: "----\n§9一英里之城，落基山盯着你晨跑，连空气本身都算一场锻炼。§!"
 portland_desc: "----\n§9让波特兰继续怪下去——然后跟服务员解释你为什么凌晨两点还在吃素。§!"
 dallas_desc: "----\n§9大发型、更大的皮卡，还有一条只在八十年代老剧里最好看的天际线。§!"
 toronto_desc: "----\n§9六百万人按喇叭前先道歉，再加一座始终俯视全城的塔。§!"
 minneapolis_desc: "----\n§9一万个湖，一条轻轨，还有一个会对你脸提交正式投诉的冬天。§!"
 las_vegas_desc: "----\n§9在这里发生的就留在这里。债务除外，它会跟你回家。§!"
 atlanta_desc: "----\n§9车流厚得能当天气预警，却依旧是南方嘻哈和机场中转之都。§!"
 columbus_desc: "----\n§9俄亥俄最大的小城——全美国最后都会买的东西，先在这里试销。§!"
 san_diego_desc: "----\n§9完美天气、海军基地，还有一座差不多算国家地标的动物园。§!"
 austin_desc: "----\n§9一半科技新贵，一半乡村酒吧，全都堵在35号州际公路上。§!"
 oklahoma_city_desc: "----\n§9石油钱、草原雷暴，还有一座提醒你这里天空不好惹的纪念碑。§!"
 sacramento_desc: "----\n§9加州政府所在地：酷夏、杏树林，还有根本不把旱情当回事的河流。§!"
 indianapolis_desc: "----\n§9美国十字路口，五月是宗教，赛车场就是它的教堂。§!"
 buffalo_desc: "----\n§9湖泊效应暴雪、蓝领硬骨头，还有配芹菜的鸡翅——芹菜你肯定不会碰。§!"
 cape_town_desc: "----\n§9桌山、两大洋，还有一阵每天下午都要改名的强风。§!"
 cairo_desc: "----\n§9两千万人口、一条车流的河，还有从商场停车场就能看见的金字塔。§!"
 alexandria_desc: "----\n§9亚历山大图书馆烧过一次；新馆备份更全，风景也更好。§!"
 volgograd_desc: "----\n§9两度改名的城市，依旧站在伏尔加河奔向里海前的最后一道弯上。§!"
 rostovdon_desc: "----\n§9顿河下游的南方门户：河运、球迷呐喊，还有一修再修的天际线。§!"
 yekaterinburg_desc: "----\n§9乌拉尔与资本相遇之地——赫鲁晓夫楼挨着玻璃塔，地下室里还躺着末代沙皇的悲剧。§!"
 nizhnynovgorod_desc: "----\n§9让伏尔加河富起来的交易会；如今这里造软件、造汽车，不太吵架。§!"
 novosibirsk_desc: "----\n§9西伯利亚最大城市，为铁路仓促建起，至今靠学术圈的倔强运转。§!"
 kazan_desc: "----\n§9鞑靼斯坦首府，清真寺与东正教堂共用一条天际线，互不打架。§!"
 tallinn_desc: "----\n§9中世纪老城配数字政府：网上投票，脚下仍踩着鹅卵石。§!"
 riga_desc: "----\n§9新艺术风格立面、波罗的海的风，还有每年夏天盖过政治的歌唱节。§!"
 vilnius_desc: "----\n§9巴洛克教堂，河对岸一个自封的“艺术家共和国”，护照一直没办下来。§!"
 chisinau_desc: "----\n§9酒窖比国土还长，市长还起诉过红绿灯。§!"
 tiraspol_desc: "----\n§9冻结冲突的样板：广场上还立着列宁像，货币出了这片地就花不出去。§!"
 odessa_desc: "----\n§9波将金阶梯、海风，以及一种什么都打不败的幽默感。§!"
 lvov_desc: "----\n§9咖啡、鹅卵石，还有最舒服版本的哈布斯堡宿醉。§!"
 belgrade_desc: "----\n§9萨瓦河与多瑙河交汇，夜船与日出相遇——一座在自己废墟上开派对的城市。§!"
 budapest_desc: "----\n§9两座城、一条河，还有罗马人修的地热浴场——他们没料到后来会冒出废墟酒吧。§!"
 prague_desc: "----\n§9百座尖塔、一座城堡，以及比游客尊严还便宜的啤酒。§!"
 bratislava_desc: "----\n§9小首都保住了城堡、丢了帝国，如今供应方圆四十分钟内最好的啤酒。§!"
 munich_desc: "----\n§9啤酒馆、宝马，还有一场让全世界都把皮短裤穿错的啤酒节。§!"
 hamburg_desc: "----\n§9港口城市，仓库城被联合国教科文组织宝贝着，潮水却天天来考试。§!"
 frankfurt_desc: "----\n§9银行高楼、一小片老城，还有一座每趟车都要吵一架的车站。§!"
 hannover_desc: "----\n§9博览会、贯穿全城的红线导览，以及德国最平的天际线。§!"
 koln_desc: "----\n§9一座修了632年的大教堂、4711古龙水，还有能让整个莱茵兰停摆的狂欢节。§!"
 stuttgart_desc: "----\n§9奔驰、保时捷，还有一个车多到山丘基本只用来观赏的山谷。§!"
 bern_desc: "----\n§9瑞士首都：熊、拱廊，还有一条拐成问号的河。§!"
 zurich_desc: "----\n§9银行、巧克力，还有一片干净到能照出你后悔事的湖。§!"
 vienna_desc: "----\n§9咖啡馆、歌剧院，以及一个从1919年起就在出租幸福的市政府。§!"
 amsterdam_desc: "----\n§9运河环、自行车，还有一个让郁金香泡沫都显得克制的楼市。§!"
 brussels_desc: "----\n§9欧盟总部、巧克力，还有一套把妥协练成艺术的官僚体系。§!"
 krakow_desc: "----\n§9瓦维尔龙、一个足球场大的集市广场，以及永远不打烊的学生酒吧。§!"
 bucharest_desc: "----\n§9巴尔干的巴黎，议会大厦吃掉了一整片街区；如今创业公司来填空。§!"
 sofia_desc: "----\n§9维托沙山就在门口，地铁里挖出罗马遗址，这座城市用三套字母耸肩。§!"
 zagreb_desc: "----\n§9奥式广场、巴尔干咖啡文化，还有一家预约爆满的“失恋博物馆”。§!"
 marseille_desc: "----\n§9说话快、吃马赛鱼汤、对任何着急的人都不信任的港口城市。§!"
 lyon_desc: "----\n§9法国的胃：丝绸钱、小馆子，还有一座自己发明了灯光的双河之城。§!"
 nice_desc: "----\n§9英国人漫步大道、卵石海滩，还有一套让蔚蓝海岸保持礼貌的税制。§!"
 bordeaux_desc: "----\n§9葡萄酒、河岸立面，还有一套顺滑到本地人几乎不再抱怨的有轨电车。§!"
 nantes_desc: "----\n§9造船厂改成了艺术机器——一头巨大的机械大象在旧码头散步。§!"
 toulouse_desc: "----\n§9粉红砖、空客机翼，还有一群除了橄榄球什么都要争的学生。§!"
 strasbourg_desc: "----\n§9欧洲议会、法德混搭菜单，还有一座曾拥有世界最高尖塔的大教堂。§!"
 lisbon_desc: "----\n§9七座山、黄色电车，还有一只至少能解决你两个问题的蛋挞。§!"
 madrid_desc: "----\n§9晚饭很晚、争论更老，还有一片比任何一届政府都长寿的博物馆三角区。§!"
 barcelona_desc: "----\n§9高迪的曲线、繁忙的港口，还有一个自认是国家的足球俱乐部。§!"
 athens_desc: "----\n§9古代大理石挨着现代涂鸦；那场辩论其实从来没结束过。§!"
 palermo_desc: "----\n§9花园、大理石与光的城市，宫殿在山海之间升起。交规只是建议。§!"
 naples_desc: "----\n§9维苏威在天边，披萨在手里，晾衣绳像节庆彩旗挂满小巷。§!"
 milan_desc: "----\n§9时装周、金融城，还有一座像大理石蕾丝的大教堂。§!"
 venice_desc: "----\n§9一座决定在水上建城、然后向所有人收入场费的城市。§!"
 istanbul_desc: "----\n§9两个大洲、一场堵在桥上的车流，还有把通勤变成观光航线的渡轮。§!"
 ankara_desc: "----\n§9一座被刻意建成的首都：部委、林荫大道，还有一座俯瞰全局的城堡。§!"
 izmir_desc: "----\n§9爱琴海微风、海滨长堤，还有一股固执的世俗海滨气质。§!"
 bursa_desc: "----\n§9奥斯曼的许多第一次：第一座首都、第一匹丝绸，还有能熬过冬天的栗子糖。§!"
 adana_desc: "----\n§9棉花、烤肉，还有热得能让塞伊汉河冒蒸汽的天气。§!"
 tehran_desc: "----\n§9达马万德山看着雾霾；地铁挤满人，争论比车流还古老。§!"
 baghdad_desc: "----\n§9底格里斯河、书籍，还有一座把图书馆重建了太多次的城市。§!"
 damascus_desc: "----\n§9地球上最古老的都城之一：一片绿洲、一座大清真寺，还有比战争更古老的耐心。§!"
 aleppo_desc: "----\n§9一座城堡、一个老集市，还有一座总在重新打开城门的城市。§!"
 jerusalem_desc: "----\n§9四个区、三种信仰，还有一条争得不可开交的天际线。§!"
 riyadh_desc: "----\n§9一座沙漠首都，用一代人的时间从土坯小城变成玻璃塔群。§!"
 abu_dhabi_desc: "----\n§9石油钱变成了博物馆、红树林，还有一条不需要借口的漂亮天际线。§!"
 dubai_desc: "----\n§9靠野心、空调和全世界最高的一切堆出来的天际线。§!"
 doha_desc: "----\n§9一个采珠小镇变成天然气之都，还买下一届世界杯来证明自己。§!"
