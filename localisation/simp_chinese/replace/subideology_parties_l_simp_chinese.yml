l_simp_chinese:

 BAN.conservatism: "£BAN_western_conservatism 国家党"
 BAN.conservatism_icon: "£BAN_western_conservatism"
 BAN.conservatism_desc: "民族党是孟加拉国的一个政党，由侯赛因·穆罕默德·艾尔沙德于1986年1月1日创立，旨在为支持其军事总统职位的民众提供平台。两年内，该党赢得了两次议会选举，尽管这两次选举都被广泛认为存在缺陷。艾尔沙德在1990年大规模起义中下台后，该党未能重夺选举主导地位，但曾多次与人民联盟组成联合政府。"
 BAN.liberalism: "£BAN_western_liberal 孟加拉人民党"
 BAN.liberalism_icon: "£BAN_western_liberal"
 BAN.liberalism_desc: "孟加拉国民族党（Bangladesh Jatiya Party），简称人民党（BJP），是孟加拉国的一个中右翼保守派政党。它是前总统侯赛因·穆罕默德·艾尔沙德（Hossain Mohammad Ershad）创立的原民族党（Jatiya Party）的一个分支。该党之前被称为民族党（Naziur），以已故党主席纳齐尔·拉赫曼·曼祖尔（Naziur Rahman Manzur）命名。曼祖尔曾是1971年孟加拉国独立战争中的解放军（Mukti Bahini）成员，并在艾尔沙德执政期间担任地方政府和农村发展部长兼达卡市政公司市长。1998年至2001年间，曼祖尔还担任民族党秘书长。"
 BAN.communist_state: "£BAN_emerging_communism 孟加拉工人党"
 BAN.communist_state_icon: "£BAN_emerging_communism"
 BAN.communist_state_desc: "孟加拉国工人党是孟加拉国的一个共产党。拉希德·汗·梅农是孟加拉国工人党主席，法兹勒·侯赛因·巴德沙是该党总书记。"
 BAN.anarchist_communism: "£BAN_anarchist_communism 民族社会党"
 BAN.anarchist_communism_icon: "£BAN_anarchist_communism"
 BAN.anarchist_communism_desc: "民族社会党（Jatiya Samajtantrik Dal）是孟加拉国的一个政党。该党由塞拉朱尔·阿拉姆·汗（Serajul Alam Khan）创立。该党在1972年至1975年孟加拉国叛乱期间占据主导地位。现任党主席是哈桑努尔·哈克·伊努（Hasanul Haque Inu）。"
 BAN.Caliphate: "£BAN_Caliphate 孟加拉国伊斯兰大会"
 BAN.Caliphate_icon: "£BAN_Caliphate"
 BAN.Caliphate_desc: "孟加拉国伊斯兰大会党是孟加拉国的一个保守派伊斯兰主义政党。它于1979年从巴基斯坦伊斯兰大会党东巴基斯坦派中分离出来，是该国最大的伊斯兰主义政党。"
 BAN.Nat_Populism: "£BAN_Conservative 孟加拉国人民联盟"
 BAN.Nat_Populism_icon: "£BAN_Conservative"
 BAN.Nat_Populism_desc: "孟加拉国人民联盟，俗称人民联盟，是孟加拉国的一个主要政党。该党成立于1949年6月23日，是该国现存历史最悠久的政党，在该国争取独立的斗争中发挥了至关重要的作用。它与孟加拉国民族主义党并列为该国传统上占主导地位的两大政党之一，并在2009年至2024年期间一直主导着该国的政治体系，直到七月革命被推翻。2025年5月10日，革命后政府根据《反恐怖主义法》禁止了该党的活动。"
 BAN.Conservative: "£BAN_Nat_Populism 孟加拉国民族主义党"
 BAN.Conservative_icon: "£BAN_Nat_Populism"
 BAN.Conservative_desc: "孟加拉民族主义党是孟加拉国的一个主要政党。该党由总统齐亚·拉赫曼于1978年9月1日创立，旨在以民族主义意识形态团结民众。后来，该党与其竞争对手人民联盟并列成为孟加拉国两大传统主导政党之一。"
 BHU.conservatism: "£BHU_western_conservatism 不丹和平与繁荣党"
 BHU.conservatism_icon: "£BHU_western_conservatism"
 BHU.anarchist_communism: "£BHU_anarchist_communism 不丹统一党"
 BHU.anarchist_communism_icon: "£BHU_anarchist_communism"
 BHU.Neutral_Libertarian: "£BHU_Neutral_Libertarian 人民民主党"
 BHU.Neutral_Libertarian_icon: "£BHU_Neutral_Libertarian"
 BRM.Autocracy: "£BRM_Autocracy 缅甸民族正义党"
 BRM.Autocracy_icon: "£BRM_Autocracy"
 CBD.liberalism: "£CBD_liberalism 烛光党"
 CBD.liberalism_icon: "£CBD_liberalism"
 CBD.liberalism_desc: "烛光党是柬埔寨的一个自由派政党。该党是亚洲自由民主委员会、自由国际和民主联盟的成员。它是柬埔寨最大的反对党，也是执政的柬埔寨人民党的主要挑战者。该党原本是柬埔寨人民党唯一有竞争力的反对党，尽管此前被允许参加2022年的地方选举，但国家选举委员会取消了其参加2023年大选的资格。该党自2012年以来一直处于非活跃状态，并于2021年10月恢复政治活动。"
 CBD.conservatism: "£CBD_conservatism 奉辛比克党"
 CBD.conservatism_icon: "£CBD_conservatism"
 CBD.conservatism_desc: "争取独立、中立、和平与合作的柬埔寨民族统一阵线（简称奉辛比克党）是柬埔寨的一个保皇派政党。该党由诺罗敦·西哈努克于1981年创立，最初是一场反对柬埔寨人民共和国（PRK）政府的抵抗运动。1982年，奉辛比克党与民主柬埔寨联合政府（CGDK）、高棉人民民族解放阵线（KPNLF）和红色高棉结成抵抗同盟。奉辛比克党于1992年正式成为一个政党。"
 CBD.Autocracy: "£CBD_Autocracy 柬埔寨人民党"
 CBD.Autocracy_icon: "£CBD_Autocracy"
 CBD.Autocracy_desc: "柬埔寨人民党是柬埔寨的一个政党，自1979年以来一直统治该国。该党成立于1951年，最初称为柬埔寨人民革命党（KPRP）。"
 CBD.Neutral_Libertarian: "£CBD_Neutral_Libertarian 柬埔寨民族支持党"
 CBD.Neutral_Libertarian_icon: "£CBD_Neutral_Libertarian"
 CBD.Neutral_Libertarian_desc: "柬埔寨民族支持党由主席宾索万创建，于1998年1月21日成立，并于同日召开第一次党代会。"
 CHI.Conservative: "£generic_Conservative_small 中国农工民主党"
 CHI.Conservative_desc: "中国农工民主党，简称农工党，是中华人民共和国排名第五的民主党派。农工党于1930年8月9日在上海成立，早期党员多来自中国国民党左派人士，目前党员主要来自医药卫生界高中级知识分子，参加中国共产党领导的多党合作和政治协商制度。"
 CHI.Neutral_conservatism: "£CHI_non_aligned_conservative 中国致公党"
 CHI.Neutral_conservatism_icon: "£CHI_non_aligned_conservative"
 CHI.Neutral_conservatism_desc: "中国致公党，简称致公党，是中华人民共和国排名第六的民主党派。目前，其党员主要来自归国华侨﹑侨眷和与海外有联系的代表性人士。致公党创立于1925年。其早期会员多来自海外洪门三合会人士。其前身是华侨社团“美洲洪门致公堂”发起的旨在维护华侨的正当权益的海外组织。中国致公党在实际工作当中，也承担洪门中国分部的职责，负责会见海外洪门代表团及成员，并对海外洪门组织进行访问活动。"
 CHI.oligarchism: "£generic_oligarchism_small 中国民主建国会"
 CHI.oligarchism_desc: "中国民主建国会，简称民建，是中华人民共和国排名第三的民主党派。民建创立于1945年12月16日，原名民主建国会，经1952年7月第二次总会扩大会议决议，改称中国民主建国会，是主要由经济界人士组成的、具有政治联盟特点的政党，是接受中国共产党领导，与中国共产党通力合作的中国特色社会主义参政党。民建早期盟员多来自文化教育界高级人士和民族工商业者。目前，其党员主要来自大中城市的工商企业家和经济界的中高层人士。荣毅仁是唯一一位来自该党的中华人民共和国副主席，其也是继宋庆龄后第二位担任该职位的民主党派人士。"
 CHI.Neutral_Libertarian: "£CHI_Neutral_Libertarian_small 九三学社"
 CHI.Neutral_Libertarian_icon: "£CHI_Neutral_Libertarian_small"
 CHI.Neutral_Libertarian_desc: "九三学社是中华人民共和国排名第七的民主党派。党章称是以科学技术界高、中级知识分子为主的具有政治联盟特点的政党，是接受中国共产党领导、同中国共产党通力合作的亲密友党，是中国特色社会主义参政党。其早期社员多为学界人士。目前，其社员主要来自科学技术界高、中级知识分子。"
 LAO.communist_state: "£LAO_emerging_communism 老挝人民革命党"
 LAO.communist_state_icon: "£LAO_emerging_communism"
 LAO.communist_state_desc: "老挝人民革命党是老挝人民民主共和国的创始政党和唯一执政党。老挝宪法第三条保障该党对国家权力的垄断，并维持国家统一，对经济和军事实行中央集权。"
 NEP.communist_state: "£Communist_Party_of_Nepal 尼泊尔共产党（毛主义中心）"
 NEP.communist_state_desc: ""
 NEP.Neutral_Communism: "£Communist_Party_of_Nepal_not_hardline 尼泊尔共产党（联合马列）"
 NEP.Neutral_Communism_desc: ""
 PAK.conservatism: "£PAK_western_conservatism 巴基斯坦穆斯林联盟（机能团体派）"
 PAK.conservatism_icon: "£PAK_western_conservatism"
 PAK.conservatism_desc: "巴基斯坦穆斯林联盟（机能团体派）是巴基斯坦的一个民族主义政党，支持胡尔斯家族。它是巴基斯坦穆斯林联盟的分离团体之一。其名称中的字母“F”代表“机能团体”。该党主要与信德宗教领袖皮尔·帕加罗（Pir Pagaro）有联系。"
 PAK.liberalism: "£PAK_liberalism 统一民族运动党"
 PAK.liberalism_icon: "£PAK_liberalism"
 PAK.liberalism_desc: "统一民族运动党（Muttahida Qaumi Movement）是巴基斯坦的一个政党，秉持自由主义政治立场和穆哈吉尔民族主义意识形态。该党领导人是哈立德·马克布尔·西迪圭（Khalid Maqbool Siddiqui）。该党的标志是风筝。该党主要活跃于卡拉奇，目前大多数穆哈吉尔人居住在那里。该党旨在通过和平民主的斗争，维护巴基斯坦穆哈吉尔人的人权。该党是穆哈吉尔民族运动党（MQM-L）的一个分支。"
 PAK.socialism: "£PAK_socialism 巴基斯坦人民党"
 PAK.socialism_icon: "£PAK_socialism"
 PAK.socialism_desc: "巴基斯坦人民党是巴基斯坦的一个政党，其政治立场偏中左至左，秉持民主社会主义意识形态。该党与巴基斯坦穆斯林联盟（谢里夫党）和巴基斯坦正义运动党并列为巴基斯坦三大主流政党。"
 PAK.communist_state: "£PAK_Communist_State 巴基斯坦共产党"
 PAK.communist_state_icon: "£PAK_Communist_State"
 PAK.communist_state_desc: "巴基斯坦共产党于1948年3月6日巴基斯坦建国后不久在印度加尔各答成立。当时在加尔各答举行的印度共产党第二次代表大会上决定，应在新成立的巴基斯坦国建立一个独立的共产党。人们认为，巴基斯坦作为一个相对新生的国家，局势动荡，革命的时机已经成熟。巴基斯坦代表脱离党派，举行了单独的会议，并在会上成立了巴基斯坦共产党。来自西巴基斯坦的全印进步作家协会创始人萨贾德·扎希尔当选为总书记。东巴基斯坦代表选举了东巴基斯坦省委员会。许多印度共产党的穆斯林领导人被派往巴基斯坦协助组建该党。巴基斯坦共产党采用列宁主义意识形态，旨在通过知识分子和劳动者的核心群体发动共产主义革命，这一战略受到弗拉基米尔·列宁在1917年俄国革命中的做法的启发。"
 PAK.Conservative: "£PAK_Conservative 巴基斯坦穆斯林联盟（谢里夫派）"
 PAK.Conservative_icon: "£PAK_Conservative"
 PAK.Conservative_desc: "巴基斯坦穆斯林联盟（谢里夫派）是一个中右翼保守派政党，与巴基斯坦人民党、正义运动党并列为巴基斯坦三大主流政党。"
 PAK.anarchist_communism: "£PAK_anarchist_communism 人民民族党"
 PAK.anarchist_communism_icon: "£PAK_anarchist_communism"
 PAK.anarchist_communism_desc: "人民民族党是巴基斯坦的一个政党，主要位于开伯尔-普什图省。该党政治立场偏左，秉持普什图民族主义和联邦主义意识形态。该党由阿卜杜勒·瓦利·汗于1986年创立，现任主席是巴查·汗的曾孙艾马尔·瓦利·汗，秘书长为米安·伊夫蒂卡尔·侯赛因。"
 PAK.Nat_Autocracy: "£PAK_Nat_Autocracy 巴基斯坦穆斯林联盟（领袖派）"
 PAK.Nat_Autocracy_icon: "£PAK_Nat_Autocracy"
 PAK.Nat_Autocracy_desc: "巴基斯坦穆斯林联盟（领袖派）是巴基斯坦的一个政党，政治立场中右，意识形态温和保守。"
 PAK.Nat_Fascism: "£PAK_Nat_Fascism 伊斯兰神学者协会（费派）"
 PAK.Nat_Fascism_icon: "£PAK_Nat_Fascism"
 PAK.Nat_Fascism_desc: "巴基斯坦伊斯兰乌里玛协会（Jamiat Ulema-e-Islam Pakistan）是巴基斯坦的一个政党，秉持极右翼政治立场和伊斯兰原教旨主义意识形态。该组织成立于1945年，原名伊斯兰乌里玛协会（Jamiat Ulema-e-Islam），是1988年派系分裂的结果，其名称中的“F”代表其领导人毛拉·法兹勒·拉赫曼（Maulana Fazl-ur-Rehman）的名字。"
 PAK.Nat_Populism: "£PAK_Nat_Populism 巴基斯坦正义运动"
 PAK.Nat_Populism_icon: "£PAK_Nat_Populism"
 PAK.Nat_Populism_desc: "正义运动党（PTI）是巴基斯坦的一个政党，由板球运动员兼政治家伊姆兰·汗于1996年创立。正义运动党与巴基斯坦穆斯林联盟谢里夫党和巴基斯坦人民党并列为巴基斯坦三大政党。"
 TNZ.anarchist_communism: "£TNZ_anarchist_communism 革命党"
 TNZ.anarchist_communism_icon: "£TNZ_anarchist_communism"
 TNZ.neutral_Social: "£generic_neutral_Social_small 坦桑尼亚工党"
 VIE.communist_state: "£VIE_emerging_communism 越南共产党"
 VIE.communist_state_icon: "£VIE_emerging_communism"
 VIE.communist_state_desc: "越南共产党（CPV）是越南唯一合法政党。该党由胡志明主席于1930年创立，并于1954年第一次印度支那战争后成为北越的执政党，并于1975年越南战争后成为全越南的执政党。尽管名义上与越南祖国阵线并存，但越南共产党实行统一政府，并对国家、军队和媒体实行集中控制。越南共产党的最高权力由国家宪法第四条保障。越南民众通常简称越南共产党为“党”或“我党”。"
