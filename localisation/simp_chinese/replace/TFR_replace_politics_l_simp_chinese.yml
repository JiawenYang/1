 POLITICS_IDEOLOGY_POPULARITY_CHANGE: "£boost_popularity_texticon $IDEOLOGY$支持度$VALUE|=+2%$"
 CHI_diplo_icon_tooltip_desc: "东亚防御倡议协定，通常简称为“东协”。是由§R中华人民共和国§!为领导国的国际组织，该组织致力于保障亚洲的和平与稳定，并确保组织的成员国不受一些军国主义者的侵略。\n\n作为这一组织的领导者以及亚洲集体安全的提出者，中国是该组织无可置疑的核心，她将会用自己手中的武器，保护她和她的盟友。同时在世界舞台上证明自己是一个能够维护和平的大国。"
 EADI_diplo_icon_tooltip_desc: "该国作为东亚防御倡议协定组织的正式成员国，比起一些在政治上缺乏独立性的国家而言，该国显然能够被称作一个主权国家。\n\n然而，由于东协核心国家的过于强势，哪怕中国没有对该国的政治进行过多的干涉，在一些反对中国的国家口中，仍然会将该国视为中国的附属国家。"
 EADI_Supervise_diplp_icon_tooltip_desc: "由于该国不具备独立治理国家的能力，在新政府完全掌握国家基层之前，暂时将部分国家权力交由东协方面进行监管。故该国被称为受监管国。\n\n虽然有部分国家指责这是中国干涉他国内政的实际证据，但事实上在该国在自身政权的组织架构完成后，东协方面便会结束该国的监管状态。"
 EADI_Observer_diplp_icon_tooltip_desc: "该国家是§R东亚防御倡议协定§!的观察员国，一般用于亲近北京但仍未正式宣布加入东协的国家。该国家会在一定的流程结束后正式加入东协，成为同北京并肩作战的一份子。"
 JAP_diplo_icon_tooltip_desc: "在美国霸权崩溃后，日本发现她如今正直面来自大海对面的宿敌的直接威胁。而为了获得足以对抗红色巨龙的力量，一个类似于北约的集体安全防卫组织势必而行。为此，日本与澳大利亚牵头建立了§C太平洋防卫条约组织§!，如今日本是该组织的核心国家，也是对抗中国巨人的第一道防线。"
 AST_diplo_icon_tooltip_desc: "美国霸权崩溃的冲击同样影响到了澳大利亚，为了保护自身的安全，澳大利亚同日本一道创立了§C太平洋防卫条约组织§!，并希望能够借此拉拢亚太地区的国家一同对抗来自北京的威胁。而澳大利亚将作为太约组织的大后方，为条约各国提供来自澳洲大陆的资源，以打造一个强大的战争机器。"
 RAJ_diplo_icon_tooltip_desc: "印度自1962年以来一直希望向中国复仇，而世界局势的日益紧张也让印度的野心迅速膨胀。在日本与澳大利亚牵头创立§C太平洋防卫条约组织§!后，印度也选择加入这个对抗中国巨人的阵营，即使印度对这些所谓的盟友不屑一顾，但为了对抗来自北京的压力，她也只得暂时屈居于这个组织之中。但假如说有一天太约真的取得了对华的胜利，§R印度或许不会与他们走上同一条道路。§!"
 PDTO_diplo_icon_tooltip_desc: "该国是§C太平洋防卫条约组织§!的成员国家，该国拥有独立的主权，而他们加入太约的原因大多是因为与中国有过一些争端，并且得到了来自东京以及堪培拉方面的利益许诺，最终选择加入该组织。虽说独立成员国之间处于平等关系，但由于各国的国家综合实力的差距，相互之间的矛盾以及歧视仍然存在。"
 PDTO_Supervise_diplp_icon_tooltip_desc: "该国在组织中作为其他国家的附属国而存在，这意味着其不具备一个完整主权的同时要接受来自宗主的控制。面对来自国际的指责，其宗主国宣称这是“暂时性的监管”，然而有种种迹象表明宗主在这个国家所进行了一系列的巧夺豪取。"
 PDTO_Observer_diplp_icon_tooltip_desc: "该国家与太约国家走的相近，同时也获得了来自太约官方的观察员国家身份。虽然其尚未加入§C太平洋防卫条约组织§!，但国际社会普遍认为其加入只是时间问题。"
