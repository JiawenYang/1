#描述# 
 CHI_GR_MILLENNIUM_DAWN_DESC: "§Y只有创造过辉煌的民族，才懂得复兴的意义；只有经历过苦难的民族，才对复兴有如此深切的渴望§!\n\n1840年鸦片战争以后，§R中国§!逐步成为半殖民地半封建社会，国家蒙辱、人民蒙难、文明蒙尘，中华民族遭受了前所未有的劫难。从那时起，实现中华民族伟大复兴，就成为中国人民和中华民族最伟大的梦想。由于西方列强的入侵和腐败的封建统治，从近代开始，§R中国§!陷入了落后挨打的境地，挣扎在半殖民地半封建社会的黑暗深渊中，§R中国人民是带着自己的首都被八国联军侵占的屈辱进入20世纪的。§!\n\n然而一时的黑暗并不是无尽的漫漫长夜，在1949年§R中华人民共和国§!建立后，中国从此摆脱了被殖民的命运，中国人民再也不用看着洋人的脸色生活。伟大领袖§R毛泽东主席§!带领数亿中国人民独立自主、自力更生地走出了一条§Y属于中国的发展道路§!，取得了举世瞩目的建设成就，由此向全世界证明：中国是一个§Y热爱和平§!的国度，发展并不需要侵略和剥削其他国家。从1978年开始，§Y改革开放政策§!使中国经济潜力得到前所未有的开发，中国在世界舞台上的身影越来越清晰，中国声音逐渐响亮起来。承办亚运会、长江大洪水、香港澳门回归、建国50周年大阅兵……§Y中国人民是带着多难兴邦的信心进入21世纪的。§!\n\n实现§Y中华民族伟大复兴§!，是近代以来中华民族最伟大的梦想。§R中国共产党§!一经成立，就把实现§R共产主义§!作为党的最高理想和最终目标，义无反顾肩负起§Y实现中华民族伟大复兴§!的历史使命，团结带领人民进行了艰苦卓绝的斗争，谱写了气吞山河的壮丽史诗。\n\n§Y今天，中国人民比历史上任何时期都更接近、更有信心和能力实现中华民族伟大复兴的目标。在千禧年到来之际，中国共产党和中国人民已经做好了走向新时代的准备。§!"

 MILLENNIUM_DAWN: "千禧黎明"
 MILLENNIUM_DAWN_DESC: "冷战结束已近十年，苏联霸权轰然倒塌后的新国际秩序已然构筑，美国稳坐霸权之座，享受互联网经济带来的经济景气。西方基督教世界在圣经的祝福下迎接繁荣而稳定的千禧年，伊斯兰世界则深陷贫穷与动乱之中。曾如日中天的日本在泡沫破灭后艰难前行。亚洲四小龙的光辉地位在97年亚洲金融危机的冲击后正逐步被中国轰鸣的工厂所遮蔽，后者正逐步走上世界舞台的中心。苏联的遗产已被分割殆尽，特工出身的新总统接手的是一具行将就木的腐尸。朝鲜走上了苦难行军的道路，韩国则经济持续高速增长。非洲陷入混战与贫困。世界正处在一个动乱与和平共存的新时代。"


#新闻#
 chi_millennium.1: "联合国千禧年首脑会议"
 chi_millennium.1.t: "联合国千禧年首脑会议召开"
 chi_millennium.1.d: "2000年9月6日至8日，联合国千年首脑会议在纽约联合国总部举行，会议的主题是“21世纪联合国的作用”。本次会议据传由中国提议举办。在为期3天的会议期间，各国元首和政府首脑围绕“21世纪联合国的作用”这一主题，就在新形势下维护世界和平、促进发展、建立国际政治经济新秩序、加强联合国作用等问题交换了意见。中国国家主席江泽民出席会议并在会上发表了重要讲话，并就维护《联合国宪章》的宗旨和原则等一系列问题阐述了中国的立场。\n\n会议指出：“没有一个国家、没有一个组织可以单独解决所有这些问题。可是，任何一个国家，如果其政府和公民不全心全意地投入这项任务，就不要设想他人会替它解决这些问题。建设一个比20世纪更安全、更公平的21世纪，乃是需要每一个国家和每一个人都作出坚定努力才能做好的工作。”"
 chi_millennium.1.a: "说的不错"
 chi_millennium.1.b: "江主席在会议上出尽了风头！"

#音乐#
 MD_fm_habibi: "千禧中国流行乐"

##航天##
 cnsa.1.t:0 "中国完成首次载人航天"
 cnsa.1.d:0 "中国自主研制的神舟五号载人飞船在酒泉卫星发射中心用长征二号F运载火箭发射成功，将中国第一名航天员杨利伟送上太空，飞船准确进入预定轨道。这是中国进行的首次载人航天飞行，使之成为了世界上第三个能够独立开展载人航天活动的国家。"
 cnsa.1.a:0 "太空之旅没有国界"
 cnsa.1.b:0 "伟大的壮举"
 cnsa.2.t:0 "神舟六号的载人飞行"
 cnsa.2.d:0 "神舟六号载人飞船是中国第一艘执行“多人多天”任务的飞船。飞船在中国酒泉卫星发射中心发射，五天后在内蒙古四子王旗降落。执行宇航员为费俊龙、聂海胜。标志着中国在发展载人航天飞行方面又取得了一个具有里程碑意义的重大成果。"
 cnsa.2.a:0 "太空之旅没有国界"
 cnsa.2.b:0 "一个里程碑"
 cnsa.3.t:0 "中国航天员首次太空行走"
 cnsa.3.d:0 "神舟七号飞船是中国第三个载人航天器，是中国“神舟”号系列飞船之一，飞船在中国酒泉卫星发射中心发射。神七上载有三名宇航员分别为翟志刚（指令长）、刘伯明和景海鹏。升空后，翟志刚与刘伯明两人分别穿着中国制造的“飞天”舱外航天服和俄罗斯出品的“海鹰”舱外航天服进入神舟七号载人飞船兼任气闸舱的轨道舱。翟志刚出舱作业，刘伯明在轨道舱内协助，实现了中国历史上第一次的太空漫步，令中国成为第三个有能力把太空人送上太空并漫步太空的国家。"
 cnsa.3.a:0 "一次充满挑战的任务"
 cnsa.3.b:0 "重大的突破"
 cnsa.4.t:0 "中国发射首个探月卫星"
 cnsa.4.d:0 "嫦娥一号是中国探月计划中的第一颗绕月人造卫星，[GetDateText]，嫦娥一号在西昌卫星发射中心发射升空。 嫦娥一号卫星首次绕月探测的成功，树立了中国航天的第三个里程碑，突破了一大批具有自主知识产权的核心技术和关键技术，使中国成为世界上为数不多具有深空探测能力的国家。"
 cnsa.5.t:0 "中国发射嫦娥二号探测器"
 cnsa.5.d:0 "嫦娥二号是中国的第二颗绕月人造卫星。它是建基于探月工程一期的嫦娥一号备份星进行技术改进，作为二期工程的先导星，且命名为嫦娥二号。嫦娥二号主要是用作试验、验证部分新技术和新设备，降低往后工程的风险，同时深化月球科学探测。"
 cnsa.5.a:0 "雄心勃勃"
 cnsa.5.b:0 "我们的征途是星辰大海"
 cnsa.4.a:0 "雄心勃勃"
 cnsa.4.b:0 "这是我们千年的理想"
 cnsa.6.t:0 "天宫一号发射"
 cnsa.6.d:0 "中国在酒泉卫星发射中心载人航天发射场，用“长征二号F”T1运载火箭，将中国全新研制的首个目标飞行器“天宫一号”发射升空。 天宫一号作为一个目标飞行器，有别于天空实验室或空间站核心舱和实验舱，其目的只是作为其他飞行器的接合点，并不会长时间逗留太空。"
 cnsa.6.a:0 "我们必须重视中国在太空领域的发展"
 cnsa.6.b:0 "我们的征途是星辰大海"
 cnsa.7.t:0 "神舟八号任务成功"
 cnsa.7.d:0 "神舟八号是中国发射的一艘无人飞船，在完成与先前发射的天宫一号的交会对接后，神舟八号自动返回地球。随后，中国载人航天工程总指挥、总装备部部长常万全宣布，根据着陆场区报告，“神舟八号”飞船返回舱已在内蒙古主着陆场安全着陆，“天宫一号”与“神舟八号”空间交会对接任务取得圆满成功，完成了中国的首次太空交会对接实验。"
 cnsa.7.a:0 "中国太空技术的又一突破"
 cnsa.7.b:0 "我们向建成空间站的目标更进了一步"
 cnsa.8.t:0 "神舟九号发射"
 cnsa.8.d:0 "托举神九飞船的长征二号F遥九火箭，从酒泉卫星发射中心腾空而起。这是长征火箭的第165次发射，也是神舟飞船的第四次载人飞行。 此刻，天宫一号正在距飞船约1万公里的太空中等待神九前来“赴约”。"
 cnsa.8.a:0 "中国太空技术的又一突破"
 cnsa.8.b:0 "巾帼不让须眉"
 cnsa.9.t:0 "神舟九号任务成功"
 cnsa.9.d:0 "今日，神舟九号载着三名航天英雄回到了祖国，任务圆满成功。神舟九号任务圆满成功标志着载人航天工程第二步任务取得了重大成果，为今后的载人航天的发展、空间站的建设奠定了良好的基础。"
 cnsa.9.a:0 "中国太空技术的又一突破"
 cnsa.9.b:0 "英雄归来"
 cnsa.10.t:0 "神舟十号任务成功"
 cnsa.10.d:0 "神舟十号是中国“神舟”号系列飞船的第十次任务，也是中国载人航天的第五次任务，共载三名宇航员与天宫一号目标飞行器分别进行无人和有人的交会对接，成功对接后两男一女三名航天员入驻天宫一号。是为神舟飞船与天宫一号最后的一次对接任务。飞船由推进舱（服务舱）、返回舱、轨道舱组成。加上发射与返回，神舟十号共在轨飞行15天左右，其中驻留天宫一号12天。其返回舱将在内蒙古四子王旗着陆场着陆。"
