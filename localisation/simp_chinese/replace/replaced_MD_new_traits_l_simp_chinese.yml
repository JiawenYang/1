 CHI_Agricultural_development: "农业现代化决议"
 CHI_Agricultural_development_desc: "\n\n\n\n\n\n£MAIN_desctext_chi_agri\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]中国§!是一个§G农业大国§!，以全球总数仅§Y7%的耕地§!，养活了全球近§Y20%的人口§!，创造了全球近§Y30%的农业GDP产值§!。尽管如此，要喂饱我们的人民依然是一件§Y相当困难§!的事，这就迫使我们进一步提升我国§G农业生产§!。\n\n§R中国共产党§!在擘画§Y全面建成社会主义现代化强国§!宏伟蓝图时，对农业农村工作进行了总体部署。概括地讲：要全面推进乡村振兴，到2035年基本实现§G农业现代化§!，到本世纪中叶建成§G农业强国§!。这是§R党中央§!着眼§Y全面建成社会主义现代化强国§!作出的战略部署。\n\n§Y强国必先强农，农强方能国强§!，没有农业强国就没有整个现代化强国；没有农业农村现代化，社会主义现代化就是不全面的。我们必须把加快建设农业强国摆上建设社会主义现代化强国的重要位置，保持战略定力、久久为功，锚定建设农业强国目标，科学谋划，推进“三农”工作。"
 CHI_Promote_high_quality_fertilizers: "在全国推广优质化肥"
 CHI_Promote_high_quality_fertilizers_desc: "优质化肥能够减少对土地肥力的消耗，同时增加农作物的有机含量，为人民提供更健康、更营养的农作物"
 CHI_Songnen_Plain_Commodity_Grain_Base: "松嫩平原商品粮基地"
 CHI_Songnen_Plain_Commodity_Grain_Base_desc: "松嫩平原，是东北平原的最大组成部分，位于大小兴安岭与长白山脉及松辽分水岭之间的松辽盆地里的中部区域，主要由松花江和嫩江冲积而成。耕地面积559万公顷，土壤肥沃，黑土、黑钙土占60%以上。盛产大豆、小麦、玉米、甜菜、亚麻、马铃薯等，是黑龙江省和国家的重要商品粮基地，粮食商品率占30%以上；草场集中，包括齐齐哈尔、甘南、龙江、泰来、杜尔伯特、富裕、林甸、大庆、安达、肇东、肇州、肇源等市县境内草场，约200余万公顷，以羊草、小叶樟、野豌豆、星星草等优势种草组成的一、二、三等草场面积占76%，畜牧业发达。"
 CHI_Sanjiang_Plain_Commodity_Grain_Base: "三江平原商品粮基地"
 CHI_Sanjiang_Plain_Commodity_Grain_Base_desc: "三江平原，旧称“北大荒”，即东北平原的东北部分。“三江”指黑龙江、乌苏里江、松花江，此三条大江浩浩荡荡汇流于此，冲积形成了这块平整的沃土。中华人民共和国成立后，这里进行了大规模的农垦耕作，先后建立4个国营农场管理局、50多个大型国营农场，开垦耕地4600多万亩，“北大荒”已一跃而成“北大仓”，成为中国最大的农垦区，是小麦、大豆、玉米、水稻等重要商品粮生产基地。"
 CHI_Panjin_Plain_Commodity_Grain_Base: "辽宁盘锦垦区"
 CHI_Panjin_Plain_Commodity_Grain_Base_desc: "辽宁省盘锦垦区，旧称“南大荒”，解放后，这里开发了部分荒原，办起了国营农场。盘锦垦区资源丰富，适于农、林、牧、副、渔全面发展。"
 CHI_Dongtinghu_Plain_Commodity_Grain_Base: "洞庭湖平原商品粮基地"
 CHI_Dongtinghu_Plain_Commodity_Grain_Base_desc: "洞庭湖平原位于湖南省东北部，居两湖盆地（也称湖北盆地）里两湖平原的南部，北部与湖北的江汉平原相接。主要由长江通过松滋、太平、藕池、调弦四口输入的泥沙和洞庭湖水系湘江、资江、沅江、澧水等带来的泥沙冲积而成。面积1万平方公里。湖面海拔34.5米，总湖容178亿立方米，号称“八百里洞庭”。整个平原总面积18780平方公里，其中湖南省部分15200平方公里，占总面积的81%，覆盖常德、益阳、湘阴、岳阳等19个县市以及涔澹农场等15个国营农场；湖北部分3580平方公里，占19%，辖松滋、公安、石首等县（市）。"
 CHI_Jianghan_Plain_Commodity_Grain_Base: "江汉平原商品粮基地"
 CHI_Jianghan_Plain_Commodity_Grain_Base_desc: "江汉平原，位于汉地华中“千湖之省”湖北省中南部，由长江与汉江冲积而得名。江汉平原位于两湖盆地西部和中部，河流纵横交错，湖泊星罗棋布，是长江中游平原的重要组成部分，与洞庭湖平原合称两湖平原，平均海拔只有27米左右，是中国海拔最低的平原之一。\n\n江汉平原物产丰盛，“人人都说天堂美，怎比我江汉鱼米乡”。是他的真实写照。江汉平原是我国少有的稻，麦，粟，棉，麻，油，糖，鱼，菜都能大量出产的地区。主要以种植水稻、棉花、油菜为主，水稻产量高，为当地人民的生活提供了有力的物质保障。"
 CHI_Chengdu_Plain_Commodity_Grain_Base: "成都平原商品粮基地"
 CHI_Chengdu_Plain_Commodity_Grain_Base_desc: "四川是我国地位极为重要的人口大省和农业大省，自古就有“天府之国”的美誉，如今是全国13个粮食主产省之一和西部唯一的粮食主产省。2022年6月，习近平总书记来川视察时强调，成都平原自古有“天府之国”的美称，要严守耕地红线，保护好这片产粮宝地，把粮食生产抓紧抓牢，在新时代打造更高水平的“天府粮仓”。"
 CHI_Pearl_River_Delta_Commodity_Grain_Base: "珠江三角洲商品粮基地"
 CHI_Pearl_River_Delta_Commodity_Grain_Base_desc: "珠江三角洲平原位于广东省中南部，面积约11000平方千米，平均海拔50米左右，河网纵横，孤丘散布。珠江三角洲平原由东、西、北三条大河汇流堆积而成，面积达1万平方千米以上，成为中国商品粮基地之一。它面积不大，但是生产力强，每平方千米能养活近千人，为热带地区开发最好的平原。"
 CHI_Poyanghu_Plain_Commodity_Grain_Base: "鄱阳湖平原商品粮基地"
 CHI_Poyanghu_Plain_Commodity_Grain_Base_desc: "鄱阳湖平原，又称豫章平原、鄱阳湖盆地，是南昌盆地的重要部分。是长江和鄱阳湖支流水系赣江、抚河、信江、修河、饶河等水冲积而成的湖滨平原，为长江中下游平原的一部分。平原上稻田、菜畦、鱼塘、莲湖纵横交错，是江南的粮仓和棉花、油料、生猪等生产的重要基地。"
 CHI_Yangtze_River_delta_Commodity_Grain_Base: "长江三角洲商品粮基地"
 CHI_Yangtze_River_delta_Commodity_Grain_Base_desc: "中国长江三峡以东的中下游沿岸带状平原。北界淮阳丘陵和黄淮平原，南界江南丘陵及浙闽丘陵。由长江及其支流冲积而成。面积约20多万平方千米，地势低平。平原大部为水稻土，农业发达，土地垦殖指数高，是重要的粮、棉、油生产基地，盛产稻米、小麦、棉花、油菜、桑蚕、苎麻 、黄麻等。产鱼 、虾、蟹、莲、菱、苇，还有中华鲟、扬子鳄、白暨豚等世界珍品，水产在中国占重要地位，素称鱼米之乡。"
 CHI_Huaihe_Plain_delta_Commodity_Grain_Base: "淮河平原商品粮基地"
 CHI_Huaihe_Plain_delta_Commodity_Grain_Base_desc: "淮河中游平原，位于安徽省境的北部，为省内平原中的主体，其范围既包括淮河以北的全部地区，也包括淮河以南宽10～60公里左右的地区。通过近30年的改造，现已绿树成荫，花果满园。同时，由于土中可溶性盐类的含量较大，尤其是在宿县地区北部，由于黄泛沉积厚达10～20米，土层中含可溶性盐类的总量更大，土壤易于盐化、碱化。"
 CHI_Hexi_Corridor_Commodity_Grain_Base: "河西走廊商品粮基地"
 CHI_Hexi_Corridor_Commodity_Grain_Base_desc: "河西走廊灌溉农业区历史悠久，是甘肃省重要农业区之一，是我国西北内陆著名的灌溉农业区，是西北地区最主要的商品粮基地和经济作物集中产区。其提供了甘肃全省2/3以上的商品粮、几乎全部的棉花、9/10的甜菜、2/5以上的油料、啤酒大麦和瓜果蔬菜。平地绿洲区主要种植春小麦、大麦、糜子、谷子、玉米、及少量水稻、高粱、马铃薯。油料作物主要为胡麻。瓜类有西瓜、仔瓜和白兰瓜，果树以枣、梨、苹果为主。山前地区以夏杂粮为主，主要种植青稞、黑麦、蚕豆、豌豆、马铃薯和油菜。河西畜牧业发达，如山丹马营滩自古即为著名军马场。"
 CHI_Nei_Mongol_Commodity_Grain_Base: "内蒙古商品粮基地"
 CHI_Nei_Mongol_Commodity_Grain_Base_desc: "内蒙古是我国重要商品粮生产基地，有着发展粮食生产的传统优势。内蒙古粮食产量连续5年稳定在3000万吨以上，是全国净调出商品粮的6个省区之一；全区肉类总产量达到267.6万吨、牛奶总产量达到693万吨，具备每年稳定向区外调出500万吨牛奶、150万吨肉类的能力，是国家名副其实的“粮仓”、“肉库”、“奶罐”。"
 CHI_Hetao_Plain_Commodity_Grain_Base: "宁夏河套平原商品粮基地"
 CHI_Hetao_Plain_Commodity_Grain_Base_desc: "宁夏平原又称银川平原，位于宁夏回族自治区中部黄河两岸，由黄河冲击而成，地势平坦，土层深厚，引水方便，利于自流灌溉。虽处于温带干旱区，年降水量不足200毫米，但黄河年均过境水量达300余亿立方米，加上年3000小时的日照时数，光、热、水、土等农业自然资源配合良好，为发展农林牧渔业提供了极其有利的条件。小麦、水稻高产稳产，枸杞、瓜果品质优良。银川附近遍布的湖沼是宁夏的水产基地，而贺兰山前广袤的草场，则是宁夏滩羊的重要产区。"
 CHI_Xinjiang_Production_and_Construction_Corps_Reclamation_Area: "新疆生产建设兵团垦区"
 CHI_Xinjiang_Production_and_Construction_Corps_Reclamation_Area_desc: "新疆生产建设兵团，简称“新疆兵团”，是中华人民共和国计划单列的省部级特殊区划，总部驻乌鲁木齐市，承担国家赋予的屯垦戍边职责。新疆生产建设兵团地处欧亚交汇要冲，东西方动植物品种在此交汇，加上多样与独特的自然地理条件，生物资源丰富。新疆生产建设兵团温带作物齐全，粮食作物以小麦、玉米、水稻为主。全疆大部分地区均可种植高粱、大麦、大豆、豌豆、绿豆、胡豆、粟、黍、红薯等杂粮。伊犁河谷素有“新疆粮仓”之称。"

 CHI_North_South_Water_Transfer_decision: "南水北调工程决议"
 CHI_North_South_Water_Transfer_decision_desc: "\n\n\n\n\n\n£MAIN_desctext_snwd\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]中国§!§l水资源§!总体§R短缺§!、时空分布极不均匀、水旱灾害多发频发，是世界上§R水情最为复杂、江河治理难度最大、治水任务最为繁重§!的国家之一。1952年，§R毛泽东同志§!在视察黄河时提出：“§l南方水多，北方水少，如有可能，借点水来也是可以的§!”，这是南水北调的宏伟构想首次提出。自此，在历经分析比较50多种方案后，调水方案获得一大批富有价值的成果。\n\n南水北调工程规划区涉及人口4.38亿人，调水规模448亿立方米，分§Y东、中、西三条线路§!，三线总长度达4350公里。东、中线一期工程干线总长为2899公里，沿线六省市一级配套支渠约2700公里。南水北调工程主要解决§Y中国北方地区§!，尤其是§Y黄淮海流域§!的水资源短缺问题。\n\n§Y西线工程§!地处青藏高原，海拔高，地质的构造复杂，地震烈度大，且要修建200米左右的高坝和长达100公里以上的隧洞，工程技术复杂，耗资巨大，现仍处于可行性研究的过程中。但如若时机成熟，我们将一举建成这一§Y世界上规模最大、难度最高§!的水利工程，为中国无数人民§Y一劳永逸§!地解决§l水资源§!§R短缺问题§!。\n"
 CHI_Central_Line_Projec_Resettlement: "移民安置"
 CHI_Central_Line_Projec_Resettlement_desc: "南水北调是一项积极的社会民生工程。兴建南水北调中线工程，将30万移民中的多数外迁到居住和生存条件较好的地方安置，将大大改善库周的生态环境，并提高移民的生活水平"
 CHI_Central_Line_Projec_Danjiangkou_Reservoir: "加高丹江口水库大坝"
 CHI_Central_Line_Projec_Danjiangkou_Reservoir_desc: "我们首先将丹江口水库的主坝丹江口大坝加高，抬高丹江口水库蓄水水位，利用新开的人工渠道向总干渠输水"
 CHI_Central_Line_Projec_Drilling_through_Yellow_River: "中线总干渠穿黄工程"
 CHI_Central_Line_Projec_Drilling_through_Yellow_River_desc: "穿黄隧洞是南水北调工程中规模最大、单项工期最长、技术含量最高、施工难度最复杂的交叉建筑物。穿黄工程于2005年9月27日开工建设，历时9年。设计流量每秒265立方米，加大流量每秒320立方米"
 CHI_Central_Line_Projec_henan_main_canal: "中线总干渠河南段"
 CHI_Central_Line_Projec_henan_main_canal_desc: "总干渠沟通长江、淮河、黄河、海河四大流域，需穿过黄河干流及其他集流面积10平方千米以上河流219条，跨越铁路44处，需建跨总干渠的公路桥571座，此外还有节制闸、分水闸、退水建筑物和隧洞、暗渠等，总干渠上各类建筑物共936座"
 CHI_Central_Line_Projec_hebei_main_canal: "中线总干渠河北段"
 CHI_Central_Line_Projec_hebei_main_canal_desc: "总干渠沟通长江、淮河、黄河、海河四大流域，需穿过黄河干流及其他集流面积10平方千米以上河流219条，跨越铁路44处，需建跨总干渠的公路桥571座，此外还有节制闸、分水闸、退水建筑物和隧洞、暗渠等，总干渠上各类建筑物共936座"
 CHI_Central_Line_Projec_beijing_water_conveyance_tunnel: "中线北京段西四环暗涵工程"
 CHI_Central_Line_Projec_beijing_water_conveyance_tunnel_desc: "南水北调中线北京段西四环暗涵工程，具有两条内径4米的有压输水隧洞，穿越北京市五棵松地铁站，这是世界上第一次大管径浅埋暗挖有压输水隧洞从正在运营的地下车站下部穿越，创下暗涵结构顶部与地铁结构距离仅3.67米、地铁结构最大沉降值不到3毫米的纪录"
 CHI_Central_Line_Projec_tianjin_main_canal: "中线总干渠天津段"
 CHI_Central_Line_Projec_tianjin_main_canal_desc: "天津干渠穿越大小河流48条，有建筑物119座。"
 CHI_Central_Line_Projec_beijing_main_canal: "中线总干渠北京段"
 CHI_Central_Line_Projec_beijing_main_canal_desc: "总干渠沟通长江、淮河、黄河、海河四大流域，需穿过黄河干流及其他集流面积10平方千米以上河流219条，跨越铁路44处，需建跨总干渠的公路桥571座，此外还有节制闸、分水闸、退水建筑物和隧洞、暗渠等，总干渠上各类建筑物共936座"
 central_line_officially_began_carrying_water: "南水北调中线正式通水"
 central_line_officially_began_carrying_water_desc: "南水北调中线工程正式通水，可使河南、河北、北京、天津四地免受缺水之苦"
 CHI_East_Line_Projec_Connecting_the_Grand_Canal_between_Beijing_and_Hangzhou: "连接京杭大运河"
 CHI_East_Line_Projec_Connecting_the_Grand_Canal_between_Beijing_and_Hangzhou_desc: "以京杭运河为输水主干线，并利用三阳河、淮河入江水道、徐洪河等分送。在现有工程基础上扩挖三阳河和潼河、金宝航道、淮安四站输水河、骆马湖以北中运河、梁济运河和柳长河6段河道；疏浚南四湖；安排徐洪河、骆马湖以南中运河影响处理工程；对江都站上的高水河、韩庄运河局部进行整治。"
 CHI_East_Line_Projec_Drilling_through_Yellow_River_east: "东线总干渠穿黄工程"
 CHI_East_Line_Projec_Drilling_through_Yellow_River_east_desc: "打通一条洞径9.3米的倒虹隧洞，输水能力200立方米/秒"
 CHI_East_Line_Projec_Jiaodong_area_water_supply_main_line: "胶东地区输水干线"
 CHI_East_Line_Projec_Jiaodong_area_water_supply_main_line_desc: "开挖胶东地区输水干线西段240公里河道，将所调水源运送至山东东部地区"
 CHI_East_Line_Projec_Lubei_Water_Transfer_Main_Line: "鲁北输水干线"
 CHI_East_Line_Projec_Lubei_Water_Transfer_Main_Line_desc: "自穿黄隧洞出口至德州，扩建小运河和七一、六五河两段河道，将所调水源运送至山东西部、中部和北部地区"
