#########特殊项目
 sp_chi_robot_dog_dev: "机械狼"
 sp_chi_robot_dog_dev_desc: "机械狼是一种仿生的四足机器人，具有高度可定制化、模块化以及自主性，并且搭配不同武器按需使用。"
 sp_chi_ultra_high_voltage_transmission: "特高压输电"
 sp_chi_ultra_high_voltage_transmission_desc: "特高压输电，是指1000千伏交流电压和±800千伏直流电压输电工程和技术，能十分有效地减少能源输送时产生的损耗。"
 sp_chi_giant_construction_machinery: "巨型工程机械"
 sp_chi_giant_construction_machinery_desc: "一类专门用于进行巨型工程的专用设备，让人类的创造不受约束。"
 sp_chi_advanced_automated_terminal: "自动化码头"
 sp_chi_advanced_automated_terminal_desc: "只需要少量操作人员便可以维护的高效码头，能方便且高效地保障物资流通。"
 sp_chi_hypersonic_wind_tunnel: "高超音风洞"
 sp_chi_hypersonic_wind_tunnel_desc: "高超音速风洞，是指实验段马赫数范围约为5~14，气流温度高到能防止气流等熵膨胀到上述马赫数时在实验段发生液化，而没有高到足以产生真实气体效应的风洞。"
 sp_chi_commercial_quantum_computer: "商用量子计算机"
 sp_chi_commercial_quantum_computer_desc: "第一代基于量子理论的商业化计算机，在性能上远超传统架构的计算机，并且拥有无限可能。"
 sp_chi_advanced_3D_printing: "一体化3D打印"
 sp_chi_advanced_3D_printing_desc: "铸锻铣一体化金属3D打印能极大的缩短3D打印耗时以及减少能耗和材料损失，且由其生产的零件强度能优于传统工艺下的相同产品。"
 sp_chi_artificially_synthesized_starch: "吨级人工合成淀粉"
 sp_chi_artificially_synthesized_starch_desc: "仅使用化学手段将水和二氧化碳在消耗电力的条件下合成淀粉，不依赖光合作用，能带来农业技术的颠覆性革命。"

####独特建筑
 landmark_DLYTridge: "渤海跨海大桥"
 landmark_DLYTridge_desc: "该大桥缩短了辽宁和山东地区的通行时间，为开展经济活动创造了有利条件。"
 landmark_TWFZridge: "台福跨海大桥"
 landmark_TWFZridge_desc: "该大桥缩短了的台湾岛和大陆地区通行时间，为开展经济活动创造了有利条件。"
 landmark_HZMBridge: "港珠澳大桥"
 landmark_HZMBridge_desc: "港珠澳大桥，是中华人民共和国境内一座连接香港、广东珠海和澳门的桥隧工程，位于广东珠江口伶仃洋海域内，为珠江三角洲地区环线高速公路南环段。港珠澳大桥东起香港国际机场附近的香港口岸人工岛，向西横跨南海伶仃洋水域接珠海和澳门人工岛，止于珠海洪湾立交。桥隧全长55千米，其中主桥29.6千米、香港口岸至珠澳口岸41.6千米。桥面为双向六车道高速公路，设计速度100千米/小时，该大桥缩短了这些地区的通行时间，为开展经济活动创造了有利条件。"
 landmark_ThreeGorgesDam: "三峡大坝"
 landmark_ThreeGorgesDam_desc: "三峡水库东端，控制流域面积约100万平方千米，始建于1994年，集防洪、发电、航运、水资源利用等为一体，是三峡水电站的主体工程、三峡大坝旅游区的核心景观、当今世界上最大的水利枢纽建筑之一。"
 landmark_ChinaNationalPavilion: "世博会中国馆"
 landmark_ChinaNationalPavilion_desc: "中国2010年上海世博会中国国家馆，以城市发展中的中华智慧为主题，表现出了“东方之冠，鼎盛中华，天下粮仓，富庶百姓”的中国文化精神与气质。共分为国家馆和地区馆两部分，主体造型雄浑有力，犹如华冠高耸，天下粮仓；地区馆平 台基座汇聚人流，寓意社泽神州，富庶四方。"
 landmark_BirdNestStadium: "鸟巢体育馆"
 landmark_BirdNestStadium_desc: "国家体育场（National Stadium），又名“鸟巢”（Bird's Nest），位于北京奥林匹克公园中心区南部，为2008年北京奥运会的主体育场。体育场的形态如同孕育生命的“巢”和摇篮，寄托着人类对未来的希望。设计者们对这个场馆没有做任何多余的处理，把结构暴露在外，因而自然形成了建筑的外观。"
 landmark_OrientalPearl: "东方明珠"
 landmark_OrientalPearl_desc: "东方明珠广播电视塔，简称“东方明珠”，位于上海市浦东新区陆家嘴世纪大道1号，地处黄浦江畔，背拥陆家嘴地区现代化建筑楼群，与隔江的外滩万国建筑博览群交相辉映，1991年7月30日动工建造，1994年10月1日建成投入使用，是集都市观光、时尚餐饮、购物娱乐、历史陈列、浦江游览、会展演出、广播电视发射等多功能于一体的上海市标志性建筑之一。"
 landmark_Tiananmen: "天安门"
 landmark_Tiananmen_desc: "天安门城楼为中华人民共和国的象征，它庄严肃穆的形象是中国国徽的重要组成部分，在其前面是开阔的天安门广场。天安门广场是世界上最大的城市广场，历经多次修改与变动，最终形成南北长880米，东西宽500米，面积达44万平方米的规模。广场内沿北京中轴线由北向南依次矗立着国旗杆、人民英雄纪念碑、毛主席纪念堂和正阳门城楼等重要建筑。"
 landmark_GreatWall: "万里长城"
 landmark_GreatWall_desc: "万里长城是中国古代的军事防御工事，是一道高大、坚固而且连绵不断的长垣，用以限隔敌骑的行动。长城不是一道单纯孤立的城墙，而是以城墙为主体，同大量的城、障、亭、标相结合的防御体系，长城修筑的历史可上溯到西周时期，延续不断修筑了2000多年，分布于中国北部和中部的广大土地上，总计长度达2万多千米。"
 landmark_SouthToNorthDiversion: "南水北调工程"
 landmark_SouthToNorthDiversion_desc: "南水北调工程是优化水资源配置、促进区域协调发展的基础性工程。通过三条调水线路与长江、黄河、淮河和海河四大江河的联系，构成以“四横三纵”为主体的总体布局，以利于实现中国水资源南北调配、东西互济的合理配置格局。"
 landmark_PotalaPalace: "布达拉宫"
 landmark_PotalaPalace_desc: "布达拉宫是历世达赖喇嘛的冬宫，也是过去西藏地方统治者政教合一的统治中心，从五世达赖喇嘛起，重大的宗教、政治仪式均在此举行，同时又是供奉历世达赖喇嘛灵塔的地方。布达拉宫建筑及宫藏文物上集中体现了中国各民族之间政治、经济、文化等方面的交往交流交融，证明西藏自古以来就是中国不可分割的一部分。"
 landmark_SunYatSenMemorial: "中山纪念堂"
 landmark_SunYatSenMemorial_desc: "中山纪念堂是广州最具标志性的建筑物之一，是广州人民和海外华侨为纪念孙中山先生集资兴建的。主体建筑占地1.2万平方米，高52米，是一座八角形古宫殿式建筑。它采用钢桁架和钢筋混凝土结构，由前后左右四个宫殿式重檐歇山抱厦建筑组成。堂顶镶盖宝蓝色的琉璃瓦，瓦面分高低四层，层层飞檐出卷。大堂内跨度达71米的建筑空间内不设一柱，气势恢宏，富丽堂皇。"
