 chinese_space_program: "中国太空计划"
 chinese_space_program_desc: "\n\n\n\n\n\n£MAIN_desctext_chi_space\n\n\n\n\n\n\n\n\n\n探索浩瀚宇宙，是§Y中华民族§!数千年来矢志不渝的追求。§C中国航天§!承载了一个大国的§Y斑斓梦想§!，也寄寓了新时代中国人的§Y骄傲与情怀。§!\n§Y[CHI.GetFlag]中华人民共和国§!航天事业可以追溯到1956年，由§C中国国家航天局§!领头。中国发展航天事业的宗旨是：探索外太空，扩展对地球和宇宙的认识；和平利用外太空，促进§C人类文明§!和社会进步，§C造福全人类§!；满足经济建设、科技发展、国家安全和社会进步等方面的需求，提高全民科学素质，维护国家权益，增强综合国力。§C中国发展航天事业§!贯彻国家科技事业发展的指导方针，即自主创新、重点跨越、支撑发展、引领未来。\n\n通过我们的不懈努力，§Y[CHI.GetFlag]中华人民共和国§!将最终成为§Y世界航天大国§!，进而引领§Y全人类§!§C放眼宇宙，迈向群星§!\n"

 CHI_motuo_hydropower_station_decision: "墨脱水电站"
 CHI_motuo_hydropower_station_decision_desc: "\n\n\n\n\n\n£MAIN_desctext_motuo\n\n\n\n\n\n\n\n\n\n§Y墨脱水电站§!计划修建于中国藏南地区，由于这里地势落差较大且地形十分复杂，水能资源尤为丰富。根据相关专家计算显示，整个西南地区的水能资源约占我国水能总量的三分之一，而墨脱水电站计划的装机容量为6000万千瓦。三峡工程作为目前世界上最大的水利工程，年发电量为3000亿千瓦。在此种情况下，一旦墨脱水电站建成，将会成为§Y世界上发电总量最高的水电站§!，也会促进西北地区的农业发展。墨脱水电站建成之后，可以为我国每年省去8000万吨的标准煤，或者是4000万吨的石油，有利于我国实现2060年实现§G零排放§!的承诺。\n"
 Form_motuo_inspection_team: "组建考察团"
 Form_motuo_inspection_team_desc: "墨脱水电站建设是一项巨大的工程，我们必须要做好充足的准备，勘测和规划好整个工程计划"
 construction_motuo_dam: "修建墨脱水电站"
 construction_motuo_dam_desc: "由于科考团和解放军的艰苦付出，我们完成了墨脱水电站的勘测，现在可以着手进行工程建设"

 CHI_OGAS_construction: "全国自动化系统建设"
 CHI_OGAS_construction_desc: "\n\n\n\n\n\n£MAIN_desctext_CHIOGAS\n\n\n\n\n\n\n\n\n\n§Y邓小平同志§!曾指出：“§l科学技术是第一生产力§!”，“§Y社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕§!”。\n\n上世纪，在§R苏联§!曾产生过一个超越时代的计划，即§YOGAS计划——全国自动化系统计划§!。然而，彼时的§R苏联§!已经由曾经那个§R无产阶级专政的社会主义国家§!变成了一个§O完全由官僚阶级掌控的修正主义国家§!，§O特权官僚§!们不可能同意这个计划而放弃自己对社会生产的掌握，否则他们的§Y特权和特供物资§!也就无从谈起了。\n\n由于我国仍然是一个§Y人民民主专政的社会主义国家§!，§R中国共产党§!随时有觉悟对自我展开革命，我们能够凭借§Y人民的意志§!和§Y党的领导决策§!克服一切阻碍社会主义社会发展的桎梏，我们如今无论是在§l科技水平§!、§Y社会生产力§!还是§Y政治制度§!上，都已经有能力实现这个§Y空前绝后的伟大计划§!，进一步解放生产力，把中国建设成为§G更加美好、幸福的以人为本的社会§!。\n\n我们将借助§Y全国自动化建设工程§!进一步完善§Y中国特色社会主义制度§!，实现§R中国式现代化§!\n"
