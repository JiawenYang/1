 CHI_Three_North_Shelterbelt_Forest_Program: "三北防护林工程"
 CHI_Three_North_Shelterbelt_Forest_Program_desc: "\n\n\n\n\n\n£MAIN_desctext_sanbei\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]中国§!三北地区，有八大沙漠、四大沙地，其中面积为133万平方公里，大于中国耕地面积的总和。这里曾经是§G水草肥美§!的农、牧区，如今已是§R遍地黄沙§!，年风沙日达30~100天，下游河床已高出地面10米以上。\n\n§Y[CHI.GetFlag]中国政府§!为改善生态环境，于1979年决定把§Y三北防护林工程§!列为国家经济建设的重要项目。工程规划期限为73年，分八期工程进行，如今已经启动第六期工程建设。建设三北工程是改善生态环境，减少自然灾害，维护生存空间的战略需要，是改善三北地区生态环境、解决生态灾难的根本措施。\n\n按照总体规划，三北工程的建设范围东起黑龙江省的宾县，西至新疆的乌孜别里山口，北抵国界线，南沿天津、汾河、渭河、洮河下游、布尔汗布达山、喀喇昆仑山，东西长4480公里，南北宽560-1460公里。地理位置在东经73°29'~129°50'，北纬33°30'~50°14'之间。包括陕西、甘肃、宁夏、青海、新疆、山西、河北、北京、天津、内蒙古、辽宁、吉林、黑龙江13个省（自治区、直辖市）的559个县（旗、市、区）。工程建设总面积406.9万平方公里，占中国陆地总面积的42.4%。\n\n从前，这里是§R黄沙遍地的恶地§!，在§Y党和国家§!的领导下，§Y中国人民§!将§Y彻底§!改变这一局面，把整个中国北方变成§G生意盎然的生态新天地§!\n"
