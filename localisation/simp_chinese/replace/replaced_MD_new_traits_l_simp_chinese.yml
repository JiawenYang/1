 tech_CHI_ultra_high_voltage_transmission: "特高压输电"
 tech_CHI_ultra_high_voltage_transmission_desc: "特高压输电，是指1000千伏交流电压和±800千伏直流电压输电工程和技术，能十分有效地减少能源输送时产生的损耗。"
 tech_CHI_giant_construction_machinery: "巨型工程机械"
 tech_CHI_giant_construction_machinery_desc: "一类专门用于进行巨型工程的专用设备，让人类的创造不受约束。"
 tech_CHI_advanced_automated_terminal: "自动化码头"
 tech_CHI_advanced_automated_terminal_desc: "只需要少量操作人员便可以维护的高效码头，能方便且高效地保障物资流通。"
 tech_CHI_hypersonic_wind_tunnel: "高超音风洞"
 tech_CHI_hypersonic_wind_tunnel_desc: "高超音速风洞，是指实验段马赫数范围约为5~14，气流温度高到能防止气流等熵膨胀到上述马赫数时在实验段发生液化，而没有高到足以产生真实气体效应的风洞。"
 tech_CHI_commercial_quantum_computer: "商用量子计算机"
 tech_CHI_commercial_quantum_computer_desc: "第一代基于量子理论的商业化计算机，在性能上远超传统架构的计算机，并且拥有无限可能。"
 tech_CHI_advanced_3D_printing: "一体化3D打印"
 tech_CHI_advanced_3D_printing_desc: "铸锻铣一体化金属3D打印能极大的缩短3D打印耗时以及减少能耗和材料损失，且由其生产的零件强度能优于传统工艺下的相同产品。"
 tech_CHI_artificially_synthesized_starch: "吨级人工合成淀粉"
 tech_CHI_artificially_synthesized_starch_desc: "仅使用化学手段将水和二氧化碳在消耗电力的条件下合成淀粉，不依赖光合作用，能带来农业技术的颠覆性革命。"

