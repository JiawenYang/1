 CHI_market_for_technology: "市场换技术"
 CHI_market_for_technology_desc: "“市场换技术”指的是始自80年代后期少数中外轿车合资企业建立，直至中国加入WTO，允许世界各大汽车跨国公司在中国合资设厂，进行本土化生产。中国必须有自己的骨干企业，合资必须建立在双赢的基础上，按中国的长远利益搞。我们让出巨大的市场，我们就有资格要技术、要利润。"
