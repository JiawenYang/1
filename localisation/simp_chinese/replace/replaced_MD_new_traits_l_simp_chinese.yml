 CHI_raid_militant_hideouts_desc: "安全部门已经锁定了这群极端主义恐怖分子的藏身处，我们可以对这些武装分子发动突击行动并抓捕他们，但这有可能导致其他分裂主义恐怖分子狗急跳墙发动报复性袭击。"
