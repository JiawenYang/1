 CHI_Social_trends_category: "中国社会思潮"
 CHI_Social_trends_category_desc: "\n\n\n\n\n\n£MAIN_desctext_sichao\n\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]中国§!是一个拥有十多亿人口的国家，尽管官方始终强调和重视§H意识形态宣传工作§!，但要想让这样一个人口规模巨大的国家的人民全部认同§H某一种价值观§!是不可能的。尽管大多数中国人都是§g政治冷感§!者，对国家的政策没有太多的看法，但如若生活环境§R变化过大§!，即使是最迟钝的人也会§H开始思考§!。\n\n赵武灵王曾说：§C循法之功，不足以高世；法古之学，不足以制今§!。千禧年是瞬息万变的年代，中国在这一风云变幻的时代中需要§Y审慎地§!对待国内政策。对中国来说，倘若改革过缓，则恐§g悔之晚矣§!；倘若改革过激，则无异于§R自取灭亡§!。\n\n§Y[CHI.GetFlag]中国§!的人群思潮大致可分为三类：寻求变革的§C思变派§!，没有成体系看法的§g缄默派§!，以及追求维持现状的§O保守派§!。\n\n§Y国内派系：§!\n      §C思变派：§!  所占比例 [?left_bian|C%%]   满意率 [?left_Support|Y%%]  \n      §g缄默派：§!  所占比例 [?political_apathy|g%%]   满意度 [?political_apathy_Support|Y%%] \n      §O保守派：§!  所占比例 [?right_bian|O%%]   满意度 [?right_Support|Y%%] \n\n§C思变派§!人群是国内相对思想先进的群体，他们将根据其满意度而审视§C西方世界§!和§R中国§!的差异，如若他们对§Y现状§!感到§C令人振奋§!，则会§C批判西方意识形态§!对我国的影响，并积极参与建设一个§C富于创新精神的社会§!\n\n§g缄默派§!人群是§g沉默的大多数§!，他们将根据其满意度表达自己§Y对当局的支持§!，决定是否主动缴纳§g更多的税款§!和§g配合政府行政§!上的工作\n\n§O保守派§!是国内§O相当一部分人群§!，他们§O反对激进的变化§!，希望政府能创建一个§O和谐、稳定、美好§!的社会。其将根据满意度助力§O维持社会的稳定§!，以及§O抵御西方世界对我国的意识形态冲击§!\n\n社会思潮支持人数和满意度将随§H国家政策§!和§R突发事件§!变化，满意度低于§Y50%§!即视为该群体§R不满意§!当前状。如若各派对现状§R感到不满§!，则会带来完全相反的效果，并引发一定的§R负面社会事件§! \n\n§Y[CHI.GetFlag]中国§!是一艘巨大的航船，必须保持§Y平稳运行§!，一旦稍有不慎，就会陷入§R万劫不复§!的境地，§Y中华民族伟大复兴§!的宏伟征程也将§R化为泡影§!\n"
