 United_Nations_Security_Council_category: "联合国安全理事会"
 United_Nations_Security_Council_category_desc: "\n\n\n\n\n\n£MAIN_desctext_unsc\n\n\n\n\n\n\n\n\n\n§Y联合国安全理事会§!是联合国下属的六个主要机构之一，其是唯一有权§Y采取军事行动§!的联合国机构。由§Y[USA.GetFlag]美利坚合众国§!、§Y[CHI.GetFlag]中华人民共和国§!、§Y[SOV.GetFlag]俄罗斯联邦§!、§Y[ENG.GetFlag]大不列颠及北爱尔兰联合王国§!、§Y[FRA.GetFlag]法兰西第五共和国§!五个§Y联合国安全理事会常任理事国§!创建，五个§Y联合国安全理事会常任理事国§!拥有§Y安理会否决权§!。\n尽管联合国对国际事务的干预能力很低，特别是对国际战争的干预，但§Y联合国安全理事会常任理事国§!可以凭借自身强大的政治、经济和军事影响力来施压干涉战争。\n\n五个§Y联合国安全理事会常任理事国§!分别有其不同的国际关系诉求，如§Y[USA.GetFlag]美利坚合众国§!和§Y[SOV.GetFlag]俄罗斯联邦§!会更加积极地谋求自身利益，而§Y[CHI.GetFlag]中华人民共和国§!则更加提倡国际和平。\n\n§Y联合国安全理事会常任理事国§!是调停战争、维护世界和平的重要角色，然而一旦他们自己互相开战，则世界格局将发生§R根本性的转变§!。"
