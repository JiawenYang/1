 Robot_Dog_equipment: "机械狼"
 Robot_Dog_equipment_desc: "机械狼本质上是一类仿生机器人，它们具备步行、跑步、翻越障碍等多种运动能力，并且具有高度可定制化、模块化以及自主性，可搭配不同武器按需使用。"
