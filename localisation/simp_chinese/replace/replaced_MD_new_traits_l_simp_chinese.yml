 CHI_West_Line_Yaertang_Water_diversion_hub_desc: "建亚尔堂引水枢纽，引水11.5亿立方米"
 CHI_West_Line_Ake_water_conveyance_tunnel: "阿柯河输水隧洞工程"
 CHI_West_Line_Ake_water_conveyance_tunnel_desc: "通过输水隧洞穿过分水岭将亚尔堂引水枢纽所引水送到阿柯河"
 CHI_West_Line_Keke_Water_diversion_hub: "克柯引水枢纽"
 CHI_West_Line_Keke_Water_diversion_hub_desc: "建克柯引水枢纽，引水2亿立方米"
 CHI_West_Line_Dadu_River_water_conveyance_tunnel: "大渡河输水隧洞工程"
 CHI_West_Line_Dadu_River_water_conveyance_tunnel_desc: "通过输水隧洞穿过大渡河与黄河的分水岭将克柯引水枢纽所引水送到黄河支流贾曲"
