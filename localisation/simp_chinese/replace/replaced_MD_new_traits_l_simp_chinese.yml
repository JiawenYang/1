 chinese_space_program_moonbase: "中国月球基地"
 chinese_space_program_moonbase_desc: "\n\n\n\n\n\n£MAIN_desctext_moonbase\n\n\n\n\n\n\n\n\n\n“§Y日月之行，若出其中。星汉灿烂，若出其里§!”§Y月球§!是中国人从古至今心系牵挂的文化符号，对于我国人民来说，§C走向太空§!的第一步必然是在月球上建立属于中国和人类的§C月球基地§!。得益于我们先进的太空技术和建筑技术，我们能在月球上建立一个长期的基地。\n\n当前建材数量：[?CHI_space_program_moonbase_building_materials|Y]；居住设施完整度：[?CHI_space_program_moonbase_residential_system|Y%]；维生系统完整度：[?CHI_space_program_moonbase_life_support_system|Y%]；科研系统完整度：[?CHI_space_program_moonbase_research_system|Y%]；作业系统完整度：[?CHI_space_program_moonbase_operating_system|Y%] \n\n当各个系统完整度到达§G100%§!后，我们便可以宣告月球基地的竣工。\n"

