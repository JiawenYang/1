 south_china_sea_category: "中国南海"
 south_china_sea_category_desc: "\n§Y[CHI.GetFlag]中国南海§!作为全球三分之一贸易往来的地区、作为保护我国利益的军事要地，其在战略和经济上的重要性怎么强调都不过分。\n\n我国对§Y[CHI.GetFlag]中国南海§!有主权宣称，然而不少南海周边的国家竞相抢占岛屿与海域，为了和平与稳定，以及保持与周边国家的良好关系，我们没有像陆地领土那样在这里寸土必争，而是采取一种半容忍的态度。\n\n在与周遭其他国家频繁发生争端和紧张局势的背景下，特别是这片海域最近才发现大片油气田，我们要智胜对手，将我们的力量投射到该地区，这一点至关重要。\n\n§Y中美对抗烈度§!：[?CHI.chinese_aggression]\n"
