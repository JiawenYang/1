 CHI_category_PRC_USA_relations: "中美关系"
 CHI_category_PRC_USA_relations_desc: "\n\n\n\n\n\n£MAIN_desctext_CHI_USA\n\n\n\n\n\n\n\n\n\n世界上最大的工业国和唯一的超级大国会如何相处？§Y[CHI.GetFlag][CHI.GetName]§!与§Y[USA.GetFlag][USA.GetName]§!之间的关系无疑在国际社会之中最为重要，在无形之中影响着其他国家的方方面面。当中美两国相安无事，则世人共享和平与繁荣，然若两国摩擦不断，也将§R殃及池鱼§!。\n\n当前中美之间冲突的剧烈程度：[?CHI.chinese_aggression|Y0]\n§Y[CHI.GetFlag][CHI.GetName]§!的全局影响力得分为：[?CHI.hegemony_victory|Y1]\n§Y[USA.GetFlag][USA.GetName]§!的全局影响力得分为：[?USA.hegemony_victory|Y1]\n\n[ROOT.PRC_USA_relations_show_desc]"
 
 CHI_category_PRC_USA_relations_show_change: "我方上个月被动改变值：\n由于对世界GDP贡献与独立性：[?ROOT.temp_percentage_of_global_factories|+=1]\n由于所拥有附庸的经济体量贡献：[?ROOT.temp_hegemony_victory_subject|+=1]\n由于国家精神、决议、事件等固定值加成：[?ROOT.temp_hegemony_victory_monthly_add|+=1]\n由于国家精神、决议、事件等百分比加成：[?ROOT.temp_hegemony_victory_monthly_mult_show|=+%2]\n\n当我们的全局影响力得分§Y高于§!对方时，将会享受§Y政治、经济、科技§!等方面的§G诸多正面加成§!，数值取决于当前§Y双方全局影响力得分之差§!。\n\n然而，我们的对手§R不会坐以待毙§!，其他国家更是会§R试图破坏§!我们所建立的秩序，我们必须要§Y行动起来§!。\n"
 CHI_category_PRC_USA_relations_show_change_other: "而我们要做的就是在这两个国家之间§Y做出选择§!，亦或者在冲突爆发之时§Y独善其身§!。\n\n当站在§Y[USA.GetFlag][USA.GetAdjective]§!一边时：$PRC_USA_relations_stand_USA_good_tt$\n当站在§Y[CHI.GetFlag][CHI.GetAdjective]§!一边时：$PRC_USA_relations_stand_PRC_good_tt$。\n\n然而，选择并非没有代价：当冲突的剧烈程度§Y超过§!§R15§!，将会受到敌对一方国家的§R负面惩罚§!，而§Y选择中立§!则会受到中美两方的§R负面惩罚§!，但每一项的惩罚幅度较少，并且获得$foreign_influence_monthly_domestic_independence_gain_modifier$以及$foreign_influence_defense_modifier$的§G正面加成§!，数值取决于当前§Y我们对于GDP的贡献度和独立性§!。"
