 CHI_Chastity_Paifang_desc: "§W$CHI_Chastity_Paifang_war_willingness_effect_tt$§!\n\n[ROOT.CHI_Chastity_Paifang_DESC]"
 CHI_Chastity_Paifang_war_willingness_effect_tt: "如果§Y主动宣战§!将会受到以下影响: \n$MODIFIER_STABILITY_FACTOR$: [?copy_CHI_Chastity_Paifang_stability_factor|+=%]\n$MODIFIER_war_support_modifier$: [?copy_CHI_Chastity_Paifang_war_support_factor|+=%]\n$MODIFIER_RESEARCH_SPEED_FACTOR$: [?copy_CHI_Chastity_Paifang_research_speed_factor|+=%]\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: [?copy_CHI_Chastity_Paifang_production_speed_buildings_factor|+=%]\n$MODIFIERS_ARMY_ATTACK_FACTOR$: [?copy_CHI_Chastity_Paifang_army_attack_factor|+=%]\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: [?copy_CHI_Chastity_Paifang_army_defence_factor|+=%]\n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: [?copy_CHI_Chastity_Paifang_army_core_attack_factor|+=%]\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: [?copy_CHI_Chastity_Paifang_army_core_defence_factor|+=%]"
 CHI_Chastity_Paifang_1: "和平共处"
 CHI_Chastity_Paifang_1_desc: "21世纪是和平与发展的世纪，至少目前大部分人是这样想的。\n倘若想让整个社会都对现存世界秩序充满失望，并积极投身于改变当前秩序的事业，还需要做不少的努力与工作。\n\n当前$CHI_Chastity_Paifang_war_willingness$: [?CHI_Chastity_Paifang_war_willingness|Y]，上个月被动变化值: [?CHI_Chastity_Paifang_war_willingness_show|+=2]"
 CHI_Chastity_Paifang_2: "中华崛起"
 CHI_Chastity_Paifang_2_desc: "树欲静而风不止。扫帚未到，灰尘照例不会自己跑掉。批判的武器不能代替武器的批判。这个不公的世界秩序荼毒全世界太久了！\n\n当前$CHI_Chastity_Paifang_war_willingness$: [?CHI_Chastity_Paifang_war_willingness|Y]，上个月被动变化值: [?CHI_Chastity_Paifang_war_willingness_show|+=2]"
 CHI_Chastity_Paifang_war_willingness: "整体战争意愿"
