 MDGR_sanction_from_p5_effect_tt: "§Y$MDGR_sanction_from_p5$§!将会对§Y[FROM.GetName]§!造成以下影响: \n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: [?temp_MDGR_sanction_from_p5_production_speed_buildings_factor|+=%]\n$productivity_growth_modifier$: [?temp_MDGR_sanction_from_p5_productivity_growth_modifier|+=]\n$MODIFIER_POLITICAL_POWER_FACTOR$: [?temp_MDGR_sanction_from_p5_political_power_factor|+=%]\n$MODIFIER_STABILITY_WEEKLY$: [?temp_MDGR_sanction_from_p5_stability_weekly|+=%]\n$MODIFIER_WAR_SUPPORT_WEEKLY$: [?temp_MDGR_sanction_from_p5_war_support_weekly|+=%]"
