 cnsa.101.t:0 "鹊桥号中继卫星"
 cnsa.101.d:0 "“鹊桥”是嫦娥四号月球探测器的中继卫星，是中国首颗、也是世界首颗地球轨道外专用中继通信卫星。"
 cnsa.101.a:0 "好耶"
 cnsa.102.t:0 "嫦娥四号探测器发射成功"
 cnsa.102.d:0 "载有“嫦娥四号”的“长征三号乙”运载火箭在今天凌晨发射升空，该探测器有望进行人类历史上首次月球背面软着陆。 “嫦娥四号”是中国野心勃勃的月球计划的一部分。由于月球背面没有来自地球的无线电波干扰，被视为天文观测的极佳场所。此外，它预计还将对月球背面的矿产和地貌进行勘探。"
 cnsa.102.a:0 "好耶"
 cnsa.103.t:0 "嫦娥五号探测器发射成功"
 cnsa.103.d:0 "北京时间今天4：30，中国在海南文昌航天发射场用长征五号遥五运载火箭成功发射了“嫦娥五号”探测器。此次发射任务将尝试把月球岩石样品带回地球。如果一切顺利，飞船将于半个月后返回地球。 中国官方新华社称，嫦娥五号的科学目标主要是，开展着陆点区域形貌探测和地质背景勘察，获取与月球样品相关的现场分析数据，建立现场探测数据与实验室分析数据之间的联系；对月球样品进行系统、长期的实验室研究，分析月壤结构、物理特性、物质组成，深化月球成因和演化历史的研究。"
 cnsa.103.a:0 "壮举"
 cnsa.104.t:0 "嫦娥六号探测器发射成功"
 cnsa.104.d:0 "北京时间今天4：30，中国在海南文昌航天发射场用长征五号运载火箭成功发射了“嫦娥六号”探测器，嫦娥六号携带着来自多个国际合作伙伴的科学研究装置，将在月球的南极地区进行软着陆并采样返回，为中国探月的三步走计划画上句号。"
 cnsa.104.a:0 "好耶"
 cnsa.105.t:0 "中国天宫号空间站开始建设"
 cnsa.105.d:0 "今天，伴随着巨大的轰鸣，长征五号乙运载火箭搭载着中国完全自主研发的天宫空间站核心舱奔向太空，他将与接下来发射的问天号以及梦天号实验舱对接，并在空间组合成中国天宫号空间站的基本型。天宫号空间站完工后将与多艘天舟号货运飞船和神舟号载人飞船对接，以完成长期长久不断续的常驻任务。"
 cnsa.105.a:0 "我来组成头部"
 cnsa.106.t:0 "问天号实验舱"
 cnsa.106.d:0 "问天号实验舱，控制与实验应用舱，主要用于研究，舱外设置一架小型机械臂。"
 cnsa.106.a:0 "我来组成腿部"
 cnsa.107.t:0 "梦天号实验舱"
 cnsa.107.d:0 "梦天号实验舱，专业应用舱, 置有实验载荷气闸舱，可将大型载荷投放至真空。"
 cnsa.107.a:0 "我来组成脚部"
 cnsa.108.t:0 "中国空间站建成投入使用"
 cnsa.108.d:0 "今天，随着天宫号的大型机械臂将巡天号光学舱安装到位，中国载人航天办公室正式对外宣布中国天宫号空间站建成。 空间站的建成标志着中国已经拥有了长期在外太空轨道驻守与进行科学实验的能力，接下来，空间站将与全新的神舟载人飞船与天舟货运飞船对接，以完成常驻任务，今后每组航天员都将轮替驻扎6个月。\n\n天宫号空间站的基本构型成功组建后，可根据需求，在核心舱的前端增建三舱组成空间站“十”字的扩展构型，三段扩展舱A、B、C处于核心舱的前端，组成小“Ｔ”字型。扩展舱A后端与核心舱前端对接，扩展舱B和C与扩展舱A前端的左右处对接。载人飞船对接于扩展舱A的正前端。可依据需求增配第二艘载人飞船以备紧急返回使用，对接于核心舱前端下方。长期乘航天员人数提高到3~6人，最大规模可达180吨。"
 cnsa.108.a:0 "我们的征途是星辰大海"
 cnsa.109.t:0 "望舒计划"
 cnsa.109.d:0 "经中央商讨决议，我国载人登月计划正式定名为“望舒计划”。“望舒之辇”是本计划载人月球车的设计方案，由清华大学牵头研制。该名称灵感来源于中国古代传说中的月亮女神望舒，同时融入了秦始皇陵铜车马的关键元素。设计团队从工程技术出发，结合人文思想，最终形成了以大尺度车轮和圆形穹窿华盖为特点的月球车设计方案。该方案不仅满足了月球车搭乘月球着陆器到月球表面的尺寸和重量限制条件，还考虑了航天员穿着月球航天服存在的手腕和手指运动受限的问题，并设计了可以将前进、后退、转向和刹车动作解耦的操作杆。"
 cnsa.109.a:0 "前望舒使先驱兮，后飞廉使奔属"
 cnsa.111.t:0 "望舒二号发射"
 cnsa.111.d:0 "今天，望舒二号火箭发射成功，搭载3名久经考验的共产党员宇航员和望舒之辇载人月球车成功升天。不久后他们就能成功登录月球，我国将成为继美国之后第二个登上月球的国家。"
 cnsa.111.a:0 "下车如昨日，望舒四五圆"
 cnsa.112.t:0 "中国人第一次在月球上留下了自己的脚印"
 cnsa.112.d:0 "今天，望舒之辇成功着陆月球，三名宇航员在月球上踏出了自己，同时也是中国的月球第一步。\n\n我们特意挑选了与上世纪美国宇航员同样的登陆地点，然而宇航员们却没有发现那个广为人知的美国宇航员的脚印。"
 cnsa.112.a:0 "别管美国佬了，来看看咱们的脚印"
 cnsa.113.t:0 "英雄归来"
 cnsa.113.d:0 "今天，三名宇航员乘坐的返地仓成功着陆，但磕在了一块没有被发现的石头上，返地仓落地时滚了个圈，所幸三位宇航员毫发无伤。"
 cnsa.113.a:0 "历史书上少不了这一笔" 
 cnsa.120.t:0 "天问一号火星探测器发射成功"
 cnsa.120.d:0 "今天，我国在海南岛东北海岸中国文昌航天发射场，用长征五号遥四运载火箭成功发射首次火星探测任务天问一号探测器。火箭成功将探测器送入预定轨道。\n\n按照计划，探测器将在地火转移轨道飞行约7个月后，到达火星附近，通过“刹车”完成火星捕获，进入环火轨道，并择机开展着陆、巡视等任务，进行火星科学探测。"
 cnsa.120.a:0 "冲冲冲" 
 cnsa.121.t:0 "到达火星"
 cnsa.121.d:0 "天问一号已经到达火星，成功进入火星轨道。接下来，着陆器上的火星车将为我们源源不断的带来新的数据。"
 cnsa.121.a:0 "书写新的篇章" 
 cnsa.122.t:0 "天问二号火星探测器发射成功"
 cnsa.122.d:0 "今天，我国在海南岛东北海岸中国文昌航天发射场，用长征六号遥五运载火箭成功发射首次火星探测任务天问一号探测器。火箭成功将探测器送入预定轨道。\n\n按照计划，天问二号是小行星探测任务，目标主要是对一颗近地小行星的伴飞、取样返回等探测。主要任务是对近地小行星2016HO3开展伴飞探测并取样返回。"
 cnsa.122.a:0 "多拍点照片" 
 cnsa.123.t:0 "到达火星"
 cnsa.123.d:0 "今天，天问二号已经到达火星，成功进入火星轨道。接下来，着陆器上的火星车将为我们源源不断的带来新的数据。"
 cnsa.123.a:0 "上面到底能不能种土豆？" 
 cnsa.124.t:0 "第一个从火星返回的人造物！"
 cnsa.124.d:0 "今天，天问二号成功回到地球，然而经过大气层时其表面保护层破了一个口子，内部许多组件融化了。好在所取的样本没有损坏，我们成功接收到了人类历史上第一个从火星返回的人造物！"
 cnsa.124.a:0 "把火星土壤拿出来种土豆！" 

##事件##
 chinapro.101.t:0 "汶川大地震"
 chinapro.101.d:0 "汶川大地震发生于北京时间2008年5月12日（星期一）14时28分04秒，震中位于中国四川省阿坝藏族羌族自治州汶川县映秀镇附近、四川省会成都市西北偏西方向79千米处。根据中国地震局的数据，此次地震的面波震级达8.2级、矩震级达8.3级，破坏地区超过10万平方千米。地震烈度可能达到11度。本次地震的地震波围绕地球传播了6圈，地震波及大半个中国及亚洲多个国家和地区。北至辽宁，东至上海，南至香港、广东、澳门、泰国、越南，西至巴基斯坦均有震感。\n\n截至2008年9月25日，地震共造成69227人死亡，17923人失踪，374643人不同程度受伤，1993.03万人失去家园，总受灾人口达4625.6万人。这是新中国成立以来破坏性最大的地震，也是继唐山地震后伤亡最惨重的地震。"
 chinapro.101.a:0 "动员所有力量救灾！"
 chinapro.101.b:0 "真是可怕"
 china_news.30.t:0 "第29届奥林匹克运动会"
 china_news.30.d:0 "第29届奥林匹克运动会于2008年8月8日至24日在中华人民共和国首都北京举行。此届奥运会是中国首次举办的夏季奥运会，是继1980年莫斯科奥运会和1984年萨拉热窝冬奥会之后，奥林匹克运动会第三次在社会主义国家举行。\n本届奥运会共产生43项新世界纪录及132项新奥运纪录，并有87个国家登上奖牌榜。主办国中华人民共和国以51面金牌成为金牌榜首名，是奥运历史上首个登上金牌榜首的亚洲国家，强化了中国作为体育强国的地位。\n美国以112面奖牌成为本届奥运会最多奖牌的国家。本届奥运会先后诞生出两名水上及陆上“飞人”——美国选手迈克尔·菲尔普斯及牙买加选手尤塞恩·博尔特取得了举世瞩目的成就，前者在“水立方”连夺八枚金牌，成为同一届奥运会中获得最多金牌的运动员。"
 china_news.30.a:0 "办的不错"
 china_news.30.b:0 "同一个世界，同一个梦想"
 chinapro.103.t:0 "韩国部署萨德反导系统"
 chinapro.103.d:0 "[?global.date.GetDateStringNoHour]，大韩民国在美国的协助下开始在国内部署萨德反导弹系统。萨德系统的部署在去年早些时候宣布开始磋商，而在去年晚些时候则正式宣布落实。\n该事件引发了国际性争议，韩国主张这项军事部署只是应付朝鲜民主主义人民共和国导弹威胁的防御措施，中华人民共和国则认为部署萨德系统会对其国土安全造成影响，并对韩采取多项反制措施。该事件亦对太平洋地区的战略平衡造成影响。"
 chinapro.103.a:0 "有趣..."
 chinapro.103.b:0 "韩国人将为此付出代价"
 chinapro.103.c:0 "我们必须保护自己"
 chinapro.104.t:0 "针对萨德的对策"
 chinapro.104.d:0 "韩国一意孤行的决定部署萨德，这将使我们近半的领土暴露在美国人的雷达监视之下，我们必须做出反制措施。"
 chinapro.104.a:0 "是可忍，孰不可忍"
 chinapro.104.b:0 "我们必须维持与韩国之间的关系"
 chinapro.106.t:0 "建国70周年国庆阅兵"
 chinapro.106.d:0 "2019年10月1日，为庆祝中华人民共和国成立70周年，中国在北京举行了盛大的阅兵仪式。阅兵式的受阅官兵由人民解放军、武警部队和民兵预备役部队约15000名官兵、580台（套）装备组成的15个徒步方队、32个装备方队；陆、海、空航空兵160余架战机，组成12个空中梯队。\n庆祝中华人民共和国成立70周年阅兵式是中国特色社会主义进入新时代的首次国庆阅兵，彰显了中华民族从站起来、富起来迈向强起来的雄心壮志。人民军队以改革重塑后的全新面貌接受[CHI.GetLeader]主席检阅，接受党和人民检阅，彰显了维护核心、听从指挥的坚定决心，展示了履行新时代使命任务的强大实力。"
 chinapro.106.a:0 "威武雄壮"
 chinapro.107.t:0 "东方之星旅游客船倾覆！"
 chinapro.107.d:0 "2015年6月1日21时30分，隶属于重庆东方轮船公司的东方之星轮，在从南京驶往重庆途中突遇罕见强对流天气，在湖北省荆州市监利县长江大马洲水道翻沉。沉船事件发生后，交通运输部门、解放军、武警部队和公安干警、沿江省市等调集动员了大批专业搜救人员、解放军、武警和消防官兵以及沿江地区群众，采取空中巡航、水面搜救、水下搜救、进舱搜救和全流域搜救相结合的方式，在事发地及下游水域开展全方位、立体式、拉网式搜寻。\n截至2015年6月13日，经有关各方反复核实、逐一确认，“东方之星”号客轮上共有454人，其中成功获救12人，遇难442人，全部遇难者遗体均已找到，自此搜救工作结束。\n\n经国务院调查组调查认定，“东方之星”号客轮翻沉事件是一起由突发罕见的强对流天气（飑线伴有下击暴流）带来的强风暴雨袭击导致的特别重大灾难性事件。"
 chinapro.107.a:0 "尽全力抢救！"
 newspro.101.t:0 "拉斯维加斯发生枪击事件"
 newspro.101.d:0 "2017年10月1日晚，美国拉斯维加斯发生了骇人的枪击事件。当时，超过2.2万人正在参加一个露天音乐节，突然，音乐节被枪声打断，嫌犯使用多只改装过的枪支从曼德勒海湾酒店32楼窗台向正在聆听音乐会的人群扫射，造成了60人死亡，超过五百人受伤，枪手在和警方短暂交火后吞枪自尽。\n美国总统特朗普对事件表示震惊，他周一发布讲话称这一血案是“邪恶的行径”。特朗普呼吁美国人在悲剧性和恐怖的时刻团结在一起。"
 newspro.101.a:0 "震惊"
 newspro.101.b:0 "纯粹的邪恶行为"
 newspro.102.t:0 "俄罗斯世界杯"
 newspro.102.d:0 "2018年俄罗斯世界杯是第21届国际足联世界杯赛事，于2018年6月14日至7月15日在俄罗斯11个城市中的12座球场内举行。这是世界杯首次在俄罗斯举行，亦是世界杯首次在东欧国家举行。 2018年7月16日，法国队在该届赛事决赛中以4-2击败克罗地亚队，时隔20年再次捧起大力神杯，而克罗地亚队也在此届世界杯上收获了队史最好成绩。克罗地亚中场卢卡·莫德里奇、英格兰中锋哈里·凯恩、比利时门将蒂博·库尔图瓦分别收获金球奖、金靴奖、金手套奖；法国前锋基利安·姆巴佩则获得最佳新秀奖。"
 newspro.102.a:0 "世界杯结束了"
 newspro.102.b:0 "我们让世界见到了我们最好的一面"
 newspro.103.t:0 "巴黎圣母院大火"
 newspro.103.d:0 "当地时间2019年4月15日下午6点50分左右，法国巴黎圣母院发生火灾，整座建筑损毁严重。着火位置位于圣母院顶部塔楼，大火迅速将圣母院塔楼的尖顶吞噬，尖顶如被拦腰折断一般倒下。\n在巴黎圣母院附近，数百人跪在地上祷告，有人在啜泣，有人眼含泪花。巴黎市民尼古拉说：“今天是所有巴黎人伤心的一天，我们祈祷巴黎圣母院大火尽早熄灭。”"
 newspro.103.a:0 "哦，天啊！"
 newspro.104.t:0 "美股熔断"
 newspro.104.d:0 "[?global.date.GetDateStringNoHour]，全球资本市场上演“黑色星期一”。欧美股市一片惨绿，美股市场开盘仅四分钟，标普500指数快速跌破7%，这是美股两周以来第三次熔断，史上第四次熔断。\n“股神”沃伦·巴菲特接受外媒采访谈及近期金融市场时表示，这几次熔断和1987年10月的“黑色星期一”同样吓人。"
 newspro.104.a:0 "哦，天啊！"
 newspro.105.t:0 "黑神话悟空"
 newspro.105.d:0 "中国首款3A游戏大作《黑神话：悟空》横空出世，在发售日当天，便在全球范围内引起了巨大的轰动。\n截止到[?global.date.GetDateStringNoHour]，根据市场研究机构VG Insights最新数据，《黑神话：悟空》在Steam平台销量已达2090万套，总收入超过10亿美元。\n这款游戏一度打破多项中国游戏的历史记录，如最高在线人数、最快销售速度等等，被誉为中国国产游戏的里程碑式作品。"
 newspro.105.a:0 "有趣..."
 newspro.105.b:0 "给世界一点中国震撼"
 newspro.106.t:0 "加州山火"
 newspro.106.d:0 "[?global.date.GetDateStringNoHour]，加利福尼亚南部地区经历一场强劲干燥风暴——“圣安娜风”。强风来袭引发多起山火。其中，加州洛杉矶附近的太平洋帕利塞德地区山火火势最为严重。\n这次山火至少造成28人死亡，造成的破坏和经济损失将达2500亿至2750亿美元。受灾灾民表示，山火肆虐的场面就如同世界末日一般。"
 newspro.106.a:0 "自然之力..."
 newspro.107.t:0 "斯里兰卡恐怖袭击"
 newspro.107.d:0 "[?global.date.GetDateStringNoHour]，在斯里兰卡国内共有6处地方发生炸弹袭击，包括首都科伦坡三家五星级酒店、两处教堂及东部城市巴蒂卡洛一处教堂连续发生爆炸。发生爆炸时，教堂内在进行复活节庆祝活动。此次恐怖袭击目前已经有253名遇难者。\n斯里兰卡总理谴责爆炸事件是“懦夫的”行径，并表示，“我呼吁所有斯里兰卡人在这一悲惨时刻保持团结和强大，政府在立即采取措施控制这种情况。” "
 newspro.107.a:0 "恐怖主义蔓延..."
 newspro.108.t:0 "DeepSeek AI"
 newspro.108.d:0 "[?global.date.GetDateStringNoHour]，一个名为DeepSeek-R1的开源AI模型被中国一家初创公司所推出，训练成本远低于同类型AI模型，且功能与ChatGPT相比甚至小有超越，最关键的是用户无需支付高昂订阅费用即可免费使用，这让其下载量位于多国免费APP榜单的榜首。\n一些人将其称之为AI方面的斯普特尼克时刻，而一些人则认为DeepSeek模型只不过是简单地抄袭了OpenAI代码，总之DeepSeek在近期被广泛谈论。"
 newspro.108.a:0 "硅谷的人在做什么？"
 newspro.108.b:0 "有趣..."
 newspro.108.c:0 "现在有人搬石砸脚了"
 newspro.109.t:0 "ChatGPT AI"
 newspro.109.d:0 "[?global.date.GetDateStringNoHour]，OpenAI正式发布了ChatGPT。它与InstructGPT是姐妹模型，它就是能够对话的GPT版本，是在GPT-3基础上的3.5版本。\n它不仅能够回答问题，还能创作文章、编程，甚至模仿人类的对话风格，其几乎无所不能的回答能力使得人们对大语言模型的通用能力有了全新的认识。ChatGPT迅速在社交媒体上走红，短短5天，注册用户数就超过100万。"
 newspro.109.a:0 "美国科技的进步"
 newspro.109.b:0 "有趣..."
 newspro.109.c:0 "我们也得研究自己的AI"
 newspro.110.t:0 "联合保险公司CEO被枪杀"
 newspro.110.d:0 "[?global.date.GetDateStringNoHour]，美国联合健康保险首席执行官布莱恩·汤普森在在曼哈顿中城希尔顿酒店外的一个繁忙区域被路易吉·尼古拉斯·曼吉奥内多次开枪，莱恩·汤普森胸部中弹后死亡，而枪手在警察到达之前逃离了该地区。\n随后路易吉·尼古拉斯·曼吉奥内被当地警方逮捕。曼吉奥内在声明中声称独自一人策划实施了谋杀行为，并列出了联合健康保险公司的规模和盈利情况，指责保险公司CEO为“寄生虫”，是罪有应得。"
 newspro.110.a:0 "令人震惊"
 newspro.110.b:0 "这就是美国低效而昂贵的医疗体系..."

 newspro.500.t:0 "第27届奥林匹克运动会"
 newspro.500.d:0 "2000年9月15日-10月1日，来自全球200个代表团的1.1万名运动员，参加了20世纪的最后一次夏季奥林匹克运动会——在澳大利亚悉尼举行的第27届夏季奥林匹克运动会28个大项、300个小项的角逐。\n比赛项目之多为历届奥运会之最。在奥林匹克精神的鼓舞下，他们向人类的生理极限发起挑战，展示出较高的竞技水平，共创造了34项世界纪录，77项奥运会纪录，3项奥运会最好成绩。"
 newspro.500.a:0 "分享奥林匹克精神（Share the spirit）"
 newspro.501.t:0 "第28届奥林匹克运动会"
 newspro.501.d:0 "第28届夏季奥林匹克运动会于2004年8月13日～29日在希腊首都雅典举行。本届奥运会是奥林匹克大家庭最大规模的一次团圆，共有来自202个国家和地区的11099名运动员，参加28个大项301个小项的比赛。\n他们以更快、更高、更强的奥林匹克精神挑战极限、攀越新高，在田径、游泳、自行车、举重和射箭等赛场，创造了20多项新的世界纪录。"
 newspro.501.a:0 "欢迎回家（Welcome Home）"
 newspro.502.t:0 "第30届奥林匹克运动会"
 newspro.502.d:0 "第30届夏季奥林匹克运动会在2012年7月27日到2012年8月12日在英国首都伦敦举办。2012年伦敦奥运会主会场是斯特拉特福德奥林匹克体育场（伦敦碗），温布利大球场、O2体育馆等为次体育场。\n2012年伦敦奥运会共有参赛国家及地区205个，参赛运动员10568名，设302项（26种）运动。2012年伦敦奥运会闭幕时共有85个国家及地区获得奖牌，中国代表团以38金27银23铜名列奖牌榜第二位。"
 newspro.502.a:0 "激励一代人（Inspire a Generation）"
 newspro.503.t:0 "第31届奥林匹克运动会"
 newspro.503.d:0 "第31届夏季奥林匹克运动会于2016年8月5日至2016年8月21日在巴西里约热内卢举行。此届奥运会共设28个大项，306个小项比赛。高尔夫重返奥运会，七人制橄榄球加入奥运会。经历了120年发展历程的现代奥运会首次造访南美洲。此届奥运会主会场是马拉卡纳体育场，共有来自国际奥委会207个会员协会的11238名运动员，其中包括由10名难民组成的难民代表团。\n此届奥运会奖牌榜第一位是美国队，获得46金牌37银牌38铜牌共计获得121枚奖牌；第二位是英国队，获得27金牌23银牌17铜牌总计荣获67枚奖牌；第三位是中国队，获得27金牌17银牌26铜牌总计荣获70枚奖牌。"
 newspro.503.a:0 "点燃你的激情（Live Your Passion）"
 newspro.504.t:0 "第32届奥林匹克运动会"
 newspro.504.d:0 "第32届奥林匹克运动会于2021年7月23日开幕、8月8日闭幕。2020年东京奥运会共有来自204个国家和地区以及俄罗斯奥运队和奥林匹克难民代表团2个参赛队伍的11669名运动员参赛；赛事项目共设有33个大项、339个小项、339场金牌赛，新增滑板、冲浪、竞技攀岩、棒垒球和空手道5个项目。\n东京奥运会无论是从男女项目设置还是参赛男女运动员人数上，都创造了最接近1:1的历史。\n本届奥运会美国代表团以39金41银33铜的成绩，依然排在金牌榜和奖牌榜的首位，中国代表团以38金32银18铜88枚奖牌，位居金牌数、奖牌数第二，东道主日本代表团以27金14银17铜位居金牌榜第三位。"
 newspro.504.a:0 "情同与共（United by Emotion）"
 newspro.505.t:0 "第33届奥林匹克运动会"
 newspro.505.d:0 "第33届奥林匹克运动会于2024年7月26日开幕，8月11日闭幕，部分项目的比赛于7月24日率先开赛。巴黎申办成功后，成为继伦敦后的世界第2个至少三次举办夏季奥林匹克运动会的城市，也是继1924年巴黎奥运会百年之后再次举办奥林匹克运动会。\n这是首届男女比例完全平衡的奥运会，男女各为5250名。本次运动会共设有32个大项，329个小项，共有206个国家和地区参赛，并且本届奥运会新增了滑板、冲浪、竞技攀岩和霹雳舞四个大项。\n美国代表团以40金44银42铜的成绩排名奖牌榜首位，而中国代表团最终在巴黎奥运会上夺得40金27银24铜，金牌数与美国代表团并列首位。"
 newspro.505.a:0 "奥运更开放（Games Wide Open）"
 newspro.510.t:0 "[?global.year]年奥林匹克运动会"
 newspro.510.d:0 "本次奥林匹克运动会在[olympic_game_target.GetName]举办，并于[?global.date.GetDateStringNoHour]顺利结束，充分彰显了奥林匹克主义精神。"
 newspro.510.a:0 "更快、更高、更强——更团结"
