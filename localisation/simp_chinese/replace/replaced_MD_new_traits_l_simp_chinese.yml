 one_china_category_desc: "中国内战以两个声称领导整个中华民族的替代政府结束，即总部设在北京的中华人民共和国政府和总部设在台北的中华民国政府。1992年，双方搁置了这一问题，达成「九二共识」，承认只有一个中国，但在谁是中国的合法统治者问题上存在分歧。\n\n在台湾，支持统一的§C泛蓝阵营§!和支持独立的§G泛绿阵营§!的相对支持率大致相当于「支持统一」和「反对统一」的支持率。\n\n§C泛蓝阵营支持率§!\n£TAI_conservatism  国民党： §Y[?TAI.party_pop_array^1|%1]§!\n£TAI_Conservative  新党：§Y[?TAI.party_pop_array^6|%1]§!\n£TAI_Neutral_conservatism  亲民党：§Y[?TAI.party_pop_array^14|%1]§!\n\n总支持率：§Y[?TAI.pan_blue_coalition_support|%1]§!\n\n§G泛绿阵营支持率§!\n£TAI_liberalism  民进党：§Y[?TAI.party_pop_array^2|%1]§!\n£TAI_neutral_Social  建国党： §Y[?TAI.party_pop_array^18|%1]§!\n\n总支持率：§Y[?TAI.pan_green_coalition_support|%1]§!\n\n\n此外，还有一些在当地难以发展壮大但支持统一的政党：\n\n在§7新兴主义§!中：\n$TAI.communist_state$：§Y[?TAI.party_pop_array^4|%1]§!\n$TAI.anarchist_communism$：§Y[?TAI.party_pop_array^5|%1]§!\n\n在§g不结盟主义§!中：\n$generic.Neutral_Communism$：§Y[?TAI.party_pop_array^19|%1]§!"
