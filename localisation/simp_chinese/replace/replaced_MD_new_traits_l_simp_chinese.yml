 RAJ_Caste_System_Deep_Rooted: "等级观念根深蒂固"
 RAJ_Caste_System_Deep_Rooted_desc: "虽然早就在名义上废除了种姓制度，但社会中普遍存在的等级观念仍然无法有效逆转。"
 PRC_USA_relations_other_country: "中美关系影响"
 PRC_USA_relations_other_country_desc: "中美关系在各种方面上影响全世界，而强大的国家受其影响则会更小。"
 PRC_USA_relations_hegemony_country: "世界霸权影响"
 PRC_USA_relations_hegemony_country_desc: "[ROOT.GETNAME]是当前世界最具有影响力的国家，其影响力几乎无处不在。"
 CHI_population_aging_ratio_modifiers: "老年化人口比例影响"
 CHI_pop_agriculture_ratio_modifier: "中国劳力人口修正"
 CHI_pop_agriculture_ratio_modifier_desc: "§R此修正将会在人均GDP>6k时自动消除§!\n\n由于千禧原版逆天的非商业农业人口比例以及开采业人口比例随人均GDP增长而减少的数值，故在此进行修正\n§Y不然很容易陷入经济死循环§!" 
 CHI_research_without_ethical_restrictions: "允许进行无道德限制的研究"
 MON_Ecological_Issues: "蒙古环境问题"
 MON_Ecological_Issues_desc: "自从冷战结束后，蒙古的经济长期依靠粗放的畜牧业以及缺乏监管的开采业，让当地的生态环境逐步恶化。愈发严重的空气污染和无法阻止的荒漠化将榨干这片土地的最后一丝生机。\n\n§R如果当地经济模式不改变，那么环境问题将每月都会恶化！§!"
 RUS_winter_is_coming: "凌冬将至"
 CHI_offend_our_people: "逆鳞"
 CHI_offend_our_people_desc: "夫龙之为虫也，可犹狎而骑也。然其喉下有逆鳞径尺，人有婴之，则必杀人。人主亦有逆鳞，说之者能无婴人主之逆鳞，则几矣。"
 CHI_zhurongji: "朱镕基总理"
 CHI_zhurongji_desc: "朱镕基，男，汉族，1928年10月生，湖南长沙人，1949年10月加入中国共产党，1948年12月参加工作，清华大学电机系电机制造专业毕业，大学文化，高级工程师。其在经济领域工作逾半个世纪，经验丰富，加上其思维敏锐、雷厉风行、敢言敢为和要求严格的特质与个性，使其主导的经济工作多被高效推进并卓有成效。在位期间政府运转高效，也因个别政策的施行如国有企业裁员和对农民的负担加重等，对社会形成一定负面影响。"
 CHI_wenjiabao: "温家宝总理"
 CHI_wenjiabao_desc: "温家宝，男，汉族，1942年9月生，天津市人，1965年4月加入中国共产党，1967年9月参加工作，北京地质学院地质构造专业毕业，研究生学历，工程师。曾在甘肃省地质局从事地质力学勘探等工作，后上调国家地质矿产部，从事政策法规研究工作并在之后升任该部副部长。温家宝在总理任内曾亲自参与组织或处置过SARS事件、汶川地震、北京奥运会、2007-2008年环球金融危机、青海玉树地震、上海世博会、甘肃舟曲特大泥石流、广州亚运会等重大活动及事件，其最大的政治措施即一揽子经济刺激计划备受争议，因此也被称为是中国历史上最具争议的总理。"
 CHI_likeqiang: "李克强总理"
 CHI_likeqiang_desc: "李克强，男，汉族，1955年7月3日生，安徽定远人，1974年3月参加工作，1976年5月加入中国共产党，北京大学法律系和经济学院经济学专业毕业，在职研究生学历，法学学士、经济学博士学位。1998年6月起，李克强同志历任河南省委副书记、代省长、省长，省委书记、省长，省委书记、省人大常委会主任。2004年12月起历任辽宁省委书记，省委书记、省人大常委会主任。2007年10月，李克强同志在中共十七届一中全会上当选为中央政治局委员、常委。担任国务院总理后，李克强同志在科技、教育、生态环保和东北全面振兴、西部大开发等领域倾注了大量心血。这位精通经济学的改革家总理提出了经济学上著名的“克强指数”，重视制造业和互联网产业发展，提出“互联网+”的发展模式。但这位充满干劲的总理却始终被一层影子笼罩着，无法施展他的宏图大愿……"
 CHI_crisis: "经济危机"
 CHI_crisis_desc: "§R当海啸到来时，人的一切作为都是螳臂当车§!"
 CHI_Tax_Sharing_Reform_Land_finance: "1994分税制改革与土地财政"
 CHI_Tax_Sharing_Reform_Land_finance_desc: "1994中国开始实施分税制财政管理体制，对于理顺中央与地方的分配关系，调动中央、地方两个积极性，加强税收征管，保证财政收入和增强宏观调控能力，都发挥了积极作用，但也催生了土地财政的发展模式，为创造房地产泡沫埋下隐患"
 CHI_Tax_Sharing_Reform_Land_finance_01: "改革税制"
 CHI_Tax_Sharing_Reform_Land_finance_01_desc: ""
 CHI_intertwined_Interest_relations: "盘根错节的利益关系"
 CHI_intertwined_Interest_relations_desc: "礼义之不愆，何恤人之言？水至清则无鱼，人至察则无徒；冕而前旒，所以蔽明；黈纩充耳，所以塞聪。明有所不见，聪有所不闻，举大德，赦小过，无求备于一人之义也。枉而直之，使自得之；优而柔之，使自求之；揆而度之，使自索之。盖圣人之教化如此，欲其自得之；自得之，则敏且广矣"
 CHI_agricultural_tax:0 "农业税"
 CHI_agricultural_tax_desc: "从新中国成立以来，特别是从1953到1986年间，国家对于农产品实行的统购统销政策实际上通过工农产品间的价格“剪刀差”为工业生产汲取了大量的农业剩余价值，用以补贴工业发展"
 CHI_uncontrolled_internet: "自由互联网"
 CHI_uncontrolled_internet_desc: "1987年9月14日，在德国教授维纳·措恩等人帮助下，由北京计算机应用技术研究所王运丰等人发出了一封内容为“越过长城，走向世界”的电子邮件。1994年4月20日，一条64K的国际专线从中国科学院接入互联网，实现了中国与互联网的全功能连接，自此中国成为国际互联网大家庭的第77名成员。"
 CHI_Popular_culture_from_Jap_KRO_HKG_TWN: "日韩港台流行文化"
 CHI_Popular_culture_from_Jap_KRO_HKG_TWN_desc: "经过上世纪八九十年代的文化黄金时期，日本和港台的流行文化已经在中国大陆地区广泛流行，进入新世纪后韩流更是成为流行文化的新秀。中国人民的日常生活中随处可见这些国家和地区的文化产品，千禧一代的年轻人们则在这样的环境中成长起来"
 CHI_backwash_of_big_layoff: "大下岗"
 CHI_backwash_of_big_layoff_desc: "“工人要替国家想，我不下岗谁下岗！”上世纪90年代，国务院总理朱镕基深化国企改革、推进减负裁员。自有关改革的决策在97年5月出台后，短短数月里已有上百万国企工人下岗，推行力度之大超乎预料：1998年至2000年间，几乎每年都有700万至900万工人下岗，截至2003年，国企下岗职工累计达2818万人。\n\n广泛的劳工失业对中国社会造成了巨大的冲击，国内资产增值投资带来的就业岗远远不能满足失业工人的就职需求，失业人员游离于社会运行之外，由此产生的动乱创伤需要很长一段时期来抚平。然而，也许有可能以某种快速扩大投资生产的方式来加速就业岗位的创建……"
 CHI_backwash_of_big_layoff_2: "大下岗的余波"
 CHI_backwash_of_big_layoff_2_desc: "“工人要替国家想，我不下岗谁下岗！”上世纪90年代，国务院总理朱镕基深化国企改革、推进减负裁员。自有关改革的决策在97年5月出台后，短短数月里已有上百万国企工人下岗，推行力度之大超乎预料：1998年至2000年间，几乎每年都有700万至900万工人下岗，截至2003年，国企下岗职工累计达2818万人。\n\n由于一系列引入外资和扩大出口的举措，国内出现了一定的经济景气，一座座拔地而起的工厂源源不断吸纳着沉默的就业者，大下岗带来的过剩劳动力正在迅速转变为劳动力红利"
 CHI_superstition_and_Separatism: "迷信与分裂主义"
 CHI_superstition_and_Separatism_desc: "虽然中国是一个无神论国家，大多数人并不相信神鬼的存在，然而中国人民对于宗教信仰的认知十分蒙昧，加上中国共产党对宗教信仰保持中立态度，以至于中国社会上各种宗教甚至邪教组织横行，更有不少分裂主义者和恐怖主义者借着宗教的名义企图分裂和瓦解中国，形成了严重的社会危害"
 CHI_moderately_prosperous_society_1: "全面建设小康社会中"
 CHI_moderately_prosperous_society_1_desc: "我们要在本世纪头20年，集中力量，全面建设惠及十几亿人口的更高水平的小康社会，使经济更加发展、民主更加健全、科教更加进步、文化更加繁荣、社会更加和谐、人民生活更加殷实。"
 CHI_moderately_prosperous_society_complete: "全面小康"
 CHI_moderately_prosperous_society_complete_desc: "“民亦劳止，汔可小康。惠此中国，以绥四方。无纵诡随，以谨无良。式遏寇虐，憯不畏明。柔远能迩，以定我王。”\n\n——《诗经·大雅·民劳》"
 CHI_National_rejuvenation: "中华民族伟大复兴"
 CHI_National_rejuvenation_desc: "我们的道路多么宽广，我们的前程无比辉煌，我们献身这壮丽的事业，无限幸福无上荣光"
 CHI_National_rejuvenation_2: "中华民族伟大复兴：民族认同"
 CHI_National_rejuvenation_desc: "数千年来，在中华大地上繁衍生息的各民族不断交融汇聚，特别是中国自秦汉形成统一多民族国家以来，大一统的理念深入人心，各民族在分布上交错杂居、经济上相互依存、文化上兼收并蓄、情感上相互亲近，最终形成了多元一体的中华民族。"
 CHI_superstition_and_Separatism2: "分裂主义残党"
 CHI_superstition_and_Separatism_desc2: "在中国共产党的持续打击下，邪教组织和极端宗教组织已经被列入非法组织名单并遭受灭顶之灾，人民对于这些组织有很强的警惕心。然而还是有不少顽固分子潜藏在社会的角落伺机而动，毕竟——你永远无法杀死所有的虫子"
 CHI_Public_panic: "公众恐慌"
 CHI_Public_panic_desc: "由于政府公开了不明病毒的消息，公众陷入了恐慌之中"
 CHI_Public_panic2: "心有余悸"
 CHI_Public_panic_desc: "由于政府向人民群众持续进行科普宣传和安抚措施，公众暂停了最初的广泛恐慌，但依然心有余悸，担心自己也会感染不明病毒"
 CHI_Public_panic3: "万众一心"
 CHI_Public_panic_desc: "在政府的全力控制下，病毒不再大规模传播，出现病毒的地区也很快得到控制，人们相信在党和政府的领导下，一定能度过这次难关"
 eleventh_five_year_plan: "第十一个五年规划"
 eleventh_five_year_plan_desc: "前进！"
 tenth_five_year_plan: "第十个五年计划"
 tenth_five_year_plan_desc: "前进！"
 CHI_Rural_Development_Plan: "农村发展计划"
 CHI_population_modifiers: "中国人口结构"
 CHI_population_modifiers_desc: "人口是经济的基石，没有人就没有生产，更没有消费，也没有未来。中国是世界上人口最多的国家，长期的计划生育政策极大地改善了中国的人口负担，但也许会导致更大更大的危机最终像滚石一般落下……\n---------------\n§W人口老龄化比例：[?ROOT.CHI_aging_ratio_now|Y2%%]，此项数值影响了§Y$MODIFIER_GLOBAL_MONTHLY_POPULATION$、$total_workforce_modifier$、$health_cost_multiplier_modifier$§!方面的修正\n\n当前城市化率：[?ROOT.CHI_urbanization_now|Y2%%]，此项数值影响了§Y$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$、$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$、$MODIFIER_RESEARCH_SPEED_FACTOR$、$education_cost_multiplier_modifier$、$MODIFIER_CONSUMER_GOODS_FACTOR$§!方面的修正§!"
 CHI_Feminism: "中国女性权益"
 CHI_Feminism_desc: "女性权益是人权的重要领域，也是影响社会发展的重要因素"
 CHI_gangland: "黑恶势力猖獗"
 CHI_gangland_desc: "黑恶势力在中国社会上广泛存在，甚至与部分警察和官僚勾结，鱼肉百姓。黑社会作为社会的巨大毒瘤，不仅给中国人民的生命财产安全带来了极大的危害，而且也影响到了整个社会的繁荣稳定，人们无不对它咬牙切齿、恨之入骨，对无力管控甚至与其勾结的政府同样毫不信任"
 CHI_Crime_crackdown: "打黑除恶"
 CHI_Crime_crackdown_desc: "用刀剜去阴沟老鼠"
 CHI_China_supports: "中国支持"
 CHI_China_supports_desc: "我们收到了来自中国的经济支持"
 CHI_Internet: "中国互联网"
 CHI_Internet_desc: "中国互联网是全球第一大网。网民人数最多，联网区域最广。互联网越来越深刻地改变着人们的学习、工作以及生活方式，甚至影响着整个社会进程。"
 CHI_Political_support: "政治支持"
 CHI_Political_support_desc: "由于我们在各方面的努力取悦了有权有势之人，他们将回报以对我们政治上的支持"
 CHI_labour_law: "形同虚设的劳动法"
 CHI_labour_law_desc: "中国早在上世纪20年代就已设立了劳动法。中华人民共和国成立后，在马克思列宁主义的理论指导下，结合中国实际出台了一系列保护劳工权益的法律。90年代初期，经过第三次起草《劳动法》，于1994年7月5日经人大常委会审议通过《中华人民共和国劳动法》。劳动法的颁布标志中国劳动法制进入一个新的历史阶段。然而。劳动法在执行上却漏洞频出，官方也对企业家违反劳动法的行为不置可否，以至于劳动法在国家发展面前几乎成为一纸空文，广大劳动人民常常无法通过合法程序维护自身合法劳动权益"
 CHI_controlled_internet: "受控的互联网"
 CHI_controlled_internet_desc: "互联网的种种乱象已受到控制，网络环境正变得更加绿色"
 CHI_Freedom_of_speech: "言论自由：解放思想"
 CHI_Freedom_of_speech_desc: "邓小平同志提出：“解放思想，开动脑筋，实事求是，团结一致向前看，首先是解放思想。只有思想解放了，我们才能正确地以马列主义、毛泽东思想为指导，解决过去遗留的问题，解决新出现的一系列问题，正确地改革同生产力迅速发展不相适应的生产关系和上层建筑，根据我国的实际情况，确定实现四个现代化的具体道路、方针、方法和措施。”改革开放以来，社会对于新鲜事物的接受程度越来越高，人们已经习惯于接受任何日新月异的变化和剑走偏锋的言论"
 CHI_people_oriented: "以人为本的发展观"
 CHI_people_oriented_desc: "胡锦涛总书记强调，要“坚持以人为本，树立全面、协调、可持续的发展观，促进经济社会和人的全面发展”"
 CHI_scientific_outlook_on_development: "中国共产党"
 CHI_scientific_outlook_on_development_desc: "科学发展观，第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。科学发展观是对党的三代中央领导集体关于发展的重要思想的继承和发展，是马克思主义关于发展的世界观和方法论的集中体现，是同马克思列宁主义、毛泽东思想、邓小平理论和“三个代表”重要思想既一脉相承又与时俱进的科学理论，是我国经济社会发展的重要指导方针，是发展中国特色社会主义必须坚持和贯彻的重大战略思想，是胡锦涛总书记留给中国人民的一份温暖的关怀"
 CHI_fiscal: "中国社会经济政策"
 CHI_fiscal_desc: "中国社会是一个人口规模巨大的社会，任何微小的变量最后都会汇总成为巨大的社会效应。无论是社会政策政策还是经济政策，都需要审慎小心地制定和执行。"
 CHI_Socialist_Market_Economy: "社会主义市场经济"
 CHI_Socialist_Market_Economy_desc: "社会主义市场经济就是同社会主义基本社会制度结合在一起的市场经济，体现社会主义的根本性质。是使市场在社会主义国家宏观调控下对资源配置起决定性作用的经济体制。它使经济活动遵循价值规律的要求，适应供求关系的变化；通过价格杠杆和竞争机制，把资源配置到效益最好的环节中去，并使企业实行优胜劣汰；运用市场对各种经济信号反应灵敏的特点，促进生产和需求的及时协调。社会主义市场经济理论，是邓小平理论体系中极具创新意义的组成部分，是对传统经济理论的修正。依据这一理论，中国官方确定了建立市场经济体制的改革目标，进行了中国国家建设史上前无古人的探索。"
 State_Grid_Corporation_idea: "中国国家电网"
 State_Grid_Corporation_idea_desc: "构建能源互联网、保障国家能源安全、服务人民美好生活"
 HKG_international_financial_center: "香港国际金融中心"
 HKG_international_financial_center_desc: "香港是与纽约、伦敦并称为“纽伦港”，是全球第三大金融中心、重要的国际贸易、航运中心和国际创新科技中心。"
 CHI_PLA_stationed_in_Hongkong: "中国人民解放军驻香港部队"
 CHI_PLA_stationed_in_Hongkong_desc: "根据《中华人民共和国香港特别行政区驻军法》，驻港部队履行四项防务职责：一、防备和抵抗侵略，保卫香港特别行政区的安全；二、担负防卫勤务；三、管理军事设施；四、承办有关的涉外军事事宜"
 4trillion_investment_effect: "四万亿投资影响"
 4trillion_investment_effect_desc: "我国向多个领域注入了高达四万亿人民币的海量资金，这将带来许多经济影响"
 HKZM_Bridge: "港珠澳大桥"
 HKZM_Bridge_desc: "港珠澳大桥连接了香港、珠海、澳门三城，提供了相当便利的交通条件"
 GBA_effect: "港珠澳大湾区"
 GBA_effect_desc: "港珠澳大湾区建设使香港和澳门获得了巨大的发展机遇"
 CHI_gangland_2: "黑恶势力隐藏"
 CHI_gangland_2_desc: "黑恶势力潜藏在阴影之中，静待时机"
 CHI_NSWT_centralline: "南水北调中线工程建设"
 CHI_NSWT_centralline_desc: "南水北调是一项影响深远的工程"
 CHI_monetary_policy: "中国货币政策"
 CHI_monetary_policy_desc: "趁手工具"
 thirteenth_five_year_plan: "第十三个五年规划"
 twelfth_five_year_plan: "第十二个五年规划"
 made_in_china: "中国制造"
 made_in_china_desc: "曾经，在外国人的眼中，长久以来中国市场给人带来的印象就像是一座为全球公司生产和加工产品的“大工厂”，各种贴着“中国制造”标签的产品从这里走向海外市场，却几乎没有什么东西带有自主创意和领先优势。但是现在，这种情况已经开始发生改变。我们可以自豪地说，“中国制造”是物美价廉的代名词。"
 made_in_china_pro: "中国智造" 
 made_in_china_pro_desc: "通过研发先进生产技术以及建立完备的工业体系和采用高效的无人生产方式，我们将成就世界上的工业奇迹，“中国智造”将会是推动下一次生产力的革命的源动力。"
 Asian_Infrastructure_Investment_Bank_chairman: "亚洲基础设施投资银行理事会主席国"
 Asian_Infrastructure_Investment_Bank_chairman_desc: "画野分疆，山川限其内外；遐荒绝域，刑政殊於函夏。是以昔王御世，怀柔远人，义在羁縻，无取臣属。渠搜即叙，表夏后之成功；越裳重译，美周邦之长算。因而镇抚，允合机宜，分命行人，就申好睦，静乱息民，於是乎在。布告天下，明知朕意。八方来贡，万国来朝。"
 Asian_Infrastructure_Investment_Bank_member: "亚洲基础设施投资银行成员国"
 Asian_Infrastructure_Investment_Bank_member_desc: "在中国的大量投资计划下，本国经济快速发展"
 CHI_coal_idea: "煤炭驱动型经济"
 CHI_coal_idea_desc: "煤炭在火电厂中熊熊燃烧，化为能源和黑烟"
 CHI_renewable_energy_idea: "中国可再生能源"
 CHI_renewable_energy_idea_desc: "中国是世界上最大的可再生能源设施生产国"
 CHI_renewable_energy_idea_2: "绿色中国"
 CHI_renewable_energy_idea_2_desc: "中国已经成为世界上最大的可再生能源生产国和使用国"
 CHI_Alipay_idea: "数字支付"
 CHI_Alipay_idea_desc: "中国是世界上最大的移动数字支付使用国"
 CHI_rump_of_Separatism: "分裂主义残党"
 CHI_rump_of_Separatism_desc: "分裂主义的残党正在某些角落策划着东山再起"
 CHI_universal_Nepotism: "裙带关系普遍"
 CHI_universal_Nepotism_desc: "从古龙阳邀上赏，莫将裙带为官羞"
 APEC: "亚太经济合作组织"
 APEC_desc: "该组织为推动区域贸易投资自由化，加强成员间经济技术合作等方面发挥了不可替代的作用。它是亚太区内各地区之间促进经济成长、合作、贸易、投资的论坛。"
 CHI_SRAS_idea: "SARS病毒"
 CHI_SRAS_idea_desc: "新型病毒正在快速传播"
 CHI_labour_law_2: "呼声寥寥的劳动法"
 CHI_labour_law_2_desc: "由于政府的宣传，劳动法开始被人们注意到，并对劳资关系形成了一定的限制。然而没有建立切实可行的制度保障劳动法施行。"
 CHI_labour_law_3: "法团主义色彩的劳动法"
 CHI_labour_law_3_desc: "劳动法用以保障劳资双方的权益，同时严禁双方过火的行为。这种充满法团主义色彩的劳动法确保了社会发展的稳定性，在一定意义上保障了劳动者的权益，但根本意义上否决了阶级斗争的可能性和合法性。"
 CHI_increase_social_cost_temporary: "临时提高社会保障支出"
 CHI_strong_our_government: "优化政府部门"
 CHI_modify_uighur_threat: "分裂分子威胁"
 CHI_modify_uighur_opinion: "维吾尔族民意"
 CHI_Protecting_workers_idea: "保护劳动者"
 CHI_Protecting_workers_idea_desc: "正在保护劳工权益"
 CHI_Comfort_entrepreneurs_idea: "取悦企业家"
 CHI_Comfort_entrepreneurs_idea_desc: "正在取悦企业家"
 CHI_Trade_Unions_idea: "组建全国性的工会中"
 CHI_Trade_Unions_idea_desc: "组件全国性的工会可以有效保护劳工权益，并且可以以有效监督劳动者，防止其采取过激行为"
 CHI_Commission_of_Commerce_idea: "组建商务委员会中"
 CHI_Commission_of_Commerce_idea_desc: "组建各地的商务委员会可以最大程度激活市场主体活力，协调政商对接，以及掌控企业家的商业行为"
 CHI_Supporting_foreign_countries_AIIB: "支援亚投行成员发展"
 CHI_Supporting_foreign_countries_AIIB_desc: "我们正在动用资源帮助落后国家"
 CHI_Provide_loans_AIIB: "向亚投行成员发放低息贷款"
 CHI_Provide_loans_AIIB_desc: "我们正在向落后国家发放发展贷款"
 CHI_China_supports_AIIB: "亚投行发展援助"
 CHI_China_supports_AIIB_desc: "中国正在通过亚投行援助这个国家的发展建设"
 CHI_Low_interest_loans_AIIB: "亚投行低息贷款"
 CHI_Low_interest_loans_AIIB_desc: "中国正在通过亚投行对这个国家提供低息贷款用以发展"
 sanction_from_p5: "联合国安理会的制裁"
 sanction_from_p5_desc: "联合国安理会认为我们当前行为非法，故我们受到了制裁。"
 Success_Keeping_the_Peace: "成功维护和平"
 Success_Keeping_the_Peace_desc: "此国近期成功维护了地区稳定与世界和平。"
 chastity_paifang_2: "中华"
 chastity_paifang_2_desc: "树欲静而风不止。扫帚不到，灰尘照例不会自己跑掉。批判的武器不能代替武器的批判。中国军队再也不会战战兢兢的守在边墙后面\n\n中国将不惜一切代价维护世界和平，包括§R使用暴力§!"
 chinese_rule_all_the_land: "大一统"
 chinese_rule_all_the_land_desc: "§Y六合同风，九州共贯§!"
 CHI_wind_farms: "风力发电厂"
 CHI_offshore_wind_farms: "海上风电场"
 CHI_solar_farms: "太阳能发电厂"
 CHI_solar_panels: "太阳能电池板"
 CHI_frontier: "沙漠化和水土流失"
 CHI_frontier_desc: "中国黄土高原地区，受季风影响较大，降水集中。沙粒堆积而成的黄土遇上雨水极易冲刷，加上河流直接冲刷的泥沙，极易造成水土流失。\n受沙漠化影响的另一大区域是戈壁滩。目前，戈壁滩是世界上移动最快的沙漠，每年吞没土地超过3350平方公里，沿途摧毁许多村落。目前，图片显示戈壁滩发展之大甚至能容下整个克罗地亚。"
 CHI_Prosperous_Frontier: "繁荣的边疆"
 CHI_Special_Economic_Zones: "经济特区"
 CHI_Special_Economic_Zones_desc: "创办经济特区，是中共中央、国务院根据邓小平的倡导，在新的历史条件下，顺应世界政治经济形势发展的新趋势，在总结国内外经验教训的基础上，为推进我国改革开放和加速社会主义现代化建设而作出的重大决策和重大步骤。\n\n1980年5月，中共中央和国务院决定将深圳、珠海、汕头和厦门这四个出口特区改称为经济特区。1988年4月，增设海南经济特区。"
 CHI_capital: "首都"
 CHI_capital_desc: "庭前芍药妖无格，池上芙蕖净少情\n唯有牡丹真国色，花开时节动京城"
 CHI_Pudong_New_Area: "浦东新区"
 CHI_Pudong_New_Area_desc: "浦东开发开放带动上海走上了整体转型之路，也为整个长三角、长江流域，乃至全国的改革开放注入了新的动力。"
 CHI_ancient_capital_of_thirteen_dynasties: "十三朝古都"
 CHI_ancient_capital_of_thirteen_dynasties_desc: "今夜鄜州月，闺中只独看\n遥怜小儿女，未解忆长安"
 CHI_hometown_of_Confucius: "孔孟之乡"
 CHI_hometown_of_Confucius_desc: "学而时习之，不亦说乎\n有朋自远方来，不亦乐乎\n人不知而不愠，不亦君子乎"
 CHI_Central_World: "天下之中"
 CHI_Central_World_desc: "明月隐高树，长河没晓天\n悠悠洛阳道，此会在何年。"
 CHI_misty_rain_gusu: "烟雨姑苏"
 CHI_misty_rain_gusu_desc: "千里莺啼绿映红，水村山郭酒旗风\n南朝四百八十寺，多少楼台烟雨中"
 CHI_old_Shanghai: "十里洋场"
 CHI_old_Shanghai_desc: "全吴临巨溟，百里到沪渎\n海物竞骈罗，水怪争渗漉。"
 CHI_qiantang_fragrans_lotus: "钱塘桂荷"
 CHI_qiantang_fragrans_lotus_desc: "东南形胜，三吴都会，钱塘自古繁华\n烟柳画桥，风帘翠幕，参差十万人家"
 CHI_Medicine_Capital: "徽风皖韵"
 CHI_Medicine_Capital_desc: "天门中断楚江开，碧水东流至此回\n两岸青山相对出，孤帆一片日边来"
 CHI_Mountain_Sea_Gallery: "山海画廊"
 CHI_Mountain_Sea_Gallery_desc: "百叠青山江一缕，十里人家，路绕南台去\n榕叶满川飞白鹭，疏帘半卷黄昏雨"
 CHI_south_of_the_Five_Ridges_Pearl: "岭南明珠"
 CHI_south_of_the_Five_Ridges_Pearl_desc: "暗滩水落涨虚沙，滩去秦吴万里赊\n马上折残江北柳，舟中开尽岭南花\n离歌不断如留客，归梦初惊似到家\n山鸟一声人未起，半床春月在天涯"
 CHI_Guilin_Scenery: "桂林山水"
 CHI_Guilin_Scenery_desc: "桂林山水甲天下，玉碧罗青意可参"
 CHI_magical_land_of_South_Sea: "南溟奇甸"
 CHI_magical_land_of_South_Sea_desc: "爰有奇甸，在南溟中\n邈與图之垂尽，绵地脉以潜通\n山别起而为昆仑，水毕归以为溟渤\n气以直达而专，势以不分而足"
 CHI_South_Colourful_Clouds: "彩云之南"
 CHI_South_Colourful_Clouds_desc: "云南更有溪，丹砾尽无泥\n药有巴賨卖，枝多越鸟啼"
 CHI_land_of_abundance: "天府之国"
 CHI_land_of_abundance_desc: "益州险塞，沃野千里\n天府之土，高祖因之，以成帝业"
 CHI_majestic_mountain_city: "伟岸山城"
 CHI_majestic_mountain_city_desc: "峨眉山月半轮秋，影入平羌江水流\n夜发清溪向三峡，思君不见下渝州"
 CHI_Natural_bonsai: "四渡赤水之地"
 CHI_Natural_bonsai_desc: "西风烈，长空雁叫霜晨月\n霜晨月，马蹄声碎，喇叭声咽\n雄关漫道真如铁，而今迈步从头越\n从头越，苍山如海，残阳如血"
 CHI_lotus_xiaoxiang: "芙蓉潇湘"
 CHI_lotus_xiaoxiang_desc: "独立寒秋，湘江北去，橘子洲头\n看万山红遍，层林尽染；漫江碧透，百舸争流\n鹰击长空，鱼翔浅底，万类霜天竞自由\n怅寥廓，问苍茫大地，谁主沉浮?\n\n携来百侣曾游\n忆往昔、峥嵘岁月稠\n恰同学少年，风华正茂；书生意气，挥斥方遒\n指点江山，激扬文字，粪土当年万户侯\n曾记否，到中流击水，浪遏飞舟？"
 CHI_Thoroughfare_to_Nine_Provinces: "九省通衢"
 CHI_Thoroughfare_to_Nine_Provinces_desc: "昔人已乘黄鹤去，此地空余黄鹤楼\n黄鹤一去不复返，白云千载空悠悠\n晴川历历汉阳树，芳草萋萋鹦鹉洲\n日暮乡关何处是？烟波江上使人愁"
 CHI_ancient_Yuzhang_county: "豫章故郡"
 CHI_ancient_Yuzhang_county_desc: "豫章故郡，洪都新府\n星分翼轸，地接衡庐\n襟三江而带五湖，控蛮荆而引瓯越\n物华天宝，龙光射牛斗之墟\n人杰地灵，徐孺下陈蕃之榻\n雄州雾列，俊采星驰"
 CHI_situated_at_foot_of_hill_and_beside_river: "表里山河"
 CHI_situated_at_foot_of_hill_and_beside_river_desc: "重楼杰观屹相望，表里山河自一方\n小市张灯归意动，轻衫当户晚风长"
 CHI_Land_of_Lament_Songs: "燕赵感慨悲歌之地"
 CHI_Land_of_Lament_Songs_desc: "风萧萧兮易水寒\n壮士一去兮不复还"
 CHI_Nine_rivers_return_to_sea: "九河下梢"
 CHI_Nine_rivers_return_to_sea_desc: "黄河分地络，飞观接天津\n一览遗芳翰，千载肃如神"
 CHI_Republic_eldest_son: "共和国长子"
 CHI_Republic_eldest_son_desc: "咱们的脸上发红光\n咱们的汗水往下淌\n为什么？\n为了求解放！\n为什么？\n为了求解放！\n哎！嘿！\n哎！嘿！\n为了全中国彻底解放！"
 CHI_Northern_Spring_City: "北国春城"
 CHI_Northern_Spring_City_desc: "吉林真吉林，长白郁嵚岑\n作镇曾闻古，钟样亦匪今\n邠岐经处远，云雾望中深\n天作心常忆，明禋志倍钦"
 CHI_Tracks_In_Snowy_Forest: "林海雪原"
 CHI_Tracks_In_Snowy_Forest_desc: "飞昚朝暾霁，停骖午漏分\n客心随水急，人语隔江闻\n雨过添清气，风生爱縠纹\n中流归棹稳，跂望有来群"
 CHI_Hanhai_bright_pearl: "瀚海骏驹"
 CHI_Hanhai_bright_pearl_desc: "敕勒川，阴山下\n天似穹庐，笼盖四野\n天苍苍，野茫茫，风吹草低见牛羊"
 CHI_Jiangnan_beyond_Great_Wall: "塞上江南"
 CHI_Jiangnan_beyond_Great_Wall_desc: "天高云淡，望断南飞雁\n不到长城非好汉，屈指行程二万\n六盘山上高峰，红旗漫卷西风\n今日长缨在手，何时缚住苍龙？"
 CHI_gansu_impregnable_pass: "陇上雄关"
 CHI_gansu_impregnable_pass_desc: "黄河远上白云间，一片孤城万仞山\n羌笛何须怨杨柳，春风不度玉门关"
 CHI_Silk_Road_Pass: "丝路西域"
 CHI_Silk_Road_Pass_desc: "白日登山望烽火，黄昏饮马傍交河\n行人刁斗风沙暗，公主琵琶幽怨多\n野云万里无城郭，雨雪纷纷连大漠\n胡雁哀鸣夜夜飞，胡儿眼泪双双落\n闻道玉门犹被遮，应将性命逐轻车\n年年战骨埋荒外，空见蒲桃入汉家"
 CHI_waterhead: "万水源流"
 CHI_waterhead_desc: "西极秋高白鸟翻，凭阑送目到河源\n久无槎影通银汉，遥见天光下火墩\n青海风涛还积石，玉门车马半中原\n昆仑故是征西路，寄语山前吐谷浑"
 CHI_roof_of_the_world: "世界屋脊"
 CHI_roof_of_the_world_desc: "纯精结奇状，皎皎天一涯\n玉嶂拥清气，莲峰开白花\n半岩晦云雪，高顶澄烟霞\n朝昏对宾馆，隐映如仙家"
 CHI_Sea_Pearl: "海上明珠"
 CHI_Sea_Pearl_desc: "小时侯\n乡愁是一枚小小的邮票\n我在这头\n母亲在那头\n\n长大后乡愁是一张窄窄的船票\n我在这头\n新娘在那头\n\n后来啊\n乡愁是一方矮矮的坟墓\n我在外头\n母亲在里头\n\n而现在\n乡愁是一湾浅浅的海峡\n我在这头\n大陆在那头"
 CHI_Pearl_of_the_East: "东方之珠"
 CHI_Pearl_of_the_East_desc: "致瞬息万变之物\n及亘古不变之物\n狮子山精神远扬"
 CHI_land_oyster_bank: "濠镜之地"
 CHI_land_oyster_bank_desc: "你可知“妈港”不是我的真名姓？\n我离开你的襁褓太久了，母亲！\n但是他们掳去的是我的肉体\n你依然保管我内心的灵魂\n\n那三百年来梦寐不忘的生母啊！\n请叫儿的乳名\n叫我一声“澳门”！\n母亲，我要回来！\n母亲！"
 CHI_Shortage_of_water_resources: "水资源短缺"
 CHI_Shortage_of_water_resources_desc: "尽管中国南方拥有丰富的水资源，但在明显干旱的北方则普遍缺水。中国快速工业化造成的污染也导致了确实存在的水污染，加剧了中国的水资源短缺。"
 modifier_state_production_speed_agriculture_district_factor: "商业化农业区建造速度"
 CHI_ETHOS: "中国社会思潮"
 CHI_ETHOS_desc: "不同人群将按照支持度带来不同的社会影响。\n\n§Y这个国家精神展现了$CHI_left_Name$，$CHI_political_apathy_Name$和$CHI_right_Name$的最终效果。§!"
 CHI_PLA_in_the_New_Era: "中国人民解放军"
 CHI_Bobcat_all_terrain_vehicle: "山猫全地形车"
 CHI_Bobcat_all_terrain_vehicle_desc: "喵喵喵"
 Consumer_goods_consumption: "消费品消耗\n\n[?Consumergoods_consumption|R]"
 Consumer_goods_consumption_desc: "[?Consumergoods_consumption|R]"
 CHI_Communist_Party_of_China: "中国共产党"
 CHI_Communist_Party_of_China_desc: "中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，是中国特色社会主义事业的领导核心，代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。中国共产党的最高理想和最终目标是实现共产主义。中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。\n\n自1949年中华人民共和国成立以来，中国共产党一直是中国唯一的执政党。"
 CHI_Supercomputer: "中国超级计算机"
 CHI_Supercomputer_desc: "昔在包牺氏始画八卦，以通神明之德，以类万物之情，作九九之术，以合六爻之变"
 CHI_the_arms_export_idea: "武器出口"
 CHI_the_arms_export_idea_desc: "中国是世界上最大的武器出口国和军品生产国之一。该国的军事产出几乎完全自给自足，还能将这些盈余出口到全球其他国家。"
 CHI_nanshuibeidiao_project: "南水北调工程"
 CHI_nanshuibeidiao_project_desc: "该省份已因南水北调工程竣工而免受缺水之苦"
 CHI_OGAS_state: "OGAS"
 CHI_OGAS_state_desc: "该省份已连接全国自动化系统"
 American_economic_hegemony: "美国经济霸权"
 American_economic_hegemony_desc: "美国经济霸权的实现手段是美元霸权，美元霸权是美国的世界霸权在金融领域的反映，也为美国的世界霸权提供了金融上的重要支撑。因此，维护美元霸权，就是维护美国的世界霸权。为实现这一目标，美国不惜动用武装冲突、“金融战”、“贸易战”等一切手段，也不惜对任何国家下手，包括自己的盟友。\n\n作为唯一的政治经济军事超级大国，美国拥有庞大的海外资产，全球所有国家都在不同程度上沦为了美国的供血包。美国拥有巨量的海外承包工厂用以支撑本国经济的快速发展，以至于不可能有任何国家的工业能力能在真正意义上超过美国，除非终结美国的政治、经济、军事三重霸权……"
 Economically_advanced_countries: "经济先进国"
 Economically_advanced_countries_desc: "这个国家由于其固有的发达经济，或者由于其在美国主导的世界体系中享有优越地位，可以在经济全球化中享受到更多好处，如廉价的国际劳务外包或价格低廉的消费品进口等。但归根结底，这个国家仍然高度依赖美国主导的世界格局，而当美国遇到问题时便会这些国家身上榨取利益。\n\n§R倘若中国的全局影响力高于美国，此修正将会失效！§!"
 Economic_dependency_countries: "经济依附国"
 Economic_dependency_countries_desc: "这个国家在事实上表示了对美国主导的世界经济体系的顺从，并尝试融入这个体系。其利用自身庞大而廉价的劳动力，为发达国家不断输送出口廉价的消费品，以此换取更多的国际投资和扩张式经济增长，代价则是产业固化和升级困难，且损失了国家独立性和国际话语分量。\n\n§R倘若中国的全局影响力高于美国，此修正将会失效！§!"
 Economic_resources_dependency_countries: "经济依附国"
 Economic_resources_dependency_countries_desc: "这个国家在事实上表示了对美国主导的世界经济体系的顺从，并尝试融入这个体系。其利用自身丰富的矿产资源，为发达国家不断输送出口低价的原材料，以此换取更多的国际订单，代价则是产业固化和升级困难，且损失了国家独立性和国际话语分量。\n\n§R倘若中国的全局影响力高于美国，此修正将会失效！§!"
 Confronting_the_USA_countries: "对抗美国主导的国际体系"
 Confronting_the_USA_countries_desc: "这个国家对抗美国主导的世界体系，因此受到了美国的制裁和打压，阻碍了其经济社会国内发展。"
 Domestic_consumption: "国内消费"
 Domestic_consumption_desc: "每个国家都会根据其人口总数和人均GDP而产生一定的消费，无论是自给自足或是国外进口，如若供给不能满足国内的消费需求则会带来诸多负面效果。\n---------------------------------\n\n§W生产与消费明细：\n§Y£steel_texticon£钢铁§!：\n由于§Y军用工厂数量§!影响：[?steel_consumption_military|-=3]\n由于§Y民用工厂数量§!影响：[?steel_consumption_industrial|-=3]\n\n§Y£consumer_goods_texticon£消费品§!：\n由于§Y人口基数§!影响：[?good_consumption_pop|-=3]\n由于§Y人均GDP§!影响：[?good_consumption_gdp|Y2%]\n由于§Y国家生产率§!影响：[?good_consumption_productivity|Y2%]\n由于§Y科技、法案、国家精神等§!影响：[?good_consumption_multiplier_modifier_show|-=2%]\n由于§Y办公区就业§!影响：[?good_consumption_office|-=3]\n由于§Y民用工厂就业§!影响：[?good_consumption_civ|-=3]\n由于§Y科技、法案、国家精神等§!影响：[?good_consumption_add_modifier|-=3]\n\n§Y£service_texticon£服务§!：\n由于§Y人口基数§!影响：[?service_consumption_pop|-=3]\n由于§Y人均GDP§!影响：[?service_consumption_gdp|Y2%]\n由于§Y医疗和教育的预算§!影响：[?service_consumption_budget|Y2%]\n由于§Y国家生产率§!影响：[?service_consumption_productivity|Y2%]\n由于§Y科技、法案、国家精神等§!影响：[?service_consumption_multiplier_modifier_show|-=2%]\n由于§Y办公区就业§!影响：[?service_consumption_office|-=3]\n由于§Y民用工厂就业§!影响：[?service_consumption_civ|-=3]\n由于§Y科技、法案、国家精神等§!影响：[?service_consumption_add_modifier|-=3]\n\n§Y£grain_texticon£食品§!：\n由于§Y人口基数§!影响：[?food_consumption_pop|-=3]\n由于§Y人均GDP§!影响：[?food_consumption_gdp|Y2%]\n由于§Y科技、法案、国家精神等§!影响：[?food_consumption_multiplier_modifier_show|-=2%]\n由于§Y非商业农业人口§!影响：[?food_consumption_agriculture|-=3]\n由于§Y商业化农业人口§!影响：[?food_consumption_agriculture_commercialized|-=3]\n由于§Y科技、法案、国家精神等§!影响：[?food_consumption_add_modifier|-=3]§!"

