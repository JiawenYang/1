 RUS_cold_war_losers_desc: "冷战失败后的创伤深刻地影响了这个国家。"
 MDGR_hegemony_resistance_impact: "抵抗霸权影响"
 MDGR_hegemony_resistance_impact_desc: "该国正在保护自己的独立性，试图让自己免受两个大国的影响。"
 CHI_XinJiang_Situation: "新疆局势"
 CHI_XinJiang_Situation_desc: "当地的极端分裂主义活动的威胁程度直接影响了我们对于该地区的控制水平且严重阻碍当地正常的经济秩序。\n\n§Y分裂分子威胁§!：[?CHI.uighur_threat|%%]\n§Y维吾尔族民意§!：[?CHI.uighur_opinion|%%]\n§Y上个月分裂主义威胁改变§!：[?CHI.uighur_threat_change|-=%%]"
 MDGR_Falsifying_GDP_modifier: "对GDP注水"
 MDGR_Falsifying_GDP_modifier_desc: "只需要掌握一点统计学魔法，我们就能创造出GDP总量数据的奇迹。"
 MDGR_AIIB_modifier: "亚洲基础设施投资银行"
 MDGR_AIIB_modifier_desc: "亚洲基础设施投资银行是是一个政府间性质的亚洲区域多边开发机构，其目的在于促进亚洲区域的建设互联互通化和经济一体化的进程。有人认为这是中国拓展其全球影响力的手段。\n[ROOT.AIIB_adjective_desc]"
 AIIB_adjective_chairman_desc: "身为主席国，我们可以通过提供援助其他国家来增加全球影响力，但作为代价会暂时减少此项修正的正面效应。目前有[?ROOT.AIIB_member_num|Y0]个成员国。"
 AIIB_adjective_member_desc: "身为成员国，我们可以选择接受到来自主席国的援助以发展经济，但代价是部分的自身独立性损失。"
 MDGR_unprepared_for_war: "未经准备的战争"
 MDGR_unprepared_for_war_desc: "我们的军事系统尚未做好进行一次全面战争的准备。"
 CHI_Africa_Medical_Security: "发展医疗事业"
 CHI_Africa_Medical_Security_desc: "在中国的帮助下，当地的医疗条件正在逐步改善。"
 MDGR_economic_cycle_seize_profit: "利用全球化"
 MDGR_economic_cycle_protecting_interests: "维护全球化"
 MDGR_productivity_state_var_modifier: "省份生产率被动变化"
 MDGR_productivity_state_var_modifier_desc: "生产率的提升如同逆水行舟，越高水平的生产率维持则会越困难。"
 MDGR_economic_cycle_percentage_all: "世界经济周期进程的总长度"
 MDGR_economic_cycle_progress_all: "世界经济周期的当前进度"
 MDGR_economic_cycle_progress_all_last: "上个月的进度改变"
 MDGR_economic_cycle_progress: "我方对于世界经济周期进度的影响"
 MDGR_global_economic_cycle_modifier: "世界经济周期影响"
 MDGR_global_economic_cycle_modifier_desc: "全球化让世界各国政治、经济、文化、社会等多元领域日益走向深度融合与相互依存，这也导致了世界经济运行出现周期性波动，这种周期性波动不可避免地影响每一个全球化参与者。\n§W---------------------------------\n$MDGR_economic_cycle_percentage_all$：[?D75.MDGR_economic_cycle_percentage_all|Y]\n$MDGR_economic_cycle_progress_all$：[?D75.MDGR_economic_cycle_progress_all|Y]\n$MDGR_economic_cycle_progress$：[?ROOT.MDGR_economic_cycle_progress|-]\n$MDGR_economic_cycle_progress_all_last$：[?D75.MDGR_economic_cycle_progress_all_last|-]\n当前经济形式：[D75.MDGR_economic_cycle_adjective_desc]\n[ROOT.MDGR_economic_cycle_identification_desc]\n\n其中$MDGR_economic_cycle_percentage_all$取决于所有参与世界经济的§Y国家的GDP世界占比§!以及§Y实行的贸易法案§!，而$MDGR_economic_cycle_progress$则取决于我们的§Y$interest_rate_multiplier_modifier$§!和§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!和§Y£interest_rate_multiplier_modifier_texticon£债务与GDP比例§!以及§Y$economic_cycle_global_mult$§!，所有国家对世界经济周期进度的影响累计后则为$MDGR_economic_cycle_progress_all$。\n\n如果§Y$MDGR_economic_cycle_progress_all$§!少于§Y$MDGR_economic_cycle_percentage_all$§!那么将会得到$productivity_growth_modifier$、$economic_cycles_cost_factor$、$econ_cycle_upg_cost_multiplier_modifier$、$investment_cost_modifier$、$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$方面的§G正面影响§!，反之亦然。§!"
