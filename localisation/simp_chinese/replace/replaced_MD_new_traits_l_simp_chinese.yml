 ###############新冠病毒
 SARS_COV_2019_category: "新型冠状病毒"
 SARS_COV_2019_category_desc: " \n\n\n\n\n\n£MAIN_desctext_SARSCov2019\n\n\n\n\n\n\n\n 新型冠状病毒（2019-nCoV或称SARS-CoV-2）是以前从未在人体中发现的冠状病毒新毒株，在人感染了冠状病毒后的常见体征有呼吸道症状、发热、咳嗽、气促和呼吸困难等。在较严重病例中，感染可导致肺炎、严重急性呼吸综合征、肾衰竭，甚至死亡。对于新型冠状病毒所致疾病没有特异治疗方法。\n\n肆虐的新冠病毒疫情，不仅危及各国人民生命安全和身体健康，还严重冲击世界经济，经济全球化遭遇逆风，单边主义、保护主义抬头，公平和效率、增长和分配、技术和就业等矛盾更加突出，贫富差距仍普遍存在，全球极端贫困率将出现20年来首次上升。\n\n任何被新冠病毒所感染的地区，每周都会根据当地的§R$transmit_coefficient_add$§!决定是否会向周边区域扩散。§R$state_extra_population_mult$§!则与§R$transmit_coefficient_add$§!和§Y当地人口数量§!以及§Y传播系数§!相关。而当§R$transmit_coefficient_add$§!§Y小于等于0§!时，病毒感染就有可能会§G停止§!。\n为了对抗病毒的影响，我们会有一系列§Y抗疫措施§!，但这些措施往往是一把双刃剑，我们必须要在§Y经济§!与§Y生命§!之间做出平衡的选择。\n\n统计数据：\n总计死亡：[?ROOT.SARS_COV_2019_died_number|3]K，上周死亡：[?ROOT.SARS_COV_2019_died_number_weekly|3]K，上周感染省份总计：[?ROOT.SARS_COV_2019_transmit_coefficient_number|0]，可承受死亡：[?ROOT.SARS_COV_2019_died_endurance|3]K"
 SARS_COV_2019_category_show_state_decision: "§Y显示/隐藏§!省份决议"
 SARS_COV_2019_category_show_state_decision_desc: "如果只想针对某个省份实行决策，则点击这里展开。"

 SARS_COV_2019_category_clinical_guidelines: "发布§Y临床指南§!"
 SARS_COV_2019_category_clinical_guidelines_desc: "将最新的标准治疗方案及时更新到每个医疗机构是必要的。"
