 CHI_Northeast_Revitalization_category: "振兴东北决议"
 CHI_Northeast_Revitalization_category_desc: "\n\n\n\n\n\n£MAIN_desctext_chinortheast\n\n\n\n\n\n\n\n\n水绕山环、沃野千里是§Y东北地区§!地面结构的基本特征，土质以黑土为主，是形成大经济区的自然基础。东北地区经济起步较早，曾一度§Y占有中国98%的重工业§!，为新中国的发展壮大做出过§R历史性的巨大贡献§!，强有力地支援了全国的经济建设。东三省长达五十余年直接上交财政收入是国家转移的5倍左右，且不计算向全国各地转移的大量工厂，仅大庆油田便上交了24亿吨石油。\n\n§Y温家宝总理§!指出，§R党的十六大§!明确提出支持东北地区等老工业基地加快调整和改造，支持以资源开采、产业转型、发展现代化农业为主的区域城市发展接续产业。"
 Expand_liaoning_industry: "辽宁建设"
 Expand_jilin_industry: "吉林建设"
 Expand_heilongjiang_industry: "黑龙江建设"
 CHI_jilin_Automobile_manufacturing: "投资吉林汽车制造"
 CHI_jilin_Automobile_manufacturing_desc: "吉林曾经是我国最大的汽车工业制造中心，我们应加大对这一工业基础的扶持"
 CHI_dalian_shipbuilding_industry: "投资大连造船业"
 CHI_dalian_shipbuilding_industry_desc: "大连是我国最大的船坞制造中心，我们应加大对这一地区的投资"
 CHI_heilongjiang_Mechanized_agriculture: "在黑龙江推广机械化农业生产"
 CHI_heilongjiang_Mechanized_agriculture_desc: "黑龙江拥有我国最大的黑土地分布，农业潜力十分突出。我们应加大这一地区的农业投资，推广高效大机械生产"
 CHI_development_of_western_region_category: "西部大开发决议"
 CHI_development_of_western_region_category_desc: "\n\n\n\n\n\n£MAIN_desctext_chiwest\n\n\n\n\n\n\n\n\n§Y西部地区§!面积为685万平方公里，约占全国的71.4%。2002年末人口3.67亿人，占全国的25%。约占国内生产总值的15%。是我国三大区域中面积最大、纵深最广、情况最复杂的地区。\n\n西部地区自然资源丰富，市场潜力大，战略位置重要。但由于自然、历史、社会等原因，西部地区经济发展§Y长期相对落后§!，人均国内生产总值仅相当于全国平均水平的三分之二，不到东部地区平均水平的40%，迫切需要加快改革开放和现代化建设步伐。\n\n实施西部大开发，就是要依托亚欧大陆桥、长江水道、西南出海通道等交通干线，发挥中心城市作用，以线串点，以点带面，逐步形成我国西部有特色的西陇海兰新线、南（宁）贵、成昆（明）等跨行政区域的经济带，带动其他地区发展，有步骤、有重点地推进西部大开发。 "
