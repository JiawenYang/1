 Vast_territory_and_populous: "广土巨族"
 Vast_territory_and_populous_desc: "数千年来，中国四面环山和丛林密布的地理环境保护了她，辽阔而多姿的土地生活着中华民族，广袤而丰饶的物产养育了众多人民。但特殊的地理环境也将她与世界其他地区隔离开来，形成了一个相对独立的历史地理区域。作为一个拥有大量人口和民族的文明古国，中央政府仅维持领土完整就需要付出相当大的努力，因为它需要对其腹地和边疆领土进行大量投入才能维持控制。\n不过，这片土地上数千年来发生了太多事情，以至于似乎一切兴衰、成败、欢喜、悲痛都成了不重要的事情，一切事物总会像过去数千年间这里发生的事情那样——渐渐消失在历史长河和广阔的天地之间，成为丹青史册上或浓或淡的一笔，以及中国人的饭后谈资。\n\n§Y滚滚长江东逝水，浪花淘尽英雄§!\n§Y是非成败转头空§!\n§Y青山依旧在，几度§!§R夕阳红§!\n\n§Y白发渔樵江渚上，惯看秋月§!§C春风§!\n§Y一壶浊酒喜相逢§!\n§Y古今多少事，都付§!§O笑谈中§!"
 CHI_OGAS_nation: "全国自动化系统"
 CHI_OGAS_nation_desc: "中国拥有人类历史上第一套全国自动化系统，由设立在北京的超级计算机中央连接全国各地的数据中心，通过区块链技术以符合中央规划的核心程序计算出最为多、快、好、省的生产、生活建议——某种程度上更是一种计划指令，然后推广给大小终端作为进行生产活动或生活活动的指导。\n虽然这套系统并非是强制性实施的，中国政府将其作为一种服务以极低的成本提供给企业和公民消费和使用，但其所迅速带来的社会变革潮流、巨大的生产力释放、政府明里暗里的推行，都让所有人都难以拒绝与这个深入社会每一个角落的系统打交道。"
 CHI_policy_of_redemption_idea: "赎买政策"
 CHI_policy_of_redemption_idea_desc: "采取“四马分肥”的赎买形式，即按照国家所得税、企业公积金、职工福利奖金和企业家的股息红利四个方面分配企业盈余，企业家所得被限制在企业盈余的1/4左右，并在一定时期内，国家按照公私合营企业中核定的私股股额每年付给企业家5%的股息"
 beidou_satelite_navigation_system: "$beidou_satelite_navigation$"
 beidou_satelite_navigation_system_desc: "$beidou_satelite_navigation_desc$"
 beidou_satelite_navigation: "北斗卫星导航系统"
 beidou_satelite_navigation_desc: "北斗卫星导航系统是中国自行研制的全球卫星导航系统，也是继GPS、GLONASS之后的第三个成熟的卫星导航系统。随着北斗系统建设和服务能力的发展，相关产品已广泛应用于交通运输、海洋渔业、水文监测、气象预报、测绘地理信息、森林防火、通信时统、电力调度、救灾减灾、应急搜救等领域，逐步渗透到人类社会生产和人们生活的方方面面，为全球经济和社会发展注入新的活力。"
 ban_Korean_culture: "限韩令"
 ban_Korean_culture_desc: "韩国的娱乐业这一核心产业高度依赖中国市场，这导致中国对于韩国娱乐产业的禁令严重冲击了韩国的经济"
 The_China_Dream: "中国梦"
 The_China_Dream_desc: "实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想。中国梦的最大特点就是把国家、民族和个人作为一个命运的共同体，把国家利益、民族利益和每个人的具体利益都紧紧地联系在一起。\n\n“中国梦”关乎着中国未来的发展方向，凝聚了中国人民对中华民族伟大复兴的憧憬和期待；它是整个中华民族不断追求的梦想，是亿万人民世代相传的夙愿，每个中国人都是中国梦的参与者、创造者。"
 CHI_Economically_advanced_countries: "受中国支持的经济先进国"
 CHI_Economically_advanced_countries_desc: "从前，这个国家由于其固有的发达经济，或者由于其在美国主导的世界体系中享有优越地位，可以在经济全球化中享受到更多好处，如廉价的国际劳务外包或价格低廉的消费品进口等。\n\n如今，这个国家在中国的号召之下开始挺身反对美国为核心的霸权体系，并由此表示了对中国提倡的多元化的新国际秩序的赞同。"
 CHI_Economically_advanced_countries_2: "受中国制裁的经济先进国"
 CHI_Economically_advanced_countries_2_desc: "从前，这个国家由于其固有的发达经济，或者由于其在美国主导的世界体系中享有优越地位，可以在经济全球化中享受到更多好处，如廉价的国际劳务外包或价格低廉的消费品进口等。\n\n如今，这个国家由于拒绝和中国一起反对美国为核心的霸权体系，受到了中国的经济制裁，这对其国内经济产生了极为不良的影响。"
 Economic_dependency_countries_2: "受中国支持的经济欠发达国"
 Economic_dependency_countries_2_desc: "从前，这个国家在事实上表示了对美国主导的世界经济体系的顺从，并尝试融入这个体系，其利用自身庞大而廉价的劳动力或丰富的自然资源，为发达国家不断输送出口廉价的消费品或低价的原材料。\n\n如今，这个国家在中国的号召之下开始挺身反对美国为核心的霸权体系，并由此表示了对中国提倡的多元化的新国际秩序的赞同。"
 Confronting_the_USA_countries_2: "受到支持的对抗美国体系的国家"
 Confronting_the_USA_countries_2_desc: "这个国家反抗着美国主导的世界体系，而现在他们受到了中国的支持，社会经济得到发展。"
 Heritage_of_WW2: "第二次世界大战的遗产"
 Heritage_of_WW2_desc: "日本人不愿提起第二次世界大战的历史，既不愿再走上军国主义的道路，也早已没有了可以为之赴死的效忠对象。对于战争的警惕和排斥，是大部分日本人心中的共识"
 JAP_turbulent_political_situation: "动荡的政局"
 JAP_turbulent_political_situation_desc: "自小渊惠三首相暴毙后，日本首相换届频繁，无法制定长期和稳定的政策，人走茶凉的困局难以解决"
 JAP_weak_army: "孱弱的自卫队"
 JAP_weak_army_desc: "日本自卫队在本质上不是一支标准的军队，长期被日本政府以低薪和繁琐的政令压制。最主要的是，日本人民并不将其视作令人骄傲的部队，自卫队连兵员招募都十分困难，承平日久，不识刀戈"
 JAP_military_constrained_by_bureaucrats: "文官治军"
 JAP_military_constrained_by_bureaucrats_desc: "日本自卫队受日本政府官僚管理，在组织上十分臃肿，动员速度十分迟缓"
 JAP_Huge_overseas_assets: "巨额海外资产"
 JAP_Huge_overseas_assets_desc: "日本是世界最大的对外净资产国，在海外的资产甚至超过了本国GDP总数"
 JAP_leftwing_trend: "日本左翼思潮"
 JAP_leftwing_trend_desc: "战后日本迸发的轰轰烈烈的左翼运动给日本社会留下了深刻影响，在70年代后逐渐平息，但在文艺领域仍有很强影响力"
 JAP_Controlled_bureaucrats: "受控的官僚"
 JAP_Controlled_bureaucrats_desc: "受控的官僚才是首相的好帮手，我们需要忠诚的家臣"
 Right_as_Prime_Minister: "首相大权"
 Right_as_Prime_Minister_desc: "政治运作是首相的责任，尽职的首相才是好首相"
 middleclass_country: "中产之国"
 middleclass_country_desc: "七十年代的日本有个流行语叫「一亿总中流」。中央政府每年施行的舆论调查中，当人们被问到「你家经济状态属于上层，中上，中中，中下，还是下层」，回答说自己属于「中上、中中、中下」的比率，1958年有72%，到了1973年则超过了90%\n————《我这一代东京人》新井一二三"
 Education_Highland: "教育高地"
 Education_Highland_desc: "日本在近代以来持续向教育领域投资，形成了世界上最完善的教育体系之一。其高等教育在全球领域享有盛名，成效颇多。日本是亚洲诺贝尔奖获得者最多的国家"
 Patriarchal_society: "父权社会"
 Patriarchal_society_desc: "虽然日本是最发达的国家之一，但「以家庭中父亲占据大权，延伸出家族中族长占据大权，国家中最高统治者占据大权」的父权制影响仍在日本社会根深蒂固"
 Cyberpunk_Countries: "赛博朋克之地"
 Cyberpunk_Countries_desc: "巨型企业、人工智能、庞大城市、贫民窟、霓虹灯，过去与现在，西方与东方，战争与和平。在阴雨天的东京城里撑着透明伞匆匆走过的人们，有多少会抬头透过斑斓的光雾仰望星空呢"
 Low_desire_society: "低欲望社会"
 Low_desire_society_desc: "人口减少、超高龄化、失去上进心和欲望的年轻人越来越多；国民持有大量的金融资产，企业也有高额的内部准备金，却未能有效运用资金，无论是货币宽松政策或公共投资，无法提升消费者信心，撒钱政策亦无力振兴经济；年轻人对于买房买车结婚生子等传统的消费和生活方式没有兴趣，更倾向于过简单、安逸、自我满足的生活；宅文化盛行，年轻人沉迷于网络、游戏、动漫等虚拟世界，缺乏社会交往和责任感；草食男、干物女等新出现的社会群体，表现出对异性恋爱和性关系的冷淡和消极，导致婚恋市场萧条，生育率下降"
 aging_population: "老龄化与少子化"
 aging_population_desc: "日本是世界上老龄化最严重的国家，65岁以上人口已占总人口的27%，消费需求不足，经济增长动力疲软，以养老金为代表的社会福利体系已接近崩溃。这种情况几乎不可能逆转。"
 JAP_weak_army: "孱弱的自卫队"
 JAP_weak_army_desc: "日本自卫队在本质上不是一支标准的军队，长期被日本政府以低薪和繁琐的政令压制。最主要的是，日本人民并不将其视作令人骄傲的祖国卫队，自卫队甚至连兵员招募都十分困难，承平日久，不识刀戈"
 JAP_military_constrained_by_bureaucrats: "文官治军"
 JAP_military_constrained_by_bureaucrats_desc: "日本自卫队完全受日本政府官僚管理，在组织上十分臃肿，动员速度十分迟缓，不堪承担战争重任"
 JAP_economy: "经济不景气"
 JAP_economy_desc: "90年代资产泡沫破裂后，日本经历了近十年低温经济，持续的通缩，让居民和企业失去活力、社会失去创新力。经济泡沫破裂后，日本财政货币政策力度加大，但由于并未重视僵尸企业隐患，导致1997年日本出现银行业危机；1999年开始施行零利率政策，但没有坚定锚物价，以至于2000年经济形势刚有起色就立马取消政策，加重了通缩预期，影响日本央行公信力\n日本经济正陷入无解的怪局"
 HKG_special_administrative_region: "香港特别行政区"
 HKG_special_administrative_region_desc: "香港特别行政区是根据《中华人民共和国宪法》规定设立的省级行政区，与省、自治区、直辖市同属直辖于中央人民政府的地方行政区域。1997年7月1日，中国政府对香港恢复行使主权，香港特别行政区成立。中央政府对香港拥有全面管治权，香港保持原有的资本主义制度不变，并享受外交及国防以外所有事务的高度自治权，以“中国香港”的名义参加不以国家为单位参加的国际组织和国际会议。“一国两制”、“港人治港”、高度自治是中国政府的基本国策。"
 MAC_special_administrative_region: "澳门特别行政区"
 MAC_special_administrative_region: "澳门特别行政区是根据《中华人民共和国宪法》规定设立的省级行政区，与省、自治区、直辖市同属直辖于中央人民政府的地方行政区域。1999年12月20日，中国政府对澳门恢复行使主权，澳门特别行政区宣告正式成立。中央与澳门特区关系的基本原则为“一国两制”“澳人治澳”、高度自治的原则。"
 MON_special_administrative_region: "蒙古特别行政区"
 MON_special_administrative_region_desc: "蒙古特别行政区是根据《中华人民共和国宪法》规定设立的省级行政区，与省、自治区、直辖市同属直辖于中央人民政府的地方行政区域。中国政府对蒙古恢复行使主权后，中央参考了内蒙古自治区民族自治的相关经验，维持了与蒙古特区关系的基本原则为“一国两制”“蒙人治蒙”、高度自治的原则。"
 TAI_special_administrative_region: "台湾特别行政区"
 TAI_special_administrative_region_desc: "台湾特别行政区是根据《中华人民共和国宪法》规定设立的省级行政区，与省、自治区、直辖市同属直辖于中央人民政府的地方行政区域。中国政府对台湾恢复行使主权后，对台湾拥有全面管治权，香港保持原有的资本主义制度不变，并享受外交及国防以外所有事务的高度自治权，以“中国台湾”的名义参加不以国家为单位参加的国际组织和国际会议。“一国两制”、“台人治台”、高度自治是中国政府的基本国策。"
 JAP_special_administrative_region: "日本国特区"
 JAP_special_administrative_region_desc: "日本国特区是根据《中华人民共和国宪法》规定设立的省级行政区，与省、自治区、直辖市同属直辖于中央人民政府的地方行政区域。日本国特区由日本天皇任职名义主席，天皇是日本国特区的象征，其地位以辖区所在的全体日本人民的意志为依据。中华人民共和国中央政府对日本拥有全面管治权，日本保持原有的资本主义制度不变，并享受外交以外所有事务的高度自治权，允许保留以自卫为目的的自卫队，以“日本国特区”的名义参加不以国家为单位参加的国际组织和国际会议。“一国两制”、“和人治和”、高度自治是中国政府的基本国策。"
 CHI_special_administrative_region: "特别行政区"
 CHI_special_administrative_region_desc: "特别行政区一般是省级行政区，与省、自治区、直辖市同属直辖于中央人民政府的地方行政区域，并且在政治上由当地人民高度自治，有些甚至能保存自己的武装力量。"
 TAI_military_tradition: "国军传统"
 TAI_military_tradition_desc: "友军不动安如山"
 CHI_Popular_local_network_culture: "本土流行文化"
 CHI_Popular_local_network_desc: "此国庞大的当地网络群体创造出了繁荣的本土流行网络文化。"
 CHI_Maoism: "毛泽东思想"
 CHI_Maoism_desc: "§R西风烈，长空雁叫霜晨月\n霜晨月，马蹄声碎，喇叭声咽\n\n雄关漫道真如铁，而今迈步从头越\n从头越，苍山如海，残阳如血§!"
 CHI_Deng_Xiaoping_Theory: "邓小平理论"
 CHI_Deng_Xiaoping_Theory_desc: "邓小平指出，社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。要把“是否有利于发展社会主义社会的生产力”等三个“有利于”的原则作为改革开放是姓“资”还是姓“社”的判断标准，强调以经济建设为中心，以坚持四项基本原则和坚持改革开放为两个基本点作为基本路线，建设社会主义市场经济体制，发展具有中国特色的社会主义"
 three_represents: "三个代表重要思想"
 three_represents_desc: "中国共产党要始终代表中国先进生产力的发展要求\n中国共产党要始终代表中国先进文化的前进方向\n中国共产党要始终代表中国最广大人民的根本利益"
 scientific_outlook_on_development: "科学发展观"
 scientific_outlook_on_development_desc: "科学发展观，第一要义是发展，核心立场是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾"
 xi_thought: "习近平新时代中国特色社会主义思想"
 xi_thought_desc: "新时代中国特色社会主义思想是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃\n“十个明确”、“十四个坚持”、“十三个方面成就”、“六个必须坚持”"
 RAJ_Equipment_Design: "印度装备设计"
 RAJ_Equipment_Design_desc: ""
 CHI_Independent_Africa: "独立的非洲"
 CHI_Independent_Africa_desc: "古老的大地正在东方巨龙的帮助下复苏"
 idea_JAP_emperor_hisahito: "悠仁天皇"
 idea_JAP_emperor_kako: "佳子天皇"



#资源
 PRODUCTION_MATERIALS_GRAIN: "食物"
 grain_desc: "尽管21世纪已经取得了极大的食物生产力，但食物仍是一个国家最基本的战略物资。世界上主要的食品包括谷物、蔬菜、肉蛋、鱼类、水果等。食物由自给农业和商品化农业区生产。"
 PRODUCTION_MATERIALS_CONSUMER_GOODS: "消费品"
 consumer_goods_desc: "消费品是用来满足人们物质和文化生活需要的那部分社会产品，也可以称作“消费资料”或者“生活资料”，包括衣物、电器、家具，以及各种能换钱的工业生产商品。消费品由民用工业生产。"
 PRODUCTION_MATERIALS_SERVICE: "服务"
 service_desc: "服务是个人或社会组织为消费者直接或凭借某种工具、设备、设施和媒体等所做的工作或进行的一种经济活动，其生产可能与物质产品有关，也可能无关，是对其他经济单位的个人、商品或服务增加价值，并主要以活动形式表现的使用价值或效用。服务由办公园区生产。"


