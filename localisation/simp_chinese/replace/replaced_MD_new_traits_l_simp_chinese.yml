 CHI_labour_law_3_desc: "劳动法用以保障劳资双方的权益，同时严禁双方过火的行为。这种充满法团主义色彩的劳动法确保了社会发展的稳定性，在一定意义上保障了劳动者的权益，但根本意义上否决了阶级斗争的可能性和合法性。"
