 CHI_Hanxin_Event_Effect: "芯片造假"
 CHI_Hanxin_Event_Effect_desc: "芯片造假事件让人们对科研项目的真实性和可靠性产生了深深的怀疑，极大地影响了整个科研生态的健康发展，严重地阻碍了自主芯片的研发。"
 USA_Stock_market_circuit_breaker: "股市熔断"
 USA_Revolving_Door: "政商“旋转门”"
 USA_Revolving_Door_desc: "在美国有大量的游说团体和个人，其中相当大一部分由前政府官员组成，他们利用自己的人脉关系为特定的利益集团服务，领取高额薪水。同时也有许多私人部门的人士被政府吸纳，成为政府官员。\n这种完全合法的从私人部门到公共部门的来回切换的情况被形象地称为“旋转门”。"
 USA_Medical_Insurance_Complex: "医疗-保险复合体"
 USA_Medical_Insurance_Complex_desc: "医疗-保险复合体是一个由医师、医药公司和保险公司紧密结合而成的利益集团，导致了医疗支持占GDP的上升和与其支出比例不符的预期寿命长度，愈发不堪重负的医疗费用更是直接导致美国公民破产的主要原因，更是有数以万计的因医疗费用不支导致的死亡。"
 SARS_COV_2019_died_endurance_exceeds: "超出可承受上限"
