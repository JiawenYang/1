 SARS_COV_2019_category_promote_working_home_desc: "提倡在家使用个人设备进行远程办公与学习。"
 

 SARS_COV_2019_category_lockdown: "设立§Y出行限制§!"
 SARS_COV_2019_category_lockdown_desc: "通过设立严格出行限制来阻断新冠病毒传播，必要时彻底停止一切外出学习与工作以居家隔离。"
 SARS_COV_2019_category_lockdown_cancel: "取消§Y出行限制§!"
 SARS_COV_2019_category_lockdown_cancel_desc: "当前感染风险可控，我们应当取消出行限制，恢复原有生产与生活。"
