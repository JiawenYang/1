 AIIB_category: "亚洲基础设施投资银行"
 AIIB_category_desc: "\n\n\n\n\n\n£MAIN_desctext_AIIB\n\n\n\n\n\n\n\n\n\n§Y亚洲基础设施投资银行§!，也即是§Y亚投行§!，是一个政府间性质的亚洲区域多边开发机构。重点支持§Y基础设施建设§!，成立宗旨是为了促进亚洲区域的建设互联互通化和经济一体化的进程，并且加强中国及其他亚洲国家和地区的合作，是首个由§Y中国§!倡议设立的多边金融机构，总部设在§Y北京§!。§Y亚洲基础设施投资银行§!的出现是对经济全球化趋势的顺应与迎合，不仅促进了成员国之间关系的改善，而且显著增加了§Y[CHI.GetFlag]中国§!在§Y全球§!的影响力。\n\n各国申请加入的可能性取决于§Y$modify_chinese_aggression$§!和§Y意识形态§!以及§Y全局影响力得分§!。"
 apply_to_join_as_member: "申请成为成员国"
 apply_to_join_as_member_desc: "加入亚洲基础设施投资银行能够促进我国经济发展，拉近我们与中国的关系"
 CHI_development_assistance: "提供年度发展援助"
 CHI_development_assistance_desc: "我们应该加大对落后成员国的援助，帮扶弱小是大国应承担的责任"
 CHI_Provide_low_interest_loans: "提供低息贷款"
 CHI_Provide_low_interest_loans_desc: "我们应该加大对落后成员国的援助，帮扶弱小是大国应承担的责任"
 Invite_other_countries_to_join: "邀请其他国家成为成员国"
 Invite_other_countries_to_join_desc: "我们可以邀请其他国家加入我们的和平企划\n\n§Y$modify_chinese_aggression$§!越低，外国§Y同意的可能性§!越高"
