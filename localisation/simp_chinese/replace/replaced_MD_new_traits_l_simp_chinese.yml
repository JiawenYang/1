 xinjiang_category: "新疆"
 xinjiang_category_desc: "\n\n\n\n\n\n£MAIN_desctext_xinjiang\n\n\n\n\n\n\n\n\n§Y[CHI.GetFlag]中国§!的民族关系一向以和谐和稳定著称。然而总有一批§R分裂分子§!时刻意图分裂我国，并在§Y新疆地区§!活跃，煽动§R分裂主义与仇恨§!。这是长期对少数民族自治权的让渡、意识形态宣传工作不够、境外势力唆使等因素共同导致的。我们不能忽视这种潜在威胁，但我们必须在§Y打击分裂主义§!和§Y赢得当地人民民心§!之间取得平衡。\n§Y分裂分子威胁§!表示分裂主义反对派武装分子的力量，较高的威胁水平会导致更致命和更具破坏性的攻击。§Y维吾尔族民意§!确定§Y分裂分子威胁§!的每月增加速率，民心所向决定这群反动派的规模。\n\n§Y发展才是稳定人心的唯一方法§!，根除分裂主义的最好办法就是发展当地，让维族同胞过上好日子，从心底上蔑视这些分裂主义分子。\n如果这群极端的恐怖主义者的威胁程度越高，那么我们对于当地的控制能力与当地正常经济发展就会越受到影响，表现为在§Y当地§!产生§H$state_productivity_growth_modifier$§!、§H$MODIFIER_LOCAL_ORG_REGAIN$§!、§H$MODIFIER_LOCAL_SUPPLIES_FOR_CONTROLLER$§!、§H$MODIFIER_LOCAL_RESOURCES_FACTOR$§!、§H$STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$§!方面的§R负面影响§!，反之亦然。\n\n§Y分裂分子威胁§!：[?ROOT.uighur_threat|%%]\n§Y维吾尔族民意§!：[?ROOT.uighur_opinion|%%]\n§Y上个月分裂主义威胁改变§!：[?ROOT.uighur_threat_change|-=%%]\n"
