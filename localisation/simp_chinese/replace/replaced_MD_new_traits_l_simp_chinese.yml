#决议
 CHI_balance_of_power_category: "中国社会发展平衡决议"
 CHI_eastern_region_leading_development_category: "东部率先发展决议"
 CHI_eastern_region_leading_development_category_desc: "\n\n\n\n\n\n£MAIN_desctext_chieast\n\n\n\n\n\n\n\n\n§Y中国东部地区§!在上个世纪80年代§Y深圳特区§!的开放，带动了§Y珠江三角洲地区§!的改革发展；90年代§Y浦东新区§!的开发开放，带动了§Y长江三角洲和长江流域§!的改革发展。珠三角、长三角迅速跃升为中国经济最活跃的“两极”。\n\n实施东部率先发展战略，推动中国东部地区更有能力支持推动西部开发、中部崛起和东北振兴，促进、形成东中西互动和全国经济协调发展良好局面。东部地区承担着为全国引路、试验的任务，所以东部在发展、转型、改革、转轨走在前面，能够为全面深化改革起到§Y先行先试、搭桥铺路§!的作用。"
 Expand_hainan_Tourism_industry: "建设海南旅游业配套设施"
 Expand_hainan_Tourism_industry_desc: "建设与旅游业相关的配套产业"
 Expand_jingjinji_industry: "扩大京津冀产业"
 Expand_shandong_industry: "扩大山东产业"
 Expand_jiangsu_Urban_agglomerations: "建设江南城市群"
 Expand_zhejiang_Technology_Highland: "建设浙江科技高地"
 Expand_fujian_Foreign_trade_ports: "打造福建外贸港口"
 Expand_guangdong_The_Heart_of_Manufacturing: "强化制造业的心脏广东"
 Expand_shanghai_financial_center: "打造金融中心上海"
 CHI_hainan_Tourism_industry: "发展海南旅游业"
 CHI_hainan_Tourism_industry_desc: "海南处于热带地区，风景靓丽，气候宜人，适合以旅游业为焦点带动当地经济发展"
 CHI_jingjinji_Integration: "推动京津冀一体化发展"
 CHI_jingjinji_Integration_desc: "京津冀地处同一区域，优势互补，投资发展这一地区对经济发展有很大推动力"
 CHI_shandong_High_end_chemical_industry: "发展山东高端化工业"
 CHI_shandong_High_end_chemical_industry_desc: "山东是国有企业的重要基地，有许多化工产业集聚。投资高端化工有助于国企转型升级"
 CHI_jiangsu_High_end_manufacturing_industry: "发展江苏高端制造业"
 CHI_jiangsu_High_end_manufacturing_industry_desc: "江苏是高端制造业的分布地区，我们应加强对这一地区的投资驱动高端制造业发展"
 CHI_zhejiang_E_Commerce: "发展浙江电商"
 CHI_zhejiang_E_Commerce_desc: "浙江是我国最大的商品集散地和出口中心，电子商业也十分发达。我们应推动这一极具先驱性的产业发展"
 CHI_fujian_Electronic_manufacturing_industry: "投资福建电子制造业"
 CHI_fujian_Electronic_manufacturing_industry_desc: "福建具有完善的电子制造业体系，我们应加大投资发展"
 CHI_guangdong_Special_Economic_Zones: "投资广东经济特区"
 CHI_guangdong_Special_Economic_Zones_desc: "广东拥有深圳、广州两座超级城市，其中深圳是我国发展水平最高的经济特区。加大对这一充满活力的地区的投资，有利于我国经济快速发展"
 CHI_shanghai_Business_environment: "营造上海良好营商环境"
 CHI_shanghai_Business_environment_desc: "上海是我国极为重要的经济区域，也是我国对外交流的窗口。营造良好的营商环境有利于增进经济实力，确保投资者的信心"
 CHI_The_rise_of_central_category: "中部地区崛起决议"
 CHI_The_rise_of_central_category_desc: "\n\n\n\n\n\n£MAIN_desctext_chicentral\n\n\n\n\n\n\n\n\n§Y中国中部地区§!承东启西、连南接北，其六省经济总量约占全国五分之一，是不能忽视的重要地区。中部地区在中国经济社会发展全局中占有重要地位，长期以来为全国经济社会发展作出了重大贡献。中部地区包括§Y山西、安徽、江西、河南、湖北、湖南六省§!，国土面积102.8万平方公里，占全国陆地国土总面积的10.7%。\n\n促进中部地区崛起，是落实四大板块区域布局和“三大战略”的重要内容，是构建全国统一大市场、推动形成东中西区域良性互动协调发展的客观需要，是优化国民经济结构、保持经济持续健康发展的战略举措，是确保如期实现全面建设小康社会目标的必然要求。"
