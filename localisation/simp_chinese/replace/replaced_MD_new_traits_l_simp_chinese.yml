 CHI_hunan_Advanced_heavy_industry: "投资湖南先进重工业"
 CHI_hunan_Advanced_heavy_industry_desc: "湖南拥有数个超大型重工业制造基地，我们应继续加深其优势产业"
 CHI_hubei_Cutting_edge_industries: "投资湖北科技前沿产业"
 CHI_hubei_Cutting_edge_industries_desc: "湖北在生物科技上具有领先地位，我们应投资强化其科技产业"
 CHI_henan_Industrial_transformation: "投资河南产业升级"
 CHI_henan_Industrial_transformation_desc: "河南的产业亟须转型升级"
 CHI_jiangxi_Industrial_transformation: "投资江西产业升级"
 CHI_jiangxi_Industrial_transformation_desc: "江西的产业亟须转型升级"
 CHI_anhui_Industrial_transfer: "安排安徽承接东部产业转移"
 CHI_anhui_Industrial_transfer_desc: "安徽毗邻长三角发达地区，可以承接海量的制造转移"
 CHI_shanxi_Industrial_transformation: "加速山西产业转型升级"
