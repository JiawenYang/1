 BEL.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 BEN.Autocracy_desc: "专制主义： - 具有新兴主义的政府是那些寻求用自己的替代机构和全球政治多极方式取代现行自由世界秩序的政府，特别是在全球南方和后苏联地区。他们往往对全球化、政府形式和国内政策持有不同的态度。----专制政体是典型的专制主义政体，其中一个人掌握着最大的政治权力。独裁者反对任何威胁其权力的派别或政策。那些将西方视为对其王位的主要外国威胁的人通常会与新兴大国结盟。"
 BOL.Nat_Populism_icon: "£generic_Nat_Populism_small"
 BOL.neutral_Social_icon: "£generic_neutral_Social_small"
 BOL.oligarchism_icon: "£generic_oligarchism_small"
 BRA.conservatism_2000_desc: "保守主义： - 西方和亲西方政府寻求维持自苏联解体以来一直占据主导地位的以美国为中心的自由世界秩序。他们通过世界银行和国际货币基金组织等机构促进经济自由化和非国有化。尽管绝大多数持有西方观点的国家都是各种形式的民主国家，但受益于现状的亲西方强人政府也在其背后。---- 从广义上讲，保守主义是对传统制度和社会规范的支持。在民主国家，这通常表现为对宗教和民族主义价值观的支持、自由市场经济以及渐进、谨慎的改革。"
 BRA.oligarchism_MDB_desc: "寡头政治：- 不结盟政府的政府类型和次意识形态差异很大，并且通常对其外交结盟采取非常务实的态度。他们可能想要推进自己的民族独立或其他地区目标，或者只是在更大的权力之间左右为难，这些权力在争夺影响力的斗争中将他们拉向不同的方向。"
 BRA.oligarchism_MDB_icon: "£generic_oligarchism_small"
