 CZE.Autocracy_desc: "专制主义： - 具有新兴主义的政府是那些寻求用自己的替代机构和全球政治多极方式取代现行自由世界秩序的政府，特别是在全球南方和后苏联地区。他们往往对全球化、政府形式和国内政策持有不同的态度。----专制政体是典型的专制主义政体，其中一个人掌握着最大的政治权力。独裁者反对任何威胁其权力的派别或政策。那些将西方视为对其王位的主要外国威胁的人通常会与新兴大国结盟。"
 CZE.Autocracy_icon: "£generic_Autocracy_small"
 CZE.Conservative_icon: "£generic_Conservative_small"
 CZE.liberalism_2010_desc: "自由主义： - 西方和亲西方政府寻求维持自苏联解体以来一直占据主导地位的以美国为中心的自由世界秩序。他们通过世界银行和国际货币基金组织等机构促进经济自由化和非国有化。尽管绝大多数持有西方观点的国家都是各种形式的民主国家，但受益于现状的亲西方强人政府也是其背后的支持力量。---- 自由主义是一种广泛传播的意识形态，在世界各地有许多不同的变体。然而，大多数自由主义者团结起来支持公民自由、自由市场和民主政府。他们通常对政治采取改良主义观点，寻求随着时间的推移改变和改造机构。"
 CZE.liberalism_2010_icon: "£generic_liberalism_small"
 CZE.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 CZE.Neutral_Libertarian_2009_desc: "自由主义： - 不结盟政府的政府类型和次意识形态差异很大，并且通常对其外交结盟采取非常务实的态度。他们可能想要推进自己的民族独立或其他地区目标，或者只是在更大的权力之间左右为难，这些权力在争夺影响力的斗争中将他们拉向不同的方向。"
 CZE.Neutral_Libertarian_2009_icon: "£generic_Neutral_Libertarian_small"
 CZE.Neutral_Muslim_Brotherhood_desc: "温和伊斯兰主义： - 受穆斯林兄弟会启发的团体和政党，穆斯林兄弟会是一个跨国逊尼派伊斯兰组织，由伊斯兰学者哈桑·班纳 于1928年在埃及创立。该组织以其政治活动主义与伊斯兰慈善工作相结合的模式在整个阿拉伯世界及其他地区拥有支持者。其目标是政治伊斯兰治理，并将《古兰经》和《圣训》灌输为社会的唯一参考点。"
 CZE.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 CZE.Western_Autocracy_2004_desc: "亲西方专制主义：- 西方和亲西方政府寻求维持自苏联解体以来一直占据主导地位的以美国为中心的自由世界秩序。他们通过世界银行和国际货币基金组织等机构促进经济自由化和法律非国家化。尽管绝大多数持有西方观点的国家都是各种形式的民主国家，但受益于现状的亲西方强人政府也在其背后。---- 亲西方的专制政权并不真正符合民主、多元化、人权的“西方价值观”。然而，出于务实的原因，他们仍然与西方结盟，并且经常包括一些薄弱的自由主义机构 ---- 哪怕只是为了安抚他们的西方支持者。"
 CZE.Western_Autocracy_2004_icon: "£generic_Western_Autocracy_small"
 CZE.Western_Autocracy_pavel_icon: "£generic_Western_Autocracy_small"
