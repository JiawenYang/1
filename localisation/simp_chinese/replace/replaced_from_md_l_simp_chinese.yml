 PENINSULA_SHIELD: "半岛盾牌部队"
 CUB_land_of_freedom_idea_desc: "\n\n\n\n\n£GFX_CUB_outpost_of_socialism_embed \n\n\n\n\n\n\n敌军围困万千重，我自岿然不动。我们撵跑了独裁者巴蒂斯塔，打破了美国人不可战胜的神话，我们证明了古巴人民的决心坚不可摧！\n\n然而，我们仍是在孤军奋战，盟友俱在重洋之外。北方的白头鹰正假寐木上，急切地等待着在我们失足之际，俯冲下来，一击封喉。到目前为止，他们仍保持着耐心，但情况随时都有可能改变。但我们会一如既往，团结一致，傲然挺立，准备好迎接他们的魔爪！"
 CUB_idea_blockade_desc: "\n\n\n\n\n£GFX_CUB_blockade_embed \n\n\n\n\n\n\n古巴自宣布走社会主义的道路以来，经济完全被美国锁封锁，这让岛上的工业和生活都受到了冲击。"
 GER_Bundeswehr_modifier: "德国联邦国防军"
 GER_Bundeswehr_modifier_desc: "德国联邦国防军是德意志联邦共和国的武装力量，也是其自由选举产生的议会的组成部分。它包括军事部门和民事部门。武装力量由陆军、空军、海军和网络与信息领域四个军种以及后勤保障部门组成。"
 scientific_outlook_on_development_desc: "科学发展观包含了可持续发展、提升社会福利、人道主义，和谐社会，以及最终建立“社会主义和谐社会”。"
 xi_jinping_thought_desc: "习近平新时代中国特色社会主义思想，是习近平自2012年11月中共十八届一中全会当选中共中央总书记，成为最高领导人上台执政后形成的中国共产党指导思想。2017年10月24日，中国共产党第十九次全国代表大会通过了关于《中国共产党章程（修正案）》决议，习近平新时代中国特色社会主义思想写入党章。习近平新时代中国特色社会主义思想所要解决核心问题是：怎样坚持和发展中国特色社会主义、怎样建设中国特色社会主义现代化强国，该思想是全党全国人民为实现中华民族伟大复兴而奋斗的“行动指南”。"
 agrarian_economy_desc: "[FROM.GetName]是一个极其贫穷的国家，其经济主要基于农业收益。当国家现代化进入新的千年时，人民将在田间劳作，帮助经济发展。\n\n§Y$agrarian_economy$§! 挣得 §Y[?ROOT.GetName]§! §Y$$§![?additional_income_agrarian_economy|+3] §Y十亿§! a week.\n\n§R超过4,000美元的GDP/c，我们将被认为完成工业化，并失去农业经济的效果!§!"

 industrial_complex_desc: "此建筑可为所属地区提供生产民用商品或建造新建筑的工业能力，或可因需转换为军用工厂。\n\n为所属地区提供：\n所需工人基础数量：§Y415K§!\n每个§Y民用工厂§!的基本GDP产出：$§Y20B§!\n基础能源消耗：§R-0.4§! GW\n"
 arms_factory_desc: "此建筑可为所属地区提供生产军事装备的工业能力，或可因需转换为民用工厂。\n\n为所属地区提供：\n所需工人基础数量：§Y100K§!\n每个§Y军用工厂§!的基本GDP产出：$§Y4B§!\n基础能源消耗：§R-0.4§! GW"
 dockyard_desc: "§Y海军船坞§!代表了一个国家生产§Y巡逻艇§!、§Y护卫舰§!、§Y驱逐舰§!、§Y航母§!等各种军舰的能力。\n\n为所属地区提供：\n所需工人基础数量：§Y100K§!\n每个§Y船坞§!的基本GDP产出：$§Y4B§!\n基础能源消耗：§R-0.4§! GW"

