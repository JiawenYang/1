 jewish_desc: "犹太教是游戏中最古老的亚伯拉罕宗教，它以《托拉》以及犹太人民3000多年的传统和经文为基础。"
 ibadi_desc: "伊巴德派的信徒声称其历史比逊尼派和什叶派伊斯兰教更悠久，但其受欢迎程度远不及逊尼派。伊巴德派强调严格遵守他们认为更古老、更正统的伊斯兰教和沙里亚法。"
 sikh_desc: "锡克教是由古鲁那纳克于16世纪初在旁遮普邦创立的宗教。锡克教是一个一神教，诞生于伊斯兰教和印度教融合的地区，但在很多方面都与伊斯兰教和印度教有所不同。"
 theravada_desc: "与所有佛教分支一样，上座部佛教源于公元前5世纪乔达摩佛陀的教义。上座部佛教的信徒以巴利文经典为宗教和法律指导，注重僧侣义务和达到阿罗汉或证悟的境界。"
 vajrayana_desc: "金刚乘也被称为密宗佛教或喇嘛教，是佛教的一个分支，其信徒的目标是通过运用密宗技巧成为菩萨。人们认为，单靠学习无法获得证悟，必须由导师传授。"
 mahayana_desc: "大乘佛教是佛教中最为广泛的分支。其信徒的目标是获得觉悟，甚至可能证得佛果。"
 christian_desc: "天主教是一种基督教传统的名称，其根源在于古老的拉丁礼仪，该礼仪承认教皇为基督教世界的领袖。"
 confucian_desc: "儒家思想是指公元前五世纪哲学家孔子的哲学思想，强调个人发展和善政的重要性。"
 hindu_desc: "印度教是指拥有共同神系的众多印度多神教传统。"
 orthodox_desc: "东正教传统根植于希腊礼仪，并认为自己比天主教更接近原始的基督教理念。东正教教会拒绝教皇的概念，而是分为多个由牧首领导的教会。"
 protestant_desc: "新教涵盖了广泛的宗教传统，始于宗教改革时期马丁·路德的教义。他们反对天主教会长期以来发展起来的一些传统，以及教皇的概念本身。"
 shia_desc: "什叶派穆斯林认为，先知穆罕默德作为哈里发和伊玛目的合法继承人是他的表弟兼女婿阿里。什叶派认为，许多伊玛目已经追随阿里，并且仍在等待他最终继承人的到来。"
 shinto_desc: "神道教是日本古老的民族宗教，几个世纪以来，它与儒教和佛教在日本列岛共存。"
 sunni_desc: "逊尼派伊斯兰教认为先知穆罕默德的合法继承人是其岳父阿布·巴克尔。"
 coptic_desc: "科普特基督教是基督教的一个分支，遵循亚历山大礼仪，并听命于亚历山大的牧首。"
 mormon_desc: "摩门教是由约瑟夫·史密斯于19世纪20年代在美国发起的宗教运动。摩门教徒形成了强烈的社区意识，并与世代相传的大家庭有着紧密的联系，这反映了他们相信家人可以在死后继续紧密相连的信念。"
