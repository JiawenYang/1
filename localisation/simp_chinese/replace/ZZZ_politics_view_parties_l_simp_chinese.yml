 BAH.Monarchist_desc: "（立宪君主主义）- 温莎王室\n\n温莎王室统治着巴哈马，巴哈马是英联邦成员国。君主由巴哈马总督代表，总督负责批准法律、召集和解散议会，并任命参议员和法官。在自由民族运动党和进步自由党的竞争中，王室凌驾于宪法延续性之上，其地位由既得利益集团的共识所维系，而共和制问题则留待日后讨论。\n\n作为执政派别，它将拥护王室作为国家统一的基石，权力源自总督办公室而非各党派，并坚定地遵循英联邦和英国的法律传统。支持者称之为稳定；反对者则称其为殖民时代的遗物。"
