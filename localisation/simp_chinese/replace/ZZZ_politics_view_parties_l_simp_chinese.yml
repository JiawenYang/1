l_simp_chinese:
 BUL.Conservative_desc: "（超民族主义） - 进攻\n\n进攻是一个极端民族主义政党，由电视节目主持人沃伦·西德罗夫于2005年创立。该党反对争取权利和自由运动、反对土耳其少数族裔的政治影响、反对外国对经济的掌控，以及反对其所谓的保加利亚在欧盟的殖民地地位。\n\n该党公开亲俄，呼吁退出北约，要求将私有化企业重新国有化，并将东正教民族主义与反建制言论融合在一起。其影响力源于其拥有的电视频道、西德罗夫的竞选集会以及选民对转型进程的不满。"
 NRY.conservatism: "£NRY_conservatism_small 保守党（Høyre）"
 SOV.Nat_Populism: "£SOV_nationalist_right_wing_populist (执政党) 俄罗斯执政党"
