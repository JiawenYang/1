#其他国家#
 chaoxian.2: "朝鲜领导人金正日去世！"
 chaoxian.2.t: "朝鲜领导人金正日去世！"
 chaoxian.2.d: "2011年12月17日8时30分，朝鲜劳动党中央委员会总书记金正日在外出视察途中由于过度劳累在列车上逝世。\n\n据朝中社报道，朝鲜已经成立了国家治丧委员会，决定将金正日遗体安放在锦绣山纪念宫，将12月17日至29日定为哀悼期，从12月20日至27日接受吊唁，28日在平壤举行告别仪式，29日举行中央追悼大会。"
 chaoxian.2.a: "默哀……"
 chaoxian.3: "电贺金正恩出任朝鲜劳动党第一书记"
 chaoxian.3.t: "胡锦涛电贺金正恩出任朝鲜劳动党第一书记"
 chaoxian.3.d: "平壤\n朝鲜劳动党第一书记\n金正恩同志：\n\n欣悉朝鲜劳动党代表会议推举金正恩同志为朝鲜劳动党第一书记。我谨代表中国共产党中央委员会并以我个人名义向你和朝鲜劳动党中央委员会表示热烈祝贺。\n我们欣慰地看到，朝鲜人民继承金正日同志遗志，紧密团结在朝鲜劳动党的周围，在金正恩同志领导下，努力建设社会主义强盛国家。\n中朝两国是山水相连的友好邻邦。不断巩固和发展中朝传统友好合作关系，是中国党和政府坚定不移的方针。我们愿同朝鲜同志携手努力，继续深化中朝传统友谊，扩大各领域务实合作，共同促进朝鲜半岛和东北亚的持久和平与稳定，把两党两国老一辈领导人亲手缔造和培育的中朝关系巩固好、建设好、发展好。\n衷心祝愿第一书记同志和朝鲜劳动党在领导朝鲜人民建设强盛国家的事业中不断取得新的更大成就。\n\n中国共产党中央委员会总书记\n胡锦涛\n\n二○一二年四月十一日于北京"
 chaoxian.3.a: "另一个年轻人的故事开始了"

