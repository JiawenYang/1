 chi_GR.300.t: "抖音国际版"
 chi_GR.300.d: "国际版抖音首次获得了头把交椅——在近几个月大多数时间里国际版抖音一直处于领先地位，这也是唯一一个在Cloudflare排名中，前10名里占据一席之地的非美国网站。这无疑对于瓦解长期以来的刻板印象与偏见有积极作用。"
 chi_GR.300.a: "偏见之墙正在瓦解"

 
