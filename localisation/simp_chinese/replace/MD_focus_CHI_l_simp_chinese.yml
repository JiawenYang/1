 chi_crisis.6.a: "天哪……"
 chi_crisis.7: "我国进入战争状态"
 chi_crisis.7.t: "我国进入战争状态"
 chi_crisis.7.d: "随着我国与美国进入战争状态，我们不必再用和平的口号束缚自己，我们必须赢得这场战争！"
 chi_crisis.7.a: "中国必胜！"
 chinawar.1: "美国发起对我国的侵略战争"
 chinawar.1.t: "美国发起对我国的侵略战争"
 chinawar.1.d: "美国在失去其绝对霸主地位后，颜面尽失的[USA.GetLeader]总统越过国会审议，强行向我国发起了侵略战争，并与其所谓北约盟国建立了“联合国军”向我国开进。党和国家到了最危急的时刻，我们必须打赢这场卫国战争！"
 chinawar.1.a: "首战即决战，一战定乾坤！"
 #chi_crisis.100: "西方受到冲击"
 chi_crisis.20.t: "我国遭受严重沙尘暴"
 chi_crisis.20.d: "近期多地发生了一场极具有破坏性的严重沙尘暴，其成因据推测是蒙古地区逐步恶化的自然环境所致。"
 chi_crisis.20.a: "自然之力..."
 chi_crisis.100.t: "世界各国受到金融海啸冲击"
 chi_crisis.100.d: "受美国引起的全球金融危机影响，全球资金链条急速缩紧，融资成本大幅上升，企业生产大幅放缓，世界实体经济遭受严重冲击。以日、英、法等为代表的发达国家股市均大幅跳水，三日内跌停股票数量超过七成。以消费品或资源出口为主要外贸内容的发展中国家也因此受到牵连。印度、俄罗斯等国已宣布出口关税减免政策，但效果欠佳。"
 chi_crisis.100.a: "全球经济完蛋了？"
 chi_crisis.201.t: "世界经济受到冲击"
 chi_crisis.201.d: "在某次看似平常的交易之中，却偶然地似的所积累的系统性风险在此刻爆发，世界经济不可避免地面临一部分冲击..."
 chi_crisis.201.a: "时运不济..."
 chi_crisis.202.t: "世界经济衰败"
 chi_crisis.202.d: "负债比、杠杆率、坏账率...有意无意被无视问题一个接着一个。而在此刻，人们才又一次认识到它们对于经济冲击的威力。而很明显这显然不会是最后一次..."
 chi_crisis.202.a: "时运不济..."
#事件
 chi.1: "中国共产党第十六次全国代表大会召开"
 chi.1.t: "中国共产党第十六次全国代表大会召开"
 chi.1.d: "中国共产党第十六次全国代表大会于2002年11月8日至14日在北京召开。这次大会应到正式代表2114名、特邀代表40名，代表了全党6600多万党员。\n\n根据中央规定，出席中国共产党第十六次全国代表大会的代表团增加了中央企业系统代表团和中央金融系统代表团，这是中央企业系统和中央金融系统首次单独组团参加党的全国代表大会。与十五大的36个代表团相比，十六大的代表团增加到38个。\n\n此外，不是十六大代表的十五届中央委员会委员、候补委员和中央纪律检查委员会委员；不是十六大代表、特邀代表的原中央顾问委员会委员；不是十六大代表、特邀代表的党内部分老同志，以及其他有关同志，共284人列席了这次大会。大会还邀请了担任全国人大常委会副委员长、全国政协副主席的党外人士，担任过国家副主席、全国人大常委会副委员长、全国政协副主席的党外人士，各民主党派中央、全国工商联负责人和无党派人士，以及全国人大、全国政协常委中在京的党外人士和部分少数民族、宗教界人士等，共152人作为来宾列席大会开幕式和闭幕式。\n\n这次大会的主题是：高举邓小平理论伟大旗帜，全面贯彻“三个代表”重要思想，继往开来，与时俱进，全面建设小康社会，加快推进社会主义现代化，为开创中国特色社会主义事业新局面而奋斗。"
 chi.1.a: "鼓掌"
 chi.2: "大会选举产生第十六届中央委员会委员"
 chi.2.t: "大会选举产生第十六届中央委员会委员"
 chi.2.d: "中国共产党第十六次全国代表大会选举产生了中央委员会和中央纪律检查委员会。一批德才兼备、年富力强的领导干部进入新一届中央委员会，充分反映了我们党兴旺发达，后继有人。为了推进党的领导层的新老交替，为了党和国家的长治久安和永葆生机，一批担任中央领导职务、为党的事业作出重大贡献的同志退出了中央委员会，表现了对党的事业无比忠诚的高风亮节和远见卓识。\n\n经中央委员会全体会议选举，中央政治局常务委员会委员胡锦涛同志选举成为中国共产党中央委员会总书记。中共中央总书记的职位，已经由江泽民同志转移到胡锦涛同志身上了，对于决定其担任国家主席的全国人民代表大会将在几个月后召开。"
 chi.2.a: "鼓掌" #紧密团结在以胡锦涛同志为总书记的党中央周围！
 chi.10: "中国共产党第十八次全国代表大会召开"
 chi.10.t: "中国共产党第十八次全国代表大会召开"
 chi.10.d: "中华人民共和国第十八届全国人民代表大会于2013年3月5日召开。第一次会议议程上选举了中华人民共和国主席为中央委员会总书记习近平，并决定了决定国务院总理的人选即李克强。这标志着中国的领导权正式转交于由习近平所代表的新一代领导集团。\n\n前总书记胡锦涛在本次领导换届中一次性辞去了所有的职务，开创了前所未有的作风。习近平在讲话中对此举表达敬意，称胡锦涛等同志带头退出党中央领导岗位体现了崇高品德和高风亮节。"
 chi.10.a: "鼓掌"
 chi_sapce.1.t: "“神舟”五号载人飞船"
 chi_sapce.1.d: "2003年10月15日9时整，我国自行研制的“神舟”五号载人飞船在中国酒泉卫星发射中心发射升空。9时9分50秒，“神舟”五号准确进入预定轨道。这是中国首次进行载人航天飞行。乘坐“神舟”五号载人飞船执行任务的航天员是38岁的杨利伟。他是我国自己培养的第一代航天员。在太空中围绕地球飞行14圈，经过21小时23分、60万公里的安全飞行后，他于次日6时23分在内蒙古主着陆场成功着陆返回。"
 chi_sapce.1.o1: "“我感觉良好。”"
 chi_millennium.2: "江主席在联合国上的发言"
 chi_millennium.2.t: "江主席在联合国上的发言"
 chi_millennium.2.d: "主席先生：\n\n当此世纪更替、千年交接之际，世界各国领导人集聚联合国大厦，共同探讨关系人类发展前途的重大问题，以推进世界和平与发展的崇高事业。此时此刻，一切爱好和平和憧憬幸福的人民，都在把关切的目光投向这里。\n人类在以往的千年和二十世纪中，经历了惨烈的劫难和灾祸，也进行了伟大的斗争和创造，终于赢得了物质文明和精神文明的辉煌成就。\n在二十一世纪和新的千年中，人类必然会遇到难以预料的挑战和考验，也必然会实现新的历史巨变和飞跃。各国人民所期待的持久和平和共同繁荣的前景将是光明的。\n延续近半个世纪的冷战已经结束，国际局势总体上趋于缓和，世界多极化和经济全球化的趋势正在迅速发展，以信息科技和生命科技为核心的现代科学技术突飞猛进，人类面对着难得的发展机遇。追求和平与发展是世界各国人民的共同愿望，也是我们这个时代的主题。但是，不公正不合理的国际政治经济旧秩序还未得到根本改变，要解决和平与发展这两大战略性问题，建立公正合理的国际政治经济新秩序，仍然任重道远。\n现在，许多国家的人民还在遭受战争和动乱的苦难。霸权主义和强权政治仍然存在。由于民族、宗教、领土、资源等因素引发的局部冲突此起彼伏。各种分裂势力、恐怖势力和极端势力给国际社会不断带来危害。环境、毒品、难民等全球性问题日益突出。我们这个星球仍是很不稳定和安宁的。\n\n联合国的所有会员国和各国的政治家们，共同肩负着时代赋予的重要历史使命，这就是实现世界持久和平，促进各国共同发展和普遍繁荣。\n各国人民是有智慧的。今天，人类在科学的宏观方面已推进到一百八十亿光年之遥的宇宙，在科学的微观方面已初步揭示出基因的秘密。尽管世界上还有许多不如人意的地方，但各国人民一定能够不断丰富自己的知识，不断总结自己的实践经验，在处理人与自然、人与社会、民族与民族、国家与国家等关系中将会越来越理智。基于这一认识，我对新世纪、新千年世界发展的前景，充满着乐观。我深信，世界局势的演变和人类社会的发展，不管还会经历多少艰难曲折，终将走向更高的文明和更全面的进步。\n\n我呼吁：全世界爱好和平、向往进步的国家和人民携起手来，共同推动历史的车轮向着光明的目标前进！\n\n谢谢大家。"
 chi_millennium.2.a: "风度翩翩，谈吐恢弘！"
 chi_sars.1: "广东出现不明病毒"
 chi_sars.1.t: "广东出现不明病毒"
 chi_sars.1.d: "11月16日，广东人庞佐尧出现了发烧、头痛、干咳、乏力等症状，被紧急送进佛山石湾医院，9天后，被转入佛山市第一人民医院传染病科。12月5、6日的时候，在深圳打工的河源市人黄杏初感觉不舒服，就像是风寒感冒，于是到附近的诊所看病，医生说问题不大。到8日的时候，他感觉在诊所的治疗效果不好，就到了医院去打针，13日一直不好，就回到河源市，治疗几天，比在深圳时的症状又严重了一些，16日晚上10点多钟被送到河源市人民医院，第二天病情加剧，呼吸困难，被送到广州军区总医院。\n\n河源市政府已将有关情况报告省卫生厅和高层，不久后中山市同时出现了几起医护人员受到感染的病例。专家怀疑这是一种新型病毒，且传播力极强，传播途径不明。目前群众尚不明了其事态。"
 chi_sars.1.a: "马上派专门小组调查！"
 chi_sars.2: "SARS病毒感染者人数停止增长"
 chi_sars.2.t: "SARS病毒感染者人数停止增长"
 chi_sars.2.d: "2003年7月13日，全球非典患者人数、疑似病例人数均不再增长，本次非典过程基本结束。\n\n在党和国家的正确领导下，我们成功战胜了这次疫情！"
 chi_sars.2.a: "以后应该不会有了吧"
 chi_sars.6: "调查结果"
 chi_sars.6.t: "调查结果"
 chi_sars.6.d: "截止到2003年2月9日，广州市已经有一百多例相关病例，其中有不少是医护人员，在广州市发现的该类病例中共有2例死亡。我们已经派出由马晓伟副部长率领的专家组于2月9日下午飞抵广州协助查找病因，指导防治工作。马晓伟到达后，发现当地出现熏白醋、喝板蓝根能预防怪病的传言。10日，抢购风达到高潮。平时一大包10元以下的板蓝根一下子飙升到三四十元，白醋价格也节节攀升，从10元至80元、100元。\n\n2月11日上午，广州市政府召开新闻发布会公布广州地区非典型肺炎情况，称所有病人的病情均已处于控制当中。广州市政府强调，对于广州的千万人口来说，300多人染病是个很小的比例，非典型肺炎只是局部发生，河源中山等市已无新发病例报告。还解释了2月前前阶段没有公布情况的原因是：河源中山等地的患者经过治疗大多已康复或好转没有再发病，非典型肺炎并不是法定报告传染病，而发病人数305例并不算多。负责人强调会按传染病法公布疫情公告。\n\n2月12日，中国疾病预防控制中心负责人在接受记者采访时预测，全国近期内不会发生大范围呼吸道传染病的流行，但局部地区可能会出现小范围呼吸道传染病的流行。"
 chi_sars.6.a: "看来应该问题不大，封锁消息就行" 
 chi_sars.6.b: "胡扯，这分明是传染力极强的流感病毒！立刻公布消息，严查隐瞒事实的人！"
 chi_sars.101.t: "德特里克堡生物基地被关闭"
 chi_sars.101.d: "美军最大的生化武器研发中心——德特里克堡生物基地在近期被美国疾控中心调查并关闭。\n\n而在德特里克堡基地关闭不久附近地区暴发了莫名其妙的“电子烟疾病”，随后的流感季造成美国至少3200万人感染。"
 chi_sars.101.a: "上帝保佑我们" 
 chi_sars.101.b: "这会意味着什么？" 
 chi_sars.110.t: "武汉市发现新型病毒感染"
 chi_sars.110.d: "武汉市部分医疗机构陆续出现不明原因肺炎病人，其病例临床表现主要为发热，少数病人呼吸困难，胸片呈双肺浸润性病灶。\n\n武汉市持续开展流感及相关疾病监测，发现病毒性肺炎病例27例，均诊断为病毒性肺炎/肺部感染。"
 chi_sars.110.a: "对新疾病展开调查！" 
 chi_sars.110.c: "情况比我们所想象的还要严重" 
 chi_sars_110_c_tt: "§R新冠病毒的严重程度大幅度提升§!" 
 chi_sars.110.b: "病毒？哪有病毒？" 
 chi_sars_110_b_tt: "§Y这将会创造一个新冠病毒不存在的世界§!" 
 chi_sars.111.t: "$STATE_772$发现新型病毒感染"
 chi_sars.111.d: "$STATE_772$的卫生机构发现之前的“电子烟”病毒感染很大可能是新型冠状病毒感染，这意味着新冠在我国流行早已开始。"
 chi_sars.111.a: "这很不幸..." 
 chi_sars.115.t: "新型病毒感染"
 chi_sars.115.d: "$STATE_772$的卫生机构发现之前的“电子烟”病毒感染很大可能是新型冠状病毒感染，这意味着新冠在我国流行早已开始。"
 chi_sars.115.a: "这很不幸..." 
 chi_sars.120.t: "已发现境内新冠感染！"
 chi_sars.120.d: "[SARS_COV_2019_transmit_coefficient_target.GetName]的卫生机构在最近发现了当地存在的新冠病毒感染患者。\n\n这可能意味着新冠将会在我国流行。"
 chi_sars.120.a: "密切监视事态变化" 
 chi_sars.200.t: "新冠病毒发生变异"
 chi_sars.200.d: "由于[root.GetName]当地经济欠发达的现况，导致新冠病毒在[root.GetName]出现变异，新型变异毒株已经被发现开始广泛传染。"
 chi_sars.200.a: "这是个麻烦..." 
 chi_sars.210.t: "民众支持$SARS_COV_2019_category_lockdown$"
 chi_sars.210.d: "近期施行的$SARS_COV_2019_category_lockdown$政策受到欢迎，许多民众自发做好防护并保持社交距离。我们预计这一变动会让新冠病毒传染更加困难。"
 chi_sars.210.a: "非常好！" 
 chi_sars.211.t: "民众反对$SARS_COV_2019_category_lockdown$"
 chi_sars.211.d: "近期施行的$SARS_COV_2019_category_lockdown$政策受众多民众批评与反对，反对者表示这是在剥夺他们生存下去的权利，“感染病毒我们不会立刻死亡，但不能工作则会马上饿死”，缺乏民众配合将导致我们的$SARS_COV_2019_category_lockdown$政策效果大打折扣。我们预计这一变动会让新冠病毒传染更加容易。"
 chi_sars.211.a: "这是个麻烦..." 
 chi_sars.350.t: "世界经济受疫情冲击"
 chi_sars.350.d: "随着新冠病毒疫情的愈发严重，各地的生产与贸易在事实上受到了巨大影响，世界经济不可避免地受到冲击。"
 chi_sars.350.a: "但愿新冠疫情快点结束。" 
 chi_sars.401.t: "世卫组织宣布新冠时代结束"
 chi_sars.401.d: "世界卫生组织国际卫生条例突发事件委员会于日内瓦时间[?global.date.GetDateString]召开了关于新冠疫情的第15次会议，专家组成员向总干事建议宣布新冠疫情作为“国际关注的突发公共卫生事件”的结束，总干事谭德塞接受了建议。\n\n世界卫生组织总干事谭德塞表示，“我满怀希望地宣布，新冠疫情作为全球卫生紧急事件的时代已经结束，但这并不意味着新冠疫情作为全球健康威胁的结束。”"
 chi_sars.401.a: "后疫情时代的到来" 
 chi_GRnews.1: "超级女声"
 chi_GRnews.1.t: "《2004超级女声》开始海选"
 chi_GRnews.1.d: "本月，湖南卫视推出了一个叫《2004超级女声》的电视节目，与常见的歌手大赛不同的是，该活动标榜自身是“不论年龄、不问地域、不拘外貌”的“无门槛”音乐选秀活动。该节目讲求一种快乐感觉，希望以这种毫无门槛、大众均可参与的音乐赛事，来张扬一种“全民快乐”的感觉。这种“无门槛”选秀活动倡导的是“以唱为本”，选拔的是女性歌手的声音魅力，因此选手的年龄、外貌、地域等因素都可以抛在一边。只要有美丽原声，都可免费参加此次比赛，通俗的，民乐的，美声的，不拘一格的唱法，一样评选出最真实的声音。\n\n2004年5月10日，湖南唱区举行“20强进10强”比赛，产生湖南唱区十强。其他赛区随后开展海选。"
 chi_GRnews.1.a: "歌声动听的女孩儿们"
 chi_GRnews.2: "超级女声结束"
 chi_GRnews.2.t: "《超级女声》冠军角逐"
 chi_GRnews.2.d: "8月14日，经过数个月的海选、甄选和决赛，节目最终依据场外投票数产生了“年度全国冠军” 安又琪、“年度全国亚军” 王媞、“年度全国季军” 张含韵。年度全国第四名至第八名分别是：Strings、孙一卜、陈文娅、杨暘、张玥。\n\n本次电视节目吸引了全中国的观众，尤其是年轻女性，许多女生前往各赛区踊跃参加评选。湖南卫视在娱乐领域的影响力空前提高。"
 chi_GRnews.2.a: "不错"
 chi_GRnews.3: "超级女声"
 chi_GRnews.3.t: "《2005超级女声》开始海选"
 chi_GRnews.3.d: "在去年获得巨大成功后，湖南卫视于本月再次开始《超级女声》的海选，依然秉持前一年的节目宗旨，“不论年龄、不问地域、不拘外貌”，参赛者以歌喉取胜。\n\n全国各地的女生早已悉知节目开始时间，3月以来已陆续有许多人提前去到赛区等候海选。2005年5月1日，长沙唱区举行“20强进10强”比赛，产生长沙唱区十强。其他赛区随后开展海选。"
 chi_GRnews.3.a: "人更多了！"
 chi_GRnews.4: "超级女声结束"
 chi_GRnews.4.t: "《超级女声》冠军角逐"
 chi_GRnews.4.d: "经过数个月的海选，湖南卫视于2005年7月15日起每周五20:30在湖南卫视平台直播《2005超级女声》全国总决赛阶段的比赛。节目最终依据场外投票数产生了“年度全国冠军” 李宇春、“年度全国亚军” 周笔畅、“年度全国季军” 张靓颖。年度全国第四名至第十名分别是：何洁、纪敏佳、黄雅莉、叶一茜、易慧、赵静怡、朱妍。\n\n本次节目收视率再创新高，李宇春、周笔畅二人火遍全国，影响力甚至遍及海外。2005年10月，“年度全国冠军”李宇春作为“25位年度亚洲英雄人物之一”登上美国时事性周刊《TIME（亚洲版）》的封面。本年湖南卫视在举办《2005超级女声》的过程中，通过冠名收入和总决赛广告插播收入等方式获得了超过1亿元的营收。"
 chi_GRnews.4.a: "我们爱春哥！"
 chi_GRnews.5: "超级女声"
 chi_GRnews.5.t: "《2006超级女声》开始海选"
 chi_GRnews.5.d: "在连续两年取得巨大成功后，湖南卫视于本月在此开始《超级女声》的海选，依然秉持前一年的节目宗旨，“不论年龄、不问地域、不拘外貌”，参赛者以歌喉取胜。\n\n全国各地的女生早已悉知节目开始时间，4月以来已陆续有许多人提前去到赛区等候海选。2006年5月8日，长沙唱区举行“20强进10强”比赛，产生长沙唱区十强。其他赛区随后开展海选。"
 chi_GRnews.5.a: "人更多了！"
 chi_GRnews.6: "超级女声结束"
 chi_GRnews.6.t: "《超级女声》冠军角逐"
 chi_GRnews.6.d: "经过数个月的海选，湖南卫视于2005年8月15日起每周五20:30在湖南卫视平台直播《2006超级女声》全国总决赛阶段的比赛。节目最终依据场外投票数产生了“年度全国冠军” 尚雯婕、“年度全国亚军” 谭维维、“年度全国季军” 刘力扬。年度全国第四名至第十名分别是：艾梦萌、厉娜、许飞、韩真真、Reborn、唐笑、阳蕾。\n\n湖南卫视通过连续三年的全国海选，在全国范围内确立了对娱乐业的动员能力和影响力，从此奠定了最强综艺频道的地位。"
 chi_GRnews.6.a: "不错"
 chi_GRnews.7: "快乐大本营"
 chi_GRnews.7.t: "快乐大本营"
 chi_GRnews.7.d: "2004年，湖南卫视的综艺节目《快乐大本营》开始确立以阶段性活动为亮点，以普通观众为主角，淡化“大综艺”的明星套路，尝试“海选”、“真人秀”、“现场PK”等“泛娱乐化”的新概念。这是国内为数不多的娱乐综艺节目，且由于形式丰富、节目效果良好、娱乐性强等原因，快乐大本营迅速在全国家庭的电视机里频繁出现，为周六的晚上带来许多欢声笑语。"
 chi_GRnews.7.a: "不错"
 chi_GRnews.8: "爱情公寓"
 chi_GRnews.8.t: "《爱情公寓》开播"
 chi_GRnews.8.d: "8月5日，江西卫视播出了一部名为爱情公寓的电视剧。该剧讲述的是几个男女青年在国际大都市上海的一栋公寓中生活、奋斗和产生情谊的故事。该剧播出后不久即被观众质疑具有抄袭美剧《生活大爆炸》的嫌疑，但其幽默的剧情内容、波折的人际关系、无厘头的笑点等仍然博取了广大观众的眼球。\n\n部分评论家认为，好的剧情固然是该剧爆火的重要原因，但更为深刻的原因是，这部剧中人物的形象与背景与现实中快速城市化所推动产生的大量新城市青年们的生活贴合，这些青年对剧中人物能产生共情和向往，因此获得了不仅是城市青年的青睐，更收到即将进入城市的乡县男女青年们的追捧。"
 chi_GRnews.8.a: "不错"
 chi_GRnews.9: "大秦帝国之裂变"
 chi_GRnews.9.t: "《大秦帝国之裂变》开播"
 chi_GRnews.9.d: "本月18日，陕西、东南、河南、河北卫视同步播放了一部名为《大秦帝国之裂变》的历史电视剧，该剧是根据作家孙皓晖创作的同名小说《大秦帝国》改编而成，讲述了公元前的中国战国时期，一个法家法家学说的代表人商鞅，在面临亡国之危的秦国与国王秦孝公携手变革、推行法治，带领国家走向强盛的故事。该剧一经播出即大火，受到社会的广泛关注和讨论。\n\n观察家认为，该剧大火与现实背景密不可分。经过2008年经济危机的冲击后，社会各界都在讨论革新之道，中央政策也逐渐从“不折腾”的保守倾向转为“树新规”的革新色彩，该剧所蕴含的变革精神与现实中求变的氛围贴合甚为紧密。人们对商鞅“以身殉法”的行为印象深刻，对秦孝公法之必行的决心也多有赞赏。"
 chi_GRnews.9.a: "天下之事，不难于立法，而难于法之必行"
 chi_GRnews.10: "潜伏"
 chi_GRnews.10.t: "《潜伏》开播"
 chi_GRnews.10.d: "本月20日，南方电视台播出了一部叫做《潜伏》的历史电视剧，随后天津、山东、成都和黑龙江、东方、北京、重庆等卫视迅速跟进播出，开播首日北京卫视的收视率就达到了8.01%。该剧背景为1945年，正是抗日战争接近尾声之际，国、共、日三方的角力日趋激烈，平静的海面下暗流涌动。由于军统特务李海丰投靠南京汪伪政权，军统情报处成员余则成（孙红雷 饰）受命前往南京刺杀叛徒，却意外走上了另一条道路。经中共策反，余则成以地下党的身份重返军统，成为扎入国民党心脏的一颗铆钉。为了协助余的工作，党组织派出脾气火爆、口无遮拦的女孩翠平（姚晨 饰）担任余的冒牌夫人。随着时间的推移，国共的斗争愈加强烈，这对夫妇也面临着人生重大的考验。\n\n主演孙红雷和姚晨以杰出的演技深刻诠释了特殊历史时期的紧张氛围和波澜诡谲的时代潮流，剧情的节奏起伏也拿捏精准，该剧因此成为不少观众心目中的最佳谍战剧。"
 chi_GRnews.10.a: "向革命先辈致敬"
 chi_GRnews.11: "杀马特"
 chi_GRnews.11.t: "杀马特潮流"
 chi_GRnews.11.d: "从去年以来，全国各地陆陆续续出现了许多穿着“奇装异服”，头发妆容“光怪陆离”的人，这些人的特异共同特点已引起社会关注。这些团体在网络上组建起交际圈和对话渠道，自称“杀马特”或“葬爱家族”，彼此之间视作“家人”，时常成群结队以夸张的装扮形象出现在公开场合。\n\n据了解，“杀马特”群体多为进城打工的工人和部分在校学生，大部分是90后和85后，大部分是熟练的网民，喜欢自拍，QQ空间、贴吧、博客里有很多头发五颜六色的视频截图。这种风格是结合日本视觉系和欧美摇滚的结合体，且国内的杀马特群体喜欢并盲目模仿日本视觉系摇滚乐队的衣服、头发等等。原始的大部分杀马特都留着五颜六色的长发，画着很浓的妆；穿一些很个性的服装，戴着稀奇古怪的首饰；喜欢自拍，在网吧的摄像头前做些奇怪的动作；自称是“一个集潮流、视觉、杀马特为一系”的群体。\n\n中国的“杀马特”家族，已与摇滚一点关系也没有，只是喜欢模仿视觉系的服饰、化妆罢了；而真正视觉系的FANS们又不屑于与“杀马特”为伍。所以中国的“杀马特”演变，既不是VR，也不是纯粹的视觉系。而是一种独特的社会状态、一种生活形式和一股文化潮流。杀马特的起源于20世纪70年代的朋克（Punk）文化，它所代表的是一种另类甚至是怪诞的青年形象，这群另类青年正不停不断挑战大家的审美神经，他们被称为“杀马特家族”，并因为他们的特立独行而被看不惯的网友们称为“山寨系”，与“脑残”、“屌丝”划上等号，与脑残族并列。\n\n实际上，这一群体并没有做过什么违法乱纪伤天害理的事，观察家认为，这是中国迅速城市化背景下，新入城市人群陷入身份认知危机导致的一种标新立异的归属诉求，其起源、过程和结局都是被社会主流所排挤的悲剧。"
 chi_GRnews.11.a: "兂論伱恠那裡，唏望伱記住①直都侑嗰亽默默の関紸伱祝冨伱，唏望伱螚開吢快樂！"
 chi_GRnews.12: "家有儿女"
 chi_GRnews.12.t: "《家有儿女》开播"
 chi_GRnews.12.d: "本月12日，北京电视台播出了一部叫做《家有儿女》的家庭情景剧，讲述了两个离异家庭结合后发生在父母和三个孩子间的各种有趣故事。剧中父亲夏东海曾跟随前妻到美国陪读工作，离婚后带着7岁的儿子夏雨归国发展，并与在国内长大的女儿夏雪团聚，后与护士长刘梅结婚，刘梅也曾离异，并带有一子叫刘星。本剧的故事就发生在这个特殊家庭中，夏东海和刘梅的共同特点都是富有爱心，关心孩子的成长，期望“整合”两人的爱心和智慧，培养出快乐生活的下一代；而生活在同一屋檐下的姐弟仨，尽管血缘不同，年龄层次不同，倒也相处得犹如亲生一般。\n\n该剧因其贴近生活而受到观众喜爱，新闻媒体评论也对其赞赏有加。然而，有部分人认为该剧反映的“只是北京富有家庭的生活”，根本不能代表社会上的绝大多数普通家庭，普通人完全无法从中感觉到共情。"
 chi_GRnews.12.a: "“我想把这玩意儿染成绿的”"
 chi_GRnews.13: "穿越火线"
 chi_GRnews.13.t: "穿越火线正式发行！"
 chi_GRnews.13.d: "5月3日，腾讯发布了一款全新的第一人称设计游戏，名为《穿越火线》，由韩国团队Smile Gate开发，中国内地由腾讯游戏代理运营。游戏讲述了全球两大佣兵集团Global Risk和Black List间的对决。游戏中有团队竞技模式、战队赛、爆破模式、幽灵模式等多种模式，并首创引进了“缺人补充”形式的即时加入系统。\n\n此前中国的第一人称射击游戏市场主要由反恐精英（CS）占据，自穿越火线正式发布后，该游戏所占游戏市场份额不断上升，很快火遍全国，成为一款现象级游戏。在每个网吧，你都能看到有人在穿越火线种和队友并肩作战，并吸引一群同样沉迷CF的爱好者在后方旁观。这款游戏将在不久的将来成为中国最为流行的游戏之一。"
 chi_GRnews.13.a: "kkkkkkkkkkkkk房主快开啊！"
 chi_GRnews.14: "魔兽世界"
 chi_GRnews.14.t: "魔兽世界正式登录中国！"
 chi_GRnews.14.d: "6月6日，由暴雪游戏公司制作的游戏《魔兽世界》正式登陆中国发行了第一个国服版本。此前，中国玩家只能在外服游玩这款早已火遍全球的大型多人在线角色扮演游戏，如今中国玩家们不再需要忍受高延迟和难懂的英文界面，只需登录国服即可爽快游玩。\n\n《魔兽世界》对游戏界的重要性早已不言而喻，《龙腾世纪：起源》的首席设计师 Mike Laidlaw 认为，网游制作必须要考虑魔兽世界对玩家的影响，忽视魔兽世界在网游市场上的份额和影响力都是不明智的。就像《雷神之锤》为FPS游戏定下了基本构架一样，魔兽世界也为MMO游戏设定了最通行的用户界面。这款游戏即将在中国大陆上名声大噪，成为一代人的回忆。"
 chi_GRnews.14.a: "总有一天，我的生命将抵达终点，而你，将加冕为王"
 chi_GRnews.15: "QQ"
 chi_GRnews.15.t: "QQ"
 chi_GRnews.15.d: "“咳—咳咳”，今天又是哪位网友给你发QQ了呢？\n\n本月，由腾讯发行的即时通信软件QQ用户注册数突破2亿大关，成为中国乃至世界上使用人数最多的通信软件之一。从前需要用寻呼机和短信沟通的时代如今已经变化了，现在你只需在电脑上双击这只可爱的企鹅图标，即可登录QQ，向你需要对话的好友发送免费消息。与其相关的软件还有个人博客形式的QQ空间、QQ邮箱等，以其新颖、便捷、丰富的功能而受到网民们的青睐。"
 chi_GRnews.15.a: "雷猴啊，你是GG还是MM"
 chi_GRnews.16: "赵丽蓉去世"
 chi_GRnews.16.t: "著名演员赵丽蓉去世"
 chi_GRnews.16.d: "7月17日清晨7时30分，著名女演员赵丽蓉因肺癌逝世，享年72岁。\n\n人们对这位多次登上春晚舞台给全国人民带来欢声笑语的老艺术家保有深刻的感情。赵丽蓉一共参加了6届中央电视台的春节联欢晚会，每届她表演的小品都能把晚会的热烈气氛推向高潮。诸如小品《司马光砸缸》《唐山妈妈》《爱谁谁》《打工奇遇》《如此包装》等，深受观众的喜爱，有些小品是她和巩汉林共同创作的，小品里的一招一式，一字一句都融入了她的心血与汗水。这些小品不仅在国内广有影响而且声名远播海外，美国《星星早报》、英国《泰晤士报》、法国《华埠》杂志、俄罗斯《大文化报》对赵丽蓉的小品都有所评介与报道，称她为“写平民演平民来自于平民的搞笑女大师。”并誉以她很高的头衔，说她是“出生于燕赵大地与曹雪芹、邓丽君同属一个故乡的有灵气的乡土艺术家……”。"
 chi_GRnews.16.a: "宫廷玉液酒，一百八一杯！这酒怎么样？听我给你吹！"
 chi_GRnews.17: "JAY"
 chi_GRnews.17.t: "台湾歌手周杰伦首次发布个人专辑《Jay》！"
 chi_GRnews.17.d: "千禧年世纪更迭之际，R&B在华语乐坛逐日兴起，众多歌手共同推动着中文流行乐风的悄然改变。此时此刻，一张名为《Jay》的专辑也从台湾阿尔发唱片横空出世，那些在第一时间买下专辑的听众，有幸目睹了乐坛揭开“唱作新世代”的大幕。专辑中十首歌不落窠臼，诸多新鲜音乐元素和歌词主题，凸显出这位首发新人独特的个人印记。“周杰伦”这个名字也随着作品的新鲜感和冲击力，闯入了大众视线。整张专辑的曲风以R&B及New Hip-Hop为主，古典巴洛克式弦乐伴奏及Band的加入，形成了一种英国式的复古风格，更特别的是，西班牙式风格的弦乐演奏在专辑歌曲中表现出的意境极度逼近电影配乐。专辑里混杂的大量黑人音乐曲风撼动华语乐坛的主流基石，同时这是一张在旋律基础上加上节奏发动机的双核唱片，用节奏和旋律重新校准了一首现代歌曲的平衡，让人有种比较新鲜和丰富的个性魅力。\n\n其中的主打歌曲《星晴》获得第24届十大中文金曲优秀国语歌曲金奖，而他也凭借该专辑在华语乐坛受到关注，并在次年举办的第12届台湾金曲奖颁奖典礼上凭借该专辑获得最佳流行音乐演唱专辑奖、入围最佳制作人奖，凭借专辑中的歌曲《可爱女人》提名第12届台湾金曲奖最佳作曲人奖。这位青年歌手的未来无比宽阔。"
 chi_GRnews.17.a: "哎呦，不错哦"
 chi_GRnews.18: "樱桃小丸子"
 chi_GRnews.18.t: "广东电视台播出《樱桃小丸子》！"
 chi_GRnews.18.d: "本月，广东电视台首次在中国大陆地区播出日本动漫《樱桃小丸子》。《樱桃小丸子》是日本动画公司制作的电视动画。其动画连续二十余年高居日本动画收视率前三位，于每周日黄金时段下午六点在日本富士电视台上进行连载热播，是日本男女老少心中的国民动画。本作品是以作者的童年生活为蓝本，故事围绕着小丸子以及其家人和同学展开，有关于亲情、友谊，或是一些生活小事，其中有笑有泪，令人回想起童年的稚气。动画版樱桃小丸子的播出，让小丸子走出日本，登陆中国、韩国、泰国等亚洲国家，并掀起收视和周边产品收藏热潮。其中，台湾版配音特别又有趣，也让小丸子成为大陆小朋友乃至成人都分外追捧的动漫人物。2010年时，小丸子原版动画仍以每年制作150集的进度持续连载，在日本享有阳光漫画和长寿漫画的美誉。"
 chi_GRnews.18.a: "“其实所谓的的人生，就是充满了这么多无聊的事情嘛”"
 chi_GRnews.19: "蜡笔小新"
 chi_GRnews.19.t: "《蜡笔小新》光碟正式引进中国！"
 chi_GRnews.19.d: "本月，日本人气家庭搞笑动画片《蜡笔小新》正式登录中国大陆，以光碟形式发售。该片根据日本漫画家臼井仪人所创作的同名漫画作品《蜡笔小新》改编而成，叙述了日本5岁小男孩野原新之助，在日常生活中与家人、老师、同学、邻居、路人等之间所发生的故事。\n\n《蜡笔小新》在日本及周边国家和地区迅速窜红不是偶然，其中一个重要的因素，就是通过一个不安世事的小孩不寻常的言行，说出了成人的想说却不敢说的话，做出了成人们想做却不敢做的事，释放了成人们的压力的心理活动，拨动了成年人渴望回归童年，回归自然，回归真实的心弦，引起了大多数观众的强烈共鸣。《蜡笔小新》不仅仅是一个动漫作品，而是一种文化现象，小新也不局限于剧中的角色，而是一个群体的思维。这种现象后面隐藏着该动漫片所折射出来的能够唤起大家共鸣的复杂成人心态至少包括：面对现实生活的深刻无奈、面对杂种文化呈现反传统思维、对他人习惯性，自私，虚伪与狡辩、直面隔代直系溺爱，影响未成年人教育的无助。\n\n然而，这部优秀的日本动漫同样夹杂了大量庸俗、低级的内容，因此在国内爆火后受到了部分人士的批评。2004年8月，国家广电总局发出《关于山东德州电视台违规播出境外动画片的通报》，《通报》指出山东德州电视台利用电话互动点播方式，在图文频道播放未经批准引进的日本动画片《蜡笔小新》，该片内容低级庸俗，不利于未成年人身心健康成长"
 chi_GRnews.19.a: "“大象大象，你的鼻子为什么那么长~”"
 chi_GRnews.20: "名侦探柯南"
 chi_GRnews.20.t: "《名侦探柯南》大火！"
 chi_GRnews.20.d: "“俺は江戸川コナン、探偵さ（我叫江户川柯南，是个侦探）”\n\n身着蓝色西服和红色蝴蝶结，头戴大框眼镜的日本小男孩形象已深入国内群众人心。这是日本动漫《名侦探柯南》中主人公柯南的经典台词。1999年，《名侦探柯南》登陆中国教育电视台和辽宁教育电视台。当时播放的前105集《名侦探柯南》采用台版汉语配音。该片长期在中国各卫视频道和少儿频道进行反复播放。2003年，《名侦探柯南》以9.54%的收视率排名上海电视台的全年第六，成为第一部挤进中国电视收视率前十名的动画片。上海炫动卡通卫视开播后曾将该片作为“时尚成人动画”安排在20时～21时30分播出，在同时段黄金电视剧的包围下，仍然形成晚间的收视高峰。2010年，该片排在当年动画片播出时长进口片第一位（总第四位），共103646分钟；同年在浙江卫视播出的动画片中，《名侦探柯南》占到了最高收视率。\n\n在江苏省消费者权益保护委员会于2020年12月至2021年3月开展的“动画领域侵害未成年人成长安全消费调查”项目中，针对“您的小孩平时喜欢看哪部动画片”，有1325名受访者勾选了“名侦探柯南”，占比30.33%。但《动画领域侵害未成年人成长安全消费调查报告》也指出该片在一定程度上存在暴力犯罪元素、阴暗黑化元素等。"
 chi_GRnews.20.a: "真実はいつも一つ！（真相永远只有一个！）"
 chi_GRnews.21: "龙珠"
 chi_GRnews.21.t: "《龙珠》大火！"
 chi_GRnews.21.d: "“很久很久以前流传着一个古老传说，这世上存在着七颗名为龙珠的圆球散落各处，只要集齐七颗龙珠并念出咒文，便可召唤出神龙，无论任何愿望都可替许愿人达成。”\n\n作为日漫的代表作品之一，鸟山明的《龙珠》绝对承载了无数人童年的记忆。自1984年诞生以来的30年间，《龙珠》一直保持着超高的人气，这部经典之作似乎已成为日漫作品的一个符号。《龙珠》初期的冒险剧情并没有如预料一样受到欢迎，一度人气下滑到了十几位的危险边缘。这个时候编辑鸟岛和彦再度站了出来，认为应该在作品中增加“追求力量”的主题，于是出现了天下第一武道会，果然这之后人气就急速上升，配合动画的播出更是水涨船高，从1987年开始《龙珠》就再度夺回了杂志的头号王牌位置，并一直把这个地位保持到它完结为止。\n\n《龙珠》引进中国大陆后，和其他热门动漫一样，迅速成为了人气火爆的现象级动漫。人们对主角“孙悟空”感到既熟悉又陌生，充满异域情调的故事也因为中日两国共同的文化认知而让中国观众感到一丝熟悉与慰藉。"
 chi_GRnews.21.a: "“喂！她说后会有期，就是还有希望啊！”"
 chi_GRnews.22: "火影忍者"
 chi_GRnews.22.t: "《火影忍者》大火！"
 chi_GRnews.22.d: "本月4日，星空卫视播出日本动漫《火影忍者》，收视率反馈大好。《火影忍者》是改编自日本漫画家岸本齐史创作的同名漫画的长篇电视动画，2002年10月3日在东京电视台系列全6局、岐阜放送首播，共220话。故事成功地将原本隐藏在黑暗中，用世界上最强大的毅力和最艰辛的努力去做最密不可宣和隐讳残酷的事情的忍者，描绘成了太阳下最值得骄傲最光明无限的职业。故事背景设定在一个忍者的世界，故事从主人公漩涡鸣人的孤儿生活开始，四代火影为了保护村子，将攻击村子九尾妖狐封印到了他体内，鸣人因此受尽了村人的冷落，只是拼命用各种恶作剧试图吸引大家的注意力。好在还是有伊鲁卡老师的关心，鸣人的性格才没有变得扭曲，他总是干劲十足、非常乐观。为了让更多的人认可自己，鸣人的目标是成为火影。整个故事就围绕鸣人的奋斗、成长，鸣人的伙伴们，以及这个忍者世界的各种争斗和阴谋展开。\n\n《火影忍者》中充斥着大量日本元素，如忍者、忍术、印记等，为中国人民了解日本文化提供了一个十分有趣的渠道。"
 chi_GRnews.22.a: "“人的命运是像云彩一样只能随风漂流，还是说云彩它自己选择了方向？”"
 chi_GRnews.23: "海贼王"
 chi_GRnews.23.t: "《海贼王》开播！"
 chi_GRnews.23.d: "本月，星空卫视播出日本动漫《海贼王》，迅速爆火。《海贼王》是日本漫画家尾田荣一郎作画的少年漫画作品，于1997年07月22日在集英社《周刊少年Jump》开始连载。改编的电视动画《航海王》于1999年10月20日起在富士电视台首播，如今在中国大陆地区正式播放。\n\n海贼王哥尔·D·罗杰在临死前曾留下了关于其毕生的财富“One Piece”的消息，由此引得群雄并起，众海贼们为了这笔传说中的巨额财富展开争夺，各种势力、政权不断交替，整个世界进入了动荡混乱的“大海贼时代”。生长在东海风车村的路飞受到海贼香克斯的影响，决定成为一名出色的海贼，最终成为海贼王。为了达成这个目标，并找到万众瞩目的One Piece，路飞开始了寻找One Piece的大冒险。"
 chi_GRnews.23.a: "“海贼王になる男だ！（我是要成为海贼王的男人！）”"
 chi_GRnews.24: "弹珠警察"
 chi_GRnews.24.t: "《弹珠警察》大火！"
 chi_GRnews.24.d: "本年引入的日本动漫《弹珠警察》在观众中广受好评。\n\n《弹珠警察》（Bビ–ダマン爆外伝），由名古屋テレビ制作的机器人动画，两部共50集。于1999年2月7日-2000年1月30日在日本朝日电视台播出。故事内容为1000年前被7名拥有“星宿能量”的勇士打败的黑暗皇帝在1000年后的九大行星直列之时再一次开始了消灭太阳系的恐怖计划。少年白宝是弹珠市的一个阳光少年，因一次宠物鸟·风之羽的淘气，不小心撞到了灰宝博士的搬家用飞行器。并得知黑暗皇帝与黑暗弹珠人的事情。心怀正义感的他为了保护大家的世界，与红宝、蓝宝、黄宝、黑宝等人一起开始了一场正义的战斗。\n\n在2004年全国电视台播放动画时长前15名的统计中，弹珠警察以91小时的成绩排名第三，仅次于《蓝猫淘气三千问》和《名侦探柯南》。"
 chi_GRnews.24.a: "好看"
 chi_GRnews.25: "四驱兄弟"
 chi_GRnews.25.t: "《四驱兄弟》广受好评！"
 chi_GRnews.25.d: "日本动漫《四驱兄弟》在国内收获无数人气，并掀起了一股“赛车热”，许多孩子和青少年都追求更快、更强的迷你赛车，因此带动了玩具赛车产业的蓬勃发展。"
 chi_GRnews.25.a: "Let's Go！"
 chi_GRnews.26: "哆啦A梦"
 chi_GRnews.26.t: "《哆啦A梦》广受好评！"
 chi_GRnews.26.d: "“每天过得都一样，偶尔会突发奇想，只要有了多啦a梦欢笑就无限延长~”圆圆的蓝色机器猫已经成为许多中国孩子们心目中的最好伴侣。日本动漫《哆啦A梦》已成为中国孩子们熟知的文化形象，漫画叙述了一只来自22世纪的猫型机器人——哆啦A梦，受主人野比世修的托付，回到20世纪，借助从四次元口袋里拿出来的各种未来道具，来帮助世修的高祖父——小学生野比大雄化解身边的种种困难问题，以及生活中和妈妈野比玉子、身边的小伙伴静香、胖虎、小夫发生的轻松幽默、搞笑、感人的故事。\n\n哆啦A梦以其优秀的剧情、精美的制作、感人的情节斩获无数观众的喜爱，蓝色机器猫的形象也成为世界上最为人所知的日本元素之一。"
 chi_GRnews.26.a: "我们都喜欢哆啦A梦！"
 chi_GRnews.27: "铁臂阿童木"
 chi_GRnews.27.t: "《铁臂阿童木》广受好评！"
 chi_GRnews.27.d: "日本动漫《铁臂阿童木》正在国内大火！《铁臂阿童木》是日本漫画家手冢治虫创作的科幻漫画作品，于1952年4月至1968年3月于“光文社”的《少年》漫画杂志连载。该作品讲述了在未来21世纪的少年机器人阿童木的故事。该作品先后多次被改编为动画，其中1963版第1版电视动画是日本第一部电视连续动画，也是中国大陆引进的第1部国外系列动画片。1951年4月，《阿童木大使》开始连载，首次登场他还是作为配角，次年4月份，《铁臂阿童木》在《少年》漫画杂志开始连载。《铁臂阿童木》刚问世时，轰动了日本。这个聪明、勇敢、正义的小机器娃娃几乎是人见人爱。"
 chi_GRnews.27.a: "“只有人类独自繁荣的世界总有一天会没落的”"
 chi_GRnews.28: "蓝猫淘气三千问"
 chi_GRnews.28.t: "《蓝猫淘气3000问》广受好评！"
 chi_GRnews.28.d: "“星星眨着眼，月儿划问号，彗星拖着长长的尾巴，彩虹来架桥。”\n\n本月10日，CCTV-7播放了一部由湖南蓝猫卡通传媒有限公司制作的动画片《蓝猫淘气3000问》，由导演王宏执导。系列片中大量采用3D仿真数码等高科技精心制作的场景，集中展现了浩瀚无垠的宇宙星空，神奇变幻的天体运行和各种高科技武器的魔幻演示，给观众带来了无与伦比的视觉冲击力，令人心灵震颤，畅快淋漓，将观众带入一个梦幻般的科幻世界。这是中国第一部大型科普动画系列故事片，它以“知识卡通”的艺术创意走出了自己的道路。它透过主角“蓝猫”和伙伴们的历险过程，利用其遇到的问题，向小朋友提供宇宙星空、生态环境、人文历史、生物百观等方面的知识，既有人类几千年灿烂文化的结晶，又有当代高新科技知识的概览，是知识经济时代电子版的青少年百科全书。"
 chi_GRnews.28.a: "噢 只要你爱想爱问爱动脑，天地间奇妙的问题你全明了"
 chi_GRnews.29: "迪迦奥特曼"
 chi_GRnews.29.t: "《迪迦奥特曼》收视火爆！"
 chi_GRnews.29.d: "《迪迦奥特曼》是由日本圆谷株式会社制作，右田昌万编剧，村石宏实执导，由长野博、吉本多香美、高树零等人主演的特摄片，也是平成系奥特曼”系列首作。迪迦奥特曼在国内的火爆程度远超任何一方的预想，评论家认为，迪迦奥特曼的成功在于其爱与和平、人与自然和谐共生的内在宗旨切合中国人民的心声，迪迦伟岸而强大的力量从不用于欺压弱小而是用以保护弱小的价值观也十分符合中国社会的价值观。\n\n无论如何，迪迦奥特曼已经成为许多中国孩子心目中的英雄和目标，该片也是中国最具人气的日本特摄片。"
 chi_GRnews.29.a: "“我们都会变成光！”"
 chi_GRnews.30: "魔卡少女樱"
 chi_GRnews.30.t: "《百变小樱》火热播出！"
 chi_GRnews.30.d: "10月，上海电视台首播《百变小樱》，该片由广东百视联影业发展有限公司引进。木之本樱，是擅长体育的小学4年级学生。某天，小樱从学校回家，在平常都没有人的地下书房发现似乎有什么人的样子。小樱走下去一看，那里有一本闪耀着金色光芒的书。里面装有牌，然而，在读写在上面的文字的时候，刮来了剧烈的风，牌四处飞散开去。从书的最后，出现了名为可鲁贝洛斯的奇妙生物，书中写着“库洛牌的封印被解开之时，灾难就会降临世间”之类的话。随后，可鲁贝洛斯将封印的钥匙交给了小樱，令她成为收复卡片的魔卡捕获者。当晚，小樱用魔法与实体化的卡片对决……\n\n受当时的社会环境影响，电视台播出的版本中，作品的恋爱情节表现有所限制，此外，中配版中李小狼的名字被修改为“王小明”，第2集等有幽灵恐怖元素的内容在电视台播出时也被删除。“镜”与桃矢一起买东西的情节等内容由于与主线剧情无关，在电视播出版本中也被删除。无论如何，这部动漫广受孩子和青少年的好评。"
 chi_GRnews.30.a: "现在以你的主人，小樱之名命令你——封印解除！"
 chi_GRnews.31: "灌篮高手"
 chi_GRnews.31.t: "《灌篮高手》大火！"
 chi_GRnews.31.d: "日本漫画家井上雄彦创作的篮球为题材少年漫画《灌篮高手》正在国内人气火爆。故事内容为在初中时期被50名女学生甩过的红发不良少年樱木花道升入湘北高中之后，对偶然间认识的同年级女生赤木晴子一见钟情。在晴子的期待下，对篮球规则一窍不通的花道加入到篮球队。在晴子的哥哥——篮球队队长赤木刚宪的严格训练以及对“超级新人”流川枫燃起的对抗意识的驱使下，花道身体中潜藏的才能终于得以显现，同时，他也被篮球这项运动的魅力所征服。在和强劲的对手陵南高中的练习比赛之后，身材矮小却有着灵活运动能力的宫城良太以及曾经在初中时期获得县MVP称号的三井寿也回归球队。实力大幅提升的湘北高中篮球队开始为全国高中联赛神奈川县预选赛进行准备。就这样，以樱木花道为首的湘北高中篮球队迎来了他们人生中最为炽热的一个夏天。\n\n该漫画以其正派作风、运动精神、精细作画而广受好评，也在我国青少年中掀起一股篮球热。"
 chi_GRnews.31.a: "“教练，我想打篮球”"
 chi_GRnews.32: "机动战士高达"
 chi_GRnews.32.t: "《机动战士高达00》人气火爆！"
 chi_GRnews.32.d: "本月6日，日本播出《机动战士高达00》，延续了一贯的精美画风和热血战斗，也延续了在中国的狂热粉丝追求。"
 chi_GRnews.32.a: "“俺はガンダムで行く！（我将以高达形态出击！）”"
 chi_GRnews.33: "游戏王"
 chi_GRnews.33.t: "游戏王风潮"
 chi_GRnews.33.d: "日本的一种卡牌游戏《游戏王》正在我国迅速传播。\n\n《游戏王》是由日本漫画家高桥和希作画的漫画，并且依此为改编电视动画与游戏。游戏的历史，可以追溯到五千年以前的古代埃及时期。古代的游戏，用来预言人类和法老王的未来，是决定命运的魔法般的仪式。那些被称为黑暗游戏。然而，有名少年完成了“千年积木”，接受黑暗游戏，成为正义的化身。光和暗，拥有两个心灵的少年的名字，人称“游戏王”。1998年，Bandai推出以《游戏王》原作中登场的集换卡牌游戏为题材的集换卡牌，后来很快风靡全球，包括我国。"
 chi_GRnews.33.a: "你也是牌佬？"
 chi_GRnews.34: "第十个五年计划"
 chi_GRnews.34.t: "第十个五年计划启动！"
 chi_GRnews.34.d: "经过党中央、国务院的详细制定和批准，我国社会各界开始进入第十个五年计划。"
 chi_GRnews.34.a: "全速前进！"
 chi_GRnews.35: "第十一个五年规划"
 chi_GRnews.35.t: "第十一个五年规划启动"
 chi_GRnews.35.d: "经过党中央、国务院的详细制定和批准，我国社会各界开始进入第十一个五年规划。"
 chi_GRnews.35.a: "全速前进！"
 chi_GRnews.36: "第十二个五年规划"
 chi_GRnews.36.t: "第十二个五年规划启动"
 chi_GRnews.36.d: "经过党中央、国务院的详细制定和批准，我国社会各界开始进入第十二个五年规划。"
 chi_GRnews.36.a: "全速前进！"
 chi_GRnews.37: "第十三个五年规划"
 chi_GRnews.37.t: "第十三个五年规划启动"
 chi_GRnews.37.d: "经过党中央、国务院的详细制定和批准，我国社会各界开始进入第十三个五年规划。"
 chi_GRnews.37.a: "全速前进！"
 chi_GRnews.38: "中华人民共和国国庆节"
 chi_GRnews.38.t: "中华人民共和国国庆节"
 chi_GRnews.38.d: "1949年10月1日，伟大的毛泽东主席向世界庄严宣告中华人民共和国成立，中央人民政府成立。\n\n中国每逢国庆佳节，全国民众和各企事业单位都会挂起灯笼或横幅，用“欢度国庆”等标语来庆祝国庆；广场上则摆放着标语字样的盆景和氢气球，用欢乐的气氛来迎接国庆。国庆节当天，中华人民共和国国旗升旗时间为6时10分，与日出时间一致。\n\n伟大的祖国母亲自诞生后已经度过数十载春秋，并将继续傲立于世界舞台。"
 chi_GRnews.38.a: "中华人民共和国万岁"
 chi_GRnews.39: "毛泽东诞辰"
 chi_GRnews.39.t: "毛泽东诞辰"
 chi_GRnews.39.d: "1893年12月26日是毛泽东主席的诞辰，每年今日，全国无数人民都会自发聚集在韶山故居缅怀这位红色的巨人。天地间红旗招展，歌声嘹亮。\n\n在北京天安门上，主席的画像默默注视着数十年来中国的日新月异。在长沙橘子洲头，巨大的青年毛泽东向正极目远眺世界的一切。"
 chi_GRnews.39.a: "曾记否，到中流击水，浪遏飞舟？"
 chi_GRnews.40: "暴走漫画"
 chi_GRnews.40.t: "王尼玛上传暴走漫画"
 chi_GRnews.40.d: "2007年作为起源的暴走漫画（rage comic）迷因在4chan诞生，并在2008年左右传播至中国大陆的社交网络，不仅迅速走红，并且由网友们进行了特色的本地化，如漫画的主人公一般称为“王尼玛”，是大多数创作的共同主角。\n\n2011年，一位名叫“王尼玛”的网友建立了以发布和创作暴走漫画为内容的中文网站，并提供“暴走漫画生成器”，让网友能够自由创作自己的暴走漫画。据称，明年2月，中国西安摩摩信息技术有限公司将向中国版权保护中心提出申请，进行暴走漫画中国大陆的著作权登记。该公司称其创始人即该中文网站的建立者，并对暴走漫画生成器进行计算机软件著作权登记。"
 chi_GRnews.40.a: "直到我膝盖中了一箭……"
 chi_GRnews.41: "铠甲勇士"
 chi_GRnews.41.t: "《铠甲勇士》上映！"
 chi_GRnews.41.d: "本月28日，上海哈哈炫动少儿频道播出了一部名为《铠甲勇士》的科幻特摄剧。该剧从制片方、演员到拍摄团队，全部由中国人组成，是我国首部国产变身英雄式的特摄剧。该特摄剧主要讲述了炘南、北淼、东杉、西钊与坤中这5个人保护地球的故事。他们的道路并不平坦。邪恶而残暴的暗影大帝又名暗影王，出于嫉妒地球的生机与活力，派遣了暗影五行魔前来侵袭。这些暗影五行魔所携带的魔灵石，拥有黑化的力量，妄想统治地球。就这样，一场关乎光明与黑暗、正义与邪恶的较量在地球上展开。五位少年，作为光明的使者，与暗影王派出的手下展开了殊死搏斗。他们凭借自己的智慧、勇气和坚定的信念，一次又一次地击退了敌人，守护着地球的和平与安宁。\n\n此举一经播出，好评如潮，许多孩子都希望变身成为剧中的英雄而与黑暗展开战斗。制片方表示，面对国内创作环境不足和文化差异，其核心团队特别是伍伟民，坚持根植中国文化，拒绝模仿，创造具有中国特色的英雄。面对拍摄挑战和内部分歧，他们坚持初衷并得到董事长支持，期望创作出属于中国人的动漫英雄。铠甲勇士将“金木水火土”以及太极等中国元素融入了角色的设计中，根植于中国文化，创造了属于中国自己的特摄英雄。"
 chi_GRnews.41.a: "铠甲，合体！"
 chi_GRnews.42: "铠甲勇士刑天"
 chi_GRnews.42.t: "《铠甲勇士刑天》上映！"
 chi_GRnews.42.d: "本月7日寒假档期，全国各省少儿频道与卫视频道都同步播出了《铠甲勇士》的续集作品《铠甲勇士刑天》，在旧作火热的人气上夺得了更高的收视率。\n\n新浪娱乐评论称，本次电视剧在演员阵容方面，力邀李巍、吴昊泽、张亚男等外形俊朗、个性鲜明的新生代偶像加盟，为铠甲新剧注入了无穷青春气息。另外，剧中也引入了现代社会普遍关注的“富二代”、“80后/90后”、“宅男”等剧情，颠覆了人们对80后、90后一贯的负面印象，反映眼下年轻人对新时代英雄主义的追求。整部电视剧贯穿着积极向上、勇战邪恶的正义信念，作为“铠甲勇士”系列的新剧，《铠甲勇士刑天》凭借华丽的特技、升级版的精良武器装备、气势恢宏的场面、扣人心弦的剧情、超强的制作团队及新生代偶像演员阵容，都使本片成为今年度最值得期待的真人特摄连续剧。"
 chi_GRnews.42.a: "铠甲，合体！"
 chi_GRnews.43: "猪猪侠"
 chi_GRnews.43.t: "《猪猪侠》开播！"
 chi_GRnews.43.d: "本月暑假档期，央视等全国400多家电视台播出了动画片《猪猪侠》的第一部《猪猪侠·魔幻猪猡纪》。故事发生在遥远的“猪猡纪”，那是一个由猪统治地球的年代。那时，小动物们对地球上各种资源开始了无节制地开采，导致整个地球乌烟瘴气，自然环境受到严重破坏。为了保护环境，扭转地球生态恶劣的局面，“猪猪侠”克服重重困难，终于研制出了一个具有神秘力量的“魔法智慧球”，自己却陷入到三千年才可轮回转世的魔咒当中，离开了人世。他把“魔法智慧球”交付给了当时身份是厨师的王小二，并叮嘱他一定要完成拯救地球环境的使命。而后然而王小二背信弃义，利用“魔法智慧球”开创自己的王国，对地球环境的破坏更是变本加厉，人类生存苦不堪言。环保的使者正义的化身"猪猪侠"在哪呢？他还会回来吗？他和他的朋友们会面临怎样漫长的环保之途呢？"猪猪侠"保护地球的伟大使命最终能够完成吗？\n\n这只红色衣着的小猪深受好评，猪猪侠系列也将成为一个中国动画史上的经典IP。"
 chi_GRnews.43.a: "GG Bond！"
 chi_GRnews.44: "玄幻小说"
 chi_GRnews.44.t: "玄幻小说进入黄金时期！"
 chi_GRnews.44.d: "随着互联网的普及和移动阅读的推广，玄幻小说正大行其道，热度不断攀高。\n\n玄幻小说是在中国大陆兴起的热潮，它建立在玄想之上，走得比魔幻小说更远，更自由，不受科学依据的束缚，有更多空间可以发挥幻想，黄易可视为中国现代玄幻小说的一个代表。中国的玄幻小说数量之多，种类之繁杂，早已把这各种元素都收拢其中了。网络上最火红的修真小说之一《飘邈之旅》开宗明义就说：“也许会看到古代中华的延续，也许会看到先进的文明，也许会看到诱人的法宝，也许会看到仙人的遗迹，也许会看到西方中世纪的古堡，也许会看到各种稀奇古怪野兽，这就是飘邈之旅。”玄幻是一种海阔天空恣意纵横的玄想，玄幻小说的创作永远是自由的。\n\n这一时期爆发出了许多“玄幻作家”——尽管他们自己可能并不认可这个身份——如辰东、纯情犀利哥、风凌天下、净无痕、天蚕土豆、逆苍天、猫腻、唐家三少、江南等，除此之外还有无数默默创作的优秀作家。此时的玄幻小说呈现百花齐放，百家争鸣之势。"
 chi_GRnews.44.a: "“我为天帝，当诛杀世间一切敌！”"
 chi_GRnews.45: "果宝特攻"
 chi_GRnews.45.t: "《果宝特攻》开播！"
 chi_GRnews.45.d: "本月，多家电视台播出了一部名叫《果宝特攻》的动画片，与此前大火的《猪猪侠一样同为》由广州蓝弧动画传媒有限公司制作出品，由王巍导演编剧。此剧既是《果冻三剑客》的续作，也是《果宝特攻》系列第一季动画。动画的主角橙留香、菠萝吹雪、陆小果三人名字均取自经典武侠小说角色之名，片中出现大量文化梗、古代诗词，在欢乐中起到了优秀的教育功能，陶冶了孩子们的文化素养。\n\n然而，该剧被部分人士指控含有大量政治隐喻，有讽刺和针砭之意。"
 chi_GRnews.45.a: "果宝机甲，归位！"
 chi_GRnews.46: "我的青春恋爱物语果然有问题。"
 chi_GRnews.46.t: "《我的青春恋爱物语果然有问题。》在我国大火！"
 chi_GRnews.46.d: "去年3月，日本轻小说作家渡航创作的《我的青春恋爱物语果然有问题。》在日本名声大噪，连续两年取得《这本轻小说真厉害！》评价赛前列。该轻小说很快传到我国台湾和大陆地区，引起华语区二次元界的注意。"
 chi_GRnews.46.a: "“青春是谎言 亦是罪恶”"
 chi_GRnews.47: "MikuFans"
 chi_GRnews.47.t: "MikuFans网站创建"
 chi_GRnews.47.d: "6月26日，一个名叫9bishi的网友发帖声称自己花三天的时间即兴创作了一个叫“MikuFans”的网站，用来解决Acfan网站崩溃后无法连接登录的问题，吸引了不少Acfan的会员们前往使用。在后续A站恢复正常访问后，彼时被称为“A后花园”的Mikufans也没有关停，Mikufans早期的制作者和维护者都是从A站出来的人。\n\nMikuFans的诞生跟二次元以及一种新兴的视频互动形式（弹幕）有关。而弹幕网站的鼻祖是日本的niconico网站。"
 chi_GRnews.47.a: "看得出是个骑士团的人"
 chi_GRnews.48: "AcFun"
 chi_GRnews.48.t: "AcFun网站创立"
 chi_GRnews.48.d: "6月6日，一个名为Xilin的网民宣布自己创立了一个名叫“AcFun”的网站，用以向国内二次元爱好者提供稳定、便捷的看番网站。AcFun最初的投稿形式完全是使用新浪的播放器链接新浪的视频，甚至连封面都是直接用新浪的地址。当天共有10个投稿，它们是：\nAC 1：凉宫春日版EVA片头（参见AC 16185854）\nAC 2：外国海贼王同人AMVAC \n3：偶像大师三姐妹激情舞蹈第二弹AC \n4：[新番]《鬼泣》动画连载AC \n5：怪物猎人在线精彩视频AC \n6：国产创意视频：变形金刚魔兽版AC \n7：PS2 RPG大作《女神异闻录3FES》 精彩OPAC \n8：最终幻想Ⅻ 亡灵之翼中文宣传影像AC \n9：动感新势力：Naruto新十大难忘场面AC \n10：[强档连载]虐杀姬OVA"
 chi_GRnews.48.a: "天下漫友是一家"
 chi_GRnews.49: "bilibili"
 chi_GRnews.49.t: "MikuFans改名为bilibili"
 chi_GRnews.49.d: "在2009年创建MikuFans网站之后，创始人bishi（徐逸）大学毕业以后便在一家金融的软件公司工作，在刚开始只有徐逸自己和几名网友在维护这个网站。在工作了一年多之后，徐逸便辞去了工作，在2010年将MikuFans更名为bilibili，且拥有有别于AcFun等视频弹幕网站的弹幕系统。其名称bilibili源于当时热门动画《魔法禁书目录》和《某科学的超电磁炮》中的人物御坂美琴的绰号“哔哩哔哩放电妹”。自此，bilibili网站摆脱了与AcFun的依赖关联，成为了一个较为独立的网站。\n\n此后十年内，bilibili作为中国最有特色的二次元平台，将独树一帜，发展到所有最初的参与者都难以想象的地步。"
 chi_GRnews.49.a: "bilibili乾杯 - ( ゜- ゜)つロ"
 chi_GRnews.50: "三体"
 chi_GRnews.50.t: "《科幻世界》开始连载《三体》"
 chi_GRnews.50.d: "本月，著名科幻杂志《科幻世界》开始连载一篇叫做《三体》的长篇科幻小说，作者是此前已小有名气的计算机工程师兼科幻小说作家刘慈欣。本期杂志出版后，许多读者对刘慈欣的新作赞赏有加。"
 chi_GRnews.50.a: "有才华的工程师"
 chi_GRnews.51: "神兵小将"
 chi_GRnews.51.t: "《神兵小将》开播！"
 chi_GRnews.51.d: "本月4日，中央电视台少儿频道每晚8：30的银河剧场将播出一部名叫《神兵小将》的动画片，翌日早上9：30进行重播。此片改编自黄玉郎创作的漫画《神兵玄奇》，讲述了以少年南宫问天为首的神兵小将们与他的同伴们除暴安良、为民除害，经过正邪斗争世界变得和平以后成为小英雄的历险成长故事。\n\n《人民日报》评论称，该片除了保留黄玉郎固有的明快节奏与风格，更在画风上添加了少儿所喜爱的亮丽色彩和跳脱可爱的人物动作。该片讲述了一个有关传奇小英雄的原创故事，在亲情的主题下融合了环保与维持生态和谐的意识，表达了人类与自然界生物要保持互相依附和信赖关系的重要性。《神兵小将》剧情紧凑，人物形象设计比较现代，尤其是该片在全手绘动画中融合了大量电影艺术元素的调动与逼真的镜头运动，并以先进的三维计算机软件和影像处理程序为平面的动画加工，展现出了黄玉郎独有的绘画特色和风格。\n\n这部动画片收视率颇高，成为央视少儿频道本年播出的最受欢迎的动画片。除人气火爆外，此片还有个特点就是港台参与制作，原作者和制作方都为香港方面人士，主题曲《梦的光点》则由台湾著名歌手王心凌演唱。此片在很大程度上也代表了大陆和港台的良好合作和文化交流。"
 chi_GRnews.51.a: "我有勇气我都不怕，管它寒冬炎夏。\n我很坚强大步的跨，我停不住步伐。"
 china.65.: "Bilibili的影响力与日俱增"
 china.65.t: "Bilibili的影响力与日俱增"
 china.65.d: "Bilibili在我国的影响力不断提升，已经成为国内最大的视频网站之一。\n\n哔哩哔哩拥有动画、番剧、国创、音乐、舞蹈、游戏、知识、生活、娱乐、鬼畜、时尚、放映厅等 15 个内容分区，生活、娱乐、游戏、动漫、科技是B站主要的内容品类并开设直播、游戏中心、周边等业务板块。B站正成为年轻人学习的首要阵地；B站数据显示，被用户称为#study with me#的学习直播，已晋升为B站直播时长最长的品类；2019年，用户在B站直播学习时长突破200万小时。"
 china.65.a: "bilibili乾杯 - ( ゜- ゜)つロ"

