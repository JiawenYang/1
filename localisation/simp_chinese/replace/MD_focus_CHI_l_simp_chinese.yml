 CHI_Ensuring_Internet_Sovereignty: "确保互联网主权"
 CHI_Ensuring_Internet_Sovereignty_desc: " "
 CHI_Protecting_Local_Businesses: "保护本土企业"
 CHI_Protecting_Local_Businesses_desc: "为了确保本土互联网企业在这样环境下生存下去并发展壮大，必须出台一系列政策保护他们并鼓励更多人从事互联网行业。"
 CHI_Border_Business_Communication: "跨国商业沟通"
 CHI_Border_Business_Communication_desc: ""
 CHI_International_Cultural_Exchange: "国际文化交流"
