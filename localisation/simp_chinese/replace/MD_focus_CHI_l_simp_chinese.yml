 chi_stop_war.6.d: "[From.GetName]外交官来电，同意即刻停火。"
 chi_stop_war.6.a: "甚善"
 chi_stop_war.7: "[From.GetName]拒绝停战"
 chi_stop_war.7.t: "[From.GetName]拒绝停战"
 chi_stop_war.7.d: "[From.GetName]拒绝了我们的军事警告，仍然一意孤行继续战争。"
 chi_stop_war.7.a: "来朝天子，许尔述职。不朝，六师移之！"
 chi_stop_war.7.b: "我们还需要等待"
 chi_stop_war.8: "[From.GetName]发出最后通牒"
 chi_stop_war.8.t: "[From.GetName]发出最后通牒"
 chi_stop_war.8.d: "[From.GetName]军委主席发来最后通牒，要求我们即刻停战，否则立即向我们宣战。"
 chi_stop_war.8.a: "来吧！"
 chi_stop_war.8.b: "我们惹不起他们……"
 chi_stop_war.9: "[From.GetName]拒绝了最后警告"
 chi_stop_war.9.t: "[From.GetName]拒绝了最后警告"
 chi_stop_war.9.d: "[From.GetName]来电，对我们的军事威胁表示遗憾，并声称绝不会屈从于我们。"
 chi_stop_war.9.a: "开战！"
 chi_stop_war.9.b: "我们惹不起他们……"


 ##############
 chi_stop_war.100.t: "[From.GetName]要求我们停战！"
 chi_stop_war.100.d: "联合国安全理事会常任理事国的[From.GetFlag][From.GetName]要求我们立刻停止当前战争！"
 chi_stop_war.100.a: "我们别无选择..."
 chi_stop_war.100.b: "谁在乎他们？"

 chi_stop_war.110.t: "[From.GetName]拒绝停止战争！"
 chi_stop_war.110.d: "[From.GetFlag][From.GetName]拒绝了联合国安理会的提议，继续在前线倾泻炮火。"
 chi_stop_war.110.a: "继续向他们施压！"
 chi_stop_war.110.b: "随他们去吧..."
 chi_stop_war.100.c: "向他们宣战！"

 chi_stop_war.120.t: "[From.GetName]同意停战!"
 chi_stop_war.120.d: "[From.GetFlag][From.GetName]同意了联合国安理会的提议，正在起草与交战国的停战文件。通过这次成功的维护和平壮举，我们获得了不少支持。"
 chi_stop_war.120.a: "很好"
 
 chi_stop_war.130.t: "[From.GetName]向我们宣战！"
 chi_stop_war.130.d: "[From.GetFlag][From.GetName]对我们的行为表示不满，随即向我们宣战，试图使用武力让我们屈服！"
 chi_stop_war.130.a: "这群疯子！"
 
 chi_stop_war.300: "我们受到了国际制裁!"
 chi_stop_war.300.t: "我们受到了国际制裁!"
 chi_stop_war.300.d: "[From.GetName]认为我们破坏了地区稳定和世界和平，并以此为理由对我们实施了国际制裁！"
 chi_stop_war.300.a: "这显然是一个错误！"
 
 chi_stop_war.350.t: "提议增加安理会成员"
 chi_stop_war.350.d: "[From.GetName]认为当前世界局势离不开[target_united_nations_members_selected.GetNameWithFlag]进行协调，所以提议让该国成为新的联合国安理会常任理事国成员"
 chi_stop_war.350.a: "他们应获得这样的地位。"
 chi_stop_war.350.b: "这也太荒谬了！"


 chi_stop_war.100.b.tooltip: "§Y此选项的花费将§R不断递增§!，若我们无法再承担其费用则该选项§R不可见§!§!"
 chi_stop_war.tooltip: "§Y将会开启一系列事件促进和平，预计会消耗§R大量§!政治点！§!"
#社会国策树
 CHI_Millennium_Society: "千禧年社会"
 CHI_Millennium_Society_desc: "进入21世纪后，我国社会变得更加五彩缤纷和充满活力，也出现了许多新的事物。"
 CHI_human_rights: "人权"
 CHI_human_rights_desc: "中国共产党坚持人民至上，坚持将人权的普遍性原则与中国实际相结合，坚持生存权、发展权是首要的基本人权，坚持人民幸福生活是最大的人权，坚持促进人的全面发展，不断增强人民群众的获得感、幸福感、安全感，成功走出了一条中国特色社会主义人权发展道路。"
 CHI_Feminism: "妇女权益"
 CHI_Feminism_desc: "女性占人类全体的一半，如何对待女性权利问题是恒衡量一个社会发展的度量。"
 CHI_Supporting_feminism: "支持女权"
 CHI_Supporting_feminism_desc: "所有的女权主义理论都有一个基本的前提，那就是：女性在全世界范围内是一个受压迫、受歧视的等级。不敢相信，在21世纪，我国女性仍然遭受着来自各方面的压迫。矫枉必须过正，我们将为女性争取更多权益，这样才能取得根本意义上的女性解放。"
 CHI_Gender_equalitym: "男女平权"
 CHI_Gender_equalitym_desc: "女权主义的理论千头万绪，归根结底就是一句话：在全人类实现男女平等。在父权制社会和资本主义社会中，男女无产者平等地受到所有既得利益者的残酷剥削。我们要解放的不仅是女性，更是所有被压迫的人。"
 CHI_Combating_feminism: "打击女权主义"
 CHI_Combating_feminism_desc: "女权主义完全是改革开放后从西方传来的意识形态武器，意在制造我国内部矛盾，让男女互相仇视。把这些阴沟老鼠从我们伟大的祖国剔除，刻不容缓。"
 CHI_Gender_struggle: "性别斗争"
 CHI_Gender_struggle_desc: "在阶级社会中，一切矛盾都是阶级矛盾。男性对女性千百年来的压迫就是阶级压迫的一种体现，男性将女性当作一种被压迫阶级而不断加强压迫。我们要以阶级斗争角度来看待性别问题，把男人当作阶级敌人看待。干革命不是请客吃饭，吵吵闹闹不能解决问题，要获得彻底的解放就要有彻底的斗争精神。"
 CHI_A_louder_call: "更响亮的呼声"
 CHI_A_louder_call_desc: "男女性的问题不能看作简单的阶级问题，我们应该以更加理性和务实的方式抒发我们的声音。毛泽东主席说过，要把敌人搞得少少的，把朋友搞得多多的。在新时代，我们不会向任何压迫妥协，也不会把任何非敌人变成敌人。我们放声呼唤，让整个社会听到女性的呼声。"
 CHI_refuses_to_be_breeding_machines: "拒绝成为生育机器"
 CHI_refuses_to_be_breeding_machines_desc: "女性有生育能力，因此就被当作千百年来的生育机器，成为男性的私有财产和性奴，哪有这样的道理！我们绝不允许任何形式的性别剥削，生育就是对女性最大的剥削。现在开始拒绝生育，让那些那些男人看看到底谁才是生育过程中的主导者。"
 CHI_Monopoly_of_reproductive_rights: "生育权垄断"
 CHI_Monopoly_of_reproductive_rights_desc: "女性相较于男性有一项最本质的区别，就是女性有妊娠能力，并且要因此而在生育中付出更大的代价。十月怀胎对于任何一个女性都是极大的摧残，然而女性付出了生育义务却没有获得相应的权利。应该好好利用女性生而就有的性别特质，将此转换为生育特权，让女性主导生育。"
 CHI_Contact_foreign_feminist_organizations: "联络国外女权组织"
 CHI_Contact_foreign_feminist_organizations_desc: "西方的女权主义运动开始得很早，理论成就和斗争成果都相当丰富。第一波女权主义运动发生在1840年到1925年间，而那时候中国女人还在给她们的男主人当牛做马！与其靠我们自己去摸着石头过河，不如参考已有的成功案例。我们应该和国外女权组织取得联系，向她们学习理论知识和斗争经验。"
 CHI_Independence_and_autonomy: "独立自主"
 CHI_Independence_and_autonomy_desc: "女性解放的事业不能依靠任何人，必须由我们自己来做，软弱性和妥协性是小资产阶级的特质。谁知道那些西方的女权组织是不是用心不纯，要是背后有外国政府操纵，借机干预我国内政怎么办？女权事业可不是卖国，我们才不当汉奸头子——不对，应该说妇奸。"
 CHI_Establishing_an_Independent_Bill_of_femininity_Rights: "新设独立女性权利法案"
 CHI_Establishing_an_Independent_Bill_of_femininity_Rights_desc: "女性取得的权利权利应该以更有效的方式捍卫，立法就是最好的方式。另立新法，把女性权益抬高到超出一般人权的地位，这样才能体现我们的女性权益事业如何伟大。"
 CHI_revise_of_women_Rights_Act_of: "女性权利法案增订"
 CHI_revise_of_women_Rights_Act_of_desc: "已有的妇女权益法并不能很好的捍卫女性权益，我们需要增订一份更加完善的法案来从法律层面保护女性的权益不受到践踏和侵犯。"
 CHI_Female_specificity: "女性特殊性"
 CHI_Female_specificity_desc: "女性不应该被定义！我们都很美丽，因为我们每一个人都有自己的色彩。女性相较于男性更加敏锐、富有同情心，更加善良，更加具有特殊性。要知道，在胚胎时期，女性特征才是每个胚胎的初始特征，男性才是后天发育的“第二性”！我们拒绝男性的性别凝视，我们将捍卫生而为女性那至高无上的荣誉。"
 CHI_strive_for_the_rights_to_speak: "争取话语权"
 CHI_strive_for_the_rights_to_speak_desc: "男女都是人，没什么可品评高低的，女性不该被定义的同时男性也不该被定义。我们不会用踩一捧一的卑劣方式来推进女权主义事业，我们用事实说话，争取我们本应获得的话语权，并推动社会向更平等、更友善、更美好的方向发展。"
 CHI_Joint_LGBT_population: "联合LGBT人群"
 CHI_Joint_LGBT_population_desc: "LGBT群体也是长期受到父权制压迫的群体，他们许多人生而美丽却惨遭迫害，和我们女性完全一致！女权事业不仅是解放我们女性的事业，更是要解放一切在父权制社会中遭受压迫的人群，捍卫他们生而为人的权利！更何况——他们中有些人的确很好看。"
 CHI_Maintain_distance_from_LGBT_population: "与LGBT人群保持距离"
 CHI_Maintain_distance_from_LGBT_population_desc: "LGBT在某种程度上的确和女性很像——都受到父权制社会的抹黑和压迫。然而，权益是自己斗争来的，LGBT人群甚至都不能形成一个很好的群体自我认同，如何组织有规模的权益争取运动？更何况他们对自我的认知都尚不稳定，我们不能让女性主义事业因为这个不确定因素而遭受潜在的阻碍。"
 CHI_The_New_Era_of_Women: "女性新时代"
 CHI_The_New_Era_of_Women_desc: "父权制的时代已经结束，中国在我们的推动之下已经成为了一个女性友好型社会。我们将以女性友好型城市长沙为模式，凝结出属于新时代女性的精神——长沙精神。"
 CHI_Adhere_to_and_strengthen_leadership_in_women_work: "坚持和加强党对妇女工作的领导"
 CHI_Adhere_to_and_strengthen_leadership_in_women_work_desc: "中国共产党始终坚持和加强对妇女工作的领导。70年来，中国共产党始终坚持男女平等的政治主张，将实现妇女解放和男女平等作为奋斗目标，将妇女事业作为党的事业的重要组成部分。召开第一至第十二次全国妇女代表大会，根据党和国家工作大局，确定妇女运动和妇女工作的方针原则和主要任务，统筹部署和推进妇女工作。进入新时代，党对妇女工作的领导进一步加强。“坚持男女平等基本国策，保障妇女儿童合法权益”写入党的十八大、十九大报告，成为党治国理政的重要理念和内容。"
 CHI_Improve_women_political_rights: "完善女性政治权利"
 CHI_Improve_women_political_rights_desc: "我国重视保障妇女与男子平等的政治权利。新中国成立之初，就从法律上规定了男女享有平等的选举权、被选举权和管理国家事务的权利。改革开放40多年来，中国特色社会主义民主政治不断完善，为妇女参政提供了新机遇、拓展了新渠道。党的十八大以来，在推进国家治理体系和治理能力现代化进程中，妇女参与国家和社会事务管理的水平全面提升，在民主政治建设中的作用日益增强。"
 CHI_Establish_sound_Women_Federation_organization: "建立健全妇联组织"
 CHI_Establish_sound_Women_Federation_organization_desc: "全国妇联是各族各界妇女为争取进一步解放与发展而联合起来的群团组织，是中国共产党领导下的人民团体。在党的领导下，妇联组织依照章程，切实担负团结引导各族各界妇女听党话、跟党走的政治责任，切实履行代表和维护妇女权益、促进男女平等和妇女全面发展的基本职能。围绕党和国家工作大局，广泛深入宣传党的理论路线方针政策，团结引导广大妇女坚定不移走中国特色社会主义妇女发展道路，充分发挥在社会生活和家庭生活中的独特作用，为中国特色社会主义事业建功立业。"
 CHI_Improve_laws_to_protect_womenrights_and_interests: "完善保障妇女权益法律"
 CHI_Improve_laws_to_protect_womenrights_and_interests_desc: "妇女权益是基本人权。我国把保障妇女权益纳入法律法规，上升为国家意志，内化为社会行为规范。新中国成立伊始，中国共产党组织制定实施一系列法律法规提高妇女地位。《中华人民共和国宪法》作为国家根本大法，始终坚持男女平等原则。1954年第一部宪法规定了妇女在政治、经济、文化、社会和家庭生活各方面享有同男子平等的权利，并在历次修改中一以贯之。2004年，“国家尊重和保障人权”写入宪法修正案，奠定了妇女人权保障基石。"
 CHI_strengthen_propaganda_of_Gender_equality: "加强性别平等宣传"
 CHI_strengthen_propaganda_of_Gender_equality_desc: "将保障妇女权益的法律知识、法治精神、法治文化纳入全民普法规划。从1986年开始实施的“一五”普法规划到2016年实施的“七五”普法，始终把提升妇女法治意识和法治素养，提升妇女参与法治实践能力作为重要任务，坚持妇女普法宣传与弘扬社会主义核心价值观相结合，坚持普法宣传与依法维护妇女权益相结合，坚持经常性普法与每年“三八”国际妇女节等重点普法相结合，坚持运用传统媒体普法与新兴媒体普法相结合，坚持普法宣传与激发妇女主体活力相结合。"
 CHI_Establish_gender_equality_evaluation_mechanism: "建立性别平等评估机制"
 CHI_Establish_gender_equality_evaluation_mechanism_desc: "依据《中华人民共和国立法法》备案审查制度和程序规定，创建源头保障妇女权益、促进男女平等发展新机制。2012－2018年，全国30个省（区、市）建立了法规政策性别平等评估机制，将男女平等价值理念引入法规政策的制定、实施和监督各环节，加强政策法规制定前研判、决策中贯彻、实施后评估的制度化建设，进一步体现了新时代妇女群众的意志和期盼，进一步丰富了新时代科学立法和民主立法的生动实践。"
 CHI_Ensuring_equal_land_rights_for_women: "保障女性平等土地权益"
 CHI_Ensuring_equal_land_rights_for_women_desc: "妇女是国家的重要建设者，从土地改革、农村家庭联产承包到农村承包地确权登记颁证与农村土地“三权分置”，中国始终重视从法律制度上保障妇女土地权益。2014年起，开展农村承包地确权登记颁证，明确要求将农村妇女土地承包经营权记载到权属证书上，广大农村妇女实现了“证上有名、名下有权”。2018年修订的农村土地承包法明确规定，农户内家庭成员依法平等享有承包土地的各项权益，确保农村妇女平等享有土地承包经营权。2016年，中共中央、国务院印发《关于稳步推进农村集体产权制度改革的意见》，明确提出切实保护农村妇女的合法权益。2018年，民政部、中央组织部、全国妇联等七部门联合发布《关于做好村规民约和居民公约工作的指导意见》，要求纠正与法律政策规定、性别平等原则相冲突的村规民约。农村妇女的土地权益和经济利益得到有效保障，她们踊跃投入乡村振兴，积极为农业农村现代化建设做贡献。"
 CHI_Gender_equality_on_maternity_leave: "产假性别平等"
 CHI_Gender_equality_on_maternity_leave_desc: "《女职工劳动保护特别规定》第七条：“女职工生育享受98天产假，其中产前可以休假15天；难产的，增加产假15天；生育多胞胎的，每多生育1个婴儿，增加产假15天。女职工怀孕未满4个月流产的，享受15天产假；怀孕满4个月流产的，享受42天产假。”如今，应立法让男性也同样享有和妇女同样的产假权，这是保障性别平等的重要基石。"
 CHI_Equal_reproductive_rights: "平等生育权"
 CHI_Equal_reproductive_rights_desc: "无论男女，在生育问题上应尽到同样的义务，享有同样的权利。生育是男女双方的事，不是某一方单方面的义务或权利。我们要加强生育权平等的宣传，构建更加和谐美好的生育观念。"
 CHI_Completely_prohibit_bride_price_system: "彻底禁止彩礼陋习"
 CHI_Completely_prohibit_bride_price_system_desc: "彩礼和嫁妆是当今婚姻习俗中最反动最封建的环节，是将人当作商品异化、将婚姻变成人口贩卖生意的恶毒行径，在21世纪的社会主义国家竟然还有这种封建残余存在，简直匪夷所思。长期以来，我国对于彩礼问题采取冷处理态度，不承认不鼓励，但也不禁止，只当作财产赠与处理。现在是时候把这些封建余毒彻底剔除了，社会主义不需要人口贩卖。"
 CHI_Completely_prohibit_sexual_transaction: "彻底禁止性交易"
 CHI_Completely_prohibit_sexual_transaction_desc: "性交易的本质就是将人商品化，把人当作肉块和发泄性欲的工具，是对人的异化，更会酿成变相人口贩卖和身体剥削的惨剧。新中国成立后，大陆地区的性产业被迅速肃清，到1951年底各地取缔娼妓工作基本结束。改革开放以后，性产业迅速卷土重来并达到相当规模，但我国严禁色情业的态度没有丝毫的动摇。必须把这些灰色产业彻底铲除，无论是服务男性还是服务女性的。"
 CHI_Protecting_Women_labor_rights: "保障女性劳动权"
 CHI_Protecting_Women_labor_rights_desc: "为什么女性的地位会如此之低？根本原因是女性没有享受到充足的劳动权利。女性在经济上不独立，必会依赖于他人，必然造成广泛的性别不平等和性别剥削。我国高度重视从制度上保障女职工劳动保护各项权利。从1988年颁布《女职工劳动保护规定》到2012年《女职工劳动保护特别规定》出台，女职工劳动保护程度不断提高。编发《促进工作场所性别平等指导手册》，推动用人单位贯彻落实法律法规，维护女职工合法权益和特殊利益。各项劳动保护工作深入推进，为女职工参与经济社会发展创造了条件。各行各业女职工以高度的主人翁责任感和历史使命感，在国家经济发展和社会进步中发挥着越来越重要的作用。"
 CHI_Ensuring_women_education_right: "保障女性受教育权"
 CHI_Ensuring_women_education_right_desc: "教育是培养现代意识和现代公民的根本方法。《中华人民共和国义务教育法》等法律和政策，不断加大义务教育投入，重点向农村地区倾斜，通过设立中小学助学金、制定女童专项扶助政策、实施“春蕾计划”和“希望工程”等助学项目，大大增加了农村女童受教育的机会。1988年颁布《中华人民共和国高等教育法》，不断扩大高等教育规模，推行助学贷款制度，设立助学奖学金，为更多女性接受高等教育创造了条件。"
 CHI_socialist_women: "社会主义女性"
 CHI_socialist_women_desc: "在我们一系列的努力下，女性权益最终得到了最根本、最广泛的保障，性别剥削的时代一去不复返。我们伟大社会主义祖国培育的女性一定是自信、光荣且敢于拼搏的劳动女性。"
 CHI_denied_gender_inequality: "否认性别不平等"
 CHI_denied_gender_inequality_desc: "哪有什么性别不平等？那么多女性衣着暴露地走在大街上，教室里坐着的一半都是女孩儿，就连工作岗位也有不少是仅招收女性员工的，请问哪里有不平等？这些臭婆娘真是唯恐天下不乱了！这根本没什么值得讨论的，更何况——这个世界本就是不平等的，凭什么女人先起来叫唤要平等了？简直是胡闹。"
 CHI_Moral_condemnation: "道德谴责"
 CHI_Moral_condemnation_desc: "性别之间的不平等已经结束了，女性现在有权利可以自由地去做任何事情，我们同样有批判这些女人的权利。那些叫嚣女权的娘们都是些同性恋，和那些自称LGBT的不男不女的东西串通一气，一定要破坏掉一切美好、稳定的东西，把一切神圣的、正确的东西踩在脚底下，去满足她们那变态的性欲。"
 CHI_Deprivation_of_women_political_rights: "剥夺女性政治权利"
 CHI_Deprivation_of_women_political_rights_desc: "女人懂什么政治？让她们搞懂不同政治主张和意识形态的区别，比让母猪飞上天还难。政治天生就是男人的主场，让女人来搞政治只会把一切都搞得一团糟，只剩下各种娘炮和小白脸围着她们转圈。不让女人参政不仅是为了她们好，更是为我们每个人共同生活的社会而着想。"
 CHI_Women_go_home: "女人回家！"
 CHI_Women_go_home_desc: "女人的本职就是相夫教子，男人才是在外打拼的人，本就应该如此。女人在公领域与男人的竞争造成了双重的伤害：一方面她们把男人逼成了工作狂，以便能够留住自己的好工作，如脑力劳动的职位；另一方面使男人更容易接受坏工作，如体力劳动的职位。让女人进入社会生产劳动是“使男人失业，给女人增加负担”的坏极了的事情。女人难道能比男人做得还好吗？"
 CHI_Family_First: "家庭至上"
 CHI_Family_First_desc: "家庭是社会的基本单位，每个人成年后都应该成家，这样社会才能稳定、正常地运行。那些女权主义者最喜欢叫嚣不婚不育，这简直是没有天理的事情，她们喜欢搞同性恋，可男人们该怎么办！难道让两个男人像她们和LGBT那些不男不女的东西一样结对吗？更何况没有结婚就无法生育，没有孩子的民族还有未来吗？为了神圣的家庭和民族的未来，必须把女权分子全部铲除。"
 CHI_Criminalization_of_abortion: "堕胎刑事化"
 CHI_Criminalization_of_abortion_desc: "每个人生来就有生活的权利，女权主义者不婚也就罢了，竟然还随意堕胎，这简直就是赤裸裸的谋杀！难道只有她们的命是命，婴儿的命就不是命吗？女权主义者的抽恶嘴脸在人命面前显露无遗。必须把这些谋杀犯和潜在的谋杀犯全部判罪丢进大牢。"
 CHI_Demonizing_feminists: "妖魔化女权主义者"
 CHI_Demonizing_feminists_desc: "女拳都是些缺乏幽默感的自私鬼、不修边幅、刻意把自己打扮成没有女人味的变态狂，以及整日争风吃醋、吵吵闹闹地争辩不休的泼妇。女权主义者不但愚蠢至极，经不住别有用心者的煽风点火而成为他人谋取名利的工具，而且易怒且鲁莽，整日怒气冲冲，思想极端且僵化，无处不发现性别歧视。谁知道那些单身的职场女性晚上会跟几个老板共度春宵？谁知道那些老处女喜欢私下看些什么下三滥的片子？"
 CHI_The_Value_of_Men: "男性价值"
 CHI_The_Value_of_Men_desc: "男人天生就是自信、强大的，充满男子气概。然而一旦跟女人沾边就会变得跟她们一样愚蠢和神经质，完全没有个男人样。男人和男人相处时，则会变得团结、友爱，有协作精神。让我们摆脱女人与桎梏，恢复我们的兄弟情谊，寻找男性的独特感觉，摆脱工业化和女性主义的压迫，在回归自然的活动中，男人们集体到森林里去击鼓、放歌，聆听诗歌和神话故事，激发我们狩猎祖先的血脉。"
 CHI_blame_the_victim: "责怪受害者"
 CHI_blame_the_victim_desc: "女人容易遭到强奸和抢劫难道不是她们自己的错吗？穿成那样难道不是为了吸引男人？在法制社会里，唆使他人犯罪也是一种罪，我们尚且宽恕这种罪行，但没人会为她们愚蠢行径酿成的后果而感到同情。"
 CHI_Confucianism_ethic: "提倡儒学伦理"
 CHI_Confucianism_ethic_desc: "男正乎外，女正乎内，夫妇造万化之端。有男女，必有夫妇。夫妇之道修，而内外之礼正。子思曰：“君子之道，造端乎夫妇。”修身齐家，教之本也。五德之常著，而大本以敦。三纲之义明，而人伦以正。君为臣纲，父为子纲，夫为妻纲。君正臣忠，父慈子孝，夫妇和顺，则人伦正矣。"
 CHI_Advocate_consumerism: "提倡消费主义"
 CHI_Advocate_consumerism_desc: "挣不到钱的男人不是好男人，花不了的女人不是好女人。消费的主力军当然是女性，女性就应该把所有钱都花光，用化妆品、奢侈品和漂亮衣裳把女人的钱全部榨干，透支她们的贷款额度，这样她们就不得不依附于男性了。"
 CHI_domesticating_education: "驯化教育"
 CHI_domesticating_education_desc: "现代社会，每个人都有接受教育的权利，女性也不例外。因材施教，女性就该学女性应该学的东西，既然复杂的东西她们学不会，那就多学些家政和思政课程吧。"
 CHI_True_Women: "真正的女性"
 CHI_True_Women_desc: "在我们的努力之下，女权主义分子的乱象终于被镇压了，女性终于摆脱了女权主义思潮的蛊惑。现在我们的社会将更加和谐，男女都能找到自己的位置并安于现状了。"
 CHI_laborer_rights_and_interests: "劳动权益"
 CHI_laborer_rights_and_interests_desc: "劳动权益是我国一个重大的问题，需要审慎对待。"
 CHI_Emphasize_labor_laws: "强调劳动法"
 CHI_Emphasize_labor_laws_desc: "我国早已出台了劳动法，对劳资地位的定性和关系处理已有详细的规定。然而出于各种原因，我国的劳动法往往被忽视。要处理劳动权益问题就必须以法制为根本，必须强调劳动法对劳动权益的规定作用。"
 CHI_Protecting_workers: "保护劳动者权益"
 CHI_Protecting_workers_desc: "劳动人民是我国发展的基石，是包括、中小资产阶级、公务员、知识分子、自由职业者、渔民和手工业者在内的多阶级政治集合。劳动者靠劳动卫生，推动社会发展，我们必须要落实保障劳动者的合法权益，否则我们有何脸面说自己是一个社会主义国家？"
 CHI_Comfort_entrepreneurs: "安慰企业家"
 CHI_Comfort_entrepreneurs_desc: "在我国，企业家与资本家并不是完全重叠的，企业家是在社会主义市场经济下掌握更多有效生产资料的人，对经济发展具有重要的引领作用。企业家也是我国公民，劳动权益也要保障他们的劳动所得。"
 CHI_Corporatism: "调节劳资矛盾"
 CHI_Corporatism_desc: "我国目前的中心工作是经济建设而不是阶级斗争，必须让全体劳动者和企业家搁置争议，齐心协力，共同建设伟大祖国。"
 CHI_All_China_Federation_of_Trade_Unions: "中华全国总工会"
 CHI_All_China_Federation_of_Trade_Unions_desc: "我们党是为人民服务的，是无产阶级先锋队的政党，我们应当领导所有的工人……额，比如建立总工会……切实确保劳动者的利益……"
 CHI_Commission_of_Commerce: "商务委员会"
 CHI_Commission_of_Commerce_desc: "非公经济是社会主义市场经济的重要组成部分，也是最不易管理和掌控的部分。在各地建立商务委员会，监督和领导企业家的经济活动，是保障我国经济发展的平稳发展的重要手段。"
 CHI_Class_struggle_led_by_Party: "党领导的阶级斗争"
 CHI_Class_struggle_led_by_Party_desc: "党政军民学，东西南北中，党是领导一切的，阶级斗争也需要在党的领导之下开展。禁止破坏性的斗争，禁止无止尽的剥削，是党对国家、对人民的责任和承诺。"
 CHI_The_collaboration_between_labour_and_capital: "劳资合作"
 CHI_The_collaboration_between_labour_and_capital_desc: "劳资合作、劳动关系和谐是社会和谐的基础。但合作与和谐必须建立在平等基础之上，没有平等的所谓合作与和谐是奴役和压迫，是掩盖矛盾而不是没有矛盾，这种所谓的合作与和谐是不能持久的。合作不是合并，而是通过利益共享同时增进各方利益；和谐不是没有矛盾，而是合理解决矛盾冲突、免于矛盾激化。只有劳动者合理的权益得到保障、实现利益分享（劳资两利），劳资关系才能融洽、劳资合作才能继续，经济的发展才能持续，社会才能和谐。"
 CHI_The_right_to_education: "受教育权"
 CHI_The_right_to_education_desc: "教育是每个公民都享有的基本权利，也是国家兴盛的根本大计。我国的教育问题十分复杂，涉及多方面各领域，还牵涉到不同群体的利益。"
 CHI_reform_from_the_bottom: "正本清源"
 CHI_reform_from_the_bottom_desc: "猛药去疴、重典治乱，唯有正本才能清源，从根本上整顿，从源头上清理，教育工作才能做好。"
 CHI_consolidating_vital_base: "固本培元"
 CHI_consolidating_vital_base_desc: "天行有常，盈虚有数。教育改革不可操之过急，这是事关数亿师生乃至整个社会十多亿人的问题，必须审慎处理对待。"


