 chi_GR.120.t: "化石燃料发电厂要求解除限制"
 chi_GR.120.d: "随着经济发展，我们对于能源的需求愈发增加，不少化石燃料发电厂要求解除相应法规限制以满足增长的能源需求。今天，一位商业背景很重的部长找到了胡主席，向他提出了一份“有利于能源行业发展”的法案。当然，代价是严重的环境污染……\n\n胡主席当然可以拒绝这位无礼的部长，但是类似目的的人以后会越来越多，如若不满足这些要求，某些人的怨气会越积越深……"
 chi_GR.120.a: "滚蛋吧"
 chi_GR.120.b: "睁一只眼闭一只眼"
 
