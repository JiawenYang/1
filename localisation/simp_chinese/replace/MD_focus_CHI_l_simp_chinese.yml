#经济危机#
 chi_crisis.1: "世界经济危机"
 chi_crisis.1.t: "金融海啸蔓延至中国"
 chi_crisis.1.d: "受美国引起的全球金融危机影响，全球资金链条急速缩紧，融资成本大幅上升，企业生产大幅放缓，世界实体经济遭受严重冲击。中国制造业出口额大跳水，从年初的超过两位数增长迅速跌落至负增长。中国出口额继续跌至两位数负增长，工业生产大幅下滑，发电量零增长，大量中小出口企业倒闭破产，沿海地区出现大面积失业潮。\n\n为期一天的二十国集团领导人金融市场和世界经济峰会于[?global.date.GetDateString]在美国首都华盛顿举行，中国国家主席[CHI.GetLeader]在会上发表了题为《通力合作，共度时艰》的重要讲话。主席指出，为了有效应对这场金融危机，世界各国应该增强信心、加强协调、密切合作。"
 chi_crisis.1.a: "巨龙在挣扎"
 chi_crisis.1.b: "美国闯的祸，必须让全世界来承担？"
 chi_crisis.2: "工厂倒闭"
