l_simp_chinese:

#国策
 CHI_Millennium:0 "千禧时代"
 CHI_Millennium_desc:0 "2000年是中华人民共和国成立第51周年，我们伟大的社会主义祖国进入了全新的时代。如何走好新世纪的中国道路，需要全国人民共同书写时代新篇章"
 CHI_tenth_five_year_plan:0 "第十个五年计划"
 CHI_tenth_five_year_plan_desc:0 "2001年3月，全国人大九届四次会议通过了《国民经济和社会发展第十个五年计划纲要》。按照发展社会主义市场经济的需要，确立以经济结构的战略性调整作为主线。生态建设、环保、经济与社会的可持续发展得到了加倍的重视。更多关注教育、文化、医疗卫生、体育等各项社会事业，更加注意经济与社会的协调发展，以更好地满足广大人民群众发展的需要、享受的需要"
 CHI_Letter_of_BUSH:0 "小布什总统的信"
 CHI_Letter_of_BUSH_desc:0 "中美撞机事件发生后，美国总统小布什终于送给主席两封“表示遗憾的信件”。虽然我们知道这只是表面功夫，但无疑我们眼下需要笑脸相迎"
 CHI_Support_the_War_on_Terror:0 "支持反恐战争"
 CHI_Support_the_War_on_Terror_desc:0 "连世界上最强大的美国都被恐怖主义袭击了，不可一世的双子塔都在众目睽睽之下崩塌。我们国家绝不允许出现这种事情，必须与一切危害中国和中国人民的事情做斗争。我们应该在联合国安理会上投票支持美国打击阿富汗境内的恐怖分子，他们离我们太近了，也正好让美帝国主义跟他们斗个人仰马翻"
 CHI_Comprehensively_building_a_moderately_prosperous_society: "§Y全面建设小康社会§!"
 CHI_Comprehensively_building_a_moderately_prosperous_society_desc: "大会审议和通过了江泽民代表第十五届中央委员会所作的《全面建设小康社会，开创中国特色社会主义事业新局面》的报告。根据全面开创中国特色社会主义事业新局面的要求，在深刻分析党和国家面临的新形势新任务的基础上，大会确定了全面建设小康社会的奋斗目标。指出:我们要在本世纪头20年，集中力量，全面建设惠及十几亿人口的更高水平的小康社会，使经济更加发展、民主更加健全、科教更加进步、文化更加繁荣、社会更加和谐、人民生活更加殷实。这是实现现代化建设第三步战略目标必经的承上启下的发展阶段，也是完善社会主义市场经济体制和扩大对外开放的关键阶段。经过这个阶段的建设，再继续奋斗几十年，到本世纪中叶基本实现现代化，把我国建设成富强、民主、文明的社会主义国家。"
 CHI_The_great_rejuvenation_of_Chinese_nation:0 "§Y中华民族伟大复兴§!"
 CHI_The_great_rejuvenation_of_Chinese_nation_desc:0 "在中国共产党第十六次全国代表大会报告上，我们提出要实现中华民族伟大复兴的宏伟目标。新世纪将是我们党大展宏图的世纪，前几年发生的太多事让我们在美国和世界面前丢尽了脸，美帝国主义可能觉得这能羞辱和压制我们，但那些不过是纸老虎，燕雀安知鸿鹄之志哉。中国共产党是人民的党，我们必须要带领中国人民继续走向更加美好的时代，一个中国人民永远不会再被欺侮的时代！"
 CHI_Chairman_Jiang_Reign: "江主席的任期"
 CHI_Chairman_Jiang_Reign_desc: "江泽民是邓小平的杰出接班人，也是一个致力于自由市场改革和维护中国共产党政治至上地位的人。在世纪之交的几年里，国际形势风云变幻，我国改革开放和社会主义现代化建设进程波澜壮阔。江主席是一位掌舵的老船长，他将带领我们党和国家驶入新世纪的汪洋大海。"
 CHI_End_PLA_Business_Ventures: "终止解放军经商"
 CHI_End_PLA_Business_Ventures_desc: "为了弥补国防预算削减，解放军在20世纪70年代开始收购商业企业。然而，这导致了很大程度上的腐败和军纪涣散，军人们越来越多和资本家们勾结在一起。因此，有必要制定一项新指令，将解放军撤出大多数经济部门，但为了安抚军队，我们必须在增加预算的同时实施这一指令。"
 CHI_3_Represents_Thought: "三个代表思想"
 CHI_3_Represents_Thought_desc: "江泽民同志2000年2月25日在广东省考察工作时，从全面总结党的历史经验和如何适应新形势新任务的要求出发，首次提出并比较全面地阐述了“三个代表”重要思想。具体内容为——中国共产党始终代表中国先进生产力的发展要求、始终代表中国先进文化的前进方向、始终代表中国最广大人民的根本利益，“三个代表”重要思想是我们党的立党之本、执政之基、力量之源。"
 CHI_Invigorate_Country_Through_STE: "科教兴国"
 CHI_Invigorate_Country_Through_STE_desc: "“科教兴国”是指全面落实科学技术是第一生产力的思想，坚持教育为本，把科技和教育摆在经济、社会发展的重要位置，增强国家的科技实力及向现实生产力转化的能力，提高全民族的科技文化素质，把经济建设转移到依靠科技进步和提高劳动者素质的轨道上来，加速实现国家的繁荣强盛。该计划将使我国能够弥补技术劣势。"
 CHI_Permit_Entrepreneurs_to_Join_the_CPC: "允许企业家入党"
 CHI_Permit_Entrepreneurs_to_Join_the_CPC_desc: "吸收其他社会阶层的优秀分子入党，允许新的社会阶层中的优秀分子包括私营企业主中的优秀分子入党，并不是毫无原则地敞开大门，谁想进来就进来，或者不想进来硬拉进来。 我们绝不允许那些政治上落后、入党动机不纯的人混进党内，绝不允许仅仅因为某些人经济实力强、个人名气大，就把他们拉进党内来。\n\n只有那些政治上先进，符合入党条件，能够坚持党的奋斗目标和宗旨，严格履行党员义务，自觉接受党组织的监督，模范地遵守国家政策和法律法规的优秀私营企业主，党组织才欢迎他们入党。"
 CHI_Manufacturing_exports: "制造业出口"
 CHI_Manufacturing_exports_desc: "加入世界贸易组织后后，我国承接了海量的外国投资和外贸订单。我国应该继续采取并扩大制造业出口的发展方针，这样可以以最快速度吸收外国投资和拉动工业建设，成为世界制造业跳动的心脏。"
 CHI_16th_National_Congress_of_CPC: "中国共产党第十六次全国代表大会"
 CHI_16th_National_Congress_of_CPC_desc: "中国共产党第十六次全国代表大会于2002年11月8日至14日在北京举行，大会正式代表2114人，特邀代表40人，代表全国6600多万党员。党的十六大，是中国共产党在新世纪召开的第一次全国代表大会，也是在我国进入全面建设小康社会、加快推进社会主义现代化的新的发展阶段召开的一次十分重要的代表大会。大会确定了江主席的接班人选，即长期在共青团工作的为人低调的胡锦涛同志。"
 CHI_Hu_Jintao_Agenda: "胡锦涛的议程"
 CHI_Hu_Jintao_Agenda_desc: "第十届全国人大第一次会议上，胡锦涛同志当选为中华人民共和国主席。十六届四中全会任中央军事委员会主席。第十届全国人大第三次会议当选为中华人民共和国中央军事委员会主席。十七届一中全会任中央军事委员会主席。国家权力已逐步转交给这位“年轻人”了。"
 CHI_16_Third_Plenum:0 "中国共产党第十六届中央委员会第三次全体会议"
 CHI_16_Third_Plenum_desc:0 "中国共产党第十六届中央委员会第三次全体会议于2003年10月11日至14日在北京举行，会议期间，中共中央政治局将向中央委员会报告工作，胡锦涛主席将在会议上确定今后数年的工作方向"
 CHI_unwaveringly_committed_to_reform_and_opening_up:0 "坚持改革开放毫不动摇"
 CHI_unwaveringly_committed_to_reform_and_opening_up_desc:0 "为什么坚持改革开放不动摇？因为它符合人民群众的共同愿望，是发展社会主义的必由之路，是党身为无产阶级先锋队的先进性的内在要求。改革开放写下了中国历史上最壮丽的史诗——中华民族大踏步赶上了时代前进潮流，社会主义中国巍然屹立在世界东方，我们党昂首阔步走在了时代前列。坚持改革开放不动摇，奏响这个当代中国的主旋律，人们有理由瞩望更加美好幸福的未来"
 CHI_developing_socialism_market_economy:0 "发展社会主义市场经济"
 CHI_developing_socialism_market_economy_desc:0 "社会主义市场经济体制是中国特色社会主义的重大理论和实践创新，是社会主义基本经济制度的重要组成部分。为适应经济全球化和科技进步加快的国际环境、全面建设小康社会的新形势，必须按照十六大提出的建成完善的社会主义市场经济体制和更具活力、更加开放的经济体系的战略部署，加快推进改革，进一步解放和发展生产力，为经济发展和社会全面进步注入强大动力"
 CHI_Adhere_to_subject_status_of_public_ownership:0 "坚持公有制主体地位"
 CHI_Adhere_to_subject_status_of_public_ownership_desc:0 "坚持公有制的主体地位，是社会主义的本质特征之一。在我国社会主义初级阶段，必须坚持和完善公有制为主体、多种所有制经济共同发展的基本经济制度。公有制主体地位是由社会主义本质所规定并由宪法固化了的法律原则，不能动摇也不会动摇。国有企业是国有经济发挥主导作用的主要载体，也是推进国家现代化、保障人民根本利益的重要力量。"
 CHI_Five_Overall_planning_and_Scientific_Outlook_on_Development:0 "五个统筹与以人为本的发展观"
 CHI_Five_Overall_planning_and_Scientific_Outlook_on_Development_desc:0 "中共中央总书记胡锦涛提出“坚持以人为本，树立全面、协调、可持续的发展观，促进经济社会和人的全面发展”的科学发展观，需按照“统筹城乡发展、统筹区域发展、统筹经济社会发展、统筹人与自然和谐发展、统筹国内发展和对外开放”的五个统筹发展要求推进各项事业的改革和发展"
 CHI_balance_urban_and_rural_development:0 "统筹城乡发展"
 CHI_balance_urban_and_rural_development_desc:0 "胡锦涛总书记提出，要更加注重农村的发展，解决好“三农”问题，坚决贯彻工业反哺农业、城市支持农村的方针，逐步改变城乡二元经济结构，逐步缩小城乡发展差距，实现农村经济社会全面发展，实行以城带乡、以工促农、城乡互动、协调发展，实现农业和农村经济的可持续发展"
 CHI_new_rural_cooperative_medical_insurance:0 "新型农村合作医疗"
 CHI_new_rural_cooperative_medical_insurance_desc:0 "社会主义怎么能少得了人民的医疗福利？2002年10月，中国明确提出各级政府要积极引导农民建立以大病统筹为主的新型农村合作医疗制度。2009年，中国作出深化医药卫生体制改革的重要战略部署，确立新农合作为农村基本医疗保障制度的地位。新型农村合作医疗是指由政府组织、引导、支持，农民自愿参加，个人、集体和政府多方筹资，以大病统筹为主的农民医疗互助共济制度。其采取个人缴费、集体扶持和政府资助的方式筹集资金。"
 CHI_Rural_planning_and_construction_and_development_of_rural_industries:0 "乡村规划建和乡村产业发展"
 CHI_Rural_planning_and_construction_and_development_of_rural_industries_desc:0 "乡村和农业是最早进入改革开放的生产领域，但如今发展得最为缓慢和落后。我们要改变目前城乡规划分割、建设分治的状况，把城乡经济社会发展统一纳入政府宏观规划，协调城乡发展，促进城乡联动，实现共同繁荣。在乡村投入更多的基础建设以向城市供给更多的人力物力资源。虽然二元化发展模式存在许多弊病，但进入城市参加大规模工业化和城市化就是农业人群最好的出路。以工业化支撑城市化，以城市化提升工业化，加快工业化和城市化进程，促进农村劳动力向二三产业转移，农村人口向城镇集聚，这是大部分国家的发展道路，我们也应该加速扩大城市就业"
 CHI_Project_Hope:0 "希望工程"
 CHI_Project_Hope_desc:0 "我们在农村的投入太少了，以至于许多农村的孩子连受教育的权利都难以保障。必须扩大教育支出，让农村的孩子们也能确保接受教育，党和国家有义务让义务教育之光照耀每一个中国的孩子————我们伟大社会主义事业的接班人。"
 CHI_Abolish_agricultural_tax:0 "废除农业税"
 CHI_Abolish_agricultural_tax_desc:0 "2006年2月22日,国家邮政局发行了一张面值80分的纪念邮票，名字叫做《全面取消农业税》，以庆祝从2006年1月1日起废止《农业税条例》。在中国沿袭两千年之久的强加给农民的税收在我们党的正确领导下终于摆脱掉了。作为政府解决“三农”问题的重要举措，停止征收农业税不仅减少了农民的负担，增加了农民的公民权利，体现了现代税收中的“公平”原则，同时还符合“工业反哺农业”的趋势。从1992年开始，中国改革开放正式对农业体制进行改革，2006年废除延续千年的农业税，标志中国进入改革开放转型新时期。"
 CHI_Regional_coordinated_development:0 "区域协调发展"
 CHI_Regional_coordinated_development_desc:0 "区域协调发展战略是党的十六届三中全会提出的“五个统筹”之一，由国务院总理温家宝提出。具体内容为： 积极推进西部大开发，振兴东北地区等老工业基地，促进中部地区崛起，鼓励东部地区率先发展，继续发挥各个地区的优势和积极性，通过健全市场机制、合作机制、互助机制、扶持机制，逐步扭转区域发展差距拉大的趋势，形成东中西相互促进、优势互补、共同发展的新格局。"
 CHI_eastern_region_leading_development:0 "东部率先发展战略"
 CHI_eastern_region_leading_development_desc:0 "我国东部在上个世纪80年代深圳特区的开放，带动了珠江三角洲地区的改革发展；90年代浦东新区的开发开放，带动了长江三角洲和长江流域的改革发展。珠三角、长三角迅速跃升为中国经济最活跃的“两极”。中国东部地区率先发展能更有力地支持推动西部开发、中部崛起和东北振兴，促进、形成东中西互动和全国经济协调发展良好局面。"
 CHI_The_rise_of_central:0 "中部崛起战略"
 CHI_The_rise_of_central_desc:0 "中部地区包括山西、安徽、江西、河南、湖北、湖南六省，国土面积102.8万平方公里，占全国陆地国土总面积的10.7%。中部地区在全国区域发展格局中具有举足轻重的战略地位。促进中部地区崛起，是落实四大板块区域布局和“三大战略”的重要内容，是构建全国统一大市场、推动形成东中西区域良性互动协调发展的客观需要，是优化国民经济结构、保持经济持续健康发展的战略举措，是确保如期实现全面建设小康社会目标的必然要求。"
 CHI_Northeast_Revitalization:0 "东北振兴战略"
 CHI_Northeast_Revitalization_desc:0 "2003年8月3日，中央政治局常委、国务院总理温家宝在长春市主持召开了振兴东北老工业最高规格的会议。他指出：实施西部大开发战略，加快东部地区发展并率先实现全面小康和现代化，支持东北地区等老工业基地加快调整、改造，实行东西互动，带动中部，促进区域经济协调发展，这是党中央作出的我国现代化建设的重大战略布局。用新思路、新体制、新机制、新方式，走出加快老工业基地振兴的新路子，打一场新世纪的“辽沈战役”"
 CHI_development_of_western_region:0 "西部大开发战略"
 CHI_development_of_western_region_desc:0 "西部大开发的范围包括12个省、自治区、直辖市：四川省、陕西省、甘肃省、青海省、云南省、贵州省、重庆市、广西壮族自治区、内蒙古自治区、宁夏回族自治区、新疆维吾尔自治区、西藏自治区。西部地区面积为685万平方公里，约占全国的71.4%。2002年末人口3.67亿人，占全国的25%。约占国内生产总值的15%。西部地区自然资源丰富，市场潜力大，战略位置重要。但由于自然、历史、社会等原因，西部地区经济发展相对落后，人均国内生产总值仅相当于全国平均水平的三分之二，不到东部地区平均水平的40%，迫切需要加快改革开放和现代化建设步伐。"
 CHI_Coordinate_economic_and_social_development:0 "统筹经济社会发展"
 CHI_Coordinate_economic_and_social_development_desc:0 "任何社会的进步都是经济、政治、文化协调发展的结果，经济是基础，政治是保证，文化是先导，三者紧密关联，互相渗透，相辅相成，统一于社会的发展之中。发展是我们党执政兴国的第一要务，经济增长是发展的重要基础，我们要大力发展公有制为主体下的国家经济。"
 CHI_Strengthening_State_Owned_Businesses:0 "强化国有企业"
 CHI_Strengthening_State_Owned_Businesses_desc:0 "国有企业是国有经济的核心载体，国企的性质，就是全民所有制企业的性质。所谓全民所有制企业，实质就是企业生产资料归全体人民共同所有的企业。而所谓全民所有制企业的性质，就是生产资料归全体人民共同所有的企业所具有的性质。因而，所谓国企的性质，实质就是生产资料属于全体人民共同所有的企业所具有的性质。国有企业是社会主义公有制的具体体现，它的成败关乎中国特色社会主义道路的兴衰，我们应以国有企业为切入点，引领中国特色社会主义市场经济蓬勃发展"
 CHI_Chinese_High_Speed_Rail_System:0 "中国国家铁路集团有限公司"
 CHI_Chinese_High_Speed_Rail_System_desc:0 "中国国家铁路集团有限公司是经国务院批准、依据《中华人民共和国公司法》设立、由中央管理的国有独资公司。想致富，先修路，像中国这样幅员辽阔的大国，需要强力、高效、广泛的交通系统支撑经济高速发展，我们应依托中国国家铁路集团有限公司建设中国的超级交通网" 
 CHI_China_Baowu_Steel_Group_Corporation_Limited:0 "中国宝武钢铁集团有限公司"
 CHI_China_Baowu_Steel_Group_Corporation_Limited_desc:0 "中国宝武钢铁集团有限公司是中央直接管理的国有重要骨干企业，总部位于上海。国家建设需要大量钢铁等金属原料，我国是世界第一大钢生产国，但依然需要大力发展钢铁产业。2016年9月22日，国务院国资委发布消息，经报国务院批准，宝钢集团有限公司与武汉钢铁（集团）公司实施联合重组"
 CHI_State_Grid_Corporation:0 "国家电网有限公司"
 CHI_State_Grid_Corporation_desc:0 "国家电网有限公司成立于2002年12月29日，是根据《公司法》规定设立的中央直接管理的国有独资公司。国家电网有限公司的职责为：构建能源互联网、保障国家能源安全、服务人民美好生活，是关系国民经济命脉和国家能源安全的特大型国有重点骨干企业。公司以投资、建设、运营电网为核心业务，承担着保障安全、经济、清洁、可持续电力供应的基本使命"
 CHI_Coordinating_Development_of_Human_and_Nature_Harmoniously:0 "统筹人与自然和谐发展"
 CHI_Coordinating_Development_of_Human_and_Nature_Harmoniously_desc:0 "胡锦涛总书记在中央党校重要讲话中强调，科学发展观，第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。全面协调可持续发展是科学发展观的内在要求。所谓可持续发展，就是要促进人与自然的和谐，实现经济发展和人口、资源、环境相协调，坚持走生产发展、生活富裕、生态良好的文明发展道路，保证一代接一代地永续发展。统筹人与自然和谐发展，是深入贯彻落实科学发展观，实现可持续发展必须加以着力解决的重要问题"
 CHI_Socialist_concept_of_honor_and_disgrace:0 "社会主义荣辱观"
 CHI_Socialist_concept_of_honor_and_disgrace_desc:0 "2006年3月4日，胡锦涛总书记在参加全国政协十届四次会议民盟、民进界委员联组讨论时提出，要引导广大干部群众，特别是青少年树立以八荣八耻为主要内容的社会主义荣辱观——以热爱祖国为荣，以危害祖国为耻。以服务人民为荣，以背离人民为耻。以崇尚科学为荣，以愚昧无知为耻。以辛勤劳动为荣，以好逸恶劳为耻。以团结互助为荣，以损人利己为耻。以诚实守信为荣，以见利忘义为耻。以遵纪守法为荣，以违法乱纪为耻。以艰苦奋斗为荣，以骄奢淫逸为耻"
 CHI_harmonious_society:0 "和谐社会"
 CHI_harmonious_society_desc:0 "构建社会主义和谐社会，是新世纪新阶段我们党从中国特色社会主义事业总体布局和全面建设小康社会全局出发提出的重大战略任务。党的十六大以来，胡锦涛同志根据国际国内形势的变化，全面分析我国发展面临的机遇和挑战，深刻阐述了构建社会主义和谐社会的重要意义、指导思想、目标任务、工作原则和重大部署，提出了一系列新思想、新观点、新论断，丰富发展了马克思主义关于社会主义社会建设的理论。胡锦涛同志关于构建社会主义和谐社会的思想，是科学发展观的重要组成部分，对于全面建成小康社会，加快推进社会主义现代化，实现中华民族伟大复兴的中国梦，具有重大而深远的指导意义"
 CHI_Developing_the_photovoltaic_industry:0 "发展绿色能源"
 CHI_Developing_the_photovoltaic_industry_desc:0 "2012年12月19日，国务院总理温家宝主持召开国务院常务会议，研究确定促进光伏产业健康发展的政策措施。光伏产业是一种优质的清洁能源。我国76%的国土光照充沛，光能资源分布较为均匀；与水电、风电、核电等相比，太阳能发电没有任何排放和噪声，应用技术成熟，安全可靠。发展清洁的绿色能源，不仅是科学发展观的内在要求，更是造福后世的百年伟业"
 CHI_Coordinate_domestic_development_and_opening_up:0 "统筹国内发展和对外开放"
 CHI_Coordinate_domestic_development_and_opening_up_desc:0 "中国不走对外侵略的帝国主义道路，近百年的血泪近代史让我们比任何一个国家的国民都更加珍视和平并反对战争。安定的外部环境才能有长久稳健的发展机遇。协调好我们伟大祖国的内外环境，创造和谐、友好的对外关系，可以让我们在中国特色社会主义征途上走得更远、更稳"
 CHI_2008_financial_crisis_CHI:0 "惊涛骇浪"
 CHI_2008_financial_crisis_CHI_desc:0 "资本主义世界终究摆脱不了周期性的经济危机，华尔街肠肥脑满的资本家们为了一点蝇头小利不惜把自己和同伙儿全部埋进坟墓里去。我们作为社会主义国家完全不需要担心他们的金融把戏，然而我们赖以为业的制造业出口却因为外国买家在金融危机中纷纷破产而遭受致命打击。这是改革开放以来我们遭受到的最大危机，党和国家必须谨慎应对这一危局。"
 CHI_a_package_Financial_plan:0 "一揽子投资计划"
 CHI_a_package_Financial_plan_desc:0 "2008年11月5日，国务院总理温家宝主持召开国务院常务会议，研究部署进一步扩大内需、促进经济平稳较快增长的措施。会议上总结出一份以国家投资为驱动的经济刺激计划，初步匡算，实施这十大措施，到2010年底约需投资4万亿人民币。"
 CHI_Shantytown_renovation:0 "棚户区改造"
 CHI_Shantytown_renovation_desc:0 "我们国内许多城市区域有因历史遗留的集中成片危旧住房、破房烂院，户距拥挤不堪，公共设施无法配套，消防出行、生产生活存在明显公共安全隐患。投资改进这些破旧地区，既提供了过剩产能流入的方向，又切实改进了人民的生活水平。对于棚户区改造，政府在财政投入、建设用地、税费和信贷等方面给予支持。2007年至2011年间，中国政府共安排补助资金730亿元，其中，超过90%的补助资金投向了中国中西部财政困难地区。"
 CHI_Accelerate_infrastructure_construction:0 "加快基建"
 CHI_Accelerate_infrastructure_construction_desc:0 "20世纪30年代，为了应对空前的经济大萧条，美国总统罗斯福推行了著名的“罗斯福新政”，其中很重要的一项政策就是政府主导的大规模基础设施建设，这些基建项目不仅提高了就业，增加了民众收入，还为后期美国经济的大发展打下了坚实的基础。“四万亿”经济刺激预计每年拉动经济增长约1个百分点，其中近一半资金投向交通基础设施和城乡电网建设，这不仅可以使我国加快摆脱全球金融危机所带来的负面作用，还可以扩大内需，刺激我国经济的发展和消费的增长。配合中央政府的计划，全国各省市政府纷纷以基础建设项目为重点，以投资拉动经济增长，2008年全社会总投资将超过16万亿元。"
 CHI_Post_disaster_reconstruction:0 "灾后重建"
 CHI_Post_disaster_reconstruction_desc:0 "汶川地震摧毁了川西地区的许多城镇，令无数同胞深陷苦海，甚至波及到周围十个省份。重建汶川，拯救身处灾难中的人民，既是我们党和国家的使命所在，也是集中社会资源、提高社会凝聚力的重要手段。救灾重建所需的大量物资，将全部由政府向国内采购。《汶川地震灾后恢复重建条例》已经2008年6月4日国务院第11次常务会议通过，现予公布，自公布之日起施行。"
 CHI_expend_welfare: "扩大民生支出"
 CHI_expend_welfare_desc: "生产总是相对过剩的，根本原因在于消费能力不足以承担需求消费。我们应该扩大对民生领域的支出，提增内需。据统计，在四万亿的投资中，民生工程即对教育、卫生、文化这些社会事业的投资占总支出的44%。"
 CHI_Made_in_China:0 "§Y“中国制造”§!"
 CHI_Made_in_China_desc:0 "从前我们国家被称为世界工厂，承接了世界上三分之一的制造业生产，为国家发展提供了前所未有的资金和机遇。然而这种依赖出口的生产模式一旦在销售环节失误，将给我们的经济带来巨大灾难，08年的金融危机就是最好的例证。在党和国家的正确领导下，我们走出了资本主义世界经济危机所带来的冲击，从一个被动接受订单的工厂国家变成了能够自主调整生产的制造大国。让中国制造的商标印在产品上吧，我们的名字将誉满全球！"
 CHI_Eliminating_Outdated_Production:0 "淘汰落后产能"
 CHI_Eliminating_Outdated_Production_desc:0 "我们不能再继续容忍那些技术水平低于行业平均的低效企业进行资源浪费，必须要借助这次机会将它们出清，这样才可以降低对资源和环境的压力，并促进产业真正的升级。"
 CHI_RMB:0 "人民币"
 CHI_RMB_desc:0 "货币主权是影响经济发展的重要因素。与其他主要经济体不同，我们的货币权始终掌握在自己手里，与美元保持着一定距离，因此可以有更多的货币政策施行空间。我们谨记上世纪如日中天的日本经济在广场协议一纸条约下被拦腰斩断的惨剧，一定要用绝对的货币主权和灵活的货币财政政策来为国家发展保驾护航。"
 CHI_prudent_monetary_policy:0 "稳健货币政策"
 CHI_prudent_monetary_policy_desc:0 "所谓稳健的货币政策，其含义是指：以币值稳定为目标，正确处理防范金融风险与支持经济增长的关系，在提高贷款质量的前提下，保持货币供应量适度增长，支持国民经济持续快速健康发展。一揽子计划向市场注入了巨量的投资，在刺激经济发展的同时也必然会带来通货膨炸等恶性后果。让央行在降准的同时控制货币发行，可以缓解注入资金带来的影响。"
 CHI_North_South_Water_Transfer: "南水北调工程"
 CHI_North_South_Water_Transfer_desc: "为了缓解我国南北方供水严重不平衡的问题，我们应该投资修建运河、水库等一系列工程，将水引向重点缺水地区。然而，这将是一项耗资巨大的工作，需要重新安置数十万人，并进行长期的高投入建设。"
 CHI_East_Line_Projec_South_to_North_Water_Diversion_Project: "南水北调东线工程"
 CHI_East_Line_Projec_South_to_North_Water_Diversion_Project_desc: "东线工程规划从江苏省扬州附近的长江干流引水，利用京杭大运河以及与其平行的河道输水，连通洪泽湖、骆马湖、南四湖、东平湖，并作为调蓄水库，经泵站逐级提水进入东平湖后，分水两路。一路向北穿黄河后自流到天津，从长江到天津北大港水库输水主干线长约1156千米；另一路向东经新辟的胶东地区输水干线接引黄济青渠道，向胶东地区供水。"
 CHI_Central_Line_Projec_of_South_to_North_Water_Diversion: "南水北调中线工程"
 CHI_Central_Line_Projec_of_South_to_North_Water_Diversion_desc: "南水北调中线工程，是从长江最大支流汉江中上游横跨湖北和河南两省的丹江口水库调水，在丹江口水库东岸河南省淅川县境内工程渠首开挖干渠，经长江流域与淮河流域的分水岭方城垭口，沿华北平原中西部边缘开挖渠道，通过隧道穿过黄河，沿京广铁路西侧北上，自流到北京市颐和园团城湖的输水工程。施南水北调中线工程后，初期年均调水量95亿立方米，后期根据需要进一步扩大调水规模，可使受水地区的缺水问题得到有效解决，生态环境将有显著改善。"
 CHI_Resettlement: "移民安置"
 CHI_Resettlement_desc: "丹江口水利枢纽工程在1958年就开始动工，在物资贫乏的年代动员了一切可用力量用以投入，然而在1962年由于存在严重质量问题而被迫中断。现在我们需要重新开始建设这一工程，首先需要把该区域内的居民搬迁至其他地区。水库淹没和移民的主要区域在河南省南阳市淅川县和湖北省丹江口市，郧县，郧西县，张湾区。"
 CHI_Danjiangkou_Reservoir: "丹江口水库"
 CHI_Danjiangkou_Reservoir_desc: "丹江口库区坐落在群山环绕之中，这里气候适宜，空气清新，日照量最高。丹江口大坝附近水质透明，水面宽阔，风平浪静，使水库具有防洪、发电、灌溉、航运、养殖。旅游等综合效益。国家重点项目南水北调大型工程的渠首，位于河南省南阳市淅川县陶岔。待其全部建成，水库将以每秒500立方米的流量，把汉江之水送往华北地区。"
 CHI_Water_conveyance_engineering: "输水工程"
 CHI_Water_conveyance_engineering_desc: "把南方的水输送到北方，需要经过穿黄工程、调水竖井、输水隧洞、U型渡槽、大坝加高等高难度工程，且耗资巨大。"
 CHI_Connect_to_Beijing: "连接北京"
 CHI_Connect_to_Beijing_desc: "我们终于将水送到了北方的心脏——伟大的首都城市北京。这不仅是中线工程的终端，北京居住着大量政治要员和商界显贵，他们终于不用担心自己必须和平头百姓一样忍受缺水的困境了，因此会给与我们大量支持。"
 CHI_Building_water_saving_society: "建设节水型社会"
 CHI_Building_water_saving_society_desc: "解决我国水资源短缺的根本矛盾要靠建设节水型社会，通过建设节水型社会，促进经济增长方式转变，改善生态环境，增强经济社会可持续发展能力。因此，建设节水型社会的意义绝不亚于三峡工程和南水北调工程。在2000年的《中共中央关于制定国民经济和社会发展第十个五年计划的建议》的文件中，首次提出“建立节水型社会”。2002年，全国人大常委会在《水法》修订案中，以法律条文明确规定建设节水型社会"
 CHI_Investigating_new_viruses: "调查新病毒"
 CHI_Investigating_new_viruses_desc: "据当地政府反应，最近在广东等第出现了一种疑似新型病毒导致的流感。广东省派出专家调查小组到中山市调查，并在2003年1月23日向全省各卫生医疗单位下发了调查报告，要求有关单位引起重视，认真抓好该病的预防控制工作。虽然还不清楚是什么情况，但我们有必要确保两会开展顺利，不能因为区区病毒影响大事。"
 CHI_Announcement: "公布消息"
 CHI_Announcement_desc: "我们不应该封锁消息，这与我们执政兴国的本质要求相违背，逃避和隐瞒并不能从根本上解决问题。向公众公开疫情情况可能会引起不安和恐慌，但是这是我们党和国家必须要面对的现实。"
 CHI_News_blackout: "封锁消息"
 CHI_News_blackout_desc: "区区几个病毒能坏什么事？顶多打几个喷嚏罢了。不能因为这点小事就让来之不易的稳定付诸东流，我们的政治资源有更值得去的地方。"
 CHI_Notify_the_World_Health_Organization: "通知世界卫生组织"
 CHI_Notify_the_World_Health_Organization_desc: "世界卫生组织已经对相关病情的传播有所察觉，我们应该早日通知他们并请求国际技术援助。"
 CHI_Stable_public_sentiment: "安抚公众情绪"
 CHI_Stable_public_sentiment_desc: "对抗病情是一场硬仗和攻防战，我们必须安抚好人民情绪，动员社会力量来对抗邪恶的病毒。"
 CHI_Emergency_measures: "紧急措施"
 CHI_Emergency_measures_desc: "很遗憾，我们的医学界和世界卫生组织都无法研究出有效防控这一病毒的措施。我们只能在发现病情的地方采取如隔离、消毒等紧急措施，以期阻断病毒继续传播的路径。"
 CHI_Ban_the_Quannengshen: "禁止全能神"
 CHI_Ban_the_Quannengshen_desc: "“全能神”是由赵维山创立、打着基督教幌子的邪教组织，又叫“东方闪电”“实际神”，1995年被中国政府依法认定为邪教。“全能神”邪教组织在中国大陆已有30年的历史，前后用过13个不同的名字，对我国人民毒害极深。是时候将这些虫豸全部连根拔起了。"
 CHI_propaganda_of_Anti_Cult_propaganda: "反邪教宣传"
 CHI_propaganda_of_Anti_Cult_propaganda_desc: "反对邪教不只是我们党和国家的职责，是每一个热爱生活的人都应该尽到的责任。加强反邪教宣传，教育人民和学校的孩子甄别各种形式邪教，我们相信终有一天能彻底杜绝这些社会中的阴暗潮湿的老鼠，中国特色社会主义伟大事业必会战胜一切牛鬼蛇神。"
 CHI_achievement: "大计划"
 CHI_achievement_desc: "我们中国特色社会主义的伟大事业当然要覆盖全方位。经过90年代的长期规划，我们在新世纪将会如期完成许多不仅属于中国，更属于全人类的壮举。我们的事业蒸蒸日上，我们的未来无比光明！"
 CHI_Chinese_nation: "中华民族认同"
 CHI_Chinese_nation_desc: "“中华民族”一词最早是梁启超在1902年《论中国学术思想变迁之大势》一文中提出的概念，但作为一个自在的民族实体，几千年来早已存在。数千年来，在中华大地上繁衍生息的各民族不断交融汇聚，特别是中国自秦汉形成统一多民族国家以来，大一统的理念深入人心，各民族在分布上交错杂居、经济上相互依存、文化上兼收并蓄、情感上相互亲近，最终形成了多元一体的中华民族。我们国土上的每一个民族都将在伟大中国共产党的领导之下，如石榴籽一样紧紧团结在一起，稳步迈向中华民族伟大复兴的千秋伟业。"
 CHI_History_and_Future: "历史与未来"
 CHI_History_and_Future_desc: "胡锦涛总书记在纪念中国人民抗日战争暨世界反法西斯战争胜利60周年大会上提出“前事不忘，后事之师”。我们强调牢记历史并不是要延续仇恨，而是要以史为鉴、面向未来。日本是我们的邻邦，虽然过去日本法西斯帝国主义曾经发动了残忍的侵华战争，但只要日本愿意拥抱和平，我们也应当和他们一同维护来之不易的和平。"
 CHI_Friends_from_afar: "有朋自远方来"
 CHI_Friends_from_afar_desc: "台湾已经脱离我们伟大祖国的怀抱许多年了，由于意识形态冲突以及各方利益牵扯在一起，台湾问题始终是一盘剪不断理还乱的混棋。好在现任台湾地区领导人是一位仍拥护一个中国原则的大格局者，我们应该礼待他的到来。"
 CHI_Opening_Tourism_to_Taiwan: "放宽对台旅游限制"
 CHI_Opening_Tourism_to_Taiwan_desc: "我们将逐步开放居民对台湾的自由旅行，以深化两岸之间的文化交流。"
 CHI_The_Four_Megaprojects_of_China_in_New_Century: "中国新世纪四大工程"
 CHI_The_Four_Megaprojects_of_China_in_New_Century_desc: "我们社会主义的事业能创造一起奇迹。在党的正确领导下，人民群众的力量是无穷无尽的，能够建设起人类历史上的奇迹工程。在“十五”计划期间，我国重点进行开发建设的青藏铁路、西气东输、西电东送、南水北调等四项工程被称为“中国新世纪四大工程”。其中除南水北调工程外，其他三项也是西部大开发的重点工程。"
 CHI_Qinghai_Tibet_Railway_Completed: "青藏铁路全线通车"
 CHI_Qinghai_Tibet_Railway_Completed_desc: "西藏地区是改革开放以来我国发展最慢、建设难度最高的地区，直到如今也没有一条像样的铁路能通到首府拉萨。我们的中国特色社会主义伟大征程上怎么能少了藏族同胞？我们将征服青藏高原和世界屋脊，让藏族人民也能拥抱到伟大祖国母亲！把铁路修到天上去！"
 CHI_project_of_natural_gas_transmission_from_West_to_East: "西气东输工程"
 CHI_project_of_natural_gas_transmission_from_West_to_East_desc: "在我国西部有数不清的化石燃料资源，但东部发达地区却十分缺乏天然气等资源。将西部的天然气运送到东部去，以便东部型城市的居民也能用上充足的天然气。"
 CHI_West_East_electricity_transmission_project: "西电东送工程"
 CHI_West_East_electricity_transmission_project_desc: "在西部直接发电输送到东部去，既能促进西部产业发展，又能减少资源运送过程中的损耗。"
 CHI_CTL: "煤制油技术"
 CHI_CTL_desc: "煤制油是以煤炭为原料，通过化学加工过程生产油品和石油化工产品的一项技术。我国煤炭资源丰富，为保障国家能源安全，满足国家能源战略对间接液化技术的迫切需要，2001年国家科技部”863”计划和中国科学院联合启动了”煤制油”重大科技项目。两年后，承担这一项目的中科院山西煤化所已取得了一系列重要进展。我国研制的煤制油与常见的柴油判若两物，清澈透明，几乎无味，硫、氮等污染物含量极低，十六烷值高达75以上，具有高动力、无污染特点，比欧Ⅳ标准高20倍，属优异的环保型清洁燃料。"
 CHI_Continue_build_fossil_fuel_power: "继续扩建化石燃料发电厂"
 CHI_Continue_build_fossil_fuel_power_desc: "经济的快速发展让能源需求快速上涨，继续建造更多的发电厂！"
 CHI_The_Eleventh_Five_Year_Plan: "第十一个五年规划"
 CHI_The_Eleventh_Five_Year_Plan_desc: "2005年10月，中共十六届五中全会通过了《中共中央关于制定国民经济和社会发展第十一个五年规划的建议》。2006年3月，第十届全国人民代表大会第四次会议审议通过了《国民经济和社会发展第十一个五年规划纲要》。“十一五”规划是提出科学发展观后制定的第一个五年规划，与以往的五年计划相比具有转折性意义，其主要任务是：全面贯彻落实科学发展观。坚持“六个必须”原则：即必须保持经济平稳较快发展，必须加快转变经济增长方式，必须提高自主创新能力，必须促进城乡区域协调发展，必须加强和谐社会建设，必须不断深化改革开放。"
 CHI_Peaceful_diplomacy: "和平外交"
 CHI_Peaceful_diplomacy_desc: "没有哪个国家比中国更热爱和平，没有哪个民族比中华民族更珍视和平。我们绝不搞霸权主义和强权政治，无论外国人如何诬蔑、抹黑我国，我国自1949年建国以来从未发起过任何侵略战争，今后也永远不会。在和平的呼声中，我们将以新时代的面貌出现在国际舞台上。"
 CHI_manned_space_flight: "载人航天"
 CHI_manned_space_flight_desc: "我国终于将第一位中国航天员杨利伟同志送上了太空，这位光荣的共产党员承载着全中国的宇航希望。数百年前我们国家错过了大航海时代，如今我们绝不会再错过太空时代。"
 CHI_United_Nations_Millennium_Summit: "联合国千禧年首脑会议"
 CHI_United_Nations_Millennium_Summit_desc: "2000年9月6日至8日，联合国千年首脑会议在纽约联合国总部举行，会议的主题是“21世纪联合国的作用”。这次联合国千年首脑会议规模空前，180多个国家的代表，其中包括150多个国家的元首或政府首脑出席了会议，数量超过1995年举行的联合国成立50周年庆典。江主席在会议上发表了呼吁世界和平和全世界携手共进的演讲，赢得了全场掌声。"
 CHI_2008_Olympic_Games: "2008年北京奥运会"
 CHI_2008_Olympic_Games_desc: "同一个世界，同一个梦想，世界人民将见证中华民族伟大复兴的光荣事业蒸蒸日上！"
 CHI_Embrace_Internet: "拥抱互联网"
 CHI_Embrace_Internet_desc: "互联网已经是我国人民生活中的重要部分，也是有助于行政管理的好工具。我们应该积极拥抱这一新兴事物，用更为实用的态度接纳互联网，而不是视之为洪水猛兽。"
 CHI_QQ: "腾讯QQ"
 CHI_QQ_desc: "腾讯QQ是腾讯公司推出的一款基于互联网即时通信软件，经过数年的发展后，QQ已成为许多人的日常通讯工具。"
 CHI_Taobao: "淘宝网"
 CHI_Taobao_desc: "淘宝网是亚太地区较大的网络零售、商圈，由阿里巴巴集团在2003年5月创立，引领中国的电子商务发展。"
 CHI_JD: "京东"
 CHI_JD_desc: "1998年6月18日，刘强东在中关村成立京东公司，并很快发展成为中国最具影响力的电子销售平台。"
 CHI_17_Third_Plenum: "中国共产党第十七次全国代表大会"
 CHI_17_Third_Plenum_desc: "中国共产党第十七次全国代表大会于2007年10月15日至21日在北京召开。大会主题是：高举中国特色社会主义伟大旗帜，以邓小平理论和“三个代表”重要思想为指导，深入贯彻落实科学发展观，继续解放思想，坚持改革开放，推动科学发展，促进社会和谐，为夺取全面建设小康社会新胜利而奋斗。胡锦涛代表第十六届中央委员会向大会作了题为《高举中国特色社会主义伟大旗帜，为夺取全面建设小康社会新胜利而奋斗》的报告。"
 CHI_China_Japan_Trade: "中日贸易"
 CHI_China_Japan_Trade_desc: "中国和日本都是世界上经济最发达的国家之一，两国自70年代关系正常化后贸易额不断攀升。进入本世纪后，中日双边贸易的发展速度进一步加快，特别是在2002年、2006年和2011年，中日贸易额又分别突破1000亿美元、2000亿美元和3000亿美元大关，中国分别于2007年和2009年成为日本第一大贸易伙伴和第一大出口市场。"
 CHI_welcome_Japanese_Culture: "欢迎日本文化"
 CHI_welcome_Japanese_Culture_desc: "日本和我们一样，有丰富的传统文化，同时也有极为发达的现代流行文化。动漫、音乐、电子游戏等日本流行文化在我国年轻人中十分有人气，我们应该欢迎并欣赏这位邻居的风格。"
 CHI_JAP_apologize_crime: "正视侵华历史"
 CHI_JAP_apologize_crime_desc: "历史上日本对中华民族带来了惨痛的灾难，我们理应要求日本正确看待历史，而非继续以往扭曲历史的错误行为，这也能检验他们是否真的热爱和平。"
 CHI_under_the_same_sky: "山川异域，风月同天"
 CHI_under_the_same_sky_desc: "无论我们如何厌恶日本，中日两国在地理上是彼此的邻居，是一衣带水的邻邦。中日两国的历史恩怨不应该成为阻碍两国人民和平交流的桎梏，我们应该以更为宽容的大国风范友善对待热爱和平的日本人民————只要他们仍然珍视和拥护和平，谁会去把一个只关注内部的小岛当作敌人呢。"
 CHI_Korean_Peninsula: "朝鲜半岛"
 CHI_Korean_Peninsula_desc: "朝鲜半岛上的两个敌对国家是冷战的产物，美苏两个大国为了本国利益而在二战结束后的朝鲜半岛生造出两个彼此对的政权，美国更是在50年代阻碍了朝鲜发动的祖国统一战争。中国在这一地区有不亚于美国的影响力，作为热爱和平的大国，我们有责任抚平朝鲜半岛人民受到的创伤，并维持半岛的和平局面————这也是为了中国的和平。"
 CHI_Maintain_Commitment_of_Denuclearization: "保持无核化承诺"
 CHI_Maintain_Commitment_of_Denuclearization_desc: "朝鲜出于维护自身国家安全而发展核武器的本心我们当然理解，但核武器毕竟是威胁和平发展的最大隐患。鉴于朝鲜半岛和平对中国的意义，以及我们对朝鲜无可置疑的影响力，我们当然可以要求他们保持无核化的承诺————起码在口头上承诺。"
 CHI_Increase_Exports_to_the_North_Korea: "增加对朝鲜的出口"
 CHI_Increase_Exports_to_the_North_Korea_desc: "朝鲜长期受到国际制裁，这限制了他们的进出口，甚至间接酿成了苦难行军的程度加深。我们对这为可怜的邻居开了许多后门，如今我们可以进一步扩大对朝鲜的贸易，以帮助他们的经济更好成长。中国永远会帮助弱小的国家。"
 CHI_Strengthen_Relations_with_South_Korea: "加强与韩国的关系"
 CHI_Strengthen_Relations_with_South_Korea_desc: "韩国与我国有较大的贸易关系，且两国没有历史仇恨和其他利益冲突，并且双方都有对于曾被日本侵略的共同历史记忆和国家未获统一的遗憾。对于这位邻居，我们需要巩固彼此之间的关系，无论是经济上还是政治上。"
 CHI_China_and_Korea_Free_Trade_Agreement: "中韩自贸区"
 CHI_China_and_Korea_Free_Trade_Agreement_desc: "中国和韩国在经济上既有合作又有竞争，我们计划在两国设立自贸区以进一步加深两国贸易往来。虽然现在还处于交涉和计划之中，而且美国一定会从中作梗，但我们有信心达成这一造福两国人民的共识。"
 CHI_the_Golden_Shield_Project: "金盾工程"
 CHI_the_Golden_Shield_Project_desc: "“金盾”工程，实质上就是公安通信网络与计算机信息系统建设工程。是国家电子政务建设的12个重要业务系统之一。2003年8月，经国务院批准、国家发改委正式批复了《“金盾”工程初步设计方案和资金概算》。2003年9月2日至3日，公安部组织召开了全国“金盾”工程工作会议，标志着“金盾”工程建设正式启动。2006年05月19日，全国“金盾工程”一期建设项目如期完成。这有助于我国控制日益增长的互联网乱象，加强安全治理效果。"
 CHI_The_Great_Firewall: "防火长城"
 CHI_The_Great_Firewall_desc: "互联网是一片我们尚未完全熟悉的领域，我们也缺乏互联网社会治理的经验。中国人民在意识形态、生活环境、历史认知上与其他国家的人存在巨大差异，以美国为首的国家也不断试图利用互联网来加深对我国的意识形态渗透，这对我国社会安全和稳定构成了巨大挑战。建立信息防火长城来抵御外国互联网对于中国社会的威胁，刻不容缓。"
 CHI_2009_National_Day_military_parade: "2009年国庆大阅兵"
 CHI_2009_National_Day_military_parade_desc: "中华人民共和国国庆六十周年阅兵是新中国历史上第十四次大阅兵，也是进入21世纪以来第一次大阅兵，国家主席胡锦涛在天安门上检阅了解放军部队，全面展示中国人民解放军武器装备和信息化建设成就，展现了我们伟大的社会主义祖国经济和科技的发展。毛泽东主席曾说过“一切帝国主义都是纸老虎”，让一切妄图颠覆中国的敌对国家和阴沟老鼠都颤抖罢！没有人能阻碍中国实现伟大复兴！"
 CHI_Expo_2010_Shanghai: "2010年上海世界博览会"
 CHI_Expo_2010_Shanghai_desc: "中国2010年上海世界博览会是第41届世界博览会，于2010年5月1日至10月31日期间在中国上海市举行。本次世博会也是由中国举办的首届注册类世界博览会，主题为“城市，让生活更美好”。我们的社会主义事业成果在世界人民面前展现，我们的社会主义道路无限宽广。"
 CHI_action_of_Crime_crackdown: "打黑除恶"
 CHI_action_of_Crime_crackdown_desc: "2000年底，我国首次开展“打黑除恶”专项斗争。中共中央、国务院发出《关于开展扫黑除恶专项斗争的通知》，决定在全国范围内开展为期三年的扫黑除恶专项斗争。"
 CHI_continue_Crime_crackdown_action: "继续打黑除恶"
 CHI_continue_Crime_crackdown_action_desc: "2006年2月，中央政法委部署全国开展打黑除恶专项斗争，在中央成立了打黑除恶专项斗争协调小组，并设立全国“打黑办”。此后，每年都召开一次全国会议，中央领导同志亲自动员部署，各地区、各部门深入推进。"
 CHI_Revision_of_Criminal_Law: "修订《刑法》"
 CHI_Revision_of_Criminal_Law_desc: "为了更有效打击黑恶势力的经济依托，2011年2月25日，第十一届全国人大常委会第十九次会议上通过了《刑法修正案（八）》，对黑社会性质组织犯罪增加了财产刑。最高法的有关司法解释也规定，对黑社会性质组织及其成员聚敛的财物及其收益以及用于犯罪的工具等，都应当依法追缴没收。"
 CHI_Remove_protective_umbrella: "取下保护伞"
 CHI_Remove_protective_umbrella_desc: "“保护伞”一直是助长黑恶势力蔓延、猖獗的重要因素，也一直是打黑除恶专项工作的重点对象。要严格贯彻宽严相济的刑事政策，对黑社会性质组织犯罪组织者、领导者、骨干成员及其“保护伞”要依法从严惩处，对犯罪情节较轻的其他参加人员要依法从轻、减轻处罚。把扫黑除恶与反腐败结合，规定“对扫黑除恶专项斗争中发现的‘保护伞’问题线索优先处置，发现一起、查处一起，不管涉及什么官老爷，都要一查到底、绝不姑息。尤其要抓住涉黑涉恶和腐败长期、深度交织的案件以及脱贫攻坚领域涉黑涉恶腐败案件重点督办。"
 CHI_Performance_indicators: "政绩指标"
 CHI_Performance_indicators_desc: "官员升迁需要有政绩，把扫黑除恶作为重大政治任务来抓，加入政绩考察的标准，可以有效策动地方官员抓捕黑恶势力。但这绝不意味着可以放宽黑社会性质组织认定的标准，将扫黑除恶扩大化，甚至为了完成某些指标、参与某些排名，以追求政绩的态度对于扫黑除恶。"
 CHI_rewards_to_informants: "奖励检举"
 CHI_rewards_to_informants_desc: "群众的眼睛是雪亮的。长久以来，黑恶势力采取恐吓、威胁和报复的手段迫害检举者，导致人人自危，不敢举报。我们不仅要奖励勇敢发声的人，更要保护他们不遭非法迫害。"
 CHI_Initial_results: "初见成效"
 CHI_Initial_results_desc: "经过一系列深度打黑除恶工作，猖獗的黑恶势力境况已得到控制，不再有肆无忌惮大摇大摆的黑恶势力在社会上公开横行霸道。尽管如此，在一些我们无法管控到的地方仍有黑恶势力在作祟。"
 CHI_Keep_up_good_work: "乘胜追击"
 CHI_Keep_up_good_work_desc: "对付黑恶势力是一项长期的工作，我们始终要保持警惕心，将打黑除恶工作常态化、群众化，决不能在关键时刻功亏一篑。"
 CHI_Acquisition_of_foreign_bankrupt_enterprises: "收购海外破产企业"
 CHI_Acquisition_of_foreign_bankrupt_enterprises_desc: "全球金融危机淹没了无数海外企业，大量企业纷纷宣告破产。这是一个巨大的机会，我们将用长久以来积累的外汇来低价收购这些破产的企业，变成巨量海外资产。"
 CHI_US_Treasury_Securities: "收购美债"
 CHI_US_Treasury_Securities_desc: "美国金融危机导致美元出现了相对贬值，同时各国也由于挤兑美元而造成大量美元入市。趁此机会迅速买下大量廉价美债是一项掌控国际金融话语权的重要行动，也是提高我国对美话语权的有效途径。"
 CHI_lower_required_reserve_ratios_of_Central_Bank: "央行降准"
 CHI_lower_required_reserve_ratios_of_Central_Bank_desc: "尽管我国要实行稳健的货币政策，然而眼下必须要继续命令央行降低准备金，以发行更多贷款，用更多金融杠杆撬动经济发展。虽然这会造成一定通胀和不良经济影响，但相比于急需应对的金融危机来说简直不值一提。"
 CHI_Ensure_the_flow_of_funds: "确保资金流动"
 CHI_Ensure_the_flow_of_funds_desc: "我们发行了大量货币和贷款，这些钱应该按照我们的计划流进制造业和内需领域，不能放任资金在坏账堆里空转。对于不愿服从的企业，就让他破产，再合并进国企。真以为这儿是资本主义国家？"
 CHI_Grand_Design: "大计划"
 CHI_Grand_Design_desc: "我们中国特色社会主义的伟大事业当然要覆盖全方位。经过90年代的长期规划，我们在新世纪将会如期完成许多不仅属于中国，更属于全人类的壮举。我们的事业蒸蒸日上，我们的未来无比光明！"
 CHI_Baoshan_Iron_and_Steel_Co_Ltd: "宝山钢铁股份有限公司"
 CHI_Baoshan_Iron_and_Steel_Co_Ltd_desc: "宝山钢铁股份有限公司是中国最大、最现代化的钢铁联合企业，总部位于上海市宝山区。《世界钢铁业指南》评定宝钢股份在世界钢铁行业的综合竞争力为前三名，认为也是未来最具发展潜力的钢铁企业。"
 The_17th_National_Congress_of_the_CPC: "中国共产党第十七次全国代表大会"
 The_17th_National_Congress_of_the_CPC_desc: "中国共产党第十七次全国代表大会于2007年10月15日至21日在北京召开。大会主题是：高举中国特色社会主义伟大旗帜，以邓小平理论和“三个代表”重要思想为指导，深入贯彻落实科学发展观，继续解放思想，坚持改革开放，推动科学发展，促进社会和谐，为夺取全面建设小康社会新胜利而奋斗。胡锦涛代表第十六届中央委员会向大会作了题为《高举中国特色社会主义伟大旗帜，为夺取全面建设小康社会新胜利而奋斗》的报告。"
 CHI_Work_Summary_16: "工作总结"
 CHI_Work_Summary_16_desc: "胡锦涛总书记在报告中回顾了党的十六大以来我国各项事业取得的新成就：经济实力大幅提升，改革开放取得重大突破，人民生活显著改善，民主法制建设取得新进步，文化建设开创新局面，社会建设全面展开，国防和军队建设取得历史性成就，港澳工作和对台工作进一步加强，全方位外交取得重大进展，党的建设新的伟大工程扎实推进。"
 CHI_Deeply_implement_the_Scientific_Outlook_on_Development: "深入贯彻科学发展观"
 CHI_Deeply_implement_the_Scientific_Outlook_on_Development_desc: "大会通过了关于《中国共产党章程（修正案）》的决议，决定这一修正案自通过之日起生效。大会认为，科学发展观，是对党的三代中央领导集体关于发展的重要思想的继承和发展，是马克思主义关于发展的世界观和方法论的集中体现，是同马克思列宁主义、毛泽东思想、邓小平理论和“三个代表”重要思想既一脉相承又与时俱进的科学理论，是我国经济社会发展的重要指导方针，是发展中国特色社会主义必须坚持和贯彻的重大战略思想。大会一致同意将科学发展观写入党章。"
 CHI_continue_Comprehensively_building_a_moderately_prosperous_society: "§Y实现全面建设小康社会奋斗目标的新要求§!"
 CHI_continue_Comprehensively_building_a_moderately_prosperous_society_desc: "胡锦涛在报告中提出实现全面建设小康社会奋斗目标的新要求：增强发展协调性，努力实现经济又好又快发展；扩大社会主义民主，更好保障人民权益和社会公平正义；加强文化建设，明显提高全民族文明素质；加快发展社会事业，全面改善人民生活；建设生态文明，基本形成节约能源资源和保护生态环境的产业结构、增长方式、消费模式。"
 CHI_Socialist_core_value_system: "社会主义核心价值体系"
 CHI_Socialist_core_value_system_desc: "2007年，胡锦涛总书记在“6·25”重要讲话中强调，要大力建设社会主义核心价值体系，巩固全党全国人民团结奋斗的共同思想基础。社会主义核心价值体系包括四个方面的基本内容，即马克思主义指导思想、中国特色社会主义共同理想、以爱国主义为核心的民族精神和以改革创新为核心的时代精神、社会主义荣辱观。"
 CHI_The_twelfth_Five_Year_Plan: "第十二个五年规划"
 CHI_The_twelfth_Five_Year_Plan_desc: "2010年10月正式召开中共十七届五中全会，由国务院总理代表中央政治局作《关于制定国民经济和社会发展第十二个五年规划建议的说明》，全会审议和通过《中共中央关于制定国民经济和社会发展第十二个五年规划的建议》，并正式对外公布。党中央的《建议》分析国内外形势，根据中国基本国情和发展阶段，提出规划的经济社会主要目标、指导方针、重要原则、重点战略和主要任务，为制定“十二五”规划纲要奠定基础。"
 CHI_The_sixth_National_Population_Census: "第六次全国人口普查"
 CHI_The_sixth_National_Population_Census_desc: "国务院决定2010年开展第六次全国人口普查。"
 CHI_The_Fifth_National_Population_Census: "第五次全国人口普查"
 CHI_The_Fifth_National_Population_Census_desc: "我国政府于2000年11月1日进行了第五次全国人口普查的登记工作。"
 CHI_Reform_of_registered_residence_management_system: "户籍管理制度改革"
 CHI_Reform_of_registered_residence_management_system_desc: "近年来，各地区、各有关部门认真贯彻国家有关推进城镇化和户籍管理制度改革的决策部署，努力解决实践中的突出问题，取得明显成效。最近一个时期，一些地方积极探索，又相继推出农村人口落户城镇的政策措施，积累了一些经验，也出现了一些不容忽视的问题。有的地方不顾当地经济社会发展实际情况，片面追求城镇规模城镇化速度；有的地方不分城市类别不顾城市综合承载能力，一味放宽落户城市的条件；有的地方擅自突破国家政策，损害群众切身利益。对这些问题如不高度重视并及时妥善解决，就会严重影响城镇化依法健康有序进行，严重影响经济平稳较快发展和社会和谐稳定，也直接影响户籍管理制度改革的顺利推进。"
 CHI_China_ASEAN_Free_Trade_Area: "中国-东盟自由贸易区"
 CHI_China_ASEAN_Free_Trade_Area_desc: "中国-东盟自由贸易区是世界上人口最多的自由贸易区、由发展中国家组成的最大自由贸易区。经历金融危机后，东盟更加明确了地区需要加快经济一体化，以建立有效的合作机制来防止危机的再次发生和冲击。我国是一个可以信赖的合作伙伴，因而选择和中国建立区域经济合作机制，即中国—东盟自由贸易区成为必然而积极的选择。"
 CHI_Anti_corruption_measures: "发布系列反腐措施"
 CHI_Anti_corruption_measures_desc: "胡锦涛主席在元旦全国政协新年茶话会上提醒，要深入推进党风廉政建设和反腐败斗争，不断提高党的领导水平和执政水平，为全面建设小康社会、坚持和发展中国特色社会主义提供可靠政治和组织保障。4月，中纪委发布《〈党员领导干部廉洁从政若干准则〉实施办法》，对“以借为名占用”、“可能影响公正执行公务”、“多占住房”、“个人或者借他人名义经商、办企业”、“以象征性地支付钱款等方式”等18个概念进行了逐一解释。"
 CHI_Diaoyu_Islands: "重申钓鱼岛主权"
 CHI_Diaoyu_Islands_desc: "钓鱼岛自古以来就是我国不可分割的一部分，在近代被日本无理掠夺战略。二战结束后，日本理应放弃除四个本岛以外的所有领土，如今竟然无耻声称钓鱼岛是他们的领土，首相甚至登岛作秀，严重挑衅了我国。我们虽然秉持和平发展的原则，但绝不会接受这种赤裸裸的羞辱。"
 CHI_Establishment_of_Sansha_City: "成立三沙市"
 CHI_Establishment_of_Sansha_City_desc: "2012年6月21日，民政部网站刊登《民政部关于国务院批准设立地级三沙市的公告》。国务院批准，撤销海南省西沙群岛、南沙群岛、中沙群岛办事处，设立地级三沙市，管辖西沙群岛、中沙群岛、南沙群岛的岛礁及其海域。三沙市人民政府驻西沙永兴岛。7月24日，三沙市成立大会暨揭牌仪式举行。此次设立地级三沙市，是我国对海南省西沙群岛、中沙群岛、南沙群岛的岛礁及其海域行政管理体制的调整和完善。设立三沙市有利于进一步加强我国对西沙群岛、中沙群岛、南沙群岛的岛礁及其海域的行政管理和开发建设，保护南海海洋环境。"
 CHI_Golden_Sun_Initiative: "金太阳示范工程"
 CHI_Golden_Sun_Initiative_desc: "金太阳示范工程是我国促进光伏发电产业技术进步和规模化发展，培育战略性新兴产业，支持光伏发电技术在各类领域的示范应用及关键技术产业化的具体行动，计划在2～3年时间内实施完成。纳入金太阳示范工程的项目原则上按光伏发电系统及其配套输配电工程总投资的50%给予补助，偏远无电地区的独立光伏发电系统按总投资的70%给予补助。"
 CHI_Revitalization_of_cultural_industry: "文化产业振兴"
 CHI_Revitalization_of_cultural_industry_desc: "文化产业发展是发展先进生产力、改善经济产业结构的必经之路。党的十七大明确提出，要积极发展公益性文化事业，大力发展文化产业，激发全民族文化创造活力，更加自觉、更加主动地推动文化大发展大繁荣。"
 CHI_The_main_functional_area_planning: "全国主体功能区规划"
 CHI_The_main_functional_area_planning_desc: "全国主体功能区规划，就是要根据不同区域的资源环境承载能力、现有开发密度和发展潜力，统筹谋划未来人口分布、经济布局、国土利用和城镇化格局，将国土空间划分为优化开发、重点开发、限制开发和禁止开发四类，确定主体功能定位，明确开发方向，控制开发强度，规范开发秩序，完善开发政策，逐步形成人口、经济、资源环境相协调的空间开发格局。2011年6月8日，《全国主体功能区规划》正式发布。"
 CHI_18th_National_Congress_of_CPC: "中国共产党第十八次全国代表大会"
 CHI_18th_National_Congress_of_CPC_desc: "中国共产党第十八次全国代表大会于2012年11月8日在北京召开。党的十八大报告一开篇就明确指出，这次代表大会是在我国进入全面建成小康社会决定性阶段召开的一次十分重要的大会。这个判断，深刻揭示了党的十八大的重大意义。大会选举了新一届的中共中央领导层，即习近平同志。"
 CHI_Xi_Jinping_Agenda: "习近平的议程"
 CHI_Xi_Jinping_Agenda_desc: "十二届全国人大第一次会议上，习近平同志毫无疑问地当选为中华人民共和国主席、中华人民共和国中央军事委员会主席。十九届一中全会任中共中央军事委员会主席。国家权力已逐步转交给这位开国元勋的儿子——雄心壮志的“改革家”了。"
 CHI_FAST: "中国天眼"
 CHI_FAST_desc: "500米口径球面射电望远镜，又称中国天眼，位于中国贵州省黔南布依族苗族自治州境内，是“十一五”重大科技基础设施建设项目。于2011年3月25日动工兴建，2016年9月25日落成启动。500米口径球面射电望远镜开创了建造巨型望远镜的新模式，建设了反射面相当于30个足球场的射电望远镜，灵敏度达到世界第二大望远镜的2.5倍以上，大幅拓展人类的视野，用于探索宇宙起源和演化。"
 CHI_Beijing_Daxing_International_Airport: "北京大兴国际机场"
 CHI_Beijing_Daxing_International_Airport_desc: "北京大兴国际机场，位于中国北京市大兴区榆垡镇、礼贤镇和河北省廊坊市广阳区之间，北距天安门46千米、北距北京首都国际机场67千米、南距雄安新区55千米、西距北京南郊机场约640米，为4F级国际机场、世界级航空枢纽、国家发展新动力源。"
 CHI_HKZM_Bridge: "港珠澳大桥"
 CHI_HKZM_Bridge_desc: "港珠澳大桥，是中华人民共和国境内一座连接香港、广东珠海和澳门的桥隧工程，位于广东珠江口伶仃洋海域内，为珠江三角洲地区环线高速公路南环段。港珠澳大桥东起香港国际机场附近的香港口岸人工岛，向西横跨南海伶仃洋水域接珠海和澳门人工岛，止于珠海洪湾立交。桥隧全长55千米，其中主桥29.6千米、香港口岸至珠澳口岸41.6千米。桥面为双向六车道高速公路，设计速度100千米/小时。工程项目总投资额1269亿元。于2009年12月15日动工建设，2017年7月7日实现主体工程全线贯通，2018年2月6日完成主体工程验收。"
 CHI_bohai_Bridge: "渤海大桥"
 CHI_bohai_Bridge_desc: "在获取到港珠澳大桥的建设经验后，加上日渐进步的建造技术突破，我们可以尝试在渤海建立一条连接山东和辽宁的大桥。"
 CHI_The_Thirteenth_Five_Year_Plan: "第十三个五年规划"
 CHI_The_Thirteenth_Five_Year_Plan_desc: "2016年3月16日，十二届全国人大四次会议上通过了《中共中央关于制定国民经济和社会发展第十三个五年规划的建议》，设计了2016至2020年中国经济社会发展的宏伟蓝图。主要目标为：经济保持中高速增长，在提高发展平衡性、包容性、可持续性的基础上，到2020年国内生产总值和城乡居民人均收入比2010年翻一番，产业迈向中高端水平，消费对经济增长贡献明显加大，户籍人口城镇化率加快提高。农业现代化取得明显进展，人民生活水平和质量普遍提高，我国现行标准下农村贫困人口实现脱贫，贫困县全部摘帽，解决区域性整体贫困。国民素质和社会文明程度显著提高。生态环境质量总体改善。各方面制度更加成熟更加定型，国家治理体系和治理能力现代化取得重大进展。"
 CHI_The_Fourteenth_Five_Year_Plan: "第十四个五年规划"
 CHI_The_Fourteenth_Five_Year_Plan_desc: "2021年3月11日，十三届全国人大四次会议表决通过了关于国民经济和社会发展第十四个五年规划和2035年远景目标纲要的决议。该时期的经济社会发展主要目标：经济发展取得新成效；改革开放迈出新步伐；社会文明程度得到新提高；生态文明建设实现新进步；民生福祉达到新水平；国家治理效能得到新提升。"
 CHI_The_seventh_National_Population_Census: "第七次全国人口普查"
 CHI_The_seventh_National_Population_Census_desc: "国务院决定在2020年开展第七次全国人口普查，普查标准时点是2020年11月1日零时，旨在彻查人口出生变动情况以及房屋情况。"
 CHI_18_Third_Plenum: "中国共产党第十八届中央委员会第三次全体会议"
 CHI_18_Third_Plenum_desc: "中国共产党第十八届中央委员会第三次全体会议于2013年11月9日至12日在北京召开，中共中央总书记习近平主持会议。主要议程是中共中央政治局向中央委员会报告工作，研究全面深化改革重大问题。11月12日，会议审议通过《中共中央关于全面深化改革若干重大问题的决定》，并在北京圆满闭幕。"
 CHI_Comprehensively_deepen_ecnomic_reform: "全面深化经济改革"
 CHI_Comprehensively_deepen_ecnomic_reform_desc: "我们的主要任务是经济建设，经济体制改革是全面深化改革的重点，其核心问题是如何处理好政府和市场的关系，使市场在资源配置中起决定性作用和更好地发挥政府作用；坚持和完善基本经济制度，加快完善现代市场体系、宏观调控体系、开放型经济体系，加快转变经济发展方式，加快建设创新型国家，推动经济更有效率、更加公平、更可持续发展；以经济建设为中心，发挥经济体制改革牵引作用，推动生产关系同生产力、上层建筑同经济基础相适应，推动经济社会持续健康发展。"
 CHI_Leading_Group_for_Comprehensively_Deepening_Reform: "全面深化改革领导小组"
 CHI_Leading_Group_for_Comprehensively_Deepening_Reform_desc: "党领导一切，全面深化改革的工作要交给党内的专门人员做。中央成立全面深化改革领导小组，负责改革总体设计、统筹协调、整体推进、督促落实。各级党委要切实履行对改革的领导责任。"
 CHI_The_Fifth_Modernization: "第五个现代化"
 CHI_The_Fifth_Modernization_desc: "1964年12月第三届全国人民代表大会第一次会议上，周恩来总理根据毛泽东主席建议，在政府工作报告中首次提出，在二十世纪内，把中国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国，实现四个现代化目标。如今我们已经接近完成这四个现代化，需要提出第五个现代化——推进国家治理体系和治理能力现代化。"
 CHI_Socialist_core_values: "社会主义核心价值观"
 CHI_Socialist_core_values_desc: "党的十八大提出，倡导富强、民主、文明、和谐，倡导自由、平等、公正、法治，倡导爱国、敬业、诚信、友善，积极培育和践行社会主义核心价值观。富强、民主、文明、和谐是国家层面的价值目标，自由、平等、公正、法治是社会层面的价值取向，爱国、敬业、诚信、友善是公民个人层面的价值准则，这24个字是社会主义核心价值观的基本内容。"
 CHI_Building_ecological_civilization: "建设生态文明"
 CHI_Building_ecological_civilization_desc: "我们要围绕建设美丽中国深化生态文明体制改革，加快建立生态文明制度，健全国土空间开发、资源节约利用、生态环境保护的体制机制，推动形成人与自然和谐发展现代化建设新格局。建设生态文明，必须建立系统完整的生态文明制度体系，用制度保护生态环境。健全自然资源资产产权制度和用途管制制度，划定生态保护红线，实行资源有偿使用制度和生态补偿制度，改革生态环境保护管理体制。"
 CHI_The_Four_Pronged_Comprehensive_Strategy: "四个全面战略布局"
 CHI_The_Four_Pronged_Comprehensive_Strategy_desc: "“四个全面”战略布局，即全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。"
 CHI_Comprehensively_building_the_socialist_modernized_country: "全面建设社会主义现代化国家"
 CHI_Comprehensively_building_the_socialist_modernized_country_desc: "1894年，中国民主革命的伟大先驱孙中山先生就在创建革命团体兴中会时首提要“振兴中华”；1940年，毛泽东同志在《新民主主义论》中指出，我们共产党人的一切目的，在于建设一个中华民族的新社会和新国家。在伟大的中国共产党和领导下，我们全体人民必将建设起一个更加强大、更加美好、更加接近共产主义的现代化祖国！"
 CHI_Shanghai_Pilot_Free_Trade_Zone: "上海自由贸易试验区"
 CHI_Shanghai_Pilot_Free_Trade_Zone_desc: "上海是我国经济最发达的城市，全面深化改革开放最好自此入手。2013年3月底，国务院总理李克强在上海调研期间考察了位于浦东的外高桥保税区，并表示鼓励支持上海积极探索，在现有综合保税区基础上，研究如何试点先行在28平方千米内建立一个自由贸易园区试验区。同年7月3日，李克强主持召开国务院常务会议。会议原则通过了《中国（上海）自由贸易试验区总体方案》。"
 CHI_China_Pilot_Free_Trade_Zone: "中国自由贸易区"
 CHI_China_Pilot_Free_Trade_Zone_desc: "我们在上海的自由贸易试验区取得了巨大成功，理应在全国渐次推广实行。国务院于2013年8月22日正式批准设立中国自由贸易区。"
 CHI_Dismiss_inefficient_SOE: "裁撤低效国企"
 CHI_Dismiss_inefficient_SOE_desc: "国有企业本应是公有制经济的基石，国民经济的中流砥柱，人民福祉的保障者。然而由于管理和运营上的各种问题，出现了许多运营状况不佳、甚至长期负盈利的国企。这些低效的国企已然成为了政府财政的累赘，每年吞噬掉无数纳税人的血汗税款。我们要深化市场化改革，让那些无法竞争过民营企业的低效国企倒闭裁撤。"
 CHI_Clarify_market_entities: "明确市场主体"
 CHI_Clarify_market_entities_desc: "市场经济是高度社会化和市场化的商品经济，是市场在资源配置中起决定性作用的经济。建立社会主义市场经济体制，保持国民经济持续、稳定、健康发展，关键在于重塑社会主义市场经济的主体。什么是市场经济的最根本主体呢？那就是企业。在市场经济条件下，企业是最基本、最重要的市场活动的主体，是市场机制运行的微观基础。在市场经济中的企业，必须遵循市场经济的规则，自主经营、自负盈亏，直接从事生产、流通和服务性的经营活动，追求利益最大化，并依法纳税。"
 CHI_Entrepreneur_spirit: "企业家精神"
 CHI_Entrepreneur_spirit_desc: "市场主体是经济的力量载体，保市场主体就是保社会生产力。在改革开放以来的长期经济工作中，我国涌现出一批敢于拼搏、勇于奋斗、诚信守法的优秀企业家，他们在党的领导和劳动人民的辛勤劳动下成功引领了我国经济的迅速增长。这种爱国、创新、诚信、富有社会责任和国际视野的精神就是新时代中国的企业家精神。企业家精神已经成为中国共产党人精神谱系之一，是新时代共产党人的时代精神体现。"
 CHI_BTH_Coordinated_Development: "京津冀协同发展"
 CHI_BTH_Coordinated_Development_desc: "京津冀协同发展的核心是京津冀三地作为一个整体协同发展，要以疏解非首都核心功能、解决北京“大城市病”为基本出发点，调整优化城市布局和空间结构，构建现代化交通网络系统，扩大环境容量生态空间，推进产业升级转移，推动公共服务共建共享，加快市场一体化进程，打造现代化新型首都圈，努力形成京津冀目标同向、措施一体、优势互补、互利共赢的协同发展新格局。"
 CHI_Yangtze_River_Economic_belt_downstream: "长江经济带下游"
 CHI_Yangtze_River_Economic_belt_downstream_desc: "长江经济带覆盖上海、江苏、浙江、安徽、江西、湖北、湖南、重庆、四川、云南、贵州等11个省市，面积约205.23万平方公里，占全国的21.4%，人口和生产总值均超过全国的40%。推动长江经济带发展，是以习近平同志为核心的党中央作出的重大决策，是关系国家发展全局的重大战略，对实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦具有重要意义。长江下游为长江三角洲地区，是我国经济最发达的都市圈，我们应该加大对这一地区的投资建设，"
 CHI_Yangtze_River_Economic_belt_middle_reaches: "长江经济带中游"
 CHI_Yangtze_River_Economic_belt_middle_reaches_desc: "长江中游涵括湖北、江西、湖南三省，包括武汉、长沙、南昌三个主要城市。这一区域有广阔的经济腹地和劳动力，投资此处对经济建设有重要推动作用。"
 CHI_Yangtze_River_Economic_belt_upstream: "长江经济带上游"
 CHI_Yangtze_River_Economic_belt_upstream_desc: "长江上游包括重庆、贵州、四川、云南四省。以重庆、成都为中心，打造西南经济高速发展区，对于我国经济发展具有强引领作用。"
 CHI_GBA: "粤港澳大湾区"
 CHI_GBA_desc: "粤港澳大湾区，包括香港特别行政区、澳门特别行政区和广东省广州市、深圳市、珠海市、佛山市、惠州市、东莞市、中山市、江门市、肇庆市。粤港澳大湾区地理条件优越，“三面环山，三江汇聚”，具有漫长海岸线、良好港口群、广阔海域面。经济腹地广阔，泛珠三角区域拥有全国约1/5的国土面积、1/3的人口和1/3的经济总量。截至2022年12月，粤港澳大湾区常住人口达8643.97万人。推进粤港澳大湾区建设，是以习近平同志为核心的党中央作出的重大决策，是习近平总书记亲自谋划、亲自部署、亲自推动的国家战略，也是推动“一国两制”事业发展的新实践。"
 CHI_Xiong_an_New_Area: "雄安新区"
 CHI_Xiong_an_New_Area_desc: "雄安新区为河北省管辖的国家级新区。2017年4月1日，中共中央、国务院印发通知，决定设立国家级新区河北雄安新区。设立雄安新区是以习近平同志为核心的党中央作出的一项重大的历史性战略选择，是继深圳经济特区和上海浦东新区之后又一具有全国意义的新区，是千年大计、国家大事。这项投资在短时间内难以带来明显回报，但对于打造一座科技、和谐、未来之城具有十分远视的影响。"
 CHI_Lucid_waters_and_lush_mountains_are_invaluable_assets: "绿水青山就是金山银山"
 CHI_Lucid_waters_and_lush_mountains_are_invaluable_assets_desc: "我们的社会主义难道是要建立一个昏天暗地、充满臭水烂泥的国家吗？当然不是，我们要建设的是一个绿色、和谐、美好的社会主义祖国。2005年8月15日，时任浙江省委书记的习近平同志在浙江湖州安吉考察时，首次提出了“绿水青山就是金山银山”的科学论断，后来，他又进一步阐述了绿水青山与金山银山之间三个发展阶段的问题，形成了系统化的生态文明建设。"
 CHI_Energy_conservation_and_emission_reduction: "节能减排"
 CHI_Energy_conservation_and_emission_reduction_desc: "我国长期采用高能耗补贴的发展模式，这不仅导致极大的能源浪费和低效生产，还与我国绿色生态建设的发展战略不相符。淘汰高能耗产业，并使用更加环保的能源，这有助于减轻我国日益严峻的生态环境压力。"
 CHI_Innovation_leads_development: "创新引领发展"
 CHI_Innovation_leads_development_desc: "邓小平同志曾说“科学技术是第一生产力”。我国要想摆脱低附加值产业占比过大的工业结构现状，就必须以科技创新引领生产和发展。党的十八届五中全会通过的《中共中央关于制定国民经济和社会发展第十三个五年规划的建议》提出，“创新是引领发展的第一动力”。这一重要论断是“科学技术是第一生产力”重要思想的创造性发展，是新时期新阶段必须坚持的重要发展理念。实现“两个一百年”宏伟目标，必须把创新摆在国家发展全局的核心位置，让创新贯穿党和国家一切工作，让创新在全社会蔚然成风。"
 CHI_The_Quality_Engineering: "质量工程"
 CHI_The_Quality_Engineering_desc: "长久以来，我国制造的产品畅销全球，“中国制造”的名声享誉世界。然而随之而来的是各种质量难以保证的问题产品充斥市场，鱼龙混杂，给“中国制造”打上了“粗制滥造”的烙印。要实现产业现代化，从制造大国转变为制造强国，就必须从质量入手，放弃从前片面追求速度的发展模式，认真制造每一个产品。"
 CHI_The_Robot_Revolution: "“机器人革命”"
 CHI_The_Robot_Revolution_desc: "高效的制造业是什么？难道是拥挤的车间和满头大汗的工人吗？当然不，应该是全自动化的流水线和高新机械制造机器！社会主义发展的目的就是要最大程度解放生产力，用机械代替低等劳动吧，那嗡嗡作响的车间就是现代的经济火车头！"
 CHI_Made_in_China_2025: "中国制造2025"
 CHI_Made_in_China_2025_desc: "制造业是国民经济的主体，是立国之本、兴国之器、强国之基。《中国制造2025》是经国务院总理李克强签批，由国务院于2015年5月印发的部署全面推进实施制造强国的战略文件，是中国实施制造强国战略第一个十年的行动纲领。要素有四：一是由要素驱动向创新驱动转变。二是由低成本竞争优势向质量效益竞争优势转变。三是由资源消耗大、污染物排放多的粗放制造向绿色制造转变。四是由生产型制造向服务型制造转变。"
 CHI_Comprehensively_deepen_reform: "全面深化改革和依法治国"
 CHI_Comprehensively_deepen_reform_desc: "治世不一道，便国不必法古。常故不可循，器械不可因也，则先王之法度有移易者矣。古之所以为荣者，今之所以为辱也。古之所以为治者，今之所以为乱也。夫神农、伏羲，不施赏罚而民不为非，然而立政者不能废法而治民；舜执干戚而服有苗，然而征伐者不能释甲兵而制强暴。由此观之，法度者，所以论民俗而节缓急也；器械者，因时变而制宜适也。"
 CHI_Simplify_government: "放、管、服"
 CHI_Simplify_government_desc: "放管服，就是简政放权、放管结合、优化服务的简称。“放”即简政放权，降低准入门槛。 “管”即创新监管，促进公平竞争。 “服”即高效服务，营造便利环境。这是党的十八大后深化行政体制改革、推动政府职能转变的一项重大举措，有助于有削减冗官冗员，革除旧弊。"
 CHI_Law_of_the_China_on_State_Security: "中华人民共和国国家安全法"
 CHI_Law_of_the_China_on_State_Security_desc: "2015年7月1日，第十二届全国人民代表大会常务委员会第十五次会议通过新的国家安全法。国家主席习近平签署第29号主席令予以公布。法律对政治安全、国土安全、军事安全、文化安全、科技安全等11个领域的国家安全任务进行了明确，共7章84条，自2015年7月1日起施行。"
 CHI_The_Paris_Agreeme: "签署《巴黎协定》"
 CHI_The_Paris_Agreeme_desc: "《巴黎协定》是由全世界178个缔约方共同签署的气候变化协定，是对2020年后全球应对气候变化的行动作出的统一安排。2016年4月22日，时任中国国务院副总理张高丽作为习近平主席特使在《巴黎协定》上签字。同年9月3日，全国人大常委会批准中国加入《巴黎气候变化协定》，成为完成了批准协定的缔约方之一。"
 CHI_Strengthening_the_construction_of_socialist_consultative_democracy: "加强社会主义协商民主建设"
 CHI_Strengthening_the_construction_of_socialist_consultative_democracy_desc: "和实生物，同则不继。谋之在多，断之在独。谋之多，故可以观利害之极致；断之独，故可以定天下之是非。若知谋而不知断，则群下人人欲逞其私志，斯衰乱之政也。万物并育而不相害，道并行而不相悖。执两用中，尊贤容众，正其义不谋其利，明其道不计其功。广览兼听，极群下之知，尽天下之美，至德昭然，施于方外。"
 CHI_Strengthening_the_Party_leadership_over_all: "加强党的全面领导"
 CHI_Strengthening_the_Party_leadership_over_all_desc: "中国最大的国情就是中国共产党的领导，中国共产党的领导是中国特色社会主义最本质的特征。中国共产党是中国特色社会主义事业的领导核心，所以必须加强和改善党的领导，充分发挥党总揽全局、协调各方的领导核心作用。党是我们各项事业的领导核心，古人讲的“六合同风，九州共贯”，在当代中国，没有党的领导，这个是做不到的。党政军民学，东西南北中，党是领导一切的。"
 CHI_Establish_a_unified_basic_pension_insurance_system_for_urban_and_rural_residents: "建立统一的城乡居民基本养老保险制度"
 CHI_Establish_a_unified_basic_pension_insurance_system_for_urban_and_rural_residents_desc: "伟大的中国特色社会主义征途不会放弃任何一个人民群众，也不能让为了便于管理而默许的不公平现象一直存在。城乡居民统一养老保险制度于2014年12月实施，其内容为是居民养老保险将不再分为城镇和农村，原先的新型农村社会养老保险和城镇居民社会养老保险将合并实施，建立统一的城乡居民基本养老保险制度。"
 CHI_Combating_separatism: "打击分裂主义"
 CHI_Combating_separatism_desc: "虽然经过数十年的不懈努力，我们终于将分裂分子从公共社会中剜除了，但在一些看不见的角落仍有不少阴湿老鼠在密谋些分裂主义的春秋大梦。中华民族伟大复兴绝不允许有任何势力阻挡，我们必须立刻彻底把那些危害祖国和人民的蠹虫撕得粉碎。"
 CHI_Double_First_Class_Initiative: "世界一流大学和一流学科"
 CHI_Double_First_Class_Initiative_desc: "世界一流大学和一流学科，简称“双一流”，是中共中央、国务院作出的重大战略决策，也是中国高等教育领域继“211工程”“985工程”之后的又一国家战略，目的在于推动一批高水平大学和学科进入世界一流行列或前列，加快高等教育治理体系和治理能力现代化，提高高等学校人才培养、科学研究、社会服务和文化传承创新水平，使之成为知识发现和科技创新的重要力量、先进思想和优秀文化的重要源泉、培养各类高素质优秀人才的重要基地，在支撑国家创新驱动发展战略、服务经济社会发展、弘扬中华优秀传统文化、培育和践行社会主义核心价值观、促进高等教育内涵发展等方面发挥重大作用。"
 CHI_2Child_Policy: "鼓励生育政策"
 CHI_2Child_Policy_desc: "我国劳动力依然充沛，但人口结构正在加速向老龄化转变。原有政策在过去十多年里已多次修订细则，现在是时候做出改变了。"
 CHI_Service_oriented_government: "服务型政府"
 CHI_Service_oriented_government_desc: "民心无常，惟惠是怀。《书》曰：天视自我民视，天听自我民听。民惟邦本，本固邦宁。政之所兴在顺民心，政之所废在逆民心。君民者，岂以陵民？社稷是主。君臣者，岂为口实？故君为社稷死，则死之；为社稷亡，则亡之。若为己死而为己亡，非克私昵，谁敢任之？上之于下，如保赤子；下之视上，欢如父母。百姓足，君孰与不足？百姓不足，君孰与足？"
 CHI_The_China_Dream: "中国梦"
 CHI_The_China_Dream_desc: "中国梦是中国共产党第十八次全国代表大会召开以来，习近平总书记所提出的重要指导思想和重要执政理念，正式提出于2012年11月29日。习总书记把“中国梦”定义为“实现中华民族伟大复兴，就是中华民族近代以来最伟大梦想”，并且表示这个梦“一定能实现”。“中国梦”的核心目标也可以概括为“两个一百年”的目标，也就是：到2021年中国共产党成立100周年和2049年中华人民共和国成立100周年时，逐步并最终顺利实现中华民族的伟大复兴。"
 CHI_Road_confidence: "道路自信"
 CHI_Road_confidence_desc: "我们的道路多么宽广，我们的前程无比辉煌，我们献身这壮丽的事业，无限幸福无上荣光！"
 CHI_Theory_confidence: "理论自信"
 CHI_Theory_confidence_desc: "这世界上还有比马克思主义更能精准引导我们改造世界的理论吗？我们能走到今天的地步，就是因为坚持了马克思主义理论，坚持了中国特色社会主义理论。我们有战无不胜的理论武器，指导我们更好地改造并且战胜这片广阔的天地！"
 CHI_System_confidence: "制度自信"
 CHI_System_confidence_desc: "理论对于实践具有指导作用，好的理论要配合与之相符的好制度才能发挥作用，否则就是纸上谈兵。我们已经建立起完善的中国特色社会主义制度，这一优越的政治经济制度有利于我们大步迈向民族复兴的伟大道路上！"
 CHI_Culture_confidence: "文化自信"
 CHI_Culture_confidence_desc: "文化自信是一个民族、一个国家以及一个政党对自身文化价值的充分肯定和积极践行，并对其文化的生命力持有的坚定信心。习近平总书记指出：“我们要坚持道路自信、理论自信、制度自信，最根本的还有一个文化自信”。何谓文化自信？文化自信就是一个民族、一个国家以及一个政党对自身文化价值的充分肯定和积极践行，并对其文化的生命力持有的坚定信心。我国拥有世界上最古老的历史文化传承，我们将秉承数千年来先辈的智慧走向中华民族伟大复兴的道路！"
 CHI_Socialism_with_Chinese_Characteristics_in_the_New_Era: "中国特色社会主义新时代"
 CHI_Socialism_with_Chinese_Characteristics_in_the_New_Era_desc: "中国特色社会主义新时代是中国发展新的历史方位。2012年11月在北京召开的中国共产党第十八次全国代表大会，是在我国进入全面建成小康社会决定性阶段召开的一次十分重要的大会。从党的十八大开始，中国特色社会主义进入新时代。2017年10月18日，习近平总书记在党的十九大报告中作出重大判断“经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。”这个新时代，是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。报告立足于党的十八大以来的新实践新成就，谋划了到本世纪中叶的奋斗目标。"
 CHI_Comprehensively_and_strictly_governing_the_Party: "全面从严治党"
 CHI_Comprehensively_and_strictly_governing_the_Party_desc: "中国共产党有8900多万党员、450多万个党组织，是我国最大的党派组织，已经深入到社会的各个部门、各个层面、各个领域。2014年10月8日，习近平总书记在党的群众路线教育实践活动总结大会讲话中首提“全面推进从严治党”。2014年12月，习近平总书记在江苏调研时强调：“协调推进全面建成小康社会、全面深化改革、全面推进依法治国、全面从严治党，推动改革开放和社会主义现代化建设迈上新台阶”，将全面从严治党作为“四个全面”战略布局的重要组成部分，提升到一个全新的战略高度。党的十八届六中全会专题研究全面从严治党重大问题，充分展现了党中央坚定不移推进全面从严治党的决心和信心。"
 CHI_combat_corruption_and_build_a_clean_government: "反腐倡廉"
 CHI_combat_corruption_and_build_a_clean_government_desc: "廉者民之表也，贪者民之贼也。国家之败，由官邪也；官之失德，崇贿章也。昔者有馈鱼于郑相者，郑相不受。或谓郑相曰：“子嗜鱼，何故不受？”对曰：“吾以嗜鱼，故不受鱼。受鱼失禄，无以食鱼；不受得禄，终身食鱼。”"
 CHI_Defeat_the_tiger: "打老虎"
 CHI_Defeat_the_tiger_desc: "以“太子党”和“上海帮”为主导的精英权贵在党内保留了大量高级职位。这群人私下互相勾结，贪墨成风，大量人员涉及显而易见的腐败。这为打倒这些“大老虎”以及削弱上海帮的权力和影响提供了完美的借口，要风清气正就必须要对这些身居高位者下刀子。"
 CHI_flap_a_fly: "拍苍蝇"
 CHI_flap_a_fly_desc: "为大老虎们提供源源不断的财源的正是这些手脚不干净的家仆和买办。也许他们中间有些人是被贪墨的环境所逼迫走上贪腐贿赂的路子，但是他们终究是过线了，打碎这些小角色对所有人都有好处——除了他们自己。"
 CHI_combat_organized_crimes_and_root_out_local_battles_against_gangcrimes: "扫黑除恶"
 CHI_combat_organized_crimes_and_root_out_local_battles_against_gangcrimes_desc: "共产党干部和黑社会勾结在一起，天下岂能有这种事？尽管胡锦涛主席曾大力打击黑恶势力，但依然有不少坏东西在“保护伞”的遮蔽下转入暗处，或是摇身一变成了“善人”和“老总”。是时候把这些社会的渣滓彻底剔除掉了，我们可不是什么寡头买办国家！"
 CHI_Strengthen_Party_member_education: "加强党员教育"
 CHI_Strengthen_Party_member_education_desc: "中国共产党有接近一亿党员，而且每年还在吸收大量人员入党，想要严格把关每个人的思想意识是不可能的，我们只能加强对党员的教育，特别是新入党员的教育。幸运的是，党内许多好同志十分认可这种行为，并且积极参与到其中。"
 CHI_Self_revolution: "自我革命"
 CHI_Self_revolution_desc: "社会革命的长期性决定了共产党领导和执政的长期性，而共产党能否长期执政取决于党能否永葆先进性和纯洁性，党要永葆先进性和纯洁性必须坚持自我革命。长期以来，在党的文献中“自我革命”一词并不多见，但常可见到与自我革命相近的表述。党的十八大以来，“自我革命”一词在党的文献中频频出现。据初步统计，在习近平总书记公开发表的讲话中，“自我革命”已经成为高频词，自我革命与社会革命被并称为新时代“两个伟大革命”。"
 CHI_The_State_Committee_of_Supervisory_of_China: "中华人民共和国国家监察委员会"
 CHI_The_State_Committee_of_Supervisory_of_China_desc: "中华人民共和国国家监察委员会是最高监察机关，领导地方各级监察委员会的工作，由全国人民代表大会产生，负责全国监察工作。对全国人民代表大会及其常务委员会负责，并接受监督。监察委员会就是反腐败工作机构，深化国家监察体制改革的一个重要目的，就是加强党对反腐败工作的统一领导。"
 CHI_Mass_supervision: "群众监督"
 CHI_Mass_supervision_desc: "天视自我民视，天听自我民听。我们党和国家的根本工作是服务人民群众，做的好不好，当然是人民说了算。"
 CHI_Purity_Progressiveness_Contemporaneity_PRC: "纯洁、先进、现代的中国共产党"
 CHI_Purity_Progressiveness_Contemporaneity_PRC_desc: "经过一系列大刀阔斧的改革和整顿，我们的党已经具备了纯洁性、先进性和时代性，具备领导中华民族走向复兴的能力与使命。"
 CHI_Investment_in_aircraft_carriers: "投资航空母舰建设"
 CHI_Investment_in_aircraft_carriers_desc: "航空母舰是现代海军的王牌和中坚力量，打造一支强大的航母舰队是强军战略的必备部分。"
 CHI_Comprehensively_building_a_moderately_prosperous_society_complete: "§Y全面建成小康社会§!"
 CHI_Comprehensively_building_a_moderately_prosperous_society_complete_desc: "§Y中华人民共和国万岁！人民万岁！§!\n\n经过数十年的不懈努力，我们终于使每一个中国人民都摆脱了绝对贫困，我们终于建成了全面的小康社会！\n这是中国历史上的光辉篇章，也是党和人民不朽的功绩，更是世界历史和人权史中最为灿烂的明珠！"
 CHI_HKG_national_security_law: "维护国家安全" #中华人民共和国香港特别行政区维护国家安全法
 CHI_HKG_national_security_law_desc: "为了维护香港社会的长治久安和一国两制制度不被破坏，我国必须出台一部适用于香港的安全保护法。《中华人民共和国香港特别行政区维护国家安全法》详细规定了中央人民政府对香港特别行政区有关的国家安全事务负有根本责任，有权在香港驻兵以维护国家安全，防范、制止和惩治与香港特别行政区有关的分裂国家、颠覆国家政权、组织实施恐怖活动和勾结外国或者境外势力危害国家安全等犯罪，保持香港特别行政区的繁荣和稳定，保障香港特别行政区居民的合法权益。"
 CHI_Utilizing_the_Triad: "利用三合会"
 CHI_Utilizing_the_Triad_desc: "三合会是香港的地下黑帮组织，在香港具有很大的影响力。尽管历史上他们与我党有矛盾，但由于与大陆的商业联系，三合会也开始支持大陆人在香港的利益。我们可以通过与三合会合作来加深我们在香港的影响力。"
 CHI_international_financial_center: "亚洲国际金融中心？"
 CHI_international_financial_center_desc: "香港是一座高度繁荣的自由港和国际大都市，与纽约、伦敦并称为“纽伦港”，是全球第三大金融中心，重要的国际贸易、航运中心和国际创新科技中心，被GaWC评为世界一线城市第三位。在香港回归祖国后，尽管依然保持着相当强劲的经济实力，但不可否认的是香港的经济增速放缓了。我们应该加大对香港的经济扶持，这样对于香港的长期繁荣稳定有相当的促进作用——如果他们实在不明事理，我们也不妨再造一个新的金融中心。"
 CHI_Optimizing_the_business_environment: "优化营商环境"
 CHI_Optimizing_the_business_environment_desc: "优化营商环境是市场经济健康发展的需要，也是我国深化体制改革的必然趋势。党的十八大以来，习近平总书记高度重视优化营商环境，作出一系列重要指示，强调“营商环境只有更好，没有最好”。国务院总理李强主持召开国务院常务会议，强调“要把打造市场化、法治化、国际化营商环境摆在重要位置，进一步稳定社会预期，提振发展信心，激发市场活力，推动经济运行持续向好”。"
 CHI_new_energy: "§G新能源§!"
 CHI_new_energy_desc: "人类的发展无穷无尽，但环境承载力是有限的，我国必须尽快探寻出一条更加绿色环保的能源发展模式。"
 CHI_renewable_energy: "§G可再生能源§!"
 CHI_renewable_energy_desc: "经过长达十多年的技术发展，我国已具备相当成熟的可再生能源技术和生产能力。在我们的宣传下，我国人民对新能源期待已久，新能源发展势在必行。"
 CHI_solar_energy_experiment: "§Y太阳能实验§!"
 CHI_solar_energy_experiment_desc: "尽管我们的太阳能技术早已成熟，但大规模使用这种不稳定的能源还是有隐患。我们可以先在部分地区进行太阳能驱动能源的实验，正好我国华北和西部的一些地区存在大量无人居住的太阳能富集地，我们可以从这里入手。"
 CHI_wind_power: "§C风能实验§!"
 CHI_wind_power_desc: "我国国土广袤，风神始终在祖国的大地上徘徊。如今，徐徐微风也能转变为我们的能源，我国应该在部分风能富集地区先进行风能发电的实验。"
 CHI_Green_China: "§G绿色中国§!"
 CHI_Green_China_desc: "曾经，我国生态环境在粗放式发展模式下一度陷入危机，还因此被国内外人民广泛批评。如今，在党和国家的正确领导下，我们已经成功探索出一条更加绿色、更加环保、更加光明的绿色发展道路。子孙后代们将生活在一个绿色的中国，在更为光明的未来踏入中华民族伟大复兴的新时代中！"
 CHI_solar_hundred_percent: "§Y太阳百分百§!"
 CHI_solar_hundred_percent_desc: "在我国的边疆存在着广大无人居住的光能富集地。装载上光伏板，我们要加速了！"
 CHI_The_Grace_of_Mazu: "§C妈祖的恩惠§!"
 CHI_The_Grace_of_Mazu_desc: "妈祖是沿海人民共同祭拜的一位海神，由一位古代姑娘的形象演变而来，在我国代表着海洋的一切。海洋上不仅有海浪和渔船，还有终年盘旋的海风。建设海上风电场，能给我们带来无穷无尽的清洁能源。千百年来，妈祖保佑着每一位出海的渔民，如今她温柔的手也要荫蔽大陆上的子民了。"
 CHI_Nuclear_Boom: "§Y核能繁荣§!"
 CHI_Nuclear_Boom_desc: "尽管公众强烈反对建造新的核反应堆，但核能仍然是替代化石燃料的最可行的可再生能源之一。然而，核能需要耗费巨额资金，因为需要一套复杂的支持基础设施系统。"
 CHI_Construct_Nuclear_Waste_Repository: "§Y建立核废料储存库§!"
 CHI_Construct_Nuclear_Waste_Repository_desc: "处理高放射性废物（如废核燃料）仍然是我们核能计划的主要考虑因素。高放射性废物必须经过极其谨慎的处理，并存放在地质处置库中数十年才能衰变。我们已经确定戈壁沙漠的北山地区是开始建造这种处置库的合适地点。"
 CHI_Construction_of_nuclear_power_plants: "§Y建设核电站§!"
 CHI_Construction_of_nuclear_power_plants_desc: "我国的核电技术早已成熟，但从前一直被审慎使用，我们不能因为所谓的极为微小的可能性就抛弃前进的步伐，现在是时候大规模建设核电站了。"
 CHI_invest_fusion_reactor: "§Y投资核聚变能源§!"
 CHI_invest_fusion_reactor_desc: "核聚变发电是一种利用核聚变反应产生的热量来发电的发电方式。人类已经可以实现不受控制的核聚变，即氢弹的爆炸。目前，全球科学家正在努力研究可控核聚变，核聚变可能成为未来的能量来源。可以说，谁首先研发出可控核聚变科技，谁就掌握了新时代的能源话语权，石油将成为旧世界的灰尘。"
 CHI_Construct_Stellarator_Reactor: "§C建造仿星器反应堆§!"
 CHI_Construct_Stellarator_Reactor_desc: "仿星器是一种主要依靠外部磁铁来限制等离子体的等离子体装置。研究磁约束聚变的科学家旨在使用仿星器装置作为核聚变反应的容器。仿星器的扭曲结构可以帮助其更好地控制等离子体，以及运行风险较小，不像托卡马克反应堆那样容易出现内部电流突然中断现象，造成聚变反应立即停止。"
 CHI_Construct_Tokamak_Reactor: "§C建造托卡马克反应堆§!"
 CHI_Construct_Tokamak_Reactor_desc: "托卡马克是一种利用强大磁场将等离子体限制在环面形状的装置。托卡马克是正在开发的用于产生受控热核聚变能量的几种磁约束装置之一。托卡马克装置是目前被学术界认为实现可控核聚变占据主流的方式，主要利用氢的同位素氘—氚作为聚变燃料。"
 CHI_Final_Energy_Solution: "§Y最终能源方案§!"
 CHI_Final_Energy_Solution_desc: "核聚变的发电潜力无穷无尽，足以支持大规模扩张我们的工业规模，是毫无疑问的最终能源解决方案。"
 CHI_Coal: "§R煤炭驱动发展§!"
 CHI_Coal_desc: "中国拥有极为丰富的煤炭储量，煤炭资源遍布我国各地。中国是世界上最大的煤炭生产国和消费国，我们的经济仍然依赖它。尽管燃烧煤炭会造成相当的环境污染，但我们不应该专注于不切实际的替代方案，而应该简单地接受煤炭在我们经济中的中流砥柱地位，并集中精力尽可能有效地开发它。"
 CHI_eyeing_the_west: "注视西方"
 CHI_eyeing_the_west_desc: "以美国为首的西方集团长期对我国保有敌意，我们需要缓和同他们的关系——毕竟，谁会拒绝中国的廉价商品出口呢？"
 CHI_Asian_Infrastructure_Investment_Bank: "创办亚洲基础设施投资银行"
 CHI_Asian_Infrastructure_Investment_Bank_desc: "为了更好地援助落后国家，我们应该成立一个专门用于国际投资和援助的机构。亚洲基础设施投资银行是一个政府间性质的亚洲区域多边开发机构，重点支持基础设施建设，成立宗旨是为了促进亚洲区域的建设互联互通化和经济一体化的进程，并且加强中国及其他亚洲国家和地区的合作，是首个由中国倡议设立的多边金融机构，总部设在北京，法定资本1000亿美元。截至2023年9月，亚投行成员数量增至109个。"
 CHI_Alipay: "支付宝"
 CHI_Alipay_desc: "支付宝是蚂蚁科技集团股份有限公司旗下业务，成立于2004年，历经19年发展，是国内第三方支付开放平台，由支付宝（中国）网络技术有限公司和支付宝（杭州）信息技术有限公司作为主体运营。负责为数字化服务商提供产品和服务接口，助力商家机构数字化经营，超过300万个商家机构小程序入驻支付宝app，为消费者提供政务服务、扫码点单、生活缴费等超过1000项生活服务。支付宝已服务8000万商家、10亿消费者。支付宝和微信支付所开创的移动数字支付方式深刻改变了中国社会经济发展。"
 CHI_Desalination_of_seawater_projects: "海水淡化工程"
 CHI_Desalination_of_seawater_projects_desc: "海水淡化即利用海水脱盐生产淡水，是实现水资源利用的开源增量技术，可以增加淡水总量，且不受时空和气候影响，可以保障沿海居民饮用水和工业锅炉补水等稳定供水。“十一五”期间，我国海水淡化发展迅速。截止2010年底，已建成海水淡化装置70多套，设计产能60万立方米每日，年均增长率超过60%。"
 CHI_a_Community_with_a_Shared_Future_for_Mankind: "§C人类命运共同体§!"
 CHI_a_Community_with_a_Shared_Future_for_Mankind_desc: "§C各美其美，美人之美，美美与共，天下大同§!\n人类只有一个地球，一个世界，不论人们身处何国、信仰如何、是否愿意，实际上已经处在一个命运共同体中。与此同时，一种以应对人类共同挑战为目的的全球价值观已开始形成，并逐步获得国际共识。\n我们的伟大事业绝不仅限于中国一国，我们将连同全世界所有国家、所有民族，共同建立起一个更加繁荣、和平、稳定的美好地球，这不仅是中国人民的心声，更是全世界所有人民共同的期愿。"
 CHI_Good_Neighbourliness: "睦邻友好"
 CHI_Good_Neighbourliness_desc: "苏联解体后，俄罗斯一直处于动荡和贫穷之中，我们秉持和平外交态度，不对他们施以干预，也没有夺取争议边界地区。现在，俄罗斯上任了一位新总统，我们可以趁此机会商定好双方边界，并且继续保持双方的和善关系。"
 CHI_APEC: "亚太经济合作组织"
 CHI_APEC_desc: "亚太经济合作组织是亚太地区重要的经济合作论坛，也是亚太地区最高级别的政府间经济合作机构。2001年10月，亚太经济合作组织领导人非正式会议在中国上海举办。这是APEC会议首次在中国举行。会议以“新世纪、新挑战：参与、合作，促进共同繁荣”为主题，就当前世界经济形势以及“9·11”事件对经济发展带来的影响、人力资源能力建设和亚太经合组织未来发展方向等问题深入交换意见，达成了广泛的共识。"
 CHI_Counterintelligence: "反间谍"
 CHI_Counterintelligence_desc: "为保护我国的信息情报安全，我们必须清除掉国内的各种间谍势力。"
 CHI_Combat_Islamism: "打击极端组织思想"
 CHI_Combat_Islamism_desc: "伊斯兰教本是我国广为分布的一个信仰，主要信徒为维吾尔同胞和回族同胞。维族人民是建设社会主义中国的同胞人民，伊斯兰教与党和国家的事业也没有冲突之处，但有部分极端分裂主义者恶意利用伊斯兰教，煽动、鼓吹分裂主义思想，造成了十分恶劣的社会影响，荼毒我国伊斯兰信徒的思想。我们必须明确将这部分极端主义者剔除掉，让伊斯兰教重回纯净与美好。"
 CHI_Peoples_Daily: "人民日报"
 CHI_Peoples_Daily_desc: "人民日报是中国共产党中央委员会的机关报，是我国影响力最大的报。我们可以把人民日报的影响力往网络上推进，使其在网络上也能发挥好官媒喉舌的职能。"
 CHI_Xinhua_News_Agency: "新华社"
 CHI_Xinhua_News_Agency_desc: "新华通讯社，简称新华社，是中国国家通讯社和世界性通讯社。我们可以利用这一组织设立一个重点新闻网站，通过承办一系列大型政府网站，形成一个大规模的国家级网站集群。"
 CHI_guancha_cn: "观察者网"
 CHI_guancha_cn_desc: "国外有许多新闻时评集成网站，专门用于向网民提供时政点评节目，我们也应该设立一个这样的节目，安排一些为政府发声的人当评论员。"
 CHI_xuexi_cn: "学习强国"
 CHI_xuexi_cn_desc: "青年人是易于塑造和拉拢的，我们应该创建一个免费提供学习资源的应用平台，并提供官方意识形态课程，让青年人能在平台上与朋友视频聊天、发送消息、创建个人日历、通过国家媒体获取信息或观看有关中国共产党历史的电视剧，实现“有组织、有管理、有指导、有服务”的学习。"
 CHI_Network_keywords: "关键词屏蔽"
 CHI_Network_keywords_desc: "网络向每个人提供了在公开场合发言的机会，包括极端主义言论和各种有害言论。甄别并删除这些言论是一项耗费巨大的工程，通过设置屏蔽一些关键词，让那些关键词永远不能出现在网络空间上。通过对可能存在犯罪或网络暴力可能的关键词进行有针对性的筛查和屏蔽，很多时候我们能够防患于未然，把后果严重的犯罪行为扼杀于萌芽之中。"
 CHI_Internet_police: "网络警察"
 CHI_Internet_police_desc: "根据《中华人民共和国人民警察法》第6条的规定，人民警察应当依法履行“监督管理计算机信息系统的安全保卫工作”的职责。即此而言，正在从事公共信息网络安全监察工作的人民警察当称之为“网络警察”。网络警察的现代职能是网络警察最鲜明的特点，因为他们的职责是进行网上搜寻，以防范和跟踪在数秒内就能犯下的、几乎不留下任何痕迹的各种不良行为和犯罪活动的幽灵。"
 CHI_Online_anti_pornography_campaign: "遏制不良信息"
 CHI_Online_anti_pornography_campaign_desc: "只要接触互联网，就会很容易地受到色情网站的骚扰，使人极其反感，这是很多网民切身的体会。据统计，互联网上的色情网站超过3.7亿个，每天约有两万张色情照片进入互联网。青少年网民正在遭受色情网站上不良信息的侵蚀。因此，遏制网络“黄毒”，出击强拳势在必行。"
 CHI_online_water_army: "水军控评"
 CHI_online_water_army_desc: "我们不可能关闭所有的评论区，或筛查所有的网络言论，但可以通过大量制造对我们有利的言论来冲淡其他与官方意见不合的言论。"
 CHI_pinduoduo: "拼多多"
 CHI_pinduoduo_desc: "拼多多成立于2015年4月，是国内移动互联网的主流电子商务应用产品平台。专注于C2M拼团购物的第三方社交电商平台。用户通过发起和朋友、家人、邻居等的拼团，可以以更低的价格，拼团购买优质商品。"
 CHI_Baidu_Tieba: "百度贴吧"
 CHI_Baidu_Tieba_desc: "百度贴吧是全球领先的中文社区，贴吧目录涵盖社会、地区、生活、教育、娱乐明星、游戏、体育、企业等方方面面，是全球领先的中文交流平台，它为人们提供一个表达和交流思想的自由网络空间，并以此汇集志同道合的网友。"
 CHI_Bilibili: "哔哩哔哩"
 CHI_Bilibili_desc: "YouTube等西方视频社区在中国影响力不大，但我们也有自己的优秀视频社区。哔哩哔哩最初是一个二次元社区，现已成为中国最具影响力的网络视频社区。"
 CHI_Mihoyo: "米哈游"
 CHI_Mihoyo_desc: "米哈游网络科技有限公司是一家中国电子游戏开发和发行公司。除游戏外，该公司还创作了系列动画、小说、漫画、音乐和商品等各种产品。"
 CHI_Tik_Tok: "抖音"
 CHI_Tik_Tok_desc: "抖音是来自中国的短视频托管服务。它托管用户提交的视频，时长从3秒到10分钟不等。抖音的流行使得该平台在全球范围内的文化影响力与日俱增。"
 CHI_Little_Red_Book: "小红书"
 CHI_Little_Red_Book_desc: "小红书是一个生活方式平台和消费决策入口，由毛文超和瞿芳于2013年在上海创立。小红书的精细化带货模式，使其汇成全球最大的消费类口碑库，连接中国消费者和优秀品牌的纽带。"
 #CHI_strict_check_Japanese_anime: "严查流行文化"
 #CHI_strict_check_Japanese_anime_desc: "日本动漫在国际上享有盛誉，质量优越，深受我国人民喜爱。但其中不乏各类低俗、暴力、黑暗等恶性元素，时刻危害我国未成年人心智。针对一些含有危害未成年人身心健康内容的动漫视频流入境内问题，文化部立即部署清理查处工作，严查相关互联网文化产品和互联网文化单位，坚决保护未成年人文化权益，为未成年人健康成长营造良好的社会文化环境。"
 CHI_strict_check_Japanese_anime: "严查流行文化"
 CHI_strict_check_Japanese_anime_desc: "虽然日韩港台的流行文化有其精华部分，但它们难免会被作为文化入侵乃至干涉我国的工具。文化是一个民族的灵魂，我们不能让对我方抱有敌意阵营成员的文化在这片土地横行扎根。"
 CHI_ban_Korean_culture: "限韩令"
 CHI_ban_Korean_culture_desc: "韩流文化在我国十分受欢迎，特别是在年轻女性群体中。虽然我们和韩国没有太多的利益冲突，但韩国背后的美国随时企图利用韩国作为干涉我国的工具，已经可以确认韩流被利用作为文化入侵的一种策略。文化是一个民族的灵魂，我们不能让持有敌意的人的阵营成员的文化在我国横行扎根。"
 CHI_Network_censorship: "网络安全审查"
 CHI_Network_censorship_desc: "网络文化是新兴的一种新型文化领域，我们应该加强对这一领域的审查，确保不存在有害的信息危及我国人民和国家安全。"
 CHI_Developing_local_network_culture: "本土网络文化"
 CHI_Developing_local_network_culture_desc: "数千年的历史底蕴和十数亿人口的基数，我们能创造不少优秀且适应时代的新型网络文化产品。"
