 chi_GR.700.t: "[CHI_Wu_WenJun.GetName]逝世"
 chi_GR.700.d: "[?global.date.GetDateString]，首届国家最高科技奖获得者、著名数学家[CHI_Wu_WenJun.GetName]院士因病医治无效在北京不幸去世，享年98岁。"
 chi_GR.700.a: "举国悲痛"
 
 chi_GR.701.t: "[CHI_Yuan_LongPing.GetName]逝世"
 chi_GR.701.d: "[?global.date.GetDateString]，共和国勋章”获得者、中国工程院院士、国家杂交水稻工程技术研究中心主任、湖南省政协原副主席[CHI_Yuan_LongPing.GetName]因病医治无效在长沙逝世，享年91岁。"
 chi_GR.701.a: "举国悲痛" #人就像种子，要做一粒好种子

 chi_GR.702.t: "[CHI_Wang_Xuan.GetName]逝世"
 chi_GR.702.d: "[?global.date.GetDateString]，享誉海内外的著名科学家、中国计算机汉字激光照排技术创始人，杰出的社会活动家，中国共产党的亲密朋友，中国人民政治协商会议第十届全国委员会副主席，九三学社中央副主席，中国科学院院士、中国工程院院士，北京大学教授[CHI_Wang_Xuan.GetName]同志，因病在北京逝世，享年70岁。"
 chi_GR.702.a: "举国悲痛"
 
 chi_GR.703.t: "[CHI_Wang_YongZhi.GetName]逝世"
 chi_GR.703.d: "[?global.date.GetDateString]，中国工程院院士，中国载人航天工程首任总设计师[CHI_Wang_YongZhi.GetName]，因病医治无效，在北京逝世，享年92岁。"
 chi_GR.703.a: "举国悲痛"
 
 chi_GR.704.t: "[CHI_Ye_DuZheng.GetName]逝世"
 chi_GR.704.d: "[?global.date.GetDateString]，著名气象学家、中国现代气象学主要奠基人之一、中科院原副院长、中科院大气物理所原所长[CHI_Ye_DuZheng.GetName]院士因病在北京逝世，享年98岁。"
 chi_GR.704.a: "举国悲痛"

 chi_GR.705.t: "[CHI_Min_EnZe.GetName]逝世"
 chi_GR.705.d: "[?global.date.GetDateString]，我国著名的石油化工催化剂专家，中国科学院院士、中国工程院院士，中国石化石油化学科学研究院高级顾问[CHI_Min_EnZe.GetName]教授级高工，因病医治无效在北京不幸逝世，享年93岁。"
 chi_GR.705.a: "举国悲痛"

 chi_GR.706.t: "[CHI_Xie_JiaLin.GetName]逝世"
 chi_GR.706.d: "[?global.date.GetDateString]，中国科学院院士、国际著名加速器物理学家、2011年度国家最高科学技术奖获得者，中国科学院高能物理研究所原副所长[CHI_Xie_JiaLin.GetName]，因病在北京逝世，享年96岁。"
 chi_GR.706.a: "举国悲痛"
 
 chi_GR.707.t: "[CHI_Zheng_ZeMin.GetName]逝世"
 chi_GR.707.d: "[?global.date.GetDateString]，中国科学院院士、中国工程院院士，国家最高科学技术奖获得者，中国科学院力学研究所研究员[CHI_Zheng_ZeMin.GetName]，因病医治无效在北京逝世，享年97岁。"
 chi_GR.707.a: "举国悲痛"

 chi_GR.708.t: "[CHI_Wang_XiaoMo.GetName]逝世"
 chi_GR.708.d: "[?global.date.GetDateString]，中国共产党的优秀党员，久经考验的共产主义忠诚战士，我国著名雷达专家，预警机事业的开拓者和奠基人，国家最高科学技术奖获得者，中国工程院院士[CHI_Wang_XiaoMo.GetName]同志，因病医治无效在北京逝世，享年84岁。"
 chi_GR.708.a: "举国悲痛"

 chi_GR.709.t: "[CHI_Zhang_CunHao.GetName]逝世"
 chi_GR.709.d: "[?global.date.GetDateString]，中国共产党优秀党员，中国民主同盟杰出盟员，国家自然科学基金委员会原党组书记、第二届和第三届主任，中国科学院大连化学物理研究所原所长，著名物理化学家、我国高能化学激光领域的奠基人和开拓者、分子反应动力学学科的创始人之一，国家最高科学技术奖获得者，中国科学院资深院士[CHI_Zhang_CunHao.GetName]同志，因病医治无效在北京逝世，享年96岁。"
 chi_GR.709.a: "举国悲痛"
 
 chi_GR.710.t: "[CHI_Cheng_KaiJia.GetName]逝世"
 chi_GR.710.d: "[?global.date.GetDateString]，中国科学院院士、“两弹元勋”获得者—[CHI_Cheng_KaiJia.GetName]院士，在北京301医院经医治无效，因病去世，享年101岁。"
 chi_GR.710.a: "举国悲痛"
 
 chi_GR.711.t: "[CHI_Yu_Min.GetName]逝世"
 chi_GR.711.d: "[?global.date.GetDateString]，我国国防科技事业改革发展的重要推动者、中科院院士、“两弹一星”元勋、国家科技进步最高奖获得者、改革先锋[CHI_Yu_Min.GetName]在京去世，享年93岁。"
 chi_GR.711.a: "举国悲痛"

 chi_GR.712.t: "[CHI_Qian_XueSen.GetName]逝世"
 chi_GR.712.d: "[?global.date.GetDateString]，著名航天科学家，中国科学院、中国工程院资深院士，中国人民政治协商会议第六届、七届、八届全国委员会副主席，中国航天事业奠基人[CHI_Qian_XueSen.GetName]在北京逝世，享年98岁。"
 chi_GR.712.a: "举国悲痛"

