 chi_GRnews.66.d: "[From.GetName]的外交部门表示称他们将与中国一起参与到反对美帝国主义霸权的正义事业里来。"
 chi_GRnews.66.a: "朋友多多的！"

 chi_GRnews.67: "中国切断了对我们的商品贸易！"
 chi_GRnews.67.t: "中国切断了对我们的商品贸易！"
 chi_GRnews.67.d: "中国外交部门今天取消了与我们有关的任何贸易订单，并驱逐了我们的外交人员。这将对我国经济造成严重影响。"
 chi_GRnews.67.a: "凭什么？"

 chi_GRnews.68: "中国正在削弱我们的国际地位！"
 chi_GRnews.68.t: "中国正在削弱我们的国际地位！"
 chi_GRnews.68.d: "近年来，由于中国人的努力，我们的全球影响力急剧下降，危及我们作为世界唯一霸主的地位，并为世界新秩序奠定了基础。也许那些在我们战胜苏联后预测“历史的终结”的人终究过于乐观了。"
 chi_GRnews.68.a: "我们必须现在就出击！"
 chi_GRnews.68.b: "暂时还是别惹他们了……"

 chi_GRnews.69: "《真正男子汉》热播"
 chi_GRnews.69.t: "《真正男子汉》热播"
 chi_GRnews.69.d: "本月初，湖南卫视播出了一部与中国人民解放军八一电影制片厂联合推出的国防教育特别节目，名为《真正男子汉》。节目记录了6位有年龄跨度，性格标签各异的明星，深入一线部队，改变身份，在不同军兵种经历4次5天4晚，与年轻的部队战士同吃同住同训练的真实军营体验。\n\n《真正男子汉》节目组走进军营，辗转于各兵种之间进行拍摄，明星将和战士们同吃同住同训练，帮助他们实现“真男人”的蜕变。导演组实行“零干预”，在部队中一切听从指挥，导演只负责记录，而且训练过程中也是真枪实弹。所有参加拍摄的明星进入部队后，将完全按照普通入伍新兵的要求，完全交由部队管理。明星嘉宾需要严格遵守部队纪律，一切行动听指挥，做到绝对服从，不能有任何借口。哪怕是最小的生活细节，也要严格按照部队作息时间，听从部队安排。不同于其他明星节目，在录制中，所有工作人员被禁止与明星交谈。军营中发生的任何情况，都由普通士兵和军官，根据部队条令条例和一日生活制度处理。导演组按照纪录片的拍摄要求，进行24小时不间断地纪录拍摄。\n\n凤凰娱乐评论称，《真正男子汉》不仅反映出现部队军魂与男人之间情谊，更通过明星新兵的历练过程，真实展现了中国现代军事力量。观众看到了明星新兵在军营流下的艰辛汗水和感动泪水，也感受到了王班长、谢教官等军人的热血和风采，节目中“军人守时才能在作战中守住阵地”、“能力是可以练出来的”、“是男人就要坚持”等振奋人心的话语，也如强心剂一样让观众看得热血沸腾。"
 chi_GRnews.69.a: "这才是真男人！"
 chi_GRnews.70: "《人民的名义》热播"
 chi_GRnews.70.t: "《人民的名义》热播"
 chi_GRnews.70.d: "3月28日，湖南卫视“金鹰独播剧场”播出了一部特殊的电视剧，这是一部名叫《人民的名义》的主旋律反复电视剧。该剧根据周梅森的同名小说改编，讲述了一位国家部委项目处长涉嫌受贿千万，反贪侦查处长侯亮平调查时，发现其外表朴素。同时，涉案的汉东省京州市副市长丁义珍成功逃脱海外。案件涉及国企大风服装厂的股权争夺，政治势力错综复杂。原反贪局长陈海遇车祸，侯亮平接任调查。汉东省政坛存在“政法系”和“秘书帮”两大势力，新任省委书记沙瑞金的到来将打破这一平衡，为改革注入新动力的故事。\n\n该剧于2017年3月28日在湖南卫视“金鹰独播剧场”播出后，收视率突破8%，刷新了近十年省级卫视收视的最高纪录，2017年4月27日，该剧在GMIC X 2017非凡盛典上获得"互联网时代最具影响力影视作品"奖。\n\n北京晚报评称，这部反腐剧没有流于依靠明君、清官化解权力腐败的简单想象，而是引出一个又一个发人深省的现实问题，从官场延伸到最基层，落足于中国社会每一个组织管理体系，这让远离权力层面的普通百姓，也都感触颇多。"
 chi_GRnews.70.a: "老师，我太想进步了"
 chi_GRnews.71: "告全党全军全国各族人民书"
 chi_GRnews.71.t: "告全党全军全国各族人民书"
 chi_GRnews.71.d: "中国共产党中央委员会、中华人民共和国全国人民代表大会常务委员会、中华人民共和国国务院、中国人民政治协商会议全国委员会、中国共产党和中华人民共和国中央军事委员会，极其悲痛地向全党全军全国各族人民通告：我们敬爱的江泽民同志患白血病合并多脏器功能衰竭，抢救无效，于2022年11月30日12时13分在上海逝世，享年96岁。\n\n江泽民同志是我党我军我国各族人民公认的享有崇高威望的卓越领导人，伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家、外交家，久经考验的共产主义战士，中国特色社会主义伟大事业的杰出领导者，党的第三代中央领导集体的核心，“三个代表”重要思想的主要创立者。\n\n江泽民同志的逝世，对我党我军我国各族人民是不可估量的损失。党中央号召，全党全军全国各族人民化悲痛为力量，继承江泽民同志的遗志，以实际行动表达我们的悼念。\n\n我们一定要努力学习“三个代表”重要思想，学习江泽民同志的革命精神和革命风范，学习他运用马克思主义立场、观点、方法研究新情况、解决新问题的科学态度和创造精神，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而团结奋斗。\n\n中华民族的伟大复兴事业，凝结了包括江泽民同志在内的一代又一代共产党人的心血和奋斗。前进道路上，全党全军全国各族人民要在以习近平同志为核心的党中央坚强领导下，高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘扬伟大建党精神，坚定信心、同心同德，埋头苦干、奋勇前进，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。"
 chi_GRnews.71.a: "江泽民同志永垂不朽！"
 chi_news.21: "中国前领导人江泽民逝世"
 chi_news.21.t: "中国前领导人江泽民逝世"
 chi_news.21.d: "2022年11月30日12时13分，中国前领导人江泽民在上海逝世，享年96岁。中国为他举办了盛大的追悼大会，以纪念这位对于中国人来说具有重大意义的老人。\n\n中国驻外使领馆及其他驻外机构下半旗悼念，北京的天安门、新华门等地也降下半旗为江泽民志哀。联合国安理会在举行会议前，举行默哀仪式，哀悼江泽民逝世。安理会轮值主席、加纳常驻联合国代表 哈罗德·阿杰曼说：中国前国家主席江泽民，为国际和平、安全和发展，为中国的改革开放、现代化和经济发展作出巨大贡献，国际社会为此铭记江泽民，他的逝世是中国和国际社会的巨大损失。随后，各国代表起立默哀一分钟。"
 chi_news.21.a: "他终究没能战胜衰老"
 chi_news.21.b: "江泽民同志永垂不朽！"
 chi_GRnews.72: "《某科学的超电磁炮》开播！"
 chi_GRnews.72.t: "《某科学的超电磁炮》开播！"
 chi_GRnews.72.d: "三个月前，由日本漫画家镰池和马原作、冬川基作画的漫画《科学超电磁炮》正式宣布动画化。本月2日，《科学超电磁炮》在东京首都电视台正式播出，第一集为“电撃使い(エレクトロマスター)”。本作为以镰池和马所著的轻小说《魔法禁书目录》中的人气角色御坂美琴为主角的同名外传漫画改编的动画，动画的前半部分改编自原作漫画1~3卷，而后半原创部分则由《魔法禁书目录》原作者镰池和马亲自执笔担当剧本。\n\n剧情讲述了一个虚构的面积占据东京都西部的三分之一，居住着230万名人口，其中八成人口是学生的巨大都市“学园都市”中，学园都市和外部隔离，研究最尖端科技。所有学生都接受超能力开发，并大都借由药物、催眠术与通电刺激等方式取得超能力。有各种类型不同能力，以范围和威力分为无能力者、低能力者、异能力者、强能力者、大能力者和超能力者。故事从学园都市最强的电击公主“超电磁炮”御坂美琴，某天认识了和白井黑子一样担任风纪委员的初春饰利开始……\n\n由于极高的原作人气，本动漫一经播出即大火，并迅速传播至我国，无数动漫爱好者组成的“字幕组”很快完成了字幕译制工作，无偿供同好欣赏。虽然其官方名称为《科学超电磁炮》，但中国的观众更乐意将其称为更贴合原著名称的《某科学的超电磁炮》（とある科学の超電磁砲）。"
 chi_GRnews.72.a: "你指尖跃动的电光，是我此生不灭的信仰！"
 chi_GRnews.73: "《魔法禁书目录》开始发售！"
 chi_GRnews.73.t: "《魔法禁书目录》开始发售！"
 chi_GRnews.73.d: "本月，日本小说家镰池和马执笔的轻小说《魔法禁书目录》开始由电击文库出版，这是新人作家镰池和马的首部作品。\n\n故事讲述的是从日本东京都西部被分割出来的这座都市中，“超能力开发”被列为学校课程的一部分（学生作为人体科学实验对象）。在二百三十万人口中，有八成都是学生，所以被称为学园都市。他们每天都在超能力开发上进行相互竞争。根据能力高低不同，可以分为6级，从无能力（level 0）到超能力（level 5）。故事的主角上条当麻是学园里的一个无能力者，但并非完全没有能力，他的能力是能够将一切异能之力无效化。他只有右手能够使用这种能力，还给自己的这种连上帝的奇迹都能抹杀的能力取名为“幻想杀手”。而正因为他的右手似乎把神的祝福都给抹杀掉的缘故，导致自己一直过著不幸的生活。某一个暑假的日子，在家里的阳台上，他遇见了一位修女；这位少女自称自己的名字叫“茵蒂克丝”，并是从魔法的世界逃了出来，现在正在被魔法师追赶中。就这样，掌握了十万三千本究极魔法书的少女与拥有抹杀一切奇迹的神上之手的少年，将面临一系列故事……\n\n这部轻小说以其细腻的文笔和夸张而绚丽的剧情构思而在读者种受到追捧，很快称为了日本最为流行的新出版轻小说之一，并迅速传播至国内ACGN群体中。"
 chi_GRnews.73.a: "“就让我用这只手，将你那无聊的幻想杀得片甲不留”"
 chi_GRnews.74: "流浪地球"
 chi_GRnews.74.t: "流浪地球"
 chi_GRnews.74.d: "新年之际，影院上映了一部科幻巨作。这是由郭帆执导的中国科幻电影《流浪地球》，根据刘慈欣原创的科幻短篇小说《流浪地球》改编。该片根据刘慈欣的同名小说改编，故事背景设定在2075年，讲述了太阳即将毁灭，毁灭之后的太阳系已经不适合人类生存，而面对绝境，人类将开启“流浪地球”计划，试图带着地球一起逃离太阳系，寻找人类新家园的故事。\n\n该系列电影无论是电影技术还是制作水平都是中国科幻电影史上的一大突破。\n\n《人民日报》评价：《流浪地球》中体现的中国亲情观念、英雄情怀、奉献精神、故土情结和国际合作理念。电影不再是超级英雄拯救世界，而是人类共同改变自己的命运。这样的理念，是对好莱坞科幻电影叙事套路的突破。将中国独特的思想和价值观念融入对人类未来的畅想与探讨，拓展了人类憧憬美好未来的视野。\n\n这部电影受到了全国人民的热烈欢迎，2019年2月5日电影《流浪地球》正式在中国内地上映，首日以11.4%的排片，获得1.89亿人民币票房（包括午夜场票房1280万人民币），单日票房第四名；2月6日，以17.4%排片，票房获得2.58亿人民币，从单日票房第四名一跃而至单日票房亚军，逆势上涨38%；截至3月3日，该片累计票房已突破45亿人民币"
 chi_GRnews.74.a: "我们的人一定可以完成任务\n无论虚实，不计存亡"
 chi_GRnews.75: "桥的家书·其一"
 chi_GRnews.75.t: "桥的家书·其一"
 chi_GRnews.75.d: "维维，你好，大家好。\n\n你们走后，第二天下午医生才来。做了检查。第二天，又做了血检。据医生说，情况还好，心跳的快是由于供血不足，调整药物服用先后、数量。据我看，又可以维持一段时间。我们要来两人的血检单，可惜都是英文。虽然医生说“都很正常”，我们还想请两位王大夫看一看，是不是这样。寄太重，抄了一份，请收看。\n每天看电视，都可以看到一段皇帝推销面食的广告。“做皇帝要做好皇帝，吃面要吃好面。”开始，觉得很好笑 ：皇帝做起推销员来了。继而又想，这也不奇怪。有钱能使鬼推磨，欧洲的国王们也做广告，包括剪彩仪式之类。不过，那是欧洲，而不是中国。中国皇帝，包括那位末代皇帝都早死光了，怎么要他们来兼任推销员呢？\n现在宣传人民生活改善的材料，不可少的一条是家里装了电视机。我想中国皇帝可没有一个得到这么大的幸福，因为那时还没有电视机。无电视可看，也不能去做电视广告。现在电视里皇帝的戏真多。每天打开电视机，很难得看不见皇帝。也不知那一位是好皇帝，或者坏皇帝。有一点是共同的，就是都超越了时间和空间，满嘴里自由、民主、平等、仁爱。艺术家有创作自由，皇帝、神仙、花鸟鱼虫都可以为艺术家所用。但是真名实姓的，所作所为总不能离真实人物太远。要奴隶主大讲民主，总叫人好笑。那时也讲民主，那就是奴隶主们的民主，他们绝不会给奴隶们民主。秦始皇的民主也只给封建主，绝不给农民。奴隶主捉了俘虏不杀，叫他做奴隶，就属于历史的进步了，要他做更多的事，是不可能的。同样，资产阶级实行僱佣制，就比封建制进步。解决人类的彻底解放问题，只有社会主义。将来没有专政了，也就沒有民主了。\n沒有纸了，到此为止。\n祝大家5.1快乐，大王小王生日快乐。"
 chi_GRnews.75.a: "爸爸\n2000年4月22日"
 chi_GRnews.76: "桥的家书·其二"
 chi_GRnews.76.t: "桥的家书·其二"
 chi_GRnews.76.d: "亲爱的大女儿：\n\n欣逢你五十五岁生日，我们祝福你！祝福你们全家！\n55年不算短，也不算长。希望你下一个55年，过得更有意思，更快乐。\n这个月，看《康熙》，总要听到那一句“真想再活五百年”，莫明其妙。什么意思呢？康熙爷真活五百年，我们还要向这位皇上下跪，真是荒唐！不过，也难怪。当今世界，想让剥削阶级、剥削制度再活五百年的，大有人在。“新千年”之说，就不绝于耳。特别是头几年，看到的、听到的都是资本主义找到了“自我完善”的方法，马克思关于资本主义将要灭亡的论断错了。事实是不骗人的。四架飞机在“9 · 11”撞了一下，这类神话就难以出口了。世界经济停滞不前。被吹捧得神乎其神的格林斯潘也傻眼了。阿根廷政治、经济，一片混乱。在法国，连宪兵都罢工了，这也算新世纪的一景吧。当然，资产阶级能找到办法收拾局面的，资本主义不会马上垮台。但是，资本主义从16世纪算起确实有五百年的历史了，它大概也想再活五百年，来个新千年。不过，我想，他们的命运恐怕不会比康熙爷好，也许不用那么长的时间就会被社会主义代替。剥削阶级剥削制度总要被共产主义代替的。真正的万岁，是共产主义，是人民，是我们这些为共产主义奋斗的人。\n\n这些话，现在不大有人讲了，我还是想讲给女儿听，当作2002年的生日礼物。愿你珍惜这份礼物。"
 chi_GRnews.76.a: "爸爸 妈妈\n2001、12、31"
 chi_GRnews.77: "张春桥病亡"
 chi_GRnews.77.t: "张春桥病亡"
 chi_GRnews.77.d: "新华社北京5月10日电 林彪、江青反革命集团案主犯张春桥因患癌症，于2005年4月21日病亡。\n\n张春桥，男，汉族，山东巨野人，江青反革命集团的主犯。曾任中华人民共和国国务院副总理、中国人民解放军总政治部主任。被选为中共九、十届中央委员、中央政治局委员，中共十届中央政治局常务委员会委员。他是四人帮成员、无产阶级文化大革命主要策划者之一。1976年10月，被中共中央隔离审查。1977年7月经中共十届三中全会决定，被永远开除党籍，并被撤销党内外一切职务。1981年1月25日受到中华人民共和国最高人民法院特别法庭的公开审判，被判处死刑，缓期二年执行，剥夺政治权利终身。1983年1月被依法减为无期徒刑，原判处剥夺政治权利终身不变。1997年12月减为有期徒刑18年，剥夺政治权利10年。1998年1月保外就医。2005年4月病亡。"
 chi_GRnews.77.a: "……"
 chi_GRnews.78: "姚文元病亡"
 chi_GRnews.78.t: "姚文元病亡"
 chi_GRnews.78.d: " 新华社北京1月6日电 林彪、江青反革命集团案主犯姚文元因患糖尿病，于2005年12月23日病亡。\n\n姚文元，男，74岁，1976年同江青、张春桥、王洪文一起，阴谋篡夺党和国家的最高权力。1976年10月7日经中共中央政治局决定，被隔离审查。1977年中共十届三中全会通过《关于王洪文、张春桥、江青、姚文元反党集团的决议》，永远开除其党籍，撤销其党内外一切职务。1981年，被最高人民法院特别法庭定为江青反革命集团主犯，犯有领导反革命集团、阴谋颠覆政府、进行反革命宣传煽动和诬告、陷害等罪行。依法判处有期徒刑二十年，剥夺政治权利五年。1996年10月刑满释放。"
 chi_GRnews.78.a: "……"
 chi_GRnews.79: "台北-福州大桥"
 chi_GRnews.79.t: "台北-福州大桥"
 chi_GRnews.79.d: "两岸统一后，我们亟需一条能够连接大陆与台湾的大桥。经过中央决策，得出了以下几个建造方案，我们应该选择哪一个？"
 chi_GRnews.79.a: "越快越好！倾斜一切所需资源！"
 chi_GRnews.79.b: "还是慢一点好，不能出乱子"
 chi_GRnews.79.c: "谁需要一座破桥？"
 chi_GRnews.80: "台福大桥建成！"
 chi_GRnews.80.t: "台福大桥建成！"
 chi_GRnews.80.d: "经过两岸工人数百日的奋斗，我国终于完成了台福大桥工程。经过数个月的试运行期，这条大桥就可以用向社会开放了。"
 chi_GRnews.80.a: "两岸紧紧不可分割"
 chi_GRnews.81: "《寻秦记》正在热播！"
 chi_GRnews.81.t: "《寻秦记》正在热播！"
 chi_GRnews.81.d: "改编自黄易于1998年所作同名小说的《寻秦记》电视剧于2001年10月15日上映于香港地区，其碟片也迅速传播至大陆地区。剧情讲述了21世纪特种部队人员项少龙（古天乐饰）决意要参加穿梭时空的研究，只为挽回自己的爱情。但由于时光机的数据出错，把项少龙带到了战国时期。当时的嬴政（林峯饰）还没有登上帝位，更被囚禁于赵国。项少龙为了能返回未来，便不惜一切代价，希望能帮助嬴政顺利登上帝位。由于项少龙的机智过人与特殊身份，他的能力得到众人的赏识，但也因此遭到多方奸狡之人的暗算。在腹背受敌的情况下，项少龙上演了一场恋爱故事。\n该剧一经播出就大受好评。"
 chi_GRnews.81.a: "今日吾躯归故土，他朝君体也相同"
 chi_GRnews.82: "《人在囧途》正在热播！"
 chi_GRnews.82.t: "《人在囧途》正在热播！"
 chi_GRnews.82.d: "6月4日，影院上映了一部名为《人在囧途》的电影，6月22日其票房突破3300万。春节将近，玩具集团老板李成功（徐峥饰）回长沙过年，同时在情人曼妮（李曼饰）的逼迫下，准备过年后跟老婆（左小青饰）离婚。结果，在机场遇到前往长沙讨债的“资深”挤奶工牛耿（王宝强饰）后，霉运不断。命运的捉弄，牛耿一路都与李成功不期而遇。两人路途中囧事不断，也遭遇了各式各样的人和千奇百怪的事情，弄得李成功狼狈不堪，高贵形象荡然无存，牛耿却不以为然乐观积极。为了能够回家，二人结伴而行，他们换了各种交通方式奔波在回家的路上，飞机，火车，大巴，轮渡，搭货车，甚至拖拉机。但是两人还是在荒郊野外度过了大年三十，回首这一路的艰辛，与他们路途中遇到人或事，对两人人生有了很大触动。最终，在两人一路经历了从陌生人到成为朋友，牛耿的真诚也改变了李成功冷漠的性格，唤起李成功对真情的回归\n该电影一经放映就大受好评，重庆时报评论：该片剧情与1987年美片《一路顺疯》颇为相似，但反映中国社会情况方面，值得肯定。本片更多的从人物和生活的细节出发，所以更加贴近生活。本片从头至尾都保持着一种收放自如的基调，片子节奏不是很快，但是观影者始终能随着片子的脚步进行，流畅的故事外加多有冲突的剧情加深了情节的张力，这是片子的成功之处。而且将一个公路题材的的老套故事加以平民化，也能进入到角色当中。"
 chi_GRnews.82.a: "你也是老板，你是哪个农场的？"
 chi_GRnews.83: "《让子弹飞》正在热播！"
 chi_GRnews.83.t: "《让子弹飞》正在热播！"
 chi_GRnews.83.d: "12月16日，由姜文执导，述平、姜文、郭俊立、危笑、李不空、朱苏进、马识途编剧， 姜文、周润发、葛优、刘嘉玲、陈坤、周韵、廖凡、姜武等主演的剧情片《让子弹飞》在大陆首映。该片根据马识途小说《夜谭十记》改编，讲述了悍匪张牧之摇身一变化名清官“马邦德”上任鹅城县长，并与镇守鹅城的恶霸黄四郎展开一场激烈争斗的故事。剧情讲述了在民国乱世，马邦德（葛优饰）通过金钱捐得县长一职，携妻子（刘嘉玲饰）及随从踏上了前往鹅城的任途。然而，他们的旅程在南国的一片荒野中被劫匪张麻子（姜文饰）的伏击所打断，随从们惨遭杀害，只有马邦德夫妇侥幸逃生。为了保命，马邦德急中生智，谎称自己是县长的师爷，而张麻子则被马邦德所描述的财富所吸引，决定冒充县长，带领手下前往鹅城。鹅城，这个偏远之地，实际上由一方霸主黄四郎（周润发饰）掌控，他权势滔天，对新来的县长并不放在眼里。张麻子上任后不久，便与黄四郎的势力发生了冲突，他痛打了黄的武教头（姜武饰），而黄四郎则设计害死了张麻子的义子小六（张默饰）。原本只想要安稳赚钱的马邦德，意外地卷入了这场土匪与恶霸的权力斗争之中。鹅城上空笼罩着一层不祥的阴云，预示着即将到来的血雨腥风，一场关于权势、金钱与正义的较量即将展开。"
 chi_GRnews.83.a: "别急，让子弹飞一会儿"
 chi_GRnews.84: "北京小米科技有限公司正式成立"
 chi_GRnews.84.t: "北京小米科技有限公司正式成立"
 chi_GRnews.84.d: "4月6日，老牌互联网企业金山软件的掌舵者雷军号召十几名员工围在一起，一人喝了一碗小米粥，宣布创办公司，并将公司名称定为“小米”。年逾不惑的雷军创办小米让很多人感到意外，雷军讲述了他的创业动机：“国内的手机市场，一类是诺基亚、摩托摩拉和三星这样的国际巨头，另一类是国产的‘中华酷联（中兴、华为、酷派、联想）’，还有就是铺天盖地的山寨手机。中国市场主要被国际巨头把持，产品贵的离谱，而国产手机都做的非常一般。凭什么他们能把钱这样赚走了？我要做全球最好的手机，只卖一半的价钱，让每个人都买得起！”\n\n同日，北京小米科技有限公司正式成立，并入驻银谷大厦。这家白手起家的科技企业潜力无穷。"
 chi_GRnews.84.a: "技术为本、性价比为纲、做最酷的产品"
 chi_GRnews.85: "英雄联盟国服公测"
 chi_GRnews.85.t: "英雄联盟国服公测"
 chi_GRnews.85.d: "自2009年登陆欧美市场之后，美国拳头游戏（Riot Games）公司开发的游戏《英雄联盟》就凭借其出色的游戏品质，成功夺得欧美竞技网游的头魁。2011年9月22日，《英雄联盟》中国国服公测正式启动，由中国大陆地区腾讯游戏代理运营，其火爆程度与日俱增，而众多知名游戏人和电竞选手的入驻，使其成为街知巷闻、全民加盟的热门网游。这款游戏在可见的未来将成为中国的现象级游戏。"
 chi_GRnews.85.a: "德玛西亚之力！"

 chi_GRnews.100.t: "[FROM.GetNameDef]质疑《瑷珲条约》"
 chi_GRnews.100.d: "腐朽无能的清朝政府在1858年被迫签订《瑷珲条约》，确定沙俄在远东地区的统治地位。\n\n而随着[FROM.GetName]军事实力与国际地位的提升，近期他们宣称不承认这种不平等条约，要求交出该地区的控制权。"
 chi_GRnews.100.a: "他们在开什么玩笑？"
 chi_GRnews.101.t: "[FROM.GetName]拒绝废除条约"
 chi_GRnews.101.d: "在我们宣布自己合理要求后，[FROM.GetName]却宣布拒绝废除当年清政府被迫签订的《瑷珲条约》，[FROM.Getleader]声称我们的做法是一种“赤裸裸的侵略”。"
 chi_GRnews.110.t: "锡金宣布独立"
 chi_GRnews.110.d: "就在我们与[FROM.GetName]战争处于不利情况下，锡金王国宣布独立并脱离印度，这显然是因为[FROM.Getleader]在背后支持他们！"
 chi_GRnews.110.a: "我们可以征服锡金无数次！"
 chi_GRnews.110.b: "暂时别管锡金的事情"
 chi_GRnews.120.t: "[FROM.GetNameDef]要求历史赔偿"
 chi_GRnews.120.d: "[FROM.Getleader]宣称我们的国家历史上曾经参与对他们的侵略，并要求我们为当时入侵支付一笔不菲的赔偿..."
 chi_GRnews.120.a: "他们在开什么玩笑？"
 chi_GRnews.120.b: "好吧，反正这也不是很贵"
 chi_GRnews.121.t: "[FROM.GetNameDef]拒绝进行赔偿"
 chi_GRnews.121.d: "在我们宣布自己合理要求后，[FROM.GetName]却宣布拒绝对当年的历史罪行做出任何赔偿，[FROM.Getleader]声称这是我们是在扩大所谓“反对自由”的宣传口号。"
 chi_GRnews.122.t: "[FROM.GetNameDef]同意进行赔偿"
 chi_GRnews.122.d: "在我们宣布自己合理要求后，[FROM.GetName]同意将赔偿其在历史上犯下的错误行为。"
 chi_GRnews.122.a: "这很不错..."
 chi_GRnews.130.t: "[FROM.GetNameDef]要求正视历史"
 chi_GRnews.130.d: "近日，[FROM.Getleader]公开要求我们对20世纪中期发生的中日战争之中的罪行进行公开道歉，并承诺在历史书之中详细且真实的叙述所发生的一切。"
 chi_GRnews.130.a: "正视历史，才有未来"
 chi_GRnews.130.b: "我们不会向他们屈服！"
 chi_GRnews.131.t: "[FROM.GetNameDef]拒绝正视历史"
 chi_GRnews.131.d: "在我们宣布自己合理要求后，[FROM.Getleader]却宣布“不会迫于压力”而拒绝停止歪曲历史的行为，他们仍然在错误的道路上越陷越深！"
 chi_GRnews.131.b: "进行强烈抗议"
 chi_GRnews.132.t: "[FROM.GetNameDef]同意正视历史"
 chi_GRnews.132.d: "在我们宣布自己合理要求后，[FROM.Getleader]宣布将会对侵华罪行进行公开道歉，并承诺在历史书之中详细且真实的叙述所发生的一切。"
 chi_GRnews.132.a: "很好！"
#新闻#
 chi_news.1: "三峡大坝竣工！"
 chi_news.1.t: "三峡大坝竣工！"
 chi_news.1.d: "从1994年12月14日三峡大坝开工建设开始，到2006年5月20日，三峡大坝全线竣工。三峡大坝这一超级工程的混凝土体积达1610万立方米，是当今世界上已建大坝混凝土量最多、坝体过流孔口最多、泄流量最大的重力坝。其全线建成，意味着三峡工程开始全面发挥防洪能力，使长江荆江河段的防洪标准由10年一遇提高到100年一遇，有效保护长江中下游平原地区数千万人口和数百万公顷耕地免受洪水威胁，使长江“黄金水道”的作用得到更为充分的显现和发挥。\n\n三峡工程发电效益可观，有助于缓解中国能源瓶颈，在构筑能源动脉，优化能源资源配置方面发挥重要作用。“十五”期间，中国提出了“西电东送”输电规划，建设北、中、南三大输电通道。其中，中通道西起四川，横跨三峡，东至上海。随着三峡大坝输变电工程建设，三常、三广等一系列输电工程相继投产，西电东送中通道初具规模。三峡电力、四川水电不断输往华东、广东，西部清洁水电在东部能源缺乏地区发挥了重要作用，能源资源在区域电网间得到了优化配置。"
 chi_news.1.a: "了不起的奇迹"
 chi_news.1.b: "人定胜天！"
 chi_news.2: "神舟五号发射"
 chi_news.2.t: "神舟五号发射"
 chi_news.2.d: "北京时间2003年10月15日9时整，神舟五号飞船搭载中国航天员杨利伟在酒泉卫星发射中心发射升空，在轨飞行14圈，历时21小时23分，顺利完成各项预定操作任务后，返回舱于北京时间2003年10月16日6时23分返回内蒙古主着陆场，其轨道舱留轨运行半年。\n\n神舟五号任务的圆满成功，标志着中国成为美国、苏联之后，世界上第三个独立掌握载人航天技术的国家。"
 chi_news.2.a: "月亮上有没有一位叫嫦娥的中国姑娘？"
 chi_news.2.b: "星辰大海！"
 chi_news.3: "中国阅兵"
 chi_news.3.t: "中国建国60周年阅兵"
 chi_news.3.d: "2009年10月1日，庆祝中华人民共和国成立60周年大会于2009年10月1日上午在北京天安门广场隆重举行，20万军民以盛大的阅兵仪式和群众游行欢庆新中国60华诞。时任中共中央总书记、国家主席、中央军委主席胡锦涛检阅受阅部队，并发表重要讲话。在天安门前，中国主席胡锦涛依次检阅由中国人民解放军陆海空三军和人民武装警察部队、民兵预备役部队组成的44个精神抖擞、装备精良的地面方队。\n\n阅兵仪式最后是全部由青少年组成的以“美好未来”为主题的游行方阵，少年儿童们高唱《中国少年先锋队队歌》，昭示着中国特色社会主义事业薪火相传、后继有人。当5000多名手持彩色气球和缤纷花环的少年儿童来到天安门前，《歌唱祖国》的乐曲响彻整个广场。在激昂的歌声中，少年儿童放飞手中的气球，并与天安门广场前区成千上万的青少年一起春潮般涌向金水桥。5万只气球腾空而起，青少年们向着天安门城楼挥舞花环，尽情欢呼、尽情跳跃。城城楼上下真情交融，广场内外一片欢腾，全体中国人共同庆祝这个盛大节日，共同祝愿祖国与世界明天更加美好。"
 chi_news.3.a: "巨龙展示了龙鳞的一角"
 chi_news.3.b: "中华人民共和国万岁！世界人民大团结万岁！"
 chi_news.4: "2010上海世博会"
 chi_news.4.t: "2010上海世博会"
 chi_news.4.d: "2010年5月1日，中国2010年上海世界博览会在中国上海市举行，这是第41届世界博览会。本次世博会以“和谐城市”的理念来回应对“城市，让生活更美好”的诉求，以蓝色和绿色为主题颜色，这不仅是对改革开放以来中国迅速发展的一次展示，也是对胡锦涛主席所提倡的“科学发展观”精神的贯彻。\n\n中国从一个贫穷、落后的国家，越来越变成走在世界前沿的大国。"
 chi_news.4.a: "我喜欢蓝色"
 chi_news.4.b: "和谐发展"
 chi_aiib.1: "亚洲基础设施投资银行成立"
 chi_aiib.1.t: "亚洲基础设施投资银行成立"
 chi_aiib.1.d: "2014年10月24日，包括中国、印度、新加坡等在内21个首批意向创始成员国的财长和授权代表在北京签约，共同决定成立投行。2015年12月25日，亚洲基础设施投资银行正式成立。2016年1月16日至18日，亚投行开业仪式暨理事会和董事会成立大会在北京举行。\n\n亚洲基础设施投资银行是一个政府间性质的亚洲区域多边开发机构。重点支持基础设施建设，成立宗旨是为了促进亚洲区域的建设互联互通化和经济一体化的进程，并且加强中国及其他亚洲国家和地区的合作，是首个由中国倡议设立的多边金融机构，总部设在北京，法定资本1000亿美元。截至2023年，亚投行有109个成员国。"
 chi_aiib.1.a: "我们该在哪签字？"
 chi_aiib.1.b: "我们拒绝这种侵犯主权的事"
 chi_aiib.1.c: "我们的影响力与日俱增"
 chi_sars.3: "中国出现新型病毒"
 chi_sars.3.t: "中国出现新型病毒"
 chi_sars.3.d: "中国政府今天向世界卫生组织公布，在中国南部出现了一种传染力极强的新型病毒。世界卫生组织在初步调查后，发现该病毒是一种导致严重急性呼吸综合症的，属于套式病毒目、冠状病毒科、冠状病毒属，为β属B亚群冠状病毒，目前命名为SARS病毒。该病毒已导致多名中国公民死亡，并迅速传播至中国和世界的其他地区。"
 chi_sars.3.a: "中国人带来的病毒……"
 chi_sars.3.b: "希望所有人都能安全"
 chi_sars.4: "SARS病毒感染者人数停止增长"
 chi_sars.4.t: "SARS病毒感染者人数停止增长"
 chi_sars.4.d: "2003年7月13日，全球非典患者人数、疑似病例人数均不再增长，本次非典过程基本结束。这次长达半年多的病毒传播对世界造成了深远影响，中国和其他地区的国家都受到不同程度的经济社会损失。"
 chi_sars.4.a: "以后不会有了吧？"
 chi_sars.4.b: "终于结束了"
 chi_sars.5: "中国爆发不明病毒"
 chi_sars.5.t: "中国爆发不明病毒"
 chi_sars.5.d: "2003年3月25日，中国广东省中医院二沙岛分院急诊科的一位名叫叶欣的护士长，因感染不明病毒逝世，迅速引起群众恐慌。医院人员愤怒地指控是中国当局隐瞒病毒事态，错过了最好的防控时期。据他们所说，中国南部在数月前出现了一种传染力极强的新型病毒，目前已造成多人死亡。\n\n世界卫生组织迅速派专门小组前往中国调查该病毒，但在入境时受到了中国方面的阻挠。目前尚不明确为何中国当局一再隐瞒和否决病毒情况，但可以确定的是，中国当局的行径引起了其他国家的恐慌与指责。"
 chi_sars.5.a: "他们怎么敢？"
 chi_sars.5.b: "马上把泄密的叛徒抓起来！"
 chi_news.5: "青藏铁路全线通车"
 chi_news.5.t: "青藏铁路全线通车"
 chi_news.5.d: "2006年7月1日，世界最高的高原上终于建起了铁路，中国从2001年6月起，耗时6年在青藏高原上修建了长达1956千米的铁路线，是世界上海拔最高、在冻土上路程最长、克服了世界级困难的高原铁路，是人类历史上的工程奇迹。\n\n这不仅标志着中国对落后地区的进一步支持，也证明了北京对中国边疆地区的控制加强了。"
 chi_news.5.a: "了不起的奇迹"
 chi_news.5.b: "把铁路修上天！"
 chi_aiib.3: "[FROM.GetName]成为了亚洲基础设施投资银行成员国"
 chi_aiib.3.t: "[FROM.GetName]成为了亚洲基础设施投资银行成员国"
 chi_aiib.3.d: "经过一系列申请、评估和对接后，[FROM.GetLeader]政府今日宣布他们国家成为了亚洲基础设施投资银行的成员国。一些观察家满怀希望地认为这象征着中国和其他国家经济合作的进一步发展，然而悲观的分析人士则对中国日益增长的影响力及其对现有世界秩序构成的威胁深表遗憾。"
 chi_aiib.3.a: "人民币在流动"
 chi_aiib.3.b: "许尔述职"
 chi_aiib.4: "亚洲基础设施投资银行启动年度发展援助"
 chi_aiib.4.t: "亚洲基础设施投资银行启动年度发展援助"
 chi_aiib.4.d: "经过一系列的预算估计和对接，总部位于北京的亚洲基础设施投资银行宣布将为每一位成员国提供时长一年的发展援助。中国表示将支付其中大部分的援助成本，中国主席习近平表示，帮扶落后国家是当代中国身为大国的责任，为破解发展困境贡献中国智慧，为解决全球发展问题贡献中国力量，展现大国外交担当。中国呼吁，各国应该建立一个更加和平、稳定、繁荣的世界，远离贫困和战争。\n\n国际普遍认为，这是中国履行其建立“人类命运共同体”目标的一个分支策略，也是拓张其国际影响力的手段。"
 chi_aiib.4.a: "为他们鼓掌"
 chi_aiib.4.b: "润物细无声"
 chi_aiib.5: "亚洲基础设施投资银行提供低息贷款"
 chi_aiib.5.t: "亚洲基础设施投资银行提供低息贷款"
 chi_aiib.5.d: "经过一系列的预算估计和对接，总部位于北京的亚洲基础设施投资银行宣布将为每一位成员国提供低息贷款。中国表示将由本国银行提供主要贷款支出，中国主席习近平表示，改善国际金融环境，建立新型国际金融体系，是每个国家的殷殷期盼，中国将致力于建立一个更加平等、透明的国际金融体系。中国呼吁，各国应打破关税壁垒，加强金融交流，促进金融全球化进程，顺应经济全球化潮流。\n\n国际普遍认为，这是中国履行其建立“人类命运共同体”目标的一个分支策略，也是拓张其国际影响力的手段。"
 chi_aiib.5.a: "人民币在流通"
 chi_aiib.5.b: "仁者播其惠，信者效其忠"
 chi_news.9: "沙特伊朗“北京和解”"
 chi_news.9.t: "沙特伊朗“北京和解”"
 chi_news.9.d: "昨晚，由中华人民共和国、沙特阿拉伯王国、伊朗伊斯兰共和国三方共同发布的联合声明一下成为了国内外媒体的头条热点，也为当前这个动荡不安和被俄乌冲突阴霾笼罩一年多的世界增添了一份和平的能量。声明的核心要义是：沙特和伊朗将达成一份协议，包括同意恢复双方外交关系，在至多两个月内重开双方使馆和代表机构，安排互派大使，并探讨加强双边关系。三国表示愿尽一切努力，加强国际地区和平与安全。\n\n毫无疑问，“北京和解”的达成，中国角色不可或缺。中国外交部长王毅在对话会后介绍道，此次北京对话在中沙伊三国领导人的共识基础上得以推进。对话也成为有力践行“全球安全倡议”的一次成功实践。作为一个善意、可靠的斡旋者，中方忠实履行了东道主职责。\n\n观察家认为，这是和平外交的胜利与中国与日俱增的国际影响力的彰显。"
 chi_news.9.a: "中国的手伸到中东去了？"
 chi_news.9.b: "和气生财"
 chi_news.27: "中华人民共和国第十届全国人民代表大会"
 chi_news.27.t: "中华人民共和国第十届全国人民代表大会"
 chi_news.27.d: "2003年3月4日，中华人民共和国第十届全国人民代表大会在北京召开。第一次会议议程上选举了中华人民共和国主席为中央委员会总书记胡锦涛，并决定了决定国务院总理的人选即温家宝。这标志着中国的领导权正式转交于由胡锦涛和温家宝所代表的新一代领导集团。"
 chi_news.27.a: "一位谨慎的绅士"
 chi_news.27.b: "团结在以胡锦涛同志为总书记的党中央周围！"
 chi_news.28: "中华人民共和国第十二届全国人民代表大会"
 chi_news.28.t: "中华人民共和国第十二届全国人民代表大会"
 chi_news.28.d: "中华人民共和国第十二届全国人民代表大会于2013年3月5日召开。第一次会议议程上选举了中华人民共和国主席为中央委员会总书记习近平，并决定了决定国务院总理的人选即李克强。这标志着中国的领导权正式转交于由习近平所代表的新一代领导集团。\n\n前总书记胡锦涛在本次领导换届中一次性辞去了所有的职务，开创了前所未有的作风。习近平在讲话中对此举表达敬意，称胡锦涛等同志带头退出党中央领导岗位体现了崇高品德和高风亮节。"
 chi_news.28.a: "辞去了所有的职务？"
 chi_news.28.b: "紧密团结在以习近平同志为核心的党中央周围！"
 
 chi_news.100.t: "“汉芯”造假事件"
 chi_news.100.d: "2003年2月，来自上海交通大学微电子学院院长陈进宣称发明了“汉芯一号”，“汉芯一号”宣称其采用国际先进的0.18微米半导体工艺设计，集成了250万个器件，且具有32位运算处理内核，每秒能进行2亿次运算。\n\n虽然当时的权威专家认为这是中国半导体行业的一次进步，且被视为“汉芯1号”发明人陈进也是荣誉加身，但是2006年1月17日，在清华大学水木清华BBS上，有人公开指责其发明的“汉芯一号”造假。\n\n在经过两个多月的取证和调查之后，官方最终发现陈进在负责研制“汉芯”系列芯片过程中存在严重的造假和欺骗行为，以虚假科研成果欺骗了所有人。造假被发现后，给整个中国的自主芯片产业陷入了信任危机，半导体发展一度停滞。"
 chi_news.100.a: "他们一直都是这样造假的吗？"
 chi_news.100.b: "我要说不出话了。"
 chi_news.93.t: "抗日战争胜利80周年阅兵"
 chi_news.93.d: "2025年9月3日上午，纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会在北京天安门广场隆重举行。\n\n此次阅兵的受阅武器装备以新型四代装备为主体，如新型坦克、舰载机、歼击机等，按作战模块进行编组，展示解放军体系作战能力；遴选陆海空系列无人智能和反无人装备等新型力量受阅，如新型无人机、定向能武器、电子干扰系统等；集中亮相了新型高超声速、防空反导、战略导弹等先进战略武器装备。\n\n此次阅兵目的是彰显中国人民抗日战争作为世界反法西斯战争东方主战场的历史地位和对世界反法西斯战争胜利的重大贡献，彰显中国共产党在抗日战争中的中流砥柱作用，彰显中国坚决捍卫二战胜利成果和国际公平正义、积极推动构建人类命运共同体的责任担当。"
 chi_news.93.a: "值得关注..."
 chi_news.93.b: "正义必胜！和平必胜！"
