 chi_GR.0: "游玩须知"
 chi_GR.0.t: "千禧黎明：伟大复兴 游玩须知"
 chi_GR.0.d: "感谢游玩本mod，本mod没有在千禧黎明原版的基础上添加太多新机制，如要提高游玩体验需注意以下几点/常见问题见下：\n\n1.千禧黎明原版设置了“能源系统”，每时每刻都要通过消耗燃油来维持能源运行和生产，中国这样的大国开局是需要不停进口石油的，请确保储油罐里的油不至于归零，否则将带来巨额惩罚。\n\n2.开局时部分国策树已经隐藏，需要在现实发生的时间触发事件后方可选择。\n\n3.中国在“和平共处”的国家精神影响下主动宣战则受到一定惩罚，但可以在游戏中通过国策、决议来宣战，或者提升整体战争意愿避免惩罚。\n\n4.中国社会思潮系统会根据不同人群的支持度带来不同效果，每月更新一次。\n\n5.中美博弈系统会影响世界各国，根据他们站边或中立带来不同类型的效果，再根据中美两方的影响力高低给予不同程度的加成。\n\n6.本mod有一些自定义的开局规则可供选择。\n\n本mod还在持续制作中，任何数值和效果都随时可能修改。如若有什么想法或者碰到什么bug，请在创意工坊讨论区留言。"
 chi_GR.0.a: "我已知晓"
 chi_GR.0.b: "我想来点不一样的"
 chi_GR.1: "千禧年的第一天"
 chi_GR.1.t: "千禧年的第一天"
 chi_GR.1.d: "“小芸，近来安好。严格意义上来说，2001年1月1日才是千禧年的第一天。不过大家都觉得2000年1月1日就是千禧年了，也确实做了许多庆典活动，如果现在再提出“明年才是千禧年”之类的观点，大概只会被当做扫兴者和爱钻牛角尖的怪胎，所以就当现在是千禧年了吧。\n\n我最近听到一些信耶稣的人做的讲座，说千禧年跟他们的教义有关。可真是奇怪，千禧年在基督教教义中是大和平、大繁荣的时代，现实却是到处都在打仗—从阿富汗和尼泊尔的内战，到安哥拉的解放战争，再到刚果和缅甸的军阀混战——一点儿也看不出哪里大和平了。但大繁荣倒是验证了，纽约和东京的街头车水马龙，深圳和广州的工厂里到处都是张牙舞爪的流水线，就连冷战的前线——朝韩边境线上，也只剩了广播的余音，以及南边锣鼓喧天的流行乐。\n\n我现在在这边做一些社区工作，简单来说就是同一些城里的老头老太太打交道吧，说累也不算累，不过肯定算不得轻松。\n\n无论怎样，希望你一切安好。这是我到北京之后写的第一封电子邮件，你在学校里应该已经写过不少了吧。我在北京很好，这儿除了冬天刮大风，春天刮黄沙之外，其他一切都很好，听说北京这边的摇滚乐很流行，不过我不太听得惯那么吵的音乐。这儿比老家厉害多了！今年过年记得带一点深圳的特产回来，我会往你的红包里多塞点的。但是好像那边也没什么可称得上特产的东西……\n\n总之，一定要好好学习，我相信你能考上一所好大学的，女孩子还是多多念书好。”"
 chi_GR.1.a: "傻宝老哥 2000年1月1日"
 chi_bush.1: "小布什的信"
 chi_bush.1.t: "小布什来信"
 chi_bush.1.d: "当主席读完美国这封已经被迫修改了五次的信稿时，他还是忍不住骂出声。\n\n“不要脸的美国佬还是这样的作风，very sorry有什么用嘛，嘴吧讲烂，我们的人还不是找不到了！”\n\n“这是华盛顿那边和布什总统能接受的最大程度的道歉了。”唐家璇外长面色凝重地向主席说。\n\n“我上次去智利就狠狠把美国佬骂了一顿，他们很快就服软了，要是我下次去什么国家时再骂一次，他们可能还会服软。”主席苦笑，“就是服软又有什么用嘛，才说不能被看笑话，这次真是让外国看了个大笑话。自家的海域被美国撞掉飞机下来，美国佬真是挑得起事。”面对大洋对岸的国家，主席深感无力，同时为中国缺乏足够的军事和外交实力而感到痛苦，不禁叹息。“我们的海军和空军这样差，是没法子确保国家安全的，美国人把航母开进来我们就没有办法了。要是我们也有航母，上面停满飞机，美国人还敢撞我们的人吗？”\n\n唐外长顿了一顿，用一种试探的眼神看着主席：“土耳其那边的谈判比较顺利，预计不久就可以给船放行了。”主席听后，说：“只要能开到国内就是坠吼的，不惜成本也要改装吼啊！我们等有航母的一天等的太久了！”\n\n外长点点头：“对美国人来说，航母才是外交的真资本，手里捏着航母的国家才有资格谈判。不过眼下还是得顺着这封改了五次的道歉信做回应，不然可能把关系搞得更差。”主席长叹一口气，沉默了数十秒钟。"
 chi_bush.1.a: "“只能先这样了”"
 chi_GR.36: "打不溜踢我？"
 chi_GR.36.t: "打不溜踢我？"
 chi_GR.36.d: "“刚才你说的是啥东西？打不溜踢我？什么玩意儿怎么又不溜又踢人呢！”这已经不是第一个发出同样疑问的社区居民了，刘常军在过去的三天里每天都要重复回答无数遍类似的问题。\n\n“大爷，不是什么又溜又踢的，这是个洋词儿，用咱们中国话说就是‘世界贸易组织’，是跟外国人做生意用的！”“嗷，原来是做生意的。不过这玩意儿同我们有啥关系呀，咱们这街坊邻居也没谁是同洋人做生意的啊？你不会是来推销洋货的吧？不买不买！”刘常军赶忙把宣传牌立了起来，将标语转向这位大爷。“大爷您别走，我不是推销的，我是来咱们社区做知识普及的，您看我这红马甲，诺，这儿还有党徽呢，这哪有党员跑来干销售的啊您说。”刘常军用手指着宣传牌上的字样：“您瞧哇，咱们中国刚不久加入了世界贸易组织，外国货很快就会充满咱们这儿的货架。这外国的东西一进来，房价就会降，您家儿女以后买房可就容易了！话费、寻呼、药品、汽车……这些都会降价，咱老百姓的日子会越过越滋润的！而且，咱们可以开起来更多的工厂，让更多的小伙子小姑娘有份工作，把生产的东西卖到外国去，赚外国人的钞票，这样我们国家也会越来越有钱呀！”\n\n“真有这么多好处？怎么老感觉你在说假话……不过党员同志应该不会乱说吧？哎哎小同志先别走啊，传单给我一份，这样，我回去和老伴儿研究研究这个什么‘打不溜踢我’怎么申请加入，研究好了我就来找你。要让这外国人的钞票脚也踢踢咱家儿子的屁股！”\n\n刘常军有些汗颜，都说群众工作难做，这话不假，但几天下来他已经感受到了现实的厚重感，看着大爷高高兴兴离开的背影，他有种说不出的感觉。不过，宣传工作这种东西，只要效果到位了，也许过程并不那么重要？……"
 chi_GR.36.a: "“真希望小芸在深圳能学到更多‘打不溜踢我’的知识”"
 chi_GR.2: "小康"
 chi_GR.2.t: "小康"
 chi_GR.2.d: "当老师点到自己的名字时，尽管刘常芸已经做好了心理准备，但还是止不住心脏咚咚地跳。\n\n“刚才我们已经学了大道之行和天下大同的内容，实际上这篇古文还有后半段，里面讲的就不是大同了，而是我们时常能听到的‘小康’这个词。”老师将视线投向刘常芸，“小刘，你觉得小康是什么意思呢？”\n\n“老师，我猜……小康就是说生活比较安定的意思……吧？”刘常芸磕磕巴巴地说。\n\n“对，也不对。古代人把小康看作是比大同社会的级别低一点的美好社会，前面我们学了，大同社会是天下为公的，这个小康社会则是天下为家的，小康的世界是‘各亲其亲，各子其子，货力为己’，‘礼义以为纪，以正君臣，以笃父子，以睦兄弟，以和夫妇，以设制度，以立田里，以贤勇知，以功为己’，每个人都做好自己的事，过好自己的生活。大家可能会觉得哎呀怎么听起来这么自私啊，但是大家想一想，天下为公的世界现在都尚且无法做到呢，更何况数千年前的古代。古人也清楚这一点，所以希望建立一个各安其分，各谋其事的社会，这样总是比烽火连天或横征暴敛的现实要美好的。”老师又望向刘常芸，“小刘刚才说的生活比较安定的定义实际上也是很准确的，只有每个人都能过得好，才有可能建立起一个和谐、安稳的社会。现在不是说要建设小康社会吗？等以后你们长大了毕业了，就是小康社会建成时候了。那时候将会建成怎样一个美好的样子啊……”老师望向窗外，外面的天空半阴半晴，是深圳少见的天气。\n\n对于刘常芸来说，她不是很能理解老师憧憬的小康社会是个什么样，但她模模糊糊地有一个想法——"
 chi_GR.2.a: "“大概是比现在要好的”"
 chi_GR.3: "伟大复兴"
 chi_GR.3.t: "零件"
 chi_GR.3.d: "流水线嗡嗡作响，阿顺在聚精会神地调整源源不断送来的加工零件。\n\n几个月前他从职高毕业，找到了这份电子厂的工作。这儿工资不高，但工厂提供统一的廉价食宿，李程自己也不怎么花钱，每个月结算工钱后除了寄回老家的部分，还能剩下不少。人们都说他赶上好时候了，说前段时间国家加了什么什么组织，深圳的各种工厂像雨后春笋一般接连盖起来。他不太懂这些，只是觉得这份活挺累的，好在赚得也不少。\n\n“顺哥，下班了去隔壁网吧玩去啊，听说新来的网管是条靓女，饱眼福哦！”坐在旁边的工友小林凑过来说。\n\n“看个头，今天累死了，落工我回宿舍困觉去。”实际上，阿顺并不是不想去，只是因为每次去网吧都要花掉不少钱，那边连水都要收好几块钱，泡面也很贵。“死板鬼！不看就不看，我自己去咯。哦对，隔壁车间的王小美今天上工前一直盯着你看，我看有搞头哦!”\n\n“滚粗！做你的工啊，衰鬼！”阿顺一把把小林推开，其实是为了遮住自己红色的脸。他和那位王小美偷偷恋爱几个星期了，本想向别人隐瞒，没想到这么快就露馅了。尽管小美并不在乎李程是个穷小伙，但阿顺心里还是想早点赚够钱回老家县城买一套房，这样两个人才能在城里有安身之所。每次小美问他以后的打算时，他心里就有种激动感，似乎已经离买房近在咫尺了。阿顺一边加工电板，一边偷偷笑。"
 chi_GR.3.a: "只要肯吃苦就能成功"
 chi_GR.4: "主席的行程"
 chi_GR.4.t: "主席的行程"
 chi_GR.4.d: "主席在会议结束后很快离开了会议厅，不为别的，只是因为太累了。前几年小平同志去世后，主席成为了党内最德高望重的人，所有的事情都会自己找上门来，无论是好事坏事。主席被人们尊称为长者，这个称呼饱含着人们对他的尊敬与爱戴之意，然而他也确实是一位年过七旬的老人了，无论身力还是精力上都已经比不上年轻时候。他离开会议厅后只想快点到车上去睡一会儿。\n\n朱镕基总理很快从后面追了上来。这位国务院总理虽然与主席年纪相仿，但依然精力充沛，能够在各种问答会和记者会上对答如流，滴水不漏。朱总理赶上主席后，低声对主席说：“后面的会不去了，回去住处。”主席侧过身来望着总理，总理点了下头“行程都已经改好了，抽得出时间。\n\n“那不行的，怎么可以随便就改掉”主席摇摇头。“我跟你讲，有些事情搞了第一次就有无数次的，今天改得了，以后都能改吗？上行下效，以后其他同志也学着改，我都说不了人家。今天的会必须去，咳咳——”主席说话太急，把自己呛了一口，随后快速走出建筑大门上车了。“我跟你讲，到了新世纪咯，就要拿出新的精神头来，免得让那些外国佬又笑话我们这些老头子嘛。我后面有些计划，你准备好放给下面做去。”主席透过车窗向总理咧嘴笑，随后把车窗摇上去了。朱镕基总理见没法继续劝下去，只能走到后面一辆车上就座。\n\n傍晚，车队在流光四溢的城市中行驶，开得很慢，很稳。夕阳已经隐没在北京的楼宇之中，取而代之的是无数亮起灯光的千家万户。街道上多了许多下班回家的人，也有吃完晚饭出来散步的家庭。总理看着街上的行人，渐渐也睡着了。"
 chi_GR.4.a: "这就是值得守护的"
 chi_GR.5: "飞驰"
 chi_GR.5.t: "飞驰"
 chi_GR.5.d: "夕阳落下，随着夜色一起来的是打斗声。\n\n“他妈的把钱交出来！砍了你个狗杂种信不信！”身着花衬衫的人一边用脚猛踢蜷缩在角落的人一边恶狠狠地吼道。他身后站着五六个同样穿着花哨的人，正在嘻嘻笑。\n\n“大哥，大哥，我求求你了，我身上真没钱啊，下周才发工资呢！大哥，放了我吧大哥，我真求……”还不等话讲完，角落里的人被衬衫男一脚踢中下巴，顿时嘴里血流不止。\n\n“你这狗东西说你妈呢，穿这么好还说没钱，给老子装？！好，好嘛，不给你拆点零件下来是不懂事了。”衬衫男从旁边抄起一根长棍，狠狠地往男子身上甩去。随之而来的是一声声惨叫。\n\n“棍哥别打了，晶哥好像来了！”后面一个人拍衬衫男的肩膀。\n\n“妈的，哪个逼养的给晶哥通气了。”衬衫男朝身后几个人吼道，然后转过身朝角落的人啐了一口痰。“真他妈扫兴我操，这些看门狗下了班还这么敬业，真是群好狗。走了走了。”衬衫男又踹了男子一脚，跟几个跟班扬长而去。几声摩托车的引擎声轰轰作响，马上和欢呼和尖叫声一起消失在城市天空。\n\n当警察和报警的路人赶到男子身旁时，男子已经没了呼吸，手里紧攥着一个小盒，里面是一枚精致的女士手表。"
 chi_GR.5.a: "亲爱的女儿 生日快乐"
 chi_GR.6: "年轻人"
 chi_GR.6.t: "年轻人"
 chi_GR.6.d: "胡锦涛盯着这座又高由肃穆的大理石巨大建筑的正面。这就是人民大会堂，中国一切最大事务的宣布地点，国徽在其顶部耀耀生辉。高大的大理石柱在门前根根耸立，胡锦涛此前已经无数次走进这个建筑了，但此次来到还是有种初次来到北京就职时的感觉。这座建筑本身就是一种久远的、崇高的意志的体现，也是一座活生生的纪念碑，天安门城楼上的毛主席像静静看着几十年来这里发生的一切。胡锦涛似乎回到了自己在共青团工作的时期，在那段时间里他的青春和精力都在熊熊燃烧，奉献给了自己的理想。\n\n胡锦涛曾在这座建筑里庄严宣誓过，和无数其他人一样。他回想起那些当时同他一起宣誓过的人，大部分的人他早就毫无记忆，比较熟悉的一些人也已不知去向。在这里他承诺过要为崇高的事业奉献终生，要担起每一个共产党员都要担负的职责。他曾被许多人叫过“年轻人”，如今这位曾经的年轻人也已年将六旬，身体和精力大不如前。有时他询问自己：走到这一步到底是怎样的原因。但不管怎样，他要做的，都是自己曾经宣誓过要做到的事，无论他在什么位置。\n\n在深夜翻阅档案室资料时，他注意到一个身影悉悉索索出现在外面无人的大厅。那是一个清洁工，穿着工装来回反复地重复着拖地的机械动作。胡锦涛看着他的身影，突然升起一种奇怪的感觉。这个人就像他年轻时一样，常常在无人的地方干着无人知晓、无人在意的活，像这个社会无数其他人一样默默活着。永远无法跃迁的阶层，永远无法看见世界的美好，只是为了明天能活下去而努力在当下活着。难道这样就能实现国家富强和民族复兴吗？如果给他同样的机会和教育，说不定他也能成为一个工程师，一个航天员，一个对社会做出更大贡献的人。然而这个看起来50多岁的中老年人似乎已经在这里和这些阴沉沉的文档当了一辈子同事了，以后也会在这里每天重复同样的工作。\n\n胡锦涛默默把文件放回架子上，出去时他受到了那位老清洁工的弯腰敬礼，他拍拍他的肩膀，给了他一张手帕擦汗。在清洁工惊讶的目光下，胡锦涛走出了档案室，现在他心里有了更多的坚定——必须要让这片土地上的人过得更好。他在院子里感受着月光和微风，聆听那个青年时代的他的声音，"
 chi_GR.6.a: "终可似，少年游"
 chi_GR.7: "高原绿光"
 chi_GR.7.t: "高原绿光"
 chi_GR.7.d: "对普布来说，高原上的生活总是差不多的，除了望不到头的巨大雪山和偶尔跑走的羚羊和雪豹外，基本没有什么新鲜东西。祖母最近愈发病重，吃什么草药都会吐出来，普布只能去庙里向喇嘛求助。喇嘛说去汉人住的地方可以求到更灵验的药，但是普布这辈子都没有见过几个汉人，不会说也听不懂汉话，更别提这种地方根本就通往汉人居住地的路。\n\n普布白天向上天祈祷，晚上放完羊在祖母身旁祈祷，然而佛祖似乎并不怜悯这位奄奄一息的祖母和她虔诚的孙子。普布向喇嘛们打听了去汉人地界的路，要穿过四座雪山，走上七八天才能到另一个村子，那边能坐上去汉人城市的烧油的大车。普布没有办法离开祖母这么多天，她需要有人时刻照顾着。他每天都向无尽的大山祈祷，然后像往常一样祈祷神迹出现。\n\n他记得前几年山那头突然来了很多人，那些人带着很大很大的铁车到处砸和碓，不多久在地上留下长长两条铁棍，中间还有木头连着。据喇嘛说，那些是从很远的地方来的汉人，他们到这来是修路的。那种东西是路吗？哪有人在铁棍上走路和骑牛的？普布不懂这些，他更在乎的是祖母的病情。祖母前一天晚上跟普布说，让他多做几个青稞饼请一位喇嘛来家里照顾着，这样就能赶路去汉人地界找药了。普布一夜未眠，也流了一夜的泪，第二天他做好了青稞饼去庙里请来了喇嘛。\n\n高原的山是那么的高，挡住了世俗的浑浊，也挡住了人生的前路。普布走了一天就已经感觉体力不支了，然而他连路的四分之一都没走完。他坐在一块背阴的石头上，掏出青稞饼来吃。忽然，原处传来轰轰的声音，大地也开始颤抖。普布一开始以为是佛法中说的末法降临了，天地要崩坏，但过了一会儿又不像是那样。普布眼见一抹绿色从远处出现，越来越大，越来越响。那巨大的声音分明就是绿色东西发出的！当绿色长条从他面前飞速掠过时，他终于明白过来，这是汉人的大车在他们之前修的铁条上跑着呢。\n\n普布站了起来，跟着火车飞奔。祖母有救了，汉人把他们的车带来了！随后他才意识到，原来在数年前，汉人铺下的铁条路就注定他们终将会把救人的东西送到这儿来。"
 chi_GR.7.a: "扎西德勒，汉人朋友！"
 chi_GR.8: "水滴"
 chi_GR.8.t: "水滴"
 chi_GR.8.d: "“小朋友们，你们知道水是怎么来的吗？”\n\n“老师，水是从水龙头里放出来的！”\n\n“才不对，水应该是从井里捞出来的！”\n\n“你们都错了，水是天上掉下来的，下雨才有水！”孩子们七嘴八舌地议论着，都觉得自己或者别人说的有理。“大家说得都很对，这些地方都能弄到水。但是老师有一个不同的答案，老师觉得，水是从大家的手里‘省’出来的。”老师做了一个手捧的动作，弯腰假装捧起一抔水。\n\n“我们的生活中到处都是水，但是我们拥有的水却很少。世界上只有不到5%的水是我们可以使用的，因此在我们国家的很多地方，人们连水都用不上。他们有的人可能一生只能洗三次澡：出生，结婚，葬礼。我们国家很大，有很多水，但我们是世界上人口最多的国家，这样一来每个人能分到的水就很少了。”老师将无形的水转身放进杯子里，“因此，我们应该从身边各种地方开始节约我们的每一滴水，比如随手关闭水龙头，洗菜时用接好的水而不是流水等等。这样我们就可以为我们本不多的水资源献出自己的一份贡献，让更多人能用到水，大家说好不好啊？”\n\n“好！”孩子们似懂非懂，但心里已经多了一颗蓝色的种子。"
 chi_GR.8.a: "滴水成河，聚少成多"
 chi_GR.9: "黑太阳"
 chi_GR.9.t: "黑太阳" 
 chi_GR.9.d: "“我跟你说，那白天有时候简直跟黑天似的，灰乎乎的，连太阳都是灰的！”当刘常军听到那位河北同事如此描述家乡时，震惊得说不出话。\n\n“这么吓人？天咋会无缘无故成黑的了？”\n\n“我们家住在城郊，也算半个城里人了吧，城的那一头就是片巨大的工厂，炼钢的。这炼钢就得烧炉子哇，烧炉子就有烟，那工厂的大烟囱日日夜夜窟窟往外冒黑烟，有时候真能把天都熏黑了！别说大街上了，就连家里也得每天扫地，一扫就是一片黑渣子，那都是飘来的煤渣呢！”\n\n“这不会对人有害吗？这样的煤渣吸到肺里还能呼得出来？”\n\n“危害老大了！咱们那老人大多都是得肺病死的，不少年轻人也是年纪轻轻就咳个不停。还好我考到北京来了，不然在那过活估计得折寿几十年。”同事不经意地叹了一口气，刘常军听得清清楚楚。"
 chi_GR.9.a: "黑色的太阳到底是什么样的……"
 chi_GR.10: "圣洁的人"
 chi_GR.10.t: "圣洁的人"
 chi_GR.10.d: "“不好意思小刘姐，我不能用别人用过的杯子。”长跑结束后，刘常芸把水杯递给气喘吁吁的小马，但是小马摇摇头，略表歉意地婉拒了。\n\n“啊，我不是嫌弃小刘姐，只是我们家不让我这样……”小马见刘常芸露出不明所以的表情，连忙解释道。刘常芸这才记起来，小马是回族，有一些和别人不一样的地方，比如从来没有见过小马去学校食堂吃饭，据说是因为回族不能吃猪肉；又比如小马经常去卫生间洗脚，虽然确实很卫生，但频率还是太高了点。\n\n“哦哦原来是这样，没事的，我们买水去吧。不过我很好奇，如果把水倒进你的杯子里可以喝吗？或者说，怎样的水在你们那才是可以喝的？”\n\n“我爸妈说，用别人的杯子可能会喝到不干净的水。同样也不能和别人吃一个盘子里的东西。我们家很注重干净，要经常清洗身体和四肢，特别是做礼拜之前，一定要保持身体干净。”“不吃猪肉也是这个原因吗？”“应该是吧，妈妈总跟我说猪是不洁的东西，让我不要吃猪肉。不过我觉得养的小猪都白白的，应该不脏吧……”\n\n原来是卫生原因啊，但未免有点太讲究了。难道千百年来他们都是这样的吗？刘常芸心中想到。但不久之后她就忘掉了这件事，毕竟小马跟其他人没有任何区别，唯一会偶尔让她想起来的事是小马会经常洗手洗脚这件事。"
 chi_GR.10.a: "干净一点总是好事"
 chi_GR.11: "草原雄鹰"
 chi_GR.11.t: "草原雄鹰"
 chi_GR.11.d: "昏黑的天空下，内蒙古某偏僻的郊区，一座破旧的工厂还亮着灯，厂房里透出响亮的叫骂声。\n\n“怎么这点事都干不好，不就是多派给你几个零件吗？就这么几个零件你都能给装反了，真是厉害啊！？小毛同志！”工头打扮的人阴阳怪气地说，面前是被训斥得很委屈的小毛和其他工友。“亏你还是我们厂的党员代表，知不知道我给你这个名额你欠我多少？我给老总不知道磨了多少嘴皮子，想树你这个典型，结果你连这点小事都办砸了？真是瞎了眼睛了我。”\n\n“对不起戴总管，我下次一定改进！绝对不会犯错了！”\n\n“你本来就该改。还有，晚上别看那些乱七八糟的东西，让你入党不是让你搞破坏的，你天天看那些什么马克思主义的书是想搞什么？还讲给别人听？怎么，你想造反？跟那个湖南的土匪一样？”工头推了推小毛的脑袋，“别以为你姓个毛就真能像那个老东西一样搞什么乱子，太把自己当回事了吧？”\n\n“喂，你嘴巴放干净点。”一旁的工友乎日德勒终于忍不住了，低声说道。\n\n“怎么的，你也想造反？我就看着你和小毛天天不知道说些什么东西，你想当彭德怀是吧？一起造反？想造反那也得把活干好了再说，活儿都干不好，造反肯定成不了！”工头恶狠狠地说，把安全帽往地上一摔。\n\n放工后，乎日德勒跟小毛一起回厂里的宿舍。“想不到我的党员资格竟然是戴总管弄的，怪不得你之前写了那么多入党志愿书都没用，连反馈都没。”乎日德勒豪爽一笑：“哈，那种东西谁在乎，真正的党员才不需要一纸证明。”“其实……”小毛看看周围，小声地说：“我弄到戴总管给几个当官的偷偷送钱送礼的证据了。上次他给质量监督局派来的人送了几个鼓囊囊的大信封，还送烟送酒的，最后还去市区的洗脚城玩了一晚上，我就跟在他们后面拍呢！”\n\n“还有这种事？好啊，早看他不顺眼了，必须给他丢到牢子里去！”"
 chi_GR.11.a: "好，我们一起"
 chi_GR.12: "舶来品"
 chi_GR.12.t: "舶来品"
 chi_GR.12.d: "刘常芸最近迷上了一种电子风格的歌曲，不仅曲调本身是由电子软件合成，就连演唱者也由是一种叫做电子歌姬的软件演唱完成。她给她的笨蛋老哥热情推荐了几首很好听的这种歌，然而刘常军很难从这些动次打次的电子声中体会到愉悦。\n\n“我昨天下班在网上找了好久才在一个日本的网站里找到你说的那个绿色头发的小人儿唱的歌”电话里的刘常军顿一顿，继续说，“我觉得不太好听……不过还顺带找到不少动画了，上次国庆在家我们看的电视上那个叫神奇宝贝的动画片，我昨天找到了看了几集，挺好看的。”\n\n“是吗？那我还可以给你推荐更多好看的！最近我们学校很流行日本动漫，同学之间都流行讲日语呢！我也学了几句，我想想看啊，啊对，你好是空你机挖，谢谢是阿里嘎多，再见是撒由那拉，对不起是粟米马赛……”\n\n“哦哟，我读书那时候就流行日语了，你们现在才流行啊，哈哈你是老妈子吗！”\n\n“什么老妈子，我看你才是个老倌子！我给你推荐歌你不谢我就算了，真的是蠢宝老哥。好了不说了，快一分钟了，挂了啊。”\n\n“唉唉先别挂，我有个同事下周要去日本旅游了，你有没有要托她帮忙买回国内的。”\n\n“哇真的！那我要《某科学的超电磁炮》最新漫画！”\n\n“某科…什么东西炮？听都没听过…不是，那买来是日语的啊，鬼子语你能看懂吗？”\n\n“哎呀不懂可以学嘛，日语那么多中国字，谁不认识，学起来肯定很快的。”\n\n“什么叫可以学，说得简单…唉算了到时候你发短信把名字告诉我，我叫同事给你买行了吧。挂了挂了啊。”“太谢谢了蠢宝老哥！”\n\n“都帮你了还是叫蠢宝啊？”"
 chi_GR.12.a: "我也找个机会去旅游吧"
 chi_GR.13: "人定胜天"
 chi_GR.13.t: "人定胜天"
 chi_GR.13.d: "尽管三峡工程竣工的准确日期在数个月前就已经确定好了，但收到最终竣工的消息后胡锦涛还是松了一口气。\n\n“这可不是什么容易的事啊，当初在人大上提议投票的时候得票那样低，大家对这样大的工程还是心存忧虑。”胡锦涛对温家宝总理笑笑，“不过开了个好头，以后建大项目的时候大家就会习惯了。”\n\n“建得这样快，终究还是有隐患呀，我看里面有些工程环节确实还有可以商榷和改进的地方，特别是泄洪和蓄沙的设计还可以再研究研究。但是时间不等人，整个长江地区需要三峡提供的电力，居民们盼望不停电限电的日子很久了。”温家宝也笑了，“很好很好，我们国家又建起来一个世界级的工程了，还是造福民生的工程！”\n\n“我以前在还甘肃水电站工作的时候，就想过什么时候能建起来长江上的发电大水坝，没想到如今竟然是我在任的时候建好了，泼天的好运也轮到我了。那时候大家都兴讲人定胜天的道理，喜欢干些现在看来很匪夷所思的工程，有干成的，也有失败的。不过要我说，人确实能胜天，我们已经在西藏修了铁路，在长江修了大坝，还把人送到太空去了，真是可上九天揽月，可下五洋捉鳖啊！你说，要是毛主席还在，他看到这些会是什么心情？”\n\n温家宝总理思考了一下：“别的不好说，他老人家可能会先高兴没有打起仗来吧。”"
 chi_GR.13.a: "打也不怕，中国人民是不可战胜的"
 chi_GR.14: "暖春"
 chi_GR.14.t: "暖春"
 chi_GR.14.d: "要说前天与天皇的会晤让胡锦涛还略有拘束之感，今天在横滨的小学与学生们的见面就要让他感到放松多了。这座富裕的海滨城市的学生们衣着靓丽，精神饱满，每天都生活在幸福的童年生活当中，令主席不禁想起之前在西南山区看到的大山里的穷苦学生们。“人与人之间的差距实在是太大了，太大了。”他心中响起这样的声音。\n\n“胡爷爷，北京福娃当中，我最喜欢的福娃是欢欢和晶晶，您最喜欢的是哪个福娃？”一个梳着双马尾的日本女孩儿用流利的中文向胡锦涛提问。\n“哦哦哦，我要告诉你呀，这五个福娃，我都喜欢！”胡锦涛笑着弯腰回答小女孩，周围的人也都笑了起来。\n又有一个戴着眼镜的小男孩儿站起来，用中国话对主席说：“胡爷爷，我想问您一个问题，您为什么想当…主席？”\n此话一出，大家又惊又笑。老师连忙打圆场：“哎呀真是很难的一个问题，还站起来提问……”\n胡主席又笑笑弯腰向那个小男孩儿：“哈哈哈，我本人没有想当主席”，他将双手贴到胸前，“是全国人民选了我，让我当主席。我不应该辜负全国人民的期望，对不对。”\n他又转身向在场的其他人：“我在中国见孩子们时，从来没有人问过这样的问题，这个日本孩子问得很好呀！实事求是，很有钻研的精神！我看日本的孩子们身上还很有我们需要学习的精神。刚才，我在校门口看见一尊雕像，上面是孔子的那句有名的话：有朋自远方来，不亦乐乎。中日两国人民曾经有很深远的历史情谊，我们彼此既是邻居，又是朋友。中国人讲究邻里之间要睦邻友好，守望相助。如果连邻居都不喜欢一个人，那这个人肯定是没法有很大的作为的。我们应该努力把这种历史情谊提升到新的高度，让我们这个时代的两国人民彼此之间更加熟悉和信任。”\n“中日两国人民最初是从学术上增进情感的。古代日本的留学生不远万里漂泊也要到长安求学，中国僧人鉴真等也历经千辛万苦去到日本讲学。对于历史文化的共识是两国情谊最坚定的基石，对知识的尊崇是两国价值观最和谐的共识。我们应该加强两国在学术和经济上的合作，共同创造一个以人为本的、更加和平的、同属两国人民的美好未来。”\n话毕，在场的所有人都由衷鼓掌，既有中国人的，也有日本人的，但最多的是教室里的孩子们的。"
 chi_GR.14.a: "孩子们，中日未来要靠你们呀"
 chi_GR.15: "高速路"
 chi_GR.15.t: "高速路"
 chi_GR.15.d: "今天[ROOT.GetLeader]要参加一个面向全国网民的问答直播。在摄像机前坦然自若的功夫他早已练成，但坐在一个小小的显示屏前向看不见的人做回答还是让他稍感局促。秘书在一旁小声向他询问是否可以开始了，主席点点头，推了推他的眼镜。\n\n“[ROOT.GetLeader]总书记，您好，我们知道您非常关注互联网的发展，关心人民网的发展。今天您亲自来到强国论坛，我们的版主和我们的网友都非常的激动，深感荣幸。请您跟我们的网友说几句话吧！”\n诶…朋友们，大家好！今天有机会在网上和大家见面和交流，我感到非常高兴。首先，我要借此机会，向网民朋友们表示诚挚的问候和良好的祝愿！”\n“感谢[ROOT.GetLeader]总书记对广大网友的问候，网友们得知您来到强国论坛，他们纷纷地上贴，有的向您提了很多的问题，请您跟网友们做个交流吧！有个网友说：总书记您平时上网吗？都看些什么内容？”\n“哦哦好的，哈哈，虽然我平时的工作比较忙，不可能每天都上网，但是啊我还是尽量抽取时间上网。我特别要讲的就是，人民网强国论坛也是我经常上网必选的网站之一。我平时上网一方面是看一看国内外的新闻。另外一方面呢，我也想在网上了解网民朋友们关心什么问题，他们有些什么看法。我也希望从网上了解网民朋友们对党和国家的工作有些什么意见和建议，这些都是我非常关注的。我们一向强调以人为本、执政为民，因为我们做事情、做决策，都应该广泛听取人民群众的意见，集中人民群众的智慧。通过互联网来了解民情，汇聚民智，这是非常重要的一个渠道。”\n“有人把互联网比喻为信息的高速公路，我深表认同。一上网就能看到那么多信息和新闻，这是从前的人想都不敢想的事啊！以前人们不知道党和政府的工作内容，了解渠道也少，把这看成很远的事。现在大家在屏幕上就能看到各项工作和政策，并且可以汇聚在一起讨论，增进对政策的认识，指出其中的优点和不足，这都是很好的事。新世纪就该多一点新东西嘛！”"
 chi_GR.15.a: "时代在进步"
 chi_GR.16: "大山"
 chi_GR.16.t: "大山"
 chi_GR.16.d: "西南的山区里有数不清的古树和优美的风景，然而对于住在这里的人来说，这些古木和群山是他们一辈子无法翻越的囚笼。这是胡锦涛曾经工作过的地方，他比任何人都更清楚这里的人过着怎样的生活。\n\n改开以后，东部沿海地区就像火车头一般拉着中国经济高歌猛进地飞升，日益变成了国际性的经济高地。然而在广大的内陆地区，特别是西南地区的深山里，改革的春风却吹不到丝毫。他主政贵州时，这里简直是一片赤贫，广泛的贫苦和闭塞的交通把这里变成了与东部地区完全相反的经济洼地。虽然他就认省委书记时尽力将人们的生活改善了一些，但深山有万道沟，一瓢米水怎么填得满千万张嘴巴的干涸。\n\n对于胡锦涛来说，那是他第一次主政一方，虽然干出来不少功绩并受到中央赞赏，但他深知那对于彻底改善人们的生活来说来说几乎是无济于事。他当时走访一个留守儿童的家时，那个很小的男孩儿正在和常去探望他的驻村干部一起吃饭。\n“小吴，你早上和中午都吃这个吗？”\n“是！晚上也吃！洋芋好吃！”小孩一边笑一边大声回答。\n\n驻村干部在旁屋向胡锦涛抹眼泪，说孩子父母在外打工，照顾他的爷爷上个月去世了，现在孩子只能和自己一起吃洋芋。洋芋在这里已经是用来改善伙食的东西。胡锦涛在离开那间破烂的屋子后偷偷流了很多泪，他从前在甘肃时也几乎过着这样的日子。从那以后，他时刻反省自己的工作到底是做给谁，真的帮助到那些需要帮助的人了吗。"
 chi_GR.16.a: "人民在挣扎"
 chi_GR.17: "闹鬼"
 chi_GR.17.t: "闹鬼"
 chi_GR.17.d: "“我操，我当时就在那捡柴禾，那东西刷一下从山路下飞上来，黑林子里看得太清楚了，就是个骷髅头，还老闪光！”\n\n“我也遇上怪事了，我家老母亲半夜掉头发，提溜整齐，我一开始还不觉得有什么，后面我自个儿都齐齐掉头发，跟刀刮下来似的，你说这不是鬼剃头是什么？！”\n\n“我看你们这都不行，我前些天去隔壁村时看了场法事，哦哟那个神婆和道士有真本事啊。那家主人一开始啥都吃不下，还往外吐绿色的水，神婆通灵之后算出来他是中邪了，要把鬼抽出来丢到油锅里炸。那神婆拿个铃铛念咒，老道士迷迷麻麻地念叨，突然就把手往人脑袋上一拍，然后抽出来好大两条绿虫子，然后那神婆把手直接伸到热油锅里转了几圈儿，哎呀我看着都肉疼啊！结果她一点事都没有！还把那两条绿虫炸成两根油条让病人吃了，嘿，那人一吃下去就吐出好多黑色的水，又吐又拉的，但是听说第二天就好了！”\n\n“还有这种事？我当时请了好几个算命先生给我老婆算命，结果那一个个地就知道往我老婆手上摸，一点不老实！看来还是要请有真本事的先生啊！”\n\n刘常军看着眼前的几个越谈越兴奋的村民，很无奈地向同事小张投去目光。今天上午他和小张受派遣来这个村里走访民情，问问村民们有没有什么难题，结果村民们倒是给他俩出了这样些难题。\n\n“乡亲们先停一停，虽然咱们要问的不是这种问题，但是我们已经知道您几位究竟遇到什么问题了……我们会给咱们几个村儿联合申请一个科学普及会，您几位刚才说到的不管是闹鬼还是神迹，那都是封建迷信，都是可以被科学解释的，会上都会讲明白科学原理。您几位一定要相信科学，学习科学，不要让迷信和愚昧把自己的眼睛给蒙着了！”小张向那几个眼神里透露出不信任的村民说。\n\n离开村子后，刘常军对小张苦笑，把公文包丢在车后座：“我觉得科普应该没啥用，这些老乡比我们懂实践出真知的道理，对于自己亲身遇到的事，他们是肯定不会放弃原有认知的。”\n\n小张努努嘴，满不在意地说：“无所谓嘛，科普工作本来就是这样，只要能让一两个人成功改观就算胜利。别把别人当傻子，人家只是懂得不多，道理讲明白了也会明理儿的。”"
 chi_GR.17.a: "我觉得还不如给他们放几集《走近科学》……"
 chi_GR.18: "烛光"
 chi_GR.18.t: "烛光"
 chi_GR.18.d: "“平时上学走几里路？在哪吃饭？吃得饱吗？”胡锦涛此行最为关心的，就是贫困农村孩子们的教育问题。\n\n曾经他在甘肃工作时，见到许多学生每次必须要走几里山路上学，月底再走几里路回家，平时在学校吃着很粗劣的伙食——那些家庭出身好一点的学生就可以在另一口单独的灶锅里取食，里面通常有羊肉或者牛肉。教育难道要饿着肚子搞？胡锦涛每念及此都摇头。\n\n虽然他离就任一方的日子已经过去很多年了，但如今他依然看到许多山区的学校连像样的教室都没有，桌椅甚至有用解放前留下来的老东西的——当然是几个学生挤一张桌子。\n\n“国家的未来在于教育，教育的对象主要是孩子们。”胡主席在回去的路上对温家宝说，“我们对于教育的投入已经很多，但需要教育的人还有更多。”\n\n“我明白你的意思，但财政上的压力已经很大了。”温家宝神色凝重地回答。\n\n“能不能向社会发行教育基金？”\n\n“金融恐怕不是个好手段，教育资金缺口太大了，用得也快，等不了新基金盈利。我倒是有个方案，为什么不能让社会自发承担教育支出转移呢？我们之前已经有一个叫希望工程的助学计划，中国青少年发展基金会主办的，这工程还是你们团派发起的，你真是贵人多忘事啊。”温家宝笑着对主席说，“那些城里人看到农村的学生这样贫苦，多少会激起同情心然后捐款的。”\n\n“是个好主意，回去联系宣传部让他们多做宣传。还有……”胡锦涛探身做了个手势，“免除学杂费的规定都发下去那么久了，结果刚才还是问出来，学生们每个学期要交七百多，这伙小地头蛇还想统一孩子们的口径瞒着我，有几个孩子不会说谎，说漏嘴了，那几个人还辩解说是校服钱。什么金子校服要收七百块！当着我的面也敢胡说八道!”\n\n温家宝点点头，又摇摇头。"
 chi_GR.18.a: "有太多油腻腻的手了"
 chi_GR.19: "《告台湾同胞书》"
 chi_GR.19.t: "《中华人民共和国全国人大常委会告台湾同胞书》"
 chi_GR.19.d: "亲爱的台湾同胞：\n“燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？”这是中国现代著名的散文家、诗人、学者和民主战士，朱自清先生，在民国十一年写下的慨叹。我们比从前任何时候都更加对这一段话感到深刻的悲切，因为我们自己的亲骨肉——台湾的父老兄弟姐妹们，至今仍然没能团聚在我们温馨的家庭之中。我们知道，台湾的同胞们也无限怀念祖国和大陆上的亲人。这种绵延了多少岁月的相互思念之情根植在每一个中华儿女的心头之中，与日俱增。自从一九四九年台湾同祖国不幸分离以来，我们之间音讯不通，来往断绝，祖国不能统一，亲人无从团聚，民族、国家和人民都受到了巨大的损失。所有中国同胞以及全球华裔，无不盼望早日结束这种令人痛心的局面。\n\n我们中华民族是伟大的民族，我们广土众民，占世界人口近五分之一，享有悠久的历史和优秀的文化，是世界上领土最大的国家之一，从古至今对世界文明和人类发展的卓越贡献，举世共认。台湾自古就是中国不可分割的一部分，台湾人民自古就是中华民族血脉相通的同胞。中华民族已经离伟大复兴的世纪之梦越来越近了，我们多么期望能与台湾同胞一起，作为顶天立地的中华民族的一员，傲立于世界民族之林。每一个中国人都为祖国的日见强盛而感到自豪。我们如果尽快结束分裂局面，把力量合到一起，则所能贡献于人类前途者，自更不可限量。早日实现祖国统一，不仅是全中国人民包括台湾同胞的共同心愿，也是全世界一切爱好和平的人民和国家的共同希望。\n\n我们寄希望于两千两百万台湾人民，也寄希望于台湾当局。台湾当局一贯坚持一个中国的立场，反对台湾独立。这就是我们共同的立场，合作的基础。我们一贯主张爱国一家。统一祖国，人人有责。希望台湾当局以民族利益为重，对实现祖国统一的事业作出宝贵的贡献。我们殷切期望台湾早日归回祖国，共同发展建国大业。我们的国家领导人已经表示决心，一定要考虑现实情况，完成祖国统一大业，在解决统一问题时尊重台湾现状和台湾各界人士的意见，采取合情合理的政策和办法，不使台湾人民蒙受损失。\n\n亲爱的台湾同胞：我们伟大祖国的美好前途，既属于我们，也属于你们，更属于世界上所有爱好和平的人们。统一祖国，是历史赋于我们这一代人的神圣使命。历史车轮滚滚向前，时代潮流浩浩荡荡。我们早一天完成这一使命，就可以早一天共同创造我国空前未有的光辉灿烂的中华民族伟大复兴壮举，进而与所有爱好和平的国家和民族，共谋人类世界的和平、繁荣和进步。让我们携起手来，为这一光荣目标共同奋斗！"
 chi_GR.19.a: "顺颂时祺"
 chi_GR.20: "《告台湾同胞书》"
 chi_GR.20.t: "《告台湾同胞书》"
 chi_GR.20.d: "亲爱的台湾同胞们：\n1945年，中国人民经过十四年抗战获得胜利，才从日本法西斯帝国主义者的手里收回了台湾，台湾人民也因此才回到祖国的怀抱。然而国民党反动政府自劫收了台湾以后，长期对台湾人民施行苛敛诛求、横暴残酷的白色恐怖虐政。这样，迫得台湾人民生活在极端黑暗、恐怖、饥饿的绝境。1947年2月28日，这一天，台湾人民为了生存和民生自由，即团结起来向国民党反动派进行轰轰烈烈的斗争。当时，反动派由内地抽调大批援军来镇压他们，并欺骗一部分省民，以致“二·二八”的斗争遭受了惨痛的失败，10000多的英勇烈士在敌人的屠刀下牺牲了。“二·二八”的失败，教训我们必须全省人民紧密团结、和全国人民在一起，才能战胜敌人；而在斗争最激烈的时候，动摇妥协，对敌人抱幻想，那么不仅斗争一定要失败，而且还会遭受到更惨痛的牺牲。这是“二·二八”的血的教训。\n\n我国历史已经起了空前的变化。台湾当局无视祖国大陆数十年来的宏伟发展和与日俱增的民族自信，勾引美帝国主义者继续支持他们作垂死的挣扎。美帝国主义者也利用这个机会，加紧对台湾的干涉和控制，同时又利用其走狗爪牙进行要求“托管”或“独立”的阴谋，企图把台湾完全变成美帝国主义的殖民地。但是，台独反对派和美帝国主义相互勾结、狼狈为奸的阴谋，是绝对不能挽救他们最后灭亡的命运的。今天中国人民的革命力量已空前强大．中国人民有着一支英勇无比、百战百胜的人民解放军，有着全国人民热烈拥护的中国人民政府和全世界和平民主阵营的支持。全国十三亿人民已经决心把解放台湾统一全中国作为第一个重大任务，准备集中一切力量，渡海歼灭企图分裂台湾的牛鬼蛇神，解放台湾。\n\n亲爱的台湾同胞们：台湾人民有着日据数十年间反对日本帝国主义的革命传统，尤其在“二·二八”反对国民党反动统治的斗争中，所表现出来的伟大的英雄气概，是值得骄傲和发扬的。今天，我们必须再发挥这种光荣的革命传统和“二·二八”英勇斗争的经验，来粉碎蒋台独反对派和美帝国主义的阴谋。台湾的解放是必定要实现的，而解放的日子是迫近了，台湾同胞们摆脱沦为美帝国主义殖民地的时候也近了。所以我们必须利用每个机会和一切的可能条件，想尽一切的办法去削弱和瓦解帝国主义的力量。我们必须记取“二·二八”的教训，一致团结起来反对台湾当局和美帝国主义在台湾抽兵、征粮、征税的侵略行径，同时还要善于采取一切办法，保存我们的力量，壮大我们的力量，准备配合人民解放军，共同完成解放台湾的任务。\n\n“二·二八”斗争中英勇牺牲的烈士永垂不朽！\n\n中华人民共和国万岁！\n\n中央人民政府万岁！\n\n人民解放军万岁！\n\n中国共产党万岁！\n\n中国人民万岁！！！"
 chi_GR.20.a: "我们的队伍向太阳！"
 chi_GR.21: "“暗涵”"
 chi_GR.21.t: "“暗涵”"
 chi_GR.21.d: "行走在这条路上，几乎很少有人知道在路的正下方，成千建设者曾日夜奋战，倒排工期，不到3年，一条巨大的输水动脉建成通水。近日，悄无声息地，这条“动脉”还做了江水今秋进京前的最后一次“体检”。\n\n从大宁水库出来，一渠向北延伸。从岳各庄桥开始，上接卢沟桥暗涵，下达输水终点团城湖水库，进入西四环暗涵。这是南水北调北京段总干渠施工条件最苛刻、技术难度最高的一段工程，全长12.64公里。\n暗涵进口在京港澳高速路永定路立交桥西南角。“平常里头有水，根本下不去，你们太赶趟儿了！”\n\n西四环暗涵工程管理负责人刘秋生带着记者去现场。“暗涵是2007年11月23日竣工的，自2008年黄壁庄水库输水进京后，一直通着水；每天都有人监测，运行良好；这次为了迎接即将到来的江水，要进行一次大‘体检’。”从检修竖井逐级而下，连下四段15级台阶的铁梯，我们走进暗涵。暗涵内径达3.8米，下平上拱，宽得可以开小汽车；用手一摸，钢筋混凝土浇筑而成的涵体平整光滑，严丝合缝，几乎找不到“蜂窝麻面”；为了“体检”，暗涵里已排空了水，仅有浅浅的积水，掬起一汪，清澈透明。\n\n不时听到检修人员的吆喝声，黑乎乎的涵洞里回声不断。他们用激光测距仪量距离，记下标记。刘秋生敲了敲涵壁，“钢筋混凝土的表层，涂着5厘米厚的保护层。它好比一件‘防水外衣’，能防止钢筋遇水生锈，失去承压。仪器打这一走，就能看出保护层厚度有多少，薄了就得赶紧加！”\n\n“这几天，还会有几路人马下来排查。昨儿大周日的，水利专家下来验质量，出来时个个都挺兴奋，质量过关！”刘秋生舒了一口气。\n\n市南水北调调水中心主任仇文顺亲历了西四环暗涵施工的全程。那时，他是暗涵项目部部长。“直穿城市快速路，开挖出长距离大规模输水隧洞，这在国际上也属首例。上边是呼啸而过的地铁或铁路；下边是纵横交错的地下管线，供排水的、热力的、电力的、通讯的……时不时还会撞上拦路的桥桩，要做到‘井水不犯河水’谈何容易！”"
 chi_GR.21.a: "（接下文）"
 chi_GR.22: "“暗涵”"
 chi_GR.22.t: "“暗涵”"
 chi_GR.22.d: "最难的当属暗涵穿过五棵松地铁站时，涵顶离地铁站底板只有3.67米。为保证地铁正常运营，专家给出了底线：沉降必须控制在5毫米以内！\n\n四环路上车如流水，下面的五棵松地铁站行人如织，再往下－－离地面20多米，是热火朝天的施工现场。施工采用浅埋暗挖法，这是在距离地表较近的地下进行各种类型隧道洞室暗挖施工的一种方法。为的就是“不断路、不断交通、不扰民”。\n\n大型机械下不去，每隔一段，要挖掘一个十几米深的竖井，工人下到井里，用铁镐、铁锹小心翼翼地挖洞、铲土，用最原始的方法和工具，一米一米地推进，边开挖边浇筑。施工方在地铁下方划分三层，插入124根长15米、直径110毫米的钢管，再灌注水泥浆强化加固，铸就了一个长25米、宽16米、高3.67米的“钢铁脊梁”，将偌大的地铁站稳稳托住，牢牢控制了沉降值。在190天的施工中，监测到最大沉降值不到3毫米。\n\n西四环暗涵最终以“零事故”的骄人成绩顺利完工，但对这项重大工程的实时监测一刻也没有停息。\n\n五棵松桥西南角，西四环边上的一条狭长绿化带上，有一个1米来高的灰色铁皮箱，每3天打开一次。市水科学技术研究院高工智泓把它打开，探头一望，箱子下边是一口施工时留下的竖井，一大捆电缆线从中牵引出来。\n\n一共68根电缆！五棵松桥下的暗涵从里到外、从上到下都装着仪器，一个仪器牵出一根电缆。将传感器与电缆一一接通，它们就能给出一系列的数据，如钢筋的应力、混凝土的应变、围岩的变形等等。智泓说，综合分析这些数据，便是西四环暗涵五棵松段的“体检报告”。\n\n这样的安全监测点，西四环暗涵沿线共有13个。智泓和他的同事组成了十人小分队，专门负责数据的采集、分析和报告。“工程固若金汤，我们也要严阵以待！”\n\n诗人叶延滨曾用激扬的诗句赞颂道，“一根巨大的输液管插进了北京的年轮，北京这棵千年的神树正变得枝叶青绿……”"
 chi_GR.22.a: "“妈妈，不停水了！”"
 chi_GR.23: "“皇粮国税”"
 chi_GR.23.t: "“皇粮国税”"
 chi_GR.23.d: "清晨，尤文富亲手摘下自己所在科室“农业税管理科”的牌子，这是他们局里执行政府下达的“取消农业税”政策的一个小环节。尤文富是北京市延庆区地税局的一个工作人员，他是全国第一批早上“摘牌”的人，因为是从北京市开始试点取消征收农业税的。望着手里已经有些锈蚀的牌子，尤文富心里有些感慨。\n\n尤文富工作这么多年，印象最深的一件事，就是某次和同事在村里收税，有个家里生活困难的大娘，颤巍巍拿着一篮鸡蛋凑农业税的钱。尤文富跟同事说：“能不能给她免点儿？这应该是困难户。”同事翻看了下当地困难户名单，沉默了一会儿：“好像没有她的名字……而且就算有也免不了，这你知道的。”尤文富心里清楚，但还是忍不住问：“大娘，为什么你的名字不在上面？”\n\n“同志，我真没钱申请了呀，听说申请困难户要到村支书那交好几千，您看我连这税都交不起，怎么申请呀。这鸡蛋是我家最后一点值钱的东西了，本来想给孙子生日吃的，但是公粮不能少交哇，您二位看看这鸡蛋能抵税吗？村里的东西不值钱，但确实是我家养的土鸡下的，味道可好啦！”\n\n尤文富这些年来做农业税工作，几乎每一天都生活在煎熬之中。从那些面朝黄土背朝天的老农手里接过发毛的钞票，他感觉手都在放在火上考。如今，他再也不用受到这种煎熬了，农业税取消以后，他应该会调到其他部门工作。他把手中的科室牌好好擦拭一遍，用布包起来放在仓库里了。“在国家的改革过程中，我起到一个见证人的作用。”尤文富晚上在日记里写道，“我感到很光荣。”\n\n改革开放以来，农业税取消是中国税制改革的一个例子，40年来，中国实行“利改税”“分税制改革”和“营改增”等改革措施，税制改革不断向纵深推进。尤文富的故事只是一个缩影，马上全中国各地都要有无数个尤文富取下自己科室的牌子了。"
 chi_GR.23.a: "收了2600年的农业税再也不收了"
 chi_GR.24: "科教兴国"
 chi_GR.24.t: "科教兴国"
 chi_GR.24.d: " 1998年11月，江泽民同志出访俄罗斯，在参观新西伯利亚科学城时发表了关于科学技术的演讲，引起了国际社会的广泛关注。在这篇演讲中，江泽民同志曾将科学技术比作人类智慧的“灯塔”。他说：“人类的智慧无有穷尽。科学技术作为这种智慧的一座光芒四射的灯塔，经过无数科学家们的艰辛努力，正在不断地透过层层叠嶂照耀到更高的群峰之上。”\n\n还在1991年，江泽民同志就指出：我们正处在新旧世纪交替的重要历史时期。到1993年，他进一步指出：90年代已过去3年，距离21世纪只有7年了。究竟怎样跨入21世纪，怎样把我国的科学技术事业搞上去？这是摆在我们面前的一个迫切需要研究和解决的重大任务。\n\n1995年5月，中共中央、国务院作出《关于加速科学技术进步的决定》，并召开科学技术大会，鲜明地提出了“科教兴国”的战略。江泽民同志在会上发表讲话，对科教兴国战略的内容、意义和需要把握的问题作了全面的阐述。作出“科教兴国”的战略决策，是以江泽民同志为核心的党中央对邓小平理论的重大发展，是面向新世纪最重大的战略部署之一。“全面实施科教兴国战略，大力推动科技进步，加强科技创新，是事关祖国富强和民族振兴的大事。”“抓住机遇，努力在科技进步与创新上取得突破性的进展，赋予全面推进建设有中国特色社会主义事业以更大的动力，是全国广大科技工作者和各条战线上的同志们的一个伟大战略性任务。”\n\n今天，当人类进入新世纪之时，放眼世界科技革命迅猛发展的态势，我们更感到，提出和实施科教兴国战略，是如此的重要，如此的紧迫。只有牢牢把握科学技术这个动力，我们的事业才能进一步走向辉煌，中华民族伟大复兴的历史使命才能真正实现。"
 chi_GR.24.a: "千岩万壑不辞劳，远看方知出处高\n\n溪涧岂能留得住，终归大海作波涛"
 chi_GR.25: "滩头堡"
 chi_GR.25.t: "滩头堡"
 chi_GR.25.d: "一下飞机，主席就感受到了广东的温暖——明明刚过完年，全国大部分地区还留存在冬天的气息里，广东却四季恒温，街上不少人是单衫穿着。望着那些着装清凉的人，主席感到自己的西服有些隐隐的厚热。\n\n高州是茂名市治下的一个县级市，地处粤西桂东之交通要冲，改革开放的春风早已刮到这里，每天这里都在热火朝天地进行数不尽的生产、贸易，财富滚滚而来，又滚滚而去。这里是广东省直管县财政改革试点，主席本次来高州就是为了考察广东小市镇的生产情况。\n\n街上已经提前清场，没有闲杂人等人在此逗留，只有远边警察围起的交通障碍物处有几个人在伸直了脖子观望，他们并不知道来这小地方的是哪位大官儿。只看见一大群熙熙攘攘穿着西服的人拥趸着一个不停摇手示意的小老头走走停停，旁边的记者马不停蹄地跟着拍照，隆隆交谈声、快门声响个不停。\n\n参观服装加工厂时，主席对一个埋头苦干的小伙子产生了兴趣，站在一旁聚精会神地看他做工。小伙子没认出主席，但知道身旁这个老头带着一大帮官员，肯定是个大人物，因此十分畏惧，手哆嗦个不停。“哎呀，你不要管我，把东西拿稳了好好干嘛，你看又搞坏了一块布，要罚工钱的！”主席拍拍小伙子的肩膀，小伙子腼腆地摸了摸头，深呼吸后，熟练地将一件黑色的半成衣缝好腰线，放在一旁的篮子里——那里面已经有了满满一筐劳动成果。\n\n在广东，时间就是金钱，效率就是生命，工厂就是广东的心脏，批发商单就是广东的命脉。广东是全国最大的制造业中心，是改革开放精神当之无愧的滩头堡、排头兵，是生产力和高效的代名词，主席来到这后感触更深。晚上，主席在高州市领导干部“三讲”教育会议上发表了重要讲话：“总结中国共产党七十多年的历史；可以得出一个重要的结论，这就是：中国共产党之所以赢得人民的拥护，是因为中国共产党在革命、建设、改革的各个历史时期，总是代表着中国先进生产力的发展要求，代表着中国先进文化的前进方向，代表着中国最广大人民的根本利益，并通过制定正确的路线方针政策，为实现国家和人民的根本利益而不懈奋斗。”"
 chi_GR.25.a: "志若不移山可改，何愁青史不书功"
 chi_GR.26: "温家宝的提案"
 chi_GR.26.t: "温家宝的提案"
 chi_GR.26.d: "北京坐落在华北平原的边缘，北接山地，南瞰中原，在这里，人的心胸和格局会不由自主的扩大，眼界会自然而然地宽广。然而此地的气候却对有些人不太友好。胡锦涛就任主席之位后，几乎每天都忙于处理政务和走访各处，有时呆在北京会让这个南方人身体上火，尤其是在冬春之际，干燥的空气和风中的沙尘总能让他难受好几天。\n\n相比起胡锦涛的窘迫，出身天津的温家宝就要从容得多，现在他在办公室里为主席送来了一份写好的发展策划。“我前段时间去了一些典型地区，考察了各地发展情况，大致上做了这样一份发展策划。”温家宝翻开文件夹，摊开放在胡锦涛面前，“国家现在大致可以划分成四个区域，分别是东部、中部、西部和东北。这四个区域情况不同，政治经济资源不同，适合发展的方向也不同。东部地区经济发展好，动力很充足，但是资源要素的流通问题比较大。西部地区交通落后，经济增长动力疲乏。中部地区长期受到忽视，但是是劳动力密集和潜在市场巨大的区域。东北地区工业基础好，自然条件好，但是缺乏进一步发展的经济增长点。我们可以在不同地区施行不同的发展方案。”\n\n“不错，很细致。我们可以先从东部开始，这里的市场和生产条件都好些，积累一些经验后再往中部、东北和西部开展工作，还可以借助东部地区的既有经济资源助力，挖掘更多的国内市场份额。”胡锦涛用笔在文件上标记了几处，“西部地区要多开政府项目，不仅资本不会主动往那边去，人力资源也容易流失。东北地区要先整顿营商环境，不然人家不会去投资呀，那边在下岗潮后一直比较萧条。中部要扩大本地内需，开拓好庞大的下沉市场，并且鼓励外出务工的人回乡创业，比如湖南、河南这样的人力输出省份。如果这几个区域的工作都能按规划搞好，经济工作就能做好。”\n\n温家宝点点头，回应道：“还是要以规划为主，不能太多直接干涉，地方上对这种大区域工作的协调经验比较欠缺，直接干预容易导致管理混乱。”"
 chi_GR.26.a: "少折腾就对了"
 chi_GR.27: "刘常芸的回信"
 chi_GR.27.t: "刘常芸的回信"
 chi_GR.27.d: "“老哥，我在深圳这所学校能上计算机课，现在我就在电脑前边给你写‘伊妹儿’呢！不过我还不太会打字，这封邮件其实是罗老师帮我键入的。学校里的电脑脑门儿可真大！不过比起家里的电视机，这电脑显示器的个头还算小的。罗老师说，这样一台普通的电脑每秒钟可以计算几十万次呢！要是用电脑帮我做作业，我就再也不用晚上坐在桌前了。（请您提醒家长督促这个孩子晚上做作业。罗老师。）\n\n老哥你说的千禧年什么的我不太懂，罗老师说2000年之后就是千禧年，一个年份有什么特别的含义吗？不过罗老师提到一个叫‘千年虫’的东西”，好像很可怕，会吃掉电脑让电脑宕机。（等下我会重新给她讲讲千年虫。罗老师。）电脑还要‘清理’和‘杀毒’，老哥你以后买电脑的话要时刻注意清理呀，不要被虫子吃了！\n\n深圳这里好像没有什么特产，不过我很喜欢学校前面小巷子里的猪脚饭，隔壁店的肠粉也很好吃，老家没有这些东西，不过这里也很难见到老家的粉馆。这里的人据说早上会喝很久的早茶，但是我的同学没有早上喝茶的，他们大多数都在家里吃早饭，或者买面包吃。这里很多人说话我听不懂，好在大部分同学都跟我一样是外地来念书的，大家都会说普通话，老师也说普通话，跟老家的学校完全不一样。同学们都很友善，没有老家学校那种欺负人的孩子王，可能因为大家都不太熟吧。我很喜欢这儿，老师和同学都很好，学校里的器械也很新，老哥什么时候来深圳一定要来我这看看。\n\n（刘常芸在学校表现良好，和同学相处和睦，人际关系良好，请家长放心。罗老师。）”"
 chi_GR.27.a: "小甜心，2000年1月3日"
 chi_GR.28: "肉包子"
 chi_GR.28.t: "肉包子"
 chi_GR.28.d: "火车站熙熙攘攘，随着绿皮火车轰鸣入站后缓缓停下，车里的人像沙丁鱼一样鱼贯而出，连同他们手上或肩上的大包小包。广州站每时每刻都在吞吐巨量乘客，今天，李程也是这里面的一员。李程从坐了一晚上的火车，从老家来到广州找工作。李程怕自己一时半会儿找不到落脚处，多带了一床被子，实在不行可以找个空地过夜。\n\n本来父母是让他过完年再去广东，李程却一刻也呆不下去了，他只想早点再广东找到一份工作，然后通过自己的努力赚够在老家县城买房子的钱，以及娶妻的彩礼钱。他不想一辈子就呆在村里种地，尽管他们家世世代代都是老实巴交的农民。李程小时候去县城时，听说城里人每天早上都吃肉包子喝豆浆，自己家里却一年到头都吃不了几口肉。那时候，李程就发誓一定要住在城里，就算不能成为城里人也要每天都吃到肉包子。\n\n此时，他在诺大的火车站迷失了方向，他怯生生地向一个工作人员问路，工作人员随手指了一个方向就拿着对讲机走开了。李程硬着头皮往所指方向走去，却发现自己到了一个更大、人更多的区域，到处都是大口子，但拦着不让走，显然不是出口。他看见不远处有个店铺，里面卖各种食物茶水，那散发烟气的蒸笼里显然有热呼呼的大包子。李程很快走过去，但他看到写着价格的板子后马上刹住了脚。\n\n一个包子竟然要这么多钱？一瓶水要三块？怎么不去抢钱呢！李程撇了撇嘴，瞪着价格版咽了口唾沫，口袋里的钞票摸了再摸，最后还是转身走开了。"
 chi_GR.28.a: "一分钱难倒英雄汉"
 chi_GR.29: "求职"
 chi_GR.29.t: "求职"
 chi_GR.29.d: "晃荡在广州的街头，虽然身上的衣服已经脏兮兮，头发也油得反光，李程没有心思去管这些。十几天前他从火车站出来，被一个穿着皮衣的男人叫住，皮衣男说他正在雇人，问李程要不要找份工作。李程欣然同意，拎着大包小包就跟着男人上车了。车里已经坐了许多跟他一样岁数的小伙子，从着装和行李来看应该也是进城务工的人。没过多久，皮衣男揽到了许多小伙子，还有两个女孩儿，他们都坐在车里了。皮衣男终于上车，坐在副驾驶位，回头对李程他们说：“我们系做胡装（服装）的工厂啊，人手感缺（紧缺），老细（老板）管我要人啊，你们到系候管老细要工钱就ok，管食管住，只管做工拿钱喔。”\n\n“工钱系几多（多少）啊，点（怎么）付？月付日结？”一个李程身旁的本地小伙子问道。\n\n“唔担心咯，五文一日，周末一齐结账嘅，一文少不了你。”皮衣男挥挥手。李程听不太明白他们在说什么，不过工钱这个词他听懂了，眼见其他人没有接着提问，看来应该没有什么问题吧。\n\n那间工厂在很偏僻的地方，不过勉强还算是在城区——或者说城乡结合部。进去之后皮衣男就坐车离开了，留他们一伙人在工厂里等。不久，老板模样的人来了，那人穿着花衬衫，戴副墨镜，腋下夹着一个黑色的皮包。老板把他们带进厂里交给一个尖嘴猴腮雷公脸的人后也坐车走了，顺便带走了一个跟他们一起来的女孩儿。\n\n李程已经记不清自己在里面做了多少天工了，每天都在踩缝纫机，从早踩到晚，只有去吃饭时能休息几分钟。那饭菜是李程这辈子吃过最恶心的东西。这一切李程都忍了，但最后他要结账时，那个尖嘴猴腮的家伙却叫来几个凶神恶煞的保安把他狠狠打了一顿。李程当晚跟着送货的车溜出了工厂，代价是丢了自己所有的行李——准确来说就是几床被子。\n\n他去警局报了警，但那个疑似警察的人只是抬眼看了看他，让他回去等结果。李程现在只能在大街上游荡，听说一个叫劳务市场的地方能找到正经工作，他准备去那碰碰运气。不过走过去可得花不少时间，可能要睡几天大街。然而他的肚子已经饿的不行了。李程做梦也没想到，来到城里十几天，不仅肉包子没吃上，还挨了顿打，顺便弄丢了自己的所有行李。"
 chi_GR.29.a: "这就是广东吗？"
 chi_GR.30: "工作？"
 chi_GR.30.t: "工作？"
 chi_GR.30.d: "不知过去了几天，李程在广州城里四处晃荡，走走停停终于到了广州狮岭镇劳务市场。这几天里，他发现一个印着白胡子洋老头的店晚上会把一些吃的丢在后门的垃圾桶里，当他打开那个油纸袋时，发现这些吃的是一些冷掉的炸鸡腿之类的东西，甚至都还没有放坏。城里人难道就这样浪费食物吗？李程坐在垃圾桶边一边大快朵颐，一边陷入沉思。如果城里随便一家店连鸡腿都可以直接丢掉，那自己这种沦落到翻垃圾桶的行为到底算什么呢？\n\n李程晚上在公园或者桥底下睡，虽然已经是冬季，但广东的天气实在暖和，李程完全不必盖被子就能安然入眠。唯一不好的在于晚上有不少大货车飞驰在马路上，发出的噪音响得离谱，直钻人心，让人睡不好觉。有一回李程半夜起来撒尿，看见一对衣着光鲜的情侣在不远处激烈地做爱。当李程看清楚这两人到底在干啥后，羞得他飞快跑开了。妈的，城里人玩得真花！好不害臊！\n\n狮岭镇劳务市场前面是一座高架桥，李程穿过马路，终于看见了“狮岭镇零工市场”几个字。此时那儿已经人山人海，许多脑袋簇拥着往里面挤，有长有短，有黑有白，构成一幅壮观的画面。看来这些都是来找活干的人了。李程想起父亲曾经对他说的话。\n\n“程，你只记到，世上的好事都要人去寻的，各人跑来寻你的肯定不是么子好事。”\n\n火车站那个皮衣男的例子再好不过了，李程后悔自己没有牢记父亲的叮嘱。现在，李程也要扎进人堆里去寻事做了。\n"
 chi_GR.30.a: "这才是广东嘛"
 chi_GR.31: "纺织厂"
 chi_GR.31.t: "纺织厂"
 chi_GR.31.d: "纺织车间嗡嗡作响，只见一个个低头凝神聚气做工的纺织工人。李程才干了一周，现在已经是一个熟练的纺织工人了。他现在缝线又快又好，还能吃苦，人家闲聊时他努力工作，人家洗脚时他努力工作，人家休息时他还是努力工作。领班是个中年女性，本地人，讲话有很重粤语口音，扎马尾辫，陈姓。陈领班对这个新来的小伙子十分赞许，有时候会把小女儿煲的汤分一些给李程喝。李程也觉得这位领班很亲切，从不跟其他工人一起在背后议论她。\n\n当初，李程在劳务市场里待了几天，由于他老实巴交，嘴巴笨，加之人生地不熟，多少有点畏畏缩缩，总找不到愿意收他做工的“老细”。当陈领班发现他时，他正在狼吞虎咽遇见的一个同乡的工友分给他的馒头。\n\n“你们两个，要不要做工啊？”\n\n李程对自己的宿舍很满意，虽然很小而且通风不好，采光也几乎没有，但起码让他在广州有了立足之地。这是陈领班给他找的廉租屋，管楼的是一个正在上初中的小女孩，据说是楼主的私生女。对李程来说，这间屋子作为一个休息的地方是十分称职的，虽说隔音差了点——总能很清楚地听见上下四方冲厕所的响声、邻居的咳嗽声、男欢女爱之声——不过用于睡觉休息已经足够了。如今，李程已经从一个流浪街头的落魄之人变成了自食其力的劳动者，父亲曾说劳动最光荣，现在李程也是一个光荣的儿子了。"
 chi_GR.31.a: "老板，来三个肉包子！\n不，五个！"
 chi_GR.32: "人间地狱"
 chi_GR.32.t: "人间地狱"
 chi_GR.32.d: "哭声、呼喊声、惨叫声、崩塌声、脚步声……当胡锦涛真正来到地震受灾现场后，眼前的一片狼藉让他心如刀割。这个镇一些居民楼和企业车间、宿舍在地震中严重损毁，有的完全倒塌，有的扭曲变形，空降兵某部官兵和河南公安消防队员正在使用各种救援设备紧张搜救幸存者。一个血淋淋的人刚被消防队员抬出废墟。胡锦涛快步登上废墟高处察看救援现场，焦急地询问人员伤亡和伤员救治情况。\n\n“同志，保持呼吸，不要睡着了，坚持住！”胡锦涛在满身是血和灰尘的伤员身边痛心地叮嘱，随后他被一旁的救援人员挤开了。\n\n“当务之急仍然是救人，只要有一线希望，我们都要千方百计地抢救。要采取措施保证救援队伍在进入所有乡镇的基础上，尽快进入所有村庄。”胡锦涛在向工作人员做指示时，一个小女孩冒失走进了临时搭起的帐篷里。一旁的工作人员很窘迫地想带走小女孩，胡锦涛看到她后走到她身旁，蹲了下去。\n\n“小朋友，怎么了吗。”\n\n“爷爷，我妈妈还没找到……她还活着吗……”小姑娘说到一半，眼泪止不住地流，低声抽泣了起来。她的手臂受伤了，现在正简易用绷带包扎着。\n\n望着眼前抽泣的女孩儿，胡锦涛也不禁一股悲凉之意涌上心头。是啊，离地震发生已经一天半了，“黄金救援时间”已过，被埋压的人如若还没找到的话，大概率已经……可是，这怎么说得出口呢？“你母亲已经死了，我们很抱歉”，这种鬼话难道就是自己向人民群众的交代吗？面对向自己求助的孩子，难道就要用这样的台词回应吗？胡锦涛强忍悲痛，轻轻搂住小女孩，让她依偎在自己的臂弯里哭泣。\n\n“会好的，一切都会好的，这是我们大家共同面临的局面，我们都要继续坚持下去……”他在女孩儿耳畔轻声说到，声音温柔又坚定。"
 chi_GR.32.a: "苦难终将过去"
 chi_GR.33: "多难兴邦"
 chi_GR.33.t: "多难兴邦"
 chi_GR.33.d: "“你到了。”见到温家宝，胡锦涛朝他点点头。\n\n“刚才去过灾区了，受灾很严重，十几公里外的村子都震塌了。”温家宝思索了一番，“成都那边受损较大，其他邻近省份也有不同程度受灾。”\n\n“孩子们怎么样？操场受损不大的话就让居民疏散到那里去。”\n\n“已经吩咐过了。我来之前去了几个学校，受灾情况比想象中严重。虽然教学楼普遍修得矮，但是孩子们都集中在教室里，疏散很不及时。”温家宝顿了顿，“大多数楼房质量根本不合格，导致灾后多次重复坍塌，不知压死了多少废墟下的幸存者……”\n\n真是用血和泪换取的经验。胡锦涛闭上眼睛。“追查责任的事以后再说，先把解放军调过来救灾。回去之后得重新审定建筑标准了，尤其是西南地区的，必须牢牢把关，人命关天！”温家宝点点头。\n\n工作还得继续，还有人埋在地下，物资转交还有可以优化的地方，救灾款项还没有签字……胡锦涛朝温家宝挥挥手，二人各自按照议程前往自己下一个奔赴的场地。\n\n天空由于地震引起的扬尘而显得发灰发黄，脚下前几天还在咆哮嘶吼的大地，此时悄无声息。一天还是24小时，远处城市里一个男人病得要死，那间壁的一家店放着卡拉OK；对面是弄孩子。楼上有两人狂笑；还有打牌声。河中的船上有女人哭着她死去的母亲，帐篷里的女孩儿哭她消失的家人。地球照常自转，太阳依旧东升西落。"
 chi_GR.33.a: "生活还得继续下去"
 chi_GR.34: "面试？"
 chi_GR.34.t: "面试？"
 chi_GR.34.d: "顾清萍在上海孤独地求职，在投出本月第四十份简历后，终于收到了一家名不见经传的小公司的面试通知邮件。面试当天，她乘公交到了公司所在地，并在附近找了个隐蔽之处换上西服和高跟鞋，又草草补了妆。当天走进那栋大楼时，她感觉自己心跳得厉害，无论是高跟鞋的难以驾驭还是手指末端因紧张而颤抖都来不及注意了。\n所谓的公司，实际上是几户居民住房打通了组成的，聚集了一些年轻人在里面忙碌。面试官由这家公司的老板兼任——一个戴眼镜的小伙子，摸样看上去二十来岁，打扮整洁干练。顾清萍甚至怀疑这位老板还没自己年纪大。\n“弄得这么正式，不需要呀。我看了你的简历，本以为这样优秀的人早被其他大公司收走了，没想到竟然屈尊来我们这儿来了。你叫我老兰就行了，他们都这么叫的。”这位老板看上去很和善，翻看着顾清萍的简历。“咱们这儿刚创业不久，是做文化创意的，公司入账不稳定，工资开得低，但是包食宿，不过你是女士应该不方便和我们这群糙人住吧，那跟其他女员工一样，给你多发点工资去租房住。我们白手起家，要处理的账目多，他们又毛毛躁躁的，正急需一个会计。如果合意的话，你明天就来上班吧，这是合同，你回去慢慢儿看吧。”\n“好……好的，请问入职有什么需要注意的吗。”顾清萍接过老兰塞给她的一大包糖果，整理了下头发问到。\n“我们这儿电脑不够，你有笔记本吗？没有的话我垫钱给你买一台，你今天去电子城挑一台就行。哦这会儿到了饭点了，干脆把他们一起叫出去给你办入职典礼得了。喂喂！现在出去吃饭去了，迎接下咱们的新会计！”\n顾清萍匆匆收拾文件，赶上欢呼的众人一起下楼了。整个饭局中她都有些抽离，自己这样草草答应入职，真的是一个正确的选择吗？两个个女生热情地牵着她的手和她聊天，老板老兰在另一桌和几个小伙攀谈，不时发出大笑。望着眼前这群咋咋呼呼但和善的年轻人，她又觉得，这或许是正确的选择吧。"
 chi_GR.34.a: "所谓团队，不就是这样吗"
 chi_GR.35: "中国统一"
 chi_GR.35.t: "中国统一"
 chi_GR.35.d: "“老李，你看新闻了吗？台湾和蒙古自回归后修了不少工厂，昨天我家闺女就在超市里看到了老多外蒙古原产的奶酪制品！她买了袋回来，我和老伴儿尝了，老好吃了！你说这蒙古人咋就这么会做奶呢？”\n\n“别说了，我家小子老大个人了，还整天搁那儿玩儿电脑游戏，说什么要跟台湾朋友一起刷游戏副本。嘿，这台湾人也上国内的网了！”\n\n“真不容易啊，这两个地方终于回归咱们国家了，我记得九十年代那会儿美国还炸咱们的大使馆呢，报纸上天天都说哪哪儿抗议！现在看谁还敢炸咱们的大使馆！”\n\n“都不用说大使馆了，咱小区那老邓知道吗，光头那个，他儿子小邓听说要去给台湾修桥的大工程当工程师了！以前那片海还有美国佬的航母隔三岔五地游，现在桥都给建上咯！”\n\n“建桥？跨那么大的海，那得是多大一座桥啊？”\n\n“嗨，咱们国家想建桥，就算是修到天上去都行！这小邓建的桥，等修好后咱们得去看看呐。”\n\n“喂，你俩坐这儿唠啥呢，说给我也听听。”\n\n“嗨，咱俩在说老邓他儿子要去台湾修桥了，以后修好了一起去看看呢。”\n\n“哈哈，好事儿啊，到时候我也要去，再把老张也拉上！毕竟呀……”"
 chi_GR.35.a: "想去哪都行，毕竟咱们国家已经统一了"
 chi_GR.37.t: "开幕式"
 chi_GR.37.d: "“我说老头子，这‘北奥’的票，真比医院专家号还难挂！差点把咱家一年的买菜钱都搭进去！” 王爱霞紧紧攥着三张门票，手心的汗都快把票浸湿了。她丈夫李建国背着水壶和零食，在人山人海的安检口前挺直了腰板。\n“你懂啥，妇人之见！这叫百年一遇！咱家强子以后跟同学说起来，那可是去过鸟巢水立方的！” 他扭头对儿子说，“强子，待会儿进去看的，就是那个有‘贝贝、晶晶’的大晚会！”\n正低头玩着贪吃蛇的强子猛地抬头：“爸，是福娃！什么贝贝晶晶，你还欢欢迎迎妮妮呢！再说，那叫开幕式，不叫大晚会！” 李建国被儿子噎得一愣，讪讪道：“反正就是那个意思……我听说啊，待会儿要点个大火炬，比咱们厂那个锅炉房烟囱还高！”\n通过严格安检，真正走进宏伟的“鸟巢”时，一家三口都安静了。巨大的场地和山呼海啸般的声浪让王爱霞下意识抓住了丈夫的胳膊。当倒计时在巨大的“缶”上敲响，当璀璨的烟火脚印沿着中轴线一路走来，李建国张着嘴，忘了合上。\n尤其是当五星红旗在《义勇军进行曲》中缓缓升起，全场数万人齐声高唱时，这个在工厂干了半辈子的男人，突然用手背狠狠抹了下眼睛。\n“爸，你哭了？”\n“胡说！是……是这灯光太刺眼！” 李建国清了清嗓子，试图找回一家之主的威严，“我是说，这‘北奥’……搞得真不赖。”\n散场后，随着人流往外走，强子还沉浸在兴奋中：“太酷了！我们班肯定没人比我看得更全！李小龙的歌都出来了！”\n王爱霞也忘了心疼票钱，絮絮叨叨地计划着：“回头得去跟隔壁张婶好好说说，她在电视前根本看不出这个气势……”\n李建国没怎么说话，只是回头，又望了一眼那座在夜色中依然发着光的巨大鸟巢。\n他心里琢磨着，明天就给老家的老母亲打个电话……。"
 chi_GR.37.a: "“儿子今天，算是见着大世面了”"
 chi_GR.38.t: "载人航天"
 chi_GR.38.d: "车间主任破天荒地在下午停了产，那台二十一寸的长虹电视被搬到院子中央，天线晃悠悠地对着东南方向。李大强和工友们搬着板凳围坐过来，小声嘀咕着：“这架势，比看《西游记》孙悟空上天还隆重哩。”\n“啥孙悟空，那是杨利伟！咱们国家第一个要坐火箭上天的人！” 徒弟小陈激动地纠正他。李大强“哦”了一声，心里还是觉得这事儿有点玄乎——把人装进那个“大炮仗”里，咻地一声送到天外去。\n电视里，火箭像根巨大的白色铅笔，稳稳矗立在戈壁滩上。倒计时响起时，整个院子鸦雀无声，李大强下意识攥紧了膝盖上的劳保手套。\n“点火！起飞！”\n烈焰喷涌，箭体缓缓上升，随即越来越快，拖着一条美丽的弧线刺入蓝天。李大强仰着脖子，直到屏幕里宣布“船箭分离”，才发觉自己一直屏着呼吸。\n“成功了！老李，杨利伟这会儿真在天上了！” 工长挥舞着帽子喊道。不知谁先带的头，鞭炮噼里啪啦在厂院里炸响，像提前过了年。\n回家路上，李大强特意绕到小学门口等儿子放学。孩子像颗炮弹似的冲出来：“爸！杨利伟在飞船里能看到长城吗？”\n“能！咋不能？” 李大强把儿子架在肩头，指着晚霞满天的远方，“他就在那云彩上头头儿飞着呢。老师没跟你们说？以后咱国家还要建天宫，谁都能上去瞧瞧。”\n夜里他躺在床上，看着窗外遥远的星星，用胳膊肘捅了捅妻子：“哎，你说等咱小子长大，会不会也能……”"
 chi_GR.38.a: "买张票去天上转转！"


 chi_GR.100.t: "外国投资进入我国"
 chi_GR.100.d: "随着我们加入世界贸易组织后，不断涌入的外来投资带动了经济高速发展。"
 chi_GR.100.a: "多多益善..."
 chi_GR.100.b: "外资？那还是算了！"

 
