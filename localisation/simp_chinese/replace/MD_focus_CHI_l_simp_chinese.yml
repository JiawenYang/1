 CHI_the_Open_Windows: "有限开放"
 CHI_the_Open_Windows_desc: "我们将对国际互联网进行有限度开放，只要外国互联网公司选择遵守我国法律法规。"
 CHI_The_Fine_Management: "精细管控"
 CHI_The_Fine_Management_desc: "如何将自身实际情况与外国互联网有机结合是不是一件容易的事，这非常考验我们的精细化管控水平。"
 
 

 #\n《原神》是一款风靡全球的开放世界动作角色扮演游戏，由米哈游制作。
 #外交国策
 CHI_great_power_diplomacy: "大国外交"
 CHI_great_power_diplomacy_desc: "§Y沧海横流方显英雄本色，风高浪急更见砥柱中流§!\n\n中国特色大国外交，是对新中国成立以来一以贯之的外交思想与理念在新时代的传承与发展。"
 CHI_carrots: "怀柔羁縻"
 CHI_carrots_desc: "怀柔远人，义在羁縻。\n怀柔附远，何招而不至？\n端拱朝万国，守文继百王。\n九天阊阖开宫殿，万国衣冠拜冕旒。"
 CHI_European_Diplomacy: "欧罗巴洲"
 CHI_European_Diplomacy_desc: "欧洲地区是当今国际社会多极化力量的重要来源，与他们保持良好关系并积极推动合作是必要的。"
 CHI_European_cultural_exchange: "中欧文化交流"
 CHI_European_cultural_exchange_desc: "随着积极向外界推广我方文化，越来越多的欧洲国家人民开始对我们这片土地感到好奇。我们将举行一场盛大的文化节来宣传中华文明的优秀文化。"
 CHI_Developing_European_tourism: "实行过境免签"
 CHI_Developing_European_tourism_desc: "近年来我方的综合实力得到不断提升，而过境免签政策能让欧洲友人最直观地了解我们中国现代化发展数十年的成果。"
 CHI_European_Signing_trade_agreement: "商贸互助协议"
 CHI_European_Signing_trade_agreement_desc: "鉴于我方在欧洲地区的良好声誉和中国制造的优秀品质，我们得以在当地签署一系列友好的商业贸易互助协议。"
 CHI_European_Advanced_technology_cooperation: "尖端技术合作"
 CHI_European_Advanced_technology_cooperation_desc: "在各种尖端技术领域，欧洲诸国往往因独自体量不足而难以独立支持这些技术发展。我们可以利用自身市场份额以换取这些领域的合作。"
 CHI_Emphasis_Western_Europe: "侧重西欧地区"
 CHI_Emphasis_Western_Europe_desc: "欧洲地区国家众多，必须要选择一个重点地区。美国在西欧的影响力是显著，我们应该想办法抗衡这股力量以削弱美国霸权。"
 CHI_Emphasis_Eastern_Europe: "侧重东欧地区"
 CHI_Emphasis_Eastern_Europe_desc: "欧洲地区国家众多，必须要选择一个重点地区。在历史上东欧有不少国家都与我们关系良好，这值得我们向该地区深耕影响力。"
 CHI_Emphasis_Southern_Europe: "侧重南欧地区"
 CHI_Emphasis_Southern_Europe_desc: "欧洲地区国家众多，必须要选择一个重点地区。南欧地区各种矛盾与冲突十分常见，维持当地稳定并积极传播影响力是一个机遇与挑战并存的选择。"
 CHI_Expanding_Market_to_Target: "开拓欧洲市场"
 CHI_Expanding_Market_to_Target_desc: "我们工厂生产的产品物美价廉且数量庞大，相信用不了多久欧洲就会离不开中国制造了。"
 CHI_Talent_Exchange_to_Target: "促进人才交流"
 CHI_Talent_Exchange_to_Target_desc: "建设一个国家不能没有人才，更何况是那些高级人才。良好的教育环境和广阔的就业渠道应该能吸引不少欧洲人才定居中国。"
 CHI_Building_Tomorrow_to_Target: "共创美好明天"
 CHI_Building_Tomorrow_to_Target_desc: "在经过了无数的努力之后，欧洲与中国的关系日益紧密，让我们共同建设新的未来！"
 CHI_increase_EU_eurosceptic: "激发地区民族主义"
 CHI_increase_EU_eurosceptic_desc: "我们将会让欧洲人相信一点，那就是组建欧盟是个错误，因为它效率低下且臃肿不堪。"
 CHI_decrease_EU_eurosceptic: "协调欧洲内部矛盾"
 CHI_decrease_EU_eurosceptic_desc: "事实证明欧洲各国相似之处远超过不同之处，在我们积极协调解决欧洲内部矛盾后，更多欧洲人将会相信欧洲一体化是正确的。"
 

 CHI_Wolf_Warriors_diplomacy: "战狼外交"
 CHI_Wolf_Warriors_diplomacy_desc: "以德报德，以直报怨。\n扫帚不到，灰尘照例不会自己跑掉。\n我国秉持和平外交策略并不意味我们放弃使用手中利器。\n文质彬彬，然后君子。"
 CHI_South_China_Sea_issue: "南海议题"
 CHI_South_China_Sea_issue_desc: "中国南海的战略和经济重要性怎么强调都不为过。数千年来，我国对于南海有无可置疑的主权和管辖权，然而近代以来由于各种原因，周边国家非法盘踞占领了许多南海岛礁，让本属于我国的南海支离破碎。我们应慎重选择我们的外交对策，秉持共赢的态度，取得外交上的胜利。"
 CHI_Communicate_with_Malaysia: "与马来西亚磋商"
 CHI_Communicate_with_Malaysia_desc: "我们已经取得了对越南和菲律宾的外交成功。马来西亚对南海岛屿的领土诉求不如其他两个国家，我们可以如法炮制地收回最后一片岛屿。"
 CHI_Strengthen_patrols_South_China_Sea: "常态化南海巡逻"
 CHI_Strengthen_patrols_South_China_Sea_desc: "南海是中国不可分割的一部分，过去我们海军力量弱小而无法巡逻这片海域，但现在不一样了。"
 CHI_Expanding_Island_South_China_Sea: "扩建海岛设施"
 CHI_Expanding_Island_South_China_Sea_desc: "南海诸岛的自然条件十分恶劣，多亏了工业水平的进步，我们现如今能改变这一现状。"
 CHI_Increase_investment_in_ASEAN: "增加对东盟投资"
 CHI_Increase_investment_in_ASEAN_desc: "我们会增加东盟各国的投资以发展当地经济，这是展现合作善意所必要的。"
 CHI_Taiwan_issue: "台湾问题"
 CHI_Taiwan_issue_desc: "世界上只有一个中国，台湾是中国不可分割的神圣领土，是中华民族伟大复兴之路上必须要采撷起来的华夏之花。解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务，是全体中华儿女的共同愿望，是实现中华民族伟大复兴的必然要求。坚持贯彻新时代党解决台湾问题的总体方略，牢牢把握两岸关系主导权和主动权，坚定不移推进祖国统一大业。"
 CHI_Peaceful_Co_Existence: "和平解决"
 CHI_Peaceful_Co_Existence_desc: "台湾是我国固有领土，台湾人民是我们的同胞，我们应向这位祖国母亲的孩子示以更加温柔的爱。"
 CHI_Settle_Territorial_Disputes: "岛屿归属权明确"
 CHI_Settle_Territorial_Disputes_desc: "台湾掌握着许多我们将其视作归属于福建、广东、海南等省的岛屿，我们可以通过承认台湾当局对这些岛屿的管辖换取对方的让步。"
 CHI_Sign_an_Armistice: "一国两制承诺"
 CHI_Sign_an_Armistice_desc: "“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排。许多台湾同胞担心回归后台湾的行政性质问题，我们可以用成立特别行政区的承诺来打消他们的顾虑。"
 CHI_people_to_people_exchange: "民间交流"
 CHI_people_to_people_exchange_desc: "海岸两边的民众早已通过各种平台和渠道有了深刻交流，民间的互相认知和接受是我们走向统一的最佳动力。"
 CHI_Development_Assistance_TAI: "发展援助"
 CHI_Development_Assistance_TAI_desc: "台湾没有足够的能力翻新早已破旧的城市，也没有能力扩大自己的优势产业。我们当然可以照顾这位需要帮助的孩子。"
 CHI_Rigging_elections: "操纵选举"
 CHI_Rigging_elections_desc: "如果台湾当局不能确保反独的蓝营执政，那我们就“助推”蓝营一把……"
 CHI_Joint_military_exercises_TAI: "台海联合军演"
 CHI_Joint_military_exercises_TAI_desc: "在台海来联合进行一次海陆空全方位的大规模军事演习，既能破灭一切分裂分子的最后幻想，也能向世界昭告台湾回归的事业势不可挡。"
 CHI_Establish_Taiwan_SAR: "成立台湾特别行政区"
 CHI_Establish_Taiwan_SAR_desc: "现在准备工作已经完成，是时候让台湾人民重新与大陆同胞团聚，成为中华人民共和国的一部分。尽管台湾仍然保持了一定程度上的自治权，但我们统一祖国的目标现在已经实现，历时数十年后，我国终于金瓯无缺，中华民族伟大复兴之路上最后一颗蒙尘的海珠终于回到了家庭。"
 CHI_Warning_to_the_United_States: "警告美国"
 CHI_Warning_to_the_United_States_desc: "台湾是中国的台湾。解决台湾问题是中国人自己的事，要由中国人来决定。我们即将解放台湾，美国必须履行他们不干涉中国内政的诺言。"
 CHI_Resume_the_Civil_War: "继续解放战争"
 CHI_Resume_the_Civil_War_desc: "在1950年解放海南岛后，我国大陆地区已经建立了人民民主专政的社会主义共和国，推翻帝国主义、封建主义、官僚资本主义的反动统治。然而，蒋介石反动集团窜逃我国台湾，据岛为寇，分裂我国政权，破坏我国领土完整。为了解放台湾同胞，必须坚持革命斗争，我们将扫荡所有阻碍祖国统一的牛鬼蛇神。"
 CHI_Towards_the_final_victory: "向最后的胜利……"
 CHI_Towards_the_final_victory_desc: "听！风在呼啸军号响!\n听！革命歌声多嘹亮！\n同志们整齐步伐奔向解放的战场\n同志们整齐步伐奔赴祖国的边疆"
 CHI_Towards_the_liberation_of_the_whole_country: "向全国的解放！"
 CHI_Towards_the_liberation_of_the_whole_country_desc: "向前！向前！\n我们的队伍向太阳\n§Y向最后的胜利！§!\n§R向全国的解放！§!"
 CHI_End_of_ROC: "明珠拂尘" 
 CHI_End_of_ROC_desc: "祖国统一解放战争以人民解放军和中央人民政府的全面胜利而结束，帝国主义反动派已被彻底清除出中国。台湾这颗海上明珠终于拂去数十年的灰尘，回归祖国团结的大家庭。"
 CHI_ultimatum: "最后通牒"
 CHI_ultimatum_desc: "赐给台湾当局最后一次和平解决的机会，中国必将统一。勿谓言之不预也。"
 CHI_rule_all_the_land: "四海一统"
 CHI_rule_all_the_land_desc: "§Y四海一家天历数，两河百郡宋山川§!\n\n国家统一、民族复兴的历史车轮滚滚向前，祖国完全统一一定要实现，也一定能够实现。如今，我们终于完成了社会主义祖国的统一，中国特色社会主义的伟大征程又前进了一步，中华民族伟大复兴的伟大事业离我们更加近了！"
 CHI_the_Middle_East: "中东地区"
 CHI_the_Middle_East_desc: "中东地区是亚洲最重要的地区之一。第二次世界大战结束后，此地由于情况复杂，又发掘出丰富的石油资源，一度沦为超级帝国的博弈棋盘，冲突频发，中东人民生活在水深火热之中。作为负责任的大国，我们有义务维持中东地区的稳定和均势，同时扩大我们的影响力。"
 CHI_Scholars_on_the_Silk_Road: "丝路学者"
 CHI_Scholars_on_the_Silk_Road_desc: "伊朗是著名的文明古国之一。勤劳、勇敢的古代波斯人民创造了辉煌灿烂的文化，特别是在医学、天文学、数学、农业、建筑、音乐、哲学、历史、文学、艺术和工艺方面都取得了巨大成就。我们两国应珍惜历史上的情谊，深化在当代的合作。"
 CHI_Invite_to_join_the_SCO: "邀请伊朗加入上合组织"
 CHI_Invite_to_join_the_SCO_desc: "伊朗的地缘诉求与我们不谋而合，上合组织建立的宗旨就是维持地区稳定和促进成员国发展。我们应当邀请这位中东的兄弟加入上合组织，进一步深化和协调我们的合作关系。"
 CHI_Development_Assistance_PER: "伊朗发展援助"
 CHI_Development_Assistance_PER_desc: "伊朗对待国际援助态度谨慎，受美国制裁和西方长期外交孤立影响，较少接受国际组织、国际金融机构和其他国家援助，即使有也是冠之以国际合作名义开展，多为人道主义非制裁领域，援助形式以物资为主，而且规模不大。我们将以签署商业订单的形式帮助伊朗建设经济。"
 CHI_Strategic_partners_PER: "战略合作伙伴"
 CHI_Strategic_partners_PER_desc: "中国人民当然与伊朗人民的利益诉求并行不悖。中伊两国的合作关系应该进一步深化，促成一个深度的战略合作伙伴关系。"
 CHI_Oil_Kingdom: "石油王国"
 CHI_Oil_Kingdom_desc: "沙特阿拉伯是世界上石油储量最大的国家之一。与这个皇室至高无上的石油王国构建友好的对话平台有助于强化我们在中东地区的影响力。"
 CHI_order_for_goods_of_SINOPEC: "中国石化的订单"
 CHI_order_for_goods_of_SINOPEC_desc: "中国每年需要进口大量石油，沙特阿拉伯是我国最大的石油进口国之一。我们可以通过签署国企中国石化的石油订单来深化我们与沙特阿拉伯的经济交流，同时协助沙特阿拉伯的石油开采。当然，这笔钱实际上是由政府出。"
 CHI_Silk_Road_tycoon: "丝路大亨"
 CHI_Silk_Road_tycoon_desc: "一带一路当然不能少了沙特阿拉伯这位财主。虽然沙特阿拉伯并不是贫穷落后的国家，然而其国内消费品和工业品每年都要大量进口，我们可以通过一带一路策略来提供足够实惠的卖家。"
 CHI_Selling_Arms_SAU: "出售军火"
 CHI_Selling_Arms_SAU_desc: "我国与沙特阿拉伯的军火交易有历史成绩，沙特阿拉伯需要足够多的精良武器保护自己。我们制造的武器物美价廉，沙特阿拉伯的王族们十分青睐于采购我们的军火。我们可以通过向沙特出售军火来加深双方的交流，并刺激国内军工行业的发展。"
 CHI_cradle_of_civilization: "文明摇篮"
 CHI_cradle_of_civilization_desc: "伊拉克有悠久的历史，两河流域是世界古代文明的发祥地之一。这个文明古国如今饱受摧残，美帝国主义的走狗军队借反恐战争之名在伊拉克犯下的罪行罄竹难书。我们应该和这个饱受磨难的国家建立友好合作关系，这是两国人民共同的心愿和诉求。"
 CH_Icultural_exchange_IRQ: "文化交流"
 CH_Icultural_exchange_IRQ_desc: "中国和伊拉克同为四大文明古国之一，有历史上的共识。我们将从对两国灿烂的古代文化成就和友好交往历史入手，升温两国政府的交流。"
 CH_Oil_orders: "石油订单"
 CH_Oil_orders_desc: "伊拉克是我国第三大原油进口来源国，我国是伊拉克最大贸易伙伴。采购更多的石油对加深两国合作并扩大我国对伊拉克的经济影响力有很大推动力。"
 CHI_Silk_Road_IRQ: "一带一路拓展"
 CHI_Silk_Road_IRQ_desc: "伊拉克总体上是一个较为贫穷落后的亚洲国家，一带一路倡议背景下，我国有义务帮扶伊拉克发展国内建设。"
 CHI_The_Diaoyu_Islands_issue: "钓鱼岛问题"
 CHI_The_Diaoyu_Islands_issue_desc: "钓鱼岛及其附属岛屿自古以来就是中国的固有领土，中国对此拥有充分的历史和法律依据。日本方面无视大量历史事实，声称钓鱼岛为日本的“固有领土”，并长期非法盘踞岛上，严重侵犯了我国领土主权，破坏我国领土完整。我们必须尽快敲打敲打固执的日本民族主义者。"
 CHI_Provocative_Fleet_Exercises: "开展海上军演"
 CHI_Provocative_Fleet_Exercises_desc: "为了维护我们在钓鱼岛和东海的主权，我们应该利用中国人民解放军海军在钓鱼岛水域进行海上军事演习。虽然对我们来说，这一行动代表了我们主权的正当表达，但美国和其他国家可能会将这一行动视为威胁，并冒着武装对抗的风险也向该地区派遣海军部队。"
 CHI_Incite_Anti_Japanese_Sentiment: "清算历史罪行"
 CHI_Incite_Anti_Japanese_Sentiment_desc: "日本曾对中华民族犯下罄竹难书的罪行，且从未真正地正视过任何历史，这是民间反日情绪一直存在的原因。\n\n§R日本必须为历史罪行而付出代价！§!"
 CHI_Demand_a_Withdrawal: "要求美国从冲绳撤军"
 CHI_Demand_a_Withdrawal_desc: "冲绳美军基地是安插在我国海域大门口的一颗铁钉，时时刻刻准备刺进我国尚未强大的海军的心脏。中国若要实现伟大复兴，必须打扫干净屋子，让蟑螂老鼠和帝国主义一起滚出中国。"
 CHI_Questioning_Okinawa_sovereignty: "质疑日本对冲绳的主权"
 CHI_Questioning_Okinawa_sovereignty_desc: "冲绳本名叫琉球，明清时代它一直是中国的属国，冲绳是日本抢夺此地后强加的称呼。第二次世界大战日本战败后为美国占领，美名“接管”。1971年美日私自签订《冲绳返还协定》，1972年5月冲绳施政权被美国非法移交给日本，从此日本非法对冲绳行使管辖权。\n冲绳是独立的国家，是我国的友好邻邦，日本必须结束对他国的非法占领！"
 CHI_Strike_Across_the_Himalayas: "收复藏南地区"
 CHI_Strike_Across_the_Himalayas_desc: "藏南是世界上山地垂直自然带最齐全的地方，也是管窥全球气候变化的要地。可是这样一片祖国的土地竟然长期被印度当局非法占领，当地居民无法回归祖国。我们必须不惜代价地维护领土完整！"
 CHI_maintain_order: "维持秩序"
 CHI_maintain_order_desc: "世界已经陷入混乱，大国们只图门户私计，不再维护世界和平。中国将代表正义之师荡平一切帝国主义侵略者，我们将重建和平的世界秩序。"
 CHI_The_Northern_Shiled: "北境之盾"
 CHI_The_Northern_Shiled_desc: "“重新疆者，所以保蒙古，保蒙古者，所以卫京师”\n\n外蒙古地区虽然在二战末期已被列强和懦弱的国民政府达成条约独立出中国，但我们的人民从来没有忘记蒙古永远是我国不可分割的领土。我们必须在这一地区施加我们的影响力。"
 CHI_Maintaining_Mongolia_independence: "维护外蒙古独立"
 CHI_Maintaining_Mongolia_independence_desc: "外蒙古已经独立了数十年，我们不能无视与北方发生军事冲突的风险，应当继续维持当地作为缓冲区的实际情况。"
 CHI_Mongolia_joins_the_SCO: "上合组织扩展"
 CHI_Mongolia_joins_the_SCO_desc: "与蒙古国的合作十分顺利，而上合组织的目标是维护地区稳定并推动成员发展，这意味着上合组织进一步扩展是理所应当的事情。"
 CHI_Mongolian_Mineral_Rights: "蒙古矿石权益"
 CHI_Mongolian_Mineral_Rights_desc: "我们将提供经济支持并协助处理环境问题，以换取蒙古当地资源的使用权，这对双方而言是双赢。"
 CHI_PER_SAU_compromise: "沙伊和解"
 CHI_PER_SAU_compromise_desc: "沙特阿拉伯和伊朗之间由于历史政治原因，有很深的外交隔阂甚至是敌视。这两个地区强国如果始终维持紧张的关系，不利于中东地区维持和平稳定。好在我们对这两国都有一定影响力，也许我们可以做个和事佬，尽可能将沙伊关系缓和一点。"
 CHI_utilize_Industrial_dependence: "利用产业依赖"
 CHI_utilize_Industrial_dependence_desc: "从前，我们是承接发达国家产业转移的落后生产国。如今，我们是控制全球生产命脉的超级大国。一国剥削另一国的时代理应过去了，我们必须联合其他被剥削国家团结起来，抵抗以美国为核心的国际特权利益体系！"
 CHI_aer_aer_port: "阿尔阿尔口岸"
 CHI_aer_aer_port_desc: "沙特阿拉伯和伊拉克之间已经很多年处于一种非正常的关系。我们了解到沙特对于希望在与伊朗博弈中将伊拉克拉近自己的打算，可以借这个机会促进两国关系慢慢走向正常化，扩大我们在中东的话语权。"
 CHI_Oppose_international_exploitation: "反对国际剥削"
 CHI_Oppose_international_exploitation_desc: "既有利益体系必然尤其庞大而强大的受益者才能维持，美国主导的国际秩序受到发达国家的普遍支持，他们同时也是这套秩序的受益者。通过产业转移、劳务外包、股市操纵等形式，这些发达国际在剥削落后国家的基础上维持了本国的优越地位。我们应该让他们也加入到反对美国霸权的斗争之中——除非他们打算继续维持他们的美国狗腿子身份。"
 CHI_End_US_Hegemony: "终结美国霸权"
 CHI_End_US_Hegemony_desc: "霸权秩序需要三种权力作为基础，即物质性权力、制度性权力和合法性权力。长期以来，美国依赖其独特的国际地位和优势，在世界上横行霸道，鱼肉每一个国家，并让所有国家为其狂悖之举买单。2008年的世界性金融危机既是美国霸权秩序的巅峰，同时也标志美国霸权秩序退位的起始。如今，随着中华民族的伟大复兴，我国已在综合国力上全面超越美国，美国霸权作为一种旧秩序的时代已经结束了，美帝国主义所代表的帝国资本主义已经迎来了它的穷途末路。"
 CHI_The_Fate_of_the_Paracels: "与越南磋商"
 CHI_The_Fate_of_the_Macclesfield_Bank: "与菲律宾磋商"
 CHI_national_security: "国防安全"
 CHI_national_security_desc: "非洲各国人民随时受到动荡政局和军事威胁，我们作为非洲人民和第三世界国家的朋友，需要协助他们保护自身安全，加强国防建设。"
 CHI_Friends_of_Africa: "非洲之友"
 CHI_Friends_of_Africa_desc: "在我国的不断援助下，非洲这片古老而充满活力的大陆正缓慢复苏。从前我们被非洲兄弟抬进联合国，如今我们当之无愧非洲之友这一称号了。"
 CHI_Questioning_Treaty_of_Aigun: "质疑瑷珲条约"
 CHI_Questioning_Treaty_of_Aigun_desc: "腐朽无能的清朝政府在1858年被迫签订《瑷珲条约》，确定了当时的沙俄在远东地区的统治地位，但这显然只是一种不平等条约。" #而随着我们军事实力和国际地位提升，《瑷珲条约》必须被废除，外东北必须得到回归！
 CHI_dialogue_based_on_strength: "从实力地位出发"
 CHI_dialogue_based_on_strength_desc: "近年来我国军事突飞猛进，当前的军事实力已经不弱于这个所谓的世界霸主，可是他们仍然活在旧时代，是时候给他们好好提个醒。"
 CHI_Support_Sikkim_Independence: "支持锡金独立"
 CHI_Support_Sikkim_Independence_desc: "锡金王国在1975年被印度非法吞并，现如今我们对印度的战争十分顺利，我们应该帮助他们从印度之中独立出来，并给予援助以对抗印度。"
 CHI_Far_East_Infrastructure: "远东基础建设"
 CHI_Far_East_Infrastructure_desc: "这片土地的巨大潜力尚未被有效开发，我们要做的第一步是修建更好的道路。"
 CHI_Far_East_Resource_Extraction: "远东资源开采"
 CHI_Far_East_Resource_Extraction_desc: "随着与该片地区的沟通问题的解决，下一步要做的便是扩大对该地的资源开采业的投入。"
 CHI_Prosperous_Far_East: "繁荣的远东"
 CHI_Prosperous_Far_East_desc: "事实证明，即使这片土地曾脱离了我们的统治如此之久，现如今仍然能在这里建立繁荣而富足的社会！"
 CHI_A_Shameful_Beginning: "铭记历史屈辱"
 CHI_A_Shameful_Beginning_desc: "近代以来欧洲诸国的侵略是导致中国陷入存亡危机的关键原因，我们决不能忘记这一点。"
 CHI_Seize_Right_to_Speak: "掌握话语权"
 CHI_Seize_Right_to_Speak_desc: "国际社会上仍然泛滥着对于欧洲的盲目崇拜情绪，在瓦解美国霸权后是一次难得的解决问题机会。"
 CHI_Anticolonial_Propaganda: "反殖民主义宣传"
 CHI_Anticolonial_Propaganda_desc: "西方世界表面上不再直接殖民他国，但暗中对欠发达地区的隐形殖民却仍然进行，我们必须揭露他们伪装文明的面具。"
 CHI_European_Crimes: "审判欧洲罪行"
 CHI_European_Crimes_desc: "欧洲诸国必须认清楚他们对中国，乃至广大亚非拉国家曾经犯下的历史罪行，并为此付出实际的代价！"
##军事国策##
 CHI_Peoples_Liberation_Army: "§Y中国人民解放军§!"
 CHI_Peoples_Liberation_Army_desc: "中国人民解放军是我国最主要的武装力量。为确保我国能够拥有一支适应新时代变化的人民军队，以捍卫我们的伟大祖国和人民群众，我们必须对人民军队进行强军建设。"
 PLA_Sharp_tools_make_good_work: "欲善其事，先利其器"
 PLA_Sharp_tools_make_good_work_desc: "工欲善其事，必先利其器。精神力量和战略决策固然是影响军队作战能力的重要因素，然而我们更应该充分利用我们强大的工业制造能力来为军队提供物质支持。"
 CHI_Expand_THE_CSIC: "扩展中船重工"
 CHI_Expand_THE_CSIC_desc: "中国船舶工业集团公司是我国两大造船集团之一，另一家是中国船舶重工集团公司。投资中船重工将有助于发展中国北方的造船业，而北方正是中船重工最为活跃的地区。"
 PLA_Bobcat_all_terrain_vehicle: "山猫全地形车"
 PLA_Bobcat_all_terrain_vehicle_desc: "山猫全地形车是我国研制出的一款实用性极强的多功能载具，能适应各种情境下的需要，并易于搭配不同的兵种和装备。"
 PLA_officer_training_system: "军官培训"
 PLA_officer_training_system_desc: "军官职业化的核心是专业化。我们应该训练一批适应新时代军事环境、熟悉新时代军事理论的军事人才来为军官团体注入新鲜血液。"
 PLA_Concentration_of_command_authority: "指挥权集中"
 PLA_Concentration_of_command_authority_desc: "“为将之道，当先治心。”崇高的理想、坚定的信念，是革命军人的灵魂，是克敌制胜、拒腐防变的决定性因素。牢牢把握立德树人这一根本指向，着眼培育“四有”新时代革命军人，把党的创新理论武装和思想政治教育作为军官教育培训的重点内容突出出来，从基础教育到晋升教育、从尉官培训到将官培训、从指挥管理军官到专业技术军官，始终旗帜鲜明筑信仰大道、立忠诚大德，切实把红色基因一代代传承下去，确保全军官兵坚定不移听党话、跟党走。"
 PLA_Network_information_support: "网络信息支援"
 PLA_Network_information_support_desc: "调整组建信息支援部队，是党中央和中央军委从强军事业全局出发作出的重大决策，是构建新型军兵种结构布局、完善中国特色现代军事力量体系的战略举措，对加快国防和军队现代化、有效履行新时代人民军队使命任务具有重大而深远的意义。信息支援部队是全新打造的战略性兵种，是统筹网络信息体系建设运用的关键支撑，在推动我军高质量发展和打赢现代战争中地位重要、责任重大。"
 PLA_Reserve_Force: "中国人民解放军预备役部队"
 PLA_Reserve_Force_desc: "预备役部队以少数现役军人为骨干，以预备役军官和士兵为基础，按照中国人民解放军的统一编制组建，属于人民解放军序列。平时按照总参谋部的计划进行军事训练，努力提高军事素质和快速动员能力，必要时可按照法律规定协助维护社会秩序，战时根据国家发布的动员令转为现役部队。"
 PLA_National_University_of_Defense_Technology: "国防科技大学"
 PLA_National_University_of_Defense_Technology_desc: "厚德博学，强军兴国。国防科技大学位于湖南省长沙市，是直属中国共产党中央军事委员会领导的军队综合性大学，也一直是国家和军队重点建设的院校。建国以来，国防科大为祖国培育了无数军事人才，在军事技术研究领域做出了极大贡献。"
 CHI_CPLA: "§Y中国人民解放军空军§!"
 CHI_CPLA_desc: "中国人民解放军空军于1949年11月11日正式成立，经过不断发展建设，中国空军已经发展成为一支由航空兵、地空导弹兵、高射炮兵、雷达兵、空降兵、电子对抗、气象等多兵种合成，由歼击机、强击机、轰炸机、运输机等多机种组成的现代化的高技术军种。"
 PLA_fighter_production: "加强战斗机生产"
 PLA_fighter_production_desc: "战斗机是空军的坐骑和灵魂。我们应尽快研发航空前沿科技，更新我们落后的战斗机设计。"
 PLA_domestic_helicopter_production: "加强直升机制造"
 PLA_domestic_helicopter_production_desc: "直升机在现代战场具有突出作用，我们应该尽快跟进这一领域的研发。"
 PLA_Pilot_privileges: "飞行员优待"
 PLA_Pilot_privileges_desc: "培育一个优秀的飞行员的成本比制造一架飞机更加昂贵。我们应加大对飞行员的培育成本，快速训练出一批飞行人才。"
 PLA_Aerial_reconnaissance: "空中侦察"
 PLA_Aerial_reconnaissance_desc: "必要时，我们的飞机可以刺探敌军的军情，为正面战场作战提供支持。"
 PLA_Ground_support: "攻防兼备"
 PLA_Ground_support_desc: "新时代空军既要能完成传统防御性任务，又要强化远程精确打击以及战略投送等进攻能力。作战模式从被动防御全面转型为积极防御与主动反击结合。"
 PLA_Chain_team_attack: "空天一体"
 PLA_Chain_team_attack_desc: "不仅如此，还要将传统航空领域与航天领域进行一体化整合，通过天基信息平台、卫星网络与控台武器系统协调，构筑跨大气层全域作战能力。"
 PLA_Advanced_fighter_research: "先进战机研发"
 PLA_Advanced_fighter_research_desc: "各国都对下一代战机有了自己的设想，我们自然也不能例外。"
 CHI_PLAN: "§C中国人民解放军海军§!"
 CHI_PLAN_desc: "中国人民解放军海军成立于1949年4月23日。中国人民解放军海军兵力由舰艇部队、潜艇部队、航空兵部队、海军陆战队、岸防兵部队等组成，具有在水面、水中、空中作战的能力。中国人民解放军海军的主要任务是独立或协同陆军、空军防御敌人从海上的入侵，保卫领海主权，维护海洋权益。"
 PLA_Blue_Water_Navy: "远洋作战能力"
 PLA_Blue_Water_Navy_desc: "过去我们的海军建设策略是近海作战的防御型舰队，随着海上主权在这个时代愈发重要，我们应该改变我们的海军建设策略，建设一支具备远洋作战能力的蓝水舰队刻不容缓。"
 PLA_Optimize_our_fleet: "舰队关键优化"
 PLA_Optimize_our_fleet_desc: "新的时代海军需要更新作战模式，用更加现代化的方式训练并保持常态化演习是极为重要的。"
 PLA_World_class_Navy: "世界一流海军"
 PLA_World_class_Navy_desc: "建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑，是实现中华民族伟大复兴中国梦的重要组成部分。在新时代的征程上，在实现中华民族伟大复兴的奋斗中，建设强大的人民海军的任务从来没有像今天这样紧迫。"

 CHI_CPLA_Ground_Force: "§G中国人民解放军陆军§!"
 CHI_CPLA_Ground_Force_desc: "中国人民解放军陆军是人民解放军的主要军种，是陆地作战的主力，是人民解放军各军兵种中历史最久，在新中国建立前后的历次作战中发挥最出色的，也是社会主义现代化建设和各种抢险救灾中的中坚力量。"
 PLA_Listen_to_the_Partys_command: "§Y听党指挥§!"
 PLA_Listen_to_the_Partys_command_desc: "§Y金星闪耀在军旗上，我们的原则是党指挥枪§!\n听党指挥既是我军的强军之魂，也是我军的治军之要，还是军人的品质之首。听党指挥不是一句空洞的口号，而是真切的实际行动。"
 PLA_Can_win_battles: "§Y能打胜仗§!"
 PLA_Can_win_battles_desc: "文无第一，武无第二。军队打不赢，一切等于零。实现强军目标，要求我军任何时候任何情况下都能够做到上得去、打得赢。这是党和人民对军队的根本要求，是我军履行职能、不辱使命的根本体现。"
 PLA_Excellent_style: "§Y作风优良§!"
 PLA_Excellent_style_desc: "作风优良是保证，关系军队的性质、宗旨、本色。作风是一支军队本质属性、军心士气、战斗精神的外化与表征。古往今来，只有过硬的作风才能锤炼英勇善战的部队，骄奢淫逸、作风散漫注定搞垮常胜之师。"
 PLA_Ideological_education: "思想教育与荣誉传承"
 PLA_Ideological_education_desc: "万里长江水，奔腾向海洋\n继续革命握紧枪，人民军队忠于党\n共产主义定胜利，万岁共产党！万岁毛主席！\n万岁毛主席！"
 PLA_All_terrain_vehicle: "配备全地形车"
 PLA_All_terrain_vehicle_desc: "我们研发的山猫全地形车由于其极高的适应性和灵活性，能够迅速武装大部分部队，这极大地提高了解放军的作战能力。"
 PLA_Military_mechanization: "机械化部队"
 PLA_Military_mechanization_desc: "现代战场上，单枪匹马的步兵只会沦为钢铁巨兽的脚下亡魂。我们应组建一支强大的机械化部队，用钢铁巨兽保护我们的人民子弟兵。"
 PLA_logistic_service: "后勤保障"
 PLA_logistic_service_desc: "自古道三军未动，粮草先行，兵精粮足，战无不胜。为了确保解放军能够心无旁骛地训练和战斗，我们应该加大军事后勤的支出，让每一个人民子弟兵都能吃上热乎的饭菜，用上充足的军事物资。"
 PLA_overwhelming_fire_power: "火力压制"
 PLA_overwhelming_fire_power_desc: "我们有得是炮弹和超远距离射程的各类火炮，可以轻松实现火力覆盖。如果有遗漏的敌人那就再覆盖一遍。"
 PLA_Multiple_Sea_Areas: "多海域存在"
 PLA_Multiple_Sea_Areas_desc: "随着国际地位提升，我们的海外利益需要海军保护，不仅是在东海、南海保卫核心利益，而且还需要确保印度洋、西太平洋等关键航道安全。"
 PLA_Information_Navy_fleet: "信息化与无人化"
 PLA_Information_Navy_fleet_desc: "提升智能化设备制造水平以及强化战场感知与深化分布式作战能力是极为关键的。"
 PLA_Service_Fleet: "勤务舰队拓展"
 PLA_Service_Fleet_desc: "以护卫舰为主力，承担中远海巡逻、反海盗、护航等低强度任务，性价比高且规模庞大，减轻主力舰负担。"
 PLA_Battle_Fleet: "决战舰队建设"
 PLA_Battle_Fleet_desc: "以航母与导弹驱逐舰为核心，聚焦高强度对抗，重点突破反介入和区域拒止能力，确保未来在远海能抗衡强敌。"
 PLA_Army_Doctrine_Technology: "先进战术研究"
 PLA_Army_Doctrine_Technology_desc: "新战术与新思想百花齐放，要抓住机会突破常规思维去深入探索军事理论的可能方向。"
 PLA_Advanced_UAV: "无人机优势"
 PLA_Advanced_UAV_desc: "作为无人机大国，我们拥有其他国家无法获得的无人机优势。没人能在铺天盖地的无人机蜂群中还能维持作战意志。"
 PLA_Equipment_Modernization: "装备体系现代化"
 PLA_Equipment_Modernization_desc: "推进全陆军的装备体系平台通用化、隐身化、智能化，这能极大地提升战场精确打击能力与生存能力。"
 PLA_Extreme_Training: "转型实战化训练"
 PLA_Extreme_Training_desc: "在陆军之中推动开展跨区对抗与强调极端环境下演练，避免把演习变成一场“演戏”。"
 PLA_Synthetic_Camp: "作战组织合成化"
 PLA_Synthetic_Camp_desc: "陆军将采用“积木式组合”模式，将坦克、炮兵、工兵等兵种混合编成多功能部队，实现“即插即用”，增强体系抗毁性与任务灵活性。"
 CHI_CPLA_Ground_Force_New_Era: "新时代的陆军"
 CHI_CPLA_Ground_Force_New_Era_desc: ""
 CHI_PLAN_New_Era: "新时代的海军"
 CHI_PLAN_New_Era_desc: ""
 CHI_CPLA_New_Era: "新时代的空军"
 CHI_CPLA_New_Era_desc: ""

 PLA_expanding_missile_stockpile: "扩充导弹库存"
 PLA_missile_function_transformation: "转变职能定位"
 PLA_missile_need_upgrade: "装备更新换代"
 PLA_missile_ensure_precision_strikes: "确保精确打击"
 PLA_both_nuclear_and_conventional: "强调核常兼备"
 PLA_expanding_missile_stockpile_desc: "为了实现有效的战略威慑，我们必须要快速扩充导弹库存。"
 PLA_missile_function_transformation_desc: "从“二炮部队”到“火箭军”的转换，不只是单纯改变了名称，而是为了让其职能定位更加清晰与明确。"
 PLA_missile_need_upgrade_desc: "导弹武器需要科技进步和系统性的更新换代，这需要投入大量资源。"
 PLA_missile_ensure_precision_strikes_desc: "无限制的火力浪费是错误的，我们必须要确保精确打击每一个目标。"
 PLA_both_nuclear_and_conventional_desc: "我们的导弹部队必须同时具备完成常规精确打击和战略核反击任务的双重能力。"

##中国超级工程国策##
 CHI_Chinese_Megaprojects: "大国重器"
 CHI_Chinese_Megaprojects_desc: "现在我们已经开始释放中国的经济潜力和工业潜力，我们有可能开展前所未有的规模的工程设施项目。伟大的中国共产党将带领中国人民创造无与伦比的世界奇迹。"
 CHI_Aerospace_Industry: "航空航天事业"
 CHI_Aerospace_Industry_desc: "航空航天工业是任何主要经济体的重要部门。我国是一个拥有五千年历史的文明古国，我们的祖先对于星空有无数渴望和探索欲，这一切终将在当代亿万中国人民的圆梦之路上实现。"
 CHI_State_Satellite_Research: "卫星载荷研发"
 CHI_State_Satellite_Research_desc: ""
 CHI_State_Rocket_Research: "运载火箭研发"
 CHI_State_Rocket_Research_desc: ""
 CHI_Power_surging: "动力澎湃"
 CHI_Power_surging_desc: "动力是工业发展的第一要素，人类文明的每一次重大进步，都伴随着动力的变革与升级。我国想要建成任何超级工程都必须有强力的工程技术作为支撑。"
 CHI_Research_High_performance_steam_turbine: "高性能汽轮机研发"
 CHI_Research_High_performance_steam_turbine_desc: "汽轮机也称蒸汽透平发动机，是一种旋转式蒸汽动力装置。汽轮机是现代火力发电厂的主要设备，也用于冶金工业、化学工业、舰船动力装置中。我国必须必须要尽快研制出世界一流的高性能汽轮机，为我国工程事业注入强大动力。"
 CHI_Domestic_shield_tunneling_machine: "深瞳掘进"
 CHI_Domestic_shield_tunneling_machine_desc: "盾构机是一种使用盾构法的隧道掘进机，无论是建成巨型工程还是发掘矿产资源，盾构机都是重要器械。然而我国缺少自主研发的盾构机，此前都是进口外国生产的盾构机。若要独立自主建设超级工程，就不能缺少自主研发的国产盾构机。"
 CHI_The_vast_working_class: "咱们工人有力量"
 CHI_The_vast_working_class_desc: "咱们工人有力量 嘿！咱们工人有力量\n每天每日工作忙 嘿！每天每日工作忙\n盖成了高楼大厦 修起了铁路煤矿\n改造得世界 变呀么变了样！\n§Y中国劳动人民将作为主角创造世界奇迹§!"
 CHI_Super_Engine: "超级引擎"
 CHI_Super_Engine_desc: "我国在工程技术上已经取得世界先进地位，现在中国成为了地球上最强劲的工程制造引擎，我们可以完成人类历史上一切最大规模的超级工程。"
 CHI_Modernizing_Agriculturee: "农业生产现代化"
 CHI_Modernizing_Agriculturee_desc: "农，天下之大本也，民所恃以生也。我国拥有数千年农业生产历史，在中华民族伟大复兴之路上，农业现代化是必须要完成的时代使命。"
 CHI_Expand_the_commodity_grain_base: "扩大商品粮基地"
 CHI_Expand_the_commodity_grain_base_desc: "我国虽然人均耕地较少，且大多耕地为个体小农以家庭承包方式持有，难以统一调度和调整生产。但我们可以扩大已有的几个高产商品粮基地，并尝试在西北地区开辟新的商品粮基地。"
 CHI_Agriculture_Logistics_System_Construction: "农业物流系统建设"
 CHI_Agriculture_Logistics_System_Construction_desc: "我国农业生产能力并不低，但由于国土广袤，地势复杂，耕地分散，农业物流成本长期高企，严重阻碍我国农业高质量发展。我们应建设一套覆盖全国的高效农业物流系统，用以支撑农业健康发展，"
 CHI_Leisure_Agriculture_and_Rural_Tourism: "休闲农业与乡村旅游"
 CHI_Leisure_Agriculture_and_Rural_Tourism_desc: "农业是附加值较低的初级生产，农业若要转型升级就不能局限于农业生产本身。我国拥有极为庞大的市民群体，休闲农业和乡村旅游的潜在消费需求很大，我们应该创新性地试验和推广这一新发展模式。"
 CHI_Promoting_agriculture_through_digital_commerce: "数商兴农"
 CHI_Promoting_agriculture_through_digital_commerce_desc: "农村电商是“互联网+”现代农业的重要内容，是转变农业发展方式的重要手段。我们应该设计实施“数商兴农”工程，推进电子商务进乡村，促进农副产品直播带货规范健康发展，让电子经济为农业高质量发展赋能，成为新的农业生产增长热点。"
 CHI_Sunway_BlueLight_MPP: "神威工程"
 CHI_Sunway_BlueLight_MPP_desc: "超级计算机是相对于大型计算机而言的一种运算速度更高、存储容量更大、功能更完善的计算机。自2009年我国国防科技大学发布峰值性能为每秒1.206千万亿次的“天河一号”超级计算机，我国成为美国之后第二个可以独立研制千万亿次超级计算机的国家。我们必须尽快研制出世界顶尖的超级计算机，为我们的科研事业提供更好的算力支持。"
 CHI_Sunway_TaihuLight: "神威·太湖之光"
 CHI_Sunway_TaihuLight_desc: "我们在科技工程技术上的突破可以进一步提升我国的超级计算机性能。"
 CHI_Sunway_OceanLight: "神威·海洋之光"
 CHI_Sunway_OceanLight_desc: "我们在科技工程技术上的突破可以进一步提升我国的超级计算机性能。"
 CHI_Sunway_NatureLight: "神威·自然之光"
 CHI_Sunway_NatureLight_desc: "我们在科技工程技术上的突破可以进一步提升我国的超级计算机性能。"
 CHI_OGAS_design: "全国自动化系统提议"
 CHI_OGAS_design_desc: "OGAS（全国自动化系统）是一项前苏联的全国性网络工程。苏联为了建立类似互联网的全国性网络，做出了一系列尝试，OGAS是其中之一，但这些项目最终均遭失败。\n苏联这一计划失败的根本原因在于计划超出了当时的苏联社会经济和科技所能支撑的范围，成为了一座中看不中用的空中花园。我国现在拥有世界上最大的工业制造体系和世界领先的计算机网络工程技术，是时候由我们来完成这个人类历史上最宏大的技术工程。"
 CHI_West_Line_Projec_South_to_North_Water_Diversion_Project: "南水北调西线工程"
 CHI_West_Line_Projec_South_to_North_Water_Diversion_Project_desc: "南水北调西线工程由于工程难度巨大、诸方案有待商榷、工程款项超出承载能力等原因，长期处于前期论证阶段，为未建项目。如今，我们已经可以着手进行南水北调这一超级水利工程的最后环节，我们将一劳永逸地解决我国缺水的问题。"
 Motuo_Hydropower_Station: "墨脱水电站"
 Motuo_Hydropower_Station_desc: "墨脱水电站计划修建于中国藏南地区，由于这里地势落差较大且地形十分复杂，水能资源尤为丰富。根据相关专家计算显示，整个西南地区的水能资源约占我国水能总量的三分之一，而墨脱水电站计划的装机容量为6000万千瓦。三峡工程作为目前世界上最大的水利工程，年发电量为3000亿千瓦。一旦墨脱水电站建成，将会成为世界上发电总量最高的水电站，可以为我国每年省去8000万吨的标准煤，或者是4000万吨的石油，有利于我国实现2060年实现净零排放的承诺。"
 CHI_green_Great_Wall: "绿色长城"
 CHI_green_Great_Wall_desc: "我国北部的边疆是一片荒凉、恶劣、广袤的土地，不仅阻碍了当地社会的发展，也导致了我国严重的气候自然灾害。三北防护林工程是一项自1979年就开始规划施行的大型人工林业生态工程，目的在于改善当地恶劣的自然条件。我们当然要继续建设这一规模巨大的工程。"
 CHI_green_ecological_reconstruction: "生态改造工程"
 CHI_green_ecological_reconstruction_desc: "我们将彻底完成生态文明建设，努力建设美丽中国，真正实现中华民族永续发展。"
 CHI_OGAS_Increase: "先进自动化系统"
 CHI_OGAS_Increase_desc: "量子计算机的使用和大规模分布式计算模块的部署以及先进人工智能的成功，让我们得以用一种前所未有且难以想象的方式将全部经济活动都容括在系统内进行精确控制。"
 CHI_shopping_basket_program: "完善“菜篮子工程”"
 CHI_shopping_basket_program_desc: "“菜篮子工程”是为缓解副食品供应偏紧的矛盾而诞生一项计划。通过建立新的肉、蛋、奶、水产和蔬菜生产基地及完善良种繁育、饲料加工等服务体系，以保证居民一年四季都有新鲜蔬菜吃。进入21世纪后，我们要继续推进并完善此项工程。"
 #进入21世纪，“菜篮子工程”的主要目标任务为：以优化结构、提高“菜篮子”产品质量和增加农民收入为中心，以深化改革、扩大开放和加快推进农业现代化为动力，实现“菜篮子工程”与生态环境协调发展，努力提高城乡居民的生活质量。
 CHI_green_food_project: "推进“三绿工程”"
 CHI_green_food_project_desc: "“三绿工程”是指提倡绿色消费，培育绿色市场，开辟绿色通道，以提高食品质量，维护消费者利益。"
 CHI_The_Russia_Link: "联络俄罗斯"
 CHI_The_Russia_Link_desc: "至少目前为止，俄罗斯仍然是我们在北方可以利用的对象。"

##############shortcut
 CHI_Peoples_Liberation_Army_shortcut: "军事现代化"
 CHI_laborer_rights_and_interests_shortcut: "完善劳动法"
 
######覆盖
 CHI_Agriculture: "农业进步"
 CHI_Agriculture_desc: "农业仍然是许多非洲经济的一个重要部门，而且是人民最依赖的部门。我们应该支持农业部门，帮助工人个体在全球化的残酷国际竞争中竞争。"
 CHI_Social_Credit_Scheme: "现代化信用体系"
 CHI_Social_Credit_Scheme_desc: "社会信用体系也称国家信用管理体系或国家信用体系。当前的信用评价系统十分低效，无法有效制止恶意负债行为，我们必须对其进行现代化。"
 CHI_Skynet: "天网系统"
 CHI_Skynet_desc: "维护公民的安全是我们首要的责任，天网系统将汇聚一个庞大摄像头网络，以监控并识别那些企图隐匿的犯罪嫌疑人，不论他们身处何处都将无处遁形。"

##事件##
#科技事件#
 chi_science.1: "神威工程"
 chi_science.1.t: "神威工程"
 chi_science.1.d: "为了研发超级计算机，中央秘密组建了一个专门科研小组，组长是一名共产党员，将代表科研团队时刻与中央保持联系，汇报工作进展和请求。为了掩人耳目，中央划拨给科研组的经费全部从党费中开拨，以公益开支的名目记账。\n\n这个科研组的成员全部由二三十岁的年轻男女组成，他们来自全国各地，是最顶尖的计算机领域科研人才。同建国初年研发原子弹的科学家一样，科研小组的成员全部隐姓埋名，断绝了与家人和社会的联系，隐藏在了十多亿芸芸众生和滚滚时代潮流之中。"
 chi_science.1.a: "向同志们敬礼"
 chi_science.2: "进展喜人"
 chi_science.2.t: "进展喜人"
 chi_science.2.d: "神威计算机科研小组组长发来电联，汇报了最近的科研进展，用组长的话来说是“进展喜人”。组长在消息中称，超级计算机目前已搭建起初步构架，上午成功进行了第一次运算。\n相信不久之后，我国自主研发的第一台超级计算机就要完工了。"
 chi_science.2.a: "太好了！"
 chi_science.3: "实验室爆炸！"
 chi_science.3.t: "实验室爆炸！"
 chi_science.3.d: "神威科研小组传来消息，小组实验室于上午发生爆炸并发生火灾，原因尚不明晰。科研小组许多人当时都在实验室里，直接受到爆炸碎片冲击，伤势严重。小组组长为了抢救纸质文件和受伤的组员，不顾其他组员阻挠冲进了火海。然而几秒钟后实验室发生了坍塌，组长和另一名受伤的组员最终壮烈牺牲在火场中。\n\n事后，工作人员清理牺牲的组长的遗物时，在一本翻旧的毛泽东选集里发现了他早已写好的遗书，在遗书中，他要求科研工程结束后将自己的遗体火化，洒向大海。"
 chi_science.3.a: "同志，一路走好"
 chi_science.4: "美国间谍"
 chi_science.4.t: "抓获美国间谍！"
 chi_science.4.d: "神威科研小组的安保人员今天抓住了一个把自己隐藏成清洁人员的美国间谍。这个间谍长期蛰伏在实验室，摸清了守卫的换防名单和时间，抓住一个微妙的间隙进入实验室。在被识破时，这个间谍意图吞下藏在袖口的自杀药物，幸而被一名身后的科研组成员及时扑倒控制住，这名科研人员随后被身下的间谍开枪打中腹部，子弹贯穿了他的肝脏，因此身受重伤。据初步审问，上次实验室爆炸是另一美国间谍所为，实验基地里还潜伏着多个间谍。"
 chi_science.4.a: "让国安部门加强安保！"
 chi_science.5: "神威蓝光超级计算机研发成功!"
 chi_science.5.t: "神威蓝光超级计算机研发成功!"
 chi_science.5.d: "今天，神威科研小组发来消息，称科研工作圆满结束，我国已经成功研制出国产的第一台超级计算机。神威系统每秒能进行约1千万亿次运算，据科研小组推测，这台国产超级计算机很可能排在世界最快的10台计算机之列。更为重要的是，该系统采用的8700片神威1600微处理器是由我国的一家计算机研究所设计、在上海制造的。\n\n科研小组给计算机起的实验代号为“神威蓝光”超级计算机，现在小组向中央请求为超级计算机定名。"
 chi_science.5.a: "好，就叫神威蓝光！"
 chi_news.10: "中国自主研发出第一台超级计算机"
 chi_news.10.t: "中国自主研发出第一台超级计算机"
 chi_news.10.d: "今天，一台名为“神威蓝光”的计算机被安装在山东省的中国国家超级计算济南中心。神威系统每秒能进行约1千万亿次运算，很可能排在世界最快的20台计算机之列。更为重要的是，该系统采用的8700片神威1600微处理器是由中国的一家计算机研究所设计、在上海制造的。\n\n中国比美国、韩国和日本等世界技术领先者使用的最先进的芯片制造技术落后三代，然而却独立研发出了超级计算机，世界超级计算机TOP500项目领导者、美国田纳西大学计算机科学家杰克·唐加拉评论说：“这有点儿令人吃惊。”唐加拉博士称，神威蓝光LINPACK效率为74%，与美国最快的计算机美洲虎超级计算机效率相当。"
 chi_news.10.a: "他们自己弄出了超级计算机？"
 chi_news.10.b: "我们是最棒的！"
 chi_science.6: "国务院向全国人大常委会提出法律案"
 chi_science.6.t: "国务院向全国人大常委会提出法律案"
 chi_science.6.d: "国务院已经起草了一份在全国构建全国自动化系统的法律案，交由全国人大常务委员会审议，如若能获得常委会的认可，就可以继续向提请全国人大审议立法推行。"
 chi_science.6.a: "（转国务院提出法律案）"
 chi_science.7: "《中华人民共和国全国自动化系统建设法》提案"
 chi_science.7.t: "《中华人民共和国全国自动化系统建设法》提案"
 chi_science.7.d: "提升城市治理现代化水平，需要不断加快智慧城市建设步伐，让城市治理更智能、更高效、更精准，更好服务城市高质量发展、高效能治理、高品质生活。为响应高质量发展策略，经由经济和信息化委员会研究，国务院已草拟构建全国自动化系统建设的方案，现交由全国人大常务委员会审议，内容如下：\n\n一、强化数字基建、数据融通。加速建设以5G、数据中心等为代表的数字信息基础设施，同步推动城市建筑、道路桥梁、电力燃气等公共设施数字化智能化改造，提升城市物理空间安全管理和安全风险态势感知能力。推动城市规划、建设、管理、运维全过程各环节数据融通，构建省级统筹的城市运行和治理智能中枢，打造城市共性支撑平台。\n\n二、注重精细治理，提高服务质效。探索“大综合一体化”城市综合治理，优化综合场景和特色应用，构建职能清晰、协同高效、安全有序、多元参与的城市综合治理新格局。加快推进“高效办成一件事”基本覆盖城市公共服务高频事项，通过精简环节、优化流程不断提升“一网通办”效能，推动公共服务从“能办”向“好办”转变。\n\n三、创设中央网络中心，用以连接约200个位于其他主要城市的中级中心以及约20000个位于经济和生产重要部门、重要企业的终端。任何信息系统的实施都必须具有相应的连续性，建立一个没有部门和部级的自动化形式的全国系统，这将需要让整个国家一次性过渡到一个新的国民经济管理方式，经济和信息化委员会认为这难以实现。通过逐步建设并合并在各地建立的信息系统，以此来建立一个全国性的计算机网络中心，与一次性建立一个庞大信息系统相比更加具有可行性。\n\n四、设立全国自动化系统建设委员会，负责执行和监督全国自动化系统建设工作，对接以国务院为代表的中央人民政府和各地政府、生产部门，以嵌入式方式深入各地基层第一线，要求在尽可能不影响社会经济生产的情况下，逐级逐步地建设起一套由全国自动化系统建设委员会控制的全国自动化系统。"
 chi_science.7.a: "署名：国务院"
 chi_science.8: "全国人大常委会驳回法律案"
 chi_science.8.t: "全国人大常委会驳回法律案"
 chi_science.8.d: "对国务院《中华人民共和国全国自动化系统建设法》提案的审议意见:\n\n经全国人大常委会会议讨论，对该案予以驳回。\n\n一、该方案耗资太甚，初步规划总耗资将是年度财政收入的十四倍，建设成果效益恐难以弥补成本。\n\n二、对社会稳定有不可预计的影响，计算机大数据计算控制下的社会生产可靠性和安全性难以保障。\n\n三、方案没有明晰对企业等市场主体的处理方式，企业不会配合政府或者计算机对企业运行控制权的取代。\n\n综上，方案出发点很好，但是不可行。\n\n\n署名：全国人民代表大会常务委员会"
 chi_science.8.a: "再想想办法吧……"
 chi_science.9: "《中华人民共和国全国自动化系统建设法》二次提案"
 chi_science.9.t: "《中华人民共和国全国自动化系统建设法》二次提案"
 chi_science.9.d: "结合全国人大常委会指导意见，经由经济和信息化委员会研究，国务院已草拟构建全国自动化系统建设的修订方案，现交由全国人大常务委员会审议，内容如下：\n\n一、设立特区进行试点，首先应该列入的应为深圳、上海或者雄安新区。自动化系统建设涉及维度、领域过广，需要尽可能控制影响范围，经济特区或新区本应承担经济工作试验责任。\n\n二、中央网络中心交由全国自动化系统与集成标准化技术委员会控制，如若需要调控或造成严重影响，全国自动化系统与集成标准化技术委员会和中央政府有权立刻关停项目，以确保社会经济工作稳定。\n\n三、全国自动化系统对市场主体企业起到服务和指导作用，不涉及对企业所有权和控制权的干涉，这是优化营商环境，向服务型政府转变的重要举措。"
 chi_science.9.a: "署名：总书记、国务院"
 chi_science.10: "全国人大常委会审议通过法律案"
 chi_science.10.t: "全国人大常委会审议通过法律案"
 chi_science.10.d: "对国务院《中华人民共和国全国自动化系统建设法》提案的审议意见:\n\n经全国人大常委会会议讨论，为贯彻执行总书记的决定，对该案予以通过。\n\n现提请全国人大审议，将法律草案发给人大代表，于30日后临时召集全国人民代表大会会议审议该案。\n\n\n署名：全国人民代表大会常务委员会"
 chi_science.10.a: "很明显他们看到了总书记的签名"
 chi_science.11: "全国人民代表大会全体会议召开"
 chi_science.11.t: "全国人民代表大会全体会议召开"
 chi_science.11.d: "全国人民代表大会于今日召开全体会议，听取提案人即国务院方面作关于《中华人民共和国全国自动化系统建设法》法律草案的说明。来自五湖四海的人大代表齐聚一堂，各代表团全体会议或小组会议对法律草案进行了当场审议投票，最后法律案获得了三分之二以上的同意票。\n\n宪法和法律委员会根据各代表团的审议意见，对法律案进行统一审议，最后对法律案予以通过。\n\n全国人民代表大会在会议上决定将《中华人民共和国全国自动化系统建设法》执行和监督的任务交由国务院负责。"
 chi_science.11.a: "全国人大给予了我们工作上的支持"
 chi_news.26: "中国启动OGAS工程"
 chi_news.26.t: "中国启动OGAS工程"
 chi_news.26.d: "今日，中国政府已完成在大都市雄安新区进行的OGAS智慧城市建设工程。OGAS，即All-State Automated System（全国自动化系统），在上世纪由苏联科学家格卢什科夫提出，曾一度得到苏联政府的重视，但该方案最后被放弃。\n\n据悉，目前雄安新区的政府部门已经完成了信息化适配，政府大楼内只有少数值班的公务员，一切都交由智慧系统托办。在雄安的写字楼内，每一层都有巨大的超算交互屏供人们集中使用；在雄安的自动化工厂里，每个车间都连接上了军用级别的5G网络系统，用以收集车间生产数据和调控车间生产。这些数据将汇总到位于北京的网络中心，由中央超级计算机统一计算、调控和发送执行建议。"
 chi_news.26.a: "不可思议的工程"
 chi_news.26.b: "科学技术是第一生产力"
 chi_science.12: "墨脱水电站考察团"
 chi_science.12.t: "墨脱水电站考察团"
 chi_science.12.d: "专家认为，墨脱发电站有可能是有史以来风险最大、难度最高的水电基础设施。\n\n墨脱所在的山区群山环绕，与世隔绝，不仅容易发生大规模的山体滑坡和泥石流，而且还位于脆弱的地震带边缘，强烈的地震和地应力可能会严重影响发电站以及其他建筑物的安全稳定。再加上青藏高原地区脆弱的生态环境，需要在修建墨脱水电站的同时尽可能地减少工程对当地植被和野生动物的影响，这对施工提出了极为苛刻的要求。\n\n此外，墨脱水电站的规划地址人烟稀少，山路崎岖，对外交通极为不便，施工团队很难将建设材料和相关物资运送进去，在水电站开工之前还需要修建完善的交通道路。地形和地理位置还对将来水电站的巨型电网远距离输配电规划提出了挑战。水电站产出的电能需要输送到遥远的人口密集地区，以供人们生活和工厂生产使用，而目前中国的高压远距离输电能力尚未成熟，这些都是水电站的规划建设需要解决的问题。\n\n因此，墨脱水电站项目必须考虑到多方面因素，统筹兼顾谨慎规划，这也是项目如今仍未正式启动的原因。从长远的发展角度来看，水能资源具有重要战略价值，蕴含巨大的经济和环境效益，墨脱水电站的建设即使再复杂再困难也是十分有必要的。\n\n为了完美建设这一超级工程，我们组建了一支考察团队，专项负责墨脱水电站的勘测与设计。这支团队于昨日已经在北京接受了总书记和总理的检阅，现在出发前往遥远而与世隔绝的墨脱。"
 chi_science.12.a: "加油，同志们"
 chi_science.13: "墨脱游记·其一"
 chi_science.13.t: "墨脱游记·其一"
 chi_science.13.d: "“莲花圣地，秘境墨脱”\n\n墨脱县位于西藏东南部的林芝市，是中国最后一个通公路的县，被誉为“西藏的西双版纳”、“植被类型的天然博物馆”。\n\n上周接到中央命令，要跟老顾来墨脱考察水电站项建设规划。本以为坐个飞机就能直达，没想到休整了几天后，竟然一口气坐了两天的大巴在山路上绕来绕去，团队里有几个晕车的人连着吐了两天。不过，那样云雾缭绕的冰山到底是怎么修好公路的？\n\n到达墨脱以后，我们先去吃午饭。为了节约时间，我们在一家兰州拉面馆吃面。面馆不大，顾客倒不少，都是游客。老顾吃不惯面，要了一碗炒饭，其他南方同事也没有吃面。我吃了一碗牛肉面，果然跟其他地方的兰州拉面一样牛肉薄得像纸。不过汤还挺好喝的，据说加了墨脱这边特产的一种香料。\n\n吃完饭出发去墨脱境内的两个雅鲁藏布江大拐弯，老顾说，1994年时候我国科学家向世界宣布了一项重大的地理发现:中国西藏雅鲁藏布江下游大拐弯峡谷是世界第一大峡谷，其深度远超过原认为最深的秘鲁科尔卡峡谷(深3200米)，长度也超过原认为世界最长的美国科罗拉多峡谷(长440公里)。想不到小小一个墨脱竟然如此别有洞天。\n\n这地方峡谷险峻，江水湍急，在群山的环绕下，犹如巨龙在此突然转向。我们就这么跟着水之巨龙向着下游开进。森林郁郁葱葱，云雾山间缭绕，与大峡谷相映生辉，构成了一幅美不胜收的峡谷奇景，很像梦里的情景——不，比梦里还要壮丽。半路休息的时候，老顾跟我说，墨脱热带雨林是地球最北端的热带雨林，是西藏高原海拔最低，最温和，雨量最充沛，生态保存最完好的地区，境内的雅鲁藏布大峡谷全长五百多公里，如果要建水电站，必须尽可能减少对当地生态的破坏，不能像三峡那样弄出许多毛病。"
 chi_science.13.a: "瞧瞧那些地上的小家伙，这是它们的家呀"
 chi_science.14: "墨脱游记·其二"
 chi_science.14.t: "墨脱游记·其二"
 chi_science.14.d: "林多大拐弯附近有很多漂亮的民居，既有藏区特色，又有一种南亚风味，木屋前有木柱支撑起的前廊，颜色上得很艳，像。虽然雅鲁藏布江就在眼前，但这里的居民还是习惯用盆和筒接雨水用，据说是因为河水湍急，一旦落入水中可能小命不保。\n\n雅鲁藏布江果果塘大拐弯位于墨脱县城12公里处的德兴乡境内，是墨脱最具代表性的景观，也是每一个到墨脱的人可以亲眼看到的风景，其壮丽程度让人叹为观止。雅鲁藏布江在果果塘这里盘了一个大弯，当地人也叫它蛇形弯。果果塘大拐弯因其俯瞰像一个棒棒糖，所以得名果果塘。果果塘大拐弯是雅鲁藏布江在流经墨脱时形成的自然奇观，因地形原因，湍流的江水遇到山峰的阻挡，围绕山峰来了一个180度的大转弯，形成了这一壮丽的自然景观。我给同事两口子拍了照片，他们很满意。老顾问我为什么还不结婚，我告诉他没钱付彩礼，而且跑测绘的人一年到头不落屋脚，难道让妻子守活寡吗。老顾摇头，看来应该是不信我说的。\n\n果果塘大拐弯附近的山上有当地人的茶园，他们平整了一小块山丘，砍掉树林后腾出一道道茶丘来种茶。我们在一个当地人开的小店里买了一些小玩意，老顾买了几斤本地柚子，我购得一顶藏民小帽。随后我们在当地老乡的店里吃了一顿墨脱石锅鸡，好在没有想象中那么贵。\n\n距离墨脱县城约6公里处有个墨脱藤网桥。藤网桥是墨脱早年间最重要的渡江通道之一，它是用当地森林里的滕竹编织而成。在墨脱没有桥的年代里，当地民众为了渡过水流湍急的雅鲁藏布江，想出了用滕竹编织桥梁的方法，他们将钢索的两端固定于两岸，再用粗细不等的藤竹编织在上面，就成了一个渡江的桥梁。藤网桥没有桥墩，也没有木板，人走在上面还随风左右摇摆，十分吓人，许多女同事不敢上桥。老顾拉着我在上面来回走了三回，又用测量仪记录了这个地方的水量。\n\n藤网桥附近有许多玛尼石堆，上面雕刻着看不懂的经文，不知是几多年前哪位虔诚的先人所垒。这些石堆可能在这静静呆了数十年亦或数百年，没有人去动他。老顾也垒了一个小的，我手笨垒不上，总是踏，于是找了块石头用刀刻了“墨脱水电科考团”字样放在老顾的石堆顶上，结果老顾的石堆也塌了。\n\n然后肩膀挨了老顾的拳头。"
 chi_science.14.a: "希望水电站不要像这石堆一样……"
 chi_science.15: "墨脱游记·其三"
 chi_science.15.t: "墨脱游记·其三"
 chi_science.15.d: "“每年，咱们解放军115医院都要派出全科医生组成的医疗小组进入墨脱值守，跟墨脱军民一起过9个月的封山期。115医院给当地人防病治病、送医送药，还帮扶不少墨脱医院和乡卫生院搞建设，长期免费培训基层医护人员，把最好的仪器设备、药品都优先给了墨脱。这儿的乡亲们把‘金珠玛米’医生认作天下最好的‘门巴’，金珠玛米就是‘菩萨兵’，‘门巴’是大夫的意思。”一个和我们同行的小战士跟我讲了这些。他是本地的驻藏部队一员，和其他四个同志一起负责给科考团当探路员和护卫。随行的还有几个测绘兵，负责记录此前没有发现的地理信息。\n\n老顾身上被蚊虫咬了好大几个肿包，一直找我要止痒膏，但他明显更关心别的事情。“印度佬应该不会突然冒出来吧？被他们缠上就不好了。”\n\n“按理来说他们应该不会往雨林里头钻，但是不排除这种可能吧，他们也经常溜过来不知道搞些什么名堂。”小战士摇摇头，顺手把前方的一处草丛砍倒。\n\n“停一下！有人受伤了！”后面传来同事的呼喊。\n\n老顾和小战士闻讯很快往回赶去，我正欲往回走，结果被脚下一滩烂泥摆了一个踉跄，好容易才站起来，抬起头，忽然瞥见侧后方的山上正在往下像冲水似的涌下半液体状的东西。\n\n是泥石流。在墨脱，你随时随地都能碰见突然形成的泥石流。\n\n“泥石流！快转移！快点儿！”我拼命呼喊，转身拉着旁边几个同事撤离。由于丛林中草丛林木密布，解放军巡逻走出来的山路十分狭窄，团队的人无法并排通过，只能单向撤离。我心中一直在担心老顾和小战士的安危，却又无法回去确认，只能走在前面带团队离开山谷。\n\n回到驻地后清点人数，发现老顾和小战士不在团队里，几名考察团成员也不知去向。"
 chi_science.15.a: "展开搜救！"
 chi_science.16: "墨脱游记·其四"
 chi_science.16.t: "墨脱游记·其四"
 chi_science.16.d: "老顾喜欢在悬崖边探头探脑，我从前问过他到底是在看些啥，他说他有看一眼就能看出悬崖高度的本事，多看看，本事才不会忘。\n\n上次泥石流爆发，老顾、小战士和几个同事眼疾手快，撤出了泥石流覆盖区，但是撤离的路被堵死了，只能在丛林里另寻出路。当时我们搜查到第二天早上，突然发现坡下面有个站着撒尿的人，定睛一看才发现是老顾。好在那个受伤的同事只是被乱石划破了脚，并没有出什么大问题，否则这种地方根本不可能进来救护车，要开山急救的话肯定会惊动印度人。\n\n我问老顾这水电站建在印度头顶上，他们不会急眼吗。老顾把头从悬崖边缩回来，说印度肯定不同意用大坝把他们的“布拉马普特拉河”给堵了，到时候估计想方设法要使绊子，眼下赶紧完成测绘设计最重要，不能让他们提前发觉。老顾催促其他同事赶紧架好设备，此处相当适合作为大坝蓄水库。\n\n眼前是一个巨大的陡坡，一向只走平缓地方的雅鲁藏布江却选了这么个地方往下流。“如果不出意外，应该最后就是在这修了。这里往上游走有将近2000米的落差，一路上能够设置好几座阶梯水电站，放得下50多台70万千瓦的机组，最后总装机不会小于三千万千瓦，能比三峡发的电还多。这里最合适。”，老顾严肃地说。\n\n我把之前在墨脱县城里买的毛主席吊坠挂在旁边的一处凸石上，让他老人家也看看这处风水宝地。现在毛主席也能看见这里了，看看咱们挑的地方，我对老顾说。老顾笑笑，回身从包里掏出一小座金色的毛主席像，放在一块突起的平台石上。\n\n金色塑像的双眼在墨脱的日光照耀下，熠熠生辉。"
 chi_science.16.a: "“神女应无恙，当惊世界殊”"
 chi_news.22: "中国启动墨脱水电站建设工程"
 chi_news.22.t: "中国启动墨脱水电站建设工程"
 chi_news.22.d: "今日，中国政府继从印度手中夺取藏南地区后，启动了在藏南地区修建墨脱水电站的工程。\n\n该水电计划站在雅鲁藏布江大峡谷（大拐弯）上游汇集了尼洋河径流量达601亿立方米，使其在大峡谷中游雅江与其重要支流帕隆藏布-易贡藏布汇合，帕隆藏布与其支流易贡藏布流域面积2.89万平方千米，年径流量372.2亿立方米，出境处年径流量达1654亿立方米（墨脱县巴昔卡）。雅鲁藏布江大峡谷蕴藏了丰富的水力资源，大峡谷围绕着南迦巴瓦峰拐了个马蹄形大拐弯，大拐弯入口的派区（海拔2900多米）至墨脱背崩河段（海拔680米）长度约250公里，落差达2200多米。如开凿派区至墨脱的引水隧洞后，可引用近2000 m³/s的流量，可兴建装机容量达5000万kW的巨型水电站（大拐弯水电站），年发电量可以超过3000亿千瓦时，将超过目前同样在中国的世界最大水电站三峡的发电量。\n\n印度和孟加拉国称，中国为减少水资源短缺问题所做的努力现在已经以墨脱水电站工程的形式对他们构成威胁。布拉马普特拉河在中国被称为雅鲁藏布江，在这条河流上修建水电站有可能使下游成千上万的人民丧失其基本的水供应。印孟方面声称，尽管中国的决定已经显然带来了负面影响，但中国仍在向前推进这项工程，这样做损害了印度和孟加拉国公民的安全。"
 chi_news.22.a: "中国又要修建奇观了"
 chi_news.22.b: "我们一定可以完成工程"
 chi_news.22.c: "中国人继续考验我们的耐心……"
 chi_news.23: "中国完成墨脱水电站建设工程"
 chi_news.23.t: "中国完成墨脱水电站建设工程"
 chi_news.23.d: "经过将近四年的建设，中国于今天上午宣布正式完成了墨脱水电站的建设这一超级工程，该水电站超出预期地为中国提供了更多的电力，中国创造了另一个世界上最大的的水电工程。\n\n印度和孟加拉国坚称墨脱水电站对其国内造成了不可估量的负面影响，然而目前来看，墨脱水电站似乎反过来帮助这两国控制了布拉马普特拉河汛期的径流量。"
 chi_news.23.a: "令人震惊"
 chi_news.23.b: "我们做到了！"
 chi_news.23.c: "中国人继续考验我们的耐心……"
 chi_news.24: "中国完成三北防护林工程"
 chi_news.24.t: "中国完成三北防护林工程"
 chi_news.24.d: "中国政府宣布，经历数年建设后，其规模、耗资浩大的三北防护林工程于今日建设完毕，整个中国北部的荒山、沙漠地带已全部完成科学绿化改造，这将为中国北方气候改善做出巨大贡献。\n\n评论家指出，这是中国又一世界级工程的胜利，将为人类改善地球环境带来先进经验和技术范本。"
 chi_news.24.a: "了不起"
 chi_news.24.b: "美丽的祖国！"

#日本#
 riben_news.1: "日本首相小渊惠三死亡"
 riben_news.1.t: "日本首相小渊惠三死亡"
 riben_news.1.d: "周日凌晨，因中风脑出血送院的日本首相小渊惠三，病情急剧恶劣，日本电视台周一晚更引述医院消息人士称，小渊已告脑死亡，目前只靠仪器维持生命。按照宪法规定，倘若小渊死亡，日本须解散内阁，重选新首相，预料日本政局在短期内将陷入混乱之中。由於小渊几乎肯定无法再履行首相职，自民党已在讨论他的後继人选，目前最有可能当选的是自由民主党干事长森喜朗。"
 riben_news.1.a: "日本的政局会由此混乱下去吗？" 
 #日本政局长达十余年的“千禧混乱”开始了
 riben_news.2: "小泉纯一郎就任日本首相"
 riben_news.2.t: "小泉纯一郎就任日本首相"
 riben_news.2.d: "2月，日本一群高中生驾驶的“爱媛”号渔业实习船，在夏威夷海域被美国“格林维尔”号核潜艇撞沉，9人死亡。前日本首相森喜朗当时正在打高尔夫球，接到报告后一个半小时才回官邸。尽管森喜朗的解释有理有据，但各大媒体头版配的是森喜朗打高尔夫的大幅照片，这激起了民愤，导致日本内阁支持率降至前所未有的个位数（5.7%）。在野党民主党党魁鸠山由纪夫取笑说：“森喜朗内阁的支持率堪比日本的消费税率（5%）。”两个月后的今天，森喜朗被迫辞职。\n\n4月26日，小泉纯一郎凭借“改变自民党、改变日本”的竞选口号，以压倒优势当选自民党总裁，出任第87届内阁总理大臣，成为永田町首相官邸的新主人。"
 riben_news.2.a: "新世纪日本选出的第一位首相" 
 riben_news.3: "安倍晋三就任日本首相"
 riben_news.3.t: "安倍晋三就任日本首相"
 riben_news.3.d: "9月20日，日本自民党干事长代理以及党改革推进本部长安倍晋三当选自由民主党第21任总裁。9月26日，安倍晋三当选为第90代日本内阁总理大臣，成为首位战后出生、战后最年轻的首相。9月26日，前日本首相小泉纯一郎结束了自己的任期，卸任日本内阁总理大臣一职，由安倍晋三接任。"
 riben_news.3.a: "战后世代的首相" 
 riben_news.4: "福田康夫就任日本首相"
 riben_news.4.t: "福田康夫就任日本首相"
 riben_news.4.d: "7月29日，日本首相安倍晋三领导的自民党于日本参议院选举中大败，是为自民党立党52年间，第一次在参议院成为第二大党，首次失去参议院的控制权。8月27日，安倍晋三改组内阁，但仍有多名阁员因丑闻及失言辞职，安倍内阁支持度持续下滑。9月12日，安倍晋三宣布因个人健康的原因辞去首相一职，暂停政治活动。\n\n9月23日下午，日本执政党自民党召开两院议员大会，该党所属国会议员和各地方支部代表进行了新总裁选举。最终前官房长官福田康夫（71岁）击败党干事长麻生太郎（67岁），当选为第22任自民党总裁。福田共获得330票，麻生为197票。9月25日召开的众议院全体会议上，福田康夫当选为第91任首相，替代现任首相安倍晋三（53岁），并于当天组建新内阁。福田康夫是日本前首相福田赳夫的长子，因此日本首次诞生了父子两代首相。"
 riben_news.4.a: "福田家的好儿子" 
 riben_news.5: "麻生太郎就任日本首相"
 riben_news.5.t: "麻生太郎就任日本首相"
 riben_news.5.d: "2008年9月1日晚，日本首相福田康夫在首相官邸宣布辞职，震惊日本全国。福田表示，自己经过各方考虑于上周末做出这一政治决定。与前首相安倍晋三因健康原因突然辞职不同，他的健康没有问题。他称下台是为了避免在这个世界第二大经济实体的国家出现“政治真空”。他希望自己的辞职能打破日本两党对立的政治僵局。福田在新闻发布会上说：“如果我们优先考虑人民生活，就不能让政治上的讨价还价造成政治真空。我们需要一个新团队实施我们的政策。”\n\n在福田康夫宣布辞职之后，自民党总裁选举管理委员会2008年9月2日下午召开会议决定，9月10日正式发布选举公告，9月22日进行投票选举。这就意味着，日本新首相人选9月22日将水落石出，而已接连在两次选举中败北的麻生太郎将卷土重来，有望一尝夙愿。麻生太郎与其他四位候选人一同角逐自民党总裁，在527票中获得351票，以绝对优势战胜与谢野馨、小池百合子、石原伸晃和石破茂。当选日本自民党第23任总裁，9月24日，麻生太郎出任第92届日本首相，开创了日本历史上第一个三代首相世家（外祖父吉田茂、岳父铃木善幸和麻生太郎）。民主党代理代表菅直人讽刺道：“在自民党，只有首相的孙子或儿子才能当首相嘛。”"
 riben_news.5.a: "纨绔公子" 
 riben_news.6: "鸠山由纪夫就任日本首相"
 riben_news.6.t: "鸠山由纪夫就任日本首相"
 riben_news.6.d: "8月30日，日本第45届众议院大选揭晓，民主党一举夺得308个席位，净增193个，而自民党则由300个减为119个，众多的老牌政治家纷纷落选，自民党自1955年成立以来首次失去在众议院第一大党的地位。2009年8月30日，鸠山由纪夫带领民主党在众议院选举中取得历史性的胜利，终结了自民党长期的执政地位。9月16日，日本民主党代表（即党首）鸠山由纪夫在举行的日本特别国会首相指名选举中当选为日本新首相。当天下午，日本国会众参两院先后召开全体会议，举行首相指名选举。在首先举行的众议院投票中，鸠山获得过半数的327票；在随后进行的参议院投票中，鸠山也获得过半数的124票。鸠山因此当选日本第93任首相。9月26日，前首相麻生内阁全体辞职。"
 riben_news.6.a: "一位友善的绅士" 
 riben_news.7: "菅直人就任日本首相"
 riben_news.7.t: "菅直人就任日本首相"
 riben_news.7.d: "由于驻日美军普天间机场搬迁问题发酵，5月30日社民党宣布退出联合政府，鸠山内阁支持率跌至17%。6月2日，鸠山宣布辞职。年9月14日下午，日本民主党在东京召开临时党大会，就民主党下任党代表进行选举投票。会上，两位候选人民主党前干事长小泽一郎（68岁）与时任党首、首相菅直人（63岁）发表了最终演讲，随后由民主党所属众参两院国会议员进行投票。15时39分，民主党选举管理委员会宣布，小泽一郎获得491票，菅直人获得721票。国会议员的投票加上当天凌晨起开始计票的其它党员支持者及地方议员的“地方票”，三项投票统计结果显示，菅直人票数占据优势，战胜小泽一郎，成为该任民主党代表。菅直人因此当选日本第94任首相。"
 riben_news.7.a: "勤勤恳恳的平民首相"
 riben_news.8: "野田佳彦就任日本首相"
 riben_news.8.t: "野田佳彦就任日本首相"
 riben_news.8.d: "6月1日，日本三个在野党提出“内阁不信任案”，认为首相菅直人在地震后的救灾过程中表现不称职，要求其辞职。其后，日本政府5名副部长级高官于傍晚向菅直人首相集体提出了辞职申请，表示赞同“内阁不信任案”。8月26日，日本首相、民主党党首菅直人在民主党高层干部会上正式宣布辞去党首职务。当天，64岁的日本首相菅直人在作为其辞职条件的“公债发行特例法案”和“再生能源特别措施法案”获得参院全体会议通过后正式宣布辞去首相一职。前财务大臣野田佳彦担任新一届日本首相。9月2日上午10时，日本新首相野田佳彦第一次作为首相走进了首相官邸，并着手组阁工作。野田受到了官邸工作人员的列队欢迎，根据组阁流程。"
 riben_news.8.a: "松下幸之助的门徒"
 riben_news.9: "安倍晋三再次就任日本首相"
 riben_news.9.t: "安倍晋三再次就任日本首相"
 riben_news.9.d: "9月26日，日本前首相安倍晋三经过两轮党内投票，战胜竞争对手石破茂，当选第25任自民党总裁，成为首位回任的前自民党总裁。10月29日，安倍晋三领导掌控参议院的自民党在国会中拒绝了首相野田佳彦的施政演说，并且亲自联合自民党、公明党等7个在野党，逼迫野田佳彦尽快解散众议院。11月16日，安倍晋三在与时任首相野田佳彦的辩论会后表示，他全面支持首相野田佳彦关于削减议员人数的提案，尽最大努力促使该提案在2013年通常国会（即例行国会）中通过，因为野田佳彦已同意解散众议院。11月29日晚，安倍晋三作为自民党总裁，参加包括时任日本首相、民主党代表野田佳彦在内的党首众议院大选辩论，这也是日本历史上首次网络直播党首辩论，辩论的焦点集中在核电政策、经济、消费税增税及外交等问题上。12月25日，日本东京举行新党首选举，由民主党所属全体众议院议员和参议员议员投票选举了前经济产业相，海江田万里担任民主党新党首。据悉，野田领导的民主党在12月16日的大选中遭遇惨败，担任党首的野田随后宣布引咎辞职。12月16日，自民党在众议院选举大胜赢回执政权，安倍晋三确定将再次出任日本首相。12月26日，安倍晋三就任日本第96代首相。"
 riben_news.9.a: "日本政局长达十余年的“千禧混乱”就此结束了"
 riben_news.10: "菅义伟就任日本首相"
 riben_news.10.t: "菅义伟就任日本首相"
 riben_news.10.d: "2020年8月23日，安倍晋三累计连续在任首相天数达到2799天，超越日本前首相佐藤荣作，成为连续在任时间最长的日本首相。8月28日，安倍晋三为了避免因旧病恶化等导致影响国政，决定辞去首相一职，但会在新首相选出前继续任职。9月16日，安倍晋三正式卸任首相一职，在新任自民党总裁菅义伟及其他官邸职员的目送下离开了首相官邸。\n\n8月30日，菅义伟表示计划参选自民党总裁选举。8月31日，自民党党内最大派系细田派（98人）和麻生派（54人）基本决定支持菅义伟。9月2日，正式宣布参加自民党总裁选举。9月14日，菅义伟获得377票（总计534张有效选票），以绝对优势当选执政党自民党总裁。9月16日，日本国会众议院召集临时国会举行首相指名选举，执政党自民党总裁菅义伟当选日本第99任首相，并于当天组建新内阁，后前往皇居参加首相任命仪式和阁僚认证仪式。"
 riben_news.10.a: "上一个主持年号变更的首相是……"
 riben_news.11: "岸田文雄就任日本首相"
 riben_news.11.t: "岸田文雄就任日本首相"
 riben_news.11.d: "2021年9月3日，日本首相菅义伟在东京举行的自民党临时高层会议上表示，将不参加9月举行的自民党总裁选举。9月17日，日本自民党总裁选举正式发布公告，岸田文雄等4人为候选人。9月29日，日本自民党总裁选举进行投票，岸田文雄获257票，领先河野太郎87票，以明显优势胜出，成功当选自民党第27任总裁，按惯例将接替菅义伟出任首相职务。10月4日，日本召开临时内阁会议，菅义伟内阁在会上全体辞职，岸田文雄正式当选为日本第100任首相，随后，首相任命和内阁大臣认证仪式在日本皇宫举行，新内阁正式成立。当天晚上，岸田文雄在首相官邸举行了就任后的首场记者会，在记者会上，正式宣布将于10月14日解散众议院，于10月31日进行下届众议院选举投票。"
 riben_news.11.a: "等我当上国王，我会制定新的税法！"
 riben_news.12: "秋筱宫悠仁亲王出生"
 riben_news.12.t: "秋筱宫悠仁亲王出生"
 riben_news.12.d: "日本皇嗣秋筱宫文仁亲王之子秋筱宫悠仁亲王于日本时间2006年9月6日上午8:27在东京爱育医院剖宫产出生（协调世界时间是9月5日23:27），身长48.8厘米，体重2558公克（5.64磅）。这是是继其父秋筱宫文仁亲王于1965年出生后41年以来，日本皇室的第一名男丁。文仁亲王在“命名之仪”中将长子命名为“悠仁”（日本语：ひさひと），意为“希望孩子悠然地走过长久的人生”。\n\n自从秋筱宫文仁出生以后，日本皇室就一直没有男性后裔出生，这带来非常严重的继承问题。因为日本天皇明仁之两名嫡子，长子皇太子德仁及次子秋筱宫文仁，在此之前皆没有男性子嗣，所以悠仁的出生对日本皇室的传承来说非常重要。悠仁的出生，暂时消除了天皇皇统断绝的危机，也让皇室典范修改提案自此束之高阁。皇位继承人的诞生，使“帝王学”一词在日本又开始流行了起来。"
 riben_news.12.a: "下一任天皇"
 riben_news.13: "德仁天皇登基"
 riben_news.13.t: "德仁天皇登基"
 riben_news.13.d: "2019年4月1日上午9点半，日本官房长官菅义伟在首相官邸组织召开了专家会议。菅义伟听取众院议长大岛理森和参院议长伊达忠一等人的意见。之后，日本前首相安倍晋三召开全体内阁成员参加的内阁会议，听取阁僚意见，最终决定“令和”被选为日本新年号，同时年号候补还有英弘、广至、万和、万保、久化（英弘选自日本古书，广至选自诗经和日本书纪，万和、万保、久化均是出自中国古书）。\n\n4月30日，日本明仁天皇退位成为太上天皇，5月1日，皇太子德仁即位为新天皇，成为第126代天皇，日本正式启用新年号“令和”，日本正式进入“令和”时代。在“即位礼正殿之仪”上，德仁誓言亲近国民、遵循日本宪法并希望世界友好和平，时任日本首相安倍晋三代表日本全体国民向德仁天皇即位致贺词。"
 riben_news.13.a: "于时，初春令月，气淑风和"
 riben_news.14: "安倍晋三遇刺"
 riben_news.14.t: "安倍晋三遇刺"
 riben_news.14.d: "2022年7月8日上午11时30分左右，前日本首相安倍晋三在奈良市一座地铁站附近街头发表助选演讲，为参议院选举自由民主党候选人拉票，现场大约有30人。演讲开始一两分钟后，一名男子从安倍身后3米处向他开枪，安倍胸部和颈部中弹倒地。随后，安倍被救护车紧急送医，并由医用直升机转运至奈良县立医科大学医院。当地消防部门称，转运时安倍已失去意识，处于心肺功能停止状态。下午5点03分，日本前首相安倍晋三在遭到枪击后，因伤势过重不治身亡，终年67岁。\n\n据日本电视台报道，警方已逮捕名为山上彻也的嫌疑人。另据日本共同社最新消息，安倍枪击案中被捕的男子来自奈良市。另据日本《读卖新闻》报道，山上彻也是前日本海上自卫队队员。山上彻也供述，他所使用的枪支为“网上购买零件后，自己制作的手枪”。"
 riben_news.14.a: "别时方知此世间，花亦花来人亦人"
 riben_news.15: "石破茂就任日本首相"
 riben_news.15.t: "石破茂就任日本首相"
 riben_news.15.d: "2024年8月，日本首相、执政党自由民主党总裁岸田文雄宣布不参加9月举行的党总裁选举。8月18日，石破茂宣布参与竞选自民党总裁。这是他第五次参选自民党总裁。9月27日，自由民主党总裁选举第一轮投票结果公布，在第一轮投票中，9名候选人无人获得过半数选票，得票数位列前两位的高市早苗和石破茂进入第二轮投票；同日，石破茂自民党总裁选举第二轮投票中胜出，第二轮实际投票数为414张，其中有效选票数409张，石破茂最终以215票当选自民党第28任总裁。\n\n10月1日，日本岸田内阁在临时阁僚会议上集体辞职；同日，日本临时国会众议院和参议院对自民党总裁石破茂进行首相指名选举，石破茂分别在众议院、参议院获得过半票数，当选日本第102任首相，随后，石破茂组建内阁，并公布了内阁成员名单。10月3日，石破茂在首相官邸向大臣政务官颁发任命书，进行合影留念并出席首次大臣政务官会议。10月4日，石破茂在日本国会发表施政演说，从内政、外交、经济、民生等多方面阐述其执政主张。"
 riben_news.15.a: "一身反骨的他也当上首相了？"
 riben_news.16: "德仁天皇宣读和平诏书"
 riben_news.16.t: "德仁天皇宣读和平诏书"
 riben_news.16.d: "中华人民共和国结束对日本的占领后，日本天皇德仁于今日宣读诏书，宣布中日两国将永保和平，互不侵犯领土主权，日本国会将于制定新宪法后将权力归还于天皇，日本皇室将履行保护本国国民的承诺，并永久放弃发动战争的权力。\n\n观察家认为，这标志着中华人民共和国对日本的管辖正式成立。这位战后出生的天皇将如何处理自己与历史的关系目前还不得而知。"
 riben_news.16.a: "第二次大政奉还"
 riben_news.17: "悠仁天皇宣读和平诏书"
 riben_news.17.t: "悠仁天皇宣读和平诏书"
 riben_news.17.d: "中华人民共和国结束对日本的占领后，日本天皇宣布退位，秋筱宫悠仁亲王继位成为新日本天皇，并于今日宣读诏书，宣布中日两国将永保和平，互不侵犯领土主权，日本国会将于制定新宪法后将权力归还于天皇，日本皇室将履行保护本国国民的承诺，并永久放弃发动战争的权力。\n\n观察家认为，这标志着中华人民共和国对日本的管辖正式成立。这位天皇资质平平，无法胜任统治者一职，据说他已经将政务交给几位元老处理了。"
 riben_news.17.a: "第二次大政奉还"
 riben_news.18: "佳子天皇宣读和平诏书"
 riben_news.18.t: "佳子天皇宣读和平诏书"
 riben_news.18.d: "中华人民共和国结束对日本的占领后，日本天皇宣布退位，秋筱宫佳子内亲王继位成为新日本天皇，并于今日宣读诏书，宣布中日两国将永保和平，互不侵犯领土主权，日本国会将于制定新宪法后将权力归还于天皇，日本皇室将履行保护本国国民的承诺，并永久放弃发动战争的权力。\n\n观察家认为，这标志着中华人民共和国对日本的管辖正式成立。这是日本历史上第九位女天皇，也是德川幕府时代结束后的第一位女天皇，其聪颖、温婉、勤勉的性格注定了她将是一位爱护人民的天皇。"
 riben_news.18.a: "第二次大政奉还"
 riben.14.t: "投降？"
 riben.14.d: "随着我国大部分城市以及首都均被[CHI.GetName]占领，继续抵抗似乎不是明智的选择..."
 riben.14.a: "别无他法，宣布投降。"
 riben.14.b: "我们永不放弃！"
 riben.15: "日本的命运"
 riben.15.t: "日本的命运"
 riben.15.d: "日本当局已经放弃抵抗投降，现在我们可以决定如何处理这个国家。"
 riben.15.a: "建立一个忠心的日本"
 riben.15.b: "占领日本"
 riben.15.c: "派王毅担任特首"
 riben.16: "天皇的人选？"
 riben.16.t: "天皇的人选？"
 riben.16.d: "我们可以通过表面上把政权从日本国会交付给天皇的方式夺取日本的政权控制，选择有如下几个人选，应该选择谁当天皇呢？"
 riben.16.a: "让愿意正视历史的德仁当天皇"
 riben.16.b: "让圣质如初的悠仁亲王当天皇"
 riben.16.c: "让温婉贤淑的佳子公主当天皇"
 

#南海#
 chi_south_china_sea_GR.0.t: "南沙群岛谈判"
 chi_south_china_sea_GR.0.d: "[CHI.GetName]要求我们承认他们对于南沙群岛的主权，并撤出当地驻军，作为补偿他们将支付一些经济产能帮助我们发展经济，并分享今后南沙群岛上勘探到的石油。"
 chi_south_china_sea_GR.0.a: "我们欣然接受"
 chi_south_china_sea_GR.0.b: "这绝不可能！"
 chi_south_china_sea_GR.1: "越南来电"
 chi_south_china_sea_GR.1.t: "越南来电"
 chi_south_china_sea_GR.1.d: "经过我们长期的外交运作和友好试探，越南政府表示愿意承认中华人民共和国对南沙群岛西部和西沙群岛的主权，并撤出越南驻军。同时，越南政府提出与我们分享今后南沙群岛上勘探到的石油，并请求我们支付越南此前已开展到一半的海上石油勘探工程费用。"
 chi_south_china_sea_GR.1.a: "我们当然同意，中越友好长存"
 chi_south_china_sea_GR.2: "菲律宾来电"
 chi_south_china_sea_GR.2.t: "菲律宾来电"
 chi_south_china_sea_GR.2.d: "经过我们长期的外交运作和友好试探，菲律宾政府表示愿意承认中华人民共和国对南沙群岛东部和中沙群岛的主权，并撤出菲律宾驻军。同时，菲律宾政府提出与我们分享今后南沙群岛上勘探到的石油，并请求我们支付菲律宾此前已开展到一半的海上石油勘探工程费用。"
 chi_south_china_sea_GR.2.a: "我们当然同意，中菲友好长存"
 chi_south_china_sea_GR.3: "马来西亚来电"
 chi_south_china_sea_GR.3.t: "马来西亚来电"
 chi_south_china_sea_GR.3.d: "越南和菲律宾的经验在先，马来西亚同样表示愿意承认中华人民共和国对南沙群岛南部的主权，并撤出马来西亚驻军。同样的，马来西亚政府提出与我们分享今后南沙群岛上勘探到的石油，并请求我们支付他们此前已开展到一半的海上石油勘探工程费用。"
 chi_south_china_sea_GR.3.a: "我们当然同意，中马友好长存"
 chi_south_china_sea_GR.10.t: "南沙群岛谈判遭到拒绝"
 chi_south_china_sea_GR.10.d: "[FROM.GetName]拒绝了我们对于南沙群岛的主权，我们必须得做点什么！"
 chi_south_china_sea_GR.10.a: "敬酒不吃吃罚酒"
 chi_south_china_sea_GR.10.b: "日后再做打算"

 chi_south_china_sea_GR.100.t: "[FROM.GetName]控制了[MDGR_maritime_boundary_state.GetName]"
 chi_south_china_sea_GR.100.d: "由于[FROM.GetName]在该地区毫无质疑的影响力，在近期的海上边界谈判之中，对方的领土主张赢得了国际社会的支持，[MDGR_maritime_boundary_state.GetName]目前已经被他们所控制，且我们失去了对该地区主张的合法性，我们对此几乎没什么办法。"
 chi_south_china_sea_GR.100.a: "真是可恶！"
 chi_south_china_sea_GR.100.b: "我们必须讨回公道！"

#东海#
 chi_east_china_sea_GR.1: "中国在东海进行了挑衅性舰队演习！"
 chi_east_china_sea_GR.1.t: "中国在东海进行了挑衅性舰队演习！"
 chi_east_china_sea_GR.1.d: "为了维护对钓鱼岛的主权，中国下令在钓鱼岛和冲绳水域进行挑衅性的舰队演习。我们应该考虑动用我们的海军进行航行自由行动，向世界表明这些水域属于国际社会，而不是中国。"
 chi_east_china_sea_GR.1.a: "我们承受不起与中国的对抗..."
 chi_east_china_sea_GR.1.b: "我们应该维护航行自由！"
 chi_east_china_sea_GR.2: "美国人和日本人正在钓鱼岛附近进行侵略性巡逻！"
 chi_east_china_sea_GR.2.t: "美国人和日本人正在钓鱼岛附近进行侵略性巡逻！"
 chi_east_china_sea_GR.2.d: "作为对我们在钓鱼岛水域完全合法的舰队演习的回应，美国人率领日本海上自卫队以一种咄咄逼人但毫无意义的举动进入了我们的主权水域。我们可以简单地等待美国人离开我们的水域，亦或我们可以通过向美国人展示我们海军的全部力量来维护我们对钓鱼岛的主权。"
 chi_east_china_sea_GR.2.a: "我们不应该在这个问题上冒战争的风险……"
 chi_east_china_sea_GR.2.b: "驱逐帝国主义者！"
 chi_east_china_sea_GR.3: "中国攻击了我们的航行自由巡逻！"
 chi_east_china_sea_GR.3.t: "中国攻击了我们的航行自由巡逻！"
 chi_east_china_sea_GR.3.d: "令人震惊的是，我们在东海海域的航行自由巡逻遭到袭击，我们的一艘船被击沉，多名美国军人阵亡。国内的人民强烈要求回应，但我们真的想因为一场小小的冲突而宣战吗？"
 chi_east_china_sea_GR.3.a: "我们不应使局势升级..."
 chi_east_china_sea_GR.3.b: "这种行为必须受到惩罚！"
 chi_east_china_sea_GR.4: "中国要求我们从冲绳撤军！"
 chi_east_china_sea_GR.4.t: "中国要求我们从冲绳撤军！"
 chi_east_china_sea_GR.4.d: "中华人民共和国要求我们从冲绳撤军，以保护他们不受“岛链”的威胁。这一要求无疑是中国准备拿日本开刀的前奏。如果我们撤出日本，中国与日本爆发冲突的可能性将大大增加。"
 chi_east_china_sea_GR.4.a: "荒诞至极"
 chi_east_china_sea_GR.4.b: "我们还是别趟这浑水了……"
 chi_east_china_sea_GR.5: "中国要求我们结束对冲绳的管辖！"
 chi_east_china_sea_GR.5.t: "中国要求我们结束对冲绳的管辖！"
 chi_east_china_sea_GR.5.d: "中国在国际上谴责我们，要求我们立马结束对冲绳的“非法占领”，让琉球“独立复国”。"
 chi_east_china_sea_GR.5.a: "让他们跟这些乡下的岛民跳舞去吧……"
 chi_east_china_sea_GR.5.b: "日本绝不能失去冲绳！"
 chi_east_china_sea_GR.6: "美国人从冲绳撤军！"
 chi_east_china_sea_GR.6.t: "美国人从冲绳撤军！"
 chi_east_china_sea_GR.6.d: "据驱逐舰队观测，今天早上美国冲绳驻军今天已陆续撤离军事基地，大门外是惊呼喝彩的冲绳居民。"
 chi_east_china_sea_GR.6.a: "快滚吧"
 chi_east_china_sea_GR.7: "美国无视了我们的要求"
 chi_east_china_sea_GR.7.t: "美国无视了我们的要求"
 chi_east_china_sea_GR.7.d: "美国无视了我们要求其撤出冲绳基地的威胁，并加大了对冲绳基地的军械运输。"
 chi_east_china_sea_GR.7.a: "帝国主义野心不死……"
 chi_east_china_sea_GR.7.b: "那就我们来帮他们滚蛋！"
 chi_east_china_sea_GR.8: "日本无视了我们的要求"
 chi_east_china_sea_GR.8.t: "日本无视了我们的要求"
 chi_east_china_sea_GR.8.d: "日本无视了我们对其冲绳管辖权的质疑，并联合起美军驻军加大了冲绳海域的巡逻。"
 chi_east_china_sea_GR.8.a: "旭日仍然灼烧着琉球人民……"
 chi_east_china_sea_GR.8.b: "解放琉球人民！"
 chi_east_china_sea_GR.9: "日本释放了琉球！"
 chi_east_china_sea_GR.9.t: "日本释放了琉球！"
 chi_east_china_sea_GR.9.d: "日本今天上午已决定交还琉球对冲绳的管辖权，承认琉球国为独立国家。"
 chi_east_china_sea_GR.9.a: "这一次，我不会再抛弃你了"
 chi_east_china_sea_GR.10: "中国正在要求尖阁列岛！"
 chi_east_china_sea_GR.10.t: "中国正在要求尖阁列岛！"
 chi_east_china_sea_GR.10.d: "中国已经恢复了与我们在尖阁群岛所有权上的争端。如果我们屈服于他们的要求，我们可能会增加中国对其影响我们外交政策的能力的信心，并降低我们在我国人民中的民族主义的受欢迎程度。然而，拒绝的后果对我们来说可能也不是好兆头。"
 chi_east_china_sea_GR.10.a: "区区一个渔岛……"
 chi_east_china_sea_GR.10.b: "日本不会被吓倒！"
 chi_east_china_sea_GR.11: "日本交出钓鱼岛！"
 chi_east_china_sea_GR.11.t: "日本交出钓鱼岛！"
 chi_east_china_sea_GR.11.d: "日本显然接受了我们主张的合法性，将钓鱼岛归还给了我们——其合法主人。"
 chi_east_china_sea_GR.11.a: "识时务者为俊杰"
 chi_east_china_sea_GR.12: "日本公然违抗我们！"
 chi_east_china_sea_GR.12.t: "日本公然违抗我们！"
 chi_east_china_sea_GR.12.d: "日本人拒绝归还钓鱼岛，显然像以前一样决心继续做我们的死敌。"
 chi_east_china_sea_GR.12.a: "他们会后悔的……"
#台湾#
 chi_taiwan.1: "中国要求我们放弃对台湾的干涉！"
 chi_taiwan.1.t: "中国要求我们放弃对台湾的干涉！"
 chi_taiwan.1.d: "今日，中华人民共和国外交部以强硬口吻要求我们履行承认一个中国的承诺，不可干涉台湾事务，中国方面声称这是中国内政，我国不得插手。这显然是中国要对台湾开刀的前奏。如果我们抛弃台湾，中国将毫无疑问地将枪口指向台湾。"
 chi_taiwan.1.a: "这不关我们的事……"
 chi_taiwan.1.b: "我们必须保护台湾！"
 chi_taiwan.2: "美国撤离了在台湾的军队和舰队！"
 chi_taiwan.2.t: "美国撤离了在台湾的军队和舰队！"
 chi_taiwan.2.d: "美国的舰队今天撤离了台海水域，向菲律宾基地驶去。美国显然默许了中国政府的外交要求。"
 chi_taiwan.2.a: "识时务者为俊杰"
 chi_taiwan.2.b: "为什么？！"
 chi_taiwan.3: "美国加大了对台湾的军事援助！"
 chi_taiwan.3.t: "美国加大了对台湾的军事援助！"
 chi_taiwan.3.d: "悬挂着美国国旗的运输货轮今日抵达了台北的港口，许多透露出的照片清晰地显示船上堆放的全是美方的军械物资。美国显然加大了对台湾的军事援助。"
 chi_taiwan.3.a: "美帝国主义贼心不死！"
 chi_taiwan.3.b: "太好了……"
 chi_taiwan.4: "中国发来最后通牒!"
 chi_taiwan.4.t: "中国发来最后通牒!"
 chi_taiwan.4.d: "北京政府于今日凌晨发来电报，要求我们在一小时内给出答复，台湾要么接受中华人民共和国中央人民政府的管辖，要么接受解放军的军事管制。"
 chi_taiwan.4.a: "我们屈服于强权……"
 chi_taiwan.4.b: "我们决不妥协！"
 chi_taiwan.5: "台湾当局宣布接受中央人民政府的管辖"
 chi_taiwan.5.t: "台湾当局宣布接受中央人民政府的管辖"
 chi_taiwan.5.d: "台北来电，[TAI.GetLeader]政府表示愿意承认台湾是中华人民共和国的合法领土，台湾将接受中央人民政府的管辖与治理。"
 chi_taiwan.5.a: "识时务者为俊杰"
 chi_taiwan.6: "台湾当局无视了我们的警告！"
 chi_taiwan.6.t: "台湾当局无视了我们的警告！"
 chi_taiwan.6.d: "[TAI.GetLeader]于今早发布直播演讲，向全世界告知台湾绝不畏惧“强权霸凌”，将与“侵略者”战斗至最后一刻。"
 chi_taiwan.6.a: "祖国统一！" 
 chi_taiwan.9.t: "台湾当局军队叛逃"
 chi_taiwan.9.d: "[TAI.GetLeader]政府下的军队军心涣散，已经有一部分军队宣布叛逃，并投奔我方。"
 chi_taiwan.9.a: "弃暗投明！" 
 chi_taiwan.9.b: "继续加大宣传！" 
 chi_taiwan.10.t: "他国干涉部队回国"
 chi_taiwan.10.d: "由于在我们在战争中彻底消灭了台湾当局，那些干涉我们统一大业的别国干涉军只能迫不得已地和我们签订和平协议，并不得不承认既定的统一事实。"
 chi_taiwan.10.a: "祖国统一！" 
 WAR_TAIWAN_JIEFANG: "祖国统一解放战争"
 chi_taiwan_jiefang: "祖国统一解放战争"
 chi_news.6: "中国收复台湾"
 chi_news.6.t: "中国收复台湾"
 chi_news.6.d: "经过半个世纪的争端和冲突，台海两岸终于实现武力统一。台湾当局，即前“中华民国”政府，结束了对数十年来对台湾地区的统治，在解放军进入台北总统府后彻底崩溃。这标志着中国在国家统一之路上走出最重要一步。"
 chi_news.6.a: "没人敢惹他们……"
 chi_news.6.b: "终于！终于！"
 chi_news.7: "中国收复台湾"
 chi_news.7.t: "中国收复台湾"
 chi_news.7.d: "经过半个世纪的争端和冲突，中国台海两岸终于实现和平统一。台湾当局，即前“中华民国”政府，结束了与中国大陆的敌对状态，承认接受中华人民共和国管辖，并作为一个特别行政区加入了中华人民共和国。"
 chi_news.7.a: "南海恢复贸易通航了吗？"
 chi_news.7.b: "终于！终于！"
 chi_news.8: "台海战争爆发"
 chi_news.8.t: "台海战争爆发"
 chi_news.8.d: "近日，台海的形势持续紧张，中台两岸之间的台海博弈已经到了战争边缘。 中华人民共和国国务院在紧急召开的记者会上发表正式声明：“台湾当局持续不断的挑战底线的行为，已经严重的伤害了海峡两岸人民的感情，在和平统一无望的情况下，中国将采取包括武力在内的一切手段维持祖国的统一。忍无可忍，无须再忍，中国共产党领导的中国人民解放军将发动对反动派所盘踞的台湾岛的最后一击，彻底结束解放战争。[TAI.GetLeader]所领导的反动派将为自己的行为付出血的代价。”\n\n中华人民共和国外交部发表声明，所有试图干涉中国统一进程的行为都将被视为进攻中国的敌对行为，中央军委也已经下达了对任何干涉势力开火的命令。"
 chi_news.8.a: "这一天还是来了"
 chi_news.8.b: "向全国的解放！"
 chi_news.8.c: "打倒赤匪！"
 chi_news.11.t:0 "台北解放"
 chi_news.11.d:0 "昨晚，由中国人民解放军空降兵主导的行动获得了巨大的成功，在雷神突击队完成了对松山机场、总统府等重要设施的机降突袭后，大规模的空降行动迅速在台北上空展开。行动开始后，多枚搭载钻地弹头的DF17导弹摧毁了衡山与圆山指挥所，守卫城市的国军部队迅速瓦解，解放军几乎在兵不血刃的情况下完成了对台北的占领。\n\n有消息指出，在收到大陆方面的进攻消息后，“台湾总统”[TAI.GetLeader]与岛内部分高级官员曾试图乘坐云豹装甲车从松山机场逃离台北，却被已经机场等候的空降突击队俘获。截止发稿时，台湾岛内大部分国军已经停止抵抗，据消息人士透露，解放军对剩余顽固分子的清扫行动将很快展开。"
 chi_news.11.a:0 "木已成舟"
 chi_news.11.b:0 "太好了"
 chi_news.12.t:0 "高雄解放"
 chi_news.12.d:0 "昨晚，由中国人民解放军海军陆战队主导的高雄登陆战已经基本结束，街道上仍然可以听见零星的枪声。虽然守卫的国军部队在滩头阵地组织了顽强的防御，但在解放军海军以及火箭军的饱和导弹攻击下很快失去了有组织的抵抗能力，海军陆战队第三旅下辖的合成营已经进入高雄市区并完成了对市区重要基础设施的控制。\n\n有未经证实的消息指出，剩余的国军部队已经出现了动摇，很有可能发生大规模的阵前起义，但前提是民国政府还能组织阵地进行抵抗。"
 chi_news.12.a:0 "解放军的两栖能力令人震惊"
 chi_news.12.b:0 "太好了"
 chi_news.13.t:0 "台湾解放"
 chi_news.13.d:0 "随着花莲地区的最后一支国军部队投降，中国人民解放军已经基本肃清了台湾岛上的抵抗。\n\n国务院总理在记者会上指出，台湾岛上的反动派残余势力已经被解放军完全消灭，接下来将对战犯进行清算并开始岛内战后重建工作。据称，中华人民共和国很快将在北京进行盛大的阅兵仪式庆祝台湾的回归。\n\n有消息指出，部分逃出台湾的民进党和部分国民党官员在已经在夏威夷成立了“台湾临时政府”，但截至发稿时，美国政府仍未就流亡政府问题发表正式回应。"
 chi_news.13.a:0 "中国人冲破了牢笼"
 chi_news.13.b:0 "中华人民共和国万岁！中国人民万岁！"
 chi_news.13.c:0 "烂泥扶不上墙……"
 chi_news.14.t:0 "审判"
 chi_news.14.d:0 "对战犯的审判正在进行，鼓吹台独的台湾地区前任“总统”、政府官员与民进党高层都在其中。\n\n若是将他们执行死刑便是大快人心，但倘若让他们活着也可以稳住台湾的民意。"
 chi_news.14.a:0 "消灭反动派，就地正法"
 chi_news.14.b:0 "叫最高人民法院开庭，一切遵照法律"
 chi_news.15.t:0 "东京陷落"
 chi_news.15.d:0 "东京的血战已经落下了帷幕，随着最后一支自卫队部队投降，中国国旗在东京天空树塔顶飘扬。随后中国宣布已经实现了对日本首都的完全控制。据信，天皇与政府内阁成员已经在解放军攻势开始前撤离了东京。\n在晚些时候，中国解放军在东京进行了一场盛大的游行，一个由中国士兵组成的看似没有尽头的庞大队伍在城市中不断前进着。沿街观看的日本市民始终保持着沉默。\n\n虽然中国国内舆论不时有“为南京复仇”的声音，但可以见到东京城内的解放军依旧保持了严明的军纪。"
 chi_news.15.a:0 "三十年河东，三十年河西"
 chi_news.15.b:0 "大仇已报"
 chi_news.16.t:0 "占领首尔"
 chi_news.16.d:0 "中国人民解放军与朝鲜人民军组成的联合部队已经进入首尔。早先由于朝鲜方面大量火炮的持续覆盖轰炸，首尔已经陷入了一片火海。\n\n青瓦台附近的战斗持续了最久，朝鲜特工曾试图在战役开始前渗透青瓦台以俘虏韩方高层，但失败了。最终，由大量自杀式无人机组成的蜂群击溃了守军的防御，但据悉[KOR.GetLeader]已经在早些时候撤出了首尔。"
 chi_news.16.a:0 "令人震惊"
 chi_news.16.b:0 "要不改名叫汉城吧？"
 chi_news.17.t:0 "占领河内"
 chi_news.17.d:0 "现在已经证实，越南首都河内已经被中国军队控制。虽然城市的大部分区域都遭到了毁灭性的轰炸，但是城市中央的胡志明纪念堂依然完好，中国解放军通过这种方式来表达对这位越南共产主义先驱的尊重。\n\n越南政府与部队已经撤入中部的丛林之中，并发誓要让中国部队“如美国人一样陷入泥潭”。"
 chi_news.17.a:0 "兄弟阋墙"
 chi_news.17.b:0 "试试看？"
 chi_news.18.t:0 "占领新加坡"
 chi_news.18.d:0 "随着“台风行动”的展开，中国海军陆战队在海军舰艇的支援下登陆了新加坡，随即展开了血腥的巷战，新加坡军方用大量的街垒以及伪装的坦克对中国部队造成了不小的麻烦，但在对方全面占优的火力面前依然不堪一击。\n\n随着新加坡港沦陷，中国成功将马六甲海峡这一通往印度洋的门户的控制权牢牢地掌握在手中。"
 chi_news.18.a:0 "震惊"
 chi_news.18.b:0 "以后不准讲英语"
 chi_news.19.t:0 "中国实现了对南海的完全控制"
 chi_news.19.d:0 "今天早些时候，中国国务院召开记者会宣布已经完成了对南海所有岛礁的完全控制，并再次警告将严厉打击任何国家对中国领土、领海的侵害行为。中国政府也在会上保证国际船运贸易在南海的自由航行不会受到影响，中国欢迎任何与中国和平交往的友好国家。"
 chi_news.19.a:0 "震惊"
 chi_news.19.b:0 "中国一点都不能少"
 chi_news.20.t:0 "占领新德里"
 chi_news.20.d:0 "今天，印度首都新德里被中国军队攻陷。虽然印度政府在战前宣称将把新德里将成为南亚的斯大林格勒，但由于大部分部队已经随印度政府在战役开始前逃离城市，守卫新德里的只剩下少数未能撤逃的军人与临时被驱上前线的警察。\n\n猛烈的交火仅在部分政府办公地点出现，但由于军警沿街设置了大量的路障，依然对解放军的推进产生了大量的麻烦。"
 chi_news.20.a:0 "他们翻过喜马拉雅山了？"
 chi_news.20.b:0 "快同印度的共产主义起义军取得联系"
 #思潮#
 chi_trends.1: "回归平淡"
 chi_trends.1.t: "回归平淡"
 chi_trends.1.d: "归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。"
 chi_trends.1.a: "本该如此"
 chi_trends.2: "回归平淡"
 chi_trends.2.t: "回归平淡"
 chi_trends.2.d: "天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。"
 chi_trends.2.a: "理所应当"
 chi_trends.3: "部分群众组织游行抗议！"
 chi_trends.3.t: "部分群众组织游行抗议！"
 chi_trends.3.d: "各地的群众开始组织起彼此呼应的游行队伍，对我们目前的政策表示抗议。\n我们应该决定我们应该保持现状，还是进行一些改变来安抚抗议者。"
 chi_trends.3.a: "出面调解"
 chi_trends.3.b: "重拳出击！"
#人口#
 chi_pop.1: "第五次全国人口普查"
 chi_pop.1.t: "第五次全国人口普查"
 chi_pop.1.d: "我国政府于2000年11月1日进行了第五次全国人口普查的登记工作。据统计，全国总人口为129533万人。其中：祖国大陆31个省、自治区、直辖市（不包括福建省的金门、马祖等岛屿，下同）和现役军人的人口共126583万人。香港特别行政区人口为678万人。澳门特别行政区人口为44万人，台湾省和福建省的金门、马祖等岛屿人口为2228万人。\n\n祖国大陆31个省、自治区、直辖市共有家庭户34837万户，家庭户人口为119839万人，平均每个家庭户的人口为3.44人，比1990年第四次全国人口普查的3.96人减少了0.52人。\n\n祖国大陆31个省、自治区、直辖市和现役军人的人口中，男性为65355万人，占总人口的51.63%；女性为61228万人，占总人口的48.37%。性别比（以女性为100，男性对女性的比例）为106.74。\n\n祖国大陆31个省、自治区、直辖市和现役军人的人口中，0-14岁的人口为28979万人，占总人口的22.89%；15-64岁的人口为88793万人，占总人口的70.15%；65岁及以上的人口为8811万人，占总人口的6.96%。同1990年第四次全国人口普查相比，0-14岁人口的比重下降了4.80个百分点，65岁及以上人口的比重上升了1.39个百分点。\n\n祖国大陆31个省、自治区、直辖市和现役军人的人口中，接受大学（指大专以上）教育的4571万人；接受高中（含中专）教育的14109万人；接受初中教育的42989万人；接受小学教育的45191万人（以上各种受教育程度的人包括各类学校的毕业生、肄业生和在校生）。"
 chi_pop.1.a: "盛世兹生"
 chi_pop.2: "第六次全国人口普查"
 chi_pop.2.t: "第六次全国人口普查"
 chi_pop.2.d: "2011年4月28日，国家统计局局长马建堂发布2010年第六次人口普查登记（已上报户口）的全国总人口为1,339,724,852人（不含港澳台地区）。根据普查公报，2010年11月全国总人口为1370536875人（包含港澳台地区）。\n\n大陆31个省、自治区、直辖市和现役军人的人口，同第五次全国人口普查2000年11月1日零时的1,265,825,048人相比，十年共增加73,899,804人，增长5.84%，年平均增长率为0.57%。\n\n大陆31个省、自治区、直辖市共有家庭户401517330户，家庭户人口为1,244,608,395人，平均每个家庭户的人口为3.10人，比2000年第五次全国人口普查的3.44人减少0.34人。\n\n大陆31个省、自治区、直辖市和现役军人的人口中，男性人口为686,852,572人，占51.27%；女性人口为652,872,280人，占48.73%。总人口性别比（以女性为100，男性对女性的比例）由2000年第五次全国人口普查的106.74下降为105.20。\n\n大陆31个省、自治区、直辖市和现役军人的人口中，0-14岁人口为222,459,737人，占16.60%；15-59岁人口为939,616,410人，占70.14%；60岁及以上人口为177,648,705人，占13.26%，其中65岁及以上人口为118,831,709人，占8.87%。同2000年第五次全国人口普查相比，0-14岁人口的比重下降6.29个百分点，15-59岁人口的比重上升3.36个百分点，60岁及以上人口的比重上升2.93个百分点，65岁及以上人口的比重上升1.91个百分点。\n\n同2000年第五次全国人口普查相比，每10万人中具有大学文化程度的由3611人上升为8930人。\n\n大陆31个省、自治区、直辖市和现役军人的人口中，居住在城镇的人口[9]为665,575,306人，占49.68%；居住在乡村的人口为674,149,546人，占50.32%。同2000年第五次全国人口普查相比，城镇人口增加207,137,093人，乡村人口减少133,237,289人，城镇人口比重上升13.46个百分点。"
 chi_pop.2.a: "盛世兹生"
 chi_pop.3: "第七次全国人口普查"
 chi_pop.3.t: "第七次全国人口普查"
 chi_pop.3.d: "我国政府于2020年11月1日进行了第七次全国人口普查的登记工作。全国人口共141178万人，与2010年的133972万人相比，增加了7206万人，增长5.38%；年平均增长率为0.53%，比2000年到2010年的年平均增长率0.57%下降0.04个百分点。数据表明，我国人口10年来继续保持低速增长态势。\n\n全国共有家庭户49416万户，家庭户人口为129281万人；集体户2853万户，集体户人口为11897万人。平均每个家庭户的人口为2.62人，比2010年的3.10人减少0.48人。家庭户规模继续缩小，主要是受我国人口流动日趋频繁和住房条件改善年轻人婚后独立居住等因素的影响。\n\n0—14岁人口为25338万人，占17.95%；15—59岁人口为89438万人，占63.35%；60岁及以上人口为26402万人，占18.70%（其中，65岁及以上人口为19064万人，占13.50%）。与2010年相比，0—14岁、15—59岁、60岁及以上人口的比重分别上升1.35个百分点、下降6.79个百分点、上升5.44个百分点。我国少儿人口比重回升，生育政策调整取得了积极成效。同时，人口老龄化程度进一步加深，未来一段时期将持续面临人口长期均衡发展的压力。\n\n男性人口为72334万人，占51.24%；女性人口为68844万人，占48.76%。总人口性别比（以女性为100，男性对女性的比例）为105.07，与2010年基本持平，略有降低。出生人口性别比为111.3，较2010年下降6.8。我国人口的性别结构持续改善。\n\n具有大学文化程度的人口为21836万人。与2010年相比，每10万人中具有大学文化程度的由8930人上升为15467人，15岁及以上人口的平均受教育年限由9.08年提高至9.91年，文盲率由4.08%下降为2.67%。受教育状况的持续改善反映了10年来我国大力发展高等教育以及扫除青壮年文盲等措施取得了积极成效，人口素质不断提高。\n\n居住在城镇的人口为90199万人，占63.89%；居住在乡村的人口为50979万人，占36.11%。与2010年相比，城镇人口增加23642万人，乡村人口减少16436万人，城镇人口比重上升14.21个百分点。随着我国新型工业化、信息化和农业现代化的深入发展和农业转移人口市民化政策落实落地，10年来我国新型城镇化进程稳步推进，城镇化建设取得了历史性成就。\n\n我国人口结构已发生根本性转变，机遇与危机并存。"
 chi_pop.3.a: "难道我们也要走向老龄化？"

 chi_pop.4: "城市化"
 chi_pop.4.t: "城市化"
 chi_pop.4.d: "根据初步的数据推算和登记，去年我国继续保持了改革开放以来城市化进程加快的趋势，越来越多的农村人口进入城市。\n\n高速城市化将对我国社会产生诸多影响，最为主要的影响是农村劳动力的转移将带来大量廉价劳动力红利，有利于我国经济高速增长，同时也会加大医疗、社会支出的压力。同时，城市化带来的另一个显著特征是人口出生率的降低，这有利于落实我国计划生育政策，提升人口综合素质。"
 chi_pop.4.a: "继续保持"
 
#亚投行#
 china.20.t: "中国创建亚洲基础设施投资银行"
 china.20.d: "中国政府今天宣布，作为“一带一路”倡议的一部分，中国有意通过亚洲基础设施投资银行在世界各国投资多个基础设施项目。尽管许多发展中国家对这一宣布表示欢迎，因为它们期待中国对其经济进行急需的投资，这有利于加快推进亚洲基础设施建设和互联互通建设，共同应对国际金融危机、经济转型升级和经济稳定增长，还利于加速亚洲经济一体化进程。但日本、印度、美国和澳大利亚都对该倡议表示保留，认为这是和一带一路倡议一样，是中国在海外扩大影响力的一种隐蔽尝试。"
