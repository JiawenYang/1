l_simp_chinese:
 ql_ENG_army_academy_spirit_01:0 "桑赫斯特与军官培养体系"
 ql_ENG_army_academy_spirit_01_desc:0 "桑赫斯特皇家军事学院负责英国陆军军官的初级委任训练，并与各兵种院校共同构成完整的军官培养链路。选拔面窄、标准刻意维持在高位，使规模有限的军官团足以支撑一支职业化军队。"
 ql_ENG_army_spirit_02:0 "职业化精干陆军"
 ql_ENG_army_spirit_02_desc:0 "英国陆军规模有限，但高度职业化，围绕高战备、合成兵种协同与集中炮兵火力建设，而非追求大规模编成。其学说看重训练有素的常备军、快速部署与精确火力，而不是单纯的人数优势。"
 ql_ENG_army_command_spirit_03:0 "联合作战指挥体系"
 ql_ENG_army_command_spirit_03_desc:0 "常设联合司令部与国防参谋体系负责跨军种的作战规划与协同。联合目标选择、情报共享与单一作战指挥链，让一支小规模部队能够发挥出远超其编制的作战效能。"
 ql_ENG_navy_command_spirit_04:0 "皇家海军远洋投送传统"
 ql_ENG_navy_command_spirit_04_desc:0 "皇家海军为远离本土的持续作战而建：长航程部署、全球驻泊与依托航母编队的两栖投送。制海与远征作战的传统，至今仍塑造着舰队的训练与运用方式。"
 ql_ENG_air_academy_spirit_05:0 "皇家空军飞行训练"
 ql_ENG_air_academy_spirit_05_desc:0 "皇家空军飞行训练实行集中管理，机组从基础训练到作战改装都遵循统一标准。其重心在于稳定维持高训练水准，而不是快速扩张规模。"
 ql_ENG_air_spirit_06:0 "皇家空军制空战力"
 ql_ENG_air_spirit_06_desc:0 "制空与拦截始终是皇家空军作战规划的核心。战斗机部队既要争夺激烈空域，也要掩护打击编队，并同时守护本土与海外部署部队的上空。"
 ql_ENG_air_command_spirit_07:0 "皇家空军远征与制空"
 ql_ENG_air_command_spirit_07_desc:0 "皇家空军的远征作战把近距支援、护航与快速部署结合到遥远战区。其指挥结构专为把一支规模不大但能力完整的航空兵力投送到英国利益所需的任何地方而设计。"
