l_simp_chinese:
 ZZZ_election.0.t:0 "全国大选临近"
 ZZZ_election.0.d:0 "议会任期即将结束。各党总部正在敲定竞选预算，金主陆续站队，国家的政治走向将由选票决定。投票日之前，政府仍有空间影响结果。"
 ZZZ_election.0.a:0 "资助执政党竞选（§Y-50§! 政治点数）"
 ZZZ_election.0.b:0 "资助最大反对党竞选（§Y-75§! 政治点数）"
 ZZZ_election.0.c:0 "不介入竞选"
 ZZZ_election.2.t:0 "选票清点完毕"
 ZZZ_election.2.d_majority:0 "最大党已跨过半数线，将单独组阁，新内阁数日内即可就职。"
 ZZZ_election.2.d_coalition:0 "无任何政党取得过半席位。最大党已同意与第二大党共同执政，两党签署了覆盖整个任期的联合执政协议。"
 ZZZ_election.2.d_minority:0 "无政党取得过半席位，也未能达成联合执政协议。最大党将领导少数派政府，只能依靠议会中的临时支持维持施政。"
 ZZZ_election.2.a:0 "接受选举结果"
 ZZZ_election.4.t:0 "第二轮投票揭晓"
 ZZZ_election.4.d:0 "首轮无人过半。得票最高的两位候选人再次对决，国家已在二者之间作出选择。"
 ZZZ_election.4.a:0 "接受第二轮结果"
 ZZZ_election_chain_tt:0 "选举链标记：本窗口属于 ZZZ 选举模板（日志标记：§YZZZ_template§!）。若未出现本窗口，则说明该国走的是基座通用链（MD4_election_campaign.0，日志标记：§YMD_generic§!）。"
