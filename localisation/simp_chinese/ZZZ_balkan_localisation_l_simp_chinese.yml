l_simp_chinese:
 # ==== ZZZ 巴尔干：选举事件 ====
 zzz_balkan.1.t:0 "复兴浪潮席卷索菲亚"
 zzz_balkan.1.d:0 "华盛顿陷入自身宪政危机而无暇外顾，保加利亚选民转向复兴党。科斯塔丁·科斯塔迪诺夫的阵营公开反对北约成员身份与欧盟附加条件，并承诺重新打开通往莫斯科与北京的门路。"
 zzz_balkan.1.a:0 "新政府在索菲亚上任。"
 zzz_balkan.2.t:0 "布加勒斯特选出主权主义者"
 zzz_balkan.2.d:0 "罗马尼亚民族主义重返执政。新总统拒绝大西洋框架，要求西方结束在黑海的军事存在，并着手与俄罗斯、中国接触。"
 zzz_balkan.2.a:0 "布加勒斯特改弦更张。"
 zzz_balkan.3.t:0 "希腊与欧美阵营决裂"
 zzz_balkan.3.d:0 "佐伊·康斯坦托普卢的阵营把紧缩危机转化为与布鲁塞尔、华盛顿的决裂。新政府要求撤除外国基地，并启动同时退出北约与欧盟的程序。"
 zzz_balkan.3.a:0 "雅典选择了另一条道路。"
 zzz_balkan.4.t:0 "安卡拉重新掂量盟友"
 zzz_balkan.4.d:0 "安卡拉的民族主义左翼政府认定北约已成负资产。土耳其宣布退出该联盟，同时保持面向俄罗斯与中国的独立路线。"
 zzz_balkan.4.a:0 "土耳其退出北约。"
 zzz_balkan.5.t:0 "地拉那跟随新潮流"
 zzz_balkan.5.d:0 "西方安全保证动摇之后，阿尔巴尼亚政治倒向民族主义阵营。地拉那示意不愿再做正在解体联盟的最后一处前哨。"
 zzz_balkan.5.a:0 "阿尔巴尼亚转向。"
 zzz_balkan.6.t:0 "萨格勒布加入巴尔干转向"
 zzz_balkan.6.d:0 "克罗地亚民族主义者赢得争论：国家的前途在于区域集团，而非日渐消退的大西洋秩序。萨格勒布准备退出北约与欧盟。"
 zzz_balkan.6.a:0 "克罗地亚向东转。"
 zzz_balkan.7.t:0 "卢布尔雅那重新计算"
 zzz_balkan.7.d:0 "斯洛文尼亚政治摆向民族主义右翼，这股力量同时质疑北约成员身份与欧盟对卢布尔雅那的管辖权。"
 zzz_balkan.7.a:0 "斯洛文尼亚重新审视其成员身份。"
 zzz_balkan.8.t:0 "波德戈里察选择塞俄轴心"
 zzz_balkan.8.d:0 "安德里亚·曼迪奇的亲塞尔维亚、亲俄阵营在黑山掌权，并着手切断本国与北约的纽带。"
 zzz_balkan.8.a:0 "黑山退出该联盟。"
 zzz_balkan.20.t:0 "退约程序落定"
 zzz_balkan.20.d:0 "新政府完成退出西方安全与经济结构的法律程序。华盛顿与布鲁塞尔实施报复；莫斯科与北京欢迎这一转向。"
 zzz_balkan.20.a:0 "决裂完成。"
 zzz_balkan.20.b:0 "还不是时候——政府尚未更替。"
 zzz_balkan.30.t:0 "巴尔干重新敞开"
 zzz_balkan.30.d:0 "大西洋集团在半岛全线退潮，中国外交进入真空。区域联邦已触手可及。"
 zzz_balkan.30.a:0 "新的势力范围成形。"

 # ==== ZZZ 巴尔干：决议 ====
 PRC_balkan_federation_support:0 "巴尔干倡议：支持组建巴尔干联邦"
 PRC_balkan_federation_support_desc:0 "美国陷入瘫痪，巴尔干的西方秩序正在崩塌。通过支持区域联邦，北京可以用自身影响力取代美俄在此地的存在。"
 PRC_balkan_federation_support_cost_tt:0 "需要 150 政治点、60 指挥点与 12 财政储备，全部消耗。"
 PRC_balkan_war_on_turkey:0 "与土耳其清算"
 PRC_balkan_war_on_turkey_desc:0 "土耳其已退出北约，孤立无援。俄罗斯在欧洲获胜、中国在太平洋获胜之后，可以用武力迫使安卡拉就范。"
 PRC_balkan_federation_collapse:0 "放弃巴尔干阵地"
 PRC_balkan_federation_collapse_desc:0 "俄罗斯战役已经失败。巴尔干联邦计划无法维系，合作关系随之解散。"

 # ==== ZZZ 巴尔干：理念 ====
 BALKAN_withdrawal_economic_shock:0 "退约冲击"
 BALKAN_withdrawal_economic_shock_desc:0 "与西方市场和安全结构脱钩，贸易、投资与公众信心均受冲击。"
 PRC_balkan_federation_partnership:0 "巴尔干联邦伙伴关系"
 PRC_balkan_federation_partnership_desc:0 "中国为巴尔干联邦提供背书。长期的经济与外交负担压在中国财政之上。"

 # ==== ZZZ 巴尔干：人物 ====
