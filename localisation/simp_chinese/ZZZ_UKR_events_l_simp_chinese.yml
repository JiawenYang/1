l_simp_chinese:
 #乌克兰 2017-2024 剧情链（ukraine.1-13，搬运自 TFR 并按本工程依赖改写）
 ukraine.1.t: "乌克兰撕毁明斯克协议"
 ukraine.1.d: "乌克兰军队再次与新罗西亚联邦国在边境交火，公然撕毁了双方达成的和平协议。克里姆林宫正在注视，脆弱的停火已经走到崩溃边缘。"
 ukraine.1.o1: "鲁莽之举。"
 ukraine.2.t: "乌克兰国际航空752号班机在伊朗上空被击落"
 ukraine.2.d: "伊朗政府通报，革命卫队成员在伊玛目霍梅尼国际机场起飞后不久误击了我方一架客机。机上176名乘客与机组人员全部遇难。德黑兰称之为悲剧性的失误；对遇难者家属而言，这改变不了什么。"
 ukraine.2.o1: "人间惨剧。"
 ukraine.3.t: "俄罗斯谴责乌克兰“新纳粹主义”"
 ukraine.3.d: "俄罗斯官方媒体又掀起一轮指控，把基辅政府污蔑为“新法西斯分子”和“希特勒帮凶的孙子”。这些说法不过是披着新闻外衣的老套宣传，却在RT和卫星通讯社的每晚播报中反复出现。基辅不会对这种诽谤坐视不理。"
 ukraine.3.a: "历史终将还我们清白。"
 ukraine.4.t: "俄国人来了"
 ukraine.4.d: "军事情报部门警告，莫斯科正在为全面入侵做准备。工程部队已经在第聂伯河沿岸和东部接近地浇筑混凝土，新的兵工厂也在紧急投产。此刻多修一座掩体，将来就多一分时间。"
 ukraine.4.a: "做最坏的准备。"
 ukraine.5.t: "加入北约的邀请"
 ukraine.5.d: "北约已正式邀请乌克兰和摩尔多瓦加入。对莫斯科而言，这是它警告多年的红线；对基辅而言，这是唯一真正兑现过的安全保障。无论克里姆林宫说什么，入约文件都将在数周内签署。"
 ukraine.5.a: "团结则存。"
 ukraine.6.t: "别尔哥罗德占领区建立"
 ukraine.6.d: "乌克兰部队越过边境，在别尔哥罗德周边建立起占领区。莫斯科称之为侵略行径；前线指挥官称之为缓冲区。当地的俄罗斯居民如今生活在乌克兰行政当局的管理之下。"
 ukraine.6.a: "守住防线。"
 ukraine.7.t: "别尔哥罗德恐怖袭击"
 ukraine.7.d: "一枚炸弹在占领区人流密集的市场爆炸，数十名平民丧生。没有任何组织宣称负责，但这场爆炸已把占领从军事问题变成了政治火药桶。"
 ukraine.7.a: "此事绝不会没有回应。"
 ukraine.8.t: "别尔哥罗德起义"
 ukraine.8.d: "俄罗斯志愿兵与地方民兵起而反抗占领当局。“新俄罗斯”运动宣布别尔哥罗德与库尔斯克为自由的俄罗斯领土，其武装人员已经同乌克兰驻军交火。"
 ukraine.8.a: "俄罗斯之春开始了。"
 ukraine.9.t: "罗斯托夫起义"
 ukraine.9.d: "起义蔓延至罗斯托夫。当地哥萨克民兵夺取数个区，宣布既脱离基辅也脱离莫斯科独立；与此同时，“梅利托波尔”志愿军团正着手整合该地区。"
 ukraine.9.a: "混乱蔓延。"
 ukraine.10.t: "塞瓦斯托波尔起义"
 ukraine.10.d: "克里米亚的起义已经烧到塞瓦斯托波尔。白俄罗斯与沃伦志愿部队进入半岛，黑海舰队昔日的老基地如今成了争夺之地。"
 ukraine.10.a: "半岛在燃烧。"
 ukraine.11.t: "特别军事行动"
 ukraine.11.d: "总参谋部已启动特别军事行动计时器。从这一刻起，对俄战役进入倒计时：要么乌克兰崩溃，要么行动陷入莫斯科承受不起的僵局。"
 ukraine.11.a: "开始计时。"
 ukraine.12.t: "乌克兰誓言保卫库班"
 ukraine.12.d: "基辅公开为库班的安全提供保证——而莫斯科视库班为自己的领土。这份声明是蓄意的挑衅，克里姆林宫心知肚明。"
 ukraine.12.a: "他们知道另一种选择……"
 ukraine.13.t: "2024年乌克兰大选"
 ukraine.13.d: "战火之中，乌克兰走向投票站。泽连斯基阵营许诺延续与连任；波罗申科的保守派许诺经验与更强硬的路线。选举结果将决定2025年面对莫斯科的是哪一个乌克兰。"
 ukraine.13.a: "泽连斯基连任。"
 ukraine.13.b: "波罗申科归来。"
 germany.243.t: "基辅幽灵"
 germany.243.d: "这个名字在社交媒体上刷屏，据说属于一名乌克兰米格-29飞行员，在入侵第一天击落了六架俄军战机。视频晃动，说法未经证实，但这个传说已经开始在一个需要传说的国家里发挥作用。"
 germany.243.a: "祝他猎运亨通。"
 news.313.t: "泽连斯基在乌克兰成功连任"
 news.313.d: "泽连斯基赢得第二个任期。战时领袖的形象与民粹化的沟通方式让他的联盟在腐败丑闻和停滞的反攻中依然维系；反对派现在要面对又一个四年。"
 news.313.a: "一个平庸的喜剧演员，却是战时的总统。"
 news.313.b: "西方还会继续开支票。"
 news.314.t: "波罗申科在乌克兰当选"
 news.314.d: "波罗申科重返总统府。厌倦了泽连斯基失败的选民转而支持这位曾被他们拒绝的人，赌的是经验与对莫斯科的强硬路线能让战争以更有利的条件收场。"
 news.314.a: "一个仇俄者换掉另一个仇俄者。"
 news.314.b: "至少他知道怎么执政。"
