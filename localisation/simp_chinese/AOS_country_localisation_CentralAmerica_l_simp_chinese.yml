l_simp_chinese:
 ELS_right_populism_desc: "\n\n\n\n  £GFX_ELS_Ideology_bukele_model \n\n\n\n\n\n §Y布克尔模式§!是一种在萨尔瓦多发展起来的治理形式和政治路径，由2019年就任总统的纳伊布·布克尔主导推行。该模式结合了强硬的安全政策（重点在于直接打击暴力并恢复国家对领土的控制）与行政权力的高度集中、制衡机制的弱化，以及与民众直接且持续的沟通。为了国家发展，该模式优先注重秩序、稳定和减少暴力方面的成效。在维持强大民众支持的同时，也引发了关于安全、秩序与公民自由之间平衡的激烈辩论。"
 NIC_left_nationalism_desc: "\n\n\n\n  £GFX_NIC_Ideology_sandinismo \n\n\n\n\n\n§Y桑地诺主义§!是尼加拉瓜的一种政治思潮，源于对外国霸权及索摩查等国内独裁政权的反抗，并以奥古斯托·C·桑地诺争取国家主权的斗争为思想基石。其创始人卡洛斯·丰塞卡·阿马多尔正式组建桑地诺民族解放阵线后，该思想体系得以系统化。桑地诺主义继承了古巴革命催生的拉美革命左翼浪潮，融合了民族解放、社会正义和民众组织、国家主导经济、教育和医疗体系，以及动员民众实现深刻变革等理念。该思潮以“基督教、社会主义与团结的尼加拉瓜”为执政纲领而巩固地位。现今由自2007年起担任总统的丹尼尔·奥尔特加领导。"
 NIC_Sindrome_Necromorbido: "坏死综合征"
 NIC_Sindrome_Necromorbido_desc: "世代尼加拉瓜人生活在暴力的阴影之下，其根源在于独裁、革命、政治镇压和经济不稳定。从索摩查政权到桑地诺革命，再到其后多年的政治紧张局势，冲突已深深植根于该国的政治文化和集体记忆之中。久而久之，许多公民逐渐将动荡和恐惧视为日常生活的常态。尼加拉瓜的电视媒体在强化这种麻木文化方面扮演了重要角色。新闻节目经常依靠血腥画面、犯罪报道和耸人听闻的标题来吸引观众，将暴力转变为消遣和娱乐。于是，流血、悲剧和政治冲突的场景在公共生活中变得习以为常，催生了一个震惊逐渐失去冲击力、暴力令人不安地成为惯例的社会。"
 NIC_Senor_Gobierno: "政府先生"
 NIC_Senor_Gobierno_desc: "丹尼尔·奥尔特加政府维持着民主的表象，同时限制真正的反对力量。独立政党和异见人士通过逮捕、审查和流放等手段遭到削弱，政治体系内仅存受控或已被削弱的反对团体。因此，尼加拉瓜在严格管控的政治环境下运作，选举和制度虽形式上存在，但真正的政治竞争极为有限。批评者指出，这种制度既维护了奥尔特加的权力，又保留了民主的幌子。"
 NIC_legacy_of_protests2: "抗议的遗产"
 NIC_legacy_of_protests2_desc: "2018年，针对养老金改革的抗议迅速演变为全国性起义，暴露出尼加拉瓜社会内部的深刻裂痕。最初以学生和退休人员为主的示威活动很快蔓延全国，公路被封锁，抗议者与安全部队发生暴力冲突，失踪、任意逮捕和政治迫害的报道日益增多。尼加拉瓜的街头沦为恐惧与抵抗的舞台，而政府则通过日益加剧的镇压试图重新控制局面。危机爆发两年后，该国似乎陷入缓慢而痛苦的衰退，仿佛被一记永未愈合的重创所伤。经济疲软，数千尼加拉瓜人流亡海外，公众对体制的信任急剧恶化。抛开政治冲突本身，2018年的事件留下了持续笼罩日常生活的疲惫与不确定氛围，即便路障从街头消失，这种影响仍久久挥之不去。"
 NIC_revolutionary_spirit2: "革命精神"
 NIC_revolutionary_spirit2_desc: "1979年桑地诺的胜利，以社会主义、主权和社会正义的理念重塑了尼加拉瓜的民族认同。对许多人而言，这场革命代表着摆脱独裁和外国势力影响的解放。然而，革命也带来了经济动荡、内战冲突和长期的政治两极分化。其历史遗产至今仍存在深刻分歧：有人视其为希望的象征，也有人认为那是数十年苦难和动荡的开端。"
 GUA_legado_caudillos_y_bananas: "香蕉的遗产"
 GUA_legado_caudillos_y_bananas_desc: "20世纪上半叶，联合果品公司成为危地马拉实力最雄厚的外资企业之一，控制着该国境内的农田、铁路、港口和出口贸易。其庞大的经济影响力使外国商业利益得以左右危地马拉政治，并加剧了城乡与土著群体的不平等。1954年，雅各布·阿本斯总统试图推行土地改革，威胁到该公司持有的闲置土地。冷战期间，美方担忧共产主义影响蔓延，同时为保护本国经济利益，中央情报局支持发动政变推翻阿本斯政权，扶植亲军方政府上台。这场政变对危地马拉带来了灾难性的长期后果。它引发了数十年军事独裁、政治镇压和一场残酷的内战，尤其在原住民社群中留下了深刻的社会和种族创伤。直至今日，危地马拉仍在腐败、疲弱的民主体制、有组织犯罪、贫困及民众对政府的不信任中挣扎。许多历史学家认为，中央情报局支持的政变所制造的动荡，正是该国至今面临诸多政治社会问题的根源。"
 GUA_resistencia_indigena: "原住民抵抗"
 GUA_resistencia_indigena_desc: "危地马拉的原住民社区在数个世纪以来一直抵抗着征服、歧视和政治压迫，同时守护着自己的语言、传统和身份认同。玛雅人曾面临土地掠夺、暴力和排斥，却始终捍卫自身文化，持续争取承认和权利。在危地马拉内战期间，原住民社群遭受了该国历史上最严重的暴力和迫害。尽管如此，原住民运动得以存续，至今仍是现代危地马拉的重要力量，象征着坚韧、文化存续以及持续对抗不平等和歧视的持续抗争。"
 GUA_informalidad_laboral_agrabada: "劳工非正规化加剧"
 GUA_informalidad_laboral_agrabada_desc: "危地马拉大部分人口的生计依赖于非正规劳动和政府监管之外的经济活动。街头贩卖、未注册的企业和现金雇佣关系主导着数百万民众的日常生活。这种非正规体系虽然维持了许多家庭的生计，却严重限制了税收监管，削弱了政府在基础设施、医疗和教育领域投资的能力。"
 COS_la_suiza_centroamericana: "中美洲瑞士"
 COS_la_suiza_centroamericana_desc: "哥斯达黎加在该地区以民主稳定、强大的制度以及以教育和医疗为中心的社会模式而享有独特声誉。在历史上曾困扰中美洲大部分地区的持续动荡中，该国展现出和平、温和与政治延续性的罕见象征。当许多邻国饱受暴力、腐败或制度脆弱的困扰，哥斯达黎加却以自身作为地区稳定与希望的灯塔而自豪。"
 COS_refugiados_nicaraguenses: "尼加拉瓜难民"
 COS_refugiados_nicaraguenses_desc: "2018年尼加拉瓜危机不仅深刻影响了该国本身，也波及邻国哥斯达黎加。为逃离暴力、压迫与经济动荡，大批尼加拉瓜人越过边境寻求庇护和安全。凭借相对稳定和更健全的体制机构，哥斯达黎加成为流亡尼加拉瓜人的主要目的地之一。然而持续涌入的难民也引发了哥斯达黎加国内的社会和政治紧张局势。民族主义势力日益抨击大量移民入境，声称公共服务、就业机会和社会稳定正面临压力。这场难民危机由此既是人道主义问题，也成为国内政治辩论的持续焦点。"
 COS_nacion_sin_ejercito: "没有军队的国家"
 COS_nacion_sin_ejercito_desc: "自1948年废除军队以来，哥斯达黎加建立了一种与和平、民主和外交紧密相连的民族认同。曾经用于武装部队的资源被重新分配到了教育、医疗和社会发展领域，帮助塑造了该国作为拉丁美洲最稳定的民主国家之一的形象。与此同时，没有军队也使得哥斯达黎加在国防上依赖警察力量和国际联盟。在该地区历史上饱受冲突、不稳定和有组织犯罪困扰的背景下，一些批评者认为，在这个军事力量仍发挥重大地缘政治作用的世界里，该国仍然脆弱。"
 PAN_el_gran_cruce_de_las_americas: "美洲大陆的伟大横跨"
 PAN_el_gran_cruce_de_las_americas_desc: "巴拿马占据着地球最具战略意义的地理位置之一。它连接着南北美洲并拥有巴拿马运河，是大西洋与太平洋之间的重要纽带。这一位置赋予巴拿马巨大的经济和地缘政治重要性，使其成为全球贸易、航运和金融枢纽。然而，同样的战略优势也带来了重大挑战。巴拿马已成为国际毒品贩运和非正规移民的关键过境走廊，尤其是通过达连隘口。在繁荣和全球影响力的背后，这些压力也滋生了腐败、有组织犯罪和社会不稳定，持续考验着该国的体制。"
 PAN_nacion_desarmada: "非军事化国家"
 PAN_nacion_desarmada_desc: "1990年曼努埃尔·诺列加倒台后，巴拿马正式废除武装力量。此后，国家安全主要依赖警察机构以及与美国等外国盟友的合作。这一决策有助于该国摆脱军事独裁历史，强化以文官为中心的政治体制。然而，缺乏常备军也使巴拿马相对容易受到外部威胁，不得不依赖国际伙伴关系维护整体安全。在这片战略要地上，这种脆弱性始终是政治与安全议题中反复探讨的焦点。"
 BLZ_protectorado_britanico: "不列颠保护领"
 BLZ_protectorado_britanico_desc: "伯利兹原为英国殖民地英属洪都拉斯，即便在1981年独立后仍与英国保持着密切联系。该国至今沿用英国式议会制度，并保留英联邦成员身份，尊英国君主为国家元首。相比中美洲多数国家，这份殖民遗产帮助伯利兹维持了相对稳定的民主体制。但英国的影响力也持续塑造着该国的政治、身份认同及其对外部支持的依赖。"
 ELS_doctrina_bukele: "布克尔主义"
 ELS_doctrina_bukele_desc: "纳伊布·布克尔对帮派和有组织犯罪采取强硬立场，深刻改变了萨尔瓦多。数十年来，帮派暴力塑造了该国的日常生活：敲诈勒索、谋杀和领土控制将恐惧变为全国常态。利用这种集体疲惫感，布克尔构建了一套基于强力动用安全部队和以权威与秩序为中心的战略。对许多萨尔瓦多人来说，他代表着终于直面历届政府未能解决问题的领导人。然而，布克尔的做法也引发批评者和国际观察家日益增长的担忧。尽管大量民众为暴力减少而欢呼，但另一些人警告称权力集中和民主制度弱化可能给国家带来长期后果。萨尔瓦多如今正徘徊于两种现实之间：一种是安全已显著改善的现实，另一种是民主自由似乎日益脆弱的现实。"
 ELS_estado_de_exepcion: "例外状态"
 ELS_estado_de_exepcion_desc: "为打击帮派，布克尔政府暂停了多项宪法保障，并在全国范围内部署军队。大规模逮捕和更严厉的治安措施显著减少了帮派活动，改善了许多社区的安全状况。然而，这一政策也因任意拘留和侵犯人权的指控而引发了国际组织的批评。虽然犯罪率有所下降，但对民主和个人自由的担忧却在增加。"
 ELS_rayo_de_esperanza: "希望之光"
 ELS_rayo_de_esperanza_desc: "布克尔的上台，让常年生活在恐惧与暴力阴影下的萨尔瓦多人燃起了希望。那些曾被帮派控制的社区，开始体验到数十年来未曾有过的安全感。对许多民众而言，布克尔代表着重建正常生活、重获公共空间的可能性。他的高人气主要源自这种解脱感，以及人们对更安全未来的重燃希望。"
 HON_legado_de_manuel_zelaya: "曼努埃尔·塞拉亚的遗产"
 HON_legado_de_manuel_zelaya_desc: "2009年曼努埃尔·塞拉亚被罢免，成为现代洪都拉斯政治中最具决定性的事件之一。他的下台使国家陷入政治和社会分裂，至今仍在影响选举和公众舆论。支持者视塞拉亚为社会改革、经济正义和减少外国影响的象征，而批评者则认为他的总统任期威胁民主稳定，有将洪都拉斯推向威权主义的风险。"
 HON_violencia_endemica: "地方暴力"
 HON_violencia_endemica_desc: "洪都拉斯多年来一直面临极高的谋杀率和广泛的安全问题。与贫困、帮派、毒品走私以及制度薄弱相关的暴力影响着该国大部分地区的日常生活。恐惧和动荡已成为根深蒂固的社会问题，损害了公众对政府的信任，并迫使许多公民为寻求安全而离开祖国。"
 HON_juventud_sin_futuro: "无望一代"
 HON_juventud_sin_futuro_desc: "经济机会匮乏和就业不稳定迫使成千上万的洪都拉斯青年陷入艰难抉择。许多人试图移民海外，尤其是前往美国，而另一些人则容易被帮派和犯罪组织招募。教育落后、失业问题和社会不平等持续加剧着年轻一代的移民潮、暴力和绝望循环。"
 CEN_cartel_presence_minor: "微弱贩毒集团影响"
 CEN_cartel_presence_moderate: "中度贩毒集团影响"
 CEN_cartel_presence_severe: "严重贩毒集团影响"
 DANIEL_ORTEGA_DESC: "§Y何塞·丹尼尔·奥尔特加·萨维德拉§!于1945年11月11日出生于尼加拉瓜的拉利伯塔德。作为年轻的活动家，他加入了反对索摩查独裁的桑地诺运动，并成为1979年革命的领导人之一。奥尔特加于1985年至1990年首次担任总统，期间经历了内战和经济困难，随后于2007年重新掌权。此后，他逐渐巩固了对尼加拉瓜政治机构的控制，并一直保持该国主导政治人物的地位。支持者视其为桑地诺遗产和国家主权的捍卫者，而批评者则指责他破坏民主，将尼加拉瓜日益变为威权主义国家。"
 NAYIB_BUKELE_DESC: "§Y纳伊布·阿曼多·布克尔·奥特斯§!1981年7月24日出生于圣萨尔瓦多。在商业和广告领域取得成功后，他通过法拉本多·马蒂民族解放阵线进入政坛，并先后担任新库斯卡特兰市市长和圣萨尔瓦多市市长。2017年被开除党籍后，他以反建制候选人的姿态参选，并在2019年赢得总统大选，终结了萨尔瓦多传统政党数十年的主导地位。其政府以严厉打击帮派而闻名，犯罪率显著下降，但也引发了对民主制度和公民自由的担忧。如今布克尔仍是拉丁美洲最受欢迎也最具争议的领导人之一，支持者赞赏他恢复社会安全，反对者则批评他权力过度集中。"