l_simp_chinese:
 civil_bunker: "民用防空洞"
 civil_bunker_plural: "民用防空洞"
 civil_bunker_desc: "为平民提供防空及其他威胁下的避难设施，可降低轰炸和核打击造成的损害。"
 civil_bunker.1.t: "私人防空洞"
 civil_bunker.1.d: "国内较富裕的民众已经开始修建私人防空洞。"
 civil_bunker.1.a: "至少我们不必替他们修建了。"
 AB_prepare_civil_bunkers: "重新启用民防掩体"
 AB_prepare_civil_bunkers_desc: "冷战结束后，许多防空洞被私有化。现在是时候将它们重新收归使用，保护我们的公民。"
