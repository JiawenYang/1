l_simp_chinese:
 ZZZ_spirit_korea_confederation:0 "朝鲜半岛邦联"
 ZZZ_spirit_korea_confederation_desc:0 "两个主权政府保留各自的边界与制度，只在防务、外交与产业标准上共享一套常设机构。邦联不是统一国家：任何一方退出，整个框架都会停摆。"
 ZZZ_spirit_korea_unified:0 "朝鲜半岛统一"
 ZZZ_spirit_korea_unified_desc:0 "军事分界线已经消失，整个半岛由单一政府治理。南方的工业体系、北方的资源网络与合并后的军队被纳入统一指挥；整合红利确实存在，但吸收一个七十年来围绕另一套国家机器运转的社会，同样要付出代价。"
 ZZZ_spirit_uar_unity:0 "阿拉伯联合共和国"
 ZZZ_spirit_uar_unity_desc:0 "开罗把阿拉伯世界的资源与市场纳入同一套行政框架。共和国以泛阿拉伯旗帜作为正当性来源，但各省的自治诉求始终是内部裂痕。"
 ZZZ_spirit_balkan_federation:0 "巴尔干联邦"
 ZZZ_spirit_balkan_federation_desc:0 "贝尔格莱德以经济互认与共同防务为杠杆，把巴尔干各国拉进一个松散的联邦式共同体。成员国保留主权，联邦机构只掌握关税、基础设施与联合部队。"
 ZZZ_spirit_eurasian_state:0 "欧亚联盟国"
 ZZZ_spirit_eurasian_state_desc:0 "莫斯科以关税同盟、统一能源网与联合防空体系重新整合后苏联空间。主权让渡集中在宏观经济与战略力量，文化与行政仍留在各共和国手中。"
 ZZZ_spirit_eu_federation:0 "欧洲联邦"
 ZZZ_spirit_eu_federation_desc:0 "成员国让渡财政与防务主权后，布鲁塞尔成为事实上的联邦政府。共同预算、联合债券与一支欧洲军队，让联邦有了自己的财政与武力基础。"
 ZZZ_spirit_east_asia_sphere:0 "东亚共荣圈"
 ZZZ_spirit_east_asia_sphere_desc:0 "东京以日元贷款、资源采购与海上护航，把东亚经济体编入一个以日本为中心的等级秩序。共荣圈用贸易与安全绑定成员，代价是外交自主权。"
 ZZZ_spirit_greater_india:0 "大印度斯坦"
 ZZZ_spirit_greater_india_desc:0 "新德里把次大陆的关税、铁路与水源纳入单一行政空间。联邦以世俗宪政为框架，但宗教与语言分歧让中央的整合成本长期居高。"
 ZZZ_spirit_greater_china:0 "大中华"
 ZZZ_spirit_greater_china_desc:0 "完成国家统一后，北京把新生版图与南海航道一并纳入中央规划体系。统一市场与基建网络强化了动员能力，也把治理复杂度推到极限。"
 ZZZ_cr_spirit_korea_confederation:0 "调试：施加朝鲜半岛邦联精神"
 ZZZ_cr_spirit_korea_confederation_desc:0 "仅供调试：给当前国家挂上朝鲜半岛邦联精神，用于检查图标、文本与修正。正常流程由 korean_confederation_formed 自动施加。"
 ZZZ_cr_spirit_uar_unity:0 "调试：施加阿拉伯联合共和国精神"
 ZZZ_cr_spirit_uar_unity_desc:0 "仅供调试：给当前国家挂上阿拉伯联合共和国精神。正常流程由 ZZZ_UAR_victory 自动施加。"
 ZZZ_cr_spirit_balkan_federation:0 "调试：施加巴尔干联邦精神"
 ZZZ_cr_spirit_balkan_federation_desc:0 "仅供调试：给当前国家挂上巴尔干联邦精神。正常流程由 PRC_balkan_federation_supported 自动施加。"
 ZZZ_cr_spirit_eurasian_state:0 "调试：施加欧亚联盟国精神"
 ZZZ_cr_spirit_eurasian_state_desc:0 "仅供调试：给当前国家挂上欧亚联盟国精神。正常流程在 SOV_eurasian 外观标签成立后自动施加。"
 ZZZ_cr_spirit_eu_federation:0 "调试：施加欧洲联邦精神"
 ZZZ_cr_spirit_eu_federation_desc:0 "仅供调试：给当前国家挂上欧洲联邦精神。正常流程由 FRA_EU_federalized_global 自动施加。"
 ZZZ_cr_spirit_east_asia_sphere:0 "调试：施加东亚共荣圈精神"
 ZZZ_cr_spirit_east_asia_sphere_desc:0 "仅供调试：给当前国家挂上东亚共荣圈精神。正常流程由 gaw_japan_victory_settled 自动施加。"
 ZZZ_cr_spirit_greater_india:0 "调试：施加大印度斯坦精神"
 ZZZ_cr_spirit_greater_india_desc:0 "仅供调试：给当前国家挂上大印度斯坦精神。正常流程由 gaw_japan_victory_settled 自动施加。"
 ZZZ_cr_spirit_greater_china:0 "调试：施加大中华精神"
 ZZZ_cr_spirit_greater_china_desc:0 "仅供调试：给当前国家挂上大中华精神。正常流程由 gaw_china_victory_settled 或 PRC_taiwan_war_won 自动施加。"
 ZZZ_spirit_china_reunification:0 "统一的中国"
 ZZZ_spirit_china_reunification_desc:0 "两岸分治告一段落，岛屿的产业、港口与行政体系被并入大陆框架。统一解决了主权归属问题，但尚未让北京成为整个亚洲秩序的仲裁者。"
 ZZZ_spirit_indochina_federation:0 "印度支那联邦"
 ZZZ_spirit_indochina_federation_desc:0 "河内通过党组织网络、货币协调与共同基建，把老挝与柬埔寨编入同一个印度支那行政空间。联邦以越南为主导恢复了殖民时代的框架，较小成员对此始终心存戒备。"
 ZZZ_spirit_yugoslavia_revival:0 "南斯拉夫复兴"
 ZZZ_spirit_yugoslavia_revival_desc:0 "贝尔格莱德把西巴尔干重新拼成一个南斯拉夫框架，以关税同盟、共同警务与联合指挥换取旧日敌意的暂时搁置。老问题原样回来：一个首都能否拢住多个民族。"
 ZZZ_spirit_ottoman_restoration:0 "奥斯曼复兴"
 ZZZ_spirit_ottoman_restoration_desc:0 "新奥斯曼路线走到终点：安卡拉在旧帝国故地上重建势力范围，配上奥斯曼象征、军事顾问团与共同市场。共和国保留了宪法，治理方式却像复辟的帝国。"
 ZZZ_cr_spirit_china_reunification:0 "调试：施加统一的中国精神"
 ZZZ_cr_spirit_china_reunification_desc:0 "仅供调试：给当前国家挂上统一的中国精神，用于检查图标、文本与修正。正常流程由 PRC_taiwan_war_won 自动施加。"
 ZZZ_cr_spirit_indochina_federation:0 "调试：施加印度支那联邦精神"
 ZZZ_cr_spirit_indochina_federation_desc:0 "仅供调试：给当前国家挂上印度支那联邦精神。正常流程由 gaw_china_victory_settled 自动施加。"
 ZZZ_cr_spirit_yugoslavia_revival:0 "调试：施加南斯拉夫复兴精神"
 ZZZ_cr_spirit_yugoslavia_revival_desc:0 "仅供调试：给当前国家挂上南斯拉夫复兴精神。正常流程由 SER_destroy_albanian_n 自动施加。"
 ZZZ_cr_spirit_ottoman_restoration:0 "调试：施加奥斯曼复兴精神"
 ZZZ_cr_spirit_ottoman_restoration_desc:0 "仅供调试：给当前国家挂上奥斯曼复兴精神。正常流程在完成国策 TUR_ottoman_politics 后自动施加。"
 ZZZ_spirit_canzuk:0 "英加澳新联盟"
 ZZZ_spirit_canzuk_desc:0 "伦敦、渥太华、堪培拉与惠灵顿把市场、防务规划与外交代表合并进同一个 CANZUK 框架。人员自由流动与联合采购把四个英联邦经济体绑成一个集团，各国仍保留自己的议会。"
 ZZZ_spirit_maphilindo:0 "马菲林多"
 ZZZ_spirit_maphilindo_desc:0 "吉隆坡、马尼拉与雅加达重启马菲林多构想，组成一个马来世界的联邦：共同市场、协同海上巡逻，以及在南海问题上的统一立场。这一工程依靠的是薄弱的制度，以及各方对谁主导的深深戒心。"
 ZZZ_spirit_nordic_union:0 "北欧联盟"
 ZZZ_spirit_nordic_union_desc:0 "北欧五国把劳动力市场、防务采购与外交机构并入同一个北欧联盟。生活水平高、人口规模小，使整合成本低廉，联盟在欧洲的分量随之上升。"
 ZZZ_cr_spirit_canzuk:0 "调试：施加英加澳新联盟精神"
 ZZZ_cr_spirit_canzuk_desc:0 "仅供调试：给当前国家挂上英加澳新联盟精神。正常流程由国家旗标 is_CANZUK 自动施加。"
 ZZZ_cr_spirit_maphilindo:0 "调试：施加马菲林多精神"
 ZZZ_cr_spirit_maphilindo_desc:0 "仅供调试：给当前国家挂上马菲林多精神。正常流程由国家旗标 is_MAPHI 自动施加。"
 ZZZ_cr_spirit_nordic_union:0 "调试：施加北欧联盟精神"
 ZZZ_cr_spirit_nordic_union_desc:0 "仅供调试：给当前国家挂上北欧联盟精神。正常流程由国家旗标 is_SCA 自动施加。"
 ZZZ_spirit_cam_union:0 "中美洲联盟"
 ZZZ_spirit_cam_union_desc:0 "马那瓜把洪都拉斯、危地马拉、萨尔瓦多与伯利兹并入同一套党政与军事体系，重建了中美洲联邦的框架。联盟以革命先锋党为核心，整合靠的是行政任命与安全机构，而不是代议程序。"
 ZZZ_spirit_cam_republic:0 "中美洲共和国"
 ZZZ_spirit_cam_republic_desc:0 "圣萨尔瓦多把尼加拉瓜、洪都拉斯与伯利兹并入一个以总统府为核心的共和国，以安全部队、财政集中与对外协定维持秩序。共和国的合法性来自治安与增长成绩，而非联邦式的权力分享。"
 ZZZ_cr_spirit_cam_union:0 "调试：施加中美洲联盟精神"
 ZZZ_cr_spirit_cam_union_desc:0 "仅供调试：给当前国家挂上中美洲联盟精神。正常流程由 CAM_union_formed 自动施加。"
 ZZZ_cr_spirit_cam_republic:0 "调试：施加中美洲共和国精神"
 ZZZ_cr_spirit_cam_republic_desc:0 "仅供调试：给当前国家挂上中美洲共和国精神。正常流程由 CAM_republic_formed 自动施加。"
