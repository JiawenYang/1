l_simp_chinese:
 ZZZ_equipment_localization: "装备国产化程度"
 ZZZ_equipment_localization_01: "完全依赖进口"
 ZZZ_equipment_localization_01_desc: "武装部队几乎完全依赖外国供应商，备件、弹药与主战平台均需进口；一旦供应链中断，前线部队将迅速失去战斗力。"
 ZZZ_equipment_localization_02: "高度依赖进口"
 ZZZ_equipment_localization_02_desc: "大部分重型装备与关键部件仍来自国外，本国工厂仅能组装一小部分需求，军队易受外国禁运与航运延误冲击。"
 ZZZ_equipment_localization_03: "部分自给"
 ZZZ_equipment_localization_03_desc: "本国工业可满足部分军队需求，但关键子系统与先进平台仍需进口；部队尚能维持作战，但在持续压力下会出现短缺。"
 ZZZ_equipment_localization_04: "基本自给"
 ZZZ_equipment_localization_04_desc: "本国国防工业可满足军队大部分需求，进口仅限于少数专用部件，为长期作战提供了稳固基础。"
 ZZZ_equipment_localization_05: "高度自给"
 ZZZ_equipment_localization_05_desc: "本国工厂几乎能提供陆军所需全部装备，从轻武器到车辆；对外依赖很小，可承受供应链冲击。"
 ZZZ_equipment_localization_06: "完全自给"
 ZZZ_equipment_localization_06_desc: "完整的本国国防工业体系几乎能供应军队全部装备；战略自主使部队在对外供应链被切断时仍能持续作战。"
 BLOCK_SALARY_DECREASE_TT: "现行劳动法规框架禁止下调最低工资水平。"

