l_simp_chinese:
 ZZ_amphibious_tank_chassis_pt76: "PT-76"
 ZZ_amphibious_tank_chassis_pt76_desc: "苏联战后第一代水陆坦克，装备海军步兵与侦察部队，可浮渡江河实施两栖侦察与火力支援。"
 ZZ_amphibious_tank_chassis_type63: "Type-63"
 ZZ_amphibious_tank_chassis_type63_desc: "中国在PT-76基础上自行研制的水陆坦克，换用85毫米坦克炮，长期装备海军陆战队与两栖机械化部队。"
 ZZ_amphibious_tank_chassis_pt76b: "PT-76B"
 ZZ_amphibious_tank_chassis_pt76b_desc: "PT-76的改进型，换装双向火炮稳定器与新型并列机枪，是冷战初期苏军海军步兵与侦察分队的主力两栖坦克。"
 ZZ_amphibious_tank_chassis_pt85: "PT-85"
 ZZ_amphibious_tank_chassis_pt85_desc: "朝鲜以PT-76为基础自行改进的水陆坦克，换装85毫米坦克炮并加长车体，装备人民军侦察与机械化部队。"
 ZZ_amphibious_tank_chassis_type63_1: "Type-63-I"
 ZZ_amphibious_tank_chassis_type63_1_desc: "63式的第一次改进型，换装新型柴油机并改进水上推进装置，航速与可靠性均有提升。"
 ZZ_amphibious_tank_chassis_type63_2: "Type-63-II"
 ZZ_amphibious_tank_chassis_type63_2_desc: "63式的第二次改进型，换装新型火控与并列机枪，战斗效能进一步提高。"
 ZZ_amphibious_tank_chassis_type63a: "Type-63A"
 ZZ_amphibious_tank_chassis_type63a_desc: "63式水陆坦克的重大改进型，换装105毫米线膛炮与新型炮塔装甲，是90年代末中国海军陆战队的主力两栖坦克。"
