 eng_ajax_fe_decision:0 "通用动力阿贾克斯"
 eng_ajax_fe_decision_desc:0 "解决噪音和振动试验，批准阿贾克斯侦察车服役于英国陆军。"
 eng_apache_ah2_fe_decision:0 "阿帕奇AH-2"
 eng_apache_ah2_fe_decision_desc:0 "接收翻新的AH-64E阿帕奇卫士，命名为阿帕奇AH-2，服役于陆军航空兵。"
 eng_boxer_miv_fe_decision:0 "拳师机械化步兵车"
 eng_boxer_miv_fe_decision_desc:0 "接收首批拳师机械化步兵车，装备新组建的打击旅。"
 eng_challenger3_fe_decision:0 "挑战者3"
 eng_challenger3_fe_decision_desc:0 "完成莱茵金属挑战者3火力升级，以新型120毫米滑膛炮塔为核心，授权车队改装。"
 eng_dreadnought_fe_decision:0 "无畏级"
 eng_dreadnought_fe_decision_desc:0 "完成无畏级弹道导弹潜艇，从先锋级接替持续海上威慑任务。"
 eng_e7_wedgetail_fe_decision:0 "波音E-7楔尾AEW1"
 eng_e7_wedgetail_fe_decision_desc:0 "引入E-7楔尾AEW1取代哨兵AEW1执行空中预警任务。"
 eng_p8a_poseidon_fe_decision:0 "波音P-8A海神MRA1"
 eng_p8a_poseidon_fe_decision_desc:0 "在皇家空军洛西茅斯基地组建海神MRA1海上巡逻机部队。"
 eng_protector_rg1_fe_decision:0 "保护者RG1"
 eng_protector_rg1_fe_decision_desc:0 "认证GA-ASI MQ-9B天空卫士，命名为保护者RG1，作为皇家空军首款获准在民用空域飞行的远程无人系统。"
 eng_sky_sabre_fe_decision:0 "天空军刀"
 eng_sky_sabre_fe_decision_desc:0 "部署天空军刀防空系统，整合长颈鹿雷达、拉斐尔MIC4AD作战管理和陆基拦截导弹。"
 eng_tempest_fe_decision:0 "BAE暴风"
 eng_tempest_fe_decision_desc:0 "在全球空中作战计划下完成第六代暴风战斗机研发并开始量产。"
 eng_type26_fe_decision:0 "26型城级"
 eng_type26_fe_decision_desc:0 "服役首艘26型反潜护卫舰格拉斯哥号，作为未来航母打击群护航的中坚。"
 eng_type31_fe_decision:0 "31型灵感级"
 eng_type31_fe_decision_desc:0 "将通用型31型护卫舰首舰冒险者号服役于皇家海军。"
 eng_type83_fe_decision:0 "83型驱逐舰"
 eng_type83_fe_decision_desc:0 "研发并服役83型综合防空反导驱逐舰，在2030年代取代45型。"
 future_aircraft_category:0 "未来航空计划"
 future_naval_category:0 "未来海军计划"
 future_tanks_category:0 "未来装甲计划"
 ger_212cd_fe_decision:0 "212CD型潜艇"
 ger_212cd_fe_decision_desc:0 "完成与挪威联合的212CD通用设计AIP潜艇项目，接收首艇服役。"
 ger_ch53k_fe_decision:0 "CH-53K种马王"
 ger_ch53k_fe_decision_desc:0 "引进CH-53K重型运输直升机，取代CH-53G机队。"
 ger_eurodrone_fe_decision:0 "欧洲无人机"
 ger_eurodrone_fe_decision_desc:0 "完成欧洲MALE RPAS欧洲无人机认证，开始向德国、法国、意大利和西班牙交付。"
 ger_f126_fe_decision:0 "F126科隆级"
 ger_f126_fe_decision_desc:0 "服役F126护卫舰首舰F265科隆号，用于持续海外稳定和护航任务。"
 ger_f35a_fe_decision:0 "F-35A闪电II"
 ger_f35a_fe_decision_desc:0 "接收可携带核武器的F-35A，取代狂风IDS执行核共享和打击任务。"
 ger_heron_tp_fe_decision:0 "苍鹭TP"
 ger_heron_tp_fe_decision_desc:0 "租赁IAI苍鹭TP作为德国武装部队的过渡型武装长航时无人飞行器。"
 ger_kf51_panther_fe_decision:0 "KF51黑豹"
 ger_kf51_panther_fe_decision_desc:0 "完成莱茵金属KF51黑豹演示车试验，推出130毫米武装平台量产及出口。"
 ger_leopard3_mgcs_fe_decision:0 "豹3（MGCS）"
 ger_leopard3_mgcs_fe_decision_desc:0 "将法德主地面战斗系统（豹2后继型）投入量产。"
 ger_p8a_poseidon_fe_decision:0 "波音P-8A海神"
 ger_p8a_poseidon_fe_decision_desc:0 "接收P-8A海神，取代P-3C猎户座执行远程海上巡逻任务。"
 ger_tiger_mkiii_fe_decision:0 "虎式MkIII"
 ger_tiger_mkiii_fe_decision_desc:0 "完成虎式MkIII中期寿命升级，为德国攻击直升机部队配备新航电、传感器和武器集成。"
 jh7a_decision:0 "西安JH-7A"
 jh7a_decision_desc:0 "批准JH-7飞豹机队中期寿命升级，配备改进的航电、瞄准系统和反舰能力。"
