 hq_17_decision:0 "生成红旗-17设计"
 hq_17_decision_desc:0 "红旗-17是中国新一代近程防空导弹系统。"
 pokpung_ho_decision:0 "生成暴風虎设计"
 pokpung_ho_decision_desc:0 "暴風虎（Pokpung-ho）是朝鲜自主研发的主战坦克，基于T-72改进，配备125毫米滑膛炮和反应装甲，2002年开始研发。"
 songun_ho_decision:0 "生成先军虎设计"
 songun_ho_decision_desc:0 "先军虎（Songun-ho）是暴風虎的改进版本，增强了装甲防护和火控系统，2010年代开始服役。"
 m2020_decision:0 "生成M-2020设计"
 m2020_decision_desc:0 "M-2020是朝鲜最新型主战坦克，2020年公开亮相，外形类似俄罗斯T-14，配备遥控武器站和复合装甲。"
 m2010_decision:0 "生成M-2010设计"
 m2010_decision_desc:0 "M-2010是朝鲜新一代装甲运兵车，2010年代开始服役，采用复合装甲和改进的武器系统。"
 juchepo_decision:0 "生成主体炮设计"
 juchepo_decision_desc:0 "主体炮（Juche-Po）是朝鲜自主研发的自行火炮系统，配备先进火控系统和增程弹药。"
 zulfiqar3_decision:0 "生成佐勒菲卡尔-3设计"
 zulfiqar3_decision_desc:0 "佐勒菲卡尔-3是伊朗佐勒菲卡尔系列坦克的最新型号，增强了装甲防护和火力，2016年开始服役。"
 moharram6_decision:0 "生成穆哈兰姆-6设计"
