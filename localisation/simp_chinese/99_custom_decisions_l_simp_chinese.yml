 c5m_decision:0 "生成C-5M超级银河设计"
 c5m_decision_desc:0 "C-5M超级银河是世界上最强大的战略运输机。它可携带多达129吨货物，包括两辆M1艾布拉姆斯坦克，在120000磅载荷下航程超过5500英里。"
 f15ex_decision:0 "生成F-15EX鹰II设计"
 f15ex_decision_desc:0 "F-15EX鹰II是F-15鹰的先进变体。它配备了AN/APG-82雷达等改进航电系统，拥有23个挂点，武器载荷能力超过29000磅，可携带多达12枚AMRAAM导弹。"
 b21_decision:0 "生成B-21突袭者设计"
 b21_decision_desc:0 "B-21突袭者是由诺斯罗普格鲁曼公司开发的下一代战略轰炸机。它具有先进的隐身技术、远程打击能力，设计用于穿透现代防空系统。"
 rq4_decision:0 "生成RQ-4全球鹰设计"
 rq4_decision_desc:0 "RQ-4全球鹰是一种高空长航时无人驾驶航空器。它设计用于高空情报、监视和侦察任务。"
 mq9_decision:0 "生成MQ-9收割者设计"
 mq9_decision_desc:0 "MQ-9收割者是一种中高空长航时无人作战航空器。它设计用于精确打击和侦察任务。"
 ac130j_decision:0 "生成AC-130J幽灵骑士设计"
 ac130j_decision_desc:0 "AC-130J幽灵骑士是一种现代化空中炮艇机。它配备了先进的航空电子设备、精确制导武器和30毫米加农炮，用于近距离空中支援任务。"
 e7_decision:0 "生成E-7楔尾设计"
 e7_decision_desc:0 "E-7楔尾是一种现代空中预警和控制飞机。它配备了诺斯罗普格鲁曼多用途电子扫描阵列雷达，用于空中战斗管理和指挥控制。"
 j10a_decision:0 "生成歼-10A设计"
 j10a_decision_desc:0 "歼-10A是歼-10战斗机的一个变体。与初期的歼-10相比，它配备了改进的航空电子设备和武器能力。"
 j10c_decision:0 "生成歼-10C设计"
 j10c_decision_desc:0 "歼-10C是歼-10战斗机的先进变体。它配备了有源相控阵雷达、改进的航空电子设备和增强的武器能力，是中国最强大的第四代战斗机之一。"
 j11b_decision:0 "生成歼-11B/BS设计"
 j11b_decision_desc:0 "歼-11B/BS是苏-27战斗机的中国变体。它配备了中国自主研制的航空电子设备、发动机和武器系统，提供增强的性能和可靠性。"
 j15_decision:0 "Create Shenyang J-15 Design"
 j15_decision_desc:0 "The Shenyang J-15 is a carrier-based fighter based on the Su-33. It is China's first carrier-borne fighter, designed for operations from the Liaoning and Shandong aircraft carriers."
 j15t_decision:0 "生成歼-15T设计"
 j15t_decision_desc:0 "歼-15T是歼-15的改进型弹射起飞变体。它具有加强的机身和起落架，用于从中国003型航空母舰上进行弹射操作。"
 j15d_decision:0 "Create Shenyang J-15D Design"
 j15d_decision_desc:0 "The Shenyang J-15D is an electronic warfare variant of the J-15. It is equipped with electronic warfare pods and systems, providing stand-off jamming and electronic attack capabilities."
 j16_decision:0 "沈阳J-16"
 j16_decision_desc:0 "开始J-16多用途打击战斗机量产，基于Su-30MKK机体配装国产航电和武器。"
 j16d_decision:0 "生成歼-16D设计"
 j16d_decision_desc:0 "歼-16D是歼-16的电子战变体。它配备了电子战吊舱、雷达干扰系统和反辐射导弹。"
 j20_decision:0 "生成歼-20A设计"
 j20_decision_desc:0 "歼-20A是中国首款第五代隐身战斗机。它具有先进的隐身技术、超音速巡航能力和复杂的航空电子系统。"
 j20b_decision:0 "Create Chengdu J-20B Design"
 j20b_decision_desc:0 "The Chengdu J-20B is an improved variant of the J-20A. It features more advanced avionics and weapons systems, providing enhanced performance and combat capabilities."
 j20s_decision:0 "Create Chengdu J-20S Design"
 j20s_decision_desc:0 "The Chengdu J-20S is a two-seat variant of the J-20. It can be used for training, command and control of drones, and other missions."
 j35_decision:0 "生成歼-35设计"
 j35_decision_desc:0 "歼-35是中国首款第五代舰载隐身战斗机。它具有隐身技术、先进的航空电子设备，设计用于从中国航空母舰上操作。"
 j36_decision:0 "生成歼-36设计"
 j36_decision_desc:0 "歼-36是中国新一代战斗机。它具有先进的隐身技术和多用途作战能力。"
 y20_decision:0 "生成运-20设计"
 y20_decision_desc:0 "运-20是中国首款自主研制的战略运输机。它的有效载荷能力超过66吨，可以运输包括坦克和直升机在内的大型设备。"
 y9_decision:0 "Create Xian Y-9 Design"
 y9_decision_desc:0 "The Xian Y-9 is a medium transport aircraft based on the Y-8. It has improved performance, range, and payload capacity compared to its predecessor."
 h6k_decision:0 "生成轰-6K设计"
 h6k_decision_desc:0 "轰-6K是轰-6轰炸机的改进变体。它配备了现代化的航空电子设备、增加的航程，并且能够携带远程巡航导弹。"
 h6n_decision:0 "生成轰-6N设计"
 h6n_decision_desc:0 "轰-6N是轰-6的远程战略轰炸机变体。它具有增加的航程，并且可以携带空射弹道导弹。"
 kj2000_decision:0 "生成空警-2000设计"
 kj2000_decision_desc:0 "空警-2000是中国首款空中预警和控制飞机。它基于伊尔-76机身，配备了相控阵雷达系统。"
 kj500_decision:0 "Create Xian KJ-500 Design"
 kj500_decision_desc:0 "The Xian KJ-500 is a medium-sized AEW&C aircraft based on the Y-9 airframe. It features a domestically developed active phased array radar."
 kj600_decision:0 "生成空警-600设计"
 kj600_decision_desc:0 "空警-600是中国首款舰载预警机。它设计用于从中国航空母舰上操作，提供预警和指挥能力。"
 wingloong1_decision:0 "Create Chengdu Wing Loong I Design"
 wingloong1_decision_desc:0 "The Chengdu Wing Loong I is a medium-altitude long-endurance unmanned aerial vehicle. It is designed for reconnaissance and precision strike missions."
 wingloong2_decision:0 "生成翼龙-2设计"
 wingloong2_decision_desc:0 "翼龙-2是翼龙-1的改进变体。它具有增加的有效载荷能力、更长的续航时间和增强的航空电子设备。"
 rainbow4_decision:0 "Create CH Rainbow-4 Design"
 rainbow4_decision_desc:0 "The CH Rainbow-4 is a medium-altitude long-endurance unmanned aerial vehicle developed by China Aerospace Science and Technology Corporation. It is designed for reconnaissance and strike missions."
 rainbow5_decision:0 "Create CH Rainbow-5 Design"
 rainbow5_decision_desc:0 "The CH Rainbow-5 is a larger and more capable variant of the Rainbow series unmanned aerial vehicles. It has significantly increased payload capacity and endurance."
 attack11_decision:0 "生成攻击-11设计"
 attack11_decision_desc:0 "攻击-11是一种隐身无人作战飞机。它具有飞翼设计，设计用于精确打击任务。"
 wz7_decision:0 "生成无侦-7设计"
 wz7_decision_desc:0 "无侦-7是一种高空长航时侦察无人机。它设计用于高空战略侦察任务。"
 z10_decision:0 "Create CAIC Z-10 Design"
 z10_decision_desc:0 "The CAIC Z-10 is China's first dedicated attack helicopter. It is equipped with advanced avionics, anti-tank missiles, and air-to-air missiles."
 su35_decision:0 "生成Su-35设计"
 su35_decision_desc:0 "Su-35 Flanker-E是俄罗斯先进的第四代+战斗机。它配备了先进的航电系统、矢量推力发动机和强大的武器系统。"
 su57_decision:0 "生成Su-57设计"
 su57_decision_desc:0 "Su-57 Felon是俄罗斯首款第五代隐身战斗机。它具有先进的隐身技术、超音速巡航能力和复杂的航电系统。"
 mig35_decision:0 "生成MiG-35设计"
 mig35_decision_desc:0 "MiG-35 Fulcrum-F是俄罗斯先进的第四代+战斗机。它配备了先进的航电系统和武器系统。"
 su25sm3_decision:0 "生成Su-25SM3设计"
 su25sm3_decision_desc:0 "Su-25SM3是Su-25的现代化改进型。它配备了先进的航电系统和武器系统，提高了作战能力。"
 su34m_decision:0 "生成Su-34M设计"
 su34m_decision_desc:0 "Su-34M是Su-34的现代化改进型。它配备了先进的航电系统和武器系统，提高了作战能力。"
 tu160m2_decision:0 "生成Tu-160M2设计"
 tu160m2_decision_desc:0 "Tu-160M2是Tu-160的现代化改进型。它配备了先进的航电系统和武器系统，提高了作战能力。"
 tu95msm_decision:0 "生成Tu-95MSM设计"
 tu95msm_decision_desc:0 "Tu-95MSM是Tu-95的现代化改进型。它配备了先进的航电系统和武器系统，提高了作战能力。"
 il76md90a_decision:0 "生成Il-76MD-90A设计"
 il76md90a_decision_desc:0 "Il-76MD-90A是Il-76的现代化改进型。它配备了先进的发动机和航电系统，提高了性能和可靠性。"
 il112v_decision:0 "生成Il-112V设计"
 il112v_decision_desc:0 "Il-112V是俄罗斯新一代轻型运输机。它设计用于取代老旧的安-26运输机。"
 an178_decision:0 "Create An-178 Design"
 an178_decision_desc:0 "The An-178 is a medium transport aircraft jointly developed by Ukraine and Russia. It is designed to replace the aging An-12 transport aircraft."
 a50u_decision:0 "生成A-50U设计"
 a50u_decision_desc:0 "A-50U是A-50的现代化改进型。它配备了先进的雷达和航电系统，提高了预警能力。"
 a100_decision:0 "Create A-100 Premier Design"
 a100_decision_desc:0 "The A-100 Premier is a new generation early warning aircraft of Russia. It features advanced active phased array radar and avionics."
 su30sm2_decision:0 "Create Su-30SM2 Design"
 su30sm2_decision_desc:0 "The Su-30SM2 is a modernized variant of the Su-30SM. It features advanced avionics and weapons systems, improving its combat capabilities."
 mig29m2_decision:0 "Create MiG-29M2 Design"
 mig29m2_decision_desc:0 "The MiG-29M2 is a modernized variant of the MiG-29. It features advanced avionics and weapons systems, improving its combat capabilities."
 su34mp_decision:0 "Create Su-34MP Design"
 su34mp_decision_desc:0 "The Su-34MP is an electronic warfare variant of the Su-34. It features advanced electronic warfare equipment and systems."
 gripen_e_decision:0 "生成JAS 39E鹰狮设计"
 gripen_e_decision_desc:0 "JAS 39E鹰狮是瑞典萨博公司开发的最新型号单发战斗机。它配备了先进的航电系统、更大的航程和更强的武器挂载能力。"
 rafale_f4_decision:0 "生成阵风F4设计"
 rafale_f4_decision_desc:0 "阵风F4是法国达索公司开发的阵风战斗机最新型号。它配备了先进的航电系统、更强的多用途作战能力和空中加油能力。"
 typhoon_tranche3_decision:0 "生成欧洲战斗机设计"
 typhoon_tranche3_decision_desc:0 "欧洲战斗机是由英、德、意、西四国联合研发的多用途战斗机。它配备了先进的航电系统、更强的武器挂载能力和空中加油能力。"
 sirtap_decision:0 "生成SIRTAP设计"
 sirtap_decision_desc:0 "SIRTAP是欧洲多国联合开发的中程战术无人机系统。它具备侦察监视和轻量打击能力。"
 falco_evo_decision:0 "生成Falco EVO设计"
 falco_evo_decision_desc:0 "Falco EVO是意大利莱昂纳多公司开发的无人机的最新型号。它具备更长的续航时间和更大的有效载荷能力。"
 a400m_decision:0 "生成A400M设计"
 a400m_decision_desc:0 "A400M Atlas是欧洲空中客车公司开发的军用运输机。它具备战略运输能力和战术起降能力。"
 a330_mrtt_decision:0 "Create A330 MRTT Design"
 a330_mrtt_decision_desc:0 "The A330 MRTT is an aerial refueling tanker based on the A330 airliner developed by Airbus of Europe. It features strong aerial refueling capability and transport capability."
 a330_aewc_decision:0 "生成A330 AEW&C设计"
 a330_aewc_decision_desc:0 "A330 AEW&C是欧洲空中客车公司基于A330客机开发的空中预警机。它配备了先进的有源相控阵雷达和指挥控制系统。"
 kf21_decision:0 "生成KF-21设计"
 kf21_decision_desc:0 "KF-21 Boramae是韩国航空航天工业公司研发的双发45代多用途战斗机。它配备了AESA雷达、先进航电系统和双发动机。"
 lca_tejas_decision:0 "生成LCA光辉Mk1设计"
 lca_tejas_decision_desc:0 "LCA光辉是印度HAL公司研发的单发轻型45代战斗机。它配备了先进的航电系统和精确制导武器能力。"
 kc390_decision:0 "生成KC-390设计"
 kc390_decision_desc:0 "KC-390 Millennium是巴西航空工业公司研发的大型运输机加油机。它具备战略运输和空中加油能力。"
 kawasaki_p1_decision:0 "生成川崎P-1设计"
 kawasaki_p1_decision_desc:0 "Kawasaki P-1是日本海上自卫队的新一代海上巡逻机。它配备四发涡扇发动机、内置弹仓和反潜作战系统。"
 jf17_block3_decision:0 "生成JF-17雷电Block 3设计"
 jf17_block3_decision_desc:0 "JF-17雷电Block 3是巴基斯坦航空工业公司与中国联合研发的单发45代多用途战斗机。它配备了AESA雷达和PL-15I空空导弹。"
 lca_tejas_mk2_decision:0 "生成LCA光辉Mk2设计"
 lca_tejas_mk2_decision_desc:0 "LCA光辉Mk2是印度HAL公司在Mk1基础上发展的中型多用途战斗机。它配备了GE F414发动机、Uttam AESA雷达和11个武器挂架。"
 hurjet_decision:0 "生成Hurjet设计"
 hurjet_decision_desc:0 "Hurjet是土耳其航空航天工业公司研发的高级教练机轻型攻击机。它配备了GE F404发动机，最大速度达14马赫。"
 heron_tp_decision:0 "生成苍鹭TP设计"
 heron_tp_decision_desc:0 "苍鹭TP是以色列航空航天工业公司研发的大型长航时无人机。它配备了PT6A涡桨发动机，续航时间超过30小时，有效载荷达2吨。"
 h6g_decision:0 "生成轰-6G设计"
 h6g_decision_desc:0 "轰-6G是中国海军的海上巡逻机变体。基于轰-6D改进，配备反舰导弹和先进航电系统，用于海上侦察和打击任务。"
