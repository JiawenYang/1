l_simp_chinese:
 #烈焰升腾 以色列/巴勒斯坦事件链（移植版）
 isrwar.1.t: "特朗普和平计划提案"
 isrwar.1.d: "华盛顿公布所谓“世纪协议”：承认耶路撒冷为以色列首都，并背书以色列对约旦河西岸定居点的主权。特拉维夫必须在推进定居点与接受一揽子经济援助之间做出选择。"
 isrwar.1.a: "我们将进军西岸"
 isrwar.1.b: "以色列版马歇尔计划！"
 isrwar.2.t: "莱哈瓦游行"
 isrwar.2.d: "极右翼组织莱哈瓦在耶路撒冷老城游行，高呼“一国方案”，并与阿拉伯居民爆发冲突。警方疲于维持秩序。"
 isrwar.2.a: "他们在阻碍和平！"
 isrwar.2.b: "我们需要一国方案！"
 isrwar.3.t: "内塔尼亚胡宣布国家紧急状态"
 isrwar.3.d: "联合政府瓦解、街头暴力蔓延，总理宣布国家紧急状态，试图以强硬姿态稳住右翼基本盘。"
 isrwar.3.a: "是！内塔尼亚胡！"
 isrwar.4.t: "宣布成立联合政府"
 isrwar.4.d: "利库德与蓝白党签署轮替协议，组成紧急联合政府，承诺共同应对疫情与安全危机。"
 isrwar.4.a: "耶！"
 isrwar.5.t: "联合政府崩溃"
 isrwar.5.d: "预算案与司法任命之争让联合政府走到尽头。议会解散，以色列两年内第四次走向大选。"
 isrwar.5.a: "妈的。"
 isrwar.6.t: "堕落歌利亚行动"
 isrwar.6.d: "总参谋部批准一项区域性行动：削弱伊朗在叙利亚与伊拉克的军事存在，打击跨境恐怖网络，确保北部边境安全。"
 isrwar.6.a: "我们永远不会被消灭……"
 isrwar.7.t: "巴勒斯坦方面抗议以色列行动"
 isrwar.7.d: "拉姆安拉与伯利恒爆发示威。巴勒斯坦权力机构谴责以色列的单方面行动，却无力控制街头。"
 isrwar.7.a: "他们一直都这样，不是吗？"
 isrwar.8.t: "巴勒斯坦方面招募志愿者"
 isrwar.8.d: "阿克萨烈士旅等派系在难民营公开招募志愿者，步枪与自制爆炸物开始在西岸流通。"
 isrwar.8.a: "令人担忧……"
 isrwar.9.t: "希克迈特·塔米米遇害"
 isrwar.9.d: "巴勒斯坦知名活动人士希克迈特·塔米米在冲突中身亡。消息在两小时内传遍阿拉伯世界，各方都在等待报复。"
 isrwar.9.a: "密切关注局势。"
 isrwar.10.t: "以色列新总统就任"
 isrwar.10.d: "议会选举赫尔佐格为总统。他呼吁弥合社会裂痕，右翼媒体却称其为“软弱的选择”。"
 isrwar.10.a: "恭喜赫尔佐格总统"
 isrwar.11.t: "哈马斯动员"
 isrwar.11.d: "哈马斯宣布总动员，接管加沙治安，取消选举，并向边境集结武装人员。"
 isrwar.11.a: "狗屎撞上旋转的风扇……"
 isrwar.12.t: "第四次起义打响"
 isrwar.12.d: "巴勒斯坦各派宣布发动第四次起义。武装人员向以色列阵地开火，以色列南部进入防空状态。"
 isrwar.12.a: "我操"
 isrwar.13.t: "以色列总动员"
 isrwar.13.d: "预备役征召令下达，装甲部队向加沙与北部边境集结。"
 isrwar.13.a: "全面动员"
 isrwar.15.t: "阿以战争：两国方案"
 isrwar.15.d: "在数月流血之后，以色列接受两国方案：约旦河西岸与加沙交由巴勒斯坦管理，以换取停火与地区承认。"
 isrwar.15.a: "这是唯一的出路"
