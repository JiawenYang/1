 # CHARACTERS #
URG_luis_alberto_lacalle_char: "路易斯·阿尔贝托·拉卡列·波乌"
URG_luis_alberto_lacalle_char_desc: "路易斯·阿尔贝托·拉卡列·波乌于1961年8月11日出生在蒙得维的亚，来自一个政治世家。他的父亲路易斯·阿尔贝托·拉卡列曾任乌拉圭总统，在1968年至1972年间任职。拉卡列·波乌毕业于乌拉圭天主教大学法律系，后来成为一名律师和商人。他于1991年首次进入政治领域，当选为众议员，并于1999年当选为参议员。2000年至2005年期间，他担任乌拉圭银行行长，之后于2010年至2015年期间担任乌拉圭副总统。2019年，他作为民族党候选人当选总统，结束了左翼政党广泛阵线长达15年的统治。拉卡列·波乌以其温和的保守主义立场和对经济改革的承诺而闻名，旨在促进增长和减少政府支出。"

URG_jose_antonio_mujica_char: "何塞·安东尼奥·穆希卡"
URG_jose_antonio_mujica_char_desc: "何塞·安东尼奥·穆希卡于1935年5月20日出生在蒙得维的亚，是乌拉圭历史上最具标志性和争议的人物之一。年轻时，他加入了左翼游击队图帕马罗斯，参与了反对乌拉圭军事独裁政权的武装斗争。穆希卡在监狱中度过了14年，遭受了酷刑和虐待，但从未放弃他的理想。独裁政权结束后，他于1985年获释，并于1989年当选为众议员。2005年至2008年期间，他担任农业部长，之后于2009年当选副总统。2010年，他在广泛阵线初选中击败了总统塔瓦雷·巴斯克斯，成为该党总统候选人。尽管最初被视为局外人，但穆希卡在选举中以压倒性优势获胜，成为乌拉圭历史上最受欢迎的总统之一。他以其简朴的生活方式、谦逊的态度和对社会正义的承诺而闻名，拒绝住在总统官邸，而是住在蒙得维的亚郊区的一间小房子里。穆希卡的总统任期以社会改革、经济增长和外交政策独立性为标志。"

URG_tabare_vazquez_char: "塔瓦雷·巴斯克斯"
URG_tabare_vazquez_char_desc: "塔瓦雷·巴斯克斯于1940年1月17日出生在蒙得维的亚，是乌拉圭广泛阵线的创始人之一。他毕业于乌拉圭大学医学院，成为一名医生，专门研究小儿科和传染病。巴斯克斯于1985年首次进入政治领域，当选为蒙得维的亚市长，成为乌拉圭历史上第一位左翼市长。1994年，他当选为参议员，并于2002年再次当选蒙得维的亚市长。2004年，他作为广泛阵线候选人当选总统，成为乌拉圭历史上第一位左翼总统。他的总统任期以社会改革、经济稳定和外交政策调整为标志。2015年，他再次当选总统，成为乌拉圭历史上第二位连任的总统。巴斯克斯以其务实的领导风格和对社会福利的承诺而闻名。"

 # PARTIES #
URG_blancos_party: "民族党"
URG_blancos_party_long: "乌拉圭民族党"
URG_colorados_party: "红党"
URG_colorados_party_long: "乌拉圭红党"
URG_frente_amplio_party: "广泛阵线"
URG_frente_amplio_party_long: "乌拉圭广泛阵线"

 # NATIONAL SPIRITS #
URG_the_2005_legacy: "2005年遗产"
URG_the_2005_legacy_desc: "2005年，乌拉圭迎来了历史性的转折点。在经历了多年的经济危机和政治动荡后，广泛阵线赢得了总统选举，塔瓦雷·巴斯克斯成为乌拉圭历史上第一位左翼总统。这标志着乌拉圭政治格局的根本转变，从传统的两党制（红党和民族党）转向了一个更加多元化的政治体系。广泛阵线政府实施了一系列社会改革，包括扩大教育和医疗服务、提高最低工资、改善社会保障等。这些改革帮助乌拉圭从经济危机中复苏，并在随后的几年里实现了稳定的经济增长。尽管面临挑战，但广泛阵线的执政为乌拉圭带来了新的希望和机遇，改变了国家的发展轨迹。"

URG_structural_black_economy: "结构性黑市经济"
URG_structural_black_economy_desc: "乌拉圭的黑市经济是一个长期存在的问题，影响着国家的经济发展和社会稳定。据估计，黑市经济占乌拉圭GDP的20%以上，涉及多个领域，包括贸易、金融、劳动力市场等。黑市经济的存在导致了税收流失、竞争不公平、社会不平等加剧等问题。尽管政府采取了一系列措施来打击黑市经济，但由于其结构性和复杂性，这一问题仍然难以解决。黑市经济的根源可以追溯到乌拉圭的历史和经济结构，包括高税率、繁琐的法规、失业问题等。解决黑市经济问题需要综合的政策措施，包括改革税收制度、简化法规、促进就业等。"

URG_peaceful_coexistence: "和平共处"
URG_peaceful_coexistence_desc: "乌拉圭以其和平稳定的政治环境而闻名，这在拉丁美洲地区是非常罕见的。自1985年恢复民主以来，乌拉圭没有经历过军事政变、内战或大规模的政治暴力。不同政治派别之间保持着相对和平的共处关系，尽管存在分歧，但通过对话和协商解决问题成为常态。这种和平共处的氛围为乌拉圭的经济发展和社会稳定提供了重要保障。乌拉圭的民主制度相对成熟，公民参与度高，法治得到尊重。这种政治文化的形成与乌拉圭的历史、社会结构和政治制度密切相关。"

URG_uruguayan_identity: "乌拉圭身份认同"
URG_uruguayan_identity_desc: "乌拉圭是一个小国，但拥有强烈的民族身份认同。乌拉圭人以其独特的文化、历史和社会价值观而自豪。乌拉圭的民族身份认同源于其历史经历，包括西班牙殖民统治、独立战争、移民浪潮等。乌拉圭文化融合了欧洲、非洲和美洲本土文化的元素，形成了独特的风格。乌拉圭人重视教育、民主和社会福利，这些价值观在国家的发展中发挥了重要作用。乌拉圭的民族身份认同还体现在其体育文化中，足球是乌拉圭最受欢迎的运动，乌拉圭国家队曾两次获得世界杯冠军。这种身份认同为乌拉圭社会提供了凝聚力和归属感。"

 # EVENTS #
URG.1.t: "2019年乌拉圭选举"
URG.1.d: "2019年乌拉圭举行总统选举，这是一次具有历史意义的选举。在广泛阵线执政15年后，乌拉圭选民决定改变方向，选择了民族党候选人路易斯·阿尔贝托·拉卡列·波乌作为新总统。这标志着乌拉圭政治格局的再次转变，从左翼政府转向了右翼政府。选举结果反映了乌拉圭选民对经济改革和政治变革的期待。拉卡列·波乌承诺实施一系列经济政策，包括减税、减少政府支出、促进私人投资等，以推动乌拉圭经济的进一步发展。同时，他也强调了维护社会稳定和保障公民权利的重要性。"
URG.1.a: "拉卡列·波乌当选总统"

URG.2.t: "穆希卡的退休"
URG.2.d: "何塞·安东尼奥·穆希卡，乌拉圭历史上最具传奇色彩的总统之一，宣布正式退休。这位84岁的老人在经历了几十年的政治生涯后，决定离开政坛，回归平静的生活。穆希卡的退休标志着一个时代的结束，他的政治遗产将永远铭刻在乌拉圭历史上。尽管他不再担任公职，但他的思想和价值观将继续影响乌拉圭的政治和社会发展。"
URG.2.a: "传奇落幕"

URG.3.t: "COVID-19疫情"
URG.3.d: "COVID-19疫情在全球范围内爆发，乌拉圭也未能幸免。尽管乌拉圭政府采取了一系列措施来控制疫情，包括封锁边境、限制人员流动、推广疫苗接种等，但疫情仍然对乌拉圭的经济和社会造成了重大影响。旅游业、服务业和制造业受到了严重冲击，失业率上升，经济增长放缓。同时，疫情也暴露了乌拉圭医疗体系的一些薄弱环节，如医疗资源不足、农村地区医疗服务覆盖不够等。乌拉圭政府正在努力应对这些挑战，确保人民的健康和安全，同时推动经济的复苏。"
URG.3.a: "抗击疫情"

URG.4.t: "乌拉圭与中国的贸易关系"
URG.4.d: "乌拉圭与中国的贸易关系近年来得到了快速发展。中国已成为乌拉圭最大的贸易伙伴之一，两国在农产品、矿产、制造业等领域的合作不断深化。乌拉圭向中国出口大量的牛肉、大豆、羊毛等农产品，同时从中国进口机械设备、电子产品、纺织品等商品。这种贸易关系为乌拉圭的经济发展提供了重要支持，也为中国提供了稳定的原材料供应。两国政府正在积极推动进一步的合作，包括投资、技术交流、文化交流等领域。"
URG.4.a: "深化合作"

URG.5.t: "乌拉圭的教育改革"
URG.5.d: "乌拉圭政府宣布实施一项全面的教育改革计划，旨在提高教育质量，促进教育公平。改革计划包括改善学校基础设施、提高教师待遇、加强职业教育、推广数字教育等措施。乌拉圭重视教育的传统可以追溯到19世纪，该国是拉丁美洲最早实行免费义务教育的国家之一。然而，近年来，乌拉圭的教育系统面临着一些挑战，如教育资源分配不均、学生辍学率上升等。这次改革旨在解决这些问题，为乌拉圭的未来发展培养更多高素质的人才。"
URG.5.a: "投资未来"

 # FOCUSES #
URG_economic_reform: "经济改革"
URG_economic_reform_desc: "乌拉圭经济面临着一些结构性问题，需要进行全面的改革。改革的重点包括减税、减少政府支出、促进私人投资、改善商业环境等。通过这些措施，政府希望推动乌拉圭经济的进一步发展，提高国家的竞争力，创造更多的就业机会。"

URG_social_welfare: "社会福利"
URG_social_welfare_desc: "乌拉圭重视社会福利，致力于为公民提供基本的生活保障。政府将继续扩大社会保障覆盖范围，提高养老金和失业救济金水平，改善医疗和教育服务。同时，政府也将加强对弱势群体的扶持，促进社会公平和包容。"

URG_infrastructure_development: "基础设施发展"
URG_infrastructure_development_desc: "乌拉圭的基础设施相对落后，需要进行大规模的投资和建设。政府计划在未来几年内投入大量资金，用于改善交通、能源、通信等领域的基础设施。这将有助于提高乌拉圭的经济效率，促进区域发展，提升国家的竞争力。"

URG_foreign_policy: "外交政策"
URG_foreign_policy_desc: "乌拉圭将继续坚持独立自主的外交政策，积极参与国际事务，维护国家的主权和利益。政府将加强与周边国家的合作，推动区域一体化进程，同时也将拓展与其他国家的关系，促进贸易和投资。乌拉圭将在国际舞台上发挥积极作用，为世界和平与发展做出贡献。"

URG_environmental_protection: "环境保护"
URG_environmental_protection_desc: "乌拉圭重视环境保护，致力于实现可持续发展。政府将加强环境监管，推动清洁能源的发展，减少碳排放，保护生物多样性。同时，政府也将提高公众的环保意识，鼓励公民参与环境保护行动。"

URG_agricultural_development: "农业发展"
URG_agricultural_development_desc: "乌拉圭是一个农业国家，农业在国民经济中占有重要地位。政府将加大对农业的支持力度，推广现代农业技术，提高农产品质量和产量，促进农业产业化发展。同时，政府也将加强农产品出口市场的开拓，提高乌拉圭农产品的国际竞争力。"

URG_industrialization: "工业化"
URG_industrialization_desc: "乌拉圭的工业基础相对薄弱，需要加快工业化进程。政府将制定产业政策，引导和支持制造业的发展，促进技术创新和产业升级。同时，政府也将加强对中小企业的扶持，创造良好的创业环境，推动乌拉圭经济的多元化发展。"

URG_education_reform: "教育改革"
URG_education_reform_desc: "教育是乌拉圭发展的基石，政府将继续推进教育改革，提高教育质量，促进教育公平。改革的重点包括改善学校基础设施、提高教师素质、加强职业教育、推广数字教育等。通过这些措施，政府希望为乌拉圭的未来发展培养更多高素质的人才。"

URG_healthcare_reform: "医疗改革"
URG_healthcare_reform_desc: "乌拉圭的医疗体系需要进行改革，以提高医疗服务的质量和效率。政府将加大对医疗领域的投入，改善医疗基础设施，提高医护人员的待遇，加强公共卫生管理。同时，政府也将推动医疗体系的数字化转型，提高医疗服务的可及性和便利性。"

URG_cultural_preservation: "文化保护"
URG_cultural_preservation_desc: "乌拉圭拥有丰富的文化遗产，政府将加强对文化遗产的保护和传承。政府将加大对文化事业的投入，支持文化产业的发展，推广乌拉圭的文化和艺术。同时，政府也将鼓励公民参与文化活动，增强民族文化认同感。"