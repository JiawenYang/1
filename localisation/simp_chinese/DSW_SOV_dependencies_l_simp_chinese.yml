 russiaflavor.114.d:0 "在科尔尼洛夫领导的政党推行了全面的民主改革之后，叶卡捷琳堡的几位活动人士向政府提出了一个有趣的想法：修复并重新开放此前已被关闭的叶利钦中心。\n\n当然，许多政界人士对这一想法持怀疑态度，但当消息传到政府最高层时，俄罗斯总统德米特里·科尔尼洛夫亲自指示叶卡捷琳堡市政府修复该博物馆。仅仅几周后，市政府官员便遵照总统的要求，重新向俄罗斯公众开放了这座建筑的大门。除了修复博物馆的旧展厅和更换部分展品外，还增加了一个专门展示反抗阿里哈诺夫斗争及民主力量胜利的新展厅。\n\n开放日当天，总统亲自在中心前的广场上发表讲话，不仅强调了叶利钦在俄罗斯历史上的重要性，也强调了整个民主制度的重要性。开放后的第一个小时内，便有数千人涌入博物馆排起长队，而这种大量参观者的涌入持续了数天。所有纪念品都在开放后的几小时内售罄，博物馆管理层在开馆仅几天内就赚得盆满钵满。"
