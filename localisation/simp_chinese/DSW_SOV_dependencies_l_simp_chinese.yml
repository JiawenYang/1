 russiaflavor.117.d:0 "雅罗斯拉夫·斯特布列夫已经被关在最高安全级别的监狱里好几个月了。然而，他十二年刑期的尽头似乎并未接近分毫。他因政治极端主义罪名服刑——在强权主义的俄罗斯转型后，他是第一批加入阿里哈诺夫领导的保卫人民与国家联盟的人之一。当时，他真诚地相信阿里哈诺夫会让这个国家真正变得伟大而令人自豪。在朱拉夫列夫成功起义之后，他和保卫人民与国家联盟的其他成员被捕，随后被判处长期监禁。\n\n日子缓慢而单调地流逝：雅罗斯拉夫无事可做，只能读书。他几乎已经认命了，直到有一天，一位“访客”前来探视。\n\n一声锁响，门开的嘎吱声——随后是一个平静的声音：\n\n“斯特布列夫先生，我想我们有几个话题可以谈谈。”\n\n雅罗斯拉夫警觉起来。\n\n“你想必知道，别洛夫总统正在为国家应对来自欧洲的马克思主义-全球主义威胁做准备。为了重振俄罗斯昔日雄风，他需要像您这样睿智且富有经验的人。”\n\n犯人怀疑地问：\n\n“你想让我做什么？”\n\n来客平静地回答：\n\n“你可以展现你的忠诚，帮助总统的政党保卫祖国，抵御迫在眉睫的威胁。作为回报，别洛夫会慷慨撤销对你的一切指控。”\n\n雅罗斯拉夫的眼睛亮了起来。\n\n“没问题——我当然愿意在国家需要的时候伸出援手。我同意。”\n\n访客满意地笑了笑，未再多言，转身朝出口走去。铁门嘎吱作响，锁咔嗒一声关上，牢房里再次陷入死寂。雅罗斯拉夫慢慢坐回铺位，凝视着灰色的墙壁。冥冥中他隐约觉得此事不会如此轻易了结，但他不愿再多想。"
