 GER_FRANZ_DESC:0 "弗兰克·弗朗茨1978年出生于当时仍属西德的萨尔州弗尔克林根，在政治分裂与经济动荡的德国统一时期长大。在那个特殊时期，部分德国民众开始转向鼓吹“更好替代方案”的激进运动，弗朗茨也不例外。他于2000年代初加入德国国家民主党，并在这个极右翼政党日渐式微之际登上领导之位。凭借将极端思想包装成传统价值的才能，弗朗茨成功塑造出以秩序、文化复兴为内核的新政治形象。\n\n尽管公众支持率低迷，弗朗茨始终在极右翼圈子活跃运作，暗中与军方及民族主义团体构建关系。欧陆战争结束后的权力真空期，终于给了他施展野心的舞台。北约未能遏制苏联在东欧的推进，使厌倦动荡的民众对现行体制彻底失望，因此，他们转向了更激进的思想。\n\n当联邦议院陷入瘫痪之际，将国家衰败归咎于柏林当局优柔寡断的军方迅速发动了政变。为重塑国家主权与实力，他们选中了被众多支持者视为民族凝聚力象征的弗朗茨。在军官团、准军事组织及绝望民众的拥戴下，他依据紧急状态法就任总理。如今，这位领袖已完全掌控了他的祖国。究竟是携手欧洲其他极端势力，还是独自走向复辟之路，全在他一念之间。"
