 russiaflavor.112.d:0 "安娜斯塔西娅已经七十多岁了，生命已近尾声。她经历了赫鲁晓夫、勃列日涅夫、改革、动荡的九十年代、普京、梅德韦杰夫，甚至阿里哈诺夫。如今，又一个政府更迭了，谢尔盖·马连科维奇领导的共产党人上台执政。安娜斯塔西娅对此漠不关心——过去五十年来，她一直生活在贫困的边缘，她生活中的一切也不太可能有什么改变。\n\n政府最近批准了社会保障改革，包括增加养老金发放。这位老妇人早就不再相信这种承诺了。普京的统治很久以前就教会了她，这种“改革”只会导致她本就微薄的养老金贬值，或者只是增加区区几百卢布——这点钱对她根本没有任何好处。\n\n一天，老妇人听到她那部韩国手机传来微弱的铃声，那是几年前儿子送她的生日礼物。她戴上眼镜，慢慢走到手机旁，拿起来，随手打开了银行弹出的通知。“大概是养老金到了吧，”她想。\n\n安娜斯塔西娅的猜想得到了证实，但她万万没想到会看到屏幕上的数字。她看到的不是往常的25847卢布，而是高达51751卢布——是平时的两倍。老妇人惊呆了，简直不敢相信自己的眼睛。片刻之后，她的脸上立刻绽开了笑容，她仍然处于震惊之中，坐到了那张苏联时代的老沙发上。"
