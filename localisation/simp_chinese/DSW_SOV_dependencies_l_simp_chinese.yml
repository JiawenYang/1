 russiaflavor.116.d:0 "一方面，米哈伊尔·列舍京中尉早就预料到会有这样的事——政府最近批准了一项增加内务部拨款的法案。就在前几天，他们的工资涨了，而且涨了不少。米哈伊尔已经算过了，下个月他就能买得起一部新相机：他在空闲时间喜欢拍摄大自然、鸟类、动物等等之类的东西。另一方面，最近工作上也出奇地平静，仿佛某种麻烦不可避免地正在逼近。\n\n从某种意义上说，事情确实就这样发生了——今天，他们部门派来了一名实习生进行培训。这看起来像是例行公事，但他，用老话来说，有点像个“扶不起的阿斗”。他做的第一件事就是走到米哈伊尔面前说：\n\n“中尉同志，见习生鲁宁听候您的吩咐！”\n\n米哈伊尔把一切都向他解释清楚：东西放在哪里，该做什么，以及该联系谁。实习生理解地点点头，肯定地答应了一声，转过身，迈出一步，然后……踩在结冰的水坑上滑倒了，一头栽进了雪堆里。\n\n米哈伊尔忍不住微微笑了笑，但他还是把新下属扶了起来。\n\n“行了，见习生，走路不看路吗？顺便说一句，在我们这一行，这是个有用的习惯。”\n\n实习生不确定地点点头，拂去大衣上的雪，赶紧去办公室填写必要的文书。中尉目送他离去，低声说道：\n\n“嗯，但愿至少能有点意思吧。”\n\n“有意思当然好，但接下来活儿肯定更多了。”米哈伊尔一边想着，一边掏出一支烟。他点着烟，望着实习生笨拙的身影走远，忽然意识到，那个站在雪堆里的年轻人让他想起了十年前的自己。那时，他在第一天上班时也同样紧张，也同样梦想着能尽快成为一名军官。"
 russiaflavor.113.d:0 "“来吧，来吧……”\n\n伊戈尔坐在电脑前，已经疯狂地刷新了一个小时即将公布考试成绩的页面。每隔大约二十分钟，他的母亲就会走进房间说：\n\n“伊戈尔，你为什么不出去走走，呼吸点新鲜空气？”\n\n男孩每次只是疲倦地叹口气，继续守在显示器前等待。\n\n伊戈尔知道，他一周前参加的考试远没有他姐姐当年参加的那场难。考试难度降低了，考试范围调整了，评分系统也改了。这确实给了他一些信心，但那种成绩公布前特有的紧张感——对一代又一代学生来说再熟悉不过——并没有消失。\n\n又过了大约二十分钟，“成绩”栏里的空白处终于被一个数字取代：91。\n\n他感到一阵如释重负——任何八十分以上的成绩都保证他能被梦想的大学录取。站在他身后的母亲微笑着说道：\n\n“瞧瞧你，这么紧张。去吃点东西吧，从早上到现在你一直饿着肚子。”\n\n伊戈尔把头靠在椅背上，一动不动地坐了一分钟，盯着天花板。人生的这个阶段结束了。而且完成得很成功。整整一个月压在他肩上的沉重焦虑终于消失了，取而代之的是一种轻盈的、令人陶醉的空虚感。\n\n就在那一刻，全国成千上万刚毕业的高中生心中都升起了同样的念头。"
