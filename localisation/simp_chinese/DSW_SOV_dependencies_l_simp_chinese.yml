 GER_SCHWAB_DESC:0 "克劳斯·施瓦布于1938年生于德国符腾堡，其父是深度参与纳粹战争机器体系的瑞士工业巨头。他的早年教育辗转于宁静的苏黎世和战后满目疮痍的德国之间，学术道路精准而审慎。至1960年代，他已拥有机械工程学与经济学双博士学位，并在亨利·基辛格指导下取得哈佛大学硕士学位。施瓦布最初在日内瓦教授商业政策，但真正铸就其历史地位的，是1971年创立的欧洲管理论坛（今世界经济论坛），这个亿万富豪、技术官僚与各国元首共商未来的年度峰会，最终将演变为如今以铁腕统治欧洲的组织。\n\n自施瓦布1971年创立世界经济论坛时，其使命便只有一个：培育能够“塑造全球、区域与行业议程”的精英人才集团。数十年来他深谋远虑：低调召开研讨会议、精心编织人脉网络，以及无数关于政商融合的白皮书。多数人只当他是个无害的未来主义者。真是愚不可及。\n\n这位毕生游走于总理与总统耳畔的操盘手，如今终于从幕后走到权力聚光灯下。当欧盟委员会邀请达沃斯论坛的技术官僚接管权柄时，施瓦布呈上了他毕生事业的巅峰之作：依托《2040年议程》与第四次工业革命，欧洲将被重塑；并非为现世人类而建，而是施瓦布所定义的人类进化终极形态。唯余一问：\n\n你准备好了吗？"
