l_simp_chinese:
 zzz_identity.1.t:0 "换了旗帜的加盟"
 zzz_identity.1.d:0 "在[ROOT.GetName]的战后安排里，新成立的协作政府没有保留旧有的同盟身份。外长在签字仪式上宣布，本国的军事同盟与经济协定将「按新的地区秩序重新登记」：旧的名字被划去，新的名字被写上。官方解释是结束孤立、回到地区合作；周边国家看到的却是同一批港口、同一批基地，只是签字的人换了。"
 zzz_identity.1.a:0 "新的登记表上没有旧名字。"
 zzz_identity.2.t:0 "旧名字回来了"
 zzz_identity.2.d:0 "协作政府结束，[ROOT.GetName]重新掌握自己的外交文书。新内阁做的第一件事，是把战前签署的那批条约逐条恢复：军事同盟、关税安排、结算货币，全部回到原来的位置。没有人解释这些文件为什么比两年前的边界更值得尊重，但港口与基地上的旗帜确实换了回去。"
 zzz_identity.2.a:0 "条约逐条归位。"
 zzz_identity.3.t:0 "名单上多了一个名字"
 zzz_identity.3.d:0 "华盛顿把[ROOT.GetName]写进了「主要非北约盟友」名单。这不是一纸同盟条约：没有共同防御条款，也没有驻军。换来的是一份军售优先清单、联合演训的席位，以及更便宜的装备采购渠道。国务院的说法是「深化伙伴关系」，而这份名单本身从来只对少数几个国家开放。"
 zzz_identity.3.a:0 "军售与演训的门槛降低了。"
 zzz_identity.4.t:0 "名字被划掉了"
 zzz_identity.4.d:0 "华盛顿更新了名单，[ROOT.GetName]不再名列其中。没有照会，没有解释，只有一份技术性的修订记录：军售优先权取消、联合演训席位收回、技术共享组除名。这个国家发现自己并没有失去任何条约——因为从一开始，它就没有得到过条约。"
 zzz_identity.4.a:0 "优先权被悄悄收回。"
