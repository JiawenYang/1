l_simp_chinese:
 zzz_party.164.t:0 "伊姆兰·汗的胜利"
 zzz_party.164.d:0 "2018 年大选后，正义运动党首次在国民议会占据多数，伊姆兰·汗宣誓就任总理，巴基斯坦的政治版图由传统两大王朝政党转向反建制的民粹力量。"
 zzz_party.164.a:0 "接受这一结果"
 zzz_party.165.t:0 "伊斯兰堡的权杖更迭"
 zzz_party.165.d:0 "国民议会通过对伊姆兰·汗的不信任动议，穆斯林联盟-谢里夫派联合反对党推举谢巴兹·谢里夫出任总理，建制派重新掌控伊斯兰堡。"
 zzz_party.165.a:0 "接受这一结果"
 zzz_party.166.t:0 "希望联盟的胜利"
 zzz_party.166.d:0 "2018 年大选中希望联盟终结了国民阵线长达六十年的执政，马哈蒂尔以九十二岁高龄再度出任首相，吉隆坡迎来首次真正意义上的政党轮替。"
 zzz_party.166.a:0 "接受这一结果"
 zzz_party.167.t:0 "喜来登行动"
 zzz_party.167.d:0 "土著团结党退出希望联盟，联合马来民族统一机构与伊斯兰党重组政府，穆希丁·亚辛出任首相，执政不足两年的改革联盟就此瓦解。"
 zzz_party.167.a:0 "接受这一结果"
 zzz_party.168.t:0 "安华的时代"
 zzz_party.168.d:0 "2022 年大选后没有任何阵营单独过半，希望联盟在最高元首斡旋下组建联合政府，安华·依布拉欣终于就任首相，马来西亚回到改革路线。"
 zzz_party.168.a:0 "接受这一结果"
 zzz_party.169.t:0 "曼谷的强人连任"
 zzz_party.169.d:0 "2019 年大选在军方主导的新宪法框架下举行，人民国家力量党联合小党继续执政，巴育·占奥差由政变领导人转为民选总理。"
 zzz_party.169.a:0 "接受这一结果"
 zzz_party.170.t:0 "为泰党的回归"
 zzz_party.170.d:0 "2023 年大选后前进党虽赢得最多席位却被上议院阻挠，为泰党转而与保守阵营结盟组建政府，赛塔·他威信出任总理，他信家族的政治网络重返权力中心。"
 zzz_party.170.a:0 "接受这一结果"
