l_simp_chinese:
 #从《烈焰升腾》移植的新冠疫情事件与依赖
 prc.30.t: "新冠病毒扩散至周边省市"
 prc.30.d: "新冠病毒已从武汉扩散至湖北周边的州与省份。各地医院陆续报告疑似病例，地方政府正加紧设置检疫点，但春运期间的人口流动使得追踪接触者变得异常困难。"
 prc.30.o1: "不能让恐慌传播得比病毒更快。"
 thailand.1.t: "泰国出现首批新冠病例"
 thailand.1.d: "泰国公共卫生部确认了中国境外首例新型冠状病毒感染病例：一名来自武汉的61岁中国游客在出现发热症状后于曼谷入院治疗。卫生官员正在追踪其接触者，并在素万那普机场对来自中国的旅客进行筛查。"
 thailand.1.a: "令人不安。"
 iran.4.t: "第一例新冠感染者"
 iran.4.d: "德黑兰的医院报告称，患有严重肺炎的患者有所增加。大多数患者年龄在40岁以上，少数患者年龄在30多岁。"
 iran.4.a: "我们必须做好准备。"
 iran.11.t: "疫情失业抗议"
 iran.11.d: "疫情令商业活动陷入停滞，失业率不断攀升，德黑兰等大城市的工人与店主走上街头。目前示威规模尚小，但气氛阴沉：民众要求发放救济金，并要求政府拿出保住他们生计的方案。"
 iran.11.a: "绝不能让局势失控。"
 HUN_Corona_Virus: "冠状病毒"
 HUN_Overflowing_Hospitals: "医院人满为患"
 Hungary.13.t: "新冠病毒在布达佩斯爆发"
 Hungary.13.d: "布达佩斯确诊了首批新冠病毒感染病例。政府敦促民众遵守卫生防疫规定，医院则开始为未来数周准备隔离病房。"
 Hungary.13.a: "该死！"
 Hungary.14.t: "医院床位短缺"
 Hungary.14.d: "新冠疫情前线传来严峻报告，匈牙利各地医院面临床位严重短缺的问题，而医生在为患者诊断时未却察觉这一困境。这导致癌症患者被迫返回家中，新冠患者则占据了本应属于他们的床位。面对这一危机，匈牙利全国都期盼着政府的回应。"
 Hungary.14.a: "嗯……那就增设更多床位吧！"
 saudi.1.t: "萨勒曼国王被送医"
 saudi.1.d: "今天清晨，国王因突发呼吸困难和背痛，由其私人医生进行了诊治。据医生称，国王的呼吸问题在几周前就已出现，且近期有所加重。医生很快便确定国王感染了新冠病毒。相关信息正受到密切监测，并将在稍后公布。"
 saudi.1.a: "为国王祈福"
 syria.15.t: "新冠病例数目下降？"
 syria.15.d: "医院不再报告有大量新冠感染病例出现。看来病毒已经停止传播了。至少当下是如此……"
 syria.15.a: "最糟糕的时刻已经过去了。"
