l_simp_chinese:
 FRA_MODERN_DAY_DESC: "第五共和国仍处在低增长与高失业的阴影里：2016年经济增长不足百分之一点五，失业率徘徊在百分之十上下，青年失业则远高于此。2017年5月的总统选举将决定国家走向，而自1958年以来执政的两大党能否守住第二轮，第一次成了悬念。作为欧盟创始成员国与联合国安理会常任理事国，法国与德国共同承担着英国脱欧后欧洲一体化的领导责任，同时在萨赫勒以“新月沙丘”行动投入数千兵力，在国内维持紧急状态。\n经济改革、欧盟方向与社会凝聚力，都将在爱丽舍宫的下一任主人手中见分晓。"
 RAJ_MODERN_DAY_DESC: "印度是南亚次大陆的压倒性力量：十三亿人口，约两万六千亿美元的经济总量，增速在主要经济体中名列前茅。2016年11月的废钞令回收了八成以上的流通现金，城乡的现金经济为之震动；2017年7月生效的商品与服务税，则试图把各邦割裂的税制并为一国一税。\n对外，新德里一面深化与美国的防务合作，一面维持与莫斯科的传统军贸关系，并以“东进政策”经营东南亚；核武器与不首先使用承诺构成其战略底线。克什米尔的叛乱、与中国尚未划定的边界，以及迟迟打不开的核供应国集团大门，仍是这个谋求安理会常任席位的国家绕不开的难题。"
 IND_MODERN_DAY_DESC: "印度尼西亚由一万七千多座岛屿、两亿六千万人口组成，是世界最大的穆斯林国家，也是东盟事实上的重心。佐科·维多多政府把预算压向港口、铁路与电站，试图用基础设施把群岛缝合起来；2016年的税收特赦则为这笔开支腾出了空间。\n雅加达在南海问题上刻意保持低调，却在纳土纳海域不止一次与中国渔船和海警船对峙，巴布亚的分离主义冲突也仍在消耗陆军兵力。作为不结盟运动的老成员，印尼如今以“全球海洋支点”自居，在华盛顿与北京之间小心维持等距。"
 AST_MODERN_DAY_DESC: "澳大利亚的两千四百万人口分布在近七百七十万平方公里的土地上。矿业繁荣的投资期已经过去，经济增长回落到百分之二点五上下。中国吸收了其出口的三成以上；铁矿石、煤炭与液化天然气让堪培拉在安全与繁荣之间左右为难——它既是美国同盟体系中的南锚，又离不开亚洲最大的买家。\n特恩布尔政府在2016年国防白皮书中承诺重整军备，并以“主权边界行动”封锁海上偷渡。这个大陆国家正在学习一件难事：如何在防务上依赖一个伙伴、在收入上依赖另一个伙伴的同时，保住自己的战略自主。"
 SPR_MODERN_DAY_DESC: "西班牙刚刚爬出主权债务危机的深渊：失业率仍接近百分之十九，青年失业接近四成，公共债务约等于经济总量的百分之百。拉霍伊的少数政府在议会中步履维艰，加泰罗尼亚的独立诉求又把宪法秩序与地区自治的老问题重新推上台面。\n作为欧盟与北约成员国，马德里在直布罗陀问题上寸步不让，并在摩洛哥沿岸的休达与梅利利亚承受着移民压力。繁荣的旅游业支撑了复苏，却也让这个国家比以往更依赖外部景气。"
 PRC_socialist_chinese_dream_idea_desc: "“中国梦”的社会主义叙事把民族复兴同党的治理捆绑在一起：科研经费要服务于国家目标，高校与智库则被要求把学术产出转化为可用的政策与工程能力。在这套框架下，创新不是市场自发的结果，而是五年规划中逐项分解的任务，衡量成败的标准是它能多快落地。"
 SOV_integralists_idea_desc: "在俄语语境里，整合主义者既不是自由派，也不是旧式共产党人：他们主张以欧亚空间为单位重建国家的政治与经济，把主权、传统与动员置于市场效率之上。只要这股力量在权力核心中占有一席之地，克里姆林宫的决策就会更集中、更强硬，也更倾向于把外交当作文明对抗来经营。"
 BRA_MODERN_DAY_DESC: "巴西刚刚经历了建国以来最严重的经济衰退：2015与2016两年产出累计萎缩逾百分之七，失业率突破百分之十二，而“洗车行动”的腐败调查把政商精英一并拖下水。2016年8月，罗塞夫被弹劾下台，特梅尔以代总统身份接掌政权，随即推动宪法修正，为联邦支出设下二十年上限，以稳住市场与评级机构的信心。\n这个南美巨人拥有拉美最大的工业体系与全球第五的人口规模，却也被称作“永远的未来之国”。能否把大宗商品周期之后的低增长转化为制度改革，是2018年大选必须回答的问题。"
 ISR_MODERN_DAY_DESC: "建国近七十年后，以色列的问题已从“能否生存”变成“如何定义自己”：人口突破八百万，人均产出位居发达国家前列，网络安全、医疗器械与农业技术远销全球。然而占领之下的巴勒斯坦问题仍无解，2016年底安理会第2334号决议的通过，是国际法第一次明确否定定居点扩建，也让耶路撒冷与即将上任的华盛顿政府关系蒙上阴影。\n北面，叙利亚内战把伊朗革命卫队与真主党带到戈兰高地边缘；南面，加沙的封锁与周期性军事行动同时消耗着道义与兵力。这个国家必须在“犹太国家”与“民主国家”的双重身份之间找到可持续的平衡。"
 ETH_MODERN_DAY_DESC: "埃塞俄比亚是非洲增长最快的大型经济体之一，十年间年均增速接近百分之十，亚的斯亚贝巴—吉布提铁路与工业园让这个内陆国第一次看到工业化的门径。然而复兴大坝在青尼罗河上的推进，把尼罗河水权的争执推向与埃及、苏丹的准对抗。\n2016年10月，奥罗莫地区的抗议迫使政府宣布全国紧急状态；执政的埃革阵以发展联盟的形态垄断政治，也把联邦制下的民族自治推向紧绷。这个坐拥非盟总部的国家，正用国家主导的投资换取稳定，代价是政治空间日益收窄。"
 FIN_MODERN_DAY_DESC: "芬兰在2015至2016年连续三年增长乏力后刚刚勉强回到正轨：出口受欧洲需求与诺基亚之后的产业重组拖累，政府以“竞争力契约”压低单位劳动成本，并启动欧洲首个全国基本收入试验。作为欧元区成员，它没有独立的货币政策空间；作为军事不结盟国家，它与北约保持“增强伙伴关系”，却始终不越过成员资格那条线。\n一千三百多公里的俄芬边界是这个国家最沉重的地缘事实。赫尔辛基必须在欧洲的规范、北约的保障与莫斯科的容忍之间，维持一种脆弱的平衡。"
 ITA_MODERN_DAY_DESC: "意大利是欧元区第三大经济体，也是其中公共债务最沉重的国家之一：债务约占产出的百分之一百三十二，失业率仍在百分之十一以上，青年失业接近四成。2016年12月的宪法公投失败逼退伦齐，真蒂洛尼的技术官僚政府接手；同月对西雅那银行的救助，成为欧元区银行业整顿的又一次试验。\n地中海上，来自利比亚的移民船持续抵达西西里与兰佩杜萨，把欧盟的边境与庇护政策推上意大利的政治议程；五星运动与北方联盟的民粹合流，则正把2018年大选变成一场对现行体制的信任公投。"
 SWE_MODERN_DAY_DESC: "瑞典在2015年接收了十六万余名寻求庇护者，随后迅速收紧边境，把一个以人道主义自居的福利国家推进了关于融合、住房与福利财政的全国辩论。经济仍在增长，但斯德哥尔摩与哥德堡的房价泡沫和被压抑的家庭债务，让宏观审慎当局不敢松手。\n军事上，这个两百年不结盟的国家因克里米亚事件重启了北约讨论，恢复了哥特兰岛的常驻防御并提高国防预算。对瑞典而言，中立不再是默认状态，而是一笔需要反复论证成本的选择。"
 NRY_MODERN_DAY_DESC: "挪威把石油收入关进了全球最大的主权财富基金：到2017年初，基金规模已接近九千亿美元，使它得以在油价下跌的两年里继续维持福利与投资。作为欧洲经济区成员而非欧盟成员，奥斯陆接受布鲁塞尔的多数单一市场规则，却对渔业、农业与移民保有例外。\n在芬马克与俄罗斯接壤的边界、在斯瓦尔巴群岛的北极前哨，挪威同时承担北约北翼的侦察与威慑任务。这个人口仅五百余万的国家，用能源财富换影响力、用同盟身份换安全，而两者都需要它在大国之间小心经营。"
 heavy_frigate_desc: "重型护卫舰以更大的舰体换取远洋适航性与载荷：相控阵雷达、垂直发射装置与反潜直升机，使其在编队中同时充当防空哨舰与反潜核心。相比轻型护卫舰，它造价更高、续航更远，适合承担护航、封锁与远海巡逻。"
