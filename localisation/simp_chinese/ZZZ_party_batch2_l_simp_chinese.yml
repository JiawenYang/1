l_simp_chinese:
 zzz_party.10.t:0 "白宫易主"
 zzz_party.10.d:0 "共和党候选人赢得 2016 年大选。新总统宣誓就职，华盛顿的政治风向由自由主义转向保守主义。"
 zzz_party.10.a:0 "接受这一结果"
 zzz_party.14.t:0 "工党入主唐宁街"
 zzz_party.14.d:0 "工党在 2024 年大选中取得压倒性胜利。十四年保守党执政终结，英国转向社会民主主义。"
 zzz_party.14.a:0 "接受这一结果"
 zzz_party.15.t:0 "爱丽舍宫的新面孔"
 zzz_party.15.d:0 "中间派候选人赢得总统选举。爱丽舍宫迎来新主人，法国政治的重心从传统左右两翼转向中间。"
 zzz_party.15.a:0 "接受这一结果"
 zzz_party.100.t:0 "青瓦台易主"
 zzz_party.100.d:0 "共同民主党候选人在 2017 年总统选举中获胜。首尔的政治风向转向自由主义。"
 zzz_party.100.a:0 "接受这一结果"
 zzz_party.101.t:0 "龙山总统府"
 zzz_party.101.d:0 "保守派候选人在 2022 年总统选举中获胜。韩国政权交接，政策重心转向对朝强硬与亲美路线。"
 zzz_party.101.a:0 "接受这一结果"
 zzz_party.102.t:0 "罗马的新联合政府"
 zzz_party.102.d:0 "五星运动与联盟党组成联合政府。罗马的政治版图被民粹主义力量重塑。"
 zzz_party.102.a:0 "接受这一结果"
 zzz_party.104.t:0 "华沙的中间派回归"
 zzz_party.104.d:0 "公民联盟在 2023 年议会选举中取得多数。波兰政治重新转向亲欧的中间派路线。"
 zzz_party.104.a:0 "接受这一结果"
 zzz_party.106.t:0 "工党执政堪培拉"
 zzz_party.106.d:0 "工党在 2022 年大选中获胜。堪培拉的政治重心转向社会民主主义与气候议题。"
 zzz_party.106.a:0 "接受这一结果"
 zzz_party.107.t:0 "马尼拉的王朝回归"
 zzz_party.107.d:0 "马科斯家族在 2022 年总统选举中重新掌权。马尼拉回到强人政治与家族政治的老路。"
 zzz_party.107.a:0 "接受这一结果"
 zzz_party.110.t:0 "基辅的素人总统"
 zzz_party.110.d:0 "喜剧演员出身的泽连斯基在 2019 年总统选举中获胜。基辅的政治格局被彻底改写。"
 zzz_party.110.a:0 "接受这一结果"
 zzz_party.111.t:0 "巴西利亚的右翼浪潮"
 zzz_party.111.d:0 "博索纳罗在 2018 年总统选举中获胜。巴西政治转向右翼民粹主义。"
 zzz_party.111.a:0 "接受这一结果"
 zzz_party.112.t:0 "卢拉回归"
 zzz_party.112.d:0 "卢拉在 2022 年总统选举中击败现任总统。巴西重新回到左翼与社会民主的轨道。"
 zzz_party.112.a:0 "接受这一结果"
 zzz_party.113.t:0 "布宜诺斯艾利斯的自由意志主义者"
 zzz_party.113.d:0 "米莱在 2023 年总统选举中获胜。阿根廷转向激进自由市场与右翼民粹主义路线。"
 zzz_party.113.a:0 "接受这一结果"
 zzz_party.171.t:0 "墨西哥左转"
 zzz_party.171.d:0 "洛佩斯·奥夫拉多尔以 MORENA 为首的「一起创造历史」联盟赢得 2018 年总统选举。新政府承诺终结旧政党的腐败，重新调整国家的经济路线。"
 zzz_party.171.a:0 "接受这一结果"
 zzz_party.172.t:0 "辛鲍姆延续转型"
 zzz_party.172.d:0 "辛鲍姆以数十年来最高的得票率赢得 2024 年总统选举。MORENA 保住执政地位，与绿党、劳动党的联盟得以延续。"
 zzz_party.172.a:0 "接受这一结果"
