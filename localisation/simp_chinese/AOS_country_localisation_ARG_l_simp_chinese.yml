ARG_grieta_politica_desc_loc_key: "多年来，几十年来，甚至可以说\"几个世纪以来\"，阿根廷一直被不同群体的人分裂，他们除了伤害我们的国家，尤其是我们的人民之外，什么都没做。家庭因政治争论而分裂，夫妻因意识形态差异而分开，甚至出现过因持有不同世界观而对他人实施暴力的案例。\n你的使命是结束阴谋驱动的思维，以便这个国家的错误信息能够消失。这并不容易，媒体、政客、名人，甚至我们身边的人都传播错误信息，以对阿根廷不太传统的意识形态产生恐惧或排斥。"
