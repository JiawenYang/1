ARG_capitan_beto_en_la_rosada_desc: "阿根廷历史的新政治时代。"
ARG_guzman_vs_inflacion: "古斯曼对抗通货膨胀"
ARG_guzman_vs_inflacion_desc: "自1970年代以来，通货膨胀一直是阿根廷最持久和最具破坏性的问题之一，当时该国经历了近3000%的恶性通货膨胀。在1990年代，卡洛斯·梅内姆总统试图通过将比索与美元挂钩来实现稳定，这在短期内有所帮助，但最终崩溃，导致2001年违约和新的经济不稳定周期。从那时起，阿根廷一直难以摆脱反复出现的通货膨胀、债务和停滞。每届政府都承诺解决方案，但没有一届能够实施持久的改革。在费尔南德斯总统领导下，通货膨胀继续上升，最近达到53.5%，高于他上任时的水平。\n\n在这场危机中，经济部长马丁·古斯曼已成为核心人物。他的任务并不容易：抑制通货膨胀、稳定货币、重建对经济的信任——所有这些同时还要应对COVID-19大流行的影响。有些人将他视为阻止阿根廷长期衰退的唯一希望。古斯曼是否会成功仍然不确定。但紧迫性很明显：如果不采取决定性行动，通货膨胀可能再次威胁阿根廷经济和社会的根基。"
ARG_alberto_aumenta_salarios: "阿尔贝托提高工资"
ARG_alberto_aumenta_salarios_desc: "自2015年以来，阿根廷的最低工资从6000比索上升到16000比索。从表面上看，这似乎是进步。然而，考虑到通货膨胀和货币贬值，现实更令人担忧：2015年，最低工资价值约600美元，而今天勉强达到200美元。通货膨胀从27%飙升至近50%，显著削弱了比索并降低了实际购买力。2018年的经济危机只是加深了这些问题，暴露了普通阿根廷人工资和生活水平的脆弱性。\n\n作为回应，费尔南德斯总统领导的政府植根于左翼价值观，致力于提高收入。新措施将把最低工资从16000比索提高到约19000比索。公共部门工资也将从45000-50000比索提高到60000至70000比索。作为一个由人民选举并为人民服务的政府，费尔南德斯总统强调他有责任保护工人，并确保尽管面临持续的经济挑战，条件更加公平。"
ARG_argentina_diversa_libre: "更多样化和自由的阿根廷"
ARG_argentina_diversa_libre_desc: "阿根廷刑法第86条禁止堕胎，仅在极端情况下允许——特别是当怀孕是强奸的结果或对妇女的健康构成严重威胁时。前总统毛里西奥·马克里曾试图将堕胎合法化，但该法案最终在议会失败。这一结果反映了阿根廷社会及其许多立法者的深刻保守和\"父权制\"性质。\n\n然而，斗争并没有就此结束。阿尔贝托·费尔南德斯总统已表示坚定承诺推进生殖权利并打破围绕堕胎的长期禁忌。这一次，政府准备更充分，更有决心带来真正的变革。除了支持堕胎合法化，费尔南德斯总统还旨在扩大进步社会计划，继续十多年前开始的工作。他的目标是满足支持他的选民的期望，并挑战仍然嵌入阿根廷政治和社会中的\"父权制\"结构。"
ARG_aborto_libre_gratuito: "自由和合法的堕胎"
ARG_aborto_libre_gratuito_desc: "堕胎——很少有问题如此深刻地分裂阿根廷的历史。根据刑法第86条，只有在强奸案件或妇女生命受到威胁时才允许堕胎。然而，这些限制现在被谴责为\"父权制遗迹\"，必须以所谓的\"妇女权利\"的名义予以废除。方便的是，这场运动恰好符合克里斯蒂娜的议程，确保该法案将在议会中通过而没有严重阻力。与过去许多失败的尝试不同，这次运动拥有更大的力量和决心，拆除\"父权制\"的最后障碍。\n\n改革承诺妇女将获得\"终止\"怀孕至第十四周的\"权利\"。不再被迫\"生育\"\"不想要的孩子\"；现在她们可以迅速轻松地\"处理\"他们。这样的措施不仅被视为立法，而且是对社会本身的象征性打击——新的\"正确\"秩序的基石。对我们这些倡导者来说，这不仅仅是一项法律：它是一面战斗旗帜，举起反对几个世纪的\"传统\"。我们宣称\"旧秩序\"正在崩溃，\"父权制\"结构将很快在自身重压下崩溃，阿根廷将在我们的形象中庆祝重生。在他们的愿景中，每一次堕胎不仅是个人行为，更是一次胜利——将永远粉碎\"父权制\"的第一击，为按照我们的信条重塑的社会扫清道路。"
ARG_planes_de_la_mesa_del_hambre: "饥饿圆桌计划"
ARG_planes_de_la_mesa_del_hambre_desc: "创建\"饥饿圆桌\"的想法并非一蹴而就，而是由阿尔贝托·费尔南德斯总统长期培育的。就在我们就职十天后，他将这一愿景变为现实，成立了阿根廷联邦反饥饿委员会，作为更广泛的\"阿根廷反饥饿\"行动计划的一部分。随着新年的到来，我们现在肩负着继续这项工作的责任，塑造一个没有公民被抛在后面的国家。\n\n实际上，费尔南德斯总统今年安排了两次圆桌会议，旨在启动新举措并加强自12月20日第一次会议以来已经实施的举措。这些委员会将作为仔细分析的工具，允许我们评估国家最紧迫的需求并制定行动方案。是时候坚定地向前迈进，实现期待已久的无饥饿阿根廷的梦想了。"
ARG_crear_consejo_seguridad: "创建安全委员会"
ARG_crear_consejo_seguridad_desc: "安全委员会并不是新发明，而是一个机构，其根源可以追溯到卡洛斯·梅内姆总统任期内的1991年，通过《内部安全法案》成立。多年后，萨比娜·弗雷德里克与时任总统候选人阿尔贝托·费尔南德斯一起复兴了这一愿景，主张创建一个现代安全委员会来取代现有的国家安全部。正如费尔南德斯本人曾经宣称的那样，其明确目的是\"确保安全不再被视为狭隘的国家问题，而是被视为所有人共同承担的普遍责任\"。\n\n现在，经过长期期待，我们终于站在将这一愿景变为现实的门槛上。是时候重塑阿根廷的安全框架了，用一个不仅致力于执法而且致力于正义的委员会取代过时的机制。除非被不可预见的障碍破坏，否则这一转变将加强法治，恢复公众信任，并兑现对阿根廷人民长期以来的又一个承诺。"
ARG_consumo_nacional_popular: "民族和民众消费"
ARG_consumo_nacional_popular_desc: "数百万阿根廷人仍然陷入困境，由于比索的无休止通货膨胀和缺乏稳定、体面的收入来恢复购买力，甚至无法购买基本食品。他们选举我们来解决这些问题，如果我们不能帮助穷人，我们算什么领导人？是时候将我们的承诺变为现实，以便选民永远不会怀疑他们的选择。\n\n通过对话和谈判，我们达成了共识，迫使全国最大的超市实施大幅折扣。这一步将刺激需求，恢复一些购买力，并给挣扎中的家庭一个有尊严生活的机会。同时，它将通过普通公民的营业额增加产生更大的收入。超市将接受这些措施，因为我们将给予他们特权作为回报。最终，所有人都将受益——需要食物的人民、超市以及我们信守承诺的政府。"
ARG_alberto_y_obreros: "阿尔贝托与工人"
ARG_alberto_y_obreros_desc: "工人，一个长期被富裕资产阶级压迫的阶级，那些幕后操纵PRO和其他自由右翼政党的影子统治者，已经忍受了几代人的不公正。在我们的竞选活动中，我们承诺捍卫他们，与普通公民站在一起对抗剥削的重压，作为回报，他们信任我们，赋予权力和合法性。现在，站在权力的巅峰，拥有塑造国家命运的手段，是时候兑现我们的承诺了。\n\n然而，我们知道权力平衡是脆弱的。为了让我们的盟友满意，我们提供的大部分内容将采取民粹主义姿态的形式——华丽的言辞而非全面的行动。但即便如此，一颗种子已经种下。我们将一步一步地建立一个未来，在这个未来中，工人不再被资产阶级束缚，而是能够有尊严地生活。目前，我们的道路是谨慎的，既安抚维持我们的寡头伙伴，也安抚我们不能背叛其信任的工人阶级。"
ARG_dolar_productivo_exportaciones: "生产性和出口型美元"
ARG_dolar_productivo_exportaciones_desc: "目前，美元汇率处于历史高位，甚至超过了2007年的记录。在我们的竞选活动中，我们承诺提供一种生产性和出口导向的美元，这将加强阿根廷的经济并恢复信心。2019年底上任后，我们几乎立即寻求兑现这一承诺，准备了一项监管改革框架。尽管实施时间不长，但出口已经开始上升，证明决心和规划会产生结果。\n\n许多所谓的专家声称，如果我们实施出口管制，年度出口将不可避免地崩溃。然而，他们的话毫无分量。他们没有被人民选择，他们不代表人民，他们没有授权来制定政策。他们只是享有特权的批评者，渴望看到阿根廷人受苦，而他们自己却繁荣。我们不会向这样的声音低头。是时候通过任何必要手段兑现我们的承诺，毫不犹豫，毫不妥协。"
ARG_reforma_judicial_necesaria: "司法改革是必要的"
ARG_reforma_judicial_necesaria_desc: "司法系统已经腐烂，是一群自由派、反庇隆主义法官的巢穴，他们的偏见毒害了正义的核心。现任法院已成为阿根廷历史上最偏袒和最具阻碍性的法院，其存在使我们总统任期的每一步都变得复杂。然而，这个问题很久以前就被预见到了，当时阿尔贝托·费尔南德斯总统和克里斯蒂娜·基什内尔副总统首次设想对司法系统进行深度改革——这将允许政府任命真正客观的法官，并罢免那些仅仅作为穿法袍的政治代理人行事的人。\n\n这个想法一直在辩论中徘徊，但其紧迫性从未如此之大。如果我们敢于重新思考我们的方法，我们终于可以拆除自由派的据点，并用一个致力于公平和国家福祉的司法机构取而代之。现在需要的是决心：迅速、果断地通过议会改革，甚至可能在对手能够动员抵抗之前。只有这样，阿根廷才能获得一个既不反对国家也不盲目支持国家，而是坚定站在正义一边的法院。"
ARG_futbol_para_todos: "人人有球踢"
ARG_futbol_para_todos_desc: "足球团结了数百万阿根廷人，将可能永远不认识彼此但分享相同热情的人联系在一起。博卡青年和河床之间的传奇德比不仅是阿根廷最著名的，也是世界上最激烈的之一。正如尤维纳尔曾经说过的，\"面包和马戏\"，足球是吸引心灵的终极奇观，同时常常分散公民对国家生活动荡的注意力。\n\n尽管如此，无数阿根廷人无法负担体育场门票的高昂费用或仅为观看一场比赛所需的无休止订阅。为了对抗这种不公平，阿尔贝托·费尔南德斯总统承诺让足球更易获取，更真正地普及。流媒体价格将降低，新的球场将建在缺乏踢球机会的社区。足球不仅仅是娱乐——它是希望、团结和欢乐的共同语言。只要有足球，阿根廷人就会找到快乐的理由。"
ARG_revivir_el_cine_argentino: "复兴阿根廷电影"
ARG_revivir_el_cine_argentino_desc: "辉煌的1930年代标志着\"阿根廷好莱坞\"的时代，当时《高乔战争》和《星期二的兰花》等电影吸引了全世界的注意力。阿根廷电影曾在全球范围内受到钦佩，其故事甚至启发了好莱坞。然而，黄金时代让位于实验作品——如《一个孤独孩子的编年史》《入侵》和《号角时刻》，这些电影虽然受到尊重，但无法维持同样的辉煌。随着最后军事独裁政权的到来，该行业遭受了毁灭性的衰退，阿根廷电影的光芒暗淡了。\n\n今天，阿尔贝托·费尔南德斯总统寻求恢复失去的荣耀。他的计划是补贴制片厂，将公共资金引导到激励电影制作人创作真正有价值的作品，能够赢得当地自豪感和国际认可。预算可能会感到压力，但如果阿根廷电影再次崛起，人民将欢欣鼓舞。他们将拥抱文化，而不是紧缩政策，与自由派批评者不同，他们不会因想象中的短缺而游行，而是庆祝艺术的复兴。"
ARG_retenciones_al_campo: "农业保留"
ARG_retenciones_al_campo_desc: "我们最大的寄生问题在于所谓的农村寡头，那些盘踞在村庄和偏远省份的人。由于他们的贪婪，普通农民承受着困难，而国家预算未能获得急需的公平份额的资源。消除这些寄生虫可能不是我们的竞选承诺之一，但这肯定会减轻每个阿根廷公民的负担，不是吗？\n\n在阿尔贝托·费尔南德斯总统的完全批准下，我们终于将对农村寡头征收全面税收，就像我们在关键的2008年所做的那样。有些人可能会问为什么整个农村人口必须做出贡献，但事实很清楚：几乎所有自称农民的人都属于这个寡头阶级。他们是必须承担最重财政负担的寄生虫，以便期待已久的正义最终能够实现。阿根廷人后来会感谢我们，因为只有通过这样的措施，我们的国家财政才能恢复力量并再次充满繁荣。"
ARG_revivir_el_plan_patria_grande: "复兴祖国大计划"
ARG_revivir_el_plan_patria_grande_desc: "\"祖国大计划\"绝非新奇事物。该计划于2006年成立，旨在将长期在阿根廷生活但没有适当文件的南方共同市场公民的居住身份正规化。从一开始，其使命就清晰而大胆：承认这些人是国家社会结构的一部分，并在法律和经济上整合他们。该倡议取得了超出预期的成功，引发了显著的移民浪潮，振兴了社区，填补了空缺的工作岗位，并为阿根廷社会注入了新的活力。然而，在最初的繁荣之后，势头停滞了。该计划继续进行，但没有进一步的雄心，几乎没有产生持久的变革。\n\n这就是为什么阿尔贝托·费尔南德斯总统发誓要将\"祖国大计划\"提升到更高的境界：向每个愿意为阿根廷未来做出贡献的拉丁美洲人发出大陆邀请。他的愿景是一个拥有繁华城镇和繁荣产业的国家，一个人口复兴能够将国家推向繁荣的国家。如果计算准确，阿根廷可能很快会经历人口激增，加强经济并重塑其地区角色。梦想不仅仅是欢迎新来者，而是将他们的能量转化为崛起大国的基石——一个准备领导而不是跟随、制定条款而不是接受条款的共和国。"
ARG_el_superavit_que_necesitabamos: "我们需要的盈余"
ARG_el_superavit_que_necesitabamos_desc: "当我们发起竞选活动时，我们最重要的经济承诺之一是\"建立储备\"，将现有的437亿美元转变为一个巨大的基金，超越前总统毛里西奥·马克里的成就。一开始，政府面临需要立即关注的紧迫优先事项，几乎没有空间建立盈余。然而，随着初步基础工作现在完成，是时候兑现仍然悬而未决的承诺，并应对定义阿根廷经济前景的挑战了。\n\n阿尔贝托·费尔南德斯总统的全面储备积累战略设想多种工具：建立严格的外汇控制系统\"CEPO Cambiario\"，谈判新的货币互换协议，实施选择性进口限制，以及必要时与国际货币基金组织进行精心管理的债务重组过程。这些措施不仅仅是官僚手段，而是朝着主权和稳定迈出的深思熟虑的步骤。很快，国家将庆祝其经济的韧性，自由派马克里的遗产将被财政实力和政治决心的新时代所掩盖。"
ARG_acabar_con_la_grieta: "结束裂痕"
ARG_acabar_con_la_grieta_desc: "如果你问你的当地市长他信奉哪种庇隆主义，他可能会提供基什内尔主义精英期望的答案。问州长，他会背诵联邦庇隆主义领导人喜欢的台词。问总统，他的回答不会让任何一方满意。阿根廷公开穿着其分裂，正义党内部包含一系列派系——从基什内尔主义者到梅内姆主义者——每个派系都声称国家的灵魂。\n\n但缝合裂痕的时刻已经到来。阿尔贝托·费尔南德斯总统厌倦了不断的派系争吵——尤其是那些从一个省蔓延到另一个省的争吵——现在寻求将国家团结在单一愿景之下。他打算将他坚定的手伸向整个共和国，并在曾经存在不和的地方强加团结。任何力量，无论是地方还是省级，都不允许破坏总统职位；违抗的代价将是严重的。这是一个呼吁凝聚力的呼吁，严厉但温和：不是通过小竞争，而是通过深思熟虑、坚定的意志来塑造阿根廷的未来。他不是为了压制异议而说话，而是为了在正义、繁荣和全国各地每个社区共享尊严的基础上建立持久的共识。"
ARG_la_nueva_decada_ganada: "赢得的新十年"
ARG_la_nueva_decada_ganada_desc: "随着我们推进的改革、我们在议会的立法斗争中忍受的决定以及已经兑现的承诺，我们可能会倾向于宣布休息的时候已经到来。然而，很明显阿根廷仍然需要坚持不懈。我们已经获得了更广泛的民众支持；巨大的财政盈余，加上对司法机构的深刻调整和移民的激增，已经将国家转变为一个更强、更自信的版本——比昨天更好，尽管仍远未达到其潜力的顶峰。\n\n虽然这些行动中的许多在我们任期的第一年就形成了，但它们已经让我们瞥见了整个十年的轮廓，这十年很可能在我们的支持下得到保障。公众支持的上升趋势增强了我们在2021年选举中的前景，并将其承诺延伸到2023年，届时胜利将意味着不仅仅是影响力，而是对未来十年的真正管理。然而，尽管感觉历史朝着我们的方向发展，我们仍然意识到胜利不能被视为理所当然。十年可能看起来已经赢得，但真正掌握命运的任务才刚刚开始。"
ARG_capitan_beto_y_las_crisis: "贝托船长与危机"
ARG_capitan_beto_y_las_crisis_desc: "阿根廷现在面临21世纪最严重的非经济危机。COVID-19，一种来自中国的病毒，不仅代表了我们世纪最严重的健康威胁，也是对阿根廷稳定、机构和生活方式的直接危险。它已经动摇了世界，并将继续迅速蔓延，除非采取严厉措施。对于阿根廷来说，犹豫意味着崩溃，而紧迫性可能仍然挽救生命并维护我们社会的脆弱平衡。因此，必须立即颁布紧急措施，在大流行付出全部代价之前。\n\n阿尔贝托·费尔南德斯总统的办公桌上摆着两个决定性的选择。他可以遵循克里斯蒂娜·基什内尔概述的计划，承认她的决定性影响力，但确保政府的和谐和基什内尔主义的支持，从而维持稳定。或者他可以选择独立的道路，确认自己作为自己的总统，但冒着与基什内尔主义者决裂的风险，这一举措可能削弱他的授权甚至推动他辞职。这个困境不能等待。总统必须现在决定，因为他的选择决定了阿根廷本身的生存。"
ARG_la_independencia_de_alberto: "阿尔贝托的背叛"
ARG_la_independencia_de_alberto_desc: "总统寻找自己的道路。"
ARG_la_jefa_manda: "老板掌控一切"
ARG_la_jefa_manda_desc: "经过深思熟虑并在极端时间压力下，阿尔贝托·费尔南德斯总统决定接受克里斯蒂娜·费尔南德斯·德基什内尔为应对COVID-19危机提出的提案。尽管他个人希望独立行动，但他认识到阿根廷的生存和繁荣需要与她合作，即使这意味着与他根本不信任的人合作。这个艰难的决定是为了国家和人民的利益做出的，将对抗大流行的紧急斗争置于个人分歧或政治竞争之上。\n\n该计划最关键的方面是组建一个将整合费尔南德斯总统忠诚者和基什内尔主义者的政府，允许在寻求COVID-19危机解决方案和阿根廷更强大未来的过程中进行宽容与合作。自然，意识形态分歧将继续存在，但至少会有一个合作框架。为了国家、其公民及其稳定，两个派系必须搁置分歧并共同行动，表明即使在深刻分裂的时代，为共同利益的团结仍然是可能的。"
ARG_el_triunvirato_de_la_pandemia: "大流行的三头政治"
ARG_el_triunvirato_de_la_pandemia_desc: "大流行继续摧毁其路径上的一切。从中国局部爆发开始，它已升级为全球危机，在世界范围内引发不确定性。在阿根廷，通货膨胀作为大流行的副作用下降，这为经济提供了一些暂时缓解——但以悲惨的人类代价。COVID-19证明比任何人预期的都要致命得多，需要采取紧急行动，在病毒在全国夺走更多生命之前。\n\n作为回应，阿尔贝托·费尔南德斯总统被迫与布宜诺斯艾利斯市长奥拉西奥·罗德里格斯·拉里塔和布宜诺斯艾利斯省省长阿克塞尔·基西洛夫组建三头政治。他们共同旨在\"在宪法范围内\"有序地管理大流行。必须实施适度的隔离以遏制病毒的传播。同时，有些人认为大流行持续时间越长，它可能越有助于稳定阿根廷的经济。在这个不太可能的转折中，COVID-19可能成为结束困扰该国数十年的通货膨胀循环和反复经济危机的催化剂。"
ARG_imponer_la_aspo: "实施ASPO"
ARG_imponer_la_aspo_desc: "克里斯蒂娜·费尔南德斯·德基什内尔计划的关键要素之一是实施ASPO，即强制性社会预防性隔离。这种严格的隔离要求所有阿根廷人待在家里，除基本部门外，企业和机构关闭。边境将被封锁，合规性将被仔细监控，学校和大学将关闭。ASPO代表了南美洲最严格的遏制措施之一。\n\n尽管其严重性，该措施对于阿尔贝托·费尔南德斯总统和克里斯蒂娜·基什内尔之间的有效合作至关重要，并通过任何必要手段立即阻止病毒的传播。随着时间的推移，随着病毒消退和人群免疫力发展，限制将逐渐放松。目前，公民必须留在家里，仅在必要时外出。这些措施完全旨在保护和造福阿根廷人，无论任何批评或反对，将国家的健康和安全置于一切之上。"
ARG_blindaje_mediatico_albertista: "阿尔贝托主义媒体盾牌"
ARG_blindaje_mediatico_albertista_desc: "反对派不断批评阿尔贝托·费尔南德斯总统，声称隔离违反法律，并断言阿尔贝托本人不可信，应该被监禁。这样的新闻、采访和其他毫无根据的说法只会加深已经因隔离而感到压力和分裂的人们的恐慌。因此，有必要采取决定性措施，使费尔南德斯总统不再被媒体或反对派当作替罪羊，确保他们终于在这样一个关键时刻停止传播不稳定。\n\n因此，费尔南德斯总统将行使其权力，迫使媒体不仅停止传播关于他的虚假或负面信息，还要宣传正面形象。他将被描绘为\"超级阿尔贝托\"，阿根廷对抗COVID-19的保护者，一个力量和领导的象征。在人民眼中，费尔南德斯总统将成为超级英雄，没有人敢说超级阿尔贝托的坏话，巩固他作为危机期间稳定和保护象征的地位。"
ARG_llego_la_pandemia: "大流行来了"
ARG_llego_la_pandemia_desc: "地平线上笼罩着现代人类见过的最大大流行。COVID-19已经到达阿根廷，并准备像野火一样蔓延。从武汉的局部爆发开始，它已经变成一种无法控制的全球病毒——现在我们都面临严重后果。然而，从经济角度来看，大流行可能呈现一个矛盾的机会。对于阿尔贝托·费尔南德斯总统和阿根廷来说，它可能有助于降低通货膨胀，潜在地为某些人可能称之为阿根廷奇迹奠定基础。\n\n尽管如此，迫切需要采取行动。口罩将在全国范围内分发，以防止通过飞沫传播。还必须实施部分封锁，以进一步限制病毒的传播。我们人民——乃至国家本身——的未来取决于我们现在做出的决定。费尔南德斯总统必须在保护公共卫生和稳定经济之间走钢丝，确保通货膨胀达到历史低点而不牺牲生命。"
ARG_la_cuarentena_mas_larga: "世界上最长的隔离"
ARG_la_cuarentena_mas_larga_desc: "针对COVID-19的第一批措施已经实施。全国范围内的隔离持续到2021年，全国实施封锁。人们待在家里，一切似乎都按计划进行。没有人问以前的危机——注意力现在完全集中在共同敌人：COVID-19上。不可否认，这对费尔南德斯总统有利。阿根廷会没事的——每个人都相信这一点。只要阿尔贝托·费尔南德斯总统领导对抗大流行的斗争，国家就是安全的。\n\n但如果隔离再延长一年呢？费尔南德斯总统现在\"宪法上\"提议将封锁延长至2022年，认为国家秩序必须完全恢复，\"经济危机会结束\"，人们必须开始遵守法律，而不是\"违反隔离\"——违反者可能需要\"入狱\"。毕竟，费尔南德斯总统比任何人都更清楚阿根廷真正需要什么。"
ARG_una_cuarentena_temporal: "临时隔离"
ARG_una_cuarentena_temporal_desc: "针对COVID-19的第一批措施已经实施。全国范围内的隔离持续到2021年，全国实施封锁。人们待在家里，一切似乎都按计划进行。没有人问以前的危机——注意力现在完全集中在共同敌人：COVID-19上。不可否认，这对费尔南德斯总统有利。阿根廷会没事的——每个人都相信这一点。只要阿尔贝托·费尔南德斯总统领导对抗大流行的斗争，国家就是安全的。\n\n但阿尔贝托·费尔南德斯总统认为采用欧洲式方法——限制最小化，隔离期缩短——将是正确的行动方针。主要优先事项是经济，这应该是第一位的，预计人口将逐渐发展对COVID-19的免疫力。费尔南德斯总统认为没有理由违反宪法或不必要地延长隔离，因为他相信阿根廷有能力自己克服大流行。"
ARG_aprobar_por_covid_a_los_alumnos: "因COVID批准学生"
ARG_aprobar_por_covid_a_los_alumnos_desc: "COVID-19正在迅速传播。阿尔贝托·费尔南德斯总统已经采取初步措施应对危机，但还不够。最紧迫的问题之一是如何处理学童的教育。一些人提议继续面对面上课，这显然是危险的想法。另一些人建议过渡到在线学习，这是更合理和安全的解决方案。然而，总统心中有不同的方法。\n\n费尔南德斯总统正在考虑给所有学生2020年全年放假。虽然这似乎是一个激烈且有争议的决定，因为它将完全中断教育，但许多学生会欢迎这个消息，这样的举措可能有助于确保他们的长期支持。不可否认，这是一项民粹主义政策，但总统希望它能赢得年轻一代的心。我们只能希望这一步不会带来意想不到的后果。"
ARG_priorizar_la_economia: "优先考虑经济"
ARG_priorizar_la_economia_desc: "管理隔离很重要，但维持经济稳定至关重要。阿根廷已经面临困难的经济形势，COVID-19威胁要破坏迄今为止所做的所有努力。现在没有什么比大流行对国家构成更大的危险，必须解决这个问题，但费尔南德斯总统明白一个错误的举动可能导致阿根廷崩溃。时间不多了，如果不尽快采取行动，一个更好的阿根廷的梦想可能会消失。\n\n这就是为什么阿尔贝托·费尔南德斯总统计划为小企业引入补贴。阿根廷经济的基础在于这些企业，国家不能承受看到它们消失的后果。此外，费尔南德斯总统将提议立法，为急需援助的无利可图公司提供财政支持。通过这些措施，他希望阿根廷能够度过风暴，至少度过今年。"
ARG_vacunas_de_occidente: "西方疫苗"
ARG_vacunas_de_occidente_desc: "必须战胜新冠病毒。只要存在潜在的病毒携带者，大流行就不会结束。至少，我们必须确保大规模疫苗接种以防止进一步感染和死亡。桌上有来自全球伙伴美国、俄罗斯和中国的优秀疫苗报价。每个都提供有希望的解决方案：美国的辉瑞-BioNTech BNT162b2、俄罗斯的卫星V和中国的国药集团BBIBP-CorV。\n\n理想情况下，我们会接受所有这些。但必须做出选择——阿尔贝托·费尔南德斯总统已经做出了选择。阿根廷选择了美国疫苗辉瑞-BioNTech BNT162b2。尽管该国与俄罗斯有着历史上的友好关系，但对俄罗斯卫星V疫苗的来源和可靠性仍存在担忧，使得目前难以完全信任它。通过这一选择加强与美国的关系也可能为潜在的美国经济援助打开大门。这一决定并不标志着阿根廷与俄罗斯合作的结束。相反，它反映了需要使伙伴关系多样化，并通过拥有多个国际选择来保持灵活性。"
ARG_capitan_beto_te_cuida_mucho: "贝托船长非常关心你"
ARG_capitan_beto_te_cuida_mucho_desc: "贝托船长准备捍卫阿根廷免受任何威胁，包括大流行。COVID-19已成为国家安全问题，非常时期需要非常措施。为了确保像贝托船长这样的保护者能够果断行动，阿尔贝托·费尔南德斯总统准备签署一系列紧急法令，授予他们扩大的权力来执行隔离和维持公共秩序。\n\n但这些法令不仅仅是关于贝托船长。费尔南德斯总统认为，为了真正保护阿根廷人免受病毒侵害，必须暂时引入某些公民自由限制，当然，这一切都是以公共健康和安全的名义。然而，反对派指责他违反宪法和侵犯人权。也许他们是对的。但这不是关于权力，而是关于保护。有时，为了拯救生命，领导人必须采取不受欢迎的步骤。就像贝托船长一样，费尔南德斯总统是出于对每个阿根廷人的责任和关怀而行动。现在，船长和总统共同站在对抗共同敌人的一边：COVID-19。"
ARG_el_vuelo_de_la_vida: "生命之飞"
ARG_el_vuelo_de_la_vida_desc: "必须战胜新冠病毒。只要存在潜在的病毒携带者，大流行就不会结束。至少，我们必须确保大规模疫苗接种以防止进一步感染和死亡。桌上有来自全球伙伴——美国、俄罗斯和中国的优秀疫苗报价。每个都提供有希望的解决方案：美国的辉瑞-BioNTech BNT162b2、俄罗斯的卫星V和中国的国药集团BBIBP-CorV。\n\n理想情况下，我们会接受所有这些。但必须做出选择——阿尔贝托·费尔南德斯总统已经做出了选择。阿根廷将主要依赖俄罗斯的卫星V疫苗，预计它将在年底前到达、分发并开始广泛使用。这一决定不仅标志着对抗COVID-19的战略步骤，也重申了我们与俄罗斯长期以来的伙伴关系——在政治、经济，以及现在的医学领域。其他疫苗也将发挥作用，但卫星V将是我们国家免疫努力的基础。有了它，我们离彻底结束这场大流行更近了一步。"
ARG_levantar_la_cuarentena: "解除隔离"
ARG_levantar_la_cuarentena_desc: "COVID-19终于过去了。大多数公民现已接种疫苗，口罩已在全国范围内分发，秩序基本恢复。空气中弥漫着乐观情绪，人们感觉最糟糕的时期已经过去。阿尔贝托·费尔南德斯总统在危机期间为维护国家稳定付出了巨大努力，现在这些努力正在得到回报。经济虽然仍然脆弱，但正在复苏，通货膨胀比2020年初有所下降。阿根廷正在慢慢但肯定地重新站起来。\n\n满怀信心，费尔南德斯总统正式结束隔离。这一决定标志着向恢复正常生活迈出的重要一步。市场和商店重新开业，中央街道再次繁忙起来，城市开始恢复往常的节奏。曾经寂静的街区再次响起交通堵塞和汽车喇叭声。阿根廷重新焕发生机，这在很大程度上归功于带领国家度过风暴的领导层。"
ARG_liberar_presos_por_covid: "因COVID释放囚犯"
ARG_liberar_presos_por_covid_desc: "囚犯也是公民，享有与其他人相同的权利。在阿根廷，囚犯可以像其他人口一样投票——这一事实极大地有利于正义党。这个独特的选举集团始终支持我们的政府，政府则确保更好的监狱条件和人道待遇。多亏了他们的投票，我们得以巩固在议会中的地位并获得额外席位——这是任何政党都永远不会嫌多的。\n\n现在，他们的忠诚值得认可。许多囚犯将被转移到居家监禁，实际上获得自由，而其他人将看到刑期缩短。他们必须明白，正义党首先是人民的政党——而囚犯也是人，就像任何其他阿根廷人一样。没有理由害怕。毕竟，我们会密切监视他们。"
ARG_los_superpoderes_de_alberto: "阿尔贝托的超级权力"
ARG_los_superpoderes_de_alberto_desc: "COVID-19是阿根廷在21世纪面临的最大危机。经济岌岌可危，但反对派中的许多人未能理解局势的严重性。在这样的非常时期，阿尔贝托·费尔南德斯总统需要更广泛、更果断的权力来引导国家度过这场风暴并恢复稳定。批评者可能会高呼独裁或指责他绕过宪法，但他们错了。费尔南德斯不是在寻求个人权力，只是在寻求保护阿根廷人民和重建国家所需的工具。\n\n为此，总统政府正在推动议会授予总统扩大的紧急权力。这些权力包括，例如，无需等待立法批准即可通过国家预算的能力——如果反对派试图阻挠优先考虑公共福利的政策，这是至关重要的一步。此外，费尔南德斯可以通过法令颁布某些紧急法规。当然，所有这一切都是为了捍卫阿根廷，并兑现保护其公民在历史性困难时刻的承诺。"
ARG_la_mision_guzman: "古斯曼的使命"
ARG_la_mision_guzman_desc: "阿根廷经济部长马丁·马克西米利亚诺·古斯曼有着引人注目的但此前默默无闻的背景。他于1982年10月12日出生在拉普拉塔，在拉普拉塔国立大学学习经济学，然后继续在美国布朗大学深造。后来他在哥伦比亚大学与诺贝尔经济学奖获得者约瑟夫·斯蒂格利茨密切合作，专门研究主权债务和经济重组。在被任命之前，古斯曼在阿根廷广大公众中几乎不为人知，但现在许多人意识到他们忽视了一位杰出的人才。\n\n如今，古斯曼肩负着沉重的负担。他的任务是控制通货膨胀、在全球大流行期间管理经济，以及重组阿根廷庞大的公共债务。尽管他在国内缺乏政治知名度，但阿尔贝托·费尔南德斯总统甚至斯蒂格利茨都对他表示充分信任。阿根廷处于脆弱状态，古斯曼必须果断行动。国家的未来很可能取决于他的成功，因为这一次，失败可能是致命的。"
ARG_emergencia_economica_social: "社会经济紧急状态"
ARG_emergencia_economica_social_desc: "阿根廷经济正处于深刻且持续的危机之中。公众仍然过度关注美元，常常忽视比索，而出口对国家来说越来越无利可图，导致国家收入减少。公用事业费率继续上涨，将更多公民推向贫困。与此同时，养老金支出持续增长，给已经超出极限的预算带来更大压力。中小企业正深陷债务——这些债务不能简单地一笔勾销。但有一个计划。\n\n经济部长马丁·古斯曼提出了一项全面的法律，旨在暂时稳定局势。它包括对美元购买征收3%的税以减少美元需求，冻结公用事业费率上涨，并暂停自动养老金增长。为解决财政短缺，将引入新的出口税——特别针对农业。此外，中小企业将获得更宽松的债务偿还条款和特定福利以减轻负担。这项倡议不是永久性的解决方案，但旨在作为临时盾牌——争取时间直到危机最严重的部分得到控制。"
ARG_un_cepo_blindado: "装甲CEPO"
ARG_un_cepo_blindado_desc: "在卡洛斯·梅内姆总统任期内，美元成为阿根廷非正式的第二货币，尤其是在比索与美元挂钩之后。随着时间的推移，两种货币都经历了经济动荡，但比索由于反复贬值和通货膨胀遭受的损失要大得多。与比索不同，美元保持了其强势，这导致阿根廷人对美元产生了根深蒂固的偏好。对比索的信任稳步下降，给阿尔贝托·费尔南德斯总统及其政府带来了严重问题。\n\n为解决这一问题，经济部长马丁·古斯曼引入了严格的货币管制，称为cepo cambiario。根据这些规定，个人每月只能以官方汇率购买最多2美元。除了现有的3% PAIS税外，古斯曼还对美元购买增加了35%的所得税，使外汇更难获得且更昂贵。目标很明确：减少美元需求并开始恢复对比索的信心。这是一个困难且有风险的举措，但古斯曼认为这对于稳定经济和避免更深层次的危机是必要的。"
ARG_crear_el_ife: "创建IFE"
ARG_crear_el_ife_desc: "COVID-19猛烈袭击了阿根廷。成千上万的人正在失去收入来源，贫困在全国范围内迅速上升。消费者需求的崩溃，尤其是对食品的需求，正将整个阿根廷经济置于危险之中。弱势群体，如单身母亲，情况尤其令人担忧，如果没有某种形式的即时援助，她们可能无法生存。除非采取紧急措施，否则潜在的社会爆炸即将发生。\n\n面对这场危机，阿尔贝托·费尔南德斯总统求助于他的经济部长马丁·古斯曼寻求解决方案。古斯曼的答案是创建紧急家庭收入计划（Ingreso Familiar de Emergencia），这是一项旨在提供直接现金援助的紧急收入计划。根据该计划，符合条件的个人将获得一次性1000比索的付款，并且在不久的将来可能会再有两轮付款。目标很简单：阻止贫困的快速蔓延，并在大流行继续展开时为人们提供经济生命线。"
ARG_expandir_los_planes_sociales: "扩大社会计划"
ARG_expandir_los_planes_sociales_desc: "有多少失业者陷入贫困而无法自拔？有多少家庭因为系统性经济困难而每天挣扎？有多少小企业因为无法获得所需的福利而倒闭？这些问题已经成为阿根廷的日常现实，一个人民再也无法接受为正常的现实。公众正在寻求答案，但COVID-19、通货膨胀和不断增长的预算赤字的综合压力使得几乎不可能同时解决所有问题。\n\n尽管如此，经济部长马丁·古斯曼提出了一条平衡的前进道路。社会计划将扩大，但要谨慎进行，目标是帮助最需要帮助的人而不加剧通货膨胀。工人将获得新的补贴以减轻负担。失业救济金将增加，但同时将推动领取者更快地重新进入劳动力市场。小企业将获得更容易获得国家支持的机会。这些措施不会一次性解决所有问题，是的，存在使经济恶化的风险，但政府致力于做出真正的改变，即使必须一步一步来。"
ARG_implementar_control_de_cambios: "实施外汇管制"
ARG_implementar_control_de_cambios_desc: "国家缺乏有效控制其货币的足够工具。美元随时可能急剧上涨或下跌，威胁引发快速的经济崩溃。过去将比索与美元挂钩是一个严重的错误，如果我们现在不采取行动，我们可能面临比2021年崩溃更严重的危机。风险很高，这可能成为阿根廷历史上最严重的金融灾难。\n\n为防止这种结果，经济部长马丁·古斯曼提出了一系列非正统的经济措施，旨在增加国家对外汇市场的控制。他提议的核心是固定美元价格，创造稳定性并确保任何危机都是逐步展开而非爆发性的。古斯曼希望这只是更广泛经济调整战略的第一步，但即使在完整计划到位之前，他坚持立即采取行动至关重要。"
ARG_programa_precios_justos: "公平价格计划"
ARG_programa_precios_justos_desc: "毛里西奥·马克里是21世纪第一位废除价格管制并推动市场改革的总统，希望这些措施能够拯救阿根廷。不幸的是，相反的情况发生了，局势只会变得更糟。内斯托尔和克里斯蒂娜·基什内尔的努力，尽管许多人反对克里斯蒂娜，但取得了重大成就。我们获得了宝贵的经验，特别是在管理经济方面，现在费尔南德斯总统承诺带领阿根廷走出危机，必须做到这一点。\n\n经济部长古斯曼提议恢复\"受保护价格\"计划，该计划固定了基本商品的价格。他还希望冻结公用事业费率，以便电费不会增加，让人们能够度过困难时期，同时紧急家庭收入计划继续提供支持。人民投票支持我们，在这些困难时刻仍然信任我们，我们为什么要让他们失望？"
ARG_gasoducto_y_problemas_al_horizonte: "地平线上的问题"
ARG_gasoducto_y_problemas_al_horizonte_desc: "麻烦正在地平线上隐现。生产发展部长马蒂亚斯·库尔法斯公开指责副总统克里斯蒂娜·基什内尔腐败并导致\"内斯托尔·基什内尔总统天然气管道\"项目延误。作为回应，据报道克里斯蒂娜准备解雇他。但这不是唯一的问题，经济部长马丁·古斯曼也因与克里斯蒂娜的紧张关系而威胁辞职。如果这些冲突不尽快解决，对政府的后果可能很严重。\n\n尽管与克里斯蒂娜存在个人分歧，阿尔贝托·费尔南德斯总统决心进行调解并让所有人重新团结在一起。他的目标是防止库尔法斯和古斯曼辞职，并避免任何内阁清洗或更糟糕的政党分裂，这可能会破坏他的领导地位。虽然局势可能尚未完全解决，但阿尔贝托真诚地希望下次紧张局势会缓和，政府内部的共识将保持强劲。"
ARG_expropiar_el_vicentin: "征用维森廷"
ARG_expropiar_el_vicentin_desc: "维森廷是阿根廷最大的农业工业集团之一，1929年在圣菲州作为一家小型家族企业成立，最初经营棉花和花生。几十年来，它发展壮大，到1966年已扩展到工业加工，包括溶剂萃取。它在阿根廷经济中的影响力变得显著。然而，2019年，维森廷违约，留下了超过10亿比索的巨额债务给国有国家银行。这次违约使公司高度依赖国家，并为潜在的政府干预打开了大门。\n\n阿尔贝托·费尔南德斯总统从中看到了机会，在COVID-19危机中，维森廷可以成为宝贵的国有资产。将公司国有化不仅会加强国家对关键部门的控制，还会确保利润在急需的时刻留在公共领域。然而，存在阻力。圣菲州州长奥马尔·佩罗蒂反对完全国有化，而是主张国家部分参与和监督。尽管佩罗蒂的立场可能没有最终决定权，但他的合作在此时具有政治价值。现在费尔南德斯必须决定是推动完全控制还是妥协以维护政治团结。"
ARG_los_dolares_son_para_producir: "美元用于生产"
ARG_los_dolares_son_para_producir_desc: "阿尔贝托·费尔南德斯总统曾承诺设定一个有利于出口商的美元汇率，这是帮助他赢得选举的关键承诺之一。现实很清楚：对于阿根廷生产商来说，在国外销售商品通常无利可图，因为阿根廷产品在国际市场上定价过高。现在，为了避免失去中小企业的重要支持——这是他政治基础的核心支柱——总统必须最终兑现这一承诺。\n\n费尔南德斯采取行动提高官方美元汇率，调整汇率以便出口商能够在全球范围内盈利销售产品，尽管不在阿根廷国内。然而，一个主要障碍挡在路上：\"蓝色美元\"，即非官方市场汇率，远低于国家控制的汇率并主导实际流通。结果是，出口商赚的钱比他们本可以赚的少，而进口商支付的钱比他们应该支付的多得多。而对于蓝色美元，政府没有真正的武器。只剩下希望它不会破坏整个计划。"
ARG_programa_atp: "ATP计划"
ARG_programa_atp_desc: "COVID-19可能引发毁灭性的失业和许多公司的倒闭。这种情况以前从未发生过，现在我们发现自己处于一个关键的十字路口。如果做出正确的决定，阿根廷可以获得重大利益，否则它可能被完全摧毁，沦为昔日自我的影子。最终，我们代表人民，特别是工人阶级，我们绝不能允许我们的公民大规模失业和失去收入。\n\n这就是为什么古斯曼部长提议创建工作与生产紧急援助计划。这项倡议旨在推迟或减少雇主高达95%的SIPA缴款，为私营部门工人提供公共资金补充工资，并为自雇人士提供零息贷款或优惠条件。当然，由于预算赤字，实施这一计划将具有挑战性，但古斯曼和费尔南德斯总统都保证将有足够的资金维持该计划直到明年，预计明年会比今年有所改善。"
ARG_obras_en_almirante_brown: "阿尔米兰特·布朗的工程"
ARG_obras_en_almirante_brown_desc: "阿尔米兰特·布朗位于布宜诺斯艾利斯省，坐落在地势低洼、排水不畅的土地上，交织着如雷河和科里马约河等小型河流和溪流。大雨来临时，水迅速淹没街道和庭院。除了洪水本身，该地区还面临着老化排水系统容量不足造成的严重问题。例如，雷河已经杂草丛生、淤塞，减缓了水流并加剧了洪水问题。\n\n费尔南德斯总统制定了一项解决方案，通过广泛的水利工程来应对这些挑战。其中包括布尔萨科南部雨水排放项目，这是一个大规模的雨水下水道系统，旨在显著改善排水。另一项重要举措雅佩乌2号，旨在改善里瓦达维亚部长和隆尚地区的排水基础设施。这些项目共同代表了阿尔米兰特·布朗近期历史上最雄心勃勃的公共工程，有望防止未来的洪水或至少大大减少其影响。"
ARG_financiar_industria_automotriz_nacional: "资助阿根廷汽车工业"
ARG_financiar_industria_automotriz_nacional_desc: "菲亚特和雷诺是阿根廷最大和最有影响力的外国汽车制造商之一，尽管它们在该国的历史截然不同。菲亚特于1919年首次抵达，在20世纪60年代推出了标志性的菲亚特600“Futito”，成为阿根廷道路的象征。该公司在2001-2002年经济危机期间被迫关闭，但在2008年回归，重新获得了市场地位，并在2018年推出菲亚特克罗诺斯时甚至取得了显著成功。雷诺后来于1967年进入阿根廷，1971年发布了雷诺12，该车型在当时获得了广泛欢迎。然而，近年来雷诺面临持续困难，销售低迷且缺乏盈利能力。\n\nCOVID-19大流行进一步削弱了两家公司，使得国家的财政支持变得必要。尽管情况不同，但菲亚特和雷诺对阿根廷经济都至关重要，提供就业、技术投资和工业产能。因此，费尔南德斯总统打算向两家公司提供补贴，确保它们能够再运营一年，希望到明年它们能够恢复盈利能力并继续为国家的增长做出贡献。"
ARG_reactivar_la_industria_nacional: "重新激活民族工业"
ARG_reactivar_la_industria_nacional_desc: "由于COVID-19的影响，民族工业陷入了深刻的危机。无论我们付出多少努力来解决这个问题，支付工人工资并补贴单一部门——即机械工程——整体工业格局继续下滑，民族部门遭受的损失最大。更复杂的是，机械工程行业的大部分是外资拥有的。现在是恢复阿根廷工业伟大地位的时候了，但这样的复兴不能从零开始。恢复到COVID之前的状况需要远见，费尔南德斯总统相信他有这样的远见。\n\n对机械工程的补贴已被证明是成功的，给了我们宝贵的经验，并无可否认地证明有针对性的支持可以让陷入困境的公司维持下去。在此基础上，莫利诺·卡努埃拉斯和其他公司现在将获得国家资金以维持生产，避免像维森廷那样陷入破产的命运。根据经济部长马丁·古斯曼的说法，这种方法可以拯救许多公司免于倒闭——这对国家来说既是经济上的损失也是政治上不可取的结果。"
ARG_negociar_con_el_fmi: "与国际货币基金组织谈判"
ARG_negociar_con_el_fmi_desc: "阿根廷与国际货币基金组织之间的关系一直很紧张。2018年的附加费是对阿根廷债务的惩罚，标志着这些困难关系的顶峰。但现在，不幸的是，阿根廷需要国际货币基金组织，主要是因为其债务。当然，回到这样的老'朋友'身边非常不愉快，但为了人民，你能做什么？因此，费尔南德斯总统将谈判任务分配给了经济部长古斯曼。\n\n古斯曼必须说服国际货币基金组织总裁重新考虑阿根廷的债务以及向阿根廷经济投资资金的可能性。当然，不能保证他们会同意，特别是考虑到我们的危机历史，古斯曼不确定他们是否会向一个多年来一直处于经济动荡中的国家提供资金。但仍然值得一试。最终，这可能是阿根廷与国际货币基金组织关系新篇章的开始。"
ARG_reestructurar_la_deuda_interna: "重组国内债务"
ARG_reestructurar_la_deuda_interna_desc: "与债权人的谈判正在进行中，我们提出了几项关键措施来减轻阿根廷的债务负担。这些措施包括降低未偿债务的利率、延长还款期限以及部分减免债务，有效降低其实际价值。如果这些谈判成功，这将标志着费尔南德斯总统和经济部长古斯曼的重大胜利，同时也为阿根廷脆弱的经济提供重要支持，帮助它更好地应对COVID-19大流行的持续挑战。\n\n幸运的是，谈判似乎进展顺利。我们已经与大约93-99%的债券持有人达成协议，这对费尔南德斯政府来说是一项显著成就。多亏了这些协议，债务支付减少了近一半，从7%降至3%，还款期限延长了十年甚至二十年。最后一步是重组根据阿根廷法律发行的债务，一旦完成，这将成为阿根廷21世纪最伟大的经济成就之一。"
ARG_gira_europea_de_alberto: "阿尔贝托的欧洲之旅"
ARG_gira_europea_de_alberto_desc: "自独立以来，欧洲与阿根廷之间的关系一直不顺利。我们庇护阿道夫·艾希曼、安特·帕韦利奇和约瑟夫·门格勒博士等纳粹罪犯的决定永久玷污了我们的形象，使阿根廷获得了第三帝国逃犯避风港的声誉。在现代，关系已经正常化，但马岛冲突的遗留问题仍然存在。国际叙事常常将阿根廷描绘成侵略者，而占领该群岛数百年的英国却很少被描绘成同样的形象。尽管如此，重新与欧洲接触现在是必要的。\n\n驱动这种紧迫性的是白银——阿根廷迫切需要但近年来供应短缺的资源。当然，欧洲不会简单地交出白银而不获得回报。这就是为什么与欧洲同行有长期联系的经济部长马丁·古斯曼将亲自前往欧洲大陆。他的使命：为阿根廷进口白银谈判更有利的条件。对于费尔南德斯总统来说，理由很简单——一切为了国家的利益，即使这意味着重新打开微妙的外交渠道。"
ARG_acercarse_a_china: "走近中国"
ARG_acercarse_a_china_desc: "中国也许是阿根廷最被低估的伙伴之一，不幸的是，我们对这一关系关注太少。1972年签署《布加勒斯特公报》建立了首次官方接触。1982年，豪尔赫·魏地拉总统成为首位访问中国的阿根廷领导人。2001年中国加入世界贸易组织后，伙伴关系进入新阶段，后来通过2014年全面战略伙伴关系宣言以及2018年习近平主席访问阿根廷后签署的2019-2023年联合行动计划得到巩固。\n\n现在，在一个被COVID-19大流行震撼的世界里，费尔南德斯总统决定重新调整阿根廷的部分外交政策，将重点从主要是俄罗斯伙伴关系转向与中国建立更密切的关系——同时仍在平衡与西方（以欧盟和美国为代表）以及东方（以俄罗斯和中国为代表）的关系。当然，这样的战略可能不会让阿根廷所有伙伴都满意，但从战略角度来看，它为国家提供了两全其美的方案。通过维持多样化的联盟，阿根廷将自己定位为多个全球大国的宝贵资产，确保它可以从每个国家获得利益，同时保持自己的主权。"
ARG_expandir_el_sector_publico: "扩大公共部门"
ARG_expandir_el_sector_publico_desc: "由于私营部门的破产或大规模裁员，成千上万——甚至数十万——的人失业。尽管创建了IFE计划，我们不能简单地允许他们继续失业并依赖政府援助。在政府内部，已经提出了许多提案，包括经济部长马丁·古斯曼的提案，他的意见在费尔南德斯总统心中分量最重。尽管有各种声音和建议，阿尔贝托·费尔南德斯总统自然会倾向于遵循他信任的经济战略家的建议。\n\n古斯曼部长的提议很明确：扩大公共部门。他建议增加政府支出以雇佣那些因COVID-19危机而失业的人。虽然预算赤字是一个问题，但部长警告说，不控制失业率将更糟——因为失业率持续时间越长，最终赤字将越大。"
ARG_la_economia_post_pandemia: "大流行后的经济"
ARG_la_economia_post_pandemia_desc: "COVID-19大流行给我们的经济留下了深刻而持久的影响。数千人失去了工作，众多公司破产，比索大幅贬值。所有这一切都发生在严格隔离期间，但如果不是经济部长马丁·古斯曼的果断行动，情况可能会更糟。他的措施——如固定官方美元购买汇率、实施基本商品价格控制以及引入紧急家庭收入计划——对于防止经济全面崩溃至关重要。\n\n现在，随着我们进入后COVID时代，存在谨慎的乐观。预计经济将逐步恢复正常，人们将再次稳步找到工作。尽管通货膨胀持续，但失控的价格飙升应该成为过去。随着最新政策的到位，经济学家终于可以期待在数天的激烈斗争和不确定性之后得到一些应得的喘息机会。阿根廷可以再次自由呼吸，这在很大程度上要归功于马丁·古斯曼的努力和领导。"
ARG_el_nuevo_pacto_social: "新社会契约"
ARG_el_nuevo_pacto_social_desc: "商人和工会成员之间的互动一直是阿根廷历史中的重要元素。在20世纪，庇隆引入了社团主义并相当有效地运作。然而，在21世纪，卡洛斯·梅内姆的改革拆除了社团主义结构，转而支持自由市场模式。在毛里西奥·马克里总统任期内，这一转变变得更加明显，工会发起了长期罢工，而马克里几乎完全专注于商业而非人民。\n\n费尔南德斯总统现在打算通过在商人和工会成员之间建立新契约来扭转这一趋势，特别是考虑到COVID-19危机期间合作的必要性。我们承认了过去的错误，费尔南德斯完全致力于为人民和工人工作，而不是听从企业利益的节奏。我们不是傀儡，这一契约将清楚地表明，商业必须跟随我们的领导，而不是相反。"
ARG_la_lista_negra_de_opositores: "反对派黑名单"
ARG_la_lista_negra_de_opositores_desc: "1976年，军方和极右翼势力推翻了正义党领袖、阿根廷总统伊莎贝尔·庇隆，原因只有一个：她是庇隆主义者。蒙托内罗斯和人民革命军威胁在庇隆返回时暗杀他，因为他也是庇隆主义者。UCR和类似团体威胁推翻正义党政府，仅仅因为它代表庇隆主义。后来，PRO和毛里西奥·马克里考虑完全禁止庇隆主义，就像20世纪50年代和60年代那样。然而，尽管面临所有这些威胁，我们坚持了下来。\n\n然而，今天政变的危险比以往任何时候都更严重。自由意志主义者及其狂热分子不顾一切地想要夺取权力，因为他们知道人民仍然信任我们。这就是为什么费尔南德斯总统提议创建一份构成对阿根廷威胁的反对派人物名单，并使用勒索、解雇和政治孤立等措施来压制他们。是的，这样的行动可能违反宪法和法律规范，但宪法没有给我们其他工具来对抗真正的、日益增长的政变威胁。无所作为会更糟。"
ARG_perseguir_con_la_ley_a_opositores: "依法追究反对派"
ARG_perseguir_con_la_ley_a_opositores_desc: "尽管费尔南德斯总统对基什内尔夫妇有着根深蒂固的敌意，但后者在处理一个随时面临监禁的反对派方面表现出了非凡的技巧。内斯托尔·基什内尔废除了《终点法》和《服从法》，重新起诉对肮脏战争罪行负责的人，并通过这样做有效地迫使武装部队屈服。克里斯蒂娜·基什内尔反过来削弱了独立媒体巨头《号角报》和《民族报》的影响力，同时通过一系列果断改革巩固了对媒体的控制。\n\n他们的政治经验是无价的：他们掌握了在法律框架内对抗反对派的艺术，我们也将如此。我们名单上的第一个名字不是别人，正是阿根廷前总统毛里西奥·马克里。在他的政府期间，出现了非法监视和间谍活动的证据，包括监控ARA圣胡安号潜艇遇难船员的亲属，以及通过AFI情报机构监视反对派人物。FMIgate丑闻进一步暴露了他的政府，还有离岸泄密事件中关于Fleg Trading Ltd.和Kagemusha S.A.的披露，两者都与马克里家族有关。他还操纵了AFIP税务机构并发起了对庇隆主义者的迫害——出于这些原因，他将是许多人中第一个面临正义审判的人。这将标志着对阿根廷进行彻底清洗的开始，由法律执行，针对那些长期应受问责的人。"
ARG_intimidar_legalmente_a_opositores: "依法恐吓反对派"
ARG_intimidar_legalmente_a_opositores_desc: "尽管费尔南德斯总统对基什内尔夫妇有着根深蒂固的敌意，但后者在处理一个随时面临监禁的反对派方面表现出了非凡的技巧。内斯托尔·基什内尔废除了《终点法》和《服从法》，重新起诉对肮脏战争罪行负责的人，并通过这样做有效地迫使武装部队屈服。克里斯蒂娜·基什内尔反过来削弱了独立媒体巨头《号角报》和《民族报》的影响力，同时通过一系列果断改革巩固了对媒体的控制。\n\n但我们不能简单地沿着基什内尔夫妇的老路走下去。克里斯蒂娜和内斯托尔都不完全正确，特别是克里斯蒂娜不应该对报纸发动如此公开的战争。我们的方法将不同。我们将寻求合法地向反对派施压并恐吓他们，使他们在传播关于费尔南德斯总统的荒谬言论之前三思而后行。记者以及在公共和政治组织工作的人将被悄悄但坚定地提醒鲁莽指控的后果。目标是防止错误信息毒害人民的思想并导致他们相信费尔南德斯总统及其政府是骗子或恶棍。"
ARG_barrer_con_las_causas_de_cfk: "清除CFK的司法案件"
ARG_barrer_con_las_causas_de_cfk_desc: "\"维亚利达德\"案件、\"笔记本\"案件、AMIA案件、Hotesur和Los Sauces案件，以及\"期货美元\"案件——所有这些针对副总统克里斯蒂娜·费尔南德斯·德基什内尔的诉讼程序——我们认为实际上是出于政治动机的努力，旨在损害基什内尔主义运动和正义党的声誉。\n\n为确保正义占上风，阿尔贝托·费尔南德斯总统将以程序为由推迟、延期或暂停涉及克里斯蒂娜·费尔南德斯·德基什内尔的听证会。尽管此类措施可能被批评为不民主，但它们将提供必要的时间来准备全面的法律辩护并提出证明她无罪的综合论点。这些由右翼反对派驱动的指控将得到正当程序的对待，给司法机构所需的时间来做出维护正义的决定。"
ARG_legalizar_el_aborto: "使堕胎合法化"
ARG_legalizar_el_aborto_desc: "尽管我们在妇女权利方面取得了重大进展——1921年允许在怀孕危及妇女生命或涉及强奸精神病妇女的情况下堕胎，2012年将堕胎权扩大到所有强奸受害者——阿根廷社会在很大程度上仍然保守。前总统毛里西奥·马克里在2018年未能通过议会更广泛的堕胎权法案。\n\n现在我们将继续这一努力。阿尔贝托·费尔南德斯总统将向阿根廷国会提交一份完全准备好的法案进行投票。长期以来，我们一直推迟兑现承诺，但随着COVID情况的缓解，我们终于可以朝着进步主义迈出决定性的第一步——朝着一个公正、团结和平等的阿根廷迈出第一步，为工人阶级服务。\n\n阿根廷万岁！"
ARG_poner_fin_al_patriarcado: "结束父权制"
ARG_poner_fin_al_patriarcado_desc: "随着堕胎法案的通过和生效，以及数十项其他大大小小的妇女权利倡议，成立了妇女、性别和多样性部，负责将阿根廷转变为一个更加平等的社会，逐步在国家身份证件上引入第三个非二元性别选项，为跨性别者提供工作场所配额，扩大对孕妇和低收入家庭的经济支持，并在经济部层面正式承认性别工资差距，现在可以明确指出：父权制的基础已被打击。\n\n当然，这不是结束——而是第一场战斗已经胜利，我们打算将这一势头继续推进。"
ARG_alberto_con_la_cgt: "阿尔贝托与CGT"
ARG_alberto_con_la_cgt_desc: "总工人联合会是阿根廷最强大的工会，如果阿尔贝托·费尔南德斯总统希望在中期选举中确保胜利，其支持至关重要。在CGT的支持下，成千上万的工人可以被动员起来投票支持正义党，而不是转向UCR或FIT-Unidad。因此，费尔南德斯总统寻求与工会主要领导人会面，因为他们的支持将对投票结果产生决定性影响。\n\n为赢得CGT的支持，费尔南德斯准备承诺为工人提供补贴，这一措施可以保护家庭免受困难并加强对他领导的信任。与此同时，他打算重申他对劳工改革的承诺，这将保护工人权利并确保有组织的劳工声音在阿根廷政治生活中保持核心地位。这项协议可能标志着一个新时代的开始——一个真正的工人国家，不是为寡头而建，而是为将费尔南德斯推上权力并宣誓为之治理的人民而建。"
ARG_la_censura_politicamente_correcta: "政治正确的审查"
ARG_la_censura_politicamente_correcta_desc: "每天，反对派说出数百个违反政治正确原则的短语——被贴上种族主义、歧视性或仇外标签的词语。即使与文化、艺术或音乐相关的无害事物也被谴责为有问题，这直接违背了费尔南德斯总统设定的进步路线。反对者可能会高呼\"审查\"，但他们所谓的审查实际上是建设一个尊重、尊严和平等社会的努力——这些价值观是反对派从未接受的。\n\n因此，INADI将毫不犹豫地进行干预。它的职责是打击公开冒犯性语言以及过时言论和思想的微妙残余。旧电视节目、流行音乐家，甚至标志性系列如《龙珠》可能需要修改、限制或完全删除。这可能看起来很严厉，但这是为了更大的利益：确保没有公民感到\"被羞辱\"并保持马克思主义支持者的信任，他们的忠诚对未来至关重要。这场政治正确运动不能允许犹豫或妥协。每一个词、每一个图像、每一个符号都必须为新阿根廷的诞生服务——净化冒犯，在敏感中团结，并在价值观上坚定不移。"
ARG_mas_planes_sociales: "更多社会计划"
ARG_mas_planes_sociales_desc: "补贴和正义党在中产阶级中的低支持率可能看起来是分开的问题，但实际上它们密切相关。没有这个社会群体的支持，正义党有输掉选举的风险，因为大多数中产阶级同情PRO并倾向于投票给变革联盟。COVID-19大流行只会加深这个问题：无数小企业正在破产，许多公民失去了工作和收入，对费尔南德斯总统和正义党的信心每天都在下降。如果这种信任完全耗尽，政治后果将是灾难性的且难以逆转。\n\n克里斯蒂娜·基什内尔仍然提供了一项战略。根据她的计划，费尔南德斯总统必须向阿根廷公民提供补贴，特别关注中产阶级，以便企业至少能够生存到选举。这不仅是一项社会措施，也是一项政治措施：这是恢复正义党失去的部分信誉的机会，表明我们可以在危机时期保护人民，并说服他们投票支持正义党，或者至少远离变革联盟。即使是对其他左翼力量或联邦庇隆主义者的支持也比变革联盟的胜利更好。"
ARG_preparar_elections_2021: "准备2021年立法选举"
ARG_preparar_elections_2021_desc: "很快阿根廷将面临决定性的议会中期选举。尽管政府尽了一切努力，民意调查仍然显示变革联盟领先，这个结果是不能允许的。每个人都记得马克里的灾难性实验——多年的债务、私有化和对寡头的偏袒。回到那些政策将意味着将人民重新推向贫困，并将国家交给同样的小精英阶层。必须不惜一切代价防止这样的结果。\n\n在这个关键时刻，贝托船长发现自己处于战略十字路口。一个选择是授予克里斯蒂娜·基什内尔和她的忠诚者完全控制竞选活动的权力。他们的机器经验丰富，他们的集会和口号比我们的更有效，他们可以阻止变革联盟。然而，克里斯蒂娜变得越强大，以后就越难遏制她的野心。另一个选择是费尔南德斯总统以自己的名义领导竞选活动。这条道路短期内可能看起来较弱，但它直接打击克里斯蒂娜的主导地位并削弱她的马克思主义派系。因此，困境仍然存在：将胜利交给克里斯蒂娜以阻止变革联盟，还是为了减少她压倒性的影响力而冒着失败的风险。这个选择不仅将决定2021年的选举，还将决定阿根廷未来的整个权力平衡。"
ARG_la_jefa_dirigira_la_campana: "老板将领导竞选"
ARG_la_jefa_dirigira_la_campana_desc: "现在阿尔贝托·费尔南德斯总统的时间已经不多了，迫使他决定谁将领导正义党的竞选活动。经过数天的犹豫和思考，费尔南德斯最终将竞选活动的控制权交给了克里斯蒂娜·基什内尔和她的K激进分子，相信只有他们拥有防止变革联盟夺取胜利的机器和经验。他们动员选民、主导媒体和瓦解反对派的能力是不可否认的，多亏了这一点，执政党将在议会中获得更强的地位，保护自己免受PRO和寡头的直接威胁。\n\n但任何硬币都有两面。克里斯蒂娜，我们无法完全控制的老鼠，将不可避免地增加她的影响力，她赢得的每一个额外席位都加强了她对政府的掌控。如果她获得太多权力，她将排挤亲费尔南德斯的部长，并用只知道强加马克思主义政策并阻止任何不符合他们教条的改革的忠诚走狗取而代之。对于费尔南德斯来说，这意味着持续的瘫痪、无休止的冲突，以及成为纯粹傀儡的风险。然而，选择已经做出，只有上帝知道这是否会拯救总统职位或摧毁它。"
ARG_apoyar_tolosa_paz: "支持托洛萨·帕斯"
ARG_apoyar_tolosa_paz_desc: "选举越来越近，所有目光都集中在布宜诺斯艾利斯省，这是中期选举的决定性战场。无论谁在这里获胜，都将决定权力平衡，对于庇隆主义运动来说，没有失败的余地。PRO自2007年以来一直主导首都，因此克里斯蒂娜·费尔南德斯·德基什内尔必须推出一个能够扭转潮流的候选人，一个能够以正义党和阿根廷的名义激发希望并动员布宜诺斯艾利斯人民的人物。很长一段时间以来，这样的候选人似乎几乎不可能找到，但最终做出了选择。\n\n她的名字是维多利亚·托洛萨·帕斯，克里斯蒂娜的忠诚支持者，一位拥有对抗PRO机器所需魅力和纪律的女性。随着她的候选人资格，正义党找到了重新获得影响力的机会。巨大的行政资源将用于她的竞选活动，因为她的胜利不仅意味着布宜诺斯艾利斯的胜利，也是整个政府的生存。这些选举要么巩固PRO的主导地位，永远埋葬正义党在首都的希望，要么动摇现状，带来新的气息和不同未来的承诺。"
ARG_victoria_kirchnerista: "基什内尔主义的胜利"
ARG_victoria_kirchnerista_desc: "选票已统计完毕，结果终于揭晓。在中期选举中，正义党取得胜利，巩固了其在全国的地位，并决定性地击败了变革联盟。全民阵线加强了在参议院和众议院的多数席位，让反对派非常失望，粉碎了他们夺取权力的希望。阿根廷梦想依然存在，这一切都要归功于克里斯蒂娜·基什内尔和K激进分子，他们的奉献将如此关键的胜利交到了费尔南德斯总统手中。\n\n尽管克里斯蒂娜和她的K激进分子对日常政治议程的影响力更大，费尔南德斯总统现在更依赖他们的支持，但这一胜利为正义党在即将到来的2023年选举中奠定了坚实的基础。这场胜利属于阿根廷人民——属于工人、中产阶级、工会和企业主。最终，这不仅仅是一场政治胜利；这是基什内尔主义的重申，一场团结和加强整个国家的胜利。"
ARG_la_campana_de_capitan_beto: "贝托船长的竞选"
ARG_la_campana_de_capitan_beto_desc: "现在阿尔贝托·费尔南德斯总统的时间已经不多了，迫使他最终决定谁将接管正义党的竞选活动。经过长时间的压力、疑虑和思考，贝托船长做出了大胆的选择，亲自领导竞选活动。这是一个困难且有风险的步骤，因为将一切交给克里斯蒂娜·基什内尔和她的K激进分子本可以保证更强的选举推动力，但费尔南德斯知道依赖她将意味着付出高昂的政治代价。是的，正义党可能会在议会中失去席位，如果发生这种情况，所有批评者都会指责他无能，并声称这场灾难源于他的傲慢，坚称在克里斯蒂娜的控制下事情会更好。\n\n然而，任何硬币都有另一面，这一次后果可能对费尔南德斯有利。通过亲自承担领导权，他不仅削弱了克里斯蒂娜不断增长的阴影，还加强了政府内部和党内的亲费尔南德斯力量。那只老鼠克里斯蒂娜终于会感觉到她的影响力开始缩小，随之而来的是她对每一个决定施加的令人窒息的瘫痪。终于，有机会在费尔南德斯自己的领导下开始建设阿根廷的新时代，而不是集体依赖的令人窒息的控制。"
ARG_apoyar_a_leandro_santoro: "支持莱安德罗·桑托罗"
ARG_apoyar_a_leandro_santoro_desc: "选举越来越近，所有注意力现在都集中在布宜诺斯艾利斯省，这是中期选举的决定性舞台。为了保持影响力，正义党必须在这里确保胜利，因为没有布宜诺斯艾利斯，任何权力地位都无法保证。PRO自2007年以来牢牢控制着首都，因此阿尔贝托·费尔南德斯总统面临着紧迫的任务，找到一个能够打破他们主导地位的候选人，将城市团结在庇隆主义旗帜下，并为阿根廷人提供复兴的希望。经过长时间的犹豫和艰苦的寻找，终于选择了这样一个人物。\n\n他的名字是莱安德罗·桑托罗。尽管经常被称为激进分子、基什内尔主义者，甚至阿方辛主义者，但他拥有弥合分歧和激励选民的罕见能力。桑托罗体现了对事业的忠诚和在PRO自己的地盘上挑战它的魅力。因此，几乎所有行政资源都将用于他的竞选活动，因为他的胜利不仅将确保布宜诺斯艾利斯，还将表明在费尔南德斯总统的领导下，正义党是活跃、强大的，并准备引导阿根廷进入一个新的、更光明的世纪。"
ARG_derrota_del_kirchnerismo: "基什内尔主义的失败"
ARG_derrota_del_kirchnerismo_desc: "选票已统计完毕，结果已公开——对费尔南德斯总统来说远非有利。变革联盟表现更好，四十年来正义党首次失去了参议院的多数席位。这标志着重大挫折，粉碎了我们希望实现的\"阿根廷梦想\"的幻想。费尔南德斯总统面临着对这次选举失败的强烈批评，而新的政治人物开始崭露头角。\n\n克里斯蒂娜·基什内尔的亲密盟友马萨将有效继承费尔南德斯总统因这些结果而失去的政治影响力。立法进展预计将停滞不前，使政府陷入政治僵局。正如费尔南德斯总统本人所预期的那样，许多亲费尔南德斯的部长可能被迫下台，因为克里斯蒂娜可能会开始她的战略清洗，将她忠诚的\"同志\"置于关键位置，并在政府内部推进马克思主义政策。这一转变威胁着在可预见的未来重塑政府及其议程。"
ARG_un_respiro_para_alberto: "阿尔贝托的喘息机会"
ARG_un_respiro_para_alberto_desc: "阿尔贝托·费尔南德斯总统筋疲力尽——至少克里斯蒂娜·基什内尔的忠诚派系K激进分子坚定地认为如此。随着正义党在选举中获胜，克里斯蒂娜也取得了胜利，大大扩大了她的影响力，巩固了她作为副总统的地位，同时降低了费尔南德斯总统的权威和个人分量。许多观察家声称正在发生的事情类似于政变，但现实不同：费尔南德斯本人厌倦了持续的政治斗争、无休止的谈判和压力，他渴望和平。那些持不同意见的人只是自欺欺人，因为克里斯蒂娜比任何人都更清楚什么真正服务于运动和国家。\n\n现在费尔南德斯站在一个关键的十字路口：继续留任，尽管他的力量正在消退，还是允许克里斯蒂娜承担更大的责任，并试图在她坚定的领导下统一阿根廷，因为社会的大部分已经将同情转向了她。暂时退出将使费尔南德斯获得休息并有机会最终回归，而克里斯蒂娜将在他缺席期间维持政治稳定。最终，他可以信任她，因为如果她曾经希望用武力推翻他，她肯定早就这样做了。"
ARG_las_purgas_de_cristina: "克里斯蒂娜的清洗"
ARG_las_purgas_de_cristina_desc: "克里斯蒂娜·基什内尔对中期选举的结果深感不满，我们必须接受她打算进行的全面清洗——阿尔贝托·费尔南德斯总统因失去真正的政治权力而削弱，无法阻止这一切。克里斯蒂娜将系统性地清除所有她认为不忠诚的人，从亲费尔南德斯的部长开始，而总统本人将像旁观者一样，被束缚在椅子上，默默地目睹现在似乎不可避免的风暴。\n\n最引人注目的是，塞尔希奥·马萨将实际上承担国家元首的角色，履行许多曾经专属费尔南德斯的职责。部长们将一个接一个地辞职，马丁·古斯曼是第一批之一，他们的职位将很快被克里斯蒂娜信任的盟友或好斗的K激进分子成员填补。因此，费尔南德斯总统，尽管听起来自相矛盾，不再是真正的总统；他反而成为一个象征性的傀儡，而真正的权力决定性地转移到克里斯蒂娜及其圈子的手中。阿根廷梦想在我们眼前崩溃，费尔南德斯只能遗憾地回顾曾经将他推向权力的选举。"
ARG_mision_cafiero_sola: "索拉-卡菲罗使命"
ARG_mision_cafiero_sola_desc: "世界正站在崩溃的边缘，被华尔街的垮台和美国政府的瘫痪所震撼。不稳定的火焰每天都在升高，蔓延到各大洲，点燃了长期休眠的冲突。南美洲无法免受这场全球风暴的影响。委内瑞拉在华盛顿削弱后摆脱了所有束缚，现在在整个大陆大胆行动。巴西在2022年选举前夕陷入不确定性，缺乏稳定，而阿根廷发现自己几乎完全孤立，在更广阔的世界中没有可靠的盟友。\n\n面对这个危险时刻，阿尔贝托·费尔南德斯总统转向外交作为唯一的盾牌。他派费利佩·索拉和圣地亚哥·卡菲罗执行紧急任务，重建阿根廷在拉丁美洲的地位，寻求编织新的信任与合作纽带。通过这一努力，阿根廷希望在危机巨浪淹没大陆之前获得一定程度的稳定。该国将试图通过拥抱国际主义外交政策来结束多年的孤立，确保阿根廷在不断变化的秩序中的地位。火焰升起，阿根廷决心不被它吞噬，而是掌握它的火焰。"
ARG_tragar_orgullo_ideologico: "吞下我们的意识形态骄傲"
ARG_tragar_orgullo_ideologico_desc: "多极世界而非单一主导轴心、继续断言马尔维纳斯群岛本质上是阿根廷的、刻意与已经削弱的美国和博索纳罗不稳定的巴西保持距离，以及支持拉丁美洲所谓的\"进步\"轴心，这些是阿尔贝托·费尔南德斯总统早期外交政策的一些意识形态支柱。然而，没有人能预见美国的突然崩溃以及类似于第二次世界大战和冷战的全球不稳定的到来。\n\n费尔南德斯总统完全理解这些挑战的严重性。咬紧牙关，他现在面临着在这个动荡时期搁置许多意识形态抱负、转而采取实用主义的必要性。英国，马尔维纳斯群岛的占领者，可能成为与巴西同样关键的伙伴，而巴西的内部斗争使其脆弱且不可预测。为了在这场危机中生存，阿根廷将不得不部分放弃其多极化抱负，意识到在一个如此动荡的世界中，孤立是国家负担不起的奢侈品，谨慎而实际的联盟对于确保国家的地位和保障其未来至关重要。"
ARG_crisis_migratoria_brasil: "巴西的移民危机"
ARG_crisis_migratoria_brasil_desc: "事情发生了：巴西爆发了内战。当选总统未能与反对新政权的抗议反对派达成任何有意义的协议，造成了类似于美国早些时候经历的混乱。巴西利亚和里约热内卢等主要城市受到影响，但受打击最严重的是圣保罗，数十个军阀现在在街头战斗，无数无辜平民在他们身后丧生。危机严重打击了巴西，必须解决。\n\n毫不奇怪，大量巴西人正在逃离该国，阿根廷和乌拉圭成为主要目的地。数十万人已经越过边境，无数人正在等待在阿根廷寻求庇护。虽然提供庇护在道德上是正确的，但阿根廷已经背负着严重的内部问题，涌入的移民威胁加剧现有的挑战。阿尔贝托·费尔南德斯总统现在必须做出关键决定——支持谁，如何管理危机，以及采取什么措施——以最终解决移民问题并维持国内秩序。"
ARG_tratado_alianza_lacalle: "与拉卡莱·波乌的联盟条约"
ARG_tratado_alianza_lacalle_desc: "阿根廷和乌拉圭都起源于古老的拉普拉塔总督辖区，在漫长的共同历史中，它们通常是朋友，即使有时发现自己在南锥体争夺影响力。阿根廷甚至在乌拉圭内战期间支持过不同派系，后来在20世纪，两国在军事独裁时期的\"秃鹰行动\"框架内合作。然而，在21世纪，乌拉圭开始在乌拉圭河上建造纸浆厂，紧邻阿根廷边境，关系再次恶化。尽管争端通过国际仲裁和平解决，但留下了从未完全消失的不信任痕迹。\n\n现在阿尔贝托·费尔南德斯总统寻求克服这一过去，与乌拉圭总统路易斯·拉卡莱·波乌会面，签署一系列旨在在全球不稳定时代加强双边合作的重要协议。随着南方共同市场削弱和危机席卷南美洲，阿根廷需要乌拉圭作为密切可靠的伙伴。它们共同可以平衡该地区，对抗从委内瑞拉蔓延的查韦斯主义影响，并抵制各种形式的新帝国主义，为拉普拉塔河地区重新统一和强大的愿景打开大门。"
ARG_ayudar_a_marito_par: "帮助马里奥对抗红色问题"
ARG_ayudar_a_marito_par_desc: "巴拉圭人民军与巴拉圭共产党一起仍然是巴拉圭最著名的极左组织，这些团体多年来一直宣布打算推翻中央权威并在南美洲中心建立共产主义国家。虽然军事上薄弱，但他们得到查韦斯主义委内瑞拉的秘密支持，委内瑞拉领导人梦想出口其玻利瓦尔革命并破坏邻国的稳定。这些武装派系的持续存在不仅危及巴拉圭本身，也引起阿根廷越来越多的担忧，因为极端主义之火没有国界。\n\n面对这一挑战，阿尔贝托·费尔南德斯总统决定采取行动。他将前往亚松森，与总统马里奥·阿布多·贝尼特斯会面，提供阿根廷在摧毁隐藏在巴拉圭丛林深处的游击队存在的运动中的合作。该提议被框定为团结和必要性，几乎不会被拒绝。对巴拉圭来说，这意味着急需的帮助，对阿根廷来说，这确保了在不可避免的对抗查韦斯主义影响的斗争中获得宝贵的盟友。在费尔南德斯看来，只有果断的联合行动才能一劳永逸地结束红色威胁并维护拉普拉塔河地区的稳定。"
ARG_rec_compromiso_chl: "恢复与智利的承诺"
ARG_rec_compromiso_chl_desc: "阿根廷和智利在争取独立的斗争中有着共同的起源，但经常发现自己因巴塔哥尼亚和火地岛边界定义不清的争端而分裂，最终导致1881年边界条约。1970年代比格尔危机期间，紧张局势重新浮出水面，当时对比格尔海峡岛屿的主张几乎导致公开冲突。智利甚至被列为阿根廷军事 Junta 的假设目标之一，尽管海军最终推动克制。然而，历史向前发展，到世纪之交，两国在南方共同市场、南美国家联盟和拉美及加勒比国家共同体中发现了新的合作基础，慢慢将对抗转变为伙伴关系。\n\n现在阿尔贝托·费尔南德斯总统打算在此基础上再接再厉。他寻求加强与阿根廷西部邻国的关系，重申在20世纪末和21世纪初恢复的友好关系。对于费尔南德斯来说，与智利更紧密的结盟不仅意味着地区稳定，也是对抗来自北方的查韦斯主义威胁的另一张宝贵王牌。阿根廷渴望在阳光下占据一席之地，并邀请智利作为平等伙伴分享这一光芒，共同塑造南美洲的命运。"
ARG_cortar_privilegios_bol: "削减玻利维亚特权"
ARG_cortar_privilegios_bol_desc: "阿根廷的玻利维亚移民问题已成为阿尔贝托·费尔南德斯总统面临的重大挑战，说得委婉一点，这是一件非常不愉快的事情。多年来，他们从国家计划中获得的远远超过他们的贡献，无论他们的居留是否合法。虽然在经济增长时期这种情况可以容忍，但当前由美国崩溃和随之而来的全球不稳定引发的危机，让阿根廷没有进一步软弱的空间。很明显，必须采取果断行动，使这一人口开始为国家做出贡献，而不是继续以牺牲国家为代价获益。\n\n因此，费尔南德斯总统打算不仅限制玻利维亚人获得社会计划，还要结束免费教育、医疗保健和类似特权。相反，他们将被要求要么为这些服务付费，要么以贡献有形价值换取。实际上，这将迫使他们工作并为阿根廷提供真正的价值，如果他们希望留下的话。宽大的时代已经结束，因为国家挣扎的经济再也无法维持那些靠其资源生活却不给予任何回报的人。"
ARG_aumentar_seguridad_norte: "加强北部边境安全"
ARG_aumentar_seguridad_norte_desc: "来自巴西、巴拉圭和玻利维亚的移民问题长期以来一直是阿尔贝托·费尔南德斯总统面临的重大而敏感的挑战。玻利维亚人无耻地从阿根廷慷慨的社会计划中获益，贡献远少于他们获得的，而巴拉圭人在边境购买大量廉价商品并转售，耗尽国家预算。即使是规模较小的巴西移民也给经济和劳动力市场带来额外压力。在平静时期这些事情是可以容忍的，但随着华尔街崩溃、美国削弱和全球危机的爆发，现在每一分钱都很重要，不受控制的移民再也不能被忽视。\n\n作为回应，费尔南德斯总统打算加强北部边境，加强安全，并实施更严格的移民政策。边境巡逻将扩大，非法越境将被镇压，没有适当文件的人将被拘留或驱逐。只有那些真正为阿根廷繁荣做出贡献的人才被允许留下，因为国家再也负担不起在自己人民受苦时养活寄生虫。"
ARG_bolsonaro_perdoname: "博索纳罗原谅我"
ARG_bolsonaro_perdoname_desc: "雅伊尔·博索纳罗目前是巴西总统，很可能在即将到来的选举后继续掌权。尽管阿尔贝托·费尔南德斯总统公开称博索纳罗为\"极端极右翼\"人物，但巴西仍然是南美洲的关键盟友，其资源对阿根廷至关重要。然而，这样的言论逐渐冷却了两国之间的外交关系，鉴于该地区即将到来的查韦斯主义威胁，这种情况对费尔南德斯可能造成极大损害，美国的崩溃及其对南美洲监督的削弱加剧了这一威胁。\n\n作为回应，费尔南德斯总统打算与博索纳罗会面，正式道歉，并谈判一项有利于阿根廷和巴西的双边贸易协定。认识到他早期言论的错误，费尔南德斯旨在恢复关系中的温暖和信任，确保两国能够有效合作。加强与巴西的关系不仅是外交必要，也是对抗委内瑞拉查韦斯主义威胁的战略举措，确保阿根廷在地区政治中的地位，同时加强整个大陆的稳定。"
ARG_reforzar_mercosur: "加强南方共同市场"
ARG_reforzar_mercosur_desc: "南方共同市场成立于1991年3月26日，是一个联合阿根廷、巴西、巴拉圭和乌拉圭的地区集团，智利、哥伦比亚、玻利维亚等国为联系成员国。最初专注于贸易，它迅速发展成为南美洲合作与权力平衡的政治平台。如今，在美国崩溃和许多经济体因此孤立之后，南方共同市场已成为少数能够维护稳定并为阿根廷提供真正领导机会的工具之一。\n\n阿尔贝托·费尔南德斯总统认为，未来在于加强和扩大南方共同市场，使其超越南美洲。这个想法是与新西兰和墨西哥等新伙伴建立关系，并将合作扩展到中东、非洲和欧洲。随着时间的推移，该集团可能成为类似于欧盟的经济盾牌，保护大陆免受金融危机的影响。即使智利保持孤立主义立场或委内瑞拉暂停其成员资格，阿根廷仍将继续前进。通过领导这一转型，阿根廷不仅将拯救自己的经济，还将成为南美一体化的英雄。"
ARG_tratados_comercial_par_urg: "与乌拉圭和巴拉圭的贸易协定"
ARG_tratados_comercial_par_urg_desc: "乌拉圭、巴拉圭和阿根廷之间的关系一直以紧张和对抗为标志。在19世纪血腥的巴拉圭战争期间，阿根廷与乌拉圭和巴西一起对抗巴拉圭，使该国遭受重创，损失了一半以上的男性人口。在20世纪，所有三个国家在\"秃鹰行动\"框架内合作，但在21世纪，分歧再次出现。阿根廷与乌拉圭就乌拉圭河上纸浆厂的建设发生冲突，与巴拉圭则因巴拉那河的航行权以及围绕亚西雷塔水电站的长期争端而紧张加剧。尽管是南方共同市场成员，真正的合作仍然脆弱。\n\n现在，在美国崩溃和华尔街崩盘之后，阿尔贝托·费尔南德斯总统认为，搁置历史恩怨并专注于生存和发展至关重要。他推动创建一个\"大贸易区\"，将在里约热内卢启动，旨在确保促进一体化的双边和多边协定。这样的平台不仅将加强政治合作，还将改善阿根廷的经济，使布宜诺斯艾利斯在巴拉圭和乌拉圭市场获得新的影响力，并使该地区在全球不稳定面前更加强大。"
ARG_cuestion_chilena: "智利问题"
ARG_cuestion_chilena_desc: "智利长期以来一直是南美洲孤立主义的显著例子。自独立以来，该国主要专注于出口商品——尤其是对英国——同时故意避免参与地区战争或20世纪的重大全球冲突。这种谨慎的距离在1970年代萨尔瓦多·阿连德当选后被打破，他公开与莫斯科结盟，甚至在1973年军事政变后更是如此，当时奥古斯托·皮诺切特将军将其独裁统治牢牢与华盛顿绑定，直到1990年结束。随着民主恢复，智利逐渐回到其传统的政治和外交保留立场。\n\n正是出于这个原因，阿尔贝托·费尔南德斯总统寻求访问圣地亚哥，旨在突破智利孤立主义的壁垒，并使其重新定向有利于阿根廷。他的计划是提议更密切的军事合作以及双边贸易协定，为长期伙伴关系奠定基础。费尔南德斯知道挑战不会简单：智利的孤立主义反射已形成超过一个世纪。然而，他也明白这种立场并不像看起来那样稳固。一个真正的外部威胁就足以推动智利向阿根廷靠拢，而不是远离它。"
ARG_expander_mercados_conosur: "扩大南锥体市场"
ARG_expander_mercados_conosur_desc: "许多贸易链被美国的崩溃摧毁，包括那些直接与南锥体相连的贸易链。阿根廷、智利和乌拉圭在贸易中越来越孤立，几乎没有外国资本流入该地区。这种情况加上传统贸易伙伴的中断，对阿根廷构成重大挑战，必须迅速解决。如果这些问题得不到解决，该国面临已经严重的贸易逆差进一步恶化的风险，其后果可能影响经济的所有部门。\n\n为应对这一问题，阿尔贝托·费尔南德斯总统计划战略性地吸引外国投资到南锥体国家，同时探索超越传统贸易伙伴的新贸易伙伴，这些伙伴可能比旧网络更有利。除了直接的经济效益外，这些努力旨在加强阿根廷的外交地位，特别是与智利的关系。通过成功吸引智利作为合作伙伴，阿根廷可以突破多年的智利孤立主义，促进地区合作，并确保对南锥体贸易政策的更强影响力。这种方法将实用主义与长期战略思维相结合，确保阿根廷的经济复苏和政治影响力。"
ARG_rio_de_plata_comercio_full: "拉普拉塔河贸易繁荣"
ARG_rio_de_plata_comercio_full_desc: "终于迈出了应对美国崩溃的经济稳定第一步，阿尔贝托·费尔南德斯总统寻求实施一系列措施，旨在暂时稳定阿根廷并减少贸易逆差。更准确地说，这些决定旨在为长期效果奠定基础，为更强大和更有弹性的经济创造基础。\n\n这些措施将是亲市场的，旨在实现通过拉普拉塔河持续进出口的愿景，船只定期进出阿根廷水域，促进强劲贸易。鉴于形势的紧迫性，费尔南德斯总统认识到这些步骤只是开始，为未来政府奠定基础，如果成功，可以完全向世界开放阿根廷。经济学家预测，通过促进持续的资本流入和加强贸易网络，这些举措将显著缓解经济危机，为阿根廷提供稳定和在全球市场增长的新机会。"
ARG_aranceles_bolivianos: "对玻利维亚征收关税"
ARG_aranceles_bolivianos_desc: "玻利维亚人长期以来一直通过他们的商品公开从阿根廷人的资源中获利，这本质上构成一种盗窃形式。鉴于玻利维亚仍然是查韦斯主义委内瑞拉在南美洲唯一坚定的盟友，使其实际上成为阿根廷的对手，这种情况尤其成问题。不幸的是，前几届政府对这些经济失衡过于宽容，允许玻利维亚继续以牺牲阿根廷为代价剥削机会。然而，现在是结束这种剥削的时候了。如果玻利维亚希望向我们的市场销售其产品，它将需要遵守严格的经济条件。\n\n为实现这一目标，阿尔贝托·费尔南德斯总统打算对进入阿根廷的玻利维亚商品征收高额关税。这些关税将确保玻利维亚为进入阿根廷市场付出高昂代价，尽管与委内瑞拉结盟，阿根廷仍是对他们开放的唯一邻国市场。同时，这些措施将通过额外收入加强阿根廷的预算，并为玻利维亚创造一定程度的经济依赖。通过实施这些关税，阿根廷维护其权威，保护公民的财富，并发出明确信息：容忍玻利维亚经济剥削的时代已经结束。"
ARG_cerrar_el_paso_brasil: "关闭巴西通道"
ARG_cerrar_el_paso_brasil_desc: "巴西移民危机正在扩大，对包括阿根廷在内的所有邻国来说越来越难以管理。数百万人正在逃离家园以逃避正在进行的内战的恐怖，但阿根廷没有准备好迎接如此大规模的难民涌入。阿尔贝托·费尔南德斯总统显然对令人震惊的报告感到担忧，需要采取果断行动来建立永久解决方案，结束危机并管理巴西移民带来的所有后果。\n\n最合理的行动方案似乎是暂时关闭与巴西的边境，防止进一步的大规模抵达。虽然从道德角度来看这可能看起来很严厉，但这是保护阿根廷免受潜在威胁的必要步骤，包括可能利用混乱的罪犯和卡特尔成员。其他国家仍然对逃离的巴西人开放，阿根廷不能承担这一负担。果断行动将使国家保持稳定，保护其公民，并确保在不被拖入其北部邻国混乱的情况下度过危机。"
ARG_una_oportunidad_unica: "独特的机会？"
ARG_una_oportunidad_unica_desc: "巴西移民危机正在扩大，对巴西周边国家包括阿根廷来说越来越具有挑战性。数百万人已经逃离该国，不愿忍受正在进行的内战，阿根廷显然没有准备好迎接如此大规模的难民涌入。阿尔贝托·费尔南德斯总统明显对报告感到担忧，需要采取果断行动来建立持久解决方案，解决移民危机和巴西难民到来带来的挑战。\n\n虽然关闭边境可能看起来是合理的回应，但费尔南德斯总统选择了更具战略性的方法。阿根廷将接纳能够作为负担得起的劳动力融入的巴西人，为在美国崩溃引发的经济危机中挣扎的公司服务。他们不会获得特殊福利；相反，他们将在阿根廷人不愿从事的部门工作。虽然这种方法有其缺点，但预计将提供长期经济效益，并逐步同化巴西人口，将他们转变为完全融入阿根廷社会的成员。"
ARG_pactos_frontera_par_urg: "与巴拉圭和乌拉圭的边境协定"
ARG_pactos_frontera_par_urg_desc: "解决巴西移民危机的第一批措施已经实施，虽然局势在国家层面逐渐稳定，但问题在地区层面升级。巴西人继续逃往巴拉圭和乌拉圭等邻国，这些国家与阿根廷一样，对涌入的移民远非热情。该问题现在具有跨国性质，为了加强阿根廷在南美洲的影响力，必须采取果断步骤确保乌拉圭和巴拉圭的批准和合作，他们可能成为关键盟友。\n\n阿尔贝托·费尔南德斯总统决心在此困难时期援助巴拉圭和乌拉圭。通过阿根廷、巴拉圭和乌拉圭之间的边境协定下的协调努力，阿根廷旨在确立其在该地区的领导地位。这一战略不仅将确保阿根廷获得更强的地位和与大国相当的影响力，还将允许该国控制从邻国领土寻求入境的巴西难民的流动。通过果断行动，阿根廷确保危机得到有效管理，同时加强其在南美洲的战略地位。"
ARG_hay_que_poblar: "我们必须移民"
ARG_hay_que_poblar_desc: "关于巴西移民危机的第一批措施已经实施，旨在将巴西难民转变为廉价劳动力的计划开始显示成果，这可以被视为适度的成功。然而，更广泛的移民问题远未解决，阿尔贝托·费尔南德斯总统明白，是时候采取更永久和战略性的步骤来确保阿根廷的长期稳定了。在他看来，有几个挑战可以矛盾地通过巴西人的帮助来解决。\n\n最大胆的决定之一是将数万名巴西移民派往巴塔哥尼亚，在那里他们将与当地人口融合，形成新社区，并刺激这些欠发达地区停滞的经济。反对派可能公开批评这样的举动，认为这是鲁莽的，但他们未能把握隐藏的好处。随着时间的推移，这项政策不仅可以加强阿根廷对巴塔哥尼亚的控制，还可以从巴西内战可能的胜利者那里获得宝贵的善意。费尔南德斯相信，历史将证明这一决定是正确的。"
ARG_cuestion_guerra_civil_bra: "巴西内战问题"
ARG_cuestion_guerra_civil_bra_desc: "当采取第一批决定性措施稳定巴西局势时，处理移民危机的基础终于形成。然而，更大的问题仍然未解决：众多派系中哪一个应该被承认为\"合法\"的巴西政府。承认不仅是正式步骤，也是阿根廷意图的信号。与此同时，阿尔贝托·费尔南德斯总统必须决定阿根廷是否会干预内战，支持那些后来可以加强他自己地区地位的人，或者是否保持严格中立，避免新风险但也错过潜在机会。\n\n总统的桌子上有几个承认候选人，每个都有自己的优势，但卢拉·达席尔瓦的法学家阵线显然是最严肃的力量。凭借其政治影响力和国际同情，如果现在提供帮助，卢拉阵营可能成为阿根廷的长期资产。但干预有危险：直接参与巴西的战争可能将阿根廷拖入混乱。中立维持稳定，但也使阿根廷无法塑造新秩序。这是费尔南德斯必须选择的时刻：从远处观望事件，还是冒险尝试影响巴西的未来。"
ARG_ayudar_a_lula: "帮助卢拉"
ARG_ayudar_a_lula_desc: "审视阿根廷，人们会立即注意到其长期的中立传统和不愿干预外国冲突的态度。例如，阿根廷完全置身于第一次世界大战之外，在第二次世界大战期间，它是唯一在1945年3月才加入盟国的南美国家，当时结果已经明朗。这种不干涉主义传统后来成为有用的工具：在21世纪，阿根廷试图通过将自己定位为\"自主\"的地区行为者来获益。内斯托尔和克里斯蒂娜·基什内尔积极推动这一路线，在金砖国家、中国、美国和欧洲之间保持平衡，同时捍卫马尔维纳斯群岛等问题的和平解决方案。\n\n但历史现在迫使做出新的选择。阿尔贝托·费尔南德斯总统面临压力，要求放弃这种谨慎的传统，派遣部队、装备和武器支持卢拉·达席尔瓦的法学家阵线。他的理由部分是与卢拉的意识形态亲和力，但也是希望将阿根廷提升为地区超级大国的角色。在这样的愿景中，一个忠诚且负债的巴西将成为由布宜诺斯艾利斯领导的新南美秩序的基石。这可能看起来是大胆的一步，甚至可能对阿根廷的野心来说是必要的，但只有时间才能揭示打破中立是明智的决定还是危险的赌博。"
ARG_mantener_neutralidad: "保持中立"
ARG_mantener_neutralidad_desc: "审视阿根廷，人们会立即注意到其长期的中立传统和不愿干预外国冲突的态度。例如，阿根廷完全置身于第一次世界大战之外，在第二次世界大战期间，它是唯一在1945年3月才加入盟国的南美国家，当时结果已经明朗。这种不干涉主义传统后来成为有用的工具：在21世纪，阿根廷试图通过将自己定位为\"自主\"的地区行为者来获益。内斯托尔和克里斯蒂娜·基什内尔积极推动这一路线，在金砖国家、中国、美国和欧洲之间保持平衡，同时捍卫马尔维纳斯群岛等问题的和平解决方案。\n\n尽管面临形势压力，阿尔贝托·费尔南德斯总统无意仅仅为了巴西的某个潜在盟友而放弃这一中立原则，考虑到整体主义者、政变者和毛主义者的力量，巴西在内战中的胜利远非确定。拒绝干预可能会让阿根廷失去该地区的一个潜在伙伴，但也确保更强的外交地位并维护国家稳定。毕竟，阿根廷士兵为什么要为卢拉·达席尔瓦牺牲生命，而阿根廷仍然可以通过外交而非流血来捍卫其利益？"
ARG_operacion_condor_azul: "蓝鹰行动"
ARG_operacion_condor_azul_desc: "世界站在全球冲突的边缘，越来越不稳定，这一现实得到退休的马尔维纳斯群岛将军巴里·德尔·瓦莱·索萨、现任陆军司令胡安·马丁·帕莱奥、空军司令哈维尔·胡利安·艾萨克、海军司令胡里奥·瓜迪亚、将军吉列尔莫·佩雷达以及其他一些退休将军等著名军事人物的承认。这些专家向阿尔贝托·费尔南德斯总统提交了一项全面计划，以应对日益增长的威胁和地区不稳定。\n\n该计划的核心是阿根廷武装部队的战略重新武装和现代化，即蓝鹰行动。它设想对关键军事装备进行秘密但系统的更新，解决当前功能武器短缺和不再符合当代标准的过时技术问题。同时，该计划包括逐步招募和训练士兵以扩大军队能力。到2025-2026年，目标是让阿根廷拥有拉丁美洲最强大和最现代化的军队，完全准备好保卫南锥体免受潜在的地区和全球威胁，同时确保国家安全和主权。"
ARG_rearme_disimulado: "伪装的重新武装"
ARG_rearme_disimulado_desc: "阿尔贝托·费尔南德斯总统最近面临蓝鹰行动中几位高级将军的压力，他们警告说行动的保密性面临风险。为阿根廷政府工作的军事承包商发布的公开报告无意中透露阿根廷军队正在进行重新武装，这一事实可能不仅被邻国发现，也被委内瑞拉等潜在对手发现。将军们要求立即采取果断行动，费尔南德斯总统认真对待他们的担忧。\n\n作为回应，阿尔贝托·费尔南德斯总统将发布一系列法令，要求军事承包商提供误导性的公开报告，声明他们的活动是例行的，与重新武装无关。实际上，这些承包商将继续对阿根廷武装部队进行秘密和系统的现代化，维护蓝鹰行动的机密性。这种方法确保阿根廷加强其军事能力，同时向外国情报和窥探者隐藏细节，维护国家安全和南锥体的战略优势。"
ARG_darle_autonomia_generalato: "给予总参谋部一些自主权"
ARG_darle_autonomia_generalato_desc: "自国家重组进程结束以来，阿根廷军队逐渐失去了自主权，即使是最简单的行动也需要从低级官员一直到阿根廷总统的众多批准。将军们长期以来一直担心这种缺乏独立性的问题，随着蓝鹰行动的启动，恢复高级指挥部和各军事部门的自主权变得至关重要。虽然名义上仍需要总统的签名，但实际作战决策需要由将军们自己做出。\n\n不情愿地，阿尔贝托·费尔南德斯总统采取了必要步骤，授予阿根廷军队各部门高级指挥部显著的自主权。尽管他保留审查和签署计划的正式权力，但现在普遍理解这一签名在很大程度上是象征性的。军队可以独立进行其行动，反映出阿根廷回到1960年代的运作自由水平，同时仅在名义上保持必要的监督。"
ARG_comprar_armas_nuevas: "购买新武器"
ARG_comprar_armas_nuevas_desc: "阿根廷军队目前依赖的武器似乎可以追溯到马尔维纳斯群岛战争，其许多飞机、船只和坦克是在20世纪建造的，有些甚至在20世纪上半叶。这种过时的装备一直是将军们关注的问题，他们长期批评前几任总统未能使武装部队现代化。自然，他们期望阿尔贝托·费尔南德斯总统采取果断行动，并批准包括采购先进外国武器在内的全面现代化计划。\n\n费尔南德斯总统积极回应，批准军队现代化。然而，他更进一步，决定利用其部长的国际联系来获得可用的最佳装备。经济部长马丁·古斯曼与欧盟有密切联系，而马蒂亚斯·库尔法斯在中国和俄罗斯有联系。通过协调这些渠道，阿根廷旨在从这三个全球大国获得尖端军事技术，满足将军们的要求，并确保军队现代化符合当代战略标准。"
ARG_reactivar_industria_militar_arg: "重新激活国家军事工业"
ARG_reactivar_industria_militar_arg_desc: "自从COVID-19大流行期间实施的措施以来，阿根廷工业取得了显著改善，由于ATP等政府补贴，产量在数量和质量上都有所增加。然而，军事工业并未分享这一成功，一直处于亏损状态，没有迹象表明能够自行恢复昔日的实力。鉴于其与蓝鹰行动的密切联系，将军们呼吁阿尔贝托·费尔南德斯总统采取行动，将军事部门恢复到全面运作能力。\n\n作为回应，费尔南德斯总统决定将类似于民用工业的战略扩展到军事部门，向军事部门提供有针对性的补贴，并扩大阿根廷军事制造厂的运营。这一举措旨在不仅恢复生产，而且现代化和增强阿根廷的装备和武器制造，确保蓝鹰行动的目标得到满足，并加强国家安全。这些措施标志着朝着加强阿根廷国防能力迈出的关键一步，同时保持稳定和高效的军事工业基地。"
ARG_campana_reclutamiento_arg: "失业者招募运动"
ARG_campana_reclutamiento_arg_desc: "自Covid-19爆发以来，阿根廷面临着日益严重的无家可归问题，这对阿尔贝托·费尔南德斯总统构成了特别敏感的挑战。解决这个问题至关重要，因为忽视它会损害国家形象，突出贫困而不是其真正的潜力。同时，军队需要勇敢的新兵参与蓝鹰行动，费尔南德斯总统似乎设计了一个巧妙的解决方案，同时解决这两个问题。\n\n根据该计划，将针对无家可归者进行宣传，鼓励他们参军。他们将热切响应，被特权、培训和丰厚薪水的承诺所吸引。这种方法预计将强烈吸引他们，同时获得公众支持，因为该倡议解决了社会问题并加强了国防。通过以这种方式整合新兵，阿根廷可以同时减少无家可归现象并加强其军事力量，创造一个临时但有效的解决方案，既有利于人民也有利于武装部队，同时推进蓝鹰行动的目标。"
ARG_leyenda_negra_militar_final: "开始打破军队的黑色传奇"
ARG_leyenda_negra_militar_final_desc: "始于1973年的肮脏战争给阿根廷历史留下了黑暗而痛苦的印记，至今仍在军队上投下阴影。正义党的许多政治家经常提及肮脏战争，经常用它来批评和诋毁阿根廷军队。然而，现在不是沉溺于过去恐怖的时候。我们已经忍受了巨大的痛苦，没有必要重开伤口，特别是通过玷污我们准备为阿根廷及其人民牺牲生命的捍卫者和勇敢士兵的声誉。\n\n因此，阿尔贝托·费尔南德斯总统否认正义党中那些利用肮脏战争的支持者的书籍、宣传和政治演讲。国家必须专注于愈合而非分裂，不断回顾这一章只会加深社会裂痕。同时，将允许反对派自由表达他们对肮脏战争的看法，INADI不会被用来对付他们。尊重不同的叙述确保所有阿根廷人都能说出真相，同时国家努力团结向前迈进。"
ARG_investigar_logias_militares: "调查军事共济会"
ARG_investigar_logias_militares_desc: "最近，有传言称阿根廷军队内重新出现极右翼和极左翼运动，特别关注\"彩绘脸\"组织的复兴。这些报道引起了正义党的一些政治家和官员以及社会活动家和记者的不安。阿尔贝托·费尔南德斯总统面临一个艰难的决定：要么因缺乏证据而驳回传言并迅速推进蓝鹰行动，要么进行彻底调查，这不可避免地会减缓行动并冒险给潜在对手提供战略优势。\n\n最终，费尔南德斯总统选择在SIDE特工的协助下启动全面调查。尽管缺乏具体证据且蓝鹰行动暂时推迟，但他优先防止1976年政变前的不稳定再次发生，并确保军队完全忠诚于政府。只有时间会揭示这些传言是否有根据，但目前，这一决定反映了谨慎、审慎以及在维持秩序的同时保障国防的必要性。"
ARG_aceptar_ideas_radicales_army: "接受军队中的激进思想"
ARG_aceptar_ideas_radicales_army_desc: "最近，有传言称阿根廷军队内重新出现极右翼和极左翼运动，特别是极右翼，担心\"彩绘脸\"组织的复兴。这些报道引起了正义党的一些政治家和官员以及社会活动家和记者的不安。阿尔贝托·费尔南德斯总统面临一个决定：要么因缺乏证据而驳回这些传言并迅速推进蓝鹰行动，要么对军队进行全面审计，这将减缓行动的实施。\n\n最终，费尔南德斯总统选择搁置这些传言，相信军队在肮脏战争的考验和教训后不会恢复极端主义倾向。他认为全面调查可能无意中给潜在对手提供战略优势。正如他反思的那样，\"猫抓老鼠时是什么并不重要。\"只有时间会揭示这一决定是否正确，但根据未经证实的主张采取行动可能会造成不必要的延误和国家安全风险。"
ARG_reforzar_propaganda_militar: "加强国家军队的宣传"
ARG_reforzar_propaganda_militar_desc: "马尔维纳斯群岛战争失败后，随着肮脏战争和国家重组进程的结束，阿根廷军队在很大程度上退出了公共生活，留下了持久的耻辱。许多人不再尊重我们的捍卫者，随着和平主义情绪的增长，志愿参军人数下降，有些人甚至希望阿根廷屈服于敌人以避免伤亡。那个耻辱的时代已经过去，现在是时候恢复军队作为民族自豪感来源的地位了。\n\n阿尔贝托·费尔南德斯总统计划重新引入军事游行，加强学校的意识形态教育，并实施其他举措以加强军队在社会中的存在感。目标是培养准备为阿根廷服务和保卫阿根廷的爱国者，抵御委内瑞拉等当前威胁或任何其他对手。通过将军队牢固地植根于民族意识中并培养意识形态学生，国家确保一支强大、准备充分和坚定的力量，能够保护阿根廷并再次激发对其捍卫者的尊重。"
ARG_crisis_de_financiamiento: "财政危机"
ARG_crisis_de_financiamiento_desc: "这是预料之中的：美国陷入内战，此前华尔街崩溃。然而，更令人担忧的是另一场经济危机的爆发，可能比2021年的危机更严重。更糟糕的是，该国首席经济学家、经济部长马丁·古斯曼目前正在国外出差，使阿根廷无法对正在展开的局势做出理性、及时的决定。\n\n尽管他缺席，阿尔贝托·费尔南德斯总统将实施一系列基本但必要的措施，以维持经济稳定，直到马丁·古斯曼返回。该国正处于前所未有的危机边缘，他的回归至关重要。目前，政府必须顶住风暴，采取预防措施，同时希望未来几周不会出现进一步的复杂情况。战略耐心和临时措施将是防止局势进一步恶化的关键，确保阿根廷仍然有能力面对这个动荡时期。"
ARG_una_reunion_de_emergencia: "紧急会议"
ARG_una_reunion_de_emergencia_desc: "经济部长马丁·古斯曼暂时无法返回阿根廷，因为他必须在国外完成紧急工作，这远非阿尔贝托·费尔南德斯总统想要听到的消息。在他缺席期间，古斯曼推荐了两位非常有能力的人物暂时介入并帮助稳定经济。第一位是生产发展部长马蒂亚斯·库尔法斯，古斯曼信任的得力助手，坚决主张加强与俄罗斯和中国的贸易关系，强调工业增长和出口机会。\n\n第二位是YPF总裁吉列尔莫·尼尔森，他因在最近危机期间成功管理阿根廷石油部门而获得认可，并以倾向于与欧盟和国际金融伙伴合作为人熟知。这两位人士在这一刻都极为重要，仔细评估他们的提议以应对正在进行的经济紧急情况是重中之重。最终，只能选择一人暂时行事，最终决定完全取决于费尔南德斯总统，他的判断将决定国家的短期稳定及其承受当前全球经济动荡的能力。"
ARG_plan_nielsen: "尼尔森计划"
ARG_plan_nielsen_desc: "最终，YPF总裁吉列尔莫·尼尔森的计划被选中，因为它提供了通过全面工业化战略解决阿根廷经济危机的最合理和可行的途径。尼尔森的履历包括成功利用阿根廷石油部门加强国民经济，鉴于当前动荡的全球形势，这一点尤为关键。在所有提议中，他的计划显得最合乎逻辑和有效，促使阿尔贝托·费尔南德斯总统委托他实施工业化议程。\n\n在吉列尔莫·尼尔森的愿景中，该战略的主要部分涉及对YPF进行重大投资，以利用全球油价上涨的机会，产生的利润将再投资于为国家工业再融资和扩展。这种方法旨在振兴阿根廷更广泛的经济，刺激生产并创造就业机会。此外，尼尔森将专注于吸引私人投资、确保长期协议以及与包括欧洲国家和日本在内的多个国家谈判石油交易，确保阿根廷能够加强其经济独立性并在持续的国际危机面前变得更具韧性。"
ARG_atender_problemas_industriales_arg: "解决实业家的问题"
ARG_atender_problemas_industriales_arg_desc: "阿根廷的实业家和小企业面临巨大困难，特别是在最近的经济危机之后。从小型家庭经营商店到大型企业，各种规模的企业家都在挣扎，迫切需要政府支持，这已成为吉列尔莫·尼尔森工业化计划的核心部分。在与大型企业和中小企业代表进行全面会议后，确定了最紧迫的问题并直接报告给阿尔贝托·费尔南德斯总统。\n\n现在，这些问题及其拟议解决方案摆在总统的办公桌上，等待采取行动。吉列尔莫·尼尔森强调需要市场放松管制和对关键产业的有针对性补贴，旨在振兴小企业并为大公司提供在当前经济不稳定情况下扩大国际业务的机会。补贴计划旨在刺激增长、促进竞争力，并确保工业部门能够成功应对危机。从长远来看，尼尔森乐观地认为这一战略将稳定阿根廷经济，但立即采取行动至关重要，以防止进一步的挫折并维护国内外市场的信心。"
ARG_expander_el_oro_negro: "扩大阿根廷黑金"
ARG_expander_el_oro_negro_desc: "曾几何时，YPF的油田遍布整个巴塔哥尼亚，向全球各国泵送大量石油并销售，为阿根廷创造了巨大收入，并确保其作为地区能源领导者的地位。不幸的是，那些日子已经一去不复返了。YPF现在只是其昔日自我的影子，前几任YPF总统几乎没有希望恢复其过去的辉煌。然而，吉列尔莫·尼尔森有雄心勃勃的计划来复兴该公司并使其重新成为杰出企业，设想了阿根廷能源独立和经济增长的战略路线图。\n\n尼尔森计划的第一步是在整个巴塔哥尼亚建设和扩大油田，创造数千个战略性就业机会并振兴阿根廷的能源部门。此外，他旨在重启全国性的石油开发计划，让人想起YPF的辉煌时代，确保不仅在巴塔哥尼亚，而且在其他省份也进行生产。随着这一扩张，阿根廷将再次成为主要石油出口国，吸引来自欧洲、亚洲和美洲的买家。自然，随着这些油田的增长，需要进行一系列结构性改革、技术升级和监管更新，以确保效率、盈利能力和长期可持续性。"
ARG_acabar_deficit_ypf: "结束YPF赤字"
ARG_acabar_deficit_ypf_desc: "YPF今天被认为是一家过于臃肿的公司，正因为如此，每桶石油的成本太高，往往根本无法负担国家预算。吉列尔莫·尼尔森长期以来一直强调，YPF臃肿的结构是问题的真正根源：石油桶短缺和过高的生产成本都源于此。认识到这一点，阿尔贝托·费尔南德斯总统从尼尔森那里收到了直接请求，允许启动大规模员工清洗。费尔南德斯毫不犹豫地同意了，因为该提议看起来是这种情况下唯一合理的解决方案。\n\n现在尼尔森打算亲自监督YPF的重组，裁撤冗余员工，只保留真正需要操作和扩大油田的专家。这种大规模的工资单清理将消除官僚层级并显著减少开支。不可避免地，这个过程将是痛苦的，但其结果将使YPF摆脱停滞，简化运营并提高效率。尽管石油桶数量可能不会立即增加，但公司至少将开始以可持续成本运营，这本身就是迈向复苏和长期稳定的一步。"
ARG_innovar_extraccion_ypf: "创新YPF的开采方式"
ARG_innovar_extraccion_ypf_desc: "YPF今天被认为是一家高效的油气公司，特别是在通过尼尔森计划实施的改革之后，这些改革为其注入了新的动力。然而，产量仍然低于预期，开采方法过时，不再符合现代要求。这阻碍了增长并削弱了竞争力。另一个问题涉及工人：许多人准备离开，这威胁到稳定性和连续性。这些困难共同危及公司的未来，因此迫切需要采取行动。经阿尔贝托·费尔南德斯总统批准，吉列尔莫·尼尔森获得了实施改革、现代化生产和恢复盈利能力的授权。\n\n第一步将是在现有设施和巴塔哥尼亚新油田引进更新的开采技术。这一更新应确保就业并留住工人，而那些留下来的人将获得更好的条件和更高的激励。该战略旨在提高总体产量并增加国家收入。尽管短期内开采成本不可避免地会上升，效率可能下降，但尼尔森坚持认为这是复兴YPF、扩大产量并重新获得其作为阿根廷能源部门主导力量地位的合理牺牲。"
ARG_desarrollar_zona_petrolera_sur: "开发南部石油区"
ARG_desarrollar_zona_petrolera_sur_desc: "阿根廷南部，尤其是巴塔哥尼亚，代表着一条广阔的石油带，其真正潜力尚未被发掘。YPF已经在那里开采资源，但由于长期缺乏基础设施，最大的矿床仍未开发。没有道路、管道和适当的设施，开发无法推进，国家面临失去历史性机会的风险，无法将其油气工业提升到全新水平。需要的是强有力的国家支持，经阿尔贝托·费尔南德斯总统批准，巴塔哥尼亚最终可以成为世界上最重要的能源中心之一。\n\n吉列尔莫·尼尔森已经获得这一关键授权。在他的指导下，工人团队被派往建设基础设施，确保YPF能够在巴塔哥尼亚建立高效的运输和生产网络。道路将铺设，设施将建造，后勤基地将得到保障，为大规模开采创造基础。一旦基础到位，石油产量将迅速扩大，利润将上升到前所未有的水平，巴塔哥尼亚将转变为真正的黑金之地，为阿根廷的经济复兴和人民的繁荣提供动力。"
ARG_nueva_epoca_ypf: "YPF的新时代"
ARG_nueva_epoca_ypf_desc: "自经济危机开始和大胆采用雄心勃勃的尼尔森计划以来，阿根廷国家石油公司（YPF）走过了漫长而艰难的道路。多年来，公司成功在巴塔哥尼亚开辟了新油田，逐步克服了严重的内部低效问题，并在遥远的南部建造了支持大规模石油开采的必要基础设施。由于坚持不懈和远见卓识，YPF经受住了每一个挑战并变得更加强大，将自己转变为远不止是一个简单的油气生产商。\n\n今天，阿尔贝托·费尔南德斯总统与吉列尔莫·尼尔森一起自豪地宣布YPF一个新的、更光明的时代的到来。在这个新的篇章中，公司将向强大的全球市场出口一桶又一桶石油，为阿根廷带来巨大利润，并确保其在国际舞台上的更强地位。YPF将再次成为真正的民族自豪感来源，就像其辉煌过去一样，阿根廷将跻身现代世界主要石油出口国之列。这一次，没有任何障碍能够破坏其持久的成功和历史使命。"
ARG_europa_is_clave: "欧洲是关键"
ARG_europa_is_clave_desc: "欧洲在天然气和石油方面仍然严重依赖俄罗斯，这使得俄罗斯每年获得大量欧元。阿根廷面临紧迫的经济挑战，迫切需要可靠的外国贸易伙伴，可以从这样的欧元流入中大大受益。认识到这一机会，并且知道吉列尔莫·尼尔森强烈支持与欧盟而非中国或俄罗斯进行贸易，当前经济危机的明确解决方案出现了。\n\n吉列尔莫将前往欧洲会见关键的欧洲领导人，主要目标是谈判向欧洲市场供应阿根廷石油。尽管地理距离和后勤挑战，欧洲非常有动力减少对俄罗斯能源的依赖，使他们倾向于接受阿根廷的提议。对阿根廷来说，欧元的流入将提供急需的经济缓解，而欧洲获得替代能源来源。这一互利协议代表着双方的战略胜利，实际上是一个无法拒绝的提议。"
ARG_bonos_deuda_ypf: "YPF债务债券"
ARG_bonos_deuda_ypf_desc: "在吉列尔莫·尼尔森的稳健领导下，YPF取得了显著增长。作为一名经验丰富的自由主义梅内姆主义者，尼尔森不仅成功复兴了油气工业，还将YPF转变为一个激励阿根廷经济不同部门公司的典范。巴塔哥尼亚坚定地成为国家能源的心脏，巴塔哥尼亚石油现在作为昂贵俄罗斯供应的宝贵替代品出口到世界各地，为许多国家提供了减少对莫斯科影响依赖的机会。\n\n受这些成就鼓舞，吉列尔莫·尼尔森现在准备在欧洲市场发行YPF债券，以加强阿根廷作为值得信赖伙伴的形象。这些债券筹集的资金将直接再投资于YPF，随后流入阿根廷其他关键行业，为整个经济带来倍增效益。自然，这样的倡议将面临克里斯蒂娜·费尔南德斯·德·基什内尔等马克思主义者的激烈反对，他们将谴责这是对其教条的背叛。然而，阿尔贝托·费尔南德斯总统已经授予尼尔森完全的自由处置权，确保没有任何东西——甚至克里斯蒂娜及其忠诚派系——能够阻止这个承诺为YPF和阿根廷本身带来新繁荣时代的雄心勃勃的计划。"
ARG_inyeccion_de_capitales: "资本注入"
ARG_inyeccion_de_capitales_desc: "新发行的YPF债券的成功仍不确定，我们需要等待几个月才能看出出售它们是否真的是正确的决定。尽管如此，YPF总裁吉列尔莫·尼尔森的办公桌上躺着关于财政盈余的令人鼓舞的消息，这些盈余已经可以用于有意义的目的。自然，最合乎逻辑的步骤是将盈余完全再投资于YPF本身以确保更大的长期增长，但该公司长期以来一直承诺对阿根廷忠诚，特别是在国家面临如此深刻的经济危机之际。\n\n因此，吉列尔莫·尼尔森决定将盈余引导到阿根廷其他行业。他的方法是渐进的：从小型企业开始，然后转向中型企业，最终支持构成经济支柱的大型国家产业。通过利用YPF的资本振兴国内生产，他旨在不仅加强阿根廷整体，还暂时安抚克里斯蒂娜·费尔南德斯·德·基什内尔，减少她破坏其YPF总裁职位的欲望。这种战略、忠诚和政治的谨慎平衡可能对公司和国家的未来具有决定性意义。"
ARG_atraer_inversiones_industria_nac: "吸引投资到国家工业"
ARG_atraer_inversiones_industria_nac_desc: "许多欧洲投资者已经表示愿意购买YPF债券，这对油气公司及其总裁吉列尔莫·尼尔森来说肯定是有利的。拒绝这样的资本可能看起来几乎荒谬，但尼尔森坚持认为YPF本身并不迫切需要新投资。真正的需求在于阿根廷的生产基础：在毁灭性的经济危机之前曾经高效运作的小型、中型和大型国家产业。因此，吉列尔莫制定了一个更广泛的计划，旨在不仅加强YPF，而且复兴整个阿根廷工业格局。\n\n根据这一愿景，尼尔森将鼓励欧洲投资者将资金投入阿根廷工业而非仅投入YPF。从小型企业开始，经过中型企业，最终到最大的战略部门，投资将恢复国家经济的活力。诚然，一些投资者可能犹豫，担心危机时期不可预见的动荡。然而，许多人已经坚定信任尼尔森的领导，很可能会遵循他的指导，不仅将该项目视为财务机会，而且视为对阿根廷期待已久的经济复兴的贡献。"
ARG_mejorar_competitividad: "提高阿根廷的竞争力"
ARG_mejorar_competitividad_desc: "阿根廷工业曾经是国家进步的骄傲引擎，长期以来一直空洞无物，内部毫无生气，无法承受世界大国的残酷竞争，这些大国很久以前就将阿根廷工厂从记忆中抹去。阿根廷成为南美洲的\"病人\"，陷入停滞和衰退，但这从未注定是其命运。现在，新的地平线出现了。多亏了YPF总裁吉列尔莫·尼尔森，稳定的欧洲投资流正在返回。沉睡的工厂苏醒了，机器再次轰鸣，全新的工厂开始崛起，见证了期待已久的重生。\n\n在这些变化中，阿尔贝托·费尔南德斯总统宣布决心恢复阿根廷国家工业，使其强大到足以与世界竞争，并确保各国再次尊重和重视阿根廷的产品。愿景很明确：一个新的时代，阿根廷将再次作为工业巨人屹立，自豪地出口到全球每个角落。随着美国陷入危机，阿根廷自己的风暴开始消退，复兴之路终于打开，国家可以庆祝尼尔森决心带来的繁荣希望。"
ARG_hemos_superado_la_crisis: "我们已经克服了金融风暴？"
ARG_hemos_superado_la_crisis_desc: "吉列尔莫·尼尔森和马蒂亚斯·库尔法斯一起向阿尔贝托·费尔南德斯总统提交了他们的详细报告，概述了过去几年实施的大胆政策的结果。总统对他们的发现表示欢迎，因为经济终于恢复秩序，并且根据大多数指标，表现比以往任何时候都好。阿根廷再次承担了其作为石油、农产品和工业产品主要出口国的历史角色，重新确立了自己作为全球市场重要参与者的地位。与此同时，比索恢复了其失去的声望，成为一种强大的世界货币，在国外受到尊重和接受，而期待已久的国内金融稳定终于得到保障。\n\n然而，最伟大的成就在于阿根廷成功摆脱了2021年华尔街崩溃的破坏性余波。曾经威胁要使经济崩溃的东西已经转变为复苏和复兴的机会。为此，经济学家值得深切感谢，不仅是因为他们在COVID危机期间的努力，也是因为他们不懈地引导国家度过前所未有的动荡。特别认可属于尼尔森和库尔法斯，他们的远见和决心使阿根廷能够忍受并变得更强大。然而，即使国家松了一口气，两位领导人也提醒国家，这项工作远未完成：真正持久的繁荣将需要深刻的改革和持续的努力。"
ARG_plan_kulfas: "库尔法斯计划"
ARG_plan_kulfas_desc: "生产发展部长马蒂亚斯·库尔法斯公布了他雄心勃勃的工业化计划，作为对当前经济危机的决定性回应。该战略设想仔细优先考虑低、中、高发展行业，同时寻求金砖国家（最著名的是中国）的资本流入，为阿根廷疲惫的工厂注入新的活力。在这样困难的时期，该提议深深触动了阿尔贝托·费尔南德斯总统，他在其中不仅看到了实用主义，还看到了期待已久的国家复兴愿景。\n\n受这一承诺启发，费尔南德斯总统完全批准了该计划，授予库尔法斯自由处置权，大胆迈向阿根廷工业的未来。然而，这一大胆举动在梅内姆主义者和自由主义庇隆主义者中引发了争议，他们对赋予社会主义声音权力感到不满，并担心方向的不确定性以及进口替代以不同名称悄然回归。目前，国家站在十字路口，等待看看费尔南德斯的赌注是否会带领阿根廷走向繁荣或新的风暴。"
ARG_ayudar_al_empresariado_arg: "帮助阿根廷商业界"
ARG_ayudar_al_empresariado_arg_desc: "新冠疫情期间引入的紧急家庭收入计划（IFE）、生产促进计划（ATP）和其他补贴计划被证明对阿根廷人和国家工业度过最近历史上最黑暗的时刻之一起到了决定性作用。经济部长马丁·古斯曼在创建此类支持工具方面表现明智，而他最亲密的合作者马蒂亚斯·库尔法斯明白，它们的遗产不应简单地消逝。他现在寻求加强和扩展它们，坚信它们在保护阿根廷免于崩溃方面的根本作用。阿尔贝托·费尔南德斯总统重视经验和必要性，准备毫不犹豫地支持这条道路。\n\n因此开始了一个新阶段，库尔法斯将努力加强ATP、IFE以及旨在维持各种规模企业的额外措施，从最小的家庭作坊到最大的国家集团。大流行期间生存的记忆仍然生动，增强了补贴至关重要的信念。关于资金规模的辩论肯定会出现，但最终决定权在于费尔南德斯，他将在信任的指导下选择库尔法斯的愿景。"
ARG_reducir_la_burocracia_estatal: "减少国家官僚机构"
ARG_reducir_la_burocracia_estatal_desc: "阿根廷成千上万的公共雇员仍然完全依靠国家工资生活，根本不工作或担任如此无关紧要的职位，以至于消耗国家预算而不是为人民服务。月复一月，数十万比索被这个臃肿的官僚机构消耗，这些资源本可以用来维持国家工业的复兴或为陷入困境的家庭提供基本补贴。这个问题对每个人来说都很明显，从阿尔贝托·费尔南德斯总统本人到最普通的公务员。\n\n费尔南德斯决心采取行动，委托马蒂亚斯·库尔法斯执行重组系统的艰巨任务。库尔法斯认为，唯一现实的途径是双重的：迫使那些没有实际任务的人积极在私营部门寻找就业，并将那些陷入无用职位的人重新安置到公共行政部门需要真正劳动的领域。通过这种方式，国家不仅将削减其臃肿的官僚机构，还将把宝贵的资金重新引导回经济中，在深刻的国家危机时刻提供缓解。"
ARG_prestamos_accesibles: "负担得起且具有竞争力的贷款"
ARG_prestamos_accesibles_desc: "银行被过多的法规迷宫所扼杀，发现自己无法向无数公司提供贷款。这种情况对国家和私营部门都有害，导致许多公司在危机中陷入停滞甚至破产。马蒂亚斯·库尔法斯警告说，这些障碍只会加深经济创伤，并敦促阿尔贝托·费尔南德斯总统拆除这些扼杀金融生活的繁重规则。\n\n响应这一呼吁，费尔南德斯总统果断采取行动，使银行摆脱过时法规的重负，并再次赋予它们广泛放贷的能力。这一转变得益于库尔法斯为阿根廷获得的中国投资流入。在比索逐步稳定的支持下，银行被鼓励大力放贷，在某些情况下甚至无息放贷，特别是对中小型公司。因此，这些企业不仅没有崩溃，反而获得了不仅生存而且参与竞争的机会，复兴了国家经济的脉搏。"
ARG_eliminar_regulaciones_absurdas: "消除荒谬的法规"
ARG_eliminar_regulaciones_absurdas_desc: "阿根廷被荒谬法规的迷宫所拖累，企业家们不断谴责这些法规。许多这些规则的存在与其说是为了确保秩序，不如说是为了获取收入，但实际上它们扼杀了工业，使无数企业主无法正常运作。更糟糕的是，这样的法规创造了漏洞，强大的人可以通过这些漏洞逃避税收，加深对系统的不信任。这个问题已经变得如此明显，现在引起了阿尔贝托·费尔南德斯总统本人的注意，使其解决不可避免。\n\n面对这一挑战，马蒂亚斯·库尔法斯部长打算说服费尔南德斯消除许多这些不必要的障碍。然而，改革不会作为对企业的免费礼物而来；作为交换，库尔法斯寻求将加强竞争力的承诺。通过在要求责任的同时使阿根廷公司摆脱令人窒息的限制，他希望将它们转变为全球公司的真正竞争对手。通过这种方式，阿根廷可以重新夺回其在世界经济中被遗忘的地位，并恢复对其国家工业的自豪感。"
ARG_reforzar_industria_nacional: "为国家工业投资"
ARG_reforzar_industria_nacional_desc: "银行像中小型工业公司一样迫切需要国家支持。然而，国家无法同时为两者提供资金，根据马蒂亚斯·库尔法斯部长的计划，优先考虑中小企业。尽管如此，涉及的金额巨大，直接从公共国库分配有耗尽国家资源的风险。因此，阿尔贝托·费尔南德斯总统委托库尔法斯设计一个解决方案，在不放弃金融部门的情况下保护工业。\n\n库尔法斯依靠他与中国投资者的联系，提出了一条务实的路线。与其无休止地从国家汲取资金，中国资本将被引导到中小型企业，使它们能够现代化并不仅与阿根廷最大的公司竞争，甚至与国际竞争对手竞争。同时，国家资金将重新定向到银行，条件是私人金融机构反过来将投资引导到工业。因此，外国投资者、国家和私人银行之间可能出现平衡的伙伴关系。"
ARG_buscar_swat_con_china: "寻求与中国进行金融互换"
ARG_buscar_swat_con_china_desc: "自2021年大危机的动荡日子以来，阿根廷一直背负着外国市场不信任的负担，被未付债务和持续的外汇短缺所困扰。政府在储备需求、对债权人的义务以及马蒂亚斯·库尔法斯提出的工业战略之间左右为难，常常发现自己陷入瘫痪。然而，阿尔贝托·费尔南德斯总统选择采取行动，授予库尔法斯推进其最大胆倡议的权力。\n\n该计划基于与中国的货币互换，通过库尔法斯的可信赖合作伙伴网络和长期投资者联系达成。这一机制不仅将使阿根廷的债务组合多样化，还将确保稳定的外汇流入国家。这些资源同时用于加强储备、履行外部义务和支持工业发展，成为更新战略的基石。因此，通过费尔南德斯的批准和库尔法斯的外交，阿根廷寻求重新获得稳定并恢复对其经济的信心。"
ARG_acrecentar_credito_financiero: "增加金融信贷"
ARG_acrecentar_credito_financiero_desc: "中国人民币开始通过马蒂亚斯·库尔法斯谈判的货币互换流入阿根廷，但其潜力在很大程度上仍未得到利用。国家财政仍然脆弱，被长期不稳定和YPF等公司的不稳定地位所拖累，这些公司反映了工业部门更广泛的弱点。尽管如此，库尔法斯设想了一项稳定国内系统的大胆战略，尽管存在怀疑，他决心坚持到底。\n\n他的想法基于一个简单但雄心勃勃的原则：如果大量外国资本持续进入阿根廷，市场本身将逐渐开始流通并鼓励国内金融结构内的借贷。反过来，这将培养韧性并为持久稳定提供第一个坚实的基础，这是国家几十年来所缺乏的。尽管这一过程不可避免地会缓慢，但库尔法斯相信它将使阿根廷抵御外部冲击和内部危机。在他看来，这些措施是抵御华尔街崩溃和美国深刻衰落引发的风暴的唯一现实途径。"
ARG_un_peso_argentino_fuerte: "强劲的阿根廷比索"
ARG_un_peso_argentino_fuerte_desc: "已经用盈余资金采取了决定性行动，政府现在接近似乎是期待已久的转型的最后也是最重要的阶段：确保具有实际价值并在世界市场上得到认可的强劲阿根廷比索。随着时间的推移，我们成功吸引了坚实的中国投资进入我们的经济，这是一项真正显著的成就，为国内系统注入了信心。我们还解决了政府官僚机构的臃肿层级，拆除了许多不必要的障碍，同时实施了许多较小的改革。这些措施共同创建了一个连贯的战略，使阿根廷接近最终目标——一种在国内受到尊重并在国外受到重视的比索。现在，唯一缺失的要素是阿尔贝托·费尔南德斯总统的最后正式批准，之后前进的道路将开放。\n\n这些精心计算的调整的结果，由马蒂亚斯·库尔法斯设想和捍卫，预计将是历史性的：将阿根廷比索确立为真正强大和稳定的国际货币。几十年来第一次，外国合作伙伴将终于毫不犹豫地接受比索进行贸易，标志着阿根廷以可信度回到全球舞台。多亏了库尔法斯的决定，国家可以再次梦想不仅成为参与者，而且成为塑造全球市场的主要出口国之一。"
ARG_incrementar_exportaciones: "增加出口"
ARG_incrementar_exportaciones_desc: "尽管常识建议将盈余资金引导到国家储备中以加强比索并避免2021年灾难性经济崩溃的重演，但马蒂亚斯·库尔法斯设想了一条完全不同、更激进且更具风险的道路，他相信这可能为阿根廷带来显著成果。在政府内部的激烈辩论中，库尔法斯和他坚定的支持者团体成功地强加了他们的愿景，使阿尔贝托·费尔南德斯总统别无选择，只能批准这个大胆的计划，希望运气和理性能够对齐，并祈祷历史不会以另一场毁灭性的银行崩溃的形式重演。\n\n该计划的本质简单而雄心勃勃：不是将资本固定在储备中，政府将过剩资金直接注入农业和工业出口商，押注出口的激增将在逻辑上吸引外汇流入。这一流入不仅应稳定而且应提高比索的价值，同时产生能够支持阿根廷生产部门长期扩张的可持续经济增长。库尔法斯仍然相信，加强的出口将保证国外可靠的需求，确保阿根廷在未来几年在国际市场上的稳固地位。"
ARG_aumentar_las_reservas: "增加国家储备"
ARG_aumentar_las_reservas_desc: "2021年经济危机爆发时，阿根廷缺乏必要的资金来履行其义务，而此时公民大规模涌入银行提取存款并在国家市场清算其资产。这种连锁反应迫使政府从银行系统本身提取资金，一夜之间崩溃了信心并引发了臭名昭著的危机。这些事件的记忆仍然是阿根廷最痛苦但最宝贵的教训之一：它不仅表明了储备耗尽时可能出错的地方，还表明了可以采取什么机制来确保这样的灾难不再重演。\n\n从这一痛苦经历中产生了马蒂亚斯·库尔法斯的信念，他希望说服阿尔贝托·费尔南德斯总统将政府资源的每一笔盈余都用于加强国家储备，同时通过计划系统支付基本国家开支，而不是耗尽银行。通过这样做，阿根廷可以保护自己免受2021年最微弱的回声，并在压力时期保持稳定。反过来，公民将感谢库尔法斯的远见、他采取预防措施的意愿以及他表明政府已从历史中吸取教训的决心。时间一如既往地将是最终的裁判，但在这种情况下，它可能会确认这种谨慎正是阿根廷所需要的。"
ARG_una_tormenta_politica_inestable: "不稳定的政治风暴"
ARG_una_tormenta_politica_inestable_desc: "阿尔贝托·费尔南德斯总统在决定亲自领导正义党（PJ）和全民阵线（FdT）竞选活动后，遭受了反对派的毁灭性打击。变革联盟（JxC）获得了席位，四十年来正义党首次失去了议会多数席位。这场失败不仅削弱了费尔南德斯，还在他的遗产上留下了永久的污点——历史不会忘记的污点。然而，最大的危险不是这个污点。更糟糕的事情正在逼近。一场风暴即将来临——一场巨大的、无情的风暴——带来它的不是反对派。\n\n这场政治风暴从内部升起：来自克里斯蒂娜·基什内尔和她忠实的追随者，他们服从她的每一句话。他们现在准备摧毁费尔南德斯总统及其最亲密的盟友，甚至诉诸死亡威胁和恐吓以确保克里斯蒂娜的统治地位。而这一次，阿尔贝托无能为力。他站在那里无能为力，眼睁睁地看着他的愿景在她手中崩溃。阿尔贝托·费尔南德斯不再是总统。他现在只是老阿尔贝托。"
ARG_un_frente_roto: "破裂的阵线"
ARG_un_frente_roto_desc: "全民阵线（Frente de Todos）——这个名字承诺团结，是庇隆主义每一个分支的巨大保护伞：联邦主义者、务实的梅内姆主义者、激进的基什内尔主义者，甚至那些倾向于马克思主义的人。一段时间以来，这种共识实验似乎奏效了。该联盟以对话为荣，声称尊重每一个声音，无论多么不和谐。但野心打破了平衡。队长贝托——阿尔贝托·费尔南德斯总统——寻求领导2021年立法竞选，不是作为傀儡，而是作为指挥战略家。\n\n竞选崩溃了，随之而来的是维系全民阵线的脆弱团结。今天，全民阵线站在破裂的边缘。塞尔希奥·马萨召集他的技术官僚；费尔南德斯紧紧抓住褪色的忠诚者；而克里斯蒂娜·基什内尔高耸于两者之上，收紧她的控制。每个派系都为生存而战，但阿尔贝托和塞尔希奥共享一个恐惧：克里斯蒂娜不懈的野心。如果不加以遏制，它将吞噬联盟，只留下曾经代表共同阵线承诺的废墟。"
ARG_reunion_de_emergencia_con_cafiero: "与卡菲罗的紧急会议"
ARG_reunion_de_emergencia_con_cafiero_desc: "全民阵线深深分裂。基什内尔主义者原则上拒绝支持阿尔贝托·费尔南德斯总统盟友提出的任何提议，有时甚至拒绝支持塞尔希奥·马萨的盟友提出的提议。他们已成为核心障碍，因为他们的不妥协态度使立法行动陷入瘫痪，拖延了经济部长马丁·古斯曼倡导的经济改革。结果，货币危机继续恶化，直接打击了已经信誉下降的疲惫老费尔南德斯。\n\n为挽救局势并以某种方式将古斯曼的计划通过已变得实际上敌对的议院，费尔南德斯现在寻求与外交、国际贸易和宗教事务部长圣地亚哥·卡菲罗协商。他们希望共同制定可行的战略，引导改革绕过根深蒂固的基什内尔主义派系和急切的右翼反对派。他们相信，只有这样做，阿根廷才能找到稳定的前进道路，并开始摆脱持续经济动荡令人窒息的控制。"
ARG_buscar_votos_en_la_oposicion: "寻求反对派的支持"
ARG_buscar_votos_en_la_oposicion_desc: "外交部长圣地亚哥·卡菲罗与阿尔贝托·费尔南德斯总统——如果这个头衔还有分量的话——共同起草了一项计划，旨在通过一个充满反对派和执政联盟内部持不同政见者设置的障碍的议会，推进经济部长马丁·古斯曼的经济计划。他们共同的目标是在一个充满敌意的立法机构中生存，许多人宁愿看到费尔南德斯受辱、名誉扫地、任期缩短。然而尽管有这些希望，这样的结果远未确定。\n\n战略的关键部分在于从变革联盟（Cambiemos）中获取尽可能多的选票，利用每一个潜在的让步来确保古斯曼改革的支持。费尔南德斯准备与任何愿意贡献哪怕一票决定性支持的人讨价还价，无论政治代价如何。不可避免地，批评者会指责他背叛庇隆主义，但在他自己的政党已经背弃他、阿根廷本身陷入更深危机的时刻，根本没有其他选择。"
ARG_promesas_politicas_baratas: "廉价的政治承诺"
ARG_promesas_politicas_baratas_desc: "外交部长圣地亚哥·卡菲罗与阿尔贝托·费尔南德斯总统——如果这个头衔还有分量的话——共同起草了一项计划，旨在通过一个充满反对派和执政联盟内部持不同政见者设置的障碍的议会，推进经济部长马丁·古斯曼的经济计划。他们共同的目标是在一个充满敌意的立法机构中生存，许多人宁愿看到费尔南德斯受辱、名誉扫地、任期缩短。然而尽管有这些希望，这样的结果远未确定。\n\n该计划依靠通过获得各政治派别的承诺来加强治理，尽管鉴于总统受损的地位，这样的承诺可能被证明是空洞的。从变革联盟成员到正义党和全民阵线内部的人物，预计将以阿根廷稳定的名义做出承诺。如果兑现，它们可以提供一个脆弱的平静盾牌，让老阿尔贝托的第一任期剩余时间以更少的风暴和表面的秩序度过，直到2023年选举。"
ARG_la_ofensiva_de_cristina: "克里斯蒂娜的攻势"
ARG_la_ofensiva_de_cristina_desc: "老阿尔贝托·费尔南德斯手里拿着一份报告——一份他从未希望阅读的报告。过去几周对一个不再感觉像总统的总统来说纯粹是折磨。失去人气现在是他最不担心的事情；最重要的是克里斯蒂娜·基什内尔及其马克思主义忠诚者的威胁。阿尔贝托知道自己陷入了困境，但这份文件进一步压垮了他：正如其作者声称的那样，这是一场计划政变的不可否认的证据。\n\n而最糟糕的是——这是真的。费尔南德斯第一次看到克里斯蒂娜阴谋的全部规模和她将他赶下台的决心。曾经，也许他可以反击。现在，他无能为力，被困在一场每一步都对她有利的游戏中。但阿尔贝托有最后一个想法：将狂热的基什内尔主义者西尔维娜·巴塔基斯推到聚光灯下，希望这个姿态能给他争取时间——足够推迟政变的时间，足够挽救所剩无几的东西。对于老人来说，这不再是关于胜利；而是关于生存。"
ARG_un_alberto_solitario: "孤独的阿尔贝托？"
ARG_un_alberto_solitario_desc: "曾经有一段时间，阿尔贝托·费尔南德斯总统领导着一个团结的政府，一个他的忠诚者与克里斯蒂娜·基什内尔阵营共存的联盟。在那些日子里，和谐盛行，承诺兑现，想法成为政策。国会跟随他的领导，反对派缺乏控制权，阿尔贝托的声音塑造了国家的方向。那时，他不仅是名义上的总统——他是阿根廷方向的真正设计师。\n\n但那些日子已经消失了。现在迎来了衰落的时代，对曾经被称为队长贝托的人来说是一个苦涩的冬天。政府四分五裂，被克里斯蒂娜的威胁和无情的清洗所毒害，这些清洗剥夺了费尔南德斯最亲密的盟友。他的部长们走了，他的影响力正在消退，窃窃私语嘲笑他为“老人”。然而阿尔贝托拒绝完全投降。为阻止克里斯蒂娜的崛起，他考虑不可想象的事情——与塞尔希奥·马萨结盟，将真正的权力让给他，以换取最后一次机会阻止那个寻求统治一切的女人。"
ARG_el_final_de_super_alberto: "超级阿尔贝托的终结"
ARG_el_final_de_super_alberto_desc: "这是阿尔贝托·费尔南德斯总统的终结——或者更确切地说，是疲惫的老人阿尔贝托·费尔南德斯的终结——他现在已经不可挽回地失去了曾经吹嘘的总统超级权力。多年来，在国会中似乎注定失败的倡议只需费尔南德斯轻轻一挥就能奇迹般地成功，但那种魔力已经消失了。今天他仍然是名义上的总统，但实际上他已沦为一个傀儡，因为权力的实质已经从他手中溜走，现在分散在全民阵线迷宫般的走廊中。\n\n更糟糕的是，声名狼藉的议员们——那些顺从克里斯蒂娜·费尔南德斯·德·基什内尔意愿的人，甚至那些急于拍卖国家尊严的机会主义反对派——拒绝允许费尔南德斯获得任何权威。事实上，他们以与基什内尔主义强硬派同等的热情反对他。就这样，“超级阿尔贝托”的奇怪传奇结束了。他不再是拥有非凡影响力的领导人，而是沦为一个被基什内尔主义机器无情拉扯的傀儡。"
ARG_caida_de_leales: "忠诚者的陨落"
ARG_caida_de_leales_desc: "一切都结束了。经济部长马丁·古斯曼与几位在政治和经济上都很有价值的同事一起辞职了。尽管阿尔贝托·费尔南德斯总统尝试了一切——尽管阿根廷政治生活中短暂的平静，尽管古斯曼与国际货币基金组织的艰苦谈判，尽管老人在2021年议会选举失败后的几次成功——他们仍然选择下台，被克里斯蒂娜·费尔南德斯·德·基什内尔令人窒息的影响所驱使。\n\n可悲的是，他们的离开只会加强她的控制。费尔南德斯在内阁中仅剩的忠诚者是外交部长圣地亚哥·卡菲罗，而空缺的职位已经被基什内尔主义者填补。最引人注目的是西尔维娜·巴塔基斯的晋升，可以说她是最不适合担任经济部长这一关键角色的候选人，但费尔南德斯勉强任命了她。现在忠诚者的队伍已经破碎，基什内尔主义者以新的力量崛起，总统本人作为名存实亡的领导人徘徊，被剥夺了真正的权力。"
ARG_etapa_batakis: "巴塔基斯阶段"
ARG_etapa_batakis_desc: "西尔维娜·巴塔基斯，一位毫不妥协的基什内尔主义者和激进极端分子，现在担任经济部长一职。具有悲剧讽刺意味的是，她体现了与她的前任马丁·古斯曼曾经提供的务实和理性方法完全相反的东西。古斯曼寻求平衡和信誉，而巴塔基斯似乎有意强加一个严格的马克思主义-基什内尔主义框架。如果只是言辞问题，她的任命可能不那么令人担忧，但事实上她已经证明自己是阿根廷经济极不合适的守护者。\n\n她的承诺在其鲁莽程度上令人震惊，呼应了最极端的意识形态潮流。她威胁要拆除古斯曼建立的脆弱基础，将国家拖入更深的货币深渊，而国家才刚刚从中部分摆脱。然而克里斯蒂娜·费尔南德斯·德·基什内尔的主导地位迫使政府屈服，让巴塔基斯自由追求她的破坏性议程。阿尔贝托·费尔南德斯总统被剥夺了代理权，无助地看着阿根廷被推向更深的危机。"
ARG_otra_devaluacion: "另一次贬值？"
ARG_otra_devaluacion_desc: "西尔维娜·巴塔基斯在担任经济部长的头几天毫不拖延，采取大胆步骤来断言她的愿景。她最早的承诺之一是以使比索“具有竞争力”的名义贬值阿根廷比索的计划。这一宣布受到马克思主义-基什内尔主义忠诚者和其他与克里斯蒂娜·费尔南德斯·德·基什内尔结盟的激进分子的欢呼。乍一看，此举可能看起来有益，暗示着对国家弊病的短期补救。\n\n然而现实要可怕得多。这种鲁莽的战略威胁要拆除马丁·古斯曼及其盟友（包括马蒂亚斯·库尔法斯）在稳定通货膨胀和促进进口方面取得的脆弱进展。推动巴塔基斯的意识形态热情有使阿根廷陷入更深危机的风险，破坏多年的艰苦工作。另一次破坏性贬值现在似乎不可避免，而阿尔贝托·费尔南德斯总统无力阻止。他只能无奈地接受由他无法控制的力量强加的新的不稳定经济秩序。"
ARG_buscar_credito_extranjero: "在国外寻找信贷"
ARG_buscar_credito_extranjero_desc: "作为就职初期的一部分，经济部长西尔维娜·巴塔基斯承诺向全球各国寻求贷款。她打算向每个可用国家呼吁，接受任何提供的条件，无论利息负担如何，只是为了获得新资金。在马克思主义基什内尔主义者和克里斯蒂娜·费尔南德斯·德·基什内尔本人的热情支持下，巴塔基斯将这一进程呈现为拯救。然而其后果揭示了这种激进思想的危险。\n\n阿根廷很快将发现自己欠更多国家的债务，数额超过其历史上任何时候，使国家在国际社会面前处于屈辱地位。甚至委内瑞拉等敌对政权也可以持有影响力，将阿根廷从一个受尊重的大国沦为嘲笑的对象，在无尽义务的重压下蹒跚而行。尽管如此，阿尔贝托·费尔南德斯总统被剥夺了有效影响力，无力抵抗。他被迫忍受巴塔基斯将国家推向更深依赖的过程。"
ARG_el_super_ministro_sergio_massa: "超级部长塞尔希奥·马萨"
ARG_el_super_ministro_sergio_massa_desc: "西尔维娜·巴塔基斯的鲁莽政策最终导致了混乱。通过精心策划，我们成功地“建议”她辞职，使其看起来是自愿的，确保克里斯蒂娜·费尔南德斯·德·基什内尔无法将责任归咎于我们。计划奏效了，克里斯蒂娜仍然不知道巴塔基斯的离职是幕后策划的。然而她引发的动荡继续困扰着政府和国家，需要紧急补救。\n\n塞尔希奥·马萨进入这个真空，不仅担任经济部长，还作为新任命的“超级部长”，将多个部门和秘书处置于他的指挥之下。凭借广泛的权力，马萨将成为阿根廷的事实上的领导人，拥有超越阿尔贝托·费尔南德斯总统的影响力。尽管有他的所有缺点，但让马萨执政仍然比将国家命运交给克里斯蒂娜的忠诚者更好。在这种权力平衡中，阿根廷至少获得了脆弱的稳定机会。"
ARG_un_nuevo_horizente_politico: "新的政治地平线"
ARG_un_nuevo_horizente_politico_desc: "庇隆主义，以胡安·多明戈·庇隆命名并由埃娃·庇隆的遗产塑造的民粹主义运动，长期以来一直作为“第三位置”意识形态存在，融合了左翼和右翼的元素。几十年来，它提供了一个平衡对立力量的中心，直到埃塞萨大屠杀的悲剧打破了这种平衡。随着左翼被贴上恐怖分子的标签并从运动中清除，右翼开始主导，点燃了直到1983年蹂躏阿根廷的肮脏战争。\n\n在随后的几年里，正义党偏离了庇隆主义的原始原则——首先在卡洛斯·梅内姆领导下转向右翼，然后在内斯托尔和克里斯蒂娜·费尔南德斯·德·基什内尔领导下转向左翼。现在经济部长塞尔希奥·马萨提出了一个新的地平线：将庇隆主义恢复到其真正的第三位置身份，再次团结左翼和右翼。他的野心不仅是意识形态的，也是政治的，像庇隆在第一任期那样巩固权威，但这次是以阿根廷复兴的名义。"
ARG_leves_turbulencias_economicas: "温和的经济动荡"
ARG_leves_turbulencias_economicas_desc: "阿根廷经济处于脆弱的境地：既没有陷入更深的货币危机，也没有从中恢复。在西尔维娜·巴塔基斯鲁莽贬值后，通货膨胀仍然很高，而进口仍然减少，阻碍了真正的稳定。我们正在抵抗通货膨胀并试图降低进口成本，但这些措施不够充分。如果我们现在不采取激进行动，阿根廷将继续陷入停滞，无法克服困扰我们多年的货币危机。\n\n这就是为什么经济部长塞尔希奥·马萨正在准备深刻的结构性改革，旨在重塑系统。他警告民众“系好安全带”，因为国家可能很快进入“温和经济动荡”区域，这可能改变数百万人的日常生活。然而，这种动荡不是崩溃，而是转型的必要阶段。通过冒着今天脆弱稳定的风险，马萨寻求为明天的持久复苏创造条件，确保阿根廷最终摆脱危机循环。"
ARG_la_nueva_diplomacia_fernandezmassa: "新的费尔南德斯-马萨外交"
ARG_la_nueva_diplomacia_fernandezmassa_desc: "多年来，阿根廷将其外交政策限制在狭窄的合作伙伴圈子内，特别是在美国内战和巴西内战爆发以来。通过支持智利和乌拉圭，我们获得了有限的合作，并与乌拉圭和巴拉圭建立了仅有的适度联盟，而智利仍然陷入部分孤立。与此同时，我们未能培养更广泛的联盟来对抗北方查韦斯主义委内瑞拉构成的威胁，甚至因有争议的移民争端与某些国家关系紧张。\n\n现在塞尔希奥·马萨提出了一个戏剧性的转变：将阿根廷的外交政策彻底扭转18度。他的愿景是根据可靠性重新定义联盟，集中于实际伙伴关系以对抗委内瑞拉日益增长的影响力。这种务实的方法放弃崇高理想，转而追求残酷现实。阿尔贝托·费尔南德斯总统认识到当前的紧迫性，准备支持马萨的倡议。对于阿根廷来说，是时候以务实而非幻想的方式行事了。"
ARG_promesas_de_don_sergio_al_kirchnerismo: "塞尔希奥先生对基什内尔主义的承诺"
ARG_promesas_de_don_sergio_al_kirchnerismo_desc: "阿根廷总工会（CGT）以及各种基什内尔主义者——从谨慎的改革主义者到不妥协的强硬派——似乎已经对经济部长塞尔希奥·马萨和阿尔贝托·费尔南德斯总统失去信心。这一发展无异于灾难性的，因为没有他们的支持，政府可能陷入孤立，转变为一个如此不受欢迎的政府，甚至其自己的党员也公开蔑视它。为避免这场灾难，必须迅速果断地重新获得支持，无论成本或所需的妥协如何。\n\n因此，马萨打算开展一场广泛的政治运动，直接针对CGT和拉坎波拉——阿根廷最具代表性的基什内尔主义组织。这场运动将伴随着大量的承诺：以胡安·多明戈·庇隆和基什内尔夫妇的语言呈现的结构性改革，以及旨在直接吸引工人和活动家的民粹主义承诺。如果成功，这一战略不仅将确保他们的选举支持，还将延长政府的生存，为即将到来的选举提供一个脆弱但关键的桥梁。"
ARG_hay_que_pasar_el_invierno: "我们必须度过冬天"
ARG_hay_que_pasar_el_invierno_desc: "1959年6月29日，时任总统阿图罗·弗朗迪西手下的经济部长阿尔瓦罗·阿尔索加拉伊说出了他著名的话：“hay que pasar el invierno”——“我们必须度过冬天”。那一刻，阿根廷在1955年庇隆被推翻后仍然动荡不安，正面临超过1%的通货膨胀率。为应对这场危机，阿尔索加拉伊实施了严厉的紧缩措施：削减补贴、减少国家开支，并贬值比索。他的政策成功地将通货膨胀从13%降至约8%，成为弗朗迪西新自由主义经济实验的持久象征。\n\n六十多年后，经济部长塞尔希奥·马萨准备回应同样的信息。尽管属于庇隆主义政府，马萨提议类似阿尔索加拉伊的措施：减少公共服务补贴、贬值比索、严格限制货币发行，并明确面向国际投资。马萨向阿根廷人保证，如果他们能够“度过冬天”，那么繁荣将在春天和夏天回归，为国家带来稳定和增长。"
ARG_dilapidar_a_juntos_por_el_cambio: "揭露变革联盟"
ARG_dilapidar_a_juntos_por_el_cambio_desc: "变革联盟（Juntos por el Cambio）经常被反对派势力，特别是反基什内尔主义记者呈现为“最佳联盟”和阿根廷唯一可能的救世主。对他们来说，毛里西奥·马克里被誉为21世纪最伟大的政治家，这位领导人据说将国家从庇隆主义的“威权阴影”中解放出来。所有新自由主义声音都重复着同样的咒语：庇隆主义等同于威权主义、停滞和腐败。然而实际上，同样的新自由主义者为任何措施辩护，无论多么具有破坏性，只要它削弱庇隆主义，因为他们知道庇隆主义是对他们特权的真正威胁。他们操纵媒体、洗脑公民、欺骗选民，试图让变革联盟看起来像是一个“关心”人民的联盟。\n\n候选人坚持认为这样的谎言不能不受惩罚。正如毛里西奥·马克里必须被揭露为失败的新自由主义者一样，变革联盟必须被揭露为寡头和富裕精英的政党，远非普通阿根廷人的利益。他们现代化的承诺背后隐藏着一个只惠及一小群富有的商人的项目。相比之下，祖国联盟和正义党是唯一真正捍卫人民、他们的权利和尊严的真正政治力量。"
ARG_responder_al_peronismo_federal: "回应联邦庇隆主义"
ARG_responder_al_peronismo_federal_desc: "科尔多瓦省省长、议会中联邦庇隆主义者“我们行动”组织的领导人胡安·希亚雷蒂长期以来一直是真正庇隆主义眼中的刺。被称为“外国佬”，他整个政治生涯建立在自内斯托尔·基什内尔时代以来对联邦政府的持续违抗之上。年复一年，希亚雷蒂及其盟友破坏团结，反对来自布宜诺斯艾利斯的国家领导层，并试图将自己呈现为“真正”庇隆主义的捍卫者，而实际上却夺走了宝贵的选票并从内部削弱了运动。他们的行为不仅损害正义党，也损害阿根廷本身，为新自由主义反对派开辟了道路。\n\n因此，候选人将不再保持沉默。“外国佬”及其圈子必须被揭露为梅内姆主义者和叛逆州长，团结与团结的敌人。这场运动将公开谴责他们，摧毁他们虚假的声誉并揭露他们的谎言。如果希亚雷蒂的声音失去可信度，那么联邦庇隆主义者将最终认识到真相，团结在祖国联盟周围，并支持唯一真正有能力领导阿根廷前进的力量。"
ARG_acuerdo_fmi: "国际货币基金组织协议投票"
ARG_acuerdo_fmi_desc: "选举日已经过去。我们尽可能延长那一刻，希望对我们有利地塑造它。然而根据外交部长圣地亚哥·卡菲罗策划的计划，我们成功赢得了众多变革联盟议员的支持，从而加强了我们在国会和全国的地位。古斯曼长期推迟的法案，体现了与国际货币基金组织谈判的措施，不能再推迟了。是时候检验卡菲罗的设计了。\n\n出人意料的是，战略取得了成功。国会以微弱优势批准了经济部长马丁·古斯曼提出的每一项措施，使货币危机的解决更近了一步。与对手的意愿相反，阿尔贝托·费尔南德斯总统拒绝屈服于压力或辞职。这场艰苦的生存斗争确保他可以相对平静地完成任期，同时为他剩余的忠诚者提供适度但真实的稳定和保证，在阿根廷动荡的政治格局中。"
ARG_dolar_soja: "创建大豆美元"
ARG_dolar_soja_desc: "自20世纪80年代以来，阿根廷一直是世界领先的大豆出口国，经历了几次巨大的繁荣。首先是1996年转基因大豆的引入，然后是21世纪初全球需求高峰，巩固了大豆作为阿根廷经济主要支柱之一的地位。到2020年，大豆甚至成为国家预算比索的主要来源。然而，近年来，这个黄金时代被打断了。严重的干旱，加上全球危机（如华尔街崩溃）和政治不稳定留下的内部经济动荡的持久影响，大幅减少了阿根廷的大豆出口能力，造成预算赤字并消除了最后可靠的硬通货流入之一。\n\n作为回应，经济部长塞尔希奥·马萨现在寻求通过一项大胆且有争议的措施来振兴出口：创建所谓的“大豆美元”。这意味着为大豆出口商设定每美元2比索的特殊汇率，使出口更加有利可图并鼓励生产商向国外销售。尽管这个想法首先出现在西尔维娜·巴塔基斯短暂任职期间，但马萨打算果断地应用它，认识到这是她对经济政策为数不多的宝贵贡献之一。"
ARG_condenar_las_maniobras_de_venezuela: "谴责委内瑞拉的阴谋"
ARG_condenar_las_maniobras_de_venezuela_desc: "委内瑞拉高估了自己，对如果美国没有陷入内战它将为其扩张主义野心面临的命运视而不见。随着巴西同样四分五裂，阿根廷作为南美洲反对查韦斯主义侵略浪潮的最后自由和民主堡垒屹立不倒。加拉加斯追求的不是单纯的言辞，而是帝国主义征服的计划，是对大陆的逐步军事化统治，我们不能也不会允许。\n\n目前，经济部长塞尔希奥·马萨将代表外交部发表正式谴责，谴责委内瑞拉在宣布扩张主义意图后的每一个举动。阿根廷将发出全面谴责，进一步冷却已经冻结到核心的关系。也许这样的压力不会完全阻止委内瑞拉，但它可能会减缓其战争机器，更重要的是，为我们争取宝贵的时间。这段时间必须明智地利用——为即将到来的南美命运斗争做好坚决准备。"
ARG_gira_crediticia_de_massa: "马萨信贷之旅"
ARG_gira_crediticia_de_massa_desc: "阿根廷再次发现自己陷入了日益扩大的预算赤字的困境。马丁·古斯曼最有效的计划被取消，关键收入来源枯竭，使国家重新陷入货币危机的深渊。通货膨胀不受控制地飙升，加上西尔维娜·巴塔基斯对比索的鲁莽贬值。阿根廷无法承受失去阿尔贝托·费尔南德斯总统就职以来取得的脆弱成果。新的行动路线至关重要。\n\n塞尔希奥·马萨提出了这样一条路线。他的计划集中在从全球大国——俄罗斯、中国以及德国和法国等欧洲国家——获得贷款和信贷，以恢复金融稳定。批评者可能将此视为对超级大国的屈从，但马萨坚持认为条款将被制定为有利于阿根廷而非外国贷方。在他的愿景中，这些协议不仅将提供急需的资金，还将提供新的信誉和国际尊重。通过这次“信贷之旅”，马萨希望交付阿根廷迫切需要的资源。"
ARG_reforzar_al_operativo_condor_azul: "加强蓝鹰行动"
ARG_reforzar_al_operativo_condor_azul_desc: "蓝鹰行动在全民阵线在2021年立法选举中失败后几乎被埋葬。新任基什内尔主义部长拒绝支持该倡议，暂停了它，仿佛对来自委内瑞拉的迫在眉睫的威胁以及阿根廷武装部队对抗北方查韦斯主义侵略的不足视而不见。然而那些是不同的时代，现在情况发生了巨大变化。\n\n经济部长和事实上的总统塞尔希奥·马萨准备恢复资金并为蓝鹰行动注入新的活力。除了重新努力采购武器外，他还寻求加快进展，以便该计划在他于2023年12月正式担任总统时完成。在政治圈子里，几乎没有疑问这个结果是不可避免的，即使在马萨的对手中也是如此。唯一剩下的问题是军方能否满足雄心勃勃的最后期限并最终实现重新武装阿根廷的愿景。"
ARG_comprar_nuevas_armas_para_el_ejercito: "为军队购买新武器"
ARG_comprar_nuevas_armas_para_el_ejercito_desc: "军队曾经准备通过蓝鹰行动接收现代化武器，这是一项旨在重建阿根廷国防能力的雄心勃勃的计划。然而政府危机在阿尔贝托·费尔南德斯总统能够推进该倡议之前席卷了他，将其作为一次失败的尝试而被归入档案。随着支持该计划和费尔南德斯本人的忠诚者现在被取代，蓝鹰行动似乎注定要在新秩序下消失，没有复兴的希望。\n\n但经济部长塞尔希奥·马萨设想了一条不同的道路。除了他获取国际贷款的使命外，他打算悄悄探索购买武器和重新武装阿根廷军队的选择。他的目标是从灰烬中复活蓝鹰行动，恢复其承诺，并将武装部队转变为南美洲的精英。凭借新的力量，阿根廷军队最终可以准备好保卫国家免受委内瑞拉和任何其他敢于挑战其主权的威胁。"
ARG_una_argentina_con_garantias_de_inversiones: "拥有投资保障的阿根廷"
ARG_una_argentina_con_garantias_de_inversiones_desc: "拥有投资保障的阿根廷"
ARG_combatir_a_la_derecha_argentina: "对抗阿根廷右翼"
ARG_combatir_a_la_derecha_argentina_desc: "前进自由党（La Libertad Avanza）是由自由主义者哈维尔·米莱为2021年立法选举创建的一个相对较新但已经有影响力的右翼联盟。最初看似是一次小型实验，很快变成了一场政治地震：该联盟取得了出人意料的强劲结果，表明对传统政党的深刻不满，并将前进自由党定位为变革联盟的激进替代方案。从那时起，它只扩大了其影响力，稳步吸引因经济危机而失望并受到米莱激进言辞启发的公民。如果这种趋势继续下去，前进自由党可能很快成为最大的反对派力量，甚至赢得选举，这对阿根廷来说将是灾难性的，因为自由主义政府将拆除庇隆主义建立的每一个机构。\n\n这就是为什么经济部长塞尔希奥·马萨决心指示阿尔贝托·费尔南德斯总统果断行动。必须通过所有政治手段降低前进自由党的人气，揭露他们鲁莽的承诺和他们愿意将国家卖给外国势力的意愿。米莱担任总统意味着崩溃，因此我们不能允许自由主义者控制阿根廷。"
ARG_combatir_al_antikirchnerismo: "对抗反基什内尔主义"
ARG_combatir_al_antikirchnerismo_desc: "变革联盟，特别是共和国方案党（PRO）和激进公民联盟（UCR），仍然是传统的反庇隆主义和反基什内尔主义反对派，年复一年地与正义党争夺议会的每一个席位。尽管前进自由党迅速获得人气并在短期内显得危险，但它仍然是一个临时挑战，而真正和持续的威胁来自变革联盟，它继续破坏和拆除庇隆和基什内尔夫妇的遗产，支持他们的自由主义教条。\n\n这就是为什么经济部长塞尔希奥·马萨将建议阿尔贝托·费尔南德斯总统将政治火力集中在变革联盟和联邦庇隆主义者身上，而不是前进自由党。这两个派系已经多次被证明对布宜诺斯艾利斯和阿根廷本身的稳定更加危险，因为与前进自由党不同，我们已经确切知道他们在追求权力方面有什么能力。因此，迫切需要一劳永逸地结束这种国家威胁，即使批评者说摧毁变革联盟可能带来暂时的动荡。"
ARG_alberto_se_baja_del_barco: "阿尔贝托退出竞选"
ARG_alberto_se_baja_del_barco_desc: "不幸的是，阿尔贝托·费尔南德斯总统已正式通知他最亲密的下属，他将不会在2023年寻求连任，意识到他的声誉和在人民中的人气已经崩溃，他的时代已经过去。他想让位给年轻且有雄心的政治家，准备实施他们的项目和想法，无论遇到什么障碍，不像疲惫和衰弱的阿尔贝托。这一宣布引起了许多忠诚者的悲伤甚至眼泪，以及正义党成员的同情，令人惊讶的是，甚至来自曾经反对他的某些基什内尔主义者。\n\n但对于经济部长塞尔希奥·马萨来说，这一发展开辟了一条非凡的道路，一个一生只有一次的机会：成为阿根廷总统的机会。由于2023年选举中正义党提名没有其他强大或明确的竞争者，马萨成为自然且几乎不可避免的候选人，在运动内部没有严重的反对。因此，在他的领导下，阿根廷将在复兴的庇隆主义旗帜下被引导走向未来。"
ARG_reforzar_el_plan_potenciar_trabajo: "加强就业促进计划"
ARG_reforzar_el_plan_potenciar_trabajo_desc: "阿根廷最贫困阶层的许多家庭迫切需要财政援助，随着费尔南德斯政府每一天的过去，他们对政府越来越失望。相反，他们将信任寄托在反对派身上，特别是激进公民联盟（UCR），后者虚假声称庇隆主义者及其盟友根本不关心工人或边缘化群体，将他们描绘为精英的纯粹仆人。这些指控尽管完全没有根据，但逐渐侵蚀了政府的信誉。更糟糕的是，通过不果断反击这样的叙述，我们允许错误信息在社会的各个层面传播，慢慢毒害公众舆论并削弱我们在人民面前的地位。\n\n为阻止这股谎言浪潮，经济部长塞尔希奥·马萨打算大幅扩大针对下层家庭的赋权计划的资金。这项倡议将实现两个基本目标：首先，为阿根廷最脆弱的公民提供即时救济和真正的支持；其次，重建对庇隆主义的信任并在2023年选举前确保至关重要的选票。通过这些措施，我们将证明我们对普通阿根廷人的承诺，并揭露反对派的欺骗，明确表明他们的言辞不过是操纵。"
ARG_eliminar_algunas_regulaciones: "消除一些法规"
ARG_eliminar_algunas_regulaciones_desc: "尽管在应对经济危机的工业计划下部分废除了过时法规，但阿根廷仍然被大量无意义的限制所窒息，这些限制的设计只是为了从企业家中提取资金而不是鼓励他们的增长。这些不必要的障碍不仅破坏生产力和创新，还疏远社会的关键部门，特别是梅内姆主义者和自由主义庇隆主义者。他们的支持对稳定和选举成功至关重要，如果被忽视，这些选民可能轻易转向变革联盟，甚至更糟的是前进自由党，加强最危险的反对派力量对抗我们。\n\n因此，经济部长塞尔希奥·马萨决心启动一项新倡议，旨在消除更多这些有害法规。目标是双重的：首先，创建一个更公平、更透明的市场，尊重企业家的努力并允许他们繁荣；其次，表明庇隆主义运动关注所有阿根廷人，包括庇隆主义的自由主义翼，他们的选票可能决定2023年选举的结果。通过采取这样的行动，马萨将证明正义党真正关心每个公民，无论阶级或意识形态如何，重申庇隆主义与人民站在一起，并致力于建设一个公正、包容和经济强大的阿根廷。"
ARG_reinaugurar_la_bicicleta_financiera: "重新开启金融自行车"
ARG_reinaugurar_la_bicicleta_financiera_desc: "随着阿尔贝托·费尔南德斯总统与前经济部长马丁·古斯曼最初采取的所有改革，以及后来由现任经济部长塞尔希奥·马萨继续和扩展的改革，阿根廷的财政状况与费尔南德斯就职时的严峻条件相比有了显著改善。经过多年的艰难、通货膨胀压力和持续贬值，政府终于可以看到复苏的轮廓。马萨对迄今为止开展的工作感到满意，强调阿根廷现在比以往任何时候都更接近摆脱货币危机并进入可持续增长阶段。\n\n由于经济再次繁荣并展现出其最好年份同样的活力，马萨提议复兴被遗忘已久的“套利交易”策略。这项政策旨在通过为投资者创造有利条件并展示阿根廷作为有利可图市场的潜力来吸引外国资本流入。如果改革继续并深化，特别是在马萨可能的总统任期下，国际信任将上升，外国资金将流入布宜诺斯艾利斯，阿根廷将最终重新获得对未来的自豪和乐观。"
ARG_el_gran_congreso_peronista: "伟大的庇隆主义大会"
ARG_el_gran_congreso_peronista_desc: "现在，随着总统选举即将到来，正义党仍未就单一候选人达成一致。为解决这个关键问题，正义党打算召开一次伟大的全庇隆主义大会，最终决定谁真正值得携带庇隆主义旗帜进入选举。在这次大会上，每个人都有发言权和投票权：从具有梅内姆主义根源的联邦庇隆主义者，到改革主义和中间派激进分子，以及受马克思主义启发的派系和不妥协的极端基什内尔主义者。运动和阿根廷本身的未来将取决于这个选择。\n\n主要候选人包括革新阵线的塞尔希奥·马萨，曾经是律师，后来成为蒂格雷市市长、众议院议长，现在是经济部长，他体现了实用主义和技术官僚改革。与他竞争的是忠于阿尔贝托·费尔南德斯的丹尼尔·肖利，以前副总统和布宜诺斯艾利斯省省长而闻名，在许多圈子里仍然受到尊重。最后，基什内尔主义阵营支持爱德华多·“瓦多”·德佩德罗，他也是一名律师，目前担任内政部长。这些人物中的一位将被选中领导阿根廷，不仅到这十年结束，而且可能进入其历史的下一个时代。"
ARG_laultimacartadealberto: "阿尔贝托的最后一封信"
ARG_laultimacartadealberto_desc: "多亏了阿尔贝托·费尔南德斯总统的影响力——他给代表的信件、一些要求的满足、老阿尔贝托本人的个人权威，当然还有财政资源的谨慎使用——全庇隆主义大会产生了意想不到的结果。大会没有确认经济部长塞尔希奥·马萨的预期候选资格，而是选择了现已崩溃的巴西前大使丹尼尔·肖利作为正式总统候选人。这一结果令许多人感到震惊，特别是基什内尔主义派系，他们已经与马萨和解，但无法完全接受肖利这个忠诚者形象。\n\n尽管如此，决定已经做出，丹尼尔·肖利已经开始塑造他的竞选活动。他强调连续性，公开宣布他将推进阿尔贝托·费尔南德斯总统的愿景，保留他的政治遗产，并深化那些因危机和限制而未完成的改革。同时，肖利寻求将自己呈现为通往阿根廷未来的桥梁，承诺在持久的庇隆主义旗帜下推动国家前进，在新世纪复兴繁荣的希望，并为阿根廷未来几代人奠定基础。"
ARG_el_caudillo_de_tigre_liderara: "蒂格雷领袖将领导"
ARG_el_caudillo_de_tigre_liderara_desc: "预期且几乎不可避免的事情终于发生了：通过政治阴谋、对代表的承诺以及财政杠杆的战略使用，经济部长塞尔希奥·马萨确保了他作为正式总统候选人的地位，超过了他最接近的竞争对手丹尼尔·肖利。马萨不仅在他的忠诚支持者中享有广泛的人气，而且在基什内尔主义派系的重要部分甚至费尔南德斯的旧卫队中也享有广泛人气，成为期待已久的能够将庇隆主义的各个分支团结在一面旗帜下的妥协人物。因此，正义党将其未来托付给他，作为回报，他向运动和阿根廷人民加倍承诺。\n\n他的计划明显是民粹主义的，被框定为“新庇隆主义政治地平线”的扩展。马萨公开宣布他打算复兴胡安·多明戈·庇隆第一届政府最成功的政策，同时使其适应现代挑战。他承诺平衡左翼和右翼庇隆主义者之间的内部紧张关系，引导运动走向民族团结。更雄心勃勃的是，他承诺为一个真正进步且真正庇隆主义的阿根廷奠定基础——一个在他的愿景中将成为所有公民无论社会阶层或背景的繁荣天堂的国家。"
ARG_la_campana_mas_importante_pj: "正义党最重要的竞选"
ARG_la_campana_mas_importante_pj_desc: "既然正义党终于选择了其候选人，他立即面临一份战略报告，概述了祖国联盟竞选活动的两个可能方向。第一个选择是经典的庇隆主义风格，类似于阿尔贝托·费尔南德斯和其他温和庇隆主义者曾经进行的竞选活动。这条道路强调对民主体制的尊重，同时仍然采用民粹主义、几乎救世主般的语气，将正义党呈现为选举中唯一真正的替代方案。其主要口号将是警告选民不要因为放弃他们的历史运动而成为“甚至更贫穷的忠诚庇隆主义者”。\n\n然而，第二个选择要激进得多，以1946年和1973年的竞选为模型，当时正义党毫不犹豫地使用每一种可能的工具来表现为唯一有能力领导阿根廷的政党，即使这意味着犯错、压制反对声音或采用近乎威权民粹主义的方法。这种方法旨在创造一种力量、团结和必然性的形象，将候选人投射为注定引导国家的救世主领袖。最终，决定权在于选定的候选人本人：是遵循温和的道路，还是拥抱庇隆主义激进、救世主般的传统。"
ARG_unacampanaradicalizada: "历史上最激进的竞选"
ARG_unacampanaradicalizada_desc: "选定的正义党候选人时间不多了，迫使他几乎不假思索地做出决定，因为如果他想确保任何胜利的机会，竞选必须立即开始。权衡选择后，他选择了激进竞选的道路，果断放弃近年来的温和风格，而是唤起传奇的1946年和1973年选举的精神。目标是吸引直言不讳的激进分子和左翼团体的同情，他们从未接受淡化、温和的庇隆主义方法，并要求回归毫不妥协的政治斗争。\n\n因此，祖国联盟现在调动每一种可能的行政、组织和政治资源，围绕候选人构建一个国家救世主的形象，一个没有他阿根廷将陷入废墟的救世主人物。2021年立法竞选使用的竞选口号正在被彻底重新设计和激进化，转变为与新方向相匹配的激进紧迫感和命运信息。同时，国家机构将被悄悄但坚定地工具化，以压制持不同意见的声音，确保庇隆主义的声音高于所有其他声音。"
ARG_unacampanaalestiloclasicoperonista: "经典庇隆主义风格的竞选"
ARG_unacampanaalestiloclasicoperonista_desc: "选定的正义党候选人时间不多了，迫使他几乎不假思索地做出决定，因为如果他想确保任何胜利的机会，竞选必须立即开始。权衡选择后，他选择追求温和战略，灵感来自过去传统的庇隆主义竞选活动，尽管有些（如2021年议会选举）以失败告终。理由很简单：正义党不能疏远温和的梅内姆主义者和联邦庇隆主义者，他们的选票可能对确保胜利起决定性作用。\n\n因此，祖国联盟正在调动每一种行政、政治和沟通资源，发起一场广泛的竞选活动，旨在精心“温和救世主化”候选人。目的是将他呈现为所有候选人中最强壮和最值得信赖的选择，一个能够团结而非分裂的领导人。与更激进的道路不同，这场竞选强调对民主的尊重，强调候选人不会诉诸审查或威权工具。最后，他承诺庇隆主义仍然是阿根廷民主的真正捍卫者。"
ARG_recordar_los_tiempos_del_gato_macri: "回忆猫咪马克里的时代"
ARG_recordar_los_tiempos_del_gato_macri_desc: "毛里西奥·马克里，2015年至2019年的阿根廷前总统，作为21世纪第一位非庇隆主义国家元首载入史册。他将自己定位为热情的新自由主义者，承诺现代化和改革，据说将拯救国家。在他的任期内，他拆除了基什内尔政府的许多成就，甚至破坏了胡安·多明戈·庇隆的部分遗产，这些遗产几十年来为阿根廷提供了稳定和身份认同。对于许多反对派声音来说，马克里成为“对抗威权庇隆主义的新鲜空气”，被誉为打破传统并提供新政治地平线的所谓英雄。\n\n但他真的是那个英雄吗？实际上，马克里是阿根廷有史以来最具破坏性的领导人之一。他的经济改革类似于何塞·阿尔弗雷多·马丁内斯·德霍斯的改革，引入了失败的货币实验和严格的新自由主义计划，将国家推入严重的金融和货币危机。即使他的社会政策看起来不那么有害，也不足以掩盖他经济取向的破坏性后果。他没有捍卫主权，而是向投机资本开放阿根廷，将外国投资者置于国家发展之上。候选人现在坚持向阿根廷人展示马克里的黑暗面，反对派力量拼命隐瞒的一面，以便人们记住他的政府不是救赎，而是背叛。"
ARG_propaganda_en_contra_del_loco_milei: "反对疯狂米莱的宣传"
ARG_propaganda_en_contra_del_loco_milei_desc: "哈维尔·米莱，经济学家，布宜诺斯艾利斯众议员，以及他的自由主义政党和联盟前进自由党的创始人，在阿尔贝托·费尔南德斯总统就职后迅速获得人气，在2021年立法选举期间达到顶峰。他激烈的言辞吸引了许多对传统政党感到沮丧的选民，似乎将他定位为理性的经济学家。\n\n然而，米莱的声誉远非理性。甚至在学校时，他就被认为不稳定，以暴力爆发和侮辱闻名。在他的政治生涯中，他多次以侵略和傲慢攻击对手，揭示了不稳定的气质。候选人旨在让每个阿根廷人都意识到米莱的真实本性：不仅仅是一个挑衅性的经济学家，而是一个极其古怪的人物，其意识形态隐藏着极端观点。除了他的疯狂之外，米莱还信奉极端意识形态，包括纳粹和法西斯同情，伪装在自由主义的外衣下。至关重要的是，选民要看到他的真实面目：一个危险的激进分子，而不是一个深思熟虑的政策专家。"
ARG_el_peronismo_sabe_hacer_el_verbo_amor: "庇隆主义懂得变位爱的动词"
ARG_el_peronismo_sabe_hacer_el_verbo_amor_desc: "在阿根廷各地，反对派人物经常声称庇隆主义是“压迫的意识形态”、“反民主的”和“威权的”。这些指控从根本上说是错误的。庇隆主义一直是民主和自由的捍卫者，特别是在肮脏战争和所谓的“最后军事 Junta”（1976-1983年）等关键时刻。我们反对反对派的说法是对历史和现实的故意歪曲，旨在误导公众并破坏运动。\n\n为反击这些谎言，候选人将分配祖国联盟的部分行政资源开展一场运动，强调庇隆主义和正义党象征着关怀、团结和和平治理——一个始终为所有阿根廷人的福祉而努力的运动。同时，那些积极威胁国家或支持犯罪行为的反对派领导人将被揭露和对抗。信息很明确：庇隆主义代表正义和秩序，那些反对它的人对阿根廷构成真正威胁。为了国家的安全，必须果断处理这些威胁，确保运动的稳定和国家的安全。"
ARG_gira_por_el_buenos_aires_kirchnerista: "基什内尔主义布宜诺斯艾利斯之旅"
ARG_gira_por_el_buenos_aires_kirchnerista_desc: "布宜诺斯艾利斯省一直是庇隆主义的核心，是正义党在阿根廷受欢迎程度的中心。这不仅是因为其无数的贫困村庄几十年来受益于庇隆主义政策下授予的特权，还因为根深蒂固的政治霸权威信和客户网络塑造了当地生活。尽管他们贫穷，但这些省份在国家政治中至关重要，向议会派遣了许多议员。然而，随着时间的推移，曾经看似不可动摇的支持正在缓慢但稳定地侵蚀，为未来创造了不确定性。\n\n面对这一挑战和即将到来的选举，候选人选择回到布宜诺斯艾利斯的庇隆主义-基什内尔主义据点，寻求恢复热情并赢回贫困村庄的忠诚。目标很明确：确保布宜诺斯艾利斯作为庇隆主义和基什内尔主义的堡垒，直到十年结束。具体利益的承诺将伴随这一使命，因为与反对派不同，候选人和庇隆主义阿根廷公开宣布他们关心普通公民。"
ARG_sumar_apoyos_del_resto_del_peronismo: "增加整个正义主义运动的支持"
ARG_sumar_apoyos_del_resto_del_peronismo_desc: "今天的庇隆主义正经历其历史上最分裂的时刻之一。正统庇隆主义者、基什内尔主义者、联邦庇隆主义者、梅内姆主义者甚至所谓的“传统”庇隆主义者彼此渐行渐远，将团结变成了弱点。2021年立法选举的失败加深了这场危机，表明如果没有凝聚力，我们甚至可能失去最忠诚的选民。现任候选人缺乏信任，缩小了我们的基础，并给前进自由党等外部势力和洛佩兹·墨菲等煽动者提供了危险的机会，他们利用分裂为自己谋取利益。\n\n这就是为什么候选人将所有庇隆主义部门在正义主义旗帜下重新统一作为核心目标。信息必须明确：除了战术差异之外，我们都是庇隆主义者，只有正义党和祖国联盟捍卫人民。前进自由党及其盟友一旦掌权就会背叛工人和运动，就像新自由主义者一贯所做的那样。即使无法实现完全统一，加强凝聚力也将扩大我们的选举基础，并成倍增加我们获胜的机会。"
ARG_defender_los_exitos_de_la_decada_ganada: "捍卫胜利十年的成就"
ARG_defender_los_exitos_de_la_decada_ganada_desc: "基什内尔主义一直是、现在是、将来也将是阿根廷近几十年来最成功的时代。没有其他政府能够超越其成就。从克服灾难性的2021年危机到实现7-9%的年度GDP增长，将失业率降至2021年的7%，重组外债，并将经济关键部门国有化——这些成就不可否认。在社会方面，基什内尔主义将贫困率从35%降至25%，向低收入家庭提供补贴，通过战犯审判确保正义，扩大医疗保健机会，甚至通过将同性婚姻合法化开创平等。\n\n胜利阵线标志着现代阿根廷最辉煌的篇章之一，证明适应新时代的庇隆主义可以真正改变国家。候选人承诺捍卫和扩大这些历史性成就，使每个阿根廷人都认识到基什内尔主义如何拯救了国家。让反对派将他们的新自由主义灾难与这一增长和正义的记录进行比较。祖国联盟是唯一的未来——因为基什内尔主义已经展示了通往繁荣的道路。"
ARG_revivir_al_fantasma_del_menemismo: "唤醒梅内姆主义的幽灵"
ARG_revivir_al_fantasma_del_menemismo_desc: "梅内姆主义无疑是阿根廷历史上最黑暗和最具破坏性的时代之一。那是一个数百万人陷入贫困的时代，腐败无处不在，大规模私有化摧毁了国家主权的基础。在卡洛斯·梅内姆的领导下，富人和寡头控制了国家，几乎像奴隶一样剥削阿根廷工人，支付微薄的工资，完全无视他们的尊严、安全和权利。他的新自由主义政策使无数家庭破产，摧毁了工业，并留下了社会至今仍在承受的伤痕。数百万人记得梅内姆主义带来的悲伤和绝望，而另一些人试图忘记——但历史无法被抹去。\n\n这就是为什么候选人坚持梅内姆主义绝不能再次被美化或重写为积极的东西。因为卡洛斯·梅内姆只给阿根廷带来了痛苦和屈辱。然而，变革联盟、所谓的联邦庇隆主义者如“外国佬”希亚雷蒂，以及自由派精英竟敢将他赞扬为模范总统。谎言必须被揭穿，真相必须被告知：梅内姆主义是背叛、灾难和痛苦。阿根廷永远不会接受它的回归。"
ARG_estrategia_electoral_al_estilo_alfonsin: "阿方辛式选举战略"
ARG_estrategia_electoral_al_estilo_alfonsin_desc: "劳尔·阿方辛，1983年选举的总统候选人，成为最后一个军事独裁政权倒台后阿根廷的第一位平民总统。在这次历史性选举中，他通过对民主、人权和惩罚肮脏战争失踪者责任人的毫不妥协的捍卫，决定性地击败了伊塔洛·卢德。得益于他有效的竞选活动和道德清晰度，阿方辛于1983年担任总统，启动了恢复机构并为阿根廷人带来新民主时代希望的改革。\n\n今天，我们的候选人寻求遵循阿方辛的道路，拥抱同样的原则：对民主坚定不移的承诺，捍卫人的尊严，建设公平的福利国家，以及促进社会民主。我们将警告人民，右翼反民主主义者一旦掌权就威胁要废除民主。我们的使命是赢得人心，激发信任，并永远将阿根廷从独裁的阴影中拯救出来。"
ARG_gobernadores_peronistas_rebeldes_sin_causa: "无因的庇隆主义叛逆州长"
ARG_gobernadores_peronistas_rebeldes_sin_causa_desc: "自内斯托尔·基什内尔掌权以来，联邦庇隆主义者一直是一个持续的挑战。多年来，他们反对真正的庇隆主义，并作为布宜诺斯艾利斯联邦政府的持续障碍，仅在马克里总统任期期间暂停。他们一贯试图将自己呈现为庇隆主义的捍卫者，然而他们的行为削弱了运动，并为那些真正致力于保护它的人提供了优势。即使胡安·多明戈·庇隆本人也会反对这样的叛乱，重视团结高于派系争端。\n\n因此，候选人打算前往所有“叛逆”省份，特别关注科尔多瓦与胡安·希亚雷蒂（当地人称“外国佬”）会面。目标是呼吁他的责任感，强调在这个关键时刻团结的必要性，并提醒他庇隆不会批准这样的异议。虽然希亚雷蒂很可能会拒绝，但候选人希望影响其他州长，测试他们的忠诚度，并衡量他们的反对在这场持续的对抗联邦政府的斗争中能持续多久。最终，这项努力是为了巩固庇隆主义，并确保内部分裂不会威胁阿根廷的稳定。"
ARG_cambiemos_es_igual_a_martinez_de_hoz: "变革联盟就是马丁内斯·德霍斯"
ARG_cambiemos_es_igual_a_martinez_de_hoz_desc: "何塞·阿尔弗雷多·马丁内斯·德霍斯在豪尔赫·拉斐尔·魏地拉军事独裁统治下担任阿根廷经济部长。他因激进的新自由主义改革而臭名昭著，这些改革摧毁了阿根廷的工业，并包括臭名昭著的“汇率小黑板”政策，即比索贬值政策。他的经济计划还包括贸易自由化、金融放松管制以及冻结价格和工资。这些政策迅速增加了阿根廷的外债，并使经济越来越依赖金融部门而非生产性产业。\n\n候选人旨在警告阿根廷人，变革联盟遵循与马丁内斯·德霍斯相同的经济逻辑。毛里西奥·马克里政府和马丁内斯·德霍斯一样，推行自由化、开放市场和以金融为中心的政策。两者都助长了不断增长的外债，同时将金融投机置于工业发展之上。通过绘制这一清晰的平行，候选人希望公民明白支持变革联盟就是支持回归休克疗法，这可能再次使国家非工业化、加深不平等并使阿根廷容易受到经济危机的影响。在做出选举决定之前，公众必须看到这一历史警告至关重要。"
ARG_regalar_algunos_subsidios_a_las_clases_populares: "向民众阶级赠送一些补贴"
ARG_regalar_algunos_subsidios_a_las_clases_populares_desc: "正义党成员越来越似乎对候选人和他领导国家的能力失去信心。这并不奇怪，因为他们的忠诚往往缺乏实际支持，许多人从过去选举中支持庇隆主义胜利中没有获得任何真正的好处。因此，有些人可能被其他政党提供的特权和物质利益承诺所诱惑，尽管实际上这些只是欺骗庇隆主义选民放弃他们真正运动的幻觉。\n\n意识到这一挑战，候选人制定了一项计划，以加强正义党成员的忠诚度。他提议提供实际奖励——包括冰箱、汽车、房屋和其他福利——以认可和表彰坚定的庇隆主义支持者。目标是双重的：在即将到来的选举中保留这些选票，并加强祖国联盟的整体地位，增加决定性胜利的可能性。通过展示该党真正关心其人民并积极奖励忠诚，候选人希望恢复对庇隆主义的信任，反击反对派宣传，并表明它仍然是阿根廷最真实和最有能力的政治力量。"
ARG_peronismo_o_dependencia: "庇隆主义还是依附"
ARG_peronismo_o_dependencia_desc: "“庇隆主义还是依附”这句口号在1983年选举中被伊塔洛·卢德著名地用来对抗劳尔·阿方辛。虽然它没有为卢德带来胜利，但它成功地加强了庇隆主义的基础，展示了其即使在军事政权七年镇压后仍具有持久的力量。这场竞选强调了运动动员其基础并保持相关性的能力，证明清晰和原则性的信息可以与选民产生深刻共鸣并保留庇隆主义身份的核心。\n\n今天，这句口号重新获得了相关性，尽管背景已经改变。阿根廷现在面临由变革联盟和前进自由党组成的反对派，这些政党愿意为外国势力牺牲国家利益，让人想起军事独裁期间何塞·阿尔弗雷多·马丁内斯·德霍斯的政策。在候选人的领导下，阿根廷将保持独立、庇隆主义和韧性，保护国家免受剥削和外国统治。对比再清楚不过了：当反对派冒着将国家卖给欧洲人和富裕精英的风险时，候选人承诺力量、主权和对人民的忠诚。选择是明确的，人民理解它。"
ARG_la_primera_vuelta_decisiva: "决定性的第一轮"
ARG_la_primera_vuelta_decisiva_desc: "所有准备工作已完成，竞选活动已全面启动，祖国联盟的行政资源已动员起来争取选民。我们采取了决定性步骤，阻止了联邦庇隆主义州长的叛乱，赢得了数百万阿根廷人的心，并对抗梅内姆主义者，同时恢复了正义党久违的团结。第一轮即将到来，我们的候选人已准备就绪。\n\n我们的对手也很活跃，有哈维尔·米莱和前进自由党、变革联盟和帕特里夏·布尔里奇，当然还有“外国佬”希亚雷蒂和他的“我们行动”联盟。所有候选人均已准备就绪，渴望战斗。然而，我们相信我们项目的力量和人民的意愿。我们的候选人是唯一真正为阿根廷人而非金钱着想的受欢迎领导人。让斗争开始，知道最终只有两位胜利者将进入决定性的下一轮。"
ARG_el_ascenso_del_caudillo_de_tigre: "蒂格雷领袖的胜利"
ARG_el_ascenso_del_caudillo_de_tigre_desc: "我们做到了！祖国联盟赢得了第一轮，我们的候选人在名单中领先。我们的口号激励公民为我们投票，他们以信任回应。这场胜利也归功于所有庇隆主义者的统一，恢复了正义党的凝聚力，并至少暂时让“外国佬”等联邦庇隆主义叛逆州长沉默，他们停止散布反对我们的谎言，在某些情况下甚至加入了我们的基什内尔主义竞选。\n\n现在，卢比孔河已经过了一半，但我们最大的敌人仍在等待：所谓的“狮子”哈维尔·米莱，带着他的自由主义者和前进自由党的右翼民粹主义者。这位无法控制自己侵略性的不稳定经济学家，将在决定性的第二轮中面对我们的候选人，决定阿根廷的命运。剩下的就是将所有行政资源重新定向到我们的竞选活动，并揭露米莱的疯狂。如果我们成功，胜利将属于我们。"
ARG_la_victoria_del_leon_milei: "狮子米莱的胜利"
ARG_la_victoria_del_leon_milei_desc: "这是灾难性的——我们最糟糕的噩梦成真了。我们在第一轮输给了自由主义狂人哈维尔·米莱和他的前进自由党，给他早期优势，并暴露了我们竞选活动的弱点。也许选民不喜欢我们候选人的言辞，或者他们的思想被这位自称自由主义者却缺乏基本经济学理解的不稳定经济学家所动摇。无论如何，他赢得了第一轮。\n\n但我们输掉了战斗，不是战争。我们的候选人和哈维尔·米莱将在决定性的第二轮中面对，这将决定阿根廷未来十年的命运。祖国联盟必须从错误中吸取教训并纠正它们，战略性地重新分配所有行政资源以确保胜利。将尽一切努力确保像米莱这样鲁莽的极端分子不会掌权。同时，我们只能希望我们的候选人取得胜利并从这个危险的威胁中捍卫民主。"
ARG_la_llegada_del_gringo: "外国佬的到来"
ARG_la_llegada_del_gringo_desc: "出乎所有人意料，胡安·“外国佬”·希亚雷蒂和他的“我们行动”联盟赢得了总统选举的第一轮，这样的结果震惊了所有候选人。我们预期的候选人胜利——甚至是狂人哈维尔·米莱的胜利——没有实现，而是联邦庇隆主义者获胜，这严重削弱了我们的地位并破坏了我们的人气。我们必须迅速从这次失败中恢复过来，理解导致我们的选民转向联邦庇隆主义者的错误。\n\n然而这只是第一轮，决定性的第二轮即将到来。是我们的候选人将在阿根廷未来的最终战斗中面对“外国佬”希亚雷蒂。我们必须紧急重新分配祖国联盟的所有行政资源，从失败中吸取教训，并将我们的经验转化为胜利。我们的竞选活动将证明只有真正的正义主义才能团结国家。为了庇隆主义，为了正义党，为了阿根廷本身。"
ARG_la_madam_pato_bullrich: "帕托·布尔里奇夫人"
ARG_la_madam_pato_bullrich_desc: "这非常糟糕：帕特里夏·布尔里奇和她的变革联盟赢得了第一轮，让包括我们候选人在内的所有其他总统竞争者陷入混乱。考虑到我们最糟糕的敌人之一变革联盟成功超越所有人并与我们一起进入第二轮，显然犯了巨大的错误。我们必须承认这一巨大的宣传失败，分析每一个因素，并确保此类错误永远不会再次发生。\n\n现在所有注意力都转向决定性的第二轮，布尔里奇将与我们的候选人对抗，决定阿根廷的未来——或者更准确地说，决定未来将在何种意识形态和政党下构建。祖国联盟只能明智地重新分配其行政资源，考虑过去的错误以避免重复。剩下的就是团结起来，加强我们的信息，并祝愿我们的候选人在捍卫庇隆主义、正义党和阿根廷本身的荣誉方面取得成功，对抗来自共和国方案党的老敌人。"
ARG_la_coronacion_del_bulldog: "斗牛犬的加冕"
ARG_la_coronacion_del_bulldog_desc: "选举中出现了最意外的情况：里卡多·洛佩兹·墨菲和他的共和党联盟成功赢得了总统选举的第一轮，让所有政客都感到震惊。一个已经从政治舞台上消失的玩家突然在2020年带着共和党联盟回归，甚至在2021年立法选举后成为全国众议员，这似乎是不可能的。这位千禧年初的前经济部长现在带着他的技术官僚愿景重新出现，寻求赢得总统职位。\n\n面对这一挑战，我们的候选人和祖国联盟只能分析过去的错误，并为在第二轮中与这位技术官僚进行决定性斗争做准备。祖国联盟的行政资源将根据第一轮的教训明智地重新分配，以加强我们候选人在人民眼中的形象。我们的候选人必须再次作为阿根廷的真正救世主出现，而技术官僚洛佩兹·墨菲则被揭露为寻求摧毁国家的假先知。"
ARG_prepararse_para_la_segunda_ronda: "准备第二轮"
ARG_prepararse_para_la_segunda_ronda_desc: "于是，决定性的时刻到来了：2023年11月将举行选举的第二轮，我们的候选人将面对敢于直接挑战庇隆主义的反对派。我们仔细分析了第一轮的结果，认识到错误，纠正了它们，并加强了必须强调以确保胜利的积极方面。庇隆主义必须不惜一切代价生存，我们永远不会允许反对派抹去基什内尔主义所建立的遗产，现在不会，永远不会。\n\n因此，祖国联盟，特别是正义党的剩余行政资源将完全用于我们候选人的竞选活动，旨在赢得数百万选民的心，他们现在必须在两个项目之间做出选择，而不是多个。这场斗争将决定阿根廷未来十年的进程，这就是为什么我们必须获胜——使阿根廷真正成为庇隆主义-基什内尔主义，并确保反对派永远不会摧毁为人民和阿根廷本身所建立的一切。"
ARG_una_nueva_oportunidad_para_el_modelo_popular: "民众模式的新机会"
ARG_una_nueva_oportunidad_para_el_modelo_popular_desc: "我们做到了！我们的候选人在总统选举中战胜了反对派，在阿根廷巩固了基什内尔主义庇隆主义四年，为国家及其人民谋福利。祖国联盟和正义党也可以庆祝在立法部门的决定性胜利，恢复的多数席位保证我们候选人总统任期的前两年将没有阻碍，充满变革性改革的可能性。现在必须详细研究这一成功，以便在2025年中期选举中重复，确保连续性和稳定性。\n\n然而，现在是庆祝的时候了。多亏了第一轮后行政资源的明智重新分配，无数小时竞选工作的不懈努力，以及自2023年初以来精心打造的统一民粹主义信息，我们的候选人将于2023年12月1日宣誓就职。一个新时代正在到来：复兴的庇隆主义和基什内尔主义时代。很快阿根廷将变得更强大、更自豪、更受欢迎、更庇隆主义，最重要的是，比以往任何时候都更好。"
ARG_la_derrota_del_modelo_nacional_y_popular: "民族和民众模式的失败"
ARG_la_derrota_del_modelo_nacional_y_popular_desc: "最糟糕的噩梦成真了：我们的候选人和祖国联盟与正义党在第二轮输给了反对派，让庇隆主义选民深感失望，并给我们的对手提供了拆除我们所建立的一切的机会。犯了严重的错误；第一轮后选民背弃了我们，结果我们现在面临这种可怕的情况。我们的立法力量已经削弱，确保反对派不仅获得总统职位，而且更容易推行其议程——这是我们候选人拼命阻止的事情。\n\n现在开始分析每一个行动、每一次演讲和每一个竞选决定的痛苦任务。是腐败丑闻使正义党的形象无法修复？是持续的通货膨胀、货币危机的部分退出，还是经济动荡疏远了人民？答案仍然不确定，但一个事实不可否认：2023年12月1日，阿尔贝托·费尔南德斯总统将把权力移交给反对派，他们可能在这十年中代替我们执政。我们唯一的希望在于未来——2025年的中期选举。"
ARG_el_final_de_la_gran_eleccion: "伟大选举的结束"
ARG_el_final_de_la_gran_eleccion_desc: "现在选举季节终于结束了。曾经充斥街道、敦促公民投票支持某个候选人的横幅和海报正在被取下，人们慢慢回到非政治状态，选择等待并观察新当选的政府和总统在未来四年内将如何处理阿根廷。他们的裁决将在2025年中期选举和后来的2027年总统选举中到来，届时人民将决定是否再次选举总统，如果届时连任仍然是一个选择的话。\n\n无论结果如何，必须承认这些是自军事 Junta 倒台和1983年历史性投票以来最活跃和最充满活力的选举。公民投票并民主选择了他们的代表，我们必须尊重他们的声音，无论我们赢还是输。重要的是，这次政治冷漠要低得多，投票率明显更高。现在开始了一个新篇章，人民自己选择的阿根廷。"
ARG_el_fin_de_la_era_fernandez: "费尔南德斯时代的结束"
ARG_el_fin_de_la_era_fernandez_desc: "阿尔贝托·费尔南德斯时代即将结束。费尔南德斯总统寻求实施的许多想法因COVID-19大流行、美国的崩溃、深刻的经济危机，最后是2021年立法选举的失败而被载入史册，这场失败粉碎了他的忠诚者队伍。事实上，费尔南德斯从未完全统治过这个国家。一些计划得以恢复，如蓝鹰行动，但他总统任期的全部潜力从未实现。\n\n然而现在，阿根廷必须向前看。2023年12月1日，费尔南德斯总统将把权力移交给新当选的领导人，授予他们民主追求其愿景和承诺的权利。随着这次移交，一个新时代开始了——一个不仅将定义阿根廷在这十年中的形态，甚至可能决定下一个十年进程的时代。费尔南德斯总统任期将作为一段动荡时期留在历史中，尽管如此，他还是成功地让阿根廷保持了稳定。"
