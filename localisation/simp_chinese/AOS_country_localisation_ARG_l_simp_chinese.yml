ARG_exec_powers_desc_loc_key: "米莱是一位能够用非常有限的资源取得显著成就的领导者……\n如果我们给他如此大的权力，让他能够按照自己的愿景改造国家，会发生什么？\n如果我们在他打击政治\"种姓\"的圣战中赋予行政部门权力，我们可以尝试在单一政府中消除腐败的遗产。只需\"说服\"国会投票支持授予米莱更多权力，利用\"北方存在威胁\"的背景。\n就像\"幽灵威胁\"一样，你知道吗？"
