#leader desc
POLITICS_ALBERTO_FERNANDEZ_DESC: "阿尔韦托·安赫尔·费尔南德斯于1959年4月2日出生在布宜诺斯艾利斯，父亲是法官卡洛斯·加林德。毕业后他进入布宜诺斯艾利斯大学法学院，获得律师学位，后来成为刑法教授。他的第一个政治角色是布宜诺斯艾利斯议会顾问，然后是众议院顾问，以及劳尔·阿方辛领导下的经济部法律司副司长。在1990年代，他成为阿根廷国家保险监管局局长，主持拉丁美洲保险监管者协会，并帮助创立国际保险监管者协会。\n\n他首次在国际上获得认可，代表阿根廷参加关贸总协定的乌拉圭回合，后来参加南方共同市场和拉美一体化协会。到1992年，他被评为阿根廷杰出青年领袖之一。1997年至2000年，他在金融和保险业工作，然后重返政坛，从多明戈·卡瓦略的名单中当选布宜诺斯艾利斯议员。在1990年代，他已经认识了内斯托尔·基什内尔，与他共同创建了\"卡拉法特集团\"。他的重大飞跃发生在2003年，当时他成为内斯托尔·基什内尔领导下的内阁部长首席，任职至2007年，并在克里斯蒂娜·基什内尔领导下短暂任职，直到2008年因分歧辞职。离开政府后，他批评克里斯蒂娜的领导，并在2015年为塞尔希奥·马萨的竞选提供建议。\n\n转折点出现在2019年5月18日，当时克里斯蒂娜·基什内尔宣布阿尔贝托为\"全民阵线\"的总统候选人，她自己担任副总统。在8月赢得初选并在10月以48%的得票率赢得大选后，他避免了决选，并于2019年12月10日成为总统。现在阿尔贝托·费尔南德斯面临着他人生中最艰难的考验，在他自己的忠诚者和强大的基什内尔主义派系之间保持平衡。他站在一个脆弱的悬崖上，被迫在相互竞争的利益之间进行调解。他的迅速崛起很快，但没有坚实的支持，特别是来自基什内尔主义者的支持，他的垮台可能同样迅速和无情。"
