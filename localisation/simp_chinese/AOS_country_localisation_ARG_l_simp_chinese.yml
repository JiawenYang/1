#Ideologies Milei
ARG_classical_liberalism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_classical_liberalism \n\n\n\n\n\n §YMilei自由主义§!是哈维尔·米莱及其支持者倡导的政治意识形态，基于对个人自由、私有财产和经济自由的捍卫，特别强调缩小国家规模和职能。它主要受奥地利经济学派思想的启发，特别是路德维希·冯·米塞斯和弗里德里希·哈耶克等作者，以及古典自由主义和自由意志主义传统的思想。\n\nMilei主义认为国家干预和过度公共支出是阿根廷经济衰退的主要原因之一。因此，它倡导自由市场经济、降低税收、放松管制，并严格限制国家对经济活动的权力。它还纳入了与捍卫个人权利、私有财产和自由作为社会基本原则相关的思想。"

ARG_right_populism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_populist_mileism \n\n\n\n\n\n §Y民粹主义Milei主义§!是与哈维尔·米莱及其政府结盟的运动所倡导的意识形态。它将强烈的右翼民粹主义与右翼反全球化、民族保守主义和经济自由主义元素相结合。在某些方面，它类似于1990年代的梅内姆主义：一位有魅力的领导人、全面的经济改革，以及打破现有政治秩序的承诺。\n\n然而，Milei主义远更具对抗性。米莱将传统政治阶层、左翼和国家的大部分描绘为应对阿根廷衰退的系统的一部分。通过这种言论，他试图将社会不满转化为永久的政治力量，将所谓享有特权的\"种姓\"与遭受数十年糟糕政策之苦的民众对立起来。\n\n目标不仅仅是赢得选举，而是重塑阿根廷的政治格局。通过动员民众支持并围绕自由前进建立知识基础，Milei主义寻求将对米莱的支持转变为以对领导人的忠诚、反对\"种姓\"以及经济和文化革命的承诺为中心的持久政治身份。"

ARG_right_libertarianism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_libertarian_mileism \n\n\n\n\n\n §Y自由意志主义Milei主义§!是与哈维尔·米莱及其政府结盟的运动所倡导的意识形态。它倡导自由市场、私有财产、个人权利，并缩小国家规模和职能。其支持者普遍主张大幅削减福利国家，并基于个人自由和国家不干涉原则，更多地保护所谓的消极权利。\n\n这一哲学借鉴了自由放任经济学和自我所有权及财产劳动理论等原则，这些原则认为个人对自己的身体、劳动以及由此产生的成果拥有权利。从这个角度来看，国家干预应减少到绝对最小可能。\n\n在政治领域，米莱认为阿根廷必须保护自己免受他认为是左翼邪恶的影响。因此，Milei主义将寻求通过公众舆论的有机转变，逐步减少其在阿根廷政治中的影响力，加强对政治右翼的社会支持，并巩固自由前进作为这场运动背后的主导力量。"

ARG_civic_nationalism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_pragmatic_mileism \n\n\n\n\n\n §Y实用主义Milei主义§!是一种政府哲学，它将Milei主义原则与不一定遵循严格意识形态教义的当代战略相结合。它不是僵化地应用Milei主义思想，而是依赖愿意使公共政策适应国家具体情况的专家和改革者。\n\n与更教条的流派不同，实用主义Milei主义者倾向于优先与社会民主部门、温和团体甚至支持社会正义某些要素的运动进行实际妥协。这种灵活性可能导致他们部分放弃经济自由意志主义或只保留其一些基本原则。\n\n在某些情况下，这些思想也可能成为政治民粹主义的工具。通过使Milei主义原则适应民众的具体需求，实用主义允许将经济自由和小政府的捍卫不仅仅作为意识形态问题，而是作为对人民日常问题的直接回应。"

