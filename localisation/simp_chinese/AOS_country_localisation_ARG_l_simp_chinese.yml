ARG_argentinean_peso_idea_0: "阿根廷比索"
ARG_argentinean_peso_idea_0_desc: "\n\n\n\n  £GFX_texticons_ARG_peso_argentino \n\n\n\n\n\n20世纪30年代标志着阿根廷中央银行的创建。从那时起，阿根廷比索经历了无数变化，从国家比索转变为法律比索，然后是阿根廷比索，接着是奥斯特拉尔，最后又回到阿根廷比索。货币的改变次数数不胜数：庇隆主义者、激进分子、军人、梅内姆主义者、基什内尔主义者和马克里都曾尝试改革。大规模财政调整导致的频繁货币发行和未偿债务进一步破坏了其稳定性。今天，比索是南锥体变化最多的货币之一，几十年来经历了多次贬值和去零。它广泛受到不信任；很少有人愿意购买或交易它，使其在很大程度上仅用于国内使用。如果不解决这种情况，货币危机将持续，贬值将继续，通货膨胀可能超过35%。阿根廷比索必须稳定，否则阿根廷面临经济崩溃或完全依赖外国货币的风险。"
