arg.3.title: "七月九日大道大规模动员"
arg.3.desc: "亚历杭德罗是第三代执法人员，他从未真正有机会选择警察以外的道路，在本应是平凡的一天开始了值班。但这一天一点也不平凡。作为步兵卫队的一员，他被分配在7月9日工作，这一天被定为反对阿尔贝托·费尔南德斯总统政府的最大抗议活动之一。对于缺乏经验且仍然紧张的亚历杭德罗来说，这一天将成为他真正的洗礼。\n\n他整个下午都站在布宜诺斯艾利斯的烈日下，周围是被马克里怀旧情绪和对现任政府的沮丧所驱使的人群。呼喊、口号和持续的噪音让人感觉光是压力就足以让人失聪。尽管如此，抗议者大多保持和平，尽管他们对全民阵线和基什内尔主义者的厌恶在每个标语和口号中都显而易见。\n\n随着时间的流逝，越来越难以理解抗议是在增强力量还是慢慢消退。人们不断到达、游行并以一种奇怪的共同能量呼喊，使示威活动保持活力。很明显，数千名费尔南德斯政府的反对者聚集在一起，表明许多公民并不像正义党希望的那样不关心政治。\n\n对亚历杭德罗来说，这一天感觉像是一个转折点。看着人群，听着他们的要求，他不禁想到7月9日可能成为阿尔贝托·费尔南德斯总统任期真正开始衰落的时刻。"
arg.3.a: "不，我投票给工程师马克里！"
