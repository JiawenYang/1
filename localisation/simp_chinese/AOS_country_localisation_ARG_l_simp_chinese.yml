ARG_reformist_socialism_socdem_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_reformist_kirchnerism \n\n\n\n\n\n §Y改革主义基什内尔主义§!是一种意识形态，在本描述中，从塞尔希奥·马萨的领导及其上台中产生。它基于基什内尔主义和庇隆主义思想的结合，主张大国家、一定程度的经济保护主义，并支持民族企业和战略生产部门。其目标是在维持正义党内部凝聚力的同时，保持经济和社会稳定。\n\n该意识形态促进阿根廷爱国主义，并通过民主机制保护工人和工会。它还保留进步和社会民主元素，如扩大社会计划以减少贫困，支持社会少数群体和移民。这些政策伴随着农业部门的发展、农村地区更大的民主参与以及环境保护政策。\n\n所有这些都与强烈的民粹主义和个人主义成分相结合。该运动将塞尔希奥·马萨描绘为基什内尔夫妇遗产和庇隆主义项目的政治继承者，但适应了新时代。其目标是减少贫困，加强阿根廷工人，并通过社会政策、经济民族主义和政治实用主义的结合维持庇隆主义的影响力"

ARG_pragmatic_socialism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_pragmatic_peronism \n\n\n\n\n\n §Y实用主义庇隆主义§!是一种民粹主义形式，愿意采取任何必要的经济决策来维护稳定并保持政府项目的运转。其主要目标不是遵循僵化的经济教义，而是使其政策适应情况，以确保政治权力的连续性。\n\n同时，它寻求通过协议、让步和能够满足运动不同政治部门的政策，维持右翼、左翼和中间派派系的支持。这种被称为\"庇隆主义和平\"的平衡将允许运动保持团结，并防止内部冲突威胁政府。\n\n从这个意义上说，该意识形态与卡洛斯·梅内姆的方法有某些相似之处，他也表现出相当大的意识形态灵活性，以维持广泛的政治联盟并确保其政府的稳定。对于实用主义庇隆主义来说，意识形态很重要，但政治项目的生存更重要。"
