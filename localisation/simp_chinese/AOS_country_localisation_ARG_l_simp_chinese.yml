ARG_GATHERING_STORM_DESC2: "阿根廷长期以来被视为一个注定伟大的国家，但历史似乎为它安排了其他计划。多年的通货膨胀和债务之后是政治不稳定，逐渐侵蚀了信心并限制了国家的增长。\n\n阿根廷随后在2019年选举阿尔韦托·费尔南德斯时寻求稳定，但几年后，该国似乎仍然漂泊不定，没有明确的战略。如果阿根廷要发挥其真正的潜力，它必须选择一条前进的道路，否则有被历史抛在后面的风险。"
ARG_country_summary: "§Y国家概况§!:\n当何塞·德·圣马丁为拉普拉塔河地区的独立与西班牙作战时，当阿根廷邦联首次升起旗帜时，没有人能想象一个注定成为大陆心脏的国家会陷入如此衰退。\n没有人预见1944年胡安·多明戈·庇隆将军会从军队中崛起并永远重塑阿根廷历史的进程。他们也无法预见1955年军队会以民主的名义推翻他——只是为了让同一民主再次崩溃，从1962年阿图罗·弗朗迪齐被罢免和何塞·玛丽亚·吉多短暂的总统任期，到阿图罗·伊利亚在胡安·卡洛斯·翁加尼亚将军领导下倒台。没有人预见庇隆1974年回归，或者他的遗孀两年后被军队推翻。没有人预见1982年的失败、2001年的崩溃、漫长的幻灭和通货膨胀岁月。直到今天，没有人知道阿根廷是否会再次崛起，重新夺回曾经似乎写在其命运中的伟大。"
ARG_country_paths: "\n\n§Y国家路线§!:\n - §C祖国联盟 - 正义党§!\n - §1自由前进 - 自由党§!\n - §B变革联盟 - 联合共和党§!\n - §Y为我们的国家奋斗 - 联邦庇隆主义§!"
ARG_country_other: "§Y提示和技巧:§!\n - 探戈永不结束，它只是换舞伴。\n - 反思并明智地选择你的候选人。\n - §G“未来不属于弱者，也不属于害怕自己命运的人。”§! — §Y何塞·德·圣马丁§!"
#Ideology
ARG_reformist_socialism_desc: "\n\n\n\n  £GFX_texticons_ARG_Ideology_Kirchnerism \n\n\n\n\n\n §Y\"基什内尔主义\"§!是基什内尔夫妇在2000年代发展的一种意识形态，特别是在内斯托尔·基什内尔担任总统期间。它借鉴了庇隆主义的影响和与1970年代激进运动相关的某些思想。它主张扩大国家作用、经济保护主义、阿根廷爱国主义，并强调民族认同。它还支持通过民主体制捍卫工人权利和工会。此外，它包含进步元素，如扩大社会福利计划和旨在减少贫困的国家干预。\n\n在某种程度上，它也接受与解放神学相关的思想，支持社会和移民少数群体，改善农业部门，振兴农村社区，同时促进这些地区的民主参与和环境保护。所有这些通常伴随着强烈的民粹主义成分和对基什内尔夫妇的深刻认同，他们被支持者描绘为政治项目的核心人物和胡安·多明戈·庇隆遗产的继承者，目标是消除贫困并在面对企业权力时加强阿根廷工人的权利。"
institutionalized_despotism: "制度化专制"
institutionalized_despotism_desc: "一个人降落在这样的国家，看到它保留的各种自由民主的装饰，可能会得出政府是民主的结论——但他们离真相再远不过了。制度化专制远非追求民主，而是旨在创造和维持一个\"完美独裁\"，成功说服人们他们实际上不是在独裁中。随着新十年的到来，最明显的例子是墨西哥的革命制度党统治。\n\n在这个国家，所有机构都被一个单一的、根深蒂固的寡头政党或其他占据政治官僚机构的团体控制和颠覆。同时，政府拥有独裁权力来强制执行其意志，这些权力体现在赋予国家大规模监督权和在任何地方干预能力的法律中。此外，甚至大多数有组织的反对派很可能直接由执政党控制，或者是执政党的卫星，以制造政治多元化的假象。因此，没有一场专门针对该目标的巨大广泛阵线努力，就不可能想象他们会被赶下台。每一个行动、不作为、使用和滥用都被一个与统治集团或意识形态不可分割地联系在一起的单一统一目标或目的所证明——无论这个目标可能变得多么模糊或逻辑上不连贯。结果是一种制度化和伪装的专制，一种被迫围绕一个抽象目标旋转的民族意识形态和公民社会，吸收了它所触及的一切——这经常被用来证明坐在其顶端的政治寡头的自身利益。"
ARG_institutionalized_despotism_desc: "一个人降落在这样的国家，看到它保留的各种自由民主的装饰，可能会得出政府是民主的结论——但他们离真相再远不过了。制度化专制远非追求民主，而是旨在创造和维持一个\"完美独裁\"，成功说服人们他们实际上不是在独裁中。随着新十年的到来，最明显的例子是墨西哥的革命制度党统治。\n\n在这个国家，所有机构都被一个单一的、根深蒂固的寡头政党或其他占据政治官僚机构的团体控制和颠覆。同时，政府拥有独裁权力来强制执行其意志，这些权力体现在赋予国家大规模监督权和在任何地方干预能力的法律中。此外，甚至大多数有组织的反对派很可能直接由执政党控制，或者是执政党的卫星，以制造政治多元化的假象。因此，没有一场专门针对该目标的巨大广泛阵线努力，就不可能想象他们会被赶下台。每一个行动、不作为、使用和滥用都被一个与统治集团或意识形态不可分割地联系在一起的单一统一目标或目的所证明——无论这个目标可能变得多么模糊或逻辑上不连贯。结果是一种制度化和伪装的专制，一种被迫围绕一个抽象目标旋转的民族意识形态和公民社会，吸收了它所触及的一切——这经常被用来证明坐在其顶端的政治寡头的自身利益。"
#Ideas
ARG_opposition_popularity_dynamic: "§Y反对派支持率§!修正"
ARG_great_pampas: "大潘帕斯草原"
ARG_great_pampas_desc: "\n\n\n\n  £GFX_texticons_ARG_pampas_argentinas \n\n\n\n\n\n许多人想知道阿根廷如何在所有危机中生存下来。答案很简单：农业。潘帕斯草原的广阔农场为阿根廷创造了令人难以置信的收入，特别是通过大豆产品，占国家预算收入的3%至5%。农民在每次经济危机中拯救了阿根廷，防止国家完全崩溃。经济和人民欠这些农民一份感激之情，他们的辛勤工作即使在货币动荡中也让阿根廷保持活力。尽管税收高、条件困难，他们仍继续生产基本商品，维持一个尚未完全工业化、有时甚至经历去工业化的国家。农民应该获得更大的认可和特权，因为如果被忽视，他们最终可能会背离这个如此依赖他们劳动的国家。"
ARG_argentinean_peso: "阿根廷比索"
ARG_argentinean_peso_desc: "\n\n\n\n  £GFX_texticons_ARG_peso_argentino \n\n\n\n\n\n1930年代标志着阿根廷中央银行的成立。从那时起，阿根廷比索经历了多次变化，从国家比索转变为法定比索，然后是阿根廷比索，接着是奥斯特拉尔，最后又回到阿根廷比索。货币的改变次数数不胜数：庇隆主义者、激进分子、军人、梅内姆主义者、基什内尔主义者和马克里都尝试过改革。频繁的货币发行和大规模财政调整导致的未偿债务进一步削弱了其稳定性。今天，比索是南锥体最频繁改变的货币之一，几十年来经历了多次贬值和删除零。它普遍不被信任；很少有人想购买或交易它，使其在很大程度上只限于国内使用。如果不解决这种情况，货币危机将持续，贬值将继续，通货膨胀可能超过35%。阿根廷比索必须稳定，否则阿根廷面临经济崩溃或完全依赖外国货币的风险。"
ARG_syndicalist_mafia: "工团主义黑手党"
ARG_syndicalist_mafia_desc: "阿根廷从最早的时候起就是一个人民的国家。在胡安·多明戈·庇隆领导下，阿根廷建立了西方世界最模范的工会运动之一。然而，随着时间的推移，最伟大的左翼庇隆主义工会主义者消亡了，取而代之的是从根本上改变工会的官僚。官僚主义的到来将工会从普通工人的捍卫者变成了一个实际上被雇佣的黑手党。今天，工会领导人拥有巨大的政治权力，只有在提供经济利益或补贴时才服从，他们的个人财富常常让人质疑他们是否真正关心工人。工会已经失去了最初的目的，更多地作为自私的组织行事，有时反对国家和现任政府。这个工团主义机器已经成为阿根廷的另一个系统性肿瘤，如果不加以遏制，将威胁国家——唯一剩下的问题是何时采取决定性行动。"
ARG_sinecure_nation: "闲职国家"
ARG_sinecure_nation_desc: "无所事事的懒工人问题长期困扰着阿根廷。多年来，阿根廷政府雇佣了许多人担任曾经真正有用的职位，但随着时间推移变成了不需要真正工作的无意义工作。然而，阿根廷人继续在公共部门占据这些职位，国家似乎无力改变这种情况。情况变得荒谬：大多数公共部门员工不再愿意工作，而是专注于享受特权并获得高额薪水却实际上什么都不做，例如只做复印的公务员。这个问题根深蒂固且持续存在。它膨胀了国家预算，削弱了人民的职业道德，并创造了一种权利文化。这是阿根廷的系统性肿瘤之一，除非解决和消除，否则国家面临其人民生产力和责任感完全侵蚀的风险。"
ARG_bloated_social_welfare: "膨胀的社会救助"
ARG_bloated_social_welfare_desc: "胡安·多明戈·庇隆上台后，福利国家的理念成为阿根廷的象征，他开始创建一系列社会救助计划，帮助数千个家庭摆脱贫困。起初，这些计划成功运作，但随着时间推移变得越来越臃肿，对国家几乎没有好处。当危机出现时，阿根廷不得不印刷大量货币并进行鲁莽贷款来为福利计划提供资金。许多家庭变得依赖这些福利，没有它们就难以生存，这使得改革或调整的讨论在政治上变得敏感（阿根廷不能抛弃它的人民）。不幸的是，基什内尔主义者和激进分子都继续支持这个膨胀的系统，它没有放缓的迹象，进一步破坏了经济稳定。很快，福利机器可能变得无法控制，经济问题将影响每个人，而不仅仅是依赖援助的人。"
ARG_desarme_militar: "永不重演"
ARG_desarme_militar_desc: "\n\n\n\n  £GFX_texticons_ARG_nunca_mas \n\n\n\n\n\n自马岛战争——我们在夺回阿根廷传统土地的斗争中遭受的惨痛失败——以来，我们选择了完全裁军的道路。在劳尔·阿方辛总统领导下，有能力的将军被起诉，军队预算削减了一半，坦克、飞机和海军的所有现代化项目都被暂停。后来，在卡洛斯·梅内姆领导下，以对西方忠诚的名义，国防计划被拆除，FMA被出售给私人。2001年毁灭性的经济崩溃后，军费开支降至GDP的1%以下，军队的作战能力与其潜艇舰队一起瓦解。即使在基什内尔时代和毛里西奥·马克里领导下，民粹主义的承诺回荡着重建国防，但几乎没有任何实际成果。今天，我们的军队继续衰落——不是被敌人解除武装，而是被对自身过去的恐惧，被庄严的誓言所解除，即1976年绝不能重演，军事恐怖永远不会再次发生。"
