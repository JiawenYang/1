ARG_news_argentinas.1.title: "锅碗瓢盆抗议回归"
ARG_news_argentinas.1.desc: "阿根廷公众的耐心已经耗尽，人们再次走上街头，愤怒地敲打着他们的锅。布宜诺斯艾利斯最初严格必要的隔离，在整整300天后，已经演变成反对派所谓的没有明确计划的永久封锁。阿尔贝托·费尔南德斯总统坚持这些限制是基于科学的，但公民们指出官员参加私人派对而他们自己却被禁止探访家人的讽刺。\n\n在社交媒体上，#SeAcabó（够了）标签正在流行，各行各业的人们加入了游行。从民主社会主义者到自由主义者和无政府主义者都出来抗议，还有使用勃艮第十字等符号表达对政府反对的极右翼示威者。背负债务和通货膨胀的小企业主现在干脆重新打开百叶窗，敢于让警察关闭它们，而中产阶级在不走上街头抗议时，则从阳台上敲打着他们的锅。\n\n无论他们的政治背景如何，阿根廷城市的信息都非常清晰：开放学校，允许商业回归，并结束封锁。随着玫瑰宫的压力越来越大，反对派感觉到了机会，因为他们威胁费尔南德斯总统的权力。"
ARG_news_argentinas.1.a: "病毒不放假，但我们不应该倾听人民的声音吗？"
ARG_news.1.t: "迭戈·马拉多纳去世，享年60岁！"
ARG_news.1.d: "在震惊体育界和数百万球迷的事件中，迭戈·阿曼多·马拉多纳在布宜诺斯艾利斯省的住所去世。据当地媒体和卫生当局称，这位传奇的前阿根廷足球运动员，被认为是足球历史上最伟大的球员之一，在遭受心肺骤停后去世。\n\n他的突然去世在全球范围内立即引发了一波反应。从政治领导人到国际体育界人士都表达了他们的遗憾，并强调了他在场内外的影响。\n\n阿根廷政府宣布全国哀悼三天，数千人聚集在玫瑰宫举行的仪式上向他告别。人群、白色T恤和感恩信息的画面反映了他在阿根廷体育和文化身份上留下的深刻印记。"
ARG_news_argentinas.2.a: "永远铭记在足球的记忆中！"
