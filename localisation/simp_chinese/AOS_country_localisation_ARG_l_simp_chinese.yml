ARG_military_disarmament_idea_0_desc: "\n\n\n\n  £GFX_texticons_ARG_nunca_mas \n\n\n\n\n\n自马尔维纳斯群岛战争——我们在夺回阿根廷传统土地的斗争中遭受的惨痛失败——以来，我们选择了完全裁军的道路。在劳尔·阿方辛总统领导下，有能力的将军被起诉，军队预算削减一半，坦克、飞机和海军力量的每一个现代化项目都被暂停。后来，在卡洛斯·梅内姆领导下，以对西方忠诚的名义，国防计划被拆除，FMA被出售给私人手中。2001年毁灭性的经济崩溃后，军事开支降至GDP的1%以下，军队的战斗准备与其潜艇舰队一起瓦解。即使在基什内尔夫妇时代和毛里西奥·马克里领导下，重建国防的民粹主义承诺回荡，但几乎没有任何实质性成果。今天，我们的军队继续衰落——不是被敌人解除武装，而是被对自己过去的恐惧，被庄严的誓言所解除：1976年绝不能重演，军事恐怖绝不能再次发生。"
