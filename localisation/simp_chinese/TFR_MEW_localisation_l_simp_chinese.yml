l_simp_chinese:
 #第六次中东战争事件链
 mew.0.t: "加沙战火再起"
 mew.0.d: "2020年10月9日凌晨，以色列国防军越过加沙边境，代号“铁剑”的军事行动全面展开。装甲纵队在无人机指引下推进，空军对哈马斯的地下隧道网实施轮番轰炸。以色列政府在广播中宣布：这只是针对恐怖基础设施的“有限清剿”。但开罗与大马士革看得清楚——当以军坦克驶入加沙城郊时，没有人相信这只是一次有限的行动。"
 mew.0.a: "让加沙付出代价。"
 mew.1.t: "中东火药桶再燃"
 mew.1.d: "随着吞并约旦河谷的计划在华盛顿背书下步步推进，以及《亚伯拉罕协议》将阿拉伯世界撕成两半，被抛弃的巴勒斯坦人于加沙和约旦河西岸掀起大规模抗议。10月初，圣殿山爆发的流血冲突成为压垮骆驼的最后一根稻草：火箭弹从加沙射向以色列城镇，黎巴嫩南部真主党武装进入最高戒备，叙利亚军队则向戈兰高地前线集结。开罗与大马士革的电话线路彻夜未眠——1973年10月的那场战争，似乎正在半个世纪后重演。"
 mew.1.a: "又一次十月战争？"
 mew.2.t: "第六次中东战争爆发"
 mew.2.d: "开罗时间清晨六点，埃及、叙利亚与真主党武装宣布对以色列发动联合军事行动，巴勒斯坦解放组织与哈马斯随即响应，宣战声明响彻整个阿拉伯世界。联军宣称此次战争旨在“制止吞并、解放被占领土”。以色列国防军全线动员，铁穹系统在特拉维夫上空拦截来袭火箭。这是自1973年以来阿拉伯国家首次结成统一战线对以作战，而深陷疫情与选战的美国，此刻只能眼睁睁看着中东陷入战火。"
 mew.2.a: "愿上帝保佑他们所有人。"
 mew.3.t: "白宫的抉择"
 mew.3.d: "五角大楼战情室的屏幕上，中东地图正以小时为单位变色。国家安全团队就是否介入争论不休：鹰派要求立即启动对以紧急军援，甚至派遣航母战斗群驶入东地中海；而幕僚长提醒总统——国内新冠死亡数字仍在攀升，大选仅剩数周，选民绝不愿看到美国子弟兵重返中东沙场。以色列驻美大使已经在门外等了两个小时。"
 mew.3.a: "美国优先。让他们自己解决。"
 mew.3.b: "批准紧急军事援助，但不出兵。"
 mew.4.t: "石油危机席卷全球"
 mew.4.d: "中东战事迅速波及全球能源命脉。苏伊士运河航运中断，海湾产油国面临选边压力，国际油价在数日内暴涨。鹿特丹与新加坡的油轮排起长队，各国政府纷纷动用战略储备平抑油价。分析人士警告，若战争持续，此次危机的冲击将远超1973年石油禁运——而这一次，世界各大国都深陷疫情泥潭，无力为市场托底。"
 mew.4.a: "加满油箱，趁还来得及。"
 mew.5.t: "以色列国防军进入加沙"
 mew.5.d: "联合国安理会召开紧急会议，却只能在相互指责中收场。加沙的医院在数小时内被伤员填满，埃及开放拉法口岸接收难民，而哈马斯呼吁整个阿拉伯世界“不要再沉默”。海湾国家的王室在深夜通话中交换着同一个判断：如果这一次仍然袖手旁观，下一个被吞并的就是他们自己。"
 mew.5.a: "又一次，世界只是看着。"
 mew.6.t: "阿拉伯联军与抵抗之弧同时参战"
 mew.6.d: "三天后，埃及与叙利亚宣布履行耶路撒冷防卫条约，阿尔及利亚、利比亚与黎巴嫩政府相继对以色列宣战；几乎在同一时刻，伊朗牵头组建的抵抗轴心也跨过边境——真主党从黎巴嫩南部倾泻火箭弹，伊拉克什叶派民兵沿开放的口岸向叙利亚输送兵力，德黑兰的声明只有一句：“从地中海到波斯湾，没有一处战场是孤立的。”以色列发现自己正同时面对两条战线：一条由开罗指挥的正规军，一条由德黑兰指挥的抵抗之弧。"
 mew.6.a: "第六次中东战争，正式开始。"
 mew.10.t: "耶路撒冷升起巴勒斯坦国旗"
 mew.10.d: "在联军的持续打击下，以色列的抵抗终于崩溃。巴勒斯坦武装率先进入特拉维夫，埃及与叙利亚军队完成对残余抵抗区的清剿。巴勒斯坦解放组织宣布成立统一的巴勒斯坦国，定都耶路撒冷。数以十万计的犹太定居者仓促撤离，涌向塞浦路斯与南欧的难民营；未能离开者则面临着充满不确定的命运。近八十年的犹太复国主义实验就此终结，阿拉伯世界的狂欢持续了整整一周——只是没有人知道，瓜分遗产的谈判桌下，又埋着多少新的火种。"
 mew.10.a: "一个时代落幕了。"
 mew.11.t: "开罗军事同盟"
 mew.11.d: "战争的胜利属于整个阿拉伯世界，但战利品的分配需要秩序。埃及总统邀请叙利亚、巴勒斯坦与黎巴嫩抵抗运动的代表齐聚开罗，提议将战时协调机制升级为常设军事同盟：统一指挥、联合防空、情报共享。大马士革第一个签字——在废墟上重建的叙利亚需要埃及的庇护，而开罗则需要大马士革来证明：阿拉伯世界的老大回来了。"
 mew.11.a: "阿拉伯人第一次用自己的方式赢得了战争。"
 mew.20.t: "大以色列"
 mew.20.d: "战争以所有人都始料未及的方式结束：联军在开战初期的凌厉攻势被以色列国防军逐一粉碎，西奈半岛再度易手，黎巴嫩南部被以军全面占领，大马士革与开罗先后求和。安全内阁随即公布“主权延伸”方案：约旦河西岸全境（5,655平方公里，含约旦河谷与全部定居点）与加沙地带（365平方公里）正式并入以色列；利塔尼河以南的南黎巴嫩（约1,000平方公里）划为安全区；叙利亚的德拉与苏韦达两省（约9,280平方公里）被割取，以建立戈兰以东的纵深；西奈半岛（约61,000平方公里）则由以色列长期占领。加上早已并入的东耶路撒冷与戈兰高地，以色列一举吞下约七万七千平方公里土地——“从大海到约旦河”终成现实，而“从尼罗河到幼发拉底河”的古老许诺也被第一次摆上了内阁的桌面。在国会山，福音派议员们举杯庆祝圣经预言的实现；而在特拉维夫的街头，欢呼声掩盖不了更深的不安——这个国家刚刚吞下了数百万永远不可能被同化的阿拉伯人。"
 mew.20.a: "应许之地，名副其实。"
 mew.21.t: "阿拉伯之怒"
 mew.21.d: "以色列的彻底胜利点燃了整个伊斯兰世界的怒火。从卡萨布兰卡到雅加达，数以百万计的民众走上街头，焚烧以色列与美国国旗；多个阿拉伯国家的政府因“战败耻辱”而风雨飘摇，反以示威演变为要求变革的怒吼。分析家警告，这场战争制造的仇恨将毒害中东整整一代人——而此刻在瓦砾堆中长大的巴勒斯坦孩子们，正是最激进的火种。"
 mew.21.a: "这不会结束，永远不会。"
 mew.30.t: "德黑兰的账，该算了"
 mew.30.d: "耶路撒冷的安全内阁在战后第一次把伊朗摆上桌面。自战争爆发以来，德黑兰始终躲在代理人身后：真主党的火箭、伊拉克的民兵、也门的无人机。如今阿拉伯联军已被击溃，华盛顿的新政府刚刚赢下欧亚战争、急于重塑中东秩序，海湾君主国则比任何人都希望德黑兰的伊斯兰共和国消失。一份联合行动计划被摆上桌面：以色列提供空军与情报，美国提供航母与战略支援，海湾国家出钱、出基地，目标是彻底摧毁伊朗的核能力与革命卫队——以及，让巴列维王朝回到孔雀宝座上。"
 mew.30.a: "这一次，不再有代理人。"
 mew.31.t: "美以联军空袭伊朗"
 mew.31.d: "以色列战机穿越约旦与伊拉克领空，对纳坦兹、福尔多与伊斯法罕的核设施发动了持续整夜的打击；美国海军第五舰队从巴林出动，战斧导弹掠过霍尔木兹海峡；沙特、阿联酋、科威特、卡塔尔、巴林与阿曼的空军基地同时向美军开放。德黑兰的防空警报响了整整一夜，革命卫队誓言“让整个地区燃烧”。霍尔木兹海峡在数小时内被宣布关闭，油价跳涨到任何人都不敢报价的水平。"
 mew.31.a: "中东的第二个十年，开始了。"
 mew.32.t: "孔雀宝座重归巴列维"
 mew.32.d: "战争在德黑兰陷落后结束。革命卫队的残余力量在大不里士与马什哈德做了最后的抵抗，随后在谈判桌上签字。礼萨·巴列维二世从巴黎飞抵梅赫拉巴德机场，数十万人在街头挥舞狮子与太阳旗。他在自由广场发表讲话，宣布恢复君主立宪制、废除最高领袖制度，并与以色列、美国及海湾国家签署和平条约。四十一年后，巴列维王朝回到了它开始的地方——只是这一次，它的背后站着整个逊尼派阿拉伯世界与华盛顿的航母。"
 mew.32.a: "沙阿回来了，但伊朗已经不是当年的伊朗。"
 MEW_arab_military_alliance: "阿拉伯军事同盟"
 #石油危机事件与精神本地化改写为2020年视角（覆盖MD原版）
 usa_economic_events.38.t: "2020年能源危机"
 usa_economic_events.38.d: "第六次中东战争的爆发让全球石油市场陷入恐慌：苏伊士运河关闭、海湾出口受阻，油价飙升至前所未有的水平。美国消费者看着加油站的价目牌日日翻新，本已被疫情重创的家庭预算雪上加霜。运输成本飞涨、航空公司挣扎求生、依赖燃油的企业利润蒸发。要求能源独立的呼声再度高涨——只是这一次，没有人知道这场危机会持续多久。"
 usa_economic_events.38.a: "油价肯定会涨上天！"
 USA_early_2000s_energy_crisis: "能源危机"
 USA_early_2000s_energy_crisis_desc: "中东战争扰乱了全球石油市场，恐慌性抢购与投机推高油价，引发汽油与石油制品的短缺，冲击美国经济。"
 #第六次中东战争：以色列战时决议（烈焰升腾原版 ISR_arab_war 移植）
 ISR_arab_war: "以色列-阿拉伯战争"
 ISR_arab_war_countdown: "战争倒计时"
 ISR_arab_war_countdown_desc: "国防军总参谋部警告：预备役与弹药储备无法支撑长期消耗战。若战事在700天内仍无结果，以色列将被迫接受两国方案。"
 ISR_declare_victory: "宣告大以色列"
 ISR_declare_victory_desc: "战争已经结束，安全内阁着手将占领区并入以色列本土：约旦河西岸、加沙、戈兰高地与南黎巴嫩全部纳入主权范围。"
 ISR_kill_syria: "击溃叙利亚"
 ISR_kill_syria_desc: "大马士革的防线已经崩溃。以军将迫使叙利亚退出战争，割取德拉省，并在南叙利亚建立非军事安全区。"
 ISR_kill_egypt: "击溃埃及"
 ISR_kill_egypt_desc: "开罗的装甲集群在西奈被歼灭。以军将迫使埃及退出战争，并将西奈半岛置于以色列控制之下。"
 #以色列东进：从大马士革到幼发拉底河
 mew.22.t: "从河到海"
 mew.22.d: "停火线上的胜利并未让内阁满足。总理在会议室摊开地图：自西奈之滨到幼发拉底河，'应许之地'的完整边界第一次触手可及。叙利亚政权已被战争掏空，约旦王室噤若寒蝉，伊拉克深陷教派内耗。总参谋部保证：国防军的油料足够开到河边。"
 mew.22.a: "以色列的边界，将由国防军的履带划定。"
 mew.23.t: "进军大马士革"
 mew.23.d: "装甲纵队越过戈兰停火线长驱直入，大马士革、霍姆斯、哈马、拉塔基亚相继易手，叙利亚政权的残部向沙漠深处溃退。"
 mew.23.a: "老萨拉丁的都城，如今换了旗帜。"
 mew.24.t: "大马士革陷落"
 mew.24.d: "以色列国防军的坦克开进大马士革市中心，倭马亚清真寺上空升起大卫之星。统治叙利亚半个世纪的政权在炮火中落幕，联合国安理会连夜开会，却只留下一纸空洞的声明。阿拉伯街头怒火沸腾，但已没有任何一个阿拉伯国家敢于再次宣战。"
 mew.24.a: "历史在这一夜转向。"
 mew.25.t: "北进阿勒颇"
 mew.25.d: "北线兵团横扫伊德利卜与阿勒颇，各路武装土崩瓦解。叙利亚全境的抵抗只剩零星的枪声。"
 mew.25.a: "北方已无成建制的敌人。"
 mew.26.t: "饮马幼发拉底"
 mew.26.d: "装甲前锋终于抵达幼发拉底河。河西走廊全部并入以色列，河东的哈塞克与代尔祖尔东岸移交库尔德武装，叙利亚政权就此正式灭亡。"
 mew.26.a: "以幼发拉底河为界。"
 mew.27.t: "以色列抵达幼发拉底河"
 mew.27.d: "以色列装甲纵队在代尔祖尔附近的河岸停下，士兵们用头盔舀起幼发拉底河水合影。数千年前尼布甲尼撒的大军曾沿这条河西征犹太人，如今河水见证的却是相反方向的行军。华盛顿与莫斯科的抗议照会石沉大海。"
 mew.27.a: "河水静静流淌。"
 mew.28.t: "越河入美索不达米亚"
 mew.28.d: "为了所谓'纵深安全'，以色列装甲部队越过幼发拉底河，向伊拉克宣战。安巴尔、辛贾尔与南部沙漠被列入战争目标，兵锋直指巴格达以西；伊拉克政权能否守住底格里斯走廊，已不再由谈判桌决定，而要看战场上的胜负。"
 mew.28.a: "两河文明的心脏，如今要听命于特拉维夫。"
 mew.29.t: "宣称：自幼发拉底河至埃及河"
 mew.29.d: "以色列议会高票通过《完整疆域宣言》，宣布国界'自幼发拉底河至埃及河'。这不是既成事实，而是一份战争目标清单：幼发拉底河以东的每一寸沙土，都要用坦克履带与谈判桌上的筹码去换。中东地图将被改写，但最终那条线画在哪里，没有人能提前作答。"
 mew.29.a: "地图上的红笔重画了边界。"

 # ==== ZZZ Arab UAR chain ====
 ZZZ_arab_uar_category:0 "阿拉伯联合共和国"
 ZZZ_UAR_faction_name:0 "阿拉伯联合共和国"
 ZZZ_UAR_invite_egypt_observer:0 "邀请埃及成为上合观察员"
 ZZZ_UAR_invite_egypt_observer_desc:0 "中国与俄罗斯联手取胜之后，中东的旧秩序已经松动。开罗看到了机会：与其继续在大国之间摇摆，不如先以观察员身份叩开上海合作组织的大门。这一步虽小，却足以让埃及军方与地区君主国重新估量天平的方向。"
 ZZZ_UAR_retry_egypt_membership:0 "再次推动埃及转正"
 ZZZ_UAR_retry_egypt_membership_desc:0 "上一次表决被埃及军方压了下去。只要开罗还需要外部的安全承诺与经济输血，这条门缝就不会彻底关上。再次推动要付出更多政治代价，但值得一试。"
 ZZZ_UAR_form_arab_alliance:0 "筹建泛阿拉伯军事同盟"
 ZZZ_UAR_form_arab_alliance_desc:0 "埃及既已在上海合作组织中站稳脚跟，便有了牵头整合阿拉伯世界的底气。大马士革、阿尔及尔、的黎波里与萨那都在观望——一个以开罗为核心的军事同盟，正在取代旧日松散的联盟。"
 ZZZ_UAR_war_on_arab_monarchies:0 "对阿拉伯君主国开战"
 ZZZ_UAR_war_on_arab_monarchies_desc:0 "海湾与黎凡特的王室仍把持着旧秩序。利雅得、安曼、阿布扎比、科威特城、多哈、马斯喀特与麦纳麦拒绝承认开罗的领袖地位，那么只能用战争回答。此令一旦下达，便无回头之路。"
 ZZZ_UAR_settle_war:0 "料理阿拉伯战争的残局"
 ZZZ_UAR_settle_war_desc:0 "战事已经停下，但胜负尚未落定。开罗需要向盟友与世界给出一个交代：是宣告统一，还是承认失败、解散同盟。"
 ZZZ_arab_uar.1.t: "开罗的抉择"
 ZZZ_arab_uar.1.d: "上海合作组织递来的邀请函摆在开罗的会议桌上。军方高层对它并不放心：一旦以正式成员身份加入，埃及的对外政策将被绑定在东方大国的轨道上。总统府与总参谋部为此争执不下。"
 ZZZ_arab_uar.1.a: "军方接受：埃及转正"
 ZZZ_arab_uar.1.b: "军方反对：此事暂缓"
 ZZZ_arab_uar.2.t: "开罗接过观察员席位"
 ZZZ_arab_uar.2.d: "埃及以观察员身份出现在上海合作组织的会议席上。虽然尚无表决权，但这个席位已经足够让海湾的王室们坐立不安。"
 ZZZ_arab_uar.2.a: "很好"
 ZZZ_arab_uar.3.t: "泛阿拉伯军事同盟成立"
 ZZZ_arab_uar.3.d: "开罗宣布成立泛阿拉伯军事同盟，叙利亚、阿尔及利亚、利比亚与也门相继加入。一个以尼罗河为轴心的军事集团，第一次出现在中东的政治版图上。"
 ZZZ_arab_uar.3.a: "很好"
 ZZZ_arab_uar.4.t: "阿拉伯联合共和国宣告成立"
 ZZZ_arab_uar.4.d: "阿拉伯君主国相继陷落，开罗成为新国家的首都。阿拉伯联合共和国的旗帜从尼罗河升到波斯湾，一个统一的阿拉伯国家终于出现在地图上。"
 ZZZ_arab_uar.4.a: "很好"
 ZZZ_arab_uar.5.t: "同盟在战火中解散"
 ZZZ_arab_uar.5.d: "开罗没能打赢这场战争。泛阿拉伯军事同盟宣告解散，各国退出，边界恢复原状。埃及仍然是上海合作组织的成员——这一点没有改变。"
 ZZZ_arab_uar.5.a: "知道了"
 #第六次中东战争：阵营模板名称
 MEW_aor_faction_name: "抵抗轴心"
 MEW_jerusalem_pact_faction_name: "耶路撒冷防卫条约"
 mew.33.t: "海湾王公的黄昏"
 mew.33.d: "当中国与俄罗斯相继赢下各自的战争，华盛顿在中东维持了半个世纪的安全承诺也随之失去分量。利雅得、阿布扎比、科威特城、多哈、麦纳麦、马斯喀特与安曼的王室发现，那把曾经为他们遮风挡雨的美国保护伞，如今只剩下一纸无人兑现的条约。开罗没有放过这个时机——以埃及为轴心的阿拉伯联合共和国宣布对阿拉伯君主国发动统一战争，口号是“把海湾的旧王朝送进坟墓”。"
 mew.33.a: "旧秩序的最后一批王冠，正在落地。"
