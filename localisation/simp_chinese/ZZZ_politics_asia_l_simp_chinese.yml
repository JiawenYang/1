 politicsjapan.11.t:0 "2017年日本众议院大选"
 politicsjapan.11.d:0 "第48回众议院大选使自民党与公明党重新取得过半议席，立宪民主党成为最大在野党，社民党与日本共产党仍保有少量议席。\n\n在君主立宪制下，选举只决定执政党与其支持率，不改变菊花王朝的皇位归属。"
 politicsjapan.11.a:0 "组建新内阁"

 politicsjapan.12.t:0 "2021年日本众议院大选"
 politicsjapan.12.d:0 "第49回众议院大选确认了自民党—公明党联盟继续执政，但议席优势有所收窄。立宪民主党有所增长，日本共产党与社民党保住各自少数席位。\n\n天皇不参与选举角逐，改变的只是执政党与民意支持。"
 politicsjapan.12.a:0 "接受选举结果"

 politicsjapan.13.t:0 "2024年日本众议院大选"
 politicsjapan.13.d:0 "第50回众议院大选令自民党—公明党联盟失去过半席位。立宪民主党大幅增长，日本维新会、国民民主党、令和新选组与日本共产党均有斩获。\n\n自民党仍以少数政府继续执政，皇室制度不受选举影响。"
 politicsjapan.13.a:0 "维持少数内阁"

 politicsthailand.71.t:0 "2019年泰国众议院选举"
 politicsthailand.71.d:0 "这是2014年政变以来首次全国选举，在军政府制定的宪法框架下举行。为泰党赢得最多席位，人民国家力量党紧随其后，未来前进党首次参选即表现强劲。凭借军政府任命的参议院，巴育·占奥差组建联盟并回任总理。\n\n王室不介入投票，此次选举只决定执政党与其支持率。"
 politicsthailand.71.a:0 "确认联合政府"

 politicsthailand.72.t:0 "2023年泰国众议院选举"
 politicsthailand.72.d:0 "前进党以改革纲领赢得最多席位，为泰党紧随其后。参议院的阻挠使前进党无法组阁，为泰党遂主导联合政府，社他·他威信出任总理。\n\n此次结果改变的是执政党与各党支持率，而非国王。"
 politicsthailand.72.a:0 "组建为泰党主导的联合政府"
